    # 22.6 Effective Review Culture


    All forms of reviews are social processes; hence, they become corporate culture
    considerations. In addition, reviews can be quite stressful, and this also requires
    social considerations. Reviews are a group activity, so group size becomes a question.
    In general, technical inspection teams should have from six to members. Fewer
    members may be necessary in small development organizations.


    Part of an effective corporate culture is that reviews must be seen as valuable
    activities by both management and technical people. Reviews must be formally budgeted
    time for all the activities described in Section 22.5. Human factors are important.
    Long reviews are seldom effective—psychologists know the attention span of most
    adults is about 12 minutes. Consider what effect this can have on a 2-hour meeting.
    Most review meetings should be in the 60-90 minute range, with shorter meetings
    preferred. Furthermore, review meetings should be viewed as important, and interruptions
    should not be tolerated.( ( includes cell phones!)


    The best time to have a review meeting? About an hour after the normal start of
    the workday. This allows team members to take care of little things that otherwise
    might be distractions. The worst time? Just lunch, or maybe beginning at 3:00
    on a Friday afternoon.


    # 22.6.1 Etiquette


    To reduce the stress that accompany a review, the following points of review etiquette
    should be observed:


    +   1. Be prepared. Otherwise, the review effectiveness will be diminished. In
    a sense, an unprepared team member is respecting the review team.

    2. Be respectful. Review the product, not the producer.

    3. Avoid discussions of style.

    4. Provide minor comments (e.g., spelling corrections) to the producer at the
    end of the meeting.

    5. Be constructive. Reviews are not the place for personal criticism, nor for
    praise.

    6. Remain focused. Identify issues; do not resolve them. Careful thought went
    into selection of the review team.

    7. Participate, but do not dominate the discussion.

    8. Be open. All review information should be widely available to the full organization.


    # 22.6.2 Management Participation in Review Meetings


    Many organizations struggle with the question of management participation in reviews.
    Generally, this is a bad idea. Management presence in a review creates additional
    stress on all members, but in particular, on the producer. If management participation
    is common, the whole process can easily degenerate into unspoken agreements among
    the technical staff (I won''t make you bad if you don''t make me bad). Another
    possible consequence is that management might not want negative results to be
    public—clearly a conflict of interest. How credible might a management person
    be as a reviewer? Willing to do the normal preparation? Capable of doing the


