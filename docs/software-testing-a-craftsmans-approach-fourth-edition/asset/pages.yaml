  md: '# Chapter 22


    # Software Technical Reviews


    > "A stitch in time saves nine."


    Francis Baily, 1797


    Conventional wisdom echoes the English astronomer Baily in many aspects of daily
    life, from changes in a car to preventive software maintenance. In so many ways,
    we all depend on forms of reviews—surgical second opinions, movie and restaurant
    reviews, home safety inspections, Federal Aviation Authority aircraft inspections,
    and so on (add your favorites).


    Software technical reviews are a form of testing? The generally accepted answer
    is considered "yes." This is amplified by the chapters on software reviews in
    the International Software Testing Certification Board (ISTQB) Foundation and
    Advanced Level Syllabi (ISTQB 2007, 2012). Software testing seeks to identify
    faults by causing failures, as discussed in Chapter 1. Software reviews tries
    to identify faults (not software failures), but an identified fault typically
    morphs into fault code, when executed, causes a failure.


    Much of the material in this chapter is based on experience in the development
    of telephone switching system software. These applications could have a 30-year
    serviceable lifetime; however, software maintenance could last that long. In self-defense,
    that organization refined its review process over 15 years, resulting in "industrial-strength
    technical inspections." The industrial strength refers to a process that was gradually
    refined, and contains several subtle checks and balances.


    It is helpful to understand software reviews as a critical evaluation of a work
    product, performed by people who are technically competent. A software review
    is, or should be, a scheduled, budgeted development activity with formal entry
    and exit criteria.


    # 22.1 Economics of Software Reviews


    Many development organizations are reluctant to institute software reviews, mostly
    because of a shortsighted view of cost preparation. As far back as 1981, Barry
    Boehm dispelled this notion with his graph of fault resolution costs as a function
    of when they are discovered (see Figure 22.1)'
