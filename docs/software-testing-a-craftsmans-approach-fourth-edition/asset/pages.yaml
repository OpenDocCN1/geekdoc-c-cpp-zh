    3. If no pair of sides is equal, the output is Scalene.

    4. If any of conditions c4, c5, and c6 is not met, the output is NotTriangle.


    # 2.2.2 Discussion


    Perhaps one of the reasons for the longevity of this example is that it contains
    clear but complex logic. It typifies some of the incomplete definitions that impair
    communication among developers, and testers. The first specification assumes developers
    know some details about triangles, particularly the triangle inequality: the sum
    of any pair of sides must be strictly greater than the third side. The upper limit
    of 200 is arbitrary and convenient; it will be used when we develop boundary test
    cases in Chapter 5.


