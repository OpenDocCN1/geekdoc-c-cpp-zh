    both parties gradually identify point input events. This very likely an iterative
    process, in which use cases provoke the recognition of port input events, and
    they, suggest additional use cases. These are kept in an incidence showing which
    use cases require which port input events. As the process continues, both parties
    reach a point where the existing set of input events is sufficient for new use
    case. Once point is reached, it is clear that a minimal set of use cases covers
