  md: '# Chapter 6


    # Equivalence Class Testing


    The use of equivalence classes as the basis for functional testing has two motivations:
    we would like to have a sense of complete testing, and, at the same time, we would
    hope to avoid redundancy. Neither of these hopes is realized by boundary value
    testing—looking at the tables of test cases, it is easy to see massive redundancy,
    and looking more closely, serious gaps exist. Equivalence class testing echoes
    the two deciding factors of boundary value testing, robustness and the single/multiple
    fault assumption. This chapter presents the traditional view of equivalence class
    testing, the single versus multiple fault assumption yields the weak/strong distinction
    and the focus on invalid data yields a second distinction: normal versus robust.
    Taken together, these two assumptions result in Weak Normal, Strong Normal, Weak
    Robust, and Strong Robust Equivalence Class testing.


    Two problems occur with robust forms. The first is that, when, the specification
    does not define what the expected output for an invalid input should be. (We could
    argue that this is a deficiency of the specification, but that does not get us
    anywhere.) Thus, testers spend a lot of time defining expected outputs for cases.
    The second problem is strongly typed languages eliminate the need for the consideration
    of invalid inputs. Traditional equivalence testing is a product of the time languages
    such as FORTRAN and COBOL were dominant; thus, this type of error was common.
    In fact, it was the high incidence of errors that led to the implementation of
    strongly typed languages.


    # 6.1 Equivalence Classes


    In Chapter 3, we noted that the important aspect of equivalence classes is that
    they form a partition of a set, where partition refers to a collection of mutually
    disjoint subsets, the union of which is the entire set. This has two important
    implications for testing—the fact that the entire set is represented provides
    a form of completeness, and the disjointness ensures a form of redundancy. The
    subsets are determined by an equivalence relation, the elements of a subset have
    something in common. The idea of equivalence class testing is to identify test
    cases by using one element from each equivalence class. If the equivalence classes
    are chosen wisely, this greatly'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# 100 ■ Software Testing


    reduces the potential redundancy among test cases. In the triangle problem, for
    example, we would certainly have a test case for an equilateral triangle, and
    we might pick the triangle (5, 5, 5) as inputs for a test case. If we did this,
    we would not expect to learn much from test cases such as (6, 6, 6) and (100,
    100, 100). Our intuition tells us that these would be “treated the same” as the
    first test case; thus, they would be redundant. When we consider code-based testing
    in Chapters 8 and 9, we will find that “treated the same” maps onto “traversing
    the execution path.\ The four forms of equivalence class testing address all the
    problems of gaps and redundancies that are common to the four forms of boundary
    value testing. Since the assignments, the four forms of boundary value testing
    also align with the four forms of equivalence class testing. There will be one
    point of overlap—this occurs when equivalence classes are defined by variables.
    In such cases, a hybrid of boundary value and equivalence class testing is appropriate.
    The International Software Testing Qualifications Board (ISTQB) syllabi refer
    to this as “edge testing.” We will see this in discussion of Section 6.3.


    # 6.2 Traditional Equivalence Class Testing


    Most of the standard testing texts (e.g., Myers, 1979) discuss equivalence classes
    based on valid and invalid variable values. Traditional equivalence class testing
    is nearly identical to robust equivalence class testing (see Section 6.3). This
    traditional focus focuses on invalid data values, and it was the dominant style
    of programming in the 1960s and 1970s. Input data validation was an important
    issue at the time, and “Garbage In, Garbage Out” was the program of noteworthy.
    In the early years, it was the program user’s responsibility to provide valid
    data. There was no guarantee about results based on invalid data. The term became
    known as GIGO. The usual response to GIGO was extensive input validation sections
    of a program. Authors and seminar frequently commented that, in the classic afferent/central/efficient
    architecture of structured programming, the portion often represented 80% of the
    total source code. In this context, it is natural to emphasize input data validation.
    Clearly, the defense against GIGO was to have extensive testing to assure data
    validity. The gradual shift to modern programming languages, especially those
    that feature strong data typing, and then to graphical user interfaces (GUIs)
    obviated the need for input data validation. Good use of user interface devices
    as drop-down lists and slider bars reduces the likelihood of bad


    Traditional equivalence class testing echoes the process of boundary value testing.
    Figure 6.1 shows test cases for a function F of two variables x, and x, as we
    show in Chapter 5. The extension to more realistic cases of n variables proceeds
    as follows:


    +   1. Test F for valid values of all variables.

    2. If step 1 is successful, then test F for invalid values of x, with valid values
    of the remaining variables. Any failure will be due to a problem with an invalid
    value of x.

    3. Repeat step 2 for the remaining variables.


    One advantage of the first is that it focuses on ignoring invalid data, the combinations
    of that that we saw in the worst-case variations of boundary value testing were
    ignored. Figure 6.1 shows the few test cases for this process for our continuing
    function F of two variables.


