  md: '# Chapter 9


    # Data Flow Testing


    Data flow testing is an unfortunate term because it suggests some connection with
    data flow diagrams; no connection exists. Data flow testing refers to structural
    testing methods that focus on the points at which variables receive values and
    the points at which these values are used (or referenced). We will see that data
    flow testing serves as a "reality check" on path testing; indeed, many of the
    data flow testing proponents (and researchers) see this approach as a form of
    path testing. While dataflow and slice-based testing are cumbersome at the unit
    level; they are well suited for object-oriented code. We will look at two mainline
    forms of data flow testing: one provides a set of basic definitions and a unifying
    metric called a "program slice.\ Both of these formalize intuitive behaviors (and
    analyses) of testers, although they both start with a program graph, both move
    back in the direction of functional testing. Also, both of these methods are difficult
    to perform manually, and unfortunately, few commercial tools exist to make life
    easier for the data flow and slicing testers. On the positive side, both techniques
    are helpful for coding and debugging.


    Most programs deliver functionality in terms of data. Variables that represent
    data somehow receive values, and these values are used for other values. Since
    the early 1960s, programmers have analyzed source code in terms of points (statement
    and statement fragments) at which variables receive values and points at which
    these values are used. Many times, their analyses were based on concordances that
    list statement numbers in which variable names occur. Concordances were popular
    features of second-generation language compilers (they are still popular with
    COBOL programmers). Early data flow analyses centered on a set of faults that
    are now known as define/reference anomalies:


    +   - A variable that is defined but never used (referenced)

    - A variable that is used before it is defined

    - A variable that is defined twice before it is used


    Each of these anomalies can be recognized from the concordance of a program. Because
    the concordance information is compiler generated, these anomalies can be discovered
    by what is known as static analysis: finding faults in source code without executing
    it.'
