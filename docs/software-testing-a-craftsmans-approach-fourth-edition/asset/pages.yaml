  md: '# Preface to the Third Edition


    # Software Testing: A Craftsman''s Approach, Third Edition


    Five years have passed since the Second Edition appeared, and software testing
    has seen a renaissance of renewed interest and technology. The biggest change
    is the growing prominence and acceptance of agile programming. The various flavors
    of agile programming have interesting, and serious, implications for software
    testing. Almost as a reaction to agile programming, the model-based approaches
    to both development and testing have also gained adherents. Part V1 of the Third
    Edition analyzes the testing methods that are gaining acceptance in the new millennium.
    Except for correction of errors, the first five parts are generally unchanged.


    Over the years, several readers have been enormously helpful in pointing out defects—both
    typos and more serious faults. Particular thanks go to Neil Bitzenhofer (St. Paul,
    Minnesota), Han Ke (Beijing), Jacob Minidor (Illinois), and Jim Davenport (Ohio).
    In addition, many of my students have made helpful suggestions in the past fifteen
    years. Special mention goes to two valued colleagues, Dr. Roger Ferguson and Dr.
    Christian Trefftz, for their help.


    This book is now used as a text for formal courses in software testing in dozens
    of countries. To support both instructors and students, I have added more exercises,
    and faculty adopters get a package of support materials from CRC Press.


    I, too, have changed in the past five years. I now count several Lakota people
    among my friends. There is an interesting bit of their influence in Chapter 23,
    and just one word here—Hecatayelo!


    Paul C. Jorgensen

    Rockford, Michigan'
