    Using the (undirected) graph in Figure 15.9, the neighborhood of Date is the entire
    graph, while the neighborhood of testIt is just Date. Mathematicians have identified
    various “centers” of a linear graph. One of them, for example, the ultracenter,
    which minimizes the maximum distances to the other nodes in the graph. By throwing
    a stone in calm water. We add the ultracenter and nodes one edge away, then neighborhood
    integration of classes will certainly reduce the stub effort, but this will be
    at the expense of diagnostic precision. If a case fails, we will have to look
    at more cases to find the fault.


