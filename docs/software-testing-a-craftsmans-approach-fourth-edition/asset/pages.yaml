    # 21.2 Fuzzing


    Fuzzing is an academic curiosity that began at the University of Wisconsin (Miller
    et al., 1989). In true romance novel format, the seminal report notes, "on a dark
    and stormy night..." the idea was accidentally discovered. Barton Miller and two
    graduate students, Lars Frederik and Bryan So, using a dial-up Internet connection
    during a storm. Electronic noise on the generated garbled strings that caused
    failures on several UNIX systems piqued their curiosity, and evolved into a protracted
    study. They examined 88 utilities on seven UNIX versions, and the attendant faults
    revealed by random character strings.


    Since then, the idea of fuzzing has been extended to several operating systems.
    "Fuzzers" are programs that present random strings of characters as both command
    line and interactive applications. The random strings are an advantage in that
    they can reveal situations that a test case designer would never think of. The
    downside is that the expected output of a test case cannot be defined. This is
    not too much of a problem usually because the faulty input is an error message.


    This is very similar to the "automatic dialers" used in telephone switching system
    prototypes (but they generate multifrequency digits, not pulse digits). These
    devices generate large numbers of random prototype directory numbers, with the
    objective of determining a lost call ratio. These systems also double as traffic
    generators.


    # 21.3 Fishing Crew Counts and Fault Insertion


    Fish and wildlife management offices in states with strong fishing programs use
    a method based on "crew counts" to assess the success of fishing policies. For
    example, the Rogue River near Rockford, Michigan, is a designated trout stream.
    Every year, it is stocked with hatchery fish. The adipose fin (near the tail)
    is removed, and during the season, anglers are asked to participate in crew counts
    they voluntarily report their catches. On the basis of this data, stream management
    can make an estimate of the relative populations of wild (with adipose fin) and
    hatchery'
