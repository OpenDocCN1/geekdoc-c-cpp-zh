    # 14.6 How Many Use Cases?


    When a project is driven by use cases, there is the inevitable question as to
    how many use cases are needed. Use-driven development is inherently a bottom-up
    process. In the agile world, the answer is—the customer/user decides how many
    use cases are needed. But what happens in a non-agile project? Use-driven development
    is still (or can be) an attractive option. In this section, we examine four strategies
    to help decide how many bottom-up use cases are needed. Each strategy employs
    an incidence matrix (see Chapter 4). We could have a fifth strategy by- use case
    development in conjunction with a gradually developed model, as we just saw in
    Section 14.5.


