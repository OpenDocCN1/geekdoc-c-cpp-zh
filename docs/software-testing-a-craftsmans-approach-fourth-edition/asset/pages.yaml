    models—that they are models, not the reality of a system.


    # 14.2.6 Relationships among Basic Concepts


    Figure 14.3 is an E/R model of our basic concepts. Notice that all relationships
    are many-to-many: Data and Events are inputs to or outputs of the Action entity.
    The same event can occur on several ports, and typically many events occur on
    a single port. Finally, an action can occur in several threads, and a thread is
    composed of several actions. This diagram demonstrates some of the difficulty
    of system testing. Testers must use events and threads to ensure that all the
    many-to-many relationships among the five basic concepts are correct.


