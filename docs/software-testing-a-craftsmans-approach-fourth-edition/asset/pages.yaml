  md: '# 14.4 Use Case–Based Threads


    Use Cases are a central part of the Unified Modeling Language (UML). Their main
    advantage is that they are easily understood by both customers/users and developers.
    They capture the does view that emphasizes behavior, rather than the view that
    emphasizes structure. Customers and testers both tend to naturally think of a
    system in terms of the does view, so use cases are a natural choice.


    # 14.4.1 Levels of Use Cases


    One author (Larman, 2001) defines a hierarchy of use cases in which each level
    adds information to the predecessor level. Larman names these levels as follows:


    +   - High level (very similar to an agile user story)

    - Essential

    - Expanded essential

    - Real


    The information content of these variations is shown in Venn diagram in Larman’s
    use case hierarchy in Figure 14.8. Tables 14.2 through 14.4 show the gradual increase
    in use case hierarchy for the example in Table 14.1. High-level use cases are
    at the level of the user stories used in agile development. A set of high-level
    use cases gives a quick overview of the does view of a system. Essential use cases
    add the sequence of input and output events. At this stage, the port boundary
    begins to become clear to the customer/user and the developer.

    Expanded use cases add pre- and postconditions. We shall see that these are key
    to linking use cases when they are expressed as system test cases.

    Real use cases are at the actual system test case level. Abstract names for port
    events, such as “invalid PIN,” are replaced by an actual invalid PIN character
