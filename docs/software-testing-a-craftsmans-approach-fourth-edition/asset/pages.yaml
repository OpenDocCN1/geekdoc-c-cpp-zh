  md: '# A Perspective on Testing 5


    The output portion of a test case is frequently overlooked, which is unfortunate
    because this is the hard part. Suppose, for example, you were testing software
    that determines an optimal route for an aircraft, given Federal Aviation Administration
    air corridor constraints and the weather data for a flight day. How would you
    know what the optimal route is? Various responses address this problem. The academic
    response is to postulate the existence of an oracle "who knows all the answers."
    One industrial response to this problem is known as reference testing, where the
    system is tested in the presence of expert users. These experts make judgments
    as to whether outputs of an executed set of test cases are acceptable.


    Test execution cases establishing the necessary preconditions, providing the test
    case inputs, observing the outputs, comparing these with the expected outputs,
    and ensuring that the expected expectations exist to determine whether the test
    passed. From all of this, it becomes clear that test cases are valuable—at least
    as as source code. Test cases need to be developed, revised, used, and managed.


    # 1.3 Insights from a Venn Diagram


    Testing is fundamentally concerned with behavior, and behavior is orthogonal to
    the code-based view common to software and (system) developers. A quick distinction
    is that the code-based focuses on what it is and the behavioral views consider
    what it does. One of the continuing sources of difficulty for testers is that
    the base documents are usually written by and for developers; the emphasis is
    therefore on code-based, instead of behavioral, information. In this section,
    we develop a simple Venn diagram that clarifies questions about testing.


    Consider a universe of program behaviors. (Notice that we are forcing attention
    on the essence of testing.) Given a program and its specification, consider the
    set S of specified behaviors and the set P of programmed behaviors. Figure 1.2
    shows the relationship between the specified and programmed behaviors. All of
    the possible program behaviors, the specified are in the circle labeled S and
    all in P. With this, we can see more clearly the problems that tester faces. What
    if certain behaviors have not been programmed? In our early terminology, these
    are faults of omission. Similarly, if certain programmed (implemented) behaviors
    have not been specified? These correspond to faults of commission and errors that
    occurred after the specification was complete. The intersection of S and P (the
    football-shaped region) is the "correct" portion, that is, behaviors that are
    both specified and implemented. A very good view of testing is that it is the
    determination of the extent of program behavior that is both specified and implemented.
    (As an aside, note that "correctness" is a relative term, not absolute.)


    The new circle in Figure 1.3 is for test cases. Notice the slight discrepancy
    with our universe of discourse and the set of program behaviors. Because a test
    case covers a program behavior, the mathematicians might forgive us. Now, consider
    the relationships between sets S, P, and T. There may be specified behaviors that
    are not tested (regions 2 and 5), behaviors that are tested (regions 1 and 4),
    and test cases that correspond to unspecified behaviors (regions 3 and 7).


    Similarly, there may be programmed behaviors that are not tested (regions 2 and
    6), or test cases that correspond to behaviors that were not implemented (regions
    4 and 7).


    Each of these regions is important. If specified behaviors exist for which no
    test cases are available, the test cases to unspecified behaviors,


