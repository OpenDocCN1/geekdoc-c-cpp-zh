    # 16.2 Integration-Level Complexity


    The entire discussion in Section 16.1 on unit-level complexity applies to both
    production code and object-oriented methods. The differences in these two paradigms
    are first noticed at the integration level—in fact they are restricted to that
    level. At the integration testing level, the concern shifts from correctness of
    individual units to correct function across units. One presumption of integration-level
    testing is that the units have thoroughly tested "in isolation." Therefore, the
    attention shifts to interfaces among units and what we might call "communication
    traffic." As unit-level complexity, we used directed graphs to help our discussion
    and analysis. The starting point is the call graph from Chapter 13.


    # Definition


    Given program written in an imperative programming language, its *call graph*
    is a directed graph where nodes correspond to units, and edges to messages.

    For object-oriented code, if method A sends a message to node B, there is an edge
    from node A to node B. For procedural code, if unit A refers to unit B, there
    is an edge from node A to node B. As general, the integration-level call graphs
    of procedural code are less complex than those of functionally equivalent object-oriented
    code. At the same time, unit-level complexity of methods is typically less than
    that of procedures. This suggests a "law of conservation of complexity," in which
    complexity does not disappear from object-oriented code; it relocates to the integration
    level. (This is beyond the scope of this chapter, so it remains an observation).'
