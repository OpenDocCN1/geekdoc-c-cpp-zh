  md: '# 1.4.2 Code-Based Testing


    definitional information of the item tested. Some of the mathematical background
    presented in Chapter 3 applies primarily to specification-based approaches.


    Code-based testing is the other fundamental approach to test case identification.
    To contrast it with black testing, it is sometimes called white box (or even clear
    box) testing. The clear box metaphor is probably more appropriate because the
    essential difference is that the implementation (of the black box) is known and
    used to identify test cases. The ability to "see inside" the black box allows
    the tester to identify test cases on the basis of how the function is actually
    implemented.


    Code-based testing has been the subject of some fairly strong theories. Familiarity
    with the concepts of linear graph theory (Chapter 4) is essential. With these
    concepts, the tester can rigorously exactly what is tested. Because of its theoretical
    basis, code-based testing lends itself to the definition and use of test coverage
    metrics. Test coverage metrics provide a way to explicitly state the extent to
    which a software item has been tested, and in turn makes test management meaningful.


    Figure 1.6 shows the results of testing by two code-based methods. As before,
    method A identifies a larger set of test cases than method B. A larger set of
    test cases necessarily better? This is an excellent question, and code-based testing
    provides important ways to develop an answer. Notice that, for both methods, the
    set of test cases is completely contained within the set of programmed behavior.
    Because code-based methods are based on the program, it is hard to imagine these
    methods identifying behaviors that are not programmed. A code-based test cases
    is relatively small with respect to the full set of programmed behaviors. In Chapter
    10, we will see direct comparisons of test cases generated by various code-based
    methods.


    # 1.4.3 Specification-Based versus Code-Based Debate


    Given the two fundamentally different approaches to test case identification,
    it is natural to question which is better. If you read much of the literature,
    you will find strong adherents to either choice.


    The Venn diagrams earlier yield a strong resolution to this debate. Recall that
    the goal of both approaches is to identify test cases (Figure 1.7). Specification-based
    testing uses only the specification to identify test cases, while code-based testing
    uses the source code (implementation) as the basis of test case identification.
    Later chapters will establish that


