    # 8.5 Guidelines and Observations


    In our study of specification-based testing, we observed that gaps and redundancies
    can both exist and, at the time, cannot be recognized. The problem was specification-based
    testing removes us too far from the code. The path testing approaches to code-based
    testing represent the case where the pendulum has swung too far the other way:
    moving from code to directed graph representations and program path formulations
    obscure important information that is present in the code, in particular the distinction
    between feasible and infeasible paths. No form of code-based testing can reveal
    missing functionality that is specified in the requirements. In the next chapter,
    we look at dataflow-based testing. These techniques move closer to the code, so
    the pendulum will swing back from the path analysis extreme.


    McCabe (1982) was right when he observed, "It is important to understand that
    these are purely criteria that measure the quality of testing, and not a procedure
    to identify test cases." He was referring to the DD-path coverage metric and his
    basis path based on cyclomatic complexity. Basis path testing gives us a lower
    boundary on how much testing is necessary.


    Path-based testing also provides us with a set of metrics that act as crosschecks
    on specification-based testing. We can use these metrics to resolve the gaps and
    redundancies. When we find that the same program is traversed by several functional
    test cases, we suspect that this redundancy is not revealing new faults. When
    we fail to attain DD-path coverage, we know that there are gaps in the functional
    test cases. As an example, suppose we have a program that contains extensive error
    handling, and we test it with boundary test cases (min, min+, max-, and max).
    Because these are all permissible values, DD-paths corresponding to the error-handling
    code will not be traversed. If we add test cases derived from robustness testing'
