  md: '# Integration Testing ■ 243


    In unit A, nodes a1 and a6 are source nodes (a5 and a6 are outcomes of the decision
    at node a5), and nodes a4 (a decision) and a8 are sink nodes. Similarly, in unit
    B, nodes b1 and b3 are source nodes, and nodes b2 and b5 are sink nodes. Node
    b2 is a sink node because control leaves unit B at that point. It could also be
    a source node, because unit C returns a value used at node b2. Unit C has a single
    source node, c1, and a single sink node, c9. Unit A contains three execution paths:
    <a1, a2, a3, a4>, <a4, a5, a7, a8>, and <a4, a6, a7, a8>. The solid edges are
    edges traversed in this hypothetical example. The dashed edges are in the graphs
    of the units as stand-alone, but they did not “execute” in the hypothetical MM-path.
    We can now define an integration testing algorithm of the DD-path that serves
    unit testing effectively.


    # Definition


    Given a set of units, their MM-path graph is the directed graph in which nodes
    execution paths and edges correspond to messages and returns from one unit to
    another.


    Notice that MM-path graphs are defined with respect to a set of units. This directly
    supports composition of units and composition-based integration testing. We can
    decompose down to the level of individual module execution paths, but that is
    probably more detailed than necessary.


    We should consider the relationships among module execution paths, program paths,
    DD-paths, and MM-paths. A program path is a sequence of DD-paths, and an MM-path
    is a sequence of module execution paths. Unfortunately, there is no relationship
    between DD-paths and module execution paths. Either might be contained in the
    other, but more likely, they partially overlap. Because MM-paths implement a function
    that transcends unit boundaries, we do have one relationship: consider the intersection
    of an MM-path with a unit. The module execution paths in such an intersection
    are an analog of a slice with respect to the (MM-path) function. Another way,
    the module execution paths in such an intersection are the restriction of the
    function to the unit in which they occurs.


    The MM-path definition needs some practical guidelines. How long (“deep” might
    be better) is an MM-path? The notion of message quiescence helps here. Message
    quiescence occurs when a unit sends no messages is received (like module C in
    Figure 13.12). In a sense, this be taken as a “midpoint” of an MM-path—the remaining
    execution consists of message returns. This is only mildly helpful. If there are
    two points of message quiescence? Maybe a better answer is to take the longer
    of the two, or if they are of equal depth, the latter of the two. Points of message
    quiescence are natural endpoints for an MM-path.


    # 13.3.2 MM-Path Complexity


    If you compare the MM-paths in Figures 13.12 and 13.17, it intuitively clear that
    the latter is more complex than the former. Because these are strongly connected
    graphs, we can “blindly” count their cyclomatic complexity: recall the formula
    V(G) = e - n + 2p, where p is the number of strongly connected regions. Since
    messages return to the sending unit, we will always have p=1, so the formula reduces
    to V(G) = e - n + 2. Surprisingly, both graphs have V(G) = 7. Clearly, MM-path
    complexity needs some notion of size in addition to cyclic complexity (Figure
    13.13).'
