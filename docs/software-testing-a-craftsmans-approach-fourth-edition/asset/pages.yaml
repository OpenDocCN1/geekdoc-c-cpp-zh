    fault isolation. Once the tests have been run (and failed), the developer writes
    just enough code to make the tests pass, and the tests are rerun. If any test
    fails, the developer goes back to the code and makes a necessary change. Once
    all the tests pass, the next story is implemented. Occasionally, the developer
    may decide to refactor the existing code. The cleaned-up code is then subjected
    to the full set of existing test cases, which is very close to the idea of regression
    testing. For TDD to be practical, it must be done in an environment that supports
    automated testing, typically with a member of the nUnit family of automated test
    environments. (We will have an example of this in Chapter 19).

    Testing in TDD is interesting. Since the story-level test cases drive the coding,
    ARE the specification, so in a sense, TDD use’ specification-based testing. But
    since the code is deliberately as close as possible to the test cases, we could
    argue that it is also code-based testing. There are two problems with TDD. The
    first is common to all flavors–the bottom–up approach hits a single, high-level
    design step. User stories that arrive in the sequence may obviate earlier design
    choices. Refactoring would also occur at the design level, rather than just at
    the code level. The agility community is very passionate about the claim that
    repeated refactoring results in an elegant design. We are not sure of what is
    needed, or equivalently, rapidly changing requirements, refactoring at the code
    and design levels seems the only way to end up with an elegant design. This is
    an inevitable constraint on bottom-up development.

    The second problem is that all developers make mistakes—that is much of the reason
    we test in the first place. But consider: what makes us the TDD developer perfect
    at devising the test cases that drive the development? Even worse: what if late
    user stories are inconsistent with earlier ones? A final limitation of TDD is
    there no place in the life cycle for a cross-check at the user story level.


    #  11.3 Scrum


    Scrum is probably the most frequently used of all the agile life cycles. There
    is a pervasive emphasis on the team members and teamwork. The name comes from
    the rugby maneuver in which'
