  md: '# 13.2 Call Graph–Based decomposition-based integration


    One of the drawbacks of decomposition-based integration is that the functional
    decomposition tree. We saw that this leads to impossible test pairs. If we use
    the call graph instead, we resolve this deficiency; we might follow in the direction
    of structural testing. The call graph is developed by using units to nodes, and
    if we call A (or units) unit B, there is an edge from node A to node B. The call
    graph of the program is shown in Figure 13.7.


    Since edges in the call graph refer to actual execution–times, the call graph
    allows all the problems we saw in the decomposition tree–based versions of integration.
    In fact, we could repeat the discussion of Section 13.1 on stubs and drivers in
    the units in Figure 13.7. This will work well, and it preserves the fault isolation
    of the decomposition-based approaches. Figure 13.8 shows the first step in call
    graph–top–down integration.


    The stubs in the first session could operate as follows. When the Calendar main
    program calls getDateStub the stub might return May 27, 2013. The zodiacStub would
    return “Gemini,” and so on. Once the main program logic is tested, the stubs would
    be replaced, as we discussed in Section 13.1. The three strategies of Section
    13.1 will work well well when stubs and drivers are based on the call graph rather
    than the functional decomposition.


    We are in a position to enjoy the investment we made in the discussion of graph
    theory. Because the call graph is a directed graph, why not use the way we used
    program graphs? This leads to two new approaches to integration testing: we will
    refer to them as pairwise integration and neighborhood integration.


