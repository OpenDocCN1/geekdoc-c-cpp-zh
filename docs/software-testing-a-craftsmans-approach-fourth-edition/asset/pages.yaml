    # Definition


    Given a set of test cases for a program, they constitute chain coverage, if executed
    on the program, every graph of length greater than or equal to 2 in the program
    graph is traversed. Denote this level of coverage as $G_{chain}$


    The $G_{chain}$ coverage is the same as node coverage in the DD-path graph that
    corresponds to the given program graph. Since DD-paths are important in E.F. Miller''s
    original formulation of test covers (defined in Section 8.3.2), we now have a
    clear connection between purely program graph constructs and Miller''s test covers.


    # Definition


    Given a set of test cases for a program, they constitute path coverage, if executed
    on the program, every path from the source node to the sink node in the program
    graph is traversed. Denote this level of coverage as $G_{path}$


    This coverage is over severe limitations when there are loops in a program (as
    in Figure 8.3). E.F. Miller partially anticipated this when he postulated the
    $C_2$ metric for loop coverage. Referring back to Chapter 4, observe that every
    loop in a program graph represents a set of strongly (3-connected) nodes. To deal
    with the implications of loops, we exercise every loop, and then form the condensation
    of the original program graph, which must be a directed acyclic graph.


    # 8.3.2 E.F. Miller''s Coverage Metrics


    Several widely accepted test coverage metrics are used; most of those in Table
    8.1 are due to the early work of Miller (1977). Having an objective view of the
    extent to which a program is tested makes it possible to manage the testing process.
    Most quality organizations expect the $C_1$ metric (DD-path coverage) as the minimum
    level of test coverage.


    These coverage metrics form a lattice (see Chapter 9 for a lattice of data flow
    coverage metrics) in which some are equal and some imply others. The importance
    of this is that there are always fault types that can escape detection by inferior
    levels of testing. Miller (1991) observes that when DD-path coverage is attained
    by a set of test cases, 85% of all faults are revealed. The coverage metrics in
    Table 8.1 tell us what to test but not how to test it. In this section, we take
    a closer look at techniques that exercise source code. We must keep an important
    distinction in mind: Miller''s test coverage metrics are based on program graphs
    in which nodes are full statements, whereas our formulation allows statement fragments
    (which can be entire statements) to be nodes.


    # 8.3.2.1 Statement Testing


    Because our formulation of program graphs allows statement fragments to individual
    nodes, Miller''s $C_0$ metric is subsumed by our $G_{node}$ metric.'
