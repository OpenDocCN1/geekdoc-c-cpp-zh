  md: '# Software Testing


    We can always compute the number of neighborhoods for a given call graph. Each
    interior node will have one neighborhood, plus one extra in case leaf nodes are
    connected directly to the root node. (An interior node has a nonzero inderee and
    a nonzero outdegree.) We have


    Interior nodes = nodes – (source nodes + sink nodes)


    Neighborhoods = interior nodes + source nodes


    which combine to


    Neighborhoods = nodes – sink nodes


    Neighborhood integration usually yields a reduction in the number of integration
    test sessions, and it reduces stub and driver development. The end result is that
    neighborhoods are essentially the sandwiches that we slipped past in the previous
    section. (It is slightly different because the base information for neighborhoods
    is the call graph, not the decomposition tree.) What they share with sandwich
    integration is more significant—neighborhood integration testing has the fault
    isolation difficulties of “medium bang” integration.


    # 13.2.3 Pros and Cons


    The call graph–based integration techniques move away from a purely structural
    bias toward a behavioral bias; (See the Pendulum in Chapter 10.) The neighborhood-based
    techniques also reduce the stub/driver effort. In addition to these advantages,
    call-based integration matches well with development characterized by builds and
    composition. For example, sequences of neighborhoods can be used to define builds.
    Alternatively, we could allow adjacent neighborhoods to merge (villages?) and
    provide an orderly, composition-based growth path. This supports the use of neighborhood-based
    integration for systems developed by life cycles in which composition dominates.


    The biggest drawback to call graph–based integration is the fault isolation problem,
    especially for large neighborhoods. A more subtle but closely related problem
    is What happens if (when) a fault is in a node (unit) that appears in several
    neighborhoods? The adjacency matrix highlights this immediately—nodes with either
    a high row sum or a high column sum will be in several neighborhoods. Obviously
    we resolve the fault in one neighborhood; this means changing the unit’s code
    in some way, which in turn means that all the previously tested neighborhoods
    that the changed node needs to be retested.


    Finally, a fundamental uncertainty exists in any structural form of testing: the
    presumption that units integrated with respect to structural information will
    exhibit correct behavior. We know where we are going; we want system-level threads
    of behavior to be correct. When integration based on call graph information is
    complete, we still have a leap to go to system-level threads. We resolve this
    by changing the bias from call graph information to special forms of paths.'
