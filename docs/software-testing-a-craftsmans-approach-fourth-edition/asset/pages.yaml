    # 15.4.3 A Framework for Object-Oriented Data Flow Testing


    MM-paths were defined to serve as integration analysis of DD-paths. As we saw
    for procedural software, DD-path testing is often insufficient; and in cases,
    data flow testing is more appropriate. The same holds for integration testing
    of object-oriented software; if anything, the need is greater for two reasons:
    (1) data can get values from inheritance tree and (2) data can be defined at various
    stages of message passing.


    Program graphs formed the basis for describing and analyzing data flow testing
    for procedural code. The complexities of object-oriented software exceed the capabilities
    of directed (program) graphs. Figure 15.14 shows the notational symbols used in
    event-driven communication among objects. This subsection presents an expressive
    framework within which data flow questions for object-oriented software can be
    described and analyzed.


    # 15.4.3.1 Event-/Message-Driven Petri Petri Nets


    Event-driven Petri nets were defined in Chapter 4; we extend them to express the
    message communication using the notational symbols used in an event-and message-driven
    Petri net (EMDPN). The fused triangle shape for messages is intended to convey
    that a message is an output of the sending method and an input to the destination
    method.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_348_0.png)


    Figure 15.14 Symbols for event-/message-driven Petri nets (E/MDPN).'
