    # 14.4.6 Which Best Serves System Testing?


    Of the three views in this section, use cases are the best for communication between
    customers/users and developers; however, they do not support much in the way of
    analysis. Finite machines are in common use, composing finite state machines inevitably
    leads to the well-known "finite machine explosion.\ Finite state-based support
    tools are available, but the explosion part is problematic. Both of these can
    be converted to EDPNs, although information must be added to EDPNs derived from
    use cases. The big advantage of EDPNs is that they are easily composed with other
    EDPNs, and the intension/extension relationship between an unmarked EDPN and various
    markings (execution sequences) makes them the preferred choice for system testing.
    We did not discuss deriving system test cases from an EDPN, but the process is
    obvious.


