    optional but common. The portable opener is usually kept in a car, and there may
    be two or more of them. Sometimes a digital keypad is mounted on the outside of
    a garage, so children can enter after school. The openers and digit keypads send
    weak radio signals to the wireless receiver, which in turn, controls the drive
    motor. A possible Internet-based controller is not shown, but could be added.
    Finally, the'
