    As a cross check, here is the truth table for the compound condition.


    (c1 AND NOT(c2)) OR (c3)


    | c1 | c2 | c3 | NOT(c2) | c1 AND NOT(c2) | (c1 AND NOT(c2)) OR c3 | Year |

    |---|---|---|---|---|---||}{

    | T | T | T | F | F | T | 2000 |

    | T | T | F | F | F | F | 1900 |

    | T | F | F | F | T | T | Imp |

    | T | F | F | F | T | T | 2008 |

    | F | T | T | F | F | T | Imp |

    | F | T | F | F | F | F | Imp |

