  md: '# Chapter 16


    # Software Complexity


    Most discussions of software complexity focus on two main models—cyclomatic (or
    decisional) complexity, and textual complexity as measured by the Halstead metrics.
    Both approaches are commonly used at the unit level; however, both can be used
    at the integration and system levels. This chapter takes a closer look at software
    complexity at all three levels—unit, integration, and system. At the unit level,
    the basic cyclomatic complexity model (also known as McCabe complexity) is extended
    in two ways. Integration-level complexity applies cyclomatic complexity to a directed
    graph in which nodes and edges represent either object-oriented messages or procedural
    calls. After discussing the complexities due to object-oriented practice, system-level
    complexity is expressed in terms of an incidence matrix that relates to the is
    and does views of a software system.


    complexity is usually analyzed as a static (ie., compile-time) property of source
    code, not an execution-time property. The approaches discussed here are derived
    directly from source code, or possibly from design–and specification-level models.
    Why about software complexity? It has the most direct bearing on the extent of
    required software testing, also, it is an indicator of difficulty in software
    maintenance, particularly program comprehension. As software complexity increases,
    development effort also increases, although this is a little deceptive since much
    of the analysis is based on existing code (too late!). Finally, an awareness of
    software complexity may lead to improved programming practices, and even better
    design techniques.


    # 16.1 Unit-Level Complexity


    The description of unit-level complexity begins with the notion of a program graph
    from Chapter 8 (Path Testing). Recall that for a program in an imperative programming
    language, its program graph is a directed graph in which nodes are either statements
    or fragments of a statement, and edges represent flow of control (there is an
    edge from node i to node j if and only if the statement [or statement fragment]
    corresponding to node j can be executed immediately after the statement or statement
    fragment corresponding to node i). The program graph represents the flow structure
    of the source code, and this leads to the usual definition of cyclomatic


    331'
