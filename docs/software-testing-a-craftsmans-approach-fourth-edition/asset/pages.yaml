  md: '# Chapter 12


    # Model-Based Testing


    > “By my faith! For more than forty years I have been speaking prose without knowing
    anything about it....”


    Monsieur Jourdain in Le Bourgeois Gentilhomme


    I share the sentiment of Moliere''s Monsieur Jourdain; since the first edition,
    this book has advocated we now call Model-Based Testing (MBT). In this chapter,
    we describe the basic mechanism, discuss how to choose appropriate models, consider
    the pros and cons of MBT, and provide a short description of available tools.
    Actual examples of MBT are (and have been in the earlier editions) scattered throughout
    this book.


    # 12.1 Testing Based on Models


    The main advantage of modeling system behavior is that the process of creating
    a model usually results in deep insights and understanding of the system being
    modeled/tested. This is particularly true of executable models such as finite
    state machines, Petri nets, and StateCharts. In Chapter 14, we will see threads
    of system behavior, which are easily transformed into system level test cases,
    are readily derived from many behavioral models. Given this, the adequacy of MBT
    will always depend on the accuracy of the model. The essence of MBT is this sequence
    of steps:


    +   1. Model the system.

    2. Identify threads of system behavior into the model.

    3. Transform these threads into test cases.

    4. Execute the test cases (on the actual system) and record the results.

    5. Revise the model(s) as needed and repeat the process.'
  merge: -1
