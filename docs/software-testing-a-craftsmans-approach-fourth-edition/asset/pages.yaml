    # Definition


    The truth set $T$ of a proposition $p$, written $T(p)$, is the set of all elements
    in the universe $U$ for which $p$ is true.


    Propositions are either true or false; therefore, a proposition $p$ divides the
    universe of discourse into two sets, $T(p)$ and $T(p'')$, where $T(p) \cup T(p'')
    = U$. Notice that $T(p'')$ is the same as $T(\sim p)$. Truth sets facilitate a
    clear mapping among set theory, propositional logic, and probability theory.


    # Definition


    The probability that a proposition $p$ is true, denoted $Pr(p)$, is $|T(p)|/|U|$.


    With this definition, Laplace’s “number of favorable ways” becomes the cardinality
    of the truth set $T(p)$, and the total number of ways becomes the cardinality
    of the universe of discourse. This forces one more connection: because the set
    of a tautology is the universe of discourse, and the truth set of a contradiction
    is the empty set, the probabilities of $\varnothing$ and $U$ are 0 and 1, respectively.


    The NextDate problem is a good source of examples. Consider the month variable
    and the proposition


    $p(m): m$ is a 30-day month


    The universe of discourse is the set $U = \{Jan., Feb., ..., Dec.\},,$ and the
    truth set of $p(m)$ is the set


    $T(p(m)) = \{Apr., June, Sept., Nov.\}$


    Now, the probability that a given month is a 30-day month


    $Pr(p(m)) = |T(p(m))|/|U| = 4/12$


    A subtlety exists in the role of the universe of discourse; this is part of the
    craft of using probability theory in testing—Suppose we want to know the probability
    a month is February. The quick answer is 1/12. Less easy—we need a universe that
    includes both leap years and common months. We could use congruence arithmetic
    and choose a universe that consists of months in a period of four consecutive
    years—say 1991, 1992, 1993, and 1994. This would contain 48 “months”, and in this
    universe the probability of a 29-day month is 1/48. Another possibility would
    be to use the 200-year range of the NextDate program, in which the year 1900 is
    not a leap year. This would slightly reduce the probability of a 29-day month.
    One conclusion: getting the right universe is important. A bigger conclusion:
    it is more important to avoid “shifting universes.”


    Here are some facts about probabilities that we will use without proof. They refer
    to a given universe, propositions $p$ and $q$, with truth sets $T(p)$ and $T(q)$:


    $Pr(\sim p) = 1 - Pr(p)$'
