    Equivalence class testing is clearly sensitive to the equivalence relation used
    to define classes. Here is another instance of craftsmanship. If we base equivalence
    on the output domain, we obtain a richer set of test cases. What are some of the
    possibilities for the three integers, a, b, and c? They can all be equal, exactly
    one be equal (this can happen in three ways), or none can be equal.


    +   D1 = {a, b, c: a = b = c}

    D2 = {a, b, c: a = b, a ≠ c}

    D3 = {a, b, c: a = c, a ≠ b}

    D4 = {a, b, c: b = c, a ≠ b}

    D5 = {a, b, c: a ≠ b, a ≠ c}


    As a separate question, can we apply the triangle property to see if they even
    constitute a triangle. The triplet <1, 4, 1>? (For example, <1, 4, 1> has exactly
    one pair of equal sides, but these sides do not form a triangle.)


    +   D6 = {a, b, c: a ≥ b + c}

    D7 = {a, b, c: b ≥ a + c}

    D8 = {a, b, c: c ≥ a + b}


