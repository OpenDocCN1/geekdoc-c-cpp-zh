    # 17.3.1 Requirements Elicitation


    In a webinar, Jo Lane described an emergency response system of systems that dealt
    with grass fires in southern California (Lane, 2012). Lane offers a waterfall-like
    sequence of activities to describe general requirements of a given system of systems.
    The steps include


    +   * Identifying resources—potential constituent systems, and modeling them with
    SysML

    * Determining options—responsibilities and dependencies

    * Assessing options—expressed as use cases

    * Identifying a workable combination of constituent systems

    * Allocating responsibilities to constituent systems


    In the next sections, we revise and extend the standard UML practices to make
    them work for systems of systems. These are illustrated with the examples in Section
    17.2.


    # 17.3.2 Specification with a Dialect of UML: SysML


    There are three parts to the SysML dialect—class-like definitions of a constituent
    system in terms of its responsibilities to other constituents and the services
    it provides. Use cases show the flow across constituents for overall system of
    systems functions, and traditional UML sequence diagrams to show the incidence
    of these cases with constituent systems.


