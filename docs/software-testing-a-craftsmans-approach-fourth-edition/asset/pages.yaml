  md: 'Elevating software testing to a craft requires a background that the testing
    craftsperson know the basic tools. To this end, Chapters 3 and 4 provide mathematical
    background that is used freely in the remainder of the text.


    Mathematics is a descriptive device that helps us better understand software to
    be tested. Precision, by itself, is not enough. We must also have good technique
    and judgment to identify appropriate testing methods and to apply them well. These
    are the goals of Parts II and III, which deal with fundamental functional and
    structural testing techniques. These techniques are applied to the continuing
    examples, which are described in Chapter 2. In Part IV, we apply these techniques
    to the integration and system levels of testing, and object-oriented testing.
    At these levels, we are more concerned with what to test than how to test it,
    so the discussion moves toward requirements specification. Part IV concludes with
    an examination of testing interactions in a software controlled system, with a
    short discussion of client-server systems.


    It is ironic that a book on testing contains faults. Despite the conscientious
    efforts of reviewers and editors, I am confident that faults persist in the text.
    Those that remain are my responsibility.


    In 1977, I attended a testing seminar given by Edward Miller, who has since become
    one of the luminaries in software testing circles. In that seminar, Miller went
    to great lengths to convince us that testing need not be bothersome drudgery,
    but can be a very creative, interesting part of software development. My goal
    for you, the reader of this book, is that you will become a testing craftsperson,
    and that you will be able to derive the sense of pride and pleasure that a job
    well done.


    Paul C. Jorgensen

    Rockford, Michigan'
