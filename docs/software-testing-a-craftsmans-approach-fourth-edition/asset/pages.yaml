    | n4 | 0 | 1 | 1 | 0 | 1 |

    | n5 | 0 | 0 | 0 | 1 | 0 |

    | n6 | 0 | 0 | 0 | 0 | 1 |

    | n2 | 0 | 0 | 0 | 0 | 0 |


