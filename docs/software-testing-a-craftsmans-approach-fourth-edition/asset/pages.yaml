  md: '# 6.3.1 Weak Normal Equivalence Class Testing


    With the notation as given previously, weak normal equivalence class testing is
    accomplished using one variable from each equivalence class (interval) in a test
    case. (Note the effect of the single fault assumption.) For the running example,
    we would end up with the three equivalence class tests shown in Figure 6.2. This
    will be repeated for the remaining forms of equivalence class testing, but for
    clarity, without indication of valid and invalid ranges. These three tests use
    one value from each equivalence class. The test in the left rectangle corresponds
    to a value of x, in the class [a, b], and to a value of x, in the class [f]. The
    test in the center rectangle corresponds to a value of x, in the class [b, c)
    and to a value of x, in the class [f, g]. The third test could be in either rectangle
    on the right side of the value classes. We identified this in a systematic way,
    thus the apparent pattern. In fact, we will always have the same number of weak
    equivalence class tests as classes in the largest number of subsets.


    What can we learn from a weak normal equivalence class test that fails, that is,
    for which the expected and actual outputs are inconsistent? Could there be a problem
    with x₁ or a problem with x₂, or perhaps an interaction between the two? This
    ambiguity is the reason for the “weak” designation. If the expectation of failure
    is low, as it is for regression testing, this can be an acceptable choice. When
    more fault is isolated, the stronger forms, discussed next, are indicated.


    # 6.3.2 Strong Normal Equivalence Class Testing


    Strong equivalence class testing is based on the multiple fault assumption, so
    we need test cases from each element of the Cartesian product of the equivalence
    classes, as shown in Figure 6.3. Notice the similarity between the pattern of
    these test cases and the construction of a truth table in propositional logic.
    The Cartesian product guarantees that we have a notion of “completeness” in two
    senses: we cover all the equivalence classes and we have one of each possible
    combination of inputs. As we see from our continuing examples, the key to “good”
    equivalence class testing is the selection of the equivalence relation. Watch
    for the being “treated the same.” Most of the time, equivalence class testing
    defines classes of the input domain. There is no reason why we could not define
    equivalence relations on the output range of the program being tested; in fact,
    this is the simplest approach for the triangle problem.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_132_0.png)


    Figure 6.2 Weak normal equivalence class test cases.'
