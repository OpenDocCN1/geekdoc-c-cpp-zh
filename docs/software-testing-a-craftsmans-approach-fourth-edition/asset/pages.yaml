    Figure 13.13 Cyclomatic complexities of two MM-paths.


    # 13.3.3 Pros and Cons


    MM-paths are a hybrid of functional and structural testing. They are functional
    in the sense that they represent actions with inputs and outputs. As such, all
    the functional testing techniques are potentially applicable. The net result is
    the cross-check of the functional and structural approaches is consolidated into
    the constructs for path-based integration testing. We therefore avoid the pitfalls
    of structural testing, and at the same time, integration testing gains a fairly
    seamless junction with system testing. Path-based integration testing works equally
    well for software developed in traditional waterfall process or with one of the
    composition-based alternative life cycle models. The MM-path concept applies directly
    to object-oriented software.


    The most important advantage of path-based integration testing is that it is closely
    coupled with actual system behavior, instead of the structural motivations of
    decomposition and call graph-based integration. However, the advantages of path-based
    integration testing come at a price—more effort is needed to identify the MM-paths.
    This effort is probably offset by the elimination of stub and driver development.


