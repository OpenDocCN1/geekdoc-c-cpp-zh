    Quite like, isn''t it? There are probably missing entries, but the point is, software
    development remains a difficult activity, and dedicated practitioners will always
    seek new or improved practices.


    # 23.3 My Top 10 Best Practices for Software Testing Excellence


    The underlying assumption about best testing practices is that software testing
    is performed by software craftsmen. The earlier discussion, implies that the tester
    is well-versed in the craft, and has both the tools and the time to perform the
    task with excellence. There is a perennial debate as whether or not a tester should
    be a talented programmer. To me, the answer is an emphatic yes. As a craftsman,
    programming is clearly part of the subject matter. Other attributes include creativity,
    ingenuity, curiosity, discipline, and, somewhat cynical, a can-break-it mentality.
    My personal "top 10" best practices are only briefly described here; most of them
    are treated more completely in the included chapters.


    # 23.3.1 Model-Driven Agile Development


    Model-driven development (see Chapter 11) has emerged as a powerful blend of traditional
    model-driven development (MDD) and the bottom-up increments of the agile world.
    One of the main advantages of MDD is that, if used well, can provoke recognition
    of details that otherwise might be ignored. The models themselves will be extremely
    useful for maintenance changes during the applications useful lifetime. The agile
    part brings the recognized advantages of test-driven development (TDD) to an agile
    MDD project.


    # 23.3.2 Careful Definition and Identification of Levels of Testing


    Any application (unless it is small) should have at least two levels of testing—unit
    and system. Larger applications generally do to add integration testing. Controlling
    the testing at these levels is critical. Each level has clearly defined objectives,
    and these should be observed. System-level test cases that exercise unit-level
    considerations are both absurd and a waste of precious time.'
