    | F | F | F | T | F | F | 2011 |


    Notice that the same cases and impossibilities (the "Imp" entries) occur in the
    rows of the truth table, and the columns of the decision table; therefore, the
    two versions of isLap are logically equivalent. Looking at the program graphs
    of the two implementations, the MDD version seems to be more complex. In fact,
    the cyclomatic complexity of the MDD version is 4, while that the TDD version
    requires multiple condition coverage. Both versions end up with the same necessary
    (and sufficient) four cases.


    What, if any, conclusions can we draw from this? The MDD approach yields the Eagle''s
    view of the full picture. We know from the way decision tables work that the result
    is correct. We had to do a little more to reach the same level of confidence with
    the TDD approach; however, in the end, the two implementations are logically equivalent.
    The apparent difference in cyclomatic complexity is negated by the need for multiple
    condition coverage testing. The nested if is moved into condition complexity—it
    does not disappear.


    Any weaknesses? The MDD approach ultimately depends on the modeling skill; similarly,
    the TDD approach depends on testing skill. No significant difference there. What
    about size? The MDD version is longer: 17 statement fragments versus 9, but the
    TDD process requires more keystrokes. No significant difference here either.


    The biggest difference we would seem to be maintenance. Presumably, the modeling
    would be more helpful to a maintainer—the Eagle again. But the cases from the
    TDD approach will help the maintainer recreate and isolate a fault—the Mouse view.'
