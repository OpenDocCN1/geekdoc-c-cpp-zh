  md: '# 11.4 Agile Model–Driven Development


    My German friend Georg is a PhD mathematician, a software developer, and a Go
    player. For several months, we had an e-mail-based discussion about agile development.
    At one point, Georg asked if I played the oriental game Go. I do not, but he replied,
    to be a successful Go player, one needs both strategy and tactics. A deficiency
    in either puts a Go player at a disadvantage. In the software development realm,
    he equates strategy with an overall design, and tactics as unit level. His take
    on the flavors of agile development is that the strategy part is missing, and
    this leads us to a compromise between the agile world and the traditional views
    of software development. We first look at Agile Model–Driven Development (AMDD)
    popularized by Scott Ambler. This is followed by my mild reorganization of Ambler’s
    work, named here as Model–Driven Agile Development (MDAD).


    # 11.4.1 Agile Model–Driven Development


    The agile part of AMDD is the modeling step. Ambler’s advice is to model just
    enough for the current user story, and then implement it with TDD. The big difference
    between AMDD and any of the agile life cycles is that there is a distinct design
    step (The agilists usually express their distaste/disdain for modeling by calling
    it “Big Design Up Front” and abbreviate it as the BDUF). See Figure 11.10.


    Ambler’s contribution is the recognition that design does indeed have a place
    in agile development. As this was being written, there was a protracted discussion
    on LinkedIn started by the question “Is there any room for design in agile software
    development?” Most of the thread affirms the need for design in any agile life
    cycle. Despite this, there seems to be no room in AMDD for integration/system
    testing.


    # 11.4.2 Model–Driven Agile Development


    Model–driven agile development (MDAD) is my proposal for a compromise between
    the traditional and the agile worlds. It is stimulated by Georg’s view of the
    need for both strategy and tactics, hence the compromise. How does MDAD differ
