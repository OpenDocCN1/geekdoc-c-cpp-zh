  md: '# 16.1.1 Cyclomatic Complexity


    Definition: In a strongly connected directed graph G, its cyclomatic complexity,
    denoted by V(G), is given by $V(G) = e - n + p$, where


    +   * e is the number of edges in G

    * n is the number of nodes in G

    * p is the number of connected regions in G


    In code that conforms to structured programming (single entry, single exit), we
    always have $p = 1$. There is some confusion in the literature about the formula
    for $V(G)$. There are two formulas commonly seen:


    +   (1) $V(G) = e - n + p$

    (2) $V(G) = e - n + 2p$


    Equation (1) refers to a directed graph G that is strongly connected, that is,
    for any two nodes $n_i$ and $n_j$ of G, there is a path from $n_i$ to $n_j$. Since
    the graph of a structured program is not quite strongly connected because there
    is no path from the sink node to the source node. The usual way to apply the formula
    is to add an edge from the sink node to the source node. If an edge is added,
    Equation (1) applies; otherwise, equation (2) applies. With this definition, given
    a program graph, the cyclomatic complexity is determined by simply counting the
    nodes and edges, and applying equation (2). This is fine for small programs, but
    what about a program graph such as the one in Figure 16.1? Even for programs of
    this size, counting nodes and edges is tedious. For matter, drawing the program
    graph is also tedious. Fortunately, there is a more elegant way, based on an insight
    from directed graph theory. We develop two shortcuts.


    # 16.1.1.1 "Cattle Pens" and Cyclomatic Complexity


    Cyclomatic complexity refers to the number of independent cycles in a strongly
    connected directed graph. When drawn in the graph (as in Figure 16.1), these cycles
    are easily identified visually, and can be done for small programs. Rather than
    count all the nodes and edges in a larger graph, we can imagine nodes as fence
    posts, and edges as fenced inside a cattle pen (The more esoteric term is "enclosed
    regions," which the top prefer). In the program graph in Figure 16.1, there are
    37 edges and 31 nodes. Since the graph is not strongly connected, equation (2)
    applies, and $V(G) = 37 - 31 + 2 = 8$. The eight "cattle pens" are also numbered
    (notice that one pen is "outside" all the others). Drawing the directed graph
    to identify cattle pens is still tedious. Again, there is a more elegant way,
    based on more definitions from graph theory.


    # 16.1.1.2 Node Outdegrees and Cyclomatic Complexity


    As we saw in Chapter 4, the indegree of a node in a directed graph is the number
    of edges that terminate on the node. Similarly, the outdegree of a node in a directed
    graph is the number of edges that originate at the node. These are commonly denoted
    for node $n$ as $inDeg(n)$ and $outDeg(n)$. We need another definition to replace
    the thinking that went into the cattle pen approach.'
