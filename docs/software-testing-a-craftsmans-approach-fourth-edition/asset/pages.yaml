    # ## 3.5 Probability Theory


    We will have two occasions to use the probability theory in our study of software
    testing: one deals with the probability that a particular path of statements executes,
    and the other generalizes this to a popular industrial concept called operational
    profile (see Chapter 14). Because of this limited use, we will only cover the
    rudiments here.


    As with both theory and propositional logic, we start out with a primitive concept—the
    probability of an event. Here is the definition provided by a classic textbook
    (Rosen, 1991):


    The probability of an event $E$, which is a subset of a finite sample space $S$
    of equally likely outcomes, is $p(E) = |E|/|S|$.


    This definition hinges on the idea of an experiment that results in an outcome,
    the sample space is the set of all possible outcomes, and an event is a subset
    of outcomes. This definition is circular: What are "equally likely" outcomes?
    We assume here probabilities, then probability is defined in terms of itself.


    The French mathematician Laplace had a reasonable definition of probability two
    centuries ago. To paraphrase it, the probability that something occurs is the
    number of favorable ways it can occur divided by the total number of ways (favorable
    and unfavorable). Laplace’s definition works well when we are concerned with drawing
    colored marbles out of a bag (probability folks are unusually concerned with their
    marbles; maybe there is a lesson here), but it does not extend to situations in
    which it is hard to enumerate the various possibilities.


    We will use our (refurbished) capabilities in set theory, we will be concerned
    with things that happen; we will call these events and say that the set of all
    events is our universe of discourse. Next, we will devise propositions about events,
    such that the propositions refer to elements in our universe of discourse. Now,
    for some universe $U$ and some proposition $p$ about elements of $U$, we make
    a definition:'
