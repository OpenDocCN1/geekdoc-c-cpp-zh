    # # 19.4 Remaining Questions


    # ## 19.4.1 Specification or Code Based?


    Is TDD code based, or specification based? In sense, a test case is a very low
    level specification, so TDD seems to be specification based. However, test cases
    are very closely associated with code, so it has the appearance of code-based
    testing. Certainly, code coverage, at the DD-path level, is unavoidable. Is it
    a stretch to claim that the set of all test cases constitutes a specification?
    Imagine the reaction of a customer trying to use a TDD program from the set of
    test cases. In the agile programming sense, however, the purpose of each test
    case can be considered to be a user story, and user stories are accepted by customers.
    It is really a question of level of detail, which leads to a TDD. Practitioners
    who object to tiny, incremental steps suggest that “larger” test cases, followed
    by chunks of code, are preferable. This has the advantage of introducing a small
    element of code design, and probably reduces the frequency of refactoring. Refactoring
    the strictly bottom-up approach of “pure” TDD is complemented by top–down thinking.


    # ## 19.4.2 Configuration Management?


    Superficially, TDD appears to be a configuration management nightmare. Even a
    program as small as NextDate has dozens of versions from inception to completion.
    This is when refactoring comes in. TDD forces a bottom–up approach to code development.
    At certain points, the conscientious programmer will see that the code can be
    reorganized into something more elegant. There are no rules as when refactoring
    should occur, but when it does, it is important to note that the original test
    cases are preserved. If the refactored code fails to pass all tests, there is
    a problem in the refactoring. Again, note the simple fault isolation. Refactoring
    points (once all test have passed) are good candidates for configuration management
    actions. There are points where a design object is, or can be promoted, to configuration
    item status. If code causes earlier test cases to fail, this is another clear
    configuration management point. The configuration item should should be demoted
    to a design object, which by definition, is subject to change.


    # ## 19.4.3 Granularity?


    The sequence of user stories in the example in Section 19.3.1 uses very fine-grained
    level of detail. As an alternative, consider the enlarged granularity of user
    stories in Table 19.2. With “larger” user stories, a particular user story is
    broken down to a series of finer tasks, and code is developed for'
