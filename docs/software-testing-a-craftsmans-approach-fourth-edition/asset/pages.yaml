  md: '# Software Testing


    An interleaved sequence of port input and output events

    A sequence of transitions in a state machine description of the system

    An interleaved sequence of object messages and method executions

    A sequence of machine instructions

    A sequence of source instances

    A sequence of MM-paths

    A sequence of ASFs (to be defined in this chapter)


    Threads have distinct levels. A unit-level thread is easily understood as an integration-time
    path of source inputs or, alternatively, as a sequence of DD-paths. An integration-level
    thread is an MM-path—that is, an alternating sequence of module execution paths
    and messages. If we continue this pattern, a system-level thread is a sequence
    of ASFs. Because ASFs have ports as their inputs and outputs, a sequence of ASFs
    implies an interleaved sequence of port input and output events. The end result
    is that threads provide a unifying view of our three levels of testing. Unit tests
    identify functions; integration testing examines interactions among units; and
    system testing examines interactions among ASFs. In this chapter, we focus on
    system-level threads and answer some fundamental questions, as, "How big is a
    thread? Where do we find them? How do we test them"


    # 14.1 Thread Possibilities


    Defining the endpoints of a system-level thread is a bit awkward. We motivate
    a tidy, graph-based definition by working backward from where we want to go with
    threads. Here are four candidate threads in our SATM system:


    +   Entry of a digit

    Entry of a personal identification number (PIN)

    A simple transaction: ATM card entry, PIN entry, select transaction type (deposit,
    withdraw), present account details (checking or savings), amount), conduct the
    operation, and return the results

    An ATM session containing two or more simple


    Digit entry is a good example of a minimal ASF. It begins with a port input event
    (the digit keystroke) and ends with a port output event (the screen echo), which
    qualifies as a stimulus/response pair. This level of granularity is too fine for
    the purposes of system testing.


    The second candidate, PIN entry, is a good example of an upper level to limit
    testing and, at the same time, a starting point of system testing. PIN entry is
    a good example of an ASF. It is also a good example of a family of stimulus/response
    behavior that is initiated by a port input event, traverses programmed logic,
    and terminates in one of possible responses (port output events). PIN entry enters
    a sequence of inputs and outputs.


    +   1. A screen requesting PIN digits.

    2. An interleaved sequence of digit keystrokes and screen responses.

    3. The possibility of cancellation by the customer before the full PIN is entered.

    4. A system disposition: a customer has three chances to enter the correct PIN.
    Once a correct PIN has been entered, the user sees the requesting transaction;
    otherwise, a screen advises the customer that the ATM card will not be returned,
    and no access to ATM functions is provided.'
