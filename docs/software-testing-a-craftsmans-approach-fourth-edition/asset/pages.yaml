    # 16.4.2 DIT–Depth of Inheritance Tree


    The name says it all. If we made another class graph to show inheritance, this
    is the length of the longest inheritance path from root to leaf node. This is
    directly derivable from a standard UML Class Inheritance Diagram. While comparatively
    large values of the DIT metric good reuse, this also increases testing difficulty.
    One strategy is to "flatten" the inheritance classes such that all inherited methods
    are in one class for testing purposes. Current guidelines recommend a limit of
    DIT = 3.


    # 16.4.3 NOC–Number of Child Classes


    The Number of Classes of a class in the inheritance diagram for the DIT metric
    is simply the outdegree of each node. This is very analogous to the cyclomatic
    complexity of the class graph.


    # 16.4.4 CBO–Coupling between Classes


    This metric is a carryover from the procedural coupling metrics to the Structured
    Analysis design technique, where coupling is increased when one unit refers to
    another unit. In the procedural version, several levels of coupling were identified.
    These can all be applied to object-oriented methods. As is the case with procedural
    code, greater coupling implies greater testing and greater maintenance difficulty.
    Well-designed classes should reduce the CBO values.


    # 16.4.5 RFC–Response for Class


    The RFC method refers to the length of the message sequence that results from
    an initial message. In Chapter 13, we say this is also the "length" of the integration-testing
    construct, the MM-path.


    # 16.4.6 LCOM–Lack of Cohesion in Methods


    The LCOM metric is another direct extension of the cohesion metric for procedural
    code. LCOM is the number of methods that use a given instance variable in the
    class, and is computed for each instance variable.


