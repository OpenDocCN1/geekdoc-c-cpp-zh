    follow a convention that the "numerator" is the event that causes the transition,
    and the "denominator" is the action that is associated with the transition. The
    events are mandatory—transitions do not just happen, but the actions are optional.
    Finite state machines are simple ways to represent situations in which a variety
    of events may occur, and their occurrences have different consequences.


    Finite state machines can be executed; however, a few conventions are needed first.
    One is the notion of the active state. We speak of a system being "in" a certain
    state; when the system is modeled as a finite state machine, the active state
    refers to the "we are in". Another convention is that finite state machines may
    have an initial state, which is the state when the finite state machine is entered.
    (Initial and final states are recognized by the absence of incoming and outgoing
    transitions, respectively.) Exactly one state can be active at any time. We also
    think of transitions as instantaneous occurrences, and events that cause transitions
    also occur one at a time. To execute a finite state machine, we start with an
    initial state and provide a sequence of events that cause transitions. As each
    event occurs, the transition changes the active state and a new event occurs.
    In this way, a sequence of events selects a path of states (or equivalently, of
    a sequence of transitions) through the machine.


