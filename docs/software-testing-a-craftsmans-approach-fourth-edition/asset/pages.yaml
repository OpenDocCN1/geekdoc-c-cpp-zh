    significant preparation time. Whereas a technical inspection meeting may last
    60 to 90 minutes, an audit may last a full day or more. Audits may be required
    by contract, and an unsatisfactory audit usually results in expensive corrective
    actions.


    # 22.3.4 Comparison of Review Types


    The main characteristics of the three review types are summarized in Table 22.1.
    Because technical inspections are the most effective at finding defects early,
    they are the focus of the remainder of this chapter.


    # 22.4 Contents of an Inspection Packet


    One of the success factors of a technical inspection is the packet of materials
    that the inspection team uses in its preparation. Each inspection packet item
    is described in the succeeding subsections. The Appendix contains a sample inspection
    packet for a case inspection.


    # 22.4.1 Work Product Requirements


    As mentioned earlier, technical inspections are valuable because they find faults
    early in the development process. In the waterfall cycle, and in many of its derivatives,
    the early phases are characterized by what/how cycles, in which one phase describes
    what must be done in the next phase, and the successor phase describes “how” it
    responds to the “what” definition. These tight what/how cycles are ideally suited
    for technical inspections; therefore, one important element in the inspection
    packet is the work product requirements. Without this, the review team will not
    be able to determine if the “how” part has actually been accomplished.


    # 22.4.2 Frozen Work Product


    Once an inspection team has been identified, each member receives the full inspection
    packet. This is a point at which three software project disciplines converge:
    development, management, and configuration management. In the configuration management
    view, a work product is called a “design item.” Once a design item has been reviewed
    and approved, it becomes a “configuration item.” Design items can be changed by
    the responsible designers (producers), but configuration items are frozen, meaning
    they cannot be changed by anyone unless they are first demonstrated


