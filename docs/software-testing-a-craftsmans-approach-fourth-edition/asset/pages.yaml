    # 10.5 Guidelines


    Here is one of my favorite testing stories. An inebriated man was crawling on
    the sidewalk beneath a streetlight. When a policeman asked him what he was doing,
    he replied that he was looking for his car keys."Did you lose them?" the policeman
    asked."No, I lost them in the parking lot, but the light is better here."


    This little story contains an important message for testers: testing for faults
    that are not likely be present is pointless. It is far more effective to have
    a good idea of the faults that are most likely (or most damaging) and then select
    testing methods that are likely to reveal these faults.


    Many times, we do not have a feeling for the kinds of faults that may be prevalent.
    When then? The best we can do is use known attributes of the program to select
    testing methods that deal with the attributes—sort of "punishment fits the crime"
    view. The attributes are most helpful in choosing specification-based testing
    methods


    Whether the variables represent physical or logical quantities

    Whether dependencies exist among the variables

    Whether single or multiple faults are assumed

    Whether exception handling is prominent


    Here is the beginning of an "expert system" to help with this:


    +   1. If the variables refer to physical quantities, boundary value testing and
    equivalence class testing are indicated.

    2. If the variables are independent, boundary value testing and equivalence class
    testing are indicated.

    3. If the variables are dependent, decision table testing is indicated.

    4. If the single-fault assumption is warranted, boundary value analysis and robustness
    testing are indicated.

    5. If the multiple-fault assumption is warranted, worst-case testing, robust worst-case
    testing, and decision table testing are indicated.

    6. If the program contains significant exception handling, robustness testing
    and decision table testing are indicated.

    7. If the variables refer to logical quantities, equivalence class testing and
    decision table testing are indicated.


    Combinations of these may occur; therefore, the guidelines are summarized as a
    decision table in Table 10.13.'
