    Figure 9.10 Simplified lattice on commission.


    +   3. Make slices for all A-def nodes. When a variable is computed by an assignment
    statement, a slice on the variable at that statement will include (portions of)
    all du-paths of the variables used in the computation. $S_{30}: S(sales, 27)$
    is a good example of an A-def slice. Similarly for variables defined by input
    statements (I-def nodes), as of $S_{10}: S(barrels, 15)$.

    4. There is not much reason to make slices on variables that occur in output statements.
    Slices on O-use variables can always be expressed as unions of slices on all the
    A-defs (and I-defs) of the O-use variable.

    5. Make slices for P-use nodes. When a variable is used in a predicate, the slice
    on that variable at the decision statement shows how the predicate variable got
    its value. This is very useful in decision-intensive programs like the triangle
    program and NextDate.

    6. Consider making slices compilable. Nothing in the definition of a slice requires
    that the set of statements is compilable; however, a set of compiler directive
    and data declaration statements is a subset of every slice. If we added this set
    of statements to all the slices we made for the commission program, our lattice
    remains undisturbed; however, each slice is separately compilable (and therefore
    executable). In Chapter 1, we suggested that good testing practices lead to better
    programming practices. Here, we have a good example. If we did, we would code
    a slice and test it. We then code and test those slices and merge them (sometimes
    called “slice splicing”) into a fairly solid program. This is done in Section
    9.2.3.'
