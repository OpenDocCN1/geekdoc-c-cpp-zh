  md: '![](img/caa3a36b6e8a0f28e72c4d26c243e580_241_0.png)


    **Figure 11.3** Iterative development.


    because of the well-known ripple effect of changes to an existing system. (The
    industrial average is one in five introduces a new fault.)


    Barry Boehm''s spiral model has some flavor of the evolutionary model. The biggest
    difference is that the increments are determined more on the basis of risk than
    on client suggestions. The spiral is superposed on an x-y coordinate plane, with
    the upper left quadrant to risk analysis, the lower right refers to development
    (test), and the lower left is for planning the next iteration. These four phases—determine
    objectives, analyze risk, develop and test, and next iteration planning—are repeated
    in an evolutionary way. At each iteration, the spiral steps.


    There are two views of regression testing: one is to simply repeat the tests from
    the previous iteration; the other is to divide a smaller set of test cases focused
    on affecting faults. Repeating a full set of previous tests is fine in an automated
    testing environment, but is undesirable in a more manual environment. The expectation
    of test failure is (or lower) for regression testing compared to that progression
    testing. As a guideline, regression tests might fail in only 5% of the repeated
    progression tests. This may increase to 20% for progression tests. If regression
    tests are performed manually, there is an interesting term for special regression
    test cases: Soap Opera Tests.


    The idea is to have long, complex regression tests, akin to the complicated plot
    lines in television soap operas. A soap opera test case could fail in many ways,
    whereas a progression test case should fail for only a very few reasons. If a
    soap opera test case fails, clearly more focused testing is required to localize
    the fault. We will see this again in Chapter 20 on all-pairs testing.'
