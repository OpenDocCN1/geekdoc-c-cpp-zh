    # 17.2.4 The Rock Solid Federal Credit Union (Virtual)


    The hypothetical Rock Solid Federal Credit Union (RSFCU) is a small credit union
    organized under the auspices of the U.S. government. All credit unions are non-profit
    organizations that exist to serve their members. Member services include


    +   - Opening and closing accounts

    - Making loans (mortgage, home equity, auto/boat, and signature)

    - Credit counseling


    In addition, there are administrative functions, including


    +   - Staff management (salary, work assignments, hire/fire responsibilities)

    - Interfacing with the board of directors

    - Public relations


    Because the RSFCU is federally chartered, there are levels of government control
    and responsibilities, including local, state, and federal interfaces. To conduct
    its business, the RSFCU works with several constituent systems. The major ones
    are shown in Figure 17.5.


    The RSFCU is a virtual system of systems because each of the constituent systems
    can, in some cases, makes demands on the credit union. In turn, the credit union
    can make demands on some of the other constituents. Each of the constituents has
    administrative autonomy, but there are also established patterns of collaboration.
    To make a mortgage loan, for example, all of the parties except the Federal Reserve
    Bank are involved.


