  md: '# 17.4.2 New Prompts as Swim Lane Petri Nets


    The directed and acknowledged systems of systems are characterized by a strong,
    usually central, controlling constituent. Collaborative and virtual systems of
    systems do not have this strong position; the constituents are more autonomous.
    Can a constituent in one of these systems control another? Certainly, it is more
    likely that the communication is more collaborative than controlling. Four new
    primitives have been proposed to capture this more collaborative communication—Request,
    Accept, Reject, and Postpone. As with the ESML prompts, they can and should interact.


    Parallel activities are shown in UML as “swim lanes” to connote that a swimmer
    in one lane is separated from a swimmer in an adjacent lane. In Section 17A.1,
    we mapped each of the ESML prompts into Petri nets. We understand swim lanes to
    be device oriented, very similar to the orthogonal regions of StateCharts. More
    specifically, we will use swim lanes to represent constituents, and the communication
    prompts to represent the types of communication among constituents. Finally, we
    illustrate the systems of communication using Swim Lane Petri Nets on the November
    1999 incident. In this subsection, the constituent systems are all members of
    either collaborative or virtual systems of systems.


    # 17.4.2.1 Request


    In Figure 17.13, constituent A requests a service from constituent B, and receives
