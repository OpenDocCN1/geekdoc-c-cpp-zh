    We can also define two coverage metrics based on port output events:


    +   - Port Output 1: each port output event occurs

    - Port Output 2: each port output event occurs for each cause


    Port Output 1 coverage is an acceptable minimum. It is particularly effective
    when a system has a rich variety of output messages for error conditions. (The
    SATM system does not.) Port Output 2 coverage is a good quality but it is hard
    to quantify. For now, note that Port Output 2 refers to threads that interact
    with respect to a port output event. Usually, a given output only has a small
    number of causes. In the SATM system, screen 10 might display for three reasons:
    the terminal might be out of cash, it may be impossible to make a connection with
    the central bank to get the account balance, or the withdrawal door be jammed.
    In practice, some of the difficult faults found in field reports are those which
    an output occurs for an unexpected cause. Here is example: My ATM system (not
    the SATM) has a screen that informs me "Your withdrawal limit has been reached."
    This screen would occur when I attempt to withdraw more than $300 in one day.
    When I see this, I would assume that my wife has a major withdrawal (thread interaction),
    so I request a lesser amount. I found out that the ATM also produces this when
    the amount of cash in the dispenser is low. Instead of providing a lot of cash
    to the first users, the central banks could provide less to more users.


    # 14.7.2.2 Port-Based Thread Testing


    Port-based testing is a useful complement to event-based testing. With port-based
    testing, we ask, for each port, what events can occur at that port? We then seek
    to exercise inputs and output ports with respect to the lists for each port. (This
    presumes such event lists have been specified; requirements techniques mandate
    such lists.) Port-based testing is particularly useful for systems in which the
    port devices come from external suppliers. The main reason for port-based testing
    can be seen in the E/R model of the basis constructs (Figure 14.3). The many-to-many
    relationship between devices and events should be exercised in direct directions.
    Conversely, port-based testing covers the one-to-many relationship from ports
    to events. The SATM system fails at this point—no SATM event occurs more than
    one port.


    # 14.8 Supplemental Approaches to System Testing


    All model-based testing approaches have been open to the criticism that the testing
    is only as good as the underlying model. There is no escaping it. In response,
    some authorities recommend various "random" supplements. Two such techniques,
    mutation testing and fuzzing, are discussed in Chapter 21. In this section, we
    consider two fallback strategies, each with thread execution probability as a
    starting point. Both operational profiling and risk-based testing are responses
    to the "squeeze" on available system testing time.


    # 14.8.1 Operational Profiles


    In its most general form, Zipf''s law holds 80% of the activities occur in 20%
    of the space. Activities and space can be interpreted in numerous ways: people
    with messy desks have every'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# 280 Software Testing


    use of their desktop clutter; programmers seldom use more than 20% of the features
    of their favorite programming language, and Shakespeare (whose writings contain
    an enormous vocabulary) uses a small fraction of his vocabulary most of the time.
    Zipf''s law applies to software (testing) in several ways. The most useful interpretation
    for testers is that the space consists of all possible threads, and activities
    are executions (or traversals). Thus, for a system with many threads, 80% of the
    execution traverses 20% of the threads.


    Recall that a failure occurs when a fault is executed. The whole idea of testing
    is to execute cases such that, when a failure occurs, the presence of a fault
    is revealed. We can make an important distinction: the distribution of faults
    in a system is only directly related to the reliability of the system. The simplest
    view of system reliability is the probability that no failure occurs during a
    specific time interval. (Notice that no mention is even made of faults, number
    of faults, or fault density). If the only faults are in “corners” on threads that
    are seldom traversed, the overall reliability is higher than the same number of
    faults were on “high-traffic” threads. The idea of operational profiles is to
    define the executions of various threads and to use this information to select
    threads for system testing. Particularly when test time is limited (usually),
    operational profiles maximize the probability of finding faults by inducing failures
    in the frequently traversed threads. Here we use our SATM system. In Figure 14.13,
    the short case labels on the transitions in Figure 14.12 are replaced by estimated
    transition.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_310_0.png)


    Figure 14.13 Transition probabilities in SATM finite state machine of Figure 14.12.


