  md: '# System Testing ■ 255


    Several stimulus/response pairs are evident, putting ASFs clearly in the domain
    of system-level testing. Other examples of ASFs include card entry, transaction
    selection, provision of transaction details, transaction reporting, and session
    termination. Each of these is maximal in an integration testing sense and minimal
    in a system testing sense. That is, we would not want to integration something
    larger than an ASF; at the same time, we would not want to test anything as part
    of system testing.


    The third candidate, the simple transaction, has a sense of “end-to-end” completion.
    A customer could never execute PIN entry alone (a card is entered), but the simple
    transaction is commonly executed. This is a good example of a system-level thread;
    note that it involves the interaction of several ASFs.


    The last possibility (the session) is actually a sequence of threads. This is
    also a proper property of system testing; at this level, we are interested in
    the interactions among threads. Unfortunately, most system testing efforts never
    reach the level of thread interaction.


    # 14.1.2 Thread Definitions


    We simplify our discussion by defining a new term that helps us get to our desired
    goal.


    # Definition


    An Atomic System Function (ASF) is an action that is observable at the system
    level in terms of port input and output events.


    In an event-driven system, ASFs are separated by points of event quiescence; these
    occur when a system is (nearly) idle, waiting for a port input to trigger further
    processing. Event quiescence has an interesting Petri net insight. In a traditional
    Petri net, deadlock occurs when no transition is enabled. In an Event-Driven Petri
    Net, event quiescence is similar to deadlock; but an event input can bring new
    life to the net. The ATM system exhibits event quiescence in several places: one
    is the tight loop at the beginning of an ATM session, where the system displayed
    the welcome screen and is waiting for a card to be entered into the card slot.
    Event quiescence is a system-level property; it is a direct analog of message
    quiescence at the integration level.


    The notion of event quiescence does for ASFs what message quiescence does for
    MM-paths—provides a natural endpoint. An ASF begins with a port event and terminates
    with a output event. When viewed from the system level, no reasoning exists to
    decompose an ASF into lower levels of detail (the atomicity). In the ATM system,
    digit entry is a good example of an ASF—so are card entry, dispensing, and session
    closing. PIN entry is probably too big; perhaps we should call it a molecular
    system function.


    Atomic system functions represent the seam between integration and system testing.
    They are the largest item to be tested by integration testing and the smallest
    item for system testing. We can test an ASF at both levels. We will revisit the
    integrationNextDate program to find ASFs in Section 14.10.


    # Definition


    A system defined in terms of ASFs, the ASF graph of the system is the directed
    graph in which nodes are ASFs and edges represent sequential flow.


    © 2010 Taylor & Francis Group, LLC'
