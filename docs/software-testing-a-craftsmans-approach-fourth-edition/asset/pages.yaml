    The most common products for model-based testing (Jorgensen, 2009) start with
    a finite state machine description of the system to be tested and generate all
    paths through the graph. If there are loops, these are (or should) replaced by
    two paths, as we did at the program graph level in Chapter 8. Given such a path,
    the port inputs that cause transitions are in a system test case; similarly for
    port outputs that occur as on transitions.


    Here is a lesson from industrial experience. A telephone switching system laboratory
    tried defining a small telephone system with finite state machines. The system,
    a Private Automatic Branch Exchange (PBX), was chosen because, as switching systems
    go, it is quite simple. There was a grizzled veteran tester, Casimir, assigned
    to help with the development of the model. He was well named. According to Wikipedia,
    his name means ''someone who destroys opponent''s prestige/glory during battle''
    (http://en.wikipedia.org/wiki/Casimir). Casimir was very suspicious, untrusting.
    The team reassured him that, once the project was finished, a tool would generate
    literally thousand test cases. Even better, with a provided mechanism to trace
    system testing directly to the requirements specification model. The actual finite
    state machine had more than 200 states, and the tool generated more than 3000
    tests. Casimir was impressed, until one day when he discovered an automatically
    generated test case that was logically impossible. On further, very detailed analysis,
    the invalid test case was derived from a pair of states that had a stub dependency
    (and finite state machines have independent states). Out of 200-plus states, recognizing
    such dependencies is extremely difficult. The team explained to Casimir that the
    tool could analyze any thread that traversed the pair of dependent states was
    short-lived, however, when Casimir asked if the tool could identify other pairs
    of dependencies. No state could do this because it would be equivalent to the
    false Halting Problem. The lesson: generating threads from finite state machines
    is attractive, and can be quite effective; however, care must be taken to avoid
    both memory and dependence issues.


