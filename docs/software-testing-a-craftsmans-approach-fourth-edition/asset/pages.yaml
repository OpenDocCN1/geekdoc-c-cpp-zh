  md: '# Chapter 2


    # Examples


    Three examples will be used throughout Chapters 5 through 9 to illustrate the
    various unit testing methods: the triangle problem (a venerable example in testing
    circles); a logically complex function, NextDate; and an example that typifies
    MIS applications, known here as the commission problem. Taken together, these
    examples raise most of the issues that testing craftsmen will encounter at the
    unit level. The discussion of higher levels of testing in Chapters 11 through
    17 uses four other examples: a simplified version of an automated teller machine
    (ATM), known here as the simple ATM system (SATM); the currency converter, an
    event-driven application typical of graphical user interface (GUI) applications;
    and the windshield wiper control device of the Saturn automobile. A garage door
    controller, illustrates some of the issues of “systems of systems.”


    For the purposes of code-based testing, pseudocode implementations of the three
    unit-level examples are given in this chapter. System-level descriptions of the
    SATM system, the currency converter, the Saturn windshield wiper system, and the
    garage door controller are given in Chapters 11 through 17. These applications
    are modeled with finite-state machines, variations of event-driven petri nets,
    selected StateCharts, and with the Universal Modeling Language (UML).


    # 2.1 Generalized Pseudocode


    Pseudocode provides a language-neutral way to express program source code. This
    version is loosely based on Visual Basic and has constructs at two levels: unit
    and program components. Units can be interpreted either as traditional components
    (procedures and functions) or as object-oriented components (classes and objects).
    This definition is somewhat informal; terms such as expression, variable list,
    and field description are used with no formal definition. Items in angle brackets
    indicate language elements that can be used at the identified positions. Part
    of the value of any pseudocode is the suppression of unwanted detail; here, we
    illustrate this by allowing natural language phrases in place of more formal,
    complex condi-tions'
