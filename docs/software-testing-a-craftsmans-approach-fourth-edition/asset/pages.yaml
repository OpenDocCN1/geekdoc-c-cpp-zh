    # 2.2 The Triangle Problem


    The triangle is the most widely used example in software testing literature. Some
    of the more notable entries in three decades of testing literature are Gruenberger
    (1973), Brown and Lipov (1975), Myers (1979), Pressman (1982) and subsequent editions,
    Clarke and Richardson (1983, 1984), Cheappella (1987), and Hetzel (1988). There
    are others, but this list makes the point.


    # 2.2.1 Problem Statement


    **Simple version:** The triangle problem accepts three integers, a, b, and c,
    as input. These are taken to be sides of a triangle. The output of the program
    is the type of triangle determined by the sides: Equilateral, Isosceles, Scalene,
    or NotTriangle. Sometimes, this problem is extended to include right triangles
    as a fifth type; we will use this extension in some of the exercises.


    **Improved version:** The triangle problem accepts three integers, a, b, and c,
    as input. These are taken to be sides of a triangle. The integers a, b, and c
    must satisfy the following conditions:'
