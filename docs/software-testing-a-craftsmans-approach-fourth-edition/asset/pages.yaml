    # 4.3.2 Finite State Machines


    Finite state machines have a fairly standard notation for requirements specification.
    The real-time executions of structured analysis use some finite state machine,
    and nearly all forms of object-oriented analysis require them. A finite state
    machine is a directed graph where states are nodes and transitions are edges.
    Source and sink states become initial and terminal nodes, sequences of transitions
    are modeled as paths, and so on. Most finite state notations add information to
    the edges (transitions) to indicate the cause of the transition and actions that
    occur as a result of the transition.


