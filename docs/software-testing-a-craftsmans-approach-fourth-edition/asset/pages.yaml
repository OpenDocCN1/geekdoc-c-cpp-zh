    # 15.5 Object-Oriented System Testing


    System testing is (or should be) independent of system implementation. A tester
    does not really need to know if the implementation is procedural or object-oriented
    code. As we saw in Chapter 14, the primitives of system testing are port input
    and output events, and we know how to express system-level threads are EDPNs.
    The issue is to identify which threads to be used as test cases. In Chapter 14,
    we used the requirements specification models, particularly the behavioral models,
    as base of test case identification. We also discussed peudosostructural coverage
    metrics in terms of the underlying behavioral models. In a sense, this is very
    object-oriented: we inherit many ideas from system testing of traditional software.
    The only real difference in this chapter is that we profane the system has been
    defined and refined with the UML. One emphasis, then, is finding system-level
    test cases from standard UML models. At the system level, as we saw in Chapter
    14, a UML description is composed of various levels of use cases, a use case diagram,
    class definitions, and class diagrams.


