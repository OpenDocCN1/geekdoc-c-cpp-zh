    - Regional ambulance services

    - Heavy (tree moving) equipment from the public utility companies

    - The Indiana National Guard

    - Traffic helicopters from Indianapolis television stations

    - The US Weather Bureau

    - (And probably many others)


    Consider how this all happened. How did these disparate groups come together for
    an emergency? How did they communicate? Was there any central coordination?


    Systems of systems have become an increasingly important topic in several areas
    of software engineering. In this chapter, we look at some of the early definitions
    (Maier, 1999), some SysML'
