    | Binary (two operands) | AND(∧), OR(∨), XOR(@) |

    | Short circuit operators | AND (AND–THEN), OR (OR–ELSE) |

    | Relational operators | =, #, <, >, ≥ |


    In mathematical logic, Boolean expressions are known as logical expressions, where
    a logical expression can be


    +   1. A simple proposition that contains no logical connective

    2. A compound proposition that contains at least one logical connective


    Synonyms: predicate, proposition, condition.

    In programming, Chilenski''s Boolean expressions appear as conditions in decision
    making statements: If-Then, If-Else, If-ElseIf, Case/Switch, For, and Until loops.
    This subsection is concerned with the testing for compound conditions. Compound
