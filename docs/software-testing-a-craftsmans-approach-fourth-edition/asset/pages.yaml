    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_99_0.png)


    Figure 4.8 Marked Petri net.


    The set M is called the marking set of the Petri net. Tokens of M are n-tuples,
    where n is the number of places in the set P. For the Petri net in Figure 4.7,
    the set M contains elements of the form <n1, n2, n3, n4, n5>, where the n’s are
    associated with the respective places. The number associated with a place refers
    to the number of tokens that are said to be “in” the place. Tokens are abstractions
    that can be interpreted in modeling situations. For example, tokens might refer
    to the number of times a place has been used, or the number of things in a place,
    or whether the place is true. Figure 4.8 shows a marked Petri net.


    # Definition


    A transition in a Petri net is enabled if at least one token is in each of its
    input places.

    The marking tuple for the marked Petri net in Figure 4.8 is <1, 1, 0, 2, 0>. We
    need the concept of tokens to make two essential definitions. No enabled transitions
    are in the marked Petri net in Figure 4.8. If we put a token in place p5, then
    transition t2 would be enabled.


    # Definition


    In an enabled Petri net transition fires, one token is removed from each of its
    input places and one token is added to each of its output places.

    In Figure 4.9, transition t2 is enabled in the left net and the right net. The
    marking sequence for the net in Figure 4.9 contains two tuples—the first shows
    when when t2 is enabled, and the second shows when after t2 has fired:


    ```

    M = <1, 1, 0, 2, 1>, <1, 0, 0, 3, 0>

    ```


    Tokens may be created or destroyed by transition firing. Under special conditions,
    the total number of tokens in a net never changes; such nets are conservative.
    We usually do not worry about token conservation. Markings let us execute Petri
    nets in much the same way that we execute finite state machines. (It turns out
    that finite state machines are a special case of Petri nets.)


