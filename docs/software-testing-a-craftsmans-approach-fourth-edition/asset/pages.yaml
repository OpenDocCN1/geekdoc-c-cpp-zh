    # 5.1 Normal Boundary Value Testing


    All forms of boundary value testing focus on the boundary of the input space to
    identify test cases. The rationale behind boundary value testing is that errors
    tend to occur near the extreme values of an input variable. Loop conditions, for
    example, may test for < when they should test for <= and counters often “off by
    one.” (Does counting at zero or at one?) The basic idea of boundary value testing
    is to use input variables at their minimum, just above the minimum, a nominal
    value, just below them, and at their maximum. A commercially available testing
    tool (originally named T) generates test cases for properly specified program.
    This tool has been successfully integrated with two popular front-end CASE tools
    (Teamwork from Cadre Systems, and Software with Pictures from Aonix [part of Ategol);
    for more information, see http://www.aonix.com/pdf/2140-AON.pdf). The T refers
    to these values as min,, nom, max-, and max. The robust format adds two values,
    min- and max-.


    The next part of boundary value analysis is based on a critical assumption; it
    is known as the “single fault” assumption in reliability theory. That failures
