  md: "# Software Testing\n\n# 4.3.3 Petri Nets\n\nPetri nets were the topic of Carl\
    \ Adam Petri’s PhD dissertation in 1963; today, they are the accepted model for\
    \ protocols and other applications involving concurrency and distributed processing.\
    \ Petri nets are a special form of directed graph: a bipartite graph. A bipartite\
    \ graph has two sets of nodes, $V_1$ and $V_2$, and a set of edges $E$, with the\
    \ restriction that every edge has its initial node in one of the sets $V_1$, $V_2$,\
    \ and its terminal node in the other). In a Petri net, one of the sets is referred\
    \ to as “places,” and the other is referred to as “transitions.” These sets are\
    \ usually denoted as $P$ and $T$. Places are inputs to outputs of transitions;\
    \ the input and output relationships are functions, and they are usually denoted\
    \ as In and Out, as in the following definition.\n\n# Definition\n\nA Petri net\
    \ is a bipartite directed graph $(P, T, In, Out)$, in which $P$ and $T$ are disjoint\
    \ sets of nodes, and In and Out are sets of edges, where $In \\subseteq P \times\
    \ T$, and $Out \\subseteq T \times P$.\nFor the simple Petri net in Figure 4.7,\
    \ the sets $P, T, In,$ and Out$ are\n\n```\n$P = \\{p_1, p_2, p_3, p_4, p_5\\\
    }$$\nnT = \\{t_1, t_2, t_3\\}$$\nIn = \\{<p_1, t_1>, <p_3, t_1>, <p_5, t_3>, <p_2,\
    \ t_3>, <p_3, t_2>$\\nOut = \\{<t_1, p_3>, <t_2, p_4>, <t_3, p_4>\\}$\n```\n\n\
    Petri nets are executable in more interesting ways than finite state machines.\
    \ The next few definitions lead us to Petri net execution.\n\n# Definition\n\n\
    A marked Petri net is a 5-tuple $(P, T, In, Out, M)$ in which $(P, T, In, Out)$\
    \ is a Petri net and $M$ is a set of mappings of places to positive integers.\n\
    \n![](img/caa3a36b6e8a0f28e72c4d26c243e580_98_0.png)\n\nFigure 4.7 Petri net."
