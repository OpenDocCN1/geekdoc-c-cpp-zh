  md: '# 13.3 Path-Based Integration


    Much of the progress in the development of mathematics comes from an elegant pattern:
    have a clear idea of where you want to go, and then define the concepts that take
    you there. We do this for path-based integration testing, but first we need to
    motivate the motions.


    We already know that the combination of structural and functional testing is highly
    desirable at the unit level; it would be nice to have a similar capability for
    integration (and system) testing. We also know that we want to express system
    testing in terms of behavioral. Lastly, we revise our goal for integration testing
    instead of testing interfaces among separately developed and tested units, we
    focus on interactions among these units. (“Co-functioning” might be a good term.)
    Interfaces are structural; interaction is behavioral.


    When a unit executes, some path of source statements is traversed. Suppose that
    a call goes to another unit such a path. At that point, control is passed from
    the calling unit to the called unit, where some other path of source statements
    is traversed. We deliberately ignored this situation in Chapter 8, because this
    is a better place to address the question. Two possibilities are available: abandon
    the single-entry, single-exit precept and treat such calls as an exit followed
    by an entry, or suppress the call statement before control eventually returns
    to the calling unit anyway. The suppression choice works well for unit testing,
    but is antithetical to integration testing.


    # 13.3.1 New and Extended Concepts


    To get where we need to go, we need to refine some of the program graph concepts.
    As before, these refer to programs written in an imperative language. We allow
    statement fragments to be a complete statement, and statement fragments are nodes
    in the program graph.


    # Definition


    A source node in a program is a statement fragment when program execution begins
    or resumes. The first executable statement in a unit is clearly a source node.
    Source nodes also occur immediately after nodes that transfer control to other
    units.


    # Definition


    A sink node in a unit is a statement fragment at program execution terminates.
    The final executable statement in a program is clearly a sink node; so are statements
    that transfer control to other units.


    # Definition


    A module execution path is a sequence of statements that begins with a source
    node and ends with a sink node, with no intervening sink nodes.


    The effect of the definitions so far is that program graphs now have multiple
    source and sink nodes. This would greatly increase the complexity of unit testing,
    but integration testing presumes unit testing is complete.'
