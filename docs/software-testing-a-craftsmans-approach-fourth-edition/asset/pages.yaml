    # 4.2.6 n-Connectedness


    Connectedness of ordinary graphs extends to a rich, highly explanatory concept
    for digraphs.


    # Definition


    Two nodes $n_i$ and $n_j$ in a directed graph are


    +   - 0-connected iff no path exists between $n_i$ and $n_j$

    - 1-connected iff a semipath but no path exists between $n_i$ and $n_j$

    - 2-connected iff a path exists between $n_i$ and $n_j$

    - 3-connected iff a path goes from $n_i$ to $n_j$, and a path goes from $n_j$
    to $n_i$


    No degrees of connectedness exist.

    We need to modify our continuing example to show 3-connectedness. The change is
    the addition of a new edge $e_6$, from $n_6$ to $n_5$, so the graph contains a
    cycle.

    With this, we have the following instances of n-connectivity in Figure 4.3 (not
    all are listed):


    +   - $n_1$ and $n_7$ are 0-connected

    - $n_2$ and $n_6$ are 1-connected

    - $n_1$ and $n_6$ are 2-connected

    - $n_3$ and $n_6$ are 3-connected


    In terms of one-way streets, you cannot get from $n_2$ to $n_6$.'
