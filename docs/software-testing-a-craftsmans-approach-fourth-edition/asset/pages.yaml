    | 16 | >$10K | Swiss francs | ~Compute | ? |


    There is a more subtle problem with the All Pairs algorithm—the order of inputs
    can make a surprising difference, even though it should be irrelevant. Table 20.7
    just changes the order of US dollar inputs, and the resulting test cases are in
    Table 20.8. With this slight change, two currency conversions are performed (to
    British pounds and to Swiss francs), but only error messages 3, 4, and 5 are generated.


    The change is caused by the way in which the algorithm picks pairs of variables.
    The early test cases contain the greatest number of pairs, and the later ones
    contain the fewest. This means


    Table 20.7 Allpairs.exe Input in Different Order


    | US Dollar | Currency | Operation |

    | <$0 | Euros | Compute |

    | $1–$10K | Pounds | Clear All |

    | >$10K | Swiss francs | Quit |

    | No entry | Nothing selected | |'
