  md: '# # Preface to the First Edition


    # ## Software Testing: A Craftsman''s Approach


    We huddled around the door to the conference room, each taking a turn looking
    through the small window. Inside, a recently hired software designer had spread
    source listings on the conference table, and carefully passed a crystal hanging
    from a long chain over the source code. Every so often, the designer marked a
    circle in red on the listing. Later, one of my colleagues asked the designer what
    he had doing in the conference room. The nonchalant reply: "Finding the bugs in
    my program." This is a true story, it happened in the mid-1980s when people had
    high hopes for hidden powers in crystals.


    In a sense, the goal of this book is to provide you with a better set of crystals.
    As the title suggests, I believe that software (and system) testing is a craft,
    and I think I have some mastery of craft. Out of a score of years developing telephone
    systems, I spent about a third of that time on testing: defining testing methodologies
    and standards, coordinating system for a major international toll switch, specifying
    and building two test execution tools (now we would call CASE tools), and a fair
    amount of plain, hands-on testing. For the past seven years, I have been teaching
    software engineering at the university level. My academic research on center and
    specification. Adheres to the Oxford Method that you never learn something until
    you have to teach it—I think they are right. In my graduate course on testing
    are all full-time employees in local industries. Believe me, they keep you honest.
    This book is an outgrowth of my lectures and projects in that class.


    I think of myself as a software engineer, but when I compare the level of precision
    and depth of knowledge prevalent in my field to more traditional engineering disciplines,
    I am uncomfortable with the term. A colleague and I returned to our office in
    Italy when Myers'' book, *The Art of Software Testing*, came out. On the way to
    the airport, we stopped at the MIT bookstore and bought one of the early copies.
    In the intervening 15 years, I believe we moved from an art to a craft. I had
    originally planned to title this book *The Craft of Software Testing*, as I feared
    the final chapters, another book with that title appeared. Maybe that bears confirmation
    that software testing is becoming a craft. There''s still a way to go before it
    is a science.


    Part of any craft is knowing the capabilities and limitations of both the tools
    and the medium. A good woodworker has a variety of tools and, depending on the
    item being made and the wood being used, knows which tool is the most appropriate.
    In all phases of the traditional Waterfall Model of the software development life
    cycle, testing is the most amenable to precise analysis.'
