  md: '# # Chapter 1


    # ## Perspective on Testing


    Why do we test? The two main reasons are to make a judgment about quality or acceptability
    and to discover problems. We test because we are fallible—this is especially true
    in the domain of software and software-controlled systems. The goal of this chapter
    is to create a framework within which we can examine software testing.


    # ### 1.1 Basic Definitions


    Much of testing literature is mired in confusing (and sometimes inconsistent)
    terminology, because testing technology has evolved over decades and via scores
    of writers. The International Software Testing Qualification Board (ISTQB) has
    an extensive glossary of testing terms (see the website http://www.istqb.org/downloads/glossary.html).
    The terminology here (and throughout this book) is compatible with the ISTQB definitions,
    and they, in turn, are compatible with the standards developed by the Institute
    of Electronics and Electrical Engineers (IEEE) Computer Society (IEEE, 1983).
    To get started, here is a useful progression of terms.


    **Error**—People make errors. A good system is minded. When people make mistakes
    while coding, we call these mistakes bugs. Errors tend to propagate; a requirement
    may be magnified during design and amplified still during coding.


    **Fault**—A fault is the result of an error. It is more precise to say that a
    fault is the representation of an error, where representation is the mode of expression,
    as native text, Unified Modeling Diagrams, hierarchy charts, and source code.
    **Defect** (see the ISTQB Glossary) is a good synonym for fault, as an omission
    in which something is missing that should be present in the representation. suggests
    a useful refinement; when we speak of faults of commission and faults of omission.
    A fault of commission occurs when we enter something into a representation that
    is incorrect. Faults of omission occur when we fail to enter correct information.
    Of these two types, faults of omission are more difficult to detect and resolve.


    **Failure**—A failure occurs when the code corresponding to a fault executes.
    Two subtleties arise here: one is that failures only occur in an executable representation,
    which is usually taken to be source code, or more precisely, object code; the
    second subtlety is that this definition'
  merge: -1
