    # 3.2.2 Function Types


    Functions are further described by particulars of the mapping. In the definition
    below, we start with a function $f: A \rightarrow B$, and we define the set


    ```

    $f(A) = \{b_i \in B; b_i = f(a_i) \text{ for some } a_i \in A\}$

    ```


    This set is sometimes called the image of $A$ under $f$.


    # Definition


    $f$ is a *function* from $A$ *onto* $B$ iff $f(A) = B$

    $f$ is a *function* from $A$ *into* $B$ iff $f(A) \subset B$ (note the proper
    subset here!)

    $f$ is a *one-to-one function* from $A$ to $B$, iff for all, $a_i, a_j \in A,
    a_i \neq a_j, \Rightarrow f(a_i) \neq f(a_j)$

    $f$ is a *many-to-one function* from $A$ to $B$, if there exists $a_i, a_j \in
    A, a_i \neq a_j$, such that $f(a_i) = f(a_j)$.


    Back to plain English, if we fix a function from $A$ onto $B$, we know that every
    element of $B$ is associated with some element of $A$. If we fix a function from
    $A$ into $B$, we know there is at least one element of $B$ that is not associated
    with an element of $A$. One-to-one functions guarantee a form of uniqueness: distinct
    domain elements are never mapped to the same range element.(Notice this is the
    inverse of the "well-behaved" attribute earlier). If a function is not one-to-one,
    it is many-to-one; that is, more than one domain element can be mapped to the
    same range element. In these terms, the well-behaved requirement prohibits functions
    from being many-to-one. Testers familiar with relational databases will recognize
    all these possibilities (one-to-one, one-to-many, many-to-one, and many-to-many)
    are allowed for relations.


