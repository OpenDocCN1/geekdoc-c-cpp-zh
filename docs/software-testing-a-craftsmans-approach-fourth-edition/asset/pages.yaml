    # 14.6.3 Incidence with All Port Events


    In practice, the incidence approach needs to be done for all port-level events.
    This is just a combination of the discussions in Sections 16.2.1 and 16.2.2. One
    advantage of the full port event matrix is that it can be reordered in useful
    ways. For example, the short cases can be placed together, or possibly listed
    in a sensible transaction-based order. The port events can also be permuted into
    comutive subgroups, for example, input events related to PIN entry, or output
    events related to deposits.


    # 14.6.4 Incidence with Classes


    There is a perennial debate among object-oriented developers as how to begin—use
    cases first, or classes first. One of my colleagues (a very classy person) insists
    on the class-first approach, while others are more comfortable with the use case
    first view. A good compromise is develop an incidence matrix showing which classes
    are needed to support which use cases. Often, it is easier to identify classes
    for a use case, rather than for a full system. With the other incidence matrices,
    this approach provides a good answer when a sufficient set of classes has been
    identified.


    # 14.7 Coverage Metrics for System Testing


    In Chapter 10, we saw the advantage of combining specification-based and code-based
    testing techniques, because they are complementary. We are in the same position
    now with system testing. The model–based approaches of Section 14.3 be combined
    with the case–based approaches of Section 14.4. Further, the incidence matrices
    of Section 14.6 can be used as a basis for specification-based test coverage metrics.


    # 14.7.1 Model-Based System Test Coverage


    We can use model-based metrics as a cross-check on use–case threads in the same
    way that we used DDpaths at the unit level to identify gaps and redundancies in
    specification-based test cases. We have pseudostructural testing (Jorgensen, 1994)
    the node and edge coverage metrics are defined in terms of a model of a system,
    not derived from the system implementation. In general, behavioral models are
    only approximations of a system''s reality, which is why we decompose our models
    down to level of detail. If we made a true complete model, its size and complexity
    would make it too cumbersome to use. The big weakness of model-based metrics is
    that the underlying model may be a poor choice. The three most common behavioral
    models (decision tables, finite state machines, and Petri nets) are appropriate
    to transformational, interactive, and concurrent systems, respectively.


    Decision tables and finite state machines are good for ASF testing. If an ASF
    is described using a decision table, conditions typically include input port events,
    and actions are port output events. We can then test cases that cover every event,
    every action, or most completely, every rule. For finite state models, test cases
    can cover every state, every transition, or every path.


    Thread testing based on decision tables is cumbersome. We might describe threads
    as sequences from different decision tables, but this becomes very messy to track
    in terms of coverage. We need finite state machines as a minimum, and if any form
    of interaction occurs, Petri nets are a better choice. There, we can devise threads
    that cover every place, every transition, and every sequence of transitions.


    © 2010 Taylor & Francis Group, LLC'
