    # 22.4.3 Standards and Checklists


    When given a work product to inspect, how does a reviewer know what to do? What
    to look for? In a mature inspection process, the organization has checklists appropriate
    to the various work products to inspections. A checklist identifies the kinds
    of problems that a reviewer should look for. Checklists are refined over time,
    and many companies consider their inspection checklists to be proprietary information.
    (Who would like to share with what the product weak points and concerns are?)


    A good checklist is modified as it is used. In fact, one inspection agenda item
    can be to ask whether any changes in the checklist are needed. Checklists should
    be public in a development organization. One benefit is that checklists can improve
    the development process. This is very similar to the use of grading rubrics in
    the academic world. If students know the grading criteria, they are much more
    likely to submit a better assignment. When developers create a checklist, they
    know historical situations have been fault-prone, and therefore they can proactively
    deal with these potential problems.


    There is a wealth of material to get with developing checklists. One paper (http://portal.acm.com/citation?id=308798)
    surveys 117 checklists from 24 sources. Different categories of checklist items
    are discussed and are provided of good checklist items as well as those that should
    be avoided. Karl Weigers website is another good source for checklists (http://www.processimpact.com/pr_goodies.shtml).


    Applicable standards play a role similar to checklists. Development organizations
    may have code-naming standards, for example, or required templates for test case
    definition. Conformance to applicable standards is usually required, and is therefore
    easy item on an inspection list. With checklists, standards may be subject to
    change, albeit more slowly.


