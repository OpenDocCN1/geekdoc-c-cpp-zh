    The physical quantity criterion is equally important. When a variable refers to
    a physical quantity, such as temperature, pressure, air speed, angle of attack,
    load, and so forth, physical boundaries can be extremely important. (In an example
    of this, Sky Harbor International Airport in Phoenix had to close on June 26,
