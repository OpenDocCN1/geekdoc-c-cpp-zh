    Class wiper(wiperSpeed)\n    setWiperSpeed(newSpeed)\n```\n\nThe lever and dial\
    \ classes have operations that sense physical events on their respective devices.\
    \ When these methods (corresponding to the operations) execute, they report their\
    \ respective device positions to the wiper class. The interesting part of the\
    \ windshield wiper system is that the lever and the dial are independent devices,\
    \ and they interact when the lever is in the INT (intermittent) position.\n\n\
    The precept of encapsulation requires that classes only know about and operate\
    \ on their own. Thus, the lever does not know the dial position, and the dial\
    \ does not know the lever position. The problem is that the wiper needs to know\
    \ both positions. One possibility, as shown in the previous interface, is that\
    \ the lever and dial all report their positions, and the wiper"
