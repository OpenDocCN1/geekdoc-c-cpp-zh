  md: '# Abstract


    Since the last publication of this international bestseller, there has been a
    renewed interest in model-based testing. This Fourth Edition of Software Testing:
    A Craftsman''s Approach continues and solidifies this emphasis with its careful
    blend of theory and well-chosen examples. The book has evolved over three editions
    and 18 years of classroom and industrial use. Much of the material from the Third
    Edition has been reorganized and consolidated, making room for important emerging
    topics. The chapter on path testing contains new material on complex condition
    testing and modified condition decision coverage as mandated by Federal Aviation
    Authority and US Defense standards.


    There are four chapters of new material in the Fourth Edition. The chapter on
    software reviews emphasizes technical inspections and is supplemented by an appendix
    with a full package of documents required for a sample use case technical inspection.
    It contains lessons learned from 15 years of industrial practice. The treatment
    of systems of systems introduces an innovative approach that merges the event-driven
    Petri nets from the earlier editions with the “swim lane” concept from the unified
    modeling language (UML) that permits model-based testing for four levels of interaction
    among constituents in a system of systems. Swim lane Petri nets exactly represent
    the issues of concurrency that previously needed the orthogonal regions of StateCharts
    for correct description. The chapter on software complexity presents a coherent,
    graph theory–based view of complexity across the traditional three levels of testing,
    unit, integration, and system. Finally, the last chapter considers how a set of
    test cases may be evaluated and presents mutation testing and alternatives.


    > Through revised, updated, and extended, Software Testing: A Craftsman''s Approach,
    Fourth Edition is sure to become a standard reference for those who need to stay
    up-to-date with the most recent ideas in software testing. It also serves as a
    strong textbook for university courses in software testing. It continues to be
    a valuable reference for software testers, developers, engineers, and researchers.
    A full set of support materials is available to faculty who adopt the Fourth Edition
    as a textbook.'
