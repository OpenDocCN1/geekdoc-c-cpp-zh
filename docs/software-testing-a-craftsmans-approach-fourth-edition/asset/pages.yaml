    Composed chains of functions can be problematic for testers, particularly when
    the range of one function a proper subset of the domain of the "next" function
    in the chain. A special case of composition can be used, which helps testers.
    Recall that one-to-one functions always have an inverse function. It turns out
    that this inverse is unique and is guaranteed to exist (again, the math folks
    would prove this). If $f$ is a one-to-one function from $A$ to $B$, we denote
    its inverse by $f^{-1}$. It turns out that for $a \in A$ and $b \in B, f^{-1}
    \cdot f(a) = a$ and $f \cdot f^{-1}(b) = b$. The NextDate and YesterDate programs
    are useful. This way helps testers, for a given function, its inverse acts as
    a "cross-check," and this can often expedite the identification of functional
    test cases.'
