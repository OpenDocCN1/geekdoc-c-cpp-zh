  md: '# # Chapter 5


    # ## Boundary Value Testing


    In Chapter 3, we saw that a function maps values from one set (its domain) to
    values in another set (its range) and that the domain and range can be cross products
    of other sets. Any program can be considered to be a function in the sense that
    program inputs form its domain and program outputs its range. In this and the
    next two chapters, we examine how to use knowledge of the functional nature of
    a program to identify test cases for the program. Input domain testing (also called
    "boundary value testing") is the best-known specification-based testing technique.
    Historically, this form of testing has focused on the input domain; however, it
    is often a good supplement to apply many of these techniques to develop range-based
    test cases.


    There are two independent considerations that apply to input domain. The first
    asks whether or not we are concerned with invalid values of variables. Normal
    boundary value testing is concerned only with valid values of the input variables.
    Robust boundary value testing considers invalid and variable values. The second
    consideration is whether we make the "single fault" assumption common to reliability
    theory. This assumes that faults are due to incorrect values of a single variable.
    If this is not warranted, meaning that we are concerned with interaction among
    two or more variables, we need to take the cross product of the individual variables.
    Taken together, the two considerations yield four variations of boundary value
    testing:


    +   - Normal boundary value testing

    - Robust boundary value testing

    - Worst-case boundary value testing

    - Robust worst-case boundary value testing


    For the sake of comprehensible, the discussion in this chapter refers to a function,
    F of two variables $x_1$ and $x_2$. When the function $F$ is implemented as a
    program, the input variables $x_1$ and $x_2$ will have some (possibly unstated)
    boundaries:


    ```

    a \leq x_1 \leq b


    c \leq x_2 \leq d

    ```'
