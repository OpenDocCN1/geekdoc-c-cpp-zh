    # 4.1.5 Connectedness


    Paths we use speak about nodes that are connected; this leads to a powerful simplification
    device that is very important for testers.


    # Definition


    Two nodes are connected if and only if they are in the same path.

    “Connectedness” is an equivalence relation (see Chapter 3) on the node set of
    a graph. To see this, we can define the three properties of equivalence relations:


    +   1. Connectedness is reflexive every node is, by default, in a path of length
    0 with itself. (Sometimes, for emphasis, an edge is shown that begins and ends
    on the same node).

    2. Connectedness is symmetric if nodes $n_i$ and $n_j$ are in a path, then nodes
    $n_j$ and $n_i$ are in the same path.

    3. Connectedness is transitive (see the discussion of adjacency matrix multiplication
    for paths of length 2).


    Equivalence relations induce a partition (see Chapter 3 if you need a reminder);
    therefore, we are guaranteed that connectedness defines a partition on the node
    set of a graph. This permits the definition of components of a graph.


