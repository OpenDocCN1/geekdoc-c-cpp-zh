    # 14.9 Nonfunctional System Testing


    The system testing thus has been discussed above by specification-based, or behavioral,
    requirements. Functional requirements are absolutely in the *does* view, as they
    what a system does (or should). To generalize, nonfunctional testing refers to
    how a system performs its functional requirements. Many nonfunctional requirements
    are categorized into “abilities”: reliability, maintainability, scalability, usability,
    and so on. While many practitioners have clear ideas on the meaning of the -abilities
    in their product domains, there is not much standardization of either the terms
    or the techniques. Here we consider the most common form of nonfunctional testing—stress
    testing.


    # 14.9.1 Stress Testing Strategies


    Synonym called performance testing, capacity testing, or load testing, this is
    the most common, and the most important form of nonfunctional testing. Because
    stress testing is so closely related to the nature of the system being tested,
    stress testing techniques are also application dependent. We describe three common
    strategies, and illustrate them with examples.


    # 14.9.1. Compression


    Consider the performance of a system in the presence of extreme loads. A web-based
    application may be very popular, and its server might not have the capacity. Telephone
    switching systems use the Busy Hour Call Attempts (BHCAs) to refer to such traffic
    loads. The strategy in those systems is best understood as compression.


    A local switching system must recognize when a subscriber initiates a call. Then
    the indicator of a call attempt is the entry of digits. Although some digital
    still exist, most subscribers use digit keys. The technical term is Dual Tone
    Multifrequency (DTMF) tones, the usual 3 × 4 array of digit keys has three frequencies
    for the columns and four frequencies for the rows of digit keypads. Each digit
    is represented by two frequencies, hence the name. The local switching system
    must convert the tones to a digital form, and this is done with a DTMF receiver.'
