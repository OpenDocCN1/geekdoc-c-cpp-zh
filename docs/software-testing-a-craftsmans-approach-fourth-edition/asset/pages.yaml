    use the coverage report to reduce redundant test cases and add additional test
    cases mandated by coverage.


    # 23.3.8 Code Coverage Metrics Based on the Nature of Individual Units


    There is no "one size fits all" test coverage metric. The best practice is to
    choose a coverage metric based on the properties of the source code.


    # 23.3.9 Exploratory Testing during Maintenance


    Exploratory testing is a powerful approach when test code written by someone other
    than the tester. This is particularly true for maintenance on legacy code.


    # 23.3.10 Test-Driven Development


    The agile programming community has demonstrated success in using TDD in applications
    where an agile approach is appropriate. The main advantage of TDD is the excellent
    fault isolation capability.


    # 23.4 Mapping Practices to Diverse Projects


    Best practices are necessarily project dependent. The software controlling a NASA
    space mission is clearly distinct from a quick-and-dirty project to develop some
    information requested by someone''s supervisor. Here are three distinct project
    types. After their description, the top 10 best practices are mapped to the projects
    in Table 23.1.


    Table 23.1 Best Testing Practices for Diverse Projects


    | Best Practice | Mission Critical | Time Critical | Legacy Code |

    |---|---|---|--|

    | Model-driven development | x | | |

    | Careful definition and identification of levels of testing | x | x | x |

    | System-level model-based testing | x | | |

    | System testing extensions | x | | |

    | Incidence matrices to guide regression testing | x | | x |

    | Use of MM-paths for integration testing | x | | |

    | Intelligent combination of specification-based and code-based unit-level testing
    | x | | x |

    | Code coverage metrics based on the nature of individual units | x | | |

    | Exploratory testing during maintenance | | x | |

    | Test-driven development | | | |'
