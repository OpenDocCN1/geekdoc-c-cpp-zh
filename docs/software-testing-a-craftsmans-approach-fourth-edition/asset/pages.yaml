    # 5.4 Special Value Testing


    Special value testing is probably the most widely practised form of functional
    testing. It is the most intuitive and the least uniform. Special value testing
    occurs when a tester uses domain knowledge, experience with similar programs,
    and information about “soft spots” to devise test cases. We might also call this
    hoc testing. No guidelines are used other than “best engineering judgment.” As
    a result, special value testing is very dependent on the abilities of the tester.


    Despite all the apparent negatives, special value testing can be very useful.
    In the next section, you will find test cases generated by the methods we just
    discussed for three of our examples. If you look carefully at these, especially
    for the NextDate function, you find that none is very satisfactory. Special value
    test cases for NextDate will include special test cases involving February 28,
    February 29, and leap years. Even though special value testing is highly subjective,
    it often results in a set of test cases that is more effective in revealing faults
    than the test sets generated by boundary methods—testimony to the craft of software
    testing.'
