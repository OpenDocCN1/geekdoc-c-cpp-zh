    # Definition


    A relation $R \subseteq A \times A$ is an ordering relation if $R$ is reflexive,
    antisymmetric, and transitive.\ Ordering relations have a sense of direction;
    some common ordering relations are older than, $\ge$, $\Rightarrow$, and ancestor
    of. (The reflexive part usually requires some fudging—we really should say younger
    than and not a descendant of.) Ordering relations are a common occurrence in software:
    data access techniques, hashing, tree structures, and arrays are all situations
    in which order-ing relations are used.


    The power set of a given set is the set of all subsets of the given set. The power
    set of the set $A$ is denoted $P(A)$. The subset relation $\subseteq$ is an ordering
    relation on $P(A)$ because it is antisymmetric (any set is a trivial subset of
    itself), it is reflexive, and it is transitive.


    # Definition


    A relation $R \subseteq A \times A$ is an equivalence relation if $R$ is reflexive,
    symmetric, and transitive. Mathematics is full of equivalence relations: equality
    and congruence are two examples. A very important connection exists between equivalence
    relations and partitions of a set. Suppose we have partition $A_1, \dots, A_n$
    of a set $B$, and we say that two elements, $b_i$ and $b_j$ of $B$, are related
    (i.e., $b_i, b_j$ are in the same partition). This relation is reflexive (any
    element is in its own partition), it is symmetric (if $b_i$ and $b_j$ are in a
    partition element, then $b_j$ and $b_i$ are), and it is transitive (if $b_i$ and
    $b_j$ are in the same set, and if $b_j$ and $b_k$ are in the same set). The relation
    defined from a partition is the equivalence- relation induced by the partition.
    The converse process works in the same way. If we have with an equivalence relation
    defined on a set, we can define subsets according to elements that are related
    to each other. This turns out to be a partition, and is called the partition induced
    by the equivalence relation. The sets in this partition are known as equivalence
    classes. The end result is that partitions and equivalence relations are interchangeable,
    and this becomes a powerful concept for testers. Recall and redundancy. When translated
    into testing situations, these notions allow testers to make powerful, absolute
    statements about the extent to which a software item has been tested. In addition,
    efficiency follows from testing one element of an equivalence class and assuming
    that the remaining elements will behave similarly.


