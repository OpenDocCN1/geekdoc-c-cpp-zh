    to move a carousel of samples to analyzed. It turns out that the mechanics of
    moving the carousel back to the starting cell often causes the robot arm to miss
    the first cell.


    As an example of logical (vs. physical) variables, we might look at PINs or phone
    numbers. It is hard to imagine what faults might be revealed by testing PIN values
    of 0000, 0001, 5000, 9998, and 9999.


