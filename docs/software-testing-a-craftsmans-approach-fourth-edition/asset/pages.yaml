  md: '# # Chapter 23


    # # Epilogue: Software Testing Excellence


    Finishing a book is almost as hard as beginning one. The ubiquitous temptation
    is to return to "finished" chapters and add a new idea, change something, or maybe
    delete a part. This is a pattern that writing shares with software development,
    and both activities endure small anxieties as deadlines near.


    This book started as a response to Myers'' The Art of Software Testing; in fact,
    the original title was The Craft of Software Testing, but Brian Marrick''s book
    with that title appeared. In the years between 1978 (Myers'' book) and 1995 (the
    first edition of this book), software testing tools and techniques had matured
    sufficiently to support the craft.


    Imagine a continuum with Art at one end, leading to Craft, then to Science, and
    ending with Engineering. Where does software testing belong on this continuum?
    Tool vendors put it all the way at the engineering end, claiming that their products
    remove the need for the kinds of thinking needed elsewhere on the continuum. The
    process community would consider it to be a science, arguing it is sufficient
    to follow a well-defined testing process. The context-driven school would probably
    leave software testing as an art, owing the need for creativity and individual
    talent. Personally, I still consider software testing to be a craft. Wherever
    it is placed on the continuum, software testing can also be understood in terms
    of excellence.


    # ## 23.1''


    First, a disclaimer. The more politically correct craftsmanship is word too cumbersome.
    Here, craftsman uses the gender-neutral sense of the -man suffix. What makes a
    craftsman? One of my grandfathers was a Danish cabinet maker, and that level of
    woodworking is clearly a craft. My father was a tool and die maker—another craft
    with extremely stringent standards. What did they, and others recognized as craftsmen,
    have in common? Here is a pretty good list:


    +   - Mastery of the subject matter


    +   - Mastery of the associated tools'
