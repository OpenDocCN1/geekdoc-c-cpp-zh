  md: '# Exploratory Testing ■ 371


    The Lewis and Clark Expedition lasted 28 months and brought back much detailed
    information about the region. They arrived at the mouth of the Columbia River
    in what is now Astoria, Oregon. (Of course, they still had the return trip to
    complete!) Most people (with the exception of the Native Americans) considered
    the expedition to be enormous success. It certainly opened the way for waves of
    new settlers. The key part, as far as exploratory testing is concerned, is that
    their implementation of Jefferson''s instructions is almost perfectly analogous
    to the goals and techniques of exploratory testing:


    +   - They knew what they were looking for (a route to the Pacific).

    - They had appropriate staffing and other resources.

    - They learned as they explored.

    - They were given plenty of time.

    - They were required to carefully document what they saw.


    A second form of exploration illustrates the learning component of exploratory
    testing; it occurs when a professor gives an examination to a student. The first
    similarity is that the professor has extensive domain knowledge. Second, the professor
    wishes to explore the extent to which the student has mastered the subject. The
    third, and most instructive, similarity is that, when the student shows a weakness,
    the professor asks follow-up questions to explore the extent of the weakness;
    knowledge gained from the one provokes a related question. This pattern is called
    adaptive testing.


    These forms of exploration explain the difference between special value testing
    and exploratory testing. As noted in Chapter 5, special value testing depends
    on the skill, insight, domain knowledge, and experience of the tester. The tester
    postulates that “seem to be important” that they reveal faults. In a sense, there
    is no feedback (other than pass/fail results of test case execution). Most often,
    the past of the tester is the greatest asset, as in the professor who gives an
    oral examination. By contrast, the exploratory tester is more focused, and has
    better technology to help discover faults—like the Lewis and Clark Expedition.
    The essence of exploratory testing, per James Bach (2003), one of the origins
    of the term, is “...simultaneous learning, test and execution.” Bach agrees that
    an exploratory tester is most like the professor giving an oral exam. When an
    exploratory tester encounters unexpected behavior in a program, he will design
    and execute more tests to isolate the problem. The fault may reside in a normal
    part of the program that would not be found by special value testing. Results
    of some tests determine the nature of additional tests. It is the learning aspect
    that separates special value testing from exploratory testing.


    # 18.2 Exploring a Familiar Example


    The commission offers a chance to replicate exploratory testing. Suppose we know
    that a given implementation is faulty; the objective of traditional software testing
    is to simply verify the presence of faults. Exploratory testing goes a step further,
    and to discover the nature of revealed faults. Recall that the commission problem
    deals with a salesperson who sells interchangeable parts: locks, stocks, and barrels.
    The locks cost $45, the stocks cost $30, and the barrels cost $25; so a complete
    rifle costs $100. When our hypothetical salesperson reports monthly sales, the
    commission carries an incentive: 10% on the first $1000, 15% on sales between
    $1001 and $1800, and 20% on sales over $1800.'
