  md: '# 13.1.3 Sandwich Integration


    Sandwich integration is a combination of top–down and bottom-up integration. If
    we think about it in terms of the decomposition tree, we are really only doing
    big integration on a subtree (see Figure 13.6). There will be less stress and
    driver development effort, but this will be offset to some the added difficulty
    of fault isolation that is a consequence of big integration. We could probably
    discuss the size of a sandwich, from dainty finger sandwiches to Dagwood-style
    sandwiches, but not now.)


    A sandwich is a path from the root to leaves of the functional decomposition tree.
    In Figure 13.6, the set of units is all semantically coherent, except that Leap
    is missing. This set of units could be meaningfully integrated, but test cases
    at the end of February would not be covered. Note that the fault isolation capability
    of the top–down and bottom–up approaches is sacrificed. No stubs nor drivers are
    needed in sandwich integration.


    # 13.1.4 Pros and Cons


    With exception of big integration, the decomposition-based approaches are intuitively
    clear. Whenever a failure is observed, the most recently added unit is suspected.
    Integration testing process is easily tracked against the decomposition tree.
    (If the tree is small, it is a nice touch to shade in nodes as are successfully
    integrated.) The top–down and bottom-up methods suggest best-first traversals
    of the decomposition tree, but this is not mandatory. (We could use full-height
    sandwiches to test the tree in a depth-first manner.)


    One of the most frequent objections to functional decomposition and waterfall
    development is that both are artificial, and both serve the needs of project management
    more than the needs of software developers. This holds true also for decomposition-based
    testing. The whole mechanism is that units are integrated with respect to structure;
    this presumes that correct behavior follows from individually correct units and
    correct interfaces. (Practitioners know better.) The development effort for stubs
    or drivers is another drawback to these approaches, and this is compounded by
    the retesting effort.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_265_0.png)


    Figure 13.6 Sample sandwich integration.'
