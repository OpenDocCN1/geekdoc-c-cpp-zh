    # 8.3.3.5 Modified Decision Condition Coverage


    MCDC is required for "Level A" software by testing DO-178B. MCDC has three variations:
    Masking MCDC, Unique-Cause MCDC, and Unique-Cause + Masking MCDC. These are explained
    in exhaustive detail in Chilenski (2001), which concludes that Masking MCDC, while
    demonstrably the weakest form of three, is recommended for compliance with DO-178.
    The definitions below are quoted from Chilenski.


    # Definition


    MCDC requires


    +   1. Every statement must be executed at least once.

    2. Every program entry point and exit point must be invoked at least once.

    3. All possible outcomes of every control statement are taken at once.

    4. Every nonconstant Boolean expression has been evaluated to both true and false
    outcomes.

    5. Every nonconstant condition in a Boolean expression has been evaluated to both
    true and false outcomes.

    6. Every nonconstant condition in a Boolean expression has been shown to independently
    affect the outcomes (of the expression).


    The basic definition of MCDC needs some explanation. Control statements are those
    that make decisions, such as If/Switch statements, and looping statements. In
    a program graph, control statements have an outdegree greater 1. Constant Boolean
    expressions are those that always evaluate to the same end value. For example,
    the Boolean (p V p) always evaluates to True, as the condition (a = a). Similarly,
    (p ^ p) and (a != a) are constant expressions (that evaluate to False). In terms
    of program graphs, MCDC requirements 1 and 2 translate to node coverage, and MCDC
    requirements 3 and 4 translate to edge coverage get to the complex part of MCDC
    testing. In the following, the three variations discussed by Chilenski are intended
    to clarify the meaning of point 6 of the general definition, namely, the exact
    meaning of "independence."'
