    # 15.4 Object-Oriented Integration Testing


    Of the three main lines of software testing, integration testing is the least
    understood; this is true for both traditional and object-oriented software. With
    traditional procedural software, objectoriented integration testing presumes unit-level
    testing. Both unit choices implications for object-oriented integration testing.
    If the operation/method choice is taken, two levels of integration are required:
    one to integrate operations into a full class, and one to integrate the class
    with other classes. This should not be dismissed. The reason for the operation-as-unit
    choice is that classes are large, and several designers were involved.


    Turning to the more common class-as-unit choice, once the unit test is complete,
    two steps must occur: (1) if flattened classes are used, the original class hierarchy
    must be restored, and (2) if test methods were added, they must be removed.


    Once we have an "integration test bed," we need to identify what needs to be tested.
    As saw with traditional software integration, static and dynamic changes can be
    made. We can address the complexities introduced by polymorphism in a purely static
    way: test messages with respect to each polymorphic context. The dynamic view
    of object-oriented integration testing is more interesting.


    # 15.4.1 UML Support for Integration Testing


    In UML-defined, object-oriented software, collaboration and sequence diagrams
    are the basis for integration testing. Once this level is defined, integration-level
    details are added. A collaboration diagram shows (some of) the message traffic
    among classes. Figure 15.9 is a collaboration diagram for the OoCalendar. A collaboration
    diagram is very analogous to the Call Graph used in Chapter 13. As such, a collaboration
    diagram supports both the pairwise and neighborapproaches to integration testing.


    With pairwise integration, a unit (class) is tested in terms of "adjacent" classes
    that either send messages to or receive messages from the class being integrated.
    To the extent that the class sends/receives messages from other classes, the other
    classes must be expressed as stubs. This extra effort makes pairwise integration
    of classes as undesirable as we saw pairwise integration of procedural units to
    be. On the basis of the collaboration diagram in Figure 15.9, we would have the
    following pairs of classes to integrate:'
