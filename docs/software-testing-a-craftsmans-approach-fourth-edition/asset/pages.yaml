    # 10.3 Evaluating Test Methods


    Evaluating a test method reduces to evaluate how effective is a set of test cases
    generated by a test method, but we need to clarify what “effective” means. The
    choice is to be dogmatic: mandate a method, use it to generate test cases, and
    run the test cases. This is absolute, and conformity measurable; so it can be
    used as a basis for contractual compliance. We can improve by relaxing a dogmatic
    mandate and requiring that testers “appropriate methods,” using the guidelines
    given at the ends of various chapters. We can gain another improvement by devising
    appropriate hybrid methods; we will have an example of this in Section 10.4.


    Structured testing yields a second choice for effectiveness. We can use the notion
    of program execution paths, which provide a good formulation of test effectiveness.
    We will be able to examine a set of test cases in the execution paths traversed.
    When a particular path is traversed more than once, we might question the redundancy.
    Mutation testing, the subject of Chapter 21, is an interesting way to assess the
    utility of a set of test cases.


    The best interpretation for testing effectiveness is (no great surprise) the most
    difficult. We would like to know how effective a set of test cases is for finding
    faults in a program. This is problematic for two reasons: first, it presumes we
    know all the faults in a program. A circular—if we, we would take care of them.
    Because we do not know all the faults in a program, we could never know if the
    test cases from a given method revealed them. The second reason is more theoretical:
    proving that a program is fault-free is equivalent to the halting problem of computer
    science, which is known to be impossible. The best we can do is to work backwards
    from faults. Given a kind of fault, we can choose testing methods (specification
    and code-based) that are likely to reveal faults of that type. If we couple this
    with knowledge of the most likely kinds of faults, we end up with a pragmatic
    approach to testing effectiveness. This is improved if we track the kinds (and
    frequencies) of faults in the software we develop.


    By now we have convinced that the specification-based methods are indeed open
    to the twin problems of faults and redundancies; we can develop some metrics that
    relate the effectiveness of a code-based metric. Specification-based testing techniques
    will result in a set of test cases, and a code-based metric is expressed in terms
    of something countable, such as the number of program paths, the number of decision-to-decision
    (DD-paths), or the number of slices.


    In the following definitions, we assume that a specification-based testing technique
    M generates test cases, and that these cases are tracked with respect to a code-based
    metric S that


