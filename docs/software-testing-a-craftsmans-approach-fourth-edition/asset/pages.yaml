    # ## 4.1.2 Incidence Matrices


    Graphs need not be represented pictially—they can be fully represented in an incidence
    matrix. This concept becomes very useful for testers, so we will formalize it.
    When graphs are given a specific interpretation, the incidence matrix always provides
    useful information for the new interpretation.


    # Definition


    The *incidence matrix* of a graph $G=(V, E)$ with $m$ nodes and $n$ edges is an
    $m \times n$ matrix, where the element in row $i$, column $j$ is a 1 if and only
    if node $i$ is an endpoint of edge $j$; otherwise, the element is 0.

    The incidence matrix of the graph in Figure 4.1 is as follows:


