    # Definition


    A node with indegree = 0 is a source node.

    A node with outdegree = 0 is a sink node.

    A node with indegree ≠ 0 and outdegree ≠ 0 is a transfer node.


    Source and sink nodes constitute the external boundary of a graph. If we made
    a directed graph (from a set of data flow diagrams produced by structured analysis),
    the external entities would be source and sink nodes.


    In our continuing example, $n_1, n_3$ and $n_7$ are source nodes; $n_2, n_5,$
    and $n_6$ are sink nodes; and $n_2$ and $n_4$ are transfer (also known as interior)
    nodes. A node that is both a source and a sink node is an isolated node.


    # 4.2.3 Adjacency Matrix of a Directed Graph


    As we might expect, the addition of direction to edges changes the definition
    of the adjacency matrix of a directed graph. (It also changes the incidence matrix,
    but this matrix is seldom used in conjunction with digraphs.)


    # Definition


    The adjacency matrix of a directed graph $D = (V, E)$ with $m$ nodes is an $m
    \times m$ matrix: $A = (a(i, j))$ where $(i, j)$ is a 1 if only if there is an
    edge from node $i$ to node $j$; otherwise, the element is 0.


    The adjacency matrix of a directed graph is not necessarily symmetric. A row is
    the outdegree of the node; a column is the indegree of a node. The adjacency matrix
    of our continuing example is as follows:


    | n_1 | n_2 | n_3 | n_4 | n_5 | n_6 | n_7 |

    |---|---|---|---|---|---|---||

    | n_1 | 0 | 1 | 0 | 1 | 0 | 0 | 0 |

    | n_2 | 0 | 0 | 0 | 0 | 1 | 0 | 0 |

    | n_3 | 0 | 0 | 0 | 1 | 0 | 0 | 0 |

    | n_4 | 0 | 0 | 0 | 0 | 0 | 1 | 0 |

    | n_5 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | n_6 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | n_7 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |


    One common used of directed graphs is to record family relationships, in which
    siblings, cousins, and so are connected by an ancestor; and grandparents, parents,
    and so are connected by a descendant. Entries in powers of the adjacency matrix
    now show existence of directed paths.'
