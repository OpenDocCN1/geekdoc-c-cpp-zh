    neither approach by itself is sufficient. Consider program behaviors: if all specified
    behaviors have not been implemented, code-based test cases will never be able
    to recognize this. Conversely, if the program implements behaviors that have not
    been specified, this will never be revealed by specification-based test cases.
    (A Trojan horse is a good example of such unspecified behavior.) The quick answer
    is that both approaches are needed; the testing craftsmen judicious combination
    will provide the confidence of specification-based testing and the measurement
    of code-based testing. Earlier, we asserted that specification-based testing often
    suffers from twin problems of redundancies and gaps. When specification-based
    test cases are executed in combination with code-based test coverage metrics,
    both of these can be recognized and resolved.


    The Venn diagram of testing provides one final insight. What is the relationship
    between *T* of test cases and sets *S* and *P* of specified and implemented behaviors?
    Clearly, the test cases in set *T* are determined by the test identification method
    used. A very good question to ask is how appropriate (or effective) is this method?
    To close a loop from an earlier disclosure, recall the causal trail from error
    to fault, failure, and incident. If we know what kind of errors we are prone to
    make, and we know what kind of faults are likely to reside in the software to
    be tested, we can use this to employ more appropriate test identification methods.
    This is the point at testing really becomes a craft.


    # 1.5 Fault Taxonomies


    Our definitions of error and fault have the distinction between process and product:
    process refers to how we do something, and product is the end result of a process.
    The point at which testing and Software Quality Assurance (SQA) meet is SQA typically
    tries to improve the product by improving the process. In that sense, testing
    is clearly more product oriented. SQA is more concerned with reducing errors endemic
    in the development process, whereas testing is more concerned with discovering
    faults in a product. Both disciplines benefit from a clearer definition of types
    of faults. Faults can be classified in several ways: the development phase in
    which the corresponding error occurred, the consequences of corresponding failures,
    difficulty to resolve, risk and and so on. My favorite is by anomaly (fault) occurrence:
    one time only, intermittent, recurring, or repeatable.


