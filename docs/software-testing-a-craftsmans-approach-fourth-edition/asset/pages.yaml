    # 17.1 Characteristics of Systems of Systems


    We experience complex systems every day, but what distinguishes a complex system
    from a system of systems? Some early attempts to clarify this distinction are


    +   - A “super system"

    - A collection of cooperating systems

    - A collection of autonomous systems

    - A set of component systems


    These early attempts get all at the central idea, but they would also apply to
    systems such as an automobile, an integrated MIS system in a company, and even
    the human body. There is a growing clarity of definitions for the underlying nature
    of systems of systems. Meier begins his distinction by noting two fundamental
    differences—systems of systems are either directed or collaborative. Initially,
    he used “collaborative systems” as a synonym for “systems of systems,” with the
    defining characteristic of systems as “built from components from which large
    scale systems in their own right.” He offers air defense networks, the Internet,
    and emergency response teams as better examples. Meier provides some more specific
    attributes:


    +   - They are built from components that are (or be) independent systems

    - They have managerial/administrative independence.

    - They are usually developed in an evolutionary way.

    - They exhibit emergent (as opposed to preplanned) behaviors.


    In addition, he observes that the components may not be co-located, and this imposes
    a constraint on information sharing. The generally accepted term for the components
    is “constituent system,” and a general architecture is shown in Figure 17.1. Notice
    that constituent


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_380_0.png)


    Figure 17.1 Generic view of a system of systems.'
