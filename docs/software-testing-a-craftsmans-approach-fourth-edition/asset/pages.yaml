  md: '# 1.6 Levels of Testing


    Thus, far, we have said nothing about one of the key concepts of testing—levels
    of abstraction. Levels of testing echo the levels of abstraction found in the
    waterfall model of the software development cycle. Although this model has its
    drawbacks, it is useful for testing as a means of identifying levels of testing
    and for clarifying the objectives that pertain to each level. A diagrammatic variation
    of the waterfall model, known as the V-Model in ISTQB parlance, is given in Figure
    1.8 this variation emphasizes the correspondence between testing and design levels.
    Notice that, especially in terms of specification-based testing, the three levels
    of definition (specification, preliminary design, and detailed design) correspond
    directly to three levels of testing—system, integration, and unit testing.


    A practical relationship exists between levels of testing versus specification-based
    and code-based testing. Most practitioners agree that code-based testing is most
    appropriate at the unit level, whereas specification-based testing is most appropriate
    at the system level. This is generally true; however, it is also a likely consequence
    of the base information produced during the requirements specification, preliminary
    design, and detailed design phases. The constructs defined for code-based testing
    make the most sense at the unit level, and similar constructs are only now becoming
    available for the integration and system levels of testing. We develop such structures
    in Chapters 11 through 17 to support code-based testing at the integration and
    system levels for both traditional and object-oriented software.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_42_0.png)'
