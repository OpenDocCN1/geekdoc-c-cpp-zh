    # 17.3.2.2 Air Traffic Management System Use Cases and Sequence Diagrams


    In the standard UML and in the dialect used, classes constitute the *view* that
    focuses on the structure and components of a system (and systems of systems).

    The *view* is most useful to developers, but less so for customer/users and testers,
    who utilize the *does view*, which focuses on behavior. Use cases are the earliest
    UML model that relate to the *does view*, and they are widely recognized as the
    preferred view of customer/users. The UML sequence diagram is the only place where
    the *does view* is related to the *is* view. Figure 17.6 is a sequence diagram
    of the Normal Landing use case. For our dialect, we added Actors (constituent
