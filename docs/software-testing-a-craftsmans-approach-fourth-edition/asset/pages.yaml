    # 19.5 Pros, Cons, and Open Questions of TDD


    As with most innovations, TDD has its advantages, disadvantages, claims, and unanswered
    questions. The advantages of TDD are very clear. Owing to the extremely tight
    test/code cycles, something always works. In turn, this means a TDD project can
    be turned over to someone else, likely a programming pair, for continued development.
    Probably the biggest advantage of TDD is the excellent fault isolation. If a test
    fails, the cause must be the most recently added code. Finally, TDD is supported
    by an extensive variety of test frameworks, including those listed in Section
    19.2.


    It is nearly impossible, or at best, very cumbersome, to perform TDD in the absence
    of test frameworks. There is rarely much of an excuse for this because the frameworks
    are available for most programming languages. If a tester cannot find a test framework
    for the project language, TDD is a poor choice. It is far better to just changing
    languages).

    At a deeper level, TDD is inevitably dependent on the ingenuity of the tester.
    Good test cases are necessary but not sufficient for TDD to produce good code.
    Part of the reason is that the bottom-up nature of TDD provides little opportunity
    for elegant design. TDD responds by claiming that a good design is eventually
    accomplished by a series of refactorings, which improves the code a bit. A final
    disadvantage of TDD is that the bottom-up process makes unlikely that “deep faults,”
    as those only revealed by data testing, will be revealed by the incrementally
    created cases. These faults require a more comprehensive understanding of the
    code, and this disadvantage is exacerbated by the possibility of the thread interaction
    faults discussed in Chapter 17.


    Any new technology or technique has a set of open questions, and this is certainly
    true for TDD. The easiest question is how to scale-up to large applications. It
    would seem that there are practical limits as to how much an individual can “keep
    in mind” during a development. This is one of the early motivating factors for
    programming modularity and information hiding, which are the foundations of the
    object-oriented paradigm. If size is a problem, complexity is even more serious.
    Systems developed with TDD effectively deal with questions about reliability and
    safety! Such questions usually require sophisticated models, but these are not
    produced in TDD. Finally, there is the question of support for long-term maintenance.
    The agile programming community and the TDD advocates maintain that there is no
    need for the documentation produced by the more traditional development approaches
    even argue against comments in source code. Their view: the test cases are the
    specification, and well-written code, with meaningful variable and method names,
    is self-documenting. Time will tell.


    # 19.6 Retrospective on MDD versus TDD


    The Northern Cheyenne of the North American plains have teaching stories based
    on what they observe in nature. When they speak of the Medicine Wheel, they associate
    animals with each of the four directions, and the animals have qualities that
    are seen in nature. Interesting pair is the Eagle and the Mouse. The Eagle sees
    the “big picture” and therefore'
  merge: -1
  pgno: 420
- img_proc: true
  md: 'understands the important relationships among things. The Mouse, on the other
    hand, sees only the ground where it scurries, and the grasses encounters—a very
    detailed view. Living by the Medicine Wheel that means each view is honored—each
    view is needed to have better understanding.


    It is unlikely that the Northern Cheyenne ever thought much about Model-Driven
    Development (MDD) and TDD, both are obvious: both are needed to have better understanding,
    in this case, of a program to be developed. This is really not too surprising.
    In the 1970s and 1980s, camps in the software community passionately debated the
    merits of specification-based versus code-based testing. Thoughtful people concluded
    that both of approaches are necessary. To illustrate these two approaches, consider
    our Boolean function, isLeap, that determines whether a given year is a common
    or a leap.


    A model-driven approach to developing isLeap would likely begin with a decision
    table (Table 19.3) showing the relationships among the phrases of the definition.


    The advantage of using a decision table for the model is that it is complete,
    consistent, and not redundant. Rule r1 refers to century years that are leap years,
    while rule r2 refers to century years. Rule r3 describes non-leap century years,
    and rule r8 describes non-common years. The other rules are logically impossible.
    If we write isLeap from this decision table, we get something like the Visual
    Basic function in Figure 19.1.


    Notice that there are four paths from the source node to the sink node. The path
    through node 8 corresponds to rule r1, the one nodes 9 and 10 to rule r2, and
    so on. Coding nested logic three deep is probably not what the average developer
    would do, at least not on the first try. (And it is even less likely that a developer
    would get it correct on the first try. Score for MDD.)


    The test-driven approach results a different form of complexity. Referring to
    the code for user stories 14 through 17 on Section 19.1, notice that the TDD code
    gradually developed a compound If statement, rather than the nested If logic in
    the MDD version (slightly refactored in Figure 19.2).


