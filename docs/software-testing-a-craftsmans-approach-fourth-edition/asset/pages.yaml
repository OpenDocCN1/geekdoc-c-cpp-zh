  md: '# 12.2 Appropriate Models


    Avvinare is one of my favorite Italian words. It refers to a process that many
    Italian families perform in autumn when they bottle wine. By buying a demijohn
    of bulk wine, they rinse out the empty bottles that they have saved during the
    year. There are always small droplets of water clinging to the sides of a bottle,
    but it is really difficult to remove them. Instead, fill a bottle half full of
    the wine, and shake it up to dissolve the wine into the next. The wine is funneled
    into the next bottle, shaken, and poured into another bottle. This continues until
    all the bottles have been rinsed with wine, and they are ready for bottling. Avvinare
    is the verb that refers to this entire process. How would you translate this word
    into English? I really don''t know, but it won''t be easy. Languages evolve to
    meet the expressive needs of their speakers, and this activity is not very common
    in the English-speaking world. To wax esoteric, this is where software engineering
    meets epistemology. With modeling, the choice of an appropriate model determines
    the ultimate success of the associated testing. Making an appropriate choice depends
    on several things: the expressive power of words, the nature of the system being
    modeled, and the analyst''s ability to use various models. We consider the first
    two of these next.


    # 12.2.1 Peterson''s Lattice


    James Peterson (1981) developed an elegant lattice of models of computation, which
    is summarized in Figure 12.1. The arrows in the lattice signify a "more expressive
    than" relationship in which the model at the origin of an arrow is more expressive
    than that at the end of an arrow. In his text, Peterson carefully develops examples
    for each edge in the lattice. For example, he shows a semaphore system that cannot
    be expressed as a finite state machine. Four models in his lattice are fairly
    obscure: vector replacement systems, vector addition systems, UCLA graphs, and
    message


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_252_0.png)


    Figure 12.1 Peterson''s lattice.'
