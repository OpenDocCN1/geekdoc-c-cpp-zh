    # ## 2.8 Garage Door Opener


    A system to open a garage door is composed of several components: a drive motor,
    a drive chain, the garage door tracks, a lamp, and an electronic controller. Much
    of the system is powered by commercial 110 V electricity. Several devices communicate
    with the garage door controller—a wireless keypad (usually in an automobile),
    a digit keypad on the outside of the garage door, and a wall-mounted button. In
    addition, there are two safety features, a laser beam near the floor and an obstacle
    sensor. If the light beam is interrupted (by a pet), the door immediately stops,
    and then reverses direction until the door is fully open. If the door encounters
    an obstacle while it is closing there is a way to move the door in motion, either
    when it is closing or opening. A signal from any of the three devices (wireless
    keypad, digit keypad, or wall-mounted control button). The response to any of
    the devices is different—the door stops in place. A subsequent signal from any
