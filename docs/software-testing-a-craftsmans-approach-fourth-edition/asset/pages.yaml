  md: '# Preface to the Fourth Edition


    # Software Testing: A Craftsman''s Approach, Fourth Edition


    Software Testing *Software Testing: A Craftsman''s Approach* extends an 18-year
    emphasis on model-based testing with deeper coverage of path testing and four
    new chapters. The book has evolved over three editions and 18 years of classroom
    and industrial use. It presents a strong combination of theory and practice, with
    well chosen, but easily understood, examples. In addition, much of the material
    from the Third Edition has been merged, reorganized, and more concise. Much of
    the material on object-oriented software testing has been unified with procedural
    software testing in a coherent whole. In addition, the chapter on path testing
    contains new material on complex condition testing and Modified Condition Decision
    Coverage as mandated by Federal Aviation Authority and US Department of Defense
    standards.


    +   - Software reviews, technical inspections (Chapter 22). This is widely recognized
    as "static testing," whereas the first three editions focused on "dynamic testing,"
    in which program code executes carefully selected tests. The material in this
    chapter is derived from 20 years of industrial/practical experience in a development
    organization that had an extremely mature review.

    - An Appendix that contains a full set of documents that are appropriate for an
    industrialstrength inspection of a set of Use Cases (from UML) to respond to a
    typical customer specification. The Appendix includes Use Case Standard, a definition
    of Use Case faults, a technical inspection checklist of potential problems, and
    typical reviewer and final reports.

    - Testing of Systems (Chapter 17). Systems of systems is a relatively new (since
    1999) topic. The practitioner community is just now following the lead of a few
    university researchers, mostly in the area of how to specify a system of systems.
    This chapter introduces "Swim Lane Event-Driven Petri Nets," which have an expressive
    power very similar to flowcharts.

    - Software complexity (Chapter 16). Most texts only consider cyclic (Mcabe) complexity
    at the unit level. This chapter extends unit level complexity in two ways and
    adds two views of integration level complexity. There is a short treatment of
    the complexities to object-oriented programming and also to system level testing.
    At all levels, complexity is'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'an important way to improve designs, coding, testing, and maintenance. Having
    a coherent presentation of software complexity enhances each of these activities.


    +   - Evaluating test cases (Chapter 21). This new chapter considers a difficult
    question: how can a set of test cases be evaluated? Test coverage metrics are
    a long-accepted answer, but there will always be a level of uncertainty. The old
    Roman question of who guards the guards/custodians is extended to whom the tests
    tests. Mutation testing has been an answer for decades, and its contribution is
    covered in this chapter. Two other approaches are offered: fuzzing and fault insertion.


    After 47 years as a software developer and university professor, I have knowledge
    of software testing that is both deep and extensive. My university education was
    in mathematics and computer science, and that, with 20 years of industrial software
    development and management experience, puts me in a strong position to codify
    and improve the teaching and understanding of software testing. I keep gaining
    new insights, often when I teach out of the book. I see this book as my contribution
    to the field of software engineering. Finally, I thank three of my colleagues—Dr.
    Roger Ferguson, Dr. Jagadeesh Nandigam, and Dr. Christian Trefftz—for their help
    in the chapters on object-oriented testing. Wopila tanka!


    Paul C. Jorgensen

    Rockford, Michigan'
