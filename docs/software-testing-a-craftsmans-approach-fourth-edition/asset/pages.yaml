- img_proc: true
  md: '# 374 ■ Software Testing


    3. To be successful, the exploratory tester must be highly motivated, curious,
    and creative. A dull, disinterested tester will be able to devise interesting
    follow-up tests.

    4. Exploratory testing defies predictive measurement. This is true of essentially
    creative activity, not just software testing. Even a very effective exploratory
    tester cannot estimate how many faults remain. A conscientious exploratory tester
    can tell when no more faults are revealed. Imagine the difficulty Meriwether Lewis
    would have predicted the date of completion of his expedition.

    5. Management of exploratory testing is reduced to insistence on having a clear
    charter, and required documents and results.

    6. The effectiveness of exploratory testing is inversely proportional to the size
    and complexity of the system under test. Since exploratory testing does not work
    well with a team approach, an individual tester will always have some threshold
    of system comprehension. An exploratory tester can certainly “explore” a large,
    complex system, but it will be difficult to keep track of all the follow-up tests.


