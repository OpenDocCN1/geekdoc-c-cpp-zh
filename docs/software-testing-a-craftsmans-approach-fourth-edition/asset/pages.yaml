  md: '# BEYOND UNIT TESTING III


    In Part III, we build on the basic ideas of unit testing covered in Part II, with
    one major change. Now we are more concerned with knowing what to test. To that
    end, the discussion in this part begins with the whole idea of model-based testing.
    Chapter 11 examines testing based on models of software development life cycles,
    and models of software/system behavior are discussed in Chapter 12. Chapter 13
    presents model-based strategies for integration testing, and these are extended
    to system testing in Chapter 14. We return to the question of testing object-oriented
    software in Chapter 15, with the main focus on points at which the object-oriented
    paradigm differs from the traditional paradigm. Having completed this much, we
    are in a position to finally take a serious look at software complexity in Chapter
    16. We apply much of this to a relatively recent question, testing systems of
