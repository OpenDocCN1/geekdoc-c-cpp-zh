  md: '# 212 ■ Software Testing


    The differences among the three spin-off models are due to how the builds are
    identified. In incremental development, the motivation for separate builds is
    usually to flatten the staff profile. With pure waterfall development, there can
    be a huge bulge of personnel for the phases from detailed design through unit
    testing. Many organizations cannot support rapid fluctuations, so the system is
    divided into builds that can be supported by existing personnel. In evolutionary
    development, the presumption of a build sequence is still made, but only the first
    build is defined. On the basis of that, later builds are identified, in response
    to priorities set by the customer/user, so the system evolves to meet the changing
    needs of the user. This foreshadows the customer-driven tenet of the agile methods.
    The spiral model is a combination of rapid prototyping and evolutionary development,
    in which a build is defined in terms of rapid prototyping and is then subjected
    to a go/no-go decision based on technology-related risk factors. From this, see
    that keeping preliminary design as an integral activity, integration testing is
    negatively affected. System testing is not affected.


    Because a build is a set of deliverable end-user functionality, one advantage
    common to all these spin-off models is that they provide earlier synthesis. This
    also results in earlier customer feedback, two of the deficiencies of waterfall
    development are mitigated. The next section describes two approaches to deal with
    the “perfect foresight” problem.


    # 11.2.2 Specification-Based Life Cycle Models


    When systems are not fully understood (by either the customer or the developer),
    functional decomposition is perilous at best. Barry Boehm joins when he describes
    the customer who says “I''t know what I want, but I''ll recognize it when I see
    it.” The rapid prototyping life cycle (11.4)


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_242_0.png)


    Figure 11.4 Rapid prototyping life cycle.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Life Cycle-Based Testing ■ 213


    deals with this by providing the “look and feel” of a system. Thus, in a sense,
    customers can recognize what they “see.” In turn, this drastically reduces the
    specification-to-customer feedback loop by producing very early specification.
    Rather than build a final system, a “quick and dirty” prototype is built and then
    used to elicit customer feedback. Depending on the feedback, more prototyping
    may occur. Once the developer and customer agree that a prototype represents the
    desired system, the developer goes ahead and builds to a correct specification.
    At any point, of the waterfall spin-offs might be as needed. The agile cycles
    are the extreme of this pattern.


    Rapid prototyping has no implications for iteration testing; however, it has very
    implications for system testing. Where are the requirements? Is the last prototype
    traced back to the prototype? One good answer to questions such as this is to
    use the prototyping activities as information-gathering activities and then produce
    a requirements specification in a more traditional manner. Another possibility
    is to capture what the customer does with prototypes, and then use them as system
    tests. These could be precursors to the user stories of the agile cycles. The
    main contribution of rapid prototyping is that it brings the operational (or behavioral)
    viewpoint to the requirements specification. Usually, specification techniques
    emphasize the structure of a system, not its behavior. This is unfortunate because
    most customers do not care about the structure, and they do care about the behavior.


    Executable specifications (Figure 11.5) are an extension of the rapid prototyping
    concept. With this approach, the requirements are specified in an executable format
    (such as finite state machines, StateCharts, or Petri nets). The customer then
    executes the specification to observe the intended system behavior and provides
    feedback as in the rapid prototyping model. The executable models are, or can
    be, quite complex. This is an understatement for the full-blown version of StateCharts.
    Building an executable model requires expertise, and executing it requires an
    engine.


    ![](img/caa3a36b6e8a0f28e72c4d26c243e580_243_0.png)


    **Figure 11.5** Executable specification.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 214 Software Testing


    specification is best applied to event-driven systems, particularly when the events
    arrive in different orders. David Harel, the creator of StateCharts, refers to
    such systems as "reactive" (Harel, 1988) because they react to external events.
    As with rapid prototyping, the purpose of an specification is to let the customer
    experience scenarios of intended behavior. Another similarity is that executables
    models might have to be revised on the basis of customer feedback. One benefit
    is that a good engine for an executable model will support the capture of "interesting"
    system transactions, and it is often a nearly mechanical process to convert into
    true system test cases. If it is done carefully, system testing can be traced
    directly to the requirements.


    Once again, this life cycle has no implications for integration testing. One big
    difference is that the requirements document is explicit, as opposed to a prototype.
    More important, it is often a mechanical process to develop test cases from an
    executable specification. We will see this in Chapter 14. Although more work is
    required to develop an executable specification, it is partially offset by the
    reduced effort to generate system test cases. Here is another important distinction:
    when system testing is based on an executable specification, we have an interesting
    form of structural testing at the system level. Finally, as we saw with rapid
    prototyping, the executable specification step can be combined with any of the
    iterative life cycle models.


    # 11.3 Agile Testing


    The Agile Manifesto (http://agilemanifesto.org/) was written by 17 consultants,
    the Agile Alliance, in February 2001. It has been translated into 42 languages
    and has drastically changed the software world. The underlying characteristics
    of all agile life cycles are


    +   - Customer-driven

    - Bottom-up development

    - Flexibility with respect to changing requirements

    - Early delivery of fully functional components


    These are sketched in Figure 11.6. Customers express their expectations in terms
    of user stories, which are taken as the requirements for very short iterations
    of design–test. When does one


