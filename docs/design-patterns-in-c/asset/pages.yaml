  md: "# 11. Abstract Factory Pattern\n\nIn this chapter I would like to explain the\
    \ Abstract Factory pattern. This pattern is essential for learning the Factory\
    \ Method and Bridge patterns.\n\n# Challenge\n\nYou are working on an ORM (Object\
    \ Relational Mapping) framework creation. The framework could be used in different\
    \ databases like:\n\n+   - Sql Server\n+   - Oracle\n+   - MS Access\n+   - OleDb\n\
    \nBased on the database type, you need to create related classes like:\n\n+  \
    \ - SqlConnection, SqlCommand when Sql server\n+   - OracleConnection, OracleCommand\
    \ when Oracle etc.\n\nHow to create a family of related objects without implementation\
    \ of them?\n\n# Definition\n\nGoF Definition: \"Provide an interface for creating\
    \ families of related or dependent objects without specifying their concrete classes\"\
    \n\n# Implementation\n\nOur idea is to create an interface which contains all\
    \ related objects like:\n\n```\npublic abstract class DbProviderFactory\n{\n \
    \   public abstract DbConnection CreateConnection();\n    public abstract DbCommand\
    \ CreateCommand();\n}\n```\n\nLuckily, ADO.NET already includes the same interface\
    \ as Abstract Factory. The The definition is given below: (I have excluded some\
    \ irrelevant methods from it)\n\n```\nnamespace System.Data.Common\n{\n    public\
    \ abstract class DbProviderFactory\n    {\n        public virtual DbCommand CreateCommand();\n\
    \        public virtual DbCommandBuilder CreateCommandBuilder();\n        public\
    \ virtual DbConnection CreateConnection();\n    }\n}\n```"
  merge: -1
