- pgno: 67
  md: "![](img/10a39e9a5b1ae55cb003d638eba7aaa0_67_0.png)\n\n# Note\n\nFrom C# 2.0\
    \ onwards the Iterator pattern is implemented using foreach. The foreach allows\
    \ sequential accessing of the elements inside a collection. The IEnumerator interface\
    \ is used to implement the Iterator pattern.\n\n```\npublic interface IEnumerator\n\
    {\n    object Current { get; }\n    bool MoveNext();\n    void Reset();\n}\n```\n\
    \nWhile executing the foreach, first the Reset() method is called to position\
    \ to the first element of the collection. Then through each iteration the MoveNext()\
    \ method is called. The Current property returns the current object from the collection.\
    \ The IEnumerator interface implementation of array, List, HashSet etc. enables\
    \ us to iterate over them using the same foreach loop.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_67_1.png)\n\
    \n# References\n\nhttp://msdn.microsoft.com/en-us/library/dscyy5s0(v=vs.80).aspx"
