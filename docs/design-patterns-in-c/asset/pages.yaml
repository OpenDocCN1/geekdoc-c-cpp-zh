  md: '# 5. Strategy Pattern


    In this chapter I would like to explore the flexibility of Strategy design pattern.


    # Challenge


    You are working on a Gaming application. The player can select between two different
    guns:


    +   1. Pistol having 5 bullets

    +   2. Grenade Launcher having 20 bullets


    In the normal coding scenario, if the gamer changes the gun we have to do lot
    of if conditions

    in the fire method, in the draw gun method, in the bullet animation methods.


    How to do a better approach?


    # Definition


    GoF Definition: "Define a family of algorithms, encapsulate each one, and make
    them interchangeable. Strategy lets the algorithm vary independently from clients
    that use it"


    # Implementation


    We can avoid the above complications by switching to the Strategy pattern. Our
    solution would be: Extract the difference implementations into appropriate classes
    and switch between the classes.


    # Code Explained


    The core classes involved are:


    +   - Gamer

    +   - PistolGun implementing IGun

    +   - GrenadeLauncher implementing IGun


    Whenever the user changes the gun the Gamer.Gun property is switched between PistolGun
    and GrenadeLauncher instances.


    Here the IGun interface extracts the part which differs for different guns.'
  merge: -1
  img_proc: true
