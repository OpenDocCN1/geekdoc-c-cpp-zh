    \nThe following unit tests operate on the new property and display the result\
    \ having IsAboveEighteen as true.\n\n```\n[TestMethod()]\npublic void IsAboveEighteenTest()\n\
    {\n    IList<Member> list = new List<Member>()\n    {\n        new Member() {\
