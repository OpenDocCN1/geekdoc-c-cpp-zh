    ```\n\n# Inside the SquareCommand Class\n\nWe can have a look on the Square class.\
    \ Both the SquareCommand and RectangleCommand class will be having same implementations\
    \ except in the Do() operation of drawing the respective shape.\n\n```\npublic\
    \ class SquareCommand : ICommand\n{\n    private Point _point;\n    private Bitmap\
    \ _bitmap;\n    private Graphics _graphics;\n    private Color _color;\n    public\
    \ SquareCommand(Bitmap bitmap, Color color, int x, int y)\n    {\n        _bitmap\
    \ = bitmap;\n        _graphics = Graphics.FromImage(_bitmap);\n        _color\
    \ = color;\n        _point = new Point(x, y);\n    }\n\n    public void Do()\n\
    \    {\n        // Save the current pixel colors for a future UNDO perform\n \
    \       SaveCurrentPixels();\n        // Do the drawing\n        _graphics.FillRectangle(new\
