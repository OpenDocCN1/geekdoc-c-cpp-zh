  md: "```\n```csharp\nprivate List<Color> _colors = new List<Color>();\nprivate void\
    \ SaveCurrentPixels()\n{\n    for (int i = _point.X; i < _point.X + Width; i++)\n\
    \        for (int j = _point.Y; j < _point.Y + Height; j++)\n            _colors.Add(_bitmap.GetPixel(i,\
    \ j));\n}\n/// <summary>\n/// Perform Undo by restoring back the pixels to previous\
    \ colors\n/// </summary>\npublic void Undo()\n{\n    int ix = 0;\n    for (int\
    \ i = _point.X; i < _point.X + Width; i++)\n        for (int j = _point.Y; j <\
    \ _point.Y + Height; j++)\n            _bitmap.SetPixel(i, j, _colors[ix++]);\n\
    }\n```\n```\n\nThe constructor is called with the bitmap and the x, y positions\
    \ which are then stored into class fields. When the Do() method is called the\
    \ current pixel colors are saved into the _colors list. This would enable us to\
    \ perform the Undo() method later. After that the graphics.FillRectangle() method\
    \ is called to draw the square. The width and height of the square would be set\
    \ to 50 pixels using the constants Width and Height respectively.\n\nThe Undo()\
    \ method just restores the previous pixel values using the bitmap.SetPixel method()\
    \ by iterating through each pixel starting from x, y position.\n\n# Performing\
    \ the Undo() on clicking Undo button\n\nAs we encapsulated each operation to a\
    \ class with parameters and logged them into the command stack, it is now easier\
    \ to call the Undo() method. Please remind that on clicking the Undo button we\
    \ have to get the last operation instance and call the Undo() method of it, and\
    \ removing it from the stack.\n\nThe code for it is:\n\n```\n```csharp\nprivate\
    \ void UndoButton_Click(object sender, EventArgs e)\n{\n    // Check command stack\
    \ contains items\n    if (_commandStack.Count > 0)\n    {\n        // Remove the\
    \ last command\n        ICommand lastCommand = _commandStack.Pop();\n        //\
    \ Call the Undo method\n        lastCommand.Undo();\n```\n```"
