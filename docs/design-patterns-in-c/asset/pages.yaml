- pgno: 90
  md: "There are 2 classes in our solution: Office and Clock. The Office class can\
    \ represent Head Office and Branches. The Clock class manages the clock control\
    \ for changing time.\n\nWe need to introduce one interface which will be implemented\
    \ by the Office and Clock classes.\n\n```\n```csharp\ninterface IComponent\n{\n\
    \    void Add (IComponent notifier);\n    void SetTime(DateTime time);\n}\n```\n\
    ```\n\nThe Add() method ensures adding a component of type IComponent. It can\
    \ be used to add an Office or Clock instance.\n\nThe SetTime() method can be used\
    \ to change the current time.\n\n# Class Implementations\n\nFollowing are the\
    \ implementations of the Office and Clock classes:\n\n```\n```csharp\nclass Office\
    \ : IComponent\n{\n    private IList<IComponent> _list = new List<IComponent>();\n\
    \n    public void Add(IComponent notifier)\n    {\n        _list.Add(notifier);\n\
    \    }\n\n    public void SetTime(DateTime time)\n    {\n        foreach (IComponent\
    \ n in _list)\n            n.SetTime(time);\n    }\n}\n\nclass Clock : IComponent\n\
    {\n    public ClockControl ClockControl;\n\n    public void Add(IComponent notifier)\n\
    \    {\n        throw new ApplicationException(\"You cannot add IClock!\");\n\
    \    }\n\n    public void SetTime(DateTime time)\n    {\n        ClockControl.CurrentTime\
    \ = time;\n    }\n}\n```\n```\n\nPlease note that the SetTime() implementation\
    \ of Office class takes care of informing all the added IComponent instances.\
    \ Thus the Head Office can notify all the branches. The branches will notify all\
    \ the clock instances."
