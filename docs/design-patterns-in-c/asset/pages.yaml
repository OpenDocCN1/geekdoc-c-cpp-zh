  md: "# 3. Adapter Pattern\n\nMost of you might have heard about Adapter Pattern.\
    \ It is a pattern commonly used in our applications but without knowing it. Adapter\
    \ Pattern is one among the 23 Design Patterns. In this chapter I would like to\
    \ examine this pattern using a simple example.\n\n# Challenge\n\nYou are working\
    \ on a Square class. You need to find the Area of it using Calculator class. But\
    \ the Calculator class only takes Rectangle class as input. How to solve this\
    \ scenario?\n\nHave\n\nRequired\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_14_0.png)\n\
    \n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_14_1.png)\n\n# Definition\n\nGoF Definition:\
    \ \"Convert the interface of a class into another interface clients expect. Adapter\
    \ lets classes work together that couldn't otherwise because of incompatible interfaces.\"\
    \n\n# Implementation\n\nFollowing are the class definitions for Rectangle and\
    \ Calculator.\n\n```\npublic class Rectangle\n{\n    public int Width;\n    public\
    \ int Height;\n}\n\npublic class Calculator\n{\n    public int GetArea(Rectangle\
    \ rectangle)\n    {\n        int area = rectangle.Width * rectangle.Height;\n\
    \        return area;\n    }\n}\n```\n\nAs we can see from the above example an\
    \ instance of Rectangle is needed to calculate the area. If we have a square class\
    \ of definition below, the calculation cannot be done."
  merge: -1
  img_proc: true
- pgno: 15
  md: "```\npublic class Square\n{\n    public int Size;\n}\n```\n\nHere we have to\
    \ create a new CalculatorAdapter to get the work done.\n\n```\npublic class CalculatorAdapter\n\
    {\n    public int GetArea(Square square)\n    {\n        Calculator calculator\
    \ = new Calculator();\n\n        Rectangle rectangle = new Rectangle();\n    \
    \    rectangle.Width = rectangle.Height = square.Size;\n\n        int area = calculator.GetArea(rectangle);\n\
    \n        return area;\n    }\n}\n```\n\nThe CalculatorAdapter performs the following\
    \ functions:\n\n+   - Takes the Square parameter\n+   - Convert Square to Rectangle\n\
    +   - Call the original Calculator.GetArea() method\n+   - Return the value received\n\
    \nThe invoking code is shown below:\n\n```\n// Create Square class and assign\
    \ Size from UI\nSquare square = new Square();\nsquare.Size = SquarePanel.Width;\n\
    \n// Use Adapter to calculate the area\nCalculatorAdapter adapter = new CalculatorAdapter();\n\
    int area = adapter.GetArea(square);\n\n// Display the result back to UI\nResultLabel.Text\
    \ = \"Area: \" + area.ToString();\n```\n\nOn running the sample application we\
    \ can see the following results."
