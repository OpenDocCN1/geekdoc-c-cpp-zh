    \ Memory Management\n+   - File Locking Overheads are Avoided\n\nThe limitations\
    \ of Singleton are listed below:\n\n+   - Making Constructor as Private impose\
    \ Restrictions\n+   - More Overheads in Multi-threaded usage (But Thread Safe\
    \ in .Net)\n\n# Summary\n\nIn this chapter we have seen what is Singleton pattern\
    \ and a possible implementation of it using C#.NET. Multiton is another pattern\
