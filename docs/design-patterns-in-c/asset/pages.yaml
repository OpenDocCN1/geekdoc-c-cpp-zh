  md: '# 4. Decorator Pattern


    In this chapter I would like to demonstrate the Decorator Pattern. It provides
    a new way of adding responsibilities in the runtime and thus a good alternative
    to sub classing.


    # Challenge


    You have an Album class today which is just blank now. Tomorrow the customer wants
    a Christmas tree on that. You need to achieve this without modifying the Album
    class.


    How to achieve this during runtime?


    # Definition


    GoF Definition: "Attach additional responsibilities to an object dynamically.
    Decorators provide a flexible alternative to sub classing for extending functionality"


    # Closed for Modification and Open for Extension


    One of the main challenges we face in development is Change. The Closed for Modification
    and Open for Extension principle says a new functionality can be added by keeping
    the original code unchanged.


    # Example:


    We will modify the original Album class to incorporate the Christmas tree on it.
    This should not be the best approach. There is a better approach to this. We can
    still keep the Album class unchanged and add the Christmas tree to it. Everything
    happens in the runtime – that is the cool part of it.


    # Some more examples


    We can see real life controls like Form, Button etc. There would be a Form class
    with built-in functionality. Still the user can use it and add new controls to
    it / extend the functionality. Here we will be basically deriving from the existing
    Form/Button class and add new methods or properties to it.


    The difference between the above approach and Decorator pattern is that, in the
    Decorator pattern, it is done during runtime.


    # Conclusion on Change


    So basically we can conclude that whenever changes are required, the possible
    solutions could be:'
