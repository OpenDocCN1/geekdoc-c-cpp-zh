  md: '# 10. Chain of Responsibility Pattern


    Chain of Responsibility is one among the 23 Design Patterns by Gang of Four. It
    is an interesting pattern and similar to Observer pattern. In this chapter we
    are exploring the Chain of Responsibility pattern.


    I am using the same Challenge and Solution style for explaining this pattern.


    # Challenge


    You are working on an application in which the **Logic** class generates various
    messages. The messages are of two types.


    +   - Normal Priority

    +   - High Priority


    The Normal Priority messages are to be processed by **Logger** class and High
    Priority messages by **Emailer** class.


    You have to make the design in such a way that the **Logic** class need not think
    about right handler of the message. It will just send the message.


    How the design will proceed?


    # Definition


    > GoF Definition: "Avoid coupling the sender of a request to its receiver by giving
    more than one object a chance to handle the request. Chain the receiving objects
    and pass the request along the chain until an object handles it"


    # Control Flow


    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_40_0.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Implementation\n\nFollowing is the definition for Logic class:\n\n```\npublic\
    \ class Logic\n{\n    public IReceiver Receiver;\n\n    public void CreateMessage(Message\
    \ message)\n    {\n        if (Receiver != null)\n            Receiver.HandleMessage(message);\n\
    \    }\n}\n```\n\nWe can see from the above code that the Logic class has a property\
    \ of type IReceiver. On the CreateMessage method this Receiver is used to handle\
    \ the message. So only one receiver is registered by the Logic class instance.\n\
    \nFollowing are the definition of Message class and MessagePriority enumeration:\n\
    \n```\npublic class Message\n{\n    public string Text;\n    public MessagePriority\
    \ Priority;\n}\n```\n\n```\npublic enum MessagePriority\n{\n    Normal,\n    High\n\
    }\n```\n\nFollowing are the Receiver Interface and Implementation classes:\n\n\
    ```\npublic interface IReceiver\n{\n    bool HandleMessage(Message message);\n\
    }\n```\n\n```\npublic class Logger : IReceiver\n{\n    private IReceiver _nextReceiver;\n\
    \n    public Logger(IReceiver nextReceiver)\n    {\n        _nextReceiver = nextReceiver;\n\
    \    }\n\n    public bool HandleMessage(Message message)\n    {\n        if (message.Priority\
    \ == MessagePriority.Normal)\n        {\n            Trace.WriteLine(message.Text\
    \ + \" : Logger processed it!\");\n            return true;\n        }\n     \
    \   else\n        {\n            if (_nextReceiver != null)\n                _nextReceiver.HandleMessage(message);\n\
    \        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "```\n```csharp\nreturn false;\n}\n}\n\npublic class Emailer : IReceiver\n{\n\
    \    private IReceiver _nextReceiver;\n\n    public Emailer(IReceiver nextReceiver)\n\
    \    {\n        _nextReceiver = nextReceiver;\n    }\n\n    public bool HandleMessage(Message\
    \ message)\n    {\n        if (message.Priority == MessagePriority.High)\n   \
    \     {\n            Trace.WriteLine(message.Text + \" : Emailer processed it!\"\
    );\n            return true;\n        }\n        else\n        {\n           \
    \ if (_nextReceiver != null)\n                _nextReceiver.HandleMessage(message);\n\
    \        }\n\n        return false;\n    }\n}\n```\n```\n\nFrom the above code\
    \ we can see that each receiver class checks the message priority and processes\
    \ it. If the priority is not matching it is send to the next receiver in the chain.\n\
    \nHere each receiver takes care of passing the unprocessed message. The next receiver\
    \ is stored through the constructor of each receiver.\n\nThe chain will be executed\
    \ until:\n\n+   - Message is processed\n+   - Receiver chain exhausted\n\n# Code\
    \ Execution\n\nThe windows forms application attached can be used to test the\
    \ control flow."
  merge: -1
