- pgno: 48
  md: "# 12. Factory Method Pattern\n\nIn the previous chapter you might have read\
    \ about Abstract Factory. It says about abstracting a class with related objects.\
    \ In this chapter we are discussing on Factory Method pattern. I am using the\
    \ same ADO.NET Provider Factory class as example. Let us see the challenge and\
    \ evolve to the solution.\n\n# Challenge\n\nYou are working on a windows application.\
    \ The application has 2 types of users based on the database license they have:\
    \ Sql Server or Oracle.\n\nSo for each database operation you need to create the\
    \ right database classes based on an enumeration DatabaseType.\n\n```\npublic\
    \ void InsertRecord()\n{\n    if (AppContext.DatabaseType == DatabaseType.SqlServer)\n\
    \    {\n        SqlConnection connection = new SqlConnection();\n        SqlCommand\
    \ command = new SqlCommand();\n\n        command.Connection = connection;\n  \
    \      command.ExecuteNonQuery();\n    }\n    else if (AppContext.DatabaseType\
    \ == DatabaseType.Oracle)\n    {\n        OracleConnection connection = new OracleConnection();\n\
    \        OracleCommand command = new OracleCommand();\n\n        command.Connection\
    \ = connection;\n        command.ExecuteNonQuery();\n    }\n}\n```\n\nThe above\
    \ code seems to be complex and needs repeating for each database operation spread\
    \ throughout the application.\n\nHow to stop the repeating code and make things\
    \ better?\n\n# Definition\n\nGoF Definition: \"Define an interface for creating\
    \ an object, but let subclasses decide which class to instantiate. Factory method\
    \ lets a class defer instantiation to subclasses\"\n\n# Implementation\n\nThe\
    \ above problem can be resolved using Factory Method pattern. Here we provide\
    \ an abstract class for defining the structure and associating all related objects\
    \ (using Abstract Factory). Then the sub classes will be created deriving from\
    \ this abstract class. The sub classes decide which classes to be instantiated."
  merge: -1
  img_proc: true
- pgno: 49
  md: "The advantage is more quality and less code. Here we have to define an abstract\
    \ class named DbProviderFactory. (already ADO.NET contains it)\n\n```\npublic\
    \ abstract class DbProviderFactory\n{\n    public virtual DbCommand CreateCommand();\n\
    \    public virtual DbCommandBuilder CreateCommandBuilder();\n    public virtual\
    \ DbConnection CreateConnection();\n    public virtual DbDataAdapter CreateDataAdapter();\n\
    \    public virtual DbParameter CreateParameter();\n}\n```\n\nThen from the above\
    \ abstract class we can derive concrete classes.\n\n```\npublic class SqlClientFactory\
    \ : DbProviderFactory\n{\n    public override DbConnection CreateConnection()\n\
    \    {\n        return new SqlConnection();\n    }\n\n    public override DbCommand\
    \ CreateCommand()\n    {\n        return new SqlCommand();\n    }\n}\n```\n\n\
    You can see from the above code SqlConnection() and SqlCommand() objects are created\
    \ and supplied for DbConnection and DbCommand types respectively. Here DbConnection\
    \ and DbCommand are other abstract classes.\n\nSimilary the Oracle implementation\
    \ follows:\n\n```\npublic class OracleClientFactory : DbProviderFactory\n{\n \
    \   public override DbConnection CreateConnection()\n    {\n        return new\
    \ OracleConnection();\n    }\n\n    public override DbCommand CreateCommand()\n\
    \    {\n        return new OracleCommand();\n    }\n}\n```\n\n# Replacing the\
    \ Original Code\n\nNow we are ready to replace our Insert() method code with the\
    \ Factory Method classes. Here we are using an AppInit() code to create the factory\
    \ which will be used throughout the application.\n\n```\npublic void AppInit()\n\
    {\n    if (AppContext.DatabaseType == DatabaseType.SqlServer)\n        AppContext.DbProviderFactory\
    \ = SqlClientFactory.Instance;\n```"
  merge: -1
  img_proc: true
