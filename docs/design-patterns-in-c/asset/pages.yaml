    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_87_0.png)


    This concludes our application using the Interpreter Pattern. Now the actions
    could be converted to a language for interpreting later.


    # Comparison of Command Pattern and Interpreter Pattern


    You can find some similarities between the Command and Interpreter patterns. The
    command pattern says about converting the actions into command for logging or
    undo purposes. Here the commands are objects but for the Interpreter pattern the
    commands are sentences.


    The Command pattern can be used for persisting objects by serializing the command
    list and results in large sized files compared with Interpreter pattern. The Interpreter
    pattern provides an easier approach in the runtime but comes at the cost of developing
    and interpreter.


    # Applications of Interpreter Pattern


    You are creating your own Photoshop application. The objects drawn on the layer
    can be converted to a series of commands. Later the entire drawing could be represented
    using the command file which will be small in size compared to the entire canvas
    serialized. You will get the advantage of sending the file to another person where
    he/she can:


    +   - Regenerate the Drawing

    +   - View all the Draw Actions

    +   - Modify the Draw Action Items

    +   - Undo the last draw actions'
