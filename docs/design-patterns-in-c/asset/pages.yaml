  md: "# 15. Facade Pattern\n\nIn this chapter I would like to explore the Façade\
    \ design pattern. The actual pronunciation is fu’saad. The dictionary meaning\
    \ of the word Façade is “A showy misrepresentation intended to conceal something\
    \ unpleasant”\n\nNow let us enter the challenge..\n\n# Challenge\n\nYou are working\
    \ on a database application. Frequently you need to execute UPDATE and DELETE\
    \ SQL queries. Each time there is a need to create the SqlConnection and SqlCommand\
    \ class, assign the connection to command and execute the query.\n\nThe series\
    \ of activities looks like:\n\n```\nSqlConnection connection = new SqlConnection(\"\
    connection string\");\nSqlCommand command = new SqlCommand();\ncommand.Connection\
    \ = connection;\ncommand.CommandText = \"UPDATE Customer SET Processed=1\";\n\
    command.ExecuteNonQuery();\n```\n\nYou need to repeat the same code wherever execute\
    \ queries are required. How to make this code better?\n\n# Definition\n\nGoF Definition:\
    \ \"Provide a unified interface to a set of interfaces in a system. Facade defines\
    \ a higher-level interface that makes the subsystem easier to use\"\n\n# Implementation\n\
    \nUsing Façade, we can improve the situation. We can find only the query is different\
    \ in each case – the parameters like connection string is common for the entire\
    \ application.\n\n```\nSQLFacade.ExecuteSQL(\"UPDATE query here..\");\n```\n\n\
    After using the Façade the code will look like above.\nThe complicated code is\
    \ being pulled to the background SQLFacade class.\n\n```\nnamespace FacadePattern\n\
    {\n    public class SQLFacade\n    {\n        public static bool ExecuteSQL(string\
    \ sql)\n        {\n            SqlConnection connection = new SqlConnection(\"\
    connection string\");\n            SqlCommand command = new SqlCommand();\n  \
    \          command.Connection = connection;\n            command.CommandText =\
    \ sql;\n            command.ExecuteNonQuery();\n```"
