  md: '# 20. Prototype Pattern


    In this chapter I would like to explain the Prototype Pattern and C# support for
    it. The prototype pattern provides an alternative to instantiating new objects
    by copying the prototype of an existing one.


    # Challenge


    You are working on an application having setting stored in class Settings. The
    properties of the class are assigned inside the constructor. It involves calling
    the configuration file, security database, user profile database etc.


    You need to pass the above instance to a component inside a library. The component
    could play around with the properties so we need to send only another instance
    of Settings. As the instance creation is expensive we need to create a copy of
    the above instance.


    What would be the best approach?


    # Definition


    GoF Definition: "Specify the kinds of objects to create using a prototypical instance,
    and create new objects by copying this prototype"


    # Solution


    We can use the Prototype pattern to address this scenario. This pattern allows
    us to create a new instance by prototyping an existing instance with required
    properties.


    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_77_0.png)


    Create new object and modify it. Create prototypes from modified object.


    The System.object class includes new method named MemberwiseClone() which provides
    a shallow copy of the current object. Shallow copy involves copying only'
  merge: -1
  img_proc: true
