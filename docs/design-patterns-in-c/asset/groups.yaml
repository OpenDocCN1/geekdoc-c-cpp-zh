    \n如何在运行时实现这一点？\n\n### Definition\n\nGoF 定义：\"动态地为对象附加额外的职责。装饰器提供了一种灵活的替代子类化以扩展功能的方法\"\
    \n\n### Closed for Modification and Open for Extension\n\n我们在开发中面临的主要挑战之一是变化。封闭修改、开放扩展原则指出，可以在不改变原始代码的情况下添加新功能。\n\
    \n### Example:\n\n我们将修改原始的 Album 类以在其上加入圣诞树。这可能不是最好的方法。有一个更好的方法。我们仍然可以保持 Album\
    \ 类不变，并在其上添加圣诞树。所有操作都在运行时进行——这就是它的精妙之处。\n\n### Some more examples\n\n我们可以看到现实生活中的控件，如\
    \ Form、Button 等。会有内置功能的 Form 类。用户仍然可以使用它并添加新控件/扩展功能。在这里，我们基本上是从现有的 Form/Button\
    \ 类派生并添加新方法或属性。\n\n上述方法与装饰器模式的区别在于，装饰器模式是在运行时完成的。\n\n### Conclusion on Change\n\
    \n因此，我们基本上可以得出结论，每当需要更改时，可能的解决方案可以是：\n\n"
