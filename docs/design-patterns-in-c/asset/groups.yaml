  md: "\nThe value types. Coupled with ICloneable interface, we can provide a Clone()\
    \ method that invokes MemberwiseClone() for the Settings class.\n\n```csharp\n\
    public class Settings : ICloneable\n{\n    public Settings()\n    {\n        //\
    \ Load ApplicationSettings from Configuration\n        // Load ThemeSettings from\
    \ Database\n        // Load UserSettings from Database\n        Thread.Sleep(3000);\
    \ // Simulate a delay for the above operations\n\n        ApplicationSettings\
    \ = \"ApplicationSettings1\";\n        ThemeSettings = \"ThemeSettings1\";\n \
    \       UserSettings = \"UserSettings1\";\n    }\n\n    public string ApplicationSettings\n\
    \    {\n        get;\n        set;\n    }\n\n    public string ThemeSettings\n\
    \    {\n        get;\n        set;\n    }\n\n    public string UserSettings\n\
    \    {\n        get;\n        set;\n    }\n\n    public object Clone()\n    {\n\
    \        return this.MemberwiseClone();\n    }\n\n    public override string ToString()\n\
    \    {\n        return this.ApplicationSettings + \" \" +\n               this.ThemeSettings\
    \ + \" \" +\n               this.UserSettings;\n    }\n}\n```\n\n### Executing\
    \ the Application\n\nNow we can try playing with the class instances. First we\
    \ create an instance of Settings (which is a 3 second delay process). Later we\
