    # 21. Bridge Pattern


    In this chapter we can explore the Bridge pattern which is commonly used in applications.


    # Challenge


    You are working on an abstract business class. The class needs to log information
    to by writing to a file, email to user etc. We need to avoid tightly coupling
    of the business class and logger as in future newer versions of logger might appear.


