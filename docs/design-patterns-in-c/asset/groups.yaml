    \ results in large sized files compared with Interpreter pattern. The Interpreter\
    \ pattern provides an easier approach at runtime but comes at the cost of developing\
    \ an interpreter.\n\n### Applications of Interpreter Pattern\n\nYou are creating\
    \ your own Photoshop application. The objects drawn on the layer can be converted\
    \ to a series of commands. Later the entire drawing could be represented using\
    \ the command file which will be small in size compared to the entire canvas serialized.\
    \ You will get the advantage of sending the file to another person where he/she\
    \ can:\n\n- Regenerate the Drawing\n- View all the Draw Actions\n- Modify the\
    \ Draw Action Items\n- Undo the last draw actions\n\n### References\n\nhttp://www.dofactory.com/Patterns/PatternInterpreter.aspx#_self1\n\
    \n### Summary\n\nIn this chapter we have seen about the Interpreter pattern with\
    \ a small application using it. The above application shows only a simple usage\
    \ for learning purpose but in the real world scenarios the language may include\
    \ loops, conditions etc. The attachment contains the source code of application\
    \ we have discussed.\n\n## 23. Composite Pattern\n\nIn this chapter we can explore\
    \ the Composite Design Pattern. It provides a better approach in addressing communication\
    \ with individual and group of objects. As usual we can start with the Challenge\
    \ – Solution approach.\n\n### Challenge\n\nYou are working on a distributed application\
    \ containing Head Office and Branch Offices. Each office will be having 2 Clock\
    \ Controls which needed to be updated globally during Daylight Saving times.\n\
    \n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_89_0.png)\n\nThe above diagram shows\
    \ the current structure. There will be only 1 Head Office and multiple branches\
    \ under it. The head office and each branch will be having 2 clock controls. The\
    \ time changing process starts from the head office and in the current approach,\
    \ the head office has to remember all branches and all clocks inside each branch.\
    \ This is very tedious and will break when there is consolidation of branches\
    \ under one branch group.\n\nHow to provide a better solution?\n\n### Definition\n\
    \nGoF Definition: \"Compose objects into tree structures to represent part-whole\
    \ hierarchies. Composite lets clients treat individual objects and compositions\
    \ of objects uniformly\"\n\n### Implementation\n\nWe can use the Composite Design\
    \ Pattern in the above scenario. Once our solution is implemented the Head Office\
    \ needs to think about only the Branches. The Branches will think about their\
    \ respective Clocks.\n\nThere are 2 classes in our solution: Office and Clock.\
    \ The Office class can represent Head Office and Branches. The Clock class manages\
    \ the clock control for changing time.\n\nWe need to introduce one interface which\
    \ will be implemented by the Office and Clock classes.\n\n```csharp\ninterface\
    \ IComponent\n{\n    void Add (IComponent notifier);\n    void SetTime(DateTime\
    \ time);\n}\n```\n\nThe Add() method ensures adding a component of type IComponent.\
    \ It can be used to add an Office or Clock instance.\n\nThe SetTime() method can\
    \ be used to change the current time.\n\n### Class Implementations\n\nFollowing\
    \ are the implementations of the Office and Clock classes:\n\n```csharp\nclass\
    \ Office : IComponent\n{\n    private IList<IComponent> _list = new List<IComponent>();\n\
    \n    public void Add(IComponent notifier)\n    {\n        _list.Add(notifier);\n\
    \    }\n\n    public void SetTime(DateTime time)\n    {\n        foreach (IComponent\
    \ n in _list)\n            n.SetTime(time);\n    }\n}\n\nclass Clock : IComponent\n\
    {\n    public ClockControl ClockControl;\n\n    public void Add(IComponent notifier)\n\
    \    {\n        throw new ApplicationException(\"You cannot add IClock!\");\n\
    \    }\n\n    public void SetTime(DateTime time)\n    {\n        ClockControl.CurrentTime\
    \ = time;\n    }\n}\n```\n\nPlease note that the SetTime() implementation of Office\
    \ class takes care of informing all the added IComponent instances. Thus the Head\
    \ Office can notify all the branches. The branches will notify all the clock instances.\n\
    \n### Creating Instances\n\nFollowing is the code of instance creation for Head\
    \ Office and Branches.\n\n```csharp\n_headOffice = new Office();\n_headOffice.Add(new\
    \ Clock() { ClockControl = hForm.clock1 });\n_headOffice.Add(new Clock() { ClockControl\
    \ = hForm.clock2 });\n\nOffice branch1 = new Office();\nbranch1.Add(new Clock()\
    \ { ClockControl = b1Form.clock1 });\nbranch1.Add(new Clock() { ClockControl =\
    \ b1Form.clock2 });\n_headOffice.Add(branch1);\n\nOffice branch2 = new Office();\n\
    branch2.Add(new Clock() { ClockControl = b2Form.clock1 });\nbranch2.Add(new Clock()\
    \ { ClockControl = b2Form.clock2 });\n_headOffice.Add(branch2);\n```\n\nPlease\
    \ note that the branch instances are added to the head office.\n\n### Running\
    \ the Application\n\nOn clicking the Set Time button you can see all the clocks\
    \ are reset to 10:00 AM.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_91_0.png)\n\
    \nHere the Head Office does not need to think about all the clock instances of\
    \ branches. Here the individual objects (clocks) and composite objects (branches)\
    \ are treated uniformly satisfying the pattern definition.\n\n### Summary\n\n\
    In this chapter we have explored the Composite Pattern. It provides a centralized\
    \ approach in talking with individual and combined objects. The attachment contains\
    \ the example application including the clock control we have discussed.\n\n###\
    \ References\n\nThe ebook is compiled on information collected from Books, MSDN\
    \ and other Online Resources. It took almost 1 year to cover all the chapters\
    \ and so some of the reference links will be obsolete.\n\nYou can find more information\
    \ on Design Patterns using the following links:\n\nhttp://www.dofactory.com\n\n\
    http://www.oodesign.com\n\n### Source Code\n\nThe source code for the ebook can\
    \ be found over http://jeanpaulva.com.\n\n"
  mdcn: "\n\n以下是类图：\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_87_0.png)\n\n至此，我们使用解释器模式的应用就结束了。现在这些操作可以被转换为一种语言以便后续解释。\n\
    \n## 命令模式与解释器模式的比较\n\n你可以在命令模式和解释器模式之间找到一些相似之处。命令模式说的是将操作转换为命令以用于记录或撤销目的。这里的命令是对象，但对于解释器模式来说，命令是句子。\n\
    \n命令模式可用于通过序列化命令列表来持久化对象，与解释器模式相比会导致文件较大。解释器模式在运行时提供了一种更简单的方法，但代价是需要开发一个解释器。\n\
    \n### 解释器模式的应用\n\n你正在创建自己的 Photoshop 应用。图层上绘制的对象可以转换为一系列命令。之后，整个绘图可以用命令文件表示，该文件与整个画布序列化相比体积会更小。你将获得将文件发送给其他人的优势，他/她可以：\n\
    \n- 重新生成绘图\n- 查看所有绘图操作\n- 修改绘图操作项\n- 撤销最后的绘图操作\n\n### 参考\n\nhttp://www.dofactory.com/Patterns/PatternInterpreter.aspx#_self1\n\
    \n### 总结\n\n在本章中，我们通过一个小型应用了解了解释器模式。上述应用仅展示了简单的用法以供学习，但在真实世界的场景中，该语言可能包含循环、条件等。附件包含我们讨论的应用的源代码。\n\
    \n## 23. 组合模式\n\n在本章中我们可以探索组合设计模式。它在与单个对象和对象组进行通信时提供了一种更好的方法。如常，我们可以从挑战-解决方案方法开始。\n\
    \n### 挑战\n\n你正在开发一个包含总部和分支机构的分布式应用。每个办公室在夏令时期间都需要全局更新 2 个时钟控件。\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_89_0.png)\n\
    \n上图显示了当前结构。总部只有一个，下设多个分支。总部和每个分支都将拥有 2 个时钟控件。时间更改过程从总部开始，在当前方法中，总部必须记住所有分支以及每个分支内部的所有时钟。这非常繁琐，并且在分支合并到一个分支组时会失效。\n\
    \n如何提供更好的解决方案？\n\n### 定义\n\nGoF 定义：“将对象组合成树形结构以表示整体-部分层次结构。组合模式让客户端可以统一地处理单个对象和对象组合”\n\
    \n### 实现\n\n我们可以在上述场景中使用组合设计模式。一旦我们的解决方案实现，总部只需要考虑分支。分支将考虑各自的时钟。\n\n我们的解决方案中有\
    \ 2 个类：Office 和 Clock。Office 类可以表示总部和分支。Clock 类管理用于更改时间的时钟控件。\n\n我们需要引入一个接口，由\
    \ Office 和 Clock 类实现。\n\n```csharp\ninterface IComponent\n{\n    void Add (IComponent\
    \ notifier);\n    void SetTime(DateTime time);\n}\n```\n\nAdd() 方法确保添加类型为 IComponent\
    \ 的组件。可用于添加 Office 或 Clock 实例。\n\nSetTime() 方法可用于更改当前时间。\n\n### 类实现\n\n以下是 Office\
    \ 和 Clock 类的实现：\n\n```csharp\nclass Office : IComponent\n{\n    private IList<IComponent>\
    \ _list = new List<IComponent>();\n\n    public void Add(IComponent notifier)\n\
    \    {\n        _list.Add(notifier);\n    }\n\n    public void SetTime(DateTime\
    \ time)\n    {\n        foreach (IComponent n in _list)\n            n.SetTime(time);\n\
    \    }\n}\n\nclass Clock : IComponent\n{\n    public ClockControl ClockControl;\n\
    \n    public void Add(IComponent notifier)\n    {\n        throw new ApplicationException(\"\
    You cannot add IClock!\");\n    }\n\n    public void SetTime(DateTime time)\n\
    \    {\n        ClockControl.CurrentTime = time;\n    }\n}\n```\n\n请注意，Office\
    \ 类的 SetTime() 实现负责通知所有添加的 IComponent 实例。因此总部可以通知所有分支。分支将通知所有时钟实例。\n\n### 创建实例\n\
    \n以下是总部和分支实例创建的代码。\n\n```csharp\n_headOffice = new Office();\n_headOffice.Add(new\
    \ Clock() { ClockControl = hForm.clock1 });\n_headOffice.Add(new Clock() { ClockControl\
    \ = hForm.clock2 });\n\nOffice branch1 = new Office();\nbranch1.Add(new Clock()\
    \ { ClockControl = b1Form.clock1 });\nbranch1.Add(new Clock() { ClockControl =\
    \ b1Form.clock2 });\n_headOffice.Add(branch1);\n\nOffice branch2 = new Office();\n\
    branch2.Add(new Clock() { ClockControl = b2Form.clock1 });\nbranch2.Add(new Clock()\
    \ { ClockControl = b2Form.clock2 });\n_headOffice.Add(branch2);\n```\n\n请注意，分支实例已添加到总部。\n\
    \n### 运行应用\n\n点击设置时间按钮，你可以看到所有时钟都重置为上午 10:00。\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_91_0.png)\n\
    \n这里总部不需要考虑分支的所有时钟实例。这里单个对象（时钟）和组合对象（分支）被统一处理，满足了模式定义。\n\n### 总结\n\n在本章中，我们探索了组合模式。它在与单个对象和组合对象通信时提供了一种集中化的方法。附件包含我们讨论的示例应用，包括时钟控件。\n\
    \n### 参考\n\n该电子书是在收集书籍、MSDN 和其他在线资源的信息后编译的。花费了近 1 年时间覆盖所有章节，因此部分参考链接可能会失效。\n\n\
    你可以使用以下链接找到有关设计模式的更多信息：\n\nhttp://www.dofactory.com\n\nhttp://www.oodesign.com\n\
    \n### 源代码\n\n电子书的源代码可在 http://jeanpaulva.com 上找到。\n\n"
