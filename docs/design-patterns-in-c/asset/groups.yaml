    # 6. Template Method Pattern


    Template Method is a widely used design pattern and it provides great flexibility
    in our designs. This is one of my favourite patterns.


    # Challenge


    You are creating machines for creating Pizza and Burger. When we look closely
    we can see all the machines have some operations in common and in the same order.


    +   - Start

    +   - Produce

    +   - Stop


    The Start operation consists of turning on the machines, do the system check for
    any troubles and turning on the indicators.


    The Produce operation does the respective production of item.


    The Stop operation shutdowns the internal workings of the machine, turns off the
    indicators and power offs the machine.


    The challenge is to create more machines like Cheese Burger, Pan Pizza with less
    custom implementations. We need to take care that the duplicate codes are avoided
    in our design.


    # Definition


    GoF Definition: "Define the skeleton of an algorithm in an operation, deferring
    some steps to subclasses. Template Method lets subclasses redefine certain steps
    of an algorithm without changing the algorithm’s structure"


    # Implementation


    We can see that all the operation appears in the same sequence. Often the Start
    and Stop operation are common to both Pizza and Burger machines.


    So we can define a skeleton of algorithm (or the order of invocation) like below:


    +   1. Start

    +   2. Produce

    +   3. Stop'
  - "[PAGE 25]\n\nWe can see all the machines have this order of execution. Only the\
    \ Produce operation will be different.\n\nSo creating an Execute() method to incorporate\
    \ this would look like:\n\n```\npublic class Machine\n{\n    public void Execute()\n\
    \    {\n        Start();\n        Produce();\n        Stop();\n    }\n}\n```\n\
    \nBy calling the Execute() method we can invoke all the 3 methods in the right\
    \ order. Keeping the Execute() method in the base class as public, we can create\
    \ Produce() method as virtual so that it can be overridden. For more customization\
    \ we are making all the 3 methods as virtual.\n\n# Note\n\nFor virtual methods,\
    \ a default implementation will be provided in the base class. The derived class\
    \ may/may not override it.\n\nFor abstract methods, we need to override them in\
    \ the derived class. There won’t be any default implementation in the base class.\n\
    \nThe modified Machine class will look like below:\n\n```\npublic class Machine\n\
    {\n    public void Execute()\n    {\n        Start();\n        Produce();\n  \
    \      Stop();\n    }\n\n    protected virtual void Start()\n    {\n        Trace.WriteLine(\"\
    Machine.Starting..\");\n    }\n\n    protected virtual void Produce()\n    {\n\
    \        Trace.WriteLine(\"Machine.Producing..\");\n    }\n\n    protected virtual\
    \ void Stop()\n    {\n        Trace.WriteLine(\"Machine.Stopping..\");\n    }\n\
    }\n```"
  - "[PAGE 26]\n\nPlease note the class uses **virtual** keyword so that the derived\
    \ classes can override.\n\nThe derived class PizzaMachine will look like:\n\n\
    ```\npublic class PizzaMachine : Machine\n{\n    protected override void Produce()\n\
    \    {\n        Trace.WriteLine(\"PizzaMachine.Producing..\");\n    }\n}\n```\n\
    \nThe derived class BurgerMachine will look like:\n\n```\npublic class BurgerMachine\
    \ : Machine\n{\n    protected override void Produce()\n    {\n        Trace.WriteLine(\"\
    BurgerMachine.Producing..\");\n    }\n}\n```\n\nPlease note that both of them\
    \ derives from **Machine** class and use the keyword **override** to custom implement\
    \ the Produce() method.\n\n# Execution\n\nNow we can execute the PizzaMachine\
    \ using the Execute() method of base class.\n\n```\nnew PizzaMachine().Execute();\n\
    ```\n\nLet us examine how the order of execution works.\n\n+   1. Machine.Execute()\
    \ is invoked\n+   2. Machine.Start() is invoked\n+   3. PizzaMachine.Produce()\
    \ is invoked\n+   4. Machine.Stop() is invoked\n\nPlease note the step 3 above,\
    \ in which the execution shifts from Machine class to PizzaMachine class. This\
    \ is the power of Template Method pattern. Here the order of execution is maintained\
    \ and a custom production is done.\n\n# Note\n\nThe underlying detail of how the\
    \ above code works goes to Virtual Method Table (VMT) where the base class method\
    \ address is kept in a table. The derived classes will be having a new address\
    \ for the derived method. This will be replacing the original base class method\
    \ address.\n\nThe control flow is depicted in the image below."
