    # 18. Mediator Pattern


    In this chapter I would like to take you through the advantage of using Mediator
    Pattern. As always, Design Patterns if properly used gives us more flexibility
    and manageability. Mediator Pattern is of no deviation from this property.


    # Challenge


    You are working on an Airline application managing flight validations. As you
    might know before taking off the flight, it goes through a series of checks ensuring
    the health of each component, the fuel level etc.


    Our Flight class contains the following component classes


    +   - Engine

    +   - Wheels

    +   - Cockpit

    +   - Aviation


    Each of the component class will be having a method named Start(). On invoking
    the method, it will ensure that the current state of component is valid through
    a method named IsReady(). If the IsReady() method returned true, the component
    class checks the other component IsReady() method.


    For example the Engine class ensures the Wheels and Aviation is in valid statue
    by using the IsReady() method of Wheel and Aviation respectively. The Cockpit
    in turn checks itself, Engine and the Aviation status. So there exists a coupling
    between the classes and code duplications. The scenario will become worse on introducing
    new components as classes.


    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_69_0.png)


    How to make the code better?'
  - "[PAGE 70]\n\n# Definition\n\nGoF Definition: \"Define an object that encapsulates\
    \ how a set of objects interact. Mediator promotes loose coupling by keeping objects\
    \ from referring to each other explicitly, and it lets you vary their interaction\
    \ independently\"\n\n# Implementation\n\nWe can improve the above situation by\
    \ introducing the Mediator pattern. Through the introduction of Mediator the component\
    \ classes won’t talk to each other. All the components communicate to a new Mediator\
    \ class. The advantages are:\n\n+   - Loosely coupled components\n+   - Centralized\
    \ Management\n+   - More Flexibility in changing code\n\nThe new approach will\
    \ look like below:\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_70_0.png)\n\nHere\
    \ the component parts will communicate with the Mediator class for providing the\
    \ ready signal to proceed with.\n\n# Classes\n\nFollowing are the classes associated\
    \ with the new implementation using Mediator Pattern.\n\n```\npublic class FlightMediator\n\
    {\n    private Engine _engine;\n    private Aviation _aviation;\n    private Wheels\
    \ _wheels;\n    private Cockpit _cockpit;\n\n    public FlightMediator(Engine\
    \ engine, Aviation aviation, Wheels wheels, Cockpit cockpit)\n    {\n        _engine\
    \ = engine;\n        _aviation = aviation;\n        _wheels = wheels;\n      \
    \  _cockpit = cockpit;\n```"
