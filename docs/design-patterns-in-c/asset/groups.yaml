    # Invoking


    In the main form we create an instance of Album class and assign it to form field
    _album.


    ```

    private Album _album;

    _album = new Album(_graphics);

    _album.Draw();

    ```


    In the runtime, when user wants a Christmas Tree, an instance of ChristmasTreeDecorator
    is created.


    ```

    _album = new ChristmasTreeDecorator(_album);

    _album.Draw();

    ```


    In the above code we can see the same _album.Draw() method is called.


    # How it works


    Whenever we call the Draw() method of a decorator class, it in turns calls the
    original Album.Draw(). After that it will call it''s own Draw() method. In this
    way we can pass the same album instance to multiple decorators. If there are 10
    decorators, all the decorator Draw() methods will be invoked.


    You can test this by placing a breakpoint inside the StarDecorator Draw() method.


    # Note


    In the real world scenario we can use Decorator Pattern to calculate Taxes as
    decorators for the Item Price. The Tax, Extra Tax etc. can be wrapped as decorators
    around the original item price.


    # Summary


    Using decorator we can add dynamic responsibilities to an object in runtime. This
    provides us the flexibility of creating an instance of decorators on an as-needed
    basis. This would provide a real advantage in scenarios where the additional responsibility
    increases the use of memory. The attachment contains the example we have discussed.'
