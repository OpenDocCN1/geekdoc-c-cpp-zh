  - "[PAGE 11]\n\n```\ncommand = new RectangleCommand(_bitmap, _activeColor, e.X,\
    \ e.Y);\ncommand.Do();\n_commandStack.Push(command);\nRefreshUI();\n}\n```\n\n\
    Let us take an example: assume the user clicked the mouse at Point X=100 and Y=200.\
    \ As the _activeShape is Square, a new SquareCommand class instance is created\
    \ with arguments e.X and e.Y. The remaining arguments are bitmap and the active\
    \ color. Then the command instance would be pushed to a stack and the Do() operation\
    \ is called.\n\nThe stack provides a storage for usage of the command instance\
    \ later. The declaration of stack is:\n\n```\nprivate Stack<ICommand> _commandStack\
