    \ The examples we discussed above are included in the source code attachment.\n\
    \n## 18. Mediator Pattern\n\nIn this chapter I would like to take you through\
    \ the advantage of using Mediator Pattern. As always, Design Patterns if properly\
    \ used gives us more flexibility and manageability. Mediator Pattern is of no\
    \ deviation from this property.\n\n### Challenge\n\nYou are working on an Airline\
    \ application managing flight validations. As you might know before taking off\
    \ the flight, it goes through a series of checks ensuring the health of each component,\
    \ the fuel level etc.\n\nOur Flight class contains the following component classes:\n\
    \n- Engine\n- Wheels\n- Cockpit\n- Aviation\n\nEach of the component classes will\
    \ have a method named Start(). On invoking the method, it will ensure that the\
    \ current state of component is valid through a method named IsReady(). If the\
    \ IsReady() method returns true, the component class checks the other component\
    \ IsReady() method.\n\nFor example, the Engine class ensures the Wheels and Aviation\
    \ are in a valid state by using the IsReady() method of Wheels and Aviation respectively.\
    \ The Cockpit in turn checks itself, Engine, and the Aviation status. So there\
    \ exists a coupling between the classes and code duplications. The scenario will\
    \ become worse on introducing new components as classes.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_69_0.png)\n\
    \nHow to make the code better?\n\n### Definition\n\nGoF Definition: \"Define an\
    \ object that encapsulates how a set of objects interact. Mediator promotes loose\
    \ coupling by keeping objects from referring to each other explicitly, and it\
    \ lets you vary their interaction independently\"\n\n### Implementation\n\nWe\
    \ can improve the above situation by introducing the Mediator pattern. Through\
    \ the introduction of Mediator the component classes won’t talk to each other.\
    \ All the components communicate to a new Mediator class. The advantages are:\n\
    \n- Loosely coupled components\n- Centralized Management\n- More Flexibility in\
    \ changing code\n\nThe new approach will look like below:\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_70_0.png)\n\
    \nHere the component parts will communicate with the Mediator class for providing\
    \ the ready signal to proceed with.\n\n### Classes\n\nFollowing are the classes\
    \ associated with the new implementation using Mediator Pattern.\n\n```csharp\n\
    public class FlightMediator\n{\n    private Engine _engine;\n    private Aviation\
    \ _aviation;\n    private Wheels _wheels;\n    private Cockpit _cockpit;\n\n \
    \   public FlightMediator(Engine engine, Aviation aviation, Wheels wheels, Cockpit\
    \ cockpit)\n    {\n        _engine = engine;\n        _aviation = aviation;\n\
    \        _wheels = wheels;\n        _cockpit = cockpit;\n    }\n\n    public bool\
    \ IsReady()\n    {\n        return _engine.IsReady() && _aviation.IsReady() &&\
    \ _wheels.IsReady() &&\n               _cockpit.IsReady();\n    }\n}\n\npublic\
    \ class Engine\n{\n    public void Start()\n    {\n    }\n\n    public bool IsReady()\n\
    \    {\n        return true;\n    }\n}\n\npublic class Aviation\n{\n    private\
    \ int _FuelLevel = 1000;\n\n    public bool IsReady()\n    {\n        return _FuelLevel\
    \ > 5000; // Returns false as not enough fuel\n    }\n}\n\npublic class Wheels\n\
    {\n    public bool IsReady()\n    {\n        return true;\n    }\n}\n\npublic\
    \ class Cockpit\n{\n    public bool IsReady()\n    {\n        return true;\n \
    \   }\n}\n```\n\nPlease note that the Aviation class returns false for the IsReady()\
    \ method. The FlightMediator constructor takes all the component classes as inputs.\
    \ The IsReady() method checks all the associated component’s IsReady() method\
    \ to ensure validations are right.\n\nOn running the Windows Forms application,\
    \ you can see the following screen.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_72_0.png)\n\
    \nClicking on the FlightMediator button you can see the color changing to red\
    \ as the status returned is false.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_72_1.png)\n\
    \n### Summary\n\nIn this chapter we have explored the Mediator pattern. The example\
    \ is provided in a simple problem scenario, but the real world problems will be\
    \ much complicated. For example a Wizard Page Framework where each page has to\
    \ think about the previous and next pages could be made better using the Mediator\
    \ pattern. The associated source code is attached with the chapter.\n\n## 19.\
    \ Memento Pattern\n\nIn this chapter I would like to experiment with the Memento\
    \ pattern. Memento pattern provides an Object Oriented way of saving the state\
