    # 1. Singleton Pattern


    This is most popular pattern among the 23 Design Patterns. This pattern talks
    about efficient instance management.


    # Challenge


    You are working on an application which requires Logging information into a file
    named **Application.Log**. The logging is managed by a class named **LogManager**.
    The LogManager through its constructor keeps a lock on the File.


    The LogManager instance an be created throughout the application and it will result
    in Exceptions. Above that there is only instance requirement for the LogManager
    class.


    The above problem can be solved using Singleton Pattern.


    # Definition


    > GoF Definition: "Ensure a class only has one instance, and provide a global
    point of access to it"


    # Implementation


    To implement the specification above we have to perform the following:


    +   - Make the Constructor Private and Create only 1 Instance

    +   - Create a Static Property to Access the Instance


    Following is the modified class definition according to Singleton Pattern.


    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_5_0.png)'
  - "[PAGE 6]\n\nFollowing is the code contained in LogManager class.\n\n```\n```csharp\n\
    public class LogManager\n{\n    private static LogManager _instance;\n\n    public\
    \ static LogManager Instance\n    {\n        get\n        {\n            if (_instance\
    \ == null)\n                _instance = new LogManager();\n\n            return\
    \ _instance;\n        }\n    }\n\n    private LogManager()  // Constructor as\
    \ Private\n    {\n        _fileStream = File.OpenWrite(GetExecutionFolder() +\
    \ \"\\\\Application.log\");\n        _streamWriter = new StreamWriter(_fileStream);\n\
    \    }\n\n    private FileStream _fileStream;\n    private StreamWriter _streamWriter;\n\
    \n    public void WriteLog(string message)\n    {\n        StringBuilder formattedMessage\
    \ = new StringBuilder();\n        formattedMessage.AppendLine(\"Date: \" + DateTime.Now.ToString());\n\
    \        formattedMessage.AppendLine(\"Message: \" + message);\n\n        _streamWriter.WriteLine(formattedMessage.ToString());\n\
    \        _streamWriter.Flush();\n    }\n\n    public string GetExecutionFolder()\n\
    \    {\n        return Path.GetDirectoryName(System.Reflection.Assembly.GetExecutingAssembly().Location);\n\
    \    }\n}\n```\n```\n\nYou can see that the constructor is private here. As it\
    \ is private outside classes cannot create instance of LogManager.\n\n```\n```csharp\n\
    private LogManager()  // Constructor as Private\n{\n    --\n}\n```\n```"
