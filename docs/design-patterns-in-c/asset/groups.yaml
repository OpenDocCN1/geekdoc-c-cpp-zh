  - "[PAGE 33]\n\n# ## 8. Observer Pattern\n\nIn this chapter we can discuss about\
    \ the Observer design pattern. This pattern is a widely used one.\n\n# ### Challenge\n\
    \nYou are working on an application where there is a color to be selected by the\
    \ user. Based on the color selection n number of forms need to be notified. One\
    \ way of achieving this is iterate through all the forms available and notify\
    \ them. This results in unwanted iterations and notifications.\n\nHow to provide\
    \ a better solution?\n\n# ### Definition\n\n> GoF Definition: \"Define a one-to-many\
    \ dependency between objects so that when one object changes state, all its dependents\
    \ are notified and updated automatically\"\n\n# ### Implementation\n\nWe can use\
    \ the Observer pattern for solving the above problem. Subject and Observers are\
    \ the key terms of the pattern. Here Color acts as the subject.\n\nThe Observer\
    \ pattern is to notify the interested observers about some change occurred. We\
    \ can add more observers in runtime as well as remove them.\n\nExample: We have\
    \ a form to select the color. For each color change we need to update the entire\
    \ application. There will be observers listening to the color change event for\
    \ updating themselves.\n\n# ### Subject and Observers\n\nThe two important key\
    \ terms in the pattern are Subject and Observer.\n\nSubject is the object which\
    \ holds the value and takes responsibility in notifying the observers when the\
    \ value is changed. The subject could be a database change, property change or\
    \ so.\n\nWe can conclude that the subject contains the following method implementations.\n\
    \n```\npublic interface ISubject\n{\n    void Register(IObserver observer);\n\
    \    void Unregister(IObserver observer);\n\n    void Notify();\n}\n```\n\nThe\
    \ Observer is the object listening to the subject's change. Basically it will\
    \ be having its own updating/calculating routine that runs when get notified."
