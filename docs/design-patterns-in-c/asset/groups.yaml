    # 2. Command Pattern


    In this chapter I am trying to show the usage of Command Design Pattern. This
    is a popular pattern and it is making use of good object oriented constructs and
    simplifies the logic of enabling Undo functionality in our applications.


    # Challenge


    You are working on a painting application. For each brush stroke you need to provide
    the Undo feature.


    The brushes presently available are square and rectangle. In future more and more
    brushes will be available. Our challenge is to provide the user with Undo feature.
    Clearly, on clicking the undo button, the last stroke should be cleared from the
    canvas.


    What would be your approach?


