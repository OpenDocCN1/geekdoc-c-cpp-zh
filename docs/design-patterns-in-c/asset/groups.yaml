    \ that the new instance was created using Clone() method.\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    Settings settings = new Settings();\n    Settings\
    \ settingsClone = (Settings)settings.Clone();\n    settingsClone.ApplicationSettings\
    \ = \"NewSettings\"; // Change property\n    Console.WriteLine(\"INSTANCE 1: \"\
    \ + settings.ToString());\n    Console.WriteLine(\"INSTANCE 2: \" + settingsClone.ToString());\n\
    \    Console.ReadKey(false);\n}\n```\n\nOn executing the application we can see\
    \ the following results.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_79_0.png)\n\
    \nWe can see from the above code that:\n\n1. Instance 1 was created using new\
    \ keyword\n2. Instance 2 was created using Clone() method\n3. Changing of Instance\
    \ 2 does not affect Instance 1\n\nSo this concludes our experiment with the Prototype\
    \ pattern.\n\n### References\n\nhttp://sourcemaking.com/design_patterns/prototype\n\
    \n### Summary\n\nIn this chapter we have explored the Prototype pattern. The usage\
    \ of Prototype pattern can be summarized as:\n\n- Faster instance creation with\
    \ required properties\n- The new keyword can be avoided in instance creation\n\
    - Provides an alternative to Abstract Factory pattern\n- Runtime specification\
    \ of instance properties\n\n## 21. Bridge Pattern\n\nIn this chapter we can explore\
    \ the Bridge pattern which is commonly used in applications.\n\n### Challenge\n\
    \nYou are working on an abstract business class. The class needs to log information\
    \ by writing to a file, email to user etc. We need to avoid tightly coupling of\
    \ the business class and logger as in future newer versions of logger might appear.\n\
    \n### Tightly Coupled Design\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_81_0.png)\n\
    \nHow to achieve a decoupled solution?\n\n### Definition\n\nGoF Definition: \"\
    Decouple an abstraction from its implementation so that the two can vary independently\"\
    \n\n### Implementation\n\nWe can create an abstract class for representing the\
    \ Logger. Let the abstract business class hold reference to the new abstract Logger.\
    \ At runtime we can specify the actual implementation instance of Logger class.\
    \ (File writer or Emailer) Following is the snapshot of the class diagram after\
    \ using the Bridge Pattern:\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_82_0.png)\n\
    \nHere the concrete Logger implementations derive from AbstractLogger class. The\
    \ concrete TransactionBL derives from AbstractBL class. The AbstractBL class is\
    \ holding reference to Logger (abstract Logger).\n\nUsing the Bridge Pattern as\
    \ shown above, there is decoupling of the implementation from its abstraction.\
    \ It allows future extensibility to the Logger classes without modifying the BL\
    \ class.\n\n### Code\n\nFollowing is the code that invokes above Transaction and\
    \ Logger classes.\n\n```\nAbstractBL bl = new TransactionBL();\nbl.Logger = new\
    \ TextFileLogger();\nbl.ProcessPayment();\n\nbl.Logger = new EmailLogger();\n\
    bl.ProcessPayment();\n\nConsole.ReadKey(false);\n```\n\nOn running the application\
    \ we can see the following output.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_83_0.png)\n\
    \nFollowing is the coupling snapshot after using the Bridge Pattern.\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_83_1.png)\n\
    \n### Note\n\nWe can see that this pattern is a simple implementation using an\
    \ abstract class and interface. The Bridge Pattern is having some similarity with\
    \ Strategy Pattern as both involve changing the implementation at runtime. Here\
    \ the class is abstract when compared with Strategy pattern.\n\n### Summary\n\n\
    In this chapter we have explored the Bridge design pattern. It provides convenient\
    \ way for separating the abstraction from implementation through a bridge of abstract\
    \ class or interface. The attached source code contains the example we discussed.\n\
    \n## 22. Interpreter Pattern\n\nIn this chapter I would like to demonstrate the\
    \ usage of Interpreter pattern. This is not a widely used pattern but reveals\
    \ a good way of programming. It says about creating a language along with an interpreter\
    \ for the language. The language can be used to represent states, actions, loops\
    \ etc. depending on the programming requirement. Here we are using the pattern\
    \ to resolve a persistence problem.\n\n### Challenge\n\nYou are working on a Drawing\
