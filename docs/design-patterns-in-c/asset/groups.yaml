    \n## 18. 中介者模式\n\n在本章中，我想带您了解使用中介者模式的优势。一如既往，设计模式如果使用得当，会给我们带来更大的灵活性和可管理性。中介者模式也不例外。\n\
    \n### 挑战\n\n您正在开发一个管理航班校验的航空公司应用程序。如您所知，飞机起飞前要经过一系列检查，以确保每个部件的健康状态、燃油量等。\n\n我们的\
    \ Flight 类包含以下组件类：\n\n- Engine\n- Wheels\n- Cockpit\n- Aviation\n\n每个组件类都有一个名为\
