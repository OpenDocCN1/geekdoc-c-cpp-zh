  - "[PAGE 66]\n\n# Definition\n\nGoF Definition: \"Provide a way to access the elements\
    \ of an aggregate object sequentially without exposing its underlying representation\"\
    \n\n# Implementation\n\nWe can improve the above Challenge Situation using the\
    \ Iterator pattern. Instead of calling Print() method each time, we can use an\
    \ Iterator to get the names inside Bank Object.\n\nWe are introducing a new class\
    \ named **BankIterator** which implements IEnumerable:\n\n```\npublic class BankIterator\
    \ : IEnumerable\n{\n    private IList _list = new ArrayList();\n\n    public BankIterator(Bank\
    \ bank)\n    {\n        _list.Add(bank.Manager);\n        _list.Add(bank.Accountant);\n\
    \        _list.Add(bank.Cashier);\n    }\n\n    public IEnumerator GetEnumerator()\n\
    \    {\n        return _list.GetEnumerator();\n    }\n}\n```\n\nThe class uses\
    \ and ArrayList ito hold the Manager, Accountant, Cashier names. As it is inheriting\
    \ IEnumerable it has to implement the GetEnumerator() method. Luckily we can send\
    \ the list.GetEnumerator() for the same.\n\nThe new Print() method invocation\
    \ looks like below:\n\n```\nBankIterator iterator = new BankIterator(_bank);\n\
    foreach (string name in iterator)\n    Print(name);\n```\n\nThis improves the\
    \ situation in the following ways:\n\n+   - Easier Names access through Iteration\n\
    +   - More flexibility in introducing new Name properties in the Bank class\n\n\
