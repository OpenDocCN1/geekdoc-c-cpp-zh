    \ of Responsibility Pattern\n\nChain of Responsibility 是 Gang of Four 的 23 种设计模式之一。它是一个有趣的模式，与\
    \ Observer 模式类似。本章我们将探索 Chain of Responsibility 模式。\n\n我使用相同的 Challenge 和 Solution\
    \ 风格来解释这种模式。\n\n### Challenge\n\n你正在开发一个应用程序，其中 **Logic** 类生成各种消息。消息有两种类型。\n\n\
    - Normal Priority\n- High Priority\n\nNormal Priority 消息应由 **Logger** 类处理，而 High\
    \ Priority 消息由 **Emailer** 类处理。\n\n你必须做出设计，使得 **Logic** 类无需考虑消息的正确处理器。它只需发送消息即可。\n\
    \n设计将如何进行？\n\n### Definition\n\n> GoF Definition: \"Avoid coupling the sender\
    \ of a request to its receiver by giving more than one object a chance to handle\
    \ the request. Chain the receiving objects and pass the request along the chain\
    \ until an object handles it\"\n\n### Control Flow\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_40_0.png)\n\
    \n### Implementation\n\n以下是 Logic 类的定义：\n\n```csharp\npublic class Logic\n{\n\
    \    public IReceiver Receiver;\n\n    public void CreateMessage(Message message)\n\
    \    {\n        if (Receiver != null)\n            Receiver.HandleMessage(message);\n\
    \    }\n}\n```\n\n从上面的代码可以看出，Logic 类有一个类型为 IReceiver 的属性。在 CreateMessage 方法中，该\
    \ Receiver 用于处理消息。因此只有一个接收器由 Logic 类实例注册。\n\n以下是 Message 类和 MessagePriority 枚举的定义：\n\
    \n```csharp\npublic class Message\n{\n    public string Text;\n    public MessagePriority\
    \ Priority;\n}\n```\n\n```csharp\npublic enum MessagePriority\n{\n    Normal,\n\
    \    High\n}\n```\n\n以下是 Receiver 接口和实现类：\n\n```csharp\npublic interface IReceiver\n\
    {\n    bool HandleMessage(Message message);\n}\n```\n\n```csharp\npublic class\
    \ Logger : IReceiver\n{\n    private IReceiver _nextReceiver;\n\n    public Logger(IReceiver\
    \ nextReceiver)\n    {\n        _nextReceiver = nextReceiver;\n    }\n\n    public\
    \ bool HandleMessage(Message message)\n    {\n        if (message.Priority ==\
    \ MessagePriority.Normal)\n        {\n            Trace.WriteLine(message.Text\
    \ + \" : Logger processed it!\");\n            return true;\n        }\n     \
    \   else\n        {\n            if (_nextReceiver != null)\n                _nextReceiver.HandleMessage(message);\n\
    \        }\n\n        return false;\n    }\n}\n```\n\n```csharp\npublic class\
    \ Emailer : IReceiver\n{\n    private IReceiver _nextReceiver;\n\n    public Emailer(IReceiver\
    \ nextReceiver)\n    {\n        _nextReceiver = nextReceiver;\n    }\n\n    public\
    \ bool HandleMessage(Message message)\n    {\n        if (message.Priority ==\
    \ MessagePriority.High)\n        {\n            Trace.WriteLine(message.Text +\
    \ \" : Emailer processed it!\");\n            return true;\n        }\n      \
    \  else\n        {\n            if (_nextReceiver != null)\n                _nextReceiver.HandleMessage(message);\n\
    \        }\n\n        return false;\n    }\n}\n```\n\n从上面的代码可以看出，每个接收器类都会检查消息优先级并进行处理。如果优先级不匹配，则发送给链中的下一个接收器。\n\
    \n这里每个接收器负责传递未处理的请求。下一个接收器通过每个接收器的构造函数存储。\n\n链条将执行直到：\n\n- Message is processed\n\
    - Receiver chain exhausted\n\n### Code Execution\n\n所附的 Windows 窗体应用程序可用于测试控制流程。\n\
    \n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_43_0.png)\n\n这里链条构建如下：\n\n- Logic 类持有第一个接收器，即\
    \ Logger\n- Logger 类持有下一个接收器，即 Emailer\n- Emailer 类有一个 null 接收器，表示链的结束\n\n以下代码描述了上述链的创建：\n\
    \n```csharp\nLogic logic = new Logic();\nlogic.Receiver = new Logger(new Emailer(null));\n\
    ```\n\nNote: Please note that the advantage of this pattern is decoupling of sender\
    \ and receiver. The sender does not think about the right receiver. Instead it\
    \ will pass the request and the appropriate receiver should process it. The above\
    \ example can be written using a list of receivers in the Logic class with a Boolean\
    \ property mentioning whether the message is processed or not.\n\n### Comparing\
    \ Observer and Chain of Responsibility\n\n在 Observer 模式的情况下，所有已注册的接收器都会收到请求。每个接收器都对处理它感兴趣。但在职责链中，请求会一直传递直到被处理。\n\
    \n| Observer | Chain of Responsibility |\n| --- | --- |\n| All observers handles\
    \ message | Only one receiver handles message |\n\n### Summary\n\n本章我们通过 C# 示例探索了\
    \ Chain of Responsibility 模式。相关源代码包含我们讨论的示例。\n\n## 11. Abstract Factory Pattern\n\
    \n本章我将解释 Abstract Factory 模式。这种模式对于学习 Factory Method 和 Bridge 模式至关重要。\n\n### Challenge\n\
    \n你正在创建 ORM（对象关系映射）框架。框架可在不同的数据库中使用，例如：\n\n- Sql Server\n- Oracle\n- MS Access\n\
    - OleDb\n\n根据数据库类型，你需要创建相关的类，例如：\n\n- SqlConnection, SqlCommand when Sql server\n\
    - OracleConnection, OracleCommand when Oracle etc.\n\n如何在不实现它们的情况下创建一族相关对象？\n\n\
    ### Definition\n\nGoF Definition: \"Provide an interface for creating families\
    \ of related or dependent objects without specifying their concrete classes\"\n\
    \n### Implementation\n\n我们的想法是创建一个包含所有相关对象的接口，例如：\n\n```csharp\npublic abstract\
    \ class DbProviderFactory\n{\n    public abstract DbConnection CreateConnection();\n\
    \    public abstract DbCommand CreateCommand();\n}\n```\n\n幸运的是，ADO.NET 已经包含了相同的接口作为抽象工厂。定义如下：(我已从中排除了一些无关的方法)\n\
    \n```csharp\nnamespace System.Data.Common\n{\n    public abstract class DbProviderFactory\n\
    \    {\n        public virtual DbCommand CreateCommand();\n        public virtual\
    \ DbCommandBuilder CreateCommandBuilder();\n        public virtual DbConnection\
    \ CreateConnection();\n        public virtual DbDataAdapter CreateDataAdapter();\n\
    \        public virtual DbParameter CreateParameter();\n    }\n}\n```\n\n从上面的代码可以看出，相关类作为一个族包含在内，而无需进入实现细节。\n\
    \n抽象类 DbProviderFactory 包含相关的抽象类：DbCommand、DbConnection 等。\n\n### Concrete Implementations\n\
    \nADO.NET 提供了上述抽象类 DbProviderFactory 的以下实现。\n\n- `System.Data.SqlClient.SqlClientFactory`\n\
    - `System.Data.OleDb.OleDbFactory`\n\n上述类实现了基类中的所有抽象方法。因此它将提供 DbConnection 的具体实现，即\
    \ SqlConnection，DbCommand 的具体实现即 SqlCommand 等。\n\n从上述类实例化后，我们可以开始使用具体实现，如以下代码所示。\n\
    \n```csharp\nSqlClientFactory factory = SqlClientFactory.Instance;\n\nDbConnection\
    \ connection = factory.CreateConnection();\nDbCommand command = factory.CreateCommand();\n\
    \ncommand.Connection = connection;\ncommand.CommandText = \"query here\";\ncommand.ExecuteNonQuery();\n\
    ```\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_46_0.png)\n\n"
