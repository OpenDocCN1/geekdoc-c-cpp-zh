    GoF 定义：“定义一个对象，封装一组对象如何交互。中介者模式通过避免对象之间显式地相互引用，从而促进松散耦合，并允许你独立地改变它们之间的交互。”\n\n\
    ### 实现\n\n我们可以通过引入中介者模式来改进上述情况。通过引入中介者，组件类之间不再直接通信。所有组件都与一个新的中介者类通信。其优点有：\n\n\
    - 组件之间松散耦合\n- 集中式管理\n- 更改代码时更灵活\n\n新方法如下所示：\n\n![](img/10a39e9a5b1ae55cb003d638eba7aaa0_70_0.png)\n\
