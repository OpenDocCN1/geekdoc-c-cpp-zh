    # 19. Memento Pattern


    In this chapter I would like to experiment with the Memento pattern. Memento pattern
    provides an Object Oriented way of saving the state of an object. The state called
    as Memento can be used to restore the object later.


    The English meaning of Memento is Reminder of Past Events.


    # Challenge


    You are working on a Drawing application which allows the user to draw lines on
    a Canvas. The user should be able to Save the state on particular intervals so
    any further mistakes could be undone. You need to provide a solution for the problem.


    # Definition


    GoF Definition: "Without violating encapsulation, capture and externalize an object’s
    internal state so that the object can be restored to this state later"


    # Implementation


    The above problem can be solved using the Memento Pattern. This pattern as said
    in the definition saves the internal state of the object for restoring later.
    The object state is saved without violating Encapsulation.


    ![](img/10a39e9a5b1ae55cb003d638eba7aaa0_73_0.png)'
