  - "[PAGE 29]\n\n# 7. Visitor Pattern\n\nVisitor Pattern is one among the 23 design\
    \ patterns. It is less known but holds a good idea for OOPs enthusiasts.\n\n#\
    \ Challenge\n\nYou are having a list of objects with the following class structure:\n\
    \n```\npublic class Member\n{\n    public string Name;\n    public DateTime DateOfBirth;\n\
    }\n```\n\nYou need to do an operation of selecting all Member having age greater\
    \ than 18.\n\nOne way of the solution is add a new property called IsAboveEighteen\
    \ and set the value by iterating over the items and comparing with current date.\
    \ But this requires more processing.\n\nWe can achieve the same using Visitor\
    \ pattern by adding a property which operations on the existing properties and\
    \ returns the value.\n\n# Definition\n\nGoF Definition: \"Represent an operation\
    \ to be performed on the elements of an object structure. Visitor lets you define\
    \ a new operation without changing the classes of the elements on which it operates\"\
    \n\n# Implementation\n\nIntroducing a new property named IsAboveEighteen and in\
    \ the getter implement the code to read DateOfBirth property to calculate the\
    \ value.\n\n```\npublic class Member\n{\n    public string Name;\n    public DateTime\
    \ DateOfBirth;\n\n    public bool IsAboveEighteen\n    {\n        get\n      \
    \  {\n            bool result = (DateTime.Now - this.DateOfBirth).TotalDays >\
    \ 365 * 18;\n\n            return result;\n        }\n    }\n}\n```"
