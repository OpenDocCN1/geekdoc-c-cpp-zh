    \n### Note\n\n我们可以使用接口来展示上述模式的其他示例。为了简单起见，我避免了接口。在现实生活中，交流电到直流电的适配器就是适配器模式的一个例子，因为它使不兼容的设备和电源能够协同工作。\n\
    \n### Summary\n\n在本章中，我们探讨了适配器模式。当处理不兼容的类型时，该模式很有用。相关源代码包含我们讨论的示例应用程序。\n\n## 4.\
