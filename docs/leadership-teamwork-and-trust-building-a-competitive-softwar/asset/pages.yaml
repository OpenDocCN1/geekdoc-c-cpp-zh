  md: '# MONITORING PROGRAM STATUS


    Large programs, just like large organizations, typically have many interrelated
    parts, and problems in any one part often mean that there are or soon will be
    problems with the other parts.


    If these problems are not recognized and promptly corrected, the overall program
    will then have problems. On most programs, senior management rarely sees such
    problems until it is too late to do anything about them.


    If every team and every project in a large program maintains its schedule and
    meets its cross-program commitments, the program as a whole will almost certainly
    meet its commitments. To ensure that this happens, every manager at every level
    of a large program must ensure that every project or group of projects within
    his or her purport stays on schedule or is following a realistic recovery plan.
    When this is not the case, manager should escalate issue to higher management
    and get help in addressing it.


    When managers behave in this way and when they have precise and timely data on
    all of their project teams, large programs are most likely to perform in accordance
    with their plans and to meet their commitments. The TSP team weekly status report
    provides the data required to manage programs in this way.


    # The Earned-Value Measure


    TSP teams use a precise and objective form of earned value (EV) to determine project
    status. As with traditional EV measures, the TSP assigns each task a planned value
    (PV) that is that task''s planned effort as a percentage of the total project''s
    planned effort. Once that task is completed, its PV is converted to EV and accumulated
    to give the total project EV to date. The PV is used regardless of how much effort
    the work actually took, and there is no credit for partially completed tasks.
    The total EV'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# MONITORING PROGRAM STATUS 267


    compared to plan shows whether the project is ahead of schedule or behind.


    For example, if a project had an EV of 25.0 compared to a planned PV of 33.3 at
    a given point in time, that would indicate that it was (33.3% • 25.0%) = 8.3%
    behind schedule. For a 24-month project, the 33.3% PV at this point would mean
    that about one-third of the work should have been done, and about 8 months would
    have elapsed. However, for this team, only about one-quarter of the work has been
    done, or about 6 months of work in 8 months. If nothing changed, this project
    could be expected to take 32 months to finish instead of the planned 24 months,
    meaning it will be 8 months late.


    Not only does the EV metric provide a precise measure of project status, it allows
    management to determine which parts of a large program are in trouble and by how
    much. To this, however every team on a large program must use a precise EV measure
    that is calculated from objective and auditable data. Because TSP teams use such
    measures and calculate their status every week, the EV for the entire program
    can be calculated from all of these parts, and managers can determine quickly
    which parts of the program are in trouble and why.


    # An Example Status Report


    Figure D.2 shows a typical program-level status summary report. Charts like this
    are called long-pole reports because they identify that part of the overall program
    that, if not corrected, will be the gating item on the overall program schedule.
    On the left is the average EV status for the entire program compared to the planned
    status at this point. The numbers above the bar give the month when that group
    of teams is projected to finish. Because the overall program is scheduled to complete
    in 24 months, it is now about a month behind schedule.'
