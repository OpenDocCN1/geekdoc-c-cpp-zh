  md: 'The reason that 55% of the teams being late is not necessarily a concern that
    is when large programs are working to accurate plans, on average, half of the
    teams will be a bit behind schedule and half will be a little ahead. The time
    to get concerned is when the percentage of the teams that are late becomes much
    larger than 50%, when the average delay becomes large, or when, as could be the
    case here, a few of the teams fall seriously behind schedule.


    # The Limitations of Earned-Value Measures


    While the EV measure can be very helpful, it can also be misleading. The reason
    is that the accuracy of the measure requires two things: that the original plan
    be realistic and the work be of high quality. For the first item, the program
    plan must be based on a realistic distribution of time among the program’s tasks
    and phases. This is typically possible only when teams use historical data in
    making their plans. Suppose, for example, that a team planned to spend six months
    developing a product and only one month testing. This could be realistic if the
    team had data to support such a short test time, but if not, the team would likely
    think it was on schedule right up until the beginning of the final test and then
    face a four- to six-month delay. That is why it is important for management to
    examine a team’s plan in launch meeting 9 and to verify that it is based on realistic
    and relevant historical data.


    The second thing that EV measures require is that the work being tracked be of
    high quality. Here again, consider the example of the team that planned for six
    months of development and one month of testing. Suppose instead that they made
    a more realistic plan and scheduled four months for testing. While this would
    almost certainly be a more accurate plan, it still would not provide a very good
    basis for estimating the job would be.'
