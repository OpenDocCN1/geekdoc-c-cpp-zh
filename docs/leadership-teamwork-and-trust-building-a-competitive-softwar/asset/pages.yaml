  md: '# Using the TSP to Manage Programs


    This appendix describes how managers and executives can use the TSP data and methods
    to help them manage their programs and organizations. As shown in Figure D.1,
    it follows Appendix B, which describes how to start introducing the TSP process,
    and Appendix C, which discusses the issues of broadening TSP use across an organization
    or a large engineering program.


    Once your people are using the TSP, you will have several new tools to help you
    manage your operations. This appendix describes how to use these tools to address
    many of the issues that long have plagued managers of large-scale development
    work. The appendix covers the following topics:


    +   - The program management problem

    - Establishing aggressive but realistic plans


    | A: | B: | C: | D: | E: |

    |---|---|---|---|--|

    | The TSP and your organizations | Getting started | Expanding TSP use | Using
    TSP to manage programs | Sustaining the TSP |


    **Figure D.1** Roadmap to the appendices'
