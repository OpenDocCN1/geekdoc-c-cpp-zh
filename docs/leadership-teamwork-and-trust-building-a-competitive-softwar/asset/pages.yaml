  md: '# Appendix C

    Expanding TSP Use


    This appendix describes how to broaden the use of the TSP across your organization.
    As shown in Figure C.1, it follows Appendix B, which describes how to get started
    with the TSP, and it precedes Appendices D and E, which address how to use the
    TSP in project, program, and organizational management.


    At this point in your implementation process, you presumably recognize the benefits
    of using the TSP and are ready to proceed with a broad implementation effort.
    Because there is substantial available material on the TSP, however, this appendix
    will concentrate on the unique issues of implementing the TSP in an organization
    and refer you to other published sources for more information about the TSP. The
    following topics are covered in this appendix:


    +   - The overall implementation strategy

    - The overall rollout plan


