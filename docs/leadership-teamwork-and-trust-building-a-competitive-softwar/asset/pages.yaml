    # Process Improvement, Quality Assurance, and Test Group Impact


    The managers or members of testing organizations might believe that the TSP will
    substantially reduce the size of their groups. This is a common initial reaction.
    The managers or members of the process improvement or QA groups may have similar
    concerns. In practice, organizations that have adopted the TSP have not experienced
    these problems.


    The TSP pushes responsibility for project management, quality, and process improvement
    down to the level of the team and team member. On the surface it appears that
    the teams have assumed responsibilities that were in these other groups. However,
    most organizations find that the effectiveness of these groups improves after
    implementing the TSP. The principal reason for this is that the TSP creates an
    effective interface (or communication vehicle) between the project team and the
    test, QA, and process improvement groups.


