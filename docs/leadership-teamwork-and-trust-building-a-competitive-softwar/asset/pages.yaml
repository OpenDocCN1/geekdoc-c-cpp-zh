  md: 'To manage quality at the beginning of a job, you must have data, and the TSP
    provides the needed data. With the TSP, engineering teams produce a quality plan,
    and in that plan they define how they intend to manage quality: the time they
    will spend in each development phase and the defects they expect to inject or
    remove in that phase. Furthermore, because TSP teams have been trained in quality-management
    methods, they know how to make quality plans that, if followed, will produce high-quality
    products. This means that the most effective quality-management strategy is to
    monitor team performance and to ensure that the members are following the quality
    plan that they produced.


    In conducting reviews, the measure of goodness is the reverse of that used when
    reviewing development plans. For development work, the objective is to finish
    tasks as quickly as possible. In quality management, however, all of the steps
    except testing involve the developers appraising their products to find and fix
    defects. In these steps, the developers work alone or in teams to examine all
    aspects of their products and to ensure that all required functions are included
    and properly implemented. This is an exacting and time-consuming process, and
    when developers are under intense schedule pressure, they tend to rush through
    these appraisal activities. Unfortunately, when they rush, they miss a lot of
    defects.


    The TSP has four basic quality measures: review yield, process yield, review rates,
    and the ratio of the time spent appraising products to the time spent in developing
    them. These measures are defined in Table D.2. As is clear from these definitions,
    the yield measures are available only late in a program because they cannot be
    calculated until most of the product’s defects have been found.'
