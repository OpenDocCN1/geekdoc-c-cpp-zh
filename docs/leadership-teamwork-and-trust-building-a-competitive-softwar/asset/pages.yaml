    # HOW DO I GET STARTED?


    This is both the easiest and the hardest step. It just takes leadership. All that
    the senior managers must do is decide to implement the TSP and allocate the needed
    resources and management.


    # Where''s the Best Place to Begin?


    The details of finding the right place in the organization to begin, setting the
    initial scope, and selecting the best coaches, projects, managers, and team members
    are discussed in Appendix B. The short answer to this question is to start with
    projects that are important, that are representative of the organization’s work,
    and that are managed and staffed by people who have shown an interest in trying
    the TSP. The best way to find these people is to hold an open forum for discussing
    the TSP and to select those teams that are open to the idea. Skeptics should be
    welcome but not those who are motivated to prove the TSP won’t work.


    You will probably want to seek outside help to get started. An experienced external
    resource can provide the initial training'
