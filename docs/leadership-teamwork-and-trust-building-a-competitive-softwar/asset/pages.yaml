    # The Defect Problem


    A defect is an incorrect or faulty construction in a product. In software, defects
    generally result from mistakes that the design-ers or developers made as they
    produced the products. Examples'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'are design mistakes, oversights, misunderstandings, and typo- graphical errors.
    Furthermore, because defects result from mis- takes, they are not logical. As
    a consequence, there is no logical or deductive process that can possibly find
    all of the defects in a system. They could be anywhere, and the only way to find
    all of the defects with testing is to exhaustively test every path, func- tion,
    and system condition.


    This leads to the next question concerning the testing obj- tive: “We must find
    all of the defects, or couldn’t we just find and fix those few that would be dangerous?”
    Obviously, we only need to fix the defects that would cause trouble, but there
    is no way to determine which defects are without examining all of the defects.
    For example, a complex design defect that pro- dices a confusing operator message
    could pose no danger, but a trivial typographical mistake that changes no to a
    yes could be very dangerous. Because there is no way to tell in advance which
    defects will be damaging, we must try to find them all. Then, after finding the
    defects, we must fix them, or at least all of the ones that could be damaging.


    # THE TESTING PROBLEM


    Today’s most common software quality strategy is based almost entirely on testing.
    This is unfortunate because testing is both a very expensive and an ineffective
