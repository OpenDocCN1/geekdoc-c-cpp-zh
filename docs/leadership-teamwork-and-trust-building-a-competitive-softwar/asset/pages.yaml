    is as basic as the difference between things and concepts. Tasks were straightforward
    and linear in Taylor's time because the work typically concerned things rather
    than ideas. Every action had a reaction, and parts had to fit in place and be
    interchangeable. Things stayed in place and where you put them, and the work was
    made up of separate and distinct steps. One job step followed another, and you
    could watch such work and tell how well it was being performed and when the worker
