    **B.7** The TSP launch process


    The TSP launch process is a series of nine meetings followed by a launch postmortem.
    The project manager or team leader, the team, and the TSP coach participate in
    all nine meetings and the postmortem. The TSP coach plans, leads, and facilitates
    the launch. The other participants are assigned specific roles and responsibilities
    during the launch. Managers and observers are allowed only in launch meetings
    1 and 9.


    A business manager or product manager and a customer or customer representative
    must participate in meeting 1 and in meeting 9. In meeting 1 they present the
    business and product goals and objectives to the team. In meeting 9 the roles
    are reversed and the team presents its plans back to management. Then they negotiate.
    The business manager and product manager roles can be combined. Neither role is
    assigned to the project manager or team leader. These roles are typically the
    responsibility of the next level of management or above.


    Peter Drucker said, "Unless commitment is made, there are only promises and hopes;
    but no plans" [Drucker 1974]. You need not know all the details of the launch,
    but you must understand how team commitment is achieved during the launch. The
    order and content of the launch meetings are designed to build'
