  md: '# 3


    # Knowledge Work


    This chapter addresses the second challenge raised in Chapter 1: making knowledge
    work productive. Before delving into the details of knowledge work, however, we
    need to explain why executives and senior managers should care about knowledge
    work and the productivity of knowledge workers. There are four reasons why this
    is an executive-level issue:


    +   1. Knowledge work is now an important part of your business and will be much
    more important in the future.


    +   2. The current performance of knowledge-working groups in most organizations
    is unsatisfactory. The most common and obvious examples of these problems are
    software groups.


    +   3. The solution to these knowledge-working problems requires a significant
    change in the management culture and style in most organizations.


    +   4. Management culture and style cannot be changed by lower-level managers;
    they must be changed by senior executives and managers.


    While we say more about these points in this and subsequent chapters, the reason
    that this chapter is here and why it covers'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'some team-level issues in more detail than you might expect is because of the
    importance of making knowledge work productive. This chapter first defines what
    knowledge work is, discusses why knowledge work is so troublesome today, and explains
    why knowledge workers are. We next give an example of a knowledge-working team
    and show how highly productive knowledge-working teams actually work.


    The description of this example team provides a snapshot of how knowledge workers
    behave and the kinds of troublesome management issues knowledge-working teams
    can often resolve quite easily. In closing this chapter, we describe why knowledge
    work has become so important in modern industry and the reasons why it is destined
    to become even more important in the future. The rest of the book then describes
    how to make the cultural and managerial changes needed to improve the productivity
    and effectiveness of your knowledge workforce.


    # THE NATURE OF KNOWLEDGE WORK


    When Peter Drucker first discussed knowledge work, he defined knowledge workers
    as people who work with, use, or develop knowledge [Drucker 1957]. Unfortunately,
    this definition seems to encompass almost everyone in modern business. With few
    exceptions, every job in the modern industrial world involves some kind of specialized
    knowledge or skill. However, in Drucker’s view, what separates knowledge workers
    from other workers, and what makes them a truly special breed, is that they use
    their specialized knowledge and skill to work on knowledge itself.


    Knowledge workers take what is known, and after modifying and extending it, they
    combine it with other related knowledge to actually create new knowledge. This
    means that knowledge workers are working at the boundary between what is known
    and what is unknown. They are extending our total storehouse'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'of knowledge, and in doing so, they are creating economic value.


    Even this definition, however, is very broad and covers many jobs that seem to
    be perfectly productive and effective today. One could say that the ancient Egyptian
    priests who forecast Nile floods and the Pythagorean philosophers of ancient Greece
    were all workers. In fact, people have been doing knowledge work for millennia.
    What makes today’s knowledge-working problem so different is that it is no longer
    done by a few specially skilled and motivated individuals; it is now done by masses
    of talented workers who must cooperate to produce a creative and coherent result.


    # WHY KNOWLEDGE WORK IS TROUBLESOME


    While we didn’t originally call it knowledge work, software development was the
    first truly large-scale knowledge work. When developing software, knowledge workers
    work almost entirely with their minds. They typically record their conclusions
    on a computer, but the real creative activity is done in their heads and in brainstorming
    and negotiating sessions with their peers and users. Then, after these knowledge
    workers have produced their first product drafts, they typically modify, extend,
    test, and revise them to produce final running programs.


    Many software developers work by themselves and produce relatively small products,
    but the truly troublesome projects are those that involve dozens, hundreds, or
    even thousands of developers working together to produce the larger programs needed
    for modern businesses. It is larger projects that have typically been most troubled
    and that have resulted in the generally poor performance of software organizations.


    The question, of course, is: “Why are software projects so troubled?” The simple
    answer is that from the very beginning of'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'the computer era, software products have been delivered much later than planned,
    have cost much more than expected, and have been highly defective. While there
    have been exceptions and the quality of software products varies enormously, the
    problem stems from the fact that the practices of the entire software industry
    have been quite different from those of companies in other industries.


    With few exceptions, software organizations rarely make firm product delivery
    commitments, write fixed-price development contracts, or provide meaningful product
    quality warranties. This has led to a general industry attitude that defective
    software products are a fact of life and that the customers must bear the cost,
    expense, and inconvenience of recovering from the poor quality of the software
    products they buy. These problems lead to three rather obvious questions:


    +   1. Why do software customers put up with such shoddy performance? After all,
    no other industry treats its customers in such a cavalier way.


    +   2. Why haven''t these problems been solved before? Many other businesses deliver
    quality products with predictable costs and schedules, so it must be possible.


    +   3. Is there a way to run software and other knowledge-working activities in
    a more businesslike way?


    # WHY CUSTOMERS TOLERATE SHODDY SOFTWARE WORK


    The principal reason that customers tolerate shoddy software work is that they
    have few, if any, alternatives. Because essentially all software organizations
    have similar problems, the customers have nowhere else to go. Suppose, however,
    that some company or companies figured out how to do software work in a more'
  merge: -1
