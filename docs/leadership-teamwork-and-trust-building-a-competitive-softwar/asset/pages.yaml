  md: '# MANAGEMENT BEHAVIOR


    While the changes in team behavior were important, the changes in management’s
    behavior were even more important. The principal management changes concerned
    trust, motivation, and confidence.


    # Trust


    Humayun didn’t initially trust Tim’s team’s plans. The software teams had never
    met their schedule commitments before, so there was no reason for him to trust
    them. However, Tim and his team had done such an impressive job of making a plan,
    and they had presented such a clear and convincing case, that he decided to accept
    their plan. While he was convinced that they would miss their commitments, he
    knew that they would never meet an earlier date even if he insisted on it. Once
    the team had started work, however, Humayun was pleased to get their weekly status
    reports, and he found that the detailed information in the reports were better
    than anything he had gotten before.


    The early reports showed that the team was falling behind schedule, but he saw
    that the team was catching up without his intervention and that they were then
    able to complete the project on the date to which they had committed. This was
    a team with which he could negotiate, and he could use their plans to make sound
    business decisions. If he could get all of his teams to perform this way, he would
    be able to make more accurate business plans and be confident that his people
    would be able to implement them.


    # Motivation


    Humayun saw that Tim’s team was highly motivated and that they had done their
    absolute best to meet his needs. Anything he was'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'surprised, however, at how important the team’s planning process turned out
    to be. In the first team launch, when Tim presented the team’s plan and explained
    why they could not meet the requested delivery date, their commitment was obvious
    and they were clearly convinced that a shorter schedule was impossible. Humayun
    also realized that making the team defend its plan and then trusting Tim and his
    team to deliver, he had played a key role in building their energy and motivation.
    He knew that the key to a successful business was a motivated workforce, and he
    now had a way to build a similar level of motivation and capability for all of
    his development teams.


    # Confidence


    One further factor involves confidence. Executives and senior managers must make
    many trade-offs in deciding how to manage their resources to best meet corporate
    objectives. A key part of any decision-making process concerns the facts used
    to select among the most promising choices. Some of the most important of these
    facts are the time and money required to produce a product.


    Time and money are independent variables. Once the total project resources are
    known, the schedule usually can be adjusted by adding or reducing the project’s
    staff. Once Humayun knew Tim’s team could be trusted to meet an overall cost commitment,
    he knew that adding more developers would not change the project’s cost. After
    all, either 20 developers working for 12 months or 15 developers working for 16
    months would expend 240 development months and cost about the same amount of money.
    If the four-month schedule difference was important, he could just take qualified
    resources from lower-priority jobs and assign them to Tim’s team.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Although the choice to add resources was always an option, until Humayun could
    trust the team members to do what they said they would do, it would have made
