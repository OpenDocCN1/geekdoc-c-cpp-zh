    The team leader, team members, and the team’s TSP coach attend the weekly meeting.
    During the meeting each role manager reports on his or her findings, and each
    team member reports against the plan. These meetings also provide an opportunity
    for the team to coordinate work, make minor plan adjustments, and communicate
    dependencies or request assistance.


    When projects start to slip their schedules, the problems first show up as small
    one- or two-day schedule slips. By precisely tracking status and promptly identifying
    such problems, teams can quickly address them while they are easy to fix.


    # The Cycle Postmortem


    At the end of each project cycle, the team holds a cycle postmortem where each
    role manager reviews team performance from his or her perspective, and the members
    assess their personal and team performance. During the cycle postmortem the coach
    and team leader also compare team performance with the team’s goals and plans
    and identify improvement goals for the next cycle or project. The team also assembles
    the cycle and project-to-date data for retention in the project file.


    # MANAGEMENT’S ROLE IN THE TSP PROCESS


    Management is key to a successful TSP implementation. Management sets the organization’s
    goals, monitors the work, motivates and rewards the people, and maintains the
    sense of urgency that keeps the organization energized. The TSP provides several
    ways to accomplish these ends. Among the most important of these ends is the point
    emphasized in Chapter 5: the need to align the workers’ and managers’ goals. For
    TSP teams, this process starts with the TSP project launch, and it is important
    that the managers understand how to fulfill their roles in this launch process.'
