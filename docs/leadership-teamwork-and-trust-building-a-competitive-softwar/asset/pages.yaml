    # MANAGEMENT''S CONTINUING RESPONSIBILITIES


    Program managers have a lot to do, and to keep their programs under control, they
    must prioritize their time. Unfortunately, with the high frequency of crises on
    most large programs, the crises must take first priority, leaving little time
    for anything else. With self-directed teams and a data-driven management system,
    the number of crises is sharply reduced, and program managers typically have more
    control over how they spend their time. To most productively use this extra time,
    they should give priority to three things: maintaining the focus on quality, ensuring
    effective program-wide communications, and sustaining continuous improvement.


    # Maintaining the Focus on Quality


    The reason that quality must be the top priority is that poor-quality work is
    the principal cause of most program problems, and the cost and time needed to
    rework defective products are usually the gating items on most program schedules.
    As noted in Chapter 8, the fastest and cheapest way to do any job is to do it
    right the first time. That is one of principles of the TSP, and to ensure that
    all parts of a large follow this principle, program managers must continually
    emphasize quality when giving talks, while conducting program reviews, and when
    speaking at meetings. Instead of just talking about quality, however,'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'talk about specific numerical goals and status against them. Without numbers,
    all you can do is talk about quality, and, unfortunately, generalized quality
    talk can quickly become repetitive and boring. Rather than motivating effective
    action, you will then be discouraging to it. So talk about quality frequently,
    but use numbers when you do.


    # Ensuring Effective Program-Wide Communication


    The issue concerns communication at every program and management level. The principal
    concern is that on most technical topics, the working-level developers have the
    most accurate and timely information, and the quality of this information typically
    declines with every step on the way up the management chain. The TSP multi-team
    process and role-manager teams provide a powerful vehicle for establishing and
    managing communication that is timely and accurate.


    The role-manager teams are the key to maintaining program-wide communication,
    but they require management support. This support is not hard to provide, however,
    and typically requires only that the leadership team periodically asks the role-manager
    teams to address key programmatic problems and issues. For example, the design
    managers could be asked to recommend design standards for the overall program,
    or the planning managers could be tasked with resolving schedule interdependencies
    among several program teams. Also, provide a management mentor for each role-manager
    team and have that mentor ensure that the role-manager communication network is
    functioning, that key issues are communicated up the management chain, and that
    these issues are tracked to resolution and the originating developer is informed
    of the outcome and thanked for his or her efforts.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Also, for large programs, the program manager must maintain a small program-manager
    staff. Because big programs typically have several large subsystems, and because
    each subsystem will have its own multi-team process and set of role-manager teams,
    a staff is needed to establish and facilitate communication among these multiple
    role-manager teams. While this level of communication is helpful in maintaining
    team morale and motivation, it also enables the early warning and resolution of
    critical program problems.


    # Sustaining Continuous Improvement


    Continuous improvement is the subject of Appendix E.


    # SUMMARY


    Managing large programs involves establishing aggressive but realistic plans,
    continually monitoring program status, identifying and resolving issues, managing
    quality, and dealing with the customer.


    +   - In establishing plans, the key activities are to build team motivation,
    assess team plans, balance resources and schedules, and review plan risks.

    - Monitoring program status involves, among other things, using the earned-value
    (EV) measure to identify the most troublesome parts of the program.

    - In identifying and resolving issues, the job is to identify and resolve problem
    causes.

    - Quality management is critically important, and it must begin at the start of
    every program. The A/DR measure provides the data needed to monitor quality performance
    at every stage of the program.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'The availability of objective and complete TSP data provides the foundation
    for establishing and maintaining a trusting and cooperative customer relationship.


    The program manager must also attend to three continuing senior management responsibilities:


    +   - Maintaining a focus on quality

    - Ensuring effective program-wide communication

    - Sustaining continuous improvement


    # REFERENCES


    [Davis 2003] N. Davis and J. Mullaney, “Team Software Process (TSP) in Practice,”
    SEI Technical Report CMU/SEI-2003-TR-014, September 2003.


    [Humphrey 2002] Watts S. Humphrey, Winning with Software: An Executive Strategy
    (Boston, MA: Addison-Wesley, 2002).'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# E

    Sustaining the TSP


    This appendix describes how to sustain the TSP effort once it has initially been
    established, and it outlines several ways to use the TSP methods and data to monitor
    and support a continuous improvement effort. As shown in Figure E.1, this appendix
    is the final of the five appendices in this book, and it assumes that the TSP
    is already in place and being used by many of the development teams in the organization.
    The challenge addressed in this appendix is maintaining and improving the effectiveness
    of the organization’s development teams.


    # WHY CONTINUOUS IMPROVEMENT IS IMPORTANT


    Every study of the subject has concluded that the rate of change in advanced economies
    is higher than before and that this rate continues to accelerate. This means that
    the best and most capable competitors in just about every industry are continuously
    adopting newer and better methods. It also means that


    | TSP Implementation Roadmap |

    | A: | B: | C: | D: | E: |

    |---|---|---|---|--|

    | The TSP and your organizations | Getting started | Expanding TSP use | Using
    TSP to manage programs | Sustaining the TSP |


    Figure E.1 Roadmap to the appendices'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'those businesses that do not improve will be exposed. As Thomas Friedman has
    said, the world is flat, and with the Internet and disappearing national boundaries,
    competitors can spring up anywhere at any time [Friedman 2005].


    So far, this book has focused on initiating a major improvement program that involves
    adopting the TSP. However, initiating an improvement and sustaining that improvement
    are two different matters. This appendix describes how to sustain the TSP improvement
    program and how to use the TSP in that sustainment effort. It covers the following
    topics:


    +   - Improvement examples

    - Improvement risks

    - The principles of lasting improvement

    - Executive financial reviews

    - The executive quality review

    - The executive role in continuous improvement


    # IMPROVEMENT EXAMPLES


    Many improvement programs are, in a sense, self-defeating. The problem is that
    most improvements are initiated to address specific problems. Then, once the improvement
    is in place and the problem is no longer a concern, the need to improve disappears.
    If the improvement had been thoroughly and completely made, however, it would
    have included the means to sustain itself, but few improvement programs do that.
    Therefore, once management''s attention is distracted by more pressing issues,
    organizations generally revert to their prior habits. Over time, the original
    problem then reappears, and a new improvement effort will be required.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'This is a common problem when improvements are made to solve specific problems.
    Because there is an infinite number of ways to fail, fixing problems one at a
    time is a never-ending chore. That means that an improvement strategy based on
    learning from failure will be ineffective and counterproductive. Improvements
    should be introduced as part of a comprehensive improvement effort, and they should
    include the means to sustain themselves over time. The following two examples
    illustrate this improvement problem.


    # Example of a Failed Improvement Program


    Some years ago, Michael Fagan found that if teams of software developers inspected
    their programs before testing them, they could both improve product quality and
    sharply cut testing times [Fagan''1976]. After demonstrating his method in one
    of his company''s laboratories, he convinced senior management to install it throughout
    the development group. This was done, and the improvement was very effective:
    It cut testing times almost in half.


    Several years later, after many of the original managers and executives had moved
    on, project managers began to complain about the time these Fagan inspections
    were taking. Senior management agreed that the inspections could be optional and
    that each development laboratory could decide or not to use them. When the programming
    quality people objected that testing times would increase, management pointed
    out that testing time was not a serious problem, so requiring everybody to do
    inspections was not justified. While it took a few years, testing time did increase
    significantly and a new program was needed to reintroduce software inspections
    into all of the development laboratories.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'When the original purpose of an improvement is to address an immediate business
    pain, once the improvement is in place and the pain is gone, the executives will
    no longer be concerned, and they will give it a lower priority. When priority
    drops at the executive level, it will also drop at every lower management level.
    Organizational priorities are very sensitive to executive priorities, and unless
    senior management management continues to be regularly involved in some way, improvement
    programs will generally die out.


    # A Successful Improvement: The IBM CI105 Program


    Jack Kuehler, when he was IBM president, initiated a very successful improvement
    program. The company had already issued a corporate instruction called CI105 that
    required every new IBM product to be measurably better than its IBM predecessor
    product as well as better than its best competitor. This policy had already been
    implemented by the hardware groups with enormous success, but the software groups
    had said it could not apply to software. However, Jack Kuehler insisted, and he
    had the software quality staff establish a program for measuring and reporting
    software quality against the CI105 criteria [Humphrey 2009].


    The IBM software quality staff established the required measurement standard,
    and they also posted the results for all the key products on an online executive
    quality-reporting system. Just as with the hardware, the results of the software
    CI105 program were extraordinary. The number of customer-reported defects for
    each of the covered products dropped by 50% in each of the succeeding years.


    The key to sustaining this improvement was that the senior executives regularly
    reviewed the marketplace performance of the key products in their laboratories,
    and they included the CI105 quality data in these reviews. When a product didn’t'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'meet its planned quality levels, they called for recovery plans, but they didn’t
    beat up or criticize the program manager. Jack Kuehler had insisted on aggressive
    quality goals, and he knew that if they beat up people for missing their goals,
    they would set conservative goals. He also contended that if everybody always
    met the quality goals, they were not trying hard enough.


    # IMPROVEMENT RISKS


    In making any major improvement, there are two key risks to avoid: simplistic
    measures and dead-end improvements.


    # Simplistic Measures


    An excellent example of the simplistic measurement problem is the SEI’s work with
    Capability Maturity Model Integration (CMMI) and its predecessor, the Capability
    Maturity Model (CMM). When the CMM was first developed, the U.S. Department of
    Defense (DoD) saw that it could be very effective in improving the cost and schedule
    performance of its software suppliers. DoD issued a ruling that all of its software
    suppliers must achieve at least maturity level 3 before they could be awarded
    contracts.


    This was a challenge because the CMM (and later CMMI) had established a five-level
    set of improvement criteria. These were called maturity levels, with maturity
    level 1 being the lowest. This lowest level was where most software organizations
    worked, and they typically missed their cost and schedule commitments by large
    margins. Levels 2, 3, 4, and 5 defined various grades of improvement beyond maturity
    level 1. Because moving from level 1 to level 2 and then to level 3 took considerable
    time and effort, this DoD edict got a lot of attention, and an entire software-process-improvement
    industry was established to support these organizations with their'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'improvement efforts. Today, many of the leading organizations that contract
    to supply software products and services are rated at CMMI level 5.


    The CMMI example also also indicates one of the risks of mandating an improvement
    program. When the DoD issued its edict, many software organizations were at CMMI
    level 1 and would have to get to level 3 to stay in business, they started crash
    improvement efforts. While this might seem like a positive development, it had
    one unfortunate result: It changed the improvement focus from achieving measured
    performance improvement to achieving a maturity level. The problem then was that,
    as in any improvement effort, people started to focus on the measurement system
    rather than the intended end result. So the goal became to achieve a maturity
    level to qualify for the DoD’s business even if that didn’t improve the development
    process.


    While one might argue that this would be cheating, and it would certainly seem
    like a waste of a potentially helpful improvement program, it is perfectly normal
    for people to look for easy ways to solve their problems. The only counter to
    this problem is to keep the measurement system focused on performance-related
    items and to use a variety of measures. Single-dimension measurement systems always
    present the risk of such misuse.


    # Dead-End Improvements


    A second problem that is also illustrated by the CMMI concerns dead-end improvements.
    The problem here is that soon after maturity levels were adopted by the DoD to
    evaluate software suppliers, commercial industry started to use them as well.
    This has been very helpful in motivating improvement, but once many major software
    suppliers reach maturity level 5, CMMI is no longer an effective marketplace differentiator.
    At that point,'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# THE PRINCIPLES OF LASTING IMPROVEMENT 293


    the motivation to continue with CMMI improvement is greatly reduced and can even
    disappear. Even though the organizations that reach maturity level 5 presumably
    still be performing far better than they did before, once the focus on CMMI improvement
    is lost, organizations can be expected to revert to their prior practices. Just,
    as with the earlier example of Fagan inspections, the original performance problems
    will ultimately reappear and the improvement cycle will have to be started all
    over again.


    So, while coupling an improvement effort to marketplace performance can temporarily
    help sustain its priority, the specific improvement becomes more common in the
    marketplace, the motivation to sustain that improvement will gradually disappear.
    While this could take many years, the only ultimate answer is to follow the credo
    expounded by Art Anderson when he was IBM’s Senior Vice President for Manufacturing
    and Development [Humphrey 1997]: “There is always room for improvement.” To sustain
    this credo, establish a continuous improvement program.


    # THE PRINCIPLES OF LASTING IMPROVEMENT


    The persistence of an improvement depends on three things: worker benefits, adequate
    support, and management priorities. Because all of these are related, the problem
    of sustaining an improvement requires attention to all three.


    # Worker Benefits


    If the people who must implement the improvement find that it helps them do their
    jobs, they will want to continue working in that way. Then, assuming that they
    can do so by themselves, they probably will. Furthermore, the people doing the
    work often cannot really tell if the improvement helps them or not,'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'but if they think that the improvement helps and it is convenient, it will
    also likely stick. For software development, only simplistic and stand-alone improvements
    like development tools and environments are of this type. The more difficult improvements
    like Fagan inspections typically require some training and support.


    One of the things that makes many of these improvement programs difficult is that
    they have deferred benefits. Often, in fact, these deferred benefits are for groups
    other than those making the changes. That means that the people who must change
    their personal practices will see little or no immediate benefit. More personal
    examples of such deferred-benefit changes are stopping smoking, losing weight,
    and taking up regular exercise. While the benefits of such changes are unquestioned
    and even life-saving, the changes do not generally stick without some kind of
    continuing support.


    # Adequate Support


    The typical kinds of support required for complex changes involve such items as
    training, consultants, coaching support, and tools. New design methods typically
    require training and consultant support, and Fagan inspections also require training
    and the availability of qualified inspection moderators. The TSP requires training,
    the availability of qualified coaches, and the use of suitable support tools.
    Providing such support usually requires building a competent support staff and
    providing adequate funding. Because getting adequate funding for staff activities
    is always a problem, improvements that require staff support always require management
    support. The problem of getting management support, however, always concerns management
    priorities.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Management Priorities


    Management’s ability to sustain any kind of orderly priority depends almost entirely
    on whether the organization is crisis-driven or plan-driven. Because crisis-driven
    organizations typically cannot sustain complex improvement programs, the first
    improvement step must be to fix the crisis-driven management system. That is why,
    for example, the CMMI improvement program calls for improving to level 2 before
    doing anything else. The level 2 items are designed to prevent crises before they
    happen. However, moving from a crisis-driven to a plan-driven environment can
    take a long time.


    Any organization that is concerned about sustaining a TSP improvement program
    has presumably already instituted an initial TSP improvement effort, so it probably
    is not operating in a crisis environment. In this case, the issue of management
    priority principally concerns executive priorities. While the executives who initiated
    the TSP improvement would likely agree that if they don’t devote any time to the
    subject, the lower-level managers will also focus on other topics, and the improvement
    effort will soon lose its priority. To sustain continuous executive attention,
    the improvement must be connected to something that executives regularly monitor.
    This will then sustain its priority throughout the organization. For the TSP,
    the best candidate is to connect the improvement program to the financial performance
    of the business.


    # EXECUTIVE FINANCIAL REVIEWS


    Once a clear connection is made between an improvement program and the organization’s
    financial performance, the executives should regularly review improvement program’s
    performance as part of their regularly scheduled financial reviews. As mentioned
    in Chapter 7, Cesar, the CEO of Quarksoft, did'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'To couple the TSP improvement program to financial performance, the first step
    is to consider the controllable costs in an engineering organization. At least
    for software, the principal cost is the engineering staff, so the cost-control
    question concerns the factors that influence the number of engineering months
    of work required to do any given job. This effort is determined by three things:


    +   - The knowledge and skill of the engineers

    - The size of the job to be done

    - The efficiency with which the job is done


    # Engineering Knowledge and Skill


    The knowledge and skill of the engineering staff are not controllable items. The
    organization has presumably already obtained the best staff it could find and
    has done whatever it could to ensure that this staff has the required knowledge
    and skill for the jobs that need to be performed. Beyond that, getting additional
    skills is always desirable. However, changing the skill mix in an organization
    is not a controllable item, at least not in the short term. So, while important,
    skill mix is not a controllable cost item.


    # The Size of the Job


    The size of a job and its cost can be changed only by changing the functions and
    properties of the product to be produced. Once the functions are defined, however,
    size is no longer a vari-'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'able. Then the cost of doing the job is determined by the efficiency with which
    the engineers do the work. So, while job size is a variable at the very outset
    of a job, once the job is under way, the functions of the desired product are
    largely set, so job size is no longer a controllable cost. While that issue could
    always be reopened, that is not something that can be done easily or without considerable
    additional engineering cost and customer debate.


    # Job Efficiency


    The most efficient way to do a job is to do it right the first time. This means
    that there are two elements to job efficiency: the cost of doing the job first
    time and the costs of fixing all the errors and mistakes the engineers made when
    they didn’t do their work perfectly. Here, the costs of doing an engineering job
    the first time are largely determined by how big the product will be, the development
    strategy, and the tools and methods to be used.


    As noted above, the product functions are typically established before the job
    is started, and the product development strategy is established when the work
    is started. Thereafter, these items are set and can be changed at great cost in
    time, money, and confusion. As a result, they are not controllable costs. Similarly,
    the design methods and development environments and tools must be set at the beginning
    of the job and not changed. Making changes in design methods or development tools
    in the middle of a job generally causes considerable disruption and adds costs
    rather than cutting them. Consequently, even the development strategy, tools,
    methods, and environments cannot be considered as variable costs.


    In summary, the only item that can be considered a variable cost in development
    work is the cost of fixing all the mistakes and errors the developers made when
    first developing the product. This means that the cost of quality (COQ) is the
    only major'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'controllable cost in engineering development work. While smaller items like
    the level of clerical support, training, and facilities are always adjustable,
    they are not major items and certainly are not things that can or should be monitored
    by executives as they manage the organization. This means that any financial review
    of the TSP improvement effort must focus on quality costs and the activities that
    increase and decrease those costs.


    # THE EXECUTIVE QUALITY REVIEW


    With the scale of modern software products, even the few defects each developer
    leaves in his or her product can, when combined with all the other developers’
    defects, cost a great deal of time and money to fix in or when the product reaches
    the customers. What few developers realize, however, is that the costs of fixing
    their defects extend far beyond the development phases. In integration and system
    testing, traditional development groups spend as much or more time and effort
    fixing defects as they did in development. Then, even after extensive testing,
    the customer typically finds more defects in acceptance testing. Even after that,
    there is usually an extensive maintenance period that may extend for several years,
    and depending on how widely the products are used and how defective they are,
    this later maintenance phase can cost far more than all of the development and
    testing combined. By coupling an improvement effort to financial performance can
    be very effective, but all of the quality-related costs must be clearly and regularly
    presented to senior executives.


    # The Cost-of-Quality Measure


    The financial measure that covers the costs of correcting defective work is the
    COQ measure described in Chapter 8. These costs can be displayed in several ways.
    Figure E.2 shows'
  merge: -1
  pgno: 320
- img_proc: true
  md: '![](img/95b42669de34021a8760ed3006f5bdb6_321_0.png)


    # Figure E.2 Cost of quality as a percentage of sales cost by project


    costs as a percentage of the cost of sales for eight different projects. As shown
    in the figure, there are four principal quality-cost elements: maintenance, acceptance
    test, system test, and development. For maintenance, acceptance testing, and system
    testing, the entire activity is typically considered a quality cost, but for development,
    the quality costs are only those activities concerned with preventing, finding,
    and fixing defects. These elements could also be shown by organizational unit
    or over time.


    In Figure E.2, for example, the data for project X108 are typical of a large-scale,
    high-volume systems program that would take about 100 engineers 26 months to develop
    using traditional methods. Here, the total cost of development is about 20.4%
    of the cost of sales, and the cost-of-quality portion of these development costs
    is 4.8%. However, the non-development quality costs significantly exceed the development
    costs with system testing at 21% and maintenance at 26%. Thus, while development
    costs are only 20.4% of the cost of sales, after including all the associated
    quality costs, the true contribution of this product to cost of sales is 69%.
    That is why a focus on managing the cost of quality is so important.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'The COQ measure is very useful for portraying historical costs, and it provides
    an effective way to show the financial consequences of a quality-management program.
    However, by the time the COQ is reported, the work has already been done and the
    costs have been incurred, so it is too late to control those costs. To control
    quality costs, the appraisal-to-development ratio (A/DR) measure described in
    Appendix D is more effective.


    # The Appraisal-to-Development Ratio


    The A/DR measure described in Appendix D provides a way to anticipate quality
    problems in time to fix them too much development time and effort have been wasted
    building a defective product. A/DR charts provide early warning of problems in
    any part of the development organization. This is accomplished by showing the
    A/DR levels for products in each development phase. Then requirements or design
    problems can be detected as early as at the end of the requirements or design
    phases instead of waiting to find and fix them in system testing or in the customer''s
    office. Because the late discovery of requirements defects can cause a major product
    redesign or even an entire project failure, early discovery is highly desirable.


    A chart showing A/DR by phase for 11 components of a system is shown in Figure
    E.3. As is clear from this chart, the defective components had low A/DR values
    in the design phase, so with the early warning available from such charts, these
    quality problems could have been recognized and corrected before implementation
    work was even begun. While component 1 also had design problems, the extensive
    appraisal spent during coding apparently caught its problems. Skipping design
    appraisals and trying to find design problems during implementation is not a good
    idea, however, as demonstrated by component 6.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# THE EXECUTIVE ROLE IN CONTINUOUS IMPROVEMENT


    ![](img/95b42669de34021a8760ed3006f5bdb6_323_0.png)


    **Figure E.3** A/DR by phase for 11 components of a system


    # THE EXECUTIVE ROLE IN CONTINUOUS IMPROVEMENT


    Without some level of sustained executive interest, no improvement program will
    survive for long. In addition to the financial review process just described,
    other key topics executives should consider for sustaining the TSP are the following:


    +   * Maintaining priorities

    * Mandating action

    * TSP certification

    * Rewarding success


    # Maintaining Priorities


    An excellent example of how to maintain priorities is the IBM customer satisfaction
    program. IBM reviewed the customer satisfaction for all of its major products,
    and the surveys were conducted annually. They were completed by key customer managers
    who worked directly with the products being covered. Because the survey responses
    were known to generate action, a high percentage of customers completed them.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 302 APPENDIX E SUSTAINING THE TSP


    Each year, when the survey was completed, the results were first reviewed with
    the involved product managers and then with the IBM senior vice president over
    that product area. Every product manager who had any significant satisfaction
    issues was expected to attend this review. The customer responses were in seven
    categories ranging from product capability and performance to usability and installability,
    and the ratings were in five levels from very dissatisfied to very satisfied.
    Any product manager with any very-dissatisfied rating was asked to explain that
    customer’s problem and what was being done about it. Consequently, when any product
    manager received any such rating on any product, he or she immediately visited
    that customer to understand the problem and agree on a way to resolve it. Product
    managers who didn’t have good answers to these questions were usually in trouble.


    In addition to keeping the customer satisfaction topic at the top of every product
    manager’s priority list, this executive level of interest also had a very positive
    effect on customer satisfaction: The very dissatisfied customers quickly became
    satisfied. Reviews of this type could be conducted in any business area.


    Once the executives in an organization have seen enough data from an improvement
    program to be convinced of its effectiveness, they are often tempted to issue
    a mandate requiring everyone to adopt it. Such mandates can make a lot of sense
    but only under certain conditions. First, there must have enough experience with
    the new method that its effectiveness is generally recognized. At that point,
    the principal resistance will generally be from the few people who typically resist
    any change. Second, there must be sufficient available skills and resources to
    install the change generally. Mandating that everyone do some-


    # Mandating Action'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'thing that the organization cannot support could cause considerable confusion.
    Third, it must be clear that the change really should be adopted by everyone.
    If there are cases where the change would not make sense or where implementation
    should be delayed, these cases should be identified and given an exception. Finally,
    there must be some way to objectively verify that the mandate was actually carried
    out.


    With these caveats, a mandate can make a lot of business sense. Once newer methods
    are known to be substantially more effective than those currently in use, there
    comes a point where people must adopt them. As technology advances, there is normally
    some small percentage of people who just will not adopt. Once the executives decide
    to mandate adoption, those who won''t adopt must be reassigned or told to find
    other work.


    # TSP Certification


    As systems grow larger and more complex and as the risks of damage or personal
    injury from defective software increase, customers and the general public will
    increasingly demand contractual protection. Just as with management edicts, these
    contractual provisions require some objective way to verify they were implemented
    properly. For the TSP, the SEI established a TSP certification program to meet
    this need.


    The various elements of TSP certification address development professionals, development
    teams, and entire development organizations. In addition, the certification program
    also covers TSP instructors and TSP coaches. The developer certification is currently
    available internationally through the PSP developer certification program. Because
    PSP skills are needed to effectively participate on TSP teams, TSP developer certification
    is highly desirable. This certification only attests to knowledge and understanding,
    so the only requirement is that the candidates pass a PSP certification examination.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 304 APPENDIX E SUSTAINING THE TSP


    The SEI also currently certifies TSP coaches. A TSP coach must know and understand
    the PSP and TSP methods and be capable of coaching development teams, so a TSP
    certification requires the candidate to be TSP-certified, pass a TSP certification
    examination, and satisfactorily complete a coach-mentoring program under the supervision
    of an SEI-authorized mentor coach. TSP coach certification is also available from
    the SEI. Certification for TSP instructors also requires successful completion
    of an examination and a trial instructional program.


    Certification for TSP teams and organizations (with the TSP-OEC process) requires
    that all members are properly qualified, that the teams are properly formed and
    coached, and that the teams'' results are of high quality. This last point is
    objectively verified through analyzing the data the teams gather while doing their
    work. In addition to the criteria for TSP teams, the TSP organizational certification
    program includes ratings for customer satisfaction and TSP coverage as well as
    all the criteria required for TSP teams.


    Once an organization has reached a reasonable level of TSP usage, executives or
    customers could have various parts of that organization TSP-certified and regularly
    hold reviews of the results. Because these certification results give considerable
    detail on the organization’s performance, they provide an objective basis for
    measuring that organization’s performance as well as the degree to which it has
    met any edicts or contractual requirements to use the TSP.


    # Rewarding Success


    In any business like software where people have traditionally been recognized
    and rewarded for working hard, it is difficult to switch to a different reward
    system. Because it is obvious when people are working late at night and coming
    in on weekends to'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'fix those last test defects, it seems only natural to reward them for all of
    their efforts. While that would be entirely reasonable if there were no alternatives,
    once never and better methods are known and some teams are regularly producing
    products that have few if any test defects, the criteria for success must shift
    from rewarding hard work to rewarding quality work.


    Quality work is often done quietly and efficiently, and quality products typically
    are delivered on time and when put into test, it is often hard to recognize the
    great personal skill and discipline required to do such work. Highly skilled and
    competent work looks easy, but that is only because the professionals have honed
    their skills and built the personal discipline needed to consistently apply these
    skills to their work. Here, the measures described earlier for COQ and A/DR can
    help to identify and reward the high-performing teams. The team members, team
    leaders, and coaches should also be asked to identify any members who should receive
    individual recognition.


