    # Executing the Plan


    The TSP launch process builds an operational plan: Every team member knows what
    he or she will be working on the day after the launch and for several days or
    weeks thereafter. As long as the team continues to maintain and follow its plan,
    the members will know what to do every day, and they will do their work with efficiency
    and without hesitation or delay.


    Each team member has a TSP tool that contains his or her personal plan, including
    all the task and work product assignments, the risks and goals to track, the support
    mechanisms for gathering data while he or she works, and the means to track personal
    and team status. The tools make it easy to follow the plan, to gather data, and
    to track progress. Every week the team members review their tasks, order them
    by priority, and determine what they must do. Each day, they select a task from
    planned for the week and click a button to start and stop time tracking. When
    they complete a task, they mark it as done. If they found and fixed defects while
    performing a task, they record these defects in a defect log. When they finish
    a work product, they measure and record its size.


    # Tracking the Plan


    During the week, each team member reviews the status of his or her plan and assesses
    progress (earned value), resources used, estimation accuracy, and quality. The
    continuous feedback on progress against personal plans helps to keep each team
    member'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'focused on the highest-priority current tasks. At any time, team members can
    review progress indicators for the week and for the cycle, including earned value,
    planned versus actual effort, plan growth, work in progress, process and product
    quality indicators, and many other indicators of progress or pending problems.


    Each week team members’ plans are consolidated to produce a team-wide view of
    progress for the team’s weekly meeting. Before the meeting, the role managers
    review the consolidated team plan from the perspective of their individual roles
    and prepare to report what they found at the weekly meeting. Among the topics
    reviewed are the items shown in Table B.5.


