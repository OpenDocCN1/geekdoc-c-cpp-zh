    Today, knowledge workers typically view all management tasks as their manager''s
    responsibility, and they are not interested in managing themselves. Drucker did
    not explain how to get knowledge workers to manage themselves, but it is not that
    difficult once you consider the principles for managing autonomous knowledge workers
    and teams:


    +   1. Management must trust knowledge workers and teams to manage themselves.

    2. Knowledge-working teams must be trustworthy. That is, they must be willing
