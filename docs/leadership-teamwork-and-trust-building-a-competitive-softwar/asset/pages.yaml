    # THE TSP LAUNCH PROCESS


    The TSP launch process is shown in Figure B.7, and it combines on-the-job training
    with planning, estimating, and team building. It is the team’s initial exposure
    to TSP coaching and the team members’ first chance to begin acting like a self-directed
    team. The team will learn and use the TSP planning processes, methods, measures,
    and tools. During the launch the TSP coach will prepare them to use the TSP management
    and development processes and to integrate the TSP with their existing organizational
    processes and methods.'
