    under those conditions would not have been a sound business decision.


    # BUILDING SELF-DIRECTED TEAMS


    Development organizations have been plagued with delays and cost overruns for
    decades, and the most extreme examples of these problems have been the software
    teams. However, as Tim’s team showed and as the Softtek and Quarksoft organizations
    have also demonstrated, self-directed teams consistently make and meet aggressive
    quality and schedule commitments, and their performance enables their managers
    to make rational decisions with the confidence that their people will do what
    they have committed themselves to do. Once it is clear to senior management how
    powerful self-directed teams can be and what difference such teams can make in
    the predictability and manageability of a technology-based business, the next
    challenge is to spread this capability across the entire organization. The key
    question, then, is how to introduce these methods to all of the development teams.


    As we have shown in this chapter, it is relatively easy to form self-directed
    development teams and to show them how to manage themselves. This, however, is
    the simplest part of introducing the TSP. Developers love to work in teams, and
    they like to build complex and sophisticated products. With a little training
    and guidance, developers will find that managing themselves is actually quite
    easy and that it greatly improves their performance and quality of work life.
    However, although training developers'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'is relatively straightforward, the key issues in the broader transition process
    are those involving management.


    # MANAGEMENT ISSUES


    The appendices of this book describe the methods that the SEI has found most effective
    for introducing teamwork development practices into entire organizations. We have
    now been honing and improving these methods for several years and have shown many
    teams how to consistently produce quality products on their committed schedules
    and for their planned costs. We know that the introduction process works, and
    we have never had a case where the developers, properly trained and led, have
    failed to do superior work. When there have been problems, they have always been
    with management. The management issues with TSP adoption have typically been of
    three kinds: management understanding, management dynamics, and management style.


    # Management Understanding


    In traditionally managed organizations, the lowest-level managers must plan and
    guide the work, establish and maintain the teams, supervise the team leaders,
    and handle all of the personnel issues for their people. These are typically very
    hands-on managers who are used to doing technical work themselves, are just learning
    to delegate, and are most focused and comfortable with the technical aspects of
    their jobs.


    With self-directed knowledge workers, however, the development teams take over
    much of the hands-on management work, and the first-line managers are deprived
    of one part of their jobs with which they feel most comfortable. These managers
    have not yet adjusted their behavior to the more sophisticated executive-like
    actions of delegation, negotiation, and people'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'development required for managing knowledge-working teams, so they generally
    object to the TSP until they understand its underlying concepts.


    When the management team is properly introduced to these methods, however, there
    is an opportunity to significantly broaden the organization’s span of control
    and to keep more of the often superior engineers involved in technical work instead
    of making them first-line managers. In fact, as we discuss in Chapter 9, the roles
    of team leader and coach can provide excellent training grounds for future executives
    and senior managers.


    # Management Dynamics


    Because management structures and styles vary widely among organizations, there
    is no simple and repeatable process for changing an organization’s management
    style. The process used for guiding and informing management about TSP introduction
    is based on the assumption that managers are generally smart and motivated people.
    Once they understand why and how to manage knowledge work, see how effective self-managed
    teams can be, and appreciate their responsibilities for making their teams effective,
    they can generally figure out the best ways to manage their own responsibilities.


    We have, therefore, developed an introduction program that requires all managers
    above the TSP attend brief training sessions that explain the methods for managing
    knowledge workers and that provide examples of the management actions required
    when managing this kind of work. This introduction strategy has been effective
    and resulted in very successful programs in a great many organizations.


    In some organizations, particularly where the program is initially introduced
    at a low management level, we encounter reorganization problems. Although reorganizations
    are often'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'necessary, they disrupt the management chain, and even after a standard TSP
    introduction process, such organizations often end up with several levels of managers
    who have never heard of self-directed teamwork, don''t know why it is important,
    and don''t understand how to manage it. Because, in most of these cases, management
    has made no provision for training newly assigned managers, the TSP teams end
    being managed with traditional management methods. This disrupts team dynamics
    and soon reduces team performance to its prior unsatisfactory state. The only
    antidote that we have devised for this problem is to insist that TSP introduction
    start at a sufficiently high-management level to ensure some level of stability.
    While senior executives and managers also get moved, they are typically more concerned
    about long-term organizational performance and are more likely to have taken steps
    to maintain the program’s effectiveness.


    At Beckman Coulter, Rick Marshall and Carl Wyrwa were themselves senior managers,
    and they had the support of Scott Garrett, the company CEO. Consequently, they
    supported the way John Hetzler and Larry Whitford addressed this issue. John and
    Larry would contact immediately any untrained manager who was assigned responsibility
    for one or more TSP teams, give him or her a brief TSP overview, and enroll the
    manager in the next planned manager or executive TSP course. This strategy was
    very effective maintaining the needed level of management understanding and support
    for the TSP teams.


    # MANAGEMENT STYLE


    The style of management that is most appropriate for a knowledge-working environment
    is much closer to the typical behavior of executives and senior managers than
    to that of first-line managers. This style follows the five principles for managing
    knowledge work enunciated in Chapter 4:'
  merge: -1
  pgno: 122
- img_proc: true
  md: '+   1. Management must trust knowledge workers and teams to manage themselves.


    +   2. Knowledge-working teams must be trustworthy. That is, they must be willing
    and able to manage themselves.


    +   3. The management system must rely on facts and data (rather than status and
    seniority) when making decisions.


    +   4. Quality must be the organization''s highest priority.


    +   5. Management must provide knowledge workers and teams with the leadership,
    training, coaching, and support that they need to manage themselves.


    While these principles are relatively clear and every management level must understand
    and adhere to them, it is the first-line managers who are responsible for ensuring
    that the principles are followed. That is why it is essential to introduce knowledge-working
    concepts to all managers over all TSP teams, and to train all of these managers
    in their new responsibilities. Because every inadequately trained manager will
    likely cause one or more teams to perform poorly—or even to fail—inadequate management
    training can be expensive.


    The management responsibilities for self-managed teams fall into three areas:
    maintaining team cohesion, providing professional coaching, and recognizing and
    rewarding superior work. The first of these topics is covered in this chapter,
    and the other two are described in Chapter 9 and the book’s appendices.


    # Maintaining Team Cohesion


    Until one has worked on a cohesive and high-performing team, it is hard to appreciate
    its value. Such teams typically do extraordinary work, and they often set more
    challenging goals for'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'themselves than their managers would dare to set for them. Then, when they
    make their own plans and manage themselves, they often surprise their managers
    and even themselves by how well they perform break world records and routinely
    produce superior work. However, building and maintaining effective teams requires
    that management knows how to establish and maintain team cohesion. The two most
    common issues are team-member participation and effective team leadership.


    # Team-Member Participation


    Although most knowledge workers fit comfortably into a cohesive team environment,
    a small number do not. Most of these people are skeptics who, once they honestly
    try the TSP methods, will ultimately be convinced. However, there is a small minority
    that are not able to work with others in a team setting. Whatever the reason,
    these people do not cooperate with their teammates and often refuse to follow
    the team’s processes and plans. Even on large teams, the presence of a single
    uncooperative member can destroy team cohesion and seriously damage team performance.
    Typically, removing the one uncooperative member significantly improves the team’s
    overall performance, even if team member is not replaced.


    First-line managers must be sensitive to this issue, regularly check with the
    team leaders and coaches on cohesion issues, and look for odd behavior in meetings
    and other team settings. Because it is difficult for teams to solve these cohesion
    problems by themselves, managers often have to step in to make the needed changes.
    After asking the team leader, the coach, and the team members for their views,
    the manager’s next step should be to remove the troublesome team member. While
    personnel intervention may be required for counseling, the manager’s first'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'responsibility is to fix team cohesion. The personnel issues can be handled
    more easily when these difficult members are not under pressure from their teams
    to perform.


    # Ensuring Effective Team Leadership


    The team leader’s job is to use the team’s resources to build superior products.
    He or she sets and maintains the team’s standards and is responsible for providing
    an environment that supports the TSP’s quality-first strategy. Most engineers
    want to do excellent work and if they are provided appropriate support. To be
    effective, team leaders must be sensitive to teamworking issues and ensure that
    the members stay focused on the highest-priority tasks, maintain process discipline,
    and measure and manage the quality of their work.


    If the team leader does not perform these responsibilities regularly and competently,
    team performance will suffer. The team coach or a team member can bring such issues
    to the team leader’s attention, but the team leader must resolve them or they
    will continue to fester. In turn, a big part of a manager’s job is to ensure that
    all of his or her team leaders are handling team-cohesion properly and are maintaining
    the high standards needed in all important areas of the team’s work. If not, the
    manager should counsel or replace any underperforming team leaders.


    Great leaders get great results, and while not all of your team leaders will be
    great leaders, a surprising number will rise to the challenge and perform better
    than you or they expected. One of the most important parts of a first-line manager’s
    job is to identify potentially great team leaders and then to guide and nurture
    their development.'
