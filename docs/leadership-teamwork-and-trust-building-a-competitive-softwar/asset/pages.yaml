    design, if not properly corrected, can waste months of time and millions of dollars
    replaced before it is corrected and the initially defective products replaced.
    Chapter 8 discusses why and how to make your quality business’s top priority.


    # TEAM LEADERSHIP AND SUPPORT


    The fifth and final principle for managing knowledge work is that leadership and
    support are required to help your people consistently manage themselves. This
    is critical because, like all of us, knowledge workers are human, and humans are
    not consistently disciplined. They make mistakes; they take shortcuts, and they
    skip or defer tiresome, difficult, or time-consuming tasks. While observing the
    workers and monitoring the quality of their work were practical for factory supervisors,
    it is not possible to do these things with knowledge workers. With such work,
    management must supply the knowledge workers with the leadership standards and
    team environment needed to make disciplined work normal and natural. Chapter 9’s
    final chapter, describes how the TSP addresses this issue, and it also discusses
