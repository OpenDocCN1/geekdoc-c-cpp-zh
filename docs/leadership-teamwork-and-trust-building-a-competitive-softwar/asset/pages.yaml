    # Software Quality Facts


    Software is and must remain a human-produced product. Although we have tools and
    techniques that can automate the production of code once the requirements and
    design are known, the requirements and design must be produced by people. Furthermore,
    as systems become increasingly complex, their requirements and design grow increasingly
    complex. This complexity leads to errors that result in defects in the requirements,
    the design, and ultimately the code itself. Even if code could be automatically
    generated from defective requirements and design, that code would reflect the
    requirements and design defects and thus would still be defective.


    When people design things, they make mistakes. The larger and more complex the
    designs, the more mistakes they are likely to make. From course data on thousands
    of experienced developers learning the PSP, we have found that developers typically
    inject about 100 defects into every 1,000 lines of the code they write [Humphrey
    2005]. The distribution for the total defects injected by 810 experienced developers
    at the beginning of PSP training is shown by the test bars in Figure 8.1. While
    there is considerable variation and some developers do higher-quality work, just
    about everybody injects defects.


