- img_proc: true
  md: '# Coach Candidate Identification


    If your organization has an established program for identifying high-potential
    employees and planning for their long-term development, consider adding the coaching
    position as a useful broadening assignment [Humphrey 1997]. If you do not have
    such a high-potential program, establish something similar for identifying potential
    team leaders, program managers, and engineering directors, and include prior coaching
    experience as a desirable prerequisite.


    Finally, post the coach openings where members of the development community will
    see them, and circulate descriptions of the job openings and their requirements.
    Once the coaching job openings are known and the potential career advantages of
    having coaching experience are widely understood, there should be no problem in
    recruiting coach candidates.


    # Training and Certifying TSP Coaches and Mentor Coaches


    The SEI has a program for training and certifying TSP coaches and mentor coaches.
    To become certified, a candidate coach must have been certified by the SEI as
    a PSP developer and have been mentored and recommended by a mentor coach. To provide
    a reasonable number of coaching candidates, encourage your developers to become
    PSP-certified and initiate the actions required to develop and certify your own
    mentor coaches.


    # Coaching Performance


    Some people make outstanding coaches and others do not. The SEI coach certification
    program will ensure that all certified TSP coaches are qualified and capable of
    performing the coaching job. Beyond this, however, some coaches will be much more
    effective than others in motivating superior team performance. By identifying
    these superior performers and getting them certified'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'as mentor coaches, you can rapidly improve the performance of your entire coaching
    community.


    As described in Appendix E, the SEI has established a program for evaluating the
    performance of TSP-using organizations and for certifying those who demonstrate
    proficiency with the TSP process. This certification process is typically used
    to assess and improve a TSP organization''s internal performance, to demonstrate
    capability to potential customers, or to evaluate the capability of potential
    suppliers. The TSP organization certification data could also be used to identify
    the coaches whose teams do consistently superior work and to urge them to become
    mentor coaches.


    # OTHER CAPABILITY REQUIREMENTS


    When launching a TSP program, you will need some qualified PSP/TSP instructors.
    Initially, you can use external instructors, but thereafter you could qualify
    some instructors of your own. Unless your organization is large, however, the
    ongoing teaching workload would probably not be sufficient to warrant a full-time
    instructor staff. Therefore, after the initial developer and manager training
    workload, your existing TSP coaches could handle any sporadic needs because many
    are also qualified as PSP/TSP instructors. If you decide to retain external instructors,
    make sure that they are properly qualified by the SEI.


    Beyond the coaching and instructor positions, the other capability requirements
    are for qualified and capable team leaders and developers. The team leader job
    is critically important. When team leaders do not support the TSP, their teams
    will not use the process properly and they will not perform measurably better
    than they did before TSP introduction. Thus, it is essential that all TSP team
    leaders attend TSP team leader training before their first team launch.'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'A common problem, particularly for team leaders who are under heavy cost, schedule,
    or customer pressure, is their ability to maintain their teams’ fidelity to the
    TSP process. When team leaders do not insist on process fidelity, the team members
    will likely stop gathering some data, holding regular status meetings, providing
    accurate status reports to management, or maintaining quality standards. One answer
    to this problem is to make process fidelity a key job requirement for team leaders
    and to give it equal weight with project performance.


    Softtek addresses this process fidelity problem by maintaining an independent
    fidelity audit system for evaluating TSP teams. The audits focus on the teams
    as units and do not reveal any information about individual team members. The
    team leader is then held accountable for the results of these audits, and he or
    she can also hold the team coach accountable for providing adequate assistance
    to the team in maintaining its fidelity.


    The team leader job is described in the book TSP: Leading a Development Team and
    will not be covered further here [Humphrey 2006b]. Similarly, the required skills
    for developers are described in the book TSP: A Self-Improvement Process for Software
    Engineers and are not covered in this book [Humphrey 2005].


    Beyond these skills, the final need is for a modest staff to guide and monitor
    the TSP transition and implementation program. Here, the most consistently successful
    strategy has been to use the central coaching group as a team and to have them
    monitor and guide the overall TSP effort. This team should use the TSP process
    to plan and manage its work, and in its initial launch it should produce a complete
    plan, including its needs for management, clerical, and other support.


    # WHEN AND WHERE TO USE THE TSP


    The TSP can be used with project teams of any kind, and it has also been used
    for various kinds of non-project activities. Examples'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# 246 APPENDIX C EXPANDING TSP USE


    are testing groups, maintenance departments, support activities, and running a
    corporate executive office (see, for example, the Quarksoft story in Chapter 2).
    We suggest, however, that organizations initially focus on using the TSP for managing
    their development projects and that they do not attempt to use it for non-project
    or support activities until they have considerable project experience and a number
    of experienced TSP coaches.


    Another time when a TSP introduction might not make sense is when an organization
    is in the middle of another massive change program. Organizations can withstand
    so much change at any one time, so you should not attempt too many disruptive
    changes at once. Organizations are constantly changing, however, so change is
    a fact of modern organizational life, and as long as the scope of the TSP does
    not overlap with the other changes in such a way as to cause confusion or conflict,
    the TSP can be implemented while the other changes are being made.


    When you get arguments about conflicting change programs, examine the changes
    involved to determine whether they would conflict with the TSP effort. Because
    the TSP process will not conflict with whatever environments, languages, or development
    methods your groups select, making changes in these areas at the same time as
    TSP introduction should not cause problems. Assuming this is the case, treat this
    argument as another excuse for inaction.


    The TSP has also been used for various categories of teams and activities, and
    the SEI has developed custom versions of the process to fit the specific characteristics
    of such work. The categories involved are


    +   - Multidisciplinary teams

    - Distributed teams

    - Functional teams

    - Large-scale programs'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Multidisciplinary Teams


    Organizations are increasingly finding that multidisciplinary teams are more productive
    and creative than single-skill teams. Vicarious Visions, a division of Activision,
    has used the TSP to develop a great many video games, including the recent hit
    Guitar Hero. For this work, the company includes programmers, game designers,
    artists, and hardware engineers on its game-development teams.


    The typical experience with such multidisciplinary teams is that they do better
    work far more rapidly and efficiently than they could have when they worked as
    separate specialists on common projects. The bond of common goals and relationships
    of TSP teams foster highly creative interactions that produce results that are
    not typically achieved by more traditional development groups.


    One of the most effective ways to improve organizational efficiency and reduce
    project cycle is to use multidisciplinary teams. When software programs include
    their related requirements and testing groups, for example, they can cut months
    from their schedules. Similarly, when an integrated hardware and software project
    forms a combined team for requirements specification, systems design, software
    and hardware development, testing, and manufacturing, they can generally make
    substantial cost, schedule, and quality improvements. For large programs, cycle
    times can often be cut by a year or more.


    If a multidisciplinary team has fewer than 15 to 18 members, the standard TSP
    process is perfectly appropriate. For larger multidisciplinary projects, the SEI
    has developed a custom multi-team process, or TSPm. Because TSPm process is thoroughly
    described in the book: TSP: Coaching Development Teams, it is not discussed here
    [Humphrey 2006a].'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Distributed Teams


    In the modern workplace, it is now normal to have project members distributed
    across several locations. As shown by the project described in Chapter 3, however,
    such teams can still be cohesive and productive as long as they have common goals,
    processes, and plans. We have found with the TSP that the common bond of team
    commitment is far more powerful than either a single working location or membership
    in a common organization. Even when team members work for competing organizations,
    if they follow the TSP launch process, agree on common goals, and produce and
    commit to a common plan, they can still form a highly cohesive and effective development
    team. Depending on team size, either the standard TSP process or the multi-team
    TSPm will work for such teams.


    # Functional Teams


    Functional teams are groups that provide some kind of ongoing support. Examples
    of such work are software maintenance, IT support, and testing. While these groups
    typically do challenging and highly technical work, they usually do not have the
    kind of clear and compelling mission that is common for development teams. The
    goal of developing and delivering a product provides an obvious focus that all
    team members can understand easily.


    If functional teams can identify a common goal, they can still be formed into
    cohesive and highly productive groups. The challenge is to define a real and compelling
    goal that they can all understand and commit to meeting. One example of how to
    do this is Jason Ziemer’s Enterprise Engineering Department at the Naval Oceanographic
    Office of the Stennis Space Center (NAVO). His group provides technical support
    to U.S. naval ships on station throughout the world. One of their key jobs is
    responding'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'to engineering change requests (ECRs) from the fleet. Because these requests
    are often from ships that are in a war zone, rapid response is important.


    In its TSP launch, Jason’s ECR team established a goal of reducing ECR response
    time, and the entire team worked as an integrated unit to do. The team ended cutting
    response time for small ECRs from an average of 17.5 days to 4.8 days and for
    medium ECRs from 122.6 days to 26.5 days. Improvement goals of this type can be
    highly effective in motivating functional teams. Appendix E describes how management
    can use a continuing improvement program to maintain the striving for excellence
    organizations need to remain competitive.


    The TSP functional process, TSPf, is designed to support such teams. It is described
    in the book TSP: Coaching Development Teams [Humphrey 2006a].


    # Large-Scale Programs


    With the rapid advances in technology, modern-day systems are becoming ever larger
    and more complex. Consequently, their development must involve ever-larger and
    more complex engineering programs. The TSPm process can support multiple-team
    projects of up to 150 to 200 or so members, but beyond that, a larger and typically
    unique process is required for each program. In customizing such a process, the
    principal factors to consider are the following:


    +   - The system architecture


    +   - The development organizations involved


    +   - Program management


    +   - Team coordination'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# The System Architecture


    As the case for the multi-team project described in Chapter 3, the key to effective
    teamwork is a clear and compelling team goal. For development work, that goal
    is usually a product or a major product component. It follows that, in defining
    the process required for a large-scale systems program, you must establish the
    overall system architecture before deciding how to structure the development process
    or the organization that will develop it. Once that architectural definition is
    established, you can define the system’s principal components.


    Assuming that each of these major components can be developed by a single multi-team
    of 200 or fewer members, the basic process and program organization structure
    can be defined. The objective is to have TSPm multi-team responsible for developing
    each of the system’s major subsystems or components. If any components are larger
    than any single multi-team could handle, the system architecture should be further
    refined. Once the architecture is defined, the structure of the development organization
    can be established. It is essential to define the architectural structure systems
    tend to become structured much like the organizations that developed them. Such
    politically based designs generally have multiple problems.


    # The Development Organizations


    With the overall development organization structure defined, the next step is
    to define and staff the development multi-teams. Start by identifying the needed
    skills for each component team, and then staff these skill needs from the available
    resources in the various involved organizations. This process is typically complicated
    by the fact that several organizations will have cooperated in the bid to obtain
    the development program, and the'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'development responsibilities for each of the system’s presumed subsystems and
    components will already have been specified in development contracts.


    Because of the ability of the TSPm multi-team process to integrate the work of
    widely distributed teams, however, these contractual and responsibility problems
    should not be insurmountable. This is because, with the TSP, engineers from any
    one of the organizations could be assigned to work on any of the teams, if they
    were managed by other than their home organizations. The only issue is to ensure
    that the members of all the teams participate in the launches for their teams
    and that their assignments are clearly defined and approved by all of their respective
    managers.


    Because there may be many management and contractual issues to settle before the
    proper skills can be assigned to the development teams, these arrangements should
    be given a high priority. Otherwise, the quality of the resulting system will
    likely be compromised. With the team structure and staffing defined, the remaining
    steps concern program management and team coordination.


    # Program Management


    In managing TSPm multi-teams, overall team leadership is provided by a leadership
    team that is led by the project manager [Humphrey 2006a]. The other members of
    this leadership team are the team leaders for each of the unit TSP teams that
    make up the multi-team. Each of the unit teams follows the standard TSP process
    in doing their work, and the team leader represents the team on the leadership
    team.


    The leadership team monitors the progress of the unit teams, resolves inter-team
    issues, and, where necessary, balances team workload and resources among the unit
    teams. Similarly, for a'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'large program, an overall program management leadership team should be established
    and led by the overall program manager. The leaders of each of the component multi-teams
    would be members of this leadership team. Just as with the TSPm leadership team,
    the program management leadership team monitors the progress of the component
    multi-teams, resolves interteam issues, and, when necessary, balances workload
    and resources among the multi-teams.


    While such a multi-team structure will handle most situations, it still leaves
    open the question of how the many multi-teams and unit teams will coordinate their
    work and how the many team members can be kept informed and involved. This is
    critical because the team members must be actively involved in managing their
    own projects. Only then will they be personally responsible for managing their
    own work and feel empowered to identify and resolve the many issues that are common
    to large programs. Providing this level of involvement is a team coordination
    issue.


    # TSP Coordination


    One of the qualities that makes TSP teams effective is the strong feeling of ownership
    the members have for their work. They understand the overall job, they manage
    their own work, and they are aware of the issues that involve them and their teams.
    As a result, they feel empowered to identify issues and problems and either to
    resolve them to another team member who will get them resolved.


    To ensure that this is done and that there is an owner for every issue that is
    likely to arise, each TSP team member takes responsibility for one or more team
    member roles. TSP teams typically have eight standard team member roles:'
  merge: -1
  pgno: 274
- img_proc: true
  md: '+   - Customer interface manager: handles customer and requirements issues


    +   - Design manager: handles design issues


    +   - Implementation manager: handles implementation issues


    +   - Test manager: handles testing issues


    +   - Planning manager: handles planning issues and produces the periodic management
    status reports


    +   - Process manager: handles process issues and monitors process compliance


    +   - Quality manager: handles quality issues and monitors product quality


    +   - Support manager: handles team support issues


    These role managers do not do all of the work in their areas, but they do monitor
    the work and identify and resolve issues. For example, the design manager will
    likely be the lead designer and establish the team’s design standards, but he
    or she will not necessarily do all of the design work.


    # Role-Manager Teams


    On a TSP multi-team, each of the unit teams defines a standard set of team member
    roles, and coordination across the entire multi-team is maintained through a set
    of role-manager teams. That is, there is a role-manager team for each of the standard
    TSP role-manager jobs, and the role-manager team members are the role managers
    from each of the unit teams. There is a role-manager team for the customer interface
    managers, for the design managers, and for each of the other team roles.


    Role-manager teams are responsible for handling cross-program issues within their
    areas of responsibility and for performing any'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'special tasks that the leadership team assigns to them. For example, the planning
    managers from all of the unit teams form a planning manager team, and this team
    coordinates and resolves planning issues among all of the unit teams. When these
    rolemanager teams cannot resolve issues, they take them to the leadership team.
    This role-manager team structure provides the development team members with ready
    access to all members of the multi-team, and it enables the members quickly to
    resolve issues, clarify questions, and identify and escalate impending problems
    to senior management.


    The reason it is so important to identify these issues is that major program problems
    almost always start as minor issues that, if identified early enough, could have
    been quickly resolved. Minor issues are invariably first recognized by working-level
    team members who generally raise them with their immediate management. Usually,
    nobody but the working-level engineer who first sees a problem appreciates its
    significance, and because nobody typically feels responsible for issues that do
    not affect his or her immediate work, the issue is usually ignored and not addressed
    until it is too late to prevent a major problem. Without some way to identify
    and resolve rapidly the many issues that are common to large programs, problems
    are common and delays and overruns are almost universal. The TSP role-manager
    teams are a proven way to handle this early-warning problem.


    To ensure that the role-manager team capability is available to the members of
    all of the multi-teams in a large program, the overall program leadership team
    requires a small staff to support the role-manager teams and to ensure that they
    maintain the kind of open and cooperative relationship needed to quickly identify
    and resolve major issues. The structure of this program management staff must
    depend on the specific program situa'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# SUMMARY


    tion and the preferences of the program management team. However, its role is
    critical and it should be established when the overall program is initially structured.


    # SUMMARY


    Expanding TSP use across a large organization involves five principal steps: establishing
    an overall implementation strategy, defining the rollout plan, building sponsorship,
    developing local implementation plans, and building internal capability. This
    appendix addresses each of these topics and describes how to handle the issues
    that most commonly arise.


