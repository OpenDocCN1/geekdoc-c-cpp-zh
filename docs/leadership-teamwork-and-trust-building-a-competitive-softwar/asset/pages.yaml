- img_proc: true
  md: '# # B Getting Started


    This appendix describes how to get started with the TSP. As shown in Figure B.1,
    it describes the first steps needed to introduce the TSP and to motivate your
    knowledge-working teams to consistently follow the TSP process. Experience shows
    that they will then produce quality products on their planned schedules and for
    their committed costs. Once you have followed the guidelines in this appendix
    and have established a foundation of TSP experience, Appendix C shows you how
    to expand that capability across the organization, and Appendices D and E describe
    how you and how your management team can use the TSP to manage and continually
    improve your organization.


    # **APPENDIX B OVERVIEW**


    As with any major change program, there are many important elements of TSP implementation.
    However, the element that is most critical to the TSP’s success is the energy
    and momentum


    | A: | B: | C: | D: | E: |

    |---|---|---|---|--|

    | The TSP and your organizations | Getting started | Expanding TSP use | Using
    TSP to manage programs | Sustaining the TSP |


    **Figure B.1** Roadmap to the appendices'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'of the implementation effort itself. To build and sustain this energy, you
    must name a hard-driving and enthusiastic change champion, form a strong implementation
    team, and establish and follow an aggressive implementation plan. This appendix
    describes how to do this.


    The appendix starts with a brief overview of the TSP implementation strategy.
    This provides a composite picture of the entire implementation effort. Subsequent
    sections then review change management principles, the TSP implementation team,
    and how the TSP is implemented for a project team. The TSP project cycle is next
    described, along with a discussion of management’s role in the TSP process.


    # THE TSP INTRODUCTION STRATEGY


    The TSP introduction strategy is TSP-focused. Implementation starts with three
    or four pilot teams and proceeds project by project and team by team. Once installed
    and used by the first projects, TSP is implemented for the next ones. This process
    continues across all of the organization’s projects and teams until the implementation
    goals are met. When following this strategy, it is most important to carefully
    select, implement, and support the initial TSP teams. Their performance will demonstrate
    to management and to the rest of the organization benefits of introducing and
    using the TSP.


    The success of the early pilot projects is crucial for several reasons. First,
    these initial projects will be examples of how the TSP works, and everybody in
    the organization will be watching how it works and whether the TSP members find
    it helpful to do them personally. Second, early success will demonstrate to the
    management team how they can meet your standards of excellence (see Chapter 9).
    Third, the early adopters will likely become TSP promoters and advocate its adoption
    by other teams.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Finally, any unsuccessful teams will likely become outspoken and influential
    critics. That is why it is critically important to select initial adopters who
    are highly motivated volunteers.


    The first step in TSP introduction is to identify someone to represent you in
    selling the TSP introduction program, to recruit the change agents, to develop
    the introduction plan, and to implement that plan. For most pilot programs, this
    initial effort will require only a few people, but for even small implementation
    efforts, you should use the TSP process to launch and guide the implementation
    program.


    After forming the implementation team and approving its plan, the next steps are
    to select the initial pilot project teams and train these teams and their managers
    in TSP and PSP concepts and methods. Then the teams begin following the TSP process
    under the guidance of a trained TSP coach. This process starts with a project
    launch where the coach guides the team in developing its project plan and in following
    that plan to complete its project.


    The TSP training, the project launch, and the team coaching are all focused on
    the project team members and on how they are led, motivated, and supported. The
    objective is to quickly build highly disciplined teams that have leaders and managers
    who are proficient in leading self-directed teams. Their role is to motivate these
    teams to consistently follow their defined processes and plans, to regularly report
    their progress to management, and to strive to produce defect-free products.


    This TSP implementation improvement programs contrasts sharply with many popular
    programs that do not provide adequate training, skills development, operational
    support, or team buy-in. Such programs often fail to convince the knowledge-working
    teams that they need to change their personal behavior. Consequently, such programs
    produce only marginal and transient changes in team performance.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'After you have established broad executive support for the TSP, there are seven
    steps to follow in implementing the needed changes. Steps 1, 2, and 3 must be
    performed in order, but the other four steps should be performed together. All
    of these steps are important, and if you do not address every one of them properly,
    your program will either fail at the outset or will not become self-sustaining.
    The seven steps are as follows:


    +   1. Recognize and follow the proven principles of effective change management.


    +   2. Establish an energetic and assertive change implementation team.


    +   3. Build a strong TSP coaching team. This topic is briefly discussed in this
    appendix but addressed more thoroughly in Appendix C.


    +   4. Conduct and evaluate an initial set of TSP pilot projects.


    +   5. Broaden TSP use throughout the organization. This is the topic of Appendix
    C.


    +   6. Build TSP management capability. This subject is addressed from different
    perspectives in this appendix as well as in Appendices C, D, and E.


    +   7. Establish the resources and practices needed to sustain the TSP. This is
    the principal topic of Appendix E.


    # THE PRINCIPLES OF CHANGE MANAGEMENT


    John Galbraith said, “Faced with the choice between needing to change one’s mind
    and proving that there is no need to do, almost everyone gets busy on the proof”
    [Galbraith 1971]. The software profession is no different; when confronted with
    a proposed change, we begin to construct a solid defense against it. The cost
    and time required are probably at the top of the objec-'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# THE PRINCIPLES OF CHANGE MANAGEMENT 191


    tion list, followed closely by denials of the need to change.

    “We’ve always worked this way” and “In my experience” are certainly among the
    top objections. These common arguments are likely to be followed by highly technical
    and carefully crafted analyses that are designed to preserve the status quo.


    Why is Galbraith’s observation important? Introducing the TSP involves change,
    and managing this change is your responsibility and the responsibility of the
    team you assign to guide and manage the implementation. The TSP implementation
    strategy is guided by change management models, and the principles and concepts
    in these models are built into the TSP introduction strategy. This means that
    you do not need to create your own change strategy but that you should be familiar
    with change management principles. In case you are not, the following paragraphs
    summarize the key issues.


    Rogers’ model of adopter categories guides the selection of initial projects,
    teams, and managers, and it defines the actions needed to scale up across adopter
    categories [Rogers 2003]. Conner’s model of commitment stages is a guideline for
    building commitment within the organization, the project teams, and for each individual
    participant [Conner 1992]. It describes the stages through which each person and
    group advances on the path toward widespread use. Training introduces the TSP
    principles and builds the skills needed to get started, and with data and a “self-convincing”
    learning model, it produces the behavioral changes needed to produce truly disciplined
    and sustained high performance. The TSP approach is designed to convince the knowledge
    workers themselves that this is a more effective and rewarding way for them to
    work.


    # Commitment to Change


    The key elements of the Conner and Rogers change models are shown in Tables B.1
    and B.2. In his book Managing at the Speed'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Table B.1 Characteristics of Conner''s Change Model


    | Degree of Support | Time Line |

    |---|---|

    | Preparation Phase | Succeed: Awareness Failed: Confusion |

    | Acceptance Phase | Succeed Positive Perception Failed Negative Perception |

    | Commitment Phase | Succeed Institutionalization Failed Abort |


    of Change, Daryl Conner defined the change process, change management roles, and
    the commitment stages that individuals and groups move through when committing
    to change. The stages are phases in the commitment process and indicate the level
    of commitment. The model describes the actions that lead to the next level of
    commitment and the failure modes that could terminate the process at any stage.


    # Table B.2 Roger''s Change Model


    | Adopters | Number | Characteristics |

    |---|---|---|

    | Initiators | 2.5% | Venturesome and daring risk-takers who are willing to accept
    substantial difficulty |

    | Early Adopters | 13.5% | Opinion leaders and role models who are respected by
    the early majority. They reduce risk by adopting the new idea and thereby “approve”
    by others. |

    | Early Majority | 34% | Deliberate and slow to adopt a new idea ahead of most,
    they provide the link in the network between early adopters and the late majority.
    |

    | Late Majority | 34% | Skeptical and risk averse, they adopt under peer pressure
    or necessity. |

    | Laggards | 16% | Suspicious of new ideas and favoring tradition, they are the
    last group to adopt a new idea. |'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# THE PRINCIPLES OF CHANGE MANAGEMENT 193


    In the preparation phase individuals have their first contact with and become
    aware of a proposed change. In the acceptance phase individuals gain an understanding
    of a proposed change and form a positive or negative perception of that. If the
    perception is positive, they move to the commitment phase where they install and
    experiment with the new concepts, refine them, and move forward through the adoption
    phase, the institutionalization phase, and the internalization phase.


    Conner’s model defines the roles of the three key people in the organization who
    must be involved in the change process: the sponsor, the change agent, and the
    change target. The TSP implementation strategy includes defined actions and responsibilities
    for each of these people at each step of the change process. This includes you,
    the change sponsor; your management team; the change agents, who are typically
    TSP coaches; and the change targets, who are all of the managers and developers
    who will be adopting the TSP.


    In his book Diffusion of Innovation, Rogers describes how new ideas or technologies
    advance through a group, a culture, or a social system. His research led him to
    conclude that successful diffusion of innovation depends in part on the network
    of communication between different adopter types within the target group (Table
    B.2). He found that this network is central to establishing lasting change and
    commitment. When new ideas or technologies were introduced into a group without
    regard for this network, they generally were not successful.


    Rogers’s model shows that the successful introduction of a new idea or technology
    must start with the early adopters. Once successful with this group, the sponsoring
    managers and the TSP coach then enlist the early adopters as change agents and
    provide them the support they need to communicate the benefits of the TSP to the
    early majority. The early majority then help'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'the later target populations through the remaining phases in the commitment
    process.


    Conner’s and Rogers’s models are based on empirical studies, and they help with
    TSP implementation in three ways. First,, they define the key change roles and
    responsibilities that must be staffed to have a successful change program. Second,
    they provide guidance in selecting the teams and groups for initial TSP pilot
    introduction. Finally, they provide overall strategic guidance for spreading TSP
    adoption across the organization.


    # Building Executive Sponsorship


    Once the overall sponsor of the TSP effort has agreed to launch an improvement
    program, the next step is to build broad support across the entire executive team.
    This is typically accomplished with a one-day TSP Executive Seminar for the top
    management group. This seminar covers the principles behind the TSP, examples
    of the results that others have obtained, and a review of the actions required
    to put the TSP in place in this organization.


    Wherever possible, you should have already identified potential candidate groups
    for initial TSP adoption and have invited one two of their senior executives to
    attend this senior-level seminar. This will build local support and give you a
    head start for the later implementation.


    Once this senior executive team agrees to proceed, the next steps are to establish
    an implementation team, to plan the overall effort, and to get started.


    # ESTABLISHING THE TSP IMPLEMENTATION TEAM


    The TSP implementation team includes the management sponsors and the change agents.
    The size of the organization and the scope of the TSP implementation will determine
    team size'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'composition; in very small organizations or groups, you and a senior technical
    lead might be the entire team. Regardless of its size, all the members of this
    implementation team must fit the “early adopter” profile, and all of them should
    be respected, goal-oriented opinion leaders drawn from the ranks of management
    and development.


    The TSP implementation team will act as TSP advocates and champions within their
    peer groups, and they must demonstrate an early-adopter attitude. The key characteristic
    here is a positive perception of the TSP and a personal commitment to making the
    change program successful. The TSP must make sense to them, they must be able
    to visualize how to use the TSP, and they must readily recognize its potential
    benefits. Their principal concern should be how to implement the TSP and not whether
    it will work.


    # Launching the TSP Implementation Team


    The implementation team must start with a plan, and the best way to make this
    plan is to have this team follow the TSP process and conduct a team launch. To
    facilitate this process and to ensure its success, we suggest that you retain
    a qualified TSP coach to guide the effort. The TSP launch process consists of
    nine meetings; in meeting 1, the team first meets with management to understand
    the goals for the effort. Then the team meets privately with the coach to establish
    its team roles and strategy to develop a comprehensive implementation plan. As
    with all TSP-produced plans, this plan defines the end products of the implementation
    effort, the time and resources required, the risks to be managed and/or mitigated,
    and alternate plans that are deemed appropriate.


    An important step in this planning process is for the implementation team to define
    measurable short-term and long-term'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'goals, objectives, and success criteria. The detailed and timely data the TSP
    provides make it easy to measure TSP project results, but it will be difficult
    to make comparisons with the organization’s prior performance because comparable
    baseline data on prior work are rarely available. To address this problem, the
    team should identify the data that are available for comparison and then attempt
    to define pilot program success criteria in terms of the available data. Example
    data could be measures of resources, costs, or schedules. Also, data on testing,
    test defects, customer defect reports, or maintenance costs for existing projects
    could be used.


    In designing these comparative measures, it is important to understand how the
    data are gathered, reported, and used. For example, time card or effort report
    data are not generally useful for measuring actual effort on a project. They typically
    do not include overtime and reflect only when individuals are budgeted rather
    than the hours actually spent on project tasks. Data on the sizes of previously
    developed systems can be used to normalize the project cost, schedule, and quality
    data. This will enable more realistic comparisons of before-and-after performance
    data.


    Another concern involves timing. Evaluation data are usually needed early in the
    implementation effort, but final pilot project results will not be available until
    project completion. For projects less than one year, this is rarely a problem,
    but when projects take longer, it is often necessary to use interim results. Possible
    ways to address this issue include using results from interim builds or development
    cycles or projecting results based on interim data such as cycle estimation accuracy,
    product quality, or process yields. Other potential benefits to consider are the
    availability of precise and timely project data and the ability'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'these data provide to identify and correct project problems in time to prevent
    serious problems for the overall program.


    The implementation team then follows the standard TSP launch process to define
    the transition process, to estimate the work involved, to produce a schedule with
    key milestones, and to evaluate project risks. As the final step in the implementation
    team''s launch, the members produce a plan presentation and review it with you.


    # Reviewing the Implementation Plan


    Here you will review the TSP implementation team''s plan, including the schedule
    for the key implementation milestones, the cost of the effort, the key risks,
    and the proposed risk mitigation plans. You should also ask about the criteria
    and plans for selecting the pilot teams and their managers. Finding the right
    volunteers is the key to success.


    The training plan is also critical, and that plan should give the participants
    enough advance notice so that they can arrange to handle all of their existing
    commitments and complete the reading required before the training. The plan for
    selecting the instructors must also allow them adequate time to prepare for and
    deliver the training. This is especially important for the PSP training courses
    where the instructor must spend several hours each day grading the assignments.


    The longer-term coaching plan is also important because the quality of coaching
    support is critical to project and team performance. For the initial teams, nearly
    two weeks of coaching support are needed before the launch and two more weeks
    are needed during and after the launch. Once you have reviewed and approved the
    implementation plan, the team gets started on implementing its plan. The first
    step is to launch the pilot programs. This subject is discussed in Appendix C.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Motivating Participation


    Before making any broad announcements of the TSP effort, consider how to motivate
    participation in TSP implementation. Some early adopters may have already volunteered,
    and others will follow once you communicate the strategy. The most important group
    to motivate is the middle managers who traditionally fear the greatest risks.
    To them, the TSP will be seen as a cost and not as an opportunity. While some
    will recognize the value of the investment, many will be unwilling to commit time
    or resources because of the schedule and resource pressures of their current projects.
    Those who readily agree to participate are probably the early adopters.


    The motivational strategy that we consistently have found to be most effective
    is based on continuous improvement. This strategy, together with examples of how
    to manage it, is discussed in Appendix E. All of the involved people—developers,
    the project and team leaders, and the middle managers—will look for evidence that
    the concepts are technically sound and that they personally will have some control
    over the implementation. That message is critical.


    # Communicating the Idea


    After the implementation team has been staffed, and the objectives defined, and
    the plan produced and approved, you are ready to make a broad announcement of
    the TSP effort. In doing so, there are a few TSP-unique things to consider:


    +   Connect the TSP and the implementation team’s goals and objectives to the
    corporate vision and standards of excellence. One company had a stated goal of
    differentiating itself in the marketplace as the highest-quality provider. After
    evaluating many other software development pro-'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'cesses and methods, the company chose the TSP because of its proven high-quality
    results.


    +   - Describe carefully the purpose of the pilot projects and the expected results.
    Ensure that the people do not think of the TSP as a management ultimatum or of
    the TSP pilot projects as unimportant experiments. They must know that management
    is committed to implementing the TSP and that management needs their help to make
    it work.


    +   - Be about changing the status quo and offer support as a "red tape cutter."
    An objective of piloting new methods is to find different and better ways of doing
    the work. Demonstrating your support for trying something new is an important
    message to give to the early adopters.


    # BUILDING A STRONG COACHING TEAM


    The coaching team is critical to the success of the TSP effort. It is the coaches
    who guide the managers, team leaders, and teams in using the process properly
    and in producing superior work. They know how to motivate the teams to strive
    for excellence, and they understand the actions that management should take to
    ensure the success of the TSP effort. Without a strong coaching team, your effort
    will not likely start as rapidly as it could, and it may not become self-sustaining.


    # Identifying the Initial TSP Coaches


    For the implementation effort, the change agents must be trained and qualified
    TSP coaches. While it is usually necessary to retain an external coach from the
    SEI or from an SEI transition partner to help you get started with the implementation,
    one of the first steps in the planning should be to identify one or two experienced
    managers to fill this coaching role. These managers'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'should have development experience, be respected by their peers

    and senior management, and be early adopters.


    At least one of the initial coach candidates should be part of

    the implementation team and participate in implementation

    planning. These candidate coaches should then be PSP-trained

    along with the first of the pilot TSP teams and attend the TSP

    team leader-training courses. They should then assist the exter-

    al coach in conducting the initial pilot team launches and guid-

    ing and coaching the teams when they start their projects.


    As soon thereafter as possible, these coach candidates should

    take TSP coach training and become qualified as coaches them-\selves. Then they
    can gradually take over from the external

    coaches and, along with any additional internal coaches that are

    needed, lead, guide, and support the TSP implementation pro-\cess. The most important
    point is to identify these cand-

    dates at the outset so that they can participate in the initial TSP

    pilot efforts. This will provide them the background and experi-

    ence to take full advantage of TSP coach training and to rapidly

    build the skills required to be effective TSP coaches.


    # The Coach Development Strategy


    This coach development strategy is based on experience gained

    training insurance agents. In an unpublished study, a large

    insurance company divided its new sales trainees into three

    groups. The members of group A were given complete sales

    training and then sent out as salespeople. The members of group

    B were trained and then assigned to work with experienced

    salespeople who mentored them for a considerable period. The

    members of group C were given brief initial training and then

    sent out on their own as sales trainees; after a couple of months,

    were brought back in and given the full sales training

    course. Over the course of the 20-year study, the group A-'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'people did worst, the group B members were next, and the group C members did
    best. They were more effective at the outset than their peers, and their superior
    performance persisted for the entire 20-year period of the study.


    The conclusion is that early exposure to real-world problems provides a framework
    that makes the subsequent training relevant and enables the trainees to grow and
    develop most rapidly. That is why it is important to select your coach candidates
    as quickly as possible that they can participate in all of the steps involved
    in initiating the TSP program. There will be many valuable experiences to be gained,
    and it would be a waste of time and money for your coach candidates to miss this
    important learning opportunity.


    # THE TSP PILOT PROGRAMS


    Implementing the TSP involves the steps shown in Figure B.2. Implementation starts
    with planning for the installation and trial use of the TSP on a few pilot projects.
    Next, the managers, developers, and other involved participants are trained, and
    the project teams begin using the TSP, starting with the TSP launch. The teams
    are then coached and supported until the


    ![](img/95b42669de34021a8760ed3006f5bdb6_223_0.png)'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'projects are concluded. While the plan is being executed, performance data,
    project results, improvement suggestions, and other information are gathered and
    evaluated. The implementation approach is then assessed and refined and repeated
    on the next project.


    During TSP implementation you should also plan to hold regular reviews of progress.
    This will help to maintain the effort''s initial momentum and ensure that it continues
    to receive the priority needed to succeed. If the implementation team is using
    the TSP to plan and track its work, similar review formats can be applied to their
    reviews. In the beginning, use the TSP weekly meeting format to review status.
    Later, the other meeting formats can be applied. If the team is not using the
    TSP, these same reviews can be adapted to the team''s planning and tracking approach.
    As noted in Appendices D and E, you should then establish a regular quarterly
    review program to examine the status of the organization''s overall improvement
    efforts, including the TSP.


    # Conducting the Pilot Projects


    Running the initial pilot projects will be relatively easy once your people are
    properly prepared. At this point, you should have a TSP implementation plan, a
    clear statement of the problems to be solved, a description of the success criteria,
    and initial volunteer teams that are motivated to participate. Then, by following
    the steps defined in the following section, “Implementing the TSP for a Project
    Team,” you conduct and evaluate the pilot projects.


    # Evaluating the Pilot Projects


    Soon after launching the pilot projects, begin working on how to evaluate the
    projects against the goals and objectives established during TSP implementation
    planning (see Figure B.3).'
  merge: -1
  pgno: 224
- img_proc: true
  md: '![](img/95b42669de34021a8760ed3006f5bdb6_225_0.png)


    **Figure B.3** TSP implementation: evaluate


    Evaluation is the last step in the implementation cycle, but you cannot wait until
    the projects have been completed because you may then discover that some important
    evaluation criteria were not considered and the needed data are no longer available.
    Also, as in many organizations, you may find that the results from the first one
    or two cycles are sufficient and that you wish to accelerate the adoption pace.
    Organizations often decide to start looking for additional TSP introduction opportunities
    without waiting for the initial pilot projects to be completed, particularly when
    these pilot projects are expected to take a year or more to complete.


    As TSP implementation gains momentum, you will soon want to start measuring TSP
    team performance and establishing benchmarks of excellence to use in motivating
    continuing improvement. To facilitate these later efforts, consider the following
    list of measures that TSP teams readily provide. To the extent that your existing
    project measures can produce comparable data, these measures will also help in
    the pilot program evaluations.


    +   - A comparison of the actual resources expended on the resources planned for
    a particular project, project cycle, or phase'
  merge: -1
  pgno: 225
- img_proc: true
  md: '+   A comparison of the actual time required to the planned time for a particular
    project, project cycle, or phase


    +   The amount of product produced per development hour compared to that planned
    (The typical TSP size measure is the number of new and changed LOC in the finished
    product, but other measures can be used.)


    +   The sum of the total time spent conducting all reviews and inspections during
    development compared to the time spent for testing and defect repair from the
    team completes developing the code (code complete) until the end of acceptance
    testing and compared to the total development time


    +   The total number of defects found and fixed per thousand lines of new and
    changed code from code complete through acceptance testing


    +   A comparison of the percentage of development effort expended from the project''s
    start to code complete to the percentage expended from code complete to initial
    product shipment


    +   A comparison of the percentage of the project schedule that was used from
    the project''s start to code complete to the percentage used from code complete
    to initial product shipment


    Two other important evaluation measures are customer satisfaction and employee
    satisfaction. Your customers will probably not be interested in the engineering
    methods your teams use, and they will probably not have heard of the TSP, but
    they will be most interested in cost and schedule predictability, features delivered,
    post-deployment quality, and operational costs. Unfortunately customer satisfaction
    data are rarely'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# IMPLEMENTING THE TSP FOR A PROJECT TEAM 205


    available in time for a pilot program evaluation. It would then be desirable to
    get some anecdotal feedback from a few customers if possible.


    Employee satisfaction should improve as the TSP teams learn to manage themselves
    and to work together as cohesive teams. One indication of TSP success is when
    the pilot project team members recommend the TSP to their peers. Collect information
    regularly throughout the project and use it to identify and address TSP implementation
    problems.


    Another indication of employee satisfaction is reduced employee turnover. Softtek
    found that the turnover of its TSP team members was one-quarter that for the non-TSP
    team members. The benefits of reduced turnover can be substantial and should be
    considered whenever the required data are available. Unfortunately, this will
    probably not be for at least a year after the TSP implementation effort is fully
    under way.


    # IMPLEMENTING THE TSP FOR A PROJECT TEAM


    As shown in Figure B.4, the process for implementing the TSP for a project team
    has four steps: planning, training, launching/coaching, and evaluating. With only
    minor changes, the same process is used for the initial pilot teams and for all
    subsequent teams.


    # Planning—Select Project Teams


    The first step in planning TSP implementation is project selection. Starting with
    the right projects is very important. The selection criteria in Table B.3 are
    based on experience and represent factors that are most likely to lead to early
    success, such as choosing volunteers or early adopters. As adoption proceeds,
    these criteria can be relaxed or eliminated.'
  merge: -1
  pgno: 227
