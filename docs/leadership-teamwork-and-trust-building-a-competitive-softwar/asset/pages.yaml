    able to complete a challenging job with which their managers had struggled for
    many months without even being to produce a project plan. How was this team able
    to succeed when most software teams fail under far less stringent conditions?
    The answer is that they followed a process that was designed for knowledge work.
    The inspiration for this process was an idea that Peter Drucker described in 1999:
    “Knowledge workers have to manage themselves. They have to have autonomy” [Drucker
    1999].


    To perform at their best, knowledge workers must be motivated, and they must have
    the skills, knowledge, and resources to do their work. In addition, they must
    do their work in a responsible and businesslike way. This means that they must
    work to defined and approved plans and processes; meet their cost, schedule, and
    quality commitments, and keep management informed of their status and progress.
    While the knowledge-working team described in Chapter 3 did this, it is not something
    that other teams normally do. This kind of team behavior is generally viewed as
    a management responsibility, and the team leaders and managers typically do it
    while the knowledge workers concentrate on their technical tasks.


    However, as Drucker pointed out, managers can’t manage knowledge work. This means
    that they cannot plan knowledge work, they cannot monitor and track such work,
    and they cannot determine and report on job status. While the managers could ask
    the knowledge workers how they plan to do their jobs and where they stand, the
    knowledge workers of today typically do not work to detailed plans and do not
    know their project status.'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'They may guess, but their guesses are rarely accurate. It is not that they
    are being difficult; it is that they have not learned how to plan, measure, track,
