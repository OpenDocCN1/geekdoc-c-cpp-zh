    # What Can I Expect to Achieve with the TSP?


    Perhaps the most important responsibility that you will have is establishing management
    objectives for the TSP. You will need to make it clear why you''re taking this
    step, what you expect to achieve, what problems you are attempting to solve, and
    what success will look like.


    The TSP provides many important benefits that can be measured and many less tangible
    benefits that also provide value. For most organizations, improved performance
    and more effective management practices are probably at the top of the list. Employee
    job satisfaction is another key objective.


    Here are a few examples of the typical benefits. Most organizations have reported
    a dramatic improvement in cost and schedule performance. The typical TSP project
    delivers the full functionality promised at the beginning of the project with
    actual cost and schedule results that are within 10% to 15% of the team''s commitments.
    Moreover, there are nearly as many projects that come ahead of schedule or under
    budget as there are projects that are late or over budget. In other words, cost
    and schedule variance is reduced and the mean variation is balanced around zero.
    This does not mean that TSP projects can achieve impossible schedules, but TSP
    projects can have aggressive but realistic plans that they are very likely to
    meet. TSP teams almost deliver more features, with better quality, than similar
    projects that accepted impossible schedules.


    Most organizations report productivity gains of at least 25% to 30%, from requirements
    through user acceptance test, and similar gains for design through system test
    or user acceptance test. Some organizations express the gain in team productivity,'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# APPENDIX A WILL THE TSP WORK IN MY ORGANIZATION?


    others as a reduction in cost and/or schedule, or as an increase in features per
    release.


    The quality measure in the TSP is defects. Product quality is often reported as
    defect density in system test, user acceptance test, and/or the released product.
    The most common expressions of defect density are defects per thousand lines of
    code or defects per thousand function points. The quality management system in
    the TSP is so effective that most organizations are reducing defect density by
    70% to 80% or better while also improving productivity. While there are many business
    benefits that may not be obvious or be difficult to quantify because of a lack
    of existing data within your organization, an 80% reduction in defect density
    will have a similar impact on rework costs, bug-fixing costs, testing costs, warranty
    costs, defect-tracking costs, and other costs. Although you might not have measured
    these costs, you would likely find that they are high—as much as 30% to 60% of
    your overall costs, and maybe much higher. A reduction in product defects of this
    magnitude will be noticeable to your users and your stakeholders.


    All of these performance benefits can be directly related to business objectives
    and competitive advantage.


    There are a few objectives that the TSP will not help you to achieve. It is important
    to understand what these are before beginning. No method will enable teams to
    meet costs or schedules that are truly impossible, including the TSP. Some managers
    believe that software teams just need to be driven harder and they will meet an
    impossible deadline. There is a belief, grounded in perception rather than data,
    that such a strategy has worked in the past. Another objective that must be avoided
    is the misuse of the TSP as an opportunity to use personal data to micromanage
    teams. It has never worked. It will have the effect of killing the TSP effort
    with the complete loss of the investment already made.'
