  md: '# # Creative Destruction


    Change is a fact of life. The world is changing faster than ever before, and the
    challenges of tomorrow will almost certainly be different from and more demanding
    than those of today. While no one can say precisely what these challenges will
    be or how to prepare for them, some things are pretty obvious from our recent
    history. This book describes the nature of these challenges and a strategy that
    will help you to address them.


    # ## CORPORATE CHURN


    The first new phenomenon that is obvious from our recent history is corporate
    churn. Industry leaders always fail, and sometimes-times fail surprisingly quickly.
    Consider, for example, what has happened to the largest and most successful U.S.
    businesses. In the 24 years from 1956 to 1980, 24 firms dropped off the Fortune
    500 list *every year*. However, in the 24 years from 1982 to 2006, that rate increased
    to 40 firms *every year* [Economist 2009]. That comes to 960 successfully successful
    firms switching from being winners to losers in 24 years.


    Joseph Schumpeter studied the reasons for corporate churn and, in 1942, published
    a book called *Capitalism, Socialism and Democracy* [Schumpeter 1942]. In this
    book, he explains why organizations grow, prosper, and die. He called this concept
    “creative destruction.” While his ideas were not well accepted at'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'the time, they are now widely recognized as perceptive and pre-scient. He describes
    why economies are in constant flux in the following way:


    The fundamental impulse that sets and keeps the capitalist engine in motion comes
    from the new consumer goods, the new methods of production or transportation,
    the new markets, the new forms of industrial organization that capitalist enterprise
    creates.


    Schumpeter’s work also suggests why market leaders are so often surprised by their
    newer and more agile competitors. It is because the rules of the game keep changing.


    As soon as quality competition and sales effort are admitted into the sacred precincts
    of (economic) theory, the price variable is osted from its dominant position.


    While Schumpeter’s ideas sound reasonable and are now widely accepted, he does
    not say where these giant-killing competitors come from. Just who are they and
    why are they able to topple large and established businesses?


    Just as they have in the past, the challengers to industry leaders will come from
    unexpected quarters. These newcomers will be entrepreneurs who have found some
    innovative way to make themselves unique. This has been true in a great many industries,
    and as indicated by the relative vigor and productivity of small businesses, it
    is likely to remain true in the future. The innovative advantages of small businesses
    are indicated by the fact that in the United States, small businesses produce
    many more new jobs and grow much faster in percentage terms than their larger
    competitors.


    Consider, for example, a recent Small Business Administration study [Terleckyj
    1999]. Over a three-year period, new and small'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'companies accounted for only 25% of employment but for 39% of job growth. This
    means that, on average, small businesses grew nearly 60% faster per capita than
    their larger competitors. Clearly, being a small business has had some pretty
    significant advantages. In Chapter 2, we discuss how small businesses operate
    and examine some of the reasons for their superior performance.


    Change is the name of the game for modern industry. Those organizations that do
    not recognize and plan for the often obvious future trends of their industries
    will almost certainly be replaced, and it could happen very quickly.


    # KNOWLEDGE WORK


    Assuming Schumpeter was correct and that the rules of the game are continuously
    changing, a high priority for executives should be identifying those changes that
    will impact their businesses. Once these changes have been identified, executives
    and senior managers can better judge how and when to make the adjustments needed
    to capitalize upon them. The key challenge, of course, is determining what these
    future changes are likely to be and how to take advantage of them before your
    competitors do.


    Peter Drucker devoted much thought to the analysis of corporate management. More
    than 50 years ago, in 1957 book *Landmarks of Tomorrow*, he outlined the key challenges
    he saw for future managers and executives [Drucker 1957]. He concluded that learning
    how to manage knowledge work would be the key management challenge of the next
    century. He described knowledge work as work that is done in the workers'' heads
    instead of with their hands. He concluded that knowledge work would soon be the
    most critical and the highest-valued form of labor. Later, in his book *The Age
    of Discontinuity* [Drucker 1969], Drucker wrote:'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'To make knowledge work productive will be the greatest management task of this
    century, just as to make manual labor productive was the great management task
    of the last century.


    More recently, in an article in the Harvard Business Review [Drucker 1997], he
    also said:


    The productivity of knowledge workers will not be the only competitive factor
    in the world economy. It is, however, likely to become the decisive factor, at
    least for most industries in developed countries.


    Drucker was the premier management thinker of the twentieth century, and it behoves
    us to take his views seriously. This book, in fact, does just that. It starts
    from the premise that knowledge work is the work of the future, and that the organizations
    that first recognize and capitalize on this fact will be the industrial leaders
    of tomorrow. Ask yourself this question: “If Drucker and Schumpeter were right,
    what should I do to capitalize on the opportunities of the knowledge-working age?”
    This book answers that question.


    # THE URGENCY OF CHANGE


    As is clear, both from Schumpeter’s and Drucker’s views and from the current rate
    of industrial churn, change is a fact of competitive life. Furthermore, the rate
    of change is accelerating. While this is not particularly surprising, what is
    surprising is how often changes have come as surprises, even to very successful
    firms. Many of these surprises, however, happened not because the new ideas were
    unknown in advance to the leading firms. In fact, many of these companies actually
    invented the new methods that ultimately destroyed them.'
