    # WHAT WILL IT COST TO IMPLEMENT THE TSP?


    The cost of implementing the TSP is directly proportional to the scale of the
    implementation and the duration of the projects where the TSP is implemented.
    The most significant ongoing costs are the costs of training project teams and
    of providing coaching support.


    Consider an example project with one project manager or team leader, one part-time
    coach, 10 developers, and a one-year schedule. The training for this team includes


    +   - One day of pre-reading and a three-day training course for the team leader


    +   - Two days of pre-reading and a five-day training course for each of the ten
    team members'
