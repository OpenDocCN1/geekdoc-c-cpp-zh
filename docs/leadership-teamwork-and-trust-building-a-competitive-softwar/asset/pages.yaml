  md: 'The reason is that for poor-quality products, testing times are inherently
    unpredictable. In this case, while testing could be com- pleted in three or four
    months, it could also take six to eight months or more depending on the kinds
    of problems encountered.


    In net, when plans are based on realistic historical data and the work is of high
    quality, the EV measure can provide very useful insights into program status.


    # IDENTIFYING AND RESOLVING ISSUES


    While the traditional way to identify issues is through manage- ment status reviews
    and reports, the most important way is for the development team members to identify
    the issues they see and to either resolve them personally or to escalate them
    to someone who can handle them. The reason this is important is the development
    team members normally can see the early symptoms of major problems long before
    they become vis- ble to anyone else. This is one of the great advantages of main-
    tain a trusting workplace environment and empowering self- directed teams.


    In a trusting environment, the teams take responsibility for their jobs and assign
    roles to their members. When they identify important issues that could impact
    their work or even other issues that could affect the overall program, they refer
    these issues to the responsible role managers on their teams. These role managers
    can either resolve the issues themselves or escalate them to the appropriate management.
    As long as management addresses the issues when they are raised, and as long as
    they don''t shoot the messengers, they can expect to get early warning of most
    key issues. This will enable them to resolve most prob- lems before they become
    crises.


    For the more traditional way of identifying issues through management reviews
    and reports, TSP data can provide useful'
