    This, of course, assumes that the team agrees it can productively use all 15 engineers
    for the entire 12-month period. Experience shows that arbitrarily imposing an
    early date is not an effective way to compress schedules.


    # Reviewing Plan Risks


    In the TSP launch, teams assess and evaluate the risks they see in doing this
    job. They also assign likelihood and impact ratings and assign the highest-priority
    risks to team members to monitor. In all meeting 9, the teams present this risk
    assessment and describe their mitigation plans for the highest-priority risks.
    The management job is then to ensure that the team has addressed all of the right
