  md: 'certainly is, it is not a a manager problem. For knowledge work, the difference
    between management and manager problems is fundamental. Because managers cannot
    manage knowledge work, the knowledge workers must manage themselves.


    Fortunately, however, the skills required for people to manage themselves are
    quite straightforward and easy to teach. While managers must ensure that knowledge
    workers are willing and able to manage themselves, convincing them to do so is
    a much more difficult challenge. This is critically important, for unless the
    knowledge workers truly want to manage themselves, there is no way that their
    managers or anyone else can make them do it. The TSP addresses this challenge
