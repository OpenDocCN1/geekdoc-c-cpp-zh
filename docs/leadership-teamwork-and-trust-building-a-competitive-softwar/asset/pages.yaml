  md: '# Management Reporting


    Once a project is under way, management will want the TSP coach and the project
    manager or team leader to conduct periodic project status report meetings. These
    status meetings should review the actions planned during the prior status review,
    clearly describe project status, identify risks and key issues, outline the accomplishments
    prior to the next status review, and review and agree on action commitments. The
    reviews also provide an opportunity for management to motivate the team, to reinforce
    the desired team behaviors, and to compliment the team members for what they have
    accomplished.


    The TSP provides four report formats for project status reporting: a period status
    report, a customer status report, a cycle postmortem, and a project postmortem.
    These TSP materials are described in Table B.7; the TSP coach can answer any questions
    you might have have about these items or provide examples and other desired information.


    # Table B.7 TSP Status Reporting Scripts and Specifications


    | Element | Description |

    | --- | --- |

    | Script STATUS | A guide to planning and conducting the periodic TSP management
    and customer status meetings

    The purpose of these meetings is to keep management and the customer informed
    of project progress, status, and risks. |

    | Specification STATUS | A guide to making accurate, complete, concise, and informative
    management status reports

    Includes four levels of reporting: minimum, basic, standard, and full. |

    | Script TSP Postmortem | A guide to gathering, recording, and analyzing cycle
    and project data, comparing performance against goals and plans, and identifying
    areas where improvement is needed |

    | Specification TSP Project Notebook | A high-level reference to the information
    and data prepared and gathered by the project team |'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Status Review Issues


    Project managers typically do not look forward to project status review meetings
    with their management. The principal reason is that they are uneasy because they
    do not know their project status or know that the project is in trouble. Preparing
    for a status review can also take a lot of the manager’s and the team’s time.
    However, with its detailed plans, metrics, and daily and weekly tracking, the
    TSP’s self-directed team management style substantially addresses these concerns.
    Nearly all of the information required for the status reports is routinely prepared
    for each of the team’s weekly meetings, and it need only to be summarized for
    presentation to management. If the team’s status is a surprise to the team, the
    team leader, or the TSP coach, you should consider getting external support, especially
    if the TSP coach or team leader has not already brought these issues to your attention.
    There are six rules to follow during TSP status meetings:


    +   1. Management must respect the privacy of individual team members’ data. While
    it may occasionally be obvious who is responsible for a schedule delay or a product
    quality problem, managers must never single out such individuals.


    +   2. Managers should recognize a project that doesn’t have accurate and detailed
    data can’t be compared to one that does. The project without data is like a sports
    team that does not know the score. It will likely report that it is on schedule
    until it gets near a major milestone or delivery date.


    +   3. Managers should treat the team like a team. They should not criticize or
    praise the team leader or any team member for problems or successes. They should
    hold the entire team accountable for addressing its problems and for coming back
    with answers and problem solutions.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '+   4. Managers should reward teams for having and using data. They may not
    always like the picture the data paint, but if the team isn’t recording and using
    data, the TSP will not work.


    +   5. Managers must not overreact. TSP teams generally have a good understanding
    of their status, but they are not always on schedule, especially at the beginning
    of a pilot project. Think of the project like a sporting match; the team may fall
    behind, but in the early phases there is time for it to catch up. The data and
    lessons learned from each week and cycle will help the team find solutions to
    its own problems. The manager’s job is to work with the TSP coach and the team
    leader to ensure that they solve their own problems.


    +   6. Managers should recognize quality work. Superior work looks easy, so managers
    must focus on the team’s performance and the quality of its work and not just
    on how hard the team worked. Hard work should be rewarded when it is productive
    but not when it is done to recover from the excessive test time needed to fix
    problems the team itself created.


    During any TSP review meeting, managers should be alert to a few critical success
    factors. If they see issues in these areas, they should wait until after the meeting
    and discuss them with the TSP coach or the team leader as appropriate.


    +   * Data quality: If the quality of the data gathered by the team is poor, TSP’s
    self-directed team management concepts will not work. Discuss this with the TSP
    coach.


    +   * Acting like a team: Teamwork is a critical success factor for the TSP. The
    members of the team, including the team leader, must support each other and act
    like a team. If managers'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'see teamwork issues, they should discuss them with the TSP coach. A particularly
    sensitive issue here concerns the presence of an uncooperative or disruptive team
    member.


    +   - Leadership issues: Leadership is most important. If the team leader is not
    motivating the team, maintaining appropriate standards, and building team cohesion,
    performance will suffer. Managers should be sensitive to potential leadership
    problems and check with the coach on the team leader’s performance.


    +   - Coaching quality: Coaching is a critical success factor for TSP. If the
    coach is not properly supporting the team, especially the pilot project teams,
    the TSP implementation could fail. Managers should discuss this with the team
    leader and then the coach. The organization may need external support for this
    issue.


    +   - Management issues: If the existing policy, culture, or bureaucracy appears
    to be in the way, managers should discuss the issue with the TSP coach or team
    leader and support the team by removing such barriers.


    # SUMMARY


    The strategy for implementing the TSP is based on the experiences, both good and
    bad, of many organizations. Success with this first step is important because
    a poorly implemented pilot program will make it difficult to convene later groups
    to try the TSP. A successful first effort will build internal support for moving
    the early adopters to the early majority. Focusing on a few pilot projects will
    also help to ensure that the initial efforts have sufficient resources and support.
    The measured results and performance benefits that are typical with TSP will help
    to build the momentum needed to accelerate the overall effort and to broaden it
    to cover the entire organization.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'There are many things to consider in TSP implementation, but the basic steps
    are reasonably straightforward. First, staff an implementation team, train them,
    and if possible include an experienced external consultant. Develop a plan around
    the key steps: planning, goal setting, and team selection. Then train, launch,
    and coach the teams. Finally, evaluate the pilot results and if there are problems,
    find outside help from the growing community of TSP practitioners or from the
    Software Engineering Institute.


