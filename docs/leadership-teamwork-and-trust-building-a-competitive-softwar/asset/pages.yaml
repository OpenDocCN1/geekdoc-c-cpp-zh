  md: '# WHY CUSTOMERS TOLERATE SHODDY SOFTWARE WORK 33


    customer-friendly way; what would happen then? While it is impossible to predict
    exactly what would happen, the general outlines are almost certainly what Schumpeter
    predicted: creative destruction [Schumpeter 1942]. As we described in Chapter
    1, when a competitor comes up with a new and better way to do business, the old
    industry leaders are ultimately replaced, sometimes surprisingly quickly.


    This, for example, is how Toyota overtook GM to become the worldwide leader in
    vehicle sales. Just ten years after registering its first vehicle in the United
    States in California in 1958, Toyota’s U.S. sales reached 71,000. Then, by 1988,
    the company started producing vehicles in the United States. Because it had participated
    in the Japanese quality initiative initiative inspired by W. Edwards Deming (Deming
    1982), Toyota was producing the highest-quality cars in the industry, allowing
    the company to introduce a 36,000-mile/3-year bumper-to-bumper warranty in 1988.
    By 2000, just 12 years later, Toyota sells more vehicles than GM, both worldwide
    and in the United States.


    Toyota has recently stumbled,, but that is not surprising. According to Schumpeter,
    industry leaders always get complacent. They begin to believe that they are successful
    because they are so good, and because they are so good, they don''t need to listen
    to outsiders or change their tried-and-true formula for success. Then, as history
    has amply proven, problems are inevitable.


    Toyota is an example of how a small, innovative company can overtake a seemingly
    invincible industry leader and how, once it is a leader, it too becomes complacent.
    In fact, Toyota now blames its recent problems on its drive to become the world’s
    largest automobile company. This can happen to anybody. As soon as customers have
    an alternative to shoddy work, they will move. It may take a few years, but industry
    leadership'
