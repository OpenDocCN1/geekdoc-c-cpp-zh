  md: 'The fourth lesson from this example is that knowledge-working teams often know
    a great deal more about their jobs and how they should be done by their managers.
    As we will discuss in the next chapter, the key to managing knowledge work is
    to empower knowledge workers and enable them to participate as partners with management
    in controlling and directing their own work. Because these teams will then be
    thinking and acting more like owners than employees, they are likely to come up
    with creative solutions to problems when, often, their management might not even
    know these problems existed.


    # THE FUTURE OF KNOWLEDGE WORK


    The reason that knowledge work is important today and that it will be increasingly
    important in the future concerns the nature of modern technology and what will
    likely happen in the future. In the course of industrial history, the sophistication
    and complexity of products and services have steadily increased. The reason for
    more complexity, of course, is to make products and services more convenient,
    flexible, and useful to their final users. Increased complexity used led to increased
    manufacturing costs, but that is no longer the case. The principal reason is the
    advent of modern computer technology. Starting with the computer era, engineers
    found that they could implement complex functions far more economically with computer
    software than with mechanical gears and levers. This cut manufacturing costs sharply,
    while producing gears and levers costs money, producing copies of software products
    costs essentially nothing.


    Now, when powerful microcomputers can be obtained for a few cents and manufacturing
    costs for the programs that drive these microcomputers are essentially zero, just
    about all logical functions are handled with software. This means that and'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'more of the time of product designers is spent either writing programs or producing
    logical designs with methods that look very much like those used by programmers.
    This increased demand for programming-like work also extends to the manufacturing
    sphere where the production floor itself is heavily automated and much of the
    monitoring, adjustment, repair, and reconfiguration work involves software skills.


    Even beyond product development and manufacturing, modern economies are increasingly
    service-oriented. For example, IBM used to be primarily a hardware company that
    manufactured and sold computing equipment. While it still sells computer hardware,
    over three-quarters of its business is now software and services. The employees
    doing this work are either programmers or analysts whose job is to solve customer
    problems. This, in fact, is increasingly the nature of modern work: defining and
    specifying complex problems so that they can be solved by computers. This is knowledge
    work, and, like IBM, most companies will soon find that it is the highest-value
    part of what their people do. That is why Peter Drucker stated that the principal
    challenge of this century will be making knowledge work productive.


    # SUMMARY AND CONCLUSIONS


    This chapter addresses the second key challenge raised in Chapter 1: making knowledge
    work productive. As Peter Drucker said [Drucker 1997],


    The productivity of knowledge workers will not be the only competitive factor
    in the world economy. It is, however, likely to become the decisive factor, at
    least for most industries in developed countries.'
