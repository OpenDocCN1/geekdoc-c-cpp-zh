    # HOW LONG WILL IT TAKE TO IMPLEMENT THE TSP?


    The time required to implement the TSP will depend on the pace of the implementation
    and the scope. The TSP is implemented on a project-by-project basis that allows
    the organization to establish the pace and scope and control the costs.


    As shown in Figure A.3, the TSP is implemented in three phases. The details of
    each phase are provided in Appendices B, C, and E. In the initial piloting phase
    the TSP is applied to only two or three projects. After these projects have achieved
    the goals established for the piloting phase, the second phase can start the broad
    implementation effort. So after broader implementation is started, a third phase,
    focused on sustaining and improving performance, gets under way. These phases
    overlap and would be repeated in large organizations when moving from division
    to division across the entire organization.


    The project-by-project implementation strategy used in the first and second phases
    includes a training component and a coaching component. The TSP is introduced
    by training project'
