    The second reason that building trust is a challenge is today’s culture of placing
    blame. When something bad happens, the first question is usually “Who did it?”
    Whether it is an improperly set valve, a damaging software defect, or a broken
    cookie jar, somebody obviously did something wrong, and it seems natural to find
    out who was. The search for culprits, however, is rarely productive. It is better
    to view mistakes as process problems and to make an objective search for what
    happened in order to determine how to prevent a recurrence. Whether changes are
    needed in training, procedures, or job assignments, the underlying problems cannot
    be prevented unless the causes are understood. The key is to recognize that all
    people make mistakes and that our processes must be designed to minimize mistakes
    and to find these mistakes before they cause serious harm. Until organizations
