    # WHY SOFTWARE’S PROBLEMS PERSIST


    The reason these software problems have not been solved before is, of course,
    that the cause has not been recognized and addressed. Merely trying to manage
    software or any other knowledge work by changing managers or tightening up on
    rules and procedures will not work. These strategies have all been tried before
