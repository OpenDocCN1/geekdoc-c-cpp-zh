    # Conclusions on Testing


    At this point, we can state several conclusions. First, today’s large-scale systems
    typically have many defects. Second, these defects generally do not cause problems
    as long as the systems are used only in ways that have been tested. Third, because
    of the growing complexity of modern systems, it is impossible to test all of the
    ways in which such systems could be used. Fourth, when systems are stressed in
    unusual ways, their software is most likely to encounter undiscovered defects.
    Fifth, under these stressful conditions, these systems are least likely to operate
    correctly or reliably. Therefore, with the current commonly used test-based software
    quality strategy, large-scale life-critical systems will be least reliable in
    emergencies, and that is when reliability is most important.


    # Why Defective Systems Work


    With so many defects remaining in systems, and with such a small percentage of
    program functions being tested, one might wonder why we don’t have more software
    quality disasters. The reason is that the beta-testing strategy adopted by many
    organizations has turned out to be surprisingly effective.


    When IBM encountered a system-testing problem with its early OS/360 operating
    system more than 40 years ago, it started a practice that is called beta testing.
    In beta testing, a system is thoroughly tested and then early copies are sent
    to selected users. Then, when these users find problems, the supplier produces
    fixes. Once all of these early users’ problems are fixed, the supplier releases
    the beta-tested system for general use. This strategy is now widely used and has
    been quite effective. As long'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'as the users'' behavior is reasonably predictable and as long as the applications
    are not safety critical, this strategy usually results in fairly reliable systems.
    However, although this beta-testing strategy is helpful now, as systems get more
    complex, users'' behavior is likely to be much less uniform and beta testing will
    be much less effective. And, even though your users may be reasonably satisfied
    now with the quality of the software beta testing produces, the beta-testing strategy
    is expensive and typically delays product release by at least a year. Clearly,
    an alternative will soon be needed to replace the current beta-testing approach
    to software quality management.


