  md: '# Assessing Plan Feasibility


    Projects are more likely to meet their objectives when the plans and the work
    are divided into manageable parts. The TSP uses the iterative or cyclic development
    strategy shown in Figures B.8 and B.9 to divide the overall plan into a series
    of cycles. Each of the cycles starts with a team launch or relaunch and ends with
    a postmortem. Between the launch/relaunch and the postmortem the team manages
    its work task by task, day by day, and week by week using structured weekly meetings.


    The product development timeline is divided into separate releases, and each release
    is further divided into iterations. The cycles are not required to have fixed
    lengths, but they are typically a few weeks to a few months in duration. A cycle
    may represent all or part of a development phase, for example, design and develop
    one or more product features or compo


