  md: '# # Managing with Facts and Data


    Now that your knowledge-working teams are managing themselves, they should be
    doing quality work for predictable costs and on their committed schedules. Before
    they can do this, these teams must have data, and these data can be a valuable
    management tool. However, to be useful for you and the teams, the data must be
    of high quality. Furthermore, experience shows that the single most important
    indicator of superior TSP team performance is the accuracy and completeness of
    its data. This demonstrates that the team is highly disciplined, which in turn
    correlates with superior team performance. This suggests two questions:


    +   1. How can you use the TSP data to help manage the business?

    2. How can you know that the TSP teams are doing quality work?


    We discuss the first of these questions in this chapter and the second one in
    Chapters 8 and 9.


    # AUDITABLE DATA


    Asking how you could use TSP data is a little like asking you could use financial
    data. The reason is that TSP data, like'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'financial data, are auditable, and you can use your existing audit-ing staff
    to assure yourself that the data truly represent what is going on in the business.
    When the data do show what is going on, they, combined with financial data, will
    give you a precise and comprehensive picture of operational status and performance.
    While using these data however, it is wise to remember what Samuel Clemens (Mark
    Twain) once said: “Figures don’t lie but liars figure” [Kirkman 1996]. This means
    that people must be motivated not to fake or “adjust” their data. If they do,
    the data will not be trustworthy and could even be misleading.


    # Personal Data


    The motivation to gather and use data is particularly important for knowledge
    work because the data concern how these people do their jobs. To be useful, TSP
    data must cover every aspect of the work: the time that the developers spend on
    each activity, the mistakes they make, and the defects they find and fix. With
    these data, their managers can quickly determine which workers are most productive,
    who is making the most mistakes, and who may not be producing such useful product.
    The first reaction of many managers to this data is: “Wow, now I can really clean
    house!” They visualize ranking their people, identifying those who are most productive,
    and dumping everyone else. However, not only would this be counterproductive;
    it would seriously damage your organization’s ability to do creative work. There
    are two reasons for this.


    First, using data to evaluate the people who gather that data would make those
    data threatening to those people. At the first hint that management is using their
    data as a performance assessment tool, your knowledge workers would either stop
    gathering data, or the data they gather would be “adjusted” that the data could
    not be used to accurately evaluate anyone'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'who gathered them. Not only would using data as an assessment tool destroy
    the effectiveness of the TSP; it would also likely destroy the engineers'' motivation
    to cooperate with management. In short, management would become the enemy. Because
    the knowledge workers are the only ones who can gather these data, it would be
    difficult for anyone but a trained auditor to tell whether the data were accurate
    and complete. As noted in Chapter 5, the only way to ensure the quality of the
    data is to convince the knowledge workers that they need accurate and complete
    personal data to do high-quality personal work.


    The second reason that misuse of TSP data would be a bad idea is that all data,
    even TSP data, represent a simplistic one-dimensional view. Some engineers are
    superb coders and others are first-class designers. The most effective and creative
    teams include a mix of skills and talents, and most people are good at some tasks
    but not so good at others. The challenge for the teams is to know who is best
    suited for each kind of job and then to balance the team''s workload so that the
    team''s overall performance is maximized. This means that team members must occasionally
    do some tasks for which they are not best suited. It is not that they want to
    work at less maximum efficiency but rather that they were the best people available
    at the time.


    # Handling Poor Performers


    While most managers understand that few employees excel at every task and are
    willing to make allowances, they generally rebel at not being able to use TSP
    data to identify and discipline their poorest performers. The reason this is unrealistic
    is that the poor performers know they are poor performers, and they rarely gather
    accurate data. These, in fact, are often the very people who strenuously object
    to using the TSP in the first place. They'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# 110 CHAPTER 7 MANAGING WITH FACTS AND DATA


    know that the TSP data could expose them, and they will do everything in their
    power to conceal their poor performance. In short, the poorest performers will
    view the TSP data as threatening, no matter what management does.


    So, assuming that these poor performers did manage to make onto a TSP team and
    that they actually gather some data, their data would be so inaccurate as to be
    useless for evaluation purposes. In fact, the data would probably show that they
    were high performers, and if management tried to use the data for an evaluation,
    the data would likely show that these people were much better than they actually
    were. This would make it difficult for management to take disciplinary action.


    While it is important to identify the poor performers and to remove them from
    their TSP teams as quickly as possible, these people usually have attitude problems
    and can be identified without using their data. The team members will know who
    is uncooperative and who is unwilling to work with and support the rest of the
    team. While the other team members are gathering and using their data and measuring
    and managing their work, the poor performers are not. Team performance then suffers,
    and the rest of the team resent it. When properly coached and led, disciplined
    knowledge-working teams can help management identify and discipline the poor performers.
    As long as management is sensitive to the team’s needs, they will learn these
    problem team members are, and the team will be relieved to have them rehabilitated
    or reassigned.


    Removing poor performers is always a problem. Poor performers are generally adept
    at concealing their failings, and their poor performance may not be recognized
    even by the other members of their teams. When they start to use the TSP, however,
    they must work to detailed plans and visibly track their progress. Then they will
    have no place to hide.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '+   * Do they have detailed plans?

    * Are they following these plans?

    * Are they gathering data?

    * Are they accomplishing their planned tasks?

    * Are they helping and supporting their teammates?


    If they are not, the whole team will know and resent it. Then, one way or another,
    the team will devise some way to let management know. Management will be able
    to take action more rapidly than they ever could have before. As long as management
    doesn''t use any team member’s data to evaluate anyone, there will not be any
    problems.


    # AUDITING TSP DATA


    The single most important performance indicator for a TSP team is the accuracy
    and completeness of the team’s data, and the second most important indicator is
    the way the team uses these data. That is why team leaders, coaches, and management
    should treat the quality and use of team data as a high-priority item. This topic
    is discussed further in Chapter 9.


    To keep teams focused on data quality, the company’s financial auditors should
    regularly audit the quality and use of the TSP data. This will assure you that
    these data are accurate and complete, and that they can be relied upon to properly
    portray the organization’s performance. This also means that you must treat unsatisfactory
    audits of TSP data just as seriously as you treat unsatisfactory financial audits.


    TSP data audits must treat all personal data as confidential to the person who
    gathered it, and all audit reports should contain only team-level data and above.
    Of course, either the financial auditors would have to be trained in how to audit
    and evaluate'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# 112 CHAPTER 7 MANAGING WITH FACTS AND DATA


    TSP data and in observing the privacy of personal team-member data, or some TSP-qualified
    group should be trained in professional auditing practices.


    # USING TSP DATA


    Once you have auditable data from the knowledge-working teams, you will have a
    powerful tool for managing and improving the business. You will also be able to
    communicate rapidly and precisely about the operational aspects of the business,
    even through several layers of management.


    # TSP Data


    The TSP data will enable you to understand operational costs and identify improvement
    opportunities in all areas that use the TSP. To appreciate these opportunities,
    consider what your people know. For every project, they know how much time was
    spent on each activity, the sizes of the products produced, and the numbers and
    types of defects that the developers injected and removed. They also know how
    the project''s results compared with the original plans and which support tools
    and methods were used. To visualize the kinds of analyses you can perform using
    TSP data, consider the following 11 examples.


    # Productivity Analysis


    Team productivity is generally not a useful means for comparing team performance
    because productivity is affected by many variables. For example, productivity
    generally varies by as much as a factor of six depending on the type of product,
    the percentage of new or modified product elements, and the size of the product
    [Flaherty 1985]. However, with the TSP there is a very useful measure that directly
    correlates with team productivity. It'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'is called the task-hour measure. Task hours are the hours that engineering
    teams spend actually working on tasks that are in the team’s project plan. Because
    the percentage of time that developers can spend on project tasks directly influences
    the cost of the work, task-hour performance is an important though rarely used
    productivity measure.


    On TSP teams, the task-hour measure provides a precise way to determine how much
    of a team member''s time is spent on planned project tasks and how much on other
    activities. For example, typical TSP teams find that the amount of time they actually
    spend on project tasks is between 15 and 18 hours out of a standard 40-hour workweek.
    The balance of their time is spent in meetings, handling e-mail, helping coworkers,
    talking with managers, taking training courses, or dealing with interruptions
    and questions.


    When they first use the TSP, most teams find that they had been achieving only
    10 to 12 task hours a week before they started measuring and tracking their task
    time; one large organization ran a study and found that its engineering teams
    were averaging fewer than five tasks per week before they started using the TSP.
    With the TSP, knowledge workers can quickly improve their task time.


    Figure 7.1 shows how one team at Allied Signal improved average weekly tasks from
    about 10 hours per week to about 16. That is a 60% increase in project time at
    no increase in cost. Most first-time TSP teams have similar results.


    # Benchmark Analysis


    Your people can identify other organizations that are using the TSP and establish
    benchmarks on task-hour rates, quality performance, employee satisfaction, customer
    satisfaction, and many other measures. If such groups are local, they can even'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Average Task Hours Per Week


    ![](img/95b42669de34021a8760ed3006f5bdb6_136_0.png)


    **Figure 7.1** Allied Signal weekly task hours


    arrange for occasional lessons-learned meetings or brief improvement workshops.
    They can also work with industry groups or the SEI to establish benchmarks among
    competitive organizations. Benchmarking is a powerful tool that can be most effective
    at the team level because the data show what other teams have produced. This shows
    your teams that improvement is possible and can help motivate them to meet or
    exceed the benchmarks.


    # Analysis of Coaching Support


    In Chapter 9, we discuss coaching support for TSP teams. Few technical organizations
    use coaches to guide and motivate their engineering teams, but the experience
    with TSP teams is similar to that with professional sports teams: The quality
    of the coach- determines the quality of the team. To assess the value of team
    coaching, your organization can experiment with various levels of coaching support
    and analyze the performance of the teams to determine the costs and benefits of
    each level of support.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'In doing coaching analyses, ensure that all of the TSP coaches have similar
    qualifications and that they are actually coaching teams. The direct costs of
    coaching will be obvious, but determining the benefits requires a comparative
    analysis of your engineering teams. There are many ways to measure team performance,
    but the most useful measures concern schedule performance, quality performance,
    and task-hour performance.


    When comparing projects, it is also essential to consider team experience. First-time
    TSP teams need more coaching support than experienced ones; however, the quality
    and task-hour benefits of professional coaching should quickly become obvious
    even with beginning TSP teams. With information about the effectiveness of coaching
    support, your management team can make informed decisions about the optimal level
    of coaching resources.


    # Cost-of-Quality Analysis


    As noted in Chapter 8, the time and money wasted by poorquality software work
    often exceeds 50% of total project costs. By using TSP data, your people can determine
    the quality costs for each project and identify the highest-priority areas for
    improvement. Then, by addressing the highest-priority areas, they can sharply
    reduce life-cycle costs. Because 70% to 80% of the costs of final testing and
    customer support are typically due to poor product quality, and these costs often
    exceed the total cost of product development, showing the developers how to improve
    product quality can save large amounts of money (see also Appendix D).


    Development groups are rarely considered responsible for the post-development
    costs of their work, so it is important to make these quality costs visible to
    them. Then, when they start new projects, they can establish cost-of-quality improvement
    goals'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'and define plans to help them meet these goals. Your management team will then
    have the data to monitor team performance and establish appropriate ways to recognize
    superior work.


    # Customer Satisfaction Analysis


    Customer satisfaction studies can be particularly instructive for all kinds of
    development work. Customer satisfaction typically improves sharply as a reaction
    to better cost, schedule, and quality performance. For custom development work,
    team responsiveness and frequent, open, and honest communications between the
    customers and the engineering teams can be a major source of customer satisfaction
    and loyalty.


    For large-volume proprietary products, IBM ran surveys for all of its large-system
    customers using a five-level rating, from very satisfied to very dissatisfied.
    The results of each survey were then presented to senior corporate management,
    and any project manager who had a very-dissatisfied customer rating was required
    to attend and explain his or her resolution plan to this executive. Any product
    manager who had not already visited every very-dissatisfied customer and resolved
    his or her problems was severely criticized.


    Development managers are often surprised to find that many aspects of their work
    that they had largely ignored are very important to their customers. Examples
    are product documentation, installation complexity, fix quality, and the user
    interface. Customer satisfaction surveys can focus development attention on these
    often-ignored details and quickly turn very dissatisfied customers into loyal
    supporters.


    # Employee Satisfaction Analysis


    Employee turnover can be a major cost in technical organizations. Because the
    best people are often the ones most likely to'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'leave, the costs of replacing them can be substantial, particularly considering
    lost skills and project disruption. Because dissatisfied employees often have
    low task hours, poor data-gathering practices, and product quality problems, an
    analysis of team performance data often identify possible satisfaction problems
    before they cause turnover problems.


    # Facilities Analysis


    While many organizations have experimented with various workplace configurations
    for their knowledge workers, few have any data to support their actions. Poor
    facilities arrangements can sharply reduce team task-hour performance. In one
    case, a newly hired developer was found to have much lower weekly task hours than
    anyone else on the team. The team leader considered replacing her until he learned
    that her desk was in an open area beside the copying machines. Whenever people
    were waiting for an available copy machine, they would stop and talk to her. When
    they moved her desk, her tasks came up to the team average. Without the task-hour
    measure, the team leader would have no way of knowing why this developer’s performance
    was substandard.


    # Financial Performance Analysis


    Financial performance is one of the most promising and profitable areas for using
    TSP data. As noted in Chapter 2, Cesar, the CEO of Quarksoft, initiated a program
    to track the profitability of every engineering team on a weekly basis. By assigning
    a profit target to each team based on its planned schedule, the company could
    calculate the percentage of the work done each week and compare it to the percentage
    of planned effort expended. Then management could determine the profit earned
    to date. The company found that although these weekly'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'profit earnings fluctuated considerably, they provided a valuable early warning
    of potential project problems. As Carlos, Quark-soft’s VP for R&D, said, using
    TSP “is important for us because it shows on a weekly basis the financial viability
    of the organization.” Previously they got this information only monthly.


    # Organization Structural Analysis


    One question on which there is little agreement and even less data concerns concerns
    management’s span of control. How many people should one manager supervise and
    how deep an organizational pyramid is optimal? The normal considerations in this
    decision concern the ability of managers to provide adequate personal guidance
    to their people. A countervailing consideration for which organizations typically
    have no data concerns the task time that the managers consume talking to people
    or asking them for reports, feedback, or special assignments.


    In the case of one organization that uses TSP, senior management noticed that
    after a steady average of 16 hours per week, the teams jumped to over 20 task
    hours for one week before dropping back to 16. When they looked for the cause,
    they found that there had been a management off-site that week. With no managers
    to interrupt or distract them, the developers had more time to devote to their
    project work. The obvious conclusion: While some level of supervision and guidance
    is essential, with self-directed teams, more managers mean fewer task hours and
    lower engineering productivity.


    # Staff Support Analysis


    Some organizations are proud to have what they call a “lean and mean” organization.
    By this they mean that they have minimized the size of their support staff. While
    the size and effec-'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# USING TSP DATA 119


    tiveness of the support staff should always be monitored, few organizations have
    the data to evaluate the trade-offs. When management minimizes the size of the
    support staff, they are forcing the knowledge workers to do their own clerical
    work. Developers become very high-priced clerks when they have to make their own
    copies, complete expense reports, file documents, and the like. Some simple experiments
    with various levels of clerical support coupled with an analysis of team task-hour
    performance could help to determine the optimum level of staff support. Because
    few developers know how to use staff support effectively, some brief training
    sessions would likely help them improve their use of staff and improve their task
    time.


    # Tool Support Analysis


    Tool support is an obvious area for study. When many projects are doing similar
    work, it is often possible to compare the task-hour and quality performance of
    teams using different kinds of support tools or engineering methods, because human
    performance varies far more widely than the likely impact of any tool or method
    selection, a substantial number of projects should be studied to get statistically
    meaningful results. While such studies can be interesting, the principal surprise
    will be how small a difference tools actually make. The team members will object
    strenuously to inconvenient or poorly performing tools, but any new tool''s actual
    measured impact on team performance is likely to be less than 10%. The single
    exception is tool support for data gathering, which can have a bigger payoff.
    The payoff would not be in cutting the modest amount of time required for data
    gathering but in increasing the quality and completeness of the data.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# COMMUNICATING WITH DATA


    Organizations often have communication problems, particularly between the executives
    and senior managers and the working-level developers. These problems generally
    occur in two areas: communication accuracy and the communication hierarchy.


    # Communication Accuracy


    When people communicate verbally, there are often misunderstandings, particularly
    if the subject is either complex or urgent. People generally hear what they are
    listening for, and our words often poorly represent what we intend to say. This
    is why the financial controls in most businesses are far more precise and reliable
    than those for any other aspect of the business: They are based on auditable data
    that are precisely defined and commonly understood at all levels of the business.
    With the TSP, you will have precise, well-defined, and auditable data on development
    operations. This will provide an equally accurate and reliable way to communicate
    about the major operational aspects of your business. One key challenge, however,
    is to listen.


    # The Communication Hierarchy


    Hierarchical communication problems concern the credibility that people typically
    gain by attaining a senior management position or a high level of seniority. This
    typically makes it hard for junior people to be heard, even when they have an
    important message. In his book 7 Habits of Highly Effective People, Stephen Covey
    gives a wonderful example of the hierarchical communication problem [Covey 1990]:


    Two battleships assigned to the training squadron had been at sea on maneuvers
    in heavy weather for several days. I was serving on the lead battleship and was
    on watch on the bridge as night'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'fell. The visibility was poor with patchy fog, so the captain remained on the
    bridge keeping an eye on all activities.


    Shortly after dark, the lookout on the wing of the bridge reported, “Light, bearing
    on the starboard bow.”


    “Is it steady or moving astern?” the captain called out.


    Lookout replied, “Steady, captain,” which meant we were on a dangerous collision
    course with ship.


    The captain then called to the signalman, “Signal that ship: We are on a collision
    course, advise you change course 20 degrees.”


    Back came a signal, “Advisable for you to change course 20 degrees.”


    The captain said, “Send, I’m a captain, change course 20 degrees.”


    “I’m a seaman second class,” came the reply. “You had better change course 20
    degrees.”


    By that time, the captain was furious. He spat out, “Send, I’m a battleship. Change
    course 20 degrees.”


    Back came a flashing light, “I’m a lighthouse.”


    We changed course.


    Sometimes junior people know critical things that you really need to hear. The
    advantage of focusing on facts and data is that it can cut through all the prestige
    and status issues that befog most organizational communications and quickly guide
    you to the essence of the problem at hand. Then you can have the accurate and
    timely information you need to inform your decision making.


    Once your working-level professionals understand the power of their data, they
    will have the ability to bypass the normal constraints and taboos of the organizational
    hierarchy so they can be heard. Then, like the battleship captain, your challenge
    will be to listen. This might sometimes force you to make an embarrassing'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'change of course, but that would be better than stubbornly sticking with an
    untenable position and putting your organiza- on the rocks.


    # SUMMARY AND CONCLUSIONS


    This chapter defines the steps required to ensure the TSP data gathered by your
    knowledge-working groups are accurate and reliable, and it describes some of the
    opportunities you could have to use these data to maximize organizational perfor-
    m. The key points made in this chapter are as follows:


    +   1. Experience shows that the single most important indicator of superior team
    performance is the accuracy and com-pleteness of its data. Superior data quality
    demonstrates superior team discipline, which typically correlates with superior
    team performance.


    +   2. Before you can use TSP data with confidence, you must ensure that these
    data are accurate and complete, and that they are used appropriately. There are
    two aspects of doing this:


    +   a. If data are to be useful, they must represent accu- rately what is being
    done. That means that data not be used to evaluate people, because the data would
    then be viewed as threatening and would not likely be accurately reported.


    +   b. Even if data are not used in a threatening way, people are rarely sufficiently
    motivated to gather their data completely and consistently. By using the financial
    auditing staff to check the quality of the TSP data, you can ensure that data
    gathering and use are con-sistently viewed as high-priority items.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '3. Once you have high-quality data, there are many ways to use these data to
    improve business performance. The chapter briefly discusses the following 11 example
    areas:


    +   a. Productivity analysis


    +   b. Benchmark analysis


    +   c. Analysis of coaching support


    +   d. Cost-of-quality analysis


    +   e. Customer satisfaction analysis


    +   f. Employee satisfaction analysis


    +   g. Facilities analysis


    +   h. Financial performance analysis


    +   i. Organization structural analysis


    +   j. Staff support analysis


    +   k. Tool support analysis


    4. With precise operational data on your business, you will be able to communicate
    far more rapidly and accurately than ever before. The two key aspects of this
    communication issue are as follows:


    +   a. With precisely defined and well-understood data, the likelihood of misunderstandings
    will be greatly reduced, making it possible to rapidly communicate important facts
    from the bottom to the top of even large organizations.


    +   b. With this data communication capability comes an obligation, particularly
    for senior executives and managers, to listen to the data, regardless of the prestige
    or seniority of the messenger.'
