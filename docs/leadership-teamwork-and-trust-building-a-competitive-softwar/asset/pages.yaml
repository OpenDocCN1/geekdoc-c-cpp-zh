    Figure B.8 TSP cyclic development strategy'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'nents. Each cycle has a clear outcome and a manageable duration. If the project
    plan includes multiple customer releases, each release often includes one or more
    TSP cycles.


    The product development timeline is bounded by a TSP launch and a TSP project
    postmortem. Each cycle is also started with a TSP launch or relaunch. If more
    than one project team is using the TSP on the same product development timeline,
    the initial TSP launch will include all teams. Subsequent cycle relaunches do
