  md: '258 APPENDIX D USING THE TSP TO MANAGE PROGRAMS


    +   * Monitoring program status

    * Identifying and resolving issues

    * Managing quality

    * Dealing with the customer

    * Management’s continuing responsibilities


    # THE PROGRAM MANAGEMENT PROBLEM


    In this appendix, we assume that you are managing a large multi-facility program
    consisting of several subsystems. The work is performed in multiple locations
    by several hundred to a thousand or more hardware and software developers and
    support personnel. Managers of companies, divisions, laboratories, or large departments
    also face many of these same program management problems. We do not, however,
    address the non-development issues on which senior managers typically spend considerable
    time such as legal, financial management, marketing, personnel, facilities, services,
    and advanced technology. While TSP methods could be used in these areas just as
    effectively as development, we do not recommend applying it to them until you
    have considerable TSP experience and a number of qualified coaches. The topics
    we discuss in this appendix relate to the development work itself, and they are
    the following:


    +   * Establishing aggressive but realistic plans. The issue here is establishing
    program plans that are aggressive enough to maintain a sense of security but not
    so likely to miss major customer commitments.


    +   * Monitoring program status. Program status is a serious problem for large
    programs because development groups often appear to be on schedule until they
    suddenly announce a major schedule slip. This problem is particu'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'larly common for programs that involve a substantial amount of software work.


    +   **Identifying and resolving issues.** This topic relates to the trust topic
    we discussed in Chapter 5. The challenge here is to identify issues early enough
    to do more than merely react to the resulting crises.


    +   **Managing quality.** Quality management is impossible in a crisis-driven
    environment. The reason is that quality problems only become crises long after
    there is any way to mitigate or prevent them. If you do not manage quality until
    it becomes a crisis, you are not managing quality; you are reacting to quality
    problems.


    +   **Dealing with the customer.** This subject also concerns the trust issue,
    but here you are on the other side. As long as things are progressing according
    to plan, customer relations will be good, but when programs start missing commitments
    or having unpleasant surprises, customer relationships will quickly sour. Then
    again, instead of managing the customer relationship, you will be reacting to
    a new set of crises: those caused by an irate and suspicious customer.


    This appendix describes how to use the TSP methods and data to address these issues.


    # ESTABLISHING AGGRESSIVE BUT REALISTIC PLANS


    The task of establishing an aggressive but realistic plan involves a trade-off:
    balancing the risk of missing commitments with the need for a challenged and motivated
    workforce. To be successful, your teams must work smarter and better than the
    competitors, but they must also meet their commitments. Your job is to'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'ensure that their plans are as tight and aggressive as possible but also that
    the technical work is feasible and the resources available are likely to complete
    the job in the required time.


    # Building Team Motivation


    To get a plan, you obviously must tell the team what you want. That is the first
    part of the management job in TSP launch meeting 1. The second and even more important
    part is to motivate the team members to produce as aggressive a plan as they can.


    Motivating people is a leadership problem. The need is to convince your potential
    followers to accept your goals as theirs and to then do their utmost to meet them.
    For development groups, this motivation problem is pretty simple when the job
    is building an exciting new product. Then all you need to do is to explain why
    the product is exciting and why your business goals are important.


    The more difficult challenge is when the product isn’t exciting. Examples would
    be reworking an older existing product or providing maintenance support for installed
    systems. Because the product is not inherently exciting, the challenge is to make
    the work itself exciting. The description in Appendix C of how Jason Ziemer did
    with his maintenance team at NAVO is an excellent example of this. He challenged
    them to cut their response time for engineering change requests (ECRs) from the
    U.S. Navy’s fleet. The team members were highly motivated by this challenge because
    they knew their customers were in warships on station in battle zones. They actually
    cut the response time for many ECRs from weeks to days. They did this for a job
    that everybody previously viewed as routine and boring.


    Making work exciting is an important part of building team motivation, but there
    is another and even more important part:'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# ESTABLISHING AGGRESSIVE BUT REALISTIC PLANS 261


    making the team members feel like partners with management. Here again we have
    the trust issue. The only way to make knowledge-working teams feel like partners
    with management is to be honest with them; explain exactly what you need and why.
    An excellent example of how to do this is the way Peter Bartko, the former CEO
    of EBS, handled the schedule problem with a large team the company had charged
    with developing an important new system for online currency trading [Humphrey
    2002].


    In TSP launch meeting 1, Peter described the company’s business situation, the
    competitive challenges, and why it was important to have this new system available
    in one year. The team spent an entire week developing the plan, but they could
    see no way to deliver the product in less than two years. While Peter was clearly
    disappointed, he ended up accepting the team’s plan. However, the team members
    now understood the business need and were also concerned about the two-year schedule.
    They proceeded with the design, they soon figured out how to produce a reduced-function
    system version within one year. They then revised their plan and met their new
    one-year commitment. The power of motivated and committed teams is extraordinary.
    If you trust them with the facts, they will be creative partners and will keep
    thinking about better ways to meet your goals.


    # Assessing the Plan


    After TSP teams produce their plans, they present them to management in launch
    meeting 9. Now management must switch its role. Instead of pushing for the most
    aggressive plan you can get, you must assure yourself that the plan is realistic
    and achievable. Because development work typically involves building products
    or adding new enhancements to existing products, developers often argue that they
    cannot estimate and plan the'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# 262 APPENDIX D USING THE TSP TO MANAGE PROGRAMS


    work. They reason that because the work is new, there is no way to judge the time
    it will take to do it. Experience shows, how-ever, that this is not true. Even
    though the overall product may be new, a large percentage of the work will be
    similar to prior work. Therefore, if data on the product sizes and development
    times for this prior work are available, they can be used to help estimate the
    size and development time for the new product.


    In the launch meeting 9 plan presentation, your challenge is the reverse of that
    in meeting 1. With a highly motivated team, the principal risk now is that the
    team members will have produced a more aggressive plan than they can possibly
    meet. So, in meeting 9, probe the team’s plan and make the members prove that
    it is realistic and achievable. In examining plans, the principal pal risks concern
    the plan’s completeness and the realism of the size and resource estimates.


    When development groups make plans, unless they previously have made and worked
    to similar plans, they often omit key tasks, as final product build, integration
    testing, and product documentation. The biggest risk, however, is that motivated
    development teams often overcommit themselves. While it is appropriate to give
    the teams aggressive goals, after they have produced a plan and done their best
    to meet your goals, you must force them to defend their plans.


    The best strategy is to recognize that all plans assume that the work will proceed
    pretty much as planned. However, particularly with high-technology programs, surprises
    are common and surprises always involve more work. To allow for these surprises,
    ensure that the program plans are conservative and if nothing goes wrong, the
    work can be accomplished during normal working hours. Then, when the surprises
    come, the teams will have the reserve capacity to handle them. If you start with
    a team that is stretched to the limit, every change or surprise will be a disaster.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# ESTABLISHING AGGRESSIVE BUT REALISTIC PLANS 263


    Even if the plan does not meet your original needs, the key is to understand first
    what it really takes to do the job and then to address any cost and schedule problems.
    The TSP process provides three complementary ways to assess the likelihood that
    a development plan’s commitments are achievable: assessing the size, resource,
    and quality plans; balancing resources and schedules; and reviewing the plan’s
    risks.


    # The Product Size Estimate


    With the TSP’s estimating methods, the team gathers historical data on the sizes
    of similar previously completed products and uses these data to estimate the likely
    sizes of the new products. While size estimation is typically error-prone, experienced
    TSP teams rapidly accumulate a substantial volume of historical size data, and
    these data help them to make progressively more accurate estimates.


    In reviewing size estimates, the key concern is with the source and reliability
    of the size data and the likely confidence intervals for the resulting estimates.
    Statistically sound confidence intervals are typically available only for the
    smallest components that TSP teams develop, but TSP teams can provide informed
    judgments on the likely high and low size ranges for even large systems. From
    these ranges, you can explore the likely best-case and worst-case resource and
    schedule ranges for the program.


    # The Resource Estimate


    TSP teams are taught how to estimate product size and development time, and they
    are shown how to gather and use data on prior work to improve the accuracy of
    their estimates. They also learn the value of gathering data on the sizes of the
    products they develop and how long it took to develop them. Most developers are
    surprised by how predictable their development work'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'becomes once they have even a modest amount of personal and team productivity
    data.


    With historical productivity data, TSP teams can produce estimates that are more
    accurate than they have produced in the past. Therefore, to assure yourself that
    a development plan is accurate, ask about the data used to support the size and
    resource estimates. Have the teams explain what data they used, the projects from
    which the data came, and how similar those projects were to this new job. Then
    ask the developers about their confidence in the accuracy of the productivity
    figures they used in the estimate.


    # The Quality Plan


    It is also important to probe the quality plan and assure yourself that it has
    been competently prepared, is realistic, and presents suitable milestones and
    benchmarks for tracking. These topics are covered in the later section of this
    appendix on quality management.


    # Balancing Resources and Schedules


    With the plan, and still in launch meeting 9, the next issue is to balance the
    available resources to achieve the desired schedule. The key issue in making a
    program plan is the total effort required to do the work. Then, to achieve the
    desired schedule, you merely assign enough developers to the job. This of course
    assumes that all the developers can be used productively throughout the job. Deciding
    how many developers can be assigned to a management job, and determining how best
    to use them is the team''s job.


    If, in meeting 9, the team presents a schedule that is longer than you want, it
    will probably also have presented some alter-'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# ESTABLISHING AGGRESSIVE BUT REALISTIC PLANS 265


    nate plans that do meet your schedule but take more resources or produce a reduced-function
    product. The management question, then, is one of establishing priorities: Are
    there lower-priority jobs from which the needed resources can be obtained? In
    all of these discussions, it is important to recognize that the cost of the job
    will not be changed significantly by adding or reducing staff.


    For most development work, the cost of the job is determined by the required number
    of engineering months of work. For example, if the original request was for a
    12-member team to produce a product in 12 months and the team estimates 15 months,
    the costs are obviously more than hoped: 180 versus 144 engineering months. Now,
