  md: '# Preface


    The problems of managing software have probably been annoying, but they may not
    have seemed fundamental to your business. You may also have noticed, however,
    that the amount of software work in your business has been growing and that more
    and more of your people''s work now looks like software work. This means that,
    like many other executives and managers, you will soon find that an increasing
    amount of your people''s work will become as hard to manage as software. If that
    prospect doesn''t frighten you, it should.


    This book is for those senior executives and managers who run modern technology-intensive
    businesses. It describes what software work has always been hard to manage, why
    more and more work will soon be as hard to manage as software, and what you can
    do about it. As Robert Frost once said, “The best way out is always through."


    What Frost means is that dodging problems doesn''t work. You must dig into them,
    understand them, and then address them. The time has come to address these software
    management problems. That is the premise on which this book is based: Software
    work is manageable. To manage it, however, we must first understand why it has
    always been so hard to manage.


    The fundamental reason that software has been hard to manage is that it is a new
    and different kind of work. The management principles of the past are not suitable
    for software development. Software engineering is knowledge work, which is nothing
    like the traditional kinds of labor for today''s traditional management methods
    were developed. This book describes the knowledge-based management system that
    this'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'kind of work requires, the principles upon which it is based, how

    this new management system works, and how to introduce it

    into your organization.


    The management challenges of the future concern knowledge

    work and knowledge workers. In the past, your knowledge

    workers were primarily doing software engineering work, but

    now knowledge workers are increasingly involved in all aspects

    of your business. Software was the first large-scale knowledge-based industry,
    and its management problems are well known.

    Now, with knowledge work and knowledge workers pervading

    modern business, problems that used to be restricted to software

    groups are becoming common in most parts of every technology-based business.


    Knowledge work is not like other kinds of work, and its man-agement problems are
    unique. Recent research into manage-ment methods for knowledge workers has provided
    new insight

    to why software work has been so hard to manage. In fact, it is

    t special characteristics of software work, and in fact of all

    knowledge work and knowledge workers, that have made soft-ware projects so hard
    to manage. This new understanding has

    led to a new management system specifically tailored for know-ledge work and knowledge
    workers. When organizations use

    these new methods, they find that their software work is predict-able and manageable
    and that their people have more rewardingnand satisfying work lives. In addition,
    the quality and profitabil-ity of their products are greatly improved.


    Modern work in almost all technical fields now involves soft-ware, and it also
    involves design and development practices that

    are much like those used by software people. When the manage-ment methods described
    in this book are used, all forms of cre-ative work become more manageable. In
    addition, employee

    turnover drops, customers are more satisfied, and your people'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# PREFACE xvii


    are more creative. This, in turn, leads to more efficient ways of working, as
    well as to more attractive and profitable product offerings. This book describes
    these changes, gives examples of organizations that are working this way today,
    and outlines some of the benefits they have obtained.


    # BOOK ORGANIZATION


    This book is composed of nine chapters and five appendices. The nine chapters
    describe the new knowledge-working management methods, why they are required,
    and the principles that guide their introduction and use. The book’s five appendices
    address many of the questions that executives and managers have raised as they
    explore these concepts, conduct trial studies, and introduce the methods into
    their organizations.


    Chapter 1 describes the increasing pace of change in the modern marketplace and
    the threats that all organizations now face from an aggressive set of worldwide
    competitors. Chapter 2 addresses the bureaucraticatic problems of increasing corporate
    size and how modern knowledge-management methods can help to address them. Chapter
    3 describes the nature of knowledge work and how properly led knowledge-working
    teams can resolve many of the intractable problems businesses face today.


    Chapter 4 covers the principles and methods involved in managing knowledge work,
    and it explains how these management practices differ from those traditionally
    followed.


    With Chapter 5, the book switches from explaining what knowledge-work management
    methods are to discussing the challenges of introducing them. Chapter 5 addresses
    how to motivate knowledge workers to use these new management methods personally.
    Chapter 6 discusses how to build and maintain the disciplined and collaborative
    environment that knowledge-working teams need to consistently follow these practices.
    Chapter 7 covers'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'the new opportunities for dynamic decision making that become available with
    these data-driven knowledge-management methods, and Chapter 8 describes the critical
    nature of quality for knowledge work. Finally, Chapter 9 describes how to make
    this vision of the future come true in your organization.


    Following these nine chapters, the book''s five appendices provide more detailed
    guidance on introducing and using these management methods. Hundreds of organizations
    have now used them, and the appendices encapsulate the guidance we have found
    most effective in making their efforts successful. Because all organizations are
    different, and because many new and unfamiliar situations will arise, your management
    team will need substantial guidance in following the steps outlined in this book.
    The appendices contain answers to the most common questions and step-by-step guidelines
    on how to proceed.


    # READING THIS BOOK


    We suggest that you read the nine chapters in order. They present a logical sequence
    of concepts that builds a complete high-level overview of these management methods.
    Building on this conceptual background, the appendices provide a deeper level
    of information. They can be used as a reference or guideline for introducing and
    using the methods. The five appendices start by covering common questions, then
    trial introduction and piloting, and finally the broader issues of adoption and
    use. We suggest using this book in one of the following ways:


    +   You can read this book''s nine chapters to gain an overview of these knowledge-management
    methods, why they are needed, how they could help improve your organization''s
    performance, and how to introduce and use them.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '+   - You can use the book, particularly its appendices, to answer questions
    you might have had before deciding to introduce and use these methods.


    +   - Once you have decided to introduce these methods, your people can follow
    the guidance in the appendices to conduct pilot studies and to then introduce
    the methods broadly in your organization.


    # WHY WE WROTE THIS BOOK


    We first tried using the management methods described in this book in 1996. Since
    then, we have introduced them to hundreds of organizations with thousands of managers
    and developers. During this time, we have learned a great deal about how these
    methods can be used to address the many situations that arise in modern technology-intensive
    businesses. We have worked with organizations of every imaginable variety, and
    while no single book cover all of the issues of introducing and using these methods,
    we were able to encapsulate the most frequently encountered issues into a single
    moderate-size volume. This book is that volume.'
  merge: -1
