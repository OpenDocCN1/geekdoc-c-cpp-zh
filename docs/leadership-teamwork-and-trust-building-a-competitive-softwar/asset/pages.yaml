  md: 'answer all of the team’s questions. The team cannot conduct a fully successful
    project or produce a superior product unless launch meeting 1 fully addresses
    all of the team’s and management’s relevant issues and concerns.


    # Launch Meetings 2 through 8


    Meetings 2 through 8 will normally proceed without any management involvement,
    but management may be asked to clarify some issues. If the project goals do not
    appear to be achievable, the TSP coach and the team leader will seek management
    guidance on what to do. It is also normal for team members to have disagreements
    during the launch process. This is because the launch process makes the team’s
    goals and plans explicit, exposes assumptions, and builds a shared understanding
    among the team members. This cannot be achieved without surfacing differences
    of opinion. Management should not get involved in these discussions. If their
    help is needed, the TSP coach and the team leader will ask for it.


    # Launch Meeting 9—The Plan Presentation


    Meeting 9 is the inverse of meeting 1. Here, the team makes the presentation and
    management asks the questions. This meeting will likely be quite different from
    plan reviews that managers have previously attended. To prepare for this meeting,
    managers should remember that they chose to pilot the TSP because, as in most
    software organizations, most of their software projects have been late or over
    budget or failed to deliver the promised functionality. According to the Standish
    Group’s Chaos Reports for the past decade, only about one-third of all projects
    were able to meet all of their cost, schedule, and functional commitments. The
    other two-thirds were probably late the day they started. When did you find out
    that they were going to be late?'
