    # Organizational Considerations


    The TSP changes the way software teams work, which may necessitate some adjustments
    to other organizational systems. Concepts such as the self-directed team management
    style and the coaching role are probably new to your organization. Interfaces
    between the project team and other groups, such as quality assurance, test, process
    improvement, or the project office, may also be affected. These items are briefly
    described below. Additional information can be found in the later appendices.


    # TSP Management Style


    The TSP implements the concept of self-managed or self-directed teams, but not
    all elements of the self-managed work group are required. These are the notable
    differences between the TSP and a full implementation of the self-managed work
    group:


    +   - TSP teams are self-organizing within limits. Teams are to organize around
    the roles in the TSP, but the team or project leader is typically assigned by
    management.


    +   - The TSP requires team members determine, plan, and manage their own work;
    assume responsibility for product quality; track and report on project progress;
    and consistently'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'improve their performance. Management still establishes the goals and objectives
    for the team.


    +   - The TSP requires teams to negotiate their commitments with management. When
    a sound and reasonable plan suggests management’s objectives cannot be met, management
    has an obligation to work with the team to find a suitable alternative. Forcing
    a team to accept unreasonable commitments won’t work. While the TSP will dramatically
    improve cost and schedule performance, it won’t enable teams to achieve truly
    impossible commitments.


    +   - The TSP does not require any special approach for performance appraisals.
    In most of the TSP implementations, performance appraisals are still conducted
    by management.


    Here, we define an impossible commitment as one for which the team has been unable
    to build a plan to which all the members will voluntarily commit.


    # Organizing for the TSP: The Coaching Team


    The role of coach will be a new role for most software organizations. It is an
    extremely important, value-added role in the TSP. Good coaching helps to ensure
    project success. Poor coaching will almost guarantee that a project will not achieve
    the performance that is expected of a TSP team. Because coaches are such a valuable
    resource, you should consider establishing a new group or team with responsibility
    for providing TSP coaching services. This topic is discussed further in Appendix
    C.


    The TSP coaching team will be responsible for most aspects of the TSP implementation.
    Besides coaching, this includes planning, training, and many of the activities
    involved with transition and change management. Management must create, fund,'
