  md: '# Table D.2 TSP Quality Measures


    | Quality Measure | Measure Definition |

    |---|---|

    | Review yield | The yield of a project phase is the percentage of the defects
    in the product during the phase that were removed by the end of that phase. This
    measure is used for every defect-removal phase. |

    | Yield before test | Yield before test is the percentage of all the defects in
    the product that were removed before the start of final system testing. |

    | Review rate | This measures the rate at which the developers review or inspect
    a product. For example, if a developer took 10 hours to review a product of 988
    lines of code, the rate would be 98.8 LOC/hour. |

    | Appraisal-to-development ratio (A/DR) | A/DR measures the ratio of the time
    spent reviewing or inspecting (appraising) a product to the time spent developing
    that. A/DR can be calculated for a project phase, for any group of phases, and
    even for an entire program. |


    The yield-before-test measure provides an excellent overall measure of the quality
    of a development job. That is because testing removes only a fraction of the defects
    in a product, and a truly high-quality development process should remove all or
    most of the defects before the start of testing. TSP teams consistently yield
    values of 95% or more, and many reach yields of 99% and even 100%. In fact, in
    one study, one-third of the TSP teams had no defects found by their end users
    [Davis 2003]. The review-rate measure is useful in determining how effectively
    the developers performed a specific review or inspection step, but it is not as
    helpful in examining the overall quality performance of a team, a project, or
    an entire program. For that, the appraisal-to-development ratio (A/DR) is most
    useful.


    The A/DR measure compares the time spent praising the quality of a product with
    the time spent in developing it. This'
