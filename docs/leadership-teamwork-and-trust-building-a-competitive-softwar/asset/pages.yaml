    nThe Bureaucracy


    In Chapter I we introduced the two key challenges facing modern businesses: managing
    their growing size and managing knowledge work. In this chapter, we talk about
    the first issue, managing and controlling a growing business. Here, the principal
    concern is the tension between the flexibility and innovation required by technological
    change and the bureaucratic procedures needed to operate a growing business.


    # WHY ORGANIZATIONS NEED A BUREAUCRACY


    As organizations grow, they must build bureaucracies to help run the business.
    These bureaucracies are usually hierarchically structured and operate in accordance
    with defined rules and procedures. While bureaucracies are often viewed as cumbersome
    and destructive, they are a necessary part of any but the smallest businesses.
    However, they must be properly constituted and managed or they will generate delay
    and inefficiency. The reason is that, like human scar tissue, bureaucratic procedures
    offer protection, but they can also limit speed and flexibility.


    The fundamental purpose of the bureaucracy is to handle the operational details
    of the business automatically. When properly run, it can save senior managers
    time and allow them to focus on the core parts of the business. For example, the
    bureaucracy can routinely handle such tasks as operating the cafeteria; keeping'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'the facilities clean and comfortable; handling payroll, billing, and managing
    all the other daily details of the business. A bureaucratic management style in
    these areas rarely impacts the core areas of the business. However, bureaucratic
    procedures can become troublesome when they involve more critical activities.
    The following example illustrates how this can happen.


    # THE SOFTWARE CRISIS


    The company’s software work had always been troubled, but it was now too big and
    deeply involved in the business to ignore. The software department had always
    been late delivering its programs, and many of the company’s products were now
    missing their schedules because of software problems. This group was in so trouble
    that the VP fired the software director and asked Brandon to take over. His job
    was to get the software operation under control.


    Brandon visited the largest three of his development groups and found that nobody
    had good plans or schedules. While everybody was working hard, the operations
    were chaotic and out of control. Brandon decided to cancel all existing schedules
    and require every software group to produce detailed plans for his work. He would
    review and approve the plans and personally make all future commitments. After
    the VP approved this recovery plan, Brandon issued a directive to his managers,
    telling them to produce detailed plans for all of their projects and to review
    them with him within 60 days. He rejected the first few plans, his people soon
    learned what was needed and the plans got much better. Brandon then issued a new
    set of commitments based on the reviewed and approved plans, and the group started
    delivering products on schedule.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# THE SOFTWARE CRISIS 17


    Brandon’s review system worked reasonably well as long as he was able to review
    every proposed commitment and to check the quality of the supporting plans personally.
    However, as the organization grew, the reviews took too much time, so he initiated
    a staff review system. The objective was to address the most common problem he
    had found in the plans: that activities were often missing. For example, the project’s
    costs might not be covered in the budget; key requirements might be omitted; testing,
    maintenance, or field support might be left out.


    He addressed this problem by having each plan reviewed by representatives of all
    the key departments before that plan could be brought to him. This worked, and
    he no longer had to make a thorough personal review of every plan. Within a year,
    however, the marketing and support groups realized that they had leverage they
    never had before. They started withholding approval until their special needs
    were addressed. Marketing would haggle over pet features, service would object
    to the number of deferred defect fixes, and testing would argue about the resources
    they would need. By the time these problems had gotten severe, Brandon had been
    promoted and the review system was an entrenched part of normal business. The
    new director did not recognize the problems or what had caused them, so it never
    occurred to him to abandon or change the review system.


    While the original objective of Brandon’s review system was laudable, it became
    a bureaucratic procedure, and, like many such procedures, it was so misused. Bureaucrats
    have considerable power within their narrow scopes of authority, and they can
    be very demanding and even unreasonable. The essential problem was that Brandon
    was using a bureaucratic procedure as a mechanism to force his people to do their
    jobs correctly.'
