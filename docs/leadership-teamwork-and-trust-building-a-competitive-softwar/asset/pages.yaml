  md: '# Launch Meeting I


    In the first meeting of the TSP launch, management communicates its expectations
    for the project to the team. They tell the team what they want, including the
    business and product objectives; the definition of a fully and minimally successful
    result; schedule, budget, and resource constraints; and customer competitive issues.
    This meeting sets the tone for both the launch and the project, so it is important
    that each manager be adequately prepared to fulfill his or her role. When teams
    understand management''s objectives, they are more likely to devise plans that
    lead to successful business and technical outcomes. In making the plan, the team
    and all its members make a commitment. For them, this is a serious undertaking,
    and they will be spending many months of their time and energy striving to accomplish
    this plan. Without proper management preparation, these teams will not fully understand
    management''s needs, and they will then be unlikely to do a superior job. That
    is why adequate management preparation for launch meeting 1 is so important.


    The initial TSP pilot projects are also intended to guide the implementation and
    evaluation of the TSP. When preparing for meeting 1, managers should also consider
    this purpose and stress the importance of team ownership of the plan and the process,
    of gathering data, of self-management, and above all of doing quality work. The
    managers should work with the TSP coach to define quality objectives that can
    be measured and tracked throughout the project and then incorporate these objectives
    into the meeting 1 presentation.


    Meeting 1 will probably take longer than expected. The team may ask more questions
    than anticipated or the product briefing could take longer than planned. Managers
    should keep their schedules flexible so that they can complete the meeting and'
