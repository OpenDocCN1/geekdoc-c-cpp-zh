    photography. Similarly, Texas Instruments invented many of the methods used in
    developing and manufacturing integrated circuits, but TI no longer leads the semiconductor
    industry. The reason organizations are often surprised by technologies they already
    know is that they refuse to accept the implications of what they know.


    For example, IBM management knew very well that the personal computer was coming
