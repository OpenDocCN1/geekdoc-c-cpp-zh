    # THE QUALITY TRANSFORMATION


    To improve product quality, sharply reduce testing time, and cut costs, your software
    developers must follow a quality strategy like shown in Figure 8.6. In each development
    phase, the developers perform an activity such as requirements development, design,
    or code or build. During the development part of each phase, they typically inject
    defects. Following this development step, each developer then reviews his or her
    work products to find and fix as many defects as possible. After completing this
    personal review, the developer asks a team of other developers to thoroughly inspect
    the product to find as many defects as possible. Only after each product has been
    reviewed and inspected is it considered ready for the next development phase or
    for release to testing.


