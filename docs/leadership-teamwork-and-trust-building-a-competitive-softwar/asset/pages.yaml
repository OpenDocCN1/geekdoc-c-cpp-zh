  md: 'for two reasons. First, there is a long record of mistrust between management
    and workers, and this has been true throughout human history. The reason is that
    bosses have been getting people to do their bidding for millennia, and for most
    of this time, the principal motivator was fear. Slavery was common and the most
    prevalent form of persuasion was a threat. However, during the industrial era,
    managers started to use greed as the principal motivator. While greed is a crass
    way to describe salary, bonus, and quota systems, systems assume that people would
    always like more pay for their work. They can therefore be viewed as greedy. Traditional
    payment systems are based on conflict: The bosses want more for less pay, and
    the workers want more pay for less work. Because conflicts breed distrust, there
    is a natural level of distrust between workers and managers.


    This motivation issue is important because recent studies have shown that traditional
    motivational methods are not effective for knowledge work. For example, some things
    that should obviously work, don''t, and other methods that seem nonsensical are
    actually quite effective. An example of the latter case is open-source programming.
    Why would skilled people put in long hours to produce high-quality products for
    no pay? But this is now a common way to develop some kinds of software, and many
    people spend a lot of their time working for nothing.


    A similar question about the effectiveness of bonus payments was raised by a recent
    study conducted by economists at MIT, the University of Chicago, and Carnegie
    Mellon University [Ariely 2009]. The researchers studied the effect of various
    bonus-payment levels on the performance of several kinds of simple tasks. Some
    of these tasks included modest intellectual effort and others did not. They even
