  md: 'The following seven points are made in this chapter:


    +   1. Knowledge work is now an important part of your business, and it will be
    much more important in the future.


    +   2. The current performance of knowledge-working groups in most organizations
    is unsatisfactory. The most common examples of these problems are the software
    groups.


    +   3. The solution to knowledge-working problems requires that most organizations
    significantly change their management culture and style.


    +   4. Management culture and style cannot be changed by lower-level managers;
    that must be done by senior executives.


    +   5. When properly guided and motivated, knowledge-working teams can resolve
    some business issues more quickly and effectively than anyone else in your organization.


    +   6. When properly trained, led, and motivated, your knowledge-working teams
    can be highly creative and productive partners in running your business.


    +   7. Your knowledge-working teams soon will be your most important single asset;
    treat them as such.


