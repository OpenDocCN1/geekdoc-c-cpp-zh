    # THE NEED FOR TRUST


    To build trust, we must start with the assumption that everybody would like to
    do his or her job properly. With knowledge work, trust is a key part of making
    improvements, fixing problems, and doing great work. Often the knowledge workers
    themselves are the only ones who know enough to do any of these things. An untrusting
    culture is threatening. When their livelihoods and careers are at stake, people
    are often reluctant to take risks or to step out of line. Unless your people are
    willing to be different and to challenge the status quo, they are unlikely to
    make creative innovations, champion revolutionary changes, or produce great products.


    This means that unless your people management not to punish them for mistakes,
    like the child who broke the cookie jar, they are not likely to speak up or take
    risks when they have creative ideas or see something they feel should be changed.
    A blame culture is often the key reason for lack of trust. While changing this
    culture may seem difficult, it is remarkably simple. All you need to do is to
    emulate Admiral Rickover did when he established the U.S. Navy’s Submarine Service.
    He directed his officers and crew to investigate all safety incidents on all nuclear
    submarines, to determine their causes, and to report the corrective actions to
    his office. Thereafter, every related incident on every U.S. nuclear submarine
    was investigated by a captain’s mast in which all involved officers and crew members
    participated. Everyone knew that a nuclear incident at'
  merge: -1
  pgno: 79
- img_proc: true
  md: '100 fathoms would likely be fatal, and everyone strove to be objective and
    to find and fix whatever problems they could.


    Rickover established an objective fact-based culture throughout the nuclear fleet,
    but it took leadership from the top. While he insisted that his people take responsibility
    for their own work, he also recognized that all humans make mistakes and that
    the need is to objectively understand why problems occur and to fix the causes
    and not to fix the blame. To this day, the U.S. Submarine Service has a remarkable
    safety record. A retrospective analysis of the Submarine Service’s contributions
    to the cold war said the following [Sieff 2007]:


    +   U.S. submarines outperformed the Soviet ones in the crucial area of stealth,
    and Rickover’s obsessive fixation on safety and quality control gave the U.S.
    nuclear Navy a vastly superior safety record to the Soviet one. This was especially
    crucial as in a democratic society, particularly after the Three Mile Island nuclear
    power station crisis in March 1979, a host of nuclear accidents and well-publicized
    near misses could have shut down the nuclear fleet completely.


    An achievement like that of Admiral Rickover’s Submarine Service can be made only
    by people who work in a trusting environment. Once you establish the proper management
    culture, the second part of building trust is helping your people to become trustworthy.


    # TRUSTWORTHY KNOWLEDGE-WORKING TEAMS


    Unless your people are trustworthy, it would be irrational to trust them. Today,
