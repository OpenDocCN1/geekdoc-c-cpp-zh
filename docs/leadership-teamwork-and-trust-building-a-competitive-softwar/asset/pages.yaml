  md: 'environment and trustworthy workers. The third principle is for management
    to rely on facts and data rather than status and seniority when making decisions.


    The way you make decisions is, in some respects, another aspect of trust. Upon
    what sources of information do you rely when making decisions? In the traditional
    management culture, the flow of information is hierarchical, just like the management
    pyramid. This means that you typically hear what your senior managers believe,
    and their beliefs are based on what they have learned from their lieutenants.
    Information from the lowest-levels of the organization has thus been filtered
    through many layers of management before it reaches you. However, as even a simple
    parlor game will show, it is nearly impossible to communicate accurately through
    multiple people.


    In a knowledge-working organization where the working-level troops have the deepest
    understanding of technical issues, the information pyramid is inverted. And your
    top executives and managers know the least and the workers themselves are best
    informed. While management has vastly more knowledge and experience on most business
    issues, many of the key decisions that currently affect modern businesses involve
    technical judgments. Unless you can base your judgments on the best available
    information from all sources, your decisions are unlikely to be sound. This topic
    is discussed in Chapter 7, where we describe how the TSP can help you and your
    management team make the best use of the facts and data potentially available
    from your working-level knowledge professionals.


    # QUALITY MUST BE THE TOP PRIORITY


    You might wonder why quality is listed as one of the principles to consider in
