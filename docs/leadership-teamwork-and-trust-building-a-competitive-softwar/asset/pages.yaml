  md: '# 8


    # Managing Quality


    At several points in this book, we have said that quality must be your top priority,
    but we have not yet explained why. This chapter explains why quality is critically
    important to you and to your business. It also describes several additional quality
    topics and shows how effective quality management impacts the bottom line. While
    much of this discussion addresses software quality, the principles, methods, and
    practices described here apply equally well to all forms of knowledge work.


    # MAKE QUALITY THE TOP PRIORITY


    We develop two key points in this chapter:


    +   1. An effective quality program can save a lot of money.

    2. If the quality program doesn''t save money, it is not being managed properly.


    A third point, which is part of every topic we discuss in this book, concerns
    measurement. If you don''t measure something, you cannot manage it, and if you
    don''t manage something, it will not improve. Because few people measure quality,
    most quality improvement programs are just motivational talk and produce no meaningful
    benefits. This is why any serious quality program must start with measurement.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# The Cost-of-Quality Measure


    For most businesses, the principal reason for managing quality is economic; poor-quality
    work is enormously expensive. Dr. J. M. Juran, one of the all-time greats of the
    quality movement, defined a businesslike way to measure quality [Juran 1999].
    It is called the cost-of-quality (COQ) measure, and it provides a way to measure
    what poor-quality work costs a business. According to the COQ measure, quality
    costs have four components:


