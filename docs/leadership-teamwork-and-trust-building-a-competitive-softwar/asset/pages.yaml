  md: '# 5

    Motivating Knowledge Workers


    This chapter is about motivating knowledge workers to manage themselves. However,
    because these workers are generally highly motivated, the principal thing we need
    to do is to provide them with self-management skills and convince them that managing
    themselves will help them to better do what they already want to do. Also, of
    course, we must consider what they want them to do. The key, then, is aligning
    your objectives and those of the workers and then guiding and supporting them
    as they strive to meet these common objectives.


    # MANAGEMENT AND WORKER OBJECTIVES


    In simplest terms, you want your knowledge workers to do high-quality creative
    work on predictable schedules and minimum costs. Because these workers also participate
    in project teams and work for a manager, you also want them to be cooperative
    and effective team members, to consistently meet their personal and team commitments,
    and to keep management informed of their progress. Unfortunately, this is not
    what knowledge workers typically want to do.


    One study of programmers concluded that management’s and knowledge workers’ objectives
    are actually in conflict [Linberg 1999]. Typically, the knowledge workers felt
    that their projects were successful if they were technically challenging, the'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'final product worked the way it was supposed to work, and the team was cohesive
    and high-performing. Cost or schedule commitments simply were not a primary concern.


    Conversely, managers viewed projects as successful if the teams met their cost
    and schedule objectives, whether or not the project was technically challenging
    or the team was cohesive and high-performing. Because these views are in conflict,
    the key question is, “Can we somehow align management’s and the knowledge workers’
    objectives?” While the short answer is yes, the ways to accomplish this are not
    obvious.


    # THE NATURE OF TEAM MOTIVATION


    Linberg’s study underscores the widely held perception that knowledge workers
    don’t care whether or not they meet their cost and schedule commitments. But this
    is not what we saw with the team in Chapter 3. That group of 30 professionals
    overcame all kinds of challenging problems to deliver a quality product on schedule.
    Similarly, the Softtek and Quarksoft teams that were mentioned in Chapters 1 and
    2 have been consistently delivering quality products on schedule for years. What
    is different about them?


    The difference is team goals. Think of a basketball team. There is nothing particularly
    exciting about putting a ball through a hoop, but these teams make extraordinary
    efforts to do just that. Their energy, excitement, and enthusiasm are infectious,
    and they electrify entire arenas with thousands of cheering fans. What is infectious
    is meeting a team goal. Exactly the same thing is true of knowledge-working teams.
    The key to motivating such teams is to have them establish a challenging and motivating
    team goal and then work hard to meet it.


    The reason that most software developers don’t seem to get excited about meeting
    cost and schedule commitments is that'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# THE NATURE OF Team MOTIVATION 67


    these usually are not team goals. Although management may think cost and schedule
    are important, typically no one ever tells the team why these goals are important,
    and the team isn''t involved in making the commitments. As far as typical software
    teams are concerned, management makes the cost and schedule commitments, and the
    teams meet if they can. In fact, the teams often think that management’s requested
    commitments are totally unreasonable, but because they are paid to do what management
    asks, they give it the old school try.


    Typical software teams get excited about delivering great products and having
    a cohesive team experience because these are the tacit goals of every member,
    and the team doesn''t even have to discuss them. In fact, teams rarely discuss
    goals at all; most knowledge-working teams just start working. There is no team-building
    effort, no discussion of team goals, and the team is just told, “Here is your
    next job and it has to be done in nine months.” Many knowledge workers find out
    that they are on a project team by getting an e-mail or being told by their manager:
    “Your next job is Project XYZ; call Pete.” Like so many cattle, they are just
    herded into one project chute or another.


    The way to get your knowledge-working teams excited about and committed to meeting
    your goals is to empower them to set their own goals and, while doing this, to
    adopt your goals as part of their team goals. This is an executive and senior
    management issue because empowering people is a culture question, and an organization’s
    culture can be changed only from the top. Other people can teach the required
    techniques and methods, but it is up to you to make this empowerment culture a
    corporate goal and to lead your management team in building and maintaining it.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# THE KNOWLEDGE-WORKING CULTURE


    The fundamental reason to change the organization’s culture concerns the first
    of the five principles for managing knowledge work that we described in Chapter
    4: Management must trust knowledge-working teams to manage themselves. This is
    essential because of the fundamental nature of knowledge work and knowledge workers:


    +   - Only the knowledge workers know exactly what they are doing and how they
    are doing it.

    - Because knowledge work is invisible, no one else, including the managers, can
    understand what the knowledge workers are doing or how they are doing it.

    - Because it is impossible to manage effectively work that you do not understand,
    no one but the knowledge workers can manage knowledge work.

    - Therefore, if the knowledge work is to be managed, the knowledge workers must
    manage themselves.

    - When the knowledge workers do not manage themselves, their projects generally
    are troubled or end up as total failures.


    You may accept these facts, but many managers would not. They would say that they
    can and manage the knowledge workers in their organizations. While these managers
    may assign jobs, set schedules, and report to higher management, they do not do
    the one thing that you really need them to. They do not get their teams to consistently
    produce quality products on committed schedules and for their planned costs. These
    managers can tell the knowledge workers what to do, but they have no way to know
    whether or not the workers actually did what they were told to do.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Assuming that you don’t want your critical projects to continue being troubled
    or failing, you and your management team must do something different. We suggest
    that you teach your knowledge workers how to manage themselves and trust them
    to do so. The appendices to this book will guide you and your people in accomplishing
    that objective.


    # THE ELEMENTS OF TRUST


    There is a big difference between trust and blind faith. President Ronald Reagan
    had an apt description for how he dealt with the Russians: “Trust but verify.”
    There is another line from W. Edwards Deming that says much the same thing in
    a way that applies more directly to technical work: “In God we trust; all others
    bring data” [Davenport 2007].


    For people to be truly trusted, they must be trustworthy. Unfortunately, with
    knowledge workers, this is a nontrivial challenge. After all, as demonstrated
    by the dismal history of software engineering, these knowledge workers have consistently
    failed to meet their commitments, so how can they possibly be trustworthy? The
    TSP addresses this problem by guiding, coaching, and supporting knowledge workers
    in consistently managing themselves.


    A decade of experience with the TSP shows that when they manage themselves, knowledge
    workers can consistently deliver quality products on schedule and for their planned
    costs. However, before they can manage themselves, they first must be trained
    in the skills of self-management. They must also want to manage themselves. Therefore,
    the management challenge is to convince the knowledge workers that they want to
    manage themselves. This is difficult because knowledge workers are skeptical and
    will not truly believe that self-management will help them until they have tried
    it and found that it actually works.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# CHAPTER 5 MOTIVATING KNOWLEDGE WORKERS


    This presents us with a chicken-and-egg problem. Knowledge workers will manage
    themselves only if they believe that doing so will help them to do better work.
    However, they will not believe that managing themselves will help them to do better
    work until they have actually tried managing themselves. Our challenge is to convince
    skeptical and very smart knowledge workers to try doing something they initially
    do not believe help them.


    # THE START-UP PROBLEM


    Once an organization has used the TSP on several projects and word of its benefits
    has spread, knowledge workers will be more receptive to the idea of managing themselves.
    Many may even ask to be trained in the TSP methods. Initially, however, and until
    the TSP becomes standard industry practice, all organizations will face the start-up
    problem. One approach to this problem is to put the knowledge workers in a course
    where they learn to manage themselves while doing a project. However, because
    projects typically involve several people and take a substantial amount of time,
    this is rarely practical.


    The other strategy is to break the convincing process into two steps. The first
    step is to teach the knowledge workers the basic skills needed to start managing
    themselves, and the second step is to have them use these skills on a real company
    project. This strategy has one big advantage. It means that most of the training
    time doesn’t cost anything because the knowledge workers are learning while they
    are doing their regular jobs. However, this strategy also has two potential issues.


    The first issue is that the knowledge workers must spend enough time in training
    to learn the basic skills of self-management. Not only must they be willing to
    spend this time, but their managers must also be willing to invest the time and'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'money to get them trained. The required training time is only about a week
    or two, so this objection can be overcome easily once you decide to adopt these
    knowledge-working methods.


    The second issue is that after training, you can''t use unimportant faraway projects
    as training vehicles for the knowledge-working teams because such projects are
    usually canceled before they finish. Furthermore, even if the projects were not
    canceled, nobody would take the results seriously. Therefore, the training must
    be done on real projects that will serve as useful examples, not just for the
    knowledge workers but also for the rest of the organization.


    To address these issues, we suggest that you convince yourself that the possible
    outcomes are worth the risks. The best way to do this is to review the results
    that other organizations have obtained from using the TSP and then determine if
    it would be a sound business risk for your organization. Appendix A provides data
    on the results many organizations have obtained using the TSP.


    # SELF-MANAGEMENT TASKS


    The TSP strategy for convincing knowledge workers to manage themselves is to put
    them on teams that actually manage their own projects. This means that they must
    make their own plans and schedules; negotiate their cost, schedule, and quality
    commitments with management; track and manage their work; and regularly report
    project status to management. To provide them with the skills to do these things,
    knowledge workers are given basic training in the Personal Software Process (PSP).


    Basic PSP training teaches professionals the fundamental skills they must know
    to participate on a TSP team. Advanced PSP training can also be helpful but it
    is not required. The skills are required are the following:'
  merge: -1
  pgno: 93
- img_proc: true
  md: If knowledge workers are to plan a project accurately, they must estimate the
    sizes of the products to be produced, estimate the time needed to do each part
    of the job, devise their strategy for producing a quality product, and define
    the process they will use
  merge: -1
  pgno: 94
- img_proc: true
  md: '# MAKING COST, SCHEDULE, AND QUALITY PLANS 73


    to do the job. PSP training requires developers to write a small number of programs,
    and while doing this, they follow the defined PSP process that guides them through
    all of the steps required to build self-management skills.


    In advanced engineering work, even though we are developing new products, much
    of our work is similar to things that we have done before. This means if we know
    how long a previous job took, we should have a pretty good basis for estimating
    how long the new job will take. However, this is where the wide variation in knowledge-worker
    productivity comes in. Performance data from one knowledge worker is not of much
    help in estimating the performance of another, so each knowledge worker must have
    data on his or her personal work. With such productivity data and an estimate
    of the product size, each developer can easily calculate the estimated development
    time for his or her part of the project.


    For example, if a developer has a historical productivity rate of 20 lines of
    code per hour and estimates that the new product will have 1,000 lines of code,
    the work will likely take about 50 hours. This is a pretty good estimate because
    productivity rates for individual knowledge workers remain relatively constant
    for similar work. The problem, however, is that size estimates are typically much
    more prone to error.


    # Estimating Product Size


    Few knowledge workers have learned how to make size estimates or have much experience
    making such estimates. When they must make estimates, they merely guess at the
    size of the overall product. Although all estimates are guesses, simplistic size-estimating
    practices tend to overlook functions, judge other functions to be simpler than
    they actually are, or omit key functions like error detection and recovery.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'To address this problem, PSP provides developers with a statistically based
    estimating method called PROBE (PROxy Based Estimating). PROBE teaches developers
    to consider their products as composed of parts and to estimate the size of each
    part. The part estimates are then added to produce a size estimate for the entire
    product. PROBE also requires developers to measure the actual sizes of these parts
    after they have been developed. With data from just a few products, developers
    have enough size data to make accurate estimates for new parts. There are three
    reasons that PROBE estimates are more accurate than just guessing:


    +   1. Breaking their products into parts and estimating the size of each part
    reduces the likelihood that developers will omit key functions.

    2. Using historical data increases the likelihood that estimates are unbiased.
    That is, the estimates are just as likely to be high as Low. PSP training sharply
    reduces bias.

    3. When multiple unbiased estimates are combined, their errors tend to cancel
    each other, providing a more accurate total.


    The third reason is somewhat helpful for individual estimators, but it can substantially
    reduce the overall error in team estimates, assuming that all team members use
    the PROBE method.


    # Making a Quality Plan


    When knowledge workers have data on the quality of their work, they can also estimate
    how many defects their finished products are likely to contain. A project’s quality
    plan specifies the number of defects that knowledge workers think they will inject
    and remove from the product in each step of the process as well as the number
    that are likely to remain in the finished'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'product. During PSP training, developers learn how many defects they typically
    inject during various project phases, and they also learn that no matter how hard
    they try, they will always make at least a few mistakes.


    Although defect injection and removal rates vary widely among developers, the
    rates remain relatively constant for individuals as long as they continue following
    the same practices. In PSP training, developers learn three very important things.
    They learn that their defect-injection rates are relatively constant, allowing
    them to make reasonably accurate quality plans. They also learn about the kinds
    of mistakes they make most often, enabling them to better find and fix the defects
    in their own products. Finally, and most important, they learn how to rapidly
    and efficiently remove defects from their products. We discuss this topic in Chapter
    8.


    Developers use the project''s size estimate and their own defect data from prior
    projects to estimate how many defects they are likely to inject and remove in
    each development step and to calculate the number of defects that are likely to
    remain in the finished product. A development team can then combine the individual
    estimates to produce an overall quality plan for the project.


    # RECORDING DATA


    If they are to earn management’s trust, knowledge workers must master the first
    skill required to manage themselves: making accurate cost, schedule, and quality
    plans. However, to do this, they must have personal data. This means they must
    master the second of the four skills needed for self-management: accurately recording
    data on their personal work. Knowledge workers need this data, not to give to
    management or anyone,'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 76 CHAPTER 5 MOTIVATING KNOWLEDGE WORKERS


    but to use in making personal plans and for managing and tracking their personal
    work.


    This is the key factor that motivates knowledge workers to gather data. Once they
    know how to plan and are convinced that accurate planning is important to them
    personally, they also know that they must have data. Once knowledge workers are
    motivated to gather data, all they need is a clear definition of the kinds of
    data to gather and a support tool to make data gathering reasonably quick and
    efficient. In PSP training, developers learn how to define, gather, and use the
    time, size, schedule, and defect data they need to make accurate plans, and they
    gain experience using a basic data-gathering tool.


    # USING AN OPERATIONAL PROCESS


    The third of the four things that knowledge workers must do to be trusted to manage
    themselves is to use an operational process. This is essential, for without the
    guidance of an operational process, people are rarely able to do complex tasks
    consistently and correctly. Then the knowledge workers would not likely gather
    and use all of the required data, they would be unable to make accurate plans,
    and management would not trust them to manage themselves.


    # Organizational Processes


    There is a great deal of confusion about what a process is and why an organization,
    a team, or an individual should follow. The two principal kinds of processes in
    the software field are organizational processes and operational processes. The
    most common organizational processes in software have been developed to satisfy
    the CMMI level criteria (Chrissis 2007).


    These processes can be very helpful, but we saw in Chapter 2 that they can also
    cause problems if they are not properlyimple-'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'mented. Brandon established a clear set of checkpoints for measuring and managing
    project progress, and this helped him to gain control of his large software organization.
    But the approach he used had two drawbacks:


    +   1. First, the way Brandon managed the organizational process resulted in a
    cumbersome and ultimately counterproductive enforcement bureaucracy.


    +   2. The second and more general drawback is when people are required to follow
    any demanding process, they are tempted to take shortcuts.


    CMMI provides an example of the pitfalls of taking shortcuts. Because many organizations
    had to be rated at CMMI level 3 or above to compete for U.S. Department of Defense
    business, there was a strong temptation to focus on process compliance rather
    than on process performance. An organization might find it easier to produce data
    that showed that the process was being used when it was not being used effectively.
    This approach is ultimately self-defeating because, although the organization
    may get some additional business in the short term, it will have wasted a lot
    of time, effort, and money in implementing the organizational process without
    realizing the potential performance benefits. Ultimately, the organization’s customers
    will recognize the company’s specific CMMI rating was not providing the desired
    benefits and switch their business to a competitor.


    # Operational Processes


    While organizational processes are typically used to guide the management of an
    enterprise, operational processes are used to guide people as they do their work.
    Many of the larger organizational'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'processes are also intended to guide individuals’ work, but they are often
    contained in cumbersome procedural documents that are filed away and consulted
    only occasionally. As a consequence, organizational processes are generally followed
    only when some enforcement procedure like Brandon’s phase review system requires
    that they be used.


    Conversely, an operational process is meant to guide people when they are doing
    their work. These processes are designed to guide very very specific tasks, such
    as using PROBE to make a development plan, and they are written in action-oriented
    language that is easy to understand and follow. Furthermore, while the larger
    and more cumbersome organizational processes frequently contain a lot of tutorial
    and explanatory material, operational processes do not. When properly designed,
    an operational process assumes that the users understand the job, know how to
    do it, and just need the process as a tool to help them do every step properly
    and in the correct order.


    # The Benefits of Operational Processes


    The best-known operational processes are those used by airline pilots for doing
    preflight checks. Another example is checklists used by some hospitals to guide
    medical procedures. Dr. Peter Pronovost of the Johns Hopkins Medical Center ICU
    traced the source of an infection to failure to properly perform the IV procedures
    every time they were used [Henig 2009]. He devised a five-step IV checklist and
    charged the nurses with ensuring that it was always followed. He also made sure
    that the hospital supported the nurses whenever they got into disagreements with
    the doctors. This operational process was credited with cutting infections from
    11% to 0%, eliminating 43 infections, preventing eight deaths, and saving $2 million.
    The results of using a checklist to guide surgical procedures at'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'eight hospitals were even more dramatic [Gawande 2009]. This process was more
    complex, so the checklist had 19 steps. In this case, surgical complications dropped
    by 36%, and deaths were reduced by 47%.


    When people perform even a simple task, they tend to forget or skip steps, and
    their results are often substandard. As processes become more complex, process
    discipline is generally poor, so it is not surprising that for larger and more
    extensive process compliance is almost inevitable. That is, it is inevitable unless
    the practitioners know precisely what to do, have a well-designed operational
    process to guide them, and are motivated and supported to precisely follow this
    process.


    Although it may not immediately be obvious which software engineers should precisely
    follow a defined process, it is the only way that they can consistently produce
    quality products on their committed schedules and for their planned costs. The
    discussions in subsequent chapters make it clear why and precisely following a
    well-designed operational process is essential to the success of knowledge-working
    projects.


    # TRACKING AND REPORTING PROGRESS


    The fourth and final thing that knowledge workers must do to be trusted to manage
    themselves is to accurately and regularly track and report their project’s progress.
    This is an important part of building and maintaining trust. Because software
    developers, or any knowledge workers for that matter, generally have no clear
    or precise measures of project status, they usually have nothing to report. As
    a result, they typically don’t say anything, at least not until they are in trouble
    and need help.


    What this means is that most knowledge workers don’t see their management until
    their projects are in trouble, which they'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'typically don’t know until it is too late for management to help them. This
    means that when the managers don’t hear from their people, they soon become nervous
    and start asking questions. When the knowledge workers can give them only vague
    answers, the managers become even more nervous. As this cycle continues throughout
    the project, it becomes almost impossible for the managers to trust their knowledge
    workers, and the knowledge workers become increasingly reluctant to openly and
    honestly share information with the managers.


    Before managers can trust their knowledge workers, they need free, open, and clear
    communication with them. In turn, this requires that the knowledge workers do
    four things:


    +   1. Track project status.

    2. Measure project status.

    3. Describe project status.

    4. Report project status.


    # Tracking Project Status


    For many types of work, it is fairly easy to check on project status. This is
    because most jobs consist of multiple steps that must be done in a prescribed
    order. When building a house, for example, you must complete the foundation before
    you can start framing. Then, after framing and enclosing the structure, you must
    install the wiring and plumbing before you complete the walls and painting. To
    check on project status, you just need to look at what has been done. Likewise,
    the simplest way for knowledge workers to determine their project’s status is
    to compare the tasks they have completed with the tasks that were supposed to
    be completed at a given point in the project.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Measuring Project Status


    However, to know and describe their project’s status with any precision, knowledge
    workers must have detailed plans. If, for example, their plans are like those
    for most typical software projects, they have only four steps:


    +   1. Complete the requirements.

    2. Produce the design.

    3. Write the code.

    4. Test the product.


    While the developers may do their work in this order, each of these tasks typically
    takes many months to complete, and the tasks generally overlap. For example, on
    a one-year project, the original plan might have been to complete the requirements
    in one month, but the requirements are not actually completed until final testing
    starts or even later. As a result, the developers usually identify aspects of
    the job that have reasonably firm requirements and start designing them after
    the first month or so of requirements development.


    Similarly, the coding work often starts well before the design is done, and testing
    starts before coding is done. Often, in fact, none of these four typical tasks
    is completed until the final few months of the job. This means to have any idea
    of where they stand, the knowledge workers need much more detailed plans. These
    detailed plans should contain tasks that have precise completion criteria and
    can be done in a relatively short amount of time. Examples of such tasks are


    +   - Module XYZ design completed and submitted for team inspection'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# 82 CHAPTER 5 MOTIVATING KNOWLEDGE WORKERS


    +   - Module XYZ inspection completed and defects corrected

    - Module XYZ coded and unit-tested


    These are specific and measurable tasks, but they may not be precise enough to
    give a good picture of project status. The reason is that each of these tasks
    could take several weeks to a month or more to complete, depending on the module’s
    size. This means that knowledge workers would know the task’s status within the
    range of a month or more. To address this issue, the PSP shows knowledge workers
    how to measure the time they spend on their personal tasks in minutes, and the
    TSP calls for the tasks in detailed plans to be broken into subtasks that take
    no more than 10 hours each. This means that knowledge workers who are using the
    TSP can tell their job status to within 10 hours.


    # Describing Project Status


    Describing job status for knowledge work is much more difficult than for, say,
    home construction. The reason is that knowledge work is far more varied and flexible.
    On a software project, for example, the developers may start on the high-level
    design and find that they must know precisely how some function will work before
    they can proceed. So, they switch to detailed design, coding, and testing to complete
    this module and get the needed information. Then they switch back to high-level
    design work [Kurtis 1988].


    This means that the tasks in the project plan are often completed in an order
    that is quite different from what was originally planned. To account for this
    variation, the PSP shows knowledge workers how to use earned value (EV) to describe
    their project’s status. With EV, each project task is given a value based on the
    hours that the task is planned to take as a percentage of the total time planned
    for the project.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'If, for example, a planned task is supposed to take 8.5 hours on a project
    with a total estimate of 100 hours, the task''s planned value would be 8.5. When
    the task is completed, the worker earns the EV credit of 8.5. EV is awarded only
    after each task is fully completed, and there is no partial credit for tasks that
    are nearly done. Also, the EV would be 8.5 whether the task took 2, 8.5, or 20
    hours. By using the EV measure and a plan that shows how much EV was planned for
    each week, knowledge workers can tell if they are ahead of or behind schedule
    and by how much. This would be true regardless of the order in which the tasks
    were completed.


    # Reporting Project Status


    By using the precise EV measure to determine their progress against the project
    plan, knowledge workers have the information to report their status in clear and
    understandable terms. The challenge is to ensure that they do so regularly, even
    when the project is not in trouble. To ensure that they do this, the TSP process
