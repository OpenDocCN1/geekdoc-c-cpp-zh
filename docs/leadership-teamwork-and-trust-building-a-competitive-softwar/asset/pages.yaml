    schedule, resources, or functionality differ from your definition of a fully successful
    result. The briefing should also include the principal products produced, key
    milestones, key risks, the resources required, estimates of the gross size of
    the product, the overall schedule, and a quality plan. The briefing should provide
    all the information you need to select and approve from among the main and alternate
    plans. It should also include a schedule of deliverables to be used for project
    tracking.


    # Evaluating the Team’s Plan


    The team''s briefing should be based on the team''s plan. Managers do not need
    to review this plan in detail, but they must determine that it is a sound plan
    and that the team is fully committed to meeting it. In conducting this review,
    the questions to consider are probably answered by the team leader or by one or
    more of the TSP role managers. By asking both the team leader and some of the
    team members to answer their questions, managers can get insight into the team’s
    level of ownership and commitment to the plan.'
