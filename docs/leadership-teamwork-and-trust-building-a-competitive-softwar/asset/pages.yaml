  md: '# GOALS


    Perhaps, like Blanca Treviño of Softtek, your goal is to be the quality benchmark
    for your marketplace; or, Cesar Montes de Oca Vazquez at Quarksoft, you will strive
    to offer the best and most profitable customer service. Similarly, Scott Garrett
    at Beckman Coulter challenged his people to be rated one or number two in every
    line of their business. In each case, these challenging goals provided the impetus
    for these organizations to make dramatic improvements and to achieve or maintain
    strong leadership positions in their industries. But what is it that makes goals
    so important? After all, just naming a goal doesn''t actually accomplish anything.
    What are the pieces and parts of goal setting that make goals effective in changing
    an organization?


    To be effective, goals must motivate action. But this can''t be just any action;
    it must lead to a productive and effective result. The following two examples
    illustrate both the dangers and the benefits of challenging goals.


    # Faster, Better, Cheaper


    When Daniel Goldin took charge of NASA, he was concerned about the long schedules
    and high costs of NASA projects. He felt that the work was overly complex and
    could be greatly simplified. He then initiated a new strategy called “faster,
    better, cheaper,” and NASA started launching new spacecraft in fraction of the
    time and for a fraction of the cost of prior missions. It looked as if the new
    strategy was a success. Then came the Mars Orbiter and Polar Lander missions.


    On September 23, 1999, the Mars Climate Observer, which had been launched nine
    months earlier, crashed into Mars and was destroyed [Oberg 1999]. Because NASA
