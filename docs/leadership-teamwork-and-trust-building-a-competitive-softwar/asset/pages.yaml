    This comes to approximately 75 days of training for this project team.


    The team will also need coaching support, including


    +   - Eight days for launch preparation and the initial launch

    - Six days of support for each of three cycle postmortems relaunches, or 18 days
    in all

    - Another 25 to 30 days of ongoing coaching support


    The coaching support for this project team is about 50 to 55 days, and with the
    addition of the training days it represents a cost of about 125 to 130 days.


    While this may appear to be a large cost, it is offset by a much greater return.
    Among the many benefits achieved with the TSP, the easiest to quantify are increased
    productivity and improvements in product quality. Organizations using the TSP
    are reporting a typical first-product productivity gain of 25% or more, and a
    fourfold reduction in the number of defects found and fixed in system test, acceptance
    test, and post-release [Davis 2003]. Using these data, a project that would normally
    take one year will finish in about nine months with savings of about 13 weeks
    per developer or about 650 days total. Additional savings will accrue from reductions
    in post-release rework.


    When you compare the 650 days’ saving with the initial investment of 125 to 130
    days, it’s clear that the cost of implementing the TSP will be recovered on just
    about any project that has a planned duration ranging from one year to as short
    as eight months. In addition, once the initial investment is made, the ongoing
    coaching costs are all that is required for subsequent projects. This distinction
    between the initial costs of training the people involved and the costs of ongoing
    operations are made clear in the following discussion of return on investment.'
