- img_proc: true
  md: '+   Implement the TSP by volunteer groups.


    +   - Pro: It maximizes the likelihood of early and substantial successes, and
    it will broaden exposure to the TSP.


    +   - Con: Assuming that the volunteers come from many parts of the organization,
    it requires that most of the organization’s middle and senior managers be TSP-trained.


    The key in selecting the implementation strategy is to ensure that all of the
    managers in the management chain above every TSP team are TSP-trained before their
    teams are launched.


    Once the plan is approved and implementation starts, the tracking and reporting
    strategy should follow the approach outlined in earlier paragraphs on maintaining
    priority.


    # BUILDING COACH CAPABILITY


    The principal capability required for a successful TSP implementation program
    is a strong team of internal coaches. While you will almost use external coaches
    to get started, and you will likely continue to use them to complement the internal
    staff, local coaches are necessary to provide the level of support that teams
    need to perform at their best and to continue improving their capabilities.


    The importance of coaching and the roles and responsibilities of TSP coaches are
    covered in the book TSP: Coaching Development Teams, so these topics are not discussed
    here [Humphrey 2006a]. The focus here is on the recommended strategy for building
    and maintaining a coaching capability and the issues and challenges involved in
    doing so.


    The strategy for building an internal coaching capability has five key elements,
    and they are all important:'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# BUILDING COACHING CAPABILITY 241


    +   1. Make coaching capability a high priority.

    2. Define the coaching career path.

    3. Establish a coach candidate identification program.

    4. Qualify master coaches.

    5. Monitor coaching performance.


    # Coaching Priority


    To demonstrate the importance of coaching capability, start by naming at least
    two respected technical managers as coach candidates and get them trained and
    qualified as quickly as possible. This should have been done during the initial
    TSP pilot phase, but if it has not been done, do so right away.


    The second part of making coaching a high priority is to have the coaching group
    report to a senior level on the corporate staff. The coaching team initially should
    be centrally staffed, funded, and managed. While the coaches will work with the
    local laboratories and groups to support their teams, they must be centrally staffed
    and funded or they will not be managed properly. The product work would always
    be given a higher priority and the coaching staff would be treated as a low-priority
    support group. The first senior manager who did not recognize the importance of
    coaching would then disband the group as soon as he or she could.


    Even after the TSP program is fully staffed and after the local engineering groups
    have their own coaching teams, a central coaching staff must continue to manage
    the coaching career path, identify and develop new coach candidates, manage the
    master coaches, and monitor coaching performance.


    # The Coaching Career Path


    Development professionals are often reluctant to take a coach-ing position because
    they don''t appreciate rewarding as such'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'job would be and because they don’t understand the career pos-ibilities that
    coaching experience would provide. The coaching job concerns motivating people
    to do their best work as well as guiding and mentoring groups to help them become
    cohesive and highly productive teams.


    It is imperative that senior executives recognize the impor-tance of coaching
    and enable a career path for coaches. The principal reason that few technical
    people are promoted to exec-utive positions is that of them who have developed
    coaching skills. While engineering groups have usually been managed with traditional
    methods, marketing and sales groups are composed of strong-minded individuals,
    and the most effective managers have typically developed coaching skills to lead
    them. This is because sales teams have all the characteristics of knowledge-working
    teams, and most sales managers know intuitively that a coaching management style
    will produce the best sales results.


    Because high-performing marketing groups are easy to identify, their managers
    are typically promoted rapidly. That is why so many executives have sales and
    marketing backgrounds. To encourage developers to consider a coaching position,
    make it clear to them that becoming a coach would prepare them for a wider range
    of future careers than they could otherwise aspire to reach. For example, they
    could return to technical work, become project or program mangers, advance to
    a mentor coach position, or ultimately even be considered for more senior man-agement
    jobs.


    To reinforce the benefits of a coaching career, make sure that when people move
    on from a coaching position, their next jobs are obvious promotions. Also, as
    the benefits of coaching experience become more widely understood, list coaching
    experience as a desirable background for project and program managers, laboratory
    managers, and director- and executive-level positions.'
  merge: -1
