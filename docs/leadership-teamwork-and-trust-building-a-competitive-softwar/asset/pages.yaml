    by experienced industrial software engineers in PSP training. This volume of data
    was so convincing that the original skepticism about PSP’s effectiveness largely
    disappeared, and it became possible to shorten the PSP training. Now, knowledge
    workers can learn basic PSP skills and gain the necessary motivation to start
    managing themselves after only a week or two of PSP training.


    # SUMMARY AND CONCLUSIONS


    This chapter describes how to motivate knowledge workers to manage themselves
    and align their objectives with those of their management. The chapter makes the
    following seven points:


    +   1. Teams can be motivated to meet their own and management’s goals by following
    a goal-setting process.

    2. To use this goal-setting process, the teams must be trusted to make their own
    plans and be held responsible for meeting them.

    3. To build the required trusting environment, a culture change is required, and
    this must be initiated and sustained by the organization’s senior executives and
    managers.

    4. Before they can be trusted, knowledge workers must be trustworthy. This requires
    that they consistently meet their cost and schedule commitments with quality products.

    5. The best way to get knowledge workers to consistently meet their commitments
    is to convince them to manage themselves.'
