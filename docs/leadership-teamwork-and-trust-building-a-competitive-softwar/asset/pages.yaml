  md: 'Leaders must recognize that the things that made them successful in the past
    are not likely to be the things that will keep them successful in the future.
    The question, of course, is: “What will make organizations successful in the future?”
    The answer is that nobody really knows, and those who say that they will almost
    certainly be proven wrong. What we do know, however, is that the problems both
    large and small businesses will soon face will be different from those of today,
    and they will principally concern management. We also know that these problems
    will likely be of two types.


    The first type of future problem concerns questions of scale. Small businesses
    typically grow faster and are more dynamic than larger ones, at least in part
    because they are not burdened by the problems of size. The question, then, is
    how a business can grow and be successful without being choked by its own size.
    Businesses have faced this problem, but with the Internet and the new flexibility
    of the “flat world,” these size problems are now different from what they were
    just a few years ago [Friedman 2005]. For example, in the past, the issue was
    numbers of people and spans of control. Today, while we still have the span-of-control
    issue, the scale problems also include managing geographically distributed groups,
    mixed cultures, and heterogeneous technical teams. Clearly, mastering the problems
    of size in this increasingly complex environment will be more challenging and
    more important than ever before.


    The second set of future problems has been with us for some time but has largely
    been confined to the specialized field of software. These problems concern knowledge
    work and edge workers. As Drucker pointed out, knowledge work is work that is
