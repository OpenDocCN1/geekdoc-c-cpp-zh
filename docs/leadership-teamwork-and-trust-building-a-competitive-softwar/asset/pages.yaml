  md: '# About the Authors


    # WATTS S. HUMPHREY


    ![](img/95b42669de34021a8760ed3006f5bdb6_329_0.png)


    Watts S. Humphrey (1927–2010) joined Carnegie Mellon University’s Software Engineering
    Institute (SEI) in 1986 after a long career as a manager and executive at IBM.
    A Senior Fellow at the SEI, Humphrey was the founder of the SEI’s Software Process
    Program and primary author of the SEI’s software process maturity model. In 2005,
    he was awarded the National Medal of Technology—the highest honor given by the
    president of the United States to America’s leading innovators. His principal
    focus in recent years was on knowledge work and its impact on software and systems
    development.


    During his 27 years with IBM, Humphrey was Director of Programming and Vice President
    of Technical Development. He also managed all of IBM’s software product development
    work, including the first 19 releases of IBM’s principal computer operating system,
    OS/360. Before his retirement, he served as Director of Programming Quality and
    Process. While at the SEI, he introduced the concepts of Software Process Assessment
    and Capability Evaluation, which evolved into Capability Maturity Model Integration
    (CMMI). He also led development of the Personal Software Process (PSP) and the
    Team Software Process (TSP).


    Humphrey earned graduate degrees in physics from the Illinois Institute of Technology
    and in business administration from the University of Chicago. He was a Fellow
    of the Association for'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 308 CHAPTER F ABOUT THE AUTHORS


    Computing Machinery (ACM), an IEEE Life Fellow, and a member of the Malcolm Baldridge
    National Quality Award Board of Examiners. Humphrey was awarded the 1993 Aerospace
    Software Engineering Award presented by the American Institute of Aeronautics
    and Astronautics and an honorary Ph.D. in software engineering by Embry-Riddle
    Aeronautical University in 1998. In 2000, the Boeing Company presented him with
    an award for innovation and leadership in software process improvement, and in
    2010, the Illinois Institute of Technology recognized him with its professional
    achievement award.


    Humphrey''s publications include many technical papers and 13 books, including
    Winning with Software: An Executive Strategy (2001), PSP: A Self-Improvement Process
    for Software Engineers (2005), TSP: Leading a Development Team (2006), TSP: Coaching
    Development Teams (2006), and Reflections on Management: How to Manage Your Software
    Projects, Your Team Boss, and Yourself (2010). His most recent book, Leadership,
    Teamwork, and Trust: Building a Competitive Software Capability, is his eleventh
    published by Addison-Wesley. He held five U.S. patents.


    # JAMES W. OVER


    ![](img/95b42669de34021a8760ed3006f5bdb6_330_0.png)


    James W. Over, who has been with the TSP Initiative since 1987, and is a senior
    member of the technical staff for the Software Engineering Process Management
    Program. Over has led SEI''s TSP Initiative since its inception, transitioning
    the TSP into organizations in the United States and abroad. He received the SEI
    Director''s Award for Excellence, the SEPM Director''s Award for Quality Innovation,
    and an award from'
  merge: -1
  pgno: 330
- img_proc: true
  md: Boeing Corporation for innovation and leadership in software process improvement.
    He has more than 35 years of technical and management experience in the software
    engineering industry. Over is the coauthor of several SEI publications on software
    process definition and improvement. He attended Northern Illinois University.
