    # OVERCOMING SKEPTICISM


    When the PSP was first developed, only the method''s inventor, Watts Humphrey,
    had used it. Nobody else believed that this self-management approach could work
    for software engineers. The method used to overcome this initial skepticism is
    to put knowledge workers in a course where they use the PSP self-management practices
    to write 10 small software programs. These exercises provide the students with
    personal data on how the methods work for them. This strategy has proven to be
    effective in getting developers to use disciplined self-management techniques.


    The initial PSP course had 10 example programs that took nearly three weeks for
    most developers to complete. Because many organizations were reluctant to make
    this much of a time investment for all their developers, transition to the PSP
    and TSP methods was initially slow. Then, after the SEI had trained'
