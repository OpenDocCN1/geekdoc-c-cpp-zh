  md: '# 4

    Managing Knowledge Work


    Management, as an orderly discipline, had its start only 100 years ago when Frederick
    Winslow Taylor published his landmark book, The Principles of Scientific Management
    [Taylor 1911]. Taylor, who lived from 1856 to 1915, was an American mechanical
    engineer who started studying labor in England as a young man. He originated the
    idea of breaking tasks into small steps, studying how best to perform each step,
    and then training workers to work in just that way. He looked at every aspect
    of the job from the most efficient tools, methods, and materials to the way the
    steps should be combined to accomplish the total job.


    Taylor’s work led to the time-and-motion studies that are a common practice of
    industrial engineers today, and enabled U.S. industry to out-produce the rest
    of the world to win World War II. He applied his principles to bricklaying, bicycle
    manufacturing, steel making, and many other activities with dramatic results.
    He worked with Henry Ford setting up the River Rouge production facilities for
    the Model T Ford, and he was the guiding force behind most of the management advances
    made in the first half of the twentieth century. In fact, Drucker says that Taylor’s
    methods were largely responsible for the 50 times improvement in labor productivity
    over the last 100 years. Drucker adds, “On this achievement rest all of the economic
    and social gains of the 20th century” [Drucker 1999].'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# TAYLOR’S MANAGEMENT PRINCIPLES


    In The Principles of Scientific Management, Taylor describes what managers must
    do when using scientific management. In his words, these four things are:


    +   - They develop a science for each element of a man’s work, which replaces
    the old rule-of-thumb method.

    - They scientifically select and then train, teach, and develop the workman, whereas
    in the past he chose his own work and trained himself as best he could.

    - They heartily cooperate with the men so as to insure all of the work being done
    is in accordance with the principles of the science which has been developed.

    - There is an almost equal division of the work and the responsibility between
    the management and the workmen. The management take over all work for which they
    are better fitted than the workmen, while in the past almost all of the work and
    the greater part of the responsibility were thrown upon the men.


    While this does not sound authoritarian, Taylor’s description of how to apply
    these principles in the case of bricklaying makes his fundamentally top-down management
    strategy completely clear:


    +   - First. The development (by the management, not the workman) of the science
    of bricklaying, with rigid rules for each motion of every man, and the perfection
    and standardization of all implements and working conditions.

    - Second. The careful selection and subsequent training of the bricklayers into
    first-class men, and the elimination of all men who refuse to be or are unable
    to adopt the best methods.

    - Third. Bringing the first-class bricklayer and the science of bricklaying together,
    through the constant help and watchful-'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'ness of the management, and through paying each man a large daily bonus for
    working fast and doing what he is told to do.


    +   - Fourth. An almost equal division of the work and responsibility between
    the workman and the management. All day long the management work almost by side
    with the men, helping, encouraging, and smoothing the way for them, while in the
    past they stood on one side, gave the men but little help, and threw on them almost
    the entire responsibility as to methods, implements, speed, and harmonious cooperation.


    Stated in this way, these rules sound totally inappropriate for today’s workforce.
    They were, however, very effective in Taylor’s time because the work and the workforce
    were quite different from what they are today. Professions, such as medicine,
    law, and finance, were quite limited; the bulk of the population engaged in farming
    or ranching, trades, or manual labor. Taylor’s work was focused on improving the
    productivity of unskilled laborers. The work that Taylor studied could be characterized
    roughly as follows:


    +   - All jobs could be broken into steps.

    - These job steps could be individually studied and analyzed.

    - Each job step could be designed to minimize the time required to complete it.

    - The individual job steps could be combined to produce the total job specification.

    - When scheduling the work, suitable rest periods had to be included to enable
    workers to work productively for a full day.

    - The supervisors could watch the work and ensure that it was done precisely as
    specified.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'The people making up the manufacturing workforce of Taylor''s day were also
    quite different:


    +   * The workers were mostly uneducated.

    * They were principally motivated by money.

    * They had limited and largely interchangeable skills.

    * Unless carefully supervised, the workers would not work as hard as they could.

    * They could not be trusted to work hard even when they were supervised.


    This last point refers to the common practice factory workers adopted when working
    under job quotas and piecework payment scales. They would never exceed their management-defined
    standard rates because they knew that management would then raise the rates but
    not increase their pay. In fact, workers were so united in this practice that
    they would threaten workers who exceeded the standard rates. This form of workermanagement
    animosity was and remains a common feature of many production management systems.


    # THE MODERN TECHNICAL WORKPLACE


    Today''s technical workers typically know much more about their jobs than do their
    managers, and most professional workers are highly motivated and work hard whether
    or not their management is watching. Furthermore, with today''s complex technologies,
    there are often many ways to do a job, and the job steps are often interdependent.
    This is particularly true of the balance among the development and quality-management
    steps in soft-ware engineering. Rushing through early requirements and design
    steps or skipping quality reviews and inspections might'
