  md: '# 6

    Motivating Knowledge-Working Teams


    This chapter discusses how to build, motivate, and manage teams of knowledge workers.
    The first step in the team-building process is having these teams manage themselves
    while they work on real company projects. Then, after they have completed just
    one project and see how effective self-management can be, they will be motivated
    to continue managing themselves. Subsequent chapters describe how to use these
    knowledge-working skills to improve business business performance. To illustrate
    how TSP teamworking methods work, we describe Beckman Coulter’s experiences with
    the first of its growing number of TSP teams.


    # BECKMAN COULTER


    Beckman develops, manufactures, and markets products used in biomedical testing
    and research. It has over 200,000 clinical and biomedical research systems in
    use by doctors and research centers throughout the world. The company has over
    10,000 employees and 35 facilities, and it operates in more than 120 countries.


    Beckman Instruments acquired the Coulter Corporation to form Beckman Coulter in
    1997. Scott Garrett was made Chief'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'Executive Officer of Beckman Coulter in 2005 and then Chair-man of the Board
    of Directors in 2008. He set a corporate goal of being the industry leader in
    biomedical testing. This meant Beckman Coulter would hold the number-one or number-two
    position in all major product areas and major geographic markets, quality would
    be its key differentiator, investment capacity would be expanded significantly,
    a number of high-risk and high-reward programs would be funded, and its employees
    would be acknowledged as the industry''s best.


    In addressing Scott''s directive, Rick Marshall, Beckman Coulter''s VP of Software
    Platforms, and Carl Wyrwa, the Director of Quality, convinced management to launch
    a TSP program. They followed the standard TSP introduction strategy outlined in
    the appendices of this book to train and launch their first TSP team. This introduction
    program started in the normal way with a senior management briefing, management
    training, and TSP team-member training. John Hetzler, a functional area manager,
    and Larry Whitford, a quality engineer, were trained as the first TSP coaches,
    and Tim Lancaster was selected to lead the first TSP team.


    # BECMAN COULTER''S FIRST TSP TEAM


    Tim Lancaster and his team of 15 developers were asked to develop the software
    for the prototype of a very complex new system. The project also included a hardware
    engineering team, a chemistry team, and a firmware team that developed the microcode
    for the hardware. Tim''s team was the only one that to use the TSP and the only
    one to start the project with a TSP launch. This launch was coached by Larry Whitford
    with the support of experts from the SEI.


    During the opening launch meeting in May 2009, Humayun Qureshi, VP of the Instrument
    Systems Development Center,'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# BECKMAN COULTER''S FIRST TSP TEAM 91


    told Tim and his team that their job was to develop the software for the initial
    prototype of this new system, and to do so in months. Tim and his team spent the
    next week making the most aggressive plan they felt could possibly meet, but they
    still were unable to meet Humayun''s date. In the final meeting, when Tim presented
    the team''s plan for a September 1 delivery date, the hardware and chemistry teams
    argued that software would be too late for them to meet their schedules. Humayun
    also was unhappy with the team''s date, but, after considerable debate, he accepted
    Tim''s plan.


    Based on his previous development experience, Humayun did not believe that any
    of the teams would finish when they said they would, but he had followed his customary
    strategy of pushing for an aggressive date in the hope that the teams would deliver
    earlier than they otherwise would. In this case, he was so impressed with the
    plan Tim and his team produced that he decided to accept their date instead.


    Tim''s team then started work, and within a few weeks they had fallen two weeks
    before their plan. That meant they would miss their September 1 commitment by
    at least three weeks. One of the developers pointed out that all the other teams
    were late, so they could just ignore the problem and nobody would notice. Tim
    didn''t like that idea, however, he asked the rest of the developers what they
    thought. After some discussion, they all agreed that they had committed to a September
    1 date and they intended to do so. In making their recovery plan, they found that
    they could meet the committed date if each of them worked just five more task
    hours per week. Although they also had to defer a couple of nonessential functions,
    they followed this plan and finished on time. All the other teams were late.


    In the September project relaunch, Humayun gave the entire project a six-month
    schedule objective for a more complex and'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'complete prototype of the same system. However, Tim and his team again found
    they could not meet Humayun’s date with the resources they had. In the final management
    review meeting, they presented four alternate plans with different combinations
    of delivery dates and resources. The plan they recommended would meet the requested
    schedule but would require five more software developers.


    The other teams objected to Tim’s plan. They said they needed the software sooner.
    Humayun told them, “I believe they will deliver on time with the highest quality.
    Overall should help everyone with their schedules.” He then agreed with Tim’s
    plan and gave him the five additional developers.


    By managing themselves, Tim’s team adopted a new working style and attitude. This
    not only affected the team did; it also changed how management viewed them and
    their work. This had important consequences for the team’s feelings of commitment
    and ownership and further enhanced their credibility with management.


    # TEAM COMMITMENT


    The software team’s attitude started to change during the launch. When Humayun
    gave them a three-month target, they would traditionally have said, “OK, boss,
    we will try.” But the three-month delivery date would have been Humayun’s commitment,
    not theirs. While they would have tried to meet it, they would not have known
    what date would be realistic and they would not have been personally committed
    to meeting it. By working through the TSP launch process, however, the team made
    a careful estimate of the work and produced a detailed plan for getting everything
    done. In doing so, they found they couldn’t quite meet Humayun’s date. Then they
    had a choice: They could confront Humayun, who knew was a'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'tough and demanding boss, or they could just cave in the way they always had
    and accept his date even though they knew they would be late.


    The team made the responsible choice and decided to deal with the issue head-on.
    They had made a good plan and they were confident that they could meet it. If
    they agreed to the three-month schedule, however, they knew they would run into
    trouble. Rather than put off the inevitable problem, they decided to trust their
    executive and tell him the facts. While they knew that Humayun would not believe
    them, they thought their plan was sufficiently detailed and complete to be convincing.
    Tim and his team also had to defend their plan against attacks from the other
    teams, but they had done a thorough job of planning and had the self-confidence
    and conviction to stick to their story. In the end, their decision to trust in
    Humayun’s judgment paid off, and they ended up with a plan to which the entire
    team was committed.


    # Project Ownership


    After Humayun approved the plan and they had worked for a month, the team found
    they were falling behind schedule. Even though they knew all of the other teams
    were also behind, they had committed to a date and they intended to meet it. It
    didn’t matter what everybody else did. Without complaining or asking for help,
    they took responsibility for solving their own problems. They then developed an
    action plan, which they followed, and they finished on schedule. This wasn’t just
    a team of employees doing what they were told. This was their project and they
    felt responsible for its success.


    In advanced technical work, this is a critical attitude. No matter how good a
    plan a team makes, there are always surprises and unexpected problems. When teams
    are truly committed,'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'attack their problems and work their way through them. Even though it took
    extra effort, Tim’s team was committed to meeting its delivery date, and everybody
    did his or her utmost to succeed. When teams have this win-at-all-costs attitude,
    they usually win, and when they don’t have this attitude, they often fail.


    # Credibility


    Tim’s team did one thing that turned out to be very important. They reviewed their
    progress every week and gave management a status report that showed precisely
    where they stood on the job. Their initial reports showed that they were falling
    behind, but they honestly reported the facts. Then, after they had adopted the
    recovery plan, their reports showed them gradually catching up.


    Management could see what the team was doing, and they could tell them that the
    team was taking the initiative to solve its own problems. This open and honest
    communication showed that the team members trusted management with the facts,
    and that they were capable of managing their own work. Once teams have established
    this kind of credibility, management will be willing and able to help them if
    they later run into problems they truly cannot solve.


    These management reports were a big change. Previously, the teams had no way to
    measure project status, so they could not provide useful reports to management
    unless they were in trouble. This meant not only that management did not want
    to see them, but that management was in the dark on job status and problems. Under
    these conditions, management soon started to worry and suspected that the team
    was in trouble. This kind of all-news-bad-news situation does not make for a trusting
    relationship.'
