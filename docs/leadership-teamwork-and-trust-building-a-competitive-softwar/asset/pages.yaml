  md: '# Critical Success Factors and Barriers


    As Fred Brooks said, “There is no silver bullet” and there is no magic potion
    or cure for the management problems in the software industry [Brooks 1987]. While
    the TSP has a very good management track record with documented, dramatic, and
    measurable improvements, it is not a silver bullet either. Yet many managers continue
    to look for the silver bullet. They often ask, “What’s the one thing that makes
    the TSP so successful?” or “What’s the secret to the TSP’s success?” as if there
    were a silver bullet buried somewhere in the TSP.


    There is no “one thing” or “secret” to the TSP’s success. The truth is that the
    TSP is a system, with parts that were not designed to achieve the outcomes reported
    by TSP users. It’s not one thing; it’s many things. It’s the processes, measures,
    tools, training, coaching, management style, Personal Software Process, launch,
    bullets, inspections, estimating methods, implementation strategy, and other elements
    of the TSP that make it work.


    Why is this important? It is important because you may be tempted to implement
    just the one or two things that look like silver bullets to you. The best advice
    is to resist this temptation. Start by implementing the TSP on pilot projects
    with minimal tailoring. Rely on experienced resources to guide you. Then, as you
    gain experience and understand the TSP system, you will be in a better position
    to adapt the TSP to your needs. Or, to quote a common adage from master chefs:
    “Don’t change the recipe until you have cooked the dish.”


    There are two other critical success factors that have already been briefly described,
    the coach and the team leader. A study of key success factors on dozens of projects
    at Intuit identified the team leader as the most critical factor and the coach
    as a close second [Sartain 2007]. Also, a minimum level of executive support is
    required. This support includes setting an expectation'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# CONCLUSION


    that improving quality and efficiency are key priorities for the organization
    and that engineering leadership will be measured against these improvements as
    performance goals. The leadership team must also provide people, funding for training,
    and other resources as as initial investments. More information on the roles of
    the coach and the team leader can be found in Appendices B, C, and E.


    # CONCLUSION


    Will the TSP work in your organization? Most likely it will. Today there are many
    organizations that use the TSP. They range from small to large groups that work
    in many different settings and product domains, have many different business models,
    have small to large project teams, and have projects with very short to very long
    development and release schedules. A wide variety of development tools, languages,
    and other methods have been used with the TSP. With few exceptions the results
    across this broad spectrum are very similar. The conclusion is that the TSP works
    in many domains and settings and will produce great results when properly implemented,
    as described in the implementation roadmap in Appendices B through E.


