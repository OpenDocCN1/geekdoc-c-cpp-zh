  md: '# THE OVERALL IMPLEMENTATION STRATEGY


    +   * Building local sponsorship

    * Developing the local implementation plan

    * Building coaching capability

    * Other capability requirements

    * When and where to use the TSP


    The TSP is implemented with a combined top-down and bottom-up strategy. That is,
    the first step is to get top-level executive support and to produce an overall
    organizational plan. Then you start actual implementation at the bottom level
    with individual TSP teams. The first step in this process is to develop the organization’s
    overall implementation plan and to get that plan approved by the senior executive
    sponsor. This first step was covered in Appendix B.


    The next step is to produce a rollout plan and to select the part or parts of
    the organization with which to implement it. It is best to work with the senior
    managers in the part of the organization selected for initial TSP implementation
    and to get their sponsorship. Then, with their support, develop a local implementation
    plan. The local implementation plan should also follow the bottom-up team-based
    implementation strategy already described in Appendix B for the pilot teams.


    # THE OVERALL ROLLOUT PLAN


    The first step in the rollout effort is for the overall corporate implementation
    team to develop the rollout plan for broad TSP introduction. This plan should
    be designed to produce the following four conditions in the organization:'
  merge: -1
  pgno: 254
- img_proc: true
  md: '+   1. Every part of the organization is using the TSP process and producing
    superior work. To do this, the TSP must be properly introduced and supported in
    all parts of the organization.


    +   2. The initial implementation groups are successful and they are vocal supporters
    of the overall TSP rollout program. This is required to build and sustain the
    energy and momentum needed for successful TSP implementation.


    +   3. The organization has the internal capability to ensure that the TSP is
    used properly and effectively.


    +   4. The top executives continue to support the TSP implementation program and
    it is self-sustaining. This topic is discussed in Appendix E.


    In developing the rollout plan to meet these objectives, you must address three
    issues:


    +   1. Overcoming resistance to change


    +   2. Building internal capability


    +   3. Maintaining priority


    # Overcoming Resistance


    As described in Appendix A, resistance to change is normal and natural, and you
    must not view it as obstruction. The key to overcoming resistance is to address
    it rationally. Acknowledge people’s concerns, and logically and factually address
    every one. Some people, particularly the early adopters, will accept logical arguments
    and references to other people’s successes. Most, however, will adopt a show-me
    attitude, and many will be unwilling to change until they have tried the change
    for themselves or are forced to change. There are two kinds of resistance to consider:
    internal and external.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Overcoming Internal Resistance


    To address Internal resistance within the organization, start by discussing the
    rollout strategy with the involved executives and senior managers. While doing
    so, identify the early adopters, and wherever possible, select the initial implementation
    groups from this set. Then, when these initial groups have positive results, use
    them as references in selling the early majority. As successes accumulate, the
    change program will gain momentum and internal resistance to change will gradually
    dissipate.


    # Overcoming External Resistance


    External resistance generally comes from three sources: from suppliers, from partners,
    and from customers. If the suppliers are providing professionals to fill temporary
    team needs, you will likely face problems like those Microsoft encountered in
    India. The company found that temporary personnel who were not were not fully
    effective on TSP teams and that it was too expensive to pay for them while they
    were being trained. Microsoft’s managers addressed this in two ways. First, initially
    agreed to have the contractors attend PSP training with the Microsoft team members,
    but they would not pay for their time while doing so. Second, they announced that
    henceforth they would give preference to contractors who had TSP-trained staff.


    For suppliers who develop products for you, the question of TSP use is best addressed
    during the acquisition phase. Then, when the supplier agrees to use the TSP, insist
    that this agreement be included in the contractual provisions and that their proper
    use of the TSP be independently verified. One way to do this would be with the
    SEI’s TSP Organization Evaluation and Certification (TSP-OEC) process, described
    in Appendix E.


    For organizations with which you are partnering on a larger program, you will
    generally have limited leverage.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# THE OVERALL ROLLOUT PLAN 235


    effective strategy in these cases is to treat these groups in much the same way
    as the groups within your organization and start by convincing their senior management.
    Also, if the work is likely to involve considerable interaction among teams from
    several and external organizations, a larger TSP multi-team process would likely
    be most effective. It is usually a good idea to tell the overall program customer
    about these discussions.


    # Overcoming Customer Resistance


    This is the most challenging kind of resistance, and it is best addressed at the
    earliest possible time. If you are planning to introduce the TSP on a contract
    that is just beginning, start at the customer''s most-senior management level
    and treat the customer resistance problem much like resistance from an internal
    group. Have the senior managers participate with your senior managers in a TSP
    executive seminar, and have the managers attend TSP management training along
    with your managers. This will provide these managers with the knowledge needed
    to monitor the TSP work, and it will start building the trusting relationships
    needed to cooperatively manage a multi-organization team of knowledge workers.
    Then, with a basic level of trust established, have the customer participate in
    meetings l and 9 of the TSP team’s launch.


    # Building Internal Capability


    When introducing any new method or practice into an organization, you must necessarily
    start with a limited foundation of knowledgeable and skilled people. In fact,
    most organizations that have introduced the TSP started with no internal PSP or
    TSP skills and had to retain external support to get under way. The skilled people
    who are most critical to TSP success are team leaders and coaches.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Because a skilled team leader is required for every TSP team, you might view
    developing team leader skills as the higher priority. This would be a mistake,
    however, because team leaders, after being trained, focus their efforts on building
    products. Conversely, coaches typically support multiple teams, and once they
    have been trained and qualified, they focus their efforts on developing people.
    This means that the coaches are force multipliers; each coach can train and develop
    many skilled and capable developers, managers, and team leaders. Therefore, the
    first priority in building internal skills should be training and qualifying internal
    TSP coaches.


    Initially, because most TSP coaches are also qualified TSP instructors, the internal
    coaches can act as instructors for the various PSP and TSP courses. However, as
    the demand for coaching and training increases, you will need to either qualify
    some internal PSP and TSP instructors or retain external ones. The coach and instructor
    development strategies are discussed further in later sections of this appendix.


    # Maintaining Priority


    The priority issue is critical, particularly at the beginning of the TSP introduction
    effort. Unless a high priority is sustained, the energy and enthusiasm behind
    the effort will gradually wane, and the TSP users themselves will be enthusiastic
    supporters, they will be busy with their projects and not have the time to sell
    the program to others. Therefore, without some central push, the local managers
    will often delay training their people or argue that this is the wrong time to
    introduce the TSP into their projects. This is nonsense, however, because the
    TSP can be introduced at almost any time during a project, and the earlier better.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'The TSP can be effective during the requirements phase, in design, and during
    implementation. However, we do not recommend introducing the TSP during final
    test. Another common delaying tactic is for management to say that they must wait
    for the end of a project phase to introduce the TSP. However, on real projects,
    no phase is ever completed until final testing, and often not even then. Requirements
    typically change all the way through development and often after final delivery,
    design is generally in flux through final testing, and implementation is necessarily
    involved in changes and fixes until the project ends.


    An argument to wait until some phase is completed is, therefore just delaying
    tactic. An effective counter to these issues is an aggressive implementation plan
    coupled with regular progress reviews. Hold these reviews every week or two at
    the beginning, and if a senior manager would like to attend one of them, that
    would be even better. In any event, document the results of the review with a
    clear statement of any resulting action items, who is responsible for the action,
    and the due date.


    Copy the executive sponsors on these reports and work with their offices to have
    them send the implementing managers short congratulatory notes for any major accomplishments
    or brief questions about problems and forthcoming actions. Just a modest show
    of continuing executive interest is usually sufficient to sustain the priority
    for the TSP introduction program.


    # BUILDING LOCAL SPONSORSHIP


    Sponsorship is critical, and the principal objective of the first nine chapters
    and of Appendix A of this book was to enlist senior management as sponsors of
    the TSP introduction effort. As part of building sponsorship, a TSP Executive
    Seminar will have been given for the senior corporate executives. The next'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# 238 APPENDIX C EXPANDING TSP USE


    step is to broaden TSP use to other possibly remote parts of the organization.
    One or two of the senior executives of the first of these local groups to implement
    the TSP should have been invited to the initial executive seminar. If so, you
    should already have their support and be ready to obtain the support of the rest
    of the local management team.


    If the local organization is large and several key executives and senior managers
    did not attend the senior-level seminar, another TSP Executive Seminar should
    be conducted for them. Then start the implementation effort by training the local
    managers and the members of their initial TSP teams. Following this, launch the
    first local TSP teams and proceed with the rest of the implementation plan. The
    key is to have the support of all of the organization’s departmental and program
    managers and make sure that the entire organization is aware of senior management’s
    support.


    It is important that everyone know what is being done before rumors start and
    people grow concerned about what is being planned for them. They should be informed
    generally about the overall effort and told that a detailed plan is being developed
    and that they will be informed about their role as soon as the plan is available.
    Also, and particularly for large organizations, once the plan is completed, discuss
    its details in an all-hands meeting.


    In this meeting, it would be helpful to have one or two of the team leaders and
    some team members from the initial pilot projects attend and describe their experiences
    with the TSP and why they recommend that this group use it. If this communication
    is properly handled, several local project teams should volunteer to use the TSP
    for their projects. At that point, resistance to change should largely disappear,
    and as long as management priority, the overall implementation program should
    proceed relatively smoothly.'
  merge: -1
  pgno: 260
- img_proc: true
  md: "# DEVELOPING THE LOCAL IMPLEMENTATION PLAN\n\nWhen developing the local implementation\
    \ plan, make sure that all of the involved groups are kept informed. However,\
    \ the planning group itself should be kept relatively small and should consist\
    \ entirely of people who have either attended a TSP Executive Seminar or otherwise\
    \ have been TSP-trained and support the effort. You do not want doubters or skeptics\
    \ on the planning team. It would also be helpful to include one or more members\
    \ who were involved in the initial TSP pilot effort, are familiar with the time\
    \ and resources required for the various actions, and understand the principal\
    \ issues encountered and how they were addressed.\n\nThe planning work should\
    \ follow the TSP launch process and be coached by a qualified TSP coach. Representatives\
    \ of all the involved groups should also be invited to attend launch meetings\
    \ 1 and 9. When developing this plan, the planning group should consider the most\
    \ common TSP adoption strategies and their pros and cons:\n\n+   - Implement the\
    \ TSP one department at a time.\n  - Pro: It minimizes the need for management\
    \ support and training.\n  - Con: It delays broader exposure to and understanding\
    \ of TSP.\n- Implement by one major program at a time.\n  - Pro: It accelerates\
    \ adoption by the program and will likely result in early and substantial benefits\
    \ for that program.\n  - Con: It maximizes the impact on the program and will\
    \ likely require training all of the managers in the entire organization who are\
    \ involved in the program."
  merge: -1
