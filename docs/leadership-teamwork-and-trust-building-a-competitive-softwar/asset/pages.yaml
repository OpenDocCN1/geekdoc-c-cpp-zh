    methods. After this brief training, SEI coached the two companies'' teams in producing
    a joint plan. This was done using the TSP launch process, which consisted of a
    series of meetings that brought all team members from both companies to one location
    to participate in a joint planning effort. The engineering staff was divided into
    three smaller unit teams, and a leadership team was established. Each of the two
    engineering teams, team A and team B, was assigned one of the system’s two major
    components. The members of team A were all from one company and one location,
    and those on team B were all from the other company and location.


    Another team, team C, was formed from employees of both companies, and its job
    was to establish a common set of requirements for the work. At the beginning of
    the first day of the team launch, the members of team C were sitting together
