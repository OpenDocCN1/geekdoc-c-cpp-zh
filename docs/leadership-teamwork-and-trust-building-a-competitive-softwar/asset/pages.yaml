  md: 'Today’s world is totally different, and every aspect of daily life is more
    complex. This is true of the work and the workers. You cannot tell what a computer
    is doing by looking at it, and you cannot tell what computer designers are doing
    by watching them work. Modern large-scale knowledge work is unlike any kind of
    work people have ever done before. For many modern technologies, products must
    be considered as systems with myriad interdependent parts, and the work needed
    to produce products must also be considered systemically with many interdependent
    steps. Commonly, in fact, no single part by itself can do anything; it has utility
    only as a part of an entire system.


    Similarly, the job steps to produce products are often interdependent and iterative.
    This is why modern technical work is nonlinear. For example, designers work at
    the highest conceptual level for a while, and when they hit some puzzling question,
    they burrow down to the lowest and most detailed design level [Curtis 1988]. Then,
    when they have worked out how that smallest part must behave, return to the highest
    conceptual level to continue refining the overall system design. Most modern technical
    work is iterative, nonlinear, and widely varied. Typically, only the workers can
    know what they are doing, why they are doing it, or how they are doing it.


    # MODERN TECHNICAL WORKERS


    While modern work is completely different from that of 100 years ago, today’s
    workers are, if anything, even more different. Many are highly educated and often
    capable of working at the very forefront of their technical fields. They generally
    care about money, but that is not their principal motivator. They seek interesting
    and exciting work, a cohesive and rewarding working environment, and the recognition
    of their peers and management. They typically find their greatest rewards in building'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'challenging products that work precisely as they intended. Experienced engineers
    are rightfully proud of the thrill and joy they feel when a complex system they
    created works for the first time.


    Today’s workers often have highly individualized skills and talents. performance
    difference between highly skilled and average developers can be modest or almost
    infinite, depending on the task and the environment. Most creative ideas are accents
    of environment, opportunity, and talent. When creative people face a challenging
    and important problem, their minds work on that problem even when they are sleeping,
    eating, or working on other tasks. Then, some seemingly unrelated comment or event
    triggers the inspiration needed to devise a solution. There is no way to compare
    the performance of this knowledge worker with one who is just putting in time
    to earn a paycheck.


    What is surprising about knowledge workers, however, is that there is no way to
    tell in advance who will be creative and who will not. Furthermore, almost all
    knowledge workers, when properly motivated and challenged, are highly creative
    and productive. Finally, when skilled and motivated knowledge workers are teamed
    with an eclectic mix of peers and motivated by common challenges, they stimulate
    each other so that the team’s collective creativity often far exceeds that of
    any individual member. Such knowledge workers are typically highly motivated and
    work hard whenever they have challenging, interesting, and rewarding assignments.
    In Taylor’s day, supervision was required to make workers productive; for today’s
    workers, close supervision often reduces or inhibits their motivation.


    # THE PRINCIPLES OF MANAGING KNOWLEDGE WORK


    Knowledge workers and knowledge work seem almost unmanageable, so how can we possibly
    manage them? The team'
