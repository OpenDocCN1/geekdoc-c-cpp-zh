    # 3.3.3.1 Analysis of ECG Signal


    The ECG is a tool to analyze and identify the abnormal rhythms of the heart, and
    with the help of the ECG signal one can easily find the disease caused by the
    heart. The ECG signals are expressed using isolated pulses or isolated pulses
    with a quasi-periodic sequence in nature. Due to baseline drift, power line interferences,
    and noises, the analysis of the ECG signal results in complications. These disturbances
    can influence the visual interpretation of the signal with that of the results
    obtained by computer-based offline analysis.


    To filter the baseline drift in the ECG signal, a high-pass linear phase filter
    may be used, but usage of a non-linear filter may be avoided, which results in
    the introduction of distortions to the filtered ECG signal. Baseline drift is
    mostly used in PQRST waveform changes and influences the accuracy diagnosis of
    heart disease. The instantaneous heart rate [55] can be calculated with the help
    of the R-wave, and it is detected by slope detection in R-wave.


    The computer-based ECG signal analysis is needed to find the disease quickly caused
    by the heart. In this connection, the signal may be analyzed using MATLAB®, LabVIEW,
    and many other tools.


