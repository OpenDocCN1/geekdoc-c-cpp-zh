- img_proc: true
  md: '# LSTM


    ![](img/192a3c2b5cb8c569671157e67252f59e_188_0.png)


    **FIGURE 10.2** Architecture of a LSTM cell


    The memory cell in the LSTM stores the previous state of the output given as the
    feedback to the current state along with the input data. The equations of the
    input, forget, and output gates are given here:


    $f_i = \sigma(W_f[h_{i-1}, x_i] + b_f)$


    $i_i = \sigma(W_i[h_{i-1}, x_i] + b_i)$


    $o_i = \sigma(W_o[h_{i-1}, x_i] + b_o)$


    The output of the forget gate at time step "t," represented by "f," is derived
    using the activation function $\sigma$. Similarly, "i," and "o," represent the
    output of the input gate and output gate, respectively. while "h,i-1" signifies
    the previous hidden state. The weight matrices $W_f, W_i, W_o$, with the bias
    terms $b_f, b_i$, and $b_o$, constitute the learnable parameters in this context.


    # 10.3.3 HYPERPARAMETER TUNING


    The neural network has various hyperparameters that are responsible for network
    performance. Some of the hyperparameters are activation function, number of layers,
    optimizer, loss function, learning rate, etc. In this work, we concentrate on
    the activation optimizer and learning rate for tuning the performance of the LSTM
    model. There are several methods used for hyperparameter optimization in the literature,
    evolutionary algorithms are popular in selecting the optimal value of the hyperparameters.
    In this work, we propose a genetic algorithm-based hyperparameter tuning of the
    LSTM network to improve the prediction accuracy of heart disease prediction task.
    The genetic algorithm for tuning the hyperparameters of the LSTM is given in Algorithm
    1.'
