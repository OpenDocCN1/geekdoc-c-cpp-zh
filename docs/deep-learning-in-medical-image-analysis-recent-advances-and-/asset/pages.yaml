  md: '# # 4 A Recent Advances and Clinical Applications of Deep Learning in Medical
    Image Analysis


    P. Radha Jayalakshmi and P. S. Rajakumar


    # ## 4.1 INTRODUCTION


    In the field of medical science [1], there has been a tremendous increase of image
    data from several sources, which includes X-ray, positron emission tomography
    (PET), ultrasound images, nuclear medicine image, magnetic resonance image (MRI),
    magnetic resonance angiography (MRA), CT (computed tomography), and fMRI (functional
    MRI). This enormous amount of data from multiple sources needs to be analyzed,
    which is a vital step in a clinical diagnosis and also in decision-making in the
    healthcare industry.


    Due to the swift growth of artificial intelligence technology, AI used to extract
    medical data learning has been identified as a significant trend in the healthcare
    sector. AI includes machine learning, which allows machines to learn from experiences
    and acquire skills without the need for human intervention. A part of machine
    learning (ML) is called deep learning (DL), and it offers a powerful method for
    automatically analyzing medical images for diagnosis or evaluation of a disease
    [2, 3].


    Earlier, automated approaches for analyzing medical images to diagnose diseases
    were developed based on conventional machine learning techniques [4]. However,
    these conventional machine learning methods weren''t able to produce the expected
    results since complex pictures were unveiled. An evolving technology in learning
    is deep learning, which has been offering several cutting-edge solutions for the
    most accurate outcomes.


    In this chapter, various popular imaging modalities and technologies for particular
    task classification, recognition, and segmentation in the context of medical image
    analysis are explained. This chapter also covers the different deep learning algorithms
    like self-organizing maps (SOMs), convolutional neural networks (CNNs), radial
    basis function networks (RBFs), restricted Boltzmann machines (RBMs), recurrent
    neural networks (RNNs), generative adversarial networks (GANs), multilayer perceptrons
    (MLPs), autoencoders, long short-term memory networks (LSTMs), and deep belief
    networks (DBNs).


