    illness, like diabetes. Disease diagnosis is the process of identifying the underlying
    cause of a patient''s symptoms and making a definitive determination of the specific
    disease or condition that is affecting them. Accurate diagnosis is critical to
    providing treatment and management of the disorders and ailments of the patient.
    The past health condition of the patient, a physical exam, diagnostic tests, are.
