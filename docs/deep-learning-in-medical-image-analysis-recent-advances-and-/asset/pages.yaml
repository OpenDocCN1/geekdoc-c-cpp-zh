    # ## 9.1 INTRODUCTION


    Diabetic retinopathy is a progressive eye disease that occurs as a result of long-term
    diabetes. It is a leading cause of vision loss and blindness in adults and has
    an impact on the blood vessels in the retina and the light-sensitive tissue at
    the back of the eye. Blood sugar levels that are consistently raised over time
    are strongly associated with the onset of diabetic retinopathy. The small blood
    vessels in the retina are harmed by high blood sugar, which makes them leak fluid
    or blood. The retina may expand as a result of this aberrant leakage, and abnormal
    blood vessels may develop [1].


    The severity of diabetic retinopathy is typically assessed using a grading system
    based on the presence and extent of specific retinal abnormalities observed in
    retinal images or through a comprehensive eye examination. Early diagnosis and
    prompt treatment are essential for stopping or delaying the disease''s course
    and minimizing visual loss [2]. For people with diabetes


    Diabetic retinopathy has two distinct stages. There are two types of diabetic
    retinopathy: proliferative and non-proliferative.


    # ### 9.1.1 NON-PROLIFATIVE DIABETIC RETINOPATHY (NPDR)


    Early on, the retina''s blood vessels may begin to leak fluid or blood, which
    can cause microaneurysms, haemorrhages, and retinal edema. If NPDR is not treated,
    it can advance to more severe stages even though it may not initially show any
    symptoms [4].


