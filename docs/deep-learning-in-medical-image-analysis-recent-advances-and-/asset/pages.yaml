    # 1.4 WORKING OF BACKPROPAGATION ALGORITHM


    In an artificial neural network, the weights and biases are initialized with random
    values. The neural network probably makes faults in producing the output because
    of random initialization. The weight and biases parameters in an artificial neural
    network are chosen at random. The neural network most likely produces incorrect
    results because of random initialization. Using backpropagation, the network is
    trained to update the weights and biases. Backpropagation is a type of learning
    by supervision algorithm used for training the neural networks [4]. By modifying
    the weights and biases, this gradient descent optimization technique enables the
    network to learn from its errors. An onward pass input data is fed into the network
    during the onward pass, and the output is calculated. The difference between the
    output that was expected and what was actually produced is transmitted backward
    via the network during the reverse pass. In order to reduce the total error, the
    weights and biases of the network are updated using the error.


    Using the chain rule of calculus, the backpropagation method calculates the gradient
    of the error with respect to each weight and bias. Using a learning rate parameter,
    the gradient is then used to update the weights and biases.'
