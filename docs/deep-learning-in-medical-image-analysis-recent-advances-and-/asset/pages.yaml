  md: '# A Survey


    From raw input data, DL can automatically extract key features. Cognitive and
    information theories served as the foundation for the development of DL algorithms.
    The two main traits of DL are as follows:


    +   1. Several processing layers, each of which is capable of learning distinct
    data aspects at varying levels of abstraction

    2. Learning of feature presentations on each layer may be unsupervised or supervised.


    # 4.1.2 Why Deep Learning


    Deep learning techniques are more effective than machine learning techniques because
    of the following reasons.


    Data must be preprocessed in typical machine learning methods, a process called
    feature extraction. Preprocessing is a challenging task since it necessitates
    a thorough understanding of the problem domain. For the best results, this preprocessing
    layer needs to be modified, for deep learning and improved across numerous iterations.


    Artificial neural networks for deep learning don''t entail the feature extraction
    stage. The layers have the ability to directly and independently learn an implicit
    representation of the raw data. Figure 4.2 represents the aforementioned.


