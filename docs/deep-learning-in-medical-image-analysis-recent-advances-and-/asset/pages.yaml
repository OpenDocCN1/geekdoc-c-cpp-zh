    machine learning algorithms have been increasingly used in the drug discovery
    process to accelerate and improve the efficiency of drug discovery. For instance,
    preclinical testing can be completed faster and more cheaply by using machine
    learning algorithms to forecast the effectiveness and toxicity of new drug candidates.
