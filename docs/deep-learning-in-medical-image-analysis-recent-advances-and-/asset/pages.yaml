  md: '# # Artificial Intelligence in Smart Healthcare Systems


    # ## Series Editors: Vishal Jain and Jyotir Moy Chatterjee


    The progress of the healthcare sector is incremental as it learns from associations
    between data over time through the application of suitable big data and IoT frameworks
    and patterns. Many healthcare service providers are IoT-enabled devices for monitoring
    patient health care, but their diagnosis and prescriptions are instance-specific
    only. However, these IoT-enabled healthcare devices are generating volumes of
    data (Big-IoT Data), that can be analyzed for more accurate diagnosis and prescriptions.
    A major challenge in the above realm is the effective and accurate learning of
    unstructured clinical data through the application of precise algorithms. Incorrect
    input data leading to erroneous outputs with false positives shall be intolerable
    in healthcare as patient''s lives are at stake. This new book series addresses
    various aspects of how smart healthcare can be used to detect and analyze diseases,
    the methodologies, and related security concerns. Healthcare is a multidisciplinary
    field that involves a range of factors like the financial system, social factors,
    technologies, and organizational structures that affect healthcare provided to
    individuals, families, institutions, organizations, and populations. The goals
    of healthcare services include patient safety, timeliness, effectiveness, efficiency,
    and equity. Smart healthcare connects m-health, e-health, electronic resource
    management, smart and intelligent home services, and medical devices. The Internet
    of Things (IoT) is a system comprising real-world things that interact and communicate
    with each other via working technologies. The wide range of potential applications
    of IoT includes healthcare services. IoT-enabled healthcare technologies are suitable
    for remote health monitoring, including rehabilitation, assisted ambient living.
    In turn, healthcare analytics can be applied to the data gathered from different
    areas to improve healthcare at a minimum expense.


    This new series is designed to be a first-choice reference at university libraries,
    academic institutions, research and development centres, information technology
    centres, and interests interested in using, design, modelling, and analysing intelligent
    healthcare services. Successful application of deep learning frameworks to enable
