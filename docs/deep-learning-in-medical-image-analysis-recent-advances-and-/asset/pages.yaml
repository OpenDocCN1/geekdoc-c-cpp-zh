    **Removal of Outliers:** The outliers of the health data lead to inaccurate prediction.
    Multiple linear regression is applied to predicted outliers. Compare Cook''s D
    [13] with the cut-off value (three times the mean value of the outlier) and remove
    the outliers present in the dataset.


    **Removal of Redundancy:** Redundancy of data present in health care leads to
    inaccurate results in medical data analysis through EHR. It can be determined
    by performing a correlation analysis among the attributes of the dataset. Pearson
    correlation [14] measures the strength of the association between two given attributes.
    If the correlation is greater than the threshold, discard the redundant feature.


    ```

    $r = \frac{n(\sum xy)-(\sum x)(\sum y)}{\sqrt{[n\sum x^2-(\sum x)^2][n\sum y^2-(\sum
    y)^2]}}$

    ```


    where r is the correlation coefficient, and x and y are the two independent attributes
    in the dataset.


    # 10.3.2 LONG-SHORT-TERM MEMORY (LSTM)


    LSTM, a well-known neural network model, is part of the recurrent neural network
    family [15]. This LSTM network extends application across various domains and
    has achieved significant advancements in the analysis of time series data. Unlike
    traditional RNNs, LSTMs are capable of addressing the vanishing gradient problem,
    making them well-suited for tasks involving sequences with long-range dependencies.
    LSTMs’ capability to capture long-term dependencies and adapt to varying patterns
    make them suitable for medical data analysis, where patient data often involves
    complex temporal relationships and contextual information. In medical analysis,
    LSTM can analyze medical time data such as patient vital signs, electrocardiograms
    (ECGs), and blood glucose levels. It can capture patterns and fluctuations over
    time, aiding in early detection of anomalies or predicting future values. LSTMs
    can predict the likelihood of specific medical conditions based on patient history,
    lab results, and other relevant data. This aids in timely intervention and personalized
    patient care.


    Each unit of the LSTM network consists of three gates (input gate, output gate,
    and forget gate) and one memory to store the output of the previous state. The
    structure of the LSTM block is shown in Figure 10.2 [16].


    The LSTM architecture consists of three components:


    +   1. Memory Cell: The core memory unit that maintains information over time
    and is controlled by three gates.


    +   2. Input Gate: Determines how much information is added to the cell state.


    +   3. Forget Gate: Determines what information from the cell state should be
    discarded.


    +   4. Output Gate: Controls the output of the cell state based on the input and
    internal state.'
