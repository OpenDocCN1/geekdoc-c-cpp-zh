  md: '# 4.1.1 UNDERSTANDING THE CONCEPT OF DEEP LEARNING


    Deep learning, occasionally called “deep structured learning”, is a more extensive
    group of artificial neural network-based machine learning methods. This topic
    is illustrated diagrammatically in Figure 4.1.


    **Artificial intelligence:** The name artificial intelligence, or AI, is employed
    to describe systems or robots that imitate human intelligence in order to carry
    out tasks and can fine tune themselves based on the data they gather.


    **Machine Learning:** Artificial intelligence includes machine learning, in which
    researchers study how computers may learn on their own. Algorithms used in machine
    learning produce predictions based on data and gain expertise from it.


    **Deep Learning:** Deep learning is a section of machine learning algorithms that
    employ neural networks to identify patterns in the information that is collected
    from various sources and predict outcomes.


    Deep learning systems process a lot of data and include several intricate mathematical
    computations; they demand strong hardware. However, even with such advanced hardware,
    training a neural network can take weeks.


