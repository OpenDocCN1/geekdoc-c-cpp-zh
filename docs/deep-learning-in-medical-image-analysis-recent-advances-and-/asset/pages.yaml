    # 3.4.4 DEEP LEARNING FOR CARDIAC IMAGING


    Deep learning is an algorithm that enables the study of information, estimate
    or prediction of future happening, decision-making, or the usage of the dataset
    (collected training data) that is used to identify complex patterns.


    A machine learning technique becomes a powerful tool for the execution of useful
    knowledge and making suitable decisions from big data. As it has increased in
    technical aspects, deep learning supports machine learning and is a connecting
    bridge to integrating big machinery with that of intelligent mediator health monitoring.
    Deep learning attempts modeling data with high-level representations and predicts
    patterns by arranging multiple layers of information using hierarchical architectures.
    Nowadays deep learning is adopted in a variety of applications like bioinformatics,
    computer vision, audio recognition, and automatic speech recognition.


    Neural network architectures are widely used in deep learning algorithms, and
    they use more than 150 hidden layers than traditional neural networks. Convolutional
    neural networks (CNN) are mostly used as deep neural networks, and the input data
    are conveys with learned features, and 2D data are processed using 2D convolutional
    layers.


    Using CNN the ECG signal may be easily classified for detection and diagnosis
    of the signals. It is proved that deep learning is widely used to detect R waves
    for the analysis of ECG arrhythmia classification.


    The big challenge for researchers is the implementation of the deep learning technique
    in ECG signals. Deep learning extends the limitation in access to the raw dataset
    and also needs high training and a specific platform for the computational process.


    The different data combinations for the ECG analysis were the raw ECG signal and
    extracted QRS complexes, along with entropy-based features calculated both in
    raw signals of ECG and the extracted QRS complexes. Research aspects normally
    entropy-based features with neural networks act a significant role in the analysis
    of ECG signals.'
