  md: '# Cardiovascular Health Diagnosis through Predictive Analysis


    # Algorithm 1: Genetic Algorithm for Hyperparameter optimization of LSTM

    1: population ← [list of n combination of hyperparameters]

    2: generation ← 0

    3: while (generation < 1) do:

    4: train and evaluate the LSTM(population)

    5: new_gen ← retrain fittest individuals

    6: new_gen ← append random individuals to promote diversity

    7: mutate (new_gen)

    8: new_gen ← append offspring through crossover until k

    9: population ← new_gen

    10: generation ← generation + 1

    11: output the parameter of the fittest in population


    In the hyperparameter optimization, the genetic algorithm takes the parameter
    values as sigmoid, ReLU, and as activation functions; SGD, AdaGrad, and Adam as
    optimizers; and 10⁻¹,¹⁻²,¹⁻³ as the learning rates. The genetic algorithm takes
    these values as the search space for the hyperparameter optimization for improving
    the prediction accuracy. First, the GA initializes the population from the search
    space for the hyperparameters randomly. Second, it validates the fitness of the
    model with two objective functions, namely accuracy and loss. In the genetic algorithm,
    while training the model, the hyperparameters with the highest accuracy are transferred
    for the new generation as parents. Subsequently, proceed with the processes of
    crossover and mutation. In the context of the initial variation, mutation is exclusively
    implemented on the survivor. As per the second variation, mutation is introduced
    across an entirely new generation once the crossover phase concludes. The crossover
    procedure involves the random selection of hyperparameters from each parent with
    equal probabilities. Parent selection is also executed with equiprobable chances
    among the survivor pool. Following the formation of the new generation, the cycle
    recycles, iteratively persisting until the specified termination condition is
    met. The output gives the LSTM model with optimal parameter values for activation
    function, optimizer, and learning rate. The optimized LSTM model achieves high
    prediction accuracy in heart disease prediction.


