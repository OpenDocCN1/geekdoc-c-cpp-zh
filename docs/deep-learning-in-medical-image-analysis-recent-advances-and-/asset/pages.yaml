    # 10.3.1 DATA PREPROCESSING


    The health data in the EHR repository is a large volume and needs to be processed
    for further analysis these EHR data were collected from various sources and the
    following issues persist in the EHR data, namely missing values, outliers, and
    redundancy of data. To address these issues 1) Bayesian principal component analysis
    is applied to impute the missing values in the EHR data; 2) Cook''s D method is
    used to detect the outliers; and 3) Pearson correlation analysis is performed
    to remove the redundancy of data in the EHR.


    **BPCA Based Missing Value Imputation:** Absent values within electronic health
    records (EHR) arise from mishandled samples, low signal-to-noise ratio (SNR),
    measurement inaccuracies, non-responses, or removal of anomalous data points.
    The method of Bayesian principal component analysis (BPCA), grounded in probabilistic
    Bayesian theory, is utilized for imputing these missing values [12]. BPCA employs
    observed values to compute the missing ones, disregarding the presence of missing
    data. By employing Bayes theorem, PCA is determined, and Bayesian estimation is
    employed to calculate the absent values.'
