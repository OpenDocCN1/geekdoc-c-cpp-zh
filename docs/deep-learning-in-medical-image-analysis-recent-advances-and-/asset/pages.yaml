    # 6.9 EVALUATION METRICS


    The ability to tell if an image is normal or not can be judged by its accuracy,
    sensitivity, and specificity.

    A classifier sorts all the things into their respective categories-. Objects are
    often incorrectly assigned classes due to imperfections in this process. To judge
    a classifier, you need to know the real class of the objects. To figure out the
    good classification is, the class that the classifier gave and the actual class
    are compared. This makes it possible to divide the objects into four subsets:


    +   - True positive (TP) means the classifier predicts properly.

    - The classifier predicts accurately. False positive (FP).

    - True negative (TN) means the classifier’s negative class is correct.

    - The classifier incorrectly assumes the class is negative.


    # 6.9.1 ACCURACY


    Using the amount of items in each of these subsets, statistical values may be
    determined for the classifier. It is only acceptable if the various classes are
    approximately distributed in the same manner. Precision may be quantified. Accuracy
    is a common and extensively employed method, it’s advantageous if the dataset’s
    classes are evenly distributed.


    > $Accuracy = (TP + TN) / (TP + TN + FP + FN) \quad (6.1)$


