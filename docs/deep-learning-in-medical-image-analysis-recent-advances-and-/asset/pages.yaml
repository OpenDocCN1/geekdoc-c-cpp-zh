  md: '# 1 Journey into the Digital Frontier


    # Demystifying Neural Networks and Deep Learning


    Anitha Julian and R. Ramyadevi


    # 1.1 INTRODUCTION


    Section 1.2 gives an overview on the basic concepts of neural networks and deep
    learning. It also explains the types of neurons namely, perceptron and sigmoid
    neuron.


    Section 1.3 elaborately discusses the real-life applications of neural networks.
    The thrust is on its implications to medical applications. An overview of the
    varied medical applications wherein artificial intelligence (AI) plays a major
    role are detailed.


    Section 1.4 covers the working of the neural network namely the backpropagation
    algorithm. This algorithm is a fundamental algorithm in deep learning and has
    enabled the development of a wide range of neural network architectures that can
    solve complex problems.


    Section 1.5 shows how neural networks can be improved to perform any sort of function
    while solving problems. This calls for picking the cross-entropy cost function,
    a better cost function. Four regularization techniques, namely, L1 and L2 regularization,
    dropout, and artificial extension of the training data, as well as effective methods
    for setting the network''s weights, are provided. These techniques also improve
    the neural networks'' ability to generalize beyond the training data.


    Section 1.6 discusses the role of deep learning as an advancement over neural
    networks. Deep learning''s capacity to automatically discover valuable characteristics
    from raw data, as opposed to requiring human experts to manually extract features,
    is one of its primary advantages. This has eliminated the need for considerable
    feature engineering and allowed the development of very precise systems in a variety
    of applications.


    # 1.2 OVERVIEW ON NEURAL NETWORKS AND DEEP LEARNING


    Neural networks are machine learning algorithms that are modelled after the functionality
    and organization of the human brain. Neurons, are interconnected nodes that communicate
    with one another to process and analyze input, make up'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 2 Deep Learning in Medical Image Analysis


    systems. A neural network''s neurons are arranged into layers, each layer handling
    a particular component of data processing. While the output layer creates the
    network''s ultimate output, the input layer receives the raw data. In between,
    there can be one or more hidden layers that perform complex computations on the
    data.


    For tasks like audio and image identification, natural language processing, and
    decision-making, neural networks are especially well-suited [1]. With the use
    of neural networks with several layers, deep learning has produced impressive
    outcomes for applications, including self-driving cars, medical diagnosis, and
    game play. As a result of prior work by Warren McCulloch and Walter Pitts, Frank
    Rosenblatt created an artificial neuron as a perceptron in the 1950s to 60s.


    Many inputs, each of which can be either 0 or 1, are fed to a perceptron, which
    outputs a single binary output, either 0 or 1. The inputs are multiplied by weights,
    which are values that the perceptron learns through a training process. The weighted
    inputs are then summed together, and a threshold value is applied to the result.
    If the sum exceeds the threshold, the perceptron outputs 1; otherwise, it outputs
    0. Mathematically, this is represented as,


    ```

    output = 0if ∑(w,x)≤ threshold

    ```


    ```

    if ∑(w,x)≤ threshold (1.1)

    ```


    where wᵢ are the weights associated with each input xᵢ.

    The structure of a perceptron is as displayed in Figure 1.1. A technique for improving
    the accuracy of the perceptron''s output is the perceptron learning algorithm.
    It involves changing the weights of the inputs. It functions by comparing the
    perceptron''s actual output with the desired output (the right response) and then
    modifying the weights to get the perceptron''s output closer to the desired output.
    This process is repeated many times until the perceptron can accurately classify
    the inputs.


    The limitation with perceptron is that they are capable of classifying data that
    can be divided into two classes by a single straight line or is linearly separable.
    For more complex classification tasks, other types of artificial neurons, such
    as sigmoid neurons, are needed.


    Sigmoid neurons are a type of artificial neuron that was first introduced in the
    1980s. Unlike perceptron, which can produce binary outputs (0 or 1), sigmoid neurons
    can produce outputs that range from 0 to 1, which enables them to model data with
    more intricate patterns and correlations.


    ![](img/192a3c2b5cb8c569671157e67252f59e_12_0.png)


    FIGURE 1.1 Structure of a perceptron'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Journey into the Digital Frontier


    Sigmoid neurons work by taking in several inputs, which can be real numbers rather
    than just binary values. Each input is multiplied by a weight, and the weighted
    inputs are summed together. The output of a sigmoid neuron is decided by passing
    the sum through a sigmoid function, which "squashes" the output to a between 0
    and 1, as opposed to merely applying a threshold like a perceptron. The S-shaped
    curve of a sigmoid function allows it to model non-linear relationships between
    inputs and outputs. Mathematically, the output of a sigmoid neuron can be represented
    as,


    ```

    output = \frac{1}{1+e^{-\sum(w,x)}}

    ```


    where $e$ is the mathematical constant known as Euler''s number, $w$, are the
    weights associated with each input $x_i$, and the sum is taken over all the inputs.


    Gradient descent is a method for training sigmoid neurons that involves changing
    the weights to reduce the cost function, which determines the difference between
    the desired and actual outputs. This process can be repeated many times with the
    goal of improving the accuracy of the sigmoid neuron''s predictions on new data.
    Sigmoid neurons are used extensively in modern neural networks, including deep
    learning models that are capable of learning complex patterns in large datasets.


    # 1.2.1 ARCHITECTURE OF NEURAL NETWORKS


    Input neurons are the neurons that make up the input layer, which is the leftmost
    layer in this network. The output neurons, or in this case, just one output neuron,
    are found in the rightmost output layer. Since the neurons in the middle layer
    are neither inputs nor outputs, this is known as a hidden layer.


    Some networks contain more hidden layers than the network shown in Figure 1.2,
    which only has one. The four-layer network shown in Figure 1.3, for instance,
    has two hidden layers.


