    # 3.4.1 ECG SIGNAL ANALYSIS USING WAVELET TRANSFORM IN MATLAB


    The analysis of ECG signals becomes more difficult due to the variation of morphological
    factors in the waveform in large numbers not only with different patients but
    also with the same patient at different times. The result ECG waveforms are different
    for the same patient, and they are for the different types of beats.


    The transform is mostly used in a wavelet-based transform, which is used to denoise
    and detect the trends among signals, breakdown points, and discontinuity of higher
    derivatives in signals [62, 63]. Here db4 wavelet is used on the ECG signal for
    the detection of impulse and its discontinuity frequency elements. The impulse
    signal is generated artificially with the predefined data of the ECG signal for
    our analysis purposes [64]. The db4 wavelet is used for the analysis of the signal
    in the frequency domain. Here three level decomposition is applied to the signal.


    The denoising of the signal is achieved by DWT, and it can be done by the decomposition
    of the signal at a certain level and applying the threshold to the obtained DWT
    coefficients and finally reconstructing the signal to its original signal. Three
    procedures are carried out for denoising the signal; initially, the wavelet analysis
    method is applied to a noisy signal with level N, then thresholding is applied
    on each coefficient from 1 to N level, and finally the signal is synthesized with
    the help of detail coefficients with 1 to N level and approximation coefficients
    of even N. It is not possible to remove noisy signals with corruption.


    We calculate the global threshold for values by:


    ```

    δ = \sqrt{2logL}

    ```


    Where the standard deviation of the DWT coefficients is expressed as σ and also
    the number of pixels or samples of the signal processed is expressed as L and
    the threshold values are estimated using the MATLAB tool.


    The ECG signal is decomposed up to the third level by convolving it with a db2
    filter, which involves down-sampling by a factor of 2. This process extracts both'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'the detail and approximate coefficients. Normally approximation and detailed
    coefficients are obtained by low pass and high-pass filter g(l) at each level
    and further decomposed for the next level.


    Analysis of the HRV (heart rate variability) signal with different resolutions
    is carried out on decomposition with elementary function in time and frequency
    domains. These elementary functions are called wavelets. We performed a multilevel
    decomposition of the IHR (instantaneous heart rate) signal by DWT. The lowest
    frequency components of the IHR signal are used for the analysis of long-term
    modulation in the ANS (automatic nervous system), it leads to an effect on the
    power spectra of HRV signals. We used the wavelet transform method to de-trend
    the IHR signal.


    The method proposed here can detects and artifacts in the signal. It provides
    a multi-resolution analysis. Since the behavior of the ANS can be tracked by DWT
