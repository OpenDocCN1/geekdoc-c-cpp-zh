    # ## 5.1 INTRODUCTION


    A retinal eye condition called diabetes-related retinopathy affects the retina.
    Diabetes can strike anyone at any time. Diabetes-related retinopathy can cause
    blindness or vision loss if left untreated. This occurs when damaged retinal blood
    nerves are the outcome of blood sugar. Alternately, they could close, preventing
    blood flow. On the retina, aberrant new blood vessels can occasionally form.


    The diabetic eye disease has two stages, the earliest stage of diabetic retinopathy
    is called nonproliferative diabetic retinopathy (NPDR) and the later stage is
    proliferative retinopathy. There are many people who have diabetes and the more
    severe form of diabetic retinopathy is called proliferative diabetic retinopathy(PDR).
    When the retina continues to develop new blood vessels, PDR can damage both the
    central and peripheral(side)vision, which is a very significant issue.


    # ### 5.1.1 CAUSES OF DIABETIC RETINOPATHY


    A variety of vision problems and diabetic retinopathy, which recognized as harm
    to the retinal blood nerves of the eye, can be driven by diabetes. Over time,
    possessing too much sugar in the blood can cause the minuscule capillaries to
    become blocked, severing that organ''s blood supply. The eye makes an effort to
    develop new blood vessels which are are highly susceptible to leaks. Failing treatment,
    these damaged arteries could lead to ischemia, inflammation, and eventually legal
    blindness.


    A person with diabetic retinopathy can still have good distance vision; treatment
    options include infusion of medications, laser therapy, and surgery; prompt treatment
    can help repair the damage caused by diabetic retinopathy and help prevent blindness.
    Diabetic retinopathy directly impacts 50 percent of the population with diabetes
    and is the top reason for irreversible visualization loss.


