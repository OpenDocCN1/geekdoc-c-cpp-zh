    each cluster, FCM assigns a random membership grade to each data point. FCM iteratively
    updates cluster centers and membership grades to determine a data point''s cluster
    membership. In this iteration, we minimize a distance objective function between
    each data point and the cluster center, where each data point''s weight in the
    objective function is determined by its membership in the cluster.


    # 7.4.3.1 Algorithm


    FCM clustering each data point to multiple groups. For FCM, the following objective
    function serves as the:


    ```

    $F_m = \sum_{i=1}^{D} \sum_{j=1}^{N} Z_{ij}^m ||A_i - B_j||^2$

    ```


    where


    +   - The number of data points is denoted by D.

    - N denotes the number of clusters.

    - The fuzzy partition exponent m > 1 determines fuzzy overlap. Fuzzy overlap,
    the percentage of data points in multiple clusters, indicates group fuzzness.

    - The datapoint $X^i$ is denoted by $A_i$.

    - The $Y^j$ has a cluster located at $B_j$.

    - $Z_{ij}$ represents $A_i$''s $X^j$ cluster membership. The sum of all cluster
    membership values for $X$ equals one. for fcm:

    - Initialize the cluster membership values at random, $Z_{ij}$.

    - Determine the cluster centers:


    ```

    $A_i = \sum_{j=1}^{D} \frac{Z_{ij}^m}{Z_{ij}} A_j$

    $B_j = \sum_{i=1}^{D} Z_{ij}^m$

    ```


    Update $Z_{ij}$ as follows:


    ```

    $Z_{ij} = \sum_{k=1}^{N} \frac{||A_i - B_j||}{||A_i - B_k||} 2m-1$

    ```


    +   - Determine the objective function, $F_m$.

    - Repeat steps 2–4 until $F_m$ has improved by the desired amount or until a predetermined
    limit has been reached in the total number of iterations.


