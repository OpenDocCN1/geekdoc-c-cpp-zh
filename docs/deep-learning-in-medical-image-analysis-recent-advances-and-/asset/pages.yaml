    rate is increasing every year. Advances in the identification CVDs enable perfect
    assessment and treatment of cardiovascular diseases. Medical imaging techniques
    such as CT, MRI, and ultrasound methods are widely used to find the anatomy of
    cardiac structures, their movement patterns, and functional aspects and provide
    support for prognosis, monitor the disease, diagnose and find better options for
    therapy [69]. The use of artificial intelligence, deep learning, and machine learning
    demonstrated a powerful tool for interpreting and analyzing medical images, identifying
    and predicting diseases, and Echocardiography serves as the integral part of cardiac
    medical practice [70]. Many echocardiographic variables, with speckle tracking
    and vector flow mapping made it difficult for physicians to evaluate the outcomes
