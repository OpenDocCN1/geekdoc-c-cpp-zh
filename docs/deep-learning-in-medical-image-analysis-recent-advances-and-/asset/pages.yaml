    are so precise. The feature is learned by a CNN, which then utilizes its presence
    to determine the overall probability that an image containing the items with the
    spotted features will. In addition to recognizing the qualities, a capsule network
    also recognizes their orientation and relationships and the probability that they
    belong to higher-level objects in the hierarchy of parts. Each capsule counts
    the quantity of lower-level features and presents the length, thickness, rotation,
