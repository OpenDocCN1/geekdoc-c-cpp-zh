  trans: "\n在这种情况下，主线程将打印其消息并继续执行，无需等待新线程完成。新线程将在后台运行，并在延迟 2 秒后完成。当你有不需要与主线程同步的长时间耗时任务时，分离线程（Detaching\
    \ threads）非常有用。然而应该谨慎使用分离，因为如果处理不当，可能会导致资源管理问题。\n\n### 向线程传递参数\n\n有时，线程需要带有参数工作，例如任务所需的数据或参数。`std::thread`\
    \ 构造函数允许你向线程将执行的函数或可调用对象传递参数。参数默认按值传递，但你也可以使用 `std::ref()` 包装器通过引用传递参数。\n\n这是一个向线程传递参数的示例：\n\
    \n```cpp\n#include <iostream>\n#include <thread>\n\nvoid task(int x, const std::string&\
    \ message)\n{\n    std::cout << \"Thread received: \" << x << \", \" << message\
    \ << \"\\n\";\n}\n\nint main()\n{\n    int num = 10;\n    std::string msg = \"\
    Hello from thread!\";\n    std::thread t(task, num, std::ref(msg)); // 向线程传递参数\n\
    \    t.join();\n    return 0;\n}\n```\n\n在这个示例中，创建线程是为了执行 `task()` 函数，该函数接受两个参数：一个整数和一个字符串。变量\
    \ `num` 按值传递，而变量 `msg` 通过 `std::ref()` 按引用传递。这确保了线程内部对 `msg 进行 进行的任何修改都会反映在主线程中，因为两个线程共享相同的内存空间。\n\
    \n向线程按值传递参数是直接的，但按引用传递参数需要特别注意同步，特别是当共享数据被多个线程修改时。如果没有适当的同步机制，可能会发生竞态条件（race conditions），即程序的输出取决于线程执行的不可预测的时间机。\n\
    \n### 线程同步\n\n多线程编程的主要挑战之一是确保多个线程能够安全地访问共享资源，而不引起冲突。线程同步是指用于控制多个线程访问共享数据的机制。如果没有适当的同步，线程可能会覆盖彼此的数据或读取不一致的状态，导致如竞态条件、死锁和数据损坏等错误。\n\
    \nC++ 提供了几种同步原语来帮助管理对共享资源的访问，包括互斥锁（mutexes）、条件变量（condition variables）和原子操作（atomic\
    \ operations）。这些原语确保了一次只有一个线程可以访问共享资源，或者线程可以协调它们的执行以避免冲突。\n\n**Mutex**: 互斥锁（\"\
    mutual exclusion\" 的缩写）是一种同步原语，它确保一次只有一个线程可以锁定并访问共享资源。其他尝试锁定同一互斥锁的线程将被阻塞，直到所有线程解锁该互斥锁。当多个线程需要访问或修改相同数据时，互斥锁对于防止竞态条件有用。\n\
    \n这是一个使用互斥锁保护共享数据的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include\
    \ <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\nvoid increment()\n{\n  \
    \  std::lock_guard<std::mutex> lock(mtx); // 在访问共享数据前锁定互斥锁\n    ++shared_data;\n\
    \    std::cout << \"Shared data: \" << shared_data << \"\\n\";\n}\n\nint main()\n\
    {\n    std::thread t1(increment);\n    std::thread t2(increment);\n    t1.join();\n\
    \    t2.join();\n    return 0;\n}\n```\n\n在这个示例中，两个线程尝试增加同一个共享数据。`std::lock_guard`\
    \ 在访问共享数据之前自动锁定 `mutex`，并在锁超出作用域时自动解锁。这确保了一次只有一个线程可以修改 `shared_data`，从而防止了竞态条件。\n\
    \n**Condition Variables**: 条件变量用于协调多个线程的执行，允许一个线程在满足特定条件时向另一个线程发送信号。这在一个线程在继续操作之前需要等待另一个线程完成任务的情况下非常有用。\n\
    \n**Atomic Operations**: 原子操作提供了一种在共享数据上执行线程安全操作的方法，而不需要显式的锁（explicit-locks）。这些操作被保证在不被中断的情况下执行，确保在操作执行期间没有其他线程可以访问该数据。\n\
    \n### C++ 多线程编程的最佳实践\n\n多线程编程引入了新的挑战，例如竞态条件、死锁和同步开销。为了在 C++ 中编写高效且可靠的多线程程序，遵循最佳实践是非常重要的，包括：\n\
    \n- **最小化共享状态**：减少线程之间的共享数据量，以减少对同步的需求。共享数据越少，线程之间发生冲突的机会就越少。\n- **使用 RAII 进行锁定**：使用资源获取即初始化（RAII）技术，如\
    \ `std::lock_guard`，自动管理锁的获取和释放。这确保了即使发生异常或提前返回，锁也能被正确释放。\n- **优先使用原子操作**：在可能的情况下，使用原子操作代替互斥锁以避免锁的开销。原子操作更快、更简单，是低级同步的理想选择。\n\
    - **避免死锁**：死锁发生在两个或多个线程互相等待对方释放资源时，导致执行的永久停止。为了避免死锁，请按一致的顺序获取锁，并在等待锁时使用尝试锁（try-lock）机制或超时。\n\
    - **彻底测试**：多线程程序可能会表现出难以重现的微妙错误，例如竞态条件和计时问题。在不同条件和不同硬件配置下测试多线程代码对于确保正确性至关重要。\n"
- fmt: "\n# Mutexes: Ensuring Mutual Exclusion\n\nA mutex (short for mutual exclusion)\
    \ is a synchronization primitive that ensures only one thread can access a critical\
    \ section of code at a time. When a thread locks a mutex, other threads attempting\
    \ to lock the same mutex are blocked until the mutex is unlocked. This ensures\
    \ that shared resources are accessed by only one thread at a time, preventing\
    \ race conditions and data corruption.\n\nIn C++, the `std::mutex` class, introduced\
    \ in C++11, provides an easy-to-use interface for managing mutual exclusion. A\
    \ thread can lock a mutex using the `lock()` method and unlock it using the `unlock()`\
    \ method.\n\nHere’s an example of using a mutex to protect shared data:\n\n```cpp\n\
    #include <iostream>\n#include <thread>\n#include <mutex>\n\nstd::mutex mtx;\n\
    int shared_data = 0;\n\nvoid increment()\n{\n    mtx.lock();             // Lock\
    \ the mutex before accessing shared data\n    ++shared_data;\n    std::cout <<\
    \ \"Shared data: \" << shared_data << \"\\n\";\n    mtx.unlock();           //\
    \ Unlock the mutex after accessing shared data\n}\n\nint main()\n{\n    std::thread\
    \ t1(increment);\n    std::thread t2(increment);\n    t1.join();\n    t2.join();\n\
    \    return 0;\n}\n```\n\nIn this example, two threads (`t1` and `t2`) attempt\
    \ to increment the `shared_data` variable. The mutex `mtx` ensures that only one\
    \ thread can modify `shared_data` at a time. Without the mutex, both threads could\
    \ simultaneously read the same value of `shared_data`, increment it, and write\
    \ the same result, leading to a lost update.\n\nIt is important to always unlock\
    \ a mutex after locking it to prevent deadlocks, where a thread waits indefinitely\
    \ for a resource that it has already locked. Forgetting to unlock a mutex can\
    \ lead to a situation where no other thread can access the shared resource, halting\
    \ the program’s execution.\n\n## Locking Mechanisms: std::lock_guard and std::unique_lock\n\
    \nManually locking and unlocking a mutex can be error-prone, especially when exceptions\
    \ or early returns are involved. If an exception occurs between a `lock()` and\
    \ an `unlock()`, the mutex may remain locked, leading to a deadlock. To address\
    \ this issue, C++ provides RAII (Resource Acquisition Is Initialization)-based\
    \ locking mechanisms, such as `std::lock_guard` and `std::unique_lock`, which\
    \ automatically lock and unlock a mutex when the lock object is created and destroyed.\n\
    \n`std::lock_guard`:\nThis class provides a simple and efficient way to manage\
    \ a mutex. It locks the mutex when the `lock_guard` object is created and unlocks\
    \ it when the object goes out of scope, ensuring that the mutex is always properly\
    \ released, even in the case of exceptions.\n\nHere’s an example using `std::lock_guard`:\n\
    \n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\nstd::mutex\
    \ mtx;\nint shared_data = 0;\n\nvoid increment()\n{\n    std::lock_guard<std::mutex>\
    \ lock(mtx); // Lock the mutex using lock_guard\n    ++shared_data;\n    std::cout\
    \ << \"Shared data: \" << shared_data << \"\\n\";\n}\n\nint main()\n{\n    std::thread\
    \ t1(increment);\n    std::thread t2(increment);\n    t1.join();\n    t2.join();\n\
    \    return 0;\n}\n```\n\nIn this example, the `std::lock_guard` automatically\
    \ locks the mutex when the lock object is created and unlocks it when the lock\
    \ object goes out of scope. This eliminates the need to manually unlock the mutex\
    \ and ensures that the mutex is always released, even if an exception occurs.\n\
    \n`std::unique_lock`:\nThis class provides more flexibility than `std::lock_guard`.\
    \ It allows you to lock and unlock a mutex multiple times, defer locking until\
    \ a later point, or transfer ownership of the lock between different threads.\
    \ `std::unique_lock` is useful when more control over the locking behavior is\
    \ needed, such as when using condition variables (discussed later in this chapter).\n\
    \nHere’s an example of using `std::unique_lock`:\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\
    \nvoid increment()\n{\n    std::unique_lock<std::mutex> lock(mtx); // Lock the\
    \ mutex using unique_lock\n    ++shared_data;\n    std::cout << \"Shared data:\
    \ \" << shared_data << \"\\n\";\n    lock.unlock();           // Manually unlock\
    \ the mutex before the end of the function\n}\n\nint main()\n{\n    std::thread\
    \ t1(increment);\n    std::thread t2(increment);\n    t1.join();\n    t2.join();\n\
    \    return 0;\n}\n```\n\nIn this example, `std::unique_lock` provides the flexibility\
    \ to manually unlock the mutex before the function ends. This can be useful when\
    \ you need to release the mutex early, allowing other threads to access the shared\
    \ resource while still performing other tasks in the current thread.\n\n## Deadlocks\
    \ and How to Avoid Them\n\nA deadlock occurs when two or more threads are blocked,\
    \ waiting for each other to release resources that they have already locked. Deadlocks\
    \ typically arise when threads acquire multiple locks in different orders, causing\
    \ a circular dependency where each thread holds a lock that the other thread needs.\n\
    \nHere’s a simple example of how a deadlock can occur:\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <mutex>\n\nstd::mutex mtx1, mtx2;\n\nvoid task1()\n\
    {\n    std::lock_guard<std::mutex> lock1(mtx1); // Lock mtx1\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // Simulate work\n    std::lock_guard<std::mutex> lock2(mtx2); // Try to lock\
    \ mtx2\n    std::cout << \"Task 1 completed\\n\";\n}\n\nvoid task2()\n{\n    std::lock_guard<std::mutex>\
    \ lock2(mtx2); // Lock mtx2\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // Simulate work\n    std::lock_guard<std::mutex> lock1(mtx1); // Try to lock\
    \ mtx1\n    std::cout << \"Task 2 completed\\n\";\n}\n\nint main()\n{\n    std::thread\
    \ t1(task1);\n    std::thread t2(task2);\n    t1.join();\n    t2.join();\n   \
    \ return 0;\n}\n```\n"
