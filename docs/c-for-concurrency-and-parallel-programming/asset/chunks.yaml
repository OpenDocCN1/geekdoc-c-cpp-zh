    std::lock_guard<std::mutex> lock1(mtx1); // Lock mtx1


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::lock_guard<std::mutex> lock2(mtx2); // Try to lock mtx2


    std::cout << "Task 1 completed\n";


    }


    void task2()


    {


    std::lock_guard<std::mutex> lock2(mtx2); // Lock mtx2


    std::this_thread::sleep_for(std::chrono::milliseconds(100)); // Simulate work


    std::lock_guard<std::mutex> lock1(mtx1); // Try to lock mtx1


    std::cout << "Task 2 completed\n";


    }


    int main()


    {


    std::thread t1(task1);


    std::thread t2(task2);


    t1.join();


    t2.join();


    return 0;


    }


    In this example, task1() locks mtx1 first and then tries to lock mtx2, while task2()
    locks mtx2 first and then tries to lock mtx1. Since both threads are waiting for
    each other to release the locks, they are deadlocked, and the program will hang
    indefinitely.


    To avoid deadlocks, follow these best practices:


    Lock Hierarchy: Always acquire locks in a predefined, consistent order. This ensures
    that threads will not wait for locks in conflicting orders, preventing circular
    dependencies.


    Avoid Locking Multiple Resources: If possible, design your program to minimize
    the need for multiple locks. Reducing the number of locks reduces the risk of
    deadlocks.


    Use std::lock: The C++ Standard Library provides the std::lock() function, which
    locks multiple mutexes in a way that avoids deadlocks by ensuring that all locks
    are acquired at the same time. If any lock cannot be acquired, the function releases
    all previously acquired locks and retries.


    Here’s an example of using std::lock to avoid deadlocks:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    #include <mutex>


    std::mutex mtx1, mtx2;


    void task1()


    {


    std::lock(mtx1, mtx2); // Lock both mutexes at once to avoid deadlock


    std::lock_guard<std::mutex> lock1(mtx1, std::adopt_lock);


    std::lock_guard<std::mutex> lock2(mtx2, std::adopt_lock);


    In the above example, two threads (t1 and t2) attempt to increment the shared_data
    variable. The mutex mtx ensures that only one thread can modify shared_data at
    any given moment. Without proper synchronization, both threads might read the
    same value before either has had a chance to write the incremented value back,
    resulting in a lost update.


    However, it’s important to remember that forgetting to unlock a mutex can lead
    to deadlocks, where a thread waits indefinitely for a mutex it already holds,
    blocking all other threads that need access to that mutex. Thus, it is critical
    to always unlock a mutex after locking it.


    #### Locking Mechanisms: std::lock_guard and std::unique_lock


    Manual management of mutex locks and unlocks can introduce errors, especially
    in the presence of exceptions or complex control flows. To mitigate these issues,
    C++ offers RAII (Resource Acquisition Is Initialization)-based locking mechanisms:
    std::lock_guard and std::unique_lock.'
