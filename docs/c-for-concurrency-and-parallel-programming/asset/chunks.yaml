- fmt: "\nC++ has evolved significantly in its support for concurrency and parallelism,\
    \ particularly with the introduction of `C++11`, which added a rich set of multithreading\
    \ features to the standard library. These features have continued to be expanded\
    \ in subsequent versions of C++, such as `C++14`, `C++17`, and `C++20`, making\
    \ C++ a powerful language for building concurrent and parallel applications.\n\
    \nPrior to `C++11`, developers had to rely on platform-specific APIs or third-party\
    \ libraries, such as POSIX threads (`pthread`) or `Boost`, to implement multithreading\
    \ in C++`. These APIs provided basic threading capabilities but lacked the portability\
    \ and ease of use that modern C++` developers expect.\n\nWith `C++11`, the language\
    \ introduced a standardized threading model, which includes support for creating\
    \ and managing threads, synchronization primitives, and atomic operations. Some\
    \ of the key concurrency features introduced in `C++11` and beyond include:\n\n\
    - `std::thread`: A class for creating and managing threads. The `std::thread`\
    \ class provides a simple interface for starting, joining, and detaching threads,\
    \ allowing developers to create multithreaded programs with minimal effort.\n\
    - `std::mutex` and `std::lock_guard`: Synchronization primitives that ensure safe\
    \ access to shared resources in multithreaded programs. Mutexes provide exclusive\
    \ access to shared data, while `std::lock_guard` automatically locks and unlocks\
    \ a `mutex`, ensuring that resources are properly protected.\n- `std::condition_variable`:\
    \ A synchronization primitive used for thread communication. Condition variables\
    \ allow one thread to signal another thread when a certain condition is met, enabling\
    \ more complex synchronization patterns.\n- `std::future` and `std::promise`:\
    \ Tools for asynchronous programming. `std::future` represents a value that will\
    \ be computed in the future, while `std::promise` allows a value to be set asynchronously\
    \ by another thread. Together, these constructs enable task-based parallelism\
    \ and asynchronous computations.\n- `std::atomic`: A class template for atomic\
    \ operations. Atomic operations provide a way to safely manipulate shared data\
    \ without the need for explicit locking, reducing the risk of race conditions\
