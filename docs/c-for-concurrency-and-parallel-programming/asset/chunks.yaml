    public:


    ThreadPool(size_t numThreads);


    ~ThreadPool();


    void enqueueTask(std::function<void()> task);


    private:


    std::vector<std::thread> workers; // Vector of worker threads


    std::queue<std::function<void()>> tasks; // Queue of tasks


    std::mutex queueMutex; // Mutex for task queue


    std::condition_variable condition; // Condition variable for task notification


    bool stop; // Flag to indicate pool shutdown


    void workerThread();


    };


    Constructor and Destructor: The constructor initializes the thread pool by creating
    a specified number of threads, while the destructor ensures all threads are properly
    joined before the pool is destroyed.


    cpp


    Copy code


    ThreadPool::ThreadPool(size_t numThreads) : stop(false) {


    for (size_t i = 0; i < numThreads; ++i) {


    workers.emplace_back([this] { workerThread(); });


    }


    }


    ThreadPool::~ThreadPool() {


    {


    std::lock_guard<std::mutex> lock(queueMutex);


    stop = true;


    }


    condition.notify_all();


    for (std::thread &worker : workers) {


    worker.join();


    }


