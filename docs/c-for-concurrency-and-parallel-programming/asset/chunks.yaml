  trans: "\n互斥量（Mutex，mutual exclusion 的缩写）是 C++ 中一种基本的同步原语。互斥量一次允许一个线程访问资源，从而有效地防止竞态条件。当一个线程锁定互斥量时，尝试锁定同一互斥量的其他线程将被阻塞，直到其被解锁。\n\
    \nC++ 中的 `std::mutex` 类提供了互斥量的基本功能。以下是使用互斥量的方法：\n\n- **加锁（Locking a Mutex）**：使用\
    \ `lock()` 方法获取互斥量。如果互斥量已被另一个线程锁定，调用线程将阻塞直到互斥量可用。\n- **解锁（Unlocking a Mutex）**：使用\
    \ `unlock()` 方法释放互斥量。应该小心操作，以避免导致互斥量处于锁定状态引发死锁。\n- **使用 std::lock_guard 进行作用域锁定**：为了避免手动解锁并确保互斥量在离开作用域时释放，请使用\
    \ `std::lock_guard`。这种 RAII（资源获取初始化）技术会在 guard 离开作用域时自动解锁互斥量。\n\n这是一个使用 `std::mutex`\
    \ 的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\n\
    std::mutex mtx;\nint counter = 0;\n\nvoid increment()\n{\n    for (int i = 0;\
    \ i < 1000; ++i)\n    {\n        std::lock_guard<std::mutex> lock(mtx); // 自动锁定并解锁互斥量\n\
    \        ++counter; // 安全增加计数器\n    }\n}\n\nint main()\n{\n    std::thread t1(increment);\n\
    \    std::thread t2(increment);\n    t1.join();\n    t2.join();\n    std::cout\
    \ << \"Final counter value: \" << counter << std::endl; // 输出一致\n    return 0;\n\
    }\n```\n\n在这个示例中，`std::lock_guard` 确保了在递加操作期间互斥量是被锁定的，防止了竞态条件。最终计数器的值始终为 2000。\n\
    \n### 条件变量\n\nCondition Variables\n\n条件变量是另一种同步机制，允许线程等待某些条件的满足。它们通常与互斥量配合使用。条件变量允许线程阻塞，直到另一个线程通知它条件已更改，通常使用\
    \ `notify_one()` 或 `notify_all()` 方法。\n\n以下是使用条件变量的方法：\n\n- **在条件变量等待（Wait on\
    \ a Condition Variable）**：线程可以在条件变量上等待，这会释放关联互斥量并阻塞线程直到收到通知。\n- **通知线程（Notify\
    \ Threads）**：当条件变化时，线程可以使用 `notify_one()`（唤醒一个等待线程）或 `notify_all()`（唤醒所有等待线程）通知其他等待线程。\n\
    \n这是一个演示条件变量的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\
    #include <condition_variable>\n\nstd::mutex mtx;\nstd::condition_variable cv;\n\
    bool ready = false; // 条件变量\n\nvoid worker()\n{\n    std::unique_lock<std::mutex>\
    \ lock(mtx);\n    cv.wait(lock, [] { return ready; }); // 等待 ready 为 true\n  \
    \  std::cout << \"Worker thread proceeding.\\n\";\n}\n\nint main()\n{\n    std::thread\
    \ t(worker);\n    std::cout << \"Main thread doing some work...\\n\";\n    std::this_thread::sleep_for(std::chrono::seconds(1));\
    \ // 模拟工作\n    {\n        std::lock_guard<std::mutex> lock(mtx);\n        ready\
    \ = true; // 改变条件\n    }\n    cv.notify_one(); // 通知工作线程\n    t.join();\n    return\
    \ 0;\n}\n```\n\n在这个示例中，工作线程等待 `ready` 条件变为 true。主线程模拟了一些工作，然后通知工作线程继续。\n\n###\
    \ 读写锁\n\nRead-Write Locks\n\n读写锁允许多个读取者并发访问，或允许一个写入者独占访问。当读操作频率高于写操作时，这种机制是有益的，因为它允许多个线程同时读取而不会互相阻塞。\n\
    \nC++ 提供了 `std::shared_mutex` 来实现此目的：\n\n- **共享锁（Shared Lock）**：多个线程可以并发获取共享锁，允许它们读取共享资源。\n\
    - **互斥锁（Exclusive Lock）**：只有一个线程可以获取互斥锁，允许其写入共享资源。\n\n这是一个使用 `std::shared_mutex`\
    \ 的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <shared_mutex>\n\
    \nstd::shared_mutex rw_mutex;\nint shared_data = 0;\n\nvoid read()\n{\n    std::shared_lock<std::shared_mutex>\
    \ lock(rw_mutex);\n    std::cout << \"Reading data: \" << shared_data << \"\\\
    n\";\n}\n\nvoid write()\n{\n    std::unique_lock<std::shared_mutex> lock(rw_mutex);\n\
    \    ++shared_data; // 增加共享数据\n    std::cout << \"Writing data: \" << shared_data\
    \ << \"\\n\";\n}\n\nint main()\n{\n    std::thread t1(read);\n    std::thread\
    \ t2(write);\n    std::thread t3(read);\n    t1.join();\n    t2.join();\n    t3.join();\n\
    \    return 0;\n}\n```\n\n在这个示例中，读取线程可以并发访问 `shared_data`，而写入线程在修改数据时拥有独占访问权限。这种机制在读操作占主导地位的场景下可以提高性能。\n\
    \n### 屏障\n\nBarriers\n\n屏障是允许多个线程在执行的某一点进行同步的机制。在任何线程继续执行之前，所有线程必须到达屏障处。C++ 没有内置的屏障，但可以使用条件变量和互斥量来实现。\n\
    \n这是一个屏障的简化实现：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <mutex>\n\
    #include <condition_variable>\n\nclass Barrier {\npublic:\n    Barrier(int count)\
    \ : thread_count(count), current_count(0) {}\n    void wait()\n    {\n       \
    \ std::unique_lock<std::mutex> lock(mtx);\n        ++current_count;\n        if\
    \ (current_count == thread_count)\n        {\n            current_count = 0; //\
    \ 为后续使用重置\n            cv.notify_all(); // 通知所有等待的线程\n        }\n        else\n\
    \        {\n            cv.wait(lock); // 等待所有线程到达屏障\n        }\n    }\nprivate:\n\
    \    int thread_count;\n    int current_count;\n    std::mutex mtx;\n    std::condition_variable\
    \ cv;\n};\n\nvoid threadFunction(Barrier& barrier)\n{\n    std::cout << \"Thread\
    \ reaching the barrier.\\n\";\n    barrier.wait();\n    std::cout << \"Thread\
    \ passed the barrier.\\n\";\n}\n\nint main()\n{\n    const int thread_count =\
    \ 3;\n    Barrier barrier(thread_count);\n    std::thread t1(threadFunction, std::ref(barrier));\n\
    \    std::thread t2(threadFunction, std::ref(barrier));\n    std::thread t3(threadFunction,\
    \ std::ref(barrier));\n    t1.join();\n    t2.join();\n    t3.join();\n    return\
    \ 0;\n}\n```\n\n在这个示例中，三个线程在继续之前之前屏障处同步，确保它们都到达了同一个执行点。\n\n#### 结论\n\nC++ 中的同步机制对于管理共享资源的并发访问至关重要。理解如何有效地使用互斥量、条件变量、读写锁和屏障，对于构建健壮的多线程应用程序至关重要。通过适当实现这些机制，开发者可以确保数据完整性并避免竞态条件、死锁和其他并发问题，从而创建高效可靠的并发系统。\n\
    \n### 第 7 章：C++ 中的高级同步技术\n\n#### 高级同步引言\n\n虽然互斥量和条件变量等基础同步技术对于管理 C++ 中共享资源的并发访问至关重要，但更高级的同步机制可以进一步增强性能和灵活性。本章将探索高级同步技术，包括原子操作、自旋锁、读写锁以及未来/承诺（futures/promises），这些对于开发高性能多线程应用程序至关重要。\n\
    \n#### 原子操作\n\n原子操作提供了一种在不需要锁的情况下对共享数据进行操作的方法。这在性能至关重要且锁定机制开销会引入延迟的场景中特别有用。原子操作确保了读取-修改-写入序列不受其他线程的干扰即可完成。\n\
    \nC++ 在 `<atomic>` 头文件中提供了 `std::atomic` 模板，它允许对各种数据类型（包括整数、指针和用户定义类型）进行原子操作。\n\
    \n"
- fmt: "\n# Atomic Variables\nAtomic Variables: Declare an atomic variable using `std::atomic<Type>`,\
    \ where `Type` can be any standard type.\n\nAtomic Operations: Use member functions\
    \ such as `load()`, `store()`, `fetch_add()`, and `compare_exchange_strong()`\
    \ to perform atomic operations. These operations ensure that no other thread can\
    \ modify the variable during the operation, preventing race conditions.\n\nHere’s\
    \ an example demonstrating atomic operations:\n\n```cpp\n#include <iostream>\n\
    #include <thread>\n#include <atomic>\n\nstd::atomic<int> atomic_counter(0); //\
    \ Atomic variable\n\nvoid increment()\n{\n    for (int i = 0; i < 1000; ++i)\n\
    \    {\n        atomic_counter.fetch_add(1); // Atomic increment\n    }\n}\n\n\
    int main()\n{\n    std::thread t1(increment);\n    std::thread t2(increment);\n\
    \    t1.join();\n    t2.join();\n    std::cout << \"Final atomic counter value:\
    \ \" << atomic_counter.load() << std::endl; // Consistent output\n    return 0;\n\
    }\n```\n\nIn this example, `atomic_counter` is incremented atomically by two threads,\
    \ ensuring that the final value is consistent.\n\n# Spinlocks\nSpinlocks are a\
    \ lightweight locking mechanism suitable for situations where threads are expected\
    \ to wait only briefly. Unlike traditional mutexes, which put the thread to sleep\
    \ if the lock cannot be acquired, spinlocks repeatedly check if the lock is available,\
    \ effectively “spinning” in a loop until the lock is acquired. This can reduce\
    \ the overhead of context switching for short wait times but can waste CPU cycles\
    \ if the wait is long.\n\nC++ does not provide a built-in spinlock, but you can\
    \ implement one using atomic operations. Here’s a simple implementation:\n\n```cpp\n\
    #include <iostream>\n#include <thread>\n#include <atomic>\n\nclass Spinlock\n\
    {\npublic:\n    void lock()\n    {\n        while (flag.test_and_set(std::memory_order_acquire))\
    \ // Spin until the lock is acquired\n        ;\n    }\n    void unlock()\n  \
    \  {\n        flag.clear(std::memory_order_release); // Release the lock\n   \
    \ }\nprivate:\n    std::atomic_flag flag = ATOMIC_FLAG_INIT; // Atomic flag for\
    \ the spinlock\n};\n\nSpinlock spinlock; // Global spinlock\nint shared_counter\
    \ = 0; // Shared resource\n\nvoid increment()\n{\n    for (int i = 0; i < 1000;\
    \ ++i)\n    {\n        spinlock.lock(); // Acquire the spinlock\n        ++shared_counter;\
    \ // Incrementing the shared counter\n        spinlock.unlock(); // Release the\
    \ spinlock\n    }\n}\n\nint main()\n{\n    std::thread t1(increment);\n    std::thread\
    \ t2(increment);\n    t1.join();\n    t2.join();\n    std::cout << \"Final shared\
    \ counter value: \" << shared_counter << std::endl; // Consistent output\n   \
    \ return 0;\n}\n```\n\nIn this example, `spinlock` allows threads to acquire and\
    \ release the lock while ensuring that `shared_counter` is incremented safely.\n\
    \n# Reader-Writer Locks\nReader-writer locks extend the concept of mutexes to\
    \ allow multiple threads to read shared data simultaneously while preventing write\
    \ access during read operations. This is particularly beneficial in scenarios\
    \ where read operations are frequent, and write operations are infrequent.\n\n\
    C++ provides `std::shared_mutex`, which allows shared (read) locks and exclusive\
    \ (write) locks. Here’s how to use reader-writer locks:\n\n- Shared Lock: Multiple\
    \ threads can hold a shared lock simultaneously, allowing them to read shared\
    \ data concurrently.\n- Exclusive Lock: Only one thread can hold an exclusive\
    \ lock, preventing other threads from reading or writing.\n\nHere’s an example\
    \ demonstrating reader-writer locks:\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <shared_mutex>\n\nstd::shared_mutex rw_mutex;\nint shared_data\
    \ = 0;\n\nvoid read()\n{\n    std::shared_lock<std::shared_mutex> lock(rw_mutex);\
    \ // Acquire shared lock\n    std::cout << \"Reading data: \" << shared_data <<\
    \ \"\\n\";\n}\n\nvoid write()\n{\n    std::unique_lock<std::shared_mutex> lock(rw_mutex);\
    \ // Acquire exclusive lock\n    ++shared_data; // Incrementing shared data\n\
    \    std::cout << \"Writing data: \" << shared_data << \"\\n\";\n}\n\nint main()\n\
    {\n    std::thread t1(read);\n    std::thread t2(write);\n    std::thread t3(read);\n\
    \    t1.join();\n    t2.join();\n    t3.join();\n    return 0;\n}\n```\n\nIn this\
    \ example, the reader threads can access `shared_data` concurrently, while the\
    \ writer thread has exclusive access when modifying the data. This mechanism improves\
    \ performance when reads dominate.\n\n# Futures and Promises\nFutures and promises\
    \ are powerful synchronization constructs that allow threads to communicate results\
    \ and status asynchronously. A promise is an object that sets a value or an exception\
    \ for a future, while a future is an object that retrieves the value set by the\
    \ associated promise.\n\nFutures and promises facilitate communication between\
    \ threads by allowing one thread to produce a value while another thread consumes\
    \ it. This is especially useful in scenarios where tasks are executed in parallel,\
    \ and the results need to be combined later.\n\nHere’s how to use futures and\
    \ promises:\n\n- Create a Promise: Use `std::promise` to create a promise object\
    \ that will hold the result.\n- Set the Value: In one thread, set the value in\
    \ the promise using `set_value()` or set an exception using `set_exception()`.\n\
    - Retrieve the Value: In another thread, use `std::future` to retrieve the value\
    \ from the promise using `get()`.\n\nHere’s an example demonstrating futures and\
    \ promises:\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <future>\n\
    \nvoid compute(std::promise<int>& prom)\n{\n    int result = 42; // Simulated\
    \ computation\n    prom.set_value(result); // Set the value in the promise\n}\n\
    \nint main()\n{\n    std::promise<int> prom; // Create a promise\n    std::future<int>\
    \ fut = prom.get_future(); // Get a future from the promise\n    std::thread t(compute,\
    \ std::ref(prom)); // Start a thread to compute\n    t.join(); // Wait for the\
    \ thread to finish\n    int result = fut.get(); // Retrieve the result from the\
    \ future\n    std::cout << \"Computed result: \" << result << std::endl; // Output\
    \ the result\n    return 0;\n}\n```\n\nIn this example, the `compute` function\
    \ sets the value in the promise, which is retrieved later using the `future` in\
    \ the main thread. This allows for asynchronous computation and result retrieval.\n\
    \n# Conclusion\nAdvanced synchronization techniques such as atomic operations,\
    \ spinlocks, reader-writer locks, and futures/promises are essential for building\
    \ efficient and robust multithreaded applications in C++. By leveraging these\
    \ advanced mechanisms, developers can optimize performance, reduce contention,\
    \ and facilitate communication between threads. Understanding when and how to\
    \ use these synchronization techniques will significantly enhance the ability\
    \ to design scalable and high-performance concurrent systems.\n\n# Chapter 8:\
    \ Thread Pools and Task Scheduling in C++\n\n## Introduction to Thread Pools\n\
    In concurrent programming, creating and destroying threads can introduce significant\
    \ overhead, particularly in scenarios requiring frequent thread creation and termination.\
    \ Thread pools provide a solution to this problem by maintaining a pool of worker\
    \ threads that can be reused for executing tasks. This chapter delves into the\
    \ concept of thread pools and task scheduling, outlining their advantages, implementation,\
    \ and best practices.\n\n## Understanding Thread Pools\nA thread pool is a collection\
    \ of pre-initialized threads that can execute tasks concurrently. Instead of creating\
    \ a new thread for each task, a thread pool maintains a fixed number of threads\
    \ and assigns tasks to them as they become available. This design pattern offers\
    \ several benefits:\n\n- Reduced Overhead: By reusing threads, thread pools eliminate\
    \ the overhead associated with thread creation and destruction.\n- Controlled\
    \ Concurrency: Thread pools limit the number of concurrent threads, preventing\
    \ resource exhaustion in systems with limited resources.\n- Improved Performance:\
    \ Since threads are kept alive, tasks can be executed more quickly, enhancing\
    \ application performance, especially for I/O-bound or CPU-bound tasks.\n\n##\
    \ Implementing a Simple Thread Pool\n"
