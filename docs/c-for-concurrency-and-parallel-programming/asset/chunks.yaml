    Atomic operations provide a way to perform operations on shared data without the
    need for locking. This is particularly useful in scenarios where performance is
    critical, and the overhead of locking mechanisms can introduce latency. Atomic
    operations ensure that a read-modify-write sequence is completed without interference
    from other threads.


    C++ provides the std::atomic template in the <atomic> header, which enables atomic
    operations on various data types, including integers, pointers, and user-defined
    types. Here’s a breakdown of how to use atomic operations effectively:'
