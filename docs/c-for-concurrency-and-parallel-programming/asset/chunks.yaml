  trans: "\n\n# 互斥锁：确保互斥性\n\nMutex（mutual exclusion 的缩写）是一种同步原语，确保一次只有一个线程访问代码的临界区域。当一个线程锁定互斥锁时，其他尝试锁定同一互斥锁的线程将被阻塞，直到互斥锁被解锁。这确保了只有一个线程访问共享资源，从而防止竞态条件和数据损坏。\n\
    \n在 C++ 中，C++11 引入的 `std::mutex` 类提供了一个易于使用的互互斥管理接口。线程可以使用 `lock()` 方法锁定互斥锁，并使用\
    \ `unlock()` 方法解锁它。\n\n以下是一个使用互斥锁保护共享数据的示例：\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\nvoid\
    \ increment()\n{\n    mtx.lock();             // 在访问共享数据之前锁定互斥锁\n    ++shared_data;\n\
    \    std::cout << \"Shared data: \" << shared_data << \"\\n\";\n    mtx.unlock();\
    \           // 在访问共享数据后解锁互斥锁\n}\n\nint main()\n{\n    std::thread t1(increment);\n\
    \    std::thread t2(increment);\n    t1.join();\n    t2.join();\n    return 0;\n\
    }\n```\n\n在这个示例中，两个线程（`t1` 和 `t2`）尝试增加变量 `shared_data` 的。互斥锁 `mtx` 确保一次只有一个线程可以修改\
    \ `shared_data`。如果没有互斥锁，两个线程可能同时读取 `shared_data` 的相同值，对其递增并写入相同的结果，导致更新丢失。\n\n\
    在锁定互斥锁后始终解锁它是非常重要的，以防止死锁——死锁是指线程无限地等待它已经锁定的资源。忘记解锁互斥锁可能导致没有其他线程可以访问共享资源，从而停止程序的执行。\n\
    \n## 锁定机制：std::lock_guard 和 std::unique_lock\n\n手动锁定和解锁互斥锁很容易出错，特别是在涉及异常或提前返回时。如果从\
    \ `lock()` 到 `unlock()` 之间发生异常，互斥锁可能一直保持锁定状态，导致死锁。为了解决这个问题，C++ 提供了基于 RAII（资源获取即初始化）的锁定机制，例如\
    \ `std::lock_guard` 和 `std::unique_lock`，它们在锁对象创建和销毁时自动锁定和解锁互斥锁。\n\n`std::lock_guard`:\n\
    该类提供了一种简单且高效的管理互斥锁的方法。在 `lock_guard` 对象创建时锁定互斥锁，在对象超出作用范围时解锁它，确保即使在发生异常的情况下互斥锁也能被正确释放。\n\
    \n以下是一个使用 `std::lock_guard` 的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n\
    #include <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\nvoid increment()\n\
    {\n    std::lock_guard<std::mutex> lock(mtx); // 使用 lock_guard 锁定互斥锁\n    ++shared_data;\n\
    \    std::cout << \"Shared data: \" << shared_data << \"\\n\";\n}\n\nint main()\n\
    {\n    std::thread t1(increment);\n    std::thread t2(increment);\n    t1.join();\n\
    \    t2.join();\n    return 0;\n}\n```\n\n在这个示例中，`std::lock_guard` 在锁对象创建时自动锁定互斥锁，并在锁对象超出作用范围时解锁。这消除了手动解锁互斥锁的需要，并确保即使发生异常互斥锁也会被释放。\n\
    \n`std::unique_lock`:\n该类比 `std::lock_guard` 提供了更大的灵活性。它允许多次锁定和解锁互斥锁、延迟锁定到后续点，或者在不同线程之间转移锁的所有权。当需要对锁定行为进行更多控制时（例如使用条件变量，本章稍后会讨论），`std::unique_lock`\
    \ 非常有用。\n\n以下是一个使用 `std::unique_lock` 的示例：\n\n```cpp\n#include <iostream>\n#include\
    \ <thread>\n#include <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\nvoid\
    \ increment()\n{\n    std::unique_lock<std::mutex> lock(mtx); // 使用 unique_lock\
    \ 锁定互斥锁\n    ++shared_data;\n    std::cout << \"Shared data: \" << shared_data\
    \ << \"\\n\";\n    lock.unlock();           // 在函数结束前手动解锁互斥锁\n}\n\nint main()\n\
    {\n    std::thread t1(increment);\n    std::thread t2(increment);\n    t1.join();\n\
    \    t2.join();\n    return 0;\n}\n```\n\n在这个示例中，`std::unique_lock` 提供了在函数结束前手动解锁互斥锁的灵活性。当你需要提前释放互斥锁以允许其他线程访问共享资源，同时当前线程仍在执行其他任务时非常有用。\n\
    \n## 死锁以及如何避免\n\n当两个或多个线程被阻塞并等待对方释放它们已经锁定的资源时，就会发生死锁。死锁通常发生在线程以不同的顺序获取多个锁时，导致循环依赖，每个线程都持有另一个线程需要的锁。\n\
    \n以下是一个死锁发生的简单示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include\
    \ <mutex>\n\nstd::mutex mtx1, mtx2;\n\nvoid task1()\n{\n    std::lock_guard<std::mutex>\
    \ lock1(mtx1); // 锁定 mtx1\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // 模拟工作\n    std::lock_guard<std::mutex> lock2(mtx2); // 尝试锁定 mtx2\n    std::cout\
    \ << \"Task 1 completed\\n\";\n}\n\nvoid task2()\n{\n    std::lock_guard<std::mutex>\
    \ lock2(mtx2); // 锁定 mtx2\n    std::this_thread::sleep_for(std::chrono::milliseconds(100));\
    \ // 模拟工作\n    std::lock_guard<std::mutex> lock1(mtx1); // 尝试锁定 mtx1\n    std::cout\
    \ << \"Task 2 completed\\n\";\n}\n\nint main()\n{\n    std::thread t1(task1);\n\
    \    std::thread t2(task2);\n    t1.join();\n    t2.join();\n    return 0;\n}\n\
    ```\n\n"
