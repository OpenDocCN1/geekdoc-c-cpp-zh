    ### Chapter 15: Advanced Concurrency Patterns in C++


    #### Introduction to Advanced Concurrency Patterns


    As software applications grow in complexity and the demand for responsiveness
    and performance increases, the need for advanced concurrency patterns becomes
    evident. These patterns provide developers with robust frameworks for managing
    concurrent operations and improving application efficiency. In C++, several advanced
    concurrency patterns—such as futures, coroutines, and the actor model—allow for
    better structuring of concurrent code, facilitating easier debugging, maintenance,
    and scalability. This chapter delves into these advanced concurrency patterns,
    examining their principles, implementations, and applications within the C++ programming
    language.


    #### Understanding Futures and Promises


    Futures and promises are fundamental concepts in concurrent programming that enable
    asynchronous computation. They provide a way to retrieve the result of an operation
    that may not have completed yet.


    Futures: A future is an object that represents a value that may become available
    at some point. It acts as a placeholder for a result that is computed asynchronously.


    Creating Futures: In C++, the std::future class is part of the C++ Standard Library
    and can be obtained from a promise or by calling an asynchronous function using
    std::async.


    cpp


    Copy code


    #include <future>


    #include <iostream>


    int calculateSquare(int x) {


    return x * x;


    }


    int main() {


    std::future<int> result = std::async(std::launch::async, calculateSquare, 5);


    std::cout << "Square: " << result.get() << std::endl; // Blocks until the result
    is available


    return 0;


    }


    In this example, std::async is used to run calculateSquare asynchronously, and
    result.get() blocks until the square of 5 is computed.


    Promises: A promise is an object that allows a value to be set asynchronously.
    A promise is linked to a future, providing the means to fulfill or reject the
    future''s value.


    Setting Values: Using std::promise, you can set a value that a corresponding future
    will eventually receive.


    cpp


    Copy code


    #include <future>


    #include <iostream>


    #include <thread>


    void producer(std::promise<int>& prom) {


    int value = 10; // Simulating some computation


    prom.set_value(value); // Fulfill the promise


    }


    int main() {


    std::promise<int> prom;


    std::future<int> fut = prom.get_future(); // Get the associated future


    std::thread t(producer, std::ref(prom));


    t.detach(); // Detach the thread


    std::cout << "Produced Value: " << fut.get() << std::endl; // Waits for the value


    return 0;


    }


    In this code, a producer thread sets a value in the promise, which the main thread
    retrieves via the future.


    #### Exploring C++ Coroutines


    Coroutines are a powerful feature introduced in C++20 that simplify asynchronous
    programming by allowing functions to be paused and resumed. They enable writing
    asynchronous code that resembles synchronous code, making it more readable and
    maintainable.


    Defining Coroutines: A coroutine is defined using the co_await, co_return, and
    co_yield keywords. Coroutines can be used to manage asynchronous operations without
    blocking the calling thread.


    Example of a Simple Coroutine:


    cpp


    Copy code


    #include <iostream>


    #include <coroutine>


    struct Coroutine {


    struct promise_type {


    Coroutine get_return_object() {


    return Coroutine{ std::coroutine_handle<promise_type>::from_promise(*this) };


    }


    std::suspend_always initial_suspend() noexcept { return {}; }


    std::suspend_always final_suspend() noexcept { return {}; }


    void unhandled_exception() { std::terminate(); }


    void return_void() {}


    };


    std::coroutine_handle<promise_type> handle;


    ~Coroutine() {


    if (handle) handle.destroy();


    }


    };


    Coroutine myCoroutine() {


    std::cout << "Hello from Coroutine!" << std::endl;


    co_return; // The coroutine completes here


    }


    int main() {


    myCoroutine();


    return 0;


    }


    In this example, the coroutine myCoroutine prints a message when executed. The
    coroutine structure provides a way to define the coroutine''s promise and lifecycle.


    Using Coroutines for Asynchronous Programming: Coroutines can be used to simplify
    handling asynchronous tasks, such as network I/O or computations that can be paused.


    Example of an Asynchronous Task:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    #include <chrono>


    #include <coroutine>


    struct AsyncTask {


    struct promise_type {


    AsyncTask get_return_object() {


    return AsyncTask{ std::coroutine_handle<promise_type>::from_promise(*this) };


    }


    std::suspend_always initial_suspend() noexcept { return {}; }


    std::suspend_always final_suspend() noexcept { return {}; }


    void unhandled_exception() { std::terminate(); }


    void return_void() {}


    };


    std::coroutine_handle<promise_type> handle;


    ~AsyncTask() {


    if (handle) handle.destroy();


    }


    };


    AsyncTask performAsyncTask() {


    std::cout << "Starting task..." << std::endl;


    std::this_thread::sleep_for(std::chrono::seconds(2)); // Simulate work


    std::cout << "Task completed!" << std::endl;


    co_return;


    }


    int main() {


    performAsyncTask();


    std::cout << "Main function continues..." << std::endl;


    return 0;


    }


    Here, performAsyncTask simulates an asynchronous operation, allowing the main
    thread to continue executing while waiting for the task to complete.


    #### The Actor Model for Concurrency


    The actor model is a conceptual model for dealing with concurrent computation
    that treats "actors" as the fundamental units of computation. Each actor encapsulates
    state and behavior, communicating with other actors through message passing.


    Understanding Actors: An actor processes messages sequentially and can send messages
    to other actors. This model eliminates the need for locks and simplifies concurrency
    by avoiding shared state.


    Creating an Actor: In C++, you can implement the actor model using classes and
    message queues to handle incoming messages.


    cpp


    Copy code


    #include <iostream>


    #include <queue>


    #include <thread>


    #include <mutex>


    #include <condition_variable>


    #include <functional>


    class Actor {


    public:


    void sendMessage(std::function<void()> message) {


    {


    std::lock_guard<std::mutex> lock(mutex);


    messageQueue.push(message);


    }


    cv.notify_one();


    }


    void start() {


    while (true) {


    std::function<void()> message;


    {


    std::unique_lock<std::mutex> lock(mutex);


    cv.wait(lock, [this]() { return !messageQueue.empty(); });


    message = messageQueue.front();


    messageQueue.pop();


    }


    message(); // Process the message


    }


    }


    private:


    std::queue<std::function<void()>> messageQueue;


    std::mutex mutex;


    std::condition_variable cv;


    };'
