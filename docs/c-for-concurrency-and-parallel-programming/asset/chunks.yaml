  trans: "\nC++ 在支持并发和并行性方面已经显著进化，特别是随着 `C++11` 的引入，它为标准库添加了丰富的多线程特性。这些特性在随后的 C++\
    \ 版本（如 `C++14`、`C++17` 和 `C++20`）中不断得到扩展，使得 C++ 成为构建并发和并行应用的强大语言。\n\n在 `C++11`\
    \ 之前，开发者必须依赖于特定平台的 API 或第三方库（例如 POSIX 线程 `pthread` 或 `Boost`）来在 C++ 中实现多线程。这些\
    \ API 提供了基本的线程能力，但缺乏现代 `C++` 开发者期望的可移植性和易用性。\n\n通过 `C++11`，语言引入了标准化的线程模型，包括对创建和管理线程、同步原语和原子操作的支持。`C++11`\
    \ 及后续版本引入的一些关键并发特性包括：\n\n- `std::thread`：一个用于创建和管理线程的类。`std::thread` 类提供了用于启动、合并（join）和分离（detach）线程的简单接口，允许开发者以极小的精力创建多线程程序。\n\
    - `std::mutex` 和 `std::lock_guard`：确保多线程程序中安全访问共享资源的同步原语。互斥锁（Mutex）提供对共享数据的独占访问，而\
    \ `std::lock_guard` 会自动锁定和解锁 `mutex`，确保资源得到妥当保护。\n- `std::condition_variable`：用于线程通信的同步原语。条件变量允许一个线程在满足特定条件时通知另一个线程，实现更复杂的同步模式。\n\
    - `std::future` 和 `std::promise`：用于异步编程的工具。`std::future` 代表未来计算的值，而 `std::promise`\
    \ 允许另一个线程异步设置该值。这些构造共同实现了基于任务的并行化和异步计算。\n- `std::atomic`：用于原子操作的类模板。原子操作提供了一种在不需要显式锁的情况下安全操作共享数据的方法，减少了竞态条件的风险，并在某些场景下提高了性能。\n\
    \n除了这些核心特性外，`C++17` 还引入了并行算法，允许开发者在无需手动管理线程的情况下利用并行执行优势。这些算法（例如 `std::for_each`\
    \ 和 `std::sort`）可以并行执行，将工作负载分布在多个线程或核心上。\n\n`C++20` 通过引入协程（coroutines）进一步增强了并发支持，协程为编写异步代码提供了一种轻量级机制。协程允许函数挂起和恢复执行，从而在没有传统线程开销的情况下，更高效地管理异步任务。\n\
    \n凭借这些强大的并发特性，C++ 已经成为开发高性能多线程应用的领先语言之一。开发者现在可以以标准化、可移植且高效的方式编写并发和并行代码，充分利用现代硬件的威力。\n\
    \n## 第 2 章：C++ 多线程基础\n\n### 什么是线程？\n\n在计算中，线程是操作系统可以调的最小处理单元。它是程序内部的指令序列，可以独立于其他线程执行。每个程序都从单个线程开始，被称为“主线程”（`main\
    \ thread`），它运行 `main` 函数。然而，大多数现代应用程序会同时执行多个任务，例如处理用户输入、处理数据和执行后台计算，这需要使用额外的线程来高效地管理这些任务。\n\
    \n线程存在于进程内部，共享相同的内存空间和资源，如文件句柄、全局变量和堆内存。这使得线程之间的通信非常快速，但也带来了挑战，如竞态条件（race conditions）和死锁（deadlocks），当多个线程在没有适当同步机制的情况下尝试并发访问共享资源时就会发生这些问题。\n\
    \n在多线程应用程序中，任务被分配到多个线程之间，允许并发或并行执行。这使得获得更好的性能成为可能，特别是具有多个 CPU 核心的系统上。每个线程可以运行在不同的核心上，充分利用系统的计算能力。\n\
    \n在 C++ 中，线程由 `C++11` 引入的 `std::thread` 类表示。该类对系统级线程 API 的抽象，允许开发者以平台无关的方式创建和管理线程。随着\
    \ `std::thread` 的引入，C++ 获得了对多线程的原生支持，使开发者更容易编写并发程序，而无需依赖于 POSIX 线程等特定平台的库。\n\n\
    为了更好地理解线程如何工作，让我们考虑一个例子。网络浏览器通常使用多个线程：一个线程处理用户输入，另一个线程渲染网页，还有一个线程管理网络请求。这种并发执行提高了响应速度，并确保应用程序在执行复杂任务时仍能保持交互性。\n\
    \n### 在 C++ 中创建和管理线程\n\nC++ 通过 `std::thread` 类提供了创建和管理线程的简单接口。要创建一个新线程，你只需实例化\
    \ `std::thread` 类的对象，并传递一个代表由线程执行的任务的函数或可调用对象。该线程将独立于主线程运行该函数，允许两个线程并发执行。\n\n\
    下面是如何在 C++ 中创建和管理线程的示例示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n\n\
    void task()\n{\n    std::cout << \"Thread is executing\\n\";\n}\n\nint main()\n\
    {\n    std::thread t(task); // 创建一个运行 'task' 函数的新线程\n    t.join();           \
    \  // 等待线程完成执行\n    std::cout << \"Main thread continues execution\\n\";\n   \
    \ return 0;\n}\n```\n\n在此示例中，创建了 `std::thread` 对象 `t` 来执行函数 `task()`。`t.join()`\
    \ 调用确保主线程在继续执行之前等待新线程完成执行。如果没有 `join()`，主线程可能在新线程仍在运行 own 结束并终止程序，这可能导致不可预测的结果。\n\
    \n`join()`：该方法阻塞调用线程（在本例中为主线程），直到由 `std::thread` 对象表示的线程完成执行。它确保在程序结束之前所有线程都已经过妥当同步。未能合并线程可能会导致崩溃或未定义行为。\n\
    \n`detach()`：当你希望一个线程独立于主线程运行（（即你不想等待它完成），可以使用 `detach()` 方法。这使得线程在后台运行，允许主线程继续其执行。然而，一旦分离，该线程稍后无法再被合并，程序员有责任确保分离线程所使用的资源得到妥当管理，以避免内存泄漏或悬挂指针。\n\
    \n这里是一个分离线程的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\n#include <chrono>\n\
    \nvoid task()\n{\n    std::this_thread::sleep_for(std::chrono::seconds(2)); //\
    \ 使用睡眠模拟工作\n    std::cout << \"Thread finished execution\\n\";\n}\n\nint main()\n\
    {\n    std::thread t(task); // 创建一个新线程\n    t.detach();          // 分离线程\n   \
    \ std::cout << \"Main thread continues immediately\\n\";\n    return 0;\n}\n```\n\
    \n"
- fmt: "\nIn this case, the main thread will print its message and continue without\
    \ waiting for the new thread to finish. The new thread runs in the background\
    \ and finishes after a 2-second delay. Detaching threads can be useful when you\
    \ have long-running tasks that don’t need to synchronize with the main thread.\
    \ However, detachment should be used carefully, as it can lead to resource management\
    \ issues if not handled properly.\n\n### Passing Arguments to Threads\n\nSometimes,\
    \ threads need to work with arguments, such as data or parameters needed for the\
    \ task. The `std::thread` constructor allows you to pass arguments to the function\
    \ or callable object that the thread will execute. The arguments are passed by\
    \ value by default, but you can also pass arguments by reference using the `std::ref()`\
    \ wrapper.\n\nHere’s an example of passing arguments to a thread:\n\n```cpp\n\
    #include <iostream>\n#include <thread>\n\nvoid task(int x, const std::string&\
    \ message)\n{\n    std::cout << \"Thread received: \" << x << \", \" << message\
    \ << \"\\n\";\n}\n\nint main()\n{\n    int num = 10;\n    std::string msg = \"\
    Hello from thread!\";\n    std::thread t(task, num, std::ref(msg)); // Pass arguments\
    \ to the thread\n    t.join();\n    return 0;\n}\n```\n\nIn this example, the\
    \ thread is created to execute the `task()` function, which accepts two arguments:\
    \ an integer and a string. The `num` variable is passed by value, while the `msg`\
    \ variable is passed by reference using `std::ref()`. This ensures that any modifications\
    \ made to `msg` inside the thread will be reflected in the main thread, as both\
    \ threads share the same memory space.\n\nPassing arguments by value to threads\
    \ is straightforward, but passing them by reference requires careful attention\
    \ to synchronization, especially when the shared data is modified by multiple\
    \ threads. Without proper synchronization mechanisms, race conditions can occur,\
    \ where the outcome of the program depends on the unpredictable timing of thread\
    \ execution.\n\n### Thread Synchronization\n\nOne of the main challenges in multithreaded\
    \ programming is ensuring that multiple threads can safely access shared resources\
    \ without causing conflicts. Thread synchronization refers to the mechanisms used\
    \ to control the access of multiple threads to shared data. Without proper synchronization,\
    \ threads may overwrite each other’s data or read inconsistent states, leading\
    \ to bugs such as race conditions, deadlocks, and data corruption.\n\nC++ provides\
    \ several synchronization primitives to help manage access to shared resources,\
    \ including mutexes, condition variables, and atomic operations. These primitives\
    \ ensure that only one thread can access a shared resource at a time or that threads\
    \ can coordinate their execution to avoid conflicts.\n\n**Mutex**: A mutex (short\
    \ for \"mutual exclusion\") is a synchronization primitive that ensures that only\
    \ one thread can lock and access a shared resource at a time. Other threads attempting\
    \ to lock the same mutex will be blocked until the mutex is unlocked by the owning\
    \ thread. Mutexes are useful for preventing race conditions when multiple threads\
    \ need to access or modify the same data.\n\nHere’s an example of using a mutex\
    \ to protect shared data:\n\n```cpp\n#include <iostream>\n#include <thread>\n\
    #include <mutex>\n\nstd::mutex mtx;\nint shared_data = 0;\n\nvoid increment()\n\
    {\n    std::lock_guard<std::mutex> lock(mtx); // Lock the mutex before accessing\
    \ shared data\n    ++shared_data;\n    std::cout << \"Shared data: \" << shared_data\
    \ << \"\\n\";\n}\n\nint main()\n{\n    std::thread t1(increment);\n    std::thread\
    \ t2(increment);\n    t1.join();\n    t2.join();\n    return 0;\n}\n```\n\nIn\
    \ this example, two threads attempt to increment the same shared data. The `std::lock_guard`\
    \ automatically locks the `mutex` before the shared data is accessed and unlocks\
    \ it when the lock goes out of scope. This ensures that only one thread can modify\
    \ `shared_data` at a time, preventing race conditions.\n\n**Condition Variables**:\
    \ Condition variables are used to coordinate the execution of multiple threads\
    \ by allowing one thread to signal another thread when a certain condition is\
    \ met. This is useful in situations where one thread needs to wait for another\
    \ thread to complete a task before proceeding.\n\n**Atomic Operations**: Atomic\
    \ operations provide a way to perform thread-safe operations on shared data without\
    \ the need for explicit locks. These operations are guaranteed to be executed\
    \ without interruption, ensuring that no other thread can access the data during\
    \ the operation.\n\n### Best Practices for Multithreaded Programming in C++\n\n\
    Multithreaded programming introduces new challenges, such as race conditions,\
    \ deadlocks, and synchronization overhead. To write efficient and reliable multithreaded\
    \ programs in C++, it is important to follow best practices, including:\n\n- **Minimize\
    \ Shared State**: Reduce the amount of shared data between threads to minimize\
    \ the need for synchronization. The less shared data there is, the fewer opportunities\
    \ there are for conflicts between threads.\n- **Use RAII for Locking**: Use resource\
    \ acquisition is initialization (RAII) techniques, such as `std::lock_guard`,\
    \ to automatically manage the acquisition and release of locks. This ensures that\
    \ locks are properly released, even in the event of exceptions or early returns.\n\
    - **Prefer Atomic Operations**: When possible, use atomic operations instead of\
    \ mutexes to avoid the overhead of locking. Atomic operations are faster and simpler,\
    \ making them ideal for low-level synchronization.\n- **Avoid Deadlocks**: Deadlocks\
    \ occur when two or more threads are waiting for each other to release resources,\
    \ causing a permanent halt in execution. To avoid deadlocks, acquire locks in\
    \ a consistent order, and use try-lock mechanisms or timeouts when waiting for\
    \ locks.\n- **Test Thoroughly**: Multithreaded programs can exhibit subtle bugs\
    \ that are difficult to reproduce, such as race conditions and timing issues.\
    \ Testing multithreaded code under different conditions and on different hardware\
    \ configurations is essential to ensure correctness.\n"
  raw: 'In this case, the main thread will print its message and continue without
    waiting for the new thread to finish. The new thread runs in the background and
    finishes after a 2-second delay. Detaching threads can be useful when you have
    long-running tasks that don’t need to synchronize with the main thread. However,
    detachment should be used carefully, as it can lead to resource management issues
    if not handled properly.


    #### Passing Arguments to Threads


    Sometimes, threads need to work with arguments, such as data or parameters needed
    for the task. The std::thread constructor allows you to pass arguments to the
    function or callable object that the thread will execute. The arguments are passed
    by value by default, but you can also pass arguments by reference using the std::ref()
    wrapper.


    Here’s an example of passing arguments to a thread:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    void task(int x, const std::string& message)


    {


    std::cout << "Thread received: " << x << ", " << message << "\n";


    }


    int main()


    {


    int num = 10;


    std::string msg = "Hello from thread!";


    std::thread t(task, num, std::ref(msg)); // Pass arguments to the thread


    t.join();


    return 0;


    }


    In this example, the thread is created to execute the task() function, which accepts
    two arguments: an integer and a string. The num variable is passed by value, while
    the msg variable is passed by reference using std::ref(). This ensures that any
    modifications made to msg inside the thread will be reflected in the main thread,
    as both threads share the same memory space.


    Passing arguments by value to threads is straightforward, but passing them by
    reference requires careful attention to synchronization, especially when the shared
    data is modified by multiple threads. Without proper synchronization mechanisms,
    race conditions can occur, where the outcome of the program depends on the unpredictable
    timing of thread execution.


    #### Thread Synchronization


    One of the main challenges in multithreaded programming is ensuring that multiple
    threads can safely access shared resources without causing conflicts. Thread synchronization
    refers to the mechanisms used to control the access of multiple threads to shared
    data. Without proper synchronization, threads may overwrite each other’s data
    or read inconsistent states, leading to bugs such as race conditions, deadlocks,
    and data corruption.


    C++ provides several synchronization primitives to help manage access to shared
    resources, including mutexes, condition variables, and atomic operations. These
    primitives ensure that only one thread can access a shared resource at a time
    or that threads can coordinate their execution to avoid conflicts.


    Mutex: A mutex (short for "mutual exclusion") is a synchronization primitive that
    ensures that only one thread can lock and access a shared resource at a time.
    Other threads attempting to lock the same mutex will be blocked until the mutex
    is unlocked by the owning thread. Mutexes are useful for preventing race conditions
    when multiple threads need to access or modify the same data.


    Here’s an example of using a mutex to protect shared data:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    #include <mutex>


    std::mutex mtx;


    int shared_data = 0;


    void increment()


    {


    std::lock_guard<std::mutex> lock(mtx); // Lock the mutex before accessing shared
    data


    ++shared_data;


    std::cout << "Shared data: " << shared_data << "\n";


    }


    int main()


    {


    std::thread t1(increment);


    std::thread t2(increment);


    t1.join();


    t2.join();


    return 0;


    }


    In this example, two threads attempt to increment the same shared data. The std::lock_guard
    automatically locks the mutex before the shared data is accessed and unlocks it
    when the lock goes out of scope. This ensures that only one thread can modify
    shared_data at a time, preventing race conditions.


    Condition Variables: Condition variables are used to coordinate the execution
    of multiple threads by allowing one thread to signal another thread when a certain
    condition is met. This is useful in situations where one thread needs to wait
    for another thread to complete a task before proceeding.


    Atomic Operations: Atomic operations provide a way to perform thread-safe operations
    on shared data without the need for explicit locks. These operations are guaranteed
    to be executed without interruption, ensuring that no other thread can access
    the data during the operation.


    #### Best Practices for Multithreaded Programming in C++


    Multithreaded programming introduces new challenges, such as race conditions,
    deadlocks, and synchronization overhead. To write efficient and reliable multithreaded
    programs in C++, it is important to follow best practices, including:


    Minimize Shared State: Reduce the amount of shared data between threads to minimize
    the need for synchronization. The less shared data there is, the fewer opportunities
    there are for conflicts between threads.


    Use RAII for Locking: Use resource acquisition is initialization (RAII) techniques,
    such as std::lock_guard, to automatically manage the acquisition and release of
    locks. This ensures that locks are properly released, even in the event of exceptions
    or early returns.


    Prefer Atomic Operations: When possible, use atomic operations instead of mutexes
    to avoid the overhead of locking. Atomic operations are faster and simpler, making
    them ideal for low-level synchronization.


    Avoid Deadlocks: Deadlocks occur when two or more threads are waiting for each
    other to release resources, causing a permanent halt in execution. To avoid deadlocks,
    acquire locks in a consistent order, and use try-lock mechanisms or timeouts when
    waiting for locks.


    Test Thoroughly: Multithreaded programs can exhibit subtle bugs that are difficult
    to reproduce, such as race conditions and timing issues. Testing multithreaded
    code under different conditions and on different hardware configurations is essential
    to ensure correctness.


    By adhering to these best practices, you can write more robust and efficient multithreaded
    programs in C++, taking full advantage of modern hardware architectures.


    ### Chapter 3: Thread Synchronization in C++


    #### The Need for Thread Synchronization


    In multithreaded applications, threads often need to access shared resources such
    as memory, files, or data structures. While multithreading enables tasks to be
    performed concurrently, it also introduces potential conflicts when multiple threads
    try to access or modify the same resource simultaneously. Thread synchronization
    is crucial to ensure that shared resources are accessed in a controlled manner,
    preventing race conditions, data corruption, and unpredictable program behavior.


    A race condition occurs when two or more threads access a shared resource at the
    same time, with at least one thread modifying the resource. Since thread execution
    is non-deterministic, the outcome of a race condition can vary depending on the
    timing of the thread execution, making it difficult to reproduce and debug. For
    example, consider two threads that increment a shared counter. If both threads
    read the current value of the counter before either increments it, both threads
    may end up writing the same incremented value, resulting in a lost update.


    Another issue in unsynchronized multithreading is data corruption, where multiple
    threads modify shared data simultaneously without proper coordination, leading
    to inconsistent or invalid states. This is especially problematic when working
    with complex data structures, such as linked lists or trees, where improper updates
    can cause structural errors.


    To avoid these problems, thread synchronization mechanisms ensure that only one
    thread can access a shared resource at a time or that threads communicate effectively
    to coordinate their actions. C++ provides several tools for thread synchronization,
    including mutexes, locks, condition variables, and atomic operations, which we
    will explore in this chapter.'
