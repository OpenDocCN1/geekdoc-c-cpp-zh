    #### Reader-Writer Locks


    Reader-writer locks extend the concept of mutexes to allow multiple threads to
    read shared data simultaneously while preventing write access during read operations.
    This is particularly beneficial in scenarios where read operations are frequent,
    and write operations are infrequent.


    C++ provides std::shared_mutex, which allows shared (read) locks and exclusive
    (write) locks. Here’s how to use reader-writer locks:


    Shared Lock: Multiple threads can hold a shared lock simultaneously, allowing
    them to read shared data concurrently.


    Exclusive Lock: Only one thread can hold an exclusive lock, preventing other threads
    from reading or writing.


    Here’s an example demonstrating reader-writer locks:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    #include <shared_mutex>


    std::shared_mutex rw_mutex;


    int shared_data = 0;


    void read()


    {


    std::shared_lock<std::shared_mutex> lock(rw_mutex); // Acquire shared lock


    std::cout << "Reading data: " << shared_data << "\n";


    }


    void write()


    {


    std::unique_lock<std::shared_mutex> lock(rw_mutex); // Acquire exclusive lock


    ++shared_data; // Incrementing shared data


    std::cout << "Writing data: " << shared_data << "\n";


    }


    int main()


    {


    std::thread t1(read);


    std::thread t2(write);


    std::thread t3(read);


    t1.join();


    t2.join();


    t3.join();


    return 0;


    }


    In this example, the reader threads can access shared_data concurrently, while
    the writer thread has exclusive access when modifying the data. This mechanism
    improves performance when reads dominate.


    #### Futures and Promises


    Futures and promises are powerful synchronization constructs that allow threads
    to communicate results and status asynchronously. A promise is an object that
    sets a value or an exception for a future, while a future is an object that retrieves
    the value set by the associated promise.


    Futures and promises facilitate communication between threads by allowing one
    thread to produce a value while another thread consumes it. This is especially
    useful in scenarios where tasks are executed in parallel, and the results need
    to be combined later.


    Here’s how to use futures and promises:


    Create a Promise: Use std::promise to create a promise object that will hold the
    result.


    Set the Value: In one thread, set the value in the promise using set_value() or
    set an exception using set_exception().


    Retrieve the Value: In another thread, use std::future to retrieve the value from
    the promise using get().


    Here’s an example demonstrating futures and promises:


    cpp


    Copy code


    #include <iostream>


    #include <thread>


    #include <future>


    void compute(std::promise<int>& prom)


    {


    int result = 42; // Simulated computation


    prom.set_value(result); // Set the value in the promise


    }


    int main()


    {


    std::promise<int> prom; // Create a promise


    std::future<int> fut = prom.get_future(); // Get a future from the promise


    std::thread t(compute, std::ref(prom)); // Start a thread to compute


    t.join(); // Wait for the thread to finish


    int result = fut.get(); // Retrieve the result from the future


    std::cout << "Computed result: " << result << std::endl; // Output the result


    return 0;


    }


    In this example, the compute function sets the value in the promise, which is
    retrieved later using the future in the main thread. This allows for asynchronous
    computation and result retrieval.


    #### Conclusion


    Advanced synchronization techniques such as atomic operations, spinlocks, reader-writer
    locks, and futures/promises are essential for building efficient and robust multithreaded
    applications in C++. By leveraging these advanced mechanisms, developers can optimize
    performance, reduce contention, and facilitate communication between threads.
    Understanding when and how to use these synchronization techniques will significantly
    enhance the ability to design scalable and high-performance concurrent systems.


    ### Chapter 8: Thread Pools and Task Scheduling in C++


    #### Introduction to Thread Pools


    In concurrent programming, creating and destroying threads can introduce significant
    overhead, particularly in scenarios requiring frequent thread creation and termination.
    Thread pools provide a solution to this problem by maintaining a pool of worker
    threads that can be reused for executing tasks. This chapter delves into the concept
    of thread pools and task scheduling, outlining their advantages, implementation,
    and best practices.


    #### Understanding Thread Pools


    A thread pool is a collection of pre-initialized threads that can execute tasks
    concurrently. Instead of creating a new thread for each task, a thread pool maintains
    a fixed number of threads and assigns tasks to them as they become available.
    This design pattern offers several benefits:


    Reduced Overhead: By reusing threads, thread pools eliminate the overhead associated
    with thread creation and destruction.


    Controlled Concurrency: Thread pools limit the number of concurrent threads, preventing
    resource exhaustion in systems with limited resources.


    Improved Performance: Since threads are kept alive, tasks can be executed more
    quickly, enhancing application performance, especially for I/O-bound or CPU-bound
    tasks.


