    # Theory


    A class is a general pattern or blueprint based on which we create objects. A
    class contains descriptions of fields and methods, which are the members of the
    class. A field of a class is similar to a variable. A method of a class is an
    analog of a function. When we create an object based on a class, the object gets
    the "personal" set of fields and methods according to the description of the class.
    A field of an object is to store some value. A method performs some actions and
    can return a result. So, we can think that fields and methods, respectively, are
    variables and functions "attached" to a certain object. Different objects created
    on the same class have equal sets of fields and methods. On the other hand, the
    values of the fields of each object are individual, and the methods have automatic
    access to the object from which they are called. That is why there is no sense
    in mentioning a field or method if we do not specify their object.


    The description of a class begins with the class keyword, after which we put the
    name of the class in curly braces (after the closing brace, we must put a semicolon).


    Creating a class means that we must describe fields and methods. Before the description,
    we put the keyword public, followed by a colon. This keyword begins a section
    with public members of the class. If we want to access a field or method from
    outside of the class, this field or method must be a public one.


