    amounts for money for these objects.


    +   * The prefix form of the decrement operator: when we apply the decrement operator
    to an object, the field money of the object is reduced by 1000 (but it can''t
    be less than zero).


    +   * The postfix form of the decrement operator: when we apply the decrement
    operator to an object, the field time is decreased by 1 (but it can''t be less
    than zero).


    With the help of the operator methods, we define the following operations with
    objects of the class MyMoney:


    +   * If we calculate the sum of two objects of the MyMoney class, then we get
    a new object of the same class. The fields of the object are calculated based
    on the fields of the initial objects.


    +   * The prefix form of the increment operator: if we apply the increment operator
    to an object, then the field money of the object is increased by 1000.


    +   * The postfix form of the increment operator: if we apply the increment operator
    to an object, then the field time of the object is increased by 1.


    # Details


    The increment ++ and decrement -- operators have the prefix and postfix forms.
    In the prefix form, we put the operator before the operand.


