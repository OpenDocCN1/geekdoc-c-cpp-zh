  md: "# Details\n\nThe Taylor series for the function $f(x)$ at the vicinity of the\
    \ point $x_0$ is the\ninfinite sum $f(x) = \\sum_{k=0}^{n} c_k(x-x_0)^k$, where\
    \ the coefficients $c_k = \\frac{f^{(k)}(x_0)}{k!}$.\nWe can use the Taylor series\
    \ to approximate functions. Namely, we can\nuse the approximate formula $f(x)\
    \ \\approx c_0(x-x_0)^0 + c_1(x-x_0)^1 + c_2(x-\nx_0)^2 + \\dots + c_n(x-x_0)^n$.\
    \ If it comes to expanding the function $f(x)$ at the\nvinity of the point $x_0\
    \ = 0$, we get the polynomial estimation $f(x) \\approx\nc_0x^0 + c_1x^1 + c_2x^2\
    \ + \\dots + c_nx^n$, which gives the approximate value of the\nfunction at the\
