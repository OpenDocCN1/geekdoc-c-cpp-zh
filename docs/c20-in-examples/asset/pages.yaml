  md: '# Chapter 1 Simple Programs 22


    In the program, we define the integer constant G with the value 5280. This constant
    determines the number of feet in a mile. The floating-point constant F with the
    value 1.609344 determines the number of kilometers in a mile. The integer variables
    miles, feet, kms, and ms are used, respectively, for storing the miles, feet,
    kilometers, and meters in the distance that the user enters. To get the miles,
