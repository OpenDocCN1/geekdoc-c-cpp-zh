  md: '# Chapter 1 Simple Programs 17


    }


    In the next program, we will face variables and the input operator.


    # Using Variables


    We are going to create a program, which converts miles into kilometers. The program
    gets a distance in miles and prints the same distance in kilometers. The initial
    value (the distance in miles) is entered into the program from the keyboard.


    > Notes

    A mile is equal to 1609344 millimeters or 1.609344 kilometers. To convert miles
    into kilometers, we should multiply the miles by the conversion factor 1.609344.


    The program is quite simple. When it runs, a prompt for entering a number appears.
    This number is a distance in miles. After the number is read, the program performs
    some calculations and then prints the result on the screen.


    We should store somewhere the entered number, as well as the result of the calculations.
    For these purposes, we use variables in the program.


    > Theory

    A variable is a named space in memory that could be accessed by the name: we can
    assign a value to the variable and read the value of the variable. In C++, we
    have to declare a variable before using it. When we declare a variable, we must
    specify its type. The type of variable is determined by a keyword (the type identifier).
    The most actual primitive types are int (integers), double (real or floating-point
    numbers), and char (character).

    A variable can be declared almost everywhere in a program (but before its first
    use). A variable is accessible inside the block where it is declared. In turn,
    a block is defined by the paired curly braces. So, if some variable is declared
    in the main function, then this variable is accessible inside the main function.'
  merge: -1
  img_proc: true
