    The do-while statement starts with the do keyword followed by curly braces with
    instructions (the body of the loop statement). After the curly braces, we put
    the while keyword and a condition in parentheses. The loop statement is executed
    when the condition is true. The condition is tested each time after the instructions
    in the body of the loop statement are executed.


    So, what is the difference between the while and do-while statements? The main
    difference is that the while statement starts with testing the condition. The
    do-while statement starts with the execution of the instructions in the body of
    the loop statement. Thus, the instructions in the do-while statement are executed
    at least once.


