    # Inheritance and Private Members


    The next simple example illustrates the situation when a base class contains private
    members not inherited in its derivative class. Nevertheless, we can use these
    members in inherited public methods.


    | Theory |

    A derivative class doesn''t inherit private members of the base class. Namely,
    in the derivative class, it is impossible to have direct access to the private
    members from the base class. Nevertheless, from a technical point of view, these
    members exist in the derivative class. Suppose, for example, that we have a method
    inherited in a derivative class. In the base class, this method refers to private
    members, which are not inherited in the derivative class. Despite this, the method
    in the derivative class can manipulate these members.


