  md: "# Listing 9.9. The classical Runge-Kutta method\n\n```\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\n// The function determines the differential\
    \ equation:\ndouble f(double x, double y) {\n    return x*x*exp(-x)-y;\n}\n//\
    \ The function solves a differential equation\n// by the classical Runge-Kutta\
    \ method:\ndouble dsolve(double (*f)(double,double), double x0,\ndouble y0, double\
    \ x) {\n    // The number of intervals\n    int n=1000;\n    // The variables\
    \ to save the values\n    // which are used in the calculations:\n    double p1,p2,p3,p4;\n\
    \    // The increment for the argument:\n    double h=(x-x0)/n;\n    // The initial\
    \ value of the unknown function\n    double y=y0;\n    // Calculates the value\
    \ of the unknown function\n    // at the point:\n    for (int k=0;k<n;k++) {\n\
    \        p1=f(x0+k*h, y);\n        p2=f(x0+k*h+h/2,y+h*p1/2);\n        p3=f(x0+k*h+h/2,y+h*p2/2);\n\
    \        p4=f(x0+k*h+h,y+h*p3);\n        y=y+(h/6) * (p1+2*p2+2*p3+p4);\n    }\n\
    \    // The value of the unknown function at the point:\n```"
