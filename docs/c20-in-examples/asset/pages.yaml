  md: '# Chapter 9 Mathematical Problems 365


    In the program, we implement the bisectional method through the function findRoot().
    This function has the following arguments:


    +   - The pointer to the function, which determines the equation to solve. For
    the equation of the function f(x) = 0 that means the function f(x).

    - The left and the right boundaries of the interval where the root is localized.

    - The precision for calculating the root.


    Notes

    The root of the equation is localized within the interval from a to b, then it
    differs from the central point of the interval for a value, which is not greater
    than the half-length of the interval. We use this criterion in the function findRoot()
    when calculate the root. We make the calculations until the half-length of the
    interval, where the root is localized, is less than the precision passed as the
    last argument to the function findRoot().


    Here is the algorithm of the function findRoot() execution:

    - We check if the value of the function passed as the first argument is equal
    to zero at the boundaries or at the center of the interval. If so, then the function
    findRoot() returns the corresponding value as the result. We make this to avoid
    unnecessary iterations.

    - If the function passed as the first argument has nonzero values at the boundaries
    and at the center of the interval, then we move one of the boundaries to the center
    and repeat the procedure.

    We call the function findRoot() in the function test(). First of all, there we
    check the interval of the root localization. If it appears the function, which
    determines the equation, has values of the same sign at the boundaries of the
    interval, then an error is thrown (the object of error is a string literal). Catching
    the error leads to printing a message that the interval is wrong.'
