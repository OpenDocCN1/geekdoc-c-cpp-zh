    The statement m.lock() is executed before the statement cout<<"The thread "<<name<<":\tmessage
    "<<k<<endl;mlock(), prints a message. After printing the message, the statement
    m.unlock() is performed. Briefly, executing the statement m.lock() blocks the
    console, and executing the statement m.unlock() unblocks it. In more detail, the
    situation is as follows. We have threads that simultaneously print messages to
    the console. It is possible that one thread "interrupt" another thread and print
    its message within another message. We want to avoid this. That is why when the
    thread prints the message to the console, it automatically blocks the console
    for other threads. As soon as the message is printed, the console is unlocked
    and can be used by other threads. We can block and unlock resources (make a thread
    synchronization) by employing a mutex object. A mutex object is an object of the
    class mutex. The class is accessible after including the <mutex> header in the
    program. The object must be accessible in all threads, so it is created as a global
    by the statement mutex m. When, in some thread, we call the blocking method lock()
    from the mutex object m (the statement m.lock()), then it blocks the resource
    (which the thread uses) for other threads. The resource becomes accessible again
    after the method unlock() is called from the mutex object in the thread, which
    has blocked the resource.'
