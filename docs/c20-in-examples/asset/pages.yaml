    # Notes


    A little later, we will consider such a mechanism as recursion. In the case of
    recursion, a function calls itself. In this example, however, we don''t use recursion.
    Here, in one version of the function, we call another version of the function.
    That is not recursion. Technically, this is the same as if we were calling a function
    in another function. In our case, these functions have the same name. As mentioned
    above, the function getMoney() with four arguments returns the expression getMoney(m,
    r/n, y*n) as the result. To understand why this is so, we should point out the
    following. Suppose that the initial amount is m, the annual interest rate is r,
    the term is y, and the interest is charged n times per year. The final amount
    of money is the same as in the when the initial amount of money is m, the annual
    interest rate is r, the term is ny, and the interest is charged once per year.


    In the main function of the program, we call the getMoney() function with different
    arguments. Each time we call the function, the version of the called function
    is determined based on the call statement. Namely, the decision is made based
    on the number of arguments and their type.


    # Default Values for Arguments


    We can solve the considered above problem in a slightly different way. In particular,
    instead of function overloading, we can use the only function, but with the arguments
    that have default values.


    # Theory


    In the function description, we can specify default values for some or even all
    arguments of the function. The default value is assigned to an argument in the
    function prototype. These values will be used if the corresponding argument is
    not passed to the function when we call it. The arguments with default values
    must be at the end of the argument list.'
