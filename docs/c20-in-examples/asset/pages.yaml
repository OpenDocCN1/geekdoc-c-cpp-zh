  md: 'In the main function, we use the statement const double F=1.609344 to declare
    the floating-point constant F (which is the conversion factor). The value of this
    constant is 1.609344 (kilometers in a mile). We also use two variables miles and
    kms. Both of them are of type double. The distance in miles is stored in the variable
    miles. The user enters this value from the keyboard. Namely, the statement cout<<"A
    distance in miles: " prints a message on the screen. Then the user types a number
    and presses <Enter>. To process these processes, we use the statement cin>>miles.
    It contains the input operator >>. Here cin (it is an abbreviation from the console
    input) is a link to the input console device (by default, it is the keyboard).
    The variable miles is on the right of the input operator. The entered value is
    stored (saved) in this variable.


    The variable miles is declared as being of type double. Thus, the value entered
    by the user is treated as a value of type double.


    The statement kms=miles*F calculates the distance in kilometers: we multiply the
    distance in miles by the conversion factor F.


    We face the multiplication operator *. Other arithmetic operators are the addition
    operator +, the subtraction operator -, and the division operator /. In C++, the
    division operator has a specific feature. If both operands are integers, then
    integer division is performed (the fractional part of the result is discarded).
    For example, the expression 9/4 gives 2. To make ordinary (floating point) division
    (when both operands are integers), we can put the (double) instruction (the keyword
    double enclosed in parentheses) before the division operator. For example, the
    expression (double)9/4 gives 2.25.'
