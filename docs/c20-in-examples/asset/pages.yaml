- pgno: 7
  md: '# Introduction


    # The Book about C++


    passed to functions and how we pass a function as an argument. Also, we learn
    how functions operate with arrays, references, and pointers.


    In the fifth chapter, we discuss the principles of object-oriented programming.
    We learn how to describe classes and create objects. Also, the chapter contains
    information about public and private members, constructors and destructors, overloading
    methods and operators, using inheritance.


    In the sixth chapter, we continue discussing classes and objects. Namely, we get
    familiar with pointers to objects, arrays of objects, and functors. We will use
    objects whose fields are arrays and implement object indexing. We will get familiar
    with virtual methods and multiple inheritance, and do some other tricks with classes
    and objects.


    In the seventh chapter, we investigate template functions and classes. There we
    create and overload template functions with several parameters. We will come how
    to define default values for template parameters. There will also apply inheritance
    for template classes. Moreover, in the chapter, we consider how to use integer
    template parameters.


    In the eighth chapter, we consider different programs. The chapter explains how
    to use structures, complex numbers, and containers. We will also get familiar
    with multithreading.


    The ninth chapter is devoted to mathematical problems. In that chapter, we show
    how to implement methods for solving algebraic and differential equations, calculate
    integrals, and create interpolation polynomials.


    # The C++ Programming Language


    By now, C++ is one of the most popular programming languages. It is impossible
