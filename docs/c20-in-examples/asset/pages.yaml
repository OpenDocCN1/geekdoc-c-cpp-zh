    reason is that the arguments are passed to the function by value. That means that
    instead of passing variables to function, their copies are passed. After the function
    is terminated, the copies of the variables are deleted from memory. This mechanism
    is used by default. That is why when we call the swap() function, all operations
    are performed with the copies of the variables x and y. Thus, the values are swapped
    for the copies. The values of the variables x and y are still unchanged.


