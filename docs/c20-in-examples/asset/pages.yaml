  md: 'flexibility and richness of the C++ language. After having studied C++, it
    is much more comfortable "to adopt" other programming languages. But, in any case,
    C++ is a "must-know" language, and it will be in the nearest future. No doubt,
    C++ is an excellent choice to get familiar with programming.


    # The C++ Standards


    The C++ language was created as an extension of the C language in 1983. Since
    that time, several Standards of the C++ language were developed and approved.
    Those Standards are C++98, C++11, C++14, C++17, and C++20 (the number stands for
    the year the Standard was approved). Each Standard makes more or less essential
    improvements to the language and sometimes inefficient features.


    +   Notes


    To get information about which Standards are supported by compilers, you can visit
    https://en.cppreference.com/w/cpp/compiler_support.


    In the book, we will consider the most general and universal peculiarities of
    C++. So most programs from the book can be compiled by modern compilers. Nevertheless,
    there are also codes based on using the compilers that support C++20 Standard.


    > C++20 Standard\When it is crucial to use a compiler supporting C++20 Standard,
    we make special notes and explain what is essential and how it can be handled.


    # The Software


    In the book, we will consider a lot of different programs. It''s a good idea to
    study how they operate. But for a more in-depth understanding, it would be good
    to run the programs by yourself. For doing that, it is necessary to have the proper
    software.'
