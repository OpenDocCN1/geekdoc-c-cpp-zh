- pgno: 388
  md: '# Conclusion


    # Some Advice


    > If you don''t know where you are going, you might wind up someplace else.


    > Yogi Berra


    The book is over. The examples and problems have been considered and analyzed.
    Along with that, for most of the readers, all that is just the beginning of the
    hard (and, it is wanted to believe, happy) way in studying C++ programming language.
    That is why some advice for "future" would not be redundant. Perhaps, this will
    help to avoid mistakes and will keep the desire to move forward in studying C++
    principles. So, here they are.


    +   * There are no complete books, and there are no universal manuals. There are
    no comprehensive resources. There is always the smallest but not "closed" left.
    It is nothing wrong with that. Quite the contrary: the presence of questions and
    doubts is the right stimulus for self-development.


    +   * There are no secondary questions in studying programming. Sometimes, analysis
    of "tiny", insignificant, at first sight, effects gives much more for understanding
    the general concept than reading a manual.


    +   * There are no universal methods to implement programs. As usual, the same
    problem can be solved in different ways. For selecting the most appropriate one,
    it is essential to understand who is going to use the program and how the program
    will be used.


    +   * Software technologies are developing fast, and the preferences of the software
    end-users are changing drastically. So, it is crucial to foresee the trends. Without
    that, it is difficult to stay in the software market.


    +   * And, finally: the C++ programming language is a powerful, flexible, and
    efficient one. But, it is not the only programming language.


    So, good luck! And, of course, a lot of thanks for your interest in the book.'
