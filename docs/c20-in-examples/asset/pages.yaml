    operator overloading. To overload a certain operator, we have to describe a special
    operator function or operator method. An operator function or operator method
    is an almost ordinary function or method, except for some peculiarities. The name
    of the operator function or method is the operator keyword, followed by the operator
    symbol. The return type for the operator function or method is the type of the
    value, which is returned when the operator is applied to an object of the class.
    Arguments of an operator function are the operands of the'
