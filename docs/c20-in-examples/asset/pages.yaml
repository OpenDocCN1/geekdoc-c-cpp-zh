    objB of the base classes Alpha and Bravo. Since the class Charlie is the derivative
    one from the classes Alpha and Bravo, so these assignments are correct.


    Nevertheless, through the variable of a base class, we can access only those fields
    and methods, which we declared in the base class. This is why calling the method
    through the variable objA, we access only the field codeA and the version of the
    method show() declared in the class Alpha. Through the variable objB, we access
    the field codeB and the version of the method show() from the class Bravo.


    Things change when we use pointers. In the program, we create three pointers.
    They are the pointer ptrA to an object of the class Alpha, the pointer pntB to
    an object of the class Bravo, and the pointer pntC to an object of the class Charlie.
    We assign the address of the object objc of the derivative class Charlie to each
    pointer (to get the address we use the instruction &objc). These operations are
    also correct, and the reason is that the classes Alpha and Bravo are the base
    ones for the class Charlie. Nevertheless, if we call the method show() through
    the pointers ptrA and pntB, then that version of the method is called, which is
    described in the class Charlie.


    # Details


    As in the case with the object variables, the base class pointers access only
    those fields and methods of the derivative class, which we described in the base
    class. In other words, we access the field codeA through the pointer pntA, and
    we access the field codeB through the pointer pntB. But if we call an overridden
    virtual method through such a pointer, then the version of the method from the
    derivative class is called.


