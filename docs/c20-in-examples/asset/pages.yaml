    one. It is noteworthy to that:


    +   - We put the ampersand & before the name of the variable ref.

    - We assign the variable num to the variable ref, and we make this before the
    variable num gets the value itself.


    These two positions are typical for declaring references.


    | Theory |

    A reference is a variable that refers to memory, which was previously allocated
    for some other variable. With a little simplification, we may think that a reference
    is a kind of alias for another variable (that one that was assigned to the reference).
    The matter of fact is that when we declare an ordinary variable (not a reference),
    then memory is allocated for this variable. If we create a reference, then memory
    is not allocated for it. The reference uses the memory, which was previously allocated
    for another variable. As a result, we get two variables, and both of them use
    the same memory.

    The variable, whose memory we are going to use for a reference, we have to be
    assigned to the reference when we declare it. In this case, we have to put the
    ampersand & before the name of the reference. The ampersand & is the indicator
    of a reference. We create a reference for a particular variable, and the reference
    can''t be "tied" with another variable.|


    We perform the following operations with num and ref in the program:


    +   - We assign a value to the variable num, and then we print num and ref.

    - We assign a value to the reference ref, and then we print num and ref.'
