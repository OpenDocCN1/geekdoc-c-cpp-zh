    # Overloading Functions


    In the next program, we will calculate the yield of a bank account holder. In
    this case, we need to know the initial amount of money in the bank account, the
    annual interest rate, the deposit term (in years), and the number of the interest
    charges per year.


    # Details


    If the initial amount of money is $m$ and the annual interest rate is $r$, then
    after a year, the final amount is $m(1 + \frac{r}{100})$. If we consider deposit
    term in several years, and the annual interest rate is $r$ for each year, then
    after $y$ years, the final amount of money is $m(1+\frac{r}{100})^y$. All this
    is for the case when the interest is charged once per year. If the interest is
    charged $n$ times per year, then the effective interest rate is $\frac{r}{n}$.


