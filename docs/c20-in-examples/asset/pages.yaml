    # The Lagrange Interpolation Polynomial


    Briefly, we can formulate the interpolation problem as follows. There is a set
    of points x0, x1, x2, ..., xn (totally n + 1 points), and at these points, the
    values y0, y1, y2, ..., yn of some function are known. It is necessary to create
    a polynomial of the power n (the power of the polynomial is less than 1 by the
    number of points) such that in the points {xk} the polynomial has the values {yk}
    where k = 0,1,2, ..., n.


    We can solve this problem in different ways. Here we consider Lagrange''s method
    for creating the interpolation polynomial. In this case, we consider the polynomial
    in the form L_n(x) = \sum_{k=0}^n y_k \varphi_k(x). Here used the functions \varphi_k(x)
    = \frac{(x-x_0)(x-x_1)...(x-x_{k-1})(x-x_{k+1})...(x-x_n)}{(x_k-x_0)(x_k-x_1)...(x_k-x_{k-1})(x_k-x_{k+1})...(x_k-x_n)}
    and k = 0,1,2, ..., n. If we take into account that \varphi_k(x_k) = 0 for k \neq
    m and \varphi_k(x_k) = 1, then the conditions L_n(x_k) = y_k are satisfied automatically.'
