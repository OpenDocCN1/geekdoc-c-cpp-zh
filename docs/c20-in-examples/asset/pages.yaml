    # Enumerations


    Enumeration is a user-defined type whose values are restricted by a set of integer
    constants. To create an enumeration, we can use the following template:


    ```

    enum class name {constants};

    ```


    It begins with the enum and class keywords, followed by the enumeration name and
    a list of constant names. All constants are enclosed in curly braces and separated
    by commas. The first constant in the list gets value 0. The next one gets value
    1, then value 2, and so on. For example, the following statement creates the Number
    type:


    ```

    enum class Number {zero,one,two,three,four,five};

    ```


    A variable of type Number may have value zero, one, two, three, four, or five.
    The zero constant, in turn, has value 0. The one constant has value 1, and so
    on. The five constant has value 5. The constants'' values are calculated automatically
    according to the order the constants are placed within the list. The first constant
    gets value 0, and each other constant has a greater 1 value than the previous
    constant in the list.


    We can specify one or even all constants'' values explicitly. It is easy to do.
    We just have assign a value to the constant in the list. Let''s consider the following
    definition:


    ```

    enum class Number {one=1,five=5,ten=10};

    ```


    In this case, we have type Number whose variable may have value one, five, or
    ten. The values of the constants are 1, 5, and 10, respectively. We have assigned
    those values to the constants within the list.'
