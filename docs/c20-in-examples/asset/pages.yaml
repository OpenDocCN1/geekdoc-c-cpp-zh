- pgno: 159
  md: '# Chapter 4 Functions 160


    call of the function fibonacci() gives the next number from the Fibonacci sequence.


    # Notes


    In the Fibonacci sequence, the first and the second numbers are 1, and every next
    number is the sum of two previous numbers. So we have the sequence 1, 1, 2, 3,
    5, 8, 13, 21, and so on.


    How could that happen? Let''s consider what is going on when we call the function
    fibonacci().


    # Details


    It is essential that we call the function fibonacci() without arguments. So every
    time the call statement is the same, and the results are different.


    The first time we call fibonacci(), the previous variable gets the value 0, and
    the last variable gets the value 1. Then, previous gets 1 and last gets 1. The
    function returns 1. What is next? If previous and last were ordinary (not static)
    variables), they would be deleted from memory, and next time we call the function,
    the situation will be the same. But the variables are static, and they are not
    deleted from memory after the function is terminated. They are still alive, and
    when we call the function fibonacci() again, the function will use the same variables.
    Moreover, in case, the statements static int previous=0 and static int last=1
    are not executed, and the function uses the values that left from the previous
    call. So, the previous variable gets the value 1, and the last variable gets the
    value 2, the function returns 1. When calling fibonacci() the third time, the
    previous variable gets the value 2, and the last variable gets the value 3, the
    function returns 2, and so on.'
  merge: -1
  img_proc: true
