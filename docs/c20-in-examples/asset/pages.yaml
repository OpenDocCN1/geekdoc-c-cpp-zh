  md: "Besides variables, we can use constants. Unlike a variable, the value of a\
    \ constant can't be changed once it is defined. A constant can be created similar\
    \ to a variable, but we can use the const keyword.\n\n# C++20 Standard\n\nAlong\
    \ with type char, to handle characters, we can use types wchar_t, char8_t, char16_t,\
    \ and char32_t. The wchar_t type is used to store 16-bit characters. Types char16_t\
    \ and char32_t allow saving characters in UTF-16 and UTF-32 encoding, respectively.\
    \ The char8_t type was introduced in C++20 to store characters in UTF-8 encoding.\n\
    \nNow let's consider the program in Listing 1.2.\n\n# Listing 1.2. Converting\
    \ miles into kilometers\n\n```\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    // The conversion factor (kilometers in a mile)\n    const double\
    \ F=1.609344;\n    // The variables for storing a distance\n    // in miles and\
    \ kilometers:\n    double miles, kms;\n    // The prompt for entering a distance\
    \ in miles:\n    cout<<\"A distance in miles: \"\";\n    // Gets a distance in\
    \ miles:\n    cin>>miles;\n    // Converts miles into kilometers:\n    kms=miles*F;\n\
    \    // Prints the result of the calculations:\n    cout<<\"The distance in kilometers:\
    \ \"<<kms<<endl;\n    return 0;\n}\n```"
