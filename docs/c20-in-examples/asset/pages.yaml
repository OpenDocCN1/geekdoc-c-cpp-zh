    \ show(123), and show(\"String\"). Whenever we call the function, X is determined\
    \ by the type of the argument passed to the function, and the function is executed\
    \ with this value of the template parameter. For example, in the statement show('A'),\
    \ the function show() gets the argument of type char. So the function is executed\
    \ as if the parameter X were char. In the statement show(123), the parameter X\
    \ \"becomes\" int. When performing the statement show(\"String\"), the parameter\
    \ X stands for type char* (the type of a pointer to a character).\n\nIn the next\
    \ program, we use template functions in a more sophisticated way. Namely, we describe\
    \ two template functions. The function show() prints the contents of an array,\
    \ and the function sort() sorts an array by the bubble method. It is also notable\
    \ that the function sort() calls the function show().\n\n> Notes If we sort an\
    \ array (in ascending order) by the bubble method, we compare every adjacent elements.\
    \ If the element on the left is greater than the element on the right, then they\
    \ swap their values. The number of total passes through the array is less by 1\
    \ than the number of elements in the array. For each next pass, we should decrease\
    \ the number of checked elements by 1.\n\nLet's consider the program in Listing\
    \ 7.2.\n\nListing 7.2. Template functions\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n// The template function prints an array:\ntemplate<class T> void show(T*\
    \ m, int n) {\n  for(int i=0;i<n;i++) {\n    cout<<m[i]<<\" \";\n  }\n}\n```"
