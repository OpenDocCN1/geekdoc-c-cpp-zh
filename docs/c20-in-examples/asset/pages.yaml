    argument x): exp(x) = $\sum_{k=0}^{\infty} \frac{x^k}{k!}$ That is an infinite
    series. From a practical point of view, it is impossible to calculate it, so we
    use the approximate expression exp(x) $\approx 1 + x + \\frac{x^2}{2!} + \frac{x^3}{3!}
    + \dots + \frac{x^n}{n!}$ Therefore, to calculate the exponential function, we
    have the sum. The larger the number of terms, the more accurate the calculated
    value is.


    It is convenient to present the sum exp(x) = q_0 + q_1 + q_2 + \dots + q_n$, where
    $q_k = \frac{x^k}{k!}$ It is evident that $q_{k+1} = q_k \frac{x}{k+1}$ We use
    this in the program to calculate the exponential function.


