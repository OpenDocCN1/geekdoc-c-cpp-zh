    # Newton''s Method


    Next, we will consider another iteration method for solving equations. It is called
    Newton''s method, and its main idea is as follows:


    +   - To find the root of the equation $f(x) = 0$, we need to know the initial
    approximation $x_0$ for the root.

    - At the point $x_0$, we create the tangent line to the graph of the function
    $f(x)$.

    - The intersection point of the tangent line with the $x$-axis is the new approximation
    $x_1$ for the root of the equation.

    - At a point $x_1$, we create the tangent line, and its intersection point with
    the $x$-axis determines the new approximation $x_2$ for the root, and so on.


    We can reduce the described above scheme to the recurrent formula $x_{n+1} = x_n
    - \frac{f(x_n)}{f''(x_n)}$ for calculating the new approximation $x_{n+1}$ for
    the root based on the previous approximation $x_n$. Here $f''(x)$ stands for the
    derivative of the function $f(x)$. Listing 9.3 contains the program in which we
    solve an algebraic equation by Newton''s method.


    > Listing 9.3. Newton''s method


    ```

    #include <iostream>

    ```'
