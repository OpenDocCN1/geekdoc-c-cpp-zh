    internal arrays). The type identifier for the external array must contain the
    size of the internal arrays. So it is not enough to specify just that the external
    array consists of the internal arrays. It is necessary to specify the size of
    the internal arrays. When we pass a two-dimensional array to a function, we pass
    two characteristics. These are the name of the two-dimensional array with the
    size of the array for the second index (must be indicated explicitly) and an integer
    that determines the size of the two-dimensional array for the first index (the
