    create branch points in a program or just make the program work stably.


    # Theory


    If we want to handle exceptions, we put the code that can throw an exception into
    a try block. This block is marked with the try keyword, and its code is enclosed
    in curly braces. The try block is followed by one or several catch blocks. Each
    catch block handles the exception of a particular type. If an error arises when
    performing the code in the try block, then the execution of the block is terminated,
    and the catch block is executed, which handles errors of the given type.


    If we want to throw an exception, we can do that with the help of the instruction
    throw. It is followed by an object or variable that is an exception object, which
    is passed to the catch block for handling.


