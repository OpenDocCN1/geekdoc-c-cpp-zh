    # The Copy Constructor


    As we know, a class can contain several constructors. It is a good style to have
    at least two constructors in a class: the constructor without arguments and the
    constructor for creating a copy of an object (the copy constructor). In the last
    case, we mean creating an object based on another object.


    > Theory

    If we want to create an object based on an existing object (of the same class),
    then we should pass the original object to the constructor. An important rule
    is that we must pass it by reference. We may not pass an object by value, then
    for this object, a copy is created. For creating this copy, the copy constructor
    is called again. For passing the copy to this constructor, a copy of the copy
    is created. For creating the copy of the copy, the copy constructor is called,
    and so on. Thus, we get an infinite chain of recursive calls. That is not what
    we need.'
