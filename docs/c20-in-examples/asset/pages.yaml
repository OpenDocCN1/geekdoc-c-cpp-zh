    # Using Dynamic Memory


    Previously, we used static arrays. Memory for such arrays is allocated while compiling
    a program. It is impossible to change the size of the array after it is created.
    There are also dynamic arrays that exist, and memory for them is allocated when
    the program is executed.


    > Theory

    To allocate memory, we use the new operator followed by a type identifier. determines
    the type of the value that can be stored in the allocated memory. If we allocate
    memory for an array, then we put the size of the array in square brackets after
    the type identifier.

    A statement, which allocates memory, returns a result. For a single variable,
    it is the pointer to the allocated memory. For an array, it is the pointer to
    the first element of the array.

    If no longer need previously allocated memory, we can release it. In this case,
    we use the delete operator followed by the pointer to the memory, which we want
    to release. If we are going to release a dynamic array, we should put the empty
    square brackets [] between the delete operator and the pointer to the first element
    of the array.


    Listing 3.4 contains the program in which we create a dynamic array. We also fill
    this array and then delete it.'
