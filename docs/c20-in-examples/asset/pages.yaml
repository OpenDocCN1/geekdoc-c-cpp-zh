    # Details


    We can present each complex number $z$ in the form $z = x + iy$ (the algebraic
    form of the complex number), where the real numbers $x$ and **y** are the real
    and imaginary parts of the complex number, respectively. The imaginary unit $i$
    is such that $i^2 = -1$.


    We can add, subtract, multiply, and divide complex numbers in an ordinary way,
    except that we should take into account the relation $i^2 = -1$. For $z_1 = x_1
    + iy_1$, $z_2 = x_2 + iy_2$, $z_1 + z_2 = (x_1 + x_2) + i(y_1 + y_2)$, $z_1 -
    z_2 = (x_1 - x_2) + i(y_1 - y_2)$, $z_1 \cdot z_2 = (x_1 + x_1) + i(y_1 + y_2)$
    and $\frac{z_1}{z_2} = \frac{x_1+iy_1}{x_2+iy_2} = \frac{(x_1+iy_1)(x_2-iy_2)}{(x_2-y_1)(x_1-y_2)}{x_2^2+y_2^2}$.


    The complex conjugate of the number $z = x + iy$ is the number $z = x - iy$ (can
    be received from the original one by substituting $i$ with $-i$).


    The modulus $|z|$ of the complex number $z = x + iy$ is determined as $|z| = \sqrt{x^2
    + y^2}$.


    Besides the algebraic form, the trigonometric form of complex numbers exists.
    Namely, the number $z = x + iy$ can also be presented in the trigonometric form
    as $z = |z| \exp(i\phi)$, where $\phi$ stands for the argument of the complex
    number. It is notable that $\cos(\phi) = \frac{x}{|z|}$ and $\sin(\phi) = \frac{y}{|z|}$.
    We also take into account that $\exp(i\phi) = \cos(\phi) + i \cdot \sin(\phi)$.


    Let''s consider the program in Listing 8.3.


