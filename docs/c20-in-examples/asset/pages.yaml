    # The for Loop Statement


    In the previous chapter, we already created a program for calculating the sum
    of the squared numbers. We used the while statement in that example. Now we are
    going to solve the same problem using the for statement.


    > Theory

    The for statement must be described as follows. In parentheses after the for keyword,
    we put three sections, which are separated by semicolons. In curly braces, we
    put instructions, which will be executed repeatedly at each iteration. The for
    statement is executed in this way.

    * In the beginning, the statements in the first section are executed. It happens
    only once. These statements are never performed again after that.

    * Then the condition in the second section is tested. For continuing the execution,
    the condition must be true.

    * If the condition is true, then the statements in the curly braces are performed.

    * After that, the statements in the third section are executed.

    * Next, the condition in the second section is tested again. If it is true, then
    the statements in the curly braces are performed, and so on.

    * If the condition is false, then the execution of the for statement is terminated.


    Let''s consider the program in Listing 2.1.'
