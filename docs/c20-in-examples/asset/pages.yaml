  md: 'We implement the iteration process directly in the main function of the program.
    It is based on a loop statement that makes 10 iterations (the number of iterations
    is defined by the variable n). To calculate the derivative, whose value is used
    in the recurrent formula, we use the approximate formula f''(x) \approx (x+dx)-f(x)/dx.
    Thus, we consider the derivative as the change of the function divided by the
    change of the argument. The change (increment) of the argument is defined by the
    variable dx. As the initial approximation for the root, we use the zero value.
    To test the calculated result, we also print the "precise" value for the root.


