    # Deliver a Static Page


    The Go standard library net/http package provides three functions that allow a
    web server to easily respond to all HTTP requests with the contents of a nominated
    file system.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_292_0.png)


    The path of the root file directory is first specified as the argument to an http.Dir()
    function. This returns a Dir type that is then specified as the argument to an
    http.FileServer() function. This, in turn, returns a handler to respond to all
    HTTP requests with contents from the nominated root file directory.


    Finally, an http.Handle() function is used to register the handler. This requires
    two arguments to specify a route pattern and the handler’s name. Typically, the
    pattern "/" is used as the first argument – to match all request paths.


    The web browser can now request any document from within the nominated root file
    directory. If the file name is omitted from the request, the server will automatically
    seek a document named index.html to deliver to the browser.


    +   At the start of the main function, insert a statement to nominate the root
    directory of files to serve dir := http.Dir(

