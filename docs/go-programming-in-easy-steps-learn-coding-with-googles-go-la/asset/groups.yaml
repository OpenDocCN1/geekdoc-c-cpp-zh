    # Summary


    +   - An array is a fixed-length structure that stores data sequentially in individual
    elements.

    - An array declaration must specify the number of required elements between []
    square brackets.

    - The data stored in an array or slice element can be referenced by stating the
    element’s index number in [] square brackets.

    - An empty array can be created using the var keyword, or can be created and initialized
    by assigning an array literal.

    - The len() function returns the length of an array or slice.

    - The range keyword can be used to iterate through elements.

    - A slice is a variable-length structure that stores data sequentially in individual
    elements of an underlying array.

    - A slice comprises a pointer, length, and capacity.

    - The cap() function returns the capacity of a slice.

    - A slice declaration must not specify the number of elements between [] square
    brackets.

    - Upper and lower boundaries of a sequence of elements can be specified around
    a : colon character within [] square brackets.

    - An empty slice can be created using the make() function, or can be created and
    initialized by assigning a slice literal.

    - Elements can be added to a slice by the append() function.

    - A slice can be copied into another slice by the copy() function.

    - Pointers are not required when passing references to a function.

    - Variadic functions can be called with any number of arguments.

    - A map is a variable-length structure containing associated key/value pairs.

