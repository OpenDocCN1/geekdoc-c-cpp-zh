    string values, numeric integer and floating-point decimal values, and boolean
    truth values in your programs. Now, they can be used to create a Guessing Game
    program by storing a generated random integer whose the user will have to guess,
    a boolean truth value that will end the game the user guesses correctly, and a
    variable containing the user''s guess.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_234_0.png)


    The familiar Go standard library fmt package provides Scan(), Scanin(), and Scant()
    functions to read from standard input:


    +   - **fmt.Scan()** stores successive space-separated values into successive
    interface variables until it meets a newline.


    +   - **fmt.Scanln()** stores successive space-separated values into successive
    interface variables until a newline.


    +   - **fmt.Scanf()** stores successive space-separated values into interface
    variables using a specified format.


    Each of these functions returns two values, which are the number of items scanned
    and any read error. If no error is encountered, the error value will be nil as
    usual. Each function requires one or more arguments to specify the address of
    interface variables.


    The Guessing Game program can use the fmt.Scan() function to assign an input integer
    guess to an interface variable and compare its value against a generated random
    integer.


