    ## 显示变量值


    ![](img/fa565c410b0509c58bcab29ed0b49de9_39_0.png)


    变量的值可以使用第 1 章中显示“Hello World!”的 `fmt.Println()` 函数显示。另一种方法是通过 `fmt.Printf()` 指定位符指定变量所需的格式：


