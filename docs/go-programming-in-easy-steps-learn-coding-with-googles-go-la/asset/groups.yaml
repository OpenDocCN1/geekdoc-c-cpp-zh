    \ of the data structure to which it is attached, so the program need not access\
    \ the object directly.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_144_0.png)\n\
    \nA variable, function, or method, that is not directly accessible to the program\
    \ is said to be “encapsulated”. Encapsulation, inheritance, and polymorphism are\
    \ the three building-blocks of object-oriented programming.\n\nEncapsulation in\
    \ Go programming relies upon data-hiding in packages that are imported into a\
    \ program. Only variable names, function names, and method names that begin with\
    \ a capital letter will be exported to the program. Those that begin with a lowercase\
    \ letter will be inaccessible – i.e. they are encapsulated.\n\n+   First, begin\
    \ a cube.go utility file with a package declaration and a\nstruct definition\n\
