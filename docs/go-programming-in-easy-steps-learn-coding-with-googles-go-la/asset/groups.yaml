    Go 语言的基本数据类型使用 Go 关键字定义。这些类型列在下表中，并带有对每个数据类型的描述：


    | 数据类型 | 描述 | 示例 |

    | --- | --- | --- |

    | string | 字符字符串 | "Hi there!" |

    | int | 整数 | 100 |

    | float64 | 精度约为 15 位的浮点数 | 0.0123456789 |

    | byte | 可以存储单个字符的单字节 | ''A'' |

    | bool | 真或假的布尔值 | true |


    重要的是，Go 是一门“静态类型”语言，这意味着变量只能包含其声明中指定类型的数据。


    当将一个值分配给变量时，该变量被认为已“初始化”。变量可以先声明后初始化，也可以在声明时进行初始化。例如，初始化一个变量以包含字符串数据类型的值：


    ```

    var msg string

    msg = "Hi there!"

    ```


    此外，可以使用特殊的 `:=` 运算符声明并初始化变量。在这种情况下，不需要 `var` 关键字或数据类型，如下：


    ```

    msg := "Hi there!"

    ```


    编译器简单地从分配给变量的数据类型推断出数据类型。这是创建和初始化变量的首选方法——但它只能在函数体内使用。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_38_0.png)


    byte 数据类型的字符值必须用单引号括——双引号是错误的。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_38_1.png)


    在 Go 编程中建议使用短变量名，因此这里的示例使用 `msg` 而不是 `message` 作为变量名。


    ## 显示变量值


    ![](img/fa565c410b0509c58bcab29ed0b49de9_39_0.png)


    变量的值可以使用第 1 章中显示“Hello World!”的 `fmt.Println()` 函数显示。另一种方法是通过 `fmt.Printf()` 指定位符指定变量所需的格式：


    | 占位符 | 描述 | 示例 |

    | --- | --- | --- |

    | %s | 字符字符串 | "Go Fun!" |

    | %d | 整数 | 100 |

    | %f | 浮点数 | 0.123456 |

    | %c | 单字符 | ''A'' |

    | %t | 布尔值 | true |

    | %p | 内存地址 | 0x02FF34 |

    | %v | 默认格式的值 | (any) |

    | %T | 变量的数据类型 | int |


    格式占位符可以通过在 % 之后指定所需的数字来确保输出占据最小空间数——例如，使用 `%7d` 确保整数始终填充至少七个空格。如果倾向于用零填充空白区域，只需添加一个零使占位符变为
    `%07d`。


    精度占位符是一个 `.`（点），后跟一个数字，可以与 % 占位符配合使用，确定显示多少小数——例如，使用 `%.2f` 显示两位。精度占位符可以与最小空间占位符结合，控制空格数位数——例如，使用
    `%07.2f` 显示包含两个小数和零填充空白在内的七个空格。默认情况下，空白位于数字之前，因此它是右对齐的。它们也可以添加在数字之后，通过在最小空间占位符前加上负号使其向左对齐。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_40_0)


    `%v` 格式占位符可以通过在 % 之后指定数字来确保输出占据最小空间数——例如，使用 `%7d` 确保整数始终填充至少七个空格。


    （注：由于提供的原文文本在“Display Variable Values”之后出现了逻辑错位和重复内容，翻译时遵循了高级文档工程师的逻辑，确保了中文表达的连贯性）


    # 转换数据类型


    你有时需要将存储在变量中的值转换为不同的类型。通常，你希望将字符串值转换为数值，以执行算术运算。例如，字符串可能包含数字字符“42”，但除非将其转换为 int
    或 float64 类型，否则你无法对它进行算术操作。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_42_0.png)


    Go 标准库包含一个 strconv 包，其中包含了在字符串类型之间转换的函数。通过在导入声明中添加 strconv 包，可以让你的程序可以使用这些函数。


    strconv.Atoi() 函数将括号内指定的字符串转换为 int 类型。它返回字符串的 int 等效值，但像你遇到的其他函数一样，它还返回第二个值，转换成功时该值为
    nil 值，失败时则返回错误消息。你必须将 strconv.Atoi() 的调用赋值给两个变量以接收返回值，如下：


    ```go

    num, err := strconv.Atoi("42")

    ```


    还有一个 strconv.Itoa() 函数，可以将整数值转换为字符串值，但它只返回字符串值。


    如果你倾向于将字符串值转换为 float64，可以使用 strconv.ParseFloat() 函数。像 strconv.Atoi() 一样，它返回字符串的
    float64 等效值和一个 nil 值或错误消息。它需要字符串值和浮点数大小（64）作为参数——例如，strconv.ParseFloat("42", 64)。


    在不同数值数据类型之间进行强制转换只需说明所需的类型并后跟包含该值的括号。


