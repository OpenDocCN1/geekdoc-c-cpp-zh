    \nGo automatically recognizes when an interface is implemented.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_154_1.png)\n\
    \nWhen a struct implements an interface, the methods attached to the struct become\
    \ “honorary members” of the interface – so that when the interface is passed as\
    \ an argument, the function can call those methods via its interface parameter.\n\
    \n# Embed Interfaces\n\nJust as structs can be embedded in other structs, so can\
