    # Create Goroutines


    Go programs, like written in other programming languages, generally execute their
    code line-by-line in a sequential manner. But Go programming also supports “goroutines”
    that provide the ability for lines of code to be executed concurrently, side-by-side.
    This is a big reason why many people choose Go programming.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_257_0.png)


    Concurrency provides the potential to take advantage of multi-core processors,
    but it is important to distinguish the difference between concurrency and parallelism:


    +   **Parallelism** is when two tasks are performed at exactly the same time.
    For example, on a multi-core processor when one core is performing a task and
    another core is performing a different task – simultaneously. This, however, is
    difficult to achieve with program code that is executed line-by-line.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_257_1.png)


    +   **Concurrency** is the separation of program code into independently-executing
    tasks that could potentially run simultaneously and produce a correct final result.
    So a concurrent program is one that can be parallelized. Goroutines provide this
    ability in Go program code.'
