    # Summary


    +   - A function block contains a group of statements that get executed whenever
    that function is called.

    - A function can be declared using the func keyword followed by a name that adheres
    to the Go naming conventions.

    - A function declaration contains {} parentheses, followed by {} curly brackets
    to surround the statements to be executed.

    - The parentheses in a function declaration may contain a parameters list that
    specifies the type of each parameter.

    - Arguments passed to a function are, by default, passed by value – a copy of
    the original value.

    - Pointer arguments passed to a function are a reference to a memory address that
    is the location of the original value.

    - The return keyword allows one, or more, values to be returned to the caller
    after a function has executed its statements.

    - If a function returns values to the caller, each return type must be listed
    after the parameter list in the function declaration.

    - A function can call itself recursively to emulate a loop structure, but must
    test a condition to exit at some point.

    - Go supports first class functions that can be assigned to variables, passed
    as arguments, and returned from functions.

    - An anonymous function has no name and can be made self-invoking by appending
    the () call operator after the block.

    - A closure is a function nested an outer function that retains access to variables
    declared in the outer function.

    - The type keyword followed by a name and function signature can be used to create
    a custom function type.

    - Passing functions to other functions allows actions to be modified without repeating
    existing lines of code.'
