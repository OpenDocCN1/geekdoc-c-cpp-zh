    \ with an associated statement that will break out of the loop to an outer loop.\n\
    \nGo standard library time package provides a useful After() function that can\
    \ be used to create a \"timeout\" to limit execution time of the listening loop.\
    \ This requires a duration period as its argument, and returns a channel of the\
    \ time.Time type – that will be the future time after the duration beyond the\
    \ current time. Testing for when the current time matches the timeout channel\
    \ with a case statement can be used to exit a listening loop.\n\n- Begin by importing\
    \ the Go standard library time package, to wait for goroutines and to create a\
    \ timeout\n\n```\nimport (\n    \"fmt\"\n    \"time\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_271_0.png)\n\
    \nsrc\\select\\main.go\n\n- Next, in the main function, create a timeout channel\
