    name and changed by assigning a new value. The programmer can choose any name
    for a variable providing it adheres to the naming convention listed below:


    | Naming Rule | Example |

    | CANNOT be a Go keyword | default |

    | CANNOT contain arithmetic operators | a+b*c |

    | CANNOT contain punctuation characters | %$#! |

    | CANNOT contain any spaces | no spaces |

    | MUST start with a letter | msg |

    | CAN contain numbers | good1 |

    | CAN contain mixed case | camelCase |


    Variable names should be concise and always begin with a lowercase letter – unless
    the variable is made accessible to other packages (more on this later). It is
    good practice to choose meaningful names for variables to make the program code
    more easily understood. To create a variable in the program simply requires it
    to be “declared” using the `var` keyword. A variable declaration has this syntax:


    ```

    var variableName dataType

    ```


    The `var` keyword is followed by a space then the chosen variable name, then the
    type of data this this variable will be allowed to store. Typically, this will
    be'
