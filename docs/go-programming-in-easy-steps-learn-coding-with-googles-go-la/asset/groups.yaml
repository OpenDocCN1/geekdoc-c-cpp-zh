  mdcn: "\n\nGo 标准库 `time` 包的功能。这需要两个参数来指定布局（layout）和日期/时间字符串。很有用的是，此函数返回两个值：一个 `Time`\
    \ 数据类型和一个 `error`。如果函数返回 `Time` 数据类型，则错误值将为 `nil`，否则将是一个错误信息。\n\n布局应仅使用 Go 引用字符串中的值：\n\
    \nMon Jan 2 15:04:05 2006 MST\n\n除非在日期/时间字符串中指定了时区偏移值（例如 -0500），否则生成的 `Time` 数据类型将假设为\
    \ UTC 时间。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_194_0.png)\n\n可以使用此处描述的\
    \ `Format()` 方法格式化 Time 数据类型。\n\n- 1. 首先在程序中导入 Go 标准库 `time` 包\n```go\nimport\
    \ (\n\"fmt\"\n\"time\"\n)\n```\nsrc\\setdate\\main.go\n\n- 2. 接下来，创建并显示一个初始化为元旦正午的\
    \ Time 数据类型实例\n```go\ndt = time.Date(2025, time.January, 1, 12, 0, 0, time.Local)\n\
    fmt.Printf(\"InDateTime: %v\\n\\n\", dt)\n```\n\n- 3. 将日期增加两年到美国独立日，然后显示修改后的日期\n\
    ```go\ndt = dt.AddDate(2, 6, 3)\nfmt.Printf(\"DateTime: %v\\n\\n\", dt )\n```\n\
    \n- 4. 现在，初始化一个布局字符串和一个日期/时间字符串\n```go\nlayout := \"2006-Jan-02 03:04PM\"\nstr\
    \ := \"2030-Dec-25 12:30AM\"\n```\n\n- 5. 最后，尝试创建并显示 Time 数据类型的字段，如果尝试失败则显示错误消息\n\
    ```go\nt, err := time.Parse(layout, str)\nif err != nil {\n    fmt.Println(err)\n\
    } else {\n    fmt.Printf(\"Parsed DateTime: %v\\n\", t)\n}\n```\n\n- 6. 将程序文件保存在\
