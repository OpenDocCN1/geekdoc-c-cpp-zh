    \nIf the sender knows that no further values will be sent to the receiving channel,\
    \ it can usefully close that channel.\n\n# Use Worker Pools\n\nIf your program\
    \ has a queue of tasks to perform where the order in which the results are produced\
    \ is not important, you can employ a “worker pool” – using goroutines and channels.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_276_0.png)\n\nA worker pool lets you\
