    For finer control when writing text files, you can use the os package''s OpenFile()
    function. This requires three arguments to specify the path of the file to be
    written, a flag specifying the operation type, and the numerical file permissions
    of that file. The flags specifying the operation type are os package constants.
    For example: os.O_RDWR to read and write, os.O_APPEND to append text, and os.O_CREATE
    to create a new file if none exists.


