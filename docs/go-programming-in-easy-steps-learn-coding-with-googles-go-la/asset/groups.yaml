    further functions that allow you to also include the separators in the returned
    substrings.


    The strings package''s SplitAfter() function works like the Split() function,
    but includes the separator in the returned substrings. Similarly, the strings
    package''s SplitAfterN() function works like the SplitN() function, but includes
    the separator in the returned substrings.


