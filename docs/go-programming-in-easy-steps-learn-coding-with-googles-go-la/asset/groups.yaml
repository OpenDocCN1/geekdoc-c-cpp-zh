- md: "\nSave the program file in an \"err\" directory, then run the program to see\
    \ the error messages when the test fails\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_127_0.png)\n\
    \nYou will see the test if err != nil used in many Go programs as the standard\
    \ way to begin an error handler.\n\n# Separate Files\n\nAs your programs increase\
    \ in size it is often sensible to separate related sections of code into individual\
    \ files. You can simply add a file in the same package directory as the main.go\
    \ file and, providing it by declaring itself to belong to the same package (package\
