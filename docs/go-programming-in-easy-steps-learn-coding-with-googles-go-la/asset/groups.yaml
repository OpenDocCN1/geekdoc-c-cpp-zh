    # Buffer Input


    When you want to gather larger items of data into your program it is often preferable
    to store the data stream in a memory buffer. The Go standard library bufio (buffered
    input/output) package provides a Scanner type, which is a memory buffer with several
    useful methods to handle data streams. You can make this available to your program
    by importing the bufio package.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_237_0.png)


    A Scanner instance is first created by specifying a source from which to read
    data as an argument to the bufio package''s NewScanner() function. When the source
    is to be user input, you can import the Go standard library os package and specify
    os.Stdin (standard input) as the argument to NewScanner().


    The Scanner instance has a Scan() method that reads all the user input and a Text()
    method that returns the input that has been read as a single string value.


    The Scanner instance also has an Err() method that will return any read error.
    If no error is encountered, the error value will be nil as usual. It is useful
    to check for errors after calling the Scan() method and Text() method.


    If you want to separate the input into individual string items, you can import
    the Go standard library strings package and specify the input to its Fields()
    function, to split the string into words.


