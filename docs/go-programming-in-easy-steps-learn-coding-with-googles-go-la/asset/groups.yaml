    \ Function\n- Add Parameters\n- Return Values\n- Call Recursively\n- Enclose Anonymously\n\
    - Pass Functions\n- Handle Errors\n- Summary\n\n# 6 Build Structures\n- Group\
    \ Data\n- Attach Methods\n- Embed Structs\n- Encapsulate Features\n- Compose Elements\n\
    - Satisfy Interfaces\n- Embed Interfaces\n- Summary\n\n# 7 Create Arrays\n- Create\
    \ a Basic Array\n- Loop Through Elements\n- Make Slices\n- Slices Versus Arrays\n\
    - Map Keys and Values\n- Summary\n\n# 8 Harness Time\n- Get Dates\n- Get Times\n\
    - Format Date and Time\n- Set Date and Time\n- Recognize Zones\n- Delay Time\n\
    - Summary\n\n# 9 Manage Data\n- Unite Strings\n- Split Strings\n- Find Characters\n\
    - Convert Strings\n- Evaluate Numbers\n- Generate Random\n- Summary\n\n# 10 Handle\
    \ Input\n- Get User Input\n- Buffer Input\n- Command Flags\n- Read Files\n- Write\
    \ Files\n- Use Temporary Files\n- Summary\n\n# 11 Employ Concurrency\n- Get Goroutines\n\
    - Keep Waiting\n- Make Channels\n- Select Channels\n- Synchronize Goroutines\n\
    - Use Worker Pools\n- Summary\n\n# 12 Request Responses\n- Listen for Requests\n\
    - Handle a Request\n- Add Files to Serve\n- Deliver Static Page\n- Log Received\
    \ Data\n- Deliver Dynamic Response\n- Summary\n\n# How to Use This Book\n\nThe\
    \ examples in this book demonstrate features of the Go language (\"golang\"),\
    \ and the screenshots illustrate the actual results produced by the code. Certain\
    \ colorization conventions are used to clarify the code listed in the steps...\n\
    \nProgram code is colored black but built-in functions of the Go language are\
    \ blue, literal text and numeric values are red, and code comments are green,\
    \ like this:\n\n```go\npackage main\nimport \"fmt\"\n\nfunc main() {\n    // My\
    \ First Program.\n    fmt.Println(\"Hello World!\")\n}\n```\n\nDuring setup of\
    \ Go, you will select a “GOPATH” location on your computer which to create programs.\
    \ Each program will be created in a uniquely in GOPATH sub-directory named “src”.\
    \ To identify the source code for the example programs described in the steps,\
    \ an icon and file path appears in the margin:\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_7_0.png)\n\
    \nsrc/hello/main.go\n\n## Grab the Source Code\n\nFor convenience, the source\
    \ code files from all examples featured in this book are available in a single\
    \ ZIP archive. You can obtain this archive by following these easy steps:\n\n\
    - Browse to www.ineasteps.com then navigate to Free Resources and choose the Downloads\
    \ section\n\n> If you don’t achieve the result illustrated in any example, simply\
    \ compare your code to that in the original files you have downloaded to discover\
    \ where you went wrong.\n\n# 1 Get Started\n\nWelcome to the exciting world of\
    \ programming with Go. This chapter introduces the language and creates a workspace\
    \ where you can run your first Go program.\n\n- Meet the Go Language\n- Install\
    \ the Go Tools\n- Create the Go Workspace\n- Write a Go Program\n- Run a Go Program\n\
    - Format and Comment Code\n- Explore the VS Editor\n- Summary\n\n# Meet the Go\
    \ Language\n\nGo is a free open-source programming language created at Google\
    \ by Robert Griesemer, Rob Pike, and Ken Thompson – best known for development\
    \ of the Unix operating system. Google released version 1.0 of the Go language\
    \ (“golang”) in March 2012, since it has gained widespread popularity.\n\nGo programs\
    \ are written in plain text, then compiled into machine code by the Go compiler\
    \ to produce an executable binary version.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_10_0.png)\n\
    \nThe aims of the Go programming language are to be expressive, fast, efficient,\
    \ reliable, and simple to write. Some programming languages, such as C or C++,\
    \ are fast and reliable but not simple. Conversely, other programming languages\
    \ such as Java or Python are simple to write but not so efficient.\n\nGo is similar\
    \ to the C programming language in many ways, and is sometimes referred to as\
    \ a “C-like language” or “C for the 21st century”. But Go is much more than that,\
    \ as it adopts good ideas from many other programming languages, yet avoids features\
    \ that lead to complexity or unreliability.\n\nPerhaps most importantly, Go introduces\
    \ the ability to take advantage of multi-core CPU processing for concurrency using\
    \ “goroutines” and “channels”. This provides the potential for the computer to\
    \ deal with several things at the same time.\n\nAlthough the Go language does\
    \ not have the class structures found in Object Oriented Programming (OOP) languages,\
    \ such as C++ or Java, its features provide some degree of encapsulation, inheritance,\
    \ and polymorphism – the three cornerstones of OOP.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_11_0.png)\n\
    \nThe Go gopher – the iconic mascot of the Go language.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_11_1.png)\n\
    \nYou can discover many more programming language books in the Easy Steps series\
    \ – including C, C++, Java, and Python. Visit www.ineasystems.com to find out\
    \ more.\n\nWith so many programming languages to choose from, you may be wondering\
    \ why you should choose to learn Go programming – so here are some of the advantages\
    \ Go offers:\n\n# Simple Syntax\n\nThe Go language is concise, like Python. It's\
    \ as simple to write as Python but is more efficient, like C++. This enables you\
    \ to write code that is easy to read and maintain.\n\n# Compiled Language\n\n\
    The Go source code is compiled to binary machine code that can be read directly\
    \ by the computer, instead of being interpreted every time a program runs. This\
    \ enables the Go programs you to run faster than programs written for interpreted\
    \ languages, like Python or PHP.\n\n# The Go Compiler\n\nThe Go compiler is fast\
    \ and provides additional benefits, such as code optimization and error checking\
    \ – it can detect unused variables in your code,\n"
