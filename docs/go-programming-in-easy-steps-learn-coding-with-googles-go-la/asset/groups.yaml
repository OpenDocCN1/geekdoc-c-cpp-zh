    # # Summary


    +   - Go programs are plain text files that get compiled into machine code to
    produce an executable binary version.


    +   - The Go tools allow you to build, run, and test programs written in the Go
    programming language.


    +   - The Go installation includes standard packages of useful, trusted code that
    you can import into programs.


    +   - The command-line go command displays a list of the Go tool commands.


    +   - The GOROOT environment variable stores the location on your system where
    the Go installation is located.


    +   - The GOPATH environment variable stores the location on your system where
    your Go workspace is located.


    +   - The Go workspace is a directory name “go", containing sub-directories named
    “src", "bin", and "pkg".


    +   - The name of a Go package is that of the directory containing the Go source
    code files.


    +   - A Go package declaration specifies its type, and must be specified as package
