    # Recognize Zones


    All Time data types in Go programming are associated with a time zone.

    Typically, this will be UTC time, or the local time based upon the location of
    the system running the program. You can, however, specify an alternative location
    as an argument to a time.LoadLocation() function. The location name must correspond
    to a file in the Internet Assigned Numbers Authority (IANA) time zone database,
    such as "America/New_York", "Asia/Seoul", or "Europe/London". The time.LoadLocation()
    function returns two values, which are a Location type and an error. If the function
    successfully returns a Location type, the error value will be nil, otherwise it
    will be an error message.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_197_0.png)


