  - '[PAGE 100]


    # Summary


    +   The **if** keyword performs a basic conditional test to evaluate a given expression
    for a boolean value of **true** or **false**.


    +   The **else** keyword can be used to provide alternative statements to execute
    when an **if** statement finds an expression to **false**.


    +   Offering a program alternative directions in which to proceed following an
    evaluation is known as “**conditional branching**”.


    +   Conditional branching performed by multiple **if else** statements can often
    be performed more efficiently by a **switch** statement.


    +   The statements within a **switch** block must each appear on a separate line
    below the **case** statement.


    +   Optionally, a **switch** block may contain a **default** statement specifying
    statements to execute when no match is found.


    +   The **for** keyword can specify an initializer, a test-expression, and an
    incrementer, to control a loop.


    +   The **for** keyword can simply specify a test expression to determine whether
    a loop should continue while **true**.


    +   The **for** keyword can entirely omit the test-expression to create an infinite
    loop.


    +   A condition can be tested within the body of an infinite loop to end the loop
    with the **break** keyword.


    +   The **break** keyword can be used to terminate a loop, whereas the **continue**
    keyword can be used to skip a single iteration.


    +   Loops may be nested so that inner loops perform a sequence of iterations upon
    each iteration of their outer loop.


    +   Use of the **goto** keyword is generally not recommended, but it can legitimately
    be used to exit from nested loops.'
- md: "\n# 5\n\n## Produce Functions\n\nThis chapter demonstrates how statements can\
    \ be enclosed within a function for execution whenever the function is called\
    \ by the Go program.\n\n- Create a Basic Function\n- Add Parameters\n- Pass References\n\
    - Return Values\n- Call Recursively\n- Enclose Anonymously\n- Pass Functions\n\
    - Handle Errors\n- Separate Files\n- Summary\n\n## Create a Basic Function\n\n\
    Previous examples in this book have used the obligatory main() function and functions\
    \ contained in the Go standard library, such as the fmt.Println() function in\
    \ the “fmt” package. However, most Go programs contain a number of custom functions,\
    \ which can be called as required during the execution of the program.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_102_0.png)\n\
    \nA function block simply contains a group of statements that get executed whenever\
    \ that function is called. Once the function statements have been executed, program\
    \ flow resumes at the point directly following the function call. This modularity\
    \ is very useful in Go programming to isolate sequences of code that can be called\
    \ repeatedly as required.\n\nTo add a custom function into a Go program it must\
    \ be declared using the func keyword, followed by a name of your choice – adhering\
    \ to the same naming conventions used for variable names.\n\n| Naming Rule | Example\
    \ |\n|---|---|\n| CANNOT be a Go keyword | default |\n| CANNOT contain arithmetic\
    \ operators | a+b*c |\n| CANNOT contain punctuation characters | %$@! |\n| CANNOT\
    \ contain any spaces | no spaces |\n| MUST start with a letter | msg |\n| CAN\
    \ contain numbers elsewhere | good1 |\n| CAN contain mixed case | camelCase |\n\
    \nWhen choosing a function name it should describe the purpose of the function\
    \ but be concise. The function name is followed by () parentheses and an { opening\
    \ curly bracket, all on the same line. This line is often referred to as the function\
    \ “signature”. The statements to be executed are contained in the function body,\
    \ and the body ends with a } closing curly bracket – just as the main function.\
    \ The function can be called within a program by stating its name followed by\
    \ () parentheses.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_103_0.png)\n\nFunction\
    \ names should begin with a lowercase letter unless the function is to be exported\
    \ – see here.\n\n- 1. Create a function that will simply print a message each\
    \ time it gets called\n```go\nfunc first() {\n  msg := \"Hello from the 1st function!\"\
    \n  fmt.Println( msg )\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_103_1.png)\n\
    \n- 2. Create another function that will simply print the result of a multiplication\
    \ each time it gets called\n```go\nfunc sqFive() {\n  fmt.Printf(\"%v\\n\", 5\
    \ * 5)\n}\n```\n\n- 3. Next, add a main function that begins with a statement\
    \ that calls the first function to print its message\n```go\nfunc main() {\n \
    \ first()\n  // Statements to be inserted here.\n}\n```\n\n- 4. Now, insert statements\
    \ to display a multiplication sum and print its result\n```go\nfmt.Print(\"5 x\
    \ 5 = =\")\nsqFive()\n```\n\n- 5. Save the program file in a “funcs” directory,\
    \ then run the program to see the printed output\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_104_0.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_104_1.png)\n\nThe listed code assumes\
    \ you have declared **package main** and **import “fmt”** at the start of each\
    \ program.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_104_2.png)\n\nVariables\
    \ declared inside a function or other block are only accessible from within that\
    \ block – they have “local scope”. For example, here the **msg** variable is only\
    \ accessible from within the **first()** function. Variables declared outside\
    \ a function block are accessible from anywhere in the program – they have “global\
    \ scope”. It is preferable to use only local variables to avoid possible conflicts\
    \ with variables existing in global scope.\n\n## Add Parameters\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_105_0.png)\n\
    \nThe () parentheses that follow the function name in a function declaration can,\
    \ optionally, contain a comma-separated list of “parameters”. These variables\
    \ that can be used by the function but whose initial content is supplied by the\
    \ caller. The variables are created whenever the function gets called, and are\
    \ destroyed when control exits from the function. Each parameter must be given\
    \ a name of your choice, following the usual variable naming conventions, and\
    \ a type with this syntax:\n\n```\nfunc functionName (paramName type, paramName\
    \ type ) {\n\n  statements-to-be-executed\n}\n```\n\nMultiple consecutive parameters\
    \ of the same type can be declared as a list and need only specify the type after\
    \ the final parameter of the same type, like this:\n\n```\nfunc functionName (\
    \ paramName, paramName type ) {\n\n  statements-to-be-executed\n}\n```\n\nEach\
    \ function must specify content for each parameter, of the correct type and in\
    \ the same order as they appear in the function declaration. The contents being\
    \ passed to the function are known as “arguments”. These are specified as a comma-separated\
    \ list within the () parentheses following the function name in the call:\n\n\
    ```\nfunctionName ( argument, argument, argument )\n```\n\nUnlike some other programming\
    \ languages, Go has no way to specify default content for function parameters.\n\
    \nIt is very important to recognize that in Go programming, arguments are, by\
    \ default, passed “by value” – the function receives a copy of the argument, not\
    \ the original argument. This means that changes made to the parameter variables\
    \ not, by default, affect the original argument specified by the caller – they\
    \ only affect the copy.\n\n- Create a function that requires a single integer\
    \ argument and displays its value\n```go\nfunc square(num int) {\n\tfmt.Println(\"\
    Received Copy:\", num)\n\n\t// Statements to be inserted here.\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_106_0.png)\n\
    \nsrc/main.go\n\n- Next, insert statements to modify the received argument and\
    \ display its value\n```go\nnum = num * num\nfmt.Println(\"Modified Copy:\", num)\n\
    ```\n\n- Begin a main function that declares and initializes a variable, then\
    \ displays its value\n```go\nfunc main() {\n\tnum := 5\n\tfmt.Println(\"Original:\"\
    , num)\n\t// Statements to be inserted here.\n}\n```\n\n- Now, insert statements\
    \ in the main function to call the function and once more display its value\n\
    ```go\nsquare(&num)\nfmt.Println(\"Original:\", num)\n```\n\n- 5. Save the program\
    \ file in an “args” directory, then run the program to see the original value\
    \ is unchanged\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_107_0.png)\n\nYou can\
    \ also create “variadic functions” that accept any number of arguments – see here\
    \ for an example.\n\n## Pass References\n\nThe example here demonstrates that\
    \ in Go arguments are, by default, passed “by value” – the function receives a\
    \ copy of the argument, not the original argument. But quite often you may wish\
    \ a function to modify the original argument. This can be achieved by passing\
    \ an argument to the function that is a reference, rather than a copy of its value.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_108_0.png)\n\nRemember that pointers\
    \ are a reference to the memory address on your system where a value has been\
    \ stored. This means that if you pass a pointer argument to a function, it will\
    \ be able to modify the original value residing at the address provided by the\
    \ pointer.\n\nWhen declaring a function that can receive pointer arguments, a\
    \ data type specified in its parameter list must be prefixed by an * asterisk,\
    \ to indicate that this parameter will be a pointer, like this:\n\n```\nfunc functionName\
    \ ( paramName *type ) {\n  statements-to-be-executed\n}\n```\n\nThe function statements\
    \ can access and modify a value at the address provided by the pointer, by prefixing\
    \ the parameter name with an * asterisk as a dereferencer.\n\nWhen calling a function\
    \ that accepts a pointer argument, the argument must be prefixed with an & ampersand\
    \ character to reference the memory address at which the value is stored.\n\n\
    This technique can be used with the int, float64, string, and bool data types,\
    \ and\n"
  mdcn: "\n\n# 5\n\n## 函数产生\n\n本章演示了如何将语句封装在函数内部，以便在 Go 程序调用该函数时执行这些语句。\n\n- 创建基础函数\n\
    - 添加参数\n- 传递引用\n- 返回值\n- 递归调用\n- 匿名封装\n- 传递函数\n- 处理错误\n- 分离文件\n- 总结\n\n## 创建基础函数\n\
    \n书中的之前的示例使用了强制性的 `main()` 函数以及 Go 标准库中包含的函数，例如“fmt”包中的 `fmt.Println()` 函数。然而，大多数\
    \ Go 程序都包含许多自定义函数，这些函数可以在程序执行期间根据需要进行调用。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_102_0.png)\n\
    \n函数块包含一组语句，每当该函数被调用时，这些语句就会被执行。一旦函数执行执行，程序流将从函数调用后的直接后续点继续执行。这种模块化在 Go 编程中非常有用，它可以隔离出根据需要重复调用的代码序列。\n\
    \n要在 Go 程序中添加自定义函数，必须使用 `func` 关键字进行声明，后跟一个你选择的名称——遵循与变量名相同的命名规范。\n\n| 命名规则 |\
    \ 示例 |\n|---|---|\n| 不能是 Go 关键字 | default |\n| 不能包含算术运算符 | a+b*c |\n| 不能包含标点符号字符\
    \ | %$@! |\n| 不能包含任何空格 | no spaces |\n| **必须**以字母开头 | msg |\n| 在其他地方**可以**包含数字\
    \ | good1 |\n| **可以**包含混合大小写 | camelCase |\n\n在选择函数名时，它应该描述函数的用途，但要简洁。函数名后紧跟 `()`\
    \ 括号和一个 `{` 左大括号，它们都在同一行。这一行通常被称为函数的“签名”。要执行的语句包含在函数体中，函数体以 `}` 右大括号结束——就像 `main`\
    \ 函数一样。可以通过写出函数名并后跟 `()` 括号在程序中调用该函数。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_103_0.png)\n\
    \n除非该函数要被导出，否则函数名应该以小写字母开头——参见此处。\n\n- 1. 创建一个函数，每次被调用时简单打印一条消息\n```go\nfunc first()\
    \ {\n  msg := \"Hello from the 1st function!\"\n  fmt.Println( msg )\n}\n```\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_103_1.png)\n\n- 2. 创建另一个函数，每次被调用时简单打印乘法的结果\n\
    ```go\nfunc sqFive() {\n  fmt.Printf(\"%v\\n\", 5 * 5)\n}\n```\n\n- 3. 接下来，添加一个\
    \ `main` 函数，其第一条语句调用第一个函数以打印其消息\n```go\nfunc main() {\n  first()\n  // 在此处插入语句。\n\
    }\n```\n\n- 4. 现在，插入语句显示乘法和并打印其结果\n```go\nfmt.Print(\"5 x 5 = =\")\nsqFive()\n\
    ```\n\n- 5. 将程序文件保存到“funcs”目录中，然后运行程序以查看打印输出\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_104_0.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_104_1.png)\n\n列出的代码假设你已经在每个程序的开头声明了\
    \ **package main** 和 **import “fmt”**。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_104_2.png)\n\
    \n在函数或其他块内部声明的变量仅从该块内部访问——它们具有“局部作用域”。例如，在这里，**msg** 变量只能在 **first()** 函数内部访问。在函数块外部声明的变量可以在程序的任何地方访问——它们具有“全局作用域”。最好只使用局部变量，以避免与全局作用域中存在的变量发生可能的冲突。\n\
    \n## 添加参数\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_105_0.png)\n\n函数声明中函数名后的\
    \ `()` 括号可以可选包含一个用逗号分隔的“参数”列表。这些变量可以被函数使用，但它们的初始内容由调用者提供。每当函数被调用时，变量就会被创建，并在控制退出函数时被销毁。每个参数必须赋予一个你选择的名称（遵循通常的变量命名规范）以及一个类型如下语法：\n\
    \n```\nfunc functionName (paramName type, paramName type ) {\n\n  statements-to-be-executed\n\
    }\n```\n\n多个连续的相同类型的参数可以声明为列表，并且只需要在相同类型的最后一个参数之后指定类型，如下所示：\n\n```\nfunc functionName\
    \ ( paramName, paramName type ) {\n\n  statements-to-be-executed\n}\n```\n\n每个函数必须为每个参数指定正确类型的内容，且顺序与它们在函数声明中出现的相同。传递给函数的内容被称为“参数”。它们在调用时作为函数名后的\
    \ `()` 括号内以逗号分隔的列表进行指定：\n\n```\nfunctionName ( argument, argument, argument )\n\
    ```\n\n与其他某些编程语言不同，Go 没有为函数参数指定默认内容的方法。\n\n在 Go 编程中，非常重要的一点是，参数默认是“按值传递”的——函数接收的是参数的副本，而不是原始参数。这意味着对参数变量所做的更改默认情况下不会影响调用者指定的原始参数——它们只会影响副本。\n\
    \n- 创建一个需要单个整数参数并显示其值的函数\n```go\nfunc square(num int) {\n\tfmt.Println(\"Received\
    \ Copy:\", num)\n\n\t// 在此处插入语句。\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_106_0.png)\n\
    \nsrc/main.go\n\n- 接下来，插入语句修改接收到的参数并显示其值\n```go\nnum = num * num\nfmt.Println(\"\
    Modified Copy:\", num)\n```\n\n- 开始一个 `main` 函数，声明并初始化一个变量，然后显示其值\n```go\nfunc\
    \ main() {\n\tnum := 5\n\tfmt.Println(\"Original:\", num)\n\t// 在此处插入语句。\n}\n\
    ```\n\n- 现在，在 `main` 函数中插入语句调用函数并再次显示其值\n```go\nsquare(&num)\nfmt.Println(\"Original:\"\
    , num)\n```\n\n- 5. 将程序文件保存到“args”目录中，然后运行程序以查看原始值未变\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_107_0.png)\n\
    \n你还可以创建接受任意数量参数的“变变函数”——参见此处示例。\n\n## 传递引用\n\n此示例演示了在 Go 中参数默认是“按值传递”的——函数接收的是参数的副本，而不是原始参数。但很多时候你可能希望函数修改原始参数。这可以通过向函数传递值的引用而非值的副本来实现。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_108_0.png)\n\n记住，指针是对存储了值的内存地址的引用。这意味着如果你向函数传递指针参数，它将能够修改位于所提供地址上的原始值。\n\
    \n在声明可以接收指针参数的函数时，其参数列表中指定的数据类型必须以 `*` 号为缀，以指示该参数将是一个指针，如下：\n\n```\nfunc functionName\
    \ ( paramName *type ) {\n  statements-to-be-executed\n}\n```\n\n函数语句可以通过在参数名前加上\
    \ `*` 号作为解引用符来访问并修改所提供地址的值。\n\n在调用接受指针参数的函数时，参数必须以 `&` 字符为前缀，以引用存储值的内存地址。\n\n"
