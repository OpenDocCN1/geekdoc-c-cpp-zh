- md: "\ncompleteness.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_219_0.png)\n\n\
    The Golden Ratio appears many times in geometry and art. It is the ratio of a\
    \ line segment cut into two pieces of different lengths, where the length ratio\
    \ of the long piece to the short piece is equal to the length ratio of the whole\
    \ segment to the long piece.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_219_1.png)\n\
    \n- 1. Begin importing the Go standard library math package into a program\n```go\n\
    import (\n  \"fmt\"\n  \"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_219_2.png)\n\
    \nsrc\\area\\main.go\n\n- 2. Declare three floating-point variables\n```go\nvar\
    \ rad, area, perim float64\n```\n\n- 3. Next, initialize the first variable and\
    \ display its value to two decimal places\n```go\nrad = 4\nfmt.Printf(\"\\nRadius\
    \ of Circle: %.2f \\n\", rad )\n```\n\n- 4. Now, calculate the area of a circle\
    \ based on the given radius, then display the area to two decimal places\n```go\n\
    area = math.Pi * (rad * rad)\nfmt.Printf(\"InArea of Circle: %.2f \\n\", area)\n\
    ```\n\nThen, calculate the perimeter of a circle based on the given radius, and\
    \ display the perimeter to two decimal places\n```go\nperim = 2 * (math.Pi * rad)\n\
    fmt.Printf(\"InPerimeter of Circle: %.2f \\n\", perim)\n```\n\nSave the program\
    \ file in an \"area\" directory, then run the program to see the calculated values\n\
    \n```\nC:\\Users\\mike\\_go\\src> run area\nRadius of Circle: 4.00\nArea of Circle:\
    \ 50.27\nPerimeter of Circle: 25.13\nC:\\Users\\mike\\_go\\src>\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_220_0.png)\n\
    \nRefer back here for more on formatting decimal places in output.\n\n## Evaluate\
    \ Numbers\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_221_0.png)\n\nThe Go math\
    \ package provides these useful functions that can be used to evaluate float64\
    \ arguments:\n\n| Function | Returns |\n| --- | --- |\n| math.Abs() | An absolute\
    \ value |\n| math.Acos() | An arc cosine value |\n| math.Asin() | An arc sine\
    \ value |\n| math.Atan() | An arc tangent value |\n| math.Atan2() | An angle from\
    \ an X-axis |\n| math.Ceil() | A rounded-up value |\n| math.Cos() | A cosine value\
    \ |\n| math.Exp() | An exponent of constant e |\n| math.Floor() | A rounded-down\
    \ value |\n| math.IsNaN() | A boolean true or false value |\n| math.Log() | A\
    \ natural logarithm value |\n| math.Max() | The larger of two numbers |\n| math.Min()\
    \ | The smaller of two numbers |\n| math.Pow() | A power value |\n| math.Round()\
    \ | The nearest integer value |\n| math.Sin() | A sine value |\n| math.Sqrt()\
    \ | A square root value |\n| math.Tan() | A tangent value |\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_0.png)\n\
    \nThe math.isnan() function (Is-Not-a-number) is useful to discover whether a\
    \ value cast to the float64 data type is indeed a number.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_1.png)\n\
    \nThe math package contains lots more functions but those listed here are useful\
    \ for many mathematical operations. Discover more in the Go documentation at golang.org/pkg/math\n\
    \n- Begin by importing the Go standard library math package into a program\n```go\n\
    import (\n\"fmt\"\n\"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_2.png)\n\
    \nsrc\\maxmin\\main.go\n\n- Next, initialize two variables\n```go\nsquare := math.Pow(5,\
    \ 2) // 5 to power 2 ( 5 x 5 )\ncube := math.Pow(4, 3) // 4 to power 3 ( 4 x 4\
    \ x 4)\n```\n\n- Now, compare the positive value of the variables and display\
    \ the largest and smallest numbers\n```go\nfmt.Println(\"\\nLargest Positive:\"\
    , math.Max(square, cube))\nfmt.Println(\"\\nSmallest Positive:\", math.Min(square,\
    \ cube))\n```\n\n- Then, add statements to reverse the numerical polarity of each\
    \ variable – making positive values into negative values\n```go\nsquare *= -1\n\
    cube *= -1\n```\n\nFinally, compare the negative value of the variables and display\
    \ the largest and smallest numbers\n```go\nfmt.Println(\"\\nLargest Negative:\"\
    , math.Max(square, cube))\nfmt.Println(\"\\nSmallest Negative:\", math.Min(square,\
    \ cube))\n```\n\nSave the program file in a “maxmin” directory, then run the program\
    \ to see the compared values\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_223_0.png)\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_223_1.png)\n\nThe largest negative value\
    \ is the closest to zero.\n\n## Round Decimals\n\nThe Go standard library math\
    \ package provides a number of useful functions for rounding a decimal value to\
    \ a near integer. These functions are listed in the table below, together with\
    \ a brief description of each:\n\n| Function | Returns |\n| --- | --- |\n| math.Floor(\
    \ x ) | The greatest integer less than x |\n| math.Ceil( x ) | The least integer\
    \ greater than x |\n| math.Round( x ) | The nearest integer to x |\n| math.Trunc(\
    \ x ) | The integer part of x |\n\nIf you want to reduce a floating-point value\
    \ to just two decimal places, first multiply the floating-point value by 100,\
    \ then use math.Round() to remove any decimal places, then divide by 100.\n\n\
    Procedures that multiply, operate, then divide can be written as individual steps,\
    \ or parentheses can be used to determine the order in a single expression. For\
    \ example, converting a long point value in a variable named \"num\" can be written\
    \ as:\n\n```go\nnum = num * 100\nnum = math.Round(num)\nnum = num / 100\n```\n\
    \nor alternatively as:\n\n```go\nnum = math.Round(num * 100) / 100\n```\n\nThe\
    \ Go programming language has a strong type system that unlike other languages,\
    \ does not support type conversion (a.k. \"casting\") implicitly. You can, however,\
    \ perform explicit type conversion between compatible data types, such as float64\
    \ and int using the syntax dataType(value) to convert a value to another type.\
    \ In converting a floating-point value to an integer, the value is truncated.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_225_0.png)\n\nThe math.Round() function\
    \ will round up from the mid-point, so math.Round(7.5) returns 8.\n\n- Begin by\
    \ importing the Go standard library math package into a program\n```go\nimport\
    \ (\n\"fmt\"\n\"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_225_1.png)\n\
    \nsrc/round/main.go\n\n- Initialize a floating-point variable and display its\
    \ value\n```go\nvar pi float64 = math.Pi\nfmt.Println(\"Pi:\", pi)\n```\n\n- Next,\
    \ display nearest integers to the floating-point value\n```go\nfmt.Println(\"\
    Floor:\", math.Floor(pi))\nfmt.Println(\"Ceiling:\", math.Ceil(pi))\nfmt.Println(\"\
    Round:\", math.Round(pi))\nfmt.Println(\"Truncated:\", math.Trunc(pi))\n```\n\n\
    - Now, reduce the floating-point value to two places\n```go\nfmt.Println(\"InShort:\"\
    , math.Round(pi * 100) / 100)\n```\n\n- Finally, initialize another floating-point\
    \ variable and cast its value to an integer variable\n```go\nvar e1 float64 =\
    \ math.E\nfmt.Printf(\"In: %v %v %T\\n\", e1, e1)\nvar e2 int = int(e1)\nfmt.Printf(\"\
    Cast: %v %v %T\\n\", e2, e2)\n```\n\nSave the program file in a \"round\" directory,\
    \ then run the program to see the rounded decimals\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_226_0.png)\n\
    \n## Generate Randoms\n\nThe Go standard library math package contains a rand\
    \ package that provides functions to generate pseudo-random numbers. You can make\
    \ this available to your program by importing math/rand.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_227_0.png)\n\
    \nThe rand.Intn() function returns a random number from zero up to the number\
    \ specified as its argument. The rand.Perm() function returns a sequence of integers,\
    \ from zero up to the number specified as its argument, in a pseudo-random order.\n\
    \nThe randomizing pattern is based upon a default “seed” that will return the\
    \ same pseudo-random order each time the program runs. This may be what you want,\
    \ but often it is preferable to generate a different order each time the program\
    \ runs. To make this happen, you must specify a custom seed as an integer argument\
    \ to a rand.Seed() function that will be unique each time the program runs. It\
    \ is convenient to use the current system time for this purpose by calling the\
    \ time.Now() function and extracting the integer count of elapsed nanoseconds\
    \ since the Epoch using the Time data type UnixNano() method. This value will\
    \ be different each time the program runs, so specifying this integer as the argument\
    \ to the rand.Seed() function will ensure a different pseudo-random order is generated\
    \ each time the program runs.\n\n- Import the Go standard library math/rand package\
    \ into a program, along with the time package to set a random seed and the strconv\
    \ package to convert random numbers\n\n```go\nimport (\"fmt\"\n    \"math/rand\"\
    \n    \"strconv\"\n    \"time\")\n```\n"
  mdcn: "\n完整性。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_219_0.png)\n\n黄金比例在几何和艺术中多次出现。它是一个线段被切成两个长度不同的部分时的比例，其中长段与短段的长度比例等于整个段与长段的长度比例。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_219_1.png)\n\n- 1. 开始在程序中导入 Go 标准库的\
    \ math 包\n```go\nimport (\n  \"fmt\"\n  \"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_219_2.png)\n\
    \nsrc\\area\\main.go\n\n- 2. 声明三个浮点变量\n```go\nvar rad, area, perim float64\n```\n\
    \n- 3. 接下来，初始化第一个变量并将其值保留两位小数显示\n```go\nrad = 4\nfmt.Printf(\"\\nRadius of Circle:\
    \ %.2f \\n\", rad )\n```\n\n- 4. 现在，根据给定的半径计算圆面积，然后将面积保留两位小数显示\n```go\narea =\
    \ math.Pi * (rad * rad)\nfmt.Printf(\"InArea of Circle: %.2f \\n\", area)\n```\n\
    \n然后，根据给定的半径计算圆周长，并将周长保留两位小数显示\n```go\nperim = 2 * (math.Pi * rad)\nfmt.Printf(\"\
    InPerimeter of Circle: %.2f \\n\", perim)\n```\n\n将程序文件保存到 \"area\" 目录中，然后运行程序查看计算出的值\n\
    \n```\nC:\\Users\\mike\\_go\\src> run area\nRadius of Circle: 4.00\nArea of Circle:\
    \ 50.27\nPerimeter of Circle: 25.13\nC:\\Users\\mike\\_go\\src>\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_220_0.png)\n\
    \n参考此处获取更多关于输出中格式化小数的知识。\n\n## 评估数值\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_221_0.png)\n\
    \nGo math 包提供了这些这些函数，可用于评估 float64 参数：\n\n| 函数 | 返回 |\n| --- | --- |\n| math.Abs()\
    \ | 绝对值 |\n| math.Acos() | 反余弦值 |\n| math.Asin() | 反正弦值 |\n| math.Atan() | 反正切值\
    \ |\n| math.Atan2() | 距离 X 轴的角 |\n| math.Ceil() | 向上取整的值 |\n| math.Cos() | 余弦值\
    \ |\n| math.Exp() | 常数 e 的幂次方 |\n| math.Floor() | 向下取整的值 |\n| math.IsNaN() | 布尔值真或假\
    \ |\n| math.Log() | 自然对数值 |\n| math.Max() | 两个数中较大的一个 |\n| math.Min() | 两个数中较小的一个\
    \ |\n| math.Pow() | 幂值 |\n| math.Round() | 最接近的整数值 |\n| math.Sin() | 正弦值 |\n|\
    \ math.Sqrt() | 平方根值 |\n| math.Tan() | 正切值 |\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_0.png)\n\
    \nmath.isnan() 函数（非数字）用于发现转换为 float64 数据类型的值是否确实是一个数字。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_1.png)\n\
    \nmath 包包含许多更多函数，但这里列出的函数对于许多数学运算都是很有用。可以在 Go 文档 golang.org/pkg/math 中发现更多。\n\n\
    - 开始在程序中导入 Go 标准库的 math 包\n```go\nimport (\n\"fmt\"\n\"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_222_2.png)\n\
    \nsrc\\maxmin\\main.go\n\n- 接下来，初始化两个变量\n```go\nsquare := math.Pow(5, 2) // 5\
    \ 的 2 次方 ( 5 x 5 )\ncube := math.Pow(4, 3) // 4 的 3 次方 ( 4 x 4 x 4)\n```\n\n-\
    \ 现在，比较变量的正值并显示最大和最小数\n```go\nfmt.Println(\"\\nLargest Positive:\", math.Max(square,\
    \ cube))\nfmt.Println(\"\\nSmallest Positive:\", math.Min(square, cube))\n```\n\
    \n- 然后，添加语句反转每个变量的数值极性——将正值变为负值\n```go\nsquare *= -1\ncube *= -1\n```\n\n最后，比较变量的负值并显示最大和最小数\n\
    ```go\nfmt.Println(\"\\nLargest Negative:\", math.Max(square, cube))\nfmt.Println(\"\
    \\nSmallest Negative:\", math.Min(square, cube))\n```\n\n将程序文件保存到 “maxmin” 目录中，然后运行程序查看比较后的值\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_223_0.png)\n![](img/fa565c410b0509c58bcab29ed0b49de9_223_1.png)\n\
    \n最大的负值是最接近零的。\n\n## 小数四舍五入\n\nGo 标准库 math 包提供了许多将小数接近整数的有用函数。这些函数列在下表中，并附有每个函数的简要描述：\n\
    \n| 函数 | 返回 |\n| --- | --- |\n| math.Floor( x ) | 小于 x 的整数 |\n| math.Ceil( x )\
    \ | 大于 x 的整数 |\n| math.Round( x ) | 接近 x 的整数 |\n| math.Trunc( x ) | x 的整数部分 |\n\
    \n如果你想将一个浮点值减少为仅两位小数，先将浮点值乘以 100，然后使用 math.Round() 移除任何小数位，然后除以 100。\n\n乘法、操作、除法的步骤可以写成单独步骤，或者可以使用括号在单个表达式中确定顺序。例如，将名为\
    \ \"num\" 的变量中的长浮点值可以写为：\n\n```go\nnum = num * 100\nnum = math.Round(num)\nnum\
    \ = num / 100\n```\n\n或者作为：\n\n```go\nnum = math.Round(num * 100) / 100\n```\n\
    \nGo 编程语言具有强大的类型系统，与其他语言不同，它不支持隐式类型转换（即“强制转换”）。然而，你可以在兼容的数据类型之间执行显式类型转换，例如使用 float64\
    \ 和 int，使用 `dataType(value)` 语法将值转换为另一种类型。在将浮点值转换为整数时，math.Round() 会从中间点向上舍入，所以\
    \ math.Round(7.5) 返回 8。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_225_0.png)\n\
    \n- 开始在程序中导入 math 包\n```go\nimport (\n\"fmt\"\n\"math\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_225_1.png)\n\
    \nsrc\\round\\main.go\n\n- 初始化一个浮点变量并显示其值\n```go\nvar pi float64 = math.Pi\nfmt.Println(\"\
    Pi:\", pi)\n```\n\n- 接下来，显示浮点值的整数部分\n```go\nfmt.Println(\"Floor:\", math.Floor(pi))\n\
    fmt.Println(\"Ceiling:\", math.Ceil(pi))\nfmt.Println(\"Round:\", math.Round(pi))\n\
    fmt.Println(\"Truncated:\", math.Trunc(pi))\n```\n\n- 现在，将浮点值减少到两位\n```go\nfmt.Println(\"\
    In:\", math.Round(pi * 100) / 100)\n```\n\n- 最后，初始化另一个浮点变量并将其转换为整数变量\n```go\n\
    var e1 float64 = math.E\nfmt.Printf(\"In: %v %T\\n\", e1, e1)\nvar e2 int = int(e1)\n\
    fmt.Printf(\"Cast: %v %T\\n\", e2, e2)\n```\n\n将程序文件保存到 \"round\" 目录中，然后运行程序查看四舍五入的小数\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_226_0.png)\n\n## 生成随机数\n\nGo 标准库包含一个\
    \ rand 包，提供了生成伪随机数的函数。你可以通过导入 math/rand 使之你的程序可用。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_227_0.png)\n\
    \nrand.Intn() 函数返回从 0 到指定参数的随机数。rand.Perm() 函数返回从 0 到指定参数整数序列，按伪随机顺序排列。\n\n随机化模式基于默认的“种子”，该种子在每次程序运行时都会返回相同的伪随机顺序。这可能是你需要的，但通常倾向于在每次程序运行时生成不同的顺序。为了实现这一点，你必须指定一个自定义种子作为整数参数传递给\
    \ rand.Seed() 函数，该种子在每次程序运行时都是唯一的。为了方便，可以使用当前系统时间为此，通过调用 time.Now() 函数并使用 Time\
    \ 数据类型的 UnixNano() 方法提取自 Epoch 的的纳秒计数。此值在每次程序运行时都是不同的，因此将此整数作为 rand.Seed() 函数的参数将确保每次运行时生成不同的伪随机顺序。\n\
    \n- 在程序中导入 Go 标准库 math/rand 包，同时包含 time 包以设置随机种子以及 strconv 包以转换随机数\n\n```go\n\
    import (\"fmt\"\n    \"math/rand\"\n    \"strconv\"\n    \"time\")\n```\n"
