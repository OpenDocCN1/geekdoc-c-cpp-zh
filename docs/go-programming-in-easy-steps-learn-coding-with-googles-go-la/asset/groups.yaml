    \ Code to be executed when a match is found is included in each case statement.\n\
    \nIt is important that each statement to be executed must appear on its own line,\
    \ starting on the line below the case statement.\n\nOptionally, the list of case\
    \ statements can be followed by a single final default statement to specify code\
    \ in the event that no matches are found within any of the case statements. So\
    \ the syntax of a switch statement typically looks like:\n\n```go\nswitch test-value\
    \ {\n  case match-value :\n    statements-to-execute-when-matched\n  case match-value\
    \ :\n    statements-to-execute-when-matched\n  case match-value :\n    statements-to-execute-when-matched\n\
    \  default:\n    statements-to-execute-when-no-match-found\n}\n```\n\nWhere a\
