    \nWhen creating utility functions that may be useful to many programs, it is more\
    \ appropriate to store these in a file contained in a separate package that can\
    \ be imported into any program.\n\nWith imported custom packages it is important\
    \ to recognize that only functions and variables whose name begins with a capital\
    \ letter will be accessible from the importing file.\n\nTo use a function in an\
    \ imported file, the function name must be prefixed by the package name, just\
    \ as with the fmt.Printf() function imported from the “fmt” package.\n\nThe example\
    \ here could, for instance, be separated into two packages so the validation function\
    \ could be exported.\n\n- First, begin a verify.go utility file with package and\
    \ import declarations\n```go\npackage verify\nimport \"fmt\"\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_128_1.png)\n\
    \n```\nsrc\\verify\\verify.go\n```\n\n- Add the validation function – but change\
    \ its name to begin with a capital letter\n\n```go\n// IsPosInt tests for positive\
    \ argument.\nfunc IsPosInt(num int) (int, error) {\n    if num < 1 {\n       \
    \ err := fmt.Errorf(\"%v not a positive integer\", num)\n        return -1, err\n\
    \    }\n    return num, nil\n}\n```\n\n- Save the file in a \"verify\" directory\
    \ inside your \"src\" folder\n\n- Enter the command `go install verify` to create\
    \ a compiled archive file named \"verify.a\" within your go/pkg folder\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_129_0.png)\n\
    \nCreating a Go archive package means that the utility file need not be recompiled\
    \ each time an importing file is compiled.\n\n- Next, begin a main.go program\
    \ with package and import declarations\n```go\npackage main\nimport (\n    \"\
    fmt\"\n    \"verify\"\n)\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_129_1.png)\n\
    \nsrc\\prog\\main.go\n\n- Now, add the main function, prefixing the amended imported\
    \ function name by its package name\n```go\nfunc main() {\n    for i := 2; i >=\
    \ -2; i-- {\n        res, err := verify.IsPosInt(i)\n        if err != nil {\n\
    \            fmt.Println(\"Failed\", err)\n        } else {\n            fmt.Println(res,\
    \ \"Passed!\")\n        }\n    }\n}\n```\n\nSave the program file in a “prog”\
    \ directory\n\nFinally, enter the command *prog* (/prog on Linux) to run the program\
    \ and see the error messages when the test fails\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_130_0.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_130_1.png)\n\nWhen importing multiple\
    \ packages, the import declaration must list them on individual lines between\
    \ parentheses.\n\n# Summary\n\n- A function block contains a group of statements\
    \ that get executed whenever that function is called.\n- A function can be declared\
    \ using the func keyword followed by a name that adheres to the Go naming conventions.\n\
    - A function declaration contains {} parentheses, followed by {} curly brackets\
    \ to surround the statements to be executed.\n- The parentheses in a function\
    \ declaration may contain a parameters list that specifies the type of each parameter.\n\
    - Arguments passed to a function are, by default, passed by value – a copy of\
    \ the original value.\n- Pointer arguments passed to a function are a reference\
    \ to a memory address that is the location of the original value.\n- The return\
    \ keyword allows one, or more, values to be returned to the caller after a function\
    \ has executed its statements.\n- If a function returns values to the caller,\
    \ each return type must be listed after the parameter list in the function declaration.\n\
    - A function can call itself recursively to emulate a loop structure, but must\
    \ test a condition to exit at some point.\n- Go supports first class functions\
    \ that can be assigned to variables, passed as arguments, and returned from functions.\n\
    - An anonymous function has no name and can be made self-invoking by appending\
    \ the () call operator after the block.\n- A closure is a function nested an outer\
    \ function that retains access to variables declared in the outer function.\n\
    - The type keyword followed by a name and function signature can be used to create\
    \ a custom function type.\n- Passing functions to a package allows for flexible\
    \ behavior.\n\n- Exporting: only functions and variables whose name begins with\
    \ a capital letter will be accessible from the importing file.\n- Importing: To\
    \ use a function in an imported file, the function name must be prefixed by the\
    \ package name.\n"
