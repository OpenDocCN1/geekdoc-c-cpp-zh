    by which to modify date/time. This value can be an int64 value representing a
    number of nanoseconds by which to modify the date/time. More conveniently, you
    can use constants time.Hour, time.Minute, time.Second, or time.Millisecond to
    modify individual time fields of a Time data type. For example, time.Add()


    You can also create your own Time data types from a string using the Parse()'
