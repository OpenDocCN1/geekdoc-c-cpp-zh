    # Split Strings


    ![](img/fa565c410b0509c58bcab29ed0b49de9_209_0.png)


    The Go standard library strings package provides several functions that allow
    a specified string to be separated into substrings. These functions treat the
    string like an array in which each element contains a character or a space.


    Frequently, you may want to separate a space-separated sentence into an array
    of substrings that are each individual words. The strings package conveniently
    provides a Fields() function that will perform very task. This function requires
    the string sentence as its sole argument, and will return an array of substrings
    containing each individual word from that sentence.


    The strings package has a Split() function that requires two arguments to specify
    a string and a separator. This function will return an array of substrings that
    exist between occurrences of the specified separator. For example, when the string
    is a space-separated sentence and the separator is a space character, the Split()
    function will return an array of words within that sentence.


    The strings package also has a SplitN() function that works like the Split() function,
    but accepts a third argument to specify how many substrings to return. Subsequent
    occurrences of the specified separator will simply be returned in the final substring
    if the specified number of substrings exceeds the number of separators. For example,
    when the string is a space-separated sentence, the separator is a space character,
    and only two substrings are specified, the SplitN() function will return a substring
    containing the first word in the sentence and a substring containing the entire
    remainder of that sentence including spaces.


    It is important to recognize that the Fields(), the Split(), and the SplitN()
    functions discard the specified separator and only include the characters around
    the separator in the returned substrings. There are, however, two'
