    # Summary


    +   * A string is a collection of characters, like elements in an array.

    * The built-in len() function returns the number of characters in a string specified
    as its argument.

    * The strings package contains functions for string manipulation, such as the
    Join() concatenation function.

    * The Fields() and Split() functions return an array of substrings from a specified
    argument.

    * The Contains() and Index() functions can be used to find a specified substring
    in a string argument.

    * The Count() function reports how many instances of a substring occur in a specified
    argument.

    * The HasPrefix() and HasSuffix() functions can be used to recognize the beginning
    and end of a string argument.

    * The Replace() function can substitute a substring.

    * Character case can be changed using the ToUpper(), ToLower(), and ToTitle()
    functions.

    * The Trim() function can remove leading and trailing spaces.

    * The strconv package contains Atoi() and Itoa() functions that convert between
    string and int data types.

    * The math package contains mathematical functions, such as math.Pow(), and mathematical
    constants, such as math.Pi.

    * Decimal values can be rounded to near integers using math.Floor(), math.Ceil(),
    math.Round(), and math.Trunc().

    * The math/rand package provides functions to generate pseudo-random numbers.

    * The rand.Perm() function returns a randomized sequence of integers from zero
    up to the number specified as its argument.'
