    # Unite Strings


    ![](img/fa565c410b0509c58bcab29ed0b49de9_206_0.png)


    In Go programming, a `string` is zero or more characters enclosed within double
    quote marks. So, these are all valid `string` values:


    ```

    s1 := "My First String"

    s2 := ""

    s3 := "2"

    s4 = "nil"

    ```


    The empty quotes of `s2` initialize the variable as an empty `string` value. The
    numeric value assigned to `s3` is a `string` representation of the number. The
    Go `nil` zero value, which normally represents the absence of any value, is simply
    a `string` literal when it is enclosed within quotes.


    Essentially, a `string` is a collection of characters; each character containing
    its own data – just like elements in a defined array. It is, therefore, logical
    to regard `string` as an array of characters and apply array characteristics when
    dealing with `string` values. The built-in `len()` function will return the number
    of characters in a `string`, much like it returns the number of elements in an
    array.


    The `+` operator, which can be used to add numeric values, doubles as a concatenation
    operator for joining `string` values together to create a single united string.


    The standard library `strings` package contains useful functions for string manipulation.
    Its `Join()` function joins (concatenates) all elements of a string array to create
    a single united string. This function requires two arguments to specify the name
    of a string array and a separator value to be placed between'
