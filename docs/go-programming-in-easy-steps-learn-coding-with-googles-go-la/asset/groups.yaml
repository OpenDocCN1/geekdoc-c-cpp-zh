    # Assess Logic


    ![](img/fa565c410b0509c58bcab29ed0b49de9_66_0.png)


    The logical operators most commonly used in Go programming are listed in the table
    below:


    | Operator | Operation |

    |---|---|

    | && | Logical-AND |

    | || | Logical-OR |

    | ! | Logical-NOT |


    The logical operators are used with operands that have boolean values of true
    or false, that convert to true or false.


    The && logical-AND operator will evaluate two operands and return true only if
    both operands themselves are true. Otherwise, the && logical-AND operator will
    return false. This is used in conditional branching where the direction of a program
    is determined by testing two conditions – if both conditions are satisfied, the
    program will go in a certain direction, otherwise it will take a different direction.


    Unlike the && logical-AND operator, which needs both operands to be true, the
    || logical-OR operator will evaluate its two operands and return true if either
    one of the operands returns true. If, however, neither returns true, then the
    || logical-OR operator will return false. This is useful in Go programming to
    perform a certain action if one of two test conditions has been met.


    The logical-NOT operator is a unary operator that is used before a single operand.
    It returns the inverse value of the given operand, so if variable a had a value
    of true then !a would have a value of false. The logical-NOT operator is useful
    in Go programs to toggle the value of a variable in successive iterations like
    a = !a. This ensures that each pass the value is changed, like flickering a light
    on and off.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_67_0.png)


    The term "boolean" refers to a system developed by the English mathematician George
    Boole (1815-1864).


    - Create a directory named "logic" inside your "src" folder


    src\logic\main.go


