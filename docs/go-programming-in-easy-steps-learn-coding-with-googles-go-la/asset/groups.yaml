    # Summary


    +   * The standard library fmt package provides Scan(), ScanIn(), and Scanf()
    functions to read from standard input.

    * The Scan(), ScanIn(), and Scanf() functions each return two values of the number
    of items scanned and any read error.

    * If no error is encountered when reading from standard input, the returned error
    value will be nil.

    * The standard library bufio package provides a Scanner type, which is a memory
    buffer for data streams.

    * A Scanner has a Scan() method to read input, a Text() method to return text,
    and an Err() method to return errors.

    * The standard library strings package provides a Fields() function that can split
    a string into individual words.

    * The standard library os package provides an Args slice, which stores command-line
    argument values in elements.

    * The standard library flag package provides String(), Int(), and Bool() functions
    that specify a flag name, default value, and a help message.

    * The flag package''s Parse() function applies the user''s values to a flag.

    * The standard library io package contains an iutil package that provides a ReadFile()
    function to read an entire file.

    * The standard library os package provides Open(), Read(), Seek(), and Close()
    methods to process a text file''s content.

    * The Close() method can be called with the defer keyword to close a file later,
    after all file operations complete.

    * The standard library iio/ioutil package provides a TempFile() function to create
    temporary files.

    * The TempFile() function returns an os.File type that has Name(), Write(), WriteString(),
    and Close() methods to add content to a temporary file.'
