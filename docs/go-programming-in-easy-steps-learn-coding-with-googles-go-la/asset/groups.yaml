    \n![](img/fa565c410b0509c58bcab29ed0b49de9_140_1.png)\n\nWhen you call a method,\
    \ Go automatically handles the conversion between values and pointers, so the\
    \ receiver here could be (c *car) if you wanted the method to be able to modify\
    \ the original struct fields.\n\n# Embed Structs\n\nAs a struct field is declared\
    \ simply with a name and type, and a struct is a type, Go programming even allows\
    \ you to embed one struct within another by declaring a field to be of a struct\
    \ type.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_141_0.png)\n\n```go\ntype\
    \ Name struct{\n    fieldName embeddedStructName\n}\n```\n\nThis is useful to\
    \ build structures that efficiently use structs whose purpose can be varied. For\
    \ example, take a struct that simply stores X and Y coordinates:\n\n```go\ntype\
    \ coords struct {\n    x, y int\n}\n```\n\nThis might be used to store a location\
    \ on a chart, the corner point of a rectangle, or perhaps the center point in\
    \ a circle when embedded in another struct:\n\n```go\ntype circle struct {\n \
    \   radius int\n    center coords\n}\n```\n\nNow, when an instance of the circle\
    \ is created, the fields of the embedded struct can be addressed by chaining together\
