  - "[PAGE 125]\n\n# Handle Errors\n\nIt is important to anticipate errors in your\
    \ Go programs and enable your code to handle them efficiently. Other programming\
    \ languages, such as Java and Ruby, throw “exceptions” when an error is encountered,\
    \ which the program can try to catch at runtime, but Go provides a simpler approach.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_125_0.png)\n\nGo programming allows\
    \ you to handle errors that arise in functions returning separate values. This\
    \ makes it easy to identify which function is returning the error, and lets you\
    \ handle the error using the familiar Go language constructs.\n\nTo handle a possible\
    \ error, the function signature must include a Go built-in error return type.\
    \ Traditionally, this is the final return value in the list of return values.\n\
    \n```\ntunc funcName ( paramName type ) ( returnType, error )\n```\n\nIn place\
    \ of the expected return value in the function body, the function can return a\
    \ trivial value, such as -1, together with the returned error value.\n\nIf an\
    \ error does not arise, the function can return the expected return value, together\
    \ with a nil zero value. In Go programming, the nil zero value is used to represent\
    \ a zero value for many types. Here, it simply indicates that there was no error.\
    \ The syntax of a function that handles errors might, therefore like this:\n\n\
    ```\nfunc funcName ( paramName type ) ( returnType, error ) {\n\tif condition\
    \ != true {\n\t\treturn -1 , errorValue\n```"
