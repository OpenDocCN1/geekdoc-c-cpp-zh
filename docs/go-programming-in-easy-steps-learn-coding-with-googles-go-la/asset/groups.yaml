    \ This is simply the technique of embedding one struct inside another to instantly\
    \ provide various elements to the second struct. For example, a “dog” struct might\
    \ embed a “animal” struct whose fields and attached methods become instantly available\
    \ to the “dog” struct.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_148_0.png)\n\
    \nStrictly speaking, the fields and attached methods are not actually inherited\
