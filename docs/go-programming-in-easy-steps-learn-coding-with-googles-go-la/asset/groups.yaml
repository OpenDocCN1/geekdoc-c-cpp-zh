    // Statements to be inserted here.

    }

    ```


    - In the main function, insert statements to determine whether both contain true

    ```go

    result := (yes && no)

    fmt.Println("AND Logic: %v\n", result)

    ```


    - Next, insert statements to determine whether either of the variables contains
    a true value

    ```go

    result = (yes || no)

    fmt.Println("OR Logic: %v\t", result)

    ```


    - Now, insert statements to display the current value of a variable and its inverse
    value

    ```go

    result = !yes

    fmt.Println("NOT Logic: yes = %v", result)

    ```


    Save the program in the "logic" directory, then run the program to see the results
    of logical assessments


    ![](img/fa565c410b0509c58bcab29ed0b49de9_68_0.png)


    ![](img/fa565c410b0509c58bcab29ed0b49de9_68_1.png)


    The value returned by the !-NOT operator is the inverse of the stored value –
    the stored value remains unchanged.


