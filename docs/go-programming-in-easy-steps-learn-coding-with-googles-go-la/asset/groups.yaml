    \ in the struct, but using field names ensures that values get assigned to the\
    \ correct field.\n\n# Attach Methods\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_138_0.png)\n\
    \nIn Go programming, functions can be attached to structs by adding a “receiver”\
    \ to the function signature, which specifies a parameter name and the struct name\
    \ as its type:\n\n```go\nfunc (paramName structName) funcName()\n```\n\nA function\
    \ that is attached to a struct is referred to as a “method” of that struct. The\
    \ method can be specified as a value receiver, which operates on a copy of the\
    \ struct, or as a pointer receiver that operates on the original struct fields:\n\
    \n```go\nfunc (paramName *structName) funcName()\n```\n\nThis ability enables\
    \ structs to represent real-world objects that have attributes and behaviors:\n\
    \n- Attributes describe the features that an object has.\n- Behaviors describe\
    \ actions that an object can perform.\n\nFor example, a car might be described\
    \ with attributes of “blue” and “coupe”, along with an “accelerate” behavior.\n\
    \nThese features could be represented in Go programming with a car struct containing\
    \ field properties of color and body, along with an attached accelerate() method.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_139_0.png)\n\nObjects are created in\
    \ Go programming by defining a struct as a template from which different copies,\
    \ or “instances”, can be made.\n\nEach instance of the struct can be customized\
    \ by assigning attribute values and behaviors to describe that object.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_139_1.png)\n\
    \nUnlike some other programming languages, Go does not have classes, but can represent\
    \ objects using structs instead.\n\n- 1 Start a program by creating a struct type\n\
    ```go\ntype car struct {\n  color string\n  body string\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_139_2.png)\n\
    \nsrc\\method\\main.go\n\n- 2 Next, attach a method to the struct type\n```go\n\
    func (c car ) accelerate() string {\n  return \"accelerating--\"\n}\n```\n\n-\
    \ 3 Now, begin the main function by creating two instances of the struct type\n\
    ```go\nporsche := car{ color: \"blue\", body: \"coupe\" }\nbentley := car{ color:\
    \ \"green\", body: \"saloon\" }\n\n// Add statements to display all values of\
