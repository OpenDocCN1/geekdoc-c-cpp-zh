    、Asia/Seoul\" 或 \"Europe/London\"。`time.LoadLocation()` 函数返回两个值：一个 `Location`\
    \ 类型和一个 `error`。如果函数成功返回 `Location` 类型，则错误值将为 `nil`，否则将是一个错误信息。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_197_0.png)\n\
