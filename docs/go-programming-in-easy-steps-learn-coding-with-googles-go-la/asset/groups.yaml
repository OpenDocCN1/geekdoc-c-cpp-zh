    # 算术运算


    ![](img/fa565c410b0509c58bcab29ed0b49de9_56_0.png)


    Go 程序中常用的算术运算符下表所示，并包含了它们执行的操作：


    | 运算符 | 操作 |

    | --- | --- |

    | + | 加法 |

    | - | 减法 |

    | * | 乘法 |

    | / | 除法 |

    | % | 取余 |

    | ++ | 自增 |

    | -- | 自减 |


    赋值、加法、减法、乘法和除法运算符的作用正如你预期的那样，但在使用多个运算符时，请注意对表达式进行分组——最内层 `()` 括号中的操作首先执行：


    ```

    a=b*c-d%e/f;   // 这不清晰。

    a=(b*c)-(d%e)/f;      // 这更清晰。

    ```


    `%` 取余运算符将第一个数字除以第二个数字并返回操作的余数。这有助于判断一个数是奇数还是偶数。


    `++` 自增运算符和 `--` 自减运算符会将指定的数字加减 1 并返回结果。它们最常用于：


    在循环中计数迭代次数——在每次迭代中使用 `++` 自增运算符递增，或在每次迭代中使用 `--` 自减运算符递减。


    `++` 自增或或 `--` 自减运算符必须紧跟在变量 `n` 之后以更改其值。例如：


    ```

    n := 4

    n++ // 现在 n 是 5。

    ```


    ![](img/fa565c410b0509c58bcab29ed0b49de9_57_0.png)


    `+` 运算符具有双重用途——它也被用于拼接字符串。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_57_1.png)


