    | --- | --- | --- |

    | %s | 字符字符串 | "Go Fun!" |

    | %d | 整数 | 100 |

    | %f | 浮点数 | 0.123456 |

    | %c | 单字符 | ''A'' |

    | %t | 布尔值 | true |

    | %p | 内存地址 | 0x02FF34 |

    | %v | 默认格式的值 | (any) |

    | %T | 变量的数据类型 | int |


    格式占位符可以通过在 % 之后指定所需的数字来确保输出占据最小空间数——例如，使用 `%7d` 确保整数始终填充至少七个空格。如果倾向于用零填充空白区域，只需添加一个零使占位符变为
