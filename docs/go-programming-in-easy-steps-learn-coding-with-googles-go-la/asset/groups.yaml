    \ int**，因为它将返回一个函数，该函数转而返回一个整数值。\n\n## 传递函数\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_122_0.png)\n\
    \n## 程序定义的函数类型\n\n此处示例的输出通过签名描述函数，例如 `counter type : func() int`。你可以使用 `type`\
    \ 关键字声明自定义函数类型，后跟你喜欢的类型名称和函数签名。例如，一个名为“adder”的自定义函数，它必须接收两个整数参数并返回一个整数参数，如下：\n\
    \n```go\ntype adder func(int, int) int\n```\n\n然后创建作为自定义函数类型“实例”的变量，并可以分配函数定义——其签名必须与自定义函数类型声明中的匹配。该函数（实例）可以按通常方式调用。\n\
    \n## 高阶函数\n\n接收值或引用参数，并将这些类型返回给调用者的普通函数被称为“一阶”函数。但函数也可以作为参数传递给其他函数，函数也可以向调用者返回函数。任何接受函数作为参数的函数，或任何返回一个或多个函数的函数都被视为“高阶”函数。\n\
    \n将函数传递给其他函数允许在不重复代码的情况下修改操作。\n\n- 通过声明一个自定义函数类型来开始主函数，其签名要求两个整数参数和一个整数返回类型\n\
    ```go\nfunc main() {\n    type adder func(int, int) int\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_123_0.png)\n\
    \nsrc/libmain.go\n\n- 接下来，插入语句定义一个自定义函数类型的函数（实例）——具有匹配的签名\n```go\nvar adder =\
    \ func(a int, b int) int {\n    return a + b\n}\n```\n\n- 现在，插入一个调用函数（实例）的语句\n\
    ```go\nfmt.Println(\"Added:\", add(6, 2))\n// 在此处插入语句 – 步骤 6-8。\n```\n\n- 在主函数之后，开始一个高阶函数，将接收并返回与自定义函数类型签名相同的函数\n\
    ```go\ndub := func(func(int, int) int) func(int, int) int {\n    fmt.Println(\"\
    Doubled:\", twice(6, 2) * 2)\n    // 在此处插入语句 – 步骤 5。\n}\n```\n\n- 现在，插入语句向调用者定义并返回一个相同签名的函数\n\
    ```go\ndiv := func(a int, b int) int {\n    return a / b\n}\n```\n\n- 回到主函数，插入语句将函数传递给调用者\n\
    ```go\nresult := div(6, 2)\n```\n\n- 最后，插入语句显示闭包函数的类型和三个返回值\n```go\nfmt.Printf(\"\
    counter type: %T \\n\", counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"\
    Count:\", counter())\nfmt.Println(\"Count:\", counter())\n```\n\n注意，外部函数必须将其返回类型声明为\
    \ **func() int**，因为它将返回一个函数，该函数转而返回一个整数值。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_124_0.png)\n\
    \n```go\nfmt.Printf(\"area Type: %T \\n\", area)\nfmt.Println(\"Area 1:\", area(10,\
    \ 4))\nfmt.Println(\"Area 2:\", area(12, 5))\n\nfmt.Printf(\"counter type: %T\
    \ \\n\", counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"Count:\"\
    , counter())\nfmt.Println(\"Count:\", counter())\n```\n\n## 处理错误\n\n在 Go 程序中预判错误是非常重要的。Java\
    \ 和 Ruby 等语言在遇到错误时会抛出“异常”，但 Go 提供了一种更简单的方法。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_125_0.png)\n\
    \nGo 编程允许你处理返回多个值的函数产生的错误。这有助于识别是哪个函数返回了错误。处理错误的语法可能如下：\n\n```go\nfunc funcName(paramName\
    \ type) (returnType, error) {\n    if condition != true {\n        return -1,\
    \ errorValue\n    }\n    return returnValue, nil\n}\n```\n\n如果没有发生错误，函数可以返回期望的值，以及一个\
    \ `nil` 值。在 Go 编程中，`nil` 值用于表示许多类型的零值。在这里，它仅表示没有错误。\n\n在示例中提供了 `fmt.Println()`\
    \ 和 `fmt.Printf()` 函数的 \"fmt\" 包还提供了返回错误类型的 `fmt.Errorf()` 函数。它接受与 `fmt.Printf()`\
    \ 函数相同的格式说明符，并可以用于返回识别错误位置和性质的消息。\n\nGo 标准库还有一个 `errors` 包，用于操作自定义错误。\n\n- 1.\
    \ 创建一个需要整数参数并返回整数值和错误的函数\n```go\nfunc isPosInt(num int) (int, error) {\n   //\
    \ 在此处插入语句\n}\n```\n\n- 2. 接下来，插入一个条件测试，根据其值返回错误或参数值\n```go\nif num < 1 {\n   err\
    \ := fmt.Errorf(\"%v not a positive integer\", num)\n   return -1, err\n}\nreturn\
    \ num, nil\n```\n\n- 3. 现在，添加一个主函数，包含一个递减循环来打印\n\n"
