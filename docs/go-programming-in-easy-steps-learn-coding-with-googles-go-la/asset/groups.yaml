    1.77246 |

    | math.SqrtPhi | The square root of constant Φ,with an approximate value of 1.27202
    |

    | math.Ln2 | The natural logarithm of 2, with an approximate value of 0.69315
    |

    | math.Log2E | The base-2 logarithm of constant e, with an approximate value of
    1.44269 |

    | math.Ln10 | The natural logarithm of 10, with an approximate value of 2.30259
    |

    | math.Log10E | The base-10 logarithm of constant e, with an approximate value
    of 0.43429 |


