    Multiple consecutive parameters of the same type can be declared as a list and
    need only specify the type after the final parameter of the same type, like this:


    ```

    func functionName ( paramName, paramName type ) {


    statements-to-be-executed

    }

    ```


    Each function must specify content for each parameter, of the correct type and
    in the same order as they appear in the function declaration. The contents being
    passed to the function are known as “arguments”. These are specified as a comma-separated
    list within the () parentheses following the function name in the call:


    ```

    functionName ( argument, argument, argument )

    ```


