    # Delay Time


    The Go standard library time package provides a Sleep() function that allows you
    to delay progress of a program by a specified duration period. The duration is
    supplied as an argument to the Sleep() function, and can be expressed as a multiplication
    of a time package constant. For example, 5 * time.Second expresses a duration
    of five seconds.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_200_0.png)


    The Go standard library time package also provides three methods that compare
    an instance of the Time data type with another time specified as their argument.
    These methods will each return a boolean true or false value according to the
    result of the time comparison:


    | Method | Returns |

    | Before( time ) | A boolean true value if the instance time is earlier than its
    argument |

    | After( time ) | A boolean true value if the instance time is later than its
    argument |

    | Equal( time ) | A boolean true value if the instance time and argument represent
    the same instant — even in different time zones |


    If you would like to see the difference between two instances of the Time data
    type, you can use a Sub() method of a time instance to specify another time as
    its argument. This method will return the elapsed duration between the two instances
    as an int64 data type value of nanosecond precision.


    It is often preferable to present duration periods with less than nanosecond precision,
    so the Go standard library time package includes a Round() method to specify more
    concise precision. This method requires one argument to determine your preferred
    rounding behavior. Typically, the argument is'
  - "[PAGE 201]\n\nsupplied as one of the time package constants. For example, calling\
    \ the method with Round(time.Millisecond) will round a nanosecond precision duration\
    \ to the nearest millisecond, Round(time.Second) will round a nanosecond precision\
    \ duration to the nearest second, and so on.\n\n+   Begin by importing the Go\
    \ standard library time package into a program\nimport (\n  \"fmt\"\n  \"time\"\
    \n)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_201_0.png)\n\nsrc\\delay\\main.go\n\
    \n+   Next, create and display components of a Time data type\nstart := time.Now()\n\
    fmt.Println(\"nStarted At:\", start.Format(\"03:04:05\"))\n\n+   Now, delay the\
    \ program's progress for five seconds\ntime.Sleep(5 * time.Second)\n\n+   Then,\
    \ create and display a second Time data type\nfinish := time.Now()\nfmt.Println(\"\
    nFinished At:\", finish.Format(\"03:04:05\"))\n\n+   Compare the start and finish\
    \ times\nfmt.Println(\"nStartFirst?:\", start.Before(finish ))\nfmt.Println(\"\
    Finish First?:\", finish.Before(start ))\n\n+   Finally, display the length of\
    \ the delay\ndiff := finish.Sub(start)\nfmt.Println(\"nTime Elapsed:\", diff.Round(time.Second))\n\
    \n+   Save the program file in a \"delay\" directory, then run the program to\
    \ see the time delay"
