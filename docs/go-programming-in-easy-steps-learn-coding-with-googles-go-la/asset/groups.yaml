  - '[PAGE 118]


    # Enclose Anonymously


    The Go programming language has support for “first class functions”. This allows
    functions to be assigned to variables, passed as arguments to other functions,
    and returned from functions.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_118_0.png)


    # Anonymous Functions


    An anonymous function is simply a function definition that does not contain a
    name. This is useful to create a function inline without having to name it. Anonymous
    functions are also known as “function literals”. Like other functions, these can
    contain a parameter list, return type list, and can return multiple values. You
    can create a self-invoking anonymous function expression by appending the () call
    operator at the end of the function definition, like this:


    ```

    func() { fmt.Println("Function Literal") } () (

    ```


    Additionally, an anonymous function can be assigned to a variable, then called
    by appending the () call operator after the variable name, like this:


    ```

    fn := func() { fmt.Println("Function Literal") }

    ()

    ```


    ![](img/fa565c410b0509c58bcab29ed0b49de9_118_1.png)


    Self-invoking function expressions execute their statements one time only.'
- md: "\n## Closures\n\nPerhaps the most useful purpose of anonymous functions is\
    \ for the creation of “closures”. A closure is a function nested inside an outer\
    \ function that retains access to variables declared in the outer function. The\
    \ outer function can return an anonymous function that retains access to the variables\
    \ but, crucially, the variables are not accessible from anywhere else in the program\
    \ code. This is a form of encapsulation that protects the data stored in those\
    \ variables as the returned anonymous function “closes” over them.\n\nThe closure\
    \ can be made self-invoking for assignment to a variable by appending the () call\
    \ operator after the end of the outer function definition. The anonymous inner\
    \ function can then be called by appending the () call operator after the variable\
    \ name – and can access the persistent value in the outer function.\n\nIt can\
    \ be difficult to grasp the concept of closures, as it would seem that the variable\
    \ in the outer function should be destroyed when the self-invoking function has\
    \ completed execution.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_119_0.png)\n\
    \nDon't worry if you can't immediately understand how closures work. They can\
    \ seem mystical at first, but will become clearer with experience. You can continue\
    \ on and come back to this technique later.\n\n- Begin a main function by assigning\
    \ an anonymous function to a variable\n\n```go\nfunc main() {\n    area := func(length,\
    \ width int) int {\n        return length * width\n    }\n```\n\nNext, insert\
    \ statements to display the anonymous function's type and turned returned values\n\
    ```go\nfmt.Printf(\"area Type: %T \\n\", area)\nfmt.Println(\"Area 1:\", area(10,\
    \ 4))\nfmt.Println(\"Area 2:\", area(12, 5))\n```\n\nNow, insert statements to\
    \ assign an anonymous self-invoking closure function to a variable\n```go\ncounter\
    \ := func() func() int {\n    num := 0\n    return func() int {\n        num++\n\
    \        return num\n    }\n}\n```\n\nFinally, insert statements to display the\
    \ closure function's type and three returned values\n```go\nfmt.Printf(\"counter\
    \ type: %T \\n\", counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"\
    Count:\", counter())\nfmt.Println(\"Count:\", counter())\n```\n\nSave the program\
    \ file in an \"anon\" directory, then run the program to see the function types\
    \ and returned values\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_120_0.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_121_0.png)\n\nNotice that the outer\
    \ function must state its return type as **func() int** because it will return\
    \ a function that will in turn return an integer value.\n\n## Pass Functions\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_122_0.png)\n\n## Programmer-defined\
    \ Function Types\n\nThe output from the previous example here describes the function\
    \ by its signature, for example, counter type : func() int. You can declare a\
    \ custom function type using the type keyword, followed by a type name of your\
    \ choice, and a function signature. For example, a custom function named “adder”\
    \ that must receive two integer arguments and return one integer argument, like\
    \ this:\n\n```go\ntype adder func(int, int) int\n```\n\nVariables then be created\
    \ as “instances” of the custom function type, and can be assigned a function definition\
    \ – whose signature must match in the custom function type declaration. The function\
    \ (instance) can be called in the usual way.\n\n## Higher-order Functions\n\n\
    Regular functions that receive value or reference arguments, and return these\
    \ types to the caller, are called “first-order” functions. But functions can also\
    \ be passed as arguments to other functions, and functions can return functions\
    \ to the caller. Any function that accepts functions as arguments, or any function\
    \ that returns one or more functions, is regarded as a “higher-order” function.\n\
    \nPassing functions to other functions allows actions to be modified without repeating\
    \ lines of code.\n\n- Begin a main function by declaring a custom function type\
    \ that has a signature requiring two integer arguments and an integer return type\n\
    ```go\nfunc main() {\n    type adder func(int, int) int\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_123_0.png)\n\
    \nsrc/libmain.go\n\n- Next, insert a statement to define a function (instance)\
    \ of the custom function type – with a matching signature\n```go\nvar adder =\
    \ func(a int, b int) int {\n    return a + b\n}\n```\n\n- Now, insert a statement\
    \ that calls the function (instance)\n```go\nfmt.Println(\"Added:\", add(6, 2))\n\
    // Statements to be inserted here – Steps 6-8.\n```\n\n- After the main function,\
    \ begin a higher-order function that will receive and return a function of the\
    \ same signature as the custom function type\n```go\ndub := func(func(int, int)\
    \ int) func(int, int) int {\n    fmt.Println(\"Doubled:\", twice(6, 2) * 2)\n\
    \    // Statements to be inserted here – Step 5.\n}\n```\n\n- Now, insert statements\
    \ to define and return a function, of the same signature, to the caller\n```go\n\
    div := func(a int, b int) int {\n    return a / b\n}\n```\n\n- Back in the main\
    \ function, insert a statement to pass the function to the caller\n```go\nresult\
    \ := div(6, 2)\n```\n\n- Finally, insert statements to display the closure function's\
    \ type and three returned values\n```go\nfmt.Printf(\"counter type: %T \\n\",\
    \ counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"Count:\", counter())\n\
    fmt.Println(\"Count:\", counter())\n```\n\nNotice that the outer function must\
    \ state its return type as **func() int** because it will return a function that\
    \ will in turn return an integer value.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_124_0.png)\n\
    \n```go\nfmt.Printf(\"area Type: %T \\n\", area)\nfmt.Println(\"Area 1:\", area(10,\
    \ 4))\nfmt.Println(\"Area 2:\", area(12, 5))\n\nfmt.Printf(\"counter type: %T\
    \ \\n\", counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"Count:\"\
    , counter())\nfmt.Println(\"Count:\", counter())\n```\n\n## Handle Errors\n\n\
    It is important to anticipate errors in your Go programs. Other languages, such\
    \ as Java and Ruby, throw “exceptions” when an error is encountered, but Go provides\
    \ a simpler approach.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_125_0.png)\n\
    \nGo programming allows you to handle errors that arise in functions returning\
    \ separate values. This makes it easy to identify which function is returning\
    \ the error. The syntax of a function that handles errors might, therefore, like\
    \ this:\n\n```go\nfunc funcName(paramName type) (returnType, error) {\n    if\
    \ condition != true {\n        return -1, errorValue\n    }\n    return returnValue,\
    \ nil\n}\n```\n\nIf an error does not arise, the function can return the expected\
    \ value, together with a nil value. In Go programming, the nil value is used to\
    \ represent a zero value for many types. Here, it simply indicates that there\
    \ was no error.\n\nThe \"fmt\" package that provides the fmt.Println() and fmt.Printf()\
    \ functions, used in previous examples, also provides a fmt.Errorf() function\
    \ that returns an error type. This accepts the same format specifiers as the fmt.Printf()\
    \ function and can be used to return a message to identify the location and nature\
    \ of an error.\n\nThe Go standard library also has an errors package that can\
    \ be used to manipulate custom errors.\n\n- 1. Create a function that requires\
    \ an integer argument and will return an integer value and error\n```go\nfunc\
    \ isPosInt(num int) (int, error) {\n   // Statements to be inserted here\n}\n\
    ```\n\n- 2. Next, insert a conditional test to return an error, or the argument\
    \ value depending on its value\n```go\nif num < 1 {\n   err := fmt.Errorf(\"%v\
    \ not a positive integer\", num)\n   return -1, err\n}\nreturn num, nil\n```\n\
    \n- 3. Now, add a main function that contains a decrementing loop to print\n"
  mdcn: "\n\n## 闭包\n\n匿名函数最有用的用途可能是创建“闭包”。闭包是嵌套在外部函数内部的函数，它保留了对外部函数中声明变量的访问。外部函数可以返回一个保留变量访问的匿名函数，但关键是，这些变量在程序代码的任何地方都是无法访问的。这是封装的形式，当返回的匿名函数“捕获”这些变量时，保护了存储在这些变量中的数据。\n\
    \n通过在外部函数定义末尾添加 `()` 调用操作符，可以使闭包变为自执行模式并赋值给变量。然后，可以在变量名后添加 `()` 调用操作符来调用匿名内部函数——并且它可以访问外部函数中的持久值。\n\
    \n理解闭包的概念可能会困难，因为看起来当自执行函数执行完成后，外部函数中的变量应该被销毁。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_119_0.png)\n\
    \n如果你不能立即理解闭包的工作，不要担心。它们起初看起来很神秘，但随着经验的增加会变得清晰。你可以继续下去，稍后来看这项技术。\n\n- 通过将匿名函数赋值给变量来开始主函数\n\
    \n```go\nfunc main() {\n    area := func(length, width int) int {\n        return\
    \ length * width\n    }\n```\n\n接下来，插入语句显示匿名函数的类型和转换的返回值\n```go\nfmt.Printf(\"\
    area Type: %T \\n\", area)\nfmt.Println(\"Area 1:\", area(10, 4))\nfmt.Println(\"\
    Area 2:\", area(12, 5))\n```\n\n现在，插入语句将匿名自执行闭包函数赋值给变量\n```go\ncounter := func()\
    \ func() int {\n    num := 0\n    return func() int {\n        num++\n       \
    \ return num\n    }\n}\n```\n\n最后，插入语句显示闭包函数的类型和三个返回值\n```go\nfmt.Printf(\"counter\
    \ type: %T \\n\", counter)\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"\
    Count:\", counter())\nfmt.Println(\"Count:\", counter())\n```\n\n将程序文件保存在 \"anon\"\
