    \ GOPATH 子目录中创建。为了识别步骤中描述的示例程序的源码，有一个图标和文件路径：![](img/fa565c410b0509c58bcab29ed0b49de9_7.png)\
    \ src/main.go\n\n在设置 Go 时，你将在计算机上选择一个“GOPATH”位置来创建程序。每个程序都将在名为“src”的唯一 GOPATH\
    \ 子目录中创建。为了识别步骤中描述的示例程序的源码，有一个图标和文件路径：访问 www.ineasteps.com 获取更多信息\n\n# 1 入门\n\n\
    欢迎来到 Go 语言的世界世界。\n\n- 认识 Go 语言\n- 安装 Go 工具\n- 创建 Go 工作空间\n- 编写 Go 程序\n- 运行 Go\
    \ 程序\n- 格式化代码与注释代码\n- 探索 VS 编辑器\n- 总结\n\n# Go 语言基础\n\nGo 是由 Robert Griesemer、Rob\
    \ Pike 和 Ken Thompson 在 Google 开发的开源语言，他们因开发 Unix 操作系统而闻名。Google 在 2012 年 3 月发布了\
    \ Go 语言 1.0 版本。Go 程序以纯文本编写，然后通过 Go 编译器编译为二进制文件![](img/fa565c410b0509c58bcab29ed0b49de9_1.png)\n\
    \nGo 编程语言的目标是表达、快速、高效、可靠且易于编写。某些编程语言如 C 或 C++ 快速且可靠但不简单。相反，其他编程语言如 Java 或 Python\
    \ 易于编写但不高效。\n\nGo 在许多方面与 C 语言相似，有时被称为“21 世纪的 C”。但 Go 远不止此，它吸收了许多其他语言的好点，同时避免了导致复杂性和不可靠性的特性。\n\
    \n最重要的是，Go 引入了通过“协程”和“通道”利用多内核处理器的能力。这为计算机同时处理多个事务提供了可能。\n\n尽管 Go 语言没有 C++ 或 Java\
    \ 等面向对象编程 (OOP) 语言中的类结构，但它的特性提供了某种程度的封装、继承和多态——这些都是 OOP 的三大基石。![](img/fa565c410b0509c58bcab29ed0b49de9_0.png)\
    \ Go gopher —— Go 语言的标志性吉祥物。![](img/fa565c410b0509c58bcab29ed0b49de9_2.png)\n\n\
    你可以在 Easy Steps 系列中发现更多编程语言书籍——包括 C、C++、Java 和 Python。访问 www.ineasystems.com 了解更多信息。\n\
