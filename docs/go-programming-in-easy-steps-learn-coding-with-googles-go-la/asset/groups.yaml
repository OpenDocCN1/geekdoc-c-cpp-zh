    \ can be customized by assigning attribute values and behaviors to describe that\
    \ object.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_139_1.png)\n\nUnlike some\
    \ other programming languages, Go does not have classes, but can represent objects\
