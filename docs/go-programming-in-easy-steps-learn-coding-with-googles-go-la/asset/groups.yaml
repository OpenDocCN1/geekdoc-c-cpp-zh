    \ string )`\n`c2 := make(chan string)`\n\n- Now, add two goroutine calls that\
    \ each pass a channel\n`go fastCount(c1)`\n`go slowCount(c2)`\n\n- After the main\
    \ function, add the two called functions that will send channel messages at different\
    \ intervals\n```go\nfunc fastCount(c1 chan string) {\n    for {\n        time.Sleep(1\
    \ * time.Second)\n        c1 <- time.Now().Format(\"04:05\")\n    }\n}\nfunc slowCount(c2\
    \ chan string) {\n    for {\n        time.Sleep(2 * time.Second)\n        c2 <-\
    \ time.Now().Format(\"04:05\")\n    }\n}\n```\n\n- Now, back in the main function,\
    \ add an infinite loop to receive messages from any of the three channels\n\n\
    ```\nListener:\nfor {\n    select\n    case done := <-c0:\n        fmt.Println(\"\
    Timed Out at \", done.Format(\"04:05\"))\n        break Listener\n    case msg1\
    \ := <-c1:\n        fmt.Println(\"1-Second Message at \", msg1)\n    case msg2\
    \ := <-c2:\n        fmt.Println(\"2-Second Message at \", msg2)\n    }\n}\n```\n\
    Save the program file in a \"select\" directory, then run the program to see the\
    \ channel messages\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_272_0.png)\n\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_272_1.png)\n\nAn unlabeled break statement\
    \ would only break out of the select statement – allowing for loop to continue.\
    \ A labeled break statement breaks out of both select and infinite for loop.\n\
    \n# Synchronize Goroutines\n\nThe blocking action of unbuffered channels, where\
    \ the sending action blocks a goroutine until another goroutine receives the same\
    \ channel, causes the sending and receiving goroutines to synchronize. In fact,\
    \ unbuffered channels are sometimes referred to as “synchronous channels”.\n\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_273_0.png)\n\nChannels can, therefore,\
    \ be used to connect goroutines together in a “pipeline”, in which an item sent\
    \ from one goroutine is received by another. Each goroutine in the pipeline will\
    \ wait until the channel has been “drained” before sending the next item.\n\n\
    By default, channels can both send and receive, but when you pass a channel to\
    \ a goroutine you can specify in the function whether the channel may only send\
    \ or receive items. A send-only channel is specified in the parameter by prefixing\
    \ the chan with <- operator, like this:\n\n```go\nfunc funcName(paramName chanchan)\n\
    ```\n\nConversely, a receive-only channel is specified in the parameter by suffixing\
    \ the chan with <- operator, like this:\n\n```go\nfunc funcName(paramName chan<-)\n\
    ```\n\nSpecifying a single direction is recommended to reduce the possibility\
    \ of bugs in your programs.\n\n- 1. Begin a main function by creating two unbuffered\
    \ channels for integer items\n  `nums := make(chan int)`\n  `sqrs := make(chan\
    \ int)`\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_274_0.png)\n\nsrc\\synchronize\\\
    main.go\n\n- Next, add a goroutine call that passes one channel, which will begin\
    \ a pipeline\n  `go count(nums)`\n\n- Now, add a goroutine call that passes two\
    \ channels, which will continue the pipeline\n  `go square(nums, sqrs)`\n\n- After\
    \ the main function, add the first called function, with a receiver-channel to\
    \ which it will send 10 integers one-by-one when the pipeline is clear\n```go\n\
    func count(nums chan<- int) {\n    for i:=1; i<=10; i++ {\n        nums <- i\n\
    \    }\n    close(nums)\n}\n```\n\n- Add the second called function with a send-only\
    \ channel, and a receive-only channel to which it will send 10 individual results\
    \ one-by-one when the pipeline is clear\n```go\nfunc square(nums chan int, sqrs\
    \ chan<- int) {\n    for i :=1; i<=10; i++ {\n        num := <-nums\n        sqrs\
    \ <- num * num\n    }\n    close(sqrs)\n}\n```\n\n- Now, back in the main function,\
    \ add a loop to receive the results at the end of the pipeline\n```go\nfor i :=1;\
    \ i<=10; i++ {\n    num := <-sqrs\n    fmt.Printf(\"%v x %v = %v\\n\", i, i, num)\n\
    }\n```\n\n- Save the program file in a \"synchronize\" directory, then run the\
