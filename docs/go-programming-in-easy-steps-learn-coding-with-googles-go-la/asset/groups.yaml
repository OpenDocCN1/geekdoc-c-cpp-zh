    \n# Encapsulate Features\n\nThe ability to represent objects in Go programs is\
    \ the first principle in Object Oriented Programming (OOP). An object-oriented\
    \ program uses methods to express the properties and operations of the data structure\
    \ to which it is attached, so the program need not access the object directly.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_144_0.png)\n\nA variable, function,\
    \ or method that is not directly accessible to the program is said to be “encapsulated”.\
    \ Encapsulation, inheritance, and polymorphism are the three building-blocks of\
    \ object-oriented programming.\n\nEncapsulation in Go programming relies upon\
    \ data-hiding in packages that are imported into a program. Only variable names,\
    \ function names, and method names that begin with a capital letter will be exported\
    \ to the program. Those that begin with a lowercase letter will be inaccessible\
    \ – i.e. they are encapsulated.\n\n- 1 First, begin a cube.go utility file with\
    \ a package declaration and a struct definition\n```go\npackage cube\n\n// Dims\
    \ exportable.\ntype Dims struct {\n  width, length, height int\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_144_1.png)\n\
    \nsrc\\cube\\cube.go\n\n- 2 Next, add four functions to operate on the struct\
    \ fields\n```go\nfunc (d *Dims) area() int {\n  return d.width * d.length\n}\n\
    \n// SetSize exportable.\nfunc (d *Dims) SetSize(w, h int) {\n  d.width = w\n\
    \  d.length = l\n  d.height = h\n}\n\n// GetVolume exportable.\nfunc (d *Dims)\
    \ GetVolume() int {\n  return d.width * d.height\n}\n\n// GetArea exportable.\n\
    func (d *Dims) GetArea() int {\n  return d.area()\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_145_0.png)\n\
    \nSee that fields of the same data type can be declared as a comma-separated list,\
    \ with variable declarations.\n\nSave the utility file in a “cube” directory,\
    \ then begin a main file that imports the utility file\n```go\npackage main\n\
    import (\n  \"cube\"\n  \"fmt\"\n)\n```\n\n# src\\encap\\main.go\n\n- 3 Next,\
    \ begin the main function by creating an instance of the imported struct type\n\
    ```go\nvar box cube.Dims\n```\n\n- 4 Now, call an imported method to assign values\
    \ to the struct fields\n```go\nbox.SetSize(2, 4, 6)\n```\n\n- 5 Then, the other\
    \ two imported methods to calculate results using the assigned field values\n\
    ```go\nfmt.Println(\"Footprint:\", box.GetArea())\nfmt.Println(\"Volume:\", box.GetVolume())\n\
    ```\n\n- 6 Save the program file in an \"encap\" directory, then run the program\
    \ to see the results of encapsulated values\n\n```\nC:\\Users\\mike_go\\src\\\
    > go run encap\nFootprint: 8\nVolume: 48\nC:\\Users\\mike_go\\src\\>\n```\n\n\
    - 7 Add these statements to the main function, which attempt to reference an unexported\
    \ field and method\n```go\nfmt.Println(\"Width:\", box.width )\nfmt.Println(\"\
    Area:\", box.getArea( )\n```\n\n- 8 Save the program file once more, then run\
