    Put off by the jargon? Don''t worry, we keep things straightforward.


    GO is an efficient multi-purpose programming language that is gaining widespread
    popularity.

    **GO Programming in easy steps**, assuming no prior knowledge, starts with demonstrating
    how to create your GO programming environment on your computer. Then, using color-coded
    examples, this primer shows you how:


    ### It''s easy to follow

    Clear, step-by-step instructions make learning simple.


    +   * Use data abstraction for object-oriented programming.

    * Code goroutines and channels for concurrency in your programs.

    * Store information in data structures.

    * Control program flow using control structures.

    * Create re-usable blocks of code in program functions ... and much more!


    ### It''s fully illustrated

    We don''t just tell you how to do it, we also **show** you how.


    Ideal for newcomers, students, and experienced programmers wanting to quickly
    grasp GO features. Includes free downloadable source code so you can get started
    straightaway!


