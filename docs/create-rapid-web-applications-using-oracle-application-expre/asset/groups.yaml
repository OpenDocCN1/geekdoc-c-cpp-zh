    - 变得清晰，数据和应用程序将成为常规备份程序的一部分

    - 在审计跟踪的支持下，实现数据和应用程序的访问控制


    上述概述表明，APEX 的功能远不止于作为 Excel 或 Access 的替代品。尝试用 APEX 应用程序替换您现有的桌面应用程序，体验这一强有力技术所带来的益处。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_0.png)


    您可以使用“创建应用程序”（Create Application）向导轻松快速地将电子表格迁移到 Oracle Application Express。只需简单的鼠标点击，即可将关键数据从电子表格移动到
    Oracle 数据库。使用向导创建电子表格应用程序可以创建许多功能来自动管理数据。应用程序内置了数据处理方法，允许您对数据进行查询、插入、删除和修改。APEX
    让创建一个与数据交互的完整应用程序变得如此简单，只需几次鼠标点击即可，而且整个过程无需编写单行代码。


    您基于电子表格创建的应用程序允许您查看在“创建应用程序”向导中选择的列的报告和图表。虽然这些报告和图表提供了有用信息，但您可以根据自己的需求对其进行自定义和扩展以显示信息。轻松创建报告和图表是考虑将工作表迁移到
    APEX 的另一个原因。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_1.png)


    Microsoft Access 是许多组织工作流的一部分。与 Excel 类似，Microsoft Access 必须安装在客户端机器才能使用该应用程序。Access
    不支持用于与启用面向服务的架构（SOA）的组件进行交互的 Web 服务。Access数据库的大小限制为 2 GB，而 Application Express
    没有大小限制。Application Express 的架构支持在小型双 CPU 服务器上运行数千个并发用户，而 Access 仅支持255 个用户（推荐数字仅为
    20 个）。Application Express 可以在 Windows、MAC 和 Linux 上运行，而 Access 基于 Windows。在 Application
    Express 中，数据和应用程序在托管服务器上管理，提供统一的数据管理。


    # 使用 Oracle Application Express 创建快速 Web 应用程序


    另一方面，Access 中的信息是碎片化的，因为每个应用程序都包含在一个或多个文件中。并发开发是 Application Express 的另一个优势。多个开发人员可以在工作空间内编写相同或不同的应用程序。相比之下，Access
    支持单一开发环境，并且在特定仅允许一个开发者使用 mdb 文件。


    Oracle 在 Application Express 中提供了“应用程序迁移工作坊”（Application Migration Workshop）功能，帮助以最少的努力将应用程序从个人
    Access 数据库迁移到世界第一且最强大的数据库。结合 Oracle SQL Developer Migration Workbench，它是满足您 Access
    迁移需求的完整解决方案。


    最初，您需要使用 SQL Developer Migration Workbench 迁移架构定义和数据，然后利用新的应用程序迁移工作坊迁移 Access
    表单和报告。最后一步是利用 Oracle APEX 的所有力量和能力完善您的新应用程序。请注意，Access 表单和报告包含无法使用迁移向导生成的业务逻辑。该解决方案通过从现有
    Access 应用程序恢复设计并根据发现的结果生成 APEX 应用程序来完成大部分迁移工作。请访问链接 http://www.oracle.com/technet/developer-tools/apex-application-express-tutorial-090294.html
    并阅读 Access 迁移教程。


    在之前的版本中，配置了带有 mod_plql 插件的 Oracle HTTP Server (Apache) 来访问 Oracle Application
    Express 引擎，如图 1-1。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_0.png)


    对于 Oracle Database 11.1 及更高版本，Oracle HTTP Server 被嵌入式 PL/SQL 网关 (EPG) 取代。嵌入式 PL/SQL
    网关运行在 Oracle 数据库的 XML DB HTTP 服务器中，包含了 mod_plql 的核心功能，但不需要由 Apache 驱动的 Oracle
    HTTP Server。请图 1-2，使用嵌入式 PL/SQL 网关的 Application Express 架构。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_1.png)


    通过生成的应用程序迁移工作坊转换您的旧版 Oracle Forms 和 Microsoft Access 应用程序。


    '
