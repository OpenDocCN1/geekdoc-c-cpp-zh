    ## Chapter 10 – Deploy and Access APEX Application


    While creating the workspace ASACLONE we created a database schema with the same
    name to hold database objects. APEX not only created the schema but also created
    the default tables. Right now, the deployed application is using the default data.
    In section 10.3 of this chapter we exported data from the development environment.
    Our last task is to retrieve data to complete our deployment task.


    - 1. Open the SQL Command utility and connect system/manager

    - 2. Type drop user ASACLONE cascade;

    - 3. Type create user ASACLONE identified by clone tablespace users;

    - 4. Type grant connect, resource to ASACLONE;

    - 5. Open a Windows command prompt

    - 6. Type cd c:\oracle datapump

    - 7. Type Impdp system/manager remap_schema=ASA:Clone remap_tablespace=USERS directory=datapump
    dumpfile=ASA.dump logfile=ASAImport.log

    - 8. Open a new browser and type http://localhost:8080/apex/f?p=117

    - 9. In Username type demo and asclone in the password. The Invalid Login message
    appears, indicating that the default tables have been replaced by those in the
    development environment.

    - 10. Type demo in the password. You''re logged in. Click the Customers tab and
    see the data you entered in your development computer.


    It''s. We have successfully deployed our application on the same computer but
    in a different workspace and schema. You can apply the same procedure to deploy
    the application in another environment. In the next section we will try to connect
    this application in a LAN environment as well as from the internet. It is assumed
    that you have deployed the application on a computer having two network interface
    cards. One connected to the local area network and the other to a DSL modem.


