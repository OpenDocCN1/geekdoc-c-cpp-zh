    # CHAPTER 1


    # ORACLE APPLICATION EXPRESS INTRODUCTION'
  - '[PAGE 17]


    # Chapter 1 - Introduction


    Oracle Application Express (oracle APEX), is a rapid web application development
    tool for the Oracle database. It runs in an Oracle database instance and comes
    as a no-cost option with Oracle database. If you want to develop and deploy fast
    and secure professional applications then Oracle APEX must be your choice. The
    only requirements are a web browser and a little programming experience. Besides
    ease of use and flexibility. Oracle application express provides the qualities
    of an enterprise database, scalability, security, integrity, availability and
    above all the web development experience.


    It has the web-based application development environment to build web applications.
    You are not required to install any client software to develop, deploy, or run
    APEX applications. Following are the three primary tools provided by Oracle APEX:


    +   - Application Builder – to create database driven applications

    - SQL Workshop – to browse your databases, run ad-hoc SQL queries, as well as
    graphical query builder

    - Utilities – allows for data to be loaded and unloaded from both flat files and
    spreadsheets


    Develop any application through an easy declarative development process of Application
    Express. However, you can use HTML to extend the presentation of your client interfaces
    and add Oracle''s standard PL/SQL procedural language to supply additional logical
    operations.


    With this productive tool you can build applications that report on database data.
    Create hyper text linked reports to easily link to other reports, charts, and
    data entry forms. Charts have built-in drill-functionality, so that a user can
    get more detailed information on any of the sections of the chart with a simple
    mouse click. You can effectively communicate data using the charting engine by
    presenting SQL queries graphically. Use declarative form controls including shuttles,
    text editors, date pickers, checkboxes, radio groups, and select lists to manipulate
    data.


    Easily and instantly build opportunistic and departmental applications with the
    help of simple wizards. This makes Application Express a natural replacement for
    multi-user database applications. Create highly professional, secure, and scalable
    applications without scripting languages and complex framework.


    Application Express provides a declarative programming environment, which means
    that no code is generated or compiled during development. You just interact through
    wizards and property sheets. Reports and charts are defined'
  - '[PAGE 18]


    # Create Rapid Web Application Using Oracle Application Express


    with simple queries, so some knowledge of SQL is very helpful. Besides, if procedural
    logic is needed, you can also write PL/SQL code.


    Oracle Application Express lives entirely within your Oracle database. It is comprised
    of nothing more than data in tables and large amount of PL/SQL code. The essence
    of Oracle Application Express is approximately 215 tables and 200 PL/SQL objects
    containing 300,000+ lines of code. The Application Express engine renders applications
    in real time from data stored in database tables. When you create or extend an
    application, Oracle Application Express creates or modifies metadata stored in
    database tables. When the application is run, the Application Express engine reads
    the metadata and displays the application.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_18_0.png)


    Velocity in the demand for new applications and functionality rises as businesses
    grow. As a developer, you are expected to rapidly respond to these needs. Over
    the years, desktop database and spreadsheet tools have enormously contributed
    to data management due to the ease and user friendliness these applications extend
    to their audience. Besides benefits, these applications have scalability and functionality
    limitations that not only results in dozens of different applications and data
    sources also adds extra overhead in their maintenance. Due to these issues, organizations
    are unable to continue their standard practices, leaving mission-critical data
    at risk. These fragmented systems may also cause loss of business opportunity.
    Finally, significant amount of time and resource is required to put these blocks
    together to get the desired information. In addition to above, the following points
    provide some more drawbacks of desktop applications:


    +   - Installation of client software, such as Excel, on every machine

    - Lack of data sharing with other applications

    - Simultaneous data access inability in spreadsheets

    - May not be the part of regular data backup

    - Critical and confidential data can easily be moved via email or pocket storage
    devices


    Having gone through the above stuff, it is clear that you need a tool that has
    the capability to cope with these çıkart. The following list shows how APEX allows
    you to handle most of these issues:


    +   - Central management of data and data applications

    - No installation of software is required on client machines, the only requirement
    is a supported browser

    - Shared development and application access'
