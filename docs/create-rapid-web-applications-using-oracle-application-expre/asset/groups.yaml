    \ 章 – 高级报告\n\n默认情况下，Oracle Database 11g release 1 (11.1) 中与网络服务交互的能力是禁用的。因此，如果你在\
    \ Oracle Database 11g release 1 (11.1) 上运行 Oracle Application Express，你必须使用新的\
