    - 1. 打开 SQL 工具并连接 system/manager

    - 2. 输入 drop user ASACLONE cascade;

    - 3. 输入 create user ASACLONE identified by clone tablespace users;

    - 4. 输入 grant connect, resource to ASACLONE;

    - 5. 打开 Windows 命令行

    - 6. 输入 cd c:\oracle datapump

    - 7. 输入 Impdp system/manager remap_schema=ASA:Clone remap_tablespace=USERS directory=datapump
