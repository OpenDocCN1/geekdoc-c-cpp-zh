    # Create Rapid Web Application Using Oracle Application Express


    Sales Quota demonstrates the use of a Flash Dial chart. This chart displays a
    value based on an underlying SQL statement to measure sales against the defined
    quota for the logged in user.


    Note: The Flash Dial Chart is not displayed if you log in as an Admin user.


    Top Customers is a report based on a SQL query and displays a subset of the information
    that appears on the Customers page. Users can link to additional details by clicking
    the customer name or by clicking the View Customer icon (a right arrow, marked
    as K in the above figure) in the upper right corner of the region.


    Top Products is also a report based on a SQL query. This report displays a subset
    of the information that displays on the Products page. Users can link to product
    details by clicking the product name or by clicking the View Products icon in
    the upper right corner of the region.


    Orders by Date displays orders by date and order amount. Users can view the Orders
    page by clicking the right arrow in the upper right corner.


    Sample Application is a simple HTML region that displays static Welcome text.
    You can create this type of region to display explanatory information to users.


    Tasks contains a list with links to other pages within the application. Links
    available on the Home page Tasks list include:


    +   - Enter a New Order links to a wizard for creating a new order.

    - Add a New Customer links to a form for entering new customer information.

    - Add a New Product links to a form for adding new products.'
  - '[PAGE 29]


    Chapter 2 – The Building Blocks


    # 2.2.2 Manage Customers


    The Customers page enables users to view and edit customer information.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_29_0.png)


    Customers is an interactive report for tracking customer information. To search
    for a customer, enter a customer name in the Search field and click Go. To sort
    by customer name, click the column heading and select the Up or Down arrow to
    sort in ascending or descending mode.


    You can change the appearance of the report using the Actions menu. To update
    existing customer information, click the Edit icon (the yellow pencil icon - to
    the left). To add a new customer, click the Create Customer button.'
  - '[PAGE 30]


    # 2.2.3 Setup Products


    The Products page enables users to view and edit product information. The Products
    page consists of two main regions:


    +   * Products

    * Top 5 Products


    Products displays product information. This region is based on a SQL query that
    uses a custom function for displaying images stored in the database.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_30_0.png)


    Figure 2-3


    The page has three view options: Icon, Report, and Detail. By default, the page
    is displayed in Icon view. To edit product information in Icon view, click an
    image.


    To view the information in a report format, click the View Report icon. In Report
    view, you can sort by product category by clicking the column heading and selecting
    the Up or Down arrow to sort in ascending or descending mode. Users can change
    the appearance of the report using the Actions menu. To edit a product description,
    click the Edit icon. To add a new product, click the Create Product button at
    the top of the page.


    Top 5 Products is also a SQL report. This report outlines the top five products
    based on quantities sold.'
