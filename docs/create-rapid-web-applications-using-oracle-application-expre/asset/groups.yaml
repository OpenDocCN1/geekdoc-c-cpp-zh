    # 2.5.5 Authentication Scheme


    Authentication is the process of establishing each user''s identity before they
    can access your application. There are three preconfigured authentication schemes
    which are created at the time of application creation. In our application, we
    are going to use custom authentication scheme that is based on the username and
    password values stored in the DEMO US table and will be using CUSTOM_AUTH function.


    +   1. Go to Shared Components

    2. Click Authentication Schemes under Security section'
