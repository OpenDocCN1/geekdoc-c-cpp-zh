    # CHAPTER 8


    # ADVANCED REPORTING


    > Success is a journey, not a destination.


    We have seen the use of interactive reporting feature in APEX to create professional
    looking on-screen reports. But, we download the PDF version of these reports to
    have a hard copy, what we get is a generic report in.


    The following section will guide you to download and install the limited license
    to use the program only for the development purpose. Oracle Application Express
    provides the following two options:


    - **Standard**: Use FOP or another XSL-FO processing engine supported under standard
    configuration. Oracle Application Express already includes support for FOP, such
    as page size, header and footer.

    - **Advanced**: This option requires Oracle BI Publisher to be configured as your
    print server. Besides standard configuration, Oracle BI Publisher has Word Template-in
    to create RTF based layouts.


    The following list contains few reports that can be created using the advanced
    option:


    - Tax and Government Forms

    - Invoices

    - Ledgers

    - Financial Statements

    - Bill of Lading, using tables and barcode fonts.

    - Operational Reports with re-grouping, conditional highlighting, summary calculations
    and running totals

    - Management Reports having Chart with summary functions and table with detail
    records

    - Check Print, using conditional formatting and MICR fonts

    - Dunning Letters

