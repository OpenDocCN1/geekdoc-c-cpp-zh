    # Chapter 2 – The Building Blocks


    +   3. Click Application Express scheme


    +   4. Change the Name to Custom Scheme and Description to This is a custom authentication
    scheme.


    +   5. In Authentication Function replace -BUILTIN- with return custom auth function


    +   6. Click Apply Changes button


    The currently applied authentication scheme contains a check mark on its icon.
    Please make sure that the CUSTOM SCHEME we created in this exercise has that check.
    If not, click the Change Current tab on the same page. Select the scheme from
    the drop down list and click the Make Current button.


    Authorization schemes help you identify additional security beyond simple user
    authentication. For example users with administration rights may have access to
    more navigation bar icons, pages, and tabs than other users. This type of access
    right will be implemented in our application where the tab Administration will
    only be accessed by admin users.


