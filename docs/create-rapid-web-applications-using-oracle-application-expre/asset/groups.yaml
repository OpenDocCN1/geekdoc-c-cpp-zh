    # 使用 Oracle Application Express 创建快速 Web 应用程序


    在本章中，我们将实现自定义身份验证方案，并在 Administration（管理）标签下创建两个页面来管理用户。这两个页面将仅对具有管理员权限的用户显示，并允许：


    - 添加新用户

    - 选定用户

    - 修改密码


    自定义身份验证方案使用 CUSTOM_AUTH 和 CUSTOM_HASH 数据库函数在表存储存储淆后的密码。Manage Users（管理用户）页面 –
    第 8 页，允许你创建额外用户并删除选定用户，而第 9 页允许用户更改他们的密码。


    ## 9.1.1 CUSTOM_AUTH 函数


    ```sql

    create or replace function custom_auth (p_username in VARCHAR2, p_password in
    VARCHAR2)

    return BOOLEAN

    is l_password varchar2(4000);

    l_stored_password varchar2(4000);

    l_expires_on date;

    l_count number;

    begin

    -- 首先，检查用户是否在用户表中

    select count(*) into l_count from demo_users where user_name = p_username;

    if l_count > 0 then

    -- 首先，我们获取存储的哈希密码和过期日期

    select password, expires_on into l_stored_password, l_expires_on

    from demo_users where user_name = p_username;


    -- 接下来，检查用户账户是否过期

    -- 如果过期，则返回 FALSE

    if l_expires_on > sysdate or l_expires_on is null then


    -- 如果账户未过期，我们必须对密码应用自定义哈希

    -- 函数

    l_password := custom_hash(p_username, p_password);


    -- 最后，我们比较它们查看是否相同，并返回

    -- TRUE 或 FALSE

    if l_password = l_stored_password then

    return true;

    else

    ```


