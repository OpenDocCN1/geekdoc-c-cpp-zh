    ```sql

    return false;

    end if;

    else

    return false;

    end if;

    else

    -- 提供的用户名不在 DEMO_USERS 表中

    return false;

    end if;

    end;

    ```


    ## 9.1.2 CUSTOM_HASH 函数


    ```sql

    create or replace function custom_hash (p_username in varchar2, p_password in
    varchar2)

    return varchar2

    is

    l_password varchar2(4000);

    l_salt varchar2(4000) := ''477CS6K64KCDIDEY70S'';

    begin

    -- 此函数应该被封装，因为算法在这里暴露了。

    -- 你可以更改 l_salt 的值或调用 DBMS_obfuscation_toolkit

    -- 的方法，但如果你选择这样做，请重置你所有的密码。

    l_password := utl_raw.to_raw(db_obfuscation_toolkit.md5(p_password || substr(l_salt,10,13)
    || p_username || substr(l_salt,4,10)));

    return l_password;

    end;

    ```


