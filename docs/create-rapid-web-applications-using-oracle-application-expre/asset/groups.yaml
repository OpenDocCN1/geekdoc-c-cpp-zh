- md: "\n## 8. Edit the newly created region\n\n 9. Click Report Attributes tab and\
    \ set the following attributes:\n\n| Attribute | Value |\n| --- | --- |\n| Heading\
    \ Type | None |\n| Report Template | template: 4. Horizontal Border |\n| Pagination\
    \ Scheme | No Pagination Selected |\n| Enable Partial Page Refresh | No |\n| Number\
    \ of Rows | 5 |\n| Maximum Row Count | 5 |\n\n## 5.3.4 Modify Button Attributes\n\
    \n- 1. Click Redirect to page 6 under Buttons section, set the following attributes\
    \ and Apply Changes:\n\n| Attribute | Value |\n| --- | --- |\n| Button Name |\
    \ CREATE |\n| Text Label / Alt | Create Product > |\n| Button Alignment | Left\
    \ |\n| Authorization Scheme | Edit Products |\n\n- 2. Click Run to test page number\
    \ 3. Enter demo and asa in username and password respectively in the login page.\
    \ The page will look like Figure 5-1. There are 3 different views of this page\
    \ (Icon, Report, Detail), click each one of them and see the output.\n\n- 3. Click\
    \ Create Product button. Product Details page (Page 6) appears.\n\n## Chapter\
    \ 5 – Setup Products\n\nClick **Edit Page 6** in Developer Toolbar to modify this\
    \ page.\n\n## 5.4.1 Modify Page Attributes\n\n- 1. Click **Edit** under Page section,\
    \ click **Show All**, scroll down to Security section and set Authorization Scheme\
    \ to **Edit Products**. This setting ensures that only authorized users can modify\
    \ product's details. The Edit Products scheme was created in chapter 2 section\
    \ 2.5.6 (b). Click the **Apply Changes** button.\n\n## 5.4.2 Modify Region - Product\
    \ Details\n\n- 1. Click **Product Details** in regions and select Display Point\
    \ to Page Template Body (2. items below region content), and **Apply Changes**.\n\
    \n## 5.4.3 Create Region – Product Image\n\nTo show the image of the selected\
    \ product, we will create an HTML region on the right side of the page.\n\n- 1.\
    \ Click **Create** in Regions section\n2. Click **HTML**\n3. Click **HTML**\n\
    4. Enter **Product Image** in Title, select **Sidebar Region** for Region Template,\
    \ select **Page Template Region Position 3** in Display Point and click **Next**\
    \ twice\n5. In Condition Type select **PL/SQL Function Returning a Boolean** and\
    \ enter the following block in Expression:\n```sql\ndeclare\nbegin\n  if :P6.PRODUCT_ID\
    \ is not null then\n    for c1 in (select nvl(dbms_lob.getlen(product_image),0)\
    \ i\n    from demo_products\n    where product_id =:P6.PRODUCT_ID)\n    loop\n\
    \      if c1.i > 0 then\n        return true;\n      end if;\n    end loop;\n\
    \  end if;\nreturn false;\nend;\n```\n6. Click **Create Region**\n\n## 5.4.4 Create\
    \ Button to delete image – Delete\n\n- 1. Click Create in Buttons section\n2.\
    \ Select Product Image(11) 20 for the button region\n3. Click Create a button\
    \ in a region position\n4. Enter DELETE_IMAGE in Button Name\n5. Enter Delete\
    \ in Label and click Next\n6. Select Below Region in Position\n7. Click Next and\
    \ then Create Button\n\n## 5.4.5 Modify Items Attributes\n\nClick each item and\
    \ set the following attributes:\n\n| Item | Width | Max.Width | Label | Template\
    \ | Value Required |\n| --- | --- | --- | --- | --- | --- |\n| P6_PRODUCT_NAME\
    \ | 32 | 255 | Product Name | Required with help | Yes |\n| P6_PROD_DESCRIPTION\
    \ | 60 | 255 | Product Description | | |\n| P6_LIST_PRICE | 5 | 255 | List Price\
