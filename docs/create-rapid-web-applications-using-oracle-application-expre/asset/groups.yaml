  - '[PAGE 57]


    # Chapter 3 – The Home Page


    In this chapter we will complete the Home page of our sample application. The
    first page that appears when a user successfully logs in to the application, the
    Home page is a dashboard which contains the following six regions:


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_57_0.png)


    | Sales Quota | Q1 | Q2 | Q3 | Q4 |

    |---|---|---|---|---||

    | James | $11-$25 | $3,150.00 | 08/26/01 | $2,200.00 | $2,380.00 |

    | Thomas | $21-$45 | $1,680.00 | 08/26/01 | $1,490.00 | $1,640.00 |

    | Lydia | $12-$21 | $1,440.00 | 08/22/01 | $1,515.00 | $1,490.00 |

    | Business | $23-$50 | $1,150.00 | 01/02/01 | $1,060.00 | $1,160.00 |

    | Scott | $14-$48 | $1,120.00 | 07/21/01 | $958.00 | |


    Figure 3-1


    A/B. Sales Quota: measured against quota for the logged-in user. Region B will
    be visible for Admin users.


    C. Top Customers: list of ten customers with most orders. When you click on a
    customer in this list, you are taken to the Customer Details page showing customer
    profile and details of all orders placed by that customer. You can also see a
    tiny arrow, [H], to the right of this region which invokes Customers'' main page.


    D. Top Products: Similar to Top Customers, this region displays selling products
    with all the drill down functionality described in the previous section.


    E. Top Orders by Date: This list shows top orders on any particular day.


    F. Sample Application: It is a simple HTML region that displays static welcome
    text. You can create this type of region to display explanatory information to
    users.'
- md: "\n# Create Rapid Web Application Using Oracle Application Express\n\nG. Tasks:\
    \ This region contains a list with links to other pages within the application.\
    \ Links available on the Home page:\n\n- Enter a New Order links to a wizard for\
    \ creating a new order.\n- Add a New Customer links to a page for entering new\
    \ customer information.\n- Add a New Product links to a form for adding new products.\n\
    \nPlease see section 2.2.1 Chapter 2 for more information on the Home page.\n\n\
    Let's start!\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_58_0.png)\n\n- 1. Login\
    \ to APEX using http://localhost:8080/apex. See section 2.5, chapter 2 for login\
    \ information.\n2. Click the Application Builder icon\n3. Click APEX Sample Application\n\
    \n- 4. Click on Page 1 having home icon. This will bring up the definition page\
    \ as show in figure 3-2. Click Component View button, if the view of your page\
    \ is different from that in figure 3-2.\n\n> For clarity purpose, only those sections\
    \ of the page are shown in figure 3-2 that have some values. Blank sections have\
    \ been truncated from the screen shot.\n\n# Chapter 3 – The Home Page\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_59_0.png)\n\
    \nFigure 3-2\n\n## 3.2.1 Modify Page Attributes\n\n- 1. In Page Rendering, click\
    \ the Edit icon in Page section (see Figure 3-2). Click Show All tab and set the\
    \ following attributes. After setting these attributes, click Apply Changes button.\n\
    \n| Attribute | Value |\n| --- | --- |\n| Name | APEX Sample Application |\n|\
    \ Title | APEX Sample Application |\n| HTML Header and Body Attributes | <style>\n\
    .rounded-corner-region .re-border-r {height: 170px!important;}\n</style> |\n\n\
    ## 3.2.2 Create Regions\n\n### A. Sales Quota Region 1\n\nLet's create our first\
    \ region. Sales Quota: This region will be displayed for users other than Admin\
    \ to graphically measure their sales against the allotted quota.\n\n- 1. In the\
    \ Regions section, delete the two existing regions Page 1 and Breadcrumbs. Click\
    \ each region and delete the Delete button and confirm deletion.\n2. Click Create\
    \ icon in the Regions section to create a New Region.\n3. Click Chart\n4. Click\
    \ Flash Chart\n5. Click Guages\n6. Click Dial\n7. Enter Sales Quota in Title,\
    \ 10 in Sequence and click the Next button\n8. Click Next to accept the default\
    \ settings\n9. Enter the following SQL Query\n\n```\nSelect order_total, quota,\
    \ 0, order_total\nFrom (\n    select sum(o.order_total) order_total\n    from\
    \ demo_orders o, demo, users u\n    where o.user_id = u.user_id and u.user_name\
    \ = :APP_USER)\norder_total, quota from demo_users u where u.user_name = :APP_USER\n\
    ```\n\n10. Click the Create Region button\n\n11. Click Sales Quota link in the\
    \ Regions section and set the following attributes:\n\n| Attribute | Value |\n\
    | --- | --- |\n| Template | Reports Region |\n| Region Attributes | style=\"width:49%;\
    \ float:left; margin-right:1%;\" |\n| Region Header | My Sales Measured against\
    \ quota |\n| Authorization Scheme | {Not Admin Users} |\n\n12. Click the Chart\
    \ Attributes tab on the same page and set the following chart attributes:\n\n\
    | | Value |\n| --- | --- |\n| Chart Width | 300 |\n| Chart Height | 180 |\n| Top\
    \ Margin | -20 |\n| Color Scheme | Look1 |\n| Tick Labels | Remove check from\
    \ Tick Labels |\n\n# Chapter 3 – The Home Page\n\n### B. Sales Quota Region 2\n\
    \nCreate another Sales Quota region with sequence number 11. This region will\
    \ be displayed for Admin users.\n\n- 1. Click Create icon in the Regions section\
    \ to create a new Region.\n2. Click HTML\n3. Click HTML\n4. Enter Sales Quota\
    \ in Title\n5. Enter 11 in Sequence and click Next\n6. Click Create Region\n7.\
    \ Click the newly created Region Sales Quota with sequence 11, set the following\
    \ attributes and changes.\n\n| Attribute | Value |\n|---|---|\n| Region Attributes\
    \ | style=\"width:49%; float:left; margin-right:1%;\" |\n| Region Header | Admins\
    \ have no quota |\n| Authorization Scheme | Admin Users |\n\n### C. Top Customers\
    \ Region\n\nCreate region, Top Customers, to show 7 customers with highest orders.\n\
    \n- 1. Click Create icon in the Regions section\n2. Click Reports\n3. Click SQL\
    \ Report\n4. Enter Top Customers in Title, 20 in Sequence and click Next\n5. Enter\
    \ the following SQL Query in the next page:\n\n```\nSelect b.cust_last_name ||\
    \ ' , ' || b.cust_first_name || \\|-'-' || count(a.order_id) || 'Order(s)'\ncustomer_name,\
    \ sum(a.order_total) order_total, b.customer_id id\nfrom demo_orders a, demo_customer\
    \ b\nwhere a.customer_id = b.customer_id\ngroup by b.customer_id, b.cust_last_name,\
    \ b.cust_first_name\norder by order_total desc\n```\n\n- 6. Click Create Region\
    \ button\n7. Click the newly created region Top Customers with sequence 20, set\
    \ the following attributes:\n\n| Attribute | Value |\n|---|---|\n| Region Attributes\
    \ | style=\"width:49%; float:left; margin-right:1%;\" |\n| Region Header | Top\
    \ Customers |\n| Authorization Scheme | {Not Admin Users} |\n\n8. Click the Chart\
    \ Attributes tab on the same page and set the following chart attributes:\n\n\
    | | Value |\n| --- | --- |\n| Chart Width | 300 |\n| Chart Height | 180 |\n| Top\
    \ Margin | -20 |\n| Color Scheme | Look1 |\n| Tick Labels | Remove check from\
    \ Tick Labels |\n\n### D. Top Products\n\nCreate region, Top Products, to show\
    \ 7 products with highest orders.\n\n- 1. Click Create icon in the Regions section\n\
    2. Click Reports\n3. Click SQL Report\n4. Enter Top Products in Title, 30 in Sequence\
    \ and click Next\n5. Enter the following SQL Query in the next page:\n\n```\n\
    Select p.product_name, SUM(oi.quantity) as sales\nfrom demo_order_items oi, demo_product\
    \ p\nwhere oi.product_id = p.product_id\ngroup by p.product_name\norder by sales\
    \ desc\n```\n\n6. Click Create Region button\n7. Click the newly created region\
    \ Top Products with sequence 30, set the following attributes:\n\n| Attribute\
    \ | Value |\n|---|---|\n| Region Attributes | style=\"width:49%; float:left; margin-right:1%;\"\
    \ |\n| Region Header | Top Products |\n| Authorization Scheme | {Not Admin Users}\
    \ |\n\n### E. Top Orders by Date\n\nCreate region, Top Orders by Date, to show\
    \ top 7 ordering days.\n\n- 1. Click Create icon in the Regions section\n2. Click\
    \ Reports\n3. Click SQL Report\n4. Enter Top orders by Date in Title, 40 in Sequence\
    \ and click Next\n5. Enter the following SQL Query in the next page:\n\n```\n\
    Select o.order_timestamp order_day, sum(o.order_total)\nfrom demo_orders\ngroup\
    \ by o.order_timestamp\norder by 2 desc\n```\n6. Click Create Region button\n\
    7. Click the newly created region Top Orders by Date with sequence 40, set the\
    \ following attributes:\n\n| Attribute | Value |\n|---|---|\n| Region Attributes\
    \ | style=\"width:49%; float:left; margin-right:1%;\" |\n| Region Header | Top\
    \ Orders by Date |\n| Authorization Scheme | {Not Admin Users} |\n"
  mdcn: "\n\n# 使用 Oracle Application Express 创建快速 Web 应用程序\n\nG. 任务：此区域包含一个指向应用程序内其他页面的链接列表。首页上的可用链接有：\n\
    \n- [输入新订单](Enter New Order)：指向创建新订单的向导。\n- [添加新客户](Add New Customer)：指向输入新客户信息的页面。\n\
    - [添加新产品](Add New Product)：指向添加新产品的表单。\n\n有关首页的更多信息，请参阅第 2 章 2.2.1 节。\n\n让我们开始吧！\n\
    \n![](img/5bf6e7eb17c41dae70753fc9049e3008_58_0.png)\n\n- 1. 使用 http://localhost:8080/apex\
    \ 登录 APEX。登录信息请参见第 2 章 2.5 节。\n2. 点击应用程序生成器（Application Builder）图标\n3. 点击 APEX\
    \ Sample Application\n\n- 4. 点击带有首页图标的 Page 1。这将显示如图 3-2 所示的定义页面。如果页面视图与图 3-2\
