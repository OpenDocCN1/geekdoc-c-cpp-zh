    #高级报告


    > 成功是一个过程，而不是终点。


    我们已经看到了使用 APEX 中的交互报告功能创建专业的屏幕报告。但我们需要下载这些报告的 PDF 版本以获得打印副本，我们得到的是通用报告格式。


    本节将指导您下载并安装仅用于开发目的的限制许可。Oracle Application Express 提供以下两个选项：


    - **标准**：在标准配置下使用 FOP 或其他 XSL-FO 处理引擎。Oracle Application Express 已经包含了对 FOP 的支持，例如页面大小、页眉和页脚。

    - **高级**：此选项需要将 BI Publisher 配置为您的打印服务器。除了标准配置外，BI Publisher 具有 Word 模板用于创建 RTF
    布局。


    以下列表包含可以使用高级选项创建的少量报告：


    - 税务和政府表单

    - 发票

    - 账本

    - 财务报表

    - 运单，使用表格和条形字体

    - 具有重新分组、条件高亮、汇总计算和运行总计的操作报告

    - 具有带有汇总功能的图表和带有详细记录表格的管理报告

    - 支票打印，使用条件格式和 MICR 字体

    - 催款信


