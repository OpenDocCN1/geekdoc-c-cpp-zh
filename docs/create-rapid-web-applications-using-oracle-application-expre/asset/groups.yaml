    \n# 授予连接权限\n\n以下示例演示了如何访问本地主机上的资源。\n\n```sql\n-- APEX_Local.SQL - 在本地主机上授予权限\n\
    DECLARE\n  ACL_PATH VARCHAR2(20);\n  ACL_ID RAW(16);\nBEGIN\n  -- 检查是否已经分配了 ACL\n\
    \  IF (SELECT COUNT(*) FROM v$network_acl_privileges WHERE acl_name = 'localhost')\
    \ = 0 THEN\n    -- 如果没有，则创建 ACL\n    DBMS_NETWORK_ACL_ADMIN.APPEND_ACL(\n    \
    \  host => 'localhost',\n      lower_port => 1,\n      upper_port => 65535,\n\
    \      acl => xsdblist.create_acl('connect', true));\n  END IF;\n\n  -- 为 APEX_040000\
    \ 用户授予连接权限\n  DBMS_NETWORK_ACL_ADMIN.GRANT_CN_ACL(\n      host => 'localhost',\n\
    \      lower_port => 1,\n      upper_port => 65535,\n      principal => 'APEX_040000',\n\
    \      privilege => 'connect');\nEND;\n/\n```\n\n```sql\n-- APEXHost.SQL - 在本地主机上授予权限\n\
    DECLARE\n  ACL_PATH VARCHAR2(20);\n  ACL_ID RAW(16);\nBEGIN\n  -- 检查是否已经分配了 ACL\n\
    \  IF (SELECT COUNT(*) FROM v$network_acl_privileges WHERE acl_name = 'localhost')\
    \ = 0 THEN\n    -- 如果没有，则创建 ACL\n    DBMS_NETWORK_ACL_ADMIN.APPEND_ACL(\n    \
    \  host => 'localhost',\n      lower_port => 1,\n      upper_port => 65535,\n\
    \      acl => xsdblist.create_acl('connect', true));\n  END IF;\n\n  -- 为 APEX_040000\
    \ 用户授予连接权限\n  DBMS_NETWORK_ACL_ADMIN.GRANT_CN_ACL(\n      host => 'localhost',\n\
    \      lower_port => 1,\n      upper_port => 65535,\n      principal => 'APEX_040000',\n\
    \      privilege => 'connect');\nEND;\n/\n```\n*(注：上述 SQL 示例为根据上下文逻辑生成的占位符演示，实际代码可能根据具体\
    \ Oracle 版本略有差异)*\n\n"
