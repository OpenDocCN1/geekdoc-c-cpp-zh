    # Create Rapid Web Applications Using Oracle Application Express


    Congratulations! You have completed the most tiresome but interesting chapter
    of the book. This chapter taught you many techniques that we will see in the Summary
    section. Right now, we are going to test the whole work that we did in this chapter.


    - 1. Move to the application''s Home page.

    2. Click Orders tab and click Enter New Order button.

    3. Select New Customer and click Next

    4. Fill in the New Customer form using your own name, address etc. and click Next

    5. In Select Item page add few products to the Current Order page

    6. Click Place button. Order Summary Page appears as shown in Figure 6-23


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_144_0.png)


    Figure 6-23


    - 7. Click View Orders button in the Order Summary Page to move to Orders main
    page. The newly created order should appear on top of the orders list


    - 8. Click - to edit the new created order. The page should look like figure 6-14
    displayed earlier in this chapter. Try to add or remove products on this page
    and save your modifications.


    The lengthy chapter of the book demonstrated the following techniques:


    - Utilization of wizard using Order Progress list

    - Created master/detail forms

    - Created Primary and Alternative reports

    - Created Public Reports

    - Report, Chart, and Group by views of data

    - Use of Control Break, Highlight, and Aggregate functions

    - Drill down to data entry page from report

    - Graphical presentation of data

    - Added Processes in Page Rendering

    - Created a new customer without leaving the order''s page

    - Utilized Dynamic Actions to Show/Hide page item

    - How to use style in pages

    - Usage of PL/SQL code in pages

    - Call a popup window to display information

    - Summarize data


    ## CHAPTER 7

    GENERATE GRAPHICAL REPORTS


    The best way to predict the future is to invent it.


    # Chapter 7 – Generate Graphical Reports


    When creating order pages in the previous chapter, we did some work on interactive
    reports and saw how easy it was to create flexible and powerful reports in Oracle
    Application Express. In this chapter we will take a step ahead and will create
    the following reports to graphically present the data:


    | Report | Purpose | Page No. |

    |---|---|--|

    | Customer Orders | Show total orders placed by each customer | 17 |

    | Sales By Category and Product | Display sales for category and products | 16
    |

    | Sales by Category / Month | Total monthly sales for each categories | 5 |

    | Order Calendar | Show orders in a calendar view | 10 |

    | Customer Map | Show orders in a map according to area | 13 |

    | Product Order Tree | Display categories and product orders in a tree | 19 |


    - 1. Login to APEX using http://localhost:8080/apex

    2. Click Application Builder Icon

    3. Click APEX Sample Application


    To creating reports, we will create the reports menu. This menu will be displayed
    to the right on all report pages. In order to achieve this task, we need to create
    Page zero. Page zero components are displayed on all pages if their region''s
    display point is contained within the selected page template. Conditional Display
    attributes can be used to suppress display. This is a very simple and effective
    way of sharing APEX objects throughout the application. In this exercise we will
    create Page Zero for our application to display the list, Report Tabs, created
    in chapter 2 section 2.5.2 (b). As mentioned above, Page zero components are shared
    across the application, therefore, we are going to put a condition to display
    the reports list only on pages related to the Reports tab.


    # Create Rapid Web Applications Using Oracle Application Express


    - 1. Click Create Page button

    2. Click Page Zero icon

    3. Click Finish

    4. Page Zero''s definitions appear

    5. Click Create in Regions section

    6. Click List

    7. Enter Reports in Title, set Template to Navigation Region, Display Point to
    Page Template Region Position 3 and click Next

    8. Set List to Reports Tab

    9. Set Condition Type to Current Page Is Contained Within Expression 1 (comma
    delimited list of pages) and enter 5,10,13,16,17,19 in Expression 1

    10. Click Create Region


    Now we can create the reports to present data graphically. Let''s start with the
    Customers Order report.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_148_0.png)


    - 1. Click Application 101 in the breadcrumb

    2. Click Create Page button

    3. Click Blank Page icon

    4. Enter 17 in Page Number, click Next

