    \ |\n| 区域模板 | 不带按钮和标题的区域 |\n| 面包屑 | 主菜单 |\n\n- 7. 在“创建面包屑导航条目”部分的条目名称下输入 Products，在“选择条目”下点击\
    \ Home，并点击下一步\n8. 点击“使用现有标签页并在该标签页集中重用现有标签页”，选择标签页集 TS1，点击下一步\n9. 选择 T.PRODUCTS\
    \ 用于使用标签页，点击下一步\n10. 在“选择列”列表中，使用 Ctrl+点击选择列：Product_Name, Product_Description,\
    \ Category, Product_Avail, List_Price, Product_Image\n\n- 11. 点击下一步\n12. 选择任意编辑链接图标并点击下一步\n\
    13. 在创建表单页面中设置以下属性：\n\n| 属性 | 值 |\n|---|---|\n| 页面页码 | 6 |\n| 页面名称 | Product Details\
    \ |\n| 区域标题 | Product Details |\n| 区域模板 | 报告区域 |\n\n- 14. 在“创建面包屑导航条目”部分的条目名称下输入\
    \ Product Details，点击下一步\n15. 为主键列 1 选择 PRODUCT_ID，点击下一步\n16. 点击现有序列图标，选择 DEMO_PROD_SEQ\
    \ 作为序列，点击下一步\n17. 在“选择列”中选择除 MIMETYPE、FILENAME 和 IMAGE_LAST_UPDATE 之外的所有列，点击下一步\n\
    18. 为插入、更新和删除选择 Yes，点击下一步\n19. 点击完成\n20. 点击编辑页面\n21. 点击应用程序 101 面包屑，两个页面（3-Products\
    \ 和 6-Product Details）已创建。\n22. 点击 3-Products 页面\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_85_0.png)\n\
    \n### 5.3.1 修改页面属性\n\n- 1. 在页面 3 中，点击页面部分下的“编辑”，点击“显示全部”，滚动到 HTML 头部和主体属性（HTML\
    \ Header and Body Attribute），并在 HTML 头部中输入以下脚本：\n<style>\napexir_WORKSHEET_ICON\
    \ {border: none !important;-moz-box-shadow: none !important;-box-shadow: none\
    \ !important;-webkit-box-shadow: none !important;}\napexir_WORKSHEET_ICON td {border-bottom:\
    \ none !important}\napexir_WORKSHEET_ICON td img {border: 4px solid #CCC;-moz-border-radius:\
    \ 4px;-webkit-border-radius: 4px;}\n</style>\n\n- 2. 点击“应用更改”按钮\n\n### 5.3.2 修改区域属性\n\
    \n- 1. 点击区域部分\n- 2. 在区域源（Region Source）中输入以下 SQL 以替换现有语句：\n```sql\nselect p.product_id,\n\
    p.product_name,\np.product_description,\np.category,\ndecode(p.product_avail,\
    \ 'Y','Yes','N','No') as product_avail,\np.list_price,\n(select sum(quantity)\
    \ * p.list_price from demo_order_items where product_id = p.product_id) units,\n\
    (select count(o.order_id) from demo_order_items o, demo_order_items t where o.order_id\
    \ = t.order_id and t.product_id = p.product_id group by p.product_id, customers,\n\
    (select max(o.order_timestamp) from demo_order_o, demo_order_items i where o.order_id\
    \ = i.order_id and i.product_id = p.product_id) last_date,\np.product_id img,\n\
    'f?p=:app_id||6::app_session||P6_PRODUCT_ID||p.product_id icon_link,\ndecode(nvl(dbms.get_length(p.product_image),0),null)\n\
    '<img style=\"border: 4px solid #CCC;-border-radius: 4px;-webkit-border-radius:\
    \ 4px;\" \nsrc=\"\"\napex_util_get_blob_file_src('P4.PRODUCT_ID',p.product_id))\
    \ height=\"75\" width=\"75\" alt=\"Product Image\" title=\"Product Image\" />)\n\
    ```\n- 3. 点击应用更改\n4. 点击运行。（如果需要，分别使用 demo 作为用户名和密码）\n5. 点击操作按钮，点击选择列。确保所有列都显示在报告区域中。如果不是，将所有列移动到显示区域。\n\
    6. 点击操作，保存报告，选择默认。\n7. 点击开发者页面\n8. 在列中，选择：Name, Description, Category, Available,\
    \ Price, Customers, Last Sale, Image\n9. 编辑列并应用以下设置：\n\n| 列 | 属性 |\n|---|---|\n\
    | Price | 隐藏 |\n| Customers | 隐藏 |\n| Last Sale | 隐藏 |\n\n10. 滚动到图像区域并设置以下：\n\n\
    | 属性 | 值 |\n|---|---|\n| 启用 | 是 |\n| 链接 | 标准 |\n| 源 | Products |\n\n11. 在行（Row）中，输入以下脚本：\n\
    ```css\n<style>\n.reportDetail {\n  background: #f9f9f9;\n  border-top: 1px solid\
    \ #ccc;\n}\n.reportDetail td {\n  border-bottom: 1px solid #ccc;\n}\n</style>\n\
    ```\n12. 在表（Table）中，输入以下脚本：\n```css\n.reportDetail {\n  font-size: 12px;\n}\n\
    .reportDetail td {\n  padding: 5px;\n}\n.reportDetail tr:first-child td {\n  background:\
    \ #eee;\n  border-bottom: 2px solid #ccc;\n}\n```\n13. 在...中，输入以下脚本：\n```css\n\
    .reportDetail {\n  display: table;\n  width: 100%;\n}\n.reportDetail tr {\n  display:\
    \ table-row;\n}\n.reportDetail td {\n  display: table-cell;\n}\n```\n14. 在...中，输入以下脚本：\n\
    ```css\n.reportDetail {\n  display: block;\n}\n.reportDetail td {\n  display:\
    \ block;\n  width: 100%;\n}\n```\n\n"
