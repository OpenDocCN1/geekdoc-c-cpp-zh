    [content]

    # Chapter 1 - Introduction


    - Being clear, data and applications become part of regular backup procedure

    - Data and application access control, empowered by audit trail


    The above glimpses have disclosed that APEX is capable of far more than just being
    an Excel or Access replacement. Give it a try by replacing your existing desktop
    applications with APEX application, and enjoy the benefits that this robust technology
    offers.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_0.png)


    You can easily and quickly migrate spreadsheet to Oracle Application Express using
    the Create Application wizard. Simple mouse clicks moves crucial data into an
    Oracle database from a spreadsheet. Using wizard to create a spreadsheet application
    creates a lot of functionality to automatically manage the data. Application have
    built-in data manipulation methods that allow you to query, insert, delete, and
    modify the data. APEX has made it so simple to create a complete application that
    interacts with data with a few mouse clicks, and all that without writing a single
    line of code.


    The application you create based on spreadsheet allows you to view reports and
    charts for the columns selected in the Create Application wizard. Although these
    report and charts provide useful information, you can customize and extend them
    to display the information according to your own needs. Creation of reports and
    charts with ease is another reason to consider worksheet migration to APEX.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_1.png)


    Microsoft Access has been a part of business workflow in many organizations. Similar
    to Excel, Microsoft Access has to be installed on client machine to use the application.
    Access does not support Web Services to facilitate interoperability with Service
    Oriented Architecture (SOA) enabled components. Access database size is limited
    to 2 GB, whereas there is no database size limitations in Application Express.
    The architecture of Application Express supports thousands of concurrent users
    on a small 2 CPU server as opposed to 255 users in Access (recommended figure
    is 20 users only). Application Express can run on Windows, MAC, and Linux, Access
    is only Windows based. In Application Express, data and application are managed
    on a hosted server providing consolidated data management.


    # Create Rapid Web Application Using Oracle Application Express


    On the other hand, information is fragmented in Access as each application is
    contained in one or more files. Concurrent development is another disadvantage
    in Application Express. Multiple developers can work on the same or different
    applications within a workspace. In contrast, Access supports single development
    environment and allows only one developer to use the mdb file at a given time.


    Oracle has provided a feature, Application Migration Workshop, in Application
    Express that assists in migrating application from a personal Access database,
    with minimal effort, to the world number one and most powerful database. Along
    with the Oracle SQL Developer Migration Workbench, it is a complete solution for
    your Access Migration requirements.


    Initially, you are required to migrate schema definition and data using the SQL
    Developer Migration Workbench and then utilize the new Application Migration Workshop
    to migrate Access forms and reports. The last step is refining your new application
    taking advantage of all the power and capabilities of Oracle APEX. Please note
    that Access forms and reports contain business logic that cannot be generated
    using the migration wizard. The solution performs the bulk of the migration work
    by recovering the design from existing Access application and generating APEX
    application based on the findings. Follow the link http://www.oracle.com/technet/developer-tools/apex-application-express-tutorial-090294.html
    and go through the Access Migration Tutorial.


    In previous versions, Oracle HTTP Server (Apache) with mod_plql plug-in was configured
    to access Oracle Application Express engine Figure 1-1.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_0.png)


    With Oracle Database 11.1 and later, Oracle HTTP Server is replaced by embedded
    PL/SQL gateway (EPG). The embedded PL/SQL gateway runs in the XML DB HTTP server
    in the Oracle database and includes the core features of mod_plql, but does not
    require the Oracle HTTP Server powered by Apache. See the Figure 1-2 that illustrate
    Oracle Application Express architecture using the Embedded PL/SQL Gateway.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_1.png)


    Convert your legacy Oracle Forms and Microsoft Access applications through Application
    Migration Workshop that generates.

