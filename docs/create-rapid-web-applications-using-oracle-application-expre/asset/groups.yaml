    ## 使用 Oracle Application Express 创建快速 Web 应用程序


    在整本书中我们一直使用开发者工具来访问应用程序源码：在此练习中，我们将通过禁用工具栏来防止用户修改应用程序。


    - 1. 点击开发者工具栏中的 Application101 按钮

    - 2. 点击共享组件（Shared Components）

    - 3. 点击全球化属性（Globalization Attributes）

    - 4. 点击定义（Definition）选项卡

    - 5. 滚动到可用性（Availability）部分，将构建状态（Build Status）设置为仅运行应用程序（Run Application Only）

    - 6. 点击应用更改（Apply Changes）

    - 7. 应用程序图标更改如图 10-3 所示。你无法运行此应用程序。如果这样做，会收到“应用程序已安装但不可编辑”的消息。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_216_0.png)


    - 8. 打开另一个浏览器并输入 http://localhost:8080/apex/p=117（用你的应用程序 ID 替换 117）。开发者工具栏消失，用户无法访问源码。

    - 9. 关闭所有浏览器


    ## 第 10 章 – 部署和访问 APEX 应用程序


