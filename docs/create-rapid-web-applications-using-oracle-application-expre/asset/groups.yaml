    ## 6.3.1 删除默认区域 – 订单


    我们需要删除默认的“订单”（Orders）区域，以便创建一个相同名称且具有交互功能的新区域。


    - 1. 点击区域（Regions）部分中的“订单”，点击删除（Delete）按钮并确认删除区域

    - 2. 转到第 4 页


    ## 6.3.2 创建区域 - 订单


    - 1. 在区域（Regions）部分创建区域（Create Region）

    - 2. 点击报告（Report）

    - 3. 点击交互式报告（Interactive Report）

    - 4. 在创建区域中设置以下属性：


    | 属性 | 值 |

    | --- | --- |

    | 标题 (Title) | Orders |

    | 区域模板 (Region Template) | 无模板 (No Template) |

    | 显示点 (Display Point) | 页面模板主体 (2. 区域内容下方) |

    | 顺序 (Sequence) | 5 |


    - 5. 在输入 SQL SELECT 语句中输入以下语句：


    ```sql

    select

    o.order_id,

    to_date(to_char(o.order_timestamp,''mm yyyy''), ''mm yyyy'') order_month,

    o.order_timestamp_order_date,

    u.user_name sales_rep,

    o.order_total,

    c.cust_last_name || '' '' || c.cust_first_name customer_name,

    (select count(*) from demo_order_items oi where oi.order_id = o.order_id) order_items

    from

    demo_orders o,

    demo_customers c,

    demo_users u

    where

    o.customer_id = c.customer_id

    and o.user_id = u.user_id

    ```


