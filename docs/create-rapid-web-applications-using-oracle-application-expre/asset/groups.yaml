    \n# Chapter 8 – Advanced Reporting\n\nBy default, the ability to interact with\
    \ network services is disabled in Oracle Database 11g release 1 (11.1). Therefore,\
    \ if you are running Oracle Application Express with Oracle Database 11g release\
    \ 1 (11.1), you must use the new DBMS_NETWORK_ACL_ADMIN package to grant connect\
    \ privileges to any host for the APEX_040000 database user. Failing to grant these\
    \ privileges results in issues with:\n\n- Sending outbound mail in Oracle Application\
    \ Express.\n- Users can call methods from the APEX_MAIL package, but issues arise\
    \ when sending outbound mail.\n- Using Web services in Oracle Application Express.\n\
    - PDF/report printing.\n- Searching for content in online Help (that is, using\
    \ help).\n\n# Granting Connect Privileges\n\nThe following example is a less demonstration\
    \ of how to access resources on a local host. This example would enable indexing\
    \ of Oracle Application Express and possibly enable email and PDF printing. Perform\
    \ the following steps on your Oracle database machine, in our scenario a Windows\
    \ client.\n\n- 1. Create the two files APEXPDFLocal.SQL and APEXPDFHost.SQL in\
    \ Notepad and save the files on your C drive\n\n```sql\n-- APEXPDFLocal.SQL -\
    \ Granting Connect Privileges to a Local Host\nDECLARE\n  ACL_PATH VARCHAR2(20);\n\
    \  ACL_ID RAW(16);\nBEGIN\n  -- Look for the ACL currently assigned to 'localhost'\
    \ and give APEX_04000\n  -- the \"connect\" privilege if APEX_04000 does not have\
    \ the privilege.\n  SELECT ACL_PATH FROM DBA_NETWORK_ACLS\n  WHERE HOST = 'localhost'\
    \ AND LOWER_PORT IS NULL AND UPPER_PORT = NULL;\n\n  -- Before checking the privilege,\
    \ make sure that the ACL is valid\n  -- (for example, does not contain references\
    \ to dropped users).\n  -- If it does, the following exception will be raised:\n\
    \  -- ORA-44416: Invalid ACL: unresolved principal 'APEX_04000'\n  -- ORA-06512:\
    \ \"XDB.DBMS_XDB\", line ...\n\n  SELECT SYS_OP_20(extractValue(P.RES, '/Resource/XMLRef'))\
    \ INTO ACL_ID\n  FROM XDB.DBACL A, PATH_VIEW P\n  WHERE extractValue(P.RES, '/Resource/XMLRef')\
    \ = REF(A) AND\n  NLS_PATH(P.RES, ACL_PATH) = 1;\n\n  DBMS_XDB.ValidateACL(ACL_ID);\n\
    \  IF DBMS_NETWORK_ACL_ADMIN.CHECK_PRIVILEGE(ACL_PATH, 'APEX_04000',\n  'connect')\
    \ IS NULL THEN\n    DBMS_NETWORK_ACL_ADMIN.ADD_PRIVILEGE(ACL_PATH,\n    'APEX_04000',\
    \ TRUE, 'connect');\n  END IF;\n\n  EXCEPTION\n  -- When no ACL has been assigned\
    \ to 'localhost'.\n  WHEN NO_DATA_FOUND THEN\n    DBMS_NETWORK_ACL_ADMIN.CREATE_ACL('local-access-users.xml',\n\
    \    'ACL that lets power users to connect to everywhere',\n    'APEX_04000',\
    \ TRUE, 'connect');\n    DBMS_NETWORK_ACL_ADMIN.ASSIGN_ACL('local-access-users.xml','localhost');\n\
    \  END;\n/\nCOMMIT;\n```\n\n# Create Rapid Web Applications Using Oracle Application\
    \ Express\n\n# APEXPDFHost.SQL - Grant Connect Privileges to a Host\n\n```sql\n\
    DECLARE\n  ACL_PATH VARCHAR2(4000);\n  ACL_ID RAW(16);\nBEGIN\n  -- Look for the\
    \ ACL currently assigned to '*' and give APEX_04000\n  -- the \"connect\" privilege\
    \ of APEX_04000 does not have the privilege yet.\n\n  SELECT ACL_PATH FROM DBA_NETWORK_ACLS\n\
    \  WHERE HOST = '*' AND LOWER_PORT IS NULL AND UPPER_PORT IS NULL;\n\n  -- Before\
    \ checking the privilege, make sure that the ACL is valid\n  -- (for example,\
    \ does not contain references to dropped users).\n  -- If it does, the following\
    \ exception will be raised:\n  -- ORA-44416: Invalid principal 'APEX_04000'\n\
    \  -- ORA-06512: \"XDB.DBMS_XDB\", line ...\n\n  SELECT SYS_OP_20(extractValue(P.RES,\
    \ '/Resource/XMLRef')) INTO ACL_ID\n  FROM XDB.DBACL A, PATH_VIEW P\n  WHERE extractValue(P.RES,\
    \ '/Resource/XMLRef') = REF(A) AND\n  NLS_PATH(P.RES, ACL_PATH) = 1;\n```\n\n\
    - 2. Click Run SQL Command Line\n- 3. On the SQL prompt enter, connect sys sysdba\
    \ and enter the sys user password. I set it to manager.\n- 4. Type @c:\\apexpdfflocal.sql\
    \ and press Enter\n- 5. Type @c:\\apexpdfhost.sql and press Enter\n- 6. PL/SQL\
    \ procedure successfully completed message should appear for both scripts\n\n\
    - 1. Open a browser on your client machine and type http://localhost:8080/apex\
