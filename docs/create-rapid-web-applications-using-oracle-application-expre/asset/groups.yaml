    # Chapter 7 – Generate Graphical Reports


    When creating order pages in the previous chapter, we did some work on interactive
    reports and saw how easy it was to create flexible and powerful reports in Oracle
    Application Express. In this chapter we will take a step ahead and will create
    the following reports to graphically present the data:


    | Report | Purpose | Page No. |

    |---|---|--|

    | Customer Orders | Show total orders placed by each customer | 17 |

    | Sales By Category and Product | Display sales for category and products | 16
    |

    | Sales by Category / Month | Total monthly sales for each categories | 5 |

    | Order Calendar | Show orders in a calendar view | 10 |

    | Customer Map | Show orders in a map according to area | 13 |

    | Product Order Tree | Display categories and product orders in a tree | 19 |


    +   1. Login to APEX using http://localhost:8080/apex

    2. Click Application Builder Icon

    3. Click APEX Sample Application


    To creating reports, we will create the reports menu. This menu will be displayed
    to the right on all report pages. In order to achieve this task, we need to create
    Page zero. Page zero components are displayed on all pages if their region''s
    display point is contained within the selected page template. Conditional Display
    attributes can be used to suppress display. This is a very simple and effective
    way of sharing APEX objects throughout the application. In this exercise we will
    create Page Zero for our application to display the list, Report Tabs, created
    in chapter 2 section 2.5.2 (b). As mentioned above, Page zero components are shared
    across the application, therefore, we are going to put a condition to display
    the reports list only on pages related to the Reports tab.


