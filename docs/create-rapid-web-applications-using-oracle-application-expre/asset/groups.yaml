    # Chapter 2 – The Building Blocks


    # 2.5.3 Breadcrumbs


    Breadcrumbs provide hierarchical navigation to any number of levels. Breadcrumb
    entries are associated with pages and also identify a parent page. Here we will
    modify the default breadcrumb entry. Rest of the breadcrumb entries will be defined
    while creating individual application pages.


    +   1. Go to Shared Components, click Breadcrumbs under Navigation section

    2. Click Breadcrumb Icon

    3. Click Edit Breadcrumb Name button

    4. Enter Main Menu in Breadcrumb Name box, click Apply Changes

    5. Click the pencil icon to the left of Page1 to edit

    6. Enter Home in Short Name box, click Apply Changes


    # 2.5.4 Navigation Bar Entries


    A navigation bar is to link users to various pages within an application. Typically
    a navigation bar is used to enable users to log in, log out, or link to Help text.
    The location of a navigation bar depends upon the associated page template. A
    navigation bar icon enables you to display a link from an image or text. When
    you create a navigation bar icon you can specify an image name, text, display
    sequence, and target location (a URL or page).


    The navigation bar in our application will have Print, Feedback, and Logout links.
    Besides, it will show the currently logged in user. In this exercise we are going
    to create these links. Please note that the Logout entry was created automatically
    when we initially created the application.


    # 2.5.4 (a) Print Navigation Entry


    +   1. Go to Shared Components, Navigation Section – Navigation Bar Entries and
    click Create button

    2. Select From Scratch

    3. Click Navigation to URL

    4. Enter Print in Entry Label

    5. Enter &APP_PAGE_ID. (add the terminating period). In Page box, put a check
    on Printer Friendly

    6. Click the Create button'
