- md: "\n## Chapter 8 – Advanced Reporting\n\nThat's it. You have created a professional\
    \ looking report template in MS Word. It's easy, isn't it? In the next section,\
    \ we are going to integrate the template by uploading this layout to our APEX\
    \ application.\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_183_0.png)\n\n- 1.\
    \ Click the Shared Components icon\n2. Click Report Layouts under Reports\n3.\
    \ Click Create\n4. Select the option Named Columns (RTF) and click Next\n5. In\
    \ Layout Name enter Monthly, Review, click the Browse button and select the MS\
    \ Word template file Monthly_Review.txt that we created in the previous section.\n\
    6. Click the Create Layout button\n7. Click the Shared Components breadcrumb\n\
    8. Click the Report Queries link\n9. Click the Monthly Review icon\n10. In Report\
    \ Query Attributes, change Report Layout from Use Generic Layout to Monthly Review,\
    \ the layout we created in steps 2 through 6 above.\n11. Click Apply Changes\n\
    \nWe created the Report Layout in APEX by uploading the MS Word Template and linked\
    \ it to our Report Query. In the next section we will create a button on our Orders\
    \ page to run the Monthly Orders Review report.\n\nIn this section we will add\
    \ a button, named Print, and a branch to the Orders page to run the report.\n\n\
    - 1. Click Application 101 breadcrumb\n2. Open the Orders page (Page 4)\n3. Click\
    \ Create Buttons\n4. Select the option Orders (1) 5 in region selection, click\
    \ Next\n5. Select the option Create a button in a region position, click Next\n\
    6. Enter PRINT in Button Name and Monthly Review Report in Label, click Next\n\
    7. Right of Interactive Report Search Bar for Position and click Next\n8. Click\
    \ Create Button\n9. Create a new Branch\n10. Accept the default option in the\
    \ initial screen and click Next\n11. Select Page in this Application for Branch\
    \ Target, enter 29 in Page, PRINT_REPORT=Monthly Review in Request, click Next\n\
    12. Enter 5 in Sequence and select PRINT (Monthly Review Report) for When Button\
    \ Pressed\n13. Click Create Branch\n14. Click Application 101 breadcrumb and run\
    \ the application\n15. Click the Orders Tab. You will see the button Monthly Review\
    \ Report next to Enter New Order\n16. Click the button and open the report with\
    \ Adobe Acrobat which should look something like Figure 8-9 and Figure 8-10. I\
    \ formatted the layout using the standard MS Word tools, including header-footer,\
    \ tables, page number, font etc.\n\n## ABC CORPORATION\n\n35-A 3, ABC House, Raymond\
    \ Street off Mansfield Street.\nChicago IL, 63550, USA.\n\n## Orders Monthly Review\
    \ Report\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_185_0.png)\n\n## Order Month:\
    \ August 2011\n\n| 27-AUG-11 | Logan, Edward | MA | DEMO | 4 | 1,515.00 |\n| 15-AUG-11\
    \ | OHare, Edward | IL | DEMO | 4 | 1,060.00 |\n| 14-AUG-11 | Hardwick, William\
    \ | | | | | |\n\nAverage Order: 962.50\n\n## Order Month: July 2011\n\nAverage\
    \ Order: 870.00\n\n## Order Month: October 2011\n\nAverage Order: 140.00\n\n##\
    \ Order Month: September 2011\n\n| 25-SEP-11 | Bradlee, Elizabeth | T | DEMO |\
    \ 3 | 1,690.00 |\n| 20-SEP-11 | Cutler, John | VA | DEMO | 9 | 2,200.00 |\n| 14-SEP-11\
    \ | Crawford, William | GA | DEMO | 4 | 1,400.00 |\n| 09-SEP-11 | LaGuardia, Fiorello\
    \ | NY | DEMO | 5 | 1,090.00 |\n\nAverage Order: 1,470.00\n\n## ABC CORPORATION\n\
    \n35-A 3, ABC House, Raymond Street off Mansfieldfield Street.\nChicago-IL, 63500,\
    \ USA.\n\n## Table 1: Revenue By States\n\n| | | | | | |\n|---|---|---|---|---|\n\
    | Bradley, Eugen | 0.00 | 0.00 | 1,890.00 | 2,760.00 |\n| Hartsfield, William\
    \ | 490.00 | 0.00 | 0.00 | 1,400.00 | 1,890.00 |\n| Khan, Sanim | 0.00 | 0.00\
    \ | 50.00 | 50.00 |\n| Ahmed, Raz | 0.00 | 230.00 | 0.00 | 230.00 |\n| O'Hare,\
    \ Edward | 1,060.00 | 0.00 | 0.00 | 1,060.00 |\n| Logan, Edward | 2,300.00 | 0.00\
    \ | 0.00 | 2,300.00 |\n| Lambert, Albert | 0.00 | 0.00 | 0.00 | 770.00 | 770.00\
    \ |\n| LaGuardia, Fiorello | 0.00 | 0.00 | 0.00 | 1,090.00 | 1,090.00 |\n| Dulles,\
    \ John | 0.00 | 0.00 | 0.00 | 2,200.00 | 2,200.00 |\n| TOTAL | 3,850.00 | 870.00\
    \ | 280.00 | 7,350.00 | 8250.00 |\n\n## Chapter 8 – Advanced Reporting\n\nCongratulations!\
    \ You have successfully created a professional looking report that not only matches\
    \ the report of chapter 6 but also adds value to it by incorporating a pivot table\
    \ to display the same data. Add a new order through the application and see the\
    \ automatic reflection in the report.\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_187_0.png)\n\
    \nIn this exercise, you will generate invoice for the Orders. We are going to\
    \ use the same techniques as we did in the previous section. This time we will\
    \ utilize session state to pass master data from the Order form to the Invoice\
    \ report.\n\n### 8.10.1 Query for the Invoice\n\n1. Click Shared Components\n\
    2. Click Report Queries link\n3. Click Create\n4. Enter Invoice in Report Query\
    \ box, select PDF for Output Format, select Attachment for View As and check the\
    \ Session State. Click List of Values, select P29_CUSTOMER_ID and click Add to\
    \ add this field to the Items list. Using the same procedure, add fields from\
    \ Page 29 as shown in the following figure and proceed to the next page.\n\n###\
    \ 8.10.2 Create Rapid Applications Using Oracle\n\n- Report Query Name: Invoice\n\
    - Output Format: PDF\n- View File: Attachment\n- Session State: Include application\
    \ and session information\n- Select Items:\n    - P29_CUSTOMER_ID\n    - P29_ORDER_ID\n\
    \    - P29_ORDER_TIMESTAMP\n    - P29_ORDER_TOTAL\n\n5. In SQL query enter the\
    \ following statement and click Next:\n```sql\nselect oi.ORDER_ITEM_ID, pi.PRODUCT_NAME,\
    \ oi.UNIT_PRICE, oi.QUANTITY,\noi.Unit_Price * oi.Quantity as Amount, c.cust_first_name\
    \ || ' ' || c.cust_last_name as customer,\nc.cust_street_address1, c.cust_street_address2,\
    \ c.cust_city, c.cust_state, c.cust_postal_code,\nu.user_name\nfrom DEMO_ORDER_ITEMS\
    \ oi, DEMO_PRODUCT_INFO pi, DEMO_CUSTOMERS c,\nDEMO_USERS u\nwhere pi.PRODUCT_ID=oi.PRODUCT_ID\
    \ and order_id = :P29_ORDER_ID and\ncustomer_id :#P29_CUSTOMER_ID and user_id\
    \ :#P29_USER_ID\n```\n6. Select XML Data for Report Layout Source, click the Download\
    \ button and save the file Invoice.xml to your hard drive.\n7. Click Create Report\
    \ Query\n8. Test the output and click Finish\n\n### 8.10.3 Create Invoice Template\
    \ in MS Word\n\nYou have the option to create the template yourself or use one\
    \ from the templates provided in MS Word.\n\n1. Open MS Word\n2. Click New on\
    \ the main menu\n3. From the Templates pane select Invoices, select Sales Invoices\
    \ from the middle pane, select an invoice template and click the Download button.\
    \ The invoice template will appear in MS Word.\n4. Click the Add-Ins menu and\
    \ load XML data by selecting Invoice.xml file\n5. Click Insert, select Field,\
    \ drag P29_Order_Id and drop it in the box labeled INVOICE # Drop Order Timestamp,\
    \ User Name, Customer ID, Customer, Address1, Address2, City, State and Postal\
    \ Code fields to their respective boxes.\n6. Click Insert, Table Wizard, Table\
    \ and click Next\n7. For Data Set Document/Region/RowSet/Row option and click\
    \ Next\n8. Select fields Product Name, Quantity, Unit Price, and Amount and move\
    \ them to the right pane and click Finish\n9. Drop the field Order Total in the\
    \ summary section next to Total Amount\n10. Format the template and its fields\
    \ and save it as Invoice.rtf\n\n### 8.10.4 Upload the Template to APEX\n\n1. Go\
    \ to Shared Components\n2. Click Report Layout\n3. Click Create\n4. Select Named\
    \ Columns (RTF)\n5. Type Invoice in Layout Name\n6. Click the Browse button and\
    \ select Invoice.rtf\n7. Click the Shared Components breadcrumb\n8. Click Report\
    \ Queries\n9. Click the Invoice query\n10. Select Invoice for Report Layout\n\
    11. Click Apply Changes\n\n### 8.10.5 Call the Report from a Page\n\nIn this section\
    \ we will add a button, named Print Invoice, and a branch to the Order Detail\
    \ page to run the invoice.\n\n- 1. Click Application 101 breadcrumb\n2. Open the\
    \ Orders Details page (Page 29)\n3. Click Create under Buttons\n4. Select the\
    \ option Order#P29_ORDER_ID. (110) in region selection, click Next\n5. Select\
    \ the option Create a button in a region position, click Next\n6. Enter PRINT\
    \ in Button Name and Print Invoice in Label, click Next\n7. Select Region Template\
    \ Position #CREATE# for Position and click Next\n"
  mdcn: "\n\n## 第 8 章 – 高级报告\n\n就是这些了。你已经在 MS Word 中创建了一个看起来专业的报告模板。这很容易，不是吗？在下一节中，我们将通过将此布局上传到我们的\
    \ APEX 中整合模板。\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_183_0.png)\n\n- 1. 点击共享组件（Shared\
    \ Components）图标\n2. 点击报告（Reports）下的的报告布局（Report Layouts）\n3. 点击创建（Create）\n4.\
    \ 选择选项 Named Columns (RTF) 并点击下一步（Next）\n5. 在布局名称（Layout Name）中输入 Monthly Review，点击浏览（Browse）按钮并选择我们在上一节中创建的\
    \ MS Word 模板文件 Monthly_Review.txt\n6. 点击创建布局（Create Layout）按钮\n7. 点击共享组件面包屑\n\
    8. 点击报告查询（Report Queries）链接\n9. 点击 Monthly Review 图标\n10. 在报告查询属性（Report Query\
    \ Attributes）中，将报告布局（Report Layout）从使用通用布局（Use Generic Layout）更改为 Monthly Review，即我们在上述\
    \ 2 到 6 步中创建的布局\n11. 点击应用更改（Apply Changes）\n\n我们通过上传 MS Word 模板在 APEX 中创建了报告布局，并将其链接到我们的报告查询。在下一节中，我们将在\
    \ Orders 页面上创建一个按钮来运行每月订单审查报告（Monthly Orders Review）。\n\n在本节中，我们将添加一个名为 Print\
    \ 的按钮以及指向 Orders 页面的分支（branch）来运行报告。\n\n- 1. 点击应用程序 101 面包屑\n2. 打开 Orders 页面（第\
    \ 4 页）\n3. 点击创建按钮（Create Buttons）\n4. 在区域选择中选择选项 Orders (1)5，点击下一步\n5. 选择选项在区域位置创建按钮，点击下一步\n\
    6. 在按钮名称（Button Name）中输入 PRINT，在标签（Label）中输入 Monthly Review Report，点击下一步\n7. 在交互式报告搜索栏右侧选择位置（Position）并点击下一步\n\
    8. 点击创建按钮（Create Button）\n9. 创建新分支（Branch）\n10. 在初始屏幕上接受默认选项并点击下一步\n11. 在分支目标（Branch\
    \ Target）中选择此应用程序中的页面，在页面（Page）中输入 29，在请求（Request）中输入 PRINT_REPORT=Monthly Review，点击下一步\n\
    12. 在序列（Sequence）中输入 5，并在按下按钮时（When Button Pressed）选择 PRINT (Monthly Review Report)\n\
    13. 点击创建分支（Create Branch）\n14. 点击应用程序 101 面包屑并运行应用程序\n15. 点击 Orders 标签。你会在 Enter\
    \ New Order 旁边看到 Monthly Review Report 按钮\n16. 点击按钮使用 Adobe Acrobat 打开报告，它看起来类似于图\
    \ 8-9 和图 8-10。我使用标准的 MS Word 工具格式化了布局，包括页眉页脚、表格、页码、字体等。\n\n## ABC CORPORATION\n\
    \n35-A 3, ABC House, Raymond Street off Mansfield Street.\nChicago IL, 63550,\
    \ USA.\n\n## 订单每月审查报告\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_185_0.png)\n\
