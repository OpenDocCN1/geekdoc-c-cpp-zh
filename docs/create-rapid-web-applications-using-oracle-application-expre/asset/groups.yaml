    # Create Rapid Web Application Using Oracle Application Express


    The format of this book is to teach you about Oracle APEX by iteratively developing
    the sample sales application from scratch with Oracle Application Express. Each
    chapter explores a basic area of functionality and the development techniques
    you will need to achieve that functionality.


    This application is fully functional and scalable and has been chosen as an example
    because you can learn most of the techniques you will need for your future work.
    The primary purpose of this book is to teach you how to use Oracle Application
    Express to realize your own development goals. By the time you reach the end of
    the examples in this book, you will have a clear understanding of Oracle Application
    Express and will be able to extend the application in almost any manner.


    In this chapter we are going to create the building blocks through the Shared
    Components interface. But before that, I would like to brief you a little about
    what we''re going to create.


    The application we will be creating in this book, features an easy-to-use interface
    for adding, updating, deleting and viewing order and related products and customers
    information. Users can navigate among the pages using the Home, Customers, Products,
    Orders, and Reports tabs. When you log into the application using demo for User
    Name and the name of the workspace in lower case - asa in our scenario (short
    for Apex Sample Application), the following home page appears as shown in Figure
    2-1.'
