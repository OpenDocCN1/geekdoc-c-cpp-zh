- md: '

    # Chapter 10 – Deploy and Access APEX Application


    Perform the following steps to get the IP addresses of the server computer. In
    this scenario we will be using 10.1.1.12 for the LAN and 255.255.204.231 for the
    internet.


    - 1. Right-click the LAN connection in the task bar and click Open Network Connections


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_219_0.png)


    - 2. Right-click the Local Area Network connection and click Properties

    - 3. Select Internet Protocol (TCP/IP) in the list and click the Properties button

    - 4. Note down the IP address

    - 5. Repeat the same process and write down the external IP address for the network


    ## 10.11.1 Connect the application in Local Area Network


    From a client computer in your LAN:


    - 1. Open a browser session and type http://10.1.1.12:8080/apex/f?p=117 (replace
    117 with your application ID)

    - 2. Type demo, demo for the Username and Password respectively


    You may get an error message at this stage as in Figure 10-5, indicating your
    computer or network is protected by a firewall. If so, you need to create an exception
    in the Windows Firewall to accept incoming connection on the APEX port that is
    8080 in our scenario.


    > The connection has timed out

    > The server at 10.1.1.12 is taking too long to respond.


    - The site could be temporarily unavailable or too busy. Try again in a few moments.

    - If you are unable to load any pages, check your computer''s network connection.

    - If your computer or network is protected by a firewall or proxy, make sure Firefox
    is permitted to access the Web.


    Try Again


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_219_1.png)


    Figure 10-5


    ## Create Rapid Web Applications Using Oracle Application Express


    - 1. In Windows, click on Start, on Control Panel, and double click Windows Firewall
    icon

    - 2. Click on the Exceptions tab

    - 3. Click the Add Port button

    - 4. TYPE APEX Port in Name, 8080 in Number, select TCP, and click OK

    - 5. Click OK to close the Windows Firewall dialog box


    APEX Port exception is added to the Program and Services section which will now
    allow you to access the application.


    While working under Oracle XE 10g, I had to issue the command:EXEC DBMS:XDB.SETLISTENERLOCALACCESSFALSE
    to remotely access the application. Here in 11g I didn''t do that.


    ## 10.11.2 Connect the application through the internet


    Perform the following steps on a computer NOT connected to your LAN:


    - 1. Open a browser session and type http://255.256.204.231:8080/apex/f?p=117
    (replace 117 with your application ID)

    - 2. Type demo, demo for the Username and Password respectively


    ## 10.11.3 Dealing with Firewalls


    If your application server is behind a firewall such as ISA, you will have to
    create a protocol for APEX port 8080 and an allow rule to grant remote access
    to the APEX application. Follow the instructions to create the rule:


    - 1. Open ISA Server Management

    - 2. On the right side, click Toolbox > Protocols and then User-Defined

    - 3. With User-Defined selected, click New > Protocol

    - 4. In Protocol definition name type APEX PROTOCOL and click Next

    - 5. Select TCP for Protocol type, Outbound for Direction and enter 8080 in From
    and To Boxes

    - 6. Click OK

    - 7. Click Next

    - 8. Accept the default value No for Do you want to use secondary connections

    - 9. Click Next and then the Finish button

    - 10. On the left side, right-click Firewall Policy and select New > Access Rule

    - 11. In Access rule name type APEX ALLOW RULE and click Next

    - 12. Select Allow and click Next

    - 13. Set this rules applies to: Selected protocols, click the Add button, expand
    the User-Defined node and select APEX PROTOCOL, click Next

    - 14. Click the Add button in Access Route Sources, open the Networks node, select
    External and click Next

    - 15. Click the Add button in Access Route Destinations, open the Networks node,
    select Local Host and click Next

    - 16. Click Next to accept All Users

    - 17. Click Finish


    If you followed the instructions correctly, you will definitely access the application
    internally as well as remotely. This chapter taught you the implementation process
    of your application. You saw how easy it was to take the application from your
    development PC to the production environment. Besides application access scenario,
    we also resolved the firewall issues that might prevent you from accessing the
    application.


    I hope this book has provided you a solid foundation of Oracle Application Express
    and set a firm ground to develop robust application systems to fulfill the information
    requirements of your organization. The sky is the limit, you are limited by your
    imagination. Be creative, and put the power of APEX to your work. Good luck.


    # ABOUT THE AUTHOR


    Riaz Ahmed is an IT professional with over twenty years of hard-earned experience.
    He started his career as a programmer in early 90s and is currently working as
    the head of IT with a reputed group of companies. He has been working in Oracle
    technologies since 1996. Besides database, his areas of interest are web-based
    development technologies including APEX, Business Intelligence, and OBIEE. He
    is also the author of Oracle Business Intelligence (Volume 1) a unique practical
    book. You can reach him at realtech@cyber.net.

