    \ State Protection（会话保护）设置为 Disabled（禁用）\n- 6. 点击 Apply Changes（应用更改）按钮\n\n##\
    \ 2.5.8 列表值 (LOV)\n\n列表值（List of values）用于控制显示的值并限制用户的选择。列表值可以是静态的（基于你输入的值），也可以是动态的（基于\
    \ SQL 查询）。在本次练习中我们将创建两种类型的 LOV。\n\n## 2.5.8 (a) Categories LOV\n\n- 1. 在 Shared\
    \ Components（共享组件）中，点击 User Interface（用户界面）部分下的 Lists of Values（列表值）\n- 2. 点击\
    \ Create（创建）按钮\n- 3. 选择 From Scratch（从开始）并点击 Next（下一步）\n- 4. 在 Name 框中输入 Categories（类别）\n\
    - 5. 类型选择 Static（静态），点击 Next（下一步）\n- 6. 如下所示填写值并点击 Create List of Values（创建列表值）按钮\n\
    \n# 使用 Oracle Application Express 快速创建 Web \n\n取消 < 上一个 创建列表值\n\n列表值名称: CATEGORIES\n\
    \n| 序号 (Sequence) | 显示值 (Display Value) | 返回值 (Return Value) |\n|---|---|---|\n\
    | 1 | Mens | Mens |\n| 2 | Womens | Womens |\n| 3 | Accessories | Accessories\
    \ |\n\n## 2.5.8 (b) Products LOV\n\n- 1. 在 Lists of Values（列表值）中点击 Create（创建）按钮\n\
    - 2. 选择 From Scratch（从开始）并点击 Next（下一步）\n- 3. 在 Name 框中输入 Products（产品）\n- 4. 类型选择\
    \ Dynamic（动态），点击 Next（下一步）\n- 5. 在 Query 框中输入 `select name d from demo_products`\n\
    - 6. 点击 Create List of Values（创建列表值）按钮\n\n## 2.5.8 (c) With Price LOV\n\n- 1.\
    \ 在 Lists of Values（列表值）中点击 Create（创建）按钮\n- 2. 选择 From Scratch（从开始）并点击 Next（下一步）\n\
    - 3. 在 Name 框中输入 With Price（带价格的）\n- 4. 类型选择 Dynamic（动态），点击 Next（下一步）\n- 5. 在\
    \ Query 框中输入：\n```sql\nselect htf.escape(product_name) || ' ' || '$' || price\
    \ || ')' d, product_id r from demo_products\nby 1\n```\n- 6. 点击 Create List of\
    \ Values（创建列表值）按钮\n\n# 第2章 – 构建模块\n\n## 2.5.8 (d) States LOV\n\n- 1. 在 Lists of\
    \ Values（列表值）中点击 Create（创建）按钮\n- 2. 选择 From Scratch（从开始）并点击 Next（下一步）\n- 3. 在\
    \ Name 框中输入 States（状态）\n- 4. 类型选择 Dynamic（动态），点击 Next（下一步）\n- 5. 在 Query 框中输入：\n\
    ```sql\nselect initcap(state_name) display_value, st return_value from demo_states\
    \ order 1\n```\n- 6. 点击 Create List of Values（创建列表值）按钮\n\n## 2.5.8 (e) Y or N\
    \ LOV\n\n- 1. 在 Lists of Values（列表值）中点击 Create（创建）按钮\n- 2. 选择 From Scratch（从开始）并点击\
    \ Next（下一步）\n- 3. 在 Name 框中输入 Y or N\n- 4. 类型选择 Static（静态），点击 Next（下一步）\n- 5.\
    \ 如下所示填写值并点击 Create List of Values（创建列表值）按钮\n\n![](img/5bf6e7eb17c41dae7073300850.png)\n\
    \n## 2.5.9 Shortcuts（快捷方式）\n\n在需要的地方频繁使用。在本节中我们将创建快捷方式来完成常用任务。快捷是一个执行特定操作或导航到页面的链接。例如，我们可以创建一个删除页面的快捷方式。\n\
    \n```sql\nvar htmltdb_message=\"CONFIRM\";\n```\n\n# Delete Message（删除消息）\n\n\
    - 1. 在 Shared Components（共享组件）中点击 User Interface（用户界面）下的 Shortcuts\n- 2. 点击 Create（创建）按钮\n\
    - 3. 选择 From Scratch 并点击 Next（下一步）\n- 4. 在 Name 框中输入 Delete_Msg\n- 5. 选择 Static（静态）\n\
    - 6. 在 URL 框中输入 `f?p=&APP_ID:4&SESSION=:SESSION.`\n- 7. 在 Label 框中输入 Delete\n\
    - 8. 点击 Create（创建）按钮\n\n# Add Images（添加图像）\n\n- 1. 在 Shared Components（共享组件）中点击\
    \ Security（安全）下的 Images\n- 2. 点击 Show（显示）按钮\n- 3. 选择 Select From 并点击\n-- .. 在\
    \ Name 框中输入 Images\n- 5. 上传文件\n- 6. 点击 Create（创建）按钮\n\n# Global Attributes（全局属性）\n\
    \n- 1. 在 Shared Components（共享组件）中点击 Security（安全）下的 Global Attributes\n- 2. 点击\
    \ Create（创建）按钮\n- 3. 选择 From Scratch 并点击 Next（下一步）\n- 4. 在 Name 框中输入 Global_Attributes\n\
    - 5. 选择 Static（静态）类型\n- 6. 点击 Create（创建）按钮\n\n"
