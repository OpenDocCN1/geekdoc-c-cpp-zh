- md: "\n# Create Rapid Web Applications Using Oracle Application Express\n\nTo avoid\
    \ version conflicts, we will download BI Publisher Desktop from our BI Publisher\
    \ Server. Perform the following steps after installing MS Word 2000 or later on\
    \ your client machine.\n\n- 1. On Windows XP client type `http://10.10.1.5:9704/xmlserver`\
    \ in a new browser session\n- 2. Enter **Administrator** and **Administrator**\
    \ for the username and password, click **Sign In**\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_0.png)\n\
    \nFigure 8-1 link\n\n- 3. Click the **MY Folders** Builder download link\n- 4.\
    \ Click the **Template Builder** under Developer Tools section\n- 5. Click the\
    \ **Save File** button to save **BIPublisherDesktop.exe**\n- 6. Switch to the\
    \ download location and **launch the .exe** file\n- 7. Select your language and\
    \ accept the default installation path\n- 8. Once the installation completes,\
    \ **Invoke MS Word**\n- 9. Click the **Add-Ins** menu. If you are using Word 2007,\
    \ the BI Publisher plug-in should look like Figure 8-2\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_1.png)\n\
    \nFigure 8-2\n\n# Chapter 8 - Advanced Reporting\n\nIn Chapter 6 section 6.3.4,\
    \ we created an on-screen alternative report named Monthly Review to see details\
    \ of monthly orders. In this exercise we will create a PDF version of that report.\
    \ We assume that Oracle BI Publisher is up and running on your host (in our example\
    \ it is 10.10.1.5). Log in to APEX workspace ASA and open the APEX Sample Application.\n\
    \n## 8.7.1 Create the Report Query\n\n- 1. Click the Shared Components icon\n\
    - 2. Click Report Queries link under the Reports Section\n- 3. Click Create\n\
    - 4. Type Monthly Review in Report Query Name, set Output Format to PDF, View\
    \ File As to Attachment, and click Next\n- 5. Enter the following statement in\
    \ SQL Query and click Next:\n\n```sql\nselect\n  o.order_id,\n  to_char(o.order_timestamp,'Month\
    \ yyyy') order_month,\n  o.order_timestamp order_date,\n  c.cust_last_name ||'\
    \ ' || c.cust_first customer_name, c.cust_state,\n  u.user_name sales_rep,\n \
    \ (select count(*) from demo_order_items oi where oi.order_id =o.order_id) order_items,\n\
    \  o.order_total\nfrom\ndemo_orders o,\ndemo_customers c,\ndemo_users u\nwhere\n\
    \  o.customer_id = c.customer_id\n  and o.user_id = u.user_id\n```\n\n- 6. Select\
    \ XML Data for Source: Report Layout, click the Download button, select Save File,\
    \ and click OK. A file named Monthly.Review.xml will be saved to your disk.\n\
    - 7. Click the Report Query button\n- 8. Click Test Report. If the BI Publisher\
    \ server is down, you will see the error ORA-29273: HTTP request failed O-06512:\
    \ \"SYS.UTL_HTTP\", line 124 ORA-12570: TNS:packet reader failure. Start the server\
    \ and try again. In the popup dialog box, select Open with Adobe Acrobat and click\
    \ OK. A generic PDF output similar to Figure 8-3 appears. Click Finish.\n\n# Create\
    \ Web Applications Using Oracle Application Express\n\n| ORDER ID | ORDER MONTH\
    \ | ORDER DATE | CUSTOMER NAME | CUST STATE | SALES REP | ORDER ITEMS | ORDER\
    \ TOTAL |\n|---|---|---|---|---|---|---|---|\n| 1 | October | 10/17/2011 | John\
    \ Doe | VA | James | 10 | 2350 |\n| 2 | August | 08/21/2011 | Jane White | IL\
    \ | Sarah | 6 | 1640 |\n| 3 | September | 09/23/2011 | Harriet Wilson | WA | James\
    \ | 4 | 850 |\n| 4 | September | 09/25/2011 | Logan Edward | MI | Sarah | 6 |\
    \ 700 |\n| 5 | September | 09/15/2011 | Logan Edward | IL | James | 12 | 950 |\n\
    | 6 | November | 11/02/2011 | Lucillaia Porto | NY | Sarah | 14 | 1100 |\n| 7\
    \ | October | 10/24/2011 | Leonardo Perez | CA | James | 8 | 1500 |\n| 8 | September\
    \ | 09/28/2011 | Lambert Albert | MO | Sarah | 5 | 500 |\n| 9 | August | 08/17/2011\
    \ | Bradley, Eagan | CT | James | 5 | 900 |\n\nFigure 8-3\n\n## 8.7.2 Create Report\
    \ Template in MS Word\n\n- 1. Start Microsoft Word\n- 2. Click Add-Ins on the\
    \ menu bar\n- 3. Click Data beside Oracle Publisher and then Load Data\n- 4. Open\
    \ Monthly Review.xml file that we created in previous section. Data Loaded message\
    \ is displayed.\n- 5. Click Insert and then Table\n- 6. Select Table in Report\
    \ Format and click Next\n- 7. Click Next to accept Group Row for Data\n- 8. Select\
    \ all fields by moving them to the right using double arrow button and click Next\n\
    - 9. Select Order Month in the first drop down list under Group By and click Next\n\
    - 10. Select Order ID for sorting data, click Next\n- 11. Change Cust label to\
    \ State\n- 12. Click Finish. An output similar to Figure 8-4 will be displayed.\n\
    \n![](img/5bf6e7eb17c41dae70753fc9049e3008_178_0.png)\n\nFigure 8-4\n\n- 13. Save\
    \ the template, edit Monthly Review name.\n- 14. Click Preview and select PDF.\
    \ The output shown in Figure 8-5 is displayed.\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_179_0.png)\n\
    \nFigure 8-5\n\n- 15. Close the PDF and switch back to MS Word.\n\n## 8.7.3 Format\
    \ Report\n\n- 1. Place the cursor in front of ORDER MONTH and type Order Month:\
    \ as label. Use MS Word tools to change font, color and size. Drag the column\
    \ width to set the desired size.\n- 2. Click the ORDER TOTAL field and right-align\
    \ it. Double click it to call its properties. Select Number for Type and .00 for\
    \ Format and click OK.\n- 3. Insert a blank line above Group by Order Month to\
    \ add report title. Type Monthly Orders Report. You can also add page number using\
    \ Header and Footer options.\n\n## 8.7.4 Conditional Formatting\n\nIn these steps\
    \ we are going to change font and background color of orders for which the amount\
    \ is less or equal to 900 as we did in the on-screen report.\n\n- 1. Click the\
    \ Order Total field to select it\n- 2. Click the Add-Ins menu\n- 3. Click Insert\
    \ and select Conditional Format\n- 4. Select ORDER TOTAL for Data field, select\
    \ Number in the adjacent list, put a check on Apply to Entire Row, select less\
    \ than or equal to 900 in the box next to the Data field, click the Format button,\
    \ click Background Color, choose different Font and Background colors and click\
    \ OK\n- 5. Preview your work and see the application of conditional formatting\
    \ to all the rows having Order Total less than or equal to 900.\n- 6. Use the\
    \ same procedure to change font and background color for orders greater than 2000.\
    \ Select Greater for the condition and enter 2000 in the value. After completion,\
    \ preview the report to check your work.\n\n## 8.7.5 Summary Calculation\n\nIn\
    \ this section we add a summary to reveal average orders for the month.\n\n- 1.\
    \ Place your cursor on the line above ORDER_MONTH text\n- 2. Click the Insert\
    \ under Add-Ins and select Field\n- 3. In the Field dialog box, select the Order\
    \ Total field, select average for Calculation, put a check mark on Grouping and\
    \ click the Insert button. A summary field, average ORDER_TOTAL will be added\n\
    - 4. Add label Monthly Average: and align it to the right under the Order Total\
    \ field\n\n## 8.7.6 Add a Summary Chart\n\n- 1. Insert a blank row above Group\
    \ BY ORDER_MONTH\n- 2. Click Insert and select Chart under the Add-Ins menu\n\
    - 3. From the data tree, drag field ORDER_TOTAL to the Values box, set Aggregation\
    \ to Sum, drag ORDER_MONTH to Labels, put a check on Group Data, select Bar Graph\
    \ - Horizontal for Type for Style and click OK. The completed screen should look\
    \ like Figure 8-6.\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_181_0.png)\n\n\
    - 4. Right click the chart in MS Word and select Insert Caption. Type Monthly\
    \ Orders Chart in Caption.\n\n## 8.7.7 Add a Pivot Table\n\n- 1. In MS Word click\
    \ the line after Group by ORDER_MONTH\n- 2. Click Insert and select Pivot Table\
    \ under the Add-Ins menu\n- 3. Drag fields CUST STATE, CUSTOMER NAME, ORDER_MONTH,\
    \ and ORDER TOTAL to the layout section as shown in Figure 8-7, click Preview\
    \ and then the OK button to save the table.\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_182_0.png)\n\
    \nFigure 8-7\n\nPreview your work after formatting the table so that it matches\
    \ the output shown in Figure 8-8\n\n| Table 1: Revenue By States | | | | |\n|\
    \ Customer | August | October | September | |\n| --- | --- | --- | --- | --- |\n\
    | Bradley, Eugene | 870.00 | 1,890.00 | 0.00 | 2,760.00 |\n| Hartsfield, William\
    \ | 730.00 | 1,640.00 | 0.00 | 2,370.00 |\n| OHare, Edward: \"Butch\" | 0.00 |\
    \ 0.00 | 1,060.00 | 1,060.00 |\n| Logan, Edward | 0.00 | 0.00 | 2,420.00 | 2,420.00\
    \ |\n| Lambert, Albert | 0.00 | 0.00 | 950.00 | 950.00 |\n| LaGuartia, Fiore |\
    \ 0.00 | 1,060.00 | 0.00 | 1,060.00 |\n| Dullies, John | 0.00 | 2,380.00 | 0.00\
    \ | 2,380.00 |\n| TOTAL | 1,600.00 | 7,000.00 | 4,430.00 | 13,030.00 |\n\nFigure\
    \ 8-8\n"
  mdcn: "\n\n# 使用 Oracle Application Express 创建快速 Web 应用\n\n为了避免版本冲突，我们将从 BI Publisher\
    \ 服务器下载 BI Publisher Desktop。在客户端机器上安装 MS Word 2000 或更高版本后，请执行以下步骤。\n\n- 1. 在\
    \ Windows XP 客户端，在新的浏览器会话中输入 `http://10.10.1.5:9704/xmlserver`\n- 2. 用户名和密码分别输入\
    \ **Administrator** 和 **Administrator**，点击 **Sign In**（登录）\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_0.png)\n\
    \n图 8-1 链接\n\n- 3. 点击 **MY Folders**（我的文件夹）Builder 下载链接\n- 4. 点击 Developer Tools（开发工具）部分下的\
    \ **Template Builder**（模板生成器）\n- 5. 点击 **Save File**（保存文件）按钮保存 **BIPublisherDesktop.exe**\n\
    - 6. 切换到下载位置并**启动 .exe 文件**\n- 7. 选择您的语言并接受默认安装路径\n- 8. 一旦安装完成，**调用 MS Word**（Invoke\
    \ MS Word）\n- 9. 点击 **Add-Ins**（加载项）菜单。如果您使用的是 Word 2007，BI Publisher 插件应如图 8-2\
    \ 所示\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_1.png)\n\n图 8-2\n\n# 第 8\
    \ 章 - 高级报告\n\n在第 6 章第 6.3.4 节中，我们创建了一个名为 Monthly Review 的屏幕替代报告，以查看每月订单详情。在本练习中，我们将创建该报告的\
    \ PDF 版本。假设 Oracle BI Publisher 已在您的主机上运行（在我们的示例中为 10.10.1.5）。登录 APEX 工作区 ASA\
    \ 并打开 APEX Sample。\n\n## 8.7.1 创建报告查询\n\n- 1. 点击 Shared Components（共享组件）图标\n-\
    \ 2. 点击 Reports（报告）部分下的 Report Queries（报告查询）链接\n- 3. 点击 Create（创建）\n- 4. 在 Report\
    \ Query Name（报告查询名称）中输入 Monthly Review，将 Output Format（输出格式）设置为 PDF，将 View File\
    \ As（查看文件）设置为 Attachment（附件），点击 Next（下一步）\n- 5. 在 SQL Query（SQL 查询）中输入以下语句并点击\
    \ Next（下一步）：\n\n```sql\nselect\n  o.order_id,\n  to_char(o.order_timestamp,'Month\
    \ yyyy') order_month,\n  o.order_timestamp order_date,\n  c.cust_last_name ||'\
    \ ' || c.cust_first customer_name, c.cust_state,\n  u.user_name sales_rep,\n \
    \ (select count(*) from demo_order_items oi where oi.order_id =o.order_id) order_items,\n\
    \  o.order_total\nfrom\ndemo_orders o,\ndemo_customers c,\ndemo_users u\nwhere\n\
    \  o.customer_id = c.customer_id\n  and o.user_id = u.user_id\n```\n\n- 6. 选择\
    \ XML Data 源为 Report Layout（报告布局），点击 Download（下载）按钮，选择 Save File（保存文件）并点击 OK。一个名为\
    \ Monthly.Review.xml 的文件将保存到磁盘。\n- 7. 点击 Report Query（报告查询）按钮\n- 8. 点击 Test Report（测试报告）。如果\
    \ BI Publisher 服务器关闭，您将看到错误 ORA-29273: HTTP request failed O-06512: \"SYS.UTL_HTTP\"\
    , line 124 ORA-12570: TNS:packet reader failure。启动服务器并重试。在弹出对话框中，选择 Open with\
    \ Adobe Acrobat（用 Adobe Acrobat 打开）并点击 OK。出现类似于图 8-3 的通用 PDF 输出。点击 Finish（完成）。\n\
    \n# 使用 Oracle Application Express 创建 Web 应用\n\n| 订单 ID | 订单月份 | 订单日期 | 客户名称 |\
    \ 州 | 销售代表 | 订单项目 | 订单总额 |\n|---|---|---|---|---|---|---|---|\n| 1 | 10月 | 2011/10/17\
    \ | John Doe | VA | James | 10 | 2350 |\n| 2 | 8月 | 2011/08/21 | Jane White |\
    \ IL | Sarah | 6 | 1640 |\n| 3 | 9月 | 2011/09/23 | Harriet Wilson | WA | James\
    \ | 4 | 850 |\n| 4 | 9月 | 2011/09/25 | Logan Edward | MI | Sarah | 6 | 700 |\n\
    | 5 | 9月 | 2011/09/15 | Logan Edward | IL | James | 12 | 950 |\n| 6 | 11月 | 2011/11/02\
    \ | Lucillaia Porto | NY | Sarah | 14 | 1100 |\n| 7 | 10月 | 2011/10/24 | Leonardo\
    \ Perez | CA | James | 8 | 1500 |\n| 8 | 9月 | 2011/09/28 | Lambert Albert | MO\
    \ | Sarah | 5 | 500 |\n| 9 | 8月 | 2011/08/17 | Bradley, Eagan | CT | James | 5\
    \ | 900 |\n\n图 8-3\n\n## 8.7.2 在 MS Word 中创建报告模板\n\n- 1.  Microsoft Word\n- 2.\
    \ 点击菜单栏上的 Add-Ins（加载项）\n- 3. 点击 Oracle Publisher 旁边的 Data（数据）然后 Load Data（加载数据）\n\
    - 4. 打开上一节创建的 Monthly Review.xml 文件。显示 Data Loaded 信息。\n- 5. 点击 Insert（插入）然后 Table（表格）\n\
    - 6. 在 Report Format（报告格式）中选择 Table（表格）并点击 Next（下一步）\n- 7. 点击 Next（下一步）接受 Group\
    \ Row（行分组）\n- 8. 使用双箭头移动所有字段\n- 9. 在 Group By（分组）下拉列表中选择 Order Month（订单月份），点击\
    \ Next（下一步）\n- 10. 选择 Order ID（订单 ID）进行排序，点击 Next（下一步）\n- 11. 将 Cust 标签更改为 State（州）\n\
    - 12. 点击 Finish（完成）。将显示类似于图 8-4 的输出。\n![](img/5bf6e7eb17c41dae70753fc9049e3008_178_0.png)\n\
    \n图 8-4\n\n- 13. 保存模板为 Monthly Review。\n- 14. 点击 Preview（预览）并选择 PDF。显示图 8-5 中的输出。\n\
    ![](img/5bf6e7eb17c41dae70753fc9049e3008_179_0.png)\n\n图 8-5\n\n- 15. 关闭 PDF 返回\
    \ MS Word。\n\n## 8.7.3 格式化报告\n\n- 1. 在 ORDER MONTH 前输入 Order Month（月份：）。使用 MS\
    \ Word 工具更改字体、颜色和大小。拖动列宽设置所需大小。\n- 2. 点击 ORDER TOTAL（订单总额）字段并右对齐。双击它调用属性。在 Type（类型）中选择\
    \ .00 并点击 OK。\n- 3. 在 Group by Order Month（按月份分组）上方插入空行添加报告标题。可以使用 Header and\
    \ Footer（页眉页脚）选项添加页码。\n\n## 8.7.4 条件格式\n\n在这些步骤中，我们将更改金额小于或等于 900 的订单字体和背景颜色，就像在屏幕报告中所做的那样。\n\
    \n- 1. 点击 Order Total（订单总额）字段选中它\n- 2. 点击 Add-Ins（加载项）菜单\n- 3. 点击 Insert（插入）并选择\
    \ Conditional Format（条件格式）\n- 4. 选择 ORDER TOTAL 数据，在列表中选择 Number（数字），勾选 Apply\
    \ to Entire Row（应用到整行），在 Data 旁边的框中选择 less than or equal to 900，点击 Format（格式）按钮，选择不同的字体背景颜色并点击\
    \ OK\n- 5. 预览您的工作，查看 Order Total 小于或等于 900 的行的格式应用。\n- 6. 使用相同程序更改大于 2000 的订单字体和背景颜色。条件选择\
    \ Greater（大于），在值中输入 2000。完成后，预览报告检查您的工作。\n\n## 8.7.5 汇总计算\n\n在本节中，我们添加汇总以显示每月平均订单。\n\
    \n- 1. 将光标放在 ORDER_MONTH 文字上方\n- 2. 点击 Add-Ins（加载项）下的 Insert（插入）并选择 Field（字段）\n\
    - 3. 在 Field 对话框中选择 Order Total 字段，选择 average（平均），勾选 Grouping（分组）并点击 Insert（插入）。将添加平均\
    \ ORDER_TOTAL 汇总字段\n- 4. 在 Order Total 字段下方右对齐标签 Monthly Average：\n\n## 8.7.6\
    \ 添加汇总图\n\n- 1. 在 Group BY ORDER_MONTH 上方插入空行\n- 2. 点击 Add-Ins 菜单下的 Chart（图表）\n\
    - 3. 从数据树将 ORDER_TOTAL 字段拖到 Values（值）框，设置 Aggregation（聚合）为 Sum（和），将 ORDER_MONTH\
    \ 拖到 Labels（标签），勾选 Group Data（分组数据），样式中选择 Bar Graph - Horizontal（水平条形图），点击 OK。完成后的屏幕应该像图\
    \ 8-6。\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_181_0.png)\n\n- 4. 在 MS Word\
    \ 中右键点击图表并选择 Insert Caption（插入题）。在标题中输入 Monthly Orders Chart（订单图）。\n\n## 8.7.7\
    \ 添加透视表\n\n- 1. 在 MS Word 中点击 Group by ORDER_MONTH 后行\n- 2. 点击 Add-Ins 菜单下的 Pivot\
