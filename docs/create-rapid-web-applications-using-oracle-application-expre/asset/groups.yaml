  - "[PAGE 176]\n\n# Create Rapid Web Applications Using Oracle Application Express\n\
    \nTo avoid version conflicts, we will download BI Publisher Desktop from our BI\
    \ Publisher Server. Perform the following steps after installing MS Word 2000\
    \ or later on your client machine. \n\n+   1. On Windows XP client type `http://10.10.1.5:9704/xmlserver`\
    \ in a new browser session\n2. Enter **Administrator** and **Administrator** for\
    \ the username and password, click **Sign In**\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_0.png)\n\
    \nFigure 8-1 link\n\n+   3. Click the **MY Folders** Builder download link\n4.\
    \ Click the **Template Builder** under Developer Tools section\n5. Click the **Save\
    \ File** button to save **BIPublisherDesktop.exe**\n6. Switch to the download\
    \ location and **launch the the .exe** file\n7. Select your language and accept\
    \ the default installation path\n8. Once the installation completes, **Invoke\
    \ MS Word**\n9. Click the **Add-Ins** menu. If you are using Word 2007, the BI\
    \ Publisher plug-in should look like Figure 8-2\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_176_1.png)\n\
    \nFigure 8-2"
  - "[PAGE 177]\n\n# Chapter 8 - Advanced Reporting\n\nIn Chapter 6 section 6.3.4,\
    \ we created an on-screen alternative report named Monthly Review to see details\
    \ of monthly orders. In this exercise we will create a PDF version of that report.\
    \ We assume that Oracle BI Publisher is up and running on your host (in our example\
    \ it is 10.10.1.5). Log in to APEX workspace ASA and open the APEX Sample Application.\n\
    \n# 8.7.1 Create the Report Query\n\n+   1. Click the Shared Components icon\n\
    2. Click Report Queries link under the Reports Section\n3. Click Create\n4. Type\
    \ Monthly Review in Report Query Name, set Output Format to PDF, View File As\
    \ to Attachment, and click Next\n5. Enter the following statement in SQL Query\
    \ and click Next:\n\n```\nselect\n  o.order_id,\n  to_char(o.order_timestamp,'Month\
    \ yyyy') order_month,\n  o.order_timestamp order_date,\n  c.cust_last_name ||'\
    \ ' || c.cust_first customer_name, c.cust_state,\n  u.user_name sales_rep,\n \
    \ (select count(*) from demo_order_items oi where oi.order_id =o.order_id) order_items,\n\
    \  o.order_total\nfrom\ndemo_orders o,\ndemo_customers c,\ndemo_users u\nwhere\n\
    \  o.customer_id = c.customer_id\n  and o.user_id = u.user_id\n```\n\n+   6. Select\
    \ XML Data for Source: Report Layout, click the Download button, select Save File,\
    \ and click OK. A file named Monthly.Review.xml will be saved to your disk.\n\
    7. Click the Report Query button\n8. Click Test Report. If the BI Publisher server\
    \ is down, you will see the error ORA-29273: HTTP request failed O-06512: \"SYS.UTL_HTTP\"\
    , line 124 ORA-12570: TNS:packet reader failure. Start the server and try again.\
    \ In the popup dialog box, select Open with Adobe Acrobat and click OK. A generic\
    \ PDF output similar to Figure 8-3 appears. Click Finish.\n\n162"
