  mdcn: "\n\n# 第 10 章 部署和访问 APEX \n\n执行以下步骤获取服务器计算机的 IP 地址。在此场景中，我们将局域网设置为 10.1.1.12，互联网使用\
    \ 255.255.204.231。\n\n- 1. 在任务栏中右键点击局域网连接并点击“打开网络连接”\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_219_0.png)\n\
    \n- 2. 右键点击“局域网”并点击“属性”\n- 3. 在列表中选择“Internet 协议 (TCP/IP)”并点击“属性”按钮\n- 4. 记录 IP\
    \ 地址\n- 5. 重复相同的过程记录网络的外部 IP 地址\n\n## 10.11.1 在局域网内连接应用程序\n\n从局域网内的一台客户端计算机：\n\
    \n- 1. 打开浏览器会话并输入 http://10.1.1.12:8080/apex/f?p=117（将 117 替换为您的应用程序 ID）\n- 2.\
    \ 分别输入 demo 和 demo 作为用户名和密码\n\n在此阶段您可能会收到错误消息（如图 10-5 所示），表明您的计算机或网络受防火墙保护。如果是此类情况，您需要在\
    \ Windows 防火墙中创建一个异常，以接受在我们的场景中 APEX 端口 8080 的入站连接。\n\n> 连接超时\n> 10.1.1.12 上的服务器响应时间过长。\n\
    \n- 网站可能临时不可用或繁忙。请几分钟后重试。\n- 如果您无法加载任何页面，请检查计算机的网络连接。\n- 如果您的计算机或网络受防火墙或代理保护，请确保允许\
    \ Firefox 访问 Web。\n\n重试\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_219_1.png)\n\
    \n图 10-5\n\n## 使用 Oracle Application Express 创建快速 Web 应用程序\n\n- 1. 在 Windows 中，点击“开始”，找到“控制面板”，并双击“Windows\
    \ 防火墙”图标\n- 2. 点击“异常”选项卡\n- 3. 点击“添加端口”按钮\n- 4. 在“名称”中输入 APEX Port，在“端口”中输入 8080，选择\
    \ TCP，并点击确定\n- 5. 点击确定 关闭 Windows 防火墙对话框\n\nAPEX 端口异常已添加到“程序和服务”部分，这现在将允许您访问该应用程序。\n\
    \n在 Oracle XE 10g 下工作时，我必须执行命令 `EXEC DBMS:XDB.SETLISTENERLOCALACCESSFALSE` 才能远程访问应用程序。但在\
    \ 11g 中我没有那样操作。\n\n## 10.11.2 通过互联网连接应用程序\n\n在未连接到您局域网的计算机上执行以下步骤：\n\n- 1. 打开浏览器会话并输入\
    \ http://255.256.204.231:8080/apex/f?p=117（将 117 替换为您的应用程序 ID）\n- 2. 分别输入 demo\
    \ 和 demo 作为用户名和密码\n\n## 10.11.3 处理防火墙\n\n如果您的应用程序服务器位于 ISA 等防火墙之后，您将需要为 APEX 端口\
    \ 8080 创建协议，并创建一个允许规则以授予远程访问 APEX 应用程序。按照指令创建规则：\n\n- 1. 打开 ISA 服务器管理器\n- 2. 在右侧，点击“工具箱”\
    \ > “协议”，然后点击“用户定义”\n- 3. 选择“用户定义”，点击“新建” > “协议”\n- 4. 在“协议定义名称”中输入 APEX PROTOCOL\
    \ 并点击“下一步”\n- 5. 协议类型选择 TCP，方向选择出站，在“从”和“到”框中输入 8080\n- 6. 点击确定\n- 7. 点击“下一步”\n\
    - 8. 对于“要使用备用连接”，接受默认值 否\n- 9. 点击“下一步”，然后点击“完成”\n- 10. 在左侧，右键点击“防火墙策略”并选择“新建”\
    \ > “访问规则”\n- 11. 在“访问规则名称”中输入 APEX ALLOW RULE 并点击“下一步”\n- 12. 选择“允许”并点击“下一步”\n\
    - 13. 设置“此规则应用于：选定的协议”，点击“添加”按钮，展开“用户定义”节点并选择 APEX PROTOCOL，点击“下一步”\n- 14. 在“访问源”中点击“添加”按钮，打开“网络”节点，选择“外部”，点击“下一步”\n\
    - 15. 在“访问目标”中点击“添加”按钮，打开“网络”节点，选择“本地主机”，点击“下一步”\n- 16. 点击“下一步”接受“所有用户”\n- 17.\
    \ 点击“完成”\n\n如果您按照指示操作，您将能够能够从内部也可以远程访问该应用程序。本章让您了解应用程序的实施过程。您看到了将应用程序从开发机迁移到生产环境是多么简单。除了应用程序访问场景，我们还解决了可能阻止您访问应用程序的防火墙问题。\n\
    \n"
