    # USERS MANAGEMENT


    # Create Rapid Web Applications Using Oracle Application Express


    In this chapter we are going to implement custom authentication scheme and will
    create two pages under the Administration tab to manage users. These two pages
    will be displayed only to the users with admin privileges and will allow to:


    - Add a new user

    - Remove selected users

    - Change password


    The custom authentication scheme uses CUSTOM_AUTH and CUSTOM_HASH database functions
    to store obfuscated passwords in a table. The Manage Users page – Page 8, enables
    you to create additional users and remove selected users while Page 9 allows users
    to change their passwords.


    ## 9.1.1 CUSTOM_AUTH Function


    ```sql

    create or replace function custom_auth (p_username in VARCHAR2, p_password in
    VARCHAR2)

    return BOOLEAN

    is l_password varchar2(4000);

    l_stored_password varchar2(4000);

    l_expires_on date;

    l_count number;

    begin

    -- First, check to see if the user is in the user table

    select count(*) into l_count from demo_users where user_name = p_username;

    if l_count > 0 then

    -- First, we fetch the stored hashed password & expire date

    select password, expires_on into l_stored_password, l_expires_on

    from demo_users where user_name = p_username;


    -- Next, we check to see if the user''s account is expired

    -- If it is, return FALSE

    if l_expires_on > sysdate or l_expires_on is null then


    -- If the account is not expired, we have to apply the custom hash

    -- function to the password

    l_password := custom_hash(p_username, p_password);


    -- Finally, we compare them to see if they are the same and return

    -- either TRUE or FALSE

    if l_password = l_stored_password then

    return true;

    else

    ```


