    Oracle Forms modernization projects are often undertaken to convert legacy applications
    to the latest Oracle Database version and enable developers to satisfy user demands
    for greater interactivity and Web 2.0 capabilities.


    Oracle Application Express runs within the Oracle database environment. You have
    a few choices on how you want to use APEX.


    +   - You can download a free copy of a developer edition of Oracle Database.
    We will use this approach in the book to create our sample web application. In
    section 1.9 I will guide you to download and install Oracle Database XE.


    +   - You can also use a hosted version of Oracle Application Express at http://apex.oracle.com
    to create this application. Although the examples should work with either of the
    two options, we are going to use the first one.


    You will create the sample web application on your own computer. For this, you
    need to download Oracle Database Express Edition 11g Release 2. Oracle Database
    Express Edition (Oracle Database XE) is an entry-level, small-footprint database.
    It is free to develop, deploy, and distribute; fast to download; simple to administer.
    In prior versions, you were required to download and install APEX 4 separately.
    With current XE, you already have the latest APEX version installed. The next
    section will guide you to download and install Oracle Database XE.'
