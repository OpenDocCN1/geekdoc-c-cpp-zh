    # Create Rapid Web Applications Using Oracle Application Express


    This chapter will teach you how to create professional looking order forms. Orders
    from customers will be taken through a sequence of form (wizard). The first form
    will allow user to select an existing customer or create a new one. In the second
    step, user will select products to order and the last step will show summary of
    the placed order. Once an order is created, you can view, modify, and delete it
    from the Order Details page using the edit - icon in the orders'' main page. Couple
    of other pages will be created as well to create a new customer, if one does not
    exist, and display product information such as Description, Category and Price.
    Following are the details of pages that we are going to create in this exercise:


    | Page No. | Page Name | Purpose |

    | --- | --- | --- |

    | 4 | Orders | Main page to display all existing orders |

    | 29 | Order Details | Display complete order with details |

    | 11 | New Order - Identify Customer (Step 1a) | Select an existing customer |

    | 18 | New Order - Create Customer (Step 1b) | If customer does not exist, create
    his/her account |

    | 12 | New Order - Select Items (Step 2) | Add products to the order |

    | 20 | Product Info | Show details of a product in a popup window |

    | 14 | Order Summary (Step 3) | Show summary of the placed order |


    +   1. Login to APEX using http://localhost:8080/apex

    2. Click Application Builder icon

    3. Click APEX Sample Application'
