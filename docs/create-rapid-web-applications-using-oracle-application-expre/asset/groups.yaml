  mdcn: "\n\n# 第 6 章 – 下单\n\n在创建订单时，你可以选择现有客户或创建一个新客户。在练习中，我们将通过复制“第 7 页 客户详情”来创建第\
    \ 18 页：“新订单 – 创建客户”。此页面将用于在订单向导中选择“新客户”选项并点击“下一步”时，输入新客户的资料。\n\n1. 在开发者工具栏中点击\
    \ Application 101\n2. 点击 Page 7 – Customer Details\n3. 点击 Create 按钮并选择 New page\
    \ as a copy 复制\n4. 点击此应用程序中的 Page\n5. 按照下图所示完成下一个屏幕并点击 Next\n\n![](img/5bf6e7eb17c41dae70753fc9049e3008_121_0.png)\n\
    \n6. 点击 Next 以接受所有新值（New Values）\n7. 点击 Use an existing tab set 并在标签集内重用现有标签页，点击\
    \ Next\n8. 选择 TS1，点击 Next\n9. 选择 T_ORDERS:label=\"ORDERS\" 并点击 Next\n10. 点击 Finish\n\
    11. 点击 Edit Page\n\n# 使用 Oracle Application Express 创建快速 Web 应用程序\n\n### 6.8.1\
    \ 修改页面属性\n\n1. 点击 Page 区域下的 Edit\n2. 将 Page Template 设置为 One Level Tabs - Left\
    \ and Right Sidebar (fixed-width / DIV left and optional table-based right)\n\
    3. 点击 Apply Changes\n\n### 6.8.2 修改区域属性\n\n1. 点击 Regions 区域中的 10 Customer Details\n\
    2. 将 Template 设置为 Wizard Region，并将 Display Point 设置为 Page Template Body (3. 区域内容上方项目)\n\
    3. 点击 Apply Changes\n\n### 6.8.3 删除区域\n\n1. 点击 Regions 区域中的 Orders for the Customer\n\
    2. 点击 Delete 并确认删除该区域\n\n### 6.8.4 创建区域 – 订单进度\n\n1. 点击 Regions 区域中的 Create\n\
    2. 点击列表图标\n3. 在 Title 中输入 Order Progress，在 Region Template 中选择 No Template，在 Display\
    \ Point 中选择 Page Template Position 2，点击 Next\n5. 在 List 中选择 Order Wizard 并点击 Next\n\
    6. 点击 Create Region\n\n### 6.8.5 修改按钮 – 取消 (Cancel)\n\n1. 点击 Buttons 区域中的 10 Cancel\n\
    2. 在 Page 下的 Action Button Clicked 中输入 4\n3. 点击 Apply Changes\n\n# 第 6 章 – 下单\n\
    \n我们必须移除 Buttons 区域中的 Delete 和 Create 按钮。在此之前，我们必须移除一些进程，因为这些进程引用了这两个按钮。\n\n###\
    \ 6.8.6 删除进程和按钮\n\n- 点击 Validations 下的 Customer Orders\n- 点击 Delete 并确认删除\n- 点击\
    \ Processes 下的 Delete\n- 点击 Delete 按钮并确认删除\n- 点击 Buttons 区域中的 20 Delete\n- 点击\
    \ Delete 按钮并确认删除\n- Apply Changes 和 Create 按钮并使用上述相同的技术删除它们\n\n### 6.8.7 创建新按钮\n\
    \n- 点击 Buttons 区域 10 中的 Create 并点击 Next\n- 选择 Customer Details (1) 10 并点击\n- 在区域位置点击\
    \ Create a button\n- 在 Button Name 中输入 PREVIOUS，在 Label 中输入 < Previous，点击 Next\n\
    - 在 Position 中选择 Region Template Position #DELETE# 并点击 Next\n- 在此应用程序中选择 Redirect\
    \ to Page 并在 Page 中输入 11，点击 Next\n- 点击 Create Button\n- 编辑新创建的按钮\n- 在 Action When\
    \ Button Clicked 的 Database Action 下选择 SQL Delete 操作\n- 点击 Apply Changes\n- 选择\
    \ Customer Details (1) 10 并点击 Next\n- 在区域位置点击 Create a button\n- 在 Button Name\
    \ 中输入 INSERT，在 Next > 里的 Label 中选择 Button，在 Template 中选择 Alternative 1- Hot Button，点击\
    \ Next\n- 在 Position 中选择 Region Template Position #CHANGE# 并点击 Next\n- 点击 Create\
    \ Button\n- 编辑新创建的按钮\n- 在 Action When Button Clicked 的 Database Action 下选择 SQL\
    \ Insert 操作\n- 点击 Apply Changes\n\n### 6.8.8 修改进程\n\n1. 点击 Processes 下的 DEMO_CUSTOMERS\n\
    2. 在 Return Key Into Item 中输入 P18 CUSTOMER_ID\n3. 点击 Apply Changes\n4. 点击 reset\
    \ page进程 进行修改\n5. 在 Conditions 下将 When Button Pressed 设置为 PREVIOUS (< Previous)\n\
    6. 将 Condition Type 设置为 Never\n7. 点击 Apply Changes\n\n### 6.8.9 修改分支 (Branch)\n\
    \n1. 点击 Branches 下的 Go To Page\n2. 在 Action 下，在 Page 输入 12\n3. 在 When Button Pressed\
