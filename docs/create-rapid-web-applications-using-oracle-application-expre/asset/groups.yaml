    # 使用 Oracle Application Express 创建快速 Web 应用


    恭喜！你已经完成了本书中最枯燥但也最有趣的一个章节。本章教了你许多我们在“总结”部分将看到的技巧。现在，我们将测试在本章中完成的所有工作。


    - 1. 移动到应用程序的首页。

    2. 点击 Orders（订单）选项卡，并点击 Enter New Order（新建订单）按钮。

    3. 选择 New Customer（新客户）并点击 Next（下一步）。

    4. 使用自己的姓名、地址等填写 New Customer 表单，并点击 Next。

    5. 在 Select Item（选择项目）页面向 Current Order（当前订单）页面添加几个产品。

    6. 点击 Place（提交）按钮。出现如图 6-23 所示的 Order Summary 页。


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_144_0.png)


    图 6-23


    - 7. 在订单摘要点击 View Orders（查看订单）按钮进入 Orders 主页。新创建的订单应该出现在订单列表的顶部。


    - 8. 点击 - 编辑新创建的订单。页面看起来应该像本章之前显示的图 6-14 一样。尝试在此页面上添加或删除产品并保存你的修改。


    书中这个漫长的章节演示了以下技术：


    - 利用 Order Progress（订单进度）列表使用向导

    - 创建主/细表单（master/detail forms）

    - 创建主报告和备报告

    - 创建公共报告（Public Reports）

    - 数据的报告、图表和分组视图

    - 使用控制中断（Control Break）、高亮（Highlight）和聚合函数（Aggregate functions）

    - 从报告钻取数据输入页面

    - 数据的图形化展示

    - 在页面渲染（Page Rendering）中添加进程

    - 在不离开订单页的情况下创建新客户

    - 利用动态动作（Dynamic Actions）显示/隐藏页面项目

    - 如何在页面中使用样式

    - 在页面中使用 PL/SQL 代码

    - 调用弹出窗口显示信息

    - 汇总数据


    ## 第 7 章

    生成图形化报告


    预测未来的最好方法，就是发明它。


    # 第 7 章 – 生成图形化报告


    在上一一章中创建订单页面时，我们对交互式报告做了一些工作，并看到在 Oracle Application Express 中创建灵活且强大的报告是多么简单。在本章中，我们将更进一步，创建以下报告以以图形化方式展示数据：


    | 报告 | 目的 | 页码 |

    |---|---|--|

    | 客户订单 (Customer Orders) | 显示每个客户提交的总订单 | 17 |

    | 按类别和产品销售 (Sales By Category and Product) | 显示类别和产品的销售情况 | 16 |

    | 按类别/月份销售 (Sales by Category / Month) | 每个类别每月总销售额 | 5 |

    | 订单日历 (Order Calendar) | 以日历视图显示订单 | 10 |

    | 客户地图 (Customer Map) | 根据区域显示订单 | 13 |

    | 产品订单树 (Product Order Tree) | 在树中显示类别和订单 | 19 |


    - 1. 使用 http://localhost:8080/apex 登录 APEX

    2. 点击 Application Builder（应用程序生成器）图标

    3. 点击 APEX Sample Application


    为了创建报告，我们将创建一个报告菜单。此菜单将显示在所有报告页面的右侧。为了完成此任务，我们需要创建一个 Page 0（页面零）。如果区域的显示点包含在所选页面模板中，则页面零组件将显示在所有页面上。可以使用条件显示属性进行抑制。这是在整个应用程序中共享
    APEX 对象的非常简单且有效的方法。在练习中，我们将为应用程序创建页面零，以显示在第 2 章 2.5.2 (b) 部分创建的列表和报告选项卡。如上所述，页面零组件在整个应用程序中共享，因此我们将设置一个条件，只在与
    Reports 选项卡相关的页面显示报告列表。


