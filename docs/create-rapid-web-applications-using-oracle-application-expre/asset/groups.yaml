    In this exercise, we created a workspace and built a blank structure for our application
    with two default pages. We will work in detail on individual pages from chapter
    3.


    In the next section we will go through another block, the underlying database
    objects, that already exist for our sample application.


    We are going to use the following default objects that were created during the
    database installation:


    - Tables: DEMO CUSTOMERS, DEMO_ORDERS, DEMO_ORDER_ITEMS, DEMO_PRODUCT_INFO, DEMO_STATES,
    DEMO_USERS

    - Indexes: DEMO_CUSTOM.PK, DEMO_CUST_NAME_IX, DEMO_ORDER_ITEMS_PK, DEMO_ORDER_PK,
    DEMO_CUSTOMER_IX, DEMO_PRODUCT_INFO_PK, DEMO_USERS_PK

    - Sequence: DEMO_CUST_SEQ, DEMO_ORDER_ITEMS_SEQ, DEMO_ORD_SEQ, DEMO_PROD_SEQ,
