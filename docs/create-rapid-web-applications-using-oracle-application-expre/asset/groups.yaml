    return false;

    end if;

    else

    return false;

    end if;

    else

    -- The username provided is not in the DEMO_USERS table

    return false;

    end if;

    end;

    ```


    ## 9.1.2 CUSTOM_HASH Function


    ```sql

    create or replace function custom_hash (p_username in varchar2, p_password in
    varchar2)

    return varchar2

    is

    l_password varchar2(4000);

    l_salt varchar2(4000) := ''477CS6K64KCDIDEY70S'';

    begin

    -- This function should be wrapped, as the algorithm is exposed here.

    -- You can change the value of l_salt or method of which to call

    -- DBMS_obfuscation_toolkit, but reset all of your passwords

    -- if you choose to do this.

    l_password := utl_raw.to_raw(db_obfuscation_toolkit.md5(p_password || substr(l_salt,10,13)
    || p_username || substr(l_salt,4,10)));

    return l_password;

    end;

    ```


