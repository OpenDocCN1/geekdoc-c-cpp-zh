  md: 'The following figure depicts a scenario to access the application in an office
    LAN and through the internet.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_218_0.png)


    Figure 10-4 Local and remote clients connected to Oracle APEX server


    +   1. Office LAN

    2. Database Server

    3. LAN Clients

    4. NIC-1 with static local IP 10.1.1.12

    5. NIC-2 with static external IP 255.266.204:231

    6. Remote Client


    This scenario assumes that you have a computer, to act as the application server,
    with the following components:


    +   - Windows XP or higher OS

    - Oracle Express Edition (XE) 11g

    - APEX Sample Application deployed and running locally

    - Two network interface cards, with static IP, connected to local area network
    and the internet'
  merge: -1
