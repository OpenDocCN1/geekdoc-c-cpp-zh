    Sales Quota demonstrates the use of a Flash Dial chart. This chart displays a
    value based on an underlying SQL statement to measure sales against the defined
    quota for the logged in user.


    Note: The Flash Dial Chart is not displayed if you log in as an Admin user.


    Top Customers is a report based on a SQL query and displays a subset of the information
    that appears on the Customers page. Users can link to additional details by clicking
    the customer name or by clicking the View Customer icon (a right arrow, marked
    as K in the above figure) in the upper right corner of the region.


    Top Products is also a report based on a SQL query. This report displays a subset
    of the information that displays on the Products page. Users can link to product
