  md: '# Chapter 2 – The Building Blocks


    # 2.5.2 Lists


    After creating tabs, our next task is to create lists. A list is a collection
    of links that is rendered using a template. For each list entry, you specify display
    text, a target URL, and other attributes that control when and how the list entry
    displays. You control the display of the list and the appearance of all list entries
    by linking the list to a template.


    # 2.5.2 (a) Tasks List


    In this exercise we are going to create a list named Tasks that appear on the
    Home page of our application see Figure 2-1. This list is used to create New Orders,
    Customers, and Products.


