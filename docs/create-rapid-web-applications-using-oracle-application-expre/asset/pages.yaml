  md: '# 8.7.3 Format Report


    +   1. Place the cursor in front of ORDER MONTH and type Order Month: to act as
    a label. Use MS Word standard tools to change font, color and size. Drag the column
    width to set the desired size.


    +   2. Click the ORDER TOTAL field and right-align it. Double click it to call
    its properties. Select Number for Type and, ##.00 for Format and click OK


    +   3. Insert a blank line above group ROW by Order Month to add report title.
    Type ABC CORPORATION Monthly Orders Report on the subsequent line. You can also
    add logo and page number using the Header and Footer options in MS Word.


    # 8.7.4 Conditional Formatting


    In these steps we are going to change font and background color of orders for
    which the amount is less than or equal to 900 as we did in the on-screen report
    in chapter 6.


    +   1. Click the Order Total field to select it


    +   2. Click the Add-Ins menu


    +   3. Click Insert and select Conditional Format


    +   4. Select field ORDER TOTAL for Data field, select Number in the adjacent
    list, put a check on Apply to Entire Table Row, select less than or to in the
    Data field, enter 900 in the box next to the Data field, click the Format button,
    click the Background Color, click the Select button to choose different Font and
    Background colors and click OK


    +   5. Preview your work and see the application of conditional formatting to
    all the rows having Order Total less than or equal to 900.


    Use the same procedure and change font and background color for orders greater
    than 2000. Select Greater for the condition and enter 2000 in the value. After
    completion, preview the report to check your work.


