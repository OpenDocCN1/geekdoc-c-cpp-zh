    you provided during the database setup.


    +   3. You will be asked to change this password. Enter manager in Current Password
    and Shafi_2009 in Enter New Password and confirm it in the next box. You can provide
    your own complex password using at least one numeric character, one punctuation
    character, and one upper-case alphabetic character.


    +   4. Click the Manage Workspaces icon


    +   5. Click the link Create Workspace under Workspace Actions section'
