  md: '# Chapter 10 – Deploy and Access APEX Application


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_211_0.png)


    The first step is to export the application to be imported into a new workspace.


    +   1. Login to the application and click the Application Builder icon

    2. Click APEX Sample Application icon

    3. Click Import/Export icon as show in Figure 10-1


    Figure 10-1


    +   4. Click the Export icon

    5. Set Application to APEX Sample Application, File Format to DOS, Export Supporting
    Object Definitions to No, and click Export Application button

    6. Select the Save File option and click the OK button. A file named f101.sql
    will be saved into the Download folder under My Documents.


    During the application development phase, we entered some data to test our work.
    Here we are going to export that data and other database objects to utilize in
    our test/production environment.


    We will be using Oracle''s export and import data pump utilities to achieve the
    task.


    +   1. Create a folder named datapump under the database folder like this C:\OracleXE\datapump.

    2. Run the SQL Command Line using Start > All Program > Oracle Database 11g Express
    Edition

    3. On the SQL prompt type connect system/manager and press Enter. The connected
    message appears.

    4. On the SQL prompt type create directory datapump as ''c:\oraclexe\datapump'';
    and press Enter. Directory Created message appears.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Create Rapid Web Applications Using Oracle Application Express


    +   5. Open a command prompt using Start > Run type cmd in the Open box and click
    OK

    6. Type cd c:\oracle\datapump and press Enter. The prompt should look like C:\OracleXE\datapump>

    7. Type ExpDP system/manager schemas=ASA directory=datapump dumpfile=ASA.dmpnlogfile=ASAexport.log
    and press Enter. Successfully completed message should appear.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_212_0.png)


    In the following steps we will export our application''s logo to demonstrate how
    individual components can be exported in APEX tab


    +   1. Click the Application Builder tab

    2. Click the Export button

    3. Click on the Images link

    4. In Choose Application, select APEX Sample Application set Format to DOS

    5. Click the Export Images button

    6. Select the Save File option and click the OK button. A file named f101_img.sql
    will be saved into the Download folder under My Documents.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_212_1.png)


    After finishing the development task, and applying patches received through users''
    feedback, it''s a good practice to lock down your application to prevent users
    from accessing the development environment. In this exercise we are going to make
    the application unavailable for further modifications on the development computer.


    +   1. Click Application Builder icon

    2. Click APEX Sample Application

    3. Click Shared Components icon

    4. Click Edit Definition link on the sidebar

    5. Click on Availability tab

    6. Change Build Status to Run Application Only

    7. Click Apply Changes'
  merge: -1
