  md: '# CHAPTER 1


    # ORACLE APPLICATION EXPRESS INTRODUCTION'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1 - Introduction


    Oracle Application Express (oracle APEX), is a rapid web application development
    tool for the Oracle database. It runs in an Oracle database instance and comes
    as a no-cost option with Oracle database. If you want to develop and deploy fast
    and secure professional applications then Oracle APEX must be your choice. The
    only requirements are a web browser and a little programming experience. Besides
    ease of use and flexibility. Oracle application express provides the qualities
    of an enterprise database, scalability, security, integrity, availability and
    above all the web development experience.


    It has the web-based application development environment to build web applications.
    You are not required to install any client software to develop, deploy, or run
    APEX applications. Following are the three primary tools provided by Oracle APEX:


    +   - Application Builder – to create database driven applications

    - SQL Workshop – to browse your databases, run ad-hoc SQL queries, as well as
    graphical query builder

    - Utilities – allows for data to be loaded and unloaded from both flat files and
    spreadsheets


    Develop any application through an easy declarative development process of Application
    Express. However, you can use HTML to extend the presentation of your client interfaces
    and add Oracle''s standard PL/SQL procedural language to supply additional logical
    operations.


    With this productive tool you can build applications that report on database data.
    Create hyper text linked reports to easily link to other reports, charts, and
    data entry forms. Charts have built-in drill-functionality, so that a user can
    get more detailed information on any of the sections of the chart with a simple
    mouse click. You can effectively communicate data using the charting engine by
    presenting SQL queries graphically. Use declarative form controls including shuttles,
    text editors, date pickers, checkboxes, radio groups, and select lists to manipulate
    data.


    Easily and instantly build opportunistic and departmental applications with the
    help of simple wizards. This makes Application Express a natural replacement for
    multi-user database applications. Create highly professional, secure, and scalable
    applications without scripting languages and complex framework.


    Application Express provides a declarative programming environment, which means
    that no code is generated or compiled during development. You just interact through
    wizards and property sheets. Reports and charts are defined'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Create Rapid Web Application Using Oracle Application Express


    with simple queries, so some knowledge of SQL is very helpful. Besides, if procedural
    logic is needed, you can also write PL/SQL code.


    Oracle Application Express lives entirely within your Oracle database. It is comprised
    of nothing more than data in tables and large amount of PL/SQL code. The essence
    of Oracle Application Express is approximately 215 tables and 200 PL/SQL objects
    containing 300,000+ lines of code. The Application Express engine renders applications
    in real time from data stored in database tables. When you create or extend an
    application, Oracle Application Express creates or modifies metadata stored in
    database tables. When the application is run, the Application Express engine reads
    the metadata and displays the application.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_18_0.png)


    Velocity in the demand for new applications and functionality rises as businesses
    grow. As a developer, you are expected to rapidly respond to these needs. Over
    the years, desktop database and spreadsheet tools have enormously contributed
    to data management due to the ease and user friendliness these applications extend
    to their audience. Besides benefits, these applications have scalability and functionality
    limitations that not only results in dozens of different applications and data
    sources also adds extra overhead in their maintenance. Due to these issues, organizations
    are unable to continue their standard practices, leaving mission-critical data
    at risk. These fragmented systems may also cause loss of business opportunity.
    Finally, significant amount of time and resource is required to put these blocks
    together to get the desired information. In addition to above, the following points
    provide some more drawbacks of desktop applications:


    +   - Installation of client software, such as Excel, on every machine

    - Lack of data sharing with other applications

    - Simultaneous data access inability in spreadsheets

    - May not be the part of regular data backup

    - Critical and confidential data can easily be moved via email or pocket storage
    devices


    Having gone through the above stuff, it is clear that you need a tool that has
    the capability to cope with these çıkart. The following list shows how APEX allows
    you to handle most of these issues:


    +   - Central management of data and data applications

    - No installation of software is required on client machines, the only requirement
    is a supported browser

    - Shared development and application access'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Chapter 1 - Introduction


    +   - Being clear, data and applications become part of regular backup procedure

    - Data and application access control, empowered by audit trail


    The above glimpses have disclosed that APEX is capable of far more than just being
    an Excel or Access replacement. Give it a try by replacing your existing desktop
    applications with APEX application, and enjoy the benefits that this robust technology
    offers.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_0.png)


    You can easily and quickly migrate spreadsheet to Oracle Application Express using
    the Create Application wizard. Simple mouse clicks moves crucial data into an
    Oracle database from a spreadsheet. Using wizard to create a spreadsheet application
    creates a lot of functionality to automatically manage the data. Application have
    built-in data manipulation methods that allow you to query, insert, delete, and
    modify the data. APEX has made it so simple to create a complete application that
    interacts with data with a few mouse clicks, and all that without writing a single
    line of code.


    The application you create based on spreadsheet allows you to view reports and
    charts for the columns selected in the Create Application wizard. Although these
    report and charts provide useful information, you can customize and extend them
    to display the information according to your own needs. Creation of reports and
    charts with ease is another reason to consider worksheet migration to APEX.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_19_1.png)


    Microsoft Access has been a part of business workflow in many organizations. Similar
    to Excel, Microsoft Access has to be installed on client machine to use the application.
    Access does not support Web Services to facilitate interoperability with Service
    Oriented Architecture (SOA) enabled components. Access database size is limited
    to 2 GB, whereas there is no database size limitations in Application Express.
    The architecture of Application Express supports thousands of concurrent users
    on a small 2 CPU server as opposed to 255 users in Access (recommended figure
    is 20 users only). Application Express can run on Windows, MAC, and Linux, Access
    is only Windows based. In Application Express, data and application are managed
    on a hosted server providing consolidated data'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Create Rapid Web Application Using Oracle Application Express


    management. On the other hand, information is fragmented in Access as each application
    is contained in one or more files. Concurrent development is another disadvantage
    in Application Express. Multiple developers can work on the same or different
    applications within a workspace. In contrast, Access supports single development
    environment and allows only one developer to use the mdb file at a given time.


    Oracle has provided a feature, Application Migration Workshop, in Application
    Express that assists in migrating application from a personal Access database,
    with minimal effort, to the world number one and most powerful database. Along
    with the Oracle SQL Developer Migration Workbench, it is a complete solution for
    your Access Migration requirements.


    Initially, you are required to migrate schema definition and data using the SQL
    Developer Migration Workbench and then utilize the new Application Migration Workshop
    to migrate Access forms and reports. The last step is refining your new application
    taking advantage of all the power and capabilities of Oracle APEX. Please note
    that Access forms and reports contain business logic that cannot be generated
    using the migration wizard. The solution performs the bulk of the migration work
    by recovering the design from existing Access application and generating APEX
    application based on the findings. Follow the link http://www.oracle.com/technet/developer-tools/apex-application-express-tutorial-090294.html
    and go through the Access Migration Tutorial.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'In previous versions, Oracle HTTP Server (Apache) with mod_plql plug-in was
    configured to access Oracle Application Express engine Figure 1-1.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_0.png)


    With Oracle Database 11.1 and later, Oracle HTTP Server is replaced by embedded
    PL/SQL gateway (EPG). The embedded PL/SQL gateway runs in the XML DB HTTP server
    in the Oracle database and includes the core features of mod_plql, but does not
    require the Oracle HTTP Server powered by Apache. See the Figure 1-2 that illustrate
    Oracle Application Express architecture using the Embedded PL/SQL Gateway.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_21_1.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Convert your legacy Oracle Forms and Microsoft Access applications through
    Application Migration Workshop that generates an Oracle APEX application from
    the retrieved objects.


    Oracle Forms modernization projects are often undertaken to convert legacy applications
    to the latest Oracle Database version and enable developers to satisfy user demands
    for greater interactivity and Web 2.0 capabilities.


    Oracle Application Express runs within the Oracle database environment. You have
    a few choices on how you want to use APEX.


    +   - You can download a free copy of a developer edition of Oracle Database.
    We will use this approach in the book to create our sample web application. In
    section 1.9 I will guide you to download and install Oracle Database XE.


    +   - You can also use a hosted version of Oracle Application Express at http://apex.oracle.com
    to create this application. Although the examples should work with either of the
    two options, we are going to use the first one.


    You will create the sample web application on your own computer. For this, you
    need to download Oracle Database Express Edition 11g Release 2. Oracle Database
    Express Edition (Oracle Database XE) is an entry-level, small-footprint database.
    It is free to develop, deploy, and distribute; fast to download; simple to administer.
    In prior versions, you were required to download and install APEX 4 separately.
    With current XE, you already have the latest APEX version installed. The next
    section will guide you to download and install Oracle Database XE.'
