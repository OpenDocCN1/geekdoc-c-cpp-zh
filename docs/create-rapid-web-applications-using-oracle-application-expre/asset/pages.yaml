  md: '# 6.10.2 Create Region – Select Items


    +   1. Click Create in Regions section

    2. Click the PL/SQL Dynamic Content icon

    3. Enter Select Items in Title, select Wizard Region for Region Template and click
    Next

    4. In PL/SQL Source type the following code:


    ```

    declare

    l_customer_id varchar(30) := :P11_CUSTOMER_ID;

    begin


    -- display customer information


    if P11_CUSTOMER_OPTIONS = ''NEW'' then

    l_customer_id := :P18_CUSTOMER_ID;

    end if;

    for x in (select * from demo_customers where customer_id = l_customer_id)

    loop

    htp.p(''<div class="demoCustomerInfo">'');

    htp.p(''<strong>Customer:'' || ''</strong>'');

    htp.p(''<p>'');

    htp.p(htf.escape_sc(x.cust_first_name) || '' '' || htf.escape_sc(x.cust_last_name)
    || ''<br/>'');

    htp.p(sys.htf.escape_sc(x.cust_street_address1) || ''<br/>'');

    if x.cust_street_address2 is not then

    sys.htp.p(sys.htf.escape_sc(x.cust_street_address2) || ''<br/>'');

    end if;

    htp.p(htf.escape_sc(x.cust_city) || '', '' || x.cust_state || '' '''');

    htp.p(''<p>'');

    end loop;

    htp.p(''</div>'');


    -- display products


    htp.p(''<div class="demoProducts" >'');

    -- htp.p(''<strong>demoTitle</strong>Products</strong>'');

    htp.p(''<table width="100%" cellspacing="0" border="0">

    <head>

    <tr><th class="left">Product</th><th>Price</th><th></th></th></tr>

    </head>

    <body>

    for cl in (select product_id, <a href="javascript:productPopup(\''''||product_id||''''\'')">''||product_id||''</a>'',
