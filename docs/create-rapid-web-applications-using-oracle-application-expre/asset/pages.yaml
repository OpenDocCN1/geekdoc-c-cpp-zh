    +   8. Enter http://localhost:8080/apex/ in your browser


    +   9. Login to the workspace


    +   10. Click Application Builder. The application icon changed. Now you can modify
    the application.


    We need a new workspace to implement the application.


    +   1. Enter http://localhost:8080/apex/apex_admin in your browser to access the
