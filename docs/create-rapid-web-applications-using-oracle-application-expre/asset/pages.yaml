    Figure 2-19


    The Customers tab is created. Create four more tabs Products, Orders, Reports,
    and Administration and set the attributes as shown in the following table. After
    creating all the tabs, edit Page 1 and set appropriate values using the table''s
    Home column. Edit each tab and set values for Tab Order Current for Pages. Click
    Apply Changes after modifying each tab the tab will be active for the listed page.
    Once finished, your tabs should look like Figure 2-20


