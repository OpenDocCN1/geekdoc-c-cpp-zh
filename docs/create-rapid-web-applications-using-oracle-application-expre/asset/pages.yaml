  md: "# 6.10.8 Create Process – Place Order\n\n+   1. Click Create in Processes section\
    \ under Page Processing\n2. Click PL/SQL\n3. Enter Place Order in Name and click\
    \ Next\n4. Enter the following code in PL/SQL Page Process and click Next:\n\n\
    ```\ndeclare\n  l_order_id number;\n  l_customer_id varchar(30) :=P11_CUSTOMER_ID;\n\
    \  l_user_id number;\nbegin\n\n  if :P11_CUSTOMER_OPTIONS = 'NEW' then\n    l_customer_id\
    \ := :P18_CUSTOMER_ID;\n  end if;\n\n  -- Fetch values that need to be inserted\
    \ into the Order Header\n  select user_id into l_user_id from demo_users where\
    \ user_name = :APP_USER;\n  select demo_ord_seq.nextval into l_order_id from dual;\n\
    \n  -- Insert a row into the Order Header table\n  insert into demo_orders values(l_order_id,\
    \ l_customer_id, null, sysdate, l_user_id);\n  commit;\n  -- Loop through the\
    \ ORDER collection and insert rows into the Order Line Item table\n  for x in\
    \ (select c001,c003,c004 c004 from apex_collections where collection_name = 'ORDER'\
    \ group by c001,c003)\nloop\n    insert into demo_order_items values\n    (null,l_order_id,to_number(x.c001),to_number(x.c003),to_number(x.c004));\n\
    end loop;\n\n  -- Truncate the collection after the order has been placed\n  apex_collection.truncate_collection(p_collection_name\
    \ => 'ORDER');\n\n  -- Set the item P14_ORDER_ID to the order which was just placed\n\
    :P14_ORDER_ID := l_order_id;\nend;\n```\n\n+   5. Click Next to leave messages\
    \ blank\n6. Select PLACE_ORDER (Place Order) in When Button Pressed\n7. Click\
    \ Create Process"
