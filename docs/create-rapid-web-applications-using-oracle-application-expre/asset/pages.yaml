  md: '# 2.5.1 Tabs


    In this exercise we are going to create our application tabs. Tabs are an effective
    way to navigate pages of an application. Application Builder includes two types
    of tabs: standard tabs and parent tabs. An application having only one level of
    tabs uses a standard tab set. A standard tab is associated with a specific page.
    You can use standard tabs to link to other pages within your application. A parent
    tab set functions as a container to hold a group of standard tabs. Parent tabs
    give another level of navigation and context (or sense of place) within the application.


    +   1. In the Shared Components under Navigation Section click Tabs

    2. Click Manage Tabs

    3. Click Add beside Page 1 to create a new tab using wizard

    4. Enter Customers in Tab Label, click Next

    5. Enter 2 for Tab Current for Page, click Next

    6. Enter 2 in Sequence box, click Next

    7. Accept the default condition type ''No Display Condition'' and click Next

    8. Click Create Tab button


