  md: '# Chapter 2 – The Building Blocks


    # 2.2.6 Advanced Reporting


    With advanced reporting, you can author, manage, and deliver all your reports
    and documents easier and faster. Using familiar desktop tools, you can create
    everything from pixel-perfect customer facing documents to critical management
    reports. View reports online or take a hard copy in various formats including
    PDF, Word, Excel and HTML and schedule tens of thousands of documents per hour
    to deliver these reports to multiple destinations.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_33_0.png)


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_33_1.png)


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_33_2.png)


    # 2.2.7 Users Management


    Application users are managed through the Administration page. The Administration
    page displays only if you log in to the Application using the user name admin.
    The Application makes use of a custom authentication scheme that stores user names
    and obfuscated passwords in a table. Manage Users page enables you to manage additional
    users. To add a new user, click Add User at the bottom of the page. To delete
    a user, select the user and click Removed Selected. This custom authentication
    scheme does not use any user names or passwords associated with Oracle Application
    express developers.


    ![](img/5bf6e7eb17c41dae70753fc9049e3008_33_3.png)


    Figure 2-6'
