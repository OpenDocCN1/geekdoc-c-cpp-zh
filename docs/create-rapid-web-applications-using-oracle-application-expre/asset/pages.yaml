  md: '# Chapter 2 – The Building Blocks


    # 2.5.2 (c) Order Wizard List


    This list is used while creating orders. In our application, we will create an
    order using a wizard in the following sequence:


    +   a) Identify Customer

    b) Create Customer (if one doesn''t exist)

    c) Select Items

    c) Show Order Summary


    +   1. Go to Shared Components, Navigation Section – Lists, Click the Create button


    +   2. Name=Order Wizard, List Template=Wizard Progress List, Click Next


    +   3. Enter the following values


    | List Entry Label | Target Page ID or custom URL |

    | --- | --- |

    | Identify Customer | None - Leave Blank |

    | Create Customer | None - Leave Blank |

    | Select Items | None - Leave Blank |

    | Order Summary | None - Leave Blank |


    Please note that no values will be set for Target Page ID and will be left blank
    for all the four entries.


    +   4. Click the Next button, accept the default values in the next screen and
    click Create


    +   5. Click the newly created list Order Wizard


    +   6. Edit each list item, set Target Type attribute to No Target, and set the
    following attributes:


