  md: '# Chapter 10 – Deploy and Access APEX Application


    If required in future, the following steps will be performed to unlock the locked
    application.


    +   1. Enter http://localhost:8080/apex/apex_admin in the browser


    +   2. Provide Admin username and password. We are required to change the existing
    manager password that we will do in the next section.


