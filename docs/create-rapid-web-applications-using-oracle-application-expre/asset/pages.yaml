- img_proc: true
  md: "We have seen the use of interactive reporting feature in APEX to create professional\
    \ looking on-screen reports. But,\n we download the PDF version of these reports\
    \ to have a hard copy, what we get is a generic report in simple row-\ncolumn\
    \ format. For example, if you download the Monthly Report, we created in chapter\
    \ 6 section 6.3.4; the\nout is presented without any control breaks and conditional\
    \ formatting. For serious printing, you have to define\nan external reporting\
    \ server to present data in the desired format.\n\nYou can use Oracle with Apache\
    \ FOP, another XSL-FO processing engine, or Oracle BI Publisher as your print\n\
    server. In this exercise, we will use Oracle BI Publisher to enjoy high level\
    \ formatting.\n\nOracle Application Express provides the following two options:\n\
    \n+   Standard: Apache FOP or another XSL-FO processing engine is supported under\
    \ the standard\nconfiguration. Oracle Application Express already includes support\
    \ for Apache FOP, that allows\ndeclarative formatting of report region and queries\
    \ with basic control over over page attributes\nsuch as column heading format,\
    \ page size, header and footer.\n\n+   Advanced: This option requires Oracle BI\
    \ Publisher to be configured as your print server. Besides standard\nconfiguration,\
    \ Oracle BI Publisher has Word Template Plug-in to create RTF based report\nlayouts,\
    \ that provide greater control over every aspect of your report and allows you\
    \ to add\ncomplex control breaks, charts, charts, and pagination control. The\
    \ following list contains few\nreports that can be created using the advanced\
    \ option:\n\n+   - Tax and Government Forms\n- Invoices\n- Ledgers\n- Financial\
    \ Statements\n- Bill of Lading, using tables and barcode fonts.\n- Operational\
    \ Reports with re-grouping, conditional highlighting, summary calculations,\n\
    and running totals\n- Management Reports having Chart with summary functions and\
    \ table with detail\nrecords\n- Check Print, using conditional formatting and\
    \ MICR fonts\n- Dunning Letters"
  merge: -1
  pgno: 169
- img_proc: true
  md: "# Create Rapid Web Applications Using Oracle Application Express\n\nTo print\
    \ these professional reports, you have to pay for a valid Oracle BI Publisher\
    \ license that is worth the price considering the following advantages:\n\n+ \
    \  - Multiple Output Formats: In addition to PDF, the other supported output formats\
    \ include Word, Excel and HTML.\n- Included in Export Import: Being part of the\
    \ application. RTF based layout are exported and imported along with the application.\n\
    - Robust Layout: Add complex breaks, pagination control, logos, header-footer,\
    \ charts, and print data on pre-printed forms.\n- Report Scheduling: This unique\
    \ feature enables you to set up a schedule and deliver the report to the desired\
    \ destinations including email, fax tex.\n\nThe following section will guide you\
    \ to download and install the limited license version to use the program only\
    \ for the development purpose.\n\nOracle BI Publisher requires Windows Server\
    \ Operating System 2000 or later. I completed the exercises in this chapter with\
    \ the following hardware and software combination.\n\n+   - Server:\n    - Windows\
    \ Server 2000 having IP 10.10.1.5\n    - Downloaded and installed Oracle BI Publisher\
    \ 10.1.3.4.2 using biplisher_windows_x86_10342.zip file. See the following section\
    \ to download and install BI Publisher\n- Client:\n    - Windows XP Service Pack\
    \ 3 having IP 10.1.1.12\n    - Oracle XE database and APEX Sample Application\n\
    \    - Microsoft Word 2007\n    - Oracle BI Publisher Desktop\n    - Dot Net Framework\
    \ 2 and JRE 1.6 or above may be required during BI Publisher Desktop installation.\n\
    \n# Steps to Produce Advance Reports\n\n+   - Install BI Publisher\n- Configure\
    \ APEX to use BI Publisher as a Print Server\n- Enabling Network Services in Oracle\
    \ Database 11g\n- Testing the Print Server\n- Install BI Publisher Desktop\n-\
    \ Create report query in APEX\n- Create report layout in MS Word\n- Upload report\
    \ layout to APEX\n- Add button to a page and run the report"
  merge: -1
  pgno: 170
