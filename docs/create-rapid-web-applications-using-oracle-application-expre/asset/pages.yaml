  md: '# Chapter 7 – Generate Graphical Reports


    ```

    from demo_product_info

    union

    select distinct(''C'') as link_type,

    ''All Categories'' as parent,

    category as id,

    category as name,

    null as sub_id

    from demo_product_info

    union

    select ''P'' as link_type,

    category parent,

    to_char(product id) id,

    product_name as name,

    product_id as sub_id

    from demo_product_info

    union

    select ''O'' as link_type,

    to_char(product_id) as parent,

    ull as id,

    (select c.cust_first_name || '' '' || c.cust_last_name

    from demo_customers c, demo_orders o

    where c.customer_id = o.customer_id

    and o.order_id = oi.order_id) || '', '' || to_char(oi.quantity) as name,

    order_id as sub_id

    from demo_order_items oi

    )

    select case when connect_by_isleaf = 1 then 0

    when level = 1 then -1

    else 0 as status,

    level,

    name as title,

    null as icon,

    id as value,

    ''View'' as tooltip,

    case when link_type = ''M''

    then ''P''||||APP_ID||'':3''||||APP_SESSION||:NO::RIR

    when link_type = ''C''

    then ''P''||||APP_ID||'':3''||||APP_SESSION||:NO::CIR_CATEGORY:''||name

    when link_type = ''P''

    then ''P''||||APP_ID||'':6''||||APP_SESSION||:NO::P6_PRODUCT_ID:''||sub_id

    when link_type = ''O''

    then ''P''||||APP_ID||'':29''||||APP_SESSION||:NO::P29_ORDER_ID:''||sub_id

    else null

    end as link

    from data

    start with parent is null

    ```'
