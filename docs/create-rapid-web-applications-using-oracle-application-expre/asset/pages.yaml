    +   4. Select From Scratch and click Next


    +   5. Enter Admin Users in the Name field


    +   6. Select Exists SQL Query for Scheme Type


    +   7. In Expression 1 type select 1 from demo: users where user name = :APP_USER
    and admin user = ''Y''


    +   8. In Identify error message type You need to be an Admin User in order to
    view this page.


    +   9. Select once per page view under Evaluation Point


    +   10. Click Create button'
