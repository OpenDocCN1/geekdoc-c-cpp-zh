  md: "# Chapter 8 – Advanced Reporting\n\nBy default, the ability to interact with\
    \ network services is disabled in Oracle Database 11g release 1 (11.1). Therefore,\
    \ if you are running Oracle Application Express with Oracle Database 11g release\
    \ 1 (11.1), you must use the new DBMS_NETWORK_ACL_ADMIN package to grant connect\
    \ privileges to any host for the APEX_040000 database user. Failing to grant these\
    \ privileges results in issues with:\n\n+   * Sending outbound mail in Oracle\
    \ Application Express.\n* Users can call methods from the APEX_MAIL package, but\
    \ issues arise when sending outbound mail.\n* Using Web services in Oracle Application\
    \ Express.\n* PDF/report printing.\n* Searching for content in online Help (that\
    \ is, using the Find help).\n\n# Granting Connect Privileges\n\nThe following\
    \ example is a less privileged demonstration of how to access resources on a local\
    \ PC and a host. This example would enable indexing of Oracle Application Express\
    \ Online Help and could possibly enable email and PDF printing. Perform the following\
    \ steps on your Oracle XE database machine, in our scenario it is Windows client.\n\
    \n+   1. Create the two script files APEXprintPDFLocal.SQL and APEXprintPDFHost.SQL\
    \ in Notepad and save the files on your C drive\n\n```\n-- APEXprintPDFLocal.SQL\
    \ - Granting Connect Privileges to a Local Host\nDECLARE\nACL_PATH VARCHAR(2000);\n\
    ACL_ID RAW(16);\nBEGIN\n  -- Look for the ACL currently assigned to 'localhost'\
    \ and give APEX_040000\n  -- the \"connect\" privilege if APEX_040000 does not\
    \ have the privilege yet.\n  SELECT INTO ACL_PATH FROM DBA_NETWORK_ACLS\n  WHERE\
    \ HOST = 'localhost' AND LOWER_PORT IS NULL AND UPPER_PORT IS NULL;\n\n  -- Before\
    \ checking the privilege, make sure that the ACL is valid\n  -- (for example,\
    \ does not contain stale references to dropped users).\n  -- If it does, the following\
    \ exception will be raised:\n\n  ORA-44416: Invalid ACL: Unresolved principal\
    \ 'APEX_040000'\n```\n\n158"
  merge: -1
  pgno: 173
- img_proc: true
  md: "# Create Rapid Web Applications Using Oracle Application Express\n\n-- ORA-06512:\
    \ \"XDB.DBMS_XDBZ\", line ...\n\n```\nSELECT SYS_OP_R20(extractValue(P.RES, '/Resource/XMLRef'))\
    \ INTO ACL_ID\nFROM XDB.DBSACL A, PATH_VIEW P\nWHERE extractValue(P.RES, '/Resource/XMLRef')\
    \ = REF(A) AND\nEQUALS_PATH(P.RES, ACL_PATH) = 1;\n\nDBMS_XDBZ.ValidateACL(ACL_ID);\n\
    IF DBMS_NETWORK_ACL_ADMIN.CHECK_PRIVILEGE(ACL_PATH, 'APEX_040000',\n  'connect')\
    \ IS NULL THEN\n  DBMS_NETWORK_ACL_ADMIN.ADD_PRIVILEGE(ACL_PATH,\n  'APEX_040000',\
    \ TRUE, 'connect');\nEND IF;\n```\n\n```\nEXCEPTION\n-- When no ACL has been assigned\
    \ to 'localhost'.\nWHEN NO_DATA_FOUND THEN\n  DBMS_NETWORK_ACL_ADMIN.CREATE_ACL('local-access-users.xml',\n\
    \  'ACL that lets power users to connect to everywhere',\n  'APEX_040000', TRUE,\
    \ 'connect');\n  DBMS_NETWORK_ACL_ADMIN.ASSIGN_ACL('local-access-users.xml','localhost');\n\
    END;\nCOMMIT;\n```\n\n# APEXprintPDFHost.SQL - Grant Connect Privileges to a Host\n\
    \n```\nDECLARE\n  ACL_PATH VARCHAR2(4000);\n  ACL_ID RAW(16);\nBEGIN\n  -- Look\
    \ for the ACL currently assigned to '*' and give APEX_040000\n  -- the \"connect\"\
    \ privilege of APEX_040000 does not have the privilege yet.\n\n  SELECT ACL_PATH\
    \ FROM DBA_NETWORK_ACLS\n  WHERE HOST = '*' AND LOWER_PORT IS NULL AND UPPER_PORT\
    \ IS NULL;\n```\n\n-- Before checking the privilege, make sure that the ACL is\
    \ valid\n-- (for example, does not contain state references to dropped users).\n\
    -- If it does, the following exception will be raised:\n\n> -- ORA-44416: Invalid\
    \ principal 'APEX_040000'\n-- ORA-06512: \"XDB.DBMS_XDBZ\", line ...\n\n```\n\
    SELECT SYS_OP_R20(extractValue(P.RES, '/Resource/XMLRef')) INTO ACL_ID\nFROM XDB.DBSACL\
    \ A, PATH_VIEW P\nWHERE extractValue(P.RES, '/Resource/XMLRef') = REF(A) AND\n\
    EQUALS_PATH(P.RES, ACL_PATH) = 1;\n```"
  merge: -1
  pgno: 174
- img_proc: true
  md: "# Chapter 8 – Advanced Reporting\n\n```\nDBMS_XDBZ.ValidateACL(ACL_ID);\nIF\
