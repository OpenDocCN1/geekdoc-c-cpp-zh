- md: "\n## Chapter Eight - Python Operators\n\nThere are a few different types of\
    \ operators. There's arithmetic, comparison, and logical operators. Let's take\
    \ a look at each one in a little more detail.\n\n## Arithmetic Operators\n\nPython\
    \ has the modulus -, +, *, % and ** operators. Assume that the variable 'a' has\
    \ a value of ten and variable 'b' has a value of twenty. Therefore:\n\n+\n  a+b=30\n\
    -\n  a-b=-10\n*\n  a*b=200\n/\n  b/a=2\n%\n  b%a=0\n**\n  a**b=10^20\n//\n  9//2=4\n\
    \n## Comparison Operators\n\nThe plain comparison operators like ==, <, >=, and\
    \ the others are utilized on all different manner of values. Strings, numbers,\
    \ mappings, and sequences are all able to be compared. The following bullets will\
    \ show you a list of comparison operators.\n\n- < less than\n- == equal\n- less\
    \ than or equal to\n- greater than or equal to\n- > greater than\n- <> not equal\n\
    - != not equal\n\n## Logical Operators\n\nThe logical operators and or also give\
    \ back a Boolean value when they’re used in a decision structure. There are three\
    \ logical operators, or, and, and not.\n\nFor example, x>0 and x<10 is only true\
    \ if x is greater than 0 and less than 10.\n\nOperator Description:\n\n- and:\
    \ logical AND\n- or: logical OR\n- not: logical NOT\n\nNow that you know operators\
    \ let's talk more about using math in python.\n\n## Chapter Nine - Using Math\
    \ in Python\n\nThe Python language has the Python interpreter, which is a simple\
    \ development environment known as IDLE, tools, libraries, and documentation.\
    \ It's preinstalled on almost all Linux machines and Mac systems, but it can be\
    \ an older version.\n\nIn order to begin using the calculator in the Python interpreter,\
    \ type in the following script:\n\n```python\n>>> 2 + 2\n4\n>>> 4 * 2\n8\n>>>\
    \ 10 / 2\n5\n>>> 10 - 2\n8\n```\n\n## Counting With Variables\n\nTo put in values\
    \ in the variables to count the area of a rectangle, try this code out:\n\n```python\n\
    >>> length=2.20\n>>> width =1.10\n>>> area = length * width\n>>> area\n2.42000000000000004\n\
    ```\n\n## Counter\n\nCounters are needed tools in programming in order to increase\
    \ or decrease a value every time it is run. The following code is a counter:\n\
    \n```python\n>>> i=0\n>>> i=i+1\n>>> i\n1\n>>> i=i+2\n>>> i\n3\n```\n\n## Counting\
    \ with a While Loop\n\nAnd here's an example of when it's useful to use a counter.\n\
    \n```python\n>>> i=0\n>>> while i<5:\n    print(i)\n    i=i+1\n0\n1\n2\n3\n4\n\
    ```\n\nThe above program will count from zero to four. Between the word while\
    \ and the colon, there's an expression that is going to be true at first and then\
    \ become false. As long as that expression is true, the following code is going\
    \ to run. The code that has to be run has to be indented. The last declaration\
    \ is a counter that adds one to the value for every time the loop runs.\n\n##\
    \ Multiplication Table\n\nTo make a multiplication table in Python, use the following\
    \ code:\n\n```python\ntable=8\nstart=1\nmax=10\nprint(\"The table of \" + str(table))\n\
    print(\"*20\")\ni=start\nwhile i <= max:\n    print(str(i) + \"*\" + str(table)\
    \ + \"=\" + str(i*table))\n    i+=1\nprint(\"*20\")\nprint(\"Done counting...\"\
    )\n```\n\nThe output for this code is going to be as follows:\n\nOutput:\n\nThe\
    \ table of 8\n\n1*8=8\n2*8=16\n3*8=24\n4*8=32\n5*8=40\n6*8=48\n7*8=56\n8*8=64\n\
    9*8=72\n10*8=80\n\nDone counting.\nAnd that's how you use math in Python. Now\
    \ let's look at exception handling in Python in the following chapter.\n\n## Chapter\
    \ Ten - Exception Handling in Python\n\nBefore you get into what you can do with\
    \ exceptions, you first have to know what they are. An exception is an error that\
    \ occurs while a program is running. When that error happens, Python will generate\
    \ an exception that can be used in order to avoid crashing the program.\n\nExceptions\
    \ are convenient for handling special conditions and errors in programs. When\
    \ you believe you have a code that is able to produce an error, then you can put\
    \ in an exception handle. You can raise this exception on your own with the raise\
    \ exception declaration. Rising an exception will break the current code execution\
    \ and return the exception to the previous code until it can be handled.\n\nHere\
    \ are some common errors you might see in your program\n\n- IOError – the file\
    \ is unable to be opened.\n- ImportError – Python is not able to find the module.\n\
    - ValueError – this is brought up when a built-in operation or function obtains\
    \ an argument that might have the right type but not the right value.\n- KeyboardInterrupt\
    \ – this is brought up when the user interrupts the program.\n- EOFError – this\
    \ is brought up when the end of a file is reached unexpectedly.\n- ZeroDivisionError\
    \ – this is raised when you try to divide by zero.\n\n## Set Up Exception Handling\n\
    \nIn order to use exception handling, you have to use try and except blocks. The\
    \ try block contains the code that might throw an exception, and the except block\
    \ contains the code that handles the exception.\n\n```python\ntry:\n    number\
    \ = int(input(\"Enter a number: \"))\n    result = 10 / number\nexcept ValueError:\n\
    \    print(\"That was not a valid number!\")\nexcept ZeroDivisionError:\n    print(\"\
    You cannot divide by zero!\")\n```\n\nYou can also use the finally block to ensure\
    \ that certain code runs regardless of whether an exception occurred.\n\n```python\n\
    try:\n    number = int(input(\"Enter a number: \"))\n    result = 10 / number\n\
    except Exception:\n    print(\"An error occurred\")\nfinally:\n    print(\"Execution\
    \ complete.\")\n```\n\n## How does it work?\n\nException handling in Python works\
    \ by catching errors that would otherwise crash the program. When an error occurs,\
    \ Python creates an exception object and looks for a handler for that specific\
    \ exception. If no handler is found, the program terminates.\n\nExample:\n\n```python\n\
    try:\n    # This code might raise an error\n    x = 1 / 0\nexcept ZeroDivisionError:\n\
    \    # This handles the error\n    print(\"Caught a division by zero!\")\n```\n\
    \nBy using try and except blocks, you can write more robust programs that handle\
    \ errors gracefully.\n"
  mdcn: "\n\n## 第八章 - Python 运算符\n\n有几种不同类型的运算符。包括算术运算符、比较运算符和逻辑运算符。让我们详细查看每一个。\n\n\
    ## 算术运算符\n\nPython 拥有 `-`、`+`、`*`、`%` 和 `**` 运算符。假设变量 'a' 为十，变量 'b' 为二十。因此：\n\n\
