    ```\n\n## 第 9 章 – 类与对象\n\n现在我们已经学习了 C++ 编程的基础知识，是时候来看一些稍微高级的内容了。类是我们所谓的“面向对象编程”的一部分。这允许我们通过使用对象在日常中使用程序。对象可以定义为日常生活中使用的任何东西——例如汽车、电脑、手机等。正如我们现在应该学到的，一个程序是由许多微小的部分组成的，这些部分共同工作以便汽车运行。这些组件中的某些是可以改变的，例如开启汽车上的灯；而另一些则通过我们所谓的“私有”和“公共”变量来区分，换句话说，就是你允许修改的内容和不允许修改的内容（我们稍后会介绍）。\n\
    \n学习 C++ 时，类处于稍微高级的水平，因为它们更复杂。然而，学习它们是非常的，因为它允许我们创建和开发日常使用的程序。它们还允许重用代码并应用于不同的场景。例如，足球队中的每个球员都有名字、年龄和收入，但这些对于每个球员来说都是不同的。在这种情况下，代码将创建类的属性，简单来说每个球员的名字、年龄和收入。\n\
    \n为了写这个例子，我们球员信息的代码看起来如下：\n\n```cpp\nClass Player\n{\n    string name;\n    string\
    \ age;\n    double income;\n}\n```\n\n我们的玩家类现在有了结构。从现在起，每当我们为每个玩家的每个变量声明值时，我们就会创建一个新的记录，或者一个存在于\
    \ Player 类中的新对象。每个对象将包含一个名字、年龄和收入。为了声明每个 Player 类型的变量，我们使用与声明任何其他变量相同的方法：\n\n\
    - Player player1;\n- Player player2;\n- Player player3;\n\n一旦我们像第一个示例那样创建了一个类，我们就可以像之前使用过的任何其他数据类型示例一样使用它。然而，我们还想要限制程序在这些类结构中能够访问和操作的内容。某些对象或类必须始终保持不变（私有类），而另一些是可以更改的（公共）。例如，仅包含名字、年龄和收入的类必须保持私有，因为这是一个常数。另一方面，我们为每个个体声明的变量是公共的，因为这些信息不是常数。\n\
    \n为了在代码中看到这一点，我们将编写如下：\n\n```cpp\nClass Player\n{\nprivate:\n    string name;\n\
    \    string age;\n    double income;\npublic:\n    Player();\n};\n```\n\n执行上述代码行将阻止程序修改名字、年龄和收入的私有类，但允许它修改个人玩家信息的公共类。我们在声明\
    \ private 和 public 之后使用冒号，是因为它们告诉程序之后的所有内容都被视为该类类型。\n\n当我们实际输入和操作公共数据时，我们使用所谓的“构造函数”和“析构函数”。每当我们声明一个类对象时，构造函数就会执行以完成它被编写好的任务。要启动构造函数，我们将编写如下代码：\n\
    \n```cpp\nPlayer();\nPlayer(string,int,double);\n```\n\n这意味着我们已经告诉构造函数使用我们的名字、年龄和收入这三个参数。我们还有一个在顶行没有值的\
    \ Player 类，这给了构造函数为类类型分配或不分配参数的选项。但我们仍然需要告诉构造函数做什么，所以我们会写：\n\n```cpp\nPlayer()\n\
    {\n    name = \"\";\n    age = 0;\n    income = 0;\n}\n```\n\n```cpp\nPlayer(string\
    \ n, int a, double s)\n{\n    name = n;\n    age = a;\n    income = s;\n}\n```\n\
    \n第一个执行的构造函数除了将所有内容设为 0 之外无他事。然而，第二个执行的构造函数必须使用我们的名字、年龄和收入参数。然后，我们只需要按照要求实际声明每个\
    \ Player即可。\n\n- Player player1;\n- Player player2(\"David\",33,95.20);\n\n在代码中看到构造函数的作用时，理解起来要简单得多。基本上，它们根据我们提供的内容创建一个类或一个信息条目。它们在某种程度上为我们做了工作。然而，我们还需要看看析构函数。析构函数与构造函数相反，它们是删除而不是创建数据。例如：\n\
    \n```cpp\n~Player();\n```\n\n这就是 C++ 中类和对象的基础。\n\n## 总结\n\n总而言，通过阅读这本书，你现在应该掌握了理解\
    \ C++ 基础所需的所需的技能，并且现在能够在日常生活中制作程序。这本书还向你展示了我们在制作程序时使用的许多不同类型的代码，这些知识将让你能够用简单的编程技能令家人和朋友印象深刻。在计算机编程这个奇妙而兴奋的世界之旅中，尽可能将这本书作为指南或参考，并永远记住，一旦掌握了基础，C++\
    \ 是很容易学习的。\n\n"
