    \ AND OBJECTS\n\nNow that we have learnt the basics of programming in C++, it\
    \ is time to have a look at something slightly more advanced. Classes are part\
    \ of what we call \"object orientated programming\". This allows us to use programs\
    \ in everyday life by using objects. Objects can be defined as anything that we\
    \ use in everyday life – such as cars, computers, mobile phones, and so on. As\
    \ we should have learned by now, a program is made up of very small parts which\
    \ work together in order for the car to operate. Some of these components can\
    \ be changed, such as turning the lights on and off in the car. whereas others\
    \ cannot be differentiated by what we call \"private\" and \"public\" variables,\
    \ or in other words, what you are allowed to change, and what you are not (but\
    \ we will look at that in a moment).\n\nClasses exist on a slightly more advanced\
    \ level when learning C++ because they are more involved. Learning them however\
    \ is a great reward, as it will allow us to create and develop programs which\
    \ we can use for everyday life. They also allow to reuse code and apply it to\
    \ different scenarios. For example, every player in a football team with a name,\
    \ age and an income, but each of these will be different for every player. In\
    \ this case, the code would create the attribute of class which is simply the\
    \ name, age and income for each player.\n\nTo write this as an example, our code\
    \ for our player information would look like this:\n\n```cpp\nClass Player\n{\n\
    \    string name;\n    string age;\n    double income;\n}\n```\n\nOur player Class\
    \ now has structure. From now on, every time that we declare a value to each of\
    \ the variables of the individual player, we will be creating a new record, or\
    \ a new object that exists within Class Player. Every object will consist of a\
    \ name, age and income. In order to declare the variables of each Player type,\
    \ we use the same method as we would declaring any other variable:\n\n- Player\
    \ player1;\n- Player player2;\n- Player player3;\n\nOnce we have created a Class\
    \ as seen in the first example, we can use it like any other example of data type\
    \ that we have previously used. However, we want to also be able to limit what\
    \ the program is able to access and manipulate within these class structures.\
    \ Some objects or classes must remain the same at all times (private class), where\
    \ some can be changed (public). For example, the class which contains only name,\
    \ age and income must remain private, as this is a constant. On the other hand,\
    \ the variables we declare for each individual is public, because that information\
    \ is not constant.\n\nTo see this in this code, we would write the following:\n\
    \n```cpp\nClass Player\n{\nprivate:\n    string name;\n    string age;\n    double\
    \ income;\npublic:\n    Player();\n};\n```\n\nExecuting the above lines of code\
    \ would prohibit the program from being able to make changes to the private class\
    \ of name, age and income, but would allow it to make changes to the public class\
    \ of individual player information. We use \":\" after declaring private and public,\
    \ because they tell the program that everything afterwards is considered that\
    \ class type.\n\nWhen we actually input and manipulate public data, we use what\
    \ are called “constructors” and “destructors”. Every time that we declare a class\
    \ object, a constructor is executed to perform whatever it has been programmed\
    \ to do. To initiate a constructor, we would write the following code:\n\n```cpp\n\
    Player();\nPlayer(string,int,double);\n```\n\nThis means that we have told the\
    \ constructor to use our three parameters of name, age and income. We also have\
    \ a Player class with no value on the top line, which gives the constructor the\
    \ option to assign or not to assign parameters to the class type. But, we still\
    \ need to tell the constructors what to do, so we would write:\n\n```cpp\nPlayer()\n\
    {\n    name = \"\";\n    age = 0;\n    income = 0;\n}\n```\n\n```cpp\nPlayer(string\
    \ n, int a, double s)\n{\n    name = n;\n    age = a;\n    income = s;\n}\n```\n\
    \nThe constructor that is executed first has nothing to do apart for setting everything\
    \ to the value of 0. However, the constructor which is executed second must use\
    \ our parameters of name, age and income. Then, all that is left for us to do\
    \ is to actually declare each Player as required.\n\n- Player player1;\n- Player\
    \ player2(\"David\",33,95.20);\n\nMuch simple to understand when looking at what\
    \ a constructor does when we see it in code. Basically, they create a class or\
    \ an entry of information based on what we give it. It does the work for us to\
    \ a degree. However, we also need to look at destructors. A destructor is the\
    \ opposite to a constructor in that they remove instead of create data. For example:\n\
    \n```cpp\n~Player();\n```\n\nAnd that is the basics of classes and objects within\
    \ C++.\n\n## Conclusion\n\nIn summary, by reading this book you should now have\
    \ the required basic skills to understand the basics of C++, and should now be\
    \ able to make programs in your every life. This book has also shown you the many\
    \ different types of code we can use when making a program, and this knowledge\
    \ will allow you to impress your family and friends with simple programming skills.\
    \ Use this book as a guide or a reference as much as possible on your journey\
