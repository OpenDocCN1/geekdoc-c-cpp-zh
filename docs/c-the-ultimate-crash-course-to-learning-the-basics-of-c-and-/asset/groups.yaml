    \n```python\n# 这是一个 Python 中的注释\n\nprint(\"Hello World\") # 这也是 Python 中的一个注释\n\
    \n\"\"\"这是一个多行\n注释的示例，跨越了多行。\n\"\"\"\n```\n\n现在既然你已经知道如何与他人协作，以及如何通过注释保持自己代码的整洁，让我们来看\
