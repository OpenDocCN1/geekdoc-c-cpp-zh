    # Chapter Three – Interpreter


    The interpret is usually installed at the /usr/local/bin/python location on machines
    where it''s available. Putting /usr/local/bin in the Unix shell''s search path
    is going to make it able to start it by typing the command: python to the shell.


    When you begin the python interactive mode, it will prompt for the following command
    using three greater than symbols, >>>. It will then print a welcome message that
    states its version number and the copyright notice before it prints the first
    prompt.


    # Interactively


    When used interactively, it''s a good idea to have some standard comments executed
    each time the interpreter is begun. You can do this when you set an environment
    variable PYTHONSTARTUP in the title of a file that contains startup commands.
    This is like the .profile feature of the Unix shells. To do this, add this line
    to the .bashrc file:

    export PYTHONSTARTUP=$HOME/.pythonstartup


    Create the .pythonstartup file and place the python code in it, like:


    ```

    import os

    sos.system(''clear -2'')

    ```


    To exit your interactive prompt, hit Ctrl+D if you''re using a Linux machine.'
- md: "\n# Chapter Four – Importance of Comments\n\nThe comments in python are strictly\
