    # 导言


    C++ 程序简单来说就是一个文本文件，其中包含系列使用特定 C++ 文本的命令。我们可以将此文本文件源文件，它通常以 .CPP 扩展结尾（就像音频文件以 .MP3
    结尾或 PDF 文档以 .PDF 结尾一样）。


    编写 C++ 程序的目的是将一组特定的 C++ 命令组合在一起，计算机会将这些命令转换为机器语言，以执行我们想要完成的任何任务。这个转换过程被称为“编译”，由编译器执行。此外，我们编写的代码必须包含设置和拆除指令，这个过程被称为“链接”。编译和链接的过程合称为“构建”，它将我们的代码构建成机器可执行的
    .EXE 文件，计算机可以像运行它理解的程序一样运行它。


    为了用 C++ 编写程序


    本书将使用示例，供你使用 Microsoft Visual Studio 进行跟练习学习——它是初学者和高级 C++ 程序员的完美伴侣。


    ## 第 1 章 编写你的第一个 C++ 程序


    在我们编写第一个 C++ 程序之前，你需要下载一个名为 Microsoft Visual Studio 的软件，它允许你编写、编译和执行用 C++ 代码语言编写的命令和程序。它也是一个极的程序，当你的程序需要更改或出现问题时，可以使用它来调试和编辑程序。


    ![](img/aab02e7b5f84ac435fc43037356d6c1f_11_0.png)


    作为你的第一个程序，我们将探索基本的“Hello World”（你好世界）程序，这是每个想要学习编写和编码 C++ 的人的必经之路。Hello World
    程序将展示几乎每个用 C++ 编写的程序将共有的最基本的元素。无论程序多么简单或复杂，它仍然需要以下几行非常基础的代码。


    你需要做的第一步是打开 Microsoft Visual Studio 并创建一个新项目。我们将此项目命名为“Hello World”，或者如果你喜欢，也可以命名为“First
    Program”。如果你还不理解这些代码，不要担心，我们稍后会详细查看，并在随后的章节中深入探讨。


    首先，你应该在 Microsoft Visual Studio 中编写以下行：


    ```cpp

    #include <iostream>

    using namespace std;

    ```


    这些第一行代码基本上被称为“预处理器指令”，或者换句话说，让代码知道我们要开始了。<iostream> 单词中的“i”和“o”代表输入和输出，这是每个编写的
    C++ 程序所需要的。最后一行 `using namespace std;` 告诉编译器我们将使用标准库（这种情况下指的是我们正在使用的命令类型）。换句话说，我们告诉编译器（Microsoft
    Visual Studio）要包含名为 <iostream> 的库。该库包含了我们使用的所有函数，我们稍后会详细讨论。


    接下来你应该编写的行是：


    ```cpp

    int main () {

    ```


    这两行告诉程序开始。基本上意味着我们正在向编译器展示程序的“开始”。`{` 在这里非常重要，被称为“左括号”。`}` 非常重要，被称为“右括号”。


    接下来你应该编写的行是：


    ```cpp

    cout << "Hello World" << endl;

    ```


    `cout` 命令用于在屏幕上打印文本。`endl` 命令用于将光标移动到新行。


    最后你应该编写的行是：


    ```cpp

    return 0;

    }

    ```


    `return 0;` 语句用于退出程序并向操作系统返回值。值 0 表示程序成功完成。


