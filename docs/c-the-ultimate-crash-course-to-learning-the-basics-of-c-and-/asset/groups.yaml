    第十一章 - 字符串内置方法


    第十二章 – 列表


    第十三章 - 如何在 Python 中使用字典


    示例 1 – 创建新字典


    结论


    # 引言


    Python 可用于各种项目，许多程序员在选择任何其他编程语言之前都会选择 Python，这是有原因的。Python 可用于 Web 应用程序、系统任务自动化、图像颜色识别，以及许多其他不同的编程任务！


    Python 是一种通用编程语言，创建于 80 年代后期，并以臭名昭著的“蒙提·派森剧团”（Monty Python）命名。成千上万的程序员使用它来完成各种任务，从在英特尔测试微芯片到使用
    PyGame 库构建视频游戏。它是一门类似于英语的短小语言，并且已经存在数百个现成的第三方库。


    程序员选择 Python 而不是许多其他编程语言主要有两个原因。


    第一个原因是可可读性。因为它非常接近英语，使用 ''not'' 和 ''in'' 等单词让你在大声朗读脚本时，感觉不像像在阅读某种被遗忘已久的语言。Python
    严格的标点符号规则也有助于此，你不需要在代码中到处都是大括号。


    此外，Python 有一些被称为 PEP 8 的规则，告诉 Python 开发者如何格式化他们的代码。这意味着你总是知道在哪里换行，而且你从别人那里获取的每段代码看起来都很相似，并且和你的代码一样易读。这使得开发者之间的协作变得非常容易！


    第二个原因是对于你在 Python 中想做的几乎任何事情都有现成的库。这门语言已经存在了二十多年，所以有很多程序员已经精通这门语言，并知道如何编写你想要的内容。所以如果你发现自己有疑问，尝试找一个已经做过的人吧！


    所以，你应该学习 Python 的主要原因是它简单，而且你很容易与其他合作来磨练你的技能。那么，让我们开始吧！


    # 第一章 – 安装 Python


    在进行 Python 编程时，你应该知道的第一点是 Python 已经安装在许多操作系统上。除了 Windows 之外，大多数操作系统都默认安装了 Python。如果你想确认电脑上是否安装了它，请通过运行终端程序打开命令行，并输入
    `python –V`。


    ![](img/aab02e7b5f84ac435fc43037356d6c1f_52_0.png)


    如果你看到版本信息，说明你的电脑已经安装了 Python。但是，如果你收到 `bash: python: command not found` 提示，那么你的电脑可能没有安装。


    按照指令在电脑上下载并安装 ActivePython。


    # 安装


    第一步是访问 Python 网站 http://www.activestate.com/Products/ActivePython，这将带你进入一个可以选择你所在操作系统的网站。如果你使用的是比
    XP 旧的 Windows 版本，需要在继续之前安装 Windows Installer 2.0。


    ![](img/aab02e7b5f84ac435fc43037356d6c1f_53_0.png)


    一旦你找到了所需的安装程序，双击它并完成安装步骤。安装完成后，进入“开始-程序-ActiveState-ActivePython (versions #)-PythonWin
    IDE”，你将看到一个小脚本，告诉你你使用的是哪个版本以及它安装在什么操作系统上。


    # 解释器


    一旦你启动 Python 的交互模式，它会提示你输入下一个命令。

    这通过三个大于符号 `>>>` 显示。如果你想交互式运行 Python 解释器，需要在终端中输入 `python`。


    它看起来像这样：


    ```

    >>> python

    Python 2.7.8 (default, Jun 28 2012, 16:23:35)

    [GCC] 4.2.1 Compatible Apple Clang 6.0 (tags/apple-clang-6.8.0) on darwin

    输入 "help", "copyright" 或 "license" 获取更多信息。

    >>>

    >>> 1 +1

    2

    >>> 你可以在这里输入表达式 _, 使用 ctrl-d 退出

    ```


    # 如何运行程序


    一旦 Python 设置好并且你知道了如何使用解释器，如何在 Python 中运行程序呢？运行程序最简单的方法是输入 `python helloworld.py`。如果你的可执行文件设置为
    `.py`，那么就可以通过文件名运行文件，而不需要先输入 python。


    现在，使用 `chmod` 命令设置执行位，如下：


    - chmod +x hello.py


    现在你可以通过 `./hello.py` 运行你的程序了。


    # 文本编辑器


    在源文件中编写 Python 程序之前，你需要一个编辑器。在 Python 编程方面，有很多编辑器可供选择。只需选择一个适用于你平台的即可。你选择的编辑器取决于你对计算机的经验以及你想做什么。


    # 编写


    （注意：55-58 页的 OCR 内容是重复且碎片化的，我已经清理了结构。）


    # 第二章 – 变量


    变量是区分大小写的。


    你还可以通过多次赋值同时为多个变量分配单个值。变量 a、b 和 c 被分配到相同的内存位置，值为 1；`a = b = c = 1`。


    这里有一些用于入门的变量类型：


    | 整数 | X = 123 |

    | 长整数 | X = 123L |

    | 双精度浮点数 | X = 3.14 |

    | 字符串 | X = "hello" |

    | 列表 | X = [0,1,2] |

    | 元组 | X = (0,1,2) |

    | 文件 | X = open(''hello.py'', ''r'') |


    # 第三章 – 解释器


    解释器通常安装在可可用机器的 `/usr/local/bin/python` 位置。将 `/usr/local/bin` 放在 Unix shell 的搜索路径中将使可以通过输入命令
    `python` 来启动它。


    # 交互式


    当交互式使用时，拥有一些标准注释是一个好主意。你可以通过设置环境变量 `PYTHONSTART` 到一个包含启动命令的文件中来实现。

    '
