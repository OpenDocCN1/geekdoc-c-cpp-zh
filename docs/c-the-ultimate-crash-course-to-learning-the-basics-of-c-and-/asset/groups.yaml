    //\n  9//2=4\n\n## 比较运算符\n\n像 `==`、`<`、`>=` 等比较运算符用于各种值。字符串、数字、映射和序列都可以比较。下面的列表将向你展示比较运算符列表。\n\
    \n- < 小于\n- == 等于\n- <= 小于等于\n- >= 大于等于\n- > 大于\n- <> 不等于\n- != 不等于\n\n## 逻辑运算符\n\
