    # Chapter 3 – OPERATORS\n\nNow that we are familiar in using variables, we can\
    \ expand on our program and start using what are called “operators”. Operators\
    \ are basically symbols which tell the compiler (Microsoft Visual Studio), to\
    \ use mathematics or logic to solve the problems that we have written in code.\
    \ There are 6 types of operators which C++ will most commonly use. These are:\n\
    \n- 1. Arithmetic Operators.\n- 2. Relational Operators.\n- 3. Logical Operators.\n\
    - 4. Bitwise Operators.\n- 5. Assignment Operators.\n- 6. Misc Operators.\n\n\
    We will look at only the main and most important types of operators and define\
    \ what each of the most commonly used symbol in each mean and what they do.\n\n\
    # ARITHMETIC OPERATORS\n\nLet's imagine that we have declared that A equals 10\
    \ and B equals 20. We could use the following arithmetic operators to do the following\
    \ with those variables:\n\n| OPERATOR | WHAT IT DOES | EXAMPLE OF USE |\n| :---\
    \ | :--- | :--- |\n| + | Adds together | A + B = 30 |\n| - | Subracts #2 from\
    \ #1 | A - B = -10 |\n| * | Multiplies the numbers | A * B = 200 |\n| / | Divides\
    \ the numbers | B / A = 2 |\n| % | Gives a percentage | B % A = 0 |\n| ++ | Increases\
    \ integer by one | A++ = 11 |\n| -- | Decreases integer by one | A-- = 9 |\n\n\
    # RELATIONAL OPERATORS\n\nUsing the same variables as above, we could also use:\n\
    \n| OPERATOR | WHAT IT DOES | EXAMPLE USE |\n| :--- | :--- | :--- |\n| != | If\
    \ equal, statement is true | (A != B) is true |\n| > | Is left higher than right?\
    \ | (A > B) is not true |\n| < | Is left lower than right? | (A < B) is true |\n\
    | >= | Is left # greater or = to right? | (A >= B) is not true |\n| <= | Is left\
    \ # lower or = to right? | (A <= B) is true |\n| (A == B) | If not equal, not\
