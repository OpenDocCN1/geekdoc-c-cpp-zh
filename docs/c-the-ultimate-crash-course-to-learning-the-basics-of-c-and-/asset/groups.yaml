    \n# 第 5 章 – 循环 (LOOPS)\n\n我们已经学习了基础编程、变量、运算符和条件。现在我们必须来看一下循环。循环是编程中非常重要的一部分，因为它们让我们的程序能够按照你指定的次数多次运行代码行。你可能认为重复执行同一任务是毫无意义且没用的，但当我们查看接下来的章节时，循环背后的意义对你来说将非常清晰。\n\
    \n让我们来看程序中的以下几行代码。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    int main()\n{\n  cout<<\"1\"<<endl;\n  cout<<\"2\"<<endl;\n  cout<<\"3\"<<endl;\n\
    \  cout<<\"4\"<<endl;\n  cout<<\"5\"<<endl;\n  cout<<\"6\"<<endl;\n  cout<<\"\
    7\"<<endl;\n  cout<<\"8\"<<endl;\n  cout<<\"9\"<<endl;\n  cout<<\"10\"<<endl;\n\
    \n  return 0;\n}\n```\n\n正如你可能看到的，根据我们目前所学的，这个简单的程序将为我们显示从 1 到 10 的数字。你可能猜到，如果你在程序中包含很多这样的行，任务将变得非常无燥单。你能想象设计一个显示从\
    \ 1 到 1000 数字的程序吗？\n\n幸运的是，有一个让我们的工作变得简单多的解决方案。我们可以创建一种语法，将上面的示例转换为单行代码。这种语法将是一个循环，看起来如下：\n\
    \nfor (初始化; 条件; 递增/递减)\n\n这基本上是说：“对于以下内容，执行操作”。初始化是程序的开始（正如你现在应该知道的那样），条件是我们给程序去执行的任何选择，最后，递增和递减代表了在程序循环继续运行时我们想要从起始数字中增加或减少的数值。\n\
    \n下面与上面的示例相同，但这次我们包含了一个循环。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n  int x;\n  for (x=0; x<=10; x++)\n  {\n    cout<<x;\n  }\n \
    \ return 0;\n}\n```\n\n这个程序的执行方式与上面的示例完全相同，用于打印数字，但在这个例子中，我们不需要为程序指定 1 到 10 之间的每一个数字。\n\
    \n让这组新代码更有效的是，我们可以看到使用了 `for(x=0; x<=10; x++)`，这是我们在上面看过的 `(初始化; 条件; 递增/递减)` 语句。在这里，我们在程序开始时声明\
    \ x 等于 0，并且程序会在 x 小于或等于 10 时结束。`x++` 的递增意味着 x 的值在每次循环结束时增加 1。\n\n为了进一步解释，循环运行的条件是程序自问：x\
    \ 等于 10 还是小于 10？如果是，就给 x 加 1。程序然后对自己加1，x 现在的值是 1，等于小于 10 吗？是的，那么我会再加 1。最终，程序会对自己说：“x\
    \ 等于 10，等于或小于 10 吗？是的，我将不会再进行另一个循环并现在结束程序”。这基本上就是循环的工作原理。程序将有一组定义数量的条件会被不断检查，如果这些条件通过或满足，就会有另一个循环或序列的重复。\n\
    \n我们所看到的被称为 `\"for\"` 循环。我们还会看另外两种类型的循环。我们将看到的第一个新循环被称为 `\"while\"` 循环。`while`\
    \ 循环允许你的程序在某些情况下更加灵活，其基本语法看起来如下：\n\nwhile (条件)\n{\n    语句\n}\n\n这基本上是说，“当”条件为真或假时，我将运行已在语句中为我设置的循环。\n\
    \n我们的 `for` 循环程序如果改用 `while` 条件会是什么样？\n\n// 完整运行程序\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int x=0;\n    while (x<=10) {\n  \
    \      cout<<x<<endl;\n        x++;\n    }\n    return 0;\n}\n```\n\n我们的程序将执行与之前相同的任务，只是这次它使用\
    \ `while` 代替 `for` 条件来进行循环。但在本示例中，我们声明了值 0，只是这次它的循环使用的是 `while` 代替 `for`。在这个例子中，我们在程序开始时声明了\
    \ x 的值为 0，这是因为我们在语句中声明了 10 的一组数字。我们可以通过以下方式简化这种循环：\n\n```cpp\nwhile (x<=10)\n\
    {\n  cout<<x<<endl;\n}\n```\n\n这表示当 x 小于或等于 10 时，它会增加一个数字。\n\n我们可以看到的第三种循环类型被称为\
    \ `do-while` 循环。它将执行相同的任务，但条件放在了循环的末尾。例如：\n\n```cpp\n// 完整运行程序\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n  int x=0;\n  do\n  {\n    cout<<x<<endl;\n\
    \    x++;\n  } while(x<=10);\n\n  return 0;\n}\n```\n\n# 第 6 章 – 数组 (ARRAYS)\n\
    \n数组与变量相似，它们允许我们在一个名称下存储一组数据，这在处理大型程序时非常有用。想象一下如果你必须设计一个显示 500 个人的程序？幸运的是，正如我们在上一章看到的，有一种方法不需要手动输入每一行来实现。\n\
    \n数组的语法如下：\n\n```\n类型[索引];\n```\n\n这意味着我们想要列出一系列存储的值。为了创建一个类似于变量的数组，并在 5 个人的年龄示例中，我们会写：\n\
    \n```cpp\nint ages[5];\n```\n\n这意味着我们我们有 5 个被程序称为 `ages` 的项。就像为字母 `x` 声明值一样，我们也必须为这个新变量\
    \ `ages` 声明值。我们可以通过这样做：\n\n```cpp\nint ages[5];\nages[0]=15;\nages[1]=24;\nages[2]=54;\n\
    ages[3]=33;\nages[4]=120;\n```\n\n虽然我提到过有一种更简单的方法来写这个索引，但上面的代码看起来完全一样。这样做的原因是我想向你展示如何声明这种新数据类型。当我们启动程序时，我们告诉它在开始时有一个\
    \ 5 个元素的数组。我们的声明列表从 0 开始，是因为这是计算机读取数字列表的方式。0 总是意味着第一个。\n\n然而，如果我们想以更简单的方式写上面的内容，我们可以写：\n\
    \n```cpp\nint ages[5];\nages = {15,24,54,33,120};\n```\n\n这告诉程序的内容与上面相同，即 0 等于\
    \ 15，1 等于 24，以此此类推。如果我们要在代码中完全写出来，它看起来是什么样？\n\n"
