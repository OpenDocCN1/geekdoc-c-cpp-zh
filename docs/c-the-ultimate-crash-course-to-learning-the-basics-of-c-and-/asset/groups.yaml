    # Introduction


    A C++ program is simply a text file which contains a sequence of commands using
    specific C++ text. We can call this text file the source file, and it will normally
    end in a .CPP extension (just as an audio file ends in .MP3 or a PDF document
    ends in .PDF).


    The purpose of writing a C++ program is to put together a specific sequence of
    C++ commands which will be converted by the computer into machine-language which
    will perform whatever task that we want done. This conversion process is called
    compiling which is performed by the compiler. In addition, the code that we write
    must be written to include both setup and tear down instructions in a process
    which is called linking. Together, the process of compiling and linking is called
    building, which builds our code into a machine-executable .EXE file of which the
    computer can run as a program that it understands.


    In order to write a program in C++


    This book will use examples for you to follow along using Microsoft Visual Studio
    – the perfect companion to both the beginner and more advanced C++ programmer.


    ## Chapter 1 – WRITING YOUR FIRST C++ PROGRAM


    Before we write our first program in C++, you are going to need to download the
    software called Microsoft Visual Studio, which allows you to write, compile and
    execute commands and programs written in C++ code language. It is also an excellent
    program which can be used to debug and edit your program should it need changes
    or if something goes wrong.


    ![](img/aab02e7b5f84ac435fc43037356d6c1f_11_0.png)


    As your first program, we are going to explore the basic “Hello World” program
    which is a must for everybody who is wanting to learn how to write and code C++.
    The Hello World program will demonstrate the absolute bare essentials that nearly
    every program written in C++ will share. It does not matter how simple, or how
    complex a program is, it will still require the following few lines of very basic
    code.


    The first step you need to do, is open Microsoft Visual Studio and create a new
    project. We will call this project “Hello World” or “First Program” if you prefer.
    Don’t worry if you do not understand the following lines of text just yet, as
    we will have a closer look at them in a few moments and explore them deeper in
    the chapters which are to follow.


    Firstly, you should write the following lines in Microsoft Visual Studio:


    ```cpp

    #include <iostream>

    using namespace std;

    ```


    These first lines are basically what we call a “pre-processor directive”, or in
    other words, letting the code to know that we are going to start a program. The
    letters “i” and “o” in the word <iostream> stand for both input and output, which
    is required in every C++ program that is written. The final line, “using namespace
    std”, means that we are telling the compiler that we will be using the standard
    library (a library in this case meaning the type of commands we are using and
    writing). In other words, we tell the compiler (Microsoft Visual Studio), to basically
    “include” the library called <iostream>. This library is what holds all of our
    functions that we use, but more on that in a minute.


    The next lines that you should write:


    ```cpp

    int main () {

    ```


    These two lines tell the program to start. Basically means that we are showing
    the “start” of the program to the compiler. The { is very important here, and
    is known as a “opening brace”. The } is very important here, and is known as a
    “closing brace”.


    The next lines that you should write:


    ```cpp

    cout << "Hello World" << endl;

    ```


    The `cout` command is used to print text to the screen. The `endl` command is
    used to move the cursor to a new line. The final line, “using namespace std”,
    means that we are telling the compiler that we will be using the standard library
    (a library in this case meaning the type of commands we are using and writing).
    In other words, we tell the compiler (Microsoft Visual Studio), to basically “include”
    the library called <iostream>. This library is what holds all of our functions
    that we use, but more on that in a minute.


    The next lines that you should write:


    ```cpp

    return 0;

    }

    ```


    The `return 0;` statement is used to exit the program and return a value to the
    operating system. The value 0 indicates that the program has finished successfully.

