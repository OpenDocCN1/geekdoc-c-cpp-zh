    \ way to communicate with groups of people what the code is supposed to do so\
    \ that they're able to collaborate better. However, there are two ways you can\
    \ add comments to python that are universally accepted in the programming industry.\n\
    \nA single line comment is going to start with the # symbol and is terminated\
    \ by the end of the line. Python will ignore all text that comes after the # symbol\
    \ to the end of that line because it views that as not part of the command.\n\n\
    Comments that span more than a single line is achieved by inserting a mutli-line\
    \ string with \"\"\"\" as the delimiter on either end. They are meant as documentation\
    \ for anyone who is reading the code.\n\nLet's look at two examples that you can\
    \ see what I'm talking about.\n\n```python\n# This is a comment in Python\n\n\
    print(\"Hello World\") # This is also a comment in Python\n\n\"\"\"This is an\
    \ example of a multiline\ncomment that spans multiple lines.\n\"\"\"\n```\n\n\
    Now so you know how to collaborate with others and just keep your code organized\
    \ with comments for yourself, let's take a look at python docstrings.\n\n# Chapter\
    \ Five - Python Docstrings\n\nDocstrings, or python documentation strings, provide\
    \ a nice way to associate documentation with python functions, modules, methods,\
    \ and classes. An object's docstring is made up of a string constant as the first\
    \ statement in the definition of the object.\n\nIt's specified in the source code\
    \ that's used to record a specific piece of code. Unlike regular source code comments,\
    \ the docstring should be a description of what the function does rather than\
    \ how. All functions need to have a docstring.\n\nThis lets the program inspect\
    \ the comments during run time, for example, as an interactive help system or\
    \ as metadata. You can use the _doc_ attribute on objects to access the docstring.\n\
    \n# What It Should Look Like\n\nThe docstring line going to begin with a capital\
    \ letter and end with a period. The first line is going to be a short description.\
    \ Don't write the name of your object. If there's more than one line in the documentation\
    \ string, the second should be blank so that it visually separates the summary\
    \ from the remainder of the description. The rest of the docstring should be one\
    \ or more paragraphs that describe the object's calling conventions and anything\
