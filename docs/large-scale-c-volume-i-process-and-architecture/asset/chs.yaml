  \ C++ 类是否足够实现列表？特别是，让 `Link` 对象的析构函数去销毁另一个相同类型的对象是合理的吗？我们断定答案是定的“不！”相反，我们认为，确保分层所有权由类型系统管理，而不是仅仅由给定类型（或类型）对象实例的运行时配置，是我们应该积极寻求实现的重要设计特征。(135)\n\
