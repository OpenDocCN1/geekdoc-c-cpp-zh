  \ `A` 的接口中使用 `A`”。\n\n**定义：如果一个类型作为函数签名或返回类型的一部分被命名，则该类型在使用接口。**\n\n每当函数声明在参数列表中或作为返回值类型的一部分命名了某个类型时，就说该函数在其接口中使用了该类型。例如，这个自由（即非成员）函数\n\
