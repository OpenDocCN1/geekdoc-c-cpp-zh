  \ 第 2.16 节）。\n\n\n\n\n在我任职 Bloomberg 的早期阶段（约 2004 年），我那蓬勃发展的 BDE 团队正受于成功的烦恼，我需要援兵。当时，我们刚刚聘请了几位更资深的人员（包括我在内），但并没有分配高级人员的名额。我和\
