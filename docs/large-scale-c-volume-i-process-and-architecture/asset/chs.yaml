  \ 开始。\n\n![](img/fig3-176.jpg)\n\n**图 3-176：省略视图，重点强调我们的日期/日历子系统**\n\n在显示涉及多个组件的复杂组件图时，通常（为了减少重叠箭头带来的混乱）会省略如果删除后不会影响图分层的实际直接依赖。这种省略更通称为称为传递还原（transitive\
  \ reduction）（见图 1-59，[第 1.8 节]）。例如，考虑由 `Date` 类引导的子系统（图 3-177），该类在接口中使用 `DayOfWeek`，并在实现中使用\
