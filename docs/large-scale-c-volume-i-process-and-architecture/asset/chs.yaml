  \n现在考虑图 1-5 中稍作修改的程序。在这个例子，`f.cpp` 定义了 `f1()` 和 `f2()`，但只有 `f2()` 使用了 `g()`。尽管 `main()`\
  \ 链接只需要 `f1()` 的定义，合并 `f.o` 也会导致对符号 `g()` 的未解析引用，这需要 `g.o` 以及 `g.o` 所依赖的任何其他 `.o`\
  \ 文件被无缘地合并到我们的程序中。通过将 `f1()` 和 `f2()` 的定义放在不同的编译单元中（此处显示），可以消除不必要的耦合以及随之而来的对 `g.o`\
  \ 的链接依赖。\n\n![](img/fig1-5.jpg)\n\n**图 1-5：共同放置导致的额外链接时依赖**\n\n当我们错误地在源文件中放置逻辑实体时，就损害了物理设计的质量。除了对象文件之间过度的依赖外，两个或多个对象文件之间也可能相互依赖，正如图\
  \ 1-6 所示。\n\n注：参见第 2.15 节。为了确保对物理依赖进行可移植的细粒度控制，我们继续设计得正好像 `.o` 文件以及`组件`（第 0.7 节）是原子的。\n\
  \n现在考虑图 1-5 中稍作修改的程序。在这个例子，`f.cpp` 定义了 `f1()` 和 `f2()`，但只有 `f2()` 使用了 `g()`。尽管 `main()`\
  \ 链接只需要 `f1()` 的定义，合并 `f.o` 也会导致对符号 `g()` 的未解析引用，这需要 `g.o` 以及 `g.o` 所依赖的任何其他 `.o`\
  \ 文件被无缘地合并到我们的程序中。通过将 `f1()` 和 `f2()` 的定义放在不同的编译单元中（此处显示），可以消除不必要的耦合以及随之而来的对 `g.o`\
  \ 的链接依赖。\n\n![](img/fig1-5.jpg)\n\n**图 1-5：共同放置导致的额外链接时依赖**\n\n（注：由于原文中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行了去重处理，仅保留核心逻辑内容的翻译。）**\n\
  \n^(19) 注意，Unix 平台上的 `nm` 命令（在 Windows 平台上为 `dumpbin`）可以用于列出 `.o` 文件中所有未定义的符号和外部可访问定义：\n\
  \n点击此处查看代码图片\n\n```\n$ g++ -I. -c f.cpp\n\n$ nm f.o\n\n0000000000000000 b .bss\n\
  \n0000000000000000 d .data\n\n0000000000000000 p .pdata\n\n0000000000000000 r .rdata$zzz\n\
  \n0000000000000000 t .text\n\n0000000000000000 r .xdata\n\n0000000000000000 T _Z1fv\
  \      // 'T' means: definition provided\n\n                 U _Z1gv      // 'U'\
  \ means: undefined\n\n$\n```\n\n符号修饰（name mangling）这一额外挑战最初是为了适应 C++ 的函数重载而引入的，通过使用\
  \ `c++filt` 等程序可以轻松解决：\n\n点击此处查看代码图片\n\n```\n$ g++ -I. -c f.cpp\n\n$ nm f.o | c++filt\n\
  \n0000000000000000 b .bss\n\n0000000000000000 d .data\n\n0000000000000000 p .pdata\n\
  \n0000000000000000 r .rdata$zzz\n\n0000000000000000 t .text\n\n0000000000000000\
  \ r .xdata\n\n0000000000000000 T f()        // 'T' means: definition provided\n\n\
  \                 U g()        // 'U' means: undefined\n\n$\n```\n\n点击此处查看代码图片\n\
  \n```\n$ g++ -I. main.cpp f.cpp\n\n/tmp/ccq6leho.o:f.cpp:(.text+0x9): undefined\
  \ reference to 'g()'\n\n/tmp/ccq6leho.o:f.cpp:(.text+0x9): relocation truncated\
  \ to fit:\n                          R_X86_64_PC32 against undefined symbol 'g()'\n\
  \ncollect2: error: ld returned 1 exit status\n$\n```\n\n只有当提供了所有的 `main.o`、`f.o`\
  \ 和 `g.o` 时，链接阶段才能成功，例如：\n\n```\n$ g++ -I. main.cpp f.cpp g.cpp\n\n$\n```\n\n这条最终的构建命令静执行成功。\n\
  \n## 1.2.2 对象文件 (`.o`) 文件的经典原子性\n\n对象文件在历史上是原子性的。也就是说，如果一个对象文件被合并到可执行文件中，它将整体被合并。`.o`\
  \ 文件中定义的所有外部可访问符号现在都可以用于解析其他 `.o` 文件中的未定义符号。同样，该 `.o` 文件中的任何未解析符号（无论是否被使用）最终都必须被解析，否则链接阶段将失败。\n\
  \n为了适应 C++ 语言初始版本中一些与 C 相比更高级的语言结构（例如隐式模板实例化和未内联的 inline 函数），所有现代平台现在都支持在单个 `.o`\
  \ 文件中包含多个段（section），使得每个单独的 `section` 都可以独立于 `.o` 的其他部分进行合并（或不合并），稍详细讨论。外部符号定义位于\
  \ `.o` 文件不同部分的程度以及在何种程度上取决于平台和构建配置，这显然不是我们在开发过程中应该考虑的因素（参见第 2.15 节）。为了确保对物理依赖进行可移植的细粒度控制，我们继续设计得正好像\
  \ `.o` 文件以及`组件`（第 0.7 节）是原子的。\n\n现在考虑图 1-5 中稍作修改的程序。在这个例子，`f.cpp` 定义了 `f1()` 和 `f2()`，但只有\
  \ `f2()` 使用了 `g()`。尽管 `main()` 链接只需要 `f1()` 的定义，合并 `f.o` 也会导致对符号 `g()` 的未解析引用，这需要\
  \ `g.o` 以及 `g.o` 所依赖的任何其他 `.o` 文件被无缘地合并到我们的程序中。通过将 `f1()` 和 `f2()` 的定义放在不同的编译单元中（此处显示），可以消除不必要的耦合以及随之而来的对\
  \ `g.o` 的链接依赖。\n\n![](img/fig1-5.jpg)\n\n**图 1-5：共同放置导致的额外链接时依赖**\n\n当我们错误地在源文件中放置逻辑实体时，就损害了物理设计的质量。除了对象文件之间过度的依赖外，两个或多个对象文件之间也可能相互依赖，正如图\
  \ 1-6 所示。\n\n（注：由于原文中存在大量重复段落，译文已根据“不要重复输出原文”的原则进行了去重处理，仅保留核心逻辑内容的翻译。）\n\n\n\n\n\
  \n^(22) 例如，内联函数和函数模板（参见节 1.3.12–1.3.14）。\n\n为了使这种方法生效，编译器必须能够将每个此类符号定义放置在其各自独立的\
  \ `section`（段）中，然后可以独立于 `.o` 文件中的任何其他对象代码将将其合并（或不合并）。随后，链接器的责任就变成了从它所遇到的多个 `.o`\
  \ 文件中分布的可能多个（相同的）定义中恰好选择一个定义，且不会 (1) 报告此类孤立符号的重复定义，或 (2) 除非这些符号满足了某些未定义的引用，否则不会引入此类隔离的符号定义，从而确保链接顺序的独立性。\n\
  \n将每个符号定义放置在各自独立的物理段可能会导致额外的构建时间开销。在不隔离开定义的情况下实现相同效果的一种方法，是将内联函数和函数模板产生的定义符号标记为\
  \ `weak`（弱），这意味着该符号可以用于满足未定义符号引用，但如果被合并到已经采用了该同一未定义符号的另一个弱定义的程序中，则不会导致重复定义符号错误。\n\
  \n除了构建时间性能（例如在某些平台上如何处理异常）之外，还有许多原因可能导致段之间产生相互依赖，从而强制采用混合解决方案，该方案涉及涉及不同的物理段以及将符号标记为\
  \ `weak`。请注意，如果一个典型的链接器尝试将同名的弱符号定义和（正常的）`strong`（强）符号定义合并到程序中（无论顺序如何），都将导致重复定义符号错误。遵循常识性的软件设计实践（参见第\
  \ 2 章）有助于我们满足基础语言要求，如 ODR，^(23)，并规避此类棘手的问题。\n\n^(23) ODR 代表`单定义规则（参见节 1.3，特别是节 1.3.1\
  \ 和 1.3.17）`。\n\n请记住，所有关于物理段以及 `weak` 与 `strong` 符号定义的讨论都远超 C++ 语言标准的规定，在这里提供这些是为了理解如何使用低级工具来实现它的基础。在所有平台上避免将对象代码合并到你的最终可执行程序的唯一可靠方法是将其排除在链接命令行之外。我们对软件模块化的细粒度方法（节\
  \ 0.4）反映了这种思维。\n\n### 1.2.4 库存档\n\n在链接程序时列出每个单独的 `.o` 文件是麻烦且不实际的，即使对于较小的程序也是如此。每个编译系统都包含一个工具，可以将多个对象（`.o`）文件合并为一个名为\
  \ `library`（库，或存档）的单一物理实体。通过将适当相关的对象文件放入库中，我们简化了软件的构建和分发过程。图 1-8 展示了存档器（Unix 平台上的\
  \ `ar`）如何从多个 `.o` 文件创建库。这些库（按照惯，在 Unix 平台上具有 `.a` 后缀）可以提供给链接器。\n\n![](img/fig1-8.jpg)\n\
  \n**图 1-8：创建库文件**\n\n链接器处理库中的 `.o` 文件的方式与直接提供的文件不同。直接提供给链接器的每个 `.o` 文件无论是否都需要被合并到生成的可执行镜像中，而通过库提供的\
  \ `.o` 文件仅在需要时才会被合并。例如，考虑图 1-9 所示的文件集。在编译了每个相应的 `.cpp` 文件后，我们可以如下所示将每个 `.o` 文件放置在命令行上来创建一个运行的程序：\n\
  \n```\n$ CC main.o f.o g.o\n\n$\n```\n\n即使链接和运行 `main` 不需要 `g.o`，链接器也会将 `g.o` 合并到可执行程序镜像中，不必要地增加了其体积。此外，如果\
  \ `g.o` 恰好具有任何 `f.o` 或 `main.o` 无法解析的未定义符号，链接阶段将失败。\n\n![](img/fig1-9.jpg)\n\n**图\
  \ 1-9：在库中共同放置独立的对象文件**\n\n另一方面，我们可以如下将 `f.o` 和 `g.o` 文件封装成库：\n\n```\n$ ar q libstuff.a\
  \ f.o g.o\n\n$\n```\n\n现在，如果我们将 `main.o` 与库链接，一切都是正常的——无论 `g.o` 中是否存在任何可能的未定义符号：\n\
  \n```\n$ CC main.o libstuff.a\n\n$\n```\n\n链接器将使用提供的库 `libstuff.a` 中找到的对象文件 `f.o`\
  \ 解析 `main.o` 中引用的未定义符号 `f()`。由于没有更多的未定义符号，库中另一个对象文件（`g.o`）的存在被忽略了。\n\n### 1.2.5\
  \ “单例”注册表\n\n作为一个示例，考虑实现一个简单的“单例”——更准确地说是进程全局的——注册表^(24)，它是源自公共基类 `BaseEntry` 的多态对象，如图\
  \ 1-10 所示。我们打算留在此注册中的每个具体对象必须派自 `BaseEntry` 并实现虚的 `clone` 和 `print` 方法，以及我们决定的其他函数。\n\
  \n现在，假设我们选择了一种“聪明”的方法，让每个派自 `BaseEntry` 的具体类型自动自注册，如图 1-11 所示。类似的派生具体类 `DerivedEntry2`\
  \ ... 等也被编写了。\n\n为了配合几个 `BaseEntry` 类型的具体派生类测试注册表，我们可以创建一个如下 `main` 函数，它只需将每个注册表项转到\
  \ `stdout`：\n\n```cpp\n// main.cpp\n\n#include <registry.h>\n\n#include <iostream>\n\
  \nint main(void)\n\n{\n    std::cout << Registry::print(std::cout) << std::flush;\n\
  }\n```\n\n我们使用以下链接命令行构建“test”程序：\n\n```\n$ CC main.o registry.o baseentry.o derivedentry1.o\
  \ derivedentry2.o ...\n\n$\n```\n\n当我们运行程序时，我们的输出可能看起来预期的那样：\n\n\n\n\n\n```\nDerivedEntry1\n\
  \nDerivedEntry2\n\n     .\n\n     .\n\n     .\n```\n\n现在，假设我们已经满意，并向客户端发布 `Registry`\
  \ 类、抽象的 `BaseEntry` 接口以及若干有派生项类型。我们可能会天真地尝试将这些对象打包进名为 `libreg.a` 的库中，如下：\n\n###\
  \ 归档程序的名称\n\n归档程序的名称通常为 `ar`，尽管编译器供应商可以自由将其命名为任何名称；例如，微软将其相应的程序称为 `lib`。注意，`ar`\
  \ 需要 `q` 标志（此处所示）。在 Unix 系统上，其他标志（如 `c` 和 `v`）通常与 `q` 一起使用，分别用于在新建库时抑制警告，以及提供有关正在归档内容的详细信息。\n\
  \n[点击此处查看代码图像]\n\n```\n$ ar q libreg.a registry.o baseentry.o derivedentry1.o derivedentry2.o\
  \ ...\n\n$\n```\n\n然后，客户端可能会通过使用以下链接命令行构建测试程序，利用我们的 `main.o` 来验证 `libreg.a` 库的实用性：\n\
  \n```\n$ CC main.o libreg.a\n\n$\n```\n\n但现在，测试程序的输出将变得不同：\n\n```\n(* Empty Registry\
  \ *)\n```\n\n如果这个结果让你感到惊讶，请不要气馁。许多资深开发者在职业生涯的某个阶段都会掉进陷阱。问题在于，与直接在链接器命令行上提供的 `.o`\
  \ 文件不同，从库内部整合翻译单元不是自动的，而是基于*按需*的。调用 `Registry::print` 会导致 `main.o` 中生成一个未定义符号；因此，链接器将自然引入\
  \ `registry.o` 来解析对该外部符号的引用。由于 `main.o` 或 `registry.o` 中没有更多供库解析的未定义符号，因此没有任何派生项\
  \ `.o` 文件被纳入程序中；因此，没有项被加载到注册表中。\n\n像上面描述的注册表可能有其用途。然而，作为专业的软件开发者，我们应该抵制依赖那些根据部署方式表现出不同逻辑行为的脆弱语言结构的冲动（见第\
  \ 2.15 节）。避免任何需要运行时初始化的文件范围或命名空间范围变量的额外原因在第 1.2.7 节中提及，并在卷 II 第 6.2 节中进一步讨论。\n\n\
  注册表的常见用途是支持多态对象的 Java 风格序列化，尽管我们认为这种序列化的价值（value）是可疑的（见卷 II 第 4.1 节）。\n\n### 1.2.6\
  \ 库依赖\n\n库也可能依赖其他库。考虑图 1-12，其中我们有一个定义 `main()` 的文件 `main.cpp` 以及两个组件 `a` 和 `c`。在这个示例中，`main()`\
  \ 程序调用 `a()`，而 `a()` 又调用函数 `c()`。在编译三个 `.cpp` 文件后，对象文件 `a.o` 被加载到库 `libx.a` 中，对象文件\
  \ `c.o` 被加载到库 `liby.a` 中。现在，`a.o` 中对符号 `c()` 的引用可以通过链接库 `liby.a` 来解析，该库包含了定义 `c()`\
  \ 的 `c.o`。\n\nC++ 标准未规定库归档文件如何解析未定义符号，在实践中，这高度取决于实现。在“经典的”Unix 平台风格中，显式指定给链接器的所有\
  \ `.o` 文件都会立即合并，而每个库参数都会按顺序扫描，并在进入下一个参数之前满足任何当前未解析的符号。尝试以错误的顺序链接上述库将失败：\n\n```\n\
  $ CC main.o liby.a libx.a\n\nError: Undefined reference to 'a()'\n\nld returned\
  \ 1 exit status\n\n$\n```\n\n大多数链接器可以被指示重新扫描提供的库，以解析参数列表中后面引用的符号。某些链接器会默认执行这种重新扫描。虽然这种多轮编译/多轮扫描方法（multipass\
  \ approach）使得库的提供顺序（除链接时间外）变得无关紧要，但依赖链接器的这一特性只能掩盖重大的物理缺陷。库与库之间的这种循环依赖还会产生一种关于部署的平台依赖，使得移植变得更加困难。幸运的是，如果我们在物理层上正确地组织软件，我们就永远不需要链接器执行多轮扫描，这种烦人的特定于平台的细节就会变成一个我们可以快速忘记的细节。\n\
  \n```\n$ CC main.o libx.a liby.a\n\n$\n```\n\n![](img/fig1-12.jpg)\n\n**图 1-12:\
  \ 库之间的链接依赖**\n\n良好的物理设计的核心原则（第 2.15 节）是避免库之间的循环依赖。\n\n\n\n\n\n在使用单次扫描链接器的情况下，构建具有循环链接时间依赖的库会遇到这些困难，这是一个更深层次问题的症状：即无法以分层的方式实现、测试和使用这种物理循环的软件。如果我们选择将图\
  \ 1-13 中的 `a.o` 和 `c.o` 打成诸如 `libu.a`，并将 `b.o` 和 `d.o` 打成诸如 `libv.a`（如图 1-14 所示），那么就不需要重复库了：\n\
  \n```\n$ CC main.o libu.a libv.a\n\n$\n```\n\n![](img/fig1-14.jpg)\n\n**图 1-14：库之间的无循环链接时间依赖**\n\
  \n更一般地说，我们几乎总是避免任何实体（逻辑上或物理上）之间的相互依赖更好。如果（出于某种原因）认为相互依赖是必要的，我们建议将这些相互依赖的实体——无论它们是函数、类还是（此处讨论的极罕见情况）翻译单元——打包在一起，而不是分开。关于共同放置的其他原因在第\
  \ 3.3 节中进行了讨论.^(28)\n\n^(28) 注意，单个库内部 `.o` 文件之间的循环物理依赖——即使在具有单次扫描链接器的系统上——在测试整个库时也可能无法被察觉；部分（由于）这个原因，我们在开发过程中特意单独测试每个库组件，仅提供被测试组件预期依赖的其它组件（包括各自的头文件）的访问（见第\
  \ 2.2.14 节 和 2.14.3，以及第三卷第 7.5 节）。\n\n### 1.2.7 链接顺序与构建时行为\n\nC++ 标准没有涉及我们如何在库中打包\
  \ `.o` 文件的（平台特定）细节，然而，如果不理解库在实践中的通用行为，可能会在开发和部署期间导致严重问题。首先，一旦库中的 `.o` 被合并到程序中，该\
  \ `.o` 就会被视为直接通过命令行提供的。整个 `.o` 会被合并到程序中，任何需要的、无法通过之前合并的对象文件解析的未定义符号都将需要合并额外的 `.o`\
  \ 文件，否则链接阶段将失败。\n\n直接向链接器提供具有符号重复定义的 `.o` 文件是一个致命错误，但完全可能在无意中提供一个或多个包含定义相同符号的独立\
  \ `.o` 文件的库。在链接阶段分两次扫描的平台上，所需符号的第一次（或最后一次）出现通常决定了合并哪一个 `.o` 文件。另一种在 Unix 平台上很常见的方法是轮扫描每个库，在进入下一个库之前，先合并所有可以解析当前未定义符号的\
  \ `.o` 文件。在任何种情况下，都没有实用的方法来控制使用多个定义中的哪一个。即使两个符号定义是相同的，包含这些符号定义的相应 `.o` 文件可能并不相同。取决于选择了哪个\
  \ `.o`，可能会拖入其他与其它定义冲突的定义，导致符号重复定义错误.^(29) 同样，由共同定义产生的额外未定义符号可能无法被解析。即使链接成功，磁盘上生成的的可执行文件的大小和组成部分也可能根据链接顺序而不同。确保每个链接器符号只有一个定义，从而避免此类链接顺序的特异性，对于构建过程的稳定（即：可重复且可靠的）至关重要。\n\
  \n^(29) 这种问题也可能发生在编译器在 `.o` 文件的同一个物理节（section）中放置多个定义时，导致了对 `weak* symbol definitions`\
  \ 弱符号定义的需求（见第 1.2.3 节）。\n\n### 1.2.8 链接顺序与运行时行为\n\n还有其他甚至更微妙的方式，处理 `.o` 文件的顺序会影响生成的可执行文件的运行时行为。特别是，文件作用域静态对象（例如用于自动初始化图\
  \ 1-11 中第 1.2.5 节中注册的对象）的构造顺序取决于实现和链接顺序。在 C++ 中，没有任何可靠的方法可以确保一个翻译单元中的文件作用域静态对象在另一个单元之前或之后初始化。C++\
  \ 跨翻译单元提供的唯一保证是，文件作用域静态对象将在进入 `main` 函数*之后*的第一次使用之前被初始化.^(30)\n\n依赖翻译单元之间运行时静态初始化的相对顺序会导致意之外且通常是灾难性的行为。例如，考虑图\
  \ 1-15 所示的情况。客户端代码的成功取决于 `server.o` 中的静态对象在 `client.o` 之前初始化。如果该顺序反过来，`client.o`\
  \ 中 `key` 的值可能是一个指向空字符串的非空指针，但这种行为仍然是未定义的。^(30) 使用 `static` 在命名空间作用域声明对象在 C998/03\
  \ 中被弃用，但在 C++11 中取消了废弃，并在逻辑和物理上都变得等同于在匿名命名空间中声明。此外，C++11 引入的 `constexpr` 构造有时可以用于规避此类初始化的运行时问题。^(31)\n\
  \n^(31) **meyers97**, “Miscellany,” Item 47, pp. 219–223\n\n![](img/fig1-15.jpg)\n\
  \n**图 1-15：依赖初始化顺序（错误）**\n\n```\nconst char *getKey()\n\n{\n\n     static std::string\
  \ key(\"xyzy\");\n\n     return key.c_str();\n}\n```\n\n解决了创建问题，但无法保证对象在所有潜在客户端销毁之前保持有效。动态分配（从不释放）内存可以解决该问题，但我们随后会引入验证工具（如\
  \ Purify）有义务报告的内存泄漏。如果单例恰好控制外部资源（例如数据库连接），那么“泄漏”可能会更加严重。避免文件/命名空间作用域的运行时初始化是第二卷第\
  \ 6.2 节的主题。\n\n### 1.2.9 共享（动态链接）库\n\n最后，我们应该注意到使用“共享对象”或“动态链接库”（分别在 Unix 和 Windows\
  \ 平台上如是）仅增加了观察物理依赖和正确打包逻辑内容的需要。这些类型的库倾向于更像单体式的 `.o` 文件，因为它们被引入进程时是原子的——即全有或全无。与动态库使用相关的复杂性本质上是特定平台的，这里不会对其进行更多讨论。然而，静态链接库将作为进一步分析和讨论的良好心理模型。\n\
  \n## 1.3 声明、定义与链接\n\n\n\n\n在我们构建程序时，发生的大多数情况涉及到编译器（有时是链接器）将命名命实体——如模板、类型、函数和变量——的使用与其对应的\
  \ `definitions`（定义）相关联。将对命名命实体的使用解析为程序内某个特定定义的过程，是通过使用 `declarations`（声明）间接实现的。也就是说，编译器对名称的使用是基于显式声明允许的，而语言规则决定了每个声明如何与其对应的（唯一的）定义相关联。一个名称可以引用不同作用域或跨越编译单元的实体的程度，由所谓的\
  \ `linkage`（链接）决定的。\n\n### 1.3.1 声明 vs. 定义\n\n由于程序可能由多个编译单元组成，并且由于这些编译单元几乎总是单独编译的，因此每个\
  \ C++ 实体的链接规则在语言中都经过了仔细规定，以与当前典型构建工具（尤其是链接器）的能力相匹配。然而，单独编译的物理现实以及典型构建工具的局限性意味着，如果不小心，很容易产生不一致之处——这些不一致之处在编译时甚至链接时可能无法被发现，并可能导致运行时难以发现的崩溃。\n\
  \n许多控制组件构建的规则专门设计设计用于避免此类问题。然而，要理解这些设计规则的动机，首先需要理解 C++ 的 `declarations`、`definitions`\
  \ 和 `linkage` 等基本概念，以及我们的构建工具如何与它们相互作用。理解底层工具的工作原理也有助于让标准中不同构造之间看似任意的链接指定变得更加直观。\n\
  \n**Definition：**\n\n**`declaration`（声明）是一种向作用域中引入名称的语言结构。**\n\n**Definition：**\n\
  \n**`definition`（定义）是一种唯一刻画程序内实体的语言结构，并在适用时为其预留存储空间。**\n\n`declaration` 向作用域中引入一个名称。该名称随后可以在声明可见的任何地方使用，用以引用相应的实体：\n\
  \n更准确地说，声明向作用域中引入了某些东西，通常该东西包含一个名称。然而，从纯技术角度来说，存在一些无关紧要的逻辑结构，例如 `anonymous union`，根据\
  \ C++ 语言的语法，至少 (1) 被视为 `declarations`，且 (2) 并不一定引入名称。此类“无名”声明非常罕见且不重要，以至于对于大多数实际目的来说，可以安全地忽略。在本书书中，我们将采用此处给出的对\
  \ `declaration` 的近似定义，而不是 C++ 语法所隐含的定义。\n\n点击此处查看代码图像\n\n```\ntypedef int Int; \
  \ // 对 'int' 别名的 'typedef' 声明 33\n\nclass Foo;        // 纯（又称“前向”）类声明\n\nenum E\
  \ : int;     // 'int' 举举声明（C++11 起新特性）\n\nint f(int x);     // 函数声明（名称 \"x\" 被忽略）\n\
  ```\n\n从 C++11 开始，我们*可以*将其写为 `using Int = int;`\n\n一个 `definition` 刻画一个实体，并在适当的地方预留存储空间：\n\
  \n点击此处查看代码图像\n\n```\nint a;                          // 变量定义\n\nclass Foo { }; \
  \                 // 类定义\n\nenum E { X };                   // 'E' 和 'X' 的定义\n\n\
  int f(int x) { return x + 1; }  // 'f' 和 'x' 的定义\n```\n\n大多数定义也充当了自身的声明，上面的每个定义都是如此。不幸的是，自定义的定义也会导致微妙的问题。考虑一下当一个在命名空间作用范围内定义的函数也被单独声明时会发生什么——例如在图\
  \ 1-16 所示的头文件中](#ch01.xhtml_ch01fig16)。\n\n但绝非所有情况如此，正如我们稍后演示的。\n\n可能会让你感到惊讶（对我来说也是如此）的是——至少根据\
  \ C++ 语言语法，每一个定义都被视为一个 `declaration`。我们认为这种术语非常不妥当，因为它没有反映一个重要概念：许多定义也是*自定义的*的（例如\
  \ `int x;`），而另一些定义，例如那些位于它们必须被单独声明的命名空间之外的定义（例如 `int ns::x;`），则不是自定义的。在本书书中，当我们使用\
  \ `definition only`（仅定义）这一术语时，我们的意思是定义本身显式地*不是*自定义的。\n\n![](img/fig1-16.jpg)\n\n\
  **图 1-16：在声明的作用域内定义自由函数（一个坏主意）**\n\n你看到这两个问题了吗？在第一种，`foobar` 拼写错误；在第二种，名称 `foobaz`\
  \ 被无意地重载了。在 `xyza_foo.cpp` 文件中包含 `xyza_foo.h` 头文件不会暴露这个问题：编译器将报告声明和定义之间的签名不匹配——仅仅通过在声明的作用域之外定义该实体来实现——如图\
  \ 1-17 所示](#ch01.xhtml_ch01fig17)。\n\n![](img/fig1-17.jpg)\n\n**图 1-17：在声明的作用域外定义自由函数（一个好主意）**\n\
  \n此类非声明性的定义要求定义中使用的名称必须用作用域名称进行限定——无论该作用域是 `namespace`、`struct` 还是 `class`：\n\n\
  点击此处查看代码图像\n\n```\nclass Bar {\n\n    static int s_count;  // 仅声明\n\n};\n\nint Bar::s_count;\
  \        // 如果 's_count' 未在 'Bar' 的作用域内声明，此定义将失败。\n```\n\n大多数非定义的声明可以在给定的作用域内重复任意次数：\n\
  \n点击此处查看代码图像\n\n```\nclass Foo;          // 类声明可以在作用域内重复\n\nclass Foo;         \
  \ // 重复 而不会引起错误。\n\ntypedef int Int;    // 记住 'typedef' 被视为一个\n\ntypedef int Int;\
  \    // 声明，而不是定义。\n\nint f();            // 这是一个函数声明，而不是定义；\n\nint f();        \
  \    // 因此可以重复任意次数。\n```\n\n值得的例外是成员函数和 `static` 成员数据，它们是嵌套在 `class` 或 `struct`\
  \ 定义中的声明，且不能重复。在同一个类定义内有两个相同的 `typedef` 声明（与文件、命名空间或函数作用域不同）也是不可行的；然而，在类定义内部重复嵌套的\
  \ `class`、`struct` 或 `union` 声明是合法的 C++ 代码：\n\n点击此处查看代码图像\n\n```\nclass Bar {\n\n\
  \    static int s_count;  // 静态数据成员声明\n\n        static int s_count;  // 错误！\n\n\
  \    int f();             // 成员函数声明\n\n    int f();                    // 错误！\n\n\
  \    typedef int Int;    // 类作用域内的 typedef 声明\n\n    typedef int Int;          \
  \  // 错误！\n\n    class Baz;                  // 类声明可以在任何重复。\n\n    class Baz;  \
  \         // 没问题。\n\n};\n```\n\n相比之下，定义绝不能重复：\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\n\
  class Foo { };  // class definition\n\nclass Foo { };  // Error!\n\nenum E { };\
  \     // enumeration definition\n\nenum E { };     // Error!\n\nvoid f() { }   \
  \ // function definition (reserves storage)\n\nvoid f() { }    // Error!\n\nint\
  \ i;          // data definition (reserves storage)\n\nint i;          // Error!\n\
  ```\n\n事实上，C++ 语言要求在程序中，每个使用的不同实体必须恰好有一个定义^(36)。这一规则被称为`单一定义规则`（`ODR`），根据所涉及的实体类型，它以不同的方式被解释和实现（见下文）。为了明确跨不同作用域和翻译单元的实体在逻辑上的上的“相同性”，C++\
  \ 标准定义了`链接`（`linkage`）的概念，该概念总结在图 1-18 中。\n\n^(36) 即，用于 ODR 的；参见**iso11**，第 3.2.2\
  \ 节](#ch03.xhtml_ch03lev2sec2-2)，第 36 页。\n\n![](img/fig1-18.jpg)\n\n**图 1-18：C++11\
  \ 标准中逻辑链接定义**\n\nC++ 链接规则允许我们判断在不同作用域或翻译单元中声明的两个名称逻辑上是否指向同一个实体。例如，在文件作用域（或任何其他命名命名空间作用域内）声明的类型或非`static`函数的名称具有`external`（外部链接），这意味着该名称与不同翻译单元中相同作用域下相似声明的名称指向同一个实体。\n\
  \n作为一个更具体的例子，考虑图 1-19，它描述了两个独立的文件：`f.cpp` 和 `g.cpp`。每个文件都声明了一个类 `Foo` 和一个函数 `bar(Foo\
  \ *)`，并且定义了一个唯一的函数（以 `.cpp` 文件命名），该函数调用 `bar`（针对空指针）。由于类 `Foo` 在两个文件中都是在文件作用域声明的，它具有外部链接，因此\
  \ `Foo` 的两个声明指向同一种 C++ 类型。同样，`bar(Foo *)` 也具有外部链接，因此这两个声明都指向同一个函数。因此，该语言保证了 `f()`\
  \ 和 `g()` 必须（表现得）调用同一个函数定义。\n\n![](img/fig1-19.jpg)\n\n**图 1-19：引用相同外部链接实体的声明**\n\
  \n假设我们在图 1-19 的任一文件中将函数 `bar(Foo *)` 声明为`static`^(37)：\n\n^(37) 在 C++98 中在命名空间作用域声明函数为\
  \ `static` 在逻辑上（但物理上不是）等同于将其放在匿名命名空间中（见下文）；从 C++11 开始，它们在（逻辑和物理上）都是等同的。\n\n```cpp\n\
  static void bar(Foo *);\n```\n\n这样做将改变该文件中名称 `bar(Foo *)` 的链接变为`internal`（内部链接），这意味着\
  \ `bar(Foo *)` 的定义不能再存在于其使用的翻译单元外部，因此 `f()` 和 `g()` 不再能调用同一个函数定义。\n\n假设我们不是将 `bar(Foo\
  \ *)` 声明为 `static`，而是将图 1-19 中任一文件的 `Foo` 声明移动到匿名命名空间：\n\n```cpp\nnamespace { class\
  \ Foo; }\n```\n\n现在，类名 `Foo` 本身具有内部链接，导致它局部于该翻译单元，从而无法从外部定义 `bar(Foo *)`。因此，`f`\
  \ 和 `g` 再次无法调用同一个函数定义。\n\n### 1.3.2 逻辑链接与物理链接\n\n历史上，编译器特别是链接器技术极大影响了 C 以及 C++ 的链接规则和语义。尽管如此，逻辑上的`linkage`和物理上的`linking`是两个不同的概念，^(38)不应混淆：`Linking`指的是将名称的使用与其定义（或含义）绑定的物理行为，而`linkage`用于判断给声明和定义是否引用同一个逻辑实体。\n\
  \n^(38) 当然，我们指的不是同名的 C++ 特性（参见 1.7.6 节和卷卷 4.4）。\n\n### 1.3.3 理解链接工具的必要性\n\n为了将语言规范从特定的实现中抽象出来，`linkage`完全根据其表现定义。然而，理解“链接”的底层细节——例如，最终是由编译器、链接器还是两者将特定的名称使用与其相应的定义（或含义）关联——对于（1）洞察\
  \ C++ 标准的选择至关重要，并且（2）作为基础。\n\n### 1.3.4 物理链接的替代定义：Bindage\n\n值得注意的是，`linkage`一词也曾非正式地用于直接指代这种物理表现。虽然\
  \ C++ 标准对`linkage`的逻辑定义必须优先，但我们仍然认为这种替代的物理意义很有用。从此开始，我们将一致地将这种非正式的物理意义的“linkage”称为`bindage`。^(39,40,41)\n\
  \n\n\n\n虽然 `static` 变量和自由函数可能会被链接器分配特定的地址偏移量，但这种关联必然是局限于翻译单元的，因此（至少在概念上）这种绑定是由编译器完成的。\n\
  \n**定义：**\n\n一个 C++ 构造体具有**外部绑定**（`external bindage`）的条件是：在典型平台上，相应的定义不能在程序的多个于一个翻译单元中出现（例如，为了避免链接时出现重复定义符号错误）。\n\
  \n具有**外部绑定**的语言构造体并不要求该构造体必须与其定义位于同一个翻译单元中；因此，在典型平台上，编译器会在 `.o` 文件中引入产物，随后供链接器使用这些产物来完成将该名称的使用到其（全局唯一的）定义上的绑定。（请注意，当任何构造体的使用与其定义发生在同一个翻译单元内时，编译器有权在编译时完成完全的绑定——包括对未声明为\
  \ `inline` 的函数。）在典型平台上通常在链接时绑定的语言构造体示例包括：非 `static` 的文件作用域（或命名空间作用域）数据和函数、`static`\
  \ 和非 `static` 类成员函数，以及 `static` 类数据成员。图 1-20 对比了一些具有内部绑定和外部绑定的重要定义。\n\n![](img/fig1-20.jpg)\n\
  \n**图 1-20：*内部*与*外部（物理*）绑定对比**\n\n**定义：**\n\n一个 C++ 构造体具有**双重绑定**（`dual bindage`）的条件是：在典型平台上，(1)相应的定义可以安全地出现在同一个程序的多个翻译单元中，且(2)\
  \ 该类型构造体的声明名称的使用及其相应的定义可以在链接时进行绑定。\n\n具有**双重绑定**的语言构造体允许编译器生成定义，这些定义可以同时被 (a) 访问，并在\
  \ (b) 在程序内的多个翻译单元中被复制。在多个翻译单元中拥有定义（例如，函数的定义）增加了在编译时发生绑定的机会——例如，通过内联（由编译器决定）。语言构造体的使用及其相应定义通常可以在编译时或链接时（由编译器决定）绑定的两个主要示例是\
  \ `inline` 函数和隐式实例化的函数模板。我们将从 节 1.3.12 开始进一步讨论内联函数以及类和函数模板（包括 `extern` 模板）的其他物理属性。\n\
  \n从 C++17 开始，第三种这样的语言构造体是 `inline variables`，尽管对于简化常见的模板元编程范式很有用，但当用于促进引入全局状态时（例如在仅头文件的实现中），其益处存疑。\n\
  \n### 1.3.5 链接器工作原理\n\n一个完全（静态）链接的可执行程序镜像完全由函数和数据组成，它们具有 `static` 存储生存期。（其他仅供运行程序使用的存储类型包括存储在程序栈上的\
  \ `automatic` 存储，以及必须在堆上显式分配的 `dynamic` 存储。）每当具有静态存储生存期的实体在翻译单元中被`defined`时，该实体的`符号定义`会被放置在该翻译单元生成的\
  \ `.o` 文件中。每当具有静态存储生存期且未在编译时绑定的实体在翻译单元中被`used`时，代表该实体的`符号引用`会被放置在该翻译单元生成的 `.o` 文件中。请注意，仅有声明永远不会向\
  \ `.o` 文件中引入任何产物；只有通过`using`声明，可能会生成对符号的引用：\n\n点击此处查看代码图像\n\n```\nvoid f(int x);\
  \             // 未生成符号引用。\n\nstruct Foo {\n\n        static int d_bar;  // 未生成符号引用。\n\
  \n};\n```\n\n点击此处查看代码图像\n\n```\n// ...\n\nf(3);                   // 生成了符号引用。\n\n\
  int y = Foo::d_bar;     // 生成了符号引用。\n```\n\n然而，在函数模板的情况下，通常也会生成一个隐式实例化的定义。\n\n当程序构建时，将由链接器把每个未定义的符号引用分配给具有静态存储生存期的实体的唯一定义，然后解析所有所有这些的引用——即填充缺失的地址信息。意料之中，正是这些实体——即那些具有\
  \ `external`（或 `dual`）绑定的实体——语言提供了语法，允许它们与其定义分开声明。同时，仅凭这些声明就足够编译器生成代码，在从未见过其定义的情况下充分利用该实体。\n\
  \n尽管我们断言在本地声明一个具有非 `internal bindage` 的构造体且不在同一翻译单元中提供其定义（更准确地说不在 `.h` / `.cpp`\
  \ 对中）是坏习惯（参见 节 1.6.3），但只要在链接时需要从某个其他翻译单元的 `.o` 文件中找到每个用处的合适定义，这对于 C++ 语言来说并不是绝对的错误。\n\
  \n### 1.3.6 需要程序级唯一地址的实体遍历\n\n作为一个简单的说明性示例，假设我们的整个程序恰好由两个文件组成，每个文件分别编译：\n\n点击此处查看代码图像\n\
  \n```\n// file1.cpp                     // file2.cpp\n\nint g();               \
  \                 int f()                // 外部绑定\n\nint f();                   \
  \      {\n\n                                     return 5;\n\nint main()       \
  \                }\n\n{\n\n    return f() * g();            int g()            \
  \    // 外部绑定\n\n}                                {\n\n                         \
  \            return f() + 3;\n\n// 'main' 返回 40。            }\n```\n\n在两个文件中都有一个文件作用域的函数\
  \ `f()`（`file2.cpp` 中的定义是自声明）。根据链接规则，文件作用域的 `f()` 具有外部绑定；因此，名称 `f()` 在两个声明中表示同一个实体，`main`\
  \ 中对 `f()` 的调用必须导致调用 `file2.cpp` 中定义的函数。此外，如果我们从两个翻译单元打印 `f` 的*地址*，显示的地址值将是相同的：\n\
  \n注意我们可以在转换中将 `f` 替换为 `&f`。\n\n点击此处查看代码图像\n\n```\n #include <iostream>\n\n// ...\n\
  \nstd::cout << reinterpret_cast<void *>(f) << std::endl;\n\n// 例如 0x401170\n```\n\
  \n现在考虑如果我们在 `file2.cpp` 中声明函数 `f() static` 会发生什么：\n\n点击此处查看代码图像\n\n```\n// file1.cpp\
  \                     // file2.cpp\n\nint g();                                static\
  \ int f()  // 内部绑定\n\nint f();                         {\n\n                   \
  \                  return 5;\n\nint main()                       }\n\n{\n\n    return\
  \ f() * g();            int g()                // 外部绑定\n\n}                    \
  \            {\n\n                                     return f() + 3;\n\n// 此程序无法构建！\
  \           }\n```\n\n\n\n\n\n该程序将无法再次编译。对象文件 `file1.o` 包含对函数 `f()` 的未定义引用，而该函数在任何地方都没有定义：在\
  \ `file2.cpp` 中定义的函数 `f()` 具有内部链接（internal linkage），因此根据语言规范，它永远无法在翻译单元之外通过*名称*被引用。然而，我们可以获取具有内部链接的函数的地址，并且该地址可以返回给另一个翻译单元（并在该处被调用）：\n\
  \n点击此处查看代码图像\n\n```\n// file1.cpp                               // file2.cpp\n\n\
  int g();                                  static int f()\n\nint (*h())();  // function\
  \ returning     {\n\n               // the address of a              return 5;\n\
  \n               // function returning     }\n\n               // an integer\n\n\
  \                                         int g()\n\nint main()                \
  \               {\n\n{                                            return f() + 3;\n\
  \n    int (*f)() = h();                    }\n\n    return f() * g();\n\n}     \
  \                                   int (*h())()\n\n                           \
  \              {\n\n                                             return &f;  //\
  \ The '&' is\n\n// 'main' again returns 40\\.              }              // optional.\n\
  ```\n\n我们可以在 `file1.cpp` 中为 `f` 引入一个新的、独立的定义：\n\n点击此处查看代码图像\n\n```\n// file1.cpp\
  \                              // file2.cpp\n\nint g();                        \
  \          static int f()\n\n                                          {\n\nstatic\
  \ int f()                                return 5;\n\n{                        \
  \                 }\n\n    return 10;\n\n}                                     \
  \    int g()\n\n                                          {\n\nint main()      \
  \                              return f() + 3;\n\n                             \
  \            }\n\n    return f() * g();\n\n}\n\n// 'main' now returns 80.\n```\n\
  \n### 链接分析\n\n`f()` 的两个 `static` 声明都具有内部链接，因此它们并不指向同一个逻辑实体。在物理层面，编译器将每个定义符号标记为局部的，因此对于链接器而言，它在包含该符号的\
  \ `.o` 文件之外的 `.o` 文件是不可见的（内部绑定）。因此，`main` 函数将使用定义在 `file1.cpp` 中的 `f()` 定义，而 `g()`\
  \ 将使用定义在 `file2.cpp` 中的定义。\n\n值得注意的是，由于 `f()` 在各自文件中的定义源码是可见的（在它们自己的翻译单元中），编译器完全可以抑制两个\
  \ `f()`定义的生成，并将每个对 `f()` 的调用替换为相应的函数体，就像这些函数也被显式声明为 `inline` 一样^(46)事实上，我们可以在 `f()`\
  \ 的任意一个定义中删除 `static` 关键字（但不是两个）而不会产生冲突，因为至少有一个定义对于其翻译单元是局部的（因此具有内部链接和绑定），在逻辑和物理上与另一个定义是不同的，因此没有违反\
  \ ODR（定义规则）。\n\n^(46) 注意，将函数声明为 `inline` —— 虽然许多编译器仍将其视为一种强力提示 —— 但并不能保证定义实际上会在调用处被替换。\n\
  \n### 1.3.7 调用者编译器需要定义源码的构造\n\n在程序中仅存在一个*逻辑*定义的物理意义取决于所定义实体的类型。虽然所有定义必须（在某种程度上）在程序内是唯一的，且具有外部链接的名称可以跨翻译单元表示同一个逻辑实体，但只有函数和具有静态存储周期的对象会体现在链接器生成的可执行程序映像中。对于所有其他类型的实体，编译器需要访问实体定义的源码才能充分利用。\n\
  \n值得指出的是，由于在各自文件中 `f()` 定义的源码是可见的（在它们自己的翻译单元中），编译器完全可以抑制两个 `f()` 定义的生成，并将每个对 `f()`\
  \ 的调用替换为相应的函数体，就像这些函数也被显式声明为 `inline` 一样。对于那些编译器需要访问实体定义源码才能进行使用的构造，ODR 允许在程序中出现多个定义出现，只要（1）该定义在每个翻译单元中最多出现一次；（2）每次出现都具有相同的含义。\n\
  \n现在考虑一个可能需要看到定义的构造示例，例如内联函数。图 1-21 显示了三个内联函数 `max`、`min` 和 `half`，它们在 `file1.cpp`\
  \ 和 `file2.cpp` 中都显式定义了。这三个内联函数 —— `min`、`max` 和 `half` —— 的链接是外部的。如果我们编译这些源文件并将它们链接到同一个程序，结果将是非法的。\n\
  \n![](img/fig1-21.jpg)\n\n**图 1-21：理解内联函数定义的含义**\n\n图 1-21 说明了为了使内联定义唯一，ODR 的要求。对于\
  \ `max` 情况，两个文件中的字符序列是相同的，且对应的标记具有相同的含义：目前为止良好。然而，对于 `min` 情况，情况并非如此：尽管行为可能是相同的，但标记序列并不相同；因此，程序会被视为是非法的，尽管不需要诊断。最后，尽管编译后的代码几乎肯定相同，源文件中对\
  \ `valueX` 的解释并不相同；因此这种微小的差异在技术上也会导致程序被视为非法（不需要诊断）。\n\n注意，图 1-21 中的示例是为了说明编译器可能需要看到定义的构造。然而，在多个源文件中实现相同的标记序列，最佳方法是通过规范地使用头文件（参见\
  \ 1.4 节）。我们将进一步讨论内联定义的底层物理影响等（参见 1.3.12 节）。\n\n### 1.3.8 并非所有声明都需要定义才能使用\n\n实体的声明必须始终可见。然而，某些声明本身是有用的。例如，`typedef`\
  \ 声明是一种结构别名，在编译或链接时都不需要相应的定义即可完全使用^(47) 声明的使用方式会影响定义是否也需要可见。例如，用户定义类型（如 `class`、`struct`\
  \ 或 `union`）的声明可以创建指向命名类型对象的指针和引用，甚至允许在函数原型中以按值传递的方式使用该名称^(48)，而无需编译器看到该类型的相应定义：\n\
  \n然而，注意别名类型本身可能也是需要已知的，就像直接使用它时一样。\n\n\n\n\n\n请注意，从 C++11 开始，语言能力已扩展到支持将 `incomplete`（不完全）类型作为模板参数（例如容器），并且从\
  \ C++17 开始，两个库容器 — `std::vector` 和 `std::list` 现在被要求做到这一点。与 C++ 标准本身一样，除非明确文档说明支持，否则不应假设模板支持不完全类型参数。\n\
  \n点击此此处查看代码图像\n\n```\nclass Opaque;\n\nstatic Opaque *p = 0;\n\nOpaque f(const Opaque&\
  \ x); // 'Opaque' 是按值返回的！\n```\n\n通过在可行的情况下将仅有类的声明（请参见 第 1.7.5 节）放在组件的头文件中，而不是总是\
  \ `#include` 它的定义，我们通常可以大幅减少不必要的编译时耦合（参见 第 3.10 节 和第二卷第 6.6 节）。\n\n### 1.3.9 客户端编译器通常需要看到类定义\n\
  \n然而，仅有类声明并不能足够的信息来创建该用户定义类型的对象、调用该类型的方法、继承该类型、在另一个用户定义类型中嵌套该类型的对象，甚至不知道该类型（对象）的\
  \ `sizeof`。在类定义内部，通常存在着其他的声明和定义。特别是，类成员函数和静态类数据成员本身只是具有外部链接（external linkage）的实体的声明\
  \ — 对它们的任何使用都可能必须在链接时解决。当需要的不仅仅是用户定义类型的名称时，客户端编译器必须已经见过该类型的对应定义：\n\n点击此此处查看代码图像\n\
  \n```\nstruct Point {     // 类型 'Point' 的可见定义\n\n        int d_x;\n\n        int\
  \ d_y;\n};\n\nPoint q;           // 计算大小时需要类型定义\n\nint getX(const Point& p)\n{\n\
  \    return p.d_x;  // 计算偏移量需要类型定义\n}\n```\n\n在上面的代码段中，编译器需要看到用户定义类型 `Point` 的定义才能创建对象\
  \ `q`，因为编译器需要能够计算 `sizeof(Point)` 以为 `q` 留出适当的存储。同样，编译函数 `getX` 需要 `Point` 的定义，因为编译器需要能够确定数据成员\
  \ `d_x` 在由 `p` 指向的对象中的偏移量。而且，由于编译器可能需要从最终合并到单个程序的多个编译单元内部访问类型的定义，ODR（定义唯一规则）允许每个不同的用户定义类型的定义在每个编译单元中重复（一次），如图\
  \ 1-22 所示。\n\n![](img/fig1-22.jpg)\n\n**图 1-22：跨越编译单元的类型 `Point` 的唯一定义**\n\n再次，我们并不提倡将此类源码重复作为一种设计实践，而是在解释底层平台的“基础知识”。在本卷的后后部分，会有大量关于如何实现健壮、可用且可维护软件的建议（例如，参见\
  \ 第 3 章）。\n\n### 1.3.10 用户编译器必须看到定义的其他实体\n\n对于许多其他实体的使用，编译器必须能够看到定义的源码才能为该使用生成代码。在实践中，编译器简单地生成代码，假设程序将遵守\
  \ ODR 的所有要求。如果程序没有遵守，它就是畸形式的（ill-formed）且行为是未定义的，尽管 C++ 语言标准并没有规定编译器或链接器有义务诊断此问题。\n\
  \n### 1.3.11 枚举具有外部链接，但那又如何？！\n\n在实践中，违反 ODR 是相对常见的现象。例如，考虑图 1-23 所示的两个省略的 `.cpp`\
  \ 文件。如果这两个编译单元产生的 `.o` 文件被链接到同一个程序中，那么该程序在技术上是畸形式的，因为每个编译单元都包含文件作用域内名为 `Status`\
  \ 的外部链接实体的定义，但这两个定义显然是不相同的。\n\n![](img/fig1-23.jpg)\n\n**图 1-23：`enum` 具有外部链接和内部绑定**\n\
  \n另一方面，所有枚举名称和枚举常量都具有内部绑定（internal bindage）。因此，在几乎所有相关的平台上，此类细微的 ODR 违反通常不会被检测且没有不良影响，因为传统的编译器没有办法检测跨编译单元的不一致性，而且类型\
  \ `Status` 的任何痕迹通常不会出现在 `.o` 文件中，从而让链接器没有任何机会对此发表意见。然而，这些潜在的缺陷可能会变成问题。即使是一个微小的增强，例如在这些物理上隔离的枚举定义上重载外部链接的输出运算符，也可能在\
  \ `.o` 文件中引入伪影，导致构建失败，或者更糟糕，导致程序在运行时出现异常。\n\n不建议在文件作用域上草率地创建命名类型并冒导致技术上畸形程序的风险（尽管在实践中是无害的）。一如既往，将命名实体封装在匿名命名空间内可以保证其剥离任何外部链接，从而确保它不会直接或间接地（逻辑上或其他）与其他编译单元中的实体冲突。\n\
  \n### 1.3.12 内联函数是一个特殊情况\n\n内联函数的特殊之处之处在于，其定义 (1) 必须在调用它的每个编译单元中都可用，并且 (2) 在源码和目标代码层面都可以跨编译单元重复。由于调用者的编译器由于可以访问定义源码，此类函数可能由编译器或链接器进行“链接”，取决于编译器是否决定^49\
  \ 在调用处替换函数体。如果没有，编译器将需要在当前编译单元中放置该函数的行外版本，以确保链接器至少找到一个定义。因此，我们说声明为 `inline` 的函数具有双重绑定（dual\
  \ bindage）。\n\n^49 编译器对何时执行绑定选择可能会受到启发式算法的影响，例如尝试最小运行时间或生成的目标代码量 —— 例如，每当替换函数体产生的比调用非内联版本所需的更少目标代码时。\n\
  \n现代编译器在 `.o` 文件中生成内联函数定义的方式使得 (1) 在链接器从分离的 `.o` 文件发现的多个（相同的）定义中，只有一个会被包含在最终的可执行文件中，并且\
  \ (2) 包含此类定义可以满足该未定义符号，而无需必然引入当前 `.o` 文件的其他部分（除非是间接地为了满足与该一个内联函数定义相关的额外未定义符号）。^50\n\
  \n\n\n\n\n正如 1.2.3 节所述，链接器现在为 `.o` 文件提供了独立的节，这些节的行为就像它们各是库存档中一个独立的 `.o` 文件一样。也就是说，链接器会搜索\
  \ `.o` 文件中的每个独立节以寻找所需的符号定义。如果合并了这样一个节（这仅发生在解析未定义引用时），则只有该特定节的代码和相关的未定义符号引用成为程序的一部分。编译器会将每个需要的内联函数定义存放在\
  \ `.o` 文件中（至少在概念上是），且每个节仅有一个。因此，从程序中任何翻译单元对应的 `.o` 文件中合并其中一个（相同的）内联函数定义，对最终可执行文件产生的影响（逻辑和物理上）是完全相同的。\n\
  \n如果需要内联函数的地址，则要求该地址在整个程序中必须是唯一的。对声明为 `inline` 的函数取地址可能会导致编译后的函数定义的一个行外拷贝被放置在当前翻译单元的\
  \ `.o` 文件中，但并不阻止该函数体在所有直接调用的地方被替换为内联。此外，内联函数的地址仅在给定的翻译单元内取地址时才有意义；如果没有取地址（且编译器在本地使用处都成功进行了函数内联），则不需要为了当前翻译单元而在此\
  \ `.o` 文件中出现该内联函数的定义。\n\n从历史上来说，由于工具链的局限性，内联函数具有内部（物理）绑定，因此实际上具有内部（逻辑）链接。也就是说，在不同翻译单元的相同（命名）作用范围内声明具有相同签名的两个内联函数被视为引用不同的逻辑实体。早期的\
  \ C++ 编译器会在每个需要非内联版本函数的翻译单元中，为其创建一个等同的独立文件作用范围 `static` 拷贝。随后对内联函数取地址会在不同翻译单元间产生不一致的结果。这种行为被认为是一个错误，因为声明函数为\
  \ `inline` 要求对逻辑行为完全没有任何影响。在内联函数内部定义 `static` 数据同样存在类似的问题。注意，C++17 采用的 `inline variables`\
  \ 解决了物理上相似（尽管尚存疑）的需求。\n\n请注意，递归调用内联函数是另一种促生成定义行外拷贝的方法。\n\n具有静态数据的内联函数可能需要额外的考量。\n\
  \n然而，在某些平台上，每当内联函数被调用时，非 `inline` 定义都会在本地生成——即使它被编译器替换为内联。在这种情况下，定义的拷贝将仍然是链接器在解析其他翻译单元中的未定义符号时的可行候选对象。\n\
  \n### 1.3.13 函数和类模板\n\n模板是 C++ 语言的另一个复杂特性，其逻辑和物理属性值得大量的讨论。模板像类和函数一样，在文件作用范围内具有外部链接。也就是说，在不同翻译单元的相同（命名）命名空间内标识相同的两个类模板或函数模板引用同一个实体。然而，模板与类和函数都不同，在于它们不被直接使用，而是被用于实例化这些类和函数。\n\
  \n### 1.3.14 函数模板与显式特化\n\n让我们先检查函数模板的属性。作为一个简单而实用的例子，考虑图 1-24 所示的通用同构比较函数 `compare`。该函数根据其符合类型参数的相对值，返回负整数、0\
  \ 或正整数值。\n\n关于什么使一个类型符合模板参数的概念（可以使用 C++20 中一种备受期待的功能 **concepts** 进行部分描述；见 1.7.6\
  \ 节），是纯抽象基类（或协议；见 1.7.5 节）函数声明（以及约定；见第二卷第 5 节）在编译时的结构化类比；见 1.7.7 节。\n\n![](img/fig1-24a.jpg)\
  \ ![](img/fig1-24b.jpg)\n\n**图 1-24: 自由（即非成员）`compare` 函数模板**\n\n对于在模板类型参数上使用 `typename`\
  \ 还是 `class`，存在两种观点。教授初次学习 C++ 学生的老师通常认为，使用 `typename` 不那么困惑，因为像 `int` 等基本类型是有效的类型参数，`struct`、`union`\
  \ 和 `enum` 类型也是如此。另一方面，`typename` 仅在极少数情况下需要，我们认为确切知道在何时以及为何需要它有助于对语言有深层次的理解。最后，`class`\
  \ 比 `typename` 短三个字符，当尝试在固定的 79 行长度（这恰好是我们的标准）内收集有意义的参数名时，这是一个真正的优势。因此，尽管 C++98\
  \ 中有了 `typename`，但我们选择较短的 `class` 而非较长的 `typename` 来引入我们的模板参数——完全承认这一选择纯粹出于风格考虑。\n\
  \n`typename` 的起源（与上述讨论完全无关）是因为发现需要区分模板参数的嵌套名称——又称为依赖名（dependent name）——以表示一个类型而非值。对于非依赖名，该名称所代表的内容在模板声明（或定义）时是已知的，而依赖名在实例化点之前无法解析，因为其所依赖的实体取决于提供给模板参数的实际参数。如果意图是让该依赖名表示一个类型，则在它前面必须加上\
  \ `typename`；否则，编译器将假设它是值——即使这会导致语法错误。例如：\n\n```cpp\ntemplate <class A, class B\
  \ = typename A::value_type>\nstruct something_having_a_default_type_template_parameter;\n\
  ```\n\n在这里，`B` 是模板类型参数，但它的默认值是一个依赖类型（相对于 `A`），这要求在它前面加上 `typename`。现在考虑一个相似但细有不同的情况：\n\
  \n```cpp\ntemplate <class A, typename A::value_type V>\nstruct something_having_a_non_type_template_parameter;\n\
  ```\n\n在这种情况下，`V` 是一个依赖类型的模板值参数（再次相对于 `A`），因此我们必须再次使用 `typename` 来明确。\n\n\n\n\n\
  请记住，`typename` 关键字在模板声明和定义之外是被禁止的，这包括完全特化（在本小节稍后讨论），因为根据定义，它们永远不会有任何未解析的模板参数。\n\n\
  最后一点是，模板模板参数（一种我们在实践中从未一次发现过其实用性的结构）在历史上并不允许使用 `typename`（代替 `class`）来引入它们自己的参数。模板模板参数意味着该参数本身必须是一个具有指定数量模板参数的模板。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate <template<class> class H, class S>\n\nvoid f(const\
  \ H<S>& value);\n```\n\n在这种情况下，`f` 的第一个模板参数本身必须是一个具有单个模板参数的模板。注意，该示例中的第一个 `class`\
  \ 不能被替换为 `typename`（尽管从 C++17 开始可以替换了）；请参见 `driscoll.` 另另 `abrahams05` 附录 B，第 307–321\
  \ 页。\n\n为了对此类类型的两个对象调用 `compare`，编译器必须已经见过 `compare` 模板的声明（图 1-24a），这（与其他非成员声明一样）可以在翻译单元内重复：^(58)\n\
  \n^(58) 有人出于可读性考虑，可能会合理地希望看到这样的体：\n\n```cpp\nif (a < b) return -1;\nelse (a > b)\
  \ return 1;\nelse return 0;\n```\n\n他们认为，对于大多数现代编译器，即使在中等优化级别下，生成的对象代码可能是相同的——我们稍后使用优化级别为\
  \ `-O1` 的 `GCC 5.4.0` 证实了这一说法。\n\n点击此处查看代码图像\n\n```cpp\ntemplate <class TYPE>\n\n\
  int compare(const TYPE& a, const TYPE& b);\n```\n\n现在，客户端可以自由地对任意类型的对象调用 `compare`，只要该类型支持\
  \ `<` 运算符的适当（即符合定义的）定义：\n\n点击此处查看代码图像\n\n```cpp\nint result = compare(5, 3); //\
  \ result > 0\n```\n\n看到上述语句后，编译器隐式地生成一个内部^(59) 声明，用于针对 `int` 类型对象的 `compare` 函数模板的显式特化：\n\
  \n^(59) 生成的函数名需要经过恰当的“修饰”（mangled），以避免与具有相同签名的重载函数冲突。\n\n点击此处查看代码图像\n\n```cpp\n\
  int compare(const int&, const int&); // 编译器生成\n                                \
  \     // (内部)\n```\n\n假设没有可用的模板定义源码，编译器只能在 `.o` 文件中生成一个与显式特化函数签名对应的外部未定义符号。\n\n\
  注意，主要出于教学考虑，我们选择不将图 1-24 中的微型函数声明为 `inline`，尽管我们在实践中通常会这样做（就像对一个微小的非模板函数一样）。然而，我们并没有真的需要将函数模板声明为\
  \ `inline`，因为与普通的非 `inline` 函数（具有外部绑定）不同，C++ 语言已经允许函数模板定义在每个翻译单元中重复——无论它被声明为 `inline`。此外，一旦函数的源码可见（无论出于什么原因），编译器都可以完全内联替换该函数的体。\n\
  \n无限定的函数模板定义与无限定函数定义一样，也作为声明。当函数模板定义（在翻译单元内必须是唯一的）可见时，编译器会为该翻译单元内每个不同的隐式生成的声明实例化，分别发射该函数模板定义的一个独立实例化。而且，就像内联函数一样，任何由编译器生成的（隐式或其他方式，见下文）定义生成的函数模板的显式特化，都具有双重绑定。因此，当编译器在当前翻译单元的\
  \ `.o` 文件中生成显式函数模板特化的定义时，它采取的方式使得链接器在不同的 `.o` 文件中找到的多个（相同的）定义中，仅只有一个会被合并到最终的可执行程序。\n\
  \n有时知道函数模板参数的显式类型允许我们更高效地实现结果函数。^(60) 现在让我们考虑我们的泛型 `compare` 函数模板的重要特例，即函数模板的参数类型为\
  \ `char` 时。根据 `compare` 的合约，要求返回的指示相对大小的整数应该是负数、0 或正数，但没有指定具体值。通用合约中的这种灵活性允许我们为\
  \ `char` 的显式特化提供更优的实现，如图 1-25 所示。\n\n^(60) 我们断定，在几乎任何现实应用中，性能——而非本质行为——应该是显式特化的唯一理由，并且（在适用情况下）优先选择重载。\n\
  \n**图 1-25：针对 `char` 的 `compare` 显式特化**\n\n⁶¹ 注意，`a` 和 `b` 都是提升为 `int` 的保持值的整数——无论\
  \ `char` 是有符号还是无符号——因为在所有符合标准的平台上 `sizeof(char) == 1` 且 `sizeof(int) > 1`。\n\n声明显式特化，如图\
  \ 1-25a 所示，告诉编译器我们也将提供它的定义，并使用该定义而不是从模板中隐式实例化一个。因此，任何显式特化的声明必须跟在通用（或类）模板声明之后，并且在在该特定类型使用该模板之前^(62):\n\
  \n^(62) 一致地执行这一点的重要性怎么强调都不为过，这产生了 C++ 语言标准中唯一的韵律诗（实际上是规范文本的一部分）（iso11`\n\n```cpp\n\
  template <class TYPE>\nint compare(const TYPE& a, const TYPE& b); // 通用模板\n\n//\
  \ ...\n\ntemplate <>\nint compare<char>(const char& a, const char& b); // 显式特化\n\
  \n// ...\n\nint result = compare('a', 'b'); // result < 0\n```-```\n\n然而注意，函数模板的显式特化本身并不是模板。除非由编译器生成（隐式或其他方式），否则该定义具有外部绑定，因此在程序中不能出现在多个翻译单元中：\n\
  \n![](img/pro1-50.jpg)\n\n\n\n当然，除非用户提供的显式特化被声明为 `inline`：\n\n![](img/pro1-51.jpg)\n\
  \n从历史上讲，我们一直被告知声明函数为 `inline` 的目的是给编译器提供一个提示，让它尝试在调用点替换函数体以提高性能。这种人类建议的时代正在消逝，就像多年前\
  \ `register` 关键字的命运一样。如今，在确定对一个具有源代码访问权的函数进行内联是否能提高运行时性能方面，编译器几乎总是远胜人类。我们预计，在未来的某一天，当使用现代编译器时，声明一个函数为\
  \ `inline` 的唯一正当理由^(63,64) 将仅仅是允许我们在 ODR（定义定义规则）下，将其源代码放置在多个编译单元中，从而赋予编译器选择是否内联该函数体的机会（即：作为*双重绑定*而非*外部绑定*）。\n\
  \n^(63) 然而，确实一些流行的编译器，如果在函数定义中存在 `inline` 关键字，它们会尝试对模板代码进行更激进的内联，尽管这会导致代码更臃肿、运行时效率更。例如，我们使用\
  \ GCC 5.4.0 对上述 `compare` 函数测试了这一断言；即使使用了 `inline` 关键字，除非我们使用 `-O1` 或更高的优化级别，否则它不会内联；如果没有\
  \ `inline` 关键字，它根本不会内联——即使在 `-O4` 级别也是如此！\n\n^(64) 最近，我们尝试编译\n\n点击此此处查看代码图像\n\n\
  ```\nextern \"C\" int printf(const char *, ...);\n\ntemplate <int N> inline int\
  \ f(int i)\n{\n        return printf(\"%d\\n\", i) + printf(\"%d\\n\", i) + printf(\"\
  %d\\n\", i);\n}\n\ntemplate <int N> int g(int i)\n{\n        return printf(\"%d\\\
  n\", i) + printf(\"%d\\n\", i) + printf(\"%d\\n\", i);\n}\n\nint main(int c, const\
  \ char **v) { return f<1>(c) + g<2>(c); }\n```\n\n并使用 [`godbolt.org`](https://godbolt.org)\
  \ 观察到编译器内联了对 `f`（上方）的调用，但没有内联对 `g` 的调用。\n\n然而，在某些情况下，出于与运行时或代码大小无关的原因（参见 3.10 节），人们可能希望不要内联某些函数。在每个使用的编译单元中声明函数但仅在一个\
  \ `.cpp` 文件中定义它，是确保常规编译器无法在其定义的编译单元之外进行内联的最佳方法。注意，将非成员内联函数声明为 `static` 会使其在逻辑上（内部链接而非外部链接）和物理上（内部绑定而非双重绑定）都成为该编译单元的局部的。\n\
  \n在介绍类模板之前，值得注意的是，与成员函数模板实例化和普通函数不同，每个自由（即非成员）函数模板实例化都被要求编码其返回类型（以及其签名)^(65):\n\n\
  ^(65) 为什么函数模板需要编码返回类型而普通函数不需要，这对于某些人可能并不明显，因此我们通过私信询问了 C++ 标准委员会前库工作组（LWG）主席（2010–2015\
  \ 年）Alisdair Meredith，得到了一个随性的解释（*n.b.*，SFINAE 代表“替换失败不是错误”）：\n\n想象同名函数具有两个重载，它们被限制在相互互斥的情况下触发\
  \ SFINAE。相同的参数集可能会调用不同的重载，这仅由结果类型的 SFINAE 约束决定。因此，结果类型是函数模板签名的一部分，但对于永远不会陷入这些混乱的\
  \ SFINAE 情况的普通函数来说不是。\n\n点击此此处查看代码图像\n\n```\nint compare<int>(const int& a, const\
  \ int& b); // 模板实例化\n```\n\n此外，该符号必须与具有相同签名（以及返回类型）的普通（非模板）函数对应的符号相区别：\n\n点击此此处查看代码图像\n\
  \n```\nint compare(const int& a, const int& b);     // 普通自由函数\n```\n\n这两个实体可以在同一个编译单元的同一个作用域内共存并访问：\n\
  \n点击此此处查看代码图像\n\n```\nint r1 = compare(3, 4);      // 如果重载，调用普通自由\n            \
  \                 // 函数。\n\nint r2 = compare<int>(3, 4); // 总是调用模板特化\n```\n\n上面的语句说明了函数重载与显式特化之间的相似之处和微妙区别。此外，请注意，对于普通函数，适用标准规则，而对于函数模板，必须完全匹配：\n\
  \n点击此此处查看代码图像\n\n```\nint compare(const int& a, const int& b);     // 普通函数\n\ntemplate\
  \ <class TYPE>\ninline TYPE compare(const TYPE& a, const TYPE& b); // 函数模板\n\ntemplate\
  \ <>\ninline long compare<long>(const long& a, const long& b); // 显式特化\n```\n\n\
  例如，对于整数，`max` 返回较大 `int` 的引用：\n\n点击此此处查看代码图像\n\n```\nint ia = 3, ib = 5;\n\nconst\
  \ int& r1 = FooUtil<int>::max(ia, ib);     // 指向 'ib'\n```\n\n\n\n对于 `char` 指针，`max`\
  \ 返回字典序上较大的空字符终止序列中第一个字符的地址：\n\n点击此处查看代码图像\n\n```\nconst char *sa = \"abc\", *sb\
  \ = \"def\";\n\nconst char *r2 = FooUtil<char *>::max(sa, sb);     // \"def\" 中\
  \ 'd' 的地址\n                                                   \n```\n\n对于 `int`\
  \ 指针，`max` 返回较大的 `int` 的地址：\n\n点击此处查看代码图像\n\n```\nint *pia = &ia, *pib = &ib;\n\n\
  int *r3 = FooUtil<int *>::max(pia, pib);     // 'ib' 的地址\n```\n\n对于指向 `int` 指针的指针，`max`\
  \ 返回指向较大的 `int` 的指针的地址：\n\n点击此处查看代码图像\n\n```\nint **ppia = &pia, **ppib = &pib;\n\
  \nint **r4 = FooUtil<int **>::max(ppia, ppib);     // 'pib' 的地址\n```\n\n对于指向 `char`\
  \ 指针的指针，结果也是类似的：\n\n点击此处查看代码图像\n\n```\nconst char **psa = &sa, **psb = &sb:\n\n\
  const char **r5 = FooUtil<char **>::max(psa, psb);     // 'sb' 的地址\n```\n\n图 1-26a\
  \ 仅显示了 `FooUtil` 类模板及其特化版本的声明，每个特化在给定的作用域内都可以重复多次。图 1-26b 显示了它们对应的定义。第一个定义是类模板 `FooUtil`\
  \ 本身的定义。第二个定义是 `FooUtil` 对于任意指针类型的部分特化。部分特化也是一个模板，因为当编译器被要求执行操作时，需要推断类的定义 —— 在这种情况下，对应于所提供的特定指针类型。然而，第三个定义是一个类，而不是类模板，因为\
  \ `FooUtil` 针对 `char` 指针的显式特化没有给编译器留下任何推断的空间。\n\n类和类模板对编译器都有意义，但对链接器没有关系。也就是说，翻译单元的\
  \ `.o` 文件中不会存放任何一类的产物，因为没有跨翻译单元共享的内存地址。请记住，函数与函数模板之间的区别，或者在本例中 —— 类模板成员函数（或其部分特化）的定义与其显式特化成员函数定义之间的区别并非如此。\n\
  \n现在考虑图 1-26c 所示的三个定义。第一个定义是对应于通用 `FooUtil` 类模板的成员函数，它本身是一个模板。在看到（仅）通用 `FooUtil`\
  \ 模板的声明后，当客户端代码调用\n\n点击此处查看代码图像\n\n```\nFooUtil<SomeType>::max(someObjectA, someObjectB)\n\
  ```\n\n编译器将 (1) 内联函数体，或 (2) 生成一个对于类 `FooUtil`、模板参数 `SomeType` 以及函数 `max`（包括其签名）唯一的未定义符号引用：\n\
  \n点击此处查看代码图像\n\n```\nFooUtil<SomeType>::max(const SomeType&, const SomeType&)\n\
  ```\n\n除非另有说明（参见节 1.3.16），否则编译器还将此成员函数模板的显式实例化定义存入 `.o` 文件中，并且 —— 与自由函数模板（或内联函数）的隐式实例化一样\
  \ —— 编译器将以这种方式进行，最多只有一个定义被链接到程序中。也就是说，编译器生成的任何此类函数定义最终将具有“双重绑定（dual bindage）”。\n\
  \n图 1-26c 中的第二个定义对应于 `FooUtil` 在 `char *` 以外指针类型部分特化中的成员函数，它也是一个模板。客户端调用\n\n点击此处查看代码图像\n\
  \n```\nFooUtil<SomeType *>::max(somePtrA, somePtrB)\n```\n\n其中 `SomeType` 是 `char`以外的任何类型，将导致编译器生成一个未定义符号：\n\
  \n点击此处查看代码图像\n\n```\nFooUtil<SomeType *>::max(const SomeType *, const SomeType *)\n\
  ```\n\n同样，编译器（默认情况下）将为特定特化生成一个定义（具有双重绑定），该定义适用于链接器用于解析未定义符号，但不会导致链接器自动拉入此 `.o` 文件中的任何其他定义，也不会与任何其他\
  \ `.o` 文件中的其他（相同的）定义发生冲突。\n\n最后，图 1-26c 中的第三个定义是一个类，而不是类模板，因为 `FooUtil` 针对 `char`\
  \ 指针的显式特化没有给编译器留下任何推断的空间。\n\n### 1.3.16 `extern` 模板\n\n作为潜在的物理优化，我们可能希望指示编译器不要将调用翻译单元的\
  \ `.o` 文件中生成频繁使用的特化定义，但我们仍向调用者编译器暴露定义的源 —— 例如为了内联目的。实现这一特定目标的方便机制（参见 67）是在显式特化的声明开头放置\
  \ `extern` 关键字：注意，这一 C++03 扩展直到 C++11 才正式标准化。\n\n![](img/pro1-66)\n\n然后，在希望编译器生成定义的（通常是一个）翻译单元中，重复该定义（通常通过包含头文件），然后显式重复特化“声明”\
  \ —— 这次不带 `extern`：\n\n![](img/pro1-67)\n\n现在只有 `xyza_compare.o` 文件将具有针对 `double`\
  \ 的通用实例化。注意，如果如所示使用头文件实现，`xyza_compare.cpp` 翻译单元的编译器将看到通用模板定义和两个显式特化声明，后者覆盖了先一个。\n\
  \n值得注意的是，即使使用经典的工具链，客户端编译器仍然有能力（且完全允许）在调用处内联识别出的通用特化代码。`extern template` 声明仅仅抑制了在调用翻译单元的\
  \ `.o` 文件中生成该特化的函数定义，但并没有阻止调用者编译器在适当的情况下（就像以前那样）生成内联代码。之所以可行，是因为在 `.o` 文件中实现通用特化的唯一方法是要求编译器通过实例化通用模板来实现。因此，无论编译器是内联（隐式）还是在指定的\
  \ `.o` 文件中（显式请求）生成定义，该定义保证（由编译器）是相同的。（68）\n\n\n\n请注意，在 GCC 5.4.0 中，`compare` 函数在多达\
  \ `-O4` 的任何优化级别下完全没有被内联。即使将其声明为 `inline`，它也需要至少 `-O1` 的优化级别才会发生内联，这表明 `inline` 关键字在某些编译器中可能继续带有某种建议性的权重，特别是在模板中使用时，因为在模板中本质上没有其他作用。\n\
  \n类模板的行为也类似。在显式特化版本的声明前面放置 `extern template`，可以防止编译器在本地的 `.o` 文件中生成任何成员定义，尽管通用模板的所有实例化——包括此处描述的那些特定的实例化——如果编译器选择这样做的话，仍然会像以前一样在调用处进行内联：\n\
  \n点击此处查看代码图像\n\n```\n// xyza_foo.h\n\n// ...\n\ntemplate <class TYPE>          \
  \     // 通用模板\n\nclass Foo {\n\n  public:\n\n    static int compare(const TYPE&\
  \ a, const TYPE& b)\n\n        {\n\n        return a < b ? -1 : b < a;\n\n     \
  \   }\n\n};\n\nextern template                     // 通用特化\n\nclass Foo<double>;\n\
  \n// ...\n```\n\n只有包含相应非 `extern` 指令的翻译单元的 `.o` 文件会拥有（所有）实例化的成员函数：\n\n点击此处查看代码图像\n\
  \n```\n// xyza_foo.cpp\n\n#include <xyza_foo.h>\n\ntemplate                    \
  \        // 通用特化\n\nclass Foo<double>;\n```\n\n再次注意，当使用头文件时（实际操作中如此；参见第 3.3.4 节），`xyza_foo.cpp`\
  \ 的编译器将看到紧随通用模板定义的显式特化的两个“声明”，而且最终的非 `extern` 版本将胜出。\n\n### 1.3.17 从工具的角度理解 ODR（以及绑定\
  \ Bindage）\n\n涉及到内联函数和函数模板时，理解一个定义是在整个程序中必须唯一的，还是仅在每个翻译单元内唯一的，如果你从实现它的构建工具的角度来考虑，这就不不那么困难了。每当编译器从通用模板定义生成显式特化定义时（无论是隐式的还是通过显式请求），每个这样的定义都将是相同的。已知这一点，编译器也可能决定内联函数，因为这样做产生的结果将始终与链接到它生成的外部可访问函数具有相同的逻辑行为。\n\
  \n鉴于所有这些定义必须保持一致且可交换，因此允许单个程序中存在多个物理定义并无大大益。然而，当程序员为显式特化指定一个自定义定义时（即不仅仅是指示编译器从通用定义中生成一个定义），该定义（它很可能与编译器生成的特化定义不同）必须在整个程序中是唯一的——当然当然，除非该自定义特化版本被声明为\
  \ `inline`。\n\n特别是，图 1-25 中类型 `char` 的 `compare` 用户定义特化、第 1.3.14 节中类型 `char *` 的\
  \ `Foo` 特化，以及图 1-26 中类型 `char *` 的 `Foo` 特化，必须在整个程序中是唯一的，而第 1.3.16 节中类型 `double`\
  \ 的 `compare` 和 `Foo` 的通用特化则不然。这一点以及其他考虑（例如，绑定 bindage）——从工具的角度来看——提供了提供了见解和指导，以便更好地理解\
  \ ODR 固有的复杂性，ODR 尽力做到与工具链无关。\n\n### 1.3.18 命名空间\n\n打开一个具名的命名空间会将命名空间名称引入包围作用域，因此它是一种声明：\n\
  \n点击此处查看代码图像\n\n```\nnamespace xyza { // 引入命名空间名称 'xyza'\n\n    // ...\n\n}\n```\n\
  \n除了名称本身外，没有与此声明对应的定义（或含义），因此命名空间本身没有绑定的概念。然而，在命名空间内部声明的外部绑定或双重绑定结构可能会（在当前翻译单元的\
  \ `.o` 文件中）生成包含命名空间名称的未定义符号引用，因此被视为与文件作用域或不同命名空间中具有相同声明的实体不同：\n\n点击此处查看代码图像\n\n\
  ```\nvoid g();\n\nnamespace xyza { void g(); }\n\nnamespace xyzb { void g(); }\n\
  \nvoid f()\n\n{                   // 例如 (GCC 6.3.1):\n\n    ::g();          // U:\
  \ _Z1gv\n\n    xyza::g();      // U: _ZN4xyza1gEv\n\n    xyzb::g();      // U: _ZN4xyzb1gEv\n\
  \n}\n```\n\n匿名命名空间旨在提供局部于翻译单元的作用域；因此，匿名命名空间内的声明具有内部链接。理论上，人们期望绑定是内部的；然而，标准中的细微异常（直到\
  \ C++11 之前被纠正）强制绑定为外部的。\n\n点击此处查看代码图像\n\n```\nnamespace {\n\nclass Guard {\n\n \
  \   // ...\n\n  public:\n\n    Guard();  // 内部链接且（实际上）内部\n\n    // ...\n\n};\n\n\
  // ...\n\n}\n```\n\n在旧平台上，匿名命名空间内实体的实际绑定是外部的；生成一个独特于翻译单元的长晦符号名称，从而模拟内部链接：\n\n点击此处查看代码图像\n\
  \n```\n// file.cpp\n\nnamespace {      // 匿名命名空间\n\n    void g();\n\n}\n\nvoid f()\n\
  \n{                   // 例如 (GCC 3.4.4)\n\n    g();         // U: __ZN37_GLOBAL__N_file.cpp_00000000_B8746C1Ev\n\
  \n}\n```\n\n在较新的平台上，实现发生了变化以反映不断的标准：\n\n点击此处查看代码图像\n\n```\nvoid f()\n\n{       \
  \          // 例如 (GCC 6.3.1)\n\n    g();          // U: _ZN12_GLOBAL__N_11Ev\n\n\
  }\n```\n\n我们也可以通过仔细、系统的命名（纯粹约定）模拟内部绑定（参见第 2.7.3 节）。\n\n### 1.3.19 关于 const 实体默认链接的解释\n\
  \n最后，值得注意的是，文件（或命名空间）作用域变量默认具有外部链接，而声明为 `const` 的变量——与 语言不同——具有内部链接：\n\n点击此处查看代码图像\n\
  \n```\nint h;              // 外部链接（以及绑定）\n\nconst int i = 0;    // 内部链接（以及绑定）\n\n\
  const int *j;       // 外部链接（以及绑定）\n\nint *const k = &h;  // 内部链接（以及绑定）\n```\n\n\
  注意，只有指针变量本身而不是它所引用的对象是 `const`，默认链接（以及绑定）才会是内部的。\n\n### 1.3.20 声明、定义、链接和绑定的总结\n\n\
  \n\n\n\n如上述详细讨论所示，要从抽象上理解如何区分纯声明、兼具声明作用的定义以及不具声明作用的定义，充其是非常困难的。图 1-27 提供了一份相当详尽的声明与定义的示例列表，包括它们的（逻辑）链接（linkage）以及（物理）绑定（bindage）。\n\
  \n## 纯声明\n\n纯声明有时被称为*前向声明*（forward declarations），因为它们出现在定义*之前*（而不是与定义*同时出现*）。请注意，特别是对于具有外部*绑定*（bindage）的结构体，一个使用*本地*（local）声明的编译器可能永远无法看到其对应的定义，这使得“前向”一词的使用变得可疑。除了极少数内部绑定的结构体（例如\
  \ `class`）外，我们要求对应其外部链接或双重链接定义的声明必须存在于并通过头文件使用（参见第 1.4 节），该头文件需要被该声明的实现者和调用者的翻译单元共同包含。\n\
  \n我们此处的“充当声明作用”是指*自声明*（self-declaring）的定义，而根据需要，我们将不此类定义称为“仅定义”（definition-only）。\n\
  \n![](img/fig1-27a.jpg) ![](img/fig1-27b.jpg)\n\n**图 1-27：声明、定义或两者兼有；链接；绑定**\n\n\
  在接下来的章节中，我们将说明如何通常使用头文件来共享定义（绑定可能由编译器完成）以及纯声明（绑定必须由链接器完成）。在第 1.6 节和第 1.11 节中，我们将介绍组件的基本属性，这些属性\
  \ (1) 将它们区别于仅仅一对同名的 `.h` 和 `.cpp` 文件，(2) 并帮助我们解决上述讨论的许多微妙问题。\n\n## 1.4 头文件\n\n作为工程师，我们力尽早发现错误，尤其是当其他团队的开发者将使用我们的软件时。图\
  \ 1-28 描述了一个熟悉的物理惯用法：与其依赖调用者去猜测我们外部链接函数的签名（图 1-28c），我们作为库开发者的责任是提供一个头文件（图 1-28b），其中包含相应的函数（以及全局变量）声明。通过包含此头文件，我们的调用者（图\
  \ 1-28a）可以在编译时发现许多常见的用法错误，而这些错误在其他可能直到链接阶段或——糟糕的是——运行时才被发现。\n\n![](img/fig1-28.jpg)\n\
  \n**图 1-28：使用外部链接函数定义**\n\n从历史上看，C 语言头文件被用于促进 `typedef` 声明和 `struct` 定义的共享，并使具有外部链接（及绑定）的函数和变量能够在翻译单元之间交互。然而，在经典\
  \ C 中，`.h` 和 `.c` 文件的一一配对远不如今天 C++ 中 `.h` 和 `.cpp` 文件那样常见。\n\n在旧式的 C 程序中，该语言的过程化特性诱导了许多早期开发者过度使用全局数据。头文件主要作为“公共”区域，如图\
  \ 1-29 所示。在这些非结构化的程序中，实现文件往往是单体式的，有时非常庞大（数千行）——源代码近乎任意的划分取决于在“合理”的时间内可以同时编译多少内容。\n\
  \n![](img/fig1-29.jpg)\n\n**图 1-29：一个非结构化的程序**\n\n另一方面，良好的模块化设计鼓励我们积极地划分实现，将相关的实现决策（例如数据）放在一起，并将这些细节隐藏在精心设计的过程化接口之后（参见第\
  \ 3.11.7 节）。在结构良好的 C 程序中，`.h` 文件通常与声明概念模块的接口相关联，而它们的实现被归到 `.c` 文件中。如果使用得当，C 头文件（几乎完全由函数和\
  \ `typedef` 声明，以及 `struct` 和 `enum` 定义组成）重量相对较轻，对调用者生成的 `.o` 文件在实现方面几乎没有贡献（如果有的话）。\n\
  \n因此，在 C 语言中，发现一个注释简短的 `.h` 文件由许多“厚实”的 `.c` 文件支持并不罕见，如图 1-30 所示，并附带了几个*私有*头文件以促进跨逻辑模块内部物理边界的共享。正如我们将很快看到的，这种更粗粒度、较不规则的物理结构部分是由于\
  \ C 语言本身的限制所导致的。\n\n![](img/fig1-30.jpg)\n\n**图 1-30：一个粗粒度的模块化程序**\n\n## 抽象数据类型\n\
  \n除了模块之外，面向对象的范式鼓励我们围绕高效、自包含的数据结构来组织有用功能，这些数据结构可以被任意实例化。这些所谓的*抽象数据类型*（ADTs）自然适用于更细粒度的拆分，具有丰富的接口潜力，且不需要通过私有头文件进行后门访问。由于这些对象往往是自包含的，我们开始将它们视为独立的实体，每个\
  \ ADT 都拥有一个独立的头文件来存放接口。\n\n然而，我们在 C 语言中创建 ADT 的能力受到对高效封装和（逻辑）隐藏数据支持不足的影响。尽管 C Allow\
  \ 我们在 `.c` 文件中分配数据结构并不透明地传递它（通过地址），但 C 并不允许我们限制对作为自动变量（在程序栈上）创建的数据结构的访问。当然，我们可以通过将实现细节归入\
  \ `.c` 文件来隐藏它们，但为了隐藏实现，我们被迫为每次操作支付指针访问和函数调代价（无论该操作有多微小或琐碎）。要在程序栈上创建一个用户定义类型（UDT）的变量，编译器必须知道变量的大小；要知道大小，编译器必须见过数据结构的定义。在\
  \ C 语言中（不同于 C++），看到 UDT 的定义意味着意味着可以直接访问其字段。\n\n\n\n\n\n在头文件中发现许多实现细节也是很常见的——其理由仍然是为了运行效率。`C++`\
  \ 允许客户端的编译器将某些实现细节直接整合到其编译单元（translation unit）中，这通常使我们能够跳过指针间接引用和昂贵的函数调用（更不用说为了每个对象的创建/销毁而进行昂贵的动态内存分配/释放了）。然而，这些效率是需要代价的：现在，对\
  \ `ADT` 实现的更改可能强制客户端不仅要重新链接，还要重新编译！我们将更充分地讨论这种编译时暴露所带来的影响（参见第 3.10 节），以及如何完全避免它（参见第\
  \ 3.11 节）或至少部分避免（参见第二卷，第 6.6 节）。\n\n严格来说，我们不需要头文件来创建多文件程序。回想第 1.3.1 节，`C++` 语言仅要求程序中任何实体的定义最多只能有一个。对于具有外部链接（external\
  \ linkage）和绑定（bindage）的实体，编译器将通过生成强符号定义来强制唯一性，如果重复，将导致链接器报告重复定义的符号（multiply defined\
  \ symbols）。然而，对于其他具有外部链接的定义，我们的责任是确保每个此类定义在需要它的每个编译单元中完全相同的（恰好一次）复制。我们还必须确保与每个需要的外部和双重绑定定义对应的声明也同样地被包含。头文件为履行这些义务提供了一种自然、方便且模块化的机制，同时也用于共享其他具有内部绑定的有用构造（例如，`typedef`）。\n\
  \n某些类型的结构性声明，例如 `typedef` 或预处理器常量（它们不受 `C++` 标准中定义的链接限制），具有内部绑定，因此不需要从一个编译单元到另一个单元保持一致。如图\
  \ 1-32 所示，我们可以放心地在 `file1.cpp` 的文件作用域内将 `Number` 声明为类型 `int`，在 `file2.cpp` 中声明为\
  \ `double`。让 `DEFAULT_VALUE` 在一个 `.cpp` 文件中表示 `3` 在另一个文件中表示 `4.5` 也是可以的。然而，如果在相同的上下文中重复此类构造，它们当然必须保持一致。\n\
  \n![](img/fig1-32.jpg)\n\n**图 1-32：结构性别名在不同编译单元之间可以不同**\n\n另一方面，如果我们想与客户端共享有用的别名（例如回调函数的签名），头文件是我们唯一的选择：\n\
  \n点击查看代码图像\n\n```cpp\n// myevent.h\n\nclass MyEvent {\n\n    // ...\n\n  public:\n\
  \n    typedef void (*EventCallback)(const char *, int, MyEvent *);\n\n    // ...\n\
  \n    int registerInterest(EventCallback userSuppliedFunction);\n\n    // ...\n\n\
  };\n```\n\n具有内部或双重绑定的外部链接定义必须在所有需要它的编译单元中精确地复制。编译单元之间即使出现微小的不一致（如图 1-33 所示），也会违反\
  \ ODR（定义定义规则）并导致程序格式错误，可能产生严重的后果。即使两个定义的含义在逻辑上是等同，如图 1-33e 所示，在跨编译单元的情况下，使用不同的标记序列来表示程序内实体的定义仍然被视为格式错误。请注意，在任何相关平台上未导致意外行为的\
  \ ODR 违反被认为是“良性的”（`benign`）。在第二卷第 6.8 节中，我们将看到当组合使用不同层次的`防御性编程`检查构建的各种子系统时，如何利用这种良性的\
  \ ODR 违反（参见第二卷，第 5.2 节和 5.3 节）。\n\n![](img/fig1-33.jpg)\n\n**图 1-33：不一致的定义导致格式错误的程序**\n\
  \n共享具有外部链接的数据和函数也可以不用头文件来实现，但这不是明智之举。虽然不太可能会为了重新输入整个类来访问其声明的公共方法（或静态数据），但重新输入外部定义的自由函数或变量的声明也并非闻未闻（尽管这是一个坏主意）。\n\
  \n例如，图 1-34 中的文件包含 `x` 和 `g()`（在 `client.cpp` 中）的声明与它们的定义（在 `provider.cpp` 中）之间无意的不一致，但图中的两个文件都可以编译。它们甚至可能成功链接，因为\
  \ `C++` 标准并不要求普通函数的返回类型编码在它的链接时符号中，类型安全链接也不适用于数据。相反，这些潜在的缺陷在运行时之前不会被察觉。\n\n![](img/fig1-34.jpg)\n\
  \n**图 1-34：不一致的外部链接声明是格式错误的**\n\n在 C（以及现在的 C++）中，确保声明与其对应的定义以及潜在客户端在跨编译单元的使用保持一致的、久以来公的规定方法，是将声明放置在头文件中，然后要求所有客户端（即使用所定义实体的编译单元）包含该头文件，并在包含定义的\
  \ `.cpp` 文件作为第一行实质性代码（参见第 1.6.1 节）。如图 1-35 所示，`provider.h` 与 `provider.cpp` 中定义之间的不一致在\
  \ `provider.cpp` 编译时就会暴露。当 `client.cpp` 包含 `provider.h` 时，重新输入声明时可能发生的不一致被消除了。这种使用头文件跨编译单元共享信息的做法，对于当前的静态分析工具对任意大型代码库执行有效的本地验证至关重要。^(72)\n\
  \n^(72) 参见 lippencott16a；参见 lippencott16b 和 lippencott16c。\n\n![](img/fig1-35.jpg)\n\
  \n**图 1-35：使用头文件保证声明的一致性**\n\n在使用自由函数（即非成员函数）时，即使包含头文件也不足以以保证正确性。例如，图 1-36 所示的两个文件都可以编译：`client.cpp`\
  \ 编译通过因为它看到了一个可以使用的 `f` 的声明；`provider.cpp` 编译通过是因为 `f(double)` 的函数定义充当了它自己的声明。`f(int)`\
  \ 的函数声明被编译器简单视为允许的重载，而不是不一致性。^(73) 然而，当我们尝试链接程序时，链接将失败，因为没有函数 `f(int)` 的定义。\n\n\
  ^(73) 注意，不相同但未产生不同重载的签名（例如由于参数类型“过于相似”）当然会在编译期间报告为错误。\n\n![](img/fig1-36.jpg)\n\n\
  **图 1-36：仅靠头文件本身无法保证一致性**\n\n\n\n\n虽然能有效发现遗漏的定义，但即使是链接也无法检测出多余且非必要的定义的出现。我们的目标是验证我们的意图（即：关联的实现文件中每个供外部使用的定义，在头文件中都存在对应的声明），并尽可能早地做到这一点。我们可以通过采用约定（参见第\
  \ 2.5 节）来强制执行这一意图：始终使用限定名语法来定义函数，正如第 1.3 节开头讨论的那样（参见图 1-17、节 1.3.1 节）。由于使用限定名语法的定义并`不会`隐式地作为声明，编译器将要求在命名作用域内直接存在一个对应的声明，如果没有，则报告错误。\n\
  \nC++ 语言为我们提供了两种用于限定命名的替代方案：可以使用命名命名空间或类来实现此目的。如图 1-36 所示，客户端代码是完全相同的——无论使用的是 `struct`（图\
  \ 1-36a）还是命名空间（图 1-36b）。然而，有许多充分的理由倾向于使用 `struct`^(74)（参见图 2-23、节 2.4.9 节）。\n\n\
  ^(74) 在这种情况下，本章提供的基本真理（可能过早地）伴随着一些特定的设计指导。\n\n这里值得注意的是，命名空间可以被 `struct` 无法那样的方式“误用”，如图\
  \ 1-37c 所示。作为一种语法上的便利，开发者在 `.cpp` 文件中打开命名空间，而不是使用限定声明符语法。然而，正如我们之前看到的（图 1-36），声明与定义之间的不一致将不会被发现。通过使用\
  \ `struct` 而不是 `namespace` 作为自由函数和全局数据的作用域，就不会有走捷径的诱惑，而且这样做不会损失任何（有用的）功能。^(75)\n\
  \n^(75) 有时我们需要在命名空间作用域定义自由函数。但在我们的方法论中，此类函数仅限于运算符和应用程序无关的*方面*函数（例如 `swap`），它们的目的是像运算符一样——例如，对于\
  \ ADL（参数依赖查找）；参见节 2.4.9 节。\n\n![](img/fig1-37a.jpg) ![](img/fig1-37b.jpg)\n\n**图\
  \ 1-37：自由函数和全局数据的作用域（好主意）**\n\n`namespace` 是 C++ 中唯一在本质上（故意地）非原子性的结构。与 `struct`\
  \ 不同，命名空间的定义可以关闭稍后重新打开。例如，通过使用 `namespace` 代替 `struct`，其他人可以单方面从我们物理宇宙的任何角落扩展逻辑模块\
  \ `MyUtil`（图 1-37b）（坏主意），如图 1-38 所示。\n\n![](img/fig1-38.jpg)\n\n**图 1-38：从物理遥远的地方夺取\
  \ `MyUtil` 命名空间**\n\n在这种背景下，命名空间的非原子性、非模块化本质与我们提供良好的、逻辑和物理一致的设计原子单元这一更广泛的目标背道而驰。尽管如此，命名空间别名可以限定名称，但（与命名空间本身不同）不能用于重新打开^(76)；尽管如此——从设计上来说——我们的方法论中不需要命名空间别名（参见节\
  \ 2.4 节）。我们将回到确保组件逻辑/物理一致性的核心问题上（参见节 1.6.3 节），再次针对更大的聚合体（参见节 2.3 节）。\n\n^(76) **stroustrup00**,\
  \ 节 8.2.9.3, 第 184–185 页\n\n最后，命名空间结构的任何感知优势都取决于使用 `using` 指令或声明的能力——这是我们不认可的语法权宜。然而，在我们的方法论中，`namespace`\
  \ 的有效常规用法是分组实体。总之，头文件并不是必须的，但——当被客户端和库*都*包含时——它们是有效的。\n\n### 1.5 指令与包含卫士\n\n####\
  \ 1.5.1 指令\n\n我们引入头文件的语法机制是预处理器 `#include` 指令。指令中命名的文件内容将被替换替换指令所在的行。头文件的查找方式由实现^(77)。通常，搜索目录序列是由提供给编译器的命令行参数以及调用它的环境决定的。搜索序列也受指令形式的影响，指令有两种^(78)：\n\
  \n^(77) [注：原文未引用细节]\n\n^(78) 注意，此处所示组件名称添加了 `my_` 前缀，对应于假设所有这些类所在的唯一命名空间。我们方法论中使用的命名策略在第\
  \ 2.4 节中详细描述。\n\n点击此处查看代码图像\n\n```\n#include \"my_headerfile.h\"     // 坏主意\n\n\
  #include <my_headerfile.h>     // 好主意\n```\n\n遗憾的是，C++ 标准没有规定两者之间任何有意义的区别，除非说明如果使用引号（\"\
  \"）形式的实现定义程序失败，它必须回退到使用角括号（< >）形式的实现定义程序。在某种意义上，这赋予了后者更原始的含义。\n\n典型的编译器对于引号形式（\"\
  \"），会先在包含 `#include` 指令的文件的相同目录中搜索，然后再搜索通过其他手段指定的路径；而对于角括号形式（< >），则会跳过对相同目录的搜索。前者的（典型）行为可能很方便，而且服务于两个重要的目的：\n\
  \n1.  方便直接在命令行编译和链接简单程序的构建，而不需要用户指定额外的命令行参数（例如 Unix 平台上的 `-I.`）来识别包含头文件的（当前）目录\n\
  \n\n\n\n\n## 2. 在子系统中本地包含可能非唯一的（尤其是短的）头文件名称（即与 .cpp 文件在同一目录下）时避免歧义\n\n然而，对于规模较大的开发工作，由于可以确保头文件名的唯一性（参见第\
  \ 2.4 节），使用双引号（`\"\"`）来正确选择某个本地头文件而非另一个同名文件是不必要的，同样，这种取决于实现的、默认优先搜索本地目录的权宜措施也是如此。尽管某些编译器（例如\
  \ `gcc`）提供了强制编译器将双引号（`\"\"`）视为角括号（`< >`）的开关，但并没有通用的方法可以做到这一点。另一方面，当使用角括号（`< >`）时，在那种语法意味着首先搜索包含\
  \ `#include` 的源文件所在目录（例如，`package_dir`）的平台上，通过显式地将 `package_dir` 作为第一个要搜索的目录添加，总是可以实现等同于使用双引号（`\"\
  \"`）的结果。\n\n专门使用角括号（`< >`）而非双引号（`\"\"`）^(79)，使得开发和构建工具在决定从何处提取或者更准确地说，不是从哪里提取本地头方面具有更大的控制权。通过统一使用角括号（`<\
  \ >`），我们可以确保在文件 `xyza_foo.c` 和 `xyza_bar.h` 的情况下，`xyza_foo.c` 中的 `#include <xyza_bar.h>`\
  \ 无论 `xyza_foo.c` 位于文件系统的何处，在所有平台上都具有相同的含义。此外，角括号在开发和部署期间都提供了更大的灵活性（参见第 2.15 节），因为它允许我们覆盖由双引号（`\"\
  \"`）强加的典型行为，即选择包含它的源文件所在目录之外的*其他*头文件。在使用角括号（`< >`）时，构建工具提供的这种额外能力，促使我们在大规模开发工作中决定避免在\
  \ `#include` 指令中使用双引号（`\"\"`）语法。\n\n^(79) 注意，这种对角括号（`<>`）的专门使用——即使对于同一包内的组件——也是极少数对\
  \ `lakos96**` 中推荐的实践的偏离之一。\n\n### 1.5.2 内部包含保护 (Internal Include Guards)\n\n一旦我们开始包含头文件，就必须处理如何避免重复包含头文件导致的定义重复。一个给定的头文件在一个翻译单元中被多次包含的情况并不罕见。考虑图\
  \ 1-39 所示的情况，`Widget` 的实现中同时直接使用了 `Point` 和 `Box`。由于 `Box` 嵌入了两个 `Point` 对象，尝试编译\
  \ `Box` 类需要先看到 `Point` 类的定义。因此，我们被鼓励（参见第 1.6 节 和 第 1.11 节）并根据我们的方法论被要求（参见第 2.6 节）让\
  \ `my_box.h` 自身包含 `my_point.h`。由于 `Widget` 的非内联 `move` 方法直接大量使用了 `Box` 和 `Point`，我们也被要求（参见第\
  \ 2.6 节）在 `my_widget.cpp` 中直接包含它们各自的头文件。\n\n![](img/fig1-39.jpg)\n\n**图 1-39：包含图中的重汇**\n\
  \n正如我们从第 1.2.1 节 中知到的，编译首先需要通过合并 `#include` 指令指定的头文件来形成翻译单元。当我们编译 `widget.cpp` 时，预处理器首先将\
  \ `#include <my_point.h>` 指令替换为 `my_point.h` 头文件的体。然后预处理器继续对 `my_box.h` 执行相同操作。在处理\
  \ `my_box.h` 期间，预处理器会再次遇到 `#include <my_point.h>` 指令，并会执行它。如果没有任何包含保护，`Point` 类的重复定义会导致\
  \ `widget.cpp` 的翻译产生两个 `Point` 类的定义，从而导致编译失败。\n\n与 C 不同，C++ 头文件几乎总是包含一个或多个定义（例如，类定义）。由于定义在翻译单元内永远不会重复，因此标准做法是使用唯一的（且可预测的）*内部*预处理器包含保护，类似于图\
  \ 1-40 所示的，以确保头文件的内容只被看到一次。\n\n![](img/fig1-40.jpg)\n\n**图 1-40：（可预测的）内部包含保护**\n\
  \n当翻译单元首次包含 `my_stuff.h` 时，保护符号 `INCLUDED_MY_STUFF` 将是未定义的，头文件的其余部分将被合并。为了避免重复定义，我们在测试保护符号后做的第一件事就是定义它。在随后的对该头文件的包含中，保护符号已定义，正文将被跳过。\n\
  \n### 1.5.3 （已弃用的）外部包含保护 (External Include Guards)\n\n截至 2017 年，我们不再建议使用*外部*包含保护；然而，为了历史参考，我们在下方提供了讨论。虽然内部保护防止了重复，但预处理器仍然打开、读取并忽略每个包含头文件的重复定义。这种不必要的重新处理在历史上在编译阶段浪费了大量资源，特别是在信息在本地可用^(80)的系统中——例如网络文件系统（NFS）。图\
  \ 1-41 说明了一个极端（但可能是有效的）设计，其中客户端依赖于多个屏幕，每个屏幕头文件都包含同一组组件。\n\n图 1-41 中的病态重汇具有说明性，但重复包含的非常真实（且痛苦）的影响一直持续到\
  \ 2010 年代才出现（尽管频率低得多）。在这种情况下，原本可能浪费在预处理上的时间可以通过在头文件中嵌套的每个 `#include` 指令周围放置*冗余*外部包含保护来显著减少，如图\
  \ 1-42（81)）所示。倾向于在其他头文件中直接包含大量不需要的头的糟糕实现的客户端应用程序通常也受益。\n\n![](img/fig1-42.jpg)\n\
  \n**图 1-42：（现已弃用的）外部（冗余的）包含保护（坏主意）**\n\n有了冗余保护，`screen1.h` 实际上被*保证*^(82) 正确包含每个组件文件一次.^(83)。也就是说，当\
  \ `screen2.h` 被包含时，外部保护抑制了再次打开组件文件的可能性。\n\n\n\n\n请注意，那些最多将给定的头文件包含到翻译单元一次的编译系统在技术上是不符合规范的。在缺乏显式语法（例如\
  \ `#include_once`）来明确我们的意图的情况下，编译系统避免重复读取（或至少重新评估）头文件的任何尝试在本质上都会是启发式的。请注意，`#pragma\
  \ once` 是一种流行且广泛支持的非标准特性，正是为了这一目的而设计的。\n\n在 2014 年对成为本书的稿件早期版本进行回顾时，JC van Winkel\
  \ 写道：“我认为编译器*不应该*在处理双包含时表现得太聪明。它应该执行我要求它做的事情。如果能有一个像 `#include_once` 这样的标准化命令，那就好了，但编译器不应该决定它不需要再次包含某个文件。人们可能会玩花技巧，让对文件的第二次包含具有不同的语义。例如（而且是一个非常糟糕的例子），请参阅与\
  \ `gcc: enquire.c` 源码一起提供的程序，该程序确定宿主系统的字宽：[van Winkel 引用了 `pemberton93` 第 467 行]：\n\
  \n```\n此文件被读取了三次（它 `#includes` 了它自己），以便为 `short+float, int+double, long+long double`\
  \ 中的每一个生成完全相同的代码。如果没有定义 `PASS`，则这是第一次通过。被‘PASS0’包围的代码是独立于这三者的内容，但在第一次通过期间会被读取。”\n\
  ```\n\n在使用（冗余的）外部保护符时，拥有可预测的内部包含保护符符号无疑是理想的，但并非绝对必要。对于不受我们影响的头文件，例如与供应商提供或第三方库相关的头文件（例如[图\
  \ 1-42] 中的 `cstring`），我们会添加第四行（在 `#include` 指令之后）由我们自己设置统一的外部保护符符号。\n\n许多人声称使用冗余的包含保护符是“枯燥的”、“容易出错的”，且不值得，特别是考虑到“今天的编译器”。然而，另一些经常从事商业系统开发的专业正确地断言，“……在某些情况下，它们的使用可以显著缩短大型应用的编译时间。”截至\
  \ 2005 年，只有 `GCC` 编译器解决了这个问题；我们四个生产平台的原生编译器继续证明了拥有冗余包含保护符的巨大益处。\n\n我们发现很容易使用一个简单的（例如\
  \ Perl）脚本来检查内部保护符是否与当前文件名对应，并且同时）每个外部保护符是否与被包含的头文件对应，从而消除了所有此类潜在的复制粘贴错误。\n\n`sutter05`,\
  \ 第 24 项，第 43 页\n\n`dewhurst05`, 第 62 项，第 229–230 页\n\n2012 年，我在第一本书[第 2.5 节]中描述的针对每个\
  \ 100 行（以及 1,000 行）头文件的实验在几个平台上进行了重复：(1) 使用本地硬盘，(2) 通过网络文件系统。记录了 CPU 时间和“墙钟时间”（wall\
  \ times）。与最初观察到的 25 倍加速不同，在任何情况下，CPU 时间的加速都没有达到 2 倍，在大多数情况下接近 1.0。墙钟时间的加速更为显著，在某些情况下甚至超过了\
  \ 4 倍。在另一个实验中，我们测量了我们的四个生产平台上几个低级组件化库（带有和不带冗余包含保护符）的编译时间。在除一个平台以外的所有平台上，没有可衡量的差异；但在那个平台上，我们看到整体编译时间加速在\
  \ 45% 到 65% 之间。\n\n`lakos96`, [第 2.5 节], [图 2-5], 第 80 页\n\n自它们首次提出以来，技术进步（例如处理器、网络、操作系统）以及旨在解决这一特定问题的优化，在很大程度上缓解了使用冗余包含保护符的紧迫性。此外，在典型应用中，归因处理模板（见第二卷第\
  \ 4.5 节）的相对编译时间成本在许多情况下已经主导了构建软件的总成本。然而，作为（无私的）可重用库开发者，我们坚决在[第 0.2 节]和[第 2.6 节]中使用冗余保护符，正如它们将被正式定义的那样。\n\
  \n然而，最近我们开始看到各种开源工具被这些冗余保护符所困扰，因此在我们的库中继续使用它们被认为是有负面的。在 2017 年后期，我们通过一个微小的脚本安全且准确地删除了所有这些内容，且没有对代码库造成任何干扰。冗余的包含保护符确实很丑。幸运的是，在\
  \ `.cpp` 文件中包含头文件时不需要它们，因为从未出现过问题。简而言之，所有头文件都需要（理想情况下可预测的）内部包含保护符。外部（“冗余”）包含保护符已弃用，直到最近它们还没有产生真正的伤害，并且（多年来）有助于显著缩短编译时间（同时也“温柔地”提醒我们减少在另一个头文件中包含头文件）。\n\
  \n```\n\n正如我们在[第 1.4 节]中所看到的，物理设计的演变（于[图 1-31]、[第 1.4 节]）导致了将一个或多个密切相关的类（见[第 3.3.1\
  \ 节]）与其关联的自由运算符放在单个 `.h` 和相应的 `.cpp` 文件中的做法。这些 `.h / .cpp` 对，或者说正式定义的*组件*（[第 0.7\
  \ 节]），构成了物理设计的原子单元。\n\n现在，我们假设任何我们称为*组件*的 `.h / .cpp` 节点至少满足以下最小属性：\n\n1.  `.cpp`\
  \ 文件将其相应的 `.h` 文件作为第一行性代码包含。\n\n2.  在 `.cpp` 文件中定义的具有外部链接的逻辑结构（且未有效变为外部不可见）在相应的\
  \ `.h` 文件中。\n\n3.  在组件头文件中声明的具有外部或双重绑定的逻辑结构，如果定义，则仅在该组件中定义。\n\n```\n\n\n\n\n组件的第四个核心属性将在\
  \ 1.11.1 节中介绍。\n\n### 1.6.1 组件属性 1\n\n`.cpp` 文件将与其对应的 `.h` 文件作为第一行实质性代码包含。\n\n这第一个属性有助于确保\
  \ `.h` 文件中的任何声明至少与 `.cpp` 文件中的定义保持一致，正如在 1.4 节中讨论的那样。对于那些也可以充当声明的定义（见 1.3.1 节），例如自由函数和全局数据的定义，实现一致性并不是自动完成的：我们必须付出额外的努力来确保这种一致性——例如，通过将此类定义位于它们所声明的命名空间之外（见图\
  \ 1-17、1.3.1 节）。对于那些本身永远不是声明的定义，例如未直接定义在类作用域内的成员函数和静态成员数据，未能方便地包含类定义将导致编译阶段无法成功。\n\
  \n此外，通过要求每个 `.cpp` 文件都包含其对应的 `.h` 文件作为*第一行实质性代码*，我们确保每个头文件都能在孤立状态下编译，永远消除了与包含顺序相关的问题。例如，考虑图\
  \ 1-43 所示的四个文件。组件 `mything` 满足了组件属性 1 的部分要求，因为它在 `mything.cpp` 中定义任何内容之前（图 1-43b）包含了\
  \ `mything.h`（图 1-43a）。但是，由于该组件没有首先包含它自己的头文件，对 `iostream` 的先验 `#include` 掩盖了 `mything.h`\
  \ 中对类型 `ostream` 的前向声明（通过 `#include <iosfwd>` 指令）的缺失。当我们尝试测试该组件时（图 1-43c），情况也是同样的。对于\
  \ `client.cpp`（图 1-43d），该缺陷可能会暴露也可能不暴露，取决于在该翻译单元中已经见过什么。如果缺陷暴露，`client.cpp` 将突然编译失败；否则，潜在的包含顺序缺陷将一直存在。\n\
  \n![](img/fig1-43.jpg)\n\n**图 1-43：依赖 `#include` 顺序相关的问题**\n\n确保每个头文件在不依赖任何之前先包含的声明或定义的情况下进行编译是非常理想的，特别是考虑到诊断此类问题并不容易。头文件在编译方面的自给自足是可以是可以强制执行的，前提是至少有一个翻译单元，在该单元中可以保证头文件在任何其他声明或定义有机会掩盖此类缺陷之前被解析。通过简单地要求每个组件将其自己的头文件作为第一行实质性代码，我们确保了它的头将在孤立状态下编译，因此可以被客户端以任何顺序安全地包含^(89)。^(90)\n\
  \n^(89) 注意，在之前包含的头文件中定义的错误宏不可避免地会破坏原本良好的头文件。\n\n^(90) 当然，我们也可以通过其他方式实现确保头文件自给自足的目标——例如，通过将此类编译集成到我们的构建工具中；然而，上述方法不需要这种额外的编译步骤，因此更具健壮性。\n\
  \n### 1.6.2 组件属性 2\n\n在 `.cpp` 文件中定义的具有外部链接的逻辑结构——且在外部上被渲染为不可见的——应在相应的 `.h` 文件中声明。\n\
  \n这第二个属性通过使任何全局名称在头文件中可见，有助于防止无意违反 ODR（定义规则）。“在外部上被渲染为不可见”意味着符号（源自具有外部或双重链接的结构）无法从另一个组件触及。回想\
  \ 1.3.1 节，匿名命名空间中的结构可能具有外部链接但对于组件而言是不可及的，正如那些根据惯例（见 2.7.3 节）是组件局部一样^(91)。^(91)这些声明随后可以根据需要包含在其他组件、应用程序或测试驱动中（见\
  \ 1.11.1 节）。^(92)完全在 `.cpp` 文件中定义的内部链接结构也是组件的私有的，并且对于属性 2 而言——不需要在头文件中声明。然而，如果这种内部链接实体——例如一个\
  \ `enum`（见图 1-23、1.3.1 节）——被用作函数的参数或返回类型，该内部链接实体最终将在头文件中声明，以便该函数被声明。作为规则，我们应该始终将\
  \ `.cpp` 文件中定义的无法保证全局唯一的 `static` 局部类型放在匿名命名空间中。例如，考虑图 1-44 所示的 `.h`/`.cpp` 配对。`MyCookie`\
  \ 类的所有成员函数，以及该类的任何 `static` 成员数据，必须在该类内部声明，否则这些定义将无法编译。然而，旨在用于组件局部且完全定义在 `.cpp`\
  \ 文件中的类类（例如 `Guard`）和自由函数（例如 `min`）可能会无意中违反这一属性。同样有问题的是自由函数（例如 `operator!=`），它们的声明并不是编译相应的定义所自动要求的（见图\
  \ 1-16、1.3.1 节）。再次，当自由运算符在它们所声明的命名空间之外定义时，这一特定问题被有效解决了。\n\n### 1.6.3 组件属性 3\n\n\
  在组件头文件中声明的具有外部或双重链接的逻辑结构，如果定义定义，则仅在相应组件内定义。\n\n\n\n\n从模块化的角度来看，这一属性可能是三个属性中最明显的一个，但在技术上它又是最微妙的。简单来说，任何通过头文件中的声明声明为唯一的、具有外部或双重绑定（external\
  \ or dual bindage）的逻辑结构，其定义不能存在于该 `.h` / `.cpp` 对之外的任何地方。(93) 图 1-45 展示了对逻辑结构在承载它们的物理实体中正确放置的完全忽视。特别是在\
  \ `intstack.h` 中声明的成员函数 `push` 和 `pop` 并没有像预期那样在 `intstack.h` 或 `intstack.cpp` 的任何地方实现，反而是实现在\
  \ `intset.cpp` 中——甚至在所有地方的 `main.cpp` 中！如果没有这第三种属性，将 `.h` / `.cpp` 对视为一个连贯单元（见第\
  \ 2.3 节）的细粒度模块化设计（见第 0.4 节）的概念将毫无意义。\n\n^(93) 使用 `extern template` 特性的模板显式实例化（见第\
  \ 1.3.16 节）要求 `extern template` 语句（抑制实例化代码）位于单个组件的 `.h` 文件中，然后由该组件的 `.cpp` 文件生成。此类专门实例化——特别是对于基本类型——通常发生在定义整体模板的同一个组件中。然而，对于用户定义类型（UDT），模板的实例化可能合理地需要在定义\
  \ UDT 的组件中发生，从而从该组件到定义通用模板的组件创建依赖关系（而不是相反）。将此显式实例化放置在完全独立的（更高层次）组件中是有问题的，因为它面临着被忽视的风险，从而无法提供预期的编译时优化。\n\
  \n让第三个组件包含显式实例化还会增加同时使用显式和隐式实例化版本的模板且它们具有相同类型的可能性。虽然这种低效率也是不可取的，但它并不是致命的：与内联函数一样，这两种实例化形式在\
  \ ODR（定义定义）方面产生相同的结果；然而，与隐式实例化不同，显式实例化通常不会产生“弱”符号，因此必须限制为每个程序仅一个。正是后者这一观察结果导致了我们不允许此类“可选”代码存在于独立的物理单元中，以免它无意中存在于同一个程序内的多个单元中；这种谨慎态度也适用于作用于来自多个组件类型的自由运算符（见第\
  \ 2.6 节）。\n\n![](img/fig1-45.jpg)\n\n**图 1-45：逻辑结构极度不当的模块化**\n\n逻辑结构放置中的细微不规则也会产生重大的实际影响。考虑图\
  \ 1-46 所示的情况。文件 `client.cpp` 包含了 `date.h` 并大量使用 `Date`，但库中没有包含其他内容。文件 `date.h` 声明了自由运算符\n\
  \n![](img/fig1-46.jpg)\n\n**图 1-46：逻辑结构细微不当的模块化**\n\n点击此处查看代码图像\n\n```\nstd::ostream&\
  \ operator<<(std::ostream&, const Date&);\n```\n\n具有外部绑定，但 `date.cpp` 未能定义它。文件 `date.o`\
  \ 是一个提供比 `Date` 更“重量级”类型库的一部分。`Calendar` 类的实现者意识到缺少日期的输出运算符，决定在 `calendar.cpp` 中实现它。包含\
  \ `date.h` 的客户端并不一定依赖 `calendar.o`，除非它们调用了日期的 `operator<<`。`calendar` 的 `.o` 文件是一个庞大的机制，静静地引入了库中的许多其他\
  \ `.o` 文件，其中没有任何是 `Client` 需要的。该库的用户可能完全不知道这种挪用行为正在发生。幸运的是，健全的、层次化的组件级测试策略——一种在测试期间物理上将组件与其他上不相关的组件隔离开的策略——将检测到这些和其他类似的结构缺陷（见第\
  \ 2.14 节 和第三卷第 7.5 节）。\n\n本节讨论的三个基本属性对于区分普通的 `.h` / `.cpp` 对与我们所说的*组件*这一设计原子单元至关重要：(1)\
  \ 头文件必须在第一行实质代码中被包含，(2) 每个外部链接定义必须在头文件中声明，(3) 在组件头文件中声明的每个外部或双重绑定实体不能在同一组件之外的任何地方定义。组件的第四个基本属性（事实证明对可视化和可维护性特别有用）在第\
  \ 1.11.1 节中进行了讨论。\n\n## 1.7 符号与术语\n\n面向对象的设计提供了一套丰富的符号集。(94)它们的复杂性源于不仅想在实现前表达设计，还想捕捉逆向工程的许多细节。这些符号大多数表示逻辑实体之间的关系，对物理含义的关注少得惊人。\n\
  \n### 1.7.1 概述\n\n即使 UML^(95,96)对于逻辑设计很有用，但对于我们的目的过于臃肿且缺乏表达能力。根据我们的经验，产生健全设计所需的符号极少，如图\
  \ 1-47 所示。如果确实需要额外的符号，标记箭头通常足够了，但请参见图 1-50、第 1.7.6 节。\n\n我们将通过胶囊形状（类型）或椭圆形（函数）一致识别逻辑实体（例如类、结构体、自由运算符）(97):\n\
