  \n### 1.7.2 “是”（Is-A）逻辑关系\n\n![](img/unfig1-7.jpg) 意味着“`D` 是 `B` 的一种，且 `D` 公共继承自\
  \ `B`。”箭头的方向至关重要：它指向继承关系所隐含的物理依赖方向（参见第 1.9 节）。由于 `D` 派生自 `B`，为了让 `D` 能将 `B` 命名为基类，必须已经见过类\
