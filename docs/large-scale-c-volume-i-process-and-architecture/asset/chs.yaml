  这项工作做出直接和/或实质性贡献的人员名单多得令人震惊，我毫不怀疑，尽管我付出了努力，但仍会有许多人在此无法获得认可。请知，我明白这本书是我人生经验的结晶，对于每一个以某种方式做出贡献的你们，请接受我诚挚的感谢和感激。\n\
  \n# 0. 动机\n\n## 0.1 目标：更快、更好、更便宜！\n\n## 0.2 应用软件 vs 库软件\n\n## 0.3 协作软件 vs 可重用软件\n\
  \n## 0.4 分层次可重用软件\n\n## 0.5 柔性软件 vs 稳定软件\n\n# 0.6 物理设计的关键作用\n\n# 0.7 物理均匀软件：组件\n\
  \n## 0.8 量化层次重用：类比\n\n# 0.9 软件资本\n\n# 0.10 增加投资\n\n## 0.11 警惕的必要\n\n# 0.12 总结\n\n\
  大规模、高维护性的软件系统并非凭空出现，单个应用程序开发者使用的成功技术并不一定适用于更大规模、更集成的开发工作。这是一本关于大规模软件开发的 `engineering`\
  \ 书籍。但它不仅仅于此。这本书的核心在于教授了一项技能。这项技能适用于所有类型和规模的软件。这项技能一旦学会，几乎就会变成本能，几乎不需要或完全不需要额外的时间或精力。这项技能能够反复产生从根本上易于理解、验证和维护的有序系统。\n\
  \n自从我写第一本书以来，软件开发领域发生了巨大变化。^(1) 在期间，标准模板库（`STL`）作为 C++98 语言标准的一部分被采用，并得到了大幅扩展。所有相关的编译器现在都完全支持异常、命名空间、成员模板等。互联网让开源库变得更加易于。线程、异常和别名安全已成为常见的设计考虑。此外，现在更多的人意识到良好的\
  \ `physical design` 的关键重要性（参见图 0-32、节 0.6）——这是我在第一书中引入的软件工程维度。尽管基本的物理设计概念保持不变，但应用它们的方法已有了重要的新途径。\n\
  \n^(1) **lakos96**\n\n这本书是为实践者编写的。其重点与顺序开发方法紧密相关。我们详细地描述了如何根据定义良好的原子物理模块（我们称之为 `components`）来开发软件。我们汇编了一套丰富的词汇表来表述这一过程。许多现有的工程技术都得到了更新和完善。特别是，我们提供了（参见第三卷）对组件级级测试的全面处理。曾经被视为“黑艺术”或至少是一门高度专业化技艺的内容，现在已演变成一门可预测、可教学的工程学科。我们还讨论了（参见第二卷）许多基本的“经受实战”的设计和实现技术背后的动机及其有效使用。总而言之，这里描述的工程流程（第一卷）与经过证明的项目管理流程互补并产生协同效应。\n\
  \n底线：这本书是为专业软件开发者设计的，核心在于如何开发出可以扩展到任意规模的软件并成功。我们界定了我们认为不可或缺的问题，并按照大致对应我们软件开发思维过程的顺序介绍了它们。书中提出了许多重要的新观点，反映了有时是残酷的现实。然而，这本书的价值不仅在于它所包含的思想，更在于它教授良好工程实践时的连贯一致性。我们在书中讨论的所有内容并非（目前）都是流行的，但最初\
  \ `physical design` 的概念也不流行。\n\n### 0.1 目标：更快、更好、更便宜！\n\n工业界软件应用程序开发的成功标准始终是以最低的成本以最快的速度交付最好的产品。这一目标隐含了三个基本维度：\n\
  \n*   `Schedule (faster)`：软件交付的及时性\n*   `Product (better)`：软件功能/质量的提升\n*   `Budget\
  \ (cheaper)`：软件生产的经济性\n\n在实践中，我们对某个特定软件应用或产品的开发最多只能优化其中两个参数；第三个将由情况决定。图 0-1 说明了这三个维度之间的相互依赖关系。^(2)\n\
  \n^(2) **mcconnell96**，第 6.6 节，“进度、成本与产品的权衡，”图 6-10，第 126 页\n\n![](img/fig0-1.jpg)\n\
  \n**图 0-1：进度/产品/预算权衡**\n\n在任何时刻，我们开发应用程序的能力取决于现有基础设施，如开发者、库、工具等。我们的产品质量目标越高，消耗的日历时间和/或工程资源就越多。如果我们试图让质量相似的产品在更短的时间内完成从而提高进度，成本会更高——通常高得多，从而影响预算。如果我们有固定预算，更快完成工作的唯一方法就是少做（例如，更少的功能、更少的测试）。这种不可避免的现实似乎是所有软件开发中固有的。^(3)\n\
  \n^(3) JC van Winkel 评论说，这些关系很难通过一张图来理解，并建议其他更直观的方法来处理这些权衡，例如使用 `sliders`。\n\n对于固定的进度（交付的日历时间），你得到这个滑块：\n\
  \n![](img/unfig0-2.jpg)\n\n对于固定的预算（资金/资源），你得到这个滑块：\n\n![](img/unfig0-3.jpg)\n\n\
  对于固定的产品（功能/质量），你得到这个滑块：\n\n![](img/unfig0-4.jpg)\n\n\n\n\n\n这个最后的滑块位于弗雷德·布鲁克斯（Fred\
  \ Brooks）经典著作*人人月谭神话》（参见 brooks75）的核心观点。该书认为，在整个关注范围内，`time`与`cost`之间存在反比线性关系的想法纯属幻想。人与人之间交互的几何级增长（已经验数据证实；boehm81\
  \ 第 5.3 节，第 61–64 页）表明——在相关的限制范围内——这种关系可以合理地建模为时间 (`T`）与成本 (`C`）之间的反平方关系，即 $T \\\
  propto 1/\\sqrt{C}$（参见 section 0.9）。\n\n尽管如此，如果存在某种可预测的方法，让我们随着时间的推移同时改进这三个参数，那就太好了——即设计一种方法论，作为其使用的副产品，持续降低成本和上市时间，同时提高未来产品的质量。从图表来看，这种方法论将使应用程序和产品的更快/更好/更便宜的设计空间进一步远离原点，如图\
  \ 0-2 所示。\n\n![](img/fig0-2.jpg)\n\n**图 0-2：改进进度/产品/预算设计空间**\n\n假设存在这样一种方法，随时间需要发生什么变化？例如，我们开发者的经验可能会增加，从而提高生产力和质量。随着开发者变得更有经验、更高效，我们自然必须给他们更高的薪水，但不会按比例增加。然而，在固定的开发环境中，任何人的生产力都有极限，因此环境也必须发生变化^(4)\n\
  \n^(4) 在审阅本书的近乎最终草稿时，Kevlen Henney 提到：“我最近一直主张放弃‘更快’这个词，转而使用‘更早’。重要的不是速度，而是到达时间。这两者并不是同一个概念，持续关注速度是一个问题，而不是一个理想的目标。良好的设计是采取更好的路线尽早到达；你走得快不快并不那么重要。”\n\
  \n随着时间的推移，我们可能会预期第三方以及日益开源的软件开发工具和库将会改进，增强我们的开发环境，从而提高我们的生产力。虽然这种预期是合理的，但这对我们的竞争对手同样适用。问题是：“我们可以主动做什么，以随着时间的推移提高相对于竞争的生产力？”\n\
  \n实现一个可重复、可扩展的软件开发过程被广泛认为是同时提高质量、缩短开发时间和成本的最单一有效的方法。如果没有这样的过程，业务成本（更说失败风险）会随着项目规模的增大而非线性增长。遵循健全的开发过程至关重要，但生产力的提高不太可能通过超过固定常数倍数的方式渐近无限提升。除了可重复的过程之外，我们还需要方法论中的某种形式的*正反馈*，以持续放大我们环境中的开发生产力。\n\
  \n现在考虑所有软件开发中有一项随时间不断增加的本质产出：开发的软件本身。如果能够在未来的项目中使用这些软件的大部分，那么提高生产力的前景基本上是无边际的。也就是说，我们开发的软件越多，可供复用的软件就越多。挑战就变成了找到一种组织软件的方法，使其能够并被有效地复用。\n\
  \n### 0.2 应用程序软件 vs 库软件\n\n应用程序开发通常是单一目标且有目的的。在大型组织中，这种目的性经常导致代码重复以及一组相互依赖的应用程序。每个部分都能工作，但整个代码库是杂乱的，每次新的更改或添加都变得越来越困难。这种过于频繁出现的“设计模式”被命名为“大泥球”（Big\
  \ Ball of Mud）。^(5)\n\n^(5) foote99\n\n生成的代码库没有中心化的组织结构。任何在原则上对整个企业都有用的软件，要么设计得太主主观而无法通用，要么与特定应用程序的代码交织在一起而无法剥离。此外，由于代码必须响应其原始主人不断变化的需求，依赖此类软件的稳定性是有风险的。而且，由于业务通常从速度中获利，编程的任何传统子学科（如重构和接口设计）并没有多少溢价。尽管这种临时方法通常能在较短时间内产生实用的应用程序，但它导致了严重的维护负担。随着时间的推移，代码库不仅没有改进，维护成本而且以比必要的快的速度持续增长。\n\
  \n为了更好地理解这一问题，我们首先观察到存在两种不同的软件——*应用程序*软件和*库*软件——因此有两种不同的开发方式。应用程序是满足特定业务需求的程序（或紧密耦合的程序集）。由于需求不断变化，应用程序源代码在本质上是不稳定的，并可能在不通知的情况下发生变化。在我们看来，所有明确局部于应用程序的源代码必须仅限该应用程序使用（参见\
  \ section 2.13）。\n\n另一方面，库不是程序，而是一个仓库。在 C++ 中，它是头文件和目标文件的集合，旨在促进类和函数的共享。通常来说，库是稳定的，因此是可复用的。软件实体在多大程度上属于特定应用程序还是对整个领域更通用，将决定其在组织内部（甚至可能之外）的复用范围和有效性。\n\
  \n\n\n\n虽然任何特定应用程序的设计过程主要是自上而下的，但经验告诉我们，在任何给定的应用领域内，几乎总是存在对相似功能的重复需求。例如，在集成电路计算机辅助设计（ICCAD）领域，我们可能会对\
  \ `Transistor`（晶体管）、`Contact`（接触）和 `Wire`（线）等类有许多独立的需求。对于许多应用领域共同的功能也有重复的需求，例如日志记录、传输、消息传递、封化（marshaling），当然还有各种高性能数据结构和算法，分别为\
  \ `std::vector` 和 `std::sort`。未能识别公共子系统（以及组件；参见第 0.7 节）意味着每当重新发现这些重复需求时，都必须重新编写。我们认为，任何负责任的企业都有责任积极解决这种自然产生的、重复的低效问题。\n\
  \n在理想的应用程序开发范式中，设计者会积极寻找程序各个子系统之间所需功能的共同点，并在可行的情况下，要么采用现有解决方案，要么设计出良好的组件来满足这些重复需求。将现有解决方案整合到自上而下的设计中，使得设计过程变成纯自上而下与自下而上的混合体——这也许是当今实践中最常用的架构方法。即使在单个应用程序的范围内，通常也有充分的机会来应用这种为了重用的重构并获得良好效果。\n\
  \n### 应用程序开发的现实\n\n遗憾的是，可重用软件通常不是应用程序开发的副产品。由于绝大多数应用程序开发工作关注点且时间跨度有限，在缺乏独立的库开发者团队（参见第\
  \ 0.10 节）的情况下，试图编写软件来利用跨应用程序的共性几乎是不可行的。这一观察并不是对应用程序开发者的批评，而仅仅反映了常见的经济现实。应用程序开发团队的成功取决于它在多大程度上按时按预算满足了业务需求。任何以“重用”为名而偏离这一目标的重大行为，都可能受到惩罚而非奖励。考虑到上市时间的极端重要性，确实极少数应用程序开发者能够在满足其主要职责的同时，提供一种通常可供他人消费的解耦且可利用的软件。\n\
  \n### 库开发者的使命\n\n相反，库开发者有着完全不同的使命：让整个开发过程更加高效！库开发的最常见目标是增加应用程序开发者的长期生产力，同时减少维护成本（例如，由于大量重复软件导致的成本）。当然，建立一个适合公共消费的库会有某些初始成本。此外，构建可重用组件的增量成本高于为单个应用程序开发的类似（非重用）组件的成本。但是，考虑到开发库软件的成本可以分摊到使用它的所有应用程序上，某些额外成本是完全合理的。\n\
  \n### 应用程序软件与库软件\n\n如图 0-4 所示，应用程序软件和库软件之间存在若干本质区别。良好的应用程序软件（图 0-4a）通常是具有可塑性的，而库软件（图\
  \ 0-4b）则需要稳定性（参见第 0.5 节）。由于单个应用程序的变化范围是有限的，因此应用程序组件的设计通常比在跨任意多个应用程序的库中设计更具紧密的协作性（参见第\
  \ 0.3 节）。^(6)\n\n^(6) 另另 `sutter05`，项目 8，第 16–17 页。\n\n![](img/fig0-4.jpg)\n\n**图\
  \ 0-4：库软件与应用程序软件开发**\n\n### 库软件的要求\n\n库软件的要求在许多方面仅仅是依赖于它的应用程序要求的并集（参见卷卷 II，第 5.7\
  \ 节）。例如，一个独立发布的库的生命周期是使用它的应用程序生命周期的并集。因此，库的寿命通常比单个应用程序长。如果一个应用程序要在特定平台上发布，那么任何支持它的库也必须如此。因此，库必须比应用程序更具移植性。因此，通常没有单一的应用程序团队能够在某个库可能需要的所有平台上在其整个生产周期内对其提供支持。这一观察进一步表明，需要一个独立的专门团队来支持共享资源（参见第\
  \ 0.10 节）。\n\n库代码必须比典型的应用程序代码更可靠，我们的方法放大这种二分性。例如，与典型的应用程序代码相比，库代码对其编程接口有更详细的描述，称为“合约”（参见卷\
  \ II，第 5.2 节）。详细的函数级文档（参见卷 II，第 6.17 节）允许更准确、更彻底的测试，这就是我们实现可靠性的方式（参见卷 II，第 6.8 节以及卷\
  \ III III）。\n\n此外，库软件更加稳定，即其核心行为不会改变（参见第 0.5 节）。更高的稳定性减少了引入 Bug 或因行为改变而需要重做测试用例的概率；因此，稳定性提高了可靠性（参见卷\
  \ II，第 5.6 节）。\n\n### 为重用而设计\n\n在编写库软件时，我们力求在内部吸收复杂度，从而在外部最小化复杂度。也就是说，库开发者激进地牺牲自身的实现简易性，以换取客户使用的易用性。极小区域的高度复杂代码远比分散的、复杂的代码要好。例如，我们断言，如果只有两种参数类型（例如考虑\
  \ `const char *` 和 `std::string`）合理，那么提供两个成员函数几乎比提供一个模板成员函数好得多（参见卷 II，第 4.5 节）。\n\
  \n更具争议的是，通常拥有两个 `struct` 副本更好——例如，一个在 `.h` 文件中嵌套/私有（供 `inline` 方法和友元访问），另一个在 `.cpp`\
  \ 文件中处于文件作用域作用内（供文件作用域的 `static` 函数访问）——并在本地确保它们同步，这比用实现细节污染全局空间要得多。通常情况下，库开发者应该计划投入大量的额外精力，以为客户节省哪怕微小的不便。重用组件越通用，开发者的投入就越显合理（参见卷\
  \ II，第 6 章）。\n\n\n\n\n\n与任何业务一样，持续库开发的重点必须是以合理的增量成本展示出重大的价值。因此，编写的任何库软件必须对使用者具有`相关性”（`relevant`）。库开发者只需从现有的应用程序中寻求指导即可。通过与应用程序开发者紧密合作以解决他们反复出现的需求，库开发者可以专注于最重要的事情：提高应用程序开发者的生产力！\n\
  \n此同时，库开发者还承担着一项重要责任，即`审慎地`和`外交地`拒绝那些不当的特定请求，这些请求会损害整个开发社区的成功。例如，拒绝为 `Calendar`\
  \ 类型提供 `name` 属性，对于一个正忙于赶上截止日的应用程序开发者来说，这似乎是随心所欲的。然而，经验丰富的库开发者知道（参见第二卷第 4.3 节），提供\
  \ `name` 字段将破坏该对象任何有用的`价值`概念，并使其不适合作为其设计的`词汇类型`（参见第二卷第 4.4 节）。\n\n即使是有效的请求，有时也会以提议的最优解决方案的形式表达出来。库开发者的责任不是盲目地完全按照要求的规格满足请求（参见节\
  \ 3.12.1），而是理解底层需求以及`所有`软件问题，并提供满足所有客户（无论是个人还是集体）需求（而非愿望）的可行解决方案。因此，面向客户端接口的设计至关重要（参见第二卷第\
  \ 5 章）。\n\n应用程序开发和库开发的设计范式也大不相同。应用程序设计主要是自上而下的，而由通用的软件组成的库是自下而上开发的。更复杂的解决方案由更简单的解决方案组成。库与库之间甚至库内部组件之间理想的树状——或更准确地说是有向无图（DAG）状——依赖关系并非巧合。相反，它们是深思熟虑提取的结果，目的是实现跨应用程序的细粒度`分层复用`（参见节\
  \ 0.4）。\n\n对清晰、简洁且完整的文档的绝对需求，也使库代码与与其对应的应用程序代码区分开来。由于库代码独立于任何特定上下文，因此需要更详尽、详细的概述文档（参见第二卷第\
  \ 6.15 节），以及周到的用法示例（参见第二卷第 6.16 节），以便客户能够理解和使用它。而且，与应用程序不同，可复库软件的性能要求并不限于任何一种用途，并且通常必须超过今天被证明所需的水平（参见节\
  \ 0.11）。\n\n部署是应用程序和库软件产生分化的另一个方面。应用程序通常以单个可执行文件的形式发布，而库则被部署为头文件集合（参见节 1.1.3）和相应的库归档文件（参见节\
  \ 1.2.4）或者，也许是共享库。虽然在 `#include` 指令中（例如通过相对路径）包含目录结构（例如 `#include <basic/date.h>`）对于应用程序软件来说可能是接受的，但库应该避免这样做，否则部署期间的灵活性将受到损害（参见节\
  \ 2.15）。\n\n最后，应用程序开发者总是试图解决困难的现实世界问题。正如图 0-5 所示，这些问题往往是不规律的，且要描述其所有细节尤为艰巨。在自上而下开发大型应用程序时，对解决方案的某些方面通常存在不确定性——也许某些重要需求缺失或尚未确定。此外，这些复杂的问题——因此底层的应用程序软件本身——通常会随着时间的增长而变化。\n\
  \n![](img/fig0-5.jpg)\n\n**图 0-5：许多应用程序并不规律。**\n\n尽管如此，在这样一个复杂的应用程序内部，通常有许多规律、定义良好且稳定的子问题，其提取的解决方案将进入应用程序。在这种情况下，我们可能通过赞助创建一些通用的部分来启动开发过程。通过共同努力，应用程序开发者和库开发者可能识别出有助于构建应用程序需求和/或设计的共同子系统，如图\
  \ 0-6 所示。应用程序开发者与库开发者之间的交互有助于形成清晰定义的、相关且通用的约，或许可能还是可复用的（参见第二卷第 5.7 节）。^(7,8)\n\n\
  ^(7) 另见 **stroustrup00**，第 23.4.1 节，第 698–700 页，我们在此处进行了总结。\n\nStroustrup 在他的书中提出了许多可靠的建议和观察。\n\
  \n*   使用现有部分进行设计。\n*   推迟创建新的、奇特的、不可复用的自定义部分。\n*   尝试让你你创建的任何新部分在未来是有用的。\n*   仅在最后才创建项目特定的部分。\n\
  \nStroustrup 继续说道，这种方法可行，但它不是自动生效的。\n\n*   通常我们甚至无法在最终设计中识别出明确的组件。\n*   “……企业文化往往会阻止人们使用这种模型。”\n\
  *   “……这种开发模型只有在考虑长期时才会真正起作用。”\n*   为所有组件建立通用/国际标准是不合理的。\n*   标准的层级——国家、行业、部门、产品——是我们能够实现的最佳目标。\n\
  *   迭代对于获得经验至关重要。\n\n^(8) 正如前言所述，本章中的许多参考文献（如上一个）是那些已出版后续版本并“取代”了早期版本的书籍，但这些后期版本由于长度限制未能延续这些智者的建议。因此，我们继续引用这些早期的（可能已停版的）版本，并且为了读者的方便，在此处复制了相关内容。\n\
  \n![](img/fig0-6.jpg)\n\n**图 0-6：许多组件和子系统是规律的。**\n\n\n\n\n\n在适当的授权下，注重细节的 `disciplined`\
  \ 库开发者与快速迭代的 `agile`（敏捷）应用开发者紧密合作，有更大的机会产出那种非协作性的、高质量且稳定的软件组件，从而实现有效的复用。只有通过主动提取我们开发的软件的适当子集、对其进行激进的重构，并将其放入稳定、易访问且具有潜在复用性的库中，我们才能在长期获得巨大的生产力提升。\n\
  \n### 0.3 协作软件 vs. 可复用软件\n\n经典可复用软件模块化的标准强调通过接口将可控的复杂度隔离起来，以最大限度地减少协作中的特殊性。行业已经认可，持续重构——即在发现时不断提取、精炼和\
  \ `demoting`（参见第 3.5.3 节）广泛使用的功能——是获取比最基础的可复用软件更多的任何内容的唯一可行方法。即使复用本身不是目标，细致的分解（factoring）也能提供显著的灵活性，随着开发工作的进展（特别是在需求变化时），这将带来更高的可维护性。然而，在进行自顶向下的设计时，许多开发者经常构建晦涩的设备，这些设备完全满足他们当前的需求，但高度特殊、缺乏活性，在其他上下文中显然毫无用。我们用来描述此类分解不良或不充分的子系统的比喻分别是`破碎的盘子`（cracked\
  \ plate）和`烤面包机牙刷`（toaster toothbrush）。\n\n分解（Factoring）是将一个大问题细分的艺术，如图 0-8 所示，将其分解为若干个适当的小问题，这些问题的独立解决方案产生实用的组件，这些组件可以被解释、实现、测试并组合以解决原始问题。在分解良好的解决方案中，每个子解决方案的接口复杂度相对于执行实际工作的实现复杂度将保持在较小水平。类似于球体，其接口（或`表面`）复杂度与其实现（或`体积`）复杂度之间的比例被降至最低。\n\
  \n![](img/fig0-8.jpg)\n\n**图 0-8：大型但定义良好的软件问题**\n\n在坏的情况下，跨模块边界的交互复杂度不会比模块内部的交互更简单。要使用此类模块，客户端基本上需要知道底层实现的所有细节。对该实现的任何更改——无论多么微小——都存在着产生不利影响并与其交互的其他任何模块预期行为的巨大风险。这种逻辑分解上的缺陷导致了物理模块变得极其难以维护。\n\
  \n例如，假设我们有一个子系统，它由一组模块组成，所有模块都通过一个实现为 `std::vector<char>` 的通用消息缓冲区进行通信。最初，字节偏移被锁定以对应一个已知结构：前四个字节指示传输源，接下来的四个字节指示目的地，第三四个字节指示传输类型，以此此类推。\n\
  \n随着时间的推移（且总是出于合理的业务原因），这种结构缓慢但确定地被破坏了。一个模块添加了规则：如果传输类型的最高位被设置，则对源和目的地使用“交替枚举”。其他一些模块由于对某些字段没有用处，在只有它们知道的某些状态条件条件下重新定义了这些字段的含义。另一些模块由于不想“破坏”消息格式，会预分配额外的容量，并在向量的逻辑终点之外存储“私有”信息^(9)。然而，一种常见的做法是基于`自然对齐`（参见第二卷第\
  \ 6.7 节）这一非常实际（但不能保证）的假设，从指针中窃取前两个（或三个，取决于目标架构）最低有效位。\n\n^(9) 我在信德银行（Bear Stearns）的前老板\
  \ Buzz Moschetti 曾讽刺地将这种隐蔽的极端脆弱性（约 1998 年）称为 `zvector`。\n\n曾经相对清晰的接口已变得极其复杂。这些模块之间不受限制的、现在又是紧耦合的逻辑关系，使得即使是微小的维护任务也既昂贵又充满风险。就像破碎的盘子碎片一样，这些模块注定只能服务于一个有用的目的——即实现某一个应用程序的当前版本。产生的“划分”如图\
  \ 0-9a 示意所示。\n\n![](img/fig0-9.jpg)\n\n**图 0-9：脆弱的解决方案**\n\n分解不力的常见结果是产生一个既陌生又难以描述的函数、对象或组件。难以描述是大型\
  \ `表面积`（即复杂的接口）的显著症状，也是原始问题分解得不当或不充分的强烈指示。当一个模块对当前需求具有病态的特殊性时，会导致接口复杂度不成比例。\n\n\
  现在让我们想象一下你妈妈是客户，你被赋予了一组早晨的任务：为家里人刷牙并制作烤面包。作为一个勤奋的人，你迅速为这两个需求发明了一个解决方案，将其视为从一个模具中铸出的单一无缝设备，即`烤面包机牙刷`（图\
  \ 0-9b）。虽然 `ToasterToothbrush` 精确同时满足了客户妈妈所列出的两个需求，但它就像破碎盘子的每一块碎片一样，它对于导致它的特定情况是独有的，因此在变化面前完全无效的。原始问题规范中任何方面的细微修改（例如，图\
  \ 0-8）都可能要求我们重新考虑现有解决方案中每个角落的实现细节（例如，图 0-9a）。随着应用需求随时间变化成为常态，此类组件中的这种脆弱性构成了巨大的负担和对及时成功的严重风险：如果你的妈妈改变了主意——哪怕只是一点——你就完蛋了（you're\
  \ toast）！\n\n即使避免了病态的脆弱设计，应用开发者创建虽名义上独立但显然考虑了同类组件的软件也并不罕见。让我们跳过，首先考虑图 0-10b 所示的烤面包机牙刷应用的协作分解。熟悉的烤面包机对象被巧妙地增加了一个钩子，为挂载所需的牙刷提供了一个方便的位置——前提是，所要求的牙刷已经在柄上经过适当处理，钻了一个合适的孔。除了这种相当特殊的情况外，在其他同等的情况下，人们不太可能选择一个带有一个出的难看钩子的烤面包机放在厨房柜台上。\n\
  \n\n\n\n\n回到我们的盘子类比，也可以设计出一种具有定义良好的接口和低表面积与体积比，但仍然由高度协作的部件组成的软件解决方案，如图 0-10a 所示。这个圆，就像多士机牙刷一样，是一个`协作`设计的示例——在这种设计中，尽管子模块之间可能没有显式的`物理`相互依赖关系，但每个部分的`逻辑`设计都受到了周围环境的极大影响。正如你所见，如果不参考其他部分，单独完整描述这些部分中的任何一个将是费劲的。就像带钩的烤面包机或带孔的牙刷一样，这类部件与协作性较低、更易描述且更`可复用`的组件集相比，更可能在新的语境中被广泛使用。\n\
  \n尽管如此，协作设计在单个应用程序的语境下是可以接受的，特别是当我们能够在多个版本之间复用这些协作部分时。将图 0-9a 中的裂纹盘子与图 0-10a 中的协作盘进行比较。裂纹盘的碎片除非能重新拼装回为其设计的特定软件版本中，否则不太可能有用。如图\
  \ 0-11a 所示，这种脆弱的解决方案通常限于单个应用程序的单一版本；其所有部分都必须随着每个新发布版本的发布进行同步工作。简单来说，这种缺乏纪律的软件开发方法在大规模上是无效的，这或许解释了为什么许多大型项目将会失败（或未能达到预期）。\n\
  \n![](img/fig0-11.jpg)\n\n**图 0-11: 解决出现问题解决方案的程度**\n\n然而，通过细致的重构，我们可以`跨`版本复用协作部分（图\
  \ 0-11b）。这些部分可以存在于源代码之外的特定特定库中，它们可以在应用程序的多个活动版本之间进行`不经修改`的共享。通过增加跨版本保持稳定的子功能性比例，我们不仅减少了与持续增强相关的总成本，还缩短了发布之间的间隔。\n\
  \n虽然协作解决方案可以在单个应用程序的版本之间复用，但要实现跨应用程序的复用（图 0-11c），我们必须更进一步。从历史上看，`可复用`软件解决实践中反复出现的微小且定义良好的问题。熟悉的例子包括\
  \ C++ 标准库中的 `std::vector` 和 `std::string`。在我们的几何类比中，可复用软件组件以熟悉形状存在，如图 0-12a 所示。注意，这些形状中的每一个都易用语言描述：边长为\
  \ `S`的`正方形`、长度为 `L`且宽为 `W`的`矩形`、底为 `B`且高为 `H`的（右）`三角形`以及半径为 `R`的`半圆`。\n\n![](img/fig0-12.jpg)\n\
  \n**图 0-12: 经典的可复用软件**\n\n可复用软件必须能够以各种方式`不经修改`地组合（参见第 0.5 节），以解决新的、不可见的问题。拥有一套可靠的预制组件组合可以是一个巨大的生产力助手。假设我们有一个“现成的”牙刷（无孔）、一个普通的烤面包机（无钩），以及图\
  \ 0-12b 中有趣的（但无疑是非协作的）适配器，我们可以轻松地组装出一个非常类似于图 0-9b 中完全定制的单体设备的解决方案，但比从头开始构建要快`且可靠`得多。如图\
  \ 0-13 所示，这种非协作的子解决方案通常需要一些填充物（图 0-13a）；然而，通常只需要一点胶水（逻辑）就足够了（图 0-13b）。\n\n![](img/fig0-13.jpg)\n\
  \n**图 0-13: 使用经典可复用部件解决原始问题**\n\n只有当我们考虑在许多不同应用程序和产品的多个版本中，真正`可复用`解决方案的精细分层次价值（图\
  \ 0-11c）时，我们才能开始欣赏基于组件的软件的巨大潜在优势（参见第 0.7 节）——特别是`软件资本`（参见第 0.9 节）。正如我们很快将说明的，正是这种二维场景迫使我们分配必要的资源，来构建并填充一个可行的超高质量、`分层`可复用的企业级软件库。\n\
  \n### 0.4 分层可复用软件\n\n长期以来，人们一直知道大型单体代码块（如图 0-14 所示）并不是优的。早在 1972 年——在复用的承诺在四个世纪后才解决之前——像\
  \ Parnas 这样的先驱就观察到，将程序的逻辑内容仔细分离到更相关的子系统中并仅通过接口允许简单类型，有助于降低复杂性。D. L. Parnas 被广泛认为是`模块化编程`之父（即信息隐藏）；参见**parnas72**。\n\
  \n![](img/fig0-14.jpg)\n\n**图 0-14: 单块**\n\n四年前（1968 年），Dijkstra —— 以其对数学科学领域的许多贡献（如最短路径算法）——\
  \ 已经发表了一系列工作，证明了分层物理结构对于理解复杂系统的价值。Parnas 在他的开创性论文中承认，无环物理分层（如图 0-15a 所示）与他提出的“清洁”逻辑分解（如图\
  \ 0-15b 所示）“是系统结构的两个理想但`独立`的属性。”(14)\n\n几年后（1978 年），Myers 认为：\n\n……划分程序的另一个强有力的理由是它在程序内部创建了若干定义良好的文档边界。这些边界（或接口）对于理解程序具有无价价值。(15)\n\
  \n尽管 Myers 碰巧指的是单个程序的可维护性，但这些论点自然更广泛地适用于任何物理边界——例如库。\n\n\n\n\n经典的软件设计通常会导致粗粒度的层次架构，如图\
  \ 0-16 所示。分层不足的架构，例如 OSI 网络体系模型七层的朴素实现^(16) —— 甚至是编译器的各个层级 只要层级本身易于进行进一步的垂直分解，^(17)，这就不一定是个问题。\n\
  \n^(16) `deitel90`，第 16.2 节，页 496–515\n\n^(17) 注意，OSI 模型的缺陷在于某些“实现”以不同的方式分配了层任务，或添加了子层。以以太网\
  \ II（第 1+2 层）与 IEEE 802.3+802.2 为例，其中第 2 层基本上被拆分为 2a 和 2b，增加了一个额外的标头。（此数据由 JC van\
  \ Winkel 提供。）\n\n![](img/fig0-16.jpg)\n\n**图 0-16：粗分层软件结构**\n\n一种更细致的垂直分解方法如图 0-17\
  \ 所示。我们所说的*细致的*，是指从一个可访问的抽象级到下一个级所增加的功能相对较少。例如，`Line` 类在它的接口中使用了 `Point` 类（因此依赖于它），但\
  \ `Line` 的定义位于（略高）层次的独立物理单元中。从一个物理层到下一个物理层提供“短”的逻辑步骤，将极大地提高我们理解和测试系统的彻底程度。\n\n![](img/fig0-17.jpg)\n\
  \n**图 0-17：细致的（但非细粒度的）软件**\n\n然而，仅凭细致的垂直分解对于高效的组件级测试（见第三卷第 7.5 节）是不够的，由于过度的物理依赖，它也不适用于独立重用（见节\
  \ 1.8）。我们还必须确保将同级的逻辑内容 —— 例如 `Circle`、`Triangle` 和 `Rectangle` 的各自定义 —— 分离到物理独立的单元中（见节\
  \ 3.2）。\n\n提供宽泛但浅层的逻辑内容（例如包装层）可能会触及底层的许多方面。如果这一层仅位于一个或少数大型单体物理单元中，那么当前目的不需要直接的功能仍然会引入其他不需要的功能（见节\
  \ 1.2.2）。结果是，为了测试或重用任何特定的逻辑内容单元，必须编译和链接比例大量的代码。可能的物理后果是编译时间、链接时间和可执行文件大小增加（见节 3.6），导致程序更大（且通常更慢）。为了缓解这些问题，我们必须仔细地横向和垂直方向上对逻辑设计进行划分。\n\
  \n经典的可重用软件是细粒度的；其横向模块化的结构如图 0-18 所示。我们所说的*细粒度*，是指在任何原子物理单元中实现的逻辑功能范围很小。针对定义良好的反复出现问题的代码化解决方案被封装起来，使得客户易于访问，同时在物理上独立于任何不需要的产物。然而，我们必须小心：如果这种封装过度，并最终嵌套了（因此使得实现细粒度功能的子功能变得不可访问），那么细致的垂直特性就丢失了，随之消失的还有*分级*重用。\n\
  \n![](img/fig0-18.jpg)\n\n**图 0-18：细粒度（模块化）但非分级的（非细分层）软件**\n\n在实践中，经典的库重用往往呈现双模态：可重用的解决方案要么是微小的（例如算法和数据结构）且缺乏策略（即控制何时、何地以及如何使用这些功能的特定上下文），要么是大型且影响力的（例如数据库、消息中间件、日志系统），它们会更强势地规定其预期的用途^(18)。\n\
  \n^(18) 框架提供了一种重要的但实质上不同的*自顶向下*的极粗粒度结构化重用形式。\n\n然而，很少有中间解决方案被提取出来、记录并向通用开放。\n\n\
  使用*组件*（见节 0.7）作为逻辑设计和物理封装的原子单元，图 0-19 所示的*细致的*、*细粒度的*软件结构结合了细粒度物理模块化（横向和垂直方向）的优势，以及清晰且文档良好的（见第二卷第\
  \ 6.15–6.17 节）逻辑分解。像图 0-17 中的薄层一样，这种组织有助于彻底的测试。并且像图 0-18 中的独立解决方案一样，这些组件仅依赖于所需的内容\
  \ —— 没有更多。\n\n![](img/fig0-19.jpg)\n\n**图 0-19：细致的软件**\n\n如果设计得当，细致的细粒度解决方案将由一系列良好的子解决方案构建，而这些又源于子子解决方案，以此类推^(19)。我们可以像剥洋葱一样轻松揭示抽象层，这些层在无需修改的情况下（见节\
  \ 0.5），为原始以及经常出现的新需求提供良好的子解决方案。\n\n^(19) 也参见 `stroustrup00`，第 24.3.1 节，页 733–734。\n\
  \n例如，常见类型 ——特别是那些流过函数边界的类型，如我们称为*词汇类型*的（类型，见第二卷第 4.4 节）—— 是显而易见的重用候选者。这些基础类型初看起来可能处于重用光谱的一端。然而，几乎所有的具体类型都构建在更低层的基础功能之上。\n\
  \n这种重用方法极具吸引力的部分在于，与经典重用的软件结构（例如图 0-12）不同，客户端不再限于单一抽象层。回想我们在图 0-12b 中经典的分解的面包机、牙刷和适配器。我们能够从这些部分轻松构建出面包机牙刷（图\
  \ 0-13b）。然而，通过跨越多个细致层扩展软件划分过程（如图 0-20a 所示），我们能够提供更丰富的互操作功能集（图 0-20b）。这种底层功能可以很容易重新组合形成新的更高层次的*重用*子解决方案，且成本大幅降低\
  \ —— 即开发成本*和*所有成本。这些微小的、完全划分的子实现（见第二卷第 6.4 节）通过允许彻底测试（见第三卷第 7.3 节）也提高了质量。\n\n\n\n\
  \n考虑完全分解的、细粒度的层级结构图 0-21，它最初由 `Toaster`（烤面包机）、`Adapter`（适配器）和 `Toothbrush`（刷子）组成。现在假设我们要求创建一个\
  \ `ToasterFlashlight`（烤面包机手电筒）和一个 `ToasterScrubbrush`（烤面包机刷）。根据图 0-12b 中的经典复用实现，我们可以通过构建一个标准的\
  \ `Flashlight` 类型，然后将另外两个标准部分——即烤面包机和适配器与新的手电筒组合，形成一个 `ToasterFlashlight`。然而，适当分解会导致用于实现手电筒的额外组件——即定义\
  \ `Lens`（透镜）和 `Stock`（主体）的组件（图 0-21a）。^(20)\n\n^(20) JC van Winkel 建议了一个很好的真实世界示例：Phonebloks，其中手机由可更换的积木构建——例如，如果不需要相机，就换上更大的电池。参见\
  \ [www.phonebloks.com](http://www.phonebloks.com) 和 [www.youtube.com/watch?v=oDAw7vW7H0c](http://www.youtube.com/watch?v=oDAw7vW7H0c)。\n\
  \n![](img/fig0-21.jpg)\n\n**图 0-21：利用细粒度分解的库软件**\n\n然而，如果需要的仅仅是一个烤面包机刷子，我们可能可以应用更多的“胶水”，利用组装刷子时完全相同的原始材料（即\
  \ `Handle`（手柄）和 `Bristles`（刷毛））来创建一个新的刷子！在不影响 `Toothbrush` 的情况下，我们可以通过适配器将新的 `Scrubbrush`\
  \ 类型与烤面包机结合，大功告成——一个 `ToasterScrubbrush`（图 0-21b）。\n\n细粒度的物理模块化对于有效复用至关重要。只有通过对粒度解决方案施加细微的划分，我们才能在每个抽象层级实现独立复用，而不仅仅是数据结构和子系统。此外，正是这种高度分解的、分层模块化的物理基础设施，使得能够直接（就地）访问原本无法访问而必须重复的子解决方案。\n\
  \n区分我们的层级可复用软件与传统软件的属性是：我们几乎永远不需要更改现有内容来快速响应新情况。我们的层级可复用软件解决方案库越成熟，我们执行得就越快，因为大部分工作已经为我们完成了（参见第\
  \ 0.9 节）。在第 0.6 节中，我们将仔细观察细粒度软件库的物理设计方面，但在下一节中，我们将探讨稳定性对有效复用的重要性。\n\n### 0.5 可塑\
  \ vs 稳定的软件\n\n良好的软件通常属于两类之一：可塑的（malleable）或稳定的（stable）。根据定义，可塑软件是指行为易于改变的软件。另一方面，稳定的软件具有定义良好的行为，且故意不被更改。重要的区别在于，可塑软件的行为意图是改变，而稳定软件的行为不是。两种软件都有其用武之地，但既不可塑也不够的软件是不理想的。\n\
  \n与稳定软件不同，可塑代码的行为通常是可以改变的。因此，良好的实践也适用于稳定软件。大多数敏捷程序员会自由承认，如果有机会使用成熟、可复用的解决方案，他们乐意使用任何现有的工具。\n\
  \n传统的设计技术直接导致了必须通过修改来维护的软件。我们在这里说的“维护”带有讽刺，指的是让代码执行我们今天想做的事，而不是我们昨天想让它做的事。例如，考虑以下旨在解决某些常见现实世界问题的函数\
  \ `f`：\n\n```\nf(a, b, c, x, y, z)\n```\n\n是什么让我们相信六个参数足够了？如果随着时间的推移，我们发现（或更可能是被要求考虑）额外的因素\
  \ d 甚至可能是 e，会发生什么？我们是否应该回去修改函数 `f` 以要求额外的参数？它们应该是可选的吗？\n\n在不贬低这种广泛采用的方法的情况下，我们确实想提醒读者，这个故事还有很多内容。尽管敏捷技术可以在短中期内快速开发中等规模的应用程序，但它们通常不适用于大规模软件开发——特别是（稳定的）可复用软件。\n\
  \n在光谱的另一端是一种被称为极端编程（XP）的方法论。这种方法的目标是尽可能地实现目标。其妥协是必须处理长期问题，而且敏捷程序员编写的软件很快可能需要更改。\n\
  \n许多敏捷程序员认为，重构代码比为未来的变化进行设计更好。这种想法基于需求会发生，因此保持活性更好。然而，这种方法对于需要稳定且具有高度需求集的软件通常并不适用。\n\
  \n\n\n\n在几乎所有情况下，这些问题的答案都是否。如果 `f` 应该实现某种记录在的行为并且目前正被多个客户端使用，我们根本无法回回去修改 `f` 使其行为与之前有实质性的不同，否则任何依赖于\
  \ `f` 的东西都无法无法工作。从某些指标来看，给定实体的`稳定性`衡量标准取决于依赖于它的其他实体数量。理想情况下，我们考虑的任何更改都应该保持所有客户端的原始假设不变（见第二卷第\
  \ 5.5 节）。\n\n`martin95`, 第 3 章, “指标，”第 246–258 页，特别是“(I) 不稳定性，”第 246 页，以及 `martin03`,\
  \ 第 20 章，“稳定依赖原则，”第 261–264 页，特别是“(不稳定性 I)，”第 262 页\n\n这里的问题源于一种从根本上过于乐观的设计方法：我们允许自己认为总有足够的参数来解决任何有趣的现实世界问题；通常并非如此——至少不会持续。不稳定性的根源通常可以追溯到重构不彻底。更稳定的设计会积极地将实现重构为一组更简单的函数，每个函数本身都有合理的概率是完整的：\n\
  \n```\nfa(a) fb(b) fc(c) fx(x) fy(y) fz(z)\n```\n\n如图 0-22 所示，给定一个更细致重构的、粒度设计 (图\
  \ 0-22a)，如果我们需要添加新函数 `fd(d)` 和 `fe(e)`，我们可能保持其他正在使用的函数不变（ 图 0-22b）。这样，任何现有的软件应用程序都不会受到影响。\n\
  \n在本书中，我们使用了与 `lakos96` 相同的符号（见 第 1.7.1 节–1.7.5 节），并进行了一些扩展（见 第 1.7.6 节），以支持泛型编程和概念仅限结构的特性（截至\
  \ C++20，这些概念已由语言直接支持）。\n\n![](img/fig0-22.jpg)\n\n**图 0-22：细粒度重构提高了稳定性**\n\n作为第二个示例，假设作为高质量基础设施的一部分，我们为\
  \ HTTP 编写了一个专有的高速解析器。各种应用程序开始使用该解析器作为客户端与服务器之间基于的通信的一部分，如图 0-23 所示。初始解析器是为 HTTP\
  \ 1.0 版本编写的，它不支持最新功能。随着时间的推移，某些客户端告知我们（抱怨）他们需要新版 HTTP 的功能，并礼貌地请求（要求）我们尽快发布符合 1.1\
  \ 标准的 HTTP 解析器（越快越好）。现在问题变成了，我们是升级原始解析器组件（即原地升级），还是发布一个完全符合 1.1 标准的新组件，并继续支持原始的\
  \ HTTP 1.0 解析器组件（即可能在同一个进程中并行运行）。\n\n![](img/fig0-23.jpg)\n\n**图 0-23：客户端通过代理跨防火墙与服务器通信**\n\
  \n答案是，我们*必须*创建一个具有独立身份的新组件，并让原始组件保持不变！解析器是一个完全位于这些模块实现内部的机制。对于那些控制客户端和服务器端且不需要新功能的应用程序，可能永远不需要升级到更高版本的\
  \ HTTP。此外，这种“升级”是对现有功能的更改——不是错误修复，也不是向后兼容的扩展。因此，更改的决定完全取决于每个具体的应用程序所有者，我们不能合理地要求他们参与后续的发布，或根据任何集中的时间表受到强制。\n\
  \n在某些情况下，库开发者必须强制应用程序开发者接受将库升级到新发布版本以利用新功能。当持续重构导致跨接口边界的常用类型发生变化时，这种强制尤为必要（见第二卷第\
  \ 4.4 节）。只要“升级”在实质上是向后兼容的（第二卷第 5.5 节），期望人们在“合理”的时间范围内进行迁移（即比典型假期最长时间长一点）是不合理的。尽管如此，升级的精确时机*必须*由应用程序开发者来协调。至少这样，应用程序开发者可以避免处于不一致的状态。\n\
  \n如果防火墙内的代理需要 1.1 兼容，紧急情况将迫使应用程序开发者尽早使用新版本。然而，如果代理本身尚未兼容 1.1，那么任何强加在现有应用程序上的此类更改将是灾难性的，因为新格式无法通过旧代理传播。\n\
  \n无论是否面向对象，我们工程哲学的一个基就是：为了对任何内容进行*彻底*测试，我们必须能够*分层*测试。也就是说，在物理层级的每一层，我们都应该能够仅根据底层组件来测试每个组件，而每个底层组件已经通过了测试（见\
  \ 第 2.14 节）。鉴于组件的彻底测试（更不用说正确实现）意味着对构建该组件的功能有完全了解，因此对底层组件行为的任何更改——无论多小——都可能使高层所做的假设失效，导致微妙的缺陷和不稳定。\n\
  \n编写行为不改变的代码的概念并不新鲜。Eiffel 语言的作者 Bertrand Meyer 将这种健全设计的一个重要方面描述为*开闭*原则：`meyer95`,第\
  \ 2.3 节，第 23–25 页`meyer97`, 第 3.3 节，第 57–61 页。\n\n软件应该是对扩展*开放*的，但同时对修改*关闭*的。也就是说，与其试图在一个组件中捕获所有潜在行为，我们提供了扩展该行为所需的钩子，而不必非要修改组件的源代码。\n\
  \n作为一个具体的例子，让我们考虑 C++ 标准模板库 (STL) 中实现 `std::list` 的 `list` 组件的设计。由于 `std::list`\
  \ 在使用值语义类型实例化时本身也是值语义的（见第二卷第 4.3 节），定义 `std::list` 的组件（理想情况下）也应该提供一个实现等价比较标准含义的自由运算符：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```cpp\ntemplate <class TYPE>\n\nbool operator==(const list<TYPE>&\
  \ lhs, const list<TYPE>& rhs);\n\n    // 如果指定的 'lhs' 和 'rhs' 对象具有\n    // 相同的值，返回\
  \ 'true'，否则返回 'false'。两个 'std::list<TYPE>'\n    // 对象具有相同的值，当它们具有相同数量的\n    //元素且对应位置上的元素具有相同的\n\
  \    // 值时。\n```\n\n现在，假设我们发现需要用比提供的方法以外的方法比较两个列表的相等性。也许我们关心的仅仅是，例如对应元素的绝对值是否相同。我们该怎么办呢？\n\
  \n如果这是我们自己的类并且我们可以对其进行修改，我们可能会考虑向类中添加一个 `absEqual` 方法，但这种“解决方案”是完全不恰当的，因为它违反了开闭原则。我们可能会简单地考虑提供某种回调函数或模板参数，以允许我们自定义相等性操作；然而，这两者都很糟糕，而且这些提议的补救措施都无法保证解决我们可能遇到的其他类似问题。例如，假设我们还想以某种特定格式打印列表的内容。我们专门的\
  \ `absEqual` 方法将对我们没有帮助。\n\n更改现有可重用功能的行为是错误的，即使是对以前被认为是完整的组件添加新行为，通常也是不是次优的。事实上，任何针对单个客户需求的侵入性补救措施都是高度协作的，并且几乎总是误导性的。解决稳定性问题的通用解决方案是设计组件，使其能够对客户进行高效的、非侵入性的、单向的扩展开放；具体到\
  \ `list` 组件（以及对所有容器而言），这种方法就是提供一个迭代器^(30)\n\n即使是传统上只提供对栈顶元素访问的 `Stack` 类型，也应该恰当地关联一个迭代器，以支持客户进行类似的单向扩展。请注意，在封装方面完全没有问题\
  \ —— 即使接口受限，`Stack` 类的客户端仍然能够比较两个 `Stack` 对象的“绝对相等性”（只是效率不高而了）。\n\n点击此处查看代码图像\n\n\
  ```cpp\nbool myAreAbsEqual(const Stack& lhs, const Stack& rhs)\n{\n    Stack u(lhs),\
  \ v(rhs); // 昂贵的！                         （坏主意）\n\n    while (!(u.isEmpty() || v.isEmpty()))\
  \ {\n        if (std::abs(u.top()) != std::abs(v.top())) {\n             return\
  \ false;                                      // 返回\n        }\n\n        u.pop();\n\
  \        v.pop();\n    }\n\n    return u.isEmpty() && v.isEmpty();\n}\n```\n\n迭代器恢复了这种效率，而没有对实现的选择增加任何限制，也没有增加额外的运行时开销。\n\
  \n提供迭代器使得容器的每个客户端都能立即实现几乎任何适当的扩展。例如，图 0-24](#ch00.xhtml_ch00fig24) 中的两个函数都是 `list`\
  \ 组件的独立的、客户端的扩展。通过迭代器设计扩展性，我们可以合理地确保为了该目的，永远不需要对可重用容器进行任何源代码修改。这种单向扩展性原则也有助于确保应用程序开发人员不会被劫持去等待只能由库开发者提供的增强功能。请注意，C++\
  \ 标准库中的所有容器类型都配备了迭代器，可以高效地访问每个包含的元素^(31, 32)\n\n正如在第 3.2 节](#ch03.xhtml_sec2)中所讨论的，这是开闭原则的一个更通用但更详细的插图。在这种情况下，由于迭代器是一个具有良好定义属性的概念，具体的\
  \ C++ 类型变得不再重要。在这种情况下，我们可能倾向于使用 `auto` 关键字让编译器来推断类型，而不是在每次需要时都为它定义别名，如代码所示：点击此处查看代码图像\n\
  \n```cpp\nbool myAreAbsEqual(const List& lhs, const List& rhs)\n{\n    auto    \
  \         lit  = lhs.cbegin();\n    auto             rit  = rhs.cbegin();\n    auto\
  \ const   lend  = lhs.cend();\n    auto const   rend  = rhs.cend();\n\n    while\
  \ (lit != lend && rit != rend) {\n        if (abs(*lit) != abs(*rit)) {\n      \
  \      return false;                                               // 返回\n     \
  \   }\n\n        ++lit, ++rit;\n    }\n\n    return lend == lit && rend == rit;\
  \  // 我们通常避免将可修改的操作数\n                                       // 放在运算符左侧。\n}\n```\n\
  \n在这种情况下，我们可能更倾向于使用范围 `for` 循环配合 `auto`（作为 C++11 的引入）：\n\n```cpp\nstd::ostream&\
  \ myFancyPrint(std::ostream& stream, const List& object)\n{\n    stream << \"TOP\
  \ [\";\n\n    for (const auto &v : object) {\n\n        stream << ' ' << v;\n  \
  \  }\n\n    return stream << \" ] BOTTOM\";  // '<< std::flush' 是可选的。\n}\n```\n\n\
  ![](img/fig0-24a.jpg) ![](img/2b.jpg)\n\n**图 0-24：列表操作的单向客户端扩展**\n\n有趣的是，C++ 语言最初对自己也采用了类似的设计目标。并没有尝试构建一套完整的类型或机制。在许多竞争候选者中选择一种类型或机制只会限制而不是扩展它的范围。\n\
  \n因此，C++ 没有内置复数、字符串或矩阵类型，也没有对并发、持久化、分布式计算、模式匹配或文件系统操作直接支持，这只是最常提到的扩展之一^(34)\n\n\
  相反，C++ 设计（和演进）的焦点一直是改进抽象机制（最初通过继承，后来通过模板），以便高效地整合以后以组织良好的稳定库形式提供的任意（用户定义）类型和机制。此类库可以提供任何抽象类型或机制的多个具体变体，这些变体可以同时存在于单个程序中。本书很大一部分都在讨论将这种根于语言本身的高尚架构哲学推向其自然结论，即形成良好的基于企业级库的解决方案（参见第\
  \ 0.9 节）。此外，C++ 允许你以这种方式创建这些库和新类型，使其接口与 `int` 等原生公民相同，并且表现就像它们是原生一样。\n\n\n\n\n\n\
  继承，如果使用得当（第二卷第 4.6 节），无疑是实现大规模、无需修改的扩展的最强大的机制。考虑图 0-25 中简单的报告生成器架构。在这种经典的分层设计中（参见第\
  \ 3.7.2 节），`PostscriptOutputDevice`模块接收输出请求并将其转换为适用于驱动 PostScript 打印机的格式。关于如何正确编写账户的所有详细知识都位于\
  \ `AccountReportWriter` 模块中（而不是 `PostscriptOutputDevice` 模块）。到目前为止一切良好。\n\n![](img/fig0-25.jpg)\n\
  \n**图 0-25：一个简单的 `Account` 报告生成器**\n\n我们只需通过添加新的报告模块即可扩展我们能生成的报告类型，如图 0-26 所示。而且，假设进行了仔细的细粒度重构，用于实现原始\
  \ `AccountReportWriter` 模块的大部分代码将这些新报告生成器通用的。\n\n![](img/fig0-26.jpg)\n\n**图 0-26：添加新类型的报告**\n\
  \n但当我们想要添加新类型的输出设备时会发生什么？我们如何在不修改该架构的情况下扩展它呢？权宜之计是复制并重命名整个报告集，并将它们重新定向到新的输出设备，如图\
  \ 0-27 所示。不言说，从维护的角度来看，这不是一个好的长期解决方案。\n\n![](img/fig0-27.jpg)\n\n**图 0-27：通过复制代码来添加新类型的输出设备（坏主意）**\n\
  \n相反，假设我们决定将所有设备接口合并到一个接口中，该接口可以用于驱动所有适当的设备。给定一组现有接口，我们可能会考虑将此组件作为一个包装器，在逻辑上封装特定设备，如图\
  \ 0-28 所示。这种解决方案虽然在实践中经常被采用，但在多个方面都失败了。除了每当有新设备上线时必须修改输出管理器的源代码外，我们还施加了极其过分的物理依赖：*每一个*报告生成器为了使用（甚至为了测试），必须与*每一个*已知的输出设备链接。仿佛这还不够糟糕，某些设备（例如\
  \ Windows 输出设备）可能在每个支持的平台上都不！说够了。\n\n![](img/fig0-28.jpg)\n\n**图 0-28：封装一个易扩展的集合（坏主意）**\n\
  \n正如本书书中将反复出现的主题一样，我们将选择避免封装固有可扩展的、不可移植的、第三方的或其他不可控或风险风险软件，这些软件可能会对我们的核心库产生不稳定的影响。相反，我们将捕获此类行为的定义——通常^(35)称为一个*协议*（纯抽象接口）类（参见第\
  \ 1.7.5 节）——并附带详细注释，精确说明预期的行为。通过这种方式，应用程序可以随地引入新的输出设备；唯一的限制是这些新的具体实现必须满足抽象接口施加的*契约*（参见第二卷第\
  \ 5.2 节）。在这种设计中，客户端和实现作为对等实体存在，每个只依赖于包含接口的低级组件。这种抽象接口方法的进一步好处是，通过惯用地重用（“模拟的”）`TestOutputDevice`\
  \ 来方便客户端测试（参见第二卷第 4 章和第三卷第 9 章）。对于我们的报告编写问题，一个完全重构的、双向扩展的但绝对稳定的解决方案在图 0-29 中给出。\n\
  \n^(35) 第 3.5.7 节 探索了协议（参见第 3.5.7.4 节）以及其他几种替代方案，包括概念（参见第 3.5.7.5 节）。\n\n![](img/fig0-29.jpg)\n\
  \n**图 0-29：一个完全重构的解决方案**\n\n并不是所有软件——特别是在应用层——都是稳定的。应用程序的每个版本的行为必须以某种方式与上一个不同，否则（除了纯性能调优之外）其意义何在呢？在开发高层应用代码时，放弃稳定性并专注于可塑性可能更有效。也就是说，我们不是尝试应用开放封闭原则，而是接受代码将发生变化，并专注于让此类更改变得安全且容易。例如，将可能一起更改的代码放在靠近的地方是一种常见做法（参见第\
  \ 3.3.6 节）；理想情况下，相互依赖的代码量应该小到足以放进单个组件中。然而，当允许对现有行为的不兼容更改通过公共接口暴露出来时，该部分软件就*不是*稳定的。无论这种代码是否被认为具有可塑性，它绝对是不可重用的。\n\
  \n如图 0-30 所示，可塑性软件与稳定软件的使用方式完全不同。区分可塑软件与可重用软件的最显著特征也许是，可塑软件必须只有一个主。如图 0-31 所示，允许多个主拥有单方面要求共享软件更改的权限会导致过度约束的问题(00-31a)，通常会导致次优的结果(00-31b)。\n\
  \n![](img/fig0-30.jpg)\n\n**图 0-30：可塑性软件与可重用软件**\n\n如果软件的既定行为必须改变，那么它应该在一个主者的驱动下改变，并且只影响该主——即单个应用程序。推论是，属于一个应用程序的可塑性软件不能与另一个应用程序共享（参见第\
  \ 2.13 节）。\n\n基础设施一旦使用，就需要进行维护和增强。对于传统的粗粒度重构，基础设施软件被用得越多，随着急切的用户不断要求更多功能，维护成本就越昂贵。未能提供这些增强功能会让用户感到不受支持和不愉快，特别是他们通常没有方法单方面地扩展这些功能——这违反了开放封闭原则。\n\
  \n通过确保可重用基础设施的细粒度渲染，许多与重用相关的成本被消除了。单个组件保持稳定，任何增强都将是增式的而非迭代的。\n\n\n\n\n\n总而言之，我们实现有效重用的方法是通过`分层`重用。低级、中级和高级重用组合发生的频率高得惊人，我们将在第\
  \ 0.8 节中通过类比来说明。常见的可重用但非常底层的组件示例包括内存池和分配器、管理/共享指针、函数对象、作用域守护器（scoped guards），当然还有同步和通信原语，这仅仅是其中一角。在本书中，我们将展示发现、设计、实现和测试这些低级但高杠用率组件的过程。这种细致的重构并非易事；但正是这种对细粒度重构的关注，帮助我们实现了无与伦比的重用和稳定性，因为它允许我们组合并从而扩展软件基础设施提供的功能，而无需总是对其进行修改。\n\
  \n到为止，我们对提倡的软件特征描述为`细分渐进`且`粒度化`，具有整洁的分解，并且通常只允许常见的、简单的（例如 `scalar` 类型）类型通过（文档良好的）函数接口传递。这些简单类型构成了基本词汇（见第二卷第\
  \ 4.4 节），信息通过它们跨越函数边界传输。我们认为，具有较小`表面积`且易于描述的接口比复杂或`协作式`的接口从根本上更有能力也更有可能在新环境中被重用。\n\
  \n在本节中，我们引入了一个表征软件的新维度：稳定性。在可能的范围内，我们希望软件——特别是我们的库软件——是稳定的，因此具有潜在的可重用性。为了稳定性而设计（见第二卷第\
  \ 5.6 节）是我们日常开发工作的重点。事实上，我们对大规模软件开发的通用方法从根本上要求通过递归地在现有基础上构建构建新软件，而不是迭代地更改它。\n\n\
  与纯函数式语言（如 lambda 演算或纯 Lisp）相比，而非命令式语言（如 C 或 Java），这种在架构上的类比也与现代 C++ 泛型编程中使用模板和元函数所采用的迷人的编译时风格极其相似，参考^(36)（见第二卷第\
  \ 4.4 节）。也就是说，一旦我们“实例化”一个可重用组件（即编写并发布它），我们就可以引用（即依赖）它，但随后不能更改它的“值”（即更改其定义的或隐含的逻辑契约，或实质性地降低其本质物理特性的任何方面）。一个全公司的分层可重用软件库就是这样积累的，它不仅质量极高，而且极其稳定（见第\
  \ 0.9 节）。在下一节中，我们将开始仔细观察细分渐进、粒度化软件的`物理`方面。\n\n^(36) **alexandrescu01**, 第 3.5 节,\
  \ 第 55 页\n\n# 0.6 物理设计的关键作用\n\n大规模开发成功的软件需要对设计的两个不同但高度相关的方面有深入的理解：`逻辑`设计和`物理`设计。按照我们使用的术语，逻辑设计处理的是我们开发的软件的所有`功能`方面。例如，功能规范规范了应用程序、子系统或单个组件的整体逻辑设计。将特定类设计为具体，还是为所需的功能提供抽象接口，这是一个相当高层次的逻辑设计选择。是否使用带线程或不带线程的阻塞或非阻塞传输（即进程间通信）也属于逻辑设计的范畴。\n\
  \n从历史上看，大多数关于 C++ 的书籍`只`涉及逻辑设计，而且往往处于非常底层的水平。例如，一个特定类是否应该具有拷贝构造函数，是一个低级但非常重要的逻辑设计问题。刻意将某个特定运算符（例如\
  \ `operator==`）设为`自由`（即非成员）函数也是一个低级逻辑设计选择。即使是选择类的特定私有数据成员也会被视为低级逻辑设计的一部分。然而，在任何层面上，仅靠逻辑设计都无法考虑软件开发中许多重要的实践方面。随着开发组织规模的扩大，不同性质的力量开始发挥作用。\n\
  \n物理设计，如图 0-32 所示，解决的是围绕将逻辑实体（如类和函数）放置到物理实体（如文件和库）中的问题。所有设计都有物理方面。这是因为构成典型 C++ 程序的所有源代码都存在于文件中，而文件是物理的。例如，当我们谈论重用时，我们可能在想一个子程序或类，但这些东西不能直接重用。可以被重用的可能是定义和实现该逻辑内容的文件集。因此，我们将逻辑构造聚合为离散物理模块的方式，是重用设计（特别是）以及良好设计（通常）的关键方面。\n\
  \n![](img/fig0-32.jpg)\n\n**图 0-32：物理设计的定义**\n\n物理设计决定了在整个企业范围内，编码功能相对于其他功能位于（物理上）的`哪里`——例如，在哪个库中。识别跨物理边界的编译时和链接时依赖将有助于塑造软件的逻辑和物理设计方面。例如，供全公司重用的常用功能在（物理上）属于我们软件仓库的`低级`部分，`高级`应用软件开发者可以在那里找到并使用它（例如，见\
  \ 0-7），而独立于其他应用程序。\n\n物理模块之间的`循环`依赖已成为公认^(37,38,39)应当避免。通过采用成熟的物理设计技术（见第 3.5 节](#ch03.xhtml_ch03lev1sec5)），我们确保只在链接时间和可执行文件大小上为所需付费（见第\
  \ 2.2 节](#ch02.xhtml_ch02lev1sec2)–第 2.4 节、第 2.6 节、第 2.8 节、第 2.14 节以及第 3.4 节）。此外，我们希望开发出独立于同行解决方案的可用解决方案（见第\
  \ 3.7 节](#ch03.xhtml_ch03lev1sec7)），并与它们在同一个进程中共存（见第 3.9 节](#ch03.xhtml_ch03lev1sec9)）。详细的物理设计要求我们正确回答许多逻辑设计无法解决的重要问题。例如，\n\
  \n^(37) **lakos96**, 第 4.11 节，第 184–187 页以及第 7.3 节，第 493–503 页\n\n^(38) **sutter05**,\
  \ 第 22 项，第 40–41 页\n\n^(39) 关于编译时依赖（仅），另参见 **meyers05**, 第 31 项，第 140–148 页。\n\n\
  -   两个给定的类应该在同一个头文件中定义，还是在两个单独的文件中（见第 3.3 节](#ch03.xhtml_ch03lev1sec3)）。\n\n-  \
  \ 一个给翻译单元是否应该依赖其他翻译单元？（见第 3.8 节](#ch03.xhtml_ch03lev1sec8)）。\n\n-   我们应该 `#include`\
  \ 包含给定逻辑实体声明的头文件，还是简单地对其*前向声明*？（见第二卷第 6.6 节。）\n\n\n\n\n\n- 给定的函数是否应该声明为 `inline`？（参见第二卷，第\
  \ 6.7 节。）\n\n这类物理设计问题虽然与开发的各个方面紧密相关，但它们带来了一个设计维度，即使是“专家级”软件开发者可能很少或完全没有经验。*物理设计*虽然不如*逻辑设计*广为人知，但随着小组、部门或公司内部开发的应用程序和库的数量和规模不断增长，它发挥着日益重要的作用。\n\
  \n将深思熟虑的逻辑设计与仔细的物理封装相结合，使软件开发者能够在精细的集成级别上“混合搭配”现有的解决方案、子解决方案等（第 0.3 节）。这种组合灵活性加上逻辑与物理的可操作性，对于最大限度地实现通过*层次重用*（第\
  \ 0.4 节）实现的规模效益。\n\n我们在介绍了动机（本章）、讨论了涉及编译器和链接器的一些概念（第 1 章），并学习了如何有效地对逻辑内容进行定位、封装和聚合（第\
  \ 2 章）之后，将在第 3 章中回到大规模物理设计的话。\n\n# 0.7 物理均匀软件：组件\n\n我们软件的物理形式对于我们管理软件的能力至关重要。除了具有良好的物理结构外，要求我们的专用软件具有*物理均匀*的组织可以极大增强我们和他人理解、使用和维护它的能力。此外，物理均匀性促进了有效开发工具的创建（例如规则检查器、依赖分析器、文档提取器），这些工具可以直接在软件（作为数据）上运行。“愚蠢的一致[很可能是]小头脑的眼中魔鬼，”但我们非常确定爱默森^(40)在写这句话时指的并不是软件的物理形式。\n\
  \n^(40) 在他的文章《自立》中，R. W. 爱默森“并没有解释愚蠢与明智一致之间的区别”（**hirsch02**，《谚言》，第 47–58 页，特别是第\
  \ 51 页）。\n\n为了说明软件中*物理均匀性*的重要性，让我们花一点时间考虑其他物理媒介的形式，如视频录像带、光盘、DVD 等。这些实体的逻辑内容除了数量外，本质上并没有受到限制。你从当地录像店租的同一个磁带可能包含斯皮尔伯格的最新热门电影、一部旅游纪录片，甚至是一段健身视频。逻辑内容可以是任何东西，但物理形式是相同的。\n\
  \n我们中的一些可能记得，在录像带早期有两种不兼容的格式：VHS 和 Beta。*哪个更好*远不如*有两种*那么重要！很快就变成了一个！当电影可以在 DVD 上观看时，问题再次出现。视频既有带又有\
  \ DVD 也是多余的。租视频不仅需要找到想要的电影，还需要确保设备兼容。物理形式越多，互操作性问题就越麻烦。\n\n采用标准的物理磁带来表示逻辑内容大大简化了支持工具的集成。例如，DVD\
  \ 刻字机享有规模效益，因为它可以适用于所有制造商的所有 DVD（与内容无关）。相比之下，想象如果每部电影标题都出现在自己物理唯一的介质上——每个标题都需要一套自己的设备来查看和维护它！\n\
  \n跨物理设备互操作的论点也适用于软件模块。要求用一个标准的物理格式来存放软件的所有原子单元，同样有助于创建更具支持性的开发环境。只需知道用于支持一个项目的工具在下一个项目中也是行的，就会使得它们的开发（或采购）更具成本效益，因此更有可能。一次又一次，这种均匀性一无例外地证明了会导致更可重复、更可预测的开发过程。\n\
  \n物理形式的一致性也给人类带来了令人欢迎的熟悉感。许多人知道如何看 DVD。当将其应用于新语境时（例如在参加视频课程时），学生将不需要学习新的组织技能来观看讲座。类比，软件的高度物理均匀性允许工程师在不同项目之间更自由地流动。在软件领域，这个术语是*开发者流动性*。无论是视频课程还是软件，物理均匀性让人们更容易将更多精力集中在逻辑内容上，毕竟这才是目标。\n\
  \n为了让我们的专用软件在所有应用程序中具有完全的可操作性，其物理形式和组织必须完全独立于它所体现的功能。我们现在无法准确知道我们要开发哪些应用程序——更不用说未来了。然而，我们即将描述的物理组织随着时间的推移证明了它在计算机辅助设计和金融服务等不同行业中运行良好。此外，这种层次的*物理*结构本质上是可扩展的，成功解决了代码行数从不足\
  \ 10,000 行到 100,000,000 行以上的系统。我们组件化方法论中最基本的组织单元并不意外地被称为*组件*，我们稍后在这里介绍它，并在第 1 章中彻底探讨。随后，在第\
  \ 2 章中，我们将描述一个全局的*元*框架^(41)，它让所有这些组件共同工作。\n\n^(41) 框架（即应用框架）通常是特定领域的；而元框架（即构建框架的框架）则不是。\n\
  \n*组件*一词在不同语境下有不同的含义。许多系统架构师将组件视为*部署单元*，例如 COM 组件或 ActiveX 控件（*插件*）。在这种意义上，一个 `main`\
  \ 程序（例如服务器）可以是分布式执行文件（进程）网络中的“组件”。甚至整个库也可以被认为是大型开发环境的单个“组件”。其他更关注单个程序的人将组件视为任何重要的子系统，例如订单簿、路由器或日志器。还有人将组件视为任何离散的逻辑内容，如嵌套在（工具）`struct`\
  \ 中的类或静态方法（或者相当于局部命名空间中的自由函数）。虽然这些解释在适当的范围内都是可以的，但没有反映我们对*组件*一词的定义。\n\n根据我们的定义，*组件*是物理设计的原子单元。在\
  \ C++ 中，它以 `.h`/`.cpp` 对的形式存在（参见第 1.6 节^(42)每个组件应该关联一个独立的测试驱动程序（参见第三卷第 7.5 节），能够执行该组件中实现的所有功能。这种普遍的物理组织模式（在图\
  \ 0-33 中示意性地所示）是我们所有应用程序和库软件的基本封装单元。我们使用 `.cpp` 后缀来区分 C++ 源文件和 C 源文件。我们在书中将统一使用\
  \ `.h` 和 `.cpp`。\n\n\n\n\n\n# 图 0-33：组件及其测试驱动程序的示意图\n\n一个组件体现了相对*小规模*的*逻辑设计*；其内容具有内聚性，因为其提供的功能在逻辑上是一个整体。我们说一个组件是*原子的*，因为(1)\
  \ 使用任何部分都可能意味着对整体的使用，(2) 任何显式想要只使用组件某部分的愿望都强烈表明该组件提供的功能拆分得不够。最后，组件具有*良好*且*定义*的（理想情况下是*良好*且*设计*的）接口（例如，它应该被设计成可测试的）。\n\
  \n作为一个具体的例子，请考虑图 0-34 中所示的“玩具级”栈组件 `my_stack` 的头文件，它实现了一个基本的整数栈抽象。`Stack` 是一种容器。回想第\
  \ 0.5 节（以及我们对开闭原则的讨论），容器应该具有迭代器，因此我们的 `Stack` 类也应该有一个迭代器。尽管访问栈顶以外的元素通常不被认为是栈抽象的一部分，但提供迭代器可以使组件更具客户端可扩展性，从而更加稳定。\n\
  \n从这个头文件中，我们可以看到组件包含两个不同的类：`Stack` 和 `StackConstIterator`。我们还可以看到有两个自由（即非成员）运算符函数，分别在两个\
  \ `StackConstIterator` 对象之间以及两个 `Stack` 对象之间实现了 `==` 和 `!=`。最后，由于 `Stack` 代表了一个在当前进程之外具有意义的*值*（参见卷卷\
  \ II，第 4.1 节），我们包含了一个输出运算符 `<<` 以以某种人类可读的形式渲染这个*值*。(43) 注意，为了说明起见，我们将任何关于打包（例如文件前缀和命名空间）的讨论推到第\
  \ 2 章。\n\n在实践中，我们可能还想提供方法，如 `streamIn` 和 `streamOut`，将此值序列化到抽象字节流中（参见第卷 II，第 4.1\
  \ 节）。注意，我们还提供了一个可选的内存分配器（在构造时提供），用于管理栈对象整个生命周期内的动态分配内存（参见第卷 II，第 4.10 节）。\n\n![](img/fig0-34a.jpg)\
  \ ![](img/fig0-34aa.jpg) ![](img/fig0-34b.jpg)\n\n**图 0-34：玩具（整数）栈组件的头文件 `my_stack.h`**\n\
  \n⁴⁴ bde14, 子目录 `/groups/bsl/bslma/`\n\n⁴⁵ bde14 子目录 `/groups/bsl/bslma/`\n\n通过查看实现代码，我们会发现\
  \ `Stack` 的 `operator==` 和 `operator<<` 都使用了类 `StackConstIterator`，并且这两个类的的 `operator!=`\
  \ 都是基于相应的 `operator==` 实现的。组件 `my_stack` 在文件作用域内的完整逻辑实体集在图 0-35a 中所示，并使用了第 1.7 节的符号。物理实体（`my_stack.h`\
  \ 和 `my_stack.cpp`）以及它们标准的物理关系（参见第 1.6.1 节）描在图 0-35b 中。\n\n![](img/fig0-35.jpg)\n\
  \n**图 0-35：我们的 `my_stack` 组件的两种视图**\n\n更通地说，一个组件通常会定义一个或多个相关的类，以及任何认为适用于其支持的抽象的自由运算符。如图\
  \ 0-36 所示，组件名称将反映在其包含的每一个顶层逻辑实体中（参见第 2.4.9 节）。基本类型（例如 `Point`、`Datetime`、`BigInt`、`ScopedGuard`）将分别实现在包含单个类的组件中（图\
  \ 0-36a）。泛型容器类（例如 `Set`、`Stack`、`List`）通常实现在包含主类及其迭代器的组件中（图 0-36b）。涉及多个类型的更复杂抽象（例如\
  \ `Graph`、`Schema`、`ConcreteWidgetFactory`）可以在单个组件中体现多个类（图 0-36c）。最后，为整个子系统提供封装器（也称为*外观*）的类（例如\
  \ `Simulator`、`XmlParser`、`MatchingEngine`）可能会形成一个薄薄的封装层，该层由多个主类和许多迭代器组成。\n\n\n\n\
  \n然而，从逻辑角度来看，图 0-36d 所示的组件其功能*确实*比图 0-36a 中的组件要多得多。虽然`point` 组件的大部分（如果不是全部）^(48)实现可能直接体现在该组件的源代码中，但通常并非如此。例如，`map`\
  \ 的实现可能会将其部分功能委托给少数更低级的组件，例如（默认）内存分配器（见第二卷第 4.10 节），以及各种特质（traits）和元函数。而且正如图 0-37\
  \ 所示，更复杂的机制（例如交易系统的匹配引擎）将委托给层层子功能，所有这些功能在理想情况下都应该经过深思熟虑的提取，并放置在大小相当的组件中，适地分布在我们公司的分层可重用软件库中（参见第\
  \ 0.9 节）。\n\n^(48) 但可能并非全部。考虑一下，一个点可能关联某些特质，例如“位可拷贝”，它可能想要从另一个组件包含它。输出和序列化是另外两个可能依赖于其他组件的操作。最后，针对*窄*合约（见第二卷第\
  \ 5.3 节）的*防御性*检查（见第二卷第 6.8 节）也最好从一个独立的低级组件中导入。\n\n![](img/fig0-37.jpg)\n\n**图 0-37:\
  \ 物理位置——*不是*大小——决定了组件的作用范围。**\n\n值得注意的是，这种组合的观点——即通过递归委托给稳定、可重用的组件——与传统应用开发中典型的嵌套、协作且因此是私有的子架构有着本质上的区别。在那种设计范式中，系统拥有并隔离其子系统，而子系统又拥有并隔离它们的子系统——其优点是子系统在其他情况下无法被访问，因此不需要稳定。缺点是子系统之间没有通用解决方案的共享——换句话说，没有重用。\n\
  \n在这种新的组合范式中，实现匹配引擎的组件充当封装封装器^(49)（参见图 3-5、第 3.1.10 节）。只有那些实现了流出封装组件内部的（词表）类型（第二卷第\
  \ 4.4 节）的组件才参与其合约（第二卷第 5.2 节）。对所有其他对象的依赖是无法通过程序发现的实现细节。对于这些仅用于实现的组件，封装一个组件意味着封装它的*使用*，而不是组件本身^(50)（参见第\
  \ 3.5.10 节以及图 3-140、第 3.11.2 节）。这种本质不同的组合和封装形式——即基于依赖而非包含——使得稳定解决方案（第 0.4 节）的分层重用（第\
  \ 0.5 节）成为可能。\n\n^(49) `lakos96**，第 5.10 节，第 312–324 页，特别是图 5-95，第 319 页\n\n^(50)\
  \ `lakos96**，第 5.10 节，第 312–324 页，特别是第 318 页上的定义\n\n正如此处所示，组件是逻辑和物理设计的适当基本单元。组件像类一样允许提取，从而帮助我们将大问题分解为小问题，而且我们可以很好地解决小问题。但组件与类不同，它能够考虑到超出逻辑设计范围的客观物理属性（例如编译和链接时的依赖关系）。组件作为物理实体，将紧密相关的类（例如容器和它的迭代器）以及紧密相关的自由运算符（例如输出运算符和等值运算符，分别为\
  \ `operator<<` 和 `operator==`）统一在一个单一的内聚单元中。组件以文件的形式表示（而不是源代码的区域），它们是物理模块，可以被单独地从一个*平台*^(51)\
  \ 提取出来并部署到另一个平台上，而永远不需要调用文本编辑器。^(52)。最后，构制良好的组件可以经过充分测试，因为它们很小，而且设计时经过了考虑（参见第二卷第\
  \ 4.9 节）。正如我们将看到的，组件——正如*我们*定义的——使我们能够实现逻辑设计与物理设计之间的巨大协同效应^(51) 在任何其他平台上运行软件^(52)\
  \ 而无需修改源代码。\n\n### 0.8 量化语义重用：一个类比\n\n应用软件的自顶向下设计业务实际上是一系列优化代价函数的划分问题。功能性、易用性、可用性、可靠性、维护性、移植性、上市时间以及总开发成本（仅举例）都是潜在的参数。我们还讨论过通过积累和维护细粒度层次化的有用（稳定）解决方案库来加速开发的方法。\n\
  \n到目前为止，我们只提到了我们通用方法的可扩展性的数学倾向，即对组件软件进行合理的层次重用。为了完成评估层次重用巨大潜在益处的任务，我们将通过一个类似但简单得多、易处理的问题来定量地演示。\n\
  \n假设我们想编写一个程序来格式化函数文档，避免由于 `MyVeryLongType` 这样的长词而在行尾留下大量空格。图 0-38a 展示了通过在每一行放置尽可能多的单词再换行来格式化的文档。图\
  \ 0-38b 展示了相同文本具有较不整齐右边缘的更美感的渲染。这种美学解决方案在计算上更密集，因为我们不再使用直接的划分算法，而是必须优化一个非平凡的全局代价函数，就像我们在经典的自顶向下设计中划分软件时那样。\n\
  \n**图 0-38: 具有不同代价函数的简单文本填充问题**\n\n更正式地说，我们正在尝试解决以下“困难”问题：\n\n给定 (1) 最大行长度 *L* 和\
  \ (2) 一个包含 *N* 个单词的序列 {*w*[0] … *w[N]* – 1},每个单词的独立长度在 1 到 *L* 个字符之间，对单词进行划分，使得将任意非负值、单调递增的代价函数\
  \ *f*(*x*)——例如\n\n```\nf(x) = x³\n```\n\n应用于每行（除最后一行外）的未使用（尾随）空格数 *x* 的结果之和最小。\n\
  \n\n\n\n请注意，正如复用软件中常见的做法，我们将问题公式化为极简的形式，通过消除关于间隔空格的具体细节，使其具有更广泛的适用性。类似的最小化问题（即行中每个单词之间包含一个间隔字符）只需通过将行长度\
  \ `L` 以及每个单词的长度 `|w[i]|` 分别增加 1，即可还原为这个基础问题。事实上，通过选择不将空格硬编码到基础问题中，我们还可以使用相同的解决方案来解决等宽字体的问题，只需将行长度、空格字符以及每个单词中的单个字符用其对应的\
  \ `points` 数来表示即可。^(53)\n\n^(53) 回想第 0.5 节中提出的开闭原则，该原则规定组件对扩展（通过客户端）开放，但对修改（通过库开发者）关闭。\n\
  \n这个基础划分问题的一个实例如所示[图 0-39a]所示。让该优化问题变得“困难”的是非线性的全局成本函数（图 0-39b）。如果我们只需要最小化所有行末尾未使用空间的总和，我们就可以使用`greedy\
  \ algorithm`（贪心算法）在单次扫描中（以线性时间）在每行上填充尽可能多的单词（图 0-39c）。但是，由于成本函数更为通用，我们被迫考虑每种可能的划分，以查看它是否能产生最佳结果。^(54)\n\
  \n^(54) 注意，此问题在本质上与看似相似的问题（例如“装箱问题”或“一维背包问题”）不同，因为在这个问题中，单词必须按照它们被提供的顺序进行“打包”。\n\
  \n在这个例中，事实证明，通过选择不将第三个单词放在第一行——尽管它能够放得下——每行末尾空格数的立方和之和减少了 730 – 250 = 480（图 0-39d）。\n\
  \n![](img/fig0-39.jpg)\n\n**图 0-39: 填充文本以使非线性全局成本函数最小化**\n\n让我们来看看我们可能如何在软件中解决这个问题，如图\
  \ 0-40 所示所示。与我们基于库的应用程序开发方法论一致，该问题的软件解决方案——即一个程序——被实现为两个部分：(1) 一个具有稳定接口和契约的新类型组件，用于解决基础问题（图\
  \ 0-40a），以及 (2) 一个包含 `main` 的相应驱动文件，它负责适配这个良好分、稳定的子解决方案，以便能够从命令行方便地对任意文本进行调用（图 0-40b）。现在剩下的只需在库组件的\
  \ `.cpp` 文件中为 `FormatUtil::calculateOptimalPartition` 提供一个有效的实现。\n\n![](img/fig0-40a.jpg)\
  \ ![](img/fig0-40aa.jpg) ![](img/fig0-40aaa.jpg) ![](img/fig0-40b.jpg)\n\n**图 0-40:\
  \ 文本划分程序的基于组件的分解**\n\n⁵⁵ 是的，我们*可以*将 `FormatUtil` 设为 `namespace` 而不是 `struct`，但我们刻意没有这样做。（参见图\
  \ 2-23，第 2.4.9 节）。\n\n⁵⁶ 注意，在 C++11 及更高版本中，我们可能考虑传递 `std::function` 而不是函数指针，或者将方法设为函数模板，以便使用\
  \ `lambdas`（函数字面量）。\n\n⁵⁷ 我们本可以直接从 `main` 程序中使用 `<iostream>`；相反，我们插入这个子程序，部分程度上是为了引入我们的编码标准。在我们方法论中——特别是在库级别——我们确保代码是`exception\
  \ safe`的，即它通过 RAII（资源获取即初始化）正确传播注入的异常，但通常是`exception agnostic`的，即我们不直接进行 `try`、`catch`\
  \ 或 `throw` 异常（参见第二卷第 6.1 节），而是倾向于返回错误状态。另请注意，为了信号函数的参数 (1) 是可修改的、(2) 其地址在函数调用后仍被保留，或\
  \ (3) 是可选的，我们会传递其地址；如果这些异常情况都不适用，则如果参数是基本类型、枚举类型或指针类型，我们按值传递参数，否则按 `const` 引用传递（参见第二卷第\
  \ 6.12 节）。\n\n⁵⁸ 本书第二卷第 6.8 节中提倡的基于库的解决方案所定制的一种（基于语言的）契约检查设施的初步版本，曾（临时性地）采纳到 C++20\
  \ 标准中，但一年后被撤回了。\n\n### 暴力递归划分\n\n在许多重要方面，对这一简单文本划分问题的暴力求解反映了经常困扰大规模软件开发的低效类型：浪费大量时间和将初始问题划分为子问题，然后反复将这些问题划分为子问题，直到达到可管理的大小。对于文本而言，“可管理的大小”意味着所有内容都能放入一行，而在软件中，我们的可管理单元是组件。\n\
  \n为了看到这种文本划分问题如何直接映射到应用程序的自顶向下分解，让我们详细检查计算的一个实例。图 0-41b 中的 `Context`（类似于软件环境本身）包含了执行递归计算所需的所有变参数（类似于编译器、调试器、第三方库等）。顶层程序\
  \ `FormatUtil::calculateOptimalPartition` 在程序栈上创建一个 `Context` 结构体实例（实现线程安全），然后调用递归子程序\
  \ `minCost1`。\n\n这种暴力文本划分算法的第一步递归（类似于将应用程序分解为子系统)^(59) 产生了 N – 1 对子程序调用。每对调用反会将初始问题划分为唯一的左右子问题（类似于可能的子系统设计）。每个子问题都通过递归进行解决，再次将子问题划分为所有可能的左右子子问题对（子子系统），以此类推，最坏深度为\
  \ N。在这个类比中，单词（或更准确地说，单词长度）对应于要划分（即设计）到物理行（即组件）的逻辑内容（即行为/功能）。\n\n**图 0-41: 暴力递归划分**\n\
  \n我们承认划分应用程序的任务性质上比我们的一维文本划分类比要困难得多。尽管如此，这个示例的具体性从定量上说明了本质上相同的观点。\n\n\n\n\n正如自顶向下的软件设计一样，递归在子区域小到足以容纳单行（或单个组件），或者当子区域仅包含单个单词（或组件的逻辑内容是原子的）时就会终止。只有在这一点上，才能评估成本（即开发叶子组件）并将其返回（即发布到生产环境）。\n\
  \n对于叶子情况，子划分（通过参数列表返回^(60)）是空的。对于所有其他情况，生成的子划分将由哪一对左右子区域产生最低的组合成本（最佳设计）决定。确定最优子区域对（实现一个子系统）的任务需要评估并比较每个子划分（子系统设计）的结果。最后，一个最优划分（集成的子系统）将连同其总成本返回给调用者（业务赞助者）。\n\
  \n^(60) 生成的划分在这里表示为一系列单词索引序列，这些索引被加载（即复制值）到可修改的 `std::vector<int>` 中，该向量的地址作为第一个参数传递给递归函数（见卷\
  \ II 第 6.12 节）。即使在现代 C++（即 C++11 及更高版本）中，在旨在分层可重用的软件基础设施中通过值传递返回分配动态内存的对象，在我们看来仍然是错误的——例如，因为它显式地阻止了跨调用的对象池（见卷\
  \ II 第 4.10 节）。\n\n图 0-42 展示了图 0-41 的暴力算法（类似于纯自顶向下设计），并应用于 *N* = 5 个单词，为了计算简单，我们在这里假设每个单词的长度等于行长度（*L*\
  \ = 1）。在递归的每一步中，长度为 *M* ≤ *N* 的子序列的 2 · (*M* – 1 个子划分都是局部唯一的。例如，[bcde] 分解为三个左右序列对\
  \ [b:cde], [bc:de] 和 [bcd:e]，这六个子序列——例如 [bc]——分别由不同的单词索引对 (*i*, *j*) 指示——例如 (1,\
  \ 2)。因此，每当递归遇到划分问题时，它都会重新解决，导致指数级的工作量——在这种情况下，是 3^(*N* – 1) 个子问题。^(61)\n\n^(61)\
  \ 这是在 `lineLength` = `wordLength` 的简化问题中，递归次数为 3^(*N* – 1) 的证明：\n\n```\n\\begin{array}{rcl}\
  \ {f(N)} & = & {\\underset{i = 1}{\\overset{N - 1}{\\Sigma}}f(i) + f(N - i)} \\\\\
  \ {f(N)} & = & {2\\underset{i = 1}{\\overset{N - 1}{\\Sigma}}f(i)} \\\\ {f(N)} &\
  \ = & {2\\left( \\underset{i = 1}{\\overset{N - 2}{\\Sigma}}f(i) + 2f(N - 1) \\\
  right)} \\\\ {f(N)} & = & {3f(N - 1)} \\\\ {f(n)} & = & 3^{N - 1} \\end{array}\n\
  ```\n\n然而，这种分析只统计了对 *f* 的调用次数，没有解决运行时成本。对于运行时，我们需要添加开销常量：\n\n```\nf(N) = \\left(\
  \ \\underset{i = 1}{\\overset{N - 2}{\\Sigma}}\\left( f(i) + 2f(N - 1) + C_{1} \\\
  right) \\right) + C_{2}\n```\n\n理论上，这个简单的算法是正确的，最终会产生最优解；然而，它的指数级运行时间使得对于任何实质规模\
  \ *N* 的问题都是不可行的。正如纯自顶向下的应用开发一样，这种幼稚的划分方法不可扩展的。\n\n![](img/fig0-42.jpg)\n\n**图 0-42：朴素划分的指数级工作（无重用）**\n\
  \n这里的关键观察是，我们所做的工作远超需要。如果真的存在指数级的不同且稳定的子问题，我们可能会合理地预期花费指数的时间来解决它们。然而，考虑一下，我们仅用一个整数对\
  \ (*i*, *j*) 就能表示每个唯一的子问题，其中 0 ≤ *i* ≤ *j* < *N*，这意味着唯一子问题的总数不是 *N* 的指数级，而仅仅是。\n\
  \n```\n\\textit{Number~of~unique~subproblems} = \\frac{N(N + 1)}{2}\n```\n\n正如自顶向下的应用设计一样，唯一划分的数量（如有用且分解良好的软件子系统）远少于它们的有效*使用*次数。如果我们只需*一次*解决每个子问题，我们就能在多项式时间内完成！\n\
  \n为了避免与自顶向下的设计相关的指数成本，我们需要找到一种避免重复解决同一个子问题的方法。假设我们每次计算子问题时，首先检查之前是否解决过它。如果是，我们就返回缓存的结果。如果不是，我们就计算结果并将其存储供以后使用。这种技术被称为动态规划，将许多问题的复杂度从指数级降低到多项式级。\n\
  \n\n\n\n## 图 0-44：采用动态规划的实际 C++ 代码\n\n在执行的早期，图 0-44 中的优化代码将继续解决它遇到的每个问题，这与我们最初的“暴力”实现非常相似。然而，随着计算的进行，有限数量的唯一子问题将越来越多地被解决并存储解决方案缓存（solution-cache）中。在图\
  \ 0-42 中开始的费力的深度优先“暴力”树遍历，迅速变为图 0-45 中高效得多的浅层遍历。\n\n![](img/fig0-45.jpg)\n\n## 图\
  \ 0-45：通过分层复用实现的多项式努力\n\n考虑一下开始新编程工作后的前几天是什么感觉。最初的项目最耗时，需要额外的精力来熟悉环境、自定义开发环境、设置配置、安装工具、重新创建快捷别名、重写实用脚本等。在完成几个项目后，后续项目会变得更容易，因为我们从之前的工作中获益。然而，如果没有主动的规划，这种巨大的收益不太可能持续下去。\n\
  \n之前讨论的说明性示例规模很小，这掩盖了在递归的每一层中不重复解决同一个问题的重要性。记住，在我们的示例中，对一个包含 *N* 个单词的文本划分进行暴力求解需要解决指数级的\
  \ `3^(N − 1)` 个子问题，而使用 `solution-cache` 时，仅需解决二次级的 `N ∙ (N + 1) / 2` 个唯一子问题。如图 0-46\
  \ 所示，我们完全不需要 *N* 变得很大——只需十个单词，我们能够实现的复用比例就会超过 99%！然而，让这种惊人的收益得以实现的因素不仅仅是简单的复用，而是完全的*分层级*复用。\n\
  \n![](img/fig0-46.jpg)\n\n## 图 0-46：细粒度分层复用收益的量化\n\n动态规划对于我们在软件开发中希望通过分层复用实现的目标是一个强大的比喻，而且从我们的类比中还可以获得更多启示。让我们现在考虑对文本划分解决方案的一些额外改进，并看看它们是如何反映在我们基于组件的软件开发过程中的。\n\
  \n首先，我们观察到用于在图 0-44 中实现 `Map` 的 `Solution struct` 记录了每个子范围最优划分的独立副本。范围越大，表示该划分所需的空间就越多。糟糕的是，较大子解决方案的划分中包含的信息与创建它的左、右子范围所使用的解决方案中存储的信息重复，导致\
  \ `solution-cache` 比所需的大了一整一个数量级。这种浪费的拷贝在软件开发中表现为：将现有的解决方案从一个应用程序或子系统“复制并粘贴”到另一个中——这是一种我们通常不鼓励的恶性复用形式。^(64)\n\
  \n^(64) 注意的是，有时，少量的冗余对于打破压抑的物理设计周期大有帮助（参见第 3.5.6 节）。\n\n这里之所以困难，是因为每个缓存的划分 `Solution`\
  \ 实际上*包含*（而不是*引用*或*依赖*，参见第 1.8 节）它的子子解决方案，导致 `Solution` 的表示的大小不均匀。如果这些子解决方案本身会发生变化，那么就像应用程序软件一样，我们就无法可靠地引用（依赖）它们。然而，一旦对应于子范围的\
  \ `Solution` 被计算（开发）并缓存（发布），它就永远不会改变（是稳定的），具有潜在的可复性（就地），因此可以被高层解决方案（组件）安全地引用（依赖）。正是这种分层复用，在图\
  \ 0-19 和第 0.4 节中已经从软件的角度进行了说明。\n\n为了在文本划分期间实现这种理想的非复制粘贴式分层复用，我们需要重构 `solution-cache`，允许新解决方案引用现有解决方案而不是从其拷贝。通过确保解决方案是\
  \ (1) *稳定的*，即一旦实例化就不会发生不兼容的更改（参见第 0.5 节），以及 (2) *随处可访问的*，即位于全局（公司级）存储的中央（参见第 0.9\
  \ 节），我们可以消除所有拷贝，并简单地就地引用现有解决方案，使得所有子解决方案（如组件）都具有（大致）统一的大小（第 0.7 节）。\n\n图 0-47 展示了针对\
  \ 1000 个单词的当前和建议的文本划分算法。不再让每个解决方案维护其子解决方案的独立副本（图 0-47a），而是将每个子解决方案（组件）实现为固定大小的 `struct`，保留对左右子解决方案的引用。\n\
  \n![](img/fig0-47.jpg)\n\n## 缓存内解决方案的分层渲染\n\n在这种设计中，`solution-cache` 中的每个固定大小条目将包含五个字段：\n\
  \n1. 对应于解决方案的单词索引子范围 *i, j*\n2. 解决方案解决方案的总成本\n3. 指向左解决方案的指针\n4. 该解决方案的初始（根）划分单词索引\
  \ *k*\n5. 指向右解决方案的指针\n\n给定一个解决方案的引用，对子解决方案进行深度优先遍历可以高效地（在线性时间内）重建完整的划分——即在原始文本中插入换行的整个单词索引序列。现在，不再包含整个解决方案（实现），`solution-cache`（分层可复用组件库）中的每个节点仅包含少量均匀的局部数据（“粘胶”逻辑）以及指向最优左右子解决方案的指针（`#include`\
  \ 对应的 `.h` 文件）。这不仅消除了泛滥拷贝的运行时（开发）成本，还消除了流程规模上多出一个数量级的冗余。^(65)\n\n比喻是可以被拉伸的。尽管如此，说明在我们的非线性文本划分问题中使用动态规划与在软件应用开发中利用细粒度分层复用之间的许多引人相似之处，为进一步的改进提供了合理的理由。\n\
  \n\n\n\n请记住，我们的目标是通过对现有解决方案的层次化复用来最大化生产力。因此，我们预计随着越来越多的子解决方案变得可用，我们会有越来越比例的时间花费在尝试定位解决方案上，而不是从头构建它们。如果寻找解决方案的成本不必要地高昂，它将不公平地限制整个层次化复用策略的有效性。因此，加速相关解决方案的检索将是我们对基于动态规划的文本划分程序进行最后优化的重点。\n\
  \n到目前为止，寻找解决方案（或确定其尚不存在）的成本一直是不必要地高昂。特别是，之前的两种基于动态规划的优化都使用 `std::map` 来将每个描述为 `(i,\
  \ j)` 对的子问题与其对应的最优 `Solution` 关联起来。正如图 0-48a 所示所示，`std::map` 实现了一个有序集合（通常为平衡树），保证了\
  \ `O[log (N)]` 的访问时间。然而，我们基于动态规划的优化并不要求解决方案以任何特定顺序维护：一个给定范围的解决方案要么存在，要么不存在。如果我们不使用\
  \ `std::map`，而是使用无序的（即基于哈表的）映射，例如图 0-48b 所示的数据结构，我们可以大幅减少预期的查找成本——即与常数成比例。然而，用于引用所有可能的解决方案的\
  \ `[i, j]` 表示法的紧凑性使我们能够做得更好。\n\n![](img/fig0-48a.jpg) ![](img/fig0-48b.jpg) ![](img/fig0-48c.jpg)\n\
  \n**图 0-48：实现对既有解决方案的紧凑且快速访问**\n\n⁶⁶ `std::unordered_map` 自 C++11 起成为 C++ 标准库 (STL)\
  \ 的组成部分。\n\n<a name=\"66\" href=\"#ch00.xhtml_ch00fn66</a>\n\n⁶⁷ 从 C++11 起，此类模板实例化中连续的右尖括号（`>`）字符之间的中间空格不再是必须。\n\
  \n通用哈希表必须处理冲突的可能性。假设我们不再满足于整数对 `(i, j)` 的传统哈希函数，而是发明一种完美哈希函数——一种能够*先验*保证永远不会发生冲突的函数。在我们的文本划分问题中，完美哈希很容易实现，因为我们提前知道所有的条目。如果我们将\
  \ `std::map` 替换为一个 `Solution` 类型元素的三角形数组——首先通过 `j` 索引，然后通过 `i` 索引，如图 0-48c 所示——我们就能保证在最坏情况下常数时间\
  \ `O[1]` 内找到每个解决方案（或未找到），而且还是极小的常数开销！此外，与另外两种（基于节点的）数据结构不同，三角形数组紧凑地表示了解决方案——即不需要大量的管理性存储。(68)\n\
  \n<a name=\"68\" href=\"#ch00.xhtml_ch00fn68</a> 为了具体起见，我们创建了最后一个完整的 C++ 实现（未显示），对应于图\
  \ 0-48c 的修改设计。此实现与之前的实现（对应于图 0-44）唯一的显著区别在于，新的 `Context` 使用了组织更佳、更快且更紧凑的解决方案缓存：(1)\
  \ `Solution` 现在有了一个“未设置”的概念（由负分区索引 `k` 表示），并默认以未设置状态构造；(2) `std::map<Range, Solution>`\
  \ 被替换为 `std::vector<std::vector<Solution>>`，该向量通过 `Context` 构造函数体中的一个 `for` 循环被配置为正确的三角形形状；(3)\
  \ 我们不再调用 `context.d_solutionCache.find(Range(a, b))` 并将返回的迭代器与 `context.d_solutionCache.end()`\
  \ 进行比较，而是保留一个指向 `context.d_solutionCache[j][i]` 返回的 `Solution` 元素的引用（`result`）——和以前一样——如果可用（即\
  \ `result.d_k >= 0`），则立即返回 `&result`。\n\n正如我们在文本划分类比中所做一样，在创建采用层次化复用的软件应用程序时，随着越来越多的组件变得可用，开发成本将越来越多地取决于软件工程师定位和利用相关组件的速度快慢。在这个最终实现中，不仅缓存的访问时间被降到了最低，表示的大小也被降到了最低。因为每个部分解决方案都可以用紧凑表示法唯一表示，因此没有空间开销（例如与基于节点的容器相关的开销），也不需要诉诸启发式方法（例如与哈希表相关的方法）。\n\
  \n周密的封装（参见 2.1 节–2.3 节）有助于紧凑的层次化命名策略（参见 2.4 节），在该策略中，组件可以通过全局唯一的、正交标识符进行查找——即首先通过*包*，然后通过*包*。坚持使用紧凑的表示法可以在查找既有解决方案方面获得相似的效率。(69)\n\
  \n<a name=\"69\" href=\"#ch00.xhtml_ch00fn69</a>^(69) 面向解决方案的文档（包含示例，参见第二卷第 6.1\
  \ 节）对于充分利用仓库也至关重要。拥有组织良好的结构是一个好的开始，但我们还需要有效的搜索能力。在仓库中提供替代索引（例如“菜谱”）会有帮助。最后，拥有丰富的基础设施开发人员在实践中为应用开发带来了巨大的回报。\n\
  \n图 0-49](#ch00.xhtml_ch00fig49 回顾了本节讨论的四种改进后的文本划分解决方案，并展示了实际 C++ 实现处理不同规模问题的运行时间对比。原始的自向下递归实现（图\
  \ 0-41）对于超过十个字的文本是无用的。通过可变解决方案缓存避免重复计算（图 0-44），我们使该算法在示例中的适用性扩展了十倍。\n\n通过将每个 `Solution`\
  \ 重构为统一的固定大小（图 0-47b）并引用其每个子解决方案，我们消除了与浪费拷贝相关的开销，并将空间使用减少了一个完整的数量级，从而能够容纳更大的问题。最后，我们将\
  \ `std::map` 的对数查找替换为三角形数组（图 0-48c）更高效且更紧凑的常数时间索引查找，允许用更短的时间解决大问题。(70,71)\n\n70\n\
  71 即使是最终的实现也绝不是最好的。对于对该文本格式问题的最优解决方案感兴趣的人，请参见 **cormen09** 第 15 章，问题 15-4，第 406–407\
  \ 页（此处为了方便重印）：\n\n```\n*15-4 Printing neatly*\n```\n\n\n\n\n考虑这样一个问题：在打印机上用等宽字体（所有字符宽度相同）整齐地打印段落。输入文本是\
  \ `n` 个单词的序列，长度以字符为 `l[1]`、`l[2]`、 . . . , `l[n]`。我们希望将这段话整齐地打印在若干行上，每行最多容纳 `M`\
  \ 个字符。我们对“整齐”的标准如下：如果某行包含从 `i` 到 `j` 的单词（其中 `i` ≤ `j`），且我们在单词之间恰好留一个空格，则行尾的额外空格字符数为\
  \ `M - j + i - Σ[k=i]^j l[k]`，该值必须是非负的，以便单词能够放进行内。我们希望除最后一行外，所有行末尾额外空格字符数量的立方和最小。给出一个动态规划算法，在打印机上整齐地打印\
  \ `n` 个单词的段落。分析你算法的运行时间和空间需求。\n\n请注意，是麻省理工学院（M.I.T.）的罗纳德·里维斯特（Ronald Rivest）教授（约\
  \ 1980 年）首次将文本分区作为一个家庭作业题介绍给我，从那以后我的职业生涯产生了深远而积极的影响。\n\n文本分区对于我们想要实现的软件目标是一个极佳的比喻；其许多相似之处如图[图\
  \ 0-50]所示。我们使用这个相对简单的非线性优化问题，定量地证明了细粒度层次化重用的重要性。无论我们讨论的是文本还是软件，都有无数种划分方式可以导致本质上相同的结果。与其在每次遇到子问题时盲目地重新解决每一个子问题，不如努力去查找解决方案，如果没找到，就确保该解决方案可以供后续直接使用，这样整体生产力的提升将是巨大的。确保细粒度的子解决方案实际上是有效的可重用的，这正是挑战所在。\n\
  \n![](img/fig0-50.jpg)\n\n**图 0-50：总结我们类比中的相似之处**\n\n当然，在库软件中实现重用还存在额外的挑战，我们的动态规划文本分区示例并未解决这些问题。构建可重用库软件的一个重要目标是最大化其被频繁重用的概率。划分文本与设计模块化软件的主要区别在于，在软件中，没有理由相信我们会在自顶向下分解的两个不同分支中必然产生相同的（甚至是类似的）原子解决方案，更不用说源于不同应用程序的分解结果了。软件设计的“魔力”在于，分解需要人类的智慧和经验，因此它不是精确的。尽管如此，我们仍然可以做很多工作来增加在软件仓库中实现“缓存命中”的概率。\n\
  \n也就是说，不存在一对整数 `(i, j)` 能够唯一地描述每一个潜在有用的软件组件。\n\n首先，我们必须使每一个递归子解决方案（组件）都具有精细的分级和粒度（参见[第\
  \ 0.4 节]）；对于一个由小组件组成的层次化子系统，其匹配充分的概率远比单个大型子系统要得多。我们还必须消除阻碍有效组合的任意自由度。例如，坚持最小协作（[第\
  \ 0.3 节]）、一致且统一的物理形式（[第 0.7 节]）、通组织（参见[第 2 章]）、单个进程内的物理互操作性（参见[第 3.9 节]）以及使用一组通用的基本词汇类型（参见卷\
  \ II，第 4.4 节），都有助于增加重用的概率。\n\n其次，可重用软件开发者的首要目标必须扩大每个解决方案的适用范围，以涵盖尽可能多的用途——特别是对于词汇类型（参见卷\
  \ II，第 4.4 节）。实现这一目标通常意味着提供少的功能（参见[第 3.2.7 节]）和少的策略（参见卷 II，第 5.9 节）。回想，文本分区应用（[图\
  \ 0-40b]）调整了核心库组件（[图 0-40a]）以适应中间的空格，而不是将该功能构建到库组件内部，使得同一个库组件在无需修改的情况下就能自然地适应等间距字体。此外，通过确保仓库中的组件解决方案是“散开”的以覆盖目标的设计空间，而不是相互重叠（参见卷\
  \ II，第 5.7 节），我们增加了为每个需求找到唯一解决方案的概率，这对于词汇类型再次尤为重要。\n\n最后，如果应用开发真的类似于我们的动态规划文本分区示例，那么将是计算机而不是人类来决定某个预先解决方案是否是可行的匹配，如果是，就直接使用——无需任何询问！当然，缓存是我们的软件仓库，而是人而不是计算机做出这种主观判断。因此，无法保证即使是完全应用的解决方案也会被重用。我们将在[第\
  \ 0.11 节]中进一步探讨这个问题。\n\n总结来说，在我们的类比中，将程序逻辑内容划分为组件的自顶向下软件分解的模糊复杂的全局成本函数，被将文本单词划分为行的精确函数所取代。此外，位于中心的层次化可重用组件库被全局的可变解决方案缓存所取代。与库中可重用的组件一样，缓存中的解决方案\
  \ (1) 具有固定、统一的大小，(2) 是稳定的，(3) 通过引用包含子解决方案（在原地）。此外，与软件开发一样，解决方案缓存越大，相关解决方案的策展（有效组织）以便快速定位就越重要。\n\
  \n当然，现实软件开发引入的约束导致了额外的复杂性。为了实现在本节中概述的巨大潜在收益，这两个陈述必须成立：\n\n1.  存在一个无环的、层次化的、基于组件的库软件表示，涵盖我们可能感兴趣的所有（参见第\
  \ 0.9 节）。\n2.  我们可以识别出一个可行的过程（参见第 0.10 节），随着时间的推移增长此类软件仓库，使其具有足够的（参见第 0.11 节），并确保在仓库的每个版本之间保持稳定（参见第\
  \ 0.5 节）。\n\n在接下来的章节，我们将关注这些关键陈述。\n\n# 0.9 软件资本\n\n人们说，没有足够的时间来做正确，但总是足够的时间重做。但*做正确*意味着什么？如果我们有足够的时间，我们能*做正确*吗？\n\
  \n在商业中，*做正确*意味着最大化公司的利润。\n\n\n\n\n在大多数行业中，产品上市时间直接影响利润。第一个提供新产品或实质性改进产品的往往往往获得并留住巨大的市场份额。产品越早上市，就越早能为公司的底线做出贡献。在某些行业中——特别是金融业——快速交付的压力尤为显著。\n\
  \n图 0-51 展示了某种新金融工具的投资回报率。最初，没有软件支持，因此没有收入。第一个能够提供这种金融产品的机构（在时间 `t`[1]）将获得`全部 all`\
  \ 业务，并能对该服务收取高额溢金；其收入流几乎是无限的！\n\n![](img/fig0-51.jpg)\n\n**图 0-51：金融工具的投资回报率**\n\
  \n随着时间的推移，当其他机构开始提供类似产品时（例如在时间 `t`[2]），业务将由几家提供者共享。为了从竞争对手手中吸引业务，他们降低溢金，直到近乎`完全竞争`^(73)将该工具带入稳态收益状况。\n\
  \n^(73) **tragakes11**\n\n成为新金融产品的首批提供者之一会大幅增加总利润；因此，金融软件专业人员因`快速`完成工作而获得的报酬往往比“正确地做”更多，这并不令人意外。\n\
  \n为了更好地理解这种思维方式，请考虑以下类比：\n\n*   我们人口中特定群体因流感导致的青少年死亡率被确定为全国平均水平五倍。\n*   创建了一份问卷，每位学生都将回答。\n\
  *   我们的目标是开发软件，将特定答案与患病个体相关起来，以识别高风险受对象。\n*   每延误一天都意味着年轻生命的损失。\n\n为了`正确地做`，我们应该花多少`额外`的时间？^(74)\n\
  \n^(74) 当然，存在一些完全不同且运作方式也不同的问题领域。例如心率监测器、航空电子设备（安全第一！）、航天器控制软件（做错了你的着陆器就会火星上坠毁）、不可闪存硬件的固件（做错了就会导致昂贵的召回）等，但我们在这里不是在讨论这些。\n\
  \n在商业中，让金白流失是一场悲剧。产品越早交付，投资回报就越高。为了最大化该回报，我们的首要目标必须是快速完成工作，但如何做到呢？\n\n我们可以投入更多的人，如图\
  \ 0-52 所示，但 Fred Brooks^(75)会拒绝。一项已发表的实证研究^(76)以及我们自己的经验表明，人员配置应该更像图 0-53 所示的那样。根本没有“银弹”^(73)——`no\
  \ silver bullet`——没有任何一种工具或技术可以显著提高软件开发。\n\n在商业中，让金白流失是一场悲剧。产品越早交付，投资回报就越高。为了最大化该回报，我们的首要目标必须是快速完成工作，但如何做到呢？\n\
  \n（注：提供的文本在后半部分包含几处破碎/损坏的句子。我已根据提供的指令在保持核心信息不变的基础上清理了格式。）*\n\n\n\n\n另一方面，高质量软件（根据我们的定义）是易于理解的。少*即*是多：一个更简单、更轻量且更容易解释的方案，通常比一个功能更多但明显沉重得多的方案*更有用*。设计出一个更紧凑、更易于理解的架构，通常需要大量的前期思考、时间和精力。在做某事*之前*准确地说明你打算做什么——无论是从用例还是参考文档的角度——这既不容易也不便宜，但从长远来看，它几乎总能带来更好、更易理解的设计，并降低总成本。在让软件易于理解上投入的精力越多，评审它所需的精力就越少。因此，对高质量软件进行同行评审的成本相对较低，且对评审者和被评审者都能获益。\n\
  \n为了从创建软件资本（Software Capital）中获得回报，我们必须愿意在两个时间维度（短期和长期）上考虑多元化的投入。创建软件资本不可避免地引入短期机会成本。就像上大学一样，对这种进攻性基础设施的初始投资需要密集的培训和基础的奠定，这种基础除了开发该软件资本的团队本身外，不会立即让任何人受益。\n\
  \n一段时间后，一个组织良好、集成且如晶晶般的结构开始显现。开发者意识到可用软件资本无比拟的效用，开始在没有强制的情况下使用它（参见章节 0.11）。一旦其他库和应用开发者将软件资本整合到自己的开发工作中，其他一些好事也会开始发生。这些构构良好、高度精炼的组件植根的最佳实践会被用户同化——通常是潜意识地。同行评审在自动培训开发者方面的收益——尽管难以衡量——其本身就是充分的理由，而且这仅仅是许多此类附加收益之一。\n\
  \n其他开发者观察到软件定期组织具有日益而易见的价值（参见第 2 章）以及支持性的元框架和工具（参见章节 2.16），他们也效仿并开始采用这种组织和构建自己软件的新方法。很快，企业大部分都在创建和使用细粒度组件，从而直接从这种扩展的、基于组件的软件开发方法中受益。\n\
  \n随着时间的推移，通用的底层集成基础设施允许独立构思的库通过共同词汇相互操作（参见第二卷，第 4.4 节），促进了跨产品线几乎无缝的集成。细粒度的逻辑拆分（章节\
  \ 0.4）自然地最小化了物理耦合（章节 0.6）。合理的物理设计策略（参见第 3 章）避免了循环的、过度或其他不当的物理依赖。由此产生的应用结构自动在质量上变得更易管理。由于所有底层部分都体现了图\
  \ 0-55 中描绘的软件资本的五个属性，客户端应用程序以可靠性、可移植性和性能提升的形式继承了这种卓越的质量（且对它们来说完全没有成本）。\n\n![](img/fig0-55.jpg)\n\
  \n**图 0-55：软件资本的内在属性**\n\n所有这些收益结合在一起构成了一个强有力的论点，但没有任何一个理由对软件资本的经济投资的证明像其章程那样有力，即专门为了缩短未来应用和产品的上市时间（图\
  \ 0-54）。正是仅仅通过履行这一承诺，我们才能公平地论证所需的可能和人才方面的前期投入。剩余收益——质量、稳定性、维护成本的降低、知识的捕捉等——仅仅是以*正确的方式*快速开展生意的良好后果。\n\
  \n为了实现这种细粒度企业级拆分努力的全部收益，我们必须确保从应用程序中拆分出的有用软件位于从逻辑和物理角度来看都合理的地方。我们认为，“这个组件应该做什么？”和“这个组件应该位于何处？”并不是独立的，且都应该在开发开始之前回答（参见章节\
  \ 3.1.4）。我们没有让现有的有用功能埋没在应用代码中（参见章节 3.2.2–3.2.4），而是仔细地将这些价值的软件拆分为离散的组件，然后深思地将它们与逻辑上相似或相关的组合在一起（参见章节\
  \ 3.3.6–3.3.8），这些组件也具有相同的物理依赖范围。仅仅通过将具有内聚逻辑和物理特征的组件放置在包和包组中，就能产生巨大的组织和认知收益（分别参见章节\
  \ 2.7 和 2.8）。\n\n将贯穿我们整个企业的库的有向无环图想象为一个按照郊区五金店/家居改进中心设计的巨大仓库。这栋空旷建筑包含了几乎各种种类和复杂性的预制材料和零件。像大多数硬件商店一样，螺母、螺栓、螺丝和钉子等相似零件被方便地放置在同一个或相邻的架子上，类似的材料如木材（例如松木、橡木）、玻璃、层板和石头也是如此。\n\
  \n仓库的架子排成长的平行列，并连续编号。然而，在这个仓库中，从简单到最复杂的部件都来自同一家制造商。更复杂的部件（如灯具、门和窗框）是由不复杂的部件构建的，它们也位于同一个仓库内。包含复杂部件的架子编号总是高于构建这些复杂部件的原始组件（参见章节\
  \ 1.10）。编号更高的架子留给更复杂、更实体的实体：洗衣机、浴室浴室台，甚至是大提琴。简而言之，逻辑行为和物理依赖共同决定了物品在仓库中的物理位置。\n\n\
  沿着同样的思路，我们可以将开发应用程序想象为定制家具。然而，我们的目标不是从零开始，而是*组装*所需的物体，从几乎多到溢出的预制零件和材料中进行选择，如图 0-56\
  \ 所示。然而，细致的组织（图 0-56a）使得寻找我们需要的内容几乎是瞬间完成的。自然，我们倾向于使用符合我们需求的预装组件，而不是自己组装原材料。*我们*仓库中的原始件在审美上趋于协调（例如颜色和纹理）并在最终产品中*良好*并非巧合（参见第二卷，第\
  \ 4.4 节）。我们努力的结果可能来自仓库的每一个角落（图 0-56b），但——一旦实例化（例如静态链接；参见章节 1.2）——组成部分以相似的相对顺序结合，保留了它们的*无环*物理依赖（图\
  \ 0-56c），正如当这些组件分布在整个仓库中时一样。\n\n\n\n\n\n![](img/fig0-56a.jpg) ![](img/fig0-56c.jpg)\n\
  \n**图 0-56: 维护一个预制组件的无环集合**\n\n在那些日益稀少的部件尚未可用的情况下，我们可以立即且可靠地确定其缺失。正如我们在文本分区的问题的优化解决方案中（第\
  \ 0.8 节）所示，我们随后必须现场创建该部件。如果时间允许，我们可以将缺失的项准备到足够精细的程度，只需由库开发者进行极少的抛光，就能将其放置在仓库中恰恰所在的位置，以便我们和其他人在未来的项目中轻松地找到并使用它。然而，像通常情况那样，如果对某些新项的需求是紧迫的，我们可能会临时制出一个仅供我们今天使用的临时解决方案，将该解决方案放置在应用程序的本地组件中（暂时），并安排（与库开发者一起）在时间允许时彻底地解决这个子任务。\n\
  \n为了使“软件资本”（Software Capital）成为一种可行的商业策略，重要的是必须理解：当前的业务需求绝不能被旨在满足它们的软件所劫质。即使在理想的情况下，通用但并不完美的软件*也会*进入应用程序。作为这种双模态但不断演进的开发过程的一部分（见第\
  \ 0.10 节），最初为单个应用程序创建的通用软件（例如，图 0-7a、第 0.2 节）将被降级^(81)（即重命名、重构并放置在物理层级中较低的位置），从而可以更广泛地共享（例如，图\
  \ 0-7b、第 0.2 节）。同样的降级过程也可以有收益地应用于不同层级的库代码。^(82)\n\n^(81) 降级只是`lakos96**` 第 5 章第\
  \ 203–325 页引入的原始九种层级化技术之一（特别是第 5.3 节、第 229–247 页中的降级），并在此处第 3.5 节中以更现代的语境进行了重新解释（特别是第\
  \ 3.5.3 节中的降级）。\n\n^(82) 然而，在降级库软件时，可能会存在需要解决的稳定性问题。与局应用程序应用程序软件不同，库软件的所有客户端可能无法同步更改；因此，可能需要对原始库组件实现采取一种合理的弃用策略。一种方案是允许旧新实现共存一段时间，直到所有客户端都有机会迁移。事实证明，这种重构方法由于我们的方法得到了促进，因为名义逻辑和物理名称内聚性（见第\
  \ 2.4 节）确保了聚合单元（见第 2.2 节）包含的所有逻辑和物理实体的名称都在该单元命名，因此不会与任何其他单元的逻辑或物理名称冲突。\n\n通过这种方式，通用功能随着时间的推移，最终将在跨越我们企业的库软件物理层级中找到合适的位置（见第\
  \ 2.1 节）。通过以这种集中方式组织我们的库，每个应用程序都能够从丰富的稳定库软件中汲取。\n\n最后，回想第 0.1 节，对于任何时间点的任何开发组织，都存在一个设计空间（此处由图\
  \ 0-57a 所示），其中进度、产品和预算可以进行权衡。我们声称的目标是将该进度/产品/预算设计空间远离原点，表面上为开发经理提供更多可权衡的因素（图 0-57b）。然而，通过使用软件资本，我们不仅同时提高了所有三个维度，还让设计空间本身远离了它的维度轴（图\
  \ 0-57c）。因为应用程序现在很大程度上可以高质量的预制组件组装，\n\n![](img/fig0-57.jpg)\n\n**图 0-57: 改进进度/产品/预算权衡**\n\
  \n### 0.1 增加投资\n\n我们如何创建软件资本？如果可复软件通常不是开发的副产品，那么我们必须建立一个核心团队。这样一个团队的重要性怎么都不强调。这个团队不能受限于任何项目。我们必须赋予这些开发者必要的资源和时间，以产生易于理解、易于使用、高性能且可靠的组件（见第\
  \ 2.4 节）。然而，团队的成功最终将通过客户和企业自身的长期成功来衡量。\n\n下一个问题是，“这个团队应该有多大？”也就是说，对于固定为 `N` 的员工，其中有多少比例的人应该专注于回馈可复用软件？考虑到有\
  \ `N=100` 名员工，很难想象 5 名核心开发者太多了，或者 50 名太少了。除此之外，几乎任何决策都是合理的。将 `m` 名开发者调往核心团队会将我们的即时生产力降低约\
  \ `m/N`。记住，我们拥有的软件资本越多，编写应用程序就越快、越好、越便宜。在我们的方法中，我们写的应用程序越多，积累的软件资本就越多。\n\n通过划分团队，我们希望将原本\
  \ `m` 名开发者的纯加法生产力转换为：\n\n```\nP(t) = (N - m) + m + lower-order terms\n```\n\n变为包含单调增加项\
  \ `L` 的乘法生产力：\n\n```\nP'(t) = (N - m) · (1 + L(m · t)) + lower-order terms\n```\n\
  \n图 0-58a 展示了与典型的应用程序开发团队相关的生产力特征。给定 `N` 名员工，初始生产力率大致与 `N` 成正，随着时间的推移而增加，直到所有权成本开始降低边际生产力。\n\
  \n如果我们相反分配 `m` 名员工作为共享资源（图 0-58b），其生产力率最初比例较低。^(84)\n\n\n\n\n\n# 引言\n\n只要开发者群体足够大，我们就可以将他们分为一个庞大的应用开发者池和一个较小的基础设施开发者池，并对他们进行适当的培养。\n\
  \n在稍后的某个时刻 `T`[1]，对应用开发者直接有用的“软件资本”（Software Capital）开始出现，并以大致正比于 `m` 的速度持续增长。然而，其余开发者的生产力开始超线性增长，因为越来越多的可复用解决方案可以在近乎常数的时间内变得可用。\n\
  \n在更晚的某个时刻 `T`[2]，异构团队的生产力率将超过一个原本完全相同的同构团队。这种卓越的生产力主要归功于现有细粒度解决方案的可用性，其次归功于良好良好（非重复）的公共基础设施降低了维护成本。\n\
  \n基于各种可实证观测的参数，托马斯·马歇（Thomas Marshall）开发的尚未发表的正式模型（参见第 2.16 节）有助于量化由于这种双向开发者划分而导致的整体生产力预期增长。\n\
  \n在 `T`[2] 不久之后，异构团队创造的产品总量就超过了同构团队的产量，而且从此再无回地地！\n\n## 流程\n\n那么，我们究竟是如何开始这个过程的呢？最初，我们没有任何软件资本。为了应对未来，核心团队建立了开发环境，并实现了一个由必要的（分层可复用的）基础组件组成的初始底座。应用开发者如既往一样，编写任何所需的软件来运行他们的应用程序。如图\
  \ 0-59 所示，为应用 1 实现的所有程序功能完全位于该应用程序自身的源代码仓库中。\n\n请注意，提议的工作流并不排除使用标准化、第三方和开源软件。\n\n\
  ![](img/fig0-59.jpg)\n\n**图 0-59：第一个应用程序没有得到任何帮助。**\n\n核心团队利用这第一个应用程序几乎作为一种“占卜棒”，识别出潜在有用的功能，然后团队对这些功能进行研究、泛化，并重新构建为一个基线可复用组件化框架，如图\
  \ 0-60 所示。这些基于真实世界*真实*（且现已记录）用例（参见卷 II，第 6.16 节）的新型、良好良好的、细粒度组件（第 0.4 节）将被重新引入到原始应用程序中。\n\
  \n![](img/fig0-60.jpg)\n\n**图 0-60：从第一个应用程序重新构建的软件资本**\n\n此新代码是否被整合到原始应用程序的后续版本中，完全取决于业务决策；图\
  \ 0-61 展示了使用新可用软件资本的应用 1 的修订版 v2。如果以及当应用程序修改时，它将表现出性能的提升、维护成本的降低，以及通过使用通用`vocabulary`\
  \ 类型（参见卷 II，第 4.4 节）与其他类似的重构软件之间固有的低层级互操作性。无论如何，新的库软件将立即供所有未来的应用程序使用。\n\n![](img/fig0-61.jpg)\n\
  \n**图 0-61：可选重构的第一个应用程序**\n\n图 0-62 显示了第二个应用程序，它现在对可用的软件资本进行了有限但非平凡的使用。核心团队再次从这个新应用程序中挖掘通用的功能，并在可复用框架的基础上进行构建。这个核心团队不仅仅是重命名并原样整合现有源代码，而是提取、重构并重新渲染基本功能，使其成为细粒度（分层）可复用组件的层次（第\
  \ 0.4 节），并将其分发到整个企业级的仓库中。\n\n![](img/fig0-62.jpg)\n\n**图 0-62：第二个应用程序得到了某种帮助。**\n\
  \n何时以及将新的软件资本折回应用 2 的修订版（如图 0-63 所示）是一个业务决策。无论如何，所有高标准的、分层可复用的功能已就绪并等待应用 3，如图 0-64\
  \ 所示。显而易见，开发软件资本是一项持续的工作。\n\n![](img/fig0-63.jpg)\n\n**图 0-63：可选重构的第二个应用程序**\n\n\
  ![](img/fig0-64.jpg)\n\n**图 0-64：第三个应用程序得到了便利。**\n\n即时业务需求始终是首要任务。因此，可复用软件的创建不能阻碍这些需求。事实上，应用开发者由于等待组件完成而冒延迟风险是愚蠢的。此外，软件资本开发的顺序除了受业务指导外，还受到物理定律的限制，涉及依赖性（参见第\
  \ 1.8 节）、可测试性（参见第 2.14 节）和整体正确性（参见卷 II，第 6.8 节以及卷 III）。为了在短期和长期内成功，这两种不同的开发工作必须允许共存并协同运行。\n\
  \n由于需要特定功能的应用程序组为自己的用途产生试点实现，然后将其交给核心团队进行后续改进，最终在未来的某个时刻整合到更通用的软件资本中，这并不罕见。然而，现有软件资本的层次结构加上它的有效使用，使得原型实现自然包含了大部分新功能，而不是重叠或重复的功能。\n\
  \n如果我们必须等几年才能证明这种方法的价值，那么它将没有太大实际意义。但通过此处讨论的构建，情况并非如此。因为功能单元被量化为细粒度组件，我们可以根据需要随时发布新资本（参见第\
  \ 2.15 节）。而且，由于这些超稳定组件的定义行为（几乎）不会发生不兼容的变化（参见卷 II，第 5.5 节），应用开发者通过增量采用此类部分解决方案不会面临不风险。\n\
  \n为了再次强调我们在整个企业有效开发的*递归自适应*方法的益处，假设我们已经在一段时间内积累了一个相当稳健的局部架构解决方案仓库。假设我们现在需要一个类似于现有方案\
  \ X 的新方案，但其实现需要对其一个深度嵌套子解决方案 `u` 进行不兼容的更改，如图 0-65a 所示。\n\n![](img/fig0-65.jpg)\n\
  \n**图 0-65：业务的增量成本**\n\n\n\n\n\n我们并不是在原地修改 `u` 或复制以 `x` 为根的整个子树，而是深思熟虑地重新创建组件 `u'`,\
  \ `v'`, `w'` 以及最终的 `x'` —— 每个准备好的版本都具有定义良好的额外*有用*行为（通常具有类似的相应物理依赖），如[图 0-65b] 所示。创建\
  \ `x'` 的增量成本显然只是最初创建 `x` 所需成本的一小部分，但如果我们复制整个 Solution X 子系统，则绝不会出现稳定性损失，也不会导致代码的泛滥重复。上市时间和持续维护成本都将大幅减少。简而言之，我们可以兼得所有！\n\
  \n这种“重新创建”听起来像是代码重复，但——恰恰相反——它是在隔离功能需要更改的少数细粒度组件；另请参见[第 3.5.6 节]。\n\n随着可复用功能积累过程持续，越来越多高利用率、良好集成的功能可以在应用程序从诞生之初就开始使用。正如[图\
  \ 0-66] 所示，开发者的生产力将变得越来越高，随着每一次成功，新项目的范围将逐渐扩大到超出任何合理认为使用经典方法可以实现的范围（[图 0-66a]）。这种新发现的雄心是由于软件资本（Software\
  \ Capital）合理投资带来的*易用性*和无与伦比的高性能（空间和速度）的结果。随着时间的推移，一个能够高效支持许多复杂应用程序的成熟基础设施将成为现实（[图\
  \ 0-66b]）。\n\n![](img/fig0-66a.jpg) ![](img/fig0-66b.jpg)\n\n**图 0-66：成熟的基础高效支持许多大型程序。**\n\
  \n应用程序开发者通常是领域专家，同时也了解如何组装软件以生产所需的产品。然而，如果没有专门的库开发团队，每个应用程序开发者都必须学习各种特定软件学科的细节，这将干扰他们开发有用产品的核心关注点。创建软件资本是为了建立应用程序开发者可以利用的专业内部软件知识。例如，一个高性能多线程队列系统可能需要一个库开发人员花费几个（甚至是许多）月的时间才能正确实现。然而，该开发者一旦发布软件，就可以作为专门的“内部”专家资源，为应用程序开发者和库开发者提供服务。\n\
  \n在一个规模较大的开发团队中，库社区和应用程序社区内个体的专业知识将有助于提高质量和生产力。此外，还需要文档、测试和工具方面的专家来担任其他库开发者的评审员、导师和顾问。至少对于大规模开发而言，仅需要通才型（即“文艺复兴式的”）程序员的时代已经过去！\n\
  \n现在让我们试着视觉化几年后我们这种分层可复用的软件资本库。[图 0-67] 显示了许多应用程序和产品的多个版本，这些版本导致了这种分层组织库的创建并现在依赖于它。由于它是作为产品构建的一部分演化的，导致我们当前开发环境的业务需求历史将很好地反映在我们所假设的软件库中。与划分许多复杂子解决方案相关的复杂且耗时的任务早已完成。\n\
  \n请注意，这个雄心勃勃的推测（事实上，甚至是这段文字的部分内容）追溯到 20 世纪 90 年代后期。我在 1998 年夏天在澳大利亚悉尼参加第一场关于软件资本的技术会议，我当时预想的巨大价值主张早已实现——例如，在\
  \ Bloomberg LP。\n\n![](img/fig0-67.jpg)\n\n**图 0-67：未来理想软件库的轮影**\n\n### 0.11 警惕的必要\n\
  \n可复用软件的目标是在任何“合适”的地方被*重用*，而由人类——而不是计算机来做出这种判断：\n\n我们推测，复用的障碍不在生产者端，而在消费者端。如果一个软件工程师（标准化组件的潜在消费者）认为寻找并验证一个符合其需求的组件比从头写一个更贵，那么就会写一个新的、重复的组件。注意我们在上面使用了*感知*（perceives）一词。重构的真实成本如何并不重要。\n\
  \n—Van Snyder (1995)\n\n[**brooks95**]，第 17 节，“关于复用如何？”章节，第 222–223 页\n\n可以确定，企业级软件资本库的“客户”是应用程序开发者。如果我们想要证明如此巨大投资是合理的，我们*必须*满足这群个人。从工程角度来看，交付更具体的质量衡量（例如正确性、性能、移植性）至关重要。但从心理角度来看，我们的可复用软件实际上被*重用*的程度也将取决于通常是主观的标准。\n\
  \n出于各种原因（真实的或想象的），人们往往不愿意使用他人开发的软件。尽管这种现象通常是有根据的，但这种统称为“非此发明”（not-invented-here）综合症，可能会公平地剥夺一个组织减少开发时间和成本的长期潜力。我们发现——特别是与能力极高（恰巧的是，非常有主见）的开发者合作时——仅靠立法无法保证复用。在实践中，复用的利益只有通过编写应用程序开发者真正*想要*使用的软件才能实现。\n\
  \n软件工程像任何其他工程实践一样，是一个成本权衡。对于任何给定的软件任务，我们应该能够对一个合适的解决方案定价，并确定我们愿意为一个“更好的”（尽管更昂贵的）解决方案支付多少溢价。从特定应用程序的角度来看，有时只需要一个合适的解决方案。例如，如果一个应用程序本质上是\
  \ I/O 密集型的，那么开发一个超高性能内存数据结构来进一步减少几乎忽略不计的 CPU 使用率，可能没有额外的业务价值。在这种情况下，该应用程序为“更好的”软件所愿意的溢价（或应该是）基本上为零。\n\
  \n然而，在设计软件资本时，没有所谓的“合适”。从潜在客户的角度来看，我们让软件越*易于理解*、*易于使用*、*性能越高*、*越可移植*且*越可靠*，它就可能越有价值。尽管构建软件资本需要大量的额外成本，但这些成本不会由任何单个应用程序承担。一个可以在多种应用程序中使用的*良好*解决方案，从整体上来说显然比根据需要独立创建的许多仅仅*合适*的解决方案更具成本效益。\n\
  \n\n\n\n\n那么，软件资本（Software Capital）到底需要达到什么程度才好？我们可以从其他行业寻求指导。例如，在建筑行业，目标是建造良好的房屋——即足以抵御*几乎*任何意外情况的房屋。任何声誉良好的建筑公司都不会承认自己建造过低于此标准的建筑。尽管如此，建筑是一门生意。显然，通过更高质量的配件，可以将房屋造得更坚固，并投入更多时间关注细节。从这个意义上说，建筑业与大多数行业一样，更接近于应用开发，而不是一个全公司范围内分层可重用的软件库。\n\
  \n请记住，软件资本的目标不仅仅是可重用性，而是真正的重用。^(91) 在使用一个不熟悉且可能次优（更不用说不达标）的组件与自己编写一个之间做出选择，许多软件开发者会自动选择后者。因此，即使只是对我们的软件资本可能存在疑虑的这种*感知*，也会严重缩小它的使用范围。^(92)\
  \ 此外，必须存在某种能够抵消我们“自己来写”这种本能的积极收益。也就是说，我们必须超越“好”；大多数成功的开发者（包括作者在内）认为他们自己也能写出优秀的软件。\n\
  \n^(91) 根据 Stroustrup 的说法，除非一个组件是可用的（即它能正常工作），并且有人“重用”过它，否则它就是不可用的（参见 **stroustrup00**，23.5.1\
  \ 节，第 714–715 页，特别是第 714 页）。\n\n^(92) Stroustrup 在《C++ 语言》的第三版（百年版）（2000 年）中，针对标准组件的采用提出了几个更重要的观察/建议（参见\
  \ **stroustrup00**，23.5.1 节，第 714–715 页）：\n\n*   “组件组”必须积极推广其组件。\n    * − 传统的文档是不够的。\n\
  \    * − 需要教程或其他机制，让潜在用户能够找到组件并理解其为何可能有所帮助。\n    * − 必须还开展与营销和教育相关的活动。\n*   “组件组”必须与应用开发者紧密且直接地合作。\n\
  \    * − “组件组”的开发者需要投入时间与应用开发者进行咨询。\n    * − 实习生计划（“训练营”）将允许信息流入（及流出）“组件组”。\n\n\
  回到我们的非线性文本分区类比（section 0.8），引入人为因素就像在从缓存中寻找每个解决方案时添加一个概率系数。由于各种审美上的原因，一个本上良好的软件可能会表现出远小于\
  \ 1 的系数，从而阻碍了其本该有效的采用。要避免主观的威慑因素（例如糟糕的渲染）以实现本该合理的重用，需要超出人们预之外的警惕性。简单来说，整洁至关重要！\n\
  \n同理，设计良好、实现的解决方案（例如 STL 中的容器）可以并且在实践中通常能够实现大幅超过 1 的重用系数！应用开发者知道，一个熟悉、可移植、可靠、高性能的解决方案是极具吸引力的，即使使用该解决方案需要付出非凡的努力来适应当前的需求。我们越能扩大每个解决方案和子解决方案的吸引力（参见第二卷，第\
  \ 5.7 节），满足绝大多数需求所需的解决方案数量就越少。\n\n显然，确保软件资本取得毫无保留的成功所需的质量水平，与传统的业务模式（例如建筑和制造业）并不相容，这主要是因为所做的额外工作是持续的，并且必须应用到每一个实例中。在这些行业中，在任何一个产品上投入不成比例的时间和材料所带来的价值（正如我们在某个特定应用上投入的那样）根本是不合理的。\n\
  \n对于软件资本来说，一个更好、更合适的类比应该是：美国印刷铸币局（Bureau of Printing and Engraving）为制造不同面值的美国钞而开发特种纸和版版投入的精力。美元的质量在设计上是不可复制的。美国政府没有在这些事情上节约，也没有隐藏其努力的程度。与软件资本一样，涉及到我们经济基础设施的圣洁时，失败根本不是一个选项。此类具有压倒性的措施的发布进一步阻碍了人们产生不当复制的想法（使重用成为唯一的理性选择）。当你考虑到图\
  \ 0-68 中所示的替代方案（与图 0-67 中描述的更理想的场景相比），这种坚定的、前投入似乎并不坏。\n\n![](img/fig0-68.jpg)\n\n\
  **图 0-68：组织的对面是混乱！**\n\n开发真正被重用的软件既不容易也不廉价。除了开发软件本身外，核心团队还必须积极组织和推广有利于重用的软件开发环境。核心团队将负责提供补充文档、培训、工具和咨询，以最大限度地降低入门槛并确保广泛的重用成为现实。好消息是，成功的软件资本相对较高的成本可以向“不信邪者”合理化，因为它自然地分摊在许多应用程序的许多版本中（参见图\
  \ 0-11）。\n\n[/content]\n\n[content]\n\n# 0.12 总结\n\n有效的大规模软件开发并非易事，它需要组织、规划、经验和技能。要在企业级范围内实现我们所追求的成功程度，需要对创建库和应用软件的最基本通用实践进行重大调整。本介绍性章节阐明了这些解决方案的高层目标、思维方式和设计权衡。这种经典方法与现代方法的结合形成了一种连贯的方法——我们认为这是已知长期交付高质量应用程序的最有效方法。\n\
  \n\n\n\n\n开发软件的业务目标是三维，涉及进度、产品和成本。当今工业软件开发面临许多痛点。这些症状包括开发的不可预测性、复用带来的危险、本应适中的程序却具有庞大的构建时间和可执行文件体积，以及人们在尝试对现有产品进行即使是微小的增强时所产生的极度恐惧。底线问题是，进度、产品和成本之间的权衡并不令人满意。\n\
  \n为了在这三个维度上都获得收益，我们需要移动设计空间本身。为了实现这一目标，开发过程的某些输出（即产出的软件部分）必须以某种方式*反馈*到该过程中。只有这样，开发过程的效率才能无限制增长。挑战在于找到一种能够通过实际软件复用接受这种反馈的组织和流程。我们的解决方案是一个解决软件本身组织以及创建软件的人员组织的流程。\n\
  \n起初不表现得过于具体，我们假设这样一种流程的存在以及它在使用多年后的理想状态。我们几乎可能需要的每个组件或子系统已经就绪并等待被复用（例如，参见图 0-67、第\
  \ 0.10 节）。到那时，这种“假设性”的开发过程已经演变成这种程度：实现一个应用程序意味着只需找到并组装所需的部件。我们声称这种流程不仅是可能的，而且长期来看是最优的。我们有时借用*长期*-*贪婪*^(93)\
  \ 来描述我们的方法。在进行大规模软件开发时，我们的经验告诉我们，长期贪婪是一门好生意。\n\n^(93) **lindskoog99**\n\n## 0.2\
  \ 应用软件 vs. 库软件\n\n我们观察到应用开发和库开发有本质区别，它们源于不同的目标和压力。应用开发本质上是自上而下的，而库软件的开发主要是自底向上的。在应用开发中，需要解决特定问题、快速完成工作，并在可能需要时以后更改代码。在库开发中，目标是正确地完成工作，更通用地解决问题，并避免随后的更改。参与开发这些类型软件的人通常具有不同的动机、不同的性格和不同的技能组合。\n\
  \n应用开发者因尽可能快速、高效地完成当前工作而获得奖励。因此，很容易理解为什么应用源代码的稳定性低于库代码。考虑到应用开发的主要重点是快速解决特定问题，这类软件通常随着时间的推移而演变。在每次迭代中，源代码甚至功能都会发生变化。最好的应用代码被设计成易于改变的。\n\
  \n另一方面，良好的库作者有完全不同的心态。因为库开发者通常离收入流较远，他们可以从其应用对手极少享有的某些自由受益。库软件倾向于具有很长的寿命——根据定义，这跨越了所有依赖它的应用程序的寿命。在编写库组件时，胜任的库开发者不会选择一种简单的实现，导致接口难以使用或以给客户带来不便。相反，良好的库开发者总是会用实现的简易性来换取使用的便利性。\n\
  \n## 0.3 协作软件 vs. 可复用软件\n\n大型软件问题通常被拆分成子问题，如果这些子问题被独立解决然后重新组合，就能精确解决原始提出的问题。然而，这种最小程度的分解往往导致脆弱的软件，其特征是紧密依赖的接口边界之间存在过度的不规则性（“裂盘”），留下的更改空间极小。对单体应用级功能的简单修改（“烤面包机牙刷”）可能要求我们重新审视这些接口下方的实现，增加成本并使可靠性面临风险（参见图\
  \ 0-9、第 0.3 节）。协作接口往往具有较大的*表面积*-*体积*比例，使得独立理解——更说复用——单个子系统的行为比所需的更困难。这种紧密的语义耦合迫使一个模块的变化反映在另一个模块中，通过将设计决策分布在模块边界上来模糊模块化。如果我们沿着更自然的边界划分我们的系统，就能划分出更规则的软件片段。这些更简单、更熟悉的子系统不仅更容易解释和理解，而且在高级需求不可避免地变化时，更有可能“按原样”复用。\n\
  \n*经典复用*涉及对特定类型、容器、子系统等的复用，而不考虑实现它的任何部分。一个裂盘或一个 `ToasterToothbrush` 并不特别可复用。构造一个带钩的\
  \ `Toaster` 和一个带孔的 `Toothbrush` 是一个轻松的协作示例，其特征是对伙伴部件的感知。我们创建易于描述的可复用部件（例如 `Semicircle`、`Rectangle`、`Square`、`Triangle`）的能力增加了此类部件可以且将在不修改的情况下使用的机会。尽管如此，这种级别的复用是不够的。\n\
  \n## 0.4 分层可复用软件\n\n为了实现最大复用，我们必须坚持在逻辑和物理层面都进行最大程度的分解。一个 `ToasterToothbrush` 可以被分解为一个\
  \ `Toaster`、一个 `Toothbrush` 以及用于将 `Toothbrush` 固定在 `Toaster` 上的 `Adapter`。添加一点胶水就能让我们得到所需的部件（参见图\
  \ 0-12、第 0.3 节）。然而，这种第一级分解仅实现了经典复用。为了实现*分层复用*，我们必须主动将 `Toaster`、`Adapter` 和 `Toothbrush`\
  \ 分解为各自的各个（`Case` 和 `Chassis`、`Arm` 和 `Joint`、以及 `Handle` 和 `Bristles`）。只有这样，我们才能实现通过\
  \ `Toaster`、`Adapter`、`Handle`、`Bristles` 和胶水创建 `ToasterScrubbrush` 的收益（参见图 0-20b、第\
  \ 0.4 节）。\n\n## 0.5 灵活 vs. 稳定的软件\n\n良好的软件要么灵活（行为易改变），要么稳定（行为不变）。小型物理模块的分层组合（我们称为*组件*）是稳定性的关键方面。持续实现这种小模块需要激进的分解。例如，如果我们创建一个具有六个参数的函数，很有可能遗漏了一个。为了以后添加参数，我们将被迫修改现有函数，这可能违反了*开闭原则*（第\
  \ 0.5 节），或者从头创建一个全新的函数（重复了不必要的大体）。如果我们相反创建了六个仅带一个参数的函数并将它们组合，我们随后就可以轻松地添加第七个，而不影响其他六个函数的客户端。\n\
  \n\n\n\n\n我们必须承认，只有稳定的软件才是可重用的。稳定性对于确保高层所做的假设随后不会失效至关重要。与其以不兼容的方式改变可重用组件的行为，有时创建一个类似的组件并让它与原始组件并行运行（无论是暂时的还是永久的）会更好。另一方面，可变软件（理想设计为具有`malleable`，即可塑性）最适合位于最高层，并且必须`不能`被共享，否则问题就会变得过度约束（例如，`FlattenedGreenToasterToothbrushWithFlag`；参见图\
  \ 0-31，节 0.5）。注意，既不不稳定又不可可塑的软件通常是不受欢迎的。\n\n# 0.6 物理设计的关键作用\n\n细粒度分解的需求不仅是为了于稳定性和可测试性。为了实现`分层重用`，我们必须确保将每个解决方案都封装在独立的物理模块中。回想一下，迪克斯（Dijkstra）主张细粒度的层次化分解；帕纳斯（Parnas）主张将单个设计决策封装在良好的接口之后，这些接口仅通过简单的（例如标量）数据类型进行通信；迈尔斯（Myers）则主张确保这些接口有良好的文档以帮助人类理解。只有将我们的功能内容限制在微小的（细分的、粒度化的且文档良好的）物理模块中，我们才能够仅为我们需要的部分在链接时间和磁盘空间上支付代价。此外，只有通过这种激进的分解，我们才能够在每一个抽象层级上发挥重用的用处——而不仅仅是那些广为宣传供公众消费的组件。\n\
  \n设计有两种截然不同但高度相互关联类型：`逻辑设计`和`物理设计`。逻辑设计解决我们开发的软件的功能方面问题。物理设计解决我们如何将源代码封装到文件和库中（例如，参见图\
  \ 0-15，节 0.4）。在考虑任何相当大量的软件时，物理设计起着至关重要的作用。特别是，糟糕的物理设计会迅速导致软件物理模块之间出现循环，而循环依赖的模块在大规模上几乎是不可维护的。与你可能认为的相反，物理设计是逻辑设计的先决条件，从初始问题分解为可以接受独立解决方案的子问题开始（这些解决方案随后组合起来解决初始问题并可能解决其他问题），就必须考虑它。在大型开发工作中，良好的物理设计的重要性无论如何强调都不过。\n\
  \n# 0.7 物理均匀软件：组件\n\n在我们的方法中，良好的物理设计基于将逻辑内容组织成连贯的物理模块，称为`组件`，这些模块在结构上是统一的且相对较小。此外，我们希望这些模块既是`finely\
  \ graduated`（细分的）又是`granular`（粒度化的）。通过`finely graduated`（细分的），我们的意思是抽象层级之间的（垂直）“距离”保持得很小。通过`granular`（粒度化的），我们的意思是领域功能的（横向）“面积”保持得很小。这种细粒度的物理分解降低了特定模块因需求变化而需要更改的可能性。此外，细粒度模块化通过现有部件的重新组合提供了一种高效的添加手段（与从零开始创建整个子功能相比）。最后，当软件被良好分解并封装在组件内部时，彻底的测试将变得容易。\n\
  \n正如我们定义的，组件是我们的`逻辑`和`物理`设计的基本原子单元。在 C++ 中，一个组件由一个头文件（`.h`）和一个实现文件（`.cpp`）组成，并且应该始终有一个关联的测试驱动程序文件（`.t.cpp`）。我们要求组件是相对较小的，包含适于管理的`逻辑`内容，这些内容可以从单个单独的测试驱动程序文件进行彻底测试。组件具有定义良好的`接口`，并且理想情况下具有设计良好的（例如，易于理解和使用）接口。最后，设计良好的`组件的设计目标是是`testable`（可测试的）。\n\
  \n在许多方面，组件就像房屋的砖块，相似之处多于不同之处。尽管在微观上，每块砖块在`逻辑`上都是独特的，但所有砖块都具有相同的宏观`物理`形式。从远处看，区分一块砖和另一块砖的唯一特征是它们在物理层次结构中的相对位置。较高层的砖块可以做更多，不是因为它们更大或包含了其他砖块，而是因为它们`依赖于`它们可能委托任务的其他砖块。因此，物理层级较高的砖块就像公司的经理，比它们下方的个人贡献者具有更大的范围。\n\
  \n多样性可能是生活的调味剂，但在渲染软件时它没有用武。提供规则的物理形式来捕捉我们的逻辑内容是关重要的。要求逻辑内容的物理封装具有统一性极大地简化了人类认知，有助于有效开发和支持工具的创建，提高了专有子系统的互操作性，并增强了整个企业的`开发者流动性`。\n\
  \n## 0.8 量化分层重用：一个类比\n\n作为一个复杂的类比，我们将软件应用开发比作一个涉及在固定宽度页面上格式化文本单词的优化问题。递归求解文本每个左/右划分的暴力方法（类比软件中的纯自顶向下设计）将以指数级时间运行。然而，我们观察到，尽管看起来如此，要解决的独特（即有用的）子问题数量`并不是`指数级巨大的。同样地，我们声称软件中不同的部分子解决方案的数量是、或者应该是相当小的（相对而言的）。\n\
  \n我们随后观察到了优化问题的几个其他改进，这些改进与我们的软件开发方法具有相似之处。第一个改进说明了解决方案稳定性的重要性，以便它们被直接使用而不是复制（复制-粘贴重用）。第二个改进强调了查找速度的重要性。正如在成熟的软件环境中一样，应用开发的大部分工作将是寻找合适的预制解决方案。\n\
  \n为了使这个类比成立，我们观察到，在应用分解的不同部分遇到的软件子问题需要足够相似，以便允许“即插即用”的重用。实现这一目标至少需要细粒度分解、统一的物理渲染和规范的接口。此外，用于重用的软件除了其他更客观的质量指标外，还必须具有“吸引力”（例如，具有清晰的文档、美学上漂亮），否则开发者将选择不使用它。最后，重用设计的目标应当是用一组离散、独特的组件来覆盖目标领域，而不是一个组件与另一个仅有细微差异的连续体——特别是对于词汇类型*（参见卷二第\
  \ 4.4 节）。最大化重用概率将在卷二第 5.7 节介绍。\n\n# 0.9 软件资本\n\n\n\n\n从企业的角度来看，我们希望尽可能将应用代码推向稳定的库中，以便它们可以被归因、精炼、变得更加健壮，并供未来的应用程序独立地复用。虽然并不总是能从一开始就拥有可重用的软件，但我们的目标是确保潜在可重用的软件能够定期进行重构并`下沉`（参见第\
  \ 3.5.3 节）到物理分层中的较低级别，从而以便更广泛地共享。这种对软件开发的持续重构方法被许多人认为是顶尖的。鉴于我们的目标是复用，我们有必要变得更加`以库为中心`（library-centric），并观察这种重点将我们引向何方。\n\
  \n通过将通用知识隔离在易于的软件存储库中，我们使得当前、未来甚至过去的项目能够利用我们的知识库，以比以往快得的速度交付新功能。这个私有软件存储库将成为企业的资本资产，随着时间的推移产生越来越多的红利。一组设计良好的、能够促进一个或多个应用领域或产品线开发的私有软件集合，就是我们所说的`软件资本`（Software\
  \ Capital）。积极创建软件资本的主要动力是缩短未来应用和产品的上市时间（参见图 0-54、第 0.9 节）。在提高质量的同时降低开发和维护成本，是一个受欢迎的附加收益。\n\
  \n# 0.10 增加投资\n\n增加我们软件资本资产的隐含目标是获得一个本质上所有相关子解决方案的可行的、精细的、细粒度的划分。重要的是，我们要一致地拆解应用程序，以获得完全相同的子解决方案，并随着时间的推移，实现运行比以往更快、更可靠的软件。软件资本的特征是具有相关的、预制的组件，这些组件易于理解、易于使用、高性能、可移植且可靠（参见图\
  \ 0-55、第 0.9 节）。例行的同行评审加上彻底的测试，是我们一致实现这些质量维度的方法。只有极少数私有软件属于这种企业级的基础设施，但这极小部分取代了本会大得多的离散、重复且不兼容的解决方案，而这些解决方案通常性能较低、可靠性差，且维护成本高得离谱。\n\
  \n事实证明，软件资本可以同时大幅改进进度/产品/预算设计空间的所有三个维度。此外，由于继承了大量的“更快/更好/更便宜”的内容，从软件资本组装的应用在三个维度上将获得非凡的收益，无论这些各自维度的权重如何分配。\n\
  \n前几个应用程序从这些早期工作挖掘出的软件资本中获得的益处较少。资本的额外开发将通过观察反复的业务需求来引导。随着时间的推移，越来越多的开发工作将集中在应用级功能上。我们注意到，在一个设计良好且成熟的软件开发企业中，几乎所有开发的代码对于所实现的应用程序都是唯一的，只有对扩展我们称为软件资本的这一重要企业级资产进行相对较少的的持续再投资。\n\
  \n# 0.11 警惕的必要性\n\n开发者对别处开发的软件产生怀疑通常是合理的。为了使复用有效，被复用的软件必须让所有人知道其具有“不合理”的高质量。如果一个不满的开发者对我们企业级软件资本存储库最糟糕的评价是它“太好了”且“不值得花精力写”，但——由于它已经在那里了——会（当然）使用它，那么我们就知道我们实现了成功复用所需质量水平的一个重要方面。\n\
  \n然而，如果没有行的软件资本，为了替换缺失的可重用软件而重复创建的重复代码爆炸可能会主导甚至压倒整个开发工作（例如，参见图 0-68、第 0.11 节）。考虑到开发库软件的成本分摊到使用它的许多应用程序版本上（参见图\
  \ 0-69、第 0.11 节），我们可以理解生产它的感知成本通常也显著高得多。但事实证明，`不`生产软件资本的实际成本要高得多，而且这还没有考虑到它的主要收益，即缩短未来应用和产品的上市时间（参见图\
  \ 0-54、第 0.9 节）。\n\n在本章中，我们介绍了一些底层工程和经济现实，这些现实促使我们开发并使用目前在企业规模上快速且经济效益地开发高质量软件的最有效方法。书的其余部分只是详细描述如何获得成功。在这三书中介绍的所有设计、实现和测试技术都适用于大型系统。我们还看到，一致使用我们提倡的所有实践，即使在规模适中的系统中也能产生巨大的收益（例如，可靠性、可维护性和性能）。\n\
  \n简而言之，这本书关于如何在生产环境中日益更成功地开发应用程序。在接下来的章节中，我们将介绍成熟且证明有效的`C++`软件开发规范，并理解其适用性不仅限于任何特定的`C++`版本，甚至于`C++`本身。所有编程语言——特别是那些组合独立编译的语言——都能从应用这些基本的工程原理中受益。\n\
  \n## 1. 编译器、链接器和组件\n\n- 1.1 知识就是力量：细节决定一切\n- 1.2 编译和链接 C++\n- 1.3 声明、定义与链接\n- 1.4\
  \ 头文件\n- 1.5 包含指令与头文件卫士\n- 1.6 从 .h / .cpp 对到组件\n- 1.7 符号与术语\n- 1.8 依赖关系\n- 1.9\
  \ 隐式依赖\n- 1.10 级编号\n- 1.11 提取实际依赖\n- 1.12 总结\n\n\n\n本书介绍关于大规模软件开发，特别是关于我们的基于组件的软件工程方法论如何利用组件（按我们的定义）的内在属性来产生优化的软件解决方案。最重要的是，组件是一个物理概念（见第\
  \ 0.6 节）。无论我们为给定问题的解决方案带来什么样的逻辑设计，我们*必须*将该逻辑设计实现为 C++ 源代码，并存储在一个或多个文件中。这些文件将通过 C++\
  \ 编译器和链接器转换成可执行代码。从这个角度来看，所有 C++ 设计的实现形式都是物理设计，无论设计者是否考虑了这一因素。因此，我们的设计方法必然涉及物理设计和逻辑设计，以及它们之间固有的张力与偶然的协同效应。\n\
  \n为了充分理解并从我们的设计方法中受益，必须熟悉与物理设计相关的几个背景主题，我们将在本章对这些主题进行回顾。特别是，我们关注软件的物理方面，最后以对几个重要的基础物理属性的刻画结束。我们将详细解释在创建和构建\
  \ C++ 程序涉及的过程和工具（例如：预处理器、编译器、链接器）。这些知识反过来将增强我们做出明智物理设计决策的能力，影响客观可衡量的特征，如编译时间、链接时间、运行时间和程序大小。在此过程中，我们将介绍在书中及日常工作中常用的术语和极简符号（见第\
  \ 1.7 节）。\n\n一旦我们彻底掌握了行业中的本质工具，我们将开始从“无结构化”开发过渡到基于组件的开发。利用 C++ 语言的基础，我们将学习如何理解、欣赏并向熟悉的\
  \ `.h`/`.cpp`^(1) 对中注入重要的属性，这些属性将为我们高性能、可靠且极具扩展性的解决方案赋予组件生命。尽管在某种意义上，可以用几句话来解释我们所说的“组件”，但任何此类定义无论多么正确，其用处都是有限的。在最终语文中提供组件的正式定义和阐述（见第\
  \ 2.6 节）之前，我们将花费本章剩余章节来理解这些最基础物理设计单元的许多影响。当我们到达第 2 章的正式内容时，我们已经有了理解它们所需的背景知识.^(2)\n\
  \n^(1) C++ 源文件在 Windows 平台上默认具有 `.cpp` 后缀。我们最初因为这个原因采用 `.cpp`，并且因为许多开发组织维护大量的 C\
  \ 语言源代码，这些代码传统以 `.c` 后缀结尾。\n\n^(2) 虽然在本章早期就进入了大量的底层细节，但本章后半部分简洁回顾的许多高层背景材料，在**lakos96**的早期章节（特别是第\
  \ 3 章和第 4 章）中有更详尽的解释。\n\n### 1.1 知识就是力量：魔鬼在细节中\n\n本章要涵盖的内容非常多；尽管如此，从熟悉且不令人畏惧的内容开始可能是一个好主意。因此，我们将遵循\
  \ C 语言的传统，从一个已经成为长期传统的介绍性示例开始。\n\n### 1.1.1 “Hello World!”\n\nC++ 与其之前的 C、Ada、Fortran\
  \ 和 Cobol（以及此以来的 Java）属于一类语言，即单独“编译”的离散软件模块以某种方式“链接”在一起形成一个可运行的程序。即使是最简单的 C++ 程序也是以这样创建和组装的。考虑图\
  \ 1-1 所示所示熟悉的“Hello World!”程序.^(3)\n\n^(3) 虽然它在所有垂直平台上一直都能工作（早期的 GCC 是个例外），但直到 C++11，标准才规定在包含（仅）`<iostream>`\
  \ 时必须声明 `std::endl`（而不再必须也包含 `<ostream>`）。然而，目前的共识通常建议使用 `'\\n'` 代替 `std::cout`\
  \ 以避免在可能多余的情况下强制刷新缓冲区。\n\n![](img/fig1-1.jpg)\n\n**图 1-1：C++ 语言熟悉的“Hello World!”程序**\n\
  \n尽管人们可能倾向于将此称为单文件程序，但它实际上由您在图 1-1 中看到的微小应用部分和一个相当巨大的（可重用）库部分组成，后者是 C++ 标准库中的 `iostream`\
  \ 设施.^(4)\n\n^(4) 为了更好地量化地理解应用（即用户的 `main.cpp`）与 C++ 标准库提供的可重用库软件（更不用说操作系统的）之间的相对贡献，让我们看看典型平台（如我的新电脑）上编译的各种产物。在运行\
  \ GCC 5.4 的 2016 年笔记本电脑上，源代码 `main.cpp` 的大小仅为 166 字节。当包含 `#include` 指令时，中间文本 `main.i`\
  \ 扩展到了 443 KB！然而，生成的 `main.o` 只有 2.5 KB，这在今天标准下是很小的。然而，生成的执行文件要大得多。链接执行文件有两种：静态和动态。静态链接意味着将所有信息整合到单个执行文件中；动态链接意味着有大量代码可以跨进程共享。对于在\
  \ Toshiba 笔记本上构建的此示例，动态链接执行文件约为 64 KB，而全包含的静态链接执行文件镜像约为 10 MB！这里提供了这些数据的总结，以及另一个类似平台（运行\
  \ GCC 6.2.1 的 MacBook Pro）的数据（另见图 1-4、第 1.2.1 节）：\n\n| 产物 | Toshiba 笔记本 | MacBook\
  \ Pro |\n| :--- | :--- | :--- |\n| `main.cpp` | 126 字节 | 126 字节 |\n| `main.i` |\
  \ 443,892 字节 | 641,974 字节 |\n| `main.o` | 2,715 字节 | 2,704 字节 |\n| `a.out` (共享)\
  \ | 64,958 字节 | 9,084 字节 |\n| `a.out` (静态) | 10,124,051 字节 | 2,065,128 字节 |\n\n\
  尽管我们可能对特定供应商的标准库实现没有太大控制权，但对现代编程环境中软件是如何构建的彻底理解，对于我们在开发大规模软件时所创建的应用和库将证明是无价之宝。这种理解也将帮助我们预先评估依赖特定开源和第三方库的可行性。\n\
  \n本书展示了许多在我们工业环境中创建 C++ 库和应用程序的丰富经验中演变出来的技术和指南.^(5) 我们坚信，要成功架构——乃至开发大型 C/C++ 系统，需要对语言的底层细节有深入的理解。\n\
  \n\n\n\n# 我们的核心库已经开源了一段时间；请参阅 bde14。\n\n### 1.1.2 创建 C++ 程序\n\n在创建成功应用程序的旅途中，第一站是理解语言本身的细节。现在让我们考虑一个简单的\
  \ `main` 函数，它调用了定义在单独文件中*自由*（非成员）函数 `op`：\n\n![](img/unfig1-1a.jpg)\n\n要在 `main()`\
  \ 中使用 `op()`，必须在 `main.cpp` 中可见 `op()` 的声明。在上面的插图中，我们通过直接（本地地）在 `main.cpp` 中编写声明来提供了该声明，但正如我们即将看到的，这种做法是有问题的。当我们最初考虑\
  \ `main.cpp` 时，`op()` 的返回类型是 `int`，但从那时已演变为 `double`，如上方的 `op.cpp` 所示。我们不会在编译时捕获这种不一致性，而且\
  \ C++ 标准也无法保证此类错误会在链接时被检测。因此，当我们下次重新构建并运行 `main` 时，可能会遇到一个不快的惊喜。\n\n如果函数*签名*（而非仅仅是返回类型）发生了变化，得益于*C++\
  \ 链接*，我们会在链接时捕获到问题：\n\n- 函数签名指的是其名称以及参数类型序列（但不包括其返回类型）。\n- 注意，C++ 的“类型安全”链接确保了链接器可以访问所有函数（包括运算符）的名称、参数类型以及（对于类成员）cv\
  \ 修饰符。这种访问通常通过在对象代码层面将这些属性编码到（编译后的）函数名称中来实现。\n\n例如，声明为如下形式的函数：\n\n点击此处查看代码图像\n\n\
  ```\ndouble myFunction(const char *string, int length);\n```\n\n在对象代码层面，它可能会获得类似\
  \ `_Z10myFunctionPKci` 的名称（这与 `C` 不同，无法保证在不同的编译器之间具有可移植性）。\n\nC++ 中的函数不能仅根据返回类型进行重载。因此，函数（暂忽略函数模板）不需要将其返回类型传播给链接器，尽管某些平台可能会为了提高*实现质量*（QoI）而这样做——例如，作为协助开发者在链接时而非运行时查找\
  \ bug 的手段。\n\n![](img/unfig1-1b.jpg)\n\n然而，具有 C 链接的函数甚至会隐藏这种不一致性，直到运行时。\n\n在 C++\
  \ 中，还有其他不一致性几乎肯定在运行时之前无法被检测到。例如，考虑全局变量 `q` 的局部声明：\n\n![](img/unfig1-1c.jpg)\n\n\
  注意变量 `q` 的类型在 `main.cpp` 中被声明为 `int`，但在 `q.cpp` 中被定义为 `double`。`main.cpp` 的编译器永远看不到\
  \ `q` 的定义（位于 `q.cpp` 中），而等到链接器介入时，对象 `q` 的实际类型（即 `double`）通常已经不再可用。\n\n### 1.1.3\
  \ 头文件的作用\n\n作为专业的软件开发人员，我们努力在开发过程早期捕获错误，特别是当其他团队成员将使用我们的软件时。与其依赖客户端猜测我们函数的签名或全局变量的类型，作为库开发者，我们的责任是为他们提供一个包含相应函数或变量声明的头文件。通过包含此头文件，我们的客户可以在编译时捕获许多常见的用法错误，这显然比在链接时或更糟糕的在运行时捕获要好：\n\
  \n![](img/unfig1-1d.jpg)\n\n注意上面的 `op.cpp` 文件（错误地）没有引用对应的 `.h` 文件。鉴于客户端始终会通过我们头文件中的声明访问外部定义的实体（参见第\
  \ 1.11.1 节），我们作为 `op.cpp` 的作者，必须确保头文件中的声明与其相应的定义一致。在创建一个完全独立于实现文件的头文件后，我们再次留下了两个文件不同步的可能性：\n\
  \n![](img/unfig1-1e.jpg)\n\n如果将头文件包含在实现文件中，那么问题（在这一特定情况下）在 `op.cpp` 编译时就会被检测到，远早于代码提供给任何客户端。我们稍后将看到，严格遵守我们的设计原则如何防止这种以及其他类似问题（例如，由于单独编译而可能产生的签名不匹配，而非仅仅是返回类型），并最终形成了我们*组件*的概念（参见第\
  \ 1.6 节 和 1.11 节）。\n\n## 1.2 编译和链接 C++\n\n构建 C++ 程序的过程自然分为两个阶段。第一阶段称为*编译阶段*，包含了\
  \ (1) 对每个源文件（`.cpp`）以及其包含的头文件（`.h`）进行预处理以生成中间表示，以及 (2) 将该表示翻译为可重定位机器码，然后将其放入对象文件（`.o`）中。第二个（主）阶段将组合这些对象文件形成一个凝聚的程序。编译阶段包含了\
  \ C++ 标准定义的九个中间阶段。\n\n### 1.2.1 构建过程：使用编译器和链接器\n\n大多数编译器都提供了开关，允许直接观察中间阶段的结果。例如，可以指示编译器产生预处理阶段的结果（`.i`\
  \ 文件），这对于诊断包含文件和宏展开的问题很有用。编译器对对象代码的初始渲染可以进行优化，以生成经过大幅性重写的对象代码，其执行速度通常比未进行此类优化的情况要快得多。编译器通常也可以被指示产生与对象文件对应的汇编代码列表（`.s`\
  \ 文件）。例如：\n\n```\ngcc -S filename.cpp\n```\n\n产生一个包含汇编代码的文件。\n\n```\ngcc -E filename.cpp\n\
  ```\n\n在标准输出上显示应用预处理器后的结果。注意，虽然预处理后的翻译单元的源代码中增加了很多内容，但相比之下，翻译后的汇编代码增加得并不，特别是在启用编译器优化的情况下。\n\
  \n这种极低层面的检查可以用于验证怀疑的编译器和优化器 bug，也可以详细理解使用高级语言构造所导致的机器级开销。\n\n图 1-2 展示了预处理器如何顺序独立扫描不同的\
  \ `.cpp` 文件（`x1.cpp`、`x2.cpp`、`x3.cpp`、`x4.cpp`），并在此基础上根据 `#include` 预处理器指令整合每个包含的\
  \ `.h` 文件的文本。每个包含的 `.h` 文件同样会被扫描，头文件中嵌套的 `#include` 指令会被递归处理。概念上，生成的文本形成了一个称为*翻译单元*的中间源级模块，在图\
  \ 1-2 中用带有 `.i` 后缀的文件表示（注意，这个 `.i` 文件是假设的，除非特别请求，否则可能不会产生）。该中间表示随后被输入 C++ 编译器，编译器编译翻译单元并产生一个包含结果对象代码的相应\
  \ `.o` 文件。\n\n\n\n\n\n目标文件的 `.o` 后缀在 POSIX 族操作系统中很常见，这些 Linux、Solaris、macOS 等，我们从此以后将统称为\
  \ *Unix 平台*。在 Windows 平台上，通常使用 `.obj` 后缀。\n\n![](img/fig1-2.jpg)\n\n**图 1-2：编译阶段（预处理和翻译阶段）**\n\
  \n在构建过程的第二阶段，即所谓的*链接阶段*（link phase），将单独编译的 `.o` 文件（其中某些文件可能被封装成库）输入到链接器，以创建一个可执行程序。图\
  \ 1-3 展示了在图 1-2 中生成的每个目标文件 `x1.o`、`x2.o`、`x3.o` 和 `x4.o` 以及两个额外的库（`y.a` 和 `z.a`）是如何链接成一个可执行程序的。\n\
  \n![](img/fig1-3.jpg)\n\n**图 1-3：链接阶段**\n\n可执行程序映像——简称*可文件*——是从 `.o` 文件中的函数实现实现的。每个可执行文件由（通常是只读的）可执行代码（例如在\
  \ `text` 段中）和常量（即：不可变的）数据（例如在 `rodata` 段中）组成，这两者都可以被放在只读内存中；它还为 `static` 存储生存期的可变数据（例如全局变量）提供了空间，且除非显式初始化，否则（默认情况下）将是*零初始化*（zero\
  \ initialized），然后通常会被单独隔离存储（例如在 `bss` 段中），在那里可以更高效地清零。用于存放函数、常量和全局变量的内存持续整个程序的运行执行期间。为了确保任何对函数或全局变量的引用都能正确指向其（唯一的）定义，该实体必须在可执行映像中分配一个唯一的（可重定位的）地址。分配这些地址是链接器的责任，链接器从单独的目标文件构建可执行文件，因为编译器不具备进行此类分配所需的全局上下文。另一方面，所有其他存储生存期的对象的地址是在程序执行过程中确定的，不需要链接器参与。\n\
  \n文件名 `a.out` 是 Unix 平台上的默认值，尽管典型的可执行文件名称没有后缀。在 Windows 平台上，可执行文件默认具有 `.exe` 后缀。\n\
  \n精确的术语取决于平台（我们承认我们偏向于 Unix）。例如，有时可执行文件的这部分被称为 `.text` *节*（section）。\n\n一个对象被*零初始化*的意思取决于该对象的类型*种类*：对于基本数值类型，意味着该对象接收了转换为该类型的数值零；对于指针类型，意味着它接收了与字面量\
  \ `0` 对应的指针值（从 C++11 开始，即为 `nullptr` 的值）。请注意，由于它是数值类型，零初始化枚举的行为（包括一个没有转换为整数值零的命名枚举成员的枚举）是有定义的，并且反映了\
  \ C 语言的行为。\n\n`bss` 代表 *Basic Service Set, Block Started by Symbol*（基本服务集，由符号启动的块），甚至可以认为是\
  \ *Better Save Space*（为了节省空间，正如有些人喜欢这样记忆它），因为 `bss` 段（与 `data` 段不同）不是可执行映像的一部分，因此——除了数值大小的指示外——它不会在\
  \ `.o` 文件中占用（比例的）空间。\n\n一个经过*零初始化*的基本、指针或枚举对象的内存“占用空间”通常——但由于 C++ 标准赋予了编译器实现者自由裁量权——并不一定由全零（`0`）位组成的位模式组成。例如，在一个典型的（4\
  \ 字节）`int` 中，内存中的位模式将为 `0000...0000`，这通常——例如在*补码*中——对应于整数值零。对于一个典型的（8 字节）`double`，位模式将是\
  \ `0000...0000`，这通常——例如在 IEEE754/IEC559 标准中——对应于浮点值零。在指针类型对象的情况下，位模式通常但不一定是 `0000...0000`。\n\
  \n在整个编译阶段，编译器处理单个翻译单元。头文件的使用提供了一种让编译器了解可能跨翻译单元共享的实体存在的方法。传递给链接器的每个目标文件通常包含 (1) 符号的定义（例如函数、全局变量）和\
  \ (2) 对翻译单元内未定义的其他符号的引用。链接器尝试通过使用其他目标文件提供的定义来解析每个目标文件中的此类未定义引用。这些定义反过来可能依赖于其他目标文件中定义的符号，依此类推。如果最终引用的符号在目标文件集的任何地方都没有被定义，链接器将报告错误。\n\
  \n在链接阶段。众为人知的入口 `main` 是我们程序的 C++ 运行时接口，必须定义它才能创建可执行文件。如果只提供 `main.o`，链接器将报告符号 `f()`\
  \ 未解析。第 1.4 节讨论了头文件的有效使用，第 1.5 节讨论了 `#include` 保护的适当使用。\n\n```\n$ g++ -I. main.cpp\n\
  /tmp/cctbI9g6.o:main.cpp:(.text+0xe): undefined reference to 'f()'\n/tmp/cctbI9g6.o:main.cpp:(.text+0xe):\
  \ relocation truncated to fit:\n                          R_X86_64_PC32 against\
  \ undefined symbol 'f()'\ncollect2: error: ld returned 1 exit status\n$\n```\n\n\
  如果提供了 `main.o` 和 `f.o`，链接器将报告符号 `g()` 未定义。\n\n\n\n\n\n^(19) 注意，Unix 平台上的 `nm` 命令（在\
  \ Windows 平台上为 `dumpbin`）可以用于列出 `.o` 文件中所有未定义的符号和外部可访问定义：\n\n点击此处查看代码图片\n\n```\n\
  $ g++ -I. -c f.cpp\n\n$ nm f.o\n\n0000000000000000 b .bss\n\n0000000000000000 d\
  \ .data\n\n0000000000000000 p .pdata\n\n0000000000000000 r .rdata$zzz\n\n0000000000000000\
  \ t .text\n\n0000000000000000 r .xdata\n\n0000000000000000 T _Z1fv      // 'T' means:\
  \ definition provided\n\n                 U _Z1gv      // 'U' means: undefined\n\
  \n$\n```\n\n符号修饰（name mangling）这一额外挑战最初是为了适应 C++ 的函数重载而引入的，通过使用 `c++filt` 等程序可以轻松解决：\n\
  \n点击此处查看代码图片\n\n```\n$ g++ -I. -c f.cpp\n\n$ nm f.o | c++filt\n\n0000000000000000\
  \ b .bss\n\n0000000000000000 d .data\n\n0000000000000000 p .pdata\n\n0000000000000000\
  \ r .rdata$zzz\n\n0000000000000000 t .text\n\n0000000000000000 r .xdata\n\n0000000000000000\
  \ T f()        // 'T' means: definition provided\n\n                 U g()     \
  \   // 'U' means: undefined\n\n$\n```\n\n点击此处查看代码图片\n\n```\n$ g++ -I. main.cpp f.cpp\n\
  \n/tmp/ccq6leho.o:f.cpp:(.text+0x9): undefined reference to 'g()'\n\n/tmp/ccq6leho.o:f.cpp:(.text+0x9):\
  \ relocation truncated to fit:\n                          R_X86_64_PC32 against\
  \ undefined symbol 'g()'\n\ncollect2: error: ld returned 1 exit status\n$\n```\n\
  \n只有当提供了所有的 `main.o`、`f.o` 和 `g.o` 时，链接阶段才能成功，例如：\n\n```\n$ g++ -I. main.cpp f.cpp\
  \ g.cpp\n\n$\n```\n\n这条最终的构建命令静执行成功。\n\n## 1.2.2 对象文件 (`.o`) 文件的经典原子性\n\n对象文件在历史上是原子性的。也就是说，如果一个对象文件被合并到可执行文件中，它将整体被合并。`.o`\
  \ 文件中定义的所有外部可访问符号现在都可以用于解析其他 `.o` 文件中的未定义符号。同样，该 `.o` 文件中的任何未解析符号（无论是否被使用）最终都必须被解析，否则链接阶段将失败。\n\
  \n为了适应 C++ 语言初始版本中一些与 C 相比更高级的语言结构（例如隐式模板实例化和未内联的 inline 函数），所有现代平台现在都支持在单个 `.o`\
  \ 文件中包含多个段（section），使得每个单独的 `section` 都可以独立于 `.o` 的其他部分进行合并（或不合并），稍详细讨论。外部符号定义位于\
  \ `.o` 文件不同部分的程度以及在何种程度上取决于平台和构建配置，这显然不是我们在开发过程中应该考虑的因素（参见第 2.15 节）。为了确保对物理依赖进行可移植的细粒度控制，我们继续设计得正好像\
  \ `.o` 文件以及`组件`（第 0.7 节）是原子的。\n\n现在考虑图 1-5 中稍作修改的程序。在这个例子，`f.cpp` 定义了 `f1()` 和 `f2()`，但只有\
  \ `f2()` 使用了 `g()`。尽管 `main()` 链接只需要 `f1()` 的定义，合并 `f.o` 也会导致对符号 `g()` 的未解析引用，这需要\
  \ `g.o` 以及 `g.o` 所依赖的任何其他 `.o` 文件被无缘地合并到我们的程序中。通过将 `f1()` 和 `f2()` 的定义放在不同的编译单元中（此处显示），可以消除不必要的耦合以及随之而来的对\
  \ `g.o` 的链接依赖。\n\n![](img/fig1-5.jpg)\n\n**图 1-5：共同放置导致的额外链接时依赖**\n\n当我们错误地在源文件中放置逻辑实体时，就损害了物理设计的质量。除了对象文件之间过度的依赖外，两个或多个对象文件之间也可能相互依赖，正如图\
