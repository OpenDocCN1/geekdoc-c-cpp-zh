  class B { /*...*/ };\n\nclass D : public B { /*...*/ };\n```\n\n### 1.7.3 “在接口中使用”（Uses-In-The-Interface）逻辑关系\n\
  \n![](img/unfig1-8.jpg) 意味着“`B` 在其接口中使用 `A`”，并隐含了 `B` 对 `A` 的物理依赖（参见第 1.9 节）。我们有时会为了说得比较“粗略”，比如“`B`\
