  \ 节）。\n\n# 360\n\n此设计提取自真实的 BDE 开源库分发版 (bde14`)由 Bloomberg LP BDE 团队的 Steven Breitstein\
  \ 和 Clay Wilson 于 2019 年 3 月渲染。\n\n![](img/fig3-178.jpg)\n\n**图 3-178：创建 `bdlt::CalendarCache`\
  \ 所需的所有分层重用**\n\n## 3.12.12 节总结\n\n在本卷新内容的最后一个节中，我们详细介绍了创建一个大型的、分层可重用的日期/日历子系统的真实示例，该子系统适用于广泛的领域，例如金融行业。我们最初的“规范”远未完成，因此我们首先着手合成真正的需求是什么，并将这些有效需求与可能随之而来的任何拙劣设计隔离开来。然后，我们为预期的面向客户端的组件勾勒了一个细粒度的（物理）分层结构（以及它们的大部分逻辑相互关系），这满足了客户所有声明的（合法）需求，以及我们可能合理推断或预料的额外紧急需求。我们还努力跳出最初的项目需求，查看哪些组件可能是合理需要并添加的，但明智地选择不在初始工作阶段追求它们的实现，因为仅仅为即时所需的内容创建一个适当实现，工作量也已经绰绰有余了。\n\
  \n一旦我们确信所有基本的面向客户端的组件已代表，我们将注意力转向考虑需要什么种缺失的分层可重用实现基础设施、哪些已经是可用的，以及最关键的——哪些还没有！然后我们继续充实并扩展我们的设计，包含一个完整的、分解良好的、高性能的“仅实现”子组件层级结构，这些组件的设计目标是最大化其自身的未来重用潜力（参见第二卷第\
  \ 5.7 节），而不考虑它们在我们不断增长的软件资本库（第 0.9 节）为术语，有助于我们避免许多常见的开发工作中的组织问题。\n\n语义内聚性和物理依赖在确定优化物理位置时都将发挥重要作用。这种优化性不是偶然发生的，通过设计实现的也极少。因此，每个库开发者必须不仅对他们实现的令人兴奋的新功能负责，还要对这些功能如何成功整合到构成软件资本库（第\
  \ 0.9 节）的包和包组负责。包前缀和相应的（协调）命名空间的广泛使用不断提醒我们，最终，库功能的绝对位置不能被忽视。\n\n我们的物理设计规则（第 2.6\
  \ 节）施加了限制逻辑设计的约束。我们根据这些规则渲染软件的策略源于实质性的、持久的架构和语义属性，而不是表面的语法属性。其中最重要的规则之一是，禁止跨物理边界存在任何形式的循环物理依赖。循环物理设计必须始终重新处理以产生无环的物理依赖图。否则将很快导致混乱和疯狂。\n\
  \n\n\n\n\n需要私有访问的逻辑内容如何进行聚合，也受到“禁止长距离友谊”这一设计原则的强烈影响。特别是，封装的低层设计决策范围被严格限制在单个组件内。鉴于组件的大小受限于我们对其测试的能力，单个组件能包含的逻辑内容存在相当的硬性限制（见卷\
  \ III，第 7.5 节）。多组件封装器通常是不可行的。我们的方法论禁止在无限数量的类之间共享私有实现细节：此类设计必须重构，使其更具模块化——无论在逻辑上还是物理上都是如此。\n\
  \n## 3.2 避免糟糕的物理模块化\n\n俗话说，通往地狱的道路是由善意铺就的。然而，由于某种原因，未能对我们的组件应用适当的模块化标准，很容易导致糟糕的次优设计，使得这些设计在理解、使用和维护上变得异常困难。因此，我们务必要采用实质性且有意义的模块化标准，例如语义和物理依赖，而不是浅层的标准（例如基于语言语法的标准）。\n\
  \n例如，在早期，我们有时会天真地使用 `t` 后缀（例如 `bdet`）来表示一个完全由值语义类型的包，并使用 `tu` 后缀（例如 `bdetu`）来表示一个完全由*实用*组件组成的包（即包含非原始功能，这些功能通过作为\
  \ `struct` 的 `static` 方法实现，并作用于在 `bdet` 包中对应同名组件里定义的值类型）。事实证明这是一个坏主意，因为它：(1) 让客户端难以发现有用的功能；(2)\
  \ 阻止了 `bdet` 中的其他值语义类型依赖于 `bdetu` 中的非原始功能（以免我们违反包的分级化）。\n\n鉴于 C++ 不仅仅是一门面向对象的语言，而是一门*多范式*语言，因此人为地限制进入特定包的组件的逻辑构造类型通常是没有意义的。相反，我们应该使用最合适的逻辑构造，在每个包的每个组件中高效地呈现连贯的语义内容，并根据其他更具实质性的逻辑和物理标准进行共同定位。\n\
  \n每个组件的目的都应该有一个狭窄的焦点。在该焦点范围内，组件应该*足以*满足大多数客户端对其预期用途的需求。根据*开闭原则*（节 0.5）设计得当，一个真正*完整*的组件允许几乎任意的扩展（即通过额外的非原始功能），而无需修改组件本身的源代码。\n\
  \n避免大多数客户端并不严格需要的过度功能，也是细粒度可重用组件的一个重要方面。为了确保组件易于理解，我们通常希望它们是*最小的*。也就是说，组件内提供的函数理想情况下应该是独特用途的，而不是提供完成相同任务的多种等效方式。\n\
  \n为了确保稳定性和可扩展性，我们希望在定义可实例化类型的组件内部实现的功能是原始的。我们所说的*原始*的，是指如果无法对所作用的类型（实现（内部表示）进行私有访问，就无法高效实现的功能。那些可以在组件之外（即通过其他原始函数）高效实现的功能，不被认为是原始的。将组件重构为仅包含*原始*功能，可以减少杂乱并提高稳定性。提供一组完整（但最小）的原始函数，可以使额外的函数能够高效地编写，而不会像违反*开原则原则*那样扰动组件。除了自由运算符和类运算符的*特性*函数（如\
  \ `swap`）之外，几乎所有非原始功能都应该提升到单独组件中的“实用”`struct`——有时在单独的包（UOR。因此，编写可重用组件时，我们努力创建一个同时完整、最小且原始的接口。\n\
  \n模块化是良好设计的关键方面。糟糕的物理模块化有许多形式。在架构层面，糟糕的模块化反映了全局、长期策略的缺失。由于缺乏一个由自主核心团队（节 0.10）精心策划和维护的中央存储库，应用程序开发者将很难避免将高度可重用的功能嵌入自己的应用程序源代码中。这种架构模块化的*缺失*不可避免地导致构思不当（不稳定）的应用程序间依赖、泛滥的复制粘贴以及重复的重复。\n\
  \n即使在单个 UOR 内部，也有许多糟糕的物理拆分形式。将所有枚举放在一个包中，而将所有类放在另一个包中，是物理模块化糟糕的极端例子。另一个例子——几乎同样糟糕——是将轻量级可重用类（例如\
  \ `Stapler`）与重量得多的对象（例如 `Table`）放在同一个物理模块（即组件）中。因此，将物理依赖作为逻辑拆分的标准，以实现良好的物理模块化和有效的重用，是健全模块化设计的基石。\n\
  \n当需要新的、适当的功能且无法通过现有的原始功能实现时，与其编写一个新的仅解决这一个特定需求的成员函数，不如努力实现实现该新功能所需的*精髓*，以便在无需修改底层对象的源代码的情况下，在未来能够以这种方式添加更多新的、类似的功能。通过一致地设计（并完善）充分、完整且最小的接口，并将任何非本质功能提升到我们细粒度物理层次结构中的更高层次，我们最大限度地减少了复杂性，增强了稳定性，并通常促进了有效的重用。\n\
  \n## 3.3 将逻辑上归为类的东西进行物理分组\n\n默认情况下，我们对细粒度拆分的渴望会鼓励我们将每个公共访问的类或 `struct` 放在自己独立的组件中。然而，有时有必要将多个这样的顶层逻辑实体放在同一个物理模块中。有四种情况指示了共同定位（见图\
  \ 3-20、节 3.3.1）：(1) 需要友元；(2) 会产生循环依赖；(3) “伙伴”实体（每个都很小）共同构成一个有用的整体；或 (4) 一个小型类（例如\
  \ `ScopedGuard`）或函数（例如 `operator==`），它们 (a) 没有增加额外的依赖，(b) 依赖于同一组件中的重量级类（例如记录器），并且\
  \ (c) 是该组件常用的核心部分。这四种公共类共同定位的标准在图 3-179 中有更详细的阐述。\n\n![](img/fig3-179.jpg)\n\n**图\
  \ 3-179：公有类共同定位的详细理由**\n\n³⁶¹ 从 C++11 开始，我们现在支持可变模板和可变宏。\n\n\n\n\n\n在其他条件相同的情况下，将可能一起变化的代码放置在一起，往往有助于简化软件的维护、增强和发布过程。这一古老的模块化基本公理从单个类和函数，一直延伸到组件和包，最后到包组和发布单元。在组件层级，我们有时会创建高度协作的类，这些类的设计并不打算供在单个组件之外使用。此类类可以完全在\
  \ `.cpp` 文件中实现，可以作为公共类的私有嵌套成员（通常不建议这样做），或者利用“额外下划线”约定（节 2.7.3）——该约定将在程序上可见的类标记为组件局部的（节\
  \ 2.7.1），且不适合外部使用。\n\n在包层级将协作的组件放在一起也同样重要。例如，对于需要模板特化的大型泛型实体，通常最好将每个特化版本实现在单独的 `.h/.cpp`\
  \ 中。虽然这些特化版本可以直接使用，但其中任何一个都不能构成完整的解决方案。此外，如果通用模板发生了变化，这些特化版本的每一个都必须同步变化。因此，让所有特化版本与通用模板位于同一个组件中（或者，至少在同一个包中）是合适的，并在需要时使用双下划线约定（[节\
  \ 2.7.3]）来显式表示它们定义组件关系中的从属性质（[节 2.7.5]）。\n\n某些库软件本质上是易变的的（节 0.5），例如一个枚举缓慢增长的命名实体的系统（例如天数计数约定）。每当创建一个新实体时，枚举必须扩展，并且感知所有这些实体的管理工具也必须同步更改。将枚举放置在与顶层工具不同的\
  \ UOR（单元组织）中，意味着每当添加新实体时，这两个 UOR 必须同步发布。任何中间涉及的 UOR 也必须同时发布；因此，该问题的严重性是无界的。另一个组件间紧密协作的常见例子是为特定编码单独封装编码器和解码器类。如果编码策略发生任何变化，两个组件自然都会受到影响。请注意，解码器通常允许依赖编码器，完全是为了（例如，“模糊”）测试目的（见第三卷第\
  \ 8.6 节）。\n\n## 3.4 避免循环链接依赖\n\n在任何聚合层级上避免物理模块之间的循环依赖，是我们方法论的核心设计要求。每当组件依赖图中存在强连通节点集时，我们就说这些组件存在循环依赖。\n\
  \n这种禁止的依赖可能源于位于参与组件 `.h` 或 `.cpp` 文件中的 `#include` 指令；无论哪种，生成的物理依赖图都是相同的。\n\n在大范围内支持循环依赖的子系统可能是一个噩梦，且有效的模块测试往往是不可能的。循环依赖影响开发过程，因为越来越代码库必须作为一个单一实体进行增强、测试和部署。在链接线上重复静态库变得变得繁重，延长并破坏了构建周期。对物理设计质量的客观衡量——例如在节\
  \ 3.7.4 中讨论的累积组件依赖 (CCD)——表明低层循环的破坏性最大。相比之下，层次化的物理设计（没有循环依赖）相对容易理解、测试和增量复用。\n\n\
  即使在物理上是合理的，描述清晰的（例如在 UML 中）高层逻辑设计在实现时也可能无意中导致循环物理依赖。如果一个 `Company` 拥有一个 `Account`，而\
  \ `Account` 反持有一个 `Position` 类型的对象，该对象引用 `Security`，而后者指向底层的 `Company`，那么幼稚的实现可能会导致循环。即使高层设计是无环的，随着设计的细化、实现或随时间的维护和增强，循环也会出现。因此，一个能够在提交时（理想情况下在整个开发过程中）检测并拒绝物理设计循环的开发系统，在此方面是无价的。\n\
  \n## 3.5 分层化技术\n\n经典的分层化技术（见图 3-42、节 3.5.1）在节 3.5 中进行了详细讨论，可用于打破物理设计循环并减少过度的物理依赖。令人惊讶的是，自从它们在`lakos96`中首次发布以来，并没有发现任何深刻的新分层化技术，但某些技术的相对重要性发生了变化，这主要是由于异步编程日益凸显。特别是，*回调*（*callbacks*）的使用不再是“最后的手段”，而且在许多不同的语境下被恰当且频繁使用。然而，*升级*（*escalation*）后继*降级*（*demotion*）仍然是我们日常工作中经常采用的技术。事实证明，使用*哑数据*（*dumb\
  \ data*）比*不透明指针*（*opaque pointer*）在许多情况下对于完全消除显式依赖都非常有用，且始终带有（非负）整数索引——例如在节 3.12.11.3\
  \ 中讨论的 `Calendar` 假期索引。与不透明指针不同，使用哑数据还利于通过（例如 BDEX 风格的）序列化来实现值的外部化（见图 3-153、节 3.12.3）。\n\
  \n*冗余*（*redundancy*）技术（降级的替代方案）等同于一种判断，我们发现使用得较少，但仍被认为是过度耦合的有效替代方案。通过*管理类*（*manager\
  \ class*）保留编译时可见的所有权层次仍然是我们设计策略中不可或缺的一部分，当接口满足 (1) 为我们提供，(2) 是不可变的，且 (3) 规定了“在接口中使用”（Uses-In-The-Interface）逻辑设计周期时，*重构*出独立测试的（即使不可可复用的）子组件仍然是有明智的。最后，*升级封装*（*escalating\
  \ encapsulation*）——例如通过包装类——是实现层次化复用的重要部分。在这种分层化方法中，我们理解构成底层实现的组件本身不需要被封装并保持私有——只有它们*使用*必须对高层类的客户端隐藏。自从该技术被首次提出以来，我们扩展了它，允许包装包通过某些虽然可疑但合法的强制转换技术来模拟弱的包级友元关系.^(362)\n\
  \n^(362)\n\n## 3.6 避免过度的链接依赖\n\n\n\n\n虽然我们的方法论明确禁止循环物理依赖，但过度（尽管是合法的）链接时依赖也会通过拖入大量大多数客户端永远不会使用的代码，从而干扰其他轻量级、高可用性软件的有效性。例如，一个\
  \ `Date` 类应该能够表示一个日期值（在某种未公开的内部格式中），并使用常用操作高效地处理该值（例如，用于计算两个日期之间 `actual` 天数的 `operator-`）。诸如“天数计数”惯例（金融行业特有）、格式化函数（这些函数是不稳定的，且可能会发生变化）以及日期数学函数（例如查找特定年份月份的第\
  \ `n` 个工作日，尽管它们不需要访问数据库，但绝非原始操作）等功能所需的额外依赖，为一个原本轻量、易懂、易用、具有值语义且词汇化的 `Date` 类型的客户端造成了不必要的负担（例如在设计和/或链接时）。依赖于重构不当的功能（例如，单体封装器）是过度链接时依赖的另一个来源。\n\
  \n### 3.7 横平架构 vs. 分层架构\n\n我们天生的倾向是在现有基础上进行构建。这种心态可能导致在超出合理范围的范围内使用组合（或分层）。对于在组件接口边界处需要高性能的小型系统来说，通过显式物理依赖实现的组合是高效的、易于理解的，并且通常是正确的方法。然而，对于规模得多的系统，仅基于组合的架构在两个重要方面存在缺陷：(1)\
  \ 它缺乏灵活性，实际上是标准化为了单一的、事实上的实现；(2) 依赖关系随着抽象层级的不断增加而增长，使得开发——尤其是组件级（又称“单元”）测试——变得异常沉重。由于这些原因，经典的“分层”架构无法扩展。\n\
  \n与深度分层架构最邻近的替代方案是更具`横平`（lateral）特性的架构。实现横平设计至少有两种基本方法。一种方法涉及重构值语义类型（见卷二，第 4.1–4.3\
  \ 节），使得填充这些类型的功能（例如，从数据库）和使用这些类型的功能（例如，业务逻辑）作为独立的平级节点存在——每个节点都依赖于低级的值类型。这种更`横平`但仍是组合式的的设计比经典的`分层`架构更稳定、灵活且易于测试，因为开发业务逻辑的人员不受填充器的添加或修改的影响（反之亦然）。\n\
  \n实现更横平架构的另一种常用方法是定义一个纯抽象接口，用于定义客户端预期的服务。然后我们可以通过 `adapter`（适配器）来创建自己的实现或利用其他实现，包括第三方或开源解决方案——即一个继承自抽象接口或\
  \ `protocol`（协议）并在其实现中使用具体类型的类。该主题可以有多种变体（见图 3-116、第 3.7.5 节）。此类抽象接口类型的具体实现由更高层级的代理（例如，`main`）提供给客户端对象——要么在构造时提供，要么在每次调用特定方法时提供。\n\
  \n出于对运行时性能的考虑，我们可能会选择将特定方法（通常接收指针或引用的适配器基类）设为方法 `template`。在传统平台上，这种方法在编译时往往通常比虚函数更容易绑定，尽管在某些重要情况下虚函数也可以被“去虚化”（见卷二，第\
  \ 4.10 节）。通过使用成员函数模板，我们可以实现一种物理独立、灵活且运行时高效（尽管高度协作且在编译时紧密耦合）的横平设计。\n\n尽管我们通常粗略地刻画（例如在元数据中）跨包和包组的组件依赖（第\
  \ 2.16 节），但我们仍应注意单个组件的依赖，以便在实践中实现最小的物理耦合——例如在部署后（见图 2-89、第 2.15.10 节）。特别是，我们可以通过选择`轻分层`方法而非`重分层`方法来缓解分层系统的固有成本（见图\
  \ 3-112、第 3.7.4 节）。这些成本可以使用`cumulative component dependency`（CCD）物理设计质量指标进行量化（见图\
  \ 3-114、第 3.7.4.2 节）。\n\n横平架构与分层架构之间的权衡是大规模软件设计的关键方面。在中等规模下，创建组件显式依赖于底层组件的组合架构具有规模效益。横平架构的成本，无论是运行时（通过虚函数）还是编译时（通过成员函数模板），更通用且可能更合适地用复杂度（人类认知）来衡量。通过这种方式，分层子系统类似于单栋多层天大楼（第\
  \ 3.7.1 节）。然而，超过某个点后，与灵活性相关的成本以及进行组件级测试所需的链接成本将变得不可接受。因此，大规模软件像大城市一样，横平扩展会比垂直扩展得更好。\n\
  \n### 3.8 避免不当的链接时依赖\n\n横平架构特别有效地避免了重量级、不可预测或其它不良的软件，特别是在系统的低级。然而，某些依赖不仅仅是过度的，而且在性质上是不当的。不当依赖的一个示例是将轻量级的值语义类型（例如，`Date`\
  \ 或 `Calendar`）绑定到平台的操作系统或特定厂商的数据库。其他示例还包括：(1) 在核心库中引入没有足够 SLA（服务水平协议）或需要特定版本不受控制软件的开源或第三方软件；(2)\
  \ 依赖特定操作系统的非标准特性，而这些特性在所有支持的平台上无法高效模拟；(3) 依赖需要特殊硬件支持的软件。\n\n经典的分层架构也可能是不当的，因为它们通常迫使我们标准化为单一实现。将我们限制在某种特定的具体传输机制（例如\
  \ `sockets`）会阻碍我们在进程之间进行最优通信。随着时间的推移，可能会出现新技术（例如 `shared memory`、`openSSL`、`MQSeries`、`ASIO`），可能带有巨大的益处（例如性能、安全性、容错性、生产力），我们想要利用这些——甚至可能在同一进程中与其他技术并存。依赖第三方产品是有风险的；然而，利用它们并不一定有风险。通过在更横平的设计中将功能适配到稳定的接口，我们能够利用新技术，而不必对其押注。\n\
  \n\n\n在典型的横向设计中，派生自协议（protocol）的具体类对象将由高级别的代理（例如 `main`）构造为自动变量，并随后进行配置。然后，该对象的地址将（通过其基类）传递给另一个具体类的构造函数，该具体类派生自另一个与第一个类处于同一低物理层面的纯抽象基类，但在逻辑抽象层上又更高。该（具体）对象的地址反过来可以用于创建第三个具体类的对象，依此类推。\n\
  \n将一种低级技术替换为另一种技术，只需修改用于语句序列（例如在 `main` 中），这些语句用于创建实例化该技术所需的子对象，以及用于配置该技术的任何后续对象（例如参见图\
  \ 3-122、节 3.8.2）。或者，客户端可以在运行时或编译时的每次方法调用中，提供一个抽象接口、具体机制或远程服务。然而，与分层设计不同，横向设计的可扩展性没有实际限制。\n\
  \n### 3.9 确保物理互操作性\n\n为了最大化重用，我们希望确保我们的组件之间具有某些基本的物理互操作属性。特别是，我们希望避免出现组件的使用限制了其在同一程序内使用或重用的情况。我们还希望尽量减少使用某个组件会限制同一程序内某些其他组件的使用的情况。物理互操作性差的有几种具体表现，是我们想要避免的：特定域的条件编译；库软件的特定特定依赖；逻辑构造体（例如\
  \ `static` 变量）或设计模式（例如 `singleton` 单例模式）人为地限制了重用；在定义 `main` 的文件之外定义全局实体；为了逻辑封装而隐藏头文件；以及对不可移植软件的未隔离使用和依赖。未能通过这些方式确保物理互操作性，将阻碍我们从现有部分组合成新解决方案的能力——即，这将阻碍分层重用（节\
  \ 0.4）。\n\n### 3.10 避免不必要的编译时依赖\n\n避免不必要的编译时依赖是良好的物理设计的另一个重要方面。`encapsulation`（封装，隐含了信息隐藏）一词意味着，在正常使用下，某些实现细节在程序上是不可访问的。也就是说，对封装的实现细节的更改不需要生产客户端重做其代码。然而，`insulation`（隔离）一词蕴含了比封装更强的属性。更改组件的隔离的实现细节不需要客户端甚至\
  \ `recompile`（重新编译）其代码。这些术语的正式定义在节 3.11.1 中提供。\n\n隔离实现细节使得在不需要重新编译客户端的情况下更改它们成为可能，这反过来可以大幅减少重建整个系统所需的时间。此外，隔离关键的低级实现细节使得快速\
  \ `patch`（补丁，见下文）缺陷成为可能，而不是使用传统的、深思且耗时的标准发布过程逐层重建整个系统。`encapsulation` 与 `insulation`\
  \ 之间的这种关键区别对于广泛使用的软件基础设施库的开发者可能具有至关重要的意义。\n\n例如，为了修复发布之间的关键漏洞而重建整个系统，可能是极其昂贵的（如果由于关键人员不可用，则完全不可能）。`patch`\
  \ 是对先前发布的软件版本的本地更改。当发布之间遇到关键漏洞时，制作补丁通常比重新发布整个系统更廉价，破坏性也小得多。只要组件的物理接口和合约不发生更改，修改后的实现通常可以重新编译并直接替换，而无需重新编译其他组件。\n\
  \n组件的实现越被隔离，它就越有可能被本地修复（而无需强制客户端重新编译）。我们快速对系统进行补丁和重新发布的能力，与该整个系统中实现细节相对于客户端的隔离程度直接相关。因此，在可行的情况下，跨越主要接口边界隔离实现细节通常应被视为一个设计目标。\n\
  \n## 3.11 架构隔离技术\n\n隔离技术有两种基本类型：`total`（完全）和 `partial`（部分）。完全隔离意味着实现的任何方面如果发生变化，都不会迫使客户端重新编译。部分隔离意味着客户端对实现中某些方面的变化导致的重新编译具有免疫力，但对其他方面则不然。如果目标是完全隔离，那么就会会有架构上的影响；如果只需要部分实现，则其性质和程度完全是一个实现细节（参见第二卷，第\
  \ 6.6 节）。\n\n实现完全隔离本质上有三种独立的方法：(1) 纯抽象接口；(2) 一个完全隔离的封装组件；(3) 过程化接口。使用纯抽象接口的客户端不仅免受所有编译时依赖的侵害，还避开了对任何单一实现的直接链接时依赖——其注意事项是，实例化抽象接口派生实现的代理存在于使用它的客户端更高的物理层级。请注意，每当涉及继承时，提取\
  \ `protocol`（协议）类都是一种通用的隔离技术，应该用于重构非纯抽象基类的接口和实现——无论结果隔离效果的（感知）价值如何。\n\n当采用完全隔离的封装组件时，实例化给定对象的同一客户端可以使用该对象，而不会由于该组件实现的更改而受到影响（即需要重新编译）。客户端仍然会继承被封装实现的依赖关系。然而，使封装组件实现完全隔离可能会产生巨大的运行时开销。此外，通常无法在不使用远距离（即组件间）友元的情况下，为现有系统创建多组件封装（节\
  \ 3.1.10.6）。因此，对于现有的子系统，过程化接口通常是唯一可行的完全隔离方案。\n\n过程化接口总是可实现的，但并不总是合适的（或最佳选择），因为通常会有重大的开销和保真度损失（例如关于继承和模板）。它绝不应在可能限制侧边重用可能性的语境中使用。然而，在两种情况下，过程化接口通常是正确的决策：(1)\
  \ 隔离一个底层类型并非设计用于重用的遗留系统；(2) 提供一个翻译层（例如从 `C++` 到 `C`）。在上述两种场景中，重用损失都不会产生任何成本。\n\n\
  \n\n\n一个有效的过程接口（`PI`）通常具有八个特征属性（参见图 3-150，第 3.11.17.13 节）。每个 `PI` 函数在*物理上*位于与其访问的对象不同的独立组件（通常是\
  \ UOR）中，并且在*逻辑上*与任何其他函数都相互独立。实现 `PI` 函数的每个组件都与其它此类组件相互独立，除了实现机械翻译所需的功能外，不提供任何额外的领域功能，并且与它所“封装”的底层\
  \ C++ 组件保持 1 对 1 的映射关系（它展示了该组件的*视图*）。最后，每个 `PI` 函数都以可预测的方式命名，可以从 C 或 C++ 调用，并传输（尽管是不透明的）实际的底层的\
  \ C++ 类型；因此，从设计角度上说，`PI` 并*不是*一个真正的封装器。\n\n## 3.12 使用组件进行设计\n\n最后，在用组件进行设计时，我们必须同时考虑逻辑设计和物理设计。起初看起来可能是类的类的原始行为，可能会产生超出其初始要求的物理后果。为了实现模块化、可维护的设计，建议的类可能需要经过大幅重构，导致产生若干个组件。只要软件的整体提供了一个有效的解决方案，通过细致划分带来的层次化复用的各种益处，将不可避免地抵消（通常是微不足道的）客户端用上的调整。\n\
  \n在创建软件基础设施的过程中，我们必须考虑长期布局，但要推迟与当前业务需求无关的外围组件的实现。当然，所有必需的基础软件必须首先实现，并且以完全分解的形式实现。可以以后根据更迫切需要的组件实现的软件，应该在开始时考虑到，但随后必须推迟到未来的合适项目，否则交付延迟可能会阻碍这种整体基于组件的开发方法的任何使用。在开发过程中，我们必须抵住仅根据逻辑内聚性就将多个类放在同一个组件中的诱惑（参见第\
  \ 3.3.1 节）。这样做可能会影响稳定性，或在未来的道路上消除重要的设计替代方案（例如，参见图 3-172，第 3.12.11.2 节](#ch03.xhtml_ch03lev3sec12-11-2)）。\n\
  \n我们设计方法的深刻优势源于我们能够实现的层次化复用，这是通过故意将（第 0.1 节）良好、分级细致且细粒度的组件（第 0.4 节）反馈到我们企业级的软件资本库中（第\
  \ 0.9 节），并随着时间的推移不断扩大该库（第 0.10 节）。每当我们尝试解决一个新的业务问题或在现有系统中提供新功能时，我们需要仔细考虑该解决方案如何最好映射到我们现有的层次化复用基础设施上。原始规范需要被原子化并精细地重新组装（第\
  \ 0.11 节），形成逻辑严密、聚焦、面向客户端且符合众所周知类别的组件（参见第二卷 II，第 4.2 节）。\n\n一旦“接口”组件的规范大部完成，开发思维就会发生变化。我们不再从外部客户端的视角来看系统，而是现在开始考虑实现面向客户端组件所需的所需的、非面向客户端组件的可复用层次结构。每个组件转而变成一个新的子系统，而将其作为顶层面向客户端组件进行开发的过程会递归进行，直到达到规模和复杂度适中的组件——这就像我们在量化类比中所做的那样（参见第\
  \ 0.8 节）。只有当我们达到这种异常激进的分解水平时，我们才开始挖掘设计、实现、渲染（参见第二卷 II）和测试（参见第三卷 III）的底层细节。\n\n###\
  \ 结论\n\n最终，本章的目标是展示一个物理上合理、分解良好、细粒度的软件基础设施以及如何实现它。可靠性降低、维护成本增加、可执行文件增大以及运行时性能下降都是糟糕物理设计可能导致的后果。在其他条件相同的情况下，上述每一点都应该被避免。如图\
  \ 3-180 所示，测试性降低、可用性降低和修改性降低是这些不良后果的三个重要主要原因。\n\n![](img/fig3-180.jpg)\n\n**图 3-180:\
  \ 糟糕物理设计的后果和原因**\n\n如果一个系统更难测试，它的测试就会越少，可靠性越低，因此需要更多的维护。应该是（但不是）可复用的软件使用得越少，因此验证越少，因此通常可靠性越低。复用越意味着重复越多，因此有更多的代码需要维护；因此，维护它的成本更高。程序中用更多代码来做相同的事情意味着可执行文件增大，而由于缓存考虑，这可能会影响运行时性能。最后，修改性降低意味着更改将变得困难（成本更高）（例如，针对可执行文件大小和运行时性能等物理参数进行优化）。\n\
  \n这些不良后果的间接原因包括链接时间增加、理解性降低和编译时间增加。如果链接驱动程序到被测代码的成本更高，那么每美元的测试工作就会更少。同样，如果复用某部分代码导致链接时间大幅增加，该代码就不易被复用。一旦代码被修改，就必须测试；因此，如果测试成本更高，修改成本也更高。由于完全不同的原因，理解性的降低与链接时间的增加密切相关。最后，编译时间的增加影响了我们修改的能力。这种问题与链接时间的增加不同，可以逐个地解决。\n\
