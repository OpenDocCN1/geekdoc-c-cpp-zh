  \ 类型的要求。\n\n![](img/unfig1-16.jpg)\n\n¹¹⁰ 在 Austern 1998 年的书（**austern98**）第 2.2\
  \ 节）的“要求与概念”（第 16–17 页）中，Austern 使用“是……的模型”（is a model of，第 16 页）短语而非*模型*（Models）术语，我们采用了后者。注意，Austern\
