  class B { /*...*/ };\n\nclass D : public B { /*...*/ };\n```\n\n### 1.7.4 “在实现中使用”（Uses-In-The-Implementation）逻辑关系\n\
  \n![](img/unfig1-8.jpg) 意味着“`B` 在（`B` 的）实现中使用 `A`”，隐含了 `B` 对 `A` 的物理依赖（参见第 1.9 节）。我们有时会为了说得比较“粗略”，比如“`B`\
  \ 在其接口中使用 `A`”或“`B` 在接口中使用 `A`”（不加限定），但我们始终指的是“`B` 在 `B` 的接口中使用 `A`”，而绝不是“`B` 在\
  \ `A` 的接口中使用 `A`”。\n\n**定义：如果一个类型在函数的定义内部被引用，但没有出现在签名中，则该类型在函数的实现中使用。**\n\n每当函数声明在参数列表中或作为返回值类型的一部分命名了某个类型时，就说该函数在其接口中使用了该类型。例如，这个自由（即非成员）函数\n\
  \n点击此处查看代码图像\n\n```cpp\nbool operator==(const Date&, const Date&);\n```\n\n显然在它的接口中使用了\
  \ `Date` 类。该函数恰好返回一个 `bool`，因此 `bool` 类型也被视为该函数接口的一部分。基本类型是无处不在的；因此，它们的使用不会引起物理依赖，因此它们不属于这种情况。\n\
  \n**定义：如果一个类型在类的类的任何（公共）成员函数的接口中使用，则该类型在该类的（公共）接口中使用。**\n\n如果类的的任何成员函数（友元函数不计^(101)）依赖于其接口中的某种类型，我们就说该类在其接口中依赖于该类型。例如，`Calendar`\
  \ 的 `addHoliday` 方法依赖于某种类型，说该类在其接口中依赖该类型。由于 `D` 派生自 `B`，为了让 `D` 能将 `B` 命名为基类，必须已经见过类\
  \ `B` 的定义^(100):\n\n^(100) 在一些旧的文本中，你可能会看到箭头指向相反的方向，这可能是误导。箭头显示了两个实体之间由标签（在本例中为“是”）表示的非对称关系。如果要反过来画箭头，我们在逻辑上必须将该关系称为其他名称，例如“派生”（Derives）或“是...的基类”（Is-A-Base-Class-Of）：\n\
  \n![](img/unfig1-9.jpg)\n\n这种替代表示法并不理想，因为箭头的指向方向与隐含依赖的方向相反（参见第 1.9 节）。\n\n```cpp\n\
  class B { /*...*/ };\n\nclass D : public B { /*...*/ };\n```\n\n\n\n\n最后，由于自由操作符的实现通常非常轻量，且它们的物理依赖几乎从未超过它们所操作对象的类的依赖，我们通常会省略它们的显式表示，隐式地将自由操作符视为类的一部分（如图\
  \ 1-48c 所示）。注意，我们的设计方法要求同构运算符必须留在定义其所操作的类的同一个组件中（参见第 2.6 节）。\n\n*分层*(参见第 3.7.2 节)是通过更小、更简单或更原始的类型构建更大、更复杂或更复杂的类型。分层通常通过组合发生——例如，在另一个类型的足迹中嵌入一个简单类型的实例（Has-A\
  \ 关系），或通过嵌入的指针管理该类型的动态分配实例（Holds-A 关系）——但任何形式的实质性使用（例如会导致编译时或链接时依赖的使用）都属于分层。\n\n\
  类使用类型的特定方式不仅会影响类对该类型的依赖性，还会影响该类的*客户端*在多大程度上被迫依赖该类型（参见第 3.10.1 节）。在这里，我们仅仅列举了类在实现中使用类型的不同方式。\n\
  \n**定义：**\n\n**如果一个类型被*用于类的实现中*，则意味着该类型没有在类的公共（或受保护）接口中使用，但 (1) 被用于类的成员函数中，(2) 在类数据成员的声明中被引用，或\
  \ (3) [罕见地] 派自私有（即是该类的私有基类型）。**\n\n尽管类可以通过多种方式在其实实现中使用另一个类型（参见图 1-49），但用于表示每种变体的符号是相同的。\n\
  \n![](img/fig1-49a.jpg) ![](img/fig1-49b.jpg)\n\n**图 1-49：类在实现中使用类型的各种方式**\n\n¹⁰⁴\
  \ 注意，此处展示的构造函数 `Allocator`（地址）参数用于说明所持对象*不*被拥有的 Holds-A 关系，它与 C++98 中提出的原始分配器模型有很大不同。它是\
  \ C++11 中引入的新型*作用域分配器模型*的动力，并最终导致了 C++17 中采纳的更为灵活且有效的多态内存资源 (PMR) 的采用。在识别出原始模型中的关键缺陷后——特别是由于使用模板实现策略（参见第二卷二，第\
  \ 4.5 节）导致缺乏互操作性（参见第二卷二，第 4.4 节）——我们将探索这种极其优越的内存分配方法的性能以及诸其他附带收益（参见第二卷二，第 4.10 节）。\n\
  \n¹⁰⁵ 私有继承优于分层的一个罕见真实优势是，当我们可以合法地从空基类优化（EBO）中获益时。在 C++03 中私有继承的另一种更罕见的用法（在 C++11\
  \ 中被消除）是允许数据成员在作为参数传递给（现已成为次要）基类的构造函数之前进行初始化。\n\n#### 1.7.5 仅命名的逻辑关系与协议类\n\n![](img/unfig1-12.jpg)\
  \ 意味着名称 `A` 使用在 `B` 的接口中，但拒绝 `B` 对 `A` 有任何隐含物理依赖（参见第 1.9 节）。注意，这里我们使用“虚线”（非实线）来显式表示*不存在*任何物理含义，即定义\
  \ `B` 的组件并不一定需要 `#include` 定义（独立的）组件 `A` 组件的头文件。\n\n![](img/unfig1-13.jpg)\n\n有时，类会通过局部声明（协作地）在其接口中命名一个类型，但在其实现中不对该类型进行任何实质性使用，这种使用使得在编译、链接甚至彻底测试该类时不需要看到该类型的定义。对于具体类来说，这种受限的（仅命名的）使用是刻意的——仅通过刻意设计实现，例如*不透明指针*（参见第\
  \ 3.5.4 节），但对于抽象类来说，这是自然发生的，特别是那些充当纯接口的类，如上面的 `Shape`。我们经常将这种纯抽象接口类称为*协议*（protocol）。^(106,107)\n\
  \n^(106) **lakos96**，第 6.4.1 节，第 386–398 页\n\n^(107)历史背景：经典的 C++ 编译器为了避免在使用此类类的每个编译单元中创建虚函数表的静态副本（以及编译器生成的虚函数定义），通常只在使用此类类的一个编译单元中放置外部绑定定义。\n\
  \n随着编译器/链接器技术的进步——例如为了支持非内联虚函数——我们可以考虑将协议 (1) 非纯的 (2) 定义在唯一的编译单元中。然而，这样做会导致（至少一些）额外的编译开销。\n\
  \n**定义：**\n\n***协议类*是一种满足以下条件的类：(1) 只有虚函数（定义在 .cpp 中），(2) 没有数据成员，且 (3) 直接或间接地不派自任何非协议类。**\n\
  \n协议类是那种在接口中*仅使用* 类型的典型示例。定义协议类的组件前向声明（如有必要则 `#include`）每个接口类型的声明，但不需要在其 `.h` 或\
  \ `.cpp` 文件中包含它们的定义。注意，我们有时会选择下划协议类的名称（例如 `Shape` 类），以将其纯抽象性质（例如参见图 0-51、第 1.7.7\
  \ 节）与其他类区分开来（参见第二卷 4.2）。例如，考虑一个定义纯抽象 `Shape` 的组件，它声明了一个纯虚 `origin` 方法：\n\n```\n\
  // shape.h\n\n// ...\n\nclass Point;\n\n// ...\n\nclass Shape {\n  public:\n   \
  \ virtual ~Shape();\n\n        // 销毁此对象。\n\n    virtual Point origin() const = 0;\n\
  \n        // 返回对象的起始坐标。\n\n};\n\n// shape.cpp\n\n#include <shape.h>\n\n// ...\n\n\
  Shape::~Shape()\n\n{\n\n}\n```\n\n尽管 `Shape` 的 `origin` 方法按值返回 `Point`，但除非 `Shape`\
  \ 的客户端调用 `origin()` 方法，否则对 `Point` 没有实质性使用；此时，客户端将被迫直接 `#include` `Point` 的定义，以避免依赖于*传递包含*的可能性（参见第\
  \ 2.6 节）。保持抽象接口纯净的动机是第二卷 4.7 节的主题。在第三卷第 7 章中，我们将探索*为什么*想要测试纯抽象类本身，并在第三卷的剩余部分第 8-10\
  \ 章中探索*如何*这样做。\n\n#### 1.7.6 仅结构内 (ISO) 协作逻辑关系\n\n\n\n\n除了仅名称上的用法外，还有另一类纯粹协作的逻辑关系——即不包含任何物理依赖关系的关系——它们与涉及（纯）接口继承的逻辑关系非常相似（但又有不同）（参见卷二，第\
  \ 4.7 节）。\n\n这一类独立的纯粹协作的逻辑关系——我们在此称之为 `In-Structure-Only`（仅结构内）——是由 C++98 标准化的原始模板机制实现的，并构泛型编程和标准模板库（STL）的基础.^(108)\n\
  \n^(108) **austern98**\n\n在我们经典的表示法中（参见图 1-47、第 1.7.1 节），没有表示仅结构内（ISO）关系的标准符号。因此，我们在需要时使用了*临时*（ad\
  \ hoc）标记的箭头，或者完全从类图中省略了此类关系。随着此类关系的出现不断扩展到 C++ 标准中确定的那少数关系之外，我们发现越来越需要一种一致的表示法来在图中捕捉它们。图\
  \ 1-50 描述了几个额外的符号，这些符号是通过原始符号的各种组成部分的*层次化复用*（第 0.4 节）专门构建的。\n\n![](img/fig1-50.jpg)\n\
  \n**图 1-50：额外的结构性协作逻辑符号摘要**\n\n为了保持长期建立的含义，我们将一致使用椭圆形气泡来标识逻辑实体，但用虚线替换实线边缘，以指示该逻辑实体是类型的*规范*（specification）而非类型本身：\n\
  \n![](img/unfig1-14.jpg)\n\n这种*类型规范*（即对类型的要求的集合）在 C++ 中被称为 `concept`（概念）。^(109)\
  \ 我们还将继续使用矩形来表示物理实体，同样用虚线替换实线边缘——这次是为了表示该物理实体（尚未）存在：\n\n^(109) **austern98**, 第\
