  \ 是循环依赖的（图 3-87c）——因此必须定义在同一个组件（章节 2.6 和 3.3.1.2）——也没有一个单一对象能作为一个具体的值语义类型来代表整个“图”（参见卷二，第\
  \ 4.3 节）。\n\n使用三个不同的 C++ 类型（包括一个 `Graph` 管理类（例如，参见图 3-56 和 3-57，分别参见章节 3.5.4.3 和\
  \ 3.5.5））来表示图的抽象，允许对这三个类中的每一个在独立的组件中进行连贯的、分层的实现，并使得一个单一对象（一个通过其类型区分出来的对象）负责管理其所有从属对象的生命周期。这种基于类型的分层对象管理，在我们看来，是健全物理设计的基础。\n\
  \n### 3.5.9 析构 (Factoring)\n\n*将独立的可测试子行为从涉及过度物理耦合的复杂组件实现中提取出来。*\n\n实现一个无环的、细粒度的、基于组件的架构需要对分解进行关注：\n\
  \n在分析依赖关系时，必须分别考虑接口和实现的依赖关系。在这两种情况下，理想状态都是系统的依赖图是有向无环图，以便于系统的理解和测试。然而，这种理想对于接口来说比对于实现要更为关键，而且也往往更容易实现。^(137)\n\
  \n— Bjarne Stroustrup\n\n^(137) `stroustrup00`，第 24.4.2 节，第 758–760 页，特别是第 760 页\n\
  \n通过仔细的前期设计，历史证明，跨组件边界的接口和实现的循环始终可以成效地避免。然而，这种*析构*分层技术处理的是这样一个现实：我们创建的软件的所有方面并不一定都在我们的控制之下。虽然标准化（或通过外部指定的）组件的接口循环通常是不可更改的，但它们的实现可能可以通过分解，提取出可独立测试的（即使不可复用）的组件。\n\
  \n图 3-88a 抽象地表示了一个由三个逻辑实体 `A`、`B` 和 `C` 组成的系统，它们的接口要么是天生的，要么更常见的是基于合约的循环依赖。进一步假设，这三个类型所支持的功能被认为太大，如果它们都位于同一个组件中，则将无法有效地实现和测试。即使我们无法更改这些逻辑接口，我们仍然可能析构出足够独立测试的实现功能（图\
  \ 3-88b），使得剩余的循环依赖类可以合理地存在于单个组件中。我们对实现的析构做得越好（参见卷二，第 6.4 节），我们的软件的可测试性就越高（参见卷三）——即使它最终表现为不是分层的。\n\
  \n![](img/fig3-88.jpg)\n**图 3-88: 析构可测试的实现**\n\n特别地，想象我们想要实现一个接口固定的 `Graph`。如果在接口上具有某些灵活余地，我们仍然可能析构出足够独立测试的实现功能（图\
  \ 3-88b），使得剩余的循环依赖类可以合理地存在于单个组件中。\n\n另一种，让 `Node` 类单向依赖于 `Edge` 类，但让 `Edge` 拥有一个指向\
  \ `Node` 的不透明反指针（图 3-87b），同样存在问题。如果由 `Node` 负责（并兼任“图”的双重职责），那么 `removeEdge` 必须是\
  \ `Node` 的一个操作，因为 `Edge` 本质上并不了解 `Node`，却持有着不透明的 `Node` 指针。即使 `Node` 和 `Edge` 是循环依赖的（图\
  \ 3-87c）——因此必须定义在同一个组件（章节 2.6 和 3.3.1.2）——也没有一个单一对象能作为一个具体的值语义类型来代表整个“图”（参见卷二，第\
  \ 4.3 节）。\n\n使用三个不同的 C++ 类型（包括一个 `Graph` 管理类（例如，参见图 3-56 和 3-57，分别参见章节 3.5.4.3 和\
  \ 3.5.5\n**图 3-89: 受限接口示例**\n\n### 3.5.10 提升封装 (Escalating Encapsulation)\n\n*将实现细节隐藏到更高的层次。*\n\
  \n有时，创建可分层的细粒度组件相关的问题并非源于循环，而是源于长距离依赖（章节 3.9）。作为组件开发者，我们习惯于在单个组件内部封装底层设计选择，因此可能不愿意让实现的细节“泄漏”到组件的公共接口中。\n\
  \n什么是*实现组件*取决于我们尝试实现的抽象级别。在最低抽象级别上，我们可能有原子指令^(138)、内存池等。显然，这些具有极低抽象级别的实体不应该暴露在解析器或日志记录等高级子系统的接口中。然而，其他高级子系统的实现应该自由地依赖这些重要的、经过深思熟虑的稳定的底层细节——这是分层复用的前提（章节\
  \ 0.4）。更重要的是，面向客户端的子系统可以更改实现以依赖另一种底层细节，而无需强制高级子系统的客户端重写代码（例如，参见图 3-171 和章节 3.12.11.2）。\n\
  \n最后，这种提升技术是在给定固定（或半固定）接口的情况下进行析构。即使接口完全在我们的控制之下，在后台进行进行析构的机会（参见卷二，第 6.4 节），以（1）促进分层复用和（2）提高可测试性（参见卷三）；例如，另见章节\
  \ 12.11。\n\n^(138) 内存池通常是纯粹的实现细节，而内存分配器经常作为对象接口的一部分出现（参见卷二，第 4.10 节）。\n\n\n\n\n\n\
  作为一个纯粹的教学性示例，为了阐明提高组件级实现细节封装层次提升的潜在益处，请考虑这种（垂直）分层架构（参见第 3.7.2 节），它由一个 `Car`、一个 `Engine`\
  \ 和一个 `SparkPlug` 组成，如图图 3-90](#ch03.xhtml_ch03fig90）所示。在这种设计中，`Car` 在接口中使用它的 `Engine`。从直觉上看，这种逻辑关系意味着任何\
  \ `Car` 类型对象的客户端（例如，机械修理师）都可以打开引擎盖并访问其 `Engine`。然而，在软件中，“在接口中使用”（第 1.7.3 节）意味着至少存在某种程序方式可以以\
  \ `Engine` 类型与 `Car` 的方法进行交互。因此，`Engine` 的使用并不是 `Car` 的被封装的实现细节。也就是说，如果我们想重新实现 `Car`\
  \ 以使用 `MyEngine` 代替 `Engine`，现有的客户端将被迫重构它们的代码。\n\n在我们的方法论中，组件并不“封装”其他组件（参见第 3.11.1\
  \ 节），但支持从组件的概念（第 2.7.5 节）。\n\n![](img/fig3-90.jpg)\n\n**图 3-90：`Car` 使用 `Engine`\
  \ 使用 `SparkPlug` —— 都在接口中**\n\n在上述设计（图 3-90）中，`Engine` 反而在接口中使用 `SparkPlug` 类型。从直觉上看，如果我们能够到达特定汽车的引擎，那么我们也可以到达该引擎中的火花塞。在软件术语中，结果是，我们甚至无法更改引擎使用的火花塞类型，而可能会迫使\
  \ `Car` 的客户端重构其源代码！虽然机械修理师可能需要为特定的引擎更换火花塞，但 `Car` 的所有者可能不需要（甚至不想）直接访问其 `Engine`。尽管如此，`Engine`\
  \ 的机械修理师（或组件级测试驱动程序）无疑希望在测试 `Engine` 时能够有效利用接口中的 `SparkPlug` 对象。\n\n在图 3-35 的设计中，封装范围是基于组件的。也就是说，没有组件作为任何其他组件的封装器。假设我们调整了\
  \ `Car` 的设计，使其不再接口中暴露 `Engine`，但 `Engine` 仍然在其公共接口中继续使用 `SparkPlug`，如图 3-91](#ch03.xhtml_ch03fig91)所示。有了这种新设计，`Car`\
  \ 类型的客户端就无法通过程序访问实现中使用的 `Engine` 类型。该 `Engine` 继续在接口中使用 `SparkPlug` 类型对于 `Car` 客户端来说没有影响，因为现在无法从\
  \ `Car` 的公共接口通过程序方式访问其中任何一个。\n\n![](img/fig3-91.jpg)\n\n**图 3-91：`Car` 在实现中使用 `Engine`（连同\
  \ `SparkPlug`）**\n\n到此为止，敏锐的读者已经知道当这样做具有某些实际用处时，我们愿意扩展类比（例如，第 0.8 节）。现在考虑我们修改后的教学设计，如图\
  \ 3-92](#ch03.xhtml_ch03fig92) 所示，在其中，我们将由 `SparkPlug` 提供的功能替换为 `Fuel` 类型的功能。`Car`\
  \ 的客户端无法避免加油，因此 `Car` 的接口必须允许在在其接口中使用 `Fuel`。虽然 `Engine`（用于 `Car` 的实现中）也依赖于 `Fuel`，这一点是事实，但该方面在（逻辑上）与\
  \ `Car` 的客户端无关。因此，`Car` 的客户端在程序上知道 `Fuel`，但不知道 `Engine`。这里的要点是，如果我们把 `Engine` 类型更改为另一种在在其接口中使用相同类型（的）`Fuel`\
  \ 的类型，那么就不需要重构任何 `Car` 类型客户端的源代码。\n\n![](img/fig3-92.jpg)\n\n**图 3-92：`Car` 在接口中仅使用\
  \ `Fuel`，而不使用 `Engine`**\n\n##### 3.5.10.1 我们的 `Graph` 子系统的更通用的解决方案\n\n让我们现在重新考虑图\
  \ 3-56a 中简单图子系统的实现，此处再次通过图 3-93](#ch03.xhtml_ch03fig93) 所示，但这次包含了它对 `std::vector`\
  \ 的实现依赖。此 `Graph` 类管理一组底层的 `Node` 和 `Edge` 对象——每个对象都定义在单独的组件中。此外，`Node` 维护了一个序列（未管理的）不透明\
  \ `Edge` 指针。`Graph` 和 `Node` 在各自的实现中都依赖 `std::vector`，但 `Node`、`Edge` 和 `Graph`\
  \ 各自拥有自己的封装范围。\n\n![](img/fig3-93a.jpg) ![](img/fig3-93b.jpg)\n\n**图 93：`Graph`、`Node`\
  \ 和 `Edge` 的独立封装范围**\n\n为了让 `Graph` 对象在此设计中协调 `Node` 和 `Edge` 对象，任何修改节点和边缘连接的能力都是公开的。也就是说，`Graph`\
  \ 的客户端对参与的 `Node` 和 `Edge` 对象的访问权限与 `Graph` 相同。尽管任意客户端按照自己的意愿创建并操作自己的 `Node` 或 `Edge`\
  \ 对象是完全可以的，但当这些对象参与（并因此由 `Graph` 对象管理）时，情况并不一定如此。\n\n为了确保 `Graph` 的不变性（参见第二卷第 5.2\
  \ 节）得以保留——例如，在每个 `Graph` 管理的所有此类对象中保持 `Node`/`Edge` 连接的一致——这迫使我们严重限制*任何*客户端对预存 `Node`\
  \ 或 `Edge` 对象可以做的操作（例如参见图 3-57b](#ch03.xhtml_ch03fig57)–c、第 3.5.5 节），使得之前的解决方案无法成为通用的解决方案。\n\
  \n##### 3.5.10.2 封装实现组件的*使用*\n\n这种更通用的提升封装层次的技术背后的主要思想是：具体子系统的实现本身可以是一个封装区域，允许较低抽象层次的组件之间进行开放协作，而无需必将这些组件从公开审查中隐藏（参见第\
  \ 3.9.7 节），或者限制 Graph 以外的其他客户端的独立直接使用。\n\n只要底层组件不构成面向客户端的子系统的程序可访问接口，它们在目的上就是被封装的，但仍然供其他子系统重用。再次，通过提升封装，我们隐藏的是这些底层、稳定实现组件的*使用*，而不是从可能通过分层重用从中受益的新潜在客户端手中隐藏它们（参见第\
  \ 0.4 节）。\n\n\n\n\n\n图 3-94 展示了创建一个更大的*封装范围*的技巧，其中只有特定的（在本例中为*值*类型）类型（即 `NodeData`\
  \ 和 `EdgeData`）允许通过“包装器”类（即 `Graph`）的公共接口传递。任何必须跨组件边界暴露的低级信息（例如出于效率考虑）都存在于仅限内部使用的组件中（即那些定义\
  \ `Node`、`Edge` 和 `std::vector` 的组件）。只要这些实现功能是保持稳定的，就不需要将它们从公共视图中隐藏，也不需要授予 `Graph`\
  \ 对其进行私有访问权限。如果我们更改了 `Graph` 的实现，我们完全可以停止使用这些实现组件中的任何或全部——将它们替换为新的或不同的组件，然而该 `Graph`\
  \ 子系统的调用者无法通过程序手段得知我们此举。因此，`Graph` 的调用者无需重构其源代码。^(142)\n\n^(142) 关于合理离散封装实现细节的处另一个具体示例，请参见第\
  \ 3.1 节和 3.2 节中建议的图 3-170–3-172，第 3.12.11.2 节。\n\n![](img/fig3-94.jpg)\n\n**图 3-94：分离接口类型与实现类型**\n\
  \n注意，在这种设计中，`Node` 或 `Edge` 在 `Graph` 的接口中都是不可见的。因此，这些类型的*使用*——而不是类型本身——仍然是 `Graph`\
  \ 类的实现细节。相反，只有与 `Graph` 调用者相关的从属 `NodeData` 和 `EdgeData` 通过（程序化地）`Graph` 的接口暴露出来。通过这种方式，我们隐藏了“封装”的实现，并仅向客户端暴露所需。\n\
  \n值得强调的是，在 `Graph` 接口中暴露 `Node` 或 `Edge` 的问题具有两方面：(1) 我们严重限制了更改实现的能力——例如，将我们的不透明指针转换为原始数据（参见图\
  \ 3-57，第 3.5.5 节）；(2) 我们被迫限制能够提供给 `Graph` 调用者的功能。通过限制公共调用者对仅*接口*类型（`NodeData` 和\
  \ `EdgeData`）对象的访问，我们允许在*实现*类型（`Node`、`Edge` 和 `std::vector`）中提供更灵活的功能，并允许它们在由 `Graph`\
  \ 领导的子系统的低层中相互作用时具有更大的灵活性。\n\n### 3.5.10.3 单组件包装器\n\n有时我们不想（或负担不起）完全重构我们的设计。在可能的情况下，我们可能会选择创建一个单组件包装器（例如，分别参见图\
  \ 3-5 和 3-6b，第 3.1.10 节和 3.1.10.6 节），它封装子系统*所有*组件的使用，并对其底层功能提供间接访问。这种封装包装器有时被称为*外模式*（facade），^(143)可以通过在单个组件中整合客户端真正需要使用的底层子系统内容，使公共消费变得更容易、更安全。此外，对低级功能拥有一个物理隔离、经过精心挑选的程序化*视图*提供了额外的稳定性，从而为更广泛地重构和增强底层实现提供了灵活性，而不会对其公共客户端产生不利影响。\n\
  \n^(143) **gamma95**，第 4 章，“外模式”节，第 185–193 页\n\n图 3-95 展示了单组件包装器 `xyza_pubgraph`\
  \ 如何用于封装由 `Graph` 管理类领导的子系统中的所有组件，而该管理类本身——在*语法上*（即在编译时）无法做很多事情来帮助确保其不变性得到保持。^(144)。在这种基于包装器的实现中，`Graph`\
  \ 是 `PubGraph` 类的私有数据成员，但除了常见的低级*词汇*类型（参见第二卷第 4.4 节）如 `std::string` 和 `bdlt::Date`\
  \ 之外，实现 `PubGraph` 的包装器接口未使用 `Graph` 的任何实现。也就是说，我们现在能够对 `Graph` 的结构进行本质上的任何任意更改，而不会违背（高级）包装器组件\
  \ `xyza_pubgraph` 的接口和契约。^(144) 关于纯语法防御防止调用者误用的替代方案，请参见第二卷第 5.2、5.3 节。\n\n![](img/fig3-95.jpg)\n\
  \n**图 3-95：创建一个封装的 Graph 包装器**\n\n注意，上面的示例是为了*解释*这种设计是如何产生的，但并不一定意味着它*应该*以这种方式呈现。如果有机会，我们可能会选择将\
  \ `Graph` 重命名为类似 `GraphImp`（或将其移动到更低级的包），然后从包装器名称及其包含的类中移除“pub”前缀，让毫无防备的客户端忽略底层基于包装器的设计。在任何情况下，这种重命名决定将取决于底层系统在多大程度上可以被（至少部分）公共客户端安全且更高效地使用，以及为此付任何（经过衡量的）运行时性能。\n\
  \n### 3.5.10.4 包装带来的开销\n\n单组件包装器的使用通常是不合适的。除了无法扩展到任意大小的系统（参见图 3-6c，第 3.1.10.6 节之外，通过全封装包装器使用系统（取决于实现和平台）与直接访问未包装的系统相比，可能会产生额外的运行时开销。^(145)。如果目的是减轻某种程度的编译耦合（参见第\
  \ 3.10.1 节），则*隔离器*组件（参见第 3.11.6.1 节）导致的运行时开销可能会高得多。^(146)。因此，单组件包装器可能位于物理层次中足够高的位置，以免对运行时性能造成不可接受的下降。\n\
  \n\n\n\n有时，我们可能合理地希望为一个（可能是规模庞大的）蓬勃子系统的新客户端——该系统拥有大量的“接触点”——提供一个比强制这些客户端直接访问该子系统时更稳定的接口。正如我们所知，单组件包装器（wrappers）无法扩展到任意数量的协作包装器类，而符合我们基于组件的设计规则（第\
  \ 2.6 节）的多组件包装器通常无法通过传统手段实现（节 3.1.10.6 至 3.1.10.9）。幸运的是，自从自进式封装（escalating encapsulation）首次亮相^(147)\
  \ 以来，出现了一种重要的新形式，它可以更广泛地应用于为选定的客户端创建一个对一组在物理层级低层中以不稳定、亲密、微妙或易出错的方式交互的任意组件的受限视图。\n\
  \n^(147) `lakos96`，节 5.10 节，第 312–324 页\n\n这种高度专门——边缘但可移植——自进式封装分级技术的变体，使我们能够实现封装的许多优势，而*没有任何*通常与单组件包装器相关的开销。这种新解决方案涉及到使用影子类（shadow\
  \ classes），每个类都实现在各自独立的组件中，并（通常）被隔离在一个较高级别的包装器包中^(148)。\n\n^(148) 截至本文写作，现代 C++\
  \ 中除了编译单元之外，没有任何逻辑或物理架构构筑可以支持任何形式的包级友元（不推荐），就像在例如 Java 编程语言中存在那样。C++ 模块（module）的概念自\
  \ 21 世纪中期以来一直被设想，旨在直接在语言中支持下一级软件架构。然而，一段时间以来，对许多人来说，它的主要动机和重点似乎已偏移到仅仅改进编译性能。\n\n\
  我们在此提出的对自进式封装分级技术的新颖呈现，似乎（尽管处理得笨拙）在考虑到 C++ 当前和可预见的局限性的情况下，尽可能解决了许多相关的架构问题。请知，作者——Bloomberg\
  \ LP 代表的 C++ 标准委员会长期活跃投票成员——一直在不懈地努力引入一种在架构上可靠的模块功能，该功能不仅是组件的更好实现，还将为子系统提供简要且可操作的（*封装的*，但不是*隔离的*）视图，就像一个良好的\
  \ C 兼容过程化接口（PI）以（不透明地）暴露与底层子系统使用的相同的类型一样（参见第 3.11.7.12 节）。\n\n### #### 3.5.10.6\
  \ 将这种新的、“异端”技术应用于我们的图解示例\n\n为了保持连贯性，让我们再次考虑图 3-56、节 3.5.4.3 中的图子系统设计，在设计中，我们无法提供任意的\
  \ `Node` 或 `Edge` 功能，因为这样做会向 `Graph` 的公共客户端暴露不适当的功能。假设此时 `Graph`、`Node` 和 `Edge`\
  \ 是一个更大、更复杂的类集合的比喻，每个类都有几十个、甚至上百个方法：导致这种自进式封装新转折的原始动机被记录在后世的图 3-96](#ch03.xhtml_ch03fig96)中。\n\
  \n![](img/fig3-96.jpg)\n\n**图 3-96：使用多组件包装器实现自进式封装的起源**\n\n¹⁴⁹ `gamma95`，第 4 章，“Composite”节，第\
  \ 163–173 页\n\n¹⁵⁰ 感谢 Bloomberg LP 的 Pablo Halpern、Vladimir Kliatchko 和 Jeff Mendelsohn\
  \ 的开创性工作 (c. 2004)。\n\n尽管存在上述（历史性的）技术困难（节 3.1.10.6），我们想要做的是通过某种方式创建一个多组件门面（facade），将这些每个类型单独包装在单独组件中，然后只为公共客户端提供我们希望展示的各自功能的一个子集。针对这个棘手问题的建议解决方案依赖于对参与协作包装器子系统的其他组件的物理结构的少量协作知识，但与授予*批量*访问所有底层子系统组件的每个单独实现细节相比，仍相去甚远。\n\
  \n将我们未包装的 `Graph` 子系统转换为具有多组件包装器的子系统的过程是简单的。第一步是复制（又称“dupe”）实现各自面向客户端类型的三个组件，即 `Node`、`Edge`\
  \ 和 `Graph`，然后重命名每个原始组件以反映它们作为实现类型的新角色（例如，`NodeImp`、`EdgeImp` 和 `GraphImp`），如图 3-97a\
  \ 所示。下一步是用这些新的面向客户端类型中的所有数据成员替换为单个对应的包装（实现）类型的嵌入数据成员，如图 3-97b 所示。最后，我们选择向公共客户端暴露的每个方法都需要实现为（通常是\
  \ `inline`）“魔法”转发函数，该函数可以访问底层实现类型——其中一些选择示例在图 3-103c 中。\n\n![](img/fig3-97a.jpg)\
  \ ![](img/fig3-97b.jpg) ![](img/fig3-97c.jpg)\n\n**图 3-97：协作模拟多组件包装器**\n\n起初似乎我们没有做任何有用的事情，但实际上我们做了。如果我们尝试对原始组件使用远距离友元，我们就会向访问它的对象公开暴露每个底层类型的全部实现——这严重违背了良好的工程实践和我们基于组件的设计规则（第\
  \ 2.6 节）。另一方面，仅仅知道参与包装器子系统的每个类型中共同的一个“肮脏秘密”（即图 3-97b），就允许该包装器子系统的其他组件（可移植地）伸入并获取（下文将进一步解释）被包装参数对象的单个包装（实现）数据成员的*公共*功能——仅此而已！也就是说，与远距离友元不同，我们仍然可以自由地独立（当然是兼容地）改进我们底层子系统中的任何组件的实现，只有在确定实现组件的架构和功能已足够稳定之后，我们才添加合适的包装器组件和转发函数。\n\
  \n##### #### 3.5.10.7 为什么要使用这种“魔法” `reinterpret_cast` 技术？\n\n\n\n\n\n这种方法诚然不是最简单的，但它提供了重要的优势（下文将讨论），特别是与打破我们的“远距离友谊”规则相比时——即使这种“非法”友谊仅限于包装组件（wrapper\
  \ components）。对于初学者来说，这似乎我们在这里提议的内容是`未定义行为`（见第二卷第 5.2 节），或者至少在 C++ 标准中未被完全规范，因此无法保证在所有平台上都具有可移植性。事实证明，这种特定的实现技术不仅在所有真实平台上都一直有效，而且\
  \ C++ 标准本身也要求它必须如此.^(151,152)\n\n^(151) 事实上，从 C++17 开始，通过 `reinterpret_cast` 在此类相关指针之间进行转换，C++\
  \ 标准明确保证在所有合规平台上都能按预期工作（`cpp17`，第 6.9.2 节，第 4 段，第 82 页；样式为作者原创）：\n\n两个对象 `a` 和 `b`\
  \ 是指针可转换的，如果 . . 其中一个是标准布局（standard-layout）类对象，另一个是该对象的第一个非静态数据成员 . . . 如果两个对象指针可转换，那么它们具有相同的地址，并且可以通过\
  \ `reinterpret_cast` 从其中一个指针获取另一个的指针. . .\n\n^(152) 有人可能会认为，通过使用私有继承（private inheritance），我们可以更方便（即使不是更可移植）地实现相同的效果。我们对此不同意。我们通常不建议使用私有继承（节\
  \ 2.4.12），因为 (1) 它鼓励使用 `using` 声明，这会引导公共客户端检查所谓的私有实现细节；(2) 即使显式地提供了（内联）转发函数（以及它们的面向公共文档），创建私有继承所需的语法不可避免地将作为包装类“公共”定义的一部分出现——我们认为这在通常情况下是完全不可接受的，在包装器的情况下更是如此。\n\
  \n在我们提出的多组件包装设计模式中（我们将在下文中对其进行详细说明），包装类型本身不参与任何继承关系（至少在语法上不参与），也不具有任何虚函数。由于被包装类型的对象是包装类型的唯一（因此是第一个）数据成员，它们各自的大小和对齐方式（见第二卷第\
  \ 6.7 节）在所有平台上自然将是相同的。此外，包装器和嵌套的被包装对象在 C 和 C++ 中都位于内存中的相同地址。^(153)\n\n^(153) C++17\
  \ 标准将`标准布局类型（standard-layout types）`定义为“标量类型、标准布局类类型（第 12 条）、此类类型的数组以及这些类型的 cv 修饰版本统称为标准布局类型”（`cpp17`，第\
  \ 6.9 节，第 9 段，第 78 页）。`标准布局类类型`定义在一个 12 项符号列表中（`cpp17`，第 12 节，第 7 段，第 238 页）。最后，给出了布局保证（`cpp17`，第\
  \ 12.2 节，第 241–251 页）；特别是，“如果标准布局类对象具有任何非静态数据成员，它的地址与它的第一个非静态数据成员的地址相同”（`cpp17`，第\
  \ 12.2 节，第 24 段，第 244 页）。\n\n在使用这种全局多组件包装设计模式时，高层包装组件能够单方面访问包含的被包装组件的公共接口，而无需修改定义被访问对象类型的包装组件（例如，无需通过添加相应的\
  \ `friend` 声明来授予调用对象类型远距离访问权限）。采用这种实现方法还意外地使得如果该程序中使用的任何包装类在被包装对象之前具有任何额外数据成员，该程序将是“格式错误的”^(154)，这强化了纯粹性^(155)。这种纯粹性确保了包装器的维护仍然是一个简单直接的机械过程，并让所有的“创造力”归于底层实现层，我们断言它理应地属于那里。^(156)\
  \ 最后，将接口类型转换为其对应的实现类型是“可以的”，这足够晦奥且不符合直觉——更不用说这样做取决于未发布的实现细节——以至于没有任何合理的公共客户端会考虑自己这样做。^(157,158)\n\
  \n^(154) 如果该程序中使用的任何包装类在被包装对象之前具有任何额外数据成员，该程序将是“格式错误的”，这强化了我们包装设计的纯粹性。这种纯粹性确保了包装器的维护仍然是一个简单直接的机械过程，并让所有的“创造力”归于底层实现层，我们断言它理应地属于那里。\n\
  \n^(155) 如果该程序中使用的任何包装类在被包装对象之前具有任何额外数据成员，该程序将是“格式错误的”，这强化了我们包装设计的纯粹性。这种纯粹性确保了包装器的维护仍然是一个简单直接的机械过程，并让所有的“创造力”归于底层实现层，我们断言它理应地属于那里。（等等，让我重新对齐）。\n\
  \n最后，将接口类型转换为其对应的实现类型是“可以的”，这足够晦奥且不符合直觉——更不用说这样做取决于未发布的实现细节——以至于没有任何合理的公共客户端会考虑自己这样做。\n\
  \n^(156) 如果该程序中使用的任何包装类在被包装对象之前具有任何额外数据成员，该程序将是“格式错误的”，这强化了我们包装设计的纯粹性。这种纯粹性确保了包装器的维护仍然是一个简单直接的机械过程，并让所有的“创造力”归于底层实现层，我们断言它理应地属于那里。\n\
  \n^(157) 最后，将接口类型转换为其对应的实现类型是“可以的”，这足够晦奥且不符合直觉——更不用说这样做取决于未发布的实现细节——以至于没有任何合理的公共客户端会考虑自己这样做。\n\
  \n^(158) 最后，将接口类型转换为其对应的实现类型是“可以的”，这足够晦奥且不符合直觉——更不用说这样做取决于未发布的实现细节——以至于没有任何合理的公共客户端会考虑自己这样做。\n\
  \n##### 3.5.10.8 包装包级系统\n\n现在让我们考虑包装整个组件包，我们将其称为 **`subs`**，它代表一个涉及各种组件间逻辑关系（是-A、在接口中使用、实现中使用）的任意子系统，如\
  \ 第 1.7 节 所示。假设这个 **`subs`** 包正在积极开发中，因此到目前为止已实现的所有内容并不一定准备好供公众消费。图 3-98 提供了 **`subs`**\
  \ 包的高层示意图，该包（通过设计）嵌入了几个常见的物理设计模式，我们现在将出于教学目的利用这些模式。\n\n\n\n\n\n在包装器包 `wrap` 中修剪依赖关系的第一步，是意识到在低级\
  \ `subs` 子系统中涉及的所有“在实现中使用类”（Uses-In-The-Implementation）的依赖在 `wrap` 中都是不相关的。具体而言，`subs`\
  \ 中从类 `I` 到类 `F`、以及从类 `J` 到类 `F` 和 `G` 的“在实现中使用类”关系，在 `wrap` 包中根本不存在。我们已经通过图中所示的\
  \ `subs` 和 `wrap` 结合包（诚然，图表非常密集）图 3-99 标识了这一属性，我们将在接下来的几段中对其进行拆解。\n\n![](img/fig3-99.jpg)\n\
  \n**图 3-99：被包装子系统的示意图**\n\n下一步是考虑在 `subs`（子系统）包中的哪些组件，由于某种原因，目前不希望在 `wrap`（包装器）包中更广泛地暴露。例如，类\
  \ `H`（图 3-99 中的标签 (2)）可能是全新的，因此还没有“打磨”到足以在包装器级别暴露给公共客户端。定义此类类的组件可以从包装器包中直接删除，而无需修改任何剩余的包装器组件。\n\
  \n记住，我们的最终*分层技术*（levelization technique，在本节中描述）完全关于提高封装发生的层级。假设存在某个类 `B`（图 3-99\
  \ 中的标签 (3)），它被另外两个类 `E` 和 `F` 的接口使用，而这些类都位于 `subs` 包的低层级。通过 `B` 促进的通信可能暴露了实现细节，或者简单来说太危险，不允许公共客户端直接使用。如果不通过在\
  \ `subs` 中发布类 `B` 的头文件来防止公共客户端利用 `E` 或 `F` 中的“在接口中使用类”（Uses-In-The-Interface）关系，将导致开发与部署耦合（第\
  \ 2.15 节），并阻止 `B` 在同样包含 `subs` 的程序中并行重用（例如，参见图 3-129、第 3.9.7 节）。然而，我们可以完全从 `wrap`\
  \ 中省略定义 `B` 的组件，同时从 `wrap` 中分别定义 `E` 和 `F` 的相应组件中移除所有在其各自接口中使用 `B` 的功能。通过这种方式，我们可以手术式地消除有问题的功能，同时保留我们真正希望公共客户端消费的内容。\n\
  \n在第 3.1.10.6 节中（参见图 3-6a），我们阐述了在包装一个元素 `bdlt::Date` 及其容器 `odet::DateSequence` 时，由于分别使用独立的组件\
  \ `my_date` 和 `my_timeseries` 所面临的问题。现在让我们在这里仔细观察这一特定问题：图 3-99 中的标签 (4)。图 3-100a\
  \ 展示了在独立组件中包装元素 `subs::Date` 及其此类元素的容器 `subs::DateSequence` 的前景。由于我们知道 `wrap` 中定义的每个类其唯一的数据成员都是一个来自\
  \ `subs` 对应类型的对象，因此 `wrap::DataSequence` 很容易地进入 `wrap::Date` 并获取其（唯一的）`subs::Date`\
  \ 数据成员的访问^(159,160) 引用（*注：此处原文意为获取访问权限的引用*），并将其提供给自己的（唯一的）`subs::DateSequence` 数据成员，如图\
  \ 3-100b 所示。\n\n^(159) C++17 标准规定，“[*注*：对于左值，引用强制转换 `reinterpret_cast<T&>(x)` 的效果与使用内置\
  \ `&` 和 `*` 操作符的转换 `*reinterpret_cast<T*>(&x)`相同（对于 `reinterpret_cast<T&&>(x)` 亦然如此）。——*注释结束*]\
  \ (`cpp17`，第 8.2.10 页，第 11 段，第 118 页)。\n\n^(160) 虽然在 C++20 中仍然成立，但段落经过重写，并且删除了 C++17\
  \ 的注释（显然是多余的）。\n\n![](img/fig3-100a.jpg) ![](img/fig3-100b.jpg)\n\n**图 3-100：处理日期/容器（来自图\
  \ 3-6a）**\n\n包装公共继承在本质上是有问题的，我们完全可以选择在包装器层忽略继承。尽管如此，包装器层仍然具有某些（尽管有限）能力来处理语义关系，这是我们选择展示的。\n\
  \n参考图 3-99，类 `C` —— 在两个包中都被标记为 (5) —— 是抽象的。在 `subs` 中，`C` 是纯抽象（*协议*）基类；在 `wrap`\
  \ 中，`C` 是一个没有任何定义的命名类。尽管如此，指向 `wrap::C` 的指针必然代表指向其 `subs` 对应项的相同地址。图 3-101 详细展示了\
  \ `wrap` 和 `subs` 包相应组件之间发生的情况。注意，通过 `Client` 类 `consume` 方法的 `std::size_t numBytes`\
  \ 参数传递的参数被直接转发到抽象类 `Base` 持但不拥有的 `d_mechanism_p` 指针数据成员的 `allocate` 方法，而具体类 `Derived`\
  \ 构造函数的 `char dummy` 参数仅作为占位符。\n\n![](img/fig3-101a.jpg) ![](img/fig3-101aa.jpg)\
  \ ![](img/fig3-101b.jpg)\n\n**图 3-101：对通过公共继承相关的类的有限能力**\n\n为了使这种多组件包装器技术生效，包装器层不能有语法上的继承。然而，我们仍然可以通过一个命名类允许客户端接受各种派生实现，即图\
  \ 3-99 中的标签 (6)。也就是说，为了模拟继承的语法，我们需要将 `subs` 中正确派生类的自动标准转换，替换为 `wrap` 中显式的手动转换，即图\
  \ 3-99 中的标签 (7)。尽管我们并不一定在提倡这种包装继承关系的方法，但我们觉得有责任展示我们所知的可行性（另请参见第 3.11...15 节）。\n\n\
  ##### 3.5.10.9 这种多组件包装器技术的益处\n\n\n\n\n\n使用这种或许过分艺术化的逐进封装（escalating-encapsulation）技术，现在可以过滤掉问题的低级功能，以形成一个新的、稳定的、面向客户端的多组件包装器接口，而不会影响动态变化的底层子系统的性能。在经过深思缩减且更稳定的包装器中，每个存的组件和方法都直接转发到底层嵌入数据成员的相应方法，从而消除了所有通常与`insulating`（隔离）包装器相关的间接访问产生的所有开销（参见节\
  \ 3.11.6）。这些（仅封装，encapsulating-only）包装器类型中的每种显然都需要（物理上）了解接口中使用的所有其他（底层）包装器类型，以及实现中所使用的相应被封装类型。请注意，与隔离包装器不同，这些包装器组件使客户端面临了相同的编译时耦合，这与如果它们直接包含底层组件将将会经历的耦合是一致的^(161)；这种技术的变体也可以使用足够大且对齐的不透明字节缓冲区和非内联函数来实现大量的隔离（参见第二卷，第\
  \ 6.6 节）。\n\n^(161) C++20 引入的模块语言特性在物理上（可能未来在架构上也是）与此处讨论的`封装-包装器包`（encapsulating-wrapper-package）逐进封装技术的包装器组件非常相似。特别是，C++\
  \ 模块提供了额外的封装（encapsulation）手段，并最终可能还会支持对底层子系统的可操作`views`（视图）。然而，关于隔离（insulation）（参见节\
  \ 3.11.1），C++ 模块在避免客户端对（已封装的）实现细节的编译时耦合方面，并不提供比传统头文件已经支持的更多功能。\n\n### 3.5.10.10\
  \ 对这种逐进封装技术的误用\n\n这种技术的应用者*不应该*做的是，尝试在任何包装器类本身中增强其成员数据或其底层实现类型的功能，唯一的例外是从“派生”到（仅名称上的）基类包装器指针的显式`static`转换函数（另见节\
  \ 3.11.7.6 和 3.11.7.15）。也就是说，除了如何从相应的接口类型访问实现类型并再次转换回（例如作为返回类型），包装器类中不应定义`任何`额外的数据或功能。通过这种方式，包装器子系统保持轻量，仅提供底层子系统的适当窄视图，而它本身定义了所有领域相关的功能。\n\
  \n### 3.5.10.11 模拟高度受限的包级友元\n\n这种最近发现的逐进封装方法有许多优点。由于接口和实现对象在设计上必然是相同的大小，因此不需要额外的空间。而且，由于类型转换和内联转发是在编译时执行的，在现代平台上不应该有`任何`额外的运行时开销。也就是说，这种相对新的基于多组件包装器（multicomponent-wrapper）的逐进封装分级技术为客户端增加了稳定性，为实现者提供了更大的灵活性，并且（在理论上）完全没有额外的运行时或空间开销。然而，注意，这种协作知识刻意局部化到实现包装层的子系统或包中，并且尚未达到继承关系的理想建模。因此，这种高度专门的技术并不是解决节\
  \ 3.1.10 中提出的多组件包装器问题的通用解决方案。\n\n尽管如此，这种逐进封装分级技术的闪亮新转折——迄为止——是我们我们实现高效通用多组件包装器最有效的工具。在出现比编译单元具有更高抽象级别的架构实体的额外语言支持^(162)之前，这种虽然晦奥的方法很可能是我们能做到的最好的。\n\
  \n^(162) 作为 C++20 部分引入的初阶段模块语言特性`并未`提供消除这种巴洛克式逐进封装（escalating-encapsulation）技术所需的关键（例如，细粒度的）架构支持；参见**lakos17a**，第\
  \ 3 节，项目 I，c 段，第 2 页。\n\n#### 3.5.11 节总结\n\n回顾一下：本节——到目前为止书中最大且可能是最重要的部分——详细描述了九种首次在\
  \ 1996 年引入世界的分级技术（此处重复自图 3-42 和节 3.5.1）。\n\n| 逐进 (Escalation) | 在物理层级中向上移动相互依赖的功能\
  \ |\n| :--- | :--- |\n| 降级 (Demotion) | 在物理层级中向下移动共同功能 |\n| 不透明指针 (Opaque Pointers)\
  \ | 让对象仅在名称上使用另一个 |\n| 愚笨数据 (Dumb Data) | 使用指示对同级依赖的数据 |\n| 冗余 (Redundancy) | 通过重复少量代码故意避免重用\
  \ |\n| 回调 (Callbacks) | 客户端提供的函数，允许（底层）子系统在更全局范围内执行特定任务 |\n| 管理类 (Manager Class)\
  \ | 建立一个所有并协调底层对象的类 |\n| 重构 (Factoring) | 将可测试子行为从过度的实现中移出 |\n| 逐进封装 (Escalating\
  \ Encapsulation) | 将隐藏实现细节的点移动到层级中的更高层 |\n\nC++ 语言以及分布式计算格局多年来一直在演变，但保持无环物理层级的基本思想仍然没有改变^(163)。然而，自首次引入以来，这九种分级技术中的两种经历了显著扩展。最重要的是，回调分级技术——最初被认为是最后的手段——已发展成为一种一流方法，包含五种变体：\n\
  \n(163) 关于这九种基础分级技术的额外讨论，请参见**lakos96**，第 5 章，第 203–325 页。\n\n1.  数据 (Data)：持有高层数据的地址。\n\
  2.  函数 (Function)：持有高层无状态函数的地址。\n3.  函数对象 (Functor)：包含一个在编译时绑定的调用对象。\n4.  协议 (Protocol)：使用运行时多态访问更高层。\n\
  5.  概念 (Concept)：使用编译时多态访问更高层。\n\n最后，原始的逐进封装技术已经扩展，允许对多组件包装器进行受限使用，包装器社区内部的共享知识允许一个包装器对象\
  \ `reinterpret_cast` 另一个转换为其唯一的被封装数据成员。通过这种方式，一个包装器可以单方面地访问其被封装子对象的*仅* `public`\
  \ 接口，然后将该对象（引用）传递给自己的唯一被封装子对象。\n\n### 3.6 避免过度的链接时依赖\n\n如果你曾经尝试在库中重用少量功能，并发现链接时间以及生成的程序体积相对于你获得的收益不成比例地增加，那么你可能是由于物理重构不当而包含了过多的代码。\n\
  \n\n\n\n\n在面向对象的系统中，每当需求出现时，都可以以惊人的简单方式向对象添加“缺失”的功能。这种范式的极具吸引力的特征诱使许多尽职的开发者将精简、封装良好的软件变成我们所谓的“Winnebago\
  \ 类（Winnebago classes）”，这些类封装了或依赖于大量的代码，其中大部分对于大多数客户端来说是没有使用的。此类类不仅难以导航且通常稳定性较低，而且还是导致过度链接时依赖和代码膨胀的常见原因。\n\
  \n### 3.6.1 一个最初封装良好但随时间退化的日期的类\n\n例如，考虑 图 3-102 所示的（意图良好的）`Date` 类。与大多数设计合理的用户定义类型一样，该类型是完整的、最小的且原始的（第\
  \ 3.2.7 节）。*日期*就像整数或字符字符串一样，是许多领域中基础*词汇*的一部分，特别是与金融相关的领域。与整数或字符字符串一样，日期的*值*独立于它的表示（见第二卷第\
  \ 4.1 节）。此外，在系统、代码库或理想的语言中，拥有一种单一类型作为表达那种值的首选方式（例如 `int`、`double, const char *`、`std::string`、`core::Date`）是非常理想的，特别是在跨接口边界时。为了确保此类*词汇*类型（见第二卷第\
  \ 4.4 节）能够在物理层次结构中的低层（见 第 3.7.3 节）广泛使用，它们保持轻量、专注的用途至关重要——即稳定且高效地表示一个值，仅此而已。\n\n\
  从 C++17 开始，`std::string_view` 提供了一种可选的接口类型，用于统一 `const char` 和 `const std::string&`\
  \ 类型的参数。\n\n![](img/fig3-102a.jpg) ![](img/fig3-102b.jpg) ![](img/fig3-102c.jpg)\
  \ ![](img/fig3-102d.jpg)\n\n**图 3-102：最初精简、可重用的“词汇”类型：`core::Date`**\n\n最初，`core::Date`\
  \ 类用相当少的额外负担表示日期值。然而，随着时间的推移，大量的*非原始*功能被添加（图 3-103a）……被添加（图 3-103b）……被添加（图 3-103c）！虽然\
  \ 图 3-103 中所示的每个函数单独来说可能贡献的权重较小，但合在一起的开销——无论是从代码体积还是接口复杂性的角度来看——可能会变得巨大。\n\n![](img/fig3-103a.jpg)\
  \ ![](img/fig3-103b.jpg) ![](img/fig3-103c.jpg)\n\n**图 3-103：大量的非原始功能**\n\n图 3-104\
  \ 说明了当允许简单日期类内部直接提供的功能自由增长以满足所有客户端的需求时会发生什么。每当为一个客户端添加新功能时，都可能导致其他所有客户端在实例大小、代码大小、运行时间、物理依赖以及维护和使用的整体复杂性方面付出代价，更不用说稳定性的降低会危及运行中的代码。如果整合\
  \ `core::Date`（带有其所有依赖项）所需的精力相对于典型客户端所获得的收益持续增加，那么人们就越来越可能费力去使用（重用）该类，这违背了我们对重用的通用目标，特别是对于一个*词汇*类型——这正是\
  \ `core::Date` 应该追求的。\n\n![](img/fig3-104.jpg)\n\n**图 3-104：尺寸过大、重量级、不可重用的 `core::Date`\
  \ 类**\n\n### 3.6.2 在日期类中添加工作日功能（坏主意）\n\n让我们考虑一个具体的例子。假设我们需要知道某某一天是否是节假日。由于建议的函数返回日期的某个属性，这种方法似乎属于\
  \ `Date` 类是合理的。然而，进一步检查后，这种选择将被证明是严重误导的。与星期几不同，特定某一天是否为节假日（或非工作日）是上下文的。也就是说，它取决于我们谈论的是哪种节假日：是*法定*假日、*银行*假期、*交易所*假期，还是*学校*假期？这些属性还取决于*地区设置*（例如，伦敦、纽约、东京）。提问需要客户端提供详细的参数。未来的需求也可能导致这些参数的数量和范围增加。\n\
  \n意识到我们无法希望在日期组件本身内部封装所需的信息，我们决定创建一个服务，将每个已知的节假日与其唯一的字符串关联起来。给定一个字符串（例如，代表“纽约银行”的“NYB”）和一个日期（例如\
  \ 2021 年 1 月 1 日），该服务能够查找该日期是否为节假日。我们现在可以使用此服务在 `core::Date` 类中实现所需的成员函数：面向服务的架构（SOA）在精神上类似于过程化层，因为它在实现和该接口的客户端之间提供了一个*隔离*接口（见\
  \ 第 11.9 节）。\n\n```\nbool isHoliday(const char *context) const; // 坏主意\n```\n\n\
  然而，这样做会导致 `Date` 依赖于日历服务，如 图 3-105 所示，这除了大量的操作系统相关代码外，还需要访问必须不断更新的数据库。更好的解决方案是在更高的层次创建一个工具函数\n\
  \n![](img/fig3-105.jpg)\n\n**图 3-105：带有重量级依赖的 `Date` 类（坏主意）**\n\n```cpp\nstatic\
  \ bool isHoliday(const core::Date&date,\n                      const char      \
  \  *context);\n```\n\n在一个依赖 `core::Date` 和新的 `CalendarService` 的 `struct` 中，如 图\
  \ 3-106 所示。对于这个特定问题的更好封装、更完整且运行效率更高的解决方案，请见 第 3.12.5 节。\n\n![](img/fig3-106.jpg)\n\
  \n**图 3-106：不带重量级依赖的 `core::Date` 类**\n\n`core::Date` 的唯一目的是持有日期的*值*，这在概念上是一个有效的年、月、日。根据其内部表示（例如，从某个纪元的序列偏移、年/年内、或年/月/日），某些*原始*操作（如进到下一个有效日期、返回星期、返回两个给定日期之间的实际天数等）将得到便利。任何额外的*非原始*操作（即那些并非合法地直接依赖于特定内部表示的操作）应该被升级。\n\
  \n在 第 3.2.7 节 中，我们讨论了将明显的非原始功能（如上述所有内容）升级到更高层次组件的重要性，但如果我们提议的组件功能中某个被临时确定为原始的方面将会导致物理依赖的大幅增加呢？恰恰在这种情况下，物理考虑为我们的模块化选择提供了关键的（往往是非直觉的）*反馈*，迫使我们设计的该方面进行重构。\n\
  \n\n\n\n\n作为物理依赖不当导致逻辑设计影响的另一个示例，假设我们被请求协助开发一个交易系统，该系统在其他要求之外，需要从持久化存储器读取和写入有关个人账户的信息。`Account`\
  \ 类的初始设计（图 3-107）提供了一个构造函数，它接受一个逻辑 `accountNumber`（唯一标识持久化账户）作为参数，并据此填充账户对象。在析构时，账户对象会被持久化回数据库。\n\
  \n![](img/fig3-107.jpg)\n\n**图 3-107：带有数据库依赖的省略版 `Account` 类（糟糕的主意）**\n\n我们观察到这种设计在几个根本方面都存在缺陷。我们将从解决一些纯逻辑上的设计问题开始。首先，通过\
  \ ID 查找账户在通常情况下可能会失败。在构造函数中尝试填充账户对象，将迫使设计为：`Account` 在失败时抛出（或传播）异常^(166) —— 这种 C++\
  \ 编程风格我们通常并不赞同，特别是在分层可重用软件的低层次，对于直接客户端而言，对所有失败模式进行高效、细粒度的控制可能极其重要（见卷 II，第 5.2 节）。\n\
  \n^(166) 我们理解这个主题是软件开发者之间的争议点。我们并不是说异常在这个世界上没有用之地，而是说，作为分层可重用的软件开发者，我们选择不将异常*强加*给潜在的客户端，从而扩展我们软件的整体适用性（见卷\
  \ II，第 5.7 节），同时也扩展到更广泛的受众——例如嵌入式系统——在这些系统中异常可能根本无法启用。因此，虽然我们在自己的代码中不进行 `try`、`catch`\
  \ 或 `throw`，但我们所有的库都编写成*天然*异常安全的；我们将这种风格的这一方面称为*异常无关*（exception agnostic）（见卷 II，第\
  \ 6.1 节）。\n\n其次，在析构时尝试将对象持久化到数据库可能会导致析构函数阻塞（节 3.3.8.1），或者更糟糕，失败。在析构函数中抛出异常不仅仅是一个坏习惯；如果析构函数本身是由于异常而被调用的，那么第二个异常将杀死进程（糟糕的主意）。仅从逻辑角度考虑，这种设计也必须重构。\n\
  \n假设我们放弃在账户信息在构造/析构时进行水化/持久化的想法，但保留显式的加载和存储函数。我们仍然面临一个问题：这些轻量级的值语义 `Account` 对象在它们进程内值的一部分中，嵌入了唯一的账户编号。两个账户具有相同的值意味着什么？如果两个账户具有相同的账户编号，但其他属性不同呢？那是一个错误吗？如果两个账户编号不同，但所有其他信息相同呢？它们的值仍然相同吗（例如，由\
  \ `operator==` 定义的）？\n\n将 `Account` 变为一个真正的值类型需要从账户类本身中移除唯一 ID（见卷 II，第 4.1 节）。在这种情况下，我们需要一个单独的容器类型（此处未画）来将进程内的账户\
  \ ID 映射到它们关联的值。现在剩下的是一个值语义类型 `Account`，它也（某种方式）提供了 `load` 和 `store` 成员函数，每个函数接受（作为参数）关联的唯一账户编号，这仍然有问题。但我们还没有结束。\n\
  \n在处理了许多纯逻辑设计缺陷后，我们现在考虑我们设计中一个特别不幸的物理影响。将这种原本轻量的值语义类型链接到特定的持久化存储器构成了重量级依赖。此外，任何使用\
  \ `Account` 的客户端都将经历同样的重量级依赖。出于主要的物理原因，需要的是将持久化的这一*概念**提升*到轻量（值语义）类型*之上*（见卷 II，第\
  \ 4.3 节）。我们将在节 3.7 中更详细地重新讨论这个话题。\n\n在更大的规模上，封装已以不同程度的成功将客户端在*逻辑上*与它们运行的平台特定细节解耦来。^(167)。图\
  \ 3-108 展示了此类平台的一种幼稚渲染。从纯逻辑的角度来看，这种方法似乎完全完全合理的：构建在 `abc_platform` 之上的应用程序可以自动移植到每一个已移植了\
  \ `abc_platform` 的平台。然而，从物理角度来看，每个采用这种可移植框架的应用程序——由于其非细粒度的性质（见图 0-17，节 0.4）——可能被迫链接到广泛的平台库，其中许多库对于特定的应用程序来说是不必要的。\n\
  \n^(167) 这样一种常用平台之一是由 Douglas C. Schmidt 创建的 ACE。（参见 **huston03**。）\n\n![](img/fig3-108a.jpg)\
  \ ![](img/fig3-108b.jpg)\n\n**图 3-108：物理单体式的封装模块（糟糕的主意）**\n\n小型应用程序将最明显地感受到重量，因为单体式的\
  \ `abc_platform` 封装模块^(168) 将完全主导它们的物理特征。对于大型应用程序，初看起来这种方法似乎不会产生问题，因为平台功能可能在最终某个时刻被用到——而且无论如何，应用程序的巨大将掩盖大量的未使用代码。然而在实践中，大型且物理良好的程序是分层进行开发和测试的，绝大多数开发和测试发生在微小的子系统中（见卷\
  \ III，第 7.5 节）。因此，使适配平台单体化的昂贵成本将会表现出来。\n\n^(168) 我们在这里使用“模块”（module）一词，是为了将其与我们通常归为单个逻辑和物理设计原子单元的组件(节\
  \ 0.7)区分开。在写作期间，C++ 模块（超越其初始的 C++20 功能）作为比组件*更大*的逻辑和物理设计*架构*单元的概念正在开发中，其某些形式预计将在\
  \ C++ 标准的下一个及后续版本中出现；参见 **lakos17a**，第 3 部分，I 项，c 和 d 段，第 2 页。\n\n#### 3.6.4 节总结\n\
  \n总之，封装和分层在实践中是一种有效的工具，但仅当基于粒度（节 0.4）而非整体的基础上应用时。通过将适配层划分为许多经过深思熟虑的、独立的*物理*组件(节\
  \ 0.7)，我们可以在许多情况下实现逻辑上的收益，而不必付出如此高的物理成本。在其他情况下，逻辑封装和物理分层*并不*足够，事实上，有时甚至完全不适用。在下一节中，我们将研究一种封装和分层的替代方案，被称为*横向设计*（lateral\
  \ design）。\n\n### 3.7 横向与分层架构\n\n\n\n\n大型系统在其包含的模块之间往往存在过度、有时甚至是不恰的物理依赖。过多的物理依赖渗透到我们大规模设计中的部分原因，源于我们在现有基础上进行构建的自然愿望。例如，在过程化编程中，我们习惯于调用低级子程序和库函数来实现高级级功能。在面向对象的范式中，我们通常通过嵌入或其他实质性地使用简单、更原始的对象来创建更复杂的对象。这种基础编程风格通常被称为`composition`（组合）或`layering`（分）。\n\
  \n我们有时倾向于使用`layered`（分层的）一词来涵盖私有或结构继承（见第二卷第 4.6 节）以及具体的“使用”形式的组合（参见图 1-49、1.7.4\
  \ 节）。\n\n分层设计的一种受限形式是将不同级别的逻辑抽象隔离到物理带或`layers`（层）中。根据设计者的意图，每层中的组件可能允许与其正下方层以外的层中的组件直接交互，也可能不允许（例如，参见图\
  \ 2-70、2.9.1 节）。无论如何，低层的物理（特别是链接时）依赖都会被高层继承。这种纪律且僵化的结构化设计通常被称为`layered architecture`（分层架构）。\n\
  \n例如，广泛使用 `bsl`、`bdl` 等低级库（参见 bde14)）。\n\n例如，操作系统的层。参见 deitel04，1.13.2 节，第 35–36\
  \ 页。\n\n分层架构有两个显著问题：(1)它们倾向于标准化某种特定的实现选择；(2)随着我们进入越来越抽象的级别，依赖关系变得越来越沉重。因此，传统的分层架构无法很好地扩展到大型系统中在本在本中，我们将仔细观察分层架构，并提供一种同时解决上述两个问题的替代方案。\n\
  \n### 3.7.1 建筑行业的另一个类比\n\n在我们开始之前，考虑以下问题：为什么大城市中的摩天大楼从没有超过约 100 层？人们可能认为原因是物理层面的：建造底层使其足够坚固以支撑高得多的结构重量的成本将是难以负担的（但可行的）。这个物理论点虽然看似合理，但令人惊讶的是，它并不是主因素。\n\
  \n限制建筑高度的真正因素不是`physical`（物理），而是`logical`（逻辑）：建筑越高，其占地面积单位侧面面积（例如每平方英）的人数就越多。每平方英的人越多，意味着需要更多的电梯（在电梯技术固定的情况下），以便以给定的平均延迟在建筑内垂直移动这些人员。在某个高度（现如今只比\
  \ 100 层高不了多少），可用侧面空间与所需电梯井空间的比例将下降到经济可行性以下。此外，这不仅仅是收益递减：由于每一层的成本都不超过顶层，到了某一点，增加另外一层实际上会`reduces`（减少）整栋建筑每平方英的可用空间总量！因此，大城市有很多高层建筑，但没有极高建筑。\n\
  \n### 3.7.2 （经典的）分层架构\n\n现在让我们考虑图 3-109 所示的经典`layered`（分层）架构。在这种设计范式中，所有的基础“管道”，例如实时数据馈和数据库存储，构成了具体的底层层。下一层由业务（“实体”）对象组成，如`Account`和`Security`，它们预计直接依赖于这个（有时是单体的）基础层（3.6.3\
  \ 节）。在更高的级别上，我们发现了业务服务，如`getAccountBalance`和`findSettlementDate`，它们直接在业务对象上操作。更高的级别是表示层，我们在其中发现不同的\
  \ API，如`TradingInterface`和`AccountingInterface`，它们在物理上依赖于之前的所有层。\n\n![](img/fig3-109.jpg)\n\
  \n**图 3-109：经典分层架构（坏主意）**\n\n在这种设计中，每个业务对象都从物理上（直接地）绑定到数据库层。我们在服务层提供的任何用于操作这些业务对象的功能也同样地（直接或间接地）受到限制。正如图\
  \ 3-110a 所示，像`getAccountBalance`这样必然依赖于`Account`的服务也由于传递性（1.7.4 节）——必然依赖于数据库。最终结果（图\
  \ 3-110）是几乎`everything`（一切）都依赖于数据库！\n\n![](img/fig3-110.jpg)\n\n**图 3-110：垂直组合架构（坏主意）**\n\
  \n在这种严格分层的架构中，叶子层面的独立理解、测试和复用受到了严重损害。例如，我们不能简单地将几个业务对象加载到笔记本电脑上，并在具体设施的范围内实验新服务。此外，这些设施由于是具体的，可能会受到其当前实现的细微影响（见第二卷第\
  \ 5.7 节），使得随着时间推移到其他技术既昂贵又危险。\n\n### 3.7.3 改进纯组合设计\n\n即使在纯组合设计中，也有减少过度物理依赖的大机会。例如，如果我们像图\
  \ 3-111 所示，通过将重量级依赖（例如对数据库的依赖）从业务对象提升（并靠近`main`）来重构图 3-110\n\n**图 3-111：更水平的组合架构**\n\
  \n### 3.7.4 最小化累计组件依赖 (CCD)\n\n最小化组件之间的链接时依赖通常意味着避免深度分层软件。一个子系统分层于另一个系统的细节可以直接影响这种深度。例如，图\
  \ 3-112 大致将分层分类为三种常见类型之一。在图 3-112a 中，子系统`S`依赖于子系统`R`，但仅限于它们各自最高级别的组件。`S`的所有其他组件完全独立于`R`。如果`S`包含多个发布单元（UOR），则只有最高级别的\
  \ UOR 在架构上依赖于`R`。\n\n![](img/fig3-112.jpg)\n\n\n\n# 图 3-112：分层设计模式的分类\n\n即使 `S`\
  \ 被封装成单个 UOR（例如，作为一个包组），并——作为一个架构上内聚的整体——对 `R` 具有架构依赖（章节 2.2.6），取决于子系统 `S` 如何被`部署`（章节\
  \ 2.15.9），`S` 较低层的复用可能对 `R` 没有实际的物理依赖（例如，参见图 2-89，章节 2.15.10）。当 `R` 代表某些重量级依赖而 `S`\
  \ 的其余部分是轻量级且独立有用时，这种`轻量级`分层可能特别有价值。\n\n图 3-112b 展示了一种子系统分层形式，其中子系统 `U` 叶子节点的组件被整个子系统\
  \ `V` 使用，但只有 `V` 的最高层（严重地）依赖于 `U`。在这种分层场景中，再次假设 `U` 和 `V` 分别发布（每个作为一个单一 UOR），复用\
  \ `V` 的任何部分都将意味着对所有 `U` 的架构依赖。再次，取决于 `U` 和 `V` 如何被部署（例如，再次参见图 2-89，章节 2.15.10），`V`\
  \ 较低层的复用可能导致也可能导致对整个 `U` 的实际物理依赖。这种`相应分层`架构可能会发生，例如，如果我们想在给定子系统 `U`（例如实现 `pg1u::EquationAnalyzer`）的能力的基础上构建，通过添加一个新的高层子系统\
  \ `V`（例如基于 `pg1u::EquationAnalyzer` 实现 `pg2v::DualEquationAnalyzer`），但在 `V` 的较低层中仅使用\
  \ `U` 提供的（低级）接口类型，例如 `pg1u::Equation`。^(172)\n\n^(172) 假设`词汇类型`（见卷 II，4.4 节）`pg1u::Equation`\
  \ 是`值类型`，参见卷 II 4.1 和 4.3 节；如果它是一个协议（章节 1.7.5），参见卷 II 4.7 节。\n\n图 3-112c 展示了最重量级的子系统分层形式，其中子系统\
  \ `Y` 的底层依赖于 `X` 的高层。通过这种`重量级`分层，无论 `X` 和 `Y` 如何部署，对 `Y` 的任何使用都会导致对所有 `X` 的物理依赖。这种重量级依赖对于相对较小或使用范围窄的子系统`可能`是可以接受的。但在几乎所有其他情况下，最好避免这种重量级分层。然而，注意，普遍使用对于“水平”（见下方章节\
  \ 3.7.4.1）底层复用库（如 `bsl` 和 `bdl`）是合适的。^(173)\n\n^(173) 这些和其他分级复用包组可以在 Bloomberg 的\
  \ BDE 开源发行中找到（参见**bde14**）。\n\n## 3.7.4.1 累计组件依赖 (CCD) 定义\n\n单个子系统或 UOR 内部各个组件之间过度的链接依赖会直接影响构建和测试它们所需的总工作。累计组件依赖\
  \ (CCD) 是一种物理设计指标，与为子系统或包中的每个单独组件创建唯一的测试驱动程序所相关的总链接成本相关。^(174) NCCD（或归一化 CCD）也被用作物理设计质量的`客观`衡量。^(175)\
  \ CCD 的原始定义在图 3-113a 中供参考。^(176)\n\n^(174) **lakos96**，第 4.12 节，第 187–193 页\n\n\
  ^(175) **lakos96**，第 4.13 节，第 193–201 页\n\n^(176) 图中添加了两个逗号，反映了作者不断演变的语法倾向。与其他行业标准进行比较，参见\
  \ **lakos97b**，第 6.7 节，第 221–226 页。\n\n![](img/fig3-113.jpg)\n\n**图 113：累计组件依赖**\n\
  \n我们将 CCD 作为链接成本的衡量标准，隐含假设将组件链接到测试驱动程序的时间与链接的组件数量呈线性关系。例如，图 3-113b 中`水平`子系统的每个组件都可以独立测试。^(177)\
  \ 因此，每个组件需要链接到其测试驱动程序。构建这三个独立测试驱动程序的累计链接成本因此为 1 + 1 + 1。\n\n\n\n\n\n并非所有设计都应该是纯组合式的。C++\
  \ 语言支持许多完全不同的机制，这些机制可以并且应该用于将大型系统解耦为真正独立的并行子系统。其基本思想涉及将子系统底层发生的具有重量级依赖的组件，替换为对纯抽象接口（协议）的依赖。这种物理解耦的非常通用方法在几十年里被证明是能够带来更灵活的设计，并且在大规模最小化编译时耦合（CCD）方面非常有效。^(178)\n\
  \n参见 `lakos96`，第 5.7 节，图 5-67，第 285 页。\n\n虽然通过受概念（concepts）约束的模板有时可以实现相同的*逻辑*效果（section\
  \ 1.7.6），但这种由*物理*驱动的架构级分离总是更适用于协议，特别是当目标接口的带宽不是问题时。^(179) 请记住，横向架构（lateral architectures）的一个重要优势是允许已部署软件子系统的客户端在高层级混合组合功能，而无需对它们所组合的子系统源码进行重构*甚至重新编译*。\n\
  \n^(179) 另一方面，用于外部化和重新水化对象*值*的（逻辑驱动）成员函数（见卷 II，第 4.1 节）——最初是基于协议实现的（section 3.5.7.5.3）——纯粹出于性能考虑，很快被受概念约束的成员函数模板（section\
  \ 3.5.7.5.4）所取代。理由是：(1) 产生编译时耦合的是客户端代码和库软件，而不是子系统本身；(2) 受的代码量微乎其微。\n\n横向架构的附加收益是，它们自然允许提供一种定制的“虚假（dummy）”实现，该实现源自组件接口中的（低级、双向）*协议*（section\
  \ 1.7.3），并被提供（亦“注入”）^(180)以模拟生产软件中通常是重量级的依赖。这种非常流行的技术（更通地称为*模拟（mocking）*）允许组件作者对通过协议返回给组件的所有值（包括非典型值，如错误代码）拥有完全控制权。然而，请注意，模拟本身几乎永远不作为引入协议的充分理由（见下文）。\n\
  \n^(180) 通过抽象接口提供替代实现的能力有时被称为*依赖注入（dependency injection）*。\n\n作为物理驱动型使用协议的一个具体示例，让我们再次审视图\
  \ 3-114 中的（修改后的）组合式架构。在该系统中，每个业务实体对象都由一个高层工具类填充，该工具类在物理上依赖于该实体和特定的数据库实现。仅将持久化概念从实体对象中提升是一个正确的决策，但假设我们现在想解耦业务对象加载器（Business\
  \ Object Loaders）对特定数据库实现的依赖。我们现在该做什么？\n\n我们可以通过定义一个合适的协议（纯抽象接口）类（section 1.7.5）来消除加载器对数据库的这种不必要的物理依赖，该类描述了适用于特定*业务对象加载器*子系统所需的任何数据库实现的功能。加载器不再直接依赖于私有数据库，而是依赖于自定义的协议类（见卷\
  \ II，第 4.7 节）`Persistor`，如图 3-115 所示。在更高层级，一个具体的*适配器（adapter）*类 `ProprietaryPersistor`\
  \ 使用“自产的”数据库实现 `Proprietary Database` 来*实现* `Persistor` 中刻勒的功能。随后，应用程序高层的职责就是确保在构造时或需要时（例如，每次函数调用时），通过其抽象接口将具体的持久化适配器提供给每个业务对象加载器。\n\
  \n![](img/fig3-115.jpg)\n\n**图 3-115：（协作式）*横向*架构**\n\n这种使用纯抽象接口类来解耦大型系统的方法产生了我们所说的*横向架构（lateral\
  \ architecture）*。图 3-116 展示了用于消除物理依赖的协议的四种变体用法。图 3-116a 展示了一个专门设计的协作子系统，用于在原本应为高层子系统中实现自定义协议。^(181)\
  \ 第一种方法被用于图 3-115 所示的协作数据库子系统的详细示例中。\n\n^(181) 如果协议与低级子系统打包而非高层子系统打包，则拓扑结构（以及产生的\
  \ CCD）更类似于*对应的（corresponding）*分层（图 3-114）。\n\n![](img/fig3-116.jpg)\n\n**图 3-116：横向设计的分类**\n\
  \n另一种更通用的方法是*适配*现有子系统来实现所需的抽象功能（图 3-116b）。在这种方法中，实现自定义协议的适配器类通常位于自己的小型 UOR 中，独立于实现或接口。这种横向设计的示例可以是类似于图\
  \ 3-115 的数据库应用程序，但通过 `OraclePersistor`*适配器*适配到例如 `Oracle` 数据库实现，如图 3-117 所示。请注意，应用程序唯一的源码更改是\
  \ `main` 中具体持久化类型的名称，除了 `main` 之外没有其他内容需要重新编译。\n\n![](img/fig3-117.jpg)\n\n**图 3-117：将自定义协议适配新技术**\n\
  \n图 3-116c 展示了一个直接实现已知低级、可重用协议的子系统，该协议已被接受为整个企业词汇的一部分（见卷 II，第 4.4 节）。图 3-116d 相应地展示了非协作技术适配到这种广泛使用的协议。持久化、序列化、IPC\
  \ 和内存分配只是此类标准化协议的少数候选者。例如，在我们代码库中，管理*所有*内存资源的抽象接口类型已无处不在（见卷 II，第 4.10 节）。\n\n\n\n\
  \n考虑到图 3-115 中的数据库示例（另参见图 3-111、节 3.7.3；图 3-105 和 3-106、节 3.6.2；以及图 2-74、节 2.9.3)），并不难想象降低(节\
  \ 3.5.3)并标准化（参见第二卷第 4.4 节）抽象的 `Persistor` 接口（节 1.7.5），以便供多个应用程序（及实现）使用，如图 3-116\
  \ 中的 (c) 和 (d) 部分所示。^(182) 我们还可以有利地利用协议层级（参见第二卷第 4.7 节）来扩展不同数据库实现变中各级别服务的双向重用性（参见第二卷第\
  \ 5.7 节）。在节 3.8.2 中，我们将更详细地讨论抽象接口如何使我们能够“利用”（适配）新技术，而无需对其“押注”（依赖）。\n\n^(182) 实践中，我们可能需要为实质上不同的数据库（例如，关系型、嵌入式）提供的功能创建独立的接口，以避免创建所谓的“胖接口”（参见第二卷第\
  \ 5 章）。\n\n### 3.7.6 测试横向架构与分层架构\n\n我们经典的测试方法假设了一种分层架构。逐层地（节 1.10），每个组件根据其所依赖的其他组件在本地进行充分测试，而这些组件假设已经经过了充分测试（节\
  \ 2.14）。横向设计允许另一种类型的测试，通过创建一个满足横向“连接”语法要求（即，继承的协议或模板的概念）的测试构装置，其明确目的是为了操纵客户端观察到的响应，作为该客户端测试整体计划的一部分。这种日益流行的方法通常被称为“模拟”（mocking），对于测试那些可能难以触发的失败条件非常有效，特别是当子系统设计自然适用于横向架构时（参见第二卷）。\n\
  \n\n\n\n虽然客户端可能确实需要依赖某种形式的实时时钟，但将对系统时钟的依赖直接构建到通用词汇类型中（见卷 II 第 4.4 节），例如 `Date`（如文下强调的那样），会导致*所有*客户端——包括那些不情愿的——除了依赖它外别无选择。\n\
  \n![](img/fig3-118.jpg)\n\n**图 3-118：从日期组件中提取出 `today()`**\n\n添加任何增加 `Date` 物理依赖性的功能本身都是不受欢迎的。然而，在这种情况下，这种额外的依赖不仅仅是过度；它在定性上改变了组件的物理本质，使其与运行它的特定平台耦合得更紧密。更重要的是，这个组件的设计（或应该的设计）是为了在函数接口中广泛使用的。我们认为，接口类型——特别是那些仅为了表示值的类型——应该保持极其简单，并且不依赖于任何复杂的（例如网络或文件系统）平台功能，因为这些功能在可能需要此类类型的每个平台上可能都是不可用的。\n\
  \n与*轻量级分层设计*（见图 3-112a、节 3.7.4)类似，当库或应用程序中的底层类型仅依赖于平台支持的最底层时，耦合就会减少。\n\n在支持的能力方面，并非所有平台都是平等的；对于某些类型的嵌入式系统尤其如此，在这些系统中，语言的某些“必要”功能（如文件系统、异常甚至是动态内存分配）可能无法供客户端使用。\n\
  \n在实践中，精简版（例如嵌入式）系统最可能需要的类型，是那些仅用于表示进程无关（可外部化）值的低级类型（见卷 II 第 4.1 节）。\n\n无论是否需要这种定性上不同的功能，这种通用*词汇*类型（见卷\
  \ II 第 4.4 节）的客户端仍然将被迫在物理上依赖它，以便与与该类型交互的系统其他部分保持互操作性。因此，对平台内建属性的这种额外物理依赖，以及由此蕴含的逻辑功能，在这里都是*不恰当*的。\n\
  \n如何获取特定的日期值（包括今天）显然*不是*（值语义）日期类型的本质原始行为的一部分（节 3.2.7）（见见卷 II 第 4.1 和 4.3 节）。当我们考虑到必须选择今天的日期值是由*通用*时间还是*本地*时间决定时，并且本地时间的差异可能会影响从一个平台到另一个平台的结果时，很显然，这种默认的逻辑行为也是一种*策略*，出于完全不同的原因，它应该被提升（见卷\
  \ II 第 5.9 节）到物理层级中的更高位置。\n\n相反，让我们假设我们将默认构造函数功能拆分为三个相互独立的组件，如图 3-118b 所示。其中一个组件定义了一个类\
  \ `Date`，它仅持有日期的值。第二个组件定义了一个底层工具类 `OsUtil`，它封装了从操作系统以某种原始形式获取今天日期值所需的内容。第三个组件定义了一个高级工具类\
  \ `DateUtil`，它`知道如何从从`OsUtil` 获取的日期值的原始表示来填充给定的` `Date` 对象。\n\n由于 `core::Date` 对象与其他词汇类型一样（见卷\
  \ II 第 4.1 节）被应用程序和库开发者广泛使用，我们将（根据实践经验）选择让默认构造函数像值类型一样，将我们的 `Date` 对象初始化为经过深思熟虑的固定有效默认值（例如\
  \ 1/1/1），因为这样做封堵了潜在的安全漏洞，保持了日期对象始终有效的不变性，并抑制了来自 Purify 等非常有用的分析工具的（良性）未初始化内存读取警告。\n\
  \n在某些高性能多进程处理环境中（例如在 Bloomberg LP），我们可以想象 `date` 和 `time` 的值维护在无锁缓存中——例如，在共享内存中——以避免系统调用的开销。\n\
  \n旗舰 `Date` 类的用户（如 `ClientX`）如果还需要知道今天日期的额外功能，可以选择通过 `DateUtil` 显式地使用该功能。图 3-118c\
  \ 展示了 `DateUtil` 工具`struct`（见图 2-23、节 2.4.9）如何呈现提升后的重量级行为。然而更重要的是，只需要 `Date` 的原始表示功能的用户（如\
  \ `ClientY`）可以避免对操作系统的不当依赖，并与 `ClientX` 等其他子系统保持互操作性。最后，像 `ClientZ` 这样不需要 `Date`\
  \ 的用户仍然从封装了操作系统底层的可移植平台中受益。\n\n让我们再次考虑什么使得依赖变得不当。通常情况下，如果一个依赖会深刻地（不合理地）影响组件、包或包组的固有物理特性，那么这种依赖就是*不恰当*的。图\
  \ 3-119 列了一些可能不恰当的依赖，但该列表并非详尽。例如，引入我们无法获取全部源代码的第三方软件，存在错误或其他形式的不兼容导致我们失去满足截止日期的能力。对于核心功能，其标准必须特别高。例如，给轻量级的核心\
  \ `Date` 类型增加负担变得更加不恰当，因为为了互操作，客户端几乎被迫使用它。一个组件被使用得越广泛，确保其可维护性、可移植性和及时部署（随着新平台、版本、补丁等的出现）就越重要。\n\
  \n由于在我们的方法中，UOR 在设计时是被原子化处理的，因此应避免 UOR 中的任何地方出现不当的依赖。然而，只要问题的依赖在独立的组件中，如果需要，我们至少可以拥有\
  \ UOR 分区部署的补救措施（节 2.15.10）。\n\n¹⁹⁰ 见**sutter05**，章节“命名空间与模块”，项目 63，第 116–117 页。\n\
  \n\n\n\n上面的 `Date` 示例表明，仅仅通过封装和信息隐藏不足以保护我们的核心基础设施免受不恰的物理链接时依赖。即使经过深思熟虑的重构，组合（*per\
  \ se*）并无法在物理层次结构的底层无缝地引入新技术。此外，单靠封装和分层无法提供语言层面的定制点，以提供一个单独的、经过插桩的“虚假”实现，专门用于调试或测试特定高层客户端的实例（见第二卷，第\
  \ 4.9 节）。这种灵活性通过使用横向架构（[第 3.7.5 节]）可以更好地实现。\n\n通过抽象接口、回调函数甚至方法模板提供显式的源码级定制点，可以获得优越的灵活性和互操作性，相比于在二进制级别提供“存根”实现（例如通过交换\
  \ `.o` 文件）（见 [第 3.9.3 节]）。使用模板参数来定制类模板中仅限实现的方面——通常被称为*基于策略的设计*——则极不理想，因为它会对互操作性（见第二卷，第\
  \ 4.4 节）和可测试性（见第三卷，第 7.3 节）产生不利影响。\n\n### 3.8.2 “押注”于单一技术（坏主意）\n\n良好意的封装和分层最常见的缺点可能是，它迫使人们在其他更可行的替代方案出现很久之后，仍做出（并继续忍受）某些决策。考虑[图\
  \ 3-120a]所示的简单 TCP/IP 服务器架构。在这种*分层*实现中，组件 `xyza_channel` 封装了传输模式，并包含了 `Channel`\
  \ 和 `ChannelFactory`，它们由于友元关系而存放在一起（[第 3.3.1.1 节]）。`ChannelFactory` 的接口提供了设置通信通道所需的功能，而\
  \ `Channel` 接口仅提供通信所需的底层操作（例如 `read` 和 `write`）。尽管具体的通道工厂几乎肯定会有特定于 socket 的功能，但\
  \ `Channel` 接口本身（理想情况下）将完全隐藏任何关于特定实现选择的迹象。\n\n![](img/fig3-120.jpg)\n\n**图 3-120：分层与横向传输架构的对比**\n\
  \n我们有时在组件/类图中中使用下划线（此处所示）来表示一个类是*抽象的*。\n\n[图 3-121] 显示了一个简单的请求/响应服务器类的实现。在这个简单而不足道的插图中，服务器记录了构造函数时提供的可修改的\
  \ `xyza::Channel`（[图 3-121a]）对象的（其地址）。一旦启动，服务器（[图 3-121b]）将继续使用持有的 `Channel` 无限期地响应查询（直到发生错误或中断）。在循环的每次迭代中，都会调用\
  \ `Channel` 对象的 `read` 方法，该方法会阻塞控制线程，直到通道上收到下一个（固定长度的）请求。然后服务器通过 `generateResponse`\
  \ 函数（定义未显示）处理此请求，该函数将（固定长度的）结果放入输出缓冲区。最后，调用持有的通道的 `write` 方法将计算出的结果传回客户端——所有这一切在*逻辑上*都独立于通道的具体实现，也独立于客户端连接建立的任何细节。\n\
  \n![](img/fig3-121a.jpg) ![](img/fig3-121b.jpg)\n\n**图 3-121：构造时获取已连接的 `xyza::Channel`\
  \ 的简单服务器**\n\n从纯粹*逻辑*可用性角度来看，这种分层实现是有效的。[图 3-122] 说明了使用该服务器需要什么。首先，我们创建一个具体的 `ChannelFactory`\
  \ 实例。然后，我们配置工厂生成适当的连接。接下来，我们获取连接并检查状态。如果没有遇到错误，我们将该连接的有效地址传递给服务器的构造函数。现在，服务器启动并继续在该通道上处理请求，直到收到来自客户端的*中断*或*关闭*请求，此时服务器将控制权交还给其调用者（即\
  \ `main`）。最后，我们不是销毁通道，而是将其正确释放回分配给它的工厂（见第二卷，第 4.8 节），进程结束。请注意，本段的剩余部分写作风格类似于我们经常用于组件级用例示例的风格（见第二卷，第\
  \ 6.16 节）。\n\n![](img/fig3-122.jpg)\n\n**图 3-122：使用具体工厂实例化 `MyServer`**\n\n尽管[图\
  \ 3-120a]的分层设计是模块化的并完全封装了实现细节，但其逻辑和物理划分仍令人不尽人意。从逻辑角度来看，`MyServer` 类接收参数为基于 socket\
  \ 的具体 `Channel` 类型对象的（地址），因此 `MyServer` 被绑定到了该传输技术。更改技术（例如改为共享内存或某些第三方产品）将需要更改（1）库组件\
  \ `xyza_channel`（这是一个非常坏的主意），或（2）`MyServer` 应用类（也不好）。如果服务器本身是某些可用库的一部分，我们将面临更大的问题。从物理角度来看，类\
  \ `MyServer` 静态依赖于重量级的操作系统级传输技术。这种逻辑和物理耦合是不恰当的，也是没有必要的。\n\n解决这个问题有几种方法。考虑到近期泛型编程特别是基于策略的设计的趋势，将（模板化的）服务器按传输策略参数化似乎是明智的。也就是说，不再将服务器链接到任何一种传输，而是根据构造时传入的通道类型对服务器进行参数化。因此，服务器将在\
  \ `main` 中（在编译时）配置适当的传输技术。根据服务器的复杂性、通道 `read` 和 `write` 方法上允许的运行时开销、编译器技术水平以及服务器本身是否会作为接口类型广泛使用（见第二卷，第\
  \ 4.4 节），对整个具体的服务器类进行参数化*可能*是一个可行的方案（见第二卷第 6.3 和 6.4 节）。然而，与基于模板的解决方案相关的额外复杂性、开发工作量增加、互操作性降低以及非常紧密的编译时耦合在这里可能不会获得回报（见第二卷，第\
  \ 4.5 节）。依赖预处理器进行条件编译以提供替代形式的传输将是一个更糟的主意（见 [第 3.9.2 节]）。\n\n\n\n通常情况下，面向模板的解决方案在规模较小时效果最好。对于较大的子系统（例如真实的应用程序服务器），我们几乎总是倾向于接口继承提供的显式结构和更松散（通常是链接时的）耦合。图\
  \ 3-120b 展示了这种替代的、更*横向*的设计，其中显式命名的 `SocketChannelFactory` 生成自己的组件私有的（第 2.7.1 节）具体通道类型，该类型派自现在（纯抽象的）*协议*\
  \ `Channel` 基类。具体通道工厂的公共接口现在只生成并接受这种*协议* `Channel` 类型的实例。`MyServer` 类现在在构造时将接收一个类型派自新抽象\
  \ `Channel` 协议的参数。由于原始具体通道的接口（图 3-121a）完全封装并隐藏了其实现细节，因此图 3-123 所示的 `xyza::Channel`\
  \ 抽象版本可以具有几乎相同的逻辑接口（此处是双关）。事实上，图 3-122 使用模型的唯一变化是，我们在 `MyServer` 中将特定技术的具体 `Channel`\
  \ 类的使用替换为了更通用、与技术无关的 `Channel` 协议。\n\n![](img/fig3-123.jpg)\n\n**图 3-123：与图 3-121a\
  \ 等效的抽象 `xyza::Channel` 接口**\n\n通过图 3-120b 的横向设计，定义 `MyServer` 的组件不再在物理上依赖于通信通道实现的任何方面，而仅依赖于双向可重用的抽象\
  \ `xyza::Channel` *协议*类中的显式合约（第 1.7.5 节）；另参见第二卷第 4.7、5.7 和 6.17 节。\n\n现在将服务器从应用程序包（第\
  \ 2.13 节）降级为库包是可能的，它在其中也可以被重用。图 3-124 展示了同一个 `Server` 类如何在三个不同的应用程序中使用：一个配置为套字，另一个配置为共享内存，第三个配置为使用第三方产品（例如\
  \ MQSeries），这次是仅通过一个简单的应用程序级*适配器*类实现的，该类以后可能会被制成可重用的工厂。在时分复用或多线程环境中，我们可以轻松地在同一个进程中让多个不同传输技术的\
  \ `Server` 实例运行（参见第 3.9.2 节）。\n\n![](img/fig3-124.jpg)\n\n**图 3-124：使用各种技术重用 `Server`**\n\
  \n### 3.9 确保物理互操作性\n\n我们现在简要转向物理关注。避免物理实体之间的循环依赖是如此紧迫，以至于我们将其提升到了设计状态（第 2.6 节）；另参见第二卷第\
  \ 5.5 节。在接下来，我们将详细阐述这些每个问题以及从属组件的使用（第 2.7.5 节）。3.9.1 阻碍分层重用是一个坏主意\n\n我们开发软件的永恒目标始终应该是通过最大化物理互操作性来促进分层重用。\n\
  \n**指南**\n\n尽量减少在给定程序中使用某个组件可能会限制或排除 (1) 其自身的重用，或 (2) 该程序内某些*其他*组件的使用的情况。\n\n该指南的第一部分针对的是使用条件编译或选择性链接来定制组件源代码的（误用）。这种滥用意味着易于使用的软件（为某一个目的配置）并不一定可以被重用（为另一个目的配置）。随意使用单例模式以及全局或静态变量是其他无意中破坏进程内组件重用的常用手段。\n\
  \n该指南的第二部分是指出具有“自私”或“自我”倾向的物理模块，这些模块的使用可能与其同类的模块不兼容。这种自私是由更改全局属性的组件、为了实现逻辑封装而需要隐藏头文件的子系统，以及不可移植（或依赖于其他不可移植\
  \ UOR）的 UOR 所引发的。\n\n### 3.9.2 在特定领域使用条件编译是一个坏主意\n\n**指南**\n\n避免对组件使用特定领域的条件编译。\n\
  \n\n\n\n按照最初的设计，这些交易所适配器运行在大型系统中的独立进程中，并通过进程间通信链接进行连接。在这种配置下，实现“交易所-X 适配器”子系统的代码永远不会与实现例如“交易所-Y\
  \ 适配器”的代码位于同一个可执行文件中。此外，这些系统非常相似，但在许多微小方面又有细微差别，这些差异贯穿于整个代码库。在这种情况下，人们可能会忍不住通过“重构”问题来解决它，即创建一个定义“通用”适配器的单一代码块，然后使用编译时开关来“调整”行为以符合特定的交易所，如图\
  \ 3-126 所示（这是一个糟糕的主意）。\n\n![](img/fig3-126.jpg)\n\n**图 3-126：条件编译的特定领域用法（一个糟糕的主意）**\n\
  \n在讨论这种方法的中心问题之前，请注意我们已经将行为从语言领域移出，并推到了构建脚本中。我们无法再在单个线性测试驱动程序内部描述我们的测试策略，而是必须与构建系统协作，创建许多不同的版本，这些版本会在不同的应用程序之间切换。保持一致的、独立于领域的物理形式（章节\
  \ 0.7）大部分收益消失了。此外，这种对条件编译的使用违背了开闭原则（章节 0.5），因为扩展该系统以新交易所的唯一方法是修改生产源码^(195)。\n\n\
  ^(195) 虽然与特定客户端绑定的运行时条件语句（例如通过配置文件控制）并不一定像客户端特有的条件编译那样阻止组件在单个程序内进行并排复用，但它们会对稳定性产生负面影响，通常维护成本极高，因此仅适用于应用程序层。\n\
  \n然而，像图 3-126 中这种设计的真正问题在于，同一个进程中两个具有相同名称但以某种方式构建方式不同的逻辑实体之间固有的不兼容性。例如，假设确定了如果我们重新架构系统的顶层，使用线程而不是进程来驱动交易引擎及其卫星适配器，我们就能获得显著的性能提升。为了完成这项任务，我们需要将所有不同的适配器链接到单个进程中，这在目前的实现策略下显然是不可能的。我们现在需要去“取消重构”每个交易所适配器，这可能导致大量的代码重复，而这正是我们起初想要避免的。\n\
  \n在这里使用模板化的实现策略（templated implementation policies）初看之下似乎是一个合理的替代方案，因为现在每个适配器的名称虽然难读到无法发音，但至少是唯一的。然而事实证明，所需的策略数量以及随着每个新交易所添加新策略的持续需求，几乎肯定会让任何对该设计模式的浅显应用变得不可行。此外，我们从实现标准容器中得知，彻底测试这种基于策略设计的成本会随着每个新策略的添加而呈组合级增长。在这里尝试任何此类基于模板的框架方法都将是完全无法行的，而且是一场灾难的配方。\n\
  \n一个确定的、长期实用解决方案（图 3-127）是将“交易所适配器”的集合实现重构为细粒度的组件层次结构，并为每个新交易所创建一个单一类型来专门处理它（而不处理其他）。就像不同的具体输出设备一样（参见图\
  \ 0-29、章节 0.5）所示，每个具体的交易所适配器的实现将派生自一个公共接口。此外，如图 3-127 所示，每个具体的适配器将始终层叠在一起，并根据情况与其他适配器共享通用的层级可复用（章节\
  \ 0.4）子实现。\n\n![](img/fig3-127.jpg)\n\n**图 3-127：单进程（线程兼容）的交易所适配器实现**\n\n注意，通过我们更具横向的设计（章节\
  \ 3.7.5），添加新的交易所适配器不需要对现有适配器产生任何影响！此外，由于交易所适配器必须与其服务的交易所保持同步，这些组件属于可塑软件（章节 0.5）的。然而，通过这种设计的重构，我们可以在不影响任何其他代码的情况下保持与某个交易所的兼容性。此外，可塑的代码在物理层次中处于非常高水平的维护。因此，这种物理重构的架构不仅更灵活而且更稳定，使其维护变得更容易且风险更小。\n\
  \n条件编译本身并不是这里的反派。当底层平台差异巨大（例如 Windows 之于 Unix 套接字、线程等），到至于一个平台上的语法在另一个平台上无法编译的程度时，条件编译可能是我们唯一的选择。但请注意，这种对条件编译的使用不是基于客户端实施的“策略”，而是基于底层编译器、操作系统或硬件实施的“特征”。由于这些平台级特征对于所有可能参与给定进程的实体都是真实的，因此不存在不一致的风险^(196)。\n\
  \n^(196) 当然，我们更倾向于将此类平台相关问题（例如首选套接字句柄、字节序或表示 64 位整数的相应类型（参见图 3-108、章节 3.6.3））以细粒度的方式在物理层次尽可能低的上隔离。\n\
  \n#### 3.9.3 库组件中使用特定应用程序依赖是一个糟糕的主意\n\n**指南**\n\n**避免在复用库组件中使用特定应用程序依赖。**\n\n在我们方法中，UOR（章节\
  \ 2.2.4）的架构依赖是绝对的。也就是说，一个 UOR 允许依赖的 UOR 是该 UOR 本身的属性，与其客户端无关（章节 2.8.1 和 2.9.1）。然而，从组织角度来看，最终进入可执行文件的实际对象代码将取决于部署产物的粒度以及涉及的特定技术（章节\
  \ 2.15）。允许使用构建依赖来为特定客户端定制库功能，将再次把我们逻辑架构的复杂性推向不属于它的构建系统中。此外，这样做很容易阻止组件在单个进程内被复用。\n\
  \n\n\n例如，考虑一个类似于定价引擎的子系统，它根据嵌入在模块化“卡匣”（例如，一个 `.o` 文件）中的定价模型来执行其功能。该卡匣具有定义的二进制接口，但其实现会根据具体的定价模型而异。图\
  \ 3-128a 展示了这种方法：每个定价模块的逻辑名称相同，而适当的实现由构建系统决定。这种方法确保了在任何一个程序中，`PricingEngine` 类只能使用一个\
  \ `PricingModel`（这是一个坏主意）。相反，如果我们让 `PricingModel` 成为一个抽象接口（图 3-128b），则每个客户端都可以自由地提供自己命名的模型，而不受进程中其他\
  \ `PricingEngine` 客户端的影响。\n\n请记住，调用定价引擎函数时所完成的核心工作是大量的，这正是我们最初能够依赖链接时绑定到 `.o` 文件的原因。如果情况并非如此，另一种可能性是将每个模型表示为具体类型的对象，并受“定价模型”概念（第\
  \ 1.7.6 节\n\n**图 3-128：为特定客户端配置库子系统**\n\n### 3.9.4 限制并存复用是一个坏主意\n\n**指南**\n\n**避免人为限制复用的逻辑构建结构或模式。**\n\
  \n显然，这种避免人为限制复用模式的策略比前两种策略更温和且更具主观性。这里的意图是避免任何不必要限制单个进程中多个客户端使用的设计策略。为了说明起，考虑一个实现\
  \ IPC 注册表的组件，其目的是跟踪当前进程与其他进程之间的打开连接。我们没有将此注册表设计为某个类的对象，而是最初将其设计为实现不可实例化（“工具型”）类的单一组件，该类仅有\
  \ `static` 方法和 `static` 数据。如果以后我们决定每个线程一个注册表是一个好主意，那么该组件对于该目的将毫无用处。\n\n很多时候，当我们认为只需要某某物的一个时，很快就会发现有两个或三个会有用。因此，实现此单例的另一种方法是将注册表本身设计为普通的、可实例化的类，然后在单独的组件中实现单例模式，提供该注册表的对象作为指定的、进程范围内的、全局可访问的资源。注册表类型本身现在新的上下文中完全是复用的。此外，如果我们以后决定通过多个单例暴露注册表对象以满足不同的应用需求是有用的——例如，不同类型的进程注册表——那么无论注册表还是原始的单例组件都不需要更改。\n\
  \n这一重要观察提醒了我们在单例模式方面预先进行细粒度实现拆分（见第二卷第 6.4 节）的好处，这被归功 Bloomberg LP 的 Steve Downey，这是他在开发现在成为\
  \ ball logger 的初始版本（约 2007 年）时提出的，该工具位于 Bloomberg 开源 BDE 库的 `bal` 包组（bde14，子目录 `/groups/bal/ball/`）。\n\
  \n例如，我们有两个单例内存分配器——一个用于默认对象内存分配，另一个用于默认全局内存分配——它们本质上执行相同的功能，但提供的是相同（协议）基类的（不同 distinct\
  \ 的）对象的地址（见第二卷第 4.10 节）。\n\n### 3.9.5 防止蓄意误用不是一个目标\n\n**指南**\n\n**设计软件以防止意外误用，而不是为了防止欺诈。**\n\
  \n这种“可复用”单例策略的唯一缺点——即一个任性的客户端可能会创建一个伪造的注册表并在随后被误用——其影响并不大：这种行为将是故意的（即：蓄意的欺诈，而不仅仅是无辜的错误）。C++\
  \ 良好的接口设计目标必须防止意外，而不是欺诈：试图实现后者会混淆设计，限制复用，并最终无法完全成功。\n\n例如，参见 lakos96 第 3.6 节。关于不要浪费开发周期来防御区域内误用的建议是非常重要的，不应轻视。同时，这种可靠的建议不应与（可选的）防御受信任客户端的意外误用混淆（见第二卷第\
  \ 5 节）。在任何情况下，正确管理相互依赖单例的生命周期（而不泄露资源）是一项非凡的事，需要显式的全进程范围协调。对于特别复杂（且有趣）的单例设计，请参见 alexrescu01\
  \ 第 6 节。\n\n### 3.9.6 从库组件中夺取全局资源是一个坏主意\n\n**指南**\n\n**避免在定义 main 的文件之外定义全局实体。**\n\
  \n程序中的任何全局构造结构都只能有一个定义。例如，当一个文件包含 `main` 时，它在整个程序中必然是唯一的；因此，在那个处进行某些全局优化（例如在该处重新定义全局运算符\
  \ `new` 和 `delete`，特别是在测试驱动程序中）可能是可以的（但在在此之前，请参见第二卷第 4.10 节）。如果两个尝试重新定义相同全局实体的组件被拉入同一个可执行文件，结果将导致是编译或链接时的错误，或者更糟，是一个格式错误的程序。通过要求任何此类全局重定义仅发生在定义\
  \ `main` 的翻译单元中，我们确保了一个唯一的、进程范围内的仲裁点。\n\n从库组件中安装全局回调函数（例如 `new` 句柄）意味着另一个执行相同操作的组件在同一个程序中无法可靠地使用而不产生潜在冲突。同样，对\
  \ `std::cout` 的默认设置进行更改，如果涉及多个依赖于这些特性的组件，也可能产生冲突的副作用。作为一个具体的例子，考虑一个 `Date` 类型，它重载了\
  \ `operator<<` 来打印它的三个显著属性：年、月、日（见第二卷第 4.1 节）。假设一个想要在列中左对齐此输出的对象设置了流标志（全局变量的形式）来这样做。现在，除非日期足够“智能”以便在打印到输出流之前先将其三个字段格式化到临时缓冲区，否则只有第一个字段将左对齐。（我们犯过这个错误，并假设其他人也犯过。）\n\
  \n\n\n最后，我们通常希望避免在库组件内部修改任何全局变量的值。遵循这一做法也有助于确保线程安全（见第二卷卷第 6.1 节），因为对全局值的任何更改都可以在启动任何额外线程*之前*（通过\
  \ `main` 函数）完成。\n\n### 3.9.7 隐藏头文件以实现逻辑封装是一个糟糕的主意\n\n#### 准则\n**避免为了逻辑封装而隐藏头文件。**\n\
  \n回想一下第 3.1.10.6 节中提到的，为跨越多个组件的子系统创建一个有效的封装器（wrapper）并非易事。有时，可能会有一种诱惑，只需只需隐藏低级组件的定义来实现某种比组件更广泛的逻辑封装概念。例如，回想\
  \ `my::Date` 和 `my::TimeSeries` 这对类（参阅图 3-6、第 3.1.10.6 节），它们分别封装了一对相互作用的低级类 `bdlt::Date`\
  \ 和 `odet::DateSequence`。将这两个封装类放在同一个组件中（参阅图 3-6b）将允许 `my::Date` 类通过友元（friendship）授予\
  \ `my::TimeSeries` 直接（私有）访问其内部数据的权限，但这会导致逻辑/物理名称内聚（第 2.4 节）。\n\n假设我们最终决定将这两个封装类放在不同的组件中，如图\
  \ 3-129a 所示，但如图 3-129b 所示，暴露 `my::Date` 中底层的 `bdlt::Date` 数据成员。那么，为了确保 `my::Date`\
  \ 的外部客户端不利用这一信息，我们特意不向 `my::TimeSeries` 的外部客户端导出低级的 `bdlt_date.h` 头文件。\n\n![](img/fig3-129.jpg)\n\
  \n**图 3-129：隐藏头文件以实现封装（糟糕的主意）**\n\n尝试为了将逻辑封装单元扩展到单个组件之外而选择性地隐藏头文件，可能会限制同级子系统的并排重用^(203)。例如，假设其他人创建了一个名为\
  \ `your::OtherSubsystem` 的子系统，它是定义 `my::Date` 的 UOR（单元整体）的同级系统。进一步假设该另一个子系统在其接口中合法地使用了\
  \ `bdlt::Date`。现在假设 `my::TimeSeries` 的客户端 `SomeClient` 决定它也想使用 `your::OtherSubsystem`，如图\
  \ 3-130 所示。如果 `bdlt::Date` 不可用，那么这个 `my::TimeSeries` 的客户端将无法无法使用 `your::OtherSubsystem`。另一方面，如果将\
  \ `bdlt::Date` 提供给 `SomeClient`，它将在那种（令人不可接受的）基于部署的逻辑封装尝试中产生一个漏洞，而这种尝试是通过隐藏在 `my::Date`\
  \ 构思合理的接口中暴露的可重用 `bdlt::Date` 数据成员来实现的。\n\n^(203) 参见**lakos96**，第 5.10 节，第 312–324\
  \ 页，特别是图 5-96，第 317 页。\n\n![](img/fig3-130.jpg)\n\n**图 3-130：由于隐藏头文件导致同级子系统不兼容**\n\
  \n还有其他原因导致尝试隐藏头文件是不实际的。如果不提供封装类型的头文件，封装组件将无法在其头文件中实质性地使用这些类型（例如作为嵌入数据成员或在内联函数的体内）。在仅需要封装（第\
  \ 3.5.10 节）时，强加为了实现*隔离*所需的严苛内部约束（参阅第 3.11.6.1 节）可能是完全不恰当的。此外，由于无法访问源代码，外部客户端（更不用说静态分析工具）也会发现调试更加困难。\n\
  \n此外，将部署策略与子系统的逻辑架构分离（并与部署发布正交）（第 2.15 节）本身就是我们方法论整体封装结构的巨大优势之一（第 2 章）。请注意，由于*特定部署的构建优化*，纯粹为了针对特定部署进行构建优化而审慎地选择不导出某些组件的头文件是允许的，只要架构中没有排除它们在其他/未来的部署中同时导出。另见第\
  \ 3.5.10.11 节。\n\n### 3.9.8 在重用库中依赖不可移植的软件是一个糟糕的主意\n\n#### 准则\n**最小化并隔离不可移植软件的创建和使用。**\n\
  \n最大化可移植性是成功重用的核心。任何库软件可以证明运行的平台必须是其自身能力以及它（直接或间接）依赖的所有平台能力的交集。例如，如果一个 UOR 已通过可以在所有\
  \ Sun 平台上运行，而另一个 UOR 只能在 Windows 平台上运行，那么任何尝试同时依赖这两者的应用程序都无法保证在任何地方运行！也就是说，由于缺乏可移植性，对一个库的使用阻止了在同一进程中使用另一个库。\n\
  \n对于任何给定的应用程序，可重用的软件由其必须执行的平台决定。如果一个应用程序预计在所有支持的平台上运行，那么允许它仅依赖于已通过并在所有支持的平台上运行的软件是必要的，但并不完全足够。应用程序还必须确保不使用任何无法（可能无法）方便（及时）移植到任何可能突然需要支持的新平台的软件。“支持平台”的概念是我们元数据的一部分，即能力（capabilities）或\
  \ `.cap` 文件（第 2.16.2 节）。\n\n可移植性是我们发现经常被低估的质量维度。我们快速响应新编译器和硬件的能力是我们创建私有基础设施的重要部分。除了可能在多个平台上运行的客户端外，一个组织可能希望对于平台完全由我们控制的后端服务也有以下几个原因：\n\
  \n*   使用多个编译器以更好地符合语言标准。\n*   避免被任何一个平台供应商质持。\n*   方便未来迁移到更好的编译器/硬件。\n*   能够在运行时提供硬件容错。\n\
  \n即使决定目前仅在单个平台上运行，确保代码具有可移植性通常也会提高其质量^(204)，同时保持我们的选择空间。我们通常避免针对某个特定平台优化代码，除非在那些极少数专门化产生可衡量且所需的改进的地方。而且，当我们确实创建特定平台的定制时（例如，参阅图\
  \ 3-108、第 3.6.3 节），我们尝试将代码隔离在*粒度细的*（第 0.4 节）低级平台兼容层中，或者至少在原处清晰地标记。\n\n^(204) 参见**kernighan99**，第\
  \ 8 章，第 189–213 页，特别是第 189 页。\n\n\n\n在所有其他情况下，我们的目标是实现在整体上自然运行得最好的实现和优化。图 3-131a\
  \ 展示了我们如何通过保持在语言定义范围内来简单地回避非可移植性^(205)。如果由于某种原因，我们需要获取当前平台上 `int` 类型最高位字节地址的值，我们倾向于一次性提炼出依赖于平台（编译时）的“字节序”概念，而不是在基础设施中每个可能相关的地方都重复提炼（图\
  \ 3-131b）。\n\n^(205) 注意，以下代码：\n\n```\na[i] = i++;\n```\n\n和\n\n```\na[i++] = i;\n\
  ```\n\n都不仅是不不可移植性，而且实际上具有`language`（或 `hard`）定义的未定义行为（UB），这意味着在技术上几乎可以发生任何情况；参见卷\
  \ II，第 5.2 节。特别是，无法保证这两个语句的副作用顺序将是一致的——即使在给定平台的同一个程序中也是如此。\n\n![](img/fig3-131.jpg)\n\
  \n**图 3-131：确保代码级可移植性**\n\n在更高层次上，通过在尽可能低的上提供统一的语法，将不同平台上的共同能力汇起来是非常具有吸引力的。例如，Unix\
  \ 平台上的“可移植”线程模型多年以来一直是 `pthreads`（图 3-132a）。类似的功能在 Windows 平台上也原生可用，但具有完全不同的语法（图\
  \ 3-132b）。通过精心设计，可以创建轻量级的封装器，提供足够的通用功能，同时拥有一种可以在几乎所有平台上高效运行（即开销很少或没有开销）的单一语法（图 3-132c）。^(206,207)\n\
  \n^(206) 在 21 世纪 20 年代，有一个开源项目为 Windows 平台创建一个可移植的 `pthreads` 实现。尽管线程的基本支持从 C++11\
  \ 开始一直是标准的一部分，但 C++ 标准委员会继续逐步完善对 C++ 内部更高级并发构造的统一支持。\n\n^(207) 注意，选择在解锁后发送信号是刻意为之；参见卷\
  \ II，第 6.1 节。\n\n![](img/fig3-132.jpg)\n\n**图 3-132：实现具体的解决方案级可移植性**\n\n一旦解决方案领域达到某种抽象水平，使其跨接口边界的性能不再需要紧密的编译时耦合，我们就重新获得了采用更多横向架构的机会（节\
  \ 3.7.5）。通过使用抽象接口，应用开发人员现在可以选择在那个更高的逻辑抽象层上，交换复杂接口的高度调优的、平台特定的实现。这种平台特定的代码被刻意在物理上与核心可重用库隔离（参见节\
  \ 3.11.5.3）。如图 3-133 所示，大型可重用库子系统（此处简单表示为 `TheServer`）可以自定义为在 Windows 或 Unix 平台上以优方式运行，而不影响单行库代码。\n\
  \n![](img/fig3-133.jpg)\n\n**图 3-133：实现抽象的解决方案级可移植性**\n\n### 3.9.9 隐藏潜在可重用的软件是一个坏主意\n\
  \n**指南**\n\n**最小化对包局部（私有）组件的需求。**\n\n回想一下节 2.7.5，我们对组件文件名的双下划线命名约定。该约定的目的是允许我们指示从属组件，这些组件包含逻辑结构，这些结构不打算从声明它们的包之外的其他组件直接使用。然而，这种表示法更进了一，坚持一个包内只允许一个“公共”组件引用任何特定的此类\
  \ `package-local` 组件。这种看似任意的额外限制是刻意的，且理由充分。\n\n从属组件的一个重要主要用途是将实质性类的模板特化提炼到单独的、并行的\
  \ `.h / .cpp` 文件对中。在那种用模型中，只有一个“公共”组件包含通用模板，以及任意数量的包含特化样的子组件。只有包含通用模板的组件才设计供直接使用，且仅该组件允许直接\
  \ `#include` 其他从属组件的头文件。当我们考虑部分模板特化时，允许一个包局部依赖树是很有用的，但它仍然根植于单一的公共组件。因此，对于所有`预期`目的，该约定仅提供了所需的内容，没有任何多余。\n\
  \n将组件设为包私有的其他可能动机是允许其接口具有较弱的封装性，使其行为更具可变性。我们对这种表示法的用法并不认同。我们的通用方法是通过提炼为大致单个组件大小的稳定设计单元来促进重用。惯性地隐藏包内不面向客户端的组件意味着包外部没人会知道“内部”组件。换句话说，项目外部任何需要类似功能的人都被迫重写、从头开始编写并不可避免地以不同的方式编写。系统性、广泛使用局部组件仅为了限制意外使用，实际上限制了重用^(208)。\n\
  \n^(208) 在 C++11 及以后使用 `final` 几乎从是不合适的，正是出于这种无限制限制层次重用的原因（节 0.4）；参见[lakos21,第 3\
  \ 章，“危险”特征。\n\n允许组件仅本地访问会促使将包而非组件作为设计和测试^(209)。隐藏组件意味着在设计其具有通用性方面投入的准备工作较少。其使用的局限性减少了对其预期行为进行封装和文档化的感知需求。更改局部组件的愿望会导致此类组件的彻底测试变得极其昂贵，反过来影响整个包的稳定性和正确性。我们认为组件代表了一个实用的层次，在该层次上，可以通过单个测试驱动文件通过回归测试来设计、验证和保护协调的功能（参见卷\
  \ III，第 7.5 节）。即使从包级边界实现类似的成功也是可疑的（参见卷 III，第 7.3 节）。\n\n^(209) 通过包级“访问”来提供额外逻辑封装层的概念并不新鲜。例如，Java\
  \ 的默认访问权限是包范围。按照我们的方法论，Java 中的包定义与我们对 C++ 包的概念相似，即为一组 Java 组件的单一目录，每个 Java 组件由单个\
  \ `.java` 文件以及一个*刻意*分开的、关联的 `_t.java` 测试驱动文件组成。\n\n\n\n\n\n我们意识到，自然会有某些时刻，组件中定义的“公共”\
  \ `class` 与其一个或多个子类之间的接口可能确实需要随着时间的推移而演变。`class`（相对于 `component`）命名的 节节 2.7.3 额外下划线（`extra-underscore`）约定正是为了解决这种可塑性问题，通过将带有额外下划线的\
  \ `class` 的使用限制在定义它的组件内部（节节 2.7.1）。尽管如此，人们存在一种扭曲的诱惑，想要将本该稳定的公共类变为私有，以减少设计、文档化和完全测试它们所需的额外精力。除非有真正的稳定性考量，否则将类设为组件私有无疑是短视的，任何这种想法都应该被抑制。因此，存在一个隐含的（有些人可能认为是不切实际的）预期，即每个组件从一开始就应该设计良好：\n\
  \n> 即使在经过最深思熟虑和重构的系统中，由于新信息的出现，公共组件和函数仍然需要被拆分。开发者应该做好进行此类重构的准备。\n>\n> — David Sankel\
  \ (c. 2018)^(210)\n\n^(210) 出自一次私人邮件讨论\n\n鉴于我们以某种方式愿意允许包本地组件（package-local components），将它们的使用限制在包的单个“公共”组件上可以从很大程度上缓解其感知风险。该组件是私有的，可能是因为它是一个实现细节和/或意上是可塑的。回想\
  \ 节节 0.5 节`malleable`（可塑的）软件是不可复用的。允许两个公共的可复用组件依赖于同一个可塑软件，意味着为了其中一个组件而进行的更改可能会不利地影响另一个组件。因此，可塑的代码通常不适合共享——即使是在同一个包内的两个组件之间。\n\
  \n然而，至少有一个已知的用例，允许将包的逻辑结构的任意子集指定为给定包的本地内容。考虑 图 3-99，节节 3.5.10.8 节，其中一个活跃开发中的子系统的稳定“视图”被呈现给客户端使用。在这种方法中，我们使用了渐进式封装层化技术的极端形式来模拟多组件封装器的效果（参见图\
  \ 3-6，节节 3.1.10.6 节）。如果我们的目标是从客户端完全封装并隐藏 `all` 底层实现，这种方法是有效的。\n\n现在假设我们正在开发一个子系统，我们希望客户端尽早某些部分，但我们导出的某些类型是\
  \ `vocabulary` 类型（见卷 II，节 4.4），这些类型不能被封装。也就是说，我们希望封装器中暴露的任何类型集与底层子系统中相同的（相同的）C++\
  \ 类型。在这种情况下，除了单一的单体封装组件外，提供现有系统这种细粒度视图的唯一可行方法是使用 C 风格的过程化接口，它由一组 C 风格（自由）函数组成，这些函数共同使得\
  \ C 程序也能对 C++ 子系统操作（参见节节 3.11.7.12 节）。使用过程化接口的优势还允许选择性地掩盖类型的单个成员，从而对暴露和不暴露的内容实现更细粒度的控制。(211)\n\
  \n^(211) C++ 标准委员会在 2017 年 7 月的会议上投票正式承认 `modules` 为一项技术规范（TS），以便最终可能纳入 C++ 语言本身。模块的目标之一最初受极大缩短编译时间的承诺驱动，现在——在我们的要求下（**lakos17a**）——也包括实质性的架构属性，例如对现有子系统的细粒度“视图”的加法（非侵入性）支持，同时保留底层（包括导入的）类型的相同性（正如今天过程化接口的情况），并消除由于传递包含而导致的脆弱性（节节\
  \ 2.6 节）。现在模块被采纳到语言中，我们仍然担心模块接口下的合理设计可能被忽视，因为设计糟糕且因此频繁更新的抽象不需要暴露给客户端，这导致了与包私有组件或组件私有类可能类似的层级复用损失。\n\
  \n承认，要求细粒度封装是一项额外的设计限制，但它带来的回报将充分补偿我们为实现它而付出的额外精力。支持更广泛使用包本地组件的短中期收益，与我们通过分级复用实现的长期稳定状态下的最大生产力目标直接背道而驰。同时，通过深思熟虑地限制（整个）包之间的依赖关系，可以在不损失规模的情况下实现较大封装单元的大部分益处。实施这种高层策略确实需要全公司的项目管理，我们认为这是一个真正好的主意。\n\
  \n### 3.9.10 节总结\n\n总结一下：本节的主要目标是鼓励我们通过确保每个组件的设计都不会限制对——任何其他——组件的额外使用（或复用），来最大化物理互操作性。实现这一目标不仅仅是一个良好的策略。正如坚持精细分级的物理设计原子单元（节节\
  \ 0.7 节）一样，实现物理互操作性对于实现分级复用（节节 0.4 节）以及我们基于库的应用开发的总体方法（节 0.8–0.12))）至关重要。如果物理互操作性仅仅是一种策略，那么它也是非常重要的策略。关于从纯逻辑角度看互操作性的更多信息，请参见卷\
  \ II 节 4.4。\n\n### 3.10 避免不必要的编译时依赖\n\n物理依赖可能出现在编译时、链接时或两者都有。从纯逻辑角度进行设计时，很容易忽略此类问题，因为这种物理耦合何时发生在逻辑上没有影响。然而，从实际工程的角度来看，了解这种区别是重要的：过度的编译时耦合会严重阻碍我们维护软件的能力。\n\
  \n#### 3.10.1 封装并不排除编译时耦合\n\n位于组件物理接口（例如 `.h` 文件）中的、在程序上无法访问的“封装”实现细节，通常无法在不强制要求该组件的所有客户端重新编译的情况下进行修改。对于即使是中等规模的软件项目，重新编译整个系统的代的^([212)将抑制对低级（或其他被广泛使用的）组件物理接口的修改，限制了我们对其实现细节进行即使是微小更改的能力。\n\
  \n^(212) 在历史上，这种成本体现在墙上时间上，但对于更大的系统，也许用功耗来表达更合适。\n\n\n\n\n\n作为一个介绍性示例，考虑图 3-134a\
  \ 所示的用于 `my_dstack` 组件的头文件。`Dstack` 类的逻辑接口完全`封装`（encapsulates）了其实现。也就是说，`Dstack`\
  \ 的客户端无法通过编程方式访问其基于数组的实现的任何部分，因为这样做将排除掉相同接口的基于列表的实现（图 3-134b）。^(213)\n\n^(213) 即使是完全封装，并非所有“合规”的\
  \ `Dstack` 实现都可以相互替换（参见第二卷第 5.5 节）。我们至少有几种编程方法可以尝试测量`观测行为`（observable behavior）的潜在差异，例如：\n\
  \n1. 使用 `sizeof` 运算符推断左侧的 `Dstack` 实现（图 3-134a）的占用空间大于右侧的（图 3-134b）。\n\n2. 重定义全局运算符\
  \ `new`（在根据第 3.8 节 定义 `main` 的组件中），以帮助我们监控响应 `Dstack` 对象特定操作的内存请求序列。（关于支持特定对象自定义内存分配的接口，请参见第二卷第\
  \ 4.10 节。）\n\n3. 继续向 `Dstack` 推入值，直到所有可用内存耗尽（这两个栈实现在任何特定平台上极不可能具有相同的最大最终容量，因为基于列表的实现通常每个元素会使用两到三倍的空间）。\n\
  \n4. 创建性能“压力测试”以查看哪一个运行时间（例如渐近运行时间）较低。请注意，在几乎任何（真实的）测试场景下，在任何现代计算机平台上，基于数组的实现都将（显著地）优于基于链表的实现（参见第二卷第\
  \ 6.7 节）。\n\n然而，此层次面的编程可观测行为差异通常仅通过使用白盒、组件级测试驱动程序体现（参见第三卷第 8.2 节），这通常不被视为对`封装`（encapsulation）的违反，除非合同（参见第二卷第\
  \ 5.2 节）专门将此类行为设定为`本质的`（参见 3.11.1 节）。\n\n![](img/fig3-134.jpg)\n\n**图 3-134：完全封装的\
  \ Dstack 接口**\n\n尽管 Dstack 的接口完全封装了两种实现，任何丰富的 C++ 程序员都能清楚地看到这两个组件不同的实现策略。这些头文件说明了即使使用封装接口，隐藏专有实现也存在困难。请注意，模板（参见第二卷第\
  \ 6.3 节）和 `inline` 函数（参见第二卷第 6.6 节）可能会向客户端暴露算法细节，从而加剧这种“安全漏洞”。^(214)\n\n^(214) 注意，C++\
  \ 特性集的设计并未将“隐蔽性安全”作为设计要求，因此我们不再在此详细阐述。\n\n保持组件实现专有的愿望通常不是大型项目的首要问题。客户端有权期望组件的逻辑接口不会改变，理想情况下，对组件逻辑实现的的任何更改都不应影响客户端。然而，实际上，C++\
  \ 编译器允许依赖头文件中的所有逻辑信息，包括私有数据。如果人类可以通过检查其头文件中的源代码（不包括注释）来确定组件的实现策略，那么当该组件的实现策略发生变化时，该组件的编程客户端可能被迫重新编译。\n\
  \n在其他条件相等的情况下，当仅发生实现（而非接口或行为）变化时强制客户端重新编译，并不是组件的理想物理属性。一个组件拥有的客户端越多，对这种具有如此紧密编译时耦合的组件进行实现更改就变得越发不可接受。未能完全将客户端`隔绝`（insulate）在广泛使用的组件的演进实现之外，会对大型项目的开发成本产生巨大影响。对（私有细节的）`隔离`（insulation）进行正式且彻底的处理——其属性与仅仅对（私有细节的）`封装`（encapsulation）属性形成鲜明对比——在\
  \ 3.11.1 节中再次引入。\n\n### 3.10.2 共享枚举与编译时耦合\n\n从历史上看，随时间变化缓慢的低级、广泛使用的枚举一直是产生不理想编译时耦合的隐性源头。尽管这并不明智，但在单个文件中（位于物理层级的底部）列出整个应用程序、系统或企业的所有错误状态代码并不罕见，如图\
  \ 3-135 所示。在开发早期，做出可能迫使处处重新编译的更改可能不会带来显著负担。这正是“煮水青蛙”的隐喻。^(215)\n\n^(215) hunt00,\
  \ 第 1 章, 第 3 节，第 7-9 页，特别是第 8 页\n\n![](img/fig3-135.jpg)\n\n**图 3-135：编译时耦合的隐性源头**\n\
  \n### 3.10.3 C++ 中的编译时耦合比 C 更普遍\n\n然而，随着系统超出初期，对底层头文件进行更改的想法缓慢而必然变得越来越令人厌恶。早晚，在添加新组件时，我们会受诱“重用”那些名称或描述可能仅大致准确的错误代码，而不是支付重新编译整个世界的巨大成本。一旦我们达到这一步，系统就变得不可维护了。^(216)\n\
  \n^(216) 另外，将特定的错误代码以某种方式耦合到单个函数、甚至一个类、更不用说整个组件层次级之外的想法完全是错误的（参见第二卷第 5.2 节）。\n\n\
  C++ 中的编译时耦合一直比 C 语言要大得多。典型的 C 头文件按比例要小得多，没有暴露 C++ 对应文件中常见的实现细节。C++ 支持的更细粒度的模块化设计（第\
  \ 1.4 节–2.16 节），并具有良好的定义的 UORs（第 2.2.3 节）。^(217)\n\n^(217) 注意，现代 C++ 模块功能完全没有解决与编译时耦合的问题，因为私有实现细节虽然不再被客户端直接使用，但仍需要每个客户端的编译器访问。因此，对这些暴露细节的任何更改仍将迫使客户端重新编译。\n\
  \n\n\n\n\n由于这种扩展的编译时耦合，单个 UOR（单元实现）的部署不能自发或按任意顺序发生，而是通常必须分阶段进行，通过每个物理层（从低到高）进行。这种更紧密的物理耦合和更正式的构建结构避免地减少了当系统底层非隔离实现部分（即位于头文件中的部分）必须更改时，我们快速响应的能力。在我们的整个\
  \ C++ 开发职业中，对编译时耦合与运行时性能之间的权衡进行主动评估将始终贯穿始终。\n\n### 3.10.4 避免不必要的编译时耦合\n\n假设我们已经决定系统的某个特定部分依赖另一个部分是合适的，那么这种依赖的精确性质有时对成功至关重要。为了说明我们应该以及如何避免不必要的编译时耦合，请考虑在图\
  \ 3-136 所示的（目前）激进简化的 `my::Pool` 类的 `allocate` 方法。在大多数情况下，该方法简单地分离出一个预先分配的配置字节数的块并返回它，其速度比更通用的分配策略快（见卷\
  \ II 第 4.10 节）。因此，`allocate` 方法被合理地声明为 `inline` 并定义在头文件中，以显著提高运行时性能（出于类似的原因，`deallocate`\
  \ 也是如此）。但其他方法呢？它们也应该被声明为 `inline` 吗？\n\n![](img/fig3-136a.jpg) ![](img/fig3-136b.jpg)\n\
  \n**图 3-136：`my_pool` 组件的物理接口**\n\n²¹⁸ 当然，在 C++11 及更高版本中，我们会将它们写成：\n\n点击此处查看代码图像\n\
  \n```\nPool(const Pool&) = delete;\n\nPool& operator=(const Pool&) = delete;\n```\n\
  \n²¹⁹ 注意，为了彻底测试，需要某种方法（无论多么缓慢或复杂）来确定（例如，通过基本访问器）所有与发生彻底测试发生相关的当前状态（见卷 III 第 10 章）。\n\
  \n当涉及性能时，某些人会惯性地 `inline` 眼目所可见的一切内容。另一些人则稍微理性得多，使用函数体的大小作为选择是否声明函数 `inline` 的唯一标准。对于小型项目，将函数声明为\
  \ `inline` 并定义在头文件中没有问题：机器有足够的资源来适应随之而来的“代码膨胀”，而且如果需要，整个程序可以在短时间内重新编译。然而，对于企业规模的软件，我们确实必须考虑代码膨胀，即使如此，如果我们想要调整的方法实现被“硬编码”到每个使用它的客户端中，这种问题与我们面临的真实问题相比也微不足道。\n\
  \n让我们从考虑不经常调用的访问器函数 `size()` 开始，它的定义在图 3-136 的底部。该方法的体只是一个返回 `d_size` 数据成员成员的单一语句。显然，在此处进行函数调用的空间开销大于简单的内存（或寄存器）访问。因此，如果此函数被声明为\
  \ `inline`，最终的可执行文件尺寸将更小。同样明显，如果调用 `size()` 的程序不需要忍受为了访问此数据而创建栈帧的负担，它的运行速度将更快。还要考虑客户端编译器由于对实现的可可见性，通常可以在头文件中定义的\
  \ `inline` 函数体边界之间执行更激进的优化，而这对于在 `.cpp` 文件中定义的常规函数则无法做到。\n\n然而，这个 `Pool` 类位于物理层级中的非常低级，它的头文件可能会广泛包含在整个代码库中。`size()`\
  \ 函数——如果被调用的话——并没有出现在任何性能关键路径中，因此没有理由去忍受将其实现为 `inline` 带来的“脆性”（即即使对其进行极微小的更改都很困难）。^(220)\
  \ 因此，尽管调用 `size()` 的程序在函数被声明为 `inline` 时会更小且运行更快，但目前并不清楚在这种情况下进行内联是否是一个好主意，特别是由于很有可能底层实现可能会发生变化——例如，请求的大小不再等于实际块的大小（实际大小可能略大）。^(221)\n\
  \n^(220) 事实上，除了测试之外，没有任何理由设置一个 `size()` 方法！创建池对象的客户端非常清楚请求的大小是多少，因为这通常由嵌入它的父对象（例如容器）中的\
  \ `sizeof` 节点决定的。在任何预想的现实世界用例中，都不会另一个客户端（即在某个遥远的作用域中）需要重新发现块大小属性。\n\n^(221) 总而言之，避免编译时耦合在软件开发生命期的早期最有价值，因为此时对实现进行封装调整最有可能发生。如果出现了合理的性能需求，我们始终可以在下一次发布时选择\
  \ `inline` 一个函数。现在让我们考虑构造函数：\n\n点击此处查看代码图像\n\n```\nmy::Pool::Pool(std::size_t size)\n\
  : d_size(size), chunkSize(DEFAULT_CHUNK_SIZE), d_freeList_p(0)\n```\n\n^(222](#ch03.xhtml_rch03fn222))\
  \ 从 C++11 开始，我们可以说 `d_freeList_p(nullptr)` 代替 0。此构造函数应该被声明为 `inline` 并定义在头文件中吗？此构造函数有一个参数，^(223)\
  \ 并且需要进行三次赋值.^(224) 如果我们只考虑运行时间和代码大小，那么明显的选择是将此构造函数声明为 `inline` 并获得之前关于 `size` 的益处。另一方面，通过将此构造函数的定义放在物理接口中，我们严重限制了在不迫使所有客户端重新编译的情况下对\
  \ `Pool` 进行紧急更改的能力。还要注意，构造成本在对象的生命周期内被摊销，在实践中通常完全可以忽略。因此，出于上述讨论 `size` 类似的原因，此类的任何构造函数（至少最初）都不应该声明为\
  \ `inline`，并且应该完全定义在 `.cpp` 文件中。\n\n^(223) 每个块的字节数可以是模板参数，但这样做会导致每个唯一尺寸池成为不同的 C++\
  \ 类型（见卷 II 第 4.4 节），导致不必要的代码膨胀（见卷 II 第 4.5 节），并导致某些重要用例不兼容，例如多池分配器（见卷 II 第 4.10\
  \ 节）。\n\n^(224) 在下文讨论的不简化的、真实的 `odema::Pool` 实现中，将有两个构造函数（分别有两个和三个参数），每个进行四次赋值，但主思想相同。\n\
  \n有时方法的部分应该应该定义在头文件中。我们将仅向客户端编译器隐藏部分编译时方面称为*部分隔离*（见卷 II 第 6.6 节）。例如，考虑在图 3-136 所示的\
  \ `my::Pool` 公有 `allocate` 方法的实现。我们故意将私有的 `replenish` 方法设为非内联，出于多个独立但相关的原因：\n\n\n\
  \n\n\n1. 与传统函数调用的开销相比，补充池（pool）所需的工作量是巨大的，这本身就足以证明这种做法的性（参见第二卷第 6.7 节）。\n\n2. 在大多数情况下，`d_freeList_p`\
  \ 不为 `null`，因此调用 `replenish` 的成本被分摊到了多次 `allocate` 的调用中。\n\n3. 必须包含额外的头文件——例如 `new`（在此情况下）或\
  \ `bslma_allocator.h` 和 `bslma_default.h`（见下文，以及第二卷第 4.10 节），以便 `replenish` 的体体获取额外的内存；将\
  \ `replenish` 方法声明为 `inline` 将导致 `my_pool` 客户端产生额外的编译耦合（以及不必要的编译开销），因为这迫使这些头文件必须包含\
  \ `my_pool.h` 中而不是直接在 `my_pool.cpp` 中。\n\n4. 最重要的是，重新分配策略本身是 `allocate` 方法中最可能随时间改变的部分！\n\
  \n将私有的 `replenish()` 方法声明为 `inline` 将强制任何 `my::Pool` 的客户端不仅看到 `replenish()` 的声明，还要看到它的定义以及编译所需的任何额外头文件。根据定义，无论\
  \ `replenish` 是否声明为 `inline`，其逻辑行为都是相同的。然而，决定是否使用 `inline` 影响的是 `Pool` 实现与其客户端之间物理耦合的程度和性质，因此，维护任何使用\
  \ `Pool` 的程序的成本也会随之。我们在大型系统中任何合理时间范围内调优池策略的能力（例如，更改默认块大小或在固定大小和自适应分配策略之间切换），将取决于*不*将策略性关键的函数（如构造函数和私有的\
  \ `replenish()` 方法）声明为 `inline` 的物理设计决策。\n\n### 3.10.5 避免编译耦合优势的真实世界示例\n\n作为一个真实世界的示例（225），说明消除不必要的编译耦合如何关键性地影响我们快速响应业务需求的能力，让我们假设我们的部门负责底层基础设施，包括可重用的库，这些库在其他方面有助于管理内存分配。如图\
  \ 3-137 所示，`odema::Pool`（我们的开发环境内存分配器 `Pool`）类，之前的 `my::Pool`（图 3-136，第 3.10.4 节），被许多其他部门的开发环境包组使用，包括股票\
  \ (`ede`)、固定收益 (`fde`) 和信用衍生品 (`cde`)，用以为它们各自独立的专有集合包分摊分配和释放某些固定大小结构体的成本——分别为 `edec`、`fdec`\
  \ 和 `cdec`。几个高级应用程序依赖于这些集合。事实上，其中一些应用程序（例如，`app3`）甚至依赖于由多个部门维护的集合；因此，这些集合位于不同的 UOR\
  \ 中。\n\n^(225) 这确实发生过我在纽约 Bear Stearns & Co. 的 F.A.S.T. Group 担任金融基础设施库开发人员期间（大约\
  \ 1998 年）。\n\n![](img/fig3-137.jpg)\n\n**图 3-137: 说明编译时依赖的负面后果**\n\n事实证明，`app3`\
  \ 是一个涉及股票和固定收益方面的非常成功的合资项目。`app3` 主要数据结构之一涉及创建巨大的（基于节点的）`fdec::Collection` 对象数组，这依赖于\
  \ `odema::Pool` 来帮助管理其节点，但数组中的每个集合通常是非常稀疏的（即只有一或两个元素）。`app3` 的业务增长如此之快，以至于内存消耗开始触及平台的限制。增加硬件投入来解决问题是一种蛮力解决的方法，顶多只能提供一个中期的“创可贴”解决方案；仍然存在一种迫切的需求来解决本质上的“低效”（次优）池策略，以避免错过业务机会（即金融术语中所谓的“让钱留在桌面上”）。我们的部门主管想知道我们现在能做什么！\n\
  \n`odema::Pool` 的初始补充策略总是一次性分配相同数量的块。然而，在这种设计中，提供了第二个构造函数，它包含一个额外的\n\n```\nint chunkSize\n\
  ```\n\n^(226) 允许客户端指定每个块的（正）固定内存块数量，而不是被迫接受实现定义的默认值。\n\n^(226) 我们刻意使用（尽管遗憾但必须是 `unsigned`\
  \ 的）`std::size_t` 来表示值，例如 `blockSize`，其最大值与底层（例如 32 位或 64 位）平台的可用地址空间大小直接相关。但在 `chunkSize`\
  \ 的情况下，没有这种实际依赖；因此，我们通常倾向于使用更通用的类型类型 `int`（参见第二卷第 4.4 节）。\n\n如图 3-138 所示，^(227,228,229)\
  \ `DEFAULT_CHUNK_SIZE`（每个块（固定）块数量的默认值）初始为 100，但我们后来能够将其减少到 32，而没有明显的性能损失。得益于促进内部灵活性的良好编码实践（第\
  \ 0.5 节），在 `.cpp` 文件中更改此默认值是轻而易见的。更重要的是，由于第一个构造函数不是 `inline`，将该值从 100 更改为 32 并不客户端重新编译以获取新的\
  \ `DEFAULT_CHUNK_SIZE`。\n\n^(227) 这次在构造函数中对多态内存分配器提供了适当的支持（参见第二卷第 4.10 节）。`bslma::Allocator`\
  \ 和 `bslma::Default` 的一个易用开源实现可以在 Bloomberg 的 BDE 库开源发行版的 **bsl** 包组的 **bslma**\
  \ 包（**bslma** package）中找到（见 `/groups/bsl/`）。\n\n^(228) 截至 C++17，我们可以使用 `std::pmr`（多态内存资源）的标准设施来实现相同的目标（cpp17，第\
  \ 23.12 节）；另参见 lakos17b、lakos17c 和 meredith19。\n\n![](img/fig3-138.jpg)\n\n**图 3-138:\
  \ (初始) 固定块大小补充策略**\n\n至关重要的一点是，编译耦合本身不是这里的问题。重新编译所有代码（尽管不必要地耗时）是*可以*的。问题在于，为了让 `app3`\
  \ 利用任何涉及对 `odema_pool.h` 实质修改的更改，中间的所有软件（包括物理依赖于 `ode` 包组的 `edec` 和 `fdec`）不仅需要重新编译，还需要*重新部署*（第\
  \ 2.15 节）。让任何一个负责的开发组织在正常发布周期之外、在任何合理时间范围内重新构建并重新部署它们所有的库都是困难的，至少可以这样说；让他们两者在短时间内这样做几乎是不可能的。\n\
  \n\n\n\n然而仍然有出路。由于修改由第一个 `odema::Pool` 构造函数安装的 `DEFAULT_CHUNK_SIZE` 不需要重新编译中间库，因此只需通过在链接行中直接在\
  \ `fdec`、`edec` 和 `ode`（静态链接）库之前提供新的 `odema_pool.o` 文件，就可以简单地修补 `app3`（参见第 1.2.4\
  \ 节），从而解决问题，直到下一次例行发布。\n\n遗憾的是，在对 `app3` 特有的稀疏数组使用模式进行进一步分析后，很快就会发现，固定大小的池补充策略是不可行的。尽管这种固定策略在向上扩展时表现良好，但它无法在向下缩扩展，因为将这个固定的\
  \ `DEFAULT_CHUNK_SIZE` 值降低到 32 以下会导致其他应用程序的性能下降。(([230) 需要一种全新的补充策略。\n\n^(230) lakos96，第\
  \ 10.4.3 节，第 702–705 页（特别是图 10-27，第 705 页）将 `replenish` 从固定大小策略改为几何级增长的自适应策略（例如从\
  \ 1、2、4、8 开始，最终在 32 饱和），可以将 `app3` 中使用的主结构的性能提高一个数量级，而不会对任何应用程序产生显著的性能下降。这种变化避免了购买和安装硬件。剩下的问题是：“这种变化会强制\
  \ `odema::Pool` 的客户端重新编译吗？”\n\n这个关键的物理设计问题变为：“是将第一个构造函数(231)还是 `odema::Pool` 的私\
  \ `replenish` 方法声明为 `inline`？”如果由于某种原因，这些不常用的方法目前实现在头文件中，我们需要重新构建并重新发布整个基础设施，从 `ode`\
  \ 包开始。一旦完成，我们需要 Equities 和 Fixed Income 部门快速重建、测试并重新发布他们的库（祝你好运）。只有 own，`app3` 才能安全地重建。^(231)\
  \ 注意，如果我们通过 `.cpp` 文件中的 `static` 类成员来部分隔离其块大小值，构造函数仍然可以被声明为 `inline`（参见卷 II 第 6.6\
  \ 节）。\n\n另一方面，如果私 `replenish` 方法没有声明为 `inline`，调用此重量级方法的分摊运行成本可能会略微增加，但其实现的策略细节不会暴露给客户端。只要我们所做的更改符合\
  \ `replenish` 的契约——即“使空列表不为空”——我们就可以在 `odema_pool.cpp` 文件中随心所欲（参见卷 II 第 5.5 节），除了该源文件外，没有其他内容需要重新编译。(([232)^(232)\
  \ 注意，允许客户端指定块大小的额外构造函数是一个复杂的因素，要求我们在保留该功能的同时，允许客户端通过负值指定任意的自适应初始值。\n\n如果不内联，构造运行成本可能会增加，但同样，这种一次性成本被分摊到整个池的生命周期中。只要所有的策略实现更改都对客户端隐藏，完全封装在所示图\
  \ 3-139 中，我们可以为 `app3` 的开发者提供一个特殊的 `odema_pool.o` 补丁文件，放置在（静态链接）库之前，紧急情况就解决了！^(233)\
  \ 多亏 Pablo Halpern 多年的建议，我们自适应池的最新实现一直专门使用自适应策略，现在——不再是缝合新分配块内部的链接——维护一对指向几何级增长块序列中最近一个的迭代器，从而消除了不必要的（例如\
  \ L1）缓存使用，提高了性能，并消除了任何固定最大块大小。查看 BDE 库 `bdl` 包组中 `bdlma` 包的 `bdlma_pool` 组件，它由文件\
  \ `bdlma_pool.h`、`bdlma_pool.cpp` 和 `bdlma_pool.t.cpp` 组成 (bde14，子目录 `groups/bdl/bdlma/`)。\n\
  \n![](img/fig3-139.jpg)\n\n**图 3-139：（替换）自适应块大小补充策略**\n\n### 3.10.6 节总结\n\n总结：类的封装实现细节——例如私有数据成员、内联函数的体，甚至是私有或保护方法的签名或返回类型——仍然会强制开发工具重新编译其客户端。跨\
  \ UOR 的编译依赖对于即使中等规模的应用程序也可以是一个关键的设计考虑因素。在下一节中，我们将讨论整体架构级方法，以隔离客户端不受逻辑封装实现细节的任何更改。我们将在卷\
  \ II 第 6.6 节中从仅实现的角度重新讨论部分隔离和全隔离的主题。\n\n## 3.11 架构隔离技术\n\n上一节引入的编译耦合对于大型系统来说是一个重要的考虑因素，影响逻辑和物理设计。在本节中，我们首先形式化对（逻辑）封装的理解，然后重新引入“隔离”（insulation）一词来指代其物理对应物。接下来，我们简要讨论用于隔离实现细节的各种类技术。最后，我们介绍了三种不同的全隔离技术，这些技术必然会影响客户端交互的逻辑接口。\n\
  \n#### 3.11.1 *封装*与*隔离*的正式定义\n\n**定义：**\n\n**如果一个组件的实现细节（类型、数据或函数）可以在不强制客户端重写代码的情况下更改、添加或删除，则被称为封装的。**\n\
  \n此处定义的封装实现细节不会被客户端直接访问。(([234) 正如我们在第 3.10 节开头所示，在 C++ 中隐藏由于不同实现导致的行为差异并非总是可能的。因此，我们封装的目标是允许实现细节发生更改，以便在实际操作中不会强制客户端重写代码。\n\
  \n^(234) 虽然封装一术最初是指将类成员函数操作的数据聚集（如装入“胶囊”中），但在书中，我们经常使用其现在通俗接受的形式，这种形式除了数据和成员函数的聚集外，还意味着实现的细节——特别是数据——在逻辑上被“隐藏”了（即无法通过聚集的函数以外进行程序化访问）。从历史上看，`struct`\
  \ 也可以被认为封装了它的公共数据——尽管它并没有“隐藏”它。\n\n\n\n隔离（Insulation）是封装（encapsulation）逻辑属性的物理对应物。隔离的目标是，除了客户端不需要\
  \ `rework` 它们的代码外，它们甚至不需要对其进行 `recompile`。对隔离的实现细节的任何更改都会在链接时被客户端捕获。与封装相比，隔离组件实现的每个方面并不一定是目标，而且可能会严重降低性能。因此，适当的隔离形式和程度取决于：(1)\
  \ 被隔离的功能实现之目的，以及 (2) 它们在代码库物理架构中的相对位置。\n\n### 3.11.2 从组件角度说明封装与隔离\n\n为了更好地理解`encapsulation`和`insulation`之间的物理差异，请考虑图\
  \ 3-140 所示的详细（文件级）组件依赖图。该图由四个组件组成，标记为 `a` 到 `d`。假设 `d` 代表一个客户端组件，而 `c` 代表一个（可重用的）库组件。客户端软件\
  \ `d` 直接且实质性地使用库组件 `c` 提供的功能，因此根据我们的设计规则（章节 2.6），`d` 必须 `directly` 包含 `c.h`。库组件\
  \ `c` 反之使用了两个 C++ 类 `A` 和 `B`，它们分别定义在各自独立的组件 `a` 和 `b` 中。\n\n![](img/fig3-140.jpg)\n\
  \n**图 3-140：组件（使用）的封装与隔离**\n\n在这个示例中，`c`（仅）在它的实现中使用 `A` 和 `B`。这意味着，这两种类型都不是 `c`（在\
  \ `c.h` 中）定义的任何外部可访问的 `programmatic` 接口的一部分。方便说 `A` 和 `B` 都被 `c` `encapsulated`\
  \ 了，但——严格来说——这是不对的。作为非从属组件的公共类（章节 2.7.5），`c`（或任何其他软件）完全可能通过首先（直接）包含相应的头文件，然后随心所欲地创建并使用所需类型的对象来访问\
  \ `A` 或 `B`。\n\n我们这里所说的 `encapsulated` 一词是指，虽然可以创建这些类型的新对象，但在 `c` 的上下文中无法利用它们。也就是说，`c`\
  \ 并没有暴露任何可以插入或提取此类类型对象的 `programmatic` 接口。为了更精确地描述我们的意图，与其说 `c` `encapsulates` 了\
  \ `A`（它显然没有这样做），我们不如说 `c` 封装了 `A` 的*使用*。^(235) 通过这种封装的概念，我们可以将 `A` 替换为完全不同的类 `E`，它能够执行等等的功能，而\
  \ `c` 的任何适当客户端都不需要 `rework` 它们的代码。^(236)\n\n^(235) 我们在章节 3.5.10.2（参见图 3-94）中见过这种“使用的封装”的示例，其中\
  \ `Graph` 类封装了对（实现）类 `Node` 和 `Edge` 的使用，以及对（可重用的）类模板 `std::vector` 的使用。关于封装（物理不同的）实现组件使用的另一个物理示例，请参阅图\
  \ 3-172、章节 3.12.11.2。\n\n^(236) 注意到，如果 `c` 的当前客户端（例如 `d`）恰好也直接使用 `A`，但未能也直接包含 `a.h`，那么通过将\
  \ `A` 替换为另一种类型 `E` 并移除 `c.h` 中对 `a.h` 的嵌套包含，此类客户端可能会突然编译失败。然而，依赖这种间接或 `transitive`\
  \ 包含是显式违反设计规则（章节 2.6）。\n\n在这个示例中，`A` 和 `B` 的（*使用*）都被 `c` 封装了。对 `A` 或 `B` 的逻辑接口进行任何实质性更改都将强制\
  \ `c` 重新编译，甚至可能需要对其源代码进行修改，但只要 `c` 的程序接口和基本行为（参见卷 II 第 5.2 节）保持不变，就不会改变 `d` 的源代码。尽管如此，对于\
  \ `c`，我们可以对 `B` 做出更强的断言。虽然 `a.h` 被包含在 `c.h` 中（后者被包含在 `c.cpp` 中），但 `b.h` 没有，`b.h`\
  \ 被包含在 `c.cpp` 中。因此，与 `a.h` 不同，对 `b.h` 的更改*没有*通过 `c` 的物理接口传播到 `d`，因此对 `b.h` 的更改并不一定要求\
  \ `d` 重新编译。换句话说，`c` 封装了 `A` 的使用，而它（也）`insulates` 了 `B` 的使用。^(237,238)\n\n### 3.11.3\
  \ *完全* 隔离 vs. *部分* 隔离\n\n隔离可以分为 `total` 或 `partial`。通过*完全隔离*，我们的意思是封装的实现本质上没有哪一个方面如果发生更改，将强制客户端重新编译。另一方面，*部分隔离*意味着实现的某些（理想情况下是稳定的）方面暴露给了客户端的编译器，^(239)，而其他更具策略性和灵活性的方面则保留在\
  \ `.cpp` 文件中。部分隔离（与无隔离相比）本身是单个组件的实现细节，并在卷 II 第 6.6 节中从该视角进行了讨论。^(240) 然而，如果完全隔离是合适的，那么子系统的物理架构以及指向该子系统的逻辑接口性质很可能会受到影响。我们在这里讨论的是这些*架构意义的*（章节\
  \ 2.2.6）完全隔离技术。\n\n^(239) 通常是为了提高运行时性能，但有时是为了实现互操作性（参见卷 II 第 4.4 节）。\n\n\n\n\n在头文件（例如\
  \ `b.h`）中提供本地类声明（例如 `class A;`），而不是包含 `a.h`（定义类 `A` 的头文件），通常是为了使 `b.h` 的客户端免受 `a.h`\
  \ 更改的影响。在 `b.h` 中只需要 `A` 的声明而不需要定义，以便其能够满足**组件属性 1**（第 1.6.1 节）的要求进行独立编译。这种本地（内部绑定）声明（第\
  \ 1.3.4 节）虽然被我们的组件设计规则（第 2.6 节）允许，但它限制了对 `a.h` 中面向客户端的所可以进行的更改，而无需强制重写 `b.h` 的源代码。缓解这种障碍的策略——与第\
  \ 2 章中阐述的基本设计和封装规则以及术语保持一致——可以通过“前向”声明组件的形式实现，例如 `iosfwd`（见第二卷第 5.5 节）。\n\n### 3.11.4\
  \ 架构意义显著的全隔离技术\n\n从历史上看，C++ 中实现子系统完全隔离的基本上有三种具有架构意义的基本技术，这些技术在图 3-141 中总结。每种技术都有其优缺点。任何这些技术的适用性将取决于具体的当前情况。例如，当无论如何都会涉及继承时，使用协议类（protocol\
  \ classes）来实现完全隔离会立即被脑海。在这种情况下，架构已经预见到，具体派生类型的创建者很可能与通过其抽象基类使用它的多数客户端不同。此外，还有一个好处，即消除了协议客户端对其（派生）实现甚至是链接时的依赖。\n\
  \nlakos96，第 6.4–6.5 节，第 385–445 页\n\n![](img/fig3-141.jpg)\n\n**图 3-141: 实现完全隔离的三种基本技术**\n\
  \n对于必须由同一个客户端创建和管理的子系统，继承是不合适的，但一个完全隔离的派生封装组件可能是很合适的。如果系统已经由一个封装封装组件管理——例如 `xyza_pubgraph`（见图\
  \ 3-95，第 3.5.10.3 节）——过渡到完全隔离的封装组件是直接的（见第二卷第 6.6 节）。否则，考虑到多组件封装器通常以极难实现而闻名（第 3.1.10.6\
  \ 节），只有当新封装器所需的单个封装类数量是固定的（或增长非常缓慢），并且持续保持小到足以容于单个组件中时，该策略才是可行的——以避免违反禁止远程友谊的设计规则（第\
  \ 2.6 节）。\n\n最后，对于由于大型现有子系统使得单组件封装器不可行的情况，我们可能被迫诉助于过程化接口。在这种方法中，客户端仅通过自由函数来分配、操作和释放内存不透明类型（opaque\
  \ types）的实例。这里的主要的缺点是，我们现在从某种意义上从客户端处“隐藏”了接口类型的定义，以获得隔离（这*不是*第 3.9.7 节和第 3.9.10\
  \ 节中描述的那种伪逻辑封装隐藏）；因此，过程化接口通常设计用于允许 C 语言客户端使用，否则它们将无法直接使用 C++ 类型。现在让我们详细检查上述介绍的三种具有架构意义的完全隔离的基本方法。\n\
  \n例如，参见 C 风格的回调函数 `myTurnUpTheHeatCallback`，它调用了图 3-31 所示的 `MyHeatController` 对象的\
  \ `turnUpTheHeat` 方法，第 3.3.8.1 节]。\n\n### 3.11.5 纯抽象接口（“协议”）类\n\n每当我们已经倾向于使用继承时，使用协议（第\
  \ 1.7.5 节）使接口的公共客户端完全免受实现任何更改的影响，这几乎是正确的决定。作为一个使用协议隔离继承所有方面优势的刻意且（可以争说是）设计不佳的例子，请考虑图\
  \ 3-142 中所示的集合。这个小型子系统由一个基类 `Shape`、两个派生类 `Circle` 和 `Rectangle`（它们从 `Shape` 派生各自的接口）以及几个客户端类\
  \ `Client1`、`Client2` 和 `Client3`组成，它们只消费 `Shape` 的公共接口。\n\n![](img/fig3-142.jpg)\n\
  \n**图 3-142: 由于继承导致的编译时耦合**\n\n从 C++11 开始，我们可以并且可能应该将 `area` 标记为 `override`，以帮助（例如编译器）确保其签名与其实现的纯虚签名匹配：\n\
  \n```\nvirtual double area() const override; // 这里 virtual 是可选的\n```\n\n从 C++11\
  \ 开始，我们可以利用范围的 `for` 语法更简洁地（但等效）按正向迭代顺序访问 `Shape` 指针序列中的每个元素（我们刻意为了使用 `Shape` 的可读性而牺牲了\
  \ `auto` 的简洁性）：\n\n```\nfor (Shape *p : shapePointers) {\n    sum += p->area();\n\
  }\n```\n\n关于在大规模工业环境中安全地使用这些及其他现代 C++ 语言特彻底处理，请参见**lakos21**。\n\n最初，`Shape` 的作者（当时仅在\
  \ 32 位平台上工作）知道所有客户端的坐标值的有效范围只是 [−1000 .. +1000]，因此为了最小化对象大小，决定在内部使用 `short int`\
  \ 数据成员表示坐标值，并理解在将来，这种有效范围可能需要增加。用于存储坐标的私有数据成员的具体大小显然是 `Shape` 类的实现细节，前提是它们能够表示合同所指示的有效范围（见第二卷第\
  \ 5.2 节）。随后将 `short int` 替换为 `int` 不会改变逻辑接口，它将继续像常一样接受并返回 `int` 类型整数（见第二卷第 6.12\
  \ 节），尽管范围是原始合同指定范围的超集。事实上，这个实现细节完全被 `Shape` 的接口封装了。然而，存在一个问题。\n\n\n\n\n\n假设某一天，我们发现某些客户急需范围比\
  \ `short int` 能够容纳的更大的坐标范围，因此我们决定将私有坐标数据成员（针对所有人）的类型从 `short int` 改为 `int`。在图 3-142](#ch03.xhtml_ch03fig142)\
  \ 中的哪些组件会被强制重新编译？遗憾的是，正确答案是“所有组件！”，包括那些不需要此项增强、因此没有迫切需求进行重新编译和部署的客户，但为了与那些需要此类更新的客户保持兼容，它们必须这样做。\n\
  \n`Circle` 和 `Rectangle` 都继承自 `Shape`，并紧密地依赖于 `Shape` 的内部物理布局。当 `Shape` 的任何数据成员发生变化时，`Circle`\
  \ 和 `Rectangle` 的内部布局必须相应且同步地变化。`Shape` 的客户也没有好到哪里。除了涉及数据成员本身的不兼容性外，在许多平台上，`Shape`\
  \ 对象物理布局中虚函数表指针的位置也会受到从 `short int` 到 `int` 更改的影响。除非重新编译依赖代码，否则它们将无法工作。\n\n### 3.11.5.1\
  \ 提取协议（Protocol）\n\n只要实现的任何部分位于组件的头文件中，该组件就无法对客户与其逻辑实现的该部分进行隔离（insulate）。使用同一个基类同时用于接口继承和实现继承，会导致封装的公共部分实现细节发生变化时，使客户暴露于重新编译。然而，纯抽象类（即“协议”类）起到了近乎完美的隔离作用（参见\
  \ 3.11.5.3 节）。如果我们从基类中提取出一个纯抽象接口，那么客户将完全不受实现中该方面变化的影响。\n\n图 3-143](#ch03.xhtml_ch03fig143)\
  \ 展示了修改后的架构，其中原始的 `Shape` 类被重命名为 `ShapePartialImp`，它现在派自新的（纯抽象）`Shape` 协议类。由于 `Shape`\
  \ 已经是一个抽象类，提取协议是在不改变使用模型的情况下提高隔离性的自然方式。^(246) 除与原始相关的函数外，所有函数的运行时性能将完全不受影响。客户将继续像以前一样使用\
  \ `Shape`，但无需为了响应共享实现（现在位于 `ShapePartialImp` 中）的变化而重新编译。另请注意，`Shape` 的新具体实现（如 `Box`）现在可以直接派生自协议，因此在倾向于使用备替代实现时，它不再被强制承担与\
  \ `ShapePartialImp` 相关的空间开销。\n\n^(246) **lakos96**，第 6.6.3 ，653–654 页\n\n![](img/fig3-143a.jpg)\
  \ ![](img/fig3-143b.jpg)\n\n**图 3-143：通过协议类避免编译时耦合**\n\n²⁴⁷ 注意，我们有时会对类名加下划线，以指示它是抽象接口，即使它不是纯抽象的。\n\
  \n### 3.11.5.2 等效的“桥接”模式\n\n接口继承是唯一一种真正增加价值的继承类型^(248)。任何实现继承的使用都是可的，特别是对于库组件（参见第二卷，第\
  \ 4.6 节）。即使使用了实现继承，将接口与实现继承分离的需求也远超物理隔离（参见第二卷，第 4.7 节）。然而请注意，我们总可以在不使用实现继承的情况下实现完全相同的结果——尽管派生类作者需要付出一些额外努力。\n\
  \n实现继承的替代方案是将 `ShapePartialImp` 替换为一个或多个独立的具体类，例如 `IntPoint` 和 `ShortPoint`——有时被识别为`桥接模式`^(249)——如图\
  \ 3-144](#ch03.xhtml_ch03fig144)所示。在这种设计中，每个具体节点独立地负责提供自己的（重构的）实现以实现 `Shape` 协议。如果一个新的具体派生形状（如\
  \ `Box`）想要自己实现坐标数据成员，随它去吧！注意，除非派生类作者也是该子系统的预期客户，否则对于库软件，我们通常认为这种架构形式在实践中对于接口继承是最有效的。\n\
  \n^(248) **liskov87**\n\n^(249) **gamma95**，第 4 章，“桥接”节，151–161 页\n\n![](img/fig3-144.jpg)\n\
  \n**图 3-144：用分层替换实现继承**\n\n### 3.11.5.3 协议作为隔离器的有效性\n\n我们通常认为，在适用的情况下，协议是这些基础的具有架构意义的全隔离技术中最有效的。协议由于不包含任何特定于接口本身的杂质，消除了几乎所有与实现相关的编译时耦合。纯接口的客户不会暴露数据成员或私有函数。此外，受保护的功能（仅供派生类作者使用）也可以轻松提升到部分实现中（或者，在独立的实现中重新创建，例如*工具*组件），这些是为派生类设计的，因此公共客户永远不需要看到。协议作为词汇类型（`vocabulary\
  \ type`）（参见第二卷，第 4.4 节）的一种极其有效的用法是注入本地分配器。\n\n### 3.11.5.4 特定实现的接口\n\n即使是用于特殊函数的接口，例如由独立的上层客户用于创建和配置协议的派生（实现）类型的构造函数，通过抽象接口也是不可见的。对于公共客户而言，消除的还有与特定实现（非虚）方法相关的编译时耦合——例如在构造后用于配置或访问派生类型对象独特特征的方法。请注意，协议接口中使用的类型通常不在基类组件中通过\
  \ `#include` 指令定义，而是仅在本地声明，从而在显式需要之前将客户对其隔离。通过提供纯接口，我们有效地绕过了通常为了`部分`隔离具体类客户与其实现细节所需的所需的全部复杂手段（参见第二卷，第\
  \ 6.6 节）。\n\n### 3.11.5.5 静态链接时依赖\n\n更奇妙的是，在本节确定的三个具有架构意义的隔离方法中，协议的独特之处在于它们还消除了公共客户对特定实现的所有静态链接时依赖。由于协议不包含实现，因此也不会产生任何链接时依赖。通过依赖协议而非具体类，我们将传统的（脆弱的）`分层`架构转变为（更灵活的）`横向`架构（3.7.5\
  \ 节）。\n\n\n\n\n\n恰当使用接口继承（参见第二卷第 4.6 节和 4.7 节）来打破物理依赖，从而在物理上将原本是对子功能的静态依赖进行完全解耦时，自然会导致子系统变得更加稳定（例如，平台无关的）、可测试且可扩展。在不指示明为了运行时性能而进行\
  \ `inline` 内联的情况下，协议通常可以被系统级代理（例如 `main`）使用，根据需要注入（高层）特定平台的功能，而不是强制一个可移植库通过条件编译门控来静态地依赖于多个特定平台的库。\n\
  \n彭博公司的一个示例（约 2018 年）是用于特定服务的 BAS（彭博应用服务）客户端的“传输”层实现：\n\n![](img/pro3-37.jpg)\n\n\
  ### 3.11.5.6 全隔离的运行时开销\n\n与任何方法一样，在原本没有隔离的地方使用协议来实现全隔离，可能会带来重大的额外运行时开销。对于最初设计中未包含继承的子系统，必须将该子系统适配到新协议。随后，高层代理将需要负责通过其新的\
  \ `adapter` 对象来创建和配置子系统。其公共客户端调用的每个（以前是静态绑定、可能是内联的）访问器和操作器函数调用现在都将通过（通常是动态绑定的）虚拟函数。虽然虚拟函数与普通函数相比的相对开销通常在两倍以内，但与\
  \ `inline` 函数相比的开销可能会大得多。\n\n`gamma95` (#ref.xhtml_ref37), 第 4 节，“适配器”部分，第 139–150\
  \ 页\n\n`lakos96` (#ref.xhtml_ref55), 第 6.6.1 节，第 445–448 页\n\n对于已经采用继承的子系统，其设计成本以及随之而来的运行时开销可能要小得多。提取协议是机械性的，且使用模式保持不变。由于调用纯虚拟函数的成本并不大于（动态绑定的）非纯虚拟函数，因此唯一的（典型的）额外运行时开销是失去了对存在于（非协议）基类中的共享实现细节的\
  \ `inline` 访问。\n\n`lakos96` (#ref.xhtml_ref55), 第 6.4.1 节，第 386–398 页（特别是第 392–393\
  \ 页）\n\n如果创建协议是为了避免大型、重量级子系统的*编译时*和*链接时*依赖（该子系统在调用典型方法时会执行大量工作），那么运行时可能完全没有察觉的下降。然而，如果被隔离的组件或多个组件有效利用了公共\
  \ `inline` 函数，那么始终调用虚拟函数带来的通常巨大的相对成本可能会是显著的，甚至可能是不可接受的。要避免由于高性能、广泛使用的类型或具有许多微小 `inline`\
  \ 函数的类型模板实现发生变化而导致无处不在的重新编译——例如下方的 `bget::Point`（参见图 3-148、第 3.11.7.9 节）或各自的 `std::complex`——是从一开始就“做对”。\n\
  \n`lakos96` (#ref.xhtml_ref55), 第 6.6.2 节，第 448–453 页\n\n### 3.11.6 全隔离的具体封装组件\n\
  \n全隔离的具体封装组件的使用模型与协议不同，它允许创建封装器的同一个客户端使用其所隔离的子系统。在这种全隔离方法中，封装组件为具体子系统提供了一个完整的“外观模式（facade）”，同时在\
  \ `.cpp` 文件中隔离所有的各种私有细节，使得物理接口中定义的每个类的实现在仅从头文件查看时，与其他所有可能想象的实现看起来是一模一样的。当通过单个封装组件进行隔离可行时，实现这一目标的最佳方法是先创建一个封装封装组件，例如\
  \ `PubGraph`（参见图 3-95、第 3.5 节)），随后将该组件中的每个类都变为全隔离的具体类（参见第二卷第 6.6 节）。\n\n`gamma95`\
  \ (#ref.xhtml_ref37), 第 4 节，“外观模式”部分，第 185–193 页\n\n使全隔离封装组件成为架构决策的因素（至少不是直接）不是隔离，而是创建和使用子系统的所有方面都将通过封装器发生。通常情况下，接口中使用的类型*不会*被封装，而是使用频率更高的*词汇（vocabulary）*类型（参见第二卷第\
  \ 4.4 节）。当传入或传出封装接口的类型本身也被封装时，设计的复杂性和运行时开销通常都会增加。例如，如果定义在隔离封装器中的某个公共类 `B` 在其接口使用了另一个此类类\
  \ `A`，那么 `B` 的隔离实现可能需要直接访问 `A` 的私有实现，这使得 `A` 必须在暴露的接口中将 `B` 声明为友元（friend）（第 3.1.9\
  \ 节）。\n\n为了实现任意的隔离更改，我们可能会预先为封装器中定义的每个公共类型授予 `B` 的友元权限（无论当前实现是否恰好需要私有访问）。图 3-145\
  \ 展示了这些基本思想应用于图 3-95 的封装组件中，该组件现在实现在完全独立的 `pub` 包中。注意我们使用了组件私有类型（第 2.7.1 节 和 2.7.2\
  \ 节)——以 `_i` 后缀标识——而不是前向声明私嵌套类型，从而模拟了*内部绑定（internal bindage）*（第 1.3.4 节），但在 `.cpp`\
  \ 文件可以直接访问这些类型——例如文件作用域的 `static` 方法、匿名命名空间中的类型或其他实现（`_i`）类型。\n\n![](img/fig3-145a.jpg)\
  \ ![](img/fig3-145b.jpg) ![](img/fig3-145bb.jpg)\n\n**图 3-145：全隔离的具体封装组件（参见图 3-95）**\n\
  \n为像 `Graph` 这样的底层子系统创建全隔离的具体封装组件——特别是当组件中定义的某些全隔离类按值返回其他类时——会对性能产生毁灭性的（数量级）影响。通过转而接受不完美的隔离，例如依赖于封装接口中稳定的但未隔离的低级词汇类型，或者仅（部分）隔离（参见第二卷第\
  \ 6.6 节）封装类中具有策略优势的方面，我们通常可以用很小的额外开销获得隔离的大部分实际处。\n\n`lakos96` (#ref.xhtml_ref55),\
  \ 第 6.6.4 节，第 466 页\n\n\n\n\n\n随着 C++11 `move semantics`（移动语义）的出现，现在可以安全地定义一个`fully\
  \ insulating concrete class`（见第二卷第 6.6 节），该类采用 `PIMPL`（指向实现的句式）的变体，并以与实现无关的方式，使得通过值返回的新构造的包装对象可以避免通常因必须回传给调用者而产生的额外分配和去分配开销，前提是被包装的类型本身具有语义上合理的默认值。为了在确保类不变性的同时保证`move\
  \ construction`（移动构造）始终是 `noexcept`（不抛异常），默认构造的包装器将持有一个 `null` 地址值，且每个非创建器成员方法都必须首先检查对象当前是否处于“已移动”（默认构造）状态，如果是，则要特殊处理该情况。请注意，自\
  \ C++03 起允许并自 C++17 起要求的 `return-value optimization`（`RVO`，返回值优化）是在调用者的上下文中构造返回对象的，因此即使没有移动语义，可能也不会发生拷贝，这使得变成了一种“以防万一”的场景。尽管如此，在后现代\
  \ C++ 中，内部分配内存的高性能对象仍然不适合 `return-by-value`（按值返回）（见第二卷第 4.10 节）。\n\n### 3.11.6.1\
  \ 不适合封装封装器的类型\n\n并不是所有类型都可以或应该为了实现封装而进行包装。例如，为一个本身不分配内存的类型提供封装包装类通常是不明智的，因为即使是单次动态内存分配也会产生巨大的开销，而之前并没有。对于可重用类型（如果分配内存，我们希望使其也感知分配器，`allocator`-aware`）（见第二卷第\
  \ 4.10 节），封装一个原本不分配内存类型的行为本身将需要在包装类型的每个构造函数中添加一个可选的尾部分配器指针参数。此外，通过值返回感知分配器的对象是无法可靠实现的，更不用说高效了。因此，对于`所有可重用`软件，我们选择`不`通过值返回分配内存的对象，而是通过作为前导（输出）参数提供的地址来实现（见第二卷第\
  \ 6.11 和 6.12 节）。\n\n在 C++98 和 C++03 中，并没有硬性要求完全支持有状态的分配器。命名返回值优化（`NRVO`）通常（但并非总是）能够让对象连用于创建它的对象的分配器就地进行构造。当该优化失败时，将执行一次拷贝，并将当前安装的默认分配器赋入到该拷贝对象中。在\
  \ C++11 中，利用移动语义可以保证行为就像返回对象是就地构造的一样。从 C++17 开始，有了关于何时可以依赖 `NRVO` 的保证。\n\n即使有了 C++11\
  \ 的移动语义，按值返回对象也意味着在每次调用函数时都要对其进行构造。对于被重复调用的函数（例如在循环中），或者即使在给定作用域内连续调用多个具有相同返回类型的不同函数，在每次函数调用时构造和析构返回对象的必要性——即使仅仅是两次——会导致不必要的运行时开销，无论分配内存的类型本身是否是\
  \ `allocator-aware (AA)`（感知分配器的）。\n\n我们并不是所有的潜在客户都对性能敏感，因此他们可能选择完全忽略内存分配问题。虽然数量较少，但有很多客户认为性能是一个重要因素，并且如果有这种选项，将选择使用自定义分配器。更少的人会发现基于每个对象接受单独内存分配器的类型在质量和/或数量上的优势是不可或缺的，并被迫为任何未此类配备的类型创建自己的版本。为了不排除`任何`客户充分利用我们的分层可重用软件，我们设计方法的一个支柱是：始终让所有可以超出单个方法作用范围且分配动态内存的类型变为\
  \ `allocator-aware`（感知分配器的）（见第二卷第 4.10 节）。\n\n完全封装的具体包装器通常也不适用于通过继承和虚函数进行扩展的系统。例如，尝试封装图\
  \ 3-142 中的 `Shape` 子系统。我们可能会尝试创建一个实现外观模式（facade）的封装包装器，例如 `MyShape`，通过它，同一个客户端能够如图\
  \ 3-146 所示创建并使用多态类型的形状。然而，在这个失败的例子中，`MyShape` 的构造函数接受新形状的起始点坐标以及一个枚举类型 `ShapeType`，它用于识别要构造的形状种类，从而破坏了为了通用性而添加新形状的封装。使用字符字符串代替枚举将允许添加新类型，而无需强制现有客户端重新编译。然而，这种接口会鲁莽地规避编译时类型检查，因此它不是封装试图消除的编译时耦合。\n\
  \n![](img/fig3-146.jpg)\n\n**图 3-146：用于可扩展抽象接口的封装包装器（坏主意）**\n\n即使我们能够添加允许客户端在创建新形状而无需重新编译的功能，使用\
  \ `MyShape` 的现有客户端也不会知道如何配置新具体形状的实例（例如，`Box` 的大小）。现有客户端无法利用新多态类型这种无能力是封装包装器不是正确方法的迹象。如果开放扩展性是一个设计目标，那么暴露一种协议以允许高层代理使用特定的具体“节点”来配置系统是更优的。如果我们必须封装创建方面，我们将单独处理——例如，在物理层次结构的较高位置使用\
  \ `Factory`（工厂）设计模式（见第二卷第 4.8 节）。\n\n*类型擦除*（Type erasure）是一个常用于描述结合包装器和协议技术的术语。例如，考虑\
  \ `std::shared_ptr`（在 C++11 中形式化），它为给定对象提供引用计数的共享访问。当构造 `shared_ptr<T>` 时，它会接收一个（可选的）`deleter`（删除器），用于在共享表示孤立时进行清理。与其将删除器作为类模板参数（正如\
  \ C++98 中为标准容器内存分配器所做的那样——坏主意），`std::shared_ptr` 采用模板构造函数作为工厂方法，在构造函数体内部创建一个瞬态可见的模板类型对象，以持有用户提供的删除器。\n\
  \n\n\n\n这种短命的模板类型通常派生自一个私有的嵌套抽象基类，它重写了“销毁”方法，但一旦共享指针对象的构造函数完成，它本身实际上就被“擦除”了，从而导致用户提供的删除程序变得无法访问。虽然这种所谓的类型擦除（type\
  \ erasure）实现了其核心任务，即防止删除程序污染共享指针对象的 C++ 类型，但它通常并不具有通用性。它之所以在这个特定案例中有效，是因为删除程序在构造时通过模板参数提供，并且它在引用计数归零并被调用（通过指向私有基类的私有指针）之前，再也不会被需要。\n\
  \n尽管类型擦除最初被提出来是为了替代用于内存分配器的模板参数，但由于在对象的整个生命周期内都需要访问底层分配器的需求，使得为此种目的设计的类型擦除变得不可行。在\
  \ C++17 中，采用了一种更通用的方法——多态内存资源（PMR），即通过其纯抽象（协议）基类，将用户提供的具体分配器的地址传递到构造函数中`。请注意，这种现代的内存分配方法几乎完全基于我们自己的原始设计（约\
  \ 1997 年），这恰恰说明旧的并不一定意味着不好。\n\n### 3.11.7 过程接口\n\n即使为了完全隔离（甚至仅仅是为了封装）而包装（wrapping）是理想的，它也不总是可行的。包装类型通常需要通过友元（friendship）获取其他包装类型的私有访问权限（第\
  \ 3.1 节），这反过来意味着需要将所有此类类型置于单个组件中，以避免“远距离友谊”（第 2.6 节）。对于大型的预存系统，尤其是那些具有许多水平、面向客户端组件的系统，包装根本不是一个可行的方案。在这种情况下，我们可能需要退回到通常被称为过程接口（procedural\
  \ interface）。\n\n### 3.11.7.1 什么是过程接口？\n\n在这种比包装更通用的替代方案中，子系统的部分或全部底层类型通过跨越任意数量物理实体的（非成员）函数接口暴露。创建过程接口总是可能的，而且可以在不修改子系统源代码的情况下实现。然而，这种方法的缺点是，为了隔离目的而使用过程接口的客户端必须避免包含所暴露类型的定义，否则对这些类型进行的封装更改会导致跨接口的对象布局不兼容，并在重新链接时导致客户端程序格式错误（ill-formed）。\n\
  \n值得注意的是，这种形式的隔离并不排除底层类型的并排重用，因为这些类型并没有为了封装而显式地隐藏（第 3.9.7 节 和 第 3.9.9 节）。因此，一个故意直接包含底层头文件的客户端只是自愿地放弃了实现细节的“隔离”方面，而非“封装”方面。\n\
  \n### 3.11.7.2 什么时候需要过程接口？\n\n在以下几种重要情况下，为给定的子系统提供过程接口可能是正确的决策：\n\n1. **遗留系统（Legacy\
  \ Subsystem）** —— 该子系统涉及大量且成熟（遗留）的代码库。此类旧软件可能没有完全遵循物理（甚至是逻辑）设计的合理原则，因此其中定义的类型本身可能就不适合通用重用。阻止对这些类型的直接访问可能会在某种程度上降低整体运行时性能，但通常会因提高客户端的可维护性和易用性而产生整体的“净收益”。\n\
  \n2. **活跃的（水平）库开发** —— 该子系统虽然是现代的，但目前正处于活跃开发中。如果该子系统还暴露了跨越许多不同（水平）组件的宽泛接口，那么从单个物理组件内部包装所有组件可能是不切实际的，甚至是不理想的。在任何给定时刻，底层子系统的某些方面的变化速度可能比其他方面快。每当任何部分添加任何新功能时，都强制每个直接使用该子系统的客户端重新编译，这可能是一个糟糕的设计选择。另一方面，提供过程接口允许在单个成员函数级别进行细粒度的修改，而无需强制所有被包装子系统的客户端重新编译。(第\
  \ 263 页)。\n\n   ^(263) C++ 模块如果（当）它们广泛可用，可以被设计为对现有子系统中用户定义的类型支持细粒度的“视图”，而无需（完全）修改现有源代码，就像今天的过程接口一样。然而，模块的优势在于，可以暴露一个（可能是正确的）（可能是模板或内联的）功能子集以及类型本身，使得直接使用它们成为可能，没有运行时开销，并（可能显著）缩短了编译时间。但请注意，模块的使用本身对编译时耦合的性质和程度影响乎其微——也就是说，模块对于隔离目的并没有用（参见第\
  \ 3.11.1 节）。请参见 `lakos17a` 第 3 节 I 项 c 段和 d 段，第 2 页。\n\n3. **C 语言适配器** —— 该子系统虽然用\
  \ C++ 编写，但对于（例如遗留）部分目前用其他语言（通常是 C）编写的系统很有用。在这种使用场景下，物理接口必须能够在客户端的语言中编译；因此，不可能直接使用成员函数或内联函数、继承、模板等。结果是隔离并没有导致重用性的损失（性能损失也相对较小）。在这种情况下，过程接口充当了隔离层和翻译层——例如从\
  \ C++ 到 C 的链接。只要有效使用没有受到过度阻碍，设计用于翻译的过程接口也可以用于隔离高级 C++ 客户端免受底层系统更改的影响。(第 264 页)\n\
  \n   ^(264) 注意，在大多数常用的平台上，必须使用 C++ 编译器编译定义 `main` 的翻译单元（即使它包含符合 C 的 C++ 子集），然后与从异构语言编译的系统其余部分进行链接。\n\
  \n提供 C++ 到 C 的翻译层可能是过程接口作为适当架构隔离技术的最常见、最通用的案例之一，我们在本节剩余部分关注的重点。(第 265 页)\n\n   ^(265)\
  \ 有关过程接口的信息以及其在其他场景下的用法，请参见 `lakos96` 第 6.5 节，第 425–445 页。\n\n### 3.11.7.3 过程接口的基本属性与架构\n\
  \n\n\n\n\n我们构想的这种隔离、翻译型过程化接口将必然满足几个基本属性。使用经典的分层架构（节 3.7.2）来创建过程化接口将被证明是其整体设计中不可或的一部分。图\
  \ 3-147 展示了这种隔离翻译层位于其所提供访问的（面向对象的）C++ 子系统之上的通用拓扑。在这个示例中，包装类 `ClassW` 封装了实现类 `ClassX`、`ClassY`\
  \ 和 `ClassZ` 的使用，但在其接口中暴露了词汇类型 `ClassA` 和 `ClassB`（见第二卷第 4.4 节），例如参见图 3-95 中的 `PubGraph`，节\
  \ 3.5.10.3）。该子系统的 C++ 用户通常直接依赖于定义 `ClassA`、`ClassB` 和 `ClassW` 的组件，因此为了允许 C 语言客户端完全访问，我们需要在隔离翻译层中为每一个组件提供相应的组件。\n\
  \n![](img/fig3-147.jpg)\n\n**图 3-147：过程化接口的拓扑**\n\n另一方面，`ClassW` 的客户端并不一定需要与实现类\
  \ `ClassX`、`ClassY` 和 `ClassZ` 直接交互。由于这里过程化接口目的是隔离和翻译，但明确*不是*封装，因此在隔离翻译层中延迟其过程化对应部分的实现不会违反任何良好的设计实践（节\
  \ 3.9）。如果此类“实现”类型将来对 C 客户端变得单独有用，那么其定义组件的对应项可以根据需要随时轻松添加到过程化接口（PI）层，而不会影响任何现有的客户端（见第二卷第\
  \ 5.5 节）。\n\n### 3.11.7.4 PI 函数与底层 C++ 组件的物理分离\n\n更广泛地说，所有 C 语言客户端的范围（以及那些仅通过过程化接口访问底层子系统的\
  \ C++ 客户端）与直接访问底层（面向对象的）C++ 代码的 C++ 客户端是分离的。对底层软件甚至是物理接口的任意增强都不会影响该接口的完全隔离用户。然而，此类增强不需要立即传播。一旦新的低级功能被证明有效，就可以将额外的过程化接口函数和组件暴露给\
  \ PI 客户端，而不会以任何方式影响仅与底层子系统交互的 C++ 客户端。此外，对于不需要此类过程化接口的客户端，不被强制知道它，更不用说依赖它。然而，为了实现这种程度的解耦，所有的（翻译型）PI\
  \ 函数在物理上与它们所隔离的 C++ 组件保持分离是至关重要的。\n\n### 3.11.7.5 PI 函数的相互独立性\n\n我们希望能够通过 PI 层暴露底层\
  \ C++ 子系统功能的粒度是单个函数层级。在同一层内耦合 PI 函数将阻碍我们独立选择随时间推移而可能选择暴露的低级功能的适当子集。为了确保在提升单个低级函数时具有完全的灵活性，我们要求给定\
  \ PI 层内的每个 PI 函数都完全独立于该层中的其他此类函数。\n\n### 3.11.7.6 PI 层内部不存在物理依赖\n\n体现 PI 函数的任何组件都不应允许\
  \ `#include`（或具有任何协作性知识）PI 层中的任何其他此类组件。回想节 3.1 中提到的成功创建多组件包装器的固有困难。另一方面，我们 PI 层的目的不是为了包装它，而是为了对其提供经过深思策划的访问。允许物理层级侵入\
  \ PI 层会模糊其目的并增加其复杂性。因此，PI 层中的每个组件都与该层中的其他组件处于相同的（本地）层级——即第 1 层。\n\n### 3.11.7.7\
  \ PI 层中不存在补充功能\n\n过程化接口不应提供底层（面向对象的）C++ 子系统存在之外的任何额外实现或功能。只要过程化接口仅仅是翻译和隔离，而不对现有的领域相关功能进行增加，就可以几乎机械地创建。由于其设计上消除了除了隔离或翻译之外的任何其他用途，我们避免了任何额外的物理依赖，也避免了过程化层被不恰当投入使用的诱惑（例如，其本身导致了设计循环）。\n\
  \n### 3.11.7.8 PI 组件到低级组件的 1-1 映射（使用 `z_` 前缀）\n\n下一步是采用一种策略，将 PI 层中的组件与其在底层（面向对象的）C++\
  \ 子系统中物理分离的对应项系统地联系起来。我们采取的方法倾向于客观可验证的标准，如细粒度拆分和规则性（而不是个人审美）。通想法是为包前缀创建一个独特的、并行的“命名空间”，它将位于过程化接口层中。对于每个实现（面向对象的）C++\
  \ 代码的包（例如 `abcx`），我们允许在过程化接口层中有一个可选的“姐妹”包 `z_abcx`，其唯一目的是为 `abcx` 的适当子集提供过程化接口。\n\
  \n选择 `z_` 前缀是因为它在电子工程中作为复阻（即电阻）的惯用法（而且我们希望自己至少有点幽默感），但在其他方面是任意的；任何其他前缀（例如 `c_` 表示\
  \ C 语言翻译层）同样有效。\n\n`z_abcx` 中的每个组件将仅暴露 `abcx` 对应组件实现的功能子集。例如，对于图 3-147 中实现类 `ClassA`、`ClassB`\
  \ 和 `ClassW` 的每个组件，将分别创建一个。在过程化层中确保这种关联的细粒度模块化，有助于使链接依赖与客户端使用底层组件的情况保持对齐。\n\n对于\
  \ `abcx` 中的仅实现组件（例如图 3-147 中实现 `ClassX`、`ClassY` 和 `ClassZ` 的类），`z_abcx` 中没有对应的过程化接口组件。最后，过程化接口的发布单元——分别为包或包组（节\
  \ 2.8 和 2.9））将镜像底层实现。因此，如果包组 `abc` 实现了需要过程化接口的功能，那么包组 `z_abc` 将包含包子集（例如 `z_abcx`），而这些包子集反过来包含暴露给过程化层客户端的功能子集的组件集。\n\
  \n因此，PI 层组件到相应的（面向对象的）C++ 组件的映射虽然 *1-1* 的，但不一定是*满射*的。\n\n\n\n\n\n### 3.11.7.9 示例：简单（具体）值类型\n\
  \n现在让我们考虑一个简单的接口类型（参见卷 II 第 4.4 节），它可能对应于图 3-147 中抽象图中的 `ClassA`。作为一个具体的示例，我们将选择轻量级的\
  \ `bget::Point` 值类型^(268)，如图 3-148 所示。\n\n^(268) 紧跟包组名 `bge` 之后的 `t` 以构成包名 `bget`，在历史上曾用于指示值类型（参见卷\
  \ II 第 4.1 节）。这种做法早已被废弃，因为基于语法属性（参见卷 II 第 4.2 节）而非语义属性来命名包名几乎总是一个坏主意（章节 3.2.9）。\n\
  \n![](img/fig3-148a.jpg) ![](img/fig3-148aa.jpg) ![](img/fig3-148aaa.jpg) ![](img/fig3-148b.jpg)\n\
  \n**图 3-148：实现轻量级类 `bget::Point` 的组件**\n\n²⁶⁹ 在 C++11（及更高版本）中，我们会在接口中使用 `=default`\
  \ 语法。\n\n注意，该类的几乎整个实现都暴露在它的头文件中（图 3-148a）——唯一的例外是输出运算符 `operator<<`，它是在 `.cpp` 文件中实现的（图\
  \ 3-148b）。将该类的实现与我们的内部 C++ 用户隔离开可能会对整体性能产生毁灭性的影响。相反，我们将明智地选择提供一个物理隔离的过程化接口供外部 C\
  \ 客户端使用，但该接口也能与 C++ 客户端互操作——以防这种做法证明是有益的（如本节后文所述）。\n\n### 3.11.7.10 PI 名称的规律性/可预测性\n\
  \n我们现在转向将所需的子集（面向对象的）C++ 功能提升到 PI 层的详细任务。构成过程化接口的组件和函数应具有规律且可预测的名称，表现出逻辑和物理名称的凝聚性。理想情况下，每个\
  \ PI 函数的物理位置和封装将由其底层的 C++ 操作、方法或函数连同其组件、包和包组名称来暗示。请记住，在我们的方法论中，底层（逻辑）类的名称为 `UpperCamelCase`（章节\
  \ 1.7.1），而物理实体（如组件文件（章节 2.6））、包（章节 2.8）和包组（章节 2.9））的名称为 `all_lowercase`（章节 2.10）。图\
  \ 3-149 展示了我们可能如何实现隔离的、翻译的 PI 组件 `z_bget_point`，它对应于图 3-148 中的 `bget_point` 组件，章节\
  \ 3.11.7.9。\n\n![](img/fig3-149a.jpg) ![](img/fig3-149aa.jpg) ![](img/fig3-149b.jpg)\n\
  \n**图 3-149：隔离（翻译）过程化接口（参见图 3-148，章节 3.11.7.9）**\n\n由于翻译方面的考虑，PI 层的逻辑接口被迫符合 C 语言的限制。特别是，无法用函数或运算符重载。为了允许组件定义多个公有类型，我们必须在每个自由函数中编码\
  \ `type`（而不只是 `component`）名称。因此，与类型 `bget::Point` 关联的每个函数都以 `z_bget_Point_` 开头，而不是\
  \ `z_bget_point_`（章节 1.7.1）；逻辑和物理名称的凝聚性（例如，参见图 2-22c，章节 2.4.9）确保了我们能够轻松地从函数名找到组件。对于在类型上进行重载的成员函数（例如构造函数所要求的），我们被迫合成如\
  \ `z_bget_Point_fCreate`、`z_bget_Point_fInit` 和 `z_bget_Point_fCopy` 这样的名称。这种以小写\
  \ `f` 开头接 `UpperCamelCase` 的函数风格对许多人提高了可维护性——即清晰度：类型中的 `z_` 明确表示它是 PI 层的一部分。\n\n\
  ### 3.11.7.11 既可从 C++ 可调用的 PI 函数\n\n我们 PI 设计的一个要求是，隔离 PI 层中的翻译函数也可以从使用 C++ 编译器的单元调用^(272)。作为允许\
  \ C++ 客户端使用我们的翻译 PI 的回报，我们现在对一个子系统拥有多组件的隔离“视图”，而该系统对于单个隔离封装组件（章节 3.11.6）来说是不实际的。注意我们在\
  \ `z_bget_point.h` 文件（图 3-149a）顶部使用了条件编译，以便 PI 头文件在 C 和 C++ 中都能编译。\n\n注意，用其他语言编写的客户端通常可以更容易地利用\
  \ C 语言 PI 层进行适配。\n\n如果客户端组件是为 C 编译的，编译器将不对 `__cplusplus` 做任何操作，将其保持未定义。对于 C 语言客户端，我们将采用经典的\
  \ C 用：声明一个 `struct` 并在同一语句中将其别名为与其标签拼写相同的 C 类型。对于 C 客户端来说，返回的是一个具有唯一不透明指针类型的地址。然而，实际上，该类型的声明并没有对应的定义。\n\
  \n\n\n\n\n另一方面，如果客户端组件是用 C++ 编译的，编译器将定义 `__cplusplus` 预处理器符号。`Point` 类将声明在 `bget`\
  \ 命名空间中，并嵌套在 `MyLongCompanyName` 命名空间内。然后，对于翻译单元的剩余部分，`typedef` 名称 `z_bget_Point`\
  \ 将成为 `MyLongCompanyName::bget::Point` 的别名。对于所有 `z_bget_point.h` 的 C++ 客户端（包括 `z_bget_point.cpp`），`z_bget_Point`\
  \ 变成一个完全限定的 C++ 类型名，它可以在 C++ 程序任何地方使用，包括在 `MyLongCompanyName::bget` 命名空间内部：\n\n\
  点击此处查看代码图像\n\n```cpp\n// test.cpp\n\n#include <z_bget_point.h>\n\n#include <bget_point.h>\n\
  \nnamespace MyLongCompanyName {\n\n    namespace bget {\n\n        Point       \
  \ *p1;  // 未限定类型声明\n\n        z_bget_Point *p2;  // 完全限定类型声明\n\n    }\n\n}\n```\n\
  \n注意，`p1` 和 `p2`（上文）在设计上是（完全）相同的 C++ 类型。\n\n### 3.11.7.12 为 C++ 客户端不透明地暴露实际底层 C++\
  \ 类型\n\n正如本节早些提到的，通过完全隔缘的混凝土封装器来实现完全隔离会导致无法接受的运行时间。我们缓解过度性能损失的一种方法是发布底层低级词汇类型（见第二卷第\
  \ 4.4 节）的稳定子集（例如 `bget::Point`），供 PI 层的 C++ 客户端使用。这样做，我们允许此类客户端直接访问底层的 C++ 类型定义，反过来，这使得这些特定类型可以使用其原生的内联和重载\
  \ C++ 函数进行操作和访问。同时，通过不发布所有低级头文件，我们保留了对底层系统其他较不稳定性方面的隔离，例如上面显示的封装类 `ClassW`（见图 3-147，节\
  \ 3.11.7.3）。\n\n然而，为了 PI 层的 C++ 客户端能够成功利用直接访问仍然隔离的接口部分中使用的底层类型（例如 `ClassW`），必须确保每个在\
  \ PI 组件中（不透明地）声明的此类接口类型，与对应 C++ 组件中定义的类型完全相同。过程化接口的这一重要“相同性”属性与在节 3.9 中讨论的物理互操作性是一致的。(273)\n\
  \n^(([273) 注意，这种通过不同的库交付机制（例如直接通过 C++ 类与通过翻译 PI 层）暴露的类型所具有的这种理想属性，对于不同的 C++ 语言交付机制（例如传统的头文件与备受期待的\
  \ C++ 模块机制）也至关重要，随着后者变得越来越广泛可用；见 lakos17a 和 lakos18。\n\n### 3.11.7.13 PI 层核心属性摘要\n\
  \n值得重申的是，实现过程化接口的每个组件在物理和架构上都必须与其封装的底层 C++ 组件分离；也就是说，既不需要隔离也不需要翻译的客户端，不能被强制依赖于任何包含\
  \ PI 代码的 UOR（统一对象表示）。PI 层中的所有组件和函数都应该是相互独立的，除了为了隔离或翻译所需的功能外，不提供任何额外功能。我们希望能够找到定义特定\
  \ C++ 函数的组件（该 PI 函数为该函数提供访问支持），反之亦然（假设存在这样的 PI 函数）。我们希望 PI 层中的所有函数都具有助记性、一致且可预测的名称，以\
  \ (1) 提高易用性，并 (2) 避免随着时间推移新功能提升到 PI 层时可能发生冲突。\n\n为了保持所有选择开放，我们不希望排除 C++ 组件直接使用这种隔缘\
  \ PI 层。最后，为了实现最大的灵活性，我们希望那些被授予直接访问（底层 C++ 头文件的任何子集）的 PI C++ 客户端，能够与 PI 组件本身导出的不透明类型相互操作——即这些\
  \ C 类型需要是实际底层 C++ 类型的（不透明）别名。通过这种方式，在存在适当 C++ 头文件的情况下，PI 层返回的地址允许拥有不透明对象指针的 C++\
  \ 客户端直接与该对象交互——例如通过内联函数、重载运算符、继承、模板等。上述这些（隔缘和翻译的）PI 函数的本质属性再次在图 3-150 中总结供参考。\n\n\
  ![](img/fig3-150.jpg)\n\n**图 3-150：翻译接口的属性**\n\n### 3.11.7.14 过程化接口与按值返回\n\n除了对重载方法进行创意且一致的命名外，还有其他考虑使得过程化接口的创建变得复杂。首先，我们无法高效地按值返回任何不透明对象(274)。在这种情况下分配新实例不仅效率低下，而且违反了资源分配指南（见第二卷第\
  \ 4.8 节）。例如，考虑封装 `bget::Polygon` —— 它类似于但比 `our::Polygon` 更简单（见图 3-18](#ch03.xhtml_ch03fig18)，节\
  \ 3.2.8.15）——该方法按值返回第 `i` 个顶点：\n\n^(274) 注意，在 C++ 中适用引用的地方在 C 中返回适当的 const 限定指针是完全可以的。\n\
  \n点击此处查看代码图像\n\n```cpp\nnamespace bget {\n\n    // ...\n\n    class Polygon {\n\n\
  \        // ...\n\n        // 访问器\n\n        Point operator[](int vertex) const;\n\
  \n        // ...\n\n    };\n\n    // ...\n\n}\n```\n\n与其让过程化接口动态分配一个新的 `bget::Point`\
  \ (图 3-151a)，我们要求 PI 客户端传入要填充的 `bget::Point` 实例（图 3-151b）。通过这种方式，动态内存分配的数量减少到最低，并且对象的分配和释放过程可以限制在一个词法作用范围内，在那里，“窥孔”源代码分析工具可以验证本地分配与释放之间的对应关系，从而粗略地模拟了\
  \ C++ 中自动变量和析构函数提供的安全性。\n\n![](img/fig3-151.jpg)\n\n**图 3-151：适应按值返回的轻级对象**\n\n\
  ### 3.11.7.15 过程化接口与继承\n\n在存在继承的情况下为 C++ 对象编写过程化接口更加复杂。对于通过 PI 层访问（面向对象的）C++ 功能的\
  \ C 和 C++ 客户端无法无法底层基类，因此无法派生新的具体类型。因此，继承层次变成了不可扩展的封闭系统。然而，通过确保我们的不透明 C 类型与底层 C++\
  \ 类型定义兼容，我们保留了暴露基类头文件的选项，从而重新开启 C++ 客户端派生的可能性。\n\n\n\n\n\n底层继承层次结构中指针之间的标准转换必须显式实现。我们需要为这些显式转换函数选择一种一致且可预测的命名法，以提高程序员的生产力。我们需要识别两种类型（包括它们唯一的包名），并配以一致的初始函数名称（例如\
  \ `fConvert`）。为了确保模块化封装的一致性，我们选择将转换程序与物理层级较高的类（即被转换的类）相关联^(275,276):\n\n^(275) 注意，禁止物理循环的组件设计规则（节\
  \ 2.6 节）确保了，即使对于定义在不同组件中的类之间进行用户定义的转换，其底层 C++ 转换操作的实现也将位于较高层的组件中（如果其中一个依赖于另一个，参见图\
  \ 2-47，节 2.6 节），或者如果两个类型物理上是独立的，则位于独立的“工具”组件中（参见图 2-48，节 2.6 节）。\n\n^(276) 与我们的\
  \ C++ 函数级设计方法一致，参数顺序是一致的：输出、输入、参数（参见第二卷第 6.11 节）。\n\n点击此处查看代码图像\n\n```\nToType *\n\
  \nFromType_fConvert2ToType(FromType *from);\n```\n\n例如，从派生类型 `Circle` 到其基类型 `Shape`\
  \ 的隐式标准转换可能如下：\n\n点击此处查看代码图像\n\n```\nz_abcx_Shape *\n\nz_xyza_Circle_fConvert2abcx_Shape(z_xyza_Circle\
  \ *from);\n```\n\n此外，还有为每个转换函数提供一个显式的 `const` 版本（参见第二卷第 5.8 节）：\n\n点击此处查看代码图像\n\n\
  ```\nconst z_abcx_Shape *\n\nz_xyza_Circle_fConvertConst2abcx_Shape(const z_xyza_Circle\
  \ *from);\n```\n\n在深度或多重继承层次结构中（不推荐），我们需要为每个暴露的基类型实现一对显式转换函数。注意，由于无法进行额外的继承，遵循我们指南的设计不需要暴露诸如图\
  \ 3-143、节 3.11.5.1 节所示的部分实现 `ShapePartialImp`^(277)\n\n^(277) 关于深度和多重继承层次结构的进一步讨论，请参见**lakos96**\
  \ 第 6.5.5 节，第 441–445 页。\n\n### 3.11.7.16 过程接口与模板\n\n模板符号是兼容 C 的翻译后过程接口的另一个受害者。例如，我们应该如何在过程接口中表示如下\
  \ C++ 类型：\n\n```\nstd::vector<int>\n```\n\n或\n\n点击此处查看代码图像\n\n```\nxyza::HashTable<std::string,\
  \ double>\n```\n\n在理论上，只要命名规范一致且没有冲突，我们可以为这些类型的任一类型的 C 别名起我们喜欢的任何名称：\n\n点击此处查看代码图像\n\
  \n```\nz_IntVector z_xyza_StrDoubleHashTable      (坏主意)\n```\n\n尽管在这里仔细使用混合大小写和缩写似乎可以提高可读性和易用用性，但遗憾的是，这种方法无法扩展。\n\
  \n注意，正如模板特化（节 1.3.15 节）一样，对于给定的底层 C++ 类模板的不同实例实现过程接口的组件之间，存在多对一的关系。用于创建这些唯一实例的模板类型参数可能来自不同的包（例如\
  \ `matlab::Int`、`pod::string`），而且有用的不同实例化数量可能会随着推移继续增加。我们希望确保我们的命名规范能够可预测地扩展，没有冲突，并且不需要开发者在每次需要包装新的模板实例化时（例如\
  \ `std::vector<xyza::Int>`）^(278)\n\n^(278) 记住，唯一包前缀（节 2.4.5 节）的目的以及实体内内聚命名的部分动机之一，是为了确保我们的命名能够可预测地扩展，不发生碰撞，且不需要开发者在每次需要包装新模板实例化时都查询全局注册表。记住唯一包前缀的目的以及实体内部内聚命名的部分动机之一，是为了去中心化并消除以下以\
  \ `z_` 开头的名称的“竞争条件”：\n\n点击此处查看代码图像\n\n```\nz_std_Vector_int z_xyza_HashTable_std_String\n\
  ```\n\n注意，上面的组件头与其他具有相似名称的实例化（例如 `int`/Int`、`string`/String`、`Date`）保证是不同的，但位于不同的包（例如\
  \ `std`、`matlab`、`bdlt`、`odet`）：\n\n点击此处查看代码图像\n\n```\nz_std_Vector_matlab_int.h\
  \ pod_string.h\n```\n\n且由于只有基本类型名称（例如 `int`、`double`）没有包前缀，它们在语法上无法表示包名；因此，这种命名规范是可预测的扩展，并与并行开发无关。\n\
  \n### 3.11.7.17 减轻过程接口成本\n\n考虑到这种物理命名方法，我们可能会重新考虑逻辑名称，以便在我们过程接口模块内部实现逻辑和物理名称的内聚（节\
  \ 2.4 节）^(279):\n\n^(279) 在此处类型别名中大 `Vector` 和 `String` 的决定有利于 C 用户而非 C++ 实现者，并与鼓励库开发者回溯和隐藏复杂性而不是传递给应用程序客户端是一致的（节\
  \ 0.10 节）。将词法习惯与特定的底层名称分离，对于不熟悉 C++ 标准库的 C 开发者来说，实现了一个一致且直观的过程接口层。\n\n点击此处查看代码图像\n\
  \n```\nz_std_Vector_int                z_xyza_HashTable_std_String_double\n\nz_std_Vector_matlab_Int\
  \         z_xyza_HashTable_fxln_String_double\n```\n\n这种冗长的符号法确实痛苦，但从长期来看，为了实现过程接口层的一致性、可预测性和互操作性是必要的。\n\
  \n\n\n\n然而，有时为具有丰富或复杂接口的 C++ 子系统提供完整的过程化接口可能并非正确答案：(1) 长而丑陋的过程化名称可能会让开发者使用 C 过程化接口变得异常痛苦；(2)\
  \ 为每个底层的 get/set 操作调用 C 函数可能会在运行时产生不可接受的开销。相反，我们可能倾向于在 C++ 层创建一个 `facade`（面面）或 `dashboard`（仪表板）（可能甚至是为特定客户端定制的），但在独立的（更高层次的）UOR\
  \ 中，将所需的功能翻译并整合到一个更小、更窄的 C++ 包装接口中。通过仅为这个新的 C++ 包装器提供隔离的 C 过程化接口（以及任何所需接口类型的本质操作），我们减少了库库和应用程序的开发工作，同时可能提高了运行时性能。请注意，即使底层子系统已经提供了完整的过程化接口，我们可能仍然选择在\
  \ C++ 中创建一个新的自定义 Fac 面，然后将其接口提升到 PI 层，仅仅是为了减少新的 PI 客户端需要编写的痛苦 C 代码的量。\n\n### 3.11.7.18\
  \ 过程化接口与异常\n\n最后，异常对 PI 作者和用户都带来了各自特有的挑战。多年来，编译器使用了多种截然不同的策略来实现异常。其中一种方法是在程序栈上传递额外信息。这样做改变了标准的调用序列，这意味着启用了异常编译的\
  \ C++ 翻译单元与未启用异常的翻译单元（无论 C++ 还是其他）在本质上是不兼容的。此外，这种方法通常会产生大量的额外运行时开销——即使在没有使用异常时也是如此。在这些平台上，确保异常不会“泄漏”到经启用异常编译的组件子系统中是绝对至关重要的。^(280)\n\
  \n^(280) `sutter05`, 第“命名空间与模块”章节，第 62 项，第 114–115 页\n\n某些编译器没有在程序栈上传递异常信息，而是维护一个单独的异常栈。在模型模型中，C++\
  \ 编译器通过 C++ 运行时管理异常——该运行时负责在进入 `main` 之前编排文件或命名空间范围对象的构造（见卷 II，第 6.2 节）。为了让异常在这些平台上工作，必须使用\
  \ C++ 编译器编译 `main`，并使用 C++ 链接器对程序进行适当的后处理。^(281)只要这两个条件同时满足，C++ 异常就可以存在于大部分 C 客户端中。\n\
  \n^(281) 为了让底层 C++ 代码正常工作，实现 `main` 的翻译单元必须使用 C++ 编译器编译并使用 C++ 链接器进行链接；因此，通常会有一个形式如下的\
  \ `library` 组件：\n\n点击此处查看代码图像\n\n```cpp\n#include <cmain.h> // extern \"C\" int\
  \ cmain(char *, char *[])\n\nint main(char *argc, char *argv[])\n\n{\n     return\
  \ cmain(argc, argv);\n}\n```\n\n该组件会被链接器拉入（第 1.2 节），并反过来调用使用标准 C 编译器编译的客户端 `cmain`\
  \ 程序（导致 `extern \"C\"` 链接）。\n\n现在问题变成了如何防止异常跨越过程化层泄漏。解决此问题的一种方法——暴力法——是在每个函数的体的外围包裹一个\
  \ `try`/`catch` 块，例如：\n\n点击此处查看代码图像\n\n```cpp\nz_bget_Polygon *z_bget_Polygon_fCreate()\n\
  \ntry282 {\n    // ...\n    // 正常函数体\n    // ...\n} catch (...) {\n    // ...\n\
  \    // 现在怎么办？\n    // ...\n}\n```\n\n^(282) 注意：这不是语法错误。\n\n这里的问题在于，如果抛出了异常，除了记录它之外，我们也做不了什么。如果底层的异常使用遵循了我们的库接口设计指南（见卷\
  \ II，第 5 章），那么在任何函数级文档中（见卷 II，第 6.17 节）都不会将此类用法作为本质行为的一部分（见卷 II，第 5.2 节）；因此，被的的软件意外无法满足合同条款（例如，因为系统耗尽了虚拟内存）。我们可以尝试将“违约”转换为失败状态（例如通过返回\
  \ 0），但调用者除了优雅退出外，也做不了什么。一种更健壮且具`防御性`（见卷 II，第 5 章）的处理内存溢出异常的方法是通过 `new_handler`（其本身必须被包装）。通过用回调`替换`\
  \ `out-of-memory` 异常机制，客户端应用程序可以在最高层控制当发生真正的异常情况时会发生什么，而无需添加所有异常本意想要避免的臃肿状态检查。在我们看来，使用捕获所有异常（catchall\
  \ exception）的目的是调试；因此，过程化接口函数内部 `catch` 的正确操作可能是打印一条友好的消息，如：\n\n点击此处查看代码图像\n\n```cpp\n\
  assert(\"An uncaught exception has been detected.\");\n```\n\n并终止（见卷 II，第 6.8 节）。\n\
  \n### 3.11.8 隔离与 DLL\n\n完全隔离价值的最后一个证明是能够透明地替换动态加载库的能力。一旦你有了完全隔离的库实现，你就可以提供（二进制兼容的）性能增强和\
  \ Bug 修复（见卷 II，第 5.5 节），而完全不会影响你的客户端！客户端为了使用新更新，并不被强制重新编译甚至重新链接。只要我们能够确保整个程序中版本的一致性，他们需要做的就是重新配置环境以指向新的动态加载库，重启程序，然后就可以运行了！\n\
  \n### 3.11.9 服务面向的架构\n\n顺便提一下，面向服务的架构（SOA）在架构上与过程化接口相似，因为它处于较高的物理层，并完全将其客户端与底层实现隔离开。过程化接口与\
  \ SOA 之间的主要区别在于，在 SOA 中，子系统通常运行在与客户端独立的进程中（通常在远程机器上），并且消息传递取代了函数调用。由于消息传递导致运行时延迟显著增加，这意味着服务执行的工作通常更有实质性，以支撑增加的调用开销。请注意，正如\
  \ PI 函数一样，SOA 接口层位于底层 C++ 实现之上；但与 PI 不同，基于 SOA 的子系统的客户端对该子系统的实现没有*链接时*依赖。我们细粒度的复用组件自然地为实现\
  \ SOA 服务以及 SOA 框架本身构成了理想的底物。^(283)\n\n^(283) 例如，BAS（Bloomberg 应用服务）是 Bloomberg 的核心微服务架构，它使得软件扩展能够超出单个机器可执行文件的范围。它本质上将这里描述的软件复用与执行它的硬件复用结合在了一起。\n\
  \n### 3.11.10 节总结\n\n\n\n\n\n总结来说：在本节中，我们形式化了组件 (1) `封装` 以及 (2) `隔离` 某一实现细节对其客户端的使用的含义。如果用一个等效类（定义在另一个组件中）替换类\
  \ `A` 不需要对组件 `c` 的任何客户端代码进行任何重构，那么组件 `c` 就为`封装了`类 `A` 的使用。相反，如果替换 `B` 不会迫使 `c` 的任何客户端甚至重新编译，则组件\
  \ `c` 就`隔离了`类 `B` 的使用。\n\n文中介绍了三种不同的具有架构意义的全方位隔离技术（参见图 3-141, 节 3.11.4）：(I) 纯抽象接口（“协议”）类（节\
  \ 3.11.5）、(II) 完全隔离的具类包装组件（节 3.11.6）以及 (III) 过程化接口（节 3.11.7）。这些每种方法都有其优缺点。在以下情况下应使用协议：(1)\
  \ 设计已经以继承层次结构的形式制定；(2) 接口的客户端与创建派生类型具类对象实例的客户端不同；以及 (3) 它们不会引入任何额外的运行时开销（例如，通过可能丢失对共享数据的内联访问）。此外，这种形式的全隔离的独特之处在于，它还消除了公共客户端对派生类实现的链接时依赖。\n\
  \n当创建子系统的客户端与使用该子系统的客户端是同一个时，拥有一个隔离包装组件可能是正确答案，前提是不同的完全隔离具类类的数量可以合理地放入单个组件中。鉴于我们已经有一个封装包装器，通过修改包装器内的类使其变为完全隔离以全全隔离的过程（参见卷\
  \ II，第 6.6 节）是简单的。否则，将设计一个全新的包装组件。无论何种方式，这种全隔离都会增加运行时间，有时甚至是不可接受的。对于稳定的接口类型，放宽全隔离是缓解这种开销的一种方法。\n\
  \n最后，如果上述两种方法都不适用（这在大型遗留代码库中可能是可能的），我们可能被迫求助于过程化接口，该接口完全由自由函数组成，这些函数对不透明的用户定义 C\
  \ 风格类型的指针进行操作。这种仅限过程的接口不可避免地产生与非内联函数调用、指针间接和动态内存分配相关的运行时开销。然而，如果编写得当，此类接口通常还可以作为完全用\
  \ C 编写的客户端子系统的自然桥梁。\n\n在本节提出的三种具有架构意义的全方位隔离技术中，我们通常认为，在可行的情况下，协议是最有效的。然而，无论使用何种方法，在之前没有隔离的情况下实现全隔离，总会以运行时开销显著增加的形式付出代价。作为替代方案，考虑使用`部分隔离技术`（参见卷\
  \ II，第 6.6 节），正如在节 3.10 后半部分讨论的自适应 `Pool` 示例中所做的那样。\n\n## 3.12 使用组件进行设计\n\n到本章为止，我们已经探索了合理物理设计和重构的几个重要方面。大多数示例都是较小且集中的，用于说明某个特定的想法、方法或技术。在章节总结之前的最后一个新内容节中，我们将使用一个真实世界的示例来阐明我们在作为软件基础设施\
  \ (SI) 工程师的日常工作中，如何开发`分层可重用软件`（节 0.4）。我们演示的手段将是满足一个真实的请求，即扩展我们当时处于婴儿阶段的软件资本库（节 0.9），以包含一个涉及日期和日历的大量新功能，该请求是由一个应用级业务客户提出的，形式上为一个过于具体的增强请求，其需求具有典型的草率化和不完整性。本节专门用于介绍这一整个“从头到尾”的过程。\n\
  \n#### 3.12.1 原始陈述的“需求”\n\n假设我们的客户被赋予开发一种新的金融服务，我们称之为 `Stock Studio`，^(284)，它需要根据一组特定的市场场景，对某些特定时间跨度内的金融工具组合进行评估。要做到这一点，必须确定可以付款的有效业务日期（称为`结算日`），而为了这样做，我们需要知道哪些日历日是工作日。我们还需要能够确定今天的日期（即能够访问实时钟），以便其能提供投资组合的当前估值。我们没有单独识别这些每一个需求，原始的“规范”是以单一的（几乎是滑稽的）合并请求形式出现的：\n\
  \n```\n为我写一个日期类，告诉我今天是否是工作日。\n```\n\n^(285)\n\n^(284) `Bond Studio` 是 20 世纪 90 年代后期和\
  \ 20 年初由两位（现 Bloomberg）软件工程师 Sumit Kumar 和 Wayne Barlow 开发的一个真实产品，他们广泛使用了组件化方法。(285)))\
  \ lakos12\n\n软件基础设施中首先要意识到的一点是，客户在需求的精神上通常是正确的，对于通常随之而来的设计建议并不如此——例如，应该有这样一个可以判断今天是否是工作日的\
  \ `Date` 类！我们知道一个公司通用的“日期”类作为一种常见的*词汇类型*极其重要（参见卷 II，第 4.4 节），而且我们已经看到（节 3.6.2）构成假日的取决于上下文，并且显然不是日期的内在属性；因此，`Date`\
  \ 对象本身不应该知道它持有的日期是否是假日。我们还看到（节 3.8.1）创建一个自己获取今天日期的日期类，会迫使原本轻量级的 `Date` 类对实时钟产生不当的重量依赖；此外，在类型内部支持此功能将打开与时区相关的逻辑潘多拉盒。仅根据这些警告，就可以断定必须将需求与设计建议分离，并完全忽略后者。\n\
  \n更通地说，通常情况下，一个合理要求添加一个组件的重大增强请求也会导致其他组件的创建，即使它们提供的功能没有被显式请求。经验较少的开发者经常尝试将整个解决方案挤到一个组件中，以避免单独开发和测试多个组件。然而，这样做由于至少两个不同且重要的原因是新手错误^(286)：\n\
  \n^(286) 与非领域特定的部分（如 CREATORS、MANIPULATORS 和 ACCESSORS，参见卷 II，第 6.14 节）不同，在一个可实例化类（相对于工具\
  \ `struct`）的*接口*中需要多个独立的*领域特定*部分，这表明该类可能缺乏足够的焦点，是进一步逻辑和物理重构的候选对象。\n\n\n\n\n\n1.\
  \ 理解、测试和维护几个较小的组件（每个组件都有单一且集中的目的）要容易得多（例如参见第三卷第 10 章）。\n\n2. 我们使用、重用并最终实现`hierarchically\
  \ reuse` 软件的能力，关键取决于这种细粒度的、聚焦的逻辑上（见第二卷第 4.2 节）和物理（见 sections 0.4 和 0.7）封装——这远超了满足当前业务需求所需的程度。\n\
  \n在接下来的内容，我们将尽力避免快速实现即时目标的热忱干扰到我们在过程中妥善捕获分级可重用软件资本（见 section 0.9）的长期贪婪目标——在某种程度上，反之亦然。\n\
  \n### 3.12.2 实际的（推出的）需求\n\nSI 工程师的第一步是将上述所谓的“工作单”——推导出为一系列逻辑合理的需求：\n\n1. **用 C++\
  \ 类表示日期值。** 根据初始请求中的描述，可以合理得出结论：请求者希望以 C++ 对象的形式传递日期值。因此，至少，我们希望有一个能够圆满执行该功能的 C++\
  \ 类型。“圆满执行”包含哪些内容（见第二卷第 4.3 节）对于非专业人士来说可能并非显而易见，但在设计的最高层级，需要某种适用于表示日期的此类类型。\n\n\
  2. **确定“今天”的日期值是什么。** 原始请求几乎没有留下疑问，无论我们想出什么，都必须能够某种方式确定当前日期——推测是来自底层操作系统。虽然我们可能会要求将当前日期作为输入提供，但这很可能不是增强请求作者的本意；否则，他们会说：“……那能告诉我某个\
  \ `given` 日期是否为工作日。”\n\n3. **确定给定的日期值是否为工作日。** 一旦我们获得了今天的日期值，我们就想知道它是否代表一个有效的工作日，推测是将该值加载到我们新的\
  \ `Date` 类的对象中，然后将该对象提供给某些设施，该设施能够根据一个 `Date` 对象（必须代表一个有效的 `date` 值）确定它是否也代表一个工作日。请记住，构成工作日的定义必然对应用上下文敏感，并可能不断更新。因此，任何试图将数据硬编码到软件组件本身的尝试都是徒劳无功。(287)\n\
  \n^(287) 另外请注意，拥有大量的数据成员通常意味着实现的拆分不足。\n\n4. **将解决方案呈现为分级可重用的组件。** 一如既往，作为 SI 库开发者（而非应用程序开发者），我们试图不仅是快速解决这个特定问题，而是彻底解决实现隐含的良好拆分组件所自然解决的问题子领域，从而让未来的项目进展得更快。此外，我们希望识别任何密切相关的功能，这些功能虽然没有明确要求，但在可预见的未来可能被需要。将\
  \ SI 开发者来决定（或预测）此类功能是（或应该是）初始交付物的一部分，还是可以推迟，正如决定此类功能是否妥善地属于初始交付的组件集，或者位于物理分层中的更高层次，在那里可以增量地添加（在未来的某个日期）而无需扰动已经交付（因此理想情况下是稳定的）生产环境软件一样。\n\
  \n在经过重新思考（以及外交谈判）后，我们最终与客户（应用业务赞助人）就了以下修改后的请求：\n\n为我（以及其他人）创建一个良好拆分的、细分的、粒度化的、稳定的（分级可重用的）组件套——妥善分布在构成我们软件资本基础设施的跨公司\
  \ UOR 物理分层中——使得我们（包括其他方面）能够既容易高效地确定，在客户的应用领域范围内，今天是（或不是）一个工作日。\n\n当然，有许多独立功能必须组装并精炼，以实现一个健的、良好拆分的、`hierarchically\
  \ reusable` 解决方案，以满足这些修订后的需求以及我们无疑在过程中发现的许多其他更细微的需求。然而，如果没有一个现成的、相当成熟的软件资本库（section\
  \ 0.9），那么“做对”的成本在前期开发时间方面可能贵得令人接受。然而，由于我们深信创建一个细粒度的、分级可重用的库基础设施所带来的累积效益从长期来看绝对且不可置疑地值得额外的前期成本（section\
  \ 0.8），我们将假设大部分底层准备工作已经完成，并且我们可能添加的任何新组件将始终显著缩短未来项目的上市时间。\n\n### 3.12.3 用 C++ 类型表示日期值\n\
  \n无需过多分析，看起来似乎很清楚——在我们的整个企业范围内缺乏标准或无处使用的 `Date` 类的情况下，提供一个 `Date` 词汇类型（见第二卷第 4.4\
  \ 节）将是一个很好的起点。(288) 我们构想的日期类自然将服务两个目的：第一是持有日期值；第二是提供该值的原始或通用操作，如 `dayOfWeek` 和 `isLeapYear`。事实证明，这些每个功能都将导致新组件的。\n\
  \n^(288) 关于如何设计有效的标准日期类的真实世界讨论，请参见 pacifico12。\n\n在第一个实例中，返回星期（以编译时检查、类型安全的方式）将导致创建\
  \ `DayOfWeek` 枚举。正如 2.6 的图 2-38](#ch02.xhtml_ch02fig38)所示，我们希望将每个此类可重用枚举定义为自己的独立组件，从而\
  \ (1) 促进例行制造（见第三卷第 10 章），(2) 增加独立重用的潜力（section 0.4）。(289) 在第二个实例中，`isLeapYear` 以及其他此类函数提供了单独拆分的机会，但是从完全不同情况（不同客户）的重用角度，而不是基于当前客户的直接需要。在针对当前客户面向组件列出初始设计后，我们将从实现角度回到拆分想法。\n\
  \n^(289) 类似的返回枚举月份的方法（例如 `monthOfYear`）可能会作为未来的添加被考虑，但我们仍然希望接受一个由三个整数定义的序列来分别表示年、月、日。\n\
  \n\n\n\n由于此 `Date` 类型旨在表示一个在当前进程之外有意义的值（见卷卷 II 第 4.1 节），因此它可以被外部化。值有两种不同的外部化方式：(1)\
  \ *从上而下*，即通过公共 API；以及 (2) *从下而上*，即直接从实现中。如果我们依靠第一种方法，那么我们现在不需要处理它，因为它完全是*增加性*的。另一方面，由于日期类型是一种非常稳定、非常底层的词汇类型（见卷卷\
  \ II 第 4.4 节），通过公共 API 进行外部化的开销可能大难以负担。\n\n我们所说的“增加性”是指我们可以单方面地向现有代码库中添加内容以扩展它，而无需修改它——即无需以任何方式修改其任何有的源文件。\n\
  \n最初（约 1998 年），我们提供了原始的流函数，通过一对*切面*（aspect）成员函数 `streamOut` 和 `streamIn`，分别使用（纯抽象*协议*（protocol）类\
  \ `bdex_OutStream` 和 `bdex_InStream`，将值从给定进程的对象中外部化并重新水化回对象。然而，我们很快观察到，由于当时的优化技术水平尚处于原始阶段，导致在这种语境下使用虚函数的代价高到无法接受，同时未能为增加的运行时灵活性带来任何实际的业务价值。对于此类关键、底层且对性能敏感的类型，我们很快开发了一对企业级的外部化概念（约\
  \ 2003 年），我们现在将其称为为 *BDEX* 流。为了继续避免对特定流实现产生依赖，我们将切面方法更改为一对模板成员函数 `bdexStreamOut`\
  \ 和 `bdexStreamIn`，它们分别写入和从任何建模（models）了 `BdexOutStream` 和 `BdexInStream` 概念的实体中读取。针对\
  \ `BdexOutStream` 和 `BdexInStream` 的模型（用于测试和生产）可以在我们开源 BDE 分发版中，`bsl` 软件包组的底层 `bslx`\
  \ 软件包中找到。\n\n一个*切面*（aspect）是一种常见的跨切特性，根据设计，它对于所属的每个类型（在它出现的每个组件中）具有相同的名称并服务相同的目的。例如，`begin`\
  \ 和 `end` 是容器的切面方法，正如 `print`（及其对应的输出运算符 `operator<<`）、`bdexStreamIn` 和 `bdexStreamOut`\
  \ 是值语义类型的切面函数一样。\n\n请注意，这种使用旧式逻辑包前缀（约 1998 年）的方法早于 C++ 命名空间的广泛可用/使用。\n\n提取对象的*值*并以一种独立于进程的方式表示它以便其进行外部传输的过程通常被称为*序列化*。\n\
  \n`bde14`，子目录 `/tree/master/groups/bsl/bslx/`\n\nBDE 最初代表“Bloomberg”（彭博）或“Basic”（基础）开发环境（Environment），取决于其使用的上下文。为了保持历史的一致性，BDE\
  \ 现在已成为一个递归缩写，代表 BDE Development Environment。\n\n为了本次讨论，让我们假设 BDEX 流是该库作者强制要求的该值语义（见卷卷\
  \ II 第 4.3 节）`Date` 类的子需求，并且客户端要么拥有 `bslx` 软件包的访问权限，要么能够在本地对这两个流进行建模（如果需要的话）。\n\n\
  我们完全值语义的 `Date` 类本身的建议接口如图 3-152 所示。\n\n请注意，该类设计在假设的分组（*grp*）包命名空间 `grppk` 中实现，与图\
  \ 3-102 中 `core::Date` 的设计相似。（注：原文中此处存在大量重复句子，翻译时已去重处理）。\n\n**图 3-152：值语义 Date 的建议接口**\n\
  \n在我们的方法中，类功能根据公认的主类别（类方法、创建器、操作器、访问器）进行分组，并按字母顺序排列（见卷卷 II 第 6.14 节）。然而，在某些情况下，将一个主类别分为任意子类别是有意义的，这些子类别也起到划分的作用。\n\
  \n切面似乎是特殊的。\n\n另一种方法——我们选择未采用的方法——创建一个具有不确定值的日期对象，使得对该值的任何访问被视为未定义行为（见卷卷 II 第 5.2\
  \ 节）。虽然在理论上可行、在学术上令人，且在某些情况下可能效率更高，但让未初始化对象的“值”变得定义、已知且可见，有利于实际调试，例如当有人想要检查（例如打印）远程创建的（可能是未初始化的）可疑对象的值时。由于我们永远不会被诱（甚至无法）更改默认值，因此不将该信息纳入\
  \ `Date` 的契约益处相对较小。\n\n也有人建议，与其写“删除此对象。”，我们也许应该直接将文本部分留空\n\n```cpp\n~Date();\n\n\
  \     //\n```\n\n或者表示我们想要将其留空\n\n```cpp\n~Date();\n\n     // 此注释故意留空。\n```\n\n或者以其他方式指示我们不需要注释\n\
  \n```cpp\n~Date();\n\n     // <SSIA>\n```\n\n（在此语境下，它代表“签名说明了一切”。——我们说“删除此对象。”足够了。）\n\
  \n\n\n\n与其在文档中提供一个显式的常量，有人建议我们定义该类实例的最高和最低合法值——例如分别为 `k_MaximumDate` 和 `k_MinimumDate`——然后在文档中引用这些命名常量。我们选择不这样做，原因有以下几点：\n\
  \n1. 特定的字面量可以告诉我们它们是否会引起溢出担忧（这些值通常不会引起）。\n2. 这类常量在代码中很少（甚至根本不需要），因为在我们预期的应用中有效范围几乎总是（实质上）更小，并且被很好地隔离在这个支持的范围之内。\n\
  3. 如果实现在代码中，扩大范围将不再被视为真正的向后兼容更改（参见卷 II，第 5.5 节），就像像此处所示的那样实现时，导致——例如，如下有效的客户端代码：\n\
  \n    点击此处查看代码图像\n\n    ```\n    assert(bdlt::Date::k_MaximumDate == bdlt::Date(9999,\
  \ 12, 31));\n    ```\n\n    可能会失败。\n4. 客户端可以自由地本地定义这些常量（供其自身使用），这将保证它们在库的未来所有版本中保持有效（因为范围可能会增长，但永远不会缩小）。\n\
  5. 如果呈现为代码，则需要部分隔离（参见卷 II，第 6.6 节），以避免在打补丁时立即重新编译所有客户端（例如，参见 图 3-139、第 3.10.5 节）。\n\
  \n公平地说，这个函数的真实动机并不完全明显。这个 `Date` 类型的一个重要不变性是它持有一个有效的日期值。实践中，极不太可能会在有效范围（即 0001 年\
  \ 1 月 1 日到 9999 年 12 月 31 日）内的日期增加某个合理的天数并导致溢出（或下溢）——至少在它最初设计的金融背景下如此。然而，现实是，在大型开发组织中，编写从用户那里获取日期值代码的人并不一定是处理日期的人，有时获取的日期并不是有效的，但还没有人在创建日期对象之前去检查它。\n\
  \n人们可以认为，那些 UI 人员应该接受训练以做得更好的工作，我们对此不同意。人们也可以认为，我们的 `Date` 对象必须始终检查输入，如果无效则“抛出某些内容”，对此我们持反对意见（参见卷\
  \ II，第 5 章）——特别是在可重库软件的背景下。尽管如此，仍然存在迫切需要能够询问那个“禁忌”问题：“这个日期对象真的持有有效的日期吗？”，而且非常清楚，即使它是有效的，也不一定意味着该有效日期值是正确的！\n\
  \n对于这个棘手的接口设计困局，我们近乎“聪明过头”的解决方案是提供这个函数，它 (1) 具有一个合理且有效的用例，而且更重要的是 (2) 具有这种“意外”行为：给一个有效日期对象增加\
  \ 0 天将始终可靠地返回 0（表示成功），但如果你恰好有一个内部表示当前不代表有效值的日期对象，它可能会（在实践中总是会）返回一个非零值（表示成功之外的其他情况），在这种情况下，你就知道进入了未定义行为的世界（参见卷\
  \ II，第 5.2 节）。换句话说，此函数微妙地开启了另一种（冗余的）检查，用于防御客户端的误用，但是——请仅在适当的断言级构建模式下（参见卷 II，第 6.8\
  \ 节）。\n\n注意，`setYearMonthDayIfValid` “操作器”方法的返回类型以及 `addDaysIfValid` 的返回类型都是 `int`，而（静态）“类方法”\
  \ `isValidYearMonthDay` 的返回类型是 `bool`。（注意，我们以一种类似于切面的（aspect-like）的方式利用了常用的方法前缀（例如\
  \ `isValid`）和后缀（例如 `IfValid`）；参见卷 II，第 6.11 节。）在我们的方法论中（参见卷 II，第 6.14 节），我们努力将回答问题的函数（通常不改变状态）与尝试“做某些事情”（必然意味着状态改变）的函数隔离开。具有是否答案的问题以这种形式表述——例如\
  \ `isValid`、`hasProtocol`、`areParallel`——并始终返回 `bool`，其中 `true` 表示“是”，`false` 表示“否”。相比之下，操作器方法要么“成功”要么“失败”。由于只有一种成功的方法，但可能有多种失败的方法，我们遵循\
  \ Unix 传统，在成功时返回 0，否则返回非零值（参见卷 II，第 6.12 节）。\n\n如前所述，我们的做法是在每个主要章节内按字母顺序排列函数。当我们认为需要其他排序方式时，我们的惯例是插入一个居中的标题来中断流并重新开始字母排序。任何任意标题都可以实现这种中断；然而，此脚注所附的\
  \ `Aspects` 标题被处处保留，用于指示一个在所有类型中相应函数都是统一的区域，讽刺的是，它本身就是一个 aspect（第 2.4.8 节）；另见卷 II，第\
  \ 6.14 节。注意，如果我们觉得有，我们可以在 `day` 之前或 `year` 之后插入任意标题，以分离 `getYearMonthDay` 方法，以便各个字段访问器聚集在一起。\n\
  \n要理解我们所指的值（value），请参见卷 II，第 4.1 节。要理解类型具有值语义（value semantics）意味着什么，请参见卷 II，第 4.3\
  \ 节。\n\n此运算符以及随后的三个关系运算符超出了值语义的涵盖范围，值语义的范围仅限于正确地表示相同的值（或不相同）。也就是说，并不是所有值语义的类型都有（或应该有）关系运算符。\n\
  \n与前置递增/减运算符不同，相应的后置运算符按值返回对象，因此被正确地实现为自由（即非成员）函数，部分是为了防止操作符修改未命名的临时变量（这几乎是一个错误），而不仅仅是因为它相对于前缀对应项可以更高效地实现，从而避免了对友元访问的需求（参见卷\
  \ II，第 6.13 节）。\n\n注意，对于更通用的消费，以后证明我们的 `Date` 类支持年/日的形式的日期值（以及年/月/日）可能是值得的。此外，请注意，我们最初选择采用（非推测的）格列利历，这与\
  \ Unix (POSIX) 标准一致，因为在 `Date` 最初构想时（约 1997 年）这是主流。从那以后，世界似乎统一了推测格列利历，这迫使我们在在本节稍后对这一关键词汇类型（参见卷\
  \ II，第 4.4 节）做出了极其困难的更改。\n\n出于业务风险的原因，我们最终选择在内部推迟采用这一更改。\n\n\n\n\n\n针对我们初始设计中 `Date`\
  \ 类部分的草图，仅包含了满足我们四个合成需求之首个需求的所有方面所需的面向客户端的本质组件，请参阅图 3-153。请注意，`Date` 类本身及其附属的 `DayOfWeek`\
  \ 枚举——它们各自位于一个独立的组件中——都都是（完全的）值语义类型（参见卷 II，第 4.3 节），并因此，它们代表了在当前运行进程之外（以及之内）均有意义的值。为了让这两个新类型都能够通过\
  \ BDEX 流对其值参与（高效的）外部化，每个类型都需要一个依赖（隐式地）于相关 BDEX 概念的方法模板。\n\n![](img/fig3-153.jpg)\n\
  \n**图 3-153：`Date` 类及其附属面向客户端的组件**\n\n请注意，目前我们忽略了关于最终组件将所在的包（packages）的任何概念（节 2.4）。尽管绝对物理位置（节\
  \ 3.1.4）最终对于成功重用至关重要，但我们仍处于宏观设计的早期阶段。一旦初始设计完成，并确定且更充分地阐述了实现组件，我们就可以开始考虑将每个新组件分配到构成我们软件资本（Software\
  \ Capital）的企业级仓库中的相应适当位置，当然要保留它们的相对物理依赖关系（例如，参见图 0-56，节 0.9）。\n\n### 3.12.4 确定“今天”的日期值\n\
  \n我们的下一个目标是满足第二个需求，即让客户端能够（并在理想情况下方便地）向我们的库请求当前日期的值。虽然这项任务看起来相对简单，但存在许多复杂因素，例如区分本地时间和\
  \ UTC 时间。^(309) 无疑，我们的库需要提供这两种时间值，因此我们需要相应的零参数函数，例如 `local()` 和 `utc()`——每个函数通过值返回一个\
  \ `Datetime` 对象（见下文）——并适当地地嵌套在工具 `struct` 中作为 `static` 方法（参见图 2-23，节 2.4.9）。按照我们的命名法，我们希望为我们为此工具选择的任何描述性名称以及其他类似的\
  \ `struct` 类型附加 `Util` 后缀（节 3.2.9.2）。\n\n^(309) 注意，UTC 代表协调世界时，以前称为 GMT（格林尼治标准时间）。尽管两者经常通用或混淆，但\
  \ GMT 是一个时间*区*，而 UTC 是一个时间*标准*。\n\n我们如何命名这个工具将被证明非常重要。由于我们建议的工具带有重大的物理依赖（即对底层系统的依赖），例如，我们不想简单地将其命名为\
  \ `DatetimeUtil`。此外，我们可能希望（事实上，我们已经知道我们会）让它返回 `Datetime` 以外的时间相关类型的值。因此，基于这两个原因，我们故意选择*不*将所需的工具命名为\
  \ `struct DatetimeUtil`。相反，我们选择了一个更具体且描述性的名称 `CurrentTimeUtil`，其详细原因稍后将变得更加清晰（就在图\
  \ 3-155 下方）。同时，该工具组件的初始接口草图（以及省略的函数级文档）在图 3-154)。\n\n^(310) 按照，原始设计将随时间继续演变和增长，以适应其他并非初始用例驱动的功能。例如，其他类型，如\
  \ `DatetimeTz`（它带有时区偏移），也应该能够通过 `static` 方法（如 `asDatetimeTz`）返回当前时间。此外，在某些多进程环境中，从一个不断由其专用进程（使用另一个处理器）更新的共享内存位置访问当前时间，可能比通过系统调用（使用同一处理器）更高效。因此，该工具的更成熟的实现很可能也会支持该功能（通过用户提供的回调和支持静态方法）。最后，我们希望确保在组件级文档中正确界定所有的成对线程安全保证（参见卷\
  \ II，第 6.1 节）（参见卷 II，第 6.15 节）。\n\n![](img/fig3-154.jpg)\n\n**图 3-154：`struct CurrentTimeUtil`\
  \ 的接口初始草图**\n\n请注意，我们预计了一个额外的函数 `now()`，它返回一个 `ls::Interval` 对象，这最终将用于解决我们的第三个需求——即确定给定的\
  \ `Date` 是否代表工作日。^(311,312) 该函数返回时间间隔而不是绝对时间，部分是由于类 Unix 基于纪的系统中与时间相关的函数的历史原因。\n\
  \n此 `CurrentTimeUtil struct` 的是 `Datetime` 类型对象，而不仅仅是 `Date`，因为获取日期的同时获取时间比单独获取日期是更通用的操作。`Datetime`\
  \ 由两个独立的值 `Date` 和 `Time` 组成；后者提供一天中的时间，且原始的分辨率为毫秒。^(313)。\n\n^(313) 由于金融行业对 MiFID\
  \ 的监管要求（约 2015 年），`Time` 以及 `Datetime` 类型以后需要修改以表示微秒分辨率——理想情况下不影响现有客户端（参见卷 II，第\
  \ 5.5 节）。\n\n对于缺乏某些领域背景的人来说，时间*持续时间*的单位与时间*点*（例如 `Datetime`）的单位不同可能会让他们惊讶。虽然两个无单位整数之差本身是一个整数，但两个时间点之差是一个持续时间（例如\
  \ `DatetimeInterval`）。此外，持续时间的概念在逻辑上*先于*时间点的概念。也就是说，所有不涉及其他类型的对持续时间的操作的结果都是持续时间。时间点则不能如此。例如，两个持续时间的和或差仍然是一个持续时间：\n\
  \n点击此处查看代码图像\n\n```cpp\nDatetimeInterval operator+(const DatetimeInterval& lhs,\n\
  \n                           const DatetimeInterval& rhs);\n\nDatetimeInterval operator-(const\
  \ DatetimeInterval& lhs,\n\n                           const DatetimeInterval& rhs);\n\
  ```\n\n相反，两个时间点之差不是时间点，而是一个持续时间（并且没有增加两个时间点的意义概念）。\n\n\n\n\n\n点击此处查看代码图像\n\n```\n\
  DatetimeInterval operator-(const Datetime& lhs,\n                           const\
  \ Datetime& rhs);\n```\n\n因此，定义持续时间（duration）类型的组件在物理层级结构中，自然比兼容的时间点（time-point）组件处于更底层。换句话说，定义我们\
  \ `Datetime` 类的组件中的逻辑功能允许了解（并使用）定义 `DatetimeInterval` 类的组件，但反之则不然。到为止的完整设计——包含了我们对第一个合成需求（即孤立表示日期值）的解决方案——已作为参考提供在图\
  \ 3-155 中。\n\n![](img/fig3-155.jpg)\n\n**图 3-155：`CurrentTimeUtil` 及其面向客户端的辅助组件**\n\
  \n正如我们之前看到的，我们选择在 `CurrentTimeUtil` 中包含一个方法 `now()`，该方法返回一个相对于已知“元”（epoch）时间点的偏移量（持续时间）的当前日期和时间值。用于表示这种特定持续时间的预存类型是\
  \ `TimeInterval`。鉴于 `TimeInterval` 和 `DatetimeInterval` 都是持续时间，我们似乎应该选择其中一个（参见第二\
  \ 卷，第 4.4 节）。然而事实上，这两种持续时间具有不同的属性（例如，对象大小、精度），并且服务的几乎完全不相同的客户端群体。\n\n首先，`TimeInterval`\
  \ 旨在与系统级操作配合使用，例如超时操作，这些操作（从历史上来看）需要比面向金融等应用领域的时间点更高的精度（例如，纳秒）。在金融领域，毫秒级的时间点分辨率（从历史来看）已经足够了，直到最近，监管要求才迫使我们在\
  \ `Time` 和 `Datetime` 中引入额外的精度（例如，微秒）。注意，即使是微秒级分辨率，八字节的内存占用也足以识别 10,000 年范围内的每一个时间点，这正是\
  \ `Datetime` 类型承诺支持的。\n\n此外，高精度系统级偏移（持续时间）所需的值范围在实践中总是比时间点所需的得多。由于通常倾向于将此类值的表示限制在一个机器字以内（例如出于性能考虑），但通过显著缩短该持续类型的可表示范围，可以实现更高的精度并保持八字节的内存占用。最后，由于我们已经知道以后需要以这种特定类型获取当前时间（用于超时），我们选择现在包含这种极可复用的功能\
  \ `now()`。(314) 注意，在微秒级分辨率下，八字节的时间点能够处理 $2^{64} / (10⁶ \\cdot 60 \\cdot 24 \\cdot\
  \ 365.25)$ 大约 584,542 年范围（对于我们的 `Datetime` 类型来说足够）。但在纳秒级分辨率下，有效范围缩小到 585 年以下，但即使是符号值，292\
  \ 年对于实践中可能需要的任何系统级偏移（例如超时）仍然足够。\n\n### 3.12.5 判断日期值是否为工作日\n\n在解决了表示日期以及将今日的值加载到\
  \ `Date` 对象的合成需求后，我们现在转向更复杂的任务：设计允许库客户端判断给定日期是否为工作日的组件。从第 3.6.2 节我们知道，像 `isHoliday`\
  \ 或更准确地说 `isNonBusinessDay` 的功能不可能是 `Date` 的方法。一种（物理上合理的）设计（在图 3-106 中所示），第 3.6.2\
  \ 节中所承诺的，我们现在将从值语义角度探索一种更加模块化、灵活且运行高效的解决方案（参见第二 卷，4.3）。\n\n#### 3.12.5.1 日历需求\n\n\
  我们将从识别若干实际需求（包括性能需求）开始，然后探索它们如何塑造我们的设计和实现。通用需求规定我们需要高效地判断给定日期是否为工作日。然而，未明确说明的是，对于许多重要应用程序（包括本文处理的），这个特定问题在单次运行中可能会被反复询问和解答——可能多达万亿次。\n\
  \n因此，判断给定日期在给定上下文是否为工作日的摊销成本必须极低。任何每次判断都需要跳出进程的解决方案都是不可行的。相反，需要一种预先组织信息的方法，使得在连续日期序列中判断下一个日期是否为工作日的增量运行开销变得微乎其微。\n\
  \n然而，这种极高的运行性能要求并不是唯一的约束。对于金融系统，通常会有几十个、上百个（甚至数千个）不同的上下文在这些上下文中对日期进行查询。例如，一个司法管辖区或地区（例如纽约市）的非工作日（例如周末和假期）可能与另一个地区（例如伦敦）完全不同。事实上，什么构成工作日取决于我们具体在讨论什么。例如，存在某些某些股市可能关闭但银行却开放的日期。债券的特殊日期（称为结算日）可能与金融工具的交易日不同。(315)正如预期的那样，没有自然法则来约束此类数据。此外，这些信息可能会在短时间内发生变化，因此必须频繁（快速地）从外部数据源重新获取（例如以\
  \ C++ 对象的形式）。因此，除了能够访问数据以快速回答工作日信息外，我们还必须紧凑地存储这些数据，以便跨进程边界的高效传输。\n\n(315) 因此，在给定的地区内，可能被认为是执行某种金融工具（例如股票）交易的有效“工作日”，对于另一种金融工具（例如抵押贷款证券、商业票）来说可能不被视为工作日。此外，特定的某一天是否为循环的非工作日（即周末）也不能硬编码。例如，在世界的某些地理区域，周五和周六是周末是很常见的，而在另一些地区，可能是六天制工作，只有一个周末日。\n\
  \n\n\n\n\n在我们的词汇中，`calendar`（日历）是一种 C++ 类型，其 `value` 代表一段连续日期范围内的 `business days`（工作日）集合。如何获取这些信息，对于我们的\
  \ `calendar-class` 设计而言，与实现 `std::vector` 的相关性没有区别。因此，必须提供一组充分（且完整）操饰符方法，用于添加（个别）假期和（循环的）“周末”日。图\
  \ 3-156 提供了我们提议的 `Calendar` 类型的一个简略接口供参考。\n\n`booch94`, `section 3.6`, ppp. 136–143（特别是第\
  \ 136–137 页和第 143 页的总结）。“充分”意味着足够满足首次使用。“完整”意味着足够满足所有类似的用途。\n\n虽然最初没有考虑过，但循环周末像时区一样，有时会随着时间而变化，因此最终需要一个额外的、更复杂的接口来指定循环的非工作日——即，不仅仅是为整个日历设置周末日。\n\
  \n除了知道给定日期是否为工作日外，知道是哪个假期（如果有的话）导致给定日期成为非工作日有时也用。尽管不如 `date` 那样常见，但 `Calendar` 类型仍然可以广泛用于公共接口（见卷卷\
  \ II，第 4.4 节）。因此，理想情况下，我们希望在（大多数）公共接口中仅用一个 C++ 类来表示它。另一方面，保持日历数据的内存占用较小也是本质的设计目标，因为可能存在成千上万个区域需要导入到单个进程中并共存。我们还必须确保不会给用户带来由于每个实例中存储复杂的假期信息而产生的任何开发负担，而且对假期库的任何物理依赖都是不可接受的。此外，对于那些不在乎某一天为什么不是工作日的用户，不应产生任何速度或空间开销。考虑到这些限制，我们的解决方案是允许感兴趣的客户端通过名为\
  \ `holiday code`（假期代码）的小整数索引形式的哑数据，在 `Calendar` 中关联假期信息。然后，由客户端根据这些索引在适当单独管理的表（例如\
  \ `std::vector<string>` 类型）中查找特定假日的所需信息。\n\n![](img/fig3-156a.jpg) ![](img/fig3-156b.jpg)\
  \ ![](img/fig3-156c.jpg)\n\n**图 3-156：`Calendar` 类接口的初始（简略）草图**\n\n### 3.12.5.2\
  \ 多区域查找\n\n金融软件通常需要根据特定某天在多个区域内是否为 `business day` 来调整给定日期。例如，确定某特定交易可以结算的日期可能需要反复尝试以确定给定日期在两个不同地区（例如，买方和卖方的地区）是否同时为工作日。解决此问题的方法之一是创建两个日历，提两次问题并取结果交集。然而，这种方法有两个缺点。\n\
  \n对于复杂的“多腿”交易，区域的数量可能是三个、四个或更多。\n\n要求多个日历对象的第一个问题是，通用算法（例如 `modified following`，见第\
  \ 3.12.10 节）如果实现为仅接受单个日历和日期的函数，将无法重用——至少不像如果只有一个日历参数时那么容易。第二个问题是，此类子程序通常被以极高的频率应用（例如在许多投资组合、时间跨度和场景的交叉积上）。每当我们需要知道给定日期在多个区域内是否为有效的结算日时，执行两次或多次查找（每个区域一次）然后每次取交集，在许多重要情况下将产生无法接受的低效性。\n\
  \n幸运的是，由于 `Calendar` 可以被看作是一个范围内的工作日集合，我们可以为基础集合操作如 `and`、`or`、`xor` 和 `sub` 定义语义。例如，两个日历的逻辑\
  \ `and` 代表这两个日历范围的交集以及工作日的交集。如果需要，也可以为日历定义类似于 `or`、`xor` 和 `sub` 的操作；然而，`and` 到目前为止是这些类集合操作中最有用的。通过快速预计算各个区域工作日的交集，我们实现了卓越的互操作性、重用性和性能。\n\
  \n例如，给定假期的 `holiday code` 只有在 `both` 初始日历中都存在时才会保留在结果中。另一种或许更有用的行为可能是，如果该假期代码在初始日历的\
  \ `either` 中，则保留该假期代码。只要完整指定了精确的行为（见卷卷 II，第 5.2 节），提供一种或两种行为都是可以接受的。类似于 `or`、`xor`\
  \ 和 `sub` 的操作含义不那么明显，并且可能导致日历范围不连续；因此，日历的合约（见卷卷 II，第 5.2 节）可能需要扩展，并仔细定义额外行为以防破坏其不变性（见卷卷\
  \ II，第 5.5 节）。或者，这些操作可以完全省略，直到出现业务需求。\n\n考虑到在分级重用软件中隐含的细粒度物理渲染之上的日历信息的所有这些要求，我们在开始为此\
  \ `Calendar` 类型提供完整接口之前，必须创建许多复杂的、高性能的 `client-facing` 组件。第一步是以空间高效的形式在一个在我们称为 `PackedCalendar`\
  \ 的类中捕获原始信息。\n\n我们说的 client-facing（面向客户端）是指旨在让此子系统的客户端直接使用的组件，而不是那些额外的、底层的“实现”组件（无法通过面向客户端的组件进行编程访问），后者仅用于实现完全分解（见卷卷\
  \ II，第 6.4 节）、分级重用的（第 0.4 节）子系统。\n\n`PackedCalendar` 对象持有与 `Calendar` 相同的 `value`（见卷卷\
  \ II，第 4.1 节），因此必须包含表示 `Calendar` 所需的所有信息，但其方式是极其节省空间的，无法提供足够高的运行时性能。每个 `PackedCalendar`\
  \ 实例必须代表有效的日期范围、该范围内的哪些天是假期，以及一周中的哪些天被视为周末。\n\n\n\n\n\n与 `Calendar` 一样，`PackedCalendar`\
  \ 对象可能会与每个非周期性的非工作日关联一个或多个唯一的、较小的非负整数假日代码。对于没有关联假日代码的 `PackedCalendar` 对象——就像没有虚函数的类一样（见第二卷第\
  \ 4.6 节）——为了保留这一补充功能，（本质上）必须产生零运行时开销（见第二卷第 6.7 节）。\n\n我们可以在 `PackedCalendar` 类型内部通过以下方式表示工作日：一个开始日期、一个结束日期、一个包含周末集合的字节级\
  \ `DayOfWeekSet` 类，以及一个从开始日期的无符号整数偏移量数组（见下文，空间效率型），其中每个偏移量表示一个假日。所有空日历范围都是等价的，并通过\
  \ `canonically`（见第二卷第 4.4 节）表示，即开始日期和结束日期分别持有最大值和最小值（也称为“塌缩范围”/imploded range）。\n\
  \n鉴于我们可以用一个位来表示的一周中的每一天是否存在，一个实现这七天幂集的类将适应在一个字节内（还空出一个位）；因此，这里不需要动态内存分配。\n\n请注意，如果任何假日都没有关联的假日代码，则代表此类代码的整个数据结构永远不会被（类似于\
  \ `std::vector` 或 `std::string` 的典型实现）。\n\n在 `PackedCalendar` 之前，我们讨论过的实现类型都不需要动态分配内存。鉴于\
  \ `PackedCalendar` 内部将包含嵌入式数据结构——例如表示假日序列的结构——它们需要可变（即使不是无界）的内存，且 `Calendar` 对象的一个数据成员之一是\
  \ `PackedCalendar`，这两种日历类对象都可能在其整个生命周期内分配内存。每当可重用类型可能将动态分配的内存作为其对象的托管资源时，我们都希望能够精确地指定该内存的来源。由于各种原因（例如运行时性能、整对象放置和每个对象的指标，这些我们将在第二卷第\
  \ 4.10 节中进一步探讨），我们希望能够以对象为单位控制动态内存源，且不影响对象的 C++ 类型。我们的解决方案是允许客户端在构造时提供一个实现（纯抽象）`bslma::Allocator`\
  \ 协议的特定具体分配器的地址；如果没有提供分配器，则使用相应的`默认分配器`（通常是 `bslma::NewDeleteAllocator`）（见第二卷第 4.10\
  \ 节）。为了为我们的 `Calendar` 类提供初始接口所需的面向客户端组件的高级图示，该图已正确集成到我们之前的基于组件的设计中，供参考，见[图 3-157]。\n\
  \n即，动态分配/释放序列并不局限于对象的单个公共成员函数的作用域内（见下文/第二卷第 4.10 节）。\n\n![](img/fig3-157.jpg)\n\n\
  **图 3-157：`Calendar` 及其辅助面向客户端组件**\n\n### 3.12.5.3 日历缓存 (Calendar Cache)\n\n此时，该设计中面向客户端的基础部分似乎已经完成。给定一个填充了适当工作日信息的\
  \ `Calendar`，我们现在可以使用它来判断给定日期是否为工作日。我们做完了吗？没有。为了让应用程序开发者使用这一基础设施，我们需要为系统提供某种通用设备，以便将特定信息存入日历中，并从程序的不同部分找到该日历。也就是说，我们需要在运行进程中的某个地方存储与某些本地唯一（例如字符字符串）标识符相关的\
  \ `Calendar` 数据。我们将此类设施称为 `日历缓存` (calendar cache)。\n\n在我们的设计中，`CalendarCache` 类是一种`机制`见第二卷第\
  \ 4.2 节），提供了从唯一字符串名称到日历数据的映射。然而，该类不仅仅是一个简单的 `std::map<std::string, Calendar>`。日历数据的内部表示形式可以是\
  \ `Calendar, PackedCalendar` 或其他形式。此外，`CalendarCache` 还有其他方面——例如缓存未命中时做什么，以及何时认为滞留数据过期——这些对其预期用途至关重要，而原始的\
  \ `std::map` 无法无法这些。\n\n即使 `CalendarCache` 的当前实现仅仅是字符串到日历的映射，未来的增强也可能使这种未封装实现的稳定性变得出现问题（见第二卷第\
  \ 5.6 节）；因此，我们选择像这里一样，即使是将该特定实现也封装在一个命名的类中（即不是 `typedef`）。\n\n为了使 `CalendarCache`\
  \ 足够灵活以允许通用重用，我们需要提供一种可扩展的机制，让高级客户端（例如 `main`）能够对 `CalendarCache` 实例进行编程，按需加载关联日历数据。我们在这里采用的架构方法（[图\
  \ 3-158a]）本质上也是`横向`的（第 3.7.5 节）。定义一个抽象接口类型 `CalendarLoader`。每个 `CalendarCache` 实例在构造时都将获得一个派自此（纯抽象）`CalendarLoader`\
  \ 协议的适当具体类的地址（图 3-158b）。当按（名称）请求一个不存在此类日历条目时，`CalendarCache` 将调用持有的 `CalendarLoader`\
  \ 对象的虚拟 `load` 方法（图 3-158c），以填充作为第一个参数引用传递的 `PackedCalendar` 类型的对象。如果调用成功，则关联的 `Calendar`\
  \ 数据提供给 `CalendarCache` 的原始客户端；否则，则返回一个错误状态（例如空指针）（图 3-158d）。\n\n请注意，通过指针返回 `Calendar`\
  \ 会使得为特定进程失效缓存变得困难；另一方面，如果日历数据发生变化，按值返回的日历日期将是最新的。在典型的金融应用程序中，如果日历数据需要在日内更改，简单地“重启”进程以重置缓存并不少罕见。然而，有更好、更健壮的方法，例如返回代理对象（例如共享指针）来实现此类目标。\n\
  \n![](img/fig3-158a.jpg) ![](img/fig3-158b.jpg) ![](img/fig3-158c.jpg) ![](img/fig3-158d.jpg)\n\
  \n**图 3-158：`CalendarCache` 与 `CalendarLoader` 的交互**\n\n这种特定的缓存策略——即受时间（而非物理）限制的——源于某些用户，他们认为需要某种机制来确保调用者的数据不会*太旧*（例如，作为频繁失败的数据库触发器的备份）。基于固定内存的限制（例如\
  \ LRU）是一种更典型的算法，且有人建议这里的默认缓存算法以及功能的拆分都是次优的。（*不予争辩*。）\n\n\n\n\n\n(330) 注意，我们也可能通过值传递或通过参数列表返回日历对象，就像上面\
  \ `load` 中做的那样。然而，在实践中，我们将选择通过一个基于共享指针的代理对象（仅提供对 `Calendar` 的不可修改访问）来返回日历，以便对进程内的日历数据进行线程安全的更新。例如，`bsl::shared_ptr<const\
  \ Calendar> getCalendar(const char *calendarName);`\n\n参见 `bdlt_calendarcache` 组件的\
  \ `bdlt_callendarcache.h` 头文件 (bde14,子目录 `/groups/bdl/bdlt/`)。\n\n我们在这里讨论的只是高层组件架构。一些细微的问题，例如缓存是否可以显式失效（刷新），将留给实现\
  \ `CalendarCache` 组件的负责详细接口和契约设计的开发者（见第二卷，第 5 章）。在在设计的这个阶段，重要的是加载器在被调用时，必须获得对由 `CalendarCache`\
  \ 对象指定的 `PackedCalendar` 的可写访问。因此，虽然 `CalendarCache` 接口本身必须足以添加新的名称/日历对，但必须能够从调用客户端加载器（在构造时提供）返回的原始数据（通过参数列表中的\
  \ `PackedCalendar` 对象的引用）中关联新的或更新的日历值。将 `CalendarCache` 和 `CalendarLoader` 整合到组件类图\
  \ 图 3-157、节 3.12.5.2 中——包括之前预计（见 图 3-155，节 3.12.4)）在 `CalendarCache` 接口中使用 `TimeInterval`（用于超时目的）——结果在\
  \ 图 3-159 中供参考。\n\n![](img/fig3-159.jpg)\n\n**图 3-159：`CalendarCache` 及其面向客户端的辅助组件**\n\
  \n### 3.12.5.4 日历库的应用程序级使用\n\n回到原始问题，我们希望提供必要的基础设施，允许应用程序开发者判断在他们的语境下今天是否为工作日。为此，我们几乎已经完成了。我们现在可能倾向于断言日历缓存是一个进程范围内的资源，并将其设计为单例。然而，这样做将是一个错误。某些客户端拥有银行假日的缓存，而另一些客户端可能需要零售商店假日的缓存，这是完全合理的。在单个进程中让此类客户端相互互斥（节\
  \ 3.9.4）是不优优的。相反，我们可以为 `CalendarCache` 的客户端功能创建一个抽象接口。我们可以将此接口命名为 `CalendarFactory`，并使用适配器\
  \ `CacheCalendarFactory`^(331) 来适配 `CalendarCache` 的适当子功能，如 图 3-160a 所示。\n\n^(331)\
  \ 注意，通过在协议名称前加上一个描述描述的短语来识别抽象接口的具体实现，是我们的标准命名惯用法之一（见第二卷，节 6.10）。\n\n![](img/fig3-160a.jpg)\
  \ ![](img/fig3-160b.jpg) ![](img/fig3-160c.jpg)\n\n**图 3-160：日期/日历基础设施的应用程序级使用**\n\
  \n在他的书《C++ 语言》（第 4 版）的序言中，Bjarne Stroustrup 引用了 David J. Wheeler 的话：“计算机科学中的所有问题都可以通过另一层间接来解决，除了间接层数过多的问题，”^(332)，而这正是我们即将在这里观察到的发生的事情。尽管如此，配置这样一个看似复杂的设施出奇地简单直接，如\
  \ 图 3-160b 所示。首先，我们创建一个派自 `CalendarLoader` 的具体对象，例如 `MyDatabaseCalendarLoader`。然后，我们创建一个派自\
  \ `CalendarFactory` 的具体类型实例，例如 `CacheCalendarFactory`，并在（在其构造时）向其传递直接在源代码上方定义的具体日历加载器的地址。现在，我们创建一个整个子系统或应用程序的实例，这里由\
  \ `jsl::Application` 类型表示。最后，我们运行应用程序并返回其布尔结果。\n\n^(332) stroustrup00, “序言,” p.\
  \ v\n\n在应用程序内部使用基础设施（如 图 3-160c 所示）也是简单且高效的。首先，我们获取适当区域的日历（例如，纽约开放）。然后，我们获取今天的日期。接下来，我们在日历中查找该日期。最后，我们返回判断是否为工作日的结果。通过引入日历工厂，我们提供了一个良好分、物理上合理且高度灵活的基础设施，应用程序客户端将能够使用。虽然这通常是一种实用的设计策略，但对于我们可能在财务（例如，“结算日”）目的上所需的内容，抽象\
  \ `CalendarFactory` 提供的任何额外灵活性可能都是过之了。我们通常在预计行为会有变化时创建协议，而不是值会有变化时。^(333) 既然我们已经有一个表示日历值的具体类型，并且有种足够灵活的方法来获取我们尚未拥有的有效日历（即通过\
  \ `CalendarLoader` 协议），这种额外的间接层并没有实用的用处。因此，我们可以合理地选择放弃这个定制点，简单地创建一个或多个可能的全局可访问的（例如，单例）`CalendarCache`\
  \ 类型对象，并在整个应用程序中使用，这正是我们成功选择的做法。为了这种更极简主义方法的详细架构图在 图 3-161 中供参考。\n\n^(333) cargill92,\
  \ section “Value versus Behavior,” pp. 16–19, specifically p. 17 (see also p. 83\
  \ and p. 182)\n\n![](img/fig3-161.jpg)\n\n**图 3-161：使用日历库的财务应用程序**\n\n### 3.12.6\
  \ 解析和格式化功能\n\n除了最初客户端请求明确暗示的需求外，还有大量与日期相关的通用功能需要识别和产品化。例如，正确处理 `Date` 值可以写入的所有格式——更不用说读取——本身就会产生大量的软件，这些软件可能会随着时间的推移而增长演变。由于由于原因，在定义值语义类型的同一组件中包含解析甚至格式化（以任何领域特定的自定义方式）该类型文本表示的功能通常是一个错误。注意，标准库中的容器完全没有提供此类输出程序。\n\
  \n让我们暂时考虑在同一组件中将 `Date` 的 `istream`（输入）运算符作为自由运算符：\n\n```\nstd::istream& operator>>(std::istream&\
  \ stream, Date& date);\n```\n\n点击此处查看代码图像\n\n\n\n\n\n图 3-162 仅说明了随时间推移可能会产生并将持续存在的许多考虑因素之一。即使是在输出流上渲染一个值，也会增加大量的复杂性、依赖关系以及不可避免的不稳定性，这正是为什么我们标准的共存值语义运算符仅限于写入对象的值（写入\
  \ `std::ostream`），且仅以一种非特定的、人类可读的格式（仅仅用于调试），而不一定能符合某种任何特定的、定义良好的（甚至是可解析的）格式（例如，适用于从\
  \ `std::istream` 中读取的格式）。\n\n有人建议，如果标准容器能出于相同的原因提供类似的功能将很好。\n\n![](img/fig3-162a.jpg)\
  \ ![](img/fig3-162b.jpg)\n\n**图 3-162：解析简单日期值的复杂性与不稳定性**\n\n我们并没有强行将一个笨重的解析器引入高可重用\
  \ `Date` 类型的源码中（图 3-163a），而是刻意将解析（以及相应的领域特定自定义格式化）提取到一个独立的逻辑实体中，例如定义在自己的独立组件中的工具结构体\
  \ `struct DateParserUtil`：\n\n![](img/fig3-163.jpg)\n\n**图 3-163：从日期组件中提取出“解析”**\n\
  \n点击此处查看代码图像\n\n```\nstruct DateParserUtil {\n\n      // ...\n\n      static\n\n\
  \      int parseDate(bdlt::Date *result, const char *input, ...);\n\n      static\n\
  \n      int parseDate(bdlt::Date *result, std::istream& input, ...);\n\n       \
  \   // 将从指定的 'input' 读取的日期值\n          // 加载到指定的 'result' 中。成功时返回 0，否则\n       \
  \   // 返回非零值（不影响 '*result'）。\n\n      // ...\n\n};\n```\n\n该逻辑功能在 fact 接口中使用了 `Date`\
  \ 类，因此，如 图 3-163b 所示，定义日期解析工具的物理独立组件将直接依赖定义 `Date` 的组件。\n\n除了依赖定义 `Date` 的组件外，`DateParserUtil`\
  \ 本身很可能构建在收集于另一个独立的、明显更层次的组件中的更通用解析功能之上，例如 `ParserImpUtil`，我们可以合理地假设它已经存在。通过将任何可靠格式的定义委托到比\
  \ `Date` 类型更高层次的组件中，可以添加新的格式化-解析器组件，而不会影响现有组件，也无需修改定义 `Date` 的底层组件。此外，由于这种日期解析器组件可以独立开发——完全构建在我们当前急需要的组件之上——我们可以将其创建推迟到以后的项目，而不会对当前请求的子系统的稳定性造成任何风险。或者可能是多个多个组件。\n\
  \n### 3.12.7 值的传输与持久化\n\n在几乎任何真实世界应用中，跨进程边界传输、保存和恢复信息的能力都是至关重要的。从第 3.6 节 我们知道，将轻量级值语义类型叠加在较重的功能上（特别是特定的持久化方案或机制）会导致严重的物理耦合，并且几乎总是应该避免的（参见图\
  \ 3-105 和 306）。然后，在第 3.7 节中，我们讨论了如何使用各种形式的横向架构来消除此类依赖（分别参见图 3-112 和 316、第 3.7.4\
  \ 节和第 3.7.5 节）。由于任何传输或持久化机制都会正确地叠加在（或侧向于）我们的轻量级 `Date` 类之上，而且由于当前项目不需要它们，我们可以自由地推迟它们的设计和实现，而没有重构正在开发代码的风险。\n\
  \n### 3.12.8 天数计数惯例\n\n某些工业金融应用，正如我们在第 3.3 节中首次了解到的那样，依赖于复杂的天数计数惯例（参见图 3-26）。正如在第\
  \ 3.6 节中讨论的，我们甚至不会考虑让我们相当精简的、值语义（参见第二卷第 4.3 节）`Date` 类受到此类非原始功能的污染（参见图 3-103）。我们并不是将这种高度专门的功能放置在本地单独组件中（即在同一个包内，甚至在同一个包组内），而是将其委托给单独的包，例如高层包组\
  \ `bbl` 中的 `bbldc` 包（参见图 3-27 和第 3.3.7 节）。由于任何日期解析器组件都可以独立开发——完全构建在我们当前急需要的组件之上——我们可以将其创建推迟到以后的项目，而不会对当前请求的子系统的稳定性造成任何风险。或者可能是多个组件。请注意，这种功能并非以任何方式与\
  \ `Date` 类的设计或其他面向客户端组件的设计有关。尽管如此，如果这种功能被认为是客户端主要用例的一部分，它可能会影响 `Date` 的实现。\n\n###\
  \ 3.12.9 日期算术\n\n提供丰富的、高可重用的但非原始的（参见第 3.2.7 节](#ch03.xhtml_ch03levsec2-7)）在在我们即将通用的\
  \ `Date` 类型上操作的机会有很多。一类相当广泛的功能涉及根据独立于任何假期数据库的信息来调整或确定日期值的操作。我们有时将这种自包含的、独立实现的库适用功能称为日期算术（例如，参见图\
  \ 3-103 和第 3.6.1 节）。\n\n例如，给定两个日期，一个工具 `struct` 的“访问器”函数（参见图 2-23 和第 2.4.9 节）如下\n\
  \n```\nstatic int numInRange(const Date& a, const Date& b);\n```\n\n可能会（忽略日期字段）返回两个提供的\
  \ `Date` 参数跨越的有符号月份数。例如：\n\n```\nnumMonthsInRange (2020-01-31, 2020-02-01)     \
  \ →     2\n```\n\n同样，一个工具 `struct` 的“操作器”函数如下\n\n```\nstatic int advanceMonth(Date\
  \ *target, int numMonths);\n```\n\n可能用于根据指定的符号整数 `numMonths` 推进指定 `target` 地址的 `Date`\
  \ 对象的月份字段，在适当的情况下调整年份，并在需要时向下调整日期字段（以确保有效的日期值），成功时返回 0，否则返回非零值（无任何影响）。\n\n#### 3.12.9.1\
  \ 辅助日期算术类型\n\n这种日期算术功能有时也可以从其他辅助类型中受益。例如，我们最终可能想要支持涉及月份的高效操作。枚举月份在减少代码错误方面具有某些优势，因此我们可能决定创建一个定义\
  \ `MonthOfYear` 类的组件，该类包含一个嵌套枚举类型 `Enum`，以及通常伴随我们的枚举类所需的所有典型辅助功能（参见图 2-40 和第 2.6\
  \ 节）。\n\n\n\n\n有关如何防御被调用函数契约未满足前置条件的详尽处理，请参阅第二卷卷第 6.8 节（参见第二卷卷第 5.2 节）。\n\n金融行业的程序员经常可以利用针对日期、一年中的月份、甚至某一组月份所提出的问题的解决方案。例如，一个（某个工具类\
  \ `struct` 的）“操作符”函数，如下：\n\n点击此处查看代码图片\n\n```\nstatic int advanceMonth(Date *target,\
  \ MonthOfYear::Enum month);\n```\n\n该函数可能会将 `Date` 对象中的 `month` 字段（通过指定的 `target`\
  \ 地址识别）推进到由指定的 `month` 参数表示的年份的下一个月份，并在适当时增加或减少年份，同时（如果需要）调小 `day-of-month` 字段（以确保日期有效），成功时返回零，否则返回一个非零值（无任何影响）。\n\
  \n`MonthOfYearSet`（不要与空间和运行效率要低得多的 `std::set<MonthOfYear::Enum>` 混淆）是一个非模板类型，不使用动态内存分配，且仅有极小的占用空间（2\
  \ 字节，其中仅使用了 12 位）。例如，一个（某个工具类 `struct` 的）“操作符”函数，如下：\n\n点击此处查看代码图片\n\n```\nstatic\
  \ int advanceMonth(Date *target, MonthOfYearSet months);\n```\n\n该函数可能会将 `Date`\
  \ 对象中的 `month` 字段（通过指定的 `target` 地址识别）推进到下一个有效月份（在指定的 `months` 参数中表示），在适当时增加或减少年份，同时（如果需要）调小\
  \ `day-of-month` 字段（以确保日期有效），成功时返回零，否则返回一个非零值（无任何影响）。\n\n当然，这些函数有很多变体，例如增加一个额外的（有符号）整数参数，以指示跳过的月份数。注意，这些\
  \ `static` 函数只有当它们位于同一个 `struct` 中时才是重载（实际上它们是如此）：\n\n这种基于依赖的划分方式，在某些（命名的）工具 `struct`\
  \ 中是成立的：\n\n```\nstatic int advanceMonth(Date *target, MonthOfYear::Enum month);\n\
  \nstatic int advanceMonth(Date *target, const MonthOfYearSet& months);\n```\n\n\
  而且，当然，还有许多涉及月份（以及月份集合）的有用操作：\n\n点击此处查看代码图片\n\n```\nstatic int numInRange(const Date&\
  \ first, const Date& last, MonthOfYear::Enum month);\n\nstatic int numMemberInRange(const\
  \ Date& first, const Date& last, const MonthOfYearSet& months);\n\nstatic int numMemberInRange(const\
  \ Date& first, const Date& last, const MonthOfYearSet& months);\n```\n\n虽然解析日期并不复杂，但正如我们所见（参见图\
  \ 3-58），对于 `Date` 的这种非原语操作将是耗时的。相反，我们可以明智地（正如对 `DayOfWeek` 所做的那，参见图 3-64）将它们放置在独立的工具\
  \ `struct` 中，这种自然依赖于 `Date` 的这种方式（参见图 3-64）——通常不需要是原语的。\n\n明智地（正如我们在对图 3-15 中所做的那样）将其分布在不同的组件中（参见图\
  \ 3-49）——对于使用 `MonthOfYearSet` 的（参见图 3-49）的非原语操作，我们可以将其放置在 `MonthOfYear` 工具中（参见图\
  \ 3-49），正如（参见图 3-64）中自然依赖于（参见图 3-64）的 `Date`。\n\n![](img/fig364.jpg)\n\n**图 3-64：涉及仅\
  \ `date` 组件的非原语操作**\n\n这种基于依赖的划分方法相比于其他更传统的“逻辑内聚”标准具有一些明显的优势。第一个是客观性：很清楚（参见图 3-09）在接口中使用意味着物理依赖。第二个是实用的模块化：对单个月份而非月份集合进行日期计算的客户不必被强制与月份组件一起编译或链接。第三是稳定性：`MonthOfYearSet`\
  \ 或 `MonthOfYearUtil` 的更改或添加对仅使用 `Date` 的客户没有影响。第四是增量式扩展：我们可以将 `MonthOfYear` 和 `MonthOfYearUtil`\
  \ 添加到我们的仓库中，而不必立即添加 `MonthOfYearSet` 或 `MonthOfYearUtil`。同理，我们可以推迟*所有*月份相关的组件到后续项目，而不会产生额外的重构成本。\n\
  \n这里的结论是，这些对原语功能的扩展完全是*加性的*，而且对高层组件中任何类型的月份功能的添加或修改，对于专门使用无的（参见第二卷卷第 4.3 节）`Date`\
  \ 类型的客户完全没有影响。\n\n#### 3.12.10 日期与日历工具\n\n考虑到请求的性质，如果我们作为前瞻性的 SI 开发者未能预测我们新的旗舰值语义类型\
  \ `Date` 和 `Calendar` 最可能的预期用例，将是失职的。例如，许多非原语操作只需要定义 `Date` 的组件接口中已经表示的内容。我们断言，此类针对\
  \ `Date` 对象的常用非原语操作应属于一个工具 `struct` `DateUtil`，定义在一个直接依赖于定义 `Date` 和 `DayOfWeek`\
  \ 组件的独立（高层）组件中，如图 3-165a 所示。一个可以在此类工具 `struct` 中找到的典型函数 `nthDayOfWeekInMonth` 的接口和契约示例在图\
  \ 3-165b 中提供参考。\n\n![](img/fig3165a.jpg) ![](img/fig3165b.jpg)\n\n**图 3-165：涉及仅\
  \ `date` 组件的非原语操作**\n\n注意，对于 `==`（仅限）这种特殊情况，我们历史上一直尝试始终将字面量（或其他不可修改的值）放在操作符的左侧，以防止不小心输入单个\
  \ `=`；对于其他五个关系运算符 `!=`、`<`、`<=`、`>` 和 `>=`，我们故意没有做此类努力。\n\n\n\n\n虽然仅涉及 `Date` 或可能还涉及\
  \ `DayOfWeek` 的非原始功能恰恰属于仅包含这些物理依赖项的组件，但存在某些操作需要由 `Calendar` 对象自然提供的信息。此类功能具有更广泛的依赖范围——例如对定义\
  \ `Calendar` 的组件的依赖——因此，它们不能属于 `DateUtil`。同样，根据第 3.2.7 节，我们知道这种非原始功能也不应该正确地位于与 `Calendar`\
  \ 类型相同的组件中。我们断定，这些对 `Date` 和 `Calendar` 对象的常用非原始操作应归属于一个独立的工具结构体 `struct` `CalendarUtil`，它定义在自己的（更高层次的）组件^(339)中，该组件直接依赖于分别定义\
  \ `Date` 和 `Calendar` 等其他组件，如图 3-166a 所示。为了提供了一个广泛使用的金融函数 `shiftModifiedFollowingIfValid`\
  \ 的接口和契约示例，它具有所需的接口依赖，请参考图 3-166b 。\n\n^(339) 在实践中，根据特定的领域，可能会有几种不同的日历工具。\n\n![](img/fig3-166a.jpg)\
  \ ![](img/fig3-166b.jpg)\n\n**图 3-166: 涉及 `Date` 和 `Calendar` 的非原始操作**\n\n将所有内容整合在一起并将这些工具重新插入回图\
  \ 3-161、图 3-167 的设计中，其结果描述了一个组件类图，显示了分别定义 `DateUtil` 和 `CalendarUtil` 的两个组件中面向客户端的逻辑实体之间实际的“接口使用”（Uses-In-The-Interface）关系。从理论上讲，任何在某个类型（例如\
  \ `Calendar`）的接口中使用类型（例如 `PackedCalendar`）的定义，并以该类型命名工具（例如 `CalendarUtil`）的组件，都适合用于该工具的接口。然而在实践中，紧凑日历（packed\
  \ calendar）中没有适用于 `Calendar` 对象通用客户端的有用功能，因此直接的接口使用关系（在 `Calendar` 和 `PackedCalendar`\
  \ 之间）在图 3-167 中以浅灰色显示；另见第 3.12.11.3 节和 3.12.11.4 节。\n\n![](img/fig3-167.jpg)\n\n\
  **图 3-167: 预期的（立即有）工具组件**\n\n另一方面，`DayOfWeekSet` 完全独立于 `Date`，因此自然不会被考虑用于 `DateUtil`\
  \ 的接口。然而，由于其轻量级特性以及与 `DayOfWeek::Enum` 类型的紧密语义关系，我们可能会选择允许该依赖（在图 3-167 中标记为‘？’），而不是创建一个独立的\
  \ `DayOfWeekSet` 工具。一如既往，“智慧、判断和良好的品味是不可替代的。”^(340) 在任何特定情况下，这种细粒度的、主观的面向客户端的设计决策交由读者决定。\n\
  \n^(340) Bjarne Stroustrup (c. 1990, 个人对话)\n\n确保最佳性能是通过提供一个具有值语义 `Calendar` 类型的高效实现，以及\
  \ `Date` 的协作式高效实现来实现的——例如在序列日期方面（下文将讨论），适用于优化日期差等性能关键型操作（见卷 II，第 6.7 节）：\n\n点击此处查看代码图像\n\
  \n```\nint operator-(const Date& lhs, const Date& rhs);\n```\n\n需要重申的是，这种细粒度的、分解的方法允许像\
  \ `CalendarUtil` 中可能实用的功能被延迟实现，而无需在实现这些功能时重新审视现有的组件。\n\n## 3.12.11 完善完全分解的实现\n\n\
  此时，我们准备好宣布我们最初的面向客户端的设计已经完成了。在充分考虑了当前以及未来面向客户端的功能后，我们现在从客户端的角度转而考虑需要什么种类的可复用组件，以便为我们新日期/日历库系统的实现建立一个分层可复用的基础（见卷\
  \ II，第 6.4 节）。\n\n### 3.12.11.1 实现一个分层可复用的 `Date` 类\n\n回想第 3.2.5 节，当不同的客户端需要不同层次的功能时，进行分解（factoring）是一个重要的动机。某些操作在没有\
  \ `Date` 类的情况下对日期值是有意义的。例如，判断一个给定年份是否为传统的格列（历闰年^(341)可以实现为一个关于年份的小函数（适用于内联），如图 3-168\
  \ 所示。该函数可以用于 `Date` 类的实现，也可以单独供只有年份（表示为整数）的客户端使用。^(341) 注意，自从我们 `Date` 类的设计以来，业界已经从具有所有复杂性的\
  \ ANSI 标准格列历转向了 POSIX 标准推格列历，后者对每 400 年的区块的处理是相同的。从格列历转换为推格列历对现代的日期几乎没有影响，除了自 0001/01/01\
  \ 以来的天数减少了两，这对于显式利用该差异的程序（例如在 1752 年 9 月 14 日之前的日期）会导致不一致。\n\n![](img/fig3-168.jpg)\n\
  \n**图 3-168: 判断给（整数）年份是否为闰年**\n\n^([342)) 如果指定的年份根据格列历（如大多数传统 Unix 系统上的 `cal` 命令所示）是闰年，则该函数返回\
  \ `true`。除非年份落在 [1 ... 9999] 范围内，否则其行为是未定义的。断言的存在是为了防御（如果需要）客户端的误用（见卷 II，第 5.2 节和第\
  \ 6.8 节）。注意，拆分两个断言以形成范围检查，在我们看来是极少数将两个语句放在同一行既合适又有益的案例之一，因为它们共同代表了一个范围。\n\n^(343))\
  \ 按照我们的习惯，我们将上述重写为更优的形式：\n\n[点击此处查看代码图像\n\n```\nreturn 0 == year % 4\n\n     &&\
  \ (year <= 1752 || 0 != year % 100 || 0 == year % 400)\n```\n\n注意，```\n!A || A &&\
  \ B\n```\n\n和\n\n```\n!A || B\n```\n\n代表 `A` 和 `B` 的相同布尔值函数。我们倾向于这种紧凑的代码——即使编译器在未优化模式下通常也能达到相同的结果——部分是因为我们是完美主义者，但也也是由于在我们组件化开发方法中无处不在极其详尽的组件级测试驱动（见卷\
  \ III）。\n\n\n\n\n\n其他广泛使用的功能——例如确定给定的年/月/日组合是否代表该日历系统中的有效日期——也可以被提取出来、进行测试并直接使用，而无需一定需要引入值语义（value-semantic）日期类型的定义及其随后的依赖项。也就是说，实现\
  \ `Date` 类的组件可以利用（节 1.9）并（因此）依赖（节 1.8）这种低级基础功能，但那些需要这种低级功能却不需要我们的值语义 `Date` 类的客户端，则不必被强制依赖于它。^(^(344))\n\
  \n通而言之，给定一个名为 `Foo` 的值类型，一个在接口中使用 `Foo` 的工具 `struct` 将被命名为 `FooUtil`，而在 `Foo` 的实现中使用的工具将被命名为\
  \ `FooImpUtil`，而名称 `FooImp` 则预留给一种中间的可实例化的实现类（参见第二卷第 6.4 节）。\n\n### 3.12.11.2 在\
  \ `Date` 类中表示值\n\n我们的 `Date` 类内部具体如何表示其值，同时对语义不产生影响（参见第二卷第 5.2 节），将影响其性能的各个方面，以及我们实现它时需要的功能类型。我们的\
  \ `Date` 类在接口中支持年/月/日格式，自然地可以在内部使用三个独立的整型字段来实现，如图 3-169a 所示。(345) 然而，为了优化某些类型的原始操作，包括由（成员）和（自由）的操作，\n\
  \n注意数据成员的大小足以容纳年、月、日的独立最大值，0001/01/01 ≤ date ≤ 9999/12/31，如上述 `Date` 契约不变性所限定（参见图\
  \ 3-152，节 3.12.3）。\n\n```\nDate& operator++();\n\nDayOfWeek::Enum dayOfWeek() const;\n\
  ```\n\n![](img/fig3-169.jpg)\n\n**图 3-169：类 `Date` 的替代实现策略**\n\n点击此处查看代码图像\n\n```\n\
  int operator-(const Date&, const Date&);\n```\n\n（即返回两个给定日期之间实际天数的[带符号的]数量），在内部可以使用一种序列日期表示法，如图\
  \ 3-169b 所示。\n\n如果我们决定采用序列日期路线，我们需要高效的例程来在序列表示和该表示之间进行转换。另一方面，如果我们选择使用三个独立的字段在内部表示日期，则不需要序列转换例程；但，我们需要其他原始日期功能，例如有效地将一个有效的年/月/日表示法调整为下一个或上一个，或者在给定的独立的年、月、日整型值的情况下计算星期几。\n\
  \n在针对特定的业务需求开发完全提取的解决方案时，既有现在必须实现的本质功能，也有可以推迟到以后项目的相关功能。延迟不必要的开发可以减轻创建完全提取软件的部分高昂初始成本。假设我们选择序列日期实现，我们可以推迟创建直接操作年/月/日表示法的原始功能；然而，我们将立即需要这些转换例程。\n\
  \n与我们的整体方法论一致，我们希望公开的转换例程能够允许：(1) 分层级复用（节 0.4），以及 (2) 直接的（组件级）测试（参见第三卷第 7.3 节）。一种权宜之计但较劣的暴露这种转换功能的方法是作为\
  \ `Date` 自身的公共 `static` 方法。然而，良好的逻辑设计原则足以阻碍我们走这条捷径。首先，这些序列日期转换例程的抽象层级明显低于一个值语义的\
  \ `Date` 类。`Date` 的客户端很少需要这些转换，它们在 particular 接口中的存在会增加不必要的混乱，使得 `Date` 对于其目标受众来说更难理解和使用。相反，将此功能放在一个单独的工具（图\
  \ 3-170）中形成了一个自然的中间接口——一个逻辑防火墙——在其后我们可以隔离并测试独立的低级设计决策（节 0.7）。\n\n![](img/fig3-170.jpg)\n\
  \n**图 3-170：`Date` 和 `DateConvertUtil` 的逻辑设计与用法**\n\n我们首选的尽管不太直接的 `Date` 实现选择——即采用序列日期表示来优化关键操作——是\
  \ `DateConvertUtil` 的灵感来源。`DateConvertUtil` 结构提供了一系列 `static` 方法，可以在三种最常见的格式——序列日期、年/月/日和年/天数之间进行转换，当这些格式以独立的整型字段表示时。（(346)它的功能定义良好、稳定，且通常适用于可能不需要\
  \ `Date` 对象的客户端。引入年/天数不需要多少工作，因为它已经是一个中间形式；在这种情况下，从一开始就构建并实现完整接口的微小努力几乎总是最佳选择，只要至少某些潜在客户可能会受益。\n\
  \n既然相应的逻辑设计由两个独立的类（一个 `class` 和一个工具 `struct`）以及一些 `Date` 的自由运算符组成，现在的问题是如何最好地将这些逻辑构造收集到各自的容器中（即组件）。图\
  \ 3-171 显示了可能的组件化方案：(a)两种类型的定义位于同一个组件中，或 (b) 这两种 C++ 类型分别定义在各自独立的组件中。\n\n![](img/fig3-171a.jpg)\
  \ ![](img/fig3-171b.jpg)\n\n**图 3-171：`Date` 和 `DateConvertUtil` 的两种模块化方案**\n\n\n\
  \n\n\n语义上的内聚性很少能证明将类置于同一组件中而导致的物理耦合是合理的（3.3.1.3 节）。然而，在图 3-171a 所示的情况下，并没有语义内聚性：物理上的共存充其是一种实现上的权宜——仅此而已。仅通过一个组件，仅\
  \ `DateConvertUtil` 的客户端就将被强制引入与 `Date` 相关的额外代码。组件头文件中任何关于 `Date` 类型的更改，都将迫使 `DateConvertUtil`\
  \ 的客户端重新编译。无论是 `Date` 还是 `DateConvertUtil` 的客户端，仍然被迫跳过大量描述它们可能并不感兴趣的功能详尽文档（这与我们想要避免的将静态转换方法放在\
  \ `Date` 类内部的初衷是一致的）。\n\n现在让我们考虑我们的子系统长期来看的潜在稳定性。例如，假设事实增加日期和获取星期并不像以前那样常见且对时间敏感，而提取年-月-日信息才是关键的、高产的盈利点！在某个时刻，我们决定将\
  \ `Date` 的完全封装的内部表示从（原始的）序列日期格式改为（新的）离散年-月-日格式，从而使 `Date` 对 `DateConvertUtil` 的使用过时。^(347)\
  \ 现在需要工具类 `DateYmdUtil`（我们之前推迟的）来对用三个不同整数字段表示的日期高效地执行所需操作。图 3-172 显示了由于初始实现选择的欠佳导致的微小缺陷，如何由于（公开访问的）实现\
  \ `struct` 物理上与 `Date` 位于同一组件中而被放大，导致当原本封装的、完全私有的逻辑细节随时间发生变化时，产生了糟糕的物理模块化。\n\n^(347)\
  \ 参阅第二卷第 6.7 节，了解另一种实现方法（使用查找表），该方法对于两种使用模式都能同时实现极高的性能（对于一个较小但访问频繁的子范围）。\n\n![](img/fig3-172.jpg)\n\
  \n**图 3-172：由于糟糕的初始设计选择导致的糟糕模块化**\n\n假设两个逻辑实体都共位于 `grppk_date` 组件中，`DateConvertUtil\
  \ struct` 无法简单地从实现 `Date` 的组件中移除，因为有许多客户端通过直接包含实现 `Date` 的组件来访问 `DateConvertUtil`：\n\
  \n```\n#include <grppk_date.h>\n```\n\n`Date` 的客户端继续需要（例如，在链接时间和可执行文件上）为支持两种工具 `struct`\
  \ 实现买单。此外，`DateConvertUtil` 的客户端——除了为 `Date` 付单外——现在还要为 `DateYmdUtil` 付单！另一方面，*从开始*就将\
  \ `Date` 和 `DateConvertUtil` 隔离在它们各自独立的组件中，可以避免这里描述的所有问题。通过为 `DateConvertUtil` 提供它自己的独立头文件，我们实际上封装了它的使用（参见图\
  \ 3-140，3.11.2 节），从而将其“封装性”(3.5.10 节) 提升到定义 `Date` 的组件的高度。最后，将操作 `Date` 的操作符放置在定义\
  \ `Date` 的同一组件中，不仅符合正确共存的第四条指南（3.3.1.4 节)），而且是我们的组件设计规则(2.6 节) 的明确要求。简而言之，图 3-171b\
  \ 的逻辑/物理封装在这里是正确的选择。\n\n退后一步，我们观察到，我们的值语义日期类型的实现中有某些方面（例如 `isLeapYear`），无论我们的数据成员表示如何，都是需要的。我们完全可以选择将此类基础实现功能放在它自己的独立低级组件中，例如\
  \ `PrimitiveDateUtil`。因此，我们确定了两个（立即需要的）“实现”工具类（`PrimitiveDateUtil` 和 `DateConvertUtil`）、一个枚举\
  \ `struct` (`DayOfWeek`) 以及一个重要的*词汇*（参见第二卷第 4.4 节）类 (`Date`)。鉴于我们的 `Date` 类和 `DayOfWeek::Enum`\
  \ 枚举都是值语义类型（参见第二卷第 4.3 节），将某些基础设施（如启用流的功能）。同样，我们假设 BDEX 流的概念（即提供必要的外部化功能）已经存在并可用（参见第二卷第\
  \ 4.1 节）。描述我们不断增长的分层次可重用实现组件的组件类类图如图图 3-173。\n\n![](img/fig3-173.jpg)\n\n**图 3-173：带有\
  \ `DayOfWeek` 枚举的值语义 `Date` 类**\n\n注意 `Date` 的直接客户端（如 `DateParser`）将使用 `Date` 类的\
  \ `isValidMonthDay` 方法（该方法 `inline` 转发到 `PrimitiveDateUtil`）以便在填充*之前*验证日期。这种验证——紧密于\
  \ `Date` 类的属性——服务所有填充器（包括 `Date` 的直接客户端），因此作为 `Date` 的 `static` 方法重新发布。^(348)\n\n\
  ^(348) 注意 `std::chrono` 作为 C++11 旨在解决 `bdlt` 的许多相同问题，且相似，但与 `bdlt` 遵循不同的接口哲学。注意，从\
  \ C++20 开始，`std::chrono` 支持日期。但在 C++20 之前，我们只有不同粒度的时间。\n\n##### 3.12.11.3 实现层次可重用的\
  \ Calendar 类\n\n回想创建 `Calendar` 的目标是创建一个适用于通用高效类型。虽然 `PackedCalendar` 在设计上与 `Calendar`\
  \ 表示相同的*值*，^(349)，但 `PackedCalendar` 无法为涉及诸如*修正后延*（参见图 3-166b，3.12.10 节) 等算法的结算日计算所需的性能。对于这些操作，我们需要\
  \ `isBusinessDay`^(350) 尽可能快。经验表明，紧凑的基于表的解决方案通常是最有效的（参见第二卷第 6.7 节），因此我们在这里以值语义 `BitArray`\
  \ 的形式采用该方法，用紧凑的（即每字节 8 天）表格形式缓存工作日，适用于超高效查找。^(351,352) 有了这种实现，判断给定的（序列）日期*是否*工作日仅涉及三个\
  \ `inline` 方法。第一个方法在转发到第二个方法之前简单地反转了问题的逻辑：\n\n^(349) 即，我们可以在两者之间转换而不会丢失任何*显著*信息（参见第二卷第\
  \ 4.1 节）。\n\n^(350) 事实证明，实践中需要最大优化的操作是 `isNonBusinessDay`。\n\n\n\n\n\n### 351 `std::vector<bool>`\
  \ 性能特征具有实现定义的性质，这使其立即无法成为此处的选项。更重要的是，由于其公共接口的，关键操作（如对整个数组进行 AND 和 OR 操作）无法通过高效的方式实现。\n\
  \n### 352 `std::bitset` 当然也是可用的，但它无法提供所需的动态（运行时）调整大小的功能。\n\n点击此处查看代码图片\n\n```cpp\n\
  inline\nbool Calendar::isBusinessDay(const bdlt::Date& date) const\n{\n    return\
  \ !isNonBusinessDay(date);\n}\n```\n\n第二种方法（更有可能在紧凑循环内部调用的方法）在将偏移量传递其（私有的）嵌套 `BitArray`\
  \ 对象之前，确定日期相对于日历开始时间的偏移。\n\n点击此处查看代码图片\n\n```cpp\ninline\nbool Calendar::isNonBusinessDay(const\
  \ bdlt::Date& date) const\n{\n    return d_bitArray[date - d_startDate];  // 以“负逻辑”\n\
  \                                           // 形式存储。\n```\n\n第三种方法是 `BitArray` 本身的一部分，它计算并返回所提供的\
  \ `offset` 索引处的布尔值：\n\n点击此处查看代码图片\n\n```cpp\ninline\nbool BitArray::operator[](std::size_t\
  \ index) const\n{\n    const std::size_t WORD_SIZE = sizeof *d_words_p;  // 'constexpr'\n\
  \    return d_words_p[index / WORD_SIZE] & (1 << index % WORD_SIZE);\n}\n```\n\n\
  也就是说，确定给定日期是否*不是*工作日可以通过一次除法操作、一次数组解引用、一次取模操作、一次位移操作、一次位整数 `and` 操作以及一次隐式整数到布尔转换完成，或者说是大致数量的汇编指令；在现代架构上，由于激进的并行性（例如这些指令的流水线和并发执行），时钟周期会少得多。这种运行时效率是以对象大小为代价的：仅用于表示例如\
  \ 30 年日历中的每一天，`BitArray` 就会消耗大约 30 · 365.25 / 8 = 1370 字节——几乎是等效紧凑 `PackedCalendar`\
  \ 表示所需的两倍（参见第 3.12.11.4 节）。\n\n### 353 注意（整数）`division` 和 `mod` 操作具有 2 的幂作为常数除数，因此它们将分别被*强度还原*为微不足道的*位移*和*掩码*操作。\n\
  \n实现一个高效的通用的 `BitArray` 所需的工作比许多人最初预想的要大得多。为了实现高效的集合操作（例如 AND、OR、XOR 和 SUB），我们希望通过显式利用底层硬件的最大并行性来执行这些操作。也就是说，我们希望使用（为了数据传输）一个整数——或者可能是更大的用户定义数据类型（参见卷\
  \ II，第 6.7 节），其大小至少等于底层硬件数据路径的大小（例如 256 位）。\n\n当我们考虑到可能合理地想要将一个 `BitArray` 的子范围应用到另一个的任意偏移量时，实现最优性能将需要不同的算法，取决于源操作数中对应字中的位物理对齐是\
  \ (1) 低于、(2) 等于还是 (3) 高于目标操作数中的。此外，起始位和结束位位于同一个字中（对于源和目标）的情况可能需要被视为通用算法的特例，在通用算法中起始位和结束位位于不同的字中（隔着零或多个完整字）。这里的关键点在于，编写一个高效的\
  \ `BitArray`——尽管非常有价值——绝非易事，这正是为什么我们应该这样做并一劳永逸地正确完成的原因。\n\n为了为 `BitArray` 实现高效的子集操作，我们还需要对单个字执行高效的掩码操作。这种功能本身具有极的可重用性，值得单独的工具类\
  \ `BitUtil` 存在于自己的组件中。通过使用静态表，我们可以通过对两个*隔离的*静态数组中的查找结果进行 AND 操作，来合成覆盖机器字中任意连续位子序列的掩码（参见卷\
  \ II，第 6.6 节）。`BitUtil` 还会提供许多其他底层操作——例如，计算一个字中 1 位的个数（也称为 *population count*）。通过提取尽可能多的功能（参见卷\
  \ II，第 6.4 节），我们改进了测试能力，即使不是重用能力。事实证明，`BitUtil` 工具可能在实现 `DayOfWeekSet` 的功能时也很有用（此处未显示）。\n\
  \n### 354 在某些架构上，“即时”生成此类掩码可能比引用可能不在缓存中的静态数组更有效；将此逻辑隔离在 `BitUtil` 中允许对不同实现进行简单的微基准。`BitArray`\
  \ 是一个值语义类型，既表示一个值（即布尔值序列），又对该类型提供若干操作。另一方面，`BitUtil` 是一个非常底层的 `struct`，执行复杂的位操作，例如\
  \ `numBitsSet`（又称 *population count*），它返回单个字中 1 位的个数。\n\n然而，在这两个抽象层之间，存在着一个巨大的鸿沟，涉及对连续二进制字字符串的操作的复杂功能，这些功能既值得直接测试，又在其他数据结构和值语义类型中具有极的可重用性。通过进一步提取\
  \ `BitArray` 为零售使用如此整洁提供的机制，我们既改进了实现的质量，也增加了分层重用的机会。\n\n通常，对进一步提取的需求只有在初始实现尝试进行之后才会出现。鉴于内存分配协议和指定的默认分配器机制的基础重要性和广泛使用（参见卷\
  \ II，第 4.10 节），我们假设它们已经存在于名为 `bslma` 的包（BDE 标准库内存分配器）中。所有使用在对象 Primitive 操作之间持续的动态内存的可重用对象将依赖于此包。注意，所有这些重用值类型（参见卷\
  \ II，4.1）也（至少在概念上）依赖于 `bslx` 进行外部化。像 `Calendar`、`PackedCalendar` 和 `BitArray` 这样表示值并需要动态内存分配的自然依赖于这两个设施。\n\
  \n### 356 请理解，由于 BDEX 设施基于概念的性质，对它的依赖（所示）仅是协作性的，而非物理性的。描述 `Calendar` 的组件类图，以及其接口依赖和仅在此实现中（但不会持续）需要的任何新的非*面向客户端*组件（深灰色），在图\
  \ 3-174 中所示。\n\n![](img/fig3-174.jpg)\n\n**图 3-174：`calendar` 组件的实现依赖**\n\n关于如何测试各种相似函数的深入讨论，请参见卷\
  \ III 第 8.3 节和 8.4 节。\n\n\n\n\n\n`PackedCalendar` 的目的是尽可能紧凑地表示所有需要的日历数据，并且理想情况下，在许多重要情况下仍能提供与\
  \ `Calendar` 类对象相同的所有服务，尽管速度要慢得多。在实践中，我们知道一个典型的日历（例如用于评估三十期债券的日历）将跨越一系列连续的天数，其长度远小于双字节无符号整数可以表示的范围（65,535\
  \ 天或约 179.3 年）。鉴于如果日历的天数范围可以使用无符号 `char` 或 `short` 整数（从其开始日期起）而不是完整的 `int` 来索引，我们可以在表示节假日时节省大量空间，因此创建一个可能的可重用\
  \ `PackedIntArray` 是有意义的，例如它可以根据其包含的最大无符号整数值的大小来调整其内部元素的大小。\n\n就在本节准备提交时（2017 年\
  \ 10 月），人们发现需要另一种空间高效的类向量数据结构——这种结构专为为表示高度重复值的序列而优化——用于一个提议中的新“时间表”组件。该组件将 `Datetime`\
  \ 值映射到“转换代码”（状态转换 ID），例如用于存储金融交易所的交易计划。该新组件的提议实现是采用权重模式（Flyweight pattern，见 `gamma94`\
  \ 第 4 章“权重模式”节，第 195–206 页），使用两个向量：第一个用于存放唯一的示例集，第二个表示通过指向第一个向量的无符号偏移量引用这些示例的非负整数序列。然而，由于偏移量向量的性质，`PackedIntArray`\
  \ 在空间效率上绝不低于 `std::vector<std::size_t>`，在预期情况下更为优越——例如，当示例数量不超过 2⁸（甚至不超过 2¹⁶）时，特别是序列长度在整体存储需求中占主导地位时。\n\
  \n一个紧凑的 30 年日历（跨度略小于一一万多天），每个每月约有一个节假日，可以使用两个整数（标识范围）、一个（单字节）`DayOfWeekSet` 以及一个包含约\
  \ 30 · 12 = 360 个 `short`（2 字节）整数的数组来表示，在大多数平台上总计约为 0.75K 字节。因此，我们可以预计一个典型的 30 年（高速）`Calendar`\
  \ 对象的存储需求，它包含一个 `PackedCalendar` (~750 字节）以及一个 `BitArray` (~1400 字节），总计约为 2150 字节（或略高于\
  \ 2K 字节）。请注意，除非我们特意限制分配内存的数量，否则为 `PackedCalendar` 和 `Calendar` 分配的字节数可能是实际需要（使用）字节数的近两倍。\n\
  \n正如空间高效（但其他方面通用的）数据类型（如 `BitArray` [第 3.12.11.3 节]）通常那样无法为其单个元素提供直接的 C++ 引用，`PackedIntArray`\
  \ 本身也不符合 STL 风格标准容器的要求，因此与标准算法的兼容性不好。经过更深熟的考虑，为 `PackedIntArray` 设计的自定义算法——最初直接嵌入在\
  \ `PackedCalendar` 方法的实现中——被提取为单独的可重用函数。\n\n结果，我们决定引入一个新的工具结构体 `struct`、`PackedIntArrayUtil`，它提供了通常通用的整数数组操作，如\
  \ `isSorted`、`lowerBound` 和 `upperBound`，这些操作是基于（最终关联的）`PackedIntArrayConstIterator`\
  \ 类型（未显示）实现的。由于其内在对友元（friendship）的需求，该迭代器类型必须定义在与其“友元”`PackedIntArray` [第 3.3.1.1\
  \ 节] 相同的组件中。正是这些精心设计的、高性能的数据类型，需要使用本书第三卷中提出的严谨测试数据选择方法（例如，见第三卷第 8 章）。\n\n仅由 `PackedCalendar`\
  \ 设计所产生的直接必要的子系统——包括其对仅限实现的组件的依赖（深灰色）如图 3-175 所示。\n\n![](img/fig3-175.jpg)\n\n**图\
  \ 3-175：仅创建 `PackedCalendar` 所需组件/包**\n\n### 3.12.11.5 在现有聚合体中的分布\n\n现在我们理解了组成系统的主要类，我们需要确保妥善地聚合我们的组件（[第\
  \ 2.2], [2.9], [2.10] 和 [3.1.4] 节]）。这里讨论的某些非常底层的类型和设施（如 `bslma::Allocator` 和 BDEX\
  \ 概念）被广泛使用，并假设存在于最底层包 `bsl` 中。许多新基础设施（例如 `Date` 和 `Calendar`）是基础的、可重用的，可以很容易属于单层包（`bdlt`），该包直接依赖\
