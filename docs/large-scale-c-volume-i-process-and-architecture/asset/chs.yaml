  \ }\n```\n\n这种“优雅”的技术除了速度慢得离谱外，早晚不可避免地会导致栈溢出。\n\n![](img/fig3-84.jpg)\n\n**图 3-85：使用单类实现链表（糟糕的设意）**\n\
  \n*(注：由于原始文本包含大量重复，此处译文已去除重复部分以符合指令)*\n\n\n\n另一种，让 `Node` 类单向依赖于 `Edge` 类，但让 `Edge`\
  \ 拥有一个指向 `Node` 的不透明反指针（图 3-87b），同样存在问题。如果由 `Node` 负责（并兼任“图”的双重职责），那么 `removeEdge`\
