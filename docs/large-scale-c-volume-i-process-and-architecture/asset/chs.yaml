  \ 2.4 节），第 29–31 页。\n\n#### 1.7.7 约束模板与接口继承的相似之处\n\n观察接口继承与模板参数之间的相似之处（以及差异）也很有启发。让我们先考虑图\
  \ 1-51 中所示的非常常见的设计模式。在两种实现中，我们都有一个具体的服务器 `MyServer`，它需要抽象通道的服务，在图 1-51a 中是协议类 `Channel`，而在图\
  \ 1-51b 中是某种规范 `Channel*`，它表征了提供的具体通道类型预期满足的各种，但这些要求不需要物理上作为任何程序的源代码存在。\n\n![](img/fig1-51.jpg)\n\
  \n**图 1-51：常见设计模式中继承与模板的对比**\n\n¹¹² 特别是在开发期间，我们有时会在图中给类名加下线，以指示它作为一个（通常是纯的）抽象接口（参见卷二，第\
  \ 4.7 节）。\n\n定时通道抽象是一种通道抽象。实现定时通道抽象的类型应该在任何需要实现通道抽象的地方可以使用。这种可替换属性在图 1-51a 中被显式捕获。在图\
  \ 1-51a 中使用了 `Channel` 协议，而在图 1-51b 中使用了 `Channel` 规范。\n\n（注：原文中存在大量重复段落，已省略）\n\n\
  \n\n\n例如，考虑一个类型概念 `Assignable`，它（除其他外）要求给定的具体类型 `T` 必须是 `EqualityComparable`，如上述描述（在第\
  \ 1.7.6 节 附近），并且还要实现一个语法形式的赋值运算符：\n\n```cpp\nT& operator=(const T&);\n```\n\n使得对于（相同）类型\
  \ `T` 的任意两个对象 `a` 和 `b`，在将 `b` 的值赋给 `a` 后，两个对象的比较结果相等，如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  template <class T>\n\n    // 要求: 'T' 满足 Assignable.\n\nvoid assign(T& a, const T&\
  \ b)\n\n{\n\n    a = b;\n\n    assert(b == a);\n\n}\n```\n\n现在假设我们尝试使用抽象基类来建模相同的代码：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Assignable {\n\n  public:\n\n    virtual ~Assignable();\
  \  // 空定义位于 '.cpp' 文件中。\n\n    virtual Assignable& operator=(const Assignable& rhs)\
  \ = 0;\n\n};\n```\n\n我们应该如何实现上面示例中的 `assign` 函数呢？假设我们尝试根据基类来实现，如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid assign(Assignable& a, const Assignable& b)\n\n{\n\n    a = b;\n\n\
  \    assert(b == a);\n\n}\n```\n\nC++ 类型系统甚至无法保证两个具体的派生类型是相同的，如果它们不是相同的，那么赋值这一概念本身就是可疑的（见第二卷第\
  \ 4.3 节）。另请注意，C++ 允许基本类型在受限模板中作为类型参与，但在继承关系中并不如此。\n\n### 1.7.8.2 接口继承，而非受限模板\n\n\
  另一方面，有时使用受限模板是受到强烈的反面指示的。再次考虑抽象服务的使用，例如 图 1-51 所示的通信通道，第 1.7.7 节。通过选择抽象基类的方法，我们有一种自然的方式来保留（并在稍后使用）提供的通信机制（即通过指向其\
  \ `protocol` 基类的指针）。如果我们而是改用受限模板，我们可能不得不根据这个相对较小的实现细节对整个通道类进行参数化。\n\nC++98 的 STL\
  \ 设计在内存分配器上做了错误的选择，这可能被认为是内存分配器更广泛采用的巨大障碍。(114)\n\n^(114) 查看 austern98，第 9.4 节，166–171\
  \ 页。这一致命缺陷直到 C++17 引入多态内存资源版本的 STL 容器时才得到适当解决（见第二卷第 4.10 节）。另见 lakos17b](#ref.xhtml_ref50),\
  \ lakos17c](#ref.xhtml_ref51)。\n\n### 1.7.9 三种“继承”关系都具有独特价值\n\n三种不同的“继承”关系——Is-A（是一个）、Models（建模）和\
  \ Refines（细化）都是必要的，每种都服务于不同的、尽管有时会重叠的目的。`Is-A` 是两个（命名的）C++ 类之间的经典关系（其中一个或两个可以是抽象的），`Models`\
  \ 是具体类型与一组类型之间的关系，而 `Refines` 是两个类型集合之间的关系。如果我们想最大限度地利用它们，就需要理解这三种不同形式的正确用法。\n\n\
  ### 1.7.10 为模板编写类型约束文档\n\n如上所述，对于如何维护具有此类“仅限结构内”（In-Structure-Only, ISO）关系的软件，存在一些担忧——特别是当这些需求超出了标准中已经记录的内容时。C++98\
  \ 基本上不支持对模板参数强制执行类型规范，因此对于那个最初的 C++ 子集，我们能做的最好的就是（某处提供清晰、完整的文档，勾勒出我们需要满足的自定义规范（即类型要求）。(115)\n\
  \n^(115) 从历史上看，存在开源实现，例如 Boost 的 C++98 concepts 库，它们允许类型规范及其强制执行。从 C++20 开始，C++\
  \ 为 concepts 提供了广泛的语言级支持。\n\n图 1-52a 显示了一个（纯）逻辑图（不包含任何物理实体），描述了一个客户端类型 `MyClient`，它在接口使用的类型建模了（即满足）概念\
  \ `Service` 所指出的的类型要求。图 1-52b\n\nAlexander Stepanov 在他的书《编程元素》（The Elements of Programming）中，选择使用\
  \ `requires` 宏直接在源代码中指示模板参数的类型要求——即使它不包含任何“可编译的”（即非注释）源代码。如 stepanov09 所示：\n\n```cpp\n\
  #define requires(...)\n\ntemplate <typename I>\n\n    requires(I))  // 这正是 Stepanov\
  \ 在 91 页的渲染方式。\n\nvoid increment(I& x)\n\n{\n\n    // 前提条件：successor(x) 是定义的。（见第二卷第\
  \ 6.8 节。）\n\n    x = successor(x);\n}\n```\n\n后来，在他的书《从数学到泛型编程》（From Mathematics\
  \ to Generic Programming）中，Stepanov 选择再次使用 C++ 预处理器在代码本身中描述相同的信息，但这次是将 C++ 关键字 `typename`\
  \ 名为指示类型要求的概念名称。这正是 Stepanov 在 stepanov15 中渲染之前示例的方式：\n\n```cpp\n#define Iterator2\
  \ typename\n\ntemplate <Iterator2 I>  // 这是 Stepanov 在 stepanov15 中渲染之前示例的方式。\n\n\
  void increment2(I& x)\n\n{\n\n    // 前提条件：successor(x) 是定义的。（见第二卷第 6.8 节。）\n\n \
  \   x = successor(successor(x));\n}\n```\n\n注意，在所示的任何情况下，编译器都没有执行任何形式的静态验证来确保提供的类型符合要求；额外的努力仅是为了为了人类程序员的利益而编写文档。\n\
  \n图 1-52c 建议了一个物理组件，它勾勒了刻画 `Service` 概念所需的全部原始要求（与仅仅在某些集中目录中引用它不同）。\n\n\n\n\n\n\
  正如图 1-52b 所示的情况一样，定义具体 `MyService` 类型的组件作者将再次有责任确保它正确地建模了 `Service` 概念，并在其面向客户端的文档中对此宣明这一事实。同时，`MyClient`\
  \ 的作者也有责任在适当的地方将 `Service` 命名为类型要求。最后，同样重要的一点是，外部用户的责任不要尝试向 `MyClient` 提供一个未声称建模了\
  \ `Service` 的类型对象（在 `MyClient` 有明确显式要求的情况下）。\n\n即使阐述 `Service` 概念所有细节的英文规范在其自身的物理组件中列出（如图\
  \ 1-52c 所示），该组件之间仍然不存在固有的隐式物理依赖。也就是说，为了编译或链接定义 `MyService` 或 `MyClient` 的任一组件，都不需要描述\
  \ `Service` 的组件提供任何内容（在细化/refinement 的情况下也是如此）。基于此，我们继续使用虚线变体来反映（所有）这些“仅结构内”（In-Structure-Only）的关系。\n\
  \n我们可以很容易想象一种开发方法论（或语言），在这种语言中，每个非标准概念都在自己的组件中被完全刻画，而定义细化（refine）、建模（model）或使用（use）此类概念的逻辑实体组件，被要求\
  \ `directly` `#include` 直接（参见第 2.6 节）刻画它们的概念组件的 `.h` 文件^(117)。鉴于所有此类仅结构内（ISO）关系都伴随着对用于刻画该概念的头文件的强制性\
  \ `#include`，隐式的物理依赖（在实现中）便得以恢复。因此，ISO 关系中的虚线将被实线取代，如图 1-52d 所示。然而请注意，`Service`\
  \ 概念的椭圆仍保留了其虚线边界，因为它仍然是一个类型 `specification`（规范），而不是类型本身^(118)\n\n^(117) 将某些概念概念引入\
  \ C++ 语言的愿望在 C++98 标准化之前就已经存在了。在这一世纪的第一个十年里，C++ 标准委员会致力于开发一个基于 Haskell（类型类）和 Standard\
  \ ML（签名）特征的概念版本；参见**siek10**。然而，由于若干个技术和易用性方面的考量，该特性在 C++11 中被撤销了。2011 年 8 月在帕罗奥图（Palo\
  \ Alto）举行的一个具有里程碑意义的会议，涉及 Bjarne Stroustrup（C++ 的创建者）、Alexander Stepanov（STL 的创建者）以及许多人的参与，重新引发了人们对语言级支持概念的兴趣。该会议的成果是一份技术报告\
  \ N3351（**stroustrup12**），它使用“基于使用”的要求来约束 C++ 标准库的泛型算法。Andrew Sutton 负责将该报告转换为 WG21\
  \ 提案 N3580（**sutton13**）“轻量级概念”，这形成了 C++20 最终采用的概念版本的基础。\n\n^(118) 随着验证（在编译时）任意类型满足命名概念的语言支持被广泛使用，`#include`\
  \ 编码概念的头文件的需求不仅源于管理命令，也源于同样的常识工程实践——这种工程实践要求我们 `#include` 模板体和内联函数的体，而不是愚蠢地在手动复制其源代码后试图保持它们异构定义的定义性。模板类型将预期被命名概念所约束，因此需要物理包含它们的头文件，正如一个声称建模给定概念的组件实际上通过静态断言（例如，在它的\
  \ `.cpp` 文件中）这样做一样。即使是 `Refines`（细化）关系自然要求物理依赖，因为——根据构造——被细化的概念是一组类型要求，而其中之一就是它所细化的命名概念。因此，“仅结构内”关系的概念应该被视为活跃演进中的\
  \ C++ 语言的一个有用临时产物。\n\n#### 1.7.11 符号和术语总结\n\n总结来说，如果一个函数或（类）方法在其签名或返回类型中命名了某个类型，则它在接口使用了该类型。如果一个用户定义类型的一个（或多个）成员函数（方法）在接口使用了该类型，则该类型在接口使用了另一个类型，即“接口中使用类型”（Uses-In-The-Interface）。如果一个类在实现上使用了该类型，但没有在接口中（通过编程方式）暴露该使用，则该类在实现使用了该类型，即“实现中使用类型”（Uses-In-The-Implementation）。如果一个类型（正确地）公共继承自另一种类型，则它是另一种类型的一种，即“是一个”（Is-A）（参见卷\
  \ II 卷，第 4.6 节）。如果一个类（几乎总是一个协议）在编译、链接或测试该类时需要该类型的名称而非定义，则该类仅在名称上使用了该类，即“仅名称使用”（Uses-In-Name-Only）。最后，我们看到模板的类似（以及其他）用法产生了一些额外的、纯粹的仅结构内（ISO）关系：“仅结构内使用”（Uses-In-Structure-Only）、仅结构内建模”（Models-In-Structure-Only）以及仅结构内细化”（Refines-In-Structure-Only）。我们预计涉及概念的这些关系都将产生物理依赖，因此除了椭圆本身的所有符号都将过时。\n\
  \n### 1.8 Depends-On 关系\n\n构成软件的组件之间的物理依赖将深刻影响开发、测试、部署、维护和（分层）重用（参见第 0.4 节](#ch00.xhtml_ch00lev1sec4))在前节中，我们主要关注逻辑关系。在本节中，我们将关注依赖的不同方面（物理实体之间）。正如我们在下一节将看到的，逻辑实体之间的逻辑关系（如类和自由（运算符）函数）意味着它们所在的物理实体（如组件，参见第\
  \ 1.6 节](#ch01.xhtml_ch0116))）之间存在预测性的物理依赖。\n\n**定义：**\n\n**为了编译 `y` 需要 `x`，则组件\
  \ `y` 依赖于组件 `x`（Depends-On）。**\n\nDepends-On 关系与我们讨论过的其他关系大不同。Is-A 和 Uses 是逻辑关系，因为它们适用于逻辑实体，无论这些逻辑实体位于哪个物理组件。Depends-On\
  \ 是物理关系，因为它适用于整个组件。\n\n表示一个物理单元对另一个单元依赖的符号是（粗）箭头。例如，图 1-53 中的图表示组件 `plane` 依赖于组件\
  \ `wing`。也就是说，除非组件 `wing`可用，否则组件 `plane` 无法被使用（即无法编译并链接到程序中）。从第 1.7.1 节 回忆，与逻辑实体（如\
  \ `Classes` 和 `functions`，我们分别使用 `UpperCamelCase` 和 `lowerCamelCase`）不同，我们始终对物理实体（如文件、组件和库）使用全小写进行命名（参见第\
  \ 2.4.6 节](#ch02.xhtml_ch02lev2sec4-6))）。\n\nDepends-On\n\n![](img/fig1-53.jpg)\n\
  \n**图 1-53：组件 `plane` 依赖于组件 `wing`**\n\n\n\n\n\n按照我们的约定（第 1.7.1 节），逻辑实体用椭圆表示，物理实体用矩形表示。请注意，表示物理依赖的箭头是绘制在组件（矩形）之间，而不是单个类（椭圆）之间。用于表示物理依赖的（粗）箭头表示法绝不能与表示逻辑关系（如公共继承）的箭头表示法混淆。表示“是一个...”（Is-A）逻辑关系的继承箭头始终运行在（椭圆形的）逻辑实体之间，例如类或\
  \ `struct`；而“依赖于”（Depends-On）箭头始终连接（矩形的）物理实体，例如文件、组件和库（以及分别如第 2.7 节和第 2.8 节中描述的包和包组）。\n\
  \n现在，让我们考虑一下图 1-54) 如果一个类将一个用户定义类型的实例作为数据成员，那么即使在编译该类的定义时，也有必要知道该数据成员的大小（以及布局）。\n\
  \n^(119) 为了说明目的，我们选择实现自己的链表类型 `PointList`，它用于池化 `Point` 对象；更通用的解决方案是实现一个由其包含的元素类型参数化的泛型容器模板，与\
  \ `PointList` 不同，这种泛型容器将完全独立于类 `Point`。\n\n![](img/fig1-54.jpg)\n\n**图 1-54: 骨架头文件\
  \ `polygon.h`**\n\n### 定义\n\n**如果编译 `y.cpp` 需要 `x.h`，则组件 `y` 对组件 `x` 表现出*编译时依赖*。**\n\
  \n我们说，如果编译器在编译定义该实体的组件时必须看到该类的定义，则该逻辑实体对该类进行了*实质性使用*。具体来说，如果不先包含 `pointlist.h`，任何需要\
  \ `Polygon` 定义的文件都是无法编译的。根据组件属性 1（第 1.6.1 节）的原理，直接在 `polygon` 组件的头文件中放置 `#include\
  \ <pointlist.h>` 指令是恰当的。图 1-55 展示了 `polygon` 和 `pointlist` 组件文件之间详细的编译时依赖。\n\n![](img/fig1-55.jpg)\n\
  \n**图 1-55: `polygon.cpp` 对 `pointlist.h` 的编译依赖**\n\n根据组件属性 1，组件的 `.cpp` 文件在编译时必须始终依赖其自身的\
  \ `.h` 文件。由于 `polygon.cpp` 在没有（编译器看到）`polygon.h` 内容的情况下无法编译，而由于 `polygon.h` 在没有\
  \ `pointlist.h` 的情况下无法编译，因此 `polygon.cpp` 对 `pointlist.h` 有一种（间接的）编译依赖。再次注意，用于指示物理依赖的箭头绘制在两个物理实体（在本例中为文件）之间。物理依赖的更抽象的表示（即在组件级别）如图\
  \ 1-56\n\n**图 1-56: 组件依赖的抽象表示**\n\n### 定义\n\n**如果由编译 `y.cpp` 产生的对象文件 `y.o` 包含一个未定义的符号，链接器需要\
  \ `x.o` 来解析该符号，则组件 `y` 对组件 `x` 表现出*链接时依赖*。**\n\n也就是说，如果组件 `y` 需要某个符号的定义，且只有一个组件\
  \ `x` 的 `.o` 文件可以提供该定义，那么 `y` 在链接时依赖于 `x`。请注意，双绑定符号（例如分别为内联函数和隐式实例化函数模板生成的符号，分别见第\
  \ 1.3.12 节和第 1.3.14 节）不（通常）构成链接时依赖，因为它们（通常）重复出现在多个 `.o` 文件中——其中任何一个（特别是使用它的那一个）都能够解析该未定义的符号。^(120)\n\
  \n^(120) 在学术上，我们可以构造出一种情况，让只有极少数（即两个或更多）组件提供双绑定定义；然而，我们认为这样做没有实际价值（因此，我们不再进一步讨论它）。\n\
  \n一个组件不需要在编译时依赖于另一个组件，也可以在链接时依赖于该组件。考虑图 1-57\n\n**图 1-57: `region` 对 `pointlist`\
  \ 的链接时依赖**\n\n### 观察\n\n**编译时依赖往往会导致链接时依赖。**\n\n如果组件 `x` 编译必须包含另一个组件的头文件 `y.h`，那么可以预期使用其中的声明可能会在对象代码级别（在\
  \ `x.o` 中）生成未定义符号，然后需要由 `y.o` 解析。每当我们使用 (1) 非内联、非模板函数，(2) 在单独编译单元中显式定义的函数模板或 (3)\
  \ 具有静态存储期的外部（包括类）数据时，通常会导致链接时依赖（第 1.3 节）。即使在编译时依赖没有引入实际链接的情况下，我们也不敢依赖这些细节，因为它们会在不经意间发生变化。\n\
  \n### 观察\n\n**组件的依赖关系具有传递性。**\n\n如果组件 `x` 依赖于组件 `y`，而 `y` 反而依赖于组件 `z`，那么 `x` 就依赖于\
  \ `z`。组件之间的这种依赖传递性并没有说明一个组件中的哪个文件依赖另一个组件中的哪个文件。任何此类文件依赖足以产生整个组件的物理依赖。如图 1-58 所示，`region.cpp`\
  \ 包含了 `polygon.h` 中的外部声明，这可能在 `region.o` 中引入未定义符号，并由 `polygon.o` 解析。同样，`polygon.cpp`\
  \ 包含了 `pointlist.h` 中的外部声明，这可能在 `polygon.o` 中引入未定义符号，并由 `pointlist.o` 解析。尽管 `region.o`\
  \ 不直接依赖于 `pointlist.o`，但 `region` 对 `polygon` 的（直接）编译时依赖以及 `polygon` 对 `pointlist`\
  \ 的依赖产生了 `region` 对 `pointlist` 的（潜在）间接（链接时）物理依赖。\n\n![](img/fig1-58.jpg)\n\n**图\
  \ 1-58: `region` 对 `pointlist` 的间接链接时依赖**\n\n\n\n\n这种传递性的一个重要结果是，我们可以利用它来简化依赖关系图，而不会误导它们所描述的子系统的本质物理性质。假设图\
  \ 1-57 中 `polygon` 的另一种实现方式，以 `region` 为顶层的子系统中，所有四个组件的直接编译时依赖关系图如图 1-59a 所示。\n\n\
  ![](img/fig1-59.jpg)\n\n**图 1-59：本上上等价的物理依赖图**\n\n根据传递性，由于 `polygon` 直接依赖于 `point`，而\
  \ `region` 直接依赖于 `polygon`，我们可以通过添加从 `region` 到 `pointlist` 和 `point` 的（冗余）箭头来增强依赖图（图\
  \ 1-59b），而不会影响哪些组件可以独立于其他组件进行测试或重用。然而，更有效率的方法是消除表示 `polygon` 对 `point` 的直接（编译时）依赖的箭头（图\
  \ 1-59c），因为这种依赖已经通过传递性隐含了，从而减少不必要的混乱。\n\n### 1.9 隐式依赖\n\n众所抽象逻辑关系在这些逻辑实体所在的组件之间具有某些物理影响。在《C++\
  \ 语言》第三版中，Stroustrup 写道^(121)：\n\n^(121) `stroustrup00, 第 23.4.3.3 节，106–107 页，特别是第\
  \ 107 页\n\n在设计阶段（而不仅仅是实现阶段）考虑继承和使用关系的需求，直接源于使用类来表示概念。它意味着组件（§23.4.3, §24.4）而不是单个类，是设计的单位。\n\
  \n特别是，跨越组件边界的实质性逻辑关系（如“是” Is-A 和“使用” Uses）必然意味着物理依赖关系.^(122)。例如，图 1-60 显示了一个简单几何子系统的组件/类图（临时省略了组件名称）。^(123)\n\
  \n^(122) 注意，Stroustrup 在此处对组件的定义与我们的不同之处在于，根据他的定义，组件在本质上主要是逻辑性的。\n\n^(123) `PointList_Link`\
  \ 中下划线的使用仅根据惯例表示它不打算用于定义所在组件之外（参见第 2.7.1 节和第 2.7.3 节）。\n\n![](img/fig1-60.jpg)\n\
  \n**图 1-60：不同组件中定义的类之间的逻辑关系**\n\n图 1-60 中的逻辑符号（第 1.7 节）表示 `Polygon` 是 `Shape`（Is-A）。也就是说，`Polygon`\
  \ 类公地继承自 `Shape` 类。在不知道更多信息的情况下，我们可以得出定义 `Polygon` 的组件对定义 `Shape` 的组件有直接的（编译时）物理依赖。这种隐含的依赖关系如图\
  \ 1-61 所示。请注意，根据组件属性 1（第 1.6.1 节），定义 `Polygon` 的组件*必须*在其 `.h` 文件中 `#include` 定义\
  \ `Shape` 组件的头文件；否则定义 `Polygon` 组件的 `.cpp` 文件将无法编译。\n\n![](img/fig1-61.jpg)\n\n\
  **图 1-61：“是”关系意味着物理依赖**\n\n图 1-60 还表明 `Polygon` 类在接口中使用 `Point` 类（并在实现中实质性使用），这本身就足以推导出定义\
  \ `Polygon` 的组件对定义 `Point` 组件的依赖。此外，`PointList` 类及其局部辅助类 `PointList_Link` 在它们各自的接口也都使用了\
  \ `Point`。这些逻辑关系中的任何一个都足以得出定义 `PointList`（以及 `PointList_Link`）的组件依赖于定义 `Point` 组件的结论；综合来看，结论是相同的。1-60\
  \ 中组件之间由“使用”关系隐含的物理依赖关系如图 1-62 所示。\n\n![](img/fig1-62.jpg)\n\n**图 1-62：“使用”关系意味着物理依赖**\n\
  \n\n\n与“接口中的使用”（Uses-In-The-Interface）关系不同，“实现类中的使用”（Uses-In-The-Implementation）所隐含的物理依赖是`总是`直接的。然而，我们可以构建一个略有不同的场景，如图\
  \ 1-65 所示，图中，定义 `YourPolygon` 的组件并没有直接使用 `PointList`，而是在（其实现中）使用了 `YourPolygonImp`，而\
  \ `YourPolygonImp` 同样使用了 `PointList`。同样，根据传递性，定义 `YourPolygon` 的组件与定义 `PointList`\
  \ 的组件之间会存在间接的（可能是编译时的）依赖。\n\n![](img/fig1-65.jpg)\n\n**图 1-65：“实现类中的使用”所隐含的依赖总是直接的。**\n\
  \n最后，我们考虑图 1-60 中所示的最后一种逻辑关系——“仅在名称上的使用”（Uses-In-Name-Only），它并不意味着`任何`物理依赖。根据这种符号（在图\
  \ 1-66 中独立重复出现），`Shape` 类`仅在名称上`使用 `Point` 类 —— 例如，它的尺寸与其无关。从这些信息中我们可以得出结论——虽然存在名义上的协作，但这种逻辑关系并没有意味着任何（直接或间接的）物理依赖，因此不需要在定义\
  \ `Shape` 的组件的任何地方 `#include` `Point` 的定义（也不在 `Shape` 可能直接或间接依赖的任何组件中）。\n\n![](img/fig1-66.jpg)\n\
  \n**图 1-66：“仅在名称上的使用”意味着没有产生（直接或间接的）依赖。**\n\n“接口中的使用”（即使隐含的依赖被证明是间接的且仅在链接时发生）与“仅在名称上的使用”（对物理依赖完全没有影响）之间的重要区别经常被混淆，但区别仍然是清晰的：`仅在名称上`使用在另一个组件中定义的类型的组件，可以独立于该组件进行编译、链接和测试，而`在接口中`使用相同类型的组件则不能。\n\
  \n尽管任何两个逻辑实体之间最多只有一个 `uses` 关系，但“仅在名称上的使用”关系并不会抑制另一个关系对定义在同一组件中的独立逻辑实体所隐含的物理依赖。例如，如果一个组件定义了两个类\
  \ —— 其中一个被“仅按名称”使用，另一个被“按尺寸”使用 —— 则将隐含一个物理依赖（并且需要 `#include`），如图 1-67 所示。\n\n![](img/fig1-67.jpg)\n\
  \n**图 1-67：“仅在名称上的使用”不会抑制其他隐含的依赖。**\n\n最后请注意，尽管并不常见，但两个逻辑实体同时具有“是一个”（Is-A）关系和“接口中的使用”关系并非闻所未闻\
  \ —— 尤其是当这两种关系都指向相同方向的隐含物理依赖时。例如，考虑将一个标准具体类型适配到本地抽象接口（协议）^(125)，如图 1-68 所示。`MyPolygon`\
  \ “是一个” `StdPolygon`（见第二卷，第 4.6 节），并且可以在（大多数）预期 `StdPolygon` 的情况下使用（见第二卷，第 5.5 节）。同样，定义在\
  \ `MyPolygon`（无额外数据）上的某些方法（例如构造函数）在接口中自然会接受 `StdPolygon` 的对象。这对逻辑关系捕捉这种意图，同时隐含了正确的物理依赖^(125)\
  \ `lakos96`，附录 A，第 756–758 页。\n\n![](img/fig1-68.jpg)\n\n**图 1-68：“使用”和“是一个”并不一定互斥。**\n\
  \n图 1-60 中所示的逻辑关系所隐含的完整物理依赖集在图 1-69a^(126)中给出。一旦我们确定了所有的物理依赖，就可以通过移除逻辑实体来简化图形，只留下组件之间的物理关系，如图\
  \ 1-69b 所示。注意，组件右上角的数字是 `level numbers`（层次数字），它们在接下来的章节^(126)中进行了解释。回想第 1.7 节，在我们的方法论中，组件名称作为物理实体，完全采用小写字母（参见第\
  \ 2.4 节）。\n\n![](img/fig1-69.jpg)\n\n**图 1-69：逻辑关系隐含的物理依赖**\n\n在设计阶段推断物理依赖使我们能够在开发过程更早阶段确保稳健的物理架构。我们大多数的小子系统设计都源于本节中看到的这种简单组件/类图。我们刻意利用逻辑关系的隐含性，在设计实现之前预测组件之间的物理依赖。\n\
  \n在设计阶段推断物理依赖使我们能够在编写任何代码之前，更早地确保软件架构的物理质量。\n\n总结一下，我们的三种实质性逻辑关系 —— “是一个”、“接口中的使用”和“实现类中的使用”（1.7.2\
  \ 节–1.7.4 节）在跨越组件边界时隐含物理依赖，而“仅在名称上的使用”（1.7.5 节）则没有。\n\n“是一个”引起直接的编译时依赖，在我们方法论中，这要求在定义派生类的\
  \ `.h` 文件中 `#include` 定义基类的 `.h` 文件（1.7.2 节）。\n\n“接口中的使用”隐含了一种（可能是间接的）依赖，它（可能）不需要在用组件的\
  \ `.h` 或 `.cpp` 中 `#include` 被用类型的定义，但根据物理依赖的传递性，它仍然隐含了真正的物理依赖（1.7.3 节）。\n\n另一方面，“实现类中的使用”总是引起直接的编译时（可能也是链接时的）依赖，这要求在用组件的\
  \ `.h` 或 `.cpp`（视情况而定）中 `#include` 定义被用类型的头（1.7.4 节）。\n\n“仅在名称上的使用”指示逻辑协作，但与“接口中的使用”不同\
  \ —— 它并不意味着任何物理依赖（1.7.5 节），其他纯协作的 ISO（仅在结构上的使用）逻辑关系（1.7.6 节）也是如此；这些纯协作关系在 1.7.7\
  \ 节中进行了比较，并在 1.7.8 节中进行了对比，位于第 1.7 节的末尾。关于外部链接构造的设计规则可以在第 2.6 节中找到。\n\n### 1.10\
  \ 层次数字\n\n\n\n\n我们现在描述一种根据物理依赖将组件划分为等价类的方法，这些类被称为 `levels`（层级）。每个层级关联一个非负整数索引，称为\
  \ `level number`（层级）。如果软件子系统的组件依赖关系——例如 `package`（参见第 2.8 节）——恰形成一个有向无环图（DAG），我们可以将该子系统中每个组件的\
  \ `level` 定义为从该组件到本地 `leaf`（叶节点）组件物理依赖长路径上的组件数量。\n\n### 定义\n\n**无环物理依赖允许（非负）层级的规范分配：**\n\
  \n*   **Level 0：** 非本地组件。\n*   **Level 1：** 不在物理上依赖于任何其他本地组件的本地组件（也称为 `leaf component`，叶节点组件）。\n\
  *   **Level N：** 物理上依赖于至少一个 `N − 1` 级的本地组件（当 `N ≥ 2` 时），但不依赖于任何 `N` 层或更高层的组件。\n\n\
  在此定义中，我们假设当前项目目录（或包）之外的组件（例如 `iostream`）已经过测试，并且已知功能正常。这些组件被视为给定的，并被分配层级为 0。一个物理上不依赖于任何其他本地组件的本地组件被称为\
  \ `leaf` 组件，并定义为层级为 1。否则，每个本地组件的层级定义为其所依赖的组件的最大层级加 1。\n\n### 定义\n\n**用可以分配层级的组件来表示的软件子系统被称为\
  \ `levelizable`（可分级化的）。**\n\n根据我们的定义，任何物理依赖关系形成 DAG（有向无环图）的组件基子系统的每个节点都恰好对应一个可能的层级；而参与循环的节点则没有。也就是说，对于循环依赖子系统的节点，其“层级”的概念没有类似的这种自然、明显且直观的含义。^(128)\n\
  \n^(128) 为了使软件工具能够适应具有循环的依赖图，我们可以通过将每个由 `M` 个组件组成的循环依赖子集视为一个跨越 `M` 层的复合节点，并将每个组件标记为具有该复合节点所跨越的最高层，泛化层级的概念。例如，给定\
  \ 5 个本地组件——`a`、`b`、`c`、`d` 和 `e`——其中 `b`、`c` 和 `d` 形成一个 `M = 3` 的循环，且 `e` 直接依赖于\
  \ `c`，而 `c` 直接依赖于 `a`，则 `extended level numbers`（扩展层级）的分配为 `a` → 1、`b` → 4、`c` →\
  \ 4、`d` → 4 以及 `e` → 5。更多关于这种泛化层级定义（为了编写分析工具，允许带有循环的图），请参见 lakos96，附录 C.1，第 780–793\
  \ 页，特别是从第 788 页列表之后开始。\n\n例如，图 1-60 第 1.9 节 所示图没有依赖循环，因此是 `levelizable` 的。图 1-69b\
  \ 第 1.9 节 显示了每个组件的层级，显示在描述该组件的框右上角。`point` 组件不依赖任何其他本地组件，因此它处于第 1 层。`shape` 组件在\
  \ `Shape` 类和 `Point` 类之间仅有一个仅用于命名的关系（Uses-In-Name-Only），它也处于第 1 层。因此，`point` 和 `shape`\
  \ 都认为是该子系统的 `leaf` 组件。`pointlist` 组件定义了两个类 `PointList` 和 `PointList_Link`，两者都对 `Point`\
  \ 类进行了实质性使用；因此，`pointlist` 组件物理上仅依赖于叶组件 `point`，因此处于第 2 层。最后，`polygon` 组件依赖于组件 `point`\
  \ 和 `shape`（都在第 1 层），并且依赖于组件 `pointlist`（处于第 2 层），因此处于第 3 层。\n\n注意，`levelizable`\
  \ 一词适用于物理实体而非逻辑实体。虽然无环逻辑依赖图可能允许一个或多个可测试的物理划分，但（物理）组件的层级以及第 1.6 节 中列出的组件属性暗示了有效测试的可行顺序。此外，可分级系统可以根据需要分层地复用。图\
  \ 1-69 第 1.9 节 中的各种部分子系统可以独立于其他系统进行复用。\n\n\n\n\n\n这一真实的设计逐字摘自 lakos96，第 4.7.2 节，图\
  \ 4-13，第 172 页。\n\n![](img/fig1-72.jpg)\n\n**图 1-72：这种设计可以分级吗？**\n\n事实证明，该设计中指示的逻辑关系*并不*意味着所示组件之间存在循环物理依赖；然而，该组件/类图过于混乱，包含的信息比理解子系统物理结构所需的信息更多。如果我们重新安排组件的位置并消除逻辑细节，就能得到极其清晰的\
  \ 图 1-73 所示的组件依赖图。(130)\n\nlakos96，第 4.7.2 节，图 4-15，第 174 页\n\n![](img/fig1-73.jpg)\n\
  \n**图 1-73：隐含的组件依赖图**\n\n然而，在 图 1-73 中存在一条冗余边。组件 `wordexbuilder` 直接依赖于组件 `directory`、`file`\
  \ 和 `node`。正如我们从 第 1.8 节 所知，依赖（Depends-On）关系具有传递性。由于 `directory`（`file` 也是如此）依赖于\
  \ `node`，因此 `wordexbuilder` 对 `node` 的指示依赖是隐含的，可以删除而不影响层级编号。图 1-73 中的图显然是无环的，是处理特定应用的子系统的典型特征。在抽象抽象上，设计的物理结构看起来是健壮的。\n\
  \n这种分析的巨大好处之一是，在理清组件依赖图后，我们能够在甚至不细微讨论应用领域的情况下，对物理设计的完整性做出实质性的性评价。无法分配层级提供了一个清晰且客观的指标，表明当前设计在实施之前就是不可靠的。帮助自动化这种分析的简单工具很容易编写，并且已被证明对大型系统的开发具有极价值。(131)\n\
  \nlakos96，附录 C，第 799–813 页\n\n### 1.11 提取实际依赖\n\n假设我们设计了一个大型项目，其指导来自跨组件边界逻辑关系的隐含依赖（第\
  \ 1.9 节）。现在设计阶段已大部分完成，开发正在进行中，我们希望有一个工具可以提取组件之间*实际*的物理依赖，以便我们跟踪并将其与初始设计预期进行比较。\n\
  \n虽然可以通过解析整个 C++ 程序或库的源代码来确定精确的组件依赖图，但这样做既困难又相对较慢——事实上，这种速度慢到至于被认为是不可扩展的。(132) 然而，我们可以仅通过解析组件源文件（`.h`\
  \ 和 `.cpp`）的 C++ 预处理器 `#include` 指令，轻松推断出组件依赖图。这种处理速度较快（且可扩展），并且通常由许多标准的、公有领域的依赖分析工具完成。(133)\n\
  \n更通地说，我们在书中提倡的内容假设了今天使用传统工具链（编译器、链接器等）可以实现的程度。声称存在支持特殊功能（如全程序优化）的编译器可能会消除此处建议的做法，这些说法也被一律驳回，理由是它们目前不可扩展（在可预见的未来也不可能如此）。\n\
  \n例如，`gmake`、`scandeps`（来自 PVCS）、`makedepend` 和 `Kythe`。\n\n然而，为了使这种依赖分析策略生效，我们需要为良好的组件对\
  \ `.h /.cpp` 对在 第 1.6 节 中讨论的三个属性增加第四个属性。\n\n#### 1.11.1 组件属性 4\n\n对于由另一个组件唯一定义的具有外部或双重绑定的逻辑结构，没有本地的“前向”声明；相反，应该\
  \ `#include` 该组件的 `.h` 文件以获取所需的声明。\n\n前三个属性（第 6.1–6.3 节）确保了每个具有内部之外绑定的逻辑实体都于组件的\
  \ `.h` 文件中，并且编译器将有机会验证实体的定义与其声明保持一致。第四个属性确保了组件的客户端使用经过验证的声明，而不是创建它们自己的（可能是错误的）版本。\n\
  \n例如，如果我们想在其中一个组件中使用标准 C 函数 `pow`，我们始终会包含包含 `pow` 声明的相应头文件，如 图 1-74a 所示，而绝不会尝试像\
  \ 图 1-74b 那样自己声明它。同样，我们会包含提供任何全局变量声明的组件头文件，而不是重复其 `extern` 声明。\n\n![](img/fig1-74.jpg)\n\
  \n**图 1-74：访问具有外部绑定的非本地实体**\n\n当一个组件使用具有外部绑定的结构时，组件属性 4 强制产生了编译时依赖。除了之前讨论的工程理由外，组件属性\
  \ 4 还让开发者能够通过检查两个文件顶部的 `#include` 指令，一眼推断出组件的*所有*直接依赖。对于良好的组件，满足 `.h/.cpp` 对的四个属性中的任何一个在模块化维护性方面都有明显的益处，但它们共同导致了一个核心观察：\n\
  \n##### 观察\n\n**只要系统可以编译，C++ 预处理器 `#include` 指令就足以推导出系统组件之间*所有*实际物理依赖。**\n\n组件属性\
  \ 4 要求，为了让组件 `x` 实质使用组件 `y` 中的任何逻辑实体，`x` 必须在 `x.h` 或 `x.cpp` 中包含 `y.h`。因此，一个组件对另一个组件的实质使用总是意味着编译时依赖。在组件属性\
  \ 4 的情况下，其逆命题（即如果 `x`*没有*包含 `y.h`，则 `x` 就*没有*实质使用 `y`）无疑成立。相反，组件 `x` 包含 `y.h` 的唯一合法理由是该组件确实实质使用了组件\
  \ `y`。否则，包含本身将是多余的，并引入不必要的编译耦合。其逆命题（即如果 `x`*没有*实质使用组件 `y`，则 `x` 就*没有*包含 `y.h`）也应该是成立的，尽管偶尔由于人为疏忽，事实并非如此。(134)\n\
  \n\n\n\n\n# 编写检测并移除（或重构）必要的 `#include` 指令的工具，比初看起来要困难得多。在编写他具有深远影响的 *Effective C++*\
  \ 编程书籍之前，Scott Meyers 曾尝试编写软件来机械地检测此类设计上的缺陷，但很快发现许多问题并没有无明确的客观解决方案。十年后，相关研究 (felber10)\
  \ 产生了一项集成在 IDE 中的工具，称为 Cevelop（[www.cevelop.com](http://www.cevelop.com)），该工具可以自动减少/移除不必要的\
  \ `#include`。该研究是在瑞士拉珀斯斯维尔（Rapperswil）应用科学大学 FHO-HSR Hochschule für Technik IFS\
  \ 软件研究所 Peter Sommerlad 教授（Peter.Sommerlad@hsr.ch）的指导下进行的。\n\n## Definition\n\n\
  **如果 `y.h` 的内容在编译时最终合并到对应 `x.cpp` 的编译单元中（针对*任何*支持的构建目标），则认为组件 `x` *包含*（Includes）另一个组件\
  \ `y`。**\n\n嵌入在源码中的 `#include` 指令非常准确地指示了正确组件之间的链接时以及编译时依赖关系。知道组件的任何实质性使用都通过包含其头文件来标记，就能保证*包含*关系的*传递闭包*^(135)\
  \ 指示了组件之间所有可能的物理依赖。以这种方式提取的依赖图可能会指示出由不必要的 `#include` 指令带来的额外、虚假的依赖（这些依赖本应该被移除的）。但是，鉴于我们对\
  \ `.h /.cpp` 对的四个核心组件属性的成立，*包含*关系永远不会遗漏任何实际的组件依赖。\n\n二元关系上*传递闭包*的定义如下：给定一个方阵布尔矩阵\
  \ `A(I, J)`，其中每个元素 `A(*i*, *j*)` [0 ≤ *i* < I 且 0 ≤ *j* < J] 表示元素 `i` 是否在一步之内与元素\
  \ `j` 相关，那么传递闭包则表示元素 `i` 是否在 1 步或更多步之后与元素 `j` 相关的二元关系。\n\n从可能大量的组件集合中快速、准确地提取实际物理依赖的能力，使我们能够在——整个开发过程中——验证这些依赖关系与我们的整体架构计划保持一致.^(136)\
  \ 多年来，此类工具在大型系统的开发和维护中被证明是无价的。^(137)。\n\n提取物理依赖工具 set 的完整规范请参见 lakos96, 附录 C 第 779–813\
  \ 页。\n\n随着近期 Clang 的出现，需要对 C++ 进行完全解析的工具得到了极大的便利，尽管如此，它现在以及将来也无法与对 `#include` 指令进行简单模式匹配所提供的原始速度相比。\n\
  \n## 1.12 Summary\n\n### 1.1 知识就是力量：魔鬼在细节中\n\n许多人会告诉你，设计独立于 (1) 用于表达它的语言和 (2) 用于构建和渲染它的工具。我们不同意。语言支持什么以及它能表达什么的细节，微妙而无处不在地塑造了我们谈论甚至思考设计的方式。如果不彻底理解我们用编辑器编写的源码是如何被翻译并组装成可执行程序的，我们就缺乏创建可扩展大型系统所需的*物理*基础。事实上，如果对源代码底层发生的情况没有深入理解，即使是微小的程序也会表现出非凡的正确性和维护问题。\n\
  \n### 1.2 C++ 的编译与链接\n\nC++ 程序分两个主要阶段构建。在*编译阶段*（参见 图 1-2, 第 1.2.1 节）：(1) 每个实现文件（`.cpp`）经过预处理，将\
  \ `#include` 指令指示的任何头文件（`.h`）——这些文件直接出现（在 `.cpp` 文件中）或递归出现（在包含的 `.h` 文件中）——合并到一个名为*编译单元*的单一中间表示中；(2)\
  \ 然后将这种源码级表示翻译（编译）为二进制（机器可读）表示并存储在对象文件（`.o`）中。\n\n在*链接阶段*（参见 图 1-3, 第 1.2.1 节），将顺序检查合并到程序中的每个\
  \ `.o` 文件，以确定哪些未定义符号必须通过其他 `.o` 文件提供的定义在外部解析。每个外部符号引用都必须唯一地解析，否则链接将失败。如果成功，包含已知入口点\
  \ `main` 的结果程序将存储为可执行文件（例如，`a.out`）。\n\n工具的通用能力，尤其是链接器的能力，是实现 C++ 这类语言中某些目标目标的人为限制性因素。从历史上看，对象文件总是必须以原子方式合并到程序中的。此外，每个此类\
  \ `.o` 文件中的所有未定义符号都必须被解析，无论它们是否被使用。因此，即使是逻辑相关的函数有时也会被放在不同的编译单元中，因为定位（colocation）可能会导致对其他不需要的\
  \ `.o` 文件的依赖，从而导致程序不必要地变大。\n\n为了支持更高级的语言特性（如隐式实例化以及内联函数），所有现代平台现在支持编译器在多个 `.o` 文件中生成重复函数定义，然后依赖链接器在可执行文件中包含多个（相同）副本中的一个。然而，为了让这种方法生效，编译器/链接器技术必须确保每个此类定义都像位于\
  \ `.o` 文件中的自己的*段*（segment）一样，这样它可以独立于该 `.o` 文件中的任何其他代码被合并或不合并——即使用该定义不会引入其他定义。尽管如此，由于此类细节很大程度上取决于平台（以及部署）（参见\
  \ 第 2.15 节），我们继续设计为 `.o` 文件总是原子合并。\n\n库存档有助于构建软件变得更容易并便于分发。与其链接单个 `.o` 文件，我们可能会选择使用归档器（例如\
  \ Unix 上的 `ar`）将一组适当的 `.o` 文件放在库文件（例如 `.a`）中（参见 图 1-8, 第 1.2.4 节）。与直接提供的 `.o` 文件不同，通过库提供给链接器的\
  \ `.o` 文件仅在需要解析之前定义的未定义符号时才会被合并。然而，一旦 `.o` 被合并，随后对它的处理就像它是直接提供的一样。注意，不能让这种差异改变库软件的意图行为（例如通过运行时初始化的文件作用域静态变量），正如“单例”注册表示例中所出现的情况（参见\
  \ 图 1-11, 第 1.2.5 节）。\n\n\n\n\n库存档的处理方式取决于平台。例如，在 Unix 平台上，库是按顺序扫描的；每个库会轮流用于解析任何符号引用，然后移动到下一个库。粗心地地将对象文件放置在归档中，导致库之间产生互依赖关系，这使得它们更难以被理解和维护。在许多其他不良的后果中，库存档之间存在互依赖关系（在某些平台上）可能要求在链接行上重复出现一个或多个库\
  \ —— 而这些库的顺序和频率会随着库的微小改进而改变。\n\n## 1.3 声明、定义与链接\n\n`declaration`（声明）通常用于向作用域内引入一个名称，并且在大多数情况下，它可以在一个编译单元内重复。另一方面，根据单一定义规则（`ODR`）的限制，一个程序中的任何`object`、`function`或`type`最多只能有一个定义。在\
  \ C++ 中，存在纯声明（例如前向声明）、也可以兼作声明的定义（即它们是自声明的）以及不能兼作声明的定义。区分这类构造并不容易，或许通过示例来介绍最为合适（参见图\
  \ 1-27，第 1.2.20 节）。\n\n纯声明通常用于函数参数或返回类型的类型。在几乎所有情况下，使用此类前向声明的编译器最终都会看到相应的定义（当实际性地使用它时）。在罕见（且几乎总是人为构造的）场景下，`class`声明可能在程序任何地方都没有出现相应定义的情况下使用（参见仅限名称使用的关系，第\
  \ 1.7.5 节）；纯抽象接口 —— 我们称之为 `protocols` —— 是此类关系在实践中发生的唯一自然方式。通过在适当的头文件中使用前向类声明而非\
  \ `#include` 指令（第 1.6 节 和 1.11 节），我们通常可以大幅减少不必要的编译时耦合（参见第二卷第 6.6 节）。\n\n对于使用可能由链接器解析的命名实体，声明的作用是向编译器描述其充分利用该实体所需的所有信息\
  \ —— 也就是说，除了它在最终可执行程序内存中的地址之外的所有信息。如果通过其声明对此类实体进行了任何实质性的 `use`，且假设在编译单元内部没有看到相应的定义，则与该实体相关的符号的引用将被放在该编译单元生成的\
  \ `.o` 文件中。随后，将由链接器负责找到该实体的（唯一）定义，并在链接时填充缺失的地址信息。\n\n`ODR` 适用于单个编译单元和整个程序。在给定的编译单元内，“一个”意味着源代码定义的一个实例^(138):\n\
  \n^(138) **iso11**, 第 3.2.1 节\n\n*（注：所提供的文本在后半部分似乎有大量的重复/损坏段落。我已根据提供的输入处理了核心逻辑流，同时保持了格式规则。）*\n\
  \n\n\n\n在典型平台上，当一个编译单元的编译器无法访问某个定义的源代码时，链接器将被要求将函数名的使用解析到其定义；而当它可以访问定义时，编译器可能会选择自行将该名称的使用与其定义链接起来——无论该函数是否被声明为\
  \ `inline`（内联）。理解典型平台上底层工具的能力和局限性（例如在 `bindage` 方面），能够让我们更好地对建模，从而理解并推理 C++ 语言的复杂性（例如关于链接方面）。\n\
  \n## 1.4 头文件\n\n在 C 和 C++ 中，头文件虽然不是严格必须的，但其目的是为了促进跨编译单元的通用源代码共享。C 作为一种过程化语言，允许但并未有效支持支持抽象数据类型（ADTs）。因此，C\
  \ 语言中的模块化编程演变成了相对较大且某种程度上不规则的物理单元。随着 C++ 引入了私有数据和内联函数，可以以自动变量的形式创建高效的 ADT 对象（直接创建在程序堆栈上）。这些较小的（原子的）设计单元由于其实现更均匀地分布在\
  \ `.h` 和 `.cpp` 文件之间，变得具有独立价值，导致了软件的非正式组织，通常被描述为 `.h` / `.cpp` 对。\n\n注意，可以使用 `struct`\
  \ 或 `namespace` 来限定原本是自由的（非成员）函数或全局变量的范围。如果为此目的使用 `namespace`，必须小心确保将*限定的*（qualified）定义实现在命名空间*之外*（就像被迫对\
  \ `struct` 这样做一样）。通过这种方式，函数签名或全局变量名称的声明与定义之间的不一致将由库开发者在编译时自动检测（而不是由客户端在链接时碰运气）。由于这些原因及其他工程原因（见图\
  \ 2-23、第 2.4.9 节），我们倾向于对限制单个物理模块（组件）的范围使用 `struct`，并对跨模块的范围使用 `namespace`。\n\n我们将头文件作为一种模块化机制，用于共享具有内部或双重绑定的定义，例如类、内联函数和模板，以及结构别名（如\
  \ `typedef` 和预处理器宏）。我们还使用头文件分发共享外部绑定构造的一致声明，例如具有静态存储生存期的函数（或变量）。\n\n## 1.5 包含指令和包含保护符\n\
  \n头文件中需要包含保护符（include guards），以确保被单个编译单元多次 `#include` 的头文件所包含的任何定义只被编译器解析一次。*内部*包含保护符可以实现这一目标，但长期以来（多年来）它们在某些行业标准平台上仍持续导致在编译期间花费了过多的时间。\n\
  \n头文件中的*外部*（“冗余”）包含保护符现在已被废弃，它们曾用于防止编译器（尤其是旧版本的编译器）多次打开头文件，这在历史上提高了构建时的性能。然而，最近，它们在更现代的平台上的残余益处（如果有的话）在于——由于其非常丑陋——冗余保护符的作用提醒我们：在头文件中\
  \ `#include` 一个 `.h` 文件*仅*是为了确保该头文件在编译方面是自自足的，而没有其他其他原因。\n\n## 1.6 从 `.h /.cpp`\
  \ 对到组件\n\n我们的软件开发方法论基于原子构建块的存在，我们称这些构建块为*组件*（components），它们由 `.h` / `.cpp` 对组成，每个对具有某些基本的物理属性（第\
  \ 1.6 节 和 1.11），如图 1-77 所示。\n\n![](img/fig1-77.jpg)\n\n**图 1-77：组件的四个基本属性**\n\n\
  组件属性 1 使编译器能够帮助确保物理接口与实现之间的一性（在编译时）。让组件包含自己的头文件可以有效且永久地消除依赖包含顺序的缺陷。组件属性 2 确保所有导出的符号都在源代码级别表示，并且可以通过包含头文件进行访问（避免了创建任何本地\
  \ `extern` 声明）。如果没有组件属性 3，具有相同根名称的 `.h` 和 `.cpp` 文件之间的关联所隐含的任何模块化将是空谈。组件属性 4 将单独讨论（第\
  \ 1.11 节），它不仅确保库代码中函数名、签名和返回类型的更改会被客户端在编译时检测（而不是在链接时，或者更的运行时），而且让我们以比其他任何方式快数量级的速度提取物理依赖（例如，通过解析\
  \ C++ 源代码），通过一个简单的（例如 Perl）脚本检查合并后的 `.h` 和 `.cpp` 文件中的 `#include` 指令即可。\n\n## 1.7\
  \ 符号和术语\n\n在整本书中，我们将使用我们自己的极简符号表示法（见图 1-47、第 1.7.1 节）。逻辑实体（例如类和函数）分别被胶囊状和椭圆状的气泡包围；物理实体（例如文件）被矩形包围。符号\
  \ ![](img/fig1-18.jpg) 表示（公共）继承：`D` 是一个 `B`。符号 ![](img/fig1-19.jpg) 表示 `B` 以这种方式使用\
  \ `A`。如果一个类（或函数）`B` 在实现中命名了类型 `A` 但在接口中未使用 `A`，我们将这种关系表示为 ![](img/fig1-20.jpg)。在使用私有继承的情况下，我们将使用此符号，而不是箭头（箭头意味着公共继承）。最后，如果\
  \ `B` 在接口通过名称使用 `A` 但并非实质性的（即编译、链接或彻底测试 `B` 不需要 `A` 的定义），我们将这种关系的特殊情况表示为 ![](img/fig1-21.jpg)。用于表示其他纯协作——*仅结构性*（ISO）——逻辑依赖的附加符号总结在图\
  \ 1-50、第 1.7.6 节中。\n\n## 1.8 依赖关系\n\n除了上述的逻辑关系外，我们定义了一种物理关系，即依赖（Depends-On），它必然发生，且仅在*物理*实体之间发生。符号\
  \ ![](img/fig1-22.jpg) 表示编译或链接 **y** 需要 **x**。编译时依赖通常会导致链接时依赖，因为访问 `.h` 文件中的 `extern`\
  \ 声明创建的任何未定义符号必须由相应 `.cpp` 文件中的定义满足。由于 `.o` 文件被认为是原子合并的，给定三个组件 **`a`**、**`b`** 和\
  \ **`c`**，如果 `a.cpp` 包含 `b.h` 且 `b.cpp` 包含 `c.h`，则可能需要 `c.o` 来解析 `b.o` 中的未定义符号，而反过来也可能需要解析\
  \ `a.o` 中的未定义符号。因此，`a.o` 间接依赖 `c.o`，符合本章所述组件属性的 `.h` / `.cpp` 对的依赖关系具有传递性。\n\n##\
  \ 1.9 隐式依赖\n\n\n\n\n跨越物理边界的实质性逻辑关系（例如公共继承，或在接口或实现中使用）意味着存在物理依赖。通过在*我们设计时*考虑这些隐含依赖的物理后果，我们可以预先避免某些错误，这些错误如果不在一开始就被检测到，以后可能会迫使我们对代码进行大量的重构。我们将利用符合规范的\
  \ `.h` / `.cpp` 对的第四属性，在整个开发过程中自动验证组件之间的依赖假设。\n\n### 1.10 层级数字\n\n`level numbers`\
  \ 的主要目的是帮助我们及早发现并消除循环。组件的`层级化`（levelization）涉及根据组件在局部（无环）物理层级中的位置，为子系统内的组件分配确定层级数字。对其他本地组件没有物理依赖的组件被称为`叶子组件`（leaf\
  \ components），它们自然处于第 1 层。其他任何本地组件 `c` 的层级等于其所依赖的层级最大的本地组件层级加 1。根据这个定义，当且仅当不存在循环物理依赖时，才能为软件子系统内的组件分配层级数字。避免此类物理设计循环将极大地提高我们理解、测试和维护软件的能力。\n\
  \n### 1.11 提取实际依赖\n\n最后，在本章中，我们描述了如何设设管理如 C++ 等高度复杂的编译语言的底层机制。配备了这种心理模型，我们现在能更好地准备解释\
  \ C++ 标准的字面含义，并对受实现细节影响的关键设计决策进行推理，而这些细节在其他可能会被遗漏。这里描述的组件的四个基本属性（见 1.6 节 和 1.11\
  \ 节）用于刻画我们逻辑和物理设计的基本原子单元。这第四个属性的实际益处——即永远不在本地重新声明任何具有*外部*或*双重*绑定的结构，而是始终包含定义该结构的组件的（唯一）头文件——其能力在于，仅通过\
  \ `#include` 指令就能提取出（物理）组件依赖的范围，而无需解析 C++ 源代码本身。这些属性共同确保了符合规范的 `.h` / `.cpp` 对是逻辑和物理上都一致的设计原子单元，随后可以将它们打包成更大的一致实体以进行独立发布。组件（以及其他非符合规范的软件）如何打包和部署将在下一章详细介绍。\n\
  \n## 2. 打包与设计规则\n\n### 2.1 宏观视图\n\n### 2.2 物理聚合\n\n### 2.3 逻辑/物理一致性\n\n### 2.4 逻辑与物理名称内聚\n\
  \n### 2.5 组件源码组织\n\n### 2.6 组件设计规则\n\n### 2.7 组件私有类与从属组件\n\n## 2.8 包（Package）\n\n\
  ### 2.9 包组（Package Group）\n\n### 2.10 包与包组命名\n\n## 2.11 子包\n\n### 2.12 遗留代码、开源与第三方软件\n\
  \n## 2.13 应用\n\n### 2.14 分级可测试性要求\n\n## 2.15 从开发到部署\n\n## 2.16 元数据\n\n## 2.17 总结\n\
  \n*软件工程*一词对不同的人有不同的含义。一些聪明、充满激情且个人高效的开发者认为软件的创建是艺术的一种，任何强加的限制（无论对整体有多益）都会扼杀个人的创造力。这种态度滋生了无端的规则性，反过来又损害了我们软件开发过程的整体效率。相反，我们认为，如果我们作为一个组织要达到软件生产力的最高水平，必须遵守某些基本规则（甚至是少数任意的惯例）。正是基于这种理解，我们才提供了本章的内容。\n\
  \nC++ 在逻辑和物理层面的思想表达上提供了极大的自由。如果不加约束，我们理解任意且多样的物理结构的能力会随着系统规模的增大而减弱。然而，编译器或链接器并不知道也不关心我们的源代码在做什么，只要它遵循它们的组织规则即可。所有这些工具看到的只是我们代码的*物理*结构。因此，我们可以选择独立于其所体现的领域功能来组织源代码。我们的意图是为我们开发的可能海量的软件提供一些通用的结构。从设计上来说，这种组织结构在物理上是统一的，并且独立于当前的任务。简而言之，本章定义了“游戏规则”。\n\
  \n我们即将激励并展示的，是一组较小的架构设计规则，这些规则共同为组织组件化软件（以及非组件化的遗留、开源和第三方软件）提供了一个经过证明的框架，能够在企业规模上实现有效的设计、开发、测试和部署。然而，与典型的命名规范或编码标准不同，这些架构规则超越了语言特性，关注重要问题，并特别强调实现开发的可扩展性和有效的复用。无疑，我们在这里推荐的软件组织方式不是唯一的方法，但它是我们在实践中成功使用了多年的，并且经受了时间的考验。\n\
  \n### 2.1 宏观视图\n\n软件组织的方式决定了我们能在多大程度上利用该软件来快速、有效地解决当前和新的业务问题。从设计上讲，我们为应用程序编写的大部分代码位于共享库中，而不是直接位于任何一个应用程序中。因此，我们的目标是提供某种顶层组织结构——如图\
  \ 2-1 所示——允许我们将软件划分为离散的物理单元，以便于发现、理解并可能重用现有的软件解决方案。(1)\n\n^(1) 经过增强（或分支）以实现特定目的的开源代码也属于这一类（例如，为了适应我们的（多态）内存分配器模型而调整的第三方软件——见第二卷第\
  \ 4.10 节）。\n\n![](img/fig2-1.jpg)\n\n**图 2-1: 企业级软件组织视图**\n\n\n\n\n\n如第 0 章和第 1\
  \ 章描述的，我们在创建新的库和应用程序软件时的大部分工作都涉及组件作为设计的原子单元。但正如图 2-2a 所示，仅靠组件由于规模太小，无法在大规模上有效地管理和维护软件。因此，我们希望将逻辑相关且具有相似物理依赖关系的组件聚合成一个更大的物理实体，我们将其称为一个\
  \ `package`（包），它可以被更有效地作为一个单元来处理。这些在逻辑和物理上都具有内聚性的较大实体可以进一步聚合为一个更大的软件体，我们称之为一个 `package\
  \ group`（包组），它由具有相似物理依赖关系^(2)的包组成，作为一个整体，它们适用于独立发布，正如图 2-2b 所示。\n\n^(2) 注意，虽然组内的包本身在内部逻辑上必然是内聚的，但整个包组整体并不一定如此（分别参见第\
  \ 2.8 节和第 2.9 节）。\n\n![](img/fig2-2a.jpg) ![](img/fig2-2b.jpg)\n\n**图 2-2：单个组件无法扩展。**\n\
  \n此外，我们可能需要的某些软件组织方式可能完全不同。例如，我们可能想要利用某些第三方和开源库，这些库可能不是基于组件的。我们可能有自己的旧库需要使用，它们同样不是基于组件的。这些软件库必须在比组件更大的聚合级别结合，正如图\
  \ 2-3 所示。\n\n![](img/fig2-3.jpg)\n\n**图 2-3：与非组件化（库）软件的集成**\n\n我们通常将大型系统中的顶层集成单元非正式地称为“库”（library），其接口通常由单个目录（例如\
  \ `/usr/include`）中的一组头文件以及取决于目标平台的单个库存档（例如 `libc.a`、`libc.so`）组成。我们可能会独特地将这个特定的\
  \ `architectural`（架构）实体整体称为“C 库”，尽管其内部结构（即逻辑内容如何在其 `.o` 文件之间划分）完全是 `organizational`（组织性的，即不是其规范或`contract`的一部分；参见第二卷第\
  \ 5.2 节），并且随不同供应商平台而异。\n\n与旧、开源和第三方库的集成是重要的，并将予以解决。然而，我们在接下来的几节中的目的是首先识别库软件的理想特性，然后为我们自己的库打包提供一种规范性方法论。之后，我们将回到与非组件化软件集成的问题（参见第\
  \ 2.12 节），专注于围绕 `main()` 的自定义（不可共享的）顶层应用代码（参见第 2.13 节）。\n\n## 2.2 物理聚合\n\n在前面的章节中，我们讨论了物理设计的原子单元，我们称之为组件（component），以及由它们的（无环）物理依赖创建的物理层次结构。可扩展性要求层次结构，而物理依赖强加的层次结构虽然至关重要，但只是大规模物理设计的一个架构方面。此外，我们必须考虑如何将相关的组件封装成更大的内聚物理单元。我们将基于组件的设计的这种另一个层次化维度称为\
  \ `physical aggregation`（物理聚合）。\n\n### 2.2.1 物理聚合的通用定义\n\n**定义：**\n\n**`aggregate`（聚合体）是一个包含逻辑内容的内聚物理设计单元。**\n\
  \n聚合的目的是将逻辑内容（C++ 源代码的形式）聚集为一个内聚的物理实体，在架构上可以被视为一个原子单元。在物理聚合谱的一端是组件。每个单独的组件都聚合逻辑内容。图\
  \ 2-4 性地展示了由 15 个组件组成的集合，它们具有 5 个不同的物理依赖级，共同代表了一个层次可重用的子系统。\n\n![](img/fig2-4.jpg)\n\
  \n**图 2-4：在 15 个单个组件内聚合的逻辑内容**\n\n### 2.2.2 物理聚合谱的短端\n\n**定义：**\n\n**`component`（组件）是物理聚合的最内层级。**\n\
  \n根据设计，每个组件都体现了有限的代码——通常只有几百到一千行源码^(3)（排除注释和组件相关的测试驱动程序）。因此，单个组件的粒度太细（第 0.4 节），无法完全表示大多数非平凡的架构子系统和\
  \ `patterns`（模式）。^(4) 例如，给定一个用于例如（抽象）内存分配器的协议（第 1.7.5 节）（参见第二卷第 4.10 节），我们可能希望提供几种针对不同行为需求^(5)的实现。作为一个整体，这些组件自然代表了一个更大的内聚实体，正如图\
  \ 2-5 所示。为了捕捉这些逻辑相关组件之间的内聚关系——假设它们没有实质性的物理依赖——我们可能会选择将它们放置在一个更大的物理单元中（参见第 2.8 节、第\
  \ 2.9 节以及第 3.3 节）。通过这样做，我们可以促进库软件的发现和管理。\n\n^(3) 注意，实现的复杂性加上测试给定组件的能力——比行数更能决定其际的最大“尺寸”（参见第三卷\
  \ 7.3 和 7.5）。\n\n^(4) 参见 **gamma94**。\n\n^(5) 例如，`bdlma::MultipoolAllocator`、`bdlma::SequentialAllocator`\
  \ 和 `bdlma::BufferedSequentialAllocator`（参见 **bde14**，目录 `/groups/bdl/bdlma/`）。\n\
  \n![](img/fig2-5.jpg)\n\n**图 2-5：逻辑相似但独立的组件套**\n\n### 2.2.3 物理聚合谱的长端\n\n**定义：**\n\
  \n**`unit of release`（UOR，发布单元）是物理聚合的最外层级。**\n\n在物理聚合谱的另一端是发布单元（UOR），它代表了一个物理上（通常也是逻辑上）内聚的软件集合，设计为全或的方式进行部署和消费。每个\
  \ UOR 通常包含多个较小的物理聚合，聚集的源代码远多于单个组件。尽管如此，我们预计库软件最终会增长到无法属于任何一个 UOR。因此，从企业级规划的角度来看，我们必须准备好可能在库源码清单顶层出现的许多\
  \ UOR。\n\n### 2.2.4 聚合体的概念原子性\n\n**准则：**\n\n**每个物理聚合体在设计目的上都应该被视为原子的。**\n\n\n\n\n\
  尽管一个 UOR（单元组织单元）可能聚合了在物理上相互独立的实体，但从设计角度考虑，它始终应该被视为**原子的**。与组件（以及每个物理聚合体）一样，UOR 内容合并到依赖程序中的粒度将取决于组织结构、特定平台细节以及部署细节，而这些细节在设计时都是不可信的。因此，我们必须假设对\
  \ UOR 的任何使用都极可能导致其全部——以及它所依赖的所有内容——都被合并到我们最终的可执行程序中。单此这一点，我们如何选择将软件聚合为不同的 UOR 就至关重要。\n\
  \n库在组织上可能不是原子的这一断言对于传统的静态库（`.a`）（见第 1.2.4 节）是正确的，但对于共享库（`.so`）来说通常并不成立。即使对于静态库，监管要求（例如针对交易应用程序）也可能在将应用程序与时间戳发生变化的静态库重新链接时，强制对其进行大量的重测试，即使唯一的区别只是多了一个未使用的组件。在这种情况下，我们可能会——仅出于优化目的——选择在部署期间的后处理步骤中将库划分为多个区域（例如，多个\
  \ `.so` 或 `.a` 库）（见[第 2.15.10 节]）。同样，这种组织上的优化完全影响 UOR 的架构、使用或允许的依赖关系（见[第 2.2.14\
  \ 节]）。\n\n## 2.2.5 聚合体的通用依赖定义\n\n**定义：**\n\n**如果 `x` 中的任何文件都是为了编译、链接或彻底测试 `y` 所必需，则聚合体\
  \ `y` 依赖于另一个聚合体 `x`。**\n\n这种针对聚合体的物理依赖定义刻意地扩大了范围，以便它可以适用于并不一定遵循我们方法论的聚合。对于完全由[第\
  \ 1 章]中四个属性定义的组件组成的聚合，`y` 对 `x` 的直接依赖定义简化为 `y` 中的任何文件是否包含了来自 `x` 的头文件。\n\n组件属性 1–3（[第\
  \ 1.6.1 节]–[1.6.3 节]）以及组件属性 4（[第 1.11.1 节]）。\n\n### 观察\n\n**聚合体之间的依赖关系具有传递性。**\n\
  \n考虑到物理聚合体在设计上必须被视为原子的，如果聚合体 `z` 依赖于 `y`（直接或间接），而 `y` 又依赖于 `x`，那么我们至少从架构角度必须假设`z`\
  \ 依赖于 `x`。\n\n## 2.2.6 架构意义\n\n**定义：**\n\n**如果一个逻辑或物理实体的名称（或符号）刻意地从其定义的 UOR 外部可见，则该实体具有架构意义的。**\n\
  \n具有架构意义的实体是 UOR 中那些旨在让外部客户端直接看到（并可能使用）的部分。这些实体共同有效地构成了 UOR 的公共接口，对其任何更改都可能对其客户端的稳定性产生不利影响。架构意义的定义强调**刻意的意图**，而非仅仅是实际的物理表现，因为正是这种意图必然反映在架构中。\n\
  \n一个次优的实现可能会无意中暴露一个符号（在 `.o` 级别），该符号从未被意图在 UOR 外部使用。如果这种无意的可见性发生在完全由组件组成的 UOR 中，很可能是由于无意中违反了组件属性\
  \ 2（[第 1.6.2 节]），而不是刻意（且错误的）试图提供一个秘密的“后门”访问点。修复此类缺陷不构成架构的更改——尤其在这种情况下，因为对此类符号的任何使用本身就是对组件属性\
  \ 4（[第 1.11.1 节]的违反。\n\n## 2.2.7 通用 UOR 的架构意义\n\n在我们基于组件的方法论中，我们在实现 `main()` 的文件之外编写的所有软件都是以组件的形式实现的。遗憾的是，我们所有可能想要或需要（或被迫）使用的\
  \ UOR 并不一定都是基于组件的（以我们本应设计它们的方式）。我们将开始考虑通用 UOR 中那些无论其是否完全由组件组成都具有架构意义的部分。稍后，我们将讨论那些幸运好由组件构成的部分的具体细节。\n\
  \n## 2.2.8 具有架构意义的 UOR 部分\n\n简而言之，每个外部可的 `.h` 文件、这些 `.h` 文件中声明的每个非私有逻辑结构以及 UOR 本身都是具有架构意义的。为了从定义它们的\
  \ UOR 外部使用逻辑实体，需要它们的（带包限定的）名称（见[第 2.4.6 节]）。此外，声明这些实体的 `.h` 文件必须（或至少应该）通过名称直接包含（见[第\
  \ 2.6 节]）（[第 1.11.1 节]），以便客户端对其实质性使用。最后，为了引用组成 UOR 对应的 `.o` 文件的特定库（例如为了链接），将再次通过名称标识它。\n\
  \n某些方法论允许使用“私有”头文件（例如，见图 1-30][第 1.4 节]），这些文件不会随 UOR 一起部署；我们基于组件的方法（[第 1.6 节]和[1.11\
  \ 节]）不会（出于充分考虑；见[第 3.9.7 节]），但提供了从属组件（见[第 2.7 节]）。\n\n## 2.2.9 UOR 的哪些部分不具有架构意义？\n\
  \n虽然 `.h` 文件天然具有架构意义，但 `.cpp` 文件及其对应的 `.o` 文件不是。如果我们更改了头文件的名称或重新分配其中的逻辑结构，将会对其客户端的稳定性产生不利影响；但对于\
  \ `.cpp` 或 `.o` 文件并非如此。假设 UOR 通过其名称整体标识，构成该 UOR 的 `.o` 文件（对应其 `.cpp` 文件）的库存档的内部组织对客户端代码完全没有影响。此外，更改此类隔离的细节（见[第\
  \ 3.11.1 节]）甚至不需要客户端代码重新编译。\n\n## 2.2.10 组件“自然地”具有架构意义\n\n对于由[第 1 章]中定义的组件的 `.h/.cpp`\
  \ 对组成的 UOR，`.h` 和 `.cpp` 文件将分别以组件名称作为前缀（见[第 2.4.6 节]），使得组件也具有架构意义。为了最大化层次化重用（见[第\
  \ 0.4 节]），UOR 中的所有组件以及这些组件内部定义的所有非私有构造通常具有具有架构意义。然而，出于合理的工程原因，有时需要抑制组件的架构意义。[第 2.7\
  \ 节] 描述了我们如何——通过传统的命名——有效地限制 (1) 定义组件外部的非私有逻辑实体的可见性，以及 (2) 组件整体的可见性。\n\n\n\n\n###\
  \ 2.2.11 组件真的必须是一个 `.h`/`.cpp` 对吗？\n\n从架构上定义一个组件的完全取决于其 `.h` 文件。在第 1 章中，我们把组件定义为满足四个基本属性的\
  \ `.h / .cpp` 组合。在几乎所有情况下，这种表述都是 C++ 组件的*唯一*定义。^(9) 然而，为了完整起见，我们指出尽管这个定义是足够且在实践上有用的，但它并不是严格必要的。C++\
  \ 组件真正的本质要求是恰好有一个 `.h` 文件和一个^(10)（至少）或多个（见下文）`.cpp` 文件，它们共同满足了这四个基本属性。\n\n^(9) 更通用地说，对于任何支持多个编译单元的给定语言（例如\
  \ C, C++, Java, Perl, Ada, Pascal, FORTRAN, COBOL），组件的物理形式是标准的，且与其内容无关。\n\n^(10)\
  \ 我们要求组件头文件必须包含在至少一个组件 `.cpp` 文件中，以便我们仅通过编译组件就能观察到其 `.h` 文件在编译方面是自给自足的(节 1.6.1）。\n\
  \n### 2.2.12 何时（如果存在）`.h`/`.cpp` 对不够？\n\n在极少数情况下，^(11) 可能有充分理由使用多个 `.cpp` 文件来表示单个组件。与头文件不同，组件中的\
  \ `.cpp` 文件，特别是静态链接库 (`.a`) 中生成的 `.o` 文件，不被认为在架构上具有重要性。例如，定义了三个逻辑相关但在物理上独立的函数的组件\
  \ `myutil` 可能合理地实现为具有单个头文件 `myutil.h` 和多个实现文件——例如 `myutil.1.cpp`、`myutil.2.cpp`\
  \ 和 `myutil.3.cpp`——每个文件命名唯一，但都以组件名称作为公共前缀。因此，一个仅调用这三个函数之一的程序在某些部署策略下（见节 2.15））*可能*只包含与所需函数对应的单个\
  \ `.o` 文件。此类细微的考量与典型开发无关，大多数情况下被归于嵌入式系统的子领域。\n\n^(11) 例如，为了进一步减小已经很小的程序（如嵌入式 C）的，或者将大到无法救药的（特别是计算机生成的）组件拆分为编译器可以处理的大小的独立编译单元。\n\
  \n### 2.2.13 分割 `.cpp` 文件仅是组织层面的更改\n\n必须意识到的是，上述讨论的激进物理划分之所以被允许，是因为它属于组织层面，而非架构层面的。也就是说，我们对组件的视图和使用、其逻辑设计以及物理依赖不受此类架构上无关紧道的优化的影响。引入（或移除）此类优化对面向客户端的接口（包括任何重新编译的需求）或逻辑行为没有影响，仅影响程序大小。相比之下，为单个组件引入多个\
  \ `.h` 文件将代表一种显式影响使用的架构更改；因此，组件——在任何情况下——*必须*恰好有一个头文件，其根名称唯一地标识该组件（见节 2.2.23）。\n\
  \n### 2.2.14 实体清单与允许的依赖\n\n**定义：**\n\n*清单*（manifest）是物理实体集合的规范——通常用外部元数据表示（见节 2.16）——旨在成为其所属物理聚合体的一部分。\n\
  \n**定义：**\n\n*允许的依赖*（allowed dependency）是一种物理依赖——通常用外部元数据表示（见节 2.16）——被允许存在其所属的物理层级中。\n\
  \n**观察**\n\n每个物理聚合体的定义必须包含对 (1) 它所聚合的实体的规范，以及 (2) 它*允许**直接*依赖的外部实体的规范。\n\n为了具有实用价值，每个聚合体（从组件到\
  \ UOR）至少必须以某种方式允许我们契约地指定它所聚合的实体，以及那些包含的实体*允许*（即显式许可）直接依赖的其他物理实体。我们的设计方法论很大程度上基于理解软件内部在逻辑和物理上内聚的（见节\
  \ 2.3）的离散实体之间的物理依赖。给定一个依赖图，在不知道其节点处具体的（外部可见的）实体或其（允许的）边（edges）的情况下，根本没有好的方法可以对其进行推理。\n\
  \n对于任何给定的组件，如图 2-6a 所示，聚合实体的清单由其头文件中声明的可访问实体所暗示。*允许的*直接依赖由嵌入在该组件头文件中的组合 `#include`\
  \ 指令所暗示(节 1.11）。对于第二层及后续的物理聚合，成员聚合体的清单和*允许的依赖列表是架构规范的重要部分，且必须以某种方式明确表示(图 2-6)。\n\
  \n![fig2-6.jpg]\n\n图 2-6：聚合体的成员和允许的依赖\n\n遗憾的是，C++ 语言本身不支持单一编译单元之外的架构概念^(12)因此，我们在本章中讨论的聚合结构将配合语言使用元数据来实现（见节\
  \ 2.16）。这些元数据将作为每个聚合体本地的一部分保存在，以帮助我们开发、构建和部署软件的工具^(13)一个由四个第二层聚合体组成、形成三个独立（聚合）依赖级的抽象子系统在图\
  \ 2-7](#ch02.xhtml_ch02fig7)中示意所示。\n\n![fig2-7.jpg]\n\n图 2-7：由第二层物理聚合体构建的示意子系统\n\
  \n\n\n\n\n显式表示组件聚合的`allowed`依赖范围起初似乎是冗余且不必要的。正如第 1.11 节所示，目前有许多依赖分析工具可以用于从聚合组件中提取实际依赖，并自动生成这些依赖跨越物理聚合的范围，但这样做偏离了重点：声明`allowed`依赖的目的是前瞻性的，而不是响应性的。通过对一组建议的聚合进行描述，并提供这些聚合之间`allowed`依赖的范围，使我们能够在编写任何代码`之前`表达我们的物理设计（意图）。随着新功能的添加，可以检测到意外的物理依赖并将其标记为实现错误。如果不预先地指定`allowed`依赖，就没有物理设计可供实现，更不用验证了。因此，在物理聚合的每一个层级，显式地指定并验证`allowed`依赖都是必要的。\n\
  \n### 2.2.16 物理层级中平衡的需求\n\n**观察**\n\n**为了使人类认知最大化，物理聚合内的同级实体应该具有相当的物理复杂度（例如，具有相同的物理聚合层级）。**\n\
  \n在组件和 UOR（单元组织）之间，我们可能会想象（理论上）存在任何数量的中间物理聚合层级，每个层级都可能或不具有架构意义。某些物理聚合层级优于其他。特别是，不平衡的层级（如图\
  \ 2-8 中示意图所示）是次优的。\n\n![](img/fig2-8.jpg)\n\n**图 2-8：UOR 具有不平衡的物理聚合层级（坏主意）**\n\n\
  ### 2.2.17 不仅仅是层级，还有平衡\n\n大型系统的有效分解不仅需要层级，还需要平衡。我们选择相应的方式来建模软件开发。虽然不是严格必要的，但我们希望每个聚合包含具有相似物理复杂度的实体。特别是，我们刻意避免将组件与\
  \ UOR 内部更大的聚合并列放置。我们发现，在每个聚合深度具有相当复杂度的实体可以提高理解性并促进重用。\n\n在物理聚合的每一个增加的层级上，我们力求将大量但并非令人\
  \ overwhelming 的信息和工程内容汇聚在统一的抽象层级，以便能够被有效地理解和使用。按照原则，我们希望相关的示意细节对应于可能合理放在单张 8 1/2\
  \ × 11 英寸纸上的内容^(14)，正如图 2-9 中每个单独图表的复杂度所建议的那样。通过实现这种平衡——就像书中的章节和节一样——我们提供了分块均匀的内容，这使其更便于分析和讨论。\n\
  \n^(14) 作为一个美国人，我选择了美国最常见的活页纸尺寸，而不是符合其他国家 ISO 216 标准的尺寸（在其他国家，A4 是最常见且类似的尺寸，见 [`www.papersizes.org/`](http://www.papersizes.org/)\
  \ ）。\n\n![](img/fig2-9a.jpg) ![](img/fig2-9c.jpg)\n\n**图 2-9：平衡每个物理聚合层级上的复杂度**\n\
  \n### 2.2.18 物理聚合层级超过三层就太多了\n\n**观察**\n\n**超过三层适当平衡的物理聚合几乎总是不必要的，并且可能会产生问题。**\n\n\
  虽然组件（由于刻意的细粒度设计）太小，无法单独单独发布或部署，但拥有超过三个适当平衡的物理聚合层级（如图 2-10 示意图所示）并没有特别有用，而且由于涉及的代码规模巨大，可能会不实际。对于我们能合理放入单个物理库的内容，以及典型的开发和构建工具能容纳的内容，都是有限制的。还有一些设计和部署问题倾向于阻止人们在物理上聚合此类巨大的架构实体。\n\
  \n![](img/fig2-10.jpg)\n\n**图 2-10：超过三层的物理聚合层级（坏主意）**\n\n### 2.2.19 即使对于较大的系统，三层也足够了\n\
  \n根据我们的经验，我们发现三个适当平衡且具有架构意义的物理聚合层级足以表示非常大的库。当存在三个具有架构意义的层级时，我们将始终将 UOR 内第二层架构意义聚合中的每个实体称为`package`^(15)（见第\
  \ 2.8 节），并将 UOR 本身称为`package group`（见第 2.9 节）。\n\n^(15) 注意，UOR 也可以是一个孤立的包，但应该有一个强力的工程理由来倾向于这样做而不是包组，特别是对于（分层可重用的）库软件。\n\
  \n例如，即使仅使用图 2-11 所示的组件、包和包组的保守规模估算，每个 UOR 平均也将支持几十万行非注释源代码——当然，不包括相应的组件级测试驱动程序（见卷\
  \ III，第 7.5 节）。因此，一个由 1000 万行代码组成的企业级库软件可以轻松地放入五十个这样的 UOR 中，而更大的代码库则只需要更多。\n\n![](img/fig2-11.jpg)\n\
  \n**图 2-11：组件、包和包组的保守规模估算。**\n\n### 2.2.20 UOR 始终有两个或三层聚合\n\n因此，在我们的方法中，库软件中适当平衡且具有架构意义的物理聚合层级始终至少为二（即单个组件和组成它们的\
  \ UOR），但绝不超过三层。\n\n在少数情况下，可能会有充分的——例如为了容纳大型、单体的、外部设计的接口^(16)——为了纯粹的组织目的引入一个额外的、中间物理聚合层级。任何对架构意义聚合实现的这种基于组织的划分——就像组件的实现一样——当然永远不应该具有架构意义（见第\
  \ 2.11 节）。\n\n^(16) C++ 标准库完全位于 `std` 命名空间中，本身就是这种单体规范示例。\n\n### 2.2.21 三层平衡聚合就足够了。相信我！\n\
  \n这里建议的物理聚合的“人为”限制并没有以任何方式阻止单个开发人员发挥创造力；相反，这种规则的物理聚合模型有助于将创造力集中在最有效的地方——功能本身，而不是包装——从而使我们的软件开发者整体更成功。事实证明，具有规则、平衡且相当浅的架构结构也有于使用经济的符号来识别我们专有库软件中的每一个具有架构意义的逻辑和物理实体（见第\
  \ 2.4 节）。\n\n### 2.2.22 不应该存在比 UOR 更大的架构意义实体\n\n\n\n\n\n我们刻意避免创建任何在架构上比单个（物理）UOR（用户组织）更具意义的实体。^(17)\
  \ 将此类庞大的*逻辑*单元作为原子进行处理（如图 2-12a 所示），将会增加我们允许的依赖范围，而无法在一个内聚的物理实体内对逻辑功能提供任何具体的封装（参见节\
  \ 2.3）。相反，我们选择更清晰地对建模这种粗粒度的架构策略，将其视为 UOR 之间单个*允许*的物理依赖（图 2-12b）。我们越能将每个逻辑子系统封装在单一（具有架构意义的）物理聚合中，就越能从跨实体的逻辑关系中推断出有用的物理依赖（节\
  \ 1.9）。\n\n^(17) 拥有一个单一的企业级命名空间来守护我们共同编写的*所有*组件中的名称，(1) 独立于特定设计的任何方面，且 (2) 是一个好主意（参见节\
  \ 2.4.6）。\n\n![](img/fig2-12.jpg)\n\n**图 2-12：用允许的物理依赖取代逻辑聚合**\n\n#### 2.2.23 具有架构意义的名称必须是唯一的\n\
  \n**设计规则**\n\n**每个具有架构意义的实体的名称在整个企业范围内必须是唯一的。**\n\nC++ 语言要求在定义它的编译单元外部可见的每个逻辑实体的名称在程序中必须是唯一的（节\
  \ 1.3.1）。我们需要更多的要求。我们要求库中所有外部可访问的逻辑实体的名称能够唯一地标识每个实体，因为由于复用，这些逻辑实体的组合在某一天可能会出现在同一个程序中（参见节\
  \ 3.9.4）。出于同样的原因，所有 UOR（包组和包）的名称——每个对外部客户端可见——也必须全局唯一。\n\n即使没有我们的内聚命名策略（参见节 2.4），要确保组件文件名本身在整个企业范围内是全局唯一的仍然具有显著的优势（例如，参见节\
  \ 2.4.6 和 2.15.2），无论目录结构如何。^(18)\n\n^(18) 2019 年 4 月 1 日，Mike Verschell 成为 Bloomberg\
  \ BDE 团队的经理，在应用了书中描述的方法开发真实世界大规模 C++ 软件近十八年丰硕收获后，接替了其创始人（John Lakos）。Mike 通过个人电子邮件提供了他关于唯一文件名立场的总结。\n\
  \n唯一文件名的用处是唯一性。当人们在系统的任何地方看到文件名（如 `xyza_context.h`）时——无论是在日志消息、断言、电子邮件还是文本编辑器的标签页中——都能唯一地知道它所指的组件。唯一文件名还使得源代码中\
  \ `include` 指令的渲染与头文件在文件系统上的物理位置正交。缺乏唯一文件名不会破坏任何特定事项，但会使大量任务变得更加困难，因为文件名本身不再是唯一的标识符。在一个拥有数十万个组件的大型组织中（其中不可避免会有许多*基名*为“context”的组件），保持文件名作为唯一标识符过去是、将来也确实是一个非常有价值的属性！\n\
  \n— Mike Verschell\n\n#### 2.2.24 不允许循环物理依赖！\n\n**设计强制**\n\n**物理聚合之间允许的（显式声明的）依赖必须是无环的。**\n\
  \n任何物理实体之间（无论聚合级别如何）的循环物理依赖^(19)都是不可扩展的并且总是不可希望的。事实上，为了帮助人类认知，我们几乎总是组织源代码结构，以即使在同一个组件内部也避免前向引用。每当设计的物理规范允许循环依赖时，我们都会断言该设计存在不可接受的缺陷。即使由于某些异常的（组织性）原因，我们选择将一个外部可见的聚合划分为*不具*架构意义的子聚合（例如，参见节\
  \ 2.11），我们仍然坚持这些子聚合之间的允许的依赖也必须是无环的（另见图 2-89、节 2.15.10）。\n\n^(19) 如果表示任意实体之间直接依赖关系的二值矩阵传递闭包不是反对的，则一组相互依赖（连接）的实体就是循环依赖的。\n\
  \n#### 2.2.25 本节总结\n\n总而言，物理聚合是逻辑内容的物理内聚单元，也是任何开发过程中的必要抽象。物理聚合的组织细节可能会随平台、编译器/链接技术以及部署策略的变化而变化；因此，每个物理聚合在至少在架构上被视为原子的。因此，我们的逻辑设计也必须始终受聚合所指定的架构*允许*（而非实际）物理依赖范围的限制。在每个连续聚合层上平衡复杂度有助于人类认知和潜在的复用。事实证明，使用三个平衡的具有架构意义的物理聚合对于描述最大的系统也是足够的的（实际上是最优的）。然而，我们希望避免跨越\
  \ UOR 的架构意义的逻辑实体（企业级命名空间除外）。\n\n### 2.3 逻辑/物理一致性\n\n在开发大规模软件时，确保我们的逻辑设计和物理设计在每个封装层上以相当特定的方式一致是至关重要的。良好的软件包最基本的属性可能是：在物理模块或聚合的集合接口中发布的所有逻辑构造——例如组件、包、UOR（参见节\
  \ 2.2）——直接在该模块内实现。不具有此属性的软件通常无法用图来描述，其中节点表示内聚的逻辑内容，有向边表示对其他物理模块的（无环）依赖。我们将这种不理想的软件称为*逻辑和物理不一致的*。\n\
  \n\n\n\n\n例如，组件属性 3 (节 1.6.3) 规定，如果具有外部绑定的逻辑结构在组件的头文件中声明，那么该组件是唯一允许定义该结构的组件。回想 节\
  \ 1.9 内容，只要知道具有组件属性 3 的独立组件所包含的类之间的逻辑关系，我们就可以可靠地推断出这些组件之间的物理依赖。那些没有完全封装其逻辑结构定义的任意\
  \ `.h` / `.cpp` 对，会不必要地增加对设计（以及组织）依赖进行推理的复杂性（例如，在 图 1-46 中对 `Date` 类输出运算符的错误定义，以及\
  \ 节 1.6.3）。因此，我们要求组件作为其自身公布的任何逻辑结构都必须完全定义在该组件内部，而绝不能在其他地方定义。\n\n## 指南\n\n**架构上内聚的逻辑实体应该紧密封装在物理实体内部。**\n\
  \n我们从单个组件中获得的逻辑/物理一致性的相同收益，也适用于更高聚合层的库软件。例如，假设我们有两个相当大的逻辑子系统，分别命名为 `buyside` 和 `sellside`。每个子系统都由几个类组成。为了便于讨论，让我们假设每个类都定义在各自独立的组件中，且未解耦组件的依赖图是无环的。图\
  \ 2-13 显示了当仅从逻辑角度构思的子系统具体化时通常会发生什么。虽然这些系统的逻辑方面和物理方面是一致的，但聚合设计的循环物理本质是不可扩展的，因此是不可接受的\
  \ (节 2.2.24)）。\n\n![](img/fig2-13.jpg)\n\n**图 2-13：循环物理依赖（坏主意）**\n\n避免跨越聚合边界的循环物理依赖不仅有利于构建工具，也有利于人类的认知和推理。如果只需要两个库，且跨聚合的组件依赖包是无环的，那么只需要像\
  \ 图 2-14 所示机械地重新划分这些组件就足够了。但为了让软件包装便于人类认知，设计在物理上无环之外，其逻辑方面和物理方面必须保持*一致性*。\n\n![](img/fig2-14.jpg)\n\
  \n**图 2-14：逻辑/物理不一致（坏主意）**\n\n尽管两个库之间的循环物理依赖已被消除，但逻辑设计和物理设计已经背离。现在，没有任何一个逻辑子系统被任何一个物理库封装。结果，我们从抽象逻辑使用推断聚合物理依赖（即在子系统级别）的能力丢失了。也就是说，如果客户端抽象地使用\
  \ `buyside` 或 `sellside` 逻辑子系统，我们必须么知道该使用的细节，要么要假设对这两个库都存在隐含的物理依赖。与循环物理依赖一样，我们对逻辑和物理不一致设计进行推理的能力也是不可扩展的；因此，应该避免此类设计。\n\
  \n统一软件的逻辑属性和物理属性是实现大规模系统高效开发的关键。实现逻辑子系统的有效模块化并不总是容易的，可能需要对子系统的逻辑设计进行重大调整（参见 第 3\
  \ 章）。如 图 2-15 所示，重后的设计可能会产生不同的逻辑模型。在开发周期早期实现具有逻辑/物理一致性和无环物理依赖的设计需要远见，但比在编码开始后尝试调整设计要容易得多。然而，一旦发布给客户，重构子系统的艰巨任务不可避免地在质上变得更加棘手，往往是无法逾越的。\n\
  \n![](img/fig2-15.jpg)\n\n**图 2-15：无环逻辑/物理一致性（好主意）**\n\n在整个代码库中实现逻辑与物理一致性以及无环物理依赖是绝对必要的。然而，除了确保这些重要属性外，我们还需要一种策略，确保每个具有架构意义的逻辑物理实体的名称在整个企业是唯一的，而且只需通过使用点就可以识别（并找到其定义），而无需求助于工具（例如\
  \ IDE）。下一节将讨论我们如何在实践中实现这些额外目标。\n\n### 2.4 逻辑与物理名称一致性\n\n直接从使用点识别几乎每个逻辑结构定义的物理位置的能力，是设计中的一个重要方面，它将我们的方法与软件行业使用的其他方法区分开来。然而，这种设计方面的实际优势有很多，将在本节中进行探讨。\n\
  \n#### 2.4.1 命名空间污染的历史\n\n全局命名空间污染——特别是局部结构夺用短常用——是一个老问题了。我们都学过，在文件作用范围内（即使在 `.cpp`\
  \ 文件中）将类命名为 `Link` 或将函数命名为 `max` 都是自找麻烦。如果不管理，命名冲突的概率随着程序规模呈组合级增长。开发者传统上通过对逻辑结构采用临时命名约定来解决这个问题，基于那些*希望*唯一的的前缀（例如，`ls_Link`、`myMax`、`size_t`）。当逻辑结构的使用受限于单个\
  \ `.cpp` 文件时，我们总是可以将函数设为 `static`，并将局部类嵌套在匿名命名空间中。然而，命名冲突的问题也延伸到了头文件。\n\n#### 2.4.2\
  \ 唯一命名是强制的；一致性命名对人类有利\n\n回想 节 2.2.6，如果一个逻辑或物理实体的名称（或符号）从定义它的 UOR 外部可见，那么它就是*架构意义的*。为了无歧义地引用每个架构意义的实体，我们要求每个实体的名称在全局是唯一的。我们如何实现这种唯一性在某种程度上是一个实现细节——至少从编译器的角度来看是如此。当涉及到人类时，正如我们在本节中阐述的，一致性命名证明提供了强大的认知强化。\n\
  \n假设我们想要实现一个架构意义的类型，例如表示*价格*的类型——用于金融工具。我们应该如何确保该类型的名称是全局唯一的？理论上，有很多方法可以实现唯一命名。例如，我们可以维护一个逻辑名称注册表。第一个选择\
  \ `Price` 的开发者拥有它！下一个实现类似概念（描述价格的方式有很多）的开发者将被迫选择其他（例如，`MyPrice`、`Price23`）。同样的方法也可以用于预留唯一文件名。\n\
  \n#### 2.4.3 既不一致也不具记忆点的命名的荒谬极端\n\n\n\n\n\n将这种方法推向极端，我们甚至可以让注册表根据全局计数器生成唯一的类型名称——例如\
  \ `T125061`、`T125062`、`T125063`等。我们也可以对组件名称（例如 `c05684`、`c05685`、`c05686`）甚至于发布单元（例如\
  \ `u1401`、`u1135`、`u1564`）执行类似的操作，如图 2-16 所示。对于编译器和链接器来说，这一切运行良好良好。此外，在物理上将组件从一个聚合体移动到另一个聚合体在命名上没有任何影响。然而，人类认知并受益于这种方法。\n\
  \n![](img/fig2-16.jpg)\n\n**图 2-16：荒谬的不透明、缺乏内聚性的生成的唯一名称（坏主意）**\n\n维护一个中央数据库来保留单个类或组件名称是不现实的，显然也不是最佳答案。相反，我们将利用层次级结构来一次分配多个级别的命名空间。然而，这种层次级结构既不是随意的也不是任意的；除了一个覆盖全企业的顶级命名空间（见下文）外，我们在方法论中使用的每个命名空间将对应一个连贯的、*架构意义的*的、在逻辑和物理上内聚的聚合体。\n\
  \n### 2.4.4 增强内聚性的要素\n\n对于每一个具有架构意义的逻辑实体至少都有三个相关的架构名称：\n\n1. 逻辑实体本身的名称（或符号）\n2.\
  \ 声明逻辑实体的组件（或头文件）的名称\n3. 实现逻辑实体的 UOR（用户单元）的名称\n\n确保这些名称具有刻意的内聚性将对开发和维护产生重大影响。因此，我们如何以及在哪些物理级别上实现命名内聚，是我们方法论中一个独特且非常重要的设计考量。\n\
  \n### 2.4.5 包的过去/当前定义\n\n**定义：**\n\n**`package` 是比组件大的具有架构意义的最小物理聚合体。**\n\n**推论：**\n\
  \n**每个包的名称在整个企业中必须是唯一的。**\n\n包（见节 2.8）是一个*架构意义的*——即全局可见的——逻辑和物理设计单元，用于聚合组件，并受显式说明的*允许依赖*标准的限制（节\
  \ 2.2.14）。包也是一种使相关组件在物理上以及正如我们即将看到的，在命名上保持内聚的手段。通过这些方式，包使设计人员能够在源代码中捕捉并反映仅通过组件无法表达的重要架构信息。\n\
  \n从历史上看，^(20) 包被定义为组织成（逻辑上和）物理内聚单元的组件集合（见节 2.8.1）。尽管我们自己编写的每个包都将必然完全通过组件来实现，但其他类型的包含多个头文件但未聚合组件的、合理的且具有架构意义的物理实体也是完全可能的.^(21)\n\
  \n^(20) **lakos96**，第 7.1 节，第 474–483 页\n\n根据上述定义，*package* 一词可以作为一个统一术语，描述任何比组件大且具有架构意义的代码体，但不一定是基于组件的。然而，我们将一致地将那些并非完全由遵循我们设计规则的组件组成的包——特别是那些我们在本节剩余部分阐述的关于内聚命名规范的规则（节\
  \ 2.4）——表述为*不规则的*（见节 2.12）。\n\n现在假设我们有一个名为*债券交易系统*（Bond Trading System）的逻辑子系统（在代码中简称为\
  \ `bts`）。进一步假设该逻辑子系统由若干类（包括一个价格类）组成，这些类已经通过组件实现，然后又聚合到一个包中，作为独立库（例如 `libbts.a`）原子化部署。我们应该如何区分\
  \ `bts` *债券*价格类与其他价格类，以及定义该价格类的组件的名称应该是什么？\n\n### 2.4.6 使用点应足以标识位置\n\n**指南：**\n\n\
  **在包-命名空间作用范围内声明的每个逻辑实体的*使用*情况本身就应足以指示该实体所属的组件、包和 UOR。**\n\n每当我们在代码中使用逻辑结构时，我们都希望立即知道它属于哪个组件、哪个包和\
  \ UOR。在没有显式政策采取相反的情况下，类的名称、声明该类的头文件以及实现该类的 UOR 可能都具有互不相关的名称，如图 2-17 所示。读取 `BondPrice`\
  \ 的客户端将无法仅从用法上预测是哪个头文件定义了它，或者是哪个库实现了它；因此，在对客户端代码的所有后续维护中，都需要全局搜索工具。\n\n^(21) Robert\
  \ Martin 是我们知道的另一位用 C++（在**lakos96** 之前或其他之后）描述极其相似概念的著名作者。在他对 Booch 的《类分类》（Class\
  \ Categories）的适配中（这些分类最初仅仅是逻辑实体（**booch94**，第 5.1 节，“要要素：类分类”，第 581–584 页）），Martin\
  \ 的类别将一组在逻辑和物理属性上都相关的类汇聚在一起。根据个人（电话）通信（约 2005 年），他增强后的类别本意比组件大得多，但又略小于典型的包（见图 2-11，节\
  \ 2.2.19），几乎始终每个头文件对应一个类（见节 3.1.1));见**martin95**，“使用分类进行高层封装”，第 226–231 页。\n\n\
  ![](img/fig2-17.jpg)\n\n**图 2-17：逻辑和物理命名缺乏内聚（坏主意）**\n\n同样，为了实现此逻辑子系统的其他组件可能具有互不相关的名称，从而掩盖该子系统的内聚物理模块化。虽然并非严格必要，但经验表明，源代码中的显式“视觉”关联有助于人类认知。这种命名内聚反过来加强了更重要的逻辑/物理一致性要求（节\
  \ 2.3）。因此，相关架构意义实体之间的逻辑和物理命名内聚是我们封装方法论的一个显式设计目标。\n\n**设计规则：**\n\n**组件文件 (.h /.cpp)\
  \ 必须与组件本身的根名称相同（即它们仅后缀不同）。**\n\n根据性质，作为 `.h /.cpp` 对实现的组件自然表现出某种程度的物理命名内聚。然而请注意，直到我写我的第一本书时（1996\
  \ 年），情况并非如此。由于当时库存档文件（`.a`）中包含的 `.o` 文件名称长度受到不合理的限制，`.o` 文件通常必须缩短；因此，需要维护一个外部引用以重新建立组件的内聚性.^(22)\n\
  \n^(22) **lakos96**，附录 C，第 779–813 页，特别是附录 C.1，第 180–193 页\n\n**推论：**\n\n**每个库组件文件名在整个企业中必须是唯一的。**\n\
  \n\n\n\n\n回想节 2.2.23，每个全局可见的物理实体本身必须具有唯一的名称。由于库组件头文件至少从它们各自发布单元外部清晰可见（参见节 3.9.7），且它们对应的\
  \ `.cpp` 文件源自相同的根名称，但彼此之间是独立的，因此它们也必须是全局唯一的。请注意，与库组件不同，位于应用程序包中的组件名称（参见节 2.13）只要其逻辑名称和物理名称与我们库中的名称不冲突，就不必与其他应用程序包中的名称保持区分，因为在我们的方法论中，同一个程序中不会出现两个这样的应用程序包。\n\
  \n### 设计规则\n**每个组件必须位于一个包（package）中。**\n\n组件旨在解决高度集中的目的，并为增强层次化重用（节 0.4）而定制，它们往往由于粒度过细而无法单独发布（节\
  \ 2.2.20）。因此，在我们的方法论中，每个组件都不可避免地嵌套在一个更高层次、具有架构意义的聚合体内，该整体（根据定义）就是一个 `package`。虽然物理统一性带来的益处——增强可理解性和便于自动化工具的使用——正如节\
  \ 0.7 中所概述的那样是极具吸引力的，但盲目遵守这一规则将远不能实现其所试图激励的潜在收益。此处的意图不仅是为了为软件提供统一且平衡的物理表示，还为了构建一个层次化的仓库，其中从逻辑和物理角度来看，包含的元素都是内聚且协同的（参见节\
  \ 2.8.3）。此外，我们希望确保我们编写的每个库组件在我们公司范围内仓库的物理层次结构中都有一个自然而显眼的位置（参见节 3.1.4 和 3.12）。\n\n\
  ### 设计规则\n**每个组件的（全小写）名称必须以所属包的（全小写）名称开头，后跟一个下划线（`_`）。**\n\n确保架构意义名称之间存在可见内聚性的第一步是确保组件名称反映其所在包的名称，如图\
  \ 2-18 所示。仅通过观察 `bts_cost` 组件的名称，我们就知道存在两个名为 `bts_cost.h` 和 `bts_cost.cpp` 的组件文件，它们位于\
  \ `bts` 包中。(23,24)\n\n^(23) 在我们的方法论中，包（参见节 2.8）要么被聚合为一个组（参见节 2.9），要么作为独立的包发布，这两类各有其独特（不重叠）的命名规范（参见节\
  \ 2.10）。属于组的包名称为四到六个字符，前三个字符对应包组的名称，包组作为发布单元（UOR）。典型的独立包名称通常为七个或更多字符，以确保它们与所有分组包的名称保持分离。在少数情况下，特别是对于非常广泛使用的（或标准的）库，我们可能会选择创建一个仅具有单个三字符前缀的包组大小的包，例如\
  \ `bts`（或 `std`）。虽然在大量组件中使用单一极短的命名空间名称有时可以提高广大客户群的生产力，但此类库与那些命名较粗的基于包组的库相比，通常在开发和维护上需要更多的技能和精力。使用（架构上无意义的）子包来支持此类名义上的单体库的讨论请参见节\
  \ 2.11。\n\n^(24) 这种命名法追溯到标准化之前，我们不得不使用逻辑包前缀来实现逻辑命名空间——例如，使用 `bget_Point` 而不是 `bget::Point`。即使在\
  \ C++98 标准引入了 `namespace` 结构后，我们继续利用这种方法来命名物理实体，有时甚至是命名逻辑实体——例如，在过程化接口中（参见节 3.11.7）。\n\
  \n![](img/fig2-18.jpg)\n\n**图 2-18：组件名称始终反映其所属的包。**\n\n我们认为物理实体（例如文件、包和库）的名称不包含任何大写字母（节\
  \ 1.7.1），基于以下观察：某些流行的文件系统（特别是 NTFS）不区分大小写。(25) 从理论上讲，只要所有文件名的小写渲染是唯一的就足够了。但在实践中，在物理打包中存在任何不必要的自由都会增加开发/部署工具的负担，更不用说人类理解了，这使得混合大小的文件是不优的。(26)\n\
  \n^(25) 出提高可读性（和/或名义内聚性）考虑，经常有人建议允许在组件文件名中使用大写字母，并要求它们与包含的主类或通用前缀完全匹配（参见节 2.6），而不是目前要求的小写名称。我们意识到，多单词文件名的可读性可能会受到影响（讽刺的是，这为保持组件名称简洁提供了欢迎的激励）。\n\
  \n^(26) 强制要求我们的组件文件名以`全小写`渲染也能有效防止在逻辑名称上利用大小进行“重载”，例如，在不同的组件中同时拥有 `DateTimeMap`\
  \ 和 `DatetimeMap`——从可读性角度来看，这可能也是我们想要避免的。想象一下在客户服务热线上尝试沟通这种区别吧！\n\n另外，或许重要的是，我们发现将类名（我们始终以混合大小写渲染，节\
  \ 1.7.1）与我们以全小写渲染的物理名称区分开来，在符号上是方便的，而且在视觉上强化了这两种不同设计维度之间的区别，例如在上方所示的组件/类图中（参见图 2-18）。这种视觉区分在源代码和外部文档（如本书）中提供的便利不应被低估。\n\
  \n\n\n\n\n虽然 `namespace` 结构可以并且确实可以在 `logical`（逻辑）名称方面有效使用，但它无法解决对应的物理名称——即组件文件名。这意味着，即使有了命名空间，使用诸如\
  \ `date.h` 这样简单名称的头文件仍然会产生问题。我们可以像许多人做的那样，强制客户端在源代码中嵌入指向适当头文件的部分（相对）路径（例如 `#include\
  \ <bts/date.h>`）；然而，确保文件名本身在整个企业范围内唯一性（例如 `#include <bts_date.h>`）在部署方面提供了更优越的灵活性^(27)。换句话说，通过在设计上使所有组件文件名本身唯一（不考虑相对目录路径），我们使得在部署期间的重新打包具有了更强的健壮性和灵活性（参见第\
  \ 2.15.2 节）。\n\n从软件供应商的角度来看，我们打包方法的一个早期显式要求是：能够从海量的仓库中选择一个组件或一组任意特定的组件，提取（它们的副本）以及这些组件所依赖的组件（直接或间接的），并将这些组件作为具有单一（“扁平化”）包含目录和单个存档的库提供给客户。如果我们允许开发目录结构污染了我们的源文件，我们将被迫在客户的系统上复制一个可能非常大且分布稀疏的目录结构。同样，非唯一的\
  \ `.cpp` 文件名将使得从多个包中将 `.o` 文件重新归档到单个库存档中变得绝不简单。\n\n^(27) 我们断言（参见第 2.10.2 节），这种方法即使对于最大的源代码库也是行的。例如，参见\
  \ `potvin16`。\n\n这种不必要的稀疏目录结构会因为第三层物理聚合而恶化。例如，在开发期间位于包级 `#include` 目录中的同一个头文件，可以与其他包的头文件共存（即在同一个组级\
  \ `#include` 目录中），这些头文件被分组在同一个 UOR（用户组织单元）中，这对于外部客户的使用可能更加方便（而且更高效^(28)）。在部署中拥有这种优越的灵活性——特别是对于库软件——胜于任何基于美学或“惯例”的论点。\n\
  \n^(28) `lakos96`，第 7.6.1 节（第 514–520 页），特别是图 7-21 和图 7-22（分别为第 519 和 520 页）\n\n\
  确保文件名全局唯一还有其他间接好处。文件名包含其唯一的包前缀也简化了包含保护符（include-guard）名称的预测。如图 1-40 所示，在第 1.5.2\
  \ 节中，保护符名称仅为前缀 `INCLUDED_` 后跟大写的根文件名（例如，对于 `bts_bondprice.h` 文件，保护符符号为 `INCLUDED_BTS_BONDPRICE`）。编译器经常利用实现文件名作为在程序中生成唯一符号的基础——例如，用于虚表或匿名命名空间中的构造体。在文件名中硬编码唯一的包前缀也意味着其全局唯一身份在创建它的目录结构之外得以保留——例如，在\
  \ `~/tmp` 中、作为邮件附件、或在打印机托盘上。在每个组件文件的第一行一致地重复文件名作为注释，正如我们所做的（参见第 2.5 节），进一步强化了它的身份。仅通过查看名称就能知道文件的上下文是一项宝贵的属性，人们很快就会习惯并依赖它。\n\
  \n### 设计规则\n**在组件内声明的每个逻辑实体必须嵌套在一个与该实体所在包同名的的命名空间内。**\n\n在 C++ 语言引入 `namespace`\
  \ 关键字之前（以及目前某些尚未提供命名空间的语言），可用的最佳解决方案是要求（在可能的情况下）文件作用域内的每个具有架构意义的实体名称都以唯一的前缀开头，尽管这在许多人看来并不美观。这不仅有效地避免了命名冲突，还实现了物理内聚，如图\
  \ 2-17 所示。我们对逻辑前缀（现已废弃）的使用如上所示仅供参考^(27)。\n\n^(27) `lakos96`，第 7.6.1 节（第 514–520\
  \ 页），特别是图 7-21 和图 7-22（分别为第 519 和 520 页）\n\n既然 `namespace` 结构早已被所有相关的 C++ 编译器支持，人们已经趋向于使用简洁的名称。因此，自\
  \ 2005 年以来，我们现在将每个逻辑实体嵌套在与包同名的命名空间中，如图 2-20 所示。我们对逻辑命名空间的使用与最初对包前缀的使用是同构的，因此与我们继续使用包前缀以保持逻辑和物理内聚的做法一致。\n\
  \n**图 19：传统的逻辑前缀（已废弃）**\n\n**图 20：现代的逻辑包与企业命名空间**\n\n#### 2.4.7 专有软件需要企业命名空间\n注意图\
  \ 2-20、第 2.4.6 节，我们现在建议一个一个性的企业命名空间，以便消除（尽管在实践中极少）与其他遵循我们（或类似）方法的软件冲突。\n\n### 设计规则\n\
  **每个包命名空间必须嵌套在一个唯一的企业命名空间内。**\n\n通过将我们所有的专有代码（应用程序 `main` 函数除外，参见第 2.13 节）隐藏在一个单一的企业名称之后，例如我们的公司全称（如图\
  \ 2-20 所示），我们几乎消除了任何意外冲突的可能性。而且，由于我们所有的组件都位于同一个企业命名空间内，因此没有必要也没有诱惑使用 `using` 声明或指令^(31)。在极少数与外部软件发生冲突的情况下——即使存在\
  \ `using` 指令——消除冲突的方法只需要前加上 (1) 公司范围的符号、(2) 第三方产品的符号，或 (3) 如果第三方代码未采取此预防措施则前加 `::`。\n\
  \n(31) 注意，对于大量使用模板的大代码库，使用长企业命名空间可能会导致编译器生成的调试符号过大到无法接受，这可能迫使我们使用更短的名称——例如，我们的股票代码。\n\
  \n\n\n\n[content]\n相反，如果在最高层级通过命名空间表示每个单独的包，至少在概念上会导致无数短小的全局符号，这从组合意义上增加了与采用相似策略的供应商发生冲突的概率（参见第三卷第\
  \ 8.3 节中的生日问题）。^(32) 无论如何，为我们自己的代码拥有一个（以某种方式唯一的）企业级“伞型”命名空间有助于降低风险，因此是理想的。\n\n通过包组（package\
  \ groups）对包进行去中心化注册（参见节 2.9.4、2.4.7 和 2.10.2）。\n\n实现逻辑和物理名称一致性的下一步，是形式化组件内定义的逻辑实体的命名方式，使得仅通过它们的使用就能识别出它们所在的组件。为了简化描述，我们对组件的基名称（base\
  \ name）提供了如下定义。\n\n**定义：**\n\n**组件的基名称是该组件头文件的根名称，排除了其包前缀和随其后的下划线。**\n\n例如，图 2-20\
  \ 和节 2.4.6 所示的组件，其基名称为 `cost`。然而，该名称未能与其定义的类 `BondPrice` 实现名义一致性（nominal cohesion）。\n\
  \n### 2.4.8 逻辑构造应在名义上锚定到其组件\n\n**定义：**\n\n**方面函数（aspect function）是一个具有给定签名的命名（成员或自由）函数，具有处处统一的语义（例如\
  \ `begin()` 或 `swap()`），且如果是自由函数，其行为类似于运算符——例如，关于依赖参数的查找（ADL）。**\n\n**设计规则**\n\n\
  **在包命名空间作用域（package-namespace scope）声明的每个逻辑构造——除自由运算符和方面函数（如 `operator==` 和 `swap`）外——都必须以实现它的组件的基名称作为前缀；宏名称（`ALL_UPPERCASE`）未通过包命名空间进行词法作用域限制，必须将组件的全大写名称（包括包前缀）作为前缀。**\n\
  \n**推论：**\n\n**在架构显著的组件头文件中声明的每个逻辑实体的完全限定名称（如果是函数或运算符则为签名）在整个企业中必须是唯一的。**\n\n以其主类或\
  \ `struct`（但全部全小写）为组件命名，如图 2-21 所示，通常可以解决大部分潜在的模糊。例如，我们预计类 `bts::PackedCalendar`\
  \ 会定义在一个名为 `bts_packedcalendar` 的组件中（或者如果该组件定义了其他紧密相关的“packed”类型，则可能是 `bts_packed`）。请注意，在我们的方法论中，除非有四个特定的反向理由，否则我们倾向于每个组件仅有一个（主）类（参见节\
  \ 3.3.1）。每当一个组件内部的包命名空间作用域内定义了多个类时，每个此类类名都将包含该组件的基名称（尽管是“大驼峰命名”格式）作为前缀。^(33)\n\n\
  ^(33) 注意，当存在外部指定的（“面向客户端”）接口时，此规则可能不适用。\n\n![](img/fig21.jpg)\n\n图 2-21：名义一致的类和组件\n\
  \n在适当的情况下，我们通常在同一个组件中定义辅助类（如迭代器），方法是：追加主类的名称（例如 `Calendar_iterator_`），或者通过将辅助类嵌套在主类内部（例如\
  \ `Calendar::Iterator`）。^(34) 但注意，当涉及用户定义的转换时，可能无法避免某些侦探性工作。^(34) 关于一个类授予私有访问权的两个类之间的强制协作，在节\
  \ 2.6 中进行了讨论。在实践中，嵌套迭代器类型可能是一个 `typedef`。\n\n### 2.4.9 包命名空间作用域下仅允许类、`structs` 和自由运算符\n\
  \n**设计规则**\n\n**仅允许将类、`structs` 和自由运算符函数（以及方面函数，例如 `swap()`）在包命名空间作用域下声明。**\n\n\
  为了减少混乱，我们一贯避免在组件头文件的命名空间作用域内声明单个函数、枚举、常量等，而是倾向于将这些逻辑构造嵌套在 `class` 或 `struct` 的作用域内。^(35)\
  \ 通过此，我们将这些实质构造锚定在一个较大的、架构显著的实体中，该实体与命名空间（节 1.3.18）不同，必然包含在单个组件内（节 0.7）。我们理解，当存在有效的反向理由（如外部指定的接口）时，此规则与上一样可能不适用。^(36)\n\
  \n^(35) lakos96，2.3.5 节，77–79 页，特别是第 77 页\n\n了解类名称本身在整个企业中是唯一的是有用的。例如，如果由于某种原因，我们在进程空间之外对多态对象实现*流化*（又称*外部化*或*序列化*）（参见第二卷第\
  \ 4.1 节），那么唯一标识我们正在流化的具体类是非常重要的。一种常见且有效的方法是在流数据之前加上要传输的值的具体类的字符字符串名称。只要我们确保组织中每个可能流化的具体类的名称保证是唯一的，这一过程就像文件的包含保护符一样，简化为了机械化操作。逻辑包前缀直接解决了这个问题，但我们仍然可以通过流化（极简的）包名（节\
  \ 2.10.1）后跟类名，并带有一个（单字符）分隔符，来实现相同的效果。\n\n\n\n\n在命名空间作用下拥有可修改的全局变量简单来说是一个坏主意。将此类变量作为`static`\
  \ 数据成员嵌套在类中，并仅提供功能性访问通常也是一个坏主意，但它至少解决了名义内聚（nominal cohesion）的问题。另一方面，在类或`struct`的作用域内将编译时初始化的常量与`typedef`\
  \ 声明一起嵌套完全没问题的。要求将枚举嵌套在类、`struct`或函数内部，可以确保所有枚举符都是局部作用域，且不会与同一包命名空间内其他组件的枚举符冲突。\n\
  \n`typedef` 声明虽然通常有用（例如，为了指定某种*方面*，如 `SomeContainer`::iterator`），但它们会掩盖代码中的底层类型，因此很容易降低可读性。特别是，人们通常不会使用\
  \ `typedef` 将基本类型别名化为特定于其应用程序的类型——例如，`typedef int NumElements;` 应该是一个**坏主意**。此外，理想情况下，应该有一个单一的\
  \ C++ 类型来表示每个广泛用于接口边界的真正不同的*柏拉图型*（platonic）类型（参见第二卷第 4.4 节）。\n\nC++11 提供了所谓的 `enum\
  \ class`，它解决了枚举符的作用域问题，并提供了更强的类型安全。注意，C++11 中的所有枚举允许指定其底层整数类型，且与 C++03 不同，它们因此形成了所谓的*完全类型*（complete\
  \ type），使得它们可以在局部声明和使用（即在不需要同时指定枚举符的情况下）。省略枚举符的能力可能构成侵权法中有时被称为“吸引性隐患”（attractive\
  \ nuisance）的因素，因为，除非被省略的枚举是由库提供的且该头文件与包含其完整定义的头文件分开的，否则希望将自己免受枚举符影响的客户端将被迫在局部声明该枚举，这违反了“组件属性\
  \ 3”（见第 1.6.3 节）。\n\n避免自由函数（除了运算符和类运算符的“*方面*”函数外，这些函数可能受益于依赖参数的查找 [ADL]）的原因源于我们希望在一个名义内聚的组件内封装足够数量的逻辑和物理上都一致的功能。由于类是实质性的架构实体，可以从其名称轻松识别，但单个函数通常太小且太具体，以至于无法与定义它们的单个组件实现名义内聚，如图\
  \ 2-22a 所示。\n\n鉴于我们几乎总会在组件内精确打开和关闭一次包命名空间（见第 2.5 节），我们选择不对其内容进行缩进，从而在考虑到实用的最大行长度（例如\
  \ 79）的情况下增加了可用的实际空间，该长度适用于高效的阅读、打印、并排比较等（参见第二卷第 6.15 节）。\n\n![](img/fig2-22a.jpg)\
  \ ![](img/fig2-22b.jpg) ![](img/fig2-22c.jpg) ![](img/fig2-22d.jpg) ![](img/fig2-22e.jpg)\n\
  \n**图 2-22：确保自由函数和组件的名义内聚**\n\n创建包含多个函数且其中没有名义内聚的组件（[图 2-22b]）会让人类对此类物理节点的推理变得困难得多，因此也是一个坏主意。强制每个函数的名称都以组件基名的首字母小写渲染作为前缀（[图\
  \ 2-22c]）可以实现名义内聚，但充其量是别扭的，并且未能强调逻辑内聚（见第 2.3 节）。我们可以使用第三层级的命名空间（[图 2-22d]），但由于下文讨论的原因（[图\
  \ 2-23]）以及第 2.5 节末尾，我们认为那不是最优的。\n\n![](img/fig2-23.jpg)\n\n**图 2-23：优先使用 `struct`\
  \ 而非 `namespace` 来聚合“自由”函数。**\n\n因此，我们通常避免在包命名空间作用下声明自由的（非运算符）函数，而是通过在`struct` 中使用`static`\
  \ 方法将相关功能分组到与组件名称匹配的额外命名空间层中，从而实现名义逻辑和物理内聚（[图 2-22e]），我们将一致地将其称为*工具*（utility）（见第\
  \ 3.2.7 节），并用 `Util` 后缀对其进行指示（例如 `xyza::MathUtil`）。在实现*工具*时，优先使用 `struct` 而非 `namespace`\
  \ 的额外优势总结在图 2-22 中。注意，自由函数模板无法进行部分特化。因为只有自由（即非成员）函数参与 ADL，扩展 C++ 语言以容纳新功能（相对于 `struct`\
  \ 的 `static` 成员）被某些人认为实现起来要困难得多。虽然可以使用 `using` 声明从私有（受保护的）基类将给定名称重载函数的声明导入到公共类中，但我们通常不鼓励这样做，因为这将需要公共客户端查看原本私有的（受保护的）细节；相反，我们倾向于创建（并记录）内联转发函数。注意，自\
  \ C++11 起，转发构造函数也存在类似的问题。Google 的 Titus Winters 最近对……表示了日益增长的担忧。\n\n**设计规则**\n\n\
  **组件头文件允许包含*自由*（即非成员）运算符或*方面*函数的声明（在包命名空间作用下），先决条件是：其一个或多个参数包含了在同一组件中定义的类型。**\n\n\
  在我们的方法中，运算符无论是成员还是自由的，其本质上对于它们所操作的类型都是基础性的。每一个一元运算符和同构二元运算符——即用单个用户定义类型编写的运算符，例如：\n\
  \n此处查看代码图像\n\n```\nbool operator==(const BondPrice& lhs, const BondPrice& rhs);\n\
  ```\n\n都在与其操作的类型（例如 `bts::BondPrice`）相同的组件（例如 **bts_bondprice**）中声明和定义。注意，除了赋值的各种形式（例如\
  \ `=`、`+=`、`*=`）外，我们总是选择将二元运算符设为自由的（而非成员函数），以确保相对于用户定义转换的对称性（参见第二卷第 6.13 节）。对于惯常的异构运算符，例如\n\
  \n此处查看代码图像\n\n```cpp\nstd::ostream& operator<<(std::ostream&    stream,\n\n    \
  \                     const BondPrice& price);\n```\n\n\n\n\n将运算符设置为自由的（free）的动机源于无需修改的扩展性，例如开闭原则（见章节\
  \ 0.5）。在任何情况下，寻找运算符定义（完全与 ADL 一致）的地方都应该是定义该运算符所操作的类型的组件内部。\n\n如果我们允许在任意组件中定义自由运算符，我们如何能知道它们是否存在呢？如果我们看到某个运算符被使用，又该如何追踪它的定义呢？更隐蔽的可能性是，客户端可能在无意中本地复制了这样的定义。由此导致的潜在不兼容性（表现为未来的“多重定义符号”链接器错误）将威胁到我们开发过程的稳定性。\n\
  \n作为一个重要且相关的例子，考虑标准模板容器类 `std::vector`，它没有定义标准的输出运算符。参考图 2-24，假设组件 `my_stuff` 的作者发现输出\
  \ vector 总体来说是有用的，因此“周全地”提供了\n\n![](img/fig2-24.jpg)\n\n**图 2-24：在非预期的组件中定义运算符的问题**\n\
  \n点击此处查看代码图像\n\n```\ntemplate <class TYPE>\n\nstd::ostream& operator<<(std::ostream&\
  \            lhs,\n\n                         const std::vector<TYPE>& rhs);\n```\n\
  \n（以及相应的定义）放在其头文件中，供客户端通用使用。并不难想象组件 `your_stuff` 可能也会这样做。现在考虑一下当 `their_stuff.cpp`\
  \ 同时包含 `my_stuff.h` 和 `your_stuff.h` 时会发生什么。不可避免的结果是符号的多重定义！^(44)\n\n^(44) 因为由于引起麻烦的运算符是一个模板，而模板具有双重绑定特性（见章节\
  \ 1.3.4），完全有可能重复定义在编译器或链接器中很长一段时间内都无法被察觉——也就是说，直到编译器能够在单个翻译单元中并排地看到这两个模板定义。如果该结构是外部绑定的（例如普通函数或显式实例化），仅仅将这两个组件链接到同一个程序中就足以暴露这种不兼容性。\n\
  \n相反，该功能应该被实现为独立组件中工具 `struct` 的 `static` 成员函数（见章节 3.2.7），如图 2-25 所示。\n\n![](img/fig2-25.jpg)\n\
  \n**图 2-25：对非局部类型避免自由运算符**\n\n如图 2-26 所示，在组件 `my_type` 中为类型 `my::Type`——或者理论上为 `std::vector<my::Type>`——提供输出运算符是完全没有问题的。这里所阐述的通用设计概念是遵循哲学家伊曼纽尔·康德的教导，避免做那些如果被他人所做就会对社会产生不利影响的事（见章节\
  \ 3.9.1）。通过遵循这一运算符的简单规则，我们确保了：(1) 我们知道去哪里寻找每个运算符，(2) 运算符定义不会被重复（因此在物理分层的高层不会发生冲突）。\n\
  \n![](img/fig2-26.jpg)\n\n**图 2-26：在同一组件内对类型重载自由运算符**\n\n如果一个单一自由运算符引用了实现在不同组件中的两个类型，且其中一个依赖于另一个，那么该运算符自然定义在较高层次的组件中。然而，如果组件在其他方面是相互独立的（如图\
  \ 2-27a 所示），我们有两个替代方案：\n\n![](img/fig2-27.jpg)\n\n**图 2-27：实现引用多个同级类型的“自由运算符”**\n\
  \n1. [次优的] 任意选择其中一个组件作为较高层并将自由运算符放置于那里，如图 2-27b 所示（从而为其中一个组件引入了额外的物理依赖）。\n2. [优先的]\
  \ 在独立组件中创建一个工具类，如图 2-27c 所示，并在用于相同目的的 `struct` 内部定义一个或多个非运算符函数（见章节 3.2.7）。注意，*永远*不恰当将*提升*（见章节\
  \ 3.5.2）相互依赖的自由运算符到独立的组件中。\n\n除了最基本、显而易见且直观的操作之外（见第二卷第 6.11 节），使用运算符几乎总是一个坏主意，并且通常应该被避免；在相互独立的用户定义类型之间，对运算符的任何有效且实际的需求几乎不存在。^(45)\n\
  \n^(45) 我们注意到 C++ 流式运算符和 Boost 是（可能的）反例；然而，跨异用户定义类型之间的异构运算符（见第二卷第 4.1 节），如 `Square`\
  \ 和 `Rectangle`（图 2-27），仍然是错误的（见第二卷第 4.3 节）。\n\n### 2.4.10 包前缀不仅仅是样式\n\n不要误会，包的命名不仅仅是样式问题；包具有深远的架构意义。例如，考虑图\
  \ 2-28，它显示了依赖关系形成二叉树的组件层次结构。显然，这些组件是可以分级的（章节 1.10），因此没有循环。但是，通常无法将子系统分配到任意包。在这个例子，包含这些组件的包（由组件名称中的包缀暗示）将是循环的，因此*不是*分级的。\n\
  \n![](img/fig2-28.jpg)\n\n**图 2-28：隐含的循环依赖（坏主意）**\n\n由图 2-29 确定的问题在实践中很容易出现。考虑一个单一包的设计，该包旨在供子系统的客户端直接使用。如果这个演示包\
  \ `subc` 既定义了协议类（即纯抽象接口，本质上是底层的），又定义了包装组件（本质上是高层的），无法交错来自独立实现包 `subim` 的组件^(46)\n\
  \n^(46) 对于复杂的子系统，此处表示为单一包 `subim` 的实现组件可能会恰当跨跨越多个层次的包；但基本思想保持不变。\n\n![](img/fig2-29.jpg)\n\
  \n**图 2-29：无循环的组件层次；循环的包层次（坏主意）**\n\n#### 结论：\n\n**包之间允许的（显式说明的）依赖必须是无循环的。**\n\n\
  在在包之间允许循环依赖会使我们的软件在质量上变得更加复杂。最终，*所有*参与循环的包必须作为一个单元处理。解决这一常见问题的通用方案（如图 2-30 所示）是只需提供两个独立的面向客户端的包。一个包\
  \ `subw` 将位于子系统的顶部，包含只定义包装器的组件^(47)（例如 `subw_comp1`）；第二个包将位于包层次结构的底部，并包含组件（例如 `subv_comp1`），这些组件定义了协议和其他*词汇*类型（见第二卷第\
  \ 4.4 节），这些类型通过包装接口以编程方式暴露。^(48)\n\n\n\n\n\n## 47 `wrapper` 是一种`facade`（外观），它允许客户端操作对象（通常是其他类型的对象），而无需为这些对象提供直接的编程访问（参见节\
  \ 3.1.10 和 3.11.6）。\n\n## 48 参见`escalating encapsulation`分层技术（节 3.5.10）。\n\n![](img/fig2-30.jpg)\n\
  \n**图 2-30：为了避免包循环依赖而重新封装组件**\n\n在包装器组件（`subw`）接口中使用的组件，以及在底层协议中*仅名义上使用*的组件，通常与协议位于同一个包中（例如图\
  \ 2-30 中的`subv`），或者位于独立的更低层包中（如图 2-31b 所示），而不是位于同一层级（图 2-31a）。这样做是为了让协议的具体测试实现能够恰当地位于它们之上（例如在`subp`\
  \ 中），同时允许这些测试实现依赖于具体的类型类型（例如在`subt` 中），而不是必须对它们进行 mock（模拟）。\n\n![](img/fig2-31a.jpg)\
  \ ![](img/fig2-31b.jpg)\n\n**图 2-31：替代的打包策略**\n\n### 2.4.11 包前缀是我们命名包组的方式\n\n虽然包作为架构上重要意义的聚合具有唯一的名称（和命名空间），但将具有相似目的和/或相似物理依赖范围的包组合成一个更大的、在逻辑和物理上都连贯且名义上内聚的聚合体通常是有益的。我们可以对这个问题大做特此（考虑到其重要性，也许我们确实应该这样做）。相反，我们将避免这种戏剧化，直接说明我们的观点：包名的前三个字母标识了该分组包的所属的物理连贯包组。\n\
  \n这种简单方法的原因，嗯，非常简单（参见节 2.10.1）：我们必须拥有一种极其高效的方式来指定每个组件和类的包组和包，以消除繁琐且阻碍性能的 `using`\
  \ 指令和声明（参见节 2.4.12）。选择三个字母（而不是，比如，两个或四个）仅仅是工程上的权衡。这种简单、简洁且有效的包组命名方法在图 2-32 中所示。我们将在节\
  \ 2.10 中（深入深入地）重新讨论我们的包命名规则。\n\n![](img/fig2-32.jpg)\n\n**图 2-32：逻辑和物理连贯的包组**\n\n\
  ### 2.4.12 `using` 指令和声明通常是一个坏主意\n\n现在让我们仔细观察我们如何使用 C++ `namespace` 构造体来根据包的边界划分逻辑实体。包命名空间的一个坚实益处是，访问该包局部的其他实体不需要显式的限定符。这种优势在应用层尤为明显，在应用层中，许多相互操作的代码都是在本地定义的（参见节\
  \ 2.13）。在缺少 `using` 指令和声明的情况下，不带限定的引用和带限定的引用一样：不带限定的引用意味着该实体是*此*包局部的。(49)\n\n49\
  \ 然而，有一个务实的原因让我们倾向于使用硬编码逻辑包前缀的这种灵活性，尽管我们在日常工作中已完全接受了包命名空间。遗憾的是，任何对 `using` 指令和声明的使用使得对远程定义类型显式使用包命名空间“标签”变得可选，但代价是以牺牲名义内聚性。偶尔，库开发者可能需要“搜索宇宙”以找到某个类或工具的所有使用处。当我们考虑到使用\
  \ `using` 指令和声明时，任何依赖简单搜索和替换（例如，当组件从一个包“移动”到另一个包时）的希望都消失了。相反，我们被迫解析每一行源代码。即使我们有这样复杂的工具（例如\
  \ `Clang`），它也像编译器本身一样，运行速度比寻找固定标识符字符串的简单搜索引擎要慢几个数量级。我们在通过扫描组件内部嵌套的 `#include` 指令来确定直接物理依赖范围时，也遇到过同样的速度问题（节\
  \ 1.11）。因此，`namespace` 构造体的使用，至少在这一方面，其扩展性并不像经典的（尽管现在已过时的）逻辑前缀那样*好*\n\n在图 2-33 的代码示例中，我们不能仅仅通过查看\
  \ `Link` 的定义就知道我们讨论的是哪个 `Link` 类，除非可能需要回溯整个文件查找 `using`。\n\n![](img/fig2-33.jpg)\n\
  \n**图 2-33：非局部命名空间是可选的！**\n\n更糟糕的是，`using` 指令和声明可能不是实现文件局部的，而是在一个或多个头文件中导入的，如图 2-34\
  \ 所示。而且，不像 C++ 标准库（或 `std`）那样是相对较小、不变且广为人知的，我们不能要求知道每个组件中的每个类。更糟糕的是，在头文件中嵌套各种 `using`\
  \ 指令会导致这些头文件被包含到翻译单元中的相对顺序产生风险(50)。\n\n50\n\n![](img/fig2-34.jpg)\n\n**图 2-34：`using`\
  \ 指令/声明是可以包含的！**\n\n### 设计规则\n\n**在组件中，函数作用域之外不允许出现任何 `using` 指令或 `using` 声明。**\n\
  \n无论如何，我们必须禁止在头文件的函数作用域之外出现任何 `using` 指令或声明(51,52,53,54)。也许某些头文件中使用 `using` 的支持者尚未意识到，从一个命名空间\
  \ `A` 将名称引入另一个命名空间 `B`，并没有在导入 `A` 命的 `B` 的右大括号处结束，而是一直留在 `B` 中直到翻译单元结束。因此，在头文件中声明类成员数据和函数原型时，有时会使用\
  \ `using` 指令或声明（我们应该说是在严重误用）来缩短远程命名空间中定义的类型名称（坏主意）。(55)）。相反，我们必须为非封装包局部的逻辑实体使用包限定名称。由于这个原因，我们希望确保广泛使用的（“包”）命名空间名称（如\
  \ `std`）确实非常短。\n\n而且，在库代码中，通常最好完全避免 `using`。如果在那里确实使用，`using` 声明（不是指令）——无论是为了启用\
  \ ADL（例如对于自由方面函数，如 `swap`），还是仅仅作为紧凑的别名（例如作为分发表中的项）——都应该只出现在非常有限的词文中，即函数（或块）作用域。\n\
  \n\n\n\n\n## 52\n在 C++98 中，`using` 声明取代了`访问声明`（后者在中间阶段弃用，并在 C++11 中最终被移除），其目的是将基类中给定（命名）成员函数的所有重载提升到当前作用域，并可能同时提高其访问级别（例如，从私有提升为公有）。正如我们很快将讨论的，我们避免使用任何类作用域的\
  \ `using` 声明，特别是那些可能强制公共客户端引用类实现中非公共区域的声明。\n\n## 53 \nC++11 引入了其他 `using` 关键字有效的上下文（例如，作为替换\
  \ `typedef` 的`别名声明`），这些与 `using` 声明或 `using` 指令均没有关系。\n\n## 54\nAlisdair Meredith（通过\
  \ 2018 年的个人邮件）指出，当基类是模板时，需要转发的重载集是一个开放集。当设计要求手动暴露每个重载时，可能会发生无意中的破坏。当意图是从基类`完美转发`一个重载集时，`using`\
  \ 声明是对该设计意图的清晰陈述。\n\n尽管如此，我们建议的方法是避免此类此类（通常是`结构性`）继承（参见第二卷第 4.6 节），倾向于使用更具组合性的 `Has-A`（1.7.4\
  \ 节）方法来实现`分层`（参见 3.7.2 节）。\n\n尽管如此，确实存在特殊情况。Alisdair Meredith 再次通过 2018 年的个人邮件进一步指出，我们自己有时也会引入一个模板参数较少的基类，然后使用`结构性`继承和\
  \ `using` 声明将该功能作为公共接口暴露。如果我们现在将 `using` 声明替换为例如 `inline` 转发函数，我们将抵消减少模板引发的代码膨胀的预期效果（参见第二卷第\
  \ 4.5 节）。\n\n## 55\n由于特定的模板实例化，本地 `typedef` 在历史上一直能有效解决数据定义和函数原型中的长名问题：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Book {\n\n    // ...\n\n    typedef std::map<std::string, std::string>\
  \       StrStrMap;\n\n    typedef std::map<std::string, std::vector<int> > StrIntarrayMap;\n\
  \n    // ...\n\n    StrStrMap      d_glossary;\n\n    StrIntarrayMap d_index;\n\n\
  \    // ...\n\n};\n```\n\n我们承认 C++11 提供了 `using` 作为一种语法替代方案，并且深思（有别地）使用 `auto` 也可以帮助消除源码中冗余（或其他多余的）显式类型信息。参见\
  \ `lakos21`](#ref.xhtml_ref54)。\n\n在函数声明中使用 `using` 也是妥妥的，因为 (1) 我们记录和理解此类功能的能力受到了损害，并且\
  \ (2) 它必然意味着耦合（参见 9 节 和 10 节）。我们通常倾向于避免将 `using` 用于 `#include` 指令（参见 1 节）的物理位置。\n\
  \n最后，如果我们更改了类的`结构性`位置，它也必须发生改变。除非逻辑和物理位置重合，否则许多优势将消失。遵循这些命名（56）实际上是一种特性。\n\n###\
  \ 2.4.13 总结\n总而言之，我们对内聚命名（包、类和自由函数）的严谨方法不仅避免了冲突，还在源码中提供了有价值视觉提示。反过来，这种名义法强化了更为关键的逻辑/物理关联要求。因此，逻辑与物理位置重合。\n\
  \n### 2.5 组件源码组织\n在本节中，我们描述了组件内部源码的通用、高层布局。回想我们在 0.7 节 中提到的目标，即用较小的、原子、均匀的物理模块来表示所有软件。我们断言，第\
  \ 1 章（1.6 节 和 1.11 节）中描述的`组件`是最佳的原子构建块。此外，我们认为`组件`而不是`类`才是逻辑和物理设计的合适单元。\n\n从远处看，系统中的每个组件看起来都一样，无论其逻辑内容如何。图\
  \ 0-33 和 0.7 节 所示的本质相同的结构化设计在 图 2-35 中重复，但现在每个名称都包含了相应的包前缀（2.4.6 节），此处使用包名 `xyza`\
  \ 进行说明。\n\n拥有名为 `xyza` 的包意味着它是 `xyz` 包组的成员（2.4.11 节）。\n\n![](img/fig2-35.jpg)\n\n\
  **图 2-35: 每个包组件的典型远视图**\n\n\n\n\n\n当我们仔细观察时，会发现每个组件的组织结构也是标准的，并且在很大程度上独立于各个组件之间的逻辑内容。图\
  \ 2-36 展示了与我们编写的每个组件的核心逻辑内容相随的标准“样板代码”（boilerplate）。头文件（图 2-36a）开头于一行，该行留给开发环境使用，用于根据需要标记组件。接着是必须的、预测包含保护（include\
  \ guard），随后是正如第二卷第 6.15 和 6.16 节分别讨论的详细组件级文档和用法示例。\n\n![](img/fig2-36a.jpg) ![](img/fig2-36aa.jpg)\
  \ ![](img/fig2-36aaa.jpg) ![](img/fig2-36b.jpg)\n\n**图 2-36：每个组件的标准“样板代码”格式**\n\n\
  接下来，我们只在头文件中放置编译头文件本身所需的 `#include` 指令^(58)剩余所需的 `#include` 指令被妥善地归入 `.cpp` 文件。包含头文件的顺序由物理层次结构决定。首先包含同一包内组件的头文件。然后包含同一包组内其他包的组件。接下来，包含其他包组中的组件。最后，我们包含标准头文件。在上述四个子部分中，包含指令按字母顺序排列。\n\
  \n^(58) 注意，这些嵌套包含*并不是*被那些现在已废弃的*外部*（又称“冗余”）包含保护所包围的，正如在第 1.5.3 节中讨论的那样。\n\n在这一点上，我们打开了企业级命名空间。我们需要将任何指向当前包之外的类的本地（“前向”）声明嵌套在企业级命名空间中，我们是每行一个。然后，我们打开包级命名空间，并将当前包中定义的所有类型的本地声明都放在那里，同样是每行一个。\n\
  \n现在我们开始声明打算在此头文件中提供的每一个逻辑内容。我们通常将这些内容格式化为一个或多个类的序列（或者对于工具类，格式化为单个 `struct`），每个类后面紧跟任何关联的自由运算符的声明^(59)我们通常完全避免声明自由非运算符函数；然而，我们有时被迫对标准（“切面”/aspect）函数破例，例如\
  \ `swap` 这种——根据惯例——这种函数具有通用的一致的语法和语义，因此表现得就像运算符一样。如果我们确实声明了此类自由切面函数，我们会紧跟在关联类的任何自由运算符之后进行声明。关于如何在每个类内部组织逻辑内容的详细讨论，请参见第二卷第\
  \ 6.14 节。\n\n^(59) 从历史上看，某些编译器要求在声明处使用 `inline` 声明自由函数，以便它们被内联。我们观察到，在任何相关的平台上这已经不再是一个问题了。\n\
  \n为了可读性并为了分离契约与实现这两个概念，我们一致地^(60)将任何必须跨翻译单元共享的定义的源代码放在类词法作用域之外，并位于组件整个公共接口之下。一旦组件的公共接口完成，我们就用一个醒目的横幅^(61)来界定逻辑接口和实现：\n\
  \n^(60) 存在一些极少数的例外，可能会迫使我们这样做，这些例外无不涉及模板：\n\n1. 当我们有大量的普通模板结构时（例如在 C++11 变长模板出现之前），将声明与其（内联）定义分离出来将导致在一个已经庞大的组件中重复大部分代码，而且单独的声明并不是为了给人类阅读的。\n\
  \n2. C++ 中还有一种经典情况：模板的非模板 `friend` 函数的本地声明，如果其参数类型与类模板类型相同，则通常无法在类的词法作用域之外重新声明（并定义），尽管可以为一组有限的实例化提供一组有限的定义（如果确实需要的话）。例如：\n\
  \n   点击此处查看代码图像\n\n```cpp\ntemplate <class T>\n\nclass MyType {\n\n    int d_data;\n\
  \n    friend bool operator==(const MyType& lhs, const MyType& rhs);\n\n};\n\n//\
  \ 疯狂的案例——我们只能比较 'MyType<int>' 而不是任何其他\n\n// 类型，因为链接器永远找不到该定义。\n\nbool operator==(const\
  \ MyType<int>& lhs, const MyType& rhs)\n{\n   return lhs.d_data == rhs.d_data;\n\
  }\n```\n\n^(61) 多年来人们提过几种描述性的横幅标题（见下一页）：\n\n* `[ ]` ` IMPLEMENTATION`\n* `[ ]` ` INLINE\
  \ DEFINITIONS`\n* `[X]` ` INLINE FUNCTION DEFINITIONS`  **(原始)**\n* `[ ]` ` INTERNAL\
  \ AND DUAL BINDAGE DEFINITIONS`\n* `[ ]` ` INLINE FUNCTION AND FUNCTION TEMPLATE\
  \ DEFINITIONS`\n* `[ ]` ` INLINE-FUNCTION, FUNCTION-TEMPLATE, AND TRAIT DEFINITIONS`\n\
  \n在经过二十多年的深思熟虑后，我们现在认为原始的横幅 `INLINE DEFINITIONS` 仍然是简单、准确、清晰和稳定性之间的最佳平衡。因此，我们采用了原始横幅——理想情况下居中（从第\
  \ 27 列开始），位于固定的 79 字符最大行长度内——作为我们的永久标准，无论未来会有其他类型的头文件绑定实现制品（例如 voutilainen19）出现在其下方（参见第二卷第\
  \ 6.3 节）。\n\n![](img/unfig2-1.jpg)\n\n所有内联*成员*函数和*成员*函数模板定义按照它们声明的相对顺序排列^(62)；然而，自由函数是单独组织的。回想第\
  \ 1.3.1 节，在命名空间作用域处定义的自由函数也可以作为其自身的声明。如果未限定函数定义的签名与之前的声明不匹配，则该定义本身会引入一个新的声明。这种次优行为可以通过在声明该自由函数的命名空间之外定义该自由函数来抑制。在命名空间内定义的自由运算符（类似于任何其他自由函数）也是自声明的（在该命名空间内）。因此，我们选择首先关闭包命名空间，然后对这些自由运算符定义中的每一个进行包限定，随后是任何必要的（运算符类的）自由（切面）函数的定义，如图\
  \ 2-36a 底部所示。\n\n\n\n\n\n在类型 trait（参见第二卷第 4.5 节）的情况下，可能需要对其他包中定义的模板进行特化。虽然 trait\
  \ 本身作为标记类型（参见第二卷第 4.4 节），但此类特化通常是优化手段，并且除非被专门记录为基本行为（参见第二卷第 5.2 节），否则它们被（即应该被）视为实现细节，并可能在不另通知的情况下更改。因此，我们选择在头文件的实现部分实现此类特化。由于这些特化必须在与定义相同的命名空间内实现，必须关闭当前的包命名空间；因此，我们认为将这些特化放在位于包命名空间之外的所有内联函数和函数模板之后之后。最后，我们关闭企业级命名空间并结束（内部）包含保护符，明确地表示头文件的结束。\n\
  \n请注意，traits 通常不被当前组件使用，而是由该组件的客户端（其编译器）使用；因此，将 traits 放在头文件的最后在实践中不会产生任何问题。\n\n\
  转向实现文件（图 2-36b），我们再次发现第一行留作管理用途，随后是可选的描述，以任何适合我们目的的格式描述实现的特殊之处。下一部分必然是 `#include`\
  \ 指令，其开头指令是包含我们自己的组件接口的指令，随后是逐层更低层级组件的指令（每个指令分别按字母顺序排列）：相同包、低层级包、其他包组以及系统级头文件中的包。\n\
  \n接下来，我们同时打开企业级和包命名空间（因为它们之间永远没有任何属于它们之间的内容），并在那里放置所有剩余的逻辑内容，但任何剩余的 `extern` 自由（运算符或切面）函数定义除外，这些定义与\
  \ `.h` 文件中一样，应该在包命名空间关闭之后实现。`.cpp` 文件中任何在 `.h` 文件中声明的函数的定义应再次以相同的相对顺序出现。任何希望其链接保持在该编译单元本地的逻辑内容——无论是通过将其声明为\
  \ `static`、在匿名命名空间中还是根据约定（参见第 2.7.3 节）——都首先实现。最后，关闭企业级命名空间以及注释标记，用于明确指示 `.cpp` 文件的逻辑结束。\n\
  \n从 C++17 开始，可以使用备用语法\n\n```\nnamespace MyLongCompanyName ::xyza {\n\n    // ...\n\
  \n}\n```\n\n但我们不会使用它，因为我们通常会在源文本的不同位置关闭相应的包和包组命名空间。\n\n### 指南\n\n**除了企业级命名空间和直接嵌套的包命名空间外，避免在架构上具有重要意义的场景使用\
  \ C++ `namespace` 结构。**\n\nC++ `namespace` 结构对于划分跨越组件边界的名称是有意义的。然而，在单个组件内部，我们将所有其他逻辑内容嵌套在\
  \ `class` 或 `struct` 中（第 2.4.9 节），这更能够充当组件本地命名空间的作用。通过将 C++ `namespace` 结构在架构上的重大使用限制为这两种特定角色，我们明确了强制执行统一且平衡的逻辑与物理聚合层级的意图。\n\
  \n请注意，可能存在某些情况（例如涉及版本控制或启用 ADL），在这些情况下，命名空间的其他用途（尤其是非架构意义的）可能是合理的。\n\n鉴于对 C++ 命名空间的这种统一且有限的使用，我们高效地省略了可能与嵌套在其中的代码相关的额外两级缩进，并仅使用以下内容记录相应的闭大括号：\n\
  \n```\n// close package namespace\n```\n\n和\n\n```\n// close enterprise namespace\n\
  ```\n\n分别（在注释中随处使用通用的“package”和“enterprise”，主要是为了避免可能出现的复制粘贴错误）。\n\n在本节中，我们提供了了一个组件内顶层内容布局的详细草图。虽然这无疑不是唯一的组织方式，但这种格式已被证明对于我们编写的几乎所有软件都是足够的。在下一节中，我们介绍了一系列规定其物理特性和逻辑内容的基本组件设计规则。遵循这种布局以及随后讨论的设计规则，使我们能够充分实现我们基于组件的方法论的益处。\n\
  \n### 2.6 组件设计规则\n\n我们所有关于健壮的基于组件的设计的基本规则——例如组件内容本身的组织——完全独立于主题领域（即正在实现的逻辑功能的主题）。我们要求的某些实践——例如，遵循某些特定的布局和样式规则（设计用于减少渲染中的无谓不一致性；参见第二卷第\
  \ 6 章）——可以被地描述为任意的；而其他则不然。在本节中，我们勾勒了一组简洁、贯且重要的本质、可验证的逻辑和物理设计规则，多年来，这些规则证明提高了我们软件的可理解性、可测试性和可维护性。\n\
  \n**设计规则**\n\n**组件必须恰好包含一个 `.h` 文件和（至少）一个具有相同根名的 `.cpp` 文件，它们共同满足组件的四个基本属性（第 1.6\
  \ 节 和 1.11 节）。**\n\n如在第 0.7 节中讨论的，确保物理规则性对于利用我们基于组件开发策略的许多优势至关重要。在第 1 章（第 1.6 节\
  \ 和 1.11 节））中，我们讨论了区分组件与仅仅是（名义聚合的）`.h/.cpp` 对的四个基本属性。这四个属性构成了物理规则性以及由此产生的本质模块性的基础，我们在此重申并将其转变为设计规则。\n\
  \n**设计规则**\n\n**组件属性 1：组件的 `.cpp` 文件包含其对应的 `.h` 文件作为第一行实质代码。**\n\n这里的目标是确保每个组件头文件在编译方面是自给足的。通过在组件对应的\
  \ `.cpp`文件中包含 `.h` 文件，我们不仅可以在翻译过程中暴露头文件本身的任何语法错误，还能发现 `.h` 和 `.cpp` 文件之间的不一致——特别是当我们避免直接在包命名空间内实现定义时（第\
  \ 2.5 节）。\n\n此外，当第二个（独立的）编译单元（例如组件级测试驱动程序，参见第三卷第 7.5 节）在测试期间也包含头文件时，我们获得了额外的机会（在链接时）捕捉由于不当的*强*（第\
  \ 1.2.3 节）外部链接符号定义导致的错误——这种缺陷仅在单个测试驱动程序包含头文件中是无法检测到的。\n\n\n\n\n\n通过进一步要求此 `include`\
  \ 指令是代码的第一行`substantive`（即非注释）（组件属性 1，section 1.6.1），我们确保了头文件可以在孤立状态下顺利编译，从而永久消除任何与包含顺序相关的问题。\n\
  \n最后，回想 section 1.5.1，所有此类 `#include` 指令最好使用角括号（`<>`）实现，而不是双引号（`\"\"`），以增加部署期间的灵活性（参参见\
  \ section 2.15.1）。\n\n## 设计规则\n**组件属性 2：在组件的 `.cpp` 文件中定义的每个有效具有外部链接的逻辑构造结构，都应在该组件的\
  \ `.h` 文件中声明。**\n\n我们主张，组件编写者的责任是确保从组件的对象文件（`.o`）中导出真正的外部链接符号定义，`unless`在该组件的头文件中存在相应的声明（组件属性\
  \ 2，section 1.6.2）。通过从组件的 `.cpp` 文件导出未公开的符号，我们面临着风险：(1) 定义与程序中的其他符号发生冲突，以及(2) 引导客户端通过本地声明访问定义，从而引入了不必要的、难以追踪的（“后门”）依赖。对于逻辑上属于组件“本地”的类，例如那些本可以在匿名命名空间中找到、但在\
  \ `.h` 文件中必须`locally declared`（本地声明）的类，我们可以选择通过——纯粹根据约定（参参见 section 2.7.3）——选择一个类名，该类像嵌套类一样保证不会与组件外部的名称冲突，从而模拟内部绑定。由于此类类中的方法声明（即类定义本身）具有外部或双重绑定，因此免受此规则限制。\n\
  \n## 设计规则\n**组件属性 3：在组件的 `.h` 文件中定义的每个有效具有外部绑定的逻辑构造结构（如果有定义的话），都应定义在该组件内部。**\n\n\
  提供与其主要声明和文档化的组件分离之外的定义（例如，参参见 Figure 1-45、section 1.6.3）会导致耦合，这种耦合方式并没有反映模块化 true\
  \ 所需的显式逻辑分解（组件属性 3，section 1.6.3）。我们所说的“有效地”意味着此规则也适用于双重绑定构造结构（section 1.3.4），该构造结构被刻意声明但未被定义（例如，在组件的头文件中使用\
  \ `extern` 模板声明；section 1.3.16），然后在仅一个 `.cpp` 文件中显式定义），从而实现了 `unique`（唯一的）链接时依赖（section\
  \ 1.8）。然而，请注意，为了抑制不需要的行为而声明为 `private` 的成员函数（参参见 Figure 2-37）——例如 (a) 拷贝构造或拷贝赋值，^(66)\
  \ 或 (b) 不希望的转换^(67)——可以留不实现；它们被声明为私有使得任何外部调用它们的尝试都是徒劳的。\n\n^(66) C++11 允许我们使用首选语法\n\
  \n```cpp\nFoo(const Foo&) = deleted;\n```\n\n以及\n\n```cpp\nFoo& operator=(const\
  \ Foo&) = deleted;\n```\n\n来替代它们。\n\n^(67) C++11 允许我们使用首选语法\n\n```cpp\nFoo(int)\
  \ = deleted;\n```\n\n来替代它们。\n\n![](img/fig2-37.jpg)\n\n**图 2-37：（经典的）使用 `private`\
  \ 抑制生成的行为**\n\n## 设计规则\n**组件属性 4：组件的功能仅通过 `#include` 其头文件来访问，绝不通过本地 `extern` 声明访问。**\n\
  \n一个组件逻辑接口的更改应该触发任何使用它的组件的重新编译。正如 section 1.4 中讨论的，用本地 `extern` 声明替换适当的 `#include`\
  \ 指令（参见 Figure 1-35、section 1.4）会短路这种保护机制，并将编译错误转换为更昂贵的链接时或运行时错误。此外，正如我们在 section\
  \ 1.11 中看到的，始终遵循这一规则的欢迎副产品是……\n\n## 设计规则\n**我们编写的每个逻辑构造结构必须位于组件内部。**\n\n坚持让物理结构受到诸如更改单个函数\
  \ `inline` 状态等简单逻辑更改的影响，也是我们非常想要避免的事情。\n\n\n\n\n\n![](img/fig2-40a.jpg) ![](img/fig2-40b.jpg)\
  \ ![](img/fig2-40c.jpg) ![](img/fig2-40d.jpg)\n\n**图 2-40：实现全功能星期类型的库组件**\n\n请注意，即使是实现单个\
  \ `protocol`（即纯抽象接口）类的组件（第 1.7.5 节），也必须有一个 `.cpp` 文件 (1) 以确保头文件可以在独立状态下编译，并且 (2)\
  \ 用于持有非内联析构函数。此外，它还将拥有一个相关的 `.t.cpp` 文件以实现组件级的测试驱动程序，这与定义枚举的组件一样，其存在是为了提供必要的`redundancy`（参见第三卷，第\
  \ 7.2 节），以确保组件被*正确实现并保持这种实现状态*。\n\n人们对“私有”头文件的感知是另一个经常听到的偏离我们既定规范的理由。私有头文件是不受欢迎的，因为就像组件间的友元关系（见下文）一样，它们授予了物理分离模块的超出标准公共契约（参见第二卷，第\
  \ 5.2 节）的特权访问。然而，正如第 1.4 节 中讨论的，对私有`data` 的完全支持，加上在 C++ 等语言中无需妥协性能即可拥有接口的能力，消除了所有对私有头文件的需求。避免选择性隐藏组件头文件的其他原因（纯部署优化除外，参见第\
  \ 2.15 节）已在第 3.9.7 节 中讨论。\n\n仅仅是规则性就足以证明组件严格物理形式的合理性。(70) 无论提议的偏离看起来多么无害，考虑每种物理不规则性的有效性所花费的时间和精力（通常每当有新成员看到它时就会重复考虑）应该让我们清楚，对于大规模系统而言，偏离单一固定且规则的组件结构简单*绝不是*^(71)\
  \ 好主意。\n\n^(70) Bloomberg 比较知名且直言不讳的负责人之一 David Sankel 在对本手稿的评述中是这样说的：\n\n更广泛地说，渲染的规则性使得未来的更改能够更均匀地应用于整个代码库（因此更有可能自动完成）。如果存在，例如惯例的改变或\
  \ C++ 语言本身的增强需要应用到每处，规则的代码库可以以最小成本实现这一点，而不必要的差异性通常意味着每个组件都必须“手动”更新，其成本差异可能是惊人的。\n\
  \n^(71) 注意，纯粹作为部署优化（例如，对于例如 C 标准库中非常底层的组件），我们确实承认将单个组件内实现的功能分布在多个 `.c` 文件中具有潜在收益（第\
  \ 2.2.12 节），但绝不会跨越多个 `.h` 文件（另见第 2.15 节）。\n\n### 设计规则\n**每个组件的 .h 文件必须包含一个唯一且可预测的包含保护：`INCLUDED_PACKAGE_COMPONENT`（例如，`INCLUDED_BDLT_DATETIME`）。**\n\
  \n需要唯一的 `internal` 包含保护，以避免由于单个翻译单元的包含图中重新汇合而导致重复定义。要求这些包含保护在机械化上是可预测的（即来自组件名称），使我们能够使用自动化工具对其进行验证：点击此处查看代码\n\
  \n```cpp\n// bdlt_datetime.h                               *-C++*-\n\n#ifndef INCLUDED_BDLT_DATETIME\n\
  #define INCLUDED_BDLT_DATETIME\n\n// ...\n\n#endif\n```\n这种可预测性也使得（现在已废弃的）`external`（“冗余的”）包含保护成为（第\
  \ 1.5.3 节）可能。\n\n### 设计规则\n**由组件导出的具有非内部绑定（例如，内联函数）的逻辑结构必须先声明（在头文件中），然后单独定义（在同一组件内），且所有\
  \ `free` 函数都应定义在它们声明的命名空间之外。**\n\n特别是，此设计规则要求内联函数（具有双重绑定）不要定义在类作用域内，以确保存在一个与实现分离的接口（参见第二卷，第\
  \ 5.2 节）。由于第 1.3.1 节 中阐明的原因，自由操作符以及任何其他 `free` 函数都应定义在它们所属的命名空间之外。通过简单地遵循我们规定的布局（参见图\
  \ 2-36），我们从很大程度上确保了这一重要规则的满足。\n\n### 设计规则\n**不允许对文件级或命名空间级的静态对象进行运行时初始化。**\n\n文件级或命名空间级静态变量的运行时初始化，特别是在不包含\
  \ `main` 的文件中，一直是问题的根源（参见第二卷，第 6.2 节），尽管如此（如第 1.2.5 节 所示）。\n\n### 推论\n**每个组件的 .h\
  \ 文件必须能够独立编译。**\n\n这一要求通过遵循属性 1（第 1.6 节）即可得到保证。\n\n### 指南\n**.h 文件应仅包含确保头文件独立编译的所需的\
  \ `#include` 指令（或在适当的情况下局部类声明）。**\n\n同时，我们希望避免任何不必要的 `#include` 指令（即使在头文件中）。事实证明，只有少数情况需要在头文件中包含头文件。在头文件中包含头文件的五个常见原因总结在图\
  \ 2-41 中。(72)\n\n当然，还有其他情况会要求在头文件中包含头文件以相对于属性 1（第 1.6 节）确保自给自。协变返回类型就是一个例子。另一个理由可能是使用\
  \ C++ 标准库中的内容，对于这些内容局部声明是被禁止的。\n\n![](img/fig2-41.jpg)\n\n**图 2-41：头文件正确包含另一个头文件的情况**\n\
  \n当从另一个类 `Foo`（定义在独立的组件 `xyza_foo` 中）派生类 `Bar` 时，编译器必须已经看到 `Foo` 的定义才能编译 `Bar`。因此，我们必须在定义\
  \ `Bar` 的头文件 `pqrs_bar.h` 中放置 `#include <xyza_foo.h>` 指令（图 2-41a）：\n\n点击此处查看代码\n\
  \n```cpp\n// pqrs_bar.h\n\n#include <xyza_foo.h>          // 定义\n\n// ...\n\nclass\
  \ Bar : public xyza::Foo { // 是一个\n\n    // ...\n\n};\n```\n\n对于嵌入对象也是如此（图 2-41b）：\n\
  \n点击此处查看代码\n\n```cpp\n// pqrs_bar.h\n\n#include <xyza_foo.h> // 包含\n\n// ...\n\n\
  class Bar {\n\n    xyza::Foo d_foo;  // 有一个\n\n    // ...\n\n};\n```\n\n但对于持有的对象（即通过其地址）则*不是*：\n\
  \n点击此处查看代码\n\n\n\n\n\n```\n// pqrs_bar.h\n\n// ...\n\nnamespace xyza { class Foo;\
  \ } // 本 (\"前向\")声明 73\n\n// ...\n\nclass Bar {\n\n    xyza::Foo *d_foo_p; // Holds-A\n\
  \n    // ...\n};\n```\n\n73 保持此类本地声明的同步可以通过自动的 `static`-分析工具来实现，也可以通过前向头文件（forwarding\
  \ headers）来实现。这些前向头文件作为独立的组件实现，并遵循与底层组件本身相同的组件化设计规则（在本节介绍）。\n\n与某些人的想法不同，并不是因为某个类型在头文件中某个函数的接口\
  \ `[第 1.7.3 节]` 中使用了，就有必要在组件的头文件中 `#include` 该对象的类型。正如图 2-42` 所示，即使该类型的对象是通过值传递⁷⁴\
  \ 和返回⁷⁵ 的，这一断也是成立的。\n\n74 注意，我们始终通过 `const` 引用而非按值传递用户定义的类型（作为参数）（见卷 II，第 6.12 节）。\n\
  \n75 即使在现代 C++（`C++11` 及更高版本）中，我们也只在对象不分配内存时才继续按值返回（见卷 II，第 4.10 节）。\n\n![\n\n**图\
  \ 2-42：在接口中使用并*并不*意味着头文件中必须有 `#include` 指令。**\n\n当一个类型在 `inline` 函数中被实质性地使用时，编译器必须已经见过该类型的定义才能进行编译。对于在（隐式实例化的）函数模板中实质性使用的类型也是如此。尽管某些编译器可能在函数被调用（实例化）之前不会检测到缺失的定义，但包含该头文件是正确的做法，以确保：(1)\
  \ 头文件在所有编译器下都能独立编译，并且 (2) 客户端代码在调用函数时始终能够编译。因此，在定义 `inline` 函数（或函数模板）的头文件中，有必要 `#include`\
  \ 定义在该函数定义体内部被实质性使用的任何类的头文件 `[图 2-41c]`：\n\n```\nImages/pro2-15.jpg\n```\n\n从历史上来说，枚举类型的变量永远无法在本地（即“前向”）声明⁷⁶。由于我们选择从不“前向声明”全局变量（`[第\
  \ 1.11 节]`）的相同原因（等），我们也选择从不在本地声明枚举类型的变量⁷⁷，而是始终通过其关联头文件访问（完整的）定义 `[图 2-41d]`：\n\n\
  76 这在 `C++11` 中发生了一些变化；然而，这种“前向声明”是针对具有外部链接 `[第 1.3.4 节]` 的某些固定整数类型的。\n\n77 特别是在\
  \ `C++11` 中，当我们不需要知道特定的枚举值时，为了消除对特定枚举值的编译时依赖，我们可能会尝试这样做（一种“诱人的陷患”）。\n\n[点击此处查看代码图像]\n\
  \n```\n// pqrs_bar.h\n\n#include <xyza_foo.h>            // 定义枚举类型\n\n// ...\n\n\
  class Bar {\n\n  // ...\n  public:\n        // ...\n    xyza::Foo::Enum function();\
  \  // 非内联函数\n\n        // ...\n};\n```\n\n最后，当一个类型不是类，而是类模板显式特化的 `typedef` 时（例如\
  \ `std::string` 或 `std::ostream`），我们无法使用传统方法在本地声明该类。在 `std::ostream` 的情况下，我们可以通过\
  \ `#include <iosfwd>` 来“前向声明” `std::ostream`；遗憾的是，`std::string` 没有类似的机制，因此我们被迫直接\
  \ `#include <string>` 本身，即使不需要它的定义 `[图 2-41e]`⁷⁹：\n\n78 通常称为*类型别名*（type alias）。\n\
  \n79 注意，在 C++ 标准库中本地声明任何都是无效的。\n\n[点击此处查看代码图像]\n\n```\n// pqrs_bar.h\n\n#include\
  \ <string>             // 包含模板\n\n// ...\n\nclass Bar {\n\n    std::string d_string_p;\
  \  // Holds-A\n\n    // ...\n};\n```\n\n除了 `[图 2-41]` 中列出的特定情况外，在头文件中 `#include`\
  \ 另一个文件几乎总是错误的。还有其他罕见的情况，例如协变返回类型，在这些情况下包含头文件可能是合理的；幸运的是，只要你严格遵守组件属性 1（`[第 6.1 节]`⁸⁰），编译器总是会警告你此类情况。\n\
  \n**定义：**\n\n*传递包含*（transitive include）意味着客户端依赖一个头文件来间接包含另一个头文件。\n\n**设计规则：**\n\n\
  一个组件对另一个组件的任何*直接*实质性使用，要求相应的 `#include` 指令*直接*存在于客户端中（在 `.h` 或 `.cpp` 文件中，但不同时都存有），除非内在的编译时依赖暗示了间接包含。\n\
  \n**推论：**\n\n不允许传递包含，但访问类型的公共基类除外。\n\n一如既往，尽管我们建议避免依赖于仅仅是特定实现细节的产物的行为，但这并不能免除我们这一重要责任。因此，依赖一个组件头文件来间接包含另一个头文件（我们称之为*传递包含*）很少是明智之举。在\
  \ `[图 2-41]` 中列出的所有在头文件中正确包含头文件的常见情况下，只有 Is-A —— 即如 `[图 2-43]` 所示的特定的*公共*继承 —— 提供了足够的指示，表明所需的\
  \ `#include` 指令必然存在于包含的头文件中。\n\n![](img/fig2-43.jpg)\n\n**图 2-43：公共继承意味着内在编译时依赖。**\n\
  \n在所有其他情况下，组件的微小变化都可以消除其在高层组件头文件中嵌套对低层组件包含指令的需求。对于私有继承或 Has-A，高层组件实现上的微小变化就可以消除其在其头文件中包含低层组件头文件的所有任何需求。例如，鉴于\
  \ `[图 2-44]` 中的 `Point` 未在接口中使用，任何对它的依赖都可以被完全移除，并替换为一对原始整数，而不会对逻辑（程序可访问的）接口产生任何变化。\n\
  \n![](img/fig2-44.jpg)\n\n**图 2-44：在实现中使用（例如 Has-A）永远不是内在的。**\n\n\n\n\n即使 `Point`\
  \ 被用于接口，也并不难通过将“Has-A”关系替换为“Holds-A”（section 1.7.4）来 `insulate`（隔离，参见 section 3.11.1)）的使用，并将接口中任何接受或返回\
  \ `Point` 的 `inline` 函数（Figure 2-41c）替换为非内联函数。任何没有直接包含低级组件头文件的这两个组件的客户端将被强制 `rework`\
  \ 它们的代码。因此，对于任何仅为了实现目的而被另一个组件包含的组件头文件，都不能依赖其包含该（低级）头文件。\n\n`Uses-In-The-Interface`\
  \ 等逻辑关系也 `not` 不以证明对嵌套包含的物理依赖是合理的，即使类型是一个枚举（Figure 2-41d）或对显式模板特化的 `typedef`（Figure\
  \ 2-41e），这些类型在历史上无法（或在 C++11 中不应该^(81)）在本地声明。正如 Figure 2-45 所示，即使是微小的接口修改，例如将枚举返回类型替换为\
  \ `int`（通常是一个好主意），或将一个很少使用的非原始函数提升到另一个更高级（例如工具类）组件（参见 section 3.2.7），也可能消除物理依赖，并消除嵌套的\
  \ `#include` 指令——同样只要遵循这一规则，客户端代码可能只需要（如果完全不需要）重工作。\n\n^(81) 从 C++11 开始，枚举与 `static`\
  \ 数据一样，不应在本地声明，以避免由于外部绑定导致类型不匹配（section 1.3.4）。\n\n![](img/fig2-45.jpg)\n\n**图 2-45：即使是\
  \ Uses-In-The-Interface 并不一定是内在的。**\n\n因此，除了公共继承外，每当一个组件实质上使用另一个组件提供的功能时，它也应该始终\
  \ `directly` 直接包含该组件的 `.h` 文件。\n\n### 设计 {\n\n**不允许组件之间存在循环物理依赖。**\n\n根据定义，组件是物理聚合的最小单元，所有物理聚合的允许依赖必须是无环的（section\
  \ 2.2.24）。如果编译、链接甚至测试其中任何一个组件都需要另一个的存在，则这两个组件是循环依赖的。\n\n例如，假设我们有两个组件 `xyza_array1`\
  \ 和 `xyza_array2`，它们都定义了一个表示任意类型数组的自定义类型——唯一的区别在于包含对象的内存组织方式：原地与异地^(82)。现在假设这两种数组类型中的每一种都提供了一个从另一种类型转换的构造函数。也就是说，类\
  \ `xyza::Array1` 中有一个接受 `const xyza::Array2` 引用的构造函数，反之亦然。注意 Figure 2-46a 所示的隐含循环的\
  \ `#include` 指令恰好直接位于这些组件的 `.h` 文件中。将 `#include` 指令移动到相应的 `.cpp` 文件中（Figure 2-46b）会从客户端的角度影响这种耦合的性质——即使其变为链接时而非编译时（参见\
  \ section 3.10）——但没有任何办法可以缓解相互的物理依赖（section 1.8）。^(83)\n\n^(82) 虽然 `xyza::Array1`（如\
  \ `std::vector`）提供了对包含元素的最优访问，但 `xyza::Array2` 在访问数组元素时通过增加额外的间接层，换取了在对重量对象类型进行任意\
  \ `insert` 和 `remove` 操作时性能的显著提高，并且在底层数组调整大小或索引位置发生变化时也能保留给定数组元素的地址。\n\n^(83) 在（循环的）`#include`\
  \ 之后这个看似冗余的类声明是必要的。尝试像此处这样省略此代码将导致无限递归。添加必要的内部 `#include` 保护（section 1.5.2）将管理递归，但现在，如果没有这个不受保护的前向类声明，当我们编译\
  \ `xyza_array2.cpp` 时，它将 `#include xyza_array2.cpp`。\n\n\n\n\n模块化编程最基本且广为人知的原则之一，是将每个低级设计决策隐藏在单一、清晰且定义良好的接口之后。这并非巧合，人们观察到可能一起的代码应该在系统中的物理位置上相互靠近（参见第\
  \ 3.3.6 节）。组件作为我们逻辑和物理设计的根本单元，其作用是封装并隐藏这些低级细节。逻辑和物理模块化的一致，使得组件的新版本能够独立于任何其他组件替换之前的版本（参见卷\
  \ II，第 5.5 节）。请注意，通过使用受保护（protected）访问暴露实现细节同样存在类似的问题（参见第 3.11.5.3 节）。\n\n考虑图 2-49\
  \ 中的 `xyza_hashtable` 组件。`xyza::HashtableIter` 类提供了对给定 `xyza::Hashtable` 对象中所有键值对的只读访问。`xyza::HashtableManip`\
  \ 类除了迭代外，还提供了从可修改的 `xyza::Hashtable` 中选择性删除条目的能力。迭代器和操作器的实现自然会受到容器私有细节的强烈影响（如果存在依赖，参见第\
  \ 1.7.4 节）。显然，所有三个类都共享私有细节的知识，因此应该封装在一个单一原子模块（即组件）中。在这种现代迭代器模式中（在第 1.7.4 节阐述），`xyza::HashtableIter`\
  \ 和 `xyza::HashtableManip` 的构造函数都被声明为私有，且每个类都声明 `xyza::Hashtable` 为友（friend）。\n\n\
  ![](img/fig2-49)\n图 2-49：`xyza_hashtable` 的逻辑视图\n\n为了论证，考虑将这些类分别放在不同的组件中，如图 2-50\
  \ 的组件/类图所示。现在，即使是对 `xyza::Hashtable` 实现细节的表面上兼容的更改，也可能迫使一个或两个低级组件发生相应的更改。同样，对 `xyza::HashtableIter`\
  \ 或 `xyza::HashtableManip` 的私有实现（例如私有构造函数）进行任何更改，都直接破坏高层组件中的容器，除非该容器也同步更新。\n\n![](img/fig2-50)\n\
  图 2-50：“远距离”（即跨组件）友谊（错误的！）\n\n授予非本地实体私有访问权限往往会导致意外的严重缺乏灵活性和不必要的开销。“特权”软件的物理距离越远，负担越重。仅可维护性就足以证明将迭代器与其容器放在一起，但请考虑到，每当高层组件中的对象具有私有的可修改访问权限时，我们就失去了按分级测试低层组件的能力（参见图\
  \ 2-79）。\n\n为独立组件中的类提供友元访问，恰恰使得一个具有相同名称的恶意实现很容易无意中获得（或窃取）特权访问。通过坚持私有访问不超出组件边界，我们能够用组件契约的一个有效实现（参见卷\
  \ II，第 5.5 节）替换另一个——而不考虑其他每个组件的私有细节。不出的是，这种确保细粒度物理替换性的理念是我们方法论中最基本的原则之一 (lakos96)，第\
  \ 3.6.2 节，第 144–146 页)。\n\n### 除非有工程上的理由，否则每个组件只包含一个类。\n\n组件的大小、复杂性以及整体质量影响我们有效理解、维护和测试它的能力（参见卷\
  \ III，第 7.3 节）。此外，保持细粒度的物理结构（第 0.7 节）有助于我们最小化物理依赖并促进独立重用。因此，我们力争限制任何给定组件中的类数量（理想情况下为一个），除非有令人信服的工程理由说明如此。如果将类放在不同的组件中会导致\
  \ (1) 远距离（即跨组件）友谊，或 (2) 循环物理依赖（这在实践中很少出现），则共同定位的需求就会表现出来。因此，我们必须避免任何可能包含大型或（更糟糕的是）无边界的紧密耦合类簇的设计（参见第\
  \ 3.9 节）。\n\n所有已知的类类之间循环的用例都涉及相互编译时递归（参见卷 II，第 4.5 节）。我们始终倾向于无环的逻辑解决方案——例如参见图 2-54，第\
  \ 2.7.4 节。\n\n对于在包-命名空间范围内定义的外部可见类（相对于组件私有类，参见第 2.7.1 节）进行共同定位的其他两个工程原因，与前两个（主要）标准一起，在\
  \ 3.3.1 节中进行了讨论。\n\n在本节中，我们展示了几个重要的、客观验证的设计规则，这些规则使得我们的软件在可测量范围内更易理解、可测试和可维护。每个组件至少有一个\
  \ `.cpp` 文件（可能更多），但始终恰有一个 `.h` 文件，所有文件具有相同的根名称。这些文件共同满足第 1 章中描述的组件的四个属性（第 1.6 和\
  \ 1.11 节）：(1) 在 `.cpp` 文件中首先使用角括号 `<>` 而非双引号 `\"\"` 包含 `.h` 文件；(2) 在 `.h` 文件中声明所有外部链接定义；(3)\
  \ 绝不在声明它们的组件之外定义外部链接结构；以及 (4) 仅通过 `#include` 指令访问其他组件的功能，同样使用角括号 `<>`。\n\n例如，我们可能会为给定的组件选择多个（同名的）`.cpp`\
  \ 文件，以便使静态链接程序拉入少于所需组件全部的对象代码（参见第 2.2.12 节）。记住，组件的 `.cpp` 文件以及由静态库归档文件 `.a` 等组成的生成的\
  \ `.o` 文件在架构上并没有意义（第 1.2.6 节）。我们编写在定义 `main` 的文件之外的每个逻辑结构——即使是为单个应用程序编写的代码——都属于适当组件，包括枚举和协议（传统上不需要任何外部链接定义）。我们要求\
  \ `.h` 文件能够孤立编译，但我们尽量减少组件头文件中 `#include` 指令（以及本地类声明）的数量，除了公共继承外，我们绝不依赖于不安全的传递包含。\n\
  \n\n\n\n\n组件之间存在循环物理依赖（编译时或链接时）既是不必要的也是不恰的。远距离友好——即允许跨越任何物理（例如组件）边界的私有访问——也是被禁止的，因为这种访问会破坏一个符合要求的组件实现被另一个实现取代的独立可替代性。最后，在没有迫切工程理由（其中最常见的是“友谊”关系）的情况下，我们力求避免在一个组件内包含多个一个（公共）类。\n\
  \n## 2.7 组件私有类与从属组件\n\n我们基于组件的方法的一个显著优势是层次化复用（见第 0.4 节）。为了最大化这一获处，我们希望避免将那些在其他上下文中可能证明价值的稳定实现细节设为私有。然而，确实存在不建议进行层次化复用的情况。本节将讨论此类（罕见）情况。\n\
  \n### 2.7.1 组件私有类\n\n回想第 0.7 节，我们认为组件是设计的基本的原子单元。通常情况下，我们希望编写的每个组件都提供一个或（在理由充分）多个（见第\
  \ 3.3.1 节）命名恰当的类或单一工具 `struct`（见第 3.2.8 节），每个类都旨在是稳定的，并且可以从定义的组件外部直接使用。然而，在某些情况下，我们希望定义组件内部使用的类，这些类可能是该组件的不稳定的实现细节，并且（至少目前）不适合直接公开。因此，我们希望将此类类标记为其定义组件的\
  \ `private`，从而无法从其外部直接使用。^(89)另一个相关主题——从属组件，将在下文中讨论（见第 2.7.5 节）。\n\n^(89) C++ 模块（C++20）的引入可能导致比经典翻译单元提供更好的组件私有类实现——例如，关于*传递包含*（第\
  \ 2.6 节）。\n\n**定义：**\n\n**组件私有类（或 `struct`）是在包命名空间作用域（packagenamespace）定义的类，它不能被位于定义组件外部的逻辑实体直接使用。**\n\
  \n### 2.7.2 存在多种竞争性的实现方案\n\n防止类在声明它的组件外部使用的有多种方法，每种方法都有其相应的优缺点。^(90)一种可能性是将类完全隔离在\
  \ `.cpp` 文件中（例如在匿名命名空间内），这在可行时^(91) 通常是首选的。C++ 语言还提供了声明 `private` 类的显式语法。然而，我们发现将类嵌套（至少目前）在另一个类内部会产生不良的后果，正如我们即将展示的那样。\n\
  \n### 2.7.3 下划线的常规用法\n\n**设计规则：**\n\n**避免在逻辑名称中纯粹将下划线作为分隔符，除非按照需要：(1) 作为有效的分隔符（例如，在全大写单词之间）或\
  \ (2) 为了名义内聚（例如在*从属*组件中）。**\n\n在我们的方法中，我们专门选择使用 `_` 字符用于 `UpperCamelCase` 或 `camelCase`。我们使用\
  \ `_` 前缀来清晰地表达静态常量的性质。\n\n**设计规则：**\n\n**在组件头文件中以包命名空间作用域声明的逻辑实体，如果其名称包含额外的下划线——除非按照需要：(1)\
  \ 作为有效的分隔符（例如，在全大写单词之间或作为前缀/后缀的一部分），或 (2) 为了名义内聚（例如在*从属*组件中）——则被视为定义它的组件的局部的，且不能从外部访问；到（第一个）额外下划线为止的小写名称必须与组件的基础名称完全匹配。**\n\
  \n任何自由包含额外下划线的名称——纯粹根据惯例——被视为定义它的组件的 `private`，且不能被该组件外部的任何逻辑结构直接使用。回想第 2.4.7 节，组件的*基础名称*是组件名称中分隔包前缀的下划线的部分，通常与在该组件头文件中包命名空间作用域定义的主类的小写名称匹配。\n\
  \n如图 2-51 所示，我们可以使用这一惯例来避免在主类（如 `List`）的词法作用域内声明私有辅助类（如 `Link` 或非平凡的迭代器），而是将它们声明在包命名空间作用域中，就像其他所有类一样。^(93)\n\
  \n^(93) 我们选择将组件本地类名的首字母大写，以与我们通用于渲染类型命名的 `UpperCamelCase` 惯保持一致；注意，定义本地类的组件通常也会定义一个名称与组件基础名称完全匹配的公共类。\n\
  \n![](img/fig2-51.jpg)\n\n**图 2-51：采用组件私有类的示例（好主意）**\n\n**指南：**\n\n**避免在其所在类的词法作用域内*定义*嵌套类。**\n\
  \n\n\n\n\n当需要从嵌套类定义的组件外部进行编译时访问时，我们发现，在单个父类的词法作用域内渲染多个层级的公共和私有访问在理解上是难以接受的，正如图 2-52\
  \ 所示。除了最微道的情况外，我们极力避免在另一个类的词法作用域内*定义*类。\n\n![](img/fig2-52.jpg)\n\n**图 2-52：使用嵌套类示例（坏主意）**\n\
  \n### 指南\n\n**完全避免声明嵌套类。**\n\n在适宜的情况下刻意避开一种可以强制封装的有用语言特性，起初看起来似乎是错误的。然而，这样做有超越 C++\
  \ 语言本身的、正当的软件工程理由。^(94) 我们认为，将所有非平凡类保持在相同的深度——正如我们对待组件、包和包组的那样——能够显著提高人类认知。鉴于我们已经采用组件而非类作为逻辑和物理设计的根本原子单元（第\
  \ 0.7 节），我们已经获得了像处理友元（friend）一样将封装扩展到组件边界的自由，从而消除了经常由嵌套类产生的所有不必要的复杂。^(95)\n\n^(94)\
  \ 一如既往，我们专注于底层目标，并使用（在必要时创建）正确的工具来实现这些目标。某种语言特性为了特定目的而设计并不意味着其使用是恰当的。另一方面，任何在没有提供有力理由和通用更好替代方案的情况下完全禁止使用特定\
  \ C++ 构造编码标准，如果不是错误的，可能也是过分的。\n\n^(95) 根据我们 BDE 团队较新的成员之一（约 2018 年加入）以及模块专家 Nathan\
  \ Burgers 的说法，“新的模块特性（C++20 起可用）通过其导出机制提供了创建组件私有类的能力。模块可以导出一个类（供导入者使用），也可以不导出某个类以使其对导入者隐藏（从而实现真正的组件私有化）”（通过个人交谈）。\n\
  \n早在在 C++ 语言支持嵌套类的正向声明之前，^(96) 我们已经成功地在逻辑名称中使用额外的下划线约定——例如，实现完全隔绝的混凝土类^(97)（参见第\
  \ 3.11.6 节）。即使现在已经有了普遍可靠地正向声明嵌套类的能力，这样做仍然存在巨大的缺陷。与我们提倡的传统的（名义上独立的）组件私有同级类不同，每个嵌套类（包括公共和私有的）都会自动访问其所属类的私有细节，如图\
  \ 2-53a 所示。^(98) 在我们的方法论中，我们发现这种私有访问永远是不需要的，因为它鼓励了父类和嵌套类之间紧密的循环依赖（我们将在下文中详细讨论）。此外，C++\
  \ 语言不允许我们在编译器看到该嵌套类的定义之前，在父类中定义该嵌套类的实例，因此不仅需要其声明，还要求其定义必须存在于父类的词法作用域内（图 2-53b）。最后，使用私有嵌套类型意味着文件作用域的\
  \ `static` 辅助函数，以及组件 `.cpp` 文件中匿名命名空间内定义的所有构造，都无法得知、不用说处理私有嵌套类型（图 2-53c）——这种特权专门保留给所属类的成员和友元。\n\
  \n^(96) 参见 [stroustrup94**，第 13.5 节，第 289–290 页。\n\n^(97) 参见 [lakos96**，第 6.4.2\
  \ 节，第 398–405 页，特别是图 6-51 第 403 页的 `Example_i`。\n\n^(98) 注意，与某些其他流行语言不同，C++ 中嵌套类对象的构造函数*不会*自动获得其所属对象的指针。\n\
  \n![](img/fig2-53a.jpg) ![](img/fig2-53b.jpg) ![](img/fig2-53c.jpg)\n\n**图 2-53：私有嵌套类的不理想“特性”**\n\
  \n使用我们方法论的额外下划线约定，（非嵌套的）组件私有 `Wrapper_Imp` 类可以在组件内部像任何其他类一样被处理：它 (a) *没有*被自动授予访问任何其他类的权限，(b)\
  \ *可以*用于在父类内定义嵌套对象，并且 (c) *可以*自由地限制在 `.cpp` 文件中——因此不需要对应的 `.h` 文件中声明（第 1.6 节) 注意，完全局部于\
  \ `.cpp` 文件的类可以利用这种额外的下划线约定来实现内部链接（第 1.3.2 节），因此不需要在 `.h` 文件中声明。将一个类位于另一个类内部会对其父类增加多余的访问，这本身往往降低可读性，只会让情况变得更糟。\n\
  \n^(100) 我们将受保护嵌套类的建议性留给读者的想象空间。\n\n#### 2.7.4 使用组件私有类的经典示例\n\n考虑在单个组件内实现容器及其 STL\
  \ 风格迭代器的实用示例。图 2-54a 展示了一个让容器及其迭代器产生循环依赖的实现，尽管这不是错误的，但我们从风格角度认为它们是次优的。我们认为，避免逻辑循环——即使在单个组件内部——既能提高清晰度，引导开发者以更符合物理逻辑的方式进行思考。如图\
  \ 2-54b 所示，使用组件私有类，我们可以实现组件，使得该组件内定义的类之间不会隐含循环的物理依赖（第 1.9 节）。\n\n\n\n\n\n注意，在图 2-54b\
  \ 中，我们选择将迭代器类 `Container_Iterator` 定义为组件私有（component-private），以便它仅通过其惯例的嵌套 `typedef`\
  \ 别名 `iterator` 从组件外部使用。我们本也可以可以将迭代器类定义为可直接访问（例如 `ContainerIterator`）；然而，这样做会不必要地暴露实现细节（例如它的名称，以及它是一个用户定义类型而非基本指针类型），从而阻碍了某些（重）实现方案（例如重命名或将其更改为\
  \ `Container::value_type *`）。\n\n同样请注意，我们似乎冗余地将迭代器的构造函数声明为 `private`，并将 `Container`\
  \ 设为 `friend`（友元）——尽管唯一的构造函数参数 `Container_Guts *` 的类型本身就是指向组件私有类的指针。首先，考虑到这些额外的约束与预期的用法一致，并起到了记录以及强制容器与其迭代器之间通常共享的单一逻辑封装单元的作用。虽然在这个示例中可能并不合适，但我们可以很容易想象一种设计：将\
  \ `Container_Guts` 类替换为更具重用性的数据类型并将其公开，甚至可能将其移动到自己的组件中，在这种情况下，私有构造函数和友元关系将是绝对必须的。\n\
  \n最后，考虑到依赖组件私有类来实现同一组件内其他（公共）类之间的逻辑封装，是那种极不希望的做法的远房亲戚，后者是指通过隐藏头文件来实现跨独立组件的类之间逻辑封装的这种做法（参见第\
  \ 3.9.7 节）。因此，从风格上考虑，我们避免通过公共嵌套别名之外在组件的公共接口中暴露私有类型——例如如图 2-54b 中的 `iterator`。(101)\n\
  \n类似的规则可能适用于 (C++20) 模块中定义的未导出类型。\n\n将此类问题进一步推进，假设某些组件内部存在多个独立的“公共”类，每个类都使用同一个私有辅助类。为了使用\
  \ C++ 的嵌套类功能将该类隐藏从组件外的潜在客户端，我们必须在多个公共类型中的一个（可能任意地）声明该类型，导致所有其他公共类型现在人为地 (1) 依赖于该类型，并且\
  \ (2) 对其具有私有访问权限。这种不幸的依赖和友元关系虽然是“合法”的（第 2.6 节），但并不是最优的。相反，我们可以创建另一个没有公共方法的公共类，其唯一目的是隐藏我们的实现类型，然后要求这个可疑的额外类成为组件内所有其他感兴趣类的友元，但何何大此费力呢？如图\
  \ 2-55 所示，在共享组件私有类的逻辑名称中额外使用下划线的惯用方法，能更有效、更通用地解决这个问题以及所有其他相关问题。(102)\n\n注意选择*不*让任何公共类与基名称完全匹配，如何强调了我们的设计意图，即不在逻辑上将组件私有类与公共类中的任何一个关联；另请参见第\
  \ 3.3.3 节。\n\n![](img/fig2-55.jpg)\n\n**图 2-55：说明组件私有类的通用优势**\n\n#### 2.7.5 从属组件\
  \ (Subordinate Components)\n\n我们还观察到，在少数情况下，特别是需要实现某些外部指定的接口时（例如 C++ 标准库），尝试将所有供向外的组件专门使用的源代码都放在该组件中可能并不是最优的，但我们也不想鼓励对“低于公共”的组件进行无限制的直接访问——即使在单个包内也是如此。因此，我们发明了*从属组件*（subordinate\
  \ component）的概念。\n\n**定义：**\n\n*从属组件*是指不能被除明确指定为其从属的组件（位于同一包内）之外的任何组件直接 `#include`（或使用）的组件；一个组件最多从属于一个非从属组件。\n\
  \n由于我们可以指定如何将一个组件指定为另一个组件的*从属*，本着复用 C++ 关键字的精神，我们选择重载下划线（`_`）字符来实现此目的。\n\n**设计规则**\n\
  \n基名称中带有下划线的组件 `c` 保留用于表示该组件*从属于*另一个组件（在同一包内），该组件的名称是直到 `c` 基名称中下划线处（但不包括）的前缀。\n\
  \n任何基名称包含下划线的组件（例如 `xyza_base_name`）——同样，纯粹惯例——被认为从属于同一包内的一个组件（例如 `xyza_base`），该后组件的名称与其基名称中下划线之前的字符完全匹配（并如图\
  \ 2-56a 所示）。\n\n![](img/fig2-56.jpg)\n\n**图 2-56：说明从属组件的语法用法**\n\n注意[ch02.xhtml_ch02fig56]中的表述允许组件基名称具有多个下划线的可能性（例如\
  \ `xyza_base_name_imput`），从而允许其“祖父”组件（`xyza_base`）直接包含“孙级”组件（`xyza_name_guts`）。最后，注意，从属组件内的组件私有类——例如\
  \ `xyza_name` 中的 `xyza::Base_Name_Util`——无法在相应组件之外直接访问（即使对于 `xyza_base`）；然而，拥有（非组件私有的）名称\
  \ `xyza::BaseNameUtil` 的类是可以的，但仅对于 `xyza_base`。\n\n如前所述，指定从属组件的“额外下划线”惯例最常用于组件规范不受我们控制的情况，并且无法或无法使所需的实现和或测试设备变得稳定/可重用。在测试像\
  \ `std::unordered_map` 这样高度编译时的复杂容器时，可能会出现这种紧密的依赖。因此，我们将独立测试提取。因此，我们可能考虑根据相关平台命名从属组件（可能是分层组织的）：\n\
  \n```\nbdlmt_threadpool\nbdlmt_threadpool_win32\nbdlmt_threadpool_win64\nbdlmt_threadpool_unix32\n\
  bdlmt_threadpool_unix32_sun\nbdlmt_threadpool_unix32_hp\nbdlmt_threadpool_unix32_ibm\n\
  bdlmt_threadpool_unix32_linux\nbdlmt_threadpool_unix64\nbdlmt_threadpool_unix64_sun\n\
  bdlmt_threadpool_unix64_hp\nbdlmt_threadpool_unix64_ibm\nbdlmt_threadpool_unix64_linux\n\
  ```\n\n我们使用这种方法最初实现了 C++11 风格的原子操作。另请参见第 3.3.8 节。\n\n#### 2.7.6 节小结\n\n\n\n\n\n\
  总结来说：某些情况下，辅助类的接口是不稳定的，并且可能会在不通知的情况下发生变化。为了提高可读性、灵活性和统一性，同时避免上述嵌套类的缺点，我们继续保留在包命名空间（package-namespace）作用域内声明的逻辑名称中使用下划线，以表示组件私有的结构；相反，我们更倾向于直接在包命名空间作用域内声明每个“辅助”类，从而避免使用除极少数嵌套类之外的所有嵌套类和\
  \ `struct`。同样，我们保留在组件基名称中使用下划线，以表示它不仅对于其所在的包是局部的，而且对于以单个公共访问组件为根的唯一组件树是私有的，并且不能被其所属组件以外的任何组件（包内）包含/使用。\n\
  \n## 2.8 包（Package）\n\n一个大型程序可能跨越多个开发人员、几层管理，甚至是多个地理位置。我们系统的物理结构不仅反映了应用程序的逻辑结构，还反映了实现它的开发团队的组织结构。大型系统需要的单个组件分级层次结构所能实现的物理组织。为了涵盖更复杂的功能，我们需要在更高抽象层次上利用物理设计单元。我们从比组件大的物理抽象最小单元开始，在我们的方法中将其简称为\
  \ `package`。\n\n### 2.8.1 使用包来重构子系统\n\n从最高层级设计系统时，几乎总会有可以作为独立单元讨论的大型部分。考虑图 2-57\
  \ 所示的大型语言（如 C++）解释器的设计。所描述的每个子系统可能都太大、太复杂，无法恰当地放入单个组件中。这些较大单元中的每一个（在图 2-57 中用“双线框”表示）必须实现为一组可分级的组件。^(103)\n\
  \n^(103) 我们确实允许可能：一个或多个包不遵循我们基于组件的方法（参见第 2.12 节）。\n\n![](img/fig2-57.jpg)\n\n**图\
  \ 2-57：高级解释器架构**\n\n图 2-57 中这些较大单元之间的依赖关系代表了构成每个子系统的组件依赖关系的聚合。例如，运行时数据库是一个独立的子系统；它对标准库或其他通用可重用库中的组件以外的组件没有依赖。解析器、评估器和格式化子系统中的每个组件都依赖于运行时数据库中的一个或多个组件，但这三个并行子系统中的任何组件都不依赖于另外两个系统中的任何组件。顶层解释器由组件组成，这些组件依赖于三个并行子系统的每一个组件（甚至可能直接依赖于运行时数据库中的组件）。\n\
  \n在将项目的开发工作分配给多个个人、开发团队或地理位置时，将系统仔细划分为大单元，然后考虑这些单元之间的聚合依赖关系至关重要。虽然我们不会将图 2-57 所示子系统的开发表描述为一个大型项目，但它可以很容易地分配给多一个开发人员。这种组件的自然划分使得几个开发人员并发工作该项目变得相对简单。在运行时数据库设计完成后，将有机会启动三个并发开发工作分别开始解析、评估和格式化功能的工作。一旦这些部分开始就位，第四个开发人员（或团队）对顶层解释器的实现和测试就可以全面进行。\n\
  \n请记住，`package` 是一个在架构上具有重要意义的（即全局可见的）物理设计单元，用于在比单个组件更高级的层次上聚合逻辑内容（参见图 2-9b），第 2.2.17\
  \ 节）。`package` 也是一种使相关组件在名义上内聚的手段（参见第 2.4.5 节）。通过这些方式，包允许设计人员直接在源代码中捕获并反映仅通过组件无法表达的重要架构信息。现在让我们重新引入\
  \ `package` 术语——除非显式指定为不规则的（参见第 2.12 节），否则它表示逻辑和物理上内聚的组件集合。\n\n**定义：**\n\n**`package`\
  \ 是一个架构上具有重要意义的组件集合，1) 被组织为一个物理内聚单元，并且 (2) 共享一个公共包命名空间。**\n\n一个典型的包包含一组组件，这些组件组织作为单个发布单元的一部分，其逻辑结构在共同的（唯一的）包命名空间内（通常在企业命名空间内）定义，共同服务于一个聚焦的语义目的。`package`\
  \ 可能由一组松耦合的低级、可重用组件组成，例如 `C++ 标准库`。^(104) 或者，一个 `package` 也可能体现一个仅供单个客户端使用的特殊用途子系统。无论何种方式，设计良好的\
  \ `package` 都封装了一个内聚的组件集合，以履行某些聚焦的任务。\n\n^(104) 注意，C++ 标准库最初设计时并未考虑我们的组件定义或严格避免循环依赖。\n\
  \n系统部分作为单元被重用的程度在重构子系统时也起着作用。在图 2-57 的示例中，运行时数据库可能广泛使用，而三个并行子系统只使用一次。即使运行时数据库与子系统的其他部分相比很小，将此低级功能放在单独的\
  \ `package` 中也是合理的，以避免将其可重用功能与任何其他不常用的功能捆绑（例如，参见图 3-60），第 3.5.6 节。\n\n封装也反映了开发组织。通常，一个\
  \ `package` 由单个开发人员或团队拥有/编写。`package` 内部变化的影响所有者可以很好地理解并以一致有效的方式处理。跨包边界的变化通常会影响其他开发团队并可能产生巨大的破坏性。因此，我们努力将子系统内部可能变化的紧密耦合或协作部分定位在单个\
  \ `package` 中（参见第 3.3.2 节），并在理想情况下位于单个组件中（参见第 2.7.1 节），或者在失败的情况下，位于从属组件层次结构中（参见第\
  \ 2.7.5 节）。\n\n\n\n\n包的开发视图的物理结构在设计上与所有其他包完全相同——无论它恰好是某个包组的成员（参见第 2.9 节）。在历史上，我们将每个包表示为文件系统中以包名命名的目录。图\
  \ 2-58a 展示了我们（假设的）隔离 `evaluator` 包内容的顶层布局。^(105,106) 每个包含组件的源文件与其相关的组件级测试驱动程序并列存在（见第三卷，第\
  \ 7.5 节），如图 2-58b 所示。\n\n^(105) 注意，隔离包的名称长度至少为七个字母数字，或者以其他方式与所有分组包的名称区分开来（第 2.4.11\
  \ 节）；参见第 2.10.3 节。\n\n^(106) 隔离包比分组包需要的深思较少（参见第 2.9 节），并且容易过度使用。在审阅本书的早期草稿时，David\
  \ Sankel 认为：\n\n> 在实践中，隔离包是有问题的：我们倾向于拥有过多的包，导致系统变得难以理解。一个初始仅包含一个包的包组不应该被回避。\n\n\
  ![](img/fig2-58.jpg)\n\n**图 2-58：独立包（`evaluator`）的物理布局**\n\n与组件和测试驱动程序源代码处于同一级还有四个标准子目录：`doc`、`include`、`lib`\
  \ 和 `package`。`doc` 和 `package` 子目录分别包含包级文档（见第二卷，第 6.15 节）和元数据（参见第 2.16 节），描述了下文讨论的对其他\
  \ UOR（用户定义单元）的允许依赖。^(107) 在开发阶段和部署期间对 `include` 和 `lib` 子目录的使用，将在第 2.15.3 节中进行进一步讨论。\n\
  \n^(107) 注意，对于分组包，这些依赖通常仅限于该 UOR 内其他包的名称（参见第 2.16 节）。\n\n包内组件之间依赖关系所隐含的层级结构，与包的硬性分层（例如组内部）相比，是一个明显更且更具塑性的概念。在某些情况下，我们可能会选择在包内部施加额外的*内部*（即对架构没有意义的）聚合组件结构（参见第\
  \ 2.11 节）；然而，试图通过子目录在包的物理结构中反映所有单个组件的依赖完全是一个坏主意。^(108)\n\n^(108) 注意，有时可能希望在包上创建一个“视图”，该视图包含正在开发的组件、其测试驱动程序，以及被测试组件（直接或以其他方式）依赖的包本地组件（但不包括测试驱动程序），以确保在嵌入的\
  \ `#include` 指令显式允许之外没有意外的物理依赖（参见第 2.15.5 节）。\n\n在符号表示上，我们如图 2-59a 所示所示表示包——双框反映了物理聚合的第二个架构意义层级。我们原子化地表示包依赖，如图\
  \ 2-59b 所示。也就是说，如果包中的任何组件依赖于某个项，整个包也依赖于它。反之，如果某个项依赖于包内的特定组件，我们假设该实体依赖于包中的所有内容。尽管静态库的粒度性质使得包之间的实际物理依赖远非原子化（第\
  \ 1.2.2 节），但该技术可能不是我们部署时使用的（参见第 2.15.9 节）。通过元数据（参见第 2.16 节），我们甚至能够对包的允许直接依赖限制为包内的一个或任意子集，但尽管如此我们必须假设该实体依赖于整个包。因此，我们进行设计时假设依赖是原子的。\n\
  \n![](img/fig2-59.jpg)\n\n**图 2-59：包符号表示**\n\n因此，包间依赖的细节通常在依赖图中省略。\n\n### 设计规则\n\
  \n**每个包预期的允许（直接）依赖必须显式说明。**\n\n作为一个初始的启发性示例，考虑一个高性能引擎，例如用于交易的引擎。一个设计良好的交易引擎将是一个独立的子系统，提供高性能但词法中立的编程接口。任意应用程序或库都可以直接使用该交易引擎，而无需词法解释。同样，可以设计出许多面向人类的接口来控制引擎——其中任何一个并不比另一个更特殊。\n\
  \n在我们认真考虑实现之前，我们知道解析器将依赖于引擎，可能还依赖于完全独立的文本处理工具。我们还知道实现引擎的组件不会依赖于解析器包内的任何内容，更不用说通用的底层解析工具库了。为了让这些架构级别的意图清晰，我们在事先（在相应的\
  \ `package` 子目录中）说明我们的第一个交易解析器包 `tparse1` 允许依赖于交易引擎包 `tengine` 和通用的解析工具包 `parseutil`，如图\
  \ 2-60 所示。\n\n![](img/fig2-60.jpg)\n\n**图 2-60：解析器、引擎和库之间的包依赖关系**\n\n\n\n\n图 2-61\
  \ 展示了 (a) 显式声明的 `allowed` 包依赖，以及 (b) 五个包中每个包的实际组件依赖。例如，图 2-61a 反映了架构师的意图，让包 `package1`\
  \ 和 `package2` 不依赖于任何其他包——即这些包都意图处于最低的本地层级^(109)（即第 1 级），因此它们必然是独立的（节 1.10）。\n\n\
  ^(109) 注意，与组件一样，包的层级（例如参见图 2-7,节 2.2.14）是相对于我们当前视图的。如果这些是孤立的包，那么它们每一个都构成一个发布单元（UOR），因此在整个物理层级结构中都有一个绝对层级。另一方面，如果我们查看的是包组内的包，则该组之外的所有包（和\
  \ UOR）都被认为层级为 0。在组内部，所有叶子包——即不依赖于该组内任何其他包的包——被定义为层级为 1。包组在节 2.9 中进行了详细讨论。\n\n![](img/fig2-61a.jpg)\
  \ ![](img/fig2-61b.jpg)\n\n**图 2-61：包之间直接的 `allowed` 依赖与实际依赖**\n\n根据图 2-61a 中的规范，`package3`\
  \ 中的组件允许直接依赖 `package1` 或 `package2` 中的组件。然而，如图 2-61b 所示，`package3` 的 `allowed`\
  \ 依赖已通过对 `package1` 的实际依赖实现，但尚未对 `package2` 实现；架构声明告知组件开发者，如果需要，他们是被允许（allowed）创建此类实际依赖的。但从物理角度来看，实际依赖是无关紧的：仅对\
  \ `package2` 的 `allowed` 依赖就会迫使 `package3` 处于第 2 级。是 `allowed` 依赖作为物理设计的规范；而实际依赖仅仅是受该规范支配的实现细节。\n\
  \n包的 `allowed` 依赖声明仅针对 `direct` 直接依赖，且不具有传递性。这意味着，如果包 `p3` 允许`directly` 依赖包 `p2`，且\
  \ `p2` 允许`directly` 依赖包 `p1`，并不意味着 `p3` 必然允许`directly` 依赖 `p1`。每个允许的 `direct` 依赖必须显式说明。注意，嵌套头文件（即被其他头文件包含的头文件）不构成直接依赖；当然，客户端需要访问所有此类头文件才能进行编译。\n\
  \n例如，图 2-61b 显示包 `package4` 和 `package5` 处于第三级。包 `package4` 允许直接依赖 `package3`，尽管为了让\
  \ `package4` 中的组件编译可能需要 `package1` 中的头文件，但不允许将位于 `package1` 中的组件头文件的 `#include`\
  \ 指令直接嵌入属于 `package4` 的组件源文件或测试驱动程序中。相比之下，图 2-61a 中的依赖规范允许 `package5` 直接依赖属于 `package2`\
  \ 以及 `package3` 的组件。^(110)\n\n^(110) 注意，尽管此处描述的抽象表示法默认情况下不是传递的，但传递性往往是人们所需要的。与其必须显式地提供所有传递依赖，不如在抽象的允许依赖规范中添加一个表示应应用传递性的简单标记，然后可以将任何特定的、不想要的依赖列入“黑名单”——例如：\n\
  \n```\nTRANSITIVITY = TRUE\n\n  package5: package3 package2\n\n  package4: package3\n\
  \n  package3: package1 package2\n\n  package2:\n\n  package1:\n\n  !(package4 :\
  \ package1)\n```\n\n不允许允许传递依赖的示例可能涉及对仅实现的包的依赖。还要注意，模块语言特性（从 C++20 开始可用）最终可能是一个更好的实现选择，因为它通过对\
  \ exports 的使用，可能在源代码本身中捕捉允许/不允许的直接访问。\n\n#### 2.8.2 包之间的循环依赖\n\n**设计强制**\n\n**根据其（显式声明的）`allowed`\
  \ 依赖定义的，包之间的循环物理依赖是不允许的。**\n\n如果两个或多个包的显式声明的 `allowed` 依赖形成循环，则它们就是循环依赖的，即使实际依赖并不如此。例如，图\
  \ 2-62 中三个包之间的 `allowed` 依赖导致了包级循环，尽管不存在组件级循环：`c_w`（在包 `c` 中）依赖于 `b_x`，后者反过来依赖于\
  \ `a_y`，后者依赖于 `c_z`。即使删除了 `a_y` 对 `c_z` 的依赖，显式授权此类循环本身也是违反的，因为它引入了 `a_y` 对 `c_z`\
  \ 的依赖。\n\n![](img/fig2-62.jpg)\n\n**图 2-62：循环的允许依赖**\n\n#### 位置、规模是首要考虑因素\n\n未能考虑组件所属是许多问题的根源。在我们的方法中，我们显式禁止将单个组件与包并列（节\
  \ 2.2.16）。然而，仅仅作为存放无关组件的容器来创建包可能糟糕。这种人为的或偶然的内聚^(111)（节 3.2）会产生没有清晰目的或共同逻辑属性的包，导致由于偶然而非故意设计的物理依赖，如图\
  \ 2-63 所示。\n\n^(111) booch94, “抽象的质量”，位于节 3.6 的第 136–138 页（特别是 137 页中间）\n\n![](img/fig2-63.jpg)\n\
  \n**图 2-63：包范围不精确**\n\n确定添加新功能合适的位置确实是一个挑战（参见节 3.1.4）。为了成功放置，必须同时满足逻辑和物理因素。即使意图良好，我们也经常观察到初级架构师在识别特定组件所属的新包范围时挣扎。\n\
  \n例如，考虑一个实现 Base64 编码/解码功能的组件^(112)此类组件可能会^(113)在 `struct` 内部（参见节 3.2.7）提供独立的纯函数，用于将任意数量的字节转换为字符字符串\
  \ `(char *)` 并反之，并且可能提供一个或多个额外的纯函数，例如，判断给定字符串是否为有效编码，或者作为输入字节数函数的编码字符串的最大大小。\n\n\
  ^(112) freed96, 第 6.8 节，第 24–26 页\n\n\n\n\n请注意，在实践中，此类编码器/解码器设计本质上是不可扩展的，因为整个消息必须作为一个块进行编码后才能发送（然后进行解码）。更健壮的方法是将编码器（和解码器）实现为一个有限状态机，它接受增量输入并产生增量输出。那么，所指的无状态“便利”函数就可以基于这些更强大的底层有状态机制轻松地实现。（提炼适当子功能模块是第二卷第\
  \ 6.4 节的主题。）\n\n暂不考虑封装问题，我们完全可以选择为此组件起一个像 `base64encoderutil` 这样长且具有描述性的名称，以 (1)\
  \ 刻画功能领域，并 (2) 强调其所实现的函数的无状态性质。即使有这种心态，缺乏经验的架构师仍可能倾向于将此类组件放在一个新的 `base64encoder`\
  \ 包中，如图 2-64 所示。\n\n![](img/fig2-64.jpg)\n\n**图 2-64：范围过于具体的包范围（坏主意）**\n\n除非编码器本身就是我们的业务，否则将整个包专门用于\
  \ Base64 编码器是荒谬的（就像将整个包组专门用于编码器一样，见第 2.9 节）。我们必须抵制形成过于具体的包的本能，特别是当我们考虑一个似乎不符合任何现有包特征的新组件时。这种关注点狭窄的包与我们实现*平衡*聚合（第\
  \ 2.2.17 节）的背道而驰，因为这种特殊性几乎保证了任何未来的组件（例如实现相关的编码）都不会适合此包：\n\nMacintosh binhex 4.0\
  \ (**faltstrom94**)，base85 来源于 Level 2 PostScript，而 yEnc 来自**(helbing02)**]。\n\n\
  ```\nBase85EncoderUtil\nBinhexEncoderUtil115\nUuEncoderUtil\nYencEncoderUtil\n```\n\
  \n请注意，在编码器工具类 `BinhexEncoderUtil` 的名称中，“BinHex”的“h”特意设置为小写，因为 `Binhex`（代表“BinHex”）作为修饰\
  \ `EncoderUtil` 的复合形容词。同样注意，诸如“FSM”（有限状态机）之类的缩写将被类似处理——例如 `FsmEncoderUtil`。更多关于工具类类型的信息，请见第\
  \ 3.2.7 节。\n\n鉴于 `Base64EncoderUtil` 是一种可重用的编码器，而且有很多潜在有用的低级编码器、加密器、翻译器等——它们本质上具有相同的（最小）物理依赖——我们可能会选择为所有的编码器和解码器创建一个包，并将其命名为\
  \ `encoder` (116)，其范围至少目前涵盖了所有此类编码器工具类。尽管此包最初可能只包含一个组件 (117)（`base64encoderutil`），但我们现在可以合理预期随着包的成熟，会有更多组件出现，如图\
  \ 2-65 所示。\n\n在我们的方法论中，孤独立的包名至少需要为 7 个字符，或者以单个字符后跟下划线开头——例如 `encoder` 或 `a_dc`（见第\
  \ 2.10 节）。\n\n在实践中，我们可能会将此功能实现为两个独立的组件——一个用于编码，另一个用于解码——解码器仅出于测试目的依赖编码器（见图 2-82e、第\
  \ 2.14.3 节；图 3-25、第 3.3.6 节；第二卷第 4.9 节；以及第三卷第 8.6 节）。\n\n![](img/fig2-65.jpg)\n\n\
  **图 2-65：范围合理的包范围（好主意）**\n\n软件划分为不同的包理想情况下应该对客户端来说是自然且直观的，特别是对于广泛重用的软件。将具有细微差异的逻辑或物理属性的相似组件隔离在不同的包中，会为重用带来障碍。在最坏的情况下，包名看起来几乎像是一个加密密码，用于解锁已由组件名完全勾勒的功能。即使有定义的标准，将紧密相关的组件分开——例如将实现某种类型的组件（见第二卷第\
  \ 4.1 节）与实现非原始的但广泛有用的（见第 3.2.7 节）“工具类”功能的组件分开——可能会让寻找功能变得不必要的困难。细致的封装应该有助于发现和理解提供的功能，而不是阻碍它。理想情况下，包名本身将是用于引用它所包含的凝聚集合的常用名称。一个设计良好的包通常由（（1）一个作为一个整体提供特定服务的子系统（例如日志设施），（2）一系列各服务相似功能的组件（例如内存分配器），或（3）一个解决某些通用抽象层的较大且松散相关的功能集合（例如\
  \ C++ 标准库）。\n\n#### 2.8.4 （唯一的）包前缀不可估量的通信价值\n\n最后，对具有架构意义的逻辑实体唯一的物理“地址”进行编码，远超可以被仅仅解释为“风格”。这种命名凝聚力迫使我们尊重逻辑名称所暗示的物理属性——这是仅凭命名规范无法实现的。鉴于在不引入包循环的情况下，通常无法为无循环组件子集分配任意包前缀（第\
  \ 2.4.10 节），因此在开发过程的每个阶段，必须考虑封装的大问题以及基于组件的逻辑物理设计的细节。\n\n使用显式包名还有一个好处，人们随着时间的推移越来越体会。起初，从逻辑角度来看，特定的包名可能看起来模糊、任意且无用。但每个前缀都携带了组件名称本身无法传达的意义维度。考虑图\
  \ 2-66 所示的三个包，它们属于一个真实的 IC CAD 系统相当低级的包组 `dm2`。起初，这些包名（即 `dm2t`、`dm2p` 和 `dm2e`）完全没有意义。\n\
  \n![](img/fig2-66.jpg)\n\n**图 2-66：包前缀为类名增加了实质性的正交意义。**\n\n\n\n当我们开始使用这些包时，我们开始注意到某些相似之处和模式。`dm2t`\
  \ 中定义的每种类型都是高性能、具体的、值语义的类型，且完全没有虚函数。相比之下，`dm2p` 中定义的每种类型都继承自 `dm2p_primitive` 中定义的协议类。此外，这些类型中的每一种也继承自\
  \ `dm2t` 中对应的类型。我们很快就会预见到，`dm2p` 中的每个类型都是 `dm2t` 中对应高性能类型的一种 `dm2p::Primitive` 适配器。`dm2e`\
  \ 包定义了可以放入单元格的元素类型。`dm2e` 中的每个组件都定义了一种元素类型。`dm2e` 中的每个元素类型都派生自协议类 `dm2e::Element`，该类其他功能还接受任意属性，只要它们实现了\
  \ `dm2p::Primitive` 协议。\n\n有关如何将值语义类型（参见第二卷，第 4.3 节，如 `dm2t` 中的类型）适配到协议类（如 `dm2p::Primitive`），请参见第二卷第\
  \ 4.6 节。另见 `lakos96` 附录 A 第 737–768 页，特别是第 756 页和第 757 页上的两个图。\n\n其意义是什么？意义在于，当我们看到一个新的带有包限定符的类名时，我们首先考虑的*不是*类名部分，而是包名部分——到目前为止我们已经见过很多次的那个。如果我们看到\
  \ `dm2t::Polygon`，我们想的是高性能的、独立的数据结构。如果我们看到 `dm2p::Polygon`，我们想的是“`dm2e::Element`\
  \ 的潜在属性”。如果我们看到 `dm2e::Polygon`，我们想的是“派生自 `dm2e::Element` 的适用于合并到单元格中的具体类型”。另一个点是，当我们看到\
  \ `dm2p::GrimblePritz` 时，我们知道它*既不是*高性能的独立数据结构，*不是*可以添加到单元格的 `dm2e::Element` 类型，而是是一种（某种）原始类型，它适配了\
  \ `dm2t` 中定义的类型，以便作为 `dm2e::Element` 的属性。\n\n### 2.8.5 节总结\n\n总结来说，确定添加新功能的适当物理位置是一项挑战。必须同时考虑逻辑和物理因素。每个包的内容在逻辑上必须是凝聚的，并且必须共享相同的（紧凑的）允许物理依赖范围。鉴于我们对平衡物理层次结构的偏好，我们必须仔细评估我们创建的每个包的范围。正如创建包含无关组件的包是不明智的，创建一个过于具体以至于永远无法容纳超过两个组件的包也是不明智的。通过向后退一步并进行长期规划，我们更有可能在位置、特性、依赖和范围方面做出正确的组件打包选择。\n\
  \n### 2.9 包组（The Package Group）\n\n我们有效聚合组件的能力对于我们的开发过程至关重要。包是重要的架构实体，但单靠包对于真正的大型开发工作是不够的。如果包是我们唯一的物理聚合手段，那么每个\
  \ UOR（用户定义运行单元）中的每个组件都将位于相同的命名空间中。通过引入第三层聚合——*包组*（package group），我们促进了大量物理相似的逻辑内容的组合，同时保留了至关重要的逻辑边界。此外，第\
  \ 2.4.11 节中引入的分组包名管理可以很容易去中心化。\n\n#### 2.9.1 第三层物理聚合\n\n**定义：**\n\n*包组*是一个在架构上具有意义的包集合，被组织为一个物理上凝聚的单元。\n\
  \n**推论：**\n\n每个包组的名称在整个企业范围内必须是。\n\n包组与其他 UOR（例如，隔离包和第三方库）紧密衔接，以支持整个企业中任意大型应用程序、系统和产品。每个包组由一组包组成，每个包都受对其他\
  \ UOR 的相同（公共）物理依赖关系 set 的约束。由于包组非常大且众所周知，它们刻意使用了非常短的名字（即恰好为 3 个字符）。我们从包构建包组的原因本质上与我们从组件构建包的原因完全相同：深思熟虑的聚合有助于人类理解并提高构建效率。大量存在于包组之外的独立包是规划糟糕的迹象，并且往往会增加企业规模的理解和维护。\n\
  \n再次考虑图 2-65（第 2.8.3 节）所示编码器/解码器包 `encoder`。现在假设我们还构思了其他包，例如原始解析工具、命令行和配置文件解释器以及一个日志设施，它们共同构成了一组相关的包，我们认为这是我们的“基础应用库”。假设它们共享相同的物理依赖范围，将这些包分组到单个包组中是有意义的，我们可以将其命名为\
  \ `bal`。那么该组中包含的包的名称可能分别变为 `baled`（编码器/解码器）、`balpu`（解析工具）、`balcm`（配置管理）和 `ball`（日志）。通过这些包的物理分组，规模大得多的\
  \ `bal` 包组变成了物理聚合体，其名称在我们软件仓库的最高层级可见。\n\n起初，组内此类简短的包“名称”（实际上只是标签）可能显得过于晦涩，导致可重用软件的发现变得困难。然而，这些名称的主要目标是从使用点明确了：(1)\
  \ 确切使用了什么，以及 (2) 它在我们全局仓库中的精确位置。即使我们使用更具描述性的包名，仍然必须提供同样详尽的文档（参见第二卷第 6.15–6.17 节）以及有效的搜索工具来从根本上找到这些解决方案。此外，较长的包名（特别是对于频繁使用的包）无疑会导致违反我们设计规则（第\
  \ 2.4.12 节）的 `using` 声明/指令，这反会阻碍我们从使用点立即识别定义给定逻辑结构的唯一包以及实现它的组件的能力。\n\n\n\n\n# 包组\
  \ (Package Groups)\n\n包组与孤立包一样，是一个发布单元。在部署时，原则上其形式为一个库（即 `.a`、`.so`、`.lib`或`.dll`\
  \ 文件）和一个头文件目录。在开发过程中，包组的物理结构（如图 2-67 所示）镜像了包的结构（图 2-58，第 2.8.1 节）。也就是说，我们在文件系统中将每个包组表示为一个以包组命名的目录。该目录像包一样，包含四个标准子目录（图\
  \ 2-67a）：`doc`、`include`、`lib` 和 `group`。顶层包组目录还包含与组内每个独立包对应的子目录，如图 2-67b 所示。根据设计，每个分组包的物理布局与每个孤立包的布局相同（图\
  \ 2-58，第 2.8.1 节）。\n\n在实践中，每个库将通过不同的构建设置创建多个翻译后的变体（参见第 2.15 节和第 2.16 节）。\n\n在历史上，我们一直使用\
  \ `group` 来指示存放组级元数据的目录。理想情况下，人们可以使用类似 `packagegroup` 代替 `group`，以便将该名称保留在我们限制的分组包名称\
  \ 4 到 6 个字符范围之外（第 2.4.11 节）。因此，`gro` 包组中的 `up` 包后缀对于人员或工具来说将不再是例外（参见第 2.16 节）。\n\
  \n![](img/fig2-67.jpg)\n\n**图 2-67：相当低级的包组 `bal` 的物理布局**\n\n请注意，虽然这样做可能很聪明，但创建一个名称为\
  \ `group` 这种有效英语单词的（分组）包几乎总是错误的。人不是机器，为了防止原子化地解析这些标记（token），他们将陷入一场几乎不可能完成的战斗。通常，我们主张选择分组包名称时应审慎考虑，以避免它们拼写成单词，尤其是令人反感的词汇。\n\
  \n作为我们的第二个示例，图 2-68a 展示了 `bsl`（BDE 标准库）包组的顶层布局。`doc` 子目录持有适用于整个包组的概述文档材料（参见第二卷，第\
  \ 6.15 节）。同样，`group` 子目录持有 `bsl.dep` 文件，该文件指定了该包组（整体）对其他 UOR 允许的依赖范围。关于在开发和部署包组期间如何使用\
  \ `include` 和 `lib` 子目录的讨论将再次推迟到第 2.15.3 节。\n\n与 `bal` 一样，`bsl` 包组也包含与组内每个包对应的独立目录，每个包都以包组名称作为前缀。图\
  \ 2-68b 展示了组内各个包对应的独立目录；其中带有 `+` 符号的包由于外部定义的约束，并不位于各自的命名空间中（参见第 2.12 节）。\n\n![](img/fig2-68.jpg)\n\
  \n**图 2-68：`bsl` 包组的物理布局**\n\n在 `bsl` 包组中，与内存分配器相关的包是 `bsl`。图 2-68a 反映了标准的包结构（图\
  \ 2-58，第 2.8.1 节）。`doc` 和 `group` 子目录的作用与孤立包相同，但对于包组，在开发和部署期间如何使用 `include` 和 `lib`\
  \ 子目录的讨论将再次推迟到第 2.15.3 节。\n\n正如 `bal` 一样，`bsl` 包组也包含与组内每个包对应的独立目录，每个包都以包组名称作为前缀。图\
  \ 2-68b 展示了组内各个包对应的独立目录；其中带有 `+` 符号的包由于外部定义的约束，并不位于各自的命名空间中（参见^第 2.12 节）。\n\n在表示法上，我们通过图\
  \ 2-69a 所示的方式表示包组，使用一个带有“2”或“3”的单框（参见第 2.16 节）。\n\n```\n包组 g 依赖于 UOR u。\n```\n\n\
  ![](img/fig2-69a.jpg) ![](img/fig2-69b.jpg)\n\n**图 2-69：包组表示法**\n\n**定义：**\n\n如果\
  \ g 中的任何包依赖于 u，则包组 g 依赖于 UOR u。\n\n### 设计规则\n\n与孤立包一样，包组的特征一个重要部分是该包组整体允许依赖的 UOR\
  \ 集合。虽然单独发布的孤立包的功能和依赖是单独制作的，但组内每个包的依赖都受该组整体物理规范的约束并与之符合。因此，包组依赖具有深远的架构意义，并且比包更需要预先规范。因此，每个包组在创建之初必须确定其成员包允许直接依赖于哪些其他\
  \ UOR（即包组、孤立包以及遗留、开源和第三方库）。\n\n^(第 122 节) 注意，单个包对组内其他包的允许依赖直接在位于包目录下的 `.dep` 文件的元数据中指定，而对其他\
  \ UOR 的允许依赖则集中地位于 `group` 目录中的同名文件中（参见第 2.16 节）。\n\n\n\n\n\n请注意，我们可能会通过使用元数据辅助工具（参见第\
  \ 2.16 节），将某些 UOR `v` 整体的允许直接依赖限制为某些其他 UOR `u` 的包和/或组件的子集。（这种符号上的增强是允许的，因为它仅等同于自愿缩小权限范围。）我们的开发工具随后会在直接使用超出显式允许范围时报告。尽管有这种架构上的限制，`v`\
  \ 仍将继续继承 `u` 的*所有*物理依赖。\n\n另一方面，每个聚合对另一个聚合的整体依赖关系在架构上*必须*始终被视为原子的。例如，如果包组 `v` 中的*任何*组件被允许依赖于另一个\
  \ UOR `u`（或其部分），那么 `v` 中的其他所有组件也必须如此。未能以原子化的方式处理聚合的外部依赖，违背了我们实现逻辑和物理内聚的愿望（第 2.3\
  \ 节），并会导致我们的架构与技术栈和部署策略产生耦合（参见第 2.15.9 节）；抽象表示允许的聚合物理依赖带来的收益将不复。\n\n### 依赖示例\n\n\
  例如，考虑我们如何形成构建典型交易系统时所使用的包组之间的依赖关系。我们假设需要以下全公司（软件基础设施）包组：\n\n* `odl` - *我们的开发库*\n\
  * `otl` - *我们的传输库*\n* `oal` - *我们的应用库*\n* `ogl` - *我们的图形用户界面库*\n* `obl` - *我们的业务库*\n\
  \n接下来，交易系统有其自有的部门级特定领域可重用软件库：\n\n* `tde` - *交易系统开发环境*\n\n最后，交易应用程序本身有其自己的包组：\n\n\
  * `ta1` - 针对系统*one*的*交易应用程序特定*功能\n\n这些包组之间*允许*的直接物理依赖在图 2-70a 中以抽象方式指定，并在图 2-70b\
  \ 中说明。请注意，这些允许的依赖在实际上将位于相应 `group` 子目录下的独立 `groupname` `.dep` 文件。\n\n![](img/fig2-70a.jpg)\
  \ ![](img/fig2-70b.jpg)\n\n**图 2-70：交易应用程序包组之间的依赖关系**\n\n¹²⁴ 参见图 1-59，第 1.8 节。\n\
  \n请注意这一刻意的架构决策：禁止在包组 `ta1` 中实现的功能直接使用包组 `otl` 中实现的功能。根据规范，`tde` 包组允许*直接*依赖于它间接依赖的每个包组（例如\
  \ `odl`），而定义在 `ta1` 中的组件*不允许*直接包含定义在 `otl` 中的组件的头文件。包组直接使用从属包组是否恰当是一个架构决策，我们并不提倡在设计哲学中禁止直接使用从属\
  \ UOR。比重要的是，允许一个 UOR 直接使用另一个 UOR 的决策可以是有意识的，而不需要总是默认为（偶然的）传递性物理依赖的包络。\n\n### 设计必要性\n\
  \n**UOR 之间允许的（显式说明的）依赖必须是非环的！**\n\n回想两个或多个 UOR（例如包和包组）——作为物理聚合（第 2.2.1 节）——如果显式说明的*允许*直接依赖（第\
  \ 2.2.14 节）形成循环，即使实际的组件依赖没有也是。从机制上讲，该概念与循环包级依赖的本质几乎相同，如图 2-62、第 2.8.2 节所示。考虑到包组通常比包大一个数量级且始终是独立的发布单元，涉及包组的循环依赖的后果是灾难性的。特别是，我们失去了分层顺序发布库的能力（第\
  \ 1.10 节）。如果说任何设计必要性应该免于减轻情况的影响并被毫无疑问地严谨遵守，我们提名这一个（第 2.2.24 节）：避免 UOR 之间出现任何循环的可能！\n\
  \n再次考虑图 2-70 所示的交易系统应用程序架构。图 2-71a 重现了包组之间本质的非环依赖。现在假设我们发现无意中在 `otl` 中“错放”了某些功能（例如原子指令、守卫等），而这些功能被确定为\
  \ `odl` 中的一个或多个组件所“需要”。尽管这种情况可能严重，但在 `odl` 中复制这些机制并(125)最终淘汰 `otl` 中的冗余代码是可行的；然而，允许\
  \ `odl` 中的组件依赖 `otl` 并不可行(125)错当的功能涉及类型时，问题在性质上变得更加复杂（参见第二卷第 4.4 节）。\n\n![](img/fig2-71.jpg)\n\
  \n**图 2-71：包组之间允许循环依赖（非常糟糕的主意！）**\n\n如图 2-71b 所示，允许 `odl` 依赖 `otl` 将在这两个包组之间创建循环依赖。现在，从维护的角度来看，这两个库都无法独立进行构建、测试或发布。更重要的是，想要使用最基本功能的应用程序或其他库也将被迫依赖于我们复杂的进程间通信软件，尽管\
  \ `otl` 对于大量应用程序并不适用。撇开相关性不，不再保证这些库文件能够成功链接；在许多平台上，客户端将被迫反复调整其链接行、重复库，并在自己的构建过程中遭受巨大的低效（第\
  \ 1.2.6 节）。\n\n如果我们允许通用的业务功能 `obl` 依赖于属于另一个部门的 `tde` 等包组（图 2-71c），也会出现类似的困难。这种决策的组织影响将是非常不幸的。现在，两个部门将被强制协作以同步发布涉及的两个包组。其他对\
  \ `obl` 感兴趣的部门（例如会计或分析部门）如果知道他们将在软件和进度上与一个不相关的同级部门密不可分，可能会望而却步。尽管如此，图 2-71b 中的低级循环可能更令人困扰，因为它可能会影响更多的潜在客户，并极大地增加维护成本(126)。\n\
  \n^(126) 另参见 **lakos96**，第 5.2 节，图 5-18a–d，第 225–228 页。\n\n\n\n\n最后，我们发现交易系统的核心团队在\
  \ `tde` 中创建了一个包，该包恰好提供了解决许多 `odl` 客户紧迫业务问题的功能。无论这种诱惑有多大，都必须抑制让 `odl` 依赖 `tde` 的冲动（图\
  \ 2-71d）。我们设计良好的分层软件库可能会因为这样一击而变成一个循环依赖的“大泥球”（节 0.2）。如果不立即纠正，损害可能会迅速扩大，到在实际上变得不可弥救。\n\
  \n## 2.9.2 部署期间的包组组织\n\n然而，从组织的角度来看，我们可能会选择将一组包组视为单一部署单元。再次考虑图 2-70 依赖图中第 1 层和第\
  \ 2 层所示五个全公司包组（节 2.9.1）。理论上，我们应该能够发布最低层的包组 `odl`，然后发布其他四个组 `obl`、`otl`、`oal` 和 `ogl`\
  \ 中的每一个，一次或单独以任意顺序发布。然而，对于非常大的系统，这种增量部署方法是极其低效的，因为原则上所有依赖于它的（高层）软件在每次发布任何单个组时，都必须重新构建（并部署到每台机器上）。\n\
  \n假设由同一个核心团队维护这些包组，特别是当每个组都处于活跃开发状态时，通过将所有这些物理组视为单一的组织部署单元，可以实现显著的构建时间和和其他部署效率（127），该单元可以在不另通知的情况下发生更改（参见节\
  \ 2.15）。为了开发人员的方便，这些包组甚至可以组织为单一源码库的一部分。然而，任何此类组织都不能包含具有架构意义的构件，从而允许源代码重新分区，部署策略进行演进，而无需对库或其客户端的源代码进行任何更改。当然，任何此类\
  \ UOR（用户定义资源）组织集群都必须经过选择以避免集群之间的循环依赖。\n\n### **观察**\n\n在讨论了构成包组的要素之后，现在让我们探索包组在实践中常规使用的不同方式。包组支持逻辑上和物理上的库级开发。在大规模开发中，我们有两种不同的方式有效利用包组，以实现逻辑上和物理上凝聚的子系统。第一种用法——通常是可重用库或基础设施库——是为了捕获广泛消费的功能，这些功能虽然在不同的包中处理不同的逻辑主题，但共享共同的预期受众以及共同的物理依赖范围。可重用组中的包通常由水平的（128）包组成，其所有组件旨在供客户端直接使用。基础设施组中的典型包通常代表通用的树状的（129）子系统，例如日志记录器，其中只有部分组件旨在供外部客户端直接使用，但它们并不完全从属于组中的其他包（lakos96`，节\
  \ 4.1.3，第 195 页）。\n\n第二种用法——应用程序库——是将一个具有良好逻辑设计和目的的凝聚复杂子系统划分为接口包和实现包。在这些包组中，只有组内一部分较小的子包会被外部客户端直接使用。因此，客户端将通过适当的封装和/或接口包来识别对该组的使用（例如，参见图\
  \ 2-30、节 2.4.10 以及图 2-32、节 2.4.11）。然而，从实现者的角度来看，分离的包提供了方便的内部设计边界，这些边界从源代码即可可见。这些可见的包边界反过来促进了无循环、逻辑和物理上一致的子子系统的开发，这些子系统可以被容易理解和维护。\n\
  \n每个包组在完全填充后，旨在代表一个大量的软件实体。具有足够复杂性以作为物理导向的应用程序包组实现的可能候选包括编程语言编译器/解释器、CAD 电路模拟器、投资组合管理器等。完成后，该包组成为凝聚的且通常是巨大的应用程序子系统在逻辑和物理上一致的呈现。\n\
  \n与包一样，确定包组的范围是一个关键的设计问题。一个仅包含单个包的过于具体的包组会使全局设计空间变得混乱。同样，创建一个职责范围过于宽泛（例如业务逻辑）的包组可能会导致发布单元的尺寸无边界。在拥有相当经验之前，误判特定子系统的规模并不罕见。\n\
  \n例如，假设我们想创建一个可重用的库软件，通过抽象基类（运行时多态）对进程内数据值进行序列化（也称为外部化、字节流、封化）（130）。这种功能最好实现为 (a)\
  \ 一个组件(b) 几个组件(c) 一个包(d) 几个包，或 (e) 一个包组？结果证明，使用方法模板和概念实现编译时多态字节流，虽然理论上可能不灵活，但仍然满足所有实际需求，并且对于这种特定功能，已被证明运行时性能优于（已过时的）运行时多态变体（参见第二卷\
  \ 4.1 节）。尽管如此，这个示例在多个层面具有丰富的教学价值。在没有更多信息的情况下，很难确定。图 2-72 的对每个选项暗示的大小给出了大致的感觉。请记住，这些只是与图\
  \ 2-11、节 2.2.19 所示一致的粗略级估计。一个包含少于百行源码（不包括注释）的完整组件，或者一个经过良好划分的包含百万行非注释源码的包组，都是可能的。\n\
  \n\n\n序列化是一个组件吗？不是。运行时多态字节流将涉及至少两个纯抽象接口（一个用于输入，一个用于输出）以及至少四个具体实现（两个用于生产，两个用于测试）。序列化本身是一个独立的包吗？也许吧。或者序列化可能与其他相似的功能共享一个包。序列化是两个（或更多）包吗？也许吧。我们可能需要区分：将内容转换为标准从线格式及其的接口，与一种允许字节流在目标机器配置的外部主机之间进行传输的跨流能力——即：尺寸、对齐和字节序。\n\
  \n又名 `protocols`（[第 1.7.5 节]）。\n\n包的相对位置是高层库设计的另一个关键方面。如果我们的流功能存在于两个或多个包中，它们是否应该位于同一个包组中？也许吧。我们可以将跨流包命名为\
  \ `xyzxc`，它可以很容易地位于 `xyz` 包组中比其抽象接口（例如 `xyzx`）高得多的层级，从而依赖于那些本身依赖于 `xyzx` 的包所提供的功能。或者，这个独立的跨流包也可以位于一个使用频率较低、面向我们基础传输\
  \ (`obt`) 的高层包组中，或者是一个面向我们基础应用的更通用且杂烩的包组 (`oba`)。\n\n序列化是一个包组吗？不是。如果这种简单的流功能变得接近了一个成熟包组应包含的内容（即：大约二十万行非注释源代码），那么这种实现几乎注比无用更糟。鉴于我们计划只\
  \ Setup 一种标准的生产格式，以便让侵入式设施外部化我们所有的低级类型，且该包名可能将专门用于标识它，我们选择将所有此类相关组件放置在它们各自命名恰当的包中，位于我们系统中最低级包组的底部。\n\
  \n请参见 [图 3-29]、[第 3.3.7 节]，获取关于涉及概念（[第 1.7.6 节]）和工具（[第 3.2.7 节]）的包大小的另一个启发性示例。\n\
  \n实际上，此处描述的与面向对象的流包对应的开源编译时多态对应物，存在于我们开源 `bsl` 包组的 `bslx` 包中（仓库 `bde14`，子目录 `/groups/bsl/bslx/`）。\n\
  \n### 观察\n\n**包组允许无环应用库随时间演进。**\n\n大型开发组织中包组的另一个微妙但强大的益处源于一种观察：大多数单个项目并不特别大，但——随着时间的推移——会产生大量的代码，这些代码理想情况下应该并排存在组织良好的基础设施中。预测物理层级中未来十年项目代码将去向何处完全是不可能的。然而，我们可以做的是预测一些粗略的显著物理依赖层级。然后我们可以使用包组来划分出一些独立的“房地产”——每块区域几乎完全由管理成员包的依赖范围来表征。生成的库将具有以下属性：(1)\
  \ 每个单独包本身在逻辑上是内聚的，且(2) 每个包与组中的其他所有包共享相同的物理依赖范围。在缺乏全知视角的情况下，这个结果是我们能够合理期待的最优结果，而且——在实践中——这一点也不糟。\n\
  \n作为一个简单的说明，假设我们公司的股票衍生品部门开始成立一个新的开发小组，并计划采用书中倡导的组件化方法。在与公司级核心团队（其成员对我们的方法非常熟悉）进行充分讨论后，确定这些专门的应用开发人员将工作的通用类型项目涉及混合的粗依赖。预期的依赖关系被被分为三个基本类别，如\
  \ [图 2-73] 所示。\n\n![](img/fig2-73.jpg)\n\n**图 2-73：使用包组预定义粗依赖**\n\n最原始的开发——股票衍生品核心\
  \ (`edc`) 将仅依赖于我们的（公司级）开发环境 (`ode`) 和我们的（公司级）业务环境 (`obe`) 专用库，这些库自然依赖于 `bsl` 等基础开源库。中间基础设施——股票衍生品工具\
  \ (`edu`) 将利用 `edc`，除了 `bsl`、`ode` 和 `obe` 之外，允许依赖一组简短的批准第三方产品。最后，只有最高级别的股票衍生品基础设施——股票衍生品应用\
  \ (`eda`) 被允许依赖遗留基础设施，这带来了广泛的开源和第三方产品列表。\n\n随着时间的推移，必须依赖遗留软件的公共代码必须位于 `eda` 包组的包中，而物理依赖更有限的更干净的子系统可能位于较低的\
  \ `edu` 包组中。非常干净的组件具有极少的依赖，是部门级复用的理想候选，它们应该正确地位于最低的部门级包组 `edc` 中。生成的应用包虽然逻辑上可能有些多样化，但它们形成的包组在物理上是内聚且无环的。通过充分的远见和前期的设计努力，许多包将在我们公司软件的无环物理层级中的某些范围良好的包组中找到它们合适的位置。\n\
  \n请注意，作为持续维护过程的重要组成部分，我们倡导使用所谓的“持续重构”，使得应用库中通常通用的组件被提取、精炼、泛化并移动到部门 UOR 依赖图的更低位置，在那里它们将成为基础设施团队进一步重构并放置在公司级仓库中更低层级的更明显候选，从而实现更广泛的复用。\n\
  \n**指南**\n\n**在可能的情况下，每个包应该是适当包组的一部分。**\n\n虽然按独立（孤立）包进行设计最初可能需要较少的前期工作，但随着时间的推移，它不可避免地增加了物理复杂性、人类理解、维护和可用性方面的成本。在可能的范围内，我们被建议按包组进行设计，并尽力将每个新组件放置在位于适当包组内的包中，除非有迫迫的理由这样做（见下文）。\n\
  \n**指南**\n\n**允许的包组依赖应该是 (1) 最小的，且 (2) 很少增加的。**\n\n\n\n\n设计良好的包组（package group）将由共享紧密共同物理依赖范围的包组成，同时它们在逻辑上是内聚的。理想情况下，每个包应该属于一个具有这些属性的包组，但并非所有与包组内其他包在逻辑上内聚的包都恰好属于其中。那些不符合要求的包几乎总是受限于某些重大的物理依赖——例如对遗留、开源或第三方软件的依赖（参见第\
  \ 2.12 节）。\n\n例如，考虑图 2-74 中的包组 `xyz`，它目前仅允许依赖于公司范围的核心包组 `ode` 和开源基础库 `bsl`。在 `xyz`\
  \ 内部，包 `xyza`、`xyzb` 和 `xyzc` 是相互独立的，而包 `xyze` 依赖于包 `xyzb` 和 `xyzc`。由于这些包被分在一组，使用\
  \ `xyze` 意味着客户端需要链接 `xyza`（反之亦然），然而，由于所有这些包本质上具有相同的物理依赖，没有理由不将它们聚合。\n\n![](img/fig2-74.jpg)\n\
  \n**图 2-74：通过独立包隔离重量级依赖**\n\n现在考虑另一个包 `a_ldb2`（参见第 2.10.3 节），它与目前 `xyz` 包组中的所有包在逻辑上是内聚，并且恰好依赖于\
  \ `xyza` 和 `xyzb` 包，但也封装（或适配，参见第二卷第 4.6 节）对大型遗留数据库 `LDB2` 的访问。如果我们选择将这个新包成为 `xyz`\
  \ 包组的一部分（并将其命名为 `xyzd`），那么任何想要使用 `xyz` 中*任何*包的人都将被迫依赖于重量级的 `LDB2` 遗留数据库。将此包放在任何其他尚未依赖\
  \ `LDB2` 的组中也会产生类似。因此，尽管 `a_ldb2` 可能在逻辑上与 `xyz` 包组内聚，我们仍刻意选择*不*让 `xyz` 包组负担对 `LDB2`\
  \ 的依赖，并将 `a_ldb2` 保持作为一个*隔离的*（或“独立的”）*包*。\n\n## 2.9.4 去中心化（自主）包创建\n\n### 观察\n\n\
  **包组支持去中心化的包创建。**\n\n包组具有架构上的重要性，其名称在整个企业内必须唯一。在实践中，这种唯一命名通常通过积极维护一个中央的企业级包组名称注册表来实现。由于包组名称会自动为其包含的所有包预留命名空间（第\
  \ 2.4.11 节），一旦分配了包组名称，包组所有者就可以自由创建所需的任意包而无需咨询中央注册表，从而实现了包创建的去中心化。\n\n## 2.9.5 本节总结\n\
  \n总结来说，包组是我们第三层也是最高层的具有架构意义的*物理*聚合。虽然包始终用于聚合逻辑和物理上相关的组件，但包组为聚合可能在逻辑上不内聚、但仍必须共享相同允许物理依赖范围的包提供了媒介。\n\
  \n理想情况下，一个设计良好的库包组的章程将足够广泛，以吸引一组逻辑上相当多样化的包，但同时 (1) 解决共同目的和/或服务于特定的客户群体，(2) 范围足够以至于随时间推移而不会变得庞大，并且\
  \ (3) 共享非常窄的允许物理依赖范围。\n\n长期由多个（例如应用团队）拥有并填充的包组，可能缺乏由单个团队（例如基础设施团队）中心化拥有和管理的包组所具有的紧密逻辑内聚性，但通过提供一个组织框架，仍然将获得深远的益处，该框架确保了同地放置组件的相同依赖得到强制执行，并确保\
  \ UOR（用户定义单元）之间不会随时间推移而产生循环物理依赖。\n\n最后，我们通常希望库的 UOR 以包组的形式表示，隔离包是少数例外，主要用于容纳对典型开源或第三方库的重量依赖。通过这种方式，我们可以去中心化单个包的创建，允许包组所有者根据需要独立地创建它们。\n\
  \n## 2.10 包与包组的命名\n\n对于广泛可见的实体拥有合理的命名策略对于大规模软件开发是至关重要。在本节中，我们概述了命名具有架构意义的逻辑和物理实体的总体方法。特别是，我们为包组、包组内的包以及不在组中的包提供了行业验证的简洁命名规则。\n\
  \n### 2.10.1 直观描述性的包名被高估了\n\n在创建包组时，人们起初可能像许多人那样假设，其名称应该被允许具有任意长度，足以让不熟悉的人能够立即理解并大开眼界，对于它们所包含的包的名称也是如此。因此，位于我们最基础包组之一的、与时间类型相关的包中的\
  \ `Calendar` 类，可能有一个极具描述性的限定逻辑名称：\n\n* `our_development_library::time::Calendar`（一个非常糟糕的主意）\n\
  \n 遗憾的是，使用此类“文学化”的命名空间名称带来的痛苦程度将变为 `using` 指令（第 2.4.12 节），这些指令会像癌症一样收集并增长，因为它们作为一个整体从一个源文件带到另一个文件，消除了此类名称可能提供的任何描述优势。\n\
  \n我们可以采用极端的缩写并仍然保持语法分隔的命名空间：\n\n* `odl::t::Calendar`（糟糕的主意）\n\n但意义何？幸运的是，包组名称形成了企业级唯一包名的自然前缀。通过简单地将固定长度的组名与一二（最多三个）字符的包后缀合并，我们得到了唯一的包名\
  \ `odlt`（读作“oh-delt”）：\n\n* `odlt::Calendar`（好主意）\n\n相反，选择紧凑但唯一的包名（例如 `std`），虽然起初是晦涩的，但它们很快就会成为我们词汇的一部分，并通过反复使用得到强化。^134\
  \ 孤立解析名称的能力对工具和人类都有处。如果组名不是固定长度，在缺少显式且昂贵的分隔符的情况下，从包名中推断组名将需要注册表（即数据库）查找，这具有严重的实际缺点。注意，在我们的方法中，无论是否注册，组名都是显而易见的。\n\
  \n\n\n\n\n由于我们对包名简洁性的迫切需求，系统地实现唯一性再次被推到了前沿。请记住，在我们的方法论中，只有类（classes）、结构体（structures）和自由运算符（以及类似于运算符的\
  \ `aspect` 函数）允许在文件或命名空间作用域内声明（第 2.4.9 节）。通过使组件名称与该组件包-命名空间作用范围内定义的每个 `class` 或\
  \ `struct` 的小写开头字母匹配，即可实现名义逻辑/物理内聚。遵循这些指南，所有逻辑构造的唯一性命名问题便简化为避免全局 `physical`（物理）命名空间中组件名称之间的冲突，我们通过确保包名本身在整个企业范围内是唯一的来实现这一点。\n\
  \n对于一个仅包含单个包的 UOR（用户组织单元），包名自动既是逻辑命名空间，也是其包含的每个组件的物理前缀。对于聚合了多个包的 UOR，我们采用了“包组”（package\
  \ group）的概念，根据定义，它在**架构上是有重要意义的**（第 2.2.6 节），因此必须具有全局唯一的名称。这个长度统一的名称将成为该组中每个包名称的前缀。请注意，我们还必须确保分组包和孤立（“独立”）包的各自的授权命名空间不重叠。\n\
  \n### 2.10.2 包组名称\n\n**设计规则**\n\n**每个包组的（全小写）字母数字名称必须恰好为三个字符，并构成有效的标识符：**\n\n`<Package\
  \ Group Name> ::= [a-z] [a-z0-9] [a-z0-9]`\n\n诚然，短小晦的名称有其缺点。尽管如此，任何可以投入用于描述性目的的空间，投入到组件的“给定”名称中，也远比投入到标识其封装包并以此确定在物理层级结构中（唯一）位置的父级“标签”要好得多。由于包组像\
  \ C++ 标准库（命名空间 `std`）等主要库一样相对较少且为人所知，我们选择——尽管可能很冷酷——将包组名称限制为恰好三个字符，从而产生 26 × 36\
  \ × 36 = 33,696 个不同的包组名称。\n\n请理解，此处提倡的三个字符的特定长度并不如包组名称非常短以及它们都具有*完全*相同的长度^(135)那么重要（以避免额外的分隔符）^(136)。一个集中管理的、全企业范围的已分配\
  \ UOR 名称注册表（见第 2.10.3 节）消除了对此类名称发生冲突的任何恐惧，而简洁在这里能产生生产力。我们还建立了内置的逃逸机制^(137)，以备某日之需。\n\
  \n^(135) 在数学值（如整数）的语境下，“恰好”一词——此处用于强调——（在最好）是完全多余的（见第二卷第 4.1 节）。\n\n^(136) 我们保留在任何包组名称（例如\
  \ `xyz`）之前添加 `z_` 前缀（例如 `z_xyz`）的权利，形成有效的五字符包组名称，该名称作为相应的底层、仅限 C++（三字符）包组的 C 语言兼容过程封装器接口（见第\
  \ 3.11.7.8 节）。\n\n^(137) 例如，所有`双字符前缀`目前已保留供以后使用。特别是，为了减少具有相似方法的组织之间意外头文件命名冲突（第 2.9.4\
  \ 节），每个导出库的组织可以考虑在其每个头文件名称中添加一个一致的（希望是）唯一的双字符 `physical`（物理）前缀（例如 `bb_`），对应其（较长的）唯一全企业命名空间名称。或者，每个导入各种杂库的公司可能会通过它们新的（区分性的）`local`（本地）目录名称（或等同的本地唯一头文件前缀）来锚定（并在自己的源代码中引用）这些组件。每个（导入）库的导出头文件源代码包含的\
  \ `#include` 指令也需要更新（作为部署的一部分；见第 2.15 节），以反映其头文件现在本地唯一的身份。\n\n### 2.10.3 包名\n\n\
  **设计规则**\n\n**包组内每个包的（全小写）名称必须以组名开头，后跟一个、两个或三个小写字母数字字符，以在该组内唯一区分该包。**\n\n`<Grouped\
  \ Package Name> ::= <Package Group Name> [a-z0-9] ( [a-z0-9] ( [a-z0-9] )? )?`\n\
  \n例如，通过检查很容易看出 `bdlt`、`bdlma` 和 `bdlb` 都属于同一个 `bdl` 组：\n\n```\nbdlt_datetime   \
  \                  // 时间相关\n\nbdlma_sequentialallocator       // 特殊用途\n\nbdlb_util\
  \                        // 通功能\n\n```\n\n由于逻辑和物理内聚（第 2.4 节），根据对象 `bdlt::Calendar`\
  \ 的声明，我们可以快速确定 `bdlt_packed` 属于 `bdl` 组。而且由于包组的位置相对且（理想情况下）为人知，寻找这些文件对人类来说是自动且机械的。\n\
  \n为了将独立包的命名空间与可能是包组部分的分开，我们排除了四到六字符的名称，并提供了单字符序列。但请注意，我们保留单字符序列 `m_` 用于应用程序包（见第\
  \ 2.13 节），并将 `z_` 专供 C 语言兼容接口使用（见第 3.11.7.8 节）。最后，在极少数情况下，例如 C++ 标准库（std`）本身，我们可能会选择一个包组大小的独立包（即具有单个命名空间），在这种情况下其名称（以及相应的命名空间）将具有三个字符（见第\
  \ 2.10.3 节 和 2.11 节）。\n\n\n\n\n例如，图 2-75 展示了各种包名，通过观察可以立即判断出它们是独立包。特别是，任何超过六个字符的包名都被认为不属于任何组。具有单字符前缀后跟下划线（`z_`\
  \ 除外，参见第 3.11.7.8 节）也表示该包未被分组。在极少数特殊情况下，例如 C++ 标准库，我们可能会考虑仅有一个非常大且名称非常短（即恰好为三个字符）的包，例如\
  \ `std`（参见第 2.11 节）。在这种情况下，人们通常仅从（三个字符的）名称无法判断它指的是一个组还是一个超大的独立包。然而，对于后者，人们在实践中总能（在代码中）识别出某个无处不在的包前缀（例如\
  \ `std`）是此类包。\n\n### 指南\n\n**企业内部每个（可共享的）UOR 的名称应在使用*之前*向中央机构注册（并预留）。**\n\n就像在多线程编程中一样（参见第二卷第\
  \ 6.1 节），我们希望避免可能损害架构完整性的竞态条件。在企业中的某个组大量使用可以被外部客户端引用的（即 `m_` `...` 之外）UOR 名称之前，审慎的做法是预留该名称，以免其他志同道合的人无意中选择了相似的名称。最终，我们这种基于包的组织的中心化性质将强制解决这个问题。“防患胜于于治”这句谚语在这里非常适用。\n\
  \n### 观察\n\n**在包组内选择包名是自动去中心化的。**\n\n我们的分组包命名法的一个巨大额外益处是，一旦预留了包组名称，就永远不需要在组件或包层级回溯重新注册（第\
  \ 2.9.4 节）。这完全能够顺畅运行。尽管包组内的每个包也必须具有全局唯一的名称，但在这种有限范围内，通常增加一两个字符就足够完成工作了。\n\n### 2.10.4\
  \ 节总结\n\n总结来说，在大规模开发软件时，拥有有效的命名策略至关重要。为了避免引导客户端使用 `using` 指令和和声明，客户端用于引用自身包之外实体的名称必须保持*极*短。鉴于我们已经采用了最多三层具有架构意义的物理聚合（第\
  \ 2.2.19 节），我们能够利用高度压缩的命名法来轻松访问其他包中的软件，对其他包组中的软件也是如此。如果听天由命，拥有如此短的包名很容易导致意外的重复和冲突。拥有一套深思、全面的层次命名规范以及企业范围的\
  \ UOR 名称注册表，可以很好地解决这一问题。此外，注册过的包组名称允许在组内命名新单个包的过程实现去中心化。这种命名策略赋予的自主性部分使我们的开发流程能够扩展，以适应极大型软件开发组织。\n\
  \n## 2.11 子包\n\n我们坚持认为，三个具有架构意义的物理聚合层对于任何情况都是足够的。我们也理解，有时需要在单个命名空间内表示异常庞大的组件集合——即当受外部定义规范强制要求时。此类外部规范（例如\
  \ C++ 标准库）旨在大量独立的可重用组件供客户端直接使用，其设计方式可能未能以优的方式整合 UOR 内部具有架构意义的子聚合依赖。^(138)\n\n^(138)\
  \ 像 STL 这样的库，由于相互依赖较少，有时被描述为*水平型*的。参见 lakos96 第 7.4 节，图 7-16a，第 504 页。\n\n缺乏足够的远见和合理的拆分，在一个发布单元内拥有独立的包（因此是独立的命名空间）甚至可能导致问题。例如，设计不当的划分导致客户端必须记住哪个晦涩的包变体任意关联到特定的组件名称（例如\
  \ `xyza_bitarray` 之于 `xyzt_date`），这可能会轻易阻碍可用性。因此，包名本身能够恰当描述该包至关重要。理想情况下，包名将是用于引用其所代表的设施或子系统的常用*口头*名称——例如\
  \ `bslma`（读作“be-sel-ma”）是位于 `bsl` 包组中的内存分配器设施包的常用名称。\n\n对于一个大型且拆分不合理的 UOR，拥有单个命名空间也允许实现者在“移动”（即实质性改变相对物理（实现）依赖）该\
  \ UOR 内组件时具有更大的灵活性，而无需强制外部客户端更新其代码。尽管如此，我们必须强调的是，这种物理灵活性给实现者带来的任何好处，往往会被由于设计规划不足导致的理解性、可靠性和维护性方面的成本增加而完全抵消。\n\
  \n在极少数情况下，我们作为库开发者（第 0.2 节）可能会自己选择将实现复杂度吸收到内部，放弃包组提供的证明的易开发和维护性（第 2.4.11 节），并创建一个协调良好、物理上合理的、包组大小的、仅有一个命名空间的包，例如\
  \ `std`。虽然这远非理想，尽管一个包在理论上可以是包组 `xyz` 的成员（例如 `xyza_bitarray` 和 `xyza_date`），但这样做将违反我们的原则：聚合内给定深度内的聚合应具有相当的物理复杂度。\n\
  \n```\nImages/fig2-76.jpg\n```\n\n本短节的剩余部分对大多数人来说完全是假设性的，讨论了我们如何在不向客户端暴露内部聚合层次（及其更改）的情况下保留它。图\
  \ 2-76 展示了包含九个组件的教学用 UOR 的两种相似表示。图 2-76a 显示了一个包含三个包的包组 `grp`，每个包包含三个组件。在这个教学示例中，我们假设组件名称在包之间是（或可以变为）唯一的。因此，要求客户端将组件名称与其组内对应的包匹配就可以消除。\n\
  \n**图 2-76：使用包组与子包的物理聚合**\n\n\n\n\n\n在某种意义上，我们需要为组中的所有包提供单一的命名空间，且所有成员文件的前缀与该命名空间匹配（图\
  \ 3-76b）。然而，这种转换无非是将本应属于包组 `grp`（图 2-76a）变成一个巨大的（尽管在其他方面是*规则的*）包 `pkg`（参见节 2.12），但仍保留了三个物理聚合层（图\
  \ 2-76b）。根据我们对包的定义（节 2.4.5），`pkg` 将成为比组件更大的第一个*具有架构意义重要性*的聚合层。因此，子包（根据相同的定义，在架构上*不具有*重要性）在定义它的包之外是完全无关的。\n\
  \n从架构角度来看，“子包”是不可见的；它们可以被更改或完全消除，而永远不会影响任何源代码。在大型包中使用子包提供的优势完全是组织层面的（即为了包作者/维护者的利益）。它们所提供的帮助是有限的，仅限于在逻辑上和物理上相关的组件簇之间表达聚合依赖，而这些组件并没有获得组内包所提供的名义内聚性。通过明确哪些组件属于哪些子包（通过每个子包的\
  \ `.mem` 文件）以及该子包允许依赖哪些其他子包（通过每个子包的 `.dep` 文件），我们可能能够更好地强制一种内部组织，这种组织可以按照我们习惯的增量和分层方式进行维护、测试和移植。\n\
  \n现在让我们考虑一个供应商提供的或开源的 C++ 标准库实现。其接口已经过规范（且恰好不符合我们的包组规范模型）。由于全文讨论的原因，这个广泛重用库中的功能受到一个单一简练命名空间\
  \ `std` 的保护。尽管该命名空间是同质的，但在实现方面，对于逻辑和物理上一致的聚类仍具有巨大潜力。\n\n例如，在 C++ 标准库的基于组件的渲染中，STL\
  \ 容器和 `std::string` 几乎肯定共享对库内部其他组件簇的共同依赖环境（例如，低层元函数、特性的、异常等）。流也将实现为具有相似依赖关系的组件内聚集合。我们在维护各种\
  \ C++ 标准库实现方面的经验^(140) 证实了，缺乏适当的内部物理结构会模糊设计，并可能导致不希望的循环物理依赖（最坏的情况下涉及公共接口）。选择良好的子包可以提供维护此类库有效可维护性所需的物理结构。\n\
  \n^(140) 包含为了支持我们的多态分配器模型的增强（见卷二，第 4.10 节）。\n\n总而言之，这里介绍的子包对于过大的独立包的维护者可能具有价值。由于子包在架构上被明确为不具有重要性，因此它们不被称为包。\n\
  \n### 2.12 遗留软件、开源和第三方软件\n\n按照我们的方法，所有新开发的软件将采用节 2.5、 2.7、2.8、2.9 和 2.10 的形式。遗留库可以被视为单个不规则的包或一个包组（节\
  \ 1.1）。组内不规则包的名字在语法上通常与规则名称区分。例如，包组 `xyz` 可能由包 `xyza` 和 `xyzb`（规则的）以及包 `xyz+oldstuff`（不规则的）组成^(140)。\n\
  \n**定义：** 如果一个包并非完全由组件组成且不遵循我们的设计规则（节 2.2），则该包是*不规则的*。\n\n在我们 `bsl` 包组的特殊情况下，成员包名称中带有\
  \ `+` 意味着该包内定义的逻辑内容位于 `bsl` 命名空间中，以镜像预定义的 C++ 标准库规范。然而，对于开源和第三方库，我们通常会避免任何修改，因为那会导致代码分叉；因此，我们通常将每个此类库视为单个不规则包。\n\
  \n我们需要在每个 UOR（例如孤立包或包组）的 `.dep` 文件中通过名称列出我们对不规则 UOR 的依赖。这取决于构建系统以及维护不规则软件的人员以何种方式安装，以便构建系统能够在所有相关平台上的所有支持目标找到并使用它。描述支持的构建目标（例如\
  \ `DEBUG_STATIC`、`OPTIMIZED_SHARED`）和相关平台（例如 `SUN_STUDIO12`、`HP_UX`、`IBM_AIX`）的信息超\
  \ C++ 语言的范围，必须存在于与软件相关的元数据中——例如在能力（`.cap`）文件中（参见节 2.16）。\n\n\n\n\n\n例如，假设我们发现需要解析\
  \ XML，并决定将 Xerces 开源库集成到我们的开发环境中以此此目的。我们可能会采用 `xerces` 作为该不规则 UOR（用户定义运行时）的名称。接下来，我们将在元数据中将\
  \ `xerces` 与它将支持的各种平台和目标关联。随后，我们需要构建并部署 `xerces`（在必要时手动操作），以便其外部接口（一组头文件和一个库归档）能够镜像我们私有正规软件的接口。最后，我们可能想用一个符合规范的接口来封装\
  \ Xerces 功能，这样需要 XML 解析功能的代码就不会被不规则名称的使用所污染。\n\n正如第 3.1.10.9 节](#ch03.xhtml_ch03lev3sec1-10-9)、3.6.10\
  \ 以及 3.11.6 节 中所讨论的那样，对大型子系统的各个部分进行封装并不总是可能的；即使在技术上可行（例如，参见第 3.1.10.8 节），封装也可能不是最佳业务决策，正如\
  \ David Sankel 在对本书手稿的评述中所解释的那样：\n\n然而，这种方法存在一些应该指出的严重陷阱：维护一个不断变化的库的封装器是一种负担，而且几乎总是会过时。出于这个原因，“硬着头皮”接受这种不规则性通常是正确的工程选择。\n\
  \n大多数生产就绪的开源库都带有自带的构建/安装脚本，将源代码发布到指定位置。此类软件在发布时，通常包含一个由相对路径组成的微型层级结构。与我们自己的正规私有软件不同，我们无法依赖不规则软件所处文件名称的全局唯一性。因此，在部署期间，我们通常无法将该软件扁平化，或将其与其他不规则软件并排存放（参见第\
  \ 2.15.7 节）。此类软件可能还依赖 `#include` 指令的特定平台属性（第 1.5.1 节），这些属性使用双引号（`\"\"`）而不是角括号（`<>`）。最后，我们需要确保软件运行在我们支持的所有平台上（或者在\
  \ `.cap` 文件中刻画出那些它可以运行的平台）。因此，每个非合规的库至少都需要一些初始工作才能将其适配到我们基于组件的框架中。\n\n总而言之，与不规则软件的集成很大程度上是部署问题，而非设计问题。每个遗留、开源或第三方库都将被赋予一个全局唯一的名称，该名称将用于作为其他\
  \ UOR 的黑盒引用它。一旦为其分配了适当的元数据，这种不规则软件就可以像对待正规软件一样对待它，只是它可能不会遵循我们所有的严格命名规范。我们将在第 2.15\
  \ 节中更广泛地讨论部署。让所有这些软件无缝运行的关键在于，能够在元数据中描述其属性，然后利用使用这些元数据执行相应操作的基于组件的工具（参见第 2.16 节）；然而，应用程序开发并不需要。正如第\
  \ 0.2 节 所述，应用程序开发的目标主要是在极其动态且需求不断变化的环境中，尽可能地交付高质量的解决方案。由于应用程序自然位于软件整体物理层级的最高层，因此对稳定性（特别是可重用性）的需求在很大程度上已经被消除了。因此，可靠地开发应用程序与敏捷性的目标并不矛盾。\n\
  \n应用程序开发者自然地是以应用程序为中心的。鉴于每个应用程序都处于物理层级的顶端，可以以应用程序开发者认为合适的任何方式进行组织和构建——完全独立于其他应用程序。然而，在一个大型开发组织中，通常有许多应用程序同时开发。这些应用程序反过来会有许多版本。设计一个可以将所有应用程序集成到单一方法论中的框架，在大规模管理应用程序软件开发时具有显著优势。\n\
  \n在最高层级，我们选择将软件组织为两个开发分支：应用程序和库。正如图 2-77 所示，合规的应用程序和库 UOR 将被放在各自的分支中。在该组织结构之外开发的应用程序仍然可以使用新的库软件。\n\
  \n![Figure 2-77](img/ch02.xhtml_ch02fig77)\n*图 2-77：组织为应用程序和库的开发框架*\n\n一个合规的应该应该是较小的发布单元（第\
  \ 2.10 节）。但与库包不同，应用程序包不能被任何 UOR 依赖，但允许包含单独文件（测试驱动程序之外），这些文件位于全局命名空间之外并包含一个 `main`\
  \ 例程。考虑图 2-78 中的 `m_mailserver` 应用程序。\n\n![Figure 2-78](img/ch02.xhtml_ch02fig78)\n\
  *图 2-78：典型应用程序包 m_mailserver 的目录结构*\n\n在 `.cpp` 后缀之前多出一个 `.m`（代表“主程序”）或 `.t`（代表“测试驱动程序”）的文件表示它们是包含\
  \ `main` 例程定义的源文件。此包中的所有其他源文件位于标准组件中：\n\n```\nm_mailserver_archivemanager\nm_mailserver_gluelogic\n\
  m_mailserver_networkconfig\nm_mailserver_routerconfig\nm_mailserver_server\n```\n\
  \n主程序文件（具有 `.m.cpp` 后缀的文件）可能与组件的根名称相同，也可能不同——例如，`m_mailserver_server.m.cpp` 就是，而\
  \ `m_mailserver_administrator.m.cpp` 则不是。\n\n严格来说，对应用程序的唯一要求是应用程序内部的名称不要与它使用的任何库发生冲突。如果发生了冲突，对于应用程序来说通常很容易解决。对于小规模开发，这种响应式的解决是足够的。但在更大规模上，由于可能有成百上千个应用程序被自动构建和部署，这并非最优方案。如果听天由命，当添加新的库组件时，我们将面临意外冲突的风险。除非库和应用程序命名空间在设计上保持语法隔离，否则随着我们代码库的成熟，冲突将继续是一个问题。\n\
  \n\n\n\n\n# 设计规则\n\n应用程序（即应用层“包”）的允许名称必须与所有其他类型的包名称互不重叠。\n\n正如你可能已经注意到的，每个应用程序包的名称都多了一个额外的\
  \ `m_` 前缀。这种选择完全是我们命名规则中一个任意的实现细节（第 2.10 节），它确保了任何应用程序名称都不会与库名称发生冲突^(144)。此外，由于所有的应用程序代码（`.m.cpp`\
  \ 文件中的代码外）必须存在于与包名匹配的命名空间中，因此任何应用程序包符号都不可能与任何库符号发生冲突。\n\n确保应用程序包名称与库包名称互不重叠，可以确保应用程序代码永远不会出现潜在的隐性冲突——例如，随着时间的推移，新的包被添加到现有的包组中（第\
  \ 2.9.4 节）。\n\n# 设计规则\n\n应用程序包内的所有代码必须对该包是本地（私有）的——即*不允许*包外的任何内容依赖于应用层包中定义的软件。\n\
  \n位于应用程序顶层的代码可以具有高度协作性，并且必须保持可变性（第 0.5 节）。鉴于快速生成应用程序代码的压力远大于可重用库代码，至关重要的一点是，我们不能允许其他开发者通过单方面对其他应用程序私有软件的稳定性提出期望，来阻碍这种可变性。应用程序代码可以在同一个应用程序包内的密切相关的\
  \ `main` 程序（即 `.m.cpp` 文件）之间共享；然而，如果代码要在不同的应用程序包之间共享，它必须被重构并*降级*（见第 3.5.3 节）为库软件——无例外。\n\
  \n将所有的顶层应用程序逻辑都放在单个包中具有某些重要优势。应用程序代码的维护由于具有可变性且高度具协作性，可能涉及同时对多个组件进行更改。由于所有这些协作代码都在一个包中，因此可以更容易进行更改和发布。由于所有代码都在一个命名空间中，我们可以避免使用像\
  \ `m_` 这样长且丑的命名空间来限定应用程序代码^(144)。可重用软件受益于短命名，而应用程序命名空间在某些方面是保护性的。\n\n\n\n\n\n# 可测试性\n\
  \n可测试性（或更广泛地说，我们获取反馈的能力）与任何其他工程学科一样，是我们方法论的基石。如果我们无法对其进行测量，就无法知道自己是否做对了，也无法对其进行调整以使其变得更好。在一个极其复杂的系统中尝试获取这种反馈，坦率说，是一件令于力竭的事。通过坚持我们的系统可以被分解为子系统（例如，包组和包），并最终分解为细粒度的原子模块化物理单元（例如，组件），我们使得进行有效的彻底测试成为可能。然而，仅仅这种可分解性属性本身是不够的！在物理聚合的每个层级，都必须存在一种可以进行测试的顺序，使得该层级的每一个物理实体——无论是组件、包还是包组——都可以在不依赖该实体已依赖的内容之外的任何内容\
  \ (1)，或不依赖 (2) 无法独立验证（或以其他方式已知正确）的内容的情况下通过验证。\n\n## 影响与依赖\n\n考虑这一至关重要的治理原则所产生的影响，与我们已经看到的其他几个原则相重叠。例如，一个直接结果是，组件或发布单元（例如，包和包组）之间不允许存在循环物理依赖，因为此类循环中的任何成员都无法脱离其他部分进行独立测试。然而，这条规则涵盖了更为微妙的不可处理性形式。再次考虑图\
  \ 2-50、第 2.6 节，容器向某些具有修改访问权限的非本地类型授予了不明智的远距离友谊。图 2-79a 抽象地展示了一个高层 `manip` 组件，它可以从实质上影响（并可能破坏）低层\
  \ `container` 组件中定义的内部（私有）状态，而在不测试 `manip` 组件本身的情况下，这种影响是无法防御的。由于 `manip` 显然依赖于\
  \ `container`，两者都无法独立对方进行完全测试。\n\n![](img/fig2-79.jpg)\n\n**图 2-79：远距离友谊导致的无界不可处理性**\n\
  \n起初看起来，我们应该只要一起测试两者就可以了。别那么快！如果 `manip` 是一个独立的物理实体，什么能阻止 `manip` 依赖于另一个可能的实质性组件\
  \ `c` 呢？正如图 2-79b 所示，它恰恰依赖于 `container`。我们由可测试性引发的循环将不仅涉及原始的两个组件，现在变成了三个！拥有可测试循环（甚至是实际的依赖循环）并不一定意味着不可处理，只要该循环的大小是有界的（且很小）。遗憾的是，误导性的远距离友谊——讽刺的是，这往往是为了“安全”之名——会导致像图\
  \ 2-79c 那样的无界关联。\n\n## 物理可替换性与封装\n\n虽然跨组件边界的 `modifiable` 私有访问明显违反了我们的分层可测试性要求，但即使是\
  \ `nonmodifiable` 的后门访问也违反了另一个重要原则：`物理可替换性`（参见第二卷第 5.6 节）。也就是说，如果我们对封装的细节进行更改，在对所有相关对象做出相应更改之前，我们将无法检查该更改。\n\
  \n通过坚持`物理可替换性`，我们确保如果对组件进行更改，可以使用具有相同接口的另一个组件替换它，而不影响系统的其他部分。\n\n## 设计规则\n\n**设计规则**\n\
  \n每个组件都必须有一个唯一的 `unique` 测试驱动程序（例如，`.cpp`）。\n\n测试所需的理由，如[图 2-80](#ch02.xhtml_ch02fig80）所示，是为了确保组件不被破坏。当然，我们意识到存在一些广泛使用的框架，它们以不同的方式组织了测试工作……\n\
  \n\n\n\n此外，组件实现的隐式私有知识会扩展到相应的测试驱动程序作者（见下文），但这些知识对于高层组件测试驱动程序的作者来说仅仅是不可用的。\n\n在极少数选择将不稳定的实现细节分到包内各个组件的情况下，我们自然会采用`从属组件`的纯约定用法（参见第\
  \ 2.7.5 节）。\n\n出于类似的原因，除非有迫切的工程理由，否则我们不会在一个组件中放置多个类（参见第 3.1.1 节）。\n\n图 2-81c 展示了关键组件\
  \ `w` 的备选版本 `y`，它复用了一个高度特定但稳定的实现细节 `v`，但用新组件 `x` 替代了对现有组件 `u`的使用（参见图 0-65, 第 0.10\
  \ 节）。此外，假设这个由 `y` 领导的新子系统的出现，是因为 `w` 使用的 `u` 的实现无法在我们当前正在迁移的新平台上构建。根据我们的分层测试要求，为了测试\
  \ `y`，我们必须先测试 `v` 和 `x`。然而，为了在新平台上测试 `v`，我们必须*首先*迁移并构建 `u` 和 `w`。然而，正是我们无法迁移 `u`\
  \ 才促使了 `x` 和 `y` 的创建！^(151) 只有通过持续地按照与底层组件功能完全相同的粒度对测试工作进行分解，我们才能避免由测试引发的意外且可能高昂的耦合。\n\
  \n我们可能可能还想废弃对 `u` 和 `w` 的进一步使用。\n\n最后，我们要求每个组件旁边必须恰好有一个^(152,153) `唯一` 的独立驱动程序文件，用于组件级测试。对于一个足够复杂的组件，我们可能会倾向于将测试工作分布在多个测试驱动程序文件中，如图\
  \ 2-81d 所示。再次，除了对规则结构的渴望外，我们要求将组件的大小和复杂度保持在可管理的范围内。\n\n^(152) 可能会存在一些潜在的异常（例如涉及并发），此时需要调用创建多个进程的自定义测试设备。虽然一个程序启动多个进程通常足够了，但这种自定义必须被构建系统支持，或至少被允许。\n\
  \n^(153) 还应该提到，有时某些代码*不*编译是重要的，特别是在处理 SFINAE 时，这可能需要更复杂的测试设备。\n\n行数和其他类似的尺寸和复杂性衡量标准是相当任意的。然而，从工程角度来看，我们有效测试的能力必须决定我们创建的内容；因此，我们在方法论中采用的组件复杂度上限，仅仅是能够*从单个测试驱动程序*彻底测试的程度（参见第三卷，第\
  \ 7.5 节）。这种特定的标准选择没有任意的硬性限制，产生了一种健康的张力，并能够充分控制组件的复杂度。\n\n### 设计规则\n**组件测试驱动程序（物理上）位于其所测试组件的相同目录中。**\n\
  \n测试驱动程序对于组件的开发和维护是不可或缺的。在我们看来，一直是组件作者——而不是独立的测试人员——对每个组件的可测试性和内在可靠性最终负责。尽管测试驱动程序不具有任何特殊的“私有”编程访问权限，但测试驱动程序的开发者将（且通常必须）对被测试组件的实现拥有深入的*白盒*知识（参见第三卷，第\
  \ 8.1 节）。此外，组件作者有时会对测试驱动程序做出一个比普通客户端群体更强的约，仅仅是为了方便测试。组件与其测试驱动程序之间通常密集且亲密的协作，加上共同所有权，有力地支持了将测试驱动程序放置与其关联组件在相同（例如，包）目录中的物理模块化做法，如图\
  \ 2-80c（上图）所示。^(154)\n\n^(154) 应该提到，对组件进行*黑盒*（或验收）测试也是有用的。黑盒（甚至是*灰盒*）测试（参见第三卷，第\
  \ 8.1 节）往往具有更长的寿命，因为实现可以改变（或演变），而测试仍然有效。\n\n### 设计规则\n**测试驱动程序的层级*直接*（物理）依赖不能超过被测试组件的依赖关系。**\n\
  \n测试驱动程序可以被视为特定组件的扩展，共享其物理特征。鉴于物理依赖的传递性，测试驱动程序自然会继承其关联组件的所有依赖关系。考虑图 2-82a 所示的两个同级组件\
  \ `u` 和 `v`。图 2-82a 这两个组件都不依赖于任何（本地）组件（参见第 1.10 节），因此它们在本地都是 1 级。\n\n![](img/fig2-82.jpg)\n\
  \n**图 82：避免测试驱动程序引起的组件依赖**\n\n现在考虑图 2-82b 所示的允许 `v` 的测试驱动程序依赖 `u` 的影响。组件 `v` 本身并不依赖于\
  \ `u`，但为了满足层次测试要求，我们被迫先测试 `u` 再测试 `v`。测试驱动程序不再*反映*其所测试组件定义的物理关系，而是*规定*了这些组件之间允许的关系（坏想法）。从可测试性的角度来看，组件\
  \ `v` 现在隐式地（且过分）处于 2 级。\n\n现在假设我们改为允许组件 `u`（本身）依赖于组件 `v`，如图 2-82c 所示。效果与图 2-82b\
  \ 几乎是镜像，不同之处在于，与测试驱动程序引起的 `v` 对 `u` 的依赖不同，这里 `u` 对 `v` 的依赖是显式的。隐式测试驱动程序引起依赖的问题在我们把图\
  \ 2-82b 中的隐式依赖与图 2-82c 中的显式依赖结合，从而形成如图 2-82d 所示的组合测试驱动程序引起的*循环*依赖时变得具体化了；现在，`u`\
  \ 和 `v` 都无法独立对方进行测试。\n\n为了确保图 2-82 中的情况 (b) 永远不会变成情况 (d)，我们要么重构 `v` `.t.cpp` 以重新建立情况\
  \ (a)，要么将依赖显式化（在 `v` `.cpp` 中带有“虚拟”的 `#include <``u` `.h>` 指令^(155)），从而导致图 2-82e\
  \ 中的情况。\n\n^(155) 正如稍后我们将所示的（下文），当 `#include` 仅用于测试目的时，我们通常通过如下形式的注释来指示：\n\n```\n\
  // v .cpp\n\n// ...\n\n#include <u .h> // 仅用于测试\n\n// ...\n```\n\n\n\n\n另参见 第 3.3.6\
  \ 节；第二卷第 4.9 节；第三卷第 8.6 节。\n\n## 2.14.4 针对测试的本地组件依赖的相对导入\n\n给定组件测试驱动程序对同一包内另一个组件的使用，根据其使用的性质，可以分为三个不同的类别，正如图\
  \ 2-83 中抽象总结的那样。我们还会在图 2-84 中提供三个对应的具体示例。如图 2-84a（此处应为 ch02fig84-a）所示，`odet::Time`\
  \ 在其接口中（以及实现中）使用了 `odet::TimeInterval`，这明确暗示了预处理器指令\n\n![](img/fig2-83.jpg)\n\n\
  **图 2-83: 测试驱动程序中本地组件的抽象使用**\n\n¹⁵⁶ 除非，这种用法被专门设计为“仅限名称”（第 1.7.5 节）。\n\n¹⁵⁷ 注意，组件接口所隐含的任何使用都足以允许其测试驱动程序对其进行使用，因为重构测试驱动程序的成本（在接口发生变化的相对罕见的情况下）可能是微不足道的（例如，与必须重构整个客户端基数相比），而且无论如何，重构该组件测试的成本是有边界的（即仅限于那一个测试驱动程序）。这对于假定传递性包含（第\
  \ 2.6 节）来说并非如此，后者的门槛要高得多——即只有公共继承（Is-A 关系）才允许客户端组件省略直接包含（基类的）头文件。\n\n```\n#include\
  \ <odet_timeinterval.h>\n```\n\n已经出现在组件 `odet_time` 源代码的某处了。因此，我们没有问题在 `odet_time.t.cpp`\
  \ 中重复该指令。\n\n接下来假设 `odlc::BitArray` 被用于 `odlc::Calendar` 的实现中，如图 2-84b 所示。我们可能出于某种原因选择不再访问与\
  \ `odlc_bitarray` 相关的功能，而是仅使用它来验证其在 `odlc_calendar` 内部的正确使用。由于这种使用尽管仅在实现中，但是实质性的，因此一个*直接*依赖关系——至少目前——必然通过以下指令建立了：\n\
  \n![](img/fig2-84a.jpg) ![](img/fig2-84b.jpg)\n\n**图 2-84: 测试驱动程序中使用本地组件的示例**\n\n\
  ```\n#include <odlc_bitarray.h>\n```\n\n出现在 `odlc_calendar.h` 或 `odlc_calendar.cpp`\
  \ 的某处。因此，我们的方法论允许 `odlc_calendar.t.cpp` 效法如此。然而，如果 `odlc_calendar` 的实现发生变化，使其不再依赖于\
  \ `odlc_bitarray`，我们的分层可测试性要求将要求测试驱动程序本身也必须经过重构。\n\n最后，考虑两个物理上独立但在语义上高度协作的组件，例如一对具体的编码器/解码器。像任何其他物理上独立的组件一样，我们能够独立地测试每一个组件。我们希望确保第一个组件（编码器）在不依赖于第二个组件（解码器）的情况下正常工作。然后，我们还希望独立于第一个组件来测试第二个组件。\n\
  \n在我们独立测试了两者之后，我们都很清楚，如果一起测试这两个协作组件，会睡得更安稳。对于编码器/解码器对，这意味着还要让大量的生成的测试数据通过编码器，然后通过解码器，并验证最终的输出与初始输入匹配（参见第三卷第\
  \ 8.6 节）。\n\n因此，我们偶尔会做出一个工程决策，允许测试驱动程序依赖于另一个本地组件，即使被测组件本身并不物理上需要依赖于该另一个组件。在这种情况下（例如，图\
  \ 2-84c），然而，我们将*承认*这种微妙的隐含不灵活性（例如，图 2-82b，第 2.14.3 节），通过引入如下代码：\n\n![](img/pro2-32.jpg)\n\
  \n以在组件本身中使这种故意的不灵活性显式化（例如，图 2-82e，第 2.14.3 节）。^(158) 相互测试将放置在（现在）更高层次组件 `bslx_byteinstream`\
  \ 的测试驱动程序中。通过这种方式——借助于由元数据驱动的自动化构建系统（参见第 2.16 节）——我们确保没有微妙的测试驱动程序引起的组件循环意外进入我们的包。\n\
  \n^(158) 注意，通过遵循组件设计规则（第 2.6 节）以及对在文件或命名空间范围内定义的对象的运行时初始化（参见第二卷第 6.2 节），此类“不必要的”包含指令不应影响生成的编译单元，或在部署的软件中引入任何额外的依赖（例如，参见图\
  \ 1-11）。\n\n## 2.14.5 允许的跨包测试驱动依赖\n\n当涉及依赖其他包组件时，对“无额外依赖”的严格解释可以稍微放宽。记住，包的依赖被描述为对组内的其他包（第\
  \ 2.9 节），或者——对于独立包——对 UORs，而不是对那些其他包中的特定组件。如果一个包 `q` 对另一个包 `p` 的*直接*依赖出于某种原因被明确允许，那么\
  \ `p` 中的所有组件都是可用的。因此，我们允许使用 `p` 中的每个组件来测试 `q` 中的任何组件——即使 `p` 中的这些特定组件没有任何一个是被被测的\
  \ `q` 组件实际所需的。\n\n例如，考虑图 2-85 所示的包 `xyza` 支持一个用于通用服务的*协议*（纯抽象接口），以及该服务的若干具体实现。^(159)\
  \ 我们假设协议 `xyza::Service` 定义在组件 `xyza_service` 中。包 `xyza` 中还提供了该协议的几个具体实现，包括 `xyza::TestService`，它是专门为方便使用\
  \ `xyza::Service` 协议的客户端测试设计的。图 2-85 还显示了更高层次的包 `xyzb`，它定义了基本的“客户端”组件，其中某些组件（如 `xyzb::Client5`）在接口使用了\
  \ `xyza::Service`。\n\n^(159) 注意，即使是纯抽象接口也需要适当的组件级测试驱动程序（参见第三卷第 7.2 节和第 10 章）。\n\n\
  \n\n\n在第三卷第 9 章中，为每个抽象接口持续提供一个经过插桩且易于控制的 `dummy`（即“mock”）实现，以解耦并协助对客户端进行有效测试的这种通用技术在第三卷中得到了讨论。在这里，我们简单地观察到，尽管\
  \ `xyzb_client5` 组件在编译、链接或运行时不需要来自 `xyza_testservice` 的任何代码，但为了进行测试，我们*确实*需要它。由于我们对跨包边界的依赖定义较为粗略，因此客户端测试驱动程序对这种解耦的测试实现的使用不仅是被允许的，而且是鼓励的！没有需要使用仅用于测试的\
  \ `#include` 指令来显式化跨包边界的组件依赖；然而，如果测试驱动程序使用了其他包中的组件，而该组件的*直接*依赖未在元数据中显式授权（参见节 2.16），这仍然是禁止的。\n\
  \n与包类似，对包组的依赖被描述为针对整个组，而不是组内的特定包或组件。因此，只要当前包组或孤立包在元数据中显式声明了预期的*直接*依赖，我们就不犹豫在测试驱动程序中引入对低级包组中组件的新实际依赖。图\
  \ 2-86 总结了跨包组的各种允许的测试驱动依赖。\n\n![](img/fig2-86.jpg)\n\n**图 2.86：组件测试驱动程序*允许*依赖的摘要**\n\
  \n更通用地说，当组件位于一个聚合（aggregate）中时，该聚合允许的依赖范围必须显式说明。该聚合中的所有组件和测试驱动程序共享相同的*允许*依赖范围。因此，如果该聚合中的任何组件被允许依赖于外部具有架构意义的软件（即组件、包、包组或不规则的\
  \ UOR），那么该聚合中的每个组件和每个测试驱动程序都有权同样这样做。\n\n### 2.14.6 减少测试驱动程序对外部环境的依赖\n\n**设计规则**\n\
  \n**测试驱动程序对并非我们支持的（可移植）构建环境部分的外部数据或其他设备的依赖，不得超过被测试组件的依赖。**\n\n我们开发基于组件软件的目标之一，是消除那些毛刺和阻碍，这些毛刺可能会阻碍开发者在各种变不利的情况下继续使用和积极维护组件的测试驱动程序。即使在正常情况下，在运行时依赖外部资源（即超出被测试组件本身所需的资源）的测试驱动程序，通常比没有此类外部依赖的完全自包含的测试驱动程序更难理解和维护。\n\
  \n现在考虑维护一个组件集合的额外复杂性，其中测试驱动程序可能需要对外部资源（如环境变量、数据文件、远程进程或持久化存储）进行事后的（ad hoc）访问。开发者不仅需要维护测试驱动程序与这些资源的交互，还需要维护这些资源本身。这项任务通常不是易事，并且极易（读到这里请注意，是“*会*”而不是“可能会”）会阻碍我们的测试工作。此外，如果无法将一个或多个运行时测试资源迁移到新平台，很可能会削弱我们在该平台上执行有效测试的能力。\n\
  \n例如，假设我们正在测试一个日历缓存组件（例如，参见节 3.12.10），该组件在构造函数的接口中使用日历加载器协议（节 1.7.5）来按需获取新的日历信息，如图\
  \ 2-87 所示。缓存使用*协议*（纯抽象接口）类是一项重要技术（参见节 3.11.5.3），它能够：(1) 实现缓存按需填充方式的终极灵活性，并且 (2)\
  \ 避免对任何特定外部资源的甚至是间接链接时依赖。\n\n![](img/fig2-87.jpg)\n\n**图 2-87：避免测试驱动程序对外部资源的额外依赖**\n\
  \n鉴于我们刻意解耦了基于组件的子系统以避免对任何特定数据源的直接依赖，我们必须确保测试驱动程序（例如，针对日历缓存组件）不使用具体的“测试”实现（例如 `TestFileCalendarLoader`），该实现直接或间接地依赖于外部数据资源或任何不可移植的环境设施。相反，我们希望以可移植的方式正确封装测试实现——要么在客户端测试驱动程序内部（例如\
  \ `TestDataCalendarLoader`），或者理想情况下，在一个单独的、独立可重用的组件中，例如 `bdlt_testcalendarloader`（未显示），我们鼓励这样做，特别是对于像广泛使用的协议，例如用于内存分配的协议（参见第二卷第\
  \ 4.4 和 4.7–4.10 节）。\n\n根据我们的经验，手动维护和管理外部资源的负担阻碍了组件级测试驱动程序的有效、一致使用。开发者被困于设置数据库权限或调度远程进程等平庸的活动中。随着时间的推移，这些管理责任被忽视了，设计不当（不规则的）测试程序不可避免地被废弃。\n\
  \n因此，我们特意*不*依赖于外部数据源（例如平面文件或数据库）或任何超出组件本身已依赖的任何外部资源。\n\n### 2.14.7 坚持统一的（独立的）测试驱动程序调用\n\
  \n**指南**\n\n**每个测试驱动程序应有一个定义良好的调用接口子集，且该接口在企业内部是通用的。**\n\n我们测试工作的重要目标是将开发期间使用的组件级测试驱动程序无缝集成形成自动化测试套件。我们选择将测试驱动程序组织成独立的、可运行的测试用例（参见第三卷\
  \ 10.2 节），既是为了提高人类认知，也是为了通过并行化缩短测试时间(160,161)\n\n^(160) 并行处理可以分固定大小进行（例如每次 10 个），或者在对数时间内确定测试用例的总数。\n\
  \n^(161) 读者应该意识到，如今越来越多的人选择采用通过一个单一的可执行文件运行多个组件的测试（例如一个包或 UOR 内的所有组件）。这些驱动程序（如 `Boost.Test`\
  \ 和 `GTest`）具有并行测试的能力。这种策略虽然由于测试之间的全局状态损坏存在缺点，但它能更快地运行测试套件，因为它通过仅启动新线程而不是启动全新的进程来避免了开销。\n\
  \n为了方便自动化，更为了开发者的流动性（节 0.7），我们要求所有测试驱动程序遵循通用的标准调用接口，以便回归测试机使用。该接口必须能够 (1) 运行测试程序实现的所有测试用例，并且\
  \ (2) 报告运行每个测试用例时遇到了多少错误。\n\n考虑以下标准调用接口的示例：\n\n```\n$ a.out [ 1 .. N ] [ ... ]\n\
  ```\n\n\n\n\n\n单个测试程序 (`a.out`) 支持 `N` 个测试用例，关联的数字从 1 开始。当使用超出有效测试用例范围的用例编号运行测试程序时，将返回一个标准的负值（例如\
  \ –1），但 0 是测试用例 `N` 的“别名”。否则，将返回所遇到的非负错误数量（取决于实现定义的最大值），其中返回值为 0 表示成功。鉴于此接口，任何回归测试机制都可以使用图\
  \ 2-88 所示的简单 Perl 代码来运行一组测试驱动程序。^(162)\n\n^(162) 图 2-88 所示的 Perl 脚本编写于（约 2006 年），仅用于说明之目的；它由\
  \ Bloomberg BDE 的 Mike Giroux 进行了审查（约 2019 年），随后对其进行了压缩以为这个简短的脚注留出空间。我在 Silicon\
  \ Design Labs (SDL) 工作期间创建了该（Shell?）脚本的最早版本（约 1989 年），该地最终被 Mentor Graphics 收购。第一个用于生产环境的\
  \ Perl 版本是由 Bear Sterns & Co, Inc 的 F.A.S.T.（金融分析与结构化交易）小组的 Eugene Rodolphe 编写的（约\
  \ 1997 年）。第一个 Bloomberg 生产环境版本（约 2003 年）同样用 Perl 编写（目前约 623 行），由当时作为 BDE 成员的 Peter\
  \ Wainwright 编写。第一个 Python 实现由前 BDE 成员 Chen He 创建的（约 2014 年）。随后，该脚本的一个具有适当健壮性（robust）的版本由同样来自\
  \ BDE 的 Oleg Subbotin 于（约 2015 年）将其产品化并公开；此版本（`subbotin15`）已整个 Bloomberg 的生产环境中广泛使用。\n\
  \n![](img/fig2-88.jpg)\n\n**图 2-88：用于合并测试驱动结果的简单 Perl 脚本**\n\n这种标准调用接口提供的统一性，使得在无需了解测试驱动程序或被测组件内部细节的情况下即可运行驱动程序。尽管某个特定的测试程序可能为了开发目的而具有特定的定制（见第三卷第\
  \ 10.1 节），但对这些参数的处理和解释是在标准调用接口之外的，且不应在夜间（即连续）回归测试中依赖它们来验证组件。换句话说，责任在于测试驱动程序的作者，他们需要在驱动程序本身中编码在验证其关联组件时所需的适当\
  \ `default`（默认）输入和参数，以确定此性地验证其关联的组件。\n\n### 指南\n\n**每个测试驱动程序的“用户体验”理想情况下在整个企业范围内应该是标准的。**\n\
  \n我们所指的“用户体验”是指，总体而言，开发者会认为测试驱动程序的组织和操作在很大程度上是统一的，并且独立于正在测试的特定组件级功能或其所属的包。我们几十年来一直使用的特定组织方式和面向开发者的操作方式，以及我们继续倡导的组件级测试驱动程序，在第三卷第\
  \ 10 章中进行了详细描述。通过遵循一致的布局和面向开发者的接口，当开发者从一个项目转向另一个项目、从一个开发小组转向另一个小组时，这极大有助于理解。\n\n\
  ### 2.14.8 节总结\n\n总结来说，分层测试要求的核心在于确保在我们编写的每个组件所依赖的一切内容，在开始测试该组件之前都已经过独立且充分的测试。有效测试并获取反馈的能力是工程的一项基本工具，软件工程也不例外。为此，我们要求每个组件级测试驱动程序完全专注于与其唯一关联的单个组件。鉴于每个组件级测试驱动程序对其关联的组件拥有排他的详尽知识，每个此类驱动程序在物理上都与该组件位于同一个包目录内（具有相同的根名称）。\n\
  \n超过被测组件的测试驱动程序依赖（例如对外部数据库的依赖）会破坏移植性，因此必须坚决避免。对于包内的其他组件，内在依赖（例如在被测组件接口中定义的依赖）无需担心，而仅存在于实现中的依赖则应该更仔细地考虑。另一方面，测试驱动程序对给定包内组件的依赖如果超过了被测组件，则是不允许的；如果我们认为这种测试驱动程序依赖是必要的，我们会在组件自身的\
  \ `.cpp` 文件中通过适当说明的 `#include` 指令一致地将该依赖显式化。然而，对非本地实体的组件测试驱动程序依赖则没有那么严格——组件本身的依赖也是如此。\n\
  \n最后，我们必须为我们的企业级构建系统确保一种测试每个组件的方法。只有当我们坚持使用每个组件级测试驱动程序调用接口的统一子集，以充分测试其对应的组件时，这才是可能的。此外，我们还希望为组件级测试驱动程序建立标准的组织结构和一致的外观，以便我们的软件开发者从一个开发项目或小组轻松地迁移到另一个。\n\
  \n## 2.15 从开发到部署\n\n当我们努力组织源代码以尽可能的减少自己的开发负担时，我们也必须确保能够以最利于所有潜在客户端消费的方式对其进行部署。源代码在开发期间如何组织，以及最终如何部署到我们所有支持的生产环境，本质上是两个独立的问题。为了最大化部署软件的灵活性，这两个独立的关注点不能进行不必要的耦合在本节中，我们将讨论我们如何刻意保持架构与任何后续仅实现的部署细节分离，以及这些部署细节可能如何以及为何体现。\n\
  \n我们必须预见到，我们自己的专有库软件最终可能会变得比我们的应用程序客户端可能使用的许多第三方库大得多。因此，我们将预先将库软件分割为适当大小的架构设计单元（2.2.20\
  \ 节），高级库和应用程序客户端都可以分别选择依赖这些单元。因此，我们希望确保这些 UOR 在架构上仅受限于其包含的逻辑实体之间关系所隐含的内在物理依赖（1.9\
  \ 节），而而绝不是基于其预期部署方式的权宜。\n\n#### 2.15.1 软件的灵活部署不应受到损害\n\n**设计规则**\n\n**在 `#include`\
  \ 组件头文件时，不允许使用相对或绝对路径名称（即：禁止目录名称）。**\n\n\n\n\n部署的完全灵活性要求我们能够在文件系统的任何位置安装和使用我们的每个库\
  \ UOR（单元组织单元）。与许多流行库采用的自上而下的目录结构形成鲜明对比的是，我们故意避免将单一根结构硬编码到我们的通用、可重用库源码中。此外，鉴于库 UOR\
  \ 是多个应用程序和其他库可能所依赖的实体，我们希望确保能够根据需要部署每个 UOR，包括能够将头文件和对象文件分别混合在任意的包含目录和库归档中。在我们的源代码中对开发目录结构的任何硬编码依赖，都将迫使在部署时采用相同的结构，导致我们的软件产生不必要的僵活性——特别是——这会阻止为了部署目的对组件进行任意的重新打包。\n\
  \n在一个非常老旧（已不再支持）的平台上，当我们把某家大型企业的所有头文件并放在单个 `include` 目录中时，我们遇到了中等的可扩展性问题；我们知道在任何其他平台上都未遇到过这种限制。\n\
  \n### 2.15.2 拥有唯一的 `.h` 和 `.o` 名称是关键\n\n为了让我们避免硬编码目录路径的方法可行，确保企业范围内文件名的唯一至关重要。具有不一定唯一的头文件名的软件可能需要目录路径限定，或者在\
  \ `#include` 指令中使用（已弃用的）依赖于实现的双引号（`\"\"`）语法（见第 1.5.1 节）。幸运的是，由于我们对组件的定义（第 2.6 节）及其相关命名法（第\
  \ 2.4 节），每个组件的 `.h` 文件和相应的 `.o` 文件自然会在整个企业范围内是唯一的（第 2.8、2.10 节）。\n\n### 2.15.3 软件组织在开发过程中会变化\n\
  \n取决于我们精确的开发流程，我们在开发期间为自身使用软件的方式可能会有所不同。作为一个经典的（现在主要用于教学的）示例，假设我们正在增强我们有的包组 `xyz`\
  \ 中包 `xyza` 的组件 `xyza_foo`。同组内其他更高层包中的组件可能已经在使用该组件，因此，在组件（以及包中的其他其他组件）通过验证之前，我们不希望通过中间更改来影响它们。因此，在开发期间，组内的高层包不直接访问组件源码，而是继续查找位于各自独立包的\
  \ `include` 和 `lib` 目录中的当前导出的 `.h` 和 `.o` 版本。当一切被认为顺利后，包的新快照会被推送到这些目录中。\n\n尽管我们不再在大规模软件开发过程中在源码目录结构内部署软件，但我们坚信，这样做不应被我们的方法论以任何方式排除。\n\
  \n同样，有时我们可能需要对组内的包进行重大更改，这些更改完成后，对该组的外部客户端可能产生很小或没有实际影响，但在升级期间可能会产生破坏性。一旦我们在组内再次拥有了一组一致的包，成员包\
  \ `include` 目录中的每个头文件都会被复制到该组的单个 `include` 目录中，每个 `.o` 文件都会被移动到 `lib` 目录下的单个组级库归档中。如果没有对（至少是组范围内）唯一组件文件名的保证，在开发过程中就不可能进行这样的重新打包。显然，这种特定方法是简化的，而且绝不是构建基于组件的软件开发过程的唯一（甚至不是最好）方法；然而，我们认为，这种过程不能被我们的源码组织*先验*地排除。\n\
  \n### 2.15.5 企业范围内唯一的名称有助于重构\n\n随着时间的推移，选择将某项功能迁移到不同的（例如更底层的）UOR（例如，以便更广泛地共享）并不罕见。理想情况下，将创建一个新组件来实现与原始组件相同（或等效）的功能，但具有一个新的命名上凝聚的名称以指示其新的物理位置。原始组件将被废弃，在所有客户端都迁移到新组件后（经过若干次发布），旧组件将被移除。\n\
  \n这种重构也是一种称为*降级*的层级化技术（见第 3.5.3 节）。\n\n但在实践中，有时正常的、多版本的弃用过程是不可行的。例如，当某个特定值或服务在函数接口中被广泛使用时，拥有多个\
  \ C++ 类型（称为*词汇类型*）来表示它几乎总是不理想的（见卷卷 II，第 4.4 节）。在这种情况下，可能需要原样移动定义该类型的组件——即不重命名它——然后在以后某个方便的时间（例如在代码冻结期间）对所有已知客户端进行全局重命名。如果没有最初对所有\
  \ UOR 唯一文件名的保证，这种临时的重构技术将无法保证有效，因为源目录中的文件可能会与目标目录中同名的文件冲突。再次，这种（临时的）务实的权宜之计不应被我们组织软件的方式所排除。\n\
  \n### 2.15.6 软件组织在仅构建过程中也可能变化\n\n即使在仅构建构建过程中，什么是可访问的、哪些是不可访问的都可能变化。假设我们正在包 `xyzb`\
  \ 中开发组件 `xyzb_bar`，它依赖于包组 `xyz` 中的包 `xyza`，并且想要测试 `xyzb_bar`。一种方法是将整个包组作为一个 UOR\
  \ 进行构建——就像通常部署的方式——并针对它构建测试驱动程序 `xyzb_bar.t.cpp`。然而，这样做可能会无意中允许测试驱动程序——甚至组件本身——访问同一包组内更高层包的组件的\
  \ `.h` 或 `.o` 文件，从而导致违规依赖未被检测到。事实上，同样的担心也适用于对同一包内高层组件的依赖。\n\n为了防止此类依赖错误，我们故意选择单独构建组内的每个低层包。然后，我们为当前包提供一个本地视图，该视图仅由当前组件本身的\
  \ `#include` 指令允许依赖的本地组件子集组成——即，故意排除测试驱动程序中的组件（见第 2.14.3 节）。通过这种方式，我们毫无疑问地确保了只有旨在提供的组件是可以访问的。因此，重新打包我们的库软件的能力可以促进一个稳健的构建和测试过程，以确保只有正确的内部物理依赖。\n\
  \n### 2.15.7 部署灵活性即使在正常情况下也是需要的\n\n\n\n库软件在常规部署到生产环境时的形式，通常与其为了开发和构建目的而组织的方式有显著不同。在开发阶段，我们的首要目标之一是模块化；而在生产环境中，则是效率。在开发过程中，我们选择为每个包和\
  \ UOR 组织独立的、对应的库目录和 `#include` 目录。然而，在生产环境中，作为一种编译时优化，我们可能会将所有专有头文件放在一个包含目录（或少数几个）中，从而尽可能地减少所需的\
  \ `-I` 规则数量。如果没有前面讨论过的全公司组件文件名唯一性，这种做法是不可能的。\n\n参见 `lakos96`(#ref.xhtml_ref55)，第\
  \ 7.6.1 节，图 7-21，第 519 页。\n\n### 2.15.7 灵活性对于实现自定义部署也同样重要\n\n我们与特定客户的关系性质也可能对软件的部署方式产生重大影响。对于内部使用，我们通常会暴露套件库中的所有内容。然而，由于与外部客户有特殊的业务关系，我们可能会发现，仅从海大的、分级组织的库软件仓库中提供支持特定应用程序（或此类程序）所需的高度筛选子集是有利润的。\n\
  \n强制客户重新创建我们庞大的、全公司范围的、基于包组的目录结构，只为了接收这个可能稀疏的子集，可能是不方便的。鉴于这种定制化的分发，事实证明仅仅是为了方便，或者可能是出于安全或法律原因——将我们整体支持功能的这一“薄切片”重新封装为单一库（例如\
  \ `.a` 或 `.so`）和一个单一头文件目录（`*.h`）是很有用的，而如果没有企业范围内唯一的组件名称，这一切都是不可能的。\n\n### 2.15.8\
  \ 头文件内样式渲染的灵活性\n\n还有其他实际原因导致我们可能为不同的客户以不同的方式部署代码。例如，我们历史上偏好的注释风格是将是将（例如函数）契约直接放置在声明的下方并进行缩进：\n\
  \n```\nbool isEven(int value);\n\n // 如果指定值能被 2 整除，则返回 'true'\n\n // 否则返回 'false'。\n\
  ```\n\n近年来，工具出现了一种趋势（这可能受到其他未能分离纯声明与定义的语言的影响），它们倾向于期望记录函数契约的注释位于函数声明的正上方并左对齐：\n\n\
  ```\n// 如果指定值能被 2 整除，则返回 'true'，\n\n// 否则返回 'false'。\n\nbool isEven(int value);\n\
  ```\n\n提供具有另一种注释风格的头文件可能成为某些客户真正的生产力提升器。然而，许多开发者，尤其是那些直接从源代码工作的开发者（因此不需要此类工具），往往倾向于（某些甚至强烈倾向于）我们偏好的（位于下方并缩进的）注释风格。无论我们最终选择如何部署库，我们自然会继续按照自己已经习惯的方式进行开发，而且这种做法是有充分理由的（参见第\
  \ 2.15.3 节）。但是，遵循我们偏好的开发风格并不会阻止我们以各客户所需的任何等效形式部署库。\n\n### 2.15.9 库的部署方式在架构上从未具有意义\n\
  \n**观察**\n\n**在开发期间（从架构上）必须假设的 UOR 粗粒度物理往往超过了部署软件的粒度。**\n\n在设计可移植、可重用的软件时，对目标平台或软件最终的部署方式做出任何假设时都必须谨慎，并为所谓的最坏情况做打算。因此，从架构角度来看，我们的设计就好像每个\
  \ UOR 都是原子的——即，如果我们依赖于一个 UOR，我们必须允许依赖于其全部的可能性。然而，这些物理实体在部署后的实际粒度可能会根据平台和技术而发生巨大变化。因此，开发期间使用的极保守的物理粒度假设通常比部署后实际实现的粒度要粗糙得多。\n\
  \n例如，当我们将软件构建为静态库（`.a`）时，通常只有从 `.a` 中需要的那些单个 `.o` 文件会被提取到最终的可执行文件中。另一方面，当我们将软件构建为共享库（`.so`）时，每个共享库中封装的所有代码通常会以原子化的方式被拉入可执行文件中。因此，我们可能会根据库技术（例如静态或共享）以及特定平台（如硬件、操作系统和编译器）来进一步划分我们部署的库。然而，我们选择如何部署软件，必须与其架构解耦。\n\
  \n事实上，在某些平台上，使用适当的编译器设置，仅包含从给定 `.o` 中所需的单个符号定义。\n\n### 2.15.10 出于工程原因对部署软件进行划分\n\
  \n**设计规则**\n\n**任何仅出于部署目的而采用的额外划分不能在架构上具有意义。**\n\n库有两种类型：架构库和组织库。架构库是一个 UOR，例如包组（第\
  \ 2.9 节），它在概念上是不可分割的。然而，仅作为一种优化，发布和部署工程师可能会将一个特定的 UOR 划分为独立构建和发布的区域。此类区域（如子包，第 2.11\
  \ 节）在本质上是组织性的，而不是架构性的；也就是说，它们是部署过程中的一个实现细节。这些区域不能被显式地称为任何设计的一部分，因为 (1) 它们通常不是唯一的，(2)\
  \ 它们可以在不同平台或技术之间变化，并且 (3) 可能会频繁且在不通知的情况下更改。\n\n例如，假设我们有一个包组 `xyz`，由四个大包组成：`xyza`、`xyzb`、`xyzc`\
  \ 和 `xyzd`，如图 2-89 所示。通过经验确定，绝大多数客户只需要 `xyza` 和 `xyzc` 包（不需要 `xyzb` 或 `xyzd`）。对于静态库（`.a`）来说没有问题；只有包组\
  \ `xyz` 中需要的组件 `.o` 文件会被合并到最终程序中。然而，当使用典型的共享库技术部署时，所有四个包中的每个组件的 `.o` 都会被合并到运行程序中。\n\
  \n**图 2-89：部署期间包组 `xyz` 的组织划分**\n\n\n\n\n\n作为部署过程的一部分，构建和发布工程师可能会选择将图 2-89 中的包组划分为两个（或多个）区域，例如所示的\
  \ `xyz.1` 和 `xyz.2`。唯一的要求是 UOR 内部的这些区域（即使划分包内的组件）必须是可分层的（levelizable）：这样一来，就可以用一组连续的（见下文）唯一区域库来替换代表整个\
  \ UOR 的库。尽管这些区域库（例如 `xyz.1.so` 和 `xyz.2.so`）作为独立的命名物理实体存在，^(168)，但在架构上必须无法通过方式引用它们。只有通过将此类仅用于组织结构的实体的名称对构建系统私有化，我们才能在新的经验信息可用时，自由地对（重新）优化我们部署的软件。\n\
  \n^(168) 回想一下第 2.2.12 节，我们能够以类似的方式划分 `.cpp` 文件，因为组件中的 `.cpp` 文件，特别是库归文件（`.a`）中的\
  \ `.o` 文件，绝不被认为是*具有架构意义的*。\n\n值得再次强调的是，构建和发布工程师在部署期间创建的组织划分——根据定义——在本质上不是架构性的。特别是，我们绝不能尝试将此类组织划分作为避免\
  \ UOR 之间循环或其他不可避免的物理依赖的手段（UOR 它们上必然是架构上原子的）。再次参考图 2-89，考虑一种场景：一个孤立的包 `a_xml` 依赖于包组\
  \ `xyz` 中的包 `xyza`。假设我们后来发现 `xyzd` 可以受益于依赖在 `a_xml` 中实现的功能，这将导致 UOR `xyz` 和 UOR\
  \ `a_xml` 之间产生循环物理依赖。正如我们在第 2.2.24 节、第 2.4.10 节、第 2.8.2 节以及第 2.9.1 节中所知的，这种循环物理依赖是被严格禁止的。\n\
  \n人们可能会天真地认为，我们可以通过简单地声明包组 `xyz` 的区域 `xyz.2` 允许依赖 `a_xml`，而 `a_xml` 反而仅允许依赖包组 `xyz`\
  \ 的区域 `xyz.1`，并分别发布这两个区域来解决该问题。内部链接行现在可能如下：\n\n```\n$ ld ... -lxyz.2 -la_xml -lxyz.1\
  \ ...  (坏主意)\n```\n\n然而，请注意，一个外部库归文件现在不幸地位于单个架构上原子实体 `xyz` 的两个组织区域*之间*。尽管这种权宜之计对门外汉听起来可能可行，但它是极其不明智的。\n\
  \n一旦我们允许 UOR 的划分在架构上可访问，它们自然就不再是组织性的了。我们无法无法通过更改划分的构成来优化我们的部署，而不会影响架构的正确性，甚至可能影响构建的成功！正是由于组织实体和架构实体之间的这种区别，使我们能够*独立于*我们的开发架构来配置我们的部署组织。无论这多么诱人，我们*必须*抵制让纯组织实体获得架构地位。在我们基于组件的开发方法论中，唯一具有架构意义的物理实体必须是组件（第\
  \ 2.5 节–第 2.7 节）、包（第 2.8 节）、包组（第 2.9 节）以及当然，非基于组件的 UOR（第 2.12 节）。\n\n### 2.15.11\
  \ 出于业务原因划分部署软件\n\n最后，稳定性在我们的部署策略中可能起着重要作用。想象一下，我们基础设施中某些架构部分的区域在本质上是稳定的，并且多年没有发生变化。现在想象，新的相关功能（在逻辑上是该架构单元的一部分，但实现在单独的组件中）正在积极开发中。对库当前“版本”满意的客户不需要重新构建，可能甚至不需要强制重新测试^(169)，仅仅因为它们实际上并不依赖的某个“紧邻此处”的东西发生了变化。\n\
  \n^(169) 例如，政府机构（如证券交易委员会 SEC）可能要求每当库的时间戳发生变化时，对某些与交易所相关的软件进行特定期间的重新测试。\n\n任何新组件——即使它们在逻辑上与给定\
  \ UOR 中的其他稳定组件位于相同的包中——也必然（物理上）位于所有稳定软件之上。事实上，出于部署的考虑，构建和发布工程师可能会在划分之前，仅根据组件级依赖关系将给定包组的所有包扁平化。\n\
  \n例如，考虑图 2-90a 所示包组 `xyz` 中的初始包 `xyza` 和 `xyzb`。该包组的客户目前使用 `libxyz.a`，其中某些人不想或无法负担升级。现在想象两个新组件\
  \ `xyza_comp3` 和 `xyzb_comp3` 分别添加到包 `xyza` 和 `xyzb` 中，如图 2-90b](#ch02.xhtml_ch02fig90)所示。与其修改部署的\
  \ `libxyz.a` 以包含新软件（从而影响其时间戳），我们可以部署一个代表新增软件区域的第二个库 `libxyz.1.a`。注意，这两个区域是可以分层的并非巧合，因为现有的稳定软件永远无法回溯（向上）新添加的组件。\n\
  \n![](img/fig2-90.jpg)\n\n**图 2-90：跨包边界的稳定性重新打包**\n\n这里为了在部署期间实现绝对、不可争议的稳定性而使用的划分——一如既往——是纯组织性的，对开发中软件的架构设计没有影响。当然，我们还有其他更传统的方法来确保部署软件的新版本不会破坏现有客户——例如通过组件级测试（见第三卷）。然而，通过将（架构上原子的）UOR\
  \ 的稳定部分和活动开发部分作为独立的物理库部署，我们可以在某些特殊情况下避免或至少推迟会引起不必要混乱的库更改。\n\n### 2.15.12 节总结\n\n\
  \n\n\n\n总结一下：通常情况下，开发任务是架构性的，而部署任务是组织性的。健全的开发流程必须确保构建和发布工程师能够自由使用额外的情境和随时间变化的知识（涉及平台、构建目标和用法），来配置软件，以便供所有客户端进行最佳消费。然而，为了保持这种灵活性，至关重要的是开发者不要在\
  \ `#include` 指令中硬编码开发目录结构，也不要尝试依赖瞬时的部署产物，否则优化重新部署的能力将迅速消失。同时，开发者不应因为特定的部署配置而放弃健全的开发实践，例如注释样式（如章节\
  \ 2.15.8）。例如，Unix 手页通过下方的注释进行组织。函数声明是标题，简要地总结了内容。一个设计良好的声明通常足够了，而（尤其是左对齐的）头部注释会过度模糊声明的内容。而且注释是引用声明的，而不是反然。最后，整个开发、构建和发布过程应该由健壮的工具支持，这些工具可以封装（并隐藏）组织实体（即它们的名称），使得此类仅限部署的细节永远不会具有架构上的重要性。最重要的是，开发过程必须规范支持它的工具，而不是相反。\n\
  \n## 2.16 元数据 \n\n**作者：Thomas Marshall，Peter Wainwright 协助**\n\n注（N.B.）：本节提出的观点为\
  \ Thomas Marshall 的，并得到了 Peter Wainwright 的建议：他们是原始 BDE 团队的两位开创成员。\n\n架构元数据允许软件工程师定义代码库的设计意图。它可以被工具读取以用于验证或强制执行，并被程序员读取以理解如何维护代码库。设计通常可以从项目开始时的代码直接推断出来，但随着代码复杂性和精细程度的增加，很难记住所有的细节。\n\
  \n架构元数据还允许提前规划。工程师可以在代码完全构建之前，设定代码库各部分之间预期的依赖和关系。随着项目的增长，元数据可以帮助维护结构完整性，避免昂贵的设计错误（这些错误在以后发现时很难修复）。\n\
  \n存在许多形式的打包和依赖元数据，但其中大多数主要面向消费发布的产物，而不是设计意图的声明。这里讨论的元数据可以转换为此类形式，但其目标是捕捉独立于构建考虑的架构意图。它还可以允许对\
  \ UOR 的内部结构做出具有架构意义的声明，但这些意义并未反映在它的构建方式中。\n\n### 2.16.1 元数据是“根据法令”的\n\n理解架构元数据是一项设计输入，而不是实现的结果，这一点非常重要。对于某些人来说，元数据似乎可以通过分析所描述的源代码来“发现”，但事实并非如此。元数据是由开发者编写的，并且本质上是“根据法令”而正确的（除非且直到策略工具或设计评审另有规定）。换句话说，如果元数据和代码不一致，那么代码是错误的。\n\
  \n这种心态有两个有用的结果。正如提到的，代码看起来可能是健全的且没有明显的设计缺陷，但违反了代码库的架构意图。分析工具可以发现这一点，因此元数据可以强制高层设计选择。虽然这初看起来可能是惩罚性的，但人是人，会犯错，尽早发现设计错误允许开发者在纠正成本仍然较低时快速修复代码。因此，元数据是协助开发者在满足规范的同时保持生产力的成本效益的方法。\n\
  \n不那么明显的是，元数据允许开发者声明意图或施加限制，这些限制尚未反映在当前代码库中，但设计预见到随着功能的添加，这些限制对于未来的发布至关重要。因此，可以防止代码更改，即使这些更改相对于当前代码库来说是设计良好的，因为它们会为计划中的未来功能带来困难。换句话说，架构元数据可以帮助防止技术债在代码编写之前就负担项目。\n\
  \n### 2.16.2 元数据的类型\n\n架构元数据可以分为四个不同的类别：\n\n1. 依赖层次结构\n2. 构建需求\n3. 实体体的“清单”（成员元数据）\n\
  4. 限制或增强标准规则的企业特定策略\n\n在这些类别中，只有依赖元数据是明确 100% 架构性的。其他三种类型确实具有架构方面，但分组的依据更多是基于功能内聚性，而不是对“架构”的严格定义。\n\
  \n#### 2.16.2.1 依赖元数据\n\n在实际日常工作中，依赖元数据是最重要的元数据类别。依赖元数据规定了聚合层级之间允许的依赖关系：包内的组件、包组内的包、企业内的发布单元，以及在大型代码库或使用多个开源软件项目的情况下的企业之间的依赖。\n\
  \n在最高抽象层上，“实体 A 依赖于实体 B”的陈表示层次图中有一条从 A 到 B 的边，仅此而已。这条边反过来阻止了添加会导致依赖图循环的边，而这实际上是它的定义目的。\n\
  \n在绝大多数情况下，“依赖”还意味着 A 中的所有代码都可以自由访问 B 中的所有代码，但这并不是定义的一部分，且访问权限必须（在逻辑上）作为独立的元数据条目被授予。\n\
  \n有几个原因说明这种看似死板的正式也是具有实践意义的。原因之一是在某些情况下，允许仅允许从 A 到 B 的部分访问是理想的。例如，客户端 A 可能希望 A 中的所有内容只能访问\
  \ B 中的单个包，因为 B 选择提供的其他功能被认为是有问题的，也许可能仅在单个任务的语境下如此，也可能是出于更广泛的原因。虽然在实践中这种可能性少得多，但客户端\
  \ A 可能希望只有 A 的一部分可以访问 B。\n\n最通用的情况是 A 可以（逻辑上）指定一个整个矩阵，其中 A 中的每个组件根据相应的矩阵元素获得或被拒绝对\
  \ B 中每个组件的访问。这种细粒度在现实世界中几乎不需要，但为了适应所需的用例，实现通用情况会更整洁，并且仅在需要出现时才使用它。\n\n请注意，用于表示元数据的符号可以在典型情况下提供用户便利性，同时保留在需要时表达最通用情况的能力（见下文）。另请注意，依赖元数据在所有情况下都表达了客户端的意图。（参见下文关于策略元数据的章节，其中库提供者施加了类似的限制。）\n\
  \n\n\n\n\n第二个（可能不那么明显）理由是将“在图中建立边”与“实际授予代码访问”分开：库 `A` 的所有者可能希望以一种工具可强制的方式来表示，另一个库\
  \ `B` 不能成为 `A` 的客户端，即使 `A` 明确无法访问库 `B` 的代码。这种依赖禁止可以通过元数据表示：(1) 创建一个从库 `A` 到库 `B`\
  \ 的边，以及 (2) 标记访问矩阵中的每个元素都设为关闭状态。事实上，这种选择是健壮设计的标志。\n\n该功能的用例包括新库，在这些情况下，`A` 的设计者知道\
  \ `A` 处于层级结构中的哪个位置，但（暂）不希望开发 `A` 的开发者使用（现已强制的）更低级库中的某些代码或功能。对于某些人来说，此功能可能显得没必要甚至有些愚蠢，但正如上文所述，元数据允许工具“记住”人类开发者会（且确实会）遗忘的内容。类似但不同的用例出现在包含正在废弃的遗留代码的大代码库中。这种没有代码访问的依赖（此处称为“虚拟依赖”）施加了预期的层级结构，同时强制开发者避免废弃遗留代码带来的“诱人的陷阱”。\n\
  \n## 弱依赖 (Weak Dependencies)\n\n如果在开发开始后才将编码到元数据中，现有代码库可能已经违反了预期的设计。即使声明了依赖关系，大量的重构也可能需要不同的组织结构，导致某些现有的依赖失效。出于这些实际原因，我们可以使用“弱”依赖。\n\
  \n“弱”依赖是一种非法的依赖——它与普通（即“强”）依赖所构成的有向无环图（DAG）不一致。理想情况下，在设计良好的代码库中，不应该存在任何弱依赖。然而，当一个企业从其遗留开发实践迁移到更更有条的工程方法论（如本书中所描述的那样）时，这些依赖很可能会被发现。\n\
  \n弱依赖的主要目的是记录这些“错误调用”的存在，将它们在符号到符号的级别进行隔离，尽管它们（通常）是在 `UOR` 级别记录的。这反过来允许进行有序的、优先的修复，同时在工具尝试阻止那些最终会被允许的更改时，减少面向开发者的延迟。\n\
  \n弱依赖也比“祖父条款”（grandfathering）更优，后者是指工具（静默地）识别出特定的非法符号到符号调用已经存在。简而言之，声明的弱依赖（带有其完整的符号到符号规范）在记录问题的同时，推迟了修复问题的需求——而这种修复成本可能非常昂贵。\n\
  \n## 不同聚合层级的依赖元数据 (Dependency Metadata for Different Levels of Aggregation)\n\n\
  在上述对元数据的讨论中，我们关注的是发布单元（units of release）之间企业内部的依赖关系。这种层级的元数据对于任何规模代码库来说都是至关重要的，未能实现库级元数据是一个严重的工程缺陷。原因非常简单：在一个大型组织中，有许多（可能是成千上万）可供重用的\
  \ `UORs`，对于任何一个设计者来说，始终可行也不可能对整个代码库都有深入的了解。提供企业级的依赖元数据可以为设计者提供价值信息，告知其正在开发的 `UOR`\
  \ 哪些“有用”代码实际上可能或可能不可。具有同样重要性，依赖元数据通常可以促使在开发早期与 `UOR` 的潜在客户端进行设计讨论。此类讨论可以为团队提供设计建议，而这些团队可能没有理由（或仅仅由于足够的洞察）去考虑这些。\n\
  \n尽管如此，在其他聚合层级记录依赖也是健壮的工程实践。对于作为包组的库，强烈建议将组内包之间的依赖关系在元数据中的呈现方式与库元数据完全相同。不这样做虽然比没有库元数据的问题小，但并非没有代价的，其原因与库的情况相似（尽管规模较小）：开发者可以表达他们的设计意图，工具可以执行该意图，从而消除由于未被检测的设计违规导致日后被迫采取尴尬的、可能是昂贵的变通方案的风险。\n\
  \n人们也可以为包级元数据提出同样的论，即显式指定包内组件的层级结构。在实践中，这被证明不是成本效益的。原因之一是包的“设计者”通常更接近实现，因此错误不太可能发生。另一个原因是，由于规模较小，错误的成本较低。然而，最有说服力的理由可能是，包内组件的依赖比高层级的依赖要流动得多且容易变化——特别是在初始开发期间。组件内部的\
  \ `#include` 指令为按组件指定直接依赖提供了一种自然机制（属性 4，section 1.11），而且通过包内组件的 `#include` 指令进行简单分析就能极易提取出当前的层级结构（section\
  \ 1.11），因此在实践中，本地组件依赖的“自律”更有成本效益。\n\n看向另一个方向（极大规模），考虑到我们企业级代码库中开源软件的使用日益增加，在元数据中支持企业命名空间的范围（scoping）也是很有。此功能是必要的，因为在最一般的情况下，无法排除例如在自己的企业和正在使用的开源代码库中出现重复的库名。由于由于，其他企业命名空间的库元数据条目应用企业名称进行限定。仅作为示例，`SpiffyCode`\
  \ 企业的 `foo` 库可能形如 `SpiffyCode::foo`，从而避免与自身企业中的 `foo` 库冲突。注意，开源和其他第三方软件还需要构建元数据，这些可以从层级元数据中提取。\n\
  \n## 关于依赖元数据实现的几点 (A Few Words on Dependency Metadata Implementation)\n\n正如我们讨论过的，将依赖图中边的存在与对代码的（可能是细粒度的）访问授予离开来，是元数据表达能力的一项有价值的功能。然而，正如我们提到的，绝大多数的用例是依赖关系也将授予代码的完全访问。因此，建议在更新元数据的人机交互界面中，简单表示“A\
  \ 依赖于 B”的请求/条目也授予代码的完全访问，而让那些不常用的变体承担显式表达其意图的负担。\n\n仅作为说明性示例，`A` 元数据中的如 `virtual:B`\
  \ 的条目可以表示从 A 到 B 有依赖关系，但没有代码访问。这种选择让简单的未修饰条目 `B` 表示最常见的用例，即允许 A 访问 B 中的所有代码。同样，形如下的条目\n\
  \n```\n B::foo\n\n  B::bar\n```\n\n可以表示 A 依赖于 B，且 A 的所有部分只能访问 B 中的 `foo` 和 `bar`。\n\
  \n\n\n\n在渲染更复杂的依赖限制时，以满足组织用例的形式呈现具有很大的自由度。如上所述，在组织内部保持渲染统一具有价值，但只要所有人都能用通用的语言查看并理解其含义——例如基于底层的完全通用（矩阵访问）表示——这并不是强制性要求。\n\
  \n#### 2.16.2.2 构建需求元数据\n\n软件构建本身就是一项项复杂的工程任务，对这些复杂性的讨论已超出了本节的范围。相反，我们将简单描述在企业级范围内需要维护的三种截然不同的构建元数据分类。每个\
  \ `UOR` 必须提供自己的构建元数据；此外，在某些情况下，让包组中的包提供其自身的构建元数据是合适的，但这种情况并不常见，除非绝对必要，否则最好避免（如果确有必要，这种需求很快就会变得清晰）。在下文的讨论中，我们将处理\
  \ `UOR` 级别的元数据，任何泛化处理在我们呈现的细节级别上都是显而易见的。\n\n### 本地定义 (Local Definitions)\n本地构建定义指定了构建\
  \ `UOR` 所需的每个平台、编译器和链接器的构建标志序列。（原则上）它们对于构建该 `UOR` 之外的构建工具是不可见的。\n\n### 全局定义 (Global\
  \ Definitions)\n全局构建定义指定了构建 `UOR` 以及任何客户端代码所需的每个平台、编译器和链接器的构建标志序列。全局构建定义对 `UOR`\
  \ 的所有潜在客户端可见。\n\n注意，备受期待的 `C++20` 新语言特性 `modules`（模块）无疑需要以某种方式编码其自身的元数据，以便客户端编译器能够在不同的翻译单元之间统一地构建内联函数和函数模板——即使用相同的（例如，断言级别的）构建选项。\n\
  \n### 能力 (Capabilities)\n能力元数据是以断言形式存在的陈述（包括正向和负向断言），记录了 `UOR` 可以支持和不支持的平台与构建类型的组合。与全局定义一样，能力元数据对\
  \ `UOR` 的所有潜在客户端可见。\n\n虽然全局和本地定义用于生成实际构建，但能力元数据的主要目的是供面向开发者的发现工具和文档渲染工具。\n\n## 2.16.2.3\
  \ 成员关系元数据 (Membership Metadata)\n\n成员关系元数据——声明哪些物理实体应或不应被构建和测试工具考虑——对于活跃的开发团队来说是非常有用的结构。开发者可以在代码仍处于进行中时将其提交到本地开发存储库/分支，并根据需要切换该新代码的可见性。例如，拥有能够报告每夜构建问题的“控制仪表板”的团队可以看到一片令人安心的绿色状态标志，因为正在开发中且仍有\
  \ Bug 的代码被忽略了。此类能够减少状态报告工具中“噪声”的机制，其价值可能比人们认为的要高得多。\n\n相反，生产存储库中的成员关系元数据无疑是负面影响。在生产环境中，存在两个独立的问题。首先，每当提交新代码时都必须更新手动的成员关系元数据注册表，这极易出错。在大多数情况下，会是元数据“错误”的，而提交的代码是“正确”的。其次，还增加了一个复杂性，即分析工具（通常由开发者临时启动）必须咨询元数据而非仅仅查看提交的代码，并且没有依据来质疑存储库与元数据之间的任何差异。简而言之，对于生产存储库来说，“事实单一来源”的原则远比成员关系元数据可能提供的任何冗余检查都更有价值。\n\
  \n#### 2.16.2.4 企业特定策略元数据\n\n企业特定策略元数据是防止“一刀切”式规律性的安全阀，而这种规律性在很大程度上是良好工程实践的标志。虽然依赖和构建元数据在所有开发上下文中都是相关且为人知的，但策略元数据可以表达对其他组织可能毫无意义的约束。\n\
  \n此类“具有局部意义”元数据的示例是 `OFFLINE ONLY`（仅离线）标签，它对于该组织之外的任何人来说可能完全神秘，但该公司的每每位开发者都会识别出“Offline”是生产环境中的某种可执行文件，标记有此类标记的库可能无法链接到任何不被通常识别为“Offlines”的可执行文件中。（这可能还需要标识不同类型任务的元数据。）\n\
  \n策略元数据通常提供断言（即布尔谓词），来约束源码存储库的提交，并通常适用于 `UOR` 内部源代码的提交，但也可以适用于该 `UOR` 中的其他元数据，或引用声明该\
  \ `UOR` 的元数据。一个反过来约束依赖元数据的策略元数据示例是 `PRIVATE DEPENDENCY`（私有依赖）声明，它从机械上防止任何潜在客户端访问声明该\
  \ `UOR` 内部的代码。（关于这种特定类型策略元数据的更多信息请见下文。）\n\n策略元数据的内容几乎是无限，只要每个条目对于存储库的每次提交都能被无歧地评估为真或假即可。因此，策略元数据可以是（但不必是）“架构级”的，就像依赖元数据具有架构意义那样的。\n\
  \n以下是（未解释的且意为为可能晦涩的）策略元数据标志示例：\n\n```\nBUSINESS LOGIC LEVEL\n  G++ WARNINGS ARE\
  \ FATAL\n  GCC WARNINGS ARE FATAL\n  GUI LIBRARY\n  INITIALIZATION UOR\n  NO NEW\
  \ DEPENDENCIES\n  NO NEW FILES\n  OFFLINE ONLY\n  PRIVATE DEPENDENCY\n  RAPID BUILD\n\
  \  SCREEN LIBRARY\n  STRAIGHT THROUGH\n```\n\n注意，我们实际上并不主倡“晦涩”的元数据标志，但我们确实承认在大型企业中可能会产生对非常特定策略的需求，且有时仅出现在代码库的一小区域。只要工具在每种上下文中正确处理每个标志，那么作为企业文化的一部分，如果你不理解某个策略元数据标志，你可能不需要担心它，是可以接受的（即使不是最优的）。其他选择也是可能的。\n\
  \n### 私有依赖策略元数据\n\n策略元数据与依赖元数据的主要区别在于依赖元数据代表客户端的意愿和意图（受机械策略执行），而策略元数据代表提供依赖的库的设计意图。因此，`PRIVATE\
  \ DEPENDENCY` 策略元数据可以（并且应该）以类似于依赖元数据的粒度概念来实现。这种粒度允许存在真正的私有“实现”包（在必要时为组件），其意图是库外部绝对不应该使用该实现软件。这种用例与较软的情况形成对比，即元数据标志旨在引发潜在客户端与库开发者之间的讨论；在讨论成功后，手动覆盖禁令是一个完全可能的选择。\n\
  \n### 2.16.3 元数据渲染\n\n\n\n\n架构元数据可以以许多不同的方式渲染，并没有严格要求必须有单一统一的渲染格式。然而，确实要求所有工具（无论是面向开发者的还是其他的）都能感知所有元数据的存在，就像它们被统一渲染的一样。这一要求反过来有利于企业范围内的统一渲染，原因显而易见：为了工具的简单性以及易于维护和扩展。\n\
  \n然而，将架构元数据与严格的构建元数据分开定义是非常重要的，因为后者必须定义构建如何发生（以及可能如何生成），而前者是必须由人工编写的意图声明。如上所述，构建元数据可能包含不属于架构的细节，并且不应包含尚未反映在实现中的预期依赖关系。出于这些原因，不要将它们混淆。\n\
  \n我们首选的渲染方式是让每种元数据都位于其自身的文本文件中，并与元数据所管理的实体共同存放。这样，逻辑-物理内聚性的概念不仅扩展到了代码，还扩展到了描述代码的元数据。这使得对文件更改实现验证变得轻而异常，因为每个文件的语法都是狭窄且特定的。因此，每个包含（并以之命名的）包的源代码仓库都将包含一个名为\
  \ `package` 的目录，其中存放元数据文件（第 2.8 节）（注意，无论该包是包组的一部分还是其自身的 UOR，都遵循这一约定）。同样，每个包组将有一个名为\
  \ `group` 的目录，其中包含该 UOR 的元数据文件（第 2.9 节）。\n\n我们对单个文件（例如 `group` 目录内）的首选命名规范是：根名为实体名称（例如包组），并为不同的元数据文件使用不同的扩展名。例如，我们使用\
  \ `.dep` 文件类型处理依赖元数据，使用 `.mem` 文件类型处理成员元数据。在这两个文件中，格式都是每个条目（依赖或成员）按字母顺序每行输入。\n\n\
  在虚拟依赖和弱依赖的情况下，条目分别带有 `virtual:` 和 `weak:` 前缀，并在正常（或“强”）依赖下方单独按字母顺序排序。\n\n### 2.16.4\
  \ 元数据总结\n\n总而言之，软件元数据与其描述的代码一样，也是一种工程产物；元数据由开发者编写，并且明确 `不` 可以从代码发现。元数据以紧凑的形式捕捉了设计、策略以及构建意图和需求，这种形式既人类可读的，也能被各种执行和处理元数据中设计规则的工具读取。对于大型代码库，元数据不仅具有成本效益，而且其相对较小的成本带来了巨大的价值，无论是在日常开发生产力方面还是在保护软件资产价值方面。\n\
  \n在各种元数据中，目前最重要的是依赖元数据。它确保了无循环设计（对于人类理解和测试至关重要），并促进了大型组织跨开发团队的设计理念交流，在这些组织中，可能无法进行日常同事互动。\n\
  \n依赖元数据允许客户端在任何所需的粒度上精确指定他们想要或不想要依赖的内容，并让工具保证他们的意图得到执行。\n\n策略元数据允许组织整合其特定需求，规模跨越从企业全球到小团队的局部范围（小团队的需求可能与整个企业不同）。\n\
  \n策略元数据的形式为布尔谓词，必须被整个企业中的所有代码满足，尽管如上述提到的，任何给定策略可能适用于任意小数量的代码。策略元数据的一个关键例子是显式指定库的公共部分和私有部分。\n\
  \n构建元数据可以部分从依赖和策略元数据提取（而非从代码），也可以通过手动维护的条目进行增强。最终结果是，即使是不规范、有问题的代码也可以使用全自动构建工具进行构建并有很高的成功。\n\
  \n**Tom Marshall** 是我在 2001 年 12 月加入彭博后聘佣的第一个人（来自我之前的公司，尔街证券）。Tom 最初担任我原始 BDE 团队的高级开发人员（2001\
  \ 年至 2005 年），之后成为软件基础设施 (SI) 部门架构办公室 (AO) 的创始人和负责人。AO 协调驱动彭博（专业版）终端的软件的物理结构，实施现有流程，并贡献有助于管理该软件的新策略设计。在\
  \ Tom 的指导下，他的团队管理离散软件实体之间的物理依赖，并协助开发者创建、重组和重构新及现有库。此外，Tom 开发了许多 AO 及其客户使用的软件工具，用于分析、维护和改进层次结构、重组/重构生产代码以及促进日常操作。最后，AO\
  \ 的使命具有很强的教育属性：(1) 正式培训，以及 (2) 非正式协作与咨询。\n\n**Peter Wainwright** 大约 2003 年加入 BDE\
  \ 团队，成为首位工具开发人员。在本章介绍的基本思想启发下，Peter 开始设计一种数据模型（由多个文件格式组成）以及一套用于这些这些模块化工具套，从而使开发者能够轻松地捕捉、表达和利用用非语言信息表征的物理属性，我们现在统称为\
  \ `metadata`（元数据）。Peter 是一位资深的 Perl 专家、演讲者（例如在 C++ 和物理设计领域）以及多次著作的作者（例如 `Professional\
  \ Apache` 和 `Professional Perl` 均由 Apress 出版），他随后实施了第一批验证工具，以规范 C++ 组件与包之间的关系，催生了目前基于组件的开发流程的诞生。Peter\
  \ 后来成为 SI 构建和部署团队的负责人，监督开发环境的转型以采用先进的源码控制、静态分析、代码质量评估与验证以及可重复构建。此外，Peter 继续开发先进的技术和培训内容，以在整个彭博软件社区中推广最佳实践和高效的开发者工作流。\n\
  \n## 2.17 总结\n\n#### 2.1 全局图\n\n软件的结构组织是任何设计讨论的前提。正如编译代码的格式与其所编码的功能独立一样（我们认为）私有源代码的物理组织也应该是独立的。在我们的方法中，代码库的大部分位于库中而不是不可分割地与任何应用程序绑定。因此，有必要将我们的私有库划分为独立的架构模块，每个模块都可以独立发布。我们也承认我们的（基于组件的）方法并非唯一；因此，我们允许与遗留软件以及精心挑选的开源和第三方库集成。\n\
  \n#### 2.2 物理聚合\n\n\n\n\n\n物理依赖是物理层级结构的一个重要方面；物理聚合是另一个。组件（Component）是物理聚合的最小单元。然而，单靠组件对于大型开发工作来说是不够的。在物理光谱的最外层是发布单元（UOR）。每一层连续的物理聚合都在统一的抽象层级上将适量（但不会让人不堪应交）的内容聚集在一起。每个\
  \ UOR 的名称，与每个（非从属）库组件的名称一样，从 UOR 外部均可见。我们将这种全局可见的实体称为`架构显著`（`architecturally significant`）。在我们的方法论中，我们要求每个`架构显著`实体的名称在整个企业范围内都是唯一的。\n\
  \n跨越独立发布（物理）模块边界的依赖是`架构上的`，而非`组织架构上的`。虽然对于程序的最终用户来说，物理依赖似乎是一个实现细节，但从试图构建程序的应用程序开发人员的角度来看，事实如此。为了组装程序，构建系统必须了解所有这些依赖以及它们所应用的所有物理实体。任何此类显式声明的依赖必须始终是非环的。\n\
  \n物理依赖是每个物理聚合层级设计中不可或缺的方面（参见图 2-9、section 2.2.17）。虽然聚合内部组件之间的依赖可以直接从嵌入该组件（但不包括其测试驱动程序）的\
  \ `#include` 指令中推断出来，但在每个连续聚合层级的预期依赖范围应该在任何编码之前通过元数据进行说明（section 2.16）。这些`允许的`依赖将成为物理设计规范的一部分，在开发过程中被遵循并在随后进行验证。\n\
  \n具有统一的物理聚合深度是我们开发过程的一个基本方面。虽然可以有任意层级的聚合，但我们的经验表明，两到三层就足够描述即使是最大的库 UOR 了。坚持最多采用三层`架构显著`的聚合有助于强制执行令人欢迎的平衡与规划，这种平衡在经验上已被证明支持涵盖数千万行源代码的开发工作。对于较大的子系统，我们简单地使用多个\
  \ UOR，并单独表示它们之间的物理关系。\n\n## 2.3 逻辑/物理一致性\n\n库软件应该是模块化的，以将客户端与实现其提供的功能所需的低级设计决策隔离开。然而，为了让我们有效地推断软件，逻辑封装`必须`反映物理现实。因此，有效的模块化要求逻辑和物理设计在架构聚合的每个层级上保持一致。我们将这种属性称为`逻辑与物理一致性`（`logical\
  \ and physical coherence`）。\n\n逻辑上和物理上一致的设计确保了由`架构显著`物理聚合所声明的每个逻辑构的的直接实现都体现在该物理模块中。然后，每个模块可以继而在`允许依赖`的许可下，委托给其他（较低层级的）物理单元。通过这种方式，我们能够实现分层的模块化库软件单元，其中逻辑封装和物理封装是统一的。\n\
  \n## 2.4 逻辑与物理名称内聚\n\n我们将`包`（`package`）定义为 UOR 内部大于组件的最小全局可见物理聚合层级。由于具有架构显著性，每个库包名称必须是唯一的。在历史上，我们使用包前缀将所有全局逻辑构件和组件文件名与它们所在的包关联起来。现在，包命名空间和包前缀的一致使用起到了相同的作用，所有基于组件的源代码都位于单一的企业级命名空间内。\n\
  \n拥有唯一的包前缀和命名空间很重要，不仅是为了避免冲突的手段，也是在我们的企业物理层级中定位软件的系统方法。坚持认为对于人员或工具来说，仅从客户端使用就能立即识别定义我们私有库中任何逻辑构件的源文件是一件语法上微不足的机械事务，在我们看来，这对于有效组织任意规模的软件至关重要。\n\
  \n组件文件与组件本身共享相同的根名称。每个组件位于一个包中，其名称以该包名称作为前缀；因此，每个组件的名称（以及它包含的文件名称）与包名称本身一样，在企业范围内都是唯一的。为了使软件的逻辑和物理单元在名称上具有内聚性，我们软件中定义的每个全局逻辑实体应在`名称上`无歧地绑定到构成较大架构单元的组件之一。每个封装包的组件在名称上与一个唯一的\
  \ UOR 关联。我们将这种系统性的名称关联称为`逻辑与物理名称内聚`（`logical and physical name cohesion`）。\n\n能够直接通过使用知道逻辑构件的实现位置，有助于理解和维护我们的代码库。例如，仅通过观察\
  \ `bdlt::Date` 等类的使用，我们就可以推断出存在两个名为 `bdlt_date.h` 和 `bdlt_date.cpp` 的组件文件，并且它们位于\
  \ `bdl` 包组的 `bdlt` 包中。鉴于包组的位置很少且为人已知，找到这些文件及其包含的逻辑定义对于人类和工具来说都是轻而易举。\n\n然而，为了在组件级实现完全的逻辑和物理一致性，我们还要求除了运算符（以及类似运算符的`aspect`函数，例如\
  \ `swap`）外，在组件内包-命名空间作用范围内定义的每个逻辑构件的小写名称，必须以定义该组件的基名称作为前缀（参见图 2-22、section 2.4.9）。宏名称（全大写）由于不受包命名空间范围限制，要求以组件的全大写名称作为前缀。\n\
  \n为了减少杂乱，我们进一步要求仅在包-命名空间作用下定义类、`struct` 和自由运算符（或 `aspect`函数）。特别是，我们始终将原本应该是自由（非成员）函数实现为\
  \ `struct` 的静态成员。在组件内定义的任何自由运算符（或 `aspect`函数）必须至少有一个参数的类型定义在同一个组件中（参见图 2-26、section\
  \ 2.4.9）。\n\n包前缀和命名空间不仅仅是命名约定——它们反映了物理架构的现实。为了促进对构成系统的部分进行有序、层次和渐进式的理解，我们不允许包之间存在循环物理依赖——这比仅仅禁止其组成组件之间的循环依赖是一个更强的条件。也就是说，给定一组具有无环依赖的组件，通常无法将这些组件分配到任意包中而不引入包依赖的循环（参见图\
  \ 2-29、section 2.4.10）。\n\n\n\n\n大量使用 `using` 指令和声明会违背逻辑内聚（nominal cohesion），从而阻碍可读性、理解性和维护性。在\
  \ `.h` 文件的函数作用域之外组件组件，或在 `.cpp` 文件的 `#include` 指令之前使用 `using`，可能会导致包含顺序依赖。因此，我们要求组件中的\
  \ `using` 使用（优先使用声明而非指令）被限制在单个函数体内部，并建议将其留给真正特殊的案例（例如 `std::function` 或在本地启用 ADL）。为了使避免使用\
  \ `using` 具有可行性，保持我们所有的包名（如 `std`）极度短小是非常关重要的。\n\n如果未能对我们的专有软件执行连贯的逻辑和物理命名，会导致物理设计偏离其逻辑意图，从而无法强化该意图，并最终会削弱它。此外，缺乏连贯的逻辑和物理命名会阻碍人类认知；我们无法再将设计的逻辑和物理方面视为一个单一的贯实体。此外，我们创建有效的开发和分析工具等的能力将受到削弱。实现逻辑内聚在实践中会带来更好的逻辑/物理一致性，反过来又有助于我们对软件进行推理。\n\
  \n然而，库开发者还承担了额外的负担以满足这些额外的命名约束，因为将逻辑实体从一个物理位置移动到另一个位置将需要客户端重构其代码。好消息是，这种方法允许重构随时间推移进行，因为实体的两个版本可以在同一个库版本内的不同架构位置共存。\n\
  \n## 2.5 组件源码组织\n\n组件（参见图 2-35、第 2.5 节）作为逻辑和物理设计的基本单元，要求满足一套连贯的设计规则，同时处理许多其他（有时是竞争的）关注点。然而，为了最大化人类的理解，非常理想的是——在可能的范围内——组件的内容组织组织。许多组织都是可行的。图\
  \ 2-36、第 2.5 节 提供了关于我们如何一致地安排组件内顶层内容的示意图。请注意，我们刻意避免使用企业级和立即嵌套的包命名以外的命名空间，这（巧合的是）有助于源代码的渲染。另请注意，我们刻意避免在包命名（即声明它们的命名空间）中定义自由运算符（以及切面）函数，从而能够在——编译时——检测到相应声明与定义之间的意外不匹配。\n\
  \n## 2.6 组件设计规则\n\n我们的基于组件的设计规则与组件内容的顶层安排一样，与领域无关。每个组件由恰好一个 `.h` 文件和（至少）一个 `.cpp`\
  \ 文件组成。这些头文件和实现文件共享相同的根名称，共同满足四个基本属性：\n\n**组件属性 1**：`.cpp` 文件——即使其他部分是空的——包含其自身的\
  \ `.h` 文件作为第一行实质性的（即非注释或与版本控制相关的）代码。\n\n**组件属性 2**：在 `.cpp` 文件中定义的、任何在组件外不可见（或实质上不可见——例如，通过私有类，第\
  \ 2.7.3 节）的外部链接结构，必须在 `.h` 文件中声明。\n\n**组件属性 3**：每个具有外部或双重绑定（dual bindage）的结构绝不在声明其头文件的组件之外定义；对于具有（或实质上具有——例如，通过使用\
  \ `extern` 模板，第 1.3.16 节）外部绑定的结构，其定义位于 `.cpp` 文件中。\n\n**组件属性 4 属性 4**：定义在组件内的任何功能都通过\
  \ `#include` 声明该功能的头文件来访问，而不是通过本地声明。\n\n除了定义 `main` 的文件外，我们编写的每个逻辑结构都位于组件内部。我们所有的组件都包含唯一且可预测的包含保护：`INCLUDED_PACKAGE_COMPONENTBASE`。为了促进导出接口（以及契约）与任何特定实现选择分离，我们刻意避免在头文件的类作用域内定义内联函数体。进一步确保自由函数和\
  \ `functiontemplate` 的定义位于声明它们的包命名空间之外，可以提供无成本的大量编译一致性检查。不允许对组件中文件/命名空间作用域的静态对象进行运行时初始化。\n\
  \n虽然每个组件头文件必须在隔离状态下编译，但从组件头文件中包含其他头文件应降至最低（例如，通过本地类声明），但不能诉诸不当使用传递包含（见下文）。导致头文件包含另一个头文件以确保编译自足的五种常见情况是：(a)\
  \ Is-A、(b) Has-A、(c) Inline、(d) Enum（枚举）以及以及 (e) Typedef（参见图 2-41、第 2.6 节）。还有少数边缘情况（例如，协变返回类型），但这些在实践中很少发生。\n\
  \n每当我们使用翻译单元外定义的逻辑实体时，我们确保直接 `#include` 相应的头文件，而不是依赖我们可能包含的其他头文件（有时被称为传递包含）——唯一的例外是公共继承类（参见图\
  \ 2-43、第 2.6 节））——因为这种依赖是内在的。最初可能作为 Has-A 或内联使用给定类型的实现（每种实现都强制包含其头文件），可以很容易地重构为对该类型没有编译时依赖，并移除嵌套包含。\n\
  \n即使类型在函数的接口中使用，如果不是基本类型（参见第 3.2.7 节），该函数可能会被提升（参见第 3.5.2 节）到更高层次，从而可能消除组件包含所需的（传递包含的）类型的需要。除非逻辑影响是内在的且实质性的（即\
  \ Is-A），否则我们义务使用 `#include` 指令来使我们直接、独立的物理需求显式。\n\n组件之间的循环物理依赖是不允许的。我们进一步要求逻辑和物理封装相一致。因此，对任何逻辑实体（例如类）的私有细节的访问不会超出实现该实体的物理模块（即组件）边界。特别是，不能将友元授予授予友元的类型的组件之外的逻辑实体。（类似的问题也出现在受保护访问上，这种访问通常也应该避免。）\n\
  \n由于我们促进细粒度层次化重用的意愿（参见第 0.4 节），我们努力每个组件只包含一个（公共）类，除非有其他有力的工程理由。友元是并置外部可访问类最常见的原因。循环相互依赖几乎总是不必要的；另外两个偶尔的并置理由在第\
  \ 3.3.1 节 中讨论。\n\n## 2.7 组件私有类和从属组件\n\n\n\n\n\n组件私有类（或 `struct`）是定义在包命名空间作用域内，但不可供定义它的组件的外部直接使用的类。虽然\
  \ C++ 语言本身提供了实现这一目的的机制（例如私有嵌套类），但我们通常认为这些机制并非优解（参见图 2-53, 节 2.7.3]）。我们避免在父类的词法作用域内定义嵌套类，事实上，通常完全避免声明嵌套类。\n\
  \n在我们方法论中，按照约定，名称中带有下划线的逻辑实体表示它对于定义它的组件是局部的。这种非正规的“下划线”方法的实际优势包含在图 2-56, 节 2.7.5]中。\n\
  \n在少数情况下，我们会发现将整个组件对某个组件层级（包内）设置为私有是合适的。从属组件是指名称中多出一个下划线的组件，并且仅仅根据约定，除非是另一个名称构成该组件正确前缀的组件（在同一包内），否则不能被直接\
  \ `#include` 它。\n\n## 2.8 包 (Package)\n\n任何实质性的软件开发都需要比组件更大的物理设计单元。`package`（包）作为架构意义聚合的第二层。在我们方法论中，每个组件都存在于包之中。包的目的是将大量语义相关的功能结合在一起，它们共享相同的物理依赖范围，并且可以被抽象地引用和有效地维护。这些较大的物理实体自然地反映了它们所载软件的逻辑结构，但不可避免地也反映了创建它的组织结构。\n\
  \n`普通包`（regular package）是一个被组织成物理内聚单元的组件集合。设计良好的包由具有共同目的的组件组成，这些组件自然地共享相同的物理依赖范围。每个`普通`包的物理结构都是相同的——无论它是否是更大\
  \ UOR（即包组）的一部分。\n\n我们在文件系统中组织`普通`包的源代码，将其放在与包同名的目录中，其中包含所属的组件源文件以及几个特殊的子目录（参见图 2-58,\
  \ 节 2.8.1]）。请注意，实现独立组件级测试驱动程序的文件与它们运行的对应组件的文件并排存放。\n\n将组件刻画为“相似”的必然需要分析每个组件将需要依赖什么（Depends-On）（参见节\
  \ 1.9），但这也是必不可少的。这种简练、通常晦涩但始终可见的标签很快就能暗示出它们所代表的组成组件之间常见的逻辑和物理特征及属性——有时甚至可以与组件名称本身的语义价值相媲（参见图\
  \ 2-66, 节 2.8.4]）。我们方法论的这一特征经过数十年的实践经验，已被证明在实践中极其有用。\n\n## 2.9 包组 (Package Group)\n\
  \n将具有逻辑关系且具有相似物理依赖的组件审慎地放置在更大的离散物理单元中，可以使我们理解和推理软件变得更容易。然而，即使是包提供的额外结构，对于真正的大型开发工作也是不够的。因此，我们引入了`package\
  \ group`（包组）——一个被组织成物理内聚单元的包集合——作为我们第三层（也是最高层）`架构意义上的`物理聚合。\n\n包组与孤立包一样，构发布单元的基础；因此，每个包组的名称在整个企业范围内必须唯一。如果包组中的任何文件包含了来自另一个\
  \ UOR 的头文件，则该包组直接依赖该 UOR。比包更为严格，刻画包组的主导标准是所有组成包必须遵守的允许依赖范围（envelope of allowed dependencies）。整个组组预期的允许依赖范围必须在元数据中显式说明——例如，在组目录结构中的\
  \ `group` 子目录内（参见图 2-67, 节 2.9.1]）。不允许涉及包组与其他 UOR 之间的循环物理依赖。\n\n包组至少承担两个重要目的。第一个目的是提供开发者可以利用的可见内部边界，用于划分大型、易理解且内聚的库子系统。一个成熟的包组可以包含数十万行源代码（不包括测试驱动程序）。随着包组的成熟，内部包及其显式声明的依赖关系形成了架构蓝图。在编写可重用的基础设施时，包允许我们为计划最终创建的各种相关组件套件开辟并预留空间（参见图\
  \ 2-72, 节 2.9.3]）。包的使用也使得寻找具有相关功能的组件变得更容易。然而，我们必须警惕创建过于具体的包（以及包组）的天性诱惑。通过深思熟虑地刻画每个包的逻辑范围和物理属性——就像健全的区条例——我们为随着包组成熟，将新组件正确合并到最初稀疏的包中提供了指导。\n\
  \n包组的第二个重要用途是为一系列庞杂项目产生的累计基础设施提供所需的“空间”。在这种情况下，预先创建几个包组，完全由其粗粒度的物理依赖刻画。在这种第二情况下（参见图\
  \ 2-73, 节 2.9.3]），简练的分层命名策略实现了包创建的去中心化，为包组所有者提供了按需创建和命名包的自治。然而，重要的是永远不要向包组引入不符合其整体允许依赖范围的包。也就是说，组内的所有包都由相同的允许依赖集刻画和管理，对其进行扩展绝不能轻率，因为这将影响所有客户端。\n\
  \n并不是每个包都是组成员的候选。例如，封装或更广义地`适配`特定开源或第三方产品的包通常 (1) 由相对较少的组件组成 (2) 将该产品作为其主导依赖。将此包与其他不共享这一重大物理依赖的包聚合将显著增加物理耦合，而没有显著的补偿收益。相比之下，有效的包组容纳了自然共享相同物理依赖范围的包。因此，具有高度专门化且通常巨大的依赖的适配器包最好保持隔离并作为独立的库发布（参见图\
  \ 2-74, 节 2.9.3]）。\n\n## 2.10 命名包和包组\n\n\n\n\n\n# 引言\n我们希望保持名称短小以避免使用 `using` 的诱惑。尽管某些人可能支持有时被称为“文学化编程”（即使用长且具有描述性的命名空间名称），但我们认为，极短的名称（如\
  \ `std`）更有可能在 `using` 指令和声明中生存下来，因此是首选的。通过坚持包名本身在整个企业范围内是唯一的，我们压缩了命名法，并为包的一致处理（无论是分组的还是隔离的）铺平了道路。\n\
  \n包组可以实现为一个目录，该目录具有一个与组名匹配的唯一三字符名称，并包含一组包目录。每个包目录的名称都以组名相同的三个字母开头，后跟一个唯一的后缀，以形成全局唯一的包名。长度超过六个字母的包名表示该包未分组，任何以单字母前缀加下划线开头的包名（`z_`\
  \ 除外）也是如此。在极少数情况下，无处不在的独立包（例如 `std`）其名称可能恰好为三个字母（参见图 2-75，节 2.10.3）。\n\n为了避免符号重复，企业内每个\
  \ UOR（用户定义资源）名称在使用之前必须向中央机构注册。分组包的优点之一在于，现有包组内为新包选择名称的过程是自动去中心化的。通过为库提供非常短的包命名空间标签（特别是当经过精心聚合到包组中时），我们几乎消除了对\
  \ `using` 声明的需求，从而增加了名义逻辑和物理内聚（节 2.4），这反过来有助于实现逻辑/物理一致（节 2.3）。\n\n## 2.11 子包\n在少数情况下，例如在为广泛重用进行设计时，人们可能会在单个包内组织大量的*水平*功能（例如\
  \ `std`）。尽管我们必须牺牲名义内聚性，但通过在源码中不可见的内部分区来限制此类大型包的物理结构可能仍然是有用的。我们将每个由此产生的区域称为*子包*（参见图\
  \ 2-76，节 2.11）。子包提供了包的受限视图，仅用于该包维护者的利益，因此在架构上不具有重要性。因此，任何给定的子包分区都可以更改或完全删除，而不会对外部客户端产生任何影响。\n\
  \n## 2.12 遗留、开源和第三方软件\n事实是并非所有软件都是基于组件的。为了与遗留、开源或第三方库集成，每个库必须以某种方式分配一个全局唯一的名称。此类名称通常不会反映在代码中，在某种意义上是任意的。然而，这些名称在架构上是有意义的，并在部署期间可用。我们将这些在结构和/或命名上不符合规范的库称为*不规则*。\n\
  \n我们通常选择将遗留库建模为包含单个包的包组，以便随着时间的推移，我们可以将代码重构为同一组内可分级的规则包集合。另一方面，对于开源和第三方库，我们通常希望避免创建代码分叉；因此，这些库的每个通常被建模为单一的不规则隔离包。\n\
  \n然而，开源或第三方库通常带有自己的构建/安装脚本，通常涉及相对路径。由于从不同目录可能会产生重复的文件名，我们通常被迫保留其硬编码的部署结构，以及用于 `#include`\
  \ 指令的任何（已弃用的）双引号（`\"\"`）语法（节 1.5.1）。\n\n## 2.13 应用\n在我们的方法中，库开发遵循相当严格的过程，而应用程序软件则享有更大的活性。尽管如此，拥有一个结构化的重用框架（带有广泛的工具支持）来开发一系列应用程序，与以合理的成本尽可能快速开发高质量应用程序的共同目标是完全一致的。在最高层次，我们将\
  \ UOR 分为两种不同的类型：应用程序和库。良好构的应用程序通常相对较小；因此，在我们的方法中，我们将物理层级中的最高层——应用程序——建模为一个包大小的 UOR。\n\
  \n然而，应用程序包有几个区分特征：(1) 应用程序包有一个或多个 `.m.cpp` 文件，这些文件是除了测试驱动程序之外允许定义 `main` 函数或实现企业级命名空间之外功能的文件；(2)\
  \ 应用程序包的名称在语法上与所有库包都不同（例如，它们以 `m_` 开头），注意应用程序命名空间已声明，但很少在限定引用中使用；以及 (3) 因为应用程序本质上是易变的，因此应用程序包内定义的任何内容都不能从该包外部引用。\n\
  \n## 2.14 分层可测试性要求\n无论是库还是应用程序，我们要求整个分层结构中的每个物理实体都是可充分测试的，不依赖于任何尚未经过充分测试（或已已知或假设为正确）的内容。特别是，必须有一种顺序，使得可以仅根据已经过类似测试的其他组件来对组件进行编译、链接和测试。\n\
  \n这种*分层可测试性要求*加强了避免组件循环和*远距离*（即组件间）友好关系的必要性。每个组件关联一个唯一的、物理隔离且具有一致后缀的测试驱动程序（例如 `.t.cpp`）。尝试使用单个测试驱动程序测试多个组件通常是不可行的。\n\
  \n每个测试驱动程序（物理上）位于组件源码旁边（在封装包内）。组件测试驱动程序不允许依赖于被测试组件直接依赖的包内的任何组件。接口依赖是首选的，但直接且大量的实现依赖可能是可以的。如果认为有其他对本地组件的测试驱动依赖，则必须通过在组件的\
  \ `.cpp` 文件中添加适当的伪`#include` 指令（以及适当的注释）使该依赖显式化。由于它们不自包含且可能难以移植到新平台，为了我们的开发者实现的测试驱动程序能够参与自动化回归测试，我们要求每个测试驱动程序有一个良好定义的调用接口子集，并在整个企业范围内是标准的。为了增强开发者的流动性，我们建议将使用测试驱动程序的“外观和感受”标准化，从而让组织内的所有开发者都感到熟悉。\n\
  \n## 2.15 从开发到部署\n\n\n\n\n\n保持部署的灵活性是库特有的一个重要物理考量。软件的组织结构通常随着开发过程而变化。例如，在开发一个包组（package\
  \ group）期间，该组中的每个低级包可能存在于单独的库中（避免暴露未授权组件），而其他组中的包可能会被合并并作为一个单一库使用。我们偶尔可能会发现需要将某个组件（例如，代表\
  \ `vocabulary type` 的组件）移动到另一个 UOR（用户定义组织单元），而不一定能够立即更改其名称。因此，拥有全范围内唯一的组件文件名是确保开发期间灵活性的关键。\n\
  \n软件在开发期间的组织方式通常与其在生产环境中的部署方式大不相同。例如，我们可能有某些潜在客户，如果我们对软件进行预处理，使其以更前卫的“东方常量”（East\
  \ const）风格渲染，而不是本书一贯显示的更传统的“西方常量”（const West）渲染，他们会更渴望使用我们的软件（当然，这是一个业务决策而非技术决策）。更实用地说，可以合并单独的存档以获得更好的编译效率。组织良好的复杂库可以以多种方式进行并发部署并发挥良好优势。例如，出于业务考虑，我们可能会选择为特定客户提取核心组件子集，并以单个头文件目录和库存档的形式提供自定义版本。因此，无论我们的开发目录结构如何，我们必须单独确保我们有重新打包（例如，扁平化）库软件的能力，特别是确保每个组件文件的名称在企业范围内都是唯一的——无论该文件实际位于哪个目录中。\n\
  \n软件的部署方式绝不能允许变成架构上的显著因素。纯粹作为一种优化，构建和发布工程师可能会利用额外的平台信息、使用概况等，将架构上原子的 UOR 划分为任意的可分级子区域（例如参见图\
  \ 2-89，节 2.15.10），并作为独立的物理库（例如静态或共享库）部署（例如，将 UOR 中常用或最稳定的部分分离）。然而，为了保持部署的完全灵活性，开发者不能依赖任何此类优化。正如我们在在本书中强调的，在设计和开发期间，我们不能对任何\
  \ UOR（或任何聚合体）的原子性做任何假设，因为该属性取决于平台、技术和客户，绝不是唯一的，并且可能会在不另通知的情况下发生更改。\n\n## 2.16 元数据\n\
  \n我们在开发环境中对库（基于组件或其他类型）的所有依赖关系都以相同的方式指定：给定 UOR 所依赖的每个具有架构意义的库软件，其全范围内唯一的名称将作为元数据与该\
  \ UOR 目录结构中的源代码一起被指定。工具链（例如 `Clang`、`LLVM` 以及我们自定义的工具）而不仅仅是编译器本身，对于实现高质量设计以及通过静态和动态分析减少缺陷至关重要。\n\
  \nTom Marshal 和 Peter Wainwright 是我 2001 年 12 月在 Bloomberg LP 创立的原始 BDE 团队的两个主要成员，他们认为软件元数据是“以工具容易处理和检索的格式对软件及其属性进行的描述”。\n\
  \n`依赖元数据`是最重要的元数据类型，因为它描述了组件之间的关系。`策略元数据`由一组关于软件如何被使用的规则和约束组成。`构建元数据`提供了将软件编译并链接成最终形式所需的信息。\n\
  \n## 3. 物理设计与分解\n\n### 3.1 物理思考](#ch03.xhtml_ch03lev1)\n### 3.2 避免糟糕的模块化](#ch03.xhtml_ch03lev2)\n\
  ### 3.3 将逻辑上归类的事物分组](#ch03.xhtml_ch03lev3)\n### 3.4 避免循环时间依赖](#ch03.xhtml_ch03lev4)\n\
  ### 3.5 分级化技术](#ch03.xhtml_ch03lev5)\n### 3.6 避免过度的链接时依赖](#ch03.xhtml_ch03lev6)\n\
  ### 3.7 横向架构 vs. 分层架构](#ch03.xhtml_ch03lev7)\n### 3.8 避免不当的链接时依赖](#ch03.xhtml_ch03lev8)\n\
  ### 3.9 确保互操作性](#ch03.xhtml_ch03lev9)\n### 3.10 避免不必要的编译时依赖](#ch03.xhtml_ch03lev10)\n\
  ### 3.11 架构技术](#ch03.xhtml_ch03lev11)\n### 3.12 使用组件设计](#ch03.xhtml_ch03lev12)\n\
  ### 3.13 总结](#ch03.xhtml_ch03lev13)\n\n软件是*物理的*。如果不直接面对物理方面的问题，我们就无法成功开发大规模系统。必须避免循环、过度或其他不当的物理依赖，同样必须避免跨越物理边界的耦合关系。位置至关重要。及早知道在物理层级中*何处*定位特定功能，通常与知道它*做什么*对于良好的设计同样重要。正如知道何时对软件进行分组一样，知道任何给定的功能子集最好保留在启发其初始实现的客户端中，或者保留在一个可以被更广泛`reused`的更低层级，也同样重要。\n\
  \n在大多数情况下，我们需要隐藏实际的轮子以维持汽车的抽象（当你使用汽车时，你不能独立地操作轮子）。然而，`Wheel` 类本身似乎是更广泛使用的良好候选对象，因此将其移动到\
  \ `Car` 类之外可能会更好。\n\n\n\n\n\n在本章中，我们将从开发者的视角探讨物理设计这一主题，以及物理考量如何改变我们看待软件的方式。我们将既考虑需要避免的情况，也考虑努力的目标。特别是，我们涵盖了有助于统一逻辑设计与物理设计的特定技术（节\
  \ 2.3），同时避免物理设计违规（节 2.6），例如循环物理依赖和远距离（组件间）亲密关系（参见节 3.5）。之后，我们将比较`横向`（lateral）架构与经典`分层`（layered）架构的优劣（参见节\
  \ 3.7），以及如何避免会损害物理互操作性的陷阱（参见节 3.9）。接着，我们探索了用于避免不必要的编译时耦合的架构级`隔离`（insulation）技术（参见节\
  \ 3.11）。最后，作为一个综合示例，我们展示了一个设计良好、经过彻底重构的复杂子系统，它几乎完全通过分布在多个包和包组中的可重用组件实现（参见节 3.12）。\n\
  \n## 3.1 物理化思考\n\n物理设计在涉及 C++ 编程（以及后来的通用编程）方面，最早流行于 20 世纪 90 年代中期。^(2) 在我的第一本书《大型\
  \ C++ 软件设计》（*Large-Scale C++ Software Design*）封底顶部可以看到一段引言^(3):\n\n^(2) `martin95`，第\
  \ 3 章，“内聚性、封闭性和可重用性”章节，第 231–257 页。参见 `martin03`，第 11 章，第 127–134 页。\n\n^(3) `lakos96`，封底\n\
  \n用 C++ 开发大型软件系统不仅需要对大多数 C++ 编程书籍涵盖的逻辑设计问题有良好的理解。要成功，你还需要掌握物理设计概念，这些概念虽然与开发层面密切相关，但包含了一个即使是专家软件开发者可能很少或没有经验的维度。\n\
  \n—— John Lakos (约 1996 年)\n\n二十年后，这些富有预见性的话语依然适用。得益于在大规模应用这些想法时积累的大量经验，我们现在处于更好的位置来阐明围绕`物理设计`这一重要且新的（但不再是新的）维度的思维过程。\n\
  \n#### 3.1.1 纯经典（逻辑）软件设计是天真的\n\n经典的软件设计是纯粹的`逻辑`设计。在这一模型中，软件被天真地认为存在于单一的无缝空间中。仅有种软件单体使得任何物理依赖的概念变得毫无意义。在单体中，也没有方向的概念：所有逻辑模块都是相互可见的。而且，由于没有物理边界，任何逻辑封装单元的`大小`本质上是无界的。此外，任意的亲密关系允许本应私有的本地实现细节访问扩展到遥远且可能巨大的软件中。因此，在没有物理现实指导的情况下，纯逻辑设计通常是次优的，甚至是不可行的，并且通常无法扩展。\n\
  \n### 3.1.2 组件作为我们的细粒度模块\n\n良好的物理设计在实践中自然而会规范良好的逻辑设计。在我们的方法论中，组件作为我们的细粒度模块。组件（节\
  \ 0.7）是逻辑设计和物理设计的原子单元。因此，私有细节不能跨越组件边界（节 2.6），而边界的大小反过来由我们从单个测试驱动文件对其进行测试的能力决定（节\
  \ 2.14.3）。因此，本地（私有）信息的共享范围被刻意保持得很小。此外，禁止这些细粒度模块呈现循环物理依赖。虽然这些额外的物理约束提供了许多实处，但它们也带来了必须解决的新且有趣的设计挑战。\n\
  \n### 3.1.3 软件设计空间具有方向\n\n物理设计在为我们的软件提供令人欢迎的结构维度方面起着核心作用。特别是，软件的物理设计空间不是等向性的——也就是说，它是有方向的有一个有一个的“向上”和“向下”的概念。物理层次中较高水平的软件可能依赖于较低的软件，但反之不然。此外，两个组件、包或包组可能是完全独立的，从而产生`横向`（lateral）软件的概念（参见节\
  \ 3.7.5）。因此，我们通常使用这些方向性术语来表达组件化软件子系统所包含组件的相对物理位置。\n\n#### 3.1.3.1 相对物理位置示例：抽象接口\n\
  \n物理化思考的一个良好范例是恰当地使用纯抽象接口（参见第二部分 4.6 和 4.7）。此类接口或`协议`（节 1.7）引入了一种位置维度，这对于根于过程化语言（如\
  \ C）的人来说最初似乎是不自然的，但既强大又有用。传统上，我们倾向于认为实现位于接口更低的层次。对于`具体`类，如图 3-1a 中抽象所示所示，^(4)客户端始终位于实现之上，并在编译时/或链接时依赖于它。我们说客户端`分层`（参见节\
  \ 3.7.2）于该组件。我们对该实现所做的任何`兼容`更改——即不影响语法或本质行为的更改（参见第二部分 5.6）——即使是破坏性的，因为旧的特性不再可用（至少在同一进程内如此）。\n\
  \n^(4) 回想起来，我们始终使用`伪`包名（节 2.10.3）如 `my`、`your` 和 `their` 来表示抽象或“玩具”示例，而我们使用传统的无描述名称如\
  \ `xyza` 和 `abcx` 来表示分组包中更真实的实现，在这些情况下绝对位置并不重要。\n\n![](img/fig3-1.jpg)\n\n**图 3-1\
  \ 接口实现的相对物理位置**\n\n相比之下，`抽象`接口的实现与其每一个客户端一样，必然都位于接口类定义的组件之上。如图 3-1b 所示，抽象接口的客户端通常不与任何实现参与物理依赖关系（双向）。我们说实现和使用接口的组件的相对位置是横向的。此外，可以随时添加新的实现，而无需修改任何现有组件，从而增加了稳定性（节\
  \ 0.5）。事实证明，纯抽象接口在通过`横向`架构（参见节 3.7.5）消除物理依赖方面起着至关重要的作用。\n\n### 3.1.4 软件具有绝对位置\n\n\
  \n\n\n绝对位置是纯逻辑设计完全规避的另一个重要方面。当考虑建造一个新家时，人们经常说最重要的三个因素是位置、位置、还是位置。同样的考量也适用于新软件的构建。组件在企业物理层级中的绝对位置，必然决定了该实体被允许依赖的软件，以及哪些软件可以使用该组件。\n\
  \n### 3.1.4.1 提问正确的问题有助于我们确定最佳位置\n\n作为一个企业，一个重要的目标是将软件分布在整个物理层级中，通过分层重用来最大化其效用（section\
  \ 0.4）。在对适当位置做出正确判断时，我们希望问自己许多重要问题。该软件属于某个特定的应用程序，还是应该作为一个更具通用性的重用库的一部分？如果是在库中，该软件应该处于高层级（即靠近最初产生它的应用程序）以便更容易地修改，还是处于一个可以更广泛使用的低层级？如果放置得当，物理实体将在可见性、稳定性和依赖性之间获得适当的权衡，从而长远来看使其效用最大化。\n\
  \n### 3.1.4.2 观察现有内容以避免造轮子\n\n每当我们解决问题时，都希望查看我们的（分层的）可重用软件库（section 0.4），以避免重复发明已经存在的东西（例如，参见\
  \ Figure 0-56、section 0.9）。理想情况下，我们设计的每个独立组件都应该有一个重点明确的目标，旨在最大化其适用性（见卷 II 第 5.7\
  \ 节）。当我们确实发现需要创建一个新的重用解决方案时，我们会在软件基础设施中查找，以 (1) 确定该解决方案的顶点——即最高层组件（或组件）应该位于何处，以及\
  \ (2) 该子系统的其余实现部分如何分布在企业内部的（低级）包和包组之间。在成熟的分层重用基础设施中，我们可能需要的许多组件已经存在了，事实上，其中某些组件*必须*被使用，以便我们新的基于组件的解决方案与其他方案具有互操作性（见卷\
  \ II 第 4.4 节）。\n\n### 3.1.4.3 良好公民：确定合适的物理位置\n\n在设计新子系统的过程中，我们可能会发现有引入几个新组件、可能是一些新包，以及（尽管可能）甚至是新的包组，以满足尚未得到充分解决的需求。然而，作为“良好公民”，我们的责任之一是在企业范围的“软件资本”存储库（section\
  \ 0.9）中确定重用实体的适当位置，确定一个描述该区域软件实体的章程，并据此设计这些实体。\n\n### 3.1.5 同地布局的标准应当是实质性的，而非表面的\n\
  \n逻辑内容如何聚合最佳，通常取决于实质性且持久的属性（例如，内聚语义、相似的本质物理依赖，或客户端预期的依赖），而不是取决于表面的特征（例如，具有相似的语法属性，如属于同一个类别；见卷\
  \ II 第 4.2 节），或者取决于较不重要或转瞬即逝的品质，例如具有相似水平的别名、异常或线程安全保证（见卷 II 第 6.1 节）。\n\n例如，原始功能——即需要私有访问对象的内部表示才能高效实现的功能——必须与该类的定义（例如，\
  \ `xyza_something`）属于同一个组件。可以在无需私有访问的情况下实现但在语义上仍紧密相关的功能可以（也应该）在单独的组件中实现（参见 section\
  \ 3.2.7）。那个独立的*工具类（utility）*组件既可以与关联的组件放在同一个包中（例如 `xyza_somethingutil`），也可以与更高层级*工具类包*中的其他类似的工具类组件放在一起（例如\
  \ `xyzau_something`）。\n\n### 3.1.6 缺乏规律性的非原始功能发现发现是有问题的\n\n经验表明，将非原始（参见 section\
  \ 3.2.7）但在语义上相关且通常通用的、具有相似物理依赖的功能放在单独的包中——例如，该包（专门）由具有对应名称的“工具”组件组成——会成为潜在客户发现的障碍（参见\
  \ section 3.2.9.1）。除非我们有一个既定的框架，其中非原始功能是高度规律的（例如，参见 Figure 3-29、section 3.3.7），或者它的某些特定方面导致了大量的额外物理依赖（例如，Figure\
  \ 2-74 中的 `a_lib2` 包，section 2.9.3），否则，将此类非原始但语义内聚的“工具”同地布局（见卷 II 第 4.1 节）在与其类型相同的包中通常更好。\n\
  \n\n\n包前缀，尤其是组内的前缀，通常被设计为具有一定的记忆性，但在其他方面很大程度上是随机的，除非较短的前缀（例如 `xyza`）倾向于表示更通用（或接口）包，而较长的前缀（`xyzabc`）有时暗示适用范围较窄（或实现）包。理想情况下，区分组内包的尾字母或多个字母应代表一个有意义的单词或短语，例如\
  \ `t`（代表“time”）或 `ma`（代表“memory allocation”）。有时，短名称（例如 `s` 代表“system”）以及与其相关的含义（例如部分用于封装平台特定功能的组件）会在组与组之间重复使用。对相关包前缀进行创造性的常规使用，例如在组名后共享第一个首字母——例如\
  \ `f`（functor）、`fr`（functor representation）、`fri`（functor representation implementation）和\
  \ `fu`（functor utility）——如 `bde`（对应 `bdef`、`bdefr`、`bdefri` 和 `bdefu`；参见图 3-37、节\
  \ 3.3.8.3），可以有效地指示包组内紧密协作的包子之间的局部关系。^(5)\n\n请注意，短名称（如 `bdef`）仅通过单个字母区分组内的包（`bde`），通常保留给面向的包，而使用所有三个可用字母的包几乎总是被归类为支持包，这些包虽然不是私有的，但通常不期望在组之外使用。仔细选择被广泛使用的组名（例如我们在\
  \ 1997 年在贝尔士丹使用的 `ode`，代表“our development environment [我们的开发环境]），配合单个尾部辅音（例如 `s`、`t`）有时甚至一个元音（例如\
  \ `u`），使得这些名称读起来非常顺口：`odes`（“o-des”）、`odet`（“o-det”）、`odeu`（“o-dew”）。\n\n### 3.1.7.3\
  \ 包前缀迫使我们在早期阶段更全局化地考虑设计\n\n包前缀和命名空间（节 2.4.9）在许多层的设计过程中起着至关重要的作用。其，这些标签是每个全局逻辑和物理实体名称的一部分。我们甚至无法编辑一个文件，更不用写一个类而不去思考它的包前缀，这反过来又迫使我们思考这个类属于*哪里*。通过这种方式，包前缀轻轻地引导我们的思维过程，让我们在开发过程更早阶段从更全局的角度来考虑设计。\n\
  \n### 3.1.7.4 包前缀迫使我们从一开始就考虑包依赖\n\n包前缀也迫使我们从诞生之初就考虑包级依赖的范围。通过强制将组件置于绝对位置，包前缀让设计人员迅速面对现实：整个组件集群必须继续在物理上（即使在概念上不是）与其他组件保持独立。包充当每个组件的抽象物理表征，组件本身必须遵守该表征。对每个全局逻辑和物理实体显式地标记其相应的包名，进一步强化了其绝对的*物理*位置。这种可见的标记在脱离上下文查看组件时（例如，当在应用代码中使用库组件时）特别有用。\n\
  \n### 3.1.7.5 即使是不透明的包前缀也会产生重要意义\n\n一旦确定了前缀，它就携带了重要意义（节 2.8.4）：包前缀不仅能唯一标识该软件的物理家庭地址，通常还用于标识该包内多个组件共享的逻辑和物理特征。\n\
  \n例如，考虑组件 `bdlma_pool`，特别是它的（原则性）类 `bdlma::Pool`。^(6) `Pool` 名称表示该类执行某种池化操作；然而，`bdlma`\
  \ 前缀（以及相应的命名空间）告诉我们，该类位于一个与其他组件相同的组件，这些组件共同支持通用的内存分配，特别是与 `bslma_allocator` 组件中的基础接口\
  \ `bslma::Allocator` 具有互操作性（参见卷 II，第 4.10 节）。合起来，`bdlma_pool` 的十个字符简洁地告诉了我们 `bdlma::Pool`\
  \ 的很多功能。最重要的是，包名让我们一眼看出，这个全局可访问内存池构造的源码可以在包组（`bdl`）的哪个子目录（`bdlma`）中找到（参见图 2-77、节\
  \ 2.13）。\n\n^(6) `bdlma_pool` 是 Bloomberg BDE 开源发行版中 `bdl` 包组 `bdlma` 包中的一个组件（参见\
  \ bde14，`/groups/bdl/bdlma`）。\n\n### 3.1.7.6 组内包名的有效（如关联）使用\n\n作为第二个示例，考虑一个相对底层、高度结构化的基础设施包组\
  \ `ote`（Our Transport Environment [我们的传输环境]），如图 3-2 部分所示，它提供了基本的进程间通信。`ote` 的物理结构由多个包组成，包括\
  \ `otec`、`oteci` 和 `otecm`，它们的名称通过组名后的共同 `c` 相关，用于暗示组内特别紧密的语义耦合。\n\n![](img/fig3-2.jpg)\n\
  \n**图 3-2：高度结构化的传输包组 `ote`**\n\n在这里，`otes` 包提供了传输组组许多组件所需的“系统级”服务，例如 Unix `iovec`（分散聚集”）缓冲区结构，但它是平台无关的。`otec`\
  \ 包定义了多种用于流式和基于消息传输的*通道*（channel）协议，每种协议都有阻塞或非阻塞形式；对于这些口味，分别使用独立的*协议层次结构*^(7)（参见卷\
  \ II，第 4.6 和 4.7 节），来协调具有或不具有超时能力的相应实现.^(8) 标准协议的具体实现位于 `oteci`。最后，`otecm` 提供了一个在单线程或多线程环境中管理多个通道的框架。注意每个包名都带有强语义内涵，并且在不同程度上（例如参见节\
  \ 3.2.9 和 3.3.7）可能还会暗示其内部的组件类别（参见卷 II，第 4.2 节）。\n\n^(7) **lakos96**, 附录 A, pp. 737–768\n\
  \n\n\n\n# 8 在实践中，我们希望将这些在语义上不同的抽象接口拆分为三个语法上独立的部分，划分依据是它们预期提供的服务级别以及使用它们的客户端。这三个通用的抽象级别被称为“通道（channel）”、“通道分配器（channel\
  \ allocator）”和“（通道）分配器工厂（channelchannel allocator factory）”。在我们的方法中，“分配器（allocator）”和“工厂（factory）”这两个词几乎是同义词，“分配器”只是稍微低级/更原始一些；我们在这里使用不同的词是为了避免重复。在最简单的形式，“通道”抽象了通信机制端点的概念，提供了合适的“读”和“写”方法；而“通道分配器”将通道作为资源分配，因此抽象了创建和销毁通道的概念。最后，（通道的）分配器工厂实质上是一个命名服务，能够分发通道分配器，而分配器又会分发配置适当的通道。对于这三个物理上独立的协议，其具体实现类的三组由于友元关系（friendship），将始终位于同一个组件中（见第\
  \ 3.3.3.1 节）。\n\n## 3.1.8 由于禁止循环物理依赖而导致的限制\n\n从物理角度思考意味着以实现我们物理设计目标的方式组织软件。例如，我们通常禁止出现循环物理依赖（第\
  \ 2.2.24 节），特别是组件之间的循环依赖（第 2.6 节），这有时会迫使我们以最初看起来并不直观的方式来表述软件设计。想象一种情况：我们有一个管理类 `Manager`，它负责其所辖的\
  \ `Employee` 类型对象的生命周期。进一步假设 `Manager` 和 `Employee` 类型都是实质性的实体，并且位于各自的组件中，如图 3-3a\n\
  \n**图 3-3：经理/员工功能的循环渲染（坏主意）**\n\n客户端对其自己的 `askEmployeeNumStaff` 函数的实现（如图 3-3b 所示）期望员工对象完成所有工作。在\
  \ `Employee` 对象上拥有一个如 `numEmployeesThatWorkForMyManager` 这样的直接方法（图 3-3a）——或者使用任何其他名称——不仅要求每个\
  \ `Employee` 对象都必须被赋予其经理的地址（例如，在构造函数中），还要求定义 `Employee` 类的组件必须 `#include` 定义 `Manager`\
  \ 类的头文件，从而在 `my_manager` 组件和 `my_employee` 组件之间诱导了循环物理依赖。这种设计违反了我们最重要的物理设计规则（第 2.6\
  \ 节）：不允许有循环物理依赖！\n\n同样，考虑到每个组件必须位于一个包中（第 2.4.6 节），我们有时会使用幼稚的（伪）包名，如 `my`，来暗示（不现实的）“玩具”示例相对于抽象（但有效的）包名（如\
  \ `xyza`），后者表示更真实的库示例，但在物理层级中未指定位置的包组 (`xyz`) 中。\n\n作为底层实体，员工不应尝试直接告诉经理该做什么。然而，允许\
  \ `Employee` 通过（不透明的）地址识别其经理，如图 3-4a）将原始问题重新表述为：（1）首先向 `Employee` 对象询问其 `Manager`\
  \ 对象的地址，（2）然后使用该地址（现在处于所引用对象的定义上下文中）直接向该特定的 `Manager` 对象询问它管理的 `Employee` 对象数量。\n\
  \n![](img/fig3-4.jpg)\n\n**图 3-4：经理/员工功能的无循环渲染（好主意）**\n\n这种简单直接的转换被称为*不透明指针（opaque\
  \ pointers）*，它利用*局部类声明*（而不是 `#include` `Manager` 类的定义）来打破“向上”的物理依赖，这只是我们将在第 3.5\
  \ 节中详细介绍的九种经典*分层化技术*之一。第 3.4 节中提供了避免循环的额外动机。[lakos96]，第 5 章，第 203–325 页。\n\n## 3.1.9\
  \ 友元关系刻意排除了某些逻辑设计\n\n组件的物理现实对局部实现的范围也施加了重要限制。在我们的方法中，封装接口的主要载体是*组件*，其大小通过要求每个组件通过单个驱动文件测试而被（故意）人为地限制（第\
  \ 2.14.3 节）。我们明确禁止逻辑封装单元跨越物理（即组件）边界（第 2.6 节）。这种本质限制加上组件大小的软限制，促进了这种细粒度的模块化和精细的软件设计，使得分层重用（第\
  \ 0.4 节）和彻底测试（见第三卷）成为可能。\n\n历史上，C++ 语言不支持比编译单元更大的逻辑物理封装单元。然而，随着 C++ 模块的出现，产生一种相应的、可能在架构上更有用的更高层次的逻辑物理封装概念并非不可能。我们将在第\
  \ 3.5 节结束处，在加密封装*分层化*技术的语境下，看到语言支持这种更大逻辑/物理封装单元的潜在益处的示例（见图 3-99，第 3.5.10.8 节）。\n\
  \n## 3.1.10 引入一个确实需要包装的示例\n\n\n\n\n\n为了说明我们的物理封装规则刻意施加的一些必要的设计限制，让我们假设我们需要一种特殊用途的日期序列类型，我们将其命名为\
  \ `TimeSeries`。也许这个（非模板）容器类型将对并发有某些内置支持，或者实施额外的策略（例如，任意两个包含的日期不能相邻），或者具有几乎任何数量的其他奇特性。由于我们的核心开发库（`ode`）没有提供这些特殊特性，我们自己自己实现这种特殊用途的日期容器类型。鉴于我们已经有一个经过适当定制、高性能且可移植的日期序列类，即\
  \ `odet::DateSequence`^(14)（定义在 `odet_datesequence` 组件中），我们肯定希望在新类 `my::TimeSeries`（定义在组件\
  \ `my_timeseries` 中）的实现中复用该功能。图 3-5 提供了一个组件/类图，说明了相关部分并识别了某些实现选项（在第 3.1.10.1 节中讨论）。\n\
  \n^(14) 假设包组名 `ode`（代表“我们的开发环境”）后面的 `t` 以形成 `odet` 包代表“时间”（time）。\n\n![](img/fig3-5.jpg)\n\
  \n**图 3-5：创建一个单组件封装器（没问题！）**\n\n### 3.1.10.1 将仅时间序列及其迭代器封装在单个组件中\n\n我们的 `odet::DateSequence`\
  \ 库类在其接口中自然使用了无处不在的 `bdlt::Date`^(15,16) 词汇类型（参见卷 II 第 4.4 节），正如其（const）迭代器 `odet::DateSequenceIterator`\
  \ 以及组件私有的（第 2.7.1 节）仅限实现的类型 `odet::DateSequence_Link` 一样。所示，`odet_datesequence`\
  \ 显然依赖 `bdlt_date`（第 1.8 节 和 第 1.9 节）。我们的 `my::TimeSeries` 类型自然也会直接使用 `bdlt::Date`，但将嵌入\
  \ `odet::DateSequence` 的实例来完成实际工作：\n\n^(15) pacifico12\n\n^(16) `bdlt_date` 的开源实现可以在\
  \ Bloomberg 的 BDE 开源发行版中找到（bde14，子目录 `/tree/master/groups/bdl/bdlt/`）。\n\n点击此处查看代码图像\n\
  \n```\nclass TimeSeries {\n\n    odet::DateSequence d_sequenceImp;\n\n  public:\n\
  \n    // ...\n\n    // ACCESSORS\n\n    TimeSeriesIterator begin() const;\n\n};\n\
  ```\n\n我们将类似地处理其对应的迭代器 `TimeSeriesIterator`，将其定义在文本上位于容器之前的位置（在同一个头文件中），以避免前向声明和本地逻辑循环（例如，参见图\
  \ 2-52 和 2-54，分别参见第 2.7.3 节 和 第 2.7.4 节）——尽管组件内部的逻辑循环（参见第 3.3.2 节）在技术上是允许的（第 2.6\
  \ 节）：\n\n点击此处查看代码图像\n\n```\nclass TimeSeriesIterator {\n\n    odet::DateSequenceIterator\
  \ d_sequenceImpIterator;\n\n  private:\n\n    // CREATORS\n\n    // ...\n\n  public:\n\
  \n    // ...\n\n};\n```\n\n要从 `my::TimeSeries` 对象获取 `my::TimeSeriesIterator`，我们调用底层数据成员\
  \ `d_sequenceImp` (`odet::DateSequence`) 的 `begin` 方法，并使用返回的进程内值（参见卷 II 第 4.1−4.3\
  \ 节）作为构造函数参数：\n\n点击此处查看代码图像\n\n```\ninline\n\nTimeSeriesIterator TimeSeries::begin()\
  \ const\n\n{\n\n    return TimeSeriesIterator(d_sequenceImp.begin());\n}\n```\n\n\
  ### 3.1.10.2 单组件内的私有访问是一个实现细节\n\n在单个组件内部，我们可以自由访问其他逻辑实体的私细节。为了开始分析，让我们首先考虑（始终免费的）运算符的实现。\n\
  \n### 3.1.10.3 迭代器有助于实现开闭原则\n\n接下来，让我们转向 `odet_datesequence` 组件并检查它包含各个部分。`DateSequence`\
  \ 类作为一个容器自然地提供迭代器，从而允许外部客户端访问其元素。\n\n### 3.1.10.4 封装器组件内的私有访问通常是必要的\n\n现在，让我们考虑我们新的封装器组件^(18)，`my_timeseries`\
  \ 及其实现选项。\n\n\n\n\n从历史上来看，我们一直使用 `wrapper`（封装）一词来表示从定义该组件的外部无法对底层资源进行程序化访问，并始终使用\
  \ `handle`（句柄）一词来暗示相反；参见 `lakos96` 第 6.5.3 节，第 429–434 页。\n\n### 3.1.10.5 既然这只是单个组件封装，我们有多种选择\n\
  \n最后，让我们看看 `my_timeseries` 封装组件中等性比较操作符的实现选择。由于这是一个单组件封装（即仅封装了单个组件的封装），我们有几种设计方案\
  \ [见图 3-5;参见 (e)]]，我们仅展示其中最可能的两种：(a) 依赖我们的本地迭代器 `my::TimeSeriesIterator` 来提供对 `my::TimeSeries`\
  \ 对象的高效访问，无需任何友元关系（friendship）；或 (b) 通过本地友元关系从提供的 `my::TimeSeries` 访问底层的 `odet::DateSequence`，然后因为封装确保了限制性的子集，从而调用在\
  \ `odet_datesequence` 中定义的公开访问 `operator==`。\n\n如果委托函数被声明为 `inline`，上述第一种方案 (a)\
  \ *可能* 实现可以接受的（甚至是最佳的）性能；然而，第二种方案 (b) 在所有可以想象的范围内，其性能至少一样好，甚至更好——例如，由于内联深度的实现限制。因此，由于（因为位于同一个组件中）该操作符恰好具有访问底层表示（容器中）的权限，我们自然会选择利用这种私有访问权限：\n\
  \n点击此处查看代码图片\n\n```\ninline\nbool my::operator==(const TimeSeries& lhs, const TimeSeries&\
  \ rhs)\n{\n    return lhs.d_sequenceImp == rhs.d_sequenceImp;\n}               \
  \             // 为 'DateSequence' 使用 'operator=='。\n```\n\n对应 `operator!=` 的实现方案也类似，并且也有将该操作符定义为相应的\
  \ `operator==`（上文）的反反可能；但鉴于我们恰恰拥有私有访问权限，直接实现（这在实际上被保证是运行时最优的）显然更为明确：\n\n点击此处查看代码图片\n\
  \n```\ninline\nbool my::operator!=(const TimeSeries& lhs, const TimeSeries& rhs)\n\
  {\n    return lhs.d_sequenceImp != rhs.d_sequenceImp;\n}                       \
  \     // 为 'DateSequence' 使用 'operator!='。\n```\n\n### 3.1.10.6 多组件封装由于没有私有访问权限，是存在问题的\n\
  \n正如我们一直以来说的那样，强制执行较小的封装单元会以非凡的方式限制我们的逻辑设计。例如，考虑图 3-6a 所示的多组件 `wrapper`。在例例中，出于某种原因，我们选择不仅封装了\
  \ `odet::DateSequence`，还封装了 `bdlt::Date`，并且每个对象都实现在各自独立的组件中。我们现在面临的困境是 `my::TimeSeries`\
  \ 如何能够访问 `my::Date` 中的私有数据而不让其他人也这样做。不幸的是，成功创建多组件封装是很困难的，因为分离的封装组件通常需要“特殊”访问权限来获取我们试图隐藏的最极底层表示，而且直到最近，还没有已知的通用、事后方法可以符合我们的组件设计规则（第\
  \ 2.6 节）。我们现在对这个问题有一个通用的（尽管是“拙劣的”）解决方案，它已成为第 3.5.10 节中讨论的递进封装分级技术的一部分（特别参见图 3-100、第\
  \ 3.5.10.8 节）。\n\n- 注意，此处使用的 `multicomponent` 指封装本身，而不是被封装的对象。\n- `lakos96` 第 6.4.3.2\
  \ 节，第 415–425 页。\n- 我们希望这种对现有系统进行封装的反复需求，最终能通过备受期待的 C++ 新语言特性 `modules` 在其广泛可用后得到更好的解决。\n\
  - 然而注意，根据第 2.2 节，类名 `my::Date` 违反了设计规则，因为它没有包含基础（base）。\n\n![](img/fig3.jpg)\n\n\
  **图 3-6：组件实施的架构限制**\n\n### 3.1.10.7 为什么多组件封装通常需要“特殊”访问的示例\n\n作为多组件封装固有的困难性的具体示例，假设我们有一个客户端仅与\
  \ `my::Date` 和 `my::TimeSeries` “封装”对象工作，并想在某个函数内部创建一个由特定日期序列组成的时间序列。首先，客户端创建一个空的时间序列：\n\
  \n```\nmy::TimeSeries importantDates;\n```\n\n然后，客户端创建一个日期，例如美国的美国独立日：\n\n点击此处查看代码图片\n\
  \n```\nmy::Date independenceDay(1776, 7, 4);\n```\n\n现在，客户端将 `independenceDay` 添加到\
  \ `importantDates` 序列中：\n\n点击此处查看代码图片\n\n```\nimportantDates.add(independenceDay);\n\
  ```\n\n但我们如何实现 `my::TimeSeries::add` 方法来实现这一点呢？回想 `my::TimeSeries` 的数据成员是一个名为 `d_sequenceImp`\
  \ 的对象，类型为 `odet::DateSequence`。这种通用的日期序列类型不知道 `my::Date` 类型，但完全可以使用 `odet::DateIterator`\
  \ 对象在任何位置插入给定的 `bdlt::Date` 类型。由于 `my::Date` 和 `bdlt::Date` 恰好近似相同的*数学*类型（这本身也是问题，参见第二卷第\
  \ 4.4 节），该方法至少可以\n\n点击此处查看代码图片\n\n```cpp\nvoid my::TimeSeries::add(const Date& value);\n\
  ```\n\n提取传入的 `my::Date` 对象的*显著属性*（参见第二卷第 4.1 节）`year`、`month` 和 `day` 的各个值；我们可以使用这些值构造一个具有相同值的临时\
  \ `bdlt::Date` 对象，然后将其传递给底层 `my::DateSequence` 数据成员 `d_sequenceImp` 的 `add` 方法。\n\
  \n这种方法不仅效率极低，而且之所以可行*仅*是因为底层日期对象表示一个*值*（参见第二卷第 4.1 节），该值可以独立于其 C++ 类型进行通信。在所有其他情况下，例如，*机制*类型（参见第二卷第\
  \ 4.2 节）如锁或内存分配器，无法通过公开接口进行此类提取；因此，我们需要某种“特权”访问权限，以便从协作的封装组件（通常位于同一包内）中提取底层（进程内）表示的引用。\n\
  \n### 3.1.10.8 分别封装互操作的组件通常行不通\n\n\n\n\n基于我们以组件为中心的设计规则，存在几个显而易见的替代方案，但两者都不特别吸引人。我们要么在\
  \ `my::Date` 中暴露底层的 `bdlt::Date`（使得 `my::Date` 仅仅是 `bdlt::Date` 的一个高级 `handle`），要么将\
  \ `my::Date` 和 `my::DateSequence` 放在同一个组件中，例如 `my_date`（如图 3-6b]节 3.1.10.6 所示），从而回归单个封装封装。前者违反了预期的封装（更准确地说，是信息隐藏），而后者可能违反了命名内聚（节\
  \ 2.4）。\n\n熟悉伪面向对象网络框架中系统级套接字编程开发者会熟悉“几乎封装”的概念——即无颜耻地通过“包装器”对象的公共 API 暴露原生描述符——因为任何此类框架在本质上都无法仅授予操作系统对其内部表示的特权访问权限。\n\
  \n有人建议，可以通过命名约定将某些函数标记为仅供当前包内使用。然而，这样做会在包内以一种无限制的方式违反封装——即使包外部的客户端完全遵守了该约定。尽管如此，在实践中确实会产生对这种访问的偶尔合法需求（以及许多更多不合法的需求；参见节\
  \ 3.9））（参见节 3.5.10 末尾递进式封装的最终示例）。\n\n即使通过适当的逻辑命名调整，单组件封装器方法通常仅在以下情况下才可行：(1) 合并后的实现复杂度没有超过从单个测试驱动程序中可以合理有效验证的范围；(2)\
  \ 未来可能不需要通过额外的类的方式进行无限制的扩展，而这并非显而易见。正如图 3-6c]节 3.1.10.6 所示，规模和不稳定性很快就会引发重新设计，并可能产生无限制的影响。\n\
  \n### 3.1.10.9 当面对多组件封装器时我们该如何做？\n\n那么，当我们认为需要一个多组件封装器时，该怎么办呢？在我们的方法论中，授予“远距离友好”（节\
  \ 2.6）根本不是选项。暴露封装的且本应被隐藏的设计决策（例如通过将 `wrapper` 转换为 `handle`）将损害我们未来更改底层实现的能力（参见卷\
  \ II 第 5.5 节）。为了实现伪封装而隐藏低级组件的头文件是一个更糟糕的主意（参见节 3.9.7）。事实上，现在递进式封装分级技术有一种较新的形式（参见节\
  \ 3.5.10），它可以通过在通常位于较高层包装包的独立组件中实现相应的 `shadow classes`，来封装大型子系统。创建一个过程化接口（参见节 3.11.7）总是可能的，并且或许也能提供另一种可行的替代方案。\n\
  \n### 3.1.11 节总结\n\n总结本引言部分，良好的物理设计使我们考虑超越传统（纯）逻辑设计的软件方面。我们被迫在前期就考虑在物理层级中每个组件将位于何处，以及它将依赖于哪些其他软件。我们需要思考如何组织和并将基于组件的解决方案分布到我们的分层可重用库软件中。考虑客户端和实现之间的相对位置——例如在采用抽象接口时——将使能够在适当的地方获得更大的灵活性和稳定性。避免循环依赖有时会让我们重新思考如何组织和封装逻辑内容。最后，通过将“友好关系”限制在同一组件的逻辑实体内，我们迫使开发者以某种方式考量他们的软件，这种方式有时看起来是令人沮丧且毫无必要的。然而，通过这样做，我们有助于确保（其他方面）我们的软件具有可扩展性，并且验证任何一个组件所需的测试工作量是有界的（节\
  \ 2.14.3）——这一成就的价值不容低估。\n\n### 3.2 避免糟糕的物理模块化\n\n良好的模块化通过将属于一起的软件放在物理接近的位置来实现。用于模块化的标准将决定其有效性。在本节中，我们首先观察无效的模块化标准，然后扩展理解以纳入更有效的标准。探讨了模块化和类设计的方面，包括完整性（`completeness`）、最小化（`minimalism`）和原始性（`primitiveness`）。本节以一个详尽的示例结束——一个包含以上所有元素的可调”组件。\n\
  \n### 3.2.1 有许多糟糕的模块化标准；语法就是之一\n\n实现糟糕模块化的方法数不胜完——有些显而易见，有些则没那么明显，但都很糟糕。作为一个故意极端但在教学上有有用的第一个示例，想象根据用于实现逻辑内容的类型来划分逻辑内容。例如，假设我们选择将所有的类放在一个组件中，将所有的\
  \ C 风格函数放在另一个，将所有的枚举放在另一个。遵循这种任意的、以语法为中心的 `modularization criteria` 将显然使实现重要的架构属性（如逻辑/物理一致性（节\
  \ 2.3））或在物理聚合的每一层避免循环依赖（节 2.2.2））异常困难。尽管这个初始示例听起来很荒谬，但应用同样糟糕的模块化标准却异常地容易（例如，参见节\
  \ 3.2.9.1），导致设计灵活且难以理解。\n\n### 3.2.2 将通用软件提取到库中至关重要\n\n**指南**\n\n**始终尝试提取并在时间允许的情况下，将为特定应用程序创建的通用功能降级到我们不断增长的*软件资本*物理层级中的相应位置。**\n\
  \n识别可重用的功能点——然后正确地提取并降级（参见节 3.5.3）将这些通用软件单元从应用程序中分离出来并放入独立的低级库中——是实现模块化最基本且最重要的方式之一（节\
  \ 0.2）。因此，每当我们建立一个新的开发环境并首次开始开发应用程序时，我们自然地致力于维护一个用于应用程序间使用的细粒度模块（例如组件）的集中式库。尽管重用很重要，但它不应以过度灵活的接口（源于过于复杂的设计）为代价。相反，每个组件应该有一个重点明确的目标，易于理解和使用（参见图\
  \ 0-55]节 0.9），同时目标是实现广泛的适用性（参见卷 II 第 5.7 节）。\n\n\n\n\n\n### 3.2.3 由于压力未能维护应用程序/库的模块化\n\
  \n在应用程序开发的早期，人们会投入大量的时间和资源，如图 3-7 所示，正确地提取出适当的可重用功能。然而，正如我们许多人深知的那样，“最周密的计划往往会泡汤。”在交付产品的压力下，常见的做法是“暂时”暂停我们声称的重构工作，随后将创建应用程序过程中开发的所有代码都与该应用程序存放在一起。虽然使用这种后者的“我现在就需要”的准则进行模块化，在短期内可能是“正确答案”，但它并不能产生跨应用程序的适当重用。然而，如果任其不管，越来越多通用的功能将埋没在大量无关的、特定于应用程序的代码中。在许多现实软件开发环境中，应用程序之间引入依赖关系（甚至是循环依赖）的可能性变得高到无法接受的。\n\
  \n![](img/fig3-7.jpg)\n\n**图 3-7：将通用的软件与应用程序分离（好主意）**\n\n### 3.2.4 持续将可重用组件降级至关重要\n\
  \n及时地从协作且易变的应用程序代码中持续提取通用的功能，并将其`demoting`（降级）”到广泛可用且稳定的库中，以便在那里可以被快速且安全地重用，其重要性怎么强调都不为。即使已经小心将应用程序内的逻辑元素划分为离散的组件，这些软件往往也很难，甚至人们不知道它的存在。此外，应用程序要么依赖于其他应用程序（如图\
  \ 3-8 所示），这显式违反了我们方法论中的设计规则（节 2.13），要么在自己的私有仓库中重复所需的源代码。无论哪种方式，寻找、使用和维护现有解决方案都不是便利的。^(25)\n\
  \n^(25) 注意，某些服务导向架构（SOA）可能会选择以某种不同的方式来解决这个问题。根据 JC van Winkel（在他对本卷手稿的评审中）的说法，Google\
  \ 解决应用程序模块之间循环物理依赖的方法是让生产环境中运行多个服务器并提供 RPC 端点。在这里，服务器的作用在很大程度上类似于上面提到的应用程序。JC 接着说：“应用程序不会变得太大，因为你‘只是’有了更多的程序，每个程序包含一个或多个库。是的，你付出了\
  \ RPC 开销的代价，但在 Google 的语境下，这是相对不足道的（反正他们几乎通过网络提供所有服务）。”\n\n![](img/fig3-8.jpg)\n\
  \n**图 3-8：诱使应用程序依赖其他程序（坏主意）**\n\n即使使用 SOA，通过最大限度地利用公共的（分层重用的）软件资本（节 0.9）池来实现每个服务模块，始终是一个明智的策略。就此而言，最小化（服务之间的）循环运行时依赖也是明智的。\n\
  \n#### 3.2.4.1 否则，随着时间的推移，我们的软件可能会退化为“大泥球”！\n\n如果没有通用功能向稳定库的积极向下移动，并在持续的实现分层重用的积极努力支持下，应用程序开发者模块化代码的动力就会减弱，我们可能会看到越来越多通用的功能与高度特定的应用程序代码不可救地交织在一起（如图\
  \ 0-68、节 0.11）。\n\n例如，在定义 `main` 的同一个应用程序文件中实现一个通用的类如 `Base64Encoder`，将确保 `Base64Encoder`\
  \ 类将`not` 在任何其他应用程序中重用，除非代表该类的文本被手术式地提取并复制到新的编译单元中，而除非在那里立即进行降级，否则它将仍然是该应用程序的局部的。\n\
  \n同样，在将应用程序适配到 GUI 的同一个组件中定义 `Base64Encoder`，意味着任何想使用 `Base64Encoder` 的人至少将被强制链接大量的它可能无法使用的\
  \ GUI 代码。到这一步，我们正走向退化为“大泥球”（A Big Ball of Mud）（节 0.2）。\n\n### 3.2.5 对于应用程序开发者来说，物理依赖不是实现细节\n\
  \n**观察**\n\n**物理实现依赖强力影响着模块化。**\n\n经典的软件设计倾向于将那些通过模块接口在程序上不可见的内容视为仅仅是“实现细节”。然而，忽略物理设计考虑——例如编译时，特别是链接时的依赖关系——会给客户端带来重大问题，因为他们最终必须构建并部署自己的软件。想象你需要装订目前放在你桌子上的大量文件。你看到房间另一边桌子上有一个订书机，于是走过去取它。当你抓住订书机时，你发现它不可分割地钉在桌子上。\n\
  \n![](img/unfig3-1.jpg)\n\n实现细节吗？也许吧。可以接受吗？我们认为不可以。因此，正如图 2-74、节 2.9.3 所示所示，我们始终会选择`not`\
  \ 在单元组织单元（UOR）中引入具有过度实现依赖的结构，即使它在逻辑上是完全内聚的。\n\n**指南**\n\n**除非有强迫的工程理由，否则避免在组件中共同放置多个一个公共类。**\n\
  \n自诞生以来，指导 C++ 语言设计的根本原则之一是客户端应该只为他们使用的部分付费（例如，在时间和空间方面）。出于同样的精神，我们总是努力将功能划分为细粒度的组件，然后可以按需使用（而不是未重构软件那样全或无）。因此，我们通常将组件限制为单个（公共）类，除非有强迫的工程理由（参见节\
  \ 3.3.1）。当已知两个或多个类的客户端——更不用设计如此——是分离的（或接近分离）时，将它们定义在同一个物理原子模块中将是非常反的。\n\n适用于上述指南的一个重要极端情况是：当我们费力从一个给定的类型实现中刻意提取出一个*稳定的*、较低的抽象时——无论是一组工具函数，还是一个本身未用于组件中定义的主要类型的接口中（节\
  \ 1.7.3）的可实例化类型。在这种情况下，将这种较低级的功能共同放在同一个组件中，将会将高层抽象的直接客户端暴露在他们可能不需要的细节。\n\n\n\n\n\
  更糟糕的是，如果主类的封装（`use`）实现（参见第 3.11.1 节）更改为使用不同的底层类型，要么这种（现在已过时的）实现类型将永远被所有客户端携带，要么它需要被切除并放置在自己的独立组件中（现在有了新的头文件名称），因此所有旧实现类型的直接客户端将被强制重构其代码（即更改其\
  \ `#include` 指令以反映新的组件头文件名称）。26。与其允许这种情况发生，还不如从一开始就（物理上）将稳定的、公共可访问的仅限实现的（逻辑）实体与它们面向客户端的原始类型隔离开来。\n\
  \n关于这种不当重构可能导致的后果的具体示例，请参见图 3-171 和第 3.12.11.2 节。\n\n### 观察\n#### 预期的客户端用法会显著影响模块化。\n\
  \n作为基于不同客户端用例进行物理模块化需求的示例，考虑这种经典的面向对象模式：它由一个协议（第 1.7.5 节）、该协议的一个或多个具体实现，以及一个或多个使用这些实现但仅是间接使用（通过协议）的客户端组成。为了帮助说明具体细节，让我们假设我们正在处理高层建筑施工行业这一通用领域。参考图\
  \ 3-9，假设协议类 `Tool` 代表一种抽象机制，旨在允许派生自 `Tool` 的特定具体（即可实例化的）工具被间接使用。进一步假设我们有一族 `Worker`\
  \ 类型，其中每种类型都知道如何通过 `Tool` 协议操作一组符合要求的 `SpecificTool`。最后，想象存在一个庞大的 `Manager` 类型家族，其中每个类型都负责从一组各种类型的特定工具类型中进行选择，并将这些类型的对象“移交”给各种类型的工人对象，以执行特定类型的任务。\n\
  \n![](img/fig3-9.jpg)\n\n**图 3-9：基于协议的经典面向对象设计模式**\n\n### 指南\n#### 特别避免将预期具有大部分不同客户端的类放在一起。\n\
  \n采用抽象接口的主要目的是允许外部开发人员扩展可用行为集（例如，创建一个新的 `SpecificTool`），而无需修改客户端代码（例如任何 `Worker`\
  \ 的源码）。一个重要的间带好处是，抽象接口使我们能够打破使用接口的客户端与实现它的代码之间的*所有*物理依赖（参见第 3.11.5.3 节）。\n\n在与其实现的协议相同的组件中定义具体实现几乎总是是一个极其糟糕的主意。图\
  \ 3-10a 展示了极度欠优的（物理）模块化，在这种情况下我们将 `SpecificToolX` 与 `Tool` 协议放在了一起。请注意，对于这两个类，`Worker5`\
  \ 只使用 `Tool`，而 `ManagerX5` 只对 `SpecificToolX` 进行操作。通过将 `SpecificTool` 实现放在与 `Tool`\
  \ 协议相同的组件中，我们失去了抽象接口提供的许多实际工程益处。也就是说，我们不必要地强制工人组件再次依赖于特定的工具实现，以及物理依赖所产生的所有编译和链接时间后果。\n\
  \n![](img/fig3-10.jpg)\n\n**将具有大部分不同客户端的类放在一起（图 3-10：错误）**\n\n出于类似的原因，在与其使用的相同的组件中定义客户端通常也是一个坏主意。如图\
  \ 3-10b 所示，一个典型的具体实现 `SpecificTool` 将实现协议 `Tool`，但并不使用客户端 `Worker8`27。然而，通过将 `Worker8`\
  \ 放在一起，我们强制了所有工具实现都依赖于它。\n\n当引入抽象接口是为了打破两个具体类之间的循环（参见图 3-75 和第 3.5 节）时，可能只有一个派生类（并可能还有测试实现）会使用它。尽管如此，将抽象接口放在它自己的组件中没有坏处，而且通常是强烈建议的。另一种更常见的引入抽象接口的实例是为了单元测试期间对组件的*模拟*（参见第\
  \ 2.14.5 节）——我们通常不建议这样做。\n\n最后，将原本独立的实现或客户端放在同一个组件中也是不明智的——特别是当已知只有一个类会使用它们时。在我们所考虑的场景中，每种管理器类型都使用相应具体工具的小子集。如图\
  \ 3-10c 所示，一个典型的管理器 `Manager5` 负责为特定类型的客户端 `Worker5` 提供特定类型的工具 `SpecificToolY` 对象。通过将实现或客户端放在一起，我们人为地引入了本不需要的物理依赖。\n\
  \n### 指南\n#### 避免将预期具有大部分不同客户端的功能放在一起。\n\n正如我们从第 2.5 节所知，每个类必须完整地位于单个组件中。考虑到一个类可能会随着时间的推移变得很大并被不同类的客户端使用，如图\
  \ 3-11a 中非常通用（从物理角度）所示，我们至少想要考虑进一步的细化，将其分为由广泛使用的“核心”功能，以及倾向于一起使用的、但仅由不同类客户端使用的额外高级功能，如图\
  \ 3-11b 所示。\n\n![](img/fig3-11.jpg)\n\n**图 3-11：基于客户端用法提炼内聚功能**\n\n\n\n\n对于这样一个专注的领域，人们说^(28)\
  \ 如果一个组件对于某个特定的客户端提供的功能完全满足了该客户端在该专注领域内的需求，那么该组件就是*充分的*（sufficient）。例如，考虑一个需要整数栈组件，但仅使用了\
  \ `push`、`top` 和 `length` 方法的应用。虽然一个仅提供这些功能（但不提供，例如 `pop`）的“栈”组件对于该应用来说可能是*充分的*，但它显然不会被认为具有通用实用性。\n\
  \n^(28) **booch94**, section 3.6, 第 136–137 页（特别是第 137 页）\n\n当涉及到促进代码复用时，对于第一个客户端的“充分性”显然是不够的。我们需要提供支持相对于相关（*原始*）逻辑的某种自然*闭包*（closure）概念的功能（见下文）。如果一个组件在某种程度上对于该专注领域内的本质所有客户端都提供了充分的功能，则称该组件是*完全的*（complete）。这样的组件自然也会满足*开闭*（open-closed）标准（section\
  \ 0.5）。\n\n同时，我们希望组件提供的所有函数都具有独特的实用性。也就是说，我们希望避免提供可能扰乱接口的必要或冗余功能，从而使接口更易于理解如何有效使用。很大程度上为每种基本操作提供单一实现方式的组件被称为*极简的*（minimal）。\n\
  \n### Definition\n\n**为了能够高效实现而本质上需要对所操作的类型对象具有私有访问权限的功能，被称为该类型的*原始*（primitive）操作。**\n\
  \n任何需要对其操作的类型具有私有访问权限的函数都是*显式原始的*（manifestly primitive）。即使一个函数可以在没有私有访问权限的情况下合理实现，如果该实现的性能没有同等的高，那么该函数仍然是原始的。然而，通常我们可以采用一些有效措施，从而极大地减少那些否则会被视为原始的功能类型。只有在采取这些步骤后，剩余的功能才能被认为是*固有原始的*（inherently\
  \ primitive）。\n\n### 3.2.6 迭代器可以帮助减少本应为原始的功能\n\n#### Observation\n\n**迭代器通常能极大地减少原本会被视为*显式原始的*操作。**\n\
  \n为了对聚合其他对象的对象执行非原始操作，通常需要对底层对象进行高效访问。对于少数能提供对每个包含对象进行高效 `inline` 访问（通过索引）的容器（例如标准的\
  \ `vector`），至少可以在单独的组件中（在具有私有访问权限的情况下）编写任意的非原始功能——例如，排序、搜索、分区。虽然这些功能不再被视为原始的，但为\
  \ `vector` 支持迭代器概念仍然是有益的（例如为了泛型算法）。\n\n当涉及到需要在许多类型的容器（如标准的 `list` 或 `unordered_set`）上操作的函数时，这些容器不提供对其每个包含对象的直接\
  \ `inline` 访问，基本上有两种替代方案（section 0.5）：(1) 授予每个此类函数私有访问权限，从而强制它留在与容器相同的组件中（坏主意），或\
  \ (2) 提供一种系统地顺序访问每个成员对象的高效方法（好主意）。通过在适当的情况下通过迭代器一致提供高效的 `inline` 访问，我们显著减少了必须被视为*固有原始*的功能。\n\
  \n### 3.2.7 不仅仅是极简，更是原始：工具类 `struct`\n\n#### Guideline\n\n**在定义可实例化类型的组件内部实现的几乎所有（特定区域的）功能都应该是*原始的*。**\n\
  \n事实证明，仅有独特的实用性并不足以将功能整合到组件中的充分理由。并非所有有用的操作对所有客户端都有用。坚持认为可实例化类型上的每个潜在有用操作都是其类的方法——无论它是否需要私有访问权限——都会导致不稳定性（section\
  \ 0.5）并且完全不具扩展性。带有这种“仅限方法”的思维，简单的组件可能会随着时间的推移变得巨大到无法处理且不实际，阻碍其可理解性，从而降低其价值。\n\n\
  #### Guideline\n\n**大多数在可实例化类型上操作的非原始功能应该实现在较高层次的工具 `struct` 中。**\n\n我们编写的每个可实例化类型的目标都应该是提供一个*完全的*且*极简的*功能子。任何我们可以安排在没有私有访问权限的情况下高效实现的额外有用功能，都应该位于独立的、较高层次的“工具”组件中。这样，我们不仅提高了主类型类型的稳定性，还保持了其本质目的的清晰（见第二卷第\
  \ 4.2 节），例如表示一个*值*（见第二卷第 4.1 节）。\n\n### 3.2.8 结性示例：一个封装的多边形接口\n\n作为关于是和不是固有原始功能的最后一个教学说明，假设我们被要求设计一个低级、高性能、通用的类，用于在整数笛卡尔网格上表示任意的闭合多边形。在这种背景下，多边形通常被认为是一系列表示相邻顶点的绝对坐标序列，这些顶点通过边隐式连接。在得出此类多边形类中的每个对象都自然地表示一个*值*（见第二卷第\
  \ 4.1 节），并且我们被要求设计的类型应该是（具体的）*值类型*（见第二卷第 4.2 节）具有正确的*值语义*（见第二卷第 4.3 节）之后，我们必须考虑的下一个问题将是\
  \ `Polygon` 类在其接口使用的类型（section 1.7.3）。\n\n#### 3.2.8.1 接口中使用哪些 UDT？\n\n由于多边形的几个内在操作可能涉及顶点（顶点方便地表示为整数坐标对），我们会很快意识到我们的多边形类（称为\
  \ `our::Polygon`）应该在其接口中使用适当（具体的）值语义*词汇类型*（称为 `the::Point`）^(29)(见第二卷第 4.4 节）。因此，定义\
  \ `our::Polygon` 的组件（假设它是 `our_polygon`）在我们的物理层次结构中必然位于定义 `the::Point`（例如 `the_point`）的组件之上。\n\
  \n^(29) 再次，我们在这里使用了伪包名称（section 2.10.3）`our` 和 `the`，是因为 (1) 物理位置不是问题，(2) 这里描述的组件并未建议包含在构成软件资本的实际包组中。\n\
  \n#### 3.2.8.2 `our::Polygon` 应该强制哪些不变性？\n\n\n\n\n\n现在让我们花一点时间考虑一下我们位于伪包 `our` 中的\
  \ `Polygon` 类的的一些细节。这里有许多值得思考的问题。例如，多边形的 `origin`（即当置于某个地理位置时）与 `vertex[0]` 同义吗？还是一个独立的属性？如果是同义的，如果多边形没有顶点会发生什么？它的原点又是什么？一个有效的多边形最少有多少个顶点？多边形可能是无效的，还是说所有多边形像整数一样必须是有效的？多边形允许自交叉吗——也就是说，允许边形成类似“8”字形的形状？多边形允许边重合吗？那么连续的相同顶点呢？重复的顶点是否应该自动合并？对这类复杂设计问题的答案通常高度取决于具体的应用场景。在值类型本身上施加特定的、详细的不不变性（例如不允许边交叉），很容易导致比所解决的问题更多的复杂性（参见第二卷第\
  \ 5.9 节）。\n\n访问一个未初始化的 `int` 在技术上是 `undefined behavior`——尽管每个 `int` 状态都代表一个唯一且有效的值——因此，即使不会产生实际危害，这种做法也是不受欢迎的。\n\
  \n### 3.2.8.3 重要的用例有哪些？\n\n对于多边形类，有几种基础的低层设计方案。`our::Polygon` 的使用方式将决定它的最佳实现方式，反过来也决定哪些操作本质上是原生的。例如，我们最初可能会认为，由于访问顶点是最频繁的操作，最小化访问顶点的成本应该优先于例如移动整个多边形。直接在多边形中存储每个顶点的绝对位置值，将将最小化随机访问单个顶点的运行成本。然而，事实证明，大多数现实世界的应用很少会在不按连续顺序访问其余顶点的情况下只访问单个顶点。然而，这些类型的应用通常会想要高效地移动任意数量的多边形集合。\n\
  \n正如通常情况一样，我们可能在开始时不知道组件的整体最优实现策略，因此设计我们的接口以允许进行实验。为了保持多边形值内部表示的实质灵活性，`our::Polygon`\
  \ 对象的顶点本身应该只能通过定义 `our::Polygon` 类的组件的任何公开功能以值的方式进行访问。\n\n可以假设，用于表示 `Polygon` 对象顶点值的类型\
  \ `the::Point` 不需要动态内存分配；因此，通过值返回此类对象时不需要担心（由于可能使用局部内存分配器而产生的问题）（参见第二卷第 4.10 节）。\n\
  \n例如，我们可能想要考虑将 *N* 个顶点中的每一个在内部表示为相对于前一个顶点的增量（向量差），第一个是绝对的——即相对于 `(0,0)` 的增量。通过这样做，我们可以将移动（`our::Polygon`\
  \ 的*所有* 顶点）的运行成本从 `O[*N*]` 降低到 `O[1]`，只要我们提供了一个高效的机制（例如，`iterator`）来顺序重新创建顶点，按顺序检索所有\
  \ *N* 个顶点的成本将保持为 `O[*N*]`。然而，随机访问单个顶点的成本现在将从 `O[1]` 增加到 `O[*N*]`。\n\n### 3.2.8.4\
  \ 具体要求有哪些？\n\n事实证明（见下文），即使不是绝对必要的，有时通过索引高效地获取任意顶点也是方便的。坦率地说，对顶点的高效随机访问和高效的批量移动并不一定互斥。如果我们将每个绝对顶点表示为相对于单个参考顶点（例如，第一个）的偏移，而不是相对于前一个，我们既可以访问任意顶点值，又可以在常数时间（即\
  \ `O[1]`）内（以最高效率）移动整个多边形！然而，我们需要放宽能够高效移动*每一个*单个顶点（包括那个参考顶点）的要求——这可能是我们乐意付出的代价。图\
  \ 3-12 提供了 `our::Polygon` 的部分功能和（易于实现的）性能要求。\n\n尽管付出了额外算术运算的（希望是无关紧要的）常因子代价。\n\n\
  ![](img/fig3-12.jpg)\n\n**图 3-12：`our::Polygon` 的初始性能要求**\n\n### 3.2.8.5 哪些要求的行为是*原生的*，哪些不是？\n\
  \n接下来，我们需要确定这些要求的行为中哪些是本质上原生的，哪些可以（并且应该）在组件之外高效地实现。基础操作，如构造、析构和（在适用）拷贝赋值，显然是对象实现中紧密的一部分。此外，C++\
  \ 语言要求此类完整功能不能声明在所操作的类的词法域之外。其他操作，如等值比较（它是任何典型（*常规*）值类型的自然组成部分，参见第二卷第 4.3 节），也应该在同一个组件中实现——无论实现是否需要私有访问。迭代器的主要目的是隔离并从而使实现的特定细节具有可变形，同时允许在*组件之外*高效实现新功能，它们也将（或将来可能）需要私有访问。因此，迭代器是与容器类型定义在同一个组件中（第\
  \ 3.3.1 节）的首选，但不必定义在容器本身的词法域内（第 2.7.4 节）。\n\n现在让我们转向 `our::Polygon` 的领域特定需求。我们被要求以*摊销常数时间*将顶点附加到多边形中，以及给定整数索引以线性时间插入或删除顶点。我们还需要能够立即确定给定多边形的顶点数量，即在\
  \ `O[1]` 时间内。为了避免暴露底层表示的细节，我们显然需要提供执行这些操作的函数。此类函数当然需要对 `our::Polygon` 的私有访问，因此，它们必须（第\
  \ 2.6 节）在同一个组件中实现。\n\n*摊销常数时间*这一术语意味着，我们可以执行任意数量 *N* 次此类连续操作，其时间与 *N* 成正比，同时考虑了（相对偶尔）需要调整具有几何增长的底层数据结构容量的\
  \ `O[log(*N*]` 次。\n\n### 3.2.8.6 衡实现方案\n\n**准则**\n\n**努力设计一种在尽可能保持实现选项开放灵活的同时提供最大运行时效率的接口。**\n\
  \n对三个关键行为的要求将强烈影响该组件可能的实现选择范围：\n\n| 1\\. 通过索引访问顶点（例如，值） | *O[1]* 或 *O[*N*]（显著） |\n\
  \n\n\n\n\n| 2. 设置/移动索引处的顶点 | `O[1]` 或 `O[N]`（显著差异） |\n| 3. 移动整个多边形 | `O[1]` 或 `O[N]`（显著差异）\
  \ |\n\n事实证明——就像尝试优化产品、进度和预算（section 0.1）一样——我们可以从三者中选择任意两个，将其限制在常数时间范围内，而不会影响为该组件精心设计的接口：\n\
  \n如果我们选择第一和第二种行为在常数时间内执行，我们会将顶点表示为绝对坐标；如果我们选择第二和第三种行为，我们会将每个顶点的值表示为相对于上一个顶点的 `delta`（增量），仅初始顶点是绝对的；而如果我们选择第一和第三种行为为\
  \ `O[1]`，我们则会将每个顶点表示为相对于一个一致（但未指定的）相对 `reference`（参考）顶点（例如第一个）的 `offset`（偏移量）。\n\
  \n### 3.2.8.7 三者取二并不糟糕\n\n要求*所有三种*行为都能够在常数时间内实现，将需要每个顶点都相对于一个独立的参考点进行定义。为了实现正确的值语义（见第二卷第\
  \ 4.3 节），我们需要：(1) 将此相对参考点作为一个单独的 `salient`（显著）属性（例如 `origin`），这必然会增加多边形对象的整体 `value`（值）；或者\
  \ (2) 将我们的 `the::Point` 类定义为一个不会溢出的无界整数类^(34)——这两者我们目前都不打算考虑。\n\n否则，两个表面上具有相同 `value`\
  \ 的多边形对象可能无法适应相同的 `salient operations`（显著操作），而其中一个（但并非另一个）会导致内部溢出（见第二卷第 4.3 节）。\n\
  \n#### 3.2.8.8 实现的原始性与灵活性\n\n**观察**\n\n**实现的灵活性程度可能会影响哪些内容可以被视为*原始的*（primitive）。**\n\
  \n什么应该被视为原始的有时取决于我们试图在实现中保留多少灵活性。假设一下，我们准备好将一个类的*所有*数据成员设为 `public`（这是一个坏主意！）。在这种情况下，类上的所有功能将是非原始的，且除非语言本身另有限制，否则可以在单独的工具组件中实现，但自然代价是对于实现更改的灵活性几乎为零。然而，在现实世界中，我们希望在实现中至少保留一些灵活性——尤其是当这样做引入几乎为零的运行时开销时。因此，我们寻求提供足够的原始功能，以便允许我们在（适当限制范围内）更改实现细节，而无需强迫客户端重写其源代码。\n\
  \n### 3.2.8.9 实现的灵活性扩展了*原始*功能\n\n保留实现的灵活性是接口设计的永恒目标。例如，考虑移动 `move` 整个多边形的操作。如果我们知道多边形是用绝对顶点坐标表示的，那么将\
  \ `move` 设计为原始的就没有优势，`O[N]` 版本可以在单独的组件中高效地实现。另一方面，如果采用上述其他两种实现之一，`move` 操作可以在常数时间内实现，但前提是它必须访问实现的私有细节。即使今天使用的是绝对坐标，为了保留将来切换到另外两种实现方案之一的选择，我们仍然应该倾向于将\
  \ `move` 功能设计为原始的.^(35)\n\n公平地说，David Sankel 正确地指出（在他对本卷手稿的评审中），尽管不理想，但“切换到成员函数\
  \ move 操作的选择是存在的：这意味着你最终可能会得到一个冗余的工具函数，该函数是通过成员函数实现的。”\n\n#### 3.2.8.10 原始性并非严苛的要求\n\
  \n正如节标题所示，*原始性*（primitiveness）并不是绝对的。鉴于我们已经有原始操作可以高效地访问和设置（通过索引）单个顶点的绝对值，一个通过 `delta`\
  \ 移动（move）给定索引处顶点的独立函数可能不被认为是真正的原始。尽管如此，拥有一个\n\n点击此处代码图像\n\n```\nvoid moveVertex(std::size_t\
  \ index, const the::Point& delta);\n```\n\n作为成员函数可能被证明是有用的，不仅是为了用户的方便性，而且可能根据实现的底层细节，提供适度的（即常数因子级的）效率提升。因此，除了绝对原始且必要的\n\
  \n点击此处代码图像\n\n```cpp\nthe::Point vertex(std::size_t index) const;\n```\n\n以及\n\n\
  点击此处代码图像\n\n```cpp\nvoid setVertex(std::size_t index, const the::Point& vertex);\n\
  ```\n\n方法之外，我们可能还会考虑在 `Polygon` 类中拥有这样的\n\n点击此处代码图像\n\n```cpp\nvoid moveVertex(std::size_t\
  \ index, const the::Point& delta);\n```\n\n成员函数。在值类型（如 `our::Polygon`）中适当纳入非原始标准的标准是模糊的（见\
  \ 3.3）；需要敏锐的工程判断来避免那种著名的*滑坡*。\n\n### 3.2.8.11 周长和面积等常见功能如何？\n\n接下来，让我们考虑能够在线性时间内计算多边形周长和面积的要求。对于某些人来说，直觉反应可能是：周长和面积对于多边形来说是如此常见且基础，以至于它们必须拥有私有访问权限。然而，这里开始向另一个方向转变。\n\
  \n为了高效计算周长或面积，我们真正需要什么？事实是只要有访问所需信息的方法，计算此类数量的算法就不需要私有访问。图 13 展示了如何基于 `our::Polygon`\
  \ 对象的公共接口，使用顶点迭代器编写高效的（非原始）函数，无论采用的是哪种建议的内部实现！\n\n![](img/fig3-13.jpg)\n\n**图 13：多边形类型的常见非原始操作**\n\
  \n除了提供渐近最优，我们——作为复用库开发者——还关注微小的常数因子优化。仅对绝对顶点值的常数时间访问——虽然完全满足图 12 的渐近（大*O*）复杂度要求——本身可能无法完全最优。如果我们的实现恰好存储绝对顶点，则无此可获。但假设\
  \ `our::Polygon` 现在或将来是基于顺序的 `delta` 或（让我们假设是）*偏移量*相对于特定参考顶点的实现的，那么暴露额外的原始方法将具有明显的优势。\n\
  \n例如，想象在提供返回顶点值的方法的同时，\n\n点击此处代码图像\n\n\n\n\n\n```cpp\ninline\n\nthe::Point vertex(std::size_t\
  \ index) const\n\n{\n    return d_offsets[(index + 1) % d_numVertices] - d_reference;\n\
  }\n```\n\n我们还提供了一个成员函数来提供前分：\n\n点击此处查看代码图像\n\n```cpp\ninline\n\nthe::Point delta(std::size_t\
  \ index) const;\n\n{\n    return d_offset[(index + 1) % d_numVertices] - d_offset[index];\n\
  }\n```\n\n通过这种方式，我们能够从以下代码中消除一个 `modulo`（取模）和两个 `subtraction`（减法）操作：\n\n点击此处查看代码图像\n\
  \n```cpp\nthe::Point delta = (d_offsets[(i + 1) % d_numVertices] - d_reference)\n\
  \                  - (d_offsets[ i      % d_numVertices]  - d_reference);\n```\n\
  \n从而产生了\n\n点击此处查看代码图像\n\n```cpp\nthe::Point delta = d_offsets[(i + 1) % d_numVertices]\
  \ - d_offsets[i];\n```\n\n即使我们知道当前的实现并没有提供优势，这样做也没有坏处，因为我们所做的并不比原本需要的更多；提供这些额外的原语化接口函数的用处在于，它允许我们在未来优化实现方案，而不会迫使那些使用了这些方法的客户端重写其代码。\n\
  \n如果认为最大运行时性能是至关重要的（这通常是如此），我们甚至可能选择提供一个“原始的”的 `offset` 方法^(36)，该方法返回相同相对位置的顶点，但每个顶点都是相对于一个一致但未指定的“引用”点呈现的——这类似于不定积分微积分中熟悉但模糊的“...\
  \ + C”：\n\n^(36) 当我们想要向潜在的客户端和维护者表明，某个函数具有“尖锐边缘”，要求他们非常仔细地阅读函数 `contract`（合约）中的前提条件时（见卷\
  \ II，5.2 节），我们通常会在函数名后加上后缀“Raw”（见卷 II，6.11 节）。\n\n点击此处查看代码图像\n\n```cpp\ninline\n\
  \nthe::Point Polygon::offset(std::size_t index) const\n\n{\n    return d_offset[index];\n\
  }\n```\n\n再次注意，我们特意按值（`by value`）返回偏移量，而不是通过 `const` 引用，以保持实现的灵活性。通过返回这个经过仔细记录的“原始”值，像这样的函数\n\
  \n点击此处查看代码图像\n\n```cpp\nstruct PolygonUtil {\n\n    // ...\n\n    static double\
  \ area(const Polygon& polygon);\n\n        // 返回指定 'polygon' 的面积。行为 ...\n\n    //\
  \ ...\n\n};\n```\n\n这些只关心 `x` 和 `y` 相对位置的工具函数，就可以避免在当前考虑的特定 `our::Polygon` 实现中为每个顶点额外执行一次减法操作，而且对于另外两种替代实现来说，完全没有额外的开销。^(37)\n\
  \n^(37) 值得注意的是，如果如所示，这些访问器函数被声明为 `inline`，那么在优化构建模式下，许多性能改进可能由优化器自动完成。尽管如此，通过专门请求真正需要的\
  \ `only` 内容，我们为编译器执行最优操作提供了最大的机会。\n\n### 指南\n\n**倾向于提供低级、可重用的原语功能，而不是直接实现原级的应用级功能。**\n\
  \n#### 3.2.8.12 为通用算法提供迭代器支持\n\n与许多容器不同，`our::Polygon` 的两种最可能的实现——即那两种通过顶点索引实现高效随机访问的实现——不需要迭代器来实现高效的扩展性。尽管如此，一致地定义迭代器以提供访问包含的对象可以带来两个不同的益处：(1)\
  \ 访问顶点、增量甚至“原始”偏移量但仅按自然顺序操作的客户端，应该倾向于使用迭代器，以捕捉这种对底层实现的受限使用可以实现的最细微的优化；(2) 通过允许通用算法无论采用这三种可行的实现方案中的哪一种都能正确操作\
  \ `our::Polygon`，从而服务了互操作性。因此，为这些不同的序列（顶点、增量和原始增量）分别提供标准的 `input` 迭代器可能具有良好的工程意义，尽管为了保持完全的封装，这些迭代器将被强制按值（`by\
  \ value`）而不是按引用返回元素。^(38)\n\n^(38) 由于顶点值的外部表示（即 `the::Point`）在大多数现代架构上的大小本身与指针变量相当，因此返回副本与返回地址相比，可能没有相对开销。鉴于此类访问器函数几乎都被声明为\
  \ `inline`，无论如何，编译器都可以自由地跨边界进行优化。\n\n#### 3.2.8.13 关注通用实用的原语功能\n\n为了榨取最后一点性能，并在面对实现变化时保护稳定性，我们可以考虑提供一种非标准的、类似迭代器的类，它暴露所有三个值（即\
  \ `vertex`、`delta` 和 `offset`）的直接访问，这样只需要移动变量。使用这种复合迭代器计算 `our::Polygon` 面积的示例（无论采用上述哪种实现方案）如图\
  \ 14\n\n**图 14：our::Polygon 的非原级 area 实现**\n\n#### 3.2.8.14 抑制整合非原级功能的欲望\n\n尽管有些人可能难以抑制将相关的非原级功能（如计算\
  \ `Perimeter` 或 `Area`）整合在一起，但我们必须抑制。如果返回多边形的 `Perimeter` 或 `Area` 被认为是原级的，那么滑坡就开始了。那么\
  \ `isConvex`（凸）、`areTouching`（接触）和 `isContainedBy`（包含）等谓词呢？对 `our::Polygon` 对象的要求没有尽头。设计全功能图形组件的目标必须确保我们以及客户端能够在\
  \ `our::Polygon` 类型对象上编写高效、复杂的函数，而无需修改它！因此，`our::Polygon` 的原级功能必须尽可能完备（complete）。\n\
  \n#### 3.2.8.15 支持特殊功能\n\n我们现在转向一些更奇特的功能。在某些应用程序中，除了知道两个多边形是否代表（完全）相同的值（见卷 II，4.1\
  \ 节）外，知道它们在某种意义上是否相似的也是重要的。如果一个多边形的顶点索引标记可以旋转，使得相应索引位置上的顶点值相同，则它们就是“旋转相似”的。^(39)图\
  \ 15 展示了两个“旋转相似”的多边形 `x` 和 `y`，它们具有相同数量的顶点并表示相同的形状，但顶点的索引标记不同：将 `x` 中的顶点标记顺序向前旋转\
  \ 2 位（或向后 4 位），然后使用 `our::Polygon` 的唯一真实相等比较运算符 `operator==` 与 `y` 进行比较，即可展现这种相似性。\n\
  \n\n\n\n\n# 注意，考虑反序并不是理想的，因为相反的方向将具有不同的含义，例如意味着负面积或“洞”（见下文）。\n\n![](img/fig3-15.jpg)\n\
  \n**图 3-15：两个多边形之间“等价”的许多有用概念之一**\n\n当确定对象*值*（参见卷 II，第 4.1 节）的相等性比较是适当的时候，我们需要声明一个\
  \ `operator==` 函数和一个 `operator!=` 函数——每个函数的行为都应与*值语义*（参见卷 II，第 4.3 节）一致——并作为*自由*运算符（参见卷\
  \ II，第 6.13 节），位于与它们操作的值类型*相同*的组件中（参见节节 3.3.1.4](#ch03.xhtml_ch03lev3sec3-1-4)）。但是，确定两个\
  \ `our::Polygon` 对象是否在旋转上相似的功能属于哪里呢？答案显然不属于与 `our::Polygon` 相同的组件！要么客户端可以在定义 `our::Polygon`\
  \ 之外的组件中高效地实现此功能，要么我们再次需要扩展该组件以便客户端能够实现。\n\n事实证明，我们所寻求的“旋转相似”功能可以根据我们已经预期的原始功能高效地实现，前提是保证对顶点值的索引访问是\
  \ *O*[1] 复杂的；否则，我们作为库开发人员，将需要付出更多努力。这种非原始实用用函数的接口如图 3-16a 所示。一个不需要对 `our::Polygon`\
  \ 实现进行私有访问的高效实现（假设我们确实对顶点值具有常数时间的索引访问）如图 3-16b 所示。\n\n![](img/fig3-16a.jpg) ![](img/fig3-16b.jpg)\
  \ ![](img/fig3-16c.jpg)\n\n**图 3-16：为 `our::Polygon` 实现 `areRotationallySimilar`**\n\
  \n如果事实证明我们还没有准备对 `our::Polygon` 的绝对顶点保证常数时间的索引访问，我们仍然可以通过自定义迭代器 `RotationalIterator`（如图\
  \ 3-16c 所示）来确保上述三个建议实现的最佳运行时性能。这种特殊用途迭代器在构造时获取来自标准迭代器的初始位置，并在每次迭代步骤提供每个后续顶点，但在到达最后一个顶点时循环回到第一个。注意，为了完全优化，这种旋转迭代器自然需要对标准迭代器以及\
  \ `Polygon` 本身具有私有访问。\n\n## 准则\n\n**努力提供足够的原始功能，通过确保每个组件的功能是*完整*的，来支持*开闭原则*（节 0.5）：任意的应用功能都可以在独立的、更高层次组件中实现（例如，通过客户端）。**\n\
  \n俗话说：“授人以鱼，可以饱之一日；授人以渔，可以受之终生。”注意上面，我们再次避免了将所需的特定面向应用的功能设为原始功能，而是选择用可重用的“工具”（即原始机制）来扩展底层类型，这些工具随后可以用于高效地实现当前所需的功能，以及未来类似的应用级功能——而不需要一定通过直接的私有访问导致对底层类型的额外修改。\n\
  \n基于简单值类型（如 `our::Polygon`）的有用且实际的应用级功能范围是无限的。例如，考虑显然非原始的 `topologicalNumber` 函数，其接口和约定如图\
  \ 3-17 所示。只有通过主动限制组件中的功能，使其不仅是*最小的*，而且主要是*原始的*，但又足够完整以用于实现任意的应用级功能，我们才能保留并保持纯粹、未加工的本质，而这正是我们用户定义类型的焦点（参见卷\
  \ II，第 5.7 节）。\n\n记录复杂功能有时可以受益于艺术！:-)\n\n![](img/fig3-17.jpg)\n\n**图 3-17：多边形类型上不常见的非原始操作**\n\
  \n编写一个隐藏了大量实现细节的简单、工业级多边形类接口绝非易事。为了让我们讨论的内容具体化，图 3-18 展示了本节讨论的 `our::Polygon` 所有原始功能的超集。该接口的目的是建议我们如何从潜在客户端中封装（并隐藏）各种实现细节。我们的目标是允许操作\
  \ `our::Polygon` 上的外部算法——特别是那些访问但不修改多边形的算法——运行速度就像它们直接访问底层表示一样快，同时使其免受其内部复杂性的影响。特别是，内部如何管理内存不应与多边形*值*的表示或操作有关。\n\
  \n![](img/fig3-18a.jpg) ![](img/fig3-18b.jpg) ![](img/fig3-18c.jpg) ![](img/fig3-18d.jpg)\n\
  \n**图 3-18：过度封装的 `our::Polygon` 完整接口**\n\n\n\n\n注意，这里提供了几种迭代器变体，包括复合迭代器，每种迭代器都通过命名适当的方法返回顶点（vertices）、增量（deltas）和偏移量（offsets）（也可以通过常规操作符返回顶点）。还提供了单个迭代器（专门针对\
  \ `vertex`、`delta` 和 `offset`），适用于典型的泛型用。这里使用的 `const`/非-`const` 模型与 `std::set`\
  \ 类似，后者在类作用域内同时出现了 `const` 和非-`const` 迭代器的 `typedef` 声明，但两者都使用相同的组件私有迭代器类型（不包含非-`const`\
  \ 方法）来实现。鉴于在三种可选实现方案中，只有一种实现可以对单个顶点进行引用，因此没有考虑提供一种允许未来进行可修改访问的迭代器（将要添加）——例如，通过结构化继承（见第二卷，第\
  \ 4.6 节）。\n\n正如我们在这里尝试做的那样，保留所有的实现选项在通常情况下是不切行的。如果我们决定采用可行实现替代方案的子集，那么我们就可以消除建议的图\
  \ 3-18 中的部分接口，从而得到更简单、更易理解的组件——可能在认为最关键的领域获得一些细微的效率提升。希望 —— 至少 —— 这个例子在设计*完整*且*极简*的组件接口时提供了“引发思考的素材”。\n\
  \n#### 3.2.9 语义与句法作为模块化的准则\n\n#### 指南\n\n**优先选择语义和物理依赖，而非语法作为模块化准则，尤其是在包层级上。**\n\
  \n##### 3.2.9.1 将 `u` 作为包后缀的不当使用\n\n最后，正如我们在本节开头指出的，有时倾向于根据语法属性而非语义属性来刻画一个包。例如，在过去，我们总是选择将实现值类型的给定组件非原始功能（见第二卷，第\
  \ 4.1 节），例如 `bdet_date`，放置在具有相同基名称的单独组件中（第 2.4.7 节），但放在带有 `u` 后缀的高层级“工具”包中（例如 `bdetu_date`），即使该非原始功能没有额外的物理依赖。然而，我们在实践中观察到，除非该非原始功能在设计上是冗余的（图\
  \ 3-19），或者为了确保可扩展性（第 2.8 节），否则我们不应将非原始功能包含在同一个组件中（第 3.7 节）[第 3.3 节）[第 3.8 节）——即使它是非原始功能的（将要添加）。考虑到在三种替代实现中只有一种可以对单个顶点进行引用，因此没有考虑提供一种未来允许可修改访问（将要添加）的迭代器。\n\
  \n##### 3.2.9.2 将 `util` 作为组件后缀的良好使用\n\n另一方面，对于常用的非原始功能，例如 `area`，我们将其放置在单独的“工具”组件中（见第二卷，第\
  \ 4.2 节），并使用 `util` 后缀（例如 `our_polygon_util`）来命名。这不仅极大地提高了可发现性，还允许同一包内的其他组件使用这些非原始功能（第\
  \ 3.7 节）[第 3.3 节）——且在不违反模块化规则的情况下，这些功能是旗舰组件的接口。\n\n## 3.2.10 节总结\n\n总结本节，我们希望避免在组件、包中包含那些本该属于（或可能属于）的非原始功能。与经典教学相反，实现细节——特别是物理依赖——强烈影响了我们如何组织源代码。预期的客户端使用也支配着我们的模块化。特别是，每当我们设想不同的不同的组件或包时，我们应该考虑进一步重构。图\
  \ 3-19 总结了哪些被认为是良好的与糟糕的模块化标准。\n\n![](img/fig3-19.jpg)\n\n**图 3-19：模块化标准的总结**\n\n\
  良好的（可重用的）组件是专注、完整、极简且原始的。我们编写的每个组件都应该有一个专注的目标。当为特定的应用程序设计时，组件必须对该应用程序的需求是足够的。另一方面，一个潜在的可重用组件只有当它不仅满足被委托的应用程序，还满足该狭窄领域内的所有类似应用程序时，才被认为是*完整*的（第\
  \ 0.5 节）。\n\n保持组件的*极简*——即没有冗余（或无关）的功能——使得它们更易理解。然而，为了确保稳定性和扩展性，我们还希望避免将非原始功能与原始功能结合，特别是那些定义值类型的组件。我们所说的非原始是指在定义类型的组件外部（无需特权访问）就可以实现的功能——例如，在可能的多个高层*工具*组件中。\n\
  \n如果我们发现定义在库组件中的应用程序级功能无法在外部高效实现（除非直接在定义类型的组件内部实现），补救措施应该是增强该组件以提供低级“辅助”功能（例如迭代器），以便所需的新的（以及类似的）功能可以在未来实现。通过这种方式，类只有一小部分有用功能是实现该类的组件的一部分。\n\
  \n特别是，为 `our::Polygon` 提供一套完整的原始功能（基于 `vertex, delta, offset, index, `VertexIterator`\
  \ 和 `RotationalVertexIterator`），允许我们实现几乎任何应用程序功能（例如 `perimeter`、`area`、`areRotationallySimilar`、`topologicalNumber`），而不需要特权访问或导致运行时性能的重大损失。能够根据一组良好的原始接口函数来实现新的（非原始）操作，为调整底层表示提供了更大的自由，也为类的现有客户端提供了更大的稳定性。\n\
  \n### 3.3 将逻辑上属于的东西在物理上分组\n\n\n\n\n\n模块化的定义本身就涉及仔细的分组，并将将低级设计决策隐藏在定义良好的接口之后。这些“封装”的细节可以存在于任何抽象层级——从操作系统的最底层到应用程序的最高层。重要的是——在可能的范围内，每个具体的实现选择都应该孤立在单个模块中。只要该模块的契约（见第二卷第\
  \ 5.2 节）不被违反，重新审视某一个模块的实现就绝不会强制重新审视任何其他模块的实现（见第二卷第 5.5 节）。\n\n经典的 C++ 并没有 `module`\
  \ 的正式概念——最接近的近似是（库）`component`（section 0.7），它通常表现为满足某些基本属性的 `.h`/`.cpp` 对（sections\
  \ 1.6 和 1.11）。在我们的方法论中，适当的组件还遵循我们对企业级唯一命名的方法（section 2.4）以及核心设计规则（section 2.6）。然而，有一项新的语言特性\
  \ C++ 模块（例如，见 modules18），它已被引入 C++ 草案标准（2019 年 2 月）。尽管初始特性集在本文时尚未完全定稿，但它们（必然地）几乎都会满足\
  \ lakos17a 中列出的高层“业务”需求，以及建模组件所需的这些需求（另见 lakos18）。\n\n### 3.3.1 类共存（Class Colocation）的四个显式标准\n\
  \n#### 准则\n\n**除非有迫切的工程理由，否则避免在单个组件中定义一个一个 `public` 类（见 Figure 3-20, section 3.3.1）。**\n\
  \n`component` (section 0.7) 是我们物理模块化最基础、最核心的单元。我们实现细粒度、软件的目标（section 0.4）鼓励我们努力将每个\
  \ `public`（即外部可访问的）类（或 `struct`）放在其各自独立的组件中，除非有特定的、迫切的理由这样做。根据我们的经验，我们发现了选择共存 `public`\
  \ 类的恰有四个迫切理由，这些理由在 Figure 3-20 中列出。注意，名称中带有下划线的类和/或完全位于组件的 `.cpp` 文件中的类（例如定义在匿名命名空间内的类）不被视为\
  \ public，但它们将在稍后讨论（见 sections 3.3.3–3.3.5）。\n\n![](img/fig3-20.jpg)\n\n**图 3-20:\
  \ 在单个组件中存在多个 *public* 类的理由**\n\n#### 3.3.1.1 第一个理由：友元（Friendship）\n\n在单个组件内共存类的第一个、也是压倒性的最常见的有效理由是友元关系。正如我们已经看到的（例如\
  \ section 3.2 中的 `our::Polygon`），提供一个或多个迭代器、拥有或授予其关联的容器类的友元访问权限，可以使定义在组件外部的客户端软件实现新功能，而无需触碰定义该类型的组件源代码。根据\
  \ section 2.6，这种友元关系不跨跨越组件边界；因此，迭代器必须与它们关联的容器位于同一个组件中。\n\n作为另一个由于由于必要的友元关系而导致共存的例子，请考虑\
  \ Figure 3-21 中的抽象工厂设计模式。在这里，类 `Widget` 代表任何抽象资源，而 `WidgetFactory` 是产生该资源的抽象工厂。由于它们是纯接口，不存在友元关系问题，这两个接口类正确地存在于不同的组件中。\n\
  \n![](img/fig3-21.jpg)\n\n然而，当我们考虑这些抽象接口的成对实现时，我们必须考虑友元关系。根据定义，工厂负责创建（并回收）资源（见第二卷第\
  \ 4.8 节）。就像迭代器和容器一样，工厂在构造对象时拥有的紧密知识通常不是我们想要泄露的，因为它可能对封装的（私有的）实现选择高度敏感。至少，具体 widget\
  \ 的构造函数应该声明为 `private`，并且仅对相应的具体工厂可用（即通过友元关系）。因此，这两个具体的实现类将正确地存在于同一个组件中。请注意，即使“友元关系”不是显式的，如果两个类的内部实现必须以某种方式保持一致，并必然与其它类同步步变化（见第二卷第\
  \ 5.2 节），那么那种隐式耦合也会支持它们共存。\n\n#### 3.3.1.2 第二个理由：循环依赖（Cyclic Dependency）\n\n共存类的第二个、也更罕见的理由是，当将它们定义在不同的组件中会导致这些组件之间产生循环依赖时——这违反了最重要的设计规则之一（section\
  \ 2.6）。虽然已知这种情况非常罕见且特殊（例如涉及相互递归的模板结构，如抽象语法树，其中紧密的耦合迫使多个类存在于单个组件中），但这种“必要的”共存几乎总是源于糟糕的设计，可能是由某些外部接口规定的（见\
  \ Figure 3-88, section 3.5.9）。第 3.5](#ch03.xhtml_ch03lev1sec5)节描述了一套证明有效的分层技术，用于重构逻辑设计以避免任何循环依赖。注意，即使类原本位于单个组件中，我们仍然努力避免循环关系，因为我们认为这是不好的（与无法放入组件的稍大一点的设计不符），而且再多花一点精力就可以基本避免（例如，见\
  \ Figure 2-54, section 2.7.4）。\n\n#### 3.3.1.3 第三个理由：单一解决方案（Single Solution）\n\n\
  共存的第三个有效理由出于实用考虑。假设我们有一组相当规则的、较小的逻辑实体（例如类、函数、宏），它们彼此是同类关系（即没有一个在物理上依赖于另一个），但其中任何一个单独都是没用的——也就是说，为了解决给定的问题提供一个完整的解决方案，需要它们的所有部分，如\
  \ Figure 3-22a 所示。需要这种逻辑实体集合的经典例子是模拟变长宏和模板。在这种独立但高度协作的同类实特殊情况下，我们合理地选择将所有此类类放在单个组件中，以减少不必要的物理混乱。从\
  \ C++11 开始，变长参数已经是 C++ 语言的一部分，这大大减少了这一共存理由的适用性。\n\n\n\n\n\n这一支持内聚（colocation）的第三标准也适用于实现\
  \ C 兼容过程接口的组件（例如参见图 3–147，第 3.11.7.3 节）。\n\n![](img/fig3-22.jpg)\n\n**图 3-22：单一解决方案内聚标准**\n\
  \n然而，如果逻辑实体并不小且规则，如果某些实体（物理上）依赖于其他实体，或者单个实体本身可能是有用的，则应采用分离的组件（见图 3-22b）。\n\n例如，假设有五个类：`Coordinate`、`Point`、`Box`、`BoxCollection`\
  \ 和 `Garage`，每一个都依赖于前一个。人们可能会认为，没有 `Box`，`BoxCollection` 就是毫无用处的，因此将 `Box` 定义在与\
  \ `BoxCollection` 相同的组件中是有意义的。这不是我们使用的标准。相反，我们观察到 `Box` 可以脱离于 `BoxCollection` 独立使用，因此我们将\
  \ `BoxCollection` 所依赖的 `Box` 放在它自己的独立组件中。同样，仅仅因为 `Point` 较小且实现 `Box` 所需要，就将 `Point`\
  \ 类与 `Box` 类放在同一个组件中，不足以作为内聚的理由：`Point` 类也是一个独立有用的概念。\n\n将仅包含少数非原始函数的工具类与其操作的值类型放在同一个组件中，这违背了分离原始功能与非原始功能的基本目的（参见第\
  \ 3.2.7 节）——即它使我们能够添加或更改非原始函数的接口，而无需迫使仅使用原始功能的客户端重新编译。同样，为了让多个从外部访问的类的定义正确存在于同一个组件中，它们在物理上必须是独立的、在逻辑上是协作的、通常是小且规则的、单个是无用的，但整体上又构成了一个针对单一、不可分割问题的内聚性解决方案。\n\
  \n### 3.3.1.4 第四个理由：大象身上的跳蚤\n\n公共类内聚的第四个有效理由允许了一定的裁量空间。假设我们有一个非常大的公共子系统，例如日志单例，它定义了两个公共方法：`initSingleton`\
  \ 和 `shutdownSingleton`。进一步假设我们提供了一个作用域保护类 `LoggerScopedGuard`，它在构造时调用 `Logger::initSingleton`，在析构时调用\
  \ `Logger::shutdownSingleton`，其中所有函数都声明为 `inline`。就像“大象身上的跳蚤”一样，这种纯语法的、高度协作的全内联类所增加的重量从物理角度来看将完全不会被察觉。此外，日志器组件级文档（参见卷\
  \ II 第 6.15 节）中的用法示例（参见卷 II 第 6.16 节）会希望推广使用 `LoggerScopedGuard`。如果将这个微道的保护类提升到一个单独的组件，它很可能会被忽视（且不被使用）。(52）。因此，如图\
  \ 3-23a 所示，将这两个类内聚在单个组件中具有良好的实践意义。\n\n^(52) 在我们的方法论中，为了避免在组件层级描述循环性（参见卷 II 第 15\
  \ 节），我们故意让多个外部可访问类的定义在物理上独立、逻辑上协作，并正确地存在于同一个组件中，它们通常是小且规则的、单个是无用的，但整体上又构成了一个针对单一、不可分割问题的内聚性解决方案。（参见卷\
  \ III 第 10 节）。这种协作通常发生在应用层级（参见卷 III 第 7 节）。为了使最高层级的软件能够自由更改，我们故意将此类易动软件放置在单个单元内（参见卷\
  \ II 第 14 节）。这种协作（参见第 2.13 节）。\n\n![](img/fig3-23.jpg)\n\n**图 3-23：大象身上的跳蚤内聚标准**\n\
  \n相反，如果角色反过来——即“跳蚤身上的大象”，我们不会考虑这一点，而是会如图 3-23 所示，故意将所有内联类放在分离的组件中，以减少代码体积（参见第 2.6\
  \ 节）。注意，由于不合理的滥用（参见第 2.6 节），这种做法是允许的（参见第 2.9 节）。此外，将诸如 `==` 等非原始运算符与其操作的类型在同一个组件中内聚（参见第\
  \ 2.4 节）。\n\n![](img/unfig3.jpg)\n\n### 3.3.2 跨组件内聚\n\n**指南**\n\n**将必须一起更改的软件内聚在一起。**\n\
  \n相互协作是内聚的一个重要标准。特别是，我们希望将在逻辑或实践上必须一起更改的软件内聚在一起（参见第 2.13 节）。(53）。这种相互协作通常发生在非组件层级（参见第\
  \ 2.12 节）。(53）。在我们的方法论中，我们让此类易动软件位于单个单元内（参见第 15 节）。为了使应用层的软件能够自由更改，我们故意禁止外部软件依赖它（参见第\
  \ 2.13 节）。(53）。参见 martin96，“The Cohesion of Closure,”第 233–234 页。\n\n### 3.3.3 何时将辅助类设为组件私有\n\
  \n理想情况下，所有对库的高度协作更改都限制在单个组件内。此时允许（参见第 2.16 节）使用友元等语言特性有助于确保客户端无法访问不稳定的接口。有时，特别是在泛型编程中，我们希望将类的实现拆分到若干子类中，这些类的接口特定于父类，并且可能会更改，因此不打算在组件之外使用。在这种情况下，我们可能希望采用额外的下划线约定（参见第\
  \ 2.27 节），以指示辅助类的使用被明确限制在定义它的构造体内部。\n\n图 3-24 展示了通用容器模板类 `HashTable2` 如何通过内聚在同一组件内的多个实现类（在本例中为\
  \ `struct`）来实现。第一个非公共 `struct` `HashTable2_DefaultPolicies` 提供一组默认策略，客户端可以自由覆盖它们，但这些策略专门设计为随着经验优化而更改。第二个这样的\
  \ `struct` `HashTable2_ImpUtil` 提供系列 `static` 辅助方法，这些方法故意不对主类的类型参数化，从而减少了客户端的编译时间和代码膨胀。(54）。第三个组件私有的\
  \ `struct` `HashTable2_WorkArounds` 仅用于隔离当前的编译器 Bug，一旦说服编译器供应商接受合适的补丁，它可能会被移除。所有这些类都提供了有用的分解，但它们中的任何一个都不应该在定义主公共类的组件之外使用。\n\
  \n^(54) 减少复杂模板实例化涉及的代码量——特别是当在 `.cpp` 文件中使用外部绑定时——通常可以大幅减少编译所需的时间以及生成的代码（参见卷 II\
  \ 第 4.5 节）。\n\n\n\n\n\n## 图 3-24：使用组件私有类重构实现\n\n⁵⁵ `bslmf` 代表 `bsl` 组件包组中的“元函数”包（参见\
  \ bde14，子目录 `/groups/bsl/bslmf/`）。\n\n值得注意的是，组件私有类并不能（或不应）作为从分层重用角度仔细审慎思考架构问题的替代方案（section\
  \ 0.4），然而，确实有人人急于“继续推行”，他们往往会避免将完全可重用的低级逻辑构造构建为适当组件，因为在短期内，这样做会更快或成本更低（section 0.1）。这种权宜之计如果不及时纠正，一旦迫在截止日期过去，就完全偏离了始终保持“长期贪婪”的观点（section\
  \ 0.12）。^(56)\n\n^(56) David Sankel 在对本书手稿的评述中认为：“‘长期贪婪’的直接成本——无论是开发者的疲劳还是令人讨厌的管理干预——可以通过提供执行原本需要手动工作的自动化工具来显著降低……你正确地勾勒了什么是‘正确的事’，但同样重要的是，尽可能地让正确的事变成容易做的事。”\n\
  \n将可能具有独立有用价值的功能封装在单个组件中会使其测试变得困难得多。我们拥有一套成熟的测试方法论（参见卷 III），该方法利用了基于原理类 `category`（参见卷\
  \ II，第 4.2 节）的重复模式。在一个组件内包含多个类，意味着测试用例的顺序（参见卷 III，第 10 章）将不再是规范的，这反过来会显著削弱我们创建、理解和维护组件级（“单元”）测试驱动程序的能力。\n\
  \n此外，当未来需要从外部使用这种本质上非常有用的部分时，它将无法被立即使用，随后必须从其组件中提取出来、编写文档、重新测试等，或者更糟糕的是，作为私有细节在其他组件中重复，尽管如此它仍然需要编写文档和进行测试。组件私有类应仅限于高度协作的类、可能发生变化的类，以及那些变化必须与其他同位置类同步发生的类。\n\
  \n### 3.3.4 模板特化类的同位置\n\n模板特化是导致同的另一个常见原因。假设我们正在创建一个模板类，例如 `metafunction`，它由于某种原因^(57)\
  \ 需要一个或多个特化版本。这些特化版本中的任何一个单独来说都是没用的，但它们与通用模板类一起，共同提供了一个完整且高效的解决方案。在这种情况下，我们像声明内联函数一样，在同一个组件头文件的所有公共类下方声明特化类。但请注意，任何未声明为\
  \ `inline` 的函数模板显式特化都具有外部绑定（section 1.3.4），因此它们的定义确实应该存在于相应的 `.cpp` 文件中。\n\n^(57)模板特化主要用作（通用模板的）实现细节，它利用特定类型（通常是为了优化目的），并且（通俗来说）不应用于定制通用模板的语义——即契约（参见卷\
  \ II，第 5.2 节）。\n\n### 3.3.5 从属组件的使用\n\n有时我们会发现协作变更会合理地扩展到组件边界。在这种情况下，限制整个组件的使用是合适的。我们对组件名称使用的双下划线约定（section\
  \ 2.7.3）允许一个组件的使用成为另一个组件的从属（section 2.7.5）。请记住，这种约定的惯用法是允许特定平台的实现在独立的 `.h`/`.cpp`\
  \ 对中。然而，我们可能会遇到其他情况，即实现子系统的低级组件接口由于过于协作、不稳定或“尚未成熟”而无法公开。将此类子组件的使用限制在特定的组件（再次，在同一个包内）在实践中（至少在短期内）通常是“正确”的。\n\
  \n### 3.3.6 在单一 UOR 内定位紧密协作\n\n**指南**\n\n**将跨公共组件的紧密协作限制在单个 UOR 内。**\n\n虽然不理想，但易变的接口（section\
  \ 0.5）可能需要在库级别暴露。当多个协作组件的公共接口随时间需要更改时，将它们定位在同一个发布单元（UOR）内将极大简化维护。将这些更改分散到多个并行的 UOR\
  \ 中通常会导致同步发布这些库。这种跨级别的紧密 UOR 协作更加糟糕，会导致反复重新构建。\n\n本地协作的问题不在于不常见的生产发布，而是在开发过程中，即软件反复编译、链接和执行的过程中。当所有共同演化的软件保持在一个单一\
  \ UOR 中，所谓的旋转成本将保持相对较小。假设我们有一个跨多个 UOR 实现的加密流子系统，如图 3-25 所示。“加密”设施类似于一个编码器（section\
  \ 2.8.3），位于一个 UOR 中，而“解密”设施位于另一个 UOR 中，后者——仅用于测试（参见图 2-84c，section 2.14.4)）——依赖于前者（参见图\
  \ 2-82e，section 2.14.3);另见卷 III，第 8.6 节）。这两个 UOR 都依赖于位于物理层次结构底部的组件中不断演变的枚举和特征（特定于加密）。\n\
  \n![](img/fig3-25.jpg)\n\n**图 3-25：跨 UOR 的紧密协作（坏主意）**\n\n### 3.3.7 天数示例\n\n\n\n\n\
  \n作为可塑性库子系统共同存在的第二个真实世界示例，请考虑由金融服务行业（历史上）引入的日期计数约定，这些约定旨在便于涉及两个日期之间天数的计算。`difference`\
  \ 函数不是确定从一个日期到另一个日期的实际天数，而是返回一个近似值，其精确值取决于这两个日期；然而，请注意，将两个参数日期中的每一个都移动一天并不一定会产生相同的结果。\n\
  \n例如，`ISMA 30/360` 日期计数约定通过假设每月 30 天、每年 360 天来近似计算：让较早的日期表示为 `Y1`/`M1`/`D1`，较晚的日期表示为\
  \ `Y2`/`M2`/`D2`。如果 `D1` 是 31，将其更改为 30。如果 `D2` 是 31，将其更改为 30。差值现在由 `(Y2 − Y1) ·\
  \ 360 + (M2 − M1) · 30 + D2 − D1` 给出。^(58)\n\n^(58) **brown90**\n\n此类约定是相当任意的。另一个约定\
  \ `PSA 30/360`（带有月末调整）描述如下：让较早的日期表示为 `Y1`/`M1`/`D1`，较晚的日期表示为 `Y2`/`M2`/`D2`。如果 `D1`\
  \ 是 2 月最后一天（闰年为 29，否则为 28），则将 `D1` 更改为 30；否则如果 `D1` 是 31，将 `D1` 更改为 30。如果此时 `D1`\
  \ 是 30 且 `D2` 是 31，则将 `D2` 更改为 30。差值现在是 0 和 `(Y2 − Y1) · 360 + (M2 − M1) · 30 +\
  \ D2 − D1` 中的最大值。^(59)\n\n^(59) **fincad08**\n\n注意，需要 `max` 函数是因为 `D2` 没有 2 月调整，且如果没有它，简单的差如\
  \ `(1999/02/28 − 1999/02/28)` 会产生 −2。\n\n尽管这些约定早已超出了它们的`计算` 寿命，但当今的生产环境中确实有几十种这些细微不同的日期计数约定，而且这个集合可能会继续增长（尽管很缓慢）。在评估特定的金融工具时，通常会规定一种特定的晦涩日期计数约定。鉴于需要这种功能，它应该放在哪里呢？\n\
  \n### 功能放置 (Placement Functionality)\n\n将此类高度特定且复杂的功能放置在我们库的日期类中（无论是作为实例还是 `static`\
  \ 方法）显然是非常不智的之举。每添加一个新约定，实现广泛使用的（值语义的）日期类（参见第二卷，第 4.3 节）的组件就必须进行修改，这与我们确保稳定性的愿望相悖（参见第二卷，第\
  \ 5.6 节），特别是对于低级 `vocabulary` 类型（参见第二卷，第 4.4 节）。此外，此类功能最可能与大多数日期类的用户无关；因此，此类功能会干扰普通观众的本质接口。由于直接访问底层表示通常没有真正的性能优势，这种非原始类型的功能（section\
  \ 3.2.7）最好实现在日期的旗舰组件之外。^(60)\n\n^(60) 唯一的标准日期差 `actual/actual` 自然属于实现日期类本身的库组件内部（例如，作为\
  \ `operator-` 和 `operator-=`）。恰巧的是，这种特定的差值计算也可以从直接访问 `private` 序列日期值中显著获益，这是我们对接口中广泛使用的日期对象的首选实现方式（参见第二卷，第\
  \ 4.4 节）。\n\n### 建议的解决方案 (Proposed Solutions)\n\n再次问自己，这些奇怪的日期计数函数应该位于哪里？一种可能的解决方案是将所有这些差值函数移动到单一的高层组件中（可能甚至不在同一个包中），其中实用程序类的每个\
  \ `static` 方法都接收两个日期参数，并以反映特定约定的命名，如 图 3-26a 所示。在这种渲染方式中，每个约定将有两个函数——一个用于 `daysDiff`，一个用于分数年份——总共\
  \ 2*N 个函数（*N* 是约定的数量）。\n\n![](img/fig3-26a.jpg) ![](img/fig3-26b.jpg)\n\n**图 3-26：实现各种日期计数约定的单一组件**\n\
  \n同样地，我们可以创建一个枚举和一对静态函数，根据两个日期和一个枚举器来计算天数差和年份比例（图 3-26b）。后者这种更紧凑的方法也是灵活的，但当只需要一个约定（通常在编译时确定）时，它的效率明显较低。^(61)\
  \ 注意，由于运行时效率的需求，我们最初没有选择旧式的抽象 `DayCount` 基类（“协议”）以及一组具体实现^(62).这种函数无法合理地内联，并且根据提供的约定进行运行时分发。^(62)\
  \ 图 3-26 中提出的两种解决方案都将这种非原始功能与日期类解耦，但仍将所有约定留在单一组件中。任何需要单个约定的程序都将被强制编译。\n\n### 模块化方法\
  \ (Modular Approach)\n\n现在考虑我们也可以创建一个专门用于日期计数的整个包，如图 3-27 所示。我们可以将此包命名为 `bbldc`，代表*基础库日期计数*。这个相对轻量的包将自然位于\
  \ `bbl` 包组，它仅依赖于我们的*基础开发*包组 `bdl` 以及 `bsl`。^(63)\n\n^(63) 这些和其他分层可重用的包组可以在 Bloomberg\
  \ 的 BDE 开源发行版中找到（参见 **bde14**).\n\n![](img/fig3-27a.jpg) ![](img/fig3-27b.jpg) ![](img/fig3-27c.jpg)\
  \ ![](img/fig3-27d.jpg)\n\n**图 3-27：跨 bbldc 包分解日期计数**\n\n每个支持的约定（例如 ISMA 30/360）将实现在独立的“叶子”组件中，如\
  \ 图 3-27b 所示。`util` 后缀是我们标识标准“工具”组件的约定（参见 图 2-23, section 2.4.9），它由一个单一的 `struct`\
  \ 组成，仅包含公共 `static` 方法、`typedef` 和常量（以及在极少情况下的私有 `static` 数据^(64)）。只需要部分约定的客户端不需要包含其他部分，也不会随着新日期计数组件的添加而受到影响。由于实现任何一个\
  \ `daysDiff` 或 `term` 函数的代码量很小，这些函数可以高效地内联。此外，每个此类组件（连同其测试驱动）都可以作为下一个的蓝图（参见第三卷第\
  \ 10 章）。\n\n^(64) 例如，为了实现快速的隔离表查找（参见第二卷，第 6.6 节）。\n\n\n\n\n\n枚举本身也被放置在自己的叶子级组件中（图\
  \ 3-27c），这符合我们希望将设计完全拆分到标准类别中的愿望（参见第二卷第 4.2 节）。仅需要识别约定而无需进行计算的客户端可以将它们的依赖限制在唯一的“枚举”组件上，从而避免不必要地涉及其他部分。最后，对于特别需要访问所有支持的天数计数约定的系统，提供了顶层*封装*（wrapper）^(65)\
  \ 组件 `bbldc_daycountutil`（图 3-27d）。\n\n^(65) 也称为*外观*（façade）。请参见 `gamma95**，第 4\
  \ 章，“Facade”节，第 185–193 页。\n\n看起来我们为了这种细粒度的灵活性在组件数量上付出了高昂代价。通常情况下，组件越多，开发工作和物理复杂性就越高。然而，请注意，事实恰恰相反。某些结构（如枚举）被拆分并视为独立单元的成本要低得多。事实上，支持枚举所需的辅助功能机制（例如转换为\
  \ ASCII、流式处理）以及相关的文档和测试，是我们称为*克隆*（duping）过程的半自动生成过程的理想候选对象。^(66) 一旦一个典型的枚举组件（例如\
  \ `bdlt_dayofweek`）完成设计、实现、文档和测试（参见第三卷第 10 章），将其“克隆”——连同它的组件级测试驱动程序——到另一个组件（例如 `bbldc_daycount`）的增量成本是微乎其微，远比将该功能插入到其他类型的组件中（例如\
  \ `bbldc_daycountutil`）要便宜得多。\n\n^(66) 注意，这种通过故意复制“范例”组件来提高生产力和一致性，同时减少字数输入的形式，绝不是为了给缺乏纪律的源代码复制粘贴行为提供许可。\n\
  \n同样，一旦我们实现、文档化并测试了实现天数计数的许多叶子组件之一，将其克隆到其他组件的增量成本也相对较小。设计的规律使得新增组件的复杂性保持在可控范围内。而且，由于所有实现天数计数的组件都位于同一个包中，我们可以方便地通过包名\
  \ `bbldc` 统一引用它们。正是通过主动将枚举和天数计数计算等常规模式拆分为独立的、相似的组件，我们才能大幅降低复杂性和开发成本，同时实现极其高效、有效且灵活的细粒度可重用架构。\n\
  \n此外，考虑到所有这些被“克隆”的天数计数组件都实现了一致的*结构协议*（structural protocol），即*概念*（concept）（第 1.7.6\
  \ 节），可以通通用使用。这意味着，任何符合要求的的天数计数工具 `struct` 都可以作为编译时类型参数，用于任何设计为操作满足该*天数计数概念*（day-count\
  \ concept）的类型的模板类。此外，很容易将这种（极其高效的）编译时多态适配到更灵活的^(67)“运行时”多态，方法是创建一个派生模板类，例如 `DayCountAdapter`，它将符合要求的天数计数\
  \ `struct` 转换为实现（唯一的）*词汇表*（vocabulary）（参见第二卷，第 4.4 节）基类协议的派生类型，例如 `DayCount`，如图\
  \ 3-28 所示。\n\n^(67) 但效率*并不*降低——特别是当优化器可以访问内联虚函数和模板类的源代码时，这在 `bslma::Allocator` 中很常见（参见第二卷第\
  \ 4.10 节）。\n\n![](img/fig3-28.jpg)\n\n**图 3-28：将天数计数工具适配到（唯一的）协议类**\n\n将共同更改的组件放置在一起是一个重要的设计目标。枚举和高层封装组件与缓慢增长的叶子天数计数组件之间存在紧密的协作。每当添加一个新的天数计数时，枚举和封装组件也都更新，以便向那些必须访问*所有*约定的客户端提供新约定。通过将这些高度协作的组件放在同一个包中，我们最大限度地减少了添加新组件且协作组件必须更改时产生的维护负担。\n\
  \n### 观察\n\n**包可以用于显式地将在设计上必然是语法上（以及语义上）相似的组件组合在一起（例如，它们都实现了同种相同的*协议*或满足相同的*概念*），前提是它们自然地共享本质上相同的物理依赖范围。**\n\
  \n回想（第 3.2.9 节），通常情况下，组件的语义和物理依赖而非其语法属性应该影响它们的相对打包方式。特别是，将非原始的但密切相关的功能（例如对于值类型，参见第二卷\
  \ 4.2）隔离在独立的高层包中是一个坏主意，因为这阻碍了功能的发现（第 3.2.9 节）。在我们的天数计数示例中，有一部分组件满足上述所有要求，可以放在单独的包中，如图\
  \ 3-29 所示。\n\n![](img/fig329.jpg)\n\n**图 29：将特定的天数计数放在自己的包中**\n\n这种方法的唯一（微小）缺点是，每当向\
  \ `bbldcu` 包添加新的天数计数时，高级 `bbldc` 包也需要修改，这将维护负担分散到了多个包中。幸运的是，这些修改不需要同步进行：可以向 `bbldcu`\
  \ 添加新组件并进行完全测试；然后在稍后的某个时间，以后兼容的方式扩展 `bbldc` 中高度协作的枚举组件。^(68) 此外，两个包都位于相同的 OR（即 `bbl`\
  \ 包组），因此将（仅）特定的天数计数工具分组到它们自己的独立包 `bbldcu` 中 是一个非常可行的设计方案。\n\n^(68) 注意，从 C++11 开始，枚举的底层整数类型可以被更改，从而导致可能的\
  \ ABI 破坏。虽然现在可以在本地声明不带枚举成员的枚举，但正因为整数类型可能会变化，即使是这些部分定义也应包含与定义组件相关的头文件中。\n\n两种替代方案之间的折中方案是只使用一个包\
  \ `bblx`，但为每个单独的天数计数工具的基名（以及相应的 `struct` 名称；第 2.4.7 节）提供公共前缀（例如 `dc`），例如 `bdlx_dcisma30360`、`bdlx_dcpsa30360eom`\
  \ 和 `bdlx_dcsia30360eom`。这样，所有天数计数组件自然地聚集在 `bblx` 包目录下。此外，满足细微不同概念的天数计数组件可以在同一个包内相应地分组（例如\
  \ `bdlx_dc1isma30360`、`bdlx_dc2isma30360`、`bdlx_dc2psa30360eom`）。^(69)\n\n\n\n\n\
  \n请注意，这种最终方法是我们在实践中选择的方法。\n\n### 3.3.8 最终示例：单线程引用计数算子\n\n现在，让我们考虑一个信封/信件（envelope/letter）模式的经典实例，它实现了一套自定义的引用计数算子，该套算子最初（约\
  \ 1998 年）用于单线程事件驱动编程应用程序。我们选择这个示例是因为它具有许多小的可分离逻辑部分、在多个维度上具有高度的语法/语义规则性，并且具有很高的教学价值。在介绍了整体逻辑设计后，我们将开始通过组件和包对其进行最优渲染。\n\
  \n`coplien92`, 第 5.5 节，第 133–165 页。\n\n尽管这是一个真实的“现实”生产代码示例，但从 C++11 开始，得益于对变长模板、线程安全引用计数指针（`std::shared_ptr`）以及编译时多态算子（`std::function`\
  \ 和 `std::bind`）的支持，我们现在可以直接从 C++ 标准库更灵活（且几乎同样高效）实现相同的功能。尽管如此，这些架构概念仍然适用。\n\n####\
  \ 3.3.8.1 事件驱动编程简要回顾\n\n我们首先对单线程事件驱动编程进行简要回顾。典型函数（例如 `sqrt`）可以轻松地利用可用 CPU 周期来高效地推进计算状态直到完成。当某个函数因为某些所需信息或资源尚未就绪而无法继续时（例如服务器尝试从客户端读取下一个请求），该函数可能会被阻塞，这可能允许其他进程（或线程）在它的操作系统分配的时间片内利用其原本可能处于空闲的\
  \ CPU，如图 3-30a 所示。然而，如果执行该函数的同一个（单线程）进程也负责提供该信息或资源，那么整个进程将会挂起。\n\n一个空转地消耗 CPU 的函数（例如通过主动轮询），但在所需资源可用之前无法将计算状态推进到某点的函数，也被认为是*阻塞*（尽管对硬件资源的利用率较低）。\n\
  \n![](img/fig3-30.jpg)\n\n**图 3-30：两种不同的编程范式**\n\n为了让单个控制线程模拟多个并发的线程，我们使用了一种被称为*时分复用*（time\
  \ multiplexing）的经典编程范式。在这种完全不同的编程模型中，一个全局事件管理器（也称为*事件循环*）会轮询（例如以轮询的方式）所有可能的事件源，以发现哪些事件已经发生。然后，事件循环会调用与该事件关联的回调“函数”，如图\
  \ 3-30b 所示。然而，为了使这种方法生效，每当函数需要阻塞时，它必须显式地*让出*对 CPU 的使用（即 `return`），在此之前必须向事件管理器注册一个新的回调，以便在所需信息或资源就绪后被调用。\n\
  \n在历史上（使用 C 语言时），响应事件而被调用的函数在向事件管理器注册回调时，会接收一个由用户提供的不透明内存块的地址。如图 3-31 所示，这个“用户数据”提供了处理事件所需的任何*上下文*。请注意，这种类\
  \ C 风格的编程既不是类型安全的，也不具备封装，并且不明智地将显式的资源管理与领域功能混合在一起。\n\n![](img/fig3-31a.jpg) ![](img/fig3-31b.jpg)\n\
  \n**图 3-31：事件驱动编程的经典方法**\n\n一种更现代、更合理的编写事件驱动程序的方法是注册的（作为事件管理器的回调）不仅是一个无状态的*函数*，而是一个有状态的*算子*（“函数对象”），其中注册代理在*回调对象本身内部*嵌入了响应事件所需的特定上下文。图\
  \ 3-32 提供了一个原型的引用计数算子类模板的草图，该模板恰好需要 *N* 个参数才能被调用。\n\n![](img/fig3-32.jpg)\n\n**图\
  \ 3-32：通用 *N* 参数算子（信封）接口草图**\n\n在缺乏变长模板的情况下，我们被迫创建一组分离的算子类以适应不同数量的所需参数。每个 `FunctorN`\
  \ 都充当从调用者（服务器）提供的 `N` 个参数到调用者（回调函数）期望 `N + M` 个参数的映射。算子持有额外的 `M` 个参数。图 33 显示了一个类似于图\
  \ 31 所示的场景，展示了设计良好的引用计数算子库的灵活性——它用于封装任意数量的指定类型参数（例如 `controller` 和 `amount`）。\n\n\
  在 C++11 之前，C++ 语言还没有变长模板。请注意，本章的建议适用于所有具有独立编译单元的语言，而不只是 C++ 的最新版本。\n\n![](img/fig3-33.jpg)\n\
  \n**图 3-33：（某种）更现代的事件驱动编程方法**\n\n实现这些引用计数算子的细节有很多。然而，我们关注的话题是物理设计以及如何最好封装这种特定的算子以实现最佳效用。图\
  \ 3-34 展示了该算子族中每个成员的基本模式。算子本身是一种*信封*，持有一个指向其*信件*的指针，在这种情况下，信件是多态的，取决于用户提供的*额外*参数的数量。\n\
  \n![](img/fig3-34.jpg)\n\n**图 3-34：获取 *N* 个必需参数的原型算子**\n\n假设我们想创建一个支持最多 9 个（必需和用户提供的）组合参数的库。在这种情况下，我们需要：(1)\
  \ 10 个*信封*类来表示各种具体的*接口*（即*词汇*）*类型*（参见第二卷第 4.4 节），(2) 10 个对应的*抽象信件*以实现对用户提供信件的多态表示，(3)\
  \ 10 + 9 + ... + 1 = 55 个*具体信件*（每个派生自抽象信件并具有相同数量的必需参数），以支持最多 9 个必需和用户提供参数的所有可能组合，(4)\
  \ 55 个对应的*工厂*（工具）函数——每个具体信件对应一个函数——客户端通常会使用这些函数来填充信封。\n\n\n\n\n当我们考虑到还希望同时支持 `const`\
  \ 和非 `const` 成员函数回调（连同上述考虑的自由函数）时，具体的 `Letter` 类模板以及相应的模板化工厂函数数量将激增到每个 165 个！如果我们将这些每一个逻辑实体都放置在各自独立的组件中，我们将面临大约\
  \ 350 个物理上不同的实体，这足以稳健地填充整个包组了（第 2.9 节）。然而，我们的直觉应该告诉我们，所提供的功能并不值占据所有的物理空间。根据我们共存设计指南（在本节开头介绍）中的第\
  \ (3) 节点——*单一解决方案*（Single Solution）——允许进行适当的共存，这将极大地简化问题。^(75)\n\n^(75) 从 C++11\
  \ 开始，我们有了变长模板，这（至少对于 C++ 而言）消除了许多原本在*单一解决方案*准则下会构成共存的内容。\n\n### 观察\n\n**包名和组件名有时可以被有效地用于表示设计的正交维度，但仅限于高度规则的框架内。**\n\
  \n选择将每个 `Envelope` 模板的定义保留在各自独立的组件中是有完全道理的。首先，每个 `Envelope` 组件都旨在产生一个*词汇类型*（vocabulary\
  \ type）——即在公开函数的接口中广泛使用的类型（见第二卷第 4.4 节）。其次，事件驱动库接口中定义的调用的回调的签名（以及返回类型）不太从软件的一个版本改变到下一个版本。相比之下，参与此接口的应用程序客户端完全有权调整它们提供的函数对象，包括相应数量的用户提供的参数，毕竟，这些本质上是实现细节。如果让客户端每当他们更改提供的可选参数数量时就必须更改他们包含的头文件，将既是无聊的也是错误的。\n\
  \n现在让我们考虑，每个具体的字母（类似地对于其相应的工厂函数）只是一个微小的模板，只解决了其直接处理的问题的一个部分，并且与其同类的解决方案完全没有依赖。此外，由于具体的字母和工厂函数都是模板，（至少在典型的生产/部署场景下）不存在由于共存导致的过度耦合问题：每个被调用的（*双绑定*）工厂函数和相应的派生具体字母类的方法都将被单独生成，并根据需要独立合并（第\
  \ 1.3.4 节）。正是在这种场景下，根据*单一解决方案*标准进行共存（见图 3-22a，第 3.3.1.3 节）是最合适的。\n\n那么我们应该如何封装具体的字母呢？对于划分这\
  \ 165 个轻量级派生具体字母类模板，我们至少想到了三种合理的策略。参考图 3-35，我们可以根据以下几点对这些具体字母分组：(1) 必需参数的数量，(2)\
  \ 额外的用户提供参数的数量，或 (3) 必需加可选参数的总数（即合并后的数）。^(76) 这三种建议的分组起初看起来可能产生本质上相同的不平衡结果。然而，请注意，组合选择\
  \ (3) 具有明显的优势，使我们能够将参数总数扩展到 10、11、12 等，而无需触碰现有代码，只需添加新组件（但见下文关于工厂工具函数的讨论）。\n\n^(76)\
  \ 例如，假设我们允许对于三种类型的函数（即自由函数、`const` 成员和非 `const` 成员）每种最多允许九种（必需和用户提供的）参数表示，我们可以根据参数的总数（称为*深度*，depth；见第三卷第\
  \ 8.7 节）对这些组合进行枚举，如下所示。将会有三个完全不接受任何参数的类。会有六个接收一个参数的类：三个接收一个必需参数，另外三个接收一个用户定义的参数。会有九个接收两个参数的类：三个接收两个必需参数，另外三个接收一个必需参数和一个用户定义的参数，最后三个接收两个用户定义的参数，依此类推。\n\
  \n![](img/fig3-35.jpg)\n\n**图 3-35：将具体字母模板类分组为组件**\n\n现在让我们考虑相应的工具函数，看看它们是否能为可能的最佳分组提供启发。这里有一个强烈的偏好：我们希望将工厂函数围绕相应的接口类型\
  \ `Functor*N` 进行分组。也就是说，我们希望根据*必需*参数的数量对这些“填充”函数进行分组。为了理解为什么，考虑任何接受注册的的服务都会以其*接口*中定义的固定数量（以及类型序列）的*必需*参数调用其回调函数对象，而这些是不应该改变的（第\
  \ 0.5 节）。任何考虑使用此类服务的客户端都需要填充恰好数量（以及那些类型）的必需参数函数对象，这完全暗示了应该包含哪个工厂/工具组件头文件。\n\n鉴于任何*额外*参数的数量都是实现细节且更容易更改，围绕这种不稳定的特征对工具函数分组是愚蠢的，因为更改用户提供的参数数量将需要用户同时更改\
  \ `#include` 指令！最小化工具组件的物理依赖也让我们重新考虑之前根据参数总数对具体字母分组的倾向，转而同样根据必需参数的数量对它们分组。通过这种封装方式，每个工厂函数工具组件只需要依赖其*一个*对应的具体字母组件。根据必需参数的分组在图\
  \ 3-35 中以选项 (1) 所示。\n\n##### 3.3.8.2 汇总组件为包\n\n每个*字母*（和*工厂*）组件中的类（和函数）由一组规则的小同类组成，其中任何一个都不是独立用的，但它们共同构成了一个单一问题的完整解决方案：具有特定数量必需参数的具体字母的实现和工厂。我们的共存标准改进了易用性，降低了物理复杂性，并保持了最优的空间和运行效率。我们尚未考虑这些组件是属于单个包、多个包，甚至是多个组（见图\
  \ 2-72，第 2.9.3 节），以及具体在企业级结构中位于哪里。我们现在来处理这个问题。\n\n\n\n\n无论这些组件的绝对位置如何，我们必须自问：组件之间的物理依赖关系是否发生了剧烈变化。答案显然否，因此我们得出结论：所有这些组件都可以合理地存在于一个包组中（2.9\
  \ 节）。接下来，我们考虑这个集合设施依赖于哪些其他组件。答案是，除了低级内存分配器协议 `bslma::Allocator`（见第二卷第 4.10 节）之外，并不多。考虑到我们认为该子系统的使用可能扩展到几乎任何领域，我们可能会合理地将其放置在企业级物理分层结构中相当低的位置。\n\
  \n下一个任务是确定将这些组件分发到两个或多个包中是否存在任何价值。将所有四十个组件放在单个包中是一种格外的可能性，但如果这个泛器子系统需要扩展——例如，引入返回值的回调，而不仅仅是返回\
  \ `void` 的回调，或者当然，增加支持的最多所需参数数量——那么一个包内的组件数量可能会变得不成比例地巨大且冗肿。\n\n从理论上，人们可能会根据泛器参数的数量将每组四个组件定义在自己的包中。按照我们目前最多九个总参数计算，这种分组将产生十个包，每个包恰好有四个组件。这种模块化并非不可行，但它未能捕捉除了这十个子系统相互独立之外的任何信息。此外，一个永远不会超过四个组件的包无法通过长期的物理扇出测试（3.1.7\
  \ 节）。\n\n从接口的角度来看这个分区问题，我们看到泛器封装（envelopes）和实用程序是外部客户端熟悉的实体，而基础表示和具体字母本质上是实现细节。具体字母只会被其对应的实用函数接触。沿着这条思路，我们可以根据组件是否被外部客户端直接使用，将这些组件划分为两个包。由于泛器组件依赖族中的每个所需参数切片都形成一个菱形（见图\
  \ 3-34 和 3.3.8.1 节），这种分组看起来非常合理。\n\n如果我们确实决定泛器如图 3-36a 所示自然跨越两个包——一个代表包含封装和实用程序的*接口*，另一个代表包含基础表示和具体字母的实现——那么该如何命名？\n\
  \n如果我们确实决定泛器自然跨越两个包，如图 3-36a 所示——那么该如何命名？\n\n现在假设我们考虑图 3-36b 所示的交替包方式，以考虑到扩展性。泛器所依赖的抽象类型（见第二卷第\
  \ 4.4 节）几乎不会改变，因此我们是否需要完全描述这些 C++ 的（不完全抽象）“字母”类型？\n\n从稳定性的角度来看（0.5 节），这些组件属于非常低层级。另一方面，用于填充封装的实用程序完全是可扩展的。虽然这个泛器设施已经足够通用，但我们可能会为了多线程应用程序实现一套并行的、具有线程安全的具体字母，\n\
  \n在实践中，为了实现多线程使用的最高性能，我们将使用直接嵌入在抽象字母基类中的计数器上的原子增减指令来实现线程安全的引用计数（见第二卷第 4.7 节），遗憾的是（但也是必要的），在不需要此类同步（例如单线程、事件驱动的程序）的情况下会对性能产生不利影响。\n\
  \n经过大量的预先思考，仅基于工程原因，我们成功得了图 3-37 所示的合理物理结构，其中 350 个可能分离的逻辑实体现在合并为 40 个组件：十个*封装*（`odef`）、十个*抽象字母*（`odefr`）、十个*具体字母*（`odefi`）以及分布在四个不同包中的十个*工厂*（`odefu`）。代码分配并不均匀。参数越多的泛器需要的工厂方法和具体字母类就越少。尽管如此，考虑到竞争的设计目标，这种分组可能是一个正确的选择。\n\
  \n\n\n\n拥有所有四种包类别，除了对依赖进行灵活控制外，另一个重要的结果是：在这个扩展泛器设施中，每个组件的基础名称可以简单地命名为 `vfunc`N，其中\
  \ `N` 是所需参数的数量（`v` 表示 `void` 返回类型，在需要时将 `rfunc`N 留给非 `void` 返回值）。同时请注意包名中字符 `f`\
  \ 的位置用法是如何在一个较大的包组内的一组紧密相关的包之间实现紧密的逻辑关联的，而无需诉诸额外的显式聚合层级。将类和函数经过思熟地分组到组件和包中，使得我们的逻辑设计更易理解和使用。\n\
  \n总结一下：这个最后的示例考虑了一个受经典事件驱动编程启发的“信封字母模式”（envelope-letter pattern）的具体实例。我们根据逻辑内聚性和完整性，将通用（可重用）引用计数函数对象（泛器）族的\
  \ 350 个独立逻辑结构划分为仅 40 个组件。然后，我们将这 40 个组件分组成四个包，以强化词汇表和特征依赖。这个相当长的泛器示例体现了我们通过细粒度的逻辑分解以及在物理模块中对逻辑内容的合理布局所努力实现。\n\
  \n### 3.3.9 节小结\n\n总结本节，我们介绍了四个可以证明将多个公共类共同位于单个组件内的具有合理性的独立标准：\n\n1. **友谊 (Friendship)**\
  \ — 即，使得逻辑封装不会超出单个组件的物理边界。\n2. **循环依赖关系 (Cyclic Dependencies)** — 即，使得逻辑上相互依赖的结构不会导致不同组件之间产生循环的物理依赖（尽管这可能需要重新设计）。\n\
  3. **单一方案 (Single Solution)** — 即，当单个逻辑结构是独立的同类项，但又没有任何一个是可以单独有用的时，避免无用的物理复杂性。\n\
  4. **大象身上的蚤 (Flea on an Elephant)** — 即，允许一个依赖于大对象且通常与之一起使用的微小逻辑结构，例如，以便它们可以在单个用法示例中共同编写文档（参见第二卷第\
  \ 6.16 节）。\n\n由于必要（即，不仅仅是因为懒惰）而具有高度协作接口的辅助类——特别是当此类接口可能会发生变化时——通常最好保持在同一组件内私有，例如使用额外的下划线约定（第\
  \ 2.7.3 节），以确保整个组件对外部客户端的稳定性。\n\n实际上是另一个“客户端”组件的不稳定实现细节的“从属”组件，通常可以通过将其放在同一个包中并使用我们的双下划线^(78)\
  \ 命名约定（第 2.7.3 节）来确保它仅供该本地“客户端”组件使用（第 2.7.5 节）。\n\n^(78) 注意不要与包含两个连续下划线的名称混淆，后者是\
  \ C++ 语言留给标准本身的实现者使用的。\n\n必须从外部访问且随时间变化的变化的高度协作组件，如果限制在单个 UOR（单元实现单元）以及理想情况下在同一个包中，其可维护性要高得多。\n\
  \n与在值语义类型上提供任意非原始功能的实用程序不同（参见第二卷第 4.3 节），那些在设计上以一种高度统一和规则的方式（例如泛型地）在语法上（以及语义上）被消耗的组件有时可以通过隔离在专门用于该目的包中来获益，前提是任何一个组件的预期物理依赖不超过已指定为整个包适当的范围。单个包内的常用组件名称前缀也可以用于区分此类语法/语义的相似性。\n\
  \n最后，利用不同的包前缀在一个维度上识别组件类别，同时在所有参与的包中使用具有对应基础名称（第 2.4.7 节）的组件来识别另一个维度，这可能是有效的。正确使用这种模块化方法要求这些语法方面对于架构语义是本质的（第\
  \ 3.1.5 节），并且生成的包和组件框架是完全规则的（dead regular）。\n\n## 3.4 避免循环链接时依赖\n\n你可能遇到过这样的情况：第一次查看一个软件系统时，似乎找不到一个合理的起点，或者找不到一个本身有意义的系统部分。无法独立地理解或使用系统的任何部分是*循环依赖*“设计”的症状。\n\
  \n考虑图 3-38 所示的子系统。一个复杂的网络可以建模为子网络、设备和电缆的集合。因此，`Network` 知道 `Device` 和 `Cable` 的定义。设备知道它所属的网络，并可以告诉它是否连接到指定的电缆。因此，`Device`\
  \ 也知道 `Network` 和 `Cable` 类型。最后，电缆可以连接到设备或网络的终端。因此，为了完成它的工作，`Cable` 必须能够访问 `Device`\
  \ 和 `Network` 的定义。\n\n```\n![](img/`)），指示该工具的单位（例如股份）数量。为了会计目的，我们可能想要包含开启*部位*的*日期*和支付的*价格*。我们简化模型中的每个（股票）证券恰恰引用一个底层的公司，因此创建了\
  \ UML 图。\n\n```\n![](img/fig3-39a.jpg) ![](Images/fig3-39b.jpg\n```\n\n**图 3-39:\
  \ 朴素实体关系模型的循环物理实现**\n\n\n\n\n\n图 3-39b 展示了一个相当直接的软件翻译如何非常容易地产生循环物理依赖。在这个承认的（有些）刻意的示例中，类级设计显示\
  \ `my::Company` 类*使用*了 `my::Account` 类型，而该类型反过来又通过 `std::list` *聚合*了 `my::Position`\
  \ 类的实例。检查 `#include` 指令可以证实，标记为 `my_company` 的物理组件依赖于 `my_account` 组件，而 `my_account`\
  \ 又依赖于 `list` 和 `my_position` 组件。\n\n`#include` 指令进一步表明，除了依赖 `bdlt_date` 和 `bblt_price`\
  \ 之外，`my_position` 组件还依赖于 `my_security`。然而，关键的缺陷出现在我们允许 `my::Security` 类*知道* `my::Company`\
  \ 类的定义时，推测是为了方便 `my::Security::getCompanyName` 访问器的实现，将其作为指向 `my::Company::companyName`\
  \ 的转发。这一最终的隐含依赖（第 1.9 节）导致 `my_company`、`my_account`、`my_position` 和 `my_security`\
  \ 在物理上形成了*循环依赖*！\n\n曾几何时，高层逻辑设计往往隐含循环。在我第一本书出版后的那几年里，^(79) 人们越来越广泛地认识到^(80) 逻辑层面隐含的物理循环是不好的（第\
  \ 2.6 节），许多软件设计师现在积极避免它们。尽管如此，随着高层设计通过更详细的规范不断完善，开发过程中添加的组织机制和胶接逻辑可能会将原本完全合理的架构缝合在一起。也就是说，即使初始设计是健全的，循环往往也会出现：1)\
  \ 随着细节增长超过单个图表能够合理理解的范围，(2) 在实现阶段，或 (3) 随着时间的推移作为例行维护的结果。通过（高效地）提取实际依赖（第 1.11 节）这种尽职调查可以帮助防止此类意外的事故。\n\
  \n^(79) `lakos96`\n\n^(80) `sutter05`，“编码风格”章节，第 22 项，第 40–41 页，特别是第 40 页：\n\n……相互依赖的模块并不是独立的模块，而是被胶在一起成一个更大的模块，一个更大的发布单元。因此，循环依赖违背模块化，是大型项目的祸星。避免它们。\n\
  \n今天，初始设计通常经过仔细规划并刻意避免循环的。随着时间的推移，客户意想不到的需求可能会引发考虑不周的战术性增强，从而引入意外的循环依赖。例如，让我们考虑一个包含三个独立但广泛使用的子系统\
  \ `logger`、`transport` 和 `mail` 的公司级基础设施，如图图 3-40 所示。遗憾的是，这三个子系统是循环依赖的，但它们最初并不是这样的。更糟糕的是，如果正确理解*分层技术*（参见第\
  \ 3.5 节），本没有这些循环。尽管如此，让我们来看看这种意外、并不罕见且非常不幸的物理纠缠是如何发生的。\n\n![](img/fig3-40.jpg)\n\
  \n**图 3-40：循环依赖的子系统（坏主意）**\n\n正如我们所知，可靠的传输并非轻易实现。机器会故障、连接会断开、数据包会丢失等。当问题发生时，我们需要知道它是何时以及何地发生的等信息。在我们创建专用\
  \ `transport` 设施的第一版本时，我们还没有 `logger` 子系统（图 3-41a）。\n\n![](img/fig3-41.jpg)\n\n\
  **图 3-41：随时间演变的循环物理依赖（坏主意）**\n\n当发生意外情况时，我们只是将错误消息打印到本地文件（由环境变量标识）。最终很明显地，这种原始的解决方案对于我们日益扩大的开发组织来说是不够的，于是启动了一个创建一个公司级\
  \ `logger` 设施的项目。与此同时，另一个提供高效公司级 `mail` 子系统的独立项目已经完成并发布（图 3-41b）。\n\n鉴于我们那辉煌的 `transport`\
  \ 设施，没有人考虑过有一天可能会有其他的、甚至是更好的电子邮件传输方式；因此，`mail` 子系统在现有的传输子系统之上*分层*（参见第 3.7.2 节）。最终，新\
  \ `logger` 子系统的第一个版本完成并发布了（图 3-41c）。\n\n该 `logger` 设施旨在供应用程序和高层子系统提取并记录程序运行的信息。每个类别（或*领域*）可调的“调试”级别允许我们改变特定子系统的信息量和细节。我们可以使用环境变量、配置文件或命令行参数来控制这些设置，但这些方法都意味着需要重启进程。以后我们可能会意识到，我们还需要能够在运行时更改这些设置（见下文）。在完成这个强大的\
  \ `logger` 设施后，^(81) `transport` 子系统升级以使用它并发布了第二个版本（图 3-41d）。不久后，`mail` 子系统也进行了类似的升级（图\
  \ 3-41e）。\n\n^(81) `ball`（BDE 应用库日志）包的开源版本具有相对宽松许可证（适用于大多数商业用途），可以在 Bloomberg BDE\
  \ 开源发行版的 `ball` 包中找到（参见 `bde14`) 给定的日志语句是否需要执行任何操作，如果不需要则快速跳过。因此，将 `transport` 和\
  \ `mail` 子系统直接分层在 `logger` 设施之上是一个恰当的设计。幸运的是，目前还没有循环；使用 `mail` 子系统构建的典型应用程序的链接非常直接：\n\
  \n^(82) 访问日志属性是多线程应用程序有效使用无锁数据结构的理想应用。例如，参见 `kliatchko07`。\n\n点击此处查看代码图片\n\n```\n\
  $ ld main.o app.a ... mail.a tran.a log.a ...\n```\n\n\n\n\n\n通过使用可以显而易见，为了修改日志属性而停止正在运行的程序是不可接受的。对此建议将\
  \ `logger` 子系统升级，以接受 IPC 连接并解释收到的控制消息，从而动态更新 `logger` 的配置状态。鉴于目前只有一个子系统实现了所需的 IPC\
  \ 功能，开发人员迅速决定使用 `transport` 来控制 `logger`；然而，这些开发者并没有考虑到允许 `logger` 直接使用 `transport`\
  \ 子系统所带来的物理后果。`logger` 设施的第二个版本发布了。不幸的是，我们现在已经在 `logger` 和 `transport` 子系统之间引入了一个物理循环（图\
  \ 3-41f）。\n\n因此，独立的 `transport` 库和 `logger` 库之间的链接顺序不再有保证的顺序：\n\n点击此处查看代码图像\n\n\
  ```\n$ ld main.o app.a ... mail.a tran.a log.a ... tran.a log.a ...\n```\n\n尽管存在物理上的负担，`logger`\
  \ 仍然被继续使用。随着时间的推移，几位开发经理发现，在日志文件中搜索关键信息太不方便了。高层管理人员“建议”再次升级 `logger` 子系统——这次是允许它在发生严重错误时发送邮件消息。同样，在不考虑物理后果的情况下，现有的\
  \ `mail` 子系统被使用了——这次是由 `logger` 直接使用的。`logger` 子系统的第三代版本发布了，但现在出现了一个涉及三个主要子系统的循环物理依赖（图\
  \ 3-41g）。\n\n所需的库链接顺序可能根据应用程序的不同而异，甚至随着应用程序从一个版本到下一个版本而异：\n\n点击此处查看代码图像\n\n```\n\
  $ ld main.o app.a ... mail.a tran.a log.a ... mail.a tran.a log.a ...\n```\n\n链接时依赖在建立软件的整体*物理设计质量*^(83)\
  \ 方面起着核心作用。更传统的质量方面，如可理解性、可维护性、可测试性和可重用性，都与物理设计的质量紧密相关。如果不仔细防止，循环物理依赖将剥夺系统的这种质量，使其变得缺乏活性且难以管理。特别是与低级子系统相关的高度耦合不仅增加了这些子系统的成本，还会大幅增加高层客户端和子系统的开发与维护成本^(84)。\n\
  \n^(83) `lakos96`，第 4.13 节，第 193–201 页。\n\n^(84) 关于与循环相关的成本的定量示例，请参见 `lakos96`，第\
  \ 5.2 节，图 5-18，第 225–228 页。\n\n消除图 3-40 中 `logger`、`transport` 和 `mail` 子系统之间的循环依赖（可能）通过使用*回调*（callback）分层技术（参见节\
  \ 3.5.7）来实现，即使用两个抽象接口（参见图 3-79，第 2.5.7.4 节）：一个用于控制 `logger` 的（transport）`Channel`，另一个用于发布已记录消息的\
  \ `Observer`。对于这些接口中的每一个，随后通过一个高层实体（例如 `main`）向 `logger` 提供相应的*适配器*（adapter）（参见节\
  \ 3.7.5）。从每个*协议*（protocol）（节 1.7.5）中，我们派生出一个具体的类，将相应的机制（即 `transport` 或 `mail` 子系统）适配到该协议。这种对抽象接口和适配器的使用将导致我们所谓的*横向*（lateral）架构（参见节\
  \ 3.7.5）。\n\n关于使用回调来打破循环^(85)，有一个警告（呼应了 `lakos96` 中的警告）需要提注意：\n\n^(85) 源自 David\
  \ Sankel 对本卷手稿的评审\n\n在我自己的团队中，我们见过可以简短地称为“技术上无循环，但尽管如此仍循环的设计”。当有人机械地使用回调来打破循环依赖，而不解决组件之间底层的纠缠时，就会发生这种情况。这些系统比它们取代的循环系统更难以理解！这是因为回调的额外间接使得跟踪代码流变得更加困难。\n\
  \n— David Sankel, Bloomberg LP (c. 2018)\n\n换句话说，在不解决底层问题的情况下使用回调来打破依赖可能会产生严重的后果。总结一下：循环依赖即使最初不存在，随着时间的推移也会出现，并成为人类理解的一个大问题。在接下来的（异常漫长的）章节中，我们将对……进行全面处理###实现内聚物理模块（如组件、包和包组）之间避免循环依赖的设计，可以说是成功软件设计中最重要的单一方面。^(86)经典的开发实践——特别是应用于面向对象的软件时——往往会导致相互依赖的设计。\n\
  \n#### 经典分层\n\n已经确定了九类通用技术^(87) 对解物理依赖关系有用。这些既定的*分层技术*在图 3-42 中进行了总结。(88)。使用这些技术创建*可分层*的设计往往有助于缩小巨大且有时棘手的逻辑设计空间，并引导开发者向更具维护性的架构方向发展。\n\
  \n\n\n\n\n87 lakos96, 第 5 章，第 203–325 页\n\n88 引用自 lakos96, 第 5.11 节，第 524–525 页，特别是第\
  \ 525 页上的无序列表。\n\n![](img/fig3-42.jpg)\n\n**图 3-42：标准分级技术总结。（Lakos, John,*Large-Scale\
  \ C++ Software Design,* © 1996。经 Pearson Education, Inc., New York, NY 许可重印并电子复制。）**\n\
  \n在自这些分级技术首次发布以来，它们被反复用于实现良好的物理架构。令作者感到惊讶的是，并没有出现任何深层次的新分级技术。然而，鉴于分布式计算甚至语言本身（例如成员模板）的进步，其中某些技术的相对重要性（以及应用）已经发生了变化。例如，使用（广义）回调函数正成为一种更加常见且必要的设计实践。在下文中，我们将介绍我们今天认为这些技术的重要方面。对更详细的额外示例感兴趣的读者，请参考该主题的开基性著作。\n\
  \n### 3.5.2 提升（Escalation）\n\n*将相互依赖的功能移动到物理层级中的更高位置。*\n\n第一种且仍然是最常用的分分级技术被称为 `escalation`（提升）。其基本思想是：当两个组件想要互相引用时，其中一个或两个组件的某些方面可以移动到物理层级中的更高层。通过“提升”（`escalating`）这些方面，我们将一种尴尬的相互依赖转换为一种欢迎的向下依赖。\n\
  \n提升需求的一个经典示例可以在两个独立的类 `Rectangle` 和 `Box` 中找到，它们在 图 3-43a 中被抽象地展示。这两个类都旨在表示相同的值（见卷卷\
  \ II，第 4.1 节），但每个具体类都有不同的内部表示（图 3-43b），导致了不同的性能特性。\n\n![](img/fig3-43.jpg)\n\n**图\
  \ 3-43：表示矩形形状的两种方式**\n\n最初，这两个类在物理上可能是独立的；但随着时间的推移，从一个转换为另一个的需求将变得不可而易见（见卷卷 II，第\
  \ 4.4 节）。引入（隐式的）相互构造函数，每个构造函数引用另一个类型，如 图 3-44b 所示，会立即在其各自组件之间产生循环相互依赖（图 3-44a）。\n\
  \n![](img/fig3-44.jpg)\n\n**图 3-44：（不可接受的）循环物理依赖**\n\n具有循环物理依赖是不可接受的（章节 1.8、1.9\
  \ 和 2.6）。相反，我们可能会选择用其中一个类来实现另一个类，从而消除任何循环依赖。例如，我们可以决定 `Rectangle` 是两个类中更原始的类，并将所有转换功能推入\
  \ `Box`，如 图 3-45 所示。注意，在在这种渲染中，`box.h` 包含了 `rectangle.h` 以实现 `Rectangle` 与 `Box`\
  \ 之间的 `inline` 转换；结果是对 `rectangle.h` 的任何更改都将强制 `Box` 的所有客户端重新编译。还要注意，尽管 `rectangle.h`\
  \ 恰好也包含了 `point.h`（在今天），但我们刻意在 `box.h` 中直接包含 `point.h` 以避免间接包含（章节 2.6），以防该实现细节随后发生变化，导致我们的\
  \ `box` 组件无法编译。\n\n![](img/fig3-45.jpg)\n\n**图 3-45：`Box`（及其客户端）依赖于 `Rectangle`，但反之不然。**\n\
  \n另一种可能性（如 图 3-46 所示）是我们决定 `Box` 是更基础且更广泛使用的类，并且——顺便如此——我们也决定隔离（`insulate$，见 章节\
  \ 3.10 和 3.11）`Rectangle` 的客户端免受 `Box` 变化的影响，前提是他们也没有选择直接使用 `Box`。对于不直接使用 `box`\
  \ 的客户端，`box.h` 的更改将不会强制他们重新编译。\n\n![](img/fig3-46.jpg)\n\n**图 3-46：`Rectangle`（及其客户端）依赖于\
  \ `Box`，但反之不然。**\n\n尽管上述解决方案都是可行的，但通常更好、更细粒度且解耦的解决方案是将所有相互功能 `escalate`（提升）到一个更高层的组件——例如，到一个新的\
  \ `convertutil`，如 图 3-47 所示。\n\n![](img/fig3-47.jpg)\n\n**图 3-47：`Rectangle` 和 `Box`\
  \ 是相互独立的。**\n\n注意，在 图 3-47b 所示的渲染中，我们让 `convertutil.h` 包含（而不是本地声明）`Rectangle` 和\
  \ `Box` 的定义，作为 `inline` 函数。还要注意，由于 `Point` 类被直接用于这些内联例程的实现中，我们需要在 `convertutil.h`\
  \ 中直接包含 `point.h`（定义 `Point` 类），而不是依赖 `rectangle.h` 或 `box.h` 来这样做。因此，`convertutil.h`\
  \ 在编译（章节 6.1）方面确保了自自足（章节 2.6）。提升技术的另一种常见用法是从派生的抽象基类中提取具体节点的创建，并将其放置在更高层的工厂组件中。考虑一个由以下部分组成的子系统：1)\
  \ 一个抽象基类 `Widget`，2) 派生类集合 `WidgetN`，3) 用于创建和配置这些特定 widget 的 `static` 工厂方法组，通过公共抽象基类型的（托管）指针返回。选择将这些\
  \ `static` 工厂方法放在抽象 `Widget` 基类中将不仅会在基类与每个派生类之间产生循环依赖（如 图 3-48a 所示），还会通过间接性（章节 1.8）在所有派生\
  \ widget 类之间产生循环依赖！\n\n![](img/fig3-48.jpg)\n\n**图 3-48：将创建提升到使用之上**\n\n面向对象编程范式的本质优势之一是，每个派生对象的客户端都需要知道其具体类型，更不用说能够创建一个。将创建派生类型的功能与允许客户端使用它们的功能放置在同一个组件中，几乎消灭了纯接口继承（见卷卷\
  \ II，第 4.7 节）相比于仅仅切换类型所提供的所有实际优势。通过简单将 `static` 工厂方法提升到更高层的组件（例如 `widgetutil`，如\
  \ 图 3-48b 所示），我们消除了所有的物理循环，允许每个客户端仅依赖其所需的内容，并且这样做完全没有牺牲逻辑功能！\n\n\n\n\n`escalation`（升级）层级化技术的另一种有效用法是隔离非原生的（section\
  \ 3.2.7）重量级依赖（section 1.9）以及其他类型的有问题的物理依赖。作为一个简化的说明，假设我们有一个非常简单的 `Date` 类，它仅包含 `year`、`month`\
  \ 和 `day` 属性，这些属性可能代表也可能不代表一个有效的日期值。对于这样一个`unconstrained attribute class`（无约束属性类，见第二卷第\
  \ 4.2 节），除了设置或访问其属性值、获取其内存分配器（如果需要）或比较两个 `Date` 类对象是否相等（section 3.3.1.4）之外的所有功能，都被认为是非原生的，并应该存在于更高层级的组件中。\n\
  \n现在，假设我们为这个朴素的 `Date` 类实现一个 `isValidYearMonthDay` 函数。`Date` 类所知道的所有只是它有三个属性：`year`、`month`\
  \ 和 `day`；它并不知道这些属性可能所属的历法（例如，格利哥历、推测格利哥历）。^(89) 将该功能放在 `Date` 类中将限制该类参与其他历法上下文的能力。此外，在这样一个简单、纯净的属性类中掺杂完全可以在外部实现的功能，并没有性能上的优势。\n\
  \n^(89) 与（经典的）格利哥历不同，格利哥历在 1752 年从 9 月 3 日起缺少了 11 天，且在该日期之前将每个世纪年（例如 1700 年）视为闰年；而推测格利哥历对待每个\
  \ 400 年的周期都是相同的，其中能被 4 整除的年份是闰年，除非它们也能被 100 整除（在这种情况下则不是），除非它们也能被 400 整除（在这种情况下则是）。对于现代代的所有日期，它们没有区别；然而，当尝试表达参考日期与当前日期之间的天数差时，只要参考日期在\
  \ 1752 年 9 月的缺口之前，差异就会出现：格利哥历的天数差比推测格利哥历多出两天（见 `iso04` 第 4.3.2.1 节）。\n\n假设我们已经为工具函数确定使用推测格利哥历，我们可以将\
  \ `isValidYearMonthDay` 函数以及其他仅基于日期的三个属性且无需额外类型即可表达的功能移动到更高层级的组件 `dateutil` 中——它位于同一个包中——如图\
  \ 3-49 所示；参见 (a)。同样，诸如根据同一历法查找给定日期的该月最后一天等功能，也也将存在于 `DateUtil` 中。通过这种方式，我们解耦了那些不需要为了性能而紧密访问实现、或者不是所提供和文档化功能固有部分的功能。\n\
  \n![](img/fig3-49.jpg)\n\n**图 3-49：升级更宽范围的/或重量级功能**\n\n进一步，我们可以想象一个 `DayOfWeek`\
  \ 枚举，用于表示对应给定日期的星期几。实现 `DayOfWeek` 的组件（例如，参见图 2-40、section 2.6）显然独立于 `Date` 和所采用的特定历法。如果我们想提供确定指定日期星期几的功能，可以将该功能放在\
  \ `DateUtil` 中，但这将引入 `DateUtil` 对 `DayOfWeek` 的逻辑（因此也是物理）依赖。鉴于 `DateUtil` 不依赖任何其他类型，我们可能会选择将该功能放在一个新的、更高层级的组件中，例如实现\
  \ `DayOfWeekUtil`，它可以自由依赖于 `Date` 和 `DayOfWeek`，甚至可能依赖于 `DateUtil`（如果需要的话）。在 `DayOfWeekUtil`\
  \ 中的其他功能可能包括查找给定 `Date` 所在月份和年份的第 *n* 个星期几。\n\n是否在这一粒度级别上划分功能是一个工程判断问题。将代码拆分到这种程度在理论上是恰当的，但会让潜在的“现实世界”客户端更难知道去哪里寻找特定功能，反过来可能会让这种细细构的库代码更难以使用。根据\
  \ Jeffrey Olkin（在他对本手稿的评论中）：\n\n如果我正试图寻找一个确定星期几的函数，如果我以前用过它处理其他函数，我最可能会在 `DateUtil`\
  \ 中查找。我可能甚至不知道 `DayOfWeekUtil` 的存在，尽管我可能对这样的函数不在 `DateUtil` 中感到惊讶，但这不会自动推导出我会寻找另一个相关的组件。\n\
  \n—Jeffrey Olkin (c. 2017)\n\n因此，在实践中对功能进行重构的粒度可能涉及某种“艺术”同时也也涉及“科学”。^(90) 公平地说，David\
  \ Sankel（在他对手稿的评论中）指出，“虽然 Jeffrey 所说的是事实，但这类软件的用户如果找不到他们想要的东西，应该立即去包级别查找。”\n\n\n\
  \n\n这种极高的运行时性能如果实现在定义 `Date` 的组件外部，将根本是不可能实现的。由于这些原因，最初想要根据已经按值共享的接口依赖来完全重构我们的结构体（`struct`）冲动最终应该被抑制；而那些仅使用\
  \ `Date` 接口中已用类型的通用功能（如 `DayOfWeek`），应该并列位于工具类 `DateUtil` 中（例如参见图 3-65、第 3.12 节）。请注意，在这里提供关于何时（以及何时不）根据接口依赖重构功能的这种额外指导，完全归功于本书书中每个章节都经过的详尽审查过程（以及亲爱的朋友杰弗里·奥尔金）。到目前为止没有任何功能会增加显著的物理依赖，但这种情况确实是可能的，而且在实践中发生得频繁。回想图\
  \ 2-74、第 2.9 节，仅凭逻辑内聚性并不一定就是功能共置于同一个发布单元的理由。假设我们有一个组件 `xyz`，它具有与 `date` 无关的显著物理依赖。我们自然期望这样的组件会位于一个单独的包（如果不是组）中，如图\
  \ 3-49 所示；然而，仅属于 `xyz` 的非原始功能自然会与它一起存放在同一个包中，但在一个实现 `yzUtil` 的独立组件中。为了避免暗示使用其中一个（`xyz`\
  \ 或 `date`）需要另一个，我们选择将同时依赖于 `xyz` 和 `date` 的（非原始）功能提升到更高层次的包，该包定义为 `xyzdate`，如图\
  \ 3-49 所示；参见 (c)。通过这种方式，我们能够更精确地选择在编译和链接时仅包含我们真正需要的内容。简而言之：**提升**（escalation）通常是是将问题的相互依赖转换为向下依赖的极佳方法。当我们看到两个组件之间似乎存在向上依赖时，我们通常可以重构较低层次的组件，并引入一个更高层次的组件，其中所有依赖都是向下的（且无环的）。将非原始功能提升到同一包中更高层次的工具类是，或者应该是标准做法。如果我们发现自己正向工具类的接口中引入额外的类型（即使来自同一个包），我们可能想要考虑将该功能提升到独立的、更高层次的工具中（可能在同一个包中），以支持该更广泛的接口。最后，如果我们考虑将功能置于现有工具中，但这会导致跨发布单元（UORs）的过度耦合，我们应该认真考虑将这种重量级功能提升到位于更高层次\
  \ UOR 的另一个工具中。\n\n### 3.5.3 降级 (Demotion)\n\n**降级**（Demotion）是一种层次化技术，其中功能被重构并放置在物理层次结构的较低位置，最通常是为了实现更广泛的使用（重用）。例如，图\
  \ 3-50a 中的子系统 `xyz` 实现了一个低级功能 `F`，它在内部使用该功能，但该功能也被 `xyz` 所依赖的子系统 `rst` 需要。`F` 的其他客户端被迫依赖整个\
  \ `xyz`，因此也间接依赖 `rst`。通过将 `F` 降级到较低层次的包 `abc`（如图 3-50b 所示），`xyz` 和 `rst` 中的组件都可以依赖\
  \ `abc` 中的 `F`，而不会产生任何包循环。此外，`F` 的其他客户端不再需要依赖 `xyz` 或 `rst`。\n\n![](img/fig3-50.jpg)\n\
  \n**图 3-50：降级功能**\n\n类似的循环依赖也可以发生在对象级别。考虑一个父对象 `EventQueue`，它管理许多 `Event` 类型的子对象，而\
  \ `Event` 定义在单独组件中。特定事件的信息直接存储在每个事件对象中，而所有事件共有的信息则直接存储在 `EventQueue` 对象中。当事件传递给函数进行处理时，与事件相关的所有信息包括存储在\
  \ `EventQueue` 中的公共信息）必须通过 `Event` 的公共接口可用。\n\ncontent 展示了实现这些组件的一种直接方法，但导致了实现 `EventQueue`\
  \ 和 `Event` 的组件之间的循环依赖。问题在于 `Event` 类型持有指向它的整个 `EventQueue` 对象的指针。然而，`Event` 对象实际上只需要指向\
  \ `EventQueue` 中公共部分的指针。\n\n![](img/fig3-51.jpg)\n\n**图 3-51：循环 EventQueue/Event\
  \ 实现（糟糕）**\n\n无循环的解决方案意外地简单。通过将公共信息提取到独立的 `CommonEventInfo` 类并将其降级到物理独立的组件（如图 3-52\
  \ 所示），我们实现了功能目标：允许 `Event` 的客户端访问所有信息，同时避免了 `EventQueue` 和 `Event` 之间的循环。另一种使用不透明指针的物理无循环解决方案见第\
  \ 3.5.4.2 节。\n\n![](img/fig3-52a.jpg) ![](img/fig3-52b.jpg) ![](img/fig3-52c.jpg)\n\
  \n**图 3-52：层次化的 EventQueue 实现（良好）**\n\n### 3.5.4 不透明指针 (Opaque Pointers)\n\n**仅通过名称使用另一个对象。**\n\
  \n不透明指针层次化技术的核心思想是：我们在本地声明对象的类型，但在编译、链接或测试（本地）组件时完全不依赖其定义。因此，这种对（不透明）指针的异常用法产生了描述仅通过名称的接口依赖的特殊符号。\n\
  \n#### 3.5.4.1 经理/员工示例\n\n回想...\n\n\n\n\n在 `Employee` 上拥有一个如 `numStaff` 的直接方法（如图\
  \ 3-53b 所示），不仅意味着每个 `Employee`（在构造时）都被赋予了其经理的地址，还意味着定义 `Employee` 类的组件 `#include`\
  \ 了定义 `Manager` 类的头文件，从而在定义 `Manager` 和 `Employee` 的相应组件之间引发了循环物理依赖，如图 3-53a 所示。\n\
  \n![](img/fig3-53a.jpg) ![](img/fig3-53b.jpg)\n\n**图 3-53: 经理/员工功能的循环渲染（坏主意）**\n\
  \n由于员工本质上是一个较低层级的实体，它无法直接告诉（高层级的）经理该做什么，但完全能够通过其不透明地址（即无需 `#include` `my_manager.h`\
  \ 头文件）来识别经理。这种新设计需要一个更高级别的客户端函数，例如 `askEmployeeNumStaff`（图 3-54b），来重新描述问题：首先向 `Employee`\
  \ 对象询问其 `Manager` 对象的地址，然后使用该地址（现在处于 `Manager` 类定义的上下文中）直接向该 `Manager` 对象询问其管理的\
  \ `Employee` 对象数量。生成的层级化组件类图如图图 3-54a 所示。(93)\n\n^(93) 一如既往地，必须小心确保不透明指针（它显然没有管理其资源）像任何其他原始指针一样，在它所引用对象的生命周期之外不再被实质性地使用（例如，被其他人使用）。\n\
  \n![](img/fig3-54a.jpg) ![](img/fig3-54b.jpg)\n\n**图 3-54: 经理/员工功能的无循环渲染**\n\n⁹⁴\
  \ 注意，我们刻意从这个 `const` (*访问器*) 方法中返回一个 `const Manager` 指针，以保持 `const` 正确性（参见卷 II，第\
  \ 5.8 节）；通过在构造时要求非 `const` 指针（并在内部存储为该类型），我们保留了以后添加返回非 `const Manager` 的非 `const`（操纵符）重载的选项（参见卷\
  \ II，第 5.5 节）。\n\n#### 3.5.4.2 事件/事件队列示例\n\n作为“仅名称级依赖”有效用处的第二个示例，考虑上述 *Demotion*\
  \ 解决方案中的 `Event` 对象（参见图 3-52，第 2.5.3 节），它需要完整的定义知识，但仅需要父对象 `EventQueue` 的部分知识。现在假设包含的\
  \ `Event` 对象需要访问整个 `EventQueue` 对象，但其本身不需要知道其任何父对象的定义。在这种情况下，从属 `Event` 对象只需持有一个指向其父对象的不透明指针，即可为两者的客户端提供完全访问权限，如图\
  \ 3-55a 所示。\n\n![](img/fig3-55a.jpg) ![](img/fig3-55b.jpg)\n\n**图 3-55: 持有一个不透明的“回溯”指针**\n\
  \n与上述 `Manager` 类中的 `numStaff()` 方法（图 3-54b，第 3.5.4.1 节)）完全，假设 `EventQueue` 实现了一个公共的\
  \ `int numEvents() const` 方法。在 `Event` 自身提供这样的方法将要求 `Event` 拥有其父对象 `EventQueue`\
  \ 的定义知识，导致定义这两个类型的组件产生循环依赖。然而，如果 `Event` 对象仅持有其父对象的不透明地址——即在定义 `Event` 的组件任何地方都没有\
  \ `#include` `EventQueue` 的定义——那么 `Event` 就可以将此不透明地址提供给高级客户端，客户端 `#include` 了父定义，因此现在可以使用该\
  \ `EventQueue` 地址直接调用 `EventQueue` 对象上的 `numEvents` 方法。\n\n⁹⁵ 取决于 `EventQueue` 对象偶然（或能够）提供的\
  \ `Event` 对象“视图”的 `const` 性，返回的 `Event` 引用可能也可能提供非 `const` 访问，反之可能允许该 `Event` 的客户端修改\
  \ `EventQueue`。考虑到对 `Event` 对象的变异和非变异视图都是可能的，在构造时传递 `Event` 对象的“回溯”指针的（编译时）类型是非\
  \ `const` 的——这就像一个只有有时可以修改的私有数据成员在内部被维护为非 `const` 一样。\n\n⁹⁶ 注意，`Event` 类刻意提供两个获取父对象指针的并行方法，以保留名为\
  \ *`const` 正确性* 的重要属性（参见卷 II，第 5.8 节）。类型为 `X` 的对象具有此属性，确保确保接收 `X` 的 `const` 引用的函数在函数体内无法通过显式转换或全局访问获取该对象（或其部分）的非\
  \ `const` 引用。虽然队列本身——无论 `const` 否——总是用非 `const` 指针构造 `Event` 对象，但只有当它本身是非 `const`\
  \ 时，它才会以非 `const` 返回 `Event`，否则它将返回 `const` 修的地址。注意，如果 `Event` 仅实现一个方法\n\n```\n\
  EventQueue *parent() const;\n```\n\n我们就可以很容易（甚至无意地）构造一个名为 `stripConst` 的函数，它以 `const`\
  \ 引用接收 `EventQueue` 对象并在局部以非 `const` 返回该对象，而无需显式转换或全局访问（当然，前提是事件队列为空）：\n\n[代码图像]\n\
  \n关于 *`const` 正确性的原始详细定义和阐述，参见 **lakos96**，9.1.6 节，第 605–612 页。\n\n#### 3.5.4.3\
  \ 图/节点/边示例\n\n类似的方法用于由协作但物理独立的节点和边组成的图，如 3-56a 所示。例如，`Node`（图 3-56b）被实现为不透明 `Edge`\
  \ 指针的集合，指示相邻的边。`Edge`（图 3-56c）由“边数据”加上两个不透明的 `Node` 指针：`head` 和 `tail` 组成。我们可以在从未见过\
  \ `Edge` 定义的情况下实现——甚至测试 `Node`，反之亦然。(97) 需要由高级 `Graph`（*经理*，参见第 3.5.8 节）对象（图 3-56d）来确保表示给定图对象*值*的\
  \ `Node` 和 `Edge` 对象（参见卷 II，第 4.1 节）保持一致状态。(98)\n\n\n\n\n\n# 虽然这种特定的分层技术在从零开始设计时可能不是我们的首选，但它是一种很有价值的技术——特别是在演进先前的循环设计，或者外部规范规定了各种类型之间存在不幸的“接口使用”（Uses-In-The-Interface）关系时。特别是，它保留了许多现有的逻辑属性（例如，客户端仅需单个引用即可调用图内\
  \ `Node` 或 `Edge` 对象的 `const` 方法），同时能够对这些组件的每个部分进行独立、彻底的测试。请注意，这种设计并没有尝试模拟“友元（friendship）”，因为每个子组件都是稳定的，在合适的情况下，它们可以在其他类似的数据结构中使用。简而言之，这个示例更多是作为“可以做到什么”的说明，而不是对这样做的全面推荐。\n\
  \n# 注意，我们之所以能够实现这一目标并甚至返回一个非 `const Edge` 指针（主要用于说明目的），是因为仅在构造函数中 `only` 设置了 `Edge`\
  \ 的连通性，并且在 `Graph` 接口中从不返回可修改的 `Node`，这使得这种解决方案在实践中的用处有限。然而，通过在 `Graph` 内部提供所有适当的非\
  \ `const Node` 和 `Edge` 功能，并使用 `const` 指针作为迭代器，可以轻松扩展这种方法。关于这一特定问题的另一个更通用的解决方案，请参见图\
  \ 3-94、节 3.5.10.2。\n\n![](img/fig3-56a.jpg) ![](img/fig3-56b.jpg) ![](img/fig3-56c.jpg)\
  \ ![](img/fig3-56d.jpg)\n\n**图 3-56：持有不透明“侧向”指针的节点和边**\n\n99 另一种设计（特别是考虑到 C++11\
  \ 或更高版本）可能是 `std::unique_ptr<Node>` 的 `std::vector`。\n\n请注意，一个一致的 `Graph` 对象永远不会返回\
  \ `null` `Node` 或 `Edge` 对象；因此，我们可能会决定从 `Graph` 返回的所有此类对象都是通过引用用的（而不是地址），这使得孤立测试稍微棘手一些，但并非不可逾。100\
  \ 然而，涉及到非瞬态数据的表示时，始终使用指针而不是引用有其他好处。例如，如果我们想表示一个由（非拥有的）“离位”（out-of-place）元素向量，以确保在添加或删除其他元素时它们各自的地址保持稳定，该怎么办：\n\
  \n100 只要我们除了获取引用返回的对象的地址外不做任何其他操作，我们（至少在实践中）就没有调用（语言层面的）未定义行为，即使该地址——例如 `0x0` 或\
  \ `0xDeadBeef`（由于对齐引起）——永远不有效对象的地址。当通过函数接口引用传递无效地址时，只要该引用除了恢复所提供的地址外没有被用于其他地方，情况也是如此。请注意，这是\
  \ C++ 标准的一个灰色地带，但用于测试目的时并不是问题。纯粹主义者的替代方案（一种`保证`可移植的方案）是在另一个组件的测试驱动程序中创建一个虚拟的（或“模拟”）`Node`（或\
  \ `Edge`）类，然后使用该虚拟类型对象的地址进行测试。\n\n点击此处查看代码图像\n\n```cpp\nstd::vector<const Element\
  \ *> elements;\n```\n\n在这种情况下，我们显然不能使用引用。除了作为 `const` 或可修改的“视图”（特别是对于特定的函数调用）之外，由于引用的固有的局限性和复杂的语义，它们在表示数据方面很少优于指针。\n\
  \n### 3.5.5 哑数据 (Dumb Data)\n\n***使用指示对对级对象有依赖关系的数据，但仅限于独立的、高层对象的上下文中。***\n\n*哑数据*（dumb-data）分层技术是不透明指针（opaque\
  \ pointers）的另一种替代方案，虽然它的类型安全性低得多，但它具有`完全`值语义的的重要属性（参见第二卷第 4.1 节）。例如，让我们再次考虑我们如何实现图\
  \ 3-56、节 3.5.4.3 中的 `Graph` 子系统，但这次不使用不透明指针，使得节点和边分别表示一个独立于当前运行进程的值。其核心思想是，整数和字符串等传统值虽然对持有它们的对象来说是刻意无意义的，但客户端在更高层的上下文中可以理解为指向定义未被从属对象知的其他对象。\n\
  \n图 3-57a 显示了基于哑数据的类图。`Node` 类（图 3-57b) 现在表示为整数数组。同样，`Edge` 类（图 3-57c)现在表示为“权重”加上一组标识\
  \ `head` 或 `tail` 的整数索引。如果我们愿意，甚至可以将负索引映射到 `head`；这种数据的解释完全在*管理器* `Graph` 类手中。\n\
  \n![](img/fig3-57a.jpg) ![](img/fig3-57b.jpg) ![](img/fig3-57c.jpg)\n\n**图 3-57：使用哑数据代替不透明指针**\n\
  \n注意，与不透明指针分层技术不同，这里甚至没有其他（`Node` 或 `Edge`）类型的局部声明。相反，`Graph` 对象（图 3-57d)持有可索引的\
  \ `Node` 和 `Edge` 对象序列，并由它维护一致的状态。当 `Graph` 方法需要找到给定边引用的节点时，它只需从边中提取 `headId`，并将其作为父图维护的\
  \ `Node` 序列的索引。这种基本技术也用于查找 `Node` 对象的相邻边。\n\n例如，假设我们要编写一个获取图中（连接）节点相邻边的权重函数。使用不透明指针，函数只需要位于图\
  \ 3-58a 所示的 `Node` 和 `Edge` 定义上下文中。注意，使用不透明指针分层技术时，不需要父图的定义。然而，当使用哑数据分层技术时，客户端需要知道解释这些数据的上下文。虽然实现\
  \ `Node` 和 `Edge` 的组件之间没有任何共享知识，但这些类型的对象能够通过它们的父级 `Graph` 对象间接协作以实现所需的结果。因此，`Graph`\
  \ 对象将是客户端函数签名的一部分，如图 3-58b 所示。\n\n![](img/fig3-58.jpg)\n\n**图 3-58：对比不透明指针与哑数据的客户端用法**\n\
  \n注意，除了在图 3-58b 中包含 `my_graph.h` 之外，我们仍然需要直接包含 `my_node.h` 和 `my_edge.h`，以满足设计规则（节\
  \ 2.6），即必须直接包含它们实质性使用的内容。\n\n#### 3.5.6 冗余 (Redundancy)\n\n***通过重复少量代码或数据来故意避免重用，以避免耦合。***\n\
  \n\n\n\n刻意的`redundancy`与其说是一种层次分化技术，不如说是一种基本的常识。并不是所有代码都是可重用的，即使某些代码可以重，可能也不值得从其当前位置重用。如果在某处使用某段代码会导致过度（更不用说循环）的物理依赖，那么将该代码降级（必要时进行复制）到物理层级中较低的级别要明智得多。这种`continuous\
  \ refactoring`通常会导致（至少是暂时）产生两个相似的模块：一个是构思并首次引入该功能的模块，另一个是被妥善放置在公司范围内的软件资本（Software\
  \ Capital）仓库中的模块（section 0.9）。接受在至少一段时间内，可能需要对相同的功能进行冗余实现，使我们能够避免另一种更令人反感的替代方案——即在无限数量的应用中重复某些高层实现的某种形式。\n\
  \n另一方面，这种技术的存在本身并不意味着可以把日常性的“复制粘贴”作为进行尽职调查的权宜替代方案。如果可行其他技术（如降级），那么几乎应该总是采用该技术。如果被复制的功能必须与原始功能保持完全同步，那么对这种技术的任何使用都是高度可疑的。只有在探索了所有其他途径，并集体决定应用这种技术时，它才被认为是安全的。\n\
  \n例如，假设我们有 20 个客户端使用一个相对重量级的子系统 `Subsystem A`（Figure 3-59a），以及有 200 个客户端使用一个相对轻级的子系统\
  \ `Subsystem B`（Figure 3-59b）。现在让我们考虑涉及直接重用与冗余的两种场景。首先，假设 `Subsystem A` 正在升级，并且\
  \ `Subsystem B` 中的某个可重用组件在当前状态就适合用于 `Subsystem A`。如果由于某种原因，该可重用功能无法降级，那么应该允许 `Subsystem\
  \ A` 依赖于 `Subsystem B`（A Õ B），还是应该对该重用代码进行复制？这个问题的答案是，`Subsystem A` 依赖于 `Subsystem\
  \ B` `probably`是可以的；但最终决定应考虑到所有涉及功能的具体细节。\n\n![](img/fig3-59.jpg)\n\n**Figure 3-59:\
  \ 使用冗余避免依赖**\n\n现在让我们反过来提问，鉴于我们发现 `Subsystem A` 中的某些功能很有用，是否应该允许 `Subsystem B` 依赖于\
  \ `Subsystem A`（B Õ A），还是应该对该功能进行复制？这个问题的答案很可能取决于该组件是否实现了一种 `vocabulary type` ——\
  \ 一种在函数接口中广泛使用的类型（参见卷二第 4.4 节）。在没有强力反对理由的情况下，我们对允许 `Subsystem B` 依赖于 `Subsystem\
  \ A` 的意愿要比反过来要低得多。也就是说，如果 `Subsystem A` 中除了 `vocabulary type` 以外的某些不能无法被`demoted`（即移动到相互更低层级的子系统），我们几乎肯定在\
  \ `Subsystem B` 中（至少是暂时）复制该功能会更好，而不是让 `Subsystem B` 及其所有许多客户端继承对 `Subsystem A` 的这种重量级依赖。再次，在可行的情况下，任何情况下的长期最佳解决方案都是将公共（即冗余）功能降级到物理层级中较低的级别（Figure\
  \ 3-50, section 3.3），如 Figure 3-60 所示。\n\n![](img/fig3-60.jpg)\n\n**Figure 3-60:\
  \ 优先选择降级而非冗余避免依赖**\n\n作为第二个例子，考虑 Figure 3-61 中的场景，我们展示了两个独立的子系统，其中一个 `Subsystem\
  \ B` 显然自然地依赖于另一个 `Subsystem A`。现在假设在较高层的 `Subsystem B` 中实现了一个极小的功能集（尽管更加完美、完整且自然），后来发现这是本质上较低的\
  \ `Subsystem A` 所需要的——例如，为了自自足并以便其他子系统独立重用。\n\n![](img/fig3-61.jpg)\n\n**Figure\
  \ 3-61: 在不宜使用时盲目重用（坏主意）**\n\n与其天真地选择重用 `Subsystem B` 提供的完整功能作为权宜之计，从而将 `Subsystem\
  \ A` 的所有客户端都绑定到对 `Subsystem B` 的物理依赖上，几乎总是从一个本质上更高的子系统实现中提取低层级系统所需的极小功能要好得多，而且并不一定有义务最终从高层子系统重用它。通过这种方式，如\
  \ Figure 3-62 所示，我们允许低层级子系统（`Subsystem A`）拥有额外的独立客户端（例如 `Subsystem C`），但并未阻止未来的客户端（例如\
  \ `Subsystems D, E, and F`）在需要时选择高层系统（`Subsystem B`）提供的增强更健壮的功能，而无需痴迷于重用每一行可能的代码。无论你的经验如何，审慎使用少量冗余作为层次分化技术并不一定是坏设计，而且有时是唯一的替代方案。\n\
  \n![](img/fig3-62.jpg)\n\n**Figure 3-62: 使用少量冗余避免重大依赖**\n\n#### 3.5.7 回调\n\n***客户端提供的函数，允许（通常是低级的）子系统在更全局的上下文中执行特定任务。***\n\
  \n自从我们首次发布这九种层次分化技术以来，回调在单线程和多线程应用程序中的应用已从一种最后的下手段变成了首选的设计策略。回调作为层次分化技术的原始动机是允许由客户端提供的函数在较高级别执行——例如，在客户端的上下文中。最初，这种对回调的使用（误用）是为了表面上反转放置错误的成员函数的依赖方向。然而，从那时起，回调的范围和用途发生了变化，它们现在被广泛理解为包括函数和对象（即“仿函数”；section\
  \ 3.3.8），不仅可以在运行时绑定（例如通过抽象基类），也可以在编译时绑定（例如通过方法模板）。在下文中，我们将探索如 Figure 3-63 汇总的五种用于层次分化目的的不同类型的回调。\n\
  \n\n\n\n# 函数对象和函数指针是 `callables`。所有的可调用对象和成员函数指针都是 `invocable`。\n\n# C++11 引入了一种流行的新语法，被称为\
  \ `lambdas`，用于用内联代码简洁地表达函数对象的行为。\n\n![](img/fig3-63.jpg)\n\n**图 3-63：用于分层化（levelization）目的的不同形式的“回调”**\n\
  \n### 3.5.7.1 数据回调（Data Callbacks）\n\n“回调”中可能最简单的一种是将在较高层维护的某些存储的地址传递给操作该存储的函数。我们经常例行地做这类工作，如[图\
  \ 3-64] 所示，我们提供一个输出对象（特别是涉及内存分配的对象；参见第二卷第 4.10 节）作为函数的第一个参数（例如，返回状态；参见第二卷第 6.11–6.12\
  \ 节），以将供应者与消费者解耦。\n\n我们坦然承认，将这种分层化的子技术称为“数据回调”是不标准的，也许会引起困惑——尤其是考虑到数据在传统意义上并不是 `callable`\
  \ 的。尽管如此，我们还是将其放在这里。正如 Bjarne Stroustrup 本人经常说的那样（例如 [stroustrup14]，第 264 页）：“你已经收到警告了。”\n\
  \n![](img/fig3-64.jpg)\n\n**图 3-64：通过结果对象的地址将供应者与消费者解耦**\n\n类似于上述讨论的方法也可以用于解开 `Manager`\
  \ 和 `Employee` 之间的循环，正如之前使用不透明指针（[节 3.5.4.1]）呈现并解决的那样，但这次不需要从根本上改变客户端直接与 `Employee`\
  \ 对象交互的方式。假设在构造每个 `Employee` 对象期间，不再传递整个 `Manager` 对象的地址（[图 3-54]，[节 3.5.4.1]），而是传递一个指向\
  \ `Manager` 中负责跟踪当前员工数量的（私有）整数数据成员的引用，如[图 3-65] 所示。\n\n注意，用于管理 `Employee` 对象的 `std::vector`\
  \ 的 `size` 属性可能包含相同的信息（冗余地），但由于其当前的（标准）接口，我们无法直接传递 `std::vector` 的该属性的引用。然而，事实证明，返回\
  \ vector 内部存储的尺寸地址可能会导致陷阱，如果 `Manager` 类对象本身位于某个容器（如 `std::vector`）中，而该容器在调整大小时，可能会改变\
  \ vector 的 `size` 数据成员在内存中的位置。为了确保这种方法在所有此类情况下都是安全的，至关的一点是：“影子”尺寸“数据成员”（由 `Manager`\
  \ 类管理，所提供的回指针指向此处）*不是* `Manager` 对象内存布局（footprint）的一部分，而是本身被动态分配的，从而在 `Manager`\
  \ 对象本身移动时保留其地址。\n\n![](img/fig3-65b.jpg)\n\n**图 3-65：管理类/员工功能的无环渲染**\n\n请注意，在这种新的设计中，`my_employee`\
  \ 组件中没有对 `Manager` 类的引用——即使是仅具名称（In-Name-Only）的引用也没有！不再拥有其父类的指针，`Employee` 现在拥有一个指向父类仅有的\
  \ `d_numStaff` 数据成员（基本类型 `int`）的指针（提供不可修改的访问）。有了这个地址，我们现在可以直接实现 `numStaff` 访问器——完全在\
  \ `Employee` 类内部（正如最初所愿的）——但现在不会在 `Employee` 和 `Manager` 之间产生设计循环。\n\n注意，如[图 3-65a]\
  \ 所示，这种数据回调技术的净效果类似于*降级*（demotion）（例如，参见[图 3-52]，[节 3.5.3]），因为一个较低层次的类型（在本例中为基本类型\
  \ `int`）被分离出来并被 `Manager` 和 `Employee` 同时引用。同样注意，这种数据回调之所以可行，是因为它仅涉及值的变化，而不是行为的变化：\n\
  \n使用数据成员存储值；为行为预留虚拟函数。\n\n### 3.5.7.2 函数回调（Function Callbacks）\n\n*函数回调*（Function\
  \ callbacks）是解耦库和框架的经典而强大的技术。例如，C 语言传统的 `qsort` 库要求客户端在（运行时）提供用户提供的比较（“回调”）函数的地址，以便确定“元素”（即大小相同的内存区域）的相对顺序。此回调函数是一个真正的函数，具有所有与在程序栈上创建激活记录以及通过任意指针调用函数相关的开销。\n\
  \n相比之下，`std::sort` 函数取一个（编译时）模板参数，作为一个可调用的（invocable）实体的类型（即函数指针或函数对象），该实体将用于确定两个元素的相对顺序。当\
  \ `sort` 函数实例化时，将所提供的“函数对象”（而非函数指针）的源代码对客户端编译器可见，使得在几乎所有的工具链上，将此频繁调用的回调操作的实现内联（inline）到\
  \ `sort` 算法中变得可行。值得提到的是，`std::sort` 还接受一个比较器参数类型的运行时对象，因此使得有状态的回调成为可能（不建议；参见第二卷第\
  \ 4.5 节）。\n\n尽管如此，传统的*函数*回调仍然非常有用，特别是在设计大型系统时。首先，C 风格的回调可用于延迟绑定。也就是说，作为回调执行的特定函数可以在运行时确定。其次，此类回调函数可以用于满足开闭原则（[节\
  \ 0.5]）。也就是说，具有适当结构（即签名和返回类型）的函数可以用于扩展预存库软件的功能，而无需对其进行任何修改。第三，这些运行时回调在本质上更具扩展性，因为它们的使用并不意味着对大量软件进行（重新）编译，而只需进行（重新）链接。比第一点更重要的是，最后这一点在实践中对于区分*函数*回调与其更局部的*函数对象*对应物更为显著。\n\
  \n#### 3.5.7.2.1 回调伴随 `main()` \n\n\n\n\n\n例如，假设我们从一个健壮的可重用库开始。然后我们创建一个使用该库的应用程序。在最高层级，我们有一个单一文件\
  \ `main.cpp` 将所有内容整合在一起。随着时间的推移，我们发现有时会出问题：可用内存耗尽了、函数调用违反了契约（参见第 5.2 和 5.3 节，以及第二卷第\
  \ 6.8 节），或者——由于某种原因——软件无法继续运行。人们做了一个（糟糕的）决定，从库向应用程序引入了一个“向上的调用”（up call）（例如定义 `main()`（程序入口）的\
  \ `main.cpp` 文件），这需要定义一个特定的（具名的）函数：\n\n```cpp\nvoid saveAndExit();\n```\n\n以处理此类情况。这种非常不幸的情况在图\
  \ 3-66 中所示。\n\n![](img/fig3-66.jpg)\n\n**图 3-66：直接“向上的调用”导致的循环依赖（糟糕的主意）**\n\n从库中引入向上的调用是一种极度误导的权宜之计，基本上应该被直接驳回。相反，应该增强库以接受一个用户指定的回调函数（例如通过\
  \ `set_lib_handler`^(108) 函数），如图 3-67 所示。这种由客户端指定的回调将由 `main` 或至少由 `main` 的所有者建立，以确保无处不在的操作性（参见第\
  \ 3.9 节）。回调的现在变得不再重要；只有结构仍然相关。此外，回调不再需要全局链接，并且可以在定义 `main` 的文件中声明为 `static`。\n\n\
  ^(108) 有人建议使用一个听起来不那么无辜的名字，例如 `set_fatal_exit_handler`，以引起对这种卑劣欺骗的注意。\n\n![](img/fig3-67.jpg)\n\
  \n**图 3-67：在 `main` 中有效（无循环）使用函数回调**\n\n函数回调在历史上也被用于促进并发。正如我们在第 3.3.8.1 节中所所示，运行时函数（参见图\
  \ 3-31）和仿函数（参见图 3-33）由事件管理器的客户端提供（参见图 3-30b），以允许在物理层次结构任何层级的任意上下文中响应特定事件的发生进行处理。虽然这种回调的初始示例假设单控制线程内有一个事件循环，但函数（和仿函数）回调（见下文）在多线程语文中也很有用^(109)。\n\
  \n^(109) 与单线程（分时复用）示例不同，必须确保所有的引用计数都以避免竞态条件的方式进行（参见第二卷第 6.1 节），这在今天通常使用原子指令来增加和减少使用计数，且带有最小（但不可忽略）的运行时开销。\n\
  \n### 3.5.7.2.2 `Event` 循环依赖于 `EventMgr`\n\n图 3-68 描绘了一个（朴素的）事件管理子系统的渲染，该系统由两个独立的类组成：`EventMgr`\
  \ 和 `Event`——每个都定义在各自独立的组件中。在这种固有的循环设计中，通过将地址传递给管理器的 `schedule` 函数，创建事件对象并由对象进行调度。当管理器需要调用下一个事件时，它简单地将该调用转发给事件对象自身的\
  \ `invoke` 函数，导致了循环的物理依赖（糟糕的主意）。\n\n![](img/fig3-68.jpg)\n\n**图 3-68：`Event`/`EventMgr`\
  \ 子系统的循环渲染（糟糕的主意）**\n\n### 3.5.7.2.3 使用函数回调消除框架向上的依赖\n\n函数回调长期以来一直用于消除框架对其要求管理的用户提供实体之间的任何依赖。作为示例，考虑图\
  \ 3-69 中建议的简单事件管理器和任意客户端。事件管理器类 `EventMgr` 位于底层，对任何潜在的客户端一无所知。该组件通过公共 `typedef`\
  \ 发布一个特定的（纯）函数式接口结构，例如 `EventCb`（如所示）。潜在客户端可以通过定义一个满足相应要求的（通常是私有的）C 风格函数来调度一个任意类型的对象（例如\
  \ `AnyDarnThing`）：\n\n![](img/fig3-69.jpg)\n\n**图 3-69：使用函数回调消除框架依赖**\n\n```cpp\n\
  void (*)(void *)\n```\n\n接口结构，例如被隔离在 `anyarnthing.cpp` 文件中的（文件作用域 `static`）`invoke`\
  \ 函数，其位于图 3-69 的右下角。在调度期间，该回调的地址与对象的地址一起提供给事件管理器。遗憾的是，对象的类型在调度期间丢失了；然而，一旦调用 `invoke`\
  \ 函数，它就会恢复（已知的）类型（通过 `static_cast`）。当引用相同数据的事件顺序未知时，确保正确操作的任务变得更加复杂。\n\n尽管函数回调技术已使用了多年，但它显然丑陋、缺乏模块化，并且完全是在破坏\
  \ C++ 类型系统。此外，任何对共享数据的管理必须从头实现。这种基础回调最初是用 C 风格函数实现的。\n\n##### 3.5.7.3 仿函数回调\n\n\
  使用（传统的）函数作为回调虽然是一种满意的方法，但本质上有两个缺点：函数回调 (1) 自身无法封装特定回调的数据，且 (2) 不能^(110) 消除回调的运行时开销，这在许多重要情况下（例如\
  \ `std::sort`）是巨大的。现在让我们重新审视图 3-33、第 3.5.7.2.3 节中的函数回调解决方案，但这次目标是使用仿函数回调。\n\n^(110)\
  \ 在典型的商业平台上（在没有全程序优化的情况下），仿函数对象可以将 `operator()` 实现为内联，从而函数体可见，而函数指针通常不是如此。\n\n######\
  \ 3.5.7.3.1 什么是*仿函数*？\n\n与传统的 C 风格函数不同，仿函数是一个对象，因此它自然可以拥有状态。仿函数类型特殊之处在于它支持 `operator()`\
  \ 的一个或多个重载，因此认为它是*可调用的*（invocable*）。通过使用仿函数（即*可调用的函数对象*）而不是（纯）函数（即需要外部提供数据的函数），我们使得能够在回调内部“封装”（即封装）回调最终需要操作的本质用户提供数据。\n\
  \n###### 3.5.7.3.2 使用仿函数回调从 `EventMgr` 中解耦任意事件\n\n\n\n\n\n图 3-70 展示了一个经过修订且可以说是改进的基于函数的解决方案，用于解决图\
  \ 3-68 中描述的循环困境，节 3.5.7.2.2。首先注意到，事件处理程序接受一个函数对象，该对象通过 `std::function` 模板实现，该模板由一个（在本例中）*成员*函数参数化，该函数既不接受任何参数也不返回任何值（*void*）。在调度期间，客户端创建该函数对象，并将私有的\
  \ `invoke` 方法以及对象本身传递进去^(111)。当启动下一个事件的时间时，领先的回调对象连同其封装的用户数据，只需通过使用 `()`（即“函数调用”）语法即可被调用。通过这种方式，我们可以避免大多数与传统函数回调相关的、不复杂性和类型安全问题。\n\
  \n^(111) 在 C++03 中，我们使用 `bind`，如图 3-70 所示：\n\n点击此处查看代码图像\n\n```\nvoid anyDarnThing::schedule(EventMgr\
  \ *eMgr)\n{\n    eMgr->schedule(std::bind(&AnyDarnThing::invoke, this));\n}\n```\n\
  \n在 C++11 及更高版本中，我们可以改用 lambda 表达式：\n\n点击此处查看代码图像\n\n```\nvoid anyDarnThing::schedule(EventMgr\
  \ *eMgr)\n{\n    eMgr->schedule( [this] { invoke(); } );\n}\n```\n\n![](img/fig3-70.jpg)\n\
  \n**图 3-70：优先使用函数对象回调以消除框架依赖**\n\n尽管函数对象极大地有助于了有效实现，但它们本身并没有解决所有的复杂性。当函数对象的相对生命周期不一定是确定的，且它们封装的数据包含了对同一非可拷贝资源的引用时，采用某种形式的引用计数通常是合适的。图\
  \ 3-71 展示了类似于图 3-34(([112)、节 3.3.8.1 的引用计数函数对象，如何有效地用于将封装的工作单元放入队列，以便由支持线程的对象进行处理（见卷\
  \ II，第 6.1 节）。与其对整个函数对象进行引用计数，另一种方法是只对实际共享的封装数据部分进行引用计数。注意，每当封装数据可以复制，从而完全避免与引用计数相关的耦合时，那种方法几乎总是首选的。\n\
  \n^(112) 自 C++11 起，这自然会通过指向 `std::function` 的 `std::shared_ptr` 来实现。\n\n![](img/fig3-71.jpg)\n\
  \n**图 3-71：在多线程应用中使用引用计数函数对象**\n\n### 3.5.7.3.3 无状态函数对象的使用\n\n与封装了客户端提供的数据（以便在调用回调时使用）的有状态函数对象不同，无状态函数对象回调被广泛用于自定义类模板的*逻辑*行为。这种固有的侵入性自定义技术通常被称为*基于策略的设计*（policy-based\
  \ design）。^(113)。标准模板容器（如 `std::map`）依赖于此类（无状态）函数对象来提供模板*接口策略*（见卷 II，第 4.5 节），以自定义实例化容器中元素的顺序。然而，通过这样做，这种*逻辑*策略也影响了结果容器类的\
  \ C++ 类型。当本质行为本身也受到影响时，拥有影响类型的模板参数这本身并不是一个问题。而控制实现细节（如内存分配、哈希算法、负载因子）的模板参数与预期的*逻辑*行为无关，这完全是另一回事。^(114),115)\n\
  \n^(113) **alexandrescu01**, 第 1 章，第 3–21 页\n\n^(114) 见卷 II，第 4.5 节，详细讨论此类模板*实现策略*对*词汇类型*（vocabulary\
  \ types，即在接口中广泛使用的类型）的影响（见卷 II，第 4.4 节）。\n\n^(115) 注意，无状态函数对象回调被正确地用于配置函数模板——包括通过*实现策略*——因为函数本质上是结构性的（即以签名特征特征），因此不会遭受相同的互操作性问题。最后，注意这种回调与函数回调类似，尽管耦合得更紧，可以同样访问更高层。\n\
  \n### 3.5.7.4 协议回调\n\n另一种形式的*回调*层是使用抽象接口，即*协议*（节 1.7))。假设我们有这样的情况：“客户端”类型 `C` 依赖于“服务器”类型\
  \ `S`，但由于某种原因 `S` 的实现需要依赖 `C`，如[图 3-72]所示。通过将具体的 `S` 转换为抽象接口和派生类 `S`，我们可以将循环依赖（节\
  \ 2.6））转换为无循环的。\n\n![](img/fig3-72.jpg)\n\n**图 3-72：通过抽象接口提升实现**\n\n在使用这种技术时，我们可以独立创建并测试抽象接口\
  \ `S`（见卷 III，第 10 章）。接下来，我们可以使用 `S` 的实现（见卷 II，第 4.9 节）来测试 `C`。最后，我们可以使用 `S` 和 `C`\
  \ 测试 `S`。通过这种方式，我们可以避免循环依赖。\n\n作为一个更具体的例子，让我们考虑黑直游戏（Blackjack），即 *21*，如图 3-73 所示^(116)。玩家在赌场中合理地玩黑直之前，需要知道一副牌^(117),118)。玩家还需要学习规则，这些规则非常复杂且在不同赌场之间差异很大(119)。最后，玩家需要能够向荷牌员发出每个可行的动作——例如\
  \ `STICK`、`HIT`、`SPLIT`、`DOUBLE_DOWN`、`INSURE`^(120)——可能用 `enum` 表示。\n\n^(116) 建模黑直是作者自\
  \ 20 世纪 70 年代以来随着计算机的发展而重复做的事情，并在实践中随后（盈利地）应用——远在 Jeffrey Ma 实施他那华丽的赌场骗局之前，那场骗局通过书籍\
  \ *Bringing Down the House* (**mezrich02**) 首次流行，并被热门电影 *21*（2008）上映。\n\n^(117)\
  \ 每一副牌包含 52 张不同的牌，分为四种花（不相关）和 13 种等级：`A`、`2`、`3`、`4`、`5`、`6`、`7`、`8`、`9`、`T`、`J`、`Q`\
  \ 和 `K`。等级 `T`、`J`、`Q` 和 `K` 形成一个等价类，每个成员的值为 10。`A` 的值具有上下文：1 或 11。对于所有其他等级（`2`\
  \ 到 `9`），等级代表数值。\n\n\n\n\n\n如果你不数牌（这是一个**坏主意**），你可以忽略玩家对牌组本身的依赖，转而仅依赖你自己手牌的当前值，当然，还有庄家的牌值。\n\
  \n幸运的是，庄家总是会帮助玩家了解赌场规则的具体细节，并且通常（只要问一下）还会针对最优的*静态*（即无状态）策略为玩家提供准确建议。\n\n注意，`INSURE`（保险，赔率为\
  \ 2:1）和 `DOUBLE_DOWN`（倍倍）都可以针对原始下注金额的一半或全部的任意金额。\n\n![](img/fig3-73.jpg)\n\n**图\
  \ 3-73：黑杰游戏的朴素（循环）建模（一个**坏主意**）**\n\n同样地，庄家（代表赌场）也需要了解规则（当然了）、操作牌组，并听取玩家想要执行的特定动作。庄家可能还需要与玩家发起通信。请注意，在\
  \ `Dealer` 和 `Player` 之间的通信接口中使用的类型类型（见第二卷第 4.1 节）——所谓的*词汇类型*（见第二卷第 4.4 节）——已经被提取到独立的组件中。遗憾的是，如图\
  \ 3-74 所示，`Player` 和 `Dealer` 接口之间仍然存在直接的循环交互。\n\n通常使用多副牌（通常是六副或八副），它们被放在所谓的*牌靴*（shoe）中。\n\
  \n例如，提醒该玩家轮到他了，请求离开桌面饮料，或告诫玩家停止评论他人的操作。\n\n![](img/fig3-74.jpg)\n\n**图 3-74：`Dealer`\
  \ 和 `Player` 的循环依赖头（一个**坏主意**）**\n\n解决这个问题有许多种方法，包括对相应组件进行完全重构，使其中一个（例如 `my_dealer`）处于比另一个更高的层次，但——为了说明起——我们将选择提取一个协议并将\
  \ `Player` 分为两个部分：一个抽象接口和一个派生实现类。这种新设计如图 3-75 所示。\n\n![](img/fig3-75.jpg)\n\n**图\
  \ 3-75：将 `Player` 分为接口和实现**\n\n在新设计中，`my_dealer` 组件基本上保持不变，但 `Player` 类现在变成了一个纯抽象接口，如图\
  \ 3-76 所示。尽管 `my_dealer` 组件对各种子组件的依赖关系没有变化，但 `my_player` 的依赖现在只是对 `Dealer` 的单一（向上的）仅命名使用依赖（Uses-In-Name-Only\
  \ dependency）。`Dealer` 和实现 `Player` 的类（在此显示为 `RealPlayer`）继续对 `Action`、`Deck` 和\
  \ `Rules` 进行实质性的使用。通过这种方式，可以分层测试 `Player`（基类）、`Dealer`（框架），然后是 `RealPlayer`（派生类）。\n\
  \n![](img/fig3-76.jpg)\n\n**图 3-76：`Player` —— 现在是一个提取出的协议**\n\n这种这种新设计的额外优点是具有可扩展性。我们可以轻松地适应完全不同类型的玩家，而无需修改\
  \ `Dealer` 框架。例如，我们可能会考虑创建一个派自 `Player` 的类 `NetworkPlayer`，它实际上是通过网络通信的人的代理。虽然最初可能很有吸引力，但在这里拥有这样一个网络导向的派生类被认为是一个糟糕的候选者，因为网络连接可能会（首次）引入失败的可能性，这可能会显著改变抽象接口所需的签名，而这可能正是我们还没有准备好考虑的（见第二卷第\
  \ 5 章）。另一方面，在一个有多个玩家的游戏中（某些玩家由计算机模拟），我们可能会合理选择使用继承来建模实质不同的（“化身”）游戏策略，例如 `ConservativePlayer`（保守型玩家）对比\
  \ `AggressivePlayer`（进攻型玩家）。\n\n如图 3-77 所示，现在创建一个 `TestPlayer` 也是很自然的，它可以被用于（例如在单元测试期间）帮助验证\
  \ `Dealer` 类的正确性，以及任何其他可能想要使用 `Player` 协议的类。虽然这种解决方案有优点，但它的缺点是虚拟函数的运行效率通常不如非虚函数（尤其是\
  \ `inline` 内联函数）。对于天生横向的设计，良好的做法是始终为每个协议提供一个深思熟虑的“测试”实现。注意，对近期（约 2016 年）主流工具链（如\
  \ GCC）中增强的测量表明，当客户端和接口源码均可见时，虚拟函数调用可以被“去虚化”（因此内联）。\n\n![](img/fig3-77.jpg)\n\n**图\
  \ 3-77：“Player”拆分为接口和实现类**\n\n请注意，仅为了测试目的而引入抽象接口——例如，通过使用自定义的“测试”实现来模拟（mock）低级组件——通常是应该避免的，以免模糊了客户端对意图用途的感知（见第二卷）。对于固有的分层设计而非天生横向的设计（见\
  \ 3.7），通常有更好的、破坏性更小且更有效的方法来获得理想结果，而无需“干扰”设计（见第三卷）。\n\n#### 3.5.7.4 在（极高）层注入（可能是大量的）功能\n\
  \n\n\n\n\n重要的是理解，应用这种基于协议（protocol-based）的新技术将需要应用程序内部子系统使用方式的转变。要么最高层实体（即 `main`\
  \ 函数）需要将此高层实现对象的地址（以其基类型的形式）安装到低级的 `static` 工具类中（即在程序执行开始时，之后推测它将永远不会更改），否则每个可能需要（直接或间接）使用此高层实现的类型，都必须在自己的接口中传播该低级协议。\n\
  \n前者的“单例”方法在实现目标是整个程序范围且从不改变时是合理的，例如契约断言处理器（见第 II 卷，第 6.8 节）或日志设施（见第 3.5.7.4.2 节)\n\
  \n^(125) 编写本书时，目前正在进行研究，以确定如果将本地提供的内存分配器传播作为语言特性引入 C++，将如何促进这一过程（并降低维护成本）; 请参阅 **meredith19**。\n\
  \n### 3.5.7.4.2 修复日志-传输-邮件子系统\n\n作为我们协议回调的最后一个具体示例，再次考虑在第 3.4 节中引入的物理上相互依赖的日志-传输-邮件配置。回想一下，这两个相互依赖（图\
  \ 3-40，第 3.4 节）并非预先计划的，而是随着时间的演变的。最初，`transport` 子系统无循环地依赖于 `logger`。然后，由于需要对 `logger`\
  \ 子系统进行运行时控制，出于权宜考虑，`logger` 被允许在物理上反向依赖于 `transport`。同样，`mail` 最初设计为对 `transport`\
  \ 和 `logger` 具有无循环依赖，但——由于管理层的行政命令——`logger` 随后被要求在物理上反向依赖于 `mail`。这种物理设计的退化在实践中屡有发生，但其中任何一点都不是理想的或必要的。\n\
  \n与其允许 `logger` 子系统直接依赖 `transport`，我们可以通过一个派生的具体实现类（例如 `ControlChannel`）来适配我们的\
  \ `transport` 子系统，以实现所有相关传输器共抽象（协议）类（例如 `Channel`），如图 3-79\n\n**图 3-79：使用抽象接口使我们的基础设施分层化**\n\
  \n同样，与其允许 `logger` 物理上依赖于 `mail` 子系统，我们不如为所有想要接收日志事件的客户端定义一个抽象接口 `Observer`。然后我们可以派生一个具体的\
  \ `MailObserver` 类，将 `mail` 子系统的功能适配到 `Observer` 协议。`main` 程序在启动时安装一个 `MailObserver`\
  \ 类型的对象。每当发生日志事件时，日志器就会为每个注册的 `Observer` 对象调用虚拟的 `publish` 方法，从而通知安装的 `MailObserver`\
  \ 适配器，由适配器转调用所需的 `mail` 子系统功能（如图 3-79）。例如，为日志设施本身创建一个纯抽象接口是不可行的，而且它是 C++ 预处理器剩余的少数有效用例之一。(126)\
  \ 首先，我们需要在日志语句的调用处提取行号（`__LINE__`）和文件名（`__FILE__`）。(127) 其次，我们需要以尽可能廉价的方法确定运行时日志级别是否足以支持为*每个*单独的日志消息调用发布机制——例如，一个带有负提示的\
  \ `if`，但绝对不是任何形式的（非内联）函数调用。最后，最重要的一点是，我们需要确保任何可能被记录的表达式都不会被求值*除非*最终传输它们的日志语句在当前运行时日志级别上被启用。由于所有这些原因，将一个具体的日志设施简化为仅没有任何加饰的纯抽象接口是不切实际的。\n\
  \n^(126) 宏在 C++03、11、14、17 甚至 20 中的其他有效用例包括 `<assert>` 和我们的 `bsls`（见第 II 卷，第 6.8\
  \ 节）。注意，一项本质上契约检查（CCF）的提案在 2018 年 6 月正式纳入 C++ 工作草，但一年后被撤回。另见 (**bde14**](#ref.xhtml_ref6)，`/groups/bsls/`\n\
  \n^(127) 截至 C++20，`std::source_location` 为 `__FILE__` 和 `__LINE__` 的使用提供了语言级的替代方案。\n\
  \n### 3.5.7.5 概念回调\n\n自我之前的书出版以来，出现的最重要的*回调*分层化技术（见[128]）或许是使用方法模板静态地绑定到一个具有语法一致接口且（理想情况下）具有契约适用实现的具体类。在类背景下可行的类型要求的集合被称为*概念*（第\
  \ 1.7.6 节）。(129)\n\n^(128) 参见 **lakos96**，第 5.7 节，页 275–288。\n\n^(129) 语言级别的概念支持作为\
  \ C++20 的一部分引入。该功能（至少最初）将帮助程序员仅检测结构上的（语法上的）不一致，而不是语义上的。注意这种能力类似于在编译时强制派生类虚函数的签名与其基类对应的签名匹配，同时依靠开发者确保语义也相对应（见第\
  \ II 卷，第 4.6 节）。\n\n作为一个具体示例，让我们考虑将*值类型*对象（如 `Date`、`Time` 或 `Duration`，见第 II 卷，第\
  \ 4.1 节）的*值*序列化为字节流，然后通过某些通信通道（例如套接字、共享内存）将其*外部化*（即传输出进程）到另一个进程或也许是数据库中。我们应该如何设计这种东西使其具有良好的扩展性，并且仍然提供最大的通用效用？\n\
  \n#### 3.5.7.5.1 方案 A：在单一具体的 `ByteStream` 类上标准化\n\n\n\n\n\n起初，人们可能会考虑选择在一个单一具体的流类\
  \ `ByteStream` 上进行标准化，如图 3-80a 所示。该 `ByteStream` 类的对象会为每种基本值类型（如整数、浮点数和字符字符串）以及这些基本对象的每种数组，在各种不同的物理尺寸上累积值。图\
  \ 3-80b 展示了 `ByteStream` 接口的一个代码片段，它可以用于序列化（即*写入*）对象数据；然而，为了简单起见，我们完全省略了反序列化（即*读取*）方面的内容。我们假定了一个（玩具级）`Date`\
  \ 类，它分别存储了它的三个*显著的*^(130) 属性：`year`、`month` 和 `day`（参见卷 II 第 4.1 节）。实现该 `Date` 类的省略部分在图\
  \ 3-80c 中所示，展示了这三个日期字段中的每一个是如何发送到 `ByteStream` 对象的，该地址作为参数传递给 `Date` 类的 `streamOut`\
  \ 方法。\n\n^(130) 值语义类型的显著属性是其（通常可观测的）属性之一，这些属性有助于构成对象本身的整体值。例如，年、月、日是任何通用实用日期类的所有显著属性。对于\
  \ `std::vector<int>` 来说，尺寸（整数元素的数量）和每个单独元素（在该尺寸的序列中）都应被认为是显著的。非显著属性的示例包括向量的容量（参见卷\
  \ II 第 4.1 节）以及用于分配内存的机制地址（参见卷 II 第 4.2 节，参见卷 II 第 4.10 节）。\n\n![](img/fig3-80a.jpg)\
  \ ![](img/fig3-80b.jpg) ![](img/fig3-80c.jpg)\n\n**图 3-80：在单一具体的 `ByteStream` 类上进行标准化（坏主意）**\n\
  \n这种方法的根本问题在于，我们想要如何流化一个对象取决于其流化时的上下文。例如，流处理器对象可能由于某种原因，在流化时本身需要进行某种加密。然而更常见的情况是，我们知道我们将希望提供一个\
  \ `TestByteStream`（在开发期间），在流中插入额外的哨兵和其他数据，以确保例如，写入 `ByteStream` 的两个整数的数组不会（以某种方式）被重新水化为两个独立的整数，或者更糟，变成一个\
  \ `double`！\n\n然而，还存在另一个更微妙的问题。`ByteStream` 和 `CharBuf` 存在于不同的组件中。`ByteStream` 在其实现中使用\
  \ `CharBuf` 来存储序列化数据（图 3-80b）。另一方面，`CharBuf` 本身是一个支持原生流化（即原语级）的值语义类型；因此，`CharBuf`\
  \ 在其接口中使用 `ByteStream`（图 3-80c）。结果是，`my_bytestream` 和 `my_charbuf` 之间存在循环物理依赖，如图\
  \ 3-81a 所示。\n\n![](img/fig3-81.jpg)\n\n**图 3-81：在单一具体的 `ByteStream` 类上进行标准化（坏主意）**\n\
  \n### 3.5.7.5.2 计划 B：基于*冗余*的暴力解决法\n\n解决循环依赖问题的一种暴力解决办法是使用*冗余*层级化技术，为 `ByteStream`\
  \ 内部使用创建一个较低层级的最小 `CharBuf`，该类显式地*不*提供流化支持。在这种情况下，定义 `ByteStream` 的组件成为两个原始组件中的低级，依赖问题随之解决。另一种暴力（但不推荐的）解决方案是利用一种（显然是丑陋的）形式的“冗余”，其方法是在本地——在\
  \ `CharBuf` 的测试驱动程序中——创建一个 `ByteStream` 自身的最小化模拟版本，用于 `CharBuf` 的初始验证。这第二个解决方案需要涉及构建系统，以排除一个原本是有效的依赖，并且这与我们方法中所提倡的构建独立性（节\
  \ 2.15）以及无限制互操作性（参见节 3.9）的精神相悖。此外，这两个解决方案都没有为配置流化行为提供任何活性。简之，计划 B 未能充分解决我们的所有需求。\n\
  \n### 3.5.7.5.3 计划 C：在抽象 `ByteStream` 接口类上标准化\n\n接下来，我们可能会考虑采用之前讨论的*协议*-回调层级化技术（节\
  \ 3.5.7.4），将初始具体的流类分为两部分：一个纯抽象接口（即抽象的*协议*）类 `ByteStream`，以及（至少）一个实现类，如图 3-82 所示的\
  \ `ConcreteStream`。逻辑上，这种设计是可行的，但考虑到目前的工具链状态——调用虚拟函数的运行时开销可能是无法接受的。(131) 值得注意的是，在某些情况下（参见卷\
  \ II 第 4.10 节）——当实现类（`ConcreteStream`）和使用它的类（例如 `CharBuf`）通过其基类（例如 `ByteStream`）对客户端编译器（例如\
  \ GCC）可见时——编译器可以“去虚拟化”调用，获得与之类似的性能。\n\n![](img/fig3-82.jpg)\n\n**图 3-82：在协议 `ByteStream`\
  \ 类上标准化（坏主意）**\n\n### 3.5.7.5.4 计划 D：在字节流*概念*上标准化\n\n然而，还有第四种方案，它在这种情况下被证明是两全的。考虑到我们希望像\
  \ `CharBuf` 这样的值类型具有（编译时的）可交换字节流实现，但无法负担虚拟函数提供的*隔离*的潜在运行时开销（参见节 3.11.5），我们可以将值类型（例如\
  \ `CharBuf`）中每个使用 `ByteStream` 基类类型（例如 `streamOut`）对象的成员函数替换为等效的*方法模板*。该值类型的模板成员接受作为类型参数的满足\
  \ *ByteStream* 概念的具体类，如图 3-83 所示。(132)\n\n^(132) 通过这种方式，我们实际上实现了运行时多态的*所有*实际*逻辑*益处。(133)\n\
  \n注意，除了紧密的（物理）编译时耦合外，我们也放弃了在运行时选择特定字节流实现的（逻辑）能力。然而事实证明，这种运行时多态属性在实践中通常没用。而且，由于只有流方法而不是值类型本身是模板的一部分，更改流类型不会影响使用流对象的整体\
  \ C++ 类型，从而允许我们在非模板语文中作为函数参数传递这些值类型（参见卷 II 第 4.4 节）。\n\n^(133) 有关 ISO（结构内仅有）符号的进一步描述，请参见图\
  \ 1-50、节 1.7.6。\n\n\n\n\n\n(134) 如果此组件由于某种原因在物理上存在，那么组件本身的边界（但不包括代表 `ByteStream`\
  \ 概念的胶囊）将表示为实线（而不是虚线）。这种物理表现形式可能被用于持有 (a) 描述该概念的文档和/或 (b) 客户端可用的以强制执行该概念的代码。在何种情况下，如果建模\
  \ `ByteStream` 的类作者（即 `ConcreteByteStream`）意图是 `#include` （现在是物理存在的）刻画 `ByteStream`\
  \ 的组件（例如，为了显式地说明协作的范围），那么从实线胶囊（针对 `ConcreteByteStream`）到虚线胶囊（针对 `ByteStream`）的箭头也将同样变为实线。同样，如果意图是让客户端类的作者（即\
  \ `CharBuf`）包含 `ByteStream` 组件的头文件——特别是如果存在编译时类型谓词（以元函数实现）可供客户端使用以在自己的类型参数上强制执行\
  \ `ByteStream` 概念——那么它也将用实线而非虚线来渲染。但即便组件中完全没有其他内容，只有文档——即使只是所需接口的示例——将模型和客户端在物理上绑定到这一共同约定也是有价值的（参见卷\
  \ II，第 5.2 节）。\n\n最后，上述从基类到概念的转换，对通用的软件工程特别是对健全的物理设计具有深远的影响。依赖于*概念*而不是抽象基类，会立即放弃任何必要的*物理*位置，在这些位置上，(1)\
  \ 可以记录概念的*约定*（参见卷 II，第 5.2 节）（更不用说强制执行），并且 (2) 客户端和实现者必须在物理上相互依赖，如图 3-84 所示。\n\n\
  ![](img/fig3-84.jpg)\n\n**图 3-84：没有描述概念的唯一物理节点（糟糕的设意）**\n\n### 3.5.8 管理类 (Manager\
  \ Class)\n\n*建立一个拥有并协调低级对象的类。*\n\n这种让高级*管理类*负责创建、销毁和协调其控制下的低级从类实例的层级化技术，本质上只是一种实用的设计策略。经典的例子是单链表。如图\
  \ 3-85 所示，仅仅一个 C++ 类是否足够实现列表？特别是，让 `Link` 对象的析构函数去销毁另一个相同类型的对象是合理的吗？我们断定答案是定的“不！”相反，我们认为，确保分层所有权由类型系统管理，而不是仅仅由给定类型（或类型）对象实例的运行时配置，是我们我们应该积极寻求实现的重要设计特征。(135)\n\
  \n一些“聪明”开发者甚至选择让 `Link` 对象的析构函数递归地销毁下一个 `Link`：\n\n```\nLink::~Link() { delete d_next_p;\
  \ }\n```\n\n这种“优雅”的技术除了速度慢得离谱外，早晚不可避免地会导致栈溢出。\n\n![](img/fig3-84.jpg)\n\n**图 3-85：使用单类实现链表（糟糕的设意）**\n\
  \n在 C++ 对概念的支持广泛可用之前，我们可能考虑设立一个指定的组件（不需要源代码）来完整记录该*概念*，并期望每个实现者（例如 `ConcreteByteStream`、`TestByteStream`）和客户端（例如\
  \ `CharBuf`、`Date`、`Time`）在物理上依赖（`#include`）它——就像在实现一种*协议*一样（第 1.7.5 节）。这样做将极大消除大型代码库中这种本质微妙架构的神秘感。\n\
  \n### 3.5.8 管理类\n\n*建立一个拥有并协调低级对象的类。*\n\n这种让高级*管理类*负责创建、销毁和协调其控制下的低级从类实例的层级化技术，本质上只是一种实用的设计策略。经典的例子是单链表。如图\
