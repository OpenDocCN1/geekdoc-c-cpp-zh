  \ 索引\n\n## 前言\n\n当我写我的第一本书《大规模 C++ 软件设计》(lakos96) 时，我的出版商希望我考虑将其改为《大规模 C++ 开发》。我对自己有能力讨论设计非常有把握，但*开发*这个主题所涵盖的范围远超我当时准备处理的范围。\n\
  \n*设计*，在我看来，是软件的一种静态属性，通常与单个应用程序或库相关，并且是创建成功软件所需的许多学科之一。*开发*，另一方面，是动态的，涉及人员、流程和工作流。由于开发是持续的，它通常跨越归属于许多应用程序和项目的努力。简而言之，软件开发是我们*所做*的事情。\n\
  \n\n\n\n在《Large-Scale C++ Software Design》出版后的二十多年里，我作为顾问、培训师以及在全职工作中，始终在应用该书中介绍（并在此处阐述）的相同基础设计技术。我学会了如何组建、指导和管理大型开发团队，如何与客户和同事进行有效互动，以及如何在企业规模上帮助塑造软件工程文化。只有在积累了这些经验后，我才觉得能够胜任这一更为广阔（也更具野心）的大规模软件`development`主题。\n\
  \n一个关键原则——也是构建这套多部头书籍的基础——是组织在软件中的深远重要性。现实世界的软件本质上是复杂的；然而，许多软件却变得没必要的复杂，这在很大程度上是因为缺乏基本的组织——无论是在开发方式上还是在最终呈现的形式上。本书首要讨论的是什么构成组织良好的软件，以及实现和维护这些软件所需的流程、方法、技术和工具。\n\
  \n其次，我逐渐意识到，并非所有软件都或应该以相同的精细程度进行创建。现实世界应用软件的价值通常取决于代码上线的速度。被分配到应用开发项目的软件工程师，其目标和时间跨度自然与那些负责开发可靠且可用的软件基础设施的长期任务有所不同。幸运的是，本书中讨论的所有技术都适用于应用软件和库软件——区别在于应用各种设计、文档编写和测试技术的程度和严谨性。\n\
  \n有一点没有改变且被反复证明，即所有现实软件都受益于`physical design`（物理设计）。也就是说，我们在文件和库中对逻辑内容分解和分区的方式，将决定我们识别、开发、测试、维护和重用所创建软件的能力。事实上，通过在每个聚合层次上进行深思熟虑的物理设计而产生的架构，每天都在业界证明其有效性。因此，确保良好的物理设计仍然是我们方法论的第一支柱，也是贯穿这三部书的核心组织原则——这本书既捕捉又扩展了我在该主题上的原始工作。\n\
  \n我们方法论的第二块支柱源于`Large-Scale C++ Software Design`，涉及超越简单语法渲染（例如`value semantics`）的`logical\
  \ design`（逻辑设计）的关键方面。自`C++98`以来，模板、泛型编程和标准模板库（`STL`）的使用出现了爆炸式增长。尽管模板无疑非常有价值，但过度使用会阻碍软件的互操作性，尤其当泛型编程并非正确答案时。同时，我们对企业级开发的关注以及对最大化`hierarchical`重用（例如内存分配器）的愿望，迫使我们重新审视更成熟语言结构（如（公共）继承）的正确使用。\n\
  \n可维护的软件需要设计良好的接口（针对编译器）、简洁而全面的契约（针对人员）以及可用的最有效的实现技术（针对效率）。解决这些问题，以及其他重要的`logical\
  \ design`问题，并对实现、文档编写和渲染提供建议，完善了这部综合性著作的第二部分。\n\n验证（包括测试和静态分析）是软件开发中一个至关重要的方面，而这在`Large-Scale\
  \ C++ Software Design`中几乎缺失，仅限于`testability`（可测试性）。自从本书首次出版以来，可教的测试策略（如测试驱动开发`TDD`）已帮助测试在今天变得比\
  \ 20 世纪 90 年代甚至 21 世纪初更加时尚。此外，随着新千禧的开始，越来越多的公司意识到彻底的单元测试是有成本效益的（或者至少比不测试便宜）。然而，测试的含义仍然是一门黑术，而且“单元测试”往往只是某人预设标准操作程序（SOP）中的一个勾选框。\n\
  \n作为我们对组件化软件开发完整处理的第三支柱，我们探讨了创建有效单元测试的学科，这些测试自然地兼作回归测试。我们首先勾勒测试含义的底层概念，然后是如何（1）系统地选择测试输入，（2）设计、实现并易读地渲染完整的测试用例，以及（3）优化地组织组件级测试驱动程序。特别是，我们讨论了如何刻意排列测试用例，以便原始功能一旦通过测试，就可以用来测试同一组件内的其他功能。\n\
  \n在选择一种编程语言以最佳表达对应这三个支柱的想法时，我们投入了大量思考。`C++`本质上是一种编译型语言，允许预处理和单独编译单元，这对于充分解决与我们称为`physical\
  \ design`的软件工程重要概念至关重要。自 20 世纪 80 年代引入以来，`C++`已演变为一种支持多种编程范式（如函数式、过程化、面向对象、泛型）的语言，这引发了对广泛重要`logical\
  \ design`问题的讨论（例如涉及模板、指针、内存管理以及最高效率的空间和/或运行时性能），而这些并不是其他语言所能支持的。\n\n自`Large-Scale\
  \ C++ Software Design`出版以来，`C++`经过多次标准化和扩展，并出现了其他几种新流行的语言。然而，出于实践和教学考虑，现代`C++`的子集——`C++98`仍然是介绍此处描述软件工程原则的首选。任何认识更现代`C++`方言的人都认识`C++98`，但反之未必然。书中建议所依据的所有理论和实践都独立于给定编译器所遵循的`C++`语言特定子集。仅仅因为我们“应该”这样做就将从本书创之初起使用的代码片段表面上地适配为最新的`C++`语法，会偏离本书的真正目的，并阻碍不熟悉现代`C++`的人阅读。在我们认为后版本的`C++`可以获得明显优势（例如通过极极地表达某个观点）的情况下，我们会指出它们（通常作为脚注）。\n\
  \n这种几十年来成功实践的方法论，已被许多重要的参考文献独立地证实。遗憾的是，其中一些（例如`stroustrup00`）已被后来的版本取代，而这些版本由于涵盖了新语言特性且受空间限制，不再提供这种（急需的）设计指导。我们仍然会理直气壮地引用它们，并经常在此处重现相关部分以方便读者。\n\
  \n\n\n从整体而言，这套三卷著作是为软件开发人员编写的工程参考，分为三个独立的、物理上分开的卷，从开发者的视角详细阐述了这一经过证明的方法的所有关键技术方面。该方法旨在创建一个组织良好、集成且可扩展的软件开发环境，能够支持整个企业，且其有效性会随着时间的推移而提高。\n\
  \n然而，本书并未涉及通常与全生命周期开发相关的某些软技能（例如需求收集），但触及了与我们开发方法特定的项目管理方面。\n\n## 读者群\n\n这套多卷书是专为执业的\
  \ C++ 软件专业人士编写的。每一卷中呈现的材料顺序大致对应于开发者在正常的“设计-实现-测试”循环遇到各种主题的顺序。这些材料不仅适用于最大的软件开发组织，也适用于规模较小的开发工作。\n\
  \n应用开发人员将发现此书中的组织技术非常有用，特别是在大型项目中。我们认为，这里介绍的严谨方法即使在一个大型真实世界的应用生命周期内也能收回其成本。\n\n\
  库开发者将发现书中的策略对于以最大化重用的方式组织软件具有无价之宝。特别是将软件封装为细粒度物理组件的无环层次结构，能够实现一种质量、可靠性和维护性，据我们所知，其他方法无法实现这一点。\n\
  \n工程经理将发现，控制这套技术的应用程度将为他们提供做出调度/产品/成本权衡所需的控制。从长远来看，持续使用这些实践将导致一个层次化可重用的软件库，反过来，将使与领域无关的软件过程和架构（即：无论软件旨在做什么，都应该如何进行创建、渲染和组织），并以我们认为的物理设计策略的尖端水平结束。\n\
  \n**第二卷**（待出版）继续这本多卷书，涵盖大规模逻辑设计、有效的组件级接口和契约，以及高度优化的高性能实现。\n\n**第三卷**（待出版）完成本书，包括验证（特别是单元测试），这将使质量最大化，并实现对不断增长的软件资本库进行具有成本效益的、细粒度的层次化重用。\n\
  \n整套多卷书旨在（最初）从头到尾阅读，并在之后作为永久参考。书中呈现的许多材料对许多读者来说是新颖的。因此，我们刻意将许多较困难、详细或在某种意义上“可选”的材料放在给定章节（或节）的末尾，以便读者快速浏览（或跳过），从而使首次阅读更加轻松。\n\
  \n我们还尽力对三卷书中的材料进行交叉引用，并提供有效的索引以方便对特定信息的参考访问。材料自然分为三个部分：(I) 过程与架构，(II) 设计与实现，以及 (III)\
  \ 验证与测试，这三部分（并非巧合）对应于三卷。\n\n## 第一卷：过程与架构\n\n**第 0 章，“动机”**为实施我们的可扩展开发过程提供了最初的工程和经济激励，该过程有助于层次化重用，从而同时实现了更短的上市时间、更高的质量和更低的总体成本。本章还讨论了基础设施与应用开发之间本质的二分法，并展示了企业如何利用这些差异来提高生产力。\n\
  \n**第 1 章，“编译器、链接器与组件”**将组件引入为逻辑和物理设计的基本原子单元。本章还提供了涉及编译器和链接器的基础底层背景材料，以便吸收正文中的细微差别，并构建组件和物理依赖的定义及其基本属性。尽管名义上是背景材料，但建议读者仔细复习，因为这些内容在书中被视为已知，并且它们呈现了重要的词汇，其中一些可能尚未在主流中使用。\n\
  \n**第 2 章，“封装与设计规则”**展示了我们如何以统一（领域无关）的方式组织和封装基于组件的软件。本章还提供了基本设计规则，这些规则规范了我们如何在组件、包和包组的维度上层次化地开发模块化软件。\n\
  \n**第 3 章，“物理设计与析构”**引入了创建健全软件系统所需的重要物理设计概念。本章讨论了从更小、更细粒度的子系统角度设计大型系统的经过证明的策略。我们将看到如何划分和聚合逻辑内容，以避免循环、过度或其他不理想（或不必要）的物理依赖。特别是，我们将观察如何通过采用更具侧向性的架构来避免传统分层架构的沉重，理解如何减少架构层面的编译时耦合，并通过示例学习如何使用组件进行有效设计。\n\
  \n## 第二卷：设计与实现（待出版）\n\n**第 4 章，“逻辑互操作性与可测试性”**讨论了实现互操作性和可测试性所需的中心逻辑设计概念，如值语义和词汇类型，这些概念反过来是成功重用的关键。在本章中，我们首次刻画了我们将随口提到的各种常见类别，从而建立一个更有效地交流已知行为家族的上下文。本章的后续章节讨论了如何通过审慎使用模板、恰当使用继承以及对资源管理的极其模块化的方法（例如：本地“区域”内存分配器）来进一步实现互操作性和可测试性。\n\
  \n**第 5 章，“接口与契约”**处理了构成我们开发的所有软件基石的组件、类和函数的接口塑造细节。在本章中，我们讨论了提供良好的定义的契约的重要性，这些契约除了任何对象不变性外，还清晰地界定了什么是必要的，什么是未定义行为（例如由狭窄契约引起）。历史上具有争议的话题，如防御性编程和在契约中显式使用异常，与其他契约检查与输入验证之间的关键区别一起讨论。在关注后兼容性（例如物理可替换性）之后，我们讨论了良好契约的各个方面，包括稳定性、`const`\
  \ 正确性、重用性、性和适用性。\n\n\n\n# 第 6 章“实现与渲染”涵盖了制造高质量组件所需的许多细节。本章的第一部分从单个组件实现的角度探讨了某些重要的考虑因素；后半部分对一致性方面的细微方面提供了实质性的指导，包括函数命名、参数顺序、参数传递以及操作符的正确放置。在本章的末尾，我们详细地阐述了对嵌入式组件级、类级、特别是函数级文档的严谨处理方法，并提供了一份开发者的最终“清单”，以帮助确保所有相关细节都已得到解决。\n\
  \n## 第三卷：验证与测试（即将出版）\n\n### 第 7 章“组件级测试”引入了测试的基础知识：测试某东西意味着什么，以及如何最好地实现这一目标。在这一（不同寻常的）简洁的章节中，我们简要介绍并对比了某些测试（构构佳）软件的经典测试方法，然后我们将展示坚持让每个组件都拥有一个且专用的（即独立的）测试驱动程序所带来的巨大益处。\n\
  \n### 第 8 章“测试数据选择方法”详细探讨了如何选择必要的输入数据，以编写出既详尽又运行时间接近于最短的测试。书中描述了经典和新颖的方法。特别值得关注的是`深度排序枚举`（depth-ordered\
  \ enumeration），这是一种创新的、系统的方法，用于按重要性顺序对值语义容器类型进行日益复杂的测试枚举。自从在 1997 年首次亮相以来，这种惊人地强大的测试数据选择方法的适用范围已大幅增长。\n\
  \n### 第 9 章“测试用例实现技术”探索了将之前识别的采样数据交付给被测功能并观察结果的不同方法，以便实现有效的测试套件。在此过程中，我们将引入有用的概念和机制（例如`生成器函数`\
  \ `generator functions`），以辅助我们的测试工作。补充测试用例实现技术（例如`正交扰动` `orthogonal perturbation`）对基础技术（例如`表格驱动`\
  \ `table-driven` 技术）完善了章。\n\n### 第 10 章“测试驱动程序组织”说明了我们组件级测试驱动程序的基本组织和布局。本章展示了如何优化测试用例的顺序，以便更原始的方法（例如`主要操作器`\
  \ `primary manipulators` 和`基础访问器` `basic accessors`）首先接受测试，随后再依赖它们来测试在同一组件内定义的其他不基础的功能。本章最后讨论了第\
  \ 4 章中讨论的各种大类类；对于每个类别，我们根据基本原则（第 7 章）提供了推荐的测试用例顺序，以及相应的测试用例实现技术（第 9 章）和测试数据选择方法（第\
  \ 8 章）。\n\n在 InformIT 网站上注册您的 `Large-Scale C++, Volume I` 副本，以便在更新和/更出现时方便访问。要开始注册过程，请访问\
