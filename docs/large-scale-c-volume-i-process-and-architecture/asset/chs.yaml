  \n![](img/back.jpg)![]Images/back1.jpg)\n\n## 谢谢\n\n从哪里开始呢？这本多卷书中第一个撰写的第 7 章（约 1999\
  \ 年）是我在 Bear Stearns 工作之余，在许多个深夜与 Shawn Edwards（一位了不起的技术专家，也是我亲爱的朋友）合作的结果。2001 年\
  \ 12 月，我加入了彭博（Bloomberg），Shawn 在不久后也加入了那里；从那时起我们密切合作。Shawn 在 2010 年担任了 Bloomberg\
  \ LP 的首席技术官 CTO。\n\n在尝试解释 第 1 章 中的底层技术细节（约 2002 年）陷入陷入僵局后，我转向了另一位了不起的技术专家（也是我亲爱的朋友）Sumit\
  \ Kumar，他积极指导我通过难关，甚至自己重写了其中的部分内容。Sumit——可能是我见过的最好的程序员——他继续与我一起工作，提供建设性的反馈和精神支持。\n\
  \n当我被试图做的事情巨大规模所压倒时（约 2005 年），我发现自己在电话里与另一位了不起的技术专家（也是我亲爱的朋友）Vladimir Kliatchko\
  \ 谈了近六小时，他带我过了一遍整个目录——逐节地——这个目录从那以后基本上没有变化。2012 年，Vlad 担任了彭博全球工程主管，并在 2018 年被任命为彭博管理委员会成员。\n\
  \nJohn Wait 是 Addison-Wesley 的收购编辑，主要负责促了我第一本书的出版，他明智地建议（约 2006 年）让我找一位精通写作和计算机科学的结构编辑来审阅我的新手稿，以进行宏观组织结构上的改进。然而，在审查之后，这位编辑公正地判断，对于重构我大量的书写内容，将无法提供任何可靠、实行的建议。\n\
  \n最终（约 2010 年），另一位了不起的技术专家 Jeffrey Olkin 加入了彭博。几个月后，我正在审查另一个小组的软件规范。文档写得不错，但不算完美——至少在第十页之前如此，之后它变得完美了！我走到书名作者面前询问发生了什么。他告诉我\
  \ Jeffrey 接手并完成了这份文档。长话短说，不久后我请求 Jeffrey 担任我的结构编辑，他同意了。在随后的几年里，Jeffrey 审阅并帮助我重写了第一卷的每一个字。我无法过度强调\
  \ Jeffrey 到目前为止对这本书在组织、写作和工程方面的贡献。而且，Jeffrey 也成了一位亲爱的朋友。\n\n至少还有五位技术专家评审员在准备出版时阅读了整份手稿，并提供了惊人的反馈：JC\
  \ van Winkel、David Sankel、Josh Berne、Steven Breitstein（他在将 ASCII 艺术转换后仔细审查了我的每一幅图）以及\
  \ Clay Wilson（外号“终结者”，因其卓越的代码审查质量）。这五位资深技术专家（前三位是 C++ 标准委员会成员；后四位是彭博的现任和前员工）都以各自的方式，通过广泛、周详、深入和详细的反馈极大提高了这本书的价值。\n\
  \n还有很多人从这本书诞生起做出了贡献，有些甚至在此之前。Chris Van Wy 教授（德鲁大学）是我第一本书的主要评审员，他对本卷的早期草稿提供了宝贵的组织反馈。Tom\
  \ Marshall（曾在 Bear Stearns 与我共事）和 Peter Wainwright 分别从 2002 年和 2003 年起就在彭博和我工作。Tom\
