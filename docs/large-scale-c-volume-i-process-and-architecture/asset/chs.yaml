  \ 292)）\n*   组件文件（`.h/.cpp`）必须与组件本身具有相同的根名称（即它们仅在后缀上不同）。p. 302)）\n*   每个组件必须位于一个包内。（p.\
  \ 303)）\n*   每个组件的（全小写）名称必须以其所属包的（全小写）名称开头，后跟一个下划线（`_`）。p. 304)）\n*   组件内声明的每个逻辑实体必须嵌套在与该实体所在的包同名的命名空间内。（p.\
  \ 307)）\n*   每个包命名空间必须嵌套在一个唯一的企业级命名空间内。（p. 309)）\n*   在包命名空间作用范围内声明的逻辑构造——除了自由 `operator`\
  \ 和 `aspect` 函数（如 `operator==` 和 `swap`）外——必须以实现它的组件的基名称作为前缀；宏名称（`ALL_UPPERCASE`）未受包命名空间（词法上）作用域，必须包含组件的全大写名称（包括包前缀）作为前缀。（p.\
  \ 311)）\n*   在组件的 `.h` 文件中，仅允许类、`structs` 和自由运算符函数（以及类似运算符的 `aspect` 函数，例如 `swap`）在包命名空间作用域内被`declared`。（p.\
  \ 312)）\n*   仅当一个或多个参数包含在同一组件中定义的类型时，组件头文件才允许包含 `free`（即非成员）运算符或 `aspect` 函数（在包命名空间作用域内）的声明。（p.\
  \ 317)）\n*   组件内部不允许在函数作用域之外出现 `using` 指令或 `using` 声明。（p. 331)）\n*   组件必须恰好包含一个\
  \ `.h` 文件和（至少）一个 `.cpp` 文件，这些文件满足基本属性 1.6 和 1.1。（p. 331)）\n*   `COMPONENT 1`：组件的\
  \ `.cpp` 文件包含其对应的 `.h` 文件，反之则不然。（p. 343)）\n*   `COMPONENT 2`：在 .cpp 文件中具有外部链接的每个逻辑构造。（p.\
  \ 343)）\n*   `COMPONENT 3`：在 .h 文件中具有外部链接的每个逻辑构造。（p. 344)）\n*   `COMPONENT 4`：组件的\
  \ .h 文件被另一个组件访问。（p. 344)）\n（注：此处省略了原文中重复出现的数十行关于“组件的 .h 文件被另一个组件访问”的重复描述）\n\n\n\n\
  \n| <未分组的包名称> :: | = <包组名称> ( [a-z0-9] )⁴ | ( [a-z0-9] )* |\n|  | &#124; <包组名称>\
  \ | *极其罕见* |\n|  | &#124; [a-y] _ [a-z] ( [a-z0-9] )* | *z_ 是特殊的.* |\n\n(p. 425)\n\
  \n*   应用程序的允许名称（即应用级“包”）必须与所有其他类型的包的名称不相交。 (p. 436)\n*   应用程序包内的所有代码必须对该包是局部的（私有的）——也就是说，*不允许*包之外的*任何*内容依赖于应用级包中定义的软件。\
  \ (p. 436)\n*   每个组件（并具有相同的根名称）必须配有一个*唯一的*、物理上独立的测试驱动程序，并具有一致的后缀（例如，`.t.cpp`）。 (p.\
  \ 441)\n*   组件测试驱动程序（物理上）位于与其所测试的组件相同的目录中。 (p. 445)\n*   测试驱动程序的层级*直接*（物理）依赖不能超过被测试组件的依赖关系。\
  \ (p. 445)\n*   测试驱动程序对外部数据或未明确属于我们支持的（可移植）构建环境的其他装置的依赖，不能超过被测试组件的依赖关系。 (p. 454)\n\
  *   在 `#include` 组件头文件时，不允许使用相对路径或绝对路径名称（即不允许使用任何目录名称）。 (p. 459)\n*   任何仅为了部署目的而采用的额外组织划分在架构上不应具有重要意义。\
  \ (p. 464)\n\n## 5 指南\n\n#### 第 2 章：\n\n*   出于设计目的，每个物理聚合体都应被视为原子。 (p. 277)\n* \
  \  架构上内聚的逻辑实体应当紧密封装在物理实体内部。(p. 294)\n*   在包-命名空间作用域下声明的每个逻辑实体的*使用*情况应足以指示定义该实体的组件、包和\
  \ UOR。 (p. 301)\n*   除了企业级命名空间和直接嵌套的包命名空间外，避免在架构上过度地使用 C++ `namespace` 结构。 (p. 341)\n\
  *   `.h` 文件应仅包含确保该头文件在隔离状态下编译所需的所需的 `#include` 指令（或在适当的情况下，本地[“前向”]类声明）。 (p. 355)\n\
  *   除非有工程上的理由说明其他，否则力求每个组件一个（公共）类。 (p. 369)\n*   避免在其所属类的词法作用域内*定义*嵌套类。 (p. 373)\n\
  *   完全*避免*声明*嵌套类。 (p. 375)\n*   如果可能，每个包都应该是适当的包组的一部分。 (p. 419)\n*   允许的包组依赖关系应该是：(1)\
  \ 最小的，且 (2) 很少增加。 (p. 420)\n*   企业内部每个（可共享的）UOR 的名称应在使用*之前*向中央机构注册（并预留）。 (p. 426)\n\
  *   每个测试驱动程序都应该有一个定义良好的、在全企业通用的调用接口子。 (p. 456)\n*   每个测试驱动程序的“用户体验”（理想情况下）应在全企业范围内是统一的。\
  \ (p. 458)\n\n#### 第 3 章：\n\n*   始终尝试进行重构，并在时间允许的情况下，主动将为特定应用程序创建的通用功能*降级*到我们不断增长的*软件资本*（Software\
  \ Capital）存储库物理层级中的适当位置。 (p. 518)\n*   除非有令人信服的*工程*理由，否则避免在组件中并列放置超过一个公共类。 (p. 522)\n\
  *   特别避免将预期具有很大不交客户端的类并列在一起。 (p. 524)\n*   避免预期具有不交客户端的类并列。 (p. 526)\n*   每个组件的设计都应该有一个明确的目标。\
  \ (p. 527)\n*   重用组件提供的功能应当是*完整的*且*最小的*。 (p. 528)\n*   在实例化类型内部内部的几乎所有（领域特定的）功能应该是*原始的*。\
  \ (p. 529)\n*   大多数操作实例化类型的非原始功能应在更高层次的工具 `struct` 中实现。 (p. 530)\n*   力求提供具有运行效率的接口，同时保持实现方案尽可能开放灵活。\
  \ (p. 534)\n*   优先提供原始功能，而不是实现应用级功能。 (p. 539)\n*   通过确保组件的功能是完整的，从而遵循*开闭原则*。 (p.\
  \ 545)\n*   优先考虑语义和物理依赖，特别是在包层级。 (p. 552)\n*   将必须更改的代码放在在一起。 (p. 560)\n*   将跨公共组件的紧密协作限制在一个\
  \ UOR 内。 (p. 565)\n\n## 6 观察\n\n#### 第 1 章：\n\n*   编译时依赖会导致链接依赖。 (p. 241)\n*   组件的依赖关系具有传递性。\
  \ (p. 242)\n*   只要系统可以编译，通过 C++ 预处理器 `#include` 指令就足以推导出系统中组件之间所有的实际物理依赖关系。 (p.\
  \ 258)\n\n#### 第 2 章：\n\n*   聚合体之间的依赖关系具有传递性。 (p. 278)\n\n\n\n\n\n- 每一个物理聚合（physical\
  \ aggregate）的定义必须包含：(1) 它所聚合的实体，以及 (2) 它`allowed` `directly`依赖的外部实体。(p. 281)\n-\
  \ 为了最大化人类认知，物理聚合内部的同类实体在物理复杂度上应该具有可性（例如，具有相同的物理聚合级别）。(p. 284)\n- 超过三个层平衡良好的物理聚合几乎总是没有必要的，并且可能会产生问题。(p.\
  \ 287)\n- 包组（Package groups）支持在逻辑和物理上具有内聚性的库开发。(p. 414)\n- 包组允许无循环应用程序库随着时间的推移而演进。(p.\
  \ 417)\n- 包组支持去中心化的包创建。(p. 421)\n- 在包组内选择包名是自动去中心化的。(p. 427)\n- 在开发过程中（架构上）必须假设的\
  \ UOR 粗粒物理粒度往往超过了部署软件的粒度。(p. 464)\n\n### 第 3 章\n\n- 物理实现依赖强烈地影响着模块化。(p. 521)\n-\
  \ 预期的客户端使用会显著影响模块化。(p. 523)\n- 迭代器通常能极大地减少那些本会被认为是 `manifestly primitive`（显式原始的）的操作。(p.\
  \ 529)\n- 实现中的灵活性可能会影响什么可以被视为 `primitive`（原始的）。(p. 535)\n- 只要组件在设计上必然在语法上（以及语义上）相似（例如，它们都实现了相同的\
  \ `protocol` 或满足相同的 `concept`），并且它们自然地共享本质相同的物理依赖范围，那么包对于显式分组这些组件用的。(p. 575)\n-\
  \ 包名和组件名有时可以很有成地表示设计的正交维度，但仅限于高度规则的（dead-regular）框架内如此。(p. 584)\n\n## 参考文献\n\n**[abrahams05]**\n\
