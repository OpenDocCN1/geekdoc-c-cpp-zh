- "# Learn Python 可视化 3.0：利用科学与创意教授非代码人员右脑学习的加速方法\n\n\n\n\n\n一本书的诞生需要许多人的共同努力。因此，向所有帮助我完成这个项目的项目的\
  \ Kickstarter 赞助者，我谨致以最诚挚的“感谢”，并希望我们未来能创造更多伟不起的事。\n\n\nAnthony Storms Akins\nAlan\
  \ Prak\nAlessandro\nAndy Lee\nBill Stull\nBrandon Thompson\nCharles Rogers\nClément\
  \ Labadie\nDemian Vonder Kuhlen\nEdgar Rodriguez\nGordon\nGreg_Vee\nGregory Pfrommer\n\
  Gregory R. Kinnicutt\nJ.T. O’Gara\nJanakan\nJeff\nJoe\nJoshua Bauder\nMarco Randall\n\
  Marshall Walker\nNeer Patel\nNigel J Allen\nPadrao\nPerry Yap\nR.C. Lewis\nRandy\
  \ Morris\nRowan Knight\nSebastian Lange\nShahid Ali Shah\nShrawan\nStan Spears\n\
  \n\n* Ivelin Demirov\n\n* Beth McMillan\n\n\n\n\n我必须感谢在线 Python 社区的帮助，他们多年来一直辛勤工作，才让\
  \ Python 变成了如今令人兴奋的编程语言。\n\n\n\n\n## 关于本书\n\n## 问题\n第一次尝试时觉得编程很难并不能归咎于。学习编程就像学习一门新语言。\n\
  \n有许多规则和语法符号指南需要遵循。它还需要背诵每种语言的大量术语，除非某人每天至少工作编程 8 小时，否则这个人不太可能很快变得熟悉编程；至少在现在之前，多年来一直是这种情况。\n\
  \n### 方法论\n我们的方法涉及通过简单的插图教授编程概念。\n\n这种视觉化方法之所以有效，是因为它是最基础的学习方式之一。每个人作为婴儿和幼儿，在对字母和意义产生理解之前，早已通过视觉和听觉学习周围的世界了。\n\
  \n编程是基于模块和构建块的。当一个人学习了几个基础模块和步骤后，就可以学习在这些基础单元的基础上构建更复杂的模块。\n\n这是一种构建块方法，一旦掌握了基础模块，就可以对更大的结构进行编码。我从一组通过插图和比喻容易学习的基础构建块开始。\n\
  \n从那里，用户可以应用多种变体并进一步构建。然而，初始的构建块变成了一种类似于“罗塞塔石”，允许用户在未来的任何情况下都能进行编程和构建。\n\n### 为什么选择\
  \ Python？\n当你在大学开启计算机科学之旅时，你可能会从学习 Python 开始。\n\n那么为什么选择 Python 而不是其他编程语言呢？这很简单：\n\
  \n* 无论你的操作系统是什么，Python 都易于设置。\n* Python 代码使用通用的英语，易于理解。\n* Python 允许你运行错误的代码。\n\
  \    * **为什么这是件好事？**\n    当你学习时，不可避免会出错。Python 会在你运行代码后告诉你错误是什么，帮助你找到问题。\n* Python\
  \ 是一个非常强大的工具，但它也很容易、快速学习，这就是为什么大多数人偏好它的原因。\n\n### 安装\n有预编译的包，以便在 Windows、Linux、UNIX\
  \ 和 Mac OS 等多个操作系统上轻松安装。\n\n如果你访问 `https://www.python.org/downloads/`，可以为你的操作系统选择正确的安装方法。大多数\
  \ Linux 系统都预装了 Python。\n\n本书使用的是 Python 3 版本。\n\n在 Windows 中，一旦安装了 Python，从开始菜单或屏幕上选择\
  \ `Python IDLE` 或 `Python command line/console`。\n\nIDLE 和控制台的区别在于 IDLE 具有图形界面，看起来类似于文本编辑器。在\
  \ Linux、UNIX 和 OS X 中，你可以通过在命令行输入 `Python` 来启动 Python 模拟器。\n\n要选择特定的 Python 版本，输入\
  \ `PythonX`，其中 `X` 是版本号（例如，版本 3 输入“Python3”）。\n\n![](img/00002.jpeg)\n\n## Hello\
  \ World!\n在你编写 Python 代码的大多数时候，会在 IDLE 或任何其他 IDE（如 Eclipse）或 Sublime text 或 Notepad++\
  \ 等文本编辑器中编写脚本。然而，你可以使用 Python 解释器交互式地编写代码，因为它就像一个 UNIX shell。\n\n虽然仅使用解释器就可以创建程序，但强烈建议不要这样做，因为很难将代码保存为脚本以便后续重用。相反，将解释器视为你编程构思的“即时”测试工具。\n\
  \n现在，让我们让解释器输出“Hello World!”。\n\n```\nprint(\"Hello World!\")\n```\n\n### 终端方式\n\
  如上一章所述，使用 `python` 命令从命令行启动解释器。输入以下内容：\n\n```python\nprint(\"hello world!\")\n```\n\
  \n终端应该看起来如下：\n\n![](img/0004.jpeg)\n\n在上面的代码段中，你可以看到第一行以 `>>>` 开头。这个符号表示你向解释器提供输入的行。注意，一旦你的第一个命令的结果在屏幕上打印出来，解释器就会再次打印\
  \ `>>>`。向解释器发出指令是顺序的。你给出一个指令——等待执行，你输入另一个命令，依此类推。\n\n注意，在本书后面，如果你在代码段中发现 `>>>` 符号，意味着你需要在解释器中测试该代码。\n\
  \n在第一行，你输入了一个语句。语句无非是计算机执行某些任务的指令。任务可以是从 `make_a_coffee` 到 `launch_a_rocket` 的任何内容。在你的情况下，它是一个简单的\
  \ `print` 函数。函数将在本书中进一步介绍。\n\n### 脚本方式\n软件工程的主要原则之一是重用。让我们让刚刚在解释器中测试的代码变得可重用。\n\n\
  要这样做，创建一个名为 `hello_world.py` 的文件，并在其中输入以下文本：\n\n```python\nprint(\"Hello World!\"\
  )\n```\n\n你放入文件的内容与之前通过解释器执行的行完全相同。现在运行你编写的脚本。打开命令行，导航到脚本所在的目录并输入以下内容：\n\n```bash\n\
  python hello_world.py\n```\n\n按下回车键后，你应该看到屏幕上显示了“Hello World!”文本。恭喜！你成功编写了第一个 Python\
  \ 程序并成功运行了它。\n\n![](img/00005.jpeg)\n\n### 变量\n在 Python 中，变量可以存储计算机内存中的语句输出。\n\n\
  ![](img/00006.jpeg)\n\n等号用于给变量赋值。变量的名字被称为标识符。\n\n![](img/00007.jpeg)\n\n```python\n\
  >>> a is b\nTrue\n>>> print(id(a))\n12312323\n>>> print(id(b))\n12312323\n```\n\n\
  你可以使用以下语法为多个变量分配相同的值：\n\n```python\n>>> a = b = c = d = f = \"Hello World!\"\n>>>\
  \ a\nHello World!\n>>> c\nHello World!\n```\n\n\n\n\n\n```python\n>>> f\n```\n\n\
  Hello World!\n\nPython 变量名必须遵循以下规则：\n\n1. 必须以字母或下划线开头\n2. 它们只能包含字母、数字或下划线\n\n几个非法变量名的示例：\n\
  \n1. `2var`\n2. `var-bar`\n3. `foo.loo`\n4. `@var`\n5. `$var`\n\nPython 还有一些不能作为变量名的特殊单词：\n\
  \n![](img/00009.jpeg)\n\n以及 `assert` `break` `class` `continue` `def` `del` `elif`\
  \ `else` `except` `exec` `finally` `for` `from` `global` `if` `import` `in` `is`\
  \ `lambda` `not` `or` `pass` `raise` `return` `try` `while` `yield`\n\n## 练习\n\n\
  问题：哪些语句是有效的？\n\n1. `$foo = “bar\"`\n2. `lambda = “bar\"`\n3. `finally = “yes\"`\n\
  4. `pass = “you shall not\"`\n5. `___buga_wuga_ = “@@@h\"`\n6. `foo_bar = “bar\"\
  `\n\n答案：最后两个。注意，倒数第二个之前的语句看起来是不正确的。但实际上它是一个具有适当字符串值的完全合变量。\n\n## 练习\n\n问题：在一行中为变量\
  \ `zen`、`foo` 和 `bar` 赋值值“blah”。\n\n答案：\n\n`foo = bar = zen = “blah\"`\n\n### 数据类型\n\
  \n![](img/00010.jpeg)\n\n下表提供了 Python 中最常用数据类型的概述。\n\n| 变量类型 | 示例 | 用注释 |\n| ---\
  \ | --- | --- |\n| `bool` | `life_is_good = True`, `hamsters_are_evil = False` |\
  \ 真/假值 |\n| `int, long` | `size_of_shoes = 42`, `earth_population = 7000000000`\
  \ | 各种整数 |\n| `float` | `pi = 3.14159265359` | 非整数 - 小数后带有一个或多个符号 |\n| `str` | `chinese_hi\
  \ = \"你好\"` | 任何文本 |\n| `None` | `my_new_book = None` | 没有任何意义值的空变量 |\n\n你可以使用赋值运算符\
  \ `==` 在变量中存储所有类型的数据。\n\n多行字符串可用于存储大数据块。\n\n```python\nlong_text = \"\"\"Line one\n\
  \nLine two\n\nLine three\n\nLine Four\n\n\"\"\"\n```\n\n如你所示，多行字符串是使用三引号而不是单引号的普通字符串。\n\
  \n在 Python 中，可以将字符串转换为整数，将整数转换为字符串：\n\n```python\n>>> str(100)\n'100'\n>>> int(“234”)\n\
  234\n```\n\n### 测验\n\n问题：\n\n1. 这个 `=`运算符的名字是什么？\n2. 如何将数字 3.14 转换为字符串 ‘3.14’？\n\
  \n答案：\n\n1. 赋值运算符\n2. `str(3.14)`\n\n### 基础数学\n\nPython 拥有一内置算术运算符。下表提供了简写与其对应的等价形式的简要比较。\n\
  \n假设初始状态下成立：`a = 3`。\n\n| 操作名称 | 简写 | 完整形式 | a 的值 | 注释 |\n| --- | --- | --- | ---\
  \ | --- |\n| 加法 | `a += 1` | `a = a + 1` | 4 | |\n| 减法 | `a -= 1` | `a = a - 1`\
  \ | 2 | |\n| 乘法 | `a *= 2` | `a = a * 2` | 6 | |\n| 除法 | `a /= 2` | `a = a / 2`\
  \ | 1.5 | 返回小数或浮点数 |\n| 取模 | `a %= 2` | `a = a % 2` | 1 | 返回除法的整数余数 |\n| 幂 | `a\
  \ **= 2` | `a = a ** 2` | 9 | 普通数学中的 a² |\n| 整除 | `a //= 2` | `a = a // 2` | 1 |\
  \ 仅整数（int）值 |\n| 否定 | `a = -a` | `a = 0 -a` | -3 | 返回相反符号的相同 |\n\n在 Python 中求数字的平方根也很简单，但它不是语言的内置功能。你将在书中后面了解到！\n\
  \n你可以使用 `abs()` 计算数字的绝对值（例如 `|-3|`）。例如 `abs(-3)` 返回 3。\n\n### 运算符优先级\n\nPython 中数学运算的执行顺序与数学中的顺序相似。在数学中有三个优先级级别：\n\
  1. 幂和根\n2. 乘、除和取模\n3. 加和减\n\n幂和根由标准库的函数表示，并在本书后进一步讨论（images/00011.jpeg）。\n\n所有其他优先级都有自己的内置运算符。高级的操作在低级之前执行。相同顺序的操作从左到右依次执行。例如，语句\
  \ `2 + 3 * 4` 返回 `13`。\n\n为了影响执行顺序，应该使用括号 `()`。例如 `(3 + 6) * 2` 等于 `18`。\n\n## 代码示例\n\
  \n下面的代码显示了解释器如何处理简单的数学运算。\n\n```python\n>>> 13 * 2\n26\n>>> 10 - 3\n7\n>>> 11 %\
  \ 10\n1\n>>> 6 ** 2\n36\n>>> 12 / 8\n1.5\n>>> 12 // 8\n12\n>>> 6 - -16\n22\n>>>\
  \ a = 16\n>>> a += 3\n19\n>>> a = 4\n>>> b = 6\n>>> a *= b\n24\n```\n\n## 练习\n\n\
  问题：尝试不使用 Python 回答以下问题，然后使用解释器验证：\n1. 计算 `2 + 2 + 2 * 0` 的结果是什么？\n2. `(2 + 2 + 2)\
  \ * 0` 又如何？\n\n答案：如果你回答 0，你忘记了乘法的优先级高于加法。如果你是其他答案，你忘记了括号内的操作应先执行。`(4 - (2 * 0))`\
  \ 是 0，任何数乘以 0 也是 0。\n\n## 练习\n\n问题：汽车的速度为 100 km/h。编写一些代码计算汽车在 `N` 小时内行驶的距离（米，而不是公里！）。\
  \ `N` 为 10。\n\n答案：\n1. `N = 10`\n2. `distance_in_kilometers = 100 * N`\n3. `distance_in_meters\
  \ = distance_in_kilometers * 1000`\n\n## 练习\n\n问题：使用简写形式重写代码\n1. `N = N`\n2. `i\
  \ = i + j`\n3. `f = f - 2`\n\n答案：\n1. `N *= N`\n2. `i += j`\n3. `f -= 2`\n\n## 练习\n\
  \n问题：给定 `f(x) = |x³ - 20|`，找到 `f(-3)`。你的答案应该包含两行代码：一行将 `x` 初始化为 -3，另一行计算结果。\n\n\
  答案：以下 Python 代码将完成工作：\n```python\n>>> x = -3\n>>> abs(x ** 3 - 20)\n```\n\n## 练习\n\
  \n问题：尝试使用内联 -3 而不是使用变量 `x` 来解决上一个问题。\n\n答案：你的解决方案应该是这样的：\n```python\n>>> abs((-3)\
  \ ** 3 - 20)\n```\n如果看起来像：\n```python\n>>> abs(-3 ** 3 - 20)\n```\n这是错误的，因为否定（即减零）的优先级低于幂，因此必须放在括号中。尽管你的结果与正确答案相同，但这纯属巧合。尝试在不加括号的情况下找出\
  \ `f(x) = |x² - 20|` 值。\n\n## 练习\n\n问题：如何使用 Python 检查整数是否为奇数？\n\n答案：使用取模运算符找到除以\
  \ 2 的余数。如果余数为 1，则数字为奇数。\n```python\n>>> 3 % 2\n1\n>>> 4 % 2\n0\n```\n\n\n\n\n\n\
  ```python\n>>> foo = \"one\"\n>>> bar = \"two\"\n>>> full = foo + \" \" + bar\n\
  >>> print(full)\n\none two\n```\n\n如果你想创建一个包含 N 个子字符串的字符串，可以使用 `*` 运算符。\n\n```python\n\
  >>> foo = \"foo \" * 3\n>>> print(foo)\n\nfoo foo foo\n```\n\n### 测验\n\n### 题目\n\
  1. 在 Python 中可以将多个字符串合并为一个。这种操作的名称是什么？\n2. 有一个字符串 `value = \"foobar\"`。你通过以下方式访问子字符串：`other_value\
  \ = value[1:3]`。这种操作的名称是什么？`other_value` 的长度是多少？\n3. 字符串第一个字符的索引是多少？\n\n### 答案\n\
  1. 拼接 (Concatenation)\n2. 切片 (Slicing)。长度为 2。切片操作定义的最后一个字符不包含在内。\n3. 0\n\n## 练习\n\
  \n### 题目\n有两个字符串：`one = \"John is strong\"` 和 `two = \"Tea is not warm\"`。编写 Python\
  \ 代码，从 `one` 和 `two` 中生成字符串结果 `result = \"John is not strong\"`：\n\n### 答案\n```python\n\
  result = one[0:8] + two[7:11]\n```\n\n## 练习\n\n### 题目\n找出这些字符串中哪一个不包含字母“B”：“Foo”、“Bar”、“Zoo”、“Loo”。\n\
  \n### 答案\n```python\n>>> \"B\" in \"Foo\"\nFalse\n>>> \"B\" in \"Bar\"\nTrue\n>>>\
  \ \"B\" in \"Zoo\"\nFalse\n>>> \"B\" in \"Loo\"\nFalse\n```\n\n## 练习\n\n### 题目\n\
  使用 Python 解释器找到字符串“John is strong”的长度\n\n### 答案\n```python\n>>> len(\"John is strong\"\
  )\n14\n```\n\n## 注释\n\n在 Python 代码上编写注释非常简单。编写 Python 注释有两种方法：单行注释和多行注释。\n\n![](img/00014.jpeg)\n\
  \n注释的目的是为了帮助用户理解代码，并且会被解释器忽略。\n\n单行注释通过在开头添加 `#` 字符来创建。它们用于在函数开头添加简短的注释。\n\n1. `#\
  \ 这是一个有效的单行注释。`\n\n你也可以在代码之后添加行内注释，这有助于解释语句的作用。\n\n1. `print(\"Hello there!\") \
  \     # 这在 Python 中是一个行内注释`\n2. `# 这是另一个。`\n\n### 多行注释\n\n![](img/00015.jpeg)\n\n\
  与其将多个单行注释连接在一起，对于较长的注释，你可以在第一行和最后一行使用三个连续的引号。\n\n```python\n\"\"\"这是一种更好的注释方式\n\
  可以跨越多行\n而不需要使用大量的井号（#）。\n\"\"\"\n```\n\n这种类型的注释通常用作任何阅读程序者的文档。毕竟，无论你的技术多高超，如果你拿到一个没有注释的程序，除非你预先知道，否则将不得不花时间检查代码以弄它是做什么的以及如何使用。\n\
  \n## 函数\n\n我们之前讨论过可重用性是软件工程的核心原则。一旦你写了一些代码，你就会想存储它们，以便再次使用，而无需复制和粘贴。\n\n这就是函数的用途！函数是封装代码的一种方式使其可以通过调用一个简单的快捷方式来重复使用。\n\
  \n假设你想连续打印三次“Hello Mr. Jones! How are you today?”而没有任何代码重复。可以通过以下方式实现：\n\n```python\n\
  def hi():\n    print(\"Hello Mr. Jones! How are you today?\")\nhi()\nhi()\nhi()\n\
  ```\n\n### 基础函数\n\n在上面的代码段中，你可以看到关键字 `def`。它定义了一个表示函数的代码块。函数名必须遵循与变量相同的规则。此函数名为\
  \ `hi`，后面跟着括号和冒号。括号内部是参数列表，在这种情况下，它是完全空的。\n\n在函数之后，代码块必须缩进以将其定义为嵌套块。\n\n你应该遵循两个\
  \ Python 惯例：使用四个空格缩进你的代码块，并且在函数名中仅使用小写字母和下划线。\n\n这段代码无法工作：\n\n<未缩进的示例>\n```python\n\
  def hi():\nprint(\"Hello Mr. Jones! How are you today?\")\n```\n\n这段代码将无法工作：\n\n\
  <缩进不一致>\n```python\ndef hi():\n    print(\"Hello Mr. Jones! How are you today?\"\
  )\nprint(\"foobar\")\n```\n\n在函数下方，你可能会看到三行调用它的代码。让我们来看其中一个特定的调用：调用只是函数名，后跟预期作为参数列表传递的参数。参数预期放置在括号内。在这种情况下，我们没有参数列表，括号是空的。\n\
  \n### 带参数的函数\n\n有时你可能希望函数在不同条件下改变其行为。为了这一点，你可以使用函数参数。假设你想不仅向 Jones 先生打招呼，还向任何名字的人打招呼。你必须修改原始的\
  \ `hi()` 函数使其像这样：\n\n```python\ndef hi(name):\n    print(\"Hello \" + name + \"\
