  \ os.path import join`\n2. `def show_foobar_here(path):`\n3. `print(join(path, \"\
  foobar\"))`\n\n## 练习\n\n### 问题：使用 `os.path` 模块中的 `isdir` 函数找到当前目录下的文件夹。\n遍历文件和文件夹，然后抛出一个自定义的\
  \ `DirFound` 异常，并将目录的绝对路径作为可读的描述。\n\n### 答案：\n以下方案是充分的：\n```python\nfrom os.path\
  \ import isdir, curdir, abspath\nfrom os import listdir\nclass DirFound(Exception):\n\
  \    pass\n\ndef detect_dirs():\n    for item in listdir(curdir):\n        if isdir(item):\n\
  \            raise DirFound(abspath(item))\n```\n\n## 正正则表达式\n\n虽然你可以使用 `in` 运算符来检查字符串中是否存在子字符串，但它不会告诉你子字符串的位置，也不会让你能够非精确地匹配子字符串。\n\
  \n看这个字符串：\n```python\n>>> lorem_text = \"Lorem ipsum dolor sit amet, consectetur\
  \ adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\"\
  \n```\n你想找出这段文本是否包含类似“dolor BLA BLA BLA amet”的内容——即单词按顺序出现“dolor”和“amet”，之间可以有任意长度的文本。\n\
  \n要实现这一点，你可以使用 `re.search` 方法：\n```python\n>>> import re\n>>> found = re.search(\"\
  dolor .*amet\", lorem_text)\n>>> found\n<_sre.SRE_Match object; span=(12, 26), match='dolor\
  \ sit amet'>\n```\n`search` 函数接受正则表达式模式作为第一个参数，并将要搜索的文本作为第二个参数。\n\n正则表达式模式是对你在文本中要查找内容的灵活描述。其格式将在本章稍后介绍。\n\
  \n查看 `search` 函数的返回值：它被称为 `MatchObject`（匹配对象），它会告诉你子字符串在原始文本中的位置。\n\n如果找不到模式，该函数将返回\
  \ `None`：\n```python\n>>> match = re.search(\"found\", lorem_text)\n>>> type(match)\n\
  <class 'NoneType'>\n```\n你可以从匹配对象获取子字符串的起始和结束索引：\n```python\n>>> found.start()\n\
  12\n>>> found.end()\n26\n```\n并访问由模式匹配的子字符串：\n```python\n>>> found.group()\n'dolor\
  \ sit amet'\n>>> lorem_text[12:26]\n'dolor sit amet'\n```\n注意：如果发现了多次匹配模式，只返回第一个。如果你需要遍历所有出现的地方，请使用\
  \ `re.finditer` 函数：\n```python\n>>> list(re.finditer(\"dolor .*amet\", lorem_text))\n\
  [<_sre.SRE_Match object; span=(12, 26), match='dolor sit amet'>]\n```\n如果你想检查一个字符串是否匹配特定模式，应该使用\
  \ `re.match` 函数，它尝试将模式应用于整个字符串：\n```python\n>>> bool(re.match(\"[0-9][a-z]*\", \"\
  0dgfgfg\"))\nTrue\n>>> bool(re.match(\"[0-9][a-z]*\", \"dgfgfg\"))\nFalse\n```\n\
  正则表达式模式中的符号 `.*` 匹配零或多个任意字符。点代表任意字符，星号代表次数（基数）。这是任何正则表达式模式的基本结构：一个符号类型，后跟其次数。\n\n\
  下表提供了最常用次数的概览。\n\n| 次数 | 描述 |\n| :--- | :--- |\n| `*` | 零或多个 |\n| `+` | 一个或多个 |\n\
  | `?` | 零或一个 |\n| `{m}` | 符号的精确数量 |\n| `{m, n}` | 最少 m 最多 n |\n\n这些是记忆其中一些的方法：\n\
  ```python\n>>> import re\n>>> print(re.search('^', 'Beginning of line'))\n>>> print(re.search('line$',\
  \ 'Beginning of line'))\ntxt = \"The quick brown fox jumps over the lazy dog\"\n\
  ```\n\n正则表达式\n此表显示了最常用的符号。\n\n| 符号 | 描述 |\n| :--- | :--- |\n| `.` | 任意字符 |\n| `\\\
  \"` | 双引号 |\n| `'` | 单引号 |\n| `\\\\` | 反斜杠 |\n| `\\t` | 制表符 |\n| `\\n` | 换行符 |\n\
  | `[0-9]` | 数字 |\n| `[a-z]` | 小写字母 |\n| `[A-Z]` | 大写字母 |\n| `[a-zA-Z]` | 字母 |\n\
  | `[⁰-9]` | 非数字 |\n| `[^a-z]` | 非小写字母 |\n| `^` | 行首 |\n| `$` | 行尾 |\n| `.*` | 任意多个字符\
  \ |\n| `.+` | 一个或多个字符 |\n| `.?` | 零或一个字符 |\n| `{m}` | 确定的次数 |\n| `{m, n}` | m 到\
  \ n 次 |\n| `{m,}` | 至少 m 次 |\n| `{0, n}` | 最多 n 次 |\n\n正如你看到的，`math` 模块可以执行常见的数学运算。\n\
  \n本章提供了 Python 标准库中 `math` 模块的概述。该模块包含了常见数学运算的实现，例如平方根，这些没有包含在标准函数中。\n\n这是由于语言处理浮点数计算的方式。\n\
  \n你可以获得特定精度的特殊数字，如 `pi` 和 `e`：\n```python\n>>> math.pi\n3.141592653589793\n>>> math.e\n\
  2.718281828459045\n```\n\n你也可以计算平方根：\n```python\n>>> math.sqrt(16)\n4.0\n```\n\n\
  使用 `math` 模块你可以执行常见的三角运算：\n```python\n>>> math.sin(math.radians(30))\n0.4999999999999999\n\
  >>> math.cos(math.radians(60))\n0.5000000000000001\n>>> math.tan(math.radians(45))\n\
  0.9999999999999999\n```\n注意，参数是弧度的值而不是度。这就是为什么额外调用了 `math.radians`。\n此外，你看到 0.499999999\
  \ 而不是 0.5，或者 0.999999999 而不是 1。\n这是由于语言处理浮点数计算的方式。\n\n你可以获得特定精度的特殊数字，如 `pi` 和 `e`：\n\
  ```python\n>>> math.pi\n3.141592653589793\n>>> math.e\n2.718281828459045\n```\n\n\
  你也可以计算平方根：\n```python\n>>> math.sqrt(16)\n4.0\n```\n\n\n\n\n\n```python\n>>> math.sqrt(25)\n\
  5.0\n```\n\n### 测验\n\n问题：为了回答以下问题，你需要深入研究标准库\n\n1. 你会使用哪个函数来计算反正切？\n2. 应该使用哪个函数进行指数运算？\n\
  3. 如何计算数的阶乘？\n\n### 答案：\n\n1. `math.atan`\n2. `math.exp`\n3. `math.factorial`\n\n\
  ## JSON\n\n在软件工程中，有一个被称为序列化（serialization）的过程。它的主要目的是将任意对象的状态转换为可以在网络上传输和/或以某种方式存储的内容，以便以后重建原始对象。这种重建的过程被称为反序列化（deserialization）。\n\
  \n序列化的现实生活类比是研究一个现有的构制品（例如汽车）并对其制作一份详细的蓝图（包含引擎、轮子、变速箱等）。通过网络发送序列化数据类似于通过普通邮寄发送蓝图。而反序列化则是某人根据获取的蓝图构建出原始对象副本的过程。\n\
  \n在 Web 编程领域，有两种数据序列化标准最受欢迎：XML 和 JSON。它们都是文本格式，这意味着使用这些标准表示的数据可以通过像 `VIM` 简单的文本编辑器供人类查看。本章的主题是\
  \ JSON 以及 Python 使用它序列化数据的方法。\n\n`JSON` 是 JavaScript 编程语言中操作数据的原生方式。\n\n作为一种格式，`JSON`\
  \ 与三种主要结构操作：\n\n1. 原生类型：整数、浮点数、字符串、布尔值和 null 类型\n2. 对象：Python 字典的等价\n3. 数组：Python\
  \ 列表的等价\n\n你可以看到，所有的 JSON 结构都完美匹配 Python 的内置类型。因此，将 Python 数据结构序列化为 JSON 的主要目的是将\
  \ Python 内置类型转换为 JSON 字符串，例如作为 HTTP 请求/响应体中的负载发送。\n\n默认情况下，Python 可以序列化以下数据类型：`int`、`bool`、`None`、`str`、`float`、`long`、`dict`\
  \ 和 `list`。有方法可以扩展此功能，但它们超出了本章的范围。\n\nPython 负责序列化的模块被称为 `json`。它包含两个主要函数：`dumps`\
  \ 和 `loads`。`dumps` 期望 Python 数据结构作为输入并返回 JSON 字符串作为输出。`loads` 执行相反相反的操作 - 它期望 JSON\
  \ 字符串作为输入并返回 Python 数据结构作为输出。\n\n## 代码示例\n\n### 导入 JSON 模块\n1. `json`\n\n### 将字符串列表序列化为\
  \ JSON 数组\n2. `list_of_strings = [\"one\", \"two\", \"three\", \"four\"]`\n3. `json_array\
  \ = json.dumps(list_of_strings)`\n\n### 将 JSON 对象反序列化为 Python 数据结构\n1. `json_data\
  \ = \"\"\"\n{\n  \"integer\": 1,\n  \"inner_object\": {\n    \"nothing\": null,\n\
  \    \"boolean\": false,\n    \"string\": \"foo\"\n  },\n  \"list_of_strings\":\
  \ [\n    \"one\",\n    \"two\"\n  ]\n}\n\"\"\"`\n2. `python_dict = json.loads(json_data)`\n\
  \n### 序列化整数\n```python\nprint (json.dumps(1))\n1\nprint (type(json.dumps(1)))\n\
  <class 'str'>\n```\n\n### 代码样本\n\n### 序列化字符串\n```python\n>>> print(json.dumps(\"\
  FOO\"))\n\"FOO\"\n>>> print(len(json.dumps(\"FOO\")))\n5\n```\n\n### 尝试反序列化非 JSON\
  \ 的内容 - 当输入无法处理时会抛出 ValueError\n```python\n>>> json.loads(\"FOO\")\nTraceback ...\n\
  ...\nValueError: No JSON object could be decoded\n```\n\n### 尝试序列化在 JSON 中没有表示的内容\
  \ - 默认仅支持有限 Python 内置类型\n```python\n>>> class Teacher(object):\n    pass\n>>> t\
  \ = Teacher()\n>>> json.dumps(t)\nTraceback ...\n...\nTypeError: <...Teacher instance\
  \ at...> is not JSON serializable\n```\n\n### 测验\n\n问题：\n1. Python 中哪个函数负责 JSON\
  \ 序列化？\n2. “序列化”的反义词是什么？哪个 Python 函数负责该操作？\n3. 这条命令的输出是什么：`print (json.dumps(\"\
  FOO\")[0])`？\n4. 这条命令的输出是什么：`print (len(json.dumps(None)))`？\n5. 这条命令的输出是什么：`print\
  \ (type(json.dumps('”1.57”)))`？\n\n### 答案：\n1. `json.dumps`\n2. 反序列化 / `json.loads`\n\
  3. `\"[1]\"`\n4. `4`\n5. `<type ‘str’>`\n\n***\n\n## 练习\n\n问题：有以下代码：\n实现 `join_two_arrays`\
  \ 函数\n\n```python\n>>> array_of_strings = [\"one\", \"two\"]\n>>> array_of_strings\
  \ = [\"three\", \"four\"]\n>>> join_two_arrays(array_of_strings, array_of_strings)\n\
  ['one', 'two', 'three', 'four']\n```\n\n```python\n>>> type(join_two_arrays(array_of_strings,\
  \ array_of_strings))\n<class 'list'>\n```\n\n### 答案：\n```python\ndef join_two_arrays(list1,\
  \ list2):\n    return list1 + list2\n```\n\n问题：有以下代码：\n实现 `json_if_already_json`\
  \ 函数\n\n```python\n>>> class Teacher(object):\n    pass\n>>> t = Teacher()\n```\n\
  \n### 答案：\n```python\ndef json_if_already_json(obj):\n    try:\n        return json.dumps(obj)\n\
  \    except TypeError:\n        return obj\n```\n\n## SQL: sqlite3\n\n软件开发的一个主要原则是重用性。该原则可以重述为\
  \ DRY - 不要重复（Don’t Repeat Yourself）。实现它的最佳方法是避免重复造轮，并应用之前的解决方案。\n\n在信息处理和数据存储发展的几十年里，出现了一种常见的约束（constraints）。在这种背景下，“约束”意味着你应用于数据的规则集。\n\
  \n为了理解什么是约束，请思考电子邮件。地址预期包含一个“@”字符。这种预期就是一个约束。\n\n具有多个约束的现实生活系统是汽车装配线。所有零件都预期符合某些标准\
  \ - 如果不符合，无法完全自动化，必须引入人工。\n\n为了创建一个通约束系统，现有系统被合并为现在的关系型数据库。\n\n数据以表的形式存储在关系型数据库中，每列代表了每行数据类型（字符串、整数、布尔值等）的一组规则。\n\
  \n主键约束定义了哪个字段应该作为主索引，即行中的哪条信息可以用作其地址。“索引”一词在邮政行业中的含义完全相同。在邮政中，它是特定收件人的地址；在关系型数据库中，它是表中的某一行。\n\
  \n## SQL\n\n为了说明引用完整性（referential integrity）的含义，最好查看以下现实生活案例。\n\n如果一个学生离开学校去另一所学校，必须从他们所有课程的注册表中将其移除。同样，如果你想从关系型数据库中删除一个项目，还必须删除数据库中对它的所有引用。\n\
  \n\n\n\n在关系型数据库的背景下，当学生转校时将其从相应课程中删除的过程被称为引用完整性管理。外键约束可以告诉你哪些列包含了对数据库中其他地方的引用。\n\
  \n还有几十种其他约束。尽管本章不会涵盖这些内容，但之前已经简要介绍过的约束已经足够让你对关系型数据库的行为有一个合理的理解。\n\n在我们继续之前，你还需要了解的最后一点内容是结构化查询语言（SQL）。`SQL`\
  \ 是一种专门用于声明数据库约束和操作数据（即列出、查看、创建、更新或删除数据）的编程语言。\n\n## Python sqlite3\n\nPython 内置了一个名为\
  \ `sqlite3` 的数据库模块。\n\n它是关系型数据库和 SQL 的全栈 Python 实现。\n\n在这里，我们将简要地介绍主要的 SQL 语句和数据库构建结构。\n\
  \n首先，打开你的 Python 解释器并导入 `sqlite3`：\n\n1. `import sqlite3`\n\n初始化数据库连接：\n\n2. `conn\
  \ = sqlite3.connect('example.db')`\n\n获取游标：\n\n3. `cursor = conn.cursor()`\n\n4.\
  \ `cursor.execute(\"PRAGMA foreign_keys = ON\")`\n\n游标只是用于执行 SQL 语句的 Python 对象。在\
  \ `sqlite3` 中，由于性能考虑，外键约束默认被禁用。`PRAGMA` 语句可以启用它们。\n\n现在让我们创建一个简单的用户表。\n\n1. `cursor.execute(\"\
  \"\"`\n```sql\nCREATE TABLE users(\nid INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,\n\
  email TEXT NOT NULL,\nname TEXT NOT NULL\n)\n```\n`\"\"\")`\n\n在上面的代码中，你可能会看到以下内容：\n\
  \n* 每个用户都必须有一个文本值的邮箱和名称。\n* 每个用户都有一个整数标识符作为主键。`AUTOINCREMENT` 意味着每当创建新用户时，`id` 都将根据之前存储的用户标识符自动生成。\n\
  \n此外，让我们也创建一个名为 `cars` 的表，使得表中提到的每辆车都必须在 `users` 表列出的列表中有一个所有者。\n\n1. `cursor.execute(\"\
  \"\"`\n```sql\nCREATE TABLE cars(\nid INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,\n\
  brand TEXT NOT NULL,\nmodel TEXT NOT NULL,\nowner INTEGER NOT NULL,\nFOREIGN KEY(owner)\
  \ REFERENCES users(id) ON DELETE CASCADE\n)\n```\n`\"\"\")`\n\n在上面的代码中，有一个外键定义，表示了\
  \ `cars` 和 `users` 之间所有权的关系。`ON DELETE CASCADE` 语句告诉数据库，每当删除一个用户时，属于该用户的汽车也必须被删除。\n\
  \n让我们创建一个用户和两辆属于该用户的汽车：\n\n1. `cursor.execute('INSERT INTO users VALUES(NULL, '`\n\
  2. `'\"john.smith@pythonvisually.com\", \"John Smith\")')`\n3. `cursor.execute('INSERT\
  \ INTO cars VALUES(NULL, \"Fiat\", \"Polo\", 1)')`\n4. `cursor.execute('INSERT INTO\
  \ cars VALUES(NULL, \"BMW\", \"X6\", 1)')`\n\nsqlite3\n\n注意，在创建汽车时，我们为 `owner` 传递了值\
  \ `1`。我们知道用户 John Smith 是数据库中创建的第一个。因此，他的 `ID` 逻辑上应该是 `1`。\n\n让我们尝试创建一个引用并不存在的用户的用户，例如用户\
  \ #2。\n\n`cursor.execute('INSERT INTO cars VALUES(NULL, \"Mazda\", \"6\", 2)')`\n\
  \n你应该会看到一个带有以下错误信息的追溯跟踪：\n\n`sqlite3.IntegrityError: FOREIGN KEY constraint failed`\n\
  \n通过这种方式，数据库引擎通知你尝试存储的外键有问题。\n\n现在，让我们操作一下我们创建的测试数据。\n\n首先，更改 John 的邮箱：\n\n上面的代码使用了\
  \ `UPDATE` 命令和 `WHERE` 语句。结合使用，它们允许你更新所有符合搜索标准的值。\n\n现在，让我们检查邮箱是否真的已更新：\n\n`rows\
  \ = list(cursor.execute('SELECT email FROM users WHERE name=\"John Smith'))`\n\n\
  ```\n[(\"john.smith@pythonvisually.com\",)]\n```\n\n在选择要检查哪个用户时，我们使用了 `SELECT` 命令。在选择过程中，我们声明我们只对用户的邮箱感兴趣。在行选择的情况下，`cursor`\
  \ 的 `execute` 方法返回了一个用于遍历数据库行的迭代器，我们将其转换为列表并打印出来。\n\n让我们删掉其中一种汽车，例如 BMW：\n\n1. `cursor.execute('DELETE\
  \ FROM cars WHERE brand=\"BMW\"')`\n2. `rows = list(cursor.execute('SELECT * FROM\
