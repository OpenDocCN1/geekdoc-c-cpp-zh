  John\": 34,\n3. \"Matt\": 23,\n4. \"Natasha\": 27,\n5. \"Gabriella\": 33\n6. }\n\
  ```\n\n键值值对必须包含在花括号中，并用逗号分隔。键和值之间必须用冒号分隔。\n\n字典中的键必须是唯一的，但值可以是相同的。键可以是几乎任何类型的变量。\n\
  \n以下也是一个有效的字典：\n\n```python\n1. class SomeClass:\n2. pass\n3. obj1 = SomeClass()\n\
  4. obj2 = SomeClass()\n5. a_dict = {\n6. obj1: 11,\n7. obj2: 23\n8. }\n```\n\n你可以通过以下方式获取\
  \ John 的年龄：\n\n```python\n1. johns_age = ages[\"John\"]\n```\n\n同样，你可以通过键来设置元素的值：\n\
  \n```python\n1. ages[\"John\"] = 999\n```\n\n上述语句要么更改现有键的值，要么在不存在该键时创建一个新的键值对。\n\
  \n你也可以从字典中删除一个键值值对。\n\n```python\n1. ages.pop(\"John\")\n```\n\n### 测验\n\n问题：\n\
