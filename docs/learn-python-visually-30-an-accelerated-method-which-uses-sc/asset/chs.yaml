  \ max_speed)`。\n4. 该方法中缺少了什么？\n\n**答案：**\n1. 接口 (Interface)\n2. 继承 (Inheritance)\n\
  3. 类构造函数 (class constructor)\n4. `self` 参数\n\n## 练习\n\n**问题：** 编写 Python 代码让宝马 X6\
