  \n大多数文件操作归为：打开文件、读取文件、向文件写入数据和关闭文件。通常写入文件的数据将是文本的。\n\n假设你想将整数列表写入文件，每个整数单独占一行。首先，打开文件：\n\
  \n```python\n1. the_file = open(\"integers.txt\", \"w\")\n```\n\n`open` 函数的第一个参数是路径，第二个参数告诉\
  \ Python 你向文件中写入数据。这意味着在开始之前文件不需要存在。\n\n该函数返回一个文件对象，你稍后可以使用。\n\n首先定义一个整数数组并将其写入文件：\n\
  \n```python\n1. integers = [1, 2, 3, 4, 5]\n2. for integer in integers:\n3. the_file.write(str(integer)\
  \ + '\\n')\n```\n\n`write` 方法接收字符串作为参数并将其写入文件。\n\n注意 `\\n` 符号——这是换行符。它在文件中开启新行。\n\
  \n当你完成文件操作时，必须关闭它：\n\n```python\n1. the_file.close()\n```\n\n你也可以从文件中读取数据。\n\n首先，不使用\
  \ `w` 标志打开文件：\n\n```python\n1. the_file = open(\"integers.txt\")\n```\n\n获取文件的所有行：\n\
  \n```python\n1. lines = the_file.readlines()\n```\n\n`readlines()` 函数将文件中所有的行以字符串列表的形式返回。\n\
  \n打印这些行：\n\n```python\n1. for line in lines:\n2. print(line)\n```\n\n执行上述代码后，你将在屏幕上看到：\n\
  1\n2\n3\n4\n5\n\n正像写入文件一样——完成后也要关闭它：\n\n```python\n1. the_file.close()\n```\n\n\n\
  \n\n\n## 问题\n\n1. 换行符看起来是什么样的？\n2. 完成文件操作后，你应该对文件做什么？\n3. 使用哪种方法将数据写入文件？\n4. 应该使用什么方法获取文件中的所有行？\n\
  \n## 回答：\n1. `\\n`\n2. 关闭它\n3. `write`\n4. `readlines`\n\n## 异常\n\n有时会发生意外情况，导致程序无法按预期执行。这些事件被称为“异常”。\n\
  \n`>>> 1 / 0`\n\n按下回车键后，你将看到以下输出：\n\n```python\nTraceback (most recent call last):\n\
  \  File \"<stdin>\", line 1, in <module>\nZeroDivisionError: division by zero\n\
  ```\n\n这被称为异常回溯（traceback）。它显示了在异常发生之前调用了哪些函数或方法。最后一行告诉你引发了哪种异常，并提供了一些额外的、人类可读的信息。\n\
  \n在 Python 中，你可以通过 `try/except` 块来实现这一点。\n\n### 如果在重要操作中间发生了异常怎么办？\n\n让我们打印“除以零。但这完全没关系。”而不是抛出回溯。\n\
  \n```python\n1. try:\n2. 1 / 0\n3. except ZeroDivisionError as e:\n4. print(str(e)\
  \ + “. But it is totally fine.”)\n```\n\n在上面的代码中，你可以看到想要尝试执行的语句进入了 `try` 块。所有的错误处理代码都位于\
  \ `except` 下方。\n\n`except` 关键字必须跟一个异常类。它后面也可以跟一个 `as` 关键字和一个变量，该变量用于存储错误的人类可读描述。\n\
  \n### 自定义异常\n\n你可以定义自己的异常类，以进一步通知代码内部发生了某些非寻情况：\n\n```python\n1. class YourException(Exception):\n\
  2. pass\n```\n\n所有自定义异常都必须有一个内置的 Python 异常作为父类。异常不需要实现任何其他逻辑。\n\n为了抛出异常，你应该使用 `raise`\
  \ 关键字：\n\n```python\n1. raise YourException(“Human-readable message”)\n```\n\n一旦执行了上面的代码，你将看到一个带有“Human-readable\
  \ message”字符串作为额外细节的回溯。\n\n处理自定义异常与处理内置异常没有区别：\n\n```python\n1. try:\n2. raise YourException(“Human-readable\
  \ message”)\n3. except YourException as e:\n4. print(“Your exception just occured\
  \ with a message: “ + str(e))\n```\n\n### 测验\n\n问题：\n1. 哪个块应该被用来处理异常？\n2. 发生异常时打印的长文本块称为什么什么？\n\
  \n## 回答：\n1. `try/except` 块\n2. `traceback`\n\n![](img/00026.jpeg)\n\n## 导入语句、Python\
  \ 模块和包\n\n正如你可能注意到的，Python 中所有的源代码都存储在称为模块（modules）的不同文件中。每个模块都有 `.py` 扩展名。不同的模块在逻辑上组合在一起形成被称为包（packages）的集合。包是一个带有\
  \ `__init__.py` 文件的普通文件夹。\n\n例如，以下是一个包：\n```\n1. foobar/\n2. __init__.py\n3. one.py\n\
  4. two.py\n5. three.py\n```\n\n而这个不是：\n```\n1. foobar/\n2. one.py\n3. two.py\n4.\
  \ three.py\n```\n\n默认的 Python 安装带有大量的包。\n这组包被称为标准库（standard library）。\n\n### 导入语句\n\
  \n如果你想使用存储在另一个包中的功能，你必须使用 `import` 语句。\n\n让我们使用 Python 解释器在屏幕上打印你的用户名：\n\n```python\n\
  >>> import getpass\n>>> getpass.getuser()\n‘gunther’\n```\n\n上面的代码显示了如何导入最顶层的包。如你所示，包的成员应该通过点运算符（dot\
  \ operator）访问。\n\n你可以通过直接导入你需要的内容来避免使用点运算符：\n\n```python\n>>> from getpass import\
  \ getuser\n>>> getuser()\n‘gunther’\n```\n\n要指定导入的来源，必须使用 `from` 关键字。\n\n有时你可能想使用同一个包中的多个实体。在这种情况下，直接导入所有实体更为简单：\n\
  \n```python\n>>> from sys import pydebug, flags\n```\n\n注意，保留在 Python 包内部的实体可以是几乎任何\
  \ Python 构造。类、函数、变量、模块甚至可以是包（嵌套包是可能的）。\n\n### 测验\n\n问题：\n1. Python 源文件的同义词是什么？\n\
  2. 带有 Python 模块的文件夹术语是什么？\n3. 与默认 Python 安装一起提供的包集合称为什么什么？\n4. 如何从 `os` 包导入模块路径？\n\
  \n## 回答：\n1. module\n2. package\n3. standard library\n4. `from os import path`\n\
  \n## 使用 os 模块进行文件操作\n\n尽管可以使用内置的 Python 函数和方法处理文件，但它们并没有涵盖你在操作计算机文件系统时可能遇到的所有场景。\n\
  \n本章概述了你在处理数据时在底层可能遇到的所有常见任务，以及 Python 管理这些任务的手段。\n\n简要说明：下面的某些示例使用了 Linux 的路径结构。要在\
  \ Windows 上运行它们，请将正斜杠（`/`）替换为反斜杠（`\\`）。\n\n首先，假设你有了如下结构：\n\n```\n/parent/\n    foo/\n\
  \      one.txt\n      two.txt\n      three.txt\n```\n\n首先进入 `foo` 目录：\n\n```bash\n\
  cd parent\n```\n\n为了验证目录是否如我们预期的，使用 `os.path` 模块的 `abspath` 函数和 `curdir` 属性：\n\n\
  ```python\n>>> from os.path import abspath, curdir\n>>> curdir\n‘.’\n>>> abspath(curdir)\n\
  ‘/parent’\n```\n\n`curdir` 变量包含一个指向当前目录的字符串。为了删除 `one.txt` 并重命名 `two.txt`，你需要标准库中的两个函数：`remove`\
  \ 和 `rename`。\n\n```python\n>>> from os import remove, rename\n>>> remove(“foo/one.txt”)\n\
  >>> rename(“foo/two.txt”, “foo/bar.txt”)\n```\n\n### 使用 os 模块的文件操作\n\n正如你可能注意到的，提供文件名时必须提供相对路径或绝对路径。对于绝对路径，一切都很简单——它应该从文件系统的根目录（root）开始。绝对路径在\
  \ UNIX 和 Windows 上分别如下：\n\n`/Blah/Blah/one.txt`\n`C:\\Blah\\Blah\\one.txt`\n\n相对路径是根据当前目录计算的。假设你在\
  \ `/foo/bar/one` 目录并并移动到 `/foo/two`。在这种情况下，相对路径应该是 `../../two`。两个点表示父目录。由于你需要向上移动两级，因此需要\
  \ `../../` 序列。\n\n由于 Linux 和 Windows 使用不同的分隔符，上面的代码有一个严重的缺陷。它不是跨平台的。\n\n为了将其转换为通用，你应该使用\
  \ `os.path` 模块中的 `join` 函数：\n\n```python\n>>> from os import remove, rename\n>>>\
  \ from os.path import join\n>>> remove(join(“foo”, “one.txt”))\n>>> rename(join(“foo”,\
  \ “two.txt”), join(“foo”, “bar.txt”))\n```\n\n你将路径的所有部分作为字符串传递给 `join` 函数，然后使用特定的路径分隔符生成字符串。\n\
  \n你可以列出特定目录下的所有文件和文件夹：\n\n```python\n>>> from os import listdir\n>>> listdir(“foo”)\n\
  [“bar.txt”, “three.txt”]\n```\n\n现在尝试删除 `foo` 目录：\n\n```python\n>>> from os import\
