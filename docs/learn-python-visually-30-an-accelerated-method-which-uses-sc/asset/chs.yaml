  ```python\n1. ages.pop('Matt')\n```\n\n### 循环\n\n集合可以用于存储数据，你也可以遍历它们并对每个元素单独进行操作。\n\
  \n在 Python 中，有两种类型的循环可以使用：`while` 和 `for`。\n\n`while` 循环只要特定条件为真就会持续重复。\n\n`while`\
  \ 循环内部的语句必须缩进，就像其他其他代码块一样。\n\n循环必须使用 `while` 关键字、布尔语句和冒号来定义。\n\n布尔语句可以是函数调用、变量或比较语句。\n\
  \n![](img/00023.jpeg)\n\n这段代码将打印数字 1 到 10\n```python\n1. aps = 0\n2. while aps <\
  \ 10:  #测试\n3. aps += 1        #计数器\n4. print(aps)      #语句 1\n5. print (\"and\"\
  )    #语句 2\n6. print (\"Done\")   #循环退出\n```\n\n### While\n\nPython 提供了 `break`\
  \ 和 `continue` 语句来对循环进行细细控制。\n\n![](img/00024.jpeg)\n```python\n1. while <test1>:\n\
  2. <statement1>\n3. if <test2>: break  #循环退出，跳过\n4. if <test3>: continue #跳转到顶部\
  \ <test1>\n5. else:\n6. <statement2>\n```\n\n### 循环\n\n![](img/00025.jpeg)\n\n你可以使用\
  \ `for` 循环遍历集合。假设你有以下列表：\n\n```python\n1. a = [\"one\", \"two\", \"three\"]\n```\n\
  \n为了打印每个字符串，可以使用此循环：\n\n```python\n1. for item in a:\n2. print(item)\n```\n\n循环必须使用\
  \ `for` 关键字、持有每个元素的变量名、`in` 关键字、集合名称和冒号来定义。`for` 循环内部的语句必须缩进。\n\n你可以使用 `break` 命令退出循环：\n\
  \n```python\n1. numbers = [1, 2, 5, 6, 7, 8, 9]\n2. for number in numbers:\n3. print(\"\
  Looking at: \" + str(number))\n4. if number > 6:\n5. print(\"Too big: \" + str(number)\
  \ + \"!\")\n6. break\n```\n\n上述代码将输出：\nLooking at: 1\nLooking at: 2\nLooking at:\
  \ 5\nLooking at: 6\nToo big: 7!\n\n迭代在 7 处停止，这意味着 8 和 9 没有包含。\n\n你也可以使用 `continue`\
  \ 关键字跳过集合中的特定元素：\n\n```python\n1. numbers = [1, 6, 7, 8, 9, 2, 5]\n2. for number\
  \ in numbers:\n3. if number > 6:\n4. continue\n5. print(\"Looking at: \" + str(number))\n\
  ```\n\n上述代码输出：\nLooking at: 1\nLooking at: 6\nLooking at: 2\nLooking at: 5\n\n这里我们忽略了\
  \ 7, 8 和 9。\n\n字典可以用相同的方式遍历。\n\n```python\n1. ages = {\n2. \"John\": 34,\n3. \"\
  Matt\": 23,\n4. \"Natasha\": 27,\n5. \"Gabriella\": 33\n6. }\n7. for name in ages:\n\
  8. print(name)\n```\n\n### 测验\n\n问题：\n1. 如果你想编写每分钟触发一次报警的代码，你应该使用 `for` 还是 `while`\
