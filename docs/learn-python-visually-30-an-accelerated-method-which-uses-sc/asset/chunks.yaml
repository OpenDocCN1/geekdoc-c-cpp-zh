    ### Basic Math


    Python has a bunch of built-in arithmetic operators. The table below provides
    a brief comparison of the short notations and their longer equivalents.


    Assume that initially the following is true: `a = 3`.


    | Operation name | Short notation | Long notation | Value of a | Comment |

    | --- | --- | --- | --- | --- |

    | Addition | `a += 1` | `a = a + 1` | 4 | |

    | Subtraction | `a -= 1` | `a = a - 1` | 2 | |

    | Multiplication | `a *= 2` | `a = a * 2` | 6 | |

    | Division | `a /= 2` | `a = a / 2` | 1.5 | Returns decimal values or float numbers
    |

    | Modulo | `a %= 2` | `a = a % 2` | 1 | Returns an integer remainder of a division
    |

    | Exponent | `a **= 2` | `a = a ** 2` | 9 | Similar to a^2 in regular maths |

    | Floor division | `a //= 2` | `a = a // 2` | 1 | Returns only decimal (int) values
    |

    | Negation | `a = -a` | `a = 0 -a` | -3 | Returns the same value with an opposite
    sign |


    Finding the square root of a number is also easy in Python, but it’s not a built-in
    language feature. You’ll find out about it later in the book!


    You can calculate the absolute value of a digit (e.g. `|-3|`), using `abs()`.
    For example `abs(-3)` returns 3.


    ### Operators precedence


    The order of execution of mathematical operations in Python is similar to the
    order used in mathematics. In maths there are three priority levels:

    1. exponents and roots

    2. multiplication, division and modulus

    3. addition and subtraction


    Exponents and roots are represented by functions of a standard library and are
    covered further on this book (images/00011.jpeg).


    All other priority levels have their own built-in operators. Higher order operations
    are performed before the lower ones. All the operations of the same order are
    executed one one from left to right. For example, the statement `2 + 3 * 4` returns
    `13`. The multiplication is performed before the addition.


    In order to affect the order of execution, you should use parentheses `()`. For
    example `(3 + 6) * 2` equals `18` and `8 / (1 + 1)` equals `4`.


    ### Code Samples


    The code snippet below shows how simple maths are processed in the interpreter.


    ```python

    >>> 13 * 2

    26

    >>> 10 - 3

    2

    >>> 11 % 10

    1

    >>> 6 ** 2

    36

    >>> 12 / 8

    1.5

    >>> 12 % 8 + (12 // 8)

    12

    >>> 6 - -16

    22

    >>> a = 16

    >>> a += 3

    19

    >>> a = 4

    >>> b = 6

    >>> a *= b

    24

    ```


