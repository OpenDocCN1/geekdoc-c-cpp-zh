    }))`\n8. `# Set correct mimetype`\n9. `response.mimetype = \"application/json\"\
    `\n10. `return response`\n11. `if __name__ == \"__main__\":`\n12. `app.run(debug\
    \ = True)`\n\nUntil now, all of the pages would return simple text.\n\nFlask would\
    \ automatically transform this string into an HTTP response, and would give it\
    \ the mimetype `text/html` along with a status code 200.\n\nNow let’s modify this\
    \ behavior.\n\nThis code returns a JSON object.\n\nWe can also change the error\
    \ code:\n\n1. `...`\n2. `@app.route(\"/error\")`\n3. `def error_page():`\n4. `response\
    \ = make_response(\"Error Page\")`\n5. `response.status_code = 404`\n6. `return\
    \ response`\n7. `...`\n\n## Quiz\n\n### Problem:\n1. What is Flask and what should\
    \ you use it for?\n2. Why is Flask called a microframework?\n3. What is the default\
    \ port for the Flask integrated HTTP server?\n4. Can you cite most frequently\
    \ used HTTP methods?\n5. Consider the following code snippet:\n```python\n@app.route(\"\
    /error\")\ndef error_page():\n    return \"Error Page\"\n```\n\n### Answer:\n\
    1. Flask is a microframework for Python used to create web applications.\n2. It\
    \ keeps its core simple. New functionality must be added via extensions.\n3. 5000\n\
    4. GET, POST, HEAD, PUT and DELETE\n5. 200. Do not be fooled by the error name.\
    \ You did nothing to change the status code.\n\n## Exercises\n\n### Problem:\n\
    Imagine you want to create a small discussion page for your website to let your\
    \ users post and read messages. Messages are sorted in descending order, so the\
    \ most recent message is displayed first.\n\nYour website is so popular that soon\
    \ there are too many messages to be displayed! You decide to limit the number\
    \ of messages per page to 50, and add “next” and “previous” buttons to navigate\
    \ between pages. Can you create a script to display the first and last post on\
    \ a given page?\n\n### Sample Answer:\n```python\n...\n@app.route(\"/posts\")\n\
    @app.route(\"/posts/<int:page_nb>\")\ndef show_posts(page_nb=1):\n    first_msg\
    \ = 1 + 50 * page_nb\n    last_msg = first_msg + 49\n    return \"Messages {}\
    \ to {}\".format(first_msg, last_msg)\n...\n```\n\nNotes:\n* set a default value\
    \ for the variable `page_nb` so that routes `/posts` and `/posts/1` are equivalent.\n\
    * force `page_nb` to be of type `int` the decorator so that a route `/posts/something`\
    \ would return a 404 error.\n\n## Files and Directories\nWorking with files and\
    \ directories can rapidly grow into a tedious and consuming task. Python offers\
    \ convenient methods to help you walk directories and perform operations on files.\n\
