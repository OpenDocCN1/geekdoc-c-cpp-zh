    # 字典


    字典是键和值的集合，其工作方式与列表或元组非常相似。字典的值不使用整数索引，而是可以通过几乎任何类型的索引来访问。


    让我们创建一个以人名为键、年龄为值的字典：


    ![](img/00022.jpeg)


    ```python

    1. ages = {

    2. "John": 34,

    3. "Matt": 23,

    4. "Natasha": 27,

    5. "Gabriella": 33

    6. }

    ```


    键值值对必须包含在花括号中，并用逗号分隔。键和值之间必须用冒号分隔。


    字典中的键必须是唯一的，但值可以是相同的。键可以是几乎任何类型的变量。


    以下也是一个有效的字典：


    ```python

    1. class SomeClass:

    2. pass

    3. obj1 = SomeClass()

    4. obj2 = SomeClass()

    5. a_dict = {

    6. obj1: 11,

    7. obj2: 23

    8. }

    ```


    你可以通过以下方式获取 John 的年龄：


    ```python

    1. johns_age = ages["John"]

    ```


    同样，你可以通过键来设置元素的值：


    ```python

    1. ages["John"] = 999

    ```


    上述语句要么更改现有键的值，要么在不存在该键时创建一个新的键值对。


    你也可以从字典中删除一个键值值对。


    ```python

    1. ages.pop("John")

    ```


