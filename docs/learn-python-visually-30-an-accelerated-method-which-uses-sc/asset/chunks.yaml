    2.  from urllib.request import urlopen\n\n3.  import io\n\n4.  response = urlopen(“http://a/b/c.jpg”)\n\
    \n5.  im_file = io.BytesIO(response.read())\n\n6.  im = Image.open(im_file)\n\n\
    7.  im = im.rotate(90)\n\n8.  im = im.resize((800, 600))\n\n9.  im.save(“downloaded_image.jpg”, “JPEG”)\n\
    \nThe script below downloads a picture from a given url, rotates it, resizes it,\
    \ and saves it locally.\n\nNote, io.BytesIO is used to wrap the buffer into a\
    \ proper file-like object.\n\nThe following code creates a 128x128 thumbnail from\
    \ a JPEG image:\n\n1.  from PIL import Image\n\n2.  size = 128, 128\n\n3.  filename = “image.jpg”\n\
    \n4.  im = Image.open(filename)\n\n5.  im.thumbnail(size, Image.ANTIALIAS)\n\n\
    6.  im.save(filename + “.thumbnail”, “JPEG”)\n\nDirectory cleanup\n\nLet’s imagine\
    \ that you need to clean up a directory and remove all files from before 2002\\\
    . Each file within this directory is a text document (.txt) whose first line is\
    \ a date (yyyy-mm-dd).\n\n1.  import os\n\n2.  import time\n\n3.  count = 0\n\n\
    4.  kept = 0\n\n5.  deleted = 0\n\n6.  for (root, dirs, files) in os.walk(‘.’):for filename in files:\n\
    \n7.  if filename.endswith(‘.txt’):\n\n8.  f = open(filename, ‘r’)\n\n9.  sdate = f.readline();\n\
    \n10.  f.close()\n\n11.  pdate = time.strptime(sdate, ‘%Y%-m%-d\\n’)\n\n12.  if pdate.tm_year > 2002:\n\
    \n13.  kept += 1\n\n14.  else:\n\n15.  os.remove(filename)\n\n16.  deleted += 1\n\
    \n17.  count += 1\n\n18.  print(‘Total files: ‘ + str(count))\n\n19.  print(‘Kept: ‘ + str(kept))\n\
    \n20.  print(‘Deleted: ‘ + str(deleted))\n\nThe code above does the following\
    \ 4 things:\n\n1.  Imports the necessary modules.\n\n2.  Uses the “walk” method\
    \ to navigate the current directory.For each text file in our directory a. Open\
    \ file b. Read date using f.readline() c. Convert string date into Python object\
    \ d. If date is before 2002 the file is deleted\n\n3.  For each text file in the\
    \ directory:\n\n    a. Open the file.\n\n    b. Read the date using f.readline().\n\
    \n    c. Convert the date from a string to a Python object.\n\n    d. Delete the\
    \ file if the date is before 2002."
