    \n```python\ndef tell_what_to_do(age):\n    if person_is_old(age):\n        print(\"\
    You deserved to have a long vacation\")\n    else:\n        print(\"Go to work!\"\
    )\n```\n\n## Classes and objects\n\nOne of the key principles of object-oriented\
    \ programming is encapsulation - hiding the details of the inner workings of the\
