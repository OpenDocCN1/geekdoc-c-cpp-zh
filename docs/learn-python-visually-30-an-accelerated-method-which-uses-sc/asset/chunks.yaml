- fmt: "\n![](cover.jpeg)\n\n# Thank You!\n\nA book takes many people working together\
    \ to make it a reality. So, to all the Kickstarter backers that helped me complete\
    \ this project I wish to express a big ‘Thank You’ and I hope we can do more great\
    \ things in the future.\n\n![](images/00001.jpeg)\n\nAnthony Storms Akins\nAlan\
    \ Prak\nAlessandro\nAndy Lee\nBill Stull\nBrandon Thompson\nCharles Rogers\nClément\
    \ Labadie\nDemian Vonder Kuhlen\nEdgar Rodriguez\nGordon\nGreg_Vee\nGregory Pfrommer\n\
    Gregory R. Kinnicutt\nJ.T. O’Gara\nJanakan\nJeff\nJoe\nJoshua Bauder\nMarco Randall\n\
    Marshall Walker\nNeer Patel\nNigel J Allen\nPadrao\nPerry Yap\nR.C. Lewis\nRandy\
    \ Morris\nRowan Knight\nSebastian Lange\nShahid Ali Shah\nShrawan\nStan Spears\n\
    \n## Credits & Legal\n\n### AUTHOR\n* Ivelin Demirov\n\n### Editors\n* Anton Berezin\n\
    * Beth McMillan\n\n### Page design\n* Jordan Milev\n\n### Illustrator\n* Ivelin\
    \ Demirov\n\n### Proofreader\n* Beth McMillan\n\n### ACKNOWLEDGMENT\nI must acknowledge\
    \ the help of the online Python community, who have toiled in the background for\
    \ many years to help make Python the exciting programming language it has become.\n\
    \n### COPYRIGHT\n©2015 Ivelin Demirov\n\n### notice of rights\nAll rights reserved.\
    \ No part of this book may be reproduced in any form, by any means without the\
    \ written permission of the publisher or the author.\n\n### trademarks\nAll trademarks\
    \ are held by their respective owners.\n\n### notice of liability\nThe information\
    \ in this book is distributed on an “As Is” basis, without warranty. While every\
    \ precaution has been taken in the preparation of the book, neither the author\
    \ nor the publisher shall have any liability to any person or entity with respect\
    \ to any loss or damage caused or alleged to be caused directly or indirectly\
    \ by the instructions contained in this book or by the computer software and hardware\
    \ products described in it.\n\n### Paperback ISBN\n* ISBN-13: 978-1507727072\n\
    * ISBN-10: 1507727070\n\n### contacts\npythonvisually.com\n\n## About this book\n\
    \n### The Problem\nPeople cannot be blamed for thinking programming is hard when\
    \ trying it out for the first time. Learning to program is like learning a new\
    \ language.\n\nA number of rules and grammar syntax guidelines exist to follow.\
    \ It also requires memorizing a bevy of glossary terms for each language, and\
    \ unless a person works with programming at least 8 hours a day, the person is\
    \ unlikely to become very familiar with programming quickly; at least, that has\
    \ been the situation for years until now.\n\n### The Methodology\nOur approach\
    \ involves teaching programming concepts via simple illustrations.\n\nThe visual\
    \ approach works because it is one of the most fundamental ways of learning. Everyone\
    \ as a baby and toddler learns the world around them via sight and sound long\
    \ before there is comprehension associated with letters and meanings.\n\nProgramming\
    \ works in modules and building blocks. As a person learns a few basic modules\
    \ and steps, he can then learn to build more complex modules on those first basic\
    \ units.\n\nIt’s a building block approach where bigger structures can be coded\
    \ once the basic modules are mastered. I start with a set of basic building blocks\
    \ that are easy to learn through illustrations and metaphors.\n\nFrom there, a\
    \ user can apply multiple variations and build further. However, the initial set\
    \ of building blocks becomes a Rosetta stone of sorts, allowing a user to program\
    \ and build in any situation going forward.\n\n### Why Python?\nWhen you embark\
    \ on your computer science journey at college, you’ll probably start by learning\
    \ Python.\n\nSo why choose Python over any other programming language? It’s simple:\n\
    \n* Regardless of your operating system, Python is easy to set up.\n* Python code\
    \ uses plain English, making it easy to understand.\n* Python will let you run\
    \ bad code.\n    * **Why is this good?**\n    When you’re learning you’re bound\
    \ to make mistakes. Python tells you what the error is after you run the code,\
    \ helping you to find the problem.\n* Python is a very powerful tool, but it’s\
    \ also easy and fast to learn, which is why most people prefer it.\n\n### Installation\n\
    There are pre-compiled packages made for easy installation on multiple operating\
    \ systems such as Windows, Linux, UNIX and Mac OS to name but a few.\n\nIf you\
    \ head over to `https://www.python.org/downloads/` you can select the right installation\
    \ method for your operating system. Most Linux systems come with Python pre-installed.\n\
    \nVersion 3 of Python is used in this book.\n\nIn Windows, once you have installed\
    \ Python, select `Python IDLE` or `Python command line/console` from the Start\
    \ menu or screen.\n\nThe difference between the IDLE and the console is that the\
    \ IDLE has a graphical interface, which looks similar to a text editor. In Linux,\
    \ UNIX, and OS X, you can launch Python emulator from command line by typing `Python`.\n\
    \nTo choose a specific version of Python type `PythonX` where `X` is the version\
    \ number (e.g. “Python3” for version 3).\n\n![](images/00002.jpeg)\n\n## Hello\
    \ World!\nMost of the time that you write Python code, you will be writing the\
    \ script in the IDLE or any other IDE like Eclipse or rich text editor like Sublime\
    \ text or Notepad++. However, you can use the Python interpreter to write code\
    \ interactively as it acts like a UNIX shell.\n\nEven though it is possible to\
    \ create programs using just the interpreter it is strongly recommended not to\
    \ do so since it is hard to save the code as a script for further reuse. Rather\
    \ consider the interpreter as an “on the fly” testing tool for your coding ideas.\n\
    \nNow lets make the interpreter output “Hello World!”.\n\n```\nprint(\"Hello World!\"\
    )\n```\n\n### Terminal way\nLaunch the interpreter from command line using `python`\
    \ command as it was described in the previous chapter. Type the following:\n\n\
    ```python\nprint(\"Hello world!\")\n```\n\nThe terminal shall look the following:\n\
    \n![](images/0004.jpeg)\n\nIn the code snippet above you can see that the first\
    \ line starts with `>>>`. This symbol indicates the line where you provide input\
    \ to the interpreter. Notice, as soon as the result of your first command was\
    \ printed on the screen the interpreter printed `>>>` again. Giving instructions\
    \ to the interpreter is sequential. You give one instruction - you wait till execution,\
    \ you enter another command and so on.\n\nNote, further on this book if you spot\
    \ `>>>` symbol in a code snippet it shall mean that you are expected to test the\
    \ code in the interpreter.\n\nOn the first line you entered a statement. The statement\
    \ is nothing but an instruction for a computer to perform some task. The task\
    \ could be anything from `make_a_coffee` to `launch_a_rocket`. In your case it\
    \ is a simple `print` function. Functions will be covered further in this book.\n\
    \n### Scripting Way\nOne of the main principles of software engineering is reusability.\
    \ Let’s make the code that was just tested in the interpreter reusable.\n\nTo\
    \ do so, create a file called `hello_world.py` and type the following text inside:\n\
    \n```python\nprint(\"Hello World!\")\n```\n\nWhat you placed into the file is\
    \ exactly the line that was previously executed via the interpreter. Now lets\
    \ execute the script that you wrote. Open the command line, navigate to the location\
    \ where the script resides and type the following:\n\n```bash\npython hello_world.py\n\
    ```\n\nAfter you hit enter you shall see that a “Hello World!” text was placed\
    \ on the screen. Congratulations! You’ve managed to write your first Python program\
    \ and successfully launch it.\n\n![](images/00005.jpeg)\n\n### Variables\nIn Python,\
    \ a variable can be used to store the output of a statement in the computer’s\
    \ memory.\n\n![](images/00006.jpeg)\n\nThe equals sign is used to assign a value\
    \ to a variable. The name of the variable is called its identifier.\n\n![](images/00007.jpeg)\n\
    \n![](images/00008.jpeg)\n\n```python\n>>> a is b\nTrue\n>>> print(id(a))\n12312323\n\
    >>> print(id(b))\n12312323\n```\n\nYou may assign the same value to multiple variables\
    \ using the following syntax:\n\n```python\n>>> a = b = c = d = f = \"Hello World!\"\
    \n>>> a\nHello World!\n>>> c\nHello World!\n```\n"
