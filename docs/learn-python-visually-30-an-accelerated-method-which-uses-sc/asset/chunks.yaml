    ### String operations


    Words and sentences are collections of characters, and so are Python strings.
    You can access any character in a Python string using its index, either counting
    from the beginning or the end of the string. When you start from the beginning,
    you count from 0.


    ![](images/00012.jpeg)


    In Python integer indices are zero based.


    ```python

    >>> name = "My Name is Mike"

    >>> name[0]

    ''M''

    >>> name[1]

    ''y''

    >>> name[9]

    ''s''

    >>> name[-1]

    ''e''

    >>> name[-15]

    ''M''

    >>> name[7]

    '' ''

    ```


    ### Slicing


    You can take shorter substrings from inside a longer string. This operation is
    called `slicing`.


    ```python

    >>> name[11:14] # from 11th to 14th, 14th is excluded

    ''Mik''

    >>> name[11:15] # from 11th to 15th, 15th is excluded

    ''Mike''

    ```


    If you want to check if a string contains a particular substring, you can use
    the `in` operator.


    ```python

    >>> "B" in "Foo"

    False

    >>> "B" not in "Foo"

    True

    >>> "G" in "Gohl"

    True

    >>> "James" in "James is tall"

    True

    ```


    The `len` function calculates the length of a string.


    ```python

    >>> len(name)

    15

    ```


