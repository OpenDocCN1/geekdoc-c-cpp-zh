    \ 的值是什么？\n3. 哪个字符串代表当前目录的父目录？\n\n### 答案：\n1. 不同的路径分隔符：Unix 使用 `/`，而 Windows 使用\
    \ `\\`\n2. `.`\n3. `. .`\n\n## 练习\n\n### 问题：修复上一个示例中的 `rmdir` 代码使其能够工作。\n\n###\
    \ 答案：\n要做到这一点，你只需要先删除所有的文件：\n```python\n>>> remove(\"foo/bar.txt\") # 你重命名了它\n\
    >>> remove(\"foo/three.txt\")\n>>> rmdir(\"foo\")\n```\n\n## 练习\n\n### 问题：使以下函数具有跨平台：\n\
    1. `def show_foobar_here(path):`\n2. `print(path + \"/foobar\")`\n\n### 答案：\n\
    1. `from os.path import join`\n2. `def show_foobar_here(path):`\n3. `print(join(path,\
    \ \"foobar\"))`\n\n## 练习\n\n### 问题：使用 `os.path` 模块中的 `isdir` 函数找到当前目录下的文件夹。\n\
    遍历文件和文件夹，然后抛出一个自定义的 `DirFound` 异常，并将目录的绝对路径作为可读的描述。\n\n### 答案：\n以下方案是充分的：\n```python\n\
    from os.path import isdir, curdir, abspath\nfrom os import listdir\nclass DirFound(Exception):\n\
    \    pass\n\ndef detect_dirs():\n    for item in listdir(curdir):\n        if\
    \ isdir(item):\n            raise DirFound(abspath(item))\n```\n\n## 正正则表达式\n\n\
    虽然你可以使用 `in` 运算符来检查字符串中是否存在子字符串，但它不会告诉你子字符串的位置，也不会让你能够非精确地匹配子字符串。\n\n看这个字符串：\n\
    ```python\n>>> lorem_text = \"Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\"\n\
    ```\n你想找出这段文本是否包含类似“dolor BLA BLA BLA amet”的内容——即单词按顺序出现“dolor”和“amet”，之间可以有任意长度的文本。\n\
    \n要实现这一点，你可以使用 `re.search` 方法：\n```python\n>>> import re\n>>> found = re.search(\"\
    dolor .*amet\", lorem_text)\n>>> found\n<_sre.SRE_Match object; span=(12, 26),\
    \ match='dolor sit amet'>\n```\n`search` 函数接受正则表达式模式作为第一个参数，并将要搜索的文本作为第二个参数。\n\
    \n正则表达式模式是对你在文本中要查找内容的灵活描述。其格式将在本章稍后介绍。\n\n查看 `search` 函数的返回值：它被称为 `MatchObject`（匹配对象），它会告诉你子字符串在原始文本中的位置。\n\
    \n如果找不到模式，该函数将返回 `None`：\n```python\n>>> match = re.search(\"found\", lorem_text)\n\
    >>> type(match)\n<class 'NoneType'>\n```\n你可以从匹配对象获取子字符串的起始和结束索引：\n```python\n\
    >>> found.start()\n12\n>>> found.end()\n26\n```\n并访问由模式匹配的子字符串：\n```python\n>>>\
    \ found.group()\n'dolor sit amet'\n>>> lorem_text[12:26]\n'dolor sit amet'\n```\n\
    注意：如果发现了多次匹配模式，只返回第一个。如果你需要遍历所有出现的地方，请使用 `re.finditer` 函数：\n```python\n>>> list(re.finditer(\"\
    dolor .*amet\", lorem_text))\n[<_sre.SRE_Match object; span=(12, 26), match='dolor\
    \ sit amet'>]\n```\n如果你想检查一个字符串是否匹配特定模式，应该使用 `re.match` 函数，它尝试将模式应用于整个字符串：\n```python\n\
    >>> bool(re.match(\"[0-9][a-z]*\", \"0dgfgfg\"))\nTrue\n>>> bool(re.match(\"[0-9][a-z]*\"\
    , \"dgfgfg\"))\nFalse\n```\n正则表达式模式中的符号 `.*` 匹配零或多个任意字符。点代表任意字符，星号代表次数（基数）。这是任何正则表达式模式的基本结构：一个符号类型，后跟其次数。\n\
    \n下表提供了最常用次数的概览。\n\n| 次数 | 描述 |\n| :--- | :--- |\n| `*` | 零或多个 |\n| `+` | 一个或多个\
    \ |\n| `?` | 零或一个 |\n| `{m}` | 符号的精确数量 |\n| `{m, n}` | 最少 m 最多 n |\n\n这些是记忆其中一些的方法：\n\
    ```python\n>>> import re\n>>> print(re.search('^', 'Beginning of line'))\n>>>\
    \ print(re.search('line$', 'Beginning of line'))\ntxt = \"The quick brown fox\
    \ jumps over the lazy dog\"\n```\n\n正则表达式\n此表显示了最常用的符号。\n\n| 符号 | 描述 |\n| :---\
    \ | :--- |\n| `.` | 任意字符 |\n| `\\\"` | 双引号 |\n| `'` | 单引号 |\n| `\\\\` | 反斜杠 |\n\
    | `\\t` | 制表符 |\n| `\\n` | 换行符 |\n| `[0-9]` | 数字 |\n| `[a-z]` | 小写字母 |\n| `[A-Z]`\
    \ | 大写字母 |\n| `[a-zA-Z]` | 字母 |\n| `[⁰-9]` | 非数字 |\n| `[^a-z]` | 非小写字母 |\n| `^`\
    \ | 行首 |\n| `$` | 行尾 |\n| `.*` | 任意多个字符 |\n| `.+` | 一个或多个字符 |\n| `.?` | 零或一个字符\
    \ |\n| `{m}` | 确定的次数 |\n| `{m, n}` | m 到 n 次 |\n| `{m,}` | 至少 m 次 |\n| `{0, n}`\
    \ | 最多 n 次 |\n\n正如你看到的，`math` 模块可以执行常见的数学运算。\n\n本章提供了 Python 标准库中 `math` 模块的概述。该模块包含了常见数学运算的实现，例如平方根，这些没有包含在标准函数中。\n\
    \n这是由于语言处理浮点数计算的方式。\n\n你可以获得特定精度的特殊数字，如 `pi` 和 `e`：\n```python\n>>> math.pi\n\
    3.141592653589793\n>>> math.e\n2.718281828459045\n```\n\n你也可以计算平方根：\n```python\n\
    >>> math.sqrt(16)\n4.0\n```\n\n使用 `math` 模块你可以执行常见的三角运算：\n```python\n>>> math.sin(math.radians(30))\n\
    0.4999999999999999\n>>> math.cos(math.radians(60))\n0.5000000000000001\n>>> math.tan(math.radians(45))\n\
    0.9999999999999999\n```\n注意，参数是弧度的值而不是度。这就是为什么额外调用了 `math.radians`。\n此外，你看到 0.499999999\
    \ 而不是 0.5，或者 0.999999999 而不是 1。\n这是由于语言处理浮点数计算的方式。\n\n你可以获得特定精度的特殊数字，如 `pi` 和\
    \ `e`：\n```python\n>>> math.pi\n3.141592653589793\n>>> math.e\n2.718281828459045\n\
    ```\n\n你也可以计算平方根：\n```python\n>>> math.sqrt(16)\n4.0\n```\n\n"
- fmt: "\n```python\n>>> math.sqrt(25)\n5.0\n```\n\n## Quiz\n\nProblem: In order to\
    \ answer the following questions you need to dive into the standard library\n\n\
    1. What function would you use to calculate an arctangent?\n2. What function should\
    \ be used for exponentiation?\n3. How would you calculate a factorial of a number?\n\
    \n### Answers:\n\n1. `math.atan`\n2. `math.exp`\n3. `math.factorial`\n\n## JSON\n\
    \nIn software engineering there is a process called serialization. The main purpose\
    \ of it is to transform arbitrary object’s state into something that could be\
    \ be transfered over the wire and/or stored in such a manner that the original\
    \ object could be reconstructed later on. The process of reconstruction is called\
    \ deserialization.\n\nA real life analogy of serialization is the process of investigating\
    \ an existing artifact (e.g. a car) and making a detailed blueprint of it (engine,\
    \ wheels, transmission, etc). Sending serialized data over the wire is similar\
    \ to sending the blueprint over a normal mail. And deserialization is the process\
    \ of constructing a copy of the original object by someone based on the fetched\
    \ blueprints.\n\nIn the realm of web programming two standards of data serialization\
    \ gained highest popularity. XML and JSON. Both are textual which implies that\
    \ data represented using these standards can be easily viewed by a human-being\
    \ via a simple text editor like `VIM`. The subject of this chapter is JSON and\
    \ the means of Python to serialize data using it.\n\n`JSON` is a native way to\
    \ operate with data in JavaScript programming language.\n\nAs a format `JSON`\
    \ operates with three major constructs:\n\n1. Primitives: integers, floating point\
    \ numbers, strings, booleans and null datatype\n2. Objects: equivalents of Python\
    \ dictionaries\n3. Arrays: equivalents of Python lists\n\nAs you can see all JSON\
    \ constructs perfectly match Python built-in types. Thus the main purpose of serialization\
    \ of Python data structures into JSON is to transform Python built-in types into\
    \ a JSON string that could be e.g. sent as a payload inside of an HTTP request/response\
    \ body.\n\nBy default Python can serialize the following datatypes: `int`, `bool`,\
    \ `None`, `str`, `float`, `long`, `dict` and `list`. There are ways of extending\
    \ this functionality but they are out of the scope of this chapter.\n\nPython’s\
    \ module responsible for serialization is called `json`. It contains two major\
    \ functions: `dumps` and `loads`. `dumps` expects Python data structure as the\
    \ input and returns JSON string as the output. `loads` does the inverse - it expects\
    \ a JSON string as an input and returns Python data structure as an output.\n\n\
    ## Code Examples\n\n### Import JSON module\n1. `json`\n\n### Serialize a list\
    \ of strings into JSON array\n2. `list_of_strings = [\"one\", \"two\", \"three\"\
    , \"four\"]`\n3. `json_array = json.dumps(list_of_strings)`\n\n### Deserialize\
    \ a JSON object into a Python data structure\n1. `json_data = \"\"\"\n{\n  \"\
    integer\": 1,\n  \"inner_object\": {\n    \"nothing\": null,\n    \"boolean\"\
    : false,\n    \"string\": \"foo\"\n  },\n  \"list_of_strings\": [\n    \"one\"\
    ,\n    \"two\"\n  ]\n}\n\"\"\"`\n2. `python_dict = json.loads(json_data)`\n\n\
    ### Serialize an integer\n```python\nprint (json.dumps(1))\n1\nprint (type(json.dumps(1)))\n\
    <class 'str'>\n```\n\n### Code Samples\n\n### Serialize a string\n```python\n\
    >>> print(json.dumps(\"FOO\"))\n\"FOO\"\n>>> print(len(json.dumps(\"FOO\")))\n\
    5\n```\n\n### Try to deserialize something. that is not JSON - ValueError is raised\
    \ when the input can’t be processed\n```python\n>>> json.loads(\"FOO\")\nTraceback\
    \ ...\n...\nValueError: No JSON object could be decoded\n```\n\n### Try to serialize\
    \ something. that does not have a representation in JSON - only a limited set\
    \ of Python built-in types is supported by default\n```python\n>>> class Teacher(object):\n\
    \    pass\n>>> t = Teacher()\n>>> json.dumps(t)\nTraceback ...\n...\nTypeError:\
    \ <...Teacher instance at...> is not JSON serializable\n```\n\n## Quiz\n\nProblem:\n\
    1. Which function is responsible for JSON serialization in Python?\n2. What is\
    \ the antonym of “serialization”? Which Python function is responsible for it?\n\
    3. What is the output of this command: `print (json.dumps(\"FOO\")[0])`?\n4. What\
    \ is the output of this command: `print (len(json.dumps(None)))`?\n5. What is\
    \ the output of this command: `print (type(json.dumps('”1.57”)))`?\n\n### Answer:\n\
    1. `json.dumps`\n2. deserialization / `json.loads`\n3. `\"[1]\"`\n4. `4`\n5. `<type\
    \ ‘str’>`\n\n***\n\n## Exercises\n\nProblem: There is the following code:\nImplement\
    \ `join_two_arrays` function\n\n```python\n>>> array_of_strings = [\"one\", \"\
    two\"]\n>>> array_of_strings = [\"three\", \"four\"]\n>>> join_two_arrays(array_of_strings,\
    \ array_of_strings)\n['one', 'two', 'three', 'four']\n```\n\n```python\n>>> type(join_two_arrays(array_of_strings,\
    \ array_of_strings))\n<class 'list'>\n```\n\n### Answer:\n```python\ndef join_two_arrays(list1,\
    \ list2):\n    return list1 + list2\n```\n\nProblem: There is the following code:\n\
    Implement `json_if_already_json` function\n\n```python\n>>> class Teacher(object):\n\
    \    pass\n>>> t = Teacher()\n```\n\n### Answer:\n```python\ndef json_if_already_json(obj):\n\
    \    try:\n        return json.dumps(obj)\n    except TypeError:\n        return\
    \ obj\n```\n\n## SQL: sqlite3\n\nOne of the main principles of software development\
    \ is reusability. The principle can be rephased as DRY - Don’t Repeat Yourself.\
    \ The best way to achieve it is to avoid reinventing the wheel and apply the solutions\
    \ that were implemented before.\n\nOver the decades of industry development in\
    \ information processing and data storage, a common set of constraints has emerged.\
    \ In this context, the word “constraint” means a set of rules you apply to the\
    \ data.\n\nTo understand what constraints are think about an email address. The\
    \ address is expected to have an “@” character. This expectation is a constraint.\n\
    \nA real-life system with multiple constraints is an automobile assembly line.\
    \ All the parts are expected to fit certain criteria - if they don’t, it’s not\
    \ possible to fully automate the line, and you have to involve manual labor.\n\
    \nTo create a common system of constraints, the existing systems were combined\
    \ into what is now called a relational database.\n\nData are stored in the relational\
    \ database as tables, where each column represents a set of rules for what data\
    \ types (strings, ints, booleans, etc.) can be stored in each row.\n\nThe primary\
    \ key constraint defines which field should be used as the main index, i.e. which\
    \ piece of information in the row can be used as its address. A word index means\
    \ exactly the same thing as in post industry. In case of post it is the address\
    \ of a particular recipient, in case of relational database - a particular row\
    \ in the table.\n\n## SQL\n\nTo illustrate the meaning of referential integrity\
    \ it is the best to have a look at the following real life example.\n\nIf a student\
    \ were to leave a school to attend another school, their name must be removed\
    \ from the register in all of their classes. Similarly, if you want to remove\
    \ an item from a relational database, you must also remove all references to it\
    \ in the database.\n"
