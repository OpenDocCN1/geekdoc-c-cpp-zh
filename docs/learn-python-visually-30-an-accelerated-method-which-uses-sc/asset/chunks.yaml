  trans: "\n\n# 5. 无效：参数名中的符号 $\n\n## 练习\n\n**问题：** 修改下面的函数，使其返回问候语而不是打印它：\n\n```python\n\
    def hi():\n    greeting = \"Hello world!!!\"\n    print(greeting)\n```\n\n**答案：**\n\
    \n```python\ndef hi():\n    greeting = \"Hello world!!!\"\n    return greeting\n\
    ```\n\n## If/Else 和条件语句\n\n在书中目前为止，我们涵盖的简单语句和操作有很多用处。然而，任何编程的主要目的都是实现某种逻辑。\n\n\
    `if/else` 块是 Python 中的核心语法元素。它们允许你根据条件控制程序的执行流。\n\n在以下场景中，你想知道你的汽车是否行驶得太快。如果你的速度超过了\
    \ 100 km/h，函数将打印“太快了！”。如果你行驶速度低于限速，函数将打印“你的行驶速度低于限速。做得好。”\n\n代码看起来是这样：\n\n```python\n\
    def drive(car_speed):\n    if car_speed > 100:\n        print(\"Too fast!\")\n\
    \    else:\n        print(\"You are driving below the speed limit. Well done\"\
    )\n```\n\n`>>> drive(70)`\n`You are driving below the speed limit. Well done`\n\
    \n`>>> drive(120)`\n`Too fast!`\n\n上面的代码中有几点需要注意。\n\n首先，是 `>` 运算符。它是一个布尔比较运算符，与数学中使用的运算符相同。如果第一个项目大于第二个项目，它返回\
    \ `True`，否则返回 `False`。\n\n其次，是 `if/else` 语法。如果 `is_too_fast` 为 `True`，则执行第一块代码。否则，则执行第二块代码。\n\
    \n第三，是缩进。函数内部的语句被缩进，而 `if/else` 块内部的语句会进一步缩进。\n\n## 布尔表达式\n\n![](img/00016.jpeg)\n\
    \n```python\ngreenApple = 100\nredApple = 135\n\nprint(greenApple == redApple)\
    \      # 测试 100 和 135 是否相等\n#False\n\nprint(greenApple < redApple)       # 测试\
    \ 100 是否小于 135\n#True\n\nprint(greenApple != redApple)      # 测试是否不等\n#True\n\
    ```\n\n`>>> bool(1)`\n`True`\n\n`>>> bool(\"\")`\n`False`\n\n`>>> bool(None)`\n\
    `False`\n\n`>>> bool(\"blah\")`\n`True`\n\n`>>> bool(0)`\n`False`\n\n`>>> bool(True)`\n\
    `True`\n\n在 Python 中，任何值都可以被解释为 `True` 或 `False`。在数据类型中，值 `0`、`\"\"` - 空字符串、`None`\
    \ 以及 `False` 本身为 `False`。任何其他值都是 `True`。\n\n你可以通过将值转换为布尔类型来检查该值是 `True` 还是 `False`：\n\
    \n还有几个内置的比较运算符，如 `>`,>`在调用时会返回 `True` 或 `False`。下表提供了这些运算符的概述。\n\n| 运算符 | 语句 |\
    \ 语句的返回值 |\n| --- | --- | --- |\n| 小于 | `1 < 2` `4 < 3` | `True` `False` |\n|\
    \ 小于等于 | `2 <= 2` `4 <= 3` | `True` `False` |\n| 大于 | `2 > 1` `3 > 3` | `True`\
    \ `False` |\n| 大于等于 | `2 >= 2` `3 >= 4` | `True` `False` |\n| 等于 | `\"foo\" ==\
    \ \"foo\"` `0 == 1` | `True` `False` |\n| 不等于 | `\"foo\" != \"bar\"` `11 != (10\
    \ + 1)` | `True` `False` |\n| 与 (两部分必须为 True) | `3 and \"foo\"` `None and True`\
    \ | `True` `False` |\n| 或 (部分之一必须为 True) | `1 or None` `None or False` | `True`\
    \ `False` |\n| 非 (与目标表达式相反) | `not None` `not True` | `True` `False` |\n\n注意，比较运算符的优先级高于逻辑运算符\
    \ `and`、`or` 和 `not`。所有数学运算符的优先级都高于比较运算符。这里有几个复合示例说明了如何使用布尔运算符：\n\n`>>> 2 * 6\
    \ + 1 < 2 * (6 + 1)`\n`True`\n\n`>>> 2 * 6 + 1 == 2 * (6 + 1) - 1`\n`True`\n\n\
    `>>> 2 ** 3 == 8 and 2 ** 2 == 16`\n`False`\n\n`>>> (2 ** 2 == 4 and False) or\
    \ (not (16 < 15 or == 3))`\n`True`\n\n## 备选分支\n\n在很多情况下，逻辑可以比简单的两个条件更复杂。让我们修改创建的\
    \ `speed` 函数，使其在速度超过 200 km/h 时打印“你疯了，哥们！！”，并在速度在 70 到 80 km/h 之间时打印“这是你汽车的最佳速度”。\n\
    \n```python\ndef drive(car_speed):\n    if car_speed > 200:\n        print(\"\
    You are insane, man!!!\")\n    elif car_speed > 100:\n        print(\"Too fast!\"\
    )\n    elif car_speed > 70 and car_speed < 80:\n        print(\"The optimal speed\
    \ for your car.\")\n    else:\n        print(\"You are driving below the limit.\
    \ Well done\")\n```\n\n你可能注意到，在上面的代码中我们没有使用单独的变量。相反，我们将比较运算符与 `if` 语句内联。我们还使用了\
    \ `elif` 关键字。这定义了一个备选分支。如果有多个分支为 True，则只使用第一个。例如：\n\n```python\na = 10\nif a >\
    \ 1:\n    print(\"Big\")\nelif a > 5:\n    print(\"Really big\")\nelif a == 10:\n\
    \    print(\"Approaching enorm\")\nelif a > 10:\n    print(\"Enormous!\")\n```\n\
    这段代码将只会打印“Big”，其他语句将被忽略。\n\n## 测验\n\n尝试在不使用解释器的情况下回答这些问题。\n\n1. 对于以下变量的布尔值 - `bool(a)`\
    \ - 是：\n   `a = False`\n   `a = True`\n   `a = None`\n   `a = 0`\n2. 以下表达式的结果是\
    \ True 还是 False：\n   `not (16 < 15 or 5 == 3)`\n3. 逻辑运算符 `and`、`or` 和 `not` 的优先级是什么？\n\
    4. 以下代码会打印什么：\n   ```python\n   a = 10\n   if a > 1:\n       print(\"Big\")\n\
    \   elif a > 5:\n       print(\"Really big\")\n   elif a == 10:\n       print(\"\
    Approaching enorm\")\n   elif a > 10:\n       print(\"Enormous!\")\n   ```\n5.\
    \ 假设 `x=True`, `y=False`。以下表达式是 True 还是 False：\n   `x and y`\n   `x or y`\n  \
    \ `not x`\n   `not y`\n6. 下列代码的输出是什么：\n   ```python\n   x = 5\n   if x > 3:\n\
    \       print(\"Apple\")\n   elif x > 4:\n       print(\"Banana\")\n   else:\n\
    \       print(\"Cherry\")\n   ```\n"
- fmt: "\nHere, we have implemented a car in Python:\n\n```python\nclass Car:\n  \
    \  def turn_left(self):\n        pass\n    def turn_right(self):\n        pass\n\
    \    def accelerate(self):\n        pass\n    def slow_down(self):\n        pass\n\
    \    def open_a_window(self):\n        pass\n```\n\nIn the code above, we have\
    \ created a class. A class is an entity that has specific behaviours. These behaviours\
    \ take the form of methods, which are the same as the functions we have used previously,\
    \ and are indented in the same way. The methods of a class are given the class\
    \ (`self`) as their first parameter. The `pass` keyword tells Python that this\
    \ code block does nothing.\n\nThere are a variety of different cars that this\
    \ class could represent - BMW, Mercedes, Audi, Fiat, Tesla, and many others. Let’s\
    \ create a car with some parameters.\n\n```python\nbmw_x6 = Car(model=\"BMW X6\"\
    , max_speed=230)\n```\n\nIn the code above you can see that the car object was\
    \ created with two parameters: `model` and `max_speed`. The original car code\
    \ has nothing that would support them. In order to implement this support you\
    \ must introduce an `__init__` method:\n\n```python\nclass Car:\n    def __init__(self,\
    \ model, max_speed):\n        self.model = model\n        self.max_speed = max_speed\n\
    \        self.speed = 0\n        ...\n```\n\nThe code above takes your new car\
    \ object (`self`) and uses the dot notation to assign the car’s `model` and `max_speed`.\
