    2. What about this one: `(2 + 2 + 3 + 4) * (4 - (2 * 6))`?


    Answer: 10 if you answered 0 you forgot that multiplication has a higher precedence
    than addition. 0 if you answer was something else you forgot that operations in
    brackets should be performed first - a product of the second expression in brackets
    `(4 * 4 - (2 * 6))` is 0 and anything multiplied by 0 is 0 as well.


