    # Loops


    Collections can be used to store data in, but you can also go through them and
    do something to each item individually.


    In Python there are two types of loop that you can use: `while` and `for`.


    A `while` loop carries on repeating as long as a certain condition is true.


    The statements inside a `while` loop must be indented, like any other code block.


    The loop must be defined using the `while` keyword, a Boolean statement, and a
    colon.


    The Boolean statement could be a function call, a variable, or a comparison statement.


    ![](images/00023.jpeg)


    This code will print numbers 1 to 10

    ```python

    1. aps = 0

    2. while aps < 10:  #test

    3. aps += 1        #counter

    4. print(aps)      #statement1

    5. print ("and")    #statement2

    6. print ("Done")   #loop exit

    ```


    ## While


    Python provides `break` and `continue` statements to have even control on your
    loop.


    ![](images/00024.jpeg)

    ```python

    1. while <test1>:

    2. <statement1>

    3. if <test2>: break  #loop exit, skip

    4. if <test3>: continue #go to the top <test1>

    5. else:

    6. <statement2> #run if break didn’t happen

    ```


    ## Loops


    ![](images/00025.jpeg)


    You can use a `for` loop to iterate though collection. Let’s say you have the
    following list:


    ```python

    1. a = ["one", "two", "three"]

    ```


    To print each string individually, you could use this loop:


    ```python

    1. for item in a:

    2. print(item)

    ```


    The loop must be defined using the `for` keyword, the name of the variable to
    hold each item, the `in` keyword, the name of the collection, and a colon. The
    statements inside a `for` loop must be indented.


    You can escape from a loop using the `break` command:


    ```python

    1. numbers = [1, 2, 5, 6, 7, 8, 9]

    2. for number in numbers:

    3. print("Looking at: " + str(number))

    4. if number > 6:

    5. print("Too big: " + str(number) + "!")

    6. break

    ```


    The above code gives the following output:

    Looking at: 1

    Looking at: 2

    Looking at: 5

    Looking at: 6

    Looking at: 7

    Too big: 7!


    The iteration stops after number 7, meaning that numbers 8 and 9 are not included.


    You can also skip particular items in a collection using the `continue` keyword:


    ```python

    1. numbers = [1, 6, 7, 8, 9, 2, 5]

    2. for number in numbers:

    3. if number > 6:

    4. continue

    5. print("Looking at: " + str(number))

    ```


    The above code gives the following output:

    Looking at: 1

    Looking at: 6

    Looking at: 2

    Looking at: 5


    Here, we ignored numbers 7, 8, and 9.


    Dictionaries can be iterated through the same way.


    ```python

    1. ages = {

    2. "John": 34,

    3. "Matt": 23,

    4. "Natasha": 27,

    5. "Gabriella": 33

    6. }

    7. for name in ages:

    8. print(name)

    ```


