    The process of removing students from respective courses whenever they change
    school in the context of relational database is called referential integrity management.
    Foreign key constraints tell you which columns contain references to other places
    in the database.


    There are dozens of other constraints. And even though they won’t be covered in
    this chapter the ones that were already briefly introduced are enough to get a
    reasonable understanding about how relational databases behave.


    The last thing you need to know about before we move on is Structured Query Language
    (SQL). `SQL` is a programming language specifically used for declaring database
    constraints, and for manipulating data (i.e. listing, viewing, creating, updating,
    or deleting data).


    # Python sqlite3


    Python has a built-in database module called `sqlite3`.


    It is a full stack Python implementation of a relational database and SQL.


    Here we will briefly go through major SQL statements and database constructs.


    To begin with, open your Python interpreter and import `sqlite3`:


    1. `import sqlite3`


    Initialize database connection:


    2. `conn = sqlite3.connect(''example.db'')`


    Get a cursor:


    3. `cursor = conn.cursor()`


    4. `cursor.execute("PRAGMA foreign_keys = ON")`


    Cursor is just a Python object used to execute SQL statements. In `sqlite3` foreign
    key constraints are disabled by default for performance reasons. `PRAGMA` statement
    enables them.


    Now let’s create a simple users table.


    1. `cursor.execute("""`

    ```sql

    CREATE TABLE users(

    id INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,

    email TEXT NOT NULL,

    name TEXT NOT NULL

    )

    ```

    `""")


    In the code above you may see the following:


    * every user must have an email and a name that are text values

    * every user has an integer identifier that is used as a primary key. `AUTOINCREMENT`
    means that whenever new user is created `id` shall be generated automatically
    based on the identifier of a user stored previously


    Also lets create a table called `cars` in such a way that every car mentioned
    in the table shall have exactly one owner from the list of humans listed in the
    users table.


    1. `cursor.execute("""`

    ```sql

    CREATE TABLE cars(

    id INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,

    brand TEXT NOT NULL,

    model TEXT NOT NULL,

    owner INTEGER NOT NULL,

    FOREIGN KEY(owner) REFERENCES users(id) ON DELETE CASCADE

    )

    ```

    `""")


    In the code above there is a foreign key definition that denotes a relationship
    between `cars` and `users` in a form of ownership. The `ON DELETE CASCADE` statement
    tells the database that whenever a user is removed all the cars that belong to
    the users must be removed as well.


    Lets create one user and two cars that belongs to this user:


    1. `cursor.execute(''INSERT INTO users VALUES(NULL, ''`

    2. `''"john.smith@pythonvisually.com", "John Smith")'')`

    3. `cursor.execute(''INSERT INTO cars VALUES(NULL, "Fiat", "Polo", 1)'')`

    4. `cursor.execute(''INSERT INTO cars VALUES(NULL, "BMW", "X6", 1)'')`


    sqlite3


    Note, when creating cars we passed value `1` for the `owner`. We knew that user
    John Smith was the first one created in the database. Thus, his `ID` would logically
    be `1`


    Let’s attempt to create a car that references a user who does not exist, e.g.
    user #2.


    `cursor.execute(''INSERT INTO cars VALUES(NULL, "Mazda", "6", 2)'')`


    You are expected to see a traceback with the following error message:


    `sqlite3.IntegrityError: FOREIGN KEY constraint failed`


    This way database engine notifies you that something is wrong with the a foreign
    key you try to store.


    Now, let’s manipulate the test data that we’ve created.


    First, let’s change John’s email:


    The above code uses the `UPDATE` command and the `WHERE` statement. In combination,
    they let you update all the values that fit your search criteria.


    Now, let’s check that the email actually got updated:


    `rows = list(cursor.execute(''SELECT email FROM users WHERE name="John Smith'')))`


    ```

    [("john.smith@pythonvisually.com",)]

    ```


    When choosing which user to check we used `SELECT` command. During selection we
    stated that we are interested only in user’s email. In case of row selection `cursor`’s
    `execute` method returned and an iterator over database rows that we transformed
    into a list and printed.


    Lets get rid of one of the cars, e.g. BMW:


    1. `cursor.execute(''DELETE FROM cars WHERE brand="BMW"'')`

    2. `rows = list(cursor.execute(''SELECT * FROM cars''))`

    3. `len(rows) == 1`


    After that we used `DELETE` command. Last but not least, lets check how `ON DELETE
    CASCADE` works. Get rid of the user.


    `cursor.execute(''DELETE FROM users WHERE name="John Smith"'')`


    Now check how many cars we have:


    `rows = list(cursor.execute(''SELECT * FROM cars''))`

    ```

    len(rows)

    ```


    This is it. Fiat was removed together with its owner.


    # Quiz


    Problem:


    1. What does `SQL` stand for?

    2. What do foreign keys help to enforce?

    3. How many different constraints can exist?

    4. `SQL` is used for two purposes. Name them.

    5. If you want to change an existing row which command you use?

    6. In what form is data stored?

    7. Constraints are usually applied to which part?

    8. What entities do records represent?

    9. What does `DRY` stand for?


    Answer:


    1. Structured Query Language

    2. Referential integrity

    3. Exactly one

    4. Data definition and data manipulation

    5. `UPDATE`

    6. tables

    7. individual column

    8. Rows

    9. Don’t Repeat Yourself


    Exercises


    Problem: Given that the database is completely clean, write Python code that would
    create user `Mike Stark` with email `subscribe@pythonvisually.com`. Add `Toyota
    Prius` to her collection.


    Answer:

    ```python

    cursor.execute(''INSERT INTO users VALUES(NULL, "subscribe@pythonvisually.com",
    "Mike Stark")'')

    ```


    Problem: Write an SQL command that would let remove any car produced by Ford.


    Answer:

    ```sql

    DELETE FROM cars WHERE brand="Ford"

    ```


    Problem: Write an SQL command to remove every car owned by user17.


    Answer:

    ```sql

    DELETE FROM cars WHERE owner=17

    ```


    # 3rd party packages


    Aside from the default Python packages, there are a variety of 3rd party solutions.


    In order to use them in a similar fashion as the standard library they must be
    placed under `PYTHONPATH`.


    `PYTHONPATH` is an environment variable that tells the interpreter where to look
    for source files.


    The standard way to install Python packages is to use `pip`, which has a simple
    command line interface. This is how to install: https://pip.pypa.io/en/latest/installing


    Find all packages that have a “nose” string in their name:


    `pip search nose`


    Install a package named `nose`:


    `pip install nose`


    Show information about the `nose` package.


    `pip show nose`


    Get rid of the nose package:


    `pip uninstall nose`


    # Web Development with Flask


    Python can be a great choice when it comes to creating websites, and there are
    a lot of frameworks out there to help you with this. This chapter provides an
    overview of one of them, Flask ([http://flask.pocoo.org/](http://flask.pocoo.org/)),
    which is very easy to get started.


    Flask is a microframework, it keeps its core simple but extensible. The base framework
    is intended to be very lightweight, while new features can be added through extensions.
    Core features are:


    * built in development server and debugger

    * integrated unit testing support

    * heavily uses HTTP methods

    * uses Jinja2 templating

    * supports secure cookies

    * 100% WSGI 1.0 compliant

    * unicode based

    * extensively tested and documented


