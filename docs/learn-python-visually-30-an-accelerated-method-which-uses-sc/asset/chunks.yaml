  trans: "\n\n```python\n>>> math.sqrt(25)\n5.0\n```\n\n## 测验\n\n问题：为了回答以下问题，你需要深入研究标准库\n\
    \n1. 你会使用哪个函数来计算反正切？\n2. 应该使用哪个函数进行指数运算？\n3. 如何计算数的阶乘？\n\n### 答案：\n\n1. `math.atan`\n\
    2. `math.exp`\n3. `math.factorial`\n\n## JSON\n\n在软件工程中，有一个被称为序列化（serialization）的过程。它的主要目的是将任意对象的状态转换为可以在网络上传输和/或以某种方式存储的内容，以便以后重建原始对象。这种重建的过程被称为反序列化（deserialization）。\n\
    \n序列化的现实生活类比是研究一个现有的构制品（例如汽车）并对其制作一份详细的蓝图（包含引擎、轮子、变速箱等）。通过网络发送序列化数据类似于通过普通邮寄发送蓝图。而反序列化则是某人根据获取的蓝图构建出原始对象副本的过程。\n\
    \n在 Web 编程领域，有两种数据序列化标准最受欢迎：XML 和 JSON。它们都是文本格式，这意味着使用这些标准表示的数据可以通过像 `VIM` 简单的文本编辑器供人类查看。本章的主题是\
    \ JSON 以及 Python 使用它序列化数据的方法。\n\n`JSON` 是 JavaScript 编程语言中操作数据的原生方式。\n\n作为一种格式，`JSON`\
    \ 与三种主要结构操作：\n\n1. 原生类型：整数、浮点数、字符串、布尔值和 null 类型\n2. 对象：Python 字典的等价\n3. 数组：Python\
    \ 列表的等价\n\n你可以看到，所有的 JSON 结构都完美匹配 Python 的内置类型。因此，将 Python 数据结构序列化为 JSON 的主要目的是将\
    \ Python 内置类型转换为 JSON 字符串，例如作为 HTTP 请求/响应体中的负载发送。\n\n默认情况下，Python 可以序列化以下数据类型：`int`、`bool`、`None`、`str`、`float`、`long`、`dict`\
    \ 和 `list`。有方法可以扩展此功能，但它们超出了本章的范围。\n\nPython 负责序列化的模块被称为 `json`。它包含两个主要函数：`dumps`\
    \ 和 `loads`。`dumps` 期望 Python 数据结构作为输入并返回 JSON 字符串作为输出。`loads` 执行相反相反的操作 - 它期望\
    \ JSON 字符串作为输入并返回 Python 数据结构作为输出。\n\n## 代码示例\n\n### 导入 JSON 模块\n1. `json`\n\n\
    ### 将字符串列表序列化为 JSON 数组\n2. `list_of_strings = [\"one\", \"two\", \"three\", \"\
    four\"]`\n3. `json_array = json.dumps(list_of_strings)`\n\n### 将 JSON 对象反序列化为\
    \ Python 数据结构\n1. `json_data = \"\"\"\n{\n  \"integer\": 1,\n  \"inner_object\"\
    : {\n    \"nothing\": null,\n    \"boolean\": false,\n    \"string\": \"foo\"\n\
    \  },\n  \"list_of_strings\": [\n    \"one\",\n    \"two\"\n  ]\n}\n\"\"\"`\n\
    2. `python_dict = json.loads(json_data)`\n\n### 序列化整数\n```python\nprint (json.dumps(1))\n\
    1\nprint (type(json.dumps(1)))\n<class 'str'>\n```\n\n### 代码样本\n\n### 序列化字符串\n\
    ```python\n>>> print(json.dumps(\"FOO\"))\n\"FOO\"\n>>> print(len(json.dumps(\"\
    FOO\")))\n5\n```\n\n### 尝试反序列化非 JSON 的内容 - 当输入无法处理时会抛出 ValueError\n```python\n\
    >>> json.loads(\"FOO\")\nTraceback ...\n...\nValueError: No JSON object could\
    \ be decoded\n```\n\n### 尝试序列化在 JSON 中没有表示的内容 - 默认仅支持有限 Python 内置类型\n```python\n\
    >>> class Teacher(object):\n    pass\n>>> t = Teacher()\n>>> json.dumps(t)\nTraceback\
    \ ...\n...\nTypeError: <...Teacher instance at...> is not JSON serializable\n\
    ```\n\n## 测验\n\n问题：\n1. Python 中哪个函数负责 JSON 序列化？\n2. “序列化”的反义词是什么？哪个 Python 函数负责该操作？\n\
    3. 这条命令的输出是什么：`print (json.dumps(\"FOO\")[0])`？\n4. 这条命令的输出是什么：`print (len(json.dumps(None)))`？\n\
    5. 这条命令的输出是什么：`print (type(json.dumps('”1.57”)))`？\n\n### 答案：\n1. `json.dumps`\n\
    2. 反序列化 / `json.loads`\n3. `\"[1]\"`\n4. `4`\n5. `<type ‘str’>`\n\n***\n\n## 练习\n\
    \n问题：有以下代码：\n实现 `join_two_arrays` 函数\n\n```python\n>>> array_of_strings = [\"\
    one\", \"two\"]\n>>> array_of_strings = [\"three\", \"four\"]\n>>> join_two_arrays(array_of_strings,\
    \ array_of_strings)\n['one', 'two', 'three', 'four']\n```\n\n```python\n>>> type(join_two_arrays(array_of_strings,\
    \ array_of_strings))\n<class 'list'>\n```\n\n### 答案：\n```python\ndef join_two_arrays(list1,\
    \ list2):\n    return list1 + list2\n```\n\n问题：有以下代码：\n实现 `json_if_already_json`\
    \ 函数\n\n```python\n>>> class Teacher(object):\n    pass\n>>> t = Teacher()\n```\n\
    \n### 答案：\n```python\ndef json_if_already_json(obj):\n    try:\n        return\
    \ json.dumps(obj)\n    except TypeError:\n        return obj\n```\n\n## SQL: sqlite3\n\
    \n软件开发的一个主要原则是重用性。该原则可以重述为 DRY - 不要重复（Don’t Repeat Yourself）。实现它的最佳方法是避免重复造轮，并应用之前的解决方案。\n\
    \n在信息处理和数据存储发展的几十年里，出现了一种常见的约束（constraints）。在这种背景下，“约束”意味着你应用于数据的规则集。\n\n为了理解什么是约束，请思考电子邮件。地址预期包含一个“@”字符。这种预期就是一个约束。\n\
    \n具有多个约束的现实生活系统是汽车装配线。所有零件都预期符合某些标准 - 如果不符合，无法完全自动化，必须引入人工。\n\n为了创建一个通约束系统，现有系统被合并为现在的关系型数据库。\n\
    \n数据以表的形式存储在关系型数据库中，每列代表了每行数据类型（字符串、整数、布尔值等）的一组规则。\n\n主键约束定义了哪个字段应该作为主索引，即行中的哪条信息可以用作其地址。“索引”一词在邮政行业中的含义完全相同。在邮政中，它是特定收件人的地址；在关系型数据库中，它是表中的某一行。\n\
    \n## SQL\n\n为了说明引用完整性（referential integrity）的含义，最好查看以下现实生活案例。\n\n如果一个学生离开学校去另一所学校，必须从他们所有课程的注册表中将其移除。同样，如果你想从关系型数据库中删除一个项目，还必须删除数据库中对它的所有引用。\n\
    \n"
