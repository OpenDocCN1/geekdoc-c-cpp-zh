    \n```python\n>>> from sys import pydebug, flags\n```\n\n注意，保留在 Python 包内部的实体可以是几乎任何\
    \ Python 构造。类、函数、变量、模块甚至可以是包（嵌套包是可能的）。\n\n## 测验\n\n问题：\n1. Python 源文件的同义词是什么？\n\
    2. 带有 Python 模块的文件夹术语是什么？\n3. 与默认 Python 安装一起提供的包集合称为什么什么？\n4. 如何从 `os` 包导入模块路径？\n\
    \n## 回答：\n1. module\n2. package\n3. standard library\n4. `from os import path`\n\
    \n## 使用 os 模块进行文件操作\n\n尽管可以使用内置的 Python 函数和方法处理文件，但它们并没有涵盖你在操作计算机文件系统时可能遇到的所有场景。\n\
    \n本章概述了你在处理数据时在底层可能遇到的所有常见任务，以及 Python 管理这些任务的手段。\n\n简要说明：下面的某些示例使用了 Linux 的路径结构。要在\
    \ Windows 上运行它们，请将正斜杠（`/`）替换为反斜杠（`\\`）。\n\n首先，假设你有了如下结构：\n\n```\n/parent/\n  \
    \  foo/\n      one.txt\n      two.txt\n      three.txt\n```\n\n首先进入 `foo` 目录：\n\
    \n```bash\ncd parent\n```\n\n为了验证目录是否如我们预期的，使用 `os.path` 模块的 `abspath` 函数和 `curdir`\
    \ 属性：\n\n```python\n>>> from os.path import abspath, curdir\n>>> curdir\n‘.’\n\
    >>> abspath(curdir)\n‘/parent’\n```\n\n`curdir` 变量包含一个指向当前目录的字符串。为了删除 `one.txt`\
    \ 并重命名 `two.txt`，你需要标准库中的两个函数：`remove` 和 `rename`。\n\n```python\n>>> from os import\
    \ remove, rename\n>>> remove(“foo/one.txt”)\n>>> rename(“foo/two.txt”, “foo/bar.txt”)\n\
    ```\n\n### 使用 os 模块的文件操作\n\n正如你可能注意到的，提供文件名时必须提供相对路径或绝对路径。对于绝对路径，一切都很简单——它应该从文件系统的根目录（root）开始。绝对路径在\
    \ UNIX 和 Windows 上分别如下：\n\n`/Blah/Blah/one.txt`\n`C:\\Blah\\Blah\\one.txt`\n\n\
    相对路径是根据当前目录计算的。假设你在 `/foo/bar/one` 目录并并移动到 `/foo/two`。在这种情况下，相对路径应该是 `../../two`。两个点表示父目录。由于你需要向上移动两级，因此需要\
    \ `../../` 序列。\n\n由于 Linux 和 Windows 使用不同的分隔符，上面的代码有一个严重的缺陷。它不是跨平台的。\n\n为了将其转换为通用，你应该使用\
    \ `os.path` 模块中的 `join` 函数：\n\n```python\n>>> from os import remove, rename\n\
    >>> from os.path import join\n>>> remove(join(“foo”, “one.txt”))\n>>> rename(join(“foo”,\
    \ “two.txt”), join(“foo”, “bar.txt”))\n```\n\n你将路径的所有部分作为字符串传递给 `join` 函数，然后使用特定的路径分隔符生成字符串。\n\
    \n你可以列出特定目录下的所有文件和文件夹：\n\n```python\n>>> from os import listdir\n>>> listdir(“foo”)\n\
    [“bar.txt”, “three.txt”]\n```\n\n现在尝试删除 `foo` 目录：\n\n```python\n>>> from os import\
    \ rmdir\n>>> rmdir(“foo”)\nTraceback (most recent call last):\n  File \"<stdin>\"\
    , line 1, in <module>\nOSError: [Errno 39] Directory not empty: ‘foo’\n```\n\n\
    哎！我们引发了异常。只要目录内还有任何东西，它就无法删除。\n\n"
- fmt: "\n1. What major difference between Windows and Linux filesystems make it more\
    \ difficult to write cross-platform Python programs?\n2. What is the value of\
    \ `os.path.curdir`?\n3. Which string represents the parent of the current directory?\n\
    \n### Answer:\n1. Different path delimiters: `/` on Unix and `\\` on Windows\n\
    2. `.`\n3. `. .`\n\n## Exercises\n\n### Problem: Fix the `rmdir` code from the\
    \ last example so that it works.\n\n### Answer:\nTo do so you just need to get\
    \ rid of all the files inside first:\n```python\n>>> remove(\"foo/bar.txt\") #\
    \ you renamed it\n>>> remove(\"foo/three.txt\")\n>>> rmdir(\"foo\")\n```\n\n##\
    \ Exercises\n\n### Problem: Make the following function cross-platform:\n1. `def\
    \ show_foobar_here(path):`\n2. `print(path + \"/foobar\")`\n\n### Answer:\n1.\
    \ `from os.path import join`\n2. `def show_foobar_here(path):`\n3. `print(join(path,\
    \ \"foobar\"))`\n\n## Exercises\n\n### Problem: Using the `isdir` function from\
    \ the `os.path` module, find the folder inside your current directory.\nIterate\
    \ through the files and folders, and then throw a custom `DirFound` exception\
    \ with the absolute path of the directory as the human-readable description.\n\
    \n### Answer:\nThe following would be a sufficient solution:\n```python\nfrom\
    \ os.path import isdir, curdir, abspath\nfrom os import listdir\nclass DirFound(Exception):\n\
    \    pass\n\ndef detect_dirs():\n    for item in listdir(curdir):\n        if\
    \ isdir(item):\n            raise DirFound(abspath(item))\n```\n\n## Regular Expressions\n\
    \nAlthough you can use the `in` operator to check if a substring is present within\
    \ a string, it doesn’t tell you where the substring is located, nor does it let\
    \ you match the substring non-precisely.\n\nTake this string:\n```python\n>>>\
    \ lorem_text = \"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed\
    \ do eiusmod tempor incididunt ut labore et dolore magna aliqua.\"\n```\nYou want\
    \ to find out if this text contains something like “dolor BLA BLA BLA amet” -\
    \ the words “dolor” and “amet” in that order, with any amount of text in between.\n\
    \nTo do this, you can use the `re.search` method:\n```python\n>>> import re\n\
    >>> found = re.search(\"dolor .*amet\", lorem_text)\n>>> found\n<_sre.SRE_Match\
    \ object; span=(12, 26), match='dolor sit amet'>\n```\nThe `search` function takes\
    \ a regular expression pattern as its first argument, and the text to be searched\
    \ as its second argument.\n\nThe regular expression patter is a flexible description\
    \ of what you’re looking for in the text. The format is covered later in this\
    \ chapter.\n\nLook at the return value of the `search` function: it’s called a\
    \ `MatchObject`, and it tells you where the substring was found in the original\
    \ text.\n\nIf the pattern can’t be found, then the function returns `None`:\n\
    ```python\n>>> match = re.search(\"found\", lorem_text)\n>>> type(match)\n<class\
    \ 'NoneType'>\n```\nYou may get start and end indices of the substring from the\
    \ match object:\n```python\n>>> found.start()\n12\n>>> found.end()\n26\n```\n\
    and access the substring matched by the pattern:\n```python\n>>> found.group()\n\
    'dolor sit amet'\n>>> lorem_text[12:26]\n'dolor sit amet'\n```\nNote: if multiple\
    \ occurrences of the patter are found, only the first one is returned. If you\
    \ need to go through all of the occurrences, use the `re.finditer` function:\n\
    ```python\n>>> list(re.finditer(\"dolor .*amet\", lorem_text))\n[<_sre.SRE_Match\
    \ object; span=(12, 26), match='dolor sit amet'>]\n```\nIf you want to see if\
    \ a string matches a certain pattern, you should use the `re.match` function,\
    \ which tries to apply the pattern to the whole string:\n```python\n>>> bool(re.match(\"\
    [0-9][a-z]*\", \"0dgfgfg\"))\nTrue\n>>> bool(re.match(\"[0-9][a-z]*\", \"dgfgfg\"\
    ))\nFalse\n```\nThe symbols `.*` in the regular expression pattern match to zero\
    \ or more arbitrary characters. A dot represents an arbitrary character, and a\
    \ star represents a cardinality. This is the basic structure of any regular expression\
    \ pattern: a symbol type, followed by its cardinality.\n\nThe table below provides\
    \ an overview of the most frequently-used cardinalities.\n\n| Cardinality | Description\
    \ |\n| :--- | :--- |\n| `*` | Zero or more |\n| `+` | One or more |\n| `?` | Zero\
    \ or one |\n| `{m}` | Exact number of symbols |\n| `{m, n}` | At least m and n\
    \ at most |\n\nThis is how to easy remember some of them:\n```python\n>>> import\
    \ re\n>>> print(re.search('^', 'Beginning of line'))\n>>> print(re.search('line$',\
    \ 'Beginning of line'))\ntxt = \"The quick brown fox jumps over the lazy dog\"\
    \n```\n\nRegular Expressions\nThis table shows the most frequently-used symbols.\n\
    \n| Symbol | Description |\n| :--- | :--- |\n| `.` | Any character |\n| `\\\"\
    ` | Double quote |\n| `'` | Single quote |\n| `\\\\` | Backslash |\n| `\\t` |\
    \ Tab character |\n| `\\n` | New line character |\n| `[0-9]` | Any digit from\
    \ 0 to 9 inclusively |\n| `[^0-9]` | Any character that is not a digit |\n| `[a-z]`\
    \ | Any lowercase letter |\n| `[^a-z]` | Any character that is not a lowercase\
    \ letter |\n| `[a-zA-Z0-9_]` | Any digit, any letter or underscore |\n\nAs you\
    \ can see, some symbols start with backslash. These symbols are called escape\
    \ sequences and represent things either can’t described otherwise or are reserved\
    \ characters.\n\nNow’s try to compose patterns that combine both symbols and cardinalities.\n\
    One or more digit: `[0-9]+`\nAn optional number that does not start with zero:\
    \ `([1-9]{1}[0-9])`\nParentheses let you combine multiple symbols into groups\
    \ and apply cardinalities to the whole groups. You may rephrase the regular expression\
    \ mentioned above the following: zero or one number that begins with exactly one\
    \ digit that is not zero and multiple arbitrary digits: `[^_][a-z]*`\nA string\
    \ that may contain any lowercase letter but can’t preceded with underscore `^_][a-z]*`\n\
    \nIn order to replace the first occurrence of a substring with another value you\
    \ ought to use `re.sub`. Replace `dolor BLA BLA amet` with `foobar` the following:\n\
    ```python\nre.sub(\"dolor.*amet\", \"foobar\", lorem_text)\n```\n\n## Quiz\n\n\
    Problem:\n1. What is the escape sequence for a new line character?\n2. What is\
    \ the escape sequence for a tab character?\n3. What does the `re.search` function\
    \ return if the pattern could not be found?\n4. What is going to be matched by\
    \ the following call: `re.search(r'..', 'food bar')`? Try to answer without the\
    \ interpreter.\n\nAnswers:\n1. `\\n`\n2. `\\t`\n3. `None`\n4. `ood`\n\n## Exercises\n\
    \nProblem: Write a function `is_valid_Python_variable_name(string)` that would\
    \ say if the string can be used as a variable name in Python. You don’t need to\
    \ worry about reserved keywords.\nAnswer:\n```python\ndef is_valid_Python_variable_name(string):\n\
    \    # underscore or a letter followed by an integer,\n    # underscore or a character\n\
    \    found = re.match(\"[[_A-Za-z][a-zA-Z0-9]*\", string)\n    return bool(found)\n\
    ```\n\n## Exercises\n\nProblem: Write a function `get_number_of_occurrences(string,\
    \ substring)` that would return an integer that calculates how many instances\
    \ of a substring were found in a string.\nAnswer:\n```python\ndef get_number_of_occurrences(string,\
    \ substring):\n    findings = list(re.finditer(substring, string))\n    return\
    \ len(findings)\n```\n\n## Math module\n\nThis chapter provides an overview of\
    \ the `math` module from the Python standard library. The module contains implementations\
    \ of common mathematical operations, such as square root, that aren’t inclcuded\
    \ in the standard function set.\n\nUsing the `math` module you can perform regular\
    \ trigonometric operations:\n```python\n>>> math.sin(math.radians(30))\n0.4999999999999999\n\
    >>> math.cos(math.radians(60))\n0.5000000000000001\n>>> math.tan(math.radians(45))\n\
    0.9999999999999999\n```\nNote, the argument is a value of the angle in radians\
    \ not degrees. This is why an additional call to `math.radians` was used.\nAlso,\
    \ you see 0.499999999 instead of 0.5 or 0.999999999 instead of 1.\nThis is due\
    \ to the way the language handles floating point number calculations.\n\nYou can\
    \ get special numbers, like `pi` and `e`, to a certain level of precision:\n```python\n\
    >>> math.pi\n3.141592653589793\n>>> math.e\n2.718281828459045\n```\nYou can also\
    \ calculate square roots:\n```python\n>>> math.sqrt(16)\n4.0\n```\n"
