    In the code above, we have created a class. A class is an entity that has specific
    behaviours. These behaviours take the form of methods, which are the same as the
    functions we have used previously, and are indented in the same way. The methods
    of a class are given the class (“self”) as their first parameter. The “pass” keyword
    tells Python that this code block does nothing.


    There are a variety of different cars that this class could represent - BMW, Mercedes,
    Audi, Fiat, Tesla, and many others. Let’s create a car with some parameters.


    1.  bmw_x6 = Car(model = “BMW X6”, max_speed = 230)


    In the code above you can see that the car object was created with two parameters:
