    response = urlopen(\"http://a/b/c\")\ndata = response.read()\n```\nNote that `response`\
    \ is a file-like object, which points at the remote resource.\n\n## Image Processing\n\
    The Python Imaging Library (`PIL`) adds image processing capabilities to Python.\
    \ You can use this library to create thumbnails, convert between file formats,\
    \ print images, etc.\n\nLoad image from a file:\n```python\nimport Image\nim =\
    \ Image.open(\"Python.jpg\")\ndata = list(im.getdata())\n```\n\nGet a list of\
    \ pixels from the image above:\n```python\nfrom PIL import Image\nfrom urllib.request\
    \ import urlopen\nimport io\nresponse = urlopen(\"http://a/b/c.jpg\")\nim_file\
    \ = io.BytesIO(response.read())\nim = Image.open(im_file)\nim = im.rotate(90)\n\
    im = im.resize((800, 600))\nim.save(\"downloaded_image.jpg\", \"JPEG\")\n```\n\
    The script below downloads a picture from a given url, rotates it, resizes it,\
    \ and saves it locally. Note, `io.BytesIO` is used to wrap the buffer into a proper\
    \ file-like object.\n\nThe following code creates a 128x128 thumbnail from a JPEG\
    \ image:\n```python\nfrom PIL import Image\nsize = 128, 128\nfilename = \"image.jpg\"\
    \nim = Image.open(filename)\nim.thumbnail(size, Image.ANTIALIAS)\nim.save(filename\
    \ + \".thumbnail\", \"JPEG\")\n```\n\n## Directory cleanup\nLet’s imagine that\
    \ you need to clean up a directory and remove all files from before 2002. Each\
    \ file within this directory is a text document (`.txt`) whose first line is a\
    \ date (yyyy-mm-dd).\n\n```python\nimport os\nimport time\ncount = 0\nkept = 0\n\
    deleted = 0\nfor (root, dirs, files) in os.walk('.'):\n    for filename in files:\n\
    \        if filename.endswith('.txt'):\n            f = open(filename, 'r')\n\
    \            sdate = f.readline();\n            f.close()\n            pdate =\
    \ time.strptime(sdate, '%Y-%m-%d\\n')\n            if pdate.tm_year > 2002:\n\
    \                kept += 1\n            else:\n                os.remove(filename)\n\
    \                deleted += 1\n            count += 1\nprint('Total files: ' +\
    \ str(count))\nprint('Kept: ' + str(kept))\nprint('Deleted: ' + str(deleted))\n\
    ```\n\nThe code above does the following 4 things:\n1. Imports the necessary modules.\n\
    2. Uses the `walk` method to navigate the current directory. For each text file\
    \ in our directory a. Open file b. Read date using `f.readline()` c. Convert string\
    \ date into Python object d. If date is before 2002 the file is deleted\n"
