    \        pass\n    def slow_down(self):\n        pass\n    def open_a_window(self):\n\
    \        pass\n```\n\n在上面的代码中，我们创建了一个类。类是一个具有特定行为的实体。这些行为以方法（methods）的形式存在，这些方法与我们之前使用的函数相同，并且以相同的方式缩进。类的方法将类（`self`）作为第一个参数。`pass`\
    \ 关键字告诉 Python 代码块什么都不做。\n\n这个类可以代表各种不同的汽车——宝马、奔驰、奥迪、菲亚特、特斯拉等。让我们创建一个带有参数的汽车。\n\
    \n```python\nbmw_x6 = Car(model=\"BMW X6\", max_speed=230)\n```\n\n在上面的代码中，你可以看到汽车对象是用两个参数创建的：`model`\
    \ 和 `max_speed`。原始的汽车代码并没有支持这些参数。为了实现这种支持，你必须引入一个 `__init__` 方法：\n\n```python\n\
    class Car:\n    def __init__(self, model, max_speed):\n        self.model = model\n\
    \        self.max_speed = max_speed\n        self.speed = 0\n        ...\n```\n\
    \n上面的代码获取你的新汽车对象（`self`），并使用点符号法分配汽车的 `model` 和 `max_speed`。汽车的初始速度为零。\n\n`__init__`\
    \ 方法不应该包含返回语句——它仅用于构建你的对象。这个方法被称为“类构造函数”。\n\n加速和减速应该相应地减少和增加汽车的速度：\n\n```python\n\
    class Car:\n    ...\n    def accelerate(self, speed_difference):\n        self.speed\
    \ += abs(speed_difference)\n        self.speed = min(self.speed, self.max_speed)\n\
    \    def slow_down(self, speed_difference):\n        self.speed -= abs(speed_difference)\n\
    \        self.speed = max(self.speed, -5)\n        ....\n```\n\n对象的内部状态是通过点符号法改变的。`min`\
    \ 和 `max` 函数用于保证汽车不会超过最高速度，也不会行驶速度低于 -5 km/h（倒档传输）。\n\n下面的代码将汽车加速 30 km/h。\n\n\
    ```python\nbmw_x6.accelerate(30)\n```\n\n当你创建多个类时，你可能希望其中一些类之间存在存在关系。例如，汽车（Car）是一种交通工具（Vehicle），而公交（Bus）也是交通工具。尽管它们有很多相似之处，但它们的内部结构非常不同。\n\
    \n为了反映对象之间的相似性和差异，Python 有一个名为继承（inheritance）的特性。\n\n在这个例子中，我们实现了一个 `Vehicle`\
    \ 类，它拥有与 `Car` 类类似的 `model` 和 `max_speed` 参数。\n\n```python\nclass Vehicle:\n \
    \   def __init__(self, model, max_speed):\n        self.model = model\n      \
    \  self.max_speed = max_speed\n        self.speed = 0\n    def accelerate(self,\
    \ speed_difference):\n        self.speed += abs(speed_difference)\n        self.speed\
    \ = min(self.speed, self.max_speed)\n    def slow_down(self, speed_difference):\n\
    \        self.speed -= abs(speed_difference)\n        self.speed = max(self.speed,\
    \ -5)\n        ...\n```\n\n现在我们想要创建 `Car` 和 `Bus` 类；`Car` 类是完全相同的，但 `Bus` 类没有倒档传输。\n\
    \n```python\nclass Car(Vehicle):\n    pass\nclass Bus(Vehicle):\n    def slow_down(self,\
    \ speed_difference):\n        super().slow_down(speed_difference)\n        self.speed\
    \ = max(self.speed, 0)\n```\n\n类名括号之间的 `Vehicle` 单词使得 `Car` 和 `Bus` 类继承自 `Vehicle`。在\
    \ `Bus` 类中，`slow_down` 方法重写了父类的行为。`super()` 语句调用父类寻找新速度，然后确保该速度不低于 0 km/h。\n\n\
    ### Quiz\n\n**问题：**\n1. 软件工程师如何称呼用户可以使用的行为集合？\n2. 类与类之间关系的名称是什么？\n3. Python 中用于创建对象的方法的通用术语是什么？例如，以下方法：`__init__(name,\
    \ max_speed)`。\n4. 该方法中缺少了什么？\n\n**答案：**\n1. 接口 (Interface)\n2. 继承 (Inheritance)\n\
    3. 类构造函数 (class constructor)\n4. `self` 参数\n\n### 练习\n\n**问题：** 编写 Python 代码让宝马\
    \ X6 加速 100 km/h。\n**答案：**\n```python\nbmw_x6.accelerate(100)\n```\n\n**问题：**\
    \ 引入一个同样是 `Vehicle` 的 `Bike` 类。自行车的主要特点是它的速度永远不会超过 30 km/h。\n**答案：** 你需要确保在 `Bike`\
    \ 的构造函数中 `max_speed` 被限制在 30 km/h 以。\n```python\nclass Bike(Vehicle):\n    def\
    \ __init__(self, model, max_speed):\n        super().__init__(model, max_speed)\n\
    \        self.max_speed = min(max_speed, 30)\n```\n"
