  trans: "\n\n# Hello World\n\n```bash\npip install flask\n```\n\n创建一个名为 `hello.py`\
    \ 的文件并包含以下代码：\n\n```python\npip install flask\n\nfrom flask import Flask\n\napp\
    \ = Flask(__name__)\n\n@app.route(\"/\")\ndef hello():\n    return \"Hello World!\"\
    \n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n```\n\n然后运行它：\n\n\
    ```bash\npython hello.py\n```\n\n如果你打开 浏览器并输入：\n\n`http://localhost:5000`\n\n\
    你应该会看到“Hello World!”的欢迎界面。\n\n恭喜你，你刚刚用 Flask 创建了你的第一个网站。\n\n## 我们来逐行分析 hello.py。\n\
    \n1. 首先，从 `flask` 模块导入了 `Flask` 类。\n2. 接着，创建了一个名为 `app` 的 `Flask` 类实例。\n3. `@app.route(\"\
    /\")` 告诉 `Flask` 哪个 URL 将触发下面的方法。\n4. 定义了 `hello()` 方法，它返回字符串“Hello World!”。\n\
    5. `app.run()` 启动 HTTP 服务器。\n\n## 创建一个名为 `test.py` 的新文件：\n\n```python\nfrom flask\
    \ import Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef root():\n  \
    \  return \"Request Path is: \" + request.path\n\n@app.route(\"/test/\")\ndef\
    \ test():\n    return \"Request Path is \" + request.path\n\nif __name__ == \"\
    __main__\":\n    app.run(debug = True)\n```\n\n你可以看到从 `flask` 导入了 `request` 。该对象代表客户端发送并服务器接收的\
    \ HTTP 请求，它包含了请求页面的路径、请求类型以及其他关于客户端和传输数据的其他信息。\n\n在这种情况下，你使用了 `request` 对象来返回页面的路径。\n\
    \nFlask 提供了一种响应不同 HTTP 方法的简单：\n\n1. `@app.route(\"/data\", methods=['GET'])`\n\
    2. `def show_data():`\n3. `....`\n4. `@app.route(\"/data\", methods=['POST'])`\n\
    5. `def handle_data():`\n6. `....`\n7. `@app.route(\"/user/<username>\")`\n8.\
    \ `def greet_user(username):`\n9. `return \"Hello \" + username`\n\n你可以将网页 URL\
    \ 的部分作为变量在函数中使用。\n\n1. `import json`\n2. `from flask import make_response, Flask`\n\
    3. `app = Flask(__name__)`\n4. `@app.route(\"/json\")`\n5. `def get_image():`\n\
    6. `# 创建响应`\n7. `response = make_response(json.dumps({\"foo\": \"bar\"}))`\n8.\
    \ `# 设置正确的 mimetype`\n9. `response.mimetype = \"application/json\"`\n10. `return\
    \ response`\n11. `if __name__ == \"__main__\":`\n12. `app.run(debug = True)`\n\
    \n到目前为止，所有的页面都会返回简单的文本。\n\nFlask 会自动将此字符串转换为 HTTP 响应，并赋予它 `text/html` 的 mimetype\
    \ 以及状态码 200。\n\n现在让我们来修改这种行为。\n\n这段代码返回一个 JSON 对象。\n\n我们还可以更改错误码：\n\n1. `...`\n\
    2. `@app.route(\"/error\")`\n3. `def error_page():`\n4. `response = make_response(\"\
    Error Page\")`\n5. `response.status_code = 404`\n6. `return response`\n7. `...`\n\
    \n## 测验\n\n### 题目：\n1. 什么是 Flask？你应该用它做什么？\n2. 为什么 Flask 被称为微框架？\n3. Flask 集成\
    \ HTTP 服务器的默认端口是什么？\n4. 你能列出最常用的 HTTP 方法吗？\n5. 考虑以下代码段：\n```python\n@app.route(\"\
    /error\")\ndef error_page():\n    return \"Error Page\"\n```\n\n### 答案：\n1. Flask\
    \ 是一个用于创建 Web 应用程序的 Python 微框架。\n2. 它保持核心的简单。新功能必须通过扩展添加。\n3. 5000\n4. GET, POST,\
    \ HEAD, PUT 和 DELETE\n5. 200。不要被错误名称误骗。你没有做任何操作来更改状态码。\n\n## 练习\n\n### 题目：\n假设你想为你的网站创建一个小型讨论页面，让用户能够发布和阅读消息。消息按降序排序，因此最新的消息显示在最前面。\n\
    \n你的网站非常受欢迎，很快就有太多消息要显示了！你决定每页限制消息数为 50 条，并添加“下一页”和“上一页”按钮以便在页面间跳转。你可以创建一个脚本来显示给定页面上的第一个和最后一个帖子吗？\n\
    \n### 示例答案：\n```python\n...\n@app.route(\"/posts\")\n@app.route(\"/posts/<int:page_nb>\"\
    )\ndef show_posts(page_nb=1):\n    first_msg = 1 + 50 * page_nb\n    last_msg\
    \ = first_msg + 49\n    return \"Messages {} to {}\".format(first_msg, last_msg)\n\
    ...\n```\n\n说明：\n* 为变量 `page_nb` 设置默认值，使得路由 `/posts` 和 `/posts/1` 等效。\n* 在装饰器中强制\
    \ `page_nb` 类型为 `int`，这样路由 `/posts/something` 就会返回 404 错误。\n\n## 文件与目录\n处理文件和目录可能会迅速变成一项繁琐且耗时的任务。Python\
    \ 提供了方便的方法帮助你遍历目录并对文件进行操作。\n\n以下代码将以自顶下的方式扫描所有目录和子目录：\n```python\nimport os\n\
    for root, dirs, files in os.walk(\".\", top_down=True):\n    for name in files:\n\
    \        print(os.path.join(root, name))\n    for name in dirs:\n        print(os.path.join(root,\
    \ name))\n```\n\n`slate` 是一个小型模块，你可以用它轻松从 PDF 文件提取文本。以下代码读取 PDF 文件并提取文档中的所有文本，将每页作为一个文本字符串：\n\
    ```python\nimport slate\nf = open(\"doc.pdf\")\ndoc = slate.PDF(f)\ndoc[1] Text\
    \ from page 2\n```\n\nPython 可以使用 `urllib` 轻松地访问远程资源：\n```python\nfrom urllib.request\
    \ import urlopen\nresponse = urlopen(\"http://a/b/c\")\ndata = response.read()\n\
    ```\n注意 `response` 是一个文件对象，指向远程资源。\n\n## 图像处理\nPython Imaging Library（PIL）为 Python\
    \ 增加了图像处理功能。你可以使用该库创建缩略图、转换格式、打印图像等。\n\n从文件加载图像：\n```python\nimport Image\nim\
    \ = Image.open(\"Python.jpg\")\ndata = list(im.getdata())\n```\n\n从上述图像获取像素列表：\n\
    ```python\nfrom PIL import Image\nfrom urllib.request import urlopen\nimport io\n\
    response = urlopen(\"http://a/b/c.jpg\")\nim_file = io.BytesIO(response.read())\n\
    im = Image.open(im_file)\nim = im.rotate(90)\nim = im.resize((800, 600))\nim.save(\"\
    downloaded_image.jpg\", \"JPEG\")\n```\n下面的脚本从给定的 URL 下载图片、调整大小并保存到本地。注意 `io.BytesIO`\
    \ 用于将缓冲区封装成正确的文件对象。\n\n以下代码从 JPEG 图像创建 128x128 的缩略图：\n```python\nfrom PIL import\
    \ Image\nsize = 128, 128\nfilename = \"image.jpg\"\nim = Image.open(filename)\n\
    im.thumbnail(size, Image.ANTIALIAS)\nim.save(filename + \".thumbnail\", \"JPEG\"\
    )\n```\n\n## 目录清理\n假设你需要清理一个目录并删除 2002 年以前的文件。该目录中的每个文件都是文本文档（`.txt`），其第一行是日期（yyyy-mm-dd）。\n\
    \n```python\nimport os\nimport time\ncount = 0\nkept = 0\ndeleted = 0\nfor (root,\
    \ dirs, files) in os.walk('.'):\n    for filename in files:\n        if filename.endswith('.txt'):\n\
    \            f = open(filename, 'r')\n            sdate = f.readline();\n    \
    \        f.close()\n            pdate = time.strptime(sdate, '%Y-%m-%d\\n')\n\
    \            if pdate.tm_year > 2002:\n                kept += 1\n           \
    \ else:\n                os.remove(filename)\n                deleted += 1\n \
    \           count += 1\nprint('Total files: ' + str(count))\nprint('Kept: ' +\
    \ str(kept))\nprint('Deleted: ' + str(deleted))\n```\n\n上述代码完成了以下 4 件事：\n1. 导入了必要的模块。\n\
    2. 使用 `walk` 方法遍历当前目录。对于我们目录中的每个文本文件 a. 打开文件 b. 使用 `f.readline()` 读取日期 c. 将字符串日期转换为\
    \ Python 对象 d. 如果日期在 2002 年之前则删除文件。\n\n"
