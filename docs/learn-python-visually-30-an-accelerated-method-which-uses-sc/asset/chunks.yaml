    \    for name in files:\n        print(os.path.join(root, name))\n    for name\
    \ in dirs:\n        print(os.path.join(root, name))\n```\n\n`slate` is a small\
    \ module you can use to easily extract text from PDF files. The following code\
    \ reads a PDF file and extracts all text from the document, presenting each page\
    \ as a string of text:\n```python\nimport slate\nf = open(\"doc.pdf\")\ndoc =\
