  trans: "\n\n![](img/cover.jpeg)\n\n# 感谢！\n\n一本书的诞生需要许多人的共同努力。因此，向所有帮助我完成这个项目的项目的\
    \ Kickstarter 赞助者，我谨致以最诚挚的“感谢”，并希望我们未来能创造更多伟不起的事。\n\n![](img/00001.jpeg)\n\nAnthony\
    \ Storms Akins\nAlan Prak\nAlessandro\nAndy Lee\nBill Stull\nBrandon Thompson\n\
    Charles Rogers\nClément Labadie\nDemian Vonder Kuhlen\nEdgar Rodriguez\nGordon\n\
    Greg_Vee\nGregory Pfrommer\nGregory R. Kinnicutt\nJ.T. O’Gara\nJanakan\nJeff\n\
    Joe\nJoshua Bauder\nMarco Randall\nMarshall Walker\nNeer Patel\nNigel J Allen\n\
    Padrao\nPerry Yap\nR.C. Lewis\nRandy Morris\nRowan Knight\nSebastian Lange\nShahid\
    \ Ali Shah\nShrawan\nStan Spears\n\n## 致谢与法律声明\n\n### 作者\n* Ivelin Demirov\n\n\
    ### 编辑\n* Anton Berezin\n* Beth McMillan\n\n### 页面设计\n* Jordan Milev\n\n### 插画师\n\
    * Ivelin Demirov\n\n### 校对\n* Beth McMillan\n\n### 致谢\n我必须感谢在线 Python 社区的帮助，他们多年来一直辛勤工作，才让\
    \ Python 变成了如今令人兴奋的编程语言。\n\n### 版权\n©2015 Ivelin Demirov\n\n### 权利声明\n版权所有。未经出版商或作者书面许可，严禁以任何形式、任何手段复制本书的任何部分。\n\
    \n### 商标\n所有商标均归其所有者所有。\n\n### 免责声明\n书中的信息按“原样”提供，不提供任何保证。虽然在准备本书时已采取一切预防，但对于因书中指令或书中描述的计算机软件硬件产品直接或间接引起或据称引起的任何损失或损害，作者或出版社不对任何个人或实体承担责任。\n\
    \n### 平装本 ISBN\n* ISBN-13: 978-1507727072\n* ISBN-10: 1507727070\n\n### 联系方式\n\
    pythonvisually.com\n\n## 关于本书\n\n### 问题\n第一次尝试时觉得编程很难并不能归咎于。学习编程就像学习一门新语言。\n\n\
    有许多规则和语法符号指南需要遵循。它还需要背诵每种语言的大量术语，除非某人每天至少工作编程 8 小时，否则这个人不太可能很快变得熟悉编程；至少在现在之前，多年来一直是这种情况。\n\
    \n### 方法论\n我们的方法涉及通过简单的插图教授编程概念。\n\n这种视觉化方法之所以有效，是因为它是最基础的学习方式之一。每个人作为婴儿和幼儿，在对字母和意义产生理解之前，早已通过视觉和听觉学习周围的世界了。\n\
    \n编程是基于模块和构建块的。当一个人学习了几个基础模块和步骤后，就可以学习在这些基础单元的基础上构建更复杂的模块。\n\n这是一种构建块方法，一旦掌握了基础模块，就可以对更大的结构进行编码。我从一组通过插图和比喻容易学习的基础构建块开始。\n\
    \n从那里，用户可以应用多种变体并进一步构建。然而，初始的构建块变成了一种类似于“罗塞塔石”，允许用户在未来的任何情况下都能进行编程和构建。\n\n###\
    \ 为什么选择 Python？\n当你在大学开启计算机科学之旅时，你可能会从学习 Python 开始。\n\n那么为什么选择 Python 而不是其他编程语言呢？这很简单：\n\
    \n* 无论你的操作系统是什么，Python 都易于设置。\n* Python 代码使用通用的英语，易于理解。\n* Python 允许你运行错误的代码。\n\
    \    * **为什么这是件好事？**\n    当你学习时，不可避免会出错。Python 会在你运行代码后告诉你错误是什么，帮助你找到问题。\n* Python\
    \ 是一个非常强大的工具，但它也很容易、快速学习，这就是为什么大多数人偏好它的原因。\n\n### 安装\n有预编译的包，以便在 Windows、Linux、UNIX\
    \ 和 Mac OS 等多个操作系统上轻松安装。\n\n如果你访问 `https://www.python.org/downloads/`，可以为你的操作系统选择正确的安装方法。大多数\
    \ Linux 系统都预装了 Python。\n\n本书使用的是 Python 3 版本。\n\n在 Windows 中，一旦安装了 Python，从开始菜单或屏幕上选择\
    \ `Python IDLE` 或 `Python command line/console`。\n\nIDLE 和控制台的区别在于 IDLE 具有图形界面，看起来类似于文本编辑器。在\
    \ Linux、UNIX 和 OS X 中，你可以通过在命令行输入 `Python` 来启动 Python 模拟器。\n\n要选择特定的 Python 版本，输入\
    \ `PythonX`，其中 `X` 是版本号（例如，版本 3 输入“Python3”）。\n\n![](img/00002.jpeg)\n\n## Hello\
    \ World!\n在你编写 Python 代码的大多数时候，会在 IDLE 或任何其他 IDE（如 Eclipse）或 Sublime text 或 Notepad++\
    \ 等文本编辑器中编写脚本。然而，你可以使用 Python 解释器交互式地编写代码，因为它就像一个 UNIX shell。\n\n虽然仅使用解释器就可以创建程序，但强烈建议不要这样做，因为很难将代码保存为脚本以便后续重用。相反，将解释器视为你编程构思的“即时”测试工具。\n\
    \n现在，让我们让解释器输出“Hello World!”。\n\n```\nprint(\"Hello World!\")\n```\n\n### 终端方式\n\
    如上一章所述，使用 `python` 命令从命令行启动解释器。输入以下内容：\n\n```python\nprint(\"hello world!\")\n\
    ```\n\n终端应该看起来如下：\n\n![](img/0004.jpeg)\n\n在上面的代码段中，你可以看到第一行以 `>>>` 开头。这个符号表示你向解释器提供输入的行。注意，一旦你的第一个命令的结果在屏幕上打印出来，解释器就会再次打印\
    \ `>>>`。向解释器发出指令是顺序的。你给出一个指令——等待执行，你输入另一个命令，依此类推。\n\n注意，在本书后面，如果你在代码段中发现 `>>>`\
    \ 符号，意味着你需要在解释器中测试该代码。\n\n在第一行，你输入了一个语句。语句无非是计算机执行某些任务的指令。任务可以是从 `make_a_coffee`\
    \ 到 `launch_a_rocket` 的任何内容。在你的情况下，它是一个简单的 `print` 函数。函数将在本书中进一步介绍。\n\n### 脚本方式\n\
