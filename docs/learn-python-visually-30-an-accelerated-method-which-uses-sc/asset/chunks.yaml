    # 循环


    集合可以用于存储数据，你也可以遍历它们并对每个元素单独进行操作。


    在 Python 中，有两种类型的循环可以使用：`while` 和 `for`。


    `while` 循环只要特定条件为真就会持续重复。


    `while` 循环内部的语句必须缩进，就像其他其他代码块一样。


    循环必须使用 `while` 关键字、布尔语句和冒号来定义。


    布尔语句可以是函数调用、变量或比较语句。


    ![](img/00023.jpeg)


    这段代码将打印数字 1 到 10

    ```python

    1. aps = 0

    2. while aps < 10:  #测试

    3. aps += 1        #计数器

    4. print(aps)      #语句 1

    5. print ("and")    #语句 2

    6. print ("Done")   #循环退出

    ```


    ## While


    Python 提供了 `break` 和 `continue` 语句来对循环进行细细控制。


    ![](img/00024.jpeg)

    ```python

    1. while <test1>:

    2. <statement1>

    3. if <test2>: break  #循环退出，跳过

    4. if <test3>: continue #跳转到顶部 <test1>

    5. else:

    6. <statement2>

    ```


    ## 循环


    ![](img/00025.jpeg)


    你可以使用 `for` 循环遍历集合。假设你有以下列表：


    ```python

    1. a = ["one", "two", "three"]

    ```


    为了打印每个字符串，可以使用此循环：


    ```python

    1. for item in a:

    2. print(item)

    ```


    循环必须使用 `for` 关键字、持有每个元素的变量名、`in` 关键字、集合名称和冒号来定义。`for` 循环内部的语句必须缩进。


    你可以使用 `break` 命令退出循环：


    ```python

    1. numbers = [1, 2, 5, 6, 7, 8, 9]

    2. for number in numbers:

    3. print("Looking at: " + str(number))

    4. if number > 6:

    5. print("Too big: " + str(number) + "!")

    6. break

    ```


    上述代码将输出：

    Looking at: 1

    Looking at: 2

    Looking at: 5

    Looking at: 6

    Too big: 7!


    迭代在 7 处停止，这意味着 8 和 9 没有包含。


    你也可以使用 `continue` 关键字跳过集合中的特定元素：


    ```python

    1. numbers = [1, 6, 7, 8, 9, 2, 5]

    2. for number in numbers:

    3. if number > 6:

    4. continue

    5. print("Looking at: " + str(number))

    ```


    上述代码输出：

    Looking at: 1

    Looking at: 6

    Looking at: 2

    Looking at: 5


    这里我们忽略了 7, 8 和 9。


    字典可以用相同的方式遍历。


    ```python

    1. ages = {

    2. "John": 34,

    3. "Matt": 23,

    4. "Natasha": 27,

    5. "Gabriella": 33

    6. }

    7. for name in ages:

    8. print(name)

    ```


