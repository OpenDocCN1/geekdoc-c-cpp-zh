    # Dictionaries


    A dictionary is a collection of keys and values, which works much the same as
    a list or a tuple. Instead of an integer index, dictionary values can be addressed
    by indices of almost any type.


    Lets create a dictionary with people names as keys and their ages as values:


    ![](images/00022.jpeg)


    ```python

    1. ages = {

    2. "John": 34,

    3. "Matt": 23,

    4. "Natasha": 27,

    5. "Gabriella": 33

    6. }

    ```


    The key-value pairs must be enclosed in curly brackets and separated by commas.
    Keys and values must be separated by a colon.


    The keys in the dictionary must be unique, but the values can be the same. A key
    can be almost any type of variable.


    The following is also a valid dictionary:


    ```python

    1. class SomeClass:

    2. pass

    3. obj1 = SomeClass()

    4. obj2 = SomeClass()

    5. a_dict = {

    6. obj1: 11,

    7. obj2: 23

    8. }

    ```


    You may fetch John’s age the following way:


    ```python

    1. johns_age = ages["John"]

    ```


    In the same way, you can set the value of elements by key:


    ```python

    1. ages["John"] = 999

