- fmt: "\n# 5. invalid: symbol $ in argument’s name\n\n## Exercises\n\n**Problem:**\
    \ Change the function below to return the greeting instead of printing it:\n\n\
    ```python\ndef hi():\n    greeting = \"Hello world!!!\"\n    print(greeting)\n\
    ```\n\n**Answer:**\n\n```python\ndef hi():\n    greeting = \"Hello world!!!\"\n\
    \    return greeting\n```\n\n## If/Else and conditional statements\n\nThere are\
    \ a lot of uses for the simple statements and operations we have covered so far\
    \ in this book. However, the main purpose of any programming is to implement some\
    \ kind of logic.\n\n`if/else` blocks are a core syntax element in Python. They\
    \ let you conditionally control the flow of the program.\n\nIn the following scenario,\
    \ you want to know if your car is travelling too quickly. If you are exceeding\
    \ 100 km/h, the function will print “Too fast!” If you drive below the speed limit,\
    \ the function will print “You are driving below the speed limit. Well done.”\n\
    \nThis is what that code would look like:\n\n```python\ndef drive(car_speed):\n\
    \    if car_speed > 100:\n        print(\"Too fast!\")\n    else:\n        print(\"\
    You are driving below the speed limit. Well done\")\n```\n\n`>>> drive(70)`\n\
    `You are driving below the speed limit. Well done`\n\n`>>> drive(120)`\n`Too fast!`\n\
    \nThere are multiple things to note in the code above.\n\nFirst, the `>` operator.\
    \ It’s a Boolean comparison operator, the same as the one used in maths. It returns\
    \ `True` if the first item is larger than the second, and `False` otherwise.\n\
    \nSecond, the `if/else` syntax. If `is_too_fast` is `True`, the first block of\
    \ code is executed. If not, the second block of code is executed.\n\nThird, the\
    \ indentation. The statements inside the function are indented, and then the statements\
    \ inside the `if/else` block are further indented.\n\n## Boolean expressions\n\
    \n![](images/00016.jpeg)\n\n```python\ngreenApple = 100\nredApple = 135\n\nprint(greenApple\
    \ == redApple)      #test if 100 and 135 are equal\n#False\n\nprint(greenApple\
    \ < redApple)       #test if 100 is less than 135\n#True\n\nprint(greenApple !=\
    \ redApple)      #test if not equal\n#True\n```\n\n`>>> bool(1)`\n`True`\n\n`>>>\
    \ bool(\"\")`\n`False`\n\n`>>> bool(None)`\n`False`\n\n`>>> bool(\"blah\")`\n\
    `True`\n\n`>>> bool(0)`\n`False`\n\n`>>> bool(True)`\n`True`\n\nIn Python any\
    \ value can be interpreted as `True` or `False`. Among the data types values `0`,\
    \ `\"\"` - an empty string, `None` and `False` itself are `False`. Any other value\
    \ is `True`.\n\nYou may check if the value is `True` or `False` by converting\
    \ the value to a boolean type:\n\nAlso there are several built-in comparison operators\
    \ like `>` return `True` or `False` when called. The table below provides an overview\
    \ of these operators.\n\n| Operator | Statement | Statement's return value |\n\
    | --- | --- | --- |\n| Less | `1 < 2` `4 < 3` | `True` `False` |\n| Less or equal\
    \ | `2 <= 2` `4 <= 3` | `True` `False` |\n| Greater | `2 > 1` `3 > 3` | `True`\
    \ `False` |\n| Greater or equal | `2 >= 2` `3 >= 4` | `True` `False` |\n| Equal\
    \ | `\"foo\" == \"foo\"` `0 == 1` | `True` `False` |\n| Not equal | `\"foo\" !=\
    \ \"bar\"` `11 != (10 + 1)` | `True` `False` |\n| And (both parts must be True)\
    \ | `3 and \"foo\"` `None and True` | `True` `False` |\n| Or (one of parts must\
    \ be True) | `1 or None` `None or False` | `True` `False` |\n| Not (opposite to\
    \ the target expression) | `not None` `not True` | `True` `False` |\n\nNote, comparison\
    \ operators have higher precedence than the logical operators `and`, `or` and\
    \ `not`. All maths operators have higher precedence than comparison operators.\
    \ Here are several compound examples to illustrate how to use boolean operators:\n\
    \n`>>> 2 * 6 + 1 < 2 * (6 + 1)`\n`True`\n\n`>>> 2 * 6 + 1 == 2 * (6 + 1) - 1`\n\
    `True`\n\n`>>> 2 ** 3 == 8 and 2 ** 2 == 16`\n`False`\n\n`>>> (2 ** 2 == 4 and\
    \ False) or (not (16 < 15 or == 3))`\n`True`\n\n## Alternative branches\n\nIn\
    \ many cases the logic can be more sophisticated than just two conditions. Let’s\
    \ modify the `speed` function we created to respond to speeds over 200 km/h by\
    \ printing “You are insane, man!!!” and printing “The speed for your car.” when\
    \ speed is between 70 and 80 km/h.\n\n```python\ndef drive(car_speed):\n    if\
    \ car_speed > 200:\n        print(\"You are insane, man!!!\")\n    elif car_speed\
    \ > 100:\n        print(\"Too fast!\")\n    elif car_speed > 70 and car_speed\
    \ < 80:\n        print(\"The optimal speed for your car.\")\n    else:\n     \
    \   print(\"You are driving below the limit. Well done\")\n```\n\nYou might notice\
    \ that in the code above we don’t use a separate variable. Instead, we place the\
    \ comparison operator inline with the `if` statement. We also use the keyword\
    \ `elif`. This defines an alternate branch. If more than one branch is True, only\
    \ the first one will be used. For example:\n\n```python\na = 10\nif a > 1:\n \
    \   print(\"Big\")\nelif a > 5:\n    print(\"Really big\")\nelif a == 10:\n  \
    \  print(\"Approaching enorm\")\nelif a > 10:\n    print(\"Enormous!\")\n```\n\
    This code will only print “Big”, and the other statements will be ignored.\n\n\
    ## Quiz\n\nTry to answer these questions without the interpreter.\n\n1. What are\
    \ the boolean values - `bool(a)` - for the following variables:\n   `a = False`\n\
    \   `a = \"0\"`\n   `a = 0 * 18`\n   `a = \"None\"`\n2. What is the output of\
    \ the following statement: `(2 ** 2 == 4 and False) or (not (16 < 15 or == 3))`\n\
    3. Name Python’s logical operators.\n4. What will be printed as a result of the\
    \ following code?\n   ```python\n   x = 5\n   if x == 25:\n       print(\"Quarter\"\
    )\n   elif x == 10:\n       print(\"Dime\")\n   elif x == 5:\n       print(\"\
    Nickel\")\n   elif x == 1:\n       print(\"Penny\")\n   else:\n       print(\"\
    Not a coin\")\n   ```\n5. Suppose `x=5, y=0`, and `z=1`. Are the following expressions\
    \ True or False?\n   `x == 0`\n   `x >= y`\n   `2 + 3 == x and y < 1`\n   `not\
    \ (z == 0 or y == 0)`\n6. `x = 3`. What does the following code print?\n   ```python\n\
    \   x = 0\n   if x != 0:\n       print(\"x is nonzero\")\n   ```\n\n**Answer:**\n\
    1. a) False, b) True - this is a string with a character 0 not an integer, c)\
    \ False - 0 * 18 is 0, d) True - again “None” is a string not the actual None.\n\
    2. False - the expression inside the “not” statement is True, making that statement\
    \ False, and the first statement is also False.\n3. and, or, not.\n4. Nickel.\
    \ `x == 25` and `x == 10` are False, so the first True statement is `x == 5`.\n\
    5. a) False. The operator `==` tests for equality, and 5 does not equal 0. b)\
    \ True. 5 is greater than or equal to 0. c) True. Both `2 + 3 == x` and `y < 1`\
    \ are True. d) False. `y == 0` is True, so `z == 0 or y == 0` is True, and its\
    \ negation is False.\n6. c) True. The `=` operator assigns the value 3 to `x`,\
    \ and the value 3 evaluates to True.\n7. Nothing. The expression is False, so\
    \ the code is not executed.\n\n## Exercises\n\n**Problem:** Write an expression\
    \ that tests if a variable `x` is less than or equal to 100.\n**Answer:** `x <=\
    \ 100`\n\n## Exercises\n\n**Problem:** Write an expression that tests if a variable\
    \ `x` is between 3 and 10, inclusive.\n**Answer:** `x >= 3 and x <= 10`\n\n##\
    \ Exercises\n\n**Problem:** Write an expression that tests if a variable ![](00017.jpeg)\
    \ is even or a multiple of 5.\n**Answer:** `(x % 2 == 0) or (x % 5 == 0)`\n\n\
    ## Exercises\n\n**Problem:**\n\nThere is a function with the following declaration:\
    \ `person_is_old(age)` which returns True or False based on the incoming age as\
