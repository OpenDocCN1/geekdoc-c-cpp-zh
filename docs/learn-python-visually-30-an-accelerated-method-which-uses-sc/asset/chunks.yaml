    3. 如何跳过 `for` 循环中的特定元素？提供两种方案。


    答案：

    1. `while`

    2. 让 `while` 循环条件变为 False 或使用 `break` 关键字。

    3. 在 `if` 语句中隔离代码或使用 `continue` 关键字。


