    \ Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef hello():\n    return\
    \ \"Hello World!\"\n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n\
    ```\n\nand run it:\n\n```bash\npython hello.py\n```\n\nIf you open your web browser\
    \ and type:\n\n`http://localhost:5000`\n\nyou should be greeted with the warming\
    \ sight of “Hello World!”\n\nCongratulations, you have just created your first\
    \ website with Flask.\n\n## Let’s walk through hello.py line by line.\n\n1. First,\
    \ the `Flask` class is imported from the `flask` module.\n2. Then, an instance\
    \ of the `Flask` class called `app` is created.\n3. `@app.route(\"/\")` tells\
    \ `Flask` the URL that will trigger the method below it.\n4. The `hello()` method\
    \ is defined, which returns the string “Hello World!”\n5. `app.run()` starts the\
    \ HTTP server.\n\n## Create a new file called `test.py`:\n\n```python\nfrom flask\
    \ import Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef root():\n  \
    \  return \"Request Path is: \" + request.path\n\n@app.route(\"/test/\")\ndef\
    \ test():\n    return \"Request Path is \" + request.path\n\nif __name__ == \"\
    __main__\":\n    app.run(debug = True)\n```\n\nYou can see that a `request` module\
    \ was imported from `flask`. This object represents an HTTP request sent by the\
    \ client and received by the server, which contains the path of the requested\
    \ page, the type of the request, and other information about the client and the\
    \ transmitted data.\n\nIn this case, you have used the `request` object to return\
    \ the path of the page.\n\nFlask offers an easy way to answer to different HTTP\
    \ methods:\n\n1. `@app.route(\"/data\", methods=['GET'])`\n2. `def show_data():`\n\
    3. `....`\n4. `@app.route(\"/data\", methods=['POST'])`\n5. `def handle_data():`\n\
    6. `....`\n7. `@app.route(\"/user/<username>\")`\n8. `def greet_user(username):`\n\
    9. `return \"Hello \" + username`\n\nYou can use sections of the webpage’s URL\
