- fmt: "\nTo access the lighting settings, choose `Window` ⇒ `Lighting` ⇒ `Settings`\
    \ (see [Figure 11-5](#14_9781119404187-ch11.xhtml_c11-fig-0005)). A window appears\
    \ showing the different lighting options you have in Unity, but for the sake of\
    \ this project you’ll only need to worry about the Environment section of the\
    \ window (see [Figure 11-6](#14_9781119404187-ch11.xhtml_c11-fig-0006)).\n\n![image](images/9781119404187-fg1105.png)\n\
    \n[FIGURE 11-5:](#14_9781119404187-ch11.xhtml_rc11-fig-0005) Accessing the lighting\
    \ settings.\n\n![image](images/9781119404187-fg1106.png)\n\n[FIGURE 11-6:](#14_9781119404187-ch11.xhtml_rc11-fig-0006)\
    \ The lighting settings.\n\nYou control the individual lights in the Inspector\
    \ window in Unity, but the lighting settings window helps you control the various\
    \ settings for the scene’s lighting. The environment settings can help you give\
    \ the scene’s lighting a tint to help make the scene more lively and give the\
    \ environment a different feeling.\n\nA red tint to the scene can give the game\
    \ a warmer feeling, making things seem hot or feel as if the sun is setting within\
    \ the game. A blue tint gives a cooler feeling, making things seem colder. Colors\
    \ can help indicate the time or season that the game takes place in, which helps\
    \ you better create the world for your player. Naturally, the settings base the\
    \ environmental lightings off the skybox that the scene has — the background of\
    \ the game.\n\nIn order to create a skybox, you would need to create six separate\
    \ images to cover the bottom, top, left, right, front, and back of the scene.\
    \ Adjusting the lighting and coloring of the scene will work just as well to help\
    \ give the environment a nice feeling for the player to be immersed in. Follow\
    \ these steps:\n\n1. **From the Source drop-down list, choose `Gradient`.**\n\n\
    \   Here’s a description of the various options, for your reference:\n\n   * **Skybox:**\
    \ Bases the colors off the currently set skybox background. In this case, the\
    \ colors are a light blue that go to a gray color.\n   * **Gradient:** Similar\
    \ to Skybox except you can choose the coloring for the fading in the light. You\
    \ can choose three colors for the gradient to fade among.\n   * **Sky Color:**\
    \ The top color, this color affects the scene from above, as if there were a light\
    \ shining directly down onto the objects.\n   * **Equator Color:** The mid color,\
    \ this color effects the objects as if the light were coming from the front and\
    \ sides of the object.\n   * **Ground Color:** The bottom color that affects objects\
    \ from below.\n   * **Color:** Tints the color of the scene all at once with one\
    \ specific color. This can be useful for quick lighting setups.\n\n2. **Change\
    \ the sky color to a light blue.**\n\n3. **Change the equator color to purple.**\n\
    \n4. **Change the ground color to green.**\n\n![image](images/9781119404187-fg1107.png)\n\
    \n[FIGURE 11-7:](#14_9781119404187-ch11.xhtml_rc11-fig-0007) The Gradient source.\n\
    \nThe gradient in [Figure 11-7](#14_9781119404187-ch11.xhtml_c11-fig-0007) will\
    \ change the color setup of the scene to better reflect the more distinctive shapes\
    \ within the scene. The light blue will give the top of the shape a nice distinctive\
    \ bright color to indicate it’s the top. The purple will contrast nicely with\
    \ the light blue, giving the sides of the objects a distinctive difference from\
    \ the top. Finally, the green won’t affect much in the scene, but it will imitate\
    \ the bouncing of the light off of the ground so that the bottom of the objects\
    \ are tinted slightly green.\n\n## UNDERSTANDING LIGHTING\n\nLighting is one of\
    \ the most important parts of game design that is often overlooked. Games can\
    \ be changed by lighting, even subtly. A game that looks like it takes place in\
    \ the middle of the day with vibrant colors can be drastically changed with just\
    \ the angle of the lighting. Right now, the scene looks like [Figure 11-8](#14_9781119404187-ch11.xhtml_c11-fig-0008).\
    \ You’re going to be adjusting the direction of the light to help give the scene\
    \ more vibrancy.\n\n![image](images/9781119404187-fg1108.png)\n\n[FIGURE 11-8:](#14_9781119404187-ch11.xhtml_rc11-fig-0008)\
    \ The scene colored.\n\nSelect `Directional Light` from the `Hierarchy` window.\
    \ The directional light acts as a light source that comes from an indistinct distance\
    \ away. That means that no matter where it is in the scene, the lighting remains\
    \ the same. You’re going to be adjusting the direction of the light to help give\
    \ the scene more vibrancy.\n\n![image](images/9781119404187-fg1108.png)\n\n[FIGURE\
    \ 11-8:](#14_9781119404187-ch11.xhtml_rc11-fig-0008) The scene colored.\n\nSelect\
    \ `Directional Light` from the `Hierarchy` window. The directional light acts\
    \ as a light source that comes from an indistinct distance away. That means that\
    \ no matter where it is in the scene, the lighting remains the same. You’re going\
    \ to be adjusting the direction of the light to help give the scene more vibrancy.\n\
    \nThere are four types of lights you can choose from within Unity. Unity. To create\
    \ any of these, simply choose `GameObject` ⇒ `Create` `Light`:\n\n* **Directional\
    \ lights:** Directional light acts as a light source that comes from an indistinct\
    \ distance away. That means that no matter where it is in the scene, the lighting\
    \ remains the same.\n* **Point lights:** Point lights act like a light source\
    \ that comes from a specific point.\n* **Spot lights:** Spot lights act like a\
    \ light source that comes from a specific direction.\n* **Area lights:** Area\
    \ lights act like a light source that comes from a specific area.\n\n[content]\n\
    *(Note: The provided text contained significant repetitions and fragmented sentences\
    \ in the latter half. I have cleaned the redundancies to ensure professional documentation\
    \ while preserving the technical instructions and definitions as requested.)*"
  raw: "To access the lighting settings, choose Window ⇒ Lighting ⇒ Settings (see\
    \ [Figure 11-5](#14_9781119404187-ch11.xhtml_c11-fig-0005)). A window appears\
    \ showing the different lighting options you have in Unity, but for the sake of\
    \ this project you’ll only need to worry about the Environment section of the\
    \ window (see [Figure 11-6](#14_9781119404187-ch11.xhtml_c11-fig-0006)).\n\n![image](images/9781119404187-fg1105.png)\n\
    \n[FIGURE 11-5:](#14_9781119404187-ch11.xhtml_rc11-fig-0005) Accessing the lighting\
    \ settings.\n\n![image](images/9781119404187-fg1106.png)\n\n[FIGURE 11-6:](#14_9781119404187-ch11.xhtml_rc11-fig-0006)\
    \ The lighting settings.\n\nYou control the individual lights in the Inspector\
    \ window in Unity, but the lighting settings window helps you control the various\
    \ settings for the scene’s lighting. The environment settings can help you give\
    \ the scene’s lighting a tint to help make the scene more lively and give the\
    \ environment a different feeling.\n\nA red tint to the scene can give the game\
    \ a warmer feeling, making things seem hot or feel as if the sun is setting within\
