  trans: "\n现在是时候将你的角色导入到 Blender 了。请按照以下步骤操作：\n\n1. **打开 Unity 并进入 Project（项目）窗口中的\
    \ Prefabs 文件夹。**\n2. **在 Mac 上打开 Finder 窗口，或在 PC 上打开 Windows 资源管理器。**\n3. **将\
    \ FBX 文件从 Blender 文件夹直接拖入 Prefabs 文件夹。**\n   这将创建一个角色的预制体（prefab）。在角色预制体的下拉菜单中包含了角色的所有不同组件。\n\
    4. **将预制体拖到屏幕上以创建新角色。**\n   你在图 12-5 中首先会注意到的是角色与场景其他部分相比有多大。这是因为 Unity 的单位是 Blender\
    \ 单位的一半。\n5. **要修复此导入错误，请选择你刚刚创建的玩家角色预制体。**\n   在 Inspector（检查器）窗口中，你会发现窗口已变为\
    \ Import Setting（导入设置）。当你导入动画或外部 3D 对象时，选择预制体就会打开导入设置窗口。你将在本章稍后深入介绍 Rig 和 Animation\
    \ 标签。\n6. **点击 Model（模型）标签页。**\n   你会看到许多可以勾选或更改的设置。\n7. **将 Scale Factor（缩放因子）更改为\
    \ 0.5。**\n8. **确保勾选所有复框：**\n   * Use File Scale（使用文件缩放）\n   * Read/Write Enables（启用读/写）\n\
    \   * Import BlendShapes（导入混合形状）\n   * Generate Colliders（生成碰撞器）\n   * Weld Vertices（焊接顶点）\n\
    \   * Import Visibility（导入可见性）\n9. **滚动到模型标签页中的 Materials（材质）部分，并勾选 Import Materials（导入材质）。**\n\
    10. **将 Material Naming（材质命名）下拉菜单更改为 Model Name + Model’s Matter（模型名称 + 模型材质）。**\n\
    \    这将防止多个文件更改材质以匹配具有相似名称的其他材质。\n\n![image](img/9781119404187-fg1205.png)\n\n\
    FIGURE 12-5: 场景中的玩家角色。\n\n### 设置角色\n\n由于你制作了动画，当玩家角色开始时，它会自动移动到点 (0,0,0)。Unity\
    \ 读取动画导致会导致或对象重置到它们相对于 Unity 中心点移动的位置。解决这个问题最简单的方法是给动画提供一个新的中心点作为其基准。这是通过父子关系（parenting）实现的。\n\
    \n### 设置动画\n\n现在你会发现，当你点击 Play 按钮运行游戏时，动画要么只播放一次不再播放，要么根本不播放。这是因为你还没有为角色设置动画。这需要你使用预制体\
    \ Inspector 窗口中的 Rig 和 Animation 标签。\n\n1. **打开 Inspector 窗口中的 Rig 标签页。**\n  \
    \ 下拉菜单中有四种动画类型供选择：\n   * None（无）：当你没有导入动画时。\n   * Legacy（旧版）：导入动画的旧方法。这种方法与动画控制器（animation\
    \ controller）无法正常工作，因此不适合玩家角色。\n   * Generic（通用）：基础导入方法，在导入动画的同时保留代码，以便 Unity\
    \ 可以根据需要读取并修改代码。\n   * Humanoid（人形）：导入具有骨骼的人形角色，通过在网格上附加骨骼或骨架使不同部分能够弯曲。\n2. **对于此项目，选择\
    \ Generic 类型。**\n3. **将 Avatar Definition（化身定义）更改为 Create For This Model（为此模型创建）。**\n\
    4. **将 Root Node（根节点）更改为 None（无）。**\n5. **点击 Animations（动画）标签页（参见图 12-9）。**\n\
    6. **滚动到 Clips（片段）部分。**\n   看到大量的选项和分解。这些只是 Unity 可以识别的动画中的不同动画部分。有时这是准确的，但大多数时候，我发现自己处理更可靠。\n\
    7. **通过选择它们并点击右角的减号（–）删除所有选项和分解。**\n8. **点击一次加号 (+）。**\n9. **对于 Source Take（源采样）下拉菜单，选择\
    \ Eye control|Eye controlAction。**\n10. **对于第一个动画，将片段名称更改为 Idle（闲）。**\n    Timeline（时间线）上的蓝色高亮部分表示片段使用的动画部分。\n\
    11. **调整 Timeline 以仅包含角色的 Idle 动画。**\n    我的动画从 0 开始到 154 结束。\n12. **按照第 8 至 11\
    \ 步操作行走和跳动画，分别命名为 Walking（行走）和 Jump（跳跃），如图 12-10 所示。\n\n![image](img/9781119404187-fg1209.png)\n\
    FIGURE 12-9: 第一个动画。\n\n![image](img/9781119404187-fg1210.png)\nFIGURE 12-10: 动画。\n\
    \n在完成设置后，你需要确保它正常工作：\n\n1. **在 Hierarchy（层级）中选择角色。**\n   你会注意到有一个动画组件。\n2. **选择\
    \ Animation。**\n   这将打开 Animator 窗口。\n3. **双击 Idle。**\n   这将设置 Idle 为起始。\n4. **从\
    \ Animations 下拉菜单选择 Size。**\n   你会看到下方有一个数字。\n5. **对于动画，将数量更改为 3。**\n6. **确保元素为\
    \ Idle、Walking 和 Jump。**\n\n![image](img/9781119404187-fg1211.png)\nFIGURE 12-11:\
    \ 选择动画\n\n### 创建角色的动画控制器\n\n角色现在设置了动画，但当你点击 Play 时什么都没有发生。这是因为没有告诉游戏。\n\n为了控制动画以便角色移动时播放正确的动画，你需要一个动画控制器。动画控制器告诉角色如何相互作用。\n\
    \n要像图 12-12 所示那样创建动画控制器，在 Project 窗口中右键点击。你可以在任何文件夹中创建控制器，但为了方便，我喜欢在 Prefabs 文件夹或直接在\
    \ assets 文件夹中创建。Create Animator Controller。将其命名为 `Character_animator`。双击此新控制器将在\
    \ Scene 窗口中打开一个名为 Animator 的新标签。\n\n![image](img/9781119404187-fg1212.png)\nFIGURE\
    \ 12-12: 创建动画控制器。\n\n打开控制器窗口后，你会发现它是空的，除了两个框：Any State 和 Entry。要修复此，打开你的玩家角色预制体并滚动。在预制体的底部，你会看到对应角色的不同动画的三个标签。将这三个全部拖入\
    \ Animator 窗口。会出现三个新框，每个对应一个不同的片段（参见图 12-13）。\n\n![image](img/9781119404187-fg1213.png)\n\
    FIGURE 12-13: Animator 中的不同片段。\n\n"
- fmt: "\nYou’ll also notice that there is now an orange arrow pointing from Entry\
    \ to Idle. This indicates that in the animator’s view, the Idle animation is the\
    \ primary animation for the character, which is useful because for your game this\
    \ is the case.\n\nAfter you create these new boxes for each of the animations,\
    \ move them apart from each other so that you can clearly read each of them and\
    \ there is some space in between them all. Make sure that the default state (currently\
    \ Idle) is the one that is closest to Entry and Any State, with the other two\
    \ below or to the side of Idle, with Idle between them (see [Figure 12-14](#15_9781119404187-ch12.xhtml_c12-fig-0014)).\
    \ This will do nothing to the game itself but will make it easier visually to\
    \ navigate.\n\nNow you have to determine how each of these states relates to each\
    \ other:\n\n1.  **Right-click Any State and choose Make Transition.**\n2.  **Select\
    \ Idle After.**\n    An arrow should now point from Any State to Idle.\n3.  **Right-click\
    \ Idle and choose Make Transition.**\n4.  **Select Jump.**\n    This will make\
    \ it so that the character can transition from the Idle animation to the Jump\
    \ animation.\n5.  **Repeat Steps 3 and 4 for Walking instead of Jump.**\n\n![image](images/9781119404187-fg1214.png)\n\
    \n[FIGURE 12-14:](#15_9781119404187-ch12.xhtml_rc12-fig-0014) Creating the transitions.\n\
    \nAfter you create all these transitions (see [Figure 12-14](#15_9781119404187-ch12.xhtml_c12-fig-0014)),\
    \ you also need to make it so that the character can transition back from Walking\
    \ and Jump to Idle, as well as from Walking to Jump and vice versa. Create transitions\
    \ as you did in the steps earlier, but instead of doing it from Idle, do it from\
    \ Walking and Jump to Idle and to each other.\n\nThis will create the transitions,\
    \ so the animator knows how each of the animations relate to each other, but there\
    \ is still nothing to indicate when these animations happen. As of right now,\
    \ the only animation that will play is the Idle animation. You need to create\
    \ triggers, as in [Figure 12-15](#15_9781119404187-ch12.xhtml_c12-fig-0015), to\
    \ indicate when the controller will work.\n\n![image](images/9781119404187-fg1215.png)\n\
    \n[FIGURE 12-15:](#15_9781119404187-ch12.xhtml_rc12-fig-0015) Creating the trigger.\n\
    \nIn the Animator window, click the Parameters tab. On the Parameters tab, you’ll\
    \ see List Is Empty, indicating there is nothing that is affecting the animations\
    \ just yet. Click the plus sign (+) and select Trigger. This will create a trigger\
    \ for the animations to be affected by. Name this trigger Jump and then create\
    \ another one named Walk.\n\nAfter you create these triggers, you have to indicate\
    \ when they’re used (see [Figure 12-16](#15_9781119404187-ch12.xhtml_c12-fig-0016)):\n\
    \n1.  **Select one of the arrows leading to Jump.**\n    In the Inspector window,\
    \ you see Transitions and Conditions. In Conditions, it says *non* with a drop-down\
    \ menu.\n2.  **From the Non- drop-down menu, select Jump.**\n3.  **Repeat steps\
    \ 1 and 2 for all the arrows leading to Jump.**\n4.  **Repeat steps 1 and 2 for\
    \ all the arrows leading to Walking.**\n5.  **Substitute Jump for Walk.**\n\n\
    ![image](images/9781119404187-fg1216.png)\n\n[FIGURE 12-16:](#15_9781119404187-ch12.xhtml_rc12-fig-0016)\
    \ Setting the conditions.\n\nThis will make it so that you can transition from\
    \ the idle pose to the jump and walk poses easily. The problem is that there is\
    \ no way to transition from those poses back to idle. So, create a third trigger\
    \ named Idle and repeat the steps to link the idle to the other poses.\n\n###\
    \ CODING THE CONTROLLER\n\nIt always comes back to coding in computers and gaming.\
    \ Now that you’ve created the controller and the character, you have to link the\
    \ two so that the character’s animations can be properly controlled by the animator\
    \ controller and the animator controller can be linked to certain button presses\
    \ on the keyboard. The code for the controller is actually super simple compared\
    \ to some of the codes from earlier chapters.\n\nBefore you begin coding, you\
    \ have to link the controller to the player character. To do this, select the\
    \ player character on the Hierarchy and in the Inspector select Add Component.\
    \ In the Miscellaneous menu, you’ll find an `Animator` component. After you add\
    \ the component, inside the component you’ll see a `controller target`. Select\
    \ the circle next to it, and select the animator that you just finished creating.\
    \ This will link the controller to the character.\n\nAfter you link the controller\
    \ with the character, go into the code folder in the assets.\n\n```csharp\nvoid\
    \ Start() {\n    anim = GetComponent<Animator>();\n}\n\nvoid Update() {\n    if\
    \ (Input.GetKeyDown(KeyCode.Space)) {\n        anim.SetTrigger(\"Jump\");\n  \
    \  }\n    if (Input.GetKeyDown(KeyCode.W)) {\n        anim.SetTrigger(\"Walk\"\
    );\n    }\n    if (Input.GetKeyDown(KeyCode.A)) {\n        anim.SetTrigger(\"\
    Left\");\n    }\n    if (Input.GetKeyDown(KeyCode.D)) {\n        anim.SetTrigger(\"\
    Right\");\n    }\n    if (!Input.anyKey) {\n        anim.SetTrigger(\"Idle\");\n\
    \    }\n}\n```\n"
  raw: "You’ll also notice that there is now an orange arrow pointing from Entry to\
    \ Idle. This indicates that in the animator’s view, the Idle animation is the\
    \ primary animation for the character, which is useful because for your game this\
    \ is the case.\n\nAfter you create these new boxes for each of the animations,\
    \ move them apart from each other so that you can clearly read each of them and\
    \ there is some space in between them all. Make sure that the default state (currently\
    \ Idle) is the one that is closest to Entry and Any State, with the other two\
    \ below or to the side of Idle, with Idle between them (see [Figure 12-14](#15_9781119404187-ch12.xhtml_c12-fig-0014)).\
    \ This will do nothing to the game itself but will make it easier visually to\
    \ navigate.\n\nNow you have to determine how each of these states relates to each\
    \ other:\n\n1.  **Right-click Any State and choose Make Transition.**\n\n2.  **Select\
    \ Idle After.**\n\n    An arrow should now point from Any State to Idle.\n\n3.\
    \  **Right-click Idle and choose Make Transition.**\n\n4.  **Select Jump.**\n\n\
    \    This will make it so that the character can transition from the Idle animation\
    \ to the Jump animation.\n\n5.  **Repeat Steps 3 and 4 for Walking instead of\
    \ Jump.**\n\n![image](images/9781119404187-fg1214.png)\n\n[FIGURE 12-14:](#15_9781119404187-ch12.xhtml_rc12-fig-0014)\
    \ Creating the transitions.\n\nAfter you create all these transitions (see [Figure\
    \ 12-14](#15_9781119404187-ch12.xhtml_c12-fig-0014)), you also need to make it\
    \ so that the character can transition back from Walking and Jump to Idle, as\
    \ well as from Walking to Jump and vice versa. Create transitions as you did in\
    \ the steps earlier, but instead of doing it from Idle, do it from Walking and\
    \ Jump to Idle and to each other.\n\nThis will create the transitions, so the\
    \ animator knows how each of the animations relate to each other, but there is\
    \ still nothing to indicate when these animations happen. As of right now, the\
    \ only animation that will play is the Idle animation. You need to create triggers,\
    \ as in [Figure 12-15](#15_9781119404187-ch12.xhtml_c12-fig-0015), to indicate\
    \ when the controller will work.\n\n![image](images/9781119404187-fg1215.png)\n\
    \n[FIGURE 12-15:](#15_9781119404187-ch12.xhtml_rc12-fig-0015) Creating the trigger.\n\
    \nIn the Animator window, click the Parameters tab. On the Parameters tab, you’ll\
    \ see List Is Empty, indicating there is nothing that is affecting the animations\
    \ just yet. Click the plus sign (+) and select Trigger. This will create a trigger\
    \ for the animations to be affected by. Name this trigger Jump and then create\
    \ another one named Walk.\n\nAfter you create these triggers, you have to indicate\
    \ when they’re used (see [Figure 12-16](#15_9781119404187-ch12.xhtml_c12-fig-0016)):\n\
    \n1.  **Select one of the arrows leading to Jump.**\n\n    In the Inspector window,\
    \ you see Transitions and Conditions. In Conditions, it says *non*- with a drop-down\
    \ menu.\n\n2.  **From the Non- drop-down menu, select Jump.**\n\n3.  **Repeat\
    \ steps 1 and 2 for all the arrows leading to Jump.**\n\n4.  **Repeat steps 1\
    \ and 2 for all the arrows leading to Walking.**\n\n5.  **Substitute Jump for\
    \ Walk.**\n\n![image](images/9781119404187-fg1216.png)\n\n[FIGURE 12-16:](#15_9781119404187-ch12.xhtml_rc12-fig-0016)\
    \ Setting the conditions.\n\nThis will make it so that you can transition from\
    \ the idle pose to the jump and walk poses easily. The problem is that there is\
    \ no way to transition from those poses back to idle. So, create a third trigger\
    \ named Idle and repeat the steps to link the idle to the other poses.\n\n###\
    \ CODING THE CONTROLLER\n\nIt always comes back to coding in computers and gaming.\
    \ Now that you’ve created the controller and the character, you have to link the\
    \ two so that the character’s animations can be properly controlled by the animator\
    \ controller and the animator controller can be linked to certain button presses\
    \ on the keyboard. The code for the controller is actually super simple compared\
    \ to some of the codes from earlier chapters.\n\nBefore you begin coding, you\
    \ have to link the controller to the player character. To do this, select the\
    \ player character on the Hierarchy and in the Inspector select Add Component.\
    \ In the Miscellaneous menu, you’ll find an Animator component. After you add\
    \ the component, inside the component you’ll see a controller target. Select the\
    \ circle next to it, and select the animator that you just finished creating.\
    \ This will link the controller to the character.\n\nAfter you link the controller\
    \ with the character, go into the code folder in the assets and create a new code\
    \ named Animat. This will act as the animation code for your player character.\
    \ Attach it to the player character, and open up the code.\n\nYou’ll open a blank\
    \ code. Delete all the grayed-out comments and change `void Update` to `void FixedUpdate`.\
    \ This will set up the code for what you need to control the character’s animations.\
    \ Then follow these steps:\n\n1.  **Above** `void Start ()`**, add** `Animator\
    \ anim;`**.**\n\n    This will indicate the type of code that `anim` is. This\
    \ tells the code that `anim` controls an animator and will affect it directly.\n\
    \n2.  **Inside** `void Start ()` **add** `anim = GetComponent<Animator> ();`**.**\n\
    \n    This tells the code that when the code begins the `anim` will access the\
    \ specific component within the object that is an Animator. In this case, the\
    \ animator is the `player_controller` that you made earlier.\n\n    Let’s say\
    \ you wanted to make multiple characters that move at once. Instead of needing\
    \ different codes for each of them, this code can work for all of them because\
    \ it doesn’t specify a specific animator. Instead, it just goes off of the component.\n\
    \n3.  **Inside** `FixedUpdate`**, you’ll add several** `if` **statements:**\n\n\
    \    `if (Input.GetKeyDown (KeyCode.Space)) { anim.SetTrigger (\"Jump\"); }`\n\
    \n    This will make it so that if the spacebar is pressed, the code will send\
    \ a message to the animator to activate the Jump trigger. This will cause the\
    \ jump animation to play.\n\n    `if (Input.GetKeyDown (KeyCode.W)) { anim.SetTrigger\
    \ (\"Walk\"); }`\n\n    This will make it so that when the W key is pressed, the\
    \ character’s walk trigger will activate, causing the walk animation to begin.\
    \ Repeat this code three more times for the different movement keys (A, S, and\
    \ D) in place of W.\n\n    `if (Input.anyKey == false) { anim.SetTrigger (\"Idle\"\
    ); }`\n\n    This code is the odd code in the bunch. Although the other codes\
    \ trigger when a specific button is clicked, this code only activates when no\
    \ button is being clicked. When nothing is being touched, the Idle trigger activates\
    \ putting the character into the Idle animation.\n\nAfter you finish the coding\
    \ (see [Figure 12-17](#15_9781119404187-ch12.xhtml_c12-fig-0017)), go into the\
    \ prefab for player character and go into the Inspector. Click the Animation tab\
    \ and make sure that all of the clips have Loop Time checked so that the player\
    \ will continuously repeat the motion as long as the key is held.\n\n![image](images/9781119404187-fg1217.png)\n\
    \n[FIGURE 12-17:](#15_9781119404187-ch12.xhtml_rc12-fig-0017) The finished code.\n\
    \nSave your project and then test the animation by playing the game. The code\
    \ should cause the characters to move and animate on the key presses. If they\
    \ don’t, check back through the codes to see if you missed anything.\n\n## IMPORTING\
    \ THE OTHER CHARACTERS AND OBJECTS\n\nThe player character is easily the hardest\
    \ character to import into Unity. The rest of the characters are fairly straightforward\
    \ because they don’t use shape keys or need a controller for their animations.\
    \ First up: the enemy grunt.\n\n### IMPORTING THE ENEMY GRUNT\n\nTo import the\
    \ enemy grunt (see [Figure 12-18](#15_9781119404187-ch12.xhtml_c12-fig-0018)),\
    \ follow these steps:\n\n![image](images/9781119404187-fg1218.png)\n\n[FIGURE\
    \ 12-18:](#15_9781119404187-ch12.xhtml_rc12-fig-0018) The enemy grunt.\n\n1. \
    \ **Delete the enemy grunt stand-ins that you already made, and replace them with\
    \ empties in their spots.**"
