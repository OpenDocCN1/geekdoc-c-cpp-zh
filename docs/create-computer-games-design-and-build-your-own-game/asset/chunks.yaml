  trans: '

    我也必须感谢 Rob Kissner。不感谢他似乎太不公平。Rob 和他的公司 Digital Arts Experience 是我之所以能写这本书的原因。我记得当
    Rob 找我写写这本书时，“嘿，Pat，你了解 Unity 吗？你能就它写一本书吗？”在整个过程中，Rob 一直都在鼓励我，每当我为无法按时完成章节而抓狂时，他总是带着微笑倾听，并准备好讲个冷笑话。Rob，有太多的事情要感谢你，说你是我遇到过最棒的人之一都太保守了。谢谢你，Bert，所做的一切。


    感谢 Shela 在我写整本书期间一直陪着我，并总是假装对《五夜惊魂》（Five Nights at Freddy’s）的游戏机制如何营造出游戏中的无助感并帮助强调情境的恐怖性非常感兴趣。Shela，在我最需要你的时候你一直在那里，非常感谢你的倾听。你像我这样的人能要求的最完美的伙伴。从在我汽水喝完后及时加满，到在我写了漫长的一天后给我一个拥抱，你所做的一切都是特别且重要的。没有语言可以描述你为我所的一切。你是我世界上最好的朋友，我爱你。


    最后，感谢 Elizabeth Kuball 让我听起来比我实际上更聪明。你是这本书之所以具有基本可读性的原因，我认为没有足够的语言来描述我对于你处理我在写作期间遇到的每一个延迟和问题有多么感激。我感到非常开心和庆幸，能够与你合作来帮助这本书变为现实。


    ## 出版者致


    **执行编辑：** Steven Hayes


    **项目编辑：** Elizabeth Kuball


    **高级编辑助理：** Cherie Case


