    \ look.\n\n![image](images/9781119404187-fg0309.png)\n\n[FIGURE 3-9:](#06_9781119404187-ch03.xhtml_rc03-fig-0009)\
    \ Level 1 with stairs.\n\nYou’ll immediately notice that the stairs are too big\
