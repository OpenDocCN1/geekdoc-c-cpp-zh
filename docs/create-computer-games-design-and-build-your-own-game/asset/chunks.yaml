  raw: "1.  **Click the Material tab in the Properties section.**\n\n2.  **If no material\
    \ is available, click the plus sign (+) to the right of the material box. If there\
    \ is a material, skip to Step 4.**\n\n    After you press the plus sign (+), you’ll\
    \ see that a new empty material has been made.\n\n3.  **Fill in this new empty\
    \ material by clicking the New button below the material window.**\n\n    This\
    \ will create a basic Lambert material.\n\n    Below the Preview drop-down, you’ll\
    \ see Diffuse and Specular. Diffuse is the color of the object; Specular is the\
    \ shine of your object.\n\n4.  **Next to Diffuse, you’ll see a drop-down menu.\
    \ Clicking this drop-down menu will show all the different types of materials.\
    \ Right now just stick with Lambert as a material, but keep in mind that each\
    \ of the different materials renders slightly differently and can create different\
    \ effects. The intensity is just how rich the color is.**\n\n5.  **Change the\
    \ Specular color so that the object’s shine isn’t just white.**\n\n    Try changing\
    \ it to a light blue color to match the character’s coloring.\n\n    You can also\
    \ change the *intensity* (how shiny the object is) and the *hardness* (how soft\
    \ the edges of the shine are — the higher the hardness, the sharper the edges).\
    \ CookTorr is similar to Lambert because there is also a drop-down menu with different\
    \ options. CookTorr is just a specific type of shininess that changes the consistency\
    \ of the shine on the object.\n\n6.  **Change the Diffuse color to a light blue\
    \ (see** [**Figure** **9-4**](#12_9781119404187-ch09.xhtml_c09-fig-0004)**) and\
    \ keep the Specular the same.**\n\n![image](images/9781119404187-fg0904.png)\n\
    \n[FIGURE 9-4:](#12_9781119404187-ch09.xhtml_rc09-fig-0004) The applied material.\n\
    \n### CREATING THE EYE MATERIALS\n\nThe materials for the eyes are done slightly\
    \ differently than the body because the eyes need two different colors for the\
    \ eyeball and the pupil. (You can also use these steps to create an iris, but\
    \ that just involves an extra step and isn’t necessary to make a decent cartoon\
    \ eyeball.)\n\nFirst, make sure you have either eye selected. Then follow steps\
    \ 1 through 5 in the preceding section to create a white material instead of a\
    \ blue one. Then follow these steps:\n\n1.  **Switch to Edit Mode.**\n\n2.  **Select\
    \ the front two circles of faces (see** [**Figure** **9-5**](#12_9781119404187-ch09.xhtml_c09-fig-0005)**).**\n\
    \n3.  **Click the Materials tab.**\n\n4.  **Create a new material (steps 2 and\
    \ 3 in the preceding list).**\n\n5.  **Change the diffuse color to black.**\n\n\
    6.  **Click Assign near the top.**\n\n    This will assign the material to only\
    \ the faces selected.\n\n7.  **Return to Object Mode and repeat this process for\
    \ the other eye.**\n\n![image](images/9781119404187-fg0905.png)\n\n[FIGURE 9-5:](#12_9781119404187-ch09.xhtml_rc09-fig-0005)\
    \ The selected faces.\n\n### SAVING YOUR CHARACTER\n\nAfter you finish creating\
    \ your character (see [Figure 9-6](#12_9781119404187-ch09.xhtml_c09-fig-0006)),\
    \ you need to save the character so that you can use it in your game (or so that\
    \ you can animate the character in [Chapter 10](#13_9781119404187-ch10.xhtml)).\
    \ Before you save your character, select the lamp and camera in the scene and\
    \ delete them — they won’t be needed. Before you save any of the characters or\
    \ objects in this game, you’ll want to delete the lamp and camera.\n\n1.  **Choose\
    \ File ⇒ Save As.**\n\n2.  **Locate your game folder that contains the Unity and\
    \ Blender folders.**\n\n3.  **Select the Blender folder.**\n\n4.  **Change the\
    \ name of the file (currently untitled.blend in** [**Figure** **9-7**](#12_9781119404187-ch09.xhtml_c09-fig-0007)**)\
    \ to player.blend.**\n\n5.  **Click Save as Blender File.**\n\n![image](images/9781119404187-fg0906.png)\n\
    \n[FIGURE 9-6:](#12_9781119404187-ch09.xhtml_rc09-fig-0006) The completed character.\n\
    \n![image](images/9781119404187-fg0907.png)\n\n[FIGURE 9-7:](#12_9781119404187-ch09.xhtml_rc09-fig-0007)\
    \ The Save screen.\n\nThis will save the project as a Blender file in the folder\
    \ that you created earlier. Now you’ll be able to keep your character file close\
    \ to your Unity files if you ever have to transfer the files.\n\n## CREATING THE\
    \ ENEMY GRUNT\n\nThe enemy grunt characters help fill your game with peril. These\
    \ characters must look threatening to indicate the danger they face to the player.\
    \ Generally speaking, the best way to create a threatening character is make it\
    \ look mean or unfeeling. In Mario, the Goombas have eyebrows that point downward\
    \ to make them look angry. In Sonic, the enemies are machines that are clearly\
    \ different from the animal character that you’re playing. The early Sonic villains\
    \ are also insectoid to help highlight the difference. When you’re designing your\
    \ enemy characters, you want to also make sure that because they’re grunts they\
    \ don’t have too many unique features and can be used interchangeably so that\
    \ the player can recognize them as enemies throughout the games.\n\nThe other\
    \ common thing about enemy units in platformers is that they generally move back\
    \ and forth in a pattern or toward the player character to indicate hostility.\
    \ I’ll cover this in more detail in [Chapter 10](#13_9781119404187-ch10.xhtml)\
    \ when you learn more about animation, but for now just keep in mind that these\
    \ characters should look hostile and evil.\n\nUsing your character, first delete\
    \ the eyes and save the file as enemy.blend in the same location that you saved\
    \ the player character file in. Then create a cylinder. This will act as the “eye”\
    \ for your evil robot character that will be the enemy in the game.\n\n1.  **Rotate\
    \ the cylinder 90 degrees on the Y so that the top of the cylinder is facing the\
    \ front.**\n\n2.  **Switch to Edit Mode.**\n\n3.  **Change the size of the back\
    \ face so that it’s slightly smaller than the front base (see** [**Figure** **9-8**](#12_9781119404187-ch09.xhtml_c09-fig-0008)**).**\n\
    \n4.  **Switch to Object Mode, and move the eye into the cube so that the two\
    \ objects are overlapping.**\n\n5.  **Switch back into Edit Mode and, using the\
    \ Inset Face, Extrude, and Loop-Cut slide tools, create a lens for the eyestalk.**\n\
    \n6.  **Inset the face in the front, size it down, and pull it into the cylinder\
    \ slightly.**\n\n7.  **Extrude that face and pull it out.**\n\n8.  **Inset the\
    \ face again two more times, each time bringing the face out slightly to create\
    \ a rounder curve to the lens.**\n\n9.  **Loop-cut slide the side of the cylinder\
    \ near the front of the cylinder.**\n\n10.  **Use alt-select to select all the\
    \ quads around the cylinder that are near the front.**\n\n11.  **Using the S key\
    \ as a shortcut, scale uniformly so that you create a nice expansion in the lens\
    \ stretching out (see** [**Figure** **9-9**](#12_9781119404187-ch09.xhtml_c09-fig-0009)**).**\n\
    \n![image](images/9781119404187-fg0908.png)\n\n[FIGURE 9-8:](#12_9781119404187-ch09.xhtml_rc09-fig-0008)\
    \ The robot’s eye.\n\n![image](images/9781119404187-fg0909.png)\n\n[FIGURE 9-9:](#12_9781119404187-ch09.xhtml_rc09-fig-0009)\
    \ The finished eyestalk.\n\nIn [Chapter 5](#08_9781119404187-ch05.xhtml), you\
    \ made placeholder obstacles that the player had to avoid. The player knew these\
    \ obstacles were bad because the coloring was red, which made the obstacle seem\
    \ angry. In this case, you’ll also use the color red. Select the cube and change\
    \ the material’s diffuse color to red.\n\nMachines are also reflective because\
    \ they have metal surfaces. Luckily, Blender makes it easy to add this reflectivity\
    \ to our materials. In the Material tab, go down to where you see Mirror. Click\
    \ the box next to Mirror so that it’s selected. The Mirror drop-down list has\
    \ the following options:\n\n*   **Reflectivity:** How reflective the material\
    \ is. The more reflective it is, the more like a mirror it is. An object that\
    \ is 1.0 reflective will just reflect what’s around it.\n\n*   **A color choice:**\
    \ What color the reflection will be tinted to; white is no tint. This will just\
    \ be a block of color in the drop-down. By clicking that block, you’ll be able\
    \ to adjust the color."
