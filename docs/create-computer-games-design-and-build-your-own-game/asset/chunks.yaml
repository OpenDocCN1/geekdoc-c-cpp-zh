    将材质应用到对象后，转到检查器（Inspector）并点击 `Apply`。你的颜色将应用到所有的目标预制体（prefabs）上。现在，你有一个不仅引人注目，还能引导玩家向你希望他们的方向前进的关卡！


    ![image](img/c4.png)


    在本章中，你将学习游戏开发背后的基础：编程。本章将解释你如何让游戏具有交互性，以便人们能够`play`你的游戏。我将向你展示一段简单的移动代码，你可以将其作为未来编程的起点。我还会解释代码的不同方面面，以及每段代码背后的核心思想。


    在这里，你还将学习如何编写角色程序，让她能够捡起你在第 3 章中创建的收集物品，这涉及到创建和应用对象标签（tags）。你将学习如何编写简单的代码，让摄像头跟随你的角色穿过整个关卡。这些代码将作为我将在第
    5 章中涵盖的一些更复杂代码的介绍。你在本章中学到的内容将在下一章得到扩展。


    ## 游戏开发的三个 C (THE THREE CS)


    当你制作游戏时，请记住游戏开发的三个 C：摄像头（camera）、角色（character）和控制（control）。这三个 C 是了玩家进入你希望创造的世界的主要入口。它们是你游戏中玩家始终在处理的方面。当你理解了这三个
    C 中的每一个在游戏中扮演的角色时，你将不仅更好地理解你的游戏，还能理解你创建或游玩的所有游戏。


    ### 摄像头 (CAMERA)


    摄像头是玩家观察游戏的窗口。它是玩家看到并对其做出反应的对象。游戏中摄像头的放置至关重要，因为玩家对你游戏世界的基本理解将通过摄像头体现。


    在电影中，摄像头只显示摄影师和导演想要观众看到的内容。改变摄像头的位置可以改变整个场景的感觉，或者在某些情况下，完全会破坏该场景。


    你的游戏摄像头应该被对待得与电影机非常相似。问题在于，在游戏中，你不能总是控制玩家（或摄像头）去向哪里。当你创建摄像头时，必须决定让玩家对摄像头拥有多大的控制权，以及你是否会以任何方式限制这种控制权。锁定在玩家角色背后的摄像头揭示的信息与位于玩家角色上方或侧面的摄像头不同。玩家拥有完全控制权或玩家可以旋转的摄像头会向玩家揭示来自世界各处的信息——但它们也可能揭示你不希望玩家看到的游戏方面。


    ### 角色 (CHARACTER)


    角色是玩家在游戏中扮演的身份。这可能具有欺骗性，因为在游戏开发的这个阶段，角色的主题并不重要。当你编写游戏代码时，角色是一个细节详尽的士兵还是一个箱子都是无关紧要的。当你思考角色时，你需要考虑的是你的角色在游戏中究竟做了什么。问问自己以下问题：


    * 角色会跳跃吗？如果是，跳得有多高？

    * 角色是否有四向移动（前、后、左、右），还是角色只能前后移动？

    * 我的角色是否有任何武器或工具？如果有，它们是什么？


    角色的移动方式不仅改变了你的游戏类型，还改变了你编写游戏的方式。第一人称射击游戏与平台跳游戏的代码完全不同。即使是不同类型的平台跳游戏，也可以有多种不同的代码，仅仅因为你希望角色拥有不同类型的控制权。


    ### 控制 (CONTROL)


    控制是玩家与游戏交互的方式。将游戏与其他所有类型的娱乐媒体区分开来的特点是它们与观众互动的独特能力。玩家不像看书、电影或电视节目那样阅读或观看事件发生。他们在体验中扮演着活跃的角色，并对角色投入感情，因为他们`就是`角色本身。


    控制决定了一个游戏的成败。一个控制设置糟糕的游戏，无论图形或故事有多好，都永远无法像控制良好的游戏那样让玩家产生共鸣。你玩游戏是因为它们让你感到处于掌控之中，所以当你设计游戏时，你必须考虑控制如何与玩家交互，以及你如何让尽可能多的人都能上手游戏。


    例如，当你考虑电脑游戏中的移动时，你想起了哪些键？可能是 `W`、`A`、`S` 和 `D` 键。但为什么呢？为什么游戏设计师不使用 `6`、`Caps Lock`、`Enter`
    和 `Spacebar` 键呢？毕竟，这些键也与不同的方向有关。设计师通常使用 `W`、`A`、`S` 和 `D` 的原因是他们不希望玩家为了实现每个预期效果而花费太多精力去玩游戏。如果你必须移动手太多，或者停下来思考控制键，这会破坏你对游戏的沉浸感，从而杀死这种体验。你希望玩家想到某事的时间和执行该操作的时间尽可能缩短，这样玩家就永远不会在游戏中打破沉浸感。


    ## 创建角色替身 (CREATING A CHARACTER STAND-IN)


    在第 3 章中，你创建了一个完整的灰盒（gray-box）关卡。查看图 4-1 了解灰盒关卡如何让你测试控制，这是在添加`皮肤`（外观）之前。


    ![image](img/9781119404187-fg0401.png)


    FIGURE 4-1: 灰盒关卡。


    同样，角色替身是一种让你编写并测试角色、控制和摄像头的方法，而无需先创建一个详细的角色。替身帮助你专注于玩家对游戏的体验，而不是游戏本身。就像灰盒关卡一样，你的角色替身不需要非常复杂就能传达观点。替身要做的一件事就是与背景区分开。要创建替身，请遵循以下步骤：


    1. 进入 `GameObject` 并创建一个 `Cube`。

    2. 使用移动工具将立方体移动到关卡的开始。它不需要直接放在关卡顶部，至少要在它上方。

    3. 进入项目窗口中的 `Assets` 文件夹，创建一个名为 `Materials` 的新文件夹。

    4. 将现有材质移动到该文件夹中。

    5. 创建一个新的 `material` 并将其应用到 `cube`。

    6. 更改 `material` 的颜色，让玩家与背景明显区别开。


    ![image](img/9781119404187-fg0402.png)


    FIGURE 4-2: 你的角色替身。


    ## 关于代码 (THINK ABOUT CODE)


    什么是代码？当你考虑到代码时，你可能会想到电影里的黑客穿过 0 和 1 的墙来破解金库代码。你认为这是一种需要大量的数学和计算才能解决的问题。


    '
- fmt: '

    Coding does rely on math, but its more akin to learning a new language than doing
    math. Coding is just telling the computer or game what you want it to do in a
    language that it can understand. The problem is that computers are stupid, so
    when you code, you have to code `everything`.


    For example, let’s say you have a robot and you want to program it to make a peanut
    butter and jelly sandwich. In order to do this, you have to program each step
    involved in creating this sandwich. Try writing out all the steps that are needed
    to create a peanut butter jelly sandwich and then come back to this book. I’ll
    wait!


    It’s very likely that the list you came up with isn’t as detailed as it needs
    to be. In order to program a robot to make a peanut butter and jelly sandwich
    you have to have these steps:


    1. `Turn to point toward cabinet.`

    2. `Move toward cabinet.`

    3. `Open hand.`

    4. `Rotate arm up to handle.`

    5. `Close hand around handle.`

    6. `Open cabinet.`

    7. `Release handle.`

    8. `Move hand to peanut butter.`

    9. `Grab peanut butter.`

    10. `Take peanut butter out of cabinet.`

    11. `Put peanut butter on counter.`

    12. `Move hand to jelly.`


    And these are just the steps for taking out the peanut butter and jelly! In the
    real code, you would have to program what the total distance of a step is for
    the robot and how many steps it requires to go to the cabinet. You would also
    have to program it to know what jelly and peanut butter are, as well as bread
    slices, a plate, and a knife.


    Coding is all about laying out clear directions for the computer to follow. In
    games, your code not only has to act on its own, but also has to react to what
    the player does within the game.


    ## ADDING RIGIDBODY COMPONENT AND UNDERSTANDING BOX COLLIDERS


    Before you begin to code your character, Unity offers a way for you to easily
    apply physics and other forces to your object. You don’t have to worry about coding
    gravity and other forces because it’s all included in the `Rigidbody` component.
    The `Rigidbody` component makes it so that outside forces and objects can actually
    have an effect on the object within the game.


    For example, let’s say you make a cube in an empty scene. When you click `Play`,
    without a `Rigidbody` constraint, the cube will remain in the air because the
    cube is unaffected by any outside forces and will stay still. If you were to add
    a `Rigidbody` component to the cube and then click `Play`, the cube would fall
    forever because there is nothing keeping it up. Now that gravity can be applied
    to it, it will fall infinitely. If you were to add a separate object or plane
    below the cube, the cube would land on that object or plane. This is because of
    another component that is already added to all the 3D objects: a `collider`.


    A `collider` is an invisible outline that wraps around the 3D game objects that
    signals when one object “collides” with another object. The colliders of different
    objects interact with each other and signal when two objects touch. You can access
    the `collider` by selecting your object and going to the `Inspector` window. You
    can adjust the size of a `collider` to be larger or smaller than the object.


    You can also adjust the center point of the `collider`, which will move it around
    your object. Most objects have a `collider` naturally, but if they don’t, you
    can always add one. To add a `collider`, follow these steps:


    1. In the `Inspector` window, at the bottom you’ll see an `Add Component` button.

    2. Click `Add Component` and select `Physics`.

    3. From the `Physics` menu, select your desired `collider` (see `Figure 4-3`).


    ![images/978119404187-fg043.png]

    *FIGURE 4-3: Adding Rigidbody component.*


    Different colliders have different shapes. A `mesh collider` is the most versatile.
    It’s able to wrap around different types of meshes. You can also use the `Add
    Component` button to add multiple colliders to an object.


    Adding a `Rigidbody` component to the player will make it so that you can give
    your character the ability to jump and fall on top of basic forward and sideways
    movements. To add a `Rigidbody` to your character, first make sure that you have
    the right selected in `Scene` window. Then follow steps 1 through 2. When you
    get to Step 3, instead of selecting the `collider`, select `Rigidbody`.


    To test the `Rigidbody` on your object, simply click the `Play` button on the
    top of the screen. The object should fall and land on the level you created. Now
    that your object is affected by gravity, it’s time to program it so that you can
    make it move and jump using the keyboard.


    ## CODING YOUR PLAYER


    When you create code in Unity, you actually create the code separately from the
    object and later attach it to the object, opposed to coding the object directly.
    The benefit to this approach is that you’re easily able to transfer the code you
    create to other objects, making the transfer from gray-box level incredibly simple.
    But this means that you need to create the code separate and have it stored elsewhere.


    The first step is to create a new folder in your assets folder in `Project` window
    and name the folder `Code`. This will be where you store all the codes you’ll
    making in this game. It’s a good habit to get into — proper organization can save
    you hours of work.


    After you create a folder to store all your code in, you have to create the file
    that you’ll use to write your code in:


    1. Make sure that the `Code` folder is selected.

    2. Click `Create`.

    3. Choose `Create` ⇒ `C# Script`.

    4. Name the script `Char` (short for character), as shown in `Figure 4-4`.


    ![images/978119404187-fg044.png]

    *FIGURE 4-4: Creating a C# code.*


    This will create a `C#` code that you’ll be able to go into and change to include
    the code for your character. There are many different languages in coding. For
    the purposes of this project, you’ll be using `C#` (pronounced “C Sharp”). `C#`
    is a powerful programming language used in Unity and a variety of other programs.
    It’s type-safe and focuses on object-oriented goals within the code (for example,
    “Do this thing and this happens”).


    Selecting the `C#` code and double-clicking it will open up Unity’s included code-writing
    software, `MonoDevelop` (shown in `Figure 4-5`). When `MonoDevelop` opens, you’ll
    see what looks at first like a word-processing program but with the lines clearly
    numbered. This is the basic code-writing software that you’ll use when making
    your Unity games.


    ![images/978119404187-fg0405.png]

    *FIGURE 4-5: MonoDevelop.*


    When you open this code, you’ll notice that part of the code is already written
    out for you. Unity automatically writes some of the basic parts of the code for
    you when it creates a new script. To better understand coding, let’s breakdown
    what every part of this code is doing for the game as a whole, using `Figure 4-5`
    as a reference point.


    The first three lines of this code determine the systems and engines that the
    code will be accessing in the code as reference. You’ll notice that the first
    two are `System.Collections` and `System.Collections.Generic`. These are the two
    namespaces that give access to a variety of codes and classes that will be used
    in `C#`. These are aspects of the code that make up the bulk of how your codes
    will be working. On line 3, the code is accessing the `Unity` engine, which indicates
    that it will be controlling some basic aspects through the `Unity` engine. Later
    in this chapter, you’ll be adding a new engine for the code to access and alter,
    but for now, just leave it alone.

