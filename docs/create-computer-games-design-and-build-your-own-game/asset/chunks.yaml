    \n*   Instead of the `Count = Count + 1`, the code changes to `Count = Count -\
    \ 1` so that the count goes down every time the character hits the enemy.\n\n\
    *   `SetCounntText()` remains the same because every time this happens you want\
    \ the count to change on the screen.\n\n*   Add another `if` statement within\
    \ the code so that when the character runs into the enemy, if its score is equal\
    \ to or less than –1, the character is destroyed and the `winText` UI displays\
    \ “You Lose” instead of “You Win.”\n\n*   `Destroy()` removes something from the\
    \ game when it’s activated. In this case, it removes `gameObject`, which refers\
    \ to the object the code is attached to.\n\nWith the exception of `Destroy`, no\
    \ code within this `if` statement was new. They were all codes you used in previous\
    \ parts that accomplish different goals.\n\nThe problem with using the pickup\
    \ items as a way to measure health is that you can’t have the goal of the level\
    \ be to pick up a certain number of them because if the player loses too much\
    \ health, there is no way for them to complete the level. To rectify this problem,\
    \ add a clearer objective at the end of the level for the player to reach. Similar\
    \ to the flag at the end of a Mario level or the sign at the end of the Sonic\
    \ level, there has to be something that marks the end of the level for the player\
    \ and tells the game that the level is over.\n\nThis can be a flag or a special-looking\
    \ pickup item, but for the purposes of coding ease, just add a new tag and name\
    \ it `Finish`. Then follow these steps to create an endpoint like the one in [Figure\
    \ 5-6](#08_9781119404187-ch05.xhtml_c05-fig-0006):\n\n1.  **Place a `pickup` prefab\
    \ at the very end of the level.**\n\n2.  **Create a new material and change its\
    \ color.**\n\n    Gold works well.\n\n3.  **Assign the new material to the new\
    \ pickup.**\n\n4.  **Change the tag of this pickup to `Finish`.**\n\n![image](images/9781119404187-fg0506.png)\n\
    \n[FIGURE 5-6:](#08_9781119404187-ch05.xhtml_rc05-fig-0006) The end point.\n\n\
    After you create the `finish` object, you still have to code the character so\
    \ that when they cross the Finish, they actually display the victory message.\n\
    \nWhen programing the end code (like the one in [Figure 5-7](#08_9781119404187-ch05.xhtml_c05-fig-0007)),\
    \ you need to first delete your original `winText` code that you had in an `if`\
    \ statement in the `SetCountText ()`. Instead, write out an `if` statement similar\
    \ to your `pickup` and `enemy` codes but instead for `Finish`. Then write out\
    \ the code to display the `winText` that was used in `SetCountText`. Now when\
    \ your character crosses the finish line, the game will display the text “CONGRATS\
    \ YOU WON!!!” As with the other codes with `CompareTag`, this should be in the\
    \ collider section of the code.\n\n![image](images/9781119404187-fg0507.png)\n\
    \n[FIGURE 5-7:](#08_9781119404187-ch05.xhtml_rc05-fig-0007) The end code.\n\n\
    `If (other.gameObject.CompareTag(\"Finish\"))`\n\n`{`\n\n`winText.text = \"CONGRATS\
    \ YOU WON!!!\";`\n\n`}`"
