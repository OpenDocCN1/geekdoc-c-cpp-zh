  trans: "\n当你开发游戏时，你必须优先处理出现的问题和 Bug。某些问题需要比其他问题更早地解决。在一个充满截止日期的世界里，破坏运行的 Bug 需要在美化问题之前修复。把它想象成家庭作业：某些项目或任务因为截止日的临近或对你总分的重要性而需要被优先考虑。游戏制作也是如此，只不过唯一能决定某些问题比其他问题重要的人只有你！问问自己，到底哪些问题最损害了游戏体验，而哪些问题可以以后再处理。\n\
    \n在这个游戏中，这里有几个主要问题：\n\n*   `玩家受到了不公平的惩罚。`这在游戏早期杀死玩家并让玩家一开头就导致“游戏结束”，从而破坏了游戏。\n\
    *   `玩家在游戏早期学习不同控制操作时存在问题。`为了修复这个问题，你需要添加一个教程，该教程会随着玩家学习操作并在游戏中演示这些操作而发生变化。\n\
    *   `玩家正在爬墙。`在平台跳跃游戏中，你希望玩家学会如何跳跃并精通控制操作。如果玩家有可以使用的简单替代方案，那么那些让游戏成为游戏的挑战性部分将变得失效。而且，随着游戏难度的增加，难度跳跃会感到不平衡，因为那些旨在教学控制和游戏部分的低挑战性部分会被直接忽略。\n\
    \n在接下来的章节中，我将引导你解决这三个问题的每一个。\n\n### 减少对玩家的惩罚\n\n当玩家开始游戏时，一切对他们来说都是新鲜的。他们不确定什么是好事，什么是敌人。在游戏的早期，玩家所拥有的只有你提供的信息。在你的游戏中，玩家交互的第一个主要物体给了他们一个“游戏结束”屏幕，这在玩家与游戏中其他物体（包括道具）之间创建了糟糕的关联。你可以尽可能地使用视觉线索来指示哪些是好的，哪些是坏的，但这些视觉线索并不保证有效。作为一个一般原则，玩家犯的首几个错误应该是游戏后期的学习机会。\n\
    \n修复这个问题的最佳方法是减少犯错的惩罚。但与其修改代码来防止即死，有一种更简单的方法在犯错后给玩家第二次机会：在第一个敌人之前放置一个拾取物品（参见图\
    \ 7-1）。\n\n![image](img/9781119404187-fg0701.png)\n\n图 7-1: 添加一个拾取物品。\n\n这看起来可能是一个微小的改变，但并不是每个游戏设计的改变都必须很大才能产生巨大的影响。通过在第一个障碍物之前添加拾取物品，你正在用一个物品教会两个知识：\n\
    \n*   `玩家很早就学会了拾取物品的好处，因为他们从一开始看到分数增加。`这样，他们会将两者联系起来。\n*   `玩家从一开始就学会了游戏中有益道具，从而正向强化。`\n\
    \n在他们看到这个拾取物品后，他们会看到敌人角色并发生以下两种情况之一：\n\n*   他们会意识到该角色是敌人并避开。\n*   他们会撞上角色并丢失一分。\n\
    \n在敌人之前只添加一个拾取物品的巧妙之处在于，玩家不仅学会了拾取物品是好的，而且在不需要重新开始游戏的情况下学会了敌人是坏的。他们受到了惩罚，但并不会严厉。他们学会了应该避免什么以及哪些是可以交互的。\n\
    \n### 创建用户界面教程\n\n玩家可以自己发现很多问题，但一个简单的教程在防止玩家感到挫败方面大有帮助。只有当你知道如何玩游戏时，游戏才是有趣的。如果你不知道怎么玩，游戏可能会变得比它的价值更无聊。教程是帮助解决学习玩法问题的一种简单方法。\n\
    \n由于你正在制作的游戏没有任何非常复杂的控制操作，教程本身不需要非常复杂——但它仍然必要的。在《超级马里奥兄弟》或街机游戏时代，教程是不必要的，因为玩家实际上使用的控制和按钮非常少——弄清楚控制只需要一分钟左右。如今，游戏手柄上至少有十个按钮，键盘上有上百多个。这还未包括现在通过代码提供的各种不同控制组合。对于从未玩过游戏的人来说，学习如何玩游戏并不简单。\n\
    \n要为你的游戏创建一个 UI 教程，你需要创建一个新的 UI。遵循以下步骤：\n\n1.  `Choose GameObject ⇒ UI ⇒ Text.`。\n\
    2.  `调整文本使其位于画布的左下角，并使用一种显眼且清晰读的颜色。`\n3.  `删除文本框中的所有文本。`\n4.  `从 Text (script)\
    \ 下拉菜单中，有一个段落部分。在该部分你会看到 `Horizontal Overflow` 旁边有一个下拉菜单。将其从 `Wrap` 改为 `Overflow`。`\n\
    \    这防止文本过长时被截断。\n5.  `将其重命名为“Direction Text”。`\n6.  `打开 Char 代码脚本。`\n7.  `在代码顶部输入\
    \ `public string directionText;` 位于 `winText` 和 `countText` 下方。`\n8.  `在 `void\
    \ Start()` 方法中输入 `directionText.text = \"W=Forward A=Left D=Right\";``\n    这在游戏开始时显示教程。教程应该在进入下一个代码之前给出基础控制。后续代码实际上放置在控制按的\
    \ `if` 语句中。第一个将用于向前移动（W）。图 7-2 中所示的代码提供了教程变化的提示。\n\n![image](img/9781119404187-fg0702.png)\n\
    \n目前，如果按下 W 键，发生的是角色向前移动。\n\n1.  添加一个 `if` 语句：`if (directionText.text == \"W=Forward\
    \ A=Left D=Right\") {`。\n    这将使得当你按下 W 键且 `directionText` 是初始文本时，执行后续代码。\n2.\
    \  在这个 `if` 语句内部，添加 `directionText.text = \"Press Space to Jump\";`。\n    这将 `directionText`\
    \ 更改为教程的下一步。\n3.  转到跳跃代码 (`KeyCode.Space`)。\n4.  遵循步骤 1 和 2，但将步骤 1 中的 `directionText.text`\
    \ 从 `W=Forward A=Left D=Right` 改为 `Press Space to Jump`，并将步骤 2 中的 `directionText.text`\
    \ 从 `Press Space to Jump` 改为 `Left Shift to Sprint`。\n5.  转到向前冲刺代码 (`KeyCode.W\
    \ && KeyCode.LeftShift`)。\n6.  再次遵循步骤 1 和 2，但将步骤 1 中的 `directionText.text` 从 `Press\
    \ Space to Jump` 改为 `Left Shift to Sprint`，并将步骤 2 中的 `directionText.text` 从 `Left\
    \ Shift to Sprint` 改为 `\" \"`。\n\n现在玩家将通过教程引导。当他们按照教程建议的操作时，教程的文本将会更改。保存代码并回到\
    \ Unity。使用“Direction Test”旁边的目标选择“Direction Text”对象。\n\n### 使用射线检测防止爬墙\n\n"
- fmt: "\nRaytracing works by determining whether an object is touching another object.\
    \ It creates a cone in one direction that gives the player the ability to read\
    \ when it’s touching another object or is close to another object. You can indicate\
    \ when objects are approaching or are around the object or determine if a player\
    \ is a certain distance away from the ground or wall.\n\nBefore you do anything\
    \ else, you need to add an extra bit of code to the jump string. As it is right\
    \ now, the code will work and make sure that the character is touching the ground\
    \ when the character is jumping. At the end of the `if` statement, add `&& Groundtouch\
    \ == True`. This way, the code will know that the only time the player can jump\
    \ is when the player presses the Spacebar and is touching the ground.\n\nNow,\
    \ before you can add the wall touching code, you need to add a new bool at the\
    \ top of the code. `public bool wc = false` is similar to the `gc` code. That’s\
    \ because all you’re doing is using the `gc` code as a reference point for the\
    \ `wc` code.\n\nRight under the `Vector3` for `gc`, add a new `Vector3` that is\
    \ the exact same as the `gc` code but instead of down, the direction is `Vector3.Forward`.\
    \ That way, the player will be using the raytrace forward and will be able to\
    \ tell that there is an object right in front of it. The difference between the\
    \ codes comes in the result of the code. The `gc` code was created to determine\
    \ if the player is touching the ground or not, and the `wc` code prevents players\
    \ from climbing the walls.\n\nThe easiest solution to this problem is to prevent\
    \ the character from being able to move forward past the wall. Like the enemy\
    \ code before, this can be accomplished by moving the character a distance back\
    \ every time the player touches the object from the front. At the top of the code,\
    \ add a new float for the code. Add to the top of the wall `public float wall\
    \ = 20f`. This will prevent the character from being able to progress through\
    \ the level without jumping over the gaps. The number 20 works because it’s faster\
    \ backward than the sprint is forward so there is no way to use the sprint with\
    \ the jump bottom to just undercut the parts of the game with jumping.\n\nUnderneath\
    \ the `Vector3 gc` code, place the `wc` code shown in [Figure 7-3](#10_9781119404187-ch07.xhtml_c07-fig-0003).\
    \ Then create an `if` statement underneath it: `if (Physics.Raycast (transform.position,\
    \ wc. 0.5f))`. This determines when there is an object in front of the character.\
    \ When there is, the character will move backward by the wall distance defined\
    \ earlier. This code will prevent the character from climbing the wall, but it\
    \ will also create a problem with how your character interacts with the enemy\
    \ characters. For this, I find 0.4f actually works better than 0.5f because it\
    \ gives just enough distance so that the walls are still causing the character\
    \ to move back and prevents climbing, but it also keeps the enemy characters from\
    \ bouncing right off of you.\n\n![image](images/9781119404187-fg0703.png)\n\n\
    [FIGURE 7-3:](#10_9781119404187-ch07.xhtml_rc07-fig-0003) The wall touch code.\n\
    \nSave this code and go back into Unity. While in Unity, select any one of the\
    \ enemy characters. Go into the Inspector window and go down to the box collider.\
    \ Change the collider’s size to (0.5,0.5,0.5,). Now the character will be unable\
    \ to simply climb the walls and still be affected by the enemy characters.\n\n\
    ![image](images/c8.png)\n\nUnity is excellent game-developing software, but it’s\
    \ limited in its ability to actually create characters or environments for your\
    \ game. In this chapter, you’ll learn about another program that you can use to\
    \ help bring life to your game: Blender. This chapter will help you learn the\
    \ basics of Blender so that you can model and animate your characters and obstacles\
    \ within your game.\n\nBlender can be intimidating when you first open it. This\
    \ chapter helps you navigate the interface without getting lost in all the things\
    \ that Blender is able to do. In this chapter, you’ll create and edit a single\
    \ object, as well as learn about the different parts of a 3D mesh and how you\
    \ can use them to bring your characters to life.\n\n## MIXING THINGS UP WITH BLENDER\n\
    \nBlender is a open-source 3D animation creation suite. What that means is that\
    \ it’s a program with multiple uses in 3D development. Modeling, rigging, animation,\
    \ motion tracking, and even editing and game development are all things that Blender\
    \ can be used to work on. It does this through community-driven updates. Users\
    \ are not only able to but are encouraged to work on and change the code that\
    \ Blender runs off of. This has led to a strong community within Blender that\
    \ has been crucial to Blender being the versatile and free program that it is\
    \ today.\n\nFor your game, you’ll mostly be using Blender’s modeling and animation\
    \ capabilities to help craft the characters and obstacles that will be within\
    \ your game. Creating assets is a key part of developing your game, because this\
    \ is the part of game design that is about bringing to life the original vision\
    \ for your game. This is not an animation book, nor is it a book about Blender.\
    \ But by learning the basics of Blender and how to bring files and models you\
    \ created from Blender into your game, you’ll be able to customize and personalize\
    \ your game in ways.\n\n## DOWNLOADING BLENDER\n\nBefore you can use Blender you\
    \ have to download it. Luckily Blender is available to everyone for all platforms\
    \ — Windows, Mac, and Linux.\n\n1. Go to `www.blender.org` (see Figure 8-1](#10_9781119404187-ch07.xhtml_rc07-fig-0001)).\n\
    2. At the top of the page, click `Download`. Blender will automatically determine\
    \ what type of platform you’re using.\n3. Click `Download`.\n4. Move the file\
    \ into the applications folder on your computer.\n\n![image](images/9781119404187-fg0801.png)\n\
    \n[FIGURE 8-1:](#10_9781119404187-ch07.xhtml_rc07-fig-0001) Blender’s website.\n\
    \n## OPENING BLENDER FOR THE FIRST TIME\n\nWhen you open Blender the first time,\
    \ you’ll see the screen shown in Figure 8-2](#10_9781119404187-ch07.xhtml_c07-fig-0002).\
    \ Here, you’ll see the version number of Blender you downloaded, along with some\
    \ links to other things about Blender, including a place to donate to Blender\
    \ and a link to the website. You’ll also see a Recent section, which will be empty\
    \ because you haven’t created a project yet. To get rid of this screen overlay,\
    \ click to the side of it; you’ll be brought to the base interface.\n\n![image](images/c8.png)\n\
    \n[FIGURE 8-2:](#10_9781119404187-ch07.xhtml_rc07-fig-0003) \n\nPart of the appeal\
    \ of Blender is its customizability. You can change the interface to match your\
    \ style of working, but for the purposes of this book, I suggest sticking to the\
    \ base interface.\n\nIn the center of the window is the `3D View`. This is similar\
    \ to the Scene view in Unity. It’s where the majority of your work will be focused.\
    \ In the `3D View`, you’ll notice a grid with a box in the center. This grid shows\
    \ the *x*-, *y*-, and *z*-axes. The first major difference you’ll notice between\
    \ Unity and Blender is the fact that the *y*- and *z*-axes are swapped with each\
    \ other, with the *y*-axis going along the grid and the *z*-axis going toward\
    \ and away from the grid. Unity will automatically adjust for this when importing\
    \ the files from Blender into Unity so it won’t cause an issue, but it is something\
    \ you’ll want to keep in mind when creating your characters and animations.\n\n\
    On the top of the screen, you’ll notice the `Information` window. This is where\
    \ the majority of the configuration settings are located. You can also save using\
    \ this section.\n"
