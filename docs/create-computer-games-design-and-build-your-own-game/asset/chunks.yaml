- fmt: 'Note how there are spaces between the different sections of Unity’s code.
    These spaces act simply as ways to break up large blocks of code and make the
    code more accessible and readable. There is no reason within the code to break
    apart the lines, but by doing so you’ll create a code that is easier to understand
    and work in. When you code, be sure to create breaks within the code to give yourself
    more space to work in.


    In C#, classes act as templates that classify game objects within the code. A
    `void` acts as an indicator that the following method will not accept any parameters
    and will not return any value back. A `void Start` indicates a method that will
    begin at the start of the game (when you first press the Play button). A `void
    Update` updates every frame of the game.


    Whenever you see `//` in code, it indicates a dead line of code. When `//` is
    added in a line, everything following that grays out to indicate that it’s no
    longer active. Often programmers use `//` as a way to make notes within the code
    that can help them better understand what’s going on in the code. Other punctuation
    in coding has purposes of their own. These are the most common within coding:


    * `{ }` indicates the start and end points of a particular string. A string is
    a particular part of the code. You can have multiple strings within each other
    in a code.

    * `( )` acts as further qualification for a method to begin. You’ll use these
    in `if` statements to set up why a certain code will begin when it begins.

    * `;` indicates the end of a particular line of code. Think of semicolons as the
    period in a sentence of the code while the `{ }` indicates the total paragraph
    or essay.


    Now that you’ve examined some of the starting code, it’s time to add your code
    into the mix. You’ll start with a simple movement code that indicates how fast
    the character will move, what direction it will move in, and when it will move.


    In [Figure 4-6](#07_9781119404187-ch04.xhtml_c04-fig-0006), you’ll notice that
    a `public float` was added underneath the class. Floats act as a reference point
    that later parts of the code can use. In this case, you can see that the code
    reads `public float Speed = 5f;`. In this case, `public float` indicates the type
    of code that you’re creating, `Speed` is the name of the float you’re creating,
    `=` indicates that the following number directly relates and changes the `Speed`,
    and `5f` stands for 5 float integers. So whatever is affected by `Speed` will
    change by 5 of a particular integer.


    ![image](images/9781119404187-fg0406.png)


    [FIGURE 4-6:](#07_9781119404187-ch04.xhtml_rc04-fig-0006) The movement code.


    The next difference in the code shows what exactly `Speed` is affecting. Below
    `void Start`, you should add `void FixedUpdate(){`, which will update the code
    every second as opposed to every frame. Inside the `FixedUpdate`, you should type
    `if (Input.GetKey(KeyCode.W)) {`.


    The `if` tells the game that the following string will happen only if the statement
    in the parentheses happens. In this example, when the player inputs a particular
    key on the keyboard, with that key defined by the `KeyCode` as `w`, than the following
    code happens:


    ```

    transform.position += Vector3.forward * Time.deltaTime * Speed; }

    ```


    The code indicates that the object, when clicked, will:


    * `transform` (change) its position by `+=` (a distance in a direction).

    * The direction is indicated by `Vector3` as a direction on the XYZ axis. (`Vector2`
    indicates only along the 2D axis.)

    * `.forward` determines which way the object is moving. It’s moving forward relative
    to its direction multiplied by `Time.deltaTime * Speed`, which you defined earlier
    as 5.


    The final code should look like this:


    ```

    FixedUpdate {

    (Input.GetKey(KeyCode.W)) {

    transform.position += Vector3.forward * Time.deltaTime * Speed; }

    }

    ```


    So your character is moving 5 units forward along the XYZ axis whenever the W
    button is pressed. To get your character to move every direction, you must simply
    copy the pre-existing code and alter it as necessary for the different directions.
    See [Figure 4-7](#07_9781119404187-ch04.xhtml_c04-fig-0007) for an example.


    ![image](images/9781119404187-fg0407.png)


    [FIGURE 4-7:](#07_9781119404187-ch04.xhtml_rc04-fig-0007) All the directions.


    The only parts of the code that you need to fix are the keys pressed and the directions
    that the character will be moving. Everything else is predefined and has no need
    to be adjusted:


    * `KeyCode.A` plus `Vector3.Left` causes the character to move left when A is
    pressed.

    * `KeyCode.S` plus `Vector3.Back` causes the character to move back when S is
    pressed.

    * `KeyCode.D` plus `Vector3.Right` causes the character to move right when D is
    pressed. (Wait, the original text cut off here or was jumbled, I will fix the
    logic based on "KeyCode.D plus Vector3.Right").


    Wait, looking at the source text provided: "KeyCode.D plus Vector3.Right causes
    the character to move right when D is pressed." (The source actually said "KeyCode.D
    plus Vector3.Right causes the character to move right when D is pressed" - actually
