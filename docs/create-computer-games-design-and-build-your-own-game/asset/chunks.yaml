- fmt: "\nThe next steps repeat this same process by having the character turn around\
    \ by 90 degrees in ten frames and move back to –15 in the same amount of frames\
    \ you had the character move in the original movement (90 frames from before the\
    \ turn in the example). When the character gets back to –15 frames on the X, have\
    \ it rotate one more time and move to the Y position 0.\n\nIf you use the 90 frames\
    \ as the time it takes for the character to cross the stage, then the total frames\
    \ of this animation should be 240. This will create an enemy character that will\
    \ be moving back and forth on the game platform that the player will have to avoid,\
    \ like the one shown in [Figure 10-20](#13_9781119404187-ch10.xhtml_c10-fig-0020).\n\
    \n![image](images/9781119404187-fg1020.png)\n\n[FIGURE 10-20:](#13_9781119404187-ch10.xhtml_rc10-fig-0020)\
    \ The final enemy grunt animation.\n\n## ANIMATING THE ENVIRONMENTAL HAZARD\n\n\
    The environmental hazard that you created was a crusher, like the one in [Figure\
    \ 10-21](#13_9781119404187-ch10.xhtml_c10-fig-0021), which means you need to animate\
    \ it falling down onto the platform after a certain amount of time, pause there\
    \ for a moment, and then rise up again for the player to get through.\n\n![image](images/9781119404187-fg1021.png)\n\
    \n[FIGURE 10-21:](#13_9781119404187-ch10.xhtml_rc10-fig-0021) The crusher.\n\n\
    Part of the benefit of the crusher as a hazard that the player has to overcome\
    \ is that the model already will expand the entirety of the width of the stage,\
    \ so it forces players to go through it to get to the end. Unfortunately, that\
    \ means that in order to give players a chance to get through the crusher, you\
    \ have to provide players with enough time to jump through it. For this one, 3\
    \ seconds should be plenty of time for the player to make it through the crusher\
    \ without being hit by it.\n\nFollow these steps to create an obstacle that will\
    \ provide a challenge for the player without being punishing:\n\n1. **Set a keyframe\
    \ at the beginning of the animation.**\n2. **Go 90 frames and insert another keyframe\
    \ (position).**\n   The next thing you have to decide is how fast the crusher\
    \ will fall before hitting the bottom and stopping. For this, ten frames should\
    \ be more than enough for the falling animation.\n3. **Go to frame 100 and adjust\
    \ the Z position until the top of the crusher is touching the bottom of the crusher.**\n\
    4. **Insert a keyframe for the position at frame 100, and then add another keyframe\
    \ at frame 120.**\n   This will ensure that the crusher stays in its position\
    \ for a short period of time and prevents the player from getting past it.\n5.\
    \ **Go to frame 140 and move the crusher back to its starting position on the\
    \ `z`-axis.**\n   To give the crusher more impact when it hits the bottom platform,\
    \ try adding some squash and stretch or even have it bounce a little bit upon\
    \ hitting the surface of the platform. By adding some squash and stretch, it will\
    \ make the falling of the crusher seem even faster and the impact feel like it\
    \ hits even harder. By adding a few frames after where the crusher bounces up\
    \ and falls back down into place, you give the crusher more gravity. Even a brick\
    \ bounces when it drops — it doesn’t bounce *much,* and it’ll even break, but\
    \ there is a slight impact reverb, and animating that into your game will help\
    \ sell the idea of weight.\n6. **Check frames 90 and 100 to make sure that there\
    \ are keys set for their scale.**\n7. **Go to frame 95.**\n8. **Change the Y scale\
    \ to 2.7 and the Z scale to 0.8.**\n9. **Insert a keyframe.**\n10. **Go to frame\
    \ 102 and make sure the scale is correct.**\n    The X scale should be 30, the\
    \ Y scale should be 3, and the Z scale should be 0.5.\n11. **Insert a keyframe\
    \ for the scale.**\n12. **In frame 100, change the X scale to 30.68, the Y scale\
    \ to 3.44, and the Z scale to 0.42.**\n    This will create a squash-and-stretch\
    \ effect that will give the falling of the crusher more impact when it hits. It\
    \ doesn’t change anything except the shape of the mesh, but that small change\
    \ does a lot to give the impression of power.\n    Next, you’ll animate the impact\
    \ reverb of the crusher.\n13. **In frame 100, move the crusher down on the `z`-axis\
    \ so that the bottom of the crusher is touching the platform.**\n14. **Insert\
    \ a keyframe for the position.**\n15. **Go to frame 102 and move the crusher slightly\
    \ up on the `z`-axis.**\n16. **Insert a position keyframe.**\n17. **Go to frame\
    \ 104.**\n18. **Move the position of the crusher down and scale it so that the\
    \ Z scale is smaller and the X and Y scales are larger, but scale it less than\
    \ what you did for frame 30 in Step 12.**\n    This represents the object coming\
    \ to rest. It’s still hitting the platform hard and distorting a slight bit, but\
    \ by distorting less this time, it gives the illusion that the mesh’s landing\
    \ is slowing down.\n19. **Insert a keyframe.**\n20. **Move to frame 105.**\n21.\
    \ **Move the crusher up a slight bit so that it’s just off of the platform and\
    \ change its scale back to normal (see Step 10).**\n22. **Insert a keyframe.**\n\
    23. **Move to frame 106.**\n24. **Move the crusher to the platform and insert\
    \ a keyframe.**\n\nWhen you’re done, you’ll have a finished crusher animation\
    \ like the one in [Figure 10-22](#13_9781119404187-ch10.xhtml_c10-fig-0022).\n\
    \n![image](images/9781119404187-fg1021.png)\n\n[FIGURE 10-22:](#13_9781119404187-ch10.xhtml_rc10-fig-0022)\
    \ The finished crusher.\n\n## ANIMATING A MOVING PLATFORM\n\nThe moving platform\
    \ is probably the easiest thing to animate. Unlike the enemy character, which\
    \ had rotation, or the crusher, which had a delay, the moving platform just goes\
    \ back and forth in one direction.\n\nThe moving platform is supposed to act as\
    \ a bridge for the character to jump across some chasms. Following the example\
    \ in [Figure 10-23](#13_9781119404187-ch10.xhtml_c10-fig-0023), you’re going to\
    \ animate the moving platform across the `y`-axis:\n\n1. **Go to Frame 0.**\n\
    2. **Set the Y position to 10.**\n   The total range of movement is 20 units.\n\
    3. **Insert a keyframe.**\n4. **Go to frame 120.**\n5. **Insert a keyframe.**\n\
    6. **Go to frame 60.**\n7. **Set the Y position to –10.**\n8. **Insert a keyframe.**\n\
    9. **Change the end frame count to 120.**\n   After you make the animation, you’ll\
    \ notice that the platform never stops. This could be a problem because you’ll\
    \ want to give players at least a moment or two when the platform stops to give\
    \ the player time to jump on. Five frames of waiting should be enough.\n10. **Go\
    \ to frame 5.**\n11. **Change the Y position to 10.**\n12. **Insert a keyframe.**\n\
    13. **Go to frame 65.**\n14. **Change the Y position to –10.**\n15. **Insert a\
    \ keyframe.**\n\n![image](images/9781119404187-fg1023.png)\n\n[FIGURE 10-23:](#13_9781119404187-ch10.xhtml_rc10-fig-0023)\
    \ The moving platform.\n\nYou won’t need to add a pause after frame 120 because\
    \ the animation will automatically loop to a pause as it is.\n\n## ANIMATING THE\
    \ COINS\n\nThe last thing you need to animate for this game are the coins, shown\
    \ in [Figure 10-24](#13_9781119404187-ch10.xhtml_c10-fig-0024), for the player\
    \ to pick up. You’re going to animate the coins to spin and bounce up and down\
    \ slowly on the game level. This will give them a nice effect within the game\
    \ and make them stick out for players.\n\n![image](images/9781119404187-fg1024.png)\n\
    \n[FIGURE 10-24:](#13_9781119404187-ch10.xhtml_rc10-fig-0024) The coin.\n"
