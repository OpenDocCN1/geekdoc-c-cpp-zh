  trans: "\n\n1. **将你的方向光复制两次（总共三个）。**\n\n2. **让每盏光以不同的方向指向玩家角色——两盏从相机向下指向玩家，另外一盏从玩家后方向上指向。**\n\
    \n3. **选择一盏光（靠近相机的灯）作为你的主光（key light）。**\n\n   在 `Inspector` 中，当你选择主光时，你会看到一个\
    \ `Light` 组件。将颜色更改为 `White`。将强度（intensity）更改为 `0.8`（1 偏亮会导致场景稍微过曝，光线过多）。将实时阴影的强度（strength）更改为\
    \ `0.15`，以防止目前生硬的阴影。\n\n4. **选择相机附近的另一盏光，将其作为补光光（fill light）。**\n\n   在 `Inspector`\
    \ 中，将颜色也更改为稍深一点的白色。将强度更改为 `0.4`。确保实时阴影的强度（strength）为 `0`。\n\n5. **选择位于玩家后方的最后一盏光——那就是你的背光（back\
    \ light）。**\n\n   将颜色更改为浅灰色。将强度更改为 `0.2`。确保实时阴影的强度（strength）为 `0`。\n\n完成后，你的场景看起来应该类似于图\
    \ 11-11。\n\n![image](img/9781119404187-fg1111.png)\n\nFIGURE 11-11: 光照适当的场景。\n\
    \n## 创建雾效果\n\n让场景更生动的另一种方法是向场景添加雾气。正如名称所示，雾气会干扰场景的可见性，让摄像摄像物体变得模糊和暗淡。多年来，雾气一直用于游戏中以帮助处理性能，并在游戏中营造神秘感或距离感。当你向地平线看时，形状越远就越模糊。\n\
    \n在游戏中，你可以使用雾效果来模拟这种效果。首先，你必须回到之前用于更改环境光的光照设置窗口。\n\n1. **要创建雾效果，在光照设置向下滚动到 `Other\
    \ Settings` 标签页。**\n\n2. **勾选下拉列表中 `Fog` 旁的复选框。**\n\n   这将为游戏创建雾。相机越近，场景中的雾就越少。\n\
    \n3. **将雾的颜色更改为灰绿色，以匹配已设置的游戏色彩。**\n\n4. **确保 `Mode`（模式）为 `exponential squared`。**\n\
    \n5. **保持 `Density`（密度）为 `0.01`。**\n\n将在游戏窗口中创建一个良好的雾效果，这样当你玩游戏时，雾气会出现在游戏地平线上，遮挡玩家清晰看到某一点之外的能力。这将在游戏世界中营造距离感，并为游戏设置注入更多活力。正如你在图\
    \ 11-12 中所示，雾有助于塑造关卡的 3D 特性，并为玩家创造良好的视觉效果。\n\n![image](img/9781119404187-fg1112.png)\n\
    \nFIGURE 11-12: 带雾的场景。\n\n现在，在第 12 章添加角色和物体之前，花点时间比较一下章节末尾图像与章节开头图像。你已经可以看到光照和颜色比之前为场景带来了更多活力。游戏已进入最后的准备阶段！\n\
    \n![image](img/c12.png)\n\n在本章中，你将把角色和物体导入到 `Unity` 中完成游戏设置。本章是书中之前所有章节的结晶。你将把在\
    \ `Blender` 和 `Unity` 中工作的内容合并成一个最终版本的游戏，几乎不需要再写代码。\n\n在这里，你将学习如何将角色和动画导入到 `Unity`\
    \ 并设置动画，以便它们在开始游戏时播放。你还将学习如何为主玩家角色设置动画控制，以便动画仅在游戏中使用相应的控制时才播放。本章的目标是获得一个完成版本的游戏，它在下一章中只需要细微的修改和修复。\n\
    \n## 修复你的玩家角色以导入 Unity\n\n你可以毫无问题地导入在第 10 章中制作的大多数动画。但 `Unity`并不喜欢所有类型的动画——特别是形状键（shape\
    \ keys）。`Unity` 的设计是为了导入一种名为 `blend shapes`（混合形状）的形状键变体，通常用于 `Maya` 等程序中。幸运的是，解决这个问题有很多变通方法，但没有一个是有效的。\n\
    \n"
- fmt: "\nNow it’s time to import your first character into Blender. To do this, follow\
    \ these steps:\n\n1. **Open Unity and go to the Prefabs folder in the Project\
    \ window.**\n2. **Open the Finder window on a Mac or Windows Explorer on a PC.**\n\
    3. **Drag the FBX file from the Blender folder directly into the Prefabs folder.**\n\
    \   This will create a prefab of your character. In the drop-down of the character’s\
    \ prefab are all the different components of your character.\n4. **Drag the prefab\
    \ onto the screen to make the new character.**\n   The first thing you’ll notice\
    \ in [Figure 12-5](#15_9781119404187-ch12.xhtml_c12-fig-0005) is how large the\
    \ character is compared to the rest of the scene. This is because Unity’s units\
    \ are half the size of Blender’s units.\n5. **To fix this import error, select\
    \ the prefab of the player character that you just created.**\n   In the Inspector\
    \ window, you’ll notice that the window has changed to Import Setting. When you\
    \ import an animation or external 3D object, the window will open the Import Settings\
    \ when you select the prefab. You’ll go further into the Rig and Animation tabs\
    \ later in this chapter.\n6. **Click the Model tab.**\n   You’ll see many different\
    \ settings that can be checked or changed.\n7. **Change the Scale Factor to 0.5.**\n\
    8. **Make sure the following boxes are all checked:**\n   * Use File Scale\n \
    \  * Read/Write Enables\n   * Import BlendShapes\n   * Generate Colliders\n  \
    \ * Weld Vertices\n   * Import Visibility\n9. **Go down to the Materials section\
    \ in the model tab, and make sure Import Materials is checked.**\n10. **Change\
    \ the Material Naming drop-down to Model Name + Model’s Matter.**\n    This will\
    \ prevent multiple files from changing the materials to match other materials\
    \ with similar names.\n\n![image](images/9781119404187-fg1205.png)\n\n[FIGURE\
    \ 12-5:](#15_9781119404187-ch12.xhtml_rc12-fig-0005) The player character in the\
    \ scene.\n\n### Setting Up the Character\n\nBecause of the animations you’ve made,\
    \ when the player character begins, it will automatically move to point (0,0,0).\
    \ The way Unity reads the animations causes the characters or objects to reset\
    \ to where the characters or objects move in relation to the center point of Unity.\
    \ The simplest way to fix this problem is to give the animation a new center point\
    \ for it to be based on. This is done via parenting.\n\n### Setting Up the Animation\
    \ \n\nNow you’ll notice that either the animation will only play once and not\
    \ again or it won’t play at all when you click the Play button to play the game.\
    \ This is because you still have yet to set up the animation for the character.\
    \ This will require you to use the Rig and Animation tabs of the Inspector window\
    \ of the prefab.\n\n1. **Open up the Rig tab in the inspector window.**\n   There\
    \ are four animation types to choose from in the drop-down:\n   * None: When you\
    \ aren’t importing an animation.\n   * Legacy: The older way to import animations.\
    \ This method doesn’t work properly with an animation controller, so it’s not\
    \ good for using for the player character.\n   * Generic: The basic import method\
    \ that imports the animations while keeping the code in a way that Unity can read\
    \ and alter as necessary.\n   * Humanoid: Imports humanoid characters that have\
    \ rigging, attaching bones or armatures to the mesh so that different parts can\
    \ bend.\n2. **For this project, choose the Generic type.**\n3. **Change the Avatar\
    \ Definition to Create for This Model.**\n4. **Change the Root Node to None.**\n\
    5. **Click the Animations tab (see [Figure 12-9](#15_9781119404187-ch12.xhtml_c12-fig-0009)).**\n\
    6. **Scroll down to the Clips section.**\n   You see a ton of options and breakdowns.\
    \ These are just the different animation parts within the animation that Unity\
    \ can recognize. Sometimes this is accurate but most of the time, I find it’s\
    \ more reliable to just do it yourself.\n7. **Delete all the options and breakdowns\
    \ by selecting them and clicking the minus sign (–) in the right corner.**\n8.\
    \ **Click the plus sign (+) once.**\n9. **For the Source Take drop-down menu,\
    \ choose Eye control|Eye controlAction.**\n10. **For this first animation, change\
    \ the name of the clip to Idle.**\n    The blue highlights on the Timeline indicate\
    \ the part of the animation that the clip is using.\n11. **Adjust the Timeline\
    \ to include only the Idle animation of the character.**\n    My animation starts\
    \ at 0 and ends at 154.\n12. **Follow steps 8 through 11 for the walk and jump\
    \ animations, naming them Walking and Jump, respectively, as shown in [Figure\
    \ 12-10](#15_9781119404187-ch12.xhtml_c12-fig-0010).**\n\n![image](images/9781119404187-fg1209.png)\n\
    [FIGURE 12-9:](#15_9781119404187-ch12.xhtml_rc12-fig-0009) The first animation.\n\
    \n![image](images/9781119404187-fg1210.png)\n[FIGURE 12-10:](#15_9781119404187-ch12.xhtml_rc12-fig-0010)\
    \ The first animation.\n\nAfter you finish setting up, you have to make sure that\
    \ it works:\n\n1. **Select your character on the Hierarchy.**\n   You’ll notice\
    \ there is an animation component.\n2. **Select the Animation clip.**\n   This\
    \ will open the Animator window.\n3. **Double-click Idle.**\n   This will set\
    \ the Idle as the starting.\n4. **From the Animations drop-down, select Size.**\n\
    \   You’ll see a number below it.\n5. **For your animation, you only need three\
    \ so change the size to 3.**\n6. **Make sure that the elements are Idle, Walking,\
    \ and Jump.**\n\n![image](images/9781119404187-fg1211.png)\n[FIGURE 12-11:](#15_9781119404187-ch12.xhtml_rc12-fig-0011)\
    \ Select Animation\n\n### Creating the Animation Controller for Your Character\n\
    \nThe character now has the animation set up, but when you click Play nothing\
    \ happens. This is because there is nothing telling the game.\n\nTo control the\
    \ animation so that the proper animations play when the character moving, you\
    \ need an animator controller. An animator controller tells the character how\
    \ the animations interact with one another.\n\nTo create an animator controller,\
    \ like the one shown in [Figure 12-2](#15_9781119404187-ch12.xhtml_c12-fig-0012),\
    \ right-click in the Project window. You can create the animator controller in\
    \ any folder, but for the sake of simplicity I prefer creating the controller\
    \ in the prefabs folder or directly in the assets folder. Create ⇒ Animator Controller.\
    \ A new animator controller will be created. Rename it to `Character_animator`.\
    \ Double-clicking this new controller will open a new tab on the Scene window\
    \ called Animator.\n\n![image](images/9781119404187-fg1212.png)\n[FIGURE 12-12:](#15_9781119404187-ch12.xhtml_rc12-fig-0012)\
    \ Creating an animator controller.\n\nAfter you open the controller window, you’ll\
    \ realize that it’s empty, except for two boxes: Any State and Entry. To fix this,\
    \ open your Player character prefab and scroll down. At the bottom of the prefab,\
    \ you’ll see three tabs for the three clips you have for the different animations\
    \ for the character. Drag all three of them into the Animator window. Three new\
    \ boxes will appear, one for each of the different clips (see [Figure 12-13](#15_9781119404187-ch12.xhtml_c12-fig-0013)).\n\
    \n![image](images/9781119404187-fg1213.png)\n[FIGURE 12-13:](#15_9781119404187-ch12.xhtml_rc12-fig-0013)\
    \ The different clips in the animator.\n"
