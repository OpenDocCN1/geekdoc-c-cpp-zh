    \ it more to fit what you want it to be. Add more planks or obstacles that the\
    \ player has to overcome. Add more placeholders for when you make enemies to place\
    \ in [Chapters 9](#12_9781119404187-ch09.xhtml) through [12](#15_9781119404187-ch12.xhtml).\n\
    \nGame design is about making a game that you would want to play. When you’re\
    \ designing a level, ask yourself what would intrigue you and add it in.\n\nAfter\
    \ you finish your level, make sure that you aren’t missing anything or that there\
    \ aren’t gaps too big for the player. Make sure the game has a logical sense of\
    \ progression that will reward the player and not punish them. Adjust where necessary.\
    \ See [Figure 3-11](#06_9781119404187-ch03.xhtml_c03-fig-0011) as an example.\n\
    \n![image](images/9781119404187-fg0311.png)\n\n[FIGURE 3-11:](#06_9781119404187-ch03.xhtml_rc03-fig-0011)\
    \ The finished gray-box level.\n\n## GIVING YOUR LEVEL OBJECTIVE AND DIRECTION\n\
    \nObjectives are the lifeblood of a game. Without a clear objective, players don’t\
    \ know why they’re playing. When you’re designing your first level, you have to\
    \ decide what the goal of the player is. Is it to save the prince from the castle,\
    \ to survive until 6 a.m., or to escape a zombie-infested city?\n\nBuilding an\
    \ objective — especially an objective in a level — is a huge part of level design.\
    \ Objectives have to stand out to the player and draw the player’s attention.\
    \ Often in videogames, a lot is going at once. Even in a game like Super Mario\
    \ Bros., there are a ton of creatures waddling around that try to demand the player’s\
    \ attention. So how, as a game designer, do you build an objective that can stand\
    \ out?\n\nIn the case of Super Mario Bros., the objective was built into the mystery\
    \ of going further to discover more. It may seem strange, but part of the thrill\
    \ of playing Super Mario Bros. was that you never knew what was going to come\
    \ next! You had to be prepared for all sorts of monsters, as indicated early on\
    \ in the game. The main objective was to rescue the princess, but the minor objective\
    \ of each level was to get to the flag at the end.\n\nOther games use other techniques\
    \ to indicate direction. Some use coins or pickup items to give the player something\
    \ to follow. Other games give players direction by putting them into a dark room\
    \ and having only one door lit up at the end. Sometimes objectives fuel direction;\
    \ other times direction fuels objectives. As players, we hunt for answers to these\
    \ questions. We want to know what the purpose of the game is. As a designer, your\
    \ job is to clearly indicate where the player should be going and reward the player\
    \ for going there, either by giving the player more coins or by advancing the\
    \ plot.\n\nWhen you finish designing your level, you have to give the player a\
    \ reason to go forward. For the purposes of your platformer, this reasoning will\
    \ be items that the player can collect while going through the game. The following\
    \ steps will take you through how to create a pickup item (see [Figure 3-12](#06_9781119404187-ch03.xhtml_c03-fig-0012)):\n\
    \n1.  **Create a cube, sphere, or cylinder that will act as the pickup item in\
    \ the game.**\n\n2.  **Name the GameObject “Pickup.”**\n\n3.  **Create a prefab\
    \ for this object.**\n\n4.  **Begin placing the object copies throughout your\
    \ level.**\n\n    You can even place some in the air where the character will\
    \ be encouraged to jump.\n\n    By setting the object around the level leading\
    \ from the beginning to the end, you give your player a path for them to follow.\n\
    \n![image](images/9781119404187-fg0312.png)\n\n[FIGURE 3-12:](#06_9781119404187-ch03.xhtml_rc03-fig-0012)\
    \ Pickup item.\n\nThe pickup item doesn’t really stand out from the background.\
    \ So, how do you make the pickup item stand out from the rest of the scene? There\
    \ are multiple ways to do this:\n\n*   You can have the object be moving slightly.\n\
    \n*   You can put a light on the object so it glows when you look toward it.\n\
    \n*   You can make the object an unusual shape or size compared to the things\
    \ around it.\n\n*   You change the object’s color or hue so it stands out from\
    \ the background.\n\nFor this chapter, you’ll be following the last example. You\
    \ already placed all the objectives around the map, but the use of prefabs prevents\
    \ this from being a far more tedious task than it needs to be. Simply create a\
    \ new material and apply it to an object (see [Figure 3-13](#06_9781119404187-ch03.xhtml_c03-fig-0013)).\n\
    \n![image](images/9781119404187-fg0313.png)\n\n[FIGURE 3-13:](#06_9781119404187-ch03.xhtml_rc03-fig-0013)\
    \ A standout objective."
