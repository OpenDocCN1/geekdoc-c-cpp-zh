- fmt: '

    Although this would be enough to make the crusher, from a mechanical standpoint
    you want to actually create something that fits with the theme that you’ve set
    in the game. In this case, the theme is a robot dystopia, so on the top of the
    crusher you’re going to add a little police light.


    Using the `Inset Face`, `Extrude`, and `Loop-Cut` tools start building up a police
    light to put at the top of the crusher:


    1. **Inset a face on the small area on the top of the crusher that used to be
    the platform bottom for the bottom half.**

    2. **Scale that inset so that it looks closer to a square shape.**

    3. **Move that inset line up along the `z`-axis so that there is a progressive
    climb to the next height.**

    4. **Extrude** and bring the extrusion up, giving some space in between to be
    the light itself.

    5. **Extrude** again but go only a small distance up.

    6. **Extrude** again, bringing it up slightly more and sizing it down a bit at
    the top so it gets smaller the farther up it goes.

    7. **Extrude** again at the top to give it a nice flat top.

    8. **Using `Alt-select`, select the small extrusion from Step 5 and select all
    around it.**

    9. **Extrude** and use the `x`-axis and `y`-axis to expand the extrusion out so
    that it looks like a roof to the light (see [Figure 9-17](#12_9781119404187-ch09.xhtml_c09-fig-0017)
    for an example).


    ![image](images/9781119404187-fg0917.png)


    [FIGURE 9-17:](#12_9781119404187-ch09.xhtml_rc09-fig-0017) The light.


    After you finish the top light, it’s time to actually make the bottom part of
    the crusher to make it more intimidating. One of the most common ways to make
    the crusher look intimidating is by adding spikes to it, but this is a robot dystopia
    where most of the characters are cubes so spikes don’t feel right in the environment.
    For this environment, a flat bottom crusher with some indents feels more appropriate,
    so that’s what you’re going to make.


    In order to create the necessary indents, you’ll need to be able to extrude out
    on the bottom of the crusher only certain parts of the mesh as opposed to the
    whole bottom face. In order to do this, you need to create more faces. The best
    tool to do that with while still keeping quads is the `Loop-Cut Slide` tool.


    You can just use the tool multiple times to create the indents needed, but there
    is actually a way to make multiple cuts at once with the `Loop-Cut Slide` tool.
    While the tool is still pink, you can roll the middle mouse button forward and
    back to create multiple lines that will all cut at once. Do this so that you cut
    six lines vertically across the bottom and horizontally across the bottom (see
    [Figure 9-18](#12_9781119404187-ch09.xhtml_c09-fig-0018)).


    ![image](images/9781119404187-fg0918.png)


    [FIGURE 9-18:](#12_9781119404187-ch09.xhtml_rc09-fig-0018) Loop-cut slide lines.


    After you create the necessary lines, begin selecting every other face on the
    bottom of the mesh. That way, the bottom of the mesh will look like a checkerboard
    kind of pattern (see [Figure 9-19](#12_9781119404187-ch09.xhtml_c09-fig-0019)).
    This will give you the ability to extrude only the faces you want to extrude.
    For this project, you only want to extrude these faces to give the crusher some
    sense of style and pattern.


    ![image](images/9781119404187-fg0919.png)


    [FIGURE 9-19:](#12_9781119404187-ch09.xhtml_rc09-fig-0019) The checkerboard pattern
    at the bottom of the crusher.


    After you have all the faces selected, you should extrude them out. As before,
    you don’t want to extrude them out too much because you want to leave room for
    your player to get underneath, but you also want the size of the crusher to be
    notable in the game. Extrude the crusher sections out a little more than what
    you extruded the original platform out the first time. You’ll notice now that
    all the extrusions will look like a bunch of rectangles. That’s because you only
    pulled out the selected faces. The faces are still connected because of the shared
    vertices, but they’ll look like they’re slightly separated, which is mechanically
    not any different but helps build out the game’s style.


    After you finish the model for the crusher (see [Figure 9-20](#12_9781119404187-ch09.xhtml_c09-fig-0020)),
    you have to also give it a material, similar to the enemy and player characters
    before.


    ![image](images/9781119404187-fg0920.png)


    [FIGURE 9-20:](#12_9781119404187-ch09.xhtml_rc09-fig-0020) The crusher.


    ## CREATING MOVING PLATFORM


    Platforms are a key part of platformers, for obvious reasons. One of the most
    common platforms in any platformer is the moving platform. Moving platforms are
    like regular platforms, but instead they move around. In the level, you created
    several planks that were planned to be the locations for the moving platforms.
    Moving platforms are discussed in more detail in the animation chapter where you’re
    actually in charge of making the platforms move. But right now, your goal is to
    create the base of the platform you can animate. Luckily, moving platforms are
    really simple to make.


    Start by opening a new file in Blender and saving it as `moving platform.blend`.
    Select the cube in the middle of the grid and open the side window on the 3D view.
    Change the size of the moving platform to `X=5, Y=5, Z=0.5`. This will create
    a platform large enough that your character can jump on and thin enough to look
    good as a platform. This would work as a platform but once again you want to be
    able to stylize this for your game.


    Follow these steps:


    1. **Go to Edit Mode.**

    2. **Select the top and bottom faces.**

    3. **Inset both faces to make a square in the middle.**

    4. **Extrude the insets.**

    5. **Using the Scale tool, move the insets closer together in the mesh.**


    After you build the base for the model, change the material of it so it looks
    mechanical. You can even make the center part of the mesh look like glass. Simply
    go into Edit Mode, select the top and bottom insets, and change the color to blue
    and the transparency to `0.3` to `0.5`, whichever you prefer. Also, put the reflections
    on all the materials for the moving platform. This will create a nice moving platform
    for you to animate later, like the one shown in [Figure 9-22](#12_9781119404187-ch09.xhtml_c09-fig-0022).


    ![image](images/9781119404187-fg0922.png)


    [FIGURE 9-22:](#12_9781119404187-ch09.xhtml_rc09-fig-0022) The moving platform.


    ## CREATING THE COIN PICKUPS

