    Keyframes are the specific points in your animation that indicate movement. In
    old animations, they would be the major points in movement the character makes
    with the in-between frames being the frames that go from one keyframe to the next.
    In 3D animation, keyframes act much the same except that the computer automatically
    calculates the in-between frames.


    There are three ways to create a keyframe in `Blender`:


    *   At the bottom of the `Timeline` there is a red button. This is for automatic
    keyframing. When you move along the `Timeline` and then adjust the character when
    autokeying is on, it will automatically record the movement. It will also record
    any other changes within the `Scene` window, but it’s limited to only changes
    made within the scene, and not outside of the scene, so shapeless and material
    changes are not recorded by autokeying.

    *   The `Animation` tab to the left of the screen has an `Insert` and `Delete
    Keyframe` button. When you want to insert a keyframe, you click `Insert Keyframe`,
    and a menu pops up indicating all the different types of keyframes you can add,
    from the transform tools to the modifiers.

    *   The final way to insert a keyframe is to hover over what you want the keyframe
    to affect and pressing the `I` button on the keyboard. This creates a keyframe
    that affects the selected aspect of the object and can give you the control of
    inserting the keyframe via the animation menu while still giving the convenience
    of the autokeying. This can also affect modifiers and materials as well.


    ### BEGINNING YOUR ANIMATION


    Now that you’ve set up the shape keys and understand how key framing works, it’s
    time to start animating your character. Because this is your player character,
    you should figure out how much time each pose or motion will have for the animation.


    For the idle animation, you want about 3 to 5 seconds; for the walk cycle, only
    about 2 to 3 seconds; and the jump animation should be only 1 to 2 seconds. If
    you use the max time for all the animations, the total frame count should be around
    300 frames. Be sure to give some time in between each animation to prevent bleed
    over from one animation to another.


    Let’s start with the idle animation. In this animation, the actual motion the
    character will make will start when the player is idle for 3 seconds. After 3
    seconds, the character will look around to the left and right side and then wait
    for another 3 seconds before doing so again. Three seconds in an animation that
    is 30 frames per second means that the animation will begin at frame 90.


    1.  **At frame 0, insert keyframes for all the transform tools, as well as for
    all the shape keys.** When you do this they should all highlight yellow (see [Figure
    10-5](#13_9781119404187-ch10.xhtml_c10-fig-0005)).

    2.  **Go to frame 90 and insert frames the same way.**

    3.  **Skipping 20 frames, change either the right or left turns to 1.**

    4.  **Insert keyframes.**

    5.  **Move two frames forward.**

    6.  **Insert keyframes.**

    7.  **At frame 120, change the shape keys to 0.**

    8.  **Insert keyframes.**

    9.  **Repeat steps 2 through 6.**

    10. **At frame 150, change all the shape keys back to 0.**

    11. **Insert keyframes.**


    ![image](images/9781119404187-fg1005.png)


    [FIGURE 10-5:](#13_9781119404187-ch10.xhtml_rc10-fig-0005) Inserting the first
    keyframe.


    ### ANIMATING THE CHARACTER’S EYES


    You’t want your character’s eyes to fall out of its head (see [Figure 10-6](#13_9781119404187-ch10.xhtml_c10-fig-0006))
    in your game. Because of this, your player character’s eyes also have to move
    to match the body. The problem is that animating the eyes individually (see [Figure
    10-7](#13_9781119404187-ch10.xhtml_c10-fig-0007)) can be tedious. Plus, it may
    not guarantee that the eyes will rotate right way.


    ![image](images/9781119404187-fg1006.png)


    [FIGURE 10-6:](#13_9781119404187-ch10.xhtml_rc10-fig-0006) Your character before
    rotating the eyes.


    ![image](images/9781119404187-fg1007.png)


    [FIGURE 10-7:](#13_9781119404187-ch10.xhtml_rc10-fig-0007) A first attempt at
    rotating the eyes.


    The best way to fix this problem is to add a way to control both eyes at once
    while still matching the rotation of the cube’s. Adding an `empty` (as in [Figure
    10-8](#13_9781119404187-ch10.xhtml_c10-fig-0008)) that you can parent the eyes
    to will guarantee that the eyes will move at the same rotation, and you can even
    make it so the rotation of the `empty` matches the rotation of the body.


    1.  **Create a new `empty`.**

    2.  **Rename the `empty` “eye control.”**

    3.  **Change the position of the `empty` to `0,0,0`.** Because the cube is the
    same from `Blender`, the origin point is currently located at `0,0,0`. By moving
    the `empty` there, the eyes will be controlled and rotate along the same rotation
    that the cube is distorting.

    4.  **Parent the `eye control` to the cube.**

    5.  **Parent the eyes to the `empty`.**


    ![image](images/9781119404187-fg1008.png)


    [FIGURE 10-8:](#13_9781119404187-ch10.xhtml_rc10-fig-0008) Placing the empty.


    This will make it so that the eyes will rotate together along the same axis that
    the box is distorting and turning on. Now’s time to animate the eyes, but a new
    problem arises: When the character turns, the faces on the top actually get smaller
    when they turn so the eyes will popping out. You can fix this by adjusting the
    rotation and position of the eyes so that they get slightly closer as the character
    turns (see [Figure 10-9](#13_9781119404187-ch10.xhtml_c10-fig-0009)). Just be
    sure to match the eye turning and adjustment with the keyframes of the cube.


    ![image](images/9781119404187-fg1009.png)


    [FIGURE 10-9:](#13_9781119404187-ch10.xhtml_rc10-fig-0009) Turning with adjusted
    eyes.


    ### WORKING ON THE WALK CYCLE


    The next movement on the list is the walk cycle. Although this may be more difficult
    to animate for bipeds or quadrupeds, because the player character is just a single
    box the walk cycle is actually much simpler to animate than the idle animation.


    To start off, you’ll want to make sure that your character is in its starting
    pose before you begin. That way all the animations start out with the same base
    and don’t rely on any other animations to come before or after, giving more power
    to the player to control the character without breaking the illusion.


    Follow these steps:


    1.  **Skip ahead 20 or so frames to give each section of animation room in front
    and behind (see [Figure 10-10](#13_9781119404187-ch10.xhtml_c10-fig-0010)).**

    2.  **Set the starting keyframe here.**

    3.  **Move ten frames.**

    4.  **Change the walk shape key to 1.**

    5.  **Set a keyframe.**

    6.  **Move ten frames.**

    7.  **Change the walk shape key to 0.**

    8.  **Set a keyframe.**

    9.  **Repeat steps 3 through 8 one more time.**


    ![image](images/9781119404187-fg1010.png)


    [FIGURE 10-10:](#13_9781119404187-ch10.xhtml_rc10-fig-0010) Setting up the next
    section for animation.


    After you finish the walk cycle (like the one in [Figure 10-11](#13_9781119404187-ch10.xhtml_c10-fig-0011)),
    it’s time to adjust the eyes so that they don’t remain still while the body moves.
    Like before, match the eyes to the motion of the body using the keyframes. This
    one should be easier because all it requires is to move the eyes up and down to
    match the changing of the mesh. This will give the illusion of the character moving
    up and down as they walk (like the one in [Figure 10-12](#13_9781119404187-ch10.xhtml_c10-fig-0012)).


    ![image](images/9781119404187-fg1011.png)


    [FIGURE 10-11:](#13_9781119404187-ch10.xhtml_rc10-fig-0011) The finished walk.


    ![image](images/9781119404187-fg1012.png)


    [FIGURE 10-12:](#13_9781119404187-ch10.xhtml_rc10-fig-0012) The finished walk
    with eyes.

