    For example, let’s say you have a robot and you want to program it to make a peanut
    butter and jelly sandwich. In order to do this, you have to program each step
    involved in creating this sandwich. Try writing out all the steps that are needed
    to create a peanut butter jelly sandwich and then come back to this book. I’ll
    wait!


    It’s very likely that the list you came up with isn’t as detailed as it needs
    to be. In order to program a robot to make a peanut butter and jelly sandwich
    you have to have these steps:


    1.  **Turn to point toward cabinet.**


    2.  **Move toward cabinet.**


    3.  **Open hand.**


    4.  **Rotate arm up to handle.**


    5.  **Close hand around handle.**


    6.  **Open cabinet.**


    7.  **Release handle.**


    8.  **Move hand to peanut butter.**


    9.  **Grab peanut butter.**


    10.  **Take peanut butter out of cabinet.**


    11.  **Put peanut butter on counter.**


    12.  **Move hand to jelly.**


    And these are just the steps for taking out the peanut butter and jelly! In the
    real code, you would have to program what the total distance of a step is for
    the robot and how many steps it requires to go to the cabinet. You would also
    have to program it to know what jelly and peanut butter are, as well as bread
    slices, a plate, and a knife.


    Coding is all about laying out clear directions for the computer to follow. In
    games, your code not only has to act on its own, but also has to react to what
