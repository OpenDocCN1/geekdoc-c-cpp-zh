    *   **Adventure games** push you to explore and discover more about the world
    around you.


    *   **Horror games** (like Slender: The Arrival, shown in [Figure 1-2](#04_9781119404187-ch01.xhtml_c01-fig-0002))
    get your adrenaline pumping and push your natural curiosity to its limits.


    *   **Puzzle games** reward you for solving different complex puzzles and for
    problem solving.


    *   **Platformers** (like Super Meat Boy, shown in [Figure 1-3](#04_9781119404187-ch01.xhtml_c01-fig-0003))
    work off of reward and punishment and challenge you to master the controls and
    the timing to perfectly execute a level.


    ![image](images/9781119404187-fg0101.png)


