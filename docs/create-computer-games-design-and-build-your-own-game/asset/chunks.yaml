    You should animate objectives to move, even slightly, to help them stand out from
    the background. For objects that you want to be picked up, you should always give
    small indications to the players that these `can` be picked up. Giving the item
    a highlight when the player passes near it, making it a different color, or giving
    it a small in-place animation are all things that can help add to the idea that
    these items can be picked up. Because these are pickup items spread throughout
    the game, making them float slightly off the ground is a good way to make them
    stand out to the player while not making them threatening or getting them confused
    with the enemies.


    First, let’s animate the object spinning. The total animation time shouldn’t be
    long but it shouldn''t be too fast either, because you want these objects to appear
    approachable. Objects that are moving fast aren’t as approachable as slower-moving
    objects. Five seconds is a good amount of time for the animation, so set the frame
    count to 150 frames. Making the object spin is easy because of the rotation tool.
    Again, going off of the idea that you don’t want the objects to spin rapidly,
    one complete spin every five seconds will look good on these coins, as shown in
    [Figure 10-25](#13_9781119404187-ch10.xhtml_c10-fig-0025).


    ![image](images/9781119404187-fg1025.png)


    [FIGURE 10-25:](#13_9781119404187-ch10.xhtml_rc10-fig-0025) The coin with the
    completed rotation.


    Follow these steps:


    1. Go to frame 0.

    2. Insert a keyframe.

    3. Go to frame 150.

    4. Change the Z rotation to 360.

    5. Insert a keyframe.


    This will cause the coins to spin in place. Most of the changes to the coin are
    purely for visual reasons. You want the coin to stand out so that the player knows
    to pick it up. One other thing that you can do to make it stand out is have it
    float up and down along the `z`-axis. That way the players will be able to see
    the coin bouncing in place instead of moving around like the enemy grunt or crashing
    down like the crusher. Slow, simple animations, like the one shown in [Figure
    10-26](#13_9781119404187-ch10.xhtml_c10-fig-0026), are the best.


    1. In frame 0, change the Z position to 2.

    2. Insert a keyframe.

    3. Go to frame 40.

    4. Change the Z position to 1.

    5. Insert a keyframe.

    6. Go to frame 80.

    7. Change the Z position to 2.5.

    8. Insert a keyframe.

    9. Go to frame 115.

    10. Change the Z position to 1.

    11. Insert a keyframe.

    12. Go to frame 150.

    13. Change the Z position to 2.

    14. Insert a keyframe.


    ![image](images/9781119404187-fg1026.png)


    [FIGURE 10-26:](#13_9781119404187-ch10.xhtml_rc10-fig-0026) The finished coin
    animation.


    ![image](images/c11.png)


    This chapter is about setting up the level by adjusting the small things, such
    as the ground color and the background, as well as the lighting. In this chapter,
    I’ll explain how to change the ground material so that it stands out from the
    background, how to change the ambient lighting from the environment, and how to
    set up the lighting in the game.


    You’ll also learn about how lighting changes a game and how to properly light
    a game so that the shapes are clearly distinguished in 3D. I’ll explain how three-point
    lighting setups work and the difference between the different lights you can create
    in Unity.


    ## CHANGING THE GROUND COLOR


    When you design your levels, think about how you can separate your level from
    the background. This may seem like an obvious bit of advice, but many game developers
    fall into the trap of not distinguishing which parts of the level can be interacted
    with and which parts are just a part of the background. In your platformer, this
    isn’t as much of an issue because the background and level don’t really mix, but
    you should get into the habit of distinguishing the background from the parts
    of your level that players can interact with. Indicating clearly what parts of
    the environment are able to be hopped on or grabbed can help prevent player frustration,
    which is the major balance that you have to strike when developing your game.


    As of right now, the game has very little color in it (see [Figure 11-1](#14_9781119404187-ch11.xhtml_c11-fig-0001)).
    The level is just white on a gray-blue background, with the only sprinklings of
    color coming from the characters and pickup items. The level is visually dull.
    This problem will be partially fixed when you import the characters you made.


    ![image](images/9781119404187-fg1101.png)


    [FIGURE 11-1:](#14_9781119404187-ch11.xhtml_rc11-fig-0001) The level with the
    color.


    Follow these steps:


    1. Create a new material and name it `Ground`.

    2. Change the Diffuse Color to a darker green.

    3. Change the Metallic Color to 0.

    4. Change the Smoothness to 0.

    5. Make sure Emission is off.

    6. Apply the material to the ground.


    ![image](images/9781119404187-fg1102.png)


    [FIGURE 11-2:](#14_9781119404187-ch11.xhtml_rc11-fig-0002) The level with the
    color assigned.


    ![image](images/9781119404187-fg1103.png)


    [FIGURE 11-3:](#14_9781119404187-ch11.xhtml_rc11-fig-0003) Applying the color
    to the stairs.


    ![image](images/9781119404187-fg1104.png)


    [FIGURE 11-4:](#14_9781119404187-ch11.xhtml_rc11-fig-0004) The ground color Inspector.


    ## EDITING THE ENVIRONMENTAL LIGHTING


    Now that the level’s ground has been set up and is a nice color that complements
    the game’s already cartoony theme, it’s time to learn a bit more about the environmental
    lighting of the game. Environmental lighting controls the natural lighting that
    is affected by the environment. Think of it as a tint to the scene that highlights
    the different parts of the scene but also matches the coloring of the environment.

