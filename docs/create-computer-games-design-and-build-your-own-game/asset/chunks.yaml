- fmt: "\nSimilarly, before you design a game, you need to ask yourself what type\
    \ of game you want to make and who will be playing the game. In this section,\
    \ I’ve listed some of the questions you should ask yourself.\n\n### WHAT IS YOUR\
    \ GAME ABOUT?\n\nDo you want to make a war game that puts players in the middle\
    \ of World War II or a game about a haunted children’s restaurant where animatronic\
    \ machines are trying to kill you? What your game is about can help you think\
    \ about the story and help contextualize some of the decisions you’ll make as\
    \ you’re designing your game.\n\n### WHAT TYPE OF GAME ARE YOU MAKING?\n\nIs your\
    \ game a choice based role-playing game (RPG) or a more linear platformer? There\
    \ are many different types of games that you can make. The type you choose can\
    \ drastically change how people see your game.\n\nImagine if Skyrim were a 2D\
    \ platformer, or if Five Nights at Freddy’s (shown in [Figure 1-5](#04_9781119404487-ch01.xhtml_c01-fig-0005))\
    \ gave you the ability to move around. Imagine how different those games would\
    \ be.\n\n![image](images/9781119404187-fg0105.png)\n\n[FIGURE 1-5:](#04_9781119404187-ch01.xhtml_rc01-fig-0005)\
    \ Five Nights at Freddy’s.\n\n### WHAT TYPE OF FEELING ARE YOU AIMING TO PROVOKE\
    \ WITH YOUR GAME?\n\nDo I want my player to feel powerful or powerless? A game\
    \ that encourages exploration in a vast wasteland, like Fallout 4 (shown in [Figure\
    \ 1-6](#04_9781119404187-ch01.xhtml_c01-fig-0006)), provokes different feelings\
    \ than a game that puts players in a cramped hallway. You want to go into your\
    \ game knowing what type of feelings you want the player to feel. Knowing this\
    \ can influence mechanic and story decisions.\n\n![image](images/9781119404187-fg0106.png)\n\
    \n[FIGURE 1-6:](#04_9781119404187-ch01.xhtml_rc01-fig-0006) Fallout 4.\n\n###\
    \ WHO IS YOUR PLAYER PLAYING AS?\n\nIs he a soldier in the war fighting for his\
    \ country, or is he the civilian just trying to survive as the war happens around\
    \ him? When you make your game, think of how you want to frame your story or your\
    \ characters. The story of a brave knight trying to vanquish her nemesis, the\
    \ evil warlock, is far different than a story of an evil knight bent on defeating\
    \ the good wizard.\n\n### WHAT IS THE PLAYER’S OBJECTIVE?\n\nGames have goals.\
    \ Sometimes the goal is to defeat the villain. Other times, it’s to survive until\
    \ morning. Think of your game as a story. Characters need a purpose. Mario isn’t\
    \ just running around the mushroom kingdom for fun. He’s going to rescue the princess.\
    \ Setting a clear objective for your player will give her direction in your game.\
    \ Even games that focus on exploration set objectives that the player can strive\
    \ for. Even if the objective isn’t the most important part of your game, it’s\
    \ important to have one.\n\n### WHAT OBSTACLES WILL YOUR PLAYER FACE?\n\nWhat\
    \ is stopping your player from reaching his goal? Games aren’t fun without any\
    \ challenge. You never want your player to be bored in your game. The easiest\
    \ way to prevent boredom is to understand what types of obstacles the player needs\
    \ to overcome. This can take the shape of enemy characters trying to kill your\
    \ player or just puzzles that the player has to solve.\n\n### WHO IS YOUR PLAYER?\n\
    \nThe most important question of all is who you’re designing your game for. The\
    \ type of person who plays a peaceful game like Minecraft (shown in [Figure 1-7](#04_9781119404187-ch01.xhtml_c01-fig-0007))\
    \ may not be the same type of person who plays a fast-paced game like Street Fighter.\
    \ Knowing the type of person you want to play your game can help determine the\
    \ type of game you create.\n\n![image](images/9781119404187-fg0107.png)\n\n[FIGURE\
    \ 1-7:](#04_9781119404187-ch01.xhtml_rc01-fig-0007) Minecraft.\n\n## CREATING\
    \ YOUR GAME ON PAPER\n\nA good exercise is to create a game on paper before you\
    \ go into designing game on the computer. This will help you understand the importance\
    \ of mechanics in your game without getting caught up with all the bells and whistles.\
    \ Try thinking of a simple objective-based game that someone can play with just\
    \ pen and paper.\n\n![image](images/c2.png)\n\n`Unity` is a program that you can\
    \ download for free — just go to `www.unity3d.com/get-unity`. Developed by `Unity\
    \ Technologies`, this program opened up game development for a whole generation\
    \ of developers. You can use `Unity` to develop 2D and 3D games, but for the purposes\
    \ of this book, I show you how to develop 3D game.\n\nIn this chapter, you’ll\
    \ learn some organization techniques that will help you manage your game creation.\
    \ I show you how to create a new file in `Unity`, introduce you to the basic layouts\
    \ and controls of `Unity`, and explain how to create an in-game object. This chapter\
    \ may not be the most exciting, but you really need to understand these basics\
    \ before beginning your game, so don’t skip ahead!\n\nSimilar to the games you\
    \ play, game making is modular. You have to take things one step at a time. In\
    \ later chapters, you’ll dive into more difficult parts of game creation that\
    \ have way more moving pieces and files to keep track of. Organizing your files\
    \ and knowing the layout of `Unity` will save you the headache of trying to locate\
    \ your files, not to mention hours trying to retrace your steps.\n\n## GETTING\
    \ ORGANIZED\n\nWhether you’re baking cookies or changing the oil in your car or\
    \ developing a computer game, you need to get organized first. Getting organized\
    \ isn’t the fun part of any job, but it makes every job easier.\n\n`Unity` does\
    \ a lot of heavy lifting when it comes to organizing the files you need to create\
    \ your computer game. But before you begin creating your game, you need to create\
    \ a directory to store all games. This directory serves two purposes:\n\n* It\
    \ creates an easy-to-remember spot on your computer for you to find all your files.\
    \ The last thing you want to have to do is dig around through a bunch of folders\
    \ looking for where you saved your game.\n* Creating backups and transferring\
    \ your files is much easier when they’re all in the same spot. You don’t want\
    \ some files in one place and other files in another. All your files for your\
    \ games should be in the same area. Think of it the way you think of the notebooks\
    \ you keep for your classes. You wouldn’t put your biology notes in your English\
    \ notebook and that history quiz in your French folder — at least not if you want\
    \ to pass those classes! The same goes for the files you use to build your computer\
    \ games.\n\nWhen you create games on your own, apart from this book, you can make\
    \ these directories as specific or as broad as you want to include things like\
    \ music files, sound files, image files, and so on. For the purposes of the game\
    \ you’re building in this book, the directory described here (shown in [Figure\
    \ 2-1](#05_9781119404187-ch02.xhtml_c02-fig-0001)) will serve you just fine.\n\
    \n![image](images/9781119404187-fg0201.png)\n\n[FIGURE 2-1:](#05_9781119404187-ch02.xhtml_rc02-fig-0001)\
    \ The directory for your new game.\n\n## CREATING A NEW FILE\n\nWhen you have\
    \ your directory set up (see the preceding section), you’re ready to create a\
    \ new file. Follow these steps:\n\n1. Open `Unity`.\n2. Click `Create a New File`.\n\
    \   The new project screen appears (see [Figure 2-2](#05_9781119404187-ch02.xhtml_c02-fig-0002)).\n\
    3. In the `Project Name` field, enter `Boxo_3D_Platformer`.\n4. In the `Location`\
    \ field, enter `Unity_Files`.\n   That’s the folder you create in the preceding\
    \ section.\n5. Select the `3D` button.\n6. Click `Create Project`.\n   A new folder\
    \ is created within the `Unity_Files` folder that contains all your game information,\
    \ as well as all your assets (components that are used within the game, game objects,\
    \ characters, music, images, and other types of files used in our game are all\
    \ examples of assets).\n\n![image](images/9781119404187-fg0202.png)\n"
  raw: "Similarly, before you design a game, you need to ask yourself what type of\
    \ game you want to make and who will be playing the game. In this section, I’ve\
    \ listed some of the questions you should ask yourself.\n\n### WHAT IS YOUR GAME\
    \ ABOUT?\n\nDo you want to make a war game that puts players in the middle of\
    \ World War II or a game about a haunted children’s restaurant where animatronic\
    \ machines are trying to kill you? What your game is about can help you think\
    \ about the story and help contextualize some of the decisions you’ll make as\
    \ you’re designing your game.\n\n### WHAT TYPE OF GAME ARE YOU MAKING?\n\nIs your\
    \ game a choice based role-playing game (RPG) or a more linear platformer? There\
    \ are many different types of games that you can make. The type you choose can\
    \ drastically change how people see your game.\n\nImagine if Skyrim were a 2D\
    \ platformer, or if Five Nights at Freddy’s (shown in [Figure 1-5](#04_9781119404187-ch01.xhtml_c01-fig-0005))\
    \ gave you the ability to move around. Imagine how different those games would\
    \ be.\n\n![image](images/9781119404187-fg0105.png)\n\n[FIGURE 1-5:](#04_9781119404187-ch01.xhtml_rc01-fig-0005)\
    \ Five Nights at Freddy’s.\n\n### WHAT TYPE OF FEELING ARE YOU AIMING TO PROVOKE\
    \ WITH YOUR GAME?\n\nDo I want my player to feel powerful or powerless? A game\
    \ that encourages exploration in a vast wasteland, like Fallout 4 (shown in [Figure\
    \ 1-6](#04_9781119404187-ch01.xhtml_c01-fig-0006)), provokes different feelings\
    \ than a game that puts players in a cramped hallway. You want to go into your\
    \ game knowing what type of feelings you want the player to feel. Knowing this\
    \ can influence mechanic and story decisions.\n\n![image](images/9781119404187-fg0106.png)\n\
    \n[FIGURE 1-6:](#04_9781119404187-ch01.xhtml_rc01-fig-0006) Fallout 4.\n\n###\
    \ WHO IS YOUR PLAYER PLAYING AS?\n\nIs he a soldier in the war fighting for his\
    \ country, or is he the civilian just trying to survive as the war happens around\
    \ him? When you make your game, think of how you want to frame your story or your\
    \ characters. The story of a brave knight trying to vanquish her nemesis, the\
    \ evil warlock, is far different than a story of an evil knight bent on defeating\
    \ the good wizard.\n\n### WHAT IS THE PLAYER’S OBJECTIVE?\n\nGames have goals.\
    \ Sometimes the goal is to defeat the villain. Other times, it’s to survive until\
    \ morning. Think of your game as a story. Characters need a purpose. Mario isn’t\
    \ just running around the mushroom kingdom for fun. He’s going to rescue the princess.\
    \ Setting a clear objective for your player will give her direction in your game.\
    \ Even games that focus on exploration set objectives that the player can strive\
    \ for. Even if the objective isn’t the most important part of your game, it’s\
    \ important to have one.\n\n### WHAT OBSTACLES WILL YOUR PLAYER FACE?\n\nWhat\
    \ is stopping your player from reaching his goal? Games aren’t fun without any\
    \ challenge. You never want your player to be bored in your game. The easiest\
    \ way to prevent boredom is to understand what types of obstacles the player needs\
    \ to overcome. This can take the shape of enemy characters trying to kill your\
    \ player or just puzzles that the player has to solve.\n\n### WHO IS YOUR PLAYER?\n\
    \nThe most important question of all is who you’re designing your game for. The\
    \ type of person who plays a peaceful game like Minecraft (shown in [Figure 1-7](#04_9781119404187-ch01.xhtml_c01-fig-0007))\
    \ may not be the same type of person who plays a fast-paced fighting game like\
    \ Street Fighter. Knowing the type of person you want to play your game can help\
    \ determine the type of game you create.\n\n![image](images/9781119404187-fg0107.png)\n\
    \n[FIGURE 1-7:](#04_9781119404187-ch01.xhtml_rc01-fig-0007) Minecraft.\n\n## CREATING\
    \ YOUR GAME ON PAPER\n\nA good exercise is to create a game on paper before you\
    \ go into designing a game on the computer. This will help you understand the\
    \ importance of mechanics in your game without your getting caught up with all\
    \ the bells and whistles that come with a theme. Try thinking of a simple objective-based\
    \ game that a person can play with just a pen and paper.\n\n![image](images/c2.png)\n\
    \nUnity is a program that you can download online for free — just go to [`www.unity3d.com/get-unity/download`](http://www.unity3d.com/get-unity/download).\
    \ Developed by Unity Technologies, this open-source program has opened up game\
    \ development for a whole new generation of game developers (like you!). You can\
    \ use Unity to develop 2D and 3D games, but for the purposes of this book, I show\
    \ you how to develop a 3D game.\n\nIn this chapter, you’ll learn some basic organization\
    \ techniques that will help you manage your game creation. I show you how to create\
    \ a new file in Unity, introduce you to the basic layouts and controls of Unity,\
    \ and explain how to create an in-game object. This chapter may not be the most\
    \ exciting, but you really need to understand these basics before beginning your\
    \ game, so don’t skip ahead!\n\nSimilar to the games you play (and will create!),\
    \ game making is modular. You have to take things one step at a time. In later\
    \ chapters, you’ll dive into more difficult parts of game creation that have way\
    \ more moving pieces and files to keep track of. Organizing your files and knowing\
    \ the layout of Unity will save you the headache of trying to locate your files\
    \ or tools, not to mention hours trying to retrace your steps.\n\n## GETTING ORGANIZED\n\
    \nWhether you’re baking cookies or changing the oil in your car or developing\
    \ a computer game, you need to get organized first. Getting organized isn’t the\
    \ fun part of any job, but it makes every job easier.\n\nUnity does a lot of heavy\
    \ lifting when it comes to organizing the files you need to create your computer\
    \ game. But before you begin creating your game, you need to create a directory\
    \ to store all your games in. This directory serves two purposes:\n\n*   **It\
    \ creates an easy-to-remember spot on your computer for you to find all your files.**\
    \ The last thing you want to have to do is dig around through a bunch of folders\
    \ looking for where you saved your game.\n\n*   **Creating backups and transferring\
    \ your files is much easier when they’re all in the same spot.** You don’t want\
    \ some files in one place and other files in another. All your files for your\
    \ games should be in the same area. Think of it the way you think of the notebooks\
    \ you keep for your classes. You wouldn’t put your biology notes in your English\
    \ notebook and that history quiz in your French folder — at least not if you want\
    \ to pass those classes! The same goes for the files you use to build your computer\
    \ games.\n\nWhen you create games on your own, apart from this book, you can make\
    \ these directories as specific or as broad as you want, to include things like\
    \ music files, sound files, image files, and so on. For the purposes of the game\
    \ you’re building in this book, the directory described here (shown in [Figure\
    \ 2-1](#05_9781119404187-ch02.xhtml_c02-fig-0001)) will serve you just fine.\n\
    \n![image](images/9781119404187-fg0201.png)\n\n[FIGURE 2-1:](#05_9781119404187-ch02.xhtml_rc02-fig-0001)\
    \ The directory for your new game.\n\n## CREATING A NEW FILE\n\nWhen you have\
    \ your directory set up (see the preceding section), you’re ready to create a\
    \ new file. Follow these steps:\n\n1.  **Open Unity.**\n\n2.  **Click Create a\
    \ New File.**\n\n    The new project screen appears (see [Figure 2-2](#05_9781119404187-ch02.xhtml_c02-fig-0002)).\n\
    \n3.  **In the Project Name field, enter** Boxo_3D_Platformer**.**\n\n4.  **In\
    \ the Location field, enter** Unity_Files**.**\n\n    That’s the folder you create\
    \ in the preceding section.\n\n5.  **Select the 3D button.**\n\n6.  **Click Create\
    \ Project.**\n\n    A new folder is created within the `Unity_Files` folder that\
    \ contains all your game information, as well as all your *assets* (components\
    \ that are used within the game, game objects, characters, music, images, and\
    \ other types of files used in our game are all examples of assets).\n\n![image](images/9781119404187-fg0202.png)"
