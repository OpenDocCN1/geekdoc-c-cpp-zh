  trans: "\n\n图 2-2: 新项目界面。\n\n# 理解 Unity 的布局\n\n当你打开 Unity 时，会看到一个看起来很吓人的界面（如图 2-3\
    \ 所示）。*不要害怕 Unity。* 克服这种本恐惧最好的方法是了解屏幕的每个部分的作用，以及它们与你正在创建的游戏的关系。\n\n![image](img/9781119404187-fg0203.png)\n\
    \n图 2-3: 这是你打开 Unity 时看到的内容。\n\n以下是图 2-3 中显示的内容：\n\n*   **场景窗口 (Scene window)：**\
    \ 场景窗口是 Unity 中的两个主窗口之一，可以在这里放置和设置游戏对象。\n*   **游戏窗口 (Game window)：** 游戏窗口是 Unity\
    \ 的另一个主窗口，它让你感知游戏完成后的样子。它是一个预览，让你看到需要进行哪些调整。\n*   **项目窗口 (Project window)：** 项目窗口允许你管理项目的资产。它按类型组织文件。在项目窗口的右上角，你可以搜索特定的资产。此后，项目窗口将允许你访问材质、场景、预制体（prefabs）、脚本和其他资产。\n\
    *   **工具栏 (Toolbar)：** 工具栏位于屏幕顶部（在图 2-4 中有更详细的展示）。它让你能够控制场景，允许你变换对象并在整个场景区域内移动。在工具栏上，你可以找到播放、暂停游戏以及访问\
    \ Unity 云端账户的控件。\n\n以下是你在工具栏上找到的工具：\n\n*   **平移工具 (Pan tool)：** 抓住屏幕本身并移动相机，以便更好地查看游戏对象或世界。\n\
    *   **移动工具 (Translation tool)：** 沿着 3D 的三个轴（X、Y 和 Z）移动你的对象。\n*   **旋转工具 (Rotation\
    \ tool)：** 绕三个轴旋转对象。\n*   **缩放工具 (Scale tool)：** 允许你调整对象的大小，使其在三个轴上变大或变小。点周围的正方形也是缩放工具，但它是从对象的角进行缩放的，而不是仅仅从中心或轴点。\n\
    *   **坐标轴工具 (Gizmo tool)：** 调整对象上*轴点*（对象旋转或缩放的点）的位置，以及你遵循的轴方向。\n*   **播放按钮 (Play\
    \ button)：** 启动游戏，以及任何游戏启动时触发的物理或事件。再次按下播放按钮会将游戏重置为开始。\n*   **暂停按钮 (Pause button)：**\
    \ 在播放期间暂停游戏。\n*   **步进按钮 (Step button)：** 播放后逐帧移动场景。\n*   **云按钮 (Cloud button)：**\
    \ 允许访问 Unity 的云端服务（参见相邻的侧边栏）。\n*   **账户下拉菜单 (Account drop-down menu)：** 允许在线访问你的\
    \ Unity 账户。\n*   **层下拉菜单 (Layer drop-down menu)：** 允许更改场景中可见的层或对象。\n*   **布局下拉菜单\
    \ (Layout drop-down menu)：** 允许更改 Unity 的整体布局以更好地适应你的风格。\n*   **检查器窗口 (Inspector\
    \ window)：** 检查器允许你检查并修改选取对象的属性。这些属性随对象而异，因此检查器窗口布局在整个工作过程中变化最大，但知道如何在此窗口操作对于创建游戏至关重要。\n\
    *   **层级面板 (Hierarchy)：** 层级列出了场景中所有的游戏对象以及它们之间的关系。你可以使用场景窗口选择这些对象，也可以通过层级面板选择。将层级面板视为项目内所有内容的列表。\n\
    *   **控制台窗口 (Console window)：** 控制台窗口位于 Unity 屏幕的最底部。它的主要目的是直接显示来自 Unity 的消息。通常，你在这里看到的是错误信息，往往与项目代码直接相关。当你编写游戏代码时，控制台窗口最有用，因为它能帮助你缩小游戏哪些部分没有正常工作以及原因。\n\
    \n![image](img/9781119404187-fg0204.png)\n\n图 2-4: 工具栏。\n\n# 场景导航\n\n在创建游戏时，能够在场景中导航是非常重要的。你需要能够移动和旋转场景控件，以便控制和创建你的游戏。主要有三种方法可以：\n\
    \n*   **平移 (Panning)：** 平移是在场景中上下或左右移动。如果你使用鼠标，通过按住中间键进行平移。如果你使用触控板，通过按住 `Alt`\
    \ 键进行平移。\n*   **旋转 (Rotating)：** 旋转让你围绕场景移动，就像站在原地。如果你使用鼠标，通过按住 `Alt` 并移动进行旋转。\n\
    *   **缩放 (Zooming)：** 缩放让你靠近或远离场景。如果你使用鼠标，通过滚动滚轮进行缩放。如果你使用触控板，通过双指上下滑动进行缩放。\n\n\
    # 创建游戏对象\n\n当你知道如何导航场景时，就可以准备创建对象了。在 Unity 中创建对象有两种方法。你可以选择 `GameObject` 菜单（在\
    \ File 菜单附近），或者在层级面板选择 `Cube`。\n\n在开始之前，重置对象的起点以确保它位于中心。重置起点遵循以下步骤：\n\n1.  选择要重置的对象。\n\
    2.  进入对象的 `Inspector` 窗口（参见图 2-5）。\n3.  在 `Transform` 部分点击右上角的齿轮图标。\n4.  点击 `Reset`。\n\
    \n你知道工具栏可以变换对象，但在 `Inspector` 窗口中有另一种更精确的方法。检查器的变换部分可以通过特定数字移动、缩放和旋转对象：\n\n* \
    \  **位置 (Position)** 表示相对于场景中心的位置。\n*   **旋转 (Rotation)** 表示对象相对于每个轴的角度。\n*  \
    \ **缩放 (Scale)** 表示对象相对于原始大小的缩放比例。\n\n尝试这些控件以熟悉它们。然后将立方体的 X、Y、Z 轴 `Scale` 设置为\
    \ 4（如图 2-6 所示）。\n\n![image](img/9781119404187-fg0206.png)\n\n图 2-6: 缩放为 0,0,4。\n\
    \n你创建了一个立方体对象，但 Unity 中还可以创建其他对象。以下是简要概述：\n\n*   **3D 对象：** 这些是 3D 游戏中的普通对象。3D\
    \ 对象包括：\n\n    *   立方体 (Cube)\n    *   球体 (Sphere)\n    *   胶囊体 (Capsule)\n  \
    \  *   圆柱体 (Cylinder)\n    *   平面 (Plane)\n    *   四边形 (Quad)\n    *   布娃娃节点 (Rag-doll)\n\
    \    *   地形 (Terrain)\n    *   树 (Tree)\n    *   风域 (Wind Zone)\n    *   3D 文字\n\
    \n"
- fmt: "\n*   **2D objects:** There is only one type of 2D object that you can create\
    \ with this menu: sprites. Sprites are images that you can program to change to\
    \ show different things for different actions — everything from a character running\
    \ to a character shooting a gun or talking.\n\n*   **Empties:** Empties are invisible\
    \ objects that you place in the scene to control or mark something about the scene.\
    \ They won’t show up when you export your game and act only as controls within\
    \ your game.\n\n*   **Lights:** Lights brighten the scene and can change how the\
    \ game looks depending on the light setup. Lights are mainly used to brighten\
    \ the characters and setting and help render a character in 3D.\n\n*   **Audio\
    \ and video:** The Audio and Video menus help render videos and sounds into your\
    \ game. These can range from background noise/scenes to music and dialogue.\n\n\
    *   **UI:** `UI` stands for `user interface.` This alters what the player sees\
    \ onscreen while playing the game. It can range from text informing the player\
    \ of the controls to images and health bars.\n\n*   **Particle systems:** Particle\
    \ systems include a variety of different effects that can be seen onscreen, ranging\
    \ from downpouring water to explosive fire blasts.\n\n*   **Cameras:** Cameras\
    \ act as the player’s eyes into the game. They can be stationary or follow the\
    \ player around, but their primary purpose is to frame how a game is played. This\
    \ may not seem important, but the angle at which a game is played can change a\
    \ lot about the game itself. One example: A first-person shooter framed as a top-down\
    \ shooter is a vastly different play experience even if the controls are exactly\
    \ the same.\n\n## CREATING AND USING PREFABS\n\nPrefabs are an easy way to create\
    \ multiple objects that all have the same properties and shapes. Creating non-player\
    \ characters (NPCs) or in-game objects can be a pain, but with prefabs, you can\
    \ reuse assets without having to copy and paste them and create multiple individually\
    \ editable objects.\n\nPrefabs are stored game objects that retain the same properties\
    \ and can be placed into the game scene at any time. Let’s say you have a `collectible`\
    \ (something that your character needs to pick up). Instead of creating hundreds\
    \ of the same object over and over again, you can use a prefab to create all of\
    \ them and adjust the prefab as necessary. Prefabs are easy to use and save a\
    \ ton of time.\n\nCreating a prefab is easy, but first you want to be sure that\
    \ you create a folder to store your prefabs in, to keep things organized. Follow\
    \ these steps:\n\n1.  **In the Project window, be sure that nothing else is selected.**\n\
    2.  **Click Create New Folder.**\n    The new folder appears within the `Assets`\
    \ folder.\n3.  **Name the new folder `Prefabs`.**\n4.  **Select the object that\
    \ you want to turn into a prefab — in this case, the 4x4x4 cube.**\n5.  **Drag\
    \ the object from the Hierarchy into the `Prefabs` folder in the Project window.**\n\
    \    A prefab of the object is created, as shown in [Figure 2-7](#05_9781119404187-ch02.xhtml_c02-fig-0007).\n\
    \n![image](images/9781119404187-fg0207.png)\n\n[FIGURE 2-7:](#05_9781119404187-ch02.xhtml_rc02-fig-0007)\
    \ Prefabs.\n\nAfter creating a prefab, you can select the prefab in the Project\
    \ window to alter and add new components to all the prefabs in the scene. For\
    \ example, you can change the size of the object, change its color, or give it\
    \ gravity.\n\nTry adding the component `Rigidbody` to the prefab you have in the\
    \ Project window and see what happens:\n\n1.  **Click Add Component.**\n2.  **Select\
    \ Physics.**\n3.  **Select Rigidbody.**\n4.  **Press Play on the Toolbar.**\n\n\
    The cube(s) fall through the sky. This is because you just added gravity to them.\
    \ I touch on the `Rigidbody` component more in [Chapter 4](#07_9781119404187-ch04.xhtml),\
    \ but for now, follow these steps:\n\n1.  **Click the Play button again to reset\
    \ the game.**\n2.  **Choose 3D Object  Plane.**\n    This will create a plane\
    \ in the `Scene` window.\n3.  **Reset the plane’s origin in the Inspector window,\
    \ as you did with the cube earlier (using the gear in the upper right of the Inspector\
    \ window).**\n4.  **Use the Translation tools to move the cube along the `y`-axis\
    \ so that it’s under the box.**\n\n![image](images/c3.png)\n\nIn this chapter,\
    \ you learn some of the core concepts behind your first level and how to design\
    \ a good introductory level to your game. Beyond that, this chapter will also\
    \ teach you some basics about level design, which you’ll be able to use going\
    \ forward to design your own unique levels for your future games.\n\nIn order\
    \ to create clear and interesting levels, you have to start off by thinking of\
    \ them not in their final polished forms but from their most basic beginnings.\
    \ A game with pretty images and dull mechanics is just a boring game, but designers\
    \ have been drawing people into games for years, starting back when they were\
    \ only a few pixels on a screen.\n\nThis chapter shows you how to set aside your\
    \ theme while you design so that you can create the most compelling gameplay possible\
    \ from the beginning.\n\n## UNDERSTANDING THE IMPORTANCE OF LEVEL \n\nIn books\
    \ or movies, the first pages or minutes matter. They are your hooks that grab\
    \ the audience. In a game, the first level is what you sell to the player.\n\n\
    There are some great examples of first levels (opening minutes) in gaming history\
    \ — Super Mario. (see [Figure 3-1](#06_9781119404187-ch03.xhtml_c02-fig-0001)),\
    \ Super Meat Boy (see [Figure 3-2](#06_9781119404187-ch03.xhtml_c02-fig-0002)),\
    \ and Mass Effect 2 (see [Figure 3-3](#06_9781119404187-ch03.xhtml_c02-fig-0003)),\
    \ to name just a few. None of these games’ first levels feel superfluous. They\
    \ present only the necessary information for players to better understand the\
    \ game. Even Mass Effect 2, which presents a gorgeous display of a planet in the\
    \ background, doesn’t feel excessive because the level is supposed to inspire\
    \ a sense of awe and wonder.\n\n![image](images/9781119404187-fg0301.png)\n\n\
    [FIGURE 3-1:](#06_9781119404187-ch03.xhtml_c02-fig-0001) Mario’s World 1-1.\n\n\
    ![image](images/9781119404187-fg0302.png)\n\n[FIGURE 3-2:](#06_9781119404187-ch03.xhtml_c02-fig-0002)\
    \ Super Meat Boy World 1-1.\n\n![image](images/9781119404187-fg0303.png)\n\n[FIGURE\
    \ 3-3:](#06_9781119404187-ch03.xhtml_c02-fig-0003) Mass Effect 2 opening.\n\n\
    ## DESIGNING YOUR FIRST LEVEL\n\nDesigning your first level is similar to trying\
    \ to solve your first algebraic equation or make your first layup: You won’t get\
    \ it perfect the first time. In fact, it’s impossible to design a perfect level\
    \ on your first attempt, so don’t stress about it!\n\n### THINKING ABOUT MECHANICS\
    \ AND THEME\n"
