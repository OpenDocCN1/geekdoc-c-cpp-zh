- fmt: "\nNo one just does an action — there is always a half-second delay. When you\
    \ animate these moments, the character’s anticipation is also exaggerated. Think\
    \ of fighting games. When a character throws a punch, there is a slight pause\
    \ before the punch is thrown. This pause is even more exaggerated when it’s supposed\
    \ to be more powerful. When you animate your characters, you should keep this\
    \ anticipation in mind. Characters don’t just jump up or attack. There has to\
    \ be a moment of anticipation to really sell the idea that these characters exist.\n\
    \nThat said, you don’t want the delay to be too long. Otherwise, these motions\
    \ will kill the flow of gameplay. So, when you’re animating your characters, you\
    \ have to keep in mind both the gameplay and the animation.\n\n## ANIMATING YOUR\
    \ PLAYER CHARACTER\n\nThe first thing you should animate for your game is your\
    \ player character because it requires the most animations. Unlike the other objects\
    \ or characters, the player character’s movements directly relate to what the\
    \ player is doing at any given time. The enemy characters or hazards have specific\
    \ animation loops that never change — they just repeat continuously.\n\nThe player\
    \ character needs to do different things depending on what the player needs:\n\
    \n*   **An idle animation:** Most games these days don’t have the characters just\
    \ stand still on the screen when the player isn’t moving. You’re creating living\
    \ characters for the players to control. If the character stands still, this can\
    \ break that immersion.\n    In the original Sonic the Hedgehog game, SEGA used\
    \ the idle animation to reinforce the personality of the main character as a “too\
    \ cool” speedster. If players don’t move Sonic, he’ll begin to tap his foot impatiently,\
    \ waiting for the player to make a movement. And if players wait long enough,\
    \ Sonic will even jump off the edge of the level out of impatience and leave!\n\
    *   **A walking animation:** The most standard animation in the game, movement\
    \ animations have existed since the days of Pac-Man. If a character is just floating\
    \ around the screen, it breaks player immersion. Adding a walk cycle for whenever\
    \ the character moves helps give life to your character.\n*   **A jump animation:**\
    \ This animation adds more to how the character moves around and helps reinforce\
    \ the idea of the character as being alive. When you jump, you don’t just move\
    \ vertically. Jump motions add animation to a jump, to help sell the illusion\
    \ of playing as a real character.\n\nThe main character of the game you’re creating\
    \ in this book is a box (see [Figure 10-1](#13_9781119404187-ch10.xhtml_c10-fig-0001)),\
    \ so the character’s actual movement is limited — but it’s still possible to give\
    \ a box life and feeling. (Consider the Luxo Jr. lamp from Pixar as an example\
    \ of how to get feeling from an inanimate object.) For your game, you’ll focus\
    \ on a way to get only the basic movement of the character, keeping in mind that\
    \ the techniques and tools that you’ll be using can also be used to create far\
    \ more extensive ranges of motion.\n\n![image](images/9781119404187-fg1001.png)\n\
    \n[FIGURE 10-1:](#13_9781119404187-ch10.xhtml_rc10-fig-0001) Boxo!\n\n### USING\
    \ SHAPE KEYS\n\nBlender separates editing from object manipulation through the\
    \ two different modes. The problem is that you aren’t able to animate changing\
    \ the character’s shape with the vertices, edges, or faces within Blender. Blender’s\
    \ animation tools are limited to Object Mode (and Pose Mode through rigging).\
    \ Although you can animate many parts of the object (including the textures and\
    \ modifiers, as you’ll learn later in this chapter), you can’t animate changes\
    \ made within Edit Mode without an particular Blender extension. And even then,\
    \ the animation is limited and finicky at best.\n\nSo, with a character as simple\
    \ as a box, how are you supposed to animate the character so that it feels alive\
    \ and moving? Luckily, Blender has an answer for this in the form of shape keys.\n\
    \nShape keys are different variations on the shape of the same object. They allow\
    \ you to mark changes in your edit and adjust the influence of those changes on\
    \ a scale from 0 influence to 1 influence. You can have multiple shape keys on\
    \ the same object, but when both shape keys are being used at the same time, the\
    \ object distorts to the midpoint of the two different shape keys. Shape keys\
    \ are useful tools for creating things like facial animations because you can\
    \ use multiple shape keys to affect different parts of the face, such as the eyes\
    \ and the mouth. You can also combine shape keys to create more complex emotions.\n\
    \nFor the player character, you’ll be using shape keys to help bring to life their\
    \ movement within the scene. Because the character designs are so simplistic in\
    \ nature, the way the character moves and expresses has been reduced. But you\
    \ can still rely on the cartoony nature of the style to help bring the character\
    \ to life.\n\nFirst, you need to create a shape key:\n\n1.  **Select the object\
    \ that you want.**\n2.  **Go to the Object Data tab in the Properties section\
    \ of the window.**\n3.  **Scroll down to Shape Keys.**\n4.  **On the right side,\
    \ click the plus sign (+) button twice.**\n    This creates a base shape key that\
    \ all the other shape keys will use as a reference. Clicking it a second time\
    \ will also create your first shape key (see [Figure 10-2](#13_9781119404187-ch10.xhtml_c10-fig-0002)).\n\
    5.  **Select Key 1 and switch to Edit Mode.**\n\n![image](images/9781119404187-fg1002.png)\n\
    \n[FIGURE 10-2:](#13_9781119404187-ch10.xhtml_rc10-fig-0002) Creating shape keys\n\
    \n### BREAKING DOWN YOUR PLAYER CHARACTER’S ANIMATION\n\nIn most animations, including\
    \ the ones you’ll be doing later in this chapter for the game, you do only one\
    \ major animation, with each individual part of the animation flowing into the\
    \ others naturally over time. This isn’t the case for your player character, because\
    \ you need multiple animations in one Timeline so that your game can refer to\
    \ them in [Chapter 12](#15_9781119404187-ch12.xhtml) when you import you characters.\n\
    \n### CREATING A KEYFRAME\n"
