    \ an empty (as in [Figure 10-8](#13_9781119404187-ch10.xhtml_c10-fig-0008)) that\
    \ you can parent the eyes to will guarantee that the eyes will move at the same\
    \ rotation, and you can even make it so the rotation of the empty matches the\
    \ rotation of the body.\n\n1.  **Create a new empty.**\n\n2.  **Rename the empty\
    \ “eye control.”**\n\n3.  **Change the position of the empty to (0,0,0).**\n\n\
    \    Because the cube is the same cube from opening up Blender, the origin point\
    \ is currently located at (0,0,0). By moving the empty there, the eyes will be\
    \ controlled and rotate along the same rotation that the cube is distorting.\n\
    \n4.  **Parent the eye control to the cube.**\n\n5.  **Parent the eyes to the\
    \ empty.**\n\n![image](images/9781119404187-fg1008.png)\n\n[FIGURE 10-8:](#13_9781119404187-ch10.xhtml_rc10-fig-0008)\
    \ Placing the empty.\n\nThis will make it so that the eyes will rotate together\
    \ along the same axis that the box is distorting and turning on. Now it’s time\
    \ to animate the eyes, but a new problem arises: When the character turns, the\
    \ faces on the top actually get smaller when they turn so the eyes will be popping\
    \ out. You can fix this by adjusting the rotation and position of the eyes so\
    \ that they get slightly closer as the character turns (see [Figure 10-9](#13_9781119404187-ch10.xhtml_c10-fig-0009)).\
    \ Just be sure to match the eye turning and adjustment with the keyframes of Boxo\
    \ turning.\n\n![image](images/9781119404187-fg1009.png)\n\n[FIGURE 10-9:](#13_9781119404187-ch10.xhtml_rc10-fig-0009)\
    \ Boxo turning with adjusted eyes.\n\n### WORKING ON THE WALK CYCLE\n\nThe next\
    \ movement on the list is the walk cycle. Although this may be more difficult\
    \ to animate for bipeds or quadrupeds, because the player character is just a\
    \ single box the walk cycle is actually much simpler to animate than the idle\
    \ animation.\n\nTo start off, you’ll want to make sure that your character is\
    \ in its starting pose before you begin. That way all the animations start out\
    \ with the same base and don’t rely on any other animations to come before or\
    \ after, giving more power to the player to control the character without breaking\
    \ the illusion.\n\nFollow these steps:\n\n1.  **Skip ahead 20 or so frames to\
    \ give each section of animation room in front and behind (see** [**Figure** **10-10**](#13_9781119404187-ch10.xhtml_c10-fig-0010)**).**\n\
    \n2.  **Set the starting keyframe here.**\n\n3.  **Move ten frames.**\n\n4.  **Change\
    \ the walk shape key to 1.**\n\n5.  **Set a keyframe.**\n\n6.  **Move ten frames.**\n\
    \n7.  **Change the walk shape key to 0.**\n\n8.  **Set a keyframe.**\n\n9.  **Repeat\
    \ steps 3 through 8 one more time.**\n\n![image](images/9781119404187-fg1010.png)\n\
    \n[FIGURE 10-10:](#13_9781119404187-ch10.xhtml_rc10-fig-0010) Setting up the next\
    \ section for animation.\n\nAfter you finish the walk cycle (like the one in [Figure\
    \ 10-11](#13_9781119404187-ch10.xhtml_c10-fig-0011)), it’s time to adjust the\
    \ eyes so that they don’t remain still while the body moves. Like before, match\
    \ the eyes to the motion of the body using the keyframes. This one should be easier\
    \ because all it requires is to move the eyes up and down to match the changing\
    \ of the mesh. This will give the illusion of the character moving up and down\
    \ as they walk (like the one in [Figure 10-12](#13_9781119404187-ch10.xhtml_c10-fig-0012)).\n\
    \n![image](images/9781119404187-fg1011.png)\n\n[FIGURE 10-11:](#13_9781119404187-ch10.xhtml_rc10-fig-0011)\
    \ The finished walk.\n\n![image](images/9781119404187-fg1012.png)\n\n[FIGURE 10-12:](#13_9781119404187-ch10.xhtml_rc10-fig-0012)\
    \ The finished walk with eyes."
