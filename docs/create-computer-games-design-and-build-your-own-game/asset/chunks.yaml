    \ Network appear to swap polish for passion. Each line feels alive in the show,\
    \ even if the line is dirty itself.\n\nTim Burton’s films are all stylized to\
    \ have a very dull color palette with splashes of crisp color and elongated shapes.\
    \ His movies are distorted and gothic to engross audiences in his vision of the\
    \ world.\n\nSony Animation tries to build expressive characters and focuses on\
    \ 3D characters that feel like they could be 2D characters. Characters move in\
    \ ways that are larger than life and more expressive than normal humans.\n\nYou’ll\
    \ learn more about animation and what goes into bringing the characters to life\
    \ in [Chapter 10](#13_9781119404187-ch10.xhtml), but for now just keep in mind\
    \ that style changes the story even if the plot and characters don’t change at\
    \ all. None of the styles I just described is bad, but they do change the way\
    \ you think of the films that the styles are used in. Imagine if Tim Burton did\
    \ a film about an overprotective vampire trying to care for his daughter, or if\
    \ Cartoon Network did a show about a talking duck and his three nephews traveling\
    \ the world on adventures in search of riches.\n\n## CREATING YOUR FIRST CHARACTER\n\
    \nFor the game you’re working on in this book, the theme and style have been premade\
    \ to maximize how much you’ll be able to do and learn. The game is about a simple\
    \ box person who is trying to escape from a robot dystopian society. The characters\
    \ themselves are very cartoony in their style and will have big eyes as their\
    \ key feature. This style is easy to model and animate, so you’ll be able to easily\
    \ build and animate your game with limited modeling and animation experience.\n\
    \nThe main character is a blue box with two round eyes. To start making the character,\
    \ open a new file in Blender. The cube that you have when you open Blender is\
    \ a good place to start because it’s the exact size and proportions that you’ll\
    \ need for your character.\n\n### CREATING THE EYES\n\nAfter you open Blender\
    \ and have a cube on the grid (see [Figure 9-1](#12_9781119404187-ch09.xhtml_c09-fig-0001)),\
    \ it’s time to make the eyes for the character. The character’s eyes are just\
    \ simple spheres that will be in the cube. To create the eyes, follow these steps:\n\
    \n1.  **Click the Create tab.**\n\n2.  **Scroll down to the Sphere, and rotate\
    \ it 90 degrees on the *y*-axis.**\n\n    This way, the eyes are facing forward.\n\
    \n3.  **Scale the eye down to be smaller than the cube.**\n\n4.  **Place the eyeball\
    \ in the cube so that it’s sticking out of the cube as if it were an eyeball.**\n\
    \n5.  **With the eye still selected, press Shift + D.**\n\n    This will duplicate\
    \ the eye so that there are two of them.\n\n6.  **Move the other eye to the other\
    \ half of the cube so that the character has two eyes (see** [**Figure** **9-2**](#12_9781119404187-ch09.xhtml_c09-fig-0002)**).**\n\
    \n![image](images/9781119404187-fg0901.png)\n\n[FIGURE 9-1:](#12_9781119404187-ch09.xhtml_rc09-fig-0001)\
    \ Blender’s open screen.\n\n![image](images/9781119404187-fg0902.png)\n\n[FIGURE\
    \ 9-2:](#12_9781119404187-ch09.xhtml_rc09-fig-0002) The cube with eyes.\n\n###\
    \ PARENTING THE EYES TO THE BODY\n\nAfter you finish making the eyes, there is\
    \ still a problem in the character. The eyes don’t move with the body when you\
    \ move the body. Most people have no desire to leave their eyes behind when they\
    \ start walking, so the best way to solve this problem is to parent the eyes to\
    \ the cube. To do this, go to your outliner and find the cube and spheres.\n\n\
    To parent the spheres to the cube, simply drag the spheres to the cube. When you\
    \ do so, a little text box will pop up and say Drop to Set Parent. When you see\
    \ that text box, drop the spheres and they’ll be parented to the object (see [Figure\
    \ 9-3](#12_9781119404187-ch09.xhtml_c09-fig-0003)).\n\n![image](images/9781119404187-fg0903.png)\n\
    \n[FIGURE 9-3:](#12_9781119404187-ch09.xhtml_rc09-fig-0003) The parented eyes.\n\
    \n### CREATING A MATERIAL FOR THE CHARACTER\n\nAfter you make the eyes, it’s time\
    \ to add some color to your characters. You can do this in both Unity and Blender,\
    \ but Blender gives you a few more options when you’re making the materials for\
    \ your characters.\n\nFirst, make sure that you select the object you want to\
    \ assign this material to. You’ll be able to use the same materials for different\
    \ objects later, but for now you need to create a new material because this is\
    \ the first material you’ll be making in the game.\n\nTo create a new material,\
    \ follow these steps:"
