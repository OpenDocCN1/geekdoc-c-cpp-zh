    \ any game, and having feedback on what does or doesn’t work prevents a game from\
    \ falling stagnant. Asking people to play your game and give honest constructive\
    \ feedback can be scary, but the sooner you overcome that fear, the better a game\
    \ developer you’ll be.\n\n## FINDING THE PROBLEMS IN YOUR GAME\n\nEven the game\
