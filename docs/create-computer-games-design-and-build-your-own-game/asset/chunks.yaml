    The problem stems from the game giving back too much information to the code.
    Although the code isn’t on the player character itself, the character is parented
    to an object with the code so it’s also slightly affected by the code. Because
    of this, the collider on the player character also registers the triggers and
    sends them back to the code to adjust the score. This leads to the player losing
    two points instead of just one point as originally designed. To fix this problem,
    you just have to turn the box collider off of the player character. The parent
    of the character has all the code needed and a box collider of their own, so removing
    the box collider on the character itself just prevents the same thing from happening
    twice within the game. See [Figure 13-3](#16_9781119404187-ch13.xhtml_c13-fig-0003)
    for an example.


    ![image](images/9781119404187-fg1303.png)


    [FIGURE 13-3:](#16_9781119404187-ch13.xhtml_rc13-fig-0003) Removing the box collider.


    ### THE HEIGHT OF SOME PLATFORMS ARE HIGHER THAN THE CHARACTER CAN JUMP'
