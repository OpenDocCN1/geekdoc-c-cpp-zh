  trans: "\n你想要创建的代码是 `countText` 和 `winText`。与浮点数类似，这里的名称除了作为后续代码的指示值外，其名称本身实际上并不重要。这些代码将用于计算玩家的得分，一旦玩家达到某个分数，就表示玩家“赢得”了游戏。\n\
    \n你想将这个 `int` 类型的代码命名为 `count`。同样，名称并不重要，但 `count` 会向你或任何其他查看这段代码的人表明，这个整数与计数直接相关。在这种情况下，该整数计算的是玩家收集的拾取物品数量。\n\
    \n在添加这些代码后，转到 `void Start` 字符串处，你将会在那里添加两个新代码：\n\n*   `Count = 0;`: 这将在关卡开始时将计数整数设置为\
    \ 0。在设置为 0 之后，你就可以在后面的代码中让该数字增加。\n*   `SetCountText();`: 该代码引用了你稍后将有的文本代码。在每次整数更改后，这段代码都会记录更改并将其发送文本代码，以相应更改其数字。\n\
    \n在代码的底部（参见图 4-13），在 `void FixedUpdate` 中添加了两个 void：`void OnTriggerEnter(Collider\
    \ other)` 和 `void SetCountText()`：\n\n![image](img/9781119404187-fg0413.png)\n\
    \n图 4-13： 代码的结束。\n\n```cpp\nvoid OnTriggerEnter (Collider other) {\n    if (other.gameObject.CompareTag(\"\
    Pickup\"))\n    {\n        other.gameObject.SetActive(false);\n        count =\
    \ count + 1;\n        SetCountText();\n    }\n}\n```\n\n`onTriggerEnter` 仅在特定事件发生时激活，在括号中，该事件定义为当对象的碰撞器与另一个碰撞器接触时。这意味着每当角色碰到另一个物体时，这段代码就开始运行，但为了限制这段代码仅影响此字符串内的拾取物品，使用了一个\
    \ `if` 语句：`if (other.gameObject.CompareTag(\"Pickup\"))`。现在代码已经确定，每当物体与另一个物体碰撞时，如果另一个对象的标签是\
    \ `Pickup`，就会执行字符串的下一部分。\n\n该部分字符串的第一行表示，当它与另一个物体碰撞时，它将将其 `SetActive` 设置为 `false`。这会导致另一个物体在游戏中消失，看起来就像它被捡起来了，但实际上它只是不再在游戏中渲染了。下一行将计数整数设置为\
    \ `count + 1`，这使总数增加了 1。最后，在第三行中，代码用整数重置 `countText`。\n\n现在，每当游戏角色碰到带有 `Pickup`\
    \ 的物体时，该物体就会消失，玩家的得分就会增加 1。\n\n`SetCountText()` 在这段代码中已经被多次引用。这段字符串定义了当引用 `SetCountText`\
    \ 时会发生什么。在段字符串内部，代码引用了之前设置的公有文本 `countText`。\n\n```cpp\ncountText.text = \"Count:\
    \ \" + count.ToString();\n```\n\n这将定义 `countText` 并告诉用户界面 (UI) 显示什么文本。你确定这是一个文本文件，因此它有必须定义的单词。在引号内，你指定了\
    \ `countText` 将显示的单词，并指示它还将在单词末尾包含整数计数。通过添加 `+`，计算机知道要将整数添加到所述短语的末尾。因为每当角色捡起物体时，代码都会引用这段字符串，随着你收集更多物品，字符串末尾的值将会增长。\n\
    \n在 `SetCountText()` 的最后尾是一个 `if` 语句，它决定了何时显示 `winText`。当 `count` 等于或大于 12 时，`winText`\
    \ 将显示消息“CONGRATS YOU WON!!!”。此值取决于你散布在整个关卡的拾取物品数量，但无论具体数字是多少，代码都能工作。只需更改数字以匹配关卡上的拾取物品数量。这里是完成的代码：\n\
    \n```cpp\nvoid SetCountText()\n{\n    countText.text = \"count: \" + count.ToString();\n\
    \    if (count >= 12)\n    {\n        winText.text = \"CONGRATS YOU WON!!!\";\n\
    \    }\n}\n```\n\n保存代码，并返回 Unity 进行测试（参见图 4-14）。\n\n![image](img/9781119404187-fg0414.png)\n\
    \n图 4-14： 带有...的游戏\n\n## 创建标签和用户界面\n\n现在你已经创建了 UI，必须将 UI 与代码链接起来。\n\n既然你已经创建了\
    \ UI，就必须将 UI 链接到代码。\n\n### 创建界面\n\n创建实际上非常简单。像任何其他对象一样，转到 GameObject，向下滚动到 UI，然后选择\
    \ Text。这将创建一个带有文本的画布。目标是将 UI 链接到代码。首先，在检查器中，将文本命名为 `CountText`。将其放在左上角，首先调整位置为\
    \ (X=0, Y=0, Z=0)。在检查器的左上角将有一个锚。点击该指示器并选择左上角，然后移动位置使文本可见。在我的游戏中，X=95, Y=-34，Z=0，但这对你的游戏可能有所不同。在检查器的底部，你会看到一些更改文本颜色、大小和字体的设置。找到适合你游戏的设置。点击\
    \ Best Fit 框，这将使文本适应屏幕，使其尽可能易读且不会遮挡太多屏幕。完成创建后，创建另一个 UI 并命名为 `WinText`。不要把它放在角落，而是将其居中，并确保加粗和斜体（选择字体样式并选择加粗和斜体）。这一个也点击\
    \ Best Fit，但将其最大大小改为 60，最小大小改为 10。最后，删除此框中的所有文本，因为虽然文本会替换这些文本，但在结束之前不会这样做，所以保持为空可以确保在赢得游戏之前游戏窗口是空的。\n\
    \n现在你已经创建了 UI，必须将 UI 上的文本链接到你的代码。幸运的是 Unity 让这一切变得非常简单。\n\n1. 选择玩家。\n2. 在检查器中向下滚动直到到达\
    \ Char (Script) 组件。\n3. 选择 Count Text 旁边的目标。会出现一个 Select Text 弹出窗口。\n4. 选择 Count\
    \ Text。\n5. 对 Win Text 重复此操作（选择 Win Text）。\n\n### 创建标签\n\n标签是可以分配给一个或多个游戏对象的引用。配合代码使用，标签可以帮助确定某些物品是否可以被捡起或者敌人是否可以在接触时破坏角色。这是一次向多个对象分配值的方法。\n"
- fmt: "\nTo create a tag, simply click any object. In the upper left of the `Inspector`\
    \ window, you’ll see a `Tag` drop-down menu. Selecting this menu will show some\
    \ already created tags that are in Unity:\n\n* Untagged\n* Respawn\n* Finish\n\
    * EditorOnly\n* MainCamera\n* Player\n* GameController\n\nTo create your own tag,\
    \ scroll to the bottom of the tag list and select `Add Tag`. This will open up\
    \ a `Tags & Layers` window. In this window, in the `Tags` drop-down, simply click\
    \ the `+` to create a new tag and name it `Pickup`. This will create a `Pickup`\
    \ tag.\n\nAfter you create this tag, go to the `Prefabs` folder and select your\
    \ `Pickup` prefab. Assign it the tag `Pickup`, and save your scene and project.\n\
    \nBefore you play your scene, in order for the collider to work properly, go to\
    \ the `box collider` in the `Inspector` window and open the drop-down. Make sure\
    \ that the box next to `Trigger` is checked; otherwise, nothing will happen when\
    \ the character collides with the object.\n\nPress `Play` to test out your game.\
    \ Now whenever your character crosses paths with any of the pickups it will pick\
    \ them up and the score will increase.\n\n## CODING YOUR CAMERA\n\nThe last thing\
    \ you need to code for your game in this chapter is your camera. Right now, the\
    \ camera just stays still as your character moves around the screen, but what\
    \ you want the camera to do is follow your character around the level. To do this,\
    \ you have to first create a new code specifically for your camera. Create a new\
    \ `C#` code in your code folder and name it `Cam`. Then open that code up.\n\n\
    The camera code isn’t as in depth as the character code (see figure), but it still\
    \ adds some new codes. The first five lines of the code remain the same and do\
    \ not need to be changed. After the `public` class, you want to add a `public`\
    \ and a `private`:\n\n* `public GameObject Player;`: This gives the camera code\
    \ the ability to select a particular object and determine its value as `Player`.\
    \ It works similar to the text code created in the `char` code.\n* `private Vector3\
    \ offset;`: This part of the code allows you to freely move around the camera\
    \ in Unity to create the angle you want it to follow the player on. This way,\
    \ in the code, you don’t have to define what the distance and rotation is.\n\n\
    ![image](images/9781119404187-fg0415.png)\n\n[FIGURE 4-15:] The camera code.\n\
    \nIn the `void Start` string, write `offset = transform.position - Player.Transform.position;`.\
    \ This will link the offset of the camera (how far away from its target it is)\
    \ to the `Player` GameObject you created earlier. The transform position of the\
    \ camera is directly linked to the position of the player from the start:\n\n\
    ```\nvoid Start () {\n  offset = transform.position - Player.Transform.position;\n\
    }\n```\n\nIn `void LateUpdate` (which will replace `void Update`), write `transform.position\
    \ = Player.transform.position + offset;`. This will ensure that as the subject’s\
    \ position changes, the camera’s offset will update every second of the game.\
    \ That way the camera will always be the exact same distance away from the character.\n\
    \n```\nvoid LateUpdate () {\n  transform.position = Player.transform.position\
    \ + offset;\n}\n```\n\nIn this code, you determine what the camera is following,\
    \ how it follows the character, and what the offset is.\n\nSave the code and return\
    \ to Unity.\n\nAfter you finish the code, simply drag and drop it onto the `Camera`\
    \ in the scene window. The camera won’t start following the character just yet\
    \ because you still have to determine within Unity the character that the camera\
    \ is following and the angle/distance at which it follows the character.\n\nSelect\
    \ the camera and scroll to the bottom of the `Inspector` where you’ll see `Cam\
    \ (Script)` component. Inside the component, you’ll see `Player` with a target\
    \ next to it. Select the target, and a window listing all the objects in the scene\
    \ will pop up. Scroll until you find `Player` and select it. Save your scene and\
    \ project and press `Play`. Now when you move your character, the camera will\
    \ follow behind the player (see figure).\n\n![image](images/9781119404187-fg0416.png)\n\
    \n[FIGURE 4-16:] The camera following the character at an angle.\n\nAfter you\
    \ finish setting up the camera to follow the player, adjust the angle of the camera\
    \ using the `position` and `rotation` transformations to best follow your character\
    \ while providing the best view of the level.\n\n![image](images/c5.png)\n\nIn\
    \ this chapter, you’ll create obstacles for players to avoid, as well as code\
    \ negative effects that will happen when the player doesn’t avoid these obstacles.\
    \ The obstacles you create here will act as stand-ins for more detailed enemies\
    \ or traps that you’ll add in Chapter 12. You’ll also program a death message\
    \ that will appear when the character dies. You’ll set up a limit to how far the\
    \ character can fall before respawning.\n\n## THINKING ABOUT WHAT A GAME IS\n\n\
    What makes a game a game? A game is only a game when there is some. Even open-ended\
    \ games like Minecraft have a sense of purpose. If a game has no challenge or\
    \ goal, it ceases to be a game and is just an application. As an exercise, think\
    \ of games you play. In multiplayer games, this challenge becomes other players.\
    \ In puzzle games, it’s the puzzle you have to solve. And in choice-based story\
    \ games, the challenge is trying to figure out what options will lead to the outcome.\n\
    \nWhen you create your game, ask yourself what type of obstacle will prevent the\
    \ player from reaching her goal and how the player can overcome this. In the game\
    \ you’re making, the obstacle takes the form of enemy characters and spikes that\
    \ the player can’t hit without losing health and dying.\n\n CREATING AND CODING\
    \ YOUR OBSTACLES\n\nNow that you’ve completed the basic controls and layout for\
    \ your level (see figure), you need to add something that can give players a challenge\
    \ to overcome.\n\n![image](images/9781119404187-fg0501.png)\n\n[FIGURE 5-1:] Your\
    \ level.\n\nYou already have gaps for them to leap over, but that’s different\
    \ from an actual obstacle. Like a Goomba in Super Mario Bros. or a spike trap,\
    \ you should have things in your game that players have to avoid or overcome.\
    \ Enemies are probably the simplest version of this concept, so that’s what you’re\
    \ going to make.\n\nAs has become a pattern in the early levels of the game, you\
    \ should start off with a stand-in that you can add the code to and that you can\
    \ replace later with the more polished game object. You need to make sure that\
    \ the code and placement work properly before you spend time and effort on an\
    \ animation or model. In this case, start by creating a cube and placing it near\
    \ the first platform’s edge (see figure).\n\n![image](images/9781119404187-fg0502.png)\n\
    \n[FIGURE 5-2:] Placing the enemy stand-in.\n"
  raw: 'To create a tag, simply click any object. In the upper left of the Inspector
    window, you’ll see a Tag drop-down menu. Selecting this menu will show some already
    created tags that are in Unity:


    *   Untagged


    *   Respawn


    *   Finish


    *   EditorOnly


    *   MainCamera


    *   Player


    *   GameController


    To create your own tag, scroll to the bottom of the tag list and select Add Tag.
    This will open up a Tags & Layers window. In this window, in the Tags drop-down,
    simply click the + to create a new tag and name it Pickup. This will create a
    Pickup tag.


    After you create this tag, go to the Prefabs folder and select your Pickup prefab.
    Assign it the tag Pickup, and save your scene and project.


    Before you play your scene, in order for the collider to work properly, go to
    the box collider in the Inspector window and open the drop-down. Make sure that
    the box next to Trigger is checked; otherwise, nothing will happen when the character
    collides with the object.


    Press Play to test out your game. Now whenever your character crosses paths with
    any of the pickups it will pick them up and the score will increase.


    ## CODING YOUR CAMERA


    The last thing you need to code for your game in this chapter is your camera.
    Right now, the camera just stays still as your character moves around the screen,
    but what you want the camera to do is follow your character around the level.
    To do this, you have to first create a new code specifically for your camera.
    Create a new C# code in your code folder and name it `Cam`. Then open that code
    up.


    The camera code isn’t as in depth as the character code (see [Figure 4-15](#07_9781119404187-ch04.xhtml_c04-fig-0015)),
    but it still adds some new codes. The first five lines of the code remain the
    same and do not need to be changed. After the `public` class, you want to add
    a `public` and a `private`:


    *   `public GameObject Player;`: This gives the camera code the ability to select
    a particular object and determine its value as Player. It works similar to the
    text code created in the `char` code.


    *   `private Vector3 offset;`: This part of the code allows you to freely move
    around the camera in Unity to create the angle you want it to follow the player
    on. This way, in the code, you don’t have to define what the distance and rotation
    is.


    ![image](images/9781119404187-fg0415.png)


    [FIGURE 4-15:](#07_9781119404187-ch04.xhtml_rc04-fig-0015) The camera code.


    In the `void Start` string, write `offset = transform.position - Player.Transform.position;`.
    This will link the offset of the camera (how far away from its target it is) to
    the Player GameObject you created earlier. The transform position of the camera
    is directly linked to the position of the player from the start:


    `void Start () {`


    `offset = transform.position - Player.Transform.position;`


    `}`


    In `void LateUpdate` (which will replace `void Update`), write `transform.position
    = Player.transform.position + offset;`. This will ensure that as the subject’s
    position changes, the camera’s offset will update every second of the game. That
    way the camera will always be the exact same distance away from the character.


    `void LateUpdate () {`


    `transform.position = Player.transform.position + offset;`


    `}`


    In this code, you determine what the camera is following, how it follows the character,
    and what the offset is.


    Save the code and return to Unity.


    After you finish the code, simply drag and drop it onto the Camera in the scene
    window. The camera won’t start following the character just yet because you still
    have to determine within Unity the character that the camera is following and
    the angle/distance at which it follows the character.


    Select the camera and scroll to the bottom of the Inspector where you’ll see Cam
    (Script) component. Inside the component, you’ll see Player with a target next
    to it. Select the target, and a window listing all the objects in the scene will
    pop up. Scroll until you find Player and select it. Save your scene and project
    and press Play. Now when you move your character, the camera will follow behind
    the player (see [Figure 4-16](#07_9781119404187-ch04.xhtml_c04-fig-0016)).


    ![image](images/9781119404187-fg0416.png)


    [FIGURE 4-16:](#07_9781119404187-ch04.xhtml_rc04-fig-0016) The camera following
    the character at an angle.


    After you finish setting up the camera to follow the player, adjust the angle
    of the camera using the position and rotation transformations to best follow your
    character while providing the best view of the level.


    ![image](images/c5.png)


    In this chapter, you’ll create obstacles for players to avoid, as well as code
    negative effects that will happen when the player *doesn’t* avoid these obstacles.
    The obstacles you create here will act as stand-ins for more detailed enemies
    or traps that you’ll add in [Chapter 12](#15_9781119404187-ch12.xhtml).


    You’ll also program a death message that will appear when the character dies.
    You’ll set up a limit to how far the character can fall before being forced to
    respawn. You’ll learn how to program the character to relocate to a spawn point
    after it dies from falling, as well as how to set up multiple spawn points in
    a level.


    ## THINKING ABOUT WHAT A GAME IS


    What makes a game a game? A game is only a game when there is some sense of *challenge*
    to it. There has to be a goal and an obstacle. Even games as open-ended as Minecraft
    have a sense of purpose and a type of challenge to them. The purpose of Minecraft
    is to build and explore, and the challenge is finding the right materials to use
    and surviving against creatures. Games need challenge to draw interest. If a game
    has no challenge or goal, it ceases to be a game and is just an application.


    As an exercise, think of three games that you play, and write down what the goal
    of each game is and what’s preventing you from achieving that goal. In multiplayer
    games, this challenge becomes other players. In puzzle games, it’s the puzzle
    that you have to solve. And in choice-based story games, the challenge is trying
    to figure out what options will lead to the outcome you want.


    When you create your game, ask yourself what type of obstacle will prevent the
    player from reaching her goal and how the player can overcome this obstacle. In
    the game that you’re making in this book, the obstacle takes the form of enemy
    characters and spikes that the player can’t hit without losing health and dying.


    ## CREATING AND CODING YOUR OBSTACLES


    Now that you’ve completed the basic controls and layout for your level (see [Figure
    5-1](#08_9781119404187-ch05.xhtml_c05-fig-0001)), you need to add something that
    can give players a challenge to overcome.


    ![image](images/9781119404187-fg0501.png)


    [FIGURE 5-1:](#08_9781119404187-ch05.xhtml_rc05-fig-0001) Your level.


    You already have gaps for them to leap over, but that’s different from an actual
    obstacle. Like a Goomba in Super Mario Bros. or a spike trap, you should have
    things in your game that players have to avoid or overcome. Enemies are probably
    the simplest version of this concept, so that’s what you’re going to make.


    As has become a pattern in the early levels of the game, you should start off
    with a stand-in that you can add the code to and that you can replace later with
    the more polished game object. You need to make sure that the code and placement
    work properly before you spend time and effort on an animation or model. In this
    case, start by creating a cube and placing it near the first platform’s edge (see
    [Figure 5-2](#08_9781119404187-ch05.xhtml_c05-fig-0002)).


    ![image](images/9781119404187-fg0502.png)


    [FIGURE 5-2:](#08_9781119404187-ch05.xhtml_rc05-fig-0002) Placing the enemy stand-in.'
