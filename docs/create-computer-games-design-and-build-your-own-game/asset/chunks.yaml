  trans: "\n\n- **相机（Camera）**：渲染设置。渲染设置是你导出动画的方式。将这些想象为设置摄像机拍摄电影的一部分。渲染设置将动画和 3D\
    \ 对象转换为可以观看的图片/电影。在渲染设置中，你可以设置以下（以及更多）：\n\n  - **分辨率（Resolution）**：动画的细节程度。\n\
    \  - **帧数（Frame count）**：动画每秒的帧（图片）数量。游戏平均为每秒 30 帧。\n  - **输出位置（Output location）**：最终动画/图片保存在计算机上的。\n\
    \n- **图片（Pictures）**：渲染层设置。渲染层显示渲染时动画中的哪些层是可见的。你可以像 Photoshop 文件或拼贴一样对动画分层，并随时显示不同的层。\n\
    \n- **灯光、球体和圆柱（Light, Sphere, and Cylinder）**：场景设置。在场景设置中，你可以调整场景本身的设置，包括选择主相机来渲染动画，以及调整场景包含音频，甚至为场景添加重力和刚体设置。\n\
    \n- **世界（World）**：环境/背景设置。这些设置控制场景渲染时的背景颜色，让你控制地平线和场景内的自然光照。\n\n- **立方体（Cube）**：对象设置。这些设置控制对象的变换控制、显示选项和分组设置。在此选项卡中，你可以在场景中移动对象，将其放置在场景中的不同层，并将对象与其他对象分组以便导入和导出。\n\
    \n- **链（Chain）**：约束控制。这些控制允许你将对象链接在一起。与不改变对象的组控制不同，约束控制将直接影响对象在场景中的移动方式。作为其他对象父的对象会在父对象移动时而移动。约束控制在下拉菜单中提供了多种在场景中链接两个对象在一起的方法。\n\
    \n- **扳手（Wrench）**：修改器控制。修改器控制可以改变对象的形状、尺寸甚至平滑度。在修改器控制中，你可以从下拉菜单中选择多个可以更改对象的不同修改器。\n\
    \n- **倒三角形（Upside-down triangle）**：对象数据。对象数据包含对象的纹理空间、顶点组和形状键。这是对对象数据不同变化的细分。例如，此菜单中的形状键可以用来将对象的更改到不同的键位置。\n\
    \n- **球体（Sphere）**：材质设置。材质是对象的颜色和外观。在这里，你可以更改这些视觉设置，为对象提供不同的颜色、透明度甚至反射。\n\n- **国际象棋格（Checkerboard）**：纹理设置。纹理就像是你放置在材质之上的图片或图案。纹理设置让你能够向对象添加图片或凹凸贴图，帮助赋予对象更多的生命力和维度感。\n\
    \n- **星形（Stars）**：粒子效果控制器。提供在动画中添加粒子效果的选项，例如雨或爆炸。这些设置还可以用于创建对象上的其他物体，如头发或草地。\n\
    \n- **弹跳球（Ball Bouncing）**：对象上的物理控制。这控制对象上所有的物理设置。这些可以包括特定对象上的刚体设置，甚至是流体模拟。\n\n\
    ## 导航界面\n\n本节解释了如何在 Blender 中导航 3D 空间。导航设置与你在 Unity 中使用的设置类似，但理解程序之间的差异仍然很重要。为了正确使用\
    \ Blender，你必须熟练地在程序内导航 3D 空间。\n\n### 平移、旋转和缩放\n\n与 Unity 一样，你在 3D 空间中最好的朋友是导航工具。Blender\
    \ 中的平移、旋转和缩放工具与 Unity 中的类似，但这些工具在 Blender 中的工作方式上有些不同：\n\n- **平移（Panning）**：要在屏幕上平移，点击并按住鼠标中键同时按住\
    \ `Shift` 键移动鼠标。\n- **旋转（Rotating）**：要绕场景旋转，按住中键并移动鼠标。\n- **缩放（Zooming）**：要对场景放大或缩小，向内外滚动中键。向自己方向滚动中键会将相机向场景放大。向背自己方向滚动中键会将相机从场景缩小。\n\
    \n### 变换工具\n\n变换工具调整所选对象的位置、旋转和比例。在`Edit Mode（编辑模式）`中，这些工具还可以用于变换对象的顶点、边缘或面。\n\
    \n在场景窗口底部和时间轴上方，你会看到 `Global（全局）`下拉菜单旁边有三个不同的蓝色按钮。这些就是变换工具：\n\n- **全局/局部（Global/Local）**：`Global`\
    \ 下拉菜单显示对象可以沿其调整的不同轴。你只需要知道的两个是全局轴和局部轴。全局轴与世界轴对齐且永远不会改变。局部轴沿对象的轴发生变化。\n- **平移工具（Translation\
    \ tool（参见图 8-7)）**：带有向上箭头的按钮是平移工具。选择此按钮将显示沿轴（全局或局部）的三个箭头，你可以选择沿哪个轴移动对象。\n- 平移工具更改对象的位置。访问此工具另一种方法是在键盘上按下\
    \ `G`（代表 grab，抓取）。这将拾起对象以便你移动它。\n- **旋转工具（Rotation tool（参见图 8-8)）**：曲线是旋转工具。当你点击它时，对象将被三条线包围，用于绕特定轴旋转。\n\
    - 旋转工具更改对象的旋转。你也可以通过按下键盘上的 `R`（代表 rotate，旋转）旋转对象。\n- **缩放工具（Scale tool（参见图 8-9)）**：带有末端正方形线的按钮是缩放工具。点击此按钮将显示沿轴的线，线周围围绕有立方体。\n\
    - 缩放工具更改对象的大小。你也可以通过 `S` 缩放对象。\n\n"
- fmt: '

    You use `Blender` to create the assets for your videogame because you can create
    complex shapes within `Blender`. You can alter the shape of your objects by switching
    to Edit Edit Mode (see [Figure 8-10](#11_9781119404187-ch08.xhtml_c08-fig-0010)).
    You can switch to `Edit Mode` in two ways.


    ![image](images/9781119404187-fg0810.png)


    [FIGURE 8-10:](#11_9781119404187-ch08.xhtml_rc08-fig-0010) Edit Mode.


    The first way to switch to `Edit Mode` is to go down above the Timeline where
    it says `Object Mode` and select from the `Edit Mode` drop-down menu.


    The other way to get to `Edit Mode` is by pressing the `Tab` key on your keyboard.
    This will switch to `Edit Mode` from whatever mode you’re in. If you’re already
    in `Edit Mode`, pressing `Tab` will switch your mode back to the last mode you
    were in before `Edit Mode`.


    There are several other modes that `Blender` has that you won’t be using but should
    know about:


    * `Object Mode`: Allows you to move objects around and animate your character.

    * `Sculpt Mode`: Gives you the ability to sculpt the shape of the object as if
    it were like clay. (It requires many vertices to use.)

    * `Weight Paint`: Helps you rig your characters to a skeletal structure. This
    is useful for creating characters that move and emote.

    * `Texture Paint`: Paints textures onto the object.

    * `Vertex Paint`: Similar to `Texture Paint` but paints the vertices directly.


    ### VERTICES, EDGES, AND FACES


    When you enter `Edit Mode`, you’re changing the mesh (shape) of the object. There
    are three parts that make up a mesh: the vertices, the edges, and the faces. You
    can change the mesh by altering the position, rotation, size, or number of vertices,
    edges, or faces. Next to where you found the transformation tools, you’ll see
    three new orange buttons:


    * `Vertex Select tool`: The small orange dot at the edge of a cube button is the
    `Vertex Select tool`. `Vertices` (shown in [Figure 8-11](#11_9781119404187-ch08.xhtml_c08-fig-0011))
    are the points of any object. They mark the points on the object where an edge
    ends. Vertices are the smallest part of an object.

    * `Edge Select tool`: The orange line on the cube button is the `Edge Select tool`.
    `Edges` (shown in [Figure 8-12](#11_9781119404187-ch08.xhtml_c08-fig-0012)) are
    the lines between two vertices. They mark the lines on the object and are used
    to make up a face.

    * `Face Select tool`: The orange square on the front of the cube button is the
    `Face Select tool`. `Faces` (shown in [Figure 8-13](#11_9781119404187-ch08.xhtml_c08-fig-0013))
    are made up of at least three edges and make up the visual part of an object.
    Whenever you see an object, you’re seeing the faces of the object as they wrap
    around to make the mesh.


    ![image](images/9781119404187-fg0811.png)


    [FIGURE 8-11:](#11_9781119404187-ch08.xhtml_rc08-fig-0011) Vertices.


    ![image](images/9781119404187-fg0812.png)


    [FIGURE 8-12:](#11_9781119404187-ch08.xhtml_rc08-fig-0012) Edges.


    ![image](images/9781119404187-fg0813.png)


    [FIGURE 8-13:](#11_9781119404187-ch08.xhtml_rc08-fig-0013) Faces.


    ### EDITING TOOLS


    There are a ton of different options when it comes to the tools you can use to
    edit your object. On the Tools tab, you have at the least 34 different tools you
    can use to change your object, and that’s not counting the different variations
    some of the tools offer. For now, you only need to really know four of these tools:


    * `Loop-Cut Slide (Ctrl+R)`: The `Loop-Cut Slide` tool (shown in [Figure 8-14](#11_9781119404187-ch08.xhtml_c08-fig-0014))
    creates a new edge that wraps around the object. This creates new edges and vertices
    that can be edited and cuts the faces in two. When you use the `Loop-Cut Slide`
    tool, select one of the edges that you want your line to go around. It will appear
    as a pink line wrapping around the edge. When you have the edge you want, left-click
    it. This will change the line to a yellow line, but it hasn’t been placed yet.
    After you clicked the edge, left-click it.

    * `Extrude (E)`: The `Extrude` tool (shown in [Figure 8-15](#11_9781119404187-ch08.xhtml_rc08-fig-0015))
    expands the object.

    * `Inset (I)`: The `Inset` tool (shown in [Figure 8-16](#11_9781119404187-ch08.xhtml_rc08-fig-0016))
    creates a face within the selected.

    * `Insert Face (F)`: The `Insert Face` tool creates a face between two edges.

