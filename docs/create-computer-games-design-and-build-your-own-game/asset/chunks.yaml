  trans: '


    虽然这已经足够制作粉碎机了，但从机械的角度来说，你实际上想要创建出符合你在游戏中设定的主题。在这种情况下，主题是机器人反乌托邦，因此在粉碎机的顶部添加一个小警灯。


    使用 `Inset Face`（内插面）、`Extrude`（挤出）和 `Loop-Cut`（循环切割）工具开始构建一个放在粉碎机顶部的警灯：


    1. **在粉碎机顶部的小区域内插一个面，该区域曾是下半部分平台的底部。**

    2. **缩放该内插面，使其看起来更像正方形。**

    3. **将该内插线沿 `z` 轴向上移动，使高度呈现阶梯式上升。**

    4. **挤出**并向上移动挤出的部分，在中间留出一些空间作为灯本身。

    5. **再次挤出**，但只向上移动一小段。

    6. **再次挤出**，再向上移动一点，并在顶部稍微缩小尺寸，使其越高越小。

    7. **在顶部再次挤出**，以给它一个平整的顶部。

    8. **使用 `Alt-select` 选择步骤 5 中的那个小挤出部分，并选择它周围的所有区域。**

    9. **挤出**并使用 `x` 轴和 `y` 轴扩展挤出的部分，使其看起来像灯的屋顶（示例参见 图 9-17）。


    ![image](img/9781119404187-fg0917.png)


    FIGURE 9-17: 灯。


    完成顶部的灯后，是时候真正制作粉碎机的底部了，让它看起来更具威慑力。让粉碎机看起来具有威慑力的常见方法之一是添加刺，但这是一个机器人反乌托邦世界，大部分角色都是立方体，所以刺在环境中环境中感觉不协调。对于这种环境，一个带有一些凹槽的平底粉碎机更合适，所以这就是你要制作的。


    为了创建必要的凹槽，你需要能够仅挤出粉碎机底部的某些网格部分，而不是整个底部。为了做到，你需要创建更多的面。保持四边形的最佳工具是 `Loop-Cut Slide`（循环切割滑动）工具。


    你可以多次使用该工具来创建所需的凹槽，但实际上有一种方法可以使用 `Loop-Cut Slide` 工具一次进行多次切割。当工具仍呈粉色时，你可以向前和向后滚动鼠标中间键，创建多条将同时切割的线。这样做，以便在底部垂直和水平方向各切割六条线（参见
    图 9-18）。


    ![image](img/9781119404187-fg0918.png)


    FIGURE 9-18: 循环切割滑动线。


    创建好必要的线后，开始选择网格底部每隔一个面。这样，网格的底部看起来就像像棋盘状的图案（参见 图 9-19）。这将使你能够只挤出你想挤出的面。对于这个项目，你只想挤出这些面，以给粉碎机一些风格感和纹理。


    ![image](img/9781119404187-fg0919.png)


    FIGURE 9-19: 粉碎机底部的棋盘图案。


    选完所有面后，你应该将它们挤出。。和之前一样，你不想把它们挤得太远，因为你想为玩家进入下方留出空间，但你又希望粉碎机的尺寸在游戏中是显眼的。将粉碎机部分挤出的距离比你第一次挤出原始平台时稍微多一点。现在你会发现所有的挤出部分看起来像一组矩形。这是因为你只拉出了选中的面。由于共享顶点，这些面仍然连接在一起，但它们看起来像是略微分离了，这在机械上没有区别，但有助于构建游戏的风格。


    完成粉碎机的模型制作后（参见 图 9-20），你还必须给它赋予材质，与之前的敌人和玩家角色一样。


    ![image](img/9781119404187-fg0920.png)


    FIGURE 9-20: 粉碎机。


    ## 创建移动平台


    显而易见，平台是平台游戏的重要部分。任何平台游戏中最常见的平台之一就是移动平台。移动平台就像普通平台，但它们会移动。在关卡中，你创建了几个计划作为移动平台的区域。移动平台将在负责让平台移动的章节中详细讨论。但现在，你的目标是创建一个可以动画化的平台。幸运的是，移动平台很容易制作。


    首先在 Blender 中打开一个新文件并保存为 `moving platform.blend`。选择网格中间的立方体并打开 3D 视图侧侧窗口。将移动平台的尺寸更改为
    `X=5, Y=5, Z=0.5`。这将创建一个足够角色跳跃且足够良好的平台。这可以作为一个平台，但再次你想对它进行风格化处理。


    遵循以下步骤：


    1. **进入编辑模式。**

    2. **选择顶部和底部。**

    3. **对两个面进行内插，在中间创建一个正方形。**

    4. **挤出内插部分。**

    5. **使用缩放工具将网格中的内插部分靠近。**


    构建好模型后，更改其材质使其看起来具有机械感。你甚至可以让网格的中心部分像玻璃。只需进入编辑模式，选择顶部和底部内插面，将颜色改为蓝色并将透明度设置为 `0.3`
    到 `0.5`，取决于你的喜好。此外，为移动平台的所有材质添加反射。这将为你后续的动画制作创建一个很漂亮的移动平台，就像图 9-22 所示所示。


    ![image](img/9781119404187-fg0922.png)


    FIGURE 9-22: 移动平台。


    ## 创建硬币拾取物


    '
- fmt: "\nThe last thing you should create in this chapter are coins to take the place\
    \ of the pickup items. When they’re completed, the coins will rotate slowly and\
    \ bounce up and down, but for now they’ll just stay still. To start off, create\
    \ a new file and name it `Coins.blend`. Delete the cube in the center, as well\
    \ as the lights and camera. Coins are a good objective to pick up. We already\
    \ associate coins with wealth and something to be desired (symbolically) so a\
    \ coin, shown in [Figure 9-23](#12_9781119404187-ch09.xhtml_c09-fig-0023), is\
    \ a great pickup item.\n\n![image](images/9781119404187-fg0923.png)\n\n[FIGURE\
    \ 9-23:](#12_9781119404187-ch09.xhtml_c09-fig-0023) The coin’s base. Follow these\
    \ steps:\n\n1. Create a `cylinder`.\n2. Rotate that `cylinder` 90 degrees on the\
    \ `y-axis`.\n3. Reshape the coin so it’s thin and small.\n4. Select the front\
    \ and back faces.\n5. Inset those faces.\n6. Extrude and size the faces.\n\nNow,\
    \ to give the coin some personality, you want to add a hole in the middle of the\
    \ coin that indicates its value. In this case, just the one will do. This will\
    \ require the use of `Boolean` modifier. Booleans are ways to combine two different\
    \ objects together, by unifying them, taking the parts where they intersect, or\
    \ subtracting one from the other. Follow these steps:\n\n1. Create a new `cube`.\n\
    2. Size the `cube` so it’s tall and thin and looks like the one.\n3. Expand its\
    \ size so that it will go through the coin (see [Figure 9-24](#12_9781119404187-ch09.xhtml_c09-fig-0024)).\n\
    4. Select the coin.\n5. Go to the `Modifier` tab in the `Properties` window.\n\
    6. From the `Add Modifier` drop-down, select `Boolean`. There a different operations\
    \ for `Boolean` to choose from:\n    - `Intersect`: Only keeps the parts of the\
    \ meshes that touch each other.\n    - `Union`: Combines the two objects.\n  \
    \  - `Difference`: Subtracts one object from the other.\n7. Change the operation\
    \ to `Difference`, as shown in [Figure 9-25](#12_9781119404187-ch09.xhtml_c09-fig-0025).\n\
    8. Change the `Solve` to `Carve`.\n9. Underneath `Object`, click the empty slot\
    \ and select `Cube`.\n10. Press `Apply` and delete the `cube`.\n\n![image](images/9781119404187-fg0924.png)\
    \ [FIGURE 9-24:](#12_9781119404187-ch09.xhtml_c09-fig-0024) The one intersecting.\n\
    \n![image](images/9781119404187-fg0925.png) [FIGURE 9-25:](#12_9781119404187-ch09.xhtml_c09-fig-0025)\
    \ The `Boolean` modifier.\n\nNow the coin will have a hole in it, giving it another\
    \ reason to stand out in the level. After you finish building the coin, it’s time\
    \ to change the coin’s color. As before, create a new `material` for the object\
    \ and change it so it’s both reflective and colorful (see [Figure 9-26](#12_9781119404187-ch09.xhtml_c09-fig-0026)).\n\
    \n![image](images/9781119404187-fg0926.png) [FIGURE 9-26:](#12_9781119404187-ch09.xhtml_c09-fig-0026)\
    \ The hole cut out.\n\nAfter you finish with the base model and color of the coin\
    \ (like the one in [Figure 9-27](#12_9781119404187-ch09.xhtml_c09-fig-0027)),\
    \ see what changes you can make to the coin or any of the other objects created\
    \ so that you can call it your own. In the case of the coin, I rounded out the\
    \ edges and made it slightly transparent to help with the whole robot theme by\
    \ making it seem more like a hologram that the character picks up.\n\n![image](images/9781119404187-fg0927.png)\
    \ [FIGURE 9-27:](#12_9781119404187-ch09.xhtml_c09-fig-0027) The finished coin.\n\
    \n## Customizing Your Own\n\nAfter you finish making and customizing some of the\
    \ objects discussed in this chapter, try to make some more customizations to your\
    \ level by adding signs or different characters or buildings. Asset creation is\
    \ about creating any asset that you may need. This book only goes into the basic\
    \ assets that make up your game, including the main character and a few of the\
    \ enemies and environment hazards. Other ideas for objects you can model are mailboxes,\
    \ trashcans, trees, signposts, and light posts.\n\nThe asset creation is where\
    \ you can really make your game your own! So, think about what you can add to\
    \ bring more life to your game. When you design your own game, come up with a\
    \ list of assets before you begin. That way, when the time comes to build your\
    \ own assets, you’ll have a good idea of what to make and do.\n\n![image](images/c10.png)\n\
    \nIn this chapter, you’ll learn the fundamentals of what goes into animation.\
    \ In [Chapter 9](#12_9781119404187-ch09.xhtml), you created models of characters\
    \ and objects that are within your scene. Now it’s time to breathe life into them.\
    \ You’ll learn some animation terms such as `squash` and `stretch` and `anticipation`.\n\
    \nIn Blender, you’ll learn how to use `keyframes`, how to set up `shape keys`,\
    \ and how to animate.\n\n## Defining Animation\n\nAnimation is the illusion of\
    \ life. It tricks the audience or player into believing something is alive when\
    \ it’s just rapidly moving pictures called `frames`. Animation has been around\
    \ for more than a century. Over time, it has only become more elaborate and beautiful.\
    \ Highly successful films and TV shows have been made using animation. Some live-action\
    \ modern blockbusters use animation as a way to enhance their ability to tell\
    \ their story.\n\nMost important, the videogame industry has thrived thanks to\
    \ the advancements in animation. Without animation, videogames as we know today\
    \ would not be possible. Characters such as Mario and Sonic would never have come\
    \ into being if animation weren’t a key part of the videogame industry.\n\nToday,\
    \ with the use of 3D animation software, games can create vast and wonderful stories\
    \ and capture the imaginations of millions of people. Animation has done a lot\
    \ to help push the field of game development forward. Now one of the best fields\
    \ for an animator to be a part of is game design. The two media — games and animation\
    \ — are linked together and help push one another in new and exciting directions.\n\
    \n## Learning Animation\n\nThe most important thing you can do in animation is\
    \ to study. Even if you’re just creating the animations for a game, there is so\
    \ much to learn and understand about the world around you before you can animate\
    \ it.\n\nHow can you replicate life if you don’t understand how life works? How\
    \ can you bring a game world to life if you’re unwilling to examine what life\
    \ looks like in the real world?\n\nWith the limited processing power back in the\
    \ arcade game days, each sprite had sprites to work with, so the animators had\
    \ to find workarounds. Even today, some of the techniques they used, such as motion\
    \ blur, are used in modern games to help give the punches and kicks more power\
    \ despite not changing how fast the actual character is moving.\n\nSo, how do\
    \ you examine motion and translate that motion into the game? Is it as simple\
    \ as watching a person walking frame by frame and drawing each frame? The truth\
    \ is that an accurate depiction of motion can only get you so far in animation.\
    \ Animation isn’t about recreating motion exactly. It’s about capturing the feeling\
    \ of the motion.\n"
