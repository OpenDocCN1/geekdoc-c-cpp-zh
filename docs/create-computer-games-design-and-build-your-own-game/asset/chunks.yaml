    ![image](images/9781119404187-fg0103.png)


    [FIGURE 1-3:](#04_9781119404187-ch01.xhtml_rc01-fig-0003) Super Meat Boy.


    And these are just a fraction of the types of games that are available to play.
    Like films, there are many different genres, some broad (like action games) or
    specific (like puzzle-based fighting games — look up Super Puzzle Fighter).


    Whether it’s to feel accomplished after beating a challenging level, or to feel
    powerless as you wander through the woods while an unknown monster hunts you,
    you want a game to provoke some sort of emotion in you. Fun comes from a game
    provoking the right emotion at the right time.


    If you think about it, this is the same reason you watch a movie or read a book.
    When you want to laugh, you watch a comedy. When you want to cry, you read a tragedy.
    Understanding that fun comes in many different forms and goes beyond a single
    emotion can open up a variety of game design that you may not have thought about
    before.


    ![image](images/9781119404187-fg0104.png)


    [FIGURE 1-4:](#04_9781119404187-ch01.xhtml_rc01-fig-0004) To the Moon.


