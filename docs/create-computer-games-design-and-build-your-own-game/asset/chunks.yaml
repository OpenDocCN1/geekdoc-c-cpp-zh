    \ the game.\n\nIn order to create a skybox, you would need to create six separate\
    \ images to cover the bottom, top, left, right, front, and back of the scene.\
    \ Adjusting the lighting and coloring of the scene will work just as well to help\
    \ give the environment a nice feeling for the player to be immersed in. Follow\
    \ these steps:\n\n1.  **From the Source drop-down list, choose Gradient.**\n\n\
    \    Here’s a description of the various options, for your reference:\n\n    *\
    \   **Skybox:** Bases the colors off the currently set skybox background. In this\
    \ case, the colors are a light blue that go to a gray color.\n\n    *   **Gradient:**\
    \ Similar to Skybox except you can choose the coloring for the fading in the light.\
    \ You can choose three colors for the gradient to fade among.\n\n    *   **Sky\
    \ Color:** The top color, this color affects the scene from above, as if there\
    \ were a light shining directly down onto the objects.\n\n    *   **Equator Color:**\
    \ The mid color, this color effects the objects as if the light were coming from\
    \ the front and sides of the object.\n\n    *   **Ground Color:** The bottom color\
    \ that affects objects from below.\n\n    *   **Color:** Tints the color of the\
    \ scene all at once with one specific color. This can be useful for quick lighting\
    \ setups.\n\n2.  **Change the sky color to a light blue.**\n\n3.  **Change the\
    \ equator color to purple.**\n\n4.  **Change the ground color to green.**\n\n\
    ![image](images/9781119404187-fg1107.png)\n\n[FIGURE 11-7:](#14_9781119404187-ch11.xhtml_rc11-fig-0007)\
    \ The Gradient source.\n\nThe gradient in [Figure 11-7](#14_9781119404187-ch11.xhtml_c11-fig-0007)\
    \ will change the color setup of the scene to better reflect the more distinctive\
    \ shapes within the scene. The light blue will give the top of the shape a nice\
    \ distinctive bright color to indicate it’s the top. The purple will contrast\
    \ nicely with the light blue, giving the sides of the objects a distinctive difference\
    \ from the top. Finally, the green won’t affect much in the scene, but it will\
    \ imitate the bouncing of the light off of the ground so that the bottom of the\
    \ objects are tinted slightly green.\n\n## UNDERSTANDING LIGHTING\n\nLighting\
    \ is one of the most important parts of game design that is often overlooked.\
    \ Games can be changed by lighting, even subtly. A game that looks like it takes\
    \ place in the middle of the day with vibrant colors can be drastically changed\
    \ with just the angle of the lighting. Right now, the scene looks like [Figure\
    \ 11-8](#14_9781119404187-ch11.xhtml_c11-fig-0008). You’re going to be adjusting\
    \ the direction of the light to help give the scene more vibrancy.\n\n![image](images/9781119404187-fg1108.png)\n\
    \n[FIGURE 11-8:](#14_9781119404187-ch11.xhtml_rc11-fig-0008) The scene colored.\n\
    \nSelect Directional Light from the Hierarchy window. The directional light acts\
    \ as a light source that comes from an indistinct distance away. That means that\
    \ no matter where it is in the scene, the lighting will remain the same because\
    \ the directional light just adjusts the angle that the light is coming in. Try\
    \ rotating the light to better see how the lights change (see [Figure 11-9](#14_9781119404187-ch11.xhtml_c11-fig-0009)).\n\
    \n![image](images/9781119404187-fg1109.png)\n\n[FIGURE 11-9:](#14_9781119404187-ch11.xhtml_rc11-fig-0009)\
    \ Adjusting the angle of the directional light.\n\nThere are four types of lights\
    \ that you can choose from within Unity. To create any of these lights, simply\
    \ choose GameObject ⇒ Light, and you’ll see four different options:\n\n*   **Directional\
    \ lights:** Directional lights light up the scene from a certain angle. They represent\
    \ a sun or other bright object shining from no specific distance away. In this\
    \ game, these will be the lights you’ll use to create a three-point lighting setup.\n\
    \n*   **Point lights:** Point lights light up a certain point in the scene. They’re\
    \ like a small orb of light that lights up a particular spot in the scene.\n\n\
    *   **Spot lights:** Spot lights are the combination of point lights and directional\
    \ lights. They’re a light pointing in a specific direction that comes from a specific\
    \ spot in the scene. They light up an area within a cone of light. These lights\
    \ are particularly good at creating flashlights.\n\n*   **Area lights:** Area\
    \ lights light up an entire area of the scene. They’re much larger than point\
    \ lights and light up the entire area uniformly, as opposed to point lights, which\
    \ fade out near the edges.\n\nDifferent lighting setups can change entire games.\
    \ Imagine horror if games like Slender: The Arrival or Resident Evil took place\
    \ in the daylight. Lighting is part of what builds an environment or feeling in\
    \ a game. Imagine if you were to attach a point light to the player character,\
    \ and the only light source they had was this one light (see [Figure 11-10](#14_9781119404187-ch11.xhtml_c11-fig-0010)).\
    \ The game would be totally different and probably less fun. It would no longer\
    \ be a platformer game but an exploration game, with the player having to navigate\
    \ around the scene with very limited information.\n\n![image](images/9781119404187-fg1110.png)\n\
    \n[FIGURE 11-10:](#14_9781119404187-ch11.xhtml_rc11-fig-0010) The scene lit by\
    \ only a point light.\n\nIn film and animation, there is a technique used by filmmakers\
    \ that help create a complete three-dimensional view of a character and environment.\
    \ Three-point lighting is used to help visually show the character in 3D while\
    \ softening some of the darker shadows on the character and separating them from\
    \ the background. This is done with three lights:\n\n*   **Key light:** The brightest\
    \ light in the scene, the key light’s goal is to highlight the subject of the\
    \ scene to show the audience the character’s face or light up the object of the\
    \ scene. This is the primary light. It’s usually pointed at one side of the character\
    \ or the subject of the scene.\n\n*   **Fill light:** The fill light is pointed\
    \ at the other (front) side of the character to help fill in the dark shadows\
    \ created by the key light. It isn’t as bright as the key light because its job\
    \ is to lessen the shadows instead of drown them out.\n\n*   **Back light:** The\
    \ purpose of the back light is to separate the character from the background.\
    \ Generally speaking, the purpose of this light is to prevent the character from\
    \ being seen as part of the background by creating a small halo around the character\
    \ to help distinguish them from the rest of the game.\n\nIn your game, you’ll\
    \ set up a simple three-point lighting setup to light up your scene properly and\
    \ give some nice shadows to your game and help distinguish its 3D objects:"
