    \ names.\n\n![image](images/9781119404187-fg1205.png)\n\n[FIGURE 12-5:](#15_9781119404187-ch12.xhtml_rc12-fig-0005)\
    \ The player character in the scene.\n\n### SETTING UP THE CHARACTER\n\nBecause\
    \ of the animations you’ve made, when the player character begins, it will automatically\
    \ move to point (0,0,0). The way Unity reads the animations causes the characters\
    \ or objects to reset to where the characters or objects move in relation to the\
    \ center point of Unity. The simplest way to fix this problem is to give the animation\
    \ a new center point for it to be based on. This is done via parenting.\n\n###\
    \ SETTING UP THE ANIMATION\n\nNow you’ll notice that either the animation will\
    \ only play once and not again or it won’t play at all when you click the Play\
    \ button to play the game. This is because you still have yet to set up the animation\
    \ for the character. This will require you to use the Rig and Animation tabs of\
    \ the Inspector window of the prefab.\n\n1.  **Open up the Rig tab in the inspector\
    \ window.**\n\n    There are four animation types to choose from in the drop-down:\n\
    \n    *   **None:** When you aren’t importing an animation.\n\n    *   **Legacy:**\
    \ The older way to import animations. This method doesn’t work properly with an\
    \ animation controller, so it’s not good for using for the player character.\n\
    \n    *   **Generic:** The basic import method that imports the animations while\
    \ keeping the code in a way that Unity can read and alter as necessary.\n\n  \
    \  *   **Humanoid:** Imports humanoid characters that have rigging, attaching\
    \ bones or armatures to the mesh so that different parts can bend.\n\n2.  **For\
    \ this project, choose the Generic type.**\n\n3.  **Change the Avatar Definition\
    \ to Create for This Model.**\n\n4.  **Change the Root Node to None.**\n\n5. \
    \ **Click the Animations tab (see** [**Figure** **12-9**](#15_9781119404187-ch12.xhtml_c12-fig-0009)**).**\n\
    \n6.  **Scroll down to the Clips section.**\n\n    You see a ton of options and\
    \ breakdowns. These are just the different animation parts within the animation\
    \ that Unity can recognize. Sometimes this is accurate but most of the time, I\
    \ find it’s more reliable to just do it yourself.\n\n7.  **Delete all the options\
    \ and breakdowns by selecting them and clicking the minus sign (–) in the right\
    \ corner.**\n\n8.  **Click the plus sign (+) once.**\n\n9.  **For the Source Take\
    \ drop-down menu, choose Eye control|Eye controlAction.**\n\n10.  **For this first\
    \ animation, change the name of the clip to Idle.**\n\n    The blue highlights\
    \ on the Timeline indicate the part of the animation that the clip is using.\n\
    \n11.  **Adjust the Timeline to include only the Idle animation of the character.**\n\
    \n    My animation starts at 0 and ends at 154.\n\n12.  **Follow steps 8 through\
    \ 11 for the walk and jump animations, naming them Walking and Jump, respectively,\
    \ as shown in** [**Figure** **12-10**](#15_9781119404187-ch12.xhtml_c12-fig-0010)**.**\n\
    \n![image](images/9781119404187-fg1209.png)\n\n[FIGURE 12-9:](#15_9781119404187-ch12.xhtml_rc12-fig-0009)\
    \ The first clip you create.\n\n![image](images/9781119404187-fg1210.png)\n\n\
    [FIGURE 12-10:](#15_9781119404187-ch12.xhtml_rc12-fig-0010) The first clip you\
    \ create.\n\nAfter you finish setting up the animations, you have to make sure\
    \ that your character is accessing them properly:\n\n1.  **Select your character\
    \ on the Hierarchy and look into the Inspector.**\n\n    You’ll notice that there\
    \ will be an animation component added to your character. You’ll see an animation\
    \ part with a place to put an animation clip.\n\n2.  **Select the little circle\
    \ next to the none (Animation Clip).**\n\n    The select AnimationClip window\
    \ (shown in [Figure 12-11](#15_9781119404187-ch12.xhtml_c12-fig-0011)) appears.\n\
    \n    The clip that you choose will be the base animation for your character (the\
    \ animation that the character will start the game in).\n\n3.  **Select the Idle\
    \ clip and double-click the Idle clip.**\n\n    This will set your Idle animation\
    \ as the starting animation for your game.\n\n4.  **From the Animations drop-down,\
    \ select Size.**\n\n    You’ll see a number of elements below it matching the\
    \ size.\n\n5.  **For your animation, you only need three elements so change the\
    \ size to 3.**\n\n6.  **Make sure that the elements that you do have are the Idle,\
    \ Walking, and Jump elements.**\n\n    If they aren’t, change them.\n\n![image](images/9781119404187-fg1211.png)\n\
    \n[FIGURE 12-11:](#15_9781119404187-ch12.xhtml_rc12-fig-0011) Select AnimationClip\n\
    \n### CREATING THE ANIMATION CONTROLLER FOR YOUR CHARACTER\n\nThe character now\
    \ has the animation set up to work, but when you click Play nothing happens. This\
    \ is because there is nothing telling the game that the animation should be playing.\
    \ In other words, there is nothing controlling the animation.\n\nTo control the\
    \ animation so that the proper animations play when the character is moving, you\
    \ need an animator controller. An animator controller tells the character how\
    \ the animations interact with one another.\n\nTo create an animator controller,\
    \ like the one shown in [Figure 12-12](#15_9781119404187-ch12.xhtml_c12-fig-0012),\
    \ right-click in the Project window. You can create the animator controller in\
    \ any folder, but for the sake of simplicity I prefer creating the controller\
    \ in either the prefabs folder or directly in the assets folder. Choose Create ⇒ Animator\
    \ Controller. A new animator controller will be created. Rename it to Character_animator.\
    \ Double-clicking this new controller will open a new tab on the Scene window\
    \ called Animator.\n\n![image](images/9781119404187-fg1212.png)\n\n[FIGURE 12-12:](#15_9781119404187-ch12.xhtml_rc12-fig-0012)\
    \ Creating an animator controller.\n\nAfter you open the controller window, you’ll\
    \ realize that it’s empty, except for two boxes: Any State and Entry. To fix this,\
    \ open your Player character prefab and scroll down. At the bottom of the prefab,\
    \ you’ll see three tabs for the three clips you have for the different animations\
    \ for the character. Drag all three of them into the Animator window. Three new\
    \ boxes will appear, one for each of the different clips (see [Figure 12-13](#15_9781119404187-ch12.xhtml_c12-fig-0013)).\n\
    \n![image](images/9781119404187-fg1213.png)\n\n[FIGURE 12-13:](#15_9781119404187-ch12.xhtml_rc12-fig-0013)\
    \ The different clips in the animator."
