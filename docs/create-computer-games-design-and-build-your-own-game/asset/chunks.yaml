    After testing out your game and making sure that the codes work, use the enemy
    prefab created earlier in the chapter and begin placing them throughout your level.
    Although these characters don’t move right now, give them space to move for when
    you animate the enemies later. After adding a few enemies, you should also make
    a new box at the end of the level and give it the red material. For this one,
    though, make the box spread across the entire platform so that the player has
    no choice but to jump over it. This object will act as a placeholder for a large
    trap in the level. Instead of an enemy, this one represents a spike trap or a
    similar environmental hazard the player has to avoid. Create a new tag and name
    it `EnviroHazard03`. (This will be a hazard in the third respawn point section.)


    Make sure that the trap is avoidable. In [Figure 5-8](#08_9781119404187-ch05.xhtml_c05-fig-0008),
    the trap’s height is only `1`. That way, the player has the ability to jump over
    it easily. In the final game, this trap will be a crushing trap that the player
    will have to jump through before it crushes down, but right now the trap should
    act as something the player can easily avoid. When the player runs into it, he’ll
    will be forced to respawn.


    ![image](images/9781119404187-fg0508.png)


    [FIGURE 5-8:](#08_9781119404187-ch05.xhtml_rc05-fig-0008) The environmental trap.


    ## CREATING RESPAWN POINTS


    Why create respawn points? If a player has to start from the beginning of the
    level every time she falls off the edge or loses a life, the game isn’t fun and
    just becomes frustrating. Having to do the same thing over and over again just
    to get back to the point that was challenging can aggravate a player and break
    immersion. Have you ever played a game and gotten to a difficult boss fight that
    has an unskippable cutscene in front of it? It’s aggravating because you have
    to sit through the same cutscene over and over just to get an attempt at the boss
    again. The cutscene in [Figure 5-9](#08_9781119404187-ch05.xhtml_c05-fig-0009)
    is just one example of many games that have done this.


    ![image](images/9781119404187-fg0509.png)


    [FIGURE 5-9:](#08_9781119404187-ch05.xhtml_rc05-fig-0009) Kingdom Hearts HD 1.5
    Remix: Riku/Ansem boss fight cutscene.


    Respawn points act as a reprieve to such frustrations — they lessen the punishment
    for failure by making it so that the player has to go through less of the level.
    Many games, especially ones with long levels, have some sort of respawn point
    within the game so that players don’t have to redo entire levels over and over
    again. These come in the form of automatic respawn points that appear when the
    player gets a certain distance into the level or save points that players can
    use to save their progress into the level or game.


    For the purposes of your game, use the former method of respawn for your levels.
    These respawn points will be where players spawn after they fall off the edge
    of the level or hit an environmental hazard. They’ll remove a coin similar to
    the enemies but will also not work if a player falls off the edge or hits an environmental
    hazard when they’re at zero health because that will result in a game over.


    Now, before creating the actual spawn points, you should give an indication to
    the player as to the location of the spawn points so that he has an idea of where
    he’ll respawn when he falls off an edge or hits a hazard. In [Figure 5-10](#08_9781119404187-ch05.xhtml_c05-fig-0010),
    this is represented by changing the color of a platform where the respawn will
    be placed. I suggest having one or two respawn points within a level, depending
    on how long the level is, with more added in even longer levels. For level 1,
    there are two respawn points.


    ![image](images/9781119404187-fg0510.png)


    [FIGURE 5-10:](#08_9781119404187-ch05.xhtml_rc05-fig-0010) Respawn indication.


    Changing a color or adding some sort of marker to a spot can help indicate to
    the player that there is a respawn point there and guide the player toward it.
    It also serves another purpose in giving the player some smaller objectives throughout
    the game that they can aim to reach for, especially when the actual objective
    may not even be in sight of the player.


    After you determine the location of the two respawn points, it’s time to start
    making the actual points that the character will respawn to. When creating a respawn
    point, you need two things: a trigger and a target.


    *   **Trigger:** In this case, a trigger is what causes the character to need
    to respawn. In games, this could be enemies or a zone outside the game area that,
    when a player crosses, causes the player to respawn.

    *   **Target:** Targets are the actual respawn points that the character will
    spawn at.


    Next you have to set up triggers so that when the character falls off the edge,
    they’ll forced to respawn instead of falling forever. For a trigger, I prefer
    to use a quad from the 3D Object menu. Follow these steps:


    1.  Go to `GameObject`.

    2.  Scroll down to `3D Object`.

    3.  Select `Quad`.

    4.  Rotate the quad 90 degrees on the `x`-axis.

    5.  Place the quad below the bottom of the level.

    6.  Size it so that part of the quad reaches to before the start of the level
    until it touches the area where you determined the first respawn point is.


    The sides of the quad should stick out past the sides of the levels (see [Figure
    5-12](#08_9781119404187-ch05.xhtml_c05-fig-0012)).


    You also want to make sure that the quad is invisible, so after you finish placing
    the mesh so that it matches or is similar to [Figure 5-12](#08_9781119404187-ch05.xhtml_c05-fig-0012),
    create a new material. Making an invisible material requires you to change the
    rendering mode the material uses. In the upper right of the Inspector window,
    when you make a new material, you’ll see the Rendering Mode drop-down menu. When
    you open that menu, you have four options:


    *   Opaque

    *   Fade

    *   Cutout

    *   Transparent

