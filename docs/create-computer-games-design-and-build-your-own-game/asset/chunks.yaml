    \ statement relating to the `W` keycode has been added. The code is similar to\
    \ the first code you made, with one major difference: There is a second `Input`\
    \ indicated in this code.\n\nIf you ever need to have multiple aspects acting\
    \ on a string at once or multiple parts that need to be referenced for a string\
    \ to work properly, you can do so by adding a `&&` to the code in between the\
    \ two parts. In this case, in order to activate the `if` statement, two buttons\
    \ need to be pressed on the keyboard: `W` and `LeftShift`. So you define each\
    \ keycode normally, but in order to link the two together you include them in\
    \ the same parenthesis next to the `if` statement and link them with `&&`. The\
    \ other change to this code is minimal because all it does is simply replace the\
    \ `Speed` float with the `SSpeed`. You’ll notice that the basic forward movement\
    \ also remains unchanged after this string. That’s because you want to keep the\
    \ player’s ability to sprint and to move both possible but separate. Only the\
    \ forward sprint was added to this part of the code, but to add sprinting to every\
    \ direction simply use the same base of the code and apply it to each of the directions.\
    \ Here’s an example:\n\n```cs\n(Input.GetKey(KeyCode.W) && (Input.GetKey(KeyCode.LeftShift))\
    \ {\n    transform.position += Vector3.forward * Time.deltaTime * SSpeed;\n}\n\
    ```\n\nThe final change to the code is at the very bottom of the code and references\
    \ the `bool`s. This code prevents the object from being able to double jump (or\
    \ remain floating when holding the `Spacebar`) by using a raycast. Raycasts cast\
    \ a ray out from a specific part of the object in a direction to measure if there\
    \ are any colliders nearby. If a raycast is set to `10f` in the forward direction,\
    \ then when a collider is measured that is `10` units in front of the object,\
    \ the raycast will pick it up. This can be used to create messages that warn of\
    \ colliders nearby or trigger an interaction between the two objects. Think of\
    \ trainer battles in Pokémon. When you pass a certain distance in front of a trainer\
    \ in Pokémon, a battle begins. This prevents you from needing to adjust the collider\
    \ size of the object and instead note the distance between two objects. In this\
    \ case, the raycast indicates when your object is touching the ground and prevents\
    \ your character from jumping when the character is not within that distance from\
    \ the ground:\n\n```cs\nVector3 gc = transform.TransformDirection (Vector3.down);\n\
    if (Physics.Raycast (transform.position, gc, .5f)) {\n    GroundTouch = true;\n\
    }\n```\n\nFirst, the code indicates the direction the raycast is pointing with\
    \ the `gc`’s direction being transformed to the `Vector3` direction down. This\
    \ tells the raycast that the direction that it should be measuring in is down,\
    \ which will point it toward the ground. Next, in the `if` statement, `physics`\
    \ gives us access to `raycast`. It’s considered a physics code, and from there\
    \ the code defines how far the raycast is stretching. In this code, the raycast\
    \ is stretching, along the `gc`, `.5F` (or half a unit). When that distance is\
    \ measured, the code indicates that the character is touching the ground. Save\
    \ your code and test it in Unity (see [Figure 4-10](#07_9781119404187-ch04.xhtml_c04-fig-0010)).\
    \ See if you can pick up the objects.\n\n![image](images/9781119404187-fg0410.png)\n\
    \n[FIGURE 4-10:](#07_9781119404187-ch04.xhtml_rc04-fig-0010) The character in\
    \ Unity.\n\nSomething you may have noticed that hasn’t yet been addressed is the\
    \ new component in the `Inspector` window when you have your character selected.\
    \ This component is the script you just made, but you’ll also notice that the\
    \ names of the `floats` and `bool`s you made are available to alter here as well.\
    \ Part of making the `floats` `public` gives you the ability to alter these values\
    \ even outside of the code. This is useful because it allows you to adjust your\
    \ character’s speed, jump distance, and sprinting speed during testing. The only\
    \ thing you have to remember when doing so is that any changes you make to these\
    \ numbers while your game is running will not be recorded. You must not be in\
    \ play mode when making these changes.\n\nNow as you play the game, you’ll also\
    \ notice that your character is not picking up the items you made in [Chapter\
    \ 3](#06_9781119404187-ch03.xhtml) for the character to pick up. That’s because\
    \ you haven’t created a code for the character to pick up the items yet. All they’re\
    \ acting as right now are objects.\n\n## CODING PICKUP\n\nCollectables are simple\
    \ ways to indicate your goal. Part of the pickup code is not only to allow your\
    \ character to pick up the objectives but also to have the objective disappear\
    \ when it collides with your character and for the UI to indicate an increase\
    \ to a “score” that will increase by one every time your character passes through\
    \ any. That’s a lot to code. To make it easier, I’ll break this code into two\
    \ halves: the beginning of the code where you define the text and integers that\
    \ will be affected by the code, as well as setting up the beginning of the count,\
    \ and the end of the code where you define how and why those text and integers\
    \ change and how they relate to each other.\n\nIn order to display text on a screen,\
    \ you must first give it control over the user interface (UI). Underneath where\
    \ the code accesses the engine, add `using UnityEngine.UI;` (see [Figure 4-11](#07_9781119404187-ch04.xhtml_c04-fig-0011)).\
    \ This will give the code the ability to alter any UI you add to your game.\n\n\
    At the top of your code (see [Figure 4-12](#07_9781119404187-ch04.xhtml_c04-fig-0012))\
    \ is where you previously added `floats` and `bools`. You’ll be adding two new\
    \ types of codes that will be affecting your game and other parts of your code:\n\
    \n- **Text**: Text codes relate directly to the UI and are determined in the code.\
    \ These can be simple messages that appear during the game or even values that\
    \ change as things happen in the game.\n- **int**: int codes are integers. They’re\
    \ number codes that are determined during the code and increase or decrease in\
    \ value depending on the code that you write. These can be used to define a countdown\
    \ clock or a point system.\n\nYou’ll also notice that while both the texts are\
    \ `public` (which means that their values are broadcasted outside of the code\
