  trans: "\n要创建一个标签，只需点击任何物体。在 `Inspector` 窗口的左上角，你会看到一个 `Tag` 下拉菜单。选择此菜单将显示 Unity\
    \ 中已经创建的一些标签：\n\n* Untagged（未标记）\n* Respawn（重生）\n* Finish（完成）\n* EditorOnly（仅编辑器）\n\
    * MainCamera（主摄像）\n* Player（玩家）\n* GameController（游戏控制器）\n\n要创建你自己的标签，滚动到标签列表底部并选择\
    \ `Add Tag`。这将打开 `Tags & Layers` 窗口。在此窗口中，在 `Tags` 下拉菜单中只需点击 `+` 来创建一个新标签并命名为\
    \ `Pickup`。这将创建一个 `Pickup` 标签。\n\n创建此标签后，进入 `Prefabs` 文件夹并选择你的 `Pickup` 预制。为它分配\
    \ `Pickup` 标签，然后保存场景和项目。\n\n在运行场景之前，为了让碰撞器正常工作，请进入 `Inspector` 窗口中的 `box collider`\
    \ 并打开下拉菜单。确保 `Trigger` 旁的复选框已勾选；否则当角色与物体碰撞时，什么都不会发生。\n\n按下 `Play` 测试你的游戏。现在，每当你的角色与任何拾品相遇时，它就会捡起它们，分数就会增加。\n\
    \n## 为摄像编写代码\n\n在本章中，你需要为游戏编写最后一个代码是摄像机。现在，当角色在屏幕上移动时，摄像保持不动，但你希望摄像机跟随角色遍历关卡。要实现这一点，你必须先为摄像创建一个专门的代码。在代码文件夹中创建一个新的\
    \ `C#` 代码并命名为 `Cam`。然后打开该代码。\n\n摄像机代码没有角色代码那么深入（见图），但它仍然添加了一些新代码。代码的前五行保持，不需要更改。在\
    \ `public` 类之后，你想添加一个 `public` 和一个 `private`：\n\n* `public GameObject Player;`:\
    \ 这赋予了摄像机代码选择特定物体并将其值确定为 `Player`的能力。它的工作原理与 `char` 代码中创建的文本类似。\n* `private Vector3\
    \ offset;`: 这部分代码允许你在 Unity 中自由移动摄像，以创建你希望它跟随玩家的视角。这样，在代码中，你就不需要定义距离和旋转了。\n\n\
    ![image](img/9781119404187-fg0415.png)\n\n[FIGURE 4-15:] 摄像机代码。\n\n在 `void Start`\
    \ 字符串中，编写 `offset = transform.position - Player.Transform.position;`。这将摄像机的偏移量（它距离目标有多远）链接到你之前创建的\
    \ `Player` GameObject。摄像机的变换位置从开始就与玩家的位置直接链接：\n\n```\nvoid Start () {\n  offset\
    \ = transform.position - Player.Transform.position;\n}\n```\n\n在 `void LateUpdate`\
    \ 中（将替换 `void Update`），编写 `transform.position = Player.transform.position + offset;`。这将确保随着主体位置的变化，摄像机的偏移量会在游戏的每秒更新。这样，摄像机与角色的距离始终完全相同。\n\
    \n```\nvoid LateUpdate () {\n  transform.position = Player.transform.position\
    \ + offset;\n}\n```\n\n在这段代码中，你决定了摄像机跟随什么、如何跟随角色以及偏移量是多少。\n\n保存代码并返回 Unity。\n\n\
    完成代码后，只需将其拖到到场景窗口中的 `Camera` 上。摄像机现在还没有开始跟随角色，因为你还需要在 Unity 中确定摄像机跟随的角色以及它跟随角色的角度/距离。\n\
    \n选择摄像机并滚动到 `Inspector` 底部，你会看到 `Cam (Script)` 组件。在组件内部，你会看到 `Player` 旁边有一个目标。选择该目标，会弹出一个列出场景中所有物体的窗口。滚动直到找到\
    \ `Player` 并选择它。保存场景和项目并按下 `Play`。现在，当你移动角色时，摄像机会跟在玩家后面（见图）。\n\n![image](img/9781119404187-fg0416.png)\n\
    \n[FIGURE 4-16:] 摄像机以角度跟随角色。\n\n在完成摄像机跟随玩家的设置后，使用 `position` 和 `rotation` 变换调整摄像机的角度，以便最好地跟随角色，同时提供关卡的最佳视野。\n\
    \n![image](img/c5.png)\n\n在本章中，你将为玩家创建需要避开的障碍，以及玩家没有避开这些障碍时发生的负面影响代码。你在这里创建的障碍将作为你在第\
    \ 12 章中将添加的更详细敌人或陷阱的替代品。你还将编写一个角色死亡时显示的死亡信息。你将设置角色重生之前可以掉落的距离限制。\n\n## 思考什么是游戏\n\
    \n什么让游戏成为游戏？只有当某些存在时，游戏才是一个游戏。即使是像 Minecraft 这样的开放式游戏也有目的。如果一个游戏没有挑战或目标，它就不再是一个游戏，而是一个应用程序。作为一个练习，想想你玩的游戏。在多人游戏中，这种挑战变成了其他玩家。在益智游戏中，挑战是你必须解决的谜题。在基于选择的剧情游戏中，挑战是试图弄清楚哪些选项会导致什么样的结果。\n\
    \n当你创建游戏时，问问自己什么类型的障碍会阻止玩家达到目标，以及玩家如何克服这些障碍。在你正在制作的游戏中，障碍以敌人角色和尖刺的形式出现，玩家在不损失生命值和死亡的情况下是无法击中它们的。\n\
    \n 创建并编写你的障碍物\n\n现在，你已经完成了关卡的基本控制和布局（见图），你需要添加一些可以给玩家提供挑战以克服的东西。\n\n![image](img/9781119404187-fg0501.png)\n\
    \n[FIGURE 5-1:] 你的关卡。\n\n你已经有了让他们跳跃的间隙，但这与真正的障碍不同。就像《超级马里奥兄弟》中的 Goomba 或尖刺陷阱一样，你的游戏中应该有一些玩家必须避开或克服的东西。敌人可能是这个概念最简单的版本，所以这就是你要做的。\n\
    \n正如游戏早期关卡中形成的模式一样，你应该从一个替代品开始，你可以向它添加代码，并在以后将其替换为更精美的游戏物体。在花费精力和制作动画或模型之前，你需要确保代码和放置工作正常。在这种情况下，从创建一个立方体开始，并将其放置在第一个平台的边缘附近（见图）。\n\
    \n![image](img/9781119404187-fg0502.png)\n\n[FIGURE 5-2:] 放置敌人替代品。\n"
- fmt: "\nThe problem with this stand-in is that, like the original pickup stand-ins,\
    \ the enemy character doesn’t stand out from the background. So, before you even\
    \ make a prefab of the enemy, you should change the color of the character so\
    \ it stands out from the background. A color that works well for an enemy character\
    \ is red because of people’s natural association of the color red with anger and\
    \ the word `stop`. Most people see red as a dangerous color, so using it as the\
    \ enemy color — at least for the stand-in — can help indicate that it’s bad and\
    \ should be avoided.\n\nAnother thing you can do to make the enemy seem dangerous\
    \ is to make it larger. This serves two purposes:\n\n*   It creates a larger object\
    \ that the character will have to avoid.\n*   It makes the character stand out\
    \ and seem imposing.\n\nA scale of `(X=2,Y=2,Z=2)` should be enough to create\
    \ a simple stand-in that you can later replace with a moving enemy.\n\nFinally,\
    \ be sure to assign this object a tag that you can later use in the code to indicate\
    \ that it has negative consequence. Create a new tag and name it `enemy`. After\
    \ you assign the tag to the character, make sure that the Trigger box is checked\
    \ off in the box collider and make a prefab for the character. When you’re done,\
    \ you should have something that looks similar to [Figure 5-3](#08_9781119404187-ch05.xhtml_c05-fig-0003).\n\
    \n![image](images/9781119404187-fg0503.png)\n\n[FIGURE 5-3:](#08_9781119404187-ch05.xhtml_rc05-fig-0003)\
    \ The finished enemy stand-in.\n\nSave your project/scene and open your `Char`\
    \ code.\n\nNow you want to add code that gives the character the ability to recognize\
    \ when it runs into an enemy, have its score reduced by 1 every time it touches\
    \ an enemy, bounce back away from the enemy when it hits it, and die when it runs\
    \ into an enemy with a score of 0.\n\nTo start, create a `float` that determines\
    \ how far back the character will go when it runs into an enemy. It should be\
    \ more than any of the other speeds so that when a player accidentally runs into\
    \ an enemy, she doesn’t accidentally do it twice. As in [Figure 5-4](#08_9781119404187-ch05.xhtml_c05-fig-0004),\
    \ name this float `hurt` and give it a value of `30f`.\n\n![image](images/9781119404187-fg0504.png)\n\
    \n[FIGURE 5-4:](#08_9781119404187-ch05.xhtml_rc05-fig-0004) The upper half of\
    \ the code.\n\n```python\npublic float hurt = 30f;\n```\n\nThis value may have\
    \ to be adjusted later when you’re testing the game, but for now it will act as\
    \ a good placeholder value because it’s larger than any of the other values.\n\
    \nNow it’s time to write the code for what happens when your character bumps into\
    \ an enemy character (see [Figure 5-5](#08_9781119404187-ch05.xhtml_c05-fig-0005)).\
    \ This code should be placed in the `void OnTriggerEnter (Collider other)` section\
    \ of the code. Similar to the `pickup` code, the first part of this code tells\
    \ the player that when he crosses an object with the tag `Enemy`, the following\
    \ event will happen.\n\n![image](images/9781119404187-fg0505.png)\n\n[FIGURE 5-5:](#08_9781119404187-ch05.xhtml_rc05-fig-0005)\
    \ The lower half of the code.\n\n```csharp\nif (other.gameObject.CompareTag(\"\
    Enemy\")){\n    transform.position += Vector3.back * Time.deltaTime * hurt;\n\
    \    count = count – 1;\n    SetCountText ();\n    if (count <= -1) {\n      \
    \  Destroy (gameObject);\n        winText.text = \"You lose :(\";\n    }\n}\n\
    ```\n\nThinking back to the movement codes, you don’t need to limit events that\
    \ change the position of the character to just pressing keys on the keyboard.\
    \ In this case, whenever your character touches an enemy, the character’s position\
    \ is transformed backward by `hurt`, which you defined in [Figure 5-4](#08_9781119404187-ch05.xhtml_c05-fig-0004).\
    \ You can test this code by saving and playing your game in Unity. When you run\
    \ into the enemy, your character will now jump back.\n\nBut you want to do more\
    \ than push a character back. The next part of this string determines the consequence\
    \ of running into a character.\n\nIn [Chapter 4](#07_9781119404187-ch04.xhtml),\
    \ you defined that whenever the character picks up one of the pickup items, its\
    \ `score` increases by 1. You’re going to link that score to the player’s `health`.\
    \ Every time the character hits enemy, the character loses 1 point.\n"
