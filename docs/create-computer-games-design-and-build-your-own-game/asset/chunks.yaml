    \ In this tab, you can move the object around the scene, place it in different\
    \ layers in the scene, and group the object with other objects for importing and\
    \ exporting purposes.\n\n*   **Chain:** Constraint controls. These controls allow\
    \ you to link objects together. Unlike the group controls, which do not alter\
    \ the objects, the constraint controls will directly affect how the object moves\
    \ in the scene. Objects that are parented to other objects move when those objects\
    \ are moved. The constraint controls give you a variety of ways to link two objects\
    \ together in a scene within the drop-down.\n\n*   **Wrench:** Modifier controls.\
    \ The modifier controls can alter the shape, size, or even smoothness of the objects.\
    \ In the modifier controls, you can select from the drop-down a number of different\
    \ modifiers that can alter your object.\n\n*   **Upside-down triangle:** Object\
    \ data. The object data of an object contains the texture space, vertex groups,\
    \ and shape keys for an object. This is a breakdown of different changes to the\
    \ data of an object. As an example, the shape keys in this menu can be used to\
    \ alter the shape of the object to different key positions.\n\n*   **Sphere:**\
    \ Material settings. The materials are the colors and look of your object. In\
    \ here, you can change those visual settings to give your object different colors,\
    \ transparencies, and even reflections.\n\n*   **Checkerboard:** The texture settings.\
    \ Textures are like pictures or patterns that you put on top of a material. The\
    \ texture settings give you the ability to add pictures or bump maps to your object\
    \ to help give the object more life and dimension.\n\n*   **Stars:** The particle\
    \ effect controller. Gives you the option of adding particle effects to your animations,\
    \ such as rain or explosions. These settings can also be used to create other\
    \ things such as hair or grass on your object.\n\n*   **Ball Bouncing:** The physics\
    \ control on the object. This controls all the physics settings on the object.\
    \ These can include the rigidbody settings on a specific object or even fluid\
    \ simulations.\n\n## NAVIGATING THE INTERFACE\n\nThis section explains how to\
    \ navigate a 3D space within Blender. The navigation settings are similar to the\
    \ ones you use in Unity, but it’s still important to understand the differences\
    \ between the programs. In order to properly use Blender, you must be comfortable\
    \ navigating a 3D space within the program.\n\n### PANNING, ROTATING, AND ZOOMING\n\
    \nAs with Unity, your best friends in a 3D space are your navigation tools. The\
    \ Panning, Rotating, and Zooming tools in Blender are similar to those in Unity,\
    \ but there some differences in how these tools work in Blender:\n\n*   **Panning:**\
    \ To pan on the screen, click and hold the middle mouse button while also holding\
    \ down the Shift key and moving the mouse.\n\n*   **Rotating:** To rotate around\
    \ the scene, hold down the middle mouse button and move the mouse.\n\n*   **Zooming:**\
    \ To Zoom in and out of the scene, roll the middle mouse button in and out. Rolling\
    \ the middle mouse button toward you zooms the camera toward the scene. Rolling\
    \ the middle mouse button away from you zooms the camera out of the scene.\n\n\
    ### TRANSFORMATION TOOLS\n\nThe transformation tools adjust the position, rotation,\
    \ and scale of the selected object. In Edit Mode, these tools can also be used\
    \ to transform the vertices, edges, or faces of an object.\n\nAt the bottom of\
    \ the Scene window and above the Timeline, you’ll see three different blue buttons\
    \ next to a Global drop-down. These are the transformation tools:\n\n*   **Global/Local:**\
    \ The Global drop-down shows the different axes that the object can be adjusted\
    \ along. The only two you need to know are the global and local axes. The global\
    \ axis aligns with the world’s axis and will never change. The local axis changes\
    \ along the axis of the object.\n\n*   **Translation tool (see** [**Figure** **8-7**](#11_9781119404187-ch08.xhtml_c08-fig-0007)**):**\
    \ The button with the arrow pointing up is the Translation tool. Selecting this\
    \ button will show three arrows along the axis (global or local) that you can\
    \ choose to move the object along.\n\n*   The Translation tool changes the position\
    \ of the object. Another way to access this tool is to press G (for grab) on your\
    \ keyboard. This will pick up the object so that you can move it along the 3D\
    \ space, but if you want to move it along a certain axis, just select the axis\
    \ you want to move it along (X, Y, or Z) and press the corresponding key on the\
    \ keyboard (the X key for the *x*-axis, the Y key for the *y*-axis, and the Z\
    \ key for the *z*-axis). Doing so will lock to the object on that axis.\n\n  \
    \  You can also right-click the box to pick it up and move it to a different position,\
    \ but you must left-click to place the object. If you right-click again, the object\
    \ will reset back to its origin.\n\n*   **Rotation tool (**[**Figure** **8-8**](#11_9781119404187-ch08.xhtml_c08-fig-0008)**):**\
    \ The curved-line button is the Rotation tool. When you click it, your object\
    \ will be surrounded by three different lines for rotating around a particular\
    \ axis. The white circle will rotate along the view’s axis.\n\n    The Rotation\
    \ tool changes the rotation of the object. You can also rotate the object by pressing\
    \ R (for rotate) on your keyboard. This will rotate the object along the view’s\
    \ axis, but by pressing the button on the keyboard that corresponds with the axis,\
    \ you want the object will rotate around those particular axes.\n\n*   **Scale\
    \ tool (see** [**Figure** **8-9**](#11_9781119404187-ch08.xhtml_c08-fig-0009)**):**\
    \ The button marked with a line with a square at the end is the Scale tool. Clicking\
    \ this button will show lines along the axes with cubes around them. Clicking\
    \ and dragging these cubes will scale along that particular axis from the origin\
    \ point of the object.\n\n    The Scale tool changes the size of the object. You\
    \ can also scale the object by pressing S on your keyboard. This will scale the\
    \ box uniformly (all at once), but by pressing the button on the keyboard that\
    \ corresponds with the axis you want, the object will scale along that same axis.\n\
    \n![image](images/9781119404187-fg0807.png)\n\n[FIGURE 8-7:](#11_9781119404187-ch08.xhtml_rc08-fig-0007)\
