  trans: "\n\n*   **2D 对象 (2D objects):** 你通过此菜单只能创建一种类型的 2D 对象：精灵（sprites）。精灵是图像，你可以通过编程让其变化以根据不同的动作显示不同的内容——从角色跑步到角色射击或说话无有不在。\n\
    \n*   **空物体 (Empties):** 空物体是放置在场景中的不可形对象，用于控制或标记场景的某些属性。它们在导出游戏时不会显示，仅作为游戏内部的控制物运行。\n\
    \n*   **灯光 (Lights):** 灯光可以照亮场景，并根据光照设置改变视觉效果。灯光主要用于照亮角色和环境，帮助渲染 3D 角色。\n\n* \
    \  **音频和视频 (Audio and video):** 音频和视频菜单帮助将视频和声音渲染到你的游戏中。这些内容从背景噪音/场景到音乐和对话不等。\n\
    \n*   **UI:** `UI` 代表 `user interface`（用户界面）。它改变了玩家玩游戏时在屏幕上看到的内容。它可以涵盖告知玩家操作方法的文本到图像和血条不等。\n\
    \n*   **粒子系统 (Particle systems):** 粒子系统包含各种可以在屏幕上看到的不同效果，从倾盆而下的水到爆炸的火花。\n\n* \
    \  **相机 (Cameras：** 相机充当玩家观察游戏的眼睛。它们可以是固定的，也可以跟随玩家移动，但它们的主要目的是确定游戏的构图方式。这看起来可能不重要，但游戏的视角可以改变游戏本身的很多东西。例如：一个被构图为俯视视角的第一人称射击游戏，即使控制方式完全相同，游戏体验也会大不相同。\n\
    \n## 创建和使用预制体 (CREATING AND USING PREFABS)\n\n预制体（Prefabs）创建多个具有相同属性和形状对象的简单方法。创建非玩家角色（NPC）或游戏内对象可能非常痛苦，但通过预制体，你可以重复使用资源，而无需复制粘贴并创建多个可以单独编辑的对象。\n\
    \n预制体是存储的游戏对象，它们保留相同的属性，并且可以随时放置到游戏场景中。假设你有一个 `collectible`（你的角色需要拾取的物品）。与其反复创建数百个相同的对象，你可以使用预制体来创建所有对象，并在根据需要调整预制体。预制体易于使用且能节省大量时间。\n\
    \n创建预制体很容易，但首先你想要确保创建一个文件夹来存储你的预制体，以保持整洁。请遵循以下步骤：\n\n1.  **在 Project（项目）窗口中，确保没有选中其他内容。**\n\
    2.  **点击 Create New Folder（创建新文件夹）。**\n    新文件夹将出现在 `Assets` 文件夹中。\n3.  **将新文件夹命名为\
    \ `Prefabs`。**\n4.  **选择你想要转换为预制体的对象——在这种情况下，是那个 4x4x4 的立方体。**\n5.  **将对象从 Hierarchy（层级）窗口拖入到\
    \ Project 窗口中的 `Prefabs` 文件夹中。**\n    将创建一个该对象的预制体，如图 2-7 所示。\n\n![image](img/9781119404187-fg0207.png)\n\
    \n图 2-7： 预制体。\n\n创建预制体后，你可以在 Project 窗口中选择预制体，对场景中的所有预制体进行修改并添加新组件。例如，你可以更改对象的大小、改变颜色或给它添加重力。\n\
    \n尝试向你在 Project 窗口中的预制体添加 `Rigidbody` 组件，看看会发生什么：\n\n1.  **点击 Add Component（添加组件）。**\n\
    2.  **选择 Physics（物理）。**\n3.  **选择 Rigidbody。**\n4.  **点击工具栏上的 Play（播放）。**\n\n\
    立方体从天空中掉落了。这是因为你刚刚为它们添加了重力。我将在第 4 章中更详细介绍 `Rigidbody` 组件，但现在请遵循以下步骤：\n\n1.  **再次点击\
    \ Play 按钮以重置游戏。**\n2.  **选择 3D Object  Plane（3D 对象-平面）。**\n    这将在 `Scene` 窗口创建一个平面。\n\
    3.  **在 Inspector（检查器）窗口中重置平面的原点，就像你之前处理立方体那样（使用 Inspector 窗口右上角的齿轮图标）。**\n4.\
    \  **使用平移工具沿 `y`-轴移动立方体，使其位于盒子下方。**\n\n![image](img/c3.png)\n\n在本章中，你将学习第一个关卡背后的核心概念，以及如何为你的游戏设计一个良好的引导关。除此之外，本章还将教你一些关卡设计的基础知识，你以后可以使用这些知识为你未来的游戏设计自己独特的关卡。\n\
    \n为了创建清晰且有趣的关卡，你必须从最基础的开始考虑它们，而不是从最终完善的形式开始。一个拥有精美图像但机制枯燥的游戏只是一个无聊的游戏，但设计师多年来一直将人们吸引到游戏中，从它们在屏幕上只有几个像素时就开始了。\n\
    \n本章将向你展示如何在设计时搁置主题，以便你从一开始就能创造出最有吸引力的游戏玩法。\n\n## 理解关卡重要性 (UNDERSTANDING THE IMPORTANCE\
    \ OF LEVEL)\n\n在书籍或电影中，开头几页或几分钟至关重要。它们是抓住观众的钩子。在游戏中，第一个关卡就是卖给玩家的东西。\n\n游戏历史上有很多优秀的关卡（开头分钟）——超级马里奥（参考图\
    \ 3-1）、肉肉男孩（参考图 3-2）以及《质量效应 2》（参考图 3-3），仅举此类。这些游戏的第一个关卡都不多余。它们只提供了为了理解游戏的必要信息。即使是《质量效应\
    \ 2》展示了极美的星球背景，也不过分，因为该关卡本意是为了激发敬畏和惊奇感。\n\n![image](img/9781119404187-fg0301.png)\n\
    \n图 3-1： 马里奥的世界 1-1。\n\n![image](img/9781119404187-fg0302.png)\n\n图 3-2： 肉肉男孩的世界\
    \ 1-1。\n\n![image](img/9781119404187-fg0303.png)\n\n图 3-3： 《质量效应 2》开头。\n\n## 设计你的第一个关卡\
    \ (DESIGNING YOUR FIRST LEVEL)\n\n设计你的第一个关卡类似于尝试解决你的第一个代数方程或完成你的第一个上篮：你不会在第一次就做得完美。事实上，第一次尝试设计出一个完美的关卡是不可能的，所以不要有压力！\n\
    \n### 思考机制与主题 (THINKING ABOUT MECHANICS AND THEME)\n\n"
- fmt: 'Before starting your game, make sure you know what core mechanics you want
    in the game. This information will be helpful when you start designing your level.
    Ask yourself what the mechanics of your game are, and understand how those mechanics
    relate to the theme of your game.


    Knowing not only your mechanics but the story they relate to will help you figure
    out the best way to introduce the different controls of the game and in what order.
    Do your mechanics and theme fit with a traditional tutorial? Or does the game
    lend itself to a subtler approach?


    When you start designing Level 1, think about the best way to introduce your player
    to the game. Should you start with a more action-packed scene to put the player
    directly into the world? Or should your game start off with a calmer approach?


    The game you’ll be building in this book is a 3D platformer that takes place in
    a cartoony world. Because of this, you’ll be following the Super Mario Bros. format
    by slowly introducing concepts through the level and gradually increasing the
    difficulty as the level progresses.


    ## DRAWING THE ROUGH DRAFTS


    Before worrying about specific measurements or the scale of your level, you need
    to get an idea of what your level will look like. For this, I suggest you use
    a blank piece of paper or a white board so that you can erase and rework your
    ideas as you get them. Think of this process as being similar to an outline for
    an essay. It allows you to get all your ideas out in an unpolished fashion. Then
    you can refine, add, and cut as you please.


    In the example in [Figure 3-4](#06_9781119404187-ch03.xhtml_c03-fig-0004), you
    can see notes on what are important in the level. I’ve included the enemies, inclines,
    and drops as important parts of the games design. You also see some moving platforms,
    as well as some spikes toward the end of the level. This isn’t a perfect representation
    of what the final level will look like, but it gives a solid idea of what needs
    to be translated into the more in-depth design of the level.


    ![image](images/9781119404187-fg0304.png)


    [FIGURE 3-4:](#06_9781119404187-ch03.xhtml_rc03-fig-0004) Boxo Level 1 draft.


    Use this time to consider how players are introduced to new mechanics or aspects
    of your game. Level 1 shouldn’t just start with steep drops or punishing game
    moments. It should be a learning experience that builds on what happened earlier.
    Later levels can up the difficulty, but without proper early levels teaching the
    player about the mechanics, any later difficulty spikes will feel unearned or
    even harsh to new players.


    You never want your player to feel cheated by your game, so give players time
    to learn the tricks of the game before pushing them into the deep end. If you
    introduce difficulty correctly, the payoff to completing the level will outweigh
    the frustration of failure.


    ## GRAPHING YOUR FIRST LEVEL TO SCALE


    After you build the outline of your level, it’s time to figure out the scale of
    the level. The best way to do this is to use a grid or some graph paper to draw
    out a more finalized design of your level. Figure out a ratio of box-to-unit measurement
    in `Unity` before you begin drawing. But once you figure out that ratio, you should
    draw out a more fully realized level based on your designs from earlier.


    [Figure 3-5](#06_9781119404187-ch03.xhtml_c03-fig-0005) uses a one-to-one scale
    with each box on the grid representing one unit of measurement within `Unity`.
    In [Chapters 9](#12_9781119404187-ch09.xhtml) and [12](#15_9781119404187-ch12.xhtml),
    I cover how `Unity`’s scale relates to other programs such as `Blender`, but for
    now you just need to recognize how objects relate to each other in `Unity`’s scale.
    From a cursory glance at [Figure 3-5](#06_9781119404187-ch03.xhtml_c03-fig-0005),
    you’ll notice that `Boxy` (the player character) is four units large in `Unity`.
    Keep the scale of the character in mind while designing the rest of the level.
    Everything in the level is based on the scale of `Boxy` and is designed around
    the scale of the character.


    ![image](images/9781119404187-fg0305.png)


    [FIGURE 3-5:](#06_9781119404187-ch03.xhtml_rc03-fig-0004) Boxo Level 1.


    Why does scale matter in game design?


    - **It helps you determine the difficulty and understand the necessary movement
    requirements of your characters.** If you determine that a character’s max jump
    distance is five units, you won’t create distances that are impossible for the
    character to overcome.

    - **It helps you keep track of how objects relate to each other.** If a wall and
    spike path are properly scaled, you’re more easily able to build an interesting
    level.


    Using graph paper, you’ll be better able to translate that scale into your game
    and will more effectively be able to build your game. Keeping scale will prevent
    you from building objects or scenery that doesn’t fit with the rest of the game.
    It would be very jarring for your character to climb a wall only to doesn’t match
    how you can jump. Remember: Organization saves lives — and that goes for your
    scale.


    ## CREATING THE GRAY-BOX LEVEL


    A gray-box level is the bare minimum design of your game that you need to make
    the game playable. Think of it as a practice run to make sure your game works.
    Gray-box levels are similar to storyboards in film, which are a way to visually
    express a film before any filming is done. In film, storyboards are used to check
    whether a story is understandable when it’s presented. Although some of the more
    glaring issues can be caught through script readings and editing, storyboards
    gives filmmakers to see that she needs to move a scene or two around or remove
    storylines entirely to make the film better.


    Level design is similar. Although you can see some glaring issues in the early
    level drafts, you can’t catch all of the problems until players have a chance
    to play it. By creating a gray-box level, you’re able to program and fix your
    game before you put too much effort into making the look good. You want to find
    any problems with the game before you spend hours building a detailed environment
    around those. Finding bugs early is key to creating a good game!


    ## CREATING YOUR PREFABS


    The first thing you want to do when you open `Unity` to build your level is to
    create all the prefabs that will be used throughout your game. Keep in mind that
    for the game that you’ll be designing throughout this book, the direction the
    character travels is along the z-axis (left to right).


    Look through your latest design of your level and make note of all the objects
    or characters are used multiple times throughout the level. I cover how to construct
    animated characters or objects in [Chapters 9](#12_9781119404187-ch09.xhtml) and
    [10](#13_9781119404187-ch10.xhtml), but for now, simple stand-ins for these animations
    will do just fine. In [Figure 3-2](#06_9781119404187-ch03.xhtml_c03-fig-0002),
    there are several different prefabs that you can create, including some stairs,
    walls, and a stand-in for the moving platforms that you’ll include later.


    Let’s start with the stairs. To do that, you’ll work with a cube. Follow these
    steps:


    1. **Create a cube, and reset the cube’s position and rotation by clicking the
    gear in the upper right of the Inspector.**

