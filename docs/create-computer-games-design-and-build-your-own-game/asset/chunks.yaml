    \ of the prefabs in the sequence.\n\n![image](images/9781119404187-fg0310.png)\n\
    \n[FIGURE 3-10:](#06_9781119404187-ch03.xhtml_rc03-fig-0010) The planks being\
    \ placed across the gaps.\n\nAt this stage, you want your game to be the bare\
    \ bones of what your eventual game will end up being. Do your best to capture\
    \ the overall feeling you’re aiming to go for in this game, even at this stage.\
    \ Creating the tension of walking across a narrow plank can give the same fear\
    \ of falling as jumping from a moving platform. Always think about how your player\
    \ may react to a situation. You can even make it so that the player actually has\
    \ to jump between two different planks to get to the other side just to add a\
