  trans: '

    在屏幕底部，你会看到 `Timeline`（时间轴）。它用于控制你将制作的动画，让你能够插入关键帧并根据帧数调整你的动画。


    在屏幕的右上角，你会看到 `3D Outliner`（3D 大纲视图）。它显示了场景中所有的对象。在大纲视图的下方，你会看到 `Properties Editor`（属性编辑器）。你可以在这里调整场景或对象的属性，更改材质，甚至为对象添加修改器或约束。


    ## 在 BLENDER 中创建新文件


    要在 Blender 中创建新文件，选择`File  ⇒ New`文件⇒新建）。当弹出窗口时，点击`Reload Start-Up File`重新加载启动文件）。


    每当你创建一个新文件时，场景都会重置为仅包含一个立方体、一个相机和一个灯。这是 Blender 的标准设置。要删除场景中的相机、灯光或立方体等对象，只需选择你想删除的项目并按下键盘上的
    `X` 键。将会弹出的窗口询问你是否确定删除此对象。点击 yes（是）或再次按下 `X`。对象随后将被删除。


    ## 了解 BLENDER 界面


    Blender 是一个非常优秀的动画和建模程序，但像 Unity 一样，第一次打开时可能会令人畏畏。在下面的章节中，我将为你介绍 Blender 界面的不同部分，并解释如何正确使用该程序。了解
    Blender 的布局对于使用该程序帮助构建游戏的角色和物体将是无价的。


    ### 标签页 (TABS)


    在`3D View`（3D 视图）区域的左侧有一个菜单。在菜单的最左侧有多个你可以选择的标签页。标签取决于你所处的模式。


    在第 9 章和第 10 章中，你只需要关注的两个标签页是`Create`创建和`Tools`工具标签。


    ### 工具标签页 (TOOLS TAB)


    `Tools`标签页（参见图 8-3）会更改选中的对象。


    当你处于`Object mode`（物体模式）时，这涉及变换控制、镜像、删除、更改原点以及着色类型。


    当你处于`Edit Mode`（编辑模式）时，`Tools`标签页会打开编辑对象的不同选项，从挤出到删除面部。


    ![image](img/9781119404187-fg0803.png)


    图 8-3： `Tools`标签页。


    ### 创建标签页 (CREATE TAB)


    `Create`标签页（参见图 8-4）允许你在场景中创建不同的对象，从正方形到球体。它还允许你为场景创建路径、相机甚至光源。


    当你在`Object mode`中创建对象时，两个对象是相同的，除非你之后将它们合并或连接在一起。


    除非绝对需要，否则不要在`Edit Mode`中使用`create`创建。


    ![image](img/9781119404187-fg0804.png)


    图 8-4： `Create`标签页。


    ### 关系标签页 (RELATIONS TAB)


    `Relations`标签页显示了你对对象的各种分组选项。它可以设置对象的父子关系、创建对象组或将对象链接在一起。


    ### 动画标签页 (ANIMATION TAB)


    `Animation`标签页让你能够创建和删除动画中的关键帧，并烘烘焙某些运动（创建序列中的所有单独帧，而不是让计算机仅仅推断该运动）。


    ### 物理标签页 (PHYSICS TAB)


    `Physics`标签页允许你调整对象的质量，并像 Unity 那样应用刚体物理效果。


    ### 蜡笔笔标签页 (GREASE PENCIL TAB)


    `Grease Pencil`标签页是一种向场景中添加注释和动画备注的方法，你可以将其用作参考点。蜡笔还可以用于辅助 Unity 内的 2D 动画。


    ### 着色和 UV 标签页 (SHADING AND UV TAB)


    `shading and UV`标签页允许你修改对象渲染的方式（渲染时其线条是硬边缘的还是平滑的），以及如何修复或调整对象上可能反向的面。


    UV 贴图也可通过创建或标记“接缝”来帮助角色或对象制作纹理。


    ### 选项标签页 (OPTION TAB)


    这是网格选项菜单，让你控制`X-mirror`（X 轴镜像）和`Edge Select`（边选择）模式。`X-mirror`工具允许你对称地编辑对象。如果你在对象的一侧进行更改，该更改将沿
    `x` 轴在另一侧发生。`Edge Select`模式让你能够调整边缘的路径，使其具有圆角或倒角。


    ### 大纲视图 (THE OUTLINER)


    在屏幕的右上角，你会看到`Outliner`（大纲视图），它是用于项目的（参见图 8-5）。`Outliner`有三个用途：


    - 点击对象旁边的眼睛可以使其不可见。

    - 选择相机决定了渲染内容。

    - 点击对象左侧的加号将显示所有子对象。


    ![image](img/9781119404187-fg0805.png)


    图 8-5： 同样在`Timeline`上，你还会看到一个控制面板，允许你播放、倒回、快进或暂停动画。你还会看到一个红色按钮，开启*自动关键帧*，每当你在场景中移动或调整对象时，Blender
    都会记录关键帧。如果你沿着 Timeline 移动对象，Blender 将创建另一个关键帧而不是覆盖，从而导致你的对象或角色移动。


    ### 时间轴 (TIMELINE)


    `Timeline`（参见图 8-6）位于屏幕底部，主要用于控制动画。调整 Timeline 将调整时间。


    ![image](img/9781119404187-fg0806.png)


    ### 属性区域 (PROPERTIES SECTION)


    你会注意到`Timeline`底部有数字。这些数字*并不*代表动画中的秒数——它们代表帧。在动画中，帧是每秒钟内飞过的图片，以产生运动的幻觉。不同的媒体有不同的帧率，但你应该了解的三个是：


    - **24 帧/秒 (FPS)：** 标准电影

    - **30 FPS：** 游戏最低标准

    - **60 FPS：** 高定义


    对于你的游戏，你将基于 30 FPS 进行。屏幕底部的数字将指示你处于哪一帧，以及动画的起始和结束帧。


    与`Create`和`Tools`标签页类似，窗口的`Properties`部分对对象有不同的标签。前四个标签页用于与对象不直接相关的属性：


    '
- fmt: "\n- **Camera**: Render settings. Render settings are how you can export an\
    \ animation. Think of these as setting up a camera to shoot a part of a movie.\
    \ The render settings translate the animations and 3D objects into pictures/movies\
    \ that can be watched. In the render settings, you can set the following (and\
    \ more):\n\n  - **Resolution**: How detailed the animation is.\n  - **Frame count**:\
    \ The amount of frames (pictures) per second there are in animation. Thirty frames\
    \ per second is the average for games.\n  - **Output location**: Where the final\
    \ animation/picture will be saved to on the computer.\n\n- **Pictures**: Render\
    \ layer settings. The render layers show what layers in the animation are visible\
    \ when rendered. It is possible to layer your animation like a Photoshop file\
    \ or collage and make different layers visible at any moment.\n\n- **Light, Sphere,\
    \ and Cylinder**: The scene settings. In the scene settings, you can adjust the\
    \ settings of the scene itself, including choosing a main camera to render the\
    \ animation out of and adjusting the scene to include audio or even add gravity\
    \ and rigidbody settings to the scene.\n\n- **World**: The environmental/background\
    \ settings. These settings control the color of the background when the scene\
    \ is rendered, giving you control over the horizon and the natural lighting within\
    \ the scene.\n\n- **Cube**: The object settings. These settings control the transformation\
    \ controls, display options, and group settings of the object. In this tab, you\
    \ can move the object around the scene, place it in different layers in the scene,\
    \ and group the object with other objects for importing and exporting purposes.\n\
    \n- **Chain**: Constraint controls. These controls allow you to link objects together.\
    \ Unlike the group controls, which do not alter the objects, the constraint controls\
    \ will directly affect how the object moves in the scene. Objects that are parented\
    \ to other objects move when those objects are moved. The constraint controls\
    \ give you a variety of ways to link two objects together in a scene within the\
    \ drop-down.\n\n- **Wrench**: Modifier controls. The modifier controls can alter\
    \ the shape, size, or even smoothness of the objects. In the modifier controls,\
    \ you can select from the drop-down a number of different modifiers that can alter\
    \ your object.\n\n- **Upside-down triangle**: Object data. The object data of\
    \ an object contains the texture space, vertex groups, and shape keys for an object.\
    \ This is a breakdown of different changes to the data of an object. As an example,\
    \ the shape keys in this menu can be used to alter the shape of the object to\
    \ different key positions.\n\n- **Sphere**: Material settings. The materials are\
    \ the colors and look of your object. In here, you can change those visual settings\
    \ to give your object different colors, transparencies, and even reflections.\n\
    \n- **Checkerboard**: The texture settings. Textures are like pictures or patterns\
    \ that you put on top of a material. The texture settings give you the ability\
    \ to add pictures or bump maps to your object to help give the object more life\
    \ and dimension.\n\n- **Stars**: The particle effect controller. Gives you the\
    \ option of adding particle effects to your animations, such as rain or explosions.\
    \ These settings can also be used to create other things such as hair or grass\
    \ on your object.\n\n- **Ball Bouncing**: The physics control on the object. This\
    \ controls all the physics settings on the object. These can include the rigidbody\
    \ settings on a specific object or even fluid simulations.\n\n## NAVIGATING THE\
    \ INTERFACE\n\nThis section explains how to navigate a 3D space within Blender.\
    \ The navigation settings are similar to the ones you use in Unity, but it’s still\
    \ important to understand the differences between the programs. In order to properly\
    \ use Blender, you must be comfortable navigating a 3D space within the program.\n\
    \n### PANNING, ROTATING, AND ZOOMING\n\nAs with Unity, your best friends in a\
    \ 3D space are your navigation tools. The Panning, Rotating, and Zooming tools\
    \ in Blender are similar to those in Unity, but there are some differences in\
    \ how these tools work in Blender:\n\n- **Panning**: To pan on the screen, click\
    \ and hold the middle mouse button while also holding down the `Shift` key and\
    \ moving the mouse.\n- **Rotating**: To rotate around the scene, hold down the\
    \ middle mouse button and move the mouse.\n- **Zooming**: To Zoom in and out of\
    \ the scene, roll the middle mouse button in and out. Rolling the middle mouse\
    \ button toward you zooms the camera toward the scene. Rolling the middle mouse\
    \ button away from you zooms the camera out of the scene.\n\n### TRANSFORMATION\
    \ TOOLS\n\nThe transformation tools adjust the position, rotation, and scale of\
    \ the selected object. In `Edit Mode`, these tools can also be used to transform\
    \ the vertices, edges, or faces of an object.\n\nAt the bottom of the Scene window\
    \ and above the Timeline, you’ll see three different blue buttons next to a `Global`\
    \ drop-down. These are the transformation tools:\n\n- **Global/Local**: The `Global`\
    \ drop-down shows the different axes that the object can be adjusted along. The\
    \ only two you need to know are the global and local axes. The global axis aligns\
    \ with the world’s axis and will never change. The local axis changes along the\
    \ axis of the object.\n- **Translation tool (see [Figure 8-7](#11_9781119404187-ch08.xhtml_c08-fig-0007))**:\
    \ The button with the arrow pointing up is the Translation tool. Selecting this\
    \ button will show three arrows along the axis (global or local) that you can\
    \ choose to move the object along.\n- The Translation tool changes the position\
    \ of the object. Another way to access this tool is to press `G` (for grab) on\
    \ your keyboard. This will pick up the object so that you can move it.\n- **Rotation\
    \ tool (see [Figure 8-8](#11_9781119404187-ch08.xhtml_c08-fig-0008))**: The curved-line\
    \ is the Rotation tool. When you click it, your object will be surrounded by three\
    \ lines for rotating around a particular axis.\n- The Rotation tool changes the\
    \ rotation of the object. You can also rotate the object by pressing `R` (for\
    \ rotate) on your keyboard.\n- **Scale tool (see [Figure 8-9](#11_9781119404187-ch08.xhtml_c08-fig-0009))**:\
    \ The button marked with a line with a square at the end is the Scale tool. Clicking\
    \ this button will show lines along the axes with cubes around them.\n- The Scale\
    \ tool changes the size of the object. You can also scale the object by pressing\
    \ `S` on your keyboard.\n"
  raw: "*   **Camera:** Render settings. Render settings are how you can export an\
    \ animation. Think of these as setting up a camera to shoot a part of a movie.\
    \ The render settings translate the animations and 3D objects into pictures/movies\
    \ that can be watched.\n\n    In the render settings, you can set the following\
    \ (and more):\n\n    *   **Resolution:** How detailed the animation is.\n\n  \
    \  *   **Frame count:** The amount of frames (pictures) per second there are in\
