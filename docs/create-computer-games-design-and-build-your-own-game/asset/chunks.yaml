  raw: "2.  **Using the Finder (Mac) or Windows Explorer (PC), drag the enemy.blend\
    \ file into Unity’s prefab folder.**\n\n3.  **Select the prefab, and in the Inspector,\
    \ change the Scale Factor to 0.5.**\n\n4.  **Make sure the following tabs are\
    \ all checked:**\n\n    *   Use File Scale\n\n    *   Read/Write Enables\n\n \
    \   *   Import BlendShapes\n\n    *   Generate Colliders\n\n    *   Weld Vertices\n\
    \n    *   Import Visibility\n\n5.  **From the Material Naming drop-down, select\
    \ Model Name + Model’s Matter.**\n\n6.  **Click the Rig tab.**\n\n7.  **Change\
    \ the Rig to Legacy.**\n\n    You aren’t using a controller for this character.\
    \ I find that Legacy import is actually more stable and easier to use for importing\
    \ the enemy characters and objects.\n\n8.  **Click the Animation tab.**\n\n9.\
    \  **Make sure that the Wrap Mode is set to Loop.**\n\n    In Generic, it’s Loop\
    \ Time; in Legacy, it’s a Wrap Mode.\n\n10.  **Drag and drop two enemy grunts\
    \ into the Scene window.**\n\n11.  **Parent each of the grunts to one of the empties\
    \ created in Step 1.**\n\n12.  **Set the position of the empties to (0,0,0).**\n\
    \n    This will place them in the direct middle of the empty.\n\n    Think back\
    \ to the player controller cube that you created earlier. This is because the\
    \ character will move around the (0,0,0) point. The same rule applies for all\
    \ the animations that you’ll be importing in. The difference is that, because\
    \ you want the collider to be on the enemy character and not the center point,\
    \ you’ll want to use an empty instead of a box.\n\n13.  **Moving the empty that\
    \ the enemy grunt is in, make sure the grunt is just touching the ground (as in**\
    \ [**Figure** **12-19**](#15_9781119404187-ch12.xhtml_c12-fig-0019)**).**\n\n\
    14.  **Select the enemy in the Hierarchy.**\n\n15.  **In the Inspector, make sure\
    \ on the Animation tab that Play Automatically is clicked.**\n\n16.  **Choose\
    \ Add a Component ⇒ Physics ⇒ Box Collider.**\n\n17.  **On the Box Collider tab,\
    \ make sure Is Trigger is clicked.**\n\n    This will make it so that the character\
    \ will be affected by the box collider.\n\n18.  **Change the Tag at the top to\
    \ Enemy.**\n\n19.  **Repeat steps 12 through 18 for the second enemy grunt (see**\
    \ [**Figure** **12-20**](#15_9781119404187-ch12.xhtml_c12-fig-0020)**).**\n\n\
    ![image](images/9781119404187-fg1219.png)\n\n[FIGURE 12-19:](#15_9781119404187-ch12.xhtml_rc12-fig-0019)\
    \ The enemy grunt in position.\n\n![image](images/9781119404187-fg1220.png)\n\n\
    [FIGURE 12-20:](#15_9781119404187-ch12.xhtml_rc12-fig-0020) Both enemies in their\
    \ proper spots.\n\n### IMPORTING THE CRUSHER\n\nThe crusher is slightly more complicated\
    \ than the enemy grunt because it actually requires two colliders to work properly.\
    \ One of those colliders has to kill the player while the player only has to be\
    \ able to jump on the other one.\n\nFirst, import in the Crusher using steps 2\
    \ through 5 from the “[Importing the enemy grunt](#15_9781119404187-ch12.xhtml_c12-sec-0009)”\
    \ section. Delete the stand-in hazard and replace it with the empty and name it\
    \ Crusher (center the empty on the *x*-axis). Follow these steps:\n\n1.  **On\
    \ the Rig tab, change the rig to Legacy.**\n\n2.  **On the Animation tab, change\
    \ the Wrap Mode to Loop.**\n\n3.  **Drag the crusher into the scene and parent\
    \ it to the empty created.**\n\n    You’ll notice that the crusher has something\
    \ parented to it. This is because in Blender the upper section and the lower section\
    \ of the crusher were two different objects. The upper section was parented to\
    \ the bottom section, and that parenting carries over into Unity.\n\n4.  **Set\
    \ the position to (0,0,0).**\n\n5.  **Adjust the empty so that the crusher’s bottom\
    \ is just touching the level.**\n\n6.  **Select the crusher on the Hierarchy,\
    \ and make sure that the animator has Play Automatically checked.**\n\n7.  **Choose\
    \ Add a Component ⇒ Physics ⇒ Box Collider.**\n\n8.  **Do not make this collider\
    \ a trigger, and do not add a tag.**\n\n    This will make the bottom of the crusher\
    \ a platform that the player can go on.\n\n9.  **Open the Crusher parent, and\
    \ select the child inside of it (the top part of the crusher).**\n\n10.  **Choose\
    \ Add a Component ⇒ Physics ⇒ Box Collider.**\n\n11.  **Make the collider a trigger.**\n\
    \n12.  **Change the tag at the top to enviroHazard 3.**\n\nAfter you do so, you’ll\
    \ have a completed crusher like the one shown in [Figure 12-21](#15_9781119404187-ch12.xhtml_c12-fig-0021).\n\
    \n![image](images/9781119404187-fg1221.png)\n\n[FIGURE 12-21:](#15_9781119404187-ch12.xhtml_rc12-fig-0021)\
    \ The crusher.\n\nThis will make it so that the crusher’s top part will act as\
    \ the environmental hazard stand-in did, while the bottom part will act as a platform\
    \ that the players can jump on. If you want to have two separate colliders on\
    \ an object, you can do so by adding a new collider in through adding a component,\
    \ but if you want it so that each collider does something different, the object\
    \ needs to have two separate parts.\n\n### IMPORTING THE COINS\n\nAs before, the\
    \ coins need to imported using steps 2 through 5 from the “[Importing the enemy\
    \ grunt](#15_9781119404187-ch12.xhtml_c12-sec-0009)” section. Unlike before, because\
    \ there are so many pickup items, it’s easier to delete all the pickup items and\
    \ create one empty near the beginning. Name this empty `coin_pickup`. Following\
    \ the steps from earlier, make sure that the rig of the coin is Legacy and that\
    \ its wrap is Loop.\n\nDrag the coin into the scene and parent it to `coin_pickup`.\
    \ Then set its position to (0,0,0) so that the coin is centered on the empty.\
    \ Make sure that its animation component has Play Automatically clicked and that\
    \ it has the pickup tag. Also, add a mesh collider to the coins instead of a box\
    \ collider because the shape is a cylinder and not a box. Make sure that both\
    \ Convex and Is Trigger are checked.\n\nThen drag the `coin_pickup` into the prefabs\
    \ menu so that it’s a prefab. Using the `coin_pickup` prefab, place the coins\
    \ throughout the level in similar spots to the pickup stand-ins from earlier.\n\
    \n![image](images/9781119404187-fg1222.png)\n\n[FIGURE 12-22:](#15_9781119404187-ch12.xhtml_rc12-fig-0022)\
    \ The coins placed.\n\nAt the end of the level where the end goal prefab was,\
    \ place another coin, but change the size of the empty on this one coin to X =\
    \ 3, Y = 3, and Z = 3 so that it’s three times the size of the other coins and\
    \ looks like [Figure 12-23](#15_9781119404187-ch12.xhtml_c12-fig-0023). This coin\
    \ will act as the end goal to the level, and its size will help indicate its importance\
    \ above the other coins. Go into the coin’s Inspector and change the tag from\
    \ pickup to final to make sure that when the player runs into it, they’re given\
    \ the win condition.\n\n![image](images/9781119404187-fg1223.png)\n\n[FIGURE 12-23:](#15_9781119404187-ch12.xhtml_rc12-fig-0023)\
    \ The end coin.\n\n### IMPORTING THE MOVING PLATFORM\n\nThe last thing to add\
    \ into the game is a moving platform (see [Figure 12-24](#15_9781119404187-ch12.xhtml_c12-fig-0024)).\
    \ Following the same steps as earlier, delete all the bridges and replace them\
    \ with empties. Parent a moving platform to each of the empties so that they’re\
    \ floating in spots that used to be covered by the bridges. The only major difference\
    \ in the steps for this part and the other three is that the box collider that\
    \ is added to the moving platform should not have Is Trigger checked. When Is\
    \ Trigger is checked, the character falls through the mesh instead of landing\
    \ on top of it. Also, the moving platform does not need a tag.\n\n![image](images/9781119404187-fg1224.png)\n\
    \n[FIGURE 12-24:](#15_9781119404187-ch12.xhtml_rc12-fig-0024) The moving platform.\n\
    \nWith that, the level is finished and ready to play! Play the game and see what\
    \ has to be adjusted or fixed. You’ve finished your first designed and playable\
    \ level!\n\n![image](images/c13.png)"
