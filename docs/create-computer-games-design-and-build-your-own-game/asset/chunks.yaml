- fmt: "\n[FIGURE 2-2:](#05_9781119404187-ch02.xhtml_rc02-fig-0002) The New Project\
    \ screen.\n\n# UNDERSTANDING HOW UNITY IS LAID OUT\n\nWhen you open Unity, you’re\
    \ greeted with a scary-looking screen (shown in [Figure 2-3](#05_9781119404187-ch02.xhtml_c02-fig-0003)).\
    \ *Do not be scared of Unity.* The best way to get over your natural fear is to\
    \ understand what every part of the screen is and how it relates to the game you’re\
    \ creating.\n\n![image](images/9781119404187-fg0203.png)\n\n[FIGURE 2-3:](#05_9781119404187-ch02.xhtml_rc02-fig-0003)\
    \ This is what you see when you open Unity.\n\nHere’s what you’re looking at in\
    \ [Figure 2-3](#05_9781119404187-ch02.xhtml_c02-fig-0003):\n\n*   **Scene window:**\
    \ The Scene window, one of the two main windows in Unity, is where you place and\
    \ set up your game objects.\n*   **Game window:** The Game window, the other main\
    \ window in Unity, gives you a sense of how your game will look like when you\
    \ finish. It’s a preview that lets you see what adjustments you need to make.\n\
    *   **Project window:** The Project window allows you to manage the assets of\
    \ your project. It organizes files by type. In the upper-right corner of the Project\
    \ window, you can search for specific assets. Later on, the Project window will\
    \ allow you to access your materials, scenes, prefabs, scripts, and other assets.\n\
    *   **Toolbar:** The Toolbar (shown in greater detail in [Figure 2-4](#05_9781119404187-ch02.xhtml_c02-fig-0004))\
    \ is located at the top of the screen. It gives you control over the scene, allowing\
    \ you to transform the objects and move around the entire scene area. On the Toolbar,\
    \ you find the controls for playing and pausing the game and accessing your account\
    \ on the Unity cloud.\n\nHere are the tools you find on the Toolbar:\n\n*   **Pan\
    \ tool:** Grabs onto the screen itself and moves the camera to have a better view\
    \ of the game objects or world.\n*   **Translation tool:** Moves your objects\
    \ along the three axes of 3D (X, Y, and Z).\n*   **Rotation tool:** Rotates objects\
    \ around the three axes.\n*   **Scale tool:** Allows you to adjust the size of\
    \ your object, making it bigger or smaller along the three axes. The square around\
    \ the dot is also a scale tool, but it scales from the corners of the object,\
    \ as opposed to just the center or pivot point.\n*   **Gizmo tool:** Adjusts where\
    \ the *pivot point* (the point that your object rotates or scales from) is on\
    \ the object, as well as what direction of the axes you follow.\n*   **Play button:**\
    \ Starts the game, along with any physics or events that start when the game starts.\
    \ Pressing the Play button again resets the game back to the start.\n*   **Pause\
    \ button:** Pauses the game during play.\n*   **Step button:** Moves the scene\
    \ frame by frame after playing.\n*   **Cloud button:** Allows you to access Unity’s\
    \ cloud-based services (see the nearby sidebar).\n*   **Account drop-down menu:**\
    \ Allows you to access your Unity account online.\n*   **Layer drop-down menu:**\
    \ Allows you to change which layers or objects are visible in the scene.\n*  \
    \ **Layout drop-down menu:** Allows you to change Unity’s overall layout to better\
    \ suit your style.\n*   **Inspector window:** The Inspector window allows you\
    \ to examine and alter the properties of selected objects. These properties change\
    \ from object to object, so the Inspector window’s layout changes the most throughout\
    \ your work, but knowing how to work in this window is vital to creating games.\n\
    *   **Hierarchy:** The Hierarchy lists all the game objects in the scene and how\
    \ they relate to each other. You can use the Scene window to select these objects\
    \ or select them through the Hierarchy. Think of the Hierarchy as a list of all\
    \ the things within your project.\n*   **Console window:** The Console window\
    \ is at the very bottom of Unity’s screen. Its main purpose is to show you messages\
    \ directly from Unity. Typically, what you’ll see here are error messages, often\
    \ having to do directly with the code of the project. The Console window is most\
    \ useful when you’re coding your game because it helps you narrow down what parts\
    \ of your game are not functioning and why.\n\n![image](images/9781119404187-fg0204.png)\n\
    \n[FIGURE 2-4:](#05_9781119404187-ch02.xhtml_rc02-fig-0004) The Toolbar.\n\n#\
    \ NAVIGATING THE SCENE\n\nBeing able to navigate around your scene is important\
    \ when you’re creating your game. You need to be able to move and rotate the scene\
    \ controls in order to control and create your game. There are three main ways\
    \ to do that:\n\n*   **Panning:** Panning moves up–down or left–right in the scene.\
    \ If you’re using a mouse, you pan by holding the middle button. If you’re using\
    \ a trackpad, you pan by holding `Alt` and dragging.\n*   **Rotating:** Rotating\
    \ moves you around the scene as if you’re standing in place. If you’re using a\
    \ mouse, you rotate by holding `Alt` and dragging.\n*   **Zooming:** Zooming moves\
    \ you closer or farther from the scene. If you’re using a mouse, you zoom by rolling\
    \ the wheel. If you’re using a trackpad, you zoom by sliding two fingers up and\
    \ down.\n\n# CREATING A GAME OBJECT\n\nWhen you know how to navigate the scene,\
    \ you’re ready to create objects. There are two ways to create an object in Unity.\
    \ You can either select the `GameObject` menu (near the `File` menu) or, under\
    \ the Hierarchy, select `Cube`.\n\nBefore you start playing, reset the origin\
    \ of the cube to be sure it’s at the center. To reset the origin of an object,\
    \ follow these steps:\n\n1.  Select the object you want to reset.\n2.  Go to the\
    \ `Inspector` window for the object (see [Figure 2-5](#05_9781119404187-ch02.xhtml_c02-fig-0005)).\n\
    3.  From the `Transform`ing of the `Inspector`, select the gear icon at the upper\
    \ right.\n4.  Click `Reset`.\n\nYou know how the Toolbar can transform objects,\
    \ but there is another more precise way to do this in the `Inspector` window.\
    \ The Transformation section of the `Inspector` window moves, scales, and rotates\
    \ objects by specific numbers:\n\n*   **Position** indicates where the box is\
    \ in relation to the center point of the scene’s grid.\n*   **Rotation** indicates\
    \ the angle that the box is in relation to each axis.\n*   **Scale** indicates\
    \ the scale of the box in relation to its original size.\n\nPlay around with these\
    \ controls to get used. Then set the `Scale` of the cube to 4 in the X, Y, and\
    \ Z (the `Position` and `Rotation` should remain 0), as shown in [Figure 2-6](#05_9781119404187-ch02.xhtml_c02-fig-0006).\n\
    \n![image](images/9781119404187-fg0206.png)\n\n[FIGURE 2-6:](#05_9781119404187-ch02.xhtml_rc02-fig-0006)\
    \ Object Reset at 0,0,4.\n\nYou’ve created a cube object, but there are other\
    \ objects you can create in Unity. Here’s a brief overview:\n\n*   **3D objects:**\
    \ These are the normal game objects within 3D games. The 3D objects include the\
    \ following:\n\n    *   Cube\n    *   Sphere\n    *   Capsule\n    *   Cylinder\n\
    \    *   Plane (flat surface)\n    *   Quad (a single face with four sides)\n\
    \    *   Rag-doll (a character)\n    *   Terrain\n    *   Tree\n    *   Wind Zone\n\
    \    *   3D Text\n"
  raw: "[FIGURE 2-2:](#05_9781119404187-ch02.xhtml_rc02-fig-0002) The New Project\
    \ screen.\n\n## UNDERSTANDING HOW UNITY IS LAID OUT\n\nWhen you open Unity, you’re\
    \ greeted with a scary-looking screen (shown in [Figure 2-3](#05_9781119404187-ch02.xhtml_c02-fig-0003)).\
    \ *Do not be scared of Unity.* The best way to get over your natural fear is to\
    \ understand what every part of the screen is and how it relates to the game you’re\
    \ creating.\n\n![image](images/9781119404187-fg0203.png)\n\n[FIGURE 2-3:](#05_9781119404187-ch02.xhtml_rc02-fig-0003)\
    \ This is what you see when you open Unity.\n\nHere’s what you’re looking at in\
    \ [Figure 2-3](#05_9781119404187-ch02.xhtml_c02-fig-0003):\n\n*   **Scene window:**\
    \ The Scene window, one of the two main windows in Unity, is where you place and\
    \ set up your game objects.\n\n*   **Game window:** The Game window, the other\
    \ main window in Unity, gives you a sense of how your game will look like when\
    \ you finish. It’s a preview that lets you see what adjustments you need to make.\n\
    \n*   **Project window:** The Project window allows you to manage the assets of\
    \ your project. It organizes files by type. In the upper-right corner of the Project\
    \ window, you can search for specific assets. Later on, the Project window will\
    \ allow you to access your materials, scenes, prefabs, scripts, and other assets.\n\
    \n*   **Toolbar:** The Toolbar (shown in greater detail in [Figure 2-4](#05_9781119404187-ch02.xhtml_c02-fig-0004))\
    \ is located at the top of the screen. It gives you control over the scene, allowing\
    \ you to transform the objects and move around the entire scene area. On the Toolbar,\
    \ you find the controls for playing and pausing the game and accessing your account\
    \ on the Unity cloud.\n\n    Here are the tools you find on the Toolbar:\n\n \
    \   *   **Pan tool:** Grabs onto the screen itself and moves the camera to have\
    \ a better view of the game objects or world.\n\n    *   **Translation tool:**\
    \ Moves your objects along the three axes of 3D (X, Y, and Z).\n\n    *   **Rotation\
    \ tool:** Rotates objects around the three axes.\n\n    *   **Scale tool:** Allows\
    \ you to adjust the size of your object, making it bigger or smaller along the\
    \ three axes. The square around the dot is also a scale tool, but it scales from\
    \ the corners of the object, as opposed to just the center or pivot point.\n\n\
    \    *   **Gizmo tool:** Adjusts where the *pivot point* (the point that your\
    \ object rotates or scales from) is on the object, as well as what direction of\
    \ the axes you follow.\n\n    *   **Play button:** Starts the game, along with\
    \ any physics or events that start when the game starts. Pressing the Play button\
    \ again resets the game back to the start.\n\n    *   **Pause button:** Pauses\
    \ the game during play.\n\n    *   **Step button:** Moves the scene frame by frame\
    \ after playing.\n\n    *   **Cloud button:** Allows you to access Unity’s cloud-based\
    \ services (see the nearby sidebar).\n\n    *   **Account drop-down menu:** Allows\
    \ you to access your Unity account online.\n\n    *   **Layer drop-down menu:**\
    \ Allows you to change which layers or objects are visible in the scene.\n\n \
    \   *   **Layout drop-down menu:** Allows you to change Unity’s overall layout\
    \ to better suit your style.\n\n*   **Inspector window:** The Inspector window\
    \ allows you to examine and alter the properties of selected objects. These properties\
    \ change from object to object, so the Inspector window’s layout changes the most\
    \ throughout your work, but knowing how to work in this window is vital to creating\
    \ games.\n\n*   **Hierarchy:** The Hierarchy lists all the game objects in the\
    \ scene and how they relate to each other. You can use the Scene window to select\
    \ these objects or select them through the Hierarchy. Think of the Hierarchy as\
    \ a list of all the things within your project.\n\n*   **Console window:** The\
    \ Console window is at the very bottom of Unity’s screen. Its main purpose is\
    \ to show you messages directly from Unity. Typically, what you’ll see here are\
    \ error messages, often having to do directly with the code of the project. The\
    \ Console window is most useful when you’re coding your game because it helps\
    \ you narrow down what parts of your game are not functioning and why.\n\n![image](images/9781119404187-fg0204.png)\n\
    \n[FIGURE 2-4:](#05_9781119404187-ch02.xhtml_rc02-fig-0004) The Toolbar.\n\n##\
    \ NAVIGATING THE SCENE\n\nBeing able to navigate around your scene is important\
    \ when you’re creating your game. You need to be able to move and rotate the scene\
    \ controls in order to control and create your game. There are three main ways\
    \ to do that:\n\n*   **Panning:** Panning moves up–down or left–right in the scene.\
    \ If you’re using a mouse, you pan by clicking and holding the middle mouse button\
    \ (the wheel in the middle of the mouse). If you’re using a trackpad on a Mac,\
    \ you pan by clicking and dragging while holding the Alt and Command keys.\n\n\
    *   **Rotating:** Rotating moves you around the scene as if you’re standing in\
    \ one place and turning around to see everything around you. You rotate by holding\
    \ down the Alt key and clicking and dragging on the scene.\n\n*   **Zooming:**\
    \ Zooming moves you closer or farther away from the scene. If you’re using a mouse,\
    \ you zoom by rolling the middle mouse button. If you’re using a trackpad on a\
    \ Mac, you can zoom by using two fingers and sliding them up and down on your\
    \ trackpad.\n\n## CREATING A GAME OBJECT\n\nWhen you know how to navigate around\
    \ the scene, you’re ready to create and manipulate game objects.\n\nThere are\
    \ two ways to create an object in Unity. You can either select the GameObject\
    \ menu (near the File and Edit menus) or, under the Hierarchy tab, select the\
    \ Create drop-down menu. Whichever method you use, choose 3D Object ⇒ Cube. That’s\
    \ it! You’ve created a 3D game object!\n\nBefore you start playing around with\
    \ the cube, reset the origin of the cube to be sure it’s at the center of the\
    \ screen. To reset the origin of an object, follow these steps:\n\n1.  **Select\
    \ the object whose origin you want to reset.**\n\n2.  **Go to the Inspector window\
    \ for the object (see** [**Figure** 2-5](#05_9781119404187-ch02.xhtml_c02-fig-0005)**).**\n\
    \n3.  **From the Transform menu of the Inspector window, select the gear icon\
    \ at the upper right.**\n\n4.  **Click Reset.**\n\n    The rotation and position\
    \ are both reset to 0 and the scale is set to 1, centering and resetting the size\
    \ of the object. This will help you better place and move around your objects\
    \ in the scene. It also guarantees that all your objects remain at the same axis\
    \ of rotation and exist in the same scale.\n\n![image](images/9781119404187-fg0205.png)\n\
    \n[FIGURE 2-5:](#05_9781119404187-ch02.xhtml_rc02-fig-0005) The Inspector window.\n\
    \nYou know how the Toolbar can transform your objects, but there is another more\
    \ precise way to do this in the Inspector window. The Transformation section of\
    \ the Inspector window moves, scales, and rotates objects by specific numbers\
    \ along the set axes:\n\n*   **Position** indicates where the box is in relation\
    \ to the center point of the scene’s grid.\n\n*   **Rotation** indicates the angle\
    \ that the box is in relation to each axis.\n\n*   **Scale** indicates the scale\
    \ of the box in relation to its original size.\n\nPlay around with these controls\
    \ to get used them. Then set the Scale of the cube to 4 in the X, Y, and Z (the\
    \ Position and Rotation should remain 0), as shown in [Figure 2-6](#05_9781119404187-ch02.xhtml_c02-fig-0006).\n\
    \n![image](images/9781119404187-fg0206.png)\n\n[FIGURE 2-6:](#05_9781119404187-ch02.xhtml_rc02-fig-0006)\
    \ Object Reset at 0,0,4.\n\nYou’ve created a cube object, but there are other\
    \ objects you can create in Unity. Here’s a brief overview:\n\n*   **3D objects:**\
    \ These are the normal game objects within 3D games. The 3D objects include the\
    \ following:\n\n    *   Cube\n\n    *   Sphere\n\n    *   Capsule\n\n    *   Cylinder\n\
    \n    *   Plane (flat surface)\n\n    *   Quad (a single face with four sides)\n\
    \n    *   Rag-doll (a character)\n\n    *   Terrain\n\n    *   Tree\n\n    * \
    \  Wind Zone\n\n    *   3D Text"
