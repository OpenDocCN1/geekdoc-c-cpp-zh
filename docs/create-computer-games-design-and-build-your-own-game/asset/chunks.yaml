- fmt: '

    Because you’ve already coded the character walking in the game and moving forward
    and backward, you don’t have to animate that movement. The character will already
    move forward, left, right, and backward. If you were to animate that sort of movement
    in the game, the character could move in the wrong direction or extremely fast.
    Whenever you make a character whose movement you control, you should have the
    character remain still while still looking like it’s moving.


    ### JUMPING


    Jumping is the final animation you’ll need to do for this character, but it’s
    also the hardest and probably the one that you’ll have to adjust at later points
    to better fit the jumping in your game. When a character jumps, you have to show
    both the anticipation of the jump and the jump itself, all while not moving the
    character too much because of how the character interacts with the game. Animating
    the character to jump higher will cause the character in the game to jump even
    higher than what you want him to be able to jump. To fix this problem, you’ll
    also have to make another new shape key (see [Figure 10-13](#13_9781119404187-ch10.xhtml_c10-fig-0013)).


    ![image](images/9781119404187-fg1013.png)


    [FIGURE 10-13:](#13_9781119404187-ch10.xhtml_rc10-fig-0013) The jump shape key.


    Up until this point, you’ve mainly been working with squash animation. Now it’s
    time for you to work with stretch animation. To give the appearance of jumping
    fast, the character’s body should elongate as if part of the body is being left
    behind. In practice, this should help sell the idea that the character is jumping
    high and fast because, as the shape key returns to normal, the box will be hitting
    its full height, making it seem like the box jumped up fast to reach its height.
    This gives the illusion of mass and life to the character and the world, further
    immersing the player in the world you’ve created.


    Follow these steps to make a jump animation for the character:


    1. **Starting on frame 230, place your first keyframe down.**

    2. **To not make the anticipation too long of a wait, make sure that the crouch
    down (using the walk shape key for the crouch) takes only about five frames to
    get to and only an extra two to hold.**

    3. **On frame 240, switch out the squash from the walking shape key and instead
    use the jump shape key.**

    4. **Have Boxo return to his normal shape on frame 245.**


    The last thing you need to adjust is the eyes. Up until this point, the eyes have
    just been moved or rotated, but now it’s time to apply the squash-and-stretch
    animation to the player’s eyes as well. The eyes should stretch in a similar fashion
    to the box (see [Figure 10-14](#13_9781119404187-ch10.xhtml_c10-fig-0014)). That
    way, people know the body and eyes are intact. Using the eye control, change the
    shape and position of the eye to match the pose in the animation (see [Figure
    10-15](#13_9781119404187-ch10.xhtml_c10-fig-0015)).


    ![image](images/9781119404187-fg1014.png)

    [FIGURE 10-14:](#13_9781119404187-ch10.xhtml_rc10-fig-0014) Boxo jumping.


    ![image](images/9781119404187-fg1015.png)

    [FIGURE 10-15:](#13_9781119404187-ch10.xhtml_rc10-fig-0015) The jumping with eyes.


    When Boxo returns to its normal shape, the eyes should also return to their normal
    shape and size. Match the eyes to the keyframes then save your finished character
    so that you can import them into [Chapter 12](#15_9781119404187-ch12.xhtml).


    ### ANIMATING THE ENEMY GRUNT


    These are the Goombas and Koopa Troop in your platformer. Arguably the second
    most important characters in the game, the enemy characters are just as important
    to think about when animating as the player characters. In the case of this game,
    the enemies are all robots (like the one in [Figure 10-16](#13_9781119404187-ch10.xhtml_c10-fig-0016)),
    so when you’re thinking about their movements, you have to keep that in mind.


    ![image](images/9781119404187-fg1016.png)

    [FIGURE 10-16:](#13_9781119404187-ch10.xhtml_rc10-fig-0016) The enemy character.


    The player character is more organic in this game, so its movements are more fluid
    and rubbery to give that extra sense of life. Creating a distinction between the
    player and the enemies can go beyond just aesthetic differences in color or shape.
    You can even use the animation to highlight the differences between the player
    and the enemy. The player character is fluid, so the enemy should be stiff; the
    player moves more sporadically, so the enemy should have a consistent movement;
    and so on.


    You need the enemy character to walk back and forth across the stage in a circle.
    Where the enemy placeholder is currently located, you’ll place the enemy character
    so that it can move back and forth in that spot. The goal of the enemy character
    is to present a challenge that the player must overcome or avoid. In 2D platformers,
    the character will move toward and away from the player in a pattern. Because
    there were only two directions that the player can move in, this posed a challenge
    that the players would have to solve. In 3D platformer, the character moving only
    forward and backward doesn’t pose as much of a threat to the player because the
    player could easily move to the side and avoid the enemy. To present an adequate
    challenge to the player, you must use the animation of the enemy to block a path
    the player must get by. In this case, the character will be moving along the `x`-axis.


    You know that the total size of the platforms is 30. As you’re placing the character
    at the center of the platform, that means from the center point of the animation,
    the character travels 15 units on either side of the center point, which is 0.
    That means the two `X` positions that the character will be traveling between
    are 15 and -15.


    Follow these steps to create a moving enemy grunt:


    1. **Set the `X` Location to -15.**

    2. **At frame 0, set the keyframes of the location, rotation, and scale tools.**
    See [Figure 10-17](#13_9781119404187-ch10.xhtml_c10-fig-0017) for the starting
    position example.

    3. **Determine how fast you want the character to move across the stage.** For
    example, if you want your character to move across the stage in 3 seconds, that
    would be 90 frames. How fast the character is moving across the stage affects
    the difficulty because players will have to avoid hitting it.

    4. **Go to the frame you determined in Step 3 and set the `X` position to 15.**

    5. **Insert a keyframe.** Now of having the character just turn around and go
    the other way to create a loop, you’re going to take advantage of the 3D environment
    by having the character move in a square rather than in a straight line.

    6. **Go up by ten frames.**

    7. **Change the rotation on the `Z` to 90 degrees.**

    8. **Insert a keyframe for the rotation only.**

    9. **Insert another keyframe five frames earlier for the position.** See [Figure
    10-18](#13_9781119404187-ch10.xhtml_c10-fig-0018) as an example.

    10. **Under the assumption that the frame in Step 4 was 90, go to frame 115. (Otherwise
    just add 25 to whatever frame you used in Step 4.)**

    11. **Change the `Y` position to 5.** See [Figure 10-19](#13_9781119404187-ch10.xhtml_c10-fig-0019)
    as an example.

    12. **Insert a keyframe.**


    ![image](images/9781119404187-fg1017.png)

    [FIGURE 10-17:](#13_9781119404187-ch10.xhtml_rc10-fig-0017) The enemy grunt in
    his starting position.


    ![image](images/9781119404187-fg1018.png)

    [FIGURE 10-18:](#13_9781119404187-ch10.xhtml_rc10-fig-0018) The grunt character
    rotating in position 2.


    ![image](images/9781119404187-fg1019.png)

    [FIGURE 10-19:](#13_9781119404187-ch10.xhtml_rc10-fig-0019) The enemy grunt in
    position 3.

