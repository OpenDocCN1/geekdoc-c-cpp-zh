    [Figure 3-5](#06_9781119404187-ch03.xhtml_c03-fig-0005) uses a one-to-one scale
    with each box on the grid representing one unit of measurement within Unity. In
    [Chapters 9](#12_9781119404187-ch09.xhtml) and [12](#15_9781119404187-ch12.xhtml),
    I cover how Unity’s scale relates to other programs such as Blender, but for now
    you just need to recognize how objects relate to each other in Unity’s scale.
    From a cursory glance at [Figure 3-5](#06_9781119404187-ch03.xhtml_c03-fig-0005),
    you’ll notice that Boxy (the player character) is four units large in Unity. Keep
    the scale of the character in mind while designing the rest of the level. Everything
    in the level is based on the scale of Boxy and is designed around the scale of
    the character.


    ![image](images/9781119404187-fg0305.png)


    [FIGURE 3-5:](#06_9781119404187-ch03.xhtml_rc03-fig-0005) Boxo Level 1.


    Why does scale matter in game design?


    *   **It helps you determine the difficulty and understand the necessary movement
    requirements of your characters.** If you determine that a character’s max jump
    distance is five units, you won’t create distances that are impossible for the
    character to overcome.


    *   **It helps you keep track of how objects relate to each other.** If a wall
    and spike path are properly scaled, you’re more easily able to build an interesting
    level.


    Using graph paper, you’ll be better able to translate that scale into your game
    and will more effectively be able to build your game. Keeping scale will prevent
    you from building objects or scenery that doesn’t fit to scale with the rest of
    the environment. It would be very jarring for your character to climb a staircase
    only to come to a wall that is impossible to get past because the scale is off
    and doesn’t match how high your character can jump. ***Remember:*** Organization
    saves lives — and that goes for your scale as well.


    ## CREATING THE GRAY-BOX LEVEL


    A *gray-box level* is the bare minimum design of your game that you need to make
    the game playable. Think of it as a practice run to make sure that your game works
    on a mechanical level without theme getting in the way.


    Gray-box levels are similar to storyboards in film, which are a way to visually
    express a film before any filming is actually done. In film, storyboards are used
    to check whether a story is understandable when it’s presented. Although some
    of the more glaring issues can be caught through script readings and editing,
    storyboards gives filmmakers a chance to see which parts of the film work and
    which parts don’t work when they’re presented as a whole, sequentially. Sometimes
    storyboards might help the filmmaker to see that she needs to move a scene or
    two around or remove scenes or storylines entirely to make the film flow better.


    Level design is similar. Although you can see some glaring issues in the early
    level drafts and drawings, you can’t catch all of the problems until players have
    a chance to play it for themselves. By creating a gray-box level, you’re able
    to program and fix your game before you put too much effort into making the game
    look good.


    You want to find any problems with the game before you spend hours building a
    detailed environment around those bugs. Finding bugs early is key to creating
    a good game! Think of your gray-box level as your test run. You’re making sure
    the mechanics of the game work and are fun before you spend hours on a project
    only to discover that the game is broken on a fundamental level. The earlier you
    discover the failings of your game, the less heartbreaking it will be for you.


    ### CREATING YOUR PREFABS


    The first thing you want to do when you open Unity to build your level is to create
    all the prefabs that will be used throughout your game. Keep in mind that for
    the game that you’ll be designing throughout this book, the direction the character
    travels is along the *z*-axis (left to right).


    Look through your latest design of your level and make note of all the objects
    or characters that are used multiple times throughout the level. I cover how to
    construct animated characters or objects in [Chapters 9](#12_9781119404187-ch09.xhtml)
    and [10](#13_9781119404187-ch10.xhtml), but for now, simple stand-ins for these
    animations will do just fine. In [Figure 3-2](#06_9781119404187-ch03.xhtml_c03-fig-0002),
    there are several different prefabs that you can create, including some stairs,
    walls, and a stand-in for the moving platforms that you’ll include later.


    Let’s start with the stairs. To do that, you’ll work with a cube. Follow these
    steps:


    1.  **Create a cube, and reset the cube’s position and rotation by clicking the
    gear in the upper right of the Inspector.**'
