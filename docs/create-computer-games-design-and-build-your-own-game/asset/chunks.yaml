- fmt: '

    At the bottom of the screen, you’ll see the `Timeline`. This controls the animations
    that you’ll be making, giving you the ability to insert keyframes and adjust your
    animation along the frame count.


    In the upper-right corner of the screen, you’ll see the `3D Outliner`. This shows
    you all the objects that are in the scene. Underneath the outliner, you’ll see
    the `Properties Editor`. This is where you can adjust the properties of the scene
    or object, change the material, or even add modifiers or constraints to an object.


    ## CREATING A NEW FILE IN BLENDER


    To create a new file in Blender, choose `File  ⇒ New`. When a popup appears, click
    `Reload Start-Up File`.


    Whenever you create a new file, the scene will reset to include just a cube, a
    camera, and a light. This is the standard setup in Blender. To delete an object
    such as a camera, light, or cube in the scene, simply select the item you want
    to delete and press `X` on your keyboard. A popup will appear asking if you’re
    sure that you want to delete this object. Click yes or simply press `X` again.
    The object will then be deleted.


    ## FIGURING OUT THE BLENDER INTERFACE


    Blender is a great program for animation and modeling, but like Unity, it’s intimidating
    to open the first time. In the following section, I introduce you to the different
    parts of Blender’s interface and explain how to properly use the program. Knowing
    the layout of Blender will be invaluable when using this program to help build
    the characters and objects for your game.


    ### TABS


    On the left side of the `3D View` section, there is a menu. On the far left of
    the menu, there are multiple tabs that you can select. The tabs differ depending
    on what mode you’re in.


    The only two tabs that you need to worry about in [Chapters 9](#12_9781119404187-ch09.xhtml)
    and [10](#13_9781119404187-ch10.xhtml) are the `Create` and `Tools` tabs.


    ### TOOLS TAB


    The `Tools` tab (see [Figure 8-3](#11_9781119404187-ch08.xhtml_c08-fig-0003))
    alters the selected object.


    When you’re in `Object mode`, this involves the transformation controls, mirroring,
    deleting, changing the origin, and the type of shading.


    When you’re in `Edit Mode`, the `Tools` tab opens up different options for editing
    your object, from extruding to deleting faces.


    ![image](images/9781119404187-fg0803.png)


    [FIGURE 8-3:](#11_9781119404187-ch08.xhtml_rc08-fig-0003) The `Tools` tab.


    ### CREATE TAB


    The `Create` tab (see [Figure 8-4](#11_9781119404187-ch08.xhtml_c08-fig-0004))
    allows you to create different objects within the scene, from a square to a sphere.
    It also allows you to create paths, cameras, and even light sources for the scene.


    When you create an object in `Object mode`, both objects are the same unless you
    combine or join them together later.


    Do not use `create` in `Edit Mode` unless you absolutely need to.


    ![image](images/9781119404187-fg0804.png)


    [FIGURE 8-4:](#11_9781119404187-ch08.xhtml_rc08-fig-0004) `Create` tab.


    ### RELATIONS TAB


    The `Relations` tab shows you the various grouping options you have for an object.
    It can parent objects to one another, create group of objects, or link objects
    together.


    ### ANIMATION TAB


    The `Animation` tab gives you the ability to create and delete keyframes in the
    animation, as well as bake certain motions (create all the individual frames in
    a sequence as opposed to the computer just inferring that motion).


    ### PHYSICS TAB


    The `Physics` tab allows you to adjust the mass of an object and apply physics
    with a rigid body similar to how Unity does it.


    ### GREASE PENCIL TAB


    The `Grease Pencil` tab is a way to add annotations and animation notes into the
    scene that you can use as reference points. Grease pencils can also be used to
    assist in 2D animation within Unity.


    ### SHADING AND UV TAB


    The `shading and UV` tab gives you the ability to modify the way the object is
    rendered (whether its lines are hard or smooth in the render), as well as how
    to fix or adjust faces on the object that may be inversed.


    UV mapping is also available to help texture the character or object by creating
    or marking “seams.”


    ### OPTION TAB


    This is the mesh option menu, which gives you control over the `X-mirror` and
    `Edge Select` mode. The `X-mirror` tools allow you to edit your object symmetrically.
    If you make a change on one side of the object, that change will happen on the
    other side along the `x`-axis. The `Edge Select` mode gives you the ability to
    adjust the edge’s path, giving it a curve or bevel.


    ### THE OUTLINER


    On the upper right of the screen, you’ll see the `Outliner` for the project (see
    [Figure 8-5](#11_9781119404187-ch08.xhtml_c08-fig-0005)). The `Outliner` serves
    three purposes:


    - Clicking the eyeball next to the object will turn it invisible.

    - Selecting the camera determines what objects are rendered.

    - Clicking the plus sign to the left of the object will show all objects parented
    to.


    ![image](images/9781119404187-fg0805.png)


    [FIGURE 8-5:](#11_9781119404187-ch08.xhtml_rc08-fig-0005) Also on the Timeline
    you’ll find a control panel that will allow you to play, rewind, fast-forward,
    or pause your animation. You’ll also see a red button, which turns on *automatic
    keyframing,* so whenever you move or adjust your object in the scene, Blender
    will automatically record a keyframe to mark the position change. If you move
    along the Timeline and then move the object, Blender will make another keyframe
    instead of overwriting, causing your object or character to move.


    ### TIMELINE


    The `Timeline` (see [Figure 8-6](#11_9781119404187-ch08.xhtml_c08-fig-0006)) is
    located at the bottom of the screen and is primarily used to control the animation.
    Adjusting the Timeline will adjust where the time is.


    ![image](images/9781119404187-fg0806.png)


    ### PROPERTIES SECTION


    You’ll notice at the bottom of the `Timeline` that there are numbers. These numbers
    do *not* stand for seconds within the animation — they stand for frames. In animation
    frames are the pictures that fly by at a fraction of a second to create the illusion
    of movement. There are different frame rates for different media, but the three
    that you should know are:


    - **24 frames per second (FPS):** Standard film

    - **30 FPS:** Minimum game standard

    - **60 FPS:** High definition


    For your game, you’ll be going off of 30 FPS. The numbers at the bottom of the
    screen will indicate what frame you’re on, as well as the start and end frames
    for the animation.


    Similar to the `Create` and `Tools` tabs, the `Properties` section of the window
    has different tabs for the objects. The first four tabs are for the properties
    not relating directly to the object:

