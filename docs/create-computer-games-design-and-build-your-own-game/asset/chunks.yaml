    This chapter acts as the final cleanup for your level. Like the previous play-testing
    chapter ([Chapter 6](#09_9781119404187-ch06.xhtml)), the emphasis of this chapter
    is on looking back at the aspects of the game that do and don’t work, as well
    as fixing the problems that are within your game. In this chapter, you won’t be
    learning anything new. Instead, you’ll refine the aspects of your game that may
    not work as well as some of the others and ask yourself the questions that will
    be useful when you aim to set your games apart from other games.


    The goal of this chapter is to come out with a completed level that you’ll be
    able to play. This chapter forces you to look back on your game and think about
    what you do and don’t understand about it. In the end, you’ll see the benefit
    of play testing more than once.


    ## Testing the Second Time


    You should conduct play testing often in order to create a better game. Game development
    is about fixing and adjusting things so they work better, so play testing is important
    at all times, even when you’ve already done it.


    This time, you’ll focus on other aspects of your game than what you were focusing
    on before. When you were looking at your game earlier, you were focusing on the
    core aspects of the game, what did and didn’t make sense, and what could be clearer.
    This time you’re focusing on the parts of your game that need more polish or need
    to be fixed because they broke with the addition of different parts of the game.


    With new play tests come new questions that have to be answered. On top of the
    questions you asked in the previous play testing, you have new questions that
    should be answered. These questions range from some simple problems within the
    game code to creating entirely new assets. Again these questions are asked in
    no particular order, but all of them should be considered in this new round of
    play testing.


    Ask these questions on your second round of play testing:


    *   **What has broken in the game? Why?** This question is probably the most obvious
    question when play testing — whether you’re doing it early in the game development
    or later on. Sometimes aspects of the game are working fine until a new factor
    comes in and ruins it all. When you play test your game, keep an eye out for some
    of these problems.

    *   **Is the game hard or frustrating?** At this point in the development, you
    should have a pretty good grasp on what works and what doesn’t work in your game
    as it is. This question helps you understand if the “harder” parts of your game
    are having the desired effect on the players. Players should never feel cheated
    by the game. As soon as that happens, the game developer has made a mistake in
    the game.

    *   **What blocks did you find in the game?** Are there parts of the game that
    force the game to a halt? Are these parts even able to be overcome or are they
    impossible? Games that are impossible aren’t fun. A player never wants to feel
    like he *can’t win a game*. Sometimes these blocks come in the form of tasks that
    are too challenging, or just a wall that is too high for the player to get across.

    *   **Was the game too easy?** Games aren’t fun if they don’t have some sense
    of accomplishment for finishing them. Although games that are too difficult can
    discourage players, games that are too easy make the accomplishments that the
    players achieve less meaningful.

    *   **Did the game make sense?** Was the players able to understand the game and
    play it with little to no confusion? Games should not confuse players (unless
    the point of the game is to be confusing). Games should make sense and have rules
    that are clear and easy to understand.


    ## Fixing Your Game


    When you finish play testing, acknowledge the problems that were addressed and
    find ways to fix them. I’ll cover some of the problems in this section, but your
    play testers may identify problems that I don’t cover here. But using what you’ve
    learned in this book, try to figure out ways to address these issues as they come
    up, and alter your game to answer the questions the play testers come up with.
    The game is yours to improve on! This book gives you the bare bones — it’s up
    to you to make it your own.


    ### The Wall-Climbing Problem is Back


    One thing that broke when the game was given characters and animation was the
    solution to the wall-climbing problem that you fixed earlier. Using raycasting,
    you made it so that when the player runs into the wall, he’s forced back, preventing
    him from using the wall as something that they could climb up and use (see [Figure
    13-1](#16_9781119404187-ch13.xhtml_c13-fig-0001)).


    ![image](images/9781119404187-fg1301.png)


    [FIGURE 13-1:](#16_9781119404187-ch13.xhtml_rc13-fig-0001) Wall climbing.


    Checking the character, you see that nothing much has changed. The player is still
    controlling the character, and the animation is parented to the base player, so
    although the animation plays, nothing it does actually affects the movement of
    the character. In the code, nothing is any different. The `char` code hasn’t been
    changed at all.


    The problem isn’t with the individual parts but with how they relate to each other.
    Try running into the staircase from either side and see what happens. One side
    doesn’t change, but when the other side runs into the wall, the character goes
    backward.


    ### The Coins are Going Down by Two Every Time You Get Hurt in the Game


    This problem was a head scratcher. Nothing seemed to change between the `variable`
    and the code to affect this change in the game, but every time you run into an
    enemy or fall off the edge, the character loses two coins as opposed to just one,
    causing much faster gameovers.


    The problem stems from the game giving back too much information to the code.
    Although the code isn’t on the player character, the character is parented to
    an object with the code so it’s also affected by the code. Because of this, the
    collider on the player character also registers the triggers and sends them back
    to the code to adjust the score. This leads to the player losing two points instead
    of just one as originally designed. To fix this problem, you just have to turn
    the box collider off of the player character. The parent of the character has
    all the code needed and a box collider of their own, so removing the box collider
    on the character itself just prevents the same thing from happening twice within
    the game.

