    \ game. This problem didn’t come up earlier. Before this, the players actually\
    \ had the ability to jump higher because there was enough room to give the characters\
    \ a running start. With the introduction to enemies and environmental hazards,\
    \ that same jumping power has been limited. Because of this, some of the platforms\
    \ are too high for the players to actually jump properly.\n\nThe fix for this\
    \ problem is actually really simple: Just add stairs! For the platforms that can’t\
    \ be jumped or have no alternative ways of being accessed, the addition of stairs\
    \ (see [Figure 13-4](#16_9781119404187-ch13.xhtml_c13-fig-0004)) doesn’t diminish\
    \ the difficulty of the game. Instead, they improve the game by giving the player\
    \ the ability to actually progress forward.\n\n![image](images/9781119404187-fg1304.png)\n\
    \n[FIGURE 13-4:](#16_9781119404187-ch13.xhtml_rc13-fig-0004) Adding stairs.\n\n\
    ## WRAPPING UP THE NOTICEABLE ISSUES\n\nThese are just a handful of the problems\
    \ that players may experience within the game. As a developer, your job is to\
    \ listen to any and all of the criticisms and do your best to resolve them. Glitches\
    \ and bugs happen in games. Even games that have been play tested multiple times\
    \ have these problems. You’ll likely never find *all* the possible bugs in your\
    \ game, especially the larger and more complex your game gets.\n\nTake any criticism\
    \ you get in stride and know that no game is perfect. Strive to make the best\
    \ game possible, test it, and adjust it to better fit the players you desire,\
    \ but don’t get lost in fixing everything.\n\n![image](images/c14.png)\n\nIn the\
    \ preceding chapters, you created and refined the first level of your game. Now\
    \ it’s time to put the final touches on the level so that you can create new levels\
    \ and move beyond just a single-level game.\n\nIn this chapter, you’ll learn how\
    \ to code the game to load a new level when it has been finished. You’ll also\
    \ learn how to fix the code so that you can get the character to respawn when\
    \ they die in the level. Finally, you’ll learn how to export your game so that\
    \ you can play it anytime!\n\n## CREATING MULTIPLE LEVELS\n\nYou’ve made one level\
    \ for your game so far, but games aren’t just one level. Most games have multiple\
    \ levels that players progress through, increasing the difficulty as the levels\
    \ go on. Your game should be no different. Unity gives you the ability to easily\
    \ create new levels and connect the levels together in your game.\n\nFirst, you\
    \ need to create the new level:\n\n1. **With your first level open, choose File ⇒ New\
    \ Scene.**\n   This will create a new empty scene within your overall project.\n\
    2. **Save the new scene as `Level2`, and open your first level again.**\n3. **Create\
    \ a new C# code, and name it `Level2` (see [**Figure** **14-1**](#17_9781119404187-ch14.xhtml_c14-fig-0001)**).**\n\
    4. **Open the new code.**\n5. **At the top of the code, where the code lists all\
    \ the collections and engines that the code will be using, type the following:**\n\
    \   ```csharp\n   using UnityEngine.SceneManagement;\n   ```\n   This code will\
    \ give access to Unity’s Scene Manager tool. The Scene Manager allows to control\
    \ the different scenes using the code. You can use it to load levels and reload\
    \ levels with a touch of a button or when something is triggered. In this case\
    \ the `Level2` code will be added to the endpoint so that when the player triggers\
    \ the game object the game will load level 2 on the screen.\n6. **Delete both\
    \ the `void Start` and `void Update` strings.**\n   They won’t be necessary for\
    \ the code.\n7. **In place of the `void Start` and `void Update` strings, type\
    \ the following:**\n   ```csharp\n   void OnTriggerEnter(Collider other) {\n \
    \  ```\n   This will indicate to the code that this string is activated when the\
    \ collider has a collision with another game object. Inside the code, you’ll define\
    \ what code will be activated when the trigger happens and how it will affect\
    \ the rest of the game.\n8. **Inside the `void` trigger, type the following code:**\n\
    \   ```csharp\n   if (other.gameObject.CompareTag(\"Player\")) {\n   ```\n   This\
    \ will make it that when the collider touches a game object with the tag `Player`,\
    \ the code that is within the brackets will happen.\n9. **Add the following code\
    \ within the `if` statement brackets:**\n   ```csharp\n   Scene.Manager.LoadScene\
    \ (\"Level2\");\n   ```\n   This final bit of code will access the Scene Manager\
    \ tool and tell it to load the scene titled `Level2` that is connected to your\
    \ game. This code can be used to load any of the other scenes within your project.\
    \ You can see a completed version of what the code should look like in [Figure\
    \ 14-2](#17_9781119404187-ch14.xhtml_c14-fig-0002).\n\n![image](images/9781119404187-fg1401.png)\n\
    \n[FIGURE 14-1:](#17_9781119404187-ch14.xhtml_c14-fig-0001) Creating the new code.\n\
    \n![image](images/9781119404187-fg1402.png)\n\n[FIGURE 14-2:](#17_9781119404187-ch14.xhtml_c14-fig-0002)\
    \ The new code.\n\nNow if you try to test this within Unity, it will automatically\
    \ include it. This is because even though the scenes are within the project, they\
    \ aren't actually linked. In fact, the you are the the the the the the the the\
    \ the.. The ability to pick which scenes are included in the build can save you\
    \ the headache of having to move the files to folder. Instead, you can just remove\
    \ them from the build.\n\nTo make it that scenes can be linked together, follow\
    \ these steps:\n\n1. **Choose File ⇒ Build Settings.**\n   The Build Settings\
    \ window (shown in [Figure 14-3](#17_9781119404187-ch14.xhtml_c14-fig-0003)) appears,\
    \ giving you different options for game.\n2. **In the Platform box, select `PC,\
    \ Mac & Linux`.**\n   This indicates the type of platform that you want the game\
    \ to be on.\n3. **From the Target Platform drop-down list, select `PC, Mac, Linux`.**\n\
    \   The target platform is the platform that Unity will format the game for.\n\
    4. **In the Scenes in Build box, select which scenes will be included in the build.**\n\
    \   To add a new scene, click `Add Open` and Unity will automatically include\
