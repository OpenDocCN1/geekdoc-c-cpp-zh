    ### THE WALL-CLIMBING PROBLEM IS BACK


    One thing that broke when the game was given characters and animation was the
    solution to the wall-climbing problem that you fixed earlier. Using raycasting,
    you made it so that when the player runs into the wall, he’s forced back, preventing
    him from using the wall as something that they could climb up and use (see [Figure
    13-1](#16_9781119404187-ch13.xhtml_c13-fig-0001)).


    ![image](images/9781119404187-fg1301.png)


    [FIGURE 13-1:](#16_9781119404187-ch13.xhtml_rc13-fig-0001) Wall climbing.


    Checking the character, you see that nothing much has changed. The player is still
    controlling the character, and the animation is parented to the base player, so
    although the animation plays, nothing it does actually affects the movement of
    the character. In the code, nothing is any different. The char code hasn’t been
    changed at all.


    The problem isn’t with the individual parts but with how they relate to each other.
    Try running into the staircase from either side and see what happens. One side
    doesn’t change, but when the other side runs into the wall, the character goes
    backward as if he had the raycast on him. This is because he does.


    Raycasting is based on the object’s orientation, not the global orientation like
    the vector directions were. Because of this, the raycast that was on the front
    of the mesh has been moved to one side of the player. To fix this issue, you just
    need to change one small aspect of the code, and the player’s original movement
    in the game will be restored.


    The `vector3`s that determined the direction of the raycast need to be adjusted
    to account for this rotation in the mesh. For the example given in [Figure 13-2](#16_9781119404187-ch13.xhtml_c13-fig-0002),
    only the forward direction needed to be changed to left. The down `vector3` didn’t
    need to be changed because the altering of the character’s angle did not change
    the *y*-axis at all so the down is still in the same place. That’s all you need
    to do. After you finish, save the code and test to make sure that it’s working
    properly.


    ![image](images/9781119404187-fg1302.png)


    [FIGURE 13-2:](#16_9781119404187-ch13.xhtml_rc13-fig-0002) Fixing the wall-climbing
    code.


