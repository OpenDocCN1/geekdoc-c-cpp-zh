  trans: "\n\n```csharp\nwinText.text = \"你输了 :( 按 R 键重新开始\"\ndead = true;\n}\n```\n\
    \n这段代码位于 `void` 函数内，但它是独立存在的，这样你就不需要像之前那样在每个 `if` 语句中修改代码了（请参见图 14-4）。\n\n![image](img/9781119404187-fg1404.png)\n\
    \n图 14-4： 将关卡添加到构建中。\n\n你不需要销毁游戏对象，而是使用一个新的布尔值 `Boolean` `dead` 来影响游戏。现在，`dead\
    \ = true` 对游戏没有影响，但那是因为你还没有定义 `dead`。按照以下步骤操作：\n\n1. **在代码顶部，即你存放所有公共和私有浮点数、文本和游戏对象的地方，添加以下代码：**\n\
    \n   ```csharp\n   public bool dead = false;\n   ```\n\n   这将给 `dead` `bool` 赋值\
    \ `false`，使得代码能够识别 `dead` `bool` 的值。目标是每当玩家死亡（当 `dead` `bool` 为 `true` 时），玩家将无法移动或使用她的角色。\n\
    \n2. **修改 `void FixedUpdate` 中的所有 `if` 语句，使其包含 `dead` 必须为 `false` 的条件。**\n\n与添加\
    \ `sprint` 函数类似，只需在 `if` 代码的末尾添加 `&& dead == false`。对 `void FixedUpdate` 内部所有所有的\
    \ `if` 语句重复此操作（请参见图 14-5）。\n\n现在，只要玩家没有死亡，角色就能自由移动，但一旦角色死亡，所有的移动控制都将无法使用，因为你添加了角色必须*非*死亡才能移动的条件。角色一死亡，玩家的操作就会停止，但在游戏“结束”后，你如何重新开启玩家的操作呢？\n\
    \n![image](img/9781119404187-fg1405.png)\n\n图 14-5： 使 `dead == false`。\n\n你已经编写了代码让角色停止工作。现在你必须编写重置按钮的代码。在失败语句中，你已经告诉了玩家她需要按哪个键来重置游戏，因此你将在代码中编写该函数。在\
    \ `FixedUpdate` 代码的末尾，但在射线检测代码之前，添加一个新的 `if` 语句：\n\n```csharp\nif (Input.GetKey(KeyCode.R)\
    \ && dead == true) {\n    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n\
    }\n```\n\n这段代码让玩家在角色死亡时拥有重置游戏的能力。就像移动代码一样，这段代码只有在玩家按下键盘上的特定按钮时才会发生——在这种情况下是 `R`\
    \ 键。因为添加了 `&& dead == true`，除非玩家已经死亡，否则这段代码不会生效。当玩家按下 `R` 时，`SceneManager` 将从头重新加载场景，将游戏重置为关卡开始时的状态，因此任何所有文本和计数都将重置为初始值。图\
    \ 14-6 显示了代码应该后的样子。\n\n![image](img/9781119404187-fg1406.png)\n\n图 14-6： 重置代码。\n\
    \n## 导出你的游戏\n\n现在你的游戏已经完成了，你需要导出游戏以便在没有 Unity 的情况下运行。有两种方法可以：\n\n* 你可以选择 `File`（文件） ⇒ `Build`（构建）。\n\
    * 你可以在双重检查确保所有设置都正确后，在 `Build Settings`（构建设置）窗口中构建游戏。\n\n你还可以为文件命名。当导出游戏时，你可以选择导出到特定位置。将其导出到你的游戏文件夹将易于找到和打开，但你不需要将其与项目文件夹放在一起，因为构建是独立的，不依赖于项目文件夹，它的任何部分都不需要引用它们。\n\
    \n当你打开游戏时，你将看到图 14-7 所示的屏幕。\n\n![image](img/9781119404187-fg1407.png)\n\n图 14-7：\
    \ 将关卡添加到构建中。\n\n## 导出游戏\n\n你已经编写了代码让角色停止工作。现在你必须编写重置按钮的代码。在失败语句中，你已经告诉了玩家她需要按哪个键来重置游戏，因此你将在代码中编写该函数。在\
    \ `FixedUpdate` 代码的末尾，但在射线检测代码之前，添加一个新的 `if` 语句：\n\n```csharp\nif (Input.GetKey(KeyCode.R)\
    \ && dead == true) {\n    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n\
    }\n```\n\n这段代码让玩家在角色死亡时拥有重置游戏的能力。就像移动代码一样，这段代码只有在玩家按下键盘上的特定按钮时才会发生——在这种情况下是 `R`\
    \ 键。因为添加了 `&& dead == true`，除非玩家已经死亡，否则这段代码不会生效。当玩家按下 `R` 时，`SceneManager` 将从头重新加载场景，将游戏重置为关卡开始时的状态，因此任何所有文本和计数都将重置为初始值。图\
    \ 14-6 显示了代码应该后的样子。\n\n![image](img/9781119404187-fg1406.png)\n\n图 14-6： 重置代码。\n\
    \n## 导出你的游戏\n\n现在你的游戏已经完成了，你需要导出游戏以便在没有 Unity 的情况下运行。有两种方法可以：\n\n* 你可以选择 `File`（文件） ⇒ `Build`（构建）。\n\
    * 你可以在双重检查确保所有设置都正确后，在 `Build Settings`（构建设置）窗口中构建游戏。\n\n你还可以为文件命名。当导出游戏时，你可以选择导出到特定位置。将其导出到你的游戏文件夹将易于找到和打开，但你不需要将其与项目文件夹放在一起，因为构建是独立的，不依赖于项目文件夹，它的任何部分都不需要引用它们。\n\
    \n当你打开游戏时，你将看到图 14-7 所示的屏幕。\n\n![image](img/9781119404187-fg1407.png)\n\n图 14-7：\
    \ 将关卡添加到构建中。\n\n## 关于作者\n\n**PATRICK MCCABE** 是数字艺术的一名教师。他在过去的一年里一直在教学生动画。他于 2016\
    \ 年毕业于纽约州立大学。高中期间，Patrick 在格林尼市青年电影节获得过最佳动画奖。他还是一个不秘密的《星大战》爱好者。\n\n## 致谢\n\n这本书献给我的未婚妻\
    \ Shela，若没有她，我可能永远无法完成。感谢你总是听我没完没了地谈论游戏，并确保我的百事乐总是满溢的。这本书也献给百事乐。\n\n## 作者致谢\n\n\
    感谢 John Wiley & Sons 给我机会写这本书。这是一次奇妙的经历，它挑战了我去思考并用语言表达对游戏设计的感受，并对游戏设计本身产生了新的欣赏。\n\
    \n感谢 Steven Hayes 在我进度落后或对如何处理每个章节感到卡壳时，通过邮件让我保持专注。没有你，我不认为我能完成这本书。\n\nNick，若没有你，我不认为这本书能有现在的一半长。我想我每天会找你七次，请求你帮助调试那些不起工作的代码。你也是我这门课程课程之父。\n\
    \n感谢 Cristina 和 Jordan，在我难以产生动力写作时给了我可以依靠的肩膀。你们两个是我不应得的英雄。Cristina，尤其是最近这几周，从我们每个周四会议后的讨论中，到我们俩都试图解决格式困扰的时刻，你是唯一理解我写作困难的人。\n\
    \n"
- fmt: '

    I also have to thank Rob Kissner. It just doesn’t seem fair not to. Rob and his
    company, Digital Arts Experience, are the reason why I was even able to write
    this book. I remember when Rob asked me to write this book. “Hey, Pat, do you
    know Unity, and can you write a book on it?” Rob was nothing but encouraging the
    entire time and whenever I was freaking out about getting the chapters in on time
    he would just listen with a smile and a joke ready. Rob, there is so much to thank
    you for, and to say that you are one of the most wonderful people I’ve ever met
    would be an understatement. Thank you, Bert, for everything.


    Thank you, Shela, for being there for me throughout this entire book and always
    pretending to be super interested in how the game mechanics of `Five Nights at
    Freddy’s` create a sense of helplessness in the game to help emphasize the horror
    of the situation. Shela, you were always there when I needed you most and thank
    you so much for listening. You are the best partner a guy like me could ever ask
    for. Between refilling my soda when it was empty to giving me a hug when I’d had
    a long day writing, everything you did was special and important. There are no
    words that can describe everything you did for me. You are my best friend in the
    world, and I love you.


    Finally, thank you to Elizabeth Kuball for making me sound smarter than I actually
    am. You are the reason this book is even remotely readable, and I don’t think
    there are enough words to describe how grateful I am to you for dealing with every
    delay and problem I’ve had while writing this book. I am so happy and grateful
    I was able to work with you to help bring this book into reality.


    ## PUBLHER’S ACKNOWLEDGMENTS


    **EXECUTIVE EDITOR:** Steven Hayes


    **PROJECT EDITOR:** Elizabeth Kuball


    **SR. EDITORIAL ASSISTANT:** Cherie Case


    **PRODUCTION EDITOR:** Vasanth Koilraj


    **COVER IMAGE:** © `FrankRamspott/iStockphoto`


