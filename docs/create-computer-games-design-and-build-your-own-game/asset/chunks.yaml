    \ represents how steep a learning curve there is to your game. Because you’re\
    \ currently testing the first level, that number should be low. Understanding\
    \ how many times and why the player died can give you information about whether\
    \ your game is clear on what the player is supposed to do. If the player kept\
    \ dying bumping into the enemy, maybe the enemy wasn’t clearly enough depicted.\
    \ If they kept falling off the edge, maybe the jump button wasn’t working or wasn’t\
    \ clearly indicated.\n\n*   **Did the game make sense?** It’s still early in the\
    \ game’s development, so there’s probably not much to understand beyond the general\
    \ mechanics of the game, but it’s still important that even something as simple\
    \ as what an enemy does and what a pickup item does are clear to the player.\n\
    \n*   **What would you change at this stage?** This question is probably the trickiest\
    \ of the questions because it can be affected by personal preferences. Still,\
    \ it’s a question I find important to ask because, while you’re developing your\
    \ game, there will be ideas that you just won’t think of or will miss. Even something\
    \ that you won’t use can be invaluable in any artistic medium. It forces you to\
    \ think about what the game you want to make really is. It could also give you\
    \ new and interesting directions that you never thought of taking with the game.\n\
    \nThese are questions that I have found helped me get the most out of play testing.\
    \ It’s often hard to give criticism to a person — especially a friend — so asking\
    \ your play testers these questions may help them open up and be honest about\
    \ the game. No matter what advice you do or don’t take, honest feedback is never\
    \ a bad thing.\n\n## HANDLING FEEDBACK\n\nConstructive feedback is always a good\
