    \ break that immersion.\n\n    In the original Sonic the Hedgehog game, SEGA used\
    \ the idle animation to reinforce the personality of the main character as a “too\
    \ cool” speedster. If players don’t move Sonic, he’ll begin to tap his foot impatiently,\
    \ waiting for the player to make a movement. And if players wait long enough,\
    \ Sonic will even jump off the edge of the level out of impatience and leave!\n\
    \n*   **A walking animation:** The most standard animation in the game, movement\
    \ animations have existed since the days of Pac-Man. If a character is just floating\
    \ around the screen, it breaks player immersion. Adding a walk cycle for whenever\
    \ the character moves helps give life to your character.\n\n*   **A jump animation:**\
    \ This animation adds more to how the character moves around and helps reinforce\
    \ the idea of the character as being alive. When you jump, you don’t just move\
    \ vertically. Jump motions add animation to a jump, to help sell the illusion\
    \ of playing as a real character.\n\nThe main character of the game you’re creating\
    \ in this book is a box (see [Figure 10-1](#13_9781119404187-ch10.xhtml_c10-fig-0001)),\
    \ so the character’s actual movement is limited — but it’s still possible to give\
    \ a box life and feeling. (Consider the Luxo Jr. lamp from Pixar as an example\
    \ of how to get feeling from an inanimate object.) For your game, you’ll focus\
    \ on a way to get only the basic movement of the character, keeping in mind that\
    \ the techniques and tools that you’ll be using can also be used to create far\
    \ more extensive ranges of motion.\n\n![image](images/9781119404187-fg1001.png)\n\
    \n[FIGURE 10-1:](#13_9781119404187-ch10.xhtml_rc10-fig-0001) Boxo!\n\n### USING\
    \ SHAPE KEYS\n\nBlender separates editing from object manipulation through the\
    \ two different modes. The problem is that you aren’t able to animate changing\
    \ the character’s shape with the vertices, edges, or faces within Blender. Blender’s\
    \ animation tools are limited to Object Mode (and Pose Mode through rigging).\
    \ Although you can animate many parts of the object (including the textures and\
    \ modifiers, as you’ll learn later in this chapter), you can’t animate changes\
    \ made within Edit Mode without an particular Blender extension. And even then,\
    \ the animation is limited and finicky at best.\n\nSo, with a character as simple\
    \ as a box, how are you supposed to animate the character so that it feels alive\
    \ and moving? Luckily, Blender has an answer for this in the form of shape keys.\n\
    \n*Shape keys* are different variations on the shape of the same object. They\
    \ allow you to mark changes in your edit and adjust the influence of those changes\
    \ on a scale from 0 influence to 1 influence. You can have multiple shape keys\
    \ on the same object, but when both shape keys are being used at the same time,\
    \ the object distorts to the midpoint of the two different shape keys. Shape keys\
    \ are useful tools for creating things like facial animations because you can\
    \ use multiple shape keys to affect different parts of the face, such as the eyes\
    \ and the mouth. You can also combine shape keys to create more complex emotions.\n\
    \nFor the player character, you’ll be using shape keys to help bring to life their\
    \ movement within the scene. Because the character designs are so simplistic in\
    \ nature, the way the character moves and expresses has been reduced. But you\
    \ can still rely on the cartoony nature of the style to help bring the character\
    \ to life.\n\nFirst, you need to create a shape key:\n\n1.  **Select the object\
    \ that you want.**\n\n2.  **Go to the Object Data tab in the Properties section\
    \ of the window.**\n\n3.  **Scroll down to Shape Keys.**\n\n4.  **On the right\
    \ side, click the plus sign (+) button twice.**\n\n    This creates a base shape\
    \ key that all the other shape keys will use as a reference. Clicking it a second\
    \ time will also create your first shape key (see [Figure 10-2](#13_9781119404187-ch10.xhtml_c10-fig-0002)).\n\
    \n5.  **Select Key 1 and switch to Edit Mode.**\n\n![image](images/9781119404187-fg1002.png)\n\
    \n[FIGURE 10-2:](#13_9781119404187-ch10.xhtml_rc10-fig-0002) Creating shape keys.\n\
    \nNow whatever changes you make in Edit Mode will automatically be recorded into\
    \ Key 1\\. All the changes you make will also have no effect on the base key or\
    \ any other shape key made after this.\n\nStart off by adjusting one of the faces\
    \ and switching back to Object Mode. When you do, you’ll notice that the change\
    \ resets itself. This is because the shape keys are only active when you want\
    \ them to be active. By adjusting the value to the right of the key from 0 to\
    \ 1, you can determine how much the shape changes to match the shape key. At a\
    \ value of 1, the shape changes to match the shape key entirely.\n\nNow switch\
    \ back to Edit Mode and adjust the shape so that the cube looks like it’s squatting\
    \ down (see [Figure 10-3](#13_9781119404187-ch10.xhtml_c10-fig-0003)).\n\n![image](images/9781119404187-fg1003.png)\n\
    \n[FIGURE 10-3:](#13_9781119404187-ch10.xhtml_rc10-fig-0003) The first shape key.\n\
    \nAfter you finish the first shape key (see [Figure 10-4](#13_9781119404187-ch10.xhtml_c10-fig-0004)),\
    \ double-click that shape key and rename it Walk. This shape key will serve as\
    \ the primary animation for your walk cycle. After renaming the shape key, reset\
    \ the influence to 0 and create two more shape keys by clicking the plus sign\
    \ (+) button. Rename these two shape keys Right Turn and Left Turn, and select\
    \ either one.\n\n1.  **Enter Edit Mode.**\n\n2.  **Select the top face.**\n\n\
    3.  **Use the rotate tool to rotate that face slightly to the side indicated by\
    \ the name.**\n\n4.  **Return to Object Mode and repeat this process for the other\
    \ side.**\n\n![image](images/9781119404187-fg1004.png)\n\n[FIGURE 10-4:](#13_9781119404187-ch10.xhtml_rc10-fig-0004)\
    \ The first shape key.\n\n### BREAKING DOWN YOUR PLAYER CHARACTER’S ANIMATION\n\
    \nIn most animations, including the ones you’ll be doing later in this chapter\
    \ for the game, you do only one major animation, with each individual part of\
    \ the animation flowing into the others naturally over time. This isn’t the case\
    \ for your player character, because you need multiple animations in one Timeline\
    \ so that your game can refer to them in [Chapter 12](#15_9781119404187-ch12.xhtml)\
    \ when you import you characters.\n\n### CREATING A KEYFRAME"
