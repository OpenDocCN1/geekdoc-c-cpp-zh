    \ 时，会弹出一个颜色选择器窗口。在颜色选择器的底部，你会看到颜色滑块旁边有四个字母：\n\n* `R` 代表红色 (Red)\n* `G` 代表绿色 (Green)\n\
    * `B` 代表蓝色 (Blue)\n* `A` 代表透明度 (Alpha)\n\n使用不同的颜色滑块可以改变颜色颜色的影响程度，但 `Alpha` 决定了物体的透明不程度。该选项仅在\
    \ `Fade`、`Cutout` 或 `Transparent` 渲染设置可用。\n\n`Transparent` 的效果没有另外两种好，因为它更多用于渲染玻璃，因此会有反光。将\
    \ `Alpha` 一直拖到 `0` 将使材质完全透明。创建材质后，将其分配给你创建的四形体（quad），现在该四形体在关卡底部变得不可。\n\n将此四形体命名为\
    \ `DeathZone1` 并保存。你想再创建两个 `DeathZone`，并将一个放在两个重生点之间，另一个从最后一个重生点一直延伸到关卡结束之后，如图\
    \ 5-13 所示。\n\n![image](img/9781119404187-fg0513.png)\n\nFIGURE 5-13: 第一个触发器。\n\
    \n任何区域之间都不应该有空隙。这是为了确保每个重生点都有一个相应的区域，可以将角色重新生成回重生点。在你创建了所有重生点和区域后，该为它们编写代码了。\n\
    \n### 编写重生点代码\n\n为了编写重生点，你将使用一套与其他碰撞体略不同的系统。其一，你将不再使用标签（tags），而是使用公共 `GameObject`。\n\
    \n在代码顶部，创建六个公共 `GameObjects`（参见图 5-14），每个触发器和目标对应一个。前三个你应该命名为 `deathZone01`、`deathZone02`\
    \ 和 `deathZone03`；这些将挂载在本章之前创建的触发区域上。使用以下示例作为编写代码的方法，并替换每一个名称：\n\n![image](img/9781119404187-fg0514.png)\n\
    \nFIGURE 5-14: 公共 GameObjects。\n\n```cpp\nPublic GameObject deathZone01;\n```\n\
    \n接三个命名为 `respawnPoint1`、`respawnPoint2` 和 `respawnPoint3`。这些将指向之前创建的空物体（empties）。\n\
    \n在第 4 章中，你创建了一个公共 `GameObject` 将摄像挂载到玩家角色。公共 `GameObjects` 允许你选择代码将影响特定的目标。如果你想为多个关卡使用同一段代码，它们会非常有用，因为很容易为不同的关卡定位不同的对象。从重生点的考虑，你希望能够在每个关卡中轻松设置重生点，而标签是不可行的，因为每个重生都需要单独编码，所以最快且最可靠的方法是使用\
    \ `GameObjects`。\n\n在图 5-15 中，你可以看到重生代码本身非常简洁，但你会注意到一些以前没见过的东西。与在此代码之前编写的常用 `CompareTag`\
    \ 代码不同，你会发现代码中有两个等号。\n\n![image](img/9781119404187-fg0515.png)\n\n```cpp\nif (other.gameObject\
    \ == deathZone01) {\n    transform.position = respawnPoint1.transform.position;\n\
    }\n```\n\n当值为数值型时，你只需要使用一个等号表示对象的值等于它；但对于非数值实例——例如当物体碰撞必须匹配特定对象时——它需要两个等号才能正常工作。\n\
    \n在这个 `if` 语句中，如果被碰到的另一个 `GameObject` 是 `deathzone01` `GameObject`，则位置将变换以匹配 `respawnPoint1`\
    \ 的位置。完成代码后，保存文件并切换到 Unity 窗口测试代码。\n\n选择玩家并进入检查器（Inspector）窗口。在 Char (Script)\
    \ 组件中，你现在会看到你在代码中创建的所有 `GameObjects` 列表。选择 `DeathZone1` 并勾选其旁边的框。对 `deathZone02`\
    \ 和 `deathZone03` 重复此操作。现在选择玩家并进入检查器窗口。在 Char (Script) 组件中，你现在会看到你在代码中创建的所有 `GameObjects`\
    \ 列表。\n"
- fmt: '

    When you think of play testing, the alpha or beta testers that developers bring
    in toward the latter half of the development cycle probably come to mind. You
    may think of play testers as people who are paid to play the game early and determine
    whether it’s fun. But that’s not all play testing is!


    For one thing, play testers aren’t just playing the game. They meticulously examine
    every part of the game and report any bugs or issues that come up. Play testers
    don’t really even play the game. Instead, they dissect it to determine what works
    and what doesn’t work on every level of the game.


    As a game developer, you need to understand the importance of having a good play
    tester. When you look for play testers, you need to be sure that they’re willing
    to not only play the game but take it apart piece by piece to determine what parts
    of the game work and what parts don’t work.


    Play testing isn’t something to take lightly. When you play test your games, the
    purpose is to improve aspects of your game that may not be as developed as the
    others. Play testing is all about finding the parts of the game that aren’t working
    and determine what exactly the game needs to fix — from bugs in the code to uneven
    spikes in the difficulty. Play testing is a stress test for your game. In play
    testing, you generally aren’t examining the game as a whole. Instead, you’re looking
    at individual aspects of the game as you play it. You’ll probably want multiple
    play testers to help catch as many flaws within the game as possible.


    ## KNOWING WHEN TO START PLAY TESTING


    Play testing can never start too early. In fact, the earlier you begin to play
    test your game, the better off you’ll be in the long run. Game development takes
    a lot of time and energy, and a lot of things depend on the different aspects
    of the game working together. Any one thing in the game requires multiple aspects
    of the game working at once to be sure that everything is going properly. The
    earlier you play test your game, and the more frequently you do so, the more it
    can help make sure that you don’t have to redo entire sections of code or work
    just to fix one minor issue. The later in the game development a change is made,
    the more expensive and time consuming the mistake is. Something that would only
    take a few moments to fix in the early code can take hours or days to fix in a
    completed game.


    Play testing shouldn’t just happen early, it should happen often. If mistakes
    remain part of the code or design too long, the rest of the game begins to develop
    around those mistakes and interconnect other parts of the game to them. The more
    code or designs that are linked to a mistake, the longer and costlier the mistake
    becomes. Play testing is the only way to understand what works and what doesn’t
    work about your game.


    ## DECIDING WHO SHOULD PLAY TEST YOUR GAME


    The hardest part about play testing is recognizing that you are your worst play
    tester. While you’re designing your game, you make decisions based on what you
    would want to play. The problem with play testing your own game is that you go
    in knowing some of the problems in your game. You have blinders on about other
    problems and you’re just looking for those problems — and missing others — from
    the start. You are your worst play tester — not because you don’t understand what
    your game is doing, but because you understand it almost too well.


    Think about your game like a story you’re writing. When you write a story, you
    have a very clear idea of what that story is about. The characters all make sense
    to you, and their motivations are crystal clear because you wrote them. The problem
    that a lot of amateur writers run into is actually conveying those ideas on the
    page. This is why writers have editors. Just because something makes sense to
    you doesn’t mean it will make sense to someone else. Game development is the same.


    When you grab a play tester, ask yourself who you want to play your game. What’s
    your target audience? Find friends or family members who match this description
    and let them play the game.


    After they finish playing, listen to what they tell you about your game. Make
    notes on what does and doesn’t work or what they found confusing. What may seem
    obvious to you won’t necessarily be obvious to them, and this is an important
    criticism because you want your game to be accessible to as many people as possible.


    If possible, have multiple people test your game. The best thing you can do is
    test as many ages or demographics as possible, not just your target audience.
    Although you should take the criticisms of your target audience into heavier consideration,
    don’t underestimate the advice of groups that are not your target. To make a game
    that people enjoy, you have to understand the importance of different perspectives.


    Even if you decide that the criticism or suggestion is not what is best for your
    game, it’s important to at least consider the suggestion. Even if you don’t take
    the suggestion, you’ll be forced to think about your game on a deeper level and
    understand more about what your game is and what you find is important. By using
    other people to test your game, questions will come up that you may never have
    even considered. There is no such thing as a bad question in game design.


    ## KNOWING WHAT TO LOOK FOR


    After your play testers have finished playing the game, try asking them questions
    about the game to determine what worked and what didn’t work. Right now, you’re
    testing the mechanics and basics of your game, so the questions you should be
    asking in this chapter are radically different than ones you may ask later on
    in the development cycle.


    Here are some examples of what to ask at this stage:


    * **What was the goal of the game?** Although this may seem like an obvious question
    to you, it might not have been as obvious to the players. Ask if they were able
    to easily determine what they had to do in the game. If necessary, see if there
    is anything you could do to make the objectives clearer.

    * **Did you experience any bugs or glitches within the game?** If so, what were
    they? You probably have an idea of what most of the bugs in your game are at this
    point, if you noticed any at all. The game is still in its early stages so the
    bugs should be at a minimum at this point, but you never know if some of the pickup
    items aren’t working or if a platform may not act the way it should. Playing the
    game can indicate some early bugs that are easily fixed.

    * **What were the controls?** This question seems obvious, but you never know
    what players may have struggled with early on. Sometimes players may not even
    know the controls to get through a game or level. I’ve played games before where
    I didn’t know about a game mechanic until I was a few levels in because there
    was nothing in the game to indicate its existence. If players miss a key control
    or even just the Sprint button, it can negatively effect their gameplay experience.

    * **Did you find the controls easy to learn? Why or why not?** This question goes
    into how long it them them learn the controls. Keep in mind that you may know
    the controls off the bat, but what may seem obvious to you can be difficult to
    figure out for someone picking up the game for the first time. Ask how hard it
    was for the player to figure out the controls. Also, ask what you could do to
    make the process easier. The sooner players don’t have to think about controls,
    the more fun they’ll have playing the game.

