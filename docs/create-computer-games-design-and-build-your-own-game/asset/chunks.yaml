- fmt: '

    Before you begin to create your characters for your game, you need to think about
    the theme and style discussed in [Chapter 1](#04_9781119404187-ch01.xhtml). Think
    about how different a game would be if instead of a plumber hopping on mushrooms,
    it was an alien hopping on astronauts. The mechanics and goals may be the same,
    but the different theme and style change the feel of the game. The mechanics are
    the most important part of any game, but the theme is what introduces players
    to the world and pushes them to actually play the game.


    Theme helps give your game a story and a purpose. The mechanics may have an objective,
    but the theme gives a player a goal. You aren’t just getting to the end of a level
    — you’re defeating a dragon. When you make your game, you have to consider what
    you want your players to feel when they play it.


    ## THEME: THE LANGUAGE OF YOUR GAME


    The theme of the game is the story. Who your characters *are* matters just as
    much as what they’re doing. Before you build your characters, ask yourself who
    the player is. A blue hedgehog who runs while fighting an evil egg-shaped professor
    with his super speed may seem like an absurd concept, but it has persisted for
    more than 25 years because the theme is memorable. Would Sonic have been as successful
    if he were anything other than a hedgehog? The theme of the game is usually the
    first thing people think about when they think of the game.


    Mortal Kombat and Street Fighter are essentially the same type of game but for
    different audiences, especially when the games first came out and their controls
    were similar. The difference is how the games are portrayed. Street Fighter has
    extremely stylized characters with large muscles or petite forms fighting with
    large movements. Mortal Kombat goes for a more “realistic” and gruesome approach.
    Both games are about fighting, but they have very different themes.


    ## STYLE: THE ACCENT OF YOUR GAME


    When you think of your game, you probably consider the mechanics or characters
    in the game. You may think of the theme of the game or the story, but one thing
    that some early developers overlook is the style of the game. Style is how your
    game looks. A game with the same story and characters can vary in extreme ways
    in just style alone, and that also changes how people perceive and play the game.


    Games like `Call of Duty` or `Modern Warfare` take a more realistic approach,
    dulling the color palette and using more realistic proportions. On the other hand,
    `Overwatch` and `Team Fortress` go for a more animated and stylized approach,
    choosing bright colors and distinctive shapes to create their characters; large
    characters are larger than life, and small characters are tiny. Think about how
    these two approaches change how you perceive the game, as well as the audience
    that is attracted to the games.


    The best comparison to style in media is in animation. Animated movies are all
    stylized in some way to attract a certain feeling or audience. Disney movies and
    shows use softer, more polished shapes with crisp lines that separate them from
    the background. This approach emphasizes the feeling of control and polish that
    Disney is known for in its films. Disney movies and shows are all put together
    with thought and care, and aim for a family audience.


    Cartoon Network, on the other hand, uses a much more robust color palette and
    has less polished lines. Its shows aim to bring life to every part of the scene,
    even causing some of the characters to bleed into the background. The shows on
    Cartoon Network appear to swap polish for passion. Each line feels alive in the
    show, even if the line is dirty itself.


    Tim Burton’s films are all stylized to have a very dull color palette with splashes
    of crisp color and elongated shapes. His movies are distorted and gothic to engross
    audiences in his vision of the world.


    Sony Animation tries to build expressive characters and focuses on 3D characters
    that feel like they could be 2D characters. Characters move in ways that are larger
    than life and more expressive than normal humans.


    You’ll learn more about animation and what goes into bringing the characters to
    life in [Chapter 10](#13_9781119404187-ch10.xhtml), but for now just keep in mind
    that style changes the story even if the plot and characters don’t change at all.
    None of the styles I just described is bad, but they do change the way you think
    of the films that the styles are used in. Imagine if Tim Burton did a film about
    an overprotective vampire trying to care for his daughter, or if Cartoon Network
    did a show about a talking duck and his three nephews traveling the world on adventures
    in search of riches.


    ## CREATING YOUR FIRST CHARACTER


    For the game you’re working on in this book, the theme and style have been premade
    to maximize how much you’ll be able to do and learn. The game is about a simple
    box person who is trying to escape from a robot dystopian society. The characters
    themselves are very cartoony in their style and will have big eyes as their key
    feature. This style is easy to model and animate, so you’ll be able to easily
    build and animate your game with limited modeling and animation experience.


    The main character is a blue box with two round eyes. To start making the character,
    open a new file in `Blender`. The cube that you have when you open `Blender` is
    a good place to start because it’s the exact size and proportions that you’ll
    need for your character.


    ### CREATING THE EYES


    After you open `Blender` and have a cube on the grid (see [Figure 9-1](#12_9781119404187-ch09.xhtml_c09-fig-0001)),
    it’s time to make the eyes for the character. The character’s eyes are just simple
    spheres that will be in the cube. To create the eyes, follow these steps:


    1. Click the `Create` tab.

    2. Scroll down to the `Sphere`, and rotate it `90` degrees on the `y`-axis.

    3. Scale the eye down to be smaller than the cube.

    4. Place the eyeball in the cube so it’s sticking out.

    5. With the eye still selected, press `Shift + D`.

    6. This will duplicate the eye so that there are two of them.

    7. Move the other eye to the other half of the cube so that the character has
    two eyes (see [Figure 9-2](#12_9781119404187-ch09.xhtml_c09-fig-0002)).


    ### PARENTING THE EYES TO THE BODY


    After you finish the eyes, there is still a problem in the character. The eyes
    don’t move with the body when you move the body. Most people have no desire to
    leave their eyes behind when they start walking, so the best way to solve this
    is to parent the eyes to the cube. To do this, go to your outliner and find the
    cube and spheres.


    To parent the spheres to the cube, simply drag the spheres to the cube. When you
    do so, a little text box will pop up and say `Drop to Set Parent`. When you see
    that text box, drop the spheres and they’ll be parented to the object (see [Figure
    9-3](#12_9781119404187-ch09.xhtml_c09-fig-0003)).


    ### CREATING A MATERIAL FOR THE CHARACTER


    After you make the eyes, it’s time to add some color to your characters. You can
    do this in both `Unity` and `Blender`, but `Blender` gives you a few more options
    when you’re making the materials for your characters.


    First, make sure that you select the object you want to assign this material to.
    You’ll be able to use the same materials for different objects later, but for
    now you need to create a new material because this is the first material you’ll
    be making in the game.


    To create a new material, follow these steps:

