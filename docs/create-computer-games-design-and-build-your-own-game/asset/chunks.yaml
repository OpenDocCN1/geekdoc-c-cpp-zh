  raw: 'You use Blender to create the assets for your videogame because you can create
    complex shapes within Blender. You can alter the shape of your objects by switching
    to Edit Mode (see [Figure 8-10](#11_9781119404187-ch08.xhtml_c08-fig-0010)). You
    can switch to Edit Mode in two ways.


    ![image](images/9781119404187-fg0810.png)


    [FIGURE 8-10:](#11_9781119404187-ch08.xhtml_rc08-fig-0010) Edit Mode.


    The first way to switch to Edit Mode is to go down above the Timeline where it
    says Object Mode and select from the Edit Mode drop-down menu.


    The other way to get to Edit Mode is by pressing the Tab key on your keyboard.
    This will switch to Edit Mode from whatever mode you’re in. If you’re already
    in Edit Mode, pressing Tab will switch your mode back to the last mode you were
    in before Edit Mode.


    There are several other modes that Blender has that you won’t be using but should
    know about:


    *   **Object Mode:** Allows you to move objects around and animate your character.


    *   **Sculpt Mode:** Gives you the ability to sculpt the shape of the object as
    if it were like clay. (It requires many vertices to use.)


    *   **Weight Paint:** Helps you rig your characters to a skeletal structure. This
    is useful for creating characters that move and emote.


    *   **Texture Paint:** Paints textures onto the object.


    *   **Vertex Paint:** Similar to Texture Paint but paints the vertices directly.


    ### VERTICES, EDGES, AND FACES


    When you enter Edit Mode, you’re changing the *mesh* (shape) of the object. There
    are three parts that make up a mesh: the vertices, the edges, and the faces. You
    can change the mesh by altering the position, rotation, size, or number of vertices,
    edges, or faces. Next to where you found the transformation tools, you’ll see
    three new orange buttons:


    *   **Vertex Select tool:** The small orange dot at the edge of a cube button
    is the Vertex Select tool. *Vertices* (shown in [Figure 8-11](#11_9781119404187-ch08.xhtml_c08-fig-0011))
    are the points of any object. They mark the points on the object where an edge
    ends. Vertices are the smallest part of an object.


    *   **Edge Select tool:** The orange line on the cube button is the Edge Select
    tool. Edges (shown in [Figure 8-12](#11_9781119404187-ch08.xhtml_c08-fig-0012))
    are the lines between two vertices. They mark the lines on the object and are
    used to make up a face.


    *   **Face Select tool:** The orange square on the front of the cube button is
    the Face Select tool. Faces (shown in [Figure 8-13](#11_9781119404187-ch08.xhtml_c08-fig-0013))
    are made up of at *least* three edges and make up the visual part of an object.
    Whenever you see an object, you’re seeing the faces of the object as they wrap
    around to make the mesh.


    ![image](images/9781119404187-fg0811.png)


    [FIGURE 8-11:](#11_9781119404187-ch08.xhtml_rc08-fig-0011) Vertices.


    ![image](images/9781119404187-fg0812.png)


    [FIGURE 8-12:](#11_9781119404187-ch08.xhtml_rc08-fig-0012) Edges.


    ![image](images/9781119404187-fg0813.png)


    [FIGURE 8-13:](#11_9781119404187-ch08.xhtml_rc08-fig-0013) Faces.


    ### EDITING TOOLS


    There are a ton of different options when it comes to the tools you can use to
    edit your object. On the Tools tab, you have at the least 34 different tools you
    can use to change your object, and that’s not counting the different variations
    some of the tools offer. For now, you only need to really know four of these tools:


    *   **Loop-Cut Slide (Ctrl+R):** The Loop-Cut Slide tool (shown in [Figure 8-14](#11_9781119404187-ch08.xhtml_c08-fig-0014))
    creates a new edge that wraps around the object. This creates new edges and vertices
    that can be edited and cuts the faces in two. When you use the Loop-Cut Slide
    tool, select one of the edges that you want your line to go around. It will appear
    as a pink line wrapping around the edge. When you have the edge you want, left-click
    it. This will change the line to a yellow line, but it hasn’t been placed yet.
    After you clicked the first time, the line can now be adjusted along the edge
    selected. When the new edge is where you want it to be, simply left-click again
    to place the edge loop.


    *   **Extrude (E):** The Extrude tool (shown in [Figure 8-15](#11_9781119404187-ch08.xhtml_c08-fig-0015))
    helps you build out from a face or edge (vertices, too, but these don’t work as
    well). The Extrude tool expands the selected face or edge out and creates new
    edges or faces to keep the face connected to the overall mesh. This tool allows
    you to build out and customize an object from the different faces or edges. When
    you use the Extrude tool, it will extrude the face toward or away from the mesh
    (you can extrude inward as well). Left clicking after you extrude will place the
    extrusion, which you can then adjust the size and position of.


    *   **Inset Face (I):** The Inset face tool (see [Figure 8-16](#11_9781119404187-ch08.xhtml_c08-fig-0016))
    creates a face within the selected face(s). This face will shrink in from the
    edges and have edges connecting its vertices to the vertices of the face that’s
    being inset. This tool can be used to create smaller faces within the different
    faces to create objects such as staircases or windows. When you use the Inset
    Face tool, be sure not to shrink the Face tool too much to cross the vertices.
    The tool should create quads along its edges. Left-click to confirm the inset
    face.


    *   **Insert Face (F):** The Insert Face tool creates a face in between two edges
    if no face exists. As an example of this, delete one of the faces on your mesh.
    Select the face and press X. When you’re asked if you want to delete the face,
    confirm that you do. Now switch to Edge Select Mode and select two edges that
    are opposite of each other (hold Shift to select multiple edges or faces at once).
    Click the Insert Face tool, and a new face will appear in its place. Connect to
    both edges as well as any other edges connected to those vertices. This can be
    useful because the inside of the face doesn’t render properly. Only the exterior
    of a face renders properly so to create doorways, you’ll have to create and combine
    faces.


    *   **Creating your own:** After you test out the different tools discussed here,
    switch back to Object Mode and delete the object by pressing X. Go to the Create
    tab and create a new object and place it on the grid. Use the Inset Face, Extrude,
    Loop-Cut Slide, and Insert Face tool to create your own object — a fancy water
    fountain, an Aztec temple (see [Figure 8-17](#11_9781119404187-ch08.xhtml_c08-fig-0017)),
    or something else of your own creation. In [Chapter 9](#12_9781119404187-ch09.xhtml),
    you’ll create assets for the game, but before you do so, make sure that you have
    a firm grasp on how Blender works by creating some objects of your own.


    ![image](images/9781119404187-fg0814.png)


    [FIGURE 8-14:](#11_9781119404187-ch08.xhtml_rc08-fig-0014) Loop-Cut Slide tool.


    ![image](images/9781119404187-fg0815.png)


    [FIGURE 8-15:](#11_9781119404187-ch08.xhtml_rc08-fig-0015) The Extrude tool.


    ![image](images/9781119404187-fg0816.png)


    [FIGURE 8-16:](#11_9781119404187-ch08.xhtml_rc08-fig-0016) The Inset Face tool.


    ![image](images/9781119404187-fg0817.png)


    [FIGURE 8-17:](#11_9781119404187-ch08.xhtml_rc08-fig-0017) The Aztec Temple.


    ![image](images/c9.png)


    You’ve designed your first level and played around with Blender. In this chapter,
    you’ll learn how to bring your game to life. Up until this point in the book,
    you’ve been seeing how to make your game playable and how to create your basic
    game mechanics and code. You’ve created the skeleton and muscle of your game.
    Now it’s time to give it its skin.


    In this chapter, you’ll learn how to not only design and create your characters,
    but also add a material to your characters within Blender. I explain how parenting
    works so you can link the different parts of your character together. Finally,
    you learn how and where you should save your project to utilize Unity and Blender
    to their fullest.


    ## THINKING ABOUT THEME AND STYLE'
