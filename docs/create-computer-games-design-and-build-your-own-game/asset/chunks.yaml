  trans: "\n在本章中，你最后应该创建的是用来替代拾取物品的硬币。完成后，硬币将缓慢旋转并上下跳动，但目前它们只会保持静止。首先，创建一个新文件并将其命名为\
    \ `Coins.blend`。删除中心的立方体，以及灯光和摄像。硬币是一个很好的拾取目标。我们已经将硬币与财富和（象征意义上的）想要的东西联系在一起，因此图\
    \ 9-23 中显示的硬币是一个极好的拾取物品。\n\n![image](img/9781119404187-fg0923.png) 图 9-23： 硬币底部。按照以下步骤操作：\n\
    \n1. 创建一个 `cylinder`（圆柱）。\n2. 将该 `cylinder` 在 `y-axis`（y 轴）上旋转 90 度。\n3. 调整硬币形状，使其变薄变小。\n\
    4. 选择正面和反面。\n5. 对这些面进行内插（Inset）。\n6. 对这些面进行挤出（Extrude）并调整尺寸。\n\n现在，为了给硬币一些个性，你想在硬币中间添加一个孔来表示它的价值。在这种情况下，一个就足够了。这将需要使用\
    \ `Boolean`（布尔）修改器。布尔运算是将两个不同对象组合的方法，通过统一它们、取它们的交集部分或从一个对象中减去另一个。按照以下步骤操作：\n\n\
    1. 创建一个新的 `cube`（立方体）。\n2. 调整 `cube` 的尺寸，使其高而细，看起来像硬的。\n3. 扩大它的尺寸使其穿过硬币（参见图 9-24）。\n\
    4. 选择硬币。\n5. 进入 `Properties`（属性）窗口中的 `Modifier`（修改器）标签页。\n6. 从 `Add Modifier`\
    \ 下拉菜单中选择 `Boolean`。有不同的 `Boolean` 操作供选择：\n    - `Intersect`（交集）：仅保留彼此接触的网格部分。\n\
    \    - `Union`（并集）：合并两个对象。\n    - `Difference`（差集）：从一个对象中减去另一个。\n7. 将操作改为 `Difference`，如图\
    \ 9-25 所示。\n8. 将 `Solve` 改为 `Carve`（雕刻）。\n9. 在 `Object` 下，点击空槽并选择 `Cube`。\n10.\
    \ 按 `Apply`（应用）并删除 `cube`。\n\n![image](img/9781119404187-fg0924.png) 图 9-24： 相交的部分。\n\
    \n![image](img/9781119404187-fg0925.png) 图 9-25： `Boolean` 修改器。\n\n现在硬币上有一个孔，这使其在关卡中脱颖出的另一个理由。完成硬币制作后，是时候改变硬币的颜色了。像之前一样，为对象创建一个新的\
    \ `material`（材质）并对其使其既有反射性又有色彩（参见图 9-26）。\n\n![image](img/9781119404187-fg0926.png)\
    \ 图 9-26： 挖出的孔。\n\n在你完成硬币的基础模型和颜色后（如图 9-27 中所示），尝试对硬币或创建的任何其他对象进行更改，以便你可以称其为自己的。在硬币的案例中，我圆化了边缘并使其略微透明，以配合整个机器人主题，使其看起来更像是一个角色拾取的全息图。\n\
    \n![image](img/9781119404187-fg0927.png) 图 9-27： 完成的硬币。\n\n## 定制你自己的内容\n\n在你完成本章中讨论的一些对象的制作和定制后，尝试通过添加标志牌、不同的角色或建筑来为你的关卡增加更多定制。资产创建就是创建你可能需要的任何资产。本书仅涉及了构成你游戏的基础资产，包括主角以及一些敌人和环境危险。你可以建模的对象的其他想法还有邮箱箱、垃圾桶、树、标志柱和路灯柱。\n\
    \n资产创建是你真正可以让你的游戏独一无二的地方！所以，思考你可以添加什么来为你的游戏带来更多活力。在设计自己的游戏时，在开始之前列一份资产清单。这样，当该构建你自己的资产时，你就清楚需要制作什么和做什么了。\n\
    \n![image](img/c10.png)\n\n在本章中，你将学习动画的基础知识。在第 9 章中，你创建了场景中的模型。现在是时候给它们注入生命了。你将学习一些动画术语，如\
    \ `squash`（挤压）、`stretch`（拉伸）和 `anticipation`（预期）。\n\n## 动画定义\n\n动画是生命的幻觉。它欺骗观众或玩家相信某物是活的，尽管它只是快速移动的画面。动画已经存在了一个一个多世纪了。随着时间的推移，它变得越来越精美漂亮。许多成功的电影和电视节目都是使用动画制作的。一些现代真人电影利用动画来增强它们讲述故事的能力。\n\
    \n最重要的是，游戏行业的发展得益于技术的进步。如果没有动画，我们今天所知的游戏将是不可能的。今天，通过 3D 动画软件的使用，游戏可以创造出宏大的故事并捕捉人们的想象。动画在推动游戏开发领域发挥了巨大作用。现在游戏设计是动画最好的领域之一。这两种媒体——游戏和动画——相互关联，并向令人兴奋的方向互相推动。\n\
    \n## 学习动画\n\n动画最重要的事情就是观察。即使你只是为游戏创建动画，在制作之前，你也必须对周围的世界进行大量的学习和理解。\n\n如果不了解生命是如何运作的，你如何模拟生命？如果你不愿意观察现实世界中的生命状态，你又如何为游戏世界注入生命呢？\n\
    \n在街机游戏时代由于处理能力有限，每个精灵都有自己的素材，因此动画师必须找到通变方法。即使在今天，他们使用的一些技术（如运动模糊）仍被用于现代游戏，以便在不改变角色实际移动速度的情况下，让拳击和踢看起来更有力。\n"
- fmt: '

    Understanding the mechanical motion of a person walking is important in animation,
    but the most important thing for any animator to understand, in any medium, is
    that the feeling behind the motion is actually far more important to animating
    than the motion itself. There have been many motion-capture games and films over
    the years, some of them far better than others. But the problem that many motion-capture
    studios face is that the animation recorded with the motion capture often feels
    stiff and unnatural, despite being literally recorded from life. This is due to
    a concept called the uncanny valley.


    The `uncanny valley` is the feeling you get when you watch or see something that
    is very close to being lifelike or human, but something feels just a slight bit
    off. I liken it to coming home to your house and finding that something — you’re
    not sure what is — is just a slight bit too far to the left of where it was earlier.
    It fills you with a sense of unease. In animation, it makes you see the animation
    as stiff or robotic. The motion just feels wrong.


    Humans have a very keen ability to recognize other humans. We understand universal
    body language because we can see the small details in a person’s movement. We
    can always tell when something is human and when something isn’t, and that’s why
    extremely realistic characters don’t hit the same level of attachment as some
    of the more stylized characters do. The uncanny valley occurs only when something
    looks close to human but isn’t perfect. The less human something looks, the more
    at ease we are with them, but when something passes through the uncanny valley,
    we’re able to relieve that uneasiness.


    One of the best examples of this is the character Wall-E from the movie by the
    same name. Despite Wall-E and Eve clearly being machines with limited expressions,
    the audience was able to relate to the character because, instead of animating
    the characters to be as human as possible, the directors animated what the character
    was `feeling` not what the character was doing.


    ### ANIMATING A FEELING


    As a human, you know when something feels off. The best way to counteract this
    feeling is by animating the character so that the character looks how it feels.
    All the emotions should feel very different even though multiple emotions can
    be expressed in similar ways. Anger and sadness may look similar in real life,
    but if you don’t push the character’s expressiveness, these characters will never
    capture the minds of the players.


    Here’s a summary of some common feelings you may want to animate:


    * **Happiness:** Happiness is a very light emotion. You feel like you weigh nothing.
    You may even have a skip to your step. Characters who are happy often stand up
    tall and move at a much brisker pace. Think of happiness like a freshly blown-up
    balloon. It’s larger than life, and yet still feels very light.


    * **Sadness:** Sadness is the exact opposite of happiness. When you’re sad, you
    feel like the weight of the world is pulling you down. Each step or movement is
    strained and heavy. Sadness is a heavy and slow emotion. Characters who are sad
    might move more slowly and have their heads down.


    * **Anger:** Anger is a large emotion, too. Everything feels tighter when you’re
    angry. It feels as if the world is crashing down and you’re just pushing back.
    Anger is a very large but precise emotion. It’s driven.


    * **Fear:** Fear is possibly the oddest of the emotions. When you’re afraid, everything
    just feels bigger than you are. You feel small. You may move slowly in one moment,
    but run away in another. Fear is a frantic emotion, with very quick changes.


    When you animate your characters, you have to consider not just what the character
    is doing but what the character feels like he’s doing. The human eye has been
    trained to recognize natural movement. No matter how hard you try, you’ll never
    be able to animate something that looks 100 percent like a human. This is why
    it’s important to focus on how motion `feels`.


    ### USING THE SQUASH-AND-STRETCH TECHNIQUE


    Imagine slapping your hand against a hard surface. It feels like your hand is
    expanding out and snapping back into shape all at once when it makes contact.
    In reality, the skin on the hand may expand out a little and snap back into place,
    but it’s barely visible — not nearly to the extent that it feels like when it
    happens. When you animate a scene, you want that feeling to come across more,
    so you exaggerate the motions to match the feeling rather than the actual motion.
    In animation terms, this technique is called `squash and stretch`.


    A technique pioneered by Ub Iwerks and Walt Disney, squash and stretch gives weight
    and feeling to the characters. Before squash and stretch, animators never really
    paid attention to consistency. Characters would stretch their limbs out as needed,
    because they could, but this gave the impression that the shape and volume of
    the characters weren’t consistent. It never gave the right feeling of a character
    actually existing in a real environment. Squash and stretch aims to keep the volume
    and shape of the object consistent even when the object expands or distorts it
    in extreme ways.


    `squash` is when a character slams against something. The body becomes wider and
    shorter to emphasize the impact. Think of a ball hitting the ground or your hand
    slapping a hard surface. To help reinforce the impact, the animator squishes the
    character down as if it were a balloon and something is pushing down on it. Because
    the character is expanding out, you also have to make the character shorter to
    keep the volume of the character consistent.


    `stretch` is the opposite of squash. Think about a ball or car moving really fast
    or someone swinging a baseball bat. Stretch elongates the object, making it thinner
    and giving the object the feeling of movement. Think of stretch as a kind of lag.
    One part of the object is moving, but part of it is still trying to catch up,
    so stretching occurs. In real life, objects are solid, so they don’t distort —
    but it feels like they `should distort`. When something moves fast, it feels like
    it `should stretching`,


    One of the best ways to practice squash and stretch is to do a bouncing-ball animation.
    Rubber balls already distort slightly when they hit the ground, but in animation
    you need to exaggerate that motion. Follow these steps:


    1. On a pad of sticky notes, draw a circle at the top of the last note in the
    pad.

    2. Note by note, draw the ball slowly going down.

    3. Stretch out the ball in the middle so that it looks more like an oval going
    toward the ground.

    4. When the ball touches the ground, keep the bottom of the ball touching the
    bottom of sticky note.

    5. Slowly expand the ball out into a horizontal oval shape.

    6. When the ball is a horizontal oval, begin snapping it back to a circle, and
    just before it’s a circle begin to bring the ball up again.

    7. Stretch out the ball as it goes up.

    8. Slowly have the ball snap back into a circle and then stop.


    The total animation should only be about ten frames, but the result will be a
    simple animation of a ball hitting the ground and bouncing back up, giving you
    a perfect example of squash and stretch in motion.


    ### BUILDING ANTICIPATION


    In animation, every motion needs to be exaggerated. That goes for the lead-up
    into a motion as well. `Anticipation` is the pre-action to a motion. When you
    jump, you first have to bend down. When you punch someone, you pull your fist
    back slightly. In animation, these anticipation moments help give the character
    a sense of realism.

