- fmt: '

    2. **Set the scale of the cube to (X=8, Y=2, Z=6).**


    This creates the bottom step of the three-step staircase. If you want a longer
    staircase, increase the `Z` scale.


    3. **Set the name of the cube to “Stairs.”**


    4. **Create a new cube, and reset its position and rotation.**


    5. **Set the scale to (X=8, Y=2, Z=4).**


    This stair step has to be a little shorter than the previous one because there
    has to be a gradual progression.


    6. **Change the position of this cube to (X=0, Y=2, Z=1).**


    7. **Rename the cube to “Step 2” using the `Inspector`.**


    8. **Create a third cube, and reset its position and rotation.**


    9. **Set the scale to (X=8, Y=2, Z=2).**


    10. **Change the position of this cube to (X=0, Y=4, Z=2).**


    11. **Rename the cube to “Step 3” using the `Inspector`.**


    See [Figure 3-6](#06_9781119404187-ch03.xhtml_c03-fig-0006) for an example of
    what you should have.


    12. **Using the hierarchy menu drag `Step 3` into `Step 2` to create a `Parent`.
    Then drag `Step 2` into `Stairs` to parent both `Step 2` and `Step 3` to `Stairs`.**


    Parents control children (at least in games!). When an object is parented to something,
    it means that the object is affected by the rotation, translation, and scale of
    that object. When the parent is changed, so is the child, but the child’s personal
    scale, rotation, and translation remains unaffected, which will be important when
    we bring animated objects into the game in [Chapter 12](#15_9781119404187-ch12.xhtml).


    13. **Drag `Stairs` from the `Hierarchy` menu into the previously created `Prefabs`
    folder (see [Chapter 2](#05_9781119404187-ch02.xhtml)) to create a `Stairs` prefab
    that will actually change not only `Stairs` but also the objects parented to the
    `Stairs`.**


    ![image](images/9781119404187-fg0306.png)


    [FIGURE 3-6:](#06_9781119404187-ch03.xhtml_rc03-fig-0006) Stairs.


    After you create your stairs prefab, you’ll notice when you select it that in
    the `Inspector` there is now a `Prefab` section near the top. Next to “Prefab,”
    there are three buttons:


    * **Select:** Selects the `Prefab` in the `Project` window

    * **Revert:** Undoes any changes you made to your prefab back to the standard
    prefab settings

    * **Apply:** Changes *all* of the objects that go off that prefab to match the
    one you’ve selected


    To test this out, follow these steps:


    1. **Drag out a second and third staircase onto the `Scene` window.**

    2. **Create a new material using the `Create` drop-down in the `Project` window
    and choose `Material`.**

    3. **Change the color of the material.**

    4. **Drag that new material to one of the staircases.**

    5. **Select the staircase and click Apply.**


    All your objects that go off of that prefab will now change to match this color.


    Now delete the staircase. You don’t need to worry about having to do it again.
    After you create a prefab of the object, Unity will automatically have a copy
    of the prefab to refer to. So now whenever you need stairs, you’ll be able to
    simply drag and drop the stairs into the scene.


    The next prefabs that you should create are


    * **A wall:** The walls should be tall enough that your character has to jump
    over them and wide enough to prevent players from simply walking around them.
    For the purposes of the game in this book the `X`-scale should be 30, because
    that will be how wide our level will be. The wall measurements should be (X=30,
    Y=2, Z=2).

    * **A stand-in for the moving platforms:** As a stand-in for moving platforms,
    you’ll create planks that will go across the long gaps between some sections of
    the level. These planks should be much thinner than the walls or stairs and should
    be easy to climb on. They also need to be long across the `Z`-axis to reach across.
    Using [Figure 3-2](#06_9781119404187-ch03.xhtml_c03-fig-0002), you can determine
    that one of these planks need to be at least 31 long. The plank measurements should
    be (X=4, Y=0.5, Z=31).

    * **Stand-ins for the enemy characters and spikes:** The enemy character stand-ins
    can just be still moving cubes for now, located at the center point of where the
    enemy characters will be moving in. You’ll be animating their movement in `Blender`,
    so you only need a still stand-in for the purposes of building the level and to
    test the death mechanics with. The enemy stand-in measurements should be (X=2,
    Y=2, Z=2).


    The spikes will also be made in `Blender`, so you only need a still stand-in for
    the purposes of building the level and to test the death mechanics with.


    ### BUILDING YOUR LEVEL

    Now that you have the prefabs, start building the level.

