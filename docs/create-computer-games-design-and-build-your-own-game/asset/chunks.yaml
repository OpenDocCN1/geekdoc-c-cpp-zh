    \n*   **Pictures:** Render layer settings. The render layers show what layers\
    \ in the animation are visible when rendered. It is possible to layer your animation\
    \ like a Photoshop file or collage and make different layers visible at any moment.\n\
    \n*   **Light, Sphere, and Cylinder:** The scene settings. In the scene settings,\
