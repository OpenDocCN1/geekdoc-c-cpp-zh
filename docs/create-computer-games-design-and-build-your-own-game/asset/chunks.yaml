    理解人类行走的机械运动在动画中非常重要，但对于任何媒介的任何动画师来说，最重要的一点是：运动背后的感觉实际上比运动本身要重要得多。多年年来出现了许多动捕游戏和电影，其中一些表现远好于其他作品。但许多动捕工作室面临的问题是，尽管通过动捕记录的动画往往显得僵硬且不自然，尽管它们是真实从生活中记录的。这是由于一个被称为“恐怖谷”的概念。


    `uncanny valley` 是当你观察或看到某些非常接近真人或人类的东西时，但某些地方感觉稍微不对劲时的那种感觉。我把它比作回到家里，发现某样东西——你不确定是什么——只是比之前的位置向左偏了那么一点点。这会让你产生一种不安感。在动画中，这会让你觉得动画很僵硬或像机器人。那种动作感觉就是不对。


    人类具有非常敏锐的识别其他人类的能力。我们理解通用的肢体语言，因为我们可以看到人动作中的细微细节。我们总能判断出什么是人类，什么不是人类，这就是为什么极其写实的角色不会像一些更风格化的角色那样引起同样的情感共鸣。恐怖谷只在某个东西看起来像人但不完美时才会发生。东西看起来越不像人，我们对它们就越放松；但当某个东西穿过恐怖谷时，我们就能消除那种不安感。


    最好的例子之一就是同名电影中的角色瓦力瓦（Wall-E）。尽管瓦力瓦和伊娃显然是表情有限的机器，但观众能够对角色产生共鸣，因为导演并没有把角色做得尽可能像人，而是动画化了角色的`feeling`，而不是角色在做什么。


    ### 动画化情感


    作为人类，你知道什么时候感觉不对劲。反击这种感觉最好的方法是动画化角色，让角色看起来像它的感受那样样。尽管可以用相似的方式表达多种情感，但所有的情感都应该感觉非常不同。愤怒和悲伤在现实生活中可能看起来相似，但如果你不推向角色的表现力，这些角色永远无法捕获玩家的心。


    这里是一些你可能想要动画化的常见情感的总结：


    *   **快乐：** 快乐是一种非常轻的情绪。你感觉自己轻得没有重量。你甚至走路时会轻快。快乐的角色通常站得笔直，移动速度快得多。把快乐想象成一个刚吹起来的气球。它比生命大，但仍然感觉非常轻。


    *   **悲伤：** 悲伤是快乐的对面。当你难过时，你感觉世界的重量在拉着你。每一步或移动都是费力且沉重的。悲伤是一种沉重而缓慢的情绪。悲伤的角色可能会移动更慢，低着头。


    *   **愤怒：** 愤怒也是一种巨大的情绪。当你愤怒时，一切都感觉更紧绷。感觉就像世界正在崩塌，而你只是在推回。愤怒是一种非常巨大但精确的情绪。它是受驱动的。


    *   **恐惧：** 恐惧可能是情绪中最奇异的。当你害怕时，一切感觉都比你大。你觉得自己很小。你可能一刻移动得很慢，另一一刻又逃跑。恐惧是一种恐慌的情绪，变化非常快。


    当你动画化角色时，不仅要考虑角色在做什么，还要考虑角色感觉自己正在做什么。人类的眼睛经过训练可以识别自然的运动。无论你如何努力，你永远无法动画化出看起来 100%
    像人类的东西。这就是为什么关注运动的`feels`非常重要。


    ### 使用挤压与拉伸技术


    想象用你的手拍在硬表面上。当接触时，感觉就像你的手在同时扩张并瞬间弹回形状。在现实中，手上的皮肤可能会稍微扩张并弹回原位，但这几乎不可见——远没有达到发生时的那种感觉程度。当你动画化一个场景时，你希望那种感觉传达得更多，所以你夸张动作来匹配感觉而不是实际动作。在动画术语中，这种技术被称为`squash
    and stretch`（挤压与拉伸）。


    这种技术由 Ub Iwerks 和华特·迪士尼（Walt Disney）开创，挤压与拉伸赋予了角色重量感和感觉。在挤压与拉伸出现之前，动画师从未真正关注过一致性。角色会根据需要伸展肢体，因为他们可以这样做，但这给人留下了角色形状和体积不一致的印象。它从未给出角色真实存在于现实环境中的正确感觉。挤压与拉伸的目标是在物体以极端方式扩张或扭曲时，也保持物体的体积和形状一致。


    `squash`（挤压）是当角色撞击某物时。身体变得更宽更短，以强调冲击。想象球落在地上或你的手拍在硬表面上。为了帮助强化冲击，动画师会压缩角色，就像它是一个气球且有东西在向下压它。由于角色正在向外扩张，你也必须让角色变短以保持角色的体积一致。


    `stretch`（拉伸）是挤压的对面。想象一个球或汽车快速移动，或者有人在挥动球棒。拉伸拉长物体，使其变薄，并赋予物体运动的感觉。把拉伸想象成一种延迟。物体的部分在移动，但另一部分仍在试图追赶，所以发生了拉伸。在现实生活中，物体是实心的，所以不会扭曲——但感觉它们`should
    distort`。当某物移动很快时，感觉它`should stretching`，


    练习挤压与拉伸最好的方法之一是画球动画。橡胶球在撞地面时已经会扭曲，但在动画中你需要夸张这种运动。遵循以下步骤：


    1.  在便利贴纸上，在最后一张顶部画一个圆。

    2.  一张一张地画出球缓慢下降的过程。

    3.  在中间拉伸球，使其看起来更像一个向向地的椭圆。

    4.  当球接触地面时，保持球的底部接触便利贴的底部。

    5.  缓慢将球扩张成水平椭圆形状。

    6.  当球是水平椭圆时，开始将其弹回圆形，在它变成圆形之前开始让球向上移动。

    7.  在球向上移动时拉伸它。

    8.  缓慢让球弹回圆形然后停止。


    整个动画应该只有大约十帧，但结果将是一个球落地并弹跳起来的简单动画，为你提供了运动中挤压与拉伸的完美示例。


    ### 建立预判


    在动画中，每个动作都需要夸张。这同样适用于动作前的铺戏。`Anticipation`（预判）是动作的前置动作。当你跳起时，你必须先下蹲。当你击某人时，你会向后收拳头。在动画中，这些预判瞬间有助于赋予角色真实感。


