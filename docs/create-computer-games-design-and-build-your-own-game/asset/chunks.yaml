- fmt: "\nAfter you finish building the base platforms of the level, it’s now time\
    \ to begin placing your prefabs throughout the level. Let’s start with the stairs.\
    \ Open your `Prefabs` folder and drag a staircase out.\n\nAt this point, you can\
    \ do a very similar thing to what you did earlier, but there’s actually another\
    \ way to place objects. By pressing `V` on your keyboard, you activate `Vertex\
    \ Snapping`, which will allow you to grab a `vertex` (corner) of a `GameObject`\
    \ and `snap` (place directly) to another object’s vertex. This can save you a\
    \ lot of time and headache when building out a level — especially when you need\
    \ to place a `GameObject` on a level that doesn’t have as precise measurements\
    \ as we’ve been working with.\n\nThe problem with `Vertex Snapping` is that it\
    \ only really works within Unity’s orthographic views.\n\nAnother shortcut that\
    \ can help you place objects on top of each other without having to do as much\
    \ math is the `Surface Snapping` tool. Press `Shift+Ctrl` (Windows) or `Shift+Command`\
    \ (Mac), and you’ll be able to move objects so that they’ll snap to the surfaces\
    \ of other objects, making it far easier to place things like stairs, monsters,\
    \ or planks.\n\nFirst, begin by using `Surface Snapping` to place the stairs on\
    \ the level. See [Figure 3-9](#06_9781119404187-ch03.xhtml_c03-fig-0009) for an\
    \ example of how it should look.\n\n![image](images/9781119404187-fg0309.png)\n\
    \n[FIGURE 3-9:](#06_9781119404187-ch03.xhtml_rc03-fig-0009) Level 1 with stairs.\n\
    \nYou’ll immediately notice that the stairs are too big for the middle section\
    \ in between the two upper platforms. Luckily, one of the great things about prefabs\
    \ is that you can alter one without altering all the others in the scene. Simply\
    \ delete the top step of the stairs and rotate and place it into the proper spot.\
    \ As long as you don’t hit the `Apply` button in the `Inspector`, this change\
    \ won’t affect the other prefabs in the scene.\n\nAfter you finish placing all\
    \ the stairs in the scene, you’ll begin placing the plank stand-ins for the moving\
    \ platforms. Because these will be acting as stand-ins until you can create moving\
    \ objects in `Blender`, you want them to still give a similar sense of challenge\
    \ that the moving platforms will when they’re added in. The best way to do this\
    \ is to place the planks across the gaps but at an angle, as in [Figure 3-10](#06_9781119404187-ch03.xhtml_c03-fig-0010).\
    \ When placing the planks, you’ll notice that they may not be big enough or may\
    \ be too big for the gap you created. As with the stairs, you can alter the shape\
    \ and size of these planks to better fit your needs without altering the rest\
    \ of the prefabs in the sequence.\n\n![image](images/9781119404187-fg0310.png)\n\
    \n[FIGURE 3-10:](#06_9781119404187-ch03.xhtml_rc03-fig-0010) The planks being\
    \ placed across the gaps.\n\nAt this stage, you want your game to be the bare\
    \ bones of what your eventual game will end up being. Do your best to capture\
    \ the overall feeling you’re aiming to go for in this game, even at this stage.\
    \ Creating the tension of walking across a narrow plank can give the same fear\
    \ of falling as jumping from a moving platform. Always think about how your player\
    \ may react to a situation. You can even make it so that the player actually has\
    \ to jump between two different planks to get to the other side just to add a\
    \ sense of tension because of height.\n\nGo further into your level and customize\
    \ it more to fit what you want it to be. Add more planks or obstacles that the\
    \ player has to overcome. Add more placeholders for when you make enemies to place\
    \ in [Chapters 9](#12_9781119404187-ch09.xhtml) through [12](#15_9781119404187-ch12.xhtml).\n\
    \nGame design is about making a game that you would want to play. When you’re\
    \ designing a level, ask yourself what would intrigue you and add it in.\n\nAfter\
    \ you finish your level, make sure that you aren’t missing anything or that there\
    \ aren’ gaps too big for the player. Make sure the game has a logical sense of\
    \ progression that will reward the player and not punish them. Adjust where necessary.\
    \ See [Figure 3-11](#06_9781119404187-ch03.xhtml_c03-fig-0011) as an example.\n\
    \n![image](images/9781119404187-fg0311.png)\n\n[FIGURE 3-11:](#06_9781119404187-ch03.xhtml_rc03-fig-0011)\
    \ The finished gray-box level.\n\n## GIVING YOUR LEVEL OBJECTIVE AND DIRECTION\n\
    \nObjectives are the lifeblood of a game. Without a clear objective, players don’t\
    \ know why they’re playing. When you’re designing your first level, you have to\
    \ decide what the goal of the level is. Is it to save the princess, to survive,\
    \ or to reach the end? Whatever it is, it must be clear.\n\nAfter you finish your\
    \ level, make sure that you aren’t missing anything or that there aren’t gaps\
    \ too big for the player. Make sure the game has a logical sense of progression\
    \ that will reward the player and not punish them. Adjust where necessary. \n\n\
    ## Making Objectives Stand Out\n\nThe pickup item doesn’t really stand out from\
    \ the background. So, how do you make the pickup item stand out from the rest\
    \ of the scene? There are multiple ways to do this: \n\n*   You can have the object\
    \ be moving slightly.\n*   You can put a light on the object so it glows when\
    \ you look toward it.\n*   You can make the object an unusual shape or size compared\
    \ to the things around it.\n*   You change the object’s color or hue so it stands\
    \ out from the background.\n\nFor this chapter, you’ll be following the last example.\
    \ You already placed all the objectives around the map, but the use of prefabs\
    \ prevents this from being a far more tedious task than it needs to be. Simply\
    \ create a new material and apply it to an object (see [Figure 3-13](#06_9781119404187-ch03.xhtml_c03-fig-0013)).\n"
