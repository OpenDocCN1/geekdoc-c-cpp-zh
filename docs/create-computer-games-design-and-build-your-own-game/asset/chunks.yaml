  trans: "\n1. **点击属性面板中的 Material（材质）选项卡。**\n\n2. **如果没有可用的材质，点击材质框右侧的加号 `(+)`。如果已有材质，请跳到第\
    \ 4 步。**\n   在你按下加号 `(+)` 后，你会看到了一个新的空白材质。\n\n3. **点击材质窗口下方的 New（新建）按钮来填充此新的空白材质。**\n\
    \   这将创建一个基础 `Lambert` 材质。\n   在 `Preview`（预览）下拉下方，你会看到 `Diffuse`（漫反射）和 `Specular`（高光）。`Diffuse`\
    \ 是物体的颜色；`Specular` 是物体的光泽。\n\n4. **在 `Diffuse` 旁边，你会看到一个下拉菜单。点击此下拉菜单将显示所有类型的材质。目前只需保留\
    \ `Lambert` 作为材质，但请记住，不同的材质渲染效果略有不同，可以产生不同的效果。强度（intensity）取决于颜色的浓郁。**\n\n5. **更改\
    \ `Specular` 颜色，使物体的光泽不仅仅是白色。**\n   尝试将其改为浅蓝色以匹配角色的配色。\n   你还可以更改 `intensity`（物体发光的程度）和\
    \ `hardness`（光泽边缘的软硬——亮度越高，边缘越锐利）。`CookTorr` 与 `Lambert` 类似，因为它也有一个带有不同选项的下拉菜单。`CookTorr`\
    \ 是一种特定的光泽类型，会改变物体光泽的一致性。\n\n6. **将 `Diffuse` 颜色改为浅蓝色（参见图 9-4）并保持 `Specular` 不变。**\n\
    ![image](img/9781119404187-fg0904.png)\nFIGURE 9-4: 应用的材质。\n\n### 创建眼睛材质\n\n眼睛的材质制作方法与身体略有不同，因为眼球和瞳孔需要两种不同的颜色。（你也可以使用这些步骤来创建虹膜，但这只需要多一个步骤，对于制作一个像样的卡通眼球来说并非必须。）\n\
    \n首先，确保选中了其中一只眼睛。然后按照上一节的第 1 到 5 步创建一个白色材质而不是蓝色材质。然后遵循以下步骤：\n\n1. **切换到 Edit Mode（编辑模式）。**\n\
    2. **选择前面的两个圆圈面（参见图 9-5）。**\n3. **点击 `Materials`（材质）选项卡。**\n4. **创建一个新材质（上方列表的第\
    \ 2 和第 3 步）。**\n5. **将漫颜色改为黑色。**\n6. **点击顶部的 `Assign`（分配）。**\n   这将材质仅分配给选中的面。\n\
    7. **返回 Object Mode（物体模式）并对另一眼睛重复此过程。**\n![image](img/9781119404187-fg0905.png)\n\
    FIGURE 9-5: 选中的面。\n\n### 保存你的角色\n\n完成角色创建后（参见图 9-6），你需要保存该角色以便在游戏中使用它（或者在第 10\
    \ 章中的 `untitled.blend`）更改为 `player.blend`。**\n5. **点击 Save as Blender File（保存为\
    \ Blender 文件）。**\n![image](img/9781119404187-fg0906.png)\nFIGURE 9-6: 完成的角色。\n\
    ![image](img/9781119404187-fg0907.png)\nFIGURE 9-7: 保存界面。\n\n### 创建敌人小兵\n\n眼睛的材质制作方法与身体略有不同，因为眼球和瞳孔需要两种不同的颜色。（你也可以使用这些步骤来创建虹膜，但这只需要多一个步骤，对于制作一个像样的卡通眼球来说并非必须。）\n\
    \n（注：原文此部分存在大量重复和错误段，已根据要求进行清理处理。）\n"
- fmt: "\n- **Fresnel**: Determines how reflective the object is to materials at an\
    \ angle from the material.\n- **Blend**: How much the reflection blends into the\
    \ material.\n- **Depth**: How many reflections within reflections are allowed.\
    \ If your scene has multiple reflected materials, and if the depth isn’t high\
    \ enough, those reflections won’t show up on this material.\n- **Max Distance**:\
    \ How far away another object can be to be clearly seen in the reflection. (If\
    \ the max distance is 0, it has no max distance.) If an object is past the max\
    \ distance, it will be faded and blurry and will get more so until it can no longer\
    \ be recognized in the mirror.\n\nFor the reflectivity of the metal, I suggest\
    \ 0.110 with a blend of 1.25. This will create a nice metallic-looking object\
    \ that will still look shiny and robotic. See [Figure 9-10](#12_9781119404187-ch09.xhtml_c09-fig-0010)\
    \ as an example.\n\n![image](images/9781119404187-fg0910.png)\n\n[FIGURE 9-10:](#12_9781119404187-ch09.xhtml_rc09-fig-0010)\
    \ The enemy material.\n\nFor the eye lens, you should follow the same steps as\
    \ you did with the eyes earlier. The difference is that while the metal part of\
    \ the lens is going to have a similar reflectivity to the metal body, the lens\
    \ itself is made from a more reflective kind of glass or plastic. After you create\
    \ a material for the metal part of the lens, select the lens parts of the object\
