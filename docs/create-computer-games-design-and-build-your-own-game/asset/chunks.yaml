  trans: "\n要访问光照设置，请选择 `Window` ⇒ `Lighting` ⇒ `Settings`（参见图 11-5）。会出现一个窗口，显示 Unity\
    \ 中提供的各种光照选项，但对于本项目，你只需要关注窗口的 Environment（环境）部分（参见图 11-6）。\n\n![image](img/9781119404187-fg1105.png)\n\
    \n图 11-5： 访问光照设置。\n\n![image](img/9781119404187-fg1106.png)\n\n图 11-6： 光照设置。\n\
    \n你可以在 Unity 的 Inspector（检器）窗口中控制光源，但光照设置窗口可以帮助控制场景光照的各种设置。环境设置可以帮助为场景光照上色，使场景更加生动，并赋予环境一种不同的感觉。\n\
    \n场景的红色调可以给游戏带来温暖的感觉，让物体看起来很热，或者仿佛游戏内正在日落。蓝色调给人一种更凉爽的感觉，让物体看起来更冷。颜色可以帮助指示游戏发生的时间或季节，帮助你更好地为玩家创造世界。自然地，这些设置是基于场景拥有的天空盒（skybox）——即游戏的背景的。\n\
    \n为了创建一个天空盒，你需要创建六张独立的图像来覆盖场景的底部、顶部、左侧、右侧、正面和背面。调整场景的光照和颜色同样有助于为玩家营造一种沉浸其中的良好氛围。请按照以下步骤操作：\n\
    \n1. **在 Source（源）下拉列表中，选择 `Gradient`（渐变）。**\n\n   以下是各种选项的描述，供你参考：\n\n   * **Skybox（天空盒）：**\
    \ 基于当前设置的天空盒背景颜色。在这种情况下，颜色是从浅蓝色变为灰色。\n   * **Gradient（渐变）：** 与 Skybox 类似，但你可以选择光线渐入的颜色。你可以选择三种颜色进行渐变淡入。\n\
    \   * **Sky Color（天空颜色）：** 顶部颜色，这种颜色从上方影响场景，仿佛光线直接照射在物体上。\n   * **Equator Color（赤道颜色）：**\
    \ 中间颜色，这种颜色对物体的影响就像光从物体的正面和侧面射来。\n   * **Ground Color（地面颜色）：** 从底部影响物体的颜色。\n \
    \  * **Color（颜色）：** 用特定的颜色一次性为场景上色。这对于快速设置光照非常有用。\n\n2. **将天空颜色更改为浅蓝色。**\n\n3.\
    \ **将赤道颜色更改为紫色。**\n\n4. **将地面颜色更改为绿色。**\n\n![image](img/9781119404187-fg1107.png)\n\
    \n图 11-7： 渐变源。\n\n图 11-7 中的渐变将改变场景的颜色设置，以更好地反映场景内更独特的形状。浅蓝色将为形状顶部提供一种良好的独特亮色，指示它是顶部。紫色将与浅蓝色形成良好对比，使物体的侧面与顶部有明显的区别。最后，绿色对场景的影响不会太大，但它将模拟光线从地面的反射，使得物体的底部略微呈现绿色色调。\n\
    \n## 理解光照\n\n光照是游戏设计中最重要的部分之一，但经常被忽视。光照可以改变游戏，即使是细微的改变。一个看起来像发生在正午、色彩鲜艳的游戏，只需调整光照角度就能发生巨大的变化。现在，场景看起来像图\
    \ 11-8。你将调整光线的方向，帮助场景具有更多活力。\n\n![image](img/9781119404187-fg1108.png)\n\n图 11-8：\
    \ 上了色的场景。\n\n从 `Hierarchy`（层级）窗口中选择 `Directional Light`（定向光）。定向光充当一个来自模糊远距离的光源。这意味着无论它在场景的什么位置，光照都保持不变。你将调整光线的方向，帮助场景具有更多活力。\n"
- fmt: "\n1. **Duplicate your directional light two times (for a total of three).**\n\
    \n2. **Direct each light in a different direction toward the player character\
    \ — two pointing from the camera down toward the player and one pointing up from\
    \ behind the player.**\n\n3. **Select one light (near the camera) to be your key\
    \ light.**\n\n   In the `Inspector`, when you select the key light, you’ll see\
    \ a `Light` component. Change the color to `White`. Change the intensity to `0.8`\
    \ (1 is slightly bright and causes the scene to be slightly overexposed, with\
    \ too much light). Change the strength of the real-time shadows to `0.15` to prevent\
    \ the harsh shadows that you have right now.\n\n4. **Select the other light near\
    \ the camera and have that light be the fill light.**\n\n   In the `Inspector`,\
    \ change the color to also be a slightly darker shade of white. Change the intensity\
    \ to `0.4`. Make sure the strength of the real-time shadows is `0`.\n\n5. **Select\
    \ the final light that’s behind the player — that’s your back light.**\n\n   Change\
    \ the color to a light gray. Change the intensity to `0.2`. Make sure the strength\
    \ of the real-time shadows is `0`.\n\nWhen you finish, your scene should look\
    \ similar to [Figure 11-11](#14_9781119404187-ch11.xhtml_c11-fig-0011).\n\n![image](images/9781119404187-fg1111.png)\n\
    \n[FIGURE 11-11:](#14_9781119404187-ch11.xhtml_rc11-fig-0011) The scene properly\
    \ lit.\n\n## CREATING FOG\n\nAnother way to help bring the scene more to life\
    \ is to add fog to the scene. Fog, as the name suggests, disrupts the visibility\
    \ of the scene and makes objects further away from the camera blurrier and faded.\
    \ Fog has been used in games for years to help with processing power as well as\
    \ to give a sense of mystery or distance within the game. When you look off to\
    \ the horizon, shapes become faded the further away from you they are.\n\nIn games,\
    \ you can simulate this effect using fog. First, you’ll have to go back to the\
    \ lighting settings window that you used earlier to change the environmental lighting.\n\
    \n1. **To create fog, scroll down in the lighting settings to the `Other Settings`\
    \ tab.**\n\n2. **Check the box next to `Fog` in the drop-down.**\n\n   This will\
    \ create a fog for the game. The closer the camera is, the less fog there is in\
    \ the scene.\n\n3. **Change the color of the fog to a grayish green to match the\
    \ coloring in the game already set.**\n\n4. **Make sure the `Mode` is `exponential\
    \ squared`.**\n\n5. **Keep the `Density` at `0.01`.**\n\nThis will create a nice\
    \ fog in the game window so that when you play the game, the fog will appear on\
    \ the horizon of the game, obscuring the player’s ability to see beyond a certain\
    \ point clearly. This will create a sense of distance in the game’s world and\
    \ give overall more life to the game’s setting. As you can see in [Figure 11-12](#14_9781119404187-ch11.xhtml_c11-fig-0012),\
    \ the fog helps shape the 3D nature of the level and create a nice view for the\
    \ player.\n\n![image](images/9781119404187-fg1112.png)\n\n[FIGURE 11-12:](#14_9781119404187-ch11.xhtml_rc11-fig-0012)\
    \ The scene with fog.\n\nNow before you add characters and objects in [Chapter\
    \ 12](#15_9781119404187-ch12.xhtml), take a moment to compare the images at the\
    \ end of the chapter to the images at the beginning of the chapter. Already, you\
    \ can see how lighting and color have brought more life to the scene than was\
    \ previously there. The game is hitting its final preparations!\n\n![image](images/c12.png)\n\
    \nIn this chapter, you’ll import your characters and objects into `Unity` to finish\
    \ setting up your game. This chapter is the culmination of all the previous chapters\
    \ in this book. You’ll combine what you’ve worked on in `Blender` and `Unity`\
    \ into one final version of the game, with very little coding left to do.\n\n\
    Here, you’ll learn how to import the characters and animations into `Unity` and\
    \ set up the animations so that they begin to play when you start the game. You’ll\
    \ also learn how to set up animation controls for your main player character so\
    \ that the animations only play when the corresponding controls are used in the\
    \ game. The goal of this chapter is to have the finished version of the game that\
    \ will only require a little bit of alteration and fixing up in the next chapter.\n\
    \n## FIXING YOUR PLAYER CHARACTER FOR IMPORTING INTO UNITY\n\nYou’ll be able to\
    \ import most of the animations that you made in [Chapter 10](#13_9781119404187-ch10.xhtml)\
    \ with no problem. But `Unity` doesn’t like every type of animation — namely,\
    \ shape keys. `Unity` was built to import a variation of shape keys, called `blend\
    \ shapes`, that are used within programs like `Maya`. Luckily there are plenty\
    \ of workarounds for this problem, but none of these work.\n"
  raw: "1.  **Duplicate your directional light two times (for a total of three).**\n\
    \n2.  **Direct each light in a different direction toward the player character\
    \ — two pointing from the camera down toward the player and one pointing up from\
    \ behind the player.**\n\n3.  **Select one light (near the camera) to be your\
    \ key light.**\n\n    In the Inspector, when you select the key light, you’ll\
    \ see a Light component. Change the color to White. Change the intensity to 0.8\
    \ (1 is slightly bright and causes the scene to be slightly overexposed, with\
    \ too much light). Change the strength of the real-time shadows to 0.15 to prevent\
    \ the harsh shadows that you have right now.\n\n4.  **Select the other light near\
    \ the camera and have that light be the fill light.**\n\n    In the Inspector,\
    \ change the color to also be a slightly darker shade of white. Change the intensity\
    \ to 0.4\\. Make sure the strength of the real-time shadows is 0.\n\n5.  **Select\
    \ the final light that’s behind the player — that’s your back light.**\n\n   \
    \ Change the color to a light gray. Change the intensity to 0.2\\. Make sure the\
    \ strength of the real-time shadows is 0.\n\nWhen you finish, your scene should\
    \ look similar to [Figure 11-11](#14_9781119404187-ch11.xhtml_c11-fig-0011).\n\
    \n![image](images/9781119404187-fg1111.png)\n\n[FIGURE 11-11:](#14_9781119404187-ch11.xhtml_rc11-fig-0011)\
    \ The scene properly lit.\n\n## CREATING FOG\n\nAnother way to help bring the\
    \ scene more to life is to add fog to the scene. Fog, as the name suggests, disrupts\
    \ the visibility of the scene and makes objects further away from the camera blurrier\
    \ and faded. Fog has been used in games for years to help with processing power\
    \ as well as to give a sense of mystery or distance within the game. When you\
    \ look off to the horizon, shapes become faded the further away from you they\
    \ are.\n\nIn games, you can simulate this effect using fog. First, you’ll have\
    \ to go back to the lighting settings window that you used earlier to change the\
    \ environmental lighting.\n\n1.  **To create fog, scroll down in the lighting\
    \ settings to the Other Settings tab.**\n\n2.  **Check the box next to Fog in\
    \ the drop-down.**\n\n    This will create a fog for the game. The closer the\
    \ camera is, the less fog there is in the scene.\n\n3.  **Change the color of\
    \ the fog to a grayish green to match the coloring in the game already set.**\n\
    \n4.  **Make sure the Mode is exponential squared.**\n\n5.  **Keep the Density\
    \ at 0.01.**\n\nThis will create a nice fog in the game window so that when you\
    \ play the game, the fog will appear on the horizon of the game, obscuring the\
    \ player’s ability to see beyond a certain point clearly. This will create a sense\
    \ of distance in the game’s world and give overall more life to the game’s setting.\
    \ As you can see in [Figure 11-12](#14_9781119404187-ch11.xhtml_c11-fig-0012),\
    \ the fog helps shape the 3D nature of the level and create a nice view for the\
    \ player.\n\n![image](images/9781119404187-fg1112.png)\n\n[FIGURE 11-12:](#14_9781119404187-ch11.xhtml_rc11-fig-0012)\
    \ The scene with fog.\n\nNow before you add characters and objects in [Chapter\
    \ 12](#15_9781119404187-ch12.xhtml), take a moment to compare the images at the\
    \ end of the chapter to the images at the beginning of the chapter. Already, you\
    \ can see how lighting and color have brought more life to the scene than was\
    \ previously there. The game is hitting its final preparations!\n\n![image](images/c12.png)\n\
    \nIn this chapter, you’ll import your characters and objects into Unity to finish\
    \ setting up your game. This chapter is the culmination of all the previous chapters\
    \ in this book. You’ll combine what you’ve worked on in Blender and Unity into\
    \ one final version of the game, with very little coding left to do.\n\nHere,\
    \ you’ll learn how to import the characters and animations into Unity and set\
    \ up the animations so that they begin to play when you start the game. You’ll\
    \ also learn how to set up animation controls for your main player character so\
    \ that the animations only play when the corresponding controls are used in the\
    \ game. The goal of this chapter is to have the finished version of the game that\
    \ will only require a little bit of alteration and fixing up in the next chapter.\n\
    \n## FIXING YOUR PLAYER CHARACTER FOR IMPORTING INTO UNITY\n\nYou’ll be able to\
    \ import most of the animations that you made in [Chapter 10](#13_9781119404187-ch10.xhtml)\
    \ with no problem. But Unity doesn’t like every type of animation — namely, shape\
    \ keys. Unity was built to import a variation of shape keys, called blend shapes,\
    \ that are used within programs like Maya. Luckily there are plenty of workarounds\
    \ for this problem, but none of these workarounds is within Unity itself, so that\
    \ means you must dive back into Blender one last time to export the file into\
    \ a version that Unity can read and use.\n\n![image](images/9781119404187-fg1201.png)\n\
    \n[FIGURE 12-1:](#15_9781119404187-ch12.xhtml_rc12-fig-0001) Your character in\
    \ Blender.\n\nOpen your character in Blender (see [Figure 12-1](#15_9781119404187-ch12.xhtml_c12-fig-0001)).\
    \ You won’t actually be able to see the changes that you have to make to the character\
    \ on the screen right now because it involves something called a *dope sheet.*\
    \ In hand-drawn animations, dope sheets were outlines for animators to use so\
    \ that they could determine when a specific animation would happen and for how\
    \ long. It was a simple outline for the animators to work from. In Blender, the\
    \ dope sheet gives you the ability to adjust the animation timing and order. You\
    \ can use it to move key frames around to either speed up or slow down certain\
    \ animations.\n\nTo open the dope sheet, go to the lower-left corner of the Timeline\
    \ and find the small clock icon that looks like a drop-down menu. Click that clock\
    \ and then click the Dope Sheet icon with three dots (two gray, one orange). This\
    \ will turn your Timeline into a dope sheet.\n\nWhen you’ve opened up the dope\
    \ sheet, you’ll see a menu bar at the bottom. Next to that menu bar, you’ll see\
    \ the Key drop-down. Select Shape Key Editor from the Key drop-down menu.\n\n\
    ![image](images/9781119404187-fg1202.png)\n\n[FIGURE 12-2:](#15_9781119404187-ch12.xhtml_rc12-fig-0002)\
    \ The dope sheet.\n\nNow what you’re doing is making the shape key animation so\
    \ that it’s being read as a location-based animation (something that Unity has\
    \ no issues reading). To do this, select all the frames:\n\n1.  **Hold Shift and\
    \ select each frame individually.**\n\n2.  **Press B (for bounding box) and drag\
    \ across the Timeline to select all the frames.**\n\n3.  **Press A (for all) while\
    \ hovering your mouse over the dope sheet to select them all.**\n\nWhen you’ve\
    \ done this, at the bottom of the dope sheet, next to where it says KeyAction,\
    \ click the button that has an F. This saves the data block even when it has no\
    \ users. For the sake of simplicity, this will give you the ability to import\
    \ your shape key animations into Unity without any problems.\n\n![image](images/9781119404187-fg1203.png)\n\
    \n[FIGURE 12-3:](#15_9781119404187-ch12.xhtml_rc12-fig-0003) The Action Editor.\n\
    \nNow change the Shape Key Editor to Action Editor. This will open up the actions\
    \ of the animation (the key frame changes to the location, rotation, and scale,\
    \ as shown in [Figure 12-3](#15_9781119404187-ch12.xhtml_c12-fig-0003)). At frames\
    \ 0 and 245 insert a key frame using the animation tab in the 3D view window,\
    \ and select location when Unity prompts you what this key frame will be affecting.\
    \ This will create a range for Unity to read the file in.\n\nAfter you finish,\
    \ save your file. Then choose File ⇒ Export ⇒ FBX (.fbx), as shown in [Figure\
    \ 12-4](#15_9781119404187-ch12.xhtml_c12-fig-0004), and save the file into your\
    \ Blender folder that the other files are saved in. This will save your work so\
    \ that Unity will be able to read it with little problems. Exit Blender now and\
    \ open up Unity.\n\n![image](images/9781119404187-fg1204.png)\n\n[FIGURE 12-4:](#15_9781119404187-ch12.xhtml_rc12-fig-0004)\
    \ Saving the file as an FBX file.\n\n## IMPORTING YOUR PLAYER CHARACTER INTO UNITY"
