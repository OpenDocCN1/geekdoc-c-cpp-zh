  trans: "\n\n![image](img/9781119404187-fg0409.png)\n\nFIGURE 4-9: 高级移动代码。\n\n代码的下一次更改位于\
    \ `void Start` 内部。在 `void Start` 内部，代码引用了 `bool` 类型中的 `gc`，并将其值从 `false` 更改为 `true`，这将直接影响代码的后续部分，表示该部分代码应该在游戏开始时运行。\n\
    \n在你之前创建的 `FixedUpdate` 字符串中，添加了一个与 `W` 键码相关的新 `if` 语句。这段代码与你编写第一个代码相似，但有一个主要区别：这段代码中指示了第二个\
    \ `Input`。\n\n如果你需要让多个方面同时对字符串起作用，或者为了让字符串正常工作而需要引用多个部分，可以通过在两个部分之间的代码中添加 `&&`\
    \ 来实现。在这种情况下，为了激活 `if` 语句，需要在键盘上按下两个按钮：`W` 和 `LeftShift`。因此，你正常地定义每个键码，但为了将两者连接起来，你需要将它们放在\
    \ `if` 语句旁同一个括号内，并用 `&&` 将它们连接。这段代码的另一个更改微乎其微，因为它只是将 `Speed` 浮点数替换为 `SSpeed`。你会注意到，在该字符串之后，基础向前移动仍然保持不变。这是因为你希望保持玩家冲刺和移动的能力都是可能的，但相互独立。这段代码部分仅添加了向前冲刺，但若要为每个方向添加冲刺，只需使用相同的代码基础并将其应用于每个方向即可。这里有一个示例：\n\
    \n```cs\n(Input.GetKey(KeyCode.W) && (Input.GetKey(KeyCode.LeftShift)) {\n   \
    \ transform.position += Vector3.forward * Time.deltaTime * SSpeed;\n}\n```\n\n\
    代码的最后一次更改位于代码的最底部，引用了 `bool` 类型。这段代码通过使用射线检测（raycast）防止对象能够双击跳（或在按住空格键 `Spacebar`\
    \ 时保持悬浮）。射线检测从对象的特定部分向某个方向发射一条射线，以测量附近是否有碰撞体。如果射线检测在正方向上被设置为 `10f`，那么当测量到位于物体前方\
    \ `10` 个的碰撞体时，射线检测就会捕捉到它。这可以创建警告附近有碰撞体的消息，或触发两个对象之间的交互。想想宝可梦中的训练家对战。当你通过宝可梦中训练家的特定距离时，战斗就开始了。这防止了你不需要调整对象的碰撞体大小，而是记录两个对象之间的距离。在这种情况下，射线检测指示你的对象何时接触地面，并防止角色在不在地面该距离内时跳跃：\n\
    \n```cs\nVector3 gc = transform.TransformDirection (Vector3.down);\nif (Physics.Raycast\
    \ (transform.position, gc, .5f)) {\n    GroundTouch = true;\n}\n```\n\n首先，代码通过\
    \ `gc` 的方向指示射线检测指向的方向，`gc` 的方向被转换为向下的 `Vector3` 方向。这告诉射线检测它应该测量的方向是向下，这将使其指向地面。接下来，在\
    \ `if` 语句中，`physics` 让我们能够访问 `raycast`。它被视为物理代码，从那里代码定义了射线检测延伸多远。在这段代码中，射线检测沿着\
    \ `gc` 延伸了 `.5F`（或半个单位）。当测量到该距离时，代码指示角色正在接触地面。保存你的代码并在 Unity 中测试（参见图 4-10）。看看你是否能捡起物体。\n\
    \n![image](img/9781119404187-fg0410.png)\n\nFIGURE 4-10: Unity 中的角色。\n\n你可能已经注意到尚未解决的一点是，当你选中角色时，`Inspector`\
    \ 窗口中的新组件。这个组件是你刚刚创建的脚本，但你也会注意到你创建的 `floats` 和 `bool` 的名称也可以在这里进行修改。将 `floats`\
    \ 设置为 `public` 的作用使让你即使在代码之外也有能力更改这些值。这是非常有用的，因为它允许你在测试期间调整角色的速度、跳跃距离和冲刺速度。这样做时唯一需要记住的是，在游戏运行时对这些数字所做的任何更改都不会被记录。在进行这些更改时不能处于播放模式（play\
    \ mode）。\n\n现在当你玩游戏时，你还会发现你的角色没有捡起你在第 3 章中为角色制作的可捡物品。这是因为你还没有为角色创建捡取物品的代码。目前它们的作用仅仅是物体。\n\
    \n## 编写捡取代码\n\n可收集物品是指示目标的简单方式。捡取代码不仅是为了允许角色捡取目标，还为了让目标在角色碰撞时消失，并让 UI 在每当角色通过任何物体时增加“分数”。这涉及很多代码。为了方便起见，我将这段代码分为两部分：定义受代码影响的文本和整数的开头部分，以及设置计数的开始；以及定义这些文本和整数如何变化以及如何相互相关的代码结尾。\n\
    \n为了在屏幕上显示文本，你必须首先让它控制用户界面（UI）。在代码访问引擎的下方添加 `using UnityEngine.UI;`（参见图 4-11）。这将赋予代码更改你添加到游戏的任何\
    \ UI 的能力。\n\n代码的顶部（参见图 4-12)是你之前添加 `floats` 和 `bools` 的地方。你将添加两种影响你的游戏和其他代码部分的新类型代码：\n\
    \n- **Text**: 文字代码与 UI 直接相关，并在代码中确定。这些可以是游戏期间出现的简单消息，甚至是随着游戏情况变化而改变的值。\n- **int**:\
    \ int 代码是整数。它们是在代码过程中确定的数字代码，并根据你编写的代码增加或减少值。这些可以用于定义倒计时器或评分系统。\n\n你还会注意到，虽然两个文本都是\
    \ `public`（这意味着它们的值会被广播到代码之外的游戏的其他方面或代码中），但 `int` 代码是 `private`，这意味着它的值仅在此特定代码内部有效，不会影响游戏的其他部分。\n\
    \n"
- fmt: "\nThe text codes that you want to make are `countText` and `winText`. Similar\
    \ to the floats, the names here don’t actually matter beyond their value as an\
    \ indication of a further code. These codes will be used to count the player’s\
    \ score, and once the player has hit a certain score indicates that the player\
    \ has “won” the game.\n\nYou want to name the int code `count`. Again, the name\
    \ doesn’t matter, but `count` will indicate to you or any other person who looks\
    \ at this code that this integer is directly relating to counting something. In\
    \ this case, the integer is counting the amount of pickup items that the player\
    \ has collected.\n\nAfter you add these codes, go down to the `void Start` string\
    \ where you’ll add two new codes:\n\n*   `Count = 0;`: This will set the count\
    \ integer to zero at the beginning of the level. After setting it to zero, you’ll\
    \ be able to make the number increase later during the code.\n*   `SetCountText();`:\
    \ This code refers to the text code you’ll have later. After every integer change,\
    \ this code will record the change and send it to the text code to change its\
    \ number accordingly.\n\nAt the bottom of the code (see [Figure 4-13](#07_9781119404187-ch04.xhtml_c04-fig-0013)),\
    \ two voids have been added in the `void FixedUpdate`: `void OnTriggerEnter(Collider\
    \ other)` and `void SetCountText()`:\n\n![image](images/9781119404187-fg0413.png)\n\
    \n[FIGURE 4-13:](#07_9781119404187-ch04.xhtml_rc04-fig-0013) The end of the code.\n\
    \n```cpp\nvoid OnTriggerEnter (Collider other) {\n    if (other.gameObject.CompareTag(\"\
    Pickup\"))\n    {\n        other.gameObject.SetActive(false);\n        count =\
    \ count + 1;\n        SetCountText();\n    }\n}\n```\n\nThe `onTriggerEnter` only\
    \ activates when a certain event happens, in the parentheses that event is defined\
    \ when the object’s collider is in contact with another collider. What that means\
    \ is whenever the character touches another object, this code begins to run, but\
    \ to limit this code to only affect the pickup items within this string is an\
    \ `if` statement: `if (other.gameObject.CompareTag(\"Pickup\"))`. So now the code\
    \ has determined that whenever the object collides with another, if that other\
    \ object’s tag is `Pickup`, the next part of the string happens.\n\nThe first\
    \ line in this part of the string indicates that when this collides with the other\
    \ object, it will change its `SetActive` to `false`. This will cause the other\
    \ object to disappear in the game, making it look like it was picked up when in\
    \ reality it’s just no longer being rendered in the game. The next line sets our\
    \ count integer to `count + 1`, which increases the total count by 1. Finally,\
    \ in the third line, the code resets the `countText` with the integer.\n\nNow\
    \ whenever the game character touches an object with the `Pickup`, that object\
    \ will disappear and the player’s score will increase by 1.\n\n`SetCountText()`\
    \ has already been referred to multiple times in this code. This string does define\
    \ what happens when `SetCountText` is referred to. Inside this string, the code\
    \ refers back to the `countText` public text that was set up earlier.\n\n```cpp\n\
    countText.text = \"Count: \" + count.ToString();\n```\n\nThis will define the\
    \ `countText` and tell a user interface (UI) what text to display. You determine\
    \ that this is a text file and, thus, has words that have to be defined. Within\
    \ the quotation marks, you specify the words that `countText` will display and\
    \ indicate that it will also include the integer count at the end of the words.\
    \ By adding the `+`, the computer knows to add the integer to the end of the stated\
    \ phrase. Because every time the character picks up an object the code refers\
    \ back to this string, the value at the end of the string will grow as you collect\
    \ more items.\n\nAt the very end of `SetCountText()` is an `if` statement that\
    \ determines when to display `winText`. When count is equal to or greater than\
    \ 12, the `winText` will display the message “CONGRATS YOU WON!!!”. This value\
    \ can differ depending on the amount of pickup items you have scattered throughout\
    \ the level, but the code will work regardless of the exact number. Just change\
    \ the number to match how many pickup items are on the level. Here’s the finished\
    \ code:\n\n```cpp\nvoid SetCountText()\n{\n    countText.text = \"count: \" +\
    \ count.ToString();\n    if (count >= 12)\n    {\n        winText.text = \"CONGRATS\
    \ YOU WON!!!\n    }\n}\n```\n\nSave the code, and return to Unity to test it out\
    \ (see [Figure 4-14](#07_9781119404187-ch04.xhtml_c04-fig-0014)).\n\n![image](images/9781119404187-fg0414.png)\n\
    \n[FIGURE 4-14:](#07_9781119404187-ch04.xhtml_rc04-fig-0014) The game with the\n\
    \n## CREATING TAGS AND USER INTERFACE\n\nNow that you created the UI, you have\
    \ to link the UI to the code.\n\n### CREATING A INTERFACE\n\nCreating a is actually\
    \ very simple. Like any other object simply go to GameObject, scroll down to UI,\
    \ and select Text. This will create a canvas with text. The goal is to link the\
    \ UI to the code. First, in the Inspector, name the text `CountText`. Place it\
    \ in the upper-left, so first adjust the position to (X=0, Y=0, Z=0). At the upper\
    \ left of the Inspector, there will be an anchor point. Click that indicator and\
    \ select the upper left and then move the position so the text will be seen. In\
    \ my game, X=95, Y=-34, and Z=0, but this could differ for your game. Toward the\
    \ bottom of the Inspector, you’ll see some text settings that change the color,\
    \ size, and font of the text. Find what works best for your game. Click the Best\
    \ Fit box, which will fit the text to the screen to make it readable as possible\
    \ without covering too much of the screen. After you finish creating this, create\
    \ another UI and name it `WinText`. Instead of placing it toward the left corner,\
    \ center it and make sure bold and italic (select the font style and select bold\
    \ and italic). Also click Best Fit for this one, but change its maximum size to\
    \ 60 and it minimum size to 10. Finally, delete all the text in this box because\
    \ while the text will replace this text, it will not do so until the end, so having\
    \ it empty will make sure the game window is empty until you win.\n\nNow that\
    \ you created the UI, you have to link the text on the UI to your code. Luckily\
    \ Unity makes this very simple.\n\n1. Select your player.\n2. Scroll down on the\
    \ Inspector until you reach your Char (Script) component.\n3. Select the target\
    \ next to Count Text. A Select Text pop-up window will appear.\n4. Select Count\
    \ Text.\n5. Repeat for Win Text (selecting Win Text instead).\n\n### CREATING\
    \ A TAG\n\nTags are references that can be assigned to one or more game objects.\
    \ Used with codes, tags can help determine things like certain items being able\
    \ to be picked up or enemies being able to destroy the character on contact. It's\
    \ a way to assign a value to multiple objects at once. Earlier in this chapter,\
    \ you already defined a tag that will be affected by our character, Pickup. Now\
    \ you have create that tag and assign it to the object you want the character\
    \ to pick up.\n"
  raw: "The text codes that you want to make are `countText` and `winText`. Similar\
    \ to the floats, the names here don’t actually matter beyond their value as an\
    \ indication of a further code. These codes will be used to count the player’s\
    \ score, and once the player has hit a certain score indicates that the player\
    \ has “won” the game.\n\nYou want to name the int code `count`. Again, the name\
    \ doesn’t matter, but `count` will indicate to you or any other person who looks\
    \ at this code that this integer is directly relating to counting something. In\
    \ this case, the integer is counting the amount of pickup items that the player\
    \ has collected.\n\nAfter you add these codes, go down to the `void Start` string\
    \ where you’ll add two new codes:\n\n*   `Count = 0;`: This will set the count\
    \ integer to zero at the beginning of the level. After setting it to zero, you’ll\
    \ be able to make the number increase later during the code.\n\n*   `SetCountText\
    \ ();`: This code refers to the text code you’ll have later. After every integer\
    \ change, this code will record the change and send it to the text code to change\
    \ its number accordingly.\n\nAt the bottom of the code (see [Figure 4-13](#07_9781119404187-ch04.xhtml_c04-fig-0013)),\
    \ two voids have been added in the `void FixedUpdate`: `void OnTriggerEnter (Collider\
    \ other)` and `void SetCountText ()`:\n\n![image](images/9781119404187-fg0413.png)\n\
    \n[FIGURE 4-13:](#07_9781119404187-ch04.xhtml_rc04-fig-0013) The end of the code.\n\
    \n`Void OnTriggerEnter (Collider other) {`\n\n`If (other.gameObject.CompareTag(\"\
    Pickup\")`\n\n`{`\n\n`other.gameObject.SetActive (false);`\n\n`count = count +\
    \ 1;`\n\n`Set CountText ();`\n\n`}`\n\n`}`\n\nThe `onTriggerEnter` only activates\
    \ when a certain event happens, in the parentheses that event is defined when\
    \ the object’s collider is in contact with another collider. What that means is\
    \ whenever the character touches another object, this code begins to run, but\
    \ to limit this code to only affect the pickup items within this string is an\
    \ `if` statement: `if (other.gameObject.CompareTag(\"Pickup\"))`. So now the code\
    \ has determined that whenever the object collides with another, if that other\
    \ object’s tag is `Pickup`, the next part of the string happens.\n\nThe first\
    \ line in this part of the string indicates that when this collides with the other\
    \ object, it will change its `SetActive` to `false`. This will cause the other\
    \ object to disappear in the game, making it look like it was picked up when in\
    \ reality it’s just no longer being rendered in the game. The next line sets our\
    \ count integer to `count + 1`, which increases the total count by 1\\. Finally,\
    \ in the third line, the code resets the `countText` with the integer.\n\nNow\
    \ whenever the game character touches an object with the `Pickup`, that object\
    \ will disappear and the player’s score will increase by 1.\n\n`SetCountText ()`\
    \ has already been referred to multiple times in this code. This string does define\
    \ what happens when `SetCountText` is referred to. Inside this string, the code\
    \ refers back to the `countText` public text that was set up earlier.\n\n`countText.text\
    \ = \"Count: \" + count.ToString ();`\n\nThis will define the `countText` and\
    \ tell a user interface (UI) what to text to display. You determine that this\
    \ is a text file and, thus, has words that have to be defined. Within the quotation\
    \ marks, you specify the words that `countText` will display and indicate that\
    \ it will also include the integer count at the end of the words. By adding the\
    \ `+`, the computer knows to add the integer to the end of the stated phrase.\
    \ Because every time the character picks up an object the code refers back to\
    \ this string, the value at the end of the string will grow as you collect more\
    \ items.\n\nAt the very end of `SetCountText()` is an `if` statement that determines\
    \ when to display `winText`. When count is equal to or greater than 12, the `winText`\
    \ will display the message “CONGRATS YOU WON!!!”  This value can differ depending\
    \ on the amount of pickup items you have scattered throughout the level, but the\
    \ code will work regardless of the exact number. Just change the number to match\
    \ how many pickup items are on the level. Here’s the finished code:\n\n`void SetCountText\
    \ ()`\n\n`{`\n\n`countText.text = \"count: \" + count.ToString;`\n\n`if (count\
    \ >= 12)`\n\n`{`\n\n`winText.text = \"CONGRATS YOU WON!!!\"`\n\n`}`\n\n`}`\n\n\
    Save the code, and return to Unity to test it out (see [Figure 4-14](#07_9781119404187-ch04.xhtml_c04-fig-0014)).\n\
    \n![image](images/9781119404187-fg0414.png)\n\n[FIGURE 4-14:](#07_9781119404187-ch04.xhtml_rc04-fig-0014)\
    \ The game with completed character code.\n\nAs of right now, the code will not\
    \ work because you have yet to set up a UI interface and create a tag that will\
    \ allow the pickup items to be collected.\n\n## CREATING TAGS AND A USER INTERFACE\n\
    \nThe code works fine, but the problem is that the game has no way to recognize\
    \ the code. There is no UI for the code to change and nothing that will make the\
    \ pickup items recognize that the code is referring to them.\n\n### CREATING A\
    \ USER INTERFACE\n\nCreating a UI is actually very simple. Like any other game\
    \ object simply go to GameObject, scroll down to UI, and select Text. This will\
    \ create a canvas with text on it. Where the canvas is and how large it is don’t\
    \ matter because the UI is automatically fitted into the camera’s view. The text\
    \ settings do matter, though.\n\nFirst, in the Inspector window, change the name\
    \ of the text to `Count Text` so that you can easily find it when you need to\
    \ link the UI to the code. Next, the goal is to have the count text in the upper-left\
    \ corner of the screen, so first adjust the position to (X=0,Y=0,Z=0). At the\
    \ upper left of the Inspector, there will be an anchor point indicator. Click\
    \ that indicator and select the upper-left corner and then move the position so\
    \ that the text will be seen on the upper left of the game window. In my game,\
    \ X = 95, Y = –34, and Z = 0, but this could different for your game. Toward the\
    \ bottom of the Inspector window, you’ll see some basic text settings that will\
    \ change the color, size, and font of the text. Find what works best for your\
    \ game. Click the Best Fit box, which will fit the text to the screen to make\
    \ it as readable as possible without covering too much of the actual screen. Don’t\
    \ worry about the actual text because your code will replace text when it connects\
    \ to the UI.\n\nAfter you finish creating this UI, create another UI and name\
    \ it `Win Text`. Instead of placing it toward the left corner, center it and make\
    \ sure it’s bold and italic (select the font style and select bold and italic).\
    \ Also click Best Fit for this one, but change its maximum size to 60 and it minimum\
    \ size to 10\\. Finally, delete all the text in this box because while the text\
    \ will replace this text, it will not do so until the end, so having it empty\
    \ will make sure that the game window is empty until you win.\n\nNow that you\
    \ created the UI, you have to link the text on the UI to your code. Luckily Unity\
    \ makes this very simple.\n\n1.  **Select your player.**\n\n2.  **Scroll down\
    \ on the Inspector until you reach your Char (Script) component.**\n\n3.  **Select\
    \ the target next to Count Text.**\n\n    A Select Text pop-up window will appear.\n\
    \n4.  **Select Count Text.**\n\n5.  **Repeat for Win Text (selecting Win Text\
    \ instead).**\n\nThis will attach the UI to your code and will make it so that\
    \ the UI text will be changed by the code.\n\n### CREATING A TAG\n\nTags are references\
    \ that can be assigned to one or more game objects. Used with codes, tags can\
    \ help determine things like certain items being able to be picked up or enemies\
    \ being able to destroy the character on contact. It's a way to assign a value\
    \ to multiple objects at once. Earlier in this chapter, you already defined a\
    \ tag that will be affected by our character, Pickup. Now you have create that\
    \ tag and assign it to the object you want the character to pick up."
