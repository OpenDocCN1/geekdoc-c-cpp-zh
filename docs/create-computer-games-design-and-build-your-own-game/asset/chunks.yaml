    After you’ve applied the material to the object, go to the Inspector and click
    `Apply`. Your color will be applied to all the objective prefabs. Now you have
    a level with objectives that not only stand out but lead players in the direction
    you want them to go!


    ![image](images/c4.png)


    In this chapter, you’ll be learning the fundamental basis behind game development:
    coding. This chapter explains how you can make your game interactive so that people
    will be able to `play` your game. I’ll show you a simple movement code that you
    can use as a jumping-off point for coding in the future. I’ll also explain the
    different aspects of the code and the core thoughts behind every piece of code.


    Here, you’ll also learn how to program your character so that she’ll pick up the
    pickup items you created in [Chapter 3](#06_9781119404187-ch03.xhtml), which involves
    creating and applying object tags. You’ll learn about how to write a simple code
    that will allow your camera to follow your character through the level. These
    codes will act as an introduction to some more complex codes that I’ll cover in
    [Chapter 5](#08_9781119404187-ch05.xhtml). What you’ll learn in this chapter will
    be expanded upon in the next chapter.


    ## THE THREE CS OF GAME DEVELOPMENT


    When you make a game, keep in mind the three Cs of game development: camera, character,
    and control. These three Cs act as the player’s main introduction into the world
    that you hope to create. They’re the only aspects of your game that your player
    will always be dealing with. When you understand the role of each of these three
    Cs in your game, you’ll better understand not only your game, but all games that
    you create or play.


    ### CAMERA


    The camera is the player’s window into your game. It’s what the player sees and
    responds to. Camera placement in a game is vital because the player’s basic understanding
    of your game world will come through the camera.


    In film, the camera shows only what the cinematographer and director want the
    audience to see. Changing the location of the camera can change the entire feeling
    of the scene or, in some cases, break the scene entirely.


    Your game camera should be treated in much the same way as a film camera. The
    problem is that, in games, you can’t always control where the player (or camera)
    goes. When you create your camera, you have to decide how much control you want
    your player to have over the camera and whether you’ll limit that control in any
    way. A camera that is locked behind the player character will reveal different
    information than one that is located above or to the side of the player character.
    Cameras that players have complete control over or that players can rotate reveal
    to the player information from all over the world — but they may also reveal aspects
    of the game that you wouldn’t otherwise want players to see.


    ### CHARACTER


    The character is who the player is playing as in the game. This can be deceptive
    because the theme of the character doesn’t matter at this point in game development.
    Whether the character is a super-detailed soldier or a box is irrelevant when
    you’re coding your game. What you need to think about when you think of character
    is what exactly your character does within the game. Ask yourself the following
    questions:


    * Does the character jump? If so, how high?

    * Does the character have four-directional movement (forward, backward, left,
    right) or does the character only move forward and backward?

    * Does my character have any weapons or tools? If so, what are they?


    How your character moves not only changes what your game is but how you’ll go
    about coding your game. A first-person shooter has an entirely different code
    than a platformer. Even different types of platformers can have a variety of different
    codes simply because of the types of controls you want the character to have.


    ### CONTROL


    Control is how your player interacts with the game. The thing that separates games
    from every other type of entertainment medium is their unique ability to engage
    with an audience. Players don’t just read or watch the events play out as they
    do with books, movies, or TV shows. They play an active role in the experience
    and are invested in the characters because they `are` the characters.


    Controls make or break a game. A game with a poor control setup will never engage
    players on the same level as one with good controls, no matter how good the graphics
    or story is. You play games because they make you feel in control, so when you
    design your game, you have to think about how controls interact with the player
    and how you can make the game accessible for the greatest number of people.


    For example, when you think about movement in a computer game, what buttons do
    you think of? Probably the `W`, `A`, `S`, and `D` keys. But why? Why don’t gamed
    designers use the `6`, `Caps Lock`, `Enter`, and `Spacebar` keys instead? After
    all, those keys also relate to the different directions. The reason designers
    typically use `W`, `A`, `S`, and `D` is because they don’t want the player to
    have to put a lot of effort into playing the game for each desired effect. If
    you have to move your hand too much, or stop and think about the controls, that
    can break your immersion in the game, which kills it. You want the time it takes
    for a player to think of something and the time it takes for her to enact it to
    be minimal so that players never break their immersion within the game.


    ## CREATING A CHARACTER STAND-IN


    In [Chapter 3](#06_9781119404187-ch03.xhtml), you created a completed gray-box
    level. See [Figure 4-1](#07_9781119404187-ch04.xhtml_c04-fig-0001) for what the
    gray-box level allowed you to test the controls and make sure the game was fun
    before you added the `skin` (the exterior look for the game).


    ![image](images/9781119404187-fg0401.png)


    [FIGURE 4-1:](#07_9781119404187-ch04.xhtml_rc04-fig-0001) The completed gray-box
    level.


    Similarly, character stand-ins are a way for you to program and test your character,
    controls, and camera without needing to invest in creating a detailed character
    first. Stand-ins help you focus on the player’s enjoyment of the game rather than
    the game itself. As with the gray-box level, your character stand-in doesn’t need
    to be super complex to get the point across. The one thing a stand-in character
    should do is stand apart from the background. To create your stand-in, follow
    these steps:


    1. Go to `GameObject` and create a `Cube`.

    2. Drag the cube to the start of the level using the translation tools. It doesn’t
    need to be placed directly on the top of the level, but it should be above it
    at the very least.

    3. Go to your `Assets` folder in your project window, and create a new folder
    called `Materials`.

    4. Move any existing materials into this folder.

    5. Create a new `material`, and apply it to the `cube`.

    6. Change the color of the `material` so that the player distinctly stands out
    from the background. See [Figure 4-2](#07_9781119404187-ch04.xhtml_c04-fig-0002)
    for what the character should look like.


    ![image](images/9781119404187-fg0402.png)


    [FIGURE 4-2:](#07_9781119404187-ch04.xhtml_rc04-fig-0002) Your stand-in character.


    ## THINK ABOUT CODE


    What is coding? When you think about coding, you probably think about movie hackers
    shifting through walls of ones and zeroes to crack the code into the vault or
    something. You think of it as something that requires a bunch of math and computing
    to figure out.

