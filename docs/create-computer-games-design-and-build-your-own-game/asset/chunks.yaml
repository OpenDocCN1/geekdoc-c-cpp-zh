  trans: "\n\n游戏中的最后一个问题之一源于游戏的关卡设计。这个问题在之前并没有出现过。在此之前，玩家实际上具有跳得更高的能力，因为有足够的空间让角色进行助跑起跳。随着敌人和环境障碍的引入，这种同样的跳跃能力受到了限制。正因如此，某些平台太高了，玩家实际上无法进行适当的跳跃。\n\
    \n解决这个问题的办法其实非常简单：只需添加楼梯！对于那些无法跳跃或没有其他访问方式的平台，添加楼梯（见图 13-4）并不会降低难度。相反，它们通过赋予玩家实际前进的能力来改进游戏体验。\n\
    \n![image](img/9781119404187-fg1304.png)\n\n图 13-4： 添加楼梯。\n\n## 总结显著问题\n\n这些只是玩家在游戏中可能会遇到的少数问题之一。作为一名开发者，你的工作是听取所有的批评，并尽力解决它们。故障和错误（bugs）在游戏中是不可避免的。即使是经过多次测试测试的游戏也会出现这些问题。你可能永远无法在你的游戏中找到*所有*可能的\
    \ bug，尤其是当你的游戏变得越大、越复杂时。\n\n从容接受收到的任何批评，并知道没有任何游戏是完美的。努力做出最好的游戏，对其进行测试，并进行调整以更好地适应你期望的玩家，但不要迷失于修复每一个小细节。\n\
    \n![image](img/c14.png)\n\n在前面的章节中，你创建并精炼了游戏的第一个关卡。现在是时候对关卡进行最后的润色了，这样你就可以创建新的关卡并超越单关卡的限制。\n\
    \n在本章中，你将学习如何编写代码以便在关卡完成后加载新关卡。你还将学习如何修复代码，以便角色在关卡中死亡时能够重生。最后，你将学习如何导出游戏，以便你可以随时玩它！\n\
    \n## 创建多个关卡\n\n到目前为止，你为游戏创建了一个关卡，但游戏不仅仅是一个关卡。大多数游戏都有玩家不断通过的多个关卡，并且难度随着关卡的推进而不断增加。你的游戏也应该如此。Unity\
    \ 让你能够轻松创建新关卡并将游戏中的各个关卡连接起来。\n\n首先，你需要创建一个新关卡：\n\n1. **在打开第一个关卡的情况下，选择 文件（File）⇒\
    \ 新建场景（New Scene）。**\n   这将在你的整个项目中创建一个新的空场景。\n2. **将新场景保存为 `Level2`，并重新打开你的第一个关卡。**\n\
    3. **创建一个新的 C# 代码，并将其命名为 `Level2`（见**图 14-1**）。**\n4. **打开新代码。**\n5. **在代码顶部，即代码列出其将要使用的所有集合和引擎的地方，输入以下内容：**\n\
    \   ```csharp\n   using UnityEngine.SceneManagement;\n   ```\n   这段代码将访问 Unity\
    \ 的场景管理器（Scene Manager）工具。场景管理器允许使用代码控制不同的场景。你可以用它在点击一下按钮或触发某些条件时加载和重新加载关卡。在这种情况下，`Level2`\
    \ 代码将被添加到端点中，这样当玩家触发游戏对象时，游戏将在屏幕上加载第 2 关卡。\n6. **删除 `void Start` 和 `void Update`\
    \ 两个字符串。**\n   它们对代码来说是不必要的。\n7. **在 `void Start` 和 `void Update` 字符串的位置，输入以下内容：**\n\
    \   ```csharp\n   void OnTriggerEnter(Collider other) {\n   ```\n   这将指示代码，当碰撞器（collider）与另一个游戏对象碰撞时，该字符串会被激活。在代码内部，你将定义当触发发生时激活哪些代码，以及它将如何影响游戏的其他。\n\
    8. **在 `void` 触发器内部，输入以下代码：**\n   ```csharp\n   if (other.gameObject.CompareTag(\"\
    Player\")) {\n   ```\n   这将使得当碰撞器碰到带有有 `Player` 标签的游戏对象时，括号内的代码将会执行。\n9. **在 `if`\
    \ 语句的括号内添加以下代码：**\n   ```csharp\n   Scene.Manager.LoadScene (\"Level2\");\n  \
    \ ```\n   这段最后的代码将访问场景管理器工具并告诉它加载与你的游戏的名为 `Level2` 的场景。这段代码可以用于加载项目中的任何其他场景。你可以在图\
    \ 14-2 中看到代码完成后的样貌。\n\n![image](img/9781119404187-fg1401.png)\n\n图 14-1： 创建新代码。\n\
    \n![image](img/9781119404187-fg1402.png)\n\n图 14-2： 新代码。\n\n![image](img/9781119404187-fg1403.png)\n\
    \n图 14-3： 构建设置窗口。\n\n## 重置关卡\n\n到目前为止，当角色死亡时，玩家会被销毁，游戏会发送一条玩家输了的消息。相反，你将更改它，使得游戏仍然向你展示失败界面，但当你按下某个键时，游戏将重新开始。遵循以下步骤：\n\
    \n1. **打开你的 `Char` 代码。**\n2. **在代码顶部添加以下内容：**\n   ```csharp\n   using UnityEngine.SceneManagement;\n\
    \   ```\n   这段代码更改并控制场景。\n3. **在所有 `if` 语句的最后，在 `void` 触发字符串内部，找到 `if (count <=\
    \ -1)` 代码并删除整个部分代码，包括 `if` 语句内部的代码。**\n   对 `void` 碰撞器内部所有的 `if` 语句执行此操作。\n4.\
    \ **在你删除所有这些代码的地方，编写以下内容：**\n   ```csharp\n   if (count <= -1) {\n   ```\n\n"
- fmt: "\n```csharp\nwinText.text = \"You Lose :( Press R to Play Again\"\ndead =\
    \ true;\n}\n```\n\nThis code will be within the `void` but on its own so that\
    \ you don’t need to change the code in each of the `if` statements like you had\
    \ to earlier (see [Figure 14-4](#17_9781119404187-ch14.xhtml_c14-fig-0004)).\n\
    \n![image](images/9781119404187-fg1404.png)\n\n[FIGURE 14-4:](#17_9781119404187-ch14.xhtml_rc14-fig-0004)\
    \ Adding the level to the build.\n\nInstead of destroying the game object, you’ll\
    \ use a new `Boolean` `dead` to affect the gameplay. Right now, `dead = true`\
    \ has no effect on the game, but that’s because you haven’t defined `dead` yet.\
    \ Follow these steps:\n\n1. **At the top of the code, where you keep all the public\
    \ and private floats, text, and game objects, add the following code:**\n\n  \
    \ ```csharp\n   public bool dead = false;\n   ```\n\n   This will give the value\
    \ of false to the `dead` `bool` and make it so that the code will recognize the\
    \ value of the `dead` `bool`. The goal is to have it so that whenever the player\
    \ is dead (when the `dead` `bool` is true), the player won’t be able to move or\
    \ use her character.\n\n2. **Change all the `if` statements in the `void FixedUpdate`\
    \ to include the condition that `dead` needs to be false.**\n\n   Similar to adding\
    \ the `sprint` function, simply add at the end of the `if` code `&& dead == false`.\
    \ Repeat this for all the `if` statements within the `void FixedUpdate` (see [Figure\
    \ 14-5](#17_9781119404187-ch14.xhtml_c14-fig-0005)).\n\n   Now, whenever the player\
    \ is not dead, the character will be able to move around freely, but as soon as\
    \ the character dies, all the movement controls are unable to be used because\
    \ you added the condition that the character has to *not* be dead in order to\
    \ move. The player stops working as soon as the character dies, but how can you\
    \ turn the player back on once the game “ends”?\n\n![image](images/9781119404187-fg1405.png)\n\
    \n[FIGURE 14-5:](#17_9781119404187-ch14.xhtml_rc14-fig-0005) Making `dead == false`.\n\
    \nYou’ve coded the character to stop working. Now you have to code the reset button.\
    \ In the losing statement, you’ve already told the player what key she’ll need\
    \ to press to reset the game, so you’ll be coding that function in the code. At\
    \ the end of the `FixedUpdate` code, but before the raycasting codes, add a new\
    \ `if` statement:\n\n```csharp\nif (Input.GetKey(KeyCode.R) && dead == true) {\n\
    \    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n}\n```\n\nThis\
    \ code gives the player the ability to reset the game when the character dies.\
    \ Like the movement codes, this code only happens when the player presses a certain\
    \ button on the keyboard — in this case, the `R` key. And because of the `&& dead\
    \ == true` addition, this code won’t work unless the player has already died.\
    \ When the player presses `R` the `SceneManager` will reload the scene from the\
    \ beginning, which resets the game back to the way it was at the start of the\
    \ level, so any and all text and counts will be reset to their starting values.\
    \ [Figure 14-6](#17_9781119404187-ch14.xhtml_c14-fig-0006) shows how the code\
    \ should look.\n\n![image](images/9781119404187-fg1406.png)\n\n[FIGURE 14-6:](#17_9781119404187-ch14.xhtml_rc14-fig-0006)\
    \ The reset code.\n\n## EXPORTING YOUR GAME\n\nNow that your game is completed,\
    \ you need to export the game so that it can be played without Unity. There are\
    \ two ways to do this:\n\n* You can choose `File` ⇒ `Build`.\n* You can build\
    \ the game in the `Build Settings` window after double-checking to make sure all\
    \ the settings are correct.\n\nYou’ll also be able to name the file whatever you\
    \ want. And when you export the game, you can choose to export it out to a certain\
    \ location. Exporting it into your games folder will make it easy to find and\
    \ open, but you don’t need to keep it with the project folder because the build\
    \ is standalone, apart from the project folders and doesn’t need to reference\
    \ them for any of its parts.\n\nWhen you open the game, you’ll see the screen\
    \ shown in [Figure 14-7](#17_9781119404187-ch14.xhtml_c14-fig-0007).\n\n![image](images/9781119404187-fg1407.png)\n\
    \n[FIGURE 14-7:](#17_9781119404187-ch14.xhtml_rc14-fig-0007) Adding the level\
    \ to the build.\n\n## CONTINING YOUR GAME\n\nYou’ve coded the character to stop\
    \ working. Now you have to code the reset button. In the losing statement, you’ve\
    \ already told the player what key she’ll need to press to reset the game, so\
    \ you’ll be coding that function in the code. At the end of the `FixedUpdate`\
    \ code, but before the raycasting codes, add a new `if` statement:\n\n```csharp\n\
    if (Input.GetKey(KeyCode.R) && dead == true) {\n    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n\
    }\n```\n\nThis code gives the player the ability to reset the game when the character\
    \ dies. Like the movement codes, this code only happens when the player presses\
    \ a certain button on the keyboard — in this case, the `R` key. And because of\
    \ the `&& dead == true` addition, this code won’t work unless the player has already\
    \ died. When the player presses `R` the `SceneManager` will reload the scene from\
    \ the beginning, which resets the game back to the way it was at the start of\
    \ the level, so any and all text and counts will be reset to their starting values.\
    \ [Figure 14-6](#17_9781119404187-ch14.xhtml_c14-fig-0006) shows how the code\
    \ should look.\n\n![image](images/9781119404187-fg1406.png)\n\n[FIGURE 14-6:](#17_9781119404187-ch14.xhtml_rc14-fig-0006)\
    \ The reset code.\n\n## EXPORTING YOUR GAME\n\nNow that your game is completed,\
    \ you need to export the game so that it can be played without Unity. There are\
    \ two ways to do this:\n\n* You can choose `File` ⇒ `Build`.\n* You can build\
    \ the game in the `Build Settings` window after double-checking to make sure all\
    \ the settings are correct.\n\nYou’ll also be able to name the file whatever you\
    \ want. And when you export the game, you can choose to export it out to a certain\
    \ location. Exporting it into your games folder will make it easy to find and\
    \ open, but you don’t need to keep it with the project folder because the build\
    \ is standalone, apart from the project folders and doesn’t need to reference\
    \ them for any of its parts.\n\nWhen you open the game, you’ll see the screen\
    \ shown in [Figure 14-7](#17_9781119404187-ch14.xhtml_c14-fig-0007).\n\n![image](images/9781119404187-fg1407.png)\n\
    \n[FIGURE 14-7:](#17_9781119404187-ch14.xhtml_rc14-fig-0007) Adding the level\
    \ to the build.\n\n## ABOUT THE AUTHOR\n\n**PATRICK MCCABE** is an instructor\
    \ at the Digital Arts. He has spent the past year teaching students about animation.\
    \ He graduated from SUNY Purchase in 2016 and studied at three schools. In high\
    \ school, Patrick won the first-ever award for Best Animation in the Greenwich\
    \ Youth Film Festival for his short. He is also a not-so-secret *Star Wars* enthusiast.\n\
    \n## DEDICATION\n\nThis book is dedicated to my fiancé, Shela, without whom I\
    \ probably never would have been able to finish. Thank you for always listening\
    \ when I talked your ears off about videogames, and for making sure my glass of\
    \ Diet Pepsi was always filled. This book is also dedicated to Diet Pepsi. You\
    \ were always there to pick me up.\n\n## AUTHOR’S ACKMENTS\n\nThank you to John\
    \ Wiley & Sons for giving me the opportunity to write this book. This was an amazing\
    \ experience to write and really challenged me to think through and put to words\
    \ my feelings on game design and develop a new appreciation for game design itself.\n\
    \nThank you to Steven Hayes for keeping me on task and emailing me the (many)\
    \ times I fell behind schedule or was stuck on how I should approach each chapter.\
    \ I don't think I would have been able to complete this book without you.\n\n\
    Nick, without you I don't think this book would be half as long as it is. I think\
    \ I came to you about seven different times a day to ask you to help workshop\
    \ the code when it wasn’t working. You are also the father of the curriculum that\
    \ I used as the basis for this class.\n\nThank you, Cristina and Jordan, for the\
