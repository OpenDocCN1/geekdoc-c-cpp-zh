  raw: 'For the purposes of making an invisible object, I find that either Fade or
    Cutout works the best. Select one of those two and then select the Albedo color.
    When you select the Albedo, a color picker window pops up. At the bottom of the
    color picker window, you’ll see four letters next to color sliders:


    *   R for Red


    *   G for Green


    *   B for Blue


    *   A for Alpha


    Using the different color sliders allows you to change how much influence each
    color has, but Alpha determines how transparent or opaque (solid) an object is.
    This option is only available in the Fade, Cutout, or Transparent render settings.


    Transparent doesn’t work as well as the other two because it’s more for rendering
    glass so it still has a glare. Dragging the Alpha all the way down to 0 will make
    the material completely invisible. After creating the material, assign it to the
    quad that you created, and now the quad will be invisible at the bottom of the
    level.


    Name this quad `DeathZone1` and save it. You want to create two more `DeathZone`s
    and place one in between the two respawn points, and the other one from the last
    respawn point until just past the end of the level, as shown in [Figure 5-13](#08_9781119404187-ch05.xhtml_c05-fig-0013).


    ![image](images/9781119404187-fg0513.png)


    [FIGURE 5-13:](#08_9781119404187-ch05.xhtml_rc05-fig-0013) The first trigger.


    There should be no empty space between any of the zones. This is to make sure
    that each respawn point has a corresponding zone that will spawn characters back
    to the respawn point. After you’ve created all the respawn points and zones, it’s
    time to code them.


    ## CODING RESPAWN POINTS


    To code the respawn points, you’ll use a slightly different system than you did
    for the other colliders. For one thing, instead of using tags, you’ll instead
    be using a public GameObject.


    At the top of the code, create six public GameObjects (see [Figure 5-14](#08_9781119404187-ch05.xhtml_c05-fig-0014)),
    one for each trigger and target. The first three you should name `deathZone01`,
    `deathZone02`, and `deathZone03`; these will attach to the trigger zones created
    earlier in the chapter. Use the following as an example of how to write the code,
    replace the name for each one:


    ![image](images/9781119404187-fg0514.png)


    [FIGURE 5-14:](#08_9781119404187-ch05.xhtml_rc05-fig-0014) Public GameObjects.


    `Public GameObject deathZone01;`


    The next three name `respawnPoint1`, `respawnPoint2`, and `respawnPoint3`. These
    will target the respawn empties made earlier.


    In [Chapter 4](#07_9781119404187-ch04.xhtml), you created a public GameObject
    to attach the camera to the player character. Public GameObjects allow you to
    choose specific targets that the code will affect. They can be useful if you want
    to have the same code for multiple levels because it’s easy to target different
    objects for different levels. Thinking of it through respawn points, you want
    to be able to easily set up respawn points in every level, and tags don’t work
    because each respawn needs to be coded individually so the fastest and most reliable
    way is to use GameObjects.


    In [Figure 5-15](#08_9781119404187-ch05.xhtml_c05-fig-0015), you can see that
    the Respawn code itself is minimal, but you’ll notice something that you haven’t
    seen before. Instead of the usual `CompareTag` code that you’ve written before
    this code, you’ll notice that the code has two equal signs.


    ![image](images/9781119404187-fg0515.png)


    [FIGURE 5-15:](#08_9781119404187-ch05.xhtml_rc05-fig-0015) The respawn code.


    `if (other.gameObject == deathZone01) {`


    `transform.position = respawnPoint1.transform.position;`


    `}`


    When the value is numerical, you only need to use one equal sign to say the object’s
    value is equal to it, but for non-numerical instances — such as when the object
    collision has to match a certain object — it will require two equal signs for
    it to work properly.


    In this `if` statement, if the other GameObject that is being touched is the `deathzone01`
    GameObject, then the position is transformed to match the position of the `respawnPoint1`.
    After finishing this code, save your file and switch to a Unity window to test
    out the code.


    Select the player and go to the Inspector window. In the Char (Script) component,
    you’ll now see a list of all the GameObjects you made in the code. Select the
    target next to Death Zone 01 and choose the first `DeathZone` that you created.
    Do the same for the respawn point (as shown in [Figure 5-16](#08_9781119404187-ch05.xhtml_c05-fig-0016)).
    Save your scene and project and press Play. Now when your character falls off
    the edge of the level, it will respawn back at the start.


    ![image](images/9781119404187-fg0516.png)


    [FIGURE 5-16:](#08_9781119404187-ch05.xhtml_rc05-fig-0016) Setting the GameObjects.


    After you’ve tested the code and seen that it works, click the targets for the
    rest of the death zones and respawn points. Before you can test it, though, you’ll
    need to repeat the same codes for the other targets and triggers.


    The only thing left to code for the falling respawn is the reduction to the total
    score count. For this, you just use the same code you made for the enemy codes.
    By setting this code up whenever the character falls off the edge, his score is
    reduced by 1 every time he respawns, and if he falls off the edge with no health,
    he will be destroyed. Coding this to happen is similar to the enemy codes before,
    setting it so that the count decreases by 1\. If it goes under –1, it will end
    the game.


    `if (other.gameObject == deathZone01) {`


    `transform.position = respawnPoint1.transform.position;`


    `count = count – 1;`


    `SetCountText ();`


    `if (count <=-1){`


    `Destroy (gameObject)`


    `winText.text = "You lose :(";`


    `}`


    `}`


    See [Figure 5-17](#08_9781119404187-ch05.xhtml_c05-fig-0017) for what the final
    code should look like.


    ![image](images/9781119404187-fg0517.png)


    [FIGURE 5-17:](#08_9781119404187-ch05.xhtml_rc05-fig-0017) The final respawn code.


    Using this code as a basis you can also add a code for the environmental hazards.
    Instead of using the `if (other.gameObject ==` code, use the `CompareTag` code
    and copy the rest of the code from the `GameObject` codes. Make sure that the
    environmental hazard respawns to the third respawn point.


    `If (other.gameObject.CompareTag("EnviroHazard03")){`


    `transform.position = respawnPoint3.transform.position;`


    `count = count – 1;`


    `SetCountText ();`


    `if (count <=-1){`


    `Destroy (gameObject)`


    `winText.text = "You lose :(";`


    `}`


    `}`


    After you finish coding the environmental hazards and the respawn points, you’ve
    finally completed your gray box level (see [Figure 5-18](#08_9781119404187-ch05.xhtml_c05-fig-0018)).
    Save your scene and project.


    ![image](images/9781119404187-fg0518.png)


    [FIGURE 5-18:](#08_9781119404187-ch05.xhtml_rc05-fig-0018) The finished gray box
    level.


    ![image](images/c6.png)


    In this chapter, you’ll play test your game for the first time. Play testing may
    be the hardest part of game design, especially for independent game developers
    who work by themselves or in a small team. It’s hard for artists to show their
    work to someone for the first time with the sole purpose of getting criticism.
    People who have been artists or game developers for years *still* struggle with
    this fundamental part of art, so don’t worry if it’s hard for you. Putting your
    work out there is challenging.


    This chapter helps you overcome some of the fears or mental blocks you may have
    when you think about play testing. This chapter also gives you some tips about
    what to look for whenever you test your game. No two games are the same, and no
    one set of answers exist for all games. The goal of this chapter is not to give
    you the answers for every game ever, but to give you the tools you’ll need to
    better test your game in the future — and become a better game developer in the
    process!


    ## DEFINING PLAY TESTING'
