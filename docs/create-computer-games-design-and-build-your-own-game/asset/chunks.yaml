  trans: "\n*   **你在游戏中死了多少次？发生了什么？** 这个数字代表了游戏学习曲线的陡峭程度。因为你目前正在测试第一关，这个数字应该是很低的。了解玩家死了几次以及为什么死，可以让你了解游戏是否清楚地告诉玩家应该做什么。如果玩家一直撞上敌人导致死亡，可能是敌人的描绘不够清晰。如果他们一直掉下边缘，可能是跳跃键不起作用或没有明确指示。\n\
    \n*   **游戏逻辑通顺吗？** 游戏还处于开发早期，所以除了游戏的基本机制外，可能没有太多需要理解的，但即使是敌人的行为和道具的功能这样简单的事情，对玩家来说保持清晰也同样重要。\n\
    \n*   **在这个阶段你会改变什么？** 这个问题可能是所有问题中最棘手的，因为它会受到个人偏好的影响。尽管如此，我认为这是一个非常重要的问题，因为在开发游戏时，会有一些你完全没考虑到或漏掉的想法。即使是你以后不会用到的东西，在任何艺术媒介中也可能是无价的。它迫使你思考你想要做的游戏到底是什么。它还可能给你一些从未想过的、新颖有趣的方向。\n\
    \n这些是我发现能帮助我在测试中获得最大收益的问题。向某人（尤其是朋友）提出批评通常是很的，所以向你的测试人员问这些问题可能帮助他们敞开心扉并诚实地评价游戏。无论你是否采纳了这些建议，诚实的反馈都永远不是坏事。\n\
    \n## 处理反馈\n\n建设性的反馈总是是好事，尤其是当反馈是负面意见时。任何游戏都有改进空间，对哪些部分有效或无效的反馈可以防止游戏陷入停滞。让人们玩你的游戏并提供诚实的建设性反馈可能会令人害怕，但你越早克服这种恐惧，就会成为越优秀的游戏开发者。\n\
    \n## 寻找游戏中的问题\n\n即使是你在书中制作的游戏也无法免受批评和改进。游戏总是可以改进的。这个游戏也存在许多 Bug 和设计问题。你可能会发现本章中遗漏的问题。务必让其他人测试游戏，超出这里讨论的问题。例如，我回答了之前列出的一些问题，并详细说明了游戏中哪些地方做得好，哪些做得不好：\n\
    \n*   **游戏的目标是什么？** 游戏的目标没有定义。虽然道具和敌人之间确实有明显的区别，但没有任何指示说明玩家在游戏中应该完成什么。\n    主要目标（关卡中的最后一个道具）除了简单的调色板外，没有任何体现其重要性。在设计游戏目标时，应该更强调它与游戏中其他物品的区别。目标需要从一开始就定义得更清楚，以给玩家提供方向。\n\
    \n*   **你在游戏中遇到过 Bug 或故障吗？如果有，是什么？** 游戏内有一个故障，当角色靠墙时发生。当角色在墙上跳跃时，角色实际上可以爬墙，因为角色将墙识别为地面的一部分。这使得游戏的某些区域比预想的简单得多。\n\
    \n*   **控制方式是怎样的？** 控制非常直观，但 `Shift` 键的使用在游戏过程中很容易被忽略，导致某些游戏章节无法通过。游戏需要向玩家介绍控制方式。如果没有这些，玩家很难弄清楚游戏所有的操作。\n\
    \n*   **你觉得控制容易学习吗？为什么？** 游戏中的控制方式已经足够直观，其实不需要太多的介绍，但应该有一个指南帮助玩家最初了解控制方式。如果没有这个指南，玩家在开始可能会苦于理解控制。至少应该对\
    \ `Sprint`（冲刺）按钮有一个指示。\n\n*   **你在游戏中死了多少次？发生了什么？** 游戏中的主要问题是第一个可以交互的物体就能杀死你，这会阻碍你收集道具。大多数玩家会立即死亡，没有意识到道具可以作为对抗敌生物的血。最好的解决方案是在关卡开始增加另一个道具。\n\
    \n*   **游戏逻辑通顺吗？** 游戏逻辑是通顺的，即使目标最初并不明确。当玩家理解了游戏机制并知道哪些道具是好是坏时，游戏的其他部分就具有一致性。\n\
    \n*   **在这个阶段你会改变什么？** 游戏在这个阶段需要做的最大改变是加入一些教授玩家控制方式的指南。在这个阶段应该加入的另一部分是可以离开结束界面的能力。现在，玩家退出结束游戏的唯一方法是重新开始整个游戏，这破坏了连贯性并防止了玩家再次尝试。这是一种无意中的惩罚。\n\
    \n相机也锁定在一个整个过程中都不有效的角度。玩家应该能够根据关卡中发生的情况需要调整相机。虽然第一关很简单，不需要调整相机就能玩，但任何未来更复杂的关卡都会崩溃。\n"
- fmt: "\nWhen you develop games, you have to prioritize problems and bugs that come\
    \ up. Some problems will need to be solved earlier than others. In a world filled\
    \ with deadlines, bugs that break the game need to be fixed before aesthetic problems.\
    \ Think of it like homework: Some projects or assignments need to be prioritized\
    \ due to the day that they’re due or their importance to your overall grade. Game\
    \ making is similar, except the only person who can determine the importance of\
    \ certain problems over others is you! Ask yourself what problems are actually\
    \ hurting the gameplay experience the most and what problems can wait for later.\n\
    \nIn the case of this game, here are the major problems:\n\n*   `Players are punished\
    \ unfairly.` This breaks the game by killing the player early on and giving the\
    \ players a “game over” right in the beginning.\n*   `Players have issues early\
    \ in the game learning the different controls.` To fix this you want to add a\
    \ tutorial that will actually change as players learn the controls and demonstrate\
    \ them in game.\n*   `Players are climbing the walls.` In a platformer, you want\
    \ your players to learn how to jump and master the controls. If there are easy\
    \ workarounds for the player that they can use instead, the challenging parts\
    \ that make the game a game will be ineffective. And, as the game gets harder,\
    \ the difficulty spike will feel uneven because the less challenging parts meant\
    \ to teach the controls and parts of the game will just be ignored.\n\nIn the\
    \ following sections, I walk you through solving each of these three problems.\n\
    \n### PUNISHING YOUR PLAYER LESS\n\nWhen players start the game, everything is\
    \ new to them. They aren’t sure what’s a good thing and what’s an enemy. In the\
    \ early parts of the game, all players have is the information you provide them.\
    \ In your game, the first major object that players interact with gives them a\
    \ “game over” screen, which creates a poor association between the player and\
    \ the other objects within the game, including the good ones. You can use visual\
    \ clues all you want to help indicate which things are good and which things are\
    \ bad, but these visual clues aren’t guaranteed to work. As a general rule, the\
    \ first mistakes the players make should be learning opportunities for later in\
    \ the game.\n\nThe best way to fix this problem is to lessen the punishment for\
    \ making the mistake. But instead of changing the code to prevent the instant\
    \ death, there is a simpler way to give players a second chance after that mistake:\
    \ Place a pickup right before the first enemy (see [Figure 7-1](#10_9781119404187-ch07.xhtml_c07-fig-0001)).\n\
    \n![image](images/9781119404187-fg0701.png)\n\n[FIGURE 7-1:](#10_9781119404187-ch07.xhtml_rc07-fig-0001)\
    \ Adding a pickup item.\n\nThis may seem like a small change, but not every change\
    \ in game design has to be large to make a huge difference. By adding a pickup\
    \ item before the first obstacle, you’re teaching two lessons with one item:\n\
    \n*   `Players learn the benefit of the pickup items early because they see their\
    \ scores increase from the start.` That way, they’ll associate the two things\
    \ with each other.\n*   `Players learn that there are beneficial items in the\
    \ game from the start, giving a positive reinforcement.`\n\nAfter they see this\
    \ pickup item, they’ll see the enemy character and one of two things will happen:\n\
    \n*   They’ll realize that the character is an enemy and avoid it.\n*   They’ll\
    \ bump into the character and lose one point.\n\nThe brilliance of adding just\
    \ one pickup item before the enemy is that players not only learn that pickup\
    \ items are good, but also learn that enemies are bad without having to restart\
    \ the game. They’re punished, but not too harshly. They learn what to avoid and\
    \ what can be interacted with.\n\n### CREATING A USER INTERFACE TUTORIAL\n\nPlayers\
    \ can figure out a lot on their own, but a simple tutorial can go a long way toward\
    \ preventing players from feeling frustrated. Games are only fun when you know\
    \ how to play them. If you don’t know how to play them, games can become more\
    \ tedious than they’re worth. Tutorials are a simple way to help address the problem\
    \ of learning how to play.\n\nBecause the game you’re working on doesn’t have\
    \ any really complex controls, the tutorial itself doesn’t need to be very complicated\
    \ — but it’s still necessary. In the days of Super Mario Bros. or the arcade games,\
    \ tutorials weren’t necessary because there were so few controls and buttons that\
    \ the player could actually use — figuring out the controls only took a minute\
    \ or so. These days, games have at least ten buttons on the controllers and over\
    \ a hundred on keyboards. And that doesn’t include all the different combinations\
    \ of controls that are now available through coding. Learning how to play a game\
    \ isn’t as simple for people who’ve never played before.\n\nTo create a UI tutorial\
    \ for your game, you need to create a new UI. Follow these steps:\n\n1.  `Choose\
    \ GameObject ⇒ UI ⇒ Text.`\n2.  `Adjust the text so that it’s in the lower left\
    \ of the canvas and it’s a color that will stick out and can be clearly read.`\n\
    3.  `Delete all the text in the text box.`\n4.  `From the Text (script) drop-down,\
    \ there is a paragraph section. In that section you will see `Horizontal Overflow`\
    \ with a drop-down next to it. Change it from `Wrap` to `Overflow`.`\n    This\
    \ prevents the text from being cut off if it’s too long.\n5.  `Rename it “Direction\
    \ Text.”`\n6.  `Open the Char code.`\n7.  `At the very top of the code, enter\
    \ `public string directionText;` below the `winText` and `countText` are.`\n8.\
    \  `In the `void Start()` string, enter `directionText.text = \"W=Forward A=Left\
    \ D=Right\";``\n    This displays the tutorial at the start of the game. The start\
    \ of the tutorial should just give the basic controls before moving onto the next\
    \ codes. The next codes are actually placed within the `if` statements that control\
    \ the keys. The first one will be put into the key that just the forward movement\
    \ (W). The code shown in [Figure 7-2](#10_9781119404187-ch07.xhtml_c07-fig-0002)\
    \ gives the tutorial the cue to change.\n\n![image](images/9781119404187-fg0702.png)\n\
    \nCurrently, if the W key is pressed, all that happens is the character moves\
    \ forward.\n\n1.  Add an `if` statement: `if (directionText.text == \"W=Forward\
    \ A=Left D=Right\") {`.`\n    This will make so that if you press the W key, and\
    \ if the `directionText` is the starting text, the following code will happen.\n\
    2.  Inside this `if` statement, add `directionText.text = \"Press Space to Jump\"\
    ;`.`\n    This will change the `directionText` to the next step in the tutorial.\n\
    3.  Go to the jump code (`KeyCode.Space`).\n4.  Follow steps 1 and 2 but change\
    \ the `directionText.text` in Step 1 from `W=Forward A=Left D=Right` to `Press\
    \ Space to Jump` and change the `directionText.text` in Step 2 from `Press Space\
    \ to Jump` to `Left Shift to Sprint`.\n5.  Go to the forward sprint code (`KeyCode.W\
    \ && KeyCode.LeftShift`).\n6.  Follow steps 1 and 2 (again) but change the `directionText.text`\
    \ in Step 1 from `Press Space to Jump` to `Left Shift to Sprint` and change the\
    \ `directionText.text` in Step 2 from `Left Shift to Sprint` to `\" \"`.\n\nNow\
    \ the players will be taken through a tutorial. When they do what the tutorial\
    \ suggests, the tutorial’s text will change. Save the code and exit out to Unity.\
    \ Use the target next to “Direction Test” to select the object “Direction Text.”\n\
    \n### PREVENTING WALL CLIMBING WITH RAYTRACING\n"
  raw: "When you develop games, you have to prioritize problems and bugs that come\
    \ up. Some problems will need to be solved earlier than others. In a world filled\
    \ with deadlines, bugs that break the game need to be fixed before aesthetic problems.\
    \ Think of it like homework: Some projects or assignments need to be prioritized\
    \ due to the day that they’re due or their importance to your overall grade. Game\
    \ making is similar, except the only person who can determine the importance of\
    \ certain problems over others is you! Ask yourself what problems are actually\
    \ hurting the gameplay experience the most and what problems can wait for later.\n\
    \nIn the case of this game, here are the major problems:\n\n*   **Players are\
    \ punished unfairly.** This breaks the game by killing the player early on and\
    \ giving the players a “game over” right in the beginning.\n\n*   **Players have\
    \ issues early in the game learning the different controls.** To fix this you\
    \ want to add a tutorial that will actually change as players learn the controls\
    \ and demonstrate them in game.\n\n*   **Players are climbing the walls.** In\
    \ a platformer, you want your players to learn how to jump and master the controls.\
    \ If there are easy workarounds for the player that they can use instead, the\
    \ challenging parts that make the game a game will be ineffective. And, as the\
    \ game gets harder, the difficulty spike will feel uneven because the less challenging\
    \ parts meant to teach the controls and parts of the game will just be ignored.\n\
    \nIn the following sections, I walk you through solving each of these three problems.\n\
    \n## PUNISHING YOUR PLAYER LESS\n\nWhen players start the game, everything is\
    \ new to them. They aren’t sure what’s a good thing and what’s an enemy. In the\
    \ early parts of the game, all players have is the information you provide them.\
    \ In your game, the first major object that players interact with gives them a\
    \ “game over” screen, which creates a poor association between the player and\
    \ the other objects within the game, including the good ones. You can use visual\
    \ clues all you want to help indicate which things are good and which things are\
    \ bad, but these visual clues aren’t guaranteed to work. As a general rule, the\
    \ first mistakes the players make should be learning opportunities for later in\
    \ the game.\n\nThe best way to fix this problem is to lessen the punishment for\
    \ making the mistake. But instead of changing the code to prevent the instant\
    \ death, there is a simpler way to give players a second chance after that mistake:\
    \ Place a pickup right before the first enemy (see [Figure 7-1](#10_9781119404187-ch07.xhtml_c07-fig-0001)).\n\
    \n![image](images/9781119404187-fg0701.png)\n\n[FIGURE 7-1:](#10_9781119404187-ch07.xhtml_rc07-fig-0001)\
    \ Adding a pickup item.\n\nThis may seem like a small change, but not every change\
    \ in game design has to be large to make a huge difference. By adding a pickup\
    \ item before the first obstacle, you’re teaching two lessons with one item:\n\
    \n*   **Players learn the benefit of the pickup items early because they see their\
    \ scores increase from the start.** That way, they’ll associate the two things\
    \ with each other.\n\n*   **Players learn that there are beneficial items in the\
    \ game from the start, giving a positive reinforcement.**\n\nAfter they see this\
    \ pickup item, they’ll see the enemy character and one of two things will happen:\n\
    \n*   They’ll realize that the character is an enemy and avoid it.\n\n*   They’ll\
    \ bump into the character and lose one point.\n\nThe brilliance of adding just\
    \ one pickup item before the enemy is that players not only learn that pickup\
    \ items are good, but also learn that enemies are bad without having to restart\
    \ the game. They’re punished, but not too harshly. They learn what to avoid and\
    \ what can be interacted with.\n\n## CREATING A USER INTERFACE TUTORIAL\n\nPlayers\
    \ can figure out a lot on their own, but a simple tutorial can go a long way toward\
    \ preventing players from feeling frustrated. Games are only fun when you know\
    \ how to play them. If you don’t know how to play them, games can become more\
    \ tedious than they’re worth. Tutorials are a simple way to help address the problem\
    \ of learning how to play.\n\nBecause the game you’re working on doesn’t have\
    \ any really complex controls, the tutorial itself doesn’t need to be very complicated\
    \ — but it’s still necessary. In the days of Super Mario Bros. or the arcade games,\
    \ tutorials weren’t necessary because there were so few controls and buttons that\
    \ the player could actually use — figuring out the controls only took a minute\
    \ or so. These days, games have at least ten buttons on the controllers and over\
    \ a hundred on keyboards. And that doesn’t include all the different combinations\
    \ of controls that are now available through coding. Learning how to play a game\
    \ isn’t as simple for people who’ve never played before.\n\nTo create a UI tutorial\
    \ for your game, you need to create a new UI. Follow these steps:\n\n1.  **Choose\
    \ GameObject ⇒ UI ⇒ Text.**\n\n2.  **Adjust the text so that it’s in the lower\
    \ left of the canvas and it’s a color that will stick out and can be clearly read.**\n\
    \n3.  **Delete all the text in the text box.**\n\n4.  **From the Text (script)\
    \ drop-down, there is a paragraph section. In that section you will see Horizontal\
    \ Overflow with a drop-down next to it. Change it from Wrap to Overflow.**\n\n\
    \    This prevents the text from being cut off if it’s too long.\n\n5.  **Rename\
    \ it “Direction Text.”**\n\n6.  **Open the Char code.**\n\n7.  **At the very top\
    \ of the code, enter** public Text directionText; **below where the** `winText`\
    \ **and** `countText` **are.**\n\n8.  **In the** `void Start ()` **string, enter**\
    \ directionText.text = \"W=Forward A=Left S=Back D=Right\"**.**\n\n    This displays\
    \ the tutorial text at the start of the game. The start of the tutorial should\
    \ just give the basic controls so that players are able to see the initial controls\
    \ right off the bat and get the hang of them before moving onto the next codes.\n\
    \nThe next codes are actually going to be placed within the `if` statements that\
    \ control the keys.\n\nThe first one will be put into the key that controls just\
    \ the forward movement (W). The code shown in [Figure 7-2](#10_9781119404187-ch07.xhtml_c07-fig-0002)\
    \ gives the tutorial the cue to change.\n\n![image](images/9781119404187-fg0702.png)\n\
    \n[FIGURE 7-2:](#10_9781119404187-ch07.xhtml_rc07-fig-0002) The tutorial code.\n\
    \nCurrently, if the W key is pressed, all that happens is that the character moves\
    \ forward.\n\n1.  **Add an `if` statement inside of this code: `if (directionText.text\
    \ == \"W=Forward A=Left S=Back D=Right\") {`.**\n\n    This will make it so that\
    \ if you press the W key, and if the `directionText` is the starting text, the\
    \ following code will happen.\n\n2.  **Inside this `if` statement, add `directionText.text\
    \ == \"Press Space to Jump\";`.**\n\n    This will change the `directionText`\
    \ to the next step in the tutorial.\n\n3.  **Go to the jump code (`KeyCode.Space`).**\n\
    \n4.  **Follow steps 1 and 2 but change the `directionText.text` in Step 1 from\
    \ `W=Forward A=Left S=Back D=Right` to `Press Space to Jump` and change the `directionText.text`\
    \ in Step 2 from `Press Space to Jump` to `Left Shift to Sprint`.**\n\n5.  **Go\
    \ to the forward sprint code (`KeyCode.W && KeyCode.LeftShift`).**\n\n6.  **Follow\
    \ steps 1 and 2 (again) but change the `directionText.text` in Step 1 from `Press\
    \ Space to Jump` to `Left Shift to Sprint` and change the `directionText.text`\
    \ in Step 2 from `Left Shift to Sprint` to `\" \"`.**\n\nNow the players will\
    \ be taken through a tutorial. When they do what the tutorial suggests, the tutorial’s\
    \ text will change. Save the code and exit out to Unity. Use the target next to\
    \ “Direction Test” to select the object “Direction Text.”\n\n## PREVENTING WALL\
    \ CLIMBING WITH RAYTRACING"
