    \ 14-3:](#17_9781119404187-ch14.xhtml_c14-fig-0003) The Build Settings window.\n\
    \nAfter you include `Scene1` in the build, open `Level2` from earlier and include\
    \ it in the build. When both `Level2` and `Scene1` are included in the build,\
    \ the scenes will be linked together and can be called upon by each other.\n\n\
    Now you can attach your `Level2` code to the endpoint object. When the player\
    \ touches the object, the level will automatically switch to 2.\n\n## RESETTING\
    \ THE LEVEL\n\nUp until this point, when the character dies, the player is destroyed\
    \ and the game sends a message saying that the player has lost. Instead, you’re\
    \ going to change it so that the game will still present you with a lose screen\
    \ but when you press a certain key the game will restart. Follow these steps:\n\
    \n1. **Open your `Char` code.**\n2. **Add the following to the top of the code:**\n\
    \   ```csharp\n   using UnityEngine.SceneManagement;\n   ```\n   This code alters\
    \ and controls the scene.\n3. **At the end of all the `if` statements, within\
    \ the `void` trigger string, find the code `if (count <= -1)` and delete that\
    \ entire section of code, including the code within the `if` statement.**\n  \
    \ Do this for all the `if` statements within the `void` collider.\n4. **Where\
    \ you deleted all that code, write the following:**\n   ```csharp\n   if (count\
    \ <= -1) {\n   ```\n"
