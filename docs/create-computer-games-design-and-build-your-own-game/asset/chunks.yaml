    ![](images/cover.jpg)


    # Introduction


    This book explains the basics of game design using the free game development tool
    `Unity`. This book was created to make `Unity` accessible for young adults who
    are interested in the process of game design but don’t know where to begin.


    Game design is tough. It involves figuring out and understanding everything from
    design to coding. Knowing where to begin is daunting and can feel inaccessible.
    Just keep in mind that no one starts off great at game design. You don’t need
    to know everything to start, and thinking that you do is one of the hardest challenges
    to overcome.


    This book was written to get people like me to start thinking about game design
    in a different way. This book isn’t about making a perfect game or about teaching
    you everything about game development or even `Unity`. This book is a starting
    line. It teaches the basics and encourages you to think about games differently.


    ## ABOUT THIS BOOK


    This book was written with the thought that games are tough to make and that coding
    is confusing. Think of this like a cookbook that explains why you use two eggs
    instead of three and what the pepper does to help bring out the flavor. The codes
    and game development that this book walks you through are approached from the
    bottom up. Things make sense when you understood `why` certain codes or components
    are needed. Just knowing the ingredients to a recipe doesn’t teach you how to
    cook.


    ## FOOLISH ASSUMPTIONS


    This book was written for teenagers who have an interest in developing games.
    People who have spent years working in game design will find this book repetitive
    and probably not useful at all. I don’t pretend that this teaches everything about
    game design — I know for a fact that it doesn’t. This book is an introduction
    to the field, so it was made for people who have little to no idea where to even
    begin when they design their games. Some rudimentary typing skills and access
    to a computer and the Internet are all you really need to read this book. You’ll
    also need a copy of `Unity`, which you can download for free (I’ll show you how).


    ## ICONS USED IN THIS BOOK


    Throughout this book, I use the following icons:


    ![tip](images/tip.png) Tips give some clarifications or offer shortcuts. I use
    tips to help you understand the program better or do things in an easier way.


    ![remember](images/remember.png) Anything marked by the Remember icon reminds
    you of principles or ideas that you should think about throughout your game development.


    ## WHERE TO GO FROM HERE


    This book takes you step by step through the process of designing a 3D platformer.
    If you have a clear idea of what game development is and know about `Unity`’s
    interface, you can skip the first two chapters and start with [Chapter 3](#06_9781119404187-ch03.xhtml),
    where I dive into actually developing a game.


    [Chapters 8](#11_9781119404187-ch08.xhtml) through [10](#13_9781119404187-ch10.xhtml)
    use a separate program known as `Blender` and go into the basics of animation.
    If you aren’t interested in adding animation or you already have animations you
    want to include in your game, you can skip those chapters.


    All the other chapters build off of each other and are designed to take you through
    the steps necessary for developing an example game that you’ll build with this
    book.


    ![image](images/c1.png)


    In this chapter, you’ll ask yourself questions about not just *your* games but
    *all* games. When you’re designing computer games, you need to think about the
    fundamental reasons people play games in the first place. The reasons people play
    strategy games aren’t the same reasons they play horror games. Both kinds of games
    are fun, but for very different reasons. The goal of this chapter is to help you
    understand what those reasons are so that the games you design deliver what your
    players are looking for.


    Understanding how game mechanics and themes work together to create a gaming experience
    will help you better visualize and create your own game. If the mechanics aren’t
    fun or don’t fit, it doesn’t matter how cool the theme is — the game won’t be
    fun. If the theme doesn’t match the mechanics, the game might be fun but it won’t
    be memorable. If you aim to create great games, you need to understand both mechanics
    and themes before you even open the software you’ll use to build your games.


    ## THINKING ABOUT WHAT MAKES FUN GAMES FUN


    Have you ever played a game that you couldn’t put down? One that gave you the
    ability to shut off your mind without a care in the world because you were just
    hooked on it? A game that was just a lot of fun? I’m sure you have! Otherwise,
    you wouldn’t be reading this book.


    But why were you sucked into the games you love? Why are they so addicting? What
    makes them fun?


    Fun is where games live and die. If a game isn’t fun, nobody plays it. The first
    thing you have to understand, though, is that there are different types of fun,
    and different kinds of games:


    *   **Fighting games** reward quick thinking and reading your opponent’s moves
    and figuring out the proper combo to counter it with.

    *   **Strategy games** (like `XCOM 2`, shown in [Figure 1-1](#04_9781119404187-ch01.xhtml_c01-fig-0001))
    challenge you to think and plan for a variety of situations, sometimes in an instant.

    *   **Adventure games** push you to explore and discover more about the world
    around you.

    *   **Horror games** (like `Slender: The Arrival`, shown in [Figure 1-2](#04_9781119404187-ch01.xhtml_c01-fig-0002))
    get your adrenaline pumping and push your natural curiosity to its limits.

    *   **Puzzle games** reward you for solving complex.

    *   **Platformers** (like `Super Meat Boy`, shown in [Figure 1-3](#04_9781119404187-ch01.xhtml_c01-fig-0003))
    work off of reward and punishment and challenge you to master the level.

    *   **Action games** (like `To the Moon`) work off of.

    *   **Fighting games** (like `Super Puzzle Fighter`) work off of timing and challenge
    you to perfectly execute.


    ![image](images/9781119404187-fg001.png)

    [FIGURE 1-1](#04_9781119404187-ch01.xhtml_c01-fig-0001) `XCOM 2`


    ![image](images/9781119404187-fg002.png)

    [FIGURE 1-2](#04_9781119404187-ch01.xhtml_c01-fig-0002) `Slender: The Arrival`


    ![image](images/9781119404187-fg003.png)

    [FIGURE 1-3](#04_9781119404187-ch01.xhtml_c01-fig-0003) `Super Meat Boy`


    ![image](images/9781119404187-fg004.png)

    [FIGURE 1-4](#04_9781119404187-ch01.xhtml_c01-fig-0004) `To the Moon`


    ## ASKING THE RIGHT QUESTIONS BEFORE YOU BEGIN


    Think of game design like making something good to eat. You wouldn’t just throw
    any ingredient into a pan and hope for the best. To make it taste great, you need
    to start by asking yourself what kind of food you want to make. Are you making
    a salad? An appetizer? A soup or dessert? Once you know what the purpose of the
    food is — to be a satisfying entrée or a sweet treat at the end of a meal, for
    example — you can choose a recipe that will get you to your goal. And after you
    take it out of the oven or finish combining the ingredients, you might decorate
    it or add a garnish to make it look good.

