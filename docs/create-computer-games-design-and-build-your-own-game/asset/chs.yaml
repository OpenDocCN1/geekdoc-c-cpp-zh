- "# 创建计算机游戏：设计并构建你自己的游戏\n\n\n\n![](img/cover.jpg)\n\n# 引言\n\n本书将介绍使用免费的游戏开发工具 `Unity`\
  \ 来解释游戏设计的基础知识。本书的初衷是让那些对游戏设计过程感兴趣但不知道从何入手的年轻人能够轻松上手 `Unity`。\n\n游戏设计是一项挑战性工作。它涉及到理解并掌握从设计到编码的所有内容。知道从何处开始可能令人令畏，并让人觉得遥不可及。请记住，没有人在游戏设计上从一开始就表现出色。你不需要在开始时无所不知，而认为自己无所不知正是要克服的最困难的挑战之一。\n\
  \n写下这本书是为了让像我这样的人开始以一种不同的方式思考游戏设计。这本书并不是关于如何制作一个完美的游戏，也不是为了教你关于游戏开发甚至 `Unity` 的所有知识。这本书是一个起点。它教你基础知识，并鼓励你以不同的角度来思考游戏。\n\
  \n## 关于本书\n\n编写这本书的理念是：游戏制作很困难，而且编码很令人困惑。你可以把它想象成一本食谱，解释了你为什么用两个鸡蛋而不是三个，以及胡椒的作用是如何帮助提升风味的。书中带你了解的代码和游戏开发是从自底向上的方法。当你理解了**为什么*需要某些代码或组件时，一切就变得合理了。仅仅知道配谱的原料并不能教你如何做菜。\n\
  \n## 误区的假设\n\n本书是为对开发游戏感兴趣的青少年写的。在游戏设计领域工作多年的人会发现这本书内容重复，可能完全没有用处。我并不假装这本书教会了关于游戏设计的一切——我很清楚它并没有。本书是对该领域的介绍，因此它是为那些在设计游戏时甚至不知道该从哪里开始的人准备的。阅读这本书你只需要基础的打字技能以及一台电脑和互联网。你还需要安装\
  \ `Unity`，你可以免费下载（我会教你如何操作）。\n\n## 本书中使用的图标\n\n在本书中，我使用了以下图标：\n\n![tip](img/tip.png)\
  \ 提示（Tips）：提供一些说明或快捷方法。我使用提示帮助你更好地理解程序或以更简单的方式完成任务。\n\n![remember](img/remember.png)\
  \ 记住（Remember）：任何用“记住”图标标记的内容，都会提醒你在整个游戏开发过程中应该考虑的原则或想法。\n\n## 从这里开始\n\n本书将带你一步步完成一个\
  \ 3D 平台游戏的设计。如果你对游戏开发有清晰的认识，并且熟悉 `Unity` 的界面，你可以跳过前两章，从第 3 章开始，在那里将进入实际的游戏开发。\n\n\
  第 8 章到第 10 章使用一个名为 `Blender` 的独立程序，并介绍动画的基础。如果你对添加动画感兴趣，或者你已经有了想要加入游戏中的动画，可以跳过这些章节。\n\
  \n所有其他章节环环相扣，旨在引导你完成开发通过书中构建的示例游戏所需的各个步骤。\n\n![image](img/c1.png)\n\n在本章中，你将不仅针对*你自己的*游戏，还会针对*所有*游戏提出提问。当你在设计电脑游戏时，你需要考虑人们玩游戏的根本原因。人们玩策略游戏的原因与他们玩恐怖游戏的原因并不相同。这两类游戏都有趣，但原因非常不同。本章的目标是帮助你理解这些原因是什么，以便你设计的游戏能够提供玩家所渴求的内容。\n\
  \n理解游戏机制和主题如何共同作用以创造游戏体验，将帮助你更好地视觉化并创造出你自己的游戏。如果机制不好玩或不合适，无论主题有多酷——游戏都不会好玩。。如果主题与机制不匹配，游戏可能很好玩，但不会让你记忆深刻*。如果你的目标是创造出伟大的游戏，在打开用于构建游戏的软件之前，你就需要理解机制和主题。\n\
  \n## 思考什么让好游戏变得有趣\n\n你是否玩过一款让你欲罢不手的游戏？那种让你能够放下杂念、无忧无虑，因为你完全沉迷其中的游戏？一个单纯非常有趣的游戏？我确定你玩过！否则你不会在读这本书了。\n\
  \n但你为什么会被喜爱的游戏吸引呢？为什么它们如此上瘾？是什么让它们变得有趣？\n\n趣味是游戏的生命所在。如果一个游戏不好玩，就没有人玩它。但你首先必须理解的是，有不同类型的趣味以及不同类型的游戏：\n\
  \n*   **格斗游戏**奖励快速思考、读懂对手的动作并想出合适的连招来反击。\n*   **策略游戏**（如图 1-1 所示的`XCOM 2`）挑战你对各种情况进行思考和规划，有时甚至是。\n\
  *   **冒险游戏**推动你去探索和发现更多周围的世界。\n*   **恐怖游戏**（如图 1-2 所示的`Slender`）让你的肾上腺素飙升，并将你的好奇心推向极限。\n\
  *   **解谜游戏**奖励你解决复杂的。\n*   **平台游戏**（如图 1-3 所示的`Super Meat Boy`）基于奖励和惩罚机制，并挑战你掌握关卡。\n\
  *   **动作游戏**（如`To the Moon`）基于。\n*   **格斗游戏**（如`Super Puzzle Fighter`）基于时机，并挑战你完美执行。\n\
  \n![image](img/9781119404187-fg001.png)\n图 1-1 `XCOM 2`\n\n![image](img/9781119404187-fg002.png)\n\
  图 1-2 `Slender: The Arrival`\n\n![image](img/9781119404187-fg003.png)\n图 1-3 `Super\
  \ Meat Boy`\n\n![image](img/9781119404187-fg004.png)\n图 1-4 `To the Moon`\n\n##\
  \ 在开始之前提出正确的问题\n\n将游戏设计想象成制作好吃的食物。你不会随便把任何食材扔进锅里然后听天由。为了让它味道很好，你首先需要问自己想做什么样的食物。是做沙拉吗？前菜？汤还是甜点？一旦你知道食物的目的是什么——例如作为一份令人满意的主菜还是餐后的甜点——你就可以选择一个能实现目标的食谱。在出炉或混合完食材后，你可能会进行装饰或添加点料让它看起来更好。\n\
  \n\n\n\n同样，在设计游戏之前，你可能需要问问自己你想制作什么类型的游戏，以及谁将来玩这个游戏。在本节中，我列出了一些你应该问问自己的问题。\n\n###\
  \ 你的游戏是关于什么的？\n\n你是想制作一个让玩家置于二战大背景中心的战争游戏，还是制作一个关于闹鬼儿童餐厅的游戏，在那里，机械骨偶机器人试图杀掉你？你的游戏的主题可以帮助你思考故事，并帮助你在设计游戏时为你做出的某些决策提供背景支持。\n\
  \n### 你正在制作什么类型的游戏？\n\n你的游戏是一个基于选择的角色扮演游戏（RPG），还是一个更线性的平台跳游戏？你可以制作许多不同类型的游戏。你选择的类型会极大改变人们看待你游戏的方式。\n\
  \n想象一下，如果《上际卷》（Skyrim）是一个 2D 平台游戏，或者如果《五夜后的 Freddy》（见图 1-5）赋予你移动的能力。想象一下这些游戏会有多大的不同。\n\
  \n![image](img/9781119404187-fg0105.png)\n\nFIGURE 1-5: 《五夜后的 Freddy》。\n\n### 你想通过你的游戏唤起什么样的感觉？\n\
  \n我是想让我的玩家感到强大还是无力？一个鼓励在广阔荒野中探索的游戏，如《辐射 4》（Fallout 4，见图 1-6),唤起的情感与一个将玩家置于狭窄走廊的游戏是不同的。你希望在进入游戏设计时，就已经清楚你想让玩家感受到什么样的感受。知道这一点可以影响机制设计和故事的决策。\n\
  \n![image](img/9781119404187-fg0106.png)\n\nFIGURE 1-6: 《辐射 4》。\n\n### 玩家扮演什么角色？\n\
  \n他是一个战争中为国家战斗的士兵，还是一个在战争周围发生时仅仅努力生存的平民？当你制作游戏时，思考你想要如何构建你的故事或角色。一个勇敢的骑士试图击败她的宿敌——邪恶巫术士的故事，与一个一心想要击败善良巫师的邪恶骑士的故事完全不同。\n\
  \n### 玩家的目标是什么？\n\n游戏是有目标的。有时候，目标是击败反派。其他时候，则是生存到早晨。把你的游戏看作一个故事。角色需要目的。马里奥不仅仅是为了好在蘑菇王国到处乱跑。他是要去拯救公主的。为你的玩家设定明确的目标将为她在游戏中提供方向。即使是侧重于探索的游戏也会设定玩家可以努力实现的目标。即使目标不是你游戏最重要的部分，拥有一个目标也是重要的。\n\
  \n### 你的玩家将面临哪些障碍？\n\n是什么阻碍了玩家达到目标？没有挑战的游戏是不趣的。你永远不希望玩家在你的游戏中感到无聊。防止无聊的最简单方法是理解玩家需要克服什么类型的障碍。这可以表现为试图杀死玩家的敌人角色，或者只是玩家必须解决的谜题。\n\
  \n### 你的玩家是谁？\n\n最重要的问题是你为谁设计游戏。玩像《我的世界》（Minecraft）这样和平游戏的人（见图 1-7）的人，可能和玩《街头霸王》（Street\
  \ Fighter）这样快节奏游戏的人不是同一类。知道你想什么样的类型的人你的游戏有助于决定你创建的游戏类型。\n\n![image](img/9781119404187-fg0107.png)\n\
  \nFIGURE 1-7: 《我的世界》。\n\n## 在纸上创建你的游戏\n\n一个很好的练习是在进入电脑设计游戏之前，先在纸上创建一个游戏。这将帮助你理解游戏机制的重要性，而不会被所有的花里胡哨所困扰。尝试思考一个只需要笔和纸就能玩的简单目标型游戏。\n\
  \n![image](img/c2.png)\n\n`Unity` 是一个你可以免费下载的程序——只需访问 `www.unity3d.com/get-unity`\
  \ 即可。该程序由 `Unity Technologies` 开发，为整一代开发者开启了游戏开发的大。你可以使用 `Unity` 开发 2D 和 3D 游戏，但就本书而言，我将向你如何开发\
  \ 3D 游戏。\n\n在本章中，你将学习一些组织技术，帮助你管理游戏的创建。我将向你展示如何在 `Unity` 中创建一个新文件，向你介绍 `Unity` 的基础布局和控制，并解释如何创建游戏内内容。\n\
  \n\n\n\n图 2-2: 新项目界面。\n\n# 理解 Unity 的布局\n\n当你打开 Unity 时，会看到一个看起来很吓人的界面（如图 2-3 所示）。*不要害怕\
  \ Unity。* 克服这种本恐惧最好的方法是了解屏幕的每个部分的作用，以及它们与你正在创建的游戏的关系。\n\n![image](img/9781119404187-fg0203.png)\n\
  \n图 2-3: 这是你打开 Unity 时看到的内容。\n\n以下是图 2-3 中显示的内容：\n\n*   **场景窗口 (Scene window)：**\
  \ 场景窗口是 Unity 中的两个主窗口之一，可以在这里放置和设置游戏对象。\n*   **游戏窗口 (Game window)：** 游戏窗口是 Unity\
  \ 的另一个主窗口，它让你感知游戏完成后的样子。它是一个预览，让你看到需要进行哪些调整。\n*   **项目窗口 (Project window)：** 项目窗口允许你管理项目的资产。它按类型组织文件。在项目窗口的右上角，你可以搜索特定的资产。此后，项目窗口将允许你访问材质、场景、预制体（prefabs）、脚本和其他资产。\n\
  *   **工具栏 (Toolbar)：** 工具栏位于屏幕顶部（在图 2-4 中有更详细的展示）。它让你能够控制场景，允许你变换对象并在整个场景区域内移动。在工具栏上，你可以找到播放、暂停游戏以及访问\
  \ Unity 云端账户的控件。\n\n以下是你在工具栏上找到的工具：\n\n*   **平移工具 (Pan tool)：** 抓住屏幕本身并移动相机，以便更好地查看游戏对象或世界。\n\
  *   **移动工具 (Translation tool)：** 沿着 3D 的三个轴（X、Y 和 Z）移动你的对象。\n*   **旋转工具 (Rotation\
  \ tool)：** 绕三个轴旋转对象。\n*   **缩放工具 (Scale tool)：** 允许你调整对象的大小，使其在三个轴上变大或变小。点周围的正方形也是缩放工具，但它是从对象的角进行缩放的，而不是仅仅从中心或轴点。\n\
  *   **坐标轴工具 (Gizmo tool)：** 调整对象上*轴点*（对象旋转或缩放的点）的位置，以及你遵循的轴方向。\n*   **播放按钮 (Play\
  \ button)：** 启动游戏，以及任何游戏启动时触发的物理或事件。再次按下播放按钮会将游戏重置为开始。\n*   **暂停按钮 (Pause button)：**\
  \ 在播放期间暂停游戏。\n*   **步进按钮 (Step button)：** 播放后逐帧移动场景。\n*   **云按钮 (Cloud button)：**\
  \ 允许访问 Unity 的云端服务（参见相邻的侧边栏）。\n*   **账户下拉菜单 (Account drop-down menu)：** 允许在线访问你的\
  \ Unity 账户。\n*   **层下拉菜单 (Layer drop-down menu)：** 允许更改场景中可见的层或对象。\n*   **布局下拉菜单\
  \ (Layout drop-down menu)：** 允许更改 Unity 的整体布局以更好地适应你的风格。\n*   **检查器窗口 (Inspector\
  \ window)：** 检查器允许你检查并修改选取对象的属性。这些属性随对象而异，因此检查器窗口布局在整个工作过程中变化最大，但知道如何在此窗口操作对于创建游戏至关重要。\n\
  *   **层级面板 (Hierarchy)：** 层级列出了场景中所有的游戏对象以及它们之间的关系。你可以使用场景窗口选择这些对象，也可以通过层级面板选择。将层级面板视为项目内所有内容的列表。\n\
  *   **控制台窗口 (Console window)：** 控制台窗口位于 Unity 屏幕的最底部。它的主要目的是直接显示来自 Unity 的消息。通常，你在这里看到的是错误信息，往往与项目代码直接相关。当你编写游戏代码时，控制台窗口最有用，因为它能帮助你缩小游戏哪些部分没有正常工作以及原因。\n\
  \n![image](img/9781119404187-fg0204.png)\n\n图 2-4: 工具栏。\n\n## 场景导航\n\n在创建游戏时，能够在场景中导航是非常重要的。你需要能够移动和旋转场景控件，以便控制和创建你的游戏。主要有三种方法可以：\n\
  \n*   **平移 (Panning)：** 平移是在场景中上下或左右移动。如果你使用鼠标，通过按住中间键进行平移。如果你使用触控板，通过按住 `Alt` 键进行平移。\n\
  *   **旋转 (Rotating)：** 旋转让你围绕场景移动，就像站在原地。如果你使用鼠标，通过按住 `Alt` 并移动进行旋转。\n*   **缩放 (Zooming)：**\
  \ 缩放让你靠近或远离场景。如果你使用鼠标，通过滚动滚轮进行缩放。如果你使用触控板，通过双指上下滑动进行缩放。\n\n## 创建游戏对象\n\n当你知道如何导航场景时，就可以准备创建对象了。在\
  \ Unity 中创建对象有两种方法。你可以选择 `GameObject` 菜单（在 File 菜单附近），或者在层级面板选择 `Cube`。\n\n在开始之前，重置对象的起点以确保它位于中心。重置起点遵循以下步骤：\n\
  \n1.  选择要重置的对象。\n2.  进入对象的 `Inspector` 窗口（参见图 2-5）。\n3.  在 `Transform` 部分点击右上角的齿轮图标。\n\
  4.  点击 `Reset`。\n\n你知道工具栏可以变换对象，但在 `Inspector` 窗口中有另一种更精确的方法。检查器的变换部分可以通过特定数字移动、缩放和旋转对象：\n\
  \n*   **位置 (Position)** 表示相对于场景中心的位置。\n*   **旋转 (Rotation)** 表示对象相对于每个轴的角度。\n* \
  \  **缩放 (Scale)** 表示对象相对于原始大小的缩放比例。\n\n尝试这些控件以熟悉它们。然后将立方体的 X、Y、Z 轴 `Scale` 设置为 4（如图\
  \ 2-6 所示）。\n\n![image](img/9781119404187-fg0206.png)\n\n图 2-6: 缩放为 0,0,4。\n\n你创建了一个立方体对象，但\
  \ Unity 中还可以创建其他对象。以下是简要概述：\n\n*   **3D 对象：** 这些是 3D 游戏中的普通对象。3D 对象包括：\n\n    *\
  \   立方体 (Cube)\n    *   球体 (Sphere)\n    *   胶囊体 (Capsule)\n    *   圆柱体 (Cylinder)\n\
  \    *   平面 (Plane)\n    *   四边形 (Quad)\n    *   布娃娃节点 (Rag-doll)\n    *   地形 (Terrain)\n\
  \    *   树 (Tree)\n    *   风域 (Wind Zone)\n    *   3D 文字\n\n\n\n\n\n*   **2D 对象\
  \ (2D objects):** 你通过此菜单只能创建一种类型的 2D 对象：精灵（sprites）。精灵是图像，你可以通过编程让其变化以根据不同的动作显示不同的内容——从角色跑步到角色射击或说话无有不在。\n\
  \n*   **空物体 (Empties):** 空物体是放置在场景中的不可形对象，用于控制或标记场景的某些属性。它们在导出游戏时不会显示，仅作为游戏内部的控制物运行。\n\
  \n*   **灯光 (Lights):** 灯光可以照亮场景，并根据光照设置改变视觉效果。灯光主要用于照亮角色和环境，帮助渲染 3D 角色。\n\n*   **音频和视频\
  \ (Audio and video):** 音频和视频菜单帮助将视频和声音渲染到你的游戏中。这些内容从背景噪音/场景到音乐和对话不等。\n\n*   **UI:**\
  \ `UI` 代表 `user interface`（用户界面）。它改变了玩家玩游戏时在屏幕上看到的内容。它可以涵盖告知玩家操作方法的文本到图像和血条不等。\n\
  \n*   **粒子系统 (Particle systems):** 粒子系统包含各种可以在屏幕上看到的不同效果，从倾盆而下的水到爆炸的火花。\n\n*   **相机\
  \ (Cameras：** 相机充当玩家观察游戏的眼睛。它们可以是固定的，也可以跟随玩家移动，但它们的主要目的是确定游戏的构图方式。这看起来可能不重要，但游戏的视角可以改变游戏本身的很多东西。例如：一个被构图为俯视视角的第一人称射击游戏，即使控制方式完全相同，游戏体验也会大不相同。\n\
  \n## 创建和使用预制体 (CREATING AND USING PREFABS)\n\n预制体（Prefabs）创建多个具有相同属性和形状对象的简单方法。创建非玩家角色（NPC）或游戏内对象可能非常痛苦，但通过预制体，你可以重复使用资源，而无需复制粘贴并创建多个可以单独编辑的对象。\n\
  \n预制体是存储的游戏对象，它们保留相同的属性，并且可以随时放置到游戏场景中。假设你有一个 `collectible`（你的角色需要拾取的物品）。与其反复创建数百个相同的对象，你可以使用预制体来创建所有对象，并在根据需要调整预制体。预制体易于使用且能节省大量时间。\n\
  \n创建预制体很容易，但首先你想要确保创建一个文件夹来存储你的预制体，以保持整洁。请遵循以下步骤：\n\n1.  **在 Project（项目）窗口中，确保没有选中其他内容。**\n\
  2.  **点击 Create New Folder（创建新文件夹）。**\n    新文件夹将出现在 `Assets` 文件夹中。\n3.  **将新文件夹命名为\
  \ `Prefabs`。**\n4.  **选择你想要转换为预制体的对象——在这种情况下，是那个 4x4x4 的立方体。**\n5.  **将对象从 Hierarchy（层级）窗口拖入到\
  \ Project 窗口中的 `Prefabs` 文件夹中。**\n    将创建一个该对象的预制体，如图 2-7 所示。\n\n![image](img/9781119404187-fg0207.png)\n\
  \n图 2-7： 预制体。\n\n创建预制体后，你可以在 Project 窗口中选择预制体，对场景中的所有预制体进行修改并添加新组件。例如，你可以更改对象的大小、改变颜色或给它添加重力。\n\
  \n尝试向你在 Project 窗口中的预制体添加 `Rigidbody` 组件，看看会发生什么：\n\n1.  **点击 Add Component（添加组件）。**\n\
  2.  **选择 Physics（物理）。**\n3.  **选择 Rigidbody。**\n4.  **点击工具栏上的 Play（播放）。**\n\n立方体从天空中掉落了。这是因为你刚刚为它们添加了重力。我将在第\
  \ 4 章中更详细介绍 `Rigidbody` 组件，但现在请遵循以下步骤：\n\n1.  **再次点击 Play 按钮以重置游戏。**\n2.  **选择 3D\
  \ Object  Plane（3D 对象-平面）。**\n    这将在 `Scene` 窗口创建一个平面。\n3.  **在 Inspector（检查器）窗口中重置平面的原点，就像你之前处理立方体那样（使用\
  \ Inspector 窗口右上角的齿轮图标）。**\n4.  **使用平移工具沿 `y`-轴移动立方体，使其位于盒子下方。**\n\n![image](img/c3.png)\n\
  \n在本章中，你将学习第一个关卡背后的核心概念，以及如何为你的游戏设计一个良好的引导关。除此之外，本章还将教你一些关卡设计的基础知识，你以后可以使用这些知识为你未来的游戏设计自己独特的关卡。\n\
  \n为了创建清晰且有趣的关卡，你必须从最基础的开始考虑它们，而不是从最终完善的形式开始。一个拥有精美图像但机制枯燥的游戏只是一个无聊的游戏，但设计师多年来一直将人们吸引到游戏中，从它们在屏幕上只有几个像素时就开始了。\n\
  \n本章将向你展示如何在设计时搁置主题，以便你从一开始就能创造出最有吸引力的游戏玩法。\n\n## 理解关卡重要性 (UNDERSTANDING THE IMPORTANCE\
  \ OF LEVEL)\n\n在书籍或电影中，开头几页或几分钟至关重要。它们是抓住观众的钩子。在游戏中，第一个关卡就是卖给玩家的东西。\n\n游戏历史上有很多优秀的关卡（开头分钟）——超级马里奥（参考图\
  \ 3-1）、肉肉男孩（参考图 3-2）以及《质量效应 2》（参考图 3-3），仅举此类。这些游戏的第一个关卡都不多余。它们只提供了为了理解游戏的必要信息。即使是《质量效应\
  \ 2》展示了极美的星球背景，也不过分，因为该关卡本意是为了激发敬畏和惊奇感。\n\n![image](img/9781119404187-fg0301.png)\n\
  \n图 3-1： 马里奥的世界 1-1。\n\n![image](img/9781119404187-fg0302.png)\n\n图 3-2： 肉肉男孩的世界\
  \ 1-1。\n\n![image](img/9781119404187-fg0303.png)\n\n图 3-3： 《质量效应 2》开头。\n\n## 设计你的第一个关卡\
  \ (DESIGNING YOUR FIRST LEVEL)\n\n设计你的第一个关卡类似于尝试解决你的第一个代数方程或完成你的第一个上篮：你不会在第一次就做得完美。事实上，第一次尝试设计出一个完美的关卡是不可能的，所以不要有压力！\n\
  \n### 思考机制与主题 (THINKING ABOUT MECHANICS AND THEME)\n\n\n\n\n在开始游戏之前，请确保你已经知道想要游戏中包含哪些核心机制。这些信息在你开始设计关卡时将非常有帮助。问问自己你的游戏机制是什么，并理解这些机制与你的游戏主题之间的关系。\n\
  \n不仅了解你的机制，了解它们所相关的故事，将帮助你找到介绍游戏不同控制方式的最佳方法以及介绍顺序。你的机制和主题适合传统的教程吗？还是说游戏更适合一种更含蓄的方法？\n\
  \n当你开始设计第 1 关卡时，考虑向玩家介绍游戏的最佳方式。你应该从一个动作感较强的场景开始，让玩家直接进入这个世界吗？还是你的游戏应该以一种更平静的方式开始？\n\
  \n你将在本书书中构建的游戏是一个发生在一个卡通世界中的 3D 平台游戏。正因如此，你将遵循《超级马里奥兄弟》的模式，通过关卡慢慢引入概念，并随着关卡的进展逐渐增加难度。\n\
  \n## 绘制草图\n\n在担心具体的测量值或关卡的规模之前，你需要对关卡的大致样子心中有数。为了这一点，我建议你使用一张白纸或白板，这样你就可以产生想法时随时擦除并重新修改。将这个过程类比为论文的大纲。它允许你以未经润色的形式表达所有的想法。然后你可以根据喜意进行精炼、添加和删减。\n\
  \n在图 3-4 的示例中，你可以看到关于关卡重要内容的注释。我包含了敌人、斜坡和落差作为游戏设计的重要部分。你还会看到一些移动平台，以及关卡末尾的一些尖刺。这并不是最终关卡样子的完美呈现，但它为需要转化成关卡更深层的设计提供了坚实的思路。\n\
  \n![image](img/9781119404187-fg0304.png)\n\n图 3-4： Boxo 第 1 关草图。\n\n利用这段时间考虑如何向玩家介绍游戏的新机制或新方面。第\
  \ 1 关不应该直接从陡峭的坠落或惩罚性的游戏时刻开始。它应该是一个基于之前发生的事情的学习体验。随后的关卡可以增加难度，但如果没有合适的早期关卡向玩家教授机制，任何后期的难度激增对新玩家来说都会感觉是毫无根据的甚至是严酷的。\n\
  \n你永远不想让玩家觉得被你的游戏欺骗了，所以在将他们推入深水区之前，给玩家学习游戏技巧的时间。如果你能正确地引入难度，完成关卡的回报将大于失败的挫败感。\n\n\
  ## 按比例绘制你的第一关关卡\n\n在你构建完关卡的大纲之后，是时候确定关卡的规模了。此此的最佳方法是使用网格或某些绘图纸来画出更完善的关卡设计。在开始绘图之前，确定\
  \ `Unity` 中方框与单位测量之间的比例。但一旦你确定了该比例，你就应该根据早先的设计画出一个更完善的关卡。\n\n图 3-5 使用了一比一的比例，网格上的每个框代表\
  \ `Unity` 内部一个单位测量。在第 9 章和第 12 章中，我涵盖了 `Unity` 的比例如何与其他程序（如 `Blender`）相关，但现在你只需要识别对象在\
  \ `Unity` 比例中是如何相互相关的。从粗略观察图 3-5，你会注意到 `Boxy`（玩家角色）在 `Unity` 中是四个单位大。在设计关卡的其他部分时，请记住角色的比例。关卡中的一切都是基于\
  \ `Boxy` 的比例的，并围绕角色的比例设计。\n\n![image](img/9781119404187-fg0305.png)\n\n图 3-5： Boxo\
  \ 第 1 关。\n\n为什么比例在游戏设计中很重要？\n\n- **它可以帮助你确定难度并理解角色必要的移动需求。** 如果你确定角色的最大跳跃距离是五个单位，你就不会创建角色无法跨越的距离。\n\
  - **它可以帮助你跟踪对象之间的相互关系。** 如果墙和尖刺路径的比例恰当，你就能更容易地构建出一个有趣的关卡。\n\n使用网格纸，你能够更好地将该比例转化到你的游戏中，并能更有效地构建你的游戏。保持比例可以防止你构建不符合游戏其他部分的物体或场景。如果角色爬上一堵不符合其跳跃能力的墙，会非常突兀。记住：组织良好的一切——对于你的比例也是如此。\n\
  \n## 创建灰盒关卡（Gray-box Level）\n\n灰盒关卡是使游戏变得可玩而所需的最小化设计。将其看作一次排练，以确保你的游戏运行正常。灰盒关卡类似于电影中的分镜，分镜是在任何拍摄之前表达电影的一种方式。在电影中，分镜被用来检查故事是否易于理解。虽然一些明显的问题可以通过剧本阅读和编辑发现，但分镜能让电影人员看到需要移动某个场景或完全删除某些情节来使电影更好。\n\
  \n关卡设计也是如此。虽然你可以在早期草图中看到一些明显的问题，但在玩家尝试之前无法捕捉所有问题。通过创建灰盒关卡，你可以在投入过多精力之前对游戏进行编程和修复。及早发现\
  \ Bug 是创建优秀游戏的关键！\n\n## 创建你的制体（Prefabs）\n\n当你打开 `Unity` 构建关卡时，要做的第一件事是创建整个游戏使用的制体。请记住，对于你将在书中设计的游戏，角色移动的方向沿\
  \ z 轴（从左到右）。\n\n查看你关卡的最新设计，并记录整个关卡中多次使用的对象或角色。我将在第 9 章和第 10 章中涵盖如何构建动画角色或对象，但现在，这些动画的简单替代品就足够。在图\
  \ 3-2 中，你可以创建几种不同的制体，包括一些楼梯、墙壁以及稍后包含的移动平台的替代品。\n\n让我们从楼梯开始。为了这一点，你将使用一个立方体。遵循以下步骤：\n\
  \n1. **创建一个立方体，并点击检查器面板右上角的齿轮来重置立方体的位置和旋转。**\n\n\n\n\n\n2. **将立方体的缩放设置为 (X=8, Y=2,\
  \ Z=6)。**\n\n这创建了三级阶梯的底部。如果你想要更长的楼梯，请增加 `Z` 轴缩放。\n\n3. **将立方体命名为“Stairs（楼梯）”。**\n\
  \n4. **创建一个新的立方体，并重置它的位置和旋转。**\n\n5. **将缩放设置为 (X=8, Y=2, Z=4)。**\n\n这个楼梯阶必须比上一个短一点，因为需要有一个渐进的过程。\n\
  \n6. **将此立方体的位置更改为 (X=0, Y=2, Z=1)。**\n\n7. **使用 `Inspector` 将立方体重命名为“Step 2”。**\n\
  \n8. **创建第三个立方体，并重置它的位置和旋转。**\n\n9. **将缩放设置为 (X=8, Y=2, Z=2)。**\n\n10. **将此立方体的位置更改为\
  \ (X=0, Y=4, Z=2)。**\n\n11. **使用 `Inspector` 将立方体重命名为“Step 3”。**\n\n请参考图 3-6 查看你的效果示例。\n\
  \n12. **使用层级菜单将 `Step 3` 拖入 `Step 2` 创建 `Parent（父物体）`。然后将 `Step 2` 拖入 `Stairs`，将\
  \ `Step 2` 和 `Step 3` 都设置为 `Stairs` 的子物体。**\n\n父物体控制子（至少在游戏中是如此的！）。当一个对象父化时，意味着该对象受该对象旋转、平和平缩放的影响。当父物体改变时，子物体也会随之改变，但子物体自身的缩放、旋转和平移不受影响，这在我们第\
  \ 12 章将动画对象引入游戏时将非常重要。\n\n13. **从 `Hierarchy（层级）` 菜单将 `Stairs` 拖到之前创建的 `Prefabs`\
  \ 文件夹中（参考第 2 章），以创建一个 `Stairs` 预制体，它不仅会改变 `Stairs`，还会改变挂在 `Stairs` 下的对象。**\n\n![image](img/9781119404187-fg0306.png)\n\
  \n图 3-6： 楼梯。\n\n创建楼梯预制体后，你会发现选中它时，`Inspector` 顶部现在有一个 `Prefab` 区域。在“Prefab”旁边有三个按钮：\n\
  \n*   **Select（选择）：** 在 `Project（项目）` 窗口中选择该 `Prefab`\n*   **Revert（还原）：** 撤销你对预制体所做的任何更改，恢复到标准预制体设置\n\
  *   **Apply（应用）：** 更改*所有*使用该预制体的对象，使其匹配你所选择的一个\n\n要测试这一点，请按照以下步骤操作：\n\n1. **将第二个和第三个楼梯拖到\
  \ `Scene（场景）` 窗口。**\n2. **使用 `Project` 窗口中的 `Create` 下拉菜单创建一个新材质并选择 `Material`。**\n\
  3. **更改材质的颜色。**\n4. **将该新材质拖到其中一个楼梯上。**\n5. **选中楼梯并点击 Apply。**\n\n你所有使用该预制体的对象现在都将更改为这种颜色。\n\
  \n现在删除楼梯。你不需要担心重新制作。在创建对象的预制体后，Unity 会自动拥有该预制体的副本供参考。因此，现在每当你需要楼梯时，只需将楼梯拖入场景即可。\n\
  \n你应该创建的后续预制体有：\n\n*   **墙墙：** 墙必须足够高，让你的角色必须跳过去，并且足够宽，以防止玩家直接绕过去。对于书中的游戏，`X` 轴缩放应为\
  \ 30，因为这将是我们关卡的宽度。墙的尺寸应为 (X=30, Y=2, Z=2)。\n*   **移动平台的替代品：** 作为移动平台的替代品，你将创建跨越关卡某些区域之间长间隙的木板。这些木板应该比墙或楼梯薄得多，并且容易攀爬。它们在\
  \ `Z` 轴上也需要足够长以跨越。通过图 3-2，你可以确定其中一块木板的长度至少需要 31。木板的尺寸应为 (X=4, Y=0.5, Z=31)。\n* \
  \  **敌人角色和刺的替代品：** 敌人角色的替代品目前只需要静止的立方体，位于敌人角色将移动区域的中心点。你将在 `Blender` 中制作它们的移动动画，因此在构建关卡和测试死亡机制时，你只需要一个静止的替代品。敌人的替代品尺寸应为\
  \ (X=2, Y=2, Z=2)。\n\n刺也会用 `Blender` 制作，因此在构建关卡和测试死亡机制时，你只需要一个静止的替代品。\n\n### 构建你的关卡\n\
  现在你已经有了预制体，开始构建关卡吧。\n\n\n\n\n当你完成关卡的基础平台构建后，现在是时候在关卡中放置预制体（prefabs）了。让我们从楼梯开始。打开你的\
  \ `Prefabs` 文件夹并拖入一个楼梯。\n\n此时，你可以进行与之前非常相似的操作，但实际上还有另一种放置物体的方法。通过按下键盘上的 `V` 键，你可以激活`Vertex\
  \ Snapping”（顶点吸附），这允许你抓取 `GameObject` 的 `vertex`（顶点/角）并将其`snap`直接放置）到另一个对象的顶点。在构建关卡时，这可以为你节省大量的时间和心力——尤其是当你需要在一个没有像我们之前那样精确测量的关上放置\
  \ `GameObject` 时。\n\n`Vertex Snapping` 的问题是它只在 Unity 的正交视图（orthographic views）中真正有效。\n\
  \n另一个可以帮助你堆叠物体而无需进行大量计算的快捷键是`Surface Snapping”（表面吸附）工具。按下 `Shift+Ctrl`（Windows）或\
  \ `Shift+Command`（Mac），你就可以移动物体使其吸附到其他对象的表面，这使得放置楼梯、怪物或木板等物体变得容易得多。\n\n首先，开始使用 `Surface\
  \ Snapping` 将楼梯放置在关卡上。参考图 3-9 查看其预期外观。\n\n![image](img/9781119404187-fg0309.png)\n\
  \n图 3-9： 带有楼梯的第一关卡。\n\n你会立即发现楼梯对于两个上方平台之间的中间部分来说太大了。幸运的是，预制体的优点之一就是你可以修改其中一个，而不影响场景中的其他一个。只需删除楼梯顶部的台阶，然后将其旋转并放置在合适的位置。只要你不在\
  \ `Inspector` 中点击 `Apply` 按钮，此更改就不会影响场景中的其他预制体。\n\n在你完成场景中所有楼梯的放置后，将开始放置用于移动平台的木板占位符。因为在你能够通过\
  \ `Blender` 创建移动物体之前，它们将充当占位符，所以你希望它们仍然提供与之后添加移动平台类似的挑战感。实现此点的最佳方法是将木板跨越间隙但保持角度，如图\
  \ 3-10 所示。在放置木板时，你会发现它们可能对于你创建的间隙来说不够大，或者太大了。和楼梯一样，你可以更改这些木板的形状和大小以更好地符合你的需求，而不会改变序列中其他预制体。\n\
  \n![image](img/9781119404187-fg0310.png)\n\n图 3-10： 跨越间隙放置的木板。\n\n在这个阶段，你希望你的游戏是最终形态的骨架。即使在这个阶段，也要尽力捕捉你想要在游戏中实现的整体感觉。在狭窄木板上行走的紧张感可以带来与从移动平台跳下相同的坠落恐惧。始终考虑玩家会对某种情况做出反应。你甚至可以设置玩家必须在两块不同的木板之间跳跃才能到达另一侧，以此增加由于高度带来的紧张感。\n\
  \n进一步进入你的关卡并对其进行更多自定义，以符合你的设。添加更多玩家必须克服的木板或障碍物。在第 9 章到第 12 章制作敌人时，添加更多占位符。\n\n游戏设计就是制作一个你自己想要玩的游戏。当你设计关卡时，问问自己什么会吸引你，并将其加入其中。\n\
  \n完成关卡后，确保你没有遗漏任何东西，或者没有玩家无法跨越的间隙。确保游戏具有逻辑上的进度感，这将奖励玩家而不是惩罚他们。根据需要进行调整。参考图 3-11\
  \ 作为示例。\n\n![image](img/9781119404187-fg0311.png)\n\n图 3-11： 完成的灰盒关卡（gray-box level）。\n\
  \n## 为你的关卡赋予目标和方向\n\n目标是游戏的灵魂。没有明确的目标，玩家就不知道为什么要玩。当你设计第一个关卡时，你必须决定关卡的任务是什么。是拯救公主、生存，还是到达终点？无论是什么，它必须是清晰的。\n\
  \n完成关卡后，确保你没有遗漏任何东西，或者没有玩家无法跨越的间隙。确保游戏具有逻辑上的进度感，这将奖励玩家而不是惩罚他们。根据需要进行调整。\n\n## 让目标脱颖而出\n\
  \n道具物品并没有从背景中脱颖而出。那么，如何让道具物品从场景的其他部分脱颖而出呢？有多种方法可以实现这一点：\n\n*   你可以让物体轻微移动。\n*  \
  \ 你可以在物体上放置灯光，使其在你看向它时发光。\n*   你可以让物体与周围物体相比具有不寻常的形状或大小。\n*   改变物体颜色或色调，使其从背景中脱颖而出。\n\
  \n在本章中，你将遵循上一个示例。你已经在地图周围放置了所有目标，但预制体的使用防止了这项任务变得比需要的更加琐碎。只需创建一个新材质并将其应用到物体上（参考图\
  \ 3-13）。\n\n\n\n\n将材质应用到对象后，转到检查器（Inspector）并点击 `Apply`。你的颜色将应用到所有的目标预制体（prefabs）上。现在，你有一个不仅引人注目，还能引导玩家向你希望他们的方向前进的关卡！\n\
  \n![image](img/c4.png)\n\n在本章中，你将学习游戏开发背后的基础：编程。本章将解释你如何让游戏具有交互性，以便人们能够`play`你的游戏。我将向你展示一段简单的移动代码，你可以将其作为未来编程的起点。我还会解释代码的不同方面面，以及每段代码背后的核心思想。\n\
  \n在这里，你还将学习如何编写角色程序，让她能够捡起你在第 3 章中创建的收集物品，这涉及到创建和应用对象标签（tags）。你将学习如何编写简单的代码，让摄像头跟随你的角色穿过整个关卡。这些代码将作为我将在第\
  \ 5 章中涵盖的一些更复杂代码的介绍。你在本章中学到的内容将在下一章得到扩展。\n\n## 游戏开发的三个 C (THE THREE CS)\n\n当你制作游戏时，请记住游戏开发的三个\
  \ C：摄像头（camera）、角色（character）和控制（control）。这三个 C 是了玩家进入你希望创造的世界的主要入口。它们是你游戏中玩家始终在处理的方面。当你理解了这三个\
  \ C 中的每一个在游戏中扮演的角色时，你将不仅更好地理解你的游戏，还能理解你创建或游玩的所有游戏。\n\n### 摄像头 (CAMERA)\n\n摄像头是玩家观察游戏的窗口。它是玩家看到并对其做出反应的对象。游戏中摄像头的放置至关重要，因为玩家对你游戏世界的基本理解将通过摄像头体现。\n\
  \n在电影中，摄像头只显示摄影师和导演想要观众看到的内容。改变摄像头的位置可以改变整个场景的感觉，或者在某些情况下，完全会破坏该场景。\n\n你的游戏摄像头应该被对待得与电影机非常相似。问题在于，在游戏中，你不能总是控制玩家（或摄像头）去向哪里。当你创建摄像头时，必须决定让玩家对摄像头拥有多大的控制权，以及你是否会以任何方式限制这种控制权。锁定在玩家角色背后的摄像头揭示的信息与位于玩家角色上方或侧面的摄像头不同。玩家拥有完全控制权或玩家可以旋转的摄像头会向玩家揭示来自世界各处的信息——但它们也可能揭示你不希望玩家看到的游戏方面。\n\
  \n### 角色 (CHARACTER)\n\n角色是玩家在游戏中扮演的身份。这可能具有欺骗性，因为在游戏开发的这个阶段，角色的主题并不重要。当你编写游戏代码时，角色是一个细节详尽的士兵还是一个箱子都是无关紧要的。当你思考角色时，你需要考虑的是你的角色在游戏中究竟做了什么。问问自己以下问题：\n\
  \n* 角色会跳跃吗？如果是，跳得有多高？\n* 角色是否有四向移动（前、后、左、右），还是角色只能前后移动？\n* 我的角色是否有任何武器或工具？如果有，它们是什么？\n\
  \n角色的移动方式不仅改变了你的游戏类型，还改变了你编写游戏的方式。第一人称射击游戏与平台跳游戏的代码完全不同。即使是不同类型的平台跳游戏，也可以有多种不同的代码，仅仅因为你希望角色拥有不同类型的控制权。\n\
  \n### 控制 (CONTROL)\n\n控制是玩家与游戏交互的方式。将游戏与其他所有类型的娱乐媒体区分开来的特点是它们与观众互动的独特能力。玩家不像看书、电影或电视节目那样阅读或观看事件发生。他们在体验中扮演着活跃的角色，并对角色投入感情，因为他们`就是`角色本身。\n\
  \n控制决定了一个游戏的成败。一个控制设置糟糕的游戏，无论图形或故事有多好，都永远无法像控制良好的游戏那样让玩家产生共鸣。你玩游戏是因为它们让你感到处于掌控之中，所以当你设计游戏时，你必须考虑控制如何与玩家交互，以及你如何让尽可能多的人都能上手游戏。\n\
  \n例如，当你考虑电脑游戏中的移动时，你想起了哪些键？可能是 `W`、`A`、`S` 和 `D` 键。但为什么呢？为什么游戏设计师不使用 `6`、`Caps Lock`、`Enter`\
  \ 和 `Spacebar` 键呢？毕竟，这些键也与不同的方向有关。设计师通常使用 `W`、`A`、`S` 和 `D` 的原因是他们不希望玩家为了实现每个预期效果而花费太多精力去玩游戏。如果你必须移动手太多，或者停下来思考控制键，这会破坏你对游戏的沉浸感，从而杀死这种体验。你希望玩家想到某事的时间和执行该操作的时间尽可能缩短，这样玩家就永远不会在游戏中打破沉浸感。\n\
  \n## 创建角色替身 (CREATING A CHARACTER STAND-IN)\n\n在第 3 章中，你创建了一个完整的灰盒（gray-box）关卡。查看图\
  \ 4-1 了解灰盒关卡如何让你测试控制，这是在添加`皮肤`（外观）之前。\n\n![image](img/9781119404187-fg0401.png)\n\
  \nFIGURE 4-1: 灰盒关卡。\n\n同样，角色替身是一种让你编写并测试角色、控制和摄像头的方法，而无需先创建一个详细的角色。替身帮助你专注于玩家对游戏的体验，而不是游戏本身。就像灰盒关卡一样，你的角色替身不需要非常复杂就能传达观点。替身要做的一件事就是与背景区分开。要创建替身，请遵循以下步骤：\n\
  \n1. 进入 `GameObject` 并创建一个 `Cube`。\n2. 使用移动工具将立方体移动到关卡的开始。它不需要直接放在关卡顶部，至少要在它上方。\n\
  3. 进入项目窗口中的 `Assets` 文件夹，创建一个名为 `Materials` 的新文件夹。\n4. 将现有材质移动到该文件夹中。\n5. 创建一个新的\
  \ `material` 并将其应用到 `cube`。\n6. 更改 `material` 的颜色，让玩家与背景明显区别开。\n\n![image](img/9781119404187-fg0402.png)\n\
  \nFIGURE 4-2: 你的角色替身。\n\n## 关于代码 (THINK ABOUT CODE)\n\n什么是代码？当你考虑到代码时，你可能会想到电影里的黑客穿过\
  \ 0 和 1 的墙来破解金库代码。你认为这是一种需要大量的数学和计算才能解决的问题。\n\n\n\n\n编码确实需要数学，但它更像是学习一门新语言，而不是做数学。编码只是用计算机能理解的语言告诉计算机或游戏你想让它做什么。问题是计算机是愚笨的，所以当你编写代码时，你必须编写`everything`。\n\
  \n例如，假设你有一个机器人，你想编写它来制作一个花生酱果胶三明治。为了实现这一点，你必须编写制作这种三明治涉及的每一个步骤。试着写出制作花生酱果胶三明治所需的所有步骤，然后回到这本书。我等你的！\n\
  \n很有可能，你列出的列表并没有想象中那么详细。为了让机器人制作花生酱果胶三明治，你需要这些步骤：\n\n1. `转身面向柜子。`\n2. `向柜子移动。`\n\
  3. `打开手。`\n4. `向上旋转手臂至手手。`\n5. `手握住手手。`\n6. `打开柜子。`\n7. `松开手手。`\n8. `手移动到花生酱。`\n\
  9. `抓取花生酱。`\n10. `从柜子中取出花生酱。`\n11. `将花生酱放在柜台上。`\n12. `手移动到果酱。`\n\n这些仅仅是取出花生酱和果胶的步骤！在实际代码中，你必须为机器人编写每一步的总距离，以及它到达柜子需要多少步。你还需要编写程序让它知道什么是果酱和花生酱，以及面包片、盘子和刀。\n\
  \n编码的核心在于为计算机列出清晰的指令供遵循。在游戏中，你的代码不仅要独立运行，还要对玩家在游戏中的操作做出反应。\n\n## 添加刚体组件（RIGIDBODY）并理解盒碰撞体（BOX\
  \ COLLIDERS）\n\n在开始编写角色代码之前，Unity 提供了一种方法，让你轻松地向对象应用物理和其他力。你不需要担心编写重力和和其他力的代码，因为它们都包含在\
  \ `Rigidbody` 组件中。`Rigidbody` 组件使得外部作用力和物体实际上可以对游戏中的物体产生影响。\n\n例如，假设你在空场景中创建一个立方体。当你点击`Play`\
  \ 时，在没有 `Rigidbody` 制的情况下，立方体将停留在空中，因为立方体不受任何外力的影响并将保持静止。如果你为立方体添加一个 `Rigidbody`\
  \ 组件然后点击`Play`，立方体将永远掉落，因为没有任何东西支撑它。现在重力可以作用于它了，它将无限地掉落。如果你在立方体下方添加一个单独的对象或平面，立方体将落在该物体或平面上。这是由于另一个已经添加到所有\
  \ 3D 物体中的组件：`collider`（碰撞体）。\n\n`collider` 是一个包围在 3D 游戏对象周围的不可见轮廓，用于在一个物体与另一个物体“碰撞”时发出信号。不同物体的碰撞体之间相互作用，并在两个物体接触时发出信号。你可以通过选择对象并进入\
  \ `Inspector` 窗口来访问 `collider`。你可以调整 `collider` 的大小，使其比物体大或更小。\n\n你还可以调整 `collider`\
  \ 的中心点，这会在你的物体周围移动。大多数物体自然带有 `collider`，但如果没有，你也可以随时添加一个。要添加 `collider`，请遵循以下步骤：\n\
  \n1. 在 `Inspector` 窗口底部，你会看到一个 `Add Component` 按钮。\n2. 点击 `Add Component` 并选择 `Physics`。\n\
  3. 从 `Physics` 菜单中选择所需的 `collider`（参见 `Figure 4-3`）。\n\n![images/978119404187-fg043.png]\n\
  *图 4-3: 添加 Rigidbody 组件。*\n\n不同的碰撞体具有不同的形状。`mesh collider` 是最功能多万用途的。它可以包围不同类型的网格。你还可以使用\
  \ `Add Component` 按钮为对象添加多个碰撞体。\n\n为玩家添加 `Rigidbody` 组件将使你的角色在基础的前进和侧移之外具备跳跃和掉落的能力。要为角色添加\
  \ `Rigidbody`，首先确保你在 `Scene` 窗口中选择了右侧。然后按照步骤 1 到 2 进行。当进行到步骤 3 时，不要选择 `collider`，而是选择\
  \ `Rigidbody`。\n\n要测试物体上的 `Rigidbody`，只需点击屏幕顶部的 `Play` 按钮。物体应该会掉落在你创建的关卡上。现在你的物体受到重力的影响，是时候编写代码了，以便你使用键盘让它移动和跳跃。\n\
  \n## 编写你的玩家代码\n\n在 Unity 中创建代码时，你实际上是离开对象单独创建代码，之后将其附加到对象，而不是直接对对象进行编码。这种方法的用处是，你可以轻松地将创建的代码传输到其他对象，使得从灰盒（gray-box）关卡的迁移变得极其简单。这意味着你需要单独创建代码并将其存储在其他地方。\n\
  \n第一步是在 `Project` 窗口的 assets 文件夹中创建一个新文件夹，并命名为 `Code`。这将是你存储在此游戏中编写的所有代码的地方。养成这种习惯是好的——良好的组织可以节省你数小时的工作。\n\
  \n在创建了存储所有代码的文件夹后，你必须创建一个将用于编写代码的文件：\n\n1. 确保选中了 `Code` 文件夹。\n2. 点击 `Create`。\n\
  3. 选择 `Create` ⇒ `C# Script`。\n4. 将脚本命名为 `Char`（character 的缩写），如 `Figure 4-4` 所示。\n\
  \n![images/978119404187-fg044.png]\n*图 4-4: 创建 C# 脚本。*\n\n这将创建一个 C# 代码，你可以进入并修改以包含角色的代码。编码领域有很多不同的语言。就项目的目的而言，我们将使用\
  \ `C#`（读作 C Sharp）。`C#` 是一门强大的编程语言，用于 Unity 以及其他程序。它是类型安全的，并专注于代码中的面向对象目标（例如，“执行某事并发生某事”）。\n\
  \n打开这段代码时，你会发现部分代码已经写好了。Unity 在你创建新脚本时会自动为你编写一些基础代码。为了更好地理解编码，让我们分解这段代码的每个部分对整个游戏做了什么，以\
  \ `Figure 4-5` 为参考。\n\n打开 `MonoDevelop` 时，你会看到一个看起来像文字处理程序但有清晰行号界面。这是你在制作 Unity\
  \ 游戏时使用的基础代码软件。\n\n![images/978119404187-fg0405.png]\n*图 4-5: MonoDevelop。*\n\n\n\
  \n注意 Unity 代码不同部分之间的空格。这些空格的作用仅仅是分隔大型代码块，使代码更易于访问和阅读。虽然在代码内部没有理由要拆分行，但通过这样做，你可以创建出更容易理解和编写的代码。在编写代码时，务必在代码中创建换行，为自己留出更多空间。\n\
  \n在 C# 中，类充当代码中游戏对象分类的模板。`void` 作为指示器，表示接后的方法不接受任何参数，也不会返回任何值。`void Start` 表示在游戏开始时运行的方法（当你第一次按下\
  \ Play 按钮时）。`void Update` 则在游戏的每一帧中更新。\n\n每当你在代码中看到 `//` 时，它表示该行是无效代码。当在行中添加 `//`\
  \ 时，其之后的所有内容都会变成灰色，表示它们不再激活。程序员经常使用 `//` 在代码中编写注释，以帮助他们更好地理解代码中正在发生什么。编码中的其他标点符号也有自己的用途。以下是编码中最常见的：\n\
  \n* `{ }` 表示特定字符串的开始和结束点。字符串是代码的一个特定部分。你可以在代码中嵌套多个字符串。\n* `( )` 作为方法启动的进一步限定条件。你将在\
  \ `if` 语句中使用它们来设置某些代码之所以在启动时触发的原因。\n* `;` 表示特定行代码的结束。将分号想象成代码句子中的句号，而 `{ }` 则表示整个段落或文章。\n\
  \n现在由于你已经检查了一些初始代码，是时候将你的代码加入其中了。你将从一个简单的移动代码开始，该代码指示角色移动的速度、向哪个方向移动以及何时移动。\n\n\
  在图 4-6 中，你会注意到类下方添加了一个 `public float`。浮点数（Floats）作为代码后续部分可以使用的引用点。在这种情况下，你可以看到代码读取为\
  \ `public float Speed = 5f;`。此时，`public float` 表示你正在创建的代码类型，`Speed` 是你创建的浮点数的名称，`=`\
  \ 表示后面的数字直接相关并改变 `Speed`，而 `5f` 代表 5 个浮点整数。因此，任何受 `Speed` 影响的内容都会根据特定整数的 5 进行变化。\n\
  \n![image](img/9781119404187-fg0406.png)\n\n图 4-6： 移动代码。\n\n代码中的下一个区别显示了 `Speed`\
  \ 具体影响了什么。在 `void Start` 下方，你应该添加 `void FixedUpdate(){`，它每秒更新一次代码，而不是每帧。在 `FixedUpdate`\
  \ 内部，你应该输入 `if (Input.GetKey(KeyCode.W)) {`。\n\n`if` 游戏只有在括号中的语句发生时才会执行后面的字符串。在示例中，当玩家在键盘上输入特定键（该键由\
  \ `KeyCode` 定义为 `w`）时，就会发生以下代码：\n\n```\ntransform.position += Vector3.forward *\
  \ Time.deltaTime * Speed; }\n```\n\n代码表示对象在被点击时将：\n\n* 通过 `+=`（某个方向上的距离）`transform`（改变）它的位置。\n\
  * 方向由 `Vector3` 表示，即 XYZ 轴上的一个方向。（`Vector2` 表示仅沿 2D 轴。）\n* `.forward` 决定了对象移动的方向。它相对于其方向向前移动，并乘以\
  \ `Time.deltaTime * Speed`，这是你之前定义的 5。\n\n最终代码看起来应该像这样：\n\n```\nFixedUpdate {\n\
  (Input.GetKey(KeyCode.W)) {\ntransform.position += Vector3.forward * Time.deltaTime\
  \ * Speed; }\n}\n```\n\n因此，每当按下 W 键，角色就会沿着 XYZ 轴向前移动 5 个单位。要让角色向每个方向移动，你只需要复制现有的代码并根据不同方向进行必要的修改。示例参见图\
  \ 4-7。\n\n![image](img/9781119404187-fg0407.png)\n\n图 4-7： 所有方向。\n\n你只需要修复的代码部分是按下的键和角色将移动的方向。其他所有都是预定义的，不需要调整：\n\
  \n* `KeyCode.A` 加上 `Vector3.Left` 导致角色在按下 A 时向左移动。\n* `KeyCode.S` 加上 `Vector3.Back`\
  \ 导致角色在按下 S 时向后移动。\n* `KeyCode.D` 加上 `Vector3.Right` 导致角色在按下 D 时向右移动。（注：原文后续部分存在大量重复和乱码，已根据核心逻辑进行清理）。\n\
  \n\n\n\n![image](img/9781119404187-fg0409.png)\n\nFIGURE 4-9: 高级移动代码。\n\n代码的下一次更改位于\
  \ `void Start` 内部。在 `void Start` 内部，代码引用了 `bool` 类型中的 `gc`，并将其值从 `false` 更改为 `true`，这将直接影响代码的后续部分，表示该部分代码应该在游戏开始时运行。\n\
  \n在你之前创建的 `FixedUpdate` 字符串中，添加了一个与 `W` 键码相关的新 `if` 语句。这段代码与你编写第一个代码相似，但有一个主要区别：这段代码中指示了第二个\
  \ `Input`。\n\n如果你需要让多个方面同时对字符串起作用，或者为了让字符串正常工作而需要引用多个部分，可以通过在两个部分之间的代码中添加 `&&` 来实现。在这种情况下，为了激活\
  \ `if` 语句，需要在键盘上按下两个按钮：`W` 和 `LeftShift`。因此，你正常地定义每个键码，但为了将两者连接起来，你需要将它们放在 `if`\
  \ 语句旁同一个括号内，并用 `&&` 将它们连接。这段代码的另一个更改微乎其微，因为它只是将 `Speed` 浮点数替换为 `SSpeed`。你会注意到，在该字符串之后，基础向前移动仍然保持不变。这是因为你希望保持玩家冲刺和移动的能力都是可能的，但相互独立。这段代码部分仅添加了向前冲刺，但若要为每个方向添加冲刺，只需使用相同的代码基础并将其应用于每个方向即可。这里有一个示例：\n\
  \n```cs\n(Input.GetKey(KeyCode.W) && (Input.GetKey(KeyCode.LeftShift)) {\n    transform.position\
  \ += Vector3.forward * Time.deltaTime * SSpeed;\n}\n```\n\n代码的最后一次更改位于代码的最底部，引用了\
  \ `bool` 类型。这段代码通过使用射线检测（raycast）防止对象能够双击跳（或在按住空格键 `Spacebar` 时保持悬浮）。射线检测从对象的特定部分向某个方向发射一条射线，以测量附近是否有碰撞体。如果射线检测在正方向上被设置为\
  \ `10f`，那么当测量到位于物体前方 `10` 个的碰撞体时，射线检测就会捕捉到它。这可以创建警告附近有碰撞体的消息，或触发两个对象之间的交互。想想宝可梦中的训练家对战。当你通过宝可梦中训练家的特定距离时，战斗就开始了。这防止了你不需要调整对象的碰撞体大小，而是记录两个对象之间的距离。在这种情况下，射线检测指示你的对象何时接触地面，并防止角色在不在地面该距离内时跳跃：\n\
  \n```cs\nVector3 gc = transform.TransformDirection (Vector3.down);\nif (Physics.Raycast\
  \ (transform.position, gc, .5f)) {\n    GroundTouch = true;\n}\n```\n\n首先，代码通过 `gc`\
  \ 的方向指示射线检测指向的方向，`gc` 的方向被转换为向下的 `Vector3` 方向。这告诉射线检测它应该测量的方向是向下，这将使其指向地面。接下来，在\
  \ `if` 语句中，`physics` 让我们能够访问 `raycast`。它被视为物理代码，从那里代码定义了射线检测延伸多远。在这段代码中，射线检测沿着 `gc`\
  \ 延伸了 `.5F`（或半个单位）。当测量到该距离时，代码指示角色正在接触地面。保存你的代码并在 Unity 中测试（参见图 4-10）。看看你是否能捡起物体。\n\
  \n![image](img/9781119404187-fg0410.png)\n\nFIGURE 4-10: Unity 中的角色。\n\n你可能已经注意到尚未解决的一点是，当你选中角色时，`Inspector`\
  \ 窗口中的新组件。这个组件是你刚刚创建的脚本，但你也会注意到你创建的 `floats` 和 `bool` 的名称也可以在这里进行修改。将 `floats` 设置为\
  \ `public` 的作用使让你即使在代码之外也有能力更改这些值。这是非常有用的，因为它允许你在测试期间调整角色的速度、跳跃距离和冲刺速度。这样做时唯一需要记住的是，在游戏运行时对这些数字所做的任何更改都不会被记录。在进行这些更改时不能处于播放模式（play\
  \ mode）。\n\n现在当你玩游戏时，你还会发现你的角色没有捡起你在第 3 章中为角色制作的可捡物品。这是因为你还没有为角色创建捡取物品的代码。目前它们的作用仅仅是物体。\n\
  \n## 编写捡取代码\n\n可收集物品是指示目标的简单方式。捡取代码不仅是为了允许角色捡取目标，还为了让目标在角色碰撞时消失，并让 UI 在每当角色通过任何物体时增加“分数”。这涉及很多代码。为了方便起见，我将这段代码分为两部分：定义受代码影响的文本和整数的开头部分，以及设置计数的开始；以及定义这些文本和整数如何变化以及如何相互相关的代码结尾。\n\
  \n为了在屏幕上显示文本，你必须首先让它控制用户界面（UI）。在代码访问引擎的下方添加 `using UnityEngine.UI;`（参见图 4-11）。这将赋予代码更改你添加到游戏的任何\
  \ UI 的能力。\n\n代码的顶部（参见图 4-12)是你之前添加 `floats` 和 `bools` 的地方。你将添加两种影响你的游戏和其他代码部分的新类型代码：\n\
  \n- **Text**: 文字代码与 UI 直接相关，并在代码中确定。这些可以是游戏期间出现的简单消息，甚至是随着游戏情况变化而改变的值。\n- **int**:\
  \ int 代码是整数。它们是在代码过程中确定的数字代码，并根据你编写的代码增加或减少值。这些可以用于定义倒计时器或评分系统。\n\n你还会注意到，虽然两个文本都是\
  \ `public`（这意味着它们的值会被广播到代码之外的游戏的其他方面或代码中），但 `int` 代码是 `private`，这意味着它的值仅在此特定代码内部有效，不会影响游戏的其他部分。\n\
  \n\n\n\n你想要创建的代码是 `countText` 和 `winText`。与浮点数类似，这里的名称除了作为后续代码的指示值外，其名称本身实际上并不重要。这些代码将用于计算玩家的得分，一旦玩家达到某个分数，就表示玩家“赢得”了游戏。\n\
  \n你想将这个 `int` 类型的代码命名为 `count`。同样，名称并不重要，但 `count` 会向你或任何其他查看这段代码的人表明，这个整数与计数直接相关。在这种情况下，该整数计算的是玩家收集的拾取物品数量。\n\
  \n在添加这些代码后，转到 `void Start` 字符串处，你将会在那里添加两个新代码：\n\n*   `Count = 0;`: 这将在关卡开始时将计数整数设置为\
  \ 0。在设置为 0 之后，你就可以在后面的代码中让该数字增加。\n*   `SetCountText();`: 该代码引用了你稍后将有的文本代码。在每次整数更改后，这段代码都会记录更改并将其发送文本代码，以相应更改其数字。\n\
  \n在代码的底部（参见图 4-13），在 `void FixedUpdate` 中添加了两个 void：`void OnTriggerEnter(Collider\
  \ other)` 和 `void SetCountText()`：\n\n![image](img/9781119404187-fg0413.png)\n\n\
  图 4-13： 代码的结束。\n\n```cpp\nvoid OnTriggerEnter (Collider other) {\n    if (other.gameObject.CompareTag(\"\
  Pickup\"))\n    {\n        other.gameObject.SetActive(false);\n        count = count\
  \ + 1;\n        SetCountText();\n    }\n}\n```\n\n`onTriggerEnter` 仅在特定事件发生时激活，在括号中，该事件定义为当对象的碰撞器与另一个碰撞器接触时。这意味着每当角色碰到另一个物体时，这段代码就开始运行，但为了限制这段代码仅影响此字符串内的拾取物品，使用了一个\
  \ `if` 语句：`if (other.gameObject.CompareTag(\"Pickup\"))`。现在代码已经确定，每当物体与另一个物体碰撞时，如果另一个对象的标签是\
  \ `Pickup`，就会执行字符串的下一部分。\n\n该部分字符串的第一行表示，当它与另一个物体碰撞时，它将将其 `SetActive` 设置为 `false`。这会导致另一个物体在游戏中消失，看起来就像它被捡起来了，但实际上它只是不再在游戏中渲染了。下一行将计数整数设置为\
  \ `count + 1`，这使总数增加了 1。最后，在第三行中，代码用整数重置 `countText`。\n\n现在，每当游戏角色碰到带有 `Pickup`\
  \ 的物体时，该物体就会消失，玩家的得分就会增加 1。\n\n`SetCountText()` 在这段代码中已经被多次引用。这段字符串定义了当引用 `SetCountText`\
  \ 时会发生什么。在段字符串内部，代码引用了之前设置的公有文本 `countText`。\n\n```cpp\ncountText.text = \"Count:\
  \ \" + count.ToString();\n```\n\n这将定义 `countText` 并告诉用户界面 (UI) 显示什么文本。你确定这是一个文本文件，因此它有必须定义的单词。在引号内，你指定了\
  \ `countText` 将显示的单词，并指示它还将在单词末尾包含整数计数。通过添加 `+`，计算机知道要将整数添加到所述短语的末尾。因为每当角色捡起物体时，代码都会引用这段字符串，随着你收集更多物品，字符串末尾的值将会增长。\n\
  \n在 `SetCountText()` 的最后尾是一个 `if` 语句，它决定了何时显示 `winText`。当 `count` 等于或大于 12 时，`winText`\
  \ 将显示消息“CONGRATS YOU WON!!!”。此值取决于你散布在整个关卡的拾取物品数量，但无论具体数字是多少，代码都能工作。只需更改数字以匹配关卡上的拾取物品数量。这里是完成的代码：\n\
  \n```cpp\nvoid SetCountText()\n{\n    countText.text = \"count: \" + count.ToString();\n\
  \    if (count >= 12)\n    {\n        winText.text = \"CONGRATS YOU WON!!!\";\n\
  \    }\n}\n```\n\n保存代码，并返回 Unity 进行测试（参见图 4-14）。\n\n![image](img/9781119404187-fg0414.png)\n\
  \n图 4-14： 带有...的游戏\n\n## 创建标签和用户界面\n\n现在你已经创建了 UI，必须将 UI 与代码链接起来。\n\n既然你已经创建了 UI，就必须将\
  \ UI 链接到代码。\n\n### 创建界面\n\n创建实际上非常简单。像任何其他对象一样，转到 GameObject，向下滚动到 UI，然后选择 Text。这将创建一个带有文本的画布。目标是将\
  \ UI 链接到代码。首先，在检查器中，将文本命名为 `CountText`。将其放在左上角，首先调整位置为 (X=0, Y=0, Z=0)。在检查器的左上角将有一个锚。点击该指示器并选择左上角，然后移动位置使文本可见。在我的游戏中，X=95,\
  \ Y=-34，Z=0，但这对你的游戏可能有所不同。在检查器的底部，你会看到一些更改文本颜色、大小和字体的设置。找到适合你游戏的设置。点击 Best Fit 框，这将使文本适应屏幕，使其尽可能易读且不会遮挡太多屏幕。完成创建后，创建另一个\
  \ UI 并命名为 `WinText`。不要把它放在角落，而是将其居中，并确保加粗和斜体（选择字体样式并选择加粗和斜体）。这一个也点击 Best Fit，但将其最大大小改为\
  \ 60，最小大小改为 10。最后，删除此框中的所有文本，因为虽然文本会替换这些文本，但在结束之前不会这样做，所以保持为空可以确保在赢得游戏之前游戏窗口是空的。\n\
  \n现在你已经创建了 UI，必须将 UI 上的文本链接到你的代码。幸运的是 Unity 让这一切变得非常简单。\n\n1. 选择玩家。\n2. 在检查器中向下滚动直到到达\
  \ Char (Script) 组件。\n3. 选择 Count Text 旁边的目标。会出现一个 Select Text 弹出窗口。\n4. 选择 Count\
  \ Text。\n5. 对 Win Text 重复此操作（选择 Win Text）。\n\n### 创建标签\n\n标签是可以分配给一个或多个游戏对象的引用。配合代码使用，标签可以帮助确定某些物品是否可以被捡起或者敌人是否可以在接触时破坏角色。这是一次向多个对象分配值的方法。\n\
  \n\n\n要创建一个标签，只需点击任何物体。在 `Inspector` 窗口的左上角，你会看到一个 `Tag` 下拉菜单。选择此菜单将显示 Unity 中已经创建的一些标签：\n\
  \n* Untagged（未标记）\n* Respawn（重生）\n* Finish（完成）\n* EditorOnly（仅编辑器）\n* MainCamera（主摄像）\n\
  * Player（玩家）\n* GameController（游戏控制器）\n\n要创建你自己的标签，滚动到标签列表底部并选择 `Add Tag`。这将打开 `Tags\
  \ & Layers` 窗口。在此窗口中，在 `Tags` 下拉菜单中只需点击 `+` 来创建一个新标签并命名为 `Pickup`。这将创建一个 `Pickup`\
  \ 标签。\n\n创建此标签后，进入 `Prefabs` 文件夹并选择你的 `Pickup` 预制。为它分配 `Pickup` 标签，然后保存场景和项目。\n\n\
  在运行场景之前，为了让碰撞器正常工作，请进入 `Inspector` 窗口中的 `box collider` 并打开下拉菜单。确保 `Trigger` 旁的复选框已勾选；否则当角色与物体碰撞时，什么都不会发生。\n\
  \n按下 `Play` 测试你的游戏。现在，每当你的角色与任何拾品相遇时，它就会捡起它们，分数就会增加。\n\n## 为摄像编写代码\n\n在本章中，你需要为游戏编写最后一个代码是摄像机。现在，当角色在屏幕上移动时，摄像保持不动，但你希望摄像机跟随角色遍历关卡。要实现这一点，你必须先为摄像创建一个专门的代码。在代码文件夹中创建一个新的\
  \ `C#` 代码并命名为 `Cam`。然后打开该代码。\n\n摄像机代码没有角色代码那么深入（见图），但它仍然添加了一些新代码。代码的前五行保持，不需要更改。在\
  \ `public` 类之后，你想添加一个 `public` 和一个 `private`：\n\n* `public GameObject Player;`:\
  \ 这赋予了摄像机代码选择特定物体并将其值确定为 `Player`的能力。它的工作原理与 `char` 代码中创建的文本类似。\n* `private Vector3\
  \ offset;`: 这部分代码允许你在 Unity 中自由移动摄像，以创建你希望它跟随玩家的视角。这样，在代码中，你就不需要定义距离和旋转了。\n\n![image](img/9781119404187-fg0415.png)\n\
  \n[FIGURE 4-15:] 摄像机代码。\n\n在 `void Start` 字符串中，编写 `offset = transform.position -\
  \ Player.Transform.position;`。这将摄像机的偏移量（它距离目标有多远）链接到你之前创建的 `Player` GameObject。摄像机的变换位置从开始就与玩家的位置直接链接：\n\
  \n```\nvoid Start () {\n  offset = transform.position - Player.Transform.position;\n\
  }\n```\n\n在 `void LateUpdate` 中（将替换 `void Update`），编写 `transform.position = Player.transform.position\
  \ + offset;`。这将确保随着主体位置的变化，摄像机的偏移量会在游戏的每秒更新。这样，摄像机与角色的距离始终完全相同。\n\n```\nvoid LateUpdate\
  \ () {\n  transform.position = Player.transform.position + offset;\n}\n```\n\n在这段代码中，你决定了摄像机跟随什么、如何跟随角色以及偏移量是多少。\n\
  \n保存代码并返回 Unity。\n\n完成代码后，只需将其拖到到场景窗口中的 `Camera` 上。摄像机现在还没有开始跟随角色，因为你还需要在 Unity\
  \ 中确定摄像机跟随的角色以及它跟随角色的角度/距离。\n\n选择摄像机并滚动到 `Inspector` 底部，你会看到 `Cam (Script)` 组件。在组件内部，你会看到\
  \ `Player` 旁边有一个目标。选择该目标，会弹出一个列出场景中所有物体的窗口。滚动直到找到 `Player` 并选择它。保存场景和项目并按下 `Play`。现在，当你移动角色时，摄像机会跟在玩家后面（见图）。\n\
  \n![image](img/9781119404187-fg0416.png)\n\n[FIGURE 4-16:] 摄像机以角度跟随角色。\n\n在完成摄像机跟随玩家的设置后，使用\
  \ `position` 和 `rotation` 变换调整摄像机的角度，以便最好地跟随角色，同时提供关卡的最佳视野。\n\n![image](img/c5.png)\n\
  \n在本章中，你将为玩家创建需要避开的障碍，以及玩家没有避开这些障碍时发生的负面影响代码。你在这里创建的障碍将作为你在第 12 章中将添加的更详细敌人或陷阱的替代品。你还将编写一个角色死亡时显示的死亡信息。你将设置角色重生之前可以掉落的距离限制。\n\
  \n## 思考什么是游戏\n\n什么让游戏成为游戏？只有当某些存在时，游戏才是一个游戏。即使是像 Minecraft 这样的开放式游戏也有目的。如果一个游戏没有挑战或目标，它就不再是一个游戏，而是一个应用程序。作为一个练习，想想你玩的游戏。在多人游戏中，这种挑战变成了其他玩家。在益智游戏中，挑战是你必须解决的谜题。在基于选择的剧情游戏中，挑战是试图弄清楚哪些选项会导致什么样的结果。\n\
  \n当你创建游戏时，问问自己什么类型的障碍会阻止玩家达到目标，以及玩家如何克服这些障碍。在你正在制作的游戏中，障碍以敌人角色和尖刺的形式出现，玩家在不损失生命值和死亡的情况下是无法击中它们的。\n\
  \n 创建并编写你的障碍物\n\n现在，你已经完成了关卡的基本控制和布局（见图），你需要添加一些可以给玩家提供挑战以克服的东西。\n\n![image](img/9781119404187-fg0501.png)\n\
  \n[FIGURE 5-1:] 你的关卡。\n\n你已经有了让他们跳跃的间隙，但这与真正的障碍不同。就像《超级马里奥兄弟》中的 Goomba 或尖刺陷阱一样，你的游戏中应该有一些玩家必须避开或克服的东西。敌人可能是这个概念最简单的版本，所以这就是你要做的。\n\
  \n正如游戏早期关卡中形成的模式一样，你应该从一个替代品开始，你可以向它添加代码，并在以后将其替换为更精美的游戏物体。在花费精力和制作动画或模型之前，你需要确保代码和放置工作正常。在这种情况下，从创建一个立方体开始，并将其放置在第一个平台的边缘附近（见图）。\n\
  \n![image](img/9781119404187-fg0502.png)\n\n[FIGURE 5-2:] 放置敌人替代品。\n\n\n\n\n这个占位符的问题在于，与原始的物品占位符一样，敌人角色没有从背景中脱颖而出。因此，在你为敌人制作制体（prefab）之前，应该改变角色的颜色，使其与背景区分开。对于敌人角色来说，红色非常有效，因为人们自然地将红色与愤怒以及\
  \ `stop` 一词联系在一起。大多数人认为红色是危险的颜色，因此将其用作敌人颜色——至少对于占位符而言——可以指示它是坏的且应该避开。\n\n另一个让敌人看起来很危险的办法是让它变大。这有两个作用：\n\
  \n*   它创建了一个角色必须避开的大型物体。\n*   它让角色脱颖而出并显得很有威慑。\n\n`(X=2,Y=2,Z=2)` 的缩放足以创建一个简单的占位符，你之后可以将其替换为移动的敌人。\n\
  \n最后，务必给这个对象分配一个标签，你之后可以在代码中使用它来指示它具有负面影响。创建一个新标签并命名为 `enemy`。在将标签分配给角色后，确保盒体碰撞器（box\
  \ collider）中勾选了 Trigger（触发器）框，并为角色制作制体。完成后，你应该会得到一个与 图 5-3 类似的东西。\n\n![image](img/9781119404187-fg0503.png)\n\
  \n图 5-3: 完成的敌人占位符。\n\n保存你的项目/场景并打开你的 `Char` 代码。\n\n现在你想添加代码，让角色能够识别何时撞上敌人，在每次碰到敌人时分数减少\
  \ 1，在撞击敌人时向后弹回，并在撞上得分为 0 的敌人时死亡。\n\n首先，创建一个 `float` 来决定角色在撞上敌人时会后退多远。它应该比任何其他速度都快，这样当玩家不小心撞上敌人时，就不会不小心发生两次。正如图\
  \ 5-4 所示，将这个 float 命名为 `hurt` 并给它赋值 `30f`。\n\n![image](img/9781119404187-fg0504.png)\n\
  \n图 5-4: 代码的上半部分。\n\n```python\npublic float hurt = 30f;\n```\n\n这个值在你测试游戏时可能以后需要调整，但目前它会作为一个很好的占位值，因为它比任何其他值都大。\n\
  \n现在是时候编写当角色撞到敌人角色时会发生的情况的代码（参见图 5-5）。这段代码应该放在代码中的 `void OnTriggerEnter (Collider\
  \ other)` 部分。与 `pickup` 代码类似，这段代码的第一部分告诉玩家，当他穿过标签为 `Enemy` 的物体时，将发生后续事件。\n\n![image](img/9781119404187-fg0505.png)\n\
  \n图 5-5: 代码的下半部分。\n\n```csharp\nif (other.gameObject.CompareTag(\"Enemy\")){\n \
  \   transform.position += Vector3.back * Time.deltaTime * hurt;\n    count = count\
  \ – 1;\n    SetCountText ();\n    if (count <= -1) {\n        Destroy (gameObject);\n\
  \        winText.text = \"You lose :(\";\n    }\n}\n```\n\n回想移动代码，你不需要将改变角色位置的事件限制为仅按下键盘按键。在这种情况下，每当你的角色碰到敌人，角色的位置就会根据\
  \ `hurt` 向后变换，这是你你在图 5-4 中定义的。你可以通过在 Unity 中保存并运行游戏来测试这段代码。当你遇到敌人时，你的角色现在会跳回。\n\n\
  但你想做的不仅仅是推回角色。这段字符串的后续部分决定了撞上角色的后果。\n\n在第 4 章中，你定义了每当角色一个物品，其 `score` 增加 1。你把该分数链接到玩家的\
  \ `health`。每当角色击中敌人，角色就会失去 1 分。\n\n\n\n\n在测试你的游戏并确保代码运行正常后，使用在本章节之前创建敌人制体（prefab），开始将它们放置在整个关卡中。虽然这些角色现在不会移动，但要为之后给敌人制作动画留出活动空间。在添加几个敌人后，你应该在关卡的末尾创建一个新盒子，并赋予它红色材质。不过，对于这个盒子，让它横跨整个平台，这样玩家就不得不跳过去。这个对象将作为关卡中大型陷阱的占位符。它代表的不是敌人，而是尖刺陷阱或其他玩家必须避开的环境危险。创建一个标签（tag）并命名为\
  \ `EnviroHazard03`。（这将是第三重生点区域的危险。）\n\n确保陷阱是可以规避的。在图 5-8 中，陷阱的高度仅为 `1`。这样，玩家就能轻松跳过它。在最终游戏中，这个陷阱将是一个压力陷阱，玩家必须在它压下之前跳过去，但现在这个陷阱应该充当玩家可以轻松避开的东西。当玩家撞上它时，他将被强制重生。\n\
  \n![image](img/9781119404187-fg0508.png)\n\n图 5-8: 环境陷阱。\n\n## 创建重生点\n\n为什么要创建重生点？如果玩家每次掉下边缘或失去生命时都必须从关卡开始重新，那么游戏将变得不好玩，只会让人感到沮丧。为了回到具有挑战性的点而重复执行同样的事情会加剧玩家的情绪并破坏沉浸感。你是否曾玩过某个游戏，遇到一个困难的\
  \ Boss 战，而前面有一个无法跳过的过场动画？这很人生气，因为你为了再次尝试 Boss，必须一遍一遍地看同一个过场动画。图 5-9 中的过场动画只是许多此类游戏中的一个例子。\n\
  \n![image](img/9781119404187-fg0509.png)\n\n图 5-9: 王国之心 HD 1.5 Remix：Riku/Ansem\
  \ Boss 战过场动画。\n\n重生点是对这种挫败感的缓解——它们通过让玩家经过更少的关卡区域来减少失败的惩罚。许多游戏（尤其是关卡很长的游戏）都有某种重生点，这样玩家就不需要反复重新玩整个关卡。这些的形式有两种：玩家进入关卡一定距离后出现的自动重生点，以及玩家用来保存关卡或游戏进度的存档点。\n\
  \n对于你的游戏，请为关卡使用前一种重生方法。这些重生点是玩家掉下边缘或撞上环境危险后生成的地方。它们会像敌人一样移除一个硬币，但如果玩家在生命值为零时掉下边缘或撞上环境危险，它们将不起作用，因为会导致游戏结束。\n\
  \n在创建实际的重生点之前，你应该向玩家指示重生点的位置，这样他们就知道自己在掉下边缘或撞上危险时会在哪里重生了。在图 5-10 中，这通过更改放置重生点的平台颜色来表示。我建议每个关卡内设置一或两个重生点，取决于关卡的长度，更长的关卡可以添加更多。对于第\
  \ 1 关卡，有两个重生点。\n\n![image](img/9781119404187-fg0510.png)\n\n图 5-10: 重生指示。\n\n改变颜色或在某处添加标记可以帮助指示玩家那里有一个重生点，并引导玩家向那里移动。它还有另一个作用，即在整个游戏中为玩家提供较小的目标供他们努力实现，特别是当实际目标可能不在玩家视野内时。\n\
  \n当你确定了两个重生点的位置后，就可以开始创建角色将重生的实际点了。创建重生点时，你需要两个东西：触发器（trigger）和目标（target）。\n\n*\
  \   **触发器 (Trigger)：** 在这种情况下，触发器是导致角色需要重生的原因。在游戏中，这可以是敌人或游戏区域外的某个区域，玩家穿越时会导致重生。\n\
  *   **目标 (Target)：** 目标是角色生成的实际重生点。\n\n接下来，你必须设置触发器，以便当角色掉下边缘时，他们会被强制重生而不是永远掉下去。对于触发器，我倾向于使用\
  \ 3D Object 菜单中的 `Quad`。按照以下步骤操作：\n\n1. 进入 `GameObject`。\n2. 滚动到 `3D Object`。\n\
  3. 选择 `Quad`。\n4. 在 `x` 轴上旋转 Quad 90 度。\n5. 将 Quad 放置在关卡底部。\n6. 调整尺寸，使 Quad 的部分延伸关卡开始之前，直到接触你确定的第一个重生点区域。\n\
  \nQuad 的边缘应该超出关卡的两侧（参见图 5-12）。\n\n你还需要确保 Quad 是不可见的，因此在你完成网格放置使其与图 5-12 匹配或相似后，创建一个新材质。制作不可见材质需要更改材质使用的渲染模式。在\
  \ Inspector（检查器）窗口的右上角，当你创建一个材质时，你会看到 Rendering Mode（渲染模式）下拉菜单。打开该菜单，你有四个选项：\n\n\
  *   Opaque（不透明）\n*   Fade（淡入）\n*   Cutout（镂空）\n*   Transparent（透明）\n\n\n\n为了制作不可见的物体，我发现\
  \ `Fade` 或 `Cutout` 效果最好。选择其中任意一个，然后选择 `Albedo` 颜色。当你选择 `Albedo` 时，会弹出一个颜色选择器窗口。在颜色选择器的底部，你会看到颜色滑块旁边有四个字母：\n\
  \n* `R` 代表红色 (Red)\n* `G` 代表绿色 (Green)\n* `B` 代表蓝色 (Blue)\n* `A` 代表透明度 (Alpha)\n\
  \n使用不同的颜色滑块可以改变颜色颜色的影响程度，但 `Alpha` 决定了物体的透明不程度。该选项仅在 `Fade`、`Cutout` 或 `Transparent`\
  \ 渲染设置可用。\n\n`Transparent` 的效果没有另外两种好，因为它更多用于渲染玻璃，因此会有反光。将 `Alpha` 一直拖到 `0` 将使材质完全透明。创建材质后，将其分配给你创建的四形体（quad），现在该四形体在关卡底部变得不可。\n\
  \n将此四形体命名为 `DeathZone1` 并保存。你想再创建两个 `DeathZone`，并将一个放在两个重生点之间，另一个从最后一个重生点一直延伸到关卡结束之后，如图\
  \ 5-13 所示。\n\n![image](img/9781119404187-fg0513.png)\n\nFIGURE 5-13: 第一个触发器。\n\n\
  任何区域之间都不应该有空隙。这是为了确保每个重生点都有一个相应的区域，可以将角色重新生成回重生点。在你创建了所有重生点和区域后，该为它们编写代码了。\n\n###\
  \ 编写重生点代码\n\n为了编写重生点，你将使用一套与其他碰撞体略不同的系统。其一，你将不再使用标签（tags），而是使用公共 `GameObject`。\n\
  \n在代码顶部，创建六个公共 `GameObjects`（参见图 5-14），每个触发器和目标对应一个。前三个你应该命名为 `deathZone01`、`deathZone02`\
  \ 和 `deathZone03`；这些将挂载在本章之前创建的触发区域上。使用以下示例作为编写代码的方法，并替换每一个名称：\n\n![image](img/9781119404187-fg0514.png)\n\
  \nFIGURE 5-14: 公共 GameObjects。\n\n```cpp\nPublic GameObject deathZone01;\n```\n\n\
  接三个命名为 `respawnPoint1`、`respawnPoint2` 和 `respawnPoint3`。这些将指向之前创建的空物体（empties）。\n\
  \n在第 4 章中，你创建了一个公共 `GameObject` 将摄像挂载到玩家角色。公共 `GameObjects` 允许你选择代码将影响特定的目标。如果你想为多个关卡使用同一段代码，它们会非常有用，因为很容易为不同的关卡定位不同的对象。从重生点的考虑，你希望能够在每个关卡中轻松设置重生点，而标签是不可行的，因为每个重生都需要单独编码，所以最快且最可靠的方法是使用\
  \ `GameObjects`。\n\n在图 5-15 中，你可以看到重生代码本身非常简洁，但你会注意到一些以前没见过的东西。与在此代码之前编写的常用 `CompareTag`\
  \ 代码不同，你会发现代码中有两个等号。\n\n![image](img/9781119404187-fg0515.png)\n\n```cpp\nif (other.gameObject\
  \ == deathZone01) {\n    transform.position = respawnPoint1.transform.position;\n\
  }\n```\n\n当值为数值型时，你只需要使用一个等号表示对象的值等于它；但对于非数值实例——例如当物体碰撞必须匹配特定对象时——它需要两个等号才能正常工作。\n\
  \n在这个 `if` 语句中，如果被碰到的另一个 `GameObject` 是 `deathzone01` `GameObject`，则位置将变换以匹配 `respawnPoint1`\
  \ 的位置。完成代码后，保存文件并切换到 Unity 窗口测试代码。\n\n选择玩家并进入检查器（Inspector）窗口。在 Char (Script) 组件中，你现在会看到你在代码中创建的所有\
  \ `GameObjects` 列表。选择 `DeathZone1` 并勾选其旁边的框。对 `deathZone02` 和 `deathZone03` 重复此操作。现在选择玩家并进入检查器窗口。在\
  \ Char (Script) 组件中，你现在会看到你在代码中创建的所有 `GameObjects` 列表。\n\n\n\n\n当你想到游戏测试（play testing）时，脑海中浮出的可能是开发者在开发周期后期引入的\
  \ Alpha 或 Beta 测试员。你可能认为游戏测试员是那些为了付钱提前玩游戏并判断游戏是否好不好玩的人。但这并不是游戏测试的全部！\n\n首先，游戏测试员不仅仅是在玩游戏。他们会仔细检查游戏的每一个部分，并报告过程中出现的任何\
  \ Bug 或问题。游戏测试员甚至并不真的在“玩”游戏。相反，他们是在对游戏进行解剖，以确定游戏每个层面上哪些地方是有效的，哪些是无效的。\n\n作为一名游戏开发者，你需要理解拥有优秀的游戏测试员的重要性。当你寻找游戏测试员时，你需要确保他们不仅愿意玩游戏，还愿意将其逐部分拆解，以确定游戏的哪些部分有效，哪些部分无效。\n\
  \n游戏测试是一件不能轻视的事。当你对游戏进行玩测试时，目的是改进游戏中那些可能还没有其他部分完善的方面。游戏测试的核心在于找到游戏中运行不正常的部分，并确定游戏究竟需要修复什么——从代码中的\
  \ Bug 到难度不平衡的激增。游戏测试是对你游戏的压力测试。在游戏测试中，你通常不是在审视整体。相反，你是在玩游戏的过程中观察游戏的各个方面。你可能需要多个游戏测试员来帮助尽可能地发现游戏中的缺陷。\n\
  \n## 了解何时开始游戏测试\n\n游戏测试永远没有开始得早。事实上，你越早开始对游戏进行玩测试，从长远来看就越有利。游戏开发需要大量的时间和精力，很多事情取决于游戏不同方面之间的协同工作。游戏中的任何一个点都需要多个方面同时运作，才能确保一切运行正常。你测试游戏得越早、频率越高，就越能帮助你避免为了修复某一个微小问题而重做整个部分的代码或工作。在游戏开发后期做出的更改，其错误代价就越高、耗时越长。在早期代码中只需要几分钟就能修复的东西，在完成的游戏可能花费数小时甚至几天。\n\
  \n游戏测试不应该只发生在早期，它应该经常发生。如果错误在代码或设计中存在太久，游戏的其余部分就会围绕这些错误开始开发，并将游戏的其他部分与其相互连接。链接到错误的代码或设计越多，这个错误就越久、成本越高。游戏测试是理解你的游戏哪些部分有效、哪些部分无效的唯一途径。\n\
  \n## 决定谁应该参与你的游戏测试\n\n游戏测试中最困难的部分是意识到你是你自己最糟糕的测试员。当你设计游戏时，你是根据自己想玩的内容来做决定的。测试自己游戏的问题在于，你在进入测试时已经知道了游戏中的某些问题。你对其他问题处于盲目状态，你从开始就在寻找那些问题——却遗漏了其他问题。你是你最糟糕的测试员——并不是因为你不理解你的游戏在做什么，而是因为你对它的理解太透彻了。\n\
  \n把你的游戏想象成你正在写的一个故事。当你写一个故事时，你对故事的内容有非常清晰的想法。角色对你来说都是合理的，他们的动机也清晰而易懂，因为那是你写的。许多业余作家遇到的问题实际上是如何在纸面上传达这些想法。这就是为什么作家需要编辑。仅仅因为某事对你来说是合理的，并不意味着它对别人也是合理的。游戏开发也是如此。\n\
  \n当你找来游戏测试员时，问问自己你想让谁玩你的游戏。你的目标受众是谁？寻找符合这一描述的朋友或家人，让他们玩游戏。\n\n在他们玩完之后，听听他们对你游戏的评价。记录下哪些有效、哪些无效，或者他们发现了哪些困惑之处。对你来说显而易见的事，对他们来说并不一定如此，这是一个重要的批评，因为你希望你的游戏能够让更多的人使用。\n\
  \n如果可能，让多个人测试你的游戏。你可以做的最好的事情是测试尽可能多的年龄段或群体，而不仅仅是你的目标受众。虽然你应该更多地考虑目标受众的批评，但不要低估非目标群体的建议。要制作出一款让人们喜欢的游戏，你必须理解不同视角的重要性。\n\
  \n即使你认为某项批评或建议对你的游戏不是最好的，至少考虑该建议也是重要的。即使你没有采纳该建议，你也被迫去从更深层次去思考你的游戏，并更多地了解你的游戏是什么以及你认为重要什么。通过他人测试你的游戏，会产生你可能从未考虑过的问题。在游戏设计中，没有所谓的糟糕问题。\n\
  \n## 了解要寻找什么\n\n在你的游戏测试员玩完游戏后，尝试问他们一些关于游戏的问题，以确定哪些部分有效，哪些无效。目前，你正在测试游戏的机制和基础，因此本章中你应该问的问题与你在开发周期后期可能问的问题截然不同。\n\
  \n以下是现阶段可以问的一些示例：\n\n*   **游戏的目标是什么？** 虽然这对你来说可能是一个显而易见的问题，但对玩家来说可能并不明显。问问他们是否能轻松判断在游戏中需要做什么。如果有必要，看看是否可以做些改进让目标更清晰。\n\
  *   **你在游戏中遇到过任何 Bug 或故障吗？** 如果有，它们是什么？你现在对游戏中的大部分 Bug 有了大概，如果你注意到了话。由于游戏还处于早期，所以\
  \ Bug 应该是最少的，但你永远不知道某些收集物品是否有效，或者平台是否没有按预期运行。玩游戏可以指出一些容易修复的早期 Bug。\n*   **操作方式是怎样的？**\
  \ 这个问题显而易见，但你永远不知道玩家早期在哪些地方遇到过困难。有时玩家甚至不知道如何操作来通过游戏。我以前玩过一些游戏，在玩了几关卡后才知道某个游戏机制，因为游戏中没有任何东西指示它的存在。如果玩家错过了关键控制甚至仅仅是冲刺键，可能会负面影响他们的游戏体验。\n\
  *   **你觉得操作容易学习吗？为什么或者为什么不？** 这个问题涉及到他们学习操作花费的时间。记住，你可能上手就会操作，但对你来说显而易见的事对第一次拿起游戏的人来说可能很难理解。问问玩家弄清楚操作有多困难。也问问你可以做些什么让这个过程变得简单。玩家越早不需要考虑操作，他们玩游戏时就越开心。\n\
  \n\n\n\n*   **你在游戏中死了多少次？发生了什么？** 这个数字代表了游戏学习曲线的陡峭程度。因为你目前正在测试第一关，这个数字应该是很低的。了解玩家死了几次以及为什么死，可以让你了解游戏是否清楚地告诉玩家应该做什么。如果玩家一直撞上敌人导致死亡，可能是敌人的描绘不够清晰。如果他们一直掉下边缘，可能是跳跃键不起作用或没有明确指示。\n\
  \n*   **游戏逻辑通顺吗？** 游戏还处于开发早期，所以除了游戏的基本机制外，可能没有太多需要理解的，但即使是敌人的行为和道具的功能这样简单的事情，对玩家来说保持清晰也同样重要。\n\
  \n*   **在这个阶段你会改变什么？** 这个问题可能是所有问题中最棘手的，因为它会受到个人偏好的影响。尽管如此，我认为这是一个非常重要的问题，因为在开发游戏时，会有一些你完全没考虑到或漏掉的想法。即使是你以后不会用到的东西，在任何艺术媒介中也可能是无价的。它迫使你思考你想要做的游戏到底是什么。它还可能给你一些从未想过的、新颖有趣的方向。\n\
  \n这些是我发现能帮助我在测试中获得最大收益的问题。向某人（尤其是朋友）提出批评通常是很的，所以向你的测试人员问这些问题可能帮助他们敞开心扉并诚实地评价游戏。无论你是否采纳了这些建议，诚实的反馈都永远不是坏事。\n\
  \n## 处理反馈\n\n建设性的反馈总是是好事，尤其是当反馈是负面意见时。任何游戏都有改进空间，对哪些部分有效或无效的反馈可以防止游戏陷入停滞。让人们玩你的游戏并提供诚实的建设性反馈可能会令人害怕，但你越早克服这种恐惧，就会成为越优秀的游戏开发者。\n\
  \n## 寻找游戏中的问题\n\n即使是你在书中制作的游戏也无法免受批评和改进。游戏总是可以改进的。这个游戏也存在许多 Bug 和设计问题。你可能会发现本章中遗漏的问题。务必让其他人测试游戏，超出这里讨论的问题。例如，我回答了之前列出的一些问题，并详细说明了游戏中哪些地方做得好，哪些做得不好：\n\
  \n*   **游戏的目标是什么？** 游戏的目标没有定义。虽然道具和敌人之间确实有明显的区别，但没有任何指示说明玩家在游戏中应该完成什么。\n    主要目标（关卡中的最后一个道具）除了简单的调色板外，没有任何体现其重要性。在设计游戏目标时，应该更强调它与游戏中其他物品的区别。目标需要从一开始就定义得更清楚，以给玩家提供方向。\n\
  \n*   **你在游戏中遇到过 Bug 或故障吗？如果有，是什么？** 游戏内有一个故障，当角色靠墙时发生。当角色在墙上跳跃时，角色实际上可以爬墙，因为角色将墙识别为地面的一部分。这使得游戏的某些区域比预想的简单得多。\n\
  \n*   **控制方式是怎样的？** 控制非常直观，但 `Shift` 键的使用在游戏过程中很容易被忽略，导致某些游戏章节无法通过。游戏需要向玩家介绍控制方式。如果没有这些，玩家很难弄清楚游戏所有的操作。\n\
  \n*   **你觉得控制容易学习吗？为什么？** 游戏中的控制方式已经足够直观，其实不需要太多的介绍，但应该有一个指南帮助玩家最初了解控制方式。如果没有这个指南，玩家在开始可能会苦于理解控制。至少应该对\
  \ `Sprint`（冲刺）按钮有一个指示。\n\n*   **你在游戏中死了多少次？发生了什么？** 游戏中的主要问题是第一个可以交互的物体就能杀死你，这会阻碍你收集道具。大多数玩家会立即死亡，没有意识到道具可以作为对抗敌生物的血。最好的解决方案是在关卡开始增加另一个道具。\n\
  \n*   **游戏逻辑通顺吗？** 游戏逻辑是通顺的，即使目标最初并不明确。当玩家理解了游戏机制并知道哪些道具是好是坏时，游戏的其他部分就具有一致性。\n\n\
  *   **在这个阶段你会改变什么？** 游戏在这个阶段需要做的最大改变是加入一些教授玩家控制方式的指南。在这个阶段应该加入的另一部分是可以离开结束界面的能力。现在，玩家退出结束游戏的唯一方法是重新开始整个游戏，这破坏了连贯性并防止了玩家再次尝试。这是一种无意中的惩罚。\n\
  \n相机也锁定在一个整个过程中都不有效的角度。玩家应该能够根据关卡中发生的情况需要调整相机。虽然第一关很简单，不需要调整相机就能玩，但任何未来更复杂的关卡都会崩溃。\n\
  \n\n\n当你开发游戏时，你必须优先处理出现的问题和 Bug。某些问题需要比其他问题更早地解决。在一个充满截止日期的世界里，破坏运行的 Bug 需要在美化问题之前修复。把它想象成家庭作业：某些项目或任务因为截止日的临近或对你总分的重要性而需要被优先考虑。游戏制作也是如此，只不过唯一能决定某些问题比其他问题重要的人只有你！问问自己，到底哪些问题最损害了游戏体验，而哪些问题可以以后再处理。\n\
  \n在这个游戏中，这里有几个主要问题：\n\n*   `玩家受到了不公平的惩罚。`这在游戏早期杀死玩家并让玩家一开头就导致“游戏结束”，从而破坏了游戏。\n*\
  \   `玩家在游戏早期学习不同控制操作时存在问题。`为了修复这个问题，你需要添加一个教程，该教程会随着玩家学习操作并在游戏中演示这些操作而发生变化。\n* \
  \  `玩家正在爬墙。`在平台跳跃游戏中，你希望玩家学会如何跳跃并精通控制操作。如果玩家有可以使用的简单替代方案，那么那些让游戏成为游戏的挑战性部分将变得失效。而且，随着游戏难度的增加，难度跳跃会感到不平衡，因为那些旨在教学控制和游戏部分的低挑战性部分会被直接忽略。\n\
  \n在接下来的章节中，我将引导你解决这三个问题的每一个。\n\n### 减少对玩家的惩罚\n\n当玩家开始游戏时，一切对他们来说都是新鲜的。他们不确定什么是好事，什么是敌人。在游戏的早期，玩家所拥有的只有你提供的信息。在你的游戏中，玩家交互的第一个主要物体给了他们一个“游戏结束”屏幕，这在玩家与游戏中其他物体（包括道具）之间创建了糟糕的关联。你可以尽可能地使用视觉线索来指示哪些是好的，哪些是坏的，但这些视觉线索并不保证有效。作为一个一般原则，玩家犯的首几个错误应该是游戏后期的学习机会。\n\
  \n修复这个问题的最佳方法是减少犯错的惩罚。但与其修改代码来防止即死，有一种更简单的方法在犯错后给玩家第二次机会：在第一个敌人之前放置一个拾取物品（参见图 7-1）。\n\
  \n![image](img/9781119404187-fg0701.png)\n\n图 7-1: 添加一个拾取物品。\n\n这看起来可能是一个微小的改变，但并不是每个游戏设计的改变都必须很大才能产生巨大的影响。通过在第一个障碍物之前添加拾取物品，你正在用一个物品教会两个知识：\n\
  \n*   `玩家很早就学会了拾取物品的好处，因为他们从一开始看到分数增加。`这样，他们会将两者联系起来。\n*   `玩家从一开始就学会了游戏中有益道具，从而正向强化。`\n\
  \n在他们看到这个拾取物品后，他们会看到敌人角色并发生以下两种情况之一：\n\n*   他们会意识到该角色是敌人并避开。\n*   他们会撞上角色并丢失一分。\n\
  \n在敌人之前只添加一个拾取物品的巧妙之处在于，玩家不仅学会了拾取物品是好的，而且在不需要重新开始游戏的情况下学会了敌人是坏的。他们受到了惩罚，但并不会严厉。他们学会了应该避免什么以及哪些是可以交互的。\n\
  \n### 创建用户界面教程\n\n玩家可以自己发现很多问题，但一个简单的教程在防止玩家感到挫败方面大有帮助。只有当你知道如何玩游戏时，游戏才是有趣的。如果你不知道怎么玩，游戏可能会变得比它的价值更无聊。教程是帮助解决学习玩法问题的一种简单方法。\n\
  \n由于你正在制作的游戏没有任何非常复杂的控制操作，教程本身不需要非常复杂——但它仍然必要的。在《超级马里奥兄弟》或街机游戏时代，教程是不必要的，因为玩家实际上使用的控制和按钮非常少——弄清楚控制只需要一分钟左右。如今，游戏手柄上至少有十个按钮，键盘上有上百多个。这还未包括现在通过代码提供的各种不同控制组合。对于从未玩过游戏的人来说，学习如何玩游戏并不简单。\n\
  \n要为你的游戏创建一个 UI 教程，你需要创建一个新的 UI。遵循以下步骤：\n\n1.  `Choose GameObject ⇒ UI ⇒ Text.`。\n\
  2.  `调整文本使其位于画布的左下角，并使用一种显眼且清晰读的颜色。`\n3.  `删除文本框中的所有文本。`\n4.  `从 Text (script) 下拉菜单中，有一个段落部分。在该部分你会看到\
  \ `Horizontal Overflow` 旁边有一个下拉菜单。将其从 `Wrap` 改为 `Overflow`。`\n    这防止文本过长时被截断。\n\
  5.  `将其重命名为“Direction Text”。`\n6.  `打开 Char 代码脚本。`\n7.  `在代码顶部输入 `public string\
  \ directionText;` 位于 `winText` 和 `countText` 下方。`\n8.  `在 `void Start()` 方法中输入 `directionText.text\
  \ = \"W=Forward A=Left D=Right\";``\n    这在游戏开始时显示教程。教程应该在进入下一个代码之前给出基础控制。后续代码实际上放置在控制按的\
  \ `if` 语句中。第一个将用于向前移动（W）。图 7-2 中所示的代码提供了教程变化的提示。\n\n![image](img/9781119404187-fg0702.png)\n\
  \n目前，如果按下 W 键，发生的是角色向前移动。\n\n1.  添加一个 `if` 语句：`if (directionText.text == \"W=Forward\
  \ A=Left D=Right\") {`。\n    这将使得当你按下 W 键且 `directionText` 是初始文本时，执行后续代码。\n2.  在这个\
  \ `if` 语句内部，添加 `directionText.text = \"Press Space to Jump\";`。\n    这将 `directionText`\
  \ 更改为教程的下一步。\n3.  转到跳跃代码 (`KeyCode.Space`)。\n4.  遵循步骤 1 和 2，但将步骤 1 中的 `directionText.text`\
  \ 从 `W=Forward A=Left D=Right` 改为 `Press Space to Jump`，并将步骤 2 中的 `directionText.text`\
  \ 从 `Press Space to Jump` 改为 `Left Shift to Sprint`。\n5.  转到向前冲刺代码 (`KeyCode.W &&\
  \ KeyCode.LeftShift`)。\n6.  再次遵循步骤 1 和 2，但将步骤 1 中的 `directionText.text` 从 `Press\
  \ Space to Jump` 改为 `Left Shift to Sprint`，并将步骤 2 中的 `directionText.text` 从 `Left\
  \ Shift to Sprint` 改为 `\" \"`。\n\n现在玩家将通过教程引导。当他们按照教程建议的操作时，教程的文本将会更改。保存代码并回到 Unity。使用“Direction\
  \ Test”旁边的目标选择“Direction Text”对象。\n\n### 使用射线检测防止爬墙\n\n\n\n\n光线追踪（Raytracing）通过判断一个物体是否接触另一个物体来工作。它在一个方向上创建一个锥体，让玩家能够感知它何时接触另一个物体或靠近另一个物体。你可以指示物体何时接近或位于物体周围，或者判断玩家距离地面或墙有多远。\n\
  \n在进行任何其他操作之前，你需要在跳跃字符串（jump string）中添加额外的代码。目前，该代码可以工作，并确保角色在跳跃时接触地面。在 `if` 语句的末尾，添加\
  \ `&& Groundtouch == True`。这样，代码就会知道只有当玩家按下空格键并接触地面时，玩家才能跳跃。\n\n现在，在添加墙壁接触代码之前，你需要在代码顶部添加一个新的布尔值（bool）。`public\
  \ bool wc = false` 与 `gc` 代码类似。这是因为你所做的只是将 `gc` 代码作为 `wc` 代码的参考点。\n\n在 `gc` 的 `Vector3`\
  \ 紧下方，添加一个新的 `Vector3`，它的内容与 `gc` 代码完全相同，但方向不是向下，而是 `Vector3.Forward`。这样，玩家将使用前向光线追踪，并能够判断正前方有一个物体。代码之间的区别在于代码执行的结果。`gc`\
  \ 代码用于判断玩家是否接触地面，而 `wc` 代码则防止玩家爬墙。\n\n解决此问题的最简单方法是防止角色向前移动穿过墙壁。之前的敌人代码一样，这可以通过每当玩家从正面接触物体时就让角色向后移动一段距离来实现。在代码顶部，为代码添加一个新的浮点数（float）。在墙壁顶部添加\
  \ `public float wall = 20f`。这将防止角色在不跳过间隙的情况下通过关卡。数字 20 有效是因为向后移动的速度比向前冲刺更快，因此无法通过结合跳跃键来跳过游戏中需要跳跃的部分。\n\
  \n在 `Vector3 gc` 代码下方，放置图 7-3 所示的 `wc` 代码。然后，在其下方创建一个 `if` 语句：`if (Physics.Raycast\
  \ (transform.position, wc. 0.5f))`。这决定了角色前方何时存在物体。当物体存在时，角色将根据之前定义的墙壁距离向后移动。这段代码将防止角色爬墙，但它也会导致角色与敌人角色之间的交互出现问题。对此，我发现\
  \ 0.4f 实际上比 0.5f 更好，因为它提供了足够的距离，让墙壁仍然导致角色后退并防止爬墙，同时也能防止敌人角色直接从你身上弹开。\n\n![image](img/9781119404187-fg0703.png)\n\
  \n图 7-3： 墙壁接触代码。\n\n保存此代码并返回 Unity。在 Unity 中，选择一个敌人角色。进入检查器（Inspector）窗口并向下找到刚盒形碰撞体（box\
  \ collider）。将碰撞体的大小更改为 (0.5,0.5,0.5,)。现在，角色将无法简单地爬墙并同时受到敌人角色的影响。\n\n![image](img/c8.png)\n\
  \nUnity 是一款出色的游戏开发软件，但它在实际为游戏创建角色或环境的能力方面有限。在本章中，你将学习另一个可以帮助你为游戏注入活力的程序：Blender。本章将帮助你学习\
  \ Blender 的基础知识，以便你对游戏中的角色和障碍物进行建模和动画制作。\n\n刚打开 Blender 时可能会感到畏畏。本章将帮助你熟悉界面，而迷失在\
  \ Blender 能够实现的所有功能中。在本章中，你将创建并编辑单个物体，并学习 3D 网格的不同部分以及你如何使用它们来赋予角色以生命。\n\n## 使用\
  \ Blender 玩新花\n\nBlender 是一个开源的 3D 动画创作套件。这意味着它是 3D 开发中具有多种用途的程序。建模、骨骼绑定、动画、动作跟踪、甚至编辑和游戏开发都是\
  \ Blender 可以处理的工作。它通过社区驱动的更新来实现这些。用户不仅能够、而且被鼓励研究并修改 Blender 运行的代码。这在 Blender 内部形成了一个强大的社区，对于\
  \ Blender 成为今天这样多功能且免费的程序至关重要。\n\n对于你的游戏，你将主要使用 Blender 的建模和动画能力来帮助制作游戏中的角色和障碍物。创建资产是开发游戏的关键部分，因为这是游戏设计中关于将游戏的原始愿景变为现实的部分。这并不是一本关于动画的书，也不是一本关于\
  \ Blender 的书。但通过学习 Blender 的基础知识以及如何将从 Blender 创建的文件和模型引入你的游戏，你将能够各种方式定制和个性化你的游戏。\n\
  \n## 下载 Blender\n\n在使用 Blender 之前，你必须先下载它。幸运的是，Blender 适用于所有平台——Windows、Mac 和 Linux。\n\
  \n1. 访问 `blender.org`（见图 8-1](#10_9781119404187-ch07.xhtml_rc07-fig-0001))）。\n2.\
  \ 在页面顶部点击 `Download`。Blender 会识别你正在使用的平台。\n3. 点击 `Download`。\n4. 将文件移动到应用程序文件夹。\n\
  \n![image](img/9781119404187-fg0801.png)\n\n图 8-1 Blender 网站。\n\n## 首次打开 Blender\n\
  \n当你第一次打开 Blender 时，你会看到图 8-2](#10_9781119404187-ch07.xhtml_c07-fig-0002))所示的屏幕。在这里你会看到下载的\
  \ Blender 版本，以及关于 Blender 的其他链接，包括捐赠给 Blender 的地方。你还会看到一个“最近”部分，因为你还没有创建项目。要移除此覆盖层，点击它的侧边；这将进入基础界面。\n\
  \n![image](img/c8.png)\n\n图 8-2：\n\nBlender 的魅力之一在于可定制性。你可以更改界面以匹配你的工作风格，但为了本书的目的，我建议坚持基础界面。\n\
  \n窗口中心是 `3D View`。这类似于 Unity 中的场景视图（Scene view）。它是你专注于工作的地方。在 `3D View` 中，你会注意到一个带有中心盒子的网格。这个网格显示了\
  \ *x*、*y* 和 *z* 轴。Unity 和 Blender 之间的第一个主要区别是 *y* 轴和 *z* 轴交换了位置，*y* 轴沿网格延伸，而 *z*\
  \ 轴指向网格的方向。Unity 在从 Blender 导入文件到 Unity 时会自动进行调整，因此不会引起问题，但你在创建角色和动画时最好记住这一点。\n\n\
  在屏幕顶部，你会注意到 `Information` 窗口。这是大部分配置设置所在地。你也可以使用此部分进行保存。\n\n\n\n在屏幕底部，你会看到 `Timeline`（时间轴）。它用于控制你将制作的动画，让你能够插入关键帧并根据帧数调整你的动画。\n\
  \n在屏幕的右上角，你会看到 `3D Outliner`（3D 大纲视图）。它显示了场景中所有的对象。在大纲视图的下方，你会看到 `Properties Editor`（属性编辑器）。你可以在这里调整场景或对象的属性，更改材质，甚至为对象添加修改器或约束。\n\
  \n## 在 BLENDER 中创建新文件\n\n要在 Blender 中创建新文件，选择`File  ⇒ New`文件⇒新建）。当弹出窗口时，点击`Reload\
  \ Start-Up File`重新加载启动文件）。\n\n每当你创建一个新文件时，场景都会重置为仅包含一个立方体、一个相机和一个灯。这是 Blender 的标准设置。要删除场景中的相机、灯光或立方体等对象，只需选择你想删除的项目并按下键盘上的\
  \ `X` 键。将会弹出的窗口询问你是否确定删除此对象。点击 yes（是）或再次按下 `X`。对象随后将被删除。\n\n## 了解 BLENDER 界面\n\n\
  Blender 是一个非常优秀的动画和建模程序，但像 Unity 一样，第一次打开时可能会令人畏畏。在下面的章节中，我将为你介绍 Blender 界面的不同部分，并解释如何正确使用该程序。了解\
  \ Blender 的布局对于使用该程序帮助构建游戏的角色和物体将是无价的。\n\n### 标签页 (TABS)\n\n在`3D View`（3D 视图）区域的左侧有一个菜单。在菜单的最左侧有多个你可以选择的标签页。标签取决于你所处的模式。\n\
  \n在第 9 章和第 10 章中，你只需要关注的两个标签页是`Create`创建和`Tools`工具标签。\n\n### 工具标签页 (TOOLS TAB)\n\
  \n`Tools`标签页（参见图 8-3）会更改选中的对象。\n\n当你处于`Object mode`（物体模式）时，这涉及变换控制、镜像、删除、更改原点以及着色类型。\n\
  \n当你处于`Edit Mode`（编辑模式）时，`Tools`标签页会打开编辑对象的不同选项，从挤出到删除面部。\n\n![image](img/9781119404187-fg0803.png)\n\
  \n图 8-3： `Tools`标签页。\n\n### 创建标签页 (CREATE TAB)\n\n`Create`标签页（参见图 8-4）允许你在场景中创建不同的对象，从正方形到球体。它还允许你为场景创建路径、相机甚至光源。\n\
  \n当你在`Object mode`中创建对象时，两个对象是相同的，除非你之后将它们合并或连接在一起。\n\n除非绝对需要，否则不要在`Edit Mode`中使用`create`创建。\n\
  \n![image](img/9781119404187-fg0804.png)\n\n图 8-4： `Create`标签页。\n\n### 关系标签页 (RELATIONS\
  \ TAB)\n\n`Relations`标签页显示了你对对象的各种分组选项。它可以设置对象的父子关系、创建对象组或将对象链接在一起。\n\n### 动画标签页\
  \ (ANIMATION TAB)\n\n`Animation`标签页让你能够创建和删除动画中的关键帧，并烘烘焙某些运动（创建序列中的所有单独帧，而不是让计算机仅仅推断该运动）。\n\
  \n### 物理标签页 (PHYSICS TAB)\n\n`Physics`标签页允许你调整对象的质量，并像 Unity 那样应用刚体物理效果。\n\n###\
  \ 蜡笔笔标签页 (GREASE PENCIL TAB)\n\n`Grease Pencil`标签页是一种向场景中添加注释和动画备注的方法，你可以将其用作参考点。蜡笔还可以用于辅助\
  \ Unity 内的 2D 动画。\n\n### 着色和 UV 标签页 (SHADING AND UV TAB)\n\n`shading and UV`标签页允许你修改对象渲染的方式（渲染时其线条是硬边缘的还是平滑的），以及如何修复或调整对象上可能反向的面。\n\
  \nUV 贴图也可通过创建或标记“接缝”来帮助角色或对象制作纹理。\n\n### 选项标签页 (OPTION TAB)\n\n这是网格选项菜单，让你控制`X-mirror`（X\
  \ 轴镜像）和`Edge Select`（边选择）模式。`X-mirror`工具允许你对称地编辑对象。如果你在对象的一侧进行更改，该更改将沿 `x` 轴在另一侧发生。`Edge\
  \ Select`模式让你能够调整边缘的路径，使其具有圆角或倒角。\n\n### 大纲视图 (THE OUTLINER)\n\n在屏幕的右上角，你会看到`Outliner`（大纲视图），它是用于项目的（参见图\
  \ 8-5）。`Outliner`有三个用途：\n\n- 点击对象旁边的眼睛可以使其不可见。\n- 选择相机决定了渲染内容。\n- 点击对象左侧的加号将显示所有子对象。\n\
  \n![image](img/9781119404187-fg0805.png)\n\n图 8-5： 同样在`Timeline`上，你还会看到一个控制面板，允许你播放、倒回、快进或暂停动画。你还会看到一个红色按钮，开启*自动关键帧*，每当你在场景中移动或调整对象时，Blender\
  \ 都会记录关键帧。如果你沿着 Timeline 移动对象，Blender 将创建另一个关键帧而不是覆盖，从而导致你的对象或角色移动。\n\n### 时间轴 (TIMELINE)\n\
  \n`Timeline`（参见图 8-6）位于屏幕底部，主要用于控制动画。调整 Timeline 将调整时间。\n\n![image](img/9781119404187-fg0806.png)\n\
  \n### 属性区域 (PROPERTIES SECTION)\n\n你会注意到`Timeline`底部有数字。这些数字*并不*代表动画中的秒数——它们代表帧。在动画中，帧是每秒钟内飞过的图片，以产生运动的幻觉。不同的媒体有不同的帧率，但你应该了解的三个是：\n\
  \n- **24 帧/秒 (FPS)：** 标准电影\n- **30 FPS：** 游戏最低标准\n- **60 FPS：** 高定义\n\n对于你的游戏，你将基于\
  \ 30 FPS 进行。屏幕底部的数字将指示你处于哪一帧，以及动画的起始和结束帧。\n\n与`Create`和`Tools`标签页类似，窗口的`Properties`部分对对象有不同的标签。前四个标签页用于与对象不直接相关的属性：\n\
  \n\n\n\n\n- **相机（Camera）**：渲染设置。渲染设置是你导出动画的方式。将这些想象为设置摄像机拍摄电影的一部分。渲染设置将动画和 3D 对象转换为可以观看的图片/电影。在渲染设置中，你可以设置以下（以及更多）：\n\
  \n  - **分辨率（Resolution）**：动画的细节程度。\n  - **帧数（Frame count）**：动画每秒的帧（图片）数量。游戏平均为每秒\
  \ 30 帧。\n  - **输出位置（Output location）**：最终动画/图片保存在计算机上的。\n\n- **图片（Pictures）**：渲染层设置。渲染层显示渲染时动画中的哪些层是可见的。你可以像\
  \ Photoshop 文件或拼贴一样对动画分层，并随时显示不同的层。\n\n- **灯光、球体和圆柱（Light, Sphere, and Cylinder）**：场景设置。在场景设置中，你可以调整场景本身的设置，包括选择主相机来渲染动画，以及调整场景包含音频，甚至为场景添加重力和刚体设置。\n\
  \n- **世界（World）**：环境/背景设置。这些设置控制场景渲染时的背景颜色，让你控制地平线和场景内的自然光照。\n\n- **立方体（Cube）**：对象设置。这些设置控制对象的变换控制、显示选项和分组设置。在此选项卡中，你可以在场景中移动对象，将其放置在场景中的不同层，并将对象与其他对象分组以便导入和导出。\n\
  \n- **链（Chain）**：约束控制。这些控制允许你将对象链接在一起。与不改变对象的组控制不同，约束控制将直接影响对象在场景中的移动方式。作为其他对象父的对象会在父对象移动时而移动。约束控制在下拉菜单中提供了多种在场景中链接两个对象在一起的方法。\n\
  \n- **扳手（Wrench）**：修改器控制。修改器控制可以改变对象的形状、尺寸甚至平滑度。在修改器控制中，你可以从下拉菜单中选择多个可以更改对象的不同修改器。\n\
  \n- **倒三角形（Upside-down triangle）**：对象数据。对象数据包含对象的纹理空间、顶点组和形状键。这是对对象数据不同变化的细分。例如，此菜单中的形状键可以用来将对象的更改到不同的键位置。\n\
  \n- **球体（Sphere）**：材质设置。材质是对象的颜色和外观。在这里，你可以更改这些视觉设置，为对象提供不同的颜色、透明度甚至反射。\n\n- **国际象棋格（Checkerboard）**：纹理设置。纹理就像是你放置在材质之上的图片或图案。纹理设置让你能够向对象添加图片或凹凸贴图，帮助赋予对象更多的生命力和维度感。\n\
  \n- **星形（Stars）**：粒子效果控制器。提供在动画中添加粒子效果的选项，例如雨或爆炸。这些设置还可以用于创建对象上的其他物体，如头发或草地。\n\n\
  - **弹跳球（Ball Bouncing）**：对象上的物理控制。这控制对象上所有的物理设置。这些可以包括特定对象上的刚体设置，甚至是流体模拟。\n\n##\
  \ 导航界面\n\n本节解释了如何在 Blender 中导航 3D 空间。导航设置与你在 Unity 中使用的设置类似，但理解程序之间的差异仍然很重要。为了正确使用\
  \ Blender，你必须熟练地在程序内导航 3D 空间。\n\n### 平移、旋转和缩放\n\n与 Unity 一样，你在 3D 空间中最好的朋友是导航工具。Blender\
  \ 中的平移、旋转和缩放工具与 Unity 中的类似，但这些工具在 Blender 中的工作方式上有些不同：\n\n- **平移（Panning）**：要在屏幕上平移，点击并按住鼠标中键同时按住\
  \ `Shift` 键移动鼠标。\n- **旋转（Rotating）**：要绕场景旋转，按住中键并移动鼠标。\n- **缩放（Zooming）**：要对场景放大或缩小，向内外滚动中键。向自己方向滚动中键会将相机向场景放大。向背自己方向滚动中键会将相机从场景缩小。\n\
  \n### 变换工具\n\n变换工具调整所选对象的位置、旋转和比例。在`Edit Mode（编辑模式）`中，这些工具还可以用于变换对象的顶点、边缘或面。\n\n\
  在场景窗口底部和时间轴上方，你会看到 `Global（全局）`下拉菜单旁边有三个不同的蓝色按钮。这些就是变换工具：\n\n- **全局/局部（Global/Local）**：`Global`\
  \ 下拉菜单显示对象可以沿其调整的不同轴。你只需要知道的两个是全局轴和局部轴。全局轴与世界轴对齐且永远不会改变。局部轴沿对象的轴发生变化。\n- **平移工具（Translation\
  \ tool（参见图 8-7)）**：带有向上箭头的按钮是平移工具。选择此按钮将显示沿轴（全局或局部）的三个箭头，你可以选择沿哪个轴移动对象。\n- 平移工具更改对象的位置。访问此工具另一种方法是在键盘上按下\
  \ `G`（代表 grab，抓取）。这将拾起对象以便你移动它。\n- **旋转工具（Rotation tool（参见图 8-8)）**：曲线是旋转工具。当你点击它时，对象将被三条线包围，用于绕特定轴旋转。\n\
  - 旋转工具更改对象的旋转。你也可以通过按下键盘上的 `R`（代表 rotate，旋转）旋转对象。\n- **缩放工具（Scale tool（参见图 8-9)）**：带有末端正方形线的按钮是缩放工具。点击此按钮将显示沿轴的线，线周围围绕有立方体。\n\
  - 缩放工具更改对象的大小。你也可以通过 `S` 缩放对象。\n\n\n\n\n\n你使用 `Blender` 来为你的游戏创建资产，因为你可以在 `Blender`\
  \ 中创建复杂的形状。你可以通过切换到编辑模式（Edit Edit Mode）来更改对象的形状（参见图 8-10）。你有两种方式切换到 `Edit Mode`。\n\
  \n![image](img/9781119404187-fg0810.png)\n\n图 8-10： 编辑模式。\n\n切换到 `Edit Mode` 的第一种方法是在时间轴（Timeline）上方显示为\
  \ `Object Mode` 的地方，从 `Edit Mode` 下拉菜单中选择。\n\n进入 `Edit Mode` 的另一种方法是按下键盘上的 `Tab`\
  \ 键。这将从你当前处于什么种模式切换到 `Edit Mode`。如果你已经处于 `Edit Mode` 中，按下 `Tab` 将将模式切换回进入 `Edit\
  \ Mode` 之前的上模式。\n\n`Blender` 还有其他几种模式，你可能不会用到，但应该有所了解：\n\n* `Object Mode`：允许你移动物体并为角色制作动画。\n\
  * `Sculpt Mode`：赋予你像塑造粘土一样塑造物体形状的能力。（使用它需要许多顶点。）\n* `Weight Paint`：帮助你将角色绑定到骨骼结构上。这对于创建会移动和表达表情的角色非常有用。\n\
  * `Texture Paint`：在物体上绘制纹理。\n* `Vertex Paint`：与 `Texture Paint` 类似，但直接对顶点绘制。\n\n\
  ### 顶点、边和面\n\n当你进入 `Edit Mode` 时，你正在更改对象的网格（形状）。网格由三部分组成：顶点、边和面。你可以通过改变顶点、边或面的位置、旋转、大小或数量来改变网格。在你找到变换工具的所在旁边，你会看到三个新的橙色按钮：\n\
  \n* `Vertex Select tool`（顶点选择工具）：立方体按钮边缘的小橙色圆点就是 `Vertex Select tool`。`Vertices`（顶点，如图\
  \ 8-11 所示）是任何物体的点。它们标记了物体上边结束的点。顶点是物体最小的部分。\n* `Edge Select tool`（边选择工具）：立方体按钮上的橙色线条是\
  \ `Edge Select tool`。`Edges`（边，如图 8-12 所示）是两个顶点之间的线。它们标记了物体上的线并用于组成面。\n* `Face Select\
  \ tool`（面选择工具）：立方体正面的橙色正方形是 `Face Select tool`。`Faces`（面，如图 8-13 所示）由至少三边组成，构成了物体的视觉部分。每当你看到一个物体时，你看到的都是这些包围并构成网格的物体的面。\n\
  \n![image](img/9781119404187-fg0811.png)\n\n图 8-11： 顶点。\n\n![image](img/9781119404187-fg0812.png)\n\
  \n图 8-12： 边。\n\n![image](img/9781119404187-fg0813.png)\n\n图 8-13： 面。\n\n### 编辑工具\n\
  \n在用于编辑物体的工具方面，有许多不同的选项。在工具（Tools）选项卡上，你至少有 34 种可以用来更改物体的工具，这还没有包括某些工具提供的不同变体。目前，你只需要真正了解其中的四种工具：\n\
  \n* `Loop-Cut Slide (Ctrl+R)`（循环切线滑动）：`Loop-Cut Slide` 工具（如图 8-14 所示）创建一个环绕物体的新边。这创建了可以编辑的新边和顶点，并将面一分为二。当你使用\
  \ `Loop-Cut Slide` 工具时，选择你想让线条环过的边之一。它将作为一条环绕边的粉色线出现。当你有了所需的边后，左键点击它。这将线条变为黄色，但尚未放置。点击边后，再次左键点击它。\n\
  * `Extrude (E)`（挤出）：`Extrude` 工具（如图 8-15 所示）扩展物体。\n* `Inset (I)`（内插）：`Inset` 工具（如图\
  \ 8-16 所示）在选中区域内创建一个面。\n* `Insert Face (F)`（插入面）：`Insert Face` 工具在两条边之间创建一个面。\n\n\
  \n\n\n\n在你开始为游戏创建角色之前，你需要考虑在第 1 章中讨论的主题和风格。想一下，如果游戏不再是一个水工在蘑菇上跳跃，而是一个外星人在宇航员身上跳跃，这个游戏将会会有多大的不同。机制和目标可能是相同的，但不同的主题和风格会改变游戏的感受。机制是任何游戏中最重要的部分，但主题是引导玩家进入世界并推动他们真正玩下去的关键。\n\
  \n主题有助于为你的游戏赋予一个故事和目的。机制可能有一个目标，但主题赋予了玩家一个目标。你不仅仅是到达关卡的终点——你是在是在击败一条巨龙。在制作游戏时，你必须考虑你想让玩家在玩时有什么感受。\n\
  \n## 主题：你游戏的语言\n\n游戏的主题就是故事。角色*是谁*和他们正在做什么同样重要。在构建角色之前，问问自己玩家是谁。一个一边用超级速度奔跑一边与邪恶的蛋形教授战斗的蓝色刺猬，看起来可能是一个荒谬的概念，但它已经持续了\
  \ 25 多年，因为这个主题是令人记忆深刻的。如果索尼不是一只刺猬，他还会成功吗？游戏的主题通常是人们想到这款游戏时首先想到的。\n\n《真人格斗》和《街头霸王》基本上是同类型的游戏，但受众不同，尤其是当这些游戏刚出来且操作方式相似时。区别在于游戏的呈现方式。《街头霸王》拥有极具风格化的角色，他们巨大的肌肉或娇小的体型，进行着大动作的战斗。而《真人格斗》追求的是更“真实”且更残忍的方式。两款游戏都是关于战斗，但它们的主题非常不同。\n\
  \n## 风格：你游戏的重音\n\n当你考虑你的游戏时，可能会考虑到游戏中的机制或角色。你可能会想到游戏主题或故事，但一些早期开发者忽略的一点是游戏的风格。风格是你的游戏的外观。一个具有相同故事和角色的游戏仅在风格上就可以产生巨大的差异，这也会改变人们感知和玩游戏的方式。\n\
  \n像《使命召唤》或《现代战争》这样的游戏采取了更真实的方法，淡化了色调并使用了更真实的比例。另一方面，《守望先锋》和《堡垒先锋》则追求更动画化、风格化的方法，选择明亮的颜色和独特的形状来创建角色；大角色比现实更加夸张，而小角色则非常微小。想一下这两种方法如何改变你对游戏的感知，以及吸引到这些游戏的观众。\n\
  \n媒体中对风格最好的对比是在动画片中。所有的动画电影都以某种方式进行风格化，以吸引特定的感觉或观众。迪士尼的电影和节目使用更柔和、更精细的形状，带有锐利的线条将它们与背景隔离开。这种方法强调了迪士尼电影中闻名的控制感和精细感。迪士尼的电影和节目都是经过深思熟虑制作的，面向家庭观众。\n\
  \n另一方面，卡通频道（Cartoon Network）使用了丰富丰富的色调，线条不那么精细。它的节目旨在为场景的每一个部分注入生命，甚至让某些角色融入背景中。卡通频道的节目似乎放弃了精致感来换取激情感。剧中的每一条线条都感觉是有生命力的，即使线条本身是粗糙的。\n\
  \n蒂姆·伯顿的电影都经过风格化处理，具有非常暗淡的色调，点缀着鲜艳的色彩和拉长的形状。他的电影是扭曲且哥特式的，让观众沉浸在他对世界的视觉中。\n\n索尼动画（Sony\
  \ Animation）试图构建具有表现力的角色，并专注于感觉像 2D 角色的 3D 角色。角色的动作方式比现实更夸张，比普通人类更有表现力。\n\n你将在第\
  \ 10 章中学习更多关于动画以及赋予角色生命的知识，但现在只需记住，即使情节和角色完全没有变化，风格也会改变故事。我刚才描述的所有风格都不坏，但它们确实会改变你对使用这些风格的电影的看法。想象一下蒂姆·伯顿拍了一个关于保护女儿的吸血鬼电影，或者卡通频道拍了一个关于会说话的鸭子和三个侄子环游寻找财富的节目。\n\
  \n## 创建你的第一个角色\n\n对于你在书中正在制作的游戏，主题和风格已经预设好，以最大化你能够做到和学到的内容。游戏关于一个试图逃离机器人反乌邦社会的简单方块人。角色本身的风格非常卡通化，大眼睛是它们的核心特征。这种风格很容易建模和动画化，因此你可以在有限建模和动画经验的情况下轻松地构建和制作你的游戏。\n\
  \n主角是一个带有两个圆眼的蓝色方块。要开始制作该角色，请在 `Blender` 中打开一个新文件。你打开 `Blender` 时看到的立方体是一个很好的开始，因为它恰好是你的角色所需的尺寸和比例。\n\
  \n### 创建眼睛\n\n在你打开 `Blender` 并在网格上有一个立方体后（参见图 9-1），是时候为角色制作眼睛了。角色的眼睛只是立方体内的简单球体。要创建眼睛，请遵循以下步骤：\n\
  \n1. 点击`Create`选项卡。\n2. 找到`Sphere`，并在 `y` 轴上旋转 `90` 度。\n3. 缩放球使其比立方体小。\n4. 将眼球放在立方体内，使其突出出来。\n\
  5. 在选中眼睛的同时，按下 `Shift + D`。\n6. 这将复制眼睛，这样就有两个了。\n7. 将另一只眼睛移动到立方体的另一侧，让角色有一只眼睛（参见图\
  \ 9-2）。\n\n### 将眼睛设置为父级\n\n在你完成眼睛后，角色身上仍然有一个问题。当你移动身体时，眼睛不会随之移动。大多数人不想在行走时留下眼睛，因此解决此问题的方法是将眼睛设置为立方体的父级。要执行此操作，转到大纲视图找到立方体和球体。\n\
  \n要将球体设置为父级，只需将球体拖到立方体上。这样做时，会弹出一个文本框显示 `Drop to Set Parent`。当你看到该文本框时，松手，它们就会成为该对象的子级（参见图\
  \ 9-3）。\n\n### 为角色创建材质\n\n\n\n\n1. **点击属性面板中的 Material（材质）选项卡。**\n\n2. **如果没有可用的材质，点击材质框右侧的加号\
  \ `(+)`。如果已有材质，请跳到第 4 步。**\n   在你按下加号 `(+)` 后，你会看到了一个新的空白材质。\n\n3. **点击材质窗口下方的 New（新建）按钮来填充此新的空白材质。**\n\
  \   这将创建一个基础 `Lambert` 材质。\n   在 `Preview`（预览）下拉下方，你会看到 `Diffuse`（漫反射）和 `Specular`（高光）。`Diffuse`\
  \ 是物体的颜色；`Specular` 是物体的光泽。\n\n4. **在 `Diffuse` 旁边，你会看到一个下拉菜单。点击此下拉菜单将显示所有类型的材质。目前只需保留\
  \ `Lambert` 作为材质，但请记住，不同的材质渲染效果略有不同，可以产生不同的效果。强度（intensity）取决于颜色的浓郁。**\n\n5. **更改\
  \ `Specular` 颜色，使物体的光泽不仅仅是白色。**\n   尝试将其改为浅蓝色以匹配角色的配色。\n   你还可以更改 `intensity`（物体发光的程度）和\
  \ `hardness`（光泽边缘的软硬——亮度越高，边缘越锐利）。`CookTorr` 与 `Lambert` 类似，因为它也有一个带有不同选项的下拉菜单。`CookTorr`\
  \ 是一种特定的光泽类型，会改变物体光泽的一致性。\n\n6. **将 `Diffuse` 颜色改为浅蓝色（参见图 9-4）并保持 `Specular` 不变。**\n\
  ![image](img/9781119404187-fg0904.png)\nFIGURE 9-4: 应用的材质。\n\n### 创建眼睛材质\n\n眼睛的材质制作方法与身体略有不同，因为眼球和瞳孔需要两种不同的颜色。（你也可以使用这些步骤来创建虹膜，但这只需要多一个步骤，对于制作一个像样的卡通眼球来说并非必须。）\n\
  \n首先，确保选中了其中一只眼睛。然后按照上一节的第 1 到 5 步创建一个白色材质而不是蓝色材质。然后遵循以下步骤：\n\n1. **切换到 Edit Mode（编辑模式）。**\n\
  2. **选择前面的两个圆圈面（参见图 9-5）。**\n3. **点击 `Materials`（材质）选项卡。**\n4. **创建一个新材质（上方列表的第\
  \ 2 和第 3 步）。**\n5. **将漫颜色改为黑色。**\n6. **点击顶部的 `Assign`（分配）。**\n   这将材质仅分配给选中的面。\n\
  7. **返回 Object Mode（物体模式）并对另一眼睛重复此过程。**\n![image](img/9781119404187-fg0905.png)\n\
  FIGURE 9-5: 选中的面。\n\n### 保存你的角色\n\n完成角色创建后（参见图 9-6），你需要保存该角色以便在游戏中使用它（或者在第 10 章中的\
  \ `untitled.blend`）更改为 `player.blend`。**\n5. **点击 Save as Blender File（保存为 Blender\
  \ 文件）。**\n![image](img/9781119404187-fg0906.png)\nFIGURE 9-6: 完成的角色。\n![image](img/9781119404187-fg0907.png)\n\
  FIGURE 9-7: 保存界面。\n\n### 创建敌人小兵\n\n眼睛的材质制作方法与身体略有不同，因为眼球和瞳孔需要两种不同的颜色。（你也可以使用这些步骤来创建虹膜，但这只需要多一个步骤，对于制作一个像样的卡通眼球来说并非必须。）\n\
  \n（注：原文此部分存在大量重复和错误段，已根据要求进行清理处理。）\n\n\n\n\n-   **菲涅尔 (Fresnel)**：决定了物体以特定角度相对于材料的反射程度。\n\
  -   **混合 (Blend)**：反射与材料的混合程度。\n-   **深度 (Depth)**：允许反射中嵌套反射的次数。如果你的场景中有多个反射材质，且深度不够，这些反射将不会显示在该材质上。\n\
  -   **最大距离 (Max Distance)**：另一个物体离多远才能在反射中清晰可见。（如果最大距离为 0，则没有最大距离。）如果物体超过了最大距离，它将变得淡且模糊，并不断加剧，直到在镜子中无法识别为止。\n\
  \n对于金属的反射率，我建议使用 0.110 配合 1.25 的混合。这将创建一个外观良好的金属物体，看起来仍然很有光泽且具有机器人感。请参考图 9-10 作为示例。\n\
  \n![image](img/9781119404187-fg0910.png)\n\n图 9-10： 敌人材质。\n\n对于透镜片，你应该遵循之前处理眼睛时的相同步骤。区别在于，虽然透镜的金属部分反射率与金属主体相似，但透镜本身是由反射性更好的玻璃或塑料制成的。在为透镜金属部分创建材质后，选择对象的透镜部分创建一个新材质，并将颜色更改为黑色（参见图\
  \ 9-11）。完成后，务确保提高反射率，使得透镜中的反射比身体高得多。\n\n![image](img/9781119404187-fg0911.png)\n\
  \n图 9-11： 透镜。\n\n完成透镜片后，将立方体从 `player` 重命名为 `enemy` 并将透镜设为其父级。然后保存项目。你就为你的视频游戏有了一个完成的小兵（grunt）角色（如图\
  \ 9-12 所示）。\n\n![image](img/9781119404187-fg0912.png)\n\n图 9-12： 完成的小兵。\n\n## 创建环境危害\n\
  \n你已经创建了游戏角色。现在是时候设计一些场景了。你可以使用 Blender 设计各种不同的环境和场景，但在这里，你要设计玩家必须避开的环境危害。环境陷阱与敌人之间最大的区别在于陷阱的大小。敌人角色的尺寸与其他角色相似，并且可以根据需要调整，但为了让环境陷阱正常工作，它必须具有特定的尺寸，以便你的角色能够通过。\n\
  \n在 3D 平台跳游戏中，设计陷阱时需要考虑所有三个方向。如果陷阱需要从侧面避开，你得考虑它覆盖了多远以及如何防止玩家跳过它。如果它设计成可以跳过去，你需要考虑到这一点进行设计。它必须覆盖玩家需要通过的整个区域，但留出足够的空间让玩家跳过去。\n\
  \n环境危害（类似于坠落）作为一种非敌人的方式杀死角色，并帮助游戏变得不仅仅是躲避敌人。你游戏中的环境陷阱是我个人最喜欢的视频元素之一：压碎机 (the crusher)。\n\
  \n压碎机是一个平台，玩家需要在平台顶部砸下并压碎角色之前穿过它。这个障碍物需要两个部分才能正常工作：一个供玩家爬的下半部分，以及一个如果玩家没有掌握时机就会掉落在上面的上半部分。\n\
  \n按照以下步骤操作：\n\n1. **在 Blender 中创建一个新文件，并将文件保存为 `crusher.blend`。**\n2. **选择中间的立方体。**\n\
  3. **在 3D 查看器的右侧，点击深色框中的小加号 (+)。**\n4. **在出现的菜单中，你会看到位置、缩放和旋转部分，每个部分都有三个不同的轴和数字。将\
  \ X 缩放更改为 30，Y 缩放更改为 3，Z 缩放更改为 0.5。**\n\n`x` 轴上的地图尺寸为 30；这将防止玩家绕过它。Z 等于 0.5 将确保玩家必须跳跃才能到达平台顶部——不需要很多，但有一点点。Y\
  \ 等于 3 将迫使玩家落在平台上，从而强制玩家降落在平台上。（参见图 9-13）\n\n\n\n\n\n虽然这已经足够制作粉碎机了，但从机械的角度来说，你实际上想要创建出符合你在游戏中设定的主题。在这种情况下，主题是机器人反乌托邦，因此在粉碎机的顶部添加一个小警灯。\n\
  \n使用 `Inset Face`（内插面）、`Extrude`（挤出）和 `Loop-Cut`（循环切割）工具开始构建一个放在粉碎机顶部的警灯：\n\n1.\
  \ **在粉碎机顶部的小区域内插一个面，该区域曾是下半部分平台的底部。**\n2. **缩放该内插面，使其看起来更像正方形。**\n3. **将该内插线沿 `z`\
  \ 轴向上移动，使高度呈现阶梯式上升。**\n4. **挤出**并向上移动挤出的部分，在中间留出一些空间作为灯本身。\n5. **再次挤出**，但只向上移动一小段。\n\
  6. **再次挤出**，再向上移动一点，并在顶部稍微缩小尺寸，使其越高越小。\n7. **在顶部再次挤出**，以给它一个平整的顶部。\n8. **使用 `Alt-select`\
  \ 选择步骤 5 中的那个小挤出部分，并选择它周围的所有区域。**\n9. **挤出**并使用 `x` 轴和 `y` 轴扩展挤出的部分，使其看起来像灯的屋顶（示例参见\
  \ 图 9-17）。\n\n![image](img/9781119404187-fg0917.png)\n\nFIGURE 9-17: 灯。\n\n完成顶部的灯后，是时候真正制作粉碎机的底部了，让它看起来更具威慑力。让粉碎机看起来具有威慑力的常见方法之一是添加刺，但这是一个机器人反乌托邦世界，大部分角色都是立方体，所以刺在环境中环境中感觉不协调。对于这种环境，一个带有一些凹槽的平底粉碎机更合适，所以这就是你要制作的。\n\
  \n为了创建必要的凹槽，你需要能够仅挤出粉碎机底部的某些网格部分，而不是整个底部。为了做到，你需要创建更多的面。保持四边形的最佳工具是 `Loop-Cut Slide`（循环切割滑动）工具。\n\
  \n你可以多次使用该工具来创建所需的凹槽，但实际上有一种方法可以使用 `Loop-Cut Slide` 工具一次进行多次切割。当工具仍呈粉色时，你可以向前和向后滚动鼠标中间键，创建多条将同时切割的线。这样做，以便在底部垂直和水平方向各切割六条线（参见\
  \ 图 9-18）。\n\n![image](img/9781119404187-fg0918.png)\n\nFIGURE 9-18: 循环切割滑动线。\n\n\
  创建好必要的线后，开始选择网格底部每隔一个面。这样，网格的底部看起来就像像棋盘状的图案（参见 图 9-19）。这将使你能够只挤出你想挤出的面。对于这个项目，你只想挤出这些面，以给粉碎机一些风格感和纹理。\n\
  \n![image](img/9781119404187-fg0919.png)\n\nFIGURE 9-19: 粉碎机底部的棋盘图案。\n\n选完所有面后，你应该将它们挤出。。和之前一样，你不想把它们挤得太远，因为你想为玩家进入下方留出空间，但你又希望粉碎机的尺寸在游戏中是显眼的。将粉碎机部分挤出的距离比你第一次挤出原始平台时稍微多一点。现在你会发现所有的挤出部分看起来像一组矩形。这是因为你只拉出了选中的面。由于共享顶点，这些面仍然连接在一起，但它们看起来像是略微分离了，这在机械上没有区别，但有助于构建游戏的风格。\n\
  \n完成粉碎机的模型制作后（参见 图 9-20），你还必须给它赋予材质，与之前的敌人和玩家角色一样。\n\n![image](img/9781119404187-fg0920.png)\n\
  \nFIGURE 9-20: 粉碎机。\n\n## 创建移动平台\n\n显而易见，平台是平台游戏的重要部分。任何平台游戏中最常见的平台之一就是移动平台。移动平台就像普通平台，但它们会移动。在关卡中，你创建了几个计划作为移动平台的区域。移动平台将在负责让平台移动的章节中详细讨论。但现在，你的目标是创建一个可以动画化的平台。幸运的是，移动平台很容易制作。\n\
  \n首先在 Blender 中打开一个新文件并保存为 `moving platform.blend`。选择网格中间的立方体并打开 3D 视图侧侧窗口。将移动平台的尺寸更改为\
  \ `X=5, Y=5, Z=0.5`。这将创建一个足够角色跳跃且足够良好的平台。这可以作为一个平台，但再次你想对它进行风格化处理。\n\n遵循以下步骤：\n\n\
  1. **进入编辑模式。**\n2. **选择顶部和底部。**\n3. **对两个面进行内插，在中间创建一个正方形。**\n4. **挤出内插部分。**\n5.\
  \ **使用缩放工具将网格中的内插部分靠近。**\n\n构建好模型后，更改其材质使其看起来具有机械感。你甚至可以让网格的中心部分像玻璃。只需进入编辑模式，选择顶部和底部内插面，将颜色改为蓝色并将透明度设置为\
  \ `0.3` 到 `0.5`，取决于你的喜好。此外，为移动平台的所有材质添加反射。这将为你后续的动画制作创建一个很漂亮的移动平台，就像图 9-22 所示所示。\n\
  \n![image](img/9781119404187-fg0922.png)\n\nFIGURE 9-22: 移动平台。\n\n## 创建硬币拾取物\n\n\
  \n\n\n在本章中，你最后应该创建的是用来替代拾取物品的硬币。完成后，硬币将缓慢旋转并上下跳动，但目前它们只会保持静止。首先，创建一个新文件并将其命名为 `Coins.blend`。删除中心的立方体，以及灯光和摄像。硬币是一个很好的拾取目标。我们已经将硬币与财富和（象征意义上的）想要的东西联系在一起，因此图\
  \ 9-23 中显示的硬币是一个极好的拾取物品。\n\n![image](img/9781119404187-fg0923.png) 图 9-23： 硬币底部。按照以下步骤操作：\n\
  \n1. 创建一个 `cylinder`（圆柱）。\n2. 将该 `cylinder` 在 `y-axis`（y 轴）上旋转 90 度。\n3. 调整硬币形状，使其变薄变小。\n\
  4. 选择正面和反面。\n5. 对这些面进行内插（Inset）。\n6. 对这些面进行挤出（Extrude）并调整尺寸。\n\n现在，为了给硬币一些个性，你想在硬币中间添加一个孔来表示它的价值。在这种情况下，一个就足够了。这将需要使用\
  \ `Boolean`（布尔）修改器。布尔运算是将两个不同对象组合的方法，通过统一它们、取它们的交集部分或从一个对象中减去另一个。按照以下步骤操作：\n\n1.\
  \ 创建一个新的 `cube`（立方体）。\n2. 调整 `cube` 的尺寸，使其高而细，看起来像硬的。\n3. 扩大它的尺寸使其穿过硬币（参见图 9-24）。\n\
  4. 选择硬币。\n5. 进入 `Properties`（属性）窗口中的 `Modifier`（修改器）标签页。\n6. 从 `Add Modifier` 下拉菜单中选择\
  \ `Boolean`。有不同的 `Boolean` 操作供选择：\n    - `Intersect`（交集）：仅保留彼此接触的网格部分。\n    - `Union`（并集）：合并两个对象。\n\
  \    - `Difference`（差集）：从一个对象中减去另一个。\n7. 将操作改为 `Difference`，如图 9-25 所示。\n8. 将 `Solve`\
  \ 改为 `Carve`（雕刻）。\n9. 在 `Object` 下，点击空槽并选择 `Cube`。\n10. 按 `Apply`（应用）并删除 `cube`。\n\
  \n![image](img/9781119404187-fg0924.png) 图 9-24： 相交的部分。\n\n![image](img/9781119404187-fg0925.png)\
  \ 图 9-25： `Boolean` 修改器。\n\n现在硬币上有一个孔，这使其在关卡中脱颖出的另一个理由。完成硬币制作后，是时候改变硬币的颜色了。像之前一样，为对象创建一个新的\
  \ `material`（材质）并对其使其既有反射性又有色彩（参见图 9-26）。\n\n![image](img/9781119404187-fg0926.png)\
  \ 图 9-26： 挖出的孔。\n\n在你完成硬币的基础模型和颜色后（如图 9-27 中所示），尝试对硬币或创建的任何其他对象进行更改，以便你可以称其为自己的。在硬币的案例中，我圆化了边缘并使其略微透明，以配合整个机器人主题，使其看起来更像是一个角色拾取的全息图。\n\
  \n![image](img/9781119404187-fg0927.png) 图 9-27： 完成的硬币。\n\n## 定制你自己的内容\n\n在你完成本章中讨论的一些对象的制作和定制后，尝试通过添加标志牌、不同的角色或建筑来为你的关卡增加更多定制。资产创建就是创建你可能需要的任何资产。本书仅涉及了构成你游戏的基础资产，包括主角以及一些敌人和环境危险。你可以建模的对象的其他想法还有邮箱箱、垃圾桶、树、标志柱和路灯柱。\n\
  \n资产创建是你真正可以让你的游戏独一无二的地方！所以，思考你可以添加什么来为你的游戏带来更多活力。在设计自己的游戏时，在开始之前列一份资产清单。这样，当该构建你自己的资产时，你就清楚需要制作什么和做什么了。\n\
  \n![image](img/c10.png)\n\n在本章中，你将学习动画的基础知识。在第 9 章中，你创建了场景中的模型。现在是时候给它们注入生命了。你将学习一些动画术语，如\
  \ `squash`（挤压）、`stretch`（拉伸）和 `anticipation`（预期）。\n\n## 动画定义\n\n动画是生命的幻觉。它欺骗观众或玩家相信某物是活的，尽管它只是快速移动的画面。动画已经存在了一个一个多世纪了。随着时间的推移，它变得越来越精美漂亮。许多成功的电影和电视节目都是使用动画制作的。一些现代真人电影利用动画来增强它们讲述故事的能力。\n\
  \n最重要的是，游戏行业的发展得益于技术的进步。如果没有动画，我们今天所知的游戏将是不可能的。今天，通过 3D 动画软件的使用，游戏可以创造出宏大的故事并捕捉人们的想象。动画在推动游戏开发领域发挥了巨大作用。现在游戏设计是动画最好的领域之一。这两种媒体——游戏和动画——相互关联，并向令人兴奋的方向互相推动。\n\
  \n## 学习动画\n\n动画最重要的事情就是观察。即使你只是为游戏创建动画，在制作之前，你也必须对周围的世界进行大量的学习和理解。\n\n如果不了解生命是如何运作的，你如何模拟生命？如果你不愿意观察现实世界中的生命状态，你又如何为游戏世界注入生命呢？\n\
  \n在街机游戏时代由于处理能力有限，每个精灵都有自己的素材，因此动画师必须找到通变方法。即使在今天，他们使用的一些技术（如运动模糊）仍被用于现代游戏，以便在不改变角色实际移动速度的情况下，让拳击和踢看起来更有力。\n\
  \n\n\n理解人类行走的机械运动在动画中非常重要，但对于任何媒介的任何动画师来说，最重要的一点是：运动背后的感觉实际上比运动本身要重要得多。多年年来出现了许多动捕游戏和电影，其中一些表现远好于其他作品。但许多动捕工作室面临的问题是，尽管通过动捕记录的动画往往显得僵硬且不自然，尽管它们是真实从生活中记录的。这是由于一个被称为“恐怖谷”的概念。\n\
  \n`uncanny valley` 是当你观察或看到某些非常接近真人或人类的东西时，但某些地方感觉稍微不对劲时的那种感觉。我把它比作回到家里，发现某样东西——你不确定是什么——只是比之前的位置向左偏了那么一点点。这会让你产生一种不安感。在动画中，这会让你觉得动画很僵硬或像机器人。那种动作感觉就是不对。\n\
  \n人类具有非常敏锐的识别其他人类的能力。我们理解通用的肢体语言，因为我们可以看到人动作中的细微细节。我们总能判断出什么是人类，什么不是人类，这就是为什么极其写实的角色不会像一些更风格化的角色那样引起同样的情感共鸣。恐怖谷只在某个东西看起来像人但不完美时才会发生。东西看起来越不像人，我们对它们就越放松；但当某个东西穿过恐怖谷时，我们就能消除那种不安感。\n\
  \n最好的例子之一就是同名电影中的角色瓦力瓦（Wall-E）。尽管瓦力瓦和伊娃显然是表情有限的机器，但观众能够对角色产生共鸣，因为导演并没有把角色做得尽可能像人，而是动画化了角色的`feeling`，而不是角色在做什么。\n\
  \n### 动画化情感\n\n作为人类，你知道什么时候感觉不对劲。反击这种感觉最好的方法是动画化角色，让角色看起来像它的感受那样样。尽管可以用相似的方式表达多种情感，但所有的情感都应该感觉非常不同。愤怒和悲伤在现实生活中可能看起来相似，但如果你不推向角色的表现力，这些角色永远无法捕获玩家的心。\n\
  \n这里是一些你可能想要动画化的常见情感的总结：\n\n*   **快乐：** 快乐是一种非常轻的情绪。你感觉自己轻得没有重量。你甚至走路时会轻快。快乐的角色通常站得笔直，移动速度快得多。把快乐想象成一个刚吹起来的气球。它比生命大，但仍然感觉非常轻。\n\
  \n*   **悲伤：** 悲伤是快乐的对面。当你难过时，你感觉世界的重量在拉着你。每一步或移动都是费力且沉重的。悲伤是一种沉重而缓慢的情绪。悲伤的角色可能会移动更慢，低着头。\n\
  \n*   **愤怒：** 愤怒也是一种巨大的情绪。当你愤怒时，一切都感觉更紧绷。感觉就像世界正在崩塌，而你只是在推回。愤怒是一种非常巨大但精确的情绪。它是受驱动的。\n\
  \n*   **恐惧：** 恐惧可能是情绪中最奇异的。当你害怕时，一切感觉都比你大。你觉得自己很小。你可能一刻移动得很慢，另一一刻又逃跑。恐惧是一种恐慌的情绪，变化非常快。\n\
  \n当你动画化角色时，不仅要考虑角色在做什么，还要考虑角色感觉自己正在做什么。人类的眼睛经过训练可以识别自然的运动。无论你如何努力，你永远无法动画化出看起来 100%\
  \ 像人类的东西。这就是为什么关注运动的`feels`非常重要。\n\n### 使用挤压与拉伸技术\n\n想象用你的手拍在硬表面上。当接触时，感觉就像你的手在同时扩张并瞬间弹回形状。在现实中，手上的皮肤可能会稍微扩张并弹回原位，但这几乎不可见——远没有达到发生时的那种感觉程度。当你动画化一个场景时，你希望那种感觉传达得更多，所以你夸张动作来匹配感觉而不是实际动作。在动画术语中，这种技术被称为`squash\
  \ and stretch`（挤压与拉伸）。\n\n这种技术由 Ub Iwerks 和华特·迪士尼（Walt Disney）开创，挤压与拉伸赋予了角色重量感和感觉。在挤压与拉伸出现之前，动画师从未真正关注过一致性。角色会根据需要伸展肢体，因为他们可以这样做，但这给人留下了角色形状和体积不一致的印象。它从未给出角色真实存在于现实环境中的正确感觉。挤压与拉伸的目标是在物体以极端方式扩张或扭曲时，也保持物体的体积和形状一致。\n\
  \n`squash`（挤压）是当角色撞击某物时。身体变得更宽更短，以强调冲击。想象球落在地上或你的手拍在硬表面上。为了帮助强化冲击，动画师会压缩角色，就像它是一个气球且有东西在向下压它。由于角色正在向外扩张，你也必须让角色变短以保持角色的体积一致。\n\
  \n`stretch`（拉伸）是挤压的对面。想象一个球或汽车快速移动，或者有人在挥动球棒。拉伸拉长物体，使其变薄，并赋予物体运动的感觉。把拉伸想象成一种延迟。物体的部分在移动，但另一部分仍在试图追赶，所以发生了拉伸。在现实生活中，物体是实心的，所以不会扭曲——但感觉它们`should\
  \ distort`。当某物移动很快时，感觉它`should stretching`，\n\n练习挤压与拉伸最好的方法之一是画球动画。橡胶球在撞地面时已经会扭曲，但在动画中你需要夸张这种运动。遵循以下步骤：\n\
  \n1.  在便利贴纸上，在最后一张顶部画一个圆。\n2.  一张一张地画出球缓慢下降的过程。\n3.  在中间拉伸球，使其看起来更像一个向向地的椭圆。\n4.\
  \  当球接触地面时，保持球的底部接触便利贴的底部。\n5.  缓慢将球扩张成水平椭圆形状。\n6.  当球是水平椭圆时，开始将其弹回圆形，在它变成圆形之前开始让球向上移动。\n\
  7.  在球向上移动时拉伸它。\n8.  缓慢让球弹回圆形然后停止。\n\n整个动画应该只有大约十帧，但结果将是一个球落地并弹跳起来的简单动画，为你提供了运动中挤压与拉伸的完美示例。\n\
  \n### 建立预判\n\n在动画中，每个动作都需要夸张。这同样适用于动作前的铺戏。`Anticipation`（预判）是动作的前置动作。当你跳起时，你必须先下蹲。当你击某人时，你会向后收拳头。在动画中，这些预判瞬间有助于赋予角色真实感。\n\
  \n\n\n\n没有任何动作是瞬间完成的——总会有半秒的延迟。当你制作这些时刻时，角色的预期动作（anticipation）也会被夸张。想一下格斗游戏。当一个角色出拳时，在拳挥出之前会有一个轻微的停顿。如果这一拳应该更有威力，这种停顿会更加夸张。当你制作角色动画时，应该记住这种预期动作。角色不会直接跳起或攻击，必须有一个预期的瞬间，才能让人们真正相信这些角色是真实存在的。\n\
  \n尽管如此，你不希望延迟太长。否则，这些动作会破坏游戏的流畅性。因此，在制作角色动画时，你必须兼顾游戏性和动画效果。\n\n## 制作你的玩家角色\n\n你应该为游戏制作的第一个动画是玩家角色，因为它需要的动画最多。与其他物体或角色不同，玩家角色的移动与玩家在任何时刻的操作直接相关。敌人角色或危险物有特定的动画循环，它们从不改变——只是不断重复。\n\
  \n玩家角色需要根据玩家的需求执行不同的动作：\n\n*   **待机动画（idle animation）：** 如今大多数游戏都不会让角色在玩家未移动时静静地站在屏幕上。你正在为玩家创造活生生的角色。如果角色静止不动，会破坏这种沉浸感。\n\
  \    在原版《索尼快快酷》中，SEGA 使用待机动画来强化主角作为一个“太酷的”速度速者的个性。如果玩家不移动索尼克，他会开始不耐烦地跺脚，等待玩家移动。如果玩家等得足够，索尼克甚至会由于不耐烦跳出关卡边缘离开！\n\
  *   **行走动画（walking animation）：** 游戏中最标准的动画，移动动画自《吃豆人》时代起一直存在。如果角色只是在屏幕上漂浮，会破坏玩家的沉浸感。在角色移动时添加行走循环有助于赋予角色生命力。\n\
  *   **跳跃动画（jump animation）：** 这种动画增加了角色移动的丰富性，并有助于强化角色是活着的理念。当你跳跃时，并不仅仅是垂直移动。跳跃动作为跳跃增加了动画细节，帮助营造出像真实角色操作的幻觉。\n\
  \n你在本书中创建的游戏的主角是一个方块（参见图 10-1），因此角色的实际移动非常有限——但仍然可以赋予方块生命和感觉。（可以参考皮克斯的 Luxo Jr.\
  \ 灯为例，学习如何从无生命物体中获得情感。）对于你的游戏，你将专注于如何获取角色的基础移动，并记住你将使用的技术和工具也可以用于创建更广泛的动作范围。\n\n\
  ![image](img/9781119404187-fg1001.png)\n\n图 10-1： Boxo！\n\n### 使用形状键（SHAPE KEYS）\n\
  \nBlender 通过两种不同的模式将编辑与物体操作分开。问题在于，你无法在 Blender 内部通过顶点、边或面来制作角色形状变化的动画。Blender 的动画工具仅限于物体模式（Object\
  \ Mode）以及通过骨骼绑定的姿态模式（Pose Mode）。尽管你可以对物体的许多部分（包括纹理和修改器，你将在本章稍后学习）进行动画，但在没有特定的 Blender\
  \ 插件的情况下，你无法对编辑模式（Edit Mode）中的更改制作动画。即使如此，动画也是有限且难以处理的。\n\n所以，对于像方块这样简单的角色，你该如何制作动画让它看起来是活的的？幸运的是，Blender\
  \ 以形状键的形式提供了答案。\n\n形状键是同一个物体形状的不同变体。它们允许你标记编辑中的更改，并按 0 影响到 1 影响影响范围调整这些更改的影响。你可以在同一个物体上拥有多个形状键，但当两个形状键同时使用时，物体会变形到两个不同形状的中点。形状键是创建脸部动画等有用工具，因为你可以使用多个形状键来影响脸的不同部分，例如眼睛和嘴。你还可以组合形状键来创建更复杂的情绪。\n\
  \n对于玩家角色，你将使用形状键来帮助他们在场景中移动。由于角色设计本质上非常简单，角色的移动和表达方式被简化了。但你仍然可以依靠风格的卡通特性来赋予角色生命。\n\
  \n首先，你需要创建一个形状键：\n\n1.  **选择你想要的物体。**\n2.  **转到窗口属性面板中的物体数据标签（Object Data）。**\n\
  3.  **向下滚动到形状键（Shape Keys）。**\n4.  **在右侧点击两次加号 (+) 按钮。**\n    这将创建一个基础形状键（Basis），所有其他形状键都将其作为参考。再次点击它将创建你的第一个形状键（参见图\
  \ 10-2）。\n5.  **选择 Key 1 并切换到编辑模式（Edit Mode）。**\n\n![image](img/9781119404187-fg1002.png)\n\
  \n图 10-2： 创建形状键\n\n### 分解你的玩家角色动画\n\n在大多数动画中，包括你在本章稍后为游戏制作的动画，你只做一个主动画，动画的每个部分随着时间自然地过渡到其他部分。对于你的玩家角色情况并非如此，因为你需要在时间轴（Timeline）中有多个动画，以便你的游戏在第\
  \ 12 章导入角色时能够引用它们。\n\n### 创建关键帧\n\n\n\n关键帧（Keyframes）是动画中指示特定特定点。在旧的动画中，它们是角色动作的主要点，而中间帧（in-between\
  \ frames）则是从一个关键帧到下一个关键帧之间的帧。在 3D 动画中，关键帧的作用非常相似，只是计算机会自动计算中间帧。\n\n在 `Blender` 中创建关键帧有三种方法：\n\
  \n*   在 `Timeline`（时间线）底部有一个红色按钮。这是用于自动关键帧的。当开启自动关键帧（autokeying）时，当你沿着 `Timeline`\
  \ 移动并调整角色时，它会自动记录下这些动作。它还会记录 `Scene`（场景）窗口内的任何其他变化，但仅限于场景内的更改，而不包括场景外的更改，因此形状和材质的变化不会被自动关键帧记录。\n\
  *   屏幕左侧的 `Animation`（动画）选项卡有 `Insert`（插入）和 `Delete Keyframe`（删除关键帧）按钮。当你想要插入关键帧时，点击\
  \ `Insert Keyframe`，会弹出一个菜单，显示你可以添加的所有类型的关键帧，从变换工具到修改器（modifiers）。\n*   插入关键帧的最后一种方法是悬停在你想要关键帧影响的对象上，并按下键盘上的\
  \ `I` 键。这会创建一个影响对象选中部分的关键帧，并让你通过动画菜单插入关键帧的控制权，同时保留了自动关键帧的便利性。这也可以影响修改器和材质。\n\n###\
  \ 开始你的动画\n\n现在你已经设置了形状键（shape keys）并理解了关键帧的工作原理，是时候开始为角色制作动画了。由于这是你的玩家角色，你应该确定每个姿态或动作在动画中有多少的时间。\n\
  \n对于待机动画（idle animation），你需要大约 3 到 5 秒；对于行走循环（walk cycle），只需要大约 2 到 3 秒；而跳跃动画应该只有\
  \ 1 到 2 秒。如果你对所有动画都使用最大时间，总帧数应该在 300 帧左右。务必在每个动画之间留出一些时间，以防止从一个动画溢出到另一个动画中。\n\n\
  让我们从待机动画开始。在这个动画中，角色将进行的实际动作将在玩家闲置 3 秒后开始。3 秒后，角色会向左侧和右侧看顾，然后再等待 3 秒再次执行。在每秒 30\
  \ 帧的动画中，3 秒意味着动画将在第 90 帧开始。\n\n1.  **在第 0 帧，为所有变换工具以及所有形状键插入关键帧。** 当你这样做时，它们应该都显示为黄色（参见图\
  \ 10-5）。\n2.  **进入第 90 帧并以相同的方式插入帧。**\n3.  **跳过 20 帧，将右转或左转更改为 1。**\n4.  **插入关键帧。**\n\
  5.  **向前移动两帧。**\n6.  **插入关键帧。**\n7.  **在第 120 帧，将形状键更改为 0。**\n8.  **插入关键帧。**\n9.\
  \  **重复步骤 2 到 6。**\n10. **在第 150 帧，将所有形状键改回 0。**\n11. **插入关键帧。**\n\n![image](img/9781119404187-fg1005.png)\n\
  \nFIGURE 10-5: 插入第一个关键帧。\n\n### 为角眼睛制作动画\n\n你不希望角色的眼睛在游戏中从头部里掉出来（参见图 10-6）。正因如此，玩家角色的眼睛也必须移动以匹配身体。问题是，单独制作眼睛（参见图\
  \ 10-7）可能是枯燥的。此外，它可能无法保证眼睛旋转方式正确。\n\n![image](img/9781119404187-fg1006.png)\n\n\
  FIGURE 10-6: 你的角色在旋转眼睛之前。\n\n![image](img/9781119404187-fg1007.png)\n\nFIGURE 10-7:\
  \ 旋转眼睛的首次尝试。\n\n解决这个问题的最好方法是添加一种同时控制双眼的方法，同时匹配立方体的旋转。添加一个 `empty`（如图 10-8 所示），这可以确保眼睛以正确的方式旋转。\n\
  \n1.  创建一个 `empty` 对象。\n2.  将 `empty` 重命名为“eye”。\n3.  将 `empty` 的位置设置为 `0,0,0`。\n\
  4.  将眼睛父级到 `empty`。\n\n![image](img/9781119404187-fg1008.png)\n\nFIGURE 10-8: 使用空物体。\n\
  \n\n\n\n\n由于你已经编写了角色在游戏中行走以及向前向后移动的代码，所以你不需要对这种移动进行动画处理。角色已经可以向前、向左、向右和向后移动。如果你在游戏中对这种移动制作动画，角色可能会向错误的方向移动或速度极快。每当你创建一个由你控制移动的角色时，都应该让角色保持静止，同时看起来又像是在移动。\n\
  \n### 跳跃\n\n跳跃是你为这个角色需要做的最后一个动画，但它也是难的一个，而且你可能需要在后期进行调整，以更好地适应游戏中的跳跃效果。当角色跳跃时，你必须同时展示跳跃的蓄力和跳跃本身，同时由于角色与游戏的交互方式，不能让角色移动太大。让角色跳得更高的动画会导致游戏中的角色跳得比你预期的还要高。为了解决这个问题，你还需要创建一个新的形状键（请参见图\
  \ 10-13）。\n\n![image](img/9781119404187-fg1013.png)\n\nFIGURE 10-13: 跳跃形状键。\n\n\
  到目前为止，你主要在处理压缩（squash）动画。现在是时候处理拉伸（stretch）动画了。为了表现出快速移动的感觉，角色的身体应该拉长，就像身体的一部分被留在后面一样。在实践中，这有助于增强角色跳得高且快的感觉，因为当形状键恢复正常时，盒子将达到它的最大高度，看起来就像是快速跳起达到该高度的。这为角色和世界赋予了质量感和生命，让玩家进一步沉浸于你创造的世界中。\n\
  \n按照以下步骤为角色制作跳跃动画：\n\n1. **从第 230 帧开始，放置你的第一个关键帧。**\n2. **为了不让蓄力等待太久，确保蹲下动作（使用行走形状键进行蹲下）仅花费约\
  \ 5 帧到达，并额外保持 2 帧。**\n3. **在第 240 帧，切换掉行走形状键的压缩效果，改用跳跃形状键。**\n4. **让 Boxo 在第 245\
  \ 帧恢复到正常形状。**\n\n你最后需要调整的是眼睛。到目前为止，眼睛只是被移动或旋转，但现在是时候对玩家的眼睛也应用压缩拉伸动画了。眼睛的拉伸方式应与盒子类似（请参见图\
  \ 10-14）。这样，人们就知道身体和眼睛是完整的。使用眼睛控制器，改变眼睛的形状和位置以匹配动画中的姿态（请参见图 10-15）。\n\n![image](img/9781119404187-fg1014.png)\n\
  FIGURE 10-14: Boxo 在跳跃。\n\n![image](img/9781119404187-fg1015.png)\nFIGURE 10-15:\
  \ 带眼睛的跳跃。\n\n当 Boxo 回到正常形状时，眼睛也应该恢复到正常的形状和大小。将眼睛匹配关键帧，然后保存完成后的角色，这样你就可以将其导入第 12\
  \ 章。\n\n### 制作敌人小怪\n\n这些是你平台跳跃游戏中的布仔（Goombas）和库巴军团（Koopa Troop）。敌人角色可以说是是游戏中次重要的角色，在制作动画时，考虑敌人角色与考虑玩家角色同样重要。在这个游戏中，敌人都是机器人（如图\
  \ 10-16 所示所示），所以当你考虑它们的移动时，必须记住这一点。\n\n![image](img/9781119404187-fg1016.png)\n\
  FIGURE 10-16: 敌人角色。\n\n玩家角色在这个游戏中更具有机感，因此它的动作更流畅、更具弹力，以赋予额外的生命感。在玩家和敌人之间建立区别可以超出颜色或形状的审美差异。你甚至可以利用动画来强调玩家和敌人之间的区别。玩家角色是流动的，所以敌人应该是僵硬的；玩家移动得更随机，所以敌人应该有规律的动作；以此此类推。\n\
  \n你需要敌人角色在舞台上呈圆圈往回走。在目前敌人占位符所在的位置，你放置敌人角色，让它在该处往回移动。敌色的目标是提供一个玩家必须克服或回避的挑战。在 2D\
  \ 平台跳跃游戏中，角色会以某种模式靠近或远离玩家。因为玩家只有两个移动方向，这构成了一个玩家必须解决的挑战。在 3D 平台跳跃游戏中，角色只向前向后移动对玩家构成的威胁不大，因为玩家可以轻松移动到侧面避开敌人。为了给玩家提供足够的挑战，你必须使用敌人的动画来阻塞玩家必须通过的路径。在这种情况下，角色将沿着\
  \ `x` 轴移动。\n\n按照以下步骤创建一个移动的敌人怪：\n\n1. **将 `X` 位置设为 15。**\n2. **在第 0 帧设置位置、旋转和缩放。**\
  \ 参考图 10-17 中的起始位置示例。\n3. **决定你想让敌人跨越舞台的速度。** 例如，如果你想让跨越舞台需要 3 秒，那么就是 90 帧。\n4.\
  \ **在你确定的帧上，将 `X` 设为 15。**\n5. **插入关键帧。**\n6. **向上移动 10 帧。**\n7. **将 `Z` 轴旋转设为 90\
  \ 度。**\n8. **仅插入旋转的关键帧。**\n9. **向前 5 帧处插入另一个位置关键帧。** 参考图 10-18 示例。\n10. **假设第 4\
  \ 步的帧是 90，跳转到第 115 帧。（否则在你第 4 步使用的帧基础上增加 25）。**\n11. **将 `Y` 位置设为 5。** 参考图 10-19\
  \ 示例。\n12. **插入关键帧。**\n\n![image](img/9781119404187-fg1017.png)\nFIGURE 10-17: 起始位置的敌人。\n\
  \n![image](img/9781119404187-fg1018.png)\nFIGURE 10-18: 在位置 2 旋转的敌人。\n\n![image](img/9781119404187-fg1019.png)\n\
  FIGURE 10-19: 在位置 3 的敌人。\n\n\n\n\n接下来的步骤通过重复相同的过程，让角色在 10 帧内旋转 90 度，并在与角色原始移动相同的帧数内移回\
  \ –15 位置（在示例中，为之前旋转前的 90 帧）。当角色回到 X 轴的 –15 帧位置时，让它再次旋转并移动到 Y 位置 0。\n\n如果你使用 90 帧作为角色穿过舞台的时间，那么此动画的总帧数应该是\
  \ 240 帧。这将创造出一个在游戏平台上来往回移动的敌人角色，玩家必须避开它，就像图 10-20 所示的那样。\n\n![image](img/9781119404187-fg1020.png)\n\
  \n图 10-20： 最终的敌人小兵动画。\n\n## 制作环境障碍\n\n你创建的环境障碍是一个压碎机，就像图 10-21 所示的那样，这意味着你需要制作它在一段时间后向下掉落在平台上，在那里停留片刻，然后再次升起让通过。\n\
  \n![image](img/9781119404187-fg1021.png)\n\n图 10-21： 压碎机。\n\n将压碎机作为玩家必须克服的障碍，其好处之一是模型已经占据了整个舞台的宽度，因此它强迫玩家穿过它才能到达终点。遗憾的是，这意味着为了给玩家通过压碎机的机会，你必须为玩家提供足够的时间跳过去。对于这一个，3\
  \ 秒足够足够玩家通过压碎机而不被击中。\n\n遵循以下步骤创建一个既能为玩家提供挑战又不会具有惩罚性的障碍：\n\n1. **在动画的开始设置一个关键帧。**\n\
  2. **移动 90 帧并插入另一个关键帧（位置）。**\n   你接下来需要决定的是压碎机在撞击底部并停止之前下降得有多快。对于这一点，10 帧对于下降动画来说绰绰有余。\n\
  3. **移动到第 100 帧并调整 Z 位置，直到压碎机的顶部接触压碎机的底部。**\n4. **在第 100 帧插入位置关键帧，然后在第 120 帧处添加另一个关键帧。**\n\
  \   这将确保压碎机在位置上停留一段时间，并防止玩家通过。\n5. **移动到第 140 帧并将压碎机移回在 `z` 轴上的起始位置。**\n   为了让压碎机撞击底部平台时更有冲击力，尝试添加一些挤压拉伸（squash\
  \ and stretch），甚至让它在撞击平台表面时稍微弹一下。通过添加一些挤压拉伸，会让压碎机的下降看起来更快，冲击感感觉像撞得更重。通过在压碎机弹起并落回原处之后增加几帧，你赋予了压碎机更多的重力。即使是砖块落下时也会弹跳——它弹得*并不多*，甚至会碎，但会有轻微的冲击余震，将其动画化你的游戏中将有助于体现重量感。\n\
  6. **检查第 90 帧和第 100 帧，确保它们的缩放设置了键。**\n7. **移动到第 95 帧。**\n8. **将 Y 缩放改为 2.7，Z 缩放改为\
  \ 0.8。**\n9. **插入一个关键帧。**\n10. **移动到第 102 帧并确保缩放正确。**\n    X 缩放应该是 30，Y 缩放应该是 3，Z\
  \ 缩放应该是 0.5。\n11. **插入缩放关键帧。**\n12. **在第 100 帧，将 X 缩放改为 30.68，Y 缩放改为 3.44，Z 缩放改为\
  \ 0.42。**\n    这将创建一个挤压拉伸效果，使压碎机在撞击时下降更有冲击力。它除了改变网格形状外没有改变任何东西，但这个微小的变化对赋予力量的感觉很大。\n\
  \    接下来，你将制作压碎机的冲击余震动画。\n13. **在第 100 帧，在 `z` 轴上向下移动压碎机，使压碎机的底部接触平台。**\n14. **插入位置关键帧。**\n\
  15. **移动到第 102 帧并在 `z` 轴上略向上移动压碎机。**\n16. **插入位置关键帧。**\n17. **移动到第 104 帧。**\n18.\
  \ **向下移动压碎机的位置并缩放，使 Z 缩放更小，X 和 Y 缩放更大（参考第 12 帧之前的逻辑调整）。**（注：原文此处逻辑略显跳乱，此处按字翻译）\n\
  \    这代表了压碎机的落地。\n19. **插入一个关键帧。**\n20. **移动到第 105 帧。**\n21. **在 `z` 轴上将压碎机向上移动一点。**\n\
  22. **插入关键帧。**\n23. **移动到第 106 帧。**\n24. **插入一个关键帧。**\n    完成后，你将拥有像图 10-22 所示的完成压碎机动画。\n\
  \n![image](img/9781119404187-fg1021.png)\n\n图 10-22： 完成的压碎机。\n\n## 制作移动平台\n\n移动平台可能是最容易制作的东西。与旋转的敌人或具有延迟的压碎机不同，移动平台只是在一个方向上来回移动。\n\
  \n移动平台应该作为角色跨越缝隙的桥梁。遵循图 10-23 中的示例，你将在 `y` 轴上制作移动平台：\n\n1. **回到第 0 帧。**\n2. **将\
  \ Y 位置设置为 10。**\n   移动的总范围是 20 单位。\n3. **插入关键帧。**\n4. **前往第 120 帧。**\n5. **插入关键帧。**\n\
  6. **移动到第 60 帧。**\n7. **将 Y 位置设置为 –10。**\n8. **插入关键帧。**\n9. **将结束帧数改为 120。**\n \
  \  在你制作完动画后，你会发现平台从未停止。这可能是一个问题，因为你希望平台停止时至少停留一两秒让玩家跳上去。5 帧的等待时间应该足够。\n10. **移动到第\
  \ 5 帧。**\n11. **将 Y 位置改为 10。**\n12. **插入关键帧。**\n13. **移动到第 65 帧。**\n14. **将 Y 位置改为\
  \ –10。**\n15. **插入关键帧。**\n\n![image](img/9781119404187-fg1023.png)\n\n图 10-23： 移动平台。\n\
  \n你不需要在第 120 帧之后添加暂停，因为动画会自动循环并暂停。\n\n## 制作硬币\n\n你的游戏中最后需要制作动画化的是硬币，如图 10-24 所示，供玩家捡。你将制作硬币在游戏关卡上缓慢旋转并跳动。这将为它们在游戏中带来良好的视觉效果，并让它们对玩家更加显眼。\n\
  \n![image](img/9781119404187-fg1024.png)\n\n图 10-24： 硬币。\n\n\n\n你应该让目标移动，即使只是轻微移动，以帮助它们从背景中脱颖而出。对于你希望被玩家捡取的物体，你应该始终给玩家一些小的提示，这些物体\
  \ `can` 被捡取。当玩家靠近物品时给它高亮显示、改变它的颜色，或者给它一个微小的原地动画，都有助于增强这些物品是可以被捡取的这种感觉。由于这些是分布在整个游戏中的捡取物品，让它们略微悬浮在地面是一个让玩家关注的好方法，同时又让它们看起来具有威胁性，或与敌人混淆。\n\
  \n首先，让我们让物体旋转起来。总动画时间不应该长，但也不应该太快，因为你希望这些物体看起来平易近人。移动快的物体没有移动缓慢的物体那样容易接近。五秒对于动画是一个合适的时间，所以将帧数设置为\
  \ 150 帧。由于旋转工具的存在，让物体旋转很容易。同样，基于不想让物体快速旋转的想法，每五秒旋转一圈在这些硬币上看起来效果很好，如图图 10-25 所示。\n\
  \n![image](img/9781119404187-fg1025.png)\n\nFIGURE 10-25: 完成旋转的硬币。\n\n按照以下步骤操作：\n\
  \n1. 转到第 0 帧。\n2. 插入关键帧。\n3. 转到第 150 帧。\n4. 将 Z 轴旋转改为 360。\n5. 插入关键帧。\n\n这将导致硬币在原地旋转。对硬币的大多数更改纯粹是为了视觉原因。你希望硬币脱颖而出，这样玩家就知道去捡它。另一个让它脱颖出的方法是让它沿着\
  \ `z` 轴上下浮动。这样，玩家就能看到硬币在原地跳动，而不是像敌人小兵那样移动，或者像压路器那样撞下来。缓慢、简单的动画是最好的，比如图 10-26 所示所示。\n\
  \n1. 在第 0 帧，将 Z 轴位置改为 2。\n2. 插入关键帧。\n3. 转到第 40 帧。\n4. 将 Z 轴位置改为 1。\n5. 插入关键帧。\n\
  6. 转到第 80 帧。\n7. 将 Z 轴位置改为 2.5。\n8. 插入关键帧。\n9. 转到第 115 帧。\n10. 将 Z 轴位置改为 1。\n11.\
  \ 插入关键帧。\n12. 转到第 150 帧。\n13. 将 Z 轴位置改为 2。\n14. 插入关键帧。\n\n![image](img/9781119404187-fg1026.png)\n\
  \nFIGURE 10-26: 完成的硬币动画。\n\n![image](img/c11.png)\n\n本章关于通过调整小细节（如地面颜色和背景）以及照明来设置关卡。在本章中，我将解释如何更改地面材质使其从背景中脱颖而出，如何更改环境光照，以及如何在游戏中设置照明。\n\
  \n你还将学习光照如何改变游戏，以及如何正确为游戏布光，以便在 3D 中清晰地区分形状。我将解释三点布光设置的工作原理，以及你在 Unity 中创建的不同灯光之间的区别。\n\
  \n## 修改地面颜色\n\n当你设计关卡时，考虑如何将你的关卡与背景隔离开。这似乎是一个显而易见的建议，但许多游戏开发者会掉进陷阱，没有区分关卡的哪些部分是可以交互的，哪些部分只是背景的一部分。在你的平台跳游戏中，这并不是大问题，因为背景和关卡并没有真正混合，但你应该养成区分背景与玩家可以交互的关卡部分的习惯。清楚地指示环境哪些部分可以跳上去或抓取，有助于防止玩家产生挫败感，这是你在开发游戏时必须权衡的主要平衡。\n\
  \n到目前为止，游戏中的色彩很少（参见图 11-1）。关卡在灰蓝色的背景上只是白色，唯一的少点色彩来自角色和捡取物品。关卡在视觉上很单调。当你导入制作的字符时，这个问题将得到部分解决。\n\
  \n![image](img/9781119404187-fg1101.png)\n\nFIGURE 11-1: 有颜色的关卡。\n\n按照以下步骤操作：\n\n\
  1. 创建新材质并命名为 `Ground`。\n2. 将漫反射颜色（Diffuse Color）改为深绿色。\n3. 将金属色（Metallic Color）改为\
  \ 0。\n4. 将光滑度（Smoothness）改为 0。\n5. 确保自发射（Emission）关闭。\n6. 将材质应用到地面。\n\n![image](img/9781119404187-fg1102.png)\n\
  \nFIGURE 11-2: 分配了颜色的关卡。\n\n![image](img/9781119404187-fg1103.png)\n\nFIGURE 11-3:\
  \ 将颜色应用到楼梯。\n\n![image](img/9781119404187-fg1104.png)\n\nFIGURE 11-4: 地面颜色检查器。\n\
  \n## 编辑环境光照\n\n现在关卡的地面已经设置好，并且是一种与游戏已有的卡通主题相匹配的漂亮颜色，是时候学习更多关于游戏环境光照了。环境光照控制受环境影响的自然光照。将其想象为场景的一种色调，它既能突出场景的不同部分，又能匹配环境的着色。\n\
  \n\n\n要访问光照设置，请选择 `Window` ⇒ `Lighting` ⇒ `Settings`（参见图 11-5）。会出现一个窗口，显示 Unity\
  \ 中提供的各种光照选项，但对于本项目，你只需要关注窗口的 Environment（环境）部分（参见图 11-6）。\n\n![image](img/9781119404187-fg1105.png)\n\
  \n图 11-5： 访问光照设置。\n\n![image](img/9781119404187-fg1106.png)\n\n图 11-6： 光照设置。\n\n\
  你可以在 Unity 的 Inspector（检器）窗口中控制光源，但光照设置窗口可以帮助控制场景光照的各种设置。环境设置可以帮助为场景光照上色，使场景更加生动，并赋予环境一种不同的感觉。\n\
  \n场景的红色调可以给游戏带来温暖的感觉，让物体看起来很热，或者仿佛游戏内正在日落。蓝色调给人一种更凉爽的感觉，让物体看起来更冷。颜色可以帮助指示游戏发生的时间或季节，帮助你更好地为玩家创造世界。自然地，这些设置是基于场景拥有的天空盒（skybox）——即游戏的背景的。\n\
  \n为了创建一个天空盒，你需要创建六张独立的图像来覆盖场景的底部、顶部、左侧、右侧、正面和背面。调整场景的光照和颜色同样有助于为玩家营造一种沉浸其中的良好氛围。请按照以下步骤操作：\n\
  \n1. **在 Source（源）下拉列表中，选择 `Gradient`（渐变）。**\n\n   以下是各种选项的描述，供你参考：\n\n   * **Skybox（天空盒）：**\
  \ 基于当前设置的天空盒背景颜色。在这种情况下，颜色是从浅蓝色变为灰色。\n   * **Gradient（渐变）：** 与 Skybox 类似，但你可以选择光线渐入的颜色。你可以选择三种颜色进行渐变淡入。\n\
  \   * **Sky Color（天空颜色）：** 顶部颜色，这种颜色从上方影响场景，仿佛光线直接照射在物体上。\n   * **Equator Color（赤道颜色）：**\
  \ 中间颜色，这种颜色对物体的影响就像光从物体的正面和侧面射来。\n   * **Ground Color（地面颜色）：** 从底部影响物体的颜色。\n   *\
  \ **Color（颜色）：** 用特定的颜色一次性为场景上色。这对于快速设置光照非常有用。\n\n2. **将天空颜色更改为浅蓝色。**\n\n3. **将赤道颜色更改为紫色。**\n\
  \n4. **将地面颜色更改为绿色。**\n\n![image](img/9781119404187-fg1107.png)\n\n图 11-7： 渐变源。\n\
  \n图 11-7 中的渐变将改变场景的颜色设置，以更好地反映场景内更独特的形状。浅蓝色将为形状顶部提供一种良好的独特亮色，指示它是顶部。紫色将与浅蓝色形成良好对比，使物体的侧面与顶部有明显的区别。最后，绿色对场景的影响不会太大，但它将模拟光线从地面的反射，使得物体的底部略微呈现绿色色调。\n\
  \n## 理解光照\n\n光照是游戏设计中最重要的部分之一，但经常被忽视。光照可以改变游戏，即使是细微的改变。一个看起来像发生在正午、色彩鲜艳的游戏，只需调整光照角度就能发生巨大的变化。现在，场景看起来像图\
  \ 11-8。你将调整光线的方向，帮助场景具有更多活力。\n\n![image](img/9781119404187-fg1108.png)\n\n图 11-8：\
  \ 上了色的场景。\n\n从 `Hierarchy`（层级）窗口中选择 `Directional Light`（定向光）。定向光充当一个来自模糊远距离的光源。这意味着无论它在场景的什么位置，光照都保持不变。你将调整光线的方向，帮助场景具有更多活力。\n\
  \n\n\n\n1. **将你的方向光复制两次（总共三个）。**\n\n2. **让每盏光以不同的方向指向玩家角色——两盏从相机向下指向玩家，另外一盏从玩家后方向上指向。**\n\
  \n3. **选择一盏光（靠近相机的灯）作为你的主光（key light）。**\n\n   在 `Inspector` 中，当你选择主光时，你会看到一个 `Light`\
  \ 组件。将颜色更改为 `White`。将强度（intensity）更改为 `0.8`（1 偏亮会导致场景稍微过曝，光线过多）。将实时阴影的强度（strength）更改为\
  \ `0.15`，以防止目前生硬的阴影。\n\n4. **选择相机附近的另一盏光，将其作为补光光（fill light）。**\n\n   在 `Inspector`\
  \ 中，将颜色也更改为稍深一点的白色。将强度更改为 `0.4`。确保实时阴影的强度（strength）为 `0`。\n\n5. **选择位于玩家后方的最后一盏光——那就是你的背光（back\
  \ light）。**\n\n   将颜色更改为浅灰色。将强度更改为 `0.2`。确保实时阴影的强度（strength）为 `0`。\n\n完成后，你的场景看起来应该类似于图\
  \ 11-11。\n\n![image](img/9781119404187-fg1111.png)\n\nFIGURE 11-11: 光照适当的场景。\n\n\
  ## 创建雾效果\n\n让场景更生动的另一种方法是向场景添加雾气。正如名称所示，雾气会干扰场景的可见性，让摄像摄像物体变得模糊和暗淡。多年来，雾气一直用于游戏中以帮助处理性能，并在游戏中营造神秘感或距离感。当你向地平线看时，形状越远就越模糊。\n\
  \n在游戏中，你可以使用雾效果来模拟这种效果。首先，你必须回到之前用于更改环境光的光照设置窗口。\n\n1. **要创建雾效果，在光照设置向下滚动到 `Other\
  \ Settings` 标签页。**\n\n2. **勾选下拉列表中 `Fog` 旁的复选框。**\n\n   这将为游戏创建雾。相机越近，场景中的雾就越少。\n\
  \n3. **将雾的颜色更改为灰绿色，以匹配已设置的游戏色彩。**\n\n4. **确保 `Mode`（模式）为 `exponential squared`。**\n\
  \n5. **保持 `Density`（密度）为 `0.01`。**\n\n将在游戏窗口中创建一个良好的雾效果，这样当你玩游戏时，雾气会出现在游戏地平线上，遮挡玩家清晰看到某一点之外的能力。这将在游戏世界中营造距离感，并为游戏设置注入更多活力。正如你在图\
  \ 11-12 中所示，雾有助于塑造关卡的 3D 特性，并为玩家创造良好的视觉效果。\n\n![image](img/9781119404187-fg1112.png)\n\
  \nFIGURE 11-12: 带雾的场景。\n\n现在，在第 12 章添加角色和物体之前，花点时间比较一下章节末尾图像与章节开头图像。你已经可以看到光照和颜色比之前为场景带来了更多活力。游戏已进入最后的准备阶段！\n\
  \n![image](img/c12.png)\n\n在本章中，你将把角色和物体导入到 `Unity` 中完成游戏设置。本章是书中之前所有章节的结晶。你将把在\
  \ `Blender` 和 `Unity` 中工作的内容合并成一个最终版本的游戏，几乎不需要再写代码。\n\n在这里，你将学习如何将角色和动画导入到 `Unity`\
  \ 并设置动画，以便它们在开始游戏时播放。你还将学习如何为主玩家角色设置动画控制，以便动画仅在游戏中使用相应的控制时才播放。本章的目标是获得一个完成版本的游戏，它在下一章中只需要细微的修改和修复。\n\
  \n## 修复你的玩家角色以导入 Unity\n\n你可以毫无问题地导入在第 10 章中制作的大多数动画。但 `Unity`并不喜欢所有类型的动画——特别是形状键（shape\
  \ keys）。`Unity` 的设计是为了导入一种名为 `blend shapes`（混合形状）的形状键变体，通常用于 `Maya` 等程序中。幸运的是，解决这个问题有很多变通方法，但没有一个是有效的。\n\
  \n\n\n\n现在是时候将你的角色导入到 Blender 了。请按照以下步骤操作：\n\n1. **打开 Unity 并进入 Project（项目）窗口中的\
  \ Prefabs 文件夹。**\n2. **在 Mac 上打开 Finder 窗口，或在 PC 上打开 Windows 资源管理器。**\n3. **将 FBX\
  \ 文件从 Blender 文件夹直接拖入 Prefabs 文件夹。**\n   这将创建一个角色的预制体（prefab）。在角色预制体的下拉菜单中包含了角色的所有不同组件。\n\
  4. **将预制体拖到屏幕上以创建新角色。**\n   你在图 12-5 中首先会注意到的是角色与场景其他部分相比有多大。这是因为 Unity 的单位是 Blender\
  \ 单位的一半。\n5. **要修复此导入错误，请选择你刚刚创建的玩家角色预制体。**\n   在 Inspector（检查器）窗口中，你会发现窗口已变为 Import\
  \ Setting（导入设置）。当你导入动画或外部 3D 对象时，选择预制体就会打开导入设置窗口。你将在本章稍后深入介绍 Rig 和 Animation 标签。\n\
  6. **点击 Model（模型）标签页。**\n   你会看到许多可以勾选或更改的设置。\n7. **将 Scale Factor（缩放因子）更改为 0.5。**\n\
  8. **确保勾选所有复框：**\n   * Use File Scale（使用文件缩放）\n   * Read/Write Enables（启用读/写）\n\
  \   * Import BlendShapes（导入混合形状）\n   * Generate Colliders（生成碰撞器）\n   * Weld Vertices（焊接顶点）\n\
  \   * Import Visibility（导入可见性）\n9. **滚动到模型标签页中的 Materials（材质）部分，并勾选 Import Materials（导入材质）。**\n\
  10. **将 Material Naming（材质命名）下拉菜单更改为 Model Name + Model’s Matter（模型名称 + 模型材质）。**\n\
  \    这将防止多个文件更改材质以匹配具有相似名称的其他材质。\n\n![image](img/9781119404187-fg1205.png)\n\nFIGURE\
  \ 12-5: 场景中的玩家角色。\n\n### 设置角色\n\n由于你制作了动画，当玩家角色开始时，它会自动移动到点 (0,0,0)。Unity 读取动画导致会导致或对象重置到它们相对于\
  \ Unity 中心点移动的位置。解决这个问题最简单的方法是给动画提供一个新的中心点作为其基准。这是通过父子关系（parenting）实现的。\n\n### 设置动画\n\
  \n现在你会发现，当你点击 Play 按钮运行游戏时，动画要么只播放一次不再播放，要么根本不播放。这是因为你还没有为角色设置动画。这需要你使用预制体 Inspector\
  \ 窗口中的 Rig 和 Animation 标签。\n\n1. **打开 Inspector 窗口中的 Rig 标签页。**\n   下拉菜单中有四种动画类型供选择：\n\
  \   * None（无）：当你没有导入动画时。\n   * Legacy（旧版）：导入动画的旧方法。这种方法与动画控制器（animation controller）无法正常工作，因此不适合玩家角色。\n\
  \   * Generic（通用）：基础导入方法，在导入动画的同时保留代码，以便 Unity 可以根据需要读取并修改代码。\n   * Humanoid（人形）：导入具有骨骼的人形角色，通过在网格上附加骨骼或骨架使不同部分能够弯曲。\n\
  2. **对于此项目，选择 Generic 类型。**\n3. **将 Avatar Definition（化身定义）更改为 Create For This Model（为此模型创建）。**\n\
  4. **将 Root Node（根节点）更改为 None（无）。**\n5. **点击 Animations（动画）标签页（参见图 12-9）。**\n6.\
  \ **滚动到 Clips（片段）部分。**\n   看到大量的选项和分解。这些只是 Unity 可以识别的动画中的不同动画部分。有时这是准确的，但大多数时候，我发现自己处理更可靠。\n\
  7. **通过选择它们并点击右角的减号（–）删除所有选项和分解。**\n8. **点击一次加号 (+）。**\n9. **对于 Source Take（源采样）下拉菜单，选择\
  \ Eye control|Eye controlAction。**\n10. **对于第一个动画，将片段名称更改为 Idle（闲）。**\n    Timeline（时间线）上的蓝色高亮部分表示片段使用的动画部分。\n\
  11. **调整 Timeline 以仅包含角色的 Idle 动画。**\n    我的动画从 0 开始到 154 结束。\n12. **按照第 8 至 11\
  \ 步操作行走和跳动画，分别命名为 Walking（行走）和 Jump（跳跃），如图 12-10 所示。\n\n![image](img/9781119404187-fg1209.png)\n\
  FIGURE 12-9: 第一个动画。\n\n![image](img/9781119404187-fg1210.png)\nFIGURE 12-10: 动画。\n\
  \n在完成设置后，你需要确保它正常工作：\n\n1. **在 Hierarchy（层级）中选择角色。**\n   你会注意到有一个动画组件。\n2. **选择\
  \ Animation。**\n   这将打开 Animator 窗口。\n3. **双击 Idle。**\n   这将设置 Idle 为起始。\n4. **从\
  \ Animations 下拉菜单选择 Size。**\n   你会看到下方有一个数字。\n5. **对于动画，将数量更改为 3。**\n6. **确保元素为\
  \ Idle、Walking 和 Jump。**\n\n![image](img/9781119404187-fg1211.png)\nFIGURE 12-11:\
  \ 选择动画\n\n### 创建角色的动画控制器\n\n角色现在设置了动画，但当你点击 Play 时什么都没有发生。这是因为没有告诉游戏。\n\n为了控制动画以便角色移动时播放正确的动画，你需要一个动画控制器。动画控制器告诉角色如何相互作用。\n\
  \n要像图 12-12 所示那样创建动画控制器，在 Project 窗口中右键点击。你可以在任何文件夹中创建控制器，但为了方便，我喜欢在 Prefabs 文件夹或直接在\
  \ assets 文件夹中创建。Create Animator Controller。将其命名为 `Character_animator`。双击此新控制器将在\
  \ Scene 窗口中打开一个名为 Animator 的新标签。\n\n![image](img/9781119404187-fg1212.png)\nFIGURE\
  \ 12-12: 创建动画控制器。\n\n打开控制器窗口后，你会发现它是空的，除了两个框：Any State 和 Entry。要修复此，打开你的玩家角色预制体并滚动。在预制体的底部，你会看到对应角色的不同动画的三个标签。将这三个全部拖入\
  \ Animator 窗口。会出现三个新框，每个对应一个不同的片段（参见图 12-13）。\n\n![image](img/9781119404187-fg1213.png)\n\
  FIGURE 12-13: Animator 中的不同片段。\n\n\n\n\n你还会注意到，现在有一个橙色箭头从 Entry（入口）指向 Idle（空闲）。这表示在动画器视图中，Idle\
  \ 动画是角色的主要动画，这对于你的游戏来说是有用的。\n\n在 particular 为每个动画创建了这些新方框后，将它们移开，以便你可以清楚地阅读每个方框，并在它们之间留出空间。确保默认状态（当前为\
  \ Idle）是最靠近 Entry 和 Any State（任意状态）的，另外两个位于 Idle 的下方或侧面，Idle 位于它们之间（参见图 12-14）。这对游戏本身没有任何影响，但会在视觉上使导航更加容易。\n\
  \n现在，你必须确定这些状态之间的相互关系：\n\n1.  **右键点击 Any State 并选择 Make Transition（制作过渡）。**\n2.\
  \  **选择 Idle After（Idle 之后）。**\n    现在应该有一个箭头从 Any State 指向 Idle。\n3.  **右键点击 Idle\
  \ 并选择 Make Transition（制作过渡）。**\n4.  **选择 Jump（跳转）。**\n    这将使得角色可以从 Idle 动画过渡到 Jump\
  \ 动画。\n5.  **针对 Walking（行走）重复步骤 3 和 4，而不是 Jump。**\n\n![image](img/9781119404187-fg1214.png)\n\
  \n图 12-14： 制作过渡。\n\n在 particular 创建了所有这些过渡之后（参见图 12-14），你还需要让角色能够从 Walking 和 Jump\
  \ 跳回 Idle，以及在 Walking 和 Jump 之间进行切换。按照你之前的步骤创建过渡，但不要从 Idle 开始，而是从 Walking 和 Jump\
  \ 指向 Idle，以及它们相互之间。\n\n这将创建这些过渡，让动画师知道每个动画之间的关系，但仍然没有任何东西指示这些动画何时发生。到目前为止，只会播放的是\
  \ Idle 动画。你需要创建触发器（triggers），如图 12-15 所示，来指示控制器何时工作。\n\n![image](img/9781119404187-fg1215.png)\n\
  \n图 12-15： 创建触发器。\n\n在 Animator 窗口中，点击 Parameters（参数）标签。在 Parameters 标签上，你会看到 List\
  \ Is Empty（列表为空），表示还没有什么影响动画。点击加号 (+) 并选择 Trigger（触发器）。这将创建一个受动画影响的触发器。将此触发器命名为\
  \ Jump，然后创建另一个命名为 Walk。\n\n在创建这些触发器后，你必须指示何时使用它们（参见图 12-16）：\n\n1.  **选择一个指向 Jump\
  \ 的箭头。**\n    在 Inspector（检查器）窗口中，你看到 Transitions（过渡）和 Conditions（条件）。在 Conditions\
  \ 中，显示为 *non* 并带有一个下拉菜单。\n2.  **从 Non 下拉菜单中选择 Jump。**\n3.  **对所有指向 Jump 的箭头重复步骤\
  \ 1 和 2。**\n4.  **对所有指向 Walking 的箭头重复步骤 1 和 2。**\n5.  **用 Jump 替换 Walk。**\n\n![image](img/9781119404187-fg1216.png)\n\
  \n图 12-16： 设置条件。\n\n这将让你能够轻松地从空闲姿态过渡到跳转和行走姿态。问题是没有办法从这些姿态回到空闲状态。因此，创建一个第三名为 Idle\
  \ 的触发器，并重复步骤将空闲与其他姿态链接起来。\n\n### 编写控制器代码\n\n计算机和游戏最终都会回到代码上。现在你已经创建了控制器和角色，你必须将两者链接起来，以便角色的动画可以被动画控制器正确控制，而动画控制器可以与键盘上的某些按键连接。与早期章节中的代码相比，控制器的代码实际上超级。\n\
  \n在开始编写代码之前，你必须将控制器链接到玩家角色。要为此，在 Hierarchy（层级）中选择玩家角色，并在 Inspector 中选择 Add Component（添加组件）。在\
  \ Miscellaneous（杂项）菜单中，你会找到 `Animator` 组件。添加组件后，在组件内部你会看到 `controller target`。选择旁边的圆圈，并选择你刚刚创建的动画器。这将控制器链接到角色。\n\
  \n将控制器与角色链接后，进入 assets 中的代码文件夹。\n\n```csharp\nvoid Start() {\n    anim = GetComponent<Animator>();\n\
  }\n\nvoid Update() {\n    if (Input.GetKeyDown(KeyCode.Space)) {\n        anim.SetTrigger(\"\
  Jump\");\n    }\n    if (Input.GetKeyDown(KeyCode.W)) {\n        anim.SetTrigger(\"\
  Walk\");\n    }\n    if (Input.GetKeyDown(KeyCode.A)) {\n        anim.SetTrigger(\"\
  Left\");\n    }\n    if (Input.GetKeyDown(KeyCode.D)) {\n        anim.SetTrigger(\"\
  Right\");\n    }\n    if (!Input.anyKey) {\n        anim.SetTrigger(\"Idle\");\n\
  \    }\n}\n```\n\n\n\n\n2. **使用 Finder (Mac) 或 Windows 资源管理器 (PC)，将 `enemy.blend`\
  \ 文件拖入 Unity 的 prefab 文件夹。**\n\n3. **选择该 prefab，并在 Inspector（检查器）中，将 `Scale Factor`\
  \ 更改为 0.5。**\n\n4. **确保以下选项卡均已勾选：**\n    * Use File Scale\n    * Read/Write Enables\n\
  \    * Import BlendShapes\n    * Generate Colliders\n    * Weld Vertices\n    *\
  \ Import Visibility\n\n5. **从 `Material Naming` 下拉列表中，选择 `Model Name` + `Model’s\
  \ Matter`。**\n\n6. **点击 `Rig` 标签页。**\n\n7. **将 `Rig` 更改 `Legacy`。**\n    你没有为这个角色使用控制器。我发现对于导入敌人角色和物体，使用\
  \ `Legacy` 导入方式实际上更稳定且更易使用。\n\n8. **点击 `Animation` 标签页。**\n\n9. **确保 `Wrap Mode`\
  \ 设置为 `Loop`。**\n    在 `Generic` 中，它是 `Loop Time`；在 `Legacy` 中，它是 `Wrap Mode`。\n\
  \n10. **将两个敌人小兵拖入 `Scene` 窗口。**\n\n11. **将每个小兵父化到第 1 步创建的空物体（empty）之一。**\n\n12.\
  \ **将空物体的位置设置为 `(0,0,0)`。**\n    这将它们置于空物体的正中间。\n    回想你之前创建的玩家控制器立方体。这是因为角色将围绕\
  \ `(0,0,0)` 点移动。同样的规则也适用于你将导入的所有动画。区别在于，由于你想让碰撞体位于敌人角色上而不是中心点，所以你会使用空物体而不是立方体。\n\
  \n13. **移动敌人小兵所在的空物体，确保小兵恰好接触地面（如图 12-19 所示）。**\n\n14. **在 `Hierarchy`（层级）中选择敌人。**\n\
  \n15. **在 `Inspector` 中，确保点击了 `Animation` 标签页上的 `Play Automatically`。**\n\n16. **选择\
  \ `Add a Component` ⇒ `Physics` ⇒ `Box Collider`。**\n\n17. **在 `Box Collider` 标签页上，确保勾选了\
  \ `Is Trigger`。**\n    这将使得角色受到盒碰撞体的影响。\n\n18. **将顶部的 `Tag` 更改为 `Enemy`。**\n\n19.\
  \ **对第二个敌人小兵重复第 12 至 18 步（参见图 12-20）。**\n\n![image](img/9781119404187-fg1219.png)\n\
  图 12-19： 处于位置的敌人小兵。\n\n![image](img/9781119404187-fg1220.png)\n图 12-20： 两个敌人都在各自的位置上。\n\
  \n### 导入破碎机 (CRUSHER)\n\n破碎机比敌人小兵稍微复杂，因为它实际上需要两个碰撞体才能正常工作。其中一个碰撞体必须杀死玩家，而玩家只需要跳到另一个碰撞体上。\n\
  \n首先，使用“导入敌人小兵”章节中的第 2 至 5 步导入破碎机。删除替代危险物体，用空物体替换它并命名为 `Crusher`（将空物体在 `x*-axis`\
  \ 上居中）。遵循以下步骤：\n\n1. **在 `Rig` 标签页上，将 `rig` 更改为 `Legacy`。**\n2. **在 `Animation`\
  \ 标签页上，将 `Wrap Mode` 更改为 `Loop`。**\n3. **将破碎机拖入场景并将其父化到创建的空物体。**\n    你会注意到破碎机上父化了一些东西。这是因为在\
  \ Blender 中，破碎机的上半部分和下半部分是两个不同的物体。上半部分父位于下半部分，这种父关系会被带入 Unity。\n4. **将位置设置为 `(0,0,0)`。**\n\
  5. **调整空物体，使破碎机的底部恰好接触地面。**\n6. **在 `Hierarchy` 中选择破碎机，并确保 `animator` 勾选了 `Play\
  \ Automatically`。**\n7. **选择 `Add a Component` ⇒ `Physics` ⇒ `Box Collider`。**\n\
  8. **不要将此碰撞体设为触发器（trigger），也不添加标签（tag）。**\n    这将使破碎机的底部成为一个玩家可以站立的平台。\n9. **打开\
  \ `Crusher` 父物体，选择其内部的子物体（破碎机的上半部分）。**\n10. **选择 `Add a Component` ⇒ `Physics` ⇒\
  \ `Box Collider`。**\n11. **将碰撞体设为触发器（trigger）。**\n\n\n\n\n\n本章将作为你关卡的最后清理工作。与之前的玩测试章节（第\
  \ 6 章）一样，本章的重点在于回顾游戏中有效和不起作用的方面，并修复你游戏中存在的问题。在本章中，你不会学到任何新知识。相反，你将完善游戏中那些可能运行得不如其他部分的方面，并问自己一些当你旨在让你的游戏从其他游戏中脱颖而出时非常有用的问题。\n\
  \n本章的目标是得出一个可以玩的完整关卡。本章迫使你回顾你的游戏，并思考你对它的了解和不了解之处。最后，你将看到多次玩测试的好处。\n\n## 第二次测试\n\n\
  为了创建一个更好的游戏，你应该经常进行玩测试。游戏开发关乎修复和调整各个事物使其运行得更好，因此玩测试在任何时候都非常重要，即使你已经做过它。\n\n这一次，你将关注游戏中之前关注过的其他方面。当你之前查看游戏时，你关注的是游戏的核心方面，哪些地方合理，哪些不合理，以及哪些地方可以更清晰。这一次你关注的是游戏中需要更多打磨或需要修复的部分，因为它们在添加游戏不同部分后发生了崩溃。\n\
  \n随着新的玩测试，会有必须回答的新问题。除了你在上一次玩测试中提出的问题，你还有新的需要回答的问题。这些问题从游戏代码中的某些简单问题到创建全新的资产不等。再次，这些问题没有特定的顺序，但在这一轮玩测试中应该考虑所有这些问题。\n\
  \n在第二轮玩测试中询问这些问题：\n\n*   **游戏中哪些地方坏了？为什么？** 这可能是玩测试时最明显的问题——无论你是在游戏开发的早期还是后期。有时游戏的某些方面运行良好，直到一个新因素出现并毁掉了一切。当你玩测试游戏时，请留意这些问题。\n\
  *   **游戏是困难还是令人沮丧？** 在开发的这个阶段，你应该已经相当熟悉你当前游戏中哪些部分有效，哪些不起作用。这个问题可以帮助你理解游戏中“更难”的部分是否对玩家产生了预期效果。玩家永远不应该感到被游戏欺骗。一旦发生这种情况，游戏开发者就在游戏中犯了错误。\n\
  *   **你在游戏中发现了哪些阻碍？** 是否有游戏部分强制游戏停顿？这些部分是否能够被克服，还是无法克服？不可能的游戏是不趣的。玩家永远不想感觉自己*无法赢得游戏*。有时这些阻碍以挑战性太强的任务的形式出现，或者仅仅是一堵玩家来说无法跨越的墙。\n\
  *   **游戏是否太简单了？** 如果游戏在完成时没有某种成就感，它们就是不好玩。虽然太难的游戏会让玩家气馁，但太简单的游戏会让玩家取得的成就意义变小。\n\
  *   **游戏合逻辑吗？** 玩家是否能够理解游戏并在几乎或完全没有困惑的情况下玩它？游戏不应该让玩家感到困惑（除非游戏的点就是让人困惑）。游戏应该是合理的，并有清晰易于理解的规则。\n\
  \n## 修复你的游戏\n\n当你完成玩测试时，承认已解决的问题并找到修复它们的方法。我将在这一节中涵盖一些问题，但你的玩测试者可能会识别出我在这里没有涵盖的问题。但请根据你在书中学的知识，尝试在这些问题出现时寻找解决办法，并修改你的游戏来回答玩测试者提出的问题。游戏由你来改进！这本书为你提供了骨架——取决于你如何让它成为你自己的。\n\
  \n### 爬墙问题又回来了\n\n当游戏赋予角色和动画时，有一个东西坏掉了，是你之前修复的爬墙问题的解决方案。使用射线投射（raycasting），你使得当玩家撞向墙时，他会被强制后退，防止他将墙作为可以爬上去使用的东西（参见图\
  \ 13-1）。\n\n![image](img/9781119404187-fg1301.png)\n\n图 13-1： 爬墙。\n\n检查角色，你发现并没有太大变化。玩家仍然控制角色，并且动画父于基础玩家，因此尽管动画在播放，但它所做的任何操作并没有影响角色的移动。在代码中，没有任何不同。`char`\
  \ 代码完全没有改变。\n\n问题不在于各个部分，而在于它们之间的关系。尝试从任何一侧撞向楼梯看看会发生什么。一侧没有变化，但当另一侧撞向墙时，角色会向后退。\n\
  \n### 每次在游戏中受伤时，金币都会减少两个\n\n这个问题非常令人头疼。在`variable` 和代码之间似乎没有任何变化会影响游戏中的这种变化，但每当你撞到敌人或掉下边缘时，角色失去的两枚金币而不是一个，导致游戏结束速度快得多。\n\
  \n问题源于游戏向代码返回了太多信息。尽管代码不在玩家角色上，但角色父于一个带有代码的对象，因此它也受到代码的影响。因此，玩家角色上的碰撞器也注册了触发器并将它们发送回代码以调整分数。这导致玩家失去的两分，而不是最初设计的一个分。要修复这个问题，你只需要关闭玩家角色的盒体碰撞器（box\
  \ collider）。\n\n\n\n\n\n游戏中的最后一个问题之一源于游戏的关卡设计。这个问题在之前并没有出现过。在此之前，玩家实际上具有跳得更高的能力，因为有足够的空间让角色进行助跑起跳。随着敌人和环境障碍的引入，这种同样的跳跃能力受到了限制。正因如此，某些平台太高了，玩家实际上无法进行适当的跳跃。\n\
  \n解决这个问题的办法其实非常简单：只需添加楼梯！对于那些无法跳跃或没有其他访问方式的平台，添加楼梯（见图 13-4）并不会降低难度。相反，它们通过赋予玩家实际前进的能力来改进游戏体验。\n\
  \n![image](img/9781119404187-fg1304.png)\n\n图 13-4： 添加楼梯。\n\n## 总结显著问题\n\n这些只是玩家在游戏中可能会遇到的少数问题之一。作为一名开发者，你的工作是听取所有的批评，并尽力解决它们。故障和错误（bugs）在游戏中是不可避免的。即使是经过多次测试测试的游戏也会出现这些问题。你可能永远无法在你的游戏中找到*所有*可能的\
  \ bug，尤其是当你的游戏变得越大、越复杂时。\n\n从容接受收到的任何批评，并知道没有任何游戏是完美的。努力做出最好的游戏，对其进行测试，并进行调整以更好地适应你期望的玩家，但不要迷失于修复每一个小细节。\n\
  \n![image](img/c14.png)\n\n在前面的章节中，你创建并精炼了游戏的第一个关卡。现在是时候对关卡进行最后的润色了，这样你就可以创建新的关卡并超越单关卡的限制。\n\
  \n在本章中，你将学习如何编写代码以便在关卡完成后加载新关卡。你还将学习如何修复代码，以便角色在关卡中死亡时能够重生。最后，你将学习如何导出游戏，以便你可以随时玩它！\n\
  \n## 创建多个关卡\n\n到目前为止，你为游戏创建了一个关卡，但游戏不仅仅是一个关卡。大多数游戏都有玩家不断通过的多个关卡，并且难度随着关卡的推进而不断增加。你的游戏也应该如此。Unity\
  \ 让你能够轻松创建新关卡并将游戏中的各个关卡连接起来。\n\n首先，你需要创建一个新关卡：\n\n1. **在打开第一个关卡的情况下，选择 文件（File）⇒\
  \ 新建场景（New Scene）。**\n   这将在你的整个项目中创建一个新的空场景。\n2. **将新场景保存为 `Level2`，并重新打开你的第一个关卡。**\n\
  3. **创建一个新的 C# 代码，并将其命名为 `Level2`（见**图 14-1**）。**\n4. **打开新代码。**\n5. **在代码顶部，即代码列出其将要使用的所有集合和引擎的地方，输入以下内容：**\n\
  \   ```csharp\n   using UnityEngine.SceneManagement;\n   ```\n   这段代码将访问 Unity 的场景管理器（Scene\
  \ Manager）工具。场景管理器允许使用代码控制不同的场景。你可以用它在点击一下按钮或触发某些条件时加载和重新加载关卡。在这种情况下，`Level2` 代码将被添加到端点中，这样当玩家触发游戏对象时，游戏将在屏幕上加载第\
  \ 2 关卡。\n6. **删除 `void Start` 和 `void Update` 两个字符串。**\n   它们对代码来说是不必要的。\n7. **在\
  \ `void Start` 和 `void Update` 字符串的位置，输入以下内容：**\n   ```csharp\n   void OnTriggerEnter(Collider\
  \ other) {\n   ```\n   这将指示代码，当碰撞器（collider）与另一个游戏对象碰撞时，该字符串会被激活。在代码内部，你将定义当触发发生时激活哪些代码，以及它将如何影响游戏的其他。\n\
  8. **在 `void` 触发器内部，输入以下代码：**\n   ```csharp\n   if (other.gameObject.CompareTag(\"\
  Player\")) {\n   ```\n   这将使得当碰撞器碰到带有有 `Player` 标签的游戏对象时，括号内的代码将会执行。\n9. **在 `if`\
  \ 语句的括号内添加以下代码：**\n   ```csharp\n   Scene.Manager.LoadScene (\"Level2\");\n   ```\n\
  \   这段最后的代码将访问场景管理器工具并告诉它加载与你的游戏的名为 `Level2` 的场景。这段代码可以用于加载项目中的任何其他场景。你可以在图 14-2\
  \ 中看到代码完成后的样貌。\n\n![image](img/9781119404187-fg1401.png)\n\n图 14-1： 创建新代码。\n\n![image](img/9781119404187-fg1402.png)\n\
  \n图 14-2： 新代码。\n\n![image](img/9781119404187-fg1403.png)\n\n图 14-3： 构建设置窗口。\n\n\
  ## 重置关卡\n\n到目前为止，当角色死亡时，玩家会被销毁，游戏会发送一条玩家输了的消息。相反，你将更改它，使得游戏仍然向你展示失败界面，但当你按下某个键时，游戏将重新开始。遵循以下步骤：\n\
  \n1. **打开你的 `Char` 代码。**\n2. **在代码顶部添加以下内容：**\n   ```csharp\n   using UnityEngine.SceneManagement;\n\
  \   ```\n   这段代码更改并控制场景。\n3. **在所有 `if` 语句的最后，在 `void` 触发字符串内部，找到 `if (count <=\
  \ -1)` 代码并删除整个部分代码，包括 `if` 语句内部的代码。**\n   对 `void` 碰撞器内部所有的 `if` 语句执行此操作。\n4. **在你删除所有这些代码的地方，编写以下内容：**\n\
  \   ```csharp\n   if (count <= -1) {\n   ```\n\n\n\n\n\n```csharp\nwinText.text\
  \ = \"你输了 :( 按 R 键重新开始\"\ndead = true;\n}\n```\n\n这段代码位于 `void` 函数内，但它是独立存在的，这样你就不需要像之前那样在每个\
  \ `if` 语句中修改代码了（请参见图 14-4）。\n\n![image](img/9781119404187-fg1404.png)\n\n图 14-4：\
  \ 将关卡添加到构建中。\n\n你不需要销毁游戏对象，而是使用一个新的布尔值 `Boolean` `dead` 来影响游戏。现在，`dead = true` 对游戏没有影响，但那是因为你还没有定义\
  \ `dead`。按照以下步骤操作：\n\n1. **在代码顶部，即你存放所有公共和私有浮点数、文本和游戏对象的地方，添加以下代码：**\n\n   ```csharp\n\
  \   public bool dead = false;\n   ```\n\n   这将给 `dead` `bool` 赋值 `false`，使得代码能够识别\
  \ `dead` `bool` 的值。目标是每当玩家死亡（当 `dead` `bool` 为 `true` 时），玩家将无法移动或使用她的角色。\n\n2. **修改\
  \ `void FixedUpdate` 中的所有 `if` 语句，使其包含 `dead` 必须为 `false` 的条件。**\n\n与添加 `sprint`\
  \ 函数类似，只需在 `if` 代码的末尾添加 `&& dead == false`。对 `void FixedUpdate` 内部所有所有的 `if` 语句重复此操作（请参见图\
  \ 14-5）。\n\n现在，只要玩家没有死亡，角色就能自由移动，但一旦角色死亡，所有的移动控制都将无法使用，因为你添加了角色必须*非*死亡才能移动的条件。角色一死亡，玩家的操作就会停止，但在游戏“结束”后，你如何重新开启玩家的操作呢？\n\
  \n![image](img/9781119404187-fg1405.png)\n\n图 14-5： 使 `dead == false`。\n\n你已经编写了代码让角色停止工作。现在你必须编写重置按钮的代码。在失败语句中，你已经告诉了玩家她需要按哪个键来重置游戏，因此你将在代码中编写该函数。在\
  \ `FixedUpdate` 代码的末尾，但在射线检测代码之前，添加一个新的 `if` 语句：\n\n```csharp\nif (Input.GetKey(KeyCode.R)\
  \ && dead == true) {\n    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n\
  }\n```\n\n这段代码让玩家在角色死亡时拥有重置游戏的能力。就像移动代码一样，这段代码只有在玩家按下键盘上的特定按钮时才会发生——在这种情况下是 `R`\
  \ 键。因为添加了 `&& dead == true`，除非玩家已经死亡，否则这段代码不会生效。当玩家按下 `R` 时，`SceneManager` 将从头重新加载场景，将游戏重置为关卡开始时的状态，因此任何所有文本和计数都将重置为初始值。图\
  \ 14-6 显示了代码应该后的样子。\n\n![image](img/9781119404187-fg1406.png)\n\n图 14-6： 重置代码。\n\
  \n## 导出你的游戏\n\n现在你的游戏已经完成了，你需要导出游戏以便在没有 Unity 的情况下运行。有两种方法可以：\n\n* 你可以选择 `File`（文件） ⇒ `Build`（构建）。\n\
  * 你可以在双重检查确保所有设置都正确后，在 `Build Settings`（构建设置）窗口中构建游戏。\n\n你还可以为文件命名。当导出游戏时，你可以选择导出到特定位置。将其导出到你的游戏文件夹将易于找到和打开，但你不需要将其与项目文件夹放在一起，因为构建是独立的，不依赖于项目文件夹，它的任何部分都不需要引用它们。\n\
  \n当你打开游戏时，你将看到图 14-7 所示的屏幕。\n\n![image](img/9781119404187-fg1407.png)\n\n图 14-7：\
  \ 将关卡添加到构建中。\n\n## 导出游戏\n\n你已经编写了代码让角色停止工作。现在你必须编写重置按钮的代码。在失败语句中，你已经告诉了玩家她需要按哪个键来重置游戏，因此你将在代码中编写该函数。在\
  \ `FixedUpdate` 代码的末尾，但在射线检测代码之前，添加一个新的 `if` 语句：\n\n```csharp\nif (Input.GetKey(KeyCode.R)\
  \ && dead == true) {\n    SceneManager.LoadScene(SceneManager.GetActiveScene().name);\n\
  }\n```\n\n这段代码让玩家在角色死亡时拥有重置游戏的能力。就像移动代码一样，这段代码只有在玩家按下键盘上的特定按钮时才会发生——在这种情况下是 `R`\
  \ 键。因为添加了 `&& dead == true`，除非玩家已经死亡，否则这段代码不会生效。当玩家按下 `R` 时，`SceneManager` 将从头重新加载场景，将游戏重置为关卡开始时的状态，因此任何所有文本和计数都将重置为初始值。图\
  \ 14-6 显示了代码应该后的样子。\n\n![image](img/9781119404187-fg1406.png)\n\n图 14-6： 重置代码。\n\
  \n## 导出你的游戏\n\n现在你的游戏已经完成了，你需要导出游戏以便在没有 Unity 的情况下运行。有两种方法可以：\n\n* 你可以选择 `File`（文件） ⇒ `Build`（构建）。\n\
  * 你可以在双重检查确保所有设置都正确后，在 `Build Settings`（构建设置）窗口中构建游戏。\n\n你还可以为文件命名。当导出游戏时，你可以选择导出到特定位置。将其导出到你的游戏文件夹将易于找到和打开，但你不需要将其与项目文件夹放在一起，因为构建是独立的，不依赖于项目文件夹，它的任何部分都不需要引用它们。\n\
  \n当你打开游戏时，你将看到图 14-7 所示的屏幕。\n\n![image](img/9781119404187-fg1407.png)\n\n图 14-7：\
  \ 将关卡添加到构建中。\n\n## 关于作者\n\n**PATRICK MCCABE** 是数字艺术的一名教师。他在过去的一年里一直在教学生动画。他于 2016\
  \ 年毕业于纽约州立大学。高中期间，Patrick 在格林尼市青年电影节获得过最佳动画奖。他还是一个不秘密的《星大战》爱好者。\n\n## 致谢\n\n这本书献给我的未婚妻\
