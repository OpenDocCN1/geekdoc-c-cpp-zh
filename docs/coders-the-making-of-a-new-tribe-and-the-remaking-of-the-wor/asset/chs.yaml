  \ `key`。正如追溯到古希腊的间谍和将军们也完全清楚的，你很容易不小心丢失你的 `key`，或者被敌人偷走。一旦有人知道了你的 `key`，他们就可以解密你的任何秘密消息并阅读它们。所以，确实，Diffie\
  \ 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\n（注：由于原文中存在大量重复段落，已按要求进行处理。）\n\
  \n他们发明了所谓的“公钥/私钥”加密。在这个系统中，我们每个人都有两个密钥：一个任何人都能看到的公钥，以及一个只有我们个人知道的私钥。向他人发送消息意味着使用两个密钥——你的私钥和他们的公钥。根据加密数学的原理，问题在于——如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的\
  \ `key`。正如追溯到古希腊的间谍和将军们也完全清楚的，你很容易不小心丢失你的 `key`，或者被敌人偷走。一旦有人知道了你的 `key`，他们就可以解密你的任何秘密消息并阅读它们。所以，确实，Diffie\
  \ 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\n这些就是所谓的“加密大战”：一系列关于谁被允许编写和使用加密的斗争。\n\
  \n在如今这个充满 Facebook 和电子邮件的世界里，人们变得越来越明确，我们的在线活动正被严密追踪。然而，在过去的 世纪 70 年代和 80 年代，大多数人并没有在线，因此数字隐私的概念并不在全民讨论的范围内。第一批预见到我们今天现状的“卡珊德拉”们是计算机科学家和编码员。毕竟，他们是第一批使用\
  \ `email` 相互交流并往回发送文件的人。这既有趣又令人兴奋，但他们不安地意识到，所有这些邮件和讨论论坛帖子都留下了数字足迹。以文本形式进行的对话可能会在服务器上留存多年，也许是永远。当社会的\
  \ `rest` 部分也开始做同样的事情时，会发生什么？\n\n这让计算机科学家 Whit Diffie 感到担忧。在 20 世纪 70 年代初，当与伴侣聊天时，预言了\
  \ Facebook、Amazon 和 Google Hangouts 等产品的出现。“我告诉她，我们正在进入一个世界，人们将与他们从未面对面见过的人建立重要、亲密且长期的关系，”他在\
  \ 2013 年回忆道。\n\nDiffie 也知道，在当时，大多数形式的数字消息加密都非常脆弱。这是因为它们都存在一个巨大的缺陷：双方——发送消息的人和接收消息的人——都需要拥有相同的、用于让你解密的\
  \ `key`（密钥）。如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的 `key`。这种做法的问题在于——追溯到古希腊的间谍和将军们也完全清楚的，你很容易不小心丢失你的\
  \ `key`，或者被敌人偷走。一旦有人知道了你的 `key`，他们就可以解密你的任何秘密消息并阅读它们。所以，确实，Diffie 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\
  \n在 1976 年，Diffie 和他的同事有了一个突破性的想法。他们发明了所谓的“公钥/私钥”加密。在这个系统中，我们每个人都有两个密钥：一个任何人都能看到的公钥，以及一个只有我们个人知道的私钥。向他人发送消息意味着使用两个密钥——你的私钥和他们的公钥。根据加密数学的原理，问题在于——如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的\
  \ `key`。正如追溯到古希腊的间谍和将军们也完全清楚的，你很容易不小心丢失你的 `key`，或者被敌人偷走。一旦有人知道了你的 `key`，他们就可以解密你的任何秘密消息并阅读它们。所以，确实，Diffie\
  \ 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\n\n\n\n\n一种亚文化正在兴起，他们被加密技术的政治影响所吸引。这些实践者自称为“密码客”（cypherpunks），是一群分散在全球的黑客和思想者。其中许多人是坚定的自由意志主义者，热衷于不受政府监视的言论自由理念。（创始人之一蒂姆·梅\
  \ Tim May 认为，“加密 = 枪支，意味着个人的先发保护。”）另一些人则是无政府资本主义者，他们像是比特币编码人的早期预言，梦想着利用加密技术创建匿名电子货币，这种货币永远不会被征税，并且永远不会受到全球贪婪官僚之手的侵害。其中有些人变成了后来也梦想建立“海上国家”的人；也有人仅仅是经典的美国公民自由自由联盟（ACLU）公民自由主义者。他们都仇恨\
  \ `NSA`。\n\n到了 20 世纪 90 年代中期，`NSA` 意识到密码客的观点正在占据优势。互联网正进入公共生活；普通大众和企业开始交换电子邮件并浏览网页。`Lotus\
  \ Notes` 等软件的开发者开始将加密功能整合到产品中，理由是企业客户希望知道自己的通信是安全的。电子商务也开始起步，这意味着所有在以太中飞传输的信用卡号都需要保护。而且“军火规则”看起来也不太稳定。法官们正准备裁定，代码确实是言论——政府不能禁止你跨越国界发表这种言论。（1999\
  \ 年，地区法院法官做出了这项裁决。）\n\n于是，`NSA` 的特工们尝试了一次孤注一掷的传。如果加密技术注要在社会范围内普及，该死的，他们想要确保由*他们*来控制它。通过与克林顿政府合作，`NSA`\
  \ 的领导人辩称，所有的电脑和手机确实应该拥有强大的加密功能。但它应该以 `NSA` 自己创建的计算机芯片的形式存在：“克利珀”（Clipper）芯片。如果一个设备中有一个\
  \ `Clipper` 芯片，它就会加密你在网上进行的任何操作或在电话里说的任何话，使其免受窥探。但有一个例外：即 `NSA` 本身。他们将保留一把“后门”密钥，可以访问每个设备。这样，如果有任何犯罪分子或恐怖分子开始使用加密进行秘密通信，`NSA`\
  \ 就能轻松监听他们的对话。这是一个宏大的计划，为普通人提供高端加密技术——前提是你信任 `NSA` 会虔诚地尊重美国普通人的隐私，只监听恶人，并且绝不滥用权力。\n\
  \n密码客们完全不买账。这个计划简直是*疯了*。“战争已经到来，”梅暴道道，“克林顿和戈尔的人已经表现出他们是‘老大哥’的热衷支持者。”他们开始引发公众愤慨，各界公民自由主义者也加入了他们。编程极客之外的知识分子也加入了进来，包括保守派的《纽约时报》专栏作家威廉·赛弗\
  \ William Safire。更广泛的公众开始意识到，嘿，生活正在转向线上——而他们也不喜欢间谍窥探他们事务的主意。\n\n然而，真正让 `Clipper`\
  \ 芯片失败的并不是政治问题。而是一个漏洞，是由一个名叫特·布莱兹 Matt Blaze 的年轻计算机科学家在要求评估该芯片时发现的。在仔细研究 `Clipper`\
  \ 芯片的规格时，他迅速发现了一个巨大的缺陷——这个缺陷能够封锁 `NSA` 的“后门”。利用这个漏洞，犯罪分子可以使用 `Clipper` 芯片在网上秘密通话，同时防止\
  \ `NSA` 监听。所以实际上，`NSA` 创造了一种向犯罪分子提供惊人加密技术的技术，而 `NSA` 自身却无法破解。当布莱兹发表他的发现时，这让 `NSA`\
  \ 看起来比说谎的还要糟糕：它看起来是那么无能。\n\n克林顿和戈尔悄悄拔掉了该芯片的插头。黑客、计算机科学家和密码客赢了。\n\n***\n\n... ...\
  \ ...\n\n即使在经历了这些关于间谍行动的斗争之后，代码人员与执法部门之间最大的冲突之一尚未到来。而且它是基于一个意料之外的领域：娱乐法和版权——电影和音乐。\n\
  \n20 世纪 90 年代后期，随着越来越多的公民涌入网络，好莱坞制片厂和唱片公司的高管感到警觉。人们在网上交易歌曲的 `MP3` 副本，却不付钱！宽带变得越来越快，他们预见到未来，人们也会开始在网上复制和交易电视节目和电影，同样不付钱。因此，娱乐行业高管开始大声警告盗版的危害，将其描绘成不仅是对他们底利润的威胁，更是对文明本身的威胁。“这是历史上一个意义深远的时刻，”当时的时报负责人理查德·帕森\
  \ Richard Parsons 说道，“这不仅仅关乎一群孩子偷音乐。这是对构成我们社会文化表达的一切物的攻击。如果我们不能保护和维护我们的知识产权……这个国家将陷入某种文化黑暗时代。”\n\
  \n为了保护他们的产品不被复制和分享，娱乐公司转向了密码客所喜爱的元素——强加密。每当唱片公司或电影制片厂将歌曲、电视节目或电影数字化时，他们就会将它们封装在加密之中。对于\
  \ `DVDs`，这种加密被称为“内容混乱系统”（Content Scramble System）。如果你想在电脑上看 `DVD`，你需要一个可以解密电影的视频播放器。\n\
  \n在某种意义上，整个娱乐行业以一种奇的方式变成了软件行业。假设你想制造一个能够播放加密 `DVD` 的 `DVD` 播放器。或者说你想为 `Windows`\
  \ 电脑制作播放 `DVD` 的软件。那么，你必须向电影制片厂申请获得将他们的秘密解密代码放入你的 `DVD` 播放器中的权利。\n\n\n\n\n\n2001\
  \ 年，一位名叫 Dmitry Sklyarov 的俄罗斯代码员访问了拉斯维加斯，在黑客大会 DEF CON 上发表了演讲。他谈论的是 Adobe 公司制作的电子书书中薄弱的\
  \ DRM（数字版权管理）。这是他非常熟悉的话题：为了他的雇主 ElcomSoft，他编写了解密 Adobe 电子书的代码，以便将其转换为 PDF 格式。在俄罗斯，编写这种代码是完全合法的。但一旦\
  \ Sklyarov 进入美国，他就必须遵守美国法律。Adobe 向 FBI 举报了 Sklyarov 将入境美国的消息，FBI 在他完成 DEF CON 演讲后立即将他投入狱禁，指控他“绕过”\
  \ DRM；他面临最高 25 年的监禁和 2,250,000 美元的罚款。\n\n更大的风波围绕着一个仅仅的青少年展开。1999 年，15 岁的挪威人 Jon\
  \ Lech Johansen 与另外两个代码员一起创建了（随后在网上链接了一个副本）开源软件 `DeCSS`。它去除了 DVD 中的 DRM，让你可以在 Linux\
  \ 电脑上观看这些电影。对于代码员来说，这是一件大事：好莱坞公司已经批准了 Mac 和 Windows 的 DVD 播放代码，但没有针对 Linux 机器，而大量的程序员在使用\
  \ Linux。最后，通过 Johansen 的软件，黑客们可以在他们的 Linux 笔记本电脑上看电影了！一些人用其他计算机语言重写了 `DeCSS`，全球的黑客和网站所有者开始热衷在线分享它们，其中包括一个名叫\
  \ Andrew Bunner 的。黑客杂志 *2600* 在网上发布了 `DeCSS` 的源码，并链接到了分发该程序的网站。\n\n随后，法律的重锤降临了。2000\
  \ 年，一个代表电影制的团体根据新法起诉了 *2600* 杂志出版社，声称分发 `DeCSS` 源码是非法的；毕竟，当你运行这段代码时，它就变成了一个绕过 DRM\
  \ 的工具。Andrew Bunner 也被指控分发 `DeCSS` 代码，还有其他几个网站管理员。与此同时，在挪威，美国娱乐业的一份投诉说服了挪威警察，利用挪威法律的一项条款对青少年\
  \ Johansen 进行了审问和起诉。\n\n现在，警报真的响响了，而不仅仅是在密码朋克（cypherpunks）中。各行代码员和黑客都炸开了锅。从他们的观点来看，美国企业正在利用一种新的版权法将编写代码的行为本身犯罪化。“对他们来说，这些诉讼是对他们捣弄权利、编写代码权利的攻击，”密切研究黑客文化的人类学家\
  \ Gabriella Coleman 指道，“那一刻，他们真正开始认为代码即言论，而这些法律是政府在让言论变得非法。他们一直致力于分享、展示自己的代码，而现在他们被告诉这可能是违法的。”\n\
  \n在短期内，电影制片厂输了几场战斗。2001 年，加利福尼亚的一个法院支持 Bunner，认为他拥有发布源码的言论自由权（尽管后来法院判决在这一问题上反复横跳了几年）。Johansen\
  \ 被判无罪。但在其他地方，制片厂获了胜利。另一位法官判定 *2600* 杂志败，该出版物最终决定停止上诉。总的来说，信息已经传出：DRM 是一种强大的武器，公司可以——并且将会——利用这种武器将编程犯罪化。\n\
  \n在与政府、公司和间谍经历了三十年日益增加冲突后，正如 Coleman 指出的，许多黑客发展出一种本能的、易发的“搞死对方”立场也并不意外。似乎几乎每当政府敲门时，都是为了试图让他们利用代码做某些事情犯罪化——从说他们乐于说的语言开始。\n\
  \n“虽然把这仅仅看作另一个新闻陈词调可能很有诱惑力，”她写道，“但这种态度真正地编码在黑客文化的 DNA 之中。”\n\n***\n\n... ... ...\n\
  \n所以，密码朋克经常被称为“偏执狂”。\n\nJen Helsby 确实是这样。她过去经常警告朋友政府正在进行在线监控、追踪手机并收集他们的社交媒体数据。“我不是怎么玩社交媒体的人，”她干巴巴地告诉我。Helsby\
  \ 的怀疑是诚恳的。她的职业生涯始于在芝加哥攻天体物理博士研究暗能量，试图弄清楚宇宙为什么要扩张。和许多天体物理学家一样，她精通编写代码。但她对国际事务感兴趣，并渴望做一些更直接帮助社会的事。于是\
  \ H Helsby 开始利用她的数据处理技能帮助一个芝加哥项目研究城市衰败，然后她协助创立了 Lucy Parsons Lab，该实验室创建免费的开源软件来帮助公民对警察提出投诉。（其中一个带有照片的警察数据库，帮助公民在其他等方面弄清哪位警察骚扰了他们。）她会警告同为活动人士警察和政府机构可能正在监控他们，并举办加密派对来教授“opsec”（操作安全，即行动安全），例如使用\
  \ `Signal` 等加密应用而不是短信。“人们应该拥有自由阅读、自由说话的能力，而当一切都被政府监视时，你就没有了这种能力，而且当他们不喜欢他们看到的内容时，他们可以对你采取行动，”她说，“那个在纽约因为在枪表情旁边放了一个警察表情而被搜查的孩子？那太疯了，简直是疯狂且严酷的。”\n\
  \n尽管如此，她有时还是会被说是偏执狂。“你是个阴谋论者，”她会被这样说——直到 2013 年，爱德华·斯诺登登上头条新闻。\n\n作为 NSA 的一名计算机安全承包商，斯诺登泄露了数千份文件，显示该机构确实在一种惊人的程度上监控普通美国人。斯诺登的揭露震惊了密码朋克，也为他们提供了某种程度的证实。*看，我们不是戴锡纸帽的疯子。这些事情真的在发生。*\n\
  \n“指出文件是有用的，”Helsby 说，“在斯诺登的文件出来后，人们理解得更多。实际上，变得清楚的是，即使是我们中最是最偏执的人，也低估了正在发生的事情。”当我们交谈时，她作为首席代码员开发\
  \ `SecureDrop`。\n\n我在旧金山的 Aaron Swartz 黑客松上遇到了 Helsby。它每秋季举行一次，是一个周末，加密黑客聚集在一起工作，开发他们希望能赋能普通公民的软件。这是为了纪念\
  \ Swartz，他是一位在 26 岁自杀的代码员和活动家，但他那短暂的生命中，他创造了深受黑客社区喜的项目：他帮助编写了 SecureDrop 的第一个版本，共同创立了\
  \ Reddit，共同创造了 RSS——一种让人们在网上制作个性化新闻源的方法——并帮助开创了“知识共享”许可的想法，这是一种黑客式的超级开放的版权形式。（你可以用它在网上自由发布你的照片，例如，并允许任何人修改或编辑——法律条件是*他们*也必须自由发布*那个*修改版本。或者你可以让人们对它做任何事情，没有任何限制；有许多类型的知识共享许可。）Swartz\
  \ 还坚信地认为，学术信息被公司封锁了，而本应对公众免费。这导致了他自己与法律的斗争：2010 年，他编写了一个程序，通过 MIT 的订阅从付费订阅服务 JSTOR\
  \ 下载了近 500 万篇学术期刊文章。在 JSTOR 和 MIT 投诉后，Swartz 将数字副本还给了他们，并且从未在网上分发；但美国司法部显然为了表态，指控\
  \ Swartz 计算机欺诈。面临 100 万美元罚款和数十年的监禁，他自杀了。\n\n\n\n\n“Aaron 因为在图书馆看书太快而受到迫害，”`Brewster\
  \ Kahle 说道，他与 Lisa Rein 共同是 Aaron Swartz 黑客松的创始人，而 Rein 本身也是知识共享组织的创始人。在经历了 80 年代在麻省理工学院（MIT）的黑客时光后，Kahle\
  \ 在 90 年代通过初创公司赚了数百万，随后创立了互联网档案馆（Internet Archive）。该机构每天对互联网的大部分进行备份以留存后世，还扫描从旧书、黑胶唱片到公有领域视频游戏的一切内容，并将其发布到网上：在某种意义上，Swartz\
  \ 的愿景变成了现实。档案馆位于一座已退役的旧金山教堂；在大堂里，黑客们摆放着桌子，在那里埋头编写代码。\n\nHelsby 有一个团队正在调整 `SecureDrop`\
  \ 的界面。另一张桌子正在编写软件，让人们能够建立“分布式”网站，这些网站托管在世界各地的笔记本电脑上，这样就不会被独裁政府轻易下线。22 岁的大学生奥斯斯汀（Austin）正在参与该项目。他在青少年时期通过研究如何在任天堂\
  \ Wii 上安装系统，自学学会了 `GNU/Linux`，因为他父母通常只允许他用家里的电脑做作业。\n\n“当我埋头写代码时，他们就会探头头看进房间，我得快速切换电视频道，好让他们看不到我在做什么，”他说，“噢，嗨，妈，我正在看……呃，一个无聊节目呢！”奥斯汀和其他人一样，将斯诺德登（Snowden）视为一个转折点。这里的年轻程序员成长在一个大众文化对技术阴暗面日益觉醒的时代。这里的许多密码朋克（cypherpunks）都是电视剧《黑客帝国》（*Mr.\
  \ Robot*）的粉丝，在剧中，一个黑客活动小组计划通过加密数据来摧毁一家巨型公司的消费者债务记录。（他们指出，该剧中的黑客技术出奇地真实；情节中包括过 `Raspberry\
  \ Pi` 电脑和 `Android rootkits`。）事实上，在 Aaron Swartz 活动现场，房间里的人打扮就像是《黑客帝国》里的群众演员，到处是染染的头发、皮夹克、多处穿钉，笔记本电脑盖上满了互联网自由“左版”（copyleft）贴纸。“我不觉得我看起来够像黑客了，”奥斯汀带着开玩笑的担忧环顾四周，然后向上拉起连帽衫的帽子。“行了，”坐在他对面对着笔记本电脑敲字的女性说道并笑了起来。\n\
  \n在奥斯汀身后走来走去的是杰斯森·利奥波德（Jason Leopold），他是一名《布兹费克快报》（*BuzzFeed*）的调查记者，正准备进行一场关于信息自由请求的演讲。守在前门附近、拿着手机的是切尔西娅·曼宁（Chelsea\
  \ Manning），这位著名的陆军情报分析师曾因泄露军事活动记录和外交电报而入狱，这些电报助推了阿拉伯之春的爆发，她在这里是为了向黑客们发表一场动员演讲。黑客世界的政治光谱宽得惊人。正如科尔曼（Coleman）指出的，这种文化的共同特征——对技艺的热爱和知识的分享、对自由软件的支持、对政府限制代码的反感——让人们为了共同项目聚在一起，而这些人在其他方面可能几乎没有共识。共同编写一段加密或开源代码是他们所有人都能团结的理想主义目标。“务实的判断往往胜过意识形态判断，”科尔曼写道，“导致某些情况下，比如一个反资本主义无政府主义者可能与一个自由派社会民主者合作，而没有任何摩擦或派系内斗斗。”\n\
  \n黑客松的下午，我遇到了斯蒂夫·菲利普斯（Steve Phillips）；他带着一群志愿者到达，这些程序员都已开始帮助构建 `Pursuance` 系统。下午，他穿着一件\
  \ `WikiLeaks` 的 T 恤上档案馆礼堂的讲台，展示他们构建的成果。那里有一套完整软件的雏形，活动人士可以在此创建待办事项、设定任务、委派工作。正如他向观众解释的那样，有大量的论坛供人们交流，但很少有工具能帮助他们完成任务；他解释道，`Pursuance`\
  \ 的目标就是帮助解决这个问题。“我观察到一些在线活动人士的操作时，发现有太多的手动工作本是可以自动化的，”菲利普斯在展示软件时干脆利落地说道。在他上方的屏幕上，巴雷特·布朗（Barrett\
  \ Brown）通过 Skype 接入，用他轻微的南方口音谈论 `Pursuance` 的哲学，此时他正坐在客厅里重重地吸着电子烟。\n\n之后，小组前往一家泰餐馆吃晚餐。“那太让人紧张了——在我们上台前十分钟，还在往数据库里填东西，”马蒂·伊（Marty\
  \ Yee）说道，他是一个年轻程序员，目前全职工作于 `Behive`，那是一个小型社交网络应用。和大多数软件开发一样，让演示程序运行起来是一场最后时刻的恐慌冲刺。菲利普斯归功于伊让软件看起来像模样了，他认为这对于让活动人士喜欢使用\
  \ `Pursuance` 至关重要，他一边说，一边翻看菜单寻找符合他严苛饮食计划的食物。（他找到了糙米。）“三周前，我给了马蒂一堆我糟糕的线框图，他把它们变成了魔法。”\n\
  \n来自田纳西锡的 21 岁女性安娜莉丝·伯克哈特（Annalise Burkhart）已签署聘书担任运营总监。她希望将 `Pursuance` 带到中东活动人士手中。她在大学期间辅修阿拉伯语，凭借这些、YouTube\
  \ 视频、一位叙利亚导师以及在社区里翻译的练习，她变得非常流利；她喜欢这种留着银色挑染长发的女孩突然蹦出当地语言时产生的认知失调。“当我在电话里突然说阿拉伯语，人们会觉得：‘什么？’”\n\
  \n穿着一件印有“支持你的当地帮派”T 恤的巴恩肯（Bahnken）提到他最近开始读的一位安全作家，这位作家从说唱歌词中挖掘隐私思想。“他分析 B.I.G. 的歌词，那其实是很棒的战术安全（opsec）建议。”\n\
  \n“像什么样的？”利利普斯问，“建议是什么？”\n\n“比如比：闭嘴滚蛋！”巴恩肯笑着说，“人一说话就会被抓到。”\n\n黑客松中没有人在做任何违法的事。他们正在开发的工具正如他们所言，旨在保护弱势群体。但与执法部门之间的历史性紧张关系从未消失，因为警察和间谍机构不断指出，为守法公民设计的隐私工具不可避免地会被犯罪分子利用。\n\
  \n不过注意，警察和间谍力量并不是错了。考虑 `Tor`：它的设计初衷是加密网页浏览，以便外部人员不知道你正在访问哪些网站。这对于举报者、记者、博客作者以及任何想要在线隐私的普通人来说都是无价之。但它也可以被用于建立所谓的暗网——在那些地方，无法知道网站托管在哪里，也不知道是谁在托管。这对于犯罪来说太太极了。在线毒贩因此喜爱\
  \ `Tor`，并经常建立基于 Tor 的暗网，例如著名的丝绸之路（Silk Road）在线商店，人们可以在那里购买毒品和武器。恐怖组织 ISIS 也写过一份指南，描述如何使用\
  \ `Tor` 来规避审查。诚然，`Tor` 的犯罪用途仅占其总用途的极小部分。但纯从事实陈述的角度来看，加密技术在保护自由战士斗士的同时，同样保护了恶徒。\n\
  \n\n\n密码朋克（cypherpunks）们都清楚这一点。大多数人对此完全认可；自由意味着不仅可以做好事，也有权做坏事。他们这种直言不讳意愿可能会令人震惊，或让人耳目一新，取决于你的政治观点。在一次安全会议的小组讨论中，加密货币黑客莫西·马林斯派克（Moxie\
  \ Marlinspike）——`Signal` 消息应用的创建者——认为，让执法偶尔变得容易一些，是确保每个人隐私安全的的一种可以接受的代价。\n\n“我实际上认为执法应该是困难的。而且我认为打破法律在实际上应该是可能的，”他说。\n\
  \n或者，正如他自己在博客中所写的那样，只有通过违反法律，公民才能发现某些法律是荒谬的。“如果没人用过大麻，人们怎么能决定大麻应该是合法的？”他写道，“州又怎么决定允许同性婚姻呢？”\n\
  \n***\n\n事实上，黑客的好奇心可以让他们很容易触犯法律，仅仅因为计算机控制着太多的东西。这正是让 80 年代和 90 年代所有玩弄调制解调器的青少年陷入麻烦的原因。在当时，那些被入侵的公司会表现得惊慌失措——*天呐，我们被黑客了！快叫网络警察！*但最终，一些更有远见的科技公司和美国企业界的一部分意识到，他们可以“驯化”喜欢闯入的黑客。既然他们反正要闯，为什么不雇佣他们来做呢？然后付钱让他们准确地告诉你他们是如何进去的，这样你就能堵住那个漏洞。\n\
  \n科技行业由此创造了渗透测试员（penetration tester，或简称“pentester”）这一职业。如果你看过 1992 年的电影《黑客》（`Sneakers`），那是渗透测试员首次出现在银幕上——伯特·雷德福（Robert\
  \ Redford）带领了一支受雇闯入银行的信息安全战士团。现如今，软件公司也也设立了“漏洞赏金计划”，向任何发现其系统漏洞并告诉他们的人支付奖金。\n\n正如刻板印象可能暗示的那样，许多渗透测试员最初都是闯入系统的青少年，仅仅是为了好玩，有时是他们自己的系统，有时是别人的。“作为一个\
  \ 17 岁的孩子，要理解伦理真的太难了，”乔伯特·阿布玛（Jobert Abma）对我告诉我。他联合创立了 `HackerOne`，这是一家渗透测试公司，利用全球的自由黑客对其客户的网站和软件进行攻防。阿布玛在荷兰长大，在那里他和一个朋友会建立网站并互相挑战破解这些网站。最终，他们也开始检查各种公司的网站，看看自己是否能找到弱点。\n\
  \n“并没有恶意，”他补充道。在他们的高中毕业典上，他们入侵了舞台上方的视频显示器，插入了关于各种同学的笑话。后来，他们决定将自己的入侵技能转化为门生意——拨打公司电话，请求许可渗透他们的网站，并承诺如果他们进不去就给对方送一个蛋糕。“我们从没给过蛋糕，”他指出。换句话说，那些对钻探计算机漏洞产生痴迷的孩子倾向于游走在灰色地带。这里的诀窍在于学习到足够的知识，让他们的技能在合法市场上变得有价值，同时又不会触怒任何想拿他们杀鸡儆猴的过头权威人物。\n\
  \n这个灰色地带领域在拉斯维加斯的 `DEF CON` 上得到了充分的展示。这是一场年度黑客客大会，是渗透测试员、信息安全专家和大学计算机安全研究人员的最爱。它就像是一场数字入侵的盛会，有创新渗透技术的演示，每个人都热切地分享他们最新的想法。当我\
  \ 2017 年参加时，那些黑客手段非常精妙：一位编码员展示了破解高加密 `Bitcoin` 钱包的技巧。另一个人展示了他发现的渗透风力发电场控制器的方法——他指出，这些方法可以通过循环开启和关闭刹车（“死亡硬停止攻击”）来*摧毁*风力涡轮机，或者通过关闭它直到风力发电场支付贿赂来勒索赎金（“这家公司每停机一小时就会损失\
  \ 10,000 到 3,000 美元不等，”他说，“伙计们，那可是一大笔钱”）。演讲之外，黑客们在走廊里穿梭，向彼此展示巧妙的渗透设备——有一个人围在一个围、在其震动刷头上安装了磁铁的\
  \ Sonicare 牙刷周围，大家赞叹不已。“你可以让它在芯片上方移动，诱导产生一种通常不会产生的电荷，看看是否能将其击入不同的状态，”他一边说，一边对着一台\
  \ `Raspberry Pi` 微型计算机实验性地挥动，“而且由于我是《博士博士》的大粉丝，我当然想要一把声波起笔。”在他肩膀后面，一个穿着着“想坏事，做好事”T\
  \ 恤的壮汉在窥视。另一个黑客戴着一顶真正的锡箔帽。\n\n`DEF CON` 以拥有几十场类奥林匹式的黑客挑战而闻名——这些系统专门设计用来测试黑客是否能破解。当我\
  \ 2017 年参加时，整个小房子挤满了物联网设备，如智能恒温器和连接网络的车库门打开器。一组来自南方的渗透测试员组成了一个团队，正忙碌地破解。“有人有电源吗？我正在破解密码，我的笔记本电脑快烧掉了，”其中一人大喊道。另一个人入侵了报警系统，正在翻找打开的文件夹寻找密码。\n\
  \n“人们重复使用密码——这就是金钥匙，当你得到它时，整个城堡就崩塌了，”团队成员之一多里·克拉克（Dori Clark）对我说道。克拉克在学习计算机科学并在金融服务公司担任编码员后进入了渗透测试领域。“我不得不写\
  \ `COBOL`！我编辑的代码比我的年龄都老；那是 80 年代的代码，”她补充道。她在军方工作过，有一天她遇到了渗透测试团队并被迷住了。现在她为 `Walmart`\
  \ 提供渗透测试服务，并在空闲时间从 eBay 上购买奇特的旧硬件来练习入侵。“你必须热爱这个才能做它，必须在孩子睡觉后做，”她说。她的女儿正慢慢大了，她打算在女儿学习写作时教她编程。但克拉克几乎对向女儿介绍黑客技术感到忌讳。“我给她所有的技能吗？因为一个女孩拥有了这些能力就会破解她朋友的\
  \ `Facebook` 看看她在说什么，”她说，并哼了一声。\n\n\n\n\n## 投票机黑客村\n\n这种顿悟的一个尤为严峻的例子发生在 DEF CON\
  \ 的一个被称为“投票机黑客村”的房间里。一个由计算机科学家组成的团队——包括 Matt Blaze，二十多年前他曾单枪之力摧毁了 `Clipper` 芯片——购买了数十台曾在在美国选中使用中使用、后被除役的机器。目标是：看看人们能多容易地破解它们并操纵选票。Blaze\
  \ 和其他专家一直怀疑这些机器的安全性非常糟糕，但直到最近，法律上还不容易允许对它们内部进行探测。这些机器受到《数字千年版权法案》的保护，因此，在没有获得投票机公司许可的情况下，绕过该法律并查看机器的工作原理显然是违法的，而这些公司并不愿意向一群随机的黑客授予这种许可。但政府最近决定，投票机对国家来说足够重要，因此授予了一项临时豁免。这意味着\
  \ DEF CON 的黑客们可以肆无忌惮地进行研究，并向世界展示他们的发现。\n\n“我们鼓励你们去做一些事，如果你们在选举当天做这些事，你们可能会被捕，”Blaze\
  \ 对满屋的黑客说道，此时他们开始拆解这些机器。\n\n花费的时间少得惊人：丹麦计算机科学家 Carsten Schürmann 打开他的笔记本电脑，启动了 `Metasploit`——一种用于入侵系统的软件——在几分钟内，他就通过其未安全的\
  \ wi-fi 接管了一台投票机。另一位黑客发现另一台机器上的 `USB` 端口没有被锁定，如果你插上键盘就可以获得控制权。每隔一段时间，房间的一个角落就会爆发出一阵笑声，因为当一名测试人员在翻找某台机器的代码时，会发现它的登录凭据糟糕得令人发笑。“用户名是默认的，密码是\
  \ . . . ‘admin’，”一个留着金金色高马尾的程序员说道，他盯着笔记本电脑屏幕，然后戏剧性地拍了一下额头。\n\n## 人类这一薄弱环节\n\n从技术上说，负责选举的人应该在某个时候更改密码。但他们从未这样做。这是信息安全专家所面临的另一个巨大而阴暗的知识：人类是任何系统中的薄弱环节。安全黑客不断告诉他们公司的员工更改密码、更新软件；但我们普通人总是忽视他们。代码可能是缺陷的，但用户也是如此。从事安全工作意味着要面对一项不讨好人的任务：不断且正确地感知网络世界中那些瞪大眼的危险，结果你的警告却被世界漠不在心地忽略。你是一个在荒漠中哀嚎的先知，无人倾听。\n\
  \n这会让安全编码员对他们工作旁边的人产生极度的愤世嫉俗。*“我被一群傻瓜和白痴包围着；如果这些蠢货停止点击邮件里的链接，一切都会是安全的。”*“这是工作的风险之一，”一位\
  \ DEF CON 的参与者告诉我，他在自己的公司负责安全，当时正在拉斯维加斯的一家酒吧里边喝饮料边对我说，“我真的不得不站在副总裁的肩膀后面，强迫他们更改密码。人们太粗心了，没有人遵循最佳实践。然后当出现问题时，我就是那个被拉过去被痛斥一顿的人。”难怪，他苦苦地说道，自己是个厌世之者。\n\
  \n“对其他人来说，”正如信息安全程序员 Christian Ternus 在文章中承认的那样，“我们是混蛋。”\n\n## 网络犯罪和 WannaCry 的兴起\n\
  \n不过，信息安全领域的人们感到疑虑是有根据的。那里确实有大群的黑客，正努力入侵系统以牟利。事实上，由于营利性网络犯罪的世界正变得异常巨大，因为恶意软件在网上变得更容易购买，甚至可以租用。\n\
  \n网络攻击的代价可能是巨大的，正如 2017 年的 `WannaCry` 恶意软件所示。它是一种“勒索软件”：一旦它感染了计算机，就会加密所有内容，让所有者无法读取或使用它们。然后它会弹出一个设计精美的小文本框解释说：“我们保证你可以安全、方便地恢复所有文件。但你的时间不够了。”这种语言显得很欢快，尽管略显生硬——有人怀疑这可能是中文母语者用英语写作的结果。而且界面非常流畅。如今，勒索软件的总体目标是看起来尽可能专业；有些甚至设有了热线，帮助受害者了解如何获取\
  \ `Bitcoin`，即支付赎金的主要货币。似乎，即使是恶意软件攻击，也试图效仿硅谷初创公司那种精干的格调。（`WannaCry` 甚至有一项人道的公司政策：“我们将为那些穷到无法在六个月内支付的用户举办免费活动。”）\n\
  \n`WannaCry` 造成了破坏，关闭了 150 多个国家的 200,000 台计算机，俄罗斯、乌克兰和印度受灾尤为严重。然而，最大的混乱发生在英国国家医疗服务系统的医院，那里的\
  \ `MRI` 扫描仪、计算机甚至血库冰箱等医疗设备受到了攻击。由于工作人员转用纸笔记录，数千计的手术和预约被推迟；据一项估计，全球总损失达 40 亿美元。祸首是谁？许多安全专家怀疑是与朝鲜有关的黑客组织。\n\
  \n## 杀毒\n\n与此同时，在英国的一个农村地区，Marcus Hutchins 坐在父母家的卧室里，试图推断如何停止它。他是洛杉矶安全公司 `Kryptos\
  \ Logic` 的白帽研究人员。Hutchins 的专长是对恶意软件进行逆向工程，试图弄清楚它是如何构建的以及作用。Hutchins 是一个性格温和的家伙，留着一头卷，他注意到了一些有趣的现象：每个\
  \ `WannaCry` 都在尝试访问一个不存在的 URL：`iuqerfsod9ifaposjhgosurijfaewwera.com`。为什么？他不确定。但也许如果他注册那个域名并建立一个网站，所有的\
  \ `WannaCry` 都会一直访问它。这可以让他追踪到有多少 `WannaCry` 存在，以及它们扩散到了哪里。于是他去一家 URL 注册服务处，以 10.69\
  \ 美元设置了该 URL。\n\n效果比他预期的还要好：它阻止了 `WannaCry`。\n\n事实证明这个 URL 的作用就像一个“开关”。一旦它存在，所有的\
  \ `WannaCry` 都停止了。“这一切在几分钟内就结束了，”他告诉我，对这种崩溃的速度感到惊叹。也许恶意软件作者包含了一个开关，以防失去对扩散的控制——万防情况太糟，”Hutchins\
  \ 幽默地说。但无论如何，他阻止了巨大的损失。\n\n\n\n\n\n在信息安全领域，许多人曾涉足灰色地带活动，正如我多年来与他们交流时发现的那样；在充满好奇的青少年时期，他们曾潜伏在恶意软件网站，下载并尝试使用、修改或编写自己的程序。也许是为了利润，也可能只是为了在回到恶意软件作者论坛吹嘘时，展示一下他们疯狂的技艺。无论如何，这都是他们的学习方式：学习恶意软件领域及其复杂人物的一种极佳方式，就是参与其中。21\
  \ 世纪 00 年代中期，当我走遍欧洲，采访那些编写病毒和蠕虫代码的人时，许多人是是在小镇里无聊得要命的聪明青少年，他们最亲的朋友只是论坛上的昵号。在设计出一段新代码后，他们会分享在贴板上，而且经常也会提醒\
  \ `Microsoft` 或任何被其恶意软件利用漏洞的科技公司，以便公司进行修补。他们并没有恶意，也从没有自己将恶意软件发布到“野外”。但他们也喜欢分享代码，所以这些代码很容易被他人在任何地方使用。\n\
  \n如今，这些无聊且聪明的青少年可能会创建出并出售——或租赁——恶意软件来获利。访问专门从事恶意软件的黑暗网站，你会看到正在出售的许多“钓鱼工具包”，这些工具包可以生成发送给目标的链接，伪装成\
  \ `Instagram` 的“密码重置”请求；如果对方点击，恶意软件就会进行“情报收集”，悄悄窃取电子邮件或文档并将其寄回给你。（“鱼叉式钓鱼”是一种更巧妙的策略：攻击者向你发送一封钓鱼邮件，伪装成来自已知且信赖的朋友。安全公司\
  \ `Symantec` 发现这是最常见的攻击策略，被近四分之三的所有入侵小组使用。）勒索软件也是如此，任何人可以在黑暗网上花费几百美元获取它；它主要用于小额犯罪，2017\
  \ 年，它感染小公司并平均勒索的金额略高于 500 美元。僵尸网络也是如此，鉴于安全性极差的智能家居设备爆炸，作恶之徒发现现在创建这些僵尸网络变得越来越容易——恒温器、冰箱、咖啡机，其中大多数都连接在线，且密码保护非常糟糕，或者根本没有保护。\n\
  \n这就是 `Mirai` 僵尸网络变得如此巨大的原因。它是三个年轻人的产物——其中包括当时年 20 岁的前 `Rutgers` 计算机科学学生 `Paras\
  \ Jha`。`Jha` 和他的僵尸农场伙伴是 `Minecraft` 的狂热玩家；他们通过感染成千上万物联网设备创建了 `Mirai`，然后利用它们让各种 `Minecraft`\
  \ 服务器离线，有时试图以类似于黑手党保护费的方式向所有者勒索。他们还租用他们的僵尸农场进行点击欺诈计划：例如，每天给他们 1000 美元，他们就会让他们培养的设备点击你网站上的每个页面或广告，从而从广告商那里为你赚取巨额利润，而广告商会天真地认为他们的广告非常受欢迎。他们的点击欺诈业务为他们赚了\
  \ 18 万美元。有时，他们只是用自己的僵尸网络攻击他们不喜欢的人，用流量洪冲导致对方的网站崩溃。\n\n在论坛帖子中，`Jha` 表现像一个情绪化化、虚无主义的青少年，吹嘘自己的编程技巧。当被\
  \ `Jha` 攻击过的网站者解释这些数字攻击会导致现实生活中的后果时，他用愤世嫉俗的态度回答道：“噢，我很久以前就不在乎别人了，”他写道，“我的生活经验一直是被别人坑，要么是我坑别人。”法律最终追上了他。调查恶意软件世界的知名记者\
  \ `Brian Krebs` 花费了几个月时间耐心挖掘出 `Jha` 的身份（像所有恶意软件作者一样，他将身份隐藏得非常深）。在当局逮捕 `Jha` 后，他\
  \ `Jha` 和他的 `Mirai` 伙伴们被判处五年缓刑和 62.5 周的社区服务；正如判决备忘录所提到的，恰巧的是，他们已经反供，并开始协助 `FBI`\
  \ 在“网络犯罪和网络安全事务”上提供帮助。白帽和黑帽之间的界限确实包含很多灰色地带。\n\n事实证明，`Hutchins` 被指控有自己的灰色帽身份。起初，在阻止\
  \ `WannaCry` 之后，他被誉为经典的白帽信息安全黑客。他去拉斯维加斯参加了他的首届 `DEF CON`，在那里被仰慕者围着要求合影：*嘿，是那个停止\
  \ WannaCry 的家伙！* 但当他去机场飞回英国时，他被 `FBI` 探员捕获——并因创建恶意软件被捕。几天前，一个大陪团指控他创建并出售了名为 `Kronos`\
  \ 的恶意软件，该软件会窃取银行详情。这就像是一个警察局侦探因涉嫌私下经营犯罪计划而被捕一样。\n\n当 `Hutchins` 被保释释放时，信息安全界充满了各种理论。有人认为他可能有罪；安全记者\
  \ `Krebs` 报道了证据，这些证据将 `Hutchins` 与他青少年时期发布和出售的几件规模较小、较不成功的恶意软件联系在一起。信息安全社区的其他人则为他辩护：见鬼，*许多*白帽黑客在青少年时期都摆弄过恶意软件或入侵。那是学习的方式。至于他自己，`Hutchins`\
  \ 对 `Kronos` 的指控辩认无罪，在我写这篇文章时，案件尚未进入审判。\n\n他讽刺地同意无聊的青少年确实会造成混乱。“对于恶意软件，”他笑着说，“要么是无聊的青少年，要么是有组织的网络犯罪——之间没有其他。”\n\
  \n* * *\n\n尽管这些孩子能造成混乱，但运行僵尸网络和编写恶意软件的人并不一定是大鱼。现如今，真正的大鱼更多是在线协作的影子代码小组。有些纯粹是为了利润，比如俄罗斯程序员\
  \ `Evgeniy Mikhailovich Bogachev`，他创建了一个针对银行的僵尸网络，获利了约 1 亿美元。他是目前 `FBI` 最通名通缉的黑客之一。\n\
  \n然而，他目前正自由地住在俄罗斯的安帕。这是因为俄罗斯政府只选择性地执行网络法律。他们的态度似乎是，只要网络犯罪分子不针对俄罗斯人就可以。事实上，如果一个恶意软件作者创建一个感染了其他国家大量政府计算机的僵尸网络——这可能会让他们成为宝贵的资产。所以网络犯罪分子可能会被告知：*嘿，我们可以逮捕你，除非你与我们合作*。通过这种方式，国家可以获得一些珍贵的攻击资产。这似乎确实在\
  \ `Bogachev` 身上发生了。\n\n\n\n\n如今的大型网络犯罪集团本身可能并非由国家政府或其间谍机构直接运营，但它们往往至少似乎与这些人保持着交流。当俄罗斯黑客组织\
  \ `Fancy Bear` 通过那种屡试不败的钓鱼技巧——让 `John Podesta` 点击了一个恶意链接——渗透了民主国家委员会时，大量的 `DNC`\
  \ 邮件很快就出现在俄罗斯情报圈中，随后出现在 `WikiLeaks` 和其他在线网站上。与此同时，中国政府背景的黑客正忙于渗透美国公司和政府机构：国防部每天拦截\
  \ 3600 万次钓鱼攻击。在每一个独裁国家，政府资助的黑客正忙于对公民社会倡者和亲自由组织发起攻击——在异见人士身上安装间谍软件以便更好地打击他们。`Citizen\
  \ Lab` 的工作发现，针对西藏活动人士和人道主义者的间谍活动活动非常广泛，这只是其中一个例子。当然，美国也有自己的政府雇员黑客军团，正忙于开发恶意软件和漏洞来攻击其他国家。事实上，`WannaCry`\
  \ 利用的漏洞最初是由 `NSA` 开发的，可能是作为他们计划对另一个国家的策略——但在 `NSA` 自身遭到黑客攻击后，被发布到了网上。\n\n在数字世界中，政府越来越想要监控并收集我们在网上所做的每一个细节。这对公民社会产生了巨大且令人不安的影响。难怪在该领域工作的黑客最终会与法律发生如此频繁的冲突。`cypherpunks`\
  \ 有偏被害症，这确实——但我们其他人可能也应该同样如此。\n\n# 第 9 章：黄瓜、天网与人工智能的崛起\n\n一切始于中国古代棋类`围棋`，结束于黄瓜。\n\
  \n在 2015 年秋季，我们经历了另一个类似于“天网”的时刻，一种人工智能的形式彻底击败了人类。在这种情况下，涉及到“AlphaGo”——由 `Google`\
  \ 帝国子公司 `DeepMind` 设计的软件——它下了一场极其精彩的围棋比赛。为了测试他们的人工智能，`DeepMind` 让它与欧洲围棋冠军范辉对战。这毫无悬念：电脑\
  \ 5 局中了 5 局。几个月后，`AlphaGo` 对战了更顶级的棋手李世石——`AlphaGo` 再次占据主导地位，4 比 1 胜。\n\n`AlphaGo`\
  \ 在这项游戏上如此出色，部分是因为它结合了“深度学习”，这是一种热门的新神经网络技术，让计算机能够分析数百万局围棋，并自主构建起一个关于游戏运作方式的模型；将任何带有围棋位置的棋盘输入模型，它就可以结合更传统的“蒙特卡洛”算法，预测未来的走法。之前让围棋实现人工智能的尝试要粗糙得多——创造者会尝试开发搜索算法，来排名并挑选最可能的未来走法。但那种更传统的编程形式在围棋上效果并不好，在围棋游戏中，可能性的分支路径远超象棋。宇宙中可能的围棋局比宇宙中的原子数量还要得多。\n\
  \n所以，`AlphaGo` 的创造者没有走那条路。他们没有像传统程序员那样坐在那里编写逻辑规则。相反，深度学习让 `AlphaGo` 分析了来自现有对局的 3000\
  \ 万个位置，并建立了一个极其复杂的游戏模型——这个模型如此密集且复杂，连创造者自己都无法准确地告诉你它是如何工作的。\n\n但它确实起作用了。`AlphaGo`\
  \ 是这项游戏的大师，尽管是以一种有些怪异的方式。它有时会下出人类从未执行过的招式。在与李世石的第二局比赛中，第 37 步，`AlphaGo` 的出法最初让观察比赛的围棋专家们非常困惑，正如\
  \ `Wired` 报道的消息。计算机放弃了一块棋，将目标转移到棋盘上完全不同的部分。\n\n“这是一次非常惊喜的棋，”一位围棋专家观察道。“我以为这是一个失误，”另一人说。但在思考了策略后，他们意识到了：噢我的天，那是一着绝妙的棋！“太美了，”刚从\
  \ `AlphaGo` 败北中归来的范辉赞叹道。“这不是人类的棋法。我从没见过人类下过这一招。”当 `AlphaGo` 下出第 37 招时，李世石本人也震惊了。他从桌旁起身离开房间，十五分钟没有回来。第二天，在输掉之后，李世石承认那手棋动摇了他。“昨天，我很惊讶，”他说，“但今天，我无言以对。”很快，报纸和网站上充满了关于\
  \ `AlphaGo` 的惊心动魄的故事。\n\n深度学习正成为热门的新科技趋势。它对于普通程序员来说，也变得越来越容易尝试。\n\n这是因为，在 `Google`\
  \ 向世界推出 `AlphaGo` 的同时，它还发布了 `TensorFlow`，这是一个免费软件，极大地简化了设置你自己的神经网络的任务。假设你想创建一个自己的系统来识别公司员工的脸部，这样大门就只为他们打开。如果你能获得每位员工的许多不同照片，你就可以训练一个\
  \ `TensorFlow` 神经网络来自动识别每一个人，并通过你正门口的摄像头运行它。在短短几个月内，世界各地的程序员都下载了 `TensorFlow` 并对其进行摆弄。\n\
  \n其中之一是小池诚（Makoto Koike），一位 37 岁的日本计算机工程师。他曾为该国的汽车行业设计了多年软件。但他的父母——是日本南部沿海小镇香濑（Kosai）的农民——年纪越来越大了，所以他回到家陪伴他们，并在农场帮忙。\n\
  \n老小池夫妇是种黄瓜的。在日本，消费者非常看重“带刺”的黄瓜，这些黄瓜要笔直、颜色鲜艳，且表面仍留有许多刺。结果，小池的母亲每天要花费长达八小时筛选最新的收获，将它们分成不同的类别：顶级的给批发商，次优的给较小的蔬菜摊位。共有九种不同的类别，小池发现要看出差异如此困难，他感到惊讶。他花了几周时间学习如何自己这样做。“在最忙的季节，你不能只雇兼职。我自己只学会了如何好好分类黄瓜，”小池观察道。\n\
  \n小池读过关于 `AlphaGo` 的报道，这让他对深度学习产生了兴趣：呵，这些机器学习的东西变得非常厉害。然后他听说了 `TensorFlow`，灵光一闪。也许他可以制作自己的\
  \ AI 来分类黄瓜？\n\n第一步：拍摄成千上万张不同黄瓜的照片。小池知道他需要一个庞大的数据集来训练神经网络，让它学习弯曲变形的黄瓜（坏的）和细长直的黄瓜（好的）之间的区别。他大约需要三天时间训练一个模型，然后通过向它展示新采摘的黄瓜来测试，看它是否能识别好坏。然后他反复调整并重新训练模型，让它变得更好。几周后，他的\
  \ AI 能以 80% 的准确率识别优等黄瓜，他告诉我。\n\n然后他一得牛毛，制造了一个机器人来自动分类黄瓜。它有文件柜那么大；小池把黄瓜放入机器人的顶部，那里三台摄像头会从上方、侧面和一端对其拍摄照片。一旦\
  \ AI 得出了判决，它就会将黄瓜弹射到传送带上，机械手臂会将蔬菜推入相应的箱子里。\n\n\n\n\n小池的父母觉得很有趣，但并没有他们那么印象深刻。他们是黄瓜分拣领域的资深专家，比他们儿子快得多，因此\
  \ 80% 的准确率还不足以完全取代他们的人工判断。（他的母亲告诉他：“还需要改进。”）但小池继续像水牛一样勤恳地工作。他想，如果他能不断为系统提供更好的数据——具有更高分辨率的照片——并开始使用超快速云计算机进行分析，而不是用他那台运行较慢的电脑，他最终可能会让机器人变得像他妈妈一样出色。他还在研究另一种神经网络，可以自动识别挂在藤蔓上的黄瓜。“我想制造出一种自动收割机器人，”他告诉我。他向我展示了一段该神经网络运行的视频：当他拿着相机走在黄瓜田里时，你可以看到屏幕上的\
  \ AI 正在每根黄瓜周围画出红色的矩形。\n\n他的梦想是让这些任务精进到这种程度，使他的机器人能够真正实现自动化，并表现得像他的父母一样好。他说，这对他们的农场很有处；他们就能解放出来去做一些计算机目前无法做的事情——例如更具创造性的黄瓜护理工作，以及通过园艺实验让黄瓜变得更加清脆、汁水充足。\n\
  \n“农民想要专注于并把时间花在种植美味的蔬菜上，”当 Google 发现他的 `TensorFlow` 实验并给他打电话时他说。“我想在从父母手中接手农场业务之前，先把分拣任务自动化。”\n\
  \n多年来，程序员们一直在编写程序来执行我们的重复性动作。现在，他们正在让我们的重复性思考自动化。\n\n## 人工智能的梦想\n\n自从我们拥有计算机以来，程序员们一直梦想创造出像人类一样行为软件。当你处理表现出这种栩如生的行为——能够执行“思考”任务的机器时，这可能是不可避免的。你可能会开始好奇：AI\
  \ 能够像我们一样学习吗？如果继续给系统输入更好的数据——具有更高分辨率的照片——并开始使用超快速云计算机进行分析，而不是用他那台运行较慢的电脑，他最终可能会让机器人变得像他妈妈一样出色。他还在研究另一种神经网络，可以自动识别挂在藤蔓上的黄瓜。\n\
  \n小池，他的梦想是让这些任务精进到这种程度，使他的机器人能够真正实现自动化，并表现得像他的父母一样好。他说，这对他们的农场很有处；他们就能解放出来去做一些计算机目前无法做的事情——例如更具创造性的黄瓜护理工作，以及通过园艺实验让黄瓜变得更加清脆、汁水充足。\n\
