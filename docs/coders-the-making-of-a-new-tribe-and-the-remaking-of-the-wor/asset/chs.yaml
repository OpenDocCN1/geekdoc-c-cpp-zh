- "# 程序员：新部落的崛起与世界的重塑\n\n\n![](img/9780735220577_cover.jpg)\n\n![Coders 封面](img/9780735220577_cover.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n致 Emily, Gabriel, Zev 以及我的母亲\n\n\n\n![Coders\
  \ 封面](img/9780735220577_cover.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
