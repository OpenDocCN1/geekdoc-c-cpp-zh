  \n[content]\n小池的父母觉得很有趣，但并没有他们那么印象深刻。他们是黄瓜分拣领域的资深专家，比他们儿子快得多，因此 80% 的准确率还不足以完全取代他们的人工判断。（他的母亲告诉他：“还需要改进。”）但小池继续像水牛一样勤恳地工作。他想，如果他能不断为系统提供更好的数据——具有更高分辨率的照片——并开始使用超快速云计算机进行分析，而不是用他那台运行较慢的电脑，他最终可能会让机器人变得像他妈妈一样出色。他还在研究另一种神经网络，可以自动识别挂在藤蔓上的黄瓜。“我想制造出一种自动收割机器人，”他告诉我。他向我展示了一段该神经网络运行的视频：当他拿着相机走在黄瓜田里时，你可以看到屏幕上的\
