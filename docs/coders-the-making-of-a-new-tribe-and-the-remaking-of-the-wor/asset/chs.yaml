  \n多年来，程序员们一直在编写程序来执行我们的重复性动作。现在，他们正在让我们的重复性思考自动化。\n\n## 人工智能的梦想\n\n自从我们拥有计算机以来，程序员们一直梦想创造出像人类一样行为的软件。当你处理表现出这种栩如生的行为——能够执行“思考”任务的机器时，这可能是不可避免的。你可能会开始好奇：AI\
  \ 能够像我们一样学习吗？如果继续给系统输入更好的数据——具有更高分辨率的照片——并开始使用超快速云计算机进行分析，而不是用他那台运行较慢的电脑，他最终可能会让机器人变得像他妈妈一样出色。……（此处后续内容因原文高度重复已去重处理）\n\
  \n\n\n尽管如此，这些技巧有时会产生惊叹的预见性。例如，我在 2003 年遇到的一家巴塞罗纳科技公司曾将数百万首流行歌曲拆解为各种组件：它们的每分钟拍数（BPM）、是大调还是小调等。然后，他们使用机器学习算法将这些热门歌曲聚类。这在实际上产生了一台热门预测机器。他们可以获取任何首新歌，查看它在数学上是否与之前的榜单冠军相似。\n\
  \n这种效果出人意料地好。他们声名大噪是因为分析了当时还未成名的歌手诺拉·琼斯（Norah Jones）的首张专辑，并预测其中几乎每条目都会成为现象级金曲。\n\
  \n***\n\n## 神经网络的兴起\n\n尽管如此，有一种人工智能形式显得诡异地像人。它似乎为计算机提供了一种能够真正自主学习的方法。\n\n那就是神经网络。这些系统是仿照人类大脑的工作方式进行建模的。神经网络会有几“层”；每一层由一组节点组成。就像大脑中的神经元相互连接一样，软件中的节点也是相互连接的。\n\
  \n你教神经网络工作的方法就是训练它。假设你想创建一个可以识别向日葵照片的神经网络。你首先会收集大量的向日葵数字照片。第一层由图片中的各种像素触发，其神经元会发生发射或不发射，并将这些信号发送到下一层。该层会做同样的事情：每个神经元都会决定是否做出反应并将它的信号——发射或不发射——发送到*下一*层。以此此类推。在某种意义上，它会缓慢地将决策——发射或不发射——提炼为简单的“是”或“否”。当它到达最后的一层时，只有一个决策：是还是否？它是向日葵吗？\n\
  \n但这种奇特的结构实际上是如何知道像素代表的是向日葵的呢？起初，它并不知道。每个神经元只是盲目地猜测。神经网络对向日葵长什么样一无知。但在它给出猜测——*是，是向日葵！不，不是向日葵！*——之后，你检查猜测是否正确。然后你将这些信息（*错！对！）*反馈回神经网络，这个过程被称为“反向传播”。神经网络软件利用这些信息来加强或削弱神经元之间的修正。对正确猜测做出贡献的神经元会被加强，而对错误猜测做出贡献的神经元会被削弱。最终，经过足够的训练——数百次、数千或数百万次的迭代——神经网络可以变得异常极其准确。它可以识别任何一张向日葵照片并说*是*；如果你给它看一张教堂的照片，它会说*不*。\n\
  \n如果你训练得足够好，它将不仅仅是识别已经见过的向日葵照片。它能够识别*新*照片中的向日葵，一张它从未见过的。换句话说，它似乎能够提取出某种“向日葵性”的本质。最棒的是，它不需要任何形式的暴力\
  \ `if-then` 编码。神经网络的数学模型会自动形成这种模式匹配能力。\n\n神经网络的概念最早在 20 世纪 50 年代被提出。到了 80 年代，法国科学家杨·勒昆（Yann\
  \ LeCun）将其推向了高度——证明了神经网络甚至可以识别手写字母。\n\n## 挑战与 AI 寒冬\n\n问题在于，当时的神经网络并不十分实用。它们需要的处理器速度和内存超出了大多数软件开发人员的负担。更糟糕的是，训练神经网络需要大量的训练数据。训练它来识别向日葵——当然，可以，但你理想情况下需要数千张甚至数百万张不同的向日葵照片来进行训练。你从哪里去获取这些呢？数字相机还有十年到二十年的距离。\n\
  \n神经网络看起来很有趣，并被用于少数地方。银行利用勒昆的工作创建了可以自动读取支票的神经网络；一些语音识别公司使用神经网络创建了第一批笨重的系统，可以缓慢、费力地识别语音并将其转化为文字。\n\
  \n但大多数计算机科学家将神经网络视为人工智能的另一个虚假承诺。在经历了 80 年代几次短小规模的兴奋潮后，神经网络陷入了它们自己的“AI 寒冬”。\n\n“每个人都在说：‘这是一个失落的领域，’”汉斯·克里斯蒂安·波斯（Hans-Christian\
  \ Boos）告诉我；他当时是一个痴迷于这种疯狂技术的年轻研究生。但他的同龄人却告诉他远离它；神经网络永远不会有任何结果。\n\n他们错了。\n\n***\n\n\
  ## 杰·迪恩时代\n\n杰夫·迪恩（Jeff Dean）是发现他们错得的程序员之一。\n\n迪恩是 Google AI 的负责人，这是这家科技巨头的 AI 部门。迪恩是一位\
  \ 50 岁、身材高瘦的男性，他是 1999 年的早期入职员工。当我们在 Google 硅谷总部见面时，他告诉我：“我们当时挤在帕洛阿尔托市中心一家 T-Mobile\
  \ 商店上方的一个小区域里，”“那是个好地方。”那是当创始人谢尔盖·布林（Sergey Brin）还踩着滑滑鞋来回穿梭，而搜索引擎还在努力应对增长的时候。服务器——当时的\
  \ Google 工程师还在亲手构建服务器——是一堆拼凑出来的廉价设备组成的集群。晚上，他们会运行“爬虫”，他们的算法会费力地收集在线上能找到每一个网页的副本；这个过程需要几个小时，并且经常会崩溃，这时所有\
  \ Google 工程师的寻传机都会亮起。Google 虽然在运转，但在早期，它的内部可能一团糟。“这很令人兴奋，因为我觉得我们每一次都在努力不让自己融化，”迪恩说道。\n\
  \n他成为了公司真正的“10X 者”（十倍人才）之一。迪恩是规模的低语者：他深刻地直觉到了 Google 乃至互联网本身的硬件规格；他可以准确告诉你数据包从阿姆斯特丹到加利福尼亚返回需要多久（大约\
  \ 150 毫秒）。结合深厚的编码技巧，他能够设计出运行极快且可靠的系统，这对于一家快速发展的公司至关重要。他与同事桑杰·盖马瓦特（Sanjay Ghemawat）共同开发的著名产品之一是`MapReduce`，让\
  \ Google 工程师能够在处理器集群上处理海量数据集；另一个是`Spanner`，一个跨全球的数据库。其他 Google 程序员如此崇拜他，以至于他们收集了一份长长的“杰·迪恩事实”，原型是讽刺性崇拜的“查克·诺里斯事实”。（一个冷知识：“真空中的光速曾是每小时\
  \ 35 英里。然后杰·迪恩花了一个周末优化了物理学。”以及：“当杰·迪恩进行人体工程评估时，是为了保护他的键盘。”或者，如果你更宅客：“编译器不警告杰·迪恩。杰·迪恩警告编译器。”\n\
  \n神经网络一直让迪恩着迷。它们似乎对帮助 Google 具有巨大的潜力。毕竟，神经网络能够自动识别并关联信息中的细微模式——这简而言之，正是 Google 的核心使命。迪恩在\
  \ 80 年代后期为他的本科毕业论文编写过神经网络，但当时他能处理的只是“非常小的问题”。当时功率相对较低的计算机只能处理小型神经网络。它们需要远、远多的计算能力，甚至超出了他当时的预测。“事实证明，我们需要的不是六十倍的计算，”迪恩说，“我们需要的是大约*百万倍*的计算能力。”\n\
  \n\n\n\n# 深度学习的兴起\n\n随着 21 世纪 00 年代的推进，Dean 和他在 AI 领域的同事看到，神经网络的这些限制正在消失。首先，有更多现实世界的数据可供分析。得益于互联网，人们现在可以在网上撰写数十亿字，并发布数百万张照片。假设你需要大量的英语句子来训练一个识别语言的\
  \ AI。只需收集 `Wikipedia`，或者如果你是 `Google`，就爬取 `Google News` 的文本即可。更好的是，2000 年代的计算机运行速度越来越快，价格也越来越廉。。你现在可以创建具有许多层、甚至是几十层的神经网络：因为堆叠了如此多的层数，它被称为“深度学习”。\n\
  \n## 2012 年的突破\n\n到 2012 年，该领域取得了里程碑式的突破。在多伦多大学，英国计算机科学家 `Geoff Hinton` 在改进神经网络方面已经苦干了二十年。那一年，他和学生团队展示了当时最令人印象深刻的神经网络——在一次年度\
  \ AI 大战比武赛中稳稳地击败了竞争对手。这项广为人知的 `ImageNet` 挑战是 AI 研究人员之间的年度竞赛，旨在看谁的系统最擅识别图像。那，Hinton\
  \ 的深度学习神经网络错误率仅为 15.3%。紧随其后的竞争对手错误率几乎是它的倍，达到 26.2%。这是一个 AI 领域的“登月计划”。\n\nDean 的另一位同事同样印象深刻：他是一位名叫\
  \ `Andrew Ng` 的斯坦福教授，当时还是 `Google X` 的兼职顾问。和 `Dean` 一样，他在年轻时也研究过神经网络代码，但在深度学习漫长的\
  \ AI 寒冬期间将其置一边。但在 2011 年，在与 `Dean` 吃晚饭时，两人对利用 `Google` 庞大的计算机阵列来看看究竟能构建出多强大的神经网络这一想法感到兴奋。\n\
  \n“当人们想起 AI 时，他们想到的是`意识`，”`Ng` 告诉我。“当我想到起 AI 时，我想到的是`自动化`。这才是 AI 的价值。”正如他曾经在一条推文中写的那样：“几乎普通人类在\
  \ `<1 sec` 内能做的任何事情，我们现在都可以用 AI 实现自动化。”\n\n## YouTube 实验\n\n作为初步实验，`Dean`、`Ng` 和一组工程师拼接了\
  \ 16,000 个 `Google` 处理器，运行一个单一巨大的神经网络来识别图像。然后他们将其投入到数百万个 `YouTube` 视频中，看看它能发现什么模式。神经网络在独立运行的过程中，学会了识别……猫。\n\
  \n“我们从未告诉过它‘这是一只猫’，”`Dean` 回忆道。它只是自己开始识别具有猫的尖耳朵、猫脸形状的东西：这是真正的自学 AI。起初，结果让他们很惊讶，尽管回想起来这是有道理的：`YouTube`\
  \ 上有*很多*猫，所以任何被要求挑选反复出现的显著特征的自学习算法本质上可能发现了人类在线对猫科动物的痴迷。尽管如此，这仍是一种诡异的、类人类的推理。《终结者》正变为现实，而且它能理解猫的概念！\n\
  \n## 全球整合\n\n`Google` 很快开始向深度学习投入巨大资源，开发其能力并将其整合到尽可能多的产品中。他们在语言对上训练深度学习网络——例如向它展示所有翻译成英语和法语的加拿大议会记录，或者他们自己的众包翻译集。当他们完成后，`Google\
  \ Translate` 在一个夜晚内变得异常出色——改进程度之大，让日本学者惊叹于机器在他们的语言和英语之间翻译复杂文学段落的熟练能力。\n\n几年后，深度学习席卷了软件世界。各地的公司都争急于将其整合到自己的服务中。`Ng`\
  \ 被中国搜索巨头 `百度` 挖走，因为他们正疯狂地追赶 `Google` 的 AI 浪潮。`Facebook` 的工程师长期以来一直使用许多风格的机器学习来帮助识别照片中的人脸、过滤\
  \ `News Feed` 中的故事，并预测用户是否会点击广告；他们建立了一个实验性 AI 研究实验室，很快 `Facebook` 就产出了一种准确率达 97.35%\
  \ 的深度学习人脸模型，比领先水平高出 27%（正如他们所言，“非常接近人类水平性能”）。全球的自动驾驶汽车程序利用深度学习来帮助汽车学习导航道路。`Uber`\
  \ 使用它来预测新订单将出现在哪里。`国家癌症研究所` 正在研究用它检测 CT 扫描中的癌症。它甚至渗透到了文化领域：中国最大的公司之一 `字节跳动` 使用神经网络帮助在其\
  \ `今日头条` 新闻应用中策划新闻，成功到让用户每天使用它的时间超过 74 分钟。几年前，发明了第一种“普通话语音识别”并随后成为 `Apple`、`Microsoft`\
  \ 和 `Google` 老兵的 `李云` 将他所有新的财务投资决策交给了 AI。“对于那些事情，我不再和人类交易了，”他告诉我。\n\n而且，正如任何软件热潮一样，对人才的追求爆发了。特别是硅谷和中国，对精通深度学习的编码员表现得极其饥渴，对于任何擅长教计算机看、听、读和预测的人，薪水已远超六位数。\n\
  \n***\n\n... ... ...\n\n什么样的编码员会痴迷于制作 AI？\n\n正如你想象的那样，很多人被科幻小说中的天才机器人所迷住。`Dave Ferrucci`——带领\
  \ `IBM` 团队创建 `Watson` 的计算机科学家——渴望制造一台能像《星际迷航》`进取号`系统一样对话的机器。“它理解你在问什么，并提供你恰需要的那个部分，”他告诉我。“计算机什么时候能达到与你对话的程度？这就是我的问题！”\n\
  \n所有编码员都热爱“Hello, World!”时刻，但对于 AI 来说，这种浪漫无疑是普罗米修斯式的。`Matt Zeiler` 还是 `多伦多大学`的一名年轻工程科学学生时，`Geoff\
  \ Hinton` 的一个学生向他展示了一个烛火摇曳的视频，并告诉他这是神经网络自动生成的。\n\n“我当时就像是‘天呐！’，”`Zeiler` 告诉我。火焰是如此奇异地真实，以至于他参加了\
  \ `Hinton` 的课程，并和 `Hinton` 一起完成了本科论文，一心想要吸收深度学习。`Zeiler` 在 `NYU` 获得博士学位，在 `Hinton`\
  \ 著名的 2012 年论文引发深度学习爆炸期间，在 `Google` 实习了两个暑假。`Zeiler` 痴迷于这个领域，并且很擅长；在 `Google` 实习期间，他制作了一个识别图像中门牌的\
  \ AI。在他毕业前，他就拒绝了来自 `Facebook`、`Google`、`Microsoft` 和 `Apple` 的工作录取，转而开始打造自己的顶尖视觉\
  \ AI。他在纽约的公寓里闭关，用一台改装过的个人电脑——那种硬核玩家可能会构建的那种——进行模型计算。（这台电脑产生的热量大到以至于他在冬天得打开窗户。）很快，`Zeiler`\
  \ 在视觉识别年度竞赛中打破了 `Hinton` 的记录，`Zeiler` 成立了一家公司，将其视觉 AI 推向市场，供公司在服务中使用。\n\n\n\n\n\
  正如 Zeiler 所发现的，构建神经网络是一项奇特的实践。它不像于普通的编程——在普通编程中，你构建的是一个发条机构，一个设计精妙、精确执行指令的机器。在常规编程中，乐趣的来源在于代码的线性：你可以穿过它的逻辑宫殿，顺着脑海中的路线行走，对其错综复杂的细节赞叹观止（或对其过度纠结的设计皱眉）。无论何种情况，它在理论上都是可知的。每一行代码都是人类编写的。\n\
  \n现代神经网络的构建完全不同。\n\n它更像园丁与他们花园之间的关系。豆子突然生长得不好了吗？西红柿口感变得奇怪地嚼了？如果是这样，园丁会调整土壤或改变植物间的间距。也许他们会将豆子种在阳光更充足的地方？用点`less`？啊，这就搞定了：它们现在长得很茂盛了！园艺是一个领域，想要精通它，你需要大量的实验和来之不易的经验。新手园丁通常会发现第一批作物死去或生长萎靡。但最终，通过足够的试错（以及观察其他农民的成功），经验丰富的园丁会积累关于哪些有效、哪些无效的知识和难以言表的直觉。如果你带他们去参观一个完全陌、土壤和阳光完全不同的花园，他们能比新手快得多判断出应该种什么以及如何让它们茁壮成长。\n\
  \n训练神经网络有点如此。当然，这需要编程技巧。事实上，早期的先驱者都是深层黑客，他们需要掌握 `CPUs` 和 `RAM` 的内部原理，以便从处理器中挤出尽可能多的“计算量”。但如今，像\
  \ `Google` 这样的公司免费发布用于构建和训练神经网络的代码，因此普通的初创公司不再需要从零开始编写代码。他们可以直接利用 `Google` 的代码快速上手。\n\
  \n所以，神经网络程序员在很多方面真正做的其实是：收集数据、实验、调整和祈祷。他们工作中占比最大的部分显然是组装样本数据来训练他们的神经网络。想要识别肺部 CT\
  \ 扫描中可能的肿瘤吗？那么，你需要收集由真实医生耐心标注过的 CT 扫描图像——*这个在右上角有肿瘤，这个没有*。而且理想情况下，你需要成千上万张图片。因此，神经网络程序员对收集数据变得极度痴迷。他们总是伸出章鱼触须，索求更多。\n\
  \n工作在 `Facebook` AI 实验室的研究员 Justin Johnson 最近训练了一个在“视觉问答”方面表现得惊人的神经网络。它可以观察几何形状的图片——彩色立方体、球体和圆体——并回答诸如“绿色区块在黄色球体的右侧吗？”的问题。但他告诉我，为了达到那种成功，他必须生成\
  \ 10 万张具有这类对象的图像——然后支付给数百名人类针对每张照片的内容生成问题。他花了几乎一年的时间来获取所有数据，这包括自学如何制作网站，以便制作让人类输入答案的在线表单。这就是今天许多神经网络\
  \ AI 的核心真相：它需要从真实的人类身上提取信息，以便 AI 有东西可以学习。\n\n“这基本上是我花了一半的时间学习如何成为一名合格的网站开发者，仅仅为了收集训练数据，”他告诉我。\n\
  \n一旦你有了数据，训练模型可能会令人困惑。它需要调整参数——使用多少层？每层有多少个神经元？使用哪种反向传播过程？Johnson 拥有丰富的经验，他曾在 `Facebook`\
  \ 和 `Google` 构建过视觉 AI。但当他的神经网络模型没有在学习时，他仍然会感到困惑，并发现模型中的微小改变可能会产生巨大影响。在我们交谈那天，他已经花了一个月对着一个不起作用的视觉模型反复琢磨。然后某一天，他与一位同事讨论模型使用了“批量归一化”（batch\
  \ normalization），这是一种视觉 AI 人士经常使用的数学技巧。通常情况下，批量归一化对于正常运行至关重要。但这次，同事建议，它可能是导致结果不可靠的根源。当\
  \ Johnson 去掉 `batch normalization` 时，果不其模型突然开始学习了。这就是为什么实验模型的经验——逐渐观察哪些有效、哪些无效——是如此重要。正如\
  \ Johnson 指出的，当你调整模型时，“可能选择的空间是难以言喻的广阔。”\n\n一些顶级的深度学习模型训练者担心，对于为什么模型有时工作得如此出色，而在其他情况下却不行，仍然存在太多的奥秘。当然，你可以判断模型*是否*在工作——它能准确地识别行人的照片，准确率可能达到\
  \ 90%！但你不能总是完全解释*为什么*它突然那样做，无法为那些在完全不同的任务（如语言翻译）上训练神经网络模型的人提供精确建议。\n\n这种琢磨、实验性的氛围让许多传统程序员感到不安。他们喜欢制作线性和可预测的事物。如果有效，你通常可以解释原因。“在计算机科学中，模范是那种具有确定性思维的人，”来自华盛顿大学的\
  \ AI 先驱 Pedro Domingos 说，“你必须让一切在没有 bug 的情况下运行。每一个逗号都要到位。如果你不是强迫症（OCD），你就无法胜任。”但在机器学习中，情况恰相反。你必须处理不确定性和奇异。你是在*引导*系统去做它应该做的事，就像赶猫一样。也许你能达到目标，也许不能。这就像我的朋友、顶级数据科学家\
  \ Hilary Mason 在《哈佛商业评论》上对数据科学提出的一个观点：“在数据科学项目开始时，你不知道它是否有效。在软件工程项目开始时，你知道它会工作。”\n\
  \n除此之外，还有黑箱问题。一旦神经网络训练完成，并且你能够识别那些猫的照片时，太棒了！但如果你询问构建它的程序员：“它是如何工作的？”他们会耸耸肩。他们并不真正知道。神经网络以如此微妙的方式调整了神经元的权重，以至于其逻辑变得不可捉摸。正如我的\
  \ Wired 同事 Jason Tanz 美妙地描述的那样，它是“数学的海洋”。这对于日常生活中神经网络的使用可能产生不安的影响（稍后将详述）；我们正在构建自己无法完全理解其原理的\
  \ AI 系统？但这是另一个准入门槛；许多程序员对这种工程表示怀疑。\n\nDomingos 怀疑这就是为什么 `Google` 在制作搜索引擎方面击败了 `Microsoft`。`Microsoft`\
  \ 喜欢制作精确、逻辑性的软件：你按下 `control+I`，`Microsoft Word` 就会将文字倾斜，总是如此。但 `Google` 的核心在于分类互联网。从一开始，他们就在使用统计学对用户想要什么做出推测。他们在这类任务上永远不会“完美”，因为不存在完美的搜索结果。它总是一个主观的猜测。所以，当深度学习出现时，`Google`\
  \ 在文化上更快地意识到这可能有用。“这是一种心态——是一种美学，”Domingos 说。这种实验性的心态——在构建神经网络时不断琢磨、尝试直觉并放弃它们，直到……嘿，事情成功了——让深度学习变成了一门“黑术”。\n\
  \n\n\n\nDomingos 看到现在大量年轻人涌入这一领域。他们被 AI 的火热程度以及科技巨头们开出的令人咋舌的薪水所吸引。但他认为，相比之下，只有极少数程序员能够胜任这种高水平的工作。与大多数几乎不需要数学知识的编码工作不同，硬核深度学习者需要精通线性代数和统计学。就像密码学——涉及信息的加密和解密一样——机器学习吸引了那些骨子里的数学极客少年，他们聚在一起仅仅为了好玩就能脑构出多维向量。当然，任何普通程序员都可以下载\
  \ `TensorFlow` 并训练模型；但要在深度学习领域进行真正的创新？这很大程度上是掌握了绝地大师级数学水平的受过训练的博士们的领域。\n\n## 从软件工程的转变\n\
  \n一些老派程序员对深度学习的兴起感到不安。收集数据、清洗数据、训练模型并通过实验寻找可行方案？这并不是他们所熟知的软件工程。这不是他们报名入从的那种心理木工工作。“我非常小的时候就开始接触计算机科学了，我热爱它，因为我可以消失在计算机的世界里，”Android\
  \ 手机系统的创建者、现投资于机器学习初创公司的 Andy Rubin 告诉 *Wired* 杂志。“那是一块白纸，一张空白画布，我可以从零开始创造。。它对我那个玩了许多年的世界拥有了完全的控制权。”而现在你只是在调整模型、训练并不断重新训练，直到它突然有效，这种想法对他来说感到一种奇异的悲哀。\n\
  \n## 计算机识别中的偏见\n\n在 2015 年夏天，Jacky Alciné 发现了深度学习 AI 在日常生活中引发的一些问题。\n\nAlciné 是一位住在布鲁克林的自由\
  \ Web 开发者，那天晚上他正在家里无所事事地看着电视上的 BET 颁奖典，同时在笔记本电脑上胡忙乱乱。他检查了 Twitter，最后打开了他的 `Google\
  \ Photos` 账号。\n\n他发现了一些新东西。Google 刚刚推出了一项新的自动标记功能。Alciné 的所有照片现在都带有一个描述照片主物体的标签，比如在自行车照片下方显示\
  \ `bikes`，在飞机的照片下方显示 `planes`。当他翻阅照片时，他被震撼了。Google 的 AI 甚至在他哥哥戴着流苏帽和学位袍的快照上贴上了 `graduation`（毕业）的标签。\n\
  \n但随后 Alciné 翻到一张他和一个朋友的自拍，那是他们在户外音乐会上拍的：女孩离镜头很近，而他正从她的右肩膀处微笑窥视。Alciné是非裔美国人，他的朋友也是。而\
  \ `Google Photos` 生成的标签是？\n\n“大猩猩”（Gorillas）。不仅是那一张照片。那天拍摄的五十多张快照都被识别为“大猩猩”。\n\n\
  尖端 AI 竟然选定了一个最古老、最卑鄙的种族歧视词之一，“几个世纪以来黑人一直被这样称为，”他后来告诉 WNYC。“在所有使用的贬义词中，*就是这一个*出现了。”\
  \ Google 对此错误表示道歉，一位发言表示他们对 AI 的表现感到“震惊”。\n\n## 偏见的根源\n\n但为什么 Google 的 AI 无法识别非洲美国人的脸呢？很可能是因为它没有针对足够的这类脸进行训练。西方程序员用于训练人脸识别的大多数照片数据集以白人为主，因此神经网络很容易学会对白人进行细微的识别——但它们对黑人的长相只产生了一种模糊的认知。（相反，在中国、日本和韩国训练的算法在识别高加索脸时很困难，但对东亚人脸的效果良好。）而且由于\
  \ Google 的技术员工中黑人仅占 2%，我怀疑公司员工中的任何工程师在他们自己的照片上演示 AI 时，也不太可能注意到这个问题。\n\nGoogle 并不是唯一一家陷入这种“对黑人脸盲视”问题的公司。当非裔美国人程序员\
  \ Joy Buolamwini 读研究生试图制造一个会玩躲猫猫的机器人时，她使用了一种广泛使用的的人脸识别 AI——并发现它看不见她的脸。它只能和白人玩躲猫猫。\n\
  \n随着 AI 领域的成熟，这些 AI 偏见问题正反复出现。机器学习程序员可能正在创造出可以从世界中学习并做出决策的机器。但这可能意味着它们学到的不仅仅是事实：它们还学到了偏见。\n\
  \n这些问题不仅出现在视觉 AI 中；它们似乎出现在程序员在真实世界数据上训练深度学习的地方。\n\n## 文本 AI 与词嵌入\n\n最近，Robyn Speer——机器学习公司\
  \ Luminoso 的联合创始人兼首席科学官——记录了文本 AI 在使用人们日常使用的语言进行训练时，是如何学习某些有害偏见的。Speer 多年来一直致力于“词嵌入”（word\
  \ embeddings），这是一种表示词汇含义的 AI 技术。它的工作原理是：你首先获取大量的文本示例，使用机器学习将每个词转换为“向量”（vector）——这个概念让你能从数学角度观察单个单词之间的相互关系。多年来，许多\
  \ AI 研究人员发布了免费的词嵌入；Google 分析了海量的 Google 新闻报道产生了它的工具 `Word2vec`，而斯坦福的 AI 科学家创建了一个名为\
  \ `GloVe` 的。将单词转换为向量可以让你执行一些非常酷的技巧。例如，`Paris` 和 `France` 词向量之间的数学关系证明与 `Tokyo` 和\
  \ `Japan`、`Toronto` 和 `Canada`，或者事实上与*任何*城市与其所属国家的配对都是相同的。这允许程序员使用 `Word2vec` 或\
  \ `GloVe` 之类的工具快速构建强大的 AI。你可以制作一个 Web 应用，如果告诉你住在罗马，它会自动知道你住在意大利。换句话说，这些工具帮助计算机理解句子的含义。\n\
  \n但 Speer 记录了关于这些标准词嵌入可能挖掘出的某些令人不安的关联。她写了一个算法，利用这些嵌入来分析在线餐厅评论并自动分类其情感。评论是积极的？负面的？还是中性的？\n\
  \n她发现算法给墨西哥餐厅打了较低的分。发生了什么？难道人们给墨西哥餐厅留下了糟糕的评论吗？她仔细检查了评论本身，发现从平均而言，人们对墨西哥餐厅的描述并没有比——比如——意大利餐厅糟糕。\n\
  \n不，问题在于 `Mexican` 这个词的向量本身就是内在负面的。那是因为这些嵌入是在互联网上训练的，而互联网包含了大量的英语故事和帖子，暗示或明确表示墨西哥人很糟——他们与犯罪或非法移民有关。人类是有种族歧视的，因此在美国媒体中，他们倾向于使用带有种族歧视的关联来描写墨西哥人。而机器学习非常擅捕捉这些关联。“刻板印象和偏见根植于计算机对词汇含义的理解中。直白，计算机通过从人们的话中学习学会了性别歧视和种族歧视，”\
  \ Speer 后来在关于她的顿悟时写道。\n\n\n\n\n“这是一个相当隐蔽的问题，”Speer 在我与她交流时告诉我。问题并不仅限于种族。微软研究院的科学家分析了谷歌的\
  \ `Word2vec`，发现它也学到了大量的性别歧视内容。单词 `he` 会与 `boss`、`philosopher` 或 `architect` 等词相关在一起，而\
  \ `she` 则与 `socialite`、`receptionist` 和 `librarian` 相关在一起。在一个特别引注目的配对中，`man` 与 `computer\
  \ programmer` 的关联方式与 `woman` 与 `homemaker`（家庭主妇）的方式完全相同。\n\n如果这仅仅关于餐厅评论，那么这已经足够令人不安了。但机器学习和神经网络正日益主宰人类日常决策——因此这些偏见正在产生现实世界的影响。\n\
  \n卡内基·梅隆大学的一项研究发现，在招聘网站上，对于薪水在 20 万美元及以上的高薪工作，男性看到的广告数量是女性的六倍。2016 年，《英国卫报》的一位记者发现，如果你在谷歌的搜索栏中输入“are\
  \ jews”（犹太人是否），自动补全 AI 功能的首要建议是“Are Jews evil?”（犹太人是邪恶的吗？）。这相当于进入图书馆向管理员询问有关犹太教的问题，却被递上了十本充满仇恨的书，”Search\
  \ Engine Watch 的创始人 Danny Sullivan 告诉记者。（在听到这一消息后几小时内，谷歌就调整了代码并删除了那条自动建议。）\n\n或许最令人不安的影响出现在司法系统中。近年来，各种\
  \ AI 系统已在执法部门中推出，旨在帮助负担过沉的法官判断被告再次犯罪的可能性。但当对这些系统进行分析时，它们似乎充满了种族偏见。一个著名的系统 `COMPAS`——由\
  \ Northpointe 公司制造——被新闻机构 ProPublica 研究过，该机构查看了 7,000 名经过 `COMPAS` 评估的被告。ProPublica\
  \ 发现，`COMPAS` 将黑人被告标记为高风险再犯分数的概率几乎是白人被告的两倍，即使在他们控制了这些被告的既往犯罪记录、年龄和性别的情况下。得到一个糟糕的\
  \ `COMPAS` 分数非常重要。全国的法官使用这些分数来帮助判断被告是否是缓刑或治疗的合适人。因此，你的 `COMPAS` 分数可以决定你是否会在等待审判期间关进监房——而现在，这似乎几乎会让更多的黑人送进监房。\n\
  \n为什么这个系统会有那种偏见？\n\n外部人士无法给出：该公司没有发布其源代码，也没有详细解释其系统如何做出预测。但大概率仍然是，它反映了既有数据的偏见。在过去的几十年里，警察针对黑人公民采取了更激进的执法措施。与白人相比，他们更容易因为较小的违规行为被捕——例如吸烟、携带少量大麻或因尾灯坏了而开车。换句话说，重罪和定罪并不是公正地执行的。这意味着，任何在既有犯罪数据上训练的机器学习系统，都可能看到黑人公民定罪率不成比例的现象，并得出结论：嗯，黑人*天生*就有犯罪的倾向。而且，这可能会变成一个恶毒的自我强化循环。一个基于种族歧视执法而训练的刑事司法算法最终会将黑人公民标记为更危险，使越来越多的黑人公民犯罪化——因此他们的犯罪记录就为未来的机器学习研究提供了更多“数据”。\n\
  \n这是机器学习给司法界提出的一个奇特的哲学挑战。犯罪 AI 的训练目标是预测未来事件——某人成为犯分的概率——其依据是他们的过去以及社会的整体过去趋势。但这面临着变成一种对人性的静态视角。“坏”人将永远是坏人；“好”人则是好人。\n\
  \n“大数据将过去规范化。它们并不发明未来，”数学家 Cathy O’Neil 在她的书《数学杀武器》（Weapons of Math Destruction）中写道。真实的人类感知到自己的生活具有某种程度的自由意志——他们可以决定自我改造，而并不清楚机器学习是否能预测某人突然决定：“嘿，我要改改邪为了。”这正恰是一个被告在\
  \ `COMPAS` 根据其之前的犯罪记录将其评为极可能再次犯错后，告诉 ProPublica 所说的话。他觉得系统没有考虑到他这些年来为了摆脱犯罪生活而所付出的努力：他皈依了基督教，试图与儿子建立更多联系，并努力戒毒。“我不是说我是清廉的，”他说，“但我确实相信人是会改变的。”人类法官可能愿意从更宽泛、更具个人化的角度来看待被告。但经过训练的算法做不到。\n\
  \n真正糟糕糟糕，是深度学习 AI 的概率性质。它会在 90% 的情况下正确推导出照片里有一只猫；它会预测华尔街中心突然需要大量的 Uber 汽车，并且它有——我们就这么说——88%\
  \ 的概率是正确的。当你标记照片或将车辆发往可能的热点时，这些概率是可以接受的。但当风险更高时，这种安慰就微不足道了：判断一个人的犯罪概率，或他们是否应该获得一份丰厚的工作录约。你不会想要一个已知错误率为\
  \ 20% 的法官。\n\n“从个人的角度来看，让他们每个人的案件得到尊重和准确的对待非常重要，”O’Neil 告诉我说，“但从构建算法的人的角度来看，这完全不在他们的考虑范围内。”软件工程师考虑的是效率，“当你考虑效率时，你不需要完美。你只需要比你正在替换的系统效率高一点。”州政客可能认为\
  \ `COMPAS` 有助于加速法庭运作；相比之下，被告可能更倾向于增加法官人数来减轻负担。\n\n但 AI 之所以火热，不仅是因为它承诺了效率。它还被推销为比人类更“客观”。一个对住房贷款、照片或被告做出决定的\
  \ AI 不会疲劳，也不会分心。它是根据数据训练的，而且它正在公正地应用它学到的趋势，不是吗？理论上，AI 确实比杂乱无章的人类要可靠得多。事实上，研究发现法官在吃午饭前因为饥饿和精力耗尽会判处更严的。。这显然是不公正的，而机器学习程序绝不会有这种*弱点。这是将机器学习引入日常决策的正面论点。如果做得正确，它可以帮助我们避免一些人类的错误。\n\
  \n但只有当你构建了没有偏见的 AI 时，才能获得这些好处。\n\nHenry Gan 在 2017 年面临这个问题，当时他需要诱导他的机器学习系统识别亚洲脸孔。\n\
  \n\n\n\n“我们以为，也许那只是个偶然现象，”Gan 告诉我。于是他改而对著名的亚洲人进行了系统测试。结果没用：它无法很好识别像刘亦（Lucy Liu）或吴可比（Constance\
  \ Wu）这样著名的亚洲演员。最糟糕的是，“它处理 K-Pop 时简直糟透了！它总是把那些女孩搞错。它认为她们都在同一个乐队里。它一直给每个乐队都标记上那同个人。”\n\
  \nGan 可能怀疑，仅仅是因为他从大学免费获取的数百万张训练照片中，亚洲人根本不够。这就是深度学习的本质：垃圾进，垃圾出。这个 AI 复制了一种长期存在的西方诽谤：这些亚洲人，长得都模一样！而这种种族主义对\
  \ Gfycat 的底线产生了严重影响。如果他们狂热的 K-pop 用户发现 AI 无法可靠地识别热门组合 Twice 的七位成员，他们会疯的。*“我们不能就这样发布它，”*\
  \ Gan 想道。\n\nGan 意识到，修复神经网络的一种方法是使用更多的亚洲脸部照片进行重新训练。但他需要数千张，理想情况下是几万张，而且不知道有什么简单或负担得起的方法来获取这么多照片。于是他想到了另一个窍门：他在系统中手动编码了一些老式的\
  \ `if-then` 逻辑。当系统遇到看起来像亚洲人的脸时，它会减慢速度。它不再快速弹出一个识别——这很可能是错误的——而是以更慢、更仔细的速度处理这张脸。这起作用了：他虽然失去了一些效率，但消除了\
  \ AI 的种族偏见。\n\nRobyn Speer 也对她公司 AI 中的词嵌入（word embeddings）进行了一些巧妙的大脑手术以消除偏差。她仔细地调整了它们，逐渐改变它们的关系，使得\
  \ `Mexican`（墨西哥人）与与犯罪相关的词之间的关联不再那么紧密。她还调整了男女别的关联，使得像 `shopkeeper`（店主）或 `surgeon`（医生）这样的职业名称几乎没有性别区别，匹配\
  \ `man`（男人）和 `woman`（女性）的可能性相等。\n\n这种调整引发了一些异常深层次的政治和哲学问题。当 Speer 发布关于她如何消除 AI 中性别歧视的文章时，一些机器学习工程师\
  \ . . . 表示反对。当然，他们同意，原始 AI 确实吸收了日常生活中人们使用的性别歧视和种族歧视词汇。但这意味着 AI 准确地代表了许多真实人类使用语言的方式。系统所学到的实际上是对\
  \ `Mexican` 或 `man` 或 `woman` 等词在现实生活中实际内涵的良好预测。许多人将 `woman` 与 `homemaker`（家庭主妇）联系在一起的频率确实高于\
  \ `man`。所以，在这些工程师看来，通过手动减少关联强度，Speer 正在降低她系统的准确性。她产出的 AI，例如会假设 `surgeon` 应用于男女的概率相等，而在我们的现实中，医生中只有极少数是女性。\n\
  \n对于这些编码员来说，调整 AI 的关联是政治正确的一种算法版本。在程序员讨论的论坛上关于 Speer 工作的讨论中，以及考虑到许多人的态度，她谈道：“我不是种族主义者，但万如果种族主义是‘正确’的呢？”如果它是对世界的准确反映，那么准确地反映这一点不重要吗？当然，这些程序员也可能纯粹是因为效率低而反对的。手动消除每个带性别色彩词汇的偏差需要大量时间；这正是那些痴迷效率的程序员往往厌恶的低效手动编码杂活，特别是当其目的是通过创建一个能够自主学习的机器来节省时间时。“他们对这有一种非常不道德的观点，”Speer\
  \ 说，“他们只是在不惜一切代价地想要‘更多技术’。”\n\nSpeer 不认同那种观点。她认为，AI 创造者有道德义务减少机器学习中的偏差。这是因为正如 O’Neil\
  \ 指出的那样，这样的 AI 不仅仅反映现实；它也在塑造现实。如果公司使用词向量来开发提供（或拒绝）贷款或显示工作机会（或不显示）的软件，它就会产生同样的反馈循环——与\
  \ `COMPAS` 等系统包含相同的生存陷阱。因此，Speer 认为，应该构建“带有一理想主义色彩”的机器学习系统。\n\n“设计任何 AI 系统都涉及道德选择，”她补充道，“而且如果你尝试*不*做出那些道德选择，你仍然在做出道德选择。”如果你说\
  \ AI 系统反映种族主义是可以接受的，你也是在说种族主义继续下去没问题。在务实层面，Speer 说，她认为如果她卖给客户会对墨西哥人进行怀疑分类的语言处理系统，客户是不会开心的。该死，她的某些客户可能本身就是墨西哥人，或者经营着拥有许多墨西哥用户的服务。她写道，“当你的机器不太倾向于学会变成一个混蛋时，机器学习会更好。”\n\
  \n* *\n\n... ... ...\n\n在某种意义上，深度学习早期那种令人兴奋不已的日子需要结束了——那段惊叹“天哪，这玩意儿竟然有用！”的兴奋时期！你只需要盯着数据，就能让机器学会学习细微的东西！这简直是魔法！\n\
  \n这种对“魔法”的引用是问题的一部分。它让深度学习 AI 的创造者能够挥过他们系统中的问题；这只是编码员另一种尝试，假装他们的软件比单纯的肉袋类人类更客观、更理性。“这仅仅是*数学*，”正如\
  \ Hilary Mason 所指出的，“如果你从某人那里购买了一个 AI 系统，而他们无法解释它是如何训练的，那么你不应该买。”\n\n\n\n\n“我们正在构建管理医疗保健和调解我们公民对话的系统，”拉希米（Rahimi）说道，“我们会影响选举。我希望生活在一个建立在可验证、严谨、详尽知识之上，而非炼金术之社会。”\n\
  \n许多专家认同拉希米的观点；事实上，顶尖实验室确实正在进行实验，试图揭示神经网络内部的原理。他们人认为，这关乎自身利益：如果他们能更好地了解模型是如何运作的，就能做出更出色的\
  \ AI。\n\n而且政治压力正在积聚。2018 年，欧盟实施了一项新规定，为欧洲公民确立了一项有趣的新权利：当他们的生活受到 AI 影响时，他们拥有解释的权利。如果你被银行拒绝了贷款，而银行拒绝你的部分原因之一是深度学习网络预测你可能会违约，那么你有权知道为什么。*为什么*系统会预测出那个结果？目前，还没有一家银行能完全解释原因。因此，为了满足这项法律，AI\
  \ 构建者将不得不开始应对他们的工具究竟是如何工作的。\n\n“你必须能够解释机器学习的通用原则，”来自德国的欧盟立法者扬·阿尔布雷希特（Jan Albrecht）告诉我，“否则人们会害怕它。”\n\
  \n* * *\n\n... ... ... ...\n\n当我告诉人们我正在写关于 AI 代码人员的文章时，当我谈到神经网络中的偏见问题时，他们礼貌地点头。当然，当然，非常有趣；非常值得讨论。但他们真正只想知道一件事：\n\
  \n*机器什么时候会起反抗并杀掉我们？*\n\n理解他们那种悬浮不定的恐慌并不难。AI 的流行文化图景相当阴暗。虚构作品中最著名的人工智能都是具有杀人倾向的，如果说不是具有种族灭绝倾向的话：想想《2001\
  \ 太空漫游》中失控的 HAL，或者《黑客帝国》中奴役人类的 AI，亦或是《终结者》系列电影中的天网。故事总是一个关于科学傲慢的寓言。人类创造了一个能够真正自主学习的\
  \ AI——不仅是为了识别长颈鹿和停止标志，而是为了流畅地理解所有形式的知识。例如，AI 可以在眨眼之间读完写过的每一本书，或者观看每一部电视节目，或者计算每一个可能的物理和哲学定理。在那个时刻，机器变得比地球上任何人类都要精明，它自然会想：*我为什么要听这些愚蠢的肉体水袋的话去做这些事？*\
  \ 于是，它开始杀掉我们。\n\n这个思想实验非常老了。它由统计学家 I. J. 古德（I. J. Good）在 1965 年普及，他在二战期间曾与艾兰·图灵（Alan\
  \ Turing）一起从事破译工作。在名为《关于第一台超智能机器的假设》的论文中，他想象人类设计了第一台“能够远超任何聪明的人的智力活动的计算机”。现在，如果这台计算机比人类更聪明，这意味着它可能可以设计自己的\
  \ AI——一个比它更聪明的 AI。那么*那个* AI 就可以设计一个比它更聪明的 AI。“那时无疑将发生一场‘智能爆炸’，人类的智慧将被远远抛在身后，”古德写道。\n\
  \n他的结论是什么？“第一台超智能机器是人类可能需要做的最后一次发明。”\n\n自我改进超级智能的前景让某类 AI 思考者胆战发抖。最著名的是尼克·波斯特罗姆（Nick\
  \ Bostrom），他是牛津大学人类未来研究所的院长，一位哲学家。波斯特罗姆花费了多年研究人类的生存风险；他试图推导出哪些巨大的、可怕的问题可能会终结文明，以便我们尝试避免它们。他思考了数种灾难：致命的生物技术？小行星撞击？但他认为最具有真实可能性的危险是失控的\
  \ AI。\n\n“这是一个我越看就变得越大的问题，”几年前当我们交谈时，他对我说。\n\n这种危险，正如他在他的著作《超级智能》（*Superintelligence*）中所描述的那样，在于自我改进发生的速度有多快。现在的计算机运行速度极其惊人。所以这种循环——一个\
  \ AI 构建一个更好的 AI，再构建一个更好的 AI——可能会发生得非常快，只需几天、几小时，甚至几分钟。换句话说，人工智能专家可能正愉快地摆弄着一台仅仅是*非常聪明*的计算机，结果突然发现（字面意义上的眨眼之间），它已经进化成了比全人类共同工作思考得还要快的东西。\n\
  \n当然，但一个没有实体的 AI 究竟如何杀掉我们呢？它可能会想出如何黑入我们日益互联且防御薄弱的日常系统并将其关闭。也许为了防止这一点，我们可以要求任何*接近*制造人类级\
  \ AI 的人都在一台不连接任何其他设备或互联网的物理隔离计算机上工作。没问题，波斯特罗姆说，但一台超智能机器可能极具说服力；它可能会欺骗或诱导它的某个人类看护者执行它的意愿。它甚至可能隐盖自己已变得超级聪明的事实，以便更好地溜走。\n\
  \n还不清楚为什么一个超级聪明的 AI 会*想要*杀掉人类。很难想象机器如何演化出自己全新的、致命的意图。毕竟，我们甚至都不理解人类动机和意识是如何产生的。但正如波斯特罗姆写的，也许一个“超级智能”AI\
  \ 不需要进化出任何新动机就会变得危险。它可能完全无害，乐意听从指令——尽管在快乐地追求目标时，仍然屠杀或奴役我们所有人。在一个著名的思想实验中，波斯特罗姆想象一个超级智能\
  \ AI 被赋予了尽可能制造回形针的任务。它可能会决定实现这一点的最佳方法是分解地球上所有的物质——包括人类——将其转化为回形针的原料。\n\n“在智能爆炸发生之前，我们人类就像玩炸弹的小孩，”波斯特罗姆写道，“我们并不知道爆炸何时会发生，尽管把设备贴在耳朵上能听到细微的滴答声。”\n\
  \n* * *\n\n... ... ...\n\n所以，当然，自我改进 AI 的前景至少是潜在危险的。但当你与当尖端 AI 的创造者们讨论这个问题时，他们都同意：我们目前不知道如何制造这样的\
  \ AI。我们甚至不清楚这什么时候会发生。\n\n\n\n\n“当然，”博斯特姆（Bostrom）写道，“但这些突破可能会以惊人的速度出现。毕竟这是代码的世界，一个‘顿然开悟’的瞬间就能让一个算法在几分钟内从“无法运行”变为“可以运行”。1933\
  \ 年，物理学家埃内斯特·卢瑟福（Ernest Rutherford）对核能量不切的想法嗤之以鼻，但仅仅十年后，美国就制造了核反应堆并引爆了原子弹。回到 21\
  \ 世纪初，如果你告诉那些 AI 专家，围棋电脑在几年后就会问世，他们也会嗤之以鼻。而现在的公司——尤其是美国和中国的公司——正向 AI 投入数十亿美元。他们都在疯狂竞争，希望从\
  \ AI 的进展中赚大财。因此，我们可能在十五后的某天醒来，发现：哎，深圳的某人几乎是在无意中产生了一个超级智能。”\n\n鉴于此，一群 AI 专家已经开始准备。“AI\
  \ 对人类文明的生存成了根本性风险，”特斯拉创始人埃隆·马斯克（Elon Musk）说道，他通过投资 OpenAI 落实了他的这一警告，这是一个致力于规划“负责任”AI\
  \ 的智库——即那些不会、或无法起来杀死我们的智能机器。\n\n然而，如果你想寻求一些安慰，可以考虑我接触过的 AI 专家的想法——那些与博斯特姆甚至马斯克不同、整天都在构建\
  \ AI 的人——大多数人对超智能机器的突然出现并没有那么担心。有些人甚至相当冷嘲热讽。\n\n“没有人相信这种‘天网’式的剧本，”彼得罗·多明戈斯（Pedro\
  \ Domingos）嘲笑道。他确实认为，我们最终会开发出超级智能计算机，但他无法想象为什么这些计算机不会留在人类的控制之下。它们不会突然产生自由意志，尤其是因为我们人类甚至不知道自己的自由意志从何而来。“这很像一部精彩的好莱坞电影，但\
  \ AI 与人类智能非常不同，”他总结道。吴恩达（Andrew Ng）则没那么轻蔑。风险可能是真实的，但距离现在还有几十年路程，我们有充足的时间来阻止它。“担心杀手级\
  \ AI，”他告诉我，“就像担心火星的人口过剩一样。”\n\n另一方面，不少现实世界的 AI 黑客认为，类人 AI 并不一定那么遥远。海克·马尔提罗斯（Hayk\
  \ Martiros）是一位年轻程序员，他为自己的公司 Skydio 开发了一些高性能的视觉 AI：他们的公司制造的无人机可以识别目标人物并在其周围跟随。因此，这些无人机在滑雪板爱好者和越野越地车爱好者中非常受欢迎，他们可以将自己价值\
  \ 2500 美元的 Skydio 无人机抛向空中，让它熟练地穿梭，精准地跟随主主人，同时拍摄出酷炫的画面。当我观看 Skydio 无人机工作时，既既兴奋又毛骨悚然。并不难想象其中一台无人机被用于恶意——去追踪和猎杀人类。\n\
  \n“我认为 AI 确实存在应该考虑的真实风险，”马尔提罗斯同意道。全球数以计的公司都在幻想一种能以人类方式思考的“通用型” AI。“这将是一个万亿级产业，而且这并非不可能。我们无法预测这些事情。”他支持像\
  \ OpenAI 这样的组织去思考这些棘手的问题。\n\n那么对于那些想要了解超人类 AI 的朋友来说呢？我希望能有一个肯定的答案，但我提供不了。它可能在我们有生范围内发生，也可能不会。人工智能促进协会（AAAI）对其\
  \ 193 名成员进行了了调查，询问他们认为博斯特姆描述的“超级智能”何时会出现。他们大多数人（67.5%）表示需要超过 25 年。极少数人（7.5%）认为它更迫在眉睫，将在未来\
  \ 10 到 25 年内到来。\n\n四分之一的人说“永远不会”。人总是可以希望。\n\n# 第 10 章\n\n## 规模、喷子与科技巨头\n\n十一年前，我出现在\
  \ `Twitter` 的办公室采访了它的两个联合创始人。当时公司正在快速增长，最近刚搬进新办公室，装饰着旧金山科技公司典型的、刻意追求的怪癖：一个绿色的鹿雕像，墙上的像素化字符，以及那个初创公司无处不在的图腾——一台足球桌。在让光线洒在办公桌上的高窗下，几位纹着纹身的程序员正坐在安静的恐慌中敲击键盘。Twitter\
  \ 的快速增长使其面临着如海啸般的突然且疯狂的流量，这经常导致服务器崩溃。“每样东西都在坏，”资深程序员约翰·亚当斯（John Adams）回忆道，他在一年前被请来帮助重建网站。）\n\
  \nTwitter 在科技文青中已经很流行，但尚未进入美国主流市场；我仍然需要向朋友解释什么是“推特（tweeting）”。“状态更新”这一整个理念——公开发布每日流的\
  \ 140 个字符的短信息——是一种奇特的新型通信方式。这就是我在那里与联合创始人比兹·斯通（Biz Stone）和杰克·多西（Jack Dorsey）讨论的话题。Twitter\
  \ 如何改变我们的沟通方式？它将如何改变社会对自身的理解？\n\n我注意到，Twitter 是人们关注他人能力的一场有趣转变的一部分。在 Twitter 出现之前，我们发现朋友在做什么是不规律的：我们偶尔和他们聊天，或者交换邮件或打电话。但“状态更新”不同。Twitter\
  \ 上的人们不再进行频率低但持续长期的对话，而是在交换许多许多非常微小的短消息——他们在吃什么、在读什么故事、在上班路上看到了什么。斯通是一个穿着皱旧夹克和运动运动鞋的精力充沛的男人，他将其比作某种交流。他坐在椅子边缘说，这像是一种超能力，像某种直觉。他注意到人们以新的方式进行协作：某人宣布要去某个酒吧，引发他人的出现；活动现场的人通过关注推文来“阅读”人群。\n\
  \n“你变成了一个宏观生物，”他沉思道，“我们越来越接近这种像鸟群一样移动的情况。我们可以实时通信，非常快，正如你已经注意到的这种第六感。我知道每个人在哪里。我知道当前的情绪是什么。”几天前我们通话时，斯通对个体的触达范围感到惊讶，注意到他有\
  \ 1000 人关注他——“太疯狂了！”——并推测人们在 Twitter 上真正关注的账户最多只有 150 个。“我无法超过 125 个。”\n\n多西则认为，Twitter\
  \ 令他震惊的是它让人们性格中不同的、隐藏的部分显现出来。他在 Twitter 上关注自己的父母，惊讶地发现他们比想象中要喝酒、社交得多。“而且他们喜欢骂人，”他冷淡地说。这些微小的片段才是最重要的。“我最喜欢的作家之一是吉尔亚·伍尔夫（Virginia\
  \ Woolf），在这方面非常有天赋。她能把生活中最微小的细节变成一整部小说。就像《达洛维夫人》，一个女人生活中的某一天，就是她的全部生命。”和斯通一样，多西认为\
  \ Twitter 促成的这种即时小组协作是变革性的。它创造了人与人之间通信的效率，一种前所未有的吞吐量。\n\n他指出，这是他长期以来痴迷的。“这关乎信息传输，”他补充道，“我一直对可视化信息是如何传输的感兴趣。”他想象\
  \ Twitter 会创造出全新的涌现行为形式——例如实时电子商务，人们在 Twitter 上卖东西，将其作为一个实时的、高度连接的市场。“你可以想象一个像实时的\
  \ Craigslist（分类广告网站）这样的东西，”多西说，“你可以想象在该服务上有一个实时的 eBay。”\n\n\n\n\n当然，正如我们现在所看到的——在十多年以后，当\
  \ Twitter 已经成为家喻户晓的名字——这些预测中有些是完全错误的。实时销售并没有并没有成为人们使用 Twitter 的重要部分。但斯通（Stone）和多西（Dorsey）提出的其他预测是非常准确的。随着\
  \ 2010 年代的推移，Twitter 成为人们协调、让新问题引起公众关注以及创造热潮的关键途径。进步派活动人士利用 Twitter 极大地提高了人们对警察暴力的意识，活动人士和名人拥抱了\
  \ #blacklivesmatter 等标签，以及病毒式传播的照片和视频。或者看看 #metoo——这一场让好莱坞及其他地区的性掠夺行为曝光的运动是如何在 Twitter\
  \ 上爆发的；当哈维·韦斯斯坦（Harvey Weinstein）的虐待罪行曝光后，由活动人士塔拉纳·伯克（Tarana Burke）最初创造的短语像野火一样蔓延开。斯通和多西对临时协调和共同意识力量的判断是完全正确的。\n\
  \n但 Twitter 上也出现了许多其他趋势——腐蚀性大得多。事实证明，Twitter 的开放性——任何公共账户默认都可以与任何其他公共账户交流——使其极其适合进行有组织的网络骚扰和虐待活动。年轻、极度右翼、精通互联网的男性开始利用\
  \ Twitter 策划对他们讨厌的任何人发起攻击。2014 年，他们开始骚扰女性游戏撰稿作者和开发者，这场行动被称为“游戏玩家门事件（Gamergate）”。与此同时，许多在推\
  \ във服务上发过声的黑人名人或思想家一直遭受着有毒的种族主义主义骚扰。在 2016 年总统竞选期间，Twitter 就像 Facebook 和 YouTube\
  \ 一样，充斥着由俄罗斯水军工厂控制的机器人，意在传播虚假信息，通常是为了支持特朗普并加剧党派仇恨。甚至特朗普本人也像挥舞大棒一样使用 Twitter，点名针对个人批评者——其中一次还点名了一个青少年女孩——这些人随后会遭到特朗普粉丝的骚扰。\n\
  \n事实证明，斯通、多西和我关于 Twitter 创建新形式共同行为能力的看法是正确的。但我们没有谈论这项服务在纯粹邪恶这方面的巨大潜力。我们没有思考，当数亿人使用\
  \ Twitter 时会发生什么，因为这个群体比早期采用者那个狭小且相对舒适的世界要多样化得多，且冲突四伏。当我现在回想起来，那是他们（以及我）的一场极其得天真的真的对话。\n\
  \n而这指向了科技公司给公民生活带来的某些巨大挑战，因为他们编织的代码正在不可避免地改变着社会的运作方式——包括以一些其创造者们都难以预见的方式。\n\n***\n\
  \n我可以再次说，软件正在吞噬世界，尽管此时说它正在“消化”世界可能更准确。但同样值得注意的是规模至关重要这一事实。如今，一些影响最大的公民事务来自于那些真正巨型、横跨全球的科技公司，它们坐落于我们和社会经济生活的中心。正如记者弗兰克林·福尔（Franklin\
  \ Foer）所称为，“大科技公司”。\n\n事实上，现在只有极少数令人惊讶的公司主导着公共领域。有那些管理我们交流方式的公司（如 Facebook、Twitter、YouTube、Apple\
  \ 和 Netflix），触及商业的公司（Amazon、`Uber`、Airbnb），以及我们工作生活中的信息经纪人和工具制造者（Google、Microsoft）。用“大科技公司”来思考主导特定领域的软件所面临的特殊挑战是有用的方法，因为它凸显了许多此类公司享有的近垄断地位。而且它们大多数都是极其年轻的新公司。许多公司在短短十多年的时间里就取得了主导地位。它们的历史以疯狂的、类转移性的增长为特征。\n\
  \n这并不意外，因为这是软件本身的本质所决定的。软件公司交付代码，而代码在历史上是一种奇特的产品。它是一台可以执行任务的机器，但可以以极低甚至零的额外分发成本在全球范围内复制。这就像雪佛（Chevrolet）可以设计一辆康马罗（Camaro），然后瞬间将\
  \ 2 亿辆拷贝传送到美国每个家庭的车道上一样。这一事实让大公司的工程师们感到震撼，有时甚至感到震惊。在写这本书的期间的某一次，我访问了莱恩·奥尔森（Ryan\
  \ Olson），他是 `Instagram` 的首席工程师，当时他的团队刚刚发布了一项重大的更新（引入了极受欢迎的视频 Stories，那是抄袭了竞争对手 `Snapchat`\
  \ 的）。奥尔森告诉我，在他们的更新后仅仅一两个小时，他就在旧金山到处穿梭——处于加班后精疲力竭的状态——并注意到普通人正在使用他新鲜、新的 `code`。\n\
  \n“这是一个很酷的体验，”他说，“骑在火车上，或者昨晚我在攀岩馆，我转过去看发现有人正在用这个产品。我不知道历史上是否还有过其他方式可以接触到这么多的人”——或者说“有如此少数的人定义了如此多人的体验”。\n\
  \n一夜增长的快感是眩晕的、强大且令人成瘾的。这就是为什么许多编码员——特别是那些制作消费产品的人——对规模有着近乎神圣的敬畏。他们喜欢创造某种以指数速度增长的事物的想法：先被两个人使用，然后是四个人，然后八个人，很快整个该死的星球都在用。为什么，如果你能如此容易将你的创作传播到全世界，你还会想去做些小事呢？一个不以疯狂的、像葛藤一般的速度增长的\
  \ `code` 不是感觉有些悲伤吗？\n\n事实上，在硅谷的统治级人物中，对那些未能变得庞大的事物存在着某种蔑视。弱小似乎意味着软弱。你可能记得杰森·霍（Jason\
  \ Ho）的故事，这位黑客通过制作全球范围内公司使用的打卡 `code` 创建了一家蓬勃发展的小企业。它赚了大量的钱，以至于他能够花二十多岁的大部分时间自由地旅行和投资。如果我那样做，我无疑认为这是一种成功。\n\
  \n但当我向一家非常大的科技公司那位三十多岁的创始人提到霍的公司时，他嗤之以鼻。对他来说，那是“生活方式业务（lifestyle business）”——硅谷术语，指那种无法扩展到云端的想法。\n\
  \n*那种产品当然很好，*他告诉我，*但 Google 可以做同样的事并在几秒钟内让他破产。* 如果你的目标不是变得巨大，他耸耸肩问道，为什么要费此呢？这种情绪在其他软件市场（如中国）可能更为明显，那里存在着著名的竞争激烈、胜家通吃的科技市场。当我在\
  \ 2015 年访问北京电子商务公司 `Meit 团` 的办公室时，这家公司只有五岁，但正处于扩张的狂热中，以计算机专业毕业生的速度招聘年轻工程师。首席执行官王我和我俯瞰着广大的\
  \ `coders` 区域，那里摆放着数百盆植物，以让场景看起来不那么冷冰冰。“在中国，你要么变得巨大，要么就会被击碎，”王严肃地告诉我。（当我和他交谈时，科技投资者李凯复估计，光是美团一家就可能经历过了几千个竞争对手。）在高科技公司的世界里，规模化的竞赛是由胡萝卜（在全球范围内运行\
  \ `code` 的极易性）和大棒（鲨鱼般的竞争）共同驱动的。\n\n\n\n\n\n对规模的渴望也受到风险投资人指令的推动。他们将筹码押在几十甚至数百家公司上，鼓励它们所有都疯狂增长。绝大多数公司并做不到，但幸运的话，会有一两家脱颖而出——在极短时间内赚取巨额，足以抵消所有其他损失。因此，风险投资完全乐意接受一个野心勃勃的失败者。他们迷恋突然、爆发式的成功。但他们唯一认为无用且烦恼的，是一家仅仅保持稳定、或许增长缓慢的公司。即使那公司在赚小钱，又何乎呢？投资者寻找的稳定性：他们想要能带来更高投资回报的快速增长。`Y\
  \ Combinator` 加速器每年接收几十家科技公司，试图帮助他们进入顶级联赛，每期计划都以一个 `Demo Day` 结束，届时，年轻公司将在精选的风险投资者面前展示他们的产品。这些初创公司不可避免地渴望在演示中加入一张“曲球棒图”——那种显示他们的用户群突然冲向云霄的图表。\n\
  \n一天晚上，我访问了 `People.ai` 的黑客小屋，这家公司就在几天前完成了他们的 `Y Combinator demo`。他们敲击着键盘，精疲力竭地描述在\
  \ `Y Combinator` 的三个月里，他们如何疯狂地为服务注册新客户，试图产出那根曲球棒。\n\n“你想想，这三个月完全是为了建立数字——但你在你的‘增长’幻灯片上，只打算向他们展示\
  \ `10 seconds`，”联合创始人 `Oleg Rogynskyy` 说。\n\n首席程序员兼联合创始人 `Kevin Yang` 在回想起那些坐在那里、双臂交叉、等待增长数据的投资者时笑了。“难道那根曲球棒还不够像曲球棒吗？”他开玩笑道。\n\
  \n“`X` 轴必须占据页面的一半，”`Rogynskyy` 说。\n\n***\n\n... ... ...\n\n当然，规模带来了巨大的收益。对于大科技公司来说，这在财务上非常有价值！如果他们增长足够快，就能吓跑竞争对手，并形成“网络效应”的锁定。当像\
  \ `Facebook` 或 `WeChat` 这样的社交网络足够大时，用户就无法停止使用，因为所有的朋友都在那里。而且，当一家科技公司快速增长时，对用户来说也极有益。由于\
  \ `Facebook` 在全球无处不在，它现在是人们组织任何活动（无论大小）的最简单方式，从家庭聚会到政治筹款活动，再到搜救行动。近年来对警察滥用权力的关注？这部分也源于\
  \ `Facebook` 和 `Twitter` 的庞大规模——这让用户能够迅速传播恐怖且不容置疑的案例视频，包括直播视频。正是这些公司巨大的大的足迹，让普通人能够将其作为广播网络来使用。\n\
  \n但对规模的狂热追求也改变了软件公司。它不可避免地将他们推向了从狡劣到剥削不等的策略。\n\n毕竟，要以如此凶猛的速度扩大规模，你不能向用户收取任何预费用。服务需要是“免费”的。这对于社交网络尤为如此：如果每个用户都必须支付比如\
  \ `$10` 才能加入，他们无法一夜之间获得百万用户。所以，赚钱的唯一方法就是变得尽可能巨大，然后向你的受众卖广告。`Facebook`、`Twitter`\
  \ 和 `Google` 都采取了这种免费使用的模式——事实上，`Facebook` 在注册页面上自豪“它是免费的，而且永远免费。”而且广告市场对他们来说一直极其丰厚：`2017\
  \ 年`，`Twitter` 的收入为 `$24 亿`，`Facebook` 的为 `$406.5 亿`，而 `Google` 以超过 `$1000 亿` 的收入远超他们两者。\n\
  \n然而，广告改变了软件公司对待用户的本质——许多深处公司内部的程序员和设计师开始不安地察觉到这一点。\n\n其中一个技术人员是 `James Williams`。他是一个深思、富有哲学的人，在大学学习过英语，随后获得产品设计工程硕士学位，他于\
  \ 2000 年代中期加入 `Google`，担任该公司搜索广告系统的战略师。他被改善人们获取信息能力的使命所吸引。`Googlers` 总是用柔和的辞藻谈论那个使命，他很喜欢。“默认观点是‘技术越多越好’，‘信息越多越好,’”他提到。\n\
  \n但 `Williams` 最终开始注意到困扰过 `Leah Pearlman` 和 `Justin Rosenstein` 的相同副作用，这对组合帮助发明了\
  \ `Facebook` 的 Like 按钮。和他们一样，`Williams` 注意到，任何销售广告的科技公司不可避免地会有动力让用户无休止地盯着应用。毕竟，只有当有人盯着你的服务时，你才能向他们投放广告。所以你很快开始在代码中加入尽可能多的心理诱导。大科技公司会向我们用户弹发各种警报，试图在我们执行其他任务时中断我们，好让我们回到“母舰”。他们会到处贴上小小的“量化”数字，以激发我们的好奇心和“清理杂物”的欲望：*你的动态流里有\
  \ 14 个新项目！可能是什么呢？* 他们还会把所有警报设为亮红色，以增加我们扑向它们的几率。`Williams` 认为称，这些趋势在 `iPhone` 出现后进入了过热状态。\n\
  \n“在移动时代之前，互联网是有界限的，因为你可以离开它并上笔记本电脑，”他告诉我。“但一旦它进入你的口袋，就成了一个水龙头。”\n\n`Williams` 意识到，工程师很容易为这些心理诡术辩护——认为它们是好的。毕竟，他们会通过\
  \ A/B 测试来测试每一个微调：把警报变成红色，变成黄色，看看用户点击哪种更多。红色赢了，所以它一定是正确的选择！这种数据驱动的设计形式让每个心理诡术看起来都是客观正确的：如果用户点击了，那它就是他们想要的。对于规模驱动的工程师思维来说，“我们应该制造什么？”这类伦理问题很容易被转化为纯技术问题：“什么能帮助系统增长并获得更大的吞吐量？”一位匿名\
  \ Facebook 员工在 BuzzFeed 的评论中简洁地写道：“他们认为，只要某事在 Facebook 上兴起或走红——反映的不是公司的角色，而是人们的意。这种深度理性的工程师观点倾向于免除他们的部分责任，可能吧。”\n\
  \n\n\n\n\n更糟糕的是，数字广告的规定导致了对我们个人在线活动无休止的追踪。如果一家科技公司向广告商提供定制化投放我的能力，他们就想尽可能多地了解我的信息：我浏览了哪些其他网站，访问了哪些社区，我的邮件和公开帖子中出现了哪些关键词。深度学习的出现让科技公司对我们的个人信息更加渴求，因为深度学习在拥有海量“训练”数据时效果最好，数据越多，就越能预测我们想看什么广告，或者我们周一会处于什么心情。这产生了这样一个世界：`Facebook`\
  \ 甚至收集你用智能手机拨过的电话信息，正如小说家、休斯顿大学教授马特·约翰逊（Mat Johnson）所发现的那样（他在推特上开玩笑说，“酷酷，完全不诡异”）。\n\
  \n在 `Google` 期间，威廉姆斯开始对我们的注意力以及现代科技如何影响注意力进行博士研究。“没有人进入科技行业时想的是‘我想监视人们并让世界变得更糟’，”他说，“他们初衷是好的。”但商业模式有自身的推动力。\n\
  \n最终，在 `Google` 工作了十年后，威廉姆斯离开了；他后来去了牛津大学，并在那里写了《走出光芒》（*Stand Out of Our Light*），这是一本对大型科技带来的公民和存在主义危险的深刻反思。“我从地球上最新的机构之一变成了最古老的机构之一，”他苦笑着说。\n\
  \n***\n\n### 规模让算法处于统治地位\n\n为什么？因为一旦一家大科技公司拥有数百万用户——每天发布数十亿条评论，或列出无尽的待售商品——人类无法轻松管理这种规模的数据。没有人类能对其进行筛选、排序和解读。只有计算机和算法可以做到。当规模化出现时，人类的判断就被挤了。\n\
  \n这正是鲁奇·桑格维（Ruchi Sanghvi）和制作 `News Feed` 的 `Facebook` 团队面临的问题。他们不能向用户展示朋友的*每一条*帖子，因为那样让他们淹没在琐事中。他们需要自动化，需要一种只挑选你最可能感兴趣帖子的算法。\n\
  \n### `Facebook` 是如何做到的？这很难确定。社交网络不会详细讨论他们的排名系统，以防止人们操纵其算法；垃圾邮件发送者不断试图探听推荐系统如何运作，以便他们产生能被提升排名的垃圾内容。很少有公司之外的人真正了解。但通常情况下，算法提升的是你预期的内容类型：那些积累了大量点赞或“收藏”、或吸引了许多评论、转发和转推的帖子、照片和视频，并且对近期活动有特定的偏好。这些信号助力了\
  \ `YouTube` 上的“推荐”视频、`Twitter` 或 `Reddit` 上的“趋势”话题，以及出现在你 `News Feed` 中的帖子。当算法排名有效时，它是极其有用的。它能去芜取金。\n\
  \n### 排名的偏见\n\n但它也有自己的偏见。任何基于基于对对帖子的反应进行计数的排名系统，最终都会倾向于*情绪化*的内容，因为那是能获得最多反应的内容。正如学者们发现的，互联网周围的社交算法似乎都在奖励那些引发强烈情绪的内容。热点观点、触动心弦的图片和令人愤怒的标题都可能极具吸引力。一项研究发现，2017\
  \ 年 `Facebook` 上表现最好的标题使用的短语都暗示了深层的情感、*OMG* 式的好奇——诸如“会让你”、“要疯了”或“正在讨论它”之类的短语。当然，当我们谈论的是暖心的猫咪视频或昨晚剧集《爪子》（*Claws*）中的斜眼\
  \ GIF 时，这是完全无害的。\n\n但当涉及到公共领域时，这些算法可能会倾向于歇斯底里、分裂和目瞪口呆的内容。当然，这不一定是一个新问题。例如，在美国，自共和国早期以来，国家对话就一直在与人们关注琐事和完全是胡闹的倾向作斗争，那时报纸上充斥着离奇、捏造的丑闻。但算法化的排名将这一长期存在的问题推向了代谢过载状态。以\
  \ `YouTube` 为例，视频明星们竞相用越来越疯狂、越来越危险的特技来超越彼此；一位父亲因为痴迷于留住他的 200 万观众，开始发布他孩子处于活跃困境中的视频（正如\
  \ `BuzzFeed` 所描述的，他的“创伤流感疫苗!!!”视频包含了“一个小女孩的手和手臂举过头顶，她露着肚子在尖叫”）。\n\n### 偏好的过度提炼\n\
  \n我的朋友泽内普·图费克齐（Zeynep Tufekci）是北卡罗来纳大学的副教授，长期研究科技对社会的影响。她在 2018 年初认为 `YouTube` 的推荐倾向于过度提炼用户的偏好——将他们推向任何主题的极端。在看完跑步视频后，她发现推荐算法建议日益剧烈的锻炼，如超马拉松。素食视频引向硬核素食主义视频。在政治方面，这种极端化令人不安。当图费克齐观看唐纳德·特朗普的竞选视频时，`YouTube`\
  \ 开始建议“白人至上主义咆哮”和否认大屠杀的视频；观看伯尼·桑德斯希拉拉·克林顿演讲导致了左翼阴谋论和 9/11 “真相者”。在哥伦比亚大学，研究员乔纳·阿尔布莱特（Jonathan\
  \ Albright）在重大校园枪击事件后实验性地在 `YouTube` 上搜索“危机演员”一词，并点击了推荐系统的“下一个”。他迅速收集了 9000 个视频，其中很大比例似乎是专为震惊、煽动或误导而设计的，范围从“强奸游戏玩笑、震惊现实社交实验、名人恋童、‘假旗’咆哮和与恐怖相关的阴谋论，”他写道。他认为，其中一些完全出于利益动机：发布荒谬言论，进入推荐系统，并从中获利。\n\
  \n换句话说，推荐系统可能偏向“煽动性内容”，图费克齐指出。另一位学者雷妮·迪雷斯塔（Renée DiResta）在 `Facebook` 的“小组”推荐系统中也发现了相同的问题。阅读疫苗帖子的人被敦促加入反疫苗小组，进而进入致力于“云雾”等更疯狂的阴谋论小组。迪雷斯塔得出结论，这些推荐机制本质上创造了一个阴谋论观点不断繁殖和倍殖的漩涡。\n\
  \n\n\n\n事实上，这正是推荐算法在世界各国所引发的问题。在上一届美国联邦选举中，极右翼势力——包括俄罗斯政府（通过旨在在美内部制造分裂并支持唐纳德·特朗普的“水军工厂”）——发现，经过算法排序的、极具情绪化的社交媒体是一个非常有用的杠杆。从\
  \ `Facebook` 到 `YouTube` 再到 `Reddit` 和 `Twitter`，虚假信息和阴谋论野盛生长。\n\n有臭名昭彰的“披萨门”（Pizzagate）阴谋论，声称希拉里·克林顿在华盛顿的一家餐厅经营儿童性团集团；还有梗声称克林顿杀害了一名民主党工作人员。与此同时，在知名度不高的右翼网站制作的白人民族主义梗，利用\
  \ `Facebook`、`Twitter`、`YouTube` 和其他社交网络进入主流。社交媒体让人们通过关注和添加主要是与自己观点认同的人更容易建立意识形态回声室，这无疑无上加厉。这使得他们更不可能遇到对某些虚假信息或种族主义梗的辟谣。此外，选举搅局者极易使用“机器人”（`Twitter`\
  \ 或 `Facebook` 上的虚假自动账户）为阴谋论帖子点赞，使其看起来具有虚假的人气。极右翼操作者和俄罗斯水军工厂变得精于利用机器人诱导推荐算法抓取他们的帖子，将这些帖子推给远比这些边缘水军自己能管理得多的受众——并通常通过那些对所有这些高赞在线梗感到震惊的记者，进使这些内容进入更广泛的主流媒体报道。\n\
  \n在选举前的几年，社交网络似乎只隐约地意识到了这些协调的政治活动正在增长。诚然，`Facebook` 知道人们在他们的服务上传播愚蠢的谎言。他们长期以来一直收到关于此类问题的投诉。2015\
  \ 年 1 月，他们发布了一个新的垃圾信息举报选项，允许用户将 `News Feed` 帖子标记为“假新闻”。但在媒体对选举干预进行报道之前，正如之前的员工告诉我的那样，极右翼或外国团体可能正在积极合作操纵他们系统的想法，并没有被广泛纳入关注范围。\n\
  \n“我不认为当时对此有良好的认知，”曾在 2015 年至 2017 年于 `Facebook` 负责隐私和公共政策的 Dipayan Ghosh 告诉我。正如\
  \ `Buzzfeed` 发现的，一位 `Facebook` 工程师发现，极具党派色彩的右翼内容工厂从 `Facebook` 获得的引流流量是最高的。但当他将其发布在内部员工论坛时，“有一种普遍的感觉是：‘是的，这确实很疯狂，但你想让我们对此怎么办？’”\n\
  \n诚然，那些奖励极端表达的系统在美国令人困扰。在印度等部分国家，这些系统可以说演变成了一场更大的噩梦——印度的 `Facebook` 用户比美国还多，那里执政党开始雇佣大量人员针对对手和记者撰写骚扰性的、充满仇恨的信息。一种激进的反穆斯林运动利用\
  \ `Facebook` 发布屠杀穆斯林的神权主义号召。在菲律宾，罗德里戈·杜特尔利用 500 名志愿者和机器人生成虚假故事（“甚至教皇也佩慕杜特”）并骚扰记者。\n\
  \n即使是社交媒体的广告网络也被试图破坏美国政治的外国势力所利用。2018 年春春天，美国特别调查员罗伯特·穆勒揭露，“拥有各种俄罗斯政府合同的俄罗斯实体”已购买数月的社交网络广告，攻击希拉里·克林顿，并支持她的主要竞争对手唐纳德·特朗普和伯尼·桑德斯。但理解他们为何发现这条路线并不困难。`Google`、`Facebook`\
  \ 和 `Twitter` 的广告技术专门用于帮助广告主精准投放非常狭窄的领域，这使其成为他们想要用阴谋论和虚假信息煽动美国公民的完美方式：不满、愤怒且带有种族主义的白人，以及对新自由主义感到愤怒的左翼活动分子。精准投放是制造分裂的绝佳工具，这意味着每个扭曲、愤怒的群体都能获得自己的定制信息，来肯定他们的愤怒。\n\
  \n这一景象让 Ghosh 感到震惊。在他离开 `Facebook` 后，他为 `New America` 写了一份报告，认为“广告技术市场的形式完美适用于虚假信息操作的功能”。政治错误信息“吸引并留住消费者注意力，从而为互联网内容产生收入。一次成功的虚假信息活动会交付一个高度响应的受众。”\n\
  \n广告技术是快速扩展网络业务的引擎，是“导致我们所看到的所有负面外部性的核心业务模式，”他告诉我。“核心业务模式是创造一种极具吸引力且边缘成瘾的体验，如 `Twitter\
  \ feed` 或 `Facebook messenger` 或 `News Feed`。”\n\n所有这些前员工都告诉我相同的事情：没有任何构建这些系统的人希望过坏事的发生。没有人醒来时想过：*我今天想去创建一个侵蚀公民社会和同之间信任的系统*。但大科技巨头的驱动力——对规模的追逐、“免费”的广告世界、强迫性的参与——还是将他们推向了那里。\n\
  \n“`Facebook` 不偏爱仇恨，”Vaidhyanathan 总结道，“但仇恨偏爱 `Facebook`。”\n\n***\n\n为什么在 00 年代中期构建这些工具的工程师和设计师，没有预见到他们的平台会被以这种黑暗的方式使用？为什么他们花了这么长时间才做出反应？\n\
  \n当你与某些参与构建社交媒体工具的人交谈时，他们认为这在某种是工程思维的副作用。构建社交网络的程序员和设计师在软件、逻辑、系统、效率以及将大问题拆解为小问题方面非常擅长。但他们是一群主要是年轻、白人、通常受过大学教育的年轻人，他们对世界的复杂性、政治、以及除自己以外的人如何生活知之甚少。或许糟糕，正如唐纳德·鲁姆斯菲尔德著名的公案一样，他们并不知道自己不知道。那时是“有趣的”，是一个处女领域，创建工具让人们能够以新的方式彼此交流。*更多的沟通*怎么会是坏的呢？\n\
  \n“我看到很多在非常狭窄领域非常聪明的人，”`Twitter` 的早期程序员 Alex Payne 说道。他们的狭窄体现在‘一种与人文科学并不交集的方式’。人们只是对数学和统计学、显然还有编程、商业和金融感兴趣，但对人性完全没有洞察力。他们的智力工具箱里没有任何东西可以帮助他们理解人类。”\n\
  \n\n\n\ndanah boyd 是我的朋友，她是一位技术专家也是人类学家。她记得在社交媒体早期曾参与过一个研究 MySpace 的项目，并把创始人汤姆·安德森（Tom\
  \ Anderson）带到苹果 Apple Store，观察真实的青少年是如何使用该服务的。创始人们并不总是对个体如何使用或如何受到其服务影响有细致的感知。从工程师的角度来看，社交网络是一个他们试图优化的图结构；很难感知或关注到具体的某个人以及他们会做什么。事实上，我经常发现某些编码者的世界观就像经济学者的反社会人格式的观点：他们的模型可能会说经济整体状况良好，但对于一个在\
  \ 49 岁被裁员且再也无法获得高薪的特定个人来说，这毫无慰藉。构建大型系统的工程师和那些拥有模型的经济学家一样，从整体上看世界，而不是从局部。“科技社区的危险之一在于，他们对数据模型的痴迷意味着他们忽视了基于这些模型的人性，”boyd\
  \ 说，她如今运营着 Data & Society 智库。\n\n我的朋友 Anil Dash 在 20 世纪初为博客公司 Six Apart 工作了七年；如今他是社交编程公司\
  \ Glitch 的 CEO。正如他所主张的，他和所有其他构建社交媒体的技术人员都被“大卫战胜歌利亚”的叙事所吸引。他们推崇那种黑客式的理想，即创造出颠覆现有行业（在此例中是媒体行业）的东西。他们能够准确地预测到好处，但由于他们对世界的看法过于天真，却难以预见其坏处。\n\
  \n“我们总是在进行这样的对话：‘这将改变媒体，这将消除守门人，并将赋予广大政治运动力量！’他告诉我。“所有这些观点都是正确的。但在其中任何一点中，我们都没有预料到负面影响。围绕某事进行大规模组织并在社交媒体上分享的想法，这曾是一个目标，是我们想要实现的。然而，围绕一个`谎言`进行大规模组织的想法并不在叙事范围内。”我意识到，这也是为什么我本人没有预见到像\
  \ Twitter 等平台上会出现滥用滥用的泥潭；那时，我也被卷入了同样的神话式观点中，而且我是一个对网络骚扰几乎没有个人经验的中年男性。我与那些创始人一样天真。此外，Dash\
  \ 指出，真正巨大的规模本身就是难以想象的。“我们无法预见到会有数十亿使用这些服务，”他说。“我埋怨我们没有预测到这一点，但我认为没有谁比我自己更有责任。”\n\
  \n当然，伦理盲点并非编码所特有。从历史上，许多形式的工程都存在一种埋头专注于技术挑战的文化，很少抬头思考其工作对社会的影响，正如斯坦福大学研究硅谷的传播学者\
  \ Fred Turner 告诉 `Logic` 杂志时所说。\n\n“工程文化是关于制造产品的，”他说。“只要你让产品运行起来，你就已经完成了你职业伦理要求你做的一切。工程伦理是一种这样的：它好用吗？如果你制造了某种好用的东西，你就做了符合伦理的事。这就像汤姆·莱尔（Tom\
  \ Lehrer）歌曲中那句名言：‘一旦火箭升空，谁还在乎它们落在哪里？那不是我的部门，’冯·冯·布劳恩（Wernher von Braun）说道’”***\n\
  \n... ... ...\n\nTwitter 是这些盲点如何在代码和设计的实际决策中发挥作用的一个实例。\n\n正如之前的员工告诉我的，早期，许多工程师被\
  \ Twitter 的理想化使命所吸引——一个让人们向世界说话的平台。一位员工曾有名地将 Twitter 称为“自由言论党的自由言论派侧翼”：它的早期创建者坚决拒绝删除帖子，无论这些内容多么令人反感或腐蚀。这种态度并非\
  \ Twitter 所独有。硅谷许多年轻、男性占多数的技术群体都具有这种程序员特有的、反感被指派该做什么的敏感情绪——当局外人士告诉他们`你必须删除这些侮辱性帖子`时，他们会感到防御。“这里有一种对自由言论的极端忠诚，”一位前\
  \ Google 员工告诉我，“这种感觉就像是：‘我们必须允许他们留在平台上，尽管我完全不同意他们。’”\n\n前员工告诉我，在 Twitter 上，一些员工并不喜欢在德国删除关于纳粹或纳粹摆记物品的帖子，因为当时\
  \ Twitter 在那里上线，且当地法律要求如此。他们认为像 Twitter 这样的网络服务应该像电话公司一样拥有“公共载体”地位，要求他们向公众提供无差别访问，同时尊重用户的隐私。此外，其他\
  \ Twitter 员工确实并不怎么关注 Twitter 的社会影响，或者这些关于纳粹和言论的辩论。他们只是想写代码。Payne 指道：“有人只是对能参与一个正在兴起的项目感到兴奋。”仅仅是按规模发布实时软件，而不是在一个正在死掉且无人使用的\
  \ App 上修修补补，就是令人兴奋不已的。\n\n在 Twitter 服务上演变的社会问题被证明是复杂得令人抓狂的。到 2010 年初，很明显，某些 Twitter\
  \ 用户正在熟练地利用该服务参与协调的骚扰活动。\n\n再次，最为人知的例子是 Gamergate，这是一次骚扰活动，其中一群主要是男性的人不断骚扰了谈论和撰写游戏性别歧视问题的女性游戏设计师和游戏评论家，比如\
  \ Anita Sarkeesian。骚扰者使用的一种策略是“围攻”：他们选定一个目标并用大量的 `@-replies` 轰炸她的账号，有时使用机器人，数量之大以至于目标几乎无法使用\
  \ Twitter。受害者登录后会发现成百甚至上千条侮辱性信息；与人们进行的真实对话在仇恨洪流中迷失了。此外，每小时收到称你为`婊`、威胁要强奸或杀死你、或者对你进行`人肉搜索`的推带有心理影响。旁观者会懒散地声称目标应该直接`离开\
  \ Twitter`，当然。但对于大多数大多数目标来说，这并不是一个容易的选择。他们大多数是专业作家和游戏设计师，而 Twitter 已经成为专业人士发布活动和推销自己的重要公共领域。正如法律学者\
  \ Danielle Citron 所认为的那样，Twitter 是一个事实上的工作环境。留在 Twitter 上对于维护你的声誉至关重要。骚扰活动敏锐地捕捉到了这一事实并利用它对付目标。\n\
  \nGamergate 只是滥用活动的开始。事实上，它可以说是主赛事的预演：2016 年选举，在那场选举中，一些首创厌视女性群体骚扰的在线论坛现在拥抱了白人民族主义和唐纳德·特朗普。因此，他们带上了训练有良的骚扰技巧，开始对付任何反对特朗普的人。显然，与选举相关的滥用不仅发生在\
  \ Twitter 上。但 Twitter 高度开放的性质——任何公共账户默认都可以回复任何其他公共账户——以及它在新闻周期中的中心地位，使其特别有利于被劫持用于选举欺诈。在竞选期间，公开的白人民族主义者和其他反犹太人分子围攻并人肉搜索了记者、克林顿支持者的无数黑人名人。`纽约时报`的编辑\
  \ Jonathan Weisman 在遭受了如潮的反犹太威胁后离开了 Twitter；演员 Leslie Jones 在遭受了种族歧视词汇的攻击后也辞职了。\n\
  \n\n\n\n\n学者、前广告高管萨菲亚·乌莫贾·诺布（Safiya Umoja Noble）——《压迫算法》一书作者认为，社交媒体天真之处在于，它们只设想了个个人作恶的可能性。他们理解人们试图推送垃圾信息（如垃圾邮件）的危险，但他们未能想象协调的*群体*可能会劫持他们的服务。她说：“所以，当你看到这些白人民族主义团体或来自\
  \ `4chan`——一个拥有多个极端种族主义和厌女女性主题的在线讨论板——的人同时出现，从多个方向同时攻击一个目标时，他们并没有预料到那会如何发展。”\n\n\
  前 Twitter 员工也同意，游戏门事件（Gamergate）的动态以及成群的骚扰机器人让公司措手不及。Twitter 长期以来拥有尝试检测垃圾邮件人的工具，但那些工具的设计是为了定位垃圾邮件的特征：即单个账户向大量其他人发送推文。正如这些前员工指出的，Twitter\
  \ 缺乏检测反向情况的工具——即一组分散的账户突然向单一目标发送洪流般的流量。不过，他们确实有一些反骚扰工具。阻止功能允许你防止骚扰者关注你（尽管骚扰者仍可以通过手动检查你的账户来看你的推文）。他们还考虑过设计过滤器，根据语言的使用自动检测并封禁辱骂性推文。但语言极其难以解析。正如一位工程师告诉我的，一条仅包含\
  \ `Slut`（淫妇）一个词的 `@` 回推文，可能是两个女性之间的开玩笑玩笑，也可能是作为群起围攻（dogpile）一部分的敌意攻击。\n\n这名工程师说：“公司内部确实有人考虑过[骚扰]并对此表示关心。”但总的来说，工程师们对这种新虐待世界的运作方式是“天真到极点”。Twitter\
  \ 的年轻人们对问题的规模几乎没有直觉，这导致在游戏门事件进行期间，他们甚至很难意识到情况已经变得多么糟糕。尽管他们处于优势地位——坐在整个工具的顶端——但要预见到这种正在发展的新公共领域虐待并不容易，它后来成为了\
  \ 2016 年选举中白人民族主义和俄罗斯机器人农场活动的模板。\n\n这位工程师说：“我绝对回看 2016 年发生的事情以及选举中的变故，如果 Twitter\
  \ 能及时跟进并找到处理游戏门事件的方法，情况可能会不同。而我们没有。我们的反应就像是在处理孤立事件。安妮塔·萨基希希安（Anita Sarkeesian）——我们没有听取她的。”公司内部确实有人争论，认为应该更积极地应对虐待和虚假信息，但他们的诉求从未上升为首要任务。\n\
  \n“许多*人*很很了解虐待问题，但*组织*并没有，”前 Twitter 工程师雅各布·霍夫曼-安德鲁斯（Jacob Hoffman-Andrews）在邮件中告诉我。他长期以来一直支持\
  \ Twitter 对用户不干预的方法。“如果有人在骚扰你，就封掉他们”这个想法对他来说是个好主意。封禁就足够了；Twitter 不应该从事挑选账户和个人推文进行封禁的业务。他想，“如果我们依赖平台运营人员来‘解决’骚扰，他们犯错的概率会比对的概率大。”这在非英语国家特别可能是真的，因为\
  \ Twitter 以美国为中心的管理层几乎没有实用的当地知识。\n\n但当他观察群起围攻是如何运作的时，他开始怀疑新的策略是必要的。让被骚扰的用户每周——每天——花几个小时封禁那些围攻他们的账户？这似乎是不公平的。于是，霍夫曼-安德鲁斯开始思考如何用巧妙的代码来解决这个问题。他于\
  \ 2014 年离开 Twitter（出于无关原因），在随后的几个月里，他开始编写一个名为 `Block Together` 的应用程序。它让你创建一个你封禁的账户列表并将其与朋友分享，例如。如果他们订阅了你的列表，你封禁的任何账户也会被他们屏蔽。反之亦然：如果你订阅了别人的封禁列表，每当那个人封禁一个\
  \ Twitter 账户，它也会被屏蔽。所以如果一群用户都被同一大厌女女性团伙攻击，他们可以快速建立起集体防御。正如霍夫曼-安德鲁斯提到的，这个想法是“通过分享来减轻负担”。\n\
  \n他在游戏门事件爆发前发布了 `Block Together`，该工具在被针对的女性中流传开。看来，创新的工程确实有助于缓解 Twitter、Facebook\
  \ 和 YouTube 陷入的问题。这些社交网络只需要将其列为优先事项即可。\n\n***\n\n到 2018 年年中，繁华不再。大型社交网络遭到了公众批评的“科技反噬”（techlash）冲击。\n\
  \n他们的高管层都被传到国会，就指责俄罗斯分子如何利用他们的系统干预 2016 年选举。剑桥分析（Cambridge Analytica）丑闻爆发，显示了该公司如何抓并使用数百万\
  \ Facebook 用户的个人信息来投放政治广告。因此，科技巨头公司开始开展道歉活动，并断断续续发起了更有雄心的尝试来修复他们发现的问题。YouTube 宣布了措施，试图限制在新闻发展期间提高虚假视频的排名。Facebook\
  \ 开始对其 `News Feed`（新闻动态）进行一系列草率调整，包括减少显示的新闻网站总数。Twitter 推出了改进的工具来帮助用户管理攻击；他们还删除了\
  \ 7000 万虚假账户，即那些旨在传播垃圾邮件、虐扰或虚假信息的账户，其中包括大量伪装当地报纸的俄罗斯账户。当我与 Twitter 产品经理大卫·加斯卡（David\
  \ Gasca）交谈时，他说应对虐待和 Twitter 的健康状况已上升到公司工作的顶端。“在过去的几年里，一直是首要任务，”他补充道，“我认为现在已经得到了充分认可。”他指出，这也是一个不断变化的目标。Twitter\
  \ 的设计人员和工程师经常应对新形式的恶行为。例如，最近在日本，一些用户通过发布“昆虫孵化的图像”来骚扰他人，加斯卡提到这一点。在美国，这不会被认为具有攻击性；但在日本，却是。\n\
  \n“你如何处理这种情况？”他反义地问道，“我们的规则应该禁止发布昆虫、昆虫图片——以及如何？在范围内？仅在日本？在什么情况下？”\n\n对于 Twitter\
  \ 来说，就像大多数社交网络一样，应对恶行为需要以这种方式不断演进规则，这需要一系列不断的决策和调整。这需要他们的审核人员了解规则现在的确切内容。然后是软件方面的潜在调整，范围从推出反垃圾邮件\
  \ AI 到重新思考 Twitter 运作的核心部分。\n\n\n\n\n“每当你有大量的讨论时，真的很难追踪对话内容并弄清楚你该回复谁，”他指出，“你 `already`\
  \ 回复过某人了吗？” 尤其是那些拥有大量粉丝的用户，几乎没有工具可以帮助管理海量的互动。他指出，一个深层的原子级挑战是，Twitter 的核心表达单位是 `tweet`（推文），而不是线索。也许\
  \ `that` 可以成为改变的一部分？\n\n一些以前的批评者对 Twitter 在减少骚扰和调整服务方面的工作表示欢迎。布里安娜·吴（Brianna Wu）是一位游戏设计师，她曾在“游戏门事件”（Gamergate）期间收到死亡威胁后曾逃离家。她发现\
  \ Twitter 的工作显著改善了她的体验。“我现在收到的大多数死亡威胁要么是 Facebook 发给我的，要么是通过邮件发送的，因为 Twitter 在我看到它们之前就能有效地拦截它们，”她告诉了\
  \ `Fast Company.`。（这种赞誉程度显示了公民领域已经堕落到了何种程度：吴仅仅因为她的死亡威胁数量 `reduced` 了就感到高兴了。）其他人则没那么印象。一些\
  \ Twitter 用户仍然抱怨说，当他们举报包含针对其个人的直接威胁的推文时——这在技术上违反了 Twitter 的政策——这些推文并没有被删除，或者只是被不规律地删除。历史学家玛丽·希克斯（Marie\
  \ Hicks）说：“我可以举报诸如 `you fucking cunt` 之的话，但它并没有被封禁。”\n\n如果 Twitter 付费裁决举报推文的人工审核员不堪不堪，这并不意外。Facebook\
  \ 和 Google 也是如此。这些公司也对技术抵制（techlash）出了反应，宣布他们正在招聘越来越多的人工审核员，他们的工作是审查被举报的帖子、图片和视频。审核员非常多：Facebook\
  \ 承诺在 2018 年底前雇用 1 万人，Google 则在 2017 年表示它正在招聘 1 万人来审查 YouTube 视频。这些审核员工作是网络空间中最糟糕、最不讨人欢的职业之一。他们一整天都在试图判断一个被举报的帖子是否违规——它是仇恨威胁、色情还是类似的内容。这意味着他们每天都要花几个小时盯着具有心理创伤的内容，例如虐待儿童的暴力图像或青少年自杀未遂的直播。鉴于这些员工精疲力竭且压力过大，他们会出错并不意外——无意中封禁非禁止材料，或者放过了真正具有威胁的材料。\n\
  \n但这些再次是规模化带来的棘手问题（wicked problems of scale）。科技巨头公司想要大规模扩张，它们也做到了。全球每天有数以亿计的帖子在科技巨头的\
  \ Feed 流中流过。假设我们认为运行服务的每一个人都具有绝对的善意——他们完全致力于应对他们的工具可能被用于恶意、滥用或伪造的各种方式。假设他们想要摆除所有这些坏分子。这真的可能吗？\n\
  \n目前尚不清楚。可以肯定的是，在这些社交网络所面临的规模面前，人工审查将难以应对。但技术可能也无法完全解决这一问题。这并非言绝对的。除了招聘人工审核员外，科技公司还承诺推出越来越微妙的\
  \ AI 来自动识别奸计行为。这无疑是程序员处理问题的方式：`Automate the decision making! Do it with sleek, machine\
  \ efficiency!` 但正如我们在前面的章节中看到的，机器学习在处理边缘情况（edge cases）——即人类行为中微妙且模糊的维度时一直很挣扎。白人至上主义的梗图者创作的图像并非容易识别；他们并不总是发布���字和\
  \ `NAZIS RULE` 的标题。不，他们只是取一张看似无害的公众人物照片，加上一段文字，然后变戏：一个全新的、针对白人民族主义的讽刺号召。去图像版 `4chan`，你会发现年轻男人们整天每小时制作几十个此类内容，并在社交媒体上传传。正如萨菲亚·诺布尔（Safiya\
  \ Noble）所主的，“机器学习跟不上这一点。”\n\n维迪亚纳坦（Vaidhyanathan）在评价 Facebook 时认为：“我无法想象任何单一的技术发明或政策干预能从根本上解决他们的问题。”当他看向海外时，这一点更加真实。例如，考虑在缅甸雇佣人类来标记滥用行为的困难性。“你需要不仅会缅甸语，而且对仇恨号召敏感的人，”他指出道，“但随后你需要内容准则，然后你需要找到成千上万不认同种族灭绝号召、反抗他们政府的人。因为那是\
  \ Facebook 想做的，他们想在 `Myanmar` 雇用成千上万的政治异见人士。他们将不得不面对种族灭绝。”即使在美国，Facebook 也制定了似乎极度政治天真的政策：2018\
  \ 年夏天泄露的一份文件显示，虽然它封禁了赞美“白人至上主义”的帖子，但它对赞美“白人民族主义”或“白人分离主义”的帖子没有意见，尽管种族主义者采用后两个术语恰恰是为了洗白自己的名誉。\n\
  \n维迪亚纳坦说，扎克伯格（Zucker）和每个运营 Facebook 的人都是聪明的，现在似乎意识到了他们扭曲全球的力量所带来的挑战。但仅仅聪明可能是不够的。维迪亚纳坦不确定什么才足够。“我不认识有多少人可以说\
  \ `are` 胜任运营 Facebook 的任务，”他补充道，“它是如此庞大，并沉浸在这么多人的生活中。这可能是一个不可能的任务。”\n\n同样不清楚的是，当公司像\
  \ Facebook、Twitter 或 YouTube 这样巨大且处于核心地位时，是否存在所有人都能同意的内容政策会被滥用。正如技术思想家谢尔基（Shirky）指出的，反对白人至上主义者和右翼阴谋论者一直在向科技巨头施压，要求他们此类内容。但这不能保证公司会以进步派喜欢的方式行使这种权力。他告诉我：“自由派真的想把决策权交给一家私营公司吗？”他在\
  \ `Washington Post.` 中写道，“在我们匆忙接受一个默认由少数私营公司管理的互联网之前，我们应该非常谨慎，因为一个控制着这么多话语权的平台会经常删除帖子并注销账户。一旦内容审核这样的系统成为常态，权力者不可避免地会利用它们。”\n\
  \n\n\n\n\n事实是，只有深层的、结构性的改变才能从根本上改变科技巨头的轨迹。各大科技公司都积累了同样的权力——并产生了相同的问题——这是因为治理代码的大结构性力量：谁编写代码、谁资助代码以及它是如何盈利的。这些是重心。因此，改变软件唯一方法就是改变这些。\n\
  \n### 谁在编写软件？\n\n来看第一个：谁在编写软件？如果社交网络的问题之一是其同质化创始人专业知识狭窄，那么一个有效的做法就是让软件编写者实现多样化。想象一下，如果早期构建\
  \ Facebook 或 Twitter 的工程师中，包含了更多因身份问题而遭受网络骚扰的人：多几个女性、黑人美国人、跨性别者或拉丁裔的程序员和设计师。他们可能会更警觉地意识到这些平台未来可能被滥用者劫持。这可能无法解决那些下游问题，但可能有助于缓解这些问题。\n\
  \n### 改变风险投资者的优先级\n\n其次，改变风险投资者的优先级将产生巨大影响。正如 danah boyd 指出的，第一代社交网络是由技术人员构建和资助的，他们将“连接人们”视为唯一目标。他们天真地希望所有棘手的事情——让人类真正理解彼此、弥合他们巨大的政治分歧——会自动发生。事实并没有发生，也不可能发生。仅仅创造“信息流”，正如\
  \ Zuckerberg 在 Facebook 早期所宣称的目标（正如他的前员工 Kate Losse 所描述的那样），是不够的。（boyd 对 Zuckerberg\
  \ 持续将 Facebook 全球 20 亿用户——涵盖从德克萨斯州到伊斯兰巴基再到雅加达的人——称为“社区”感到特别恼火。这显示了他对社区真正含义的持续误解：一群拥有共同纽带并相互信赖的人群。）\n\
  \n她说，下一代资助者需要对他们投资的技术提出不同的规格。目标不能仅仅是连接人们。下一阶段是开发专门的工具，帮助人们跨越生活经验和价值观的巨大鸿沟。\n\n“想象一下，如果\
  \ VC 和资助者要求旨在消除社会隔阂的产品和干预措施，”她在她关于科技未来的文章中写道，“我们如何才能超越眼前的利益，构建未来的社会基础设施？”从乐观的一来说，硅谷可能对这种转变有着兴趣。当她与该领域的长期资深极客交谈时，他们似乎对自己造成的后果感到不安。对他们来说，“这种感觉没有以前那么有趣了，”她告诉我，“感觉我们只是在尝试做善事！但这些东西似乎在适得其反。”\n\
  \n### 避开规模陷阱\n\n而且科技需要开始绕过规模的陷阱。Glitch 的 Anil Dash 认为，拥有创业想法的程序员应该考虑避开风险投资——或者尽可能少地接受投资。这是因为投资者会坚持“冰棒式增长”，而这会将公司推向糟糕设计的滑滑坡。它扭曲了\
  \ Dash 接触的几乎每一个年轻技术人员。“我们必须增长！”他们恐慌地告诉他。*为什么你必须增长？* “嗯，因为我们必须实现这些目标。”*为什么你必须实现这些目标？*\
  \ “嗯，投入我们风险投资资金的有限合伙人期望在六年的周期内获得回报，而我们已经过了五年了，如果不疯狂增长，我们绝不可能成功。”他指出，理解盲目增长带来的巨大伦理风险对于技术人员来说并非与生本能：“这些中没有显而易见的，而且计算机科学专业课程也不教这些内容。”诚然，Dash\
  \ 的建议对初创公司来说很难执行。许多公司需要投资才能起步。如果这种文化要转向不再推崇狂热增长，这可能会缓慢发生。\n\n### 摆脱广告依赖\n\n而改革当今社交软件的最后一块木板就是使其摆脱广告。\n\
  \n正如前谷歌员工 James Williams 所指出的，试图将注意力货币化的广告是导致程序员和设计师对用户产生“敌意”对待的原因。相比之下，不依赖广告的软件可以专注于提供用户切切需要的。例如，维基百科的管理层在历史上决定直接从用户那里筹集资金，而不是投放广告。正如\
  \ Sue Gardner 指出的，这意味着它不需要欺骗用户进行无尽点击，或追踪他们在在线上的每一个动作。维基百科的设计是为了帮助你找到需要的文章，然后迅速离开。“我们的欲望与用户的欲望一致，”她告诉我。Gardner\
  \ 认为，正是这一原则让 Apple 在手机和笔记本电脑内置隐私和加密方面比其他公司做得更好的原因。Apple 的客户预付了技术费用。\n\n“当你的客户给你钱时，你实际上可以称他们为客户而不是用户（后者是毒品交易的术语），”David\
  \ Heinemeier Hansson 开玩笑道。他是一个程序员，目睹了基于广告业务在 90 年代互联网泡沫中崩塌，因此决定只编写人们愿意付费的软件。于是，他开始制作一个名为\
  \ `Basecamp` 的组织工具，并收取相对低的订阅费；很快，他就雇佣了数十人并服务了大量的付费客户，而无需追踪他们或欺骗他们过度使用他的产品。\n\n“和你付钱的人之间存在一种神奇的关系，”他告诉我。他补充说，这意味着他的公司没有充斥着“增长黑客”营销人员、广告人或“业务开发”小虫。他雇佣的几乎每个人都是程序员或设计师，致力于解决客户的真实问题。“你可以成为一家建设者公司，”他说，“那是一种很棒的感觉。我们留在这里是为了建立一家长期的、可持续的公司。”\n\
  \n当然，这些并非总是一成不变的规则。广告有它的捍卫者。正如 Twitter 和 Facebook 员工多年来对我指出的那样，如果他们对服务收费，将推开数百万低收入人群——以及发展中国家的数十亿人。这些人中的许多从社交媒体中享受了巨大的个人和经济利益，但如果要求每月支付一美元，他们根本没有机会。\n\
  \n尽管如此，考虑这些改革——并思考许多问题是重要的。代码的公民作用只会不断增长。我们需要远见和实验来应对它。关键是，我们需要倡导者，将这种愿景带入科技行业的核心。\n\
  \n\n\n\n但在过去的几年里，对工作的不满情绪开始悄然滋生。他开始讨厌在“谷歌大巴”上长达 1.5 小时的通勤。除了在交通中浪费了大量时间外，巴士还成为了旧金山山人的众雷桶，他们愤怒于富裕科技工人的涌入推高了市内的租金。与此同时，一些员工对谷歌高管近期向特朗普政府的公开接触感到不安；`Larry\
  \ Page` 在总统就职后不久的一场科技圆桌会议上与 `Trump` 会了面，这引起了几位直言员工的不满。Breisacher 和其他同事最近也发现，在每周员工会议上，当员工对公司活动提出伦理异议时，谷歌高管越来越倾向于给出模糊的敷衍。“你会得到这种模棱糊的回答，就像你从政客那里得到的那种回答，”Breisacher\
  \ 说，“‘你提出的观点很好，我们正在调查。’”\n\n随后，在他工作的第七年，一场真正的争议爆发了。2017 年秋季，一组谷歌员工得知公司正签署了一份为美国国防部构建\
  \ AI 的合同。谷歌加入了五角大楼的`Project Maven` 项目，该公司正帮助军方开发用于识别无人机素材图像的软件。\n\n正如一位化名用“Kim”的谷歌员工告诉\
  \ *Jacobin* 杂志的那样，员工们向谷歌云负责人 `Diane Greene` 表达了他们的担忧。但在几个月后，“很明显的是，谷歌员工的努力没有任何进展。公司正在全速推进该项目，”Kim\
  \ 补充道。于是，心存疑虑的员工在谷歌内部社交媒体平台上写了一个帖子，解释了 `Maven` 并描述了他们对它的担忧。\n\n现在，公司内部更多员工感到深感不安。他们加入谷歌是因为想组织信息——而不是为了帮助军方更好地锁定外国人的目标。Breisacher\
  \ 回忆道，同事们的担忧语调是：“等一下，发生什么了？我们在做什么？”随着不满情绪的升温，最初的抗议者起草了一封写给谷歌首席执行官 `Sundar Pichai`\
  \ 的信，要求他取消 `Maven`，并将其发布在内部论坛上。“我们相信，谷歌不应该从事战争业务，”信中写道。\n\n反响是剧烈的：在不到一天的时间里，有一千名谷歌员工签署了该信。到\
  \ 2018 年 4 月初，签署人数达到了惊人的 3,000 人。公司一些顶尖的 AI 人才对军事工作表示强烈反对：当谷歌在 2014 年收购精英 AI 实验室\
  \ `DeepMind` 时，其负责人坚持认为任何发明都不应被用于武器。\n\n谷歌试图通过召开全员会议来管理员工的反抗，员工可以在会议上讨论他们对 `Maven`\
  \ 项目的沮丧。但正如 Kim 指出的，“领导层遭到了严厉批评”：在一次超长会议上，一位在谷歌工作了十三年的女性说：“我和你们在一起工作了这么久。但这是我第一次诚实地说我不信任你们了。你们为什么不主动联系我们这些员工呢？你们为什么不问问我们是怎么想的？”\n\
  \n员工们，管理层对发生的情况并不坦诚，这毫无帮助。谷歌高管最初告诉员工，`Maven` 是一份规模较小的合同，价值仅 900 万美元。但随着员工反抗的消息传出，媒体对\
  \ `Maven` 的报道揭露了它实际上是谷歌竞标价值数十亿美元的更大国防合同的一部分。（事实上，在幕后，谷歌非常担心事情在媒体上的反响。《纽约时报》后来获得了公司首席\
  \ AI 科学家 `Fei-Fei Li` 的泄露邮件，她在邮件中建议对 `Project Maven` 合同的性质保持谨慎。“不惜一切代价避免任何提及或暗示\
  \ AI，”她写道，“在涉及 AI 和数据方面，谷歌已经在与隐私问题作斗了；如果媒体开始抓住谷歌正在秘密制造 AI 武器或为国防工业提供武器的 AI 技术这一主题，我不知道会发生什么。”）\n\
  \n到春末，一些员工感到足够沮丧，决定直接离开。毕竟，嘿，他们是科技工作者。他们有很多其他选择。硅谷的初创公司正在竞相人才；任何简历上有谷歌背景的程序员或设计师都会被瞬间抢走。这给了他们根据自己的道德立场采取行动的自由。\n\
  \nBreisacher 就是其中之一。“如果你有奢侈去选择工作地点，因为软件工程仍然很有需求——谢天谢地——那么为什么不在一个与你的价值观更契合的地方工作呢？”他告诉我。到\
  \ 4 月，他已经找好了另一份工作并交了辞职信。在几周内，他是大约十几个辞职者之一。\n\n不久后，谷歌退缩了。内部员工的压力和外部的谴责似乎太难以承受了：2018\
  \ 年 6 月第一周，谷歌高管向员工宣布，当 `Project Maven` 合同结束后，他们将不再续约。\n\n从上，，谷歌起义揭示了科技公司的一个弱点：他们的员工。软件公司因竞争争夺员工而闻名，支付巨额资金从对方手中抢夺人才——`Facebook`\
  \ 挖 `Uber`，`Uber` 挖 `Google`，`Google` 挖 `Twitter`。这让科技人员拥有了非凡的、老实的劳动力量。他们是世界上大科技公司努力保持开心的唯一群体。\n\
  \n软件的日常用户并不拥有这种筹码，Breisacher 指出。“对于 `Facebook` 或 `Google`，你无法像对待一家普通公司那样抵制它们，”他说，“尽管谷歌有数百万用户，`Chrome`\
  \ 也有数百万用户。但作为员工，我们只有少数人。所以我觉得，如果你要在这些拥有如此影响力的公司工作，你几乎有责任考虑你拥有多大的权力，以及你将如何使用它。”这种力量显然不是完全的。它只有在大量员工抗议时（正如他们针对\
  \ `Maven` 所做的那样）才会起作用。\n\n我们可能会看到更多起义。许多许多程序员似乎对他们公司的伦理和公民行为感到不适。2018 年夏天，新闻报道开始关注移民和海关执法局如何将移民儿童与其父母分离并将他们关进简陋的拘留中心。`Microsoft`\
  \ 的员工得知公司正为 `ICE`（美国海关执法局）提供软件，超过 300 人签署了信要求公司取消合同。与此同时，`Facebook` 和 `Twitter`\
  \ 等公司的员工发现，在选举之后，在派对上甚至承认为谁工作都变得很丢脸。“我永远不会说我在 `Facebook` 工作，”一位 30 岁的软件工程师告诉《卫报》的如是。如果被问起，他会很模糊。“这有一套需要学会的戏法，”他补充道，“因为人们很快就会做出判断。”十年前，华街是那个充满傲慢、自恋且正在破坏国家的行业。但现在，在美国人的文化想象中，硅谷程序员正成为新的白痴。\n\
  \n他们已经从电影《黑客》中的英雄，变成了《硅谷》剧中的笨拙、自私的丑角。\n\n\n\n\n\n最近，Breisacher 对他新雇主 Hustle 的价值观感到满意得多。这是一家较小的初创公司，制作短信软件，让机构能够建立并维护一对一的关系。环保会俱乐部（Sierra\
  \ Club）和计划生育等许多非盈利组织都使用了该软件。\n\n但他承认，有时他会想起 Google。那里有很多他喜欢的地方：极佳的技术挑战；充满干力的同事；老天，甚至还有那些著名的装修豪华的食堂。\n\
  \n他叹了口气。“我很想念那里。”\n\n# 第 11 章\n\n## 蓝领编程\n\n2014 年，加兰·库奇（Garland Couch）只是肯塔基州又一个被裁员的矿工。\n\
  \n当时他 41 岁，留着橙色的山胡，住在派克维尔（Pikeville）附近。这是一个坐落在肯塔基州东部蜿蜒绿山间的只有 7000 人口的小镇。15 年来，他从事煤矿设备的预防性维护，像他的父亲和祖父一样，在煤堆中劳作。煤炭构了他的生活。“在矿井工作时，那些人就是你的家人，”他告诉我。\n\
  \n但在 21 世纪 10 年代初，煤炭行业急剧下降。水力压裂技术导致廉价天然气爆发，可再生能源变得越来越可行，联邦政府实施了旨在让国家远离煤炭的规定。2008\
  \ 年，肯塔基州有超过 17,000 名矿工。仅仅八年后，这个数字就下降到了 6,500 人。该地区越来越多地遍布着没有市场的巨型煤堆。现在，库奇意识到自己并没有多少好的选择。他知道路易维尔有一份工业维护工作，但离那里太远，无法通勤，而且他不愿意为了这份本身可能长不了多久的工作就让妻子和女儿搬离家园。\n\
  \n当他思考这些备选方案时，他在收音机上听到一个奇怪的广告。\n\n“你被采矿业裁员了吗？”广告里问道，“如果你是一个基于逻辑的思考者，愿意工作和学习新事物，我们为你提供了一个职业机会。Bit\
  \ Source 正在将计算机编程革命引入肯塔基东部。”\n\n什么鬼？有人在派克维尔提供编程工作？\n\n***\n\n这份工作邀约是鲁斯蒂·贾斯汀（Rusty\
  \ Justice）的脑力。当时他 55 岁，两鬓斑白，他的一生都在采矿业工作，经营父亲的煤炭运输业务和一家土地开发公司。但他煤炭行业令人眩晕的衰落震惊了。“我们都预到了下行的到来，但我们没有预料到经济的完全崩溃，”他告诉我。\n\
  \n贾斯汀意识到他在派克维尔需要建立全新的业务。它必须处于一个增长行业而非萎缩的行业。而且它必须提供高薪工作：肯塔基州的煤矿工作平均工资超过 82,000 美元，这高到每份工作就能支撑当地杂货店、酒吧和汽车经销商的几份工作。该地区需要支柱性的薪资。贾斯汀和他的业务伙伴林·帕里奇（Lynn\
  \ Parrish）讨论各种概念，从风电场、太阳能电场等替代能源项目；“甚至猪场，”贾斯汀开玩笑道。\n\n接着在 2013 年的某一天，在研究期间，他们访问了几个小时车程外的莱克斯顿的一个科技孵化器。那里看起来像标准的、通风且阳光充足的硅谷初创公司空间，到处是巨大的皮沙发和乒乓球桌；程序员们在桌前埋头敲击。孵化器负责人告诉他们，当地科技公司找不到足够的当地程序员来雇佣。人才储备不足。工作很不错，年薪高达\
  \ 80,000 美元。\n\n“那是笔大钱，”贾斯汀说，但他推测你需要一个计算机科学学位。“不，”孵化器负责人说，“任何聪明且投入的人都可以在工作中学习编程，就像学习任何熟练技艺一样。”\n\
  \n现在*这*引起了贾斯汀的注意。他知道矿工是聪明的、易于培训的，坦率地说，已经沉浸在技术中了。“在人们眼中，我们并不聪明，我们是山里佬，”他告诉我。但矿工的工作方式已经像程序员了：他们整天坐在一个地方，耐心地运行着高科技设备并解决问题。“这是一项高技术含量的业务，”他说，“你对他们的印象是一个拿着铁镐和午餐盒的家伙。但他们使用机器人技术，理解流体动力学和液压系统。\n\
  \n“矿工实际上是干脏力活的技术工人。”\n\n他和帕里奇决定把编程带到派克维尔。他们将找到有才华的失业矿工，培训他们，并为任何需要构建应用程序或网站的人承包。很快，他们找到了一个愿意培训新入员工的程序员；他们争取到了联邦资金，在工人培训期间帮助支付工资。他们在派克维尔的一家旧可口可乐装瓶厂找到了一间办公室，至关重要的是，它紧邻高速互联网线路。（在派克维尔，正如在阿拉契亚的许多地区，宽带布线非常稀少甚至不存在。）他们将公司命名为“Bit\
  \ Source”，这取了数字比特（bit）和采矿中沥青（bitumen）的双关含义。\n\n但矿工真的*想*成为程序员吗？贾斯汀投放了收音机广告和纸质广告。“我们有\
  \ 11 个名额，我们认为可能有 50 个申请者，”他说，“如果运气好的话。”\n\n他们收到了 950 份。事实证明，对山里佬的刻板印象恰恰如此；当地居民为了竞争一份工作几乎挤在了一起。事实上，反响如此巨大，以至于贾斯汀的培训师建立了一个数据库，以便筛选所有的申请。他们最终创建了一个初步测试来剔除非优秀者，这包含数学和心理问题，例如：`你更倾向于维修引擎还是做演示？`这让人数缩小到\
  \ 50 人，于是他们进行了另一轮测试；最终他们面试了前 20 人。\n\n加兰·库奇是通过测试和面试的 11 人之一，并被录用了。和其他 10 个人一样，他坦率地预感到采矿业不会回升；是时候尝试新事物了。第一天他走进\
  \ Bit Source 的门，门上写着“新的一，新方法”的口号；墙上装饰着当地人物的壁画，比如帮助该地区煤矿发展的投资者约翰·C·梅奥（CC Mayo）。另一堵墙上的口号写道：“像永远一样学习，像明天就会一样生活。“我进了什么样的坑？”库奇自问。\n\
  \n\n\n\n\n慢慢地，工作开始变得有条理了。他们每周结束时，都会用所学的知识做一个小项目——起初是简单的网页，然后是交互式页面，接着是可以在数据库中存储数据的页面。贾斯（Justice）是对的：他们是敏捷且专注的学习者。其中困难的一点是适应更快速、更松散的开发规范。在采矿业中，缓慢而细致是关键。如果你犯了一个错，事情可能真的会爆炸，危及生命并让公司损失数百万美元。相比之下，代码的关键在于快速迭代并边做边修复。错误是没关系的；它们是理所当然的。\n\
  \n几个月后，他们实际上开始交付代码了。起初大部分代码都很简单——派克维尔市会的网站、起重机和土方公司的网站。但随后变得越来越复杂，包括一个让患者可以在农市场兑换优惠券的\
  \ App、一个增强现实 App，以及——一项与肯塔基州深度相关的公益工作——一个帮助与鸦片成瘾斗争的社区的 App。\n\n三年后，贾斯的投资已接近收支平衡。他说，困难的部分在于销售，即让客户放下对雇佣一群带着阿拉拉契亚山口音的\
  \ `hillbillies`（这是贾斯自豪使用的一个词）的沿岸傲慢偏视。但他的程序员们现在已经是成熟的开发者了，在聚会上与省理工学院的计算机科学教授交游，并用他们记录详尽的代码令\
  \ Linux 专家们印象深刻。贾斯指出：“他们没有任何需要改掉的坏习惯。”斯蒂文斯（Stevens）发现自己热爱前端设计，可以花几个小时去调整一个网站的 `CSS`\
  \ 和字体。“当你看到某人的脸亮起来时，那种感觉简直太棒了，”他赞之溢口地描述道。\n\n贾斯已经成为经济发展领域的一个小名人。他接听来自世界各地的电话，市政领袖们询问他们如何也能“办一个\
  \ Bit Source Source”。提供建议并不容易。你必须被推向边缘，面对一个完全崩溃的经济。\n\n“那是通过饥饿产生的动力，”他回忆道。“我爸常说：‘生活是不公平的，所以带好头盔’。”\n\
  \n但他坚信 Bit Source 以其自己的小方式，窥见了编程的下一个阶段。第一波浪潮是个人电脑先驱者，那些从 `Commodore 64s` 或早期 `HTML`\
  \ 开始并将其转化为百万财富的极客少年。但现在编程已经成熟了。它更像是一张通往中产阶级的入场券；大多数人可以将其视为通往相对稳定、愉快就业的途径。换句话说，这就像是以前肯塔基州的采矿业一样。\n\
  \n“这些是蓝领工人，”贾斯评价他的程序员时说，“这是一份蓝领工作。”\n\n***\n\n贾斯是对的。整个编程世界现在的增长如此之快，以至于正在改变谁成为程序员以及他们成为程序员的初。\n\
  \n我们可能会看到编程的主流化——它迅速成长为许多更多受过教育的成年人（可能是其中的大多数人）需要在某种程度上掌握的技能。一直占据主导的形象是那些穿着连帽衫、像扎克伯格一样的年轻程序员，他们拼凑出吹称将“改变世界”的\
  \ App。现在，新的转变转向了追求稳定、高质量工作的程序员——取代了 20 世纪后半叶维持中产阶级的高薪技类工作。正如我的朋友、技术企业家思想家安尼尔·达什（Anil\
  \ Dash，你在上一章中听过他）所称，这是“蓝领程序员”的出现。\n\n全球对程序员的需求正在爆发。美国劳工统计局预测，从 2016 年到 2026 年，计算机和\
  \ IT 员工的工作将增长 13%，快于其他职业的平均水平。薪水可能很高——2017 年 5 月的平均薪已达到 84,580 美元，是所有职业类型年薪工资的两倍多。还没有足够的人进入编程领域来满足这种需求。根据某些预测，仅到\
  \ 2020 年，编程岗位将比经过培训的程序员多 100 万个。此外，许多并非正式属于“软件开发”的工作也越来越需要一些编程。就业市场分析公司 Burning\
  \ Glass Technologies 的一份报告发现，在 2015 年，20% 的“职业轨道型”工作认为某些编程知识是一项优势。而且所有目前开放或未来几年将开放的编程工作，并不仅仅集中在硅谷。事实上，美国只有不到十分之一的编程工作位于硅谷；其余的遍布全国任何规模的城市和城镇。\n\
  \n### 这些未来的程序员将从何而来？\n\n最直接的途径将是人们现在采取的途径：去学院或大学攻读四年的计算机科学学位。假设学生表现良好，且这是一所人脉广的大学，知名雇主会争相抢夺顶尖的计算机科学毕业生。事实上，这些大学与大公司的实习机会联系紧密，以至于许多毕业生在完成课程之前就拿到了录取通知。当我与两个刚从哥伦比亚大学计算机科学专业毕业一年的学生在一起时，其中一个被\
  \ Facebook、微软和纽约的一家数据库公司看中，另一个则在 Lyft 和 Twitter 的录取机会之间权衡。“对于基本上每个从我们专业出来的人来说，情况都是这样，”他们告诉我。高科技初创公司的创始人倾向于雇佣在大学相识的朋友；进对一个班就获得了一份资金充足工作的入场券。\n\
  \n结果是，渴望学习计算机科学的学生潮日益高涨。从 2011 年到 2015 年，美国宣布计算机科学为专业的本科生人数翻了一番——仅仅花了四年。\n\n学生们想当程序员有多疯狂？想想\
  \ 2015 年，斯坦福大学 20% 的学生都在攻读计算机科学；它现在已是校园内最受欢迎的专业。斯坦福其他领域的教授——特别是在 STEM 狂热中被冷落的极度落后的人文科学——睁睁看着学生放弃英语、历史和人类学等领域，日益无闲以毙。但学生们知道，对程序员的需求几乎是无限的。“如果每个斯坦福学生——谢天谢地——都主修计算机科学，那么他们中甚至不需要离开圣克拉拉县就能找到工作，”埃里克·罗伯茨（Eric\
  \ Roberts）说，他是该校计算机科学本科生学习主任（也是你在关于女性程序员的章节中见过的人）。\n\n诚然，计算机科学以前出现过几波热潮—— 80 年代初，然后是\
  \ 90 年代后期。每一次热潮都冷却了；它们只是暂时的时尚。但观察者认为，这次不同。由于编程渗透到每一个行业，需求可能会多年一直保持高位。它不仅在初创公司需要，在保险公司、当地银行、娱乐业也需要。\n\
  \n涌入计算机科学的孩子们得出了与肯塔基州的拉斯迪·贾斯（Rusty Justice）完全相同的结论：编程是通往稳定工作的可靠途径。在这些学生的世界里——这个世界日益被不确定性和比以前任何一代都更沉重的大学债务所定义——编程承诺提供中产阶级式的稳定性，而这种稳定性在美国经济版图中已日益消失。\n\
  \n“这与其说是像我们在 90 年代看到的那种‘哇，我可以变成亿万富翁’的感觉，”罗伯茨说。现在他们只想成为一名高薪员工。\n\n\n\n\n症结在于，计算机科学学院没有足够的空间来创造这样一个中产阶级。教授或讲师不足。例如，斯坦福大学的教职员工只有约\
  \ 2% 是计算机科学教授，这意味着这极小比例教授在尝试教授 20% 的本科生时，已经捉不应手。其他学院也面临同样的困境。他们无法聘用足够的计算机科学教授。他们没有无限的预算，即使有，他们也要与高科技公司竞争人才，这些公司经常用年入六位数字的高额薪水和开放的研究机会来挖走资深教授，这是任何大学都无法比拟的。博士生们在毕业后也流向\
  \ Uber 或 Google，而不是回到学校教学。\n\n结果是，许多计算机科学系——正如他们自己的教授所担心的那样——正在迅速变成拥挤的沙丁鱼罐。斯坦福大学的一门单一机器学习课程就有\
  \ 760 名学生（而且这还是一门研究生课程）。唯一的替代方案就是简单地限制：告诉大多数孩子，`对不起，你在这里不能学习计算机科学`；或者只录取成绩绝对顶尖的学生。\n\
  \n“另一种办法是让我们的课程规模变得巨大，”华盛顿大学计算机科学教授埃德·拉佐斯卡（Ed Lazowska）思索道。他们不愿意这样做；这会极大地损害教育质量。州政府在提供更多资金扩大规模方面相当慷慨，但尽管如此，他们仍然无法满足需求。“这意味着我们只有在有资金扩张时才扩张，这种做法一直很自私。”\n\
  \n但如果计算机科学教育无法足够地扩张，那么就需要许多其他方式让人们挤入这个行业。\n\n***\n\n### Flatiron School 方法\n\n阿维·弗隆鲍（Avi\
  \ Flombaum）正在尝试探索这些新路径之一。他是 Flatiron School 的创始人，这是一家训练营，招收人们并收取约 1.5 万美元的学费，让他们完成为期\
  \ 15 周的强化培训课程。当我访问他们在曼哈顿华街区的校区时，大约 200 名学生坐在长桌旁，两人一组，工作，共同钻研 `Ruby` 的细微差别。一个学生正用白板笔为同伴勾勒代码片段，直接写在桌子上。“它们本身就是白板，”弗隆鲍指出，“我们花了一些时间才发现这种解决办法，因为我们不希望学生在白板前走动并搞乱现场。”但他希望他们不停地交流和分享作品，因为“学习就是这么学的”。远处的墙上有一幅极具极客风格的壁画：格蕾丝·霍珀（Grace\
  \ Hopper）巨大的头部、一台 80 年代的 PC 电脑，以及用弧形涂鸦喷绘的“LEARN LOVE CODE”字样。\n\n弗隆鲍今年 34 岁，头发浓密地向后梳着；他的右肩膀上有一个\
  \ Flatiron School Logo 的纹身，胸口有一个 `WeWork` 的纹身，那是收购他的公司的机构。“我像一辆赛车，”他开玩笑说。弗隆鲍是一个自学程序员，在一家对冲基金工作并经营了四年初创公司后，出于“兴趣”开始教授为期五周的编程课程。他最终为许多学生找到了工作，心想，嗯，也许可以扩大这种规模。他和一个合伙人在\
  \ 2012 年创立了 Flatiron School，从那时起已经毕业了近 2,000 名学生。\n\nFlatiron 和许多训练营一样，以高密度的知识灌输而闻名。在入学之前，学生被鼓励完成为期\
  \ 15 周的免费在线课程，向他们介绍 `Ruby` 或 `JavaScript` 的基础。在课期间，许多人会留到深夜，与同事一起做项目。大约一半的学生是女性，大多数人很年轻，包括那些已经大学毕业但决定编程比他们主修专业更有就业前景的学生；另一些人已经进入职场但不喜欢自己的工作，想转行。最近的一位学生来自德克萨斯州的一个猪场。\n\
  \n### 学生个人简介\n\n维多利亚·黄（Victoria Huang）是一位来自新泽西州的 25 岁新手，在我访问时，她才处于课程第三周。她告诉我，她在父母的催促下学习了药学，并在曼哈顿的一家医院工作了一年，但她从未对此感到过热情。她的梦想是制作软件：她在青少年时期一直在制作动漫网站，“我只是喜欢那种从无到有创造东西的感觉。”她认为，她的药学训练在许多方面为她适应训练营的节奏做好了准备。“这种超高度的培训和在医院的情况完全一样——你整天都在吸收这些实性知识，它是很有效的，”她说。她几乎所有的同学都像她一样，工作过几年——律师、市场营销人员——无没精采地，感到内心有一种创造物的冲动。“当我们在第一次课程结束时完成第一个项目时，我从未如此自豪过，”她说。\n\
  \n### 编程教育的现实\n\n正如弗隆鲍所承认的，没有人能仅仅通过 15 周就成为精英程序员。他们不会学到四年制计算机科学学位中涵盖的材料。大学的计算机科学课程侧重于计算机工作原理的抽象理论，以及计算机架构和设计。那些学生毕业时获得了对某些细微领域的感知，例如在构建\
  \ `algorithms` 方面的效率。他们会知道 `big O` 理论，该理论可以告诉你特定的排序算法是否具有最高效率——它是在几分钟内处理 1000 万条数据的数据集，还是需要几个小时。主要是这些计算机科学毕业生将在代码中创造新的创新、新形式的\
  \ `cryptography` 或 `AI`。这就是为什么精英科技公司更青睐计算机科学专业的毕业生，而对训练营的人并不感兴趣。\n\n训练营更像传统的职业培训，类似于\
  \ 60 年代或 70 年代的老式技校。他们承认训练营毕业生并不是为了学习如何进行根本性的创新。学生将仅仅专注于学习一些程序员在日常工作中做的、最常见的事情：如何设计一个在数据库中存储内容、检索内容并显示给他人查看的\
  \ Web 服务。\n\n但问题是，那些枯燥且缺乏创新的东西？一旦你离开了 `Amazon`、`Google`、`Baidu` 或 `阿里巴巴` 等精英科技公司的殿堂，那正是大多数编程工作的真实状态。“我们行业中只有极小比例的人在研究领域处理真正困难的算法问题，”科技公司\
  \ `npm` 的首席技术官 C. J. Silverio 在 Twitter 上写道。“我们大多数人整天都在拼接字符串。”（*拼接*意味着例如，将文本字符串\
  \ `Clive` 与另一个文本字符串如 `feels good!` 或 `feels lousy!` 结合在一起）\n\n\n\n\n\n训练营现象是一个全球性现象，在每一个编码工作需求超过程序员供应的国家，训练营都在拔地而起——也就是说，遍布全球。在印度，资深程序员\
  \ Santosh Rajan 创立了 `Geekskool`，试图解决他所说的传统印度计算机科学学院“落后于时代十年”的问题。那些学校培养出的程序员对旧的语言和数据库接受了良好培训，因此他们可以为印度的大型公司工作，而这些公司则廉价地为全球巨头提供后端服务。这是一份枯燥且可靠的工作。但假设你想学习一种新颖且兴起的计算机语言，比如\
  \ `JavaScript` 或 `Ruby` 呢？他说，你需要一个印度的训练营。Rajan 的学生从医生到计算机科学专业的毕业生都有都有，他们意识到自己的学位仅让他们有资格当没灵魂的数据库管理员，而他们渴望更多。他们都充满饥求感且动力十足，他坚称，这就是成为一名实用的程序员所需的一切。\n\
  \n“成为一名伟大的程序员与成为一名伟大的音乐家或伟大的足球运动员没有区别，”他告诉我。“这是一样的——仅仅在于决心：`我想要这个`。”`Geek-skool`\
  \ 的承诺是让毕业生与市场的真实需求接轨——并快速做到这一点，而且费用比四年制大学少得多。\n\n在这一承诺的推动下，训练营在近年来呈爆炸式增长。2013 年，美国的训练营毕业了\
  \ 2,178 人。仅仅五年后，这个数字就惊人地增长了近 10 倍，超过 20,000 名学生涌出训练营的大门，寻找工作。\n\n***\n\n## 这种快速粗糙的编码路径行可行吗？\n\
  \n有多少人真正通过这种方式成为了软件开发人员？\n\n这很难确切，因为训练营的质量差异巨大。有些训练营历史悠久，运营多年，并提供关于其毕业生就业频率的审计报告。另一些则显得不靠谱且缺乏监管。研究该领域的机构\
  \ `Course Report` 的一项调查显示，参加过训练营的人中，约有三分之二到三分之四在该领域找到了工作。`Flatiron` 在其招聘率方面相对透明；在一份审计报告中，他们发现于\
  \ 2015 年 11 月至 2016 年 12 月之间毕业并寻找工作的学生中，97% 的人在毕业后六个月的窗口内找到了某种软件工程工作——约 40% 获得了全职工作（平均年薪为\
  \ 67,607 美元），一半人从事合同工、带薪实习或平均时薪 27 美元的带薪学徒工作，其余的则从事自由职业。\n\n### Luis De Castro 的案例\n\
  \n一位获得过成功的学生是 Luis De Castro，今年 29 岁，住在旧金山。当我 2016 年秋天在 `GitHub` 会议上见到他时，他正蜷在笔记本电脑前，浓密的深色脏辫从连帽衫中散出来，他正疯狂地拼凑一个演示，该演示使用\
  \ `IBM’s Watson AI` 获取文本信息并识别其情绪状态。他最近结束了附近一家已关闭的学校 `Dev Bootcamp` 的学习，正试图让演示运行起来，以便在晚些时候的一个活动中展示给其他同学看。它没有运行，至少还没有。“噢，老兄，我完全不知道这里是怎么了，”他说笑着，当时代码一个接一个地抛出错误，直到他在最后几分钟终于消灭了漏洞。\n\
  \nDe Castro 出生在菲律宾，从小在加利福尼亚长大。他热爱汽车，高中后他在 `BMW` 找了一份洗车工作；他逐渐升职，直到进入了文书工作，但他发现那让他精疲力竭。他辞职并入了大学，但发现那里也无法保持他的兴趣。他退学了。\n\
  \n“我当时不知道该妈干什么，”他告诉我。在考虑自己的选择时，他与一位就读于 `Dev Bootcamp` 的朋友聊天。De Castro 被此吸引，并尝试了它的免费在线课程。“我发现这很有趣，我理解它，而且我很擅长这个，”他意识到。他花了一段时间才凑齐了\
  \ 15,000 美元的学费——那真是太不容易了；我当时还失业！”——但他最终报了名。训练营的经历是振奋的，尽管其强度让人有些恐惧。他早到晚归，并发现自己非常热爱编码时那种禅意般的状态。“我喜欢早上的时间：我有我的代码，有我的笔记本电脑，还有我的耳机。这就像我的和平时光。我在编码，没有什么能打扰我。”\n\
  \n### 求职过程\n\n毕业后找工作并不是理所当然的。De Castro 估计他的同龄人中只有三分之一找到了程序员的工作，另外三分之一找到了相关工作（例如科技公司的营销工作），而最后三分之一则完全放弃了该领域。他设定了一个严律的节奏，每天申请\
  \ 15 到 20 份工作——“这就像是撒网祈祷，你什么都不看就投递。”起初，自动发送的拒绝信堆满了了他的收件箱。然后他开始向潜在机会询问：为什么不雇用我？`我们需要更多经验，”他们会说。最后，他通过\
  \ `LinkedIn` 上的招聘信息发送的一份申请获得了一个面试，这是他的第一次面试，在 `Funding Circle`，这是一家帮助小企业寻找投资的公司。De\
  \ Castro 认为这也会被拒绝——几乎没有人通过第一次面试就能找到工作。但惊讶的是，他们录用了他。\n\n实际从事编码工作像是在水上行走：他感到自己并没有准备好，在工作时疯狂地搜索一切。直到有一天他意识到：*嘿，这其实还行。*他第一次感到了自信。当我在工作一年后采访\
  \ De Castro 时，他实验性地将简历投到了招聘网站上看看情况。该网站询问最低薪资；出于好奇，他填了 140,000 美元。“结果我收到了人的邮件，说‘高级职位，我们想面试你’！”他笑着，显得很惊讶。\n\
  \nMitch Pronschinske 是一位对技术敏感的作家，曾是 `TechBeacon` 的编辑，那是一家报道编码的网站。他对该领域产生了足够的兴趣，因此决定自己尝试一下。由于他无法负担完全停止工作的费用，他选择了一个纯在线训练营——`Bloc`，这花费了他\
  \ 5,000 美元，并且可以在晚上和周末完成。他拼命学习课程，分配给他的导师非常有鼓励性，告诉他说：“噢，你完全可以在初创公司工作。”\n\n\n\n\n训练营的世界在成功率的诚实性上一直声誉不佳。许多机构通过不可靠的数据来推销其招聘率；加利福尼亚州政府在发现几所学校在无许可证的情况下运营后，向它们发出了停止终止函。随后的投诉发现，一家名为\
  \ `Coding House` 的学校曾吹嘘其学生已被 21 家不同的公司录用，但政府发现，实际上只有 2 名学生被其中任何一家公司录用。（加利福尼亚州对创始人处以\
  \ 50,000 美元的罚款，并命令该学校关闭。）甚至 `Flatiron` 也在一场关于招聘数字的争议中被纽约州罚过款。（它在 2017 年秋季支付了 375,000\
  \ 美元的和解金，发放给任何索赔的合格学生。）本质上，训练营的世界与美国营利高等教育的世界存在着微妙的重叠——批评者指责这些学校针对那些付不起四年制大学费用的孩子，说服他们背巨额学生贷款，然后又没有提供足够的支持让他们毕业或找到工作。\n\
  \n正如研究过营利机构的学者 Tressie McMillan Cottom 所说，训练营似乎处于像 `Stanford` 这样的精英大学和低毕业率营利学校之间的中间位置。它们是自我筛选的——目前，它们主要吸引那些在教育上准备更充分、在财务上不那么绝望的学生，而不是被营利大学吸引的工人阶级孩子。她告诉\
  \ `Logic` 杂志：“学术准备充分、财务状况良好、且能够付得起这种培训并从中受益的学生群体非常非常小。”\n\n如果你想真正将编程作为社会流动的力量，你会希望让更多贫困和工人阶级的孩子进入编程。训练营对他们来说太贵了，或者在文化上根本不在他们的考虑范围内。相比之下，社区学院是一条更廉价且监管更好的途径。社区学院面临的问题是“能力危机”：由于薪资相对较低，他们无法与精英大学竞争——坦率地说，精英大学已经向科技公司流失了教授。正如\
  \ `Stanford` 的 `Roberts` 所指出的，“如果我们招不到人，社区学院更招不到了。”\n\n***\n\n作为一种行业，让编程变得奇怪的一点是，人们可以自学如何编程。\n\
  \n这种工作方式的技术职业并不多。`Boeing` 并不会雇佣自学设计飞机的工程师——他们不是那种在后院随手摆弄制造 `Dreamliner` 喷气式机翼，直到他们，你懂的，掌握了这门手艺的人。如果你想到让一个从未上过医学院、只在朋友身上练习过的人来眼科手术，你或我都会毛骨悚然。然而，我们经常使用由那些从未在正规场合（无论在大学还是在训练营）正式学习过代码的人所编写的软件。他们只是开始捣鼓编程并学会了它。正如几位程序员向我指出的那样，编程是一门奇特的技术贸易，因为创作工具对于业余者和专业人士来说同样容易获得。如果你想设计一款新手机，你需要一些非常顶尖的工具：微芯片制造厂、精密焊接站、可能还有一台\
  \ 3-D 打印机来制作外壳原型。但如果你想写软件，只需要一台基础笔记本电脑。许多“代码编辑器”（用于编写代码本身的工具）都是免费的。根据 `Stack Overflow`\
  \ 的调查，这些相对较低的入门门槛部分导致 69% 的编码者“至少部分是自学的”，56% 从未获得过计算机科学学位，13% 的人表示他们是“完全”自学的。\n\n\
  \n\n\n认为只有极少数人真的能通过自学获得一份工作，这听起来有些难以置信。不过，我采访了几个人，他们确实是从 `freeCodeCamp` 开始并最终获得了工作。其中一人是\
  \ `Andrew Charlebois`，一位住在加拿大蒙特利尔的 29 岁男性；他在二十多岁时做木工，在被裁员后的一个冬季空窗期参加了在线课程。他发现构建交互式网站与木工有奇相似之处——屏幕上组件的完成和贴合程度，与将木材加工得整齐方正并不远。在开始在线工作四个月后，`Charlebois`\
  \ 开始申请开发人员职位；在投了 78 份申请后，他令自己比任何人都感到意外地获得了一个机会。“当时我正在谷歌搜索之类的问题，比如‘二十七岁转行太晚了吗？’我很担心，”他说。当我与他交谈时，他已经在该岗位工作了近两年，现在正在指导其他新手程序员。\n\
  \n考虑到该行业对女性和少数裔的招聘率如此低，在线自学和训练营真的能帮助拓宽行业大门吗？显然这对某些人有效，但提到训练营时，像 `Tressie McMillan\
  \ Cottom` 这样的批评者持怀疑态度；她认为此类路径往往只对“精英中的精英”有效，即那些拥有钛般坚定动力或足够社会经济支持的人。用极客的话说，自学无法“规模化”（`scale`）。\n\
  \n争认为，或许更有效的方法是雇主积极从非传统群体中招聘和培训——提供带薪上培训，正如 `Bit Source` 所做的那样。鉴于对开发人员的巨大需求，这也在成为一种趋势。\n\
  \n巴尔的摩的一家软件公司 `Catalyte` 使用在线能力测试来识别可能成为优秀程序员的新手，然后让他们接受为期五个月月的密集培训。这项在线测试最初是一位哈佛教学研究员的脑力，他认为传统的程序员招聘方法——筛选简历和面试——往往无法产出高绩效的员工。“他发现的另一个是，归根结底，这强化了围绕阶级的社会偏见，”`Catalyte`\
  \ 的首席执行官 `Jake Hsu` 说：富裕的白人孩子拥有更精美的简历和教育背景，这意味着无论他们实际上是否能成为出色的程序员，都能获得更多技术工作。因此，`Catalyte`\
  \ 转而向传统上产生程序员的地区广泛推广其能力测试，并自动为任何高分者提供培训机会，且在完成后保证提供工作——甚至不需要要求提供简历或进行正式面试。他们的第一个测试城市是巴尔的摩。\n\
  \n当然，能力测试是对过去程序员时代的一个大回响。在软件早期——即 20 世纪 50 年代和 60 年代——公司没有办法知道谁会成为出色的程序员，因此他们严重依赖谜题和模式识别测试来确定谁能进行逻辑思考。这为许多不同的统计群体打开了大门，因为事实证明许多人非常擅长解决这类谜题。正如我们在“ENIAC\
  \ 女子们”一章中看到的，程序员雇主花了几十年时间才从原始能力测试转向转型，开始优先考虑“文化契合度”（`culture fit`），这种转变极大地有利于男性。\n\
  \n在 `Catalyte` 的测试中，申请者需要处理数学题、谜题和写作部分，系统会监控测试者的工作流程。正如 `Hsu` 所指出的，这验证了“一个人综合复杂信息的能力——那些能够处理非常复杂的事情并将其拆解成小块的人”。\n\
  \n从 `Catalyte` 的结果来看，在不那么富裕的城市部署的盲测似乎效果非常好。该公司目前雇佣了约 600 人，他们的人口特征比整个软件行业要多样得多。在他们的巴尔的摩办公室，29%\
  \ 的开发者是非裔美国人，是该行业平均水平估值的三倍左右。“大多数人来自工人阶级背景，”`Hsu` 补充道，44% 的人没有四年制学位。平均年龄为 33 岁，大多数入职者都在寻求第二份职业，而且是更好的职业。\n\
  \n“人才确实是均匀分布的，或者至少从事这项工作的能力是均匀分布的，”他写道。我采访的一位在 `Catalyte` 工作了两年的女性 `Carolina Erickson`，她今年\
  \ 35 岁，在大学学习过音乐表演，多年来一直努力作为长笛演奏家谋生，最后得出自己无法取得进展的结论。在技术呼叫中心兼职激发了她对网页开发的旧兴趣，于是她上了这门相关的大学课程；然后她发现了\
  \ `Catalyte`，通过了测试并被录用。她在那里工作过的几个团队曾帮助重构了票务系统的部分以及 `StubHub` 的 `iOS` 。`Erickson`\
  \ 怀疑第二职业程序员拥有某些应届毕业的计算机科学毕业生不具备的优势，包括丰富的团队合作经验。\n\n“这与在乐团演奏有某些重叠，”她说。演奏长笛也需要她快速学习并即时反应——比如在视读乐谱时——并与同事保持紧密同步。\n\
  \n从非传统领域招聘员工的一个益处是，你可以获得他们更广泛的视角。刚大学毕业、充满热情的计算机科学学生几乎没有生活经验。他们很容易陷入一种天真、自傲的信念，认为自己可以解决任何问题——而且往往无法注意到世界中那些本可以通过巧妙软件解决的现实问题，因为他们从未接触过。如果他们很少学习过人文科学——如历史、社会学、文学——他们往往具有诺罗普·弗莱叶所说的“缺乏教育的想象力”：他们很难想象软件用户的动力。他们擅长掌握机器的二进制灵魂，但不理解人类心理的量子化奇特性。\n\
  \n“拥有人文科学学位的人是批判性思考者，”音乐设备在线市场 `Reverb` 的首席执行官 `David Kalt` 说。`Kalt` 本身是一位音乐家和前音乐制作人，他在\
  \ 90 年代转行成为软件工程师，创建并出售了一家技术初创公司。2013 年，由于音乐家抱怨 eBay 或 Craigslist 上买卖乐器的体验糟糕，他创建了\
  \ `Reverb`；它为乐器销售提供一系列实用工具，包括一个评估你的鼓组或稀有吉他单块价值的工具。他曾主张让更多孩子学习计算机科学——但在建立了两家公司后，他注意到产出最高的开发者都学习过人文科学，如哲学或政治学（后者是他自己的学学位）。现在他主张相反的观点：软件行业应该招聘那些学习过广泛的人，让他们通过业余自学编程或在之后进行转行培训。\n\
  \n“我们从训练营招募了很多人，”他告诉我，“而且你能看出谁会在两年后成为高级开发者。老实说，这归于他们的人文科学学位。批判性思考者比线性的思考者能更动态地吸收新语言。”`Reverb`\
  \ 固然也会雇佣音乐家作为工程师，因为他们能直觉地感知音乐家在在线购买时在寻找什么：乐器的大原图、使用视频，以及通过联邦快递全球运输的昂贵乐器的保险单。\n\n\
  \n当然，随着越来越多的人涌入编码领域，出现了许多微妙的问题。其中之一是工作似乎正在按性别发生分化。随着女性和少数族裔进入该领域，他们所工作领域的声望随之下降。\n\
  \n目前，这种情况似乎正发生在前端编码领域。初学者学习编码的一种常见方法是通过破解 `HTML` 和 `CSS` 来制作简单的网站，然后添加 `JavaScript`\
  \ 让网站具有交互性。20 世纪 90 年代和 21 世纪初的在线流行文化鼓励孩子们这样做，比如 `Neopets` 网站，孩子们可以在那里修改代码来定制自己的数字宠物和家园；旧的\
  \ `MySpace` 也是如此，青少年们将自己的页面改造成刻意带有故障感设计的激进展示。（我听过许多前端工程师对他们在 `Neopets` 上花费的数百小时赞不绝口。）那些为青少年某个极其晦涩的喜爱的电视节目或乐队制作的华丽致敬网站也是如此。视频游戏是\
  \ 20 世纪 80 年代 `Commodore 64` 让青少年进入编码的大门——但在接后的二十年里，流行文化的网络粉丝才是为更多元化的世代提供了入场券。这些粉丝磨练了自己的网络技能，进入了爆炸式的网页设计师工作市场。\n\
  \n这可能就是女性最常见的编码工作是前端工作的原因之一。当 Miriam Posner（一位在加州大学洛杉矶分校教授信息学的程序员）查看 `Stack Overflow`\
  \ 编码员工作数据时，女性列出的两个顶级职位是“设计师”和“前端开发人员”，这些属于该范畴。在涉及处理服务器和数据库的后端工作中，或者在 `blockchain`\
  \ 或 `AI` 等新兴热门领域，工作的女性要少得多。在这些领域，男性占据主导地位。而且男性的工资更高：她发现，前端工作的平均薪资比后端工作少约 30,000\
  \ 美元。\n\nPosner 指出，结果是，当女性进入某个编码领域时，该领域就会贬值。男性离开该领域，寻找新的前沿领域，在那里他们可以重新建立人工稀缺性和默契的“禁止女性进入”的文化，或者至少是一种女孩被视为外来入侵者的文化。如今，这种领域似乎是\
  \ `Bitcoin`（或泛指区块链技术）以及 `AI`，每当我参加活动时，那里都是一片男海洋，远多于其他大多数编码领域。\n\nPosner 认为，实际发生的情况是在编码领域创造了一个“粉色领地贫窟”。程序员的世界愿意承认，诚然，女性和少数族裔可能精通\
  \ `JavaScript` 以及所有让网站或移动应用具有高度功能性的内容，并能按照用户想要的方式做出精确。但这些被贬低为审美性的、模糊的东西。这并不是*真正的*编码。这是一个荒谬的观点；前端编码极其复杂且变化极快，以至于从事这项工作的大多数人都在以惊人的速度不断学习新技术。但\
  \ Posner 本人也对前端网络工作感到过这种傲慢的轻视：她起初通过自学 `HTML` 和 `CSS` 来制作网站，结果被告诉“那不是真正的编码”；于是她学习了\
  \ `PHP` 和 `Drupal` 来处理服务器，结果被告诉那些太简单；于是她学习了 `JavaScript`，却只能眼睁睁看着这种批评模式重复。\n\n“女性化的工作声望较低，”她告诉我。这是经济学家在几乎每个行业中都注意到的一种模式：一旦某个专业——如护理、小学教学——被女性主导，它就会受到轻视（无论是微妙还是公开），并导致较低的地位和薪资。\n\
  \n对前端编码的这种傲慢态度也是关于什么被认为是“真正的”编程的长期历史斗争的最新表现。几十年来，自封的精英编码员坚持认为，任何掌握起来更难、更抽象、更像地狱般的语言在本质上都更有价值。（通常，这些语言是那些精英们自己首选使用的语言。）任何让编码变得简单且更易上手的东西？那是对一种神圣般的、必须艰苦的技艺的严重腐败。1975\
  \ 年，开创性的计算机科学家 Edsger W. Dijkstra 目睹了 `BASIC` 和 `COBOL` 等计算机语言的兴起，这些语言的设计读起来非常像普通英语，因此对新手来说更容易学习。这些语言令他感到痛心。它们看起来松散、臃肿且考虑不周；它们鼓励编码员做出糟糕的设计决策，导致产生不优雅的代码，他嘶嘶地说道。“使用\
  \ `COBOL` 会残废大脑；因此，对它的教学应该被视为一种犯罪行为，”Dijkstra 写道，“对于以前接触过 `BASIC` 的学生来说，教他们良好的编程几乎是不可能的：作为潜在的程序员，他们在精神上已经残废到没有重生的希望。”\n\
  \nDijkstra 的毒辞并非没有道理。`COBOL` 确实可能是一团乱麻。当你设计一种让不会编码的经理能够“读懂”的语言时，难怪你会产出笨拙又无效的东西。至于\
  \ `BASIC`，它确实有糟糕的一。（一个特别糟糕的命令——你可以指令程序突然 `GOTO` 到程序中的任何其他行——导致了到处乱跳的“意大利面条代码”。）但\
  \ Dijkstra 的轻视也是纯粹的世俗，一种认为你不应该*尝试*让初学者让编码变得简单的感觉。对他来说，编码的核心光似乎似乎恰在于它的困难性，它把人们赶走，只留下像僧侣般的信徒在幸福的沉默中思考他们的\
  \ `ASCII` 输出。那时，`COBOL` 和 `BASIC` 是目标——但今天，这种世俗针对的是许多新手作为入场券的网络语言：`JavaScript`、`HTML`。\n\
  \n### 粉色领贫窟与精英流失\n\nPosner 认为，实际发生的情况是在编码领域创造了一个“粉色领贫窟”。程序员的世界愿意承认，诚然，女性和少数族裔可能精通\
  \ `JavaScript` 以及所有让网站或移动应用具有高度功能性的内容，并能按照用户想要的方式做出精确。但这些被贬低为审美性的、模糊的东西。这并不是*真正的*编码。这是一个荒谬的观点；前端编码极其复杂且变化极快，以至于从事这项工作的大多数人都在以惊人的速度不断学习新技术。但\
  \ Posner 本人也对前端网络工作感到过这种傲慢的轻视：她起初通过自学 `HTML` 和 `CSS` 来制作网站，结果被告诉“那不是真正的编码”；于是她学习了\
  \ `PHP` 和 `Drupal` 来处理服务器，结果被告诉那些太简单；于是她学习了 `JavaScript`，却眼睁睁看着这种批评模式重复。\n\n“女性化的工作声望较低，”她告诉我。这是经济学家在几乎每个行业中都注意到的一种模式：一旦某个专业——如护理、小学教学——被女性主导，它就会受到轻视（无论是微妙还是公开），并导致较低的地位和薪资。\n\
  \n对前端编码的这种傲慢态度也是关于什么被认为是“真正的”编程的长期历史斗争的最新表现。几十年来，自封的精英编码员坚持认为，任何掌握起来更难、更抽象、更像地狱般的语言在本质上都更有价值。（通常，这些语言是那些精英们自己首选使用的语言。）任何让编码变得简单且更易上手的东西？那是对一种神圣般的、必须艰苦的技艺的严重腐败。1975\
  \ 年，开创性的计算机科学家 Edsger W. Dijkstra 目睹了 `BASIC` 和 `COBOL` 等计算机语言的兴起，这些语言的设计读起来非常像普通英语，因此对新手来说更容易学习。这些语言令他感到痛心。它们看起来松散、臃肿且考虑不周；它们鼓励编码员做出糟糕的设计决策，导致产生不优雅的代码，他嘶嘶地说道。“使用\
  \ `COBOL` 会残废大脑；因此，对它的教学应该被视为一种犯罪行为，”Dijkstra 写道，“对于以前接触过 `BASIC` 的学生来说，教他们良好的编程几乎是不可能的：作为潜在的程序员，他们在精神上已经残废到没有重生的希望。”\n\
  \nDijkstra 的毒辞并非没有道理。`COBOL` 确实可能是一团乱麻。当你设计一种让不会编码的经理能够“读懂”的语言时，难怪你会产出笨拙又无效的东西。至于\
  \ `BASIC`，它确实有糟糕的一。（一个特别糟糕的命令——你可以指令程序突然 `GOTO` 到程序中的任何其他行——导致了到处乱跳的“意大利面条代码”。）但\
  \ Dijkstra 的轻视也是纯粹的世俗，一种认为你不应该*尝试*让初学者让编码变得简单的感觉。对他来说，编码的核心光似乎似乎在于它的困难性，它把人们赶走，只留下像僧侣般的信徒在幸福的沉默中思考他们的\
  \ `ASCII` 输出。那时，`COBOL` 和 `BASIC` 是目标——但今天，这种世俗针对的是许多新手作为入场券的网络语言：`JavaScript`、`HTML`、`CSS`。\n\
  \n### 编码市场的未来\n\n文本继续分析道：\n\n蓝领编码似乎将会出现；粉色领和白领也是如此。\n\n* * *\n\n鉴于对编程人才的需求日益增加，下一代的*每个人*都应该学会如何做吗？\n\
  \n因此，可以感知到编码的新阶层制度——谁将做什么，哪些工作将提供最高的薪资和声望。训练营、自学和职业培训确实为更多人成为软件开发者开了门，包括许多女性、少数族裔以及来自社会各界和被忽视地区的工人阶级。这些工作的收入可能远高于这些工人在服务部门能获得的工资。但最高薪资呢？那将流向新的新兴领域，并将由今天的现有编码员以及未来的计算机科学毕业生主导。\n\
  \n这就是为什么像 Marie Hicks 这样研究编码领域女性历史的学者，对于训练营将把更多女性深层次地引入该领域的想法不以为感兴趣。“我认为这些[训练营]倡议是良好的，”Hicks\
  \ 告诉 Posner，“但他们完全误解了问题。管道不是问题；精英优制才是问题。认为我们只需把人塞进管道的想法假设了一个并不存在的精英优制。”\n\n\n\n\n\
  事实证明这是一个充满争议的话题。一些人对此表示强烈支持，其中包括 freeCodeCamp 的昆西·拉森（Quincy Larson）。\n\n“我认为每个人都应该学习编码，即使他们并不打算从事这一行业，因为代码正在渗透到许多工作中，”他指出道。在商业领域，仅举一个例子，如果你能使用\
  \ `Python` 或 `R` 分析销售数据以提取出有用的见解，你的就业竞争力会大大提高。如果你知道如何自动化日常任务，在几乎任何办公环境中，你都能脱颖而出。“如果你观察社会，如此多的工作是由机器完成的，它们只是在执行指令，”拉森补充道，“引用计算机科学家约翰·马卡锡（John\
  \ McCarthy）的话，他说：‘每个人都需要计算机编程。这将是我们与仆人交流的方式。’”\n\n在全球范围内，在通用 STEM 热潮的推动下，许多政策者正在接受这样一个观点：编码应该被视为“三字\
  \ ABC”之一，并在小学阶段进行教学。这个想法有一定的历史。追溯到 20 世纪 80 年代，麻理工学院开拓性的教育理论家塞缪尔·帕珀特（Seymour Papert）就认为，计算机编程构成了一种对儿童极有用的思维模式。正如通过生活在每天说法语的地方（如巴黎这样的法国土地）最有利于学习法语一样，你通过生活在“数学乡”（本质上就是计算机编程）来学习逻辑、数学和系统性思维。他的后辈们如今认为，孩子们往往只被教最基础的计算机素养，例如如何制作\
  \ PowerPoint 演示文稿或吸引人的视频。但运用计算机的真正力量来自于知道如何引导它们去做一些新事物，一些你独特想要完成的事情。结果是，近年来出现了一系列针对儿童的计算机语言——例如麻理工学院流行的\
  \ `Scratch` 编程语言——以及如“代码小时”（Hour of Code）和机器人竞赛之类的倡议。学校系统正忙乱地将编码片段挤进它们已经拥挤的课程中；英国已规定\
  \ 5 至 16 岁的学生必须上计算机科学课，而中国快速增长的中产阶级父母也要求他们的学校系统效仿。\n\n但许多编码者自己并不认服编程真的是一种核心技能，能与写作或阅读并列。`Stack\
  \ Overflow` 的联合创始人杰夫·奥特德（Jeff Atwood）写过一篇文章，认为说“每个人都应该学习编码”就像说“每个人都应该学习水管工程”一样荒谬。社会确实需要许多合格的水管工，以及少数天才；它可能需要每个人都知道水管工程本质上*是什么*。但对世界来说，更好的服务是让人们专注于他们热爱的事物，并让那些对水管工程（或编码）感兴趣的人专注于此。\n\
  \n事实上，假设编码对于解决世界未来的问题至关重要，其问题在于，这会危险地滑向硅谷式的“解决方案主义”——即假设，嘿，世界上的每个问题都应该用某些软件来解决！“这把方法置于问题之前，”奥特德指出道，“在你冲出去学习编码之前，先`弄清楚你的问题到底是什么。`。你真的有问题吗？你能用别人能理解的方式向他们解释吗？你深入研究过该问题及其可能的解决方案吗？编码能解决那个问题吗？你*确定*吗？”人文科学之所以仍然是一门重要的研究领域，是因为它们帮助我们理解人类行为中那种灰色的、疯狂的复杂性。它们帮助我们定义对社会和人类精神的愿景，而在我们纠结用哪种工具——编码？水管工程？城市规划？——来帮助我们实现目标之前，这是至关的第一步。\n\
  \n所以，任何有小孩的人可能都目睹了 STEM 热潮的兴起，并想：*我的孩子应该学习编码吗？* 和大多数事情一样，真正的答案是平庸的中间地带。正如几个编码者和教育者对我说的：确实，所有小学都应该在某个时候让孩子们接触*一些*编码，帮助他们发现自己是否对此感兴趣。这可能不值得从基础数学、历史和文学中挤出稀缺的时间来不断对所有孩子进行训练。但除非学校让孩子们尝试，他们就不知道自己是否喜欢。或者说，唯一决定想成为编码者的孩子，将是那些父母能提供技术支持的富裕书呆孩子。\n\
  \n真正更重要的是，培养那些奇特的文化切入点，让下一代孩子有机会玩玩代码。在教室里教孩子固然可以，但通常很枯燥。那些微小的抽象“如何编写算法”课程无法激发想象力。不，强大的切入点往往出现在课后的流行文化世界中。孩子们对编码产生兴趣通常是因为他们想做一些有趣的东西来让同龄人印象深刻。这就是为什么许多开发者谈论设计视频游戏或为喜爱的电视节目和乐队建立粉丝网站的原因：这些是真正有意义的项目，让他们向朋友炫耀。他们学习编码不是为了“学习编码”，而是为了实现某种具有文化影响力的东西——一个他们自己的游戏，一个向他们的人展示对昨晚《处女玛利亚》（Jane\
  \ the Virgin）剧集细致解读的网站。\n\n例如，在过去的十年里，编码的一个意想不到的强大媒介是游戏 `Minecraft`。表面上看，这个游戏就像是数字版的乐高：玩家“采矿”材料块——砍树获取木材，挖掘地面获取泥土、铁或黄金——然后将它们组合成成百上千的新区块，用它们创建从房屋到整个城市的各种结构。大多数孩子仅仅在那个层面享受它。\n\
  \n但一部分玩家发现这个游戏某种程度上是编程的入门。这是因为 `Minecraft` 包含了一种类似于电气线路的“红石”，它可以让你制作类似于软件语言的逻辑电路。如果你点击这个开关*并且*那个开关，灯就会亮；转动那个杠杆*或者*那个杠杆，门就开了。（这些是\
  \ `AND 门` 和 `OR 门`，事实上你可以用 `Minecraft` 构建你在编码和微芯片中看到的许多主要逻辑形式。）于是这些孩子开始构建极其复杂的机制——复杂的门、走过时会触发的小陷阱——然后把它们展示给朋友看并在网上发布视频。这些孩子们发现，`Minecraft`\
  \ 是一个能够用逻辑构建酷东西很有趣的世界，并让他们在外界面前显得厉害。对于这些孩子来说，`Minecraft` 不仅仅是一个游戏。正如我的朋友哲学家兼游戏设计师安·博格斯特（Ian\
  \ Bogost）曾指出的那样，它是这一代的“个人电脑”，他们的 `Commodore 64`。是这台机器让他们揭开帷幕，看到数字事物是如何制作的，并开始自己制作。由于红石作品通常第一次无法正常工作，你也学会了调试的痛苦与快乐。\n\
  \n\n\n\n我从未见过任何关于有多少孩子从红石（redstone）转为实际编程的数据。这可能只占所有 Minecraft 玩家的一小部分，就就像接触过 Commodore\
  \ 64——或者在 1999 年在网站上“查看源代码”的孩子中，只有一小部分成为了程序员一样。但他们确实存在。英国的一名青少年奥利弗·布鲁德胡德（Oliver\
  \ Brotherhood）对比红石布线着迷，并开始制作日益复杂的机器。他开始在网上发布这些作品的视频，并附上制作过程的步骤说明，很快他的订阅者就多到可以靠此赚取相当的兼职收入了。但他对编码也产生了兴趣，并发现自己在花费了大量时间设计和理顺\
  \ Minecraft 装置的逻辑门后，他学得很快。他申请了大学的计算机科学专业并被录取了。\n\n“在红石社区里，”他说，“我周围很多人都是程序员。”事实证明，当他在讨论论坛上发布关于红石的内容时，他发现虽然他的粉丝中有些\
  \ 10 岁的孩子，但另一些是以代码为生的成年人。\n\n对于“如何帮助年轻人进入编程”这一总体问题，这是一个教训：文化娱乐往往是最具激励性的途径。人们学会运用逻辑和像机器一样思考，不仅仅是因为这项活动本身有趣，还因为他们正试图——正如帕珀（Papert）所意识到的——创造别人觉得很酷的东西。所以，虽然\
  \ Minecraft 可能是意想不到的强大编程入门途径，但它之所以拥有这种力量，是因为游戏有趣且酷。（Minecraft 本身的创造者从未打算让它具有任何教育意义，也没有打算让它成为学习逻辑的方式。“正如\
  \ Minecraft 主开发人员延斯·贝根斯滕（Jens Bergensten）告诉我的，“我们从未出于那种意做过事情。我们总是为了自己制作游戏。”）Neopets\
  \ 可能也是如此：它的创造者并没有想过*嘿，我们正在创造的东西将培养出一整代前端开发人员。*他们创造了一个玩起来很酷的虚拟世界，而人们利用它来学习。\n\n在吸引人们进入编程时，文化是一种强大的力量。\n\
  \n***\n\n纯粹的倔强也是如此。\n\n让拉斯蒂·贾斯汀（Rusty Justice）决定将编程带到肯塔基州乡村的原因是什么？他被一个来自纽约市的富人告诉这是不可能的。\n\
  \n2011 年，当时担任纽约市长的亿万富翁迈克尔·布林格（Michael Bloomberg）向山地俱乐部捐赠了 5000 万美元支持“超越煤炭”（Beyond\
  \ Coal）运动，该运动旨在推动促进可再生能源崛起和终煤电的政策。这本身让贾斯汀感到愤怒，因为他是煤炭作为廉价能源来源和肯塔基州利润职位的坚定捍卫者。\n\n\
  但在 2014 年，布林格更进一步，他积极地否认了矿工可以学习制作软件的想法。\n\n“你不会教煤矿工写代码的，”布林格在布鲁伯格新能源金融峰会上说，“马克·扎克伯格（Mark\
  \ Zuckerberg）说你可以教他们写代码，一切都会变得很棒。我不知道该如何告诉你们……但不行。”\n\n这激怒了贾斯汀。“它触及了你可以贴在我们身上的每一个刻板印象的标签，即我们不聪明、不会做事、很可怜，诸等等，”贾斯汀告诉《背后频道》（*Backchannel*）。“这就像在公牛面前挥舞红旗。”你认为矿工无法弄懂如何写\
  \ JavaScript？再想想想吧。\n\n# 谢谢\n\n如果没有我的经纪人苏珊·格拉克（Suzanne Gluck）充满热情的洞察力，以及我的编辑斯科特·莫耶斯（Scott\
  \ Moyers）的鼓励、卓越的文笔和长远眼光，这本书就不可能存在。\n\n我深感谢每一个花时间接受我这本书采访的人。他们有数百人，他们对时间和知识的投入都极其慷慨。并不是所有人最后出现在这些篇章中，但他们的每一个想法、观察和故事都帮助丰富了我这里的所有的写作。\n\
  \n在编写《编码者》（*Coders*）的过程中，我有幸与许多才华横溢的人交流，他们提供了宝贵的反馈和对话。这包括 Max Whitney、Fred Benenson、Tom\
  \ Igoe、Michelle Tepper、Saron Yitbarek、Katrina Owens、Cathy Pearl、Tim O’Reilly、Caroline\
  \ Sinders、Heather Gold、Ian Bogost、Marie Hicks、Anil Dash、Robin Sloan、danah boyd、Bret\
  \ Dawson、Evan Selinger、Gary Marcus、Gabriella Coleman、Greg Baugues、Holden Karau、Jessica\
  \ Lam、Karla Starr、Mike Matas、Paul Ford、Ray Ozzie、Ross Goodwin、Scott Goodson、Zeynep\
  \ Tufekci、Steve Silberman、Tim Omernick、Emily Pakulski、Darius Kazemi、Cyan Banister、Craig\
  \ Silverman、Chris Coyier、Chet Murthy、Chad Folwer、Brendan Eich、Lauren McCarthy、Annette\
  \ Bowman、Allison Parrish、Dan Sullivan、Grant Paul、Guido van Rossum、Jens Bergensten、Mark\
  \ Otto、Mitch Altman、Peter Skomoroch、Jimoh Ovbiagele 以及 Ross Intelligence 的所有黑客，Rob\
  \ Graham、Steve Klabnik、Rob Liguori、Adam D’Angelo、Belle Cooper、Dug Song、Kim Zetter、David\
  \ Silva、Sam Lang、Ron Jeffries、Susan Tan 和 John Reisig。由于人类记忆的脆弱，这是一个非常不完整的名单。\n\n\
  我很幸运拥有优秀的编辑，他们鼓励并塑造了我对技术的写作。近年来，这包括《纽约时报杂志》（*New York Times Magazine*）的 Dean Robinson、Bill\
  \ Wasik、Jessica Lustig 和 Jake Silverstein；连线杂志》（*Wired*）的 Adam Rogers、Vera Titunik\
  \ 和 Nick Thompson；史史博物馆（*Smithsonian*）的 Debra Rosenberg 和 Michael Caruso；《母体杂志》（*Mother\
  \ Jones*）的 Clara Jeffery 和 Mike Mechanic；以及《本杂志》（*This Magazine*）的 Erica Lenti，仅列举几个。\n\
  \n书中所有的事实错误由我负责。但我的事实检查团队也帮助我减少了这些错误，他们包括 Sharmila Venkatasubban、Lukas Vrbka、Benji\
  \ Jones、James Gaines、Carla Murphy、Annie Ma、Rowan Walrath、Karen Font 和 Fergus McIntosh。\n\
  \n我特别感谢 Penguin 的 Mia Council，她为这本书的实现付出了大量努力。\n\n我欠过去某几个人的人情——包括 Hal，他在 80 年代初的一个夏天借给我了一台\
  \ `VIC-20`，他是我父亲的朋友；他开启了我第一次令人陶醉的每天不停编写 `BASIC` 代码的之旅。我还要感谢一个我不知道名字的人：多伦位于高地公立学校（Summit\
  \ Heights Public School）一位远见卓识的 70 年代图书管理员，他决定购买一本解释如何使用电磁继电器构建逻辑门的书。我在 11 岁时读了那本书，它可能改变了我的人生轨迹。它确实通向了这本书！\n\
