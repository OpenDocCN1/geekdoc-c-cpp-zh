  - [第 8 章]:黑客、破解者与自由战士\n- [第 10 章]:规模、喷子与科技巨头\n- [致谢](#\n- [索引](#\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n因此，程序员是地球上影响力最安静的人群之一。我们生活在一个由软件组成的世界里，他们就是建筑师。他们所做的决策引导着我们的行为。当他们让某件事变得异常简单时，我们就会做得更多；如果他们让某件事变得困难或无法实现，我们做的就会更少。当编码人员在\
  \ 90 世纪后期和 20 世纪初制作出第一批博客工具时，它引发了自我表达的爆发；当发布内容突然变得容易时，数以百万计的人加入了其中。当程序员在同一时期发明了“文件共享”工具时，娱乐产业震动了，他们眼睁睁看着自己对分发的控制权烟消云散。事实上，他们通过雇佣自己的程序员发明“数字权利管理”软件来反击，将其置于音乐和电影制品中，让普通人更难以复制和分给朋友；他们试图创造人为的稀缺。如果富有的利益集团不喜欢\
  \ `code` 的行为，他们就会花钱编写反向作用的软件。代码赋予，代码也可以夺走。\n如果你回顾世界历史，你会发现在某些时刻，不同的职业会突然变得至关重要，其从业者也会突然变得强大。世界会突然需要并奖励他们那套特定的技能。\n\
  ## 法律时代\n\n在美国革命百年后，一个新的职业阶层脱颖而出。随着工业革命的轰轰发展，这个国家开始城市化，摩天大楼在纽约、波士顿和芝加哥拔地而起。突然之间，弄清楚如何精确地让数百万人紧密居住在一起，而不会淹没在自己的排泄物中，同时为他们提供足够清洁的水、空气和交通方式变得至关重要。这需要大量的巧妙机械，因此土木工程师、建筑师和城市规划师突然掌握了主导。任何能在这些领域工作的人——地铁建造者、桥梁建造者、公园规划师——在决定美国居民如何生活方面都起着巨大的作用。再次，单一的设计决策将对人们的生活产生巨大影响。罗伯特·摩西是\
  \ 20 世纪中期纽约著名的城市规划师，他在一系列如君般的活动中，建造了数十高速公路和公园，定义了今日哥谭市的运作方式。他的某些决策毁掉了一些的人生。1948\
  \ 年，他开始修建 `Cross Bronx Expressway`（跨罗恩克斯高速公路），认为这有助于缓解从长岛到新泽西的交通。它确实起作用了，但对被高速公路穿过的主要是黑人的社区来说，付出了惨重的代价。高速公路迅速吸引了如此嘈杂、排放烟雾的卡车流量，破坏了附近任何房屋的房产价值，使数百个以非洲裔美国人为主的家庭变得贫困，并生活在一个环境远不舒适的社区中（摩西似乎也喜欢快速行动并破坏一切）。\n\
  如果我们想理解当今世界是如何运作的，我们应该去了解一下编码员。构建当今世界的人究竟是谁？是什么驱动着他们？什么类型的人格会被软件吸引？他们的工作如何影响我们？也许最有趣的是，这对他们又意味着什么？\n\
  ***\n## Hello, World 时刻\n\n\nprint (\"Hello, World!\")\n\n\nHello, World!\n\n\n\n\
  \n\n\n这就是为什么“Hello, World!”（你好，世界！）这句话充满了隐喻的色彩。它让人想起所有的宗教传统，在那里，神通过言语创造了万物：“起初有道。”（基督教程序员对这种联系情有独钟：共同编写游戏世界《迷雾》（*Myst*）的福音徒罗宾·米勒（Robyn\
  \ Miller）在创作出酷炫的东西后，偶尔会停下手中的代码，想：“这乃是好的。”）但“Hello, World!”也有阴暗的一面。它让你想起赋予某些可能脱离你控制的事物生命时，所带来的意想不到的副作用——就像弗兰肯斯坦博士那个被忽视且满怀恨意的怪物，他最终杀害了他的亲人；或者《魔法师弟子》中那些无法控制、不断重生的扫帚。）代码也是如此。你的新闻动态帮助朋友们为患有癌症的朋友组织照顾；它也帮助那些玩梗图的人传播完全疯狂的阴谋论。这种魔法与代码之间的和谐共鸣，解释了为什么\
  \ 80 年代初的青少年极客程序员能如此流畅地融合《地下城与龙》（一种将幻想与概率骰子数学相结合的游戏），或托尔金史诗中那些吟唱咒语的巫师。在 60 年代，当程序员发明了一种不断在后台运行的代码类型时，他们称之为“daemon”（守护）。当计算机科学家拉里·沃尔（Larry\
  \ Wall）创建 Perl 语言时，他包含了一个名为“Bless”（祝福）的函数。正如编码员丹尼·希利斯（Danny Hillis）曾指出的：“几百年前在我的故乡新英格兰，对我职业的准确描述会让我处在火刑。”\n\
  ## 控制的魔法与傲慢\n这种魔法般的控制感可能是令人陶醉且有趣的；它往往造就一种星星式的理想主义。它也可能导致某种史诗般的傲慢，特别是对于那些尚未被生活和自己的失误教训过的年轻程序员。程序员兼技术文化评论家马捷杰伊·切格洛夫斯（Maciej\
  \ Cegłowski）指出，擅长编程的人往往“认为自己拥有一种独特的能力，可以从原理理解任何系统，而无需先前的培训，这他们他们卓越的分析能力。在软件设计这个人工构建的世界里，成功培养了一种危险的自信。”正如计算机科学家约瑟夫·魏森鲍姆（Joseph\
  \ Weizenbaum）在 1976 年指出的，“如果阿克顿勋关于‘权力腐人性’的观察在一个如此容易实现全能的环境中不适用，那人们将会感到惊讶的。”\n##\
  \ 编码工作的现实\n编码并不易事。它需要独自坐上小时，试图在脑海中进入一段软件错综复杂的细微之处——*这里*的循环是如何是由用户的*那个*输入触发的，除非*另一个*子程序当前正在运行，如果是那样，*这个*函数就应该启动。我听过人们将其将其描述为“试图构建并记忆伦敦每一条街道的结构”以及“在脑海中让一座巨大的纸牌屋移动到到位”。这就是为什么它倾向于吸引内向者和解决难题的逻辑型思考者，这类人乐意在周六晚上\
  \ 11 点坐在家里，为已经废弃的 1997 年网络摄像头编写驱动程序，仅仅是因为……嗯，他们在抽屉里发现了一个旧的 1997 年摄像头并想让它运行起来，而且*该死*这是一个有趣的问题，而且它比与人打交道要容易预测得多。（这种内向并不是完全的。事实上，现今开发软件日益具有社交性；它需要团队合作，而且坦率地说，在与同事开会讨论做什么上花费的时间往往比实际操作的时间更多。）\n\
  然而，比起内向或逻辑，编码挑选的是那些能够处理无尽挫败感的人。因为计算机会执行你要求它们做的任何事情，所以你需要给它们非人类精确的指令。我之前展示给你们看的那行“Hello,\
  \ World!”代码？想象一下你正在匆忙输入，结果不小心打成了这样 . . \n```python\n```\n. . . 所以，哎，你漏掉了引号。尝试运行它，砰——它崩溃了。计算机*不-不会*运行它。而且计算机对此并不友好；这里没有“我非常抱歉，克莱夫，出问题了。”没有客套话。它只是吐出一个像\
  \ `SyntaxError: invalid syntax`（语法错误：无效语法）这样的错误信息，由你来找出自己做错了什么。编程语言是语言，是一种与机器交流的方法；但与计算机交流就是与这个星球上最死板的实体交流，一个冷酷且刻板的语法学家。当我们与人类交流时，他们会花大量精力帮助理解我们所说的话。计算机不会。它们会抓住你的每一个细微的错误并并在你面前反复强调，直到你修复它们为止。这种体验也会进入你的大脑和性格中。当你遇到一个程序员时，你遇到的是一个核心日常体验是无休止的失败和磨人般的挫败感的人。\n\
  ## 失败的循环\n因为代码不断是破碎的、搞砸的、一团糟的，充满了 Bug。即使是你两分钟前刚写的东西，在第一次尝试运行时可能也也会崩溃。“当你学会给计算机编程时，你几乎没有第一次就做对，”先驱计算机科学家兼教育家西摩尔·帕珀特（Seymour\
  \ Papert）在 1980 年写道。他认为这种经历是所有程序员心理转折的支点。你写了一些代码，尝试运行；它失败了；所以你的大部分工作就是搞清楚你到底犯了什么错。那些能处理这种日常烦恼的人会蓬勃发展。不能处理的人会逃避。1949\
  \ 年 6 月，计算机科学家莫里斯·威尔克斯（Maurice Wilkes）正要上楼梯，他突然领悟到：“生命中很大一部分花在了寻找错误上。”七年后，所有程序员都生活在这种。更有趣（而且如今更常见）的，不是修复自己工作中的错误，而是修复年前某位程序员编写的代码，那是程序员所谓的“面条代码”，充满了混乱的格式、令人困惑的变量名，以及像《芬尼根环》（*Finnegans\
  \ Wake*）一样复杂的结构。于是你投入，缓慢地、缓慢地修复它。程序员被认为是“西西弗斯式的”。他们在绝望的失败中劳作，看着石头滚回山坡 . . . 直到有一天它突然翻越了山顶。而他们在另一侧看到了什么？另一座山坡。\n\
  \n\n\nnames = [“Cynthia”, “Arjun”, “Derek”, “Alondra”]\n    print (“Hello there,\
  \ ” + x + “!”)\n\n\nHello there, Arjun!\nHello there, Alondra!\n. 这更有趣了。嘿，现在机器在为我们做一些杂活了。你可以给这个程序一个包含\
  \ 10 个名字的列表，循环就会运行 10 次；给它 10,000 个名字，它也会同样高兴地打印出 10,000 次问候。或者 1000 万次。甚至是 10 万亿次。\n\
  换句话之，代码非常擅长让事情实现`scale`。计算机可能需要极其精确的指令，但只要你的指令正确，机器就会不知疲倦地为全世界的用户一遍又一遍、反复又一遍地执行你的命令。看着你创造的尽职尽责的机器人突然被数百万人使用，这是一种令人振奋的感觉。因此，许多软件工程师像蛾蛾火一样被`scale`所吸引。他们热爱创造运行的代码，不仅是为了他们自己，不只是为了几个当地朋友，而是为了整个星球，而且就在`now`。解决一个问题，你就为所有人解决了这个问题。\n\
  当 Sanghvi 和 Facebook 的工程师们思考如何制作 News Feed（新闻动态消息）时，他们最初将其构想为一种个性化的新闻服务。它将是 18 世纪欧洲贵族公报的现代版本。一个通世事的仆人会带来关于你所认识的各种社会人士趣闻的报告。或者，正如\
  \ Sanghvi 所说，它将像一份个性化的报纸。“认为三个刚从大学毕业的工程师能够为 1000 万用户构建一份个性化报纸，这似乎很疯狂，”她说道。这就是`scale`带来的那种深层的、令人眩晕的喜悦。\n\
  伴随而来的还有它的近亲——对效率的狂热奉献。由于他们随叫随唤拥有可以用机器人般的完美度重复指令的机器，程序员们非常看不起自己重复性地做事情。他们对低效率的厌恶几乎是美学上的——他们像避开恶臭气味一样避开它。任何可以自动化流程、更高效地完成任务的机会，他们都会去做。（Sanghvi\
  \ 甚至将这种理念延伸到了她的婚礼。她母亲想在印度安排 Sanghvi 的婚姻，Sanghvi 同意了，因为她觉得这比约会高效得多——从纯粹的计算机科学角度来看，约会可以被视为一种资源耗费极大的排序算法。“我曾是包办婚姻的忠实粉丝，”她在一次演讲中曾说道。“它吸引了我体内的工程师特质。它们很实用，而且成功的概率更高。”）\n\
  这种对优化——以及`scale`——的本能欲望，导致了软件公司与公民生活之间发生了许多碰撞。Facebook 将我们的生活视为一个信息传输低效的问题。在 Facebook\
  \ 之前，我整天都在做（以及思考和阅读）我的朋友可能觉得有趣的事情。但我无法轻松广播我的生活，他们也没有办法倾听；我们必须依靠不定期的电话、酒吧里的聚会、人行道上的聊天。News\
  \ Feed 本质上是在全球范围内对我们边缘视觉的大规模优化。Uber 也是如此，它优化了叫车的体验；Amazon 在购物方面也做了同样的事；还有许多利用“零工”员工创建即时服务的公司。尽管在每种情况下，这些被优化狂热疯狂驱动的科技公司，对任何重视连续性的个人、政府或社区都会造成如闯瓷店般的破坏：那些宁愿要稳定工作也不愿要零散工作的司机和员工；那些因为无法与低摩擦的在线销售竞争而失去本地商店和工作的邻居；或者是某种突然意识到\
  \ News Feed 虽然在许多方面无足连城，但有时也会让我们彼此之间暴露得过度的文化。\n代码让效率和`scale`变得容易、诱人，且几乎不可避免。这也是为什么程序员如此容易融入商业建设，这也是为什么一些人如此频繁地滑向自由意志主义思维的原因。他们的才华完美契合了资本主义的核心策略，基本上就是，“做一些比以前稍微高效一点的事，然后从中榨取利润。”注意，软件由于其本质也异化了资本主义的许多假设。软件是一个东西，一台执行某些任务的机器，所以你可以拥有它；但因为它也是一种语言形式，它可以很容易被分享。因此它`确实`被分享了，而且几乎无间断。程序员对自己的日常工作表现非常健谈且开放，经常在在线论坛发布他们的软件问题，并花费数小时帮助他人解决问题。（20\
  \ 世纪 80 年代的一项研究得出结论，程序员对职业的忠诚度高于对雇主的忠诚度。）即使在最具贪婪资本主义色彩的硅谷公司内部，也有程序员花费大量时间——在办公位上，在工作时——帮助解决其他路路人的\
  \ Bug。在自由和开源软件的世界里，通常有一种社群主义精神，程序员经常免费地为任何人都可以自己免费使用的软件做出贡献工作。\n硅谷那些富有的自由意志主义者往往受到大量的媒体关注。这可以理解。因为他们掌握着大量的资金，并决定资助什么，他们对“颠覆”的痴迷决定了科技领域的很多方向。但基层程序员的政治观点比想象中要多样得多：有在喝完三杯酒后承认自己投特朗普的暴发户（brogrammers），有住在集体公寓里认为财产即盗窃的无政府主义者，也有参加\
  \ JavaScript 大会的传统左派，他们在 Reddit 上精力充沛地发布关于女性主义的内容。\n... ... ...\n女性主义和多元化确实是该行业的痛点。在女性参与率方面，软件是少数几个出现过倒退的高声望、高收入行业。女性在\
  \ 50 年代是第一批程序员之一，并构成了该领域首批丰碑级人物，例如创建了第一个`编译器`的 Grace Hopper，或者非常有影响力的 `Smalltalk`\
  \ 语言的共同创造者 Adele Goldberg。1983 年，女性占计算机科学专业的比例为 37.1%，但到 21 世纪 10 年代，这一比例下降到原来的一半，约为\
  \ 17%。（在真实的职场市场上，数字也是如此；2015 年的一项统计发现，谷歌或微软等知名企业技术职位上的女性比例大约在百分之十几到 20%之间。）种族构成也没有更加多样。\n\
  \n这极具讽刺意义，因为软件行业长期以来一直推崇其作为纯粹优胜主义者的自我形象。从理论上说，唯一重要的是你是否优秀。这种幻想在某种程度上是可以理解的，因为在某个层面，它受到了软件行业硬性现实的启示。在机器层面，`code`\
  \ 确实感觉是优胜制的：`写得烂的软件`会崩溃，而`写得更好的东西`则不会。事实上，这种二元对立的清晰正是软件工程师热爱它的原因；就像长跑一样，解决一个`极其困难的编码问题`感觉是对自己能力的真正衡量。软件领域也可能比许多其他领域更具民主化的准入性，因为在这里，`自学业爱好者`可以与拥有`PhD`\
  \ 学位的人并肩。（这在外科、法律或航空航天工程领域并非如此。）许多程序员会钦佩地向你讲述某些同事，他们似乎不仅比自己更熟练，而且高得令人眩晕——精英黑客、像《黑客帝国》里的尼奥一样，能产出`code`\
  \ 并比凡人同事快一个数量级地解决难题。因此，这种神话的根源非常深。浸入这样一个有着成败攸关标准的领域，许多年轻白人男性由于缺乏对各种背景的少数群体所面临的日常细微歧视的感受，陷入这种神话的控制并不意外；他们真地相信（有时甚至带着一种近乎孩子般的天真，即使当他们对此感到愤愤或愤怒时）这个领域是一个简单透明的优胜劣汰；如果女性和少数裔没有发展好，是因为他们不够努力，或者在基因上没有赋予天赋。\n\
  显而易见，这完全不是事实。当然，有许多证据，包括使用硅谷推崇的`A/B testing` 的研究。当我采访`tech firms`中的女性和少数裔时，许多人提到了各种形式和程度的歧视，从微妙的侮辱到赤裸裸的骚扰。软件行业如何缩小和收紧的故事，是一个关于机会的现代警示故事——以及我们如何更好地保障它。\n\
  而且这里的代价高得惊人。在涉及到产品设计时，文化至关重要。如果一个工具是由本质上文化同质化的团队构建的，它将会有严重的盲点，正如任何一年级 MBA 学生学到的那样。因此，塑造我们生活的`code`\
  \ 也是如此。近年来最具影响力的软件是由一群主要是年轻人、主要是白人、主要是男性的群体制作的，他们没有预见到自己的`code` 将如何影响那些与他们并不相似的人。仅举一例，这就是为什么`Twitter`\
  \ 遭受如此多虐待和骚扰的原因之一。开发该平台的年轻人团队在人口统计学上，经历过网络虐待的可能性要低得多。他们早期没有将其视为一个不可避免、迫在眉睫的、他们需要解决的问题。相反，一名员工将他们的公司称为“自由言论党的自由言论派分支”。他们早期很少设计对防止骚扰的保护措施，多年后，喷子和白人至上主义者发现`Twitter`\
  \ 是骚扰目标的绝佳方式。\n***\n... ... ...\n事实证明，扩大程序员的世界是`Ruchi Sanghvi` 现在正尝试做的事情之一。\n当我第一次见到她时，她仅有\
  \ 35 岁，但在软件行业的蜂鸟代谢速度中，这让她成为了一个`幕后功臣`。在`Facebook`工作五年后，她创立了自己的公司，将其卖给`Dropbox`，并在那里担任副总裁。离开`Dropbox`后，她启动了一项旨在启发下一代程序员的创业：`South\
  \ Park Commons`。这是位于旧金山市场南区的一栋翻新办公大楼，是年轻技术人员思考未来的枢纽。\n“这就像一个沙龙，”`Sanghvi` 在一个炎热的夏日我去午餐时说道。工程师、研究人员和企业家的小群坐在长桌旁，埋头处理邮件和阅读白论文，墙上挂着一幅巨大的艺术品——一系列锯齿状的木拱门。`Sanghvi`\
  \ 每次接收 30 到 40 名成员，通过口碑吸引他们，然后鼓励他们进行交流、组织讲座，并在理性的边缘讨论想法。它并不是一个真正的“加速器”，那种让年轻人为了在三个月自创一家公司而拼命，绝望地吸引风险资金的温室。它更具投机性，旨在说服成员选择一个真正全新、奇特的领域进行研究。最近，话题主要集中在人工智能（AI）以及编写可以自主学习的`algorithms`的黑暗魔法上；`Sanghvi`的至少六名成员最终在`Google\
  \ Brain`或非营利组织`OpenAI`计划中工作。\n从`Commons`诞生的六家初创公司由女性创立。这也是一种成就：让更多女性进入关键的创始人角色，意味着她们可以深度影响公司的发展轨迹，并从成功中受益。`Sanghvi`\
  \ 记得曾为了获得`Facebook` 价值的公平份额而争论。当她与`Mark Zuckerberg`交谈时，她提出了一个要求：“我说，要么在股权上与我持平，要么增加现金薪酬，”她告诉我。她用极客术语对`Zuckerberg`说：“我唯一真正在乎的是构建东西，”她对他说，“我不希望在工作时脑子里还想着这件事。我只想想着构建东西！而你也不想让我把这件事挂在脑子里。”（她指出，当时并不是在抱怨获得得比男性少；在那时她并不知道个人的具体情况。）\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  10 PRINT “JIM”\n```\n当他的朋友运行程序时，屏幕上一遍又一遍地填满了“JIM”。埃弗林格姆目大口呆了。“我以为那是魔法，”他告诉我，“我只是想知道*这到底是什么鬼了术*。我当时想：‘我必须知道！’”\n\
  ## BASIC 的力量\n那是`BASIC`语言。我主张从历史角度来看，`BASIC`是历史上影响最远的计算机语言，因为它极大地为业余爱好者打开了大门。在威尔克斯疯狂黑客时，`Assembly`（汇编语言）读起来写起来非常晦涩。它是所谓的低级语言，需要大量精力才能学会阅读和掌握。等麻省理工的黑客们到达时，看起来更像标准英语的高级语言已经很常见，例如旨在帮助普通科学家和数学家使用计算机进行计算的`Fortran`，或者为企业设计的`COBOL`。但`BASIC`是其中最容易上手的之一。它于\
  \ 1964 年发明于达特茅斯学院，全称是“初学者全能符号指令代码”（Beginner’s All-purpose Symbolic Instruction Code），使用非常简单的命令，新手可以轻松理解并运用。\n\
  之前展示的埃弗林格姆朋友写的那个小程序？那可是那代`VIC-20`玩家的“Hello, World!”，是大多数孩子在拿到这台机器时尝试的第一段咒语。即使你从未编写过程序，它也很易读：程序的第一行编号为“10”，告诉计算机`PRINT`（打印）名字“JIM”。第二行代码编号为“20”，告诉计算机回到第\
  \ 10 行。它们合在一起创造了一个微小的无限循环，会不断打印并重印你的名字，直到计算机关闭。这个简单的两行程序完美地说明了计算机那惊人的、异类的力量：就像一个机器人精灵，它会按照你的指令行事，精确且永不停歇。\n\
  青少年很少有机会能以这种如此直观且触手可及的方式去理解*无限*的本质。但通过输入那两行程序，他们尝到了那种力量的滋味。看着自己的名字滚动，给埃弗林格姆带来了一种情感的冲击，正如济济（Keats）在他的诗《初次看查普曼的荷马》中描述得如此美妙：就像强壮的科尔特兹，他登上了一座山峰，突然看到了一片全新的可能海洋，人们可以在上面似乎永远航行。\n\
  ## 黑客的寒武纪大爆发\n计算机公司非常鼓励青少年去航行这片海洋。事实上，80 年代初的大多数计算机在到时都带有一本手册，一步一步地解释如何编写`BASIC`程序。（我跟埃弗林格姆同岁，这也正我第一次学习编程的方式。）计算机还具备不错的显示图形和播放音符的能力，这使得它们特别适合制作简单的电脑游戏——对于\
  \ 1980 年代的青少年来说，这是一种极具毒瘾的吸引，他们不可避免地开始尝试制作自己版本的街机热门游戏，如《太空入侵》、《吃豆人》，或者像《祖之地》这样的文字冒险游戏。（这就像是街机世界的同人小说。）总而言之，这些可以插入电视的计算机催生了全球黑客的寒武纪大爆发。当你把几乎可以执行你交代的任何任务的廉价机器交给基本上没有任何成年人监督的青少年时——因为他们的父母根本不知道电脑是什么——你就创造了一场软件界的“无限猴子实验”。很快，青少年程序员开始拼凑各种各样的东西：会咒骂说脏话聊天机器人、被称为“细胞自动机”的迷人人工生命、赌场游戏、小型数据库和会计程序、电脑音乐以及无尽品种的游戏。\n\
  埃弗林格姆渴望着加入这个圈子。他来自一个下中阶级家庭，父母买不起为他买一台电脑。因此他开始疯狂寻找每一份空闲工作——夏天割草坪，冬天铲雪——直到他攒够了钱，加上母亲的资助，买了自己的自己的`VIC-20`。\n\
  ## 学习与拨号\n现在他有了机器；怎么获取游戏呢？“我很穷，买不起任何，”他说。他需要免费的游戏。所以他开始买计算机杂志，比如 Commodore 的`Run`，里面包含了简单游戏的完整代码。在他输入这些代码时，他开始理解它们是如何工作的。慢慢地，通过尝试，他开始编写自己的软件。\n\
  然后，通过那些计算机杂志，埃弗林格姆听说了更酷的东西：公告板系统（BBS）。在 BBS 上，你可以使用调制号器拨入全国其他地方别人的计算机，与他们聊天，最棒的是下载免费软件。对于一个穷光少年来说，“免费”听起来很有吸引力，所以他再次打零工钱买了一个调制号器。埃弗林格姆开始连续拨入全国的\
  \ BBS，下载软件并利用下载的内容学习更多`BASIC`。但在这种疯狂拨号一个月后，电话单来了。他的妈妈拿着账单走下楼流了起来；他欠了 500 美元。埃弗林格姆羞愧极了：“那比她的*房贷*还多，”他说。\n\
  所以现在他面临一个新挑战：如何骗取长途电话。他开始研究，并发现了长途电话卡的工作原理。你会拨入他们的主 1-800 号码并输入你的账户号码，这是一个六位数字。所以他需要做的就是反复不断地拨打那个\
  \ 1-800 号码，遍历每一个可能的六位数字，直到他撞出一些真正有效的数字。这对于人类来说是一项痛苦且无聊的任务——但对计算机来说却完美。（马修·布罗德里克的角色在《电子游戏》中使用计算机完成这一点；所以黑客们把这种技巧称为“战争拨号”。）埃弗林格姆很快写了一个\
  \ Commodore 64 程序，让它深夜反复拨打一家名为`LDX`的长途公司的 1-800 号码，在他睡觉时持续运行。当他醒来时，程序已经创建了一份可以使用的有效长途代码列表。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n在这种蜂鸟般的代谢速度驱动下，网景（Netscape）在一年内发布了四个版本的浏览器。工程师们将软件生产变成了一种几乎近乎现场的活动，就像一个乐队演奏一系列歌曲，并观察观众的反应。当看到普通人开始在网上搜索信息或建立自己的网站时，工程师们感到振奋不已。他们添加一个新功能——比如浏览器内置电子邮箱！——然后看着它在网上流传。\n\
  “这是我第一次处于这样一个影响力的循环中，”埃弗林格姆（Everingham）说道，“我写写一个功能，我能在产品中看到自己，我能看到它正在改变世界。那种感觉比我用过的任何药物都更让我上瘾。”\n\
  但崩溃在即将来。四年后，在微软的竞争和一次公司收购的冲击下（这次收购导致了一次从头重写浏览器的拙劣尝试），网景陷入了萎缩状态。埃弗林格姆离开了，坚信自己再也不会经历那样的成功了。在四年的时间里，他陷入了抑郁；网景曾让他富有，但就像那些年轻的流行星和彩票中奖者一样，突如其来的财富摧毁了他的人际关系。程序员在应对足以改变生活的巨额财富方面，并不比我们其他人更好。\n\
  “我的家人表现变了，朋友对我的态度也变了，我有了新朋友，老朋友却离开了。我当时在想，这到底什么鬼？每个人都想要些什么，”他回忆道。女性开始追求他，这虽然很有趣但也让他感到不安；他长得足够帅，但这种感觉很新鲜。（有了财富后，“我突然间变成了布拉德·派特。”）在接下来的五年里，由于他对金钱带来的社会问题感到非常焦虑，以至于将其中大部分捐给了家人和慈善机构。但他仍然留在了软件行业，并共同创立了一家制作在线通话软件的公司。这种软件被从事电话支持工作的居家办公人员大量使用。然而，其中一个用户事实证明是他的姐姐。一场内耳感染导致她患有前庭功能障碍，使她无法出门。她多年没有工作，但后来开始使用该软件成为一名电话支持人员；埃弗林格姆指出，最终她熟练到了某种程度，一家公司聘请她担任远程经理，年薪五位数。\n\
  他开始看到用代码改变生活的一种新方式。你可以通过浏览器来华丽地这样做；也可以静静地做，通过一个虽未获得公众赞誉但同样改变人生的产品。“改变一个人，或者改变一小群人——产生那样的影响——这种感觉和我之前获得的一样疯狂，”他意识到。\n\
  “我正在重编程我自己。”\n***\n... ... ...\n埃弗林格姆花了几年的时间才找到另一份让他能开发知名软件的工作，那是一个让每个人口口相传的名字。但最终，他被第四波程序员雇佣了——那群至今仍主宰着市场的人。这些程序员是在网页和手机时代长大的，并以此作为他们进入编程世界的入场券。\n\
  当网页在 20 世纪 90 年代中期兴起时，它提供了开始编程的最民主化的方式之一——因为一个好奇的年轻人可以揭开网页的盖子，看看它是如何运作的。当你把浏览器指向一个网站时，该网站会向你的浏览器发送一长页代码——`HTML`、`CSS`、`JavaScript`——浏览器运行这些代码，将其转化为你看到的东西：列表、图片、视频、你点击的按钮。在\
  \ 90 年代，埃弗林格姆和网景的同事意识到，如果人们想看，让他们在浏览网页时看到这些代码会很有趣。于是，他们添加了一个让你查看页面“源代码”的功能。如果你点击它，网景就会打开一个窗口，向你展示当前正在浏览的面的原始\
  \ `HTML`。\n很快，全世界的人都开始点击“查看源代码”，并窥见这个疯狂的新世界（网页）究竟是如何运作的。这非常像在 `Commodore 64` 上的\
  \ `BASIC` 革命，只不过速度更快、覆盖范围更广。埃弗林格姆和他那 80 年代的同龄人发现，想要拿到一些 `BASIC` 代码来研究和学习非常缓慢；他们必须从\
  \ `BBS`（电子公告板）下载，或者购买印有了某些程序的科技杂志或书籍。在每次学习新知识的机会之间存在着很长的空隙。\n网页将这段时间跨度压缩到了零。你访问的每一个网页都包含了显示其如何创建的代码。整个互联网变成了一个编程指南的图书馆。如果你愿意，可以将那些代码剪并粘贴到新文件中，修改几个元素，然后观察发生了什么。如果你喜欢你所做的结果，可以使用当时粗糙的新网站托管服务（如\
  \ `GeoCities`）将其放到网上。`BASIC` 将编程从象牙塔带进了青少年的地下室——但网页将其稳固地植入了主流社会。很快，全世界的青少年都开始为他们喜欢的乐队或视频游戏制作网站，上面点缀着幻幻般奇特的字体和图形。\n\
  其中一个制作网站的青少年是迈克·克里格（Mike Krieger）。作为一名生活在巴西圣保罗的初中生，他热爱视频游戏并学了一点 `BASIC`。“我一整个夏天都守在电脑前，”他告诉我。到\
  \ 11 岁时，他被网页深深迷住了，以至于他和一个朋友花了所有时间钻研 `HTML`。在学校里，他们会将读书报告做成自定义网站提交。“我们当时，当然是超级书呆。大家的反应就像是：‘为什么这家哥们不不像其他人一样写写读书报告呢？’”\n\
  克里格并不认为自己是一个程序员；他梦想成为一名记者或纪录片电影导演，穿梭在圣保罗报道那里的腐败政治。他曾见过《上帝之地》的导演卡蒂娅·伦德（Kátia Lund），她给了他职业建议。“不要学新闻，”伦德对克里格说，“学一个你想拍电影的主题。”\n\
  但在 2004 年，在他进入大学前的那个夏天，克里格对开源软件的世界变得越来越着迷，在那里，成百上千的程序员会协作构建任何人都可以使用或修改的应用。一个流行的工具是邮件应用程序\
  \ `Thunderbird`。一天晚上，当克里格听着他喜欢的乐队 Weezer 并阅读 `Thunderbird` 讨论板时，他发现一位美国高管有一个抱怨。这位高管使用\
  \ `Thunderbird` 读取多个不同的邮件账户——个人和工作——有时他会将两者搞混，不小心用个人账户发送了工作邮件，反之亦然。他希望 `Thunderbird`\
  \ 有一套色彩编码系统来显示哪些邮件属于哪个账户。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n如果你真的想从高层次理解那些编程人员的思维方式，那么从零开始构建他们整天每天在做的事情是有用的。对这个领域感兴趣的人，通常是那些喜欢构建、捣鼓、玩弄逻辑的人。但那些能够留下来并成长的人，是那些能够应对极其枯燥且磨人的事情的人：\n\
  漏洞。\n# 第 3 章\n## 持续的挫败感与瞬间的喜悦\nDave Guarino 需要休假了，于是他去了斐济。而那正是漏洞开始大作之时。\n***\n...\
  \ ... ...\nGuarino 是一个口才且幽默的程序员，在 Code for America 担任主管兼开发者。这是一家非营利组织，招聘有公共意识的极客，让他们负责改造政府那些陈旧的高科技系统。在案例中，这个系统是食品券。2013\
  \ 年初，Guarino 在 Code for America 领导的三人团队被旧金山市聘用，让低收入居民更方便地在线申请公共福利，包括食品援助。\n老天保佑，政府的确需要帮助。它现有的食品券网站简直是一团泥泞、令人痛苦的混乱。要申请援助，你必须在\
  \ 30 多个独立的网页上填写信息，其中没有任何一个页面是考虑到手机尺寸而设计的。这对于低收入的加州人来说尤为困难，因为他们大多数人使用价格低廉、流量有限的手机访问网络。加州那套笨重的系统已成为一个真正的问题；它太难用了，以至于加州符合食品券资格的人中，几乎只有\
  \ 50% 申请了。Guarino 和他的团队渴望解决这个问题。\n问题在于，他们实际上无法从零开始重新编写政府网站的代码。他们并没有被要求这样做，而且无论如何，这都意味着对某些老旧的\
  \ HTML 和数据库进行昂贵的内部大手术。\n于是，他们想出了一个奇妙的“黑客手段”（hack）。他们要在现有的杂乱无章网站之上添加一个流畅的机器人层，从而隐藏旧系统。\n\
  起初，他们编写了一个新的、简单的网站。它只是一个清爽的页面，在手机上加载速度很快；它要求新的食品券申请者输入基本信息。然后，在后台，程序员们会施展一些魔法。他们会将申请者输入的信息交给一个自动化脚本。*那个*脚本会导航到旧的、难以操作的政府网站，费力地一个字段一个字段输入新申请者的信息。本质上，Code\
  \ for America 团队创建了一个隐形的守护进程——一个算法助手——它会完成所有的繁琐工作。申请者永远不需要处理细节。他们只需要在整洁的手机网站上输入信息，然后砰的一一下，他们就进入了系统。\n\
  这看起来并不漂亮。但它管用！“这是我能想象到的最‘黑客’的事儿了，”Guarino 的队友之一 Alan Williams 开玩笑道。但如果你在这些复杂的旧系统周围待得足够久，“你会发现，通往深度、稳固、优雅集成的最快、最短的方法，就是直接在上面再盖一层土。”在编程世界中，这种修复方法被称为“封装策略”（encasement\
  \ strategy）——通过将其包裹起来来修复一个多毛的、复杂的系统。但有时这是你唯一拥有的选择；而在本例中，它取得了巨大的成功。在几周内，新申请者源源不断涌入。在两年内，注册人数之多，使得\
  \ GetCalFresh（该应用的名字）被誉为加州政府最实用的新软件项目之一。Guarino 和他的团队对自己的工作感到自豪是合理的。当然，他们可以通过设计帮助千禧一代分享猫\
  \ GIF 的 App 来赚更多钱。但编写真正帮助弱势者的代码要满足感得多。\n事实上，他们对另一个功能有了新想法，他们认为这个功能能进一步改进系统。\n但遗憾的是，这正导致他们制造了一个可怕的漏洞。\n\
  ***\n... ... ...\n他们的想法是让食品券用户更方便地检查卡上还剩多少钱。加州的旧系统要求用户拨打热线，并在冗长的语音树选项中穿梭。“去见*那*才鬼*吧，”Guarino\
  \ 说。语音树是对人性的侮辱；每个人都清楚这一点。所以，他改写了一些 Ruby 后端代码来创建一个电话机器人。如果你通过短信发送你的卡号（或在在线表单中输入）给它，电话机器人就会检查你的余额并通过短信回给你。这对用户来说要愉快得多！为了推广它，他们还投了\
  \ Google 广告。\n到此时，Guarino 需要一些休息时间。他本身就是一个容易焦虑、紧绷的人，经常神经质地搓着胡子，语速极快；在连续几个月的工作后，他需要休假。“好了，伙计们，”他告诉团队，“我去斐济了。我不带笔记本电脑。不带手机。什么都不带。我就在那儿呆着。你们处理这些事情。”*好的，酷，*他们说。*玩得开心点！*\n\
  Guarino 离开几天后，Williams 和他的团队来到公司发现一场灾难正在发生。查询余额系统失控了。\n在通常的一天，它只会被使用大约 100 次。但现在在短短几小时内就收到了\
  \ 5000 条短信。“这*特么*是怎么回事？”他们纳纳闷道。按照这个速度下去，线路将产生巨额费用，或者更糟，被手机运营商切断。为什么人们突然如此频繁地点击它？\n\
  他们的第一个假设是：它被用来诈骗了。有一种传言说，黑党正在批量利用它来获取食品券。“黑党发现了我们的服务并利用它！”他们推测。最糟糕的是，他们无法联系上 Guarino，因为他是这些代码的专家。“所以他们快疯了，而我却失联了，”Guarino\
  \ 笑着说，“他们觉得：‘噢天呐！我不知道发生什么了！’”\nGuarino 几天后从斐济回来，迅速开始消除漏洞；他疯狂地翻阅服务器日志。最终，在几小时后，他发现了问题所在。\n\
  事实是，用户犯了一个错误。有人在那里使用该服务查询余额，这是正常操作。但用户并没有输入卡号——这是他们应该做的——而是不小心发送了*电话机器人服务本身的号码*。所以软件陷入了循环。“服务在互相发短信，来回反复，”Guarino\
  \ 说。\n他承认，这终究是他的错误，是他编写短信机器人代码时的一个缺陷。他本可以很容易写一条规则，确保没有人会小心给机器人发送自己的手机号码。但他从未想过真人竟然会这样做。\n\
  “用户，”他遗憾地表示，“总能找到办法的。”你可能认为你消灭了漏洞，但它们总会找到新的。\n***\n... ... ...\n什么样的性格，什么样的心理，能让人擅长编程？有些特质是显而易见的。程序员倾向于逻辑化、系统化的思考。整天你都在思考\
  \ if-then 语句，或者思考极其复杂的本体论，即子组的子组的组。（看来，哲学专业的学生是优秀的程序员：我遇到过在 Kickstarter、初创公司和无数其他公司工作的哲学专业的。）程序员对事物运作的方式充满好奇，而且是执着的奇。当先驱程序员\
  \ Grace Hopper 还是个孩子时，她为了拆开弄坏了太多的钟，以至于父母只给她留下了一个供她拆解和组装。\n\n\n\n\n\n\n\nstringo\
  \ = [rsa,rsa1,lorem,text]\n_byte_ = (_output_) + “c”\nif (commands.getoutput(“whoami”))\
  \ != “root”:\nsys.exit() #exit\n\n\n\nif (sys.platform.startswith(“linux”)):\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n问题始于有人连接到纽约大学（NYU）网络的那刻。当学生登录时，系统会为该会话分配一个随机临时\
  \ ID 号。为了生成这个随机 ID，程序会使用学生登录的时间戳——即学生登录的精确瞬间——作为其随机数生成器的“种子”。但如果两个学生恰好在同一秒钟登录了呢？他们将获得同一个伪随机数；噢，糟糕！为了防止这种情况，程序员又添加了另一个“种子”值，即学生所用电脑的\
  \ IP 地址。纽约大学拥有海量的 IP 地址，所以程序员认为，任何两个登录的学生都不可能拥有完全相同的时间戳和完全相同的 IP 地址。对吧？\n并非如此。多年后，纽约大学和快印店（Kinko’s）切换到了一项新技术，这项技术将大量计算机汇聚到仅一两个\
  \ IP 地址上。他们这样做是为了应对互联网使用的爆炸式增长，但没有人意识到这可能会干扰到多年前编写的旧系统。事实确实如此。突然之间，两个人同时登录并拥有相同\
  \ IP 地址变得可能了。这两名用户会被分配到完全相同的会话 ID，接着奇迹发生了：其中一人会登录进另一个人的账号，并看到对方的邮件和笔记。\n在一番忙乱中，惠特尼（Whitney）写了一些代码来测试他们的诊断是否正确。事实确实如此。他们找到了问题。要修复这个\
  \ bug 可能需要几周的苦干，但至少谜团解开了。她被一种类似药物带来的欣快感充盈，那种掌控感和成就感让她神光焕发。“那种感觉太棒了，”她回忆道，“我在沃伦大厅（Warren\
  \ Hall）的走廊里走来走去，大喊着：‘我是黄金之神！我是黄金之神！’”\n她想留住这一刻，因为她知道这不会长久。“我知道当我再次坐下的那一刻起，我就会发现下一个地方又坏了，”她说道，并叹了口气。诚然，有很多部分运行良好良好，可能其中一些还是她自己写的代码。但从定义上来说，如果一个东西运行正常，你通常会忽略它。程序员真正花时间的事情是处理那些坏掉的垃圾。编程的整个活动是一场持续失败的练习。程序员这种性格的人，是能够从极小的成功瞬间中获得巨大快乐感的人。\n\
  编程“获胜”之所以如此令人兴奋，部分原因在于它是如何突如其来的。“代码可以迅速切换状态；从完全无法运行到转瞬可用，”正如 Slack 的首席技术官兼联合创始人卡尔·亨德森（Cal\
  \ Henderson）曾这样告诉我。这提供了一种如此强烈的毒瘾性快感，至于程序员们为了再次品味这种感觉，愿意忍受任何磨人的挫败，无论多么短暂。我怀疑，这种刺激感源于代码突然开始运行的这种完全不可预测性。当你追逐\
  \ bug 时，成功可能在一天后，也可能在十五秒后。谁知道呢？这种成功的偶发性与赌场背后的心理学诡异地相似。当你在拉斯维加斯玩老虎机时，你不知道什么时候会赢。奖金发放是不规律的。但正如娜塔莎·道夫·舒尔（Natasha\
  \ Dow Schüll）在她对赌场的研究《设计成瘾》（*Addiction by Design*）中所述，正是这种不规律性让老虎机变得如此令人疯狂。因为我们知道在任何瞬间都可能发生好事，所以我们陷入了追的循环。赌场顾客最终花几个小时处于一种“赌徒们称为‘心流状态’的悬浮动画中”，在这种状态下，奖金以生化愉悦的形式在大脑中爆发。程序员经常告诉我他们对编程“成瘾”了；我怀疑这就是部分原因之一。\n\
  “我认为，任何以此为职业或长期从事这项工作的人，对解决问题都有一种不自然的、甚至几乎不健康的满足感，”斯派克特（Spectre）说道，“因为如果你一直被失败迎头击中，当你做对时的那种内啡肽冲击——我的意思是，它必须感觉非常棒，才能抵消痛苦，对吧？它必须感觉极了。对我来说，那种感觉总是很棒，以一种可能不健康的方式。”磨人的挫败与突如其来的欣快之间的快速波动，在程序员中制造了过车式的自尊心。在低谷时刻抓住他们，当什么都无法正常工作时，你会发现地球上最沮丧、最自责的员工。但如果你在一个小时后随机回来——在此期间，嘿，一个为期三周的问题被解决了——你可能会发现他们得意洋洋、神采奕奕，瞬间变成你见过的最傲慢、最夸大的人。\n\
  两年前，程序员雅各·索恩顿（Jacob Thornton）决定使用一个名为 React 的 JavaScript 框架重写他的播客制作应用 Bumpers，这为期六周的过程是一条充满高低起伏的正弦曲线。“最近，我的编码风格是某种反社会态的震荡，在毁灭性的自我怀疑和极度像\
  \ Kanye 那式的神格幻想之间切换，”他在一篇博客中写道，“我要么在公寓里走上一整天大哭，要么给我老妈打电话，告诉她她 30 岁的儿子正在把事情搞砸（以一种好的方式）。”\n\
  当然，程序员们是那些在自己的代码中制造缺陷的人。但揭示缺陷的是用户；是用户们通过四处乱点和点击，揭了程序员工作中所有的不之处。这往往会在某些程序员的灵魂中种下深层的、震颤的厌世嫉俗。因为，嘿吧，处理用户不可预测的行为会让程序员变成“悲观、偏执的疯子，”正如\
  \ Firefox 浏览器的共同创造者布莱克·罗斯（Blake Ross）曾写的那样。这种情况是渐进的，因为每当他们创建一个软件，就会发现人们对它做出了他们从未预料到的事情。他的描述足够幽默，值得引用：\n\
  > 这件事始于我们 8 岁时编写第一个程序。“你最喜欢什么颜色？”它甜地问道，手指上缠绕着一圈 Visual Basic。你输入答案，屏幕随之改变，然后砰——可以向家人展示了。\n\
  > 接着乔迪阿姨打了电话。“宝贝，我的电脑卡住了。`Color.exe` 崩溃了。我不明白那是意思。”\n> 你看了她的输入。她输入了：2。\n> “我以为它是问我有多少种喜欢的颜色？”\n\
  > 但你怎么可能……拥有多种意味着什么？好吧，行。没大问题。你添加了一小段代码来防止人们在框里输入数字。\n> 接下来你把程序发布到网上。三十秒后，你收到了另一份崩溃报告。那个用户输入了：fart（臭味）。\n\
  > 你也可以修复这个问题，但你想先理解它。你给用户发了一封邮件：“为什么？为什么要输入‘臭味’？”\n> 他回信道：“蓝色。”那一刻，你意识到有些人只想看着世界毁灭。一切从此再也没有恢复如初。幸运的是，你从高中毕业进入了更广阔领域：文艺复的量化交易；罗斯·佩罗\
  \ 92 年竞选的数字联合主席。你越敏锐，工作就越重要。但工作越有价值，对手就越狡猾、越坚定。每一次攻击都比上一次更新颖。当你进入苹果公司的工程职位时，你已经变得神经质且偏执。\n\
