  \n科恩（Cohen）确实患有阿斯伯格症。起初听到这个消息时我很惊讶。尽管他显然有些夸夸其谈，并且倾向于对任何出现的话题发表微型讲座，但我非常喜欢他，觉得他幽默风趣且经常很有魅力。他似乎很擅长捕捉周围人的的情绪信号。但他说，那是多年练习的结果，是训练自己表现得像“神经典型人士”的结果。“我学会了怎么做，”一天晚上，当我们开车去当地一家酒吧喝酒时，他这样说道。他在纽约长大，父母都是知识分子：母亲是一名小学阅读老师；父亲经营着一份社会主义报纸。（科恩回忆道，那报纸是首批完全通过数字化设计的美国出版物之一，这也是为什么他成长时家里到处都是电脑的原因之一。）在成长到成年早期期间，科恩意识到自己身上有些地方很奇怪；在与其他孩子互动时，他感到局促、无所措。甚至他的肢体动作看起来也奇怪地僵硬。那是\
  \ 20 世纪 90 年代初，阿斯伯格症还不是一种被充分理解的疾病，因此他的父母从未怀疑过这一点，也没有让他去诊断；他们觉得科恩只是……嗯，书呆。不过，当科恩二十出头时，他读了一篇关于阿斯伯格症患者行为的文章，感到一种莫名的震撼。于是，他决定像探测和调整电脑系统那样来“黑进”自己的行为。他读了关于阿斯伯格症的书，在城市里走动时，他严密观察神经典型人士是如何互动的，收集了大量本质上是测试的数据。\n\
  “我刻意研究了互动，尤其是眼神交流，”他告诉我。“我非常看重眼神交流持续。”事实上，他甚至对阿斯伯格症的治疗建议进行了“调试”；尽管所有的书都强调眼神交流的重要性，但很少提到持续时间。“所以，那些接受过这类训练的人往往会犯大错，因为眼神交流的持续其实有非常重要的细微差别，”他指出道。\n\
  对于科恩来说，很难将谱系内的行为与他对自身技能的坚如石的自信、他刻薄的幽默感以及对讽刺传统行为的享受区分离开来。“他会走过来对我说：‘我刚刚在《宝贝熊》游戏里连赢了莱莉八九次。，’”他的妻子珍娜（Jenna）在我\
  \ 2004 年拜访他时笑着说道。“我说：‘太棒了，你要勋章吗？’但布拉姆（Bram）确实教了她良好的体育精神，学会如何优雅地胜负。”\n科恩在听这个故事时笑了。他注意到莱莉几天跑完比赛后从学校回来，说老师告诉她没有失败者。“所以我告诉她，当然有赢者和输者。你只是不能说谁赢了。”\n\
  *** ... ...\n在 20 世纪 60 年代初，公司开始雇佣越来越多的程序员，因为企业购买了占房间的计算机来处理数据、运行工资单或制作业务预测。成千上万的程序员开始在各类公司工作。他们的老板们注意到：这些人身上有些地方很奇怪。\n\
  那个时期的办公职员以耸肩接受从同化而闻名——穿上灰色法兰绒西装，在等级制度中扮演自己的角色。正如威廉·H·怀特（William H. Whyte）在《组织人》（*The\
  \ Organization Man*）中所写的那样，“他们是我们中产阶级中那些在精神和身体上都离开了家，去履行组织生活誓言的人。”他们相信将自己归入更大的整体；他们尽职地执行命令；从本质上说，他们集体主义者。而那些向往程序员工作的人并不是。他们更古怪、更特立独行、更令人反感。\n\
  “归根底，”心理学家达利斯·佩里（Dallis Perry）和威廉·坎农（William Cannon）在 1966 年的一篇论文中指出，“大多数人知道成为会计师、医生或工程师意味着什么；但当涉及到计算机编程时，大多数人要么从未听过它，要么对这个相对新颖的职业的内涵只有最模糊的印象。”为了更多地了解这个“新部落”，坎农和佩里找了\
  \ 1,378 名男性程序员，并对他们进行了一项职业评估，旨在探寻他们的兴趣和激情。\n当他们分析结果时，有三点脱颖而出。第一是程序员是热衷的问题解决者，“痴迷于寻找问题的答案并解决各种谜题，包括各种形式的数学和机械活动。”这对于当时的经理们来说可能并不十分意外。事实上，由于还没有许多大学正式教授编码，他们使用逻辑和模式识别测试来判断任何新手是否应该成为程序员。正如内森·恩斯梅格（Nathan\
  \ Ensmenger）在《计算机少年统治》（*The Computer Boys Take Over*）中指出的，他们已经在筛选谜题爱好者，并开始倾向于雇佣男性而非女性。那时\
  \ IBM 的一则广告——标题为“你就是那个能指挥电子巨头的人吗？”——问道：“你是否有一个秩序良好的头脑，喜欢诸如象棋、桥牌或字谜之类的游戏……？”\n然而，第二个发现是，程序员喜欢学习新事物——并且厌恶重复性工作。“心理学家写道，“他们表现出对研究活动的兴趣，并倾向于多样化甚至具有风险的活动，同时规避常规化和教条化。”\n\
  第三个发现最直接反映了美国经理们的不安，即这些程序员是冷漠的孤立者，是不成群的组织人。“他们不喜欢人，”佩里和坎农直率地总结道。“他们讨厌涉及亲密个人互动的活动；他们对事物的兴趣大于对人。”这对女性程序员和男性都是如此。当佩里和坎农对\
  \ 293 名从事编码工作的女性进行重复评估时，他们发现程序员与非程序员女性在两个主要方面有所不同：这些女性对各种形式的数学有浓厚兴趣，但缺乏人的兴趣。”\n\
  到 20 世纪 60 年代后期，程序员是一群刺头子的想法在管理层已根深蒂固。行业分析师理查·布兰姆（Richard Brandon）认为，美国公司积极招揽和雇佣这种难以管理的人是有风险的。许多程序员很年轻，源自\
  \ 60 年代早已存在的反权威反文化。当你把这些孩子交给管理人员无法理解的重要机器时，这就是产生傲慢的药方——或者正如布兰姆指出的，他们是“过度独立的”员工。布兰姆继续说道，典型的程序员“往往自我中心、轻微神经质，并处于分裂症的边缘。胡须、拖鞋以及其他个人主义或不服从的症状在这一群体中显著增加。”\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n1985 年，让·霍兰斯（Jean\
  \ Hollands）出版了《硅综合症》（*The Silicon Syndrome*），这是一本关于计算机工程师与爱他们的非工程师之间关系的指南。霍兰斯是一位曾转型为企业教练的心理学家。这本书基于对硅谷地区数十对已夫妇（考虑到那个时代，主要是男性工程师与女性配对）的采访。霍兰斯写道：“我能看出‘硅综合症’，每当妻子说：‘但他总是坐在电脑前。’或者，‘他对印刷电路板的兴趣比对我大得多。’”她的核心观点是，工程师/非工程师之间的关系源于一种高科技版的“火星/金星”脱节——由于思维和感受方式的差异导致了严重的沟通缺失。他说中文；她说法语。他们不知道如何互相翻译。他们甚至不知道如何向伴侣推销自己或自己的想法。”书中还有一个标题为“铁皮人有一颗心”的章节。\n\
  这一切在我看来太轻率、太有刻板印象了。毕竟，我认识许多过得美满婚姻或其他在一起的程序员。但当我开始采访他们更多的伴侣时，许多人也表示认同：虽然情况并不完全到了“铁皮人”的地，但与程序员约会意味着要适应\
  \ 24/7 的工程师思维。\n詹妮弗·8·李（Jennifer 8. Lee）是一位 42 岁的投资者，`Unicode Emoji Subcommittee\
  \ San Francisco`的副主席，她估计她约过的人中约有一半是程序员。她被他们吸引；她认为这归于她的家庭背景。在晚餐时，她告诉我：“我爸是一个社交笨拙、内向的工程师。所以，我是完全的埃克特拉综合症（Electra\
  \ complex）。我喜欢社交笨拙、量化型的工程师，随你去说吧！”\n李自己也学了一点编程，但无兴趣以此为；她喜欢与他人合作，无法想象独自对着屏幕坐好几个小时。她曾是《纽约时报》的科技记者；我长期以来一直是她关于硅谷敏锐观察文章仰慕者。\n\
  “我喜欢这些男人的地方在于，”她解释道，“他们非常可靠。”这就是构建规则系统的人的优点。“他们会是好丈夫、好父亲，我愿意牺牲一些温暖感性的东西。”他们擅长管理生活中任何需要组织、系统化的事务。她会和程序员一起旅行；他会像俄罗斯积木一样把物品装进\
  \ SUV 的后备箱，对每一寸空间进行超优化。（更棒的是，他们最需要的物品会被仔细地放在顶层方便取用，这就像你为了更快速访问而对经常访问的数据进行“缓存”。“他们从中获得巨大的快乐。”）\n\
  他们并不是无情；恰恰相反。当她与克雷格·西尔斯坦（Craig Silverstein）约会时（他是 Google 的第三位工程师），比她更擅长同情地倾听女朋友们长达数小时的浪漫苦恼。事实上，当西尔斯坦意识到自己最想要的是幸福的家庭，且不确定李是否是那个对的人时，他和她分手了。尽管当她问他为什么要结束关系时，他列了一堆理由——这些理由还排了序，”她笑着说。第四点：她“在我的设备上花费了太多时间。”（她承认这是事实。）\n\
  当我与李交谈时，她刚和她的上一任程序员男友分手。他有着梦幻般的吸引力，留着深色的长发和眼睛，“但非常自闭症（Aspy）。那是个糟糕的组合！他非常像瓦肯人（Vulcan）。并且以此为自豪。我觉得如果有人叫他们瓦肯人有些人会感到困扰，但他实际上对自己是瓦肯人感到自豪，他其实挺享受自己很像斯波克（Spock）。”他们在不到一年后分手了，当时她已\
  \ 30 多岁，想要组建家庭，并想知道他——比她小八岁——是否准备好了。他不确定。她理解；对于一个 20 多岁出头的男生来说，要弄清楚是否遇到了“真命”极其困难，因为你只经历过几次长期关系。没有太多可以比较的。\n\
  这是一个常见的问题，她的男友意识到这是游戏论中一个经典困境的变，“秘书问题”（The Secretary Problem）。在秘书问题中，你被告知必须招聘一名秘书，并开始面试候选人。一旦你决定了喜欢的那个，你就聘用那个人；但你会停止面试，所以你永远不知道*下一个*可能面试的人是否会更好。秘书问题有一个著名的解决方案，但它只有在\
  \ 37%的情况下能获得“最佳”雇佣，对于招聘一名助理来说，这或许是一个可以接受的风险，但对于一个倾向于对终身伴侣有更高确定性的数学思维程序员来说，这令人困扰。另一方面，*不*选择秘书——或伴侣——的缺点是犯了相反的错误，并且犹豫足够久导致得到次优选择；或者可能永远无法遇到任何新的合适伴侣。这就是为什么大多数人在面临感情决定时，会凭直觉行事；比起依赖原始逻辑，这是一种有用且较不那么痛苦的解决问题的方法。从工程角度来看，情感选择极难优化。在计算完数据后，她的男友决定和她分手。\n\
  “我没有足够的数据，”他说。\n程序员自己也经常承认他们的思维模式会给关系带来问题。许多人羞愧地告诉我，由于他们用一种条理逻辑的方法处理模糊的情感问题，引发了争吵。斯科特·汉斯曼（Scott\
  \ Hanselman）是`Microsoft`的一位程序员，也是著名的博客作者和播客。\n\nMo 叹了口气。“你说话的时候，”她对 Scott 说，“是从一种‘*嘿，我是在给你诚恳的反馈！*’的角度出发的。但实际效果却像是：‘哇，好吧，这有个刚从美国远飞过来的粗鲁家伙。’”她意识到，这是由于\
  \ Scott 一整天都处处在一个极度推崇直率的环境中产生的副作用。“你每天和工程师在一起工作 8、9 小时，有时甚至是 10 小时、12 小时，他们是那种想法和你完全一样的人，”她对他说，“当你从那种环境切换出来时，几乎需要稍微减压一下才能适应社会的其他部分。”\n\
  他承认这是事实。他在家庭办公室工作，周围环绕着宽屏显示器（当我和他 Skype 视频通话时，是一堆杂乱的硬件项目）。当他完成工作后，会立即开始评价 Mo 正在做的任何事情。“我们要吃这个吗？”如果她正在做晚餐，他会问，“你就这么做那个菜的？油够吗？”就好像他还在和那些书呆同事斗斗一样。“这就像是，我立刻进入了对米饭和肉的`code\
  \ review`模式，”他承认道。\nMo 注意到编码伴随着一种心理上的转换时间。这项工作在精神上极其吸引人，且需要极其精确，以至于很难离开。代码仍然在脑海中挥之不去。\n\
  他赞同。这就像从水下深潜后浮上来：你必须缓慢地这样做。“这是一种工程师技术师版本的‘减压病’。”\n***\n这种与深海潜水的类比很有启发性，因为很多程序员都告诉过我同样。“大多数时候，我们并不刻薄、古怪或过度逻辑化，”他们说。这只是因为在实际的编码**行为*中，他们会变成可怕的机器人。\n\
  这是因为该学科对精神的要求极为苛刻。调试一段代码不仅仅是盯着那几行代码并试图弄清楚它们为什么错。不，它通常需要考虑整个系统这个巨大的“毛球”：那几行代码是如何与几十或数百个其他代码模块相互作用的——每个模块都在来回传递数据片段。你从一个函数开始；看它与其他代码片段通信；弄清楚*那些*函数又与哪些代码片段通信。慢慢地，慢慢地，你开始可以在脑海中建立起许多嵌套相互关系的心理图谱。经过长时间的努力，你终于将系统的拜占庭逻辑加载到你的脑海中；你可以看到那些鲁布·黄金德式的机制是如何运作的，看到*这个*球如何撞倒*那个*多骨牌，导致*这个*开关拨动，从而打开了*那*盏灯。或者用一个稍微不同的比喻，你在空中飞得足够高，完全可以在夜晚看到整个城市在你的面前展开。你可以看到`Matrix`（矩阵）。正是在这这一点上，程序员才能真正完成严肃的工作，因为他们理解了改变机制中任何微小部分的影响。编码员通常告诉我，他们需要几分钟才能进入那种状态，但对于真正棘手的编码问题，可能需要几个小时。\n\
  然而，一旦你进入了那里，那是奇妙的。当程序在你的“湿硬件”（wetware）中展开时进行编码是极其愉悦的。这是心理学家米哈伊·契克斯米哈赖（Mihály Csíkszentmihályi）认出的一种经典“流”状态——人们“完全为了活动本身而投入其中。自我消失了。时间飞逝。每一个动作、移动和想法都不可避免地紧随上一个，就像弹爵士乐一样。你的整个灵魂都参与其中，你正竭尽全力运用技能。”\n\
  但这也是一种极其脆弱的状态。哪怕微小的干扰都会让那种精心组装的理解烟消云散。因此，唯一能让编码员陷入盲目愤怒的事，就是当他们处于心流状态时有人 ping 它们。他们正拼命想在脑海中维持一个空灵的晶体结构，而现在有人在问他们：*嘿，你收到我发你的那封邮件了吗？*，然后砰的一声，全没了。\n\
  “我妻子和孩子已经学会了当我在房间里编码时，你真的不能打扰我，否则你会得到一个完全不同的父亲和丈夫，”一位来自社交网络的开发者告诉我。他会变得更冷酷、更尖锐，并且通常因为出神状态被打破而深感苦恼。许多居家办公的程序员都描述了同样的问题。“我经常变得非常非黑即白，非常逻辑化，”另一位从事机器视觉的人说。在工作中打断他，他会试图将互动压缩为一个二值变量：*你能问我一个是或否的问题吗？*\
  \ 在其他时候，他认为自己是个完美友善的人。但编码的行为改变了他。打扰他，后果后果自负。\n因此，当他们工作时，程序员倾向于尽一切办法隔绝其他人，因为其他人本质上除了干扰之外，一无是处。他们戴上降噪耳机；有些人把辛苦的工作留到深夜，那时电话、信息甚至政治新闻滚动条都安静了。\n\
  当然，这种留在“心流区”的绝望感并非编程所独有。任何需要深浸于一种全方位精神状态的学科都会产生同样的隐士行为，并在面对最微小的社交需求时产生无理的烦躁：写诉状状的律师；计划手术的外科医生；各种类型的艺术家。小说家需要在脑海中构建一个世界并将其保持在那里，因此他们在历史上也以疯狂先知般的强度追求孤立。为了避免互联网，乔纳·弗兰森从他的电脑上拆除了`wi-fi\
  \ card`，并胶水密封了`Ethernet port`。史蒂芬·柯尔泽拉上窗户的帘，以免外界世界的一瞥打破他的注意力。\n\n的确，许多程序员甚至倾向于使用那些能够在微小物理动作层面上保持“心流”的工具。例如，许多编码员讨厌使用鼠标，因为这需要他们将手离开键盘。这种额外的动作令人生厌；这就像是要求一位音乐会钢琴家偶尔伸手扭动她钢琴盖上的旋钮一样。因此，一类特定的程序员倾向于使用\
  \ `Vim`，这是一种文本编辑器，几乎所有的操作——剪切、粘贴、翻页——都可以在手指留在主字母键的情况下完成。你甚至不需要移动到“方向”键来在文档中移动；`Vim`\
  \ 认为那种动作太浪费了，而且可能因为强制你低头看键盘而把你带出专注状态。Saron Yitbarek 是我的一个程序员朋友，她在第一次编程学徒期间被要求学习\
  \ `Vim`。老练的程序员们都用 `Vim`；“真正的程序员用 `Vim`，”他们或是这样告诉她的。于是她强迫自己。起初，这很笨拙不自然；她一直想用习惯的鼠标或方向键移动来导航。但在经过三周苦心的习惯重塑后，她进入了状态——突然间，她感到与机器达到了一种机械人般的合一，一种联想起*《黑客帝国*中“我有功夫”的时刻。“你和键盘合为一了，”她惊叹道，“没有哪一个时刻需要中断我的思路。”\n\
  ### 制作者与管理者的日程\n程序员是白领工作者，但对深度沉浸和集中的需求让他们与大多数白领的节奏格格不入。保罗·格拉姆（Paul Graham）将其称为为“制作者日程”（maker’s\
  \ schedule）与“管理者日程”（manager’s schedule）之间的碰撞。他指出，管理者的工作几乎完全由会议组成。管理者的工作是确保事情顺利进行，因此他们以一小时为单位划分一天，每小时与不同的员工见面。所以，他们并不认为让一个程序员在下午\
  \ 1:00 参加一个汇报会议没什么大。但对于程序员来说，这次会议会摧毁进入长时间心流状态的所有机会。\n“我发现一次会议有时会影响整整天，”格拉姆写道，“一次会议通常通过打断上午或下午而浪费至少半天。但此外，有时还会产生连锁效应。如果我知道下午会被打断，我在早上就不太可能开始一项心勃勃的任务。我知道这听起来可能过度敏感，但如果你是一个制作者，想想一下你自己的情况。一想到有一整天空闲工作，没有任何预约，你的精神不会振奋吗？那么，当你没有这种时候，你的精神就会相应地低落。而心勃勃的项目定义就接近你的能力极限。士气的轻微下降足以杀死它们。”召开一个突然的、无计划的会议更糟：如果你在一个程序员认为应该是长时间专注时间的中中断了他们，你基本上保证了自己将面对一个极其愤怒且思维机械化的人。\n\
  没有谁比你刚刚打断的那个人更像一个典型的“程序员”了。\n### 程序员比其他人更容易抑郁吗？\n在我写这本书书时，很多人问过我这个问题。事实上，很多程序员自己也问过我。他们知道很多人患有抑郁症或与焦虑、狂躁症斗争。许多人都有程序员朋友的故事，他们被心理健康问题悲剧性地困扰导致自杀。（有些人强烈认同剧集《黑客》中的主角黑客角色埃利奥特，他饱受抑郁症和深度的社交焦虑之苦，并用吗啡进行自我治疗。）他们想，编码是否在某种程度上与心理健康问题有关？也许编程更可能吸引那些与“正午魔鬼”斗争的人——就像在神话和历史中，写作、诗歌和其他艺术创作那样。或者，编码这种行为本身——那些孤立的时间和压力——加剧了那些本就处于边缘的人的问题。\n\
  这些是 Greg Baugues 经常思考的问题。\n他是业内非常有名的程序员，以公开讨论自己与心理健康问题的斗争而闻名。Baugues 是一位美国中西部牧师的儿子，他在青少年时期就自学了编程，然后去攻读了计算机科学学位。但是在大学期间，他开始发现自己在情感上无法应对。从技术上说，这些工作对他来说应该是容易的；因为他已经是一个很出色的自学者了。但他会拖延几周，把作业拖到非常晚，以至于在无力感中崩溃。当一个朋友来找他时，他躲在床上皱巴巴的毯子下面。事实上，他在床上花了大量时间，每天睡长达\
  \ 16 小时。\n“我一天中最好的时光是我处于无意识状态，当我不需要面对现实时，”Baugues 在我们咖啡馆吃午饭时告诉我，当时我们发现住在同一个社区；他是一个高个子、说话轻柔的人，留着浅橙色的胡子。“我只是试图尽可能地留在那种状态里。”*Greg\
  \ 我认识的最聪明的孩子之一*，他的朋友说，*但他也是最懒的。*\n但有时，他恰恰是懒的反面：他处于创作能量的狂躁中。软件产品的想法会像尼加拉瀑布一样在他身上涌而出，他会连续几天不睡觉，疯狂地编码，想着一旦他发布了这些酷炫的新应用，该如何处理这些突如其来的财富。但他从未真正发布过，因为一天两天后他的能量就会崩溃，然后他又会退回床上。在大学读了多年后，他最终辍学并开始跳槽编程。他表现良好几个月，然后又开始拖延；他因为不交租金和水电费而激怒室友，直到停电。\n\
  最后在 25 岁左右，他决定自己的心理健康问题比他愿意承认的严重。在搜索“慢性拖延”时，他读到了 `ADHD` 的症状，那些症状听起来确实非常熟悉。他去做了测试。“你绝对是\
  \ `ADHD`，”治疗师告诉他，“程度已经爆表了。”她还诊断他患有二型双躁症。\n他开始服用 `ADHD` 药物。在吃下第一剂药后短短十五分钟，他就对感觉如此好感到震惊。“天呐，”他想，*难道这就是正常人的感觉吗？*他最初抵制双躁症的治疗，因为他不想承认自己可能有这个问题。但一旦他开始治疗，他的生活变得容易管理许多。他仍然与抑郁症作斗争，但生活的琐事不再像以前那样轻易让他失控。他被\
  \ `Twilio` 雇用，这是一家让程序员更容易为应用程序添加电话和短信服务的公司；他的工作是一名“布道者”，即去会议和黑客松教授如何使用 `Twilio`\
  \ 的产品。他也开始在会议上讲述他在科技领域与心理疾病斗争的经历。\n\n他认为，这个行业奖励了许多随心理健康问题而来的适应不良行为。“社交孤立、不规律的睡眠模式？自大的想法——认为你可以改变世界，或者认为规则不适用于你？”Baugues\
  \ 说，“如果你是一个正在经历这些症状的青少年或年轻人，并且偶然发现了编程，那种感觉对你来说可能很就像回到家一样。我的意思是，我们作为开发者，以他人不同的方式接受了社交孤立和社交笨拙。我们会迁就你不规律的睡眠模式。程序员随想来就来，工作到凌晨两点，只要能完成工作，工作多久，这并不罕见。”事实上，这种行为现在在流行文化和商业文化中被彻底浪漫化了。电视和电影里的程序员是夜猫生物，在孤独中被显示器的光芒照亮；初创公司的商业故事则崇拜那些长达\
  \ 72 小时键盘狂欢的程序员。这个行业不仅筛选出这类人，还在积极地将其美化。在这样一个领域，谁会承认自己有问题呢？\n“开发者之间建立了一种身份认同，即围绕‘房间里最聪明的人’以及‘高智力表现者’展开，”Baugues\
  \ 指出的，“说‘我有心理疾病’，按定义就是在说‘我的大脑运作不正常’。那又怎样呢——难道你要去雇主那里告诉他们，‘嘿，你们付钱让我做的这事没没正常运行？’”药物可能会迟钝程序员赖以的那种尖锐精神活动，这并没有什么帮助，所以有些程序员根本不想吃。他们担心这会关闭他们的创造力、那些灵光一现的洞察时刻以及几个小时的超度专注。Baugues\
  \ 认为这可能对他自己也是如此，他的药物削弱了他的某些高光时刻。但他认为，这种权衡是完全值得的。“即使药物降低了我大脑产生新想法的速度，”他说，“它也以数量级增长提升了我执行想法的能力。因为现在，我可以**按时交付（ship）**了。”\n\
  Baugues 知道自己很幸运。他有一位支持他的雇主。但该行业的其他大部分人基本上都乐于消耗那些聪明的年轻人，在极其不健康的工作流中将他们磨碎。工作中每周工作\
  \ 60 小时的“死亡行军”，持续好几周？待在室内？远离爱人的、近乎教派式的孤立？如果你有心理疾病病史，任何医生都会告诉你远离这些环境；它们都是众所周知的诱因。坦率地说，即使你没有受到生物化学问题的困扰，那种工作风格也能把健康的人折磨成粉末。\n\
  我们离开咖啡馆，漫步到了 Baugues 的家。那是一个明媚的春日——阳光！看，这正是我应该多接触的，”他开着玩笑说。在他的公寓里，他的狗爬上他的腿，Baugues\
  \ 向我展示了他最近完成的一个用来展示 Twilio 功能的趣味小项目。那是一个大红按钮，当他的狗推它时，会触发相机拍照并发送短信给 Baugues。“一只狗的自拍！”他笑了起来。这在最近的一次会议上大获成功，当时他在台上展示了它。在晚后的后台，他与那些私下找他交谈的程序员进行了单独交流，谈论他们自己的心理风暴。\n\
  Baugues 由一位卫公会牧师养大，他自己仍然保持着敏锐的观察力；他的家里散落着他各种兴趣的见证，包括其中一个书架上，C. S. 刘易斯的《纳尼亚传奇》系列放在了一个树莓派微型电脑旁边。“宗教传教者工作得当时，重点是服务社区，”他说。他发现了一种双重天职。\n\
  # 第 5 章\n## 效率的崇拜\n直到来到日本，Shelley 才意识到她的新男朋友可能有多疯狂。\n她通过一些共同工作的朋友认识了 Jason Ho，并和这个瘦长高大、带着狡黠微笑的男孩一拍即合。他是旧金山的一名计算机程序员，经营着自己的公司，并决定在日本休为四周的假。她想一起来吗？Shelley\
  \ 是一个戴着厚黑框眼镜、带着苦笑笑声的娇小女性，她有些顾虑。在一起度那么久可能会点燃一段美好的关系——但熟悉也可能产生轻蔑。“我担心我们要在同一个房间里怎么睡觉，”她回忆道。但她决定赌一把，他们买了票。\n\
  事实证明，Ho 为这趟旅行规划了非常严格且奇特的行程。他特别喜欢拉面类食物，他告诉她，他这次旅行的目标是访问尽可能多的东京拉面店。为了确保他们尽可能挤进行程，他编写了一些自定义代码。*哈？*她想。他解释道：首先，他汇总了一份东京顶级面馆清单，并将它们标注在\
  \ Google 地图上。然后他写了代码画出连接所有商店的最优路径，这样他们就能在商店之间以最高效率旅行。他说，这是一个“相当传统”的算法挑战，是大学里会学的那种，他经常使用这种技巧来优化他的生活方式。他掏出手机给她看地图。他告诉她，他还打算对每顿饭的质量做好详细的记录。\n\
  *噢哇*，她心想，大为震惊。*这家伙有点疯。*\n* * *\n\n... ...\n\n事实证明，她了解到 Ho 喜欢让很多事情自动化。作为一个在佐治亚州梅肯长大的孩子，他就学会了在德州仪器的\
  \ TI-89 计算器上进行编程。有一天，在翻阅说明书时，他发现计算器包含一种 BASIC 编程语言；更棒的是，你可以逐像素地绘制图像，并制作视频游戏分享到同学的\
  \ TI 计算器上。这是他的“Hello, World！”时刻，他感到异常振奋。他花了几个月时间耐心重现了经典的任天堂 Game Boy 游戏《塞尔达传说》。这需要一些巧妙的黑客技巧：TI\
  \ 只能显示深黑色像素，但《塞尔达》的画面是灰色的。所以 Ho 发现，如果他让像素快速开启和关闭（每秒好几次），黑色和白色就会融合成灰色。很快，他开始教别人 Java\
  \ 制作电脑游戏，并在学校成立了一个 Java 游戏制作俱乐部。大学期间，他就读佐治亚理工学院，在那里学习计算机科学。他认为课程太枯燥；他喜欢研究抽象的算法概念，但最让他着迷的是用计算机消除重复性劳动。\n\
  \n\n\n\n“每当我不得不反复重复某件事时，”他告诉我，“我就会感到无聊。”在大学的最后一年，他决定整个大学教育系统的结构奇异地低效：孩子们在不同的机构上着基本上相同的课程，通常用着同样的教材，在作业中遇到相同的问题。但这些远在天边的学生之间没有任何简便的方法进行交流。他创建了\
  \ `Qaboom.com`，这是一个问答网站，试图通过共同科目将全美的学生聚集在一起。尽管硅谷的几位投资者喜欢它，但它从未火起来，因为 Ho 无法破解文化层面的难题：如何让学生发布高质量的问题和答复。作为一名编码员，他关注的是将网站设计得如此优雅且健壮，以便于扩展。但他意识到，既然没有人发布任何内容，一百人永远不会出现。内容至关重要，而他并真的不知道如何让这个雪球滚起来。他关掉了网站，在学位课程即将结束之际，在\
  \ `Google` 等几家公司了面试。但他陷入了情绪低谷。他不想为别人工作。从价值创造的角度来看，他觉得当员工是一个糟糕的提议。当然，你可以赚到一张支票。但你劳动力的大部分价值被创始人获取了。他拥有构建任何事物的技能，从头到尾——这些“魔法力量”。他只需要找到某种需要这种礼物的事物。\n\
  \n几周后，他偶然发现了一个。他回到马肯（Macon）探望家人，他的父亲在那里经营着一家儿科诊所。在那里，Ho 陪父亲去 `Staples` 办差，为办公室买两台打卡机，就是那种员工打卡，机器就会盖上他们开始和停止工作时间的类型。每台机器花费\
  \ `$300`。Ho 惊呆了：打卡技术自《宠物石石》时代以来就没有改变过吗？*人们真的把这些纸片放进这种机器里并手动加总吗？*他想道。*我无法相信这东西居然存在*。他意识到自己可以快速凑出一个网站来执行相同的任务，而且做得更好：员工可以通过手机签到，网站会自动计算出总小时数。“别买这种打卡机，”他告诉父亲，“我给你代码写一个。”\n\
  \n三天后，他就创建了。他父亲的办公室开始使用它，令 Ho 高兴的是，他们非常喜欢。事实上，它比纸质打卡机效率高得多，为他父亲节省了手动计算数字的几个小时，并消除了以前可能导致员工损失工资的错误。他意识到，这是一个产品：与\
  \ `Qaboom` 不同，它解决了人们实际上面临的问题。他润饰了网站，给它起了一个名字——`Clockspot`——四个月后，令人惊讶，一个付费客户（当地一家律所）签约了。当他们的第一笔付款到账时，他正在\
  \ `Georgia Tech` 图书馆和朋友一起写代码，几乎从座位上跳了起来：*天呐，有人付了我 $18.95 来使用这个软件了*，他告诉他的朋友。几个月后，Ho\
  \ 的月营业额达到了 `$10,000`，客户涵盖从清洁公司到家庭医疗辅助公司以及伯明翰市。在经历了两年不间断的工作后，他调试了代码，使其运行得如此顺畅，以至于他的公司大部分处于自动驾驶状态；他只有一名全职员工（他自己）和一个他雇佣在佛罗里达州家里工作的兼职客服，就能赚到丰厚的收入。\n\
  \n当我在旧金山和 Ho 以及 Shelley 吃晚餐时——还能在哪儿呢——一家拉面馆，Ho 每周只工作几个小时。他花大量时间旅行；有一次他在珠穆玛峰大本营甚至成功处理了一次危险的\
  \ `Clockspot` 故障。“他说他每月工作二十小时，但我认为我见过他工作过那么多，”她说。\n\n在他们在一起的两年里，她还发现 Ho 那种对优化一切的痴迷习惯可能会渗透到生活的几乎每一个部分。当他决定买房时，他不想坐那里一家家地看房子并思考要不要买。于是他写了一段小软件，他可以在其中输入几十栋旧金山房屋的信息——比如它们的位置、价格和社区统计数据——程序就会计算出可能的长期价值。（该程序推荐了一个首选；他照做了并下了它，并且目前正住在里面。）因为他讨厌购物，他买了几十条同样的相同的\
  \ T 恤和卡其裤——正如他所指出的，这也消除了早晨穿衣服时的任何决策时间。几年前，厌倦了身材走样，他决定开始健身，因为这看起来像是一个特别疯狂的优化挑战。他开始在餐厅里拿出食物秤来称他的分量，并设计方法将运动融入他一天中的几乎任何部分。如果他经过一个粗金属人行道杆，他就会用它做引体向上；如果他经过一个垃圾桶，他就会把它的一边抬起来。\n\
  \n“他在那张巨大的电子表格里记录了他吃过的每一样东西，”Shelley 告诉我。Ho 羞涩地在手机上展示给我看；那是一头庞然巨兽，细致地描绘了他健身餐中的每种成分，这些食物每天带来\
  \ `3,500` 卡路里。（显然，两盎司的“蜡玉米” = `210` 卡路里。）但它确实有效：经过两年的训练，他在当地的加利福尼亚州业余健美比赛中获得第二名，在台上螃蟹式展示他的肩膀肌肉。他翻看手机找到了那段时期的照片。“我的体脂率降到了\
  \ `7` 百，”他说，你一眼就能看出：抹着油在阳光的窗户前穿着内衣拍照，他看起来像尊希腊雕塑。他耸了耸肩。他说，看起来那么结实感觉很好，但他他把身体练到那个程度主要是为了看看这种疯狂的扭力是否可能。\n\
  \n\n\n\n在某种程度上，这种对效率的渴望并非软件人员所独特。各行工程师和发明者长期以来一直痴迷此。霍（Ho）的图表似乎有些疯狂，但它让我想起了美国黑客兼工程师本杰明·富兰克林（Benjamin\
  \ Franklin）。富兰克林也是工程天才，痴迷于优化日常行为。他的视力远近都不好，因此他随身带着双眼镜——一副用于远视，一副用于阅读——最终他厌倦了来回切换。于是，他切下远视镜的一个半圆，将其粘在读视镜的一个半圆上，发明了双焦点眼镜。为了让殖民时期的房屋更温暖，他发明了一种炉子，能在金属外壳更有效地储存热量，正如他自夸的那样，“为居民节省了大量的木材”。\n\
  \n然而，富兰克林不仅对优化物理世界感兴趣。他还认为自己的道德品质也应该被追踪和调整以实现最大改进。因此，他写下了种“美德”，包括“勤奋：不要浪费时间；始终忙于有用的事情；切断所有不必要的动作”以及“节俭：除了为他人或自己做好事外，不要花钱；即，不浪费”。然后他将它们打印在一张表上，美德为行，星期几为列，这样他就能每天追踪自己实践良好行为的频率，并用一种令人满意的清教徒式笔标记。正如《搅局者》（The\
  \ Baffler）曾在描述当今的“富兰克林计划系统”时所说，它是“典型的美国式——既健康又疯狂”。但这也是一种典型的工程师对待世界的方式。这种组合，这种对效率和秩序闪烁着光的狂热（既令人钦佩又完全不可理），正是工程思维的特征。\n\
  \n### 效率的工业时代\n\n上世纪初，在工业主义的萌芽时期，工程师们将日常任务的自动化视为一种道德善。引用 1904 年工程师查尔斯·赫马尼（Charles\
  \ Hermany）的话，发明家是人类“从绝望的苦役和重劳动中救赎出来的”。几乎任何机械师都会对系统中的任何浪费和摩擦感到反感。我曾有一位修理摩托车的机械工程师邻居；如果他听到发动机发出极细微的意料之外的噪音，他就会将其拆解以寻找并消除根源。（“噪音，”他严肃地说道，“是浪费的能量。”）弗德里克·温斯洛·泰勒（Frederick\
  \ Winslow Taylor）——“泰勒制”的发明者——反对“人类笨拙、低效或方向错误的动作”，认为工人的动作应该经过仔细规定以确保最大产量。他的同事弗兰克·吉尔布斯（Frank\
  \ Gilbreth）痴迷于从砌墙到扣衬衫按钮等一切领域的浪费动作，而他的工程师妻子设计的厨房，正如《美好家庭手册》（Better Homes Manual）赞叹的那样，制作草莓奶油蛋糕的步骤从“281\
  \ 步减少到了 45 步”。\n\n### 计算机革命\n\n但在许多方面，计算机激发了比以往任何工具都更伟大的效率之梦。\n\n这是因为它们非常擅长自动化重复任务。写一次脚本，让它运行，计算机就会不知疲倦地执行，直到它崩溃或电源耗尽。此外，计算机在人类虚弱的精确方面非常强大。给我们一个重复性任务，我们的大脑往往会游离，因此我们执行得变得越来越不规律。要求我们在精确的时间或间隔做某事，我们就会走神并忘记去做。记住未来要做某事的能力被认知心理学家称为“前瞻记忆”（prospective\
  \ memory），而人类对此非常糟糕，这正是为什么我们几个世纪以来一直依赖列表和日历来提醒自己做事。相比之下，计算机是由时钟驱动的，极其擅长日复一日地同时做同一件事。回到世纪\
  \ 70 年代，当他共同创建 UNIX 操作系统时，传奇程序员肯·汤普森（Ken Thompson）创建了`cron`，这是一个调度命令：你可以告诉计算机在未来的特定时间反复运行某个程序或完成某个任务。据报道，汤普森将其称为`cron`是为了纪念希腊语中表示“时间”的词。设置一个重复任务被称为`cron\
  \ job`，程序员经常在机器上运行几十个这样的任务，这些微小的守护进程（daemons）每天执行任务，这样程序员就不必考虑它们。计算机是时间的有用奴。\n\n\
  结果是，大多数程序员得出相同的逻辑，我们可以总结如下：\n(a) 每天重复或或同时做某件事是无聊的，而且我不擅长此。相比之下，(b) 奴性且细致地反复执行同一任务对于坐在我桌子上那台永生不死的机器来说很容易。因此，(c)\
  \ 我将自动化我所可能的每一件事。\n\n***\n\n### 程序员的视角\n\n许多程序员在青少年时期会有这种“恍然开朗”的时刻，他们第一次发现生活充满了枯燥得刺眼的重复任务。即使在休闲活动中也是如此！Kickstarter\
  \ 第一版版本的两个开发者之一的兰斯·艾维（Lance Ivy）在青少年时期玩在线冒险游戏时产生了对效率的顿悟。为了让你的角色更强大，“你必须重复这些平庸的任务”：你可以反复弹乐器，或者让你的角色读书。*这只是在刷级（grinding），*他心里想，*为什么我每次都要输入这些命令？*于是他写了一个脚本，让他在屏幕上的角色通过寻找药草并将它们藏在洞穴中反复练习其“躲避”技能，永无止境。（这效果有点太好了。“我一天晚上让它一直运行，”他告诉我，“第二天我回来时，发现我的角色基本上被关进了一个铺垫的房间。在我离开键盘后，他们试图跟我说话，但显然我不在那里，”所以他们认为我疯了。）\n\
  \n学校是另一个重复的沼泽。例如，许多孩子发现老师强迫他们在做长除法时“写出计算过程”很烦人。所以，当博客网站 LiveJournal 的发明者布拉·菲兹帕特（Brad\
  \ Fitzpatrick）读高中时，他直接写了一个程序来自动解决它们：输入一个问题，它就会计算出答案，并显示每一步。“我们每页会有大概十道题之类的，我会把它们输入电脑，然后用涂鸦的字体重现这些题目，”他后来说道。“我在化学课上也做了同样的事来寻找电子轨道。”这算作作弊吗？某种程度上是。但被要求写一个可以将长除法分解为小步骤的程序，Fitzpatrick\
  \ 必须深度思考并理解这个过程。他并不反对理解长除法的任务；他只是想摆脱反复执行的苦差事。更模糊的是当你自动化其他学生的脑力劳动时。我的一个程序员朋友弗德·贝尼森（Fred\
  \ Benenson）在大学时写过类似的程序，在德州计算器上进行积分计算，一旦他的伙伴们发现了，他们就向他要拷贝，于是他就分享了。“但后来他们只是用程序来从根本上避免学习，”，”。所以弗德很早接触了软件的伦理复杂性：通过让某事变得容易，你可以改变他人的思维习惯。人类天生相当懒惰；正如尼古拉斯·卡尔（Nicholas\
  \ Carr）在《玻璃笼》（The Glass Cage）中所说的，当有人为我们提供捷径时，我们会接受。我们只有在以后才发现，我们可能牺牲了一项根植的技能——或者在积分的情况下，我们根本没有学过。\n\
  \n\n\n\n\nLarry Wall 是创建 `Perl` 编程语言的著名程序员和语言学家，他深深刻地直觉到了这种程序员对重复的厌恶。在他部关于 `Perl`\
  \ 的书中，他和合作者们写道，程序员的关键特质之一就是“懒惰”。这并不是说你写代码太懒了，而是说你懒得去处理琐事，所以这激发了你将它们自动化。正如他们所指出的，这是\n\
  \n> 一种能让你愿意付出巨大努力来减少总能量消耗的品质。它让你写出别人认为有用的省力程序，然后记录下你写的内容，这样你就不用回答那么多关于它的问题了。\n\n\
  最终，这种倾向会有某种方式渗透到你的日常生活中。它变得难以关闭，就像 X 射线视觉一样。“我认识的大多数工程师在一生中随处都能看到低效，”旧金山的一位程序员 Christina\
  \ 曾这样告诉我。“飞机登机时的低效，诸类的。你只是受够了破事总是坏掉的状态。‘嘿，这不太好，我要来修复它！’”她甚至会发现自己希望人们以更优的方式在人行道和过马路处穿行。她说，“这是对现状运行方式的一种根本性的不满。”Jeannette\
  \ Wing 是一位计算机科学教授——现任哥伦比亚大学数据科学学院院长——她普及了“计算思维”这一说法。它是观察你周围世界中隐形系统的艺术，那些支配我们生活方式的规则集和设计决策。这往往也让她注意到她周围平庸的组织形式。\n\
  \n“每当我去自助餐餐厅时，”她说，“如果自助餐的台位没有排列得恰当，我就会感到很恼。所以当他们把叉子和裹着纸的刀具放在最前面时？我觉得这太烦了！因为你必须在手里拿着这把刀叉的同时，还要托着盘子。餐具应该放在最后面！所以这个自助餐实际上是一系列线性排列的台位，你希望它是合理的。你不希望有太长的延迟。”这是一个经典的优化思维，这种东西你不需要成为程序员就能欣赏，但它对程序员来说是轻而易举的，甚至是是势不可挡的。（事实上，食物准备、递送和清理的要求似乎会引起黑客们特定的恼火——这可能任何讨厌做家务的人都能产生共鸣。程序员\
  \ Steve Phillips 曾告诉我，当他青少年时期帮妈妈打完晚饭后，他渴望用机器人自动烘干碗筷。“我从堆里拿一个，擦干它，放下，我从堆里拿一个，擦干它，放下。这感觉就像——这应该是一个\
  \ `for loop`。这真让我 `pissing me off`。）\n\n当然，对优化的热忱也可以渗透到社交和情感关系中。毕竟，与周围的人类相处——向他们打招呼，询问他们今天过得如何，听伴侣抱怨他们的一天——需要一对一的关注。这在`本质`上是低效的；给予他人情感关怀的意义在于慢下来并关注他们。对于那些已经在情感工作上表现得很糟糕的程序员——或者认为这种工作低人一等，或者仅仅对此感到困惑的程序员来说，他们的直能是：好吧，让我们把日常的情感工作也自动化吧。这可能会产生一系列令人不安的效率策略，如果它们的巧妙性不让人病态地着迷的话。\n\
  \n在一个 Quora 帖中，有几个例子得到了充分展示，程序员们在那里讨论了如何将日常生活自动化。“我听腻了朋友和家人说‘你从不给我发信息’，”其中一人写道，于是他创建了一个脚本，随机向他们其中一人发送短信，内容是用\
  \ Mad Libs 风格的组合生成的。（短信会以这种策略开头——“早安/午安/晚上，嘿 {name}，我一直想给你打电话”——然后从问候列表中添加一个选项：[我希望一切都好。我下个月会回家，爱你。我们下周找时间聊聊？]。）另一个程序员翻译了一个俄罗斯程序员的故事，那哥们写了一个脚本，如果他在晚上\
  \ 9 点还在公司，就会自动给伴侣发一条“下班晚”的信息（附带一个随机生成的理由）；还有一个程序可以启动他公司厨房里的咖啡机，并命令它冲一杯`中杯半糖拿铁`，在\
  \ 41 秒内准备好。（他的同事惊叹道，“这时间恰好是从那家伙办公桌走到机器所需的时间。”）在旧金山的一次黑客松上，一位中年程序员兴奋地向我展示他创建的一个应用，该应用可以从在线引用数据库中提取浪漫信息发送给伴侣。“所以当你没时间考虑她时”——没错，他假设那个需要情感关注的伴侣是“她”——“这个应用可以帮你解决，”他热情地说道。他似乎只是模糊地察觉到这听起来有多疯狂。\n\
  \n语言学家和心理学家早已记录了`泛交`沟通（phatic communications）的价值——我们人类在日常生活中使用的各种情感策略，让周围的人感到轻松或被倾听：`最近怎么样？天气真疯狂，对吧？你今晚打算做什么？`我和程序员聊得越多，听到的关于同事的故事就越多，他们觉得那些东西就像日常生活中无摩擦齿轮中的沙子一样令人心烦。一天晚上，当我与\
  \ Chris Thorpe 进餐时，他是一位曾在半六家科技公司工作的老兵，他想起了一位符合这种描述的前同事：“那是一个非常有天赋的工程师，他知道正确的方法。他非常不喜欢我们在会议上讲笑话，‘我们为什么要浪费五分钟？你知道，这浪费了一个半小时的人时’”\n\
  \n\n诚然，这个小脚本为我节省的时间……并不算什么大不了。假设我在写作工作期间平均每小时搜索两次同义词，并且（慷慨地）假设这个命令行应用每次搜索都为我节省了极其欢快的两秒钟，那么加起来一年也只少花了一个小时的等待时间。我并没有在这里因此腾出新的假期时间。\n\
  \n尽管如此！软件的性能是以毫秒计算的，因此我每次查询都节省了高达 2,000 毫秒，这听起来和感觉都比“两秒钟”要令人深刻得多。此外，速度带来的快感温暖了我的灵魂。每当我搜索一个同义词时，结果产出的极快速度带来的愉悦感，与我第一次运行脚本成功时的满足感不相色。我正向自己的血管里注入效率这种毒药，我的天，这种感觉太棒极了。（正如许多软件公司发现的那样，毫秒确实很重要，不仅对机器如此，也对我们这些急躁的人类的心理如此。我们希望周围的数字世界反应同样敏捷；谷歌发现，返回搜索结果时仅有\
  \ 100 到 400 毫秒的延迟，就会导致人们搜索次数的小幅但规律性的下降。）\n\n在接下来的几个月里，我开始在生活的每一个其他角落渴望那种感觉。我写了 `cron\
  \ jobs` 来清理我的电脑桌面，因为那里总是被各种奇怪的下载文件搞得很乱，而我又懒得把它们放在正确的地方。我会下载 YouTube 视频自动翻译的文本，由于厌倦了手动清理它们，我写了一个脚本来实现自动化。我儿子抱怨说必须坐在电脑前等老师发布小学作业（老师发布的时间总是错乱无章的，他只能坐在那儿手动刷新页面），于是我为他写了一个机器人，每隔几分钟检查一次，并在作业发布时发短信告诉我们。有一天，我发现自己很懊恼，因为我无法在边读《纽约时报》的同时同时打扫房屋。（其他人在打扫卫生时会听\
  \ NPR，但该死，我只想看硬核、信息量丰富的新闻，别的的也不要。）于是，我花了一个晚上凑出一个文本转语音的 Web 应用：现在我可以挑选几十篇《时报》文章，将它们排队，然后让一个糟糕的机器人声音——我更倾向于那种合成的“爱尔兰男”机器人——在我扫地和洗碗时把它们读出来。\n\
  \n并不是所有这些效率实验都成功了。事实上，有些还适得其反。我偶尔发现自动化某项任务比我预想的要困难，在一种凄凉的编程讽刺中，我编写软件花费的时间比直接手动完成任务所需的时间还要多。（一天晚上，我发现一个转录员交付了几份转录稿，但没有任何关于谁说了什么的标识标记。*没问题*，我想，*我只需写一个快速的\
  \ Python 脚本，遍历文本并交替为每隔一个段添加“问题”和“回答”*。但我犯了几个愚蠢的错误，发现我试图清理的数据格式并没有像我想象中那么规整——因此，一个本可能只需要十五分钟就能搞定的脚本，结果却花了一个多小时。赢了。）\n\
  \n我终于让它运行起来了，但这是一次极度愚蠢的时间浪费。我花了一个多小时试图自动化一个我手动只需几分钟就能完成的任务！让生活更高效，大概就这样吧。\n\n另一方面……自动化任务这个行为本身，嗯，很有趣。这显然比手动操作更有趣。自动化它要求我进行智力博弈、解决谜题。即使是那些拍脑壳的时刻（当我发现自己的新手级错误时）也包含着灵光一现的喜悦。当然，我完全可以在几分钟内手动完成这项任务。但那些将是枯燥、无聊的分钟！虽然我可能浪费了一个小时来钻研算法，但那是充满智力吸引力的、像触电般的时刻。\n\
  \n事实证明，这种现象在程序员中非常普遍。正如我发现的，编写程序花费的时间比手动完成它要多得多。\n\n* *\n\n... . . ...\n\n这种对优化的痴迷并不是真的随心所欲，尽管如此。\n\
  \n\n\n\n事实证明，这对于 Kickstarter 原有的设计来说是一个问题。“他们都在直播，说着：‘让我们一起庆祝这一刻，这是 Kickstarter\
  \ 的历史，’”Ivy 说道。但他还没有对 Kickstarter 进行优化，以应对如此密集的活动量。他的开发团队相当小；他们一直忙于各种其他的设计挑战。无论是\
  \ Ivy 还是其他工程师，从未预测过会出现这种用户行为——“人们太兴奋了，竟然坐在那里一遍又一遍地刷新页面，”’ Ivy 苦笑着说道。因此，他的一支团队并没有费精力去推磨主活动页面的加载速度。他们根本没有想过这会成为一个问题。现在它成了一个问题，而且是一个残酷的问题。由于这么多人急切地在同一个页面上疯狂点击，他们无意中引发了一场“拒绝服务攻击”——一种让服务器停滞的流量洪流。“我们崩溃了，”Ivy\
  \ 说，“我们崩溃了好几次。”\n\n感谢谢天地，没有人介意。相反，在那个年代，“搞崩 Kickstarter”被视为自豪的标志，是你的活动获得病毒式成功的证明。但\
  \ Ivy 知道粉丝们并不总是那么宽容，这意味着必须优化 Kickstarter，使其在活动升温时不会消耗过多的资源。一个关键技巧：他们编写了代码来实时更新项目的认筹金额，这样疯狂的粉丝就可以坐在那里看着数字不断跳动，而不需要不断刷新页面。于是，他们重写、重写、再重写代码库，即所谓的“重构”（refactoring），将其逐渐从一堆快速迭代的“目前够用”的代码，转变为愈发精简的代码。\n\
  \n### 重构的艺术\n\n“重构”在某种程度上就像编辑。当你写一封信、一个演讲稿或文章时，初稿往往有些臃肿和模糊。你只是把想法写在纸上，但它们表达得并不清晰。所以你会重复自己；你会绕圈子说话；你的思维是模糊的。但这没关系，因为你的目标不是完美；而是把第一批字写在纸上，以便以后进行重塑和磨炼。编辑能够锐化并磨炼那些松散的想法和语言。它删减掉你无意义且冗长的辞藻，让散文变得紧凑、精炼。这就是为什么对一件作品进行反复推敲、塑造——可以使其变短，而不是变长。“正如布莱斯·帕斯卡曾道歉的那样：‘这封信很长，仅仅是因为我没有空闲把它写短。’（作为一名数学家，他无疑理解表达简洁的价值，因为数学家喜欢简单、优雅的证明。）或者正如莎士比亚在一个句恰当且精辟的禅语中所说：“简洁是智慧的灵魂。”\n\
  \n### 编程中的效率\n\n编程也是如此。总的来说，代码越紧凑越好。这部分部分是因为代码行数越少，引入 Bug 的概率就越低。一大堆“意大利面代码”是一个\
  \ Bug 容易躲藏的沼泽。当代码更短、更紧凑时，更容易精确地看到它应该做什么以及不该做什么。它像是一片稀疏的桦树森林；你可以一眼看穿。\n\n`C++` 编程语言的设计者\
  \ Bjarne Stroustrup 教过许多年轻的学生。他告诉我，就像大一政治学专业的学生在论文里充斥着专业术语一样，新手程序员倾向于写出长得多、更复杂的代码。\n\
  \n“学生们给出的平均方案比我的方案大两到三倍，”他说，“我写的代码远没有他们那么多。我的代码更可靠，通常更快，错误检查更好。但它的体积只有他们写代码的一半到三分。”\
  \ 为什么会有这种差异？他说，是经验。缺乏经验的程序员会直接投入并开始在屏幕上构思代码；他们将程序的长度（编写代码行的行为）等同于生产力。但更有经验的程序员会思考他们试图解决的问题，以及代码应该完成的任务。当他们写代码时，受的是多年模式识别经验的引导：他们见过这类数组排序问题，并知道处理它最优雅的方法。\n\
  \n而且他们知道反过来也是成立的。当一个特定的 `function`——程序中的子程序——变得冗长且像迷宫时，很有可能它可以变得更高效。通常，修复或重构它的过程涉及一些微小的“分形元效率”：你发现代码重复的地方，然后消除重复。编码领域最古老的格言之一是\
  \ `DRY`——“不要重复自己”（Don’t repeat yourself）。\n\n### 少的价值\n\n有时，高科技媒体会报道软件库的庞大规模；例如，Google\
  \ 在 2015 年的各种服务包含了完整的 20 亿行代码。它传达了一种规模即价值的观念——行数越多，结果就越令人印象深刻；因此，有价值的程序员是一个坐在那里、在狂喜恍惚中敲字增加更多内容的人。但实际上，一个真正有用的程序员是那些让代码库变小的人，优雅地消除重复，即应用程序的垃圾\
  \ DNA。在 Facebook 工作三年后，工程师彦景浩（Jinghao Yan）检查了他对公司代码库的所有贡献，发现这个数学结果是负的。“我向主仓库中添加了\
  \ 391,973 行，并删除了 509,793 行，”他写道，“所以如果我每年编码 1000 小时，平均每小时净删除了约 39 行！”\n\n代码在某种意义上，奇异地让人想起诗歌。诗歌这种形式的力量往往来自于压缩。“在一首精构的诗中，每一个词都有意义和目的，”程序员兼企业家\
  \ Matt Ward 写道，“整部作品是经过精心雕琢的。诗人可能会为一个正确的词挣扎几个小时，或者把一首诗搁置几天再以全新的视角审视它。”\n\n\n\n\n\
  \n程序员们几十年来可能一直在谈论“刺鼻味”（“这代码代码太臭了”）。但这种语言在 20 世纪 90 年代后期变得了制度化，当时两位卓越的编码员——马丁·福勒（Martin\
  \ Fowler）和肯特·贝克（Kent Beck）正在写一本关于代码重构的书，并试图描述糟糕代码的本体论标记。贝克可能“受到当时他新生婴儿气味的影响”，提了“异味（smells）”，于是他们关于这个问题的章节被命名为“代码中的坏异味”。从那时起，这种用法变得非常普遍；在\
  \ Stack Overflow 之类的程序员论坛上输入“smells”，你就会看到成群程序员在哀叹他们工作中散发出的臭味，并恳求帮助对其进行清理。（甚至学术界的计算机科学研究人员现在也例常使用这种语言。一篇名为《你的代码何时以及为何会开始变臭》的论文研究了为什么会写出难闻的代码；他们发现，除其他外，过度工作和紧迫的截止日期是其因。他们指出，“高负载和发布压力的开发者更容易引入`smell\
  \ instances`。”这里的强调是我个人的。）\n\n这种从视觉到嗅觉的转变在我看来既有趣又富有启发性。因为优秀代码的良好被视为某种可见的东西，它暗示了结构之美，一种让你望之肃畏的东西：运转的钟表零件、一座悬索桥、一幅莫迪利亚尼的作品。要点在于赞叹人工技艺，事物的“制造感”。但通过将糟糕的代码与气味联系起来，我们突然进入了有机物的世界，进入了腐烂鱼和过期牛奶的世界，即怀疑`某处`出了问题，隐藏在我们看不见的地方。或者是道德世界：研究人员越来越多地发现，我们将糟糕的臭味与冒犯我们的思想或政治观点联系在一起。\n\
  \n程序员布莱恩·坎特里尔（Bryan Cantrill）指出，程序员极度倾向于找出 bug 最干净的修复方法，某种能够完美处理软件可能面临的每种情况的解决方案。当他们无法做到——也许是没时间，或者也许\
  \ bug 仅仅击败了他们——他们就会不情愿地使用不优雅的解决方案：一堆凌乱的代码行，处理四个特定的失败条件（他们所知的奇怪边缘情况），然后他们只会祈指保佑，祈祷那里没有`更多`潜伏的边缘情况。从技术上讲，他们已经解决了问题。但他们会非常讨厌自己，以至于经常会在解决方案旁边添加一条注释，责备自己——并称自己的代码为“恶心”、“令人作呕”或“卑劣”。对于程序员来说，低效的代码是对灵魂的亵犯。\n\
  \n***\n\n### ... ... ...\n\n不久前，我坐下吃晚餐，那本只有一种东西：一瓶 Soylent。\n\n我打开瓶盖，将其倒入一个高大的 12\
  \ 盎司玻璃杯里。Soylent 呈现出一种模糊的糊状白色，看起来很像我的程序员朋友开玩笑说的那样，“一杯煎饼面糊”，并补充说“尝起来也是那样的”。他是对的，当我灌下一口饮料时，我发现了这一点。但我五分钟就吃完了整顿饭，这正是重点所在：Soylent\
  \ 是终极优化的饮食。\n\nSoylent 由 25 岁的罗布·莱因特（Rob Rhinehart）在 2013 年发明，他是一个程序员，他的创业公司——与两个年轻合作者共同创立——从\
  \ Y Combinator 获得了 17 万美元，用于创建廉价、新式的手机基站。遗憾的是，他们的技术失败了。但莱因特在空闲时间里一直在思考日常生活中的一个新问题：食物。\n\
  \n莱因特决定，食物是极大的时间浪费。他计算出自己每天在饭食上花费大约两个小时。“通常我会在早餐做煎鸡蛋，午餐出去吃，晚餐做一个墨西哥薄饼、意大利面或汉堡，”他在博客上写道。“每在家吃一顿饭，我都必须清洗并擦干餐具。这还不包括去超市的路。”他认为，问题在于食物准备本身就是一种补充身体能量的低效方式。如果他只是将必要的营养物质组合成液体，就会容易得多。他开始在网上研究这个问题，在厨房里捣鼓，几周后就生产了第一批\
  \ Soylent。他开始仅靠这种饮料维持生存，在接下来的一个月里，在令他的室友们相当惊讶的是，他并没有死。事实上，他看起来活得很好，报告说他发现“我的皮肤变透了，牙齿变白了，头发变密了，头皮屑消失了。”\n\
  \n而且，他抽象掉了所有花在食物上的时间。“现在我晚上花大约五分钟准备第二天，每顿饭只需要几秒钟，”他写道。“我喜欢数量级上的改进，我确实不怀念洗碗。事实上，我可以完全撤掉厨房，没有冰箱耗电，没有持续的清洁或对害虫的担忧，并且有更多的生活空间。我只需要一个水源。”他并没有完全放弃正规食物。“正如任何\
  \ Instagram 用户所知，食物是生活的重要部分。食物可以是艺术、慰藉、科学、庆祝、浪漫，或与朋友见面的理由，”他补充道，“尽管大多数时候它只是个麻烦。”\n\
  \n许多程序员对 Soylent 感到兴奋。莱因特最初的贴子在黑客网站上迅速流传，他将 Soylent 转化为产品的众筹活动在两个小时内就达到了目标。几位创业程序员告诉我，他们一直在食品储藏室里备着这种东西。对于硅谷特有的、永不停歇的工作量，对于长达\
  \ 14 小时的编码冲刺来说，它是完美的；如果你不想中断你的心流状态，在笔记本前吸入一瓶糊糊“真的需要的体力活动更少，”正如一人对我说的。而且不仅仅是程序员在买\
  \ Soylent；这种饮料在油井工人、建筑工地经理、通勤者以及任何想要消除吃饭时间的人中赢得了粉丝。\n\n\n\n\n诚地说，这些服务中的某些在受宠宠的应届毕业生群体之外也非常受欢迎。许多人——当然是那些富有到可以为此付费的人——非常乐意付费让生活中那些令人痛苦的部分抽象化。Uber\
  \ 的巨大成功建立在对呼叫汽车模式的重塑之上，而这一行为在历史上一直深受令人咬牙的低效之困扰：出租车不知道客户在哪里，而客户也不知道出租车在哪里。\n\n但优化不可避免会产生副作用；有赢家也有输家。Uber\
  \ 的车辆遍布全球各大城市的街道，这对于乘客来说是极好的——但对于司机来说就没那么了。考虑到街道上激烈的竞争，许多司机开始发现，维持稳定的生计变得越来越困难。（仅在纽约市，2018\
  \ 年传统出租车只有 13,578 辆，但网约车数量已飙到 80,000 辆。）无疑对于那些只是为了赚点外快钱的司机来说，有一个快速获得额外零花钱的方法让他们兴奋不已；Uber\
  \ 和 Lyft 让驾驶作为计件工作成为可能。但对于任何希望将驾驶作为一份稳定长期工作的人来说，这是一个坏消息，这种工作在历史上曾是大城市移民最容易获得的工作形式之一。正如尼日利亚出租车司机\
  \ Nnamdi Uwazie 告诉美国广播（NBC）的那样，“Uber 和 Lyft 做的是进入这个行业并摧毁了它。”到 2017 年，几名出租车司机自杀，并归咎于网约车公司严重动乱了他们的工作，以至于无法依靠驾驶获得可预测的收入。\n\
  \n***\n\n事实上，即使是程序员自己也可能对自己对优化的热忱如何产生意料之外且令人不安的怪异副作用而感到惊讶和幻灭。\n\n这正发生在 Facebook\
  \ `Like` 按钮的一些早期工程师身上。\n\n回到 2007 年，几位 Facebook 员工想要加快服务的代谢。一位名叫莉亚·佩尔曼（Leah Pearlman）的设计师怀疑人们发布动态的频率没有想象中那么高，是因为对朋友的更新想出一个聪明的回复需要花费太多精力。或者，如果他们留下了评论——但并没什么说什么——他们会只留一个词，比如\
  \ `Yay!`，而这些单单词评论弄乱了 Facebook 的视觉效果。佩尔曼设想有一种更精简、更高效的东西，某种一键即可让用户确认朋友动态的方式。佩尔曼认为，这可能会释放出大量的正能量。（她曾在某次演讲中开玩笑说：“我可能还因此错过了多少认可呢？”）她在\
  \ Facebook 的另一位同事贾斯汀·罗森斯坦（Justin Rosenstein）——一位在帮助 Google 制作了 `Gchat` 原型后加入 Facebook\
  \ 的编码员——也得出了类似的结论。“如果我们能让认可一个帖子所需的精力低到这种程度，让人们只需要一个手势就可以呢？”（或者，正如他告诉 *The Ringer*\
  \ 杂志的那样：“那里有一个利用设计来让参与某些互动成为阻力最小路径的机会”）\n\n很快，他们的想法在 Facebook 员工中引起了共鸣。团队决定制作一个“Awesome”（太棒了）按钮，显示在每条动态的旁边：点击它，你就提供了一个乐观的信任票，而且是整洁、干净且快速的。更好，这对\
  \ Facebook 的分析也很有帮助：`News Feed`（新闻动态）团队可以观察用户点击了什么类型的动态，以便更好地确定在该用户的 `News Feed`\
  \ 中推广哪些类型的动态。（你是在点击婴儿照片吗？让我们给你看更多这类！）广告部门的人也喜欢它，因为这将为他们提供更多关于每个用户最喜欢哪种类型的数据，以便定制广告。\n\
  \n在经历了漫长通宵的黑客工作后，佩尔曼、罗森斯坦和一群 Facebook 员工拼凑出了一个粗糙的原。到早晨六点，他们已经可以在几个内部实验账户上点击 `Awesome`\
  \ 了。扎克伯格最初表示怀疑，但这个概念很快在公司员工中流行起来。最终，设计团队将名称从“Awesome”改为 `Like`，并设计了那个粗大的蓝色大指向上，它将成为世界上最著名的计算机图标之一。它于\
  \ 2009 年 2 月 9 日上线，很快成为该服务最常用的功能之一。到目前，它的点击次数已超过一万亿。\n\n从某方面来说，`Like` 准确实现了罗森斯坦和佩尔曼所希望的。通过让在\
  \ Facebook 上表达认可或支持变得极其快速和高效，它释放了正能量的流。\n\n但正如人们开始注意到的那样，它产生了一些令人不安的成瘾行为。\n\n这是因为\
  \ Facebook 显示了每条动态积累了多少个 `Likes` 的数字总量。用户变得痴迷于盯着那个数字，精确追踪他们获得了多少认可。他们会发布一张照片，然后疯狂地刷新页面，看着\
  \ `Like` 总数上升。这变成了另一种被注意力研究人员追踪的“自我中断”——我们可能正在写邮件或和朋友聊天，然后突然翻到 Facebook，紧张地检查我们被量化的人气。\n\
  \n“这是我们这一代的海洛柯因，”科技创业者拉米（Rameet Chawla）写道。“人们上瘾了。我们会经历戒断反应。我们被这种药物如此驱动，仅仅获得一次满足就会引发真正奇特的反应。”心理学家可能早已预测到这种行为：回到\
  \ 20 世纪 70 年代，社会心理学家唐纳德·坎贝尔（Donald Campbell）指出，如果你使用单一衡量标准来奖励人们，他们会竭尽办法让那个数字变高。（这现在被称为“坎贝尔法则”。）因此，`Like`\
  \ 按钮也可能改变了人们在 Facebook 上发布的内容。Facebook 用户开始为了引发反应而发布更新和照片：激烈的言论、夸张陈陈。\n\n更令人不安的是，`Like`\
  \ 为 Facebook 提供了一种追踪用户的新有力手段。一旦 `Like` 流行，Facebook 就发布了代码，让任何网站都可以在帖子上贴上 `Like`\
  \ 按钮。很快，整个网络到处都是 `Like` 按钮。但这段代码兼具窥探功能。如果你是 Facebook 用户并登录了网站，每当你访问带有 `Like` 按钮的页面，该按钮都会告诉\
  \ Facebook 你去了哪里，即使你从未点击。事实上，`Like` 的疯狂流行让 Facebook 能够对用户的浏览习惯建立一个庞大的档案。\n\n\n\n\
  \n这一直困扰着帕尔尔曼。事实上，她发现检查 Facebook 已经变成了一项情感上的负担，以至于她安装了软件来屏蔽信息流。（该浏览器插件将信息流替换为一段关于自律的随机引言，例如哲学家莫蒂默·J·阿德勒的一句禅语：“没有通过自律获得自由的心灵，真正的自由是不可能的。”）正如帕尔尔曼所说：“我查看了，然后感觉很糟糕。无论有没有通知，感觉都不真的那么好。无论我们希望看到什么，它永远无法达到那个标准。”罗森斯坦也决定他需要从社交媒体的干扰中抽离出来。正如他告诉《卫报》的那样，他屏蔽了\
  \ Reddit 等网站，停止了使用 Snapchat，甚至设置了家长控制程序来防止自己在手机上下载新应用。他的助手设置了密码。事实证明，放慢速度的方法确实是有用的。\n\
  \n# 第 6 章\n\n## 10X、摇滚星与精英治国的神话\n\n在编程界的史书中，马克斯·列维钦（Max Levchin）被认为是一个巨头。\n\n列维钦是那个几乎凭一之力让\
  \ PayPal 诞生的程序员，当时处于编程的疯狂状态。他在 20 世纪 80 年代的乌克兰长大，在那里他发现了玩弄计算机的乐趣。当他的家庭逃离该地区时——他们是受迫害的少数群体——他们于\
  \ 1991 年到达芝加哥。当时他们一无所有，但他们儿子的热情让他们买了一台电脑。他在伊利诺伊大学学习计算机科学时，他了解了马克·安德森森（Marc Andreessen），后者在几年前共同创立了\
  \ Netscape 浏览器并一夜成为百万富翁。列维钦是一个极内向的人，但创业的浪漫让他着迷。在学生期间，他不仅创立了一家三三公司，当最后一家以 10 万美元出售时，他把自己的所有财产——一堆电子产品——装进卡车，和朋友一起开车去了硅谷。\n\
  \n他和一个朋友一起闲逛，有一天，在斯坦福校园误进了一个由彼得·蒂尔（Peter Thiel）关于政治的讲座。那时，蒂尔是一个律师，也是一个研究过哲学、狂热的自由意志主义者。列维钦很喜欢这场讲座，并后来向蒂尔推销了他的想法。在学校期间，列维钦就以疯狂代码而闻名，处于一种不懈的、持续数日的工作状态中。PayPal\
  \ 的起源就是这样：列维钦已经写了大量的模拟器，所以他自己就写出了 PayPal 的原型软件。当 PayPal 获得 450 万美元融资时，为了一次公关活动，他和蒂尔决定做一个假演示，让人们以数字方式转账——从一个设备传输到另一个设备。但列维钦对这个想法感到“厌恶”，正如后来在《创业者》（Founders）一书中回忆的：“如果崩溃了怎么办？”他想，“为了避免任何尴尬，我将不得不去自杀。”\n\
  \n相反，他和雇佣的另外两个程序员埋头苦，连续五天几乎不停地写代码。在《创业者》中，列维钦回忆那段时间完全没有睡觉：“那简直是一场疯狂的马拉松。”他们在演示开始前一小时完成了工作。在一家名为\
  \ Buck's 的当地餐厅，当记者聚集在一起时，300 万美元成功地从一台设备传输到了另一台。列维钦点了一份早餐煎蛋但在还没来得及吃之前睡着了。“我记得下一件事，”他说，“我醒来时，正坐在自己的煎蛋旁边，而\
  \ Buck's 已经没人了。他们只是让我睡觉。”\n\n随着 PayPal 的兴起，他保持了那种神一般的编程成就。一个例子就是他反击欺诈：随着 PayPal\
  \ 的发展，犯罪分子开始利用 PayPal 偷钱，每月高达 1000 万且仍在增长。恐慌的列维钦计算出，按照目前的增长速度，欺诈很快就会吞噬公司的利润并使其瘫痪。“世界随时都会毁灭，”他想。于是，他和工程师们投入了这项任务，列维钦再次进入了不眠的黑客模式。他几天不洗澡正如记者莎拉·拉西（Sarah\
  \ Lacy）在她的书《运气一次幸运两次》（Once You’re Lucky, Twice’re Good）中所提到的，当他的味道成为办公问题时，他会在 PayPal\
  \ 办公室洗个快澡，换上印有公司 Logo 的 T 恤。（拉西冷静地写道：“在任何时候，马克斯的工作量都可以通过他在帕洛奥托公寓里那堆不断增加的旧 T 恤来衡量。”）\n\
  \n尽管如此，他的工作极具创新性。在这些工作期间，列维钦想出了精明的反欺诈策略；他共同创立了最早的商业用 CAPTCHA 测试，通过拉伸和扭曲文本使人类可以阅读，而机器人却不能。他还设计了一个工具，帮助\
  \ PayPal 的人工欺诈调查员快速处理海量交易；当他向他们展示这个工具时，有人喜极落泪。可以说，列维钦的反欺诈工作让 PayPal 避免了像它的许多竞争对手那样的灭亡。\n\
  \n在这些史诗级成就的推动下——聪明的软件、耐力、疯狂的工作时间——PayPal 团队产生了一种赢得金牌的自豪感。当 21 世纪初互联网泡沫期间的其他高科技公司倒闭时，PayPal\
  \ 正在飞速发展。它成功上市，随后被 eBay 以 15 亿美元的价格收购，使其创始人变得极其富有。PayPal 副总裁基思·拉博伊斯（Keith Rabois）声称，PayPal\
  \ 是“精英治国的完美证明”。作为 COO 加入 PayPal 的前管理顾问大卫·萨克斯（David Sacks）后来告诉艾米莉·常（Emily Chang）：“我们中没有人与硅谷的任何人物有联系。我们在五年内从完全的格格不入变成了主流阶层。我们曾是彻头彻尾的小人物。”或者正如萨克斯所说，“如果地球上任何地方存在精英治国，那就在硅谷。”正如故事说的，当你足够卓越，你就能赢。\n\
  \n***\n\n摇滚星。忍者。天才。\n\n在科技界，关于软件开发人员存在一种长期的文化神话，即他们不仅优秀，而且拥有奥林匹克般的才华和生产力。\n\n流行文化早就认同了这一观点，使得对编程的描写总是聚焦在那些孤独的天才身上，他们在类列维钦式的狂躁发作中召唤了数字宫殿的诞生。这种彻夜黑客之夜的奇观在此时几乎成为了一种荣格式的原型。在《社交网络》（The\
  \ Social Network）的早期，马克·扎克伯格这个角色经历了一个晚上疯狂敲击键盘的夜晚，产出了他的那个让哈佛学生对女同学的外貌进行投票的应用程序。在剧集《硅谷》（Silicon\
  \ Valley）中，在初创公司将在 TechCrunch 大会上付诸火海的前一个晚上，程序员创始人理查德产生了顿悟，并再次在午夜之间重写了他的整个压缩算法，将性能几乎提高了一倍并击败了他的竞争对手。剧集《辐射与捕客》（Halt\
  \ and Catch Fire）中的黑客卡梅隆·豪伊（Cameron Howe）为了帮朋友的公司，创造了本质上就是 Google PageRank 的算法。\n\
  \n\n\n\n\n这种对“独角兽程序员”的信仰不仅仅是一个流行文化。事实上，在真实的软件世界中，它是如此广为人知的以至于这个概念有一个专门的名字：“`10X`”程序员。正如这个绰号所暗示的，它描述的是一种被证明比普通“代码猴子”优秀数倍的程序员。\n\
  \n### 10X 程序员的起源\n\n这个概念可以追溯到 1966 年，当时系统开发公司（System Development Corporation）的三位研究人员发表了一篇标题看似平庸的白皮书：“在线与离线编程性能对比探索性实验研究”。最初，由\
  \ Hal Sackman 领导的这个小组是为了回答一个关于编码的相当普通的技术问题：在纸上写代码还是坐在电脑前打字写代码更好？在 60 年代，拥有属于自己的电脑是非常稀有的。大多数编程都是以“离线”模式完成的。例如，你需要手写代码，将其打在穿孔卡上，然后将卡片交给计算机操作员。然后你就可以坐下来等待，有时要等几个小时，直到那批卡片被处理。但到\
  \ 60 年代中期，新的在线系统出现了，允许程序员以交互式、实时的方式控制机器。现在，你可以坐在键盘前，输入代码并立即看到结果。\n\n正如你所想象的，大多数程序员远更倾向于在线系统。让机器即时给你响应要有趣得多；他们觉得这让他们效率提高了许多。但在线系统的成本昂贵得多，公司并不确定这笔费用是否值得。因此，Sackman\
  \ 检查了两次对决测试的结果。程序员小组被分为两种情况：一组必须使用旧式的离线风格编写和调试一段代码，而另一组则允许使用新的在线模式。他衡量了他们性能的各个方面，包括编写程序所需的时间、调试所需的时间、代码的长度以及运行速度有多快。当他计算数据时，你看吧：在线编程胜出了。那些能够与机器进行流畅交互的人比那些在离线模式下工作的人“表现优异”。\n\
  \n### 显著的个体差异\n\n但 Sackman 还发现了另他意料之外的东西。在经验丰富的程序员能力之间存在“显著的个体差异”。那些优秀的程序员似乎比平均水平要好得多——而且比糟糕的程序员要荒谬、疯狂得多。\n\
  \n例如，当被要求编写和调试能够通过迷宫的代码时，最快的程序员比最慢的快大约 25 倍。编写和调试代数问题的情况也是如此：最快的在编写代码时比最慢的快 16 倍，在调试时快\
  \ 28 倍。此外，优秀者的软件运行得也更快；排名第一的迷宫代码比最慢的快 13 倍。“引用一首童谣的话，”Sackman 和他的同事们写道：\n\n> 当一个程序员优秀时，\n\
  > > 他非常，非常优秀，\n> > 但当他糟糕时，\n> > 他糟糕透极。\n\n他们的结论是什么？程序员在技能上存在差异，“通常差一个数量级”。\n\n###\
  \ 神话的延续\n\n现在，正如许多批评者所指出的，Sackman 的研究存在许多问题。在这些批评中，，它只测试了一个极小的样本，这使得结果无法推广到整体。\n\
  \n但这些批评并没有立足。这种“10 倍差异”的观点在软件行业中具有某种诗意的肯定意义，它与许多与计算机并肩工作的人的轶事证据产生了共鸣。即使在 60 年代和\
  \ 70 年代，经理们也声称——出于他们无法解释的原因——少数程序员能够以超自然的速度和优雅来解决问题，这是他们并不拥有的。（即使 Sackman 最严厉的批评者之一认为该研究“完全不可靠”，他们指出高表现人才的极度短缺。）不久，其他研究人员提供了数据集，似乎证明了精英阶层的存在。软件经理\
  \ Bill Curtis 发表了一项关于他对 54 名程序员进行的测试，其中最好的比最差的高出 `8 倍`到 `13 倍`。计算机杂志 *Infosystems*\
  \ 的一个标题将编程领域描述为稀有英雄的星级制度：“蒙古人军 vs 超级程序员”。\n\n### 神话般的人月\n\n这个传说可能是在 1975 年定型的，当时弗雷德·布鲁克斯出版了《神话的人月》，这是一本关于软件项目管理边缘艺术的书。Brooks\
  \ 赞同地注意到了 Sackman 的发现。“编程经理早就意识到优秀程序员和糟糕程序员之间巨大的生产力差异，”他指出，“但实际测量的幅度令我们所有人感到震惊。”他论证道，理论上，通过简单精简到只有最优秀的表演者，就可以构建世界上最好的编码团队。如果团队有\
  \ 200 名程序员，只有 25 人是真正的明星，那么“解雇那 175 名士兵”，让这 25 个明星独立完成工作。\n\nBrooks 指出，科技公司将编码看作是一种体力劳动，你可以通过简单增加工人来加速。你需要双倍的速度收割麦子吗？简单：增加双倍的割麦工人。但编码是一种基于洞察的劳动形式，更类似于写诗。仅仅增加人数并没有帮助，因为问题的解决方案可能不是来自许多人的汗水，而是来自个体的闪电般的顿悟。结论是，在组织架构上，编码与挖沟完全相反。向一个棘手的问题投入更多的程序员可能会让情况变得*糟糕*。Brooks\
  \ 将其总结为一句精辟的格言：`为延期项目增加人力只会项目更延期`。\n\n\n\n\n他是对的：小规模或单人创新者的名单很长。`Photoshop` 的第一个版本是由两个兄弟创建的；1975\
  \ 年开启微软的 `BASIC` 版本是由年轻的比尔·盖茨、他的校同学保罗·艾伦和哈佛新生生蒙特·达维多夫在几周内拼凑出来的。早期且有影响力的博客工具 `LiveJournal`\
  \ 由 Brad Fitzpatrick 编写。导致 `Google` 的突破性搜索算法是两个学生 Larry Page 和 Sergey Brin 的产品；`YouTube`\
  \ 是三位同事的产物；`Snapchat` 是三人（或者从代码量来看，是一个人，Bobby Murphy）。`BitTorrent` 完全是 Bram Cohen\
  \ 的产物，而 `Bitcoin` 据说是一个孤独程序员、化名“中本·聪丰”的作品。John Carmack 创建了 3-D 图形引擎，帮助了价值数十亿美元的第一人称射击视频游戏行业的诞生。\n\
  \n安德森认为，之所以只有极少数人能产生如此巨大的影响，是因为当你正在创建一个奇特的新应用原型时，这种思维城堡的构建在一个两个孤立的大脑中进行效率最高。10 倍的生产力源于进入状态并保持在那里，源于对复杂架构的卓越可视化能力。“如果他们身体上能够保持清醒，他们就能走得非常远，”他说，“限制是清醒的时间。你需要两个小时才能把整个东西加载到脑子里，然后你就有\
  \ 10、12 或 14 小时可以保持那个水平运行。”他所认识的 10 倍程序员也往往是“系统思考者”，对技术栈的每一个部分都有着永渴的好奇心，从计算机处理器中电流流动的方式到触摸屏按钮的延迟。“这是好奇心、驱动力和理解需求的结合。如果他们不理解系统运作的某个部分，他们会觉得无法忍受。”\n\
  \n这就是为什么 10 倍程序员喜欢初创公司。在这些地方，他们可以从一张白纸开始，大显风采，展示自己的本领。相比之下，许多大型且成熟的企业需要更慢的节奏。他们拥有庞大的遗留系统，代码可以追溯到几年甚至几十年，并且有依赖系统运行的客户。这项工作与其说是“快速移动和创造”，不如说是耐心温柔地修复那些大体运行良好的系统中的漏洞。安德森记得\
  \ 90 年代初在 `IBM` 实习，当时公司有一项坚决的标准：“每天十行软件代码。编写、测试、调试、记录这十行——不多，也不少。每天少于十行，就说明你在偷懒；每天多于十行，就说明你在鲁莽。”\n\
  \n许多资深代码人员都同意，10 倍程序员不仅存在，而且可能是生产力的关键。`Fog Creek Software` 的联合创始人 Joel Spolsky 曾在的一篇博客中写过，当他在\
  \ `Juno`（一家在线服务和免费电子邮件提供商）工作时，他们有一个名为 `Jill McFarlane` 的错误检查员。她“发现的 Bug 比其他四个测试员加起来还要多三倍。我没有夸张，我实际上测量过。她的工作效率是平均测试员的十二倍以上。当她辞职时，我给\
  \ CEO 发了一封邮件说‘我宁愿周一和周二有 Jill，也不要整个 `QA` 团队加在一起。’”\n\n正如著名的初创企业加速器 `Y Combinator`\
  \ 负责人 Sam Altman 所说，代码中存在单一天才的想法并不令人意外；每个基于洞察的领域都有杰出人物。“在其他领域这似乎并不具有争议，”他告诉我，“有\
  \ 10 倍物理学家，我们颁发他们诺贝尔奖，这没问题。有 10 倍作家，我们送他们登上《纽约时报》畅销书的榜首。”似乎，一些计算机科学老师不仅同意这一观点，而且认为在孩子刚学习编程时，10\
  \ 倍人才也是显而易见的。计算机科学教授 Clayton Lewis 的一项小型研究发现，77% 的计算机科学系教职员工不同意“只要努力，几乎每个人都能在计算机科学课程中取得成功”这一说法。在他们看来，你要么有天赋，要么没有。\n\
  \n***\n\n... ... ...\n\n2017 年有一天，我访问了 `Dropbox` 会见它的创始人 Drew Houston。他正是某些人可以轻易称自己为\
  \ 10 倍程序员。他从小就开始编程，就读于 `MIT`，曾一次在空闲时间写过一个可以玩高水平在线扑克游戏的机器人。从 `MIT` 毕业后，他由于遗忘 USB\
  \ 盘而非常懊恼，决定亲手编写一套系统，自动将文件从计算机同步到服务器。这变成了 `Dropbox` 的原型；他意识到其他人可能想用它；在通过 `Y Combinator`\
  \ 之后，Houston 将其变成了一家在 2018 年底价值约 100 亿美元的公司。\n\n坐在 `Dropbox` 音乐室的紫色沙发上——公司有一个完整的音乐工作室，配有架鼓、吉他和与放大器，供员工放松使用——Houston\
  \ 认为他的成功部分是建立在发现和聘佣 10 倍程序员的基础上。他们的天赋部分建立在经验之上——他们投入了 10,000 小时，见过每一个罕见的错误信息，并随着时间的推移练就脱困的技巧。“那是可以训练的，”他认为，后天大于先天。但他说，其中也有一些天赋因素：激情、强度和对工艺的热爱，这似乎是性格特征。“他们就像一种你朝着问题大方向释放的力量，”他说。\n\
  \nHouston 向我介绍了一位他认为是顶级程序员的员工：Ben Newhouse，当时 28 岁，是该公司的工程主管。（他后来离开了公司去投身创业了。）Newhouse\
  \ 像 Houston 一样，在学生时代就创建了一些有价值的代码：作为一名 21 岁的斯坦福大学本科生，他创建了 `iPhone` 的首批增强现实应用之一。他在\
  \ `Yelp` 实习时，他意识到可以使用 `iPhone` 内部的指南针和 GPS 传感器让屏幕对周围的世界做出反应。在红牛能量饮料支撑和——你可能预料到了这一点——一个通宵的疯狂编程后，他构建了一个功能，可以让你拿起\
  \ iPhone，看到附近商店的 Yelp 评论悬浮在周围空气中。\n\n在 Dropbox，他痴迷于一个开始困扰该公司的有趣问题。人们经常使用 `Dropbox`\
  \ 备份整个硬盘，因此在多年的使用中，客户的 Dropbox 账户中可能会有 300 或 400 GB 的照片、电影和文档。然后某一天，他们决定升级旧笨重的笔记本电脑——并选择一个像\
  \ `MacBook Air` 这样轻便的型号。但这些新轻型电脑的硬盘很小，可能只有 128 GB。现在 Dropbox 用户面临了问题。他们无法将 Dropbox\
  \ 云端所有的 400 GB 文件反向同步回新的、现在很小的笔记本硬盘。从本质上说，这破坏了 Dropbox 引以为傲的“设置后即忘”的便利性。他们现在不得不坐下来思考：*好吧，我应该手动把哪些文件回到我的小笔记本上？我全放不下。*\n\
  \n但这个问题困扰着 Newhouse。*对此，一定有一个更优雅的解决方案，*他想道。\n\n\n\n几个月后，他获得了解决这个问题的机会。Dropbox 举办了其中一次例行的内部黑客松，正如休斯顿告诉我的那样，“我们会锁上大门，花一整周的时间尝试新想法。”Newhouse\
  \ 在思考备份问题时，产生了一个非常用且偶然的思维联结：杀毒软件。当你打开一个文件时，你的杀毒软件会使用“微过滤器”（minifilters）快速检查其内容。他可以借鉴这种技术并将其植入\
  \ Dropbox 中。这会让你的那台小型 MacBook Air 看起来就像拥有了所有的 Dropbox 文件——但实际上，它会在你请求的瞬间从云端抓取文件，允许你进行编辑，然后将其存回云端。但这个过程发生得非常快，你感觉不到任何痛苦的延迟。\n\
  \n这并非易事。它需要运行在计算机操作系统“内核”（kernel）深处的代码——这是系统最核心的部分之一——而在 `kernel` 级别进行调优就像是进行神经外科手术。如果不加小心就改变\
  \ Dropbox 的工作方式，可能会导致数百万用户发生“数字中风”，破坏他们的一些备份信息。“`kernel` 是一个工作更加激烈、更危险的地方，”Newhouse\
  \ 说，“因为如果你搞砸了，一切都会砰然爆炸。”这就是为什么多年来，工程师们认为最好不要去碰这种剧烈的东西。“许多人认为这是不可能的，”另一位 Dropbox\
  \ 工程师杰米·特纳（Jamie Turner）告诉我。\n\nNewhouse 在家办公时，缩在笔记本电脑前，疯狂地编写代码，到周末结束时已经完成了他概念的演示。休斯顿对此印象深刻，于是交给\
  \ Newhouse 一个六人的团队来将其变为现实。当 Newhouse 在公司内部悄悄部署了这项新功能时，他的同事特纳还没意识到它已经开启了；直到他在自己妻子的新\
  \ MacBook 上安装 Dropbox 时才发现了它，当时他本以为同步那些海量文件需要大约 48 小时。结果，同步只用了几分钟。*这到底是怎么做到的？* 当他正纳纳思妙时，突然看到了一条“已启用智能同步”的消息。“噢，我真是活见了鬼了。”当这项功能以“智能同步”（Smart\
  \ Sync）之名对外发布时，它是 Dropbox 多年来最重大的升级之一。\n\n休斯顿告诉我，这种事情正是他试图招募的那种“以弱胜强”的创造力。招到一个这样的人，你就能推出其他十个人无法实现的想法。\n\
  \n“无论我在房间里坐多久并尝试谱出一首交响乐，我都做不到，”他说。“你可以拥有十个或一百个设计师，”他总结道，“但你得不到一个像乔尼·艾维（Jony Ive）。”\n\
  \n***\n\n... ...\n\n理解为什么有这么多程序员热爱“编程是一个纯粹意志力、原始天赋和 10 倍唯才是精英的世界”这种想法并不难。\n\n在日常编码的单纯层面，这确实*感觉*是真的。你无法欺骗计算机，也无法通过虚张声势通过失败的代码测试。“正如程序员梅雷迪·L·帕特森（Meredith\
  \ L. Patterson）在 2014 年的一篇文章中所写的，你无法与 `root shell` 争论，”她补充道，“‘代码是不看人脸的。你的代码让你伟大，而不是反过来。让那些非程序员去挥手、哀求和说服吧；真正的程序员只尊重运行的代码，该死的。”正如马克·扎克伯格（Mark\
  \ Zuckerberg）在 Facebook 上市时的一封公开信中所写的：“与其花几天时间争论新想法是否可行，或者构建某物的最佳方式是什么，黑客们更愿意直接写个原型看看什么有效。在\
  \ Facebook 办公室里你会经常听到一句黑客格言：‘代码战胜一切辩论’……黑客文化也极其开放且唯才是精英。黑客相信，最好的想法和实现方案应该永远胜出——而不是最擅长游说想法的人，或者管理人数最多的人。”\n\
  \n作为才华的另一个标准，一些程序员向我指出，编程是一种稀有的工程形式，完全自学的人可以被拥有高学历的同伴所接纳。“对我来说，计算机科学最着迷的地方在于，它是我所知的\
  \ STEM 领域中唯一一个既有极高学历的人又与完全自学一切的人并肩作战的领域，”约翰娜·布鲁尔（Johanna Brewer）说道。她确实从初中开始自学编程，然后获得了信息与计算机科学的\
  \ `PhD` 学位，并创立了数家公司。\n\n不过，正如几位程序员补充的那样，对唯才是精英的信念背后可能也存在着大量的自恋。\n\n有时，对相信唯才是精英的渴望是应对青少年时期“极客伤害”的一种方式。对于任何成长为笨拙内向者的人来说，在高中或职场早期那种极度社交的等级制度中感到格格不入，“认为编程是一个中立客观的世界”这一想法极具吸引力。辛西娅·李（Cynthia\
  \ Lee）拥有高性能计算的 `PhD` 学位并在斯坦福大学任教，她记得 90 年代和 200 年代初在初创公司当程序员的时光，她的同事们在年轻时都曾感到被排斥或被误解。最后，他们欣喜不已，这是一个那些该死的伪装者并不会自动获胜的领域！\n\
  \n“对于那些穿着西装或看起来过于精干、打算进入我们技术领域的人，我们有很多怀疑，”她说，“因为他们某种意义上是敌人。在 80 年代关于高中的电影里，他们是受欢迎的孩子，而我们正在创造一个极客的乌托邦。”\n\
  \n翠西·周（Tracy Chou）是一位以在 Quora 和 Pinterest 期间极高产出而闻名的程序员——正如 Pinterest 联合创始人本·西尔伯曼（Ben\
  \ Silbermann）曾向我赞叹的那样，“她是一个绝对的摇星”——她也见过类似的动态。“我认为很多在软件领域获得成功的人，并不是那些在其他商业追求中获得成功的人，”她说，“而在那里，他们想要*拥有*那种成功。”她还指出，编程这种对外行来说晦涩的本质（甚至对同事也是如此）使得关于唯才是精英的神秘主张更容易实现。“这关于代码对大多数人来说不可理解或对大多数人隐藏的事实，”她补充道，“即使它不隐藏，它通常也令人难以理解。所以你更容易躲在‘噢，这是唯才是精英的，如果你懂的话’这种说法后面。”\n\
  \n开源软件世界——代码在网上供任何人查看和调整——通常被视为唯才是精英，因为这完全取决于竞争让你的（通常是志愿的）贡献被项目接受。\n\n考虑开源领域最成功的案例，操作系统\
  \ `GNU/Linux`——通常简称为 `Linux`。就像 `Windows` 或 `MacOS`，它是一个运行计算机的操作系统；与它们不同，它是免费的，任何人都可以下载并检查其\
  \ 2500 万行代码。`Linux` 最初始 1991 年，当时芬兰大学学生林斯·托瓦尔斯（Linus Torvalds）为了好玩决定创建一个自己的操作系统的\
  \ `kernel`。正如他最初在网上发布时写的，它并不会“庞大且专业”。不久，托瓦尔斯运行了一个简单的 `kernel`，并将源代码放在网上供任何其他黑客查看。接着，雪球开始滚动了。很快，全世界的程序员开始写信给他建议为\
  \ `Linux` 添加新功能、提供代码片段或发布漏洞修复。托瓦尔斯采纳了他喜欢的建议（用术语说，他“拉取”他们的代码）。`Linux` 变得越来越强大，全都是世界各地陌生人的贡献。为了让许多不同的程序员能够调整同一个代码库而不会让他们的更改混在一起，托瓦尔斯编写了\
  \ `Git`，这件软件现在也被程序员广泛使用。`Git` 让你拉取他人的贡献，或者在你所做的新更改搞砸一切时，快速恢复到旧的代码版本。\n\n\n\n正如其一些粉丝所言的，开源变成了一种基于优异性的市场竞争——一场比拼谁的想法被认为足够好，以至于其他程序员会同意并认为：`好的，没问题，让我们把这段代码接受到我们的项目中吧`。因此，对许多参与者来说，开源感觉像是纯粹的优提炼。通过\
  \ `Linux`，林瓦尔斯（Torvalds）成为了“仁慈独裁者”，他只接受他认为真正有用且出色的 `Linux` 代码库贡献。从理论上讲，贡献的门槛相当低：只需下载一份\
  \ `Linux` 源码副本，对其进行任何修改——如果你使用 `Git` 管理更改，这些修改将显示在代码的“树”结构中——然后向 `Linux` 核心贡献者发送请求，说：`嘿，看下我的贡献`。如果他们喜欢，代码就会被采纳，从而被全球数百万家公司使用。在实践中，情况比这要复杂一点，但这是大多数开源项目运作方式的缩影。\n\
  \n“你有你自己的妈树，你可以在你的树上做任何你想做的事，”当我 2016 年在波特兰访问他时，林瓦尔斯对我说道。“你可以搞你疯狂的事，如果事实证明你是对的——事实证明你疯狂的事其实并不疯狂——你现在就可以发布你的树并说`看我做了什么`。如果它真的很好，其他人就可以直接拉取（pull）进来。”\n\
  \n事实上，当我与他见面时，林瓦尔斯自己已经很少写代码了。他只是在进行裁决，一位软件界的所罗门：他会坐在他波特兰家中的小办公室里，那那里堆满了电缆和设备（包括一些潜水设备；他是这项运动的爱好者，并自己编写专门的潜水软件），花一一天时间查看最新提交的代码。要触达他，贡献通常必须通过\
  \ `Linux` 维护者的重重考验，这是一群由核心贡献者组成的群体，他们已经向林瓦尔斯以及彼此证明了他们的能力，他们自愿花上几个小时来编写 `Linux` 代码，并对他人的代码进行批判和评估。这个核心圣地拥有的某种惊人的分量和权力。`Linux`\
  \ 现在被计算世界如此广泛地赖以为生存，以至于许多科技公司，包括 `Intel`、`Red Hat` 和 `Samsung`，都让员工成为 `Linux` 的全职或兼职贡献者。成为\
  \ `Linux` 核心贡献者被认为是程序员简历上非常光光的项。\n\n为热门的开源项目做贡献通常是一个提升职业发展的举动，这就是为什么有那么多程序员尝试参与其中。这也是为什么有那么人将他们周末消遣的侧边项目作为开源代码发布在\
  \ `GitHub` 这样的网站上。这让别人看到你工作的乐趣，发现为你自己打造的某个奇特工具对其他人也有用的快乐；此外，你通过查看他人的开放代码并观察他们如何构建东西可以学到很多。程序员还告诉我，他们感到一种生态责任感：他们开源自己的代码——并对他人的项目做出贡献——作为回馈这个帮助过他们的圈子的方式。我遇到的几乎每个程序员在工作中都会使用大量的开源代码；价值数百万的企业通常建立在开源代码之之上。因此，开源包含了一种奇妙的动机组合——一种为了留下印象的亚当·斯密式的竞争，与可能让卡尔·马克思微笑的集体主义理念密不可分地融合在一起。而在这一切中贯穿始终的是一种理想，好吧，代码不会撒谎：如果它是好的，你的同事们会看到并接受它。\n\
  \n“胡扯，总的来说，”林瓦尔斯说，“是非常不受待见的。”\n\n***\n\n这是一个诱人的想法。但一个由超级英雄般人才运行的世界，现实很快就会变得混乱——而且生产效率可能比看起来要低得多，正如乔纳森·Solórzano-Hamilton\
  \ 所发现的那样。\n\nSolórzano-Hamilton 是一位软件架构师，曾与一位自诩摇滚明星的程序员共事。“里克”（Rick）——这是 Solórzano-Hamilton\
  \ 在博客文章讲述这个故事时用化名这样称呼他——在整个公司里以其解决任何人问题的能力而闻名：问问他，他会在办公室的白板上勾勒出一个快速解决方案。他是首席架构师，负责设计项目，也是顶尖程序员，负责产出代码本身。他经常介入提供救命的修复。\n\
  \n这种不可或缺的感觉似乎在里克身上生了根，渗透了他的内心世界，并变得变质了。他开始认为自己是公司的编程超级星，是凌于所有凡人之上的“10 倍程序员”。坚信自己的技能对一切都至关重要，他接了越来越多的任务，越来越多的代码段。\n\
  \n但尽管有里克的工作，项目仍然超过了截止日期。如果一个项目足够大，无论一个人有多有才华，都不可能完成全部。项目整整延后了一年，经理们意识到两年内不太可能准备好。里克偏执地试图成为唯一的英雄；糟糕的是，他的经理们似乎纵容了他的自我神化。\n\
  \n“里克的产出速度比任何时候都快，”Solórzano-Hamilton 写道，“他每周工作七天，每天十二小时。每个人只有里克能把团队从这种困境中拉出来。每个人屏息以待，等待里克发明出奇迹般的疗法来修复这个残废了的项目。”与此同时，由于工作过重，他变得越来越暴躁易怒，并与他人隔绝。\n\
  \nSolórzano-Hamilton 被要求帮忙看看项目是否还能挽救。与里克的会议进展并不顺利。“你们永远无法理解我的创造，”他咆哮道，“我是阿尔伯特·爱因斯坦，而你们都是在地上乱爬的猴子。”\n\
  \n然而，当 Solórzano-Hamilton 查看代码时，他意识到这些代码是如此个性化且缺乏文档，以至于其他人无法维护。他们与里克交谈，告诉他们想从头开始构建新产品，让大家共同参与。里克愤怒地拒绝了这一点。随着情况恶化，里克拒绝休假，他回滚他人写的代码，并贬低同事。最终他们解雇了他。接着，看吧，情况好转了：同事们开始构建一个简单得多的新产品。当他们完成时，替代产品的大小和复杂程度只有之前项目的\
  \ 20%。这意味着新雇主更容易阅读、理解和维护它。他们不需要超级英雄了。更好的是，同事们在六个月内就搞定了。“团队中不再有里克了。我们没有任何从头开始构建的疯狂天才。但我们的生产力从未如此之，”Solórzano-Hamilton\
  \ 写道。\n\n这家公司完全撞上了崇拜程序员优异性的负面影响：它会创造出“天才型大混蛋”，一群开始相信自己不可替代的程序员。你会遇到一些气焰横生、自大大的家伙，他们不仅赶走了其他人才，而且往往产出的东西——讽刺的是——根本没用，因为这些东西完全锁在他们自己的脑子里。当然，他们的才华可能是真的，但当他们的个人崇拜破坏企业时，谁还在意这些呢？\n\
  \n\n\n\n才华横溢的混蛋并不一定值得留恋，因为他们在解决棘手的、短期问题时可能很有用，但他们对士气造成的破坏可能是很难修复的。其他有才的员工会逃离，不愿与这些混蛋打交道。“我遇到过一些最顶级的程序员，但他们做出的东西永远无法见光，因为没有其他人能和这些人一起共处，”IBM\
  \ 资深程序员 Grady Booch 告诉我。\n\n即使是像 Rick 这样的 `10Xers`（十倍效率人才）高效时——如此快地编写如此大量的软件——往往也会产生人们用一个美妙说法所说的“技术债”：即由于移动速度过快而产生的一堆残骸。一个追求速度极快的程序员几乎总是走捷径，并采用补丁式的解决方案，这在未来的几年里将需要后来的同事进行仔细且耐心的清理。“10\
  \ 倍工程师的生产力实际上并没有比其他人高 10 倍，”我的朋友、开发者 Max Whitney 说，“一个 10 倍工程师就在那里——我引用的是网上的一句话——为每个人创造了\
  \ 10 倍的工作量。所以，他们就像冰山一角，制造了一些华丽漂亮的东西，却在到处留下了大量的技术债。”\n\nAndreessen 指出，程序员热爱创建初创公司的原因之一是他们可以快速行动。但即便在这里，早期的英雄也可能创建混乱的代码库，这些代码的运行程度仅足以获取早期用户，很快就需要更有耐心的程序员来清理，为混乱带来秩序。\n\
  \n当 Tracy Chou 被聘用到 Pinterest 时，她领导了其后端的大规模重写。在翻阅代码库时，她发现了一些奇怪的事情：每当用户搜索一个术语时，服务器都会运行两次查询。“那是怎么回事？”她想。Chou\
  \ 最终发现，创建查询的代码被不小心复制并粘贴了两次。似乎在 Pinterest 成立早期，某人工作得太快了。通过删掉那一行误的错误代码，Chou 将 Pinterest\
  \ 搜索的效率翻了一倍。很多时候，真正的“十倍效能”并不在于编写代码，而在于修复他人的失误。\n\n***\n\n`10xing` 这种想法中最具隐蔽性的问题在于，它神话化了一种除了年轻白人男性之外，几乎没有人可以幸脱的行为。\n\
  \n毕竟，回想那些不洗脸、不洗澡、头发凌乱的键盘侠的故事，他们如此“芬芳”得让同事不得不把他们拖进淋浴室：“你能想象一个女性能逃过这种命运吗？”曾在 Wikimedia\
  \ 基金会运行了近七年的 Sue Gardner 告诉我。\n\n著名的 `Python` 开发者 Jacob Kaplan-Moss 讲述了一个故事，他在会议上目睹一名学生展示她关于预测堪萨斯河季节性洪水的的研究成果。她使用了大量的语言和工具来实现这一点，从\
  \ `Python` 到 `PostgreSQL` 再到 `GeoDjango`。他对此留下了深刻印象，事后走向她，询问她是否想去他的公司面试职位。她拒绝了，说自己“并不\
  \ true 是一个程序员”。\n\nKaplan-Moss 感到震惊了。但他认为，这恰恰是崇拜摇星式编程的问题所在。从纯粹客观的角度来看，这个学生是非常了不起的，她自己组装了一套分析卫星数据的自定义系统。但她内化了行业的一种陈调，即只有“真实”的程序员才是那些邋遢、头发凌乱、与键盘进行赛博融合的类型。“在这个神话中，编程是你的一种身份，而不是你所做的事情，”他总结道。\n\
  \n作为时代的缩影，硅谷的精英治理理想近期饱遭了更多的审视。考虑 `PayPal` 的案例：它确实是 Levchin 及其那群精干、高强度的开发者、设计师和营销人员通过明智且不懈工作的典范。毕竟，许多其他支付系统都失败了。`PayPal`\
  \ 坚持了下来。早期的员工最终变得富有且有影响力；这家公司催生了所谓的“PayPal 黑手党”（PayPal Mafia），这是一群百万翁，他们在投资下一代科技公司（如\
  \ Facebook 和 Uber）时变得更加富有和更有影响力。\n\n但正如《乌托邦》的作者 Emily Chang 所指出的，`PayPal`——像许多早期初创公司一样——根本不是许多创始人所声称的那种纯粹的精英治理。其一，公司并非完全是根据人的才华来招聘的。恰恰相反：Levchin\
  \ 和 Thiel 挑选了与他们相似的人，“以使我们的早期员工在个人上尽可能相似，”正如 Thiel 在他的书《从零到一》中写道。他们利用母校和友谊网络寻找对政府持怀疑态度的年轻极客。“我们都是同一种类型的极客，”Thiel\
  \ 写道，“我们都喜欢科幻小说：《加密货币》是必读目，我们更喜欢资本主义的《星球大战》而不是共产主义的《星际迷航》。重要的是，我们都痴迷于创造由个人而非政府控制的数字货币。为了公司的运营，人们长什么样或来自哪个国家并不重要，但我们需要每个新员工都同样痴迷。”在原则上，当然，这些\
  \ `PayPal` 员工可以来自任何国家或任何行业。但在实践中，他们撒出的网小得惊人，捕捉了一群主要是年轻、白人、男性且受过良好教育的人群。你可以称他们的招聘策略为一种快速组建团队的深度务实的方法，这种团队具有极好的凝聚力。但这绝不是一种盲目的、认为“人才是唯一标准”的精英治理。\n\
  \n\n\n\n\n正如张（Chang）所指出的，PayPal 曾拥有极大的运气；如果没有几次巨大的运气转折，它本可以轻易被摧毁。如果它比现在晚几个月才尝试融资，它就会撞上“互联网泡沫”，那时投资者们会突然收紧钱袋子。但当命运向你这一方倾斜时，自我神化就变得轻而易举，尤其是——坦率地说——当像我这样的记者跑来寻找“孤独天才”的故事时。“在一个步蹒跚的半盲人手中发生的不可思议的横财，变成了笃定的远见者不可避免的胜利，”前\
  \ Facebook 广告技术员工安东尼奥·加西亚西亚·马丁内斯在他的著作《混沌猴子》（*Chaos Monkeys*）中调侃道，“世界封你为天才，而你也开始表现得像个天才。”\n\
  \n即使是开源世界，观察越深入就越不像是一个优胜制社会。毕竟，它的基础是代码人员有大量的空闲时间投入志愿者劳动。这对于时间充裕的年轻人来说非常有效，但对于那些很有编程天赋但有更多现实责任的人来说就没那么了。“优胜制说‘你的\
  \ `GitHub` 就是你的简历’，然后他们对自己的候选人库中没有许多没时间捣鼓业余项目的单身妈妈感到惊讶，”开源浏览器 `Firefox` 的前总经理约翰坦·奈廷廷格尔（Johnathan\
  \ Nightingale）写道。他指出，`Firefox` 也是如此。运行 `Firefox` 的公司 `Mozilla` 有一位女性创始人，“但我们的‘优胜制’仍然挤满了长得跟我非常像的人。”`GitHub`\
  \ 进行的一项调查发现，95% 的受访者认同为男性；3% 认同为女性，1% 认同为非二性别。尽管可靠的数据难以获得，但其他关于参与开源项目的女性人数的调查和估计似乎发现这一比例在\
  \ 10% 或更低。\n\n更直接的是，许多女性报告过在开源会议上遭遇过直接的骚扰或攻击。即使在网上，参与 `Linux` 等项目也可能需要人们忍受言语嘲讽的风暴，特别是如果你触犯了托瓦尔兹（Torvalds）本人，他长期以来以给他认为表现得像傻子的贡献者写愤怒的邮件而闻名（“请现在去死吧。世界会变得更美好，”正如他在一封示例邮件中写道；另一封中则是“闭你妈的！”）。他对他的邮件的一项分析表明，他对女性并没有比对男性更恶毒。但托瓦尔兹最终也决定，他的行为是\
  \ `Linux` 社区的一个问题：2018 年 9 月，他暂时辞掉了“仁慈独裁者”职位，以“获得关于如何理解人类情感并做出恰当反应的帮助，”正如他所写。\n\n\
  人们可以像一些程序员那样回答说，这类项目中女性和少数族裔比例低——或者在硅谷的初创公司中，如早期的 `PayPal`——也只是优胜制的一种功能。也许女性天生就不那么擅长这项学科。对这个问题的简短回答是否定的。更长的回答将在下一章中讨论，“ENIAC\
  \ 女孩们消失了”。\n\n***\n\n### 科技领域的自由意志主义倾向\n\n程序员和技术人员（尤其是在美国）有着倾向于自由意志主义的声誉——我们在这里将其非常松地定义为：相信每个人都要对自己的命运负责，政府监管通常会扼杀自由，并且让最优秀的人通过自己的努力崛起最符合社会利益。\n\
  \n为什么？部分是因为一些标志性的科技 CEO 拥护的自由意志主义立场如此激进，以至于听起来就像是摸猫的邦德反派。彼得·蒂尔（Peter Thiel）也许是这种现象最为人知的例子，他对自己厌恶“没收性税收”如此投入，以至于曾探索过“海上扩张”（seasteading）的可能性——在疲惫的肉身与钢铁巨头范围之外创建一个浮动城市。他还宣称：“我不再相信自由与民主是兼容的。”还有\
  \ `Uber` 的前 CEO 特拉维·卡拉尼克（Travis Kalanick），他曾在 `Mahalo` 网站的问答板块中争道，加州是一个可怜的伦理泥沼，充满了靠着富人战果生存的寄生虫。“我发现的一个有趣统计是，加州\
  \ 50% 的税款是由 14 万人支付的（一个拥有 3000 万人口的州）。这这让我深有同感，因为我刚读完《客观物主》（*Atlas Shrugged*）。如果加州的这\
  \ 14 万富人选择‘罢工’，加州就完蛋了……这是另一个原因，你不能不断增加税收来支付那些提供糟糕服务且无法负责的政府计划。”\n\n当然，科技领域的*任何人*都是自由意志主义者，这有着深层的讽刺——甚至是幽默感，因为整个美国行业都是建立在政府耐心资助的创新之上的。如果没有军队大批量购买早期芯片，整个行业可能早已胎死了。联邦政府还为科技发明的某些基础性原创工作支付了费用，如关系型数据库、密码学、语音识别，以及最重要的互联网协议本身。（如果你喜欢今天的\
  \ AI，请感谢加拿大政府。多年来他们投入大量纳税人的资金，帮助该国公立大学支持关键的深度学习研究，而当时那种风格的 AI 在全球范围内受到冷落。）当 `R&D`\
  \ 杂志调查 1971 年到 2006 年的顶级创新时，他们发现 88% 的创新是由联邦研究资金资助的。这些领域没有一个没有获得自由市场的充分资金。需要政府那种缓慢的、长期的耐心，才能产生核心发明，让我们能够拿着手机并订一辆卡拉尼克的\
  \ `Uber` 车。\n\n### 区块链与现代抗议\n\n尽管如此，某些程序员的自由意志主义抗议仍在继续。近年来，区块链技术一直是科技界反政府热忱的最新阵地。从\
  \ `Bitcoin`（比特币）——一种专门设计用于创建不受中央银行印钞控制的货币——到 `Ethereum`（以太坊）——创建“智能合约”的方式，其支持者希望这种方式能让商业变得如此无缝且去中心化，以至于律师都是多的：一旦有人履行了你约定的服务，数字货币就会进入他们的数字钱包。对加密货币社区的一项调查发现，足有\
  \ 27% 的人自称为自由意志主义者，是皮尤研究中心在普通人口中发现的比例的两倍多。\n\n\n\n\n谷歌的彼得·诺维格（Peter Norvig）自 70\
  \ 年代起就开始编写程序，他补充道，自由意志主义可能也取决于程序员的相对富裕程度：“我认为每一个拥有一份程序员工作的人都过着舒适的生活，这意味着对于他们中的一些来说，这种自由意志主义的方法很有吸引力，因为他们说：‘让我们让政府离远点吧。没有政府我也过得很好。因此，其他人没有政府也会过得很好。’当行业内出现关于性别歧视的讨论时，`Blind`\
  \ 平台（一个仅限顶尖科技公司员工的匿名讨论应用）上的帖子抱怨道，这些技术人员竟然不屑于讨论这类社会正义的话题。‘我们能回到那个硅谷属于书呆和极客的时代吗？那才正是我申请[加入]\
  \ `Google` 并来到美国的原因，”其中一位作者写道，“我的意思是，这个行业曾是对我们这类人的避风港，为什么现在变得这么该死的复杂。’”\n\n问题在于，这种自由意志主义的声誉可能并不名副其实。\n\
  \n最近，两位斯坦福大学的研究人员和一位记者对这个问题产生了兴趣，并进行了一些有趣的研究。正如他们所指出的，从纯粹的党派立场来看，硅谷居民倾向于投票并向民主党候选人捐款。事实上，在\
  \ 2016 年总统大选中中，大型科技公司员工捐给希拉里·克林顿的钱数是唐纳德·特朗普的 60 倍。当特朗普获胜时，许多公司的员工陷入了近乎哀悼的情，正如我在那周访问该城市时感受到的那样。\n\
  \n为了收集有关政治态度的硬性数据，研究人员调查了近 700 名高科技创始人和首席执行官。在调查的一部分中，这些科技领袖被要求评价他们多大认同一段自由意志主义理想：“我希望生活在一个政府除了提供国防和警察保护外什么都不做的社会里，这样人们就可以不受干扰地赚他们能赚到的钱。”\n\
  \n有趣的是，只有 23.5% 的人同意这一点。这远低于共和人的平均同意率（62.5%），而且也低于民主人的平均同意率（43.8%）。换句话说，令人惊讶的是，这些科技创始人和高管比`普通的`民主党人更不容易认同基本的自由意志主义理念。研究还发现，科技人士在世界观上是极端的全球主义者，有\
  \ 44% 的人（高于其他群体）同意“贸易政策应优先考虑海外人士的福利而非美国人”。他们支持许多经典的再分配主义税收和支出政策：82% 的人支持单一支付医疗保健，即使这意味着加税；75%\
  \ 的人支持将联邦资金用于仅惠及贫困人的计划。几乎所有人都支持同性婚姻，82% 的人倾向于枪支管制。“换句话说，”研究人员在他们的论文中总结道，“科技企业家并不是自由意志主义者。”在许多方面，他们只是传统的加利福尼亚左翼思想者。\n\
  \n但有一个大例外：对企业行为的监管。\n\n科技创业者强烈反对任何决定他们如何经营业务的政府规则。他们不喜欢任何规范员工聘用或解雇的规定；他们希望看到工会和有组织的劳动力量的影响减少。高达\
  \ 82% 的人认为解雇员工太难了，应该改变规定使其变得更容易。他们也比普通公民更不倾向于对企业行为做出伦理判断。当被给出“溢价定价”的案例时——包括 `Uber`\
  \ 在需求量大时突然提高打车价格，或者花店在节日期间突然加收花卉费用——远超过 90% 的人表示这两种情况下都是可以的。这让他们与民主党和共和党都脱节了，因为后者的认可度要低得多。（只有\
  \ 43% 的民主党人和 51% 的共和党人认为 `Uber` 的溢价定价是公平的；分别有 61% 和 58% 的人反对花卉溢价定价。）\n\n换句话说，科技创始人和首席执行官是一类奇特的政治混合体：在税收和支出或民权方面像民主党人一样自由，但在企业监管方面又与共和党保持完全一致。“这不是一个简单的画面，”斯坦福大学政治经济学教授尼尔·马尔霍特拉（Neil\
  \ Malhotra，该研究的三人组之一）他告诉我。\n\n如果我们想将其汇总，可以将科技创始人看作这样的人：他们意识到人们可能会掉入资本主义经济的缝隙——甚至这种“颠覆”也会给普通人\
  \ Joe 和 Jane 的生活带来毁灭。但科技领袖自己也虔诚地致力于创造这些颠覆：`Amazon` 的在线销售导致当地商店关门；`Uber` 和按需世界产生了一大片不可靠的“零工”劳动力；自动化摧毁了整个职业类别，例如法律助理。尽管如此，科技创始人从根本上认为，才华、荣誉和创新（至少按照他们的定义）不应受到任何限制。因此，他们通过支持再分配政策来解决这个难题，试图让疯狂的颠覆变得模糊地可以生存。因此，他们支持全民医疗保健——甚至是全民基本收入，这在科技会议上是一个备受推崇的话题。他们乐意通过税收分享部分财富，但希望确保没有事情能阻止他们积累财富的过程。他们认为从根本上说，他们知道什么对社会最好：正如哲学家兼技术专家伊恩·博格（Ian\
  \ Bogost）所说，他们的观点是“信任我们”。当然，这是一种让他们政治权力完好无损的分配观点。从极少数富有的 1% 人阶层那里获得救济的工人，不太形成任何对抗科技巨头权力的强有力制衡。\n\
  \n\n\n\n例如，考虑 Dropbox 刚刚完成的一项巨型编码项目：创建他们自己的个人云存储系统。多年来，他们一直通过租赁亚马逊庞大的云空间来存储文档。但随着\
  \ Dropbox 规模不断扩大，使用亚马逊的云开始引发关于成本、效率以及 Dropbox 自定义技术便利程度的问题。于是，休斯顿（Houston）找了两名程序员来领导这项“登月计划”式的项目，为他们自己的云编写代码。这套代码必须同步成千上万块硬盘，将它们缝合在一起作为一个整体，且不能丢失任何一个文档。休斯顿需要两位摇滚星。\n\
  \n他需要的那两位已经在公司内部。一个是詹姆斯·考林（James Cowling），一个高个、口才流的澳大利亚人，休斯顿在考林于麻省理工学院读硕士及后博士学位时见过他；在加入\
  \ Dropbox 之前，考林专门研究“高度分布式系统”。另一个是杰米·特纳（Jamie Turner），一个像熊一样、留着胡子且幽默感十足的程序员。他曾去加州大学大学学习英语，但为了找份编程工作而辍学，后来加入了\
  \ Dropbox。\n\n“所以，杰米是个大学辍学生，有初创经验，”考林告诉我。\n\n“我实际上是做过实事的，而不仅仅是想过！”特纳回答道。\n\n起初，这个项目完全是那种英雄式的、10\
  \ 倍效率的场景，仿佛出现在俗气的黑客电影里。他们设定了一个目标：在六周内重写系统核心，甚至在墙上挂了一个时钟，带有威胁性地对着截止日期倒计时。他们每天拼命工作\
  \ 16 小时，在晚上 11 点左右休息一下，去 Dropbox 的音乐室弹琴。“有整一个月多半的时间里，我们基本上没睡过觉，”考林说。\n\n“我曾一度忘记了孩子的名字，”特纳补充道。\n\
  \n“他们也忘了你的名字，”当时 Dropbox 工程总监的杰西卡·麦凯勒（Jessica McKellar）开玩笑说。当团队终于完成时，麦凯勒告诉我，他们沉浸其中太久，以至于难以重新回到正常的工作节奏：“他们不知道该自己忙什么。”代码运行良好。他们已经想出了如何构建一个云。\n\
  \n但那种早期的爆发、那种敲击键盘的疯狂呢？那只是快速阶段。正如纽豪斯（Newhouse）的发明一样，漫长而缓慢的部分是现在扩大项目，让更多 Dropbox 的工程师加入，他们现在将与代码紧密接触，对其进行测试、改进并使其稳定，成为该领域的专家。考林和特纳必须阐述他们的设计原则，以及他们为什么要这样构建。如果他们像自己说的那样“被车撞了”，系统也能继续运行。“在英雄主义的文化中，你会因为英雄主义获得奖励，”特纳指出，“但归结底，你的工作应该是消除这种英雄主义。”\n\
  \n当我们吃饭边聊天时，他们和纽豪斯一样，对整个“10 倍效率”的想法不屑一顾。“那个‘摇滚星级工程师’的概念，我不喜欢那个词，”，”考林皱着眉说。他认为，很多人都会写代码。很多人都能做原型。但软件公司做的最重要的事情并不是编码。它在认知阶梯的更高处。是决定构建什么种类型的系统：它应该做什么，不该做什么；你的客户需要什么，不需要什么；使用哪种架构，如何真正实现这个项目。“当程序员就像搬砖工，我们都是搬砖工，我们都写代码，”考林说，“但如果你想盖摩天大楼，你不会说：‘快，给我找世界上最伟大的搬砖工！’你会说：‘给我找一个建筑师和能组团队的人。’”\n\
  \n第二天，考林和我走到他的办公桌旁，那里放着一块巨大的白板，上面满了描绘云系统各个部分的流程图。他与 Dropbox 的程序员、设计师和项目经理都花大量时间挤在白板旁，试图决定：Dropbox\
  \ 的某一部分如何与其他部分交互？Dropbox 的 iPhone App 如何从云端请求文件？那些服务器应该如何返回回复？\n\n“人们认为程序员在写代码，但我们花了很多时间在会议上，”考林笑着说。他用绿色的记号笔夸张地对着白板挥了挥，“那才是我们大部分时间在做的事！坐在一起想该做什么，为此争论！”纽豪斯表示赞同，并指出了顶尖程序员的一个巨大讽刺：他们的技艺越精湛，就越可能擅长规划和可视化大型项目的宏观架构，想出如何将其拆分成小块，并激励团队成员去完成。当然，你在这方面做得越好，你自己写的代码就越少。你进入编程领域是因为你热爱创造；但如果你真的非常擅长创造，你最终会变成一名经理，帮助别人做那些有趣的事。\n\
  \n“这就像律师，”纽豪斯开玩笑道，“他们以为自己要去打官司。”\n\n***\n\n... ... ...\n\n 10 倍效率的程序员可以产生惊人的东西。\n\
  \n但 1 倍效率的人呢？或者 1/100 效率的人呢？\n\n丹尼斯·克劳利（Dennis Crowley）在这里是一个有趣的测试案例，因为他直言不：“我是你见过最糟糕的程序员。”\n\
  \n回到 20 世纪 90 年代中期，克劳利是一个对技术和文化着迷的年轻人。他喜欢去下酒酒吧沉浸在音乐中，他也梦想着在科技行业工作。但每当他尝试学习编码时，都会失败得惨不忍睹。在读于雪立拉斯大学期间，他告诉我，“我真的很想学习计算机科学。我上了一门入门课程，但我表现糟极了。我写不出任何可以编译的代码。”分配变量，让函数互相调用；这一切完全不合逻辑。他最终决定放弃。最多他只是折腾一些简单的网页：“在互联网上放图片就是我能做的全部。”\n\
  \n毕业后，克劳利来到纽约，在名为 Jupiter Communications 的咨询公司工作，在那里他采访科技公司并撰写市场报告。但他仍然渴望那种创造的感觉，而不仅仅是在旁边写写。他晚上会和朋友一起穿梭在城市的酒吧和夜俱乐部，在那个短信还是新年代——他们整晚互相发短信，描述他们在哪里，做什么。但在短信的早期，朋友之间的连接和寻找彼此的能力受到限制，因为手机只能给同一运营商的手机发短信。克劳利注意到了这种低效率，并想制作一种工具，跨网络连接朋友的朋友。他们都读过《哈利·波特》，知道“罗罗地图”，那张显示霍格学校每个人位置的魔法地图。\n\
  \n“那是软件作为超能力的想法，”他说，“如果你是一个超级英雄，你可以看穿墙壁，也能看到转角。”他想象了当朋友可以看到彼此在纽约穿梭酒吧中的轨迹时，会产生那种浮动的社交感知。你可以看到彼此醉酒后的足迹，甚至当你查看手机发现一位同事就在两个街外的夜俱乐部时，你们可以面对面会合。\n\
  \n1999 年，克劳利咬紧牙关，从工作同事的桌子上借了一本关于 Active Server Pages 编码语言的红色手册。在接后的两年里，通过痛苦的尝试和错误，他学会了足够让代码运行的知识：首先是一个城市指南，然后是他最初愿景的原型——一个可以从一个朋友手机向另一个手机传送信息的简陋服务器。“它并不漂亮。它几乎无法运行，”他补充道。但这让他那那一小群朋友窥见了可能性。这些项目也帮助他在\
  \ Vindigo 找到了下一份工作，那是一家为 PalmPilot 制作城市指南的公司。\n\n\n\n\n然而，按照大多数标准来看，Crowley 的编程水平糟糕得令人吃惊。Vindigo\
  \ 的工程师们知道 Crowley 做了一个原始的短信警报应用，并对此很感兴趣。他们提议培训他，让他成为一名“真正的 C++ 程序员”，但在经历了几个徒劳的月份后，他们得出他永远学不会结论。他被解雇了，而那时，大部分互联网行业在互联网泡沫破灭中消云散。有了额外的空闲时间，Crowley\
  \ 继续改进他的基于位置的原型。他曾决定在 `MIT’s Media Lab` 攻研究生，但他们没有录取他；他匮乏的编程技能低于他们的最低要求。不过，他也申请了纽约大学的交互式电信计划（ITP），这是一个以招收中途人士闻名的高科技项目——这些人中有时是艺术家，有时只是想转行科技领域的人——并赋予他们足够的技术专长来制作出生动、奇特的科技项目。\n\
  \n参观 ITP 是一次令人惊喜的冲击。学生们都在创作富有创意且奇独特的作品——一台“远程拥抱”机器、可以吐出算法生成诗歌的小型打印机、以及根据你跳舞风格显示\
  \ LED 模式的鞋子。他们是代码的业余爱好者，只学习让这些奇幻项目运行所需的最少知识，仅此而已了。他们会剪贴一段代码片段，根据自己的需求进行轻微调优，然后点击\
  \ `compile`。“你们不担心写出最优雅的代码吗？”他惊讶地问他们。“我不知道我在做什么！它就是能跑通了！”他们愉快地回答道。*这些都是我的同类人*，他想：整个校园挤满了不在意编写超优化软件的人们，但尽管如此，他们正在创造有趣的东西。\n\
  \n他在 2002 年入了 ITP，并与同学 Alex Rainert 联手。他们清理了 Crowley 原型的灰尘，用一种更现代的语言 `PHP` 重新编写了它，并将其与其他\
  \ ITP 的学生分享。从代码角度来看，它仍然没什么大不了：Crowley 回忆道，那是“1,000 行 `IF-ELSE` 语句”，像一个由重复命令组成的巨大毛线球。但它运行很稳定，两人继续埋头苦干，直到\
  \ 2004 年他们将其发布供公众广泛使用。\n\n他和 Rainert 将该服务命名为 Dodgeball，一年之内，成千上万的城市文青就发现了它怪的乐趣。两人逐渐增加了新功能，例如列出五个“暗恋对象（crushes）”，被暗恋的人可以选择性回复，这几乎是\
  \ Tinder 的雏形。（事实上，确实有人开始和在 Dodgeball 上结识的人交往。）很快，评论人士开始思考这种年轻人广播自己物理位置的疯狂的新高科技行为。在对自己的想法苦钻研多年后，Crowley\
  \ 本质上发明了“签到（check-in）”。\n\n到 2004 年秋季，Dodgeball 的人气足以让 Google 的高管产生了兴趣。他们邀请 Crowley\
  \ 和他的伙伴来到 Google 位于纽约时代广场的办公室。他们的首要任务是让 Google 的高级工程师对 Crowley 他的伙伴进行技术面试，以评估他们的技能水平；随后他们将审查\
  \ Dodgeball 代码的质量。\n\n文化的碰撞几乎是喜剧性的：世界上最顶尖的工程师正在与能力最平庸的人聊天。一位 Google 面试官是 Orkut Buyukkokten，一位出生于土耳其的程序员，他发明了当时由\
  \ Google 所有并运营的、以他命名的社交网络服务。Crowley 回忆被要求解决一些经典的 Google 面试工程谜题，那些他们假设大多数斯坦福或哈佛的计算机科学毕业生都会的题目。“*你在下东区弄丢了钥匙，*”他们问他。“*你会写什么样的算法，你会如何规划街道，以便在不重复经过同一条街道的情况下找到你的钥匙？*\n\
  \n“我完全没头绪，”Crowley 承认道。“我不知道在说什么。我从没上过编程课！”\n\n最终，面试官放弃了算法问题，开始询问关于 Dodgeball 本身的问题。“运行它需要多少钱？”“一千九百十九，”Crowley\
  \ 说。“好吧，每月 2000 美元。“不——19.99 美元，”Crowley 纠正了他们。\n\n最后，在几个月的求职过程中，Google 的工程师梳理了\
  \ Dodgeball 代码。正如 Crowley 回忆的那样，他们通常感到震惊。“他们看着那些 `PHP` 代码就像在说：‘这太疯狂了。’那不是《美丽心语》式的疯狂！而是像是‘你真是个傻瓜’式的疯狂。反正感觉就是那样的。”Crowley\
  \ 告诉他们他知道这很糟糕、效率低下、写得凌乱。“对于其他在学校受过教育的程序员来说，这完全没有意义。但我想：‘我不知道还有其他方法。这是我唯一知道的办法。’”\n\
  \n但 Crowley 说，最终 Google 的工程师对他和 Rainert 构建的东西留了相当大的尊重。当然，他们在代码能力上可以甩 Crowley 几条街，而且他们有成千上万个。如果给这些工程师一个编程挑战，他们可以轻松解决。他们可以优化排序算法，使其在\
  \ 15 毫秒内执行而非 150 毫秒；这是由一个“10 倍程序员”实现的 10 倍提升。但 Crowley 拥有同样强大、甚至更强大的东西：一个像 Dodgeball\
  \ 这样大胆、疯狂的新想法。他有一种独特观察世界的方式，在穿梭于各个酒吧之间时，注意到朋友们分享他们在这座迷人的、如迷宫般的城市中旅行经历所带来的快乐。你可以称他为一名\
  \ 1 倍工程师甚至更糟，但嘿——他发明了一种新的日常行为类别，签到。\n\nCrowley 现在经营着 Foursquare，这是他在 Dodgeball 之后创立的公司。有一天，我去\
  \ Foursquare 的食堂吃午餐，Crowley 坐在他的员工周围，这些员工在技术上比他疯狂得多。每当他们中有人把旧的、作废的 Dodgeball 代码转发到公司内部消息平台时，工程师们就会惊恐地退缩，感叹那是多么糟糕。他告诉他们，这是一个关于好想法价值的教训。\n\
  \n# 7. ENIAC 女孩们消失了\n\n为什么编程对女性往往如此不友好？\n\n这是 Cate Huston 在担任 15 年程序员期间经常思考的问题。她在她在苏格兰的一所寄宿学校时就开始黑客活动，然后去爱丁堡大学学习计算机科学，在那里很快就毫无意料地发现那里是一个男人的世界；她的计算机科学课上没几个其他女性。但这并没有阻止她。她渴望编程中那些奇特的、令人头晕的挑战，比如“实习期间，我不得不为摩托罗拉手机上的一个应用实现自己的浮点数学计算。”她退学并在\
  \ 2011 年加入 Google，帮助编写 Google Docs 和 Google Plus 等产品的移动端和平板端应用。\n\n\n\n表面上，Google\
  \ 自诩为一个“友善”的职场，高管们兴致勃勃地谈论包容性和多样性。但当哈斯顿（Huston）在 2011 年加入时，她发现许多大部分为男性的同事可能非常冷淡且迂腐，有些人甚至显然坚信女性不适合写代码。有一天，她请教一位同事如何在安卓设备上挂载硬盘来拍照；对方的回答是发给她一些代码，“这是我两年前当实习生时写的，”他有些不耐烦地补充道。（不过他也已经晚了；她已经想出办法了。）\n\
  \n在“代码审查”（code reviews）期间——即同事们互相评估代码并提供改进建议——男同事们会花几个小时时间对她代码中的微小细节吹毛求疵，或者皱着眉说`我我会换一种方式做`。（她说道：“而且我懒得去研究并发现，他们那种做法是行不通的。”）一位同事对她的代码充满了无尽的敌意——并在代码审查期间极具攻击性——以至于她说，她的经理禁止那家伙与她单独会面或在邮件中不抄送经理的情况下发给她邮件。“到那时，这种情况发生得太频繁了，对我来说似乎很正常，”她补充道，“但我的经理说‘不行’，这是不可接受的。”事实上，她太习惯了被那些男程序员们训斥，以至于担心自己正在模仿他们的行为。“我在想，*我的*代码审查之所以通常很刻薄，是因为我学会了那样进行代码审查，因为这些家伙曾那样对我做过。”)\n\
  \n尽管如此，实际的编程工作仍然很有趣。她参与了 Google Plus 移动端界面的编程，这在当时是公司的一款备受关注的产品。她的许多同事非常友好且尊重，她试图把注意力放在他们身上。但随后，一些评论会毫无征兆地让她大为震惊。“女性应该待在厨房，而不是写代码，”一位程序员这样告诉另一位女性\
  \ Google 员工，那是她的朋友。“女性根本不*喜欢*写代码，女性只喜欢漂亮的东西，”其他人也这样对她说。还有那种“亦敌亦友”的心理博弈，以及暗中的破坏。她去上班时发现一位同事为她写了一段代码（“只是想帮你节省时间！”）；她眼睁睁看着女性同事被撤出某个项目，理由竟然是：“看，我知道这个项目其实不符合你的风格。”\n\
  \n她真的能力不足吗？从尽可能客观的标准来看，事实并非如此。她从上级那里获得了非常完美的评价。但这些年轻男同事传出的信息就像持续不断的背景辐射：*我们并不真的认为你适合待在这里。*当有人指出\
  \ Google 工程师中女性仅占 15% 时，他们会辩解说，额，这可能是遗传的。Google 是一个精英治理机构；他们只招最优秀的，对吧？如果他们不招女性，那一定是因为女性缺乏足够的先天逻辑或毅力。\n\
  \n此外，还有真实的赤裸骚扰。一位同事当着她的朋友面称她“臭逼”（cunt）；尽管 Google 对她的投诉采取了一些行动，但头来，她觉得他们处理得不够认真。然后另一家公司的技术人员在飞往会议的飞机上调戏她——“他把我当成了机上娱乐的一部分，”哈斯顿说。还有另一个\
  \ Google 办公室的程序员会持续地跟踪年轻女性实习生，以至于一位女性 Google 员工向办公室里的女性发了一份备忘录，提醒大家他在访问期间要提防他：“请远离他。”\n\
  \n“对我来说，发现其他女性在洗手间哭泣很正常——而*我*每周在洗手间哭一次也很正常。”她甚至枯燥地提到，她开始寻找新工作，希望每天能居家办公一天，这样她至少可以私下完成每周一次的崩溃。“对我来说，在工作时哭泣太正常了，以至于我决定在找工作时*针对这一点进行优化*，”她用尖锐的幽默感说道，“我不想再在洗手间哭闹了！我想在自己的沙发上哭，并在事后可以使用我的\
  \ Clinique 产品来修复状态。”\n\n三年后，她进入了职业中期，她厌倦了被低估的感觉。哈斯顿逃离了 Google，后来被聘为 Automattic 的移动开发负责人，该公司是使用\
  \ WordPress（一种流行的开源博客软件）构建博客应用的公司。当我与她交谈时，她在那里工作了一年，管理着一个 25 人的团队，她觉得那里像是一股清风。她的老板、WordPress\
  \ 联合创始人马特·穆伦格（Matt Mullenweg）曾积极招募了她；公司里许多女性担任高职。此外，WordPress 的代码全都是开源的，所以文化没有像\
  \ Google 那样自以为无一切。而且，嘿，没人叫她母狗了！\n\n“我只是喜欢写代码，”她半带明亮、半带忧伤地说道。\n\n计算机编程在高风险、高压力的职业工作世界中是一个奇怪的异类。在过去的几十年里，女性在许多此类领域的数量增长迅速。在\
  \ 1960 年，女性仅占律师的 3%；到 2013 年，这一比例达到了 33%。在同一时期，女性医生和外科医生的比例从 7% 增加到 36%。在科技的许多领域，也是同样的情况。女性生物学家的占比为\
  \ 28%，到 2013 年完全达到了 53%；化学家的占比也从 8% 上升到今天的 39%。\n\n一个大例外？计算机编程。回到 1960 年，计算和数学专业人员（在美国统计中被归为一类）中女性占\
  \ 27%，这个数字一直上升到 1990 年达到 35%。但随后趋势反转了——开始下降。到 2013 年，女性的参与率回到了 26%。几乎所有其他技术领域的女性人数都在增加。编程是唯一一个倒退的领域。\n\
  \n人们经常提到第一位计算机程序员是一位女性：艾达·洛芙莱（Ada Lovelace）。作为维多利亚时代英国的年轻数学家，她遇到了查尔斯·巴贝奇（Charles\
  \ Babbage），后者正试图制造一台分析机。这台机器是现代计算机的蒸汽朋克先驱：尽管设计是用金属齿轮制成的，但它可以执行循环并在内存中存储数据。比起巴贝奇，洛芙莱更理解计算机巨大的潜力。她意识到由于计算机可以修改自己的指令和内存，它们远不止是板的计算器。为了证明这一点，洛芙莱写了被认为是历史上第一个计算机程序，一种让分析机能够计算伯努努利数列的算法。\n\
  \n符合程序员的本性，它包含一个漏洞（bug）！但更符合本性的是，洛芙莱对自己的才华有着清晰且夸张的认知。“我的这个*大脑*不仅仅是*凡人*；时间会证明这一点，”她在信中写道。当她列出个人品质时，第二项是“我巨大的推理能力”。（没有人知道我这个*纤细*的小系统里还隐藏着怎样几乎*可怕*的能量和力量，”她在另一封信中补充道。）洛芙莱预感到计算机程序员未来将拥有的巨大力量。正如她所说，那就像是信息的“*独裁者*”，指挥着“最*和谐*律的部队——由大量的*数字*组成，在*音乐*的节奏中以不可阻挡的力量前进。”遗憾的是，巴贝奇从未成功制造出一台分析机，因此洛芙莱在\
  \ 36 岁时死于癌症，她的代码从未被执行过。\n\n\n\n当真正的电子计算机时代在 20 世纪 40 年代开启帷幕时，正如珍特·阿巴特（Janet Abbate）在*重编码性别》（*Recoding\
  \ Gender*）中所述，女性再次处于行动的中心。无疑，男性是这个新机器时代的核心——但在那时，他们认为所有的光荣和英雄主义都体现在制造硬件。美国第一台可编程数字计算机\
  \ `ENIAC` 是一个重达 30 多吨的巨兽，由 2 万个真空管和 7 万个电阻组成。仅仅是让那台机器运转起来？那是男性的工程任务。相比之下，对它进行编程——即思考如何向机器发出指令——似乎是卑微的，甚至是秘书性质的工作。女性长期一直从事计算的琐碎工作。在\
  \ `ENIAC` 出现之前的几年里，许多公司使用从 `IBM` 等公司购买大型电子制表机；它们实际上只是华丽的加减法机器，但对于计算工资等任务非常有用。女性经常担任这些机器的打卡操作员；她们在打卡片上打孔，代表员工的工作小时数，然后将卡片放入制表机进行累加。这是一项嘈杂、费力且毫无名誉的工作。\n\
  \n因此，当 `ENIAC` 出现时，在负责男性看来，编程似乎与卑微的打卡工作足够相似，他们乐意雇佣女性成为 `ENIAC` 的第一批程序员。事实上，第一批 `ENIAC`\
  \ 程序员团队全都是女性：凯瑟·麦克尔蒂（Kathleen McNulty）、贝蒂·詹宁斯（Betty Jennings）、伊莉莎白·斯奈德（Elizabeth\
  \ Snyder）、马林·韦斯科夫（Marlyn Wescoff）、弗朗西斯·比拉斯（Frances Bilas）和鲁丝·利特曼（Ruth Lichterman），她们后来被称为“ENIAC\
  \ 女孩”。运行 `ENIAC` 的男人负责确定程序想要做什么；可以说，他们负责制定代码规范。而 `ENIAC` 的女性则负责物理上在机器周围（甚至内部）爬来爬去，连接电线来“编写”机器执行指令。这是一项极其费脑且具有开创性的工作；她们对\
  \ `ENIAC` 工作原理的理解最终甚至比许多制造它的男性还要透彻。\n\n“我们几乎可以诊断到单个真空管的故障，”其中一名女性詹宁斯注意到道，“由于我们既了解应用又了解机器，我们学会了诊断故障，其水平与工程师不相，甚至更优。”\n\
  \n她们在编码方面发明了突破性的思想。斯奈德意识到，如果你想调试一个运行不正常的程序，那么拥有一个“断点”（break point）会有帮助，即一个你可以在程序运行中途将其停止的时刻。当她向运行\
  \ `ENIAC` 的男性工程师提议这个想法时，他们同意实施；直到今天，程序员仍将断点作为调试的关键部分。事实上，`ENIAC` 的女性是格格的调试高手，她们是第一批发现软件从未第一次就能正常运行的程序员。1946\
  \ 年，`ENIAC` 的负责人想首次向记者展示这台计算机。他们让詹宁斯和斯奈德编写一个计算导弹轨迹的程序。经过几周密集的破解，他们成功让程序运行了，但除了一个尴尬的漏洞：导弹落地后程序仍在运行。演示前一个晚上，斯奈德直觉地发现了问题。第二天她早早到达，拨动了\
  \ `ENIAC` 内部的一个开关，修复了这个漏洞。“贝蒂在睡觉时能进行的逻辑推理比大多数人清醒时还要，”詹宁斯后来说道。\n\n尽管如此，这些女性的开创性工作并没有得到多少赞誉。在那场著名的新闻发布会上，`ENIAC`\
  \ 项目的经理们没有提到或介绍这些女性；这就是当时编码以及女性的工作被看作是微不足道的体现。\n\n战后，编码工作从军事转移到了职场，行业急需更多程序员——因此需要某种方法让编码比费力地编写晦涩的基于数字的“机器代码”更简单。在这里，女性再次成为了先驱。她们设计了第一批“编译器”。这些程序能让你创建一种更接近实际英语写作的编程语言。程序员因此可以编写类英语代码，而编译器则负责将其转换为计算机识别的\
  \ `1` 和 `0` 的繁重工作。格蕾·霍珀（Grace Hopper）在该领域的产量极高，通常被认为创建了第一个编译器，以及面向非技术业务人员的“FLOW-MATIC”语言。后来，她与团队合作创建了\
  \ `COBOL`，这种语言被企业大量使用，而该小组的程序员让·萨梅特（Jean Sammet）在几十年时间里对该语言的使用一直保持着影响力。（她说，她的愿望是“让每个人都能与计算机通信”。）弗兰克·艾伦（Fran\
  \ Allen）在优化 `Fortran` 快速运行方面极其精通，几十年后她成为了第一位女性 `IBM` Fellow。女性通过极大增加编程语言的数量和风格，处于将编码推向大众的前沿。\n\
  \n编码工作在 50 年代和 60 年代爆炸式增长，对于女性来说，这个奇的新领域对她们非常开放：由于当时几乎没人知道如何编码，在极早期，男性并没有特殊优势。事实上，公司正苦苦思索什么类型的人擅长编码。他们认为，你需要具备逻辑思维、擅长数学并且做事细致。在这方面，性别刻板印象可能对女性有利。一些高管主张认为，女性在针织和编织等细致爱好上的传统专长恰恰赋予了这种心态。（1968\
  \ 年的书籍《你的计算机职业》（*Your Career in Computers*）认为，喜欢“根据菜谱做饭”的人会成为优秀的程序员。）大多数公司给潜在的程序员进行一个简单的模式识别测试，许多女性顺利通过。随后，大多数入职者接受在职培训，这使得该领域对任何性别的新手都非常有吸引力。（“对计算机一窍不通？我们会教你（还会付工资），”一个广告这样写道。）为了招募女性，`IBM`\
  \ 甚至制作了一本名为《我的淑女》（*My Fair Ladies*）的小册。英国电气公司（English Electric）的另一幅广告展示了一个咬着笔的短发女性，指出“英国电气\
  \ Leo 最出色的计算机程序员中有很多女性。”\n\n甚至某些黑人女性也能找到立足之地，该领域对人才是如此渴求。在多伦多，一位名叫格温·布雷斯韦（Gwen Braithwaite）的年轻黑人女性嫁给了一个白人丈夫，他们发现由于当时的种族主义，没人租房给他们。这意味着他们必须买房，这意味着她需要一份工作。在看到一份招聘“数据处理”工作的广告后，布雷斯韦出现了，并说服了全白人的雇主让她参加编码能力测试。当她的成绩排在前\
  \ 99% 时，主管们认为她在开玩笑，于是对她进行了口头考核。当她完美地通过了这些后，他们意识到她是真才实学并聘佣了她。她成为加拿大第一批女性程序员之一，并领导了多个让保险公司计算机化的重大项目。“我很轻松，”她后来对儿子说，“计算机不在乎我是女性，也不在乎我是黑人。大多数女性艰难得多。”\n\
  \n\n\n\n\n# 引言\n到 1967 年，有如此多的女性从事编程，以至于《时尚杂志》（*Cosmopolitan*）专门策划了一篇关于“计算机女孩”的专题报道。文章配插了留着蜂窝头的女性操作计算机的照片，那些计算机看起来像是“企业号”（*Enterprise*）飞船的控制甲。故事描述了这个疯狂、全新的西部西部，那里女性的年薪高达\
  \ 20,000 美元——按今天的货币计算超过 14 万美元。编码已迅速成为一个女性可以蓬勃发展的稀有白领领域。对于 60 年代有心勃勃的女性来说，传统的精英专业领域——外科、法律、机械工程——几乎不接受女性。编程是一个异类；女性程序员的比例足足有四分之一，考虑到那个时代，这是一个令人震惊的高数字。当时拥有数学学位的女性选择有限——例如，在高中教数学或在保险公司进行机械计算——因此，“那时候的女性基本上会想：‘好吧，如果我不做编程，我*还能*做什么呢？’”弗吉尼亚理工大学科学技术与社会系教授珍内特·阿巴特（Janet\
  \ Abbate）写道，她密切研究过那个时代。“在那个年代，女性的机会状况是非常严峻的。”\n\n## 创业与韧性\n正如阿巴特的研究记录的，女性甚至开创了自身的创业机会。一位女性程序员埃尔西·舒特（Elsie\
  \ Shutt）在大学期间在阿伯丁登试验场（Aberdeen Proving Ground）为军队做夏季实习时学习了编程。1953 年，她被聘到雷神公司（Raytheon）编写代码，她说，那里的程序员队伍“大约一半是男性，一半是女性”。“这些男人是程序员真的让我惊讶，因为我原以为那是女性的工作！”她辞职生孩子，很快发现母亲身份杀死了她获得另一份编程工作的机会；50\
  \ 年代和 60 年代可能欢迎女性程序员，但要求她们没有孩子。没有公司愿意提供兼职工作，即使是对优秀的程序员也是如此。于是，舒特创立了 `Computations,\
  \ Inc.`，这是一家为企业编写代码的租赁咨询公司。了的是，舒特雇了家庭妈妈作为兼职程序员；如果她们还不会编码，她就培训她们。她们白天照顾孩子，晚上编写代码，租用当地计算机的时间。正如舒特告诉阿巴特那样，“这变成了一种使命感——为那些有才华、工作出色但无法获得兼职工作的女性提供工作机会。”《商业周刊》（*Businessweek*）将舒特的员工称为“怀孕的程序员们”，并刊登了一篇报道，配图是一张放在家里走廊摇篮里的婴儿照片，背景是母亲正埋头苦干编写一段代码。（文章标题为：“数学与母性的调和。”）\n\
  \n## 向男性的转变\n但到 60 年代后期和 70 年代，编码领域开始向男性倾。正如历史学家内森·恩斯梅格（Nathan Ensmenger）记录的那样，随着编程对公司变得至关重要，编码项目越来越大，他们需要将程序员提升到管理层；将女性放在如此重要的位置上似乎并不合适。从文化上说，该行业开始专业化。它正在背离“任何人都能做”的信条，转而要求高级学位和认证，而当时的女性不太可能拥有其中任何一种。在雇主眼中眼中，程序员的形象也变得越来越男性化。该行业日益认为程序员*应该*是人际关系极差、打扮不整的内向者。除此之外，编码的经济效益也变得更加丰厚，使其显然不再像在\
  \ `ENIAC` 时代看起来那样秘书化和廉价。正如社会学家长期以来指出的那样，当一个领域突然变得高薪且显赫时，以前蔑视它的男性就会涌入：*女士们，现在我们接手了，非常感谢。*\n\
  \n“大收获之一是技术技能并不等同于成功，”玛丽·希克斯（Marie Hicks）说，她曾是一名 `UNIX` 管理员，后来成为历史学家，并研究了英国发生的同样的转变。“他们想要的是更符合管理需求的人。”\n\
  \n编码领域的优秀女性看到随着 70 年代的推移情况发生了变化。`IBM` 的弗兰·艾伦（Fran Allen）目睁睁看着自己变成房间里日益稀缺的女性程序员。“随着它成为一个职业……它变成了一个女性基本上被排除在外的途径——通常情况下，”艾伦告诉阿巴特，“女性变少了。”尽管仍有一些优秀女性聚集，特别是在专业协会和`编译器`（`compilers`）等领域。但“在很多地方，存在着巨大的玻璃天花板。”尽管如此，她坚持了下来，到\
  \ 20 年代初，她仍在 `IBM` 编写代码，帮助创建了 `Blue Gene`，这台计算机后来成为 `IBM` 顶尖人工智能 `Watson` 的基础。\n\
  \n## 1984 转折点\n如果我们想指定一个发生反转的时刻，可以特别关注某一年：`1984`。那是女性开始退出计算机科学学士学学位。\n\n在 `1984`\
  \ 年之前的十年里，男性和女性对编程的兴趣都日益增加。例如，十年前的一项研究发现，对职业编程感兴趣的男性和女性人数相等；男性入读计算机科学学士课程的人多于女性（女性仅占\
  \ 16.4%），但女性对从事这项工作的前景确实被吸引了。女性很快开始采取这种兴趣。她们参加计算机科学项目的比例在 70 年代后期和 80 年代初稳定且快速地增长，使得到\
  \ `1983–84` 学年，女性占了所有学生程序员的 37.1%。在短短十年，她们的参与率翻了一番多。\n\n但那是巅峰。从 `1984` 年起，这一百分比开始下滑，在\
  \ 90 年代跌得更厉害，以到 `2010` 年时，比例已经减了一半。计算机科学专业的学生中女性仅占 17.6%。\n\n发生了什么？为什么会有如此突然而剧烈的转折点？\n\
  \n发生的一件事是孩子可以学习编程的时间发生了变化。随着个人电脑在 70 年代后期和 80 年代初出现，它改变了涌入计算机科学学位的学生群体。\n\n在 `1984`\
  \ 年之前的几年里，几乎每个出现在大学校园学习编程的学生以前从未接触过计算机。坦率地说，他们以前可能从未进入过有计算机的房间。在在那几十年里，计算机是稀有且昂贵的机器，主要位于公司或研究实验室。因此，所有学生都处于平等的起点。他们几乎都是编程的新手。他们在同一时间学习了第一个“Hello,\
  \ World!”程序。\n\n但从 70 年代后期和 80 年代初开始，第一代个人电脑出现了——如 `Commodore 64` 或 `TRS-80`。现在，一个青少年可以在家里摆电脑，在空闲时间花费几周或几个月慢慢学习编程的主要概念：`for`\
  \ 循环、`if` 语句、`数据结构`。因此从 80 年代中叶开始，其中一些学生在上第一节课时*已经做过*很多编程。这些孩子对基础课程的准备非常充分——甚至可能对第一门\
  \ `Comp Sci 101` 课程提供的课程感到有些厌倦。事实证明，拥有这种先前经验的孩子大多是男孩，正如两位学者在研究女性入学率如此低的原因时发现的那样。\n\
  \n\n\n\n这两位研究者之一是阿兰·费舍（Allan Fisher），当时是卡内基梅隆大学（CMU）计算机科学专业的副院长。CMU 于 1988 年创立了计算机科学本科专业，在最初的几年里，直到\
  \ 90 年代初，费舍注意到该专业的女性比例始终低于 10%。因此，在 1994 年，费舍决定查明究竟发生了什么，以及如何吸引更多女性进入计算机领域。他与社会科学家珍·马尔戈利斯（Jane\
  \ Margolis，现为加州大学洛杉矶分校研究生学院高级研究员）合作，开展了一项规模宏大的研究。在 1995 年至 1999 年的四年里，她和团队采访了约 100\
  \ 名 CMU 计算机专业的本科生（男女都有），她和费舍在《Unlocking the Clubhouse》一书中记录了他们的发现。\n\n马尔戈利斯发现，这些带着丰富经验来到\
  \ CMU 的青少年更有可能是男孩。男孩接触机器的机会远多于女孩；例如，男孩被父母当作礼物送电脑的概率是女孩的两倍以上。如果父母为全家买了一台电脑，父母通常会把它放在儿子的房间，而不是女儿的房间。此外，父亲倾向于与儿子建立一种近乎“实习”式的关系，和他们一起钻读\
  \ `BASIC` 手册，研究编码并鼓励他们，而极少对女儿这样做。\n\n“那是我们发现中非常重要的一部分，”马尔戈利斯告诉我。CMU 的几乎每个女孩都说：“是父亲和她哥哥一起工作，她们必须通过争抢才能获得父亲的关注。”相比之下，母亲们在家庭计算领域则更加缺席。女孩，即使是书呆女孩，也接收到了这些信息并相应地调整了自己的热情。而当然，这些本就是男孩和女孩非常熟悉的角色。到\
  \ 80 年代初，父母几十年来甚至几个世纪以来一直在默许地或公开地将孩子推向这些类别：男孩做技术性工作，而女孩玩娃娃和社交。马尔戈利斯认为，当一项新技术出现时，它恰好契入了这一轨道，这让她并不感到太意外。\n\
  \n在学校里，女孩们也收到了计算机是男孩专属的信息。男书呆会组成计算机俱乐部，部分是为了终于摆脱运动健文化的困扰，拥有一个属于自己的领域。费舍将其描述为围绕计算机形成的男孩群体创造了“一种同伴支持网络”。但他们往往（无论是有意还是无意）自己变成了排外性群体——正如\
  \ 80 年代的研究发现的那样，他们不仅排斥路过的女孩，通常也排斥黑人和拉丁裔美国人。女孩们也会约束自己在在计算机周围的行为。她们意识到，做一个女孩书呆比当一个男书呆要困难得多。男书呆确实会被欺负，但在男孩身上，对某件事（任何事，足球、汽车、计算机）的一味痴迷是受到鼓励的。相比之下，女孩长期一直受到严厉的评判——包括她们自己的父母——因为她们似乎对单一学科的关注过于狭窄。但编码却奖赏这种痴迷的人。\n\
  \n这解释了为什么 CMU 的一年级课程分化得如此极端——一方是大量对基础编程概念已经充满自信的男性，另一方则是频繁作为完全新手的女性和少数族。一种文化裂痕已经出现。女孩们（以及一些没有以往经验的男孩）开始怀疑自己的能力。她们要如何追赶呢？\n\
  \n正如马尔戈利斯从学生（以及教职员工）那里听到的那样，人们开始觉得，如果你没有已经多年痴迷地进行黑客活动，你老天爷为什么要呆在那儿？刻板印象出现了：马尔戈利斯指出，唯一的“真正的程序员”是那种“因为一直盯着显示器而晒出‘电脑屏幕黑脸’的人”。。“这种观点是，你必须喜欢一直和电脑在一起，如果你不是\
  \ 24/7 地这么做，你就不是一个‘真正的’程序员。”事实是，许多黑客男性本身并不符合这种单、偏执的刻板印象。他们有爱好；他们参加社交活动；他们想要一个更丰富的生活。但存在一种双重标准：男性想要充实的生活是可以的，而表达同样愿望的女性则会因为不够“硬核”而受到评判。经验丰富的男学生会公开讨论没有经验的女性似乎不达标，不适合计算。如果女性在课上提问，会遭到冷嘲：`这多显而易见`。到第二年，许多深受怀疑困扰的女性开始辍学。对于少数同样进入校园时没有青少年黑客经验的黑人和拉丁裔学生来说也是如此。马尔戈利斯发现，他们的辍学率也高得多，达到了\
  \ 50%（尽管她警告说很难从这一统计数据中进行推广，因为最初入学的就非常少——只有四个人）。\n\n但问题在于：学生辍学的决定——相反地，留下的决定似乎与原始编码天赋无关。马尔戈利斯发现，许多辍学的女性成绩完全很好。事实上，一些决定离开的人曾是优等生。而那些坚持下来并读到学位第三年的女性发现，到那时，她们通常已经追上了那些青少年的黑客。换句话说，学位是一种平衡力量。青少年时期做\
  \ `BASIC` 可能会教你很多酷炫的技能，但大学的学习节奏要密集得多，到学位结束时，所有人——无论是完全的新手还是黑客青少年——最终获得的编码知识是相同的。\n\
  \n\n\n\n在这些文化上的宠溺攻中，女性自身对自身技术能力的评价往往低于男性，这并无济于事。当莉莉·伊拉尼（Lilly Irani，当时是斯坦福大学科学、技术与社会专业的研究生）进行了一项与马格利斯类似的计算机科学学生研究时，她招募了男女并询问他们对“用计算机解决问题的自信程度”。伊拉尼知道，男女的成绩基本上是完全相同的。但*他们*并不知道这一点。事实证明，自信率存在性别差异：女性对自己的自信度平均评分为\
  \ 10 分中的 7.7 分，而男性则评分为 8.4 分。更令人震惊的是，当他们被要求与同学进行比较时：他们认为自己比同龄人更有信心更没？女性平均认为自己比其他学生少自信\
  \ 0.5 分，而男性则认为自己比同伴“*高*了 0.6 分”。尽管表现完全相同，但男性只是更自信，更坚信自己*感觉*像个真正的程序员。而女性则恰恰相反。\n\n\
  女性的某些自卑感似乎源于她们的偏好。一些研究发现，男性更喜欢倒腾软件，纯粹是为了倒腾的乐趣；相比之下，女性往往更认为编程很酷，是因为她们想对世界产生影响。因此，在卡内基梅隆大学（CMU）：正如马格利斯发现的那样，大多数女性不喜欢自己余生都坐在一个房间里对着电脑这种想法。这是另一个导致女性在计算机科学前两年离开的因素，因为那正是学生在那个阶段传统上要做：他们埋头学习如何编写算法和处理数据结构，而这些工作与任何更宏大的使命无关。这就是“倒腾”的定义。诚然，CMU\
  \ 的一些男性也不喜欢在抽象任务上无休止地编程而忽略自己的爱好和社交生活。但马格利斯发现，这种“极客神话”——即只有真正的程序员才会无休止地粘在键盘上——对女性归属感造成的损害更大。\n\
  \n尽管如此，那些成功坚持到后期阶段的女性发现情况发生了反转。在斯坦福和 CMU 的计算机科学后期阶段，学生们开始转向团队协作构建功能完整的应用程序；在斯坦福，他们还开始学习一种新语言`Java`。在这里，男女的舒适度发生了变化。由于斯坦福的每个人现在都在努力掌握一门新语言，这减少了学生之间的某些感知差异。此外，团队工作需要项目管理和协作的新技能，这再次让学生处于了更平等的地位——并将他们紧联系在一起，因为项目的成功或失败是共同的命运。对于那些真正坚持走到这一阶段的女性来说，她们的信心突然飙升。她们爱上了这一切。\n\
  \n但达到这种顿悟的幸存者寥寥无几。在 CMU，此时，大约一半最初开始的女性已经离开了。\n\n## 额容量危机\n\n另一种力量也从 1984 年左右驱使女性离开计算机科学领域：“容量危机”。\n\
  \n计算机科学学院成了其自身受欢迎程度的受害者。编程非常火热。有这么多学生涌入入学，以至于大学面临供应问题：他们没有足够的教授来教这么多学生。更糟糕的是，优秀的教授被私营部门已经肥厚且迅速膨胀的薪水挖走了。“工业界支付的薪水要*高*得多，”埃里克·罗伯茨（Eric\
  \ Roberts）回忆道，他在 80 年代在威莱莉学院和哈佛大学教过计算机科学，后来转到了斯坦福。（他目前在波特兰的里德学院。）他记得在找到一个愿意教学的人之前，他向五个不同的人发过录取通知。\n\
  \n学校如何应对有限的教学资源？通过赶走学生。一些学校开始实行“淘汰”课程（weeder courses），学生在被录取计算机计算机专业之前必须通过这些课程。这些课程具有刻意带有惩罚性的工作量，而且进展速度极快，以至于会让任何没有立刻“上手”的人掉在后面。有些教授对对作业感到困惑的人提供很少或不提供帮助；传递的信息是：“*自己想办法，否则你就不属于这里*。（无论如何，许多教授都超负荷了。）事实上，有些学校要求在第一年的计算机科学预备课程中获得满分——在伯克利，你需要在这些课程上达到`4.0`的平均分——才被允许进入专业。换句话说，学校创造了一个环境，让最可能通过的人是那些进来时就已经接触过编程的人——而这些人绝大多数是男孩，而且通常是白人男孩。\n\
  \n“每当这个领域在前端建立这些过滤器时，”罗伯茨说，“这都会产生减少女性参与的影响。”也有可能，通过淘汰掉这么多孩子，这些项目实际上在主动筛选那些极具竞争性且从未遭受过价值感低落的孩子。罗伯茨补充道：“女性被社会化为更不喜欢那种会有真正输者的竞争性环境。结果就是她们离开舞台的速度更快。”\n\
  \n容量危机在最初几年里同时打击了男性和女性。随着学校赶走学生，计算机科学学位的总数（无论男女）都下降了 40%以上。但到 90 年代中期，危机缓解了，计算机科学课程开始增长，招收了更多学生。然而，到那时，“谁去编程”的文化已经定型。当危机缓解、更多学生涌回时，他们中的大多数是男性。女性的兴趣已被削弱。它从未恢复到\
  \ 70 年代和 80 年代的水平。而对于那些确实出现的女性，她们往往感到格格不入。\n\n## 毒性环境\n\n由于女性太少，计算机科学部门变成了荷尔蒙的温床。1991\
  \ 年，计算机科学家斯珀图斯（Spertus）写了一份关于女性在编程课程经历的报告。她记录了这样一种景观：男生们对女性的低能性嘲笑；教授告诉女学生“你**太*漂亮了”，不适合学电子工程；当\
  \ CMU 的一些计算机科学学生要求男性自愿停止使用裸照作为桌面壁纸时，男性们愤怒地回答说这是来自“纳粹或阿亚图拉”的审查。麻省理工学院（MIT）的一项类似研究产生了同样阴暗的故事。男性学生会感叹女性的平庸：“我真的不认为这里的女学生比男性好，”其中一个人这样说。报告发现，研究小组中的行为“有时接近于更衣室”，男性在女性面前评价女学生有多么“可爱”。（“嘿，我觉得小组里那两个女孩在同一个办公室是不公平的。我们应该共享，”一个人说。）“你为了结婚需要学位吗？”其他人这样问女性代码员。当女性在课上举手时，通常会被教授忽略或被其他学生打断。她们被说不够进取；但当她们实际上表现出攻击性，挑战其他学生或反驳他们时，她们会听到这样的评论：“你今天真刻薄；一定是生理期到了了。”有些人甚至会猥亵她们，按摩肩膀或揉搓胸部。\n\
  \n\n\n\n随着女性离开计算机科学领域，职场也日益变成以白人男性为主的单一作物。根据美国劳工统计局的数据，2017 年美国被归类为“计算机程序员”、“软件开发人员”或“网页开发者”的工人中，约有\
  \ 20%为女性。如果加上涉及技术专长的其他职业——例如数据库管理员或统计师——这一比例会再高一些，达到 25.5%。黑人员工的比例分别为 6%和 8.7%，拉丁裔也处于这一范围内（分别为\
  \ 6%和 7.3%），在每种情况下，这都大约是他们在私营部门其他员工参与率的一半，或略高于的一半。（我发现的其它数据表明情况可能更低；例如，`Data USA`\
  \ 认为 2016 年黑人编码者的比例为 4.7%。）在硅谷顶尖科技公司那个更高端的世界里，数字有时更为匮乏：`Recode`的一项分析显示，`Google`\
  \ 的技术员工中有 20%是女性，而黑人仅占 1%，西班牙裔占 3%。`Facebook`的情况几乎相同，`Twitter`的比例则分别为 15%、2%和 4%。\n\
  \n这些少数群体的规模之小，以至于许多人告诉我，上班时感觉自己就像是闯入了一个古怪、封闭且全白人的祭司阶层。无疑，我采访过的每一位代表性不足的编码者都向我讲述了个别同事或经理将他们视为同等人的故事。但几乎每一个人也描述了日常的斗争：必须在广大的行业同行面前反复证明自己，而这些同行或默认或公开地假设他们没有真正的技术专长，认为他们做不到。\n\
  \n其中一位编码者斯蒂芬妮·赫尔伯特（Stephanie Hurlburt）是一个典型的书痴数学脑袋，她在图形领域的深度工作中积累了经验。“我喜欢 `C++`，那些底层的东西，”她告诉我。她工作过一系列公司，包括\
  \ `Unity`（制作一款流行的游戏设计工具的公司），随后在 `Facebook` 为其 `Oculus Rift` VR 头设备工作，为了发布第一个演示版本疯狂工作了许多小时。Hurlburt\
  \ 习惯了忽视负面评价。这种评价多是：她曾被告诉过（包括来自许多她崇拜的权威人士），女孩天生不是学数学的料。在担任编码者期间，如果她对图形学中的几乎任何细微概念表示不了解，某些男性同事就会扑过来。“我以为你的数学水平更高，”其中一个人冷之以鼻地说。在一家公司，她遭到了性骚扰；当她后来试图向\
  \ `HR` 反映公司整体毒性环境的担忧时，他们——正如我从女性编码者那里反复听到的模式——不愿解决这个问题。\n\n于是 Hurlburt 最终创立了一家名为\
  \ `Binomial` 的初创公司，与里奇·盖尔德雷希（一个与同样热爱图形数学的朋友）一起编写了一种帮助压缩图形密集型软件中“纹理”尺寸的工具。她认为，自己创业意味着不需要应付那些低价值的老板。但尽管如此，她仍无法逃避女性不是技术人才的默认假设。当她和\
  \ Geldreich 进入会议销售产品时，某些客户会认为她只是负责营销的女孩。“我不知道你们只有一个程序员的情况下是怎么把这个产品做出来的！”一位客户对 Geldreich\
  \ 说。尽管如此，拥有公司让 Hurlburt 获得了一些甜蜜的报应。在年前她最早几份编码工作中，首席技术官曾对她说“我不应该浪费时间在一个我的大脑并非为此设计的领域里工作。”现在，多年后，在那位\
  \ `CTO` 手下工作的员工一直在给她发邮件，询问是否可以使用她的纹理压缩代码，因为他们迫切需要加快自己软件的速度。她告诉我，她还没有决定是否要卖给他们。“不歧视性别的人能得到最好的压缩！”她笑着说。\n\
  \n女性编码者被误认为是公关领域的轻量级人人物。黑人和拉丁裔程序员也被误认为是安保或家政人员。这就是我在 2017 年遇到埃里卡·贝克（Erica Baker）时发生的事情之一，她当时是\
  \ `Slack` 的一名构建发布工程师。Baker 以一个书痴的非裔美国人孩子身份长大，自学了 `QBasic` 和 `Hypercard`，最终在亚特兰大工作的\
  \ `Google` 工作。她面临过一些种族主义言论：她记得有一个同事问过：“你男朋友打你吗？”她最终搬到了 `Google` 位于山景城的办公室，在那里曾有一个临时工将她误认为是安保人员，另一名员工将她误认为是行政助理。当她申请参加培训计划以晋升新的技术水平时，她从未入选，尽管她“看到一个白人男接着一个白人男获得了机会。”她指出，她在\
  \ `Google` 的时光并非完全糟糕；她的几位 `Google` 同事更加支持她并指导了她。（一位高管在临时工发生事件时注意到了，并询问她以确保她无事。）但最终，她说：“我意识到，尽管\
  \ `Google` 对大多数人来说是最好的地方，但对于我们这些少数人来说，并不是最好的地方。”2015 年，Baker 加入了 `Slack`，那里的少数群体编码者比例比硅谷其他许多公司都要高。（在\
  \ `Slack` 的全球办公室中，女性占技术岗位的 34.3%；在他们的美国办公室，12.8%的人来自“代表性不足的种族和/或民族背景”；8.3%的人认同为\
  \ `LGBTQ`。后来，她转任 `Patreon` 的高级工程经理。）\n\n对于科技行业的 `LGBTQ` 员工来说，骚扰水平也很高。当 `Kapor Center\
  \ for Social Impact` 调查技术工作人员以找出他们为何自愿离开科技工作的原因时，24%的 `LGBTQ` 员工表示他们在工作中经历过“公开的羞辱或尴尬”。他们也是调查中报告遭受欺凌比例最高的群体，达\
  \ 20%。（多达 64%的人表示欺凌“影响了他们离开的决定”。）\n\n并不是每一个我采访的少数群体编码者都面临被认真对待的问题。在我为这本书采访的许多女性中，有一小部分人表示他们在科技职场基本上没有遇到过任何问题。“我没有发现这种情况，”朱岩（Yan\
  \ Zhu）说道，她是一位知名的加密专家，当时作为一名帮助创建新浏览器 `Brave` 的工程师工作。“老实地说，我认为我对此并不敏感。”她当然知道很多关于歧视的故事：“我谈过很多女性，她们的经历与我完全不符。我不想轻视她们的经历。”\n\
  \n虽然显而易见的骚扰和侵犯占据了头条新闻，但我采访的许多编码者说，更大的问题是那些侧目的怀疑、贬低其价值的言论。与其说是断头台，倒不如说是万刀穿心。研究证实了这一点：对\
  \ 248 份技术工程师绩效评估的一项分析发现，女性比男性更容易收到带有负面反馈的评估；男性则更容易获得“只有建设性反馈”而没有负面内容的评估。\n\n\n\n\
  \n\n导致女性被排除在许多编程工作之外的另一个原因是，初创公司对“文化契合度”的担忧。初创公司涉及少数几个人在狭小的空间内长时间工作。正如你可能想象到的，这导致创始人们主要青睐那些与他们在社交和文化上相相似的入职者。有一位女性程序员被一家公司看中后来到硅谷，创始人曾带她去酒吧三次，进行长时间、漫长而轻松的聚会。他们从未讨论过工作。她感到很困惑。“他们打算什么时候对我进行这份工作的面试？”她向一位在硅谷多年的资深人士的朋友问道。“噢，那些饮酒聚会*就是*面试，”她的朋友向她保证道，“他们就是这么做的。他们想知道你是否能合得相处。”我采访的许多初创公司都告诉我，他们简单地雇佣了来自\
  \ `Harvard`、`Stanford` 或 `MIT` 的亲密朋友。\n\n### 文化契合度与自我延续的循环\n\n“这都是因为这种松散的文化问题，”，”苏·加德纳（Sue\
  \ Gardner）说道。在管理 `Wikimedia Foundation` 之后，她决定研究为什么很少有女性担任程序员，并对该领域的 1,400 多名女性进行了调查，并对更多人进行了面对面谈。她意识到，90\
  \ 年代男人的接管现在已演变成了一个自我延续的循环。由于负责人的人大部分是白人男性，他们更倾向于雇佣像他们自己的人；只有当人才走路和说话方式像他们一样时，他们才会认可人才。例如，在招聘程序员时，大多数公司依赖于`白板挑战`（`whiteboard\
  \ challenges`），即要求应聘者在白板上现场编写代码——通常是排序算法。这种表现形式与程序员在工作中实际做的事情几乎没有任何关系。但白板题*确实*很像\
  \ `常春藤学院` 学校的课堂作业。正如加德纳所指出的，对于负责招聘的男性来说，他们许多人刚毕业大学几年，这让他们感到很亲切。\n\n### 风险投资中的模式匹配\n\
  \n同样的循环主宰着获取风险投资资金这一至关重要的领域；他们资助那些看起来与他们以前见过的成功人士相似的人。事实上，他们甚至为此有一个术语：“模式匹配”（`pattern\
  \ matching`）。这些风险投资者几乎全是从 80 年代到 00 年代初赚钱的白人男性，他们青睐长相和行为像他们自己年轻版本的年轻创业者。2008 年，领先的风投家约翰·多尔（`John\
  \ Doerr`）在描述他最敬佩的科技创业者时明确地表示了这一点。“他们看起来似乎都是白人男性男宅，从 `Harvard` 或 `Stanford` 辍学，而且完全没有社交生活。所以，当我看到这种模式出现时——这在\
  \ `Google` 身上确实如此——决定投资就非常容易。”\n\n“我意识到的是，”加德纳告诉我，“并不是女性被排斥了。而是说说，如果你不是一个单身的年轻白人男性，那么实际上*几乎所有人*都被排斥了。”\n\
  \n***\n\n### 性别歧视与骚扰\n\n这种微妙的偏好——以及对女性低调、含蓄的嘲讽——往往是女性进入编程领域更大的障碍。但要找到那些赤裸裸的性别歧视和锅炉房“男兄弟俱乐部”行为也并不困难。\n\
  \n有一位女性程序员告诉我，她在一家知名、直率科技公司的办公室里遭到了侵犯。程序员们有一种在演示文书中包含色情内容的倾向——比如一个 `Ruby on Rails`\
  \ 程序员在他的幻灯片中放入了色情图片。有一位 `Ubuntu` 首席程序员在演讲中说，他对他们新软件的发布感到兴奋，因为“我们在向女孩解释我们实际上在做什么时会少些麻烦。”还有一个男人在一次关于数据库查询的研讨会上，通过按“性感程度”对女性排名的例子说明了如何优化查询——\n\
  \n```sql\nWHERE sex='F' AND hotness>0 ORDER BY age LIMIT 10\n```\n\n有一位 `Bitcoin`\
  \ 聚会的领导，对一位出现的女性 `Facebook` 客户解决方案经理说：“你看起来不像是连比特币都知道的人！”，接着是一句：“女性通常不会从效率和有效性的角度考虑问题。”（而且，另一位参会者在她在场时调戏了她。）在网上谈论这类经历的女性面临着明确的威胁和骚扰；当前\
  \ `Google` 工程师凯莉·埃利斯（`Kelly Ellis`）转发她她收到的骚扰示例时，这只招致了更多的骚扰。（“你传播这些内容要收多少钱？”后来一条被删除的推文中有人回答道。）还有关于科技初创公司的传闻，它们运作起来就像伪装良好的兄弟会（frat\
  \ houses），例如 `Upload VR`——正如一起诉讼所指控的那样，男性员工将一个带床的房间指定为“癖室”，一名经理曾宣布他要去卫生间“发泄一下”，这样他就可以继续专注于编写代码了。\n\
  \n### “兄弟程序员”（Brogrammer）的兴起\n\n科技初创公司这种类似兄弟会的性质，在一定源于 2000 年代中期另一个趋势的出现：“兄弟程序员”（`brogrammer`）的到来。\n\
  \n正如这个合成词暗示的那样，兄弟程序员——一个更兄弟会化、更哥们气的程序员——是那些殖民了该领域的传统机器思维男性的一种演变。在 90 年代后期和 2000\
  \ 年代初，有很多兄弟会风格的环境；`Facebook` 早期配备了啤酒桶、装饰满涂鸦床铺的办公室就是那一个很好的例子。但许多科技界人士说，这种趋势在 2008\
  \ 年金融危机后加速了。由于许多银行收缩，投资银行对于那些来自 `常春藤学院`、年轻、傲慢且嗜酒的男性来说，不再是获得即刻财富的可靠途径。由于许多银行收缩，他们转向了下一个淘金行业——硅谷的软件业，那里有源源不断疯狂的初创概念。（同样的趋势在\
  \ 90 年代互联网泡沫期间也以较小的形式出现过，当时许多来自广告街和营销领域的人涌入初创领域。）\n\n里克·罗伯茨（`Eric Roberts`）记得在金融崩溃后，他在教室里看到了更多这类人。他们只是想获得一条通往财富的道路，而且并不缺乏自信。一些人对软件很感兴趣；令他失望的是，其他人并不感兴趣。“最令人不安的事情之一，”罗伯茨告诉我，“我们有很多主修计算机科学的学生，他们*厌恶*这个领域。但他们知道那里是他们百万财富的来源。”他补充道：“正是这种拼命工作以成为下一个万富翁的‘锅炉房精神’，让我们在崩溃前看到了如此多的现象。当这一切崩塌时，这些人能去哪呢？当时唯一的选择就是计算机。”\n\
  \n相反，当兄弟程序员们兴起时，许多职业女性意识到硅谷永远不会给他们机会——并离开了这个领域。当苏·加德纳调查那 1,400 名女性科技工作者时，她们告诉她相同的故事：在早期，当她们还是初级程序员时，她们会忽略遇到的环境性性别歧视。她们热爱编程，野心勃勃，并对工作感到兴奋。但随着时间的推移，“他们被磨灭了，”加德纳说。随着他们地位的提升，他们找不到愿意指导他们的导师。多达二之三的人经历过骚扰，或者目睹了他人经历，正如她在研究《雅典娜因素》（另一项关于女性的研究）时发现的；三分之一的人表示，他们的经理对一起工作的男性更有支持和友好。\n\
  \n\n\n\n讽刺的是，这些女性的地位越高，遭受的骚扰就越糟糕、越露骨。这在女性程序员决定创立自己的公司并与风险投资领域打交道时尤为如此，因为那里大约 96%\
  \ 的投资者是男性。那些向风险投资者进行路演的女性创始人会遭到投资者的性骚扰。而真正成为风险投资人的女性发现，这个世界可以荒诞到漫画般的猥鄙。这就是 `Ellen\
  \ Pao` 的遭遇经历：在为 `Kleiner Perkins Caufield & Byers` 担任投资人期间，一位乘坐私人飞机飞行的科技公司 CEO 吹嘘说他自己见过色片女星\
  \ `Jenna Jameson`，然后询问成员们他们喜欢哪种类型的性工作者——“女孩”。（`Pao` 后来写道：“`Ted 说他更喜欢白人女孩——具体来说是东欧人`”。）\n\
  \n因此，科技行业的中年女性正在离开。厌倦了多年来的这些破事，没有看到情况有任何好转——事实上还看到它变得越来越糟——她们选择用脚投票。她们并不是要完全离开编程。她们会去寻找技术性工作，在那里她们会从事编程并监督代码员，但不在软件公司。她们会在医学、法律、政府等领域工作——真的是任何地方，唯独硅谷。\n\
  \n“令我惊讶的是，她们觉得‘我付出了所有努力！’她们非常*愤怒*，”`Gardner` 告诉我。“这并不像她们需要帮助或额外的指导那样。她们是生气了。她们离开不是因为无法胜任。她们离开是因为她们是熟练的专业人士，其技能在市场上有广泛需求，而且她们有其他选择。所以她们就像是在说：‘去妈的——我要去一个被视为有价值的地方。’”\n\
  \n这种讽刺是深刻的。在编程的早期，女性涌向软件行业，是因为与法律等充满性别歧视的领域相比，*那里*提供更多机会的地方。但这种情况现在已经完全反转了。软件成了落后者，成了男人的俱乐部。\n\
  \n***\n\n... ... ...\n\n科技界主要是白人男性，这重要吗？一个人可以以一种完全不带感情色彩的方式思考这个问题。对此有两个显而易见的答案：当然，从经济机会的角度来看，这确实很重要。这关乎“人类的一半人口”是否能够参与“某种特定的工作，一种令人兴奋、丰厚、有声望且对我们许多人来说非常有吸引的工作，”一位女性工程师在\
  \ `Y Combinator` 的一个关于性别的圆桌会上如说。\n\n但这对编程之外的世界其他部分也是一个问题。因为科技行业的单一种文化影响了产产品的类型。当你有一群同质的人在制作软件和硬件时，他们倾向于产生对*他们*来说非常好的作品——但对于其他生活领域的人来说可能毫无用处，甚至是一场灾难。\n\
  \n考虑 VR 公司 `Magic Leap` 的工程师，他们兴奋地开发了增强现实眼镜，结果被公司里的女性告诉，这对很多女性来说非常不舒服，因为马尾辫会干扰头带，而且设备要求你在腰带上挂载一台小型电脑，而很多女性不戴腰带。（工程师似乎忽略了这些建议：正如诉讼所指出的，“设计中未采纳任何拟议的更改。）正如我的朋友喜剧演员兼作家\
  \ `Heather Gold` 所写的，考虑 `Google` 和 `Apple` 在其群组视频聊天中引入的 UI 设计，软件默认捕捉正在说话的人，并在每个人的屏幕上放大他们的脸。正如她所指出的，这最终加剧了面对面会议中为人知的动态：不停喋喋的白人男性通常会占据所有的注意力。\n\
  \n或者考虑 `Twitter` 的案例，一个最初全男性的设计团队多年来未能意识到其平台上日益严重的滥用平台问题。这对他们来说可能是完全不可见的；男性在社交网络上遭受的威胁和骚扰要少得多。如果原始团队中哪怕只有几位在网上（例如在\
  \ 2000 年代初已存在的博客世界）活跃过的女性，她们可能就会发出警告：嘿，网上的女性会被针对和骚扰，即使是发布非常无害的帖子也是如此！让我们想办法在问题发生前解决它！（看来，‘观点’就像是互联网的短裙，”正如社会评论家兼作家\
  \ `Laurie Penny` 曾经开过的玩笑一样。）由于了这样的预警，`Twitter` 可能会实施更多功能来减少滥用行为，并更努力在其用户群体中培养一种更文明的文化，就像\
  \ `Flickr` 等公司之前尝试过的一的一样。但它却让恶意用户肆意生长——以至于露骨的新纳粹分子都在社交网络上乐此不生。\n\n到 2016 年，`Twitter`\
  \ 设计师对骚扰的松懈态度已成为一种经济负担。增长停滞了，但企业收购者对投资非常谨慎。`Disney` 决定不购买 `Twitter`，担心正如《波士顿华报》所说，“社交媒体网站上的欺凌和其他不文明的沟通形式可能会损害公司健康的家庭形象。”\n\
  \n前 `Twitter` 首席执行官 `Dick Costolo` 在多年否认滥用是一个问题后，公开收回了前言。“我希望我能让时光倒流，回到 2010 年，”他说，“通过为平台上的行为设定一个非常具体的准则，来停止平台上的滥用行为。”如果当时有人能警告他们，这做起来会容易得多。\n\
  \n***\n\n... ... ...\n\n2017 年夏天，一位 28 岁的高级软件工程师 `James Damore` 写了一了一份备忘录，认为女性程序员短缺有不同的原因：这是生物性的。正如反女主义理论通常采取的那样，这一论点迅速走红。`Damore`\
  \ 在 `Google` 工作，这家公司至少在公开场合承认性别歧视是一个问题的观点。他们曾发起培训课程以提醒员工注意“隐含偏见”。在会议上，经理们禁止使用性别歧视性的语言。这些做法还没有显著增加\
  \ `Google` 技术岗位的女性比例（要做到这一点，你需要招聘更多女性，而不只是口谈），但这个话题已经在空气中。\n\n然而，`Damore` 认为这些政策是回避事实的政治正确。在公司内部公告板的一篇名为“Google\
  \ 的意识形态回声室”的文章中，他认为性别差异并不一定是文化问题。真正的问题是男性在认知、生物学以及基于进化适应方面更适合成为程序员。`Damore` 认为，研究显示女性更容易产生焦虑，且竞争性较弱，因此很难在\
  \ `Google` 竞争激烈的环境中立足。他写道，公司可以通过改变文化来更多地适应这些特质，例如“让表现出协作行为的人脱颖而出”，或减轻科技工作的压力。但他坚持认为，`Google`\
  \ 目前增加女性和少数族裔招聘的尝试导致了反向歧视。\n\n\n\n\nDamore 本人显然非常认同那种高度专注、极具竞争性且社交笨拙的现代男性程序员模型。当我们在山景城（Mountain\
  \ View）他的公寓附近相遇时，他告诉我他小时候玩过竞技象棋，之后对博弈论、进化论和物理学产生了痴迷。成年后，他被诊断为高功能自闭症，他补充道，这解释了为什么他对系统如此感兴趣。Damore\
  \ 非常精通西蒙·巴伦-科恩（Simon Baron-Cohen）的作品，后者是一位英国临床心理学家、剑桥大学发育心理病理学教授。科恩认为，由于男性大脑在体外受到的睾酮浸泡如此巨大，他们天生注定要成为“系统化者”，对事物感兴趣；而女性则天生注定对人感兴趣。Damore\
  \ 本人从未正式学习过计算机科学；在攻读系统生物学学位期间，他读了一本关于算法的书，开始参加编程挑战，并赢得了一项 `Google` 代码竞赛。一旦公司录了他，他就开始从事搜索基础设施工作。\n\
  \nDamore 告诉我，他不认为 `Google` 的女性受到的对待比男性更糟糕。在他看来，那些具有攻击性的男性程序员也会对他们的男性同事发表尖锐的批评——而且还会抢断他们的话，并把他们想法的功劳。“我觉得这种情况发生在每个人身上，”他告诉我。他说，男性只是不在意，因为他们没那么敏感。本质上讲，从\
  \ Damore 的视角来看，编程职场在文化上是“男性化”的，对女性具有排斥性，而且这种排斥在某种程度上是先天的。“我不否认存在性别歧视之类的现象，”他补充道，“但这绝对不是全貌。”\n\
  \n事实上，Damore 认为，在职场中谈论性别歧视可能会让女性的处境变得糟糕：“我真的认为，没有什么比说‘系统在针对你’更让人感到丧失力量了。”我告诉他，科技行业的性别歧视行为似乎是显而易见的真实——大量的故事和记录在案的例子，包括我自己听过的很多案例。“我觉得其中很多内容也被媒体放大了，”他回答道，并继续论证男性也面临性别歧视，因为人们认为他们在身体上是危险的，而且他们在煤矿或垃圾收集员等高风险工作中的比例过高。我意识到，听\
  \ Damore 说话就像在读男性权利活动者网站上的标准论点：对男性的冒犯等于甚至超过了对女性的伤害。\n\n我问他，如果女性由于生物学原因很少成为程序员是真的的话，那么这是否也能解释为什么美国程序员中非裔美国人或拉丁裔如此之少？在这里，他声称问题\
  \ `并不是` 生学问题。“我认为在很多事情上，文化的作用比遗传学大得多，”他思索道。他认为，一个在高成就亚洲家庭中长大的非裔美国孩子也会同样高成就。本质上，Damore\
  \ 声称性别差距源于生物学，但种族差距并非如此。\n\nDamore 的备忘录泄露给了公众，很可能是由他在 `Google` 的同事提供的，公司迅速解雇了他。随后，`Google`\
  \ 首席执行官桑达·查伊（Sundar Pichai）向员工发了一封邮件，解释他不能雇佣一个根据性别判断同事的人。“暗示我们的某些同事具有某种在生物学上不适合这项工作的特征，”查伊指出，“是冒犯性的且不可接受的。”更进一步说，正如前\
  \ `Google` 工程师约纳坦·宗格（Yonatan Zunger）所指出的，任何经理现在都会发现让 Damore 加入团队非常困难。如果一个女性程序员知道\
  \ Damore 认为她的生物构造是一种劣势，却让他评审自己的代码，会有什么感受？\n\n然而，Damore 在“生物学是所有神话的关键”这一论点上并不孤单。`Google`\
  \ 的其他程序员也在内部论坛上发帖支持他。我交谈过的几乎每个女性程序员都有同事引用 Damore 所引用的相同研究的经历，详述大自然如何规定了僵化的男女角色。当当任\
  \ `Google` 程序员 Kelly Ellis 就她经历过的性骚扰发推时，一位科技从业者给她发邮件解释说这都是进化的作用——“我们要面对的是几十万年的进化历史。男性的天性就是先把你当成卵提供者来对待。”\n\
  \n显然，有一些自利其他的理由让某些程序员倾向于相信生物学解释了为什么男性从事编程的人远多于女性。这是一个非常老套、巧妙的理论。如果你接受了它，你就可以认为不需要任何改变，优胜劣制是成立的。它还暗示，尽管有大量相反证据，白人男性程序员相对于其他人并没有社会和文化优势——没有额外的鼓励、助推、指导——他们的成功纯粹是天赋和努力的问题。\n\
  \n“程序员倾向于对自己的理性和客观性极度自信，”辛西娅·李（Cynthia Lee）说，而她对此应该了如知情：她是一名程序员，曾是几家科技初创公司的早期员工，后来成为高性能计算专家，现在在斯坦福大学教授计算机科学。“他们对自己方面的偏见有一个非常大的盲点，因为他们不认为自己*有*盲点。”李为\
  \ `Vox` 写了一篇文章，解释了为什么科技行业有这么多女性对那封备忘录感到愤怒：因为她们每天都在精疲力竭地一次又一次应对这种生物学怀疑。“当科技行业的男性倾听科技行业女性的经历时，”她写道，“他们就能理解这份宣言是如何在旱季向干枯的丛林投放火种的。”\n\
  \n***\n\n... ... ...\n\nDamore 有可能是对的——生物学确实解释了为什么美国女性中很少有人是程序员？\n\n没有。许多整天认真研究性别差异的科学家表示，单靠生物学对偏好和能力的决定作用并没有那么强大。当然，心理学家长期以来记录了许多职业女性和学生的自我自信水平较低。但男孩和女孩在认知和行为上的可检测差异太小，不足以解释这种生活和职业路径的巨大差异；相反，它们更像是一种生物信号，在文化反馈下被大大放成了改变人生的决策和偏好。归因于纯遗传的部分是一个微小且在科学上模糊的力量——特别是与科技职场中随处可见、记录详实的性别歧视案例相比。\n\
  \n事实上，如果女性的生物学让她们在性格上不适合编程——并且对此感兴趣——那么很难解释为什么她们在美国编程的早期是如此突出。毕竟，当年的编程与现在的编程相比，甚至更加困难。那是一个令人头脑爆炸的新领域，你必须以`二进制`和`十六进制`格式进行数学运算，而且没有实用的网络论坛来帮助你解决棘手的\
  \ Bug。那只有你装在罐子里的大脑在解决地狱的问题。\n\n\n\n\n但事实并非如此。在印度，学习计算机科学的学生中，超过 40% 是女性。尽管在当地成为一名女性编码员更加困难；印度的性别角色极其刻板，女大学生通常有晚上\
  \ 8:00 的宵禁，这意味着她们甚至无法留在计算机实验室工作到深夜，这正如社会学家罗莉·瓦尔马（Roli Varma）在研究她们时发现的那样。不过，瓦尔马发现，这些女性与它们的美国同龄人相比有一个巨大的文化优势：她们更容易得到父母的鼓励进入这一领域。印度的编码员表示，女孩受到的对待要公平得多；只有\
  \ 12% 的人认为男性同龄人获得了更多接触计算机的机会，相比之下，美国的大多数女孩目睹了父亲对兄弟们倾注的“极客式”关注。（事实上，这些女性认为编码是一份更安全的工作，因为它是一个室内职业，能让她们少受印度泛滥的街头性骚扰的影响。）换句话说，在印度，女孩编写代码被认为是正常的。马来西亚的情况也类似，在\
  \ 2001 年——恰恰美国女性参与计算机科学的比例跌入谷底时——在吉隆坡的大型公立大学马来亚大学，女性占了计算机科学专业的 52%，占博士学位的 39%。这些国际对比正是硅谷非常青睐的那种\
  \ `A/B test`。对于为什么美国女性在科技领域并不多，用“奥姆剃刀”给出的解释似乎非常清楚：这不是生物学问题，而是文化问题。\n\n“计算具有很强的男性化色彩——这并不是一个通用的形象，”瓦尔马告诉我。当然，如果你想证明生物学和进化论解释的脆弱性，值得注意的是，这些解释是可以被彻底颠覆的：你可以主张，女性的进化历史本应让她们在编码方面表现得`更好`。几个世纪以来作为“采集者”、细心的家庭主妇，以及所有那些编织和织布的工作：嘿，这难道不会赋予她们编码所需的至关重要的严谨和精准吗？事实上，正如我们所见，在\
  \ 50 年代和 60 年代的初早期，这恰恰是高管们论证女性适合编程的理由。（1968 年，某计算机公司的负责人声称，“女孩有时比男孩更出色的程序员，”因为“一个有耐心做刺绣的聪明女孩恰恰拥有从事这项工作所需的心态。”）一旦你心中有了结论——`女性在生物学上是天生的编码员！不，她们不是!`——你就可以轻松地编造一个进化故事（以及对“编程”内涵的定义）来达到那个目的，这恰恰说明了为什么想要用生物学和进化论来解释复杂的社会级现代现象是多么困难。\n\
  \n如果说有什么的话，天赋与培养的辩论显示了社会自我讲述的关于才华的故事的力量。人们曾说女性是天生的编码员——她们是那种优胜制的优胜者。接着在 80 年代，另一个故事出现了。\n\
  \n***\n\n## 优胜制神话\n\n“优胜制”这个词本身就带有讽刺的起源。当英国政治家迈克尔·杨（Michael Young）在 1958 年写他的小说《优胜制的崛起》（The\
  \ Rise of the Meritocracy）时，他的本意是尖锐地讽刺政府试图通过 `IQ test` 来决定个人价值的尝试。这个术语后来被采为一个非讽性的、字面的概念，这让杨感到非常失望。\n\
  \n事实证明，认为你的领域是纯粹优胜制的会有糟糕的副作用。正如认知科学家莎拉·珍·莱斯（Sarah-Jane Leslie）在一项有趣的研究中发现的，在人们认为“原始、先天的天赋是成功的主要要求”的领域，女性和非洲裔的处境并不好。数据显示，他们在分子生物学和神经科学等领域的比例很高，在这些领域，人们理解努力、合作和严谨决定一切；但在那些自诩需要原始、孤立天才的领域（如数学或哲学），他们却并非。其他实验也证实了这一点。两个来自麻省理工学院（MIT）和印第纳大学的科学家找了具有管理经验的\
  \ MBA 学生，给了他们两个假设的公司进行管理：一个“核心公司价值观”包含优胜制，另一个则没有强调这一价值观。然后，学生得到了关于一个假设男性员工和一个女性员工的书面工作评估，两者的评价相同且都是好的。当\
  \ MBA 学生被告知公司是“优胜制”的时，他们给男性的奖金高出 12%。为什么？学者们怀疑，当你用优胜制的观念去暗示某人时，这似乎赋予了他们根据内在偏见行动的许可——似乎引发了文化观念，即男性更有可能是那个孤独的天才。\n\
  \n***\n\n## 反转趋势\n\n有可能扭转女性退出编码领域的历史性转变吗？\n\n90 年代，卡内基隆大学（CMU）的艾·费舍尔（Allan Fisher）决定尝试。受珍·马戈利斯（Jane\
  \ Margolis）发现的启发，他与教员工实施了多项改变，旨在打破新手破坏信心的循环：这些新手在第一间教室环顾四周，担心自己永远赶不上那些充满自信的青少年黑客同伴，并开始缓慢地离开。一种策略是根据经验将学生聚集在一起上课：从小就开始玩黑客的孩子将从一条轨道开始；编程新手将拥有略有不同的课程，让他们有更多时间追赶。CMU\
  \ 还为所有学生提供额外的辅导，这对于编程的初级学者来说特别有用。费舍尔知道，如果他能让他们坚持过第一二年，这些学生就能追上同龄人。他们还改变了早期课程，展示了代码如何影响现实世界——这样新学生对编程的看法就不会仅仅是一片与实际用途脱节的无尽算法。他希望学生在更早阶段就能窥见制作进入生活的软件是什么样的。在\
  \ 90 年代，在社交媒体和主流网络之前，代码对日常生活的影响并不容易看到。\n\n教员工也改变了他们的文化。多年来，他们默认了这样观点：那些入学时就会代码的孩子在本质上是天生如此。“CMU\
  \ 奖励痴迷的黑客，”费舍尔指出。但教员工现在知道这不是事实；正如费舍尔所说，他们将`过去的经验`与`原始天赋`混淆了。他们仍然想鼓励那些痴迷的青少年黑客，但他们现在理解，新手同样可能迅速成长卓越的人才，而且同样需要鼓励；学生会捕捉到教员工的期望并做出回应。“我们必须拓宽教员工对什么是成功学生的看法，”他指出。与此同时，在教授伦诺·布鲁姆（Lenore\
  \ Blum）的带领下，CMU 开始为学习计算机科学的女性建立更多社区参与和支持小组，这些活动让她们在同伴中变得可见。录取制度也改变了；它不再对是青少年黑客的学生给予如此优待。\n\
  \n\n\n\n卡内基隆大学（CMU）的努力取得了巨大的成功。在这些变化后的几年里，进入 CMU 计算机科学专业的女性比例激增，从 7%飙升至 42%；女性的毕业率也上升到几乎与男性持平。该校跃过了全国平均水平，事实上刷新了历史记录。当\
  \ CMU 的卓越成功传出后，其他学校也开始采用与费舍（Fisher）类似的方法。2006 年，哈维·穆德学院（Harvey Mudd College）创建了一门专门针对完全新手的编程入门课程，并将他们的`Intro\
  \ to Java`重新命名为`使用计算方法解决科学与工程中的创意问题`——正如校长玛利亚·克拉维（Maria Klawe）告诉我的，“这实际上是对你编码时真实行为的更好描述。”这些变化并非一帆风顺。穆德学院的课程以强度著称，被吸引进入该计划的新手们发现进展艰难。但这种方法最终也奏效了：克拉维指出，到\
  \ 2018 年，哈维·穆德计算机科学专业的毕业生中女性占了 54%。\n\n还发生了一场更广泛的文化转变。在过去的几年里，女性对编码的兴趣在全美范围内迅速上升。2012\
  \ 年，“计划主修计算机科学”的女性本科生比例开始上升——这是自世纪 80 年代中期崩溃以来 25 年来首次。\n\n这背后的原因是什么？可能，女性受到了范围内关于她们为何停止编码的日益增长的社会讨论的影响。还出现了诸如`Black\
  \ Girls Code`和`CodeNewbie`这样的机构，培训并鼓励代表性不足的科技人才进入该领域。从纯经济效益角度来看，编码的吸引力已变得类似于 80\
  \ 年代和 90 年代的法律行业。它被视为高薪且富有趣味性工作的堡垒。\n\n也许最微妙的是，编码作为一种职业的声誉正在发生。软件确实吞噬了世界。因此，任何想帮助他人的人意识到，正如社会评论家道拉斯·鲁什科夫（Douglas\
  \ Rushkoff）所说，编程是一个“高杠杆点”。在 Instagram、Snapchat 和 iPhone 已成为日常生活组成部分的时代，潜在的编码者不再担心这份工作会孤立、反社交且脱离现实。过去想做一些“创意性”或艺术类工作的人远离代码，其中许多女性也是如此。研究显示，情况不再如此。\n\
  \n“今天的计算机科学正在吸引更多富有创造力的女性，”加州大学洛杉矶分校（UCLA）教育教授琳达·萨克斯（Linda Sax）指出，她研究了数十的人口统计数据，详细记录了学生以及什么性别选择或退出\
  \ STEM 领域。这种转变是因为在不获得完整学位的情况下学习编程容易得多，可以使用免费的在线代码学校、相对便宜的“训练营”，甚至是针对新手的面对面小组——而这一切都是在过去十年中才出现的。在斯坦福计算机科学项目学习过的学者伊拉尼（Irani）说：“这种让你能想象在周末内构建一个\
  \ App 的整一切，在 80 年代和 90 年代是不存在的。从表面上看，编码现在是一件更具社交性的事情。”\n\n硅谷许多公司那种“兄弟会式”的文化甚至已经引发了一些反弹。以\
  \ Uber 为例：2017 年 2 月，程序员苏珊·福勒（Susan Fowler）单凭一之力揭露了该公司的文化，她在博客博文中描述了在那里工作的“一个非常、非常奇怪的年”。该公司拥有著名的高强度、充满男子气概的文化。福勒喜欢疯狂的工作节奏和才华横溢的同事；在寥寥空闲时间里，她写了一本关于编程“微服务的畅销书。但她很快发现骚扰在\
  \ Uber 横行。福勒到达不久，她的经理通过聊天向她提出性要求。当她告诉人力资源部门和高层时，他们说她的经理是一个“高绩效者”，这是他的第一次违规，所以“他们不方便除了警告和严厉谈话之外给予任何处罚”。但这似乎并非事实。福勒后来遇到了其他\
  \ Uber 女性，她们曾就同一种行为举报过同一个男人。当福勒继续抱怨女性员工受到的待遇时，人力资源官员以一种令人不安的方式进行反击——要求提供女性使用的个人邮箱地址，暗示这些女性是一场阴谋的一部分，并告诉福勒，“某些性别和族背景的人”可能不适合编码工作。大约一周后，福勒离开了\
  \ Uber 去了一份新工作。她在博文中写了自己的故事，但，嘿：又一篇抱怨硅谷性别歧视的博文？那能产生什么影响呢？\n\n事实证明，影响是巨大的。Uber 董事会已经因为员工的行为遭受了多年的负面报道。员工曾使用`God\
  \ View`内部映射工具帮助前男友跟踪前女友；一位高管曾威胁要对一名女记者派遣私家侦。首席执行官特拉维·卡尼克（Travis Kalanick）吹嘘他在 Uber\
  \ 获得了多少性关注，以至于他称之为“Boob-er”。福勒的故事——记录如此详尽，且带有人力资源部门如此官方违规行为——似乎是一则特别丢脸的新闻，成为了压死骆驼的最后一根稻草。在短短几个月内，卡尼克被迫下台。仿佛冰开始融了，在接下来的几个月里，女性编码者和创业者讲述了知名投资者骚扰和向她们求的故事，包括\
  \ 500 Startups 的创始人戴·麦克卢（Dave McClure），以及风险投资人克里斯·萨卡（Chris Sacca）和贾斯汀·卡尔贝克（Justin\
  \ Caldbeck）。\n\n这些转变仅仅是一个开始。我过的过的编码者和专家都能很容易（尽管很疲惫）列出一份行业可以开始打破单一文化的清单。他们可以少地根据“文化契合度”进行招聘。他们可以从常春盟以外的更多学校招人。他们可以取消“算法挑战”式的白板面试。“他们创建面试是为了筛选一种特定类型的候选人，以谷歌为例，就是斯坦福的毕业生，”埃里卡·贝克（Erica\
  \ Baker）指出。也许最重要的是，科技公司——以及风险投资巨头们——需要真正惩罚并解雇骚扰他人的员工。\n\n苏·加德纳（Sue Gardner）热切希望有更多的人进入科技领域。但她也担心鼓励她认识的年轻女性进入该领域是不道德的。她知道她们进入时充满热情，早期表现良好，但——除非发生变化——否则会逐渐受到挫败。“事实是，我们可以吸引更多、不同的人进入领域，但除非我们改变高层的运作方式，她们在职业中期仍然会撞上那堵墙，”她说道。\n\
  \n\n\n\n2017 年夏天，我参加了在纽约举行的一个 TechCrunch 黑客松，那里有 750 名程序员和设计师被赋予 24 小时时间来构思并创造一款新产品。周日午餐时，团队们在疯狂的电梯演讲（elevator\
  \ pitches）中，向行业评审小组展示了他们的作品。现场中有一个名为“Instagrammie”的机器人，它可以自动识别老年亲属的情绪；还有一个名为“Waste\
  \ Not”（不不浪费）的 App，旨在减少食物浪费。大多数参赛者都是在当地高科技公司工作的程序员，或者是附近大学的计算机科学学生。\n\n但事实证明，获胜者是……三个来自新泽西州的高中女生。在短短\
  \ 24 小时内，这三个人创建了 reVIVE，这是一个虚拟现实应用，它通过让孩子们玩一系列游戏来测试他们是否有多动症（ADHD）迹象，同时利用 IBM 的 `Watson\
  \ AI` 检查他们的情绪状态。在学生们在台上接过奖金——一张金额为 5000 美元、如奖杯大小的支票后——他们倒在附近房间的椅子上休息。从前一天中午开始，他们几乎不停地写代码，此时早已精疲力竭。\n\
  \n“喝了大量的咖啡因，”当时 17 岁的 Amulya Balakrishnan 说，她穿着一件印有“谁在黑客世界？女孩们。”字样的蓝色 T 恤。她们告诉我，她们甚至也对自己自己在\
  \ 24 小时内取得的成就感到惊叹不已。“我们的 App 确实简化了检测多动症的过程，”当时 17 岁的 Akshaya Dinesh 说，“诊断这种病通常需要六到九个月，而且要花费数千美元！我们可以通过数字化的方式以快得多的速度来实现！”\n\
  \n她们也意识到，三个年轻女性在 TechCrunch 中获胜既很奇怪，也很酷。该小组的第三位成员 Sowmya Patapati 指出，他们集体拥有丰富的以往黑客松经验。光是\
  \ Dinesh 一人就参加过超过 25 场计算机科学活动。从本质上说，这就是她学习软件的方式：她在学校上了计算机科学课，但那段教育远被她从免费在线课程和黑客松中学到的知识所掩盖了。“当我第一次走进黑客松时，那是我见过最令人生畏的事了，”她说，“我看着满屋子的八十个孩子：五个是女孩，而我可能是那里最年轻的人！”但一旦她参加了几次后，她的信心就增长了。Patapati\
  \ 和 Balakrishnan 则在学校修读编程课程，并跳过了一场年级毕业舞会和一个朋友的生日派对来到 TechCrunch。“既然可以去参加黑客松，谁还需要派对呢？”Patapati\
  \ 开玩笑道。\n\n在这个环境中，年轻、深色人种且是女性的身份带来了额外的关注，而并非所有这些关注都是好的。“我收到过很多评论，比如‘噢，你赢得黑客松是因为你是个女孩！你只是多元化配额的选拔，’”Balakrishnan\
  \ 说道。当奖项在网上公布时，有些帖子充满了酸味：“甚至有相当多的工程师评论道：‘噢，这显然选了一个女孩，这也就是为什么她们赢了的原因。’”但总的来说，她们发现黑客松的世界对新手非常友好。每个人来到那里都是为了学习和实验。人们交换知识；在很多方面，即使是面对专业人士时，他们也觉得自己是平等的。\n\
  \n“我真的很热爱黑客松文化和社区，”Dinesh 说，“对于像我这样没有资源的人来说，这是进入这个领域最好的方式。如果没有黑客松，我什么都将不知道。”她们都计划在大学学习计算机科学。她们能感受到这里回报的承诺，以及她们所能施展的奇妙力量；她们热爱这种纯粹依靠原始的、脑力技能来出围的想法。\n\
  \n“这就是技术的迷人之处，”Balakrishnan 说，“无论年龄或性别，无论你是谁，你永远不知道自己能创造出什么。”\n\n# 第 8 章\n\n## 黑客、破译者与自由战士\n\
  \n“所以，假设我想和你聊聊，”Steve Phillips 说，“但我们要私下聊！快到这边。”\n\n他把我拉到笔记本电脑前，他在那里展示他最新的发明：`LeapChat.org`。当你导航到该页面时，它会创建一个只属于你的小私人聊天室；将`URL`发送给其他人，他们就会传送进来。“而且它在每一个节点都经过加密，所以没有人能拦截你的说话内容并进行监视，”Phillips\
  \ 热烈地说道。\n\n我用“Clive”的名字登录了房间。“甚至连 `username` 都是加密的，”Phillips 的朋友 A. J. Bahnken\
  \ 说，他帮助开发了 LeapChat。\n\n要点是什么？是在这个不停在线监控的世界里，为人们提供一个小小的隐私岛屿——特别是那些寻求躲避警察和情报机构窥探目光的活动人士。Phillips\
  \ 和 Bahnken 将`LeapChat`的代码开源，因此任何熟练的程序员都可以建立自己的`LeapChat`服务器。Phillips 付费运行他自己的服务器，并让`LeapChat`在网上\
  \ 24/7 持续在线，供任何人使用。由于所有聊天内容都是加密的，即使是他们也无法看到人们在`LeapChat.org`上在做什么；他们不存储用户的`IP`地址，而且任何对话的加密日志在\
  \ 90 天后会被删除。如果执法部门来并告诉他们：“‘嘿，给我们一份那些活动人士在`LeapChat.org`上活动的副本，’”，他们将无物可交。那将只是加密的乱码，没有任何可读的内容。\n\
  \n“现在，有太多的活动人士在使用 Facebook 之类的工具进行通信，那里的数据会被永久存储，而且谁知道谁有访问权限，”Phillips 说道，他 33 岁，身材瘦削，留着整齐的山羊胡。他也受邀参加许多\
  \ Slack 小组讨论敏感议题。“我明白！这很方便！所以我们需要做出同样方便又安全的工具。”这是旧金山的一个周五晚上，Phillips 正在主持一间满满了隐私黑客的房间。我们在\
  \ Noisebridge，这是旧金山一个著名的黑客空间，吸引了从拿着电烙铁的修理爱好者到新手程序员的各类人士；主房间里有一面巨大的灯墙，今晚正闪烁着“生命游戏”画面，散落着\
  \ 70 年代的古董电脑、几台工业缝纫机，以及写满数组和函数的白板。\n\n每周，Phillips 都会举办一次名为“Cypherunks Write Code”的黑客松，志同道合的人聚集在一起，编写帮助人们在网上交流而不被监视的软件。有一个戴着帽子的男生趴在笔记本电脑前，正在重写流行的\
  \ Tor 匿名浏览软件，并希望使用一种更快的语言；在他旁边的是 Jen Helsby，她正在改进 SecureDrop 的界面，这种软件被许多组织（包括《纽约时报》和《拦截者》等媒体机构）用于举报人安全且匿名地提交文件和线索。一个在埃及长大的程序员向另外两个加密朋克讲述了他青少年时期在一个黑客小组中的事迹，那个小组曾尝试研究如何入侵公司网站。“我们很快意识到自己力不从心，于是我们不再做那样了，”他说。\n\
  \n“你们那时是破译者（crackers），”一个留着茂密白胡须的旁者大笑道，他是一个在 70 年代首次使用 Fortran 穿孔片编程的老兵。那个埃及程序员羞涩地点了点头。在程序员的这个领域，他们对术语非常严谨。“Hacker（黑客）指的是其传统含义：一种喜欢钻研系统、让它们产生新奇行为的好奇者，有时也会寻找漏洞——通常在法律范围内，即白帽。相比之下，“Cracker”（破译者）是指为了个人利益或犯罪而入侵系统的人。\n\
  \n\n\n\n但“密码朋克”（Cypherpunk）呢？这是一个他们都能认同的术语。它是旧词汇“赛博朋克”（cyberpunk）与“cypher”（即计算机密码学中的代码编写与破解）的结合，而且在我听来，还带有一点朋克摇的“朋克”精神：那些以\
  \ DIY 方式做事、在主流之外运作的人。这是为了保护公民自由的黑客行为。在一个越来越多对话发生在数字世界的世界里，密码朋克认为加密对于公民自治至关重要。\n\n\
  ### 密码朋克从哪里来？\n\n他们产生于编程技能与对集权权力的深层不信任。\n\nPhillips 起初并不是其中一员。他确实非常执着；他亲切、活泼的氛围掩盖了一种近乎单目狂的驱动力。“我的首要价值观是人类的伟大和正义，”他诚恳地告诉我，“如果没有人努力去做些特别的事情，那对我来说将太悲哀了，世界上也将发生不了什么有意义的事情。”他按照僧侣般的准则组织生活，作为一名自由职业程序员，只工作足够的时间来维持\
  \ `Noisebridge` 附近的一间小公寓，并将日常开销削减到微乎其微，以便尽可能减少付费工作时间，将剩下的时间留给哲学研究和密码朋克编程。一位朋友描述了几年前出现在\
  \ Phillips 那间简陋的公寓：“地上只有一张铺得很整齐的床垫，一个放着他少数物品的单斗柜，还有一大堆空外卖盒。别的什么都没有。”外卖都是些毫无装饰的餐食，比如鸡肉卷饼；Phillips\
  \ 遵循一套严谨的尽管看起来简陋的饮食计划，那是他青少年时期设计的，当时他决定自己被广告和流行文化骗了，一直在吃垃圾食品。“我想想，嘿，这是理性的做法，我不会让社会压力损害我的身体。有一段时间，我妈妈真的觉得被冒犯了。好像她做的菜对我来说已经不够好了？”当他和我坐在一起吃饭时，他在桌上摆了一排维生素片：“磷脂酰胆碱、卵脂、维生素\
  \ B 复合体、复合维生素和鱼油，”他说。无论他在做什么，似乎都很有效；他整个人散发着能量。\n\nPhillips 在晚年才开始接触密码朋克编程。他在加州的\
  \ `瓦卡维尔`（Vacaville, California）一个中产阶级家庭长大，父亲是消防员，母亲是健身教练兼老师。他的青少年时期一直在摆弄 `GNU/Linux`，然后离开家去大学学习哲学和数学。哲学让他觉得既强大又严肃——关于生命的意义、道德行为的辩论，正符合他这种“极客正义”的跑道。但他认为哲学辩论太模糊、定义不清晰；他认为它应该是无不可摧的逻辑性的。因此，他在大学期间花了大部分空余时间设计了他所谓的“可执行哲学”：这是一个系统，你将哲学命题陈述为\
  \ `Python` 代码片段并对它们进行 `run`（运行），这使你能够“自动发现各种错误”并“确定信仰系统的逻辑一致性”等等。他认为，如果花一生去尝试他所说的“革命哲学”，他会很快很快乐的。\n\
  \n但 Phillips 认为，你无法完全通过革命哲学来维持生计，所以毕业后，他进入了编程领域。他在 `圣塔芭芭拉`（Santa Barbara）创立了一个黑客空间，在在那里结识了几位朋友——其中包括当时\
  \ 16 岁的 `Bahnken`（他某天溜进来学编程）——随后他们创立了一系列初创公司。Phillips 对他的创业也极度专注。他疯狂吸收 `Y Combinator`\
  \ 创始人 `Sam Altman` 的在线视频，并吸收了硅谷极自由意志主义偶像 `彼得·蒂尔`（Peter Thiel）的商业构建巨著《从零到一》。“Peter\
  \ Thiel 关于创业的书非常精彩，”他告诉我，“那种想法是，你必须做一些`根本性`（fundamentally）更好的事情——不能只是好`一点点`。但在某些地方我不会提到\
  \ `Peter Thiel` 的名字，因为我讨厌他的政治。”\n\n事实上，在意识形态上，Phillips 曾到处游荡，寻找一个政治归宿。“六年里换了六个党，”他说。大学期间，他尝试过无政府主义和自由意志主义；他喜欢他们的智力严谨性，并认同他们的观点，即积累集中权力的人通常会滥用权力。但\
  \ `没有` 国家、没有政府的想法？那似乎是不可行的。“所以，政府乱作为是糟糕的。但接着就像是，‘我们该如何处理医疗？’而 `Ron Paul` 会说：‘去问你的教会，他们会帮你！’这简直就像是，你他妈在说什么？”Phillips\
  \ 笑了。他决定自己是一个“小政府社会主义者”，支持一个提供集中医疗等基本人道主义物资的国家，除此之外不干涉人们的事务。\n\n然而，世界并非向那里发展。事实上，政府正越来越多地被发现正`深度`地插手人们的生活。2013\
  \ 年，`爱德华·斯诺登`（Edward Snowden）揭露了 `NSA` 收集美国人的电话、监控聊天信息，并接入 `Google` 和 `Yahoo!` 等服务的骨干网络。Phillips\
  \ 感到震惊。但这似乎也是他可以产生影响的领域。他一直在研究密码史，并观看 `朱利安·阿桑`（Julian Assange）和 `Tor` 项目创始人的视频，他们讨论了普通人需要更好、更易用的工具，以便让他们在线上保持隐私。\n\
  \n现在这——*这*似乎是一生中一件件有意义的事。“我完全可以坐在这里，比方，穿着内裤，编写改变世界的软件——保护人们的公民自由，”他告诉我。他的初创公司没有真正起色；他回到了软件咨询工作。所以他决定尽可能多地从事密码朋克项目，同时尽可能便宜生活。很快，代码开始涌现。他创建了一种精明的隐私保护软件，一种让你在不同浏览器之间同步\
  \ `URL`，将它们以加密形式存储在公共服务器上，同时让路人无法读取。\n\n2017 年，Phillips 看着 `Wired` 杂志读到了关于 `巴雷特·布朗`（Barrett\
  \ Brown）释放的消息。Brown 是一个政府透明度活动分子，他在 2010 年创建了一个大胆的众包新闻项目。他从政府和科技公司获取了大量的秘密文件，其中一些是由黑客行动组织“匿名会”（Anonymous）获得的。Brown\
  \ 将所有文件放在一个 wiki 上，鼓励远方的志愿者帮助他分析文件，并根据他们发现的内容编写报告。他的项目最终落入了 FBI 的眼中，FBI 搜查了他的房子。最终，Brown\
  \ 被入狱，因为 `FBI` 指控他在 YouTube 视频中对一名特工发出威胁（这是真的，尽管他说视频是他近期戒毒引发的），以及发布了一份指向托管盗窃信用卡网站\
  \ `URL` 的文档（这是一个失误；他认为该 `URL` 指向的是与其工作相关的数据），此外还有一项妨碍司法的指控。（链接指控后来被撤销了。）在监狱期间，Brown\
  \ 为 `Intercept` 撰写专栏并获得了国家杂志奖。他刚出狱就向 `Wired` 讲述了他的下一个大想法：构建一种软件让活动分子能够在线协作和众包研究，就像他以前做的那样。但这次软件将具有严密的加密，这样间谍就无法窥探。\n\
  \n\n\nPhillips 感到非常振奋。这正是他想要编写的代码！事实上，他与 Bahnken 已经完成的工作——他的 URL 隐藏软件 `LeapChat`\
  \ 的早期原型——已经在朝着那个方向迈出了一步。他飞往达拉斯会见了 Brown；两人迅速达成了合作意向，在几周内，Phillips 就建立了一支由志愿者密码朋客（cypherpunks）组成的团队。他们将系统命名为“追求项目”（The\
  \ Pursuance Project），将其想象为为试图参与政治行动的公民设计的超级隐私高效办公软件。Brown 告诉我，这对于从活动人士、记者到在冲突地区工作的非政府组织的所有每个人来说都是有益的。\n\
  \n“我完全可以用这些工具保护十亿人的隐私，”Phillips 说道。\n\n如果你想理解为什么密码朋客——以及大多数程序员——如此关心隐私，并且对权威如此不信任，那么停下来回顾一下历史是有的。\n\
  \n事实证明，这种态度有着悠久的历史。从 20 世纪 70 年代开始，程序员与政府和企业中的权势之间发生过几次大冲突冲突。每一次冲突都是关于隐私和开放性的斗争。大公司和政府想要将他们的秘密紧锁起来，同时拥有窥探普通人事务的能力。而黑客想要的恰恰相反。黑客认为普通人应该享有隐私——而强大的利益集团应该被公开它们的秘密。\n\
  \n### MIT 黑客文化\n\n这种文化冲突的第一版出现于 20 世纪 60 年代和 70 年代的 MIT，当时第一代黑客开始兴奋地玩弄大学的机器。那些黑客拥有一种开放的伦理：如果你写了一个酷炫的算法或代码，你就把它分享给其他人。如果你不向他人展示你的代码，反之亦然，大家如何学习呢？“我们把程序分享给任何想使用它们的人，它们是人类知识，”MIT\
  \ 最多产的黑客之一 Richard Stallman 后来回忆道。事实上，MIT 的程序员是非常具有集体主义精神的，他们甚至不在自己写的代码上署名。“签署代码被认为是傲慢的，”1980\
  \ 年进入该实验室的 Brewster Kahle 回忆道，“这都是为了构建机器。这是一个社区项目。”当然，黑客们每个人都可能极具个人主义，并且每个人都深信自己的卓越。。但编码本身呢？那是一项集体努力，是一场智力上的集体盖房，大家为了大家的利益而努力让计算机做酷酷的事。`拥有`一个你写的算法似乎比“拥有”乘法概念本身、或宪政民主、或韵律一样荒谬。\n\
  \nMIT 的黑客讨厌任何限制他们访问机器或尝试任何他们想要测试的技术企图。所以，如果某个规则阻碍了他们，他们就打破它。如果他们像通常一样在深夜进行黑客活动，而电脑故障了，他们就需要适当的工具来修理——结果发现白班员工把工具锁了起来。于是，他们就会直接破解锁（从空白处制作一把“主”钥匙），并取走他们所需的东西。\n\
  \n“对于黑客来说，关上的门是种侮辱，锁上的门是种愤犯，”Steven Levy 在《黑客》一书中描写那些 MIT 程序员时这样写道。“正如信息应该在计算机内部清晰、优雅地传输一样，正如软件应该自由传播一样，黑客相信人们应该被允许访问可能促进黑客寻求发现和改进世界运作方式之追求的文件或工具。当一个黑客需要某些东西来创作、探索或修复时，他不会理会诸如所有权之类的荒谬概念。”\n\
  \n### 自由软件的诞生\n\n这种与财产的关系产生了一个激进的想法：“自由/开源（free/libre）”软件。这场革命发生在 20 世纪 80 年代初，当时\
  \ MIT 官员意识到多年来学生黑客为 MIT 的计算机编写了大量极具价值的软件。因此，官员们决定从中赚钱。一家名为 `Symbolics` 的营利性计算机公司询问\
  \ MIT 是否可以许可所有这些酷的软件运行在它的计算机上。MIT 说没问题。于是 Symbolics 如约许可了这些代码，Symbolics 的员工开始对其进行调整、修改和添加新功能。但每当\
  \ Symbolics 创建一个新功能时，它就保持为专有。它并没有公开分享这些创新，以便下一代程序员能够从中学习。\n\n这让 Stallman 非常恼。他最终离开了\
  \ MIT，并发明了一种完全不同的许可范式，称为`通用公共许可证`（General Public License）。它的工作原理是：假设我写了一个邮件程序，并在`通用公共许可证`下发布它，因为我是一个具有公共意识、想要自由分享工作的黑客。很酷：如果你下载了该邮件程序，`GPL`\
  \ 意味着你允许查看我的源代码；修改邮件软件；以及分发你对我作品的混合版本。但这里还有一个额外的元素：如果你修改了代码并开始分发你的新版本，你也必须在`GPL`下发布你所有的修改。你不能对那些新代码保密。这并没有阻止你通过你的工作赚钱；你可以将代码作为商业产品出售。（正如\
  \ Stallman 指出的，它是“自由”得像“言论自由”的自由，而不是“免费啤酒”的“免费”。）但你必须公开发布你修改后的源代码版本，以便其他人也可以检查它、混合它并分享它——这个过程将无休止地持续下去，对于每一个使用我的/你的代码的人。从本质上说，`GPL`\
  \ 是一种具有病毒性的法律条文。如果一个黑客通过让某个软件免费且开放开启了先例，它将永远保持下去，包括基于此的所有衍生作品。\n\n这是一场以开放、透明和控制的名义发出的挑战。它传达的信息是：如果制作软件的人不向你展示代码，你就永远不要信任该软件。它在文化中造成了一道裂痕——重视开放性的程序员与想要保留代码秘密的公司之间的对。\n\
  \n### 冲突的第二阶段\n\n冲突的第二阶段出现在 20 世纪 80 年代，并变得更加阴暗——随着 FBI 开始积极逮捕因入侵系统的黑客。\n\n这发生在第一批购买了廉价\
  \ `BASIC` 家用计算机的青少年时期，他们使用调制调器拨入世界其他地区的计算机系统。有时他们会拨入公告板、由其他程序员运行的讨论论坛，在那里交换技巧并分享他们的利用程序。但最有野心的黑客却在搜寻更大的猎物：他们喜欢非法拨入由大公司和电信公司运行的计算机系统带来的快感。如果你能渗透其中一个，你就能控制极其强大的计算机——在那些计算机上，你可以使用\
  \ `C` 等语言编程，而不是他们插在父母电视机上的 `Commodore 64` 里的 `BASIC`。\n\n“我们想要访问比家里那些简单计算机更强大的计算机，”在\
  \ 80 年代使用屏幕代号 `Phiber Optik` 的黑客 Mark Abene 在接受 `CNET` 采访时回忆道，“我们想要获得我们否则无法获得的高端技术，理解它们并学习对其编程。”然而，获得那样的访问权限需要一些直接的数字侵入和非法活动。Abene\
  \ 的黑客小组的成员会共享公司系统的密码，这些密码是他们数字破解的（或通过老式翻找公司垃圾桶发现的）。\n\n\n\n\n正是在这里，联邦官员开始警觉起来。电信公司和政府担心他们正在失去对这个奇异、新兴的新领域——“网络空间”的控制。于是，他们冲向了\
  \ Abene 和他的小组“欺骗大师”。在 21 岁时，Abene 被关押了近一年之久。支持者认为，这一判决与他的罪行完全不成比例；在他所有的侵入行为中，Abene\
  \ 并没有真正破坏过任何系统，也没有偷取过任何价值数据。但他无疑是该国最著名的黑客。为了试图理解这群利用调制解调器在网上无忌忌游荡的新一代孩子的动机，记者们无休止地引用他的话。他的名声让一个在面对一群敲击键盘的孩子面前显得软弱而感到无颜的政府有了一个实用的替罪羊。“必须传达一个信号，”法官在宣判时解释道。\n\
  \n到了 20 世纪 90 年代初，黑客日益意识到破解是非法的，并且会被这样对待。他们知道，如果你未经许可访问了系统，联邦政府可能会追到你。但只要你只是安分本分，不入侵系统，只编写有用的代码，他们就会放过你，对吧？\n\
  \n并非完全如此。下一次大战是为了加密代码本身——政府正极力试图让 `write` 某些类型的软件变得非法。\n\n***\n\n这些就是所谓的“加密大战”：一系列关于谁被允许编写和使用加密的斗争。\n\
  \n在如今这个充满 Facebook 和电子邮件的世界里，人们变得越来越明确，我们的在线活动正被严密追踪。然而，在过去的 世纪 70 年代和 80 年代，大多数人并没有在线，因此数字隐私的概念并不在全民讨论的范围内。第一批预见到我们今天现状的“卡珊德拉”们是计算机科学家和编码员。毕竟，他们是第一批使用\
  \ `email` 相互交流并往回发送文件的人。这既有趣又令人兴奋，但他们不安地意识到，所有这些邮件和讨论论坛帖子都留下了数字足迹。以文本形式进行的对话可能会在服务器上留存多年，也许是永远。当社会的\
  \ `rest` 部分也开始做同样的事情时，会发生什么？\n\n这让计算机科学家 Whit Diffie 感到担忧。在 20 世纪 70 年代初，在与伴侣聊天时，他预言了\
  \ Facebook、Amazon 和 Google Hangouts 等产品的出现。他在 2013 年回忆道：“我告诉她，我们正在进入一个世界，人们将与他们从未面对面见过的人建立重要、亲密且长期的关系。”\n\
  \nDiffie 也知道，在当时，大多数形式的数字消息加密都非常脆弱。这是因为它们都存在一个巨大的缺陷：双方——发送消息的人和接收消息的人——都需要拥有相同的、用于让你解密的\
  \ `key`（密钥）。如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的 `key`。这种做法的问题在于——追溯到古希腊的间谍和将军们也完全清楚——就是你很容易不小心丢失你的\
  \ `key`，或者被敌人偷走。一旦有人知道了你的 `key`，砰的一声：他们就可以解密你的任何秘密消息并阅读它们。所以，确实，Diffie 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\
  \n然而，在 1976 年，Diffie 和他的同事有了一个突破性的想法。他们发明了所谓的“公钥/私钥”加密。在这个系统中，我们每个人都有两个密钥：一个任何人都能看到的公钥，以及一个只有我们个人知道的私钥。向他人发送消息意味着使用两个密钥——你的私钥和他们的公钥。根据加密数学的原理，问题在于——如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的\
  \ `key`。正如追溯到古希腊的间谍和将军们也完全清楚的，你很容易不小心丢失你的 `key`，或者被敌人偷走。一旦有人知道了你的 `key`，他们就可以解密你的任何秘密消息。。所以，确实，Diffie\
  \ 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\n在 1976 年，Diffie\
  \ 和他的同事有了一个突破性的想法。他们发明了所谓的“公钥/私钥”加密。在这个系统中，我们每个人都有两个密钥：一个任何人都能看到的公钥，以及一个只有我们个人知道的私钥。向他人发送消息意味着使用两个密钥——你的私钥和他们的公钥。根据加密数学的原理，问题在于——如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的\
