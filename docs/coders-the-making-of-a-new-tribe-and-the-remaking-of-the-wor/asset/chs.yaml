  \ 可以编写一些非常出棒的加密算法来保护他和朋友们的消息安全。但如果他们小组中的任何人不小心泄露了密钥，一切就结束了。再无隐私。\n\n在 1976 年，Diffie\
  \ 和他的同事有了一个突破性的想法。他们发明了所谓的“公钥/私钥”加密。在这个系统中，我们每个人都有两个密钥：一个任何人都能看到的公钥，以及一个只有我们个人知道的私钥。向他人发送消息意味着使用两个密钥——你的私钥和他们的公钥。根据加密数学的原理，问题在于——如果我在纽约，试图给在威斯康星州的你发送一封秘密的加密电子邮件，我需要向你发送解锁这封秘密信件的\
