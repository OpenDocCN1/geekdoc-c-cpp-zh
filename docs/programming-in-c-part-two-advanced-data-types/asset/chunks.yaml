    在此示例中，我们使用 Jansson 库创建 Product 的 JSON 表示。`json_pack` 函数帮助格式化数据，`json_dumps` 将\
    \ JSON 对象转换为字符串。\n\n# C 中的 XML 序列化\n\nXML（可扩展标记语言）是另一种流行的数据结构格式。虽然没有 JSON 那么轻量，但\
    \ XML 灵活多变且易于人类。在 C 中进行 XML 序列化，libxml2 库是一个强大的选择。\n\n让我们扩展 Product 示例以演示 XML\
    \ 序列化：\n\n```c\n#include <libxml/tree.h>\n\ntypedef struct {\n    int id;\n  \
    \  char name[50];\n    float price;\n} Product;\n\nvoid serializeToXml(xmlNodePtr\
    \ parent, Product *product) {\n    xmlNewChild(parent, NULL, BAD_CAST \"id\",\
    \ BAD_CAST (xmlChar *) product->id);\n    xmlNewChild(parent, NULL, BAD_CAST \"\
    name\", BAD_CAST (xmlChar *) product->name);\n    xmlNewChild(parent, NULL, BAD_CAST\
    \ \"price\", BAD_CAST (xmlChar *) product->price);\n}\n\nint main() {\n    //\
    \ Creating a sample Product\n    Product sampleProduct = {1, \"Laptop\", 1200.50};\n\
    \    // Creating an XML document\n    xmlDocPtr doc = xmlNewDoc(BAD_CAST \"1.0\"\
    );\n    xmlNodePtr root = xmlNewNode(NULL, BAD_CAST \"Product\");\n    // ...\
    \ rest of implementation\n}\n```\n\n"
