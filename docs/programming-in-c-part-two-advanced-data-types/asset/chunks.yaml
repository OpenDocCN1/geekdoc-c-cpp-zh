    \ C 中的作用，并研究基本的指针算术。\n\n# 理解指针\n\n指针的本质是一个存储另一个变量内存地址的变量。这允许对数据进行间接操作，实现动态内存分配和高效的数据访问。让我们来看一个简单的例子：\n\
