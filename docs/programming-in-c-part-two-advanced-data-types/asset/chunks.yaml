    # Mastering Array Manipulation in C


    Arrays play a fundamental role in C programming, offering a powerful mechanism
    for handling collections of data. To truly master array manipulation, one must
    delve into their declaration, initialization, and the intriguing world of multidimensional
    arrays.


    # Array Declaration and Initialization


    In C, declaring an array involves specifying the data type and the array’s name,
    followed by the size of the array in square brackets. For example, to declare
    an integer array named numbers with 5 elements, one would write:


    int numbers[5];


    Initialization involves assigning values to the elements of the array. This can
    be done individually or collectively during declaration:


    int numbers[5] = {1, 2, 3, 4, 5};


    In the above example, the array numbers is declared and initialized with five
    integers.


    Another way to initialize an array is by not specifying its size explicitly. In
    such cases, the compiler determines the size based on the number of elements provided:


    int numbers[] = {1, 2, 3, 4, 5};


    Here, the size of the numbers array is automatically set to 5.


    # Understanding Multidimensional Arrays


    While one-dimensional arrays are common, C also supports multidimensional arrays,
    allowing you to represent data in a more structured manner. The most common type
    is the two-dimensional array.


    # Declaration and Initialization of 2D Arrays


    A two-dimensional array is essentially an array of arrays. To declare and initialize
    a 2D array, you specify the data type, the array name, and the size in both dimensions:


    int matrix[3][3] = {


        {1, 2, 3},


        {4, 5, 6},


        {7, 8, 9}


    };


    Here, we’ve declared a 3x3 matrix and initialized it with sequential numbers.


    # Accessing Elements in a 2D Array


    Accessing elements in a 2D array involves specifying both row and column indices.
    For instance, to access the element in the second row and third column of our
    matrix:


    int element = matrix[1][2];


    # Practical Example: Matrix Multiplication


    To demonstrate the power of multidimensional arrays, let’s explore matrix multiplication.
    Given two matrices A and B, the resulting matrix C is calculated as follows:


    int matrixA[2][3] = {


        {1, 2, 3},


        {4, 5, 6}


    };


    int matrixB[3][2] = {


        {7, 8},


        {9, 10},


        {11, 12}


    };


    int result[2][2];


    for (int i = 0; i < 2; i++) {


        for (int j = 0; j < 2; j++) {


            result[i][j] = 0;


            for (int k = 0; k < 3; k++) {


                result[i][j] += matrixA[i][k] * matrixB[k][j];


            }


        }


    }


    In this example, we’ve multiplied a 2x3 matrix with a 3x2 matrix, resulting in
    a 2x2 matrix stored in the result array.


    Mastering array manipulation in C is essential for any programmer. Understanding
    the declaration, initialization, and multidimensional aspects of arrays opens
    up a world of possibilities for efficient data handling and manipulation. Whether
    working with one-dimensional arrays for simple tasks or delving into the complexity
    of multidimensional arrays for advanced applications, a solid grasp of array manipulation
    is a cornerstone of C programming expertise.


    # String Manipulation Techniques in C


    Strings play a crucial role in programming, serving as a fundamental data type
    for handling text. In the C programming language, strings are represented as arrays
    of characters, and manipulating them efficiently is a key skill for any C programmer.


    # Basics of String Representation


    In C, a string is essentially an array of characters terminated by a null character
    (’\0’). For example, the string “Hello” is represented as:


    char helloString[] = {''H'', ''e'', ''l'', ''l'', ''o'', ''\0''};


    It’s important to note that C doesn’t have a built-in string type, so character
    arrays are used to simulate strings. This makes string manipulation a bit more
    manual compared to higher-level languages.


    # String Input and Output


    To work with strings effectively, understanding how to input and output them is
    crucial. The printf and scanf functions can be used for this purpose. For instance:


    #include <stdio.h>


    int main() {


        char name[20];


        // Input a string


        printf("Enter your name: ");


        scanf("%s", name);


        // Output the string


        printf("Hello, %s!\n", name);


        return 0;


    }


    In this example, %s in the scanf and printf functions is a format specifier for
    strings.


    # String Length Calculation


    To find the length of a string manually, we can iterate through the characters
    until we encounter the null character:


    #include <stdio.h>


    int stringLength(const char *str) {


        int length = 0;


        while (str[length] != ''\0'') {


            length++;


        }


        return length;


    }


    int main() {


        char message[] = "Hello, C programming!";


        int length = stringLength(message);


        printf("Length of the string: %d\n", length);


        return 0;


    }


    # Concatenating Strings


    Concatenating strings involves combining two strings into a single string. This
    can be done manually, but C also provides the strcat function for this purpose:


    #include <stdio.h>


    #include <string.h>


    int main() {


        char str1[20] = "Hello, ";


        char str2[] = "C programming!";


        // Concatenate str2 to str1


        strcat(str1, str2);


        printf("Concatenated string: %s\n", str1);


        return 0;


    }


    # String Comparison


    String comparison is a common operation when working with text. The strcmp function
    in C compares two strings and returns an integer value indicating their relationship:


    #include <stdio.h>


    #include <string.h>


    int main() {


        char str1[] = "apple";


        char str2[] = "orange";


        int result = strcmp(str1, str2);


        if (result == 0) {


            printf("Strings are equal\n");


        } else if (result < 0) {


            printf("%s comes before %s\n", str1, str2);


        } else {


            printf("%s comes after %s\n", str1, str2);


        }


        return 0;


    }


    # Searching and Substring Extraction


    Searching for a specific character or substring within a string can be accomplished
    using functions like strchr and strstr:


    #include <stdio.h>


    #include <string.h>


    int main() {


        char sentence[] = "Programming in C is fascinating.";


        // Search for a character


        char *charPtr = strchr(sentence, ''C'');


        if (charPtr != NULL) {


            printf("Found: %s\n", charPtr);


        } else {


            printf("Not found\n");


        }


        // Search for a substring


        char *substrPtr = strstr(sentence, "fascinating");


        if (substrPtr != NULL) {


            printf("Found: %s\n", substrPtr);


        } else {


            printf("Not found\n");


        }


        return 0;


