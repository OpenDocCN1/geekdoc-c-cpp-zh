    \ we defined a `Point3D` structure and then used it as a member within the `Triangle`\
    \ structure. This illustrates the ability to create hierarchical and more intricate\
    \ data structures by nesting structures.\n\nIn conclusion, structures in C provide\
    \ a flexible and efficient way to manage and organize data. They enhance code\
    \ readability, modularity, and enable the creation of complex data structures.\
