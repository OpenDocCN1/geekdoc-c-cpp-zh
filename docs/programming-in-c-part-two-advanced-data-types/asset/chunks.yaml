    # 3\. Building Dynamic Strings in C


    In many applications, the size of strings is not known in advance. Dynamic memory
    allocation becomes crucial for handling such scenarios. The malloc function can
    be used to allocate memory dynamically. Let’s create a function that dynamically
    builds a string:


    #include <stdio.h>


    #include <stdlib.h>


    #include <string.h>


    char *buildDynamicString(char *str1, char *str2) {


        // Allocate memory for the combined string


        char *result = (char *)malloc(strlen(str1) + strlen(str2) + 1);


        // Check for memory allocation success


        if (result != NULL) {


            strcpy(result, str1); // Copy the first string


            strcat(result, str2); // Concatenate the second string


        }


        return result;


    }


    int main() {


        char greeting[] = "Hello, ";


        char name[] = "John Doe";


        // Build dynamic string


        char *message = buildDynamicString(greeting, name);


        if (message != NULL) {


            printf("%s\n", message);


            free(message); // Release dynamically allocated memory


        }


        return 0;


    }


