    \ = arr;\n    // Accessing array elements using pointer arithmetic\n    for (int\
    \ i = 0; i < 5; ++i) {\n        printf(\"Element %d: %d\\n\", i, *(ptr + i));\n\
    \    }\n    return 0;\n}\n```\n\nIn this snippet, `ptr` points to the beginning\
    \ of the array `arr`. By incrementing the pointer, we traverse the array, accessing\
    \ and printing each element. This illustrates how pointer arithmetic simplifies\
    \ the manipulation of arrays and enhances code readability.\n\nUnderstanding pointers,\
