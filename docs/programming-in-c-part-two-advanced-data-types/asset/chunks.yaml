    \ <stdlib.h>\n\nint main() {\n    int *arr;\n    int size;\n    printf(\"Enter\
    \ the size of the array: \");\n    scanf(\"%d\", &size);\n    arr = (int *)malloc(size\
    \ * sizeof(int));\n    if (arr == NULL) {\n        printf(\"Memory allocation\
