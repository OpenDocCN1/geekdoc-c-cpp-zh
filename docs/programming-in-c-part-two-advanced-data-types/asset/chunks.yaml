    \n链表是动态数据管理的基础结构。在 `C` 中，它们可以使用指针来实现：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nstruct Node {\n    int data;\n    struct Node* next;\n};\n\n// 在链表开头插入新节点\n\
    void insertAtBeginning(struct Node** head, int newData) {\n    struct Node* newNode\
    \ = (struct Node*)malloc(sizeof(struct Node));\n    newNode->data = newData;\n\
    \    newNode->next = *head;\n    *head = newNode;\n}\n\n// 打印链表\nvoid printList(struct\
    \ Node* node) {\n    while (node != NULL) {\n        printf(\"%d -> \", node->data);\n\
    \        node = node->next;\n    }\n    printf(\"NULL\\n\");\n}\n\nint main()\
    \ {\n    struct Node* myList = NULL;\n    // 在开头插入\n    insertAtBeginning(&myList,\
