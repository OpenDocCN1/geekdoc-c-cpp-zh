    \ 函数向 XML 文档添加了子节点，并将结果保存到文件中。\n\n# C 语言中的二进制序列化\n\n二进制序列化比 `JSON` 和 `XML` 等人类可读格式更紧凑、更高效。当性能和带宽是关键因素时，它特别有用。在\
    \ C 语言中，我们可以直接将结构体写入文件来实现二进制序列化。\n\n让我们修改 `Product` 示例以进行二进制序列化：\n\n```c\n#include\
