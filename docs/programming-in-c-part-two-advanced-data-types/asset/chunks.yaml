    \    // 打印链表\n    printf(\"Linked List: \");\n    printList(myList);\n    return\
    \ 0;\n}\n\n```\n\n# 2. 用于层级结构的树\n\n树对于表示层级关系非常有价值。特别是二叉树提供了一种简单而强大的结构。让我们创建一个二叉树：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct TreeNode {\n    int\
