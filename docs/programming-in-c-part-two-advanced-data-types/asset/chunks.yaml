    \ allocated memory\n    free(arr);\n    return 0;\n}\n```\n\nHere, `malloc` is\
    \ used to dynamically allocate memory for an integer array based on user input.\
    \ The pointer `arr` allows for efficient manipulation and traversal of the allocated\
    \ memory.\n\n# Basic Pointer Arithmetic\n\nPointer arithmetic is a powerful feature\
