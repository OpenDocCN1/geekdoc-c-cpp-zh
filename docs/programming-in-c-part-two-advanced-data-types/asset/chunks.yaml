    \ {\n    int num = 42;\n    int *ptr = &num;\n    printf(\"Value of num: %d\\\
    n\", num);\n    printf(\"Address of num: %p\\n\", &num);\n    printf(\"Value of\
    \ ptr: %p\\n\", ptr);\n    printf(\"Value pointed by ptr: %d\\n\", *ptr);\n  \
    \  return 0;\n}\n```\n\nIn this example, `ptr` is a pointer that stores the address\
    \ of the variable `num`. Using the dereference operator `*ptr`, we can access\
    \ the value pointed to by the pointer, providing a dynamic way to interact with\
    \ data.\n\n# Role of Pointers in C\n\nPointers are essential in C for several\
    \ reasons. They facilitate dynamic memory allocation, allowing programs to adapt\
    \ to varying data sizes during runtime. Additionally, pointers play a crucial\
