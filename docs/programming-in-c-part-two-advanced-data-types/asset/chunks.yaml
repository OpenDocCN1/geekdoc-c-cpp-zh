    \    if (arr == NULL) {\n        printf(\"Memory allocation failed.\\n\");\n \
    \       return 1;\n    }\n    // 填充数组\n    for (int i = 0; i < size; ++i) {\n\
    \        arr[i] = i * 2;\n    }\n    // 使用指针访问并打印数组元素\n    for (int i = 0; i <\
    \ size; ++i) {\n        printf(\"Element %d: %d\\n\", i, *(arr + i));\n    }\n\
    \    // 释放分配的内存\n    free(arr);\n    return 0;\n}\n```\n\n在这里，`malloc` 根据用户输入为整数数组动态分配内存。指针\
    \ `arr` 允许对分配的内存进行高效的操作和遍历。\n\n# 指针算术\n\n指针算术是一个强大的特性，允许方便地在数组和结构之间导航。当我们对指针进行算术运算时，它们会根据指针指向的数据类型的大小进行扩展。考虑以下示例：\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    int arr[] = {10, 20, 30, 40, 50};\n\
    \    int *ptr = arr;\n    // 使用指针算术访问数组元素\n    for (int i = 0; i < 5; ++i) {\n\
    \        printf(\"Element %d: %d\\n\", i, *(ptr + i));\n    }\n    return 0;\n\
    }\n```\n\n在代码段中，`ptr` 指向数组 `arr` 的开头。通过递增指针，我们遍历数组，访问并打印每个元素。这说明了指针算术如何简化数组的操作并提高代码的可读性。\n\
    \n理解指针、它们在 C 中的作用以及基础指针算术对于掌握这门语言至关重要。通过利用指针的力量，程序员对内存管理有了更深入的理解，使他们能够创建更高效、灵活的代码。当你继续\
    \ C 编程之旅时，请记住指针是你的盟友，它们提供了释放语言全部潜力的手段。\n\n# 动态内存分配\n\n动态内存分配是 C 编程中的一个基础概念，提供了一种运行时管理内存的方法。在本文，我们将通过探索\
    \ `malloc`、`calloc`、`realloc` 和 `free` 函数来揭示这一过程并它们的用法。\n\n## 动态内存分配简介\n\n在 C\
    \ 中，内存可以通过两种方式分配：静态和动态。静态分配是在编译时完成的，而动态分配允许在运行时进行内存分配。当数据大小未知或数据大小在执行过程中可能会变化时，动态内存分配变得至关重要。\n\
    \n## malloc 函数\n\n`malloc` 是 memory allocation（内存分配）的缩写，是 C 中分配内存的主要工具。它接受一个参数，表示要分配的字节数，并返回一个指向分配内存第一个字节的指针。这是一个基础示例：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int *dynamicArray;\n\
    \    int size = 5;\n    // 为大小为 5 的整数数组分配内存\n    dynamicArray = (int*)malloc(size\
    \ * sizeof(int));\n    // 检查内存分配是否成功\n    if (dynamicArray == NULL) {\n      \
    \  printf(\"Memory allocation failed.\");\n        return 1;\n    }\n    // 根据需要使用分配的内存\n\
    \    // 完成后忘记释放内存\n    free(dynamicArray);\n    return 0;\n}\n```\n\n## calloc\
    \ 函数\n\n与 `malloc` 类似，`calloc` 函数用于动态内存分配。然而，`calloc` 将分配的内存初始化为零。它接受两个参数：元素的数量和每个元素的大小。这里是一个示例：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int *dynamicArray;\n\
    \    int size = 5;\n    // 为大小为 5 的整数数组分配内存\n    dynamicArray = (int*)calloc(size,\
    \ sizeof(int));\n    // 检查内存分配是否成功\n    if (dynamicArray == NULL) {\n        printf(\"\
    Memory allocation failed.\");\n        return 1;\n    }\n    // 根据需要使用分配的内存\n\
    \    // 完成后忘记释放内存\n    free(dynamicArray);\n    return 0;\n}\n```\n\n## realloc\
    \ 函数\n\n内存需求在程序执行过程中可能会变化。这就是 `realloc` 函数大显身手的地方。它允许调整之前分配的内存块的大小。这是一个说明用法的示例：\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main() {\n    int *dynamicArray;\n\
    \    int size = 5;\n    // 为大小为 5 的整数数组分配内存\n    dynamicArray = (int*)malloc(size\
    \ * sizeof(int));\n    // 检查内存分配是否成功\n    if (dynamicArray == NULL) {\n      \
    \  printf(\"Memory allocation failed.\");\n        return 1;\n    }\n    // 根据需要使用分配的内存\n\
    \    // 将数组大小增加到 8\n    dynamicArray = (int*)realloc(dynamicArray, 8 * sizeof(int));\n\
    \    // 检查重新分配是否成功\n    if (dynamicArray == NULL) {\n        printf(\"Memory reallocation\
    \ failed.\");\n        return 1;\n    }\n    // 根据需要使用重新分配的内存\n    // 完成后忘记释放内存\n\
    \    free(dynamicArray);\n    return 0;\n}\n```\n\n## free 函数\n\n动态分配的内存必须释放以防止内存泄漏。`free`\
    \ 函数为此目的。它接受指向动态分配内存块的指针作为参数。这是一个示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main() {\n    int *dynamicArray;\n    int size = 5;\n    // 为大小为 5 的整数数组分配内存\n\
    \    dynamicArray = (int*)malloc(size * sizeof(int));\n    // 检查内存分配是否成功\n   \
    \ if (dynamicArray == NULL) {\n        printf(\"Memory allocation failed.\");\n\
    \        return 1;\n    }\n    // 根据需要使用分配的内存\n    // 完成后忘记释放内存\n    free(dynamicArray);\n\
    \    return 0;\n}\n```\n\n"
