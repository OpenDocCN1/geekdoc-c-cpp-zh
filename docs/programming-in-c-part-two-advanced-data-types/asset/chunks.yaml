        char messageType;  // Type indicator (''i'' for integer, ''f'' for float,
    ''s'' for string)


        union {


            int integerData;


            float floatData;


            char stringData[20];


        } data;


    };


    Implementation:


    #include <stdio.h>


    // Define the protocol structure


    struct ProtocolMessage {


        char messageType;


        union {


            int integerData;


            float floatData;


            char stringData[20];


        } data;


    };


    // Function to parse the received protocol message


    void parseProtocolMessage(struct ProtocolMessage message) {


        switch (message.messageType) {


            case ''i'':


                printf("Received Integer Data: %d\n", message.data.integerData);


                break;


            case ''f'':


                printf("Received Float Data: %.2f\n", message.data.floatData);


                break;


            case ''s'':


