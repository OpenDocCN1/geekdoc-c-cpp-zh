    ```c\n#include <stdio.h>\nenum Colors {\n    RED,\n    GREEN,\n    BLUE\n};\n\n\
    void print_color(enum Colors color) {\n    switch (color) {\n        case RED:\n\
    \            printf(\"Red color\\n\");\n            break;\n        case GREEN:\n\
    \            printf(\"Green color\\n\");\n            break;\n        case BLUE:\n\
    \            printf(\"Blue color\\n\");\n            break;\n        default:\n\
    \            printf(\"Unknown color\\n\");\n            break;\n    }\n}\n\nint\
    \ main() {\n    enum Colors selected_color = GREEN;\n    print_color(selected_color);\n\
    \    return 0;\n}\n```\n\nThe switch-case statement in this example is more readable\
