    \n---\n\n# 在 switch 语句中使用枚举的最佳实践\n\n1. **从特定值开始定义枚举**：为枚举常量显式分配值，并从某个特定值开始。这种方法允许在未来进行扩展，而无需对现有元素进行重新编号。\n\
