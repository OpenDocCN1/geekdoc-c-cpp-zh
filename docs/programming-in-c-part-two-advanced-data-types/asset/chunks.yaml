        // Declare a structure variable


        struct Point point;


        // Declare a pointer to the structure


        struct Point *pointPtr;


        // Initialize structure members using the pointer


        pointPtr = &point;


        pointPtr->x = 10;


        pointPtr->y = 20;


        // Access and display structure members


        printf("Coordinates: (%d, %d)\n", point.x, point.y);


        return 0;


    }


    Here, we create a structure Point and use a pointer pointPtr to access and modify
    its members. Understanding pointers is essential for efficient memory management
    and manipulation of complex data structures.


    # Nested Structures


    C allows structures to be nested within other structures, enabling the creation
    of more complex data structures. Let’s explore a scenario where we have a structure
    representing a student, and within it, another structure representing the student’s
    address:


    #include <stdio.h>


    // Define the address structure


    struct Address {


        char street[50];


        char city[50];


        char state[20];


    };


    // Define the student structure with a nested address structure


    struct Student {


        char name[50];


        int age;


        struct Address address;


    };


    int main() {


        // Declare a student structure variable


        struct Student student;


        // Set values for the student and address


        strcpy(student.name, "Alice");


        student.age = 21;


        strcpy(student.address.street, "123 Main St");


        strcpy(student.address.city, "Cityville");


        strcpy(student.address.state, "State");


        // Display student information


        printf("Name: %s\n", student.name);


        printf("Age: %d\n", student.age);


        printf("Address: %s, %s, %s\n", student.address.street, student.address.city,
    student.address.state);


        return 0;


    }


    This example demonstrates the use of nested structures, allowing us to model hierarchical
    relationships between different types of data.


    # Advanced Techniques: Typedef and Anonymous Structures


    Typedef simplifies the creation of complex data types, providing a way to define
    custom names for existing types. Anonymous structures, on the other hand, allow
    the creation of structures without specifying a name. Let’s explore these advanced
    techniques:


    #include <stdio.h>


    // Typedef for a structure


    typedef struct {


        char model[20];


        int year;


    } Car;


    int main() {


        // Declare a variable using the typedef


        Car myCar;


        // Initialize structure members


        strcpy(myCar.model, "Sedan");


        myCar.year = 2023;


        // Display car information


        printf("Model: %s\n", myCar.model);


        printf("Year: %d\n", myCar.year);


        return 0;


    }


    In this example, we use typedef to create a new name Car for the structure without
    explicitly using struct. This enhances code readability.


    Understanding dynamic memory allocation, pointers, nested structures, typedef,
    and anonymous structures broadens your toolkit for working with structures in
    C. These advanced operations empower you to efficiently manage and manipulate
    data, making your C programming endeavors more versatile and robust.


    # Nested Structures


    In the realm of C programming, structures serve as a fundamental building block
    for organizing and storing data. They allow developers to encapsulate related
    variables under a single name, providing a more organized and readable codebase.
    However, the power of structures doesn’t end with their basic form. In this discussion,
    we delve into the intricacies of nested structures, exploring how they enhance
    the versatility and expressiveness of C programs.


    # Understanding Structures in C


    Before delving into nested structures, it’s crucial to comprehend the basics of
    structures in C. A structure is a user-defined data type that allows grouping
    variables of different data types under a single name. This grouping is done to
    facilitate easier management and manipulation of related data elements.


    struct Point {


        int x;


        int y;


    };


    In this example, we’ve defined a structure Point with two members: x and y. These
    members represent the coordinates of a point in a two-dimensional space.


    # The Concept of Nested Structures


    Nested structures, as the name suggests, involve the inclusion of one or more
    structures within another structure. This approach enables the creation of more
    complex data structures, mirroring the hierarchical relationships present in real-world
    scenarios. Let’s extend our understanding with an example:


    struct Date {


        int day;


        int month;


        int year;


    };


    struct Person {


        char name[50];


        struct Date birthdate;


    };


    In this case, we’ve created a Date structure to represent a date with day, month,
    and year. The Person structure, in turn, incorporates the Date structure as one
    of its members. This hierarchy allows us to represent a person’s information along
    with their birthdate in a single, coherent structure.


    # Accessing Members of Nested Structures


    Accessing members of nested structures involves using the dot operator (.) multiple
    times to navigate through the hierarchy. Continuing with our Person example:


    struct Person someone;


    someone.birthdate.day = 15;


    someone.birthdate.month = 12;


    someone.birthdate.year = 1990;


    Here, we access the Date structure within the Person structure to set the birthdate
    of the person.


    # Practical Application: Employee Record


    Let’s further illustrate the concept of nested structures through a real-world
    example—an employee record system. We’ll create structures to represent an employee’s
    personal information and job details:


    struct PersonalInfo {


        char name[50];


        int age;


        char address[100];


    };


    struct JobDetails {


        char position[50];


        double salary;


    };


    struct Employee {


        struct PersonalInfo info;


        struct JobDetails job;


    };


    With these structures in place, we can now easily manage comprehensive employee
    records:


    struct Employee emp1;


    strcpy(emp1.info.name, "John Doe");


    emp1.info.age = 30;


    strcpy(emp1.info.address, "123 Main Street");


    strcpy(emp1.job.position, "Software Engineer");


    emp1.job.salary = 75000.00;


    By utilizing nested structures, we encapsulate personal information and job details
    within a single Employee structure, promoting a more modular and organized code
    structure.


    # Advantages of Nested Structures


    1.  Enhanced Organization: Nested structures allow for a more systematic organization
    of complex data, making the codebase more readable and maintainable.'
