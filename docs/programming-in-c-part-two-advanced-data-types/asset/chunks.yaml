    # Applications in Algorithms


    1\. String Manipulation


    Pointer arithmetic is extensively used in string manipulation algorithms. Let’s
    consider a simple example of reversing a string:


    void reverseString(char *str) {


        char *start = str;


        char *end = str + strlen(str) - 1;


        while (start < end) {


            // Swap characters using pointer arithmetic


            char temp = *start;


            *start = *end;


            *end = temp;


            // Move pointers towards each other


            start++;


            end--;


        }


    }


    This example showcases how pointer arithmetic simplifies string manipulation algorithms.


    2\. Efficient Sorting Algorithms


    Pointer arithmetic contributes to the efficiency of sorting algorithms, such as
    quicksort. By manipulating pointers, we can avoid unnecessary data copying:


    void quicksort(int *arr, int low, int high) {


        // Partition the array using pointer arithmetic


        int pivot = arr[(low + high) / 2];


        int i = low, j = high;


        while (i <= j) {


            while (arr[i] < pivot)


                i++;


            while (arr[j] > pivot)


                j--;


            if (i <= j) {


                // Swap elements using pointer arithmetic


                int temp = arr[i];


                arr[i] = arr[j];


                arr[j] = temp;


                i++;


                j--;


            }


        }


        // Recursive calls


        if (low < j)


            quicksort(arr, low, j);


        if (i < high)


            quicksort(arr, i, high);


    }


    This snippet illustrates how advanced pointer arithmetic enhances the efficiency
    of sorting algorithms.


