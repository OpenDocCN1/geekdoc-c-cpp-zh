    \ memory from this pool.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n\
    #define POOL_SIZE 1000\n\ntypedef struct {\n    char pool[POOL_SIZE];\n    int\
    \ index;\n} MemoryPool;\n\nvoid initializePool(MemoryPool *mp) {\n    mp->index\
    \ = 0;\n}\n\nvoid* allocateMemory(MemoryPool *mp, size_t size) {\n    if (mp->index\
    \ + size > POOL_SIZE) {\n        printf(\"Memory pool exhausted\\n\");\n     \
