    \n// Example functions\nvoid add(int a, int b) {\n    printf(\"Sum: %d\\n\", a\
    \ + b);\n}\n\nvoid subtract(int a, int b) {\n    printf(\"Difference: %d\\n\"\
    , a - b);\n}\n\nint main() {\n    // Declare function pointers\n    void (*operation)(int,\
