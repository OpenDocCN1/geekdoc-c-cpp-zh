    }\n```\n\n在这个示例中，联合体 `SampleUnion` 包含一个整数、一个浮点和一个字符串。程序演示了不同类型的数据如何存储在相同的内存位置。\n\
    \n# 现实应用：配置管理\n\n联合体的一个实际应用是处理具有不同数据类型的配置。想象一种场景，系统配置可以包含整数、浮点数和字符串。使用联合体，我们可以创建一个灵活的数据结构来表示这种需求：\n\
