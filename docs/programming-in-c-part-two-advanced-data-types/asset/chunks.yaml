    \    printf(\"Name: %s\\n\", students[i].name);\n        printf(\"Age: %d\\n\"\
    , students[i].age);\n        printf(\"Grade: %.2f\\n\\n\", students[i].grade);\n\
    \    }\n\n    return 0;\n}\n```\n\n在这个示例中，我们创建了一个名为 `students` 的 `struct Student`\
    \ 数组，能够存储五个学生的信息。程序提示用户输入每个学生的详细信息，然后显示收集到的信息。\n\n## 多维结构体数组\n\n为了处理更复杂的场景，你可能会发现需要多维结构体数组。让我们扩展示例，为每个学生包含多个科目：\n\
    \n```c\n#include <stdio.h>\n\nstruct Subject {\n    char name[30];\n    int marks;\n\
    };\n\nstruct Student {\n    char name[50];\n    int age;\n    struct Subject subjects[3];\
    \  // 用于存储 3 个科目信息的结构体数组\n};\n\nint main() {\n    struct Student students[5];\n\
    \    for (int i = 0; i < 5; ++i) {\n        printf(\"Enter details for student\
