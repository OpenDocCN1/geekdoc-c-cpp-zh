    n\", students[i].age);\n        // 显示科目细节\n        for (int j = 0; j < 3; ++j)\
    \ {\n            printf(\"Subject %d:\\n\", j + 1);\n            printf(\"Name:\
    \ %s\\n\", students[i].subjects[j].name);\n            printf(\"Marks: %d\\n\"\
