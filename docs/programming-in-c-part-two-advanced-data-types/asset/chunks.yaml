    # 1\. Custom String Length Function


    While the standard strlen function calculates the length of a string, let’s create
    a custom function that not only determines the length but also handles strings
    with embedded null characters.


    #include <stdio.h>


    size_t custom_strlen(const char *str) {


        const char *end = str;


        while (*end) {


            ++end;


        }


        return end - str;


    }


    int main() {


        const char *sample = "Hello\0World";


        size_t length = custom_strlen(sample);


        printf("Custom String Length: %zu\n", length);


        return 0;


    }


    This custom strlen implementation considers null characters within the string,
    providing a more comprehensive length calculation.


    # 2\. String Concatenation Beyond strcat


    Creating a custom string concatenation function allows for more control and flexibility.
    Let’s implement a function that concatenates two strings without the need for
    null-terminated strings.


    #include <stdio.h>


    #include <stdlib.h>


    #include <string.h>


    char* custom_strconcat(const char *str1, const char *str2) {


        size_t len1 = strlen(str1);


        size_t len2 = strlen(str2);


        char *result = (char *)malloc(len1 + len2 + 1); // +1 for null terminator


        if (result == NULL) {


            perror("Memory allocation failed");


            exit(EXIT_FAILURE);


        }


        strcpy(result, str1);


        strcpy(result + len1, str2);


        return result;


    }


    int main() {


        const char *firstPart = "Hello, ";


        const char *secondPart = "world!";


