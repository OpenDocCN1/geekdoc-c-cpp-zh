  \ 28 2011\n\nValue of __TIME__ : 18:52:48\n\n# 第 16 章：多线程\n\n多线程可以被视为多任务的一种特殊形式，而多任务可以定义为允许你的系统并发运行多个程序的特性。通常有两种多任务类型。它们是\
