  在多线程程序中，两个或多个部分将并发运行。这些部分中的每一个都称为线程，每个线程都定义了一个与其他部分相互独立的执行部分。\n\nC++ 中没有内置的多线程应用程序。对于多线程，它完全依赖于操作系统。\n\
  \n## 创建线程\n\n为了创建一个 POSIX 线程，我们将使用以下例程。\n\n```cpp\n#include <pthread.h>\n\npthread_create\
  \ (thread, attr, start_routine, arg)\n```\n\n在这里，`pthread_create` 将创建一个新的可执行线程。调用此例程没有限制，它可以被多次调用，并且可以从代码的任何地方调用。参数的描述如下。\n\
