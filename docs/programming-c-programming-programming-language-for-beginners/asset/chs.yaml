  \ |\n| 18 左到右 | `,` | 逗号运算符 | `expression, expression` |\n\n\n\n\n\n## 一元算术运算符：这些只需要一个操作数的算术运算符。以下是一元运算符的表格。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 一元加号 | `+` | `+x` | `x`\
  \ 的值 |\n| 一元减号 | `-` | `-x` | `x` 的取反 |\n\n## 二元运算符\n\n涉及到运算符，基本上有五种。它们是加、减、除、乘和模。每种运算符在下方的表中都进行了解释。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 加法 | `+` | `x + y` |\
  \ `x` 加上 `y` |\n| 减法 | `-` | `x - y` | `x` 减去 `y` |\n| 乘法 | `*` | `x * y` | `x`\
  \ 乘以 `y` |\n| 除法 | `/` | `x / y` | `x` 除以 `y` |\n| 模（取余） | `%` | `x % y` | `x` 除以\
  \ `y` 的余数 |\n\n我们已经了解了加、减、除、乘等基础算术运算符。但我们中的大多数人可能对模并不了解。模运算符也被称为取余运算符。该运算符将返回整数操作数的余数。我们使用该运算符来测试一个数字是偶数还是奇数。如果余数为\
  \ `0`，则该数字为偶数；如果余数为 `1`，则该数字为奇数。\n\n这是一个示例，1 到 100 的每个数字每行打印 20 个。\n\n![](img/00029.jpeg)\n\
  \n### 结果\n\n![](img/00030.jpeg)\n\n## 关系运算符（比较）\n\n关系运算符用于变量之间的比较。C++ 中总共有六种关系运算符。它们在下表所示。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 大于 | `>` | `x > y` |\
  \ 如果 `x` 大于 `y` 则为 true，否则为 false |\n| 小于 | `<` | `x < y` | 如果 `x` 小于 `y` 则为 true，否则为\
  \ false |\n| 大于等于 | `>=` | `x >= y` | 如果 `x` 大于或等于 `y` 则为 true，否则为 false |\n| 小于等于\
  \ | `<=` | `x <= y` | 如果 `x` 小于或等于 `y` 则为 true，否则为 false |\n| 等于 | `==` | `x ==\
  \ y` | 如果 `x` 等于 `y` 则为 true，否则为 false |\n| 不等于 | `!=` | `x != y` | 如果 `x` 不等于 `y`\
  \ 则为 true，否则为 false |\n\n这些运算符对布尔值 `true` 或 `false` 操作。为了让你更好地理解运算符，下面提供了一个包含整数和关系运算符的示例代码。\n\
  \n![](img/00031.jpeg)\n\n上述代码的输出为：\n\n![](img/00032.gif)\n\n## 位运算符\n\n在给定变量内部，位操作运算符用于处理数据的位。早期的计算机存储容量有限，内存非常昂贵。因此，创建了位运算符来解决这个问题。我们总共有六种位操作运算符。它们在下表中解释。\n\
  \n| 运算符 | 符号 | 形式 | 操作 |\n| :--- | :--- | :--- | :--- |\n| 左移 | `<<` | `x << y`\
  \ | `x` 中的所有位左移 `y` 位 |\n| 右移 | `>>` | `x >> y` | `x` 中的所有位右移 `y` 位 |\n| 位取反 | `~`\
  \ | `~x` | `x` 中的所有位进行翻转 |\n| 位与 | `&` | `x & y` | `x` 的每个位与 `y` 的每个位进行与 运算 |\n\
  | 位或 | `|` | `x | y` | `x` 的每个位与 `y` 的每个位进行或 运算 |\n| 位异异 | `^` | `x ^ y` | `x` 的每个位与\
  \ `y` 的每个位进行异或 运算 |\n\n在 C++ 中，我们还有位赋值运算符。这些运算符帮助用户轻松地修改变量。\n\n| 运算符 | 符号 | 形式 |\
  \ 操作 |\n| :--- | :--- | :--- | :--- |\n| 左移赋值 | `<<=` | `x <<= y` | 将 `x` 左移 `y`\
  \ 位 |\n| 右移赋值 | `>>=` | `x >>= y` | 将 `x` 右移 `y` 位 |\n| 位或赋值 | `|=` | `x |= y` |\
  \ 将 `x | y` 赋值给 `x` |\n| 位与赋值 | `&=` | `x &= y` | 将 `x & y` 赋值给 `x` |\n| 位异异赋值 |\
  \ `^=` | `x ^= y` | 将 `x ^ y` 赋值给 `x` |\n\n## 块（Blocks）\n\n块无非一组语句。块也被称为复合语句。它只是编译器视为单个语句的一组语句。它们以\
  \ `{` 和 `}` 符号开始和结束。这些复合语句可以在任何地方代替语句。它们不需要 `;` 来结束语句。这些块可以单独放置，也可以放在另一个块内部。这种块被称为嵌套块。这里是下面示例代码中的块示例。\n\
  \n![](img/00033.jpeg)\n\n这是一个嵌套块的示例。\n\n![](img/00034.jpeg)\n\n使用块非常简单。你可以将块放在块中，而该块又在另一个块内部。这里是一个块中块中块的示例。\n\
  \n![](img/00035.jpeg)\n\n对于块中可以放置多少个块没有限制。但建议只保持三到四层深度。\n\n简单来说，运算符可以被描述为-\n\n运算符是使程序具有功能的小字符。我们已经查看了与\
  \ `iostream` 库关联的两个运算符 `>>` 和 `<<` —— 或输入输出运算符，但还有很多，其中大多数非常有用。运算符可以进行分类，第一类是算术运算符。这些运算符的作用正如其名所示。\n\
  \n你需要注意的是，C++ 按照特定的顺序处理命令，因此在编写代码时，请确保它最终得到你想要的结果。简单的方法不要在单个语句中混合算术运算，而是使用括号——这些括号是告诉\
  \ C++ 在括号内执行的操作。\n\n```\nvar = 5 = 5 * 3;\n```\n\n\n\n\n在上面的示例代码中，控制流有两种可能的路径可以采取。如果条件为真，CPU\
  \ 将去执行 A、B 和 D。但如果条件结果为假，控制流将去执行 A、C 和 D 语句。\n\n## 条件语句\n\n条件语句允许你在代码中形成一个汇点，并将其发送到不同的路径上，而不是保持为线性代码。C++\
  \ 的条件语句是 `if` 语句——如果某个条件为假，程序应该执行一段代码；如果为真，则执行另一段：\n\n![](img/00039.jpeg)\n\n你知道第\
  \ 1 行和第 5 行的意思，但第 3 行稍有不同——这是一个 `if` 语句。它的作用是检查整数变量是否小于 2。如果是，它将运行一段代码；否则，它将正常继续。如果你编译并运行这里写的内容，你将在屏幕上看到打印“a\
  \ is less than 2!”。\n\n## 循环\n\n循环用于需要重复使用代码的程序。它们会将代码放入循环中，直到条件满足为止。想象一下你需要编写一段代码，每行打印从\
  \ 1 到 100 的数字。编写此类程序的代码将非常困难且耗费时间。在这种情况下，我们使用循环。循环保持控制流在循环中，直到条件满足为止。\n\n所以我们的代码现在读取用户输入，它可以根据这些输入执行各种不同的操作，但现在我们将观察如何让这段代码反复执行相同的操作，但带有略有不同的参数。为了做到这一点，我们需要使用循环，循环是一段重复多次不同次数的代码，直到它完成了需要做的事情并且满足了特定的\
  \ C++ 条件。C++ 有三种不同类型的循环：\n\n* `while`\n* `for`\n* `do`\n\n`while` 循环是最容易的，看起来和 `if`\
  \ 语句非常相似：\n\n![](img/00040.gif)\n\n`while` 循环在这里的作用是，只要用户输入的变量是什么，只要它不等于 10，代码就需要从用户处获取某些输入。在\
  \ C++ 中，感叹号 `!` 表示“不”，所以 `!=` 表示不等于。\n\n在这种情况下，如果用户输入已经是 10，则代码将不会执行，循环将被忽略。事实上，`while`\
  \ 循环被看作是一个扩展的 `if` 语句，在代码运行后会回到自身内部。\n\n在继续之前，我想展示一下无限循环是什么样子的，一个一直运行下去的循环：\n\n\
  ![](img/00041.gif)\n\n如你所见，它表示如果 1 等于 1，打印一个 a，以此此类推。\n\n下一个容易的循环是 `do while` 循环，因为它与\
  \ `while` 循环相似。\n\n![](img/00042.gif)\n\n虽然它看起来和 `while` 循环有些不同，但它本质上在做相同的工作，只有一个重要的区别——`while`\
  \ 循环检查条件并查看它是否为真，而 `do while` 循环先运行代码，然后检查条件是否为真。由于这一点，所有的代码都保证会运行。\n\nC++ 的第三种循环是\
  \ `for`，这是最复杂的一个。然而，一旦你理解了它，就会发现它是最强大的。在这里，我们只看最简单的用法：\n\n![](img/00043.gif)\n\n\
  这段代码的意思是，首先将 `i` 的值设置为 2。然后说，只要 `i` 小于 10，它就将该值输出到屏幕上，然后递增 `i`。你必须记住一点——在 `for`\
  \ 循环第一行使用的所有变量必须是同一个变量。同样重要的是，与 `while` 循环不同，第一个语句是赋值而不是条件判断。\n\n这种循环在你想要处理许多数据时非常有用，我将在下一节中更多地讨论。现在，如你所见，它能做的最有用的事情就是抛出一系列数字。这是一个很有用的技巧，并平滑地引导我们进入下一个章节。\n\
  \n## If 语句\n\n`if` 语句是 C++ 中最基本的条件判断语句。它会检查给定的条件，并根据条件的结果改变控制流。\n\n这里有一个带有 `if`\
  \ 语句和它的简单代码。\n\n![](img/00044.gif)\n\n我们已经知道 `if` 语句取一个语句作为条件。我们还知道可以使用代码块（Block）来代替单个语句。这意味着我们可以在\
  \ `if` 语句内部使用代码块作为条件。接下来的示例展示了在 `if` 语句中使用代码块作为条件。\n\n![](img/00045.jpeg)\n\n你可以将一个\
  \ `if` 语句放在另一个 `if` 语句内部。包含另一个 `if` 语句的 `if` 语句被称为嵌套 `if`（nested if）。\n\n这里有两个示例，将帮助你更好地理解嵌套\
  \ `if`。\n\n示例 1：\n\n![](img/00046.jpeg)\n\n示例 2：\n\n![](img/00047.jpeg)\n\n你可以将一个\
  \ `if` 语句封装在一个块中，并可以给它附加一个 `else` 语句。你可以看到下面的示例。\n\n![](img/00048.jpeg)\n\n## 带逻辑运算符的\
  \ If 语句\n\n你可以使用带逻辑运算符的 `if` 语句同时检查多个条件。示例代码如下。\n\n示例：\n\n![](img/00049.jpeg)\n\n\
  ‘if’语句可以用于提前返回（early returns）。提前返回无非回到函数的末尾。\n\n![](img/00050.jpeg)\n\n## Switch\
  \ 语句\n\nSwitch 语句也是改变控制流的语句。Switch 使用使用多路分支。\n\n与 `if-else` 语句相比，switch 语句更为优越，原因如下：\n\
  \n* Switch 语句更容易调试\n* 这些语句易于维护\n* Switch 语句具有更快的执行能力\n* 语句易于阅读\n* Switch 语句的深度是固定的\n\
  * 可用于异常处理\n\nswitch 语句的基本语法如下。\n\n```case constant1:\n    code/s to be executed\
  \ if n equals constant1;\n    break;\ncase constant2:\n    code/s to be executed\
  \ if n equals constant2;\n    break;\n...\ndefault:\n    code/s to be executed if\
  \ n doesn't match to any;\n```\n\n下面的程序展示了为什么与 if-else 语句相比 switch 更容易使用。\n\n示例：\n\
  \n![](img/00051.jpeg)\n\n现在看使用 switch 语句解决的问题。\n\n![](img/00052.jpeg)\n\n## Break\
  \ 语句\n\n我们经常使用 `break` 语句终止 case 语句而不是整个函数。这将指示编译器放弃当前的 case 并继续执行下一个语句。因此，在 `break`\
  \ 语句之后控制流进入 switch 块之后的语句。这是一个在 case 语句后附加 `break` 语句的示例。\n\n![](img/00053.jpeg)\n\
  \n## Goto\n\n为了让 CPU 跳到代码中的不同位置，我们使用了名为 `goto` 语句的流控制语句。为此我们需要设置一个 `goto` 语句可以识别的位置。以下示例中，如果是负数，`goto`\
  \ 语句将控制流带到 tryAgain 标签，在那里必须选择非负数。\n\n示例 1：\n\n![](img/00054.jpeg)\n\n示例 2：\n\n\
  ![](img/00055.jpeg)\n\n## While\n\n在三个循环中，`while`是最简单的。`while` 循环与 `if` 语句非常相似。在这里，条件放在\
  \ `while` 语句之后。这将控制流带回程序开头，并放入循环中直到条件满足为止。\n\n每当循环在成功执行后回到开头时，被称为完成了一次迭代（iteration）。\n\
  \n示例：\n\n![](img/00056.jpeg)\n\n输出将是：\n\n\n\n\n![](img/00057.jpeg)\n\n这是 while 循环的另一个简单示例。\n\
  \n![](img/00058.jpeg)\n\n输出：\n\n![](img/00059.jpeg)\n\n就像 `if` 条件一样，你可以在另一个循环内部使用循环。如果你将一个循环放在另一个循环内部，它就被称为嵌套循环。\n\
  \n嵌套循环的示例：\n\n![](img/00060.gif)\n\n上面的程序将显示：\n\n![](img/00061.jpeg)\n\n## do-while\
  \ 循环\n\n`do-while` 循环与 `while` 循环相似，仅有一处不同。如果 `while` 循环中的条件不满足，我们知道它不会执行循环。但如果我们希望代码即使在条件不满足的情况下至少运行一次，我们可以在\
  \ C++ 中使用 `do-while` 循环。使用该循环即使在条件不满足的情况下也会执行一次代码。下面的示例展示了 `do-while` 循环。\n\n![](img/00062.jpeg)\n\
  \n## for 循环\n\n`for` 循环是 C++ 中最广泛使用的循环语句。如果你知道要迭代多少次，这是一个完美的选择。它很容易使用，因为它允许用户在每次迭代后更改变量。这非常简单，因为你可以在同一个地方一次性声明所有内容。\n\
  \n这是一个 `for` 循环的简单示例。\n\n示例 1：\n\n![](img/00063.jpeg)\n\n上述代码的输出是：\n\n![](img/00064.jpeg)\n\
  \n示例 2：\n\n![](img/00065.gif)\n\n输出：\n\n![](img/00066.jpeg)\n\n## break 和 continue\n\
  \n我们在之前的示例中已经看到过 `break` 语句。在这里我们将 `break` 语句与 `continue` 语句结合使用。我们知道 `break` 语句可以终止该语句以及如\
  \ `while` 循环和 `do while` 循环等循环语句。但当你在函数末的 `switch` 语句中使用它时，它表示 case 已经完成或结束。这是一个显示\
  \ `switch` 和 `break` 结合的示例。\n\n示例：\n\n![](img/00067.jpeg)\n\n当我们在循环中使用 `break` 语句时，可以提前终止循环。下面的示例展示了如何操作。\n\
  \n![](img/00068.jpeg)\n\n在上面的程序中，用户可以输入最多 40 个字符。如果用户按下回车键，循环就可以终止。通过按下回车键，用户可以选择提前终止循环。\n\
  \n### continue 语句\n\n在某些情况下，你需要比正常时间更早地跳回循环开头。这对于跳过该迭代循环的剩余部分非常有用。下面的示例显示了 `continue`\
  \ 语句的。\n\n![](img/00069.jpeg)\n\n在上面的程序中，我们在 `for` 循环使用了 `continue` 语句，它将打印 0 到\
  \ 19 之间所有不能被 4 整除的数字。\n\n## 使用 continue 和 break\n\n通常不建议将 `continue` 与 `break` 配对使用。因为这会导致程序代码执行流的偏差。但如果使用当，`continue`\
  \ 和 `break` 的组合被证明是高效的。这是一个展示此点的的小示例。\n\n![](img/00070.jpeg)\n\n## 随机数生成\n\n某些程序需要生成随机数。除非你提供特定的代码执行，否则计算机无法自己生成随机数。这些随机数专门用于与统计和游戏相关的程序。像在线扑克或骰子游戏这样的游戏使用随机数生成算法来生成随机数。\n\
  \n如果游戏对每个玩家不断生成相同的数字，那会有多么无趣呢？对于像计算机这样只知道真或假值的机器，它们无法自己生成这些随机数。对于此类情况，我们使用伪随机数生成器算法。在这里，计算机将取一个实际上不是随机的数字，称为\
  \ `seed`（种子），并执行数学运算将给定的 `seed` 转换为一个看似随机的不同数字。\n\n高效的随机数生成器将反复执行该过程，并生成与 `seed`\
  \ 完全无关的数字。这些随机数也用于 ATM 机的安全目的。\n\n生成伪随机数并不困难。你将通过下面的示例理解它。此程序生成 100 个伪随机数。\n\n![](img/00071.jpeg)\n\
  \n输出\n\n![](img/00072.jpeg)\n\n你可以从上面的输出看到，所有的数字都是随机的，它们之间没有关系。如果有任何关系，那那也是随机的。\n\
  \n你实际上可以通过使用内置的伪随机数生成器在 C++ 中生成随机数。在这里，你将使用两个函数：`srand()` 和 `rand()`。\n\n`srand()`\
  \ 将设置初始值，或者说设置 `seed` 值。而 `rand()` 获取 `srand()` 的值并开始基于 `srand()` 的值生成随机数。你可以通过下面的示例更好地理解。\n\
  \n![](img/00073.jpeg)\n\n这将生成 100 个随机数\n\n![](img/00074.jpeg)\n\n关于生成的随机数，你可以看到没有哪个数字小于给定的\
  \ `srand()` 值。这是因为该值被作为基准，其他数字据此生成。\n\n# 第 8 章：存储类\n\n在给定的 C++ 程序中，函数定义的存储类有：\n\
  - `auto`\n- `static`\n- `register`\n- `extern`\n\n## auto 存储类\n\n对于所有局部变量，默认存储类是\
  \ `auto`。\n\n示例：\n\n```cpp\nauto int;\n```\n\n## register 存储类\n\n如果你希望定义变量并将其存储在\
  \ RAM 而不是内存中，对于需要快速访问变量可以使用 `register`。\n\n语法：\n\n```cpp\nregister int;\n```\n\n\
  ## static 存储类\n\n与其在局部变量离开作用域时创建并销毁它，`static` 存储类会告诉编译器在其寿命期间存储局部变量。因此，如果你希望局部变量在函数调用期间保持其值，你应该将这些局部变量设置为静态。\n\
  \n`static` 修饰不仅限于局部变量，也可以应用于全局变量。之后，该变量的作用域将被限制在定义它的文件中。\n\n当你对类数据成员使用 `static`\
  \ 时，该类的所有对象将共享同一个副本。这是一个示例。\n\n```cpp\n#include <iostream>\n\n// 函数声明\nvoid func(void);\n\
  \nstatic int count = 10; /* 全局变量 */\n\nmain()\n{\n    while(count--)\n    {\n  \
  \      func();\n    }\n    return 0;\n}\n\n// 函数定义\nvoid func( void )\n{\n    static\
  \ int i = 5; // 局部静态变量\n    i++;\n    std::cout << \"i is \" << i ;\n    std::cout\
  \ << \" and count is \" << count << std::endl;\n}\n```\n\n\n\n\n\n## extern 存储类\n\
  \n有一些全局变量对程序的所有文件都是可见的。`extern` 存储类可以用于提供这些程序文件可见全局变量的引用。你不能使用 `extern` 对变量进行初始化，因为它只会指向一个预定义的存储位置的待定义的名称。\n\
  \n当你有多个文件，并且定义了一个其他文件可以使用的函数或全局变量时，在不同的文件中使用 `extern` 留位符来提供该函数或变量的引用。简单来说，我们使用\
  \ `extern` 来声明存在另一个文件中函数或全局变量。\n\n在多个文件共享相同函数或全局变量的情况下，会使用 `extern` 修饰符。这是一个示例程序。\n\
  \n### 示例：\n\n第一个文件：main.cpp\n\n```cpp\n#include <iostream>\n\nint count ;\n\nextern\
  \ void write_extern();\n\nmain()\n{\n  count = 5;\n  write_extern();\n}\n```\n\n\
  ### 第二个文件：support.cpp\n\n```cpp\n#include <iostream>\n\nextern int count;\n\nvoid\
  \ write_extern(void)\n{\n  std::cout << \"Count is \" << count << std::endl;\n}\n\
  ```\n\n在这里，在这个程序中，`count` 使用 `extern` 关键字在另一个文件中声明。现在，如果你像下面所示组合这两个文件。\n\n```\n\
  $g++ main.cpp support.cpp -o write\n```\n\n将产生一个正确的可执行程序。现在尝试执行它并检查如下所示的结果。\n\n\
  ```\n./write\n5\n```\n\n# 第 9 章：数组\n\n数组无非是一个变量列表，所有变量因为共享共同的用途而被分组在一起。它更像是一种保持一切整洁条齐的方法，正如下面的代码所示：\n\
  \n```cpp\nint a[5]\n```\n\n它看起来像一个标准变量，但请注意方括号的使用。这些括号包含了你在声明中需要的数组大小，或者说是变量的数量，在这种情况下是\
  \ 5 个整数变量。数组可以是任何你认为的大小，只要你的计算机有足够的 RAM 来支持它，但它们在任何时候只能包含一种变量。\n\n当你想要访问某个变量时，只需在方括号中放入数字。只需记住，当\
  \ C++ 标记变量或任何内容时，它是从 0 开始而不是从 1。考虑到计算机是如何理解数字的，这是有道理的。如果你的数组有 8 个项目并且你从数字 1 开始，你的计算机只能读取前\
  \ 7 个位置（二进制 – 1-7）。你可以让它使用 0，但那样 0 就是第一个变量。下面的代码显示了你如何处理访问列表中第一个元素之前的变量：\n\n![](img/00075.jpeg)\n\
  \n你应该记住的一点是，你不应该尝试访问不存在的变量，例如，一个只有 6 个位置的数组中的第 9 个变量，或者实际上没有分配变量的变量。在这种情况下，你将得到所谓的“垃圾”值（garbage\
  \ Value），因为计算机返回的仅仅是如此——垃圾。\n\n在第一种情况下，你会得到一个段错误（segmentation fault），之所以这样命名是因为计算机试图进入一个它无权进入的内存段。这可能导致程序意外终止，并附带错误报告。为了避免这些情况的发生，请在开始之前养成初始化数组每个位置的习惯。普通变量一样，它看起来像这样：\n\
  \n```cpp\nint a[5] = { 0, 0, 0, 0, 0 };\n```\n\n重要 – 注意大括号。这些括号内的每个项目（用逗号隔开）都被分配给数组中的特定变量。第一个被设置为括号内的第一个值，第二个被设置为第二个值，依此类推。如果数组没有填满，每个未分配的变量都将返回\
  \ 0：\n\n```cpp\nint a[5] = { 1 };\n```\n\n你声明了会有 5 个变量，但只指定了 1 个，所以其他的将显示为 0。\n\n\
  数组最常用的用途之一是显示列表，也许是一组人的年龄，或者正如我稍后向你展示的那样，使用它们来协调大型表格和地图的空间。\n\n上面的数组被称为一维数组。这对于列表很有用，但地图呢？在这种情况下，你需要一个二维数组，最简单的方法就是直接添加第二组方括号：\n\
  \n```cpp\nint array[4][5];\n```\n\n所以，第一维显示 4 个整数，第二维是 5 个整数。将数组看作物理地图，我们可以说这一个\
  \ 4 X 5，也可以是 5 X 4。访问数组与访问一维数组相同，区别在于我们使用的方括号数量：\n\n```cpp\ncout << array[0][1];\n\
  ```\n\n就像你处理一维数组一样，你可以批量定义一个多维数组——你只需添加第二组大括号即可：\n\n```cpp\nint array[2][2] = {\
  \ {0, 0}, {1, 1} };\n```\n\n这看起来并没有那么复杂——它只是将第 1 行设置为 0, 0，将第 2 行设置为 1, 1。只要你记住配对括号，一切就能整合。如果你想遍历二维数组，只需在每个循环中放入两个循环：\n\
  \n![](img/0076.gif)\n\n# 第 10 章：类、对象和接口\n\n## 类和对象\n\n设计 C++ 的主要目的是向 C 语言引入面向对象的概念。在面向对象编程中，类是核心特性。这些类被称为用户定义类型。\n\
  \n类可以被视为一个精的包，结合了数据表示和对该数据的操作方法。对象的形式由类指定。类内部的函数数据形成了类的成员。\n\n## 封装\n\n每个 C++ 程序将具有两个基本元素。\n\
  \n*   程序语句（代码）：程序语句是程序中用于执行特定操作的部分这些被称为函数。\n*   程序数据：数据可以被视为给定程序中受程序内函数影响的信息。\n\n\
  \n\n\n\n封装是面向对象编程中的一个概念，它将操作数据的方法和数据本身绑定在一起。封装保护数据免受外部元素的干扰和误用。数据封装产生了一个名为“数据隐藏”的重要面向对象编程概念。\n\
  \n数据数据封装可以定义为一种将数据和使用数据的函数封装在一起的机制。数据抽象可以定义为一种暴露接口并隐藏实现细节的机制。\n\n通过创建名为 `classes`\
  \ 的用户定义类型，可以实现封装和数据隐藏。正如我们所知，一个 `class` 可以包含 `private`、`public` 或 `protected` 成员。在\
  \ `class` 中定义的没有访问说明符的项默认为 `private`。这里有一个示例。\n\n### 示例：\n\n```cpp ownclass Box\n\
  {\n  public:\n    double getVolume(void)\n    {\n        return length * breadth\
  \ * height;\n    }\n  private:\n    double length;      // Length of a box\n   \
  \ double breadth;  // Breadth of a box\n    double height;      // Height of a box\n\
  };\n```\n\n在这里，变量 `length`、`breadth` 和 `height` 是 `private` 的。这意味着只有类 `Box` 的成员被允许访问它们。程序的其他部分无法访问这些变量。这是实现封装的方法之一。\n\
  \n如果你希望类的某些部分是公开的（`public`），你应该使用 `public` 关键字来定义它们。在 `public` 说明符之后定义的所有函数和变量都将被定义为\
  \ `public`，程序中的任何函数都可以访问它们。\n\n将一个特定的类设为另一个类的友（friend）会暴露实现细节并导致封装性的减少。将类的细节从其他类中隐藏起来始终是明智的。应该尽可能多地隐藏类。\n\
  \n任何使用 `private` 和 `public` 成员实现 `class` 的 C++ 程序都可以被视为数据抽象和数据封装的示例。考虑下面的示例。\n\n\
  这里是一个关于数据封装的示例。\n\n### 示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nclass Adder{\n  public:\n    // 构造函数\n    Adder(int i = 0)\n    {\n        total\
  \ = i;\n    }\n    // 外部世界的接口\n    void addNum(int number)\n    {\n        total\
  \ += number;\n    }\n    // 外部世界的接口\n    int getTotal()\n    {\n        return total;\n\
  \    };\n  private:\n    // 对外部世界隐藏的数据\n    int total;\n};\n\nint main( )\n{\n \
  \ Adder a;\n  a.addNum(10);\n  a.addNum(20);\n  a.addNum(30);\n  cout << \"Total\
  \ \" << a.getTotal() <<endl;\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\n\
  Total 60\n\n上面的类将相加并返回它们的和。在这里，成员 `addNum` 和 `getTotal` 是 `public` 的，它们是用户在使用该类时应该知道的接口。虽然类的\
  \ `private` 成员被隐藏了，但它们对于类的正常运行是必须的。\n\n### 设计策略\n\n除非我们想要暴露某些内容，否则通过将其设为 `private`\
  \ 来隐藏类的内容始终是明智的。这是良好的封装。\n\n大多数数据成员保持隐藏状态，但这同样适用于其他成员，包括虚函数。\n\n## C++ 类定义\n\n每当你定义一个\
  \ `class` 时，你基本上是在为特定的数据类型定义一个蓝图。虽然这不会定义任何数据，但它定义了类名的含义，即该类所包含的对象以及可以在这些对象上实现的操作。\n\
  \n类的定义以关键字 `class` 开始，随后是类名以及用大括号括起来的类体。在类名之后应该放置一个声明列表或分号。考虑下面的示例，其中使用 `class`\
  \ 关键字定义了 `Box`。\n\n### 示例：\n\n```cpp\nclass Box\n{\n  public:\n    double length;\
  \  // Length of a box\n    double breadth;  // Breadth of a box\n    double height;\
  \  // Height of a box\n};\n```\n\n`public` 关键字将决定访问权限。范围内的任何人都可以访问类的 `public` 成员。类的\
  \ `private` 成员可以被指定。\n\n## C++ 类定义\n\n每当你定义一个 `class` 时，你基本上是在为给定的数据类型定义一个蓝图。虽然这不会定义任何数据，但它定义了类名的含义，即该类所包含的对象以及可以在这些对象上实现的操作。\n\
  \n类的定义以关键字 `class` 开始，随后是类名以及用在大括号内括起来的类体。在类名之后应该放置一个声明列表或分号。\n\n## C++ 对象\n\n`public`\
  \ 关键字将决定访问权限。范围内的任何人都可以访问类的 `public` 成员。类的 `private` 成员可以被指定。\n\n## 访问数据\n\n通过直接成员运算符（.）的帮助，你可以访问类的成员。这里有一个示例：\n\
  \n### 示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Box\n\
  {\n  public:\n    double length;  // Length of a box\n    double breadth;  // Breadth\
  \ of a box\n    double height;  // Height of a box\n};\n\nint main( )\n{\n  Box\
  \ Box1;\n  Box Box2;\n  double volume = 0;\n\n  Box1.length = 5.0;\n  Box1.breadth\
  \ = 6.0;\n  Box1.height = 7.0;\n  volume = Box1.length * Box1.breadth * Box1.height;\n\
  \  cout << \"Volume of Box1: \" << volume << endl;\n\n  Box2.length = 10.0;\n  Box2.breadth\
  \ = 12.0;\n  Box2.height = 13.0;\n  volume = Box2.length * Box2.breadth * Box2.height;\n\
  \  cout << \"Volume of Box2: \" << volume << endl;\n\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \nVolume of Box1: 210\nVolume of Box2: 1560\n\n你应该始终记住，类的受保护和私有成员不能通过成员运算符（.）直接访问。\n\
  \n## 类与对象的详情\n\n到为止，我们处理了 C++ 中类和对象的基本概念。我们将在下面的子章节讨论更多概念。\n\n| 概念 | 描述 |\n| :---\
  \ | :--- |\n| [类成员函数](https://www.tutorialspoint.com/cplusplus/cpp_class_member_functions.htm)\
  \ | 类的部分可以定义为函数，其原型或定义在类内部，类似于其他变量。 |\n| [类访问修饰符](https://www.tutorialspoint.com/cplusplus/cpp_class_access_modifiers.htm)\
  \ | 类的成员可以声明为公共、保护或私有。成员的默认访问定义总是私有的。 |\n| [构造函数与析构函数](https://www.tutorialspoint.com/cplusplus/cpp_constructor_destructor.htm)\
  \ | 类构造函数可以定义为类内部的一个特殊函数，当在该类创建新对象时被调用。析构函数类似于构造函数，但它在删除创建的对象时被调用。 |\n| [C++ 拷贝构造函数](https://www.tutorialspoint.com/cplusplus/cpp_copy_constructor.htm)\
  \ | 拷贝构造函数是一种构造函数，用于使用已经创建的对象来创建新对象。 |\n| [C++ 友函数](https://www.tutorialspoint.com/cplusplus/cpp_friend_functions.htm)\
  \ | 友函数是可以访问给定类的私有和保护成员的内容。 |\n\n\n\n\n\n| [C++ 内联函数](http://www.tutorialspoint.com/cplusplus/cpp_inline_functions.htm)\
  \ | 在内联函数中，编译器将在函数调用的位置展开函数体内的记录。 |\n| [C++ 中的 this 指针](http://www.tutorialspoint.com/cplusplus/cpp_this_pointer.htm)\
  \ | 在 C++ 中，每个对象都将有一个指向自身的特殊指针。 |\n| [指向 C++ 类的指针](http://www.tutorialspoint.com/cplusplus/cpp_pointer_to_class.htm)\
  \ | 指向类的指针类似于指向结构体的指针。事实上，类可以被看作是一个包含函数的结构体。 |\n| [类的静态成员](http://www.tutorialspoint.com/cplusplus/cpp_static_members.htm)\
  \ | 任何类的成员函数和数据成员都可以声明为静态的。 |\n\n## 接口 (Interfaces)\n\n在 C++ 中，在不提交类实现的情况下，可以通过接口来描述类的能力或行为。\n\
  \nC++ 中的接口是通过抽象类实现的。不要将数据抽象与抽象类混淆。数据抽象是一个不同的概念，其中实现细节与相关数据分离开。\n\n通过将类的任何一个函数声明为纯虚拟函数，可以将该类制为抽象类。你可以通过在它的声明中添加\
  \ `= 0` 来指定纯虚拟函数。如下所示。\n\n```cpp\nclass Box\n{\n  public:\n    // 纯虚拟函数\n    virtual\
  \ double getVolume() = 0;\n\n  private:\n    double length;      // 盒的长度\n    double\
  \ breadth;      // 箱的宽度\n    double height;      // 盒的高度\n};\n```\n\n任何抽象类的主要目的是提供一个适当的基类，以便其他类继承此基类。不能使用抽象类实例化对象。抽象类只能作为接口使用。当尝试实例化抽象类的对象时，将引发编译错误。\n\
  \n如果你希望实例化抽象类的子类，则其每个虚函数都应该被实现。这意味着它将支持由抽象类声明的接口。当在派生类中重写纯虚拟函数失败时，尝试实例化该类的对象将导致编译错误。\n\
  \n在 C++ 中，用于实例化对象的类被定义为具体类（concrete classes）。\n\n### 抽象类示例\n\n在下面的示例中，父类为基类提供了一个实现函数\
  \ `getArea()`的接口。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \n// 基类\nclass Shape\n{\npublic:\n  // 提供接口框架的纯虚拟函数\n  virtual int getArea() = 0;\n\
  \n  void setWidth(int w)\n  {\n      width = w;\n  }\n  void setHeight(int h)\n\
  \  {\n      height = h;\n  }\n\nprotected:\n  int width;\n  int height;\n};\n\n\
  // 派生类\nclass Rectangle: public Shape\n{\npublic:\n  int getArea()\n  {\n    return\
  \ (width * height);\n  }\n};\n\nclass Triangle: public Shape\n{\npublic:\n  int\
  \ getArea()\n  {\n    return (width * height)/2;\n  }\n};\n\nint main(void)\n{\n\
  \  Rectangle Rect;\n  Triangle Tri;\n  Rect.setWidth(5);\n  Rect.setHeight(7);\n\
  \  // 打印对象的面积。\n  cout << \"Total Rectangle area: \" << Rect.getArea() << endl;\n\
  \n  Tri.setWidth(5);\n  Tri.setHeight(7);\n  // 打印对象的面积。\n  cout << \"Total Triangle\
  \ area: \" << Tri.getArea() << endl;\n\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，将产生以下输出。\n\
  \nTotal Rectangle area: 35\nTotal Triangle area: 17\n\n在上面的示例中，接口是通过抽象类根据 `getArea()`\
  \ 定义的。另外两个类也实现了相同的函数，但使用了特定于给定形状的计算面积面积方法。\n\n### 设计策略\n\n抽象基类可以用于面向对象的系统，提供一个适用于所有外部应用程序的标准化且公共接口。然后，可以从该抽象基类继承类，这些类都将以类似的方式运行。\n\
  \n外部应用程序提供的所有能力（公共函数）将作为纯虚拟函数从给定的抽象基类提供。派生类将提供这些纯虚拟函数的实现。每个派生类都对应于特定类型的应用程序。\n\n\
  通过这种架构，你可以在系统定义后向其添加新的应用程序。\n\n## 第 1 章：模板 (Templates)\n\n模板可以被认为是泛型编程的基础。泛型编程涉及与任何类型都无关的代码。你可以将模板认为一个公式或蓝图，通过它可以创建泛型类或函数。泛型编程的几个例子是使用模板概念开发的库容器。每个容器（如\
  \ `vector`）都有单一定义。但可以定义不同的类型。例如 `vector<string>` 或 `vector<int>`。使用模板，除了类之外，还可以很好地定义类。现在我们将看到它是如何运作的。\n\
  \n### 函数模板\n\n模板定义的通用语法如下所示。\n\n```cpp\ntemplate <class type>\nret func-name(parameter)\n\
  {\n    // 函数体\n}\n```\n\n在这里，函数使用了数据类型占位符的字体。在函数定义中可以使用该占位符。这里有一个示例：\n\n示例：下面的函数模板将返回两个值最大值。\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\nusing namespace std;\n\ntemplate\
  \ <typename T>\ninline T& Max (T const& a, T const& b)\n{\n    return a > b ? a\
  \ : b;\n}\n\nint main ()\n{\n  int i = 39;\n  int j = 20;\n  cout << \"Max(i, j):\
  \ \" << Max(i, j) << endl;\n\n  double f1 = 3.5;\n  double f2 = 20.7;\n  cout <<\
  \ \"Max(f1, f2): \" << Max(f1, f2) << endl;\n\n  string s1 = \"Hello\";\n  string\
  \ s2 = \"World\";\n  cout << \"Max(s1, s2): \" << Max(s1, s2) << endl;\n\n  return\
  \ 0;\n}\n```\n\n如果你编译并执行给定代码，将产生以下输出。\n\nMax(i, j): 39\nMax(f1, f2): 20.7\nMax(s1,\
  \ s2): World\n\n### 类模板\n\n在 C++ 中，除了定义函数模板还可以定义类模板。泛型类的语法如下。\n\n语法：\n\n```cpp\n\
  template <class type>\nclass class-name {\n//...\n};\n```\n\n从上述语法可以看出 `type` 是占位符名称。在类的实例化期间指定该名称。可以通过逗号分隔来定义多个数据类型。在下面的示例中，定义了类\
  \ `Stack<>`。`push` 和 `pop` 栈元素的泛方法将被实现。\n\n示例：\n\n```cpp\n#include <iostream>\n\
  #include <vector>\n#include <cstdlib>\n#include <string>\n#include <stdexcept>\n\
  \nusing namespace std;\n\ntemplate <class T>\nclass Stack {\n  private:\n    vector<T>\
  \ elems;    // 元素\n  public:\n    void push(T const&); // 推元素\n    void pop(); \
  \         // 出元素\n    T top() const;      // 返回顶部元素\n    bool empty() const{ //\
  \ 如果为空则返回 true。\n      return elems.empty();\n    }\n};\n\ntemplate <class T>\n\
  void Stack<T>::push (T const& elem)\n{\n  // 追加传递的元素的拷贝\n  elems.push_back(elem);\n\
  }\n\ntemplate <class T>\nvoid Stack<T>::pop ()\n{\n  if (elems.empty()) {\n    throw\
  \ out_of_range(\"Stack<>::pop(): empty stack\");\n  }\n  // 最后一个元素\n  elems.pop_back();\n\
  }\n\ntemplate <class T>\nT Stack<T>::top () const\n{\n  if (elems.empty()) {\n \
  \   throw out_of_range(\"Stack<>::top(): empty stack\");\n  }\n  // 返回最后一个元素的拷贝\n\
  \  return elems.back();\n}\n\nint main()\n{\n  try {\n    Stack<int> intStack; //\
  \ 整数栈\n```\n\n\n\n\n\n```cpp\n        Stack<string> stringStack; // 字符串栈\n\n   \
  \     // 操作 int 栈\n\n        intStack.push(7);\n\n        cout << intStack.top()\
  \ <<endl;\n\n        // 操作字符串栈\n\n        stringStack.push(\"hello\");\n       \
  \ cout << stringStack.top() << std::endl;\n        stringStack.pop();\n        stringStack.pop();\n\
  \    }\n\n    catch (exception const& ex) {\n        cerr << \"Exception: \" <<\
  \ ex.what() <<endl;\n        return -1;\n    }\n}\n```\n\n编译并运行上述代码后，它将产生以下输出。\n\
  \n7\n\nhello\n\nException: `Stack<>::pop(): empty stack`\n\n# 第 12 章：命名空间 (Namespaces)\n\
  \n在实时编程中，你可能会遇到在给定的类中有两个同名对象的情况。为了区分同类中具有相同名称成员，我们必须在它们名称的基础上添加一些额外信息。例如，如果有两个 `Charles`\
  \ 的人，你可以根据他们居住的区域或此类信息来区分他们。\n\n现在考虑这种情况在你的应用程序中发生的情况。例如，如果定义了一个特定名称的函数，而在另一个目录中存在另一个同名函数。在这种情况下，编译器无法区分这两个函数，并且可能不会调用你在代码中引用的那个函数。\n\
  \n为了克服这一困难，我们使用了命名空间 (namespaces)，它们被专门设计用作额外信息，可以添加到函数、变量和类等实体中，这些实体在不同的库中共享相同的名称。通过使用命名空间，可以定义名称所在的上下文。命名空间用于定义一个作用域。\n\
  \n## 定义命名空间\n\n你可以使用 `namespace` 关键字来定义命名空间，后面跟着命名空间的名称。定义命名空间的语法下所示。\n\n语法：\n\n\
  ```cpp\nnamespace namespace_name {\n  // 代码声明\n}\n```\n\n要调用命名空间版本的函数或变量，应该在这些函数前面添加命名空间名称，如下所示。\n\
  \n`name::code;` // code 可以变量或函数。\n\n现在我们将查看命名空间作用域如何包含函数和变量的实体。\n\n示例：\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n\
  \  void func(){\n      cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\n\
  namespace second_space{\n  void func(){\n      cout << \"Inside second_space\" <<\
  \ endl;\n  }\n}\n\nint main ()\n{\n  // 调用第一个命名空间中的函数。\n  first_space::func();\n\
  \  // 调用第二个命名空间中的函数。\n  second_space::func();\n  return 0;\n}\n```\n\n当你编译并运行这段代码时，它将产生以下输出。\n\
  \nInside first_space\n\nInside second_space\n\n## using 指令 (The using directive)\n\
  \n通过 `using namespace` 指令，可以避免添加命名名前缀。该指令将告诉编译器后续代码正在使用指定命名空间中的名称。\n\n你也可以通过 `using\
  \ namespace` 指令来避免添加命名名前缀。该指令告诉编译器随后的代码正在使用指定命名空间中的名称。在以下示例使用了该命名空间。\n\n示例：\n\n\
  ```cpp\n#include <iostream>\n\nusing namespace std;\n\n// 第一个命名空间\nnamespace first_space{\n\
  \  void func(){\n      cout << \"Inside first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\n\
  namespace second_space{\n  void func(){\n      cout << \"Inside second_space\" <<\
  \ endl;\n  }\n}\n\nusing namespace first_space;\n\nint main ()\n{\n  // 这调用第一个命名空间中的函数。\n\
  \  func();\n  return 0;\n}\n```\n\n当上述代码被编译并运行时，它将产生以下输出。\n\n## Inside first_space\n\
  \n命名空间中的特定项可以通过 `using` 指令进行引用。例如，如果你只想在 `std` 命名空间中使用使用 `cout`，则可以如下所示进行引用。\n\n\
  `using std::cout;`\n\n在不以前加给定命名空间名前缀的情况下，后续代码可以引用 `cout`。这仅意味着 `cout` 和 `std` 命名空间中的其他项目将是显式的。在下面的小示例中给出。\n\
  \n示例：\n\n```cpp\n#include <iostream>\n\nusing std::cout;\n\nint main ()\n{\n  cout\
  \ << \"std::cout is used!\";\n  return 0;\n}\n```\n\n如果上述代码被编译并运行，它将产生以下输出。\n\n\
  std::cout is used!\n\n## 嵌套命名空间 (Nested namespaces)\n\n在 C++ 中，允许命名空间的嵌套，一个命名空间可以定义在另一个命名空间内部。嵌套命名空间的语法下所示。\n\
  \n```cpp\nnamespace namespace_name1 {\n  // 代码声明\n  namespace namespace_name2 {\n\
  \    // 代码声明\n  }\n}\n```\n\n通过解析运算符，可以访问嵌套命名空间。使用解析运算符的语法下所示。\n\n语法：\n\n```cpp\n\
  // 访问 namespace_name2 的成员\nusing namespace_name1::namespace_name2;\n\n// 访问 namespace1\n\
  using namespace_name1;\n```\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\n// 第一个命名空间\nnamespace first_space{\n  void func(){\n      cout << \"Inside\
  \ first_space\" << endl;\n  }\n}\n\n// 第二个命名空间\nnamespace second_space{\n  void\
  \ func(){\n      cout << \"Inside second_space\" << endl;\n  }\n}\n\nusing first_space::second_space;\n\
  \nint main ()\n{\n  // 这调用第二个命名空间中的函数。\n  func();\n  return 0;\n}\n```\n\n如果上述代码被编译并运行，它将产生以下输出。\n\
  \nInside second_space\n\n# 第 13 章：继承 (Inheritance)\n\n在面向对象的编程中，继承被认为是一个重要的概念。通过继承，可以根据另一个类来定义类。使得应用程序的创建和维护变得容易。继承提供了更快的实现时间，并且减少了代码的重用。\n\
  \n在创建类时，程序员可以继承已存在类中的成员，从而避免创建新的成员函数和新的数据成员。继承成员的类被称为基类，而新类被称为派生类。\n\n\n\n\n\n`class\
  \ derived-class: access-specifiers base-class`\n\n在这里，访问修饰符可以是 `public`、`private`\
  \ 或 `protected` 之一。基类是一个已经定义的类。如果没有使用访问修饰符，默认它将被视为 `private`。\n\n在下面的示例中，让我们考虑一个名为\
  \ `Shape` 的基类以及派生自该基类的 `Rectangle` 类。\n\n示例：\n\n```cpp\n#include <iostream>\n\n\
  using namespace std;\n\n// 基类\nclass Shape\n{\n  public:\n    void setWidth(int\
  \ w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n    {\n     \
  \   height = h;\n    }\n  protected:\n    int width;\n    int height;\n};\n\n//\
  \ 派生类\nclass Rectangle: public Shape\n{\n  public:\n    int getArea()\n    {\n \
  \       return (width * height);\n    }\n};\n\nint main(void)\n{\n  Rectangle Rect;\n\
  \  Rect.setWidth(5);\n  Rect.setHeight(7);\n  // 打印对象的面积。\n  cout << \"Total area:\
  \ \" << Rect.getArea() << endl;\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \nTotal area: 35\n\n## 访问控制与继承\n\n当一个类派生自基类时，可以访问其派生自基类的非私有成员。如果基类的成员被声明为 `private`，则其派生类无法访问它们。因此，在你不希望派生类访问基类的类成员或函数的情况下，可以将它们声明为\
  \ `private`。\n\n下表根据谁可以访问这些成员总结了不同的访问类型。\n\n| 访问权限 | public | protected | private\
  \ |\n| :--- | :--- | :--- | :--- |\n| 同一类 | yes | yes | yes |\n| 派生类 | yes | yes\
  \ | no |\n| 外部类 | yes | no | no |\n\n尽管派生类继承了其基类的所有类方法，但存在一些例外。\n\n*   构造函数、拷贝构造函数和析构函数不能被派生类继承。\n\
  *   给定基类的重载运算符不能被派生类继承。\n*   派生类不能继承其基类的友函数。\n\n## 继承的类型\n\n当使用基类派生一个类时，基类可以通过`public\
  \ inheritance`公共继承、`protected inheritance`保护继承或`private inheritance`私有继承来继承。访问修饰符用于指定继承的类型。如果不使用访问修饰符，继承默认为\
  \ `private inheritance`。\n\n在编程中，`private` 或 `protected` 继承很少使用。相反，`public inheritance`是最常用的继承类型。在使用不同类型的继承时将应用以下规则。\n\
  \n*   **公共继承 (Public Inheritance)**：当一个类从基类派生时，基类的 `public` 成员在派生类中也也将是 `public`\
  \ 成员。基类的 `protected` 成员也是如此。但在基类的 `private` 成员情况下，它们不能被继承，因为派生类永远无法直接访问它们。`private`\
  \ 成员可以通过调用给定基类的 `protected` 和 `public` 成员来访问。\n*   **保护继承 (Protected Inheritance)**：当一个类从具有\
  \ `protected` 成员的基类派生时，该类所有的 `public` 和 `protected` 成员将成为其派生类的 `protected` 成员。\n\
  *   **私有继承 (Private Inheritance)**：当一个类从具有 `private` 成员的基类派生时，其派生类所有的类成员都将是 `private`。\n\
  \n## 多重继承\n\n在 C++ 中，允许类从多个基类继承成员。多重继承的语法如下。\n\n语法：\n\n`class derived-class: access\
  \ baseA, access baseB....`\n\n在这里，`access` 可以是 `public`、`private` 或 `protected`\
  \ 中的任意一个，并且可以为每个基类声明并用逗号分隔。这里有一个示例。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing\
  \ namespace std;\n\n// 基类 Shape\nclass Shape\n{\n  public:\n    void setWidth(int\
  \ w)\n    {\n        width = w;\n    }\n    void setHeight(int h)\n    {\n     \
  \   height = h;\n    }\n  protected:\n    int width;\n    int height;\n};\n\n//\
  \ 基类 PaintCost\nclass PaintCost\n{\n  public:\n    void setWidth(int w)\n    {\n\
  \        width = w;\n    }\n    void setHeight(int h)\n    {\n        height = h;\n\
  \    }\n  protected:\n    int width;\n    int height;\n};\n\n// 基类\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n << << << << << << << << << <<.()\n <<\
  \ <<\n\n\n << << << << \"::() << endl;\n  return 0;\n}\n```\n\n当你编译并执行上述代码时，它将产生以下输出。\n\
  \nTotal area: 35\nTotal paint cost: 45\n\n## 异常处理\n\n面向对象编程中的异常可以定义为执行正常流的干扰。C++\
  \ 中的异常可以定义为对发生的特殊情况的响应。除以零就是一个例子。C++ 中的异常处理基于 `try`、`catch` 和 `throws` 关键字。我们将详细讨论它们。\n\
  \n*   `throw`：每当出现问题时，程序就会抛出一个异常。这可以使用 `throw` 关键字来实现。\n*   `catch`：抛出的异常将在你希望处理问题的地方捕获。捕获异常由\
  \ `catch` 关键字指示。\n*   `try`：`try` 块的作用是识别激活特定异常的代码块。一个或多个 `catch` 块将跟随 `try` 块。\n\
  \n方法将通过 `try` 和 `catch` 块捕获可能会引发异常的异常。可能会抛出异常的代码块将放在 try/catch 块内部。任何放在 try/catch\
  \ 块中的代码都将被视为受保护代码。try/catch 块的语法如下。\n\n```cpp\ntry\n{\n  // 受保护代码\n}catch( ExceptionName\
  \ e1 )\n{\n  // catch 块\n}catch( ExceptionName e2 )\n{\n  // catch 块\n}catch( ExceptionName\
  \ eN )\n{\n  // catch 块\n}\n```\n\n在预期会有多个异常的情况下，可以添加多个 `catch` 语句来捕获不同类型的异常。\n\n\
  ### 抛出异常\n\n使用 `throw` 语句可以在给定代码块的任何地方抛出异常。异常的类型由该操作数决定。这可以是任何表达式，该表达式的结果将决定抛出的表达式。\n\
  \n这里有一个当给整数除以零时抛出异常的例子。\n\n示例：\n\n```cpp\ndouble division(int a, int b)\n{\n  if(\
  \ b == 0 )\n  {\n    throw \"Division by zero condition!\";\n  }\n  return (a/b);\n\
  }\n```\n\n### 捕获异常\n\n任何引发的异常将被跟随 `try` 块的 `catch` 块捕获。你想捕获的异常类型可以通过确定 `catch` 关键字后面括号内的异常声明来指定。\n\
  \n这里有一个示例。\n\n```cpp\ntry\n{\n  // 受保护代码\n}catch( ExceptionName e )\n{\n  // 处理\
  \ ExceptionName 异常的代码\n}\n```\n\n上述代码将捕获类型为 `ExceptionName` 的异常。你可以在包含异常声明的括号内放入省略号（…）来指定你希望用\
  \ `catch` 块处理的异常类型。如下示例代码所示。\n\n```cpp\ntry\n{\n```\n\n\n\n\n\n```cpp\n// protected\
  \ code\n\n}catch(...)\n\n{\n  // code to handle any exception\n}\n```\n\n下面的示例将抛出一个由于除以零而引起的异常。该抛出的异常将在\
  \ `catch` 块中捕获。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\ndouble\
  \ division(int a, int b)\n{\n  if( b == 0 )\n  {\n    throw \"Division by zero condition!\"\
  ;\n  }\n  return (a/b);\n}\n\nint main ()\n{\n  int x = 50;\n  int y = 0;\n  double\
  \ z = 0;\n  try {\n    z = division(x, y);\n    cout << z << endl;\n  }catch (const\
  \ char* msg) {\n    cerr << msg << endl;\n  }\n  return 0;\n}\n```\n\n在这里，抛出的异常类型为\
  \ `const char*`，捕获此异常时应在 `catch` 块中使用 `const char*`。如果编译并运行上述代码，它将产生以下输出。\n\nDivision\
  \ by zero condition!\n\n## try/catch 块中的控制流\n\n这是一个展示 C++ 异常处理的简单示例程序。这将帮助你更好地理解\
  \ `try/catch` 块的执行流。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
  \nint main()\n{\n  int x = -1;\n  // Some code\n  cout << \"Before try block \\\
  n\";\n  try {\n      cout << \"Inside try block \\n\";\n      if (x < 0)\n     \
  \ {\n        throw x;\n        cout << \"After throw (Never executed) \\n\";\n \
  \     }\n  }\n  catch (int x ) {\n      cout << \"Exception is caught here \\n\"\
  ;\n  }\n  cout << \"After catch block (Will be executed) \\n\";\n  return 0;\n}\n\
  ```\n\n当执行上述代码时，将产生以下输出。\n\nBefore try block\nInside try block\nException caught\
  \ here\nAfter catch block (Will be executed)\n\n## C++ 标准异常\n\n在 C++ 中，所有标准异常的列表定义在\
  \ `<exception>` 中，并可以在程序中使用。这些异常按照所示的父子层次结构列出。\n\n上述异常的描述如表表所示。\n\n| 异常 | 描述 |\n\
  | :--- | :--- |\n| `std::exception` | 此异常是 C++ 中所有异常的父类。 |\n| `std::bad_alloc` |\
  \ 此异常由 `new` 操作符抛出，表示未能分配到请求的空间。 |\n| `std::bad_cast` | 每当对给定引用类型的 `dynamic_cast`\
  \ 失败时，都会抛出此异常。 |\n| `std::bad_exception` | 当发生意外异常时会抛出此异常。 |\n| `std::bad_typeid`\
  \ | 此异常可以由 `typeid` 抛出。 |\n| `std::logic_error` | 当理论上可以通过读取代码检测到异常时，显示此异常。 |\n\
  | `std::domain_error` | 在使用数学上无效的域时会抛出此异常。 |\n| `std::invalid_argument` | 当使用无效参数时会抛出此异常。\
  \ |\n| `std::length_error` | 在创建过大的 `std::string` 时会抛出此异常。 |\n| `std::out_of_range`\
  \ | 可以由例如 `std::vector` 的 `at` 方法和 `std::bitset<>::operator[]()` 抛出。 |\n| `std::runtime_error`\
  \ | 当理论上无法通过读取代码检测到异常时，显示此异常。 |\n| `std::overflow_error` | 在发生数学溢出时会抛出此异常。 |\n|\
  \ `std::range_error` | 当尝试存储的值超出范围时，会抛出此异常。 |\n| `std::underflow_error` | 在发生数学下溢时会抛出此异常。\
  \ |\n\n## 定义新异常\n\n在 C++ 中，你允许定义自己的异常。这可以通过继承和重写异常类的功能来实现。在下面的示例中，你可以看到如何使用 `std::exception`\
  \ 类来实现你自己的异常。\n\n示例：\n\n```cpp\n#include <iostream>\n#include <exception>\n\nusing\
  \ namespace std;\n\nstruct MyException : public exception\n{\n  const char * what\
  \ () const throw ()\n  {\n    return \"C++ Exception\";\n  }\n};\n\nint main()\n\
  {\n  try\n  {\n    throw MyException();\n  }\n  catch(MyException& e)\n  {\n   \
  \ std::cout << \"MyException caught\" << std::endl;\n    std::cout << e.what() <<\
  \ std::endl;\n  }\n}\n```\n\n上述代码将产生：\nMyException caught\nC++ Exception\n\n`what()`\
  \ 方法是由异常类提供的。\n\n## 15: 预处理器\n\n在 C++ 中，预处理器在实际编译之前指示编译器。每个预处理器指令都以 `#` 开头。\n\n\
  ### #define\n\n`#define` 指令用于创建符号常量。其语法如下所示。\n\n示例：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\n#define PI 3.14159\n\nint main ()\n{\n  cout << \"Value\
  \ of PI :\" << PI << endl;\n  return 0;\n}\n```\n\n现在，如果你使用 `-E` 选项编译代码，结果将重定向到\
  \ `.p` 文件。如果你打开 `.p`，你将看到符号已被替换。\n\n## 函数形式宏\n\n你可以使用下述的 `#define` 预处理器定义带有参数的宏。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\n#define MIN(a,b) (((a)<(b))\
  \ ? a : b)\n\nint main ()\n{\n  int i, j;\n  i = 100;\n  j = 30;\n  cout << \"The\
  \ minimum is \" << MIN(i, j) << endl;\n  return 0;\n}\n```\n\n## 条件编译\n\n你实际上可以编译代码的选择性部分，而不是编译整个程序。在\
  \ C++ 中，有几个指令允许你编译源代码的选部分。这个过程被称为条件编译。\n\n条件预处理器的结构类似于选择结构。考虑以下示例。\n\n```cpp\n#ifndef\
  \ NULL\n  #define NULL 0\n#endif\n```\n\n可以为了调试目的编译程序，并且可以通过单个宏开启或关闭调试。其语法如下所示。\n\
  \n```cpp\n#ifdef DEBUG\n  cerr << \"Variable x = \" << x << endl;\n#endif\n```\n\
  \n在上述代码中，如果在使用 `#ifdef DEBUG` 指令之前定义了 `DEBUG` 符号常量，则 `cerr` 语句将被编译。你可以使用 `#if 0`\
  \ 语句注释掉程序的一部分。如下所示。\n\n```cpp\n#if 0\n  /* This is commented part */\n#endif\n```\n\
  \n\n\n\n\n```cpp\ncout <<\"The minimum is \" << MIN(i, j) << endl;\n\n#ifdef DEBUG\n\
  \  cerr <<\"Trace: Coming out of main function\" << endl;\n#endif\n\n  return 0;\n\
