- "# C++ 编程：C++ 编程：编程语言初学者指南：一天学会（C++, Javascript, PHP, Python, Sql, HTML, Swift）\n\
  \n\n\n![](img/cover.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 结语\n入门可能是所有计算机语言中最难对付之一，但只要有正确的热情和正确的态度，你就能驯服它并让它为你服务。如果你已经涉足计算机编程的世界，那么你一定听过\
  \ C++，并且无疑听过人们谈论学习它有多么困难，以及你永远不要选择它作为学习计算机语言的起点。\n\n这两种说法都是错误的。一旦你理解了基础知识，C++ 学习并没有那么困难，而且它绝对应该是你开启成为程序员之旅的首选第一种语言。是的，你会发现某些事情很困难，但学习某些简单到闭着眼睛都能做到的事情是没有乐趣的。你需要挑战来使其入脑，而且语言越有挑战性，学习起来就越容易。\n\
  \n还有其他更容易的语言供你开始，但没有一种语言像 C++ 那样强大或灵活。公平地说，大多数操作系统、编译器、应用程序驱动程序以及许多软件都是用 C++ 编写的，所以为什么不把它作为你学习新编程语言的第一站呢？\n\
  \n我将在一天内教你成为一名程序员！\n\n# 第 1 章 - 什么是 C++？\n\n## 编程语言简介\n如你所知，程序无非是一组指令。这些指令由物理计算机机器的硬件执行。虽然现代计算机运行很快，但它们也有自己的局限性。计算机只能理解以原生语言给出的指令。为此，你应该理解机器语言、汇编语言和高级语言的概念。\n\
  \n## 机器语言\n尽管计算机是非常先进的机器，但它们无法直接理解 C++ 这样的语言。计算机只理解 0 和 1。它们被称为位（bits）。它们只能理解以二进制格式给出的指令。我们给计算机的每组指令都会翻译成告诉处理器执行特定任务的指令。你应该理解不同类型的处理器具有不同类型的指令集。例如，`Pentium`处理器只理解它们自己的指令集。Macintosh\
  \ 也是如此。在最开始，程序员必须用二进制语言编写指令。这非常耗时且困难。幸运的是，我们不再需要经历这一切。\n\n## 汇编语言\n由于机器语言非常难以处理，发明了一种称为汇编语言的新语言。在这里，每条指令都被赋予一个短名称，变量被名称取代了二进制位，这使得程序员编写代码变得容易。你可能会问，计算机如何理解汇编语言。它不能理解。汇编语言将在汇编器的帮助下被转换为机器语言。你应该记住，每个\
  \ CPU 都有自己的汇编语言。因此，一个 CPU 的汇编语言不能在另一个 CPU 上运行。即使是汇编语言也有它的缺点。即使是简单的任务也需要大量的指令集。\n\
  \n## 高级语言\n\n\n\n\n高级编程语言的出现是为了解决汇编语言和机器语言引起的问题。这些语言可以在任何计算机上运行。高级语言带有一个名为 `compiler`（编译器）的程序。`compiler`的作用是生成\
  \ CPU 可以直接理解的可执行文件或程序。这些程序是独立程序。今天现现代编译器非常高效且快速，可以将代码转换为可执行的格式。一些编程语言使用 `interpreter`（解释器）。`interpreter`的工作是执行代码，但不将其编译为机器码。但在这里我们不会学习解释器。任何给定的编程语言都可以被解释或编译。像\
  \ `C`、`C++` 和 `PASCAL` 这样的语言是编译的，而像 `JavaScript` 和 `Perl` 这样的脚本语言是解释的。\n\n问这个问题，你会得到几十种不同的答案，但简单来说，`C++`\
  \ 是一种编译型的、面向对象的计算机编程语言。如果你是编程初学者，即使是这可能让你感到有些困惑，所以让我们再进一步拆解一下。\n\n编程语言有两种类型——一种是解释型，另一种是编译型。解释型语言在\
  \ `interpreter` 上运行——该解释器读取代码并逐条执行其中的命令。编译型语言由你计算机中的 CPU 读取，而不是通过程序。计算机无法读取字母；它们只能读取二进制数字，所以，当你编写代码时，它必须先转换为二进制数字。这被称为编译。\n\
  \n解释中的“面向对象”部分只是描述了代码的结构，但我稍后会进行更详细的介绍。\n\n## 这对我意味着什么？\n\n要成功学习 `C++`，你需要同时使用文本编辑器和一个\
  \ `compiler`。如果你在 Windows PC 上进行这些操作，可以使用电脑上已安装的 `Notepad`（记事本）作为你的文本编辑器，而你的 `compiler`（将将你的代码转换为可执行的格式）应该使用\
  \ `GNU C/C++`。\n\n### Linux/Unix\n\n检查你的 Linux/Unix 计算机上是否安装了 `GCC` 的简单方法是打开命令行并输入：\n\
  \n```bash\ng++ -v\n```\n\n如果安装了 `GCC`，你将获得以下消息或非常类似的内容：\n\n```\nUsing built-in specs\n\
  Target: i386-redhat-linux\nConfigured with: ../configure --prefix=/usr .......\n\
  Thread model: POSIX\ngcc version 4.1.2 20080704 (Red Hat 4.1.2-46)\n```\n\n如果未安装\
  \ `GCC`，你可以按照 [`gcc.gnu.org/install/`](http://gcc.gnu.org/install/) 上的说明进行。\n\n\
  ### Mac OS X\n\n为 Mac OS X 获取 `GCC` 的最佳方法是 [`developer.apple.com/technologies/tools`](http://developer.apple.com/technologies/tools)，下载\
  \ `xCode` 并遵循安装说明。\n\n### Windows\n\n要在你的 Windows PC 上获取 `GCC`，你必须先从 [`www.mingw.org`](http://www.mingw.org)\
  \ 下载 `MinGW`。确保下载了最新版本的 `MinGW`，并安装 `gcc-core`、`binutils`、`gcc-g++` 和 `MinGW runtime`——这些是最低要求。\n\
  \n你可以考虑的另一点是 IDE —— 集成开发环境。这种文本编辑器具有集成编译器和语法高亮。最好用的是 `Code::Blocks`。\n\n## 还有我需要知道的吗？\n\
  \n是的。`C++` 的语法非常严格，且所有内容都是区分大小写的，所以要小心你输入的内容。在 `C++` 中，单词“Hello”和“hello”的含义不同，但你将在书的后面学到更多。现在，让我们直接开始编程。\n\
  \n在我们进入过多的细节之前，让我们先开始编写一段简单的代码。这是所有类型计算机编程教程的常见示例，所以，话不多说，让我们来拆解它。首先，代码编写如下：\n\n\
  ![](img/00001.jpeg)\n\n第 1 行是在告诉你的计算机，你想将 `iostream` 库链接到你的程序中。库是一个存储一小段代码的地方，有时还会存储变量和操作符。`iostream`\
  \ 库中的代码允许我们将字符移动到文本流中，然后显示在屏幕上。\n\n第 2 行告诉计算机，我们想使用标准命名空间（namespace）——这是存储代码的地方，如果你编写了两段名称相同的代码，这会很有用。\n\
  \n第 4 行是代码的开始。大括号内的所有内容都是 `compiler` 读取并翻译的——这一行必须出现在你写的每一个程序中，否则什么都不会发生。\n\n下一阶段是打印程序，在例中是“Hello,\
  \ World!”。在这里我们使用了存储在 `iostream` 中的一些代码——一段被称为 `cout` 的代码。代码后面的 `<<` 是一个操作符，它翻译为“输出”，意味着我们正在告诉计算机将代码发送到指定的流。打印“Hello,\
  \ World!”被称为字符串（string），它无非是用双引号括的字符序列。注意该行以分号结尾——这在告诉计算机代码已结束，如果不使用，程序将无法编译。\n\n\
  第 8 行始终位于 `main` 的末尾，用于告知计算机该代码块已完成。\n\n现在你已经有了程序的源代码，必须使用你的 `compiler` 对其进行编译。更多细节稍后说，首先我想开始介绍构成你代码的内容。\n\
  \n\n\n我们都知道，在任何语言中，句子都是按照该语言特定的语法规则构建的。以英语为例，我们通常在句末使用句号。所有支配某种语言句子构建的规则被称为语法（syntax）。同样，C++\
  \ 也有它的语法。不遵守语法将直接导致你的代码无效。编译器的职责是确保符合 C++ 语言的基础语法。如果你违反了基础语法，编译器将无法编译代码并对语法违反进行报错。该问题被称为语法错误（syntax\
  \ error）。只有在没有发现语法错误的情况下，C++ 编译器才会编译程序。它会显示所有发现的错误，并建议你对它们进行修复，以便能够在无错误的情况下执行代码。\n\
  \n## 编译你的第一个程序\n\n在编写第一个程序之前，有两件重要的事情需要了解。\n\n1. 你的程序将写在 `.cpp` 文件中，这些文件后会被添加到你的项目中。项目也被称为工作区（workspaces）或解决方案（solutions）。代码文件和\
  \ IDE 设置将保存到你的项目中。\n\n2. 你应该通过创建一个新项目来开始，因为有很多种项目。在开始之前，你需要指定你想要工作的项目类型。\n\n###\
  \ 是什么构成了 C++ 代码？\n\n变量是存储值的东西。它像一个盒子，每个盒子上都有一个名称和一个类别，而类别是存储在其中的物品的类型——名称是具体的变量名。每个变量都有特定的类型、名称和大小，这些属性精确决定了里面可以存储什么。在我们继续之前，这里有一份你将用到的变量列表：\n\
  \n* `Int` - 整数（Whole numbers）\n* `Bool` - 真或假（0 或 1）\n* `Float` - 小数（Fractional\
  \ number）\n* `Double` - 精度是倍的浮点数\n* `Char` - 单 ASCII 字符\n\n### 使用变量\n\n以下代码演示了如何使用它们：\n\
  \n![](img/00002.jpeg)\n\n这大部分内容你在上一个代码中已经见过，唯一没见过的是第 4 行和第 7 行——第 4 行声明了变量，在这种情况下是一个整数。声明仅仅是告诉编译器我们将使用这个变量，后面紧跟着变量的名称。你可以给变量起任何喜欢的的名字，但要保持简单且相关联，并确保它不是\
  \ C++ 中已经具有含义的保留关键字。以小写字母开头。语句的结束以分号完成。\n\n第 7 行被称为赋值（assignment）。这为变量分配了一个值，`=`\
  \ 是运算符——这就是执行赋值的操作。`=` 之后的值被称为二元运算符（binary operator）。\n\n注意，这次 `cout` 语句周围没有双引号。这是因为我们不是在显示字符串，而是在输出值。现在编译程序将在屏幕上打印“42”。\n\
  \n除了类型之外，变量还可以在声明中添加一个前缀，这些前缀会改变变量的行为。有些会改变变量的大小，而另一些允许你或阻止你使用负数，而另一些则执行完全不同的工作。几乎所有的都会在这里讨论。\n\
  \n## 大小变化\n\n有两个特定的前缀可以改变变量的字节大小——`short` 和 `long`。背后的想法是允许变量存储更多的值和更大的数字。大小取决于你使用的计算机架构：\n\
  \n* 在 32 位计算机上，`int` 和 `long int` 都是 4 字节\n* 在 64 位计算机上，`int` 是 4 字节，`long int`\
  \ 是 8 字节\n* 在两种架构上，`short int` 都是 2 字节\n\n除了以下几点，没有什么是规定这些特定关键字修饰符：\n\n* `Short`\
  \ 必须等于或小于普通变量\n* 反之，普通变量必须等于或小于 `long`\n* 唯一可以带前缀的变量是 `int`\n\n更混乱的是，你实际上可以省略 `int`\
  \ 只使用 `long` 或 `short`，例如：\n\n1. `short int s = 0;`\n2. `int i = 0;`\n3. `long int\
  \ l = 0;`\n5. `short s2 = 0;`\n6. `long l2 = 0;`\n\n## 符号改变\n\n还有两个前缀可以限制类型存储的值——`signed`（有符号）和\
  \ `unsigned`（无符号）。有符号变量可以存储负值正值，而无符号变量只能取正值。\n\n## 其他前缀\n\n在 C++ 中可以使用一些其他前缀，它们并不常见，我们大多数我们不会使用，书中也不会涵盖。但有两个非常有用的前缀——`const`\
  \ 和 `static`。前者是常量，永远不改变其值，而后者保持变量的值不变，但仅在函数调用之间；那是一个以后的话题。\n\n## 类型组合\n\n前缀可以链式使用，所以看到类似的内容并不罕见：\n\
  \n1. `static unsigned long int`，或者\n2. `signed const char`\n\n只要它们在变量类型之前，你可以按照任何喜欢的顺序放置它们。\n\
  \n关于变量的另外一点——你只能在声明它们的区域内使用它们\n\n## C++ 中的枚举\n\n在 C++ 中，枚举（enumeration）可以被定义为用户类型，可以包含给定的任何名称。其语法如下：\n\
  \n```cpp\nenum seasons { spring, autumn, winter };\n```\n\n变量 `s` 在 `main()` 函数中定义为\
  \ `seasons` 类型，该变量能够存储其中任何一个值。这是一个示例：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nenum seasons { spring, summer, autumn, winter };\n\nint main() {\n   \
  \ seasons s;\n    s = spring;\n    std::cout << \"spring = \" << s << std::endl;\n\
  \    s = summer;\n    std::cout << \"summer = \" << s << std::endl;\n    s = autumn;\n\
  \    std::cout << \"autumn = \" << s << std::endl;\n    s = winter;\n    std::cout\
  \ << \"winter = \" << s << std::endl;\n    return 0;\n}\n```\n\n输出：\nspring = 0\n\
  summer = 1\nautumn = 2\nwinter = 3\n\n在这里，有一点你应该记住，`spring`、`summer`、`autumn` 和\
  \ `winter` 不是变量。编译器将它们视为整数。一旦枚举常量在程序中定义，其值就无法更改。考虑这个示例：\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nenum seasons { spring = 34, summer = 4, autumn = 9, winter\
  \ = 32};\n\nint main() {\n    seasons s;\n    s = summer;\n    std::cout << \"summer\
  \ = \" << s << std::endl;\n    return 0;\n}\n```\n\n输出：\nsummer = 4\n\n默认值可以在枚举声明期间更改，你可以赋予它想要的值。\n\
  \n\n\n\n既然我们已经了解了变量的工作原理，现在是时候在程序中使用它们了。不过，目前我们能做的只是设置变量的值并输出它，这在创建适当的 C++ 程序时并不十分好用。我们需要一种操作变量并获取输入的方法，这就是\
  \ `iostream` 库的用场。\n\n我们知道这个库能够输出数据，它也能接收输入数据。允许它执行此操作的命令是 `cin`，与 `cout` 相反。区别在于\
  \ `cin` 后面的运算符是反过来的——我们不是输入 `<<`，而是 `>>`。\n\n1. `cout << \"string\";`\n2. `cout\
  \ << var;`\n4. `cin >> var;`\n\n`iostream` 比此强大得多，它允许你组合多个语句。例如，如果你想输出两个字符串或变量，你需要写两条语句。通过\
  \ `iostream`，你可以将多个 `cout` 语句组合在一起，产生短得多的代码：\n\n```cpp\ncout << \"Hello, \" << \"\
  World!\";\n```\n\n你也可以对 `cin` 语句执行相同的操作，但记住不要在同一行中混合输入和输出。\n\n## 新程序\n\n现在我们知道了如何输入输出数据，就可以编写更有用的程序了。通过这个例子，我们将改进“Hello,\
  \ World!”程序：\n\n![](img/00003.jpeg)\n\n你可以看到，我们在标准空间中声明了 `iostream`，然后声明了一些变量，但方式与之前略有不同，即将将赋值与声明结合起来——这被称为**初始化**。\n\
  \n其余部分是代码，在这种情况下，计算机程序将询问用户年龄，引导用户输入到程序中。接着它会询问用户最喜欢的字母表字母是什么。注意 `\\` 后面跟 `n` 的使用——这表示需要换行。\n\
  \n## 变量\n\n在 C++ 中，可用的只是一块可以存储信息的内存。可以使用变量来存储和检索信息。每当分配一个新变量时，RAM 内存的一部分会被分配给该变量。有不同类型的变量，每种都有特定的用途。对于字符有字符变量，数字有整数变量，对于小数我们有\
  \ `float` 变量等。\n\n如果你想定义一个变量，应该使用声明语句。\n\n我们将查看 `int` 变量以便你更好地理解变量。\n\n```cpp\n\
  int x;\n```\n\n这仅仅是定义了一个整数变量 `x`。整数变量的目的是存储数值数据。 \n\n这里是赋值语句的示例：\n\n```cpp\nint\
  \ y;               // 定义 y 为整数变量\ny = 4;               // 4 求结果为 4，然后赋值给 y\ny =\
  \ 2 + 5;           // 2 + 5 求结果为 7，然后赋值给 y\nint x;               // 定义 x 为整数变量\n\
  x = y;               // y 求值为 7（来自上文），然后赋值给 x。\nx = x;               // x 求值为 7，然后赋值给\
  \ x（没用！）\nx = x + 1;           // x + 1 求结果为 8，然后赋值给 x。\n```\n\n## 未初始化的变量\n\n在\
  \ C 和 C++ 等语言中，变量不会用像 `0` 这样的标准值进行初始化。它会被分配一个默认的垃圾值。这种变量被称为**未初始化变量**。\n\n# 第 4\
  \ 章：指针\n\n## 指针\n\nC++ 中的指针非常易学且有趣。某些任务可以使用指针轻松地完成，而另一些任务如果不使用指针是无法完成的。\n\n正如你所知，在\
  \ C++ 中每个变量都被分配了一个内存位置，并且每个内存位置都定义了一个地址。可以使用 `&` 运算符通过内存位置访问每个变量。`&` 运算符用于表示内存地址。在下面的示例中，将定义变量的地址。\n\
  \n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n\
  \  int var1;\n  char var2[10];\n  cout << \"Address of var1 variable: \";\n  cout\
  \ << &var1 << endl;\n  cout << \"Address of var2 variable: \";\n  cout << &var2\
  \ << endl;\n  return 0;\n}\n```\n\n当你编译并执行上面的代码时，将产生以下输出。\n\nAddress of var1 variable:\
  \ `0x...`\nAddress of var2 variable: `0x...`\n\n## 什么是指针？\n\n当你编译并执行上述代码时，将产生以下输出。\n\
  \nAddress of var1 variable: `0x...`\nAddress of var2 variable: `0x...`（注：原文带有占位符输出值，逻辑保持）。\n\
  \nC++ 中的指针非常易学且有趣。某些任务可以使用指针轻松地完成，而另一些任务如果不使用指针是无法完成的。\n\n正如你所知，在 C++ 中每个变量都被分配了一个内存位置，并且每个内存位置都定义了一个地址。可以使用\
