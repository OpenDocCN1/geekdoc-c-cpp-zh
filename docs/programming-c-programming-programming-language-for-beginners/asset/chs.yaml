  `char *ch;`\n\n## 使用指针\n\n使用指针有一些重要的任务。这里有几个示例：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nint main ()\n{\n  int var = 20;\n  int *ip = &var;\n \
  \ cout << \"Value of var: \" << var << endl;\n  cout << \"Address of var: \" <<\
  \ ip << endl;\n  cout << \"Value via pointer: \" << *ip << endl;\n  return 0;\n\
  }\n```\n\n\n\n\n| [向函数传递指针](http://www.tutorialspoint.com/cplusplus/cpp_passing_pointers_to_functions.htm)\
  \ | 通过按地址传递参数或按引用传递参数，传递的参数可以被调用函数在调用函数中进行修改。 |\n| [从函数返回指针](http://www.tutorialspoint.com/cplusplus/cpp_return_pointer_from_functions.htm)\
  \ | 在 C++ 中，指针可以由函数返回给静态变量、局部变量以及动态分配的内存。 |\n\n# 第 5 章：函数\n\n函数无非就是那些为了执行特定任务而可以重复使用的语句，正如你已经熟悉过使用\
  \ `main()` 函数一样。有时你可能需要程序停止当前正在的操作并做其他事情，以便高效地工作。这是我们一直在做的事情。例如，你可能正在做某件事，然后暂停一下去喝杯咖啡。在\
  \ C++ 编程中使用函数时，这也是一个类似的情况。\n\n它将继续按顺序执行语句，直到遇到函数调用。函数调用无非就是一个表达式，它指示 CPU 暂停当前函数以执行另一个函数。CPU\
  \ 将只是中断当前函数，并继续执行函数调用中提到的函数。一旦函数调用中的函数终止，CPU 将返回到它正在工作的上一个函数的执行。\n\n这里有一个示例程序，向你展示了如何定义和调用函数。\n\
  \n![](img/00004.jpeg)\n\n上述代码将显示以下输出：\n\n![](img/00005.jpeg)\n\n## 返回值\n\n在 `main`\
  \ 完成代码执行后，它将把值返回给调用者。这可以通过使用 `return` 语句来实现。如果函数的返回类型为 `void`，它将不返回任何值。如果返回类型是 `int`，它将返回一个整数值。\n\
  \n例如：\n\n![](img/00006.jpeg)\n\n这是一个在程序中使用函数的示例。\n\n![](img/00007.jpeg)\n\n如你所见，在第一次函数调用中，使用\
  \ `return5()` 语句返回了值 5。在那里，值 5 将返回给调用者，相同的值将传递给 `cout` 语句。\n\n当涉及到第二个函数调用时，执行 `return5()`\
  \ 并返回 5。然后执行 `5+2`，并将 7 发送到 `cout` 语句。\n\n当第三条语句时，调用了 `returnNothing()`，它将简单地不返回任何内容。\n\
  \n第四次函数调用时，函数没有返回内容，控制权返回到 `main()`。\n\n## 返回主函数\n\n当程序执行时，操作系统将对 `main()` 函数进行函数调用。然后执行将跳回名称的开头，`main`\
  \ 中存在的语句将按顺序执行。最后，一个整数值将返回给 `main`。这就是为什么 `main()` 被定义为 `int main()` 的原因。始终小心不要在\
  \ main 函数旁边使用 `;`，因为它会终止 main 函数且不会允许程序执行继续进行。当你使用 `void main()` 时，编译器不关心返回函数，只会返回任何内容。\n\
