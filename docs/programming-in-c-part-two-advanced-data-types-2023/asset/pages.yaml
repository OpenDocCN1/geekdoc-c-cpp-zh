    # Common Pitfalls and Best Practices


    #  1. Dangling Pointers


    Dangling pointers arise when a pointer points to memory that has been deallocated.
    To avoid this:


    +   - Set pointers to NULL after freeing memory.


    +   - Avoid accessing memory through pointers that have been freed.


    ```

    int *ptr = (int*)malloc(sizeof(int));


    // ... code ...


    free(ptr);

    ptr = NULL; // Avoids dangling pointer

    ```


    # 2. Memory Overflows and Underflows


    Buffer overflows and underflows can lead to unpredictable behavior. Always ensure
    proper bounds checking, especially when dealing with arrays.


    ```

    int array[5];

    ```'
