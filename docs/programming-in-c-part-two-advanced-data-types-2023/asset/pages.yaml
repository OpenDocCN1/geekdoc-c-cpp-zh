    \ we want to model the lifecycle of a task:\n\n```\n#include <stdio.h>\n\n// Define\
    \ an enumeration for task states\nenum TaskState {\n    IDLE,\n    STARTED,\n\
    \    IN_PROGRESS,\n    COMPLETED,\n    FAILED\n};\n\n// Function to handle state\
    \ transitions\nvoid transitionState(enum TaskState *current_state, enum TaskState\
    \ new_state) {\n    printf(\"Transitioning from %d to %d\\n\", *current_state,\
    \ new_state);\n    *current_state = new_state;\n}\n\nint main() {\n    enum TaskState\
