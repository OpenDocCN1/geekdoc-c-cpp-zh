    \ <stdio.h>\n#include <fcntl.h>\n#include <sys/mman.h>\n#include <unistd.h>\n\n\
    int main() {\n    int fileDescriptor = open(\"example.txt\", O_RDWR);\n    off_t\
    \ fileSize = lseek(fileDescriptor, 0, SEEK_END);\n\n    // Memory mapping the\
    \ file\n    char *fileContent = mmap(NULL, fileSize, PROT_READ | PROT_WRITE, MAP_SHARED,\
    \ fileDescriptor, 0);\n\n    // Modifying the file content using memory mapping\n\
