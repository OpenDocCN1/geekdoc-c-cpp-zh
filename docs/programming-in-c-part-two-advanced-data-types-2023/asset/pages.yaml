  md: "# 1. Compiler-specific Attributes\n\nMany compilers provide attributes to control\
    \ structure alignment. For example, in GCC, the __attribute__((aligned(n))) attribute\
    \ allows developers to specify the alignment of a structure. This can be particularly\
    \ useful when working with hardware that requires specific alignments.\n\n```\n\
    struct AlignedExample {\n    char a;\n    int b;\n} __attribute__((aligned(8)));\n\
    ```\n\nHere, the structure is aligned to an 8-byte boundary, ensuring that any\
    \ instance of this structure will have its starting address divisible by 8.\n\n\
    # 2. Packing Structures\n\nPacking structures involves minimizing the padding\
    \ added by the compiler. This can be achieved by using compiler-specific directives.\
    \ For example, in GCC, the __attribute__((packed)) attribute can be applied to\
    \ a structure, reducing or eliminating padding.\n\n```\nstruct PackedExample {\n\
    \    char a;\n    int b;\n} __attribute__((packed));\n```"
