  md: "# Passing Pointers to Functions\n\nOne of the primary use cases of pointers\
    \ in C is passing them as arguments to functions. This enables functions to directly\
    \ modify the values of variables outside their scope. Consider the following function:\n\
    \n```\n#include <stdio.h>\n\nvoid modifyValue(int *ptr) {\n    *ptr = 100; //\
    \ Modify the value pointed to by 'ptr'\n}\n\nint main() {\n    int num = 42;\n\
    \    modifyValue(&num); // Pass the address of 'num' to the function\n    printf(\"\
