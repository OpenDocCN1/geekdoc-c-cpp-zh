    \    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\n\nint partition(int array[],\
    \ int low, int high) {\n    int pivot = array[high];\n    int i = (low - 1);\n\
    \n    for (int j = low; j <= high - 1; j++) {\n        if (array[j] < pivot) {\n\
    \            i++;\n            swap(&array[i], &array[j]);\n        }\n    }\n\
