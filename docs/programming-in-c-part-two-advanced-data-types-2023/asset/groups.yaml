    # ## Memory Allocation in C


    In C, memory allocation can be dynamic or static. Static memory allocation occurs
    at compile time, and the memory size is fixed. On the other hand, dynamic memory
    allocation allows you to allocate memory at runtime using functions like **malloc,
    calloc,** and realloc**. Virtual memory plays a crucial role in dynamic memory
    allocation.


