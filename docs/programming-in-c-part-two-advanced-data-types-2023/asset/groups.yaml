    \    for (int i = 0; i < rows; i++) {\n        matrix[i] = (int *)malloc(cols\
    \ * sizeof(int));\n        for (int j = 0; j < cols; j++) {\n            matrix[i][j]\
    \ = i * cols + j;\n        }\n    }\n    return matrix;\n}\n\nvoid freeMatrix(int**\
    \ matrix, int rows) {\n    for (int i = 0; i < rows; i++) {\n        free(matrix[i]);\n\
    \    }\n    free(matrix);\n}\n\nint main() {\n    int rows = 3, cols = 4;\n  \
    \  int** matrix = createMatrix(rows, cols);\n\n    // Access and print matrix\
