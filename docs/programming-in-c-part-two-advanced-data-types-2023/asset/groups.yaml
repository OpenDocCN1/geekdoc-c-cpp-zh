    \ us to allocate memory dynamically, and passing pointers to functions facilitates\
    \ efficient manipulation of dynamically allocated memory.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nvoid allocateAndModify(int **ptr) {\n    *ptr = (int *)malloc(sizeof(int));\
    \ // Allocate memory for an integer\n    **ptr = 50; // Modify the value at the\
    \ allocated memory\n}\n\nint main() {\n    int *dynamicNum;\n    allocateAndModify(&dynamicNum);\
    \ // Pass the address of 'dynamicNum'\n    printf(\"Dynamic Value: %d\\n\", *dynamicNum);\
