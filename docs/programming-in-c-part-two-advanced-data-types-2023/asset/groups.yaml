    ```


    realloc: Changes the size of the memory block.


    ```

    int *newArr = (int *)realloc(arr, 10 * sizeof(int));

    ```


    free: Deallocates the memory.


    ```

    free(arr);

    ```


    # Dynamic Memory and Arrays


    Dynamic memory is often used to create arrays whose size is determined at runtime.
    This is especially useful when the size of the array is unknown until the program
    is executed.


    ```

    int n;

    printf("Enter the size of the array: ");

    scanf("%d", &n);


    int *arr = (int *)malloc(n * sizeof(int));

    ```


