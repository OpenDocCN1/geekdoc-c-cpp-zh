    One of the primary advantages of using enumerations is the improvement in code
    readability. By assigning meaningful names to constants, developers can create
    self-documenting code. This becomes especially valuable when working on larger
    projects or collaborating with other programmers.


    # Type Safety


    Enumerations provide a level of type safety that plain integers lack. If a function
    expects an enum type as an argument, passing an incorrect value becomes a compile-time
    error rather than a runtime issue. This helps catch potential bugs early in the
    development process.


    # Code Maintenance


    When using plain integers to represent different states or options in your code,
    modifying or adding new values can lead to unintended consequences. Enumerations,
    on the other hand, offer a centralized and easily modifiable way to manage these
    constants. This makes code maintenance more straightforward and reduces the likelihood
    of introducing errors.


    # Enhancing Switch Statements


    Enumerations work seamlessly with switch statements, making code more concise
    and expressive. The switch statement in the earlier example showcasing geometric
    shapes becomes more readable and less error-prone due to the use of enums.


