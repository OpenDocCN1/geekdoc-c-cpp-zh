    \n# 正则表达式简介\n\n正则表达式（通常缩写为 regex）提供了一种描述字符串内模式的强大且简洁的方法。在 C 语言中，`<regex.h>` 头文件提供了处理正则表达式的函数。让我们创建一个简单的程序来匹配并从字符串中提取模式：\n\
    \n```c\n#include <stdio.h>\n#include <regex.h>\n\nint main() {\n    char input[]\
    \ = \"The code is 1234 and the key is ABCD\";\n    regex_t regex;\n    regmatch_t\
