    \n高效的结构对齐直接影响程序性能。未对齐的数据可能导致性能损失，例如某些架构需要多次内存访问。让我们来看一个场景：\n\n```c\nstruct Unaligned\
    \ {\n    char a;\n    int b;\n    char c;\n};\n```\n\n### 1. 编译器属性\n\n许多编译器提供了用于控制对齐的属性。例如，在\
