    \ data[i]);\n    }\n\n    return 0;\n}\n```\n\nIn this example, if the array data\
    \ is too large to fit into physical memory, the operating system might swap portions\
    \ of it in and out to manage memory efficiently.\n\n# Memory Mapping and Virtual\
    \ Memory\n\nMemory mapping is a technique that allows files to be mapped into\
    \ memory, enabling direct manipulation of file data by using pointers. This process\
    \ is closely tied to virtual memory, as it allows files larger than the physical\
    \ memory to be handled efficiently.\n\n```c\n#include <stdio.h>\n#include <fcntl.h>\n\
    #include <sys/mman.h>\n#include <unistd.h>\n\nint main() {\n    int fileDescriptor\
    \ = open(\"example.txt\", O_RDWR);\n    off_t fileSize = lseek(fileDescriptor,\
    \ 0, SEEK_END);\n\n    // Memory mapping the file\n    char *fileContent = mmap(NULL,\
    \ fileSize, PROT_READ | PROT_WRITE, MAP_SHARED, fileDescriptor, 0);\n\n    //\
    \ Modifying the file content using memory mapping\n    fileContent[0] = 'H';\n\
    \    fileContent[1] = 'i';\n\n    // Cleanup\n    munmap(fileContent, fileSize);\n\
    \    close(fileDescriptor);\n    return 0;\n}\n```\n\nIn this example, the **mmap**\
    \ function maps the content of \"example.txt\" into memory. The operating system,\
