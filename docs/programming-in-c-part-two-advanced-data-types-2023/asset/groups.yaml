    \n    // 将第一个字符串复制到结果\n    while (*ptr++ = *first++)\n    ;\n\n    // 将指针指向结果的末尾\n\
    \    ptr--;\n\n    // 将第二个字符串拼接到结果\n    while (*ptr++ = *second++)\n    ;\n\n\
    \    printf(\"Concatenated String: %s\\n\", result);\n\n    return 0;\n}\n```\n\
    \n# 字符串的动态内存分配\n\n指针还允许字符串的动态内存分配，为处理变长字符串提供了活性。这里是一个动态分配的示例：\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint main() {\n    char\
    \ *dynamicString;\n\n    // 为字符串分配内存\n    dynamicString = (char *)malloc(20 *\
