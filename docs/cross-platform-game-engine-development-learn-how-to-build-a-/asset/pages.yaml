    # Tile Map Asset


    Tile maps are highly common in 2D games. They consist of constructing the game
    world using regular-shaped images called tiles. Some popular games like Super
    Mario, Pacman or even Zelda use this technique to build their levels. Tile maps
    can also be mapped to a logical grid in addition to performance improvements,
    and can be used in many ways within the game logic (e.g., handling collisions,
    implementing AI) or to construct a level editor. [20]


    ![](img/2763810ed0a1572c2bec59ee52dd75be_113_0.png)


    Figure 27 Tile Map


    The most effective and most used way to store a set of tiles is through tile sets.
    It is literally all the tiles you need put together in a single light image file.
    When it''s time to draw a tile, on the screen, only a small part of the larger
    image is used. Below is the tile set used to create the scene above.'
