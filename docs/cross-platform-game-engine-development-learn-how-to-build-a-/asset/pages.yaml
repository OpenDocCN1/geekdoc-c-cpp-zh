- pgno: 244
  md: "The asset serializer is similar to the entity serializer. We have two main\
    \ functions to de- and serialize all asset types using each asset type custom\
    \ de- and serialize function.\n\nThe deserilize function takes the renderer as\
    \ parameter because it is required to load textures in SDL.\n\nWe will also add\
    \ other functions to de- and serialize other asset types later.\n\nTo make it\
    \ possible for the asset serializer to access the map inside of the asset registry,\
    \ we are going to make the asset serializer class a friend of the asset registry\
    \ class.\n\nThe next code snippet shows how it is done.\n\n```\nengine/src/assets/registry.h\n\
    #pragma once\n#include \"font.h\"\n#include \"audi o.h\"\n#include \"till emap.h\"\
    \n#include \"texture .h\"\n#include \"animation .h\"\n#include \"core/ typei d.h\"\
    \nnamespace fuse {\nstruct asset_registry {\n    FUSE_NONIE asset_registry() =\
    \ default;\n    // . . .\nprivate:\n    friend struct asset_serializer;\n    std::unordered_map<asset_typeid,\
    \ std::vector<asset*>> _data;\n};\n}\n```\n\nThe friend declaration appears in\
    \ a class body and grants a function or another class access to private and protected\
    \ members of the class where the friend declaration appears. [3]\n\nThis will\
    \ make it possible for the asset sterilizor to access the \"_data\" member variable.\
    \ We could have implemented a function that returns a reference to the data map.\n\
    \n# Implementation of Member Functions\n\nThe next code snippet shows the implementation\
    \ of the main de- and serializes functions of the asset serializer."
