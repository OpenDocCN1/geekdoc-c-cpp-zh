    FUSE_INLINE void start() {

    // load texture

    auto ts = _assets.load_texture("assets/tex.png", "", _renderer);

    // create tilemap asset

    auto tm = _assets.add<tilemap_asset>("tm");

    tm->instance.tilesets.insert(ts->id);

    tm->instance.col_count = 16;

    tm->instance.row_count = 8;

    tm->instance.tilesize = 64;

    // add tilemap entity

    add_entity("tilemap").add_component<tilemap_component>().tilemap = tm->id;

    // turn image into multiple entities with tiles

    for (int col = 0; col < tm->instance.col_count; col++) {

    for (int row = 0; row < tm->instance.row_count; row++) {

    ecs::entity e = add_entity("tile");

    auto& tile = e.add_component<tile_component>();

    tile.tileset = ts->id;

    tile.tilemap = tm->id;

    tile.offset_x = col;

    tile.offset_y = row

    tile.row = col;

    tile.col = row

    }

    }

    // start systems

    for (auto& sys : _systems) { sys->start(); }

    }

    ```


    Note : make sure to register the system in the constructor!


    The first thing we do is to load the tile set which is just a texture. We then
    go on to create a tilemap asset and set its member variables. We then go on to
    add an entity with a tile map component. Since we want to break down the tile
    set to single tiles, we use two for-loops to get a section of the tile set as
    a 64x64 tile which we attach to an entity via a tile component.

    Depending on the size of your tile map, this can result in over 200 to 300 tiles'
