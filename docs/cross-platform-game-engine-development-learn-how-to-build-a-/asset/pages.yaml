- pgno: 226
  md: 'operators to make that possible.

    Create a new folder called "helpers" and a header file called "yaml.h" in that
    folder. Below is a code snippet that shows the content of the header file.

    engine/src/helpers/yaml.h


    ```

    #pragma once

    #include "math/vec2.h"

    #include "yaml-cpp/yaml.h"

    namespace YAML {

    template <>

    struct convert<use::vec2f> {

    FUSE_INLINE static Node encode(const fuse::vec2f &rhs) {

    Node node;

    node.push_back(rhs.x);

    node.push_back(rhs.y);

    node.SetStyle(EmitterStyle::Flow);

    return node;

    }

    FUSE_INLINE static bool decode(const Node &node,

    fuse::vec2f &rhs) {

    if (!node.IsSequence() || node.size() != 2) {

    return false;

    }

    rhs.x = node[0].as<float>();

    rhs.y = node[1].as<float>();

    return true;

    }

    };

    // stream operator

    FUSE_INLINE Emitter &operator <<(Emitter &emitter, const

    fuse::vec2f &v) {

    emitter << Flow,

    emitter << BeginSeq << v.x << v.y << EndSeq;

    return emitter;

    }

    }

    ```


    Because we will only need the vec2f to serialize our components, we have only
    overloaded the operators for the vec2f datatype. You can do the same for vec2i
    by just changing the vec2f to vec2i. As you can see this is done in the YAML namespace
    because we are overloading operators from the yaml-cpp library.'
