- pgno: 87
  md: '# Entity Component System


    ECS, or Entity Component System, is a design that separates data from behaviour
    to promote code reuse. Data is usually cache-friendly saved, which enhances performance
    and memory usage.


    The cache memory is a chip-based computer component that improves the efficiency
    with which data is retrieved from the computer''s storage. He serves as a temporary
    storage area from which the computer''s processor may easily retrieve data. This
    temporary storage area, known as a cache, is available to the processor more easily
    and quickly than the computer''s main work storage (DRAM).


    An ECS has the following characteristics:


    +   - It has entities, which are identifiers that are unique.

    +   - components are just datatypes with no behaviour.

    +   - Entities might have a single component or several components.

    +   - Entities can change components on the fly.

    +   - Behaviours are implemented in systems that target entities with a certain
    set of components.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Alternatives to ECS


    To understand why the ECS is a smart choice for building our game engine, we must
    first look at the alternatives. We are going to look at the object-oriented design,
    component-oriented design, and data-oriented design. Our comparison will be done
    using the following categories:


    +   - Performance and Maintenance

    +   - CPU Cache and Memory Usage


    # Object-Oriented Design


    On the surface, it appears that object-oriented (OO) programming is an excellent
    choice for creating games because games are simply a collection of objects interacting
    in a scene. This design, however, has numerous flaws that have caused many game
    developers to abandon it.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_88_0.png)


    A typical OO design for a game will look like the picture above. On top of we
    have an interface Object that contains pure virtual functions like update(), destroy(),
    render() that must be implemented by all child classes like GameObject and UIObject.
    The picture above shows the tree level of inheritance which means we also have
    three levels of virtual lookup-table. This can have a massive impact on performance
    as the processor will have to look up the table to find the proper function to
    call.


    In the image above, we have a child class called Player as well as another one
    called Boss. What if we want a Boss who is also a Player? This is where things
    get strange with the OO design because we''ll have to use multiple inheritances,
    which is already a bad idea as it would make it even more difficult to maintain.


    Since all objects must inherit from the "Object" interface, we must allocate'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'memory on the Heap to store all types of objects. This means that our data
    will not be stored consistently in memory. When you ask the computer to find something
    in memory at a specific address, it will not only copy what you ask for, but it
    will also copy other data around what you asked for and store it all in Cache
    memory. So, the next time you ask for something else, the computer will just grab
    it from cache rather than fetch it from RAM again. The fact that data is saved
    inconsistently in memory drastically reduces CPU-Cache usage, resulting in a performance
    hit.


    # Component-Oriented Design


    The following picture shows how a component-oriented design is made. As you can
    see, each game object will have a list of components that define its behaviour.
    All components like Transform, Sprite, etc. will inherit an abstract class called
    Component.


    This technique will not solve the problem of memory and CPU-cache usage of the
    OO design, but it takes away the virtual lookup table for virtual functions and
    offers the ability to have a boss than can also be a player because being a player
    or a boss is just a matter of components added or removed. This will perform better
    than OO.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_89_0.png)


    # Data Oriented Design


    Things start to sound right with the data-oriented design because it offers a
    contiguous memory layout, no virtual lookup table, and better CPU-cache usage.
    This design is also known as Entity-Component (EC) design. The next picture describes
    the most vital component of the EC design.'
