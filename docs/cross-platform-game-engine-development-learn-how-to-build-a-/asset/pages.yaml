    # # Installing CMake


    CMake is an open-source, cross-platform tool that generates native build tool
    files specific to your compiler and platform by using compiler and platform specific
    configuration files.


    Pre-compiled binaries for Windows are available as MSI packages at https://cmake.org/download/.
    "Windows x64 Installer" for 64-bit systems and "Windows i386 Installer" for 32-bit
    systems. Execute the downloaded MSI- package to install CMake and make sure to
    select "Add CMake to the system PATH for all users" as well. It will be installed
    globally on your machine so that third-party software such as Vs-Code can access
    it. After the installation is complete, open the Command Prompt and run the following
    command to verify if it is installed on your system.


