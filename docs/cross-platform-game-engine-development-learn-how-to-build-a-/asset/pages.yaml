- pgno: 112
  md: "# # Audio Asset\n\nA game without audio is just flat-out dead and not fun to\
    \ play. We'll keep the same pattern for the audio assets as well. The SDL mixer\
    \ library provides two types of audio data. Mix_Music and Mix_Chunk. The difference\
    \ is that you only play one piece of music at a time, but you can play as many\
    \ chunks as your computer can handle. Each new chunk will be assigned to a dedicated\
    \ channel, whereas there is only one channel for all music. That is the reason\
    \ we are using Mix_Chunk instead of Mix_Music. Feel free to make more research\
    \ online if you wish.\n\nengine/src/assets/audio.h\n\n```\n#pragma once\n#include\
    \ \"asset.h\"\n\nnamespace fuse {\nstruct audio_clip {\n    Mix_Chunk* data =\
    \ NULL;\n    std::string filename;\n};\n\nstruct audio_asset : asset {\n    FUSE_INLINE\
    \ audio_asset() = default;\n\n    FUSE_INLINE ~audio_asset() {\n        Mix_FreeChunk(instance.data);\n\
    \    }\n\n    audio_clip instance;\n};\n}\n```\n\n# # Animation Asset\n\n2D animation\
    \ is made possible by using sprite sheets or multiple sprites. The idea is to\
    \ simply render each sprite in a constant time period, which is the speed of the\
    \ animation.\n\nBelow is the code snippet that shows how the animation asset is\
    \ defined. The array \"frames\" will store the asset_id of each texture (frame)\
    \ asset that is part of the animation.\n\nIt is possible to directly store each\
    \ texture object instead of the asset_id. It is better for us to do it this way\
    \ because we will implement serialization, and scripting in our game engine and\
    \ we want to be able to easily address assets by their id and name.\n\nengine/src/assets/animation.h"
