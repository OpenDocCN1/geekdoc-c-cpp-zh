  md: "# Entity Serializer\n\nWe are going to create a custom serializer to serialize\
    \ all entities and their components. We will also create a serializer for our\
    \ assets later.\n\n# Basic Serialization Example\n\n```\nvoid d serialize_info(YAML::Emitter&\
    \ em, ecs::entity& e) {\n    auto& i = e.get_component<ecs::info_component>();\n\
    \    em << YAML::Key << \"i_info_component\";\n    em << YAML::BeginMap;\n   \
    \ em << YAML::Key << \"uuid\" << YAML::Value << i.uuid;\n    em << YAML::Key <<\
    \ \"name\" << YAML::Value << i.name;\n    em << YAML::Key << \"tag\" << YAML::Value\
    \ << i.tag;\n    em << YAML::EndMap;\n}\n```\n\nThe code snippet above shows how\
    \ the \"info_component\" can be serialized using yaml-cpp. It takes a YAML::Emitter\
    \ as a parameter and the entity we want to retrieve the component from. The emitter\
    \ is just a handle that can be used to push data to the buffer allocated for the\
    \ current serialization process. Each file of the component is stored using a\
    \ key. The key will be used to retrieve the data by deserialization. The component\
    \ itself is a map which content data fields.\n\n# Basic Deserialization Example\n\
    \n```\nvoid d deserialize_info(YAML::Node node, ecs::entity& e) {\n    if (auto\
    \ data = node[\"i_info_component\"]) {\n        auto& i = e.add_component<ecs::info_component>();\n\
    \        i.name = data[\"name\"].as<std::string>();\n        i.tag = data[\"tag\"\
    ].as<std::string>();\n        i.uuid = data[\"uuid\"].as<u64>();\n    }\n}\n```\n\
    \nTo deserialize an object, you need the YAML::Node that represents the object\
    \ in the YAML file you are trying to deserialize from. That's why this function\
    \ takes a YAML::Node as a parameter and the target entity that will have the component\
    \ attached to. All nodes in a YAML document (including the root) are represented\
    \ by YAML::Node. We have the ability to access any data in the node using its\
    \ key. The template function \"as<T>()\" is used to convert the value to its correct\
    \ type.\n\n# Operators Overloading\n\nyaml-cpp only supports serialization and\
    \ deserialization of basic types, such as int, float, double, and string. However,\
    \ we also want it to be able to serialize custom types such as our vec2f or vec2i,\
    \ among others. So let us overload some"
