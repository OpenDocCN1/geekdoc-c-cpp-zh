- pgno: 98
  md: '# Member Variables


    The **registry.h** header file contains the definition of a structure called "registry".
    This structure oversees storing and managing all existing entities and their components.
    Let''s start with the member variables.

    The first member variable is an `std::unordered_map` called `_components`. It''s
    a map of component arrays that stores a specific array for each component type
    id.

    The second member variable, `_signatures`, is a map that assigns to each existing
    entity a signature of components. If we want to know, for example, if an entity
    has a transform component, we will simply check if the **componentid** of the
    transform component is found in the signature of the entity. The last member variable
    is a counter for entityids. This variable will be increased every time a new entity
    is added.


    # Member Functions


    Let''s look at all the member functions defined in this file. We will start from
    top to bottom.

    The first function is the **clear()** which simply has the role of cleaning the
    memory of the registry and resetting the entityid counter.


    The function **add_entity()** as the name says, will add a new entity to the registry
    by assigning a unique entityid and an empty signature. Every time a new component
    is added to the entity, the id of that component will be added to the signature.


    Adding entities also implies destroying them. So, the **destroy()** function will
    look for any data related to that entityid and destroy it. Data like components
    and signatures.

    The function **view()** is used to retrieve all entities with a component of type
    "T". This will be used in our systems to update those components.


    **get_component(), add_component(), remove_component(),** and **has_component()**
    is used to retrieve, add, and remove components, as well as to determine whether
    an entity has a component. Finally, we have **get_component_array()**, which is
    a function we can use to get a specific component array for further use like erasing
    a component of a specific entity, etc. This function will first make sure the
    array is already registered and register if not.


    engine/src/ecs/entity.h'
