- pgno: 64
  md: '# # Window And Events


    ![](img/2763810ed0a1572c2bec59ee52dd75be_64_0.png)


    A game loop is a game''s primary event loop. It starts the processing of the user''s
    input, performs the calculation of the game world''s state, and generates a new
    output. An example would be trying to move the player in the game world using
    a gamepad or the keyboard. As a result, the user will press a button, and the
    state of the button will be processed by the input system. Then the player''s
    next position will be calculated and passed to the renderer, which will eventually
    display the result on the screen for the player. All this will happen in a time
    range of milliseconds or even less, based on your computer power.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Creating the Window


    The first step in building our game-loop is to create a window. The good news
    is that SDL2 already has everything we need to achieve that.


    The next code snippet is the code of the application.cpp which allows us to create
    our first window.


    We simply create a window and a renderer with SDL_CreateWindow() and SDL_CreateRenderer().
    The flag SDL_WINDOW_ALLOW_HIGHDPI ensures that the window will keep a consistent
    look on high-dpi monitors because this kind of monitor will have more dots or
    pixels per inch.


    It is essential to instruct SDL about using the hardware or GPU (Graphics Processing
    Unit) for rendering because, in some cases, SDL might use the CPU instead. Because
    CPUs aren''t inherently designed for graphics rendering, we want to make sure
    we are using the graphic power provided by the GPU. That is the reason the SDL_RENDERER_ACCELERATED
    flag is used.


    To synchronize our window''s refreshing rate with the current monitor refreshing
    rate, we use the flag SDL_RENDERER_PRESENTVSYNC when creating the renderer. This
    is also important because our final game or application will run on different
    devices with different refreshing rates. Even if our motions and animation will
    not be frame-based but time-based.


    When a texture or a text is rendered in SDL, it will all be batched in the renderer
    and the final result will be presented to the screen using the SDL''s built-in
    function SDL_RenderPresent().


    engine/src/core/application.cpp'
  merge: -1
  img_proc: true
- pgno: 66
  md: '```

    #include "pch.h"

    #include "application.h"


    namespace fuse {

    static bool is_running = true;


    FUSE_API void run_application(const app_config& config) {

    if (SDL_Init(SDL_INIT_EVERYTHING) < 0) {

    FUSE_ERROR("%s", SDL_GetError());

    exit(EXIT_FAILURE);

    }


    // init SDL_image

    if ((IMG_Init(IMG_INIT_JPG | IMG_INIT_PNG) < 0) {

    FUSE_ERROR("%s", IMG_GetError());

    }


    // init SDL_ttf

    if (TTF_Init() < 0) {

    FUSE_ERROR("%s", TTF_GetError());

    }


    // init SDL_mixer

    if (Mix_Init(MIX_INIT_MP3 | MIX_INIT_OGG) < 0 ||

    Mix_OpenAudio(44100, MIX_DEFAULT_FORMAT, 2, 512)) {

    FUSE_ERROR("%s", Mix_GetError());

    }


    // create window

    auto w_flags = (SDL_WindowFlags)(SDL_WINDOW_RESIZABLE |

    SDL_WINDOW_ALLOW_HIGHDPI);

    SDL_Window* window = SDL_CreateWindow(config.title.c_str(),

    SDL_WINDOWPOS_CENTERED,

    SDL_WINDOWPOS_CENTERED, config.width, config.height,

    w_flags);


    // create renderer

    auto r_flags = (SDL_RendererFlags)(SDL_RENDERER_ACCELERATED |

    SDL_RENDERER_PRESENTVSYNC);

    auto renderer = SDL_CreateRenderer(window, -1, r_flags);

    if (!window || !renderer) {

    FUSE_ERROR("%s", SDL_GetError());

    exit(EXIT_FAILURE);

    }


    while (is_running) {

    SDL_RenderClear(renderer);

    SDL_RenderPresent(renderer);

    }

    }

    }

    ```'
