- pgno: 217
  md: '# Definition


    Serialization is the process of converting a data object into a formatted binary
    or text file that can be easily reloaded and used by a program. [27]


    ![](img/2763810ed0a1572c2bec59ee52dd75be_217_0.png)


    The reverse process where the binary or text file is used to recreate the actual
    object in memory is called “Deserialization”.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_217_1.png)


    We''ll serialize the data from our game in a human-readable format. Binary serialization
    is significantly faster and generates small-size files compared to readable serialization.
    It is just the process of saving a block of memory (binary data) in a file. However,
    because our scene has a complex data structure that cannot be directly saved in
    binary form, we will create a custom serializer to do the job for us.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "# What is YAML?\n\nYAML is a human-friendly data serialization language [29],\
    \ [19]. YAML originally stood for \"Yet Another Markup Language\", but since 2002\
    \ it has been replaced with the recursive acronym \"YAML Ain't Markup Language\"\
    . As a result, YAML is defined as an encoding language that isn't one.\n\nMarkup\
    \ languages like: XML, HTML are primarily used to store data in a human-readable\
    \ format. YAML differs from XML in that it uses a simple approach. The main justification\
    \ for YAML is its simplicity, which includes constraints that arise from XML's\
    \ broad application spectrum. However, YAML's main competitor is JSON, rather\
    \ than XML.\n\n# How does YAML work?\n\nYAML turns data from a program's internal\
    \ format into a text file. Because this is possible even for complex data types\
    \ like two- or multidimensional arrays, the elements are serialized and sent one\
    \ after the other.\n\nIf we were to serialize the following data structure using\
    \ YAML, the result will look like shown below.\n\n```\nstruct transform_component\
    \ {\n    vec2f translate = vec2f( 0.0f );\n    vec2f scale = vec2f( 1.0f );\n\
    \    float rotation = 0.0f ;\n};\n```\n\nFigure 46 Data Structure\n\n```\ntransform_component:\n\
    \    translate: [0, 0]\n    scale: [1, 1]\n    rotation: 0\n```\n\nFigure 47 YAML\
    \ File\n\nThere are libraries available for almost all major programming languages\
    \ like C/C++, Java, C#, Dart, Js, Rust, etc. that allow serialization with YAML.\n\
    \n+   * YAML Frameworks and Tools for C/C++:\n+       * libfyaml \"C\" YAML 1.2\
    \ processor (YTS) [7]\n+       * libyaml \"C\" Fast YAML 1.1 (YTS) [8]\n+    \
    \   * libcyaml YAML de/serialization of C data (using libyaml) [6]\n+       *\
    \ yaml-cpp C++ YAML 1.2 implementation [5]\n\nAbove is a list of some well-known\
    \ libraries for C++ serialization using YAML. \"yaml-cpp\" is going to be our\
    \ choice for this book. It is a YAML parser and"
  merge: -1
  img_proc: true
- pgno: 219
  md: emitter in C++ matching the YAML 1.2 specification. We are going to clone the
