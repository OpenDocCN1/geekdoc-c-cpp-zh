- pgno: 109
  md: '# Assets Definition


    ![](img/2763810ed0a1572c2bec59ee52dd75be_109_0.png)


    Update your project folder tree as shown above by creating the folder and files
    highlighted in red. We are now going to create each asset type step by step, starting
    with the base asset, which is going to contain some common information about all
    kinds of assets.


    ```

    #pragma once


    namespace fuse {

    using asset_typeid = uint32_t;

    using asset_id = uuid64;


    struct asset {

    FUSE_NONIE virtual ~asset() = default;

    asset_id id = generate_uuid();

    std::string name;

    };

    }

    ```


    Each asset should have a unique universal identifier (UUID) and a name because
    that information will be used to search the asset in the registry. We also want
    each asset type to have a specific type identifier that will be used to save each
    asset in the specific memory block of the registry. That’s why we’ve created the
    typedef asset_typeid which is simply a 32-bit integer similar to what we did for
    events and components.


    # Texture Asset


    Textures have the ability to enhance a game by giving it a pleasant look and also
    understandable. I am quite sure you know the old adage that says, “A picture is
    worth a thousand words”.'
