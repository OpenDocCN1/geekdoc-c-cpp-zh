  md: "# # Events Handling\n\nEvents can occur in various places in a program, e.g.,\
    \ when a user clicks a button or moves the mouse. The event system's job is to\
    \ recognize the event and execute a specific callback action. We now want to give\
    \ our window the ability to respond to events like resizing, mouse motion, key\
    \ down, and more. Create two files in your project, **inputs.h** and **inputs.cpp**.\n\
    \n```\n```cpp\n#pragma once\n\nnamespace fuse::inputs {\nFUSE_API void initialize(SDL_Window*);\n\
    FUSE_API void dispatch_events();\nFUSE_API bool is_key(int);\n}\n```\n```\n\n\
