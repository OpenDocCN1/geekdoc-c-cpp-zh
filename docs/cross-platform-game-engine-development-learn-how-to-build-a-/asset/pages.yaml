  md: "# Core Features\n\nThere are some features that are important for almost all\
    \ C++ project development, whether it is a game engine or not. Things like message\
    \ logger, assertions, platform-detection, etc. We are going to quickly add those\
    \ features to our project before moving to the graphics related stuff.\n\n# Message\
    \ Logger\n\nThe message logger is a crucial element for software development in\
    \ general. This feature will enhance our development experience by talking back\
    \ to us about our code failures.\n\nAdd the code below to the bottom of your precompiled\
    \ header file pch.h.\n\n```\n// ...\n\n#if defined(_DEBUG)\n#define FUSE_LOG(level,\
    \ message, ...) \\\n    fprintf(stderr, \"[%%] \", level); \\\n    fprintf(stderr,\
    \ message, ##__VA_ARGS__); \\\n    fprintf(stderr, \"\\n\");\n\n#define FUSE_WARN\
    \ NG(message, ...) FUSE_LOG(\"warning\", message,\n##__VA_ARGS__)\n#define FUSE_ERROR(message,\
    \ ...) FUSE_LOG(\"error\", message,\n##__VA_ARGS__)\n#define FUSE_INFO(message,\
    \ ...) FUSE_LOG(\"info\", message,\n##__VA_ARGS__)\n#else\n#define FUSE_INFO\n\
    #define FUSE_ERROR\n#define FUSE_WARN G\n#endif\n```\n\nAs you can see if we compile\
    \ our code with the _DEBUG symbol defined, the macros FUSE_INFO, FUSE_WANING,\
    \ FUSE_ERROR will also be compiled. But if the _DEBUG symbol is not defined, they\
    \ won't be compiled. That's something we want because when we are done developing\
    \ and testing our project, we would want it to only hold what is necessary for\
    \ the user. We have defined a macro around fprintf()."
  merge: -1
  img_proc: true
