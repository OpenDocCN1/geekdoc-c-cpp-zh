    \ size);\n    font.filename = src;\n    font.size = size;\n\n    if (!font.data)\
    \ {\n        FUSE_ERROR(\"%s\", IMG_GetError());\n        return NULL;\n    }\n\
    \n    auto asset = new font_asset();\n    asset->instance = font;\n    asset->name\
    \ = name;\n\n    _data[type_id<font_asset>()].push_back(asset);\n    return asset;\n\
    }\n\n// ...\n```\n\nThis is one of the reasons why using external libraries in\
    \ a project is important: it abstracts all the complexity for us, so we only have\
    \ to focus on what matters to us. As you can see, all we have to do is call TTF_OpenFont()\
    \ to load the font file. This function takes the path to the font file and the\
    \ target size for that font.\n\nLet us now create the text component that will\
    \ store all information about the text we want to show on the screen.\n\n### Text\
    \ Component\n\nText rendering is also part of the category “graphics”. That’s\
    \ why the text component is also going to be created inside of the same file that\
    \ the sprite component was created in. There are three essential components required\
    \ to render text on the screen: A font, the text value (string), and the color.\
    \ Of course, there are other elements that are also necessary to render text,\
    \ like the background color, the alignment, and the space between characters,\
    \ but that’s up to you to figure out how to do it.\n\n```\nengine/src/ecs/components/graphics.h\n\
    struct text_component {\nFUSE_INLINE text_component(const text_component &) =\
    \ default;\nFUSE_INLINE text_component() = default;\n\nSDL_RendererFlip flip =\
    \ SDL_FLIP_NONE;\nSDL_Color color = { 0, 0, 0, 255 };\nasset_id font = INVALID_ID;\n\
    std::string text;\n};\n```\n\nUpdate the code inside your graphics.h by adding\
    \ the code snippet above. Similar to the sprite component, we are also using an\
    \ asset_id for the font because it will be retrieved in the text renderer system\
    \ for the time being. We set the default color of the text to black and added\
    \ a string to store the current value of the text. SDL_Color is a structure that\
    \ holds the value of a color in the RGBA standard. The color value is an 8-bit\
    \ unsigned integer, in other words, a number between 0 and 255.\n\n### Text Renderer\
    \ System\n\nThere are many functions available in SDL_ttf for rendering text.\
    \ There is one called TTF_RenderText_Shaded(). This function gives us the ability\
    \ to render text with a background color, hence the shaded in the name. TTF_RenderText_Blended(),\
    \ on the other hand, renders text without a background or with a blend mode. More\
    \ functions, such as TTF_SetFontStyle(font, TTF_STYLE_BOLD), are available to\
    \ experiment with the font's style. Check the documentation [17] of SDL_ttf to\
    \ learn more about all the functions available for you to use.\n\nThe way text\
    \ is rendered with SDL is similar to the way textures are rendered, because all\
    \ we do is create a texture from the text and render it. Next is a code snippet\
    \ that shows how the text renderer system is defined. As you can see, TTF_RenderText_Blended()\
    \ takes a pointer to the font, the text value, and a color as parameters, and\
    \ it returns a pointer to an SDL_Surface which is just a structure that contains\
    \ a collection of pixels used in software blitting. That surface is then used\
    \ to create a texture using the SDL_CreateTextureFromSurface(). We query the size\
    \ of that texture using SDL_QueryTexture(). The queried size is then used to create\
    \ the target viewport \"rect\" of the texture, and finally, the texture is rendered\
    \ using the function from the last chapter.\n\nIt is vital to destroy the texture\
    \ and its surface before moving to the next stage because this could be a cause\
    \ of our game getting slow over time.\n\n```\nengine/src/ecs/systems/text_renderer_system.h\n\
    #pragma once\n#include \"ecs/system.h\"\n\nnamespace fuse::ecs {\nstruct text_renderer_system\
    \ : system {\n    FUSE_NN_INLINE void update(float) {\n        for (auto& e :\
    \ view<text_component>()) {\n            // get components\n            auto&\
    \ tr = e.get_component<transform_component>();\n            auto& tx = e.get_component<text_component>();\n\
    \n            // get texture from asset registry\n            auto& font = _assets->get<font_asset>(tx.font)->instance;\n\
    \n            // create text surface\n            SDL_Surface* surface = NULL;\n\
    \            surface = TTF_RenderText_Blended(font.data,\n                   \
    \                          tx.text.c_str(), tx.color);\n            if (!surface)\
    \ {\n                FUSE_ERROR(\"%s\", TTF_GetError());\n                continue;\n\
    \            }\n\n            // create texture from surface\n            SDL_Texture*\
    \ texture = SDL_CreateTextureFromSurface(_renderer, surface);\n            SDL_FreeSurface(surface);\n\
    \            if (!texture) {\n                FUSE_ERROR(\"%s\", SDL_GetError());\n\
    \                continue;\n            }\n\n            // query texture size\n\
    \            int width, height;\n            SDL_QueryTexture(texture, NULL, NULL,\
    \ &width, &height);\n\n            // define target viewport\n            SDL_FRect\
    \ dst {\n                tr.translate.x, tr.translate.y,\n                width\
    \ * tr.scale.x, height * tr.scale.y\n            };\n\n            // render text\n\
    \            SDL_RenderCopyExF(_renderer, texture, NULL, &dst, tr.rotation, NULL,\
    \ tx.flip);\n            // destroy texture\n            SDL_DestroyTexture(texture);\n\
    \        }\n    }\n};\n}\n```\n\n```\n#pragma once\n#include \"ecs/systems/text_renderer_system.h\"\
    \n#include \"ecs/systems/sprite_renderer_system.h\"\n\nnamespace fuse::ecs {\n\
    \nstruct scene {\n    FUSE_INLINE scene(SDL_Renderer* rd): _renderer(rd) {\n \
    \       register_systems<ecs::sprite_renderer_system>();\n        register_systems<ecs::text_renderer_system>();\n\
    \    }\n\n    FUSE_INLINE void update(float dt) {\n        SDL_SetRenderDrawColor(_renderer,\
    \ 255, 255, 255, 255);\n        for (auto& sys : _systems) { sys->update(dt);\
    \ }\n    }\n\n    FUSE_INLINE void start() {\n        // load texture asset\n\
    \        auto font = _assets.load_font(\"assets/font.ttf\", \"ft\", 30);\n\n \
    \       // add entity with text component\n        ecs::entity entity = add_entity(\"\
    entity\");\n        auto& tx = entity.add_component<ecs::text_component>();\n\
    \        tx.text = \"This is a text!\";\n        tx.font = font->id;\n\n     \
    \   // start systems\n        for (auto& sys : _systems) { sys->start(); }\n \
    \   }\n}\n```\n\nJust as before, register the system in the scene, load the font\
    \ asset, and finally, add an entity with a text component. Compile and run and\
    \ you will get the following result.\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_135_0.png)\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_135_1.png)\n\nSDL_SetRenderDrawColor()\
    \ sets the color of the renderer to white.\n\n## Conclusion\n\nSDL offers more\
    \ features for rendering text, but we are not going to focus on that because that\
    \ is not our focus point in this book. Nowadays internet has more data than any\
    \ library, you can find anything you need by just googling a little bit.\n"
  mdcn: "\n\n## 结论\n\n我们都可以同意，使用 SDL 渲染纹理相当简单，但这部分归功于我们引擎的构建方式。该系统专门针对特定的一组实体。\n\n\
    请记住，你可以尝试修改 transform 和 sprite，看看它们如何影响 sprite 的渲染。例如，你可以增加缩放比例、更改旋转值，甚至将 sprite\
    \ 组件中的 flip 值更改为其他值。\n\n## 第 8 章\n文本渲染器\n\n### 文本渲染器\n\n在本章中，我们将使用相同的原理，使我们的游戏引擎能够在屏幕上渲染文本。我们将首先了解如何将字体文件加载到引擎中，然后创建文本组件，接着创建系统，最后将所有内容放入场景中进行测试。\n\
    \n### 加载字体资源\n\n将以下函数添加到你的资源注册表中。此函数将用于将字体文件加载到我们的引擎中。\n\n```\nengine/src/assets/registry.h\n\
    \n// ...\n\nFUSE_INLINE font_asset* load_font(const std::string& src, const std::string&\
    \ name, int size) {\n    font font;\n    font.data = TTF_OpenFont(src.c_str(),\
    \ size);\n    font.filename = src;\n    font.size = size;\n\n    if (!font.data)\
    \ {\n        FUSE_ERROR(\"%s\", IMG_GetError());\n        return NULL;\n    }\n\
    \n    auto asset = new font_asset();\n    asset->instance = font;\n    asset->name\
    \ = name;\n\n    _data[type_id<font_asset>()].push_back(asset);\n    return asset;\n\
    }\n\n// ...\n```\n\n这就是在项目中使用外部库的重要原因之一：它为我们抽象了所有复杂性，因此我们只需关注对我们重要的事情。如你所见，我们只需调用\
    \ TTF_OpenFont() 来加载字体文件。该函数接受字体文件的路径和该字体的目标大小。\n\n现在让我们创建文本组件，它将存储我们想要在屏幕上显示的文本的所有信息。\n\
    \n### 文本组件\n\n文本渲染也属于“图形”类别。这就是为什么文本组件也将在与 sprite 组件相同的文件中创建。在屏幕上渲染文本需要三个基本组件：字体、文本值（字符串）和颜色。当然，还有其他元素也是渲染文本所必需的，例如背景颜色、对齐方式和字符间距，但如何实现由你来决定。\n\
    \n```\nengine/src/ecs/components/graphics.h\nstruct text_component {\nFUSE_INLINE\
