    \ be directly saved in binary form, we will create a custom serializer to do the\
    \ job for us.\n\n### What is YAML?\n\nYAML is a human-friendly data serialization\
    \ language [29], [19]. YAML originally stood for \"Yet Another Markup Language\"\
    , but since 2002 it has been replaced with the recursive acronym \"YAML Ain't\
