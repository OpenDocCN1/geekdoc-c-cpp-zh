    \ 向量。\n\n### 加速度 (a)\n\n在力学中，加速度是物体速度随时间变化的速率。加速度是矢量量（即具有大小和方向）。物体加速度的方向由作用于该物体的合力的方向决定。根据牛顿第二定律，物体加速度的大小是两个原因的综合效果\
