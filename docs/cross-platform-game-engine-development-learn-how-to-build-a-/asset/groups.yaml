    \ for each component type. This code shows how the serializer is defined and also\
    \ how it will evolve as we add more functions\n"
  mdcn: "\n\n## 步骤 3 更新 CMakeLists.txt 文件\n\n现在所有文件都已放置到位，我们希望通过告诉 CMake 在尝试编译项目时链接库来完成最终设置。\n\
    \n### Project/engine/CMakeLists.txt\n\n```cmake\n# . . .\nif (WIN32)\n    target_link_libraries(${PROJECT_NAME}\
    \ SDL2 SDL2main SDL2_image\n    SDL2_ttf SDL2_mixer yaml-cpp)\n    target_include_directories(${PROJECT_NAME}\
    \ PUBLIC\n    ${CMAKE_SOURCE_DIR}/windows/includes)\n    target_link_directories(${PROJECT_NAME}\
    \ PUBLIC\n    ${CMAKE_SOURCE_DIR}/windows/libs)\nendif (WIN32)\n# . . .\n```\n\
    \n黄色高亮的部分是你需要添加到此文件中以链接 yaml-cpp 的唯一内容。只需尝试编译项目即可检查一切是否正常。如果编译成功，则一切正常。\n\n注意：如果在编译库时遇到任何问题，请查看\
    \ GitHub 仓库上的官方说明。\n\n## 在 Linux 上安装 yaml-cpp\n\n在 Linux 上安装 yaml-cpp 非常简单。我们将使用系统包管理器来完成，就像我们为\
    \ SDL 做的那样。好消息是，我们不需要像为 SDL 扩展库所做的那样手动设置 CMake 配置文件。\n\n- 步骤 1 安装软件包\n\n通过运行以下命令在\
    \ Linux 系统上安装 yaml-cpp。我们正在更新包管理以保证我们尝试安装的 yaml-cpp 版本是兼容的。这里不需要复制任何头文件或库文件。一切都由包管理器管理。\n\
    \n```\nsudo apt update\nsudo apt install libyaml-cpp-dev\n```\n\n- 步骤 2 链接到项目\n\
    \n### Project/engine/CMakeLists.txt\n\n```cmake\n# . . .\n# linux\nif (UNIX)\n\
    \    # search libs\n    find_package(SDL2 REQUIRED)\n    find_package(yaml-cpp\
    \ REQUIRED)\n    find_package(SDL2_ttf REQUIRED)\n    find_package(SDL2_mixer\
    \ REQUIRED)\n    find_package(SDL2_image REQUIRED)\n\n    # include headers\n\
    \    target_include_directories(${PROJECT_NAME} PUBLIC ${SDL2_INCLUDE_DIRS})\n\
    \    target_include_directories(${PROJECT_NAME} PUBLIC ${YAML_CPP_INCLUDE_DIR})\n\
    \n    # link lib files\n    target_link_libraries(${PROJECT_NAME} ${YAML_CPP_LIBRARIES})\n\
    \    target_link_libraries(${PROJECT_NAME} ${SDL2_LIBRARIES} ${SDL2_IMAGE_LIBRARIES})\n\
    \    target_link_libraries(${PROJECT_NAME} ${SDL2_TTF_LIBRARIES} ${SDL2_MIXER_LIBRARIES})\n\
    endif (UNIX)\n# . . .\n```\n\n按如上所示更新 CMakeLists.txt 文件，编译并运行项目以检查是否可以无错误编译。\n\
    \n注意：如果在安装 yaml-cpp 时遇到任何问题，可以参考 yaml-cpp 的 Ubuntu 官方安装文档。[11] 链接：https://www.howtoinstall.me/ubuntu/18-04/libyaml-cpp-dev/.\n\
    \n这就是在 Linux 上安装 yaml-cpp 所需做的全部工作。我们现在将使用 yaml-cpp 来序列化场景中的所有实体及其组件。\n\n## 实体序列化器\n\
    \n我们将创建一个自定义序列化器来序列化所有实体及其组件。我们稍后还将为资产创建一个序列化器。\n\n### 基本序列化示例\n\n```cpp\nvoid\
    \ serialize_info(YAML::Emitter& em, ecs::entity& e) {\n    auto& i = e.get_component<ecs::info_component>();\n\
    \    em << YAML::Key << \"info_component\";\n    em << YAML::BeginMap;\n    em\
    \ << YAML::Key << \"uuid\" << YAML::Value << i.uuid;\n    em << YAML::Key << \"\
    name\" << YAML::Value << i.name;\n    em << YAML::Key << \"tag\" << YAML::Value\
    \ << i.tag;\n    em << YAML::EndMap;\n}\n```\n\n上面的代码片段展示了如何使用 yaml-cpp 序列化 \"\
    info_component\"。它将 YAML::Emitter 作为参数，以及我们想要从中检索组件的实体。发射器只是一个句柄，可用于将数据推送到当前序列化过程分配的缓冲区中。组件的每个字段都使用键存储。该键将用于在反序列化时检索数据。组件本身是一个包含数据字段的映射。\n\
    \n### 基本反序列化示例\n\n```cpp\nvoid deserialize_info(YAML::Node node, ecs::entity&\
    \ e) {\n    if (auto data = node[\"info_component\"]) {\n        auto& i = e.add_component<ecs::info_component>();\n\
    \        i.name = data[\"name\"].as<std::string>();\n        i.tag = data[\"tag\"\
    ].as<std::string>();\n        i.uuid = data[\"uuid\"].as<u64>();\n    }\n}\n```\n\
    \n要反序列化对象，需要表示要从中反序列化的 YAML 文件中对象的 YAML::Node。这就是为什么此函数将 YAML::Node 作为参数，以及将附加组件的目标实体。YAML\
    \ 文档中的所有节点（包括根节点）都由 YAML::Node 表示。我们可以使用键访问节点中的任何数据。模板函数 \"as<T>()\" 用于将值转换为其正确类型。\n\
    \n### 运算符重载\n\nyaml-cpp 仅支持基本类型（如 int、float、double 和 string）的序列化和反序列化。但是，我们也希望它能够序列化自定义类型，例如我们的\
    \ vec2f 或 vec2i 等。因此，让我们重载一些运算符来实现这一点。\n\n创建一个名为 \"helpers\" 的新文件夹，并在该文件夹中创建一个名为\
    \ \"yaml.h\" 的头文件。以下是显示头文件内容的代码片段。\n\n### engine/src/helpers/yaml.h\n\n```cpp\n\
    #pragma once\n#include \"math/vec2.h\"\n#include \"yaml-cpp/yaml.h\"\nnamespace\
    \ YAML {\ntemplate <>\nstruct convert<fuse::vec2f> {\nFUSE_INLINE static Node\
    \ encode(const fuse::vec2f &rhs) {\nNode node;\nnode.push_back(rhs.x);\nnode.push_back(rhs.y);\n\
    node.SetStyle(EmitterStyle::Flow);\nreturn node;\n}\nFUSE_INLINE static bool decode(const\
    \ Node &node,\nfuse::vec2f &rhs) {\nif (!node.IsSequence() || node.size() != 2)\
    \ {\nreturn false;\n}\nrhs.x = node[0].as<float>();\nrhs.y = node[1].as<float>();\n\
    return true;\n}\n};\n// stream operator\nFUSE_INLINE Emitter &operator <<(Emitter\
    \ &emitter, const\nfuse::vec2f &v) {\nemitter << Flow;\nemitter << BeginSeq <<\
    \ v.x << v.y << EndSeq;\nreturn emitter;\n}\n}\n```\n\n因为我们只需要 vec2f 来序列化组件，所以我们只重载了\
    \ vec2f 数据类型的运算符。您可以通过将 vec2f 更改为 vec2i 来对 vec2i 执行相同操作。如您所见，这是在 YAML 命名空间中完成的，因为我们正在重载\
    \ yaml-cpp 库中的运算符。\n\n我们现在已准备好序列化实体及其组件。\n\n### 输出文件格式\n\n了解在一切都序列化完成后我们将得到的文件结构对我们很重要，因为这有助于我们知道如何实现序列化器。\n\
    \n以下是显示从我们的游戏中序列化的示例场景的文件。\n\n```yaml\n# list of assets\nassets:\n  - texture:\n\
    \      id: 2234281881859053318\n      name: bg\n      source: assets/bg1.png\n\
    \  - audio:\n      id: 17441928881988725071\n      name: music\n      source:\
    \ assets/song.mp3\n# list of entities with their components\nentities:\n  - info_component:\n\
    \      uuid: 1262126381375044817\n      name: player\n    transform_component:\n\
    \      translate: [126.666664, 325.714661]\n      rotation: 0\n      scale: [0.150000006,\
    \ 0.150000006]\n  - info_component:\n      uuid: 2536376052334560951\n      name:\
    \ background\n      tag: default\n    transform_component:\n      translate: [-5,\
    \ -5]\n      rotation: 0\n      scale: [1, 1]\n    sprite_component:\n      sprite:\
    \ 2234281881859053318\n      flip: 0\n```\n\n此文件有两个主要部分：\"assets\" 和 \"entities\"\
    。目前，我们只关注 \"entities\" 部分。如您所见，新实体以减号字符 (\"-\") 开头，后跟其组件。实体 ID 未被序列化，因为它是运行时值。可以使用井号字符\
    \ (\"#\") 添加注释。每个组件都以其名称作为键，其数据字段作为键的值来存储。每个字段将简单地通过其键来寻址，就像我们访问 std::map 中的字段一样。\n\
    \n以下代码片段显示了实体序列化器的基本定义。\n\n```cpp\n#pragma once\n#include \"entity.h\"\n#include\
    \ \"helpers/yaml.h\"\n#include \"components/common.h\"\n#include \"components/physics.h\"\
    \n#include \"components/graphics.h\"\n#include \"components/behavior.h\"\n\nnamespace\
    \ fuse::ecs {\nstruct serializer {\n    FUSE_INLINE serializer(registry *reg)\
    \ : _registry(reg) {}\n\n    // deserialize all entities\n    FUSE_INLINE void\
    \ deserialize(YAML::Node nodes) {\n    }\n\n    // serialize all entities\n  \
    \  FUSE_INLINE void serialize(YAML::Emitter& en) {\n    }\n\n    // serialize\
    \ info_component\n    FUSE_INLINE void serialize_info(YAML::Emitter& em, ecs::entity&\
    \ e) {\n    }\n\n    // deserialize info_component\n    FUSE_INLINE void deserialize_info(YAML::Node\
    \ node, ecs::entity& e) {\n    }\n\nprivate:\n    registry* _registry = NULL;\n\
    };\n}\n```\n\n我们将为每个组件类型添加更多函数。此代码展示了序列化器的定义方式，以及随着我们添加更多函数它将如何演变。\n\n"
