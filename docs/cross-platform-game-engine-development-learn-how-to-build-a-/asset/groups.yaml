    ## About the Author


    Franc Pouhela is an engineer with a Master''s degree in Electrical Engineering
    who works for a well-known German corporation as a researcher in the field of
    Intelligent Networks. Franc has a fantastic wife with whom he has established
    a Godly household family. He is also a YouTuber who teaches coding through videos
