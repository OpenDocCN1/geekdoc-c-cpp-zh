  - '[PAGE 183]


    # Player Controller Script


    This section is about creating a script that will allow us to move an entity using
    the keyboard. Go ahead and create a new header file in your scripts folder called
    player_controller.h.


    The next code snippet is the definition of the player controller script.


    ```

    engine/src/scripts/player_controller.h

    #pragma once

    #include "script_instance.h"

    namespace fuse {

    struct player_controller : script_instance {

    FUSE_INLINE void on_start() {

    FUSE_INFO("player_script started!");

    }

    FUSE_INLINE void on_collision(ecs::entity e) {

    FUSE_INFO("colliding with: %d", e.id());

    }

    FUSE_INLINE void on_update(float dt) {

    auto& t = get_component<ecs::transform_component>();

    if(inputs::is_key(SDL_SCANCODE_A)) { // move left

    t.translate.x -= (speed * dt);

    }

    if(inputs::is_key(SDL_SCANCODE_D)) { // move right

    t.translate.x += (speed * dt);

    }

    if(inputs::is_key(SDL_SCANCODE_W)) { // move up

    t.translate.y -= (speed * dt);

    }

    if(inputs::is_key(SDL_SCANCODE_S)) { // move down

    t.translate.y += (speed * dt);

    }

    }

    private:

    float speed = 300.0f;

    };

    ```


    This script defines some functions from the parent script class. The update()
    function retrieves the transform component of the entity and updates its value'
  - '[PAGE 184]


    according to the key pressed. SDL has a specific type to represent each key on
    the keyboard called **SDL_Scancode**. It is basically an enumeration of the SDL
    keyboard scan code representation. You can see the full list of key codes here
    [11].


    You can simply use IntelliSense by just typing **SDL_SCANCODE_** to find any key''s
    scan code.

    Let''s attach this script to an entity in the scene and see if our script system
    is working as expected.


