    \ transform 组件的 **componentid** 是否存在于实体的签名中。最后一个成员变量是一个 entityid 计数器。每次添加新实体时，该变量都会增加。\n\
    \n## 成员函数\n\n让我们看看此文件中定义的所有成员函数。我们将从上到下依次介绍。\n\n第一个函数是 **clear()**，其作用仅仅是清理注册表的内存并重置\
    \ entityid 计数器。\n\n顾名思义，函数 **add_entity()** 会通过分配一个唯一的 entityid 和一个空签名，向注册表中添加一个新实体。每次向实体添加新组件时，该组件的\
    \ ID 都会添加到签名中。\n\n添加实体也意味着销毁它们。因此，**destroy()** 函数会查找与该 entityid 相关的任何数据并将其销毁。例如组件和签名等数据。\n\
    \n函数 **view()** 用于检索具有类型 \"T\" 组件的所有实体。这将在我们的系统中用于更新这些组件。\n\n**get_component()**、**add_component()**、**remove_component()**\
    \ 和 **has_component()** 用于检索、添加和删除组件，以及判断实体是否具有某个组件。最后，我们有 **get_component_array()**，这是一个可用于获取特定组件数组的函数，以便进一步使用（例如擦除特定实体的组件等）。该函数首先会确保数组已注册，如果未注册则进行注册。\n\
    \n### engine/src/ecs/entity.h\n\n```cpp\n#pragma once\n#include \"registry.h\"\
    \n\nnamespace fuse::ecs {\nstruct entity {\n    FUSE_INLINE entity(registry* r):\
