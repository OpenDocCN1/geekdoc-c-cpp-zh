    # Getting Mouse Data


    What if we also want to get our mouse data just as we did for the keyboard? Let''s
    say, for instance, you want to know the current position of your mouse, not based
    on the event but its current state. That''s exactly what we are going to do.


    +   • Custom Vector 2D


    To make it easy for us to store our mouse data and perform two-dimensional operations
    easily, we need to have a custom vector2 type. The following picture describes
    how the coordinate system of SDL works.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_80_0.png)


    The top left corner of the screen is the origin of the coordinate system. Each
    object''s position is also specified by its top-left corner, not its center. The
    position is represented by a two-dimensional vector with (x, y) values. Moving
    down will increase the y-value of the position and moving up will decrease it.
    Moving to the right will increase the x-value and moving up to the left will decrease
    it. Let''s create our custom vector type.


    Create a new folder in your project folder tree: engine/src/math and create a
    file called vec2.h with the following code.


