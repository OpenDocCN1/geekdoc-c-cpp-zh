    Visual Studio Code 是一个轻量但功能强大的源代码编辑器，可在桌面上运行，并提供 Windows、macOS 和 Linux 版本。它内置了对
    JavaScript、TypeScript 和 Node.js 的支持，并为其他语言（如 C++、C#、Java、Python、PHP、Go）和运行时（如
    .NET 和 Unity）提供了丰富的扩展生态系统 [2]。


    ## Windows 平台安装


    如果您的系统上已经安装了 Visual Studio 2017 或更高版本，并且不打算在任何时候使用 Linux，那么您可以直接跳过本节。但如果您想学习如何设置多平台开发环境，则必须按照以下步骤操作。


    ## 安装 Visual Studio Code


    可以使用 https://code.visualstudio.com/download 下载 VS Code。它提供 32 位和 64 位版本。下载适用于您操作系统的版本（图
    5）。运行 .exe 文件并保持所有配置为默认值，确保启用“添加到 PATH”选项。请注意，默认颜色主题是深色，但您可以在设置中轻松更改它，使用 CTRL+K,
    CTRL+T。


    ![](img/2763810ed0a1572c2bec59ee52dd75be_19_0.png)


    图 5 Windows 版 VS Code


    安装后，它将如下图所示（图 6）。


    ![](img/2763810ed0a1572c2bec59ee52dd75be_20_0.png)


    图 6 Visual Studio Code


    ## 安装 CMake


    CMake 是一个开源的跨平台工具，它使用针对编译器和平台的特定配置文件，生成特定于您的编译器和平台的原生构建工具文件。


    Windows 的预编译二进制文件可在 https://cmake.org/download/ 上以 MSI 包形式获得。64 位系统使用“Windows
    x64 Installer”，32 位系统使用“Windows i386 Installer”。运行下载的 MSI 包安装 CMake，并确保还选择“为所有用户将
    CMake 添加到系统 PATH”。它将全局安装在您的计算机上，以便第三方软件（如 VS Code）可以访问它。安装完成后，打开命令提示符并运行以下命令，以验证它是否已安装在您的系统上。


    ```

