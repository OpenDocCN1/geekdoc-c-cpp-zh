    ## 为何编写此书？


    此书长期以来在我心中占据着特殊的地位。我确信，对于许多和我一样一直在寻找资源，以学习如何自行设计和开发游戏引擎的人来说，这是一本久违的答案。我曾犹豫自己所知道的知识是否符合所谓的“行业标准”。花了我多年时间才能写出关于这个主题的书，我很高兴自己没有自我限制。


