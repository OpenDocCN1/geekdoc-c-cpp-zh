    \    SDL_Renderer* _renderer = NULL;\n    asset_registry* _assets = NULL;\n  \
    \  registry* _registry = NULL;\n};\n};\n```\n\n你还必须确保更新场景的 register_system() 函数，以便在注册新系统时，该系统的\
