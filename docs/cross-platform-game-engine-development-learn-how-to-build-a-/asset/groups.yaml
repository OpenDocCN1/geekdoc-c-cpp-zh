    \n这让我们能够看到当我们的引擎需要渲染许多实体时表现如何。查看任务管理器以了解 CPU 和 GPU 的使用情况。\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_152_0.png)\n\
