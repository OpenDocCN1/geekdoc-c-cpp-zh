  md: "\nThe asset serializer is similar to the entity serializer. We have two main\
    \ functions to de- and serialize all asset types using each asset type custom\
    \ de- and serialize function.\n\nThe deserialize function takes the renderer as\
    \ parameter because it is required to load textures in SDL.\n\nWe will also add\
    \ other functions to de- and serialize other asset types later.\n\nTo make it\
    \ possible for the asset serializer to access the map inside of the asset registry,\
    \ we are going to make the asset serializer class a friend of the asset registry\
    \ class.\n\nThe next code snippet shows how it is done.\n\n```\nengine/src/assets/registry.h\n\
    #pragma once\n#include \"font.h\"\n#include \"audio.h\"\n#include \"tilemap.h\"\
    \n#include \"texture.h\"\n#include \"animation.h\"\n#include \"core/typeid.h\"\
    \nnamespace fuse {\nstruct asset_registry {\n    FUSE_NOEXCEPT asset_registry()\
    \ = default;\n    // . . .\nprivate:\n    friend struct asset_serializer;\n  \
    \  std::unordered_map<asset_typeid, std::vector<asset*>> _data;\n};\n}\n```\n\n\
    The friend declaration appears in a class body and grants a function or another\
    \ class access to private and protected members of the class where the friend\
    \ declaration appears. [3]\n\nThis will make it possible for the asset serializer\
    \ to access the \"_data\" member variable. We could have implemented a function\
    \ that returns a reference to the data map.\n\n## Implementation of Member Functions\n\
    \nThe next code snippet shows the implementation of the main de- and serialize\
    \ functions of the asset serializer.\n\n```\nengine/src/assets/serializer.h\n\
    // . . .\n\n// serialize all asset types\nFUSE_INLINE void serialize(YAML::Emitter&\
    \ em) {\n    em << YAML::Key << \"assets\" << YAML::Value << YAML::BeginSeq;\n\
    \    {\n        // serialize animations\n        serialize_animations(em);\n\n\
    \        // serialize textures\n        serialize_textures(em);\n\n        //\
    \ serialize audios\n        serialize_audios(em);\n\n        // serialize fonts\n\
    \        serialize_fonts(em);\n    }\n    em << YAML::EndSeq;\n}\n\n// deserialize\
    \ all asset types\nFUSE_INLINE void deserialize(YAML::Node& nodes, SDL_Renderer*\
    \ r) {\n    // clear registry\n    _assets->clear();\n\n    // deserialize assets\n\
    \    for (auto node : nodes) {\n        deserialize_texture(node, r);\n      \
    \  deserialize_animation(node);\n        deserialize_audio(node);\n        deserialize_font(node);\n\
    \    }\n}\n\n// . . .\n```\n\nSimilar to the entity serializer, we simply have\
    \ to call for each asset type a custom function to serialize the asset. The only\
    \ difference in the serialize function is that we will serialize all assets of\
    \ a specific type in one function.\n\nLet us implement all functions to de- and\
    \ serialize all asset types. The following functions are all implemented in the\
    \ asset serializer. “engine/src/assets/serializer.h”\n\n## Texture Asset Serialization\n\
    \n```\n// ...\n// serialize texture_asset\nFUSE_INLINE void serialize_textures(YAML::Emitter&\
    \ em) {\n    for (auto asset : _assets->data | type_id<texture_asset>) {\n   \
    \     auto texture = static_cast<texture_asset*>(asset);\n        em << YAML::BeginMap;\n\
    \        {\n            em << YAML::Key << \"texture\";\n            em << YAML::BeginMap;\n\
    \            {\n                em << YAML::Key << \"id\" << YAML::Value << texture->id;\n\
    \                em << YAML::Key << \"name\" << YAML::Value << texture->name;\n\
    \                em << YAML::Key << \"source\" << YAML::Value << texture->instance.filename;\n\
    \            }\n            em << YAML::EndMap;\n        }\n        em << YAML::EndMap;\n\
    \    }\n}\n// deserialize texture_asset\nFUSE_INLINE void deserialize_texture(YAML::Node\
    \ node, SDL_Renderer* target) {\n    if (auto data = node[\"texture\"]) {\n  \
    \      auto source = data[\"source\"].as<std::string>();\n        auto name =\
    \ data[\"name\"].as<std::string>();\n        auto asset = _assets->load_texture(source,\
    \ name, target);\n        asset->id = data[\"id\"].as<asset_id>();\n    }\n}\n\
    // ...\n```\n\n## Animation Asset Serialization\n\n```cpp\n// . . .\n\n// serialize\
    \ animation_asset\nFUSE_INLINE void serialize_animations(YAML::Emitter& em) {\n\
    \    for (auto asset : _assets->data | type_id<animation_asset>) {\n        auto\
    \ anim = static_cast<animation_asset*>(asset);\n        em << YAML::BeginMap;\n\
    \        {\n            em << YAML::Key << \"animation\";\n            em << YAML::BeginMap;\n\
    \            {\n                em << YAML::Key << \"id\" << YAML::Value << anim->id;\n\
    \                em << YAML::Key << \"name\" << YAML::Value << anim->name;\n \
    \               em << YAML::Key << \"speed\" << YAML::Value << anim->instance.speed;\n\
    \            }\n            // serialize frames\n            for (int i = 0; i\
    \ < anim->instance.frames.size(); i++) {\n                auto temp = \"frame\"\
    \ + std::to_string(i);\n                em << YAML::Key << temp << YAML::Value\
    \ << anim->instance.frames[i];\n            }\n            em << YAML::EndMap;\n\
    \        }\n        em << YAML::EndMap;\n    }\n}\n\n// deserialize animation_asset\n\
    FUSE_INLINE void deserialize_animation(YAML::Node node) {\n    if (const auto\
    \ data = node[\"animation\"]) {\n        auto name = data[\"name\"].as<std::string>();\n\
    \        auto asset = _assets->add<animation_asset>(name);\n        // deserialize\
    \ frames\n        int i = 0;\n        while (true) {\n            auto temp =\
    \ \"frame\" + std::to_string(i);\n            if (!data[temp]) { break; }\n  \
    \          auto frame = data[temp].as<asset_id>();\n            asset->instance.frames.push_back(frame);\n\
    \            i++;\n        }\n    }\n    asset->instance.speed = data[\"speed\"\
    ].as<int>();\n    asset->id = data[\"id\"].as<asset_id>();\n}\n```\n\nBecause\
