    , \"boom\");\n\n    // . . .\n}\n\n// . . .\n```\n\n## 背景音乐\n\n在游戏过程中播放背景音乐是很常见的。它为游戏增添了生机和乐趣。我们需要一个可以调用的函数来播放资产注册表中可用的任何音效。因此，将以下函数添加到“script_instance”中。\n\
