  mdcn: "\n\n## 脚本组件\n\n我们将在一个名为“behaviour.h”的新头文件中创建另一类组件。以下是脚本组件定义的代码片段。\nengine/src/ecs/components/behaviour.h\n\
    \n```\n#pragma once\n#include \"scripts/script_i_instance.h\"\n\nnamespace fuse::ecs\
    \ {\nstruct script_component {\nFUSE_INLINE script_component(const script_component&)\
    \ = default;\nFUSE_INLINE script_component() = default;\n\ntemplate <typename\
    \ T>\nFUSE_INLINE void bind() {\ninstantiate = [](const script_props& props) {\n\
    auto script = static_cast<script_i_instance*>(new T());\nscript->init(props);\n\
    return script;\n}};\n\nscript_i_instance* instance = NULL;\nscript_instantiator\
    \ instantiate;\nstd::string name;\n};\n```\n\n在成员变量部分，我们有一个指向脚本实例的指针、一个实例化器以及脚本的名称。如你所见，成员函数\
    \ bind() 用于设置该 lambda 表达式“instantiate”的值，它将被调用来创建脚本实例。别担心，片刻后你就会明白。\n\n## 脚本系统\n\
    \n脚本系统的主要工作是定位所有带有脚本组件的实体，实例化它们的脚本实例，并调用它们的 **on_start()** 和 **on_update()** 函数。以下是脚本系统的代码片段。\n\
    \n```\n#pragma once\n#include \"ecs/system.h\"\n\nnamespace fuse::ecs {\nstruct\
    \ script_system {\nFUSE_INLINE ~script_system() {\nfor (auto& e : view<script_component>())\
    \ {\nauto& script = e.get_component<script_component>();\nFUSE_DELETE(script.instance);\n\
    }\n}\n\nFUSE_INLINE void start() {\nfor (auto& e : view<script_component>()) {\n\
    auto& script = e.get_component<script_component>();\nscript.props(e, _registry,\
    \ _assets);\nscript.instance = script.instantiate(props);\nscript.instance->on_start();\n\
    }\n}\n\nFUSE_INLINE void update(float dt) {\nfor (auto& e : view<script_component>())\
    \ {\ne.get_component<script_component>().instance->on_update(e, dt);\n}\n}\n};\n\
    }\n```\n\n如你所见，我们在脚本系统的 start 函数中调用每个实体脚本的 start 函数，并在脚本系统的 update 函数中调用实体脚本组件的\
    \ update 函数。\n我们还要确保为每个脚本实例分配的内存也会被释放。这就是为什么我们定义了系统的析构函数。\n\n## 碰撞回调\n\n如果你仔细查看脚本实例的定义，会发现它还有一个名为\
    \ on_collision(ecs::entity) 的函数。当带有脚本的实体与另一个实体碰撞时，应该调用这个函数。与其碰撞的实体将作为参数传递，以便可以对该实体采取进一步操作。然而，在脚本系统中，我们无法调用该函数。这就是为什么我们将更新碰撞系统的代码，以便当带有脚本的实体与另一个实体碰撞时，可以调用\
    \ on_collision() 函数。\n\n```\nengine/src/ecs/systems/collision_system.h\n\nFUSE_INLINE\
    \ void update(float) {\n    // get entity list\n    auto entities = view<collider_component>();\n\
    \n    for (auto& e : entities) {\n        auto& tr = e.get_component<transform_component>();\n\
    \        auto& c1 = e.get_component<collider_component>();\n\n        // update\
    \ box collider offset\n        c1.collider.x = tr.translate.x;\n        c1.collider.y\
    \ = tr.translate.y;\n\n        // continue if disabled\n        if(c1.disabled)\
    \ { continue; }\n\n        // check collision with others\n        for (auto&\
    \ o : entities) {\n            if (o == e) { continue; }\n            auto& c2\
    \ = o.get_component<collider_component>();\n            if(check_collision(c1.collider,\
    \ c2.collider)) {\n                if(e.has_component<script_component>()) {\n\
    \                    auto& script = e.get_component<script_component>();\n   \
    \                 script.instance->on_collision(o);\n                }\n     \
    \       }\n        }\n    }\n}\n```\n\n上面的代码片段展示了如何修改碰撞系统的 update 函数以调用脚本的 on_collision()\
    \ 函数。我们在这里只需要做一件事：确保每次发生碰撞时，检查实体是否具有脚本组件。如果有，我们将调用 on_collision() 函数，并传入它碰撞的实体作为参数以供后续使用。\n\
