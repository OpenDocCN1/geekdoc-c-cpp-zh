    # # Sprite Renderer


    You''ll see how simple it is to add new features to our engine from now on.

    This chapter will go through how to render textures. We will create a sprite component
    that takes the asset_id of a texture asset. That component will be attached to
    an entity and will be drawn to the screen via a sprite renderer system.

    Before we get to render the texture or even create the component, we want to see
    how to load them from source files.'
  - '[PAGE 123]


    # Loading Textures


    We already have an asset registry defined. So, let''s add a function to load textures.
    Below is a code snippet that shows how a texture can be loaded to the asset registry.
    Make sure to update your asset registry accordingly.


    ```

    ```cpp

    // ...

    engine/src/assets/registry.h

    // ...

    FUSE_INLINE texture_asset* load_texture(const std::string& src,

    const std::string& name, SDL_Renderer* rd) {

    texture texture;

    texture.data = IMG_LoadTexture(rd, src.c_str());

    texture.filename = src;

    if (!texture.data) {

    FUSE_ERROR("%s", IMG_GetError());

    return NULL;

    }

    SDL_QueryTexture(texture.data, NULL, NULL, &texture.width,

    &texture.height);

    auto asset = new texture_asset();

    asset->instance = texture;

    asset->name = name;

    _data[type_id<texture_asset>()].push_back(asset);

    return asset;

    }

    // ...

    ```

    ```


    IMG_LoadTexture() is a built-in function in SDL_image that loads pixel data from
    files. It supports a variety of image formats, including PNG, TIFF, JPG, and JPEG.
    This method loads the pixel data into a memory block and returns the address to
    the first pixel data.


    In order for us to know the size of a texture, we need to explicitly query it
    using the SDL_QueryTexture() function. This function takes a pointer to a texture
    and two integer pointers for the width and the height to store the requested size.


    The load_texture() function also takes the name of the asset as an argument. This
    makes sure that every asset has a name that can be used to find it. Two assets
    can have the same name, but they will never have the same asset_id. That''s why
    we don''t have to worry about an asset being overwritten due to its name already
    being used.'
  - "[PAGE 124]\n\n# Sprite Component\n\nIf you remember from the ECS chapter, we\
    \ said we would create our components in categories to reduce the number of inclusion\
    \ statements because it has a beneficial effect on the compile time. The first\
    \ category we created was found in ecs/components/common.h.\n\nLet's now create\
    \ another category in a new file called graphics.h. We will create all the components\
    \ related to graphics in this file. Below is the code snippet of the sprite component.\n\
    \n```\nengine/src/ecs/components/graphics.h\n#pragma once\n#include \"assets/asset.h\"\
    \nnamespace fuse::ecs {\nstruct sprite_component {\n    FUSE_INLINE sprite_component(\
    \ const sprite_component& ) = default;\n    FUSE_INLINE sprite_component() = default;\n\
    \    SDL_RendererFlip flip = SDL_FLIP_NONE;\n    asset_id sprite = INVALID_ID;\n\
    };\n}\n```\n\nThis component only has an asset_id and a flag called \"flip,\"\
    \ which defines the orientation of the sprite. SDL_RendererFlip is an enumeration\
    \ of flags that can be used to set the orientation of a sprite while rendering\
    \ it. Here are the possible values it could take:\n\n| SDL_FLIP_NONE | do not\
    \ flip |\n| SDL_FLIP_HORIZONTAL | flip horizontally |\n| SDL_FLIP_VERTICAL | flip\
    \ vertically |\n\nOnly when required will the texture associated with the asset\
    \ id be fetched and utilized. This method is useful for serialization. We can\
    \ serialize components that have assets without knowing the contents of the asset\
    \ itself. It also paves the way for multithreading. Because, for example, while\
    \ loading a scene, we may delegate the loading of assets and components to multiple\
    \ threads. This will improve our engine's capacity to load scenes and assets.\n\
    \nIt is best practice to include a default constructor and a copy constructor\
    \ in all your components because you want to be able to attach the component to\
    \ an object without having to write any code."
  - "[PAGE 125]\n\n# Sprite Renderer System\n\nNow that we can load the texture, and\
