    │   ├── bin\n│   ├── libs\n│   └── includes\n├── resource\n├── build-win.bat\n\
    ├── build-linux.sh\n└── CMakeLists.txt\n```\n\n图 17 项目文件夹树\n\n上面（图 17）是我们项目文件夹结构的表示。\n\
    \n注意：在继续之前，请确保创建包含所有现有文件和文件夹的类似文件夹树。\n\n我们在介绍中提到，我们的项目将由一个引擎库和一个游戏可执行文件组成。因此，在我们的项目文件夹树中，有一个名为\
    \ \"engine\" 的文件夹和另一个名为 \"game\" 的文件夹。\n\"windows\" 文件夹将用于存储与 Windows 平台相关的所有依赖项，例如\
    \ .lib、.dll 文件和外部包含头文件。\n为了使 VS-Code 能够使用我们之前安装的 C/C++ 扩展，我们必须首先创建一个名为 \".vscode\"\
    \ 的文件夹，在其中放置下面显示的三个 JSON 文件：\"c_cpp_properties.json\"、\"launch.json\" 和 \"tasks.json\"\
    。\n让我们逐一了解每个文件的作用。\n\n## c_cpp_properties.json\n\n```json\n{\n  \"configurations\"\
    : [\n    {\n      \"name\": \"configs\",\n      \"includePath\": [\n        \"\
    ${workspaceFolder}/windows/includes/**\",\n        \"${workspaceFolder}/engine/src/**\"\
    \n      ],\n      \"defines\": [\"_DEBUG\", \"FUSE_EXPORT\"],\n      \"cStandard\"\
    : \"c17\",\n      \"cppStandard\": \"c++17\",\n      \"intelliSenseMode\": \"\
    ${default}\"\n    }\n  ],\n  \"version\": 4\n}\n```\n\n此文件用于配置 VS-Code 中的 C/C++\
    \ 扩展，以提供适当的 IntelliSense、错误检查和语法高亮。需要注意的是，这对代码编译过程没有影响。其目的仅仅是改善我们在 VS-Code 中的编码体验。\n\
    此处定义的符号仅用于代码高亮。C++ 语言标准也是如此；它仅用于改善代码补全。IntelliSense 模式设置为 \"default\"，以确保我们使用当前系统默认模式。我们也可以指定类似\
    \ \"clang-x64\" 的模式。\n\n## launch.json\n\n```json\n{\n    \"version\": \"0.2.0\"\
    ,\n    \"configurations\": [\n        {\n            \"name\": \"Windows\",\n\
    \            \"type\": \"cppvsdbg\",\n            \"request\": \"launch\",\n \
    \           \"console\": \"integratedTerminal\",\n            \"cwd\": \"${workspaceFolder}/build/bin/Debug\"\
    ,\n            \"program\": \"${workspaceFolder}/build/bin/Debug/game.exe\"\n\
    \        },\n        {\n            \"name\": \"Linux\",\n            \"type\"\
    : \"cppdbg\",\n            \"request\": \"launch\",\n            \"console\":\
    \ \"integratedTerminal\",\n            \"miDebuggerPath\": \"/usr/bin/gdb\",\n\
    \            \"cwd\": \"${workspaceFolder}/build/bin\",\n            \"program\"\
    : \"${workspaceFolder}/build/bin/game\"\n        }\n    ]\n}\n```\n\n此文件用于配置 VS-Code\
    \ 中的调试器。我们必须为每个平台定义一个配置，因为我们的程序将在 Windows 和 Linux 上运行。\n我们为每个配置命名，然后提供希望使用的调试器类型。\n\
    接下来，我们决定是要使用 VS-Code 中的内置终端还是单独的控制台来输出调试消息，最后，我们告诉 VS-Code 在开始调试时要执行哪个程序。在此示例中，我们的游戏可执行文件将位于\
    \ Windows 的 \"build/bin/Debug\" 文件夹和 Linux 的 \"build/bin\" 文件夹中。\n\n- tasks.json\n\
    \n```json\n{\n  \"tasks\": [\n    {\n      \"type\": \"shell\",\n      \"label\"\
    : \"build everything\",\n      \"windows\": { \"command\": \"${workspaceFolder}/build-win.bat\"\
    \ },\n      \"linux\": { \"command\": \"${workspaceFolder}/build-linux.sh\" },\n\
    \      \"problemMatcher\": [ \"$gcc\" ],\n      \"options\": { \"cwd\": \"${workspaceFolder}\"\
    \ },\n      \"group\": { \"kind\": \"build\", \"isDefault\": true },\n    },\n\
    \  ],\n  \"version\": \"2.0.0\"\n}\n```\n\n此文件用于配置 VS-Code 任务，如构建任务、清理任务等。由于 VS-Code\
    \ 默认不知道如何编译我们的项目，我们必须通过给出将在请求编译项目时执行的命令或 Shell 脚本，明确告诉它要做什么。\n\n## 构建 Shell 脚本\n\
    \n在我们项目树的根目录中（图 17），您可以看到两个脚本文件：build-win.bat 和 build-linux.sh，分别用于 Windows 和\
    \ Linux。\n\n## build-win.bat (Windows)\n\n```\n@echo off\n\nif not exist build\
    \ mkdir build\n\nrem generate cmake files\ncmake -S. -B ./build -DCMAKE_BUILD_TYPE=Debug\
    \ -DBUILD_SHARED_LIBS=ON\n\nrem copy assets & dll files to output dir\nrobocopy\
    \ \"./resource\" \"./build/bin/Debug/assets\" /E\nrobocopy \"./windows/bin/\"\
    \ \"./build/bin/Debug/\" /E\n\nrem compile project\ncd build && cmake --build\
    \ .\necho compilation finished!\n```\n\n## build-linux.sh (Linux)\n\n"
