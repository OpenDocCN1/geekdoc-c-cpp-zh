    \ data[\"id\"].as<asset_id>();\n    }\n}\n\n// ...\n```\n\n## Font Asset Serialization\n\
    \n```cpp\n// . . .\n\n// serialize font_asset\nFUSE_INLINE void serialize_fonts(YAML::Emitter&\
    \ em) {\n    for (auto asset : _assets->data | type_id<font_asset>) {\n      \
    \  auto font = static_cast<font_asset*>(asset);\n\n        em << YAML::BeginMap;\n\
