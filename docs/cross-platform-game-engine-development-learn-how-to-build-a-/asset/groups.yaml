    template argument for the type of the event to post with all the parameters necessary
    to construct that event. Let''s say, for instance, that the window was resized.
    The dispatcher would post an event, passing the new size of the window as a parameter
    to the post function. The map “_events” stores all events posted in the current
    frame so that they will all be managed once before the beginning of the next frame.
    This technique is called "event polling." The basic idea is to collect all the
    events that have occurred and deal with them all at once. The other way around
    would be to directly manage events as they occur. One instance of why the second
    technique would not be the best solution for a game engine would be in a scenario
    where your engine is currently rendering your scene, and then suddenly, an event
    occurs right in the middle of the rendering process. Your engine would then have
    to stop the rendering process to first handle the event that occurred and then
    come back to finish the rendering of the scene. That can be a problem if an event
    occurs many times in a frame, as this will block the renderer from doing his job.
    On the other hand, the polling technique requires that we maintain the memory
    state to prevent memory overflow.


    # Register Callback Functions


    The second functionality is to register all callback functions for each event
    type. This is done using the add_callback() function. It takes a reference to
    a callback_function as parameter and stores it in the _callback map.


    # Handle Events


    The last job of the dispatcher is to dispatch all the events that occurred and
    call their callback functions. As you can see, both maps _events and _callback
    have the event_id of the event as the first data point of their pair, which makes
    it easy to find the callback function for each event type because each event has
    a unique typeid. The dispatch() function is the one in charge of calling all callback
    functions for each event type. We simply loop through the map of events that have
    occurred and find the callback function with the same event_id in the _callback
    map and execute it, passing the pointer to the event. We then finish the loop
    by calling the clear() function of the _events map to make sure the destructor
    of each event is called to free the memory.


    # Example of Events


    Go ahead and create a new folder called “events” with a header file called system.h.
    That folder will be used to create our custom event types.


