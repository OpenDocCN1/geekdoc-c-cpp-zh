  mdcn: "\n\n## 刚体\n\n刚体是指在外力作用下不会产生变形的固体对象。假设物体不发生变形，可以通过减少进行真实模拟所需的参数数量来简化分析。其目的是让我们的玩家，或任何受重力影响的对象，用于碰撞处理等。\n\
