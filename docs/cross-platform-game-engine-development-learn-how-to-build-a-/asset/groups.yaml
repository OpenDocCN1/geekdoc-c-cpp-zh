    \ That's why we will download the Visual C++ version.\n\n- Step 2: Unpack\n\n\
    Unpack the downloaded package using WinRAR, Zip, or any other package manager\
    \ of your choice. Within the unpacked directory, there are two primary subdirectories:\
    \ “include” and “lib”. All header files are in the include folder and the library’s\
    \ binaries are found in the lib folder. The SDL comes in 32-bit and 64-bit versions\
    \ under the x86 and x64 folders, respectively. Using the 32-bit or 64-bit version\
    \ has no effect on our coding experience; only the final product is altered. Using\
    \ 32-bit allows you to run the final piece of software on both 32-bit and 64-bit\
    \ systems, but the opposite is not true. The 64-bit version will be used in this\
    \ book.\n\n```\nSDL2-2.x.x\n|--- lib\n|    |--- x86 <--- 32-bit binaries\n|  \
    \  |--- x64 <--- 64-bit binaries\n|--- include\n```\n\n- Step 3: Copy\n\nCopy\
    \ all header files found in SDL2-2.x.x/include/ into the folder Project/windows/includes/SDL2/\
    \ of your project.\n\nCopy the following .lib files SDL2.lib, SDL2main.lib from\
    \ SDL2-2.x.x/lib/x64 into your Project/windows/libs folder.\n\nAlso make sure\
    \ to copy the SDL2.dll file from SDL2-2.x.x/lib/x64 in the folder: Project/windows/bin.\n\
    \nWe now officially have SDL2 installed and ready to use, but we still have to\
    \ link it to our project. But before we get to that, we will first install all\
    \ of the extension libraries for SDL as well.\n\n- Step 4: Installing SDL_image,\
    \ SDL_ttf, SDL_mixer\n\nSDL2 alone is not enough for us to implement all the features\
    \ mentioned earlier in our game engine. That’s why we will also use other extension\
    \ libraries of SDL: SDL_image, SDL_mixer, and SDL_ttf.\n\n- SDL_image\n\nSDL_image\
    \ [12] is an image file loading library. It loads images as SDL surfaces and textures,\
    \ and supports the following formats: BMP, GIF, JPEG, LBM, PCX, PNG, PNM, SVG,\
    \ TGA, TIFF, WEBP, XCF, XPM, XV. Download it here: https://www.libsdl.org/projects/SDL_image/\
    \ .\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_41_0.png)\n\n- SDL_mixer\n\nSDL_mixer\
    \ [13] is a simple multi-channel audio mixer library. It supports any number of\
    \ simultaneously playing channels of 16-bit stereo audio, plus a single channel\
    \ of music, mixed by the popular FLAC, MikMod Mod MOD, Timidity MIDI, Ogg Vorbis,\
    \ and SMPEG MP3 libraries: https://www.libsdl.org/projects/SDL_mixer/.\n\n###\
    \ Windows\nSDL2_mixer-devel-2.0.4-VC.zip (Visual C++ 32/64-bit)\nSDL2_mixer-devel-2.0.4-mingw.tar.gz\
    \ (MinGW 32/64-bit)\n\n- SDL_ttf\n\nSDL_ttf [14] is a sample library that allows\
    \ you to use TrueType fonts in your SDL applications. It comes with an example\
    \ program \"showfont\" which displays an example string for a given TrueType font\
    \ file. Download it using the following link: https://www.libsdl.org/projects/SDL_ttf/.\n\
    \n### Windows\nSDL2_ttf-devel-2.0.15-VC.zip (Visual C++ 32/64-bit)\nSDL2_ttf-devel-2.0.15-mingw.tar.gz\
    \ (MinGW 32/64-bit)\n\nMake sure you copy the header files for each extension\
    \ library into the project/windows/includes/SDL2 directory as we did previously\
    \ for SDL. You need to repeat the same process for all .lib and .dll files for\
    \ each library, respectively.\n\n- Step 5: Link to Project\n\nNow that all files\
    \ are downloaded and copied in their proper directories, all we must do is to\
    \ link them to our project.\n\nUpdate the engine's CMakeLists.txt file as shown\
    \ in the following code.\n\n- Project/engine/CMakeLists.txt\n\n```\n# . . .\n\n\
    # windows platform\nif ( WIN32)\n    target_link_libraries(${PROJECT_NAME} SDL2\
    \ SDL2main SDL2_image\nSDL2_ttf SDL2_mixer)\n    target_include_directories(${PROJECT_NAME}\
    \ PUBLIC C\n${CMAKE_SOURCE_DIR}/windows/includes)\n    target_link_directories(${PROJECT_NAME}\
    \ PUBLIC C\n${CMAKE_SOURCE_DIR}/windows/libs)\nendif ( WIN32)\n\n# . . .\n```\n\
    \nAs you can see, we use the function “target_link_libraries” to specify which\
    \ library we want to link to our project. SDL2, SDL2main, SDL2_image, SDL2_ttf,\
    \ and SDL2_mixer is all linked to our engine.\nThat’s all there is to linking\
    \ SDL libraries to our project on Windows. Now let’s do the same thing with Linux.\n\
    \n## Installing SDL on Linux\n\nThe following installation instructions are only\
    \ for Debian/Ubuntu 64-bit based distributions.\n\nNote: You’ll need root rights\
    \ to install all the packages in this section.\n\n- Step 1: Update Package Manager\n\
    \nAn old version of the package manager may not support the current version of\
    \ SDL2, make sure you’ve upgraded to the latest version using the next command.\n\
    sudo apt-get update\n\n- Step 2: Find current Version of SDL\n\nThe following\
    \ command will search the apt-get cache of the current SDL2 version we want to\
    \ install.\nsudo apt-cache search libsdl2\n\n- Step 3: Download Development Version\
    \ of SDL2\n\nlibsdl2-dev is the development package for SDL2. You can use the\
    \ following command to install the package on your system.\nsudo apt-get install\
    \ libsdl2-dev\n\nYou can see where it is installed on your system by navigating\
    \ to the following directories: “/usr/include/SDL2” for header files and “/usr/lib/x86_64-linux-gnu”\
    \ for binaries.\n\nJust like that we have SDL2 installed on our system and all\
    \ we need to do is to link it to our project. But we also want to repeat the process\
    \ for SDL_image, SDL_ttf and SDL_mixer as well.\n\n- Step 4: Installing SDL_image,\
    \ SDL_ttf, and SDL_mixer\n\nThis part is a little bit tricky as we need to manually\
    \ create some files to instruct CMake about where to find each extension library.\
    \ Use the following commands to install each library on your system. These commands\
    \ will also install these libraries in the same locations as SDL2.\n\n```\nsudo\
    \ apt-get install libsdl2-image-dev\nsudo apt-get install libsdl2-mixer-dev\n\
    sudo apt-get install libsdl2-ttf-dev\n```\n\nAfter you've completed the installation,\
    \ we'll need to create a “.cmake” config file for each library installed above.\
    \ These files will be used by CMake to locate the library files. In some cases,\
    \ the commands above will automatically create all “.cmake” config files for each\
    \ library, but we want to consider the worst-case scenario. So, let's see how\
    \ that can be done.\n\n- SDL_image (sdl2_image-config.cmake)\n\nUse this command\
    \ to create and open a new “.cmake” file for SDL_image.\n\n```\ncd /usr/x86_64-linux-gnu/cmake/\n\
    mkdir sdl2_image\ncd sdl2_image\nsudo nano sdl2_image-config.cmake\n```\n\nCopy\
    \ the following code in the file created above and save it with Ctrl-X.\n\n```\n\
    set(prefix \"/usr\")\nset(exec_prefix \"${prefix}\")\nset(libdir \"${prefix}/lib/x86_64-linux-gnu\"\
    )\nset(SDL2_IMAGE_PREFIX_I \"/usr\")\nset(SDL2_IMAGE_EXEC_PREFIX_I \"/usr\")\n\
    set(SDL2_IMAGE_INCLUDE_DIRS \"${prefix}/include/SDL2\")\nset(SDL2_IMAGE_LIBRARIES\
    \ \"-lSDL2_image\")\n```\n\n- SDL_mixer (sdl2_mixer-config.cmake)\n\nUse the following\
    \ commands to create the “.cmake” file for SDL_mixer.\n"
