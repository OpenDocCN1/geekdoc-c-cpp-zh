    \ virtual ~system() = default;\n\n    FUSE_NO_INLINE void prepare(registry* rg,\
    \ SDL_Renderer* rd, asset_registry* as) {\n        this->rg = rg;\n        this->renderer\
    \ = rd;\n        this->_assets = as;\n    }\n\n    template<typename T>\n    FUSE_NO_INLINE\
    \ auto view() {\n        std::vector<entity> entities;\n        for (auto& e :\
