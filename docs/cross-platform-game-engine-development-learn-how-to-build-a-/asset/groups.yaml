    # Potential Features


    Here are some additional features that you could add to your engine


    # Scene Editor


    You can add a scene editor to your engine to make game development easier. There
    are many C++ GUI libraries available, but "Dear ImGui" is one that I would strongly
    recommend.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_267_0.png)


    Figure 52 Example Scene Editor


    # Runtime Scripting


    Runtime scripting allows game engines like Unity and Unreal Engine to quickly
    create game behavior without having to recompile the entire engine every time
    the script code is changed.


    Python is a language that is relatively simple to learn and use. However, you
    can look into scripting with C# and other languages.


    # Joysticks Control


    I would recommend that you look into the ability to play games using joysticks.
    Joystick inputs can be handled using SDL''s built-in event for joysticks.'
