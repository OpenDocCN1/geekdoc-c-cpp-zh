    Before we create a texture asset, we need to define what a texture is. That is
    why we first create the structured texture which stores all information about
    the texture like the size, filename, and pixel data. We then use that structure
    to create the texture_asset. SDL has a datatype for pixel called SDL_Texture.
    It''s a structure that contains an efficient, driver-specific representation of
    pixel data. To create a texture, we just must define an array of pixels. We will
    see how to load a texture from an image file later. It is important to also make
    sure we destroy the texture by calling SDL_DestroyTexture(). That''s why the texture''s
    data will be destroyed when the texture asset''s destructor is called.


