    动态链接引擎可以轻松地将其他编程语言的脚本添加到我们的游戏引擎中，这是游戏引擎的重要功能。它还简化了在保持相同可执行文件的同时添加新功能的过程。


    游戏本身是一个小型应用程序，用于加载和配置引擎的一些模块。这样做是为了将引擎的内部工作对游戏隐藏。在上述设计中，有两个可执行文件（或程序）被允许加载引擎库，用于各自特定的目的。我们有“游戏”和“编辑器”。


