  - '[PAGE 87]


    # Entity Component System


    ECS, or Entity Component System, is a design that separates data from behaviour
    to promote code reuse. Data is usually cache-friendly saved, which enhances performance
    and memory usage.


    The cache memory is a chip-based computer component that improves the efficiency
    with which data is retrieved from the computer''s storage. He serves as a temporary
    storage area from which the computer''s processor may easily retrieve data. This
    temporary storage area, known as a cache, is available to the processor more easily
    and quickly than the computer''s main work storage (DRAM).


    An ECS has the following characteristics:


    +   - It has entities, which are identifiers that are unique.

    +   - components are just datatypes with no behaviour.

    +   - Entities might have a single component or several components.

    +   - Entities can change components on the fly.

    +   - Behaviours are implemented in systems that target entities with a certain
    set of components.'
