    # # Chapter 12 Native Scripting'
  - '[PAGE 174]


    # # Native Scripting


    So far in this book, we have been adding features like texture, text rendering,
    animations, and physics simulations but we still don’t really know how to use
    it all to make a game. We do not want to forget that the main purpose of a game
    engine is to make games not just a bunch of features brought together.


    That’s where scripting comes in. It will make it possible for us to use all the
    features we have added so far to create a game.


    A scripting language, also known as a scripting language, is a programming language
    for a runtime system that automates the execution of processes that would otherwise
    be performed independently by a human operator.


    Scripting languages are frequently interpreted rather than compiled. [26]'
  - '[PAGE 175]


    # Compiled and Interpreted Script


    As you can see from the title, we are going to create a native scripting system.
    That means it is going to be the same programming language as the engine and it
    is also going to be a compiled not interpreted scripting system. This means that
    the script is written as part of the engine source code and is also compiled with
    the engine. An interpreted script compared to a compiled one is a little less
    efficient, but it offers the ability to be hot reloaded at runtime without the
    need of restarting the application but creating one like that requires knowledge
    of multiple programming languages and memory layout which is some we are not trying
    to do in this book. The compiled version has the advantage of being native which
    means better performance and a low level of complexity.


    The following diagram shows an example of an interpreted scripting system using
    C# as a coding language. C# is one of the most widely used scripting languages
    because it is easy to integrate with C++ and because it is easy to understand.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_175_0.png)


    Figure 37 Example of a C#-Scripting Architecture


    Unity3D and many other game engines use C# for scripting. There are also other
    languages like Lua, Java, JavaScript, etc. The C#-code in the diagram above will
    be compiled into a dynamic shared library that can be linked to the engine at
    runtime and the engine will simply call functions from the script to execute the
    developer''s tasks.


    Although this diagram appears to be simple, putting it together requires more
    effort than you may think. Maybe this will be a good topic for another book but
    for now, let''s stick with the native scripting.'
  - '[PAGE 176]


    # # Abstract Script


    Since we will be having many scripts running through a single system, we have
    to somehow create a sort of pattern for all scripts. We want all scripts to have
    certain functions that we would be able to call without checking whether that
    function exists or not. That’s why we are going to use virtual functions and inheritance.
    This section is about creating a core class from which all scripts will inherit
    and decide whether they want to implement their own version of the virtual functions.
    Since this scripting system is quite tied to the entity component system, we want
    to make it easy to access the components of an entity in the registry. That’s
    why we are going to create a custom entity object which has access to the registry.
    That entity object will be used in our scripts to play around with entities. Let’s
    create the entity object first and the rest will be much clear.


    # ## Creating The Script Instance


    The next code snippet shows the definition of the script instance. Make sure to
    update your engine’s folder tree by creating the same file in the. As you can
    see, it is an abstract class with a bunch of virtual functions. In the member
    variables section, we have defined an entity id, a pointer to the asset registry
    and a pointer to the ecs::registry. The entity id is the game object with the
    script. The pointer to the asset registry is important because we want to have
    access to all assets in the script as well.


    Right on top is a structure called script_props which is just a simple container
    we have defined to hold the parameters needed to initialize the script instance.
    We have a bunch of virtual functions that can be implemented in the derived scripts
    to perform custom behaviours on entities. The init() function is used to set the
    member variables to their proper values.


    We also have the script_instantiator at the bottom which is a lambda function
    type that will be used to instantiate the script instance. C++ allows us to create
    inline functions with lambda expressions, which are useful for brief pieces of
    code that won’t be reused and aren’t worth naming. The script_instantiator function
    returns a pointer to a script instance and it takes script_props as an argument.
    That argument will be passed to the init() function of the script to set its member
    variables.


    ```

    engine/src/scripts/script_instance.h

    ```'
