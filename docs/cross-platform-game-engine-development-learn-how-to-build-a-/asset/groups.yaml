    \ : asset {\nFUSE_INLINE animation_asset() = default;\nanimation instance;\n};\n\
    }\n```\n\n## 瓦片地图资源\n\n瓦片地图在 2D 游戏中非常常见。它们通过使用称为瓦片的规则形状图像来构建游戏世界。超级马里奥、吃豆人甚至塞尔达传说等一些流行游戏都使用这种技术来构建关卡。瓦片地图除了可以带来性能改进外，还可以映射到逻辑网格，并且可以在游戏逻辑中以多种方式使用（例如，处理碰撞、实现\
    \ AI），或用于构建关卡编辑器。[20]\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_113_0.png)\n\
    \n图 27 瓦片地图\n\n存储一组瓦片最有效、最常用的方式是通过瓦片集。它本质上就是将你需要的所有瓦片放在一个轻量级图像文件中。到了需要在屏幕上绘制瓦片的时候，只会使用较大图像中的一小部分。下面是用于创建上述场景的瓦片集。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_114_0.png)\n\n图 28 瓦片集\n\n我们游戏引擎中的瓦片地图将由多个实体组成，每个实体附加一个瓦片组件。这使我们能够向瓦片添加更多组件，以实现更高级的游戏效果。例如，我们可以选择仅向某些瓦片添加碰撞体组件，仅在这些瓦片上处理碰撞。这将减少必须进行的碰撞测试次数，并为最终产品带来更好的性能。\n\
    \n注意：我始终使用 \"struct\" 而不是 \"class\"，因为我只是喜欢结构体。它们让我想起 C 语言。如果你愿意，可以随意使用类。唯一的区别是，结构体定义的成员变量和函数默认为公共。\n\
    \nengine/src/assets/tilemap.h\n```cpp\n#pragma once\n#include \"asset.h\"\n\n\
    namespace fuse {\nstruct tileset {\n    std::set<asset_id> tilesets;\n    int\
    \ col_count = 0;\n    int row_count = 0;\n    int tilesize = 0;\n};\n\nstruct\
    \ tilemap_asset : asset {\n    FUSE_INLINE tilemap_asset() = default;\n    tilemap\
    \ instance;\n};\n}\n```\n\n瓦片地图还应该能够组合多个瓦片集来创建场景。这就是我们使用 std::set 来存储所有瓦片集的原因。同样重要的是要知道瓦片的单位大小，因为瓦片地图本质上只是一个网格。\n\
    \n## 资源注册表\n\n现在我们已经定义了所有资源类型，需要创建一个资源注册表来跟踪添加到游戏引擎中的所有资源。接下来是一个代码片段，展示了资源注册表的定义方式。\n\
    \nget() 函数用于使用 asset_id 和类型从注册表中检索特定资源。所有资源都存储在成员变量 _data 中，它是一个资源指针的 std::vector\
    \ 映射。\n\n要检索资源，我们首先检查该特定资源类型是否有可用的数组。我们通过检查资源的 typeid 是否在映射中可用来完成此操作。如果没有可用的数组，我们直接返回\
    \ NULL。但如果找到了数组，我们将继续搜索传入参数的 id 的资源。下一个函数是 get_id()，它将资源名称作为参数，将类型名称作为模板参数。该函数将搜索资源并返回其\
    \ asset_id。\n\n我们还希望能够向注册表中添加资源，因为有些资源（如瓦片地图和动画）并非最初从源文件加载，而纹理、字体和音频则是。这就是我们拥有\
    \ add() 函数的原因。\n\n如果你仔细查看我们定义的所有资源类型，会发现它们都有一个默认构造函数。这是为了确保 add() 函数可以创建该资源的默认版本。\n\
    \nengine/src/assets/registry.h\n```cpp\n#pragma once\n#include \"font.h\"\n#include\
    \ \"audio.h\"\n#include \"tilemap.h\"\n#include \"texture.h\"\n#include \"animation.h\"\
    \n#include \"core/typeid.h\"\n\nnamespace fuse {\nstruct asset_registry {\n  \
    \  FUSE_INLINE void clear() {\n        for(auto& [_, list] : _data) {\n      \
    \      for(auto a : list) { FUSE_DELETE(a); }\n        }\n        _data.clear();\n\
    \    }\n    template <typename T>\n    FUSE_INLINE T* get(asset_id id) {\n   \
    \     FUSE_STATIC_ASSERT(std::is_base_of<asset, T>::value);\n        const auto\
    \ type = type_id<T>();\n        if(!_data.count(type)) { return NULL; }\n    \
    \    for(auto& asset : _data.at(type)) {\n            if(asset->id == id) { return\
    \ static_cast<T*>(asset); }\n        }\n        return NULL;\n    }\n    template\
    \ <typename T>\n    FUSE_INLINE T* get(const std::string& name) {\n        asset_id\
    \ id = get_id(name);\n        FUSE_STATIC_ASSERT(std::is_base_of<asset, T>::value);\n\
    \        const auto type = type_id<T>();\n        if(!_data.count(type)) { return\
    \ NULL; }\n        for(auto& asset : _data.at(type)) {\n            if(asset->id\
    \ == id) { return static_cast<T*>(asset); }\n        }\n        return NULL;\n\
    \    }\n    template <typename T>\n    FUSE_INLINE asset_id get_id(const std::string&\
    \ name) {\n        FUSE_STATIC_ASSERT(std::is_base_of<asset, T>::value);\n   \
    \     const auto type = type_id<T>();\n        if (!_data.count(type)) { return\
    \ INVALID_ID; }\n\n        for (auto& asset : _data.at(type)) {\n            if\
    \ (!asset->name.compare(name)) { return asset->id; }\n        }\n        return\
    \ INVALID_ID;\n    }\n\n    template <typename T>\n    FUSE_INLINE T* add(const\
    \ std::string& name) {\n        auto asset = new T();\n        asset->name = name;\n\
    \        _data[type_id<T>()].push_back(asset);\n        return asset;\n    }\n\
    \nprivate:\n    std::unordered_map<asset_typeid, std::vector<asset*>> _data;\n\
    };\n}\n```\n\n## engine/src/ecs/scene.h\n\n```cpp\n#pragma once\n#include \"assets/registry.h\"\
    \n\n// ...\n\nFUSE_INLINE void start() {\n    auto frame1 = _assets.add<texture_asset>(\"\
    frame1\");\n    auto frame2 = _assets.add<texture_asset>(\"frame2\");\n    auto\
    \ anim = _assets.add<animation_asset>(\"test\");\n\n    anim->instance.frames.push_back(frame1->id);\n\
    \    anim->instance.frames.push_back(frame2->id);\n    anim->instance.speed =\
    \ 200;\n}\n\nfor (auto& sys : _systems) { sys->start(); }\n}\n\nprivate:\nstd::vector<ecs::system*>\
    \ _systems;\nSDL_Renderer* _renderer = NULL;\necs::registry _registry;\nasset_registry\
    \ _assets;\n};\n```\n\n在这种情况下，你必须做三件关键事情：包含资源注册表的头文件，在资源注册表中创建名为 \"_assets\" 的成员变量，并按上述所示修改\
    \ start() 函数。我们只是向注册表添加一个动画资源，以及两个将用作动画帧的纹理资源。\n\n**编译、运行并使用调试器** 以检查一切是否按预期工作。你也可以打印出某些值，看它们是否符合你的预期。我们将在即将到来的章节中了解如何从文件加载纹理、字体和音频资源。\n\
    \n为了让你的 ecs::system 访问我们在场景中刚刚创建的资源注册表，请按下面所示更新你的系统。当我们开始添加精灵渲染器和动画器等系统时，这一点将很重要。\n\
    \nengine/src/ecs/system.h\n```cpp\n#pragma once\n#include \"entity.h\"\n#include\
