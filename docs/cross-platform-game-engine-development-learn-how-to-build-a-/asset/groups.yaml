    \ 的源代码。由于我们希望将 yaml-cpp 构建为共享库，我们使用 \"BUILD_SHARED_LIBS\" 来指示 CMake 此事。\n\n编译完成后，你将在下面的文件夹树中可视化的目录中找到生成的库文件。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_221_0.png)\n\n与所有 SDL 库一样，yaml-cpp\
    \ 也有包含头文件、一个 \".dll\" 和一个 \".lib\" 文件，这些是我们将 yaml-cpp 链接到项目所需的唯一文件。\n\n## 链接 yaml-cpp\n\
    \n我们将使用用于 SDL 的相同技术来链接 yaml-cpp。\n\n### 步骤 1 复制头文件\n\n继续将 yaml-cpp/include 下的头文件文件夹复制到\
