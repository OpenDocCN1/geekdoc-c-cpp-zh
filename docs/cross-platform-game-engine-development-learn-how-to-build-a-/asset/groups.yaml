    \n## 注册回调函数\n\n第二个功能是为每种事件类型注册所有回调函数。这是通过 add_callback() 函数完成的。它以 callback_function\
    \ 的引用作为参数，并将其存储在 _callback 映射中。\n\n## 处理事件\n\n分发器的最后一项工作是分发所有已发生的事件并调用它们的回调函数。如你所见，_events\
