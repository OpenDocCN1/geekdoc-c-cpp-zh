  mdcn: "\n\n内存堆（Heap）上存储所有类型的对象。这意味着我们的数据不会在内存中连续存储。当你要求计算机在内存的特定地址查找某样东西时，它不仅会复制你要求的内容，还会复制你要求的内容周围的其他数据，并将它们全部存储在缓存内存中。因此，下次你要求其他东西时，计算机会直接从缓存中获取，而不是再次从\
    \ RAM 中获取。数据在内存中不连续存储这一事实大幅降低了 CPU 缓存的使用率，导致性能下降。\n\n## 面向组件设计\n\n下图展示了如何构建面向组件的设计。如你所见，每个游戏对象都将拥有一个组件列表，用于定义其行为。所有类似\
    \ Transform、Sprite 等组件都将继承一个名为 Component 的抽象类。\n\n这种技术无法解决面向对象设计中内存和 CPU 缓存使用的问题，但它去除了虚函数的虚拟查找表，并提供了能够让老板同时也是玩家的能力，因为成为玩家或老板仅仅是添加或移除组件的问题。这将比面向对象设计表现更好。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_89_0.png)\n\n## 数据导向设计\n\n数据导向设计听起来更合理，因为它提供了连续的内存布局、没有虚拟查找表以及更好的\
    \ CPU 缓存使用率。这种设计也称为实体-组件（EC）设计。下图描述了 EC 设计中最关键的部分。\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_90_0.png)\n\
    \n### 图 24 数据导向设计\n\n每个游戏对象都由一个数字表示。该数字用于知道哪个组件属于该实体。你可以看到，所有实体中相同类型的所有组件都以连续的方式存储在一起。这将对\
    \ CPU 缓存产生积极影响。许多游戏引擎使用这种设计，因为它提供可靠的性能，且维护也不困难。\n\n## ECS 架构\n\n尽管 ECS 设计因其高性能以及在维护、内存和\
    \ CPU 缓存使用方面的易用性而闻名，但它缺乏特定的实现方法。我通常将实现 ECS 的方法分为两类：纯 ECS 和混合/混杂 ECS。\n\n在纯 ECS\
    \ 中，组件没有逻辑。只有系统持有用于更新组件的逻辑。混合 ECS 允许组件拥有用于自行更新的逻辑。\n\n我们将在本书中构建一个纯 ECS。\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_91_0.png)\n\
    \n使 ECS 设计与数据导向设计不同的是，实体、组件和系统全部被分离。实体只是一个唯一标识符（数字），代表场景中的特定游戏对象。它通常是一个 32 位或\
    \ 64 位无符号整数。组件是一个简单的结构，存储逻辑所需的所有数据。系统针对拥有特定组件集合（签名）的所有实体并更新它们的组件。\n\n### ECS 的优势：\n\
    \n- ECS 是一种用户友好的多线程方法，因为每个系统可以分配给特定线程。\n- 代码更短且更不复杂。\n- 轻松集成脚本语言。\n- 使单元测试和模拟变得容易。\n\
    - 新功能可以轻松实现。\n\n### ECS 的劣势\n\n- 未定义标准实现方法。\n- 正确实现困难且容易被滥用\n- 大多数游戏开发者不太熟悉。\n\
    \n你可以在这里 [16] 和这里 [9] 了解更多关于 ECS 的信息。我们现在有足够的理论知识。那么，让我们实现自己的自定义 ECS。\n\n## 实现\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_93_0.png)\n\n上图是一个图表，展示了你的引擎文件夹树目前应该是什么样子。请确保创建所有标记为红色的内容。文件夹：**components/**\
    \ 是我们将创建组件的地方。所有系统都将在文件夹 **systems/** 中创建。所有系统都将继承 **ecs::system**。\n\n```\nengine/src/ecs/ecs.h\n\
