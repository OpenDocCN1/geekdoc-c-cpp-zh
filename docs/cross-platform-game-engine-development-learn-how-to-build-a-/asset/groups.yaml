    \ | flip vertically |\n\nOnly when required will the texture associated with the\
    \ asset id be fetched and utilized. This method is useful for serialization. We\
    \ can serialize components that have assets without knowing the contents of the\
    \ asset itself. It also paves the way for multithreading. Because, for example,\
    \ while loading a scene, we may delegate the loading of assets and components\
    \ to multiple threads. This will improve our engine's capacity to load scenes\
    \ and assets.\n\nIt is best practice to include a default constructor and a copy\
    \ constructor in all your components because you want to be able to attach the\
    \ component to an object without having to write any code.\n\n### Sprite Renderer\
    \ System\n\nNow that we can load the texture, and that we have our sprite component\
    \ ready, let's create a system that will target all entities with a sprite component\
    \ and render their sprites to the screen.\n\n```cpp\nengine/src/ecs/systems/sprite_renderer_system.h\n\
    \n#pragma once\n#include \"ecs/system.h\"\n\nnamespace fuse::ecs {\nstruct sprite_renderer_system\
    \ : system {\n    FUSE_INLINE void update(float) {\n        for (auto& e : view<sprite_component>())\
    \ {\n            // get components\n            auto& tr = e.get_component<transform_component>();\n\
    \            auto& sp = e.get_component<sprite_component>();\n\n            //\
    \ get texture from asset registry\n            auto& sprite = _assets->get<texture_asset>(sp.sprite)->instance;\n\
    \n            // define target viewport\n            SDL_FRect dst{\n        \
    \        tr.translate.x, tr.translate.y,\n                sprite.width * tr.scale.x,\
    \ sprite.height * tr.scale.y\n            };\n\n            // render sprite\n\
    \            SDL_RenderCopyExF(_renderer, sprite.data, NULL, &dst,\n         \
    \       tr.rotation, NULL, sp.flip);\n        }\n    }\n};\n}\n```\n\nWe are retrieving\
    \ the list of entities with a sprite component, and we loop through the list and\
    \ render each entity's sprite. We start by getting the transform component because\
    \ we want to know where and how the sprite will be rendered to the screen. We\
    \ then proceed to get the sprite component, which gives us the asset_id of the\
    \ sprite to render. We then retrieve the texture asset from the asset registry.\n\
    \nTo render the sprite, we use the function SDL_RenderCopyExF(). This function\
    \ takes a pointer to the target renderer as its first argument. The renderer was\
    \ created alongside the window and was passed to the scene's constructor as an\
    \ argument, which also passed to the system::prepare() function. The second argument\
    \ is a pointer to the texture buffer. The third argument is a const pointer to\
    \ an SDL_FRect, which is the source viewport of the texture. It defines which\
    \ part of the texture should be copied and rendered. We are passing NULL because\
    \ we want to render the entire sprite, not just a specific part of it.\n\nThe\
    \ next argument, which is also related to the previous one, is the destination\
    \ viewport. It defines the box or viewport in which the sprite will be rendered\
    \ on the screen.\n\nThe fifth parameter is the angle or rotation of the sprite\
    \ on the screen. We also have the ability to change the center of the object we\
    \ are currently rendering by passing a pointer to an SDL_Point, which is just\
    \ a point in 2D space that specifies the point around which the sprite should\
    \ be rotated. We are passing NULL because we want to keep the SDL's default origin\
    \ which is the top left corner of the sprite.\n\n**Note:** Remember to include\
    \ your component categories in `system.h` so that every system can access all\
    \ the components to perform its task.\n\nJust like that, the sprite renderer system\
    \ has been added to our engine. All we must do is go into our scene, register\
    \ the system, create an entity with a sprite component, and run the whole to see\
    \ the result.\n\nBelow is the code that shows which part of your scene has to\
    \ be updated to test the sprite renderer system we just created.\n\n```cpp\nengine/src/ecs/scene.h\n\
    \n#pragma once\n#include \"ecs/systems/sprite_renderer_system.h\"\nnamespace fuse::ecs\
    \ {\nstruct scene {\n    FUSE_INLINE scene(SDL_Renderer* rd): _renderer(rd) {\n\
    \        register_systems<ecs::sprite_renderer_system>();\n    }\n    // ...\n\
    \    FUSE_INLINE void start() {\n        // load texture asset\n        auto sprite\
    \ = assets::load_texture(\"assets/test.png\",\n            \"test\", _renderer);\n\
    \        // create entity\n        ecs::entity entity = add_entity(\"entity\"\
    );\n        // add sprite component\n        entity.add_component<ecs::sprite_component>().sprite\
    \ = sprite->id;\n        // start systems\n        for (auto& sys : _systems)\
    \ { sys->start(); }\n    }\n    // ...\n};\n}\n```\n\nWe start by registering\
    \ the system in the scene's constructor. We then go on to load the texture from\
    \ a file and add an entity with a sprite component in the start() function.\n\n\
    Put any texture file with the name \"test.png\" in your \"resource\" folder and\
    \ compile your project. You will get the sprite rendered on the screen like shown\
    \ below.\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_127_0.png)\n\n### Figure\
    \ 29 Example of sprite rendered\n"
  mdcn: "\n## 结论\n\n恭喜你走到这一步。我们现在已准备好，利用迄今实现的所有内容，开始为引擎添加游戏功能。我们首先要解决的是让引擎能够渲染纹理，之后将继续渲染文本和动画。\n\
    \n注意：本章所做的所有代码更改所在的分支将以名称 \"assets\" 在仓库中提供。\n\n## 第 7 章\n\n### 精灵渲染器\n\n从现在起，你会看到为引擎添加新功能是多么简单。\n\
    本章将介绍如何渲染纹理。我们将创建一个精灵组件，它接收纹理资产的 asset_id。该组件将附加到实体上，并通过精灵渲染器系统绘制到屏幕上。\n在渲染纹理甚至创建组件之前，我们想先看看如何从源文件加载它们。\n\
    \n### 加载纹理\n\n我们已经定义了资产注册表。那么，让我们添加一个加载纹理的函数。下面的代码片段展示了如何将纹理加载到资产注册表中。请务必相应地更新你的资产注册表。\n\
    \n```cpp\n// ...\nengine/src/assets/registry.h\n// ...\nFUSE_INLINE texture_asset*\
    \ load_texture(const std::string& src,\nconst std::string& name, SDL_Renderer*\
    \ rd) {\ntexture texture;\ntexture.data = IMG_LoadTexture(rd, src.c_str());\n\
    texture.filename = src;\nif (!texture.data) {\nFUSE_ERROR(\"%s\", IMG_GetError());\n\
    return NULL;\n}\nSDL_QueryTexture(texture.data, NULL, NULL, &texture.width,\n\
    &texture.height);\nauto asset = new texture_asset();\nasset->instance = texture;\n\
    asset->name = name;\n_data[type_id<texture_asset>()].push_back(asset);\nreturn\
    \ asset;\n// ...\n}\n```\n\nIMG_LoadTexture() 是 SDL_image 中的内置函数，用于从文件加载像素数据。它支持多种图像格式，包括\
    \ PNG、TIFF、JPG 和 JPEG。该方法将像素数据加载到内存块中，并返回第一个像素数据的地址。\n\n为了了解纹理的大小，我们需要使用 SDL_QueryTexture()\
    \ 函数显式查询它。该函数接受一个纹理指针和两个整数指针，分别用于存储请求的宽度和高度。\n\nload_texture() 函数还将资产名称作为参数。这样可以确保每个资产都有一个可用于查找的名称。两个资产可以有相同的名称，但它们永远不会有相同的\
    \ asset_id。这就是为什么我们不必担心资产因名称已被使用而被覆盖。\n\n### 精灵组件\n\n如果你还记得 ECS 章节，我们说过会按类别创建组件，以减少包含语句的数量，因为这对编译时间有有益影响。我们创建的第一个类别位于\
    \ ecs/components/common.h。\n\n现在让我们在一个名为 graphics.h 的新文件中创建另一个类别。我们将在此文件中创建所有与图形相关的组件。以下是精灵组件的代码片段。\n\
    \n```cpp\nengine/src/ecs/components/graphics.h\n#pragma once\n#include \"assets/asset.h\"\
    \nnamespace fuse::ecs {\nstruct sprite_component {\n    FUSE_INLINE sprite_component(\
    \ const sprite_component& ) = default;\n    FUSE_INLINE sprite_component() = default;\n\
    \    SDL_RendererFlip flip = SDL_FLIP_NONE;\n    asset_id sprite = INVALID_ID;\n\
    };\n}\n```\n\n该组件只有一个 asset_id 和一个名为 \"flip\" 的标志，用于定义精灵的方向。SDL_RendererFlip 是一个标志枚举，可用于在渲染精灵时设置其方向。以下是它可能取的值：\n\
    \n| SDL_FLIP_NONE | 不翻转 |\n|---|---|\n| SDL_FLIP_HORIZONTAL | 水平翻转 |\n| SDL_FLIP_VERTICAL\
    \ | 垂直翻转 |\n\n只有在需要时，才会获取并使用与 asset_id 关联的纹理。这种方法对序列化很有用。我们可以在不知道资产本身内容的情况下，序列化带有资产的组件。它还为多线程铺平了道路。例如，在加载场景时，我们可以将资产和组件的加载委托给多个线程。这将提高引擎加载场景和资产的能力。\n\
    \n在所有组件中包含默认构造函数和拷贝构造函数是最佳实践，因为你希望能够将组件附加到对象上，而无需编写任何代码。\n\n### 精灵渲染器系统\n\n既然我们可以加载纹理，并且精灵组件也已准备就绪，让我们创建一个系统，它将针对所有带有精灵组件的实体，并将它们的精灵渲染到屏幕上。\n\
    \n```cpp\nengine/src/ecs/systems/sprite_renderer_system.h\n\n#pragma once\n#include\
    \ \"ecs/system.h\"\n\nnamespace fuse::ecs {\nstruct sprite_renderer_system : system\
    \ {\n    FUSE_INLINE void update(float) {\n        for (auto& e : view<sprite_component>())\
    \ {\n            // get components\n            auto& tr = e.get_component<transform_component>();\n\
    \            auto& sp = e.get_component<sprite_component>();\n\n            //\
    \ get texture from asset registry\n            auto& sprite = _assets->get<texture_asset>(sp.sprite)->instance;\n\
    \n            // define target viewport\n            SDL_FRect dst{\n        \
    \        tr.translate.x, tr.translate.y,\n                sprite.width * tr.scale.x,\
    \ sprite.height * tr.scale.y\n            };\n\n            // render sprite\n\
    \            SDL_RenderCopyExF(_renderer, sprite.data, NULL, &dst,\n         \
    \       tr.rotation, NULL, sp.flip);\n        }\n    }\n};\n}\n```\n\n我们正在获取带有精灵组件的实体列表，并遍历该列表来渲染每个实体的精灵。我们首先获取变换组件，因为我们想知道精灵将在屏幕上的何处以及如何渲染。然后我们获取精灵组件，它提供了要渲染的精灵的\
    \ asset_id。接着我们从资产注册表中检索纹理资产。\n\n要渲染精灵，我们使用函数 SDL_RenderCopyExF()。该函数将目标渲染器的指针作为其第一个参数。渲染器与窗口一起创建，并作为参数传递给场景的构造函数，同时也传递给\
    \ system::prepare() 函数。第二个参数是纹理缓冲区的指针。第三个参数是指向 SDL_FRect 的 const 指针，它是纹理的源视口。它定义了纹理的哪一部分应被复制和渲染。我们传递\
    \ NULL，因为我们想渲染整个精灵，而不仅仅是特定部分。\n\n下一个参数（也与前一个参数相关）是目标视口。它定义了精灵将在屏幕上渲染的框或视口。\n\n\
    第五个参数是精灵在屏幕上的角度或旋转。我们还可以通过传递指向 SDL_Point 的指针来更改当前正在渲染的对象的中心，SDL_Point 只是 2D 空间中的一个点，指定精灵应围绕其旋转的点。我们传递\
    \ NULL，因为我们想保持 SDL 的默认原点，即精灵的左上角。\n\n**注意：** 请记住在 `system.h` 中包含你的组件类别，以便每个系统都可以访问所有组件来执行其任务。\n\
    \n就这样，精灵渲染器系统已添加到我们的引擎中。我们所要做的就是进入场景，注册系统，创建一个带有精灵组件的实体，然后运行整个项目以查看结果。\n\n以下是显示需要更新场景的哪部分以测试我们刚刚创建的精灵渲染器系统的代码。\n\
    \n```cpp\nengine/src/ecs/scene.h\n\n#pragma once\n#include \"ecs/systems/sprite_renderer_system.h\"\
    \nnamespace fuse::ecs {\nstruct scene {\n    FUSE_INLINE scene(SDL_Renderer* rd):\
    \ _renderer(rd) {\n        register_systems<ecs::sprite_renderer_system>();\n\
    \    }\n    // ...\n    FUSE_INLINE void start() {\n        // load texture asset\n\
    \        auto sprite = assets::load_texture(\"assets/test.png\",\n           \
    \ \"test\", _renderer);\n        // create entity\n        ecs::entity entity\
    \ = add_entity(\"entity\");\n        // add sprite component\n        entity.add_component<ecs::sprite_component>().sprite\
    \ = sprite->id;\n        // start systems\n        for (auto& sys : _systems)\
    \ { sys->start(); }\n    }\n    // ...\n};\n}\n```\n\n我们首先在场景的构造函数中注册系统。然后我们继续从文件加载纹理，并在\
    \ start() 函数中添加一个带有精灵组件的实体。\n\n将任意名为 \"test.png\" 的纹理文件放入你的 \"resource\" 文件夹并编译项目。你将在屏幕上看到如下所示的渲染精灵。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_127_0.png)\n\n### 图 29 精灵渲染示例\n"
