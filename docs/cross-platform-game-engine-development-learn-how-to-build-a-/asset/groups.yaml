    \ that arise from XML's broad application spectrum. However, YAML's main competitor\
    \ is JSON, rather than XML.\n\n### How does YAML work?\n\nYAML turns data from\
    \ a program's internal format into a text file. Because this is possible even\
    \ for complex data types like two- or multidimensional arrays, the elements are\
    \ serialized and sent one after the other.\n\nIf we were to serialize the following\
    \ data structure using YAML, the result will look like shown below.\n\n```\nstruct\
    \ transform_component {\n    vec2f translate = vec2f( 0.0f );\n    vec2f scale\
    \ = vec2f( 1.0f );\n    float rotation = 0.0f ;\n};\n```\n\nFigure 46 Data Structure\n\
    \n```\ntransform_component:\n    translate: [0, 0]\n    scale: [1, 1]\n    rotation:\
    \ 0\n```\n\nFigure 47 YAML File\n\nThere are libraries available for almost all\
    \ major programming languages like C/C++, Java, C#, Dart, Js, Rust, etc. that\
    \ allow serialization with YAML.\n\n- YAML Frameworks and Tools for C/C++:\n \
    \ - libfyaml \"C\" YAML 1.2 processor (YTS) [7]\n  - libyaml \"C\" Fast YAML 1.1\
    \ (YTS) [8]\n  - libcyaml YAML de/serialization of C data (using libyaml) [6]\n\
    \  - yaml-cpp C++ YAML 1.2 implementation [5]\n\nAbove is a list of some well-known\
    \ libraries for C++ serialization using YAML. \"yaml-cpp\" is going to be our\
