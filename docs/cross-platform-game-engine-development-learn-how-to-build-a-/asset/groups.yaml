    \ const uint32_t get_unique_typeid() {\n    static uint32_t type = 1u;\n    return\
    \ type++;\n}\n\ntemplate <typename T>\nFUSE_INLINE const uint32_t type_id() {\n\
    \    static const uint32_t type = get_unique_typeid();\n    return type;\n}\n\
    }\n```\n\n在上面的 **typeid.h** 中，我们有函数 **get_unique_typeid()**，它返回一个无符号整数。其定义位于 **typeid.cpp**\
    \ 文件中。该函数每次被调用时都会简单地增加一个静态变量。你还会在头文件中找到一个名为 **type_id()** 的模板函数。\n\n模板函数不是一种类型、函数或任何其他实体。仅包含模板定义的源文件不会产生任何代码。在任何代码出现之前，必须先实例化模板：必须确定模板参数，以便编译器可以构建实际函数\
    \ [4]。\n\n将会发生的是，编译器将为调用时使用的每个模板类型生成此函数的定义。由于函数 **get_unique_typeid()** 返回的值存储在一个静态常量整数中，因此每次使用相同的模板类型调用该函数时，它都将保持相同。\n\
    \n可以按如下方式测试它：\n\n```cpp\nauto id1 = type_id<int>(); // id1 = 1\nauto id2 = type_id<int>();\
    \ // id2 = 1\nauto id3 = type_id<float>(); // id3 = 2\n```\n\n就这样，我们有了在程序中为任何类型附加唯一\
    \ ID 的机制。我们还将使用此类型系统作为实体-组件系统（ECS）的基础。稍后将详细介绍。\n\n## 事件回调\n\n事件回调只是在触发特定事件时会被调用的一个函数。按如下所示创建一个名为\
    \ \"event.h\" 的新头文件。\n\n```cpp\n#pragma once\n#include \"typeid.h\"\n\nnamespace\
    \ fuse {\nusing event_id = uint32_t;\n\nstruct event_instance {\n    FUSE_INLINE\
    \ virtual ~event_instance() = default;\n};\n\n// callback lambda\ntemplate <typename\
    \ T>\nusing callback_function = std::function<bool(const T&)>;\n\nstruct callback_instance\
    \ {\n    FUSE_INLINE virtual ~callback_instance() = default;\n    virtual bool\
    \ run(event_instance*) = 0;\n};\n\ntemplate <typename T>\nstruct event_callback\
    \ : callback_instance {\n    FUSE_INLINE event_callback(callback_function<T>&&\
    \ clbk):\n    callback(std::move(clbk)) {}\n\n    FUSE_INLINE bool run(event_instance*\
    \ e) {\n        auto data = static_cast<const T&>(*e);\n        return callback(data);\n\
    \    }\n\nprivate:\n    callback_function<T> callback;\n};\n\nusing callback_list\
    \ = std::vector<std::shared_ptr<callback_instance>>;\n}\n```\n\n我们首先定义一个名为 **event_instance**\
    \ 的抽象结构，它是所有事件的基础结构。每次创建新类型的事件时，我们都会确保它从该结构继承。\n\n如前所述，事件系统将识别事件并为该事件调用适当的回调操作或函数。由于我们要为其实现回调函数的事件类型不是唯一的，我们将使用\
    \ C++ 的模板特性来泛化这一概念。**callback_function** 是一个函数类型定义，它接受一个指向 **event_instance**\
    \ 的指针并返回一个布尔值，以告知事件系统是应继续管理该事件还是停止。\n\n然后我们使用刚刚创建的 **callback_function** 类型来定义最终的\
    \ **event_callback** 结构，该结构也必须是模板化的，以确保其回调函数成员变量也具有特定类型。函数 \"execute\" 是 **event_callback**\
    \ 结构必须实现的虚函数，以确保回调函数可以由分发器执行。\n\n**callback_list** 只是回调数组的一个 typedef。它将使我们的代码更易读。\n\
    \n## 事件分发器\n\n我们已经有了识别事件的系统，也有了事件回调的结构。现在让我们组装一个分发器来管理事件和回调。\n\n在项目中继续创建一个名为 **dispatcher.h**\
    \ 的新头文件。\n\n```cpp\n#pragma once\n#include \"event.h\"\n\nnamespace fuse {\nstruct\
    \ dispatcher {\n    // posts an event with the type T\n    template <typename\
    \ T, typename... Args>\n    FUSE_INLINE void post(Args&&... args) {\n        FUSE_STATIC_ASSERT(std::is_base_of<event_instance,\n\
    \            T>::value);\n        _events[type_id<T>()] = new T(std::forward<Args>(args)...);\n\
    \    }\n\n    // registers a callback for the event of type T\n    template <typename\
    \ T>\n    FUSE_INLINE void add_callback(callback_function<T>&& cbk) {\n      \
    \  FUSE_STATIC_ASSERT(std::is_base_of<event_instance,\n            T>::value);\n\
    \        auto entry = std::make_shared<event_callback<T>>(cbk);\n        _callbacks[type_id<T>()].push_back(entry);\n\
    \    }\n\n    // handles all event and keep memory clean\n    FUSE_INLINE void\
    \ dispatch() {\n        if (!_events.size()) { return; }\n        for (auto& [code,\
    \ entry] : _events) {\n            for (auto& cbk : _callbacks[code]) {\n    \
    \            if (cbk->run(entry)) { break; }\n            }\n        }\n     \
    \   _events.clear();\n    }\n\nprivate:\n    std::unordered_map<event_id, event_instance*>\
    \ _events;\n    std::unordered_map<event_id, callback_list> _callbacks;\n};\n\
    };\n```\n\n事件分发器只是一个具有三个主要功能的结构。\n\n### 发布事件\n\n第一个功能由模板函数 post(...) 定义。它接受一个\n"
