    # # Tile Map Renderer


    A tile-based video game is a type of game or video game where the playing area
    consists of small square (or, much less often, rectangular, parallelogram, or
    hexagonal) graphic images referred to as tiles laid out in a grid. That the screen
    is made of such tiles is a technical distinction and may not be obvious to people
    playing the game. The complete set of tiles available for use in a playing area
    is called a tile set. Tile-based games usually simulate a top-down, side view,
    or 2.5D view of the playing area, and are almost always two-dimensional.


    Much video game hardware from the late 1970s through the mid-1990s had native
    support for displaying tiled screens with little interaction from the CPU. [24]


    You can already have an idea of how we are going to implement this feature in
    our engine. If you remember in section (0), we spoke about the fact that each
    tile would be an entity with a tile component. The tile map itself is also going
    to be an entity with a tile map component. So, let’s create both components.'
  - "[PAGE 147]\n\n# TileMap Component\n\nengine/src/ecs/components/graphics.h\n\n\
    ```\nstruct tilemap_component {\n    FUSE_INLINE tilemap_component(const tilemap_component&)\
    \ = default;\n    FUSE_INLINE tilemap_component() = default;\n    asset_id tilemap\
    \ = INVALID_ID;\n};\n```\n\nThe next component we will add to the **graphics.h**\
    \ header file is the **tile map component**. This component, just as the **sprite_component**\
    \ or even the **animation component**, simply stores the **asset_id** of a tile\
    \ map asset. There isn't much we can say about this component."
  - "[PAGE 148]\n\n# # Tile Component\n\nThe tile component needs a little bit more\
    \ data compared to the tile map component. First, a tile needs to know which tile\
    \ map it belongs to, Secondly, it is important for that tile to also know from\
    \ which tile set its texture is coming from; it also has to know which part of\
    \ that tile set to render and, finally, where it will be rendered on the screen.\
    \ Since the tile set is simply a grided texture, we can simply store the row and\
    \ the column of the tile. The following image gives a visual idea of the concept.\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_148_0.png)\n\nAs you can see, the counting\
    \ of rows and columns starts at zero and ends at n-1. Below is the code for the\
    \ tile component. Add the code to your graphics.h header file right after the\
    \ tile map component.\nengine/src/ecs/components/graphics.h\n\n```\nstruct tile_component\
    \ {\n    FUSE_INLINE tile_component( const tile_component& ) = default;\n    FUSE_INLINE\
    \ tile_component() = default;\n    SDL_RendererFlip flip = SDL_FLIP_NONE;\n  \
