    ```

    void di_dispatch_events() {

    static SDL_Event event;

    while (SDL_PollEvent(&event)) {

    switch (event.type) {

    case SDL_QUIT: di.sp.post<quit_event>(); break;

    case SDL_MOUSEBUTTONDOWN:

    mouse.buttons.set(event.button.button);

    di.sp.post<mousedown_event>(event.button.button); break;

    case SDL_MOUSEBUTTONUP:

    mouse.buttons.reset(event.button.button);

    di.sp.post<mouseup_event>(event.button.button); break;

    case SDL_MOUSEWHEEL:

    mouse.wheel = vec2f(event.button.x, event.button.y);

    di.sp.post<mousewheel_event>(); break;

    case SDL_MOUSEMOTION:

    mouse.offset = vec2f(event.button.x, event.button.y);

    di.sp.post<mousemotion_event>(); break;

    case SDL_KEYDOWN:

    keyboard = SDL_GetKeyboardState(NULL);

    di.sp.post<keydown_event>(event.key.keysym.scancode);

    case SDL_KEYUP:

    di.sp.post<keyup_event>(event.key.keysym.scancode);

    keyboard = SDL_GetKeyboardState(NULL); break;

    }

    di.sp.di_spatch();

    }

    }

