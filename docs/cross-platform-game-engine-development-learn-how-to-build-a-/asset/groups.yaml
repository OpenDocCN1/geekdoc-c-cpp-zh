    入门\n\n## 入门\n\n在本章中，我们将探讨如何在多个平台上设置和构建我们的项目，使用我们之前讨论过的所有工具和扩展。我知道您想马上进入有趣的部分，但我们只需做一次，之后就再也不必担心了。\n\
    \n## 项目文件夹树\n\n```\nProject\n├── .vscode\n│   ├── c_cpp_properties.json\n│   ├──\
