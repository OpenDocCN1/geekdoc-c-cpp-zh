  - '[PAGE 216]


    # Serialization


    The previous chapter covered creating a small game with some of the features we
    have added to our engine so far. We need serialization in order to save the state
    of our game in such a manner that we can reload when necessary. The game we created
    is part of the engine''s code, however, we want to separate the game''s definition
    from the engine''s code by storing all entity and object information in external
    files using a serializer.'
  - '[PAGE 217]


    # Definition


    Serialization is the process of converting a data object into a formatted binary
    or text file that can be easily reloaded and used by a program. [27]


    ![](img/2763810ed0a1572c2bec59ee52dd75be_217_0.png)


    The reverse process where the binary or text file is used to recreate the actual
    object in memory is called “Deserialization”.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_217_1.png)


    We''ll serialize the data from our game in a human-readable format. Binary serialization
    is significantly faster and generates small-size files compared to readable serialization.
    It is just the process of saving a block of memory (binary data) in a file. However,
    because our scene has a complex data structure that cannot be directly saved in
    binary form, we will create a custom serializer to do the job for us.'
