    \            SDL_RenderCopyExF(_renderer, texture, NULL, &dst, tr.rotation, NULL,\
    \ tx.flip);\n            // destroy texture\n            SDL_DestroyTexture(texture);\n\
    \        }\n    }\n};\n}\n```\n\n```\n#pragma once\n#include \"ecs/systems/text_renderer_system.h\"\
