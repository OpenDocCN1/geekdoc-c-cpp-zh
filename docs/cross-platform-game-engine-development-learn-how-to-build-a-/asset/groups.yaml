  md: "\nmemory on the Heap to store all types of objects. This means that our data\
    \ will not be stored consistently in memory. When you ask the computer to find\
    \ something in memory at a specific address, it will not only copy what you ask\
    \ for, but it will also copy other data around what you asked for and store it\
    \ all in Cache memory. So, the next time you ask for something else, the computer\
    \ will just grab it from cache rather than fetch it from RAM again. The fact that\
    \ data is saved inconsistently in memory drastically reduces CPU-Cache usage,\
    \ resulting in a performance hit.\n\n## Component-Oriented Design\n\nThe following\
    \ picture shows how a component-oriented design is made. As you can see, each\
    \ game object will have a list of components that define its behaviour. All components\
    \ like Transform, Sprite, etc. will inherit an abstract class called Component.\n\
    \nThis technique will not solve the problem of memory and CPU-cache usage of the\
    \ OO design, but it takes away the virtual lookup table for virtual functions\
    \ and offers the ability to have a boss that can also be a player because being\
    \ a player or a boss is just a matter of components added or removed. This will\
    \ perform better than OO.\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_89_0.png)\n\
    \n## Data Oriented Design\n\nThings start to sound right with the data-oriented\
    \ design because it offers a contiguous memory layout, no virtual lookup table,\
    \ and better CPU-cache usage. This design is also known as Entity-Component (EC)\
    \ design. The next picture describes the most vital component of the EC design.\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_90_0.png)\n\n### Figure 24 Data Oriented\
    \ Design\n\nEach game object is represented by a number. That number is used to\
    \ know which component belongs to that entity. You can see that all components\
    \ of the same type for all entities are stored together in a contiguous manner.\
    \ This will have a positive impact on the CPU cache. Many game engines use this\
    \ design because it offers reliable performance and maintaining it is also not\
    \ difficult.\n\n## ECS Architecture\n\nEven though the ECS design is well-known\
    \ for its high performance and ease of use in terms of maintenance, memory, and\
    \ CPU cache usage, it lacks a specific implementation approach. I usually divide\
    \ the approach of implementing ECS into two categories: pure ECS and hybrid or\
    \ mixed ECS.\n\nIn a pure ECS, the component has no logic. Only the system holds\
    \ logic to update the components. The hybrid ECS allows components to have logic\
    \ to update themselves.\n\nWe are going to build a pure ECS in this book.\n\n\
    ![](img/2763810ed0a1572c2bec59ee52dd75be_91_0.png)\n\nWhat makes the ECS design\
    \ different from the data-oriented design is the fact that the entity, the component,\
    \ and the system are all separated. The entity is just a unique identifier (number)\
    \ that stands for a specific game object in the scene. It is often a 32-bit or\
    \ 64-bit unsigned integer. The component is simple structure that store all data\
    \ require for the logic. The system targets all entities with a specific set of\
    \ components (signature) and update their components.\n\n### Advantage ECS:\n\n\
    - ECS is a user-friendly approach to multi-threading because each system can be\
    \ assigned to a specific thread.\n- shorter and less complicated code.\n- Ease\
    \ integration of scripting languages.\n- Makes unit testing and mocking ease.\n\
    - New features can be easily implemented.\n\n### Disadvantages ECS\n\n- No standard\
    \ implementation method defined.\n- Difficult to implement correctly and easily\
    \ abused\n- Not well known by most game developers.\n\nYou can learn more about\
    \ ECS here [16] and here [9]. We now have enough theoretical knowledge. So, let's\
    \ implement our own custom ECS.\n\n## Implementation\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_93_0.png)\n\
    \nAbove is a Diagram that shows how your engine folder tree should look right\
