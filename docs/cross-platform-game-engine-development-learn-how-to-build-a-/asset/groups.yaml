    \n## 结论\n\n我希望你能想象 ECS 有多么强大。它确实使通过定义组件和系统来更新它们，就能轻松地为我们的引擎添加新功能。\n\n从现在起，事情将变得容易得多，因为我们所要做的就是创建系统的组件并将它们添加到场景中进行测试。但在进入渲染器和物理相关内容之前，我们将简要讨论资产管理。我们希望能够正确加载和存储我们的资产，如纹理、动画、字体等，以便在需要时可以轻松访问它们。\n\
    \n如果你在本章的代码中遇到问题，可以简单地从 GitHub 仓库克隆分支来找出你的代码哪里出错了。该分支名为 \"ecs\"。\n\n注意：如果你克隆仓库，请记住在\
    \ Linux 上始终使 build-linux.sh 可执行。\n\n## 第 6 章\n资产管理\n\n## 资产管理\n\n资产管理器负责监督游戏（引擎）中资产的加载、存储、转换和销毁。\n\
    \n关于资产管理器应如何实现，没有特定的设计，但有一些基本概念我们可以应用以实现我们的目标。\n\n## 资产定义\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_109_0.png)\n\
    \n如上所示，通过创建高亮显示的红色文件夹和文件来更新你的项目文件夹树。我们现在将逐步创建每种资产类型，从基础资产开始，它将包含所有种类资产的一些通用信息。\n\
    \n```\n#pragma once\n\nnamespace fuse {\nusing asset_typeid = uint32_t;\nusing\
    \ asset_id = uuid64;\n\nstruct asset {\nFUSE_NONIE virtual ~asset() = default;\n\
    asset_id id = generate_uuid();\nstd::string name;\n};\n}\n```\n\n每个资产都应该有一个唯一的通用标识符（UUID）和一个名称，因为该信息将用于在注册表中搜索资产。我们还希望每种资产类型都有一个特定的类型标识符，该标识符将用于将每个资产保存在注册表的特定内存块中。这就是为什么我们创建了\
    \ typedef asset_typeid，它只是一个 32 位整数，类似于我们为事件和组件所做的。\n\n### 纹理资产\n\n纹理有能力通过赋予游戏悦目的外观并使其易于理解来增强游戏。我可以肯定你知道那句古老的格言，“一图胜千言”。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_110_0.png)\n\n以下是纹理资产的定义。\n\n# engine/src/assets/texture.h\n\
    \n```\n#pragma once\n#include \"asset.h\"\nnamespace fuse {\nstruct texture {\n\
    SDL_Texture* data = NULL;\nstd::string filename;\nint i = 0;\nint width = 0;\n\
    };\nstruct texture_asset : asset {\nFUSE_INLINE texture_asset() = default;\nFUSE_INLINE\
    \ ~texture_asset() {\nSDL_DestroyTexture(instance.data);\n}\ntexture instance;\n\
    };\n}\n```\n\n在创建纹理资产之前，我们需要定义什么是纹理。这就是为什么我们首先创建结构化纹理，它存储关于纹理的所有信息，如大小、文件名和像素数据。然后我们使用该结构来创建\
    \ texture_asset。SDL 有一个名为 SDL_Texture 的像素数据类型。它是一个包含高效的、特定于驱动程序的像素数据表示的结构。要创建纹理，我们只需定义一个像素数组。我们将稍后了解如何从图像文件加载纹理。同样重要的是，确保通过调用\
    \ SDL_DestroyTexture() 销毁纹理。这就是为什么当纹理资产的析构函数被调用时，纹理的数据将被销毁。\n\n### 字体资产\n\n虽然纹理在某些方面足以创建一个功能完整的游戏，但呈现自定义文本的能力也很重要，因为它能让用户了解游戏中发生的事情。呈现当前分数、显示玩家姓名和设计\
    \ GUI 都是制作一款像样游戏的重要方面。\n\n![](img/2763810ed0a1572c2bec59ee52dd75be_111_0.png)\n\
    \n图 26 文本渲染\n\n以下是我们字体资产的代码。\n\n```\nengine/src/assets/font.h\n#pragma once\n\
    #include \"asset.h\"\n\nnamespace fuse {\nstruct font {\n    TTF_Font* data =\
    \ NULL;\n    std::string filename;\n    int size = 20;\n};\n\nstruct font_asset\
    \ : asset {\n    FUSE_NON_NE font_asset() = default;\n    FUSE_NON_NE ~font_asset()\
    \ {\n        TTF_CloseFont(instance.data);\n    }\n\n    font instance;\n};\n\
    }\n```\n\nSDL_ttf 有一种名为 TTF_Font 的特定字体类型。TTF 代表 TrueType 字体。它是一种用于在屏幕和打印机上显示文本的字体标准。它内置于\
    \ Windows 和 Mac OS 操作系统中，并且也可以通过 FreeType [25] 在类 Unix 操作系统上使用。\n\n注意：加载字体后，在\
    \ SDL 中无法调整其大小。因此，更改字体大小的唯一方法是使用新的字体大小重新加载同一字体文件。稍后我们将讨论字体加载。\n\n### 音频资产\n\n\
    没有音频的游戏简直索然无味，也不好玩。我们也将为音频资产保持相同的模式。SDL mixer 库提供两种类型的音频数据。Mix_Music 和 Mix_Chunk。区别在于你一次只能播放一段音乐，但可以播放计算机能处理的尽可能多的音频片段。每个新音频片段将被分配到一个专用通道，而所有音乐只有一个通道。这就是我们使用\
    \ Mix_Chunk 而不是 Mix_Music 的原因。如果你愿意，可以随时在线进行更多研究。\n\nengine/src/assets/audio.h\n\
    \n```\n#pragma once\n#include \"asset.h\"\n\nnamespace fuse {\nstruct audio_clip\
    \ {\n    Mix_Chunk* data = NULL;\n    std::string filename;\n};\n\nstruct audio_asset\
    \ : asset {\n    FUSE_INLINE audio_asset() = default;\n\n    FUSE_INLINE ~audio_asset()\
    \ {\n        Mix_FreeChunk(instance.data);\n    }\n\n    audio_clip instance;\n\
    };\n}\n```\n\n### 动画资产\n\n2D 动画通过使用精灵表或多个精灵来实现。其思路是仅在恒定的时间段内渲染每个精灵，这就是动画的速度。\n\
    \n以下是显示如何定义动画资产的代码片段。数组 \"frames\" 将存储动画中每个纹理（帧）资产的 asset_id。\n\n可以直接存储每个纹理对象而不是\
    \ asset_id。对我们来说，这样做更好，因为我们将在游戏引擎中实现序列化和脚本，并且我们希望能够通过资产的 id 和名称轻松地寻址资产。\n\nengine/src/assets/animation.h\n\
    \n"
