  - '[PAGE 220]


    # Installing yaml-cpp (Windows)


    This section will go through how to install yaml-cpp on the Windows platform.
    We''ll clone the repository and build the library using CMake.


    # Cloning yaml-cpp


    yaml-cpp can be cloned from GitHub via the homepage or a command line. The build
    files are found here: https://github.com/jbeder/yaml-cpp.


    To clone the repository from GitHub, use the following command: This will download
    all of the files required to compile the library. The keyword "recursive" is not
    required for the command to function, but it only ensures that if yaml-cpp has
    submodules, they are also cloned.


    ```

    git clone --recursive https://github.com/jbeder/yaml-cpp.git

    ```


    > Note : You must have "git" installed on your machine to execute the command
    above. If you don''t, you can use the following instructions.


    Download the source code as shown in the following picture.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_220_0.png)


    Figure 48 Downloading yaml-cpp


    This will download the source code as a ZIP file, which must be decompressed using
    WinRAR, ZIP, or any other package manager tool. Now that we have the source code
    downloaded, let''s compile it.


    # Building yaml-cpp


    As mentioned earlier we are going to use CMake to compile yaml-cpp. Below is a
    set of commands that can be used to build the library.'
  - '[PAGE 221]


    # Step 1 Navigate to yaml-cpp directory


    Use the command below to navigate into the directory of yaml-cpp.


    ```

    cd <path to yaml-cpp directory>

    ```


    # Step 2 Build with CMake


    ```

    rem create output directory

    mkdir build

    rem generate make file

    cmake -O . -B ./build -DBUI LD_SHARED_LI BS=ON

    rem compile library

    cmake --build ./build

    ```


    These commands will create a folder to store the build files, use CMake to generate
    and build the source code of yaml-cpp. Since we want to build yaml-cpp as a shared
    library, we use "BUILD_SHARED_LIBS" to instruct CMake about that.


    After the compilation is done, you will find the library files generated in the
    directory visualized in the folder tree below.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_221_0.png)


    Similar to all SDL libraries, yaml-cpp also has include header files, a ".dll"
    and a ".lib" file that are the only files we need to link yaml-cpp to our project.


    # Linking yaml-cpp


    We are going to use the same technique we used for SDL to link yaml-cpp.


    # Step 1 Copy Header files


    Go ahead and copy the header files folder found under yaml-cpp/include into Project/windows/includes.


    # Step 2 Copy Library Files


    Copy the “yaml-cppd.lib” file into Project/windows/lib and copy the second library
    file “yaml-cppd.dll” into Project/windows/bin.'
