    \ root CMakeLists.txt. Let's do the same for the engine CMakeLists.txt file.\n\
    \n- Project/engine/CMakeLists.txt\n\n```cmake\n# engine project (shared lib)\n\
    project(engine VERSION 0.0.1)\n\n# get all cpp-files\nfile(GLOB_RECURSE SRC_FILES\
    \ src/*.cpp CMAKE_CONFIGURE_DEPENDS)\nadd_library(${PROJECT_NAME} ${SRC_FILES})\n\
    \n# define symbols\nadd_definitions(-DFUSE_EXPORT)\nadd_definitions(-D_DEBUG)\n\
    \n# windows platform\nif (WIN32)\n\ttarget_include_directories(${PROJECT_NAME}\
    \ PUBLIC ${CMAKE_SOURCE_DIR}/windows/includes)\n\ttarget_link_directories(${PROJECT_NAME}\
    \ PUBLIC ${CMAKE_SOURCE_DIR}/windows/libs)\nendif (WIN32)\n\n# linux platform\n\
    if (UNIX)\n\nendif (UNIX)\n\n# precompile headers\ntarget_precompile_headers(${PROJECT_NAME}\
    \ PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src/pch.h)\n\n# add include directory\ntarget_include_directories(${PROJECT_NAME}\
    \ PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n```\n\nThe engine’s CMakeLists.txt\
    \ file, as described above, can be found in the folder \"Project/engine\". As\
    \ you can see, we don’t need to define the CMake version as well as the C++ standard\
    \ version here because they are already defined in the root CMakeLists.txt file.\
    \ We simply start by creating a project called “engine” with the version number\
    \ “0.0.1”. The specification of the version number is optional.\n\nWe then want\
    \ to recursively search for all .cpp files in the source folder of the engine\
    \ project (engine/src) because they will all be compiled to generate the engine\
    \ library.\n\nCMake allows us to define symbols that can affect how we would want\
    \ the code to be compiled. We’ve defined _DEBUG and FUSE_EXPORT in this scenario.\
    \ The _DEBUG macro instructs the compiler to generate data for the debugging.\
    \ FUSE_EXPORT will be used to instruct the compiler about which modules of the\
    \ engine to export into the library (more about later). We also want to make sure\
    \ CMake knows where the external libraries that the engine will be using are on\
    \ Windows. which is why we are using the if(WIN32) statements to check if the\
    \ current platform used is Windows. You will get later why we don’t have to do\
    \ that for Linux.\n\nA precompiled header (PCH) is a header file (C/C++) that\
    \ has been compiled into an intermediate form that the compiler can parse more\
    \ quickly. Precompiled headers can significantly reduce compilation time, especially\
    \ for large header files, header files that include many other header files, or\
    \ header files that are included in many translation units. CMake gives us the\
    \ ability to add precompile headers to our project via the function: target_precompile_headers().\n\
    \nThere is a file called “pch.h” in the folder “engine” which is the precompiled\
    \ header for the engine library. It will be used to include all important C++\
    \ standard libraries as well as other custom code that will be accessible globally.\
    \ This will significantly reduce the time needed to compile the engine library.\n\
    \nNote: The only requirement for using precompile headers is that we must include\
    \ the pch.h header file in all .cpp-files of the engine.\n\nWe call the function\
    \ “target_include_directories” to attach all include directories, so that the\
    \ compiler will know which header files to include during the compilation process.\n\
    \nThe last CMakeLists.txt file we will talk about is the one found in “game”.\n\
    \n- Project/game/CMakeLists.txt\n\n```cmake\n# runtime project (.exe)\nproject(game\
    \ VERSION 0.0.1)\n\n# get all cpp-files\nfile(GLOB_RECURSE SRC_FILES src/*.cpp\
    \ CMAKE_CONFIGURE_DEPENDS)\nadd_executable(${PROJECT_NAME} ${SRC_FILES})\n\n#\
    \ link libraries\ntarget_link_libraries(${PROJECT_NAME} engine)\n\n# includes\
    \ directories\ninclude_directories(${CMAKE_SOURCE_DIR}/engine/src)\ntarget_include_directories(${PROJECT_NAME}\
    \ PUBLIC ${CMAKE_CURRENT_SOURCE_DIR}/src)\n```\n\nThe code above shows how the\
    \ game-executable's **CMakeLists.txt** file is defined. Important to note here\
    \ is that we are linking the engine as a library, and we also include its source\
    \ directory as an include directory so that the game project can also access the\
    \ code from the engine library.\n\nBefore we get to compile our code for the first\
    \ time, we must install some libraries that we will use to add some features to\
    \ our game engine.\n"
