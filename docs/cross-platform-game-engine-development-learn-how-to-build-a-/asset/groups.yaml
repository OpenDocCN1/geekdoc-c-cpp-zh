    \n就这样，我们完成了，现在可以开始有趣的部分了。\n\n## 核心功能\n\n有些功能对几乎所有 C++ 项目开发都很重要，无论是否为游戏引擎。例如消息日志、断言、平台检测等。在转向图形相关内容之前，我们将快速将这些功能添加到项目中。\n\
    \n## 消息日志\n\n消息日志是软件开发中一个至关重要的元素。此功能将通过向我们反馈代码失败情况来增强开发体验。\n\n将以下代码添加到预编译头文件 pch.h\
    \ 的底部。\n\n```\n// ...\n\n#if defined(_DEBUG)\n#define FUSE_LOG(level, message,\
    \ ...) \\\n    fprintf(stderr, \"[%%] \", level); \\\n    fprintf(stderr, message,\
    \ ##__VA_ARGS__); \\\n    fprintf(stderr, \"\\n\");\n\n#define FUSE_WARN(message,\
    \ ...) FUSE_LOG(\"warning\", message, ##__VA_ARGS__)\n#define FUSE_ERROR(message,\
    \ ...) FUSE_LOG(\"error\", message, ##__VA_ARGS__)\n#define FUSE_INFO(message,\
    \ ...) FUSE_LOG(\"info\", message, ##__VA_ARGS__)\n#else\n#define FUSE_INFO\n\
    #define FUSE_ERROR\n#define FUSE_WARN\n#endif\n```\n\n如你所见，如果在定义 _DEBUG 符号的情况下编译代码，宏\
    \ FUSE_INFO、FUSE_WARN、FUSE_ERROR 也会被编译。但如果未定义 _DEBUG 符号，它们不会被编译。这是我们想要的，因为在完成项目开发和测试后，我们希望它只包含用户所需的内容。我们在\
    \ fprintf() 周围定义了一个宏。\n\n以下是用于快速测试消息日志的代码片段。\n\n```\nengine/src/core/application.cpp\n\
    #include \"pch.h\"\n#include \"application.h\"\n\nnamespace fuse {\nFUSE_API void\
    \ run_application(const app_config& config) {\n    FUSE_INFO(\"this is an info!\"\
    );\n    FUSE_ERROR(\"this is an error!\");\n    FUSE_WARN(\"this is a warning!\"\
    );\n}\n}\n```\n\n```\n[info] this is an info!\n[error] this is an error!\n[warning]\
    \ this is a warning!\n```\n\n## 静态和运行时断言\n\n断言可用于定位程序崩溃的代码行，甚至在给定条件不满足时阻止编译开始。静态断言会在代码编译前确认条件，而运行时断言会在运行时触发事件以防止应用程序继续运行。将以下代码行添加到\
    \ pch.h 文件的底部。\n\n```\nengine/src/pch.h\n// ...\n// runtime assertion\n#define\
    \ FUSE_ASSERT assert\n// static assertion\n#if defined(__clang__) || defined(__gcc__)\n\
    #define FUSE_STATIC_ASSERT _Static_assert\n#else\n#define FUSE_STATIC_ASSERT static_assert\n\
    #endif\n```\n\n由于断言在不同编译器中有所不同，我们使用 if 语句来确保为当前使用的编译器进行正确的断言调用。以下是测试此功能的代码片段：\n\
    \n```\nengine/src/core/application.cpp\n#include \"pch.h\"\n#include \"application.h\"\
    \n\nnamespace fuse {\n    FUSE_API void run_application(const app_config& config)\
    \ {\n        FUSE_ASSERT(false && \"runtime assertion!\");\n        FUSE_STATIC_ASSERT(false\
    \ && \"static assertion!\");\n    }\n}\n```\n\n你会发现，除非将静态断言的条件设置为 true，否则代码无法编译。当代码最终编译通过后，运行时断言在程序执行时会触发事件并显示以下窗口。\n\
    \n![](img/2763810ed0a1572c2bec59ee52dd75be_57_0.png)\n\n如果点击 **重试**，触发断言的代码行将在代码编辑器中被高亮显示，你将能够了解崩溃的原因。\n\
    \n## 函数内联\n\n函数内联是众多引人入胜的 C++ 特性之一，在程序性能方面非常实用。在 C++ 中，内联函数是一种优化特性，可减少程序的执行时间。在编译过程中，每当遇到带有\
