    # Setting up SDL2 Libraries


    Simple Direct Media Layer (SDL) is a cross-platform development library designed
    to supply low level access to audio, keyboard, mouse, joystick, and graphics hardware
    via OpenGL and Direct3D. It is used by video playback software, emulators, and
    popular games including Valve''s award-winning catalogue and many Humble Bundle
    games.


    SDL officially supports Windows, Mac OS X, Linux, iOS, and Android. Support for
    other platforms may be found in the source code. SDL is written in C, works natively
    with C++, and there are bindings available for several other languages, including
    C# and Python. SDL 2.0 is distributed under the zlib license. This license allows
    you to use SDL freely in any software. [18]


    # Installing SDL on Windows


    SDL installation on Windows is as simple as copying and pasting files into the
    proper locations. However, we must exercise caution because this is often the
    basis of our project''s failure to compile successfully.


    +   Step 1: Download


    https://www.libsdl.org/download-2.0.php is the link to the official download page
    of SDL. We could download SDL''s source code and compile it ourselves, but we
    don''t want to make things any more complicated. We''ll just download and link
    the built binaries to our project.


    ![](img/2763810ed0a1572c2bec59ee52dd75be_40_0.png)


    Based on the compiler used, there are two versions of the development libraries
    available for Windows. There is a Visual C++ Compiler version and a MinGW-Compiler
    version. We previously installed the Microsoft Visual C++ Compiler Toolset. That''s
    why we will download the Visual C++ version.


    +   Step 2: Unpack


    Unpack the downloaded package using WinRAR, Zip, or any other package manager
    on your choice. Within the unpacked directory, there are two primary subdirectories:
    “include” and “lib”. All header files are in the include folder and the library’s
    binaries are found in the lib folder. The SDL comes in 32-bit and 64-bit versions
    under the x86 and x64 folders, respectively. Using the 32-bit or 64-'
  - '[PAGE 41]


    bit version has no effect on our coding experience; only the final product is
    altered. Using 32-bit allows you to run the final piece of software on both 32-bit
    and 64-bit systems, but the opposite is not true. The 64-bit version will be used
    in this book.


    ```

    SDL2.2.x.

    |--- lib

    |    |--- x86 <--- 32-bit binaries

    |    |--- x64 <--- 64-bit binaries

    |--- include

    ```


    # Step 3: Copy


    Copy all header files found in SDL2-2.x.x/include/ into the folder Project/windows/includes/SDL2/
    of your project.


    Copy the following .lib files SDL2.lib, SDL2main.lib from SDL2-2.x.x/lib/x64 into
    your Project/windows/libs folder.


    Also make sure to copy the SDL2.dll file from SDL2-2.x.x/lib/x64 in the folder:
    Project/windows/bin.


    We now officially have SDL2 installed and ready to use, but we still have to link
    it to our project. But before we get to that, we will first install all of the
    extension libraries for SDL as well.


    # Step 4: Installing SDL_image, SDL_ttf, SDL_mixer


    SDL2 alone is not enough for us to implement all the features mentioned earlier
    in our game engine. That’s why we will also use other extension libraries of SDL:
    SDL_image, SDL_mixer, and SDL_ttf.


    +   SDL_image


    SDL_image [12] is an image file loading library. It loads images as SDL surfaces
    and textures, and supports the following formats: BMP, GIF, JPEG, LBM, PCX, PNG,
    PNM, SVG, TGA, TIFF, WEBP, XCF, XPM, XV. Download it here: https://www.libsdl.org/projects/SDL_image/
    .


    ![](img/2763810ed0a1572c2bec59ee52dd75be_41_0.png)


    +   SDL_mixer


    SDL_mixer [13] is a simple multi-channel audio mixer library. It supports any
    number of simultaneously playing channels of 16-bit stereo audio, plus a single'
  - '[PAGE 42]


    channel of music, mixed by the popular FLAC, MikMod Mod MOD, Timidity MIDI, Ogg
    Vorbis, and SMPEG MP3 libraries: https://www.libsdl.org/projects/SDL_mixer/.


    # Windows

    SDL2_mixer-devel-2.0.4-VC.zip (Visual C++ 32/64-bit)

    SDL2_mixer-devel-2.0.4-mingw.tar.gz (MinGW 32/64-bit)


    +   SDL_ttf


    SDL_ttf [14] is a sample library that allows you to use TrueType fonts in your
    SDL applications. It comes with an example program "showfont" which displays an
    example string for a given TrueType font file. Download it using the following
    link: https://www.libsdl.org/projects/SDL_ttf/.


    # Windows

    SDL2_ttf-devel-2.0.15-VC.zip (Visual C++ 32/64-bit)

    SDL2_ttf-devel-2.0.15-mingw.tar.gz (MinGW 32/64-bit)


    Make sure you copy the header files for each extension library into the project/windows/includes/SDL2
    directory as we did previously for SDL. You need to repeat the same process for
    all .lib and .dll files for each library, respectively.


    +   Step 5: Link to Project


    Now that all files are downloaded and copied in their proper directories, all
    we must do is to link them to our project.


    Update the engine''s CMakeLists.txt file as shown in the following code.


    +   Project/engine/CMakeLists.txt'
