    \ name, int channel = -1,\n    int loops = 0, int vol = 50) {\n    auto& chunk\
    \ = assets->get<audio_asset>(name)->instance.data;\n    Mix_VolumeChunk(chunk,\
    \ vol);\n    Mix_PlayChannel(channel, chunk, loops);\n}\n\n// . . .\n```\n\n该函数接受四个参数。第一个参数是我们希望播放的音频资产的名称。第二个参数是我们希望播放歌曲的通道。如果你传递\
    \ \"-1\"，SDL 将为你选择下一个空闲通道。但你也可以指定一个特定的通道来播放声音。第三个参数是告诉 SDL 声音应该播放多少次。\"-1\" 表示无限循环。最后一个参数是你希望播放声音的音量。\n\
    该函数在注册表中查找声音资产，设置音量级别，\n\n"
