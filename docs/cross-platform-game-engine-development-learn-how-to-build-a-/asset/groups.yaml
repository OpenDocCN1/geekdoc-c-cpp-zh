    \ 1.2 specification. We are going to clone the yaml-cpp repository and compile\
    \ it ourselves.\n\n## Installing yaml-cpp (Windows)\n\nThis section will go through\
    \ how to install yaml-cpp on the Windows platform. We'll clone the repository\
    \ and build the library using CMake.\n\n### Cloning yaml-cpp\n\nyaml-cpp can be\
