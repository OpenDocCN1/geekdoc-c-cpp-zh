    通过上面的示例，某些事情需要发生。如果用户输入的值大于零，程序将设置为打印“value is positive”；但是，如果表达式因为输入为零而变为假，那么程序将忽略
    `console` 之后的整个语句。在我们处理语句时，为了快速查看 `else` 语句，在很多情况下我们无法完成任务，并希望添加足够强大的代码来处理工作。设置一段代码让某事发生后程序就卡住并不是一个非常好的主意，这时我们采用一个新的条件语句，即
    `if-else` 语句。


