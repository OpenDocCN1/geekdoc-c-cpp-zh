    ## 第 8 章：决策的程序


    有时有必要在满足条件时执行特定操作，在不满足条件时执行其他操作。假设我们的问题是维持一桶温水的温度，为了做到这一点，我们可以添加冷水。在这个问题中，我们需要决定添加什么种的水。


    同样，有许多问题我们需要知道一个条件来决定如何解决它们。在 C# 中，实现这一点非常容易，因为该语言为我们提供了不同的工具来处理它。我们将必须使用表达式，并且这些表达式将被求值。在这种情况下，我们将使用关系表达式和逻辑表达式，它们将被求值，并根据评估结果执行算法的其他特定步骤。让我们从了解我们需要的表达式开始。


