    # Asp.NET - a server-side application for the world-wide web


    In this book, we will detail the three components the common language runtime
    and class libraries come up again and again throughout the book, as .NET in the
    context of two components - common runtime and framework area referred to as the
    base framework.


    ## Discover .net


    The .NET framework is a solution to all the problems involved in development applications,
    providing great benefits not only to the developer but also to the development
    process. First of all, .NET allows us to work with existing code; we can use components
    and even in a situation where we need to use the windows API. When the .NET program
    is ready, it is much easier to install the client’s computer than traditional
    applications since it has strong integration between languages.


    A C# programmer can easily understand the code of a visual .NET programmer, and
    both programs use the language they are most comfortable with. This is because
    all the languages that make use of .NET libraries so it does not matter which
    language a program is in, we can recognize any language. Next, we will know the
    different components of .NET: common runtime (CLR), assembly, and common intermediate
    language (CIL).


    ## CLR


    The first component of .NET that we know is the common language runtime, also
    called CLR. This is an execution program common to all languages. This program
    is charge of reading the code generated by the compiler and starts its execution.
    It does not matter if the program was created with C#, visual .NET, or other .NET
    language, CLR reads and executes it.


    ## Assembly


    When we have a program written in .NET language and we compile it, the assembly
    is generated. The assembly contains CIL the compiled program and also the information
    about all the types used in the program. .NET programs do not compile directly
    into assembly code; instead, they compile into an intermediate language known
    as IL. This language is executed by the runtime. Use of IL gives flexibility and
    ability to multiplatform.


    The .NET framework has language specifications. Any language that wants to use
    .NET must be able to work with it. One advantage of this is that code with classes
    have interoperability with other languages, for example, it is possible to create
    a library in C# and a visual .NET programmer use it without problem. One of the
    most important points of the type system in programming languages, when we want
    to save information, it is placed in a variable, the variable will have a type
    depending on the information to save, for example, the type to save an integer,
    other to save a phrase word. The problem with this is each language store information
    differently. Some languages store integers with 16-bit memory and other with 32-bit;
    even some languages such as C++ do not have a type for strings phrases. To solve
    this, the .NET framework defines how types work in their environment. Any language
    that works with .NET must use the types outlined in the cts. Now that we know
    the basic concepts, we can see how all comes together.


    ## How to create a .NET application


    We can create a .NET application using a programming language. For this purpose,
    it will be C# with this programming language, we can create the source code of
    the program (instructions that tell the program what to do). When we have finished
    with source code, the compiler takes it and creates an assembly for us. This assembly
    is written in IL, another advantage of this is the compiler optimizes the code
    for a mobile device, where we use the runtime.


    The .NET framework runs on many platforms, not just Windows. This means that a
    program on a particular platform, like Linux, has the runtime. A .NET program
    developed in Windows and executed in Linux has the corresponding runtime.


    When we want to invoke the program, the runtime gets into action, the assembly
    creates the environment for us. The runtime starts reading the CIL instructions
    from the assembly and compiles them into bits for the microprocessor of the computer
    while the program is running; this is known as just-in-time compilation. In this
    way, the program advances in execution, all transparently for the user.

