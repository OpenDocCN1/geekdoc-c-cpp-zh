    Now, a basic area going through this process, your area is going to notice that
    there is a search bar at the top of the extensions view. This is where you are
    going to type "C#". The one you need is by Microsoft, so make sure to click this
    one to install and ready to go.


    Remember though this process that the C# language was developed to work best with
    the Windows system. So, if you have Windows, you are more likely to find this
    language easy to use, and all the features and functionalities that you are looking
    for in coding are more where you put them.


    This does not mean that you are not able to get this work on your Mac computer.
    It means that you need to take a few extra steps to get this setup, and it may
    take while to accomplish some of the things you would like. Taking some time to
    get familiar with the C# language on Linux or Mac computer will be important helping
    you get the best results in the process.


    ### How to get a C# compiler


    There are several compiler options for C# to make learning easy and smooth for
    beginners; in this book, we will use C# 4.0 version that comes with Visual Studio
    2010, but it is also possible to use a later version. Most of the examples should
    be able to compile run without any problem.


    In case we cannot get the professional version of Visual Studio 2019, a better
    option is the community version (formerly known as Express). This version is free
    and can be downloaded directly from the internet; you will need to go through
    a small survey to download the C# Visual Studio compiler (community version) is
    completely free. You can access the Microsoft portal here: https://visualstudio.microsoft.com/.


    Once you have downloaded the compiler, we proceed to carry the installation; this
    task is very similar to installing any other program, but do not forget to register
    within 30 days.


    ### Development environment


    Once the installation is finished, we start the program by selecting from the
    start menu. You will see a window that shows the application interface. The interface
    is divided into two parts:


    - **Left**: We have the search bar where we can find our most projects by entering
    keywords. On the home page, we see options to create a new project, a folder,
    a project solution, and access code repositories titled clone to check code. We
    can also receive announcements about new software using C# in this same part of
    the interface, but through different pages, we will have editing zones to edit
    the program code, interface, icons, and other resources.


    Editing the program code is a very simple activity that if we know how to use
    any type of text editor such as Microsoft Word or Notepad we can edit the code.
    The other editors area is also quite user-friendly, but we will not need to perform
    the examples shown in this book.


    On the bright side, we have a window known as an explorer; in this same area,
    other windows will appear that give information about the project we are developing.
    We will see the details shown by some of the windows later this book.


    ![Image00094.jpg](images/Image00094.jpeg)


    At the bottom, we find another window; in this area, there are usually sections
    that the compiler will use to communicate with us. For example, we will see a
    window that indicates the bars of the program; if we need any help, we will see
    the start menu.


    ### Creating a new project


    To create a new project, the easiest way is to select from the start. The interface
    shows the source code, and we click the start bar. If we need a folder, we will
    see the project solution by the explorer in the interface.


    To create an application with C# in Visual Studio, the best way is to create a
    project and work on the console. The program will generate a message in the console,
    and then we will add elements in the interface.


