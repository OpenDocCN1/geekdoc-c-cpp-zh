    在编辑区域，我们可以从那里看到程序的骨架。为了理解我们拥有什么，有一个必要的概念需要了解：命名空间（namespace）是一个逻辑分组，例如，我们将与数学相关的所有代码放在一个命名空间中。为了解决命名冲突，假设我们有一个巨大的项目，几名程序员在上面工作。两个程序员可能会创建相同的名称；这会产生冲突，因为程序不知道该使用哪个版本。在不同的命名空间中，已经创建了数千个类和方法供使用。当我们想要使用其他程序员编写的命名空间中的资源时，我们必须使用它。如果我们需要添加更多命名空间，将在此部分进行。


