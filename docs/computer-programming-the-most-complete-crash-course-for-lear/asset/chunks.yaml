    关于条件语句的第一点，我们想要查看的是语句的已知基础。它是我们将要学习的所有条件语句之一，而这一个将是其中最基础的部分。虽然它遗漏了一些功能，但我们希望稍微了解一下在这些语句中看到的一些功能，这有助于我们学习更多关于条件语句以及一些实用的场景，因此学习它是非常重要的。


    当你处理这个语句时，你会发现当它运行时，代码只有在用户提供的输入与代码中设置的条件相同时才会提供响应。当这种情况发生时，代码将能够执行，并通常根据程序员在代码中输入的内容显示某种类型的消息。有时，你还会设置执行其他内容。


    然而，如果用户输入的内容不符合我们设置的条件，那么屏幕上什么都不会显示。这可能会导致一些问题，这就是为什么该语句不像其他选项那样被频繁使用。


    关于这一切的好消息是，你会发现，即使是初学者，这些语句也易于设置和使用。让我们看看下面的代码，看看我们如何用 C# 语言为我们的需求创建一个这样的语句：


    ```csharp

    if (xa > 0)

