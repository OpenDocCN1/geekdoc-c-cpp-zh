    which are `capacity`, `automatic`, and `turbo`. Every property represents a read-only
    property and their initial state is set in the class constructor. The constructor
    takes three parameters and assigns their values to the properties mentioned above.
    In the `main` method, we creating a list of objects. The list of objects is populated
    in the declaration part, creating five objects with different values for the `capacity`,
    `automatic`, and `turbo` properties. After that, we would filter the list and
    take only cars that have an automatic transmission. This will be done by using
    the Linq query. We creating an object named `cars` that are automatic and filtering
    the list with Linq. Then we perform the `where` extension method to get the objects
    that we need. How does it work? In the `where` method, we are declaring a iterative
    variable that will be used for filtering conditions.


    The variable in this example is so that when we filter a car whose `automatic`
    property is true, this will return, ![Image0120.jpg](images/Image0120) let''s
    create a list. In the beginning, we use the `List<T>` type to create a collection
    of objects. We iterate through the list and print messages to the console output.
    For every object in the list, we will print "the car with capacity {capacity}
    is automatic".

