    你可以将其作为一种发现自己错误的方法，并学习什么对你最有效，什么又无效。


    # 关于寻求帮助的说明


    当我们开始以这种方式编写代码时，你可能有很多关于事物将如何运作以及你将如何成为史上最伟大的编写者的主意。


    你可能认为这不会出任何差错，你能够及时处理一切。


    最大的误解之一是，当你假设的工作中出现问题时，你认为真的不需要任何形式的帮助。


    虽然能开始用某种语言进行编码很棒，但你确实需要获得他人的反馈来帮助你。


    当你自己手写一段代码时，某个的话题似乎是可以学会的，但你会发现，当有更有经验的人帮助你时，事情会变得更容易，而且你实际上学到了新东西。


    无论是在哪一行寻求帮助来寻找能给你提供建议的人，你永远不要害怕向别人寻求帮助。


    现在所有资深程序员都曾处于你现在所在的位置。


    大多数开发者都会喜欢他们有再次编程的机会，并且非常愿意帮助你解决你想要帮助的代码问题。


    当然，我们需要对此保持谨慎，不要在整个过程中利用他人。


    在这里应该遵循的规则是：在让别人帮助你解决代码问题之前，花的时间不要超过 20 分钟。


    而且你不应该在提前花费至少 20 分钟尝试学习它是如何工作的以及你能用它做什么的情况下就寻求帮助。


    # 关于休息的说明


    有时当你正在写你想要在某种语言中实现的代码时，你会卡住。


    你在某行代码上花费的时间越多，直到找到能给你提供建议的人，你的感觉就越好。


    你投入得越多，你就能越能修复代码。


    你修复的代码越好，它对你来说运行得就越好。


    当这种情况发生时，你必须休息一下。


    # 忽视社区


    当我们使用自己熟悉的语言进行编码时，最后需要担心的事情之一，就是从问题中抽离出来休息。


