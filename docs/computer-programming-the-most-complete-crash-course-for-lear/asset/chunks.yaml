    C# is a powerful object-oriented programming language, which enables programmers
    to write various applications based on a Microsoft .NET platform quickly. Microsoft
    .NET provides a series of tools and services to maximize the development and utilization
    of computing and communication fields. It is precise because of the excellent
    object-oriented design of C# that makes it an ideal choice for building various
    components whether a high-level business object or system-level application.


    The functions of C# area manifest in the following aspects:


    - designing windows applications.

    - customize the windows control library.

    - design console application.

    - design smart device applications.

    - design ASP.NET web application.

    - design ASP.NET service.

    - design ASP.NET mobile web application.

    - customize the web control library.


    ASP.NET is the control and markup developed on C#. In the field of intermediate
    language, C# is the most affinity language which has the main characteristics
    of a C language and Java language, powerful function library, and convenient template,
    and is one of the best languages to present.


    ### Main features of C#


    C# language almost combines the advantages of current high-level languages and
    has the following main features.


    #### Concise grammar


    C# language like Java language uses unified operators which eliminates complex
    expressions and pseudo-keywords in C++ language and makes it describe in the simplest
    and most common form.


    #### Excellent object-oriented design


    C# language is designed according to the idea of object-oriented so has all the
    characteristics that object-oriented should have, namely encapsulation, inheritance,
    and polymorphism.


    C# language only allows single inheritance so a class does not have multiple base
    classes, thus avoiding the confusion of type definition. In C# language each type
    is an object, so there are no concepts such as global function, global variable,
    and global constant. All constants, variables, attributes, methods, indexes, events,
    etc. must be encapsulated in classes which makes the code more readable and reduces
    the possibility of naming conflicts.


    #### Close integration with the web


    In C#, complex web programming area more like operating objects, thus simplifying
    large-scale distributed development. Built-in C# language serve the web conveniently
    called by language running on an operating system.


    #### Complete security error handling


    Language error handling ability is an important measure whether a language is
    excellent or not. C# eliminates mistakes in software development and provides
    complete safety, including type safety. By default, the code from the internet
    does not allow to access files and resources. C# language does not allow initialized
    variables and provides such overflow check. Garbage collection mechanism in memory
    management greatly reduces the burden of memory management for developers.


    #### Version processing technology


    C# language has built-in version control functions such as handling loads and
    support to ensure convenient development and upgrade of complex software.


    #### Flexibility and compatibility


    In the managed state, C# can''t use pointer but uses delegate to simulate the
    function of pointer. If you need to use pointers in classes or methods, you only
    need to declare the contents unsafe. Also, although C# does not support multiple
    inheritance of classes, it is realized by inheriting interfaces.


    Compatibility means that C# allows operation with API with C/C++ language style
    that needs to pass pointer type parameters and allows operation between C# components
    and other language components.


    #### Better correspondence between business process and software implementation


    If an enterprise business plan is to put into practice, a close correspondence
    must be established between the abstract business process and the actual software
    implementation. It is difficult to do this in most languages.


    C# allows type-defined, extended metadata. The metadata applied to any object
    project builders can define domain-specific attributes and apply to them language
    element, such as classes and interfaces.


    In word, C# is a modern object-oriented language which enables programmers to
    create solutions based on a Microsoft .NET platform conveniently. This framework
    enables C# components to easily transform into XML services so that applications
    of platform can call through the internet. C# enhances the efficiency of developers
    at the same time, it is committed to eliminating errors in programming that may
    lead to severe results. C# enables C/C++ programmers to develop network quickly
    while maintaining the flexibility that developers need.


    With this, we have completed a brief introduction to the importance and applications
    of C# with varied examples. In the next chapter of this book, we will talk about
    the C# development environment that is essential for developing a well-versed
    C# desktop application.


