    status bar we will see that compiled successfully.


    To run the application


    Once the compilation is successful, we can run the program and see how it works.
    For this, we have two options: run with debugging or execute without debugging.
    Only the execution with debugging appears, but we can use execution without debugging
    with the `Ctrl+F5` keys adding the tools menu.


    The debugger is a program that helps us correct errors at runtime and also logical
    errors. Preferably we should use the execution without the debugger and make use
    of execution with debugging only when we need it now running our application;
    for this we press `Ctrl+F5` keys.


    When the program is executed, a window appears we can call the console to show
    the execution of the program. In this way, we can read the message we had placed
    in example.


