    \ <= 4);\n\n//cycle conditions\n\nConsole.scanprogram();\n\n}\n\n}\n```\n\n运行结果将全部显示在计算机屏幕上。上面的示例具有相同的运行结果，说明\
    \ `do-while` 循环和 `while` 循环可以实现相同的功能。然而，两者在程序运行过程中存在差异。如果循环条件在循环语句开始时不满足，`while`\
    \ 循环的循环体将一次也不会执行，但 `do-while` 循环的循环体仍会执行一次。如果将示例中的循环条件 `x<=4` 改为 `x<1`，示例 `b2-12`\
    \ 将打印 `x=1`，而示例 `b2-11` 将不输出任何内容。\n\n### 循环语句\n\n上一节节解释了 `while` 循环和 `do-while`\
    \ 循环。在程序开发中，经常会使用另一种循环语句，即 `for` 循环，它通常用于循环次数已知的情况，其语法格式如下：\n\n`for (initialization\
    \ expression; condition; operation expression)`\n\n```\n{\nExecute statement\n\
    …\n}\n```\n\n在上述语法结构中，`for` 关键字后的 `()` 包含三个部分：`initialization expression`、`loop\
    \ condition` 和 `operation expression`，之间用 `;` 分隔，`{}` 中的执行语句是循环体。\n\n接下来，`initialization\
    \ expression`、`loop condition`、`operation expression` 和循环体分别由 `b1` 表示，可以通过编号详细分析\
    \ `for` 循环的执行流。\n\n```\nFor(1; 2;3)\n{\n    4\n}\n```\n\n接下来通过一个用例计算自然数 `1~4`\
    \ 的和，如下例所示。\n\nExample program13.cs:\n\n```csharp\nPublic class classicprogram\n\
    {\n    Public static void //this is where we usually enter the options\n    {\n\
    \        Int secondinstance = b1;\n        //define the variable 'secondinstance'\
    \ with the initial value of b1\n        Do\n        {\n            Console.getresults(\"\
    firstinstance=\" + secondinstance);\n            //print the value of 'firstinstance'\n\
    \            Secondinstance++;\n            //increase the value of 'firstinstance'\
    \ by itself\n        } While(firstinstance <= 4);\n        //cycle conditions\n\
    \        For(int first = 1; first <= 4; first++)\n        {\n            sum +=\
    \ first; //realize the accumulation of sum\n        }\n    }\n}\n```\n\n在示例中，变量\
    \ `sum` 的值为 1，如果条件 `<=4` 为真，则在执行完成后执行循环，执行表达式 `bi++`，值变为 2。然后继续判断条件 `5<=4` 为假，结束循环，打印\
    \ \"10\"。\n\n## 第 6 章：类与对象\n\n在 C# 语言中，每个组件都与类和对象相关，这代表了面向对象编程的基本概念。类就像一个原型，用户从原型创建对象。类表示一个具有成员、属性和功能的单一单元。对象是现实生活中的内存实体。当实例化时，它们会分配一些内存空间并对该空间拥有引用。每个创建对象必须是某个类类型。\n\
    \n类代表了任何面向对象软件的独特编程。类用访问修饰符、`class` 关键字和唯一名称来定义。在某些类中，可能存在多个成员，如字段、属性和方法。类的默认访问修饰符是\
    \ `internal`。这意味着如果没有指定访问修饰符，则该特定类将被视为 `internal`。一个类的示例写所示：\n\n![Image00109.jpg](img/Image00109.jpeg)\n\
    \n该类包含一个访问修饰符——`public`，它包含 `class` 关键字；它有一个唯一的名称 `shirt`。在此类中，定义了多个成员：一个 `private`\
    \ 字段 `color`、一个 `public` 属性 `color`、一个定义的构造函数（带有参数）以及一个 `public` 方法 `about`。\n\
    \n"
