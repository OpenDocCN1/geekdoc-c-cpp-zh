    要编译应用程序，我们必须选择生成菜单，然后只需通过按下 `F6` 键即可生成解决方案。编译器将开始工作，我们将在状态栏中看到编译成功。


    运行应用程序


    一旦编译成功，我们就可以运行程序并观察其工作原理。为此，我们有两个选项：带调试运行或不带调试运行。虽然只显示带调试运行，但我们可以通过工具菜单添加 `Ctrl+F5`
    快捷键来使用不带调试运行。


    调试器是一个帮助我们在运行时纠正错误以及逻辑错误的程序。我们最好使用不带调试器的执行方式，仅在需要调试正在运行的应用程序时才使用带调试运行；此时我们按下 `Ctrl+F5`
    键。


    当程序执行时，会弹出一个窗口，我们可以调用控制台来显示程序的执行情况。通过这种方式，我们可以读取在 `example` 中放置的消息。


    由于这是一本 C# 编程的入门书籍，我们所有的程序都将在控制台上运行，通过学习如何在 C# 中编写表单和图形界面，来理解核心概念。这种编程并不困难，但需要面向对象编程的基础知识。


    如何在程序中检测错误


    有时我们编写程序时可能会出错；发生这种情况时，应用程序无法编译，因此我们必须更改错误的地方。我们故意写一个错误，将控制台的命名空间更改为 `helloworld`，看看编译后会发生什么。


    ![Image0101](img/Image0101)


    如你所看到的，界面底部出现的窗口是编译器用于通信的；该窗口给出了错误列表。在下一本书中，我们将学习如何使用它；现在我们只需要知道，解决列表中的第一个问题是必要的，可以直接点击一下跳转到错误。


    类视图


    现在我们将检查类视图。在此视图中，我们可以获取有关解决方案资源管理器的信息，这些信息是按逻辑排列的。通过此视图，我们可以快速找到解决方案的命名空间以及它们包含的类；如果需要，我们还可以查看每个类拥的方法。此视图不仅允许我们查看逻辑信息，还提供了快速导航代码的可能性。


    在社区版中，没有预先配置的选项，因此必须向视图菜单中添加命令。


    要显示类视图，我们必须进入视图菜单，然后通过按下 `Ctrl+` 选择类视图，这将弹出一个窗口界面。


    ![Image0102](img/Image0102)


    类视图窗口分为两个部分；一个部分显示元素的层级关系，另一个部分显示特定的类。


    ![Image0103](img/Image0103)


    在树形结构中，我们可以找到命名空间 `helloworld` 的必要引用。如果有更多命名空间，它们会在打开命名空间时出现在那里，找到在其中声明的类。在这种情况下，我们只有一个类；点击一下，我们将在底部看到
    `example` 中显示的元素，我们有 `Main()` 方法。如果此时我们双击任何方法，将自动跳转到其定义代码处。因为程序很小，可能看不到这种做法的优势，但对于具有数行代码的程序来说，能够快速导航是一个巨大的优势。


    配置编译器菜单


    为了在菜单中添加所需的选项，我们必须遵循一系列非常简单的步骤。首先，进入工具菜单并选择“自定义”选项。


    弹出一个对话框，我们在其中必须选择命令；在此部分，我们选择想要添加命令的菜单，例如“视图”菜单。


    ![Image0104](img/Image0104)


    在列出的当前菜单命令区域，点击我们想要插入新命令的位置并按下“添加”按钮。这将弹出一个新对话框，显示所有我们可以添加的分类后的可能命令。


    在类别中选择“视图”，在“类视图”命令中，该命令就是允许我们拥有类视图的。“不带调试启动”命令位于“调试”类别中。


    ![Image0105](img/Image0105)


    到此为止，我们分析了理解 .NET 操作所需的最基本概念。从下一章开始，我们将开始学习编程和 C# 语言。


