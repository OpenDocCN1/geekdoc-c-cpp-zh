  trans: "\nJIT 编译器速度缓慢且效率低下，因为程序需要重新运行已经编译的代码，而不是通过重新编译来提高性能和用户的响应时间。\n\n对于正在运行的程序，.NET\
    \ 框架提供了内存管理和垃圾回收服务。在 C 和 C++ 这样的非托管语言中，程序员需要负责内存管理。在大型程序中，这是一项复杂的任务，可能会在程序执行期间导致错误。幸运的是，像\
    \ C# 这样的托管语言拥有一种模型，程序员不再需要对内存使用负责。垃圾回收器负责在对象使用完毕后移除所有不再需要的对象。这释放了内存和资源。\n\n垃圾回收器自动工作，并有助于消除针对文件、数据库或网络连接等特殊情况所需要的内存管理。对于非托管资源，我们必须显式指示它们何时需要被销。\n\
    \n## 第 10 章：枚举与结构体\n\n### 枚举 (Enum)\n\n枚举（enumerated type 的缩写）是一种特殊的数据类型，允许程序员为一组常量提供有意义名称。\n\
    \n要声明一个枚举，我们使用 `enum` 关键字，后跟枚举的名称。枚举的成员包含在一对括号中，并用逗号分隔。\n\n示例如下：\n\n```\nenum\
    \ DaysOfWeek\n{\n    Sun, mon, tue, wed, thurs, fri, sat\n}\n```\n\n注意，我们在最后一个成员末尾不加分号。\n\
    \n在声明 `DaysOfWeek` 枚举后，我们可以这样声明并初始化 `DaysOfWeek` 变量：\n\n`DaysOfWeek mydays = DaysOfWeek.mon;`\n\
    \n变量的名称是 `mydays`，如果我们写 `Console.WriteLine(mydays)`，我们将得到 Mon。默认情况下，每个成员都被分配一个从零开始的整数值，因此在示例中，成员被分配了值\
    \ 0, 1, 2。要查看这些整数，我们将 `DaysOfWeek` 变量转换为 `int`：\n\n```\nConsole.WriteLine((int)mydays);\n\
    Console.WriteLine(DaysOfWeek);\n```\n\n如果想为我们的枚举成员分配不同的整数，可以使用以下代码：\n\n```enum\n\
    enum DaysOfWeekFour\n{\n    Sun = 5, mon = 10\n}\n```\n\n由于字节 的范围是从 0 到 255。使用枚举有两个主要原因。第一个是提高代码语句的可读性：`mydays\
    \ = DaysOfWeek.mon;` 比 `mydays = 1;` 更具自解释性。第二个原因是限制变量可以取的值。如果我们有一个存储星期几的变量，可能会无意中将值\
    \ 10 分配给它；当我们使用枚举并仅向变量分配预定义的枚举成员时，就可以防止这种情况。当然，如果你使用 byte 数据类型，可以进行像 `enum DaysOfWeek\
    \ { Sun = 300 }` 这样的操作。\n\n### 结构体 (Struct)\n\n现在来看 struct 数据类型。struct 在许多方面与类相似。与类一样，它们包含包含属性、构造函数、方法和字段等元素，允许你将相关的成员分组到一个包中，以便你作为一个整体对其进行操作。\n\
    \n要声明一个结构体，使用 `struct` 关键字。示例是：\n\n```\nstruct Struct\n{\n    private int number;\n\
    \    private OtherClass myclass;\n    private DaysOfWeek days;\n\n    // 构造函数\n\
    \    Struct(int ba, int bb, int bc)\n    {\n        myclass = new OtherClass();\n\
    \        myclass.number = ba;\n        days = bc;\n    }\n\n    // 方法\n    void\
    \ print()\n    {\n        Console.WriteLine(\"{0}, {1}, {2}\", myclass.number,\
    \ myclass, days);\n    }\n}\n```\n\n该结构体声明了三个字段：一个私有的 `int`、一个私有的 `OtherClass`\
    \ 和一个私有的 `DaysOfWeek` 变量。构造函数接收三个 `int` 参数，初始化 `myclass`，设置 `myclass.number` 并设置\
    \ `days`。`print()` 方法打印这些值。\n"
