    \ performance and response times for the user.\n\nFor programs that are running,\
    \ the .NET framework provides the services of memory management and garbage collection.\
    \ In unmanaged languages like C and C++, the programmer is responsible for memory\
    \ management. In large programs, this becomes a complicated task which can lead\
    \ to errors during program execution. Fortunately, managed languages like C# have\
    \ a model which programmers no longer need to be responsible for memory usage.\
    \ The garbage collector is in charge of removing all objects that are no longer\
    \ needed when an object is used. This frees up memory and resources.\n\nThe garbage\
    \ collector works automatically and helps to eliminate the memory management that\
    \ was necessary for special cases like files, databases, or network connections.\
    \ For unmanaged resources we must explicitly indicate when they need to be destroyed.\n\
    \n## Chapter 10: enum struct\n\n### Enum\n\nAn enum (which stands for enumerated\
    \ type) is a special data type that allows programmers to provide meaningful names\
    \ for a set of constants.\n\nTo declare an enum, we use the `enum` keyword followed\
    \ by the name of the enum. The members of the enum area are enclosed in a set\
    \ of curly braces separated by commas.\n\nAn example can be shown below:\n\n```\n\
    enum DaysOfWeek\n{\n    Sun, mon, tue, wed, thurs, fri, sat\n}\n```\n\nNote that\
    \ we do not put a semicolon at the end of the last member.\n\nAfter declaring\
    \ the `DaysOfWeek` enum, we can declare and initialize a `DaysOfWeek` variable\
    \ like this:\n\n`DaysOfWeek mydays = DaysOfWeek.mon;`\n\nThe name of the variable\
    \ is `mydays`, and if we write `Console.WriteLine(mydays)`, we will get Mon By\
    \ default each member is assigned an integer value starting from zero, so in our\
    \ example the member is assigned a value of 0, 1, 2. To see the integers, we cast\
    \ the `DaysOfWeek` variable into an `int`:\n\n```\nConsole.WriteLine((int)mydays);\n\
    Console.WriteLine(DaysOfWeek);\n```\n\nIf we want to assign different integers\
    \ to our enum members, use the following:\n\n```\nenum DaysOfWeekFour\n{\n   \
    \ Sun = 5, mon = 10\n}\n```\n\nAs the range for a byte is from 0 to 255. There\
    \ are two main reasons for using enums. The first is to improve the readability\
    \ of your code statement: `mydays = DaysOfWeek.mon;` is more self-explanatory\
    \ than `mydays = 1;`. The second reason is to restrict the values that a variable\
    \ can take. If we have a variable that stores the days of a week, we may accidentally\
    \ assign the value 10 to bit; this is prevented when we use an enum and only assign\
    \ the pre-defined members of the enum to the variable. Of course, if you use a\
    \ byte data type, you can do something like `enum DaysOfWeek { Sun = 300 }`.\n\
    \n### Struct\n\nNow let's look at the struct data type. A struct is similar to\
    \ a class in many aspects. Like classes, they contain elements like properties,\
    \ constructors, methods and fields, which allows you to group related members\
    \ into a single package so that you can manipulate them as a group.\n\nTo declare\
    \ a struct, use the `struct` keyword. An example is:\n\n```\nstruct Struct\n{\n\
    \    private int number;\n    private OtherClass myclass;\n    private DaysOfWeek\
    \ days;\n\n    // constructor\n    Struct(int ba, int bb, int bc)\n    {\n   \
    \     myclass = new OtherClass();\n        myclass.number = ba;\n        days\
    \ = bc;\n    }\n\n    // method\n    void print()\n    {\n        Console.WriteLine(\"\
    {0}, {1}, {2}\", myclass.number, myclass, days);\n    }\n}\n}\n```\n\nThe struct\
    \ is declared with three fields: a private `int`, a private `OtherClass`, and\
    \ a private `DaysOfWeek` variable. The constructor takes three `int` parameters,\
    \ initializes `myclass`, sets `myclass.number`, and sets `days`. The `print()`\
    \ method prints the values.\n"
