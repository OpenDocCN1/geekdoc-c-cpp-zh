    ## 第 7 章：Linq、查询、操作符 – XML


    ### Linq


    语言集成查询（Language Integrated Query，称为 Linq）代表了 C# 编程语言中的查询语法，用于检索和过滤不同来源的对象。Linq
    为各种类型的对象和变量提供了单一的查询接口。这种查询语法被集成到 C# 编程语言以及 Visual Basic 中。为了更好地理解，我们将提供一个示例来进一步解释。因此，你有
    SQL 这种结构化查询语言；SQL 用于在数据库中获取和保存数据，它是一种旨在与数据库紧密工作的语言。


    与 SQL 类似，Linq 用于获取和过滤不同的数据源，如集合等。使用 Linq 有许多方法；它可以直接查询集合、XML 文档、实体框架数据，通过实现 `queryable`
    接口查询其他数据源，它是程序中某些变量之间的桥梁。查询返回对象作为结果，非常好，因为在使用 Linq 时可以使用面向对象的方法处理数据，你无需担心将数据集转换为对象。Linq
    提供了一种查询数据的方式，且数据来源支持编译时语法检查，因此如果你在编写 Linq 时出错，编译器会立即通知你。下面查询集合如列表、数组、可枚举类（enumerable
    classes）等。


    我们现在有了示例：


    ![Image0118.jpg](img/Image0118)


    在这个示例中，我们有一个名为 `car` 的类。在类中有三个属性，分别是 `capacity`、`automatic` 和 `turbo`。每个属性都代表一个只读属性，它们的初始状态在类构造函数中设置。构造函数接受三个参数并将这些值赋值给上述属性。在
    `main` 方法中，我们创建了一个对象列表。该对象列表在声明部分被填充，创建了五个 `capacity`、`automatic` 和 `turbo` 属性具有不同值的对象。之后，我们将过滤列表，只保留具有自动挡箱的汽车。这将通过使用
    Linq 查询完成。我们创建了一个名为 `cars` 的自动挡汽车对象，并使用 Linq 过滤列表。然后我们执行 `where` 扩展方法来获取我们需要的对象。它是如何工作的？在
    `where` 方法中，我们声明了一个用于过滤条件的迭代变量。


    此示例中的变量的作用是，当我们过滤一个 `automatic` 属性为 true 的汽车时，它将返回，![Image0120.jpg](img/Image0120)。让我们创建一个列表。在开始，我们使用
    `List<T>` 类型创建一个对象集合。我们遍历列表并将消息打印到控制台输出。对于列表中的每个对象，我们将打印“the car with capacity
    {capacity} is automatic”。

