    在我们学习 C# 语言时，我们需要花一些时间处理决策控制语句和条件语句。该领域将涉及可以接收用户输入的代码类型，将其与我们在代码中设置的条件进行比较，然后根据这些条件做出决策。当我们编写代码来处理某些决策时，这一切都在一个框架中完成。标准程序的输出如下：


    ```

    if statement

