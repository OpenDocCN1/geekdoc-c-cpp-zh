    \ `List<int>` 对象。我们创建了一个变量来存储所有工资变量的总和。完成后，我们还有最后一条语句来完成工作。在每个方法完成之前，我们将所有工资汇总到一个变量中，程序会将结果打印到标准输出。该程序的输出将如下：\n\
