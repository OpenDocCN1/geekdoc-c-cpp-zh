    ## 引言


    欢迎 C# 编程，非常感谢你选择这本书！


    无论你是经验丰富的程序员还是完全的新手，这本书都是为了帮助你快速学习 C# 编程而编写的。


    读完本书后，你应该能够毫无问题地编写自己的 C# 程序。事实上，我们将作为项目的一部分一起编写简单的软件，准备好开始了吗？


    大多数人对学习新的编程语言感到恐惧。他们知道学习一点可以为他们操作计算机打开很多大门，但他们担心编程本身太难学习和操作了。如果你不花适当的时间来学习新的编程语言，整个编程过程可能会变得困难。但当你需要找到一种可以帮助你编写几乎任何你想要的代码语言时，就是学习
    C# 语言的时候了。本书将带你通过一些 C# 语言的基础知识，让你自己上手。关于 C# 的：当你涉及到编码时，你可能想要查看的是了解 C# 特别是你想要学习如何使用这种特定的语言。有很多语言可以选择，而且它们的工作方式都不同，但你会发现使用
    C# 程序有足够的内容，我们将在本书中探索一些想法。尽管你只是一个初学者，这也是一个非常适合工作和设计你自己程序的棒语言。


    虽然如果你想开始编程有很多选择，但没有像 C# 这样的。选择 C# 而不是编程语言的优点之一包括：


    作为一个初学者，代码有很多部分对你来说并不容易学习。你将在边学边做，但允许 C# 的库是一个帮助你的绝佳资源。你可以将函数放入代码中，而无需过多参与。你可以使用它们对代码进行一些更改，使其按你想要运行。


    ### 自动释放函数


    当你使用其他一些编程语言时，你必须检查并移除你拥有的项目。这会占用你的时间，如果你漏掉了其中一些，将会非常麻烦。使用 C# 将为你完成所有这些工作，让事情变得更快、更简单。


    ### 易于学习


    C# 被广泛认为是最容易学习和操作的语言之一，虽然某些部分比其他语言更复杂，但这并不困难，你会很快识别代码部分并继续使用。


    ### 兼容 Windows


    这种语言最初是为 Windows 计算机创建的，帮助你为它们设计程序，但它也能很好地适用于 Mac、Linux 等其他操作系统。下载 .NET。Windows
    有一些易于使用的产品，特别是对于初学者来说，所以你一旦开始就能获得极的结果。


