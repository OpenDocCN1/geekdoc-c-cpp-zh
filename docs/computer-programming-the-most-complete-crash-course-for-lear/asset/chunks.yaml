    In the provided example, we can see an abstract class with the name `Animal`.
    In this class, there is only one member which is an abstract void method `legsNumber()`.
    When the method is marked as abstract, it means that every class derived from
    that class, as in this case `Animal` class, must have an implementation of that
    method. Below the abstract class, there are two more classes which are the ''normal''
    classes. Both classes have an implementation of `legsNumber()` method from the
    `Animal` class because both `elephant` and `pig` classes inherit from `Animal`.
    Inheritance will be explained in detail in a later chapter, but for now, the symbol
    `:` to `elephant` and `pig` means that they inherit from `Animal`. In this case,
    this means they must have their implementation of the abstract method from the
    base class. In the `main` method of program class there is a declaration of `Animal`
    type variable named `animal`.


    Note that there is no instantiation of `Animal` class because that is not possible,
    and the reason is that `Animal` class is an abstract class so it cannot be instantiated.
    In the next line, the program is instantiating an object of `elephant` class into
    `Animal` type variable. This is allowed because `Animal` is the base class of
    `elephant`. After that, there is a call to `legsNumber()` from `animal` variable.
    Furthermore, since `animal` is instantiated to `elephant` type, this call executes
    the `legsNumber()` method from `elephant` class. The next thing is the instantiation
    of `pig` object and assigning it to the same `animal` variable. This ends up calling
    `legsNumber()` again from `Animal` object. This implementation of `legsNumber()`
    from `pig` class is used. The `console.output` will look like this:


    ![Image00111.jpg](images/Image00111.jpg)


    Objects represent entities in a system with all characteristics and features located
    somewhere in memory and have a reference pointer to it. Whenever the keyword `new`
    is used, an object is created. This object must be of a class which was created
