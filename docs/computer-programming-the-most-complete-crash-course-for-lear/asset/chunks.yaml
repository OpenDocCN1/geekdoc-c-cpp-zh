  trans: "\n`List<t>` 是所有集合中最频繁使用的一个集合类。它是一种通过索引访问元素的类型。如前所述，`List` 属于 `System.Collections.Generic`\
    \ 命名空间。`List` 是一个类，为 `List` 和元素操作提供了许多方法，其中一些方法用于搜索、排序等。它被用于创建包含许多不同类型的集合。它可以是整数、字符串等许多类型的集合。对于引用类型，`List`\
    \ 允许将 `null` 值作为元素。在 `List` 集合中也可以插入重复的值。该类可以同时使用与数组类似列表的边界比较器和等性比较器，但列表可以动态更改大小，而数组不能。\n\
    \n# String\n\n`String` 是一种表示文本的数据类型，并与文本变量一起工作。它是一个字符数组。通过 `string` 关键字声明 `string`\
    \ 数据类型。当使用 `string` 关键字时，意味着它指的是 `String` 类（在书的后部分解释）。有许多方法可以使用某些字符串变量。一些最流行的包括\
    \ `concat`（用于连接两个字符串）、`contains`（确定字符串是否包含作为值传递的给定字符串）、`equals`（确定两个字符串是否具有相同的值）等。默认字符串数据类型是空字符串。\n\
    \n## 第 5 章：语法\n\n### 循环结构语句\n\n在现实生活中，我们经常多次重复做某件事。例如，当你每轮练习都要擦擦眼睛时，你会重复擦眼睛的动作。在打网球时，你会重复挥拍动作等等。在\
    \ C# 中，有一种语句可以重复执行相同的代码块，这被称为循环语句。循环语句分为三种类型：`while` 循环、`do while` 循环和 `for` 循环。\n\
    \n`while` 循环是上述节提到的某些条件判断，根据条件决定是否执行 `{}` 中的语句。如果条件为真，则重复执行语句，直到循环结束。`while` 循环的语法如下：\n\
    \n```\nwhile (condition)\n{\n    statement\n}\n```\n\n在上述结构中，`{}` 中的执行语句被称为循环体，它取决于条件。当条件为真时，将执行循环体。当循环体执行完毕后，它将继续判断条件，直到条件为假。接下来，使用一个用来打印从\
    \ 1 到 4 的自然数，如下例所示。\n\n示例 program11.cs\n\n```csharp\npublic class program11\n\
    {\n    public static void //这里是你需要输入逻辑的地方\n    {\n        int firstsample = 1;\
    \ //定义初始值为 1 的变量‘firstsample’\n        while(firstsample <= 4) // 循环条件\n     \
    \   {\n            Console.WriteLine(\"firstsample=\" + firstsample);\n      \
    \      //如果条件成立，打印 firstsample 的值。\n            firstsample++; //firstsample 自增\n\
    \        }\n        Console.ReadKey();\n    }\n}\n```\n\n计算机屏幕上显示的运行结果。例如，`x`\
    \ 的初始值为 1，如果满足循环条件 `x <= 4`，则循环将重复执行，打印 `x` 的值，并且 `x` 会自动增加。因此，打印结果中 `x` 的值值分别为\
    \ 1、2、3 和 4。值得注意的是，代码使用了一个示例通过在循环中更改 `x` 的值来实现死循环。\n\n`do-while` 语句与 `while` 循环相似。区别在于\
    \ `do-while` 语句在判断条件之前会执行 `{}` 中的执行语句。`do-while` 循环的语法如下：\n\n```\ndo\n{\n    statement\n\
    } while (condition);\n```\n"
