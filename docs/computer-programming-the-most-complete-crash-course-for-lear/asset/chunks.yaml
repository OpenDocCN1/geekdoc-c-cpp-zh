    现在，我们进入这一过程的一个基础领域，你会注意到扩展视图的顶部有一个搜索栏。你可以在这里输入“C#”。你需要的是由 Microsoft 提供的版本，所以请确保点击这一个进行安装，即可准备就绪。


    但请记住，C# 语言的设计初衷是在 Windows 系统上运行得得最好。因此，如果你使用的是 Windows，你可能会发现这种语言易于使用，而且你在编程中寻找的所有功能和特性都恰好位于它们所在的位置。


    这并不意味着你无法在 Mac 计算机上完成这项工作。这意味着你需要额外额外的步骤来完成配置，并且实现你想要的某些功能可能需要一些时间。花些时间在 Linux
    或 Mac 计算机上熟悉 C# 语言，对于帮助你在这一过程中获得最佳结果至关重要。


    ### 如何获取 C# 编译器


    C# 有多种编译器选项，可以让初学者的学习过程变得轻松顺畅；在本书中，我们将使用 Visual Studio 2010 自带的 C# 4.0 版本，但也可以使用更高版本。大多数示例都应该能够在没有任何问题的情况下编译并运行。


    如果我们无法获得 Visual Studio 2019 的专业版，更好的选择是社区版（以前称为 Express）。该版本是免费的，并可以直接从互联网下载；你只需要完成一个小型调查即可下载
    C# Visual Studio 编译器（社区版），它是完全免费的。你可以在此处访问 Microsoft 门户网站：https://visualstudio.microsoft.com/。


    一旦下载了编译器，我们就进行安装；这项任务与安装任何其他程序非常相似，但不要忘记在 30 天内进行注册。


    ### 开发环境


    安装完成后，我们从开始菜单中启动程序。你将看到一个显示应用程序界面的窗口。该界面分为两个部分：


    - **左侧**：我们有一个搜索栏，可以通过输入关键词找到我们的大多数项目。在主页上，我们可以看到创建新项目、文件夹、项目解决方案的选项，以及访问名为“克隆”（clone）的代码库以检查代码。我们也可以在这个界面的相同部分接收有关使用
