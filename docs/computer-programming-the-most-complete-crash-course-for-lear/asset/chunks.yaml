    但它是一个非常棒的方法，帮助我们在过程中不断深入，并成为一名更好的开发者。


    如果你计划在大学期间以及为了新工作一直使用这种方法，能够手写你正在使用的代码并将其用于你的需求，对于你所能预见的成功将非常重要。


