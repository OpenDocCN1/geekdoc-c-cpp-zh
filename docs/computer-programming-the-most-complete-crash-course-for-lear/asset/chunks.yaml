    # 引言


    在处理嵌套条件语句时，你必须关注的重点是：如果你这样做，一旦编写语句时发生错误，整个程序都会因为这个错误而失败，并且可能花费一些时间来修复。这使得在此过程中处理和操作变得有些困难，所以请务必小心。


    然而，它们的巧妙之处，以及让它们非常有吸引力的一点在于，它们允许我们根据意愿添加许多或少数几层嵌套。尽管如此，大多数该语言的专业人士建议嵌套语句保持在三层左右，以防它们在处理过程中变得过于混乱。


    如果你在编写语句时超过了第三层，你最终可能会得到一个杂乱无章且不符合预期的结构，而且可能不值得费力。作为初学者，请坚持三层，随着你编程水平的提高再增加深度。


    你可以编写许多依赖于条件语句的代码。它们可以帮助你让代码更健壮，并确保我们能够处理用户提供的某些输入，即使我们无法预测用户将添加什么内容。程序可以根据我们设置的许多条件对输入进行处理，确保程序按照我们希望的方式运行。这使得我们更容易看到结果，并确保程序按照我们的意愿工作。


    # 第 9 章：.NET


    ## .NET 框架


    用此类框架编写的程序能够在软件或硬件环境（通常称为运行时，runtime）中自执行。该框架是一个虚拟机，将帮助提供一些不同的服务，包括安全、处理和内存管理；正因如此，用此框架编写的代码被称为我们之前提到过的托管代码（managed
    code）。


    首先，类（class）非常重要，因为它提供了某些用户界面、数据库连接、数据访问、应用程序开发、算法等，程序员通过使用框架以及其他可用库来生成一些源代码。这是一个框架旨在很好地支持大多数想要创建
    Windows 平台的新应用程序。此外，微软还开发了一个专门针对该软件的工具，即 Visual Studio。


    在涉及到框架时，我们需要处理很多内容。某些方法已经开发出来，不仅可以在 Windows 系统上运行，还可以在其他操作系统（包括 Linux 和 Mac）上运行，并有助于使用多种语言（特别是
    C#），同时保持了可移植性、安全性、高性能，并能良好地管理我们在编写特定代码时所需的内存。


    为了能够使用 C# 进行高效编程，人们需要一些关于所谓 .NET 框架的理论背景知识。这就是为什么 .NET 框架是本书不可或缺的一部分；在我们深入接触 .NET
    框架之前，你应该知道它是 .NET 技术中不可或缺的一部分。


    运行时环境的任务本质上是执行用相应编程语言开发的代码。但在框架中，通常会为每个语言部分提供一个运行时库，以便它们能够执行相应的程序。例如，`rt.dll`
    和 `vm6.dll`。提供的运行时概念与今天相比已有了根本性的不同。跨语言支持提供了关键优势：只需要一个框架。可以根据个人偏好使用不同的语言。


