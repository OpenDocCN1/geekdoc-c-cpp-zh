  trans: "\n\n在编程语言中，数据类型允许一个框架，用于声明不同数据类型的变量或函数。变量的类型决定了它所占空间以及位模式的保存方式。数据类型的基本分类如下：\n\
    \n● 基础类型：用于数值计算的类型，包含以下两种类型：(a) 整数和 (b) 浮点。\n\n● 枚举类型：同样是数值排序领域，用于描述必须通过系统分配离散数值值值的变量。\n\
    \n● void 类型：关键字 `void` 表示无法分配任何值。\n\n● 派生类型：它们包含了 (a) 数组、(b) 指针、(c) 联合、(d) 结构体和\
    \ (e) 函数。\n\n数组结构数据类型也称为聚合类型。函数的类型定义了函数在终止时返回的值类型。我们将在后续章节中讨论核心数据。\n\n### 整数类型\n\
    \n以下是属于该类别的数据类型列表。为了供参考，还指定了它们所占的存储范围。\n\n● char\n分配内存：1 byte 范围：-128 到 127 或\
    \ 0 到 255\n\n● signed char\n分配内存：1 byte 范围：-128 到 127\n\n● unsigned char\n分配内存：1\
    \ byte 范围：0 到 255\n\n● int\n分配内存：2 to 4 bytes 范围：-32,768 到 32,767 或 -2,147,483,648\
    \ 到 2,147,483,647\n\n● short\n分配内存：2 bytes 范围：-32,768 到 32,767\n\n● unsigned short\n\
    分配内存：2 bytes 范围：0 到 65,535\n\n● unsigned int\n分配内存：2 to 4 bytes 范围：0 到 65,535\
    \ 或 0 到 4,294,967,295\n\n● long\n分配内存：4 bytes 范围：-2,147,483,648 到 2,147,483,647\n\
    \n● unsigned long\n分配内存：4 bytes 范围：0 到 4,294,967,295\n\n要获取变量数据类型的精确大小，请使用 `sizeof`\
    \ 运算符。声明 `sizeof(<type>)` 会产生该数据类型以字节为单位的大小。下面是一个说明该概念的示例：\n\n```c\n#include <limits.h>\n\
    #include <stdio.h>\nint main() {\n    printf(\"data type char size in bytes: %d\\\
    n\", sizeof(char));\n    return 0;\n}\n```\n编译并执行此代码后，你将得到以下输出：\nallocated memory\
    \ for float: 4\nPrecision: 6\nMax range value: 3.402823e+38\nMin range value:\
    \ 1.175494e-38\n\n### void 类型\n\nvoid 数据类型表示无法访问任何值。它可以在以下三种情况中使用：\n\n1. 返回类型为\
    \ `void`。\n2. 无参数的函数。\n3. 指向 `void` 的指针。\n\n要找到你系统中相关数据类型所分配的精确内存字节数，以下代码将允许你做到：\n\
    \n```c\n#include <float.h>\n#include <stdio.h>\nint main() {\n    printf(\"allocated\
    \ memory for float: %d\\n\", sizeof(float));\n    printf(\"precision: %d\\n\"\
    , float_DIG););\n    printf(\"max range value: %e\\n\", float_MAX);\n    printf(\"\
    min range value: %e\\n\", float_MIN);\n    return 0;\n}\n```\n编译并执行此代码后，你将得到以下输出：\n\
    allocated memory for float: 4\nPrecision: 6\nMax range value: 3.402823e+38\nMin\
    \ range value: 1.175494e-38\n\n### 第 3 章：运算符\n\n#### 变量\n\n变量仅仅是被分配存储区域的名称。你的程序区域能够操作此类存储区域。每个变量都与一种类型关联，该类型决定了内存中分配给变量的大小。这种类型还决定了可以应用于变量的操作种类。然而，正如你将发现的，理解在代码中使用这种数据类型的方法。\n\
    \n"
- fmt: "\nVariables, areas, examples, of, valid, variables, declarations:\n\n`int\
    \ a, b, c;` `char d, e;` `float f, g; salary;` `double h;`\n\nA variable can also\
    \ be initialized during its declaration.\n\nFor an example: `int x = 40;`\n\n\
    ### Variable initialization\n\nVariable initialization refers to the process of\
    \ assigning a value to a variable. In C#, this is done using the assignment operator\
    \ (`=`), followed by a literal value or a constant expression. Here is the general\
    \ syntax for variable initialization: `variable_name = value;`. As we have stated\
    \ earlier, variables can also be initialized during their declaration. Here are\
    \ some more examples:\n\n`int x = 1, y = 6; /* initializing x and y */`\n`byte\
    \ f = 22; /* initializes f. */`\n`double pi = 3.14159; /* declaring a variable\
    \ for an approximation of pi. */`\n`char a = 'a'; /* the variable a has the value\
    \ of 'a'. */`\n\nVariable initialization should be done correctly; otherwise,\
    \ the program may give unexpected results.\n\nFor example: using `System` namespace\
    \ variable declaration:\n\n```csharp\nusing System;\nclass myprograma\n{\n   \
    \ static void main(string[] args)\n    {\n        short x;\n        int y;\n \
    \       double z;\n        /* actual initialization of variables */\n        x\
    \ = 5; y = 10; z = x + y;\n        Console.WriteLine(\"x={0}, y={1}, z={2}\",\
    \ x, y, z);\n        Console.readline();\n    }\n}\n```\n\nThe code returns the\
    \ following:\n\nX=5, y=10, z=15\n\n### Getting a user input\n\nThe `Console` class\
    \ of the `System` namespace has a method named `ReadLine()` that allows user input.\
    \ The user's input is read and stored in a variable. The following example demonstrates\
    \ how to use this method: using `System` namespace app:\n\n```csharp\nusing System;\n\
    class myprograma\n{\n    static void main(string[] args)\n    {\n        string\
    \ firstname = \"nicholas\";\n        string lastname = \"samuel\";\n        Console.WriteLine(\"\
    your name is: \" + firstname + \" \" + lastname);\n        Console.WriteLine(\"\
    please enter a different first name:\");\n        firstname = Console.readline();\n\
    \        Console.WriteLine(\"your new name is: \" + firstname + \" \" + lastname);\n\
    \        Console.readline();\n    }\n}\n```\n\nWhen prompted to enter a new value\
    \ for the first name, your name changed.\n\n### Operators\n\nOperators are symbols\
    \ used to perform certain mathematical manipulation. C# has a variety of operators\
    \ used for performing various operations, as shown in the following example:\n\
    \n```csharp\nusing System;\nclass myprograma\n{\n    static void main(string[]\
    \ args)\n    {\n        int x = 3;\n        int y = 10;\n        int z;\n    \
    \    z = x + y;\n        Console.WriteLine(\"1:{0}\", z);\n        z = x - y;\n\
    \        Console.WriteLine(\"2:{0}\", z);\n        z = x * y;\n        Console.WriteLine(\"\
    3:{0}\", z);\n        z = x / y;\n        Console.WriteLine(\"4:{0}\", z);\n \
    \       z = x % y;\n        Console.WriteLine(\"5:{0}\", z);\n        x++;\n \
    \       Console.WriteLine(\"6:{0}\", z);\n        x--;\n        Console.WriteLine(\"\
    7:{0}\", z);\n        Console.readline();\n    }\n}\n```\n\nMost of the above\
    \ operators are well known except for a few of them. The `++` is the increment\
    \ operator, which increases the value of a variable by 1 each iteration. The `--`\
    \ is the decrement operator, which decrements the value of a variable by 1 each\
    \ iteration. The `%` is known as the modulo operator, and returns the remainder\
    \ after division.\n\nThe code returns the output shown below:\n\n![Image0106.jpg](images/Image0106.jpeg)\n\
    \n### Logical operators\n\nC# also has a number of logical operators. Let us discuss\
    \ them briefly:\n\nLogical `&&`: the condition is true if both operands are nonzero.\n\
    Logical `||`: the condition is true if any of the operands is nonzero.\nLogical\
    \ not `!`: the operator reverses the logical state of an operand. If the condition\
    \ is true, this operator will make it false.\n\nThe following example demonstrates\
    \ how to use the above operators: using `System` namespace app:\n\n```csharp\n\
    using System;\nclass myprograma\n{\n    static void main(string[] args)\n    {\n\
    \        bool x = true;\n        bool y = true;\n        if (x && y)\n       \
    \ {\n            Console.WriteLine(\"1\");\n        }\n        if (x || y)\n \
    \       {\n            Console.WriteLine(\"2\");\n        }\n        /* change\
    \ the values of x and y */\n        x = false;\n        y = true;\n        if\
    \ (x && y)\n        {\n            Console.WriteLine(\"3\");\n        }\n    \
    \    else\n        {\n            Console.WriteLine(\"3\");\n        }\n     \
    \   if (!(x && y))\n        {\n            Console.WriteLine(\"4\");\n       \
    \ }\n        Console.readline();\n    }\n}\n```\n\nThe code returns the following:\n\
    \n![Image0107.jpg](images/Image0107.jpeg)\n\n### Assignment operators\n\nC# assignment\
    \ operators are also demonstrated in the following example:\n\n```csharp\nclass\
    \ myprograma\n{\n    static void main(string[] args)\n    {\n        int x = 3;\n\
    \        int y = 10;\n        int z = x;\n        Console.WriteLine(\"1:{0}\"\
    , z);\n        z += y;\n        Console.WriteLine(\"2:{0}\", z);\n        z -=\
    \ y;\n        Console.WriteLine(\"3:{0}\", z);\n        z *= y;\n        Console.WriteLine(\"\
    4:{0}\", z);\n        z /= y;\n        Console.WriteLine(\"5:{0}\", z);\n    \
    \    z = 100;\n        z %= x;\n        Console.WriteLine(\"6:{0}\", z);\n   \
    \     z <<= 2;\n        Console.WriteLine(\"7:{0}\", z);\n        z >>= 2;\n \
    \       Console.WriteLine(\"8:{0}\", z);\n        z &= 2;\n        Console.WriteLine(\"\
    9:{0}\", z);\n        z ^= 2;\n        Console.WriteLine(\"10:{0}\", z);\n   \
    \     z |= 2;\n        Console.WriteLine(\"11:{0}\", z);\n        Console.readline();\n\
    \    }\n}\n```\n\nThe code returns the following result:\n\n![Image0108.jpg](images/Image0108.jpeg)\n\
