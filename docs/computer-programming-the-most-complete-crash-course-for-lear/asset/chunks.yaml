    \ `public`。这是因为接口的存在是为了让其他类去实现的功能。如果某个类必须实现一个接口，意味着接口成员对其他类来说是 `public` 的。接口包含声明但不包含实现。如果你尝试在接口中插入实现代码，将会出现编译错误。\n\
