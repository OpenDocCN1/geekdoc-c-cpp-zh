    ## Chapter 7: Linq, queries, operators – XML


    ### Linq


    Language Integrated Query, better known as Linq, represents a query syntax in
    C# programming language and it is used for retrieval and filtering of different
    sources of objects. Linq produces a single querying interface for various kinds
    of objects and variables. This query syntax is integrated into C# programming
    language as well as Visual Basic. For better understanding, we will provide an
    example to explain it further. Therefore, you have SQL as a structured query language;
    SQL is used to get and save some data into the database it is a language designed
    to work closely with the database.


    In the same way as SQL, Linq is used to get and filter different data sources
    like collections, etc. There are many ways to use Linq; it is used to query collections,
    XML documents, entity framework data directly, other data sources by implementing
    the queryable interface is like a bridge between some variables in the program.
    The query returns objects as result which is good because it enables the use of
    an object-oriented approach to the data when using Linq, you do not have to worry
    about converting the set of data into objects. Linq provides a way to query data
    where the data came from supports compile-time syntax checking so that if you
    make a mistake while coding Linq, the compiler will inform you immediately below
    to query a collection such as list, array, enumerable classes, etc.


    We have the examples now:


    ![Image0118.jpg](images/Image0118)


