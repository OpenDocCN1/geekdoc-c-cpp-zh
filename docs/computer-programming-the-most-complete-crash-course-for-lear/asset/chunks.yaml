    # Asp.NET - 用于全球万网的服务器端应用程序


    在本书中我们将详细介绍三个组件：通用语言运行时和类库在书中反复出现，而 .NET 在此语境下由两个组件组成——通用运行时和被称为基础框架的框架区域。


    ## 探索 .NET


    .NET 框架是解决应用程序开发中涉及的所有问题的解决方案，它不仅为开发者带来了巨大的利益，也为开发过程提供了便利。首先，.NET 允许我们与现有代码协作；我们可以使用组件，甚至在需要使用
    Windows API 的情况下也是如此。当 .NET 程序准备就绪后，在客户端计算机上安装比传统应用程序要容易得多，因为语言之间有很强的集成性。


    C# 程序员可以轻松地理解 Visual .NET 程序员的代码，而且两个程序都使用了他们最熟悉的语言。这是因为所有使用 .NET 库的语言都是互通的，因此程序用哪种语言编写并不重要，我们可以识别任何语言。接接下来，我们将会了解
    .NET 的不同组件：通用语言运行时 (CLR)、程序集和通用中间语言 (CIL)。


    ## CLR


    我们所知的 .NET 第一个组件是通用语言运行时，也称为 CLR。这是一个所有语言通用的执行程序。该程序负责读取编译器生成的代码并启动其执行。无论程序是用
    C#、Visual .NET 还是其他 .NET 语言创建的，CLR 都会读取并执行它。


    ## 程序集


    当我们有一个用 .NET 语言编写的程序并对其编译时，就会生成程序集。程序集包含了编译后的程序 CIL，以及关于程序中使用的所有类型的信息。.NET 程序不会直接编译成汇编代码；它们会被编译成一种称为
    IL 的中间语言。这种语言由运行时执行。使用 IL 提供了灵活性和多平台能力。


    .NET 框架拥有语言规范。任何想要使用 .NET 的语言都必须与它协作。这的优势之一是，带有类的代码与其他语言具有互操作性，例如，可以在 C# 中创建一个库，而
    Visual .NET 程序员可以毫无问题地使用它。编程语言中类型系统最重要的点之一是：当我们想要保存信息时，它会被存放在变量中，该变量的类型取决于要保存的信息，例如，保存整数的类型和保存短语的另一种类型。这种问题在于，每种语言存储信息的方式不同。某些语言使用
    16 位内存存储整数，而其他语言则使用 32 位；甚至像 C++ 这样的语言没有字符串短语类型。为了解决这个问题，.NET 框架定义了类型在其环境中的工作方式。任何与
    .NET 的语言都必须使用 CTS（通用类型系统）中列出的类型。现在我们了解了基本概念，就可以看到这一切是如何结合的。


    ## 如何创建 .NET 应用程序


    我们可以使用编程语言创建 .NET 应用程序。为此，我们将使用 C# 语言，通过这种语言，我们可以创建程序的源代码（告诉程序做什么的指令）。当我们完成源代码后，编译器会获取它并为我们创建一个程序集。该程序集是用
    IL 编写的，它的另一个优势是编译器可以为使用运行时的移动设备优化代码。


    .NET 框架运行在许多平台上，而不仅仅是 Windows。这意味着特定平台（如 Linux）上的程序也拥有运行时。在 Windows 中开发并在 Linux
    中执行的 .NET 程序具有相应的运行时。


    当我们想要调用程序时，运行时就会开始工作，程序集为我们创建环境。运行时开始从程序集中读取 CIL 指令，并在程序运行期间将其编译为计算机微处理器的位信息；这被称为即时编译（just-in-time
    compilation）。通过这种方式，程序在执行中推进，且对用户来说完全透明的。


