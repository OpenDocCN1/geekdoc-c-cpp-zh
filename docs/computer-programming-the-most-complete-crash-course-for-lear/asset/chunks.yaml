  trans: "\n有效变量定义的变量、区域、示例：\n\n`int a, b, c;` `char d, e;` `float f, g; salary;`\
    \ `double h;`\n\n变量也可以在声明时进行初始化。\n\n例如：`int x = 40;`\n\n### 变量初始化\n\n变量初始化是指为变量赋值值的过程。在\
    \ C# 中，这是通过赋值运算符 (`=`) 后接字面量值或常量表达式来实现。以下是变量初始化的通用语法：`variable_name = value;`。正如我们之前提到的，变量也可以在声明时初始化。这里有更多示例：\n\
    \n`int x = 1, y = 6; /* 初始化 x 和 y */`\n`byte f = 22; /* 初始化 f. */`\n`double pi\
    \ = 3.14159; /* 定义一个用于近似 pi 值的变量 */`\n`char a = 'a'; /* 变量 a 的值为 'a' */`\n\n变量初始化应该正确完成；否则程序可能会产生意外之外的结果。\n\
    \n例如：使用 `System` 命名空间的变量声明：\n\n```csharp\nusing System;\nclass myprograma\n{\n\
    \    static void main(string[] args)\n    {\n        short x;\n        int y;\n\
    \        double z;\n        /* 变量的实际初始化 */\n        x = 5; y = 10; z = x + y;\n\
    \        Console.WriteLine(\"x={0}, y={1}, z={2}\", x, y, z);\n        Console.readline();\n\
    \    }\n}\n```\n\n代码返回：\n\nX=5, y=10, z=15\n\n### 获取用户输入\n\n`System` 命名空间 `Console`\
    \ 类有一个名为 `ReadLine()` 的方法，允许用户输入。用户的输入会被读取并存储在变量中。下面的示例演示了如何使用该方法：使用 `System`\
    \ 命名空间的应用程序：\n\n```csharp\nusing System;\nclass myprograma\n{\n    static void\
    \ main(string[] args)\n    {\n        string firstname = \"nicholas\";\n     \
    \   string lastname = \"samuel\";\n        Console.WriteLine(\"your name is: \"\
    \ + firstname + \" \" + lastname);\n        Console.WriteLine(\"please enter a\
    \ different first name:\");\n        firstname = Console.readline();\n       \
    \ Console.WriteLine(\"your new name is: \" + firstname + \" \" + lastname);\n\
    \        Console.readline();\n    }\n}\n```\n\n当提示输入新的名字值时，你的名字发生了变化。\n\n### 运算符\n\
    \n运算符是用于执行某些数学操作的符号。C# 具有多种用于执行各种操作的运算符，如下所示：\n\n```csharp\nusing System;\nclass\
    \ myprograma\n{\n    static void main(string[] args)\n    {\n        int x = 3;\n\
    \        int y = 10;\n        int z;\n        z = x + y;\n        Console.WriteLine(\"\
    1:{0}\", z);\n        z = x - y;\n        Console.WriteLine(\"2:{0}\", z);\n \
    \       z = x * y;\n        Console.WriteLine(\"3:{0}\", z);\n        z = x /\
    \ y;\n        Console.WriteLine(\"4:{0}\", z);\n        z = x % y;\n        Console.WriteLine(\"\
    5:{0}\", z);\n        x++;\n        Console.WriteLine(\"6:{0}\", z);\n       \
    \ x--;\n        Console.WriteLine(\"7:{0}\", z);\n        Console.readline();\n\
    \    }\n}\n```\n\n上述大多数运算符都是广为人知的，除了少数几个之外。`++` 是递增运算符，每次迭代时将变量的值加 1。`--` 是递减运算符，每次迭代时将变量的值减\
    \ 1。`%` 被称为模运算符，返回除法后的余数。\n\n代码返回如下所示的输出：\n\n![Image0106.jpg](img/Image0106.jpeg)\n\
    \n### 逻辑运算符\n\nC# 还有许多逻辑运算符。让我们简要讨论一下：\n\n逻辑与 `&&`：当两个操作数都非零时，条件为真。\n逻辑或 `||`：当任一操作数非零时，条件为真。\n\
    逻辑非 `!`：该运算符反转操作数的逻辑状态。如果条件为真，此运算符将使其变为为假。\n\n下面的示例演示了如何使用上述运算符：使用 `System` 命名空间的应用程序：\n\
    \n```csharp\nusing System;\nclass myprograma\n{\n    static void main(string[]\
    \ args)\n    {\n        bool x = true;\n        bool y = true;\n        if (x\
    \ && y)\n        {\n            Console.WriteLine(\"1\");\n        }\n       \
    \ if (x || y)\n        {\n            Console.WriteLine(\"2\");\n        }\n \
    \       /* 修改 x 和 y 的值 */\n        x = false;\n        y = true;\n        if (x\
    \ && y)\n        {\n            Console.WriteLine(\"3\");\n        }\n       \
    \ else\n        {\n            Console.WriteLine(\"3\");\n        }\n        if\
    \ (!(x && y))\n        {\n            Console.WriteLine(\"4\");\n        }\n \
    \       Console.readline();\n    }\n}\n```\n\n代码返回：\n\n![Image0107.jpg](img/Image0107.jpeg)\n\
    \n### 赋值运算符\n\n下面的示例也演示了 C# 的赋值运算符：\n\n```csharp\nclass myprograma\n{\n    static\
    \ void main(string[] args)\n    {\n        int x = 3;\n        int y = 10;\n \
    \       int z = x;\n        Console.WriteLine(\"1:{0}\", z);\n        z += y;\n\
    \        Console.WriteLine(\"2:{0}\", z);\n        z -= y;\n        Console.WriteLine(\"\
    3:{0}\", z);\n        z *= y;\n        Console.WriteLine(\"4:{0}\", z);\n    \
    \    z /= y;\n        Console.WriteLine(\"5:{0}\", z);\n        z = 100;\n   \
    \     z %= x;\n        Console.WriteLine(\"6:{0}\", z);\n        z <<= 2;\n  \
    \      Console.WriteLine(\"7:{0}\", z);\n        z >>= 2;\n        Console.WriteLine(\"\
    8:{0}\", z);\n        z &= 2;\n        Console.WriteLine(\"9:{0}\", z);\n    \
    \    z ^= 2;\n        Console.WriteLine(\"10:{0}\", z);\n        z |= 2;\n   \
    \     Console.WriteLine(\"11:{0}\", z);\n        Console.readline();\n    }\n\
    }\n```\n\n代码返回以下结果：\n\n![Image0108.jpg](img/Image0108.jpeg)\n\n## 第 4 章：字符串和列表\n\
    \n列表\n\n"
- fmt: "\nThe `List<t>` is a collection class that is most frequently used in all\
    \ collections. It is a type whose element accessibility is by index. As mentioned\
    \ before, `List` comes under the `System.Collections.Generic` namespace. The `List`\
    \ is a class that provides a lot of methods for the `List` and element manipulation,\
    \ some of them area searching, sorting, etc. It is used for creating a collection\
    \ of many different types. It could be a collection of integers, strings, and\
    \ many more. For reference types, the `List` allows `null` value as an element.\
    \ It is also possible to insert duplicate values in a `List` collection. This\
    \ class can use both the bordering and equality comparer for arrays area similar\
    \ to the lists, but the lists can change size dynamically, but arrays cannot.\n\
    \n# String\n\n`String` is a data type that represents text and works with text\
    \ variables. It is an array of characters. Declaring a `string` data type is done\
    \ by the `string` keyword. When a `string` keyword is being used, it means that\
    \ it refers to the `String` class (explained later in the book). There are many\
    \ methods which could be used over some string variable. Some of the most popular\
    \ are `concat` which is concatenating two strings, `contains` which determines\
    \ whether the string contains a given string from the parameter passed as value,\
    \ which determines whether two strings have the same value, etc. The default string\
    \ data type is an empty string.\n\n## Chapter 5: Syntax\n\n### Loop structure\
    \ statement\n\nIn real life, we often repeat the same thing many times. For example,\
    \ when you have to scrape your eyes every round of exercises, you will repeat\
    \ the action of scraping your eyes. When playing tennis, you will repeat the swing\
    \ and so on. In C#, there is a statement that can execute the same code block\
    \ repeatedly, which is called a circular statement. Loop statements are divided\
    \ into three types: `while` loop, `do while` loop and `for` loop.\n\nThe `while`\
    \ loop is some condition judgment mentioned in the above section, which determines\
    \ whether to execute the statement in `{}` according to the condition. If the\
    \ condition is true, the statements are executed repeatedly until the loop ends.\
    \ The syntax of the `while` loop as follows:\n\n```\nwhile (condition)\n{\n  \
    \  statement\n}\n```\n\nIn the above structure, the execution statement in `{}`\
    \ is called the loop body, which depends on the condition. When the condition\
    \ is true, the body will execute. When the loop body finishes executing, it will\
    \ continue to judge the condition until the condition is false. Next, a case is\
    \ used to print natural numbers from 1 to 4, as shown in example below.\n\nExampleprogram11.cs\n\
    \n```csharp\nPublic class program11\n{\n    Public static void //this is where\
    \ you need to enter the logic\n    {\n        Int firstsample = 1;//define the\
    \ variable ‘firstsample’ with the initial value of 1\n        While(firstsample\
    \ <= 4) //cycle condition\n        {\n            Console.enteroptions(\"firstsample=\"\
    \ + firstsample);\n            //if the condition holds, print the value of firstsample.\n\
    \            Firstsample++;//firstsample for self-increment\n        }\n     \
    \   Console.readkey();\n    }\n}\n```\n\nThe running results shown on the computer\
    \ screen. For example, the initial value of `x` is 1, and if the loop condition\
    \ `x <= 4` is met, the loop will repeatedly executed, the value of `x` will be\
    \ printed, and `x` will increase automatically. Therefore, the values of `x` in\
    \ the printed results are 1, 2, 3 and 4, respectively. It is worth noting that\
    \ the code uses an example to change the value of `x` in a loop to achieve an\
    \ infinite loop.\n\nThe `do-while` statement is similar to the `while` loop. The\
    \ difference is that the `do-while` statement executes the execution statement\
    \ in `{}` before judging the condition. The syntax of the `do-while` loop follows:\n\
    \n```\ndo\n{\n    statement\n} while (condition);\n```\n"
