  \ `1` 表示字母序）。如果用户对姓名输入 `end`，则停止数据插入，程序显示列表。使用以下结构表示节点：\n\n例如，如果用户选择了字母序且列表节点为：\n\
  \n且用户输入新数据 `Melk` 和 `450`，则这三个列表节点应按此顺序排列：\n\n\n\n\n预处理器的行为由指令（directives）控制。指令是以\
  \ `#` 字符开头的特殊命令，它们用于指示预处理器执行某些操作。例如，`#include` 指令指示预处理器打开一个指定的文件，并将其内容包含到指令所在的文件中。指令可以出现在程序的任何位置。包含单个\
  \ `#` 的行是合法的，尽管它不会产生任何影响。\n\n我们之前在第 2 章中讨论过 `#define` 指令，我们可以用它来定义一个简单的宏，即一个与常量值关联的符号化名称。要定义一个简单的宏，我们写道：\n\
  \n```\n#define macro_name replacement_characters\n```\n\n`macro_name` 必须遵循与变量名相同的命名规则。`replacement_characters`\
  \ 可以任意字符序列。宏名称通常使用大写字母，以便将其与程序变量区分开来。名称的作用范围从其定义处开始直到文件结束。例如，在下面的程序中：\n\n预处理器会将\
  \ `LEN` 的每次出现处都替换为其定义值，即 `200`。一个常见的错误是在定义中添加一个 `=`。例如，如果我们写道：\n\n```\n#define LEN\
  \ = 200\n```\n\n那么 `arr` 的定义将展开为 `arr[= 200]` 并导致编译失败。另一个常见的错误是在末尾添加分号。例如：\n\n```cpp\n\
  #define LEN 200;\n```\n\n定义将展开为 `arr[200;]` 并导致编译失败。\n\n当然，不要忘记，正如我们在第 2 章中讨论过的那样，当我们想要为程序中多次使用的值设置常量时，建议将其声明为\
  \ `const`。在本节中，我将重点关注语法问题，以防你使用 `#define` 代替它，或者在现有代码中遇到它。\n\n例如，看看如果我们省略括号会发生什么：\n\
  \n像这样的条语句：\n\n```\n#define j 3.0/2*5\n```\n\n它会被展开为：`j = 3.0/2*5 = 7.5;`，这会将值 `7.5`\
  \ 赋值给 `j`而不是 `0.3`，因为除法先执行。\n\n宏可以定义在程序的任何地方，例如在函数内部。通常的做法是在程序顶部定义所有全局作用域的宏，或者在头文件中定义，并在需要时使用\
  \ `#include` 指令来包含它。例如，假设我们创建了 `test.h` 文件，其内容如下：\n\n```\n#define TEST 100\n```\n\
  \n我们可以按照如下方式编写之前的程序吗？\n\n```cpp\n#include \"test.h\"\nint main() {\n    int x =\
  \ TEST;\n    return 0;\n}\n```\n\n当然，没问题。并不是强制要求显式包含 `iostream`。我们可以包含另一个文件，就像我们在这里包含\
  \ `test.h` 一样，并在里面包含 `iostream`。\n\n如果宏名称是变量名的一部分或包含在字符串字面量中，它不会被替换。例如：\n\n```cpp\n\
  #define TEST 1\nint MYTEST = TEST;\nconst char* s = \"TEST\";\n```\n\n虽然简单宏主要用于为数字定义名称，但也可以用于其他用途。例如，在下面的程序中：\n\
  \n```cpp\n#define test \"example\"\nint main() {\n    std::cout << test << std::endl;\n\
  \    return 0;\n}\n```\n\n预处理器替换了宏 `test`，程序显示 `example`。\n\n注意，定义一个没有替换值的宏是合法的。正如我们稍后看到的，这种宏通常用于控制条件编译。例如：\n\
  \n```cpp\n#ifdef DEBUG\n```\n\n宏的名称可以用于另一个宏的定义中。例如：\n\n```cpp\n#define BASE 10\n\
  #define VALUE BASE * 2\n```\n\n如果你需要在几行中扩展一个宏（例如为了更好的可读性），请在每行的末尾添加反斜杠字符（`\\`）。例如，下面的程序显示\
  \ 60：\n\n```cpp\n#define MULTI_LINE 10 + 20 + \\\n                    30\nint main()\
  \ {\n    std::cout << MULTI_LINE << std::endl;\n    return 0;\n}\n```\n\n同样注意，某些编译器允许在程序编译时定义宏名称。例如：\n\
  \n```bash\ng++ -DVERSION=3\n```\n\n选项 `-D` 定义了值为 `3` 的 `VERSION` 宏。如果没有指定值，默认值为\
  \ `1`。这种能力非常有用，因为不需要修改文件来定义或更改一个值。\n\nC++ 提供了几个定义的预处理宏。下表列了其中一些。它们的名称包含在双下划线中。它们的主要目的是提供关于当前编译的特殊信息。\n\
  \n| 名称 |  |\n| --- | --- |\n| `__DATE__` | 它被替换为编译日期。 |\n| `__FILE__` | 它被替换为编译的文件名。\
  \ |\n| `__LINE__` | 它被替换为编译文件的行号。 |\n| `__TIME__` | 它被替换为编译时间。 |\n| `__func__` |\
  \ 它被替换为实现定义的文本，包含函数名称。 |\n\n例如，考虑下面的程序：\n\n```cpp\n#include <iostream>\nint main()\
  \ {\n    std::cout << \"File: \" << __FILE__ << \", Line: \" << __LINE__ << std::endl;\n\
  \    std::cout << \"Date: \" << __DATE__ << \", Time: \" << __TIME__ << std::endl;\n\
  \    return 0;\n}\n```\n\n当我运行程序时，输出是：\n\n```\nFile: main.cpp, Line: 4\nDate: 2023/10/27,\
  \ Time: 10:00:00\n```\n\n此输出在程序每次运行时都会显示。如果我们重新编译并运行程序，将显示新的编译日期和时间。在同一程序的多个版本中，这些信息对于区分运行版本可能有用。此外，我们还可以使用\
  \ `__LINE__` 和 `__FILE__` 宏来定位错误。例如：\n\n## assert() 宏\n\n为了诊断目的，C++ 提供了 `assert()`\
  \ 宏。它在 `cassert` 文件中声明，如下所示：\n\n```cpp\n#include <cassert>\n```\n\n如果 `exp` 为真，则什么都不显示。否则，`assert()`\
  \ 会向 `cerr` 输出错误消息并调用 `std::abort()` 函数。该函数会立即终止程序。产生的消息取决于实现，但它至少包含 `assert()`\
  \ 所在的文件名和行号。例如：\n\n```cpp\nassert(x > 0);\n```\n\n`assert()`、`if` 条件以及我们稍后看到的指令（例如\
  \ `#ifdef`）可以出于相同的原因使用，即在开发阶段检测潜在的 bug。一旦程序通过测试，这些检查应该被移除，以免增加执行时间，特别是在对时间敏感的应用中。`if`\
  \ 条件是灵活性较低的方法，因为一旦移除后程序再次失败，需要花费时间重新编写它们。使用指令（例如 `#ifdef`）则要简单得多，我们只需要定义或不定义一个宏。`assert()`\
  \ 也是一样。要禁用 `assert()`，我们只需要在包含 `cassert` 之前定义宏 `NDEBUG`。如果我们需要重新激活 `assert()`，只需删除\
  \ `NDEBUG` 的定义。例如：\n\n```cpp\n#define NDEBUG\n#include <cassert>\n```\n\n还有一点，不要在\
  \ `assert()` 内部调用会对程序产生副作用的函数。例如：\n\n```cpp\nint len = 0;\nassert(len = strlen(str)\
  \ > 0);\n```\n\n如果定义了 `NDEBUG`，`assert()` 将忽略，`strlen()` 不会被调用，`len` 也会被更新。\n\n\
  `assert()` 的表达式是在运行时检查的。\n\nC++11 提供了静态断言的功能，使用 `static_assert(exp, msg)` 语句。现在，条件是在编译时静态检查的。特别是，`exp`\
  \ 必须产生一个可以转换为 `bool` 的结果。例如，`static_assert()` 无法检查 `vector` 对象的 `size()`。如果 `exp`\
  \ 为假，编译失败并在屏幕上显示 `msg`。如果为真，则什么都不做。例如：\n\n```cpp\nstatic_assert(sizeof(int) == 4\n\
  ```\n\n如果 `int` 类型的大小不是 4 字节，编译失败并将相应的消息显示在屏幕上。从 C++17 开始，`msg` 参数是可选的。例如：`static_assert(sizeof(int)\
  \ == 4);` 在那种情况下，诊断消息取决于平台。`static_assert` 的一个重要用途是在泛型编程中对参数使用的类型进行断言。\n\n在继续之前，你能找到下面程序中的错误吗？\n\
  \n```cpp\n#define LEN 20\nint main() {\n    int arr[LEN20];\n    if (test;\n   \
  \ else\n```\n\n因为 `LEN` 和 `20` 之间没有空格，编译器将产生未定义变量 `LEN20` 的错误消息。第二个编译错误由于 `test`\
  \  末尾的分号引起。当 `test` 被替换时，第二个分号导致 `else` 不能与 `if` 语句关联。\n\n## 带参数的宏\n\n除了简单形式，宏还可以带参数并像函数一样工作。例如，在下面的程序中：\n\
  \n```cpp\n#define MIN(a, b) ((a) < (b) ? (a) : (b))\n```\n\n`MIN` 宏接收两个参数。\n\n\n\
  \n由于宏可以接受任何数据类型的参数，因此它可以比函数更具通用性。例如，我们可以使用同一个 `MIN` 宏来寻找 `int`、`char`、`double`……以及其他数据类型的最小值。此外，使用参数化宏而不是执行相同任务的函数可能会提高性能，因为函数调用会由于存储上下文信息（例如函数的内存地址）和拷贝参数而产生一些运行时开销。另一方面，宏的调用不会产生任何延迟，因为预处理器在编译时已经对其进行了展开，并将其代码添加到程序中。然而，通用的规则是不使用此类宏，因为正如你将在下文中看到的，它们的使用有许多缺点并伴随着风险。\n\
  \n例如，如果我们写了如下代码：\n\n```cpp\n#define MIN(a, b) (a < b ? a : b)\n```\n\n编译将会失败，因为预处理器会从第一个左括号开始替换\
  \ `MIN`。\n\n例如，假设我们在宏定义中省略了圆括号：\n\n```cpp\n#define MIN(a, b) a < b ? a : b\n```\n\
  \n在语句 `i = 3*MIN(4, 10);` 中，`i` 的输出结果是多少？\n\n当宏展开时，由于乘法先执行，比较的值将是 12 和 10，而不是 4\
  \ 和 10。结果是 `i` 变成了 10。\n\n现在看看如果我们省略参数周围的圆括号会发生什么：\n\n```cpp\n#define MIN(a, b)\
  \ a < b ? a : b\n```\n\n像这样的语句：\n\n```cpp\nj = 100 /MIN(i++, j);\n```\n\n`j` 变成了\
  \ 19 而不是 100，因为乘法先执行了。\n\n例如，语句 `int x = MIN(i++, j);` 被展开为：\n\n```cpp\nint x =\
  \ i++ < j ? i++ : j;\n```\n\n结果是，如果 `i` 小于 `j`，`i` 将增加两次，并给 `x` 赋错误的值。\n\n除了语法问题和潜在的陷阱外，使用宏代替函数有显著的缺点。例如，由于宏依赖于文本替换，当宏包含复杂代码（如控制流结构）时，你可能会遇到严重的麻烦。不用说，阅读、维护和调试包含多个语句的宏要困难得多。宏不能被重载，也不能递归。由于宏在预处理期间被移除，因此无法声明一个指向宏的指针。此外，当调用函数时，编译器会检查参数的类型。如果参数的类型错误且编译器无法将其转换为正确的类型，它会产生错误信息。另一方面，预处理器不检查宏参数的类型，因此可能会传递不理想的值。\n\
  \nC++ 提供了更好、更安全的机制来替代此类宏，例如 `inline` 内联和函数模板，我们将在第 16 章 {\n    return a < b ? a\
  \ : b;\n}\n```\n\n这种定义不仅提供了与相应宏类似的灵活性，还通过在调用函数时检查传递的参数确保了安全性。\n\n## # 和 ## 预处理器运算符\n\
  \n宏参数前面的 `#` 运算符指示预处理器创建一个带有该参数命名的字符串字面量。例如：\n\n```cpp\n#define f(s) #s text\n```\n\
  \n当预处理器展开 `f` 宏时，它会将 `#s` 替换为参数的名字，即 `str`。因此，程序显示：`str = text`\n\n`##` 运算符用于将标识符合并在一起。它不允许出现在序列的开头或结尾。如果标识符是宏参数，预处理器首先将其替换为参数的值，然后进行粘贴。例如：\n\
  \n```cpp\n#define f(n) sum##n(i, j)\n```\n\n当预处理器展开 `f` 宏时，由于字符 `a` 与参数名相同，预处理器将\
  \ `a` 替换为参数的值（即 1），然后将该值与 `s`、`u`、`m` 字符合并。因此，`f(1)(i, j)` 被展开为 `sum1(i, j)`，程序使用\
  \ `sum1()` 显示两个输入数字之和。\n\n## 预处理器指令与条件编译\n\n本节讨论了允许对程序部分进行条件编译的预处理器指令。条件编译在许多情况下都非常有用，例如在调试程序时、监控程序执行情况或维护同一个程序的多个版本时。\n\
  \n### #if, #else, #elif, 和 #endif 指令\n\n#if 和 #endif 指令用于根据表达式的值来定义程序的哪些部分将被编译。通用语法为：\n\
  \n```cpp\n#if expression\n    ...\n#endif\n```\n\n表达式是一个常量整数表达式，不允许包含 `sizeof`、强制类型转换或\
  \ `enum` 常量。如果其值为真，预处理器将保留要编译的语句块。如果不是，该语句块将被移除，编译器将无法看到它。注意，如果表达式是一个未定义的标识符，#if\
  \ 指令将求值为假。\n\n\n\n当遇到第一个包含 `test.h` 的指令时，预处理器将包含 `test.h` 的内容，因为此时 `SOME_TAG` 宏尚未定义。当预处理器遇到另一个包含\
  \ `test.h` 的包含指令（例如来自 `two.h` 的包含）时，它将不再再次包含其内容，因为 `SOME_TAG` 已经定义，且 `#ifndef` 的求值为假。虽然你可以\
  \ own 使用任何名称（例如 `SOME_TAG`），但通常的做法是选择一个与头文件名类似的名称，并增加一些字符以避免命名冲突（例如 `test_file_h`）。\n\
  \n我们可以使用 `#ifndef` 不仅是为了避免多次包含并节省某些编译时间，还为了另一个原因。如果 `test.h` 包含一个类型定义（例如结构体），编译将失败，因为不允许重复定义相同的类型。例如，假设\
  \ `test.h` 包含以下类型：\n\n并且 `two.h` 包含了 `test.h`。如果缺少 `#ifndef`，当编译 `test.cpp` 时，`st`\
  \ 的定义会被包含两次，导致编译错误。事实上，这违反了*单一定义规则*（*ODR*），该规则禁止在同一个编译单元中重复定义实体。这种 `#ifndef` - `#define`\
  \ - `#endif` 指令的组合被称为 `#include` 保护（guard）。通常情况下，头文件应该使用这种保护来避免可能违反 ODR 的风险。\n\n\
  此外，使用 `#ifndef` 可以防止无限包含。例如，如果一个文件（例如 `one.h`）包含了另一个文件（例如 `sec.h`），而后者又包含了前者，就会发生这种情况。\n\
  \n`#undef` 指令取消宏的定义。如果该宏未被定义，`#undef` 则不起作用。例如：\n\n由于指令 `#undef NUM` 取消了 `NUM` 的定义，编译器将在\
  \ `cout` 中产生一条错误信息。\n\n## 定义的运算符\n\n检查标识符是否被定义为宏的另一种方法是使用 `defined` 运算符。`defined`\
  \ 运算符与 `#if` 或 `#elif` 指令一起使用。如果标识符已定义，结果为真，否则为假。例如：\n\n括号并不是必须的，这取决于个人喜好。同样，表达式：`#if!\
  \ defined(VER_1)` 等同于 `#ifndef VER_1`。与 `#ifdef` 和 `#ifndef` 相比，它的优势在于可以用于检查是否只定义了一个宏，而\
  \ `defined` 运算符和 `#if` 指令可以用于检查多个宏。看我们如何使用 `&&` 运算符来检查多个条件：\n\n或使用 `||` 运算符检查宏是否已定义：\n\
  \n正如我们在示例 C.15.11 中做的那样，我们可以改为使用 `defined` 运算符。假设我们正在编写一个依赖外部因素的程序，例如操作系统或编译器。与其编写不同的版本，我们可以使用条件编译。例如：\n\
  \n## #pragma 指令\n\n大多数编译器都提供 `#pragma` 指令。`#pragma` 指令用于请求编译器的特殊行为。`#pragma` 指令中出现的命令集在每个编译器中都是不同的。如果不支持该命令，编译器将忽略该指令。例如，如果编译器支持\
  \ `warning` 命令，可以使用 `#pragma warning(disable: 4018)` 来禁用代码 4018 对应的警告信息的出现。\n\n\
  在另一个示例中，如果编译器支持 `#pragma once` 指令，我们可以将其添加到头文件的开头，以防止内容重复。然而，由于 `#pragma` 不是标准 C++，最好使用我们之前看到的\
  \ `#ifndef` 指令来防止多次包含。\n\n## 练习\n\nC.15.1 假设 `test.h` 包含以下类型：\n\n```cpp\nstruct\
