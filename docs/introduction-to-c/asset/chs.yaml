  \n每个参数的类型必须指定，即使有几个参数具有相同类型也是如此。例如，写以下内容是不合法的：\n\n## 函数定义\n\n函数定义包含了函数的代码。函数定义的通用形式如下：\n\
  \n函数定义不允许拆分在不同的文件中。此外，每个函数必须有唯一的定义。如果使用了库函数，则该函数已经被定义并编译过了。第一行必须与函数声明一致，但不需要完全相同。例如，参数的名称不需要与函数声明中给出的名称相同。此外，注意末尾没有添加分号。代码（或者函数体）是两个大括号之间的所有内容。函数体可以是空的。函数体只有在函数被调用时才会执行。如果调用了退出语句（例如\
  \ `return`）或执行了最后一条语句，函数的执行将终止。让我们来看一个使用函数的示例：\n\n正如后文将解释的，程序输出 In。\n\n正如我们所说，函数声明和函数定义通常放在不同的文件中。例如，我们可以创建一个文件（例如\
  \ `prototype.h`），将声明复制进去，从源文件中删除该声明，并包含 `prototype.h`。按照惯例，我们自己的头文件使用的典型扩展名是 `.h`。正如第\
  \ 1 章 中讨论，我们将头文件包含在双引号 `\"\"` 中。\n\n注意，函数可以只声明而不定义。如果程序中没有调用该函数，程序将能够正常编译，但如果调用了它，则会显示未未声明函数的错误信息。因此，在程序的设计阶段，我们可以添加函数声明来提醒我们需要完成的工作，并在开发阶段逐渐添加定义。\n\
  \n虽然 C++并不要求将函数定义放在 `main()` 之后，但这是我的偏好，这样读者可以先阅读 `main()`（程序的核心）以获取其结构的大致，然后继续查看其他函数。如果定义在第一次调用之前出现，那么省略函数的声明是安全的。例如：\n\
  \n虽然我们的程序很短，我们可以在 `main()` 之前定义函数，但这种做法并不总是适用。例如，在大型应用程序中，代码被拆分成多个文件，我们在一个文件中想要调用的函数可能定义在另一个文件中。在这种情况下，原型（prototype）的存在是强制性的，以便编译器知道如何调用此函数。此外，如果有许多函数，将它们按正确顺序排列以确保每个函数在被另一个函数调用之前都被定义的任务需要耗费精力，或者可能是不可能的。此外，原型的存在允许阅读它们的人对其功能有一个概览。这些理由足够让我们始终使用原型。\n\
  \n函数不允许定义在另一个函数内部。然而，函数的声明可以放在调用函数的体内部。例如：\n\n然而，由于 `test()` 的声明仅在 `main()` 内部可见，因此在任何其他需要调用\
  \ `test()` 的函数中都应该对其进行声明。而且，如果未来必须更改声明，程序员应该搜索并修改所有的声明。为了避免这种情况，不要在函数内部声明函数。\n\n\
  通常情况下，一个 C++ 程序由许多文件组成。如果我们想在一个文件中使用在另一个文件中定义的函数，我们只需要添加它的声明。例如：\n\n然而，通常的做法是将函数声明放置在头文件中，并在任何需要它的文件中通过\
  \ `#include` 指令包含它。这样，如果我们必须更改函数的声明，我们只需要在头文件中进行更改，而不需要在使用它的文件中进行更改。通常来说，一个头文件被包含在许多源文件中。这意味着头文件应该只包含允许在其他文件中重复的声明（例如，数值常量、函数/结构体/类声明等）。\n\
  \n单独编译与其包含的头文件一起编译的源文件被称为*翻译单元*（translation unit）。程序中使用的每个函数的声明在每个使用它的翻译单元中必须是相同的。正如我们所说，这可以通过将声明放在头文件中并在任何需要的地方包含该文件来确保。此外，每个函数只能被定义一次。如果违反了这两条规则中的任何一条，链接器将产生错误。例如，在\
  \ C.11.1 程序中，如果我们删除了 `test()` 的定义，链接器将显示 `test()` 未定义引用的错误，因为没有定义 `test()` 到底是什么。如果我们添加另一个\
  \ `test()` 的定义，则会显示 `test()` 重定义的错误。函数声明和函数定义之间的区别允许将程序拆分为可以独立编译的部分。声明允许程序的一部分（例如头文件）维护对其他部分的视图，而无需扰于其他部分（例如源文件）中的定义。\n\
  \n正如提到的，函数的主要目的是将程序的功能分解成更小的部分，以便更易地编写、阅读和维护。因此，你的函数尺寸应该较小（例如最多 50 行），以便读者能快速理解它们的用途和运行方式。在这方面，一个函数应该执行单一的逻辑操作。\n\
  \n此外，为了程序的正常运行和维护，尽可能地避免*代码重复*（code duplication）是非常重要的。重复编写相同的代码不仅浪费时间，而且会带来风险。例如，如果相同的代码片段在多处重复，并且你决定更改其中一个（例如修复错误），你必须记住在每个相同片段的每个副本中进行相同的更改。即使是你自己复制了代码，也很容易忘记进行所有的调整。更糟糕的是如果是一个完全不知道代码重复的人来操作；错误可能在某处被修复了，但在另一个地方仍然存在。如果每个逻辑都存在于单一位置，我们就可以避免这种不一致性并确保安全。函数就是一种机制，可以封装共同部分并保护我们免受危险情况。\n\
  \n## 复杂的声明\n\n\n\n\n既然我们已经学习了如何定义函数，让我们来一个括号，用来描述一种解析复杂声明的方法。始终从从内向外解析声明。找到变量名，如果它被包含在括号\
  \ `()` 中，就从那里开始解析。然后，继续处理下一个操作符，其优先级顺序从高到低依次为：\n\n1. 后置操作符。括号 `()` 表示函数，中括号 `[]`\
  \ 表示数组。\n2. 前缀操作符 `*` 表示“指向”。\n\n例如，考虑以下声明：`int *p[5];`。\n\n让我们应用这些优先级规则。变量 `p`\
  \ 没有被包含在括号中。因为 `[]` 的优先级高于 `*`，所以我们向右看，得到 `p` 是“一个包含五个元素的数组……”，然后向左看是 `*`，得到“一个包含五个指针的数组……”，最后加上类型，得到“一个指向整数的指针数组”。\n\
  \n再看另一个例子：`int (*p)[5];`。\n\n现在，`p` 被包含在括号中。解析从内部开始，所以我们向左看是 `*`，得到 `p` 是“一个指向……的指针”，然后向右看，得到\
  \ `p` 是“一个指向包含五个元素的数组的指针……”，然后向左加上类型，得到“一个指向包含五个整数数组的指针”。顺便一下，这里有一个初始化该类型指针的示例。假设数组\
  \ `arr` 声明为 `int arr[5];`。为了初始化 `p`，我们写 `p = &arr;` 或者与声明一起写 `int (*p)[5] = &arr;`。\n\
  \n另一个复杂的声明：`int *(*p)(int);`。\n\n与之前一样，我们开始认为 `p` 是“一个指向……的指针”，`()` 的优先级高于 `*`，所以我们向右看，得到“一个指向带有整数参数的函数的指针……”，然后向左加上返回类型，得到“一个指向返回指针的带有整数参数的函数的指针”。\n\
  \n把最好的留到最后：`int *(*p[5])(int*);`。\n\n与之前一样，我们开始解析括号内的 `p`。`p` 是“……”，因为 `[]` 的优先级高于\
  \ `*`，我们向右看得到“一个包含五个元素的数组……”，然后向左看是 `*`，得到“一个包含五个指针的数组……”，然后因为 `()` 的优先级高于 `*`，向右看得到“一个包含五个指针的函数数组，其参数是指向整数的指针……”，然后向左加上返回类型，最终得到“一个返回指针的、参数为指向整数指针的函数指针数组”。\n\
  \n如此反复左右的跳跃让我们感到有点头晕，请记住，**永远不要酒后驾**。并且始终系好安全带或戴好头盔。此外，不要边跑或边打电话。为了你，也为了他人，请安全驾驶。\n\
  \n## return 语句\n\n`return` 语句用于立即终止函数的执行。函数可以包含我们任意数量的 `return` 语句。在目前为止的一些程序中，我们使用\
  \ `return` 语句来终止 `main()` 函数，即在满足条件时终止程序本身。例如，下面的程序如果用户输入 2，则会终止，否则将输出输入值：\n\n注意，最后一个\
  \ `return` 永远不会被执行，因为第一个 `return` 会终止程序。`main()` 返回的值表示程序的终止状态。值 `0` 表示正常终止，而非零值通常表示异常终止。\n\
  \n如果函数不返回任何内容，只需写 `return`。同样，在这种情况下，函数末尾的 `return` 语句是不必要的，因为函数会自动返回。在下面的示例中，`f()`\
  \ 函数比较两个参数的值，如果它们不同，则显示它们的平均值。如果它们相同，函数终止。\n\n如果函数声明为返回一个值，则每个 `return` 语句后面应该跟着一个值。正如我们稍将看到的，执行的\
  \ `return` 的值将返回到调用函数的地方。调用函数可以自由地使用或丢弃返回值。例如，我修改了 `f()` 以返回一个整数值：\n\n注意，我们允许省略函数末尾的第二个\
  \ `return` 语句。在这种情况下，编译器可能会发出一条警告信息，如 *'f': 并非所有控制路径都返回了值* 或 *控制到达非空函数的末尾*。标准规定，从有返回值的函数中退出（`main()`\
  \ 除外）时不带 `return` 语句会导致未定义行为。函数将返回一个未定义的值，这是不理想的，而且如果调用函数使用了该返回值，无疑是非常危险的。因此，我们必须非常小心，确保非空函数通过所有返回路径始终返回一个值，否则可能会出现意想不到的问题。\n\
  \n返回值的类型应与函数的返回类型匹配。如果不匹配，编译器将尽可能将返回值转换为返回类型。例如：\n\n由于 `test()` 被声明为返回 `int` 值，因此返回的值被隐式转换为\
  \ `int`。因此，函数返回 `4`。\n\n## 函数调用\n\n函数可以根据需要被调用多次。当函数被调用时，程序的执行将通过函数代码的执行继续。特别是，编译器会分配内存来存储函数的参数以及在其体内声明的变量。通常，这部分内存来自内存的一个特定区域，称为*栈*；然而，这并不适用于所有情况。例如，参数通常在寄存器中传递以便快速访问。为了简单起见，我们假设分配在栈中。此外，当函数终止时，分配的内存会自动释放。关于函数调用时内存中执行的操作的详细讨论超出了本书的范围。\n\
  \n### 无参数函数调用\n\n对不接受参数的函数的调用通过在函数名后加上空括号 `()` 来实现。调用函数不向被调用函数传递任何数据。在下面的程序中，调用函数（即\
  \ `main()`）调用了两次 `test()` 函数：\n\n在第一次调用 `test()` 时，程序继续执行函数体。当 `test()` 终止时，程序返回调用点并继续执行下一条语句。因此，`main`\
  \ 程序显示 `Call_2` 并再次调用 `test()`。结果程序显示：`Call_1 In In Call_2 In In`。\n\n例如，如果你写 `test`，程序将编译，但函数不会被调用。回顾第\
  \ 8 章，编译器将函数名视为指针；因此允许该语句。然而，该语句没有效果；它计算函数的地址但没有调用它。编译器可能会发出如 *函数调用缺少参数列表* 或 *无效果语句*\
  \ 的警告信息以提醒程序员。在下面的程序中，`test()` 返回一个整数值。\n\n`test()` 声明了两个值为 10 和 20 的整数变量，并返回它们的和。该值被存储在\
  \ `sum` 中，程序显示 `30`。注意不需要声明 `sum`；我们可以写 `cout << test();`，`test()` 先被调用，然后 `cout`\
  \ 输出返回值。\n\n在结束本节之前，我想指出，在复合表达式中的函数调用的顺序例如：\n\n```\nd = a()+ b()* c();\n```\n\n\n\
  \n未定义（undefined）。这意味着这三个函数可以以任何顺序调用。不要假设 `b()` 和 `c()` 函数会因为乘法的优先级而先被调用。而且，请注意，如果其中任何一个改变了另一个函数中某个变量可能依赖的变量值，那么赋值给\
  \ `d` 的值可能取决于求值顺序。\n\n### 带参数的函数调用\n\n对带参数的函数的调用是通过编写函数名后跟一个括在括号内的参数列表来实现的。使用参数是向函数传递信息的一种方式。通常，函数需要参数来完成任务。`parameter`（参数）和\
  \ `argument`（参数）的区别在于：`parameter` 一词指的是函数定义中出现的变量，而 `argument` 一词指的是出现在函数调用中的表达式。例如，考虑以下程序：\n\
  \n参数可以是任何有效表达式，例如常量、变量、数学表达式或逻辑表达式，甚至是带有返回值的另一个函数。注意，我们可以省略 `sum` 并编写：`cout << test(a,\
  \ b);`。首先调用 `test()`，然后由 `cout` 输出返回值。\n\n参数的数量及其类型应与函数声明匹配。如果参数较少，编译器将产生错误信息。如果参数的类型与参数的类型不匹配，编译器将尝试将不匹配参数的类型隐含转换为对应参数的类型。例如，如果不匹配的类型是算术类型，编译器将应用我们在第\
  \ 2 章中看到的算术转换。如果编译器成功完成转换，可能会显示一条警告信息以告知程序员类型转换。例如，如果应用了窄转换（例如 `double` 转换为 `int`），编译器极可能会发出警告。如果无法转换，编译器将产生错误信息。让我们来看一些例子：\n\
  \n回到程序。当它执行时，编译器分配 8 个字节来存储 `a` 和 `b` 的值。当调用 `test()` 时，编译器再次分配 8 个字节来存储 `x` 和 `y`\
  \ 的值。然后，评估参数的值并将其一对地赋值给参数 `x` 和 `y` 对应的内存位置。注意，编译器可以按任何顺序评估参数值。本质上，每个函数参数都是在函数调用时创建的变量。初始化值是对应参数的值。因此，`x`\
  \ 变为 10，`y` 变为 20。当 `test()` 终止时，为 `x` 和 `y` 分配的内存会自动释放。\n\n由于 `x` 和 `y` 的内存位置与\
  \ `a` 和 `b` 不同，`x` 和 `y` 值的任何改变对 `a` 和 `b` 的值都没有影响。这种传递值的方法被称为`值传递`（call by value）。换句话说，被调用函数始终接收原始变量副本的参数值。它不能修改用作参数的变量；只能修改其副本的值。关于性能，值传递的代价是复制传递的参数所需的内存和时间开销。\n\
  \n正如我们之后将看到的，数组是该规则的例外。当数组传递给函数时，不会创建数组的副本。实际传递的是它的第一个元素的地址。函数可以访问并修改数组的任何元素。\n\n\
  ### 修改原始值\n\n如果我们希望函数能够修改原始变量的值，我们应该传递它的地址而不是它的值，如之前那样。我们如何获取地址？你知道的，通过使用指针。让我们来看一个例子：\n\
  \n由于 `&i` 的类型是 `int` 指针，`test()` 的调用匹配声明。当调用 `test()` 时，我们拥有 `p = &i`。由于 `p` 指向\
  \ `i`，`test()` 可能会改变 `i` 的值。特别是，`p` 是 `i` 的别名，语句 `*p = 30;` 将 `i` 从 10 改为 30。如所示，当调用函数时，允许混合使用指针和普通值。`j`\
  \ 的值没有改变，程序输出 30 和 20。\n\n关于性能，传递小值（例如 `int`）时，值传递是可以的，但传递大型实体（例如包含数千个元素的 `vector`）时，传递地址并避免复制数据要高效得多。在第\
  \ 16 章中，我们将看到通过引用传递地址的另一种方法。如果我们只想使用参数的值并防止任何更改呢？你知道答案；我们让指针变为 `const`。\n\n最后一个示例，用于测试你到为止所学到的知识。以下程序的输出是什么？不要急着看下一页的答案。简单，不要犯错。\n\
  \n简单，谁说这简单？你回答了 100，不是吗？听听*Green Day*的歌曲*Basket Case*，大声播放。让我们来看看陷阱在哪里。\n\n由于 `test()`\
  \ 接受 `ptr` 的值作为参数而不是它的地址，它不能改变它的值。因此，`arg` 值的任何改变都不会影响 `ptr` 的值，程序显示 30。稍后我们将讨论\
  \ `var` 的作用域。\n\n函数如何改变指针的值？我们只需向函数传递指针的地址，即类型为指向指针的参数。例如：\n\n由于 `ptr` 的内存地址被传递给\
  \ `test()`，`test()` 可能会改变它的值。当调用 `test()` 时，我们拥有 `arg = &ptr`。由于 `arg` 指向 `ptr`，`*arg\
  \ = 100;` 将 `ptr` 的值改为 100。因此，语句 `*arg = &var;` 等于 `ptr = &var;`，这意味着 `ptr` 改变并指向\
  \ `var` 的地址。因此，程序显示 100。\n\n我理解你可能觉得这个例子有点困难。但是由于你很可能需要读写更改指针值的代码，所以我把它加在这里是为了方便查找和查阅。理论到此为止，让我们来做练习。\n\
  \n## 练习\n\nC.11.1 编写两个函数，分别接受一个整数参数并返回该数的平方和立方。限制是第二个函数的函数体由单个语句组成并调用第一个函数。编写一个程序读取一个整数并使用这些函数显示平方和立方的和。\n\
  \nC.11.2 以下程序的输出是什么？\n\n**答案：** 当调用 `test()` 时，我们拥有 `p1 = &i` 和 `p2 = &j`。语句 `p1\
  \ = &m` 和 `*p1 = 100;` 使 `m` 等于 100。由于 `p2` 指向 `j` 的地址，`*p2` 是 20。因此，语句 `*p2 +=\
  \ m;` 使 `j` 等于 20+100=120。由于 `tmp` 指向 `i` 的地址，语句 `p2 = tmp;` 等于 `p2 = &i`。因此，语句\
  \ `*p2 = 100;` 将 `i` 的值改为 100。结果是程序输出：100 120。\n\nC.11.3 编写一个函数，接受一个整数和一个字符作为参数，并根据整数的值显示相应字符。此外，函数应使用\
  \ `switch` 语句，如果字符是'a'、'b'或'c'则返回原字符，否则返回 ASCII 集合中的下一个字符。编写一个程序读取一个整数和一个字符，调用该函数并显示返回值。\n\
  \nC.11.4 编写一个函数，接受三个浮点数作为参数并显示它们的最小值。此外，函数应返回处于[1, 2]范围内的数字的平均值。如果没有一个数字在[1, 2]范围内，则应返回-1。编写一个程序读取三个浮点数，调用该函数并显示返回值。\n\
  \nC.11.5 以下程序的输出是什么？\n\n\n\n\n\n**答案：** 每次调用 `f()` 时，它都会返回其参数加 1 后的值。调用是从内向外执行的。因此，由于第一次调用返回\
  \ 12，第二次调用的参数为 24。由于第二次调用返回 25，第三次调用的参数为 -22。因此，程序显示为 -21。\n\nC.11.6 编写 `power(double\
  \ a, int b)` 函数，返回 `a^b` 的结果。编写一个程序，读取一个浮点数（例如 `a`）和一个整数（例如 `b`），并使用该函数显示 `a^b`\
  \ 的结果。\n\n**注释：** 注意，该程序没有检查极端情况，例如溢出情况或使用更高效的算法。例如，与其执行 `exp` 次循环，我们可以检查 `exp`\
  \ 是否为偶数，如果是偶数，则执行 `exp/2` 次循环，然后对结果进行平方；如果是奇数，则将结果再乘以 `a`。例如，如果 `exp` 是 8，则循环执行\
  \ 4 次（`a⁴`）²。为了相同的目的，C++ 标准库提供了 `pow()` 函数。\n\nC.11.7 编写一个函数，接受一个整数参数（例如 `n`）并返回结果：`1³\
  \ + 2³ + 3³ + ... + n³`。编写一个程序，读取一个正整数（假设用户输入有效值），并使用该函数显示该表达式结果的平方根。验证输出值是否等于 `n*(n+1)/2`。对于平方根，编写另一个函数，使用牛顿法来找到参数的根（例如\
  \ `n`）。该方法使用一个用于平方根的初始猜测值 `r[1]`（例如 `n/2`），并根据 `r[k+1] = 0.5*(r[k] + n/r[k])` 计算值序列。如果新值\
  \ `r[k+1]` 与旧值 `r[k]` 之间的绝对差小于某个容差（例如 `0.0001`），则函数应返回 `r[k+1]` 的值作为根。对于差，请使用库函数\
  \ `fabs()`。\n\nC.11.8 编写一个 `void` 函数，以二次方程的系数作为参数，并返回它的实根（如果有的话）。编写一个程序读取系数（例如 `a`、`b`\
