  \ < 0.3 + 0.001`，其中 0.001 是一个足够的数字，大于预期的舍入误差且小于 0.1 的增量。\n\n### 省略表达式\n\n`for` 语句的三个表达式都是可选的。事实上，我们可以省略其中的任何一个或全部。例如，在以下代码中，因为\
