  \ `*ptr = 0;` 等于 `arr[0][4] = 0;`。由于每行包含五个元素，`arr[0]+4` 之后的地址并不对应数组元素。对吧？\n\n你不这么认为，看看为什么。当\
  \ `ptr` 增加时，由于数组元素存储在连续的内存位置，`ptr` 将指向下一行的第一个元素。换句话说，`arr[0]+5` 的地址与 `arr[1][0]`\
  \ 相同。同理，`arr[0]+6` 的地址与 `arr[1][1]` 相同。因此，这段代码将第一行的最后一个元素以及下一行的前两个元素的值置零。\n\n###\
