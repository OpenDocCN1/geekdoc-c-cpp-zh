  \ 对象并将并将 20 作为参数传递。然后，临时对象的成员（在我们的示例中只有 `a`）被拷贝到 `t` 中。因此，程序显示 20。\n\n当将整数值传递给接受\
  \ `T` 对象的函数时，也会发生隐式转换。例如：\n\n`f()` 显示值 20。当一个声明为返回 `T` 对象的函数返回整数值时，也会发生隐式转换。例如：\n\
  \n如果我们不希望构造函数充当转换函数，我们可以在声明前加上 `explicit` 关键字。例如：\n\n现在，如果我们写 `t = 20`，编译器将显示错误信息。但是，允许使用显式类型转换进行转换。例如：\n\
  \n注意，如果构造函数被声明为 `explicit` 并在类外定义，则在定义中不会添加 `explicit` 单词。例如：\n\n让我们来看一个例子，构造函数的参数是字符串：\n\
  \n通过语句 `t = s;`，调用构造函数创建一个以 `s` 的值（即文本）为参数的临时对象。然后，文本被拷贝到 `t` 的成员 `str` 中，程序显示文本。\n\
  \n你可能会想，这些隐含的转换（例如 `t = s`）是否会让代码更难理解？是的，我同意。我的倾向是明确临时对象的创建，而不是使用构造函数来转换类型。即，我倾向于写成：\n\
  \n隐式转换是安全的吗？不，它们不稳定；由于它们的自动性质，意外的赋值可能会导致意外的转换并引入改变程序的 Bug。让我们来看这样一个例子：\n\n程序员的意图是更改数组中的元素值。例如，假设你想让第一个成绩等于\
  \ 2。你没有写 `s[0] = 2;`（这将调用 `operator[]` 函数来更改 `grd[0]`），而是犯了错误写成 `s = 2;`。然而，通过此语句，编译器使用\
  \ `Student(int)` 构造函数并将 2 转换为临时对象，然后拷贝到 `s`。因此，`s.name` 的值从 first 变为 none，并且 `grd`\
  \ 数组的所有元素都变成了 2。\n\n如果我们构造函数声明为 `explicit`，即写 `explicit Student(int)`；编译器将不允许这种转换并产生错误信息告知程序员。不，到目前为止还没有犯过这样的错误。但因为任何事情总有第一次，我倾向于将接受单个参数的构造函数声明为\
  \ `explicit`，以保护自己免受导致难以追踪 Bug 的意外隐式转换。事实上，我希望标准默认将单参数构造函数设置为 `explicit`。\n\n###\
  \ 从类类型的转换\n\n正如类型可以转换为对象一样，对象（例如 `t`）也可以转换为类型。例如：\n\n如果在类中定义了如下转换函数，则该语句是被允许的\n\n\
  其中 `type` 是对象将转换的类型名称。如果缺少此定义，编译器将发出错误信息，因为无法将 `T` 对象赋值给 `int`。\n\n\n\n\n\n在声明转换函数时，适用某些规则。例如，转换函数必须是类的成员函数，在它的声明中不指定返回类型，且不接受任何参数。返回类型是目标类型的类型。例如，转换为\
  \ `int` 的函数原型为：\n\n```cpp\noperator int();\n```\n\n此外，当声明转换函数时，允许显式转换。例如：\n\n```cpp\n\
  (int)t;\n```\n\n通常，转换函数不会改变相应对象的状态，因此被声明为 `const`。让我们来看一个定义了两个转换函数的示例：\n\n```cpp\n\
  class T {\npublic:\n    operator int() const;\n    operator double() const;\n};\n\
  ```\n\n可能看起来很奇怪，但你可以发现转换函数的声明中没有返回类型。返回类型就是目标类型。也就是说，`operator int` 返回 `int`。通过语句\
  \ `i = t;`，调用了 `int` 转换函数，`i` 变为 5。通过语句 `k = t;`，调用了 `double` 转换函数，`k` 变为 3.2。同样，通过显式的\
  \ `static_cast<>` 转换，再次调用了相应的转换函数。注意，如果我们不使用显式转换并编写 `cout << t;`，编译器将显示错误信息，因为它不知道应该使用\
  \ `int` 还是 `double` 转换函数。\n\n这里有人可能会问，这些隐式自动转换不会让代码更难理解且不安全吗？因为一个粗心的错误（例如，写 `i =\
  \ t` 而不是 `i = 1`）可能会导致意外的转换和赋值？是的，我同意。我倾向于在类中声明一个执行相同操作函数并调用它，而不是使用转换函数。也就是说，我更喜欢写：\n\
  \n```cpp\nint handle_int();\n```\n\n并编写 `i = t.handle_int();` 这样代码就很清晰。当然，有人可能觉得这样不够优雅或不方便，倾向于编写\
  \ `i = t;`。只需记住，如果你决定使用隐式转换函数，请务必格外小心。\n\n转换函数的流行用法是在条件中检查流的状态。例如：\n\n```cpp\nif\
  \ (cin >> i) { ... }\n```\n\n正如我们所知，通过 `>>` 运算符，一个值会被读取并存储在 `i` 中，并返回 `cin` 的引用。`istream`\
  \ 类提供了一个 `operator bool` 转换函数。因此，为了评估条件，会调用此转换函数，如果 `cin` 的状态有效，它返回 `true`；否则，如果发生错误，它返回\
  \ `false`。\n\n就像构造函数一样，如果我们不想允许隐式转换，可以使用 `explicit` 关键字。如果将转换函数设为 `explicit`，我们必须使用显式类型转换来使用它。例如：\n\
  \n```cpp\nexplicit operator bool const;\n```\n\n在进入下一节之前，我想再次强调，我不怎么喜欢使用隐式转换为或从类类型的转换，因为我倾向于让事情清晰、简单且安全。这才是最重要的。\n\
  \n## 成员函数指针\n\n在 第 8 章 中，我们讨论了函数指针。例如，通过 `void (*ptr)(int, int);`，`ptr` 被声明为指向函数的指针，它接受两个整数参数且无返回。现在，让我们看看如何声明指向类成员函数的指针。例如：\n\
  \n```cpp\nvoid (T::*ptr)(int, int);\n```\n\n为了方便编写指针声明和相应变量的类型，使用 `typedef` 语句为指针类型创建一个别名会更方便。很好，但这个声明的语法呢？看起来很复杂。是的，它看起来可能复杂，但事实如此，只要我们遵循\
  \ 第 8 章 和 第 11 章 中提到的简单方法。\n\n正如我们所说，声明函数指针的简单方法是先写函数原型，将函数名替换为 `(*fptr)` 形式的表达式。例如，我们编写\
  \ `f()` 的原型，将 `f` 替换为 `(*fptr)`，由于 `f()` 包含在类 `T` 中，我们加上 `T::`。然后，加上 `typedef` 关键字。\n\
  \n```cpp\ntypedef int (T::*fptr)(int);\n```\n\n提醒你，带有 `typedef` 的语法类似于变量声明，只是前面加上\
  \ `typedef` 单词。例如，我们在 `fptr` 的声明中添加 `typedef`，这样我们就可以在程序中使用 `fptr` 名称。也就是说，`fptr`\
  \ 是类型“指向类 T 的成员函数的指针，接受两个整数参数且无返回”的别名。使用这个别名，相应变量（例如 `p`）的声明被简化。\n\n或者，正如我们从 第 11\
  \ 章 中知到的，可以使用 `using` 关键字来创建别名。例如，我们可以写：\n\n```cpp\nusing int (T::*fptr)(int);\n\
  ```如果不使用别名，我们可以这样声明 `p` 指针：\n\n```cpp\nint (T::*p)(int);\n```\n\n或者，在 C++11 中，声明变得非常简单，因为我们可以直接使用\
  \ `auto` 为我们推导变量类型。例如，我们写：\n\n```cpp\nauto p = &T::f;\n```\n\n正如我告诉过你的，我的意图是向你展示几种替代方案，而不仅仅是最简单的，这样万一你在别人编写的代码中遇到它们，你就知道它们是如何工作的。\n\
  \n为了让指针指向类成员，我们对成员的全名应用 `&` 运算符。正如程序注释中所提到的，如果使用对象来调用函数，我们使用 `.*` 运算符；如果使用指针，我们使用\
  \ `->*` 运算符。它们必须包含在括号中，因为调用运算符 `()` 的优先级更高。程序显示 3 和 3。\n\n```cpp\nt.*ptr(3, 3);\n\
  ptr->ptr(3, 3);\n```\n\n成员函数指针可以用于间接调用函数，当我们不知道它的名称时。如果我们知道，可以通过编写 `t.f(8, 5);`\
  \ 直接调用。这个示例的第二个目的是讨论 `.*` 和 `->*` 运算符，以便当你看到它们时不会疑惑。静态成员与对象无关，所以我们不使用它的全名来声明它。例如：\n\
  \n```cpp\nf();\n```\n\n## 成员初始化列表\n\n正如我们所知，初始化类成员的一种方法是在构造体内部。例如：\n\n```cpp\nT()\
  \ { a = 1; }\n```\n\n或者，在调用类的构造函数时使用特殊语法初始化类成员。这种语法被称为成员初始化列表。例如：\n\n```cpp\nT()\
  \ : a(1), b(2) { }\n```\n\n注意，这种成员初始化列表语法只能用于构造函数，不能用于成员函数。所示，添加一个冒号并用逗号分隔各个初始化。首先我们编写成员名称，然后用括号写出它的初始值。因此，Text\
  \ 被存储在 `s` 中，`a` 变为 `arg1`，`b` 变为 `arg2`。注意，这些初始化发生在对象创建时，并在构造体执行之前。\n\n虽然逻辑上认为初始化是从左到右进行的（即先初始化\
  \ `s` 然后是其余），事实上成员是按照它们在类声明中的顺序初始化的，即首先是 `a`，然后是 `b`，最后是 `s`。通常，初始化顺序没有影响。但如果一个成员的值与另一个成员的初始化有关，那么可能会产生影响。例如：\n\
  \n```cpp\nT() : a(b), b(10) { }\n```\n\n当 `c` 对象创建时，首先 `a` 将用 `b` 的随机值初始化，然后 `b`\
  \ 将等于 10。\n\n成员初始化列表的一个典型用途是初始化 `const` 变量。回想 第 17 章，由于类的定义没有为其成员分配内存，我们无法初始化 `const`\
  \ 成员。但是我们可以使用这种语法并对其进行初始化。例如：\n\n```cpp\nT() : k(10) { }\n```\n\n当构造函数被调用时，`k` 变为\
  \ 10。与 `const` 成员一样，我们可以使用这种语法初始化引用变量。例如：\n\n```cpp\nT() : r(ref) { }\n```\n\n如果成员是指针，也可以被初始化。例如：\n\
  \n```cpp\nT() : p(&x) { }\n```\n\n\n\n\n为了使初始化更加清晰，我倾向于在构造函数体中初始化普通变量，而不是将它们混合在同一行中。例如：\n\
  \n其他人则倾向于在初始化列表中初始化所有成员。原因之一是避免在需要初始化的成员（例如 `const`）上可能发生编译错误。另一个原因是为了更好的性能。例如，在之前的方法中，会先调用\
  \ string 类的默认构造函数将 `s` 初始化为空空字符串，然后调用拷贝函数将 `Text` 赋值给它。是的，在成员列表中初始化它更高效，因为正如我们在下文所示，string\
  \ 类的拷贝构造函数直接进行初始化。请注意，对于基本类型（例如 `a`），无论是在列表中完成初始化还是在构造函数体内完成初始化，性能上没有区别。\n\n###\
  \ 转发构造函数 (Forwarding Constructor)\n\nC++11 通过提供转发构造函数扩展了初始化能力。在创建对象的过程中，这种构造函数会调用该类的另一个构造函数来委托任务。这就是为什么它的常用名称是转发（forwarding）或委托（delegating）构造函数的原因。让我们来看一个例子：\n\
  \n后两个构造函数调用了第一个。当转发构造函数调用第二个构造函数时，该第二个构造函数的体（例如 `x = a+b;`）会先执行，然后执行它自己的体（例如 `cout\
  \ << \"Delegate\\n\";`）。当它自身的体执行完成后，对象的创建就被认为已完成。所示，转发构造函数的语法与成员初始化列表相似，不同之处在于列表只能包含一个项，即目标构造函数。也就是说，不允许初始化额外的成员。例如：\n\
  \n注意，在这个示例中，我们可以使用带有默认参数值的单个构造函数，我只是使用了三个来向你展示调用语法。\n\n通常，当其他部分都需要执行一组共同的操作时，会调用一个构造函数。例如，我们可以将类更改为：\n\
  \n比较这两种实现，我认为对于相同的代码，存在于单一处比在各处重复更具可读性也更安全，这样如果需要修改，你只需要编辑一次。因此，转发构造函数可以简化构建过程，并使其更安全、更易控制。\n\
  \n注意，这种调用构造函数的方法与函数体内部显式调用构造函数的方法不同。例如，如果你编写类似这样的代码：\n\n构造函数不会像你预期的那样被调用，而是会新的匿名临时对象，而该对象不会被使用。也就是说，如果我们写：\n\
  \n程序将为 `x` 显示一个随机值，而不是 15。\n\n### 拷贝构造函数 (Copy Constructor)\n\n拷贝构造函数是一个特殊函数，每当创建一个新对象并用现有对象对其初始化时，它就会被自动调用。例如：\n\
  \n就像在没有定义构造函数时编译器提供默认构造函数、没有定义析构函数时提供默认析构函数以及默认拷贝函数一样，如果定义定义，它就会提供默认拷贝构造函数。因此，为了创建\
  \ `t2` 和 `t3` 对象，会调用默认拷贝构造函数。这个构造函数做了什么呢？正如它的名称所示，它将现有对象的非静态成员逐一拷贝到新对象中。例如，通过语句\
  \ `T t2(t1);`，编译器创建 `t2` 对象并调用拷贝构造函数将 `t1` 的成员拷贝到 `t2`。\n\n这种拷贝也被称为**浅拷贝** (`shallow\
  \ copy`)。每个成员的拷贝方式取决于它的类型。基本类型直接拷贝；如果是数组，则拷贝其元素；如果是对象，则调用其类的拷贝构造函数来拷贝。同样，通过 `T t3\
  \ = t1;` 语句（这是 `T t3(t1);` 的替代方案），会调用拷贝构造函数并将 `t1` 的成员拷贝到 `t3`。如果类包含静态成员，它们不受影响，因为它们属于类而不属于对象。程序显示两次\
  \ 1 2。\n\n注意，在普通赋值（如 `t2 = t1`）中，被调用的不是拷贝构造函数，而是默认拷贝 `operator=` 函数，它将 `t1` 的成员拷贝到\
  \ `t2`。为了清楚起见，在创建对象时（例如 `T t2 = t1;`）会调用拷贝构造函数，而当对象已存在时（例如 `t2 = t1;`）则调用拷贝函数。\n\
  \n定义 定义我们的拷贝构造函数\n\n在某些特殊情况下，我们需要定义拷贝构造函数。典型的情况是类包含指针；我们稍后会看到这样的示例。那么，我们如何声明它？拷贝构造函数的名称与类名相同，没有返回类型，并接受一个相应类对象的引用作为参数。通常的约定是将引用声明为\
  \ `const`，这意味着拷贝构造函数在创建对象副本时不对其进行修改。如果我们将其声明为非 `const`，则不允许传递 `const` 对象，因此我们无法拷贝\
  \ `const` 对象。`const` 引用允许 `const` 和非 `const` 对象都被拷贝。毕竟，参数应该是 `const` 引用，因为拷贝构造函数的工作正如其名称所示，是创建一个副本，而不是更改原始对象。事实上，任何类的默认拷贝构造函数的参数类型都是\
  \ `const` 引用。例如，类 `T` 的默认拷贝构造函数的原型为：\n\n作为我们拷贝构造函数的一个实现示例，如果在类定义中添加以下内容：\n\n这就是将被调用的拷贝构造函数。因此，程序将为\
  \ `t2` 和 `t3` 的成员显示两次垃圾值。\n\n当然，允许我们的拷贝构造函数调用另一个构造函数或带有初始化列表，正如我们之前看到的。例如：\n\n注意，如果你定义了拷贝构造函数，编译器就不会创建默认拷贝构造函数。同样，也不会创建默认构造函数。也就是说，写成是错误的：\n\
  \n除非你有特定的理由定义自己的拷贝构造函数，否则不要这样做。例如，没有理由写：\n\n为了让你拷贝成员。让默认拷贝构造函数来做吧。除了简单之外，这是一种更安全的做法。例如，你可能会忘记拷贝某个成员，导致它获得随机值而不是预期的值。此外，如果未来你或其他人向类中添加新成员，很容易忘记添加它的初始化。\n\
  \n### 拷贝构造函数与函数调用\n\n除了之前看到的初始化情况外，当函数返回对象或按值传递对象对象时，也会调用拷贝构造函数。例如，假设我们在类外部添加以下函数：\n\
  \n并将 `main()` 修改为：\n\n当 `ret_obj()` 返回时，会自动调用默认拷贝构造函数，创建一个临时 `T` 对象，将 `t` 的值拷贝到该对象，然后将该临时对象的值拷贝到\
  \ `t1`。注意，C++ 标准允许编译器进行优化并跳过对拷贝构造函数的调用，以避免创建这个临时对象。如果满足某些条件（详细讨论超出了本文范围），编译器允许消除此调用。例如，如果函数返回一个局部自动变量（而不是参数），编译器允许执行这种优化，并直接将该值拷贝到持有结果的变量中（例如\
  \ `t1`）。这种优化被称为**命名返回值优化** (`NRVO`)。在我们的示例中，此条件未被满足，拷贝构造函数被调用，程序显示 3 4。\n\n\n\n\
  当调用 `pass_obj()` 时，会调用默认拷贝构造函数，`t1` 的值被拷贝到 `t` 中，程序显示 3 4。因此，我们看到将对象传递给函数会触发对拷贝构造函数的调用。正如我们所说的，为了节省内存和时间，传递引用更为高效。如果我们想防止对象发生任何变化，可以将参数声明为\
  \ `const` 引用。我们将在下一节中对其进行更深入的分析。\n\n让我们回到拷贝构造函数的示例。有人可能会问，我们可以按值传递参数吗？也就是说，写成：\n\
  \n\n\n答案是不肯定的。为什么呢？拷贝构造函数本身是一个函数。因此，当调用它时，如果我们传递一个对象作为参数，编译器将再次调用拷贝构造函数来创建参数的副本。这个对拷贝构造函数的新新调用的参数是按值传递的，因此需要新的调用，这导致了对拷贝构造函数的非终止的递归调用链。因此，编译器不允许这种情况发生，导致编译失败。\n\
  \n### 通过引用传递参数（重温）\n\n正如我们所说的，当我们把大型实体传递给函数时，通过引用（或传递指针）进行调用比按值传递更高效。现在我们已经讨论了拷贝构造函数，让我们进行更详细的分析。考虑以下示例：\n\
  \n当调用 `f()` 时，参数 `p` 按值传递的。让我们看看这种选择会导致什么操作。正如我们所说，`Student` 类的默认拷贝构造函数被调用以创建 `s`。此外，对于\
  \ `s` 的每个字符串成员的构造，`string` 类的拷贝构造函数会被调用。当 `f()` 终止时，`Student` 类的默认析构函数会被调用，每个已构造的字符串对象的析构函数也会被调用。如你所见，仅仅一个传递的参数就发生了多次调用。如果，例如\
  \ `Student` 类包含其他类的对象，由于每个对象的创建都会触发对相应拷贝构造函数的调用，我们会有更多的调用。而且，正如我们在讨论继承时将看到的，如果 `Student`\
  \ 类派自于基类，该基类可能包含其他对象。那么，在构造这些对象时，应该调用相应的拷贝构造函数。如果 `f()` 在程序中被多次调用，这些“隐藏”调用的数量就会倍增。\n\
  \n正如我们所知，避免所有这些构造函数和析构函数调用的另一种方法（从而提高性能）是通过 `const` 引用传递对象。例如：\n\n\n\n现在，没有创建新对象了。`const`\
  \ 限定符不允许对传递的对象进行修改，这与按值调用相对应，在按值调用中会对对象的副本进行任何修改。\n\n### 拷贝构造函数与成员指针\n\n如果类包含指针类型的成员变量，如果我们使用默认拷贝构造函数（以及默认拷贝赋值运算符，正如我们在第\
  \ 18 章中所示），可能会出现问题。例如，考虑以下程序并尝试找出问题：\n\n问题源于在创建 `t2` 时调用了默认拷贝构造函数。具体来说，`t2.s` 等于\
  \ `t1.s`，也就是说两个指针指向同一内存。所以，当 `t2.s[0]` 改变时，`t1.s[0]` 也随之改变。因此，程序显示 `aext`。此外，两个指针指向同一内存的事造成了另一个错误。当\
  \ `t2` 被销毁时，会调用它的析构函数，`t2.s` 指向的内存会被释放，而这正是 `t1.s` 指向的内存。所以，当 `t1` 被销毁时，它的析构函数尝试再次释放同一内存，这是错误的。这些问题是如何修复的呢？\n\
  \n解决方案是定义我们自己的拷贝构造函数。也就是说，我们在类中添加以下函数：\n\n\n\n现在，当创建 `t2` 时，会调用这个拷贝构造函数并将 `t1` 作为参数传递。也就是说，`t`\
  \ 引用指向 `t1` 对象。`t1` 的成员 `len` 被拷贝到 `t2.len`，为 `t2.s` 分配内存，并拷贝 `t1.s`。\n\n\n\nC++11\
  \ 增加的重要特性之一是能够移动对象而不是复制它。旧版本只支持拷贝操作。正如我们在第 16 章中所述的，当我们必须复制可能包含大量数据的实体时，如果我们知道源实体将不再被使用，那么移动它们比拷贝数据（这是一项开销巨大的操作）高效得多。例如，`vector`\
  \ 和 `string` 类支持移动操作。以 `string` 类作为移动示例，考虑 `string` 类。每个 `string` 对象都有一个指向存储字符数组的指针。移动构造函数拷贝的是该指针，而不是分配新内存并将字符拷贝到该内存中。让我们来看一个类似的示例：\n\
  \n由于该类有一个指针成员，我们确保提供了我们的拷贝构造函数和拷贝赋值运算符。程序看起来没问题，会有什么问题吗？没有，但我们可以提高它的性能。怎么做呢？来看 `arr2`\
  \ 的创建。正如我们所知的，调用了构造函数，`arr1` 的成员被拷贝到 `arr2`。由于我们不再再次使用 `arr1`，我们不需要保留两个副本（`arr1`\
  \ 和 `arr2`），也就是说，我们不需要拷贝 `arr1` 的数据，而是移动它们。将 `arr2` 赋值给 `arr3` 也是如此。由于我们不再再次使用 `arr2`，移动其数据更高效。嗯，在这个程序中，移动数据对性能没有产生显著影响，但在另一个对象包含数千个整数且我们有许多类似调用的应用程序中呢？那么，对于每次调用，我们都会产生不必要的数据拷贝。这就是移动操作的思想；每当一个实体是临时且不再被使用时，移动它包含的数据比拷贝它们更高效。让我们来看另一个示例：\n\
  \n由于 `arr` 是一个局部变量，在 `f()` 终止时会被销毁，因此我们永远无法重用它，将数据从 `arr` 移动到 `arr1` 并避免拷贝不是更高效吗？\n\
  \n确实，数据移动提高了性能，但我们如何移动数据呢？编译器必须能够以某种方式确定何时拷贝数据以及何时移动数据。这个决策基于*右值*（rvalue）引用。特别是，如果我们想让用户定义的类型（例如\
  \ `MyArray`）支持移动操作，它必须提供一个移动构造函数和一个 `=` 运算符的重载函数来通过移动进行数据赋值。你可能记得第 16 章中，为了向编译器表达我们移动数据的意图，我们使用右值引用。阅读注释以理解新增的内容：\n\
  \n为了区分移动操作和拷贝操作，请记住拷贝构造函数和拷贝赋值函数接受*左值*（lvalue）引用作为参数，而移动构造函数和移动赋值函数接受右值引用作为参数。此外，这些右值引用没有声明为\
  \ `const`，这样引用的实体就可以被修改。我们如何触发对移动函数的调用呢？回想第 16 章，我们可以使用 `move()` 函数。`move()` 返回其参数的右值引用。让我们修改程序：\n\
  \n如果一个类（例如 `MyArray`）同时定义了拷贝构造函数和移动构造函数，编译器会检查参数的类型以调用相应的某一个。对于拷贝函数和移动函数也是如此。也就是说，它会检查传递的是左值引用还是右值引用。看看下面的示例来查看调用了哪个函数（嗯，在返回值的情况下，编译器可能会执行\
  \ NRVO，但我指的是一般情况）：\n\n如果在类中没有声明移动构造函数和移动函数，则会调用拷贝构造函数和拷贝函数。例如，在 `arr4 = f()` 语句中，如果没有定义移动函数，则将调用拷贝函数。如果我们使用\
  \ `move()` 且没有定义移动赋值运算符，不会发生任何坏事；相反将调用拷贝赋值运算符。移动构造函数也是如此。也就是说，如果你使用 `move()` 构建一个对象（例如程序中的\
  \ `arr2`）且移动构造函数不存在，则将调用拷贝构造函数。\n\n让我们程序是如何工作的。在创建 `arr2` 过程中，由于 `move()` 返回一个右值，因此调用了移动构造函数，`a`\
  \ 绑定到了 `arr1`。`a` 的类型是右值引用；为了绑定到右值参数，这是合理的。此外，编译器调用移动构造函数而不是拷贝构造函数也是合理的，以便将右值参数与右值引用绑定。移动构造函数只是让构造的\
  \ `arr2` 对象的指针指向 `arr1.p` 所指向的内存。实际上，内存的所有权被转移了。正如我们在第 16 章中讨论的，当一个对象不再需要时，我们就移动它。例如，如果你再次使用\
  \ `arr1`（例如 `cout << arr1[0]`），可能会出现不可预知的问题。\n\n注意，原始指针必须显式地置空，否则我们有两个指针——构造的对象的指针（即\
  \ `p`）和对象 `a` 的指针（即 `a.p`）指向同一个动态分配的内存。我们希望这种情况发生吗？显然不，我们意识到了危险的后果。例如，当对象销毁时，同一块内存会被释放两次。由于我们不希望发生坏事，我们将原始指针设置为\
  \ `nullptr`。正如我们所知，当 `a` 被销毁时，对空指针执行 `delete[]` 没有影响。\n\n正如定义的拷贝构造函数通常带有拷贝赋值运算符一样，定义的移动构造函数通常带有移动赋值运算符。该函数接受右值引用作为参数。当赋值运算符\
  \ `=` 的右操作是右值时，编译器使用移动函数而不是拷贝函数，并且右值参数绑定到右值引用。因此，继续我们的示例，`arr2` 将作为参数传递给 `operator()`\
  \ 移动函数。正如代码中的注释所解释的，该函数将其数据移动到调用对象，即 `arr3`。\n\n正如你所见，在两个移动函数中我们只拷贝了指针，这与拷贝整个数组的成本相比微不足道。总结一下，移动函数将数据从右操作移动到左操作，而移动构造函数将数据从其参数（例如\
  \ `a`）移动到新构造的对象。\n\n所以，如果你想让类型（例如 `MyArray`）支持移动操作以提高性能，你需要使用右值引用编写自己的移动函数。正如我们所，你需要特别注意你编写的代码，以便在移动后，源对象进入一个其析构函数可以处理的状态。例如，如果对象包含一个指向分配内存的指针（例如\
  \ `p`），在移动数据后你应该显式地为其分配 `nullptr` 值，而不是假设它会被赋予该值。你必须记住，管理内存的责任现在属于目标对象。当它被销毁时，它的析构函数将释放内存。\n\
  \n\n\n\n在继续之前，你是否注意到 `noexcept` 这个词的存在了？很好，我们将在第 22 章中讨论 `noexcept` 关键字。简而言之，它表示函数不会抛出异常。建议将移动构造函数和移动赋值运算符声明为\
  \ `noexcept`，前提是它们不会抛出异常，而这通常如此。这通常是事实，因为移动操作的主要目的是获取资源，而不是分配任何新内存或执行其他可能失败的操作。因为如果移动函数没有声明为\
  \ `noexcept`，可能会调用拷贝函数而不是预期的相应移动函数，因此将它们声明为 `noexcept` 非常重要。\n\n请注意，如果你定义了自己的移动构造函数或移动函数，那么你也应该定义自己的拷贝构造函数和拷贝函数。这是因为在默认情况下，相应的默认函数被删除了，也就是说，正如我们稍后看到的，它们变成了\
  \ `delete`，且你无法使用它们。例如，在上一个程序中，如果我们没有定义自己的拷贝函数，我们就无法编写：\n\n```\nthe compiler would\
  \ display an error message similar to MyArray& MyArray::operator=(const MyArray&)\
  \ cannot be referenced – it is implicitly declared as deleted.\n```\n\n### 通过右值引用传递参数\n\
  \n正如你所猜想的，我们可以通过右值引用向函数传递参数。因此，函数可以使用引用来移动数据。通常情况下，这种函数是重载的，正如我们之前在移动和拷贝构造函数以及赋值运算符中看到的那。也就是说，有一个版本接受\
  \ `const` 左值引用，另一个版本接受右值引用。当函数被调用时，编译器会检查参数的类型并选择合适的一个。让我们来看一个带有类成员重载的示例：\n\n有人可能可能会疑惑，为什么在第二个\
  \ `f()` 中我们再次使用了 `move()` 呢？也就是说，既然 `s` 的类型是右值引用，我们难道不能直接写 `string s1 = s;` 来实现移动吗？在不涉及细节的情况下，答案是变量名是一个左值，即使该变量的类型是右值引用。这就是我们必须使用\
  \ `move()` 的原因。\n\n我理解你可能觉得我们在本章（以及之前的章节）中讨论的许多概念非常困惑。你是对的，很多内容已经足够困难且复杂，以至于立即理解。我的建议仍然如初且永远不会改变：编写小型程序并对其进行实验（例如，在构造函数、赋值函数、析构函数等中添加打印语句），观察它们是如何工作的。我告诉过你，通往\
  \ C++ 之端的道路是漫长的且充满了障碍，事实上，随着语言的不断演进，顶端的类型不是 `const` 而是 `long double`。如果一位严厉的导师建议你听听来自\
  \ *ACDC* 的 *It’s a long way to the top if you wanna … pass the C++ course*，不要感到惊讶。\n\
  \n### 将对象作为返回值\n\n正如我们在几个示例看到的，函数可以返回一个对象或该对象的引用。让我们再次回顾这些选项。例如，考虑 `Student` 类：\n\
  \n现在假设我们想写一个返回分数更高对象的函数（假设它们是不同的）。我们将参数声明为 `const`，这样函数就无法修改它们。\n\n或者，函数可以返回该对象的引用。我们只需要更改原型，代码保持不变：\n\
  \n因此，以下程序在两个版本的函数下都可以工作。\n\n问题是，这两个版本中选择哪一个更高效？返回引用不会触发任何对拷贝或移动构造函数的调用，因此通常情况下优选引用。由于两个参数都声明为\
  \ `const` 引用，返回类型必须是 `const` 以匹配。正如我们提到的，当函数返回一个对象的引用时，该对象在函数结束后必须继续存在。\n\n```\n\
