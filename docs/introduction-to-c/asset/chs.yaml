  ## 18 运算符重载\n\nDOI: [10.1201/9781023076-18](https://doi.org/10.1201/9781023076-18)\n\
  \n在第 16 章中，我们学习了只要签名不同，就可以定义多个同名函数。C++ 的主要目标之一是让程序员定义的类型像基本类型一样工作。在本章中，我们将看到 C++\
  \ 如何实现这一目标，也就是说，我们将看到如何将函数重载的概念扩展到运算符，以便用户定义的类型（如类）像基本类型一样工作。\n\n### 运算符重载\n\n就像函数可以重载，运算符也可以重载并执行不同的任务。事实上，你已经遇到过运算符重载的示例。例如，`*`\
  \ 运算符应用于两个数字时产生它们的乘积，而应用于指针时则产生指针所指向地址的值。编译器会检查参数的数量和类型来决定如何使用该运算符。\n\nC++ 允许我们将运算符重载的概念扩展到用户定义的类型。例如，我们可以重载\
  \ `+` 运算符来相加两个自定义类类型的对象。\n\n\n\n\n函数的名称为 `operator`。`op` 可以是任何 C++ 运算符（例如 `+`、`-`、`…`），但某些除外。像任何普通函数一样，它有函数体、返回类型，并可以接受参数。参数的数量与运算符操作数数量相同。也就是说，二元运算符的重载函数接受两个参数，而一元运算符的重载函数接受一个参数。正如我们所说，运算符重载通常用于类，以便它们以更自然的方式运行。例如，下面的程序定义了\
  \ `Rect` 类，该类包含一个重载 `+` 运算符的函数：\n\n在讨论运算符重载之前，让我们先回答这个问题。由于 `length` 和 `height`\
  \ 成员是私有的，为什么在 `operator+` 函数中访问这些成员时（例如 `r.length`），编译没有失败呢？答案是，C++ 允许对象访问同一类中其他对象的所有成员，包括私有成员。\n\
  \n当编译器遇到 `r1+r2` 语句时，它会检查操作数的类型，并意识到必须调用对应的 `operator+` 函数。具体来说，`r1+r2` 语句被解释为 `r1.operator+(r2)`，因此调用了\
  \ `r1` 对象的 `operator+` 函数，并将 `r2` 对象作为参数传递。通常情况下，当二元运算符的重载函数在类中声明时，左操作数（例如 `r1`）是调用它的对象，而右操作数（例如\
  \ `r2`）则作为参数传递给函数。注意，如果没有声明 `operator+` 函数，编译器将为非法操作显示错误信息，因为对象不能直接相加。或者，我们可以显式地调用该函数并编写\
  \ `r1.operator+(r2)`。自然地，运算符的通常用法是显式调用的一种更易读、易写的简写。该函数返回一个新对象，其维度等于两个对象对应维度之和。因此，程序显示了\
  \ 40 和 60。\n\n该程序证明了与类关联的 C++ 运算符在应用于该类的对象时可以具有特殊行为。例如，对象可以参与普通表达式（例如 `r1+r2`）并表现得像基本类型。传统方法是定义相应的函数并按通常方式调用它们。例如，与其不重载\
  \ `+` 运算符，我们不如定义 `add()` 函数：\n\n运算符重载的用处是类的操作看起来更自然，程序变得更易读、易写。我还发现，对于类开发者来说，为类用户提供此类方便的服务，比让他们自己实现这些服务在程序设计上更优雅。是的，这确实简化了类用户的工作（例如使用\
  \ `r1+r2` 等语句），但它给类程序员带来了麻烦，因为他/她必须编写运算符函数来支持这些“自然”操作。毕竟，正如我们所说，C++ 的目标之一就是让类对象表现得像基本类型一样。\n\
  \n在继续之前，你是否注意到参数上有什么奇怪的地方？我们说过参数的数量与运算符操作数数量相同。然而，我们看到 `operator+` 接受一个参数，而 `+`\
  \ 运算符接受两个操作数。这是为什么？如果重载函数是类的成员函数，第一个操作数（例如 `r1`）的内存地址（实际上是 `this` 指针的值）会隐式地作为“隐藏”参数传递，正如我们在第\
  \ 17 章中讨论 `this` 指针时所看到的那样。这就是为什么类成员重载函数的参数比操作数数量少一个。例如，如果类重载了一元运算符 `!`，我们写的是 `operator()()`\
  \ 而不需要任何参数。如果重载函数不是类成员，那么它接受的参数数量与其操作数数量相同。\n\n这里有一些复习知识的问题。如果我们没有在 `operator+`\
  \ 中传递 `Rect` 的引用，输出会相同吗？是的。为什么要传递引用呢？为了效率，节省创建新对象并将 `r2` 拷贝到其中所需的时间和内存。为什么要将引用为\
  \ `const`？为了让函数不能更改 `r` 成员的值，本质上是 `r2` 的值。为什么函数不返回 `tmp` 对象的引用？由于 `tmp` 是局部变量，它在函数结束时会被销毁，因此引用将指向一个不存在的对象。为什么要将函数设为\
  \ `const`？为了让函数不能更改调用它的对象（即 `r1`）的成员的值。最后一个问题，考虑 `r4` 对象，我们可以写 `r4 = r1+r2+r3` 吗？\n\
  \n可以。因为 `+` 运算符是从左到右应用的，该语句被翻译为 `r4 = r1.operator+(r2+r3)`；这进一步翻译为 `r4 = r1.operator+(r2.operator+(r3))`；首先，将\
  \ `r2` 加到 `r3`，并将函数返回的对象加到 `r1`。\n\n注意，当运算符被重载时，它只对重载它的类的对象具有不同的含义。编译器通过检查操作数类型来决定如何操作。例如，在下面的代码中，第一种情况下它相加对象，而在其他情况下相加整数：\n\
  \n注意，在重载函数中，至少一个操作数的类型必须是自定义类型，例如类。你不能在操作数都是基本类型的情况下定义重载函数。尝试这个练习：在之前的程序中，添加一个重载运算符\
