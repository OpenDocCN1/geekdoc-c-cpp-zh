  \ 语句\n\n`continue` 语句只能用于 `for`、`while` 或 `do-while` 循环。`break` 语句终止循环，而 `continue`\
  \ 语句终止循环的当前迭代并开始下一次迭代。`continue` 之后的语句在当前迭代中不会执行。例如，考虑以下程序：\n\n如果 `i` 为 2 或 3，`if`\
