  \ 1 和自身外没有其他因数的整数。\n\n\n\n\n\n*   U.6.26 编写一个程序，读取一个整数并用单词形式显示它的数字。如果数字为负数，应以“minus”（负）一词开头。程序应接受多达五位的整数。例如，如果用户输入\
