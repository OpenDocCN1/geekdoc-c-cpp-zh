  \ 的类型是整数引用（`int&`）。注意，即使我们不想更改元素的值，行也必须声明为引用。例如，写成这样是错误的：\n\n此错误是因为编译器将数组名处理为指针，正如我们在第\
  \ 8 章 中看到的。特别是，`a` 没有被声明为引用，因此我们不能以这种方式在 `for` 循环中使用它。正如二维数组一样。\n\n### 嵌套向量的 Vector\n\
  \n与一维数组一样，我们可以声明一个二维 vector。例如：\n\n`v[0] = {1, 2, 3};`\n`v[1] = {4, 5, 6};`\n\n\
  二维 vector 可以使用嵌套列表初始化。例如：\n\n`vector<vector<int>> v = {{1, 2, 3}, {4, 5, 6}};`\n\
  \n## 练习题\n\nC.7.12 编写一个程序创建一个 5×5 的上三角数组；该数组的对角线以下元素应设置为 0。程序应为剩余元素分配 [-3, 3] 范围内的随机值并显示数组。最后，程序应以反向形式显示数组，从右下角元素到左上角元素。\n\
  \nC.7.13 编写一个程序读取 6 个整数并将它们存储在一个 2×3 数组（例如 `a`）中。然后，它应该读取另外 6 个整数并将它们存储在第二个 3×2\
  \ 数组（例如 `b`）中。程序应显示第三个 2×2 数组（例如 `c`）的元素，即 `c = a×b` 的结果。\n\n线性代数提醒我们，矩阵的乘积是通过第一个矩阵每行的元素与第二个矩阵每列对应元素的乘积之和得到的。因此，N×M\
  \ 矩阵乘以 M×N 矩阵得到 N×N 矩阵。例如，考虑以下 `a` (2×3) 和 `b` (3×2) 矩阵：\n\n$$a = \\begin{bmatrix}\
  \ 1 & {- 1} & 1 \\\\ 0 & 2 & 1 \\end{bmatrix}\\text{和}\\, b = \\begin{bmatrix} 1\
  \ & 0 \\\\ 2 & {- 2} \\\\ 2 & 3 \\end{bmatrix}$$\n\n`c = a×b` 的维度是 2×2，其元素为：\n\n\
  $$c = \\begin{bmatrix} {\\text{1} \\times 1 + ( - 1) \\times 2 + 1 \\times 2} &\
  \ {\\text{1} \\times 0 + ( - 1) \\times ( -2) + 1 \\times 3} \\\\ {\\text{0} \\\
  times 1 + 2 \\times 2 + 1 \\times 2} & {\\text{0} \\times 0 + 2 \\times ( -2) +\
  \ 1 \\times 3} \\end{bmatrix} = \\begin{bmatrix} 1 & 5 \\\\ 6 & {- 1} \\end{bmatrix}$$\n\
  \n在数学中，其元素的值是 $c_{ij} = {\\sum\\limits_{k = 1}^{M}{a_{ik} \\times b_{kj}}}$ 的结果。在编程层面，*k*\
  \ 的范围是从 0 到 *M*-1。\n\n\n\n\n\n### C.7.14 编写一个程序，在 [0, 20] 范围内为一个 6×8 整数数组的元素分配随机值。然后，程序应该读取用户的选择，如果是\
  \ 1，则读取两个对应于行的整数并交换它们的元素。如果不是 1，则两个输入整数对应于列。程序应该检查两个输入整数的有效性，并显示原始数组和最终数组。\n\n###\
  \ C.7.15 在线性代数中，如果与主对角线平行的对角线元素都相等，则该矩阵被称为 `Toeplitz` 矩阵。例如，下面的 5×5 矩阵展示了 5×5 `Toeplitz`\
  \ 矩阵的通用形式：\n\n$$t = \\begin{bmatrix} a & b & c & d & e \\\\ f & a & b & c & d \\\
