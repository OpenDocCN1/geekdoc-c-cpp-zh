  \ `int`、`long int` 和 `long long int` 类型中最小的。例如...（注：原文此处有部分重复描述，已已要求要求翻译逻辑）\n\n\
  由于由于两个操作数都是整数，除法运算符 `/` 会截断小数部分并产生整数结果。因此，赋值给 `j` 的值是 1，无论 `j` 的类型如何。一个常见的错误是认为因为\
  \ `j` 是 `double`，要存储的值将是 1.6。不，接收结果的变量的类型（例如 `j`）并不起任何作用。\n\n\n\n\n如果操作数中任意一个是浮点数，则小数部分不会被截断。例如，如果\
  \ `i` 被声明为浮点变量，则 `j` 将为 `1.6`。如果我们写 `5.0` 而不是 `5`，结果也是如此，因为除数是一个浮点常量。\n\n从 C++14\
  \ 开始，单引号字符 `'` 可以用作整数和浮点常数中的数字分隔符。这可以使大数字更易于阅读。例如：\n\n### 算术转换\n\nC++ 允许在同一个表达式中混合不同的数据类型。例如，将一个\
  \ `int`** 和一个 `double` 值相加。在这种情况下，编译器将根据我们将要看到的规则执行类型转换。通常，转换的目标是使结果的类型变为较宽的操作数的类型。算术转换适用于期望算术类型操作数的二元运算符，例如算术运算符、关系运算符和相等运算符。从一种类型到另一种类型的转换通过`隐式地`或`显式地`完成。隐式转换由编译器引起，显式转换由程序员引起。\n\
  \n### 隐式转换\n\n当执行隐式转换时，编译器在没有程序员干预的情况下，将“较窄”类型的操作数提升为能够存储其值的“较宽”类型。我们检查两种情况：\n\n\
  1. 如果任意操作数具有浮点类型。在这种情况下，类型较窄的操作数按以下顺序提升：`float` -> `double` -> `long double`。也就是说，如果一个操作数是\
  \ `long double`，另一个被转换为 `long double`。否则，如果一个操作数是 `double`，另一个被转换为 `double`。再次，如果一个操作数是\
  \ `float`，另一个被转换为 `float`。注意，这些规则也适用于整数操作数的情况。也就是说，如果一个操作数是 `double` 而另一个是 `int`，则\
  \ `int` 操作数被转换为 `double`。\n\n2. 如果两个操作数都不是浮点类型。首先，对两个操作数应用整数提升。具体而言，`bool`、`char`、`signed\
  \ char`、`unsigned char`、`short int` 和 `unsigned short int` 类型被提升为 `int`；如果 `int`\
  \ 类型无法表示原始类型的所有值，则提升为 `unsigned int`。特别是，`true` 被提升为 1，`false` 被提升为 0。`char16_t`、`char32_t`、`wchar_t`\
  \ 类型以及作用域枚举类型（我们将在第 4 章中讨论）被提升为 `int`、`unsigned int`、`long int`、`unsigned long int`、`long\
  \ long int` 或 `unsigned long long int` 类型中能够表示原始类型所有值的第一个。\n\n然后，类型较窄的操作数按以下顺序提升：`int`\
  \ -> `unsigned int` -> `long int` -> `unsigned long int` -> `long long int` -> `unsigned\
  \ long long int`。\n\n1. 也就是说，如果一个操作数是 `unsigned long long int`，另一个被转换为 `unsigned\
  \ long long int`。\n2. 否则，如果一个操作数是 `long long int` 而另一个是 `unsigned long int`，那么如果\
  \ `long long int` 可以表示 `unsigned long int` 的所有值，则 `unsigned long int` 被转换为 `long\
  \ long int`。否则，两个操作数都被转换为 `unsigned long long int`。\n3. 否则，如果一个操作数是 `unsigned long\
  \ int`，另一个被转换为 `unsigned long int`。\n4. 否则，如果一个操作数是 `long int` 而另一个是 `unsigned int`，那么如果\
  \ `long int` 可以表示 `unsigned int` 的所有值，则 `unsigned int` 被转换为 `long int`。否则，两个操作数都被转换为\
  \ `unsigned long int`。\n5. 否则，如果一个操作数是 `long int`，另一个被转换为 `long int`。\n6. 否则，如果一个操作数是\
  \ `unsigned int`，另一个被转换为 `unsigned int`。\n7. 否则，两个操作数的类型均为 `int`。\n\n让我们来看转换示例：\n\
  \n注意，当有符号类型和无符号类型混合时，转换规则可能会产生意想不到的结果。例如，以下程序的输出是什么？\n\n尽管我们预期的程序输出 Yes，但它输出的是 No。原因如下：由于操作数\
  \ `a` 和 `b` 类型不同，所应用的转换规则规定在比较之前将 `a` 的类型提升为 `unsigned int`。因此，`a` 的值将转换为一个大于 `b`\
  \ 的大正数（在 32 位系统中，它是 `2³²-20`）。结果是程序输出 No。\n\n当右侧表达式的类型与左侧变量的类型不匹配时，赋值中也可能发生隐式算术转换。应用的规则规定表达式的类型转换为变量的类型。如果变量的类型至少与表达式类型一样，例如：\n\
  \n```cpp\ndouble d = 10;\n```\n然而，存在可能会丢失信息的转换情况。这些被称为`窄化` 转换。例如，当将浮点值赋值给整数变量时：\n\
  ```cpp\nint i = 11.5;\n```\n小数部分被截断，`i` 变为 11。当将较大的浮点类型赋值给较小的浮点类型（例如 `double` 到\
  \ `float`）或将较大的整数类型赋值给较小的整数类型（例如 `long` 到 `int`）时，也会发生精度丢失。正如你所料的，窄转换可能是意外错误的原因；编译器极有可能向程序员发出警告信息。在初始化时，C++11\
  \ 正如我们之前所示使用 `{}` 语法防止窄转换：\n```cpp\nint i{11.5};\n```\n\n### 显式转换\n\n除了编译器执行转换的隐式方式外，程序员可以使用强制转换符显式地将一个表达式的类型转换为另一种。传统方式的转换表达式（即在引入特殊运算符之前）语法如下：\n\
  \n```cpp\ndata_type expression;\n```\n为了回答这个问题，我们需要知道类型转换是否在乘法之前执行。因此，我们必须参考附录 A\
  \ 中的优先级表。由于强制转换运算符的优先级高于 `*` 运算符，`d` 变为 40。如果表达式用括号括起来，即 `(2.99 * 20)`，`d` 将变为 59。\n\
  \n除了传统方法，C++ 还提供了执行显式转换的特殊运算符。我们第 25 章中讨论它们。例如，`static_cast<>` 运算符可以用于从一种数值类型转换为另一种数值类型：\n\
  \n```cpp\nstatic_cast<int>(c)\n```\n要转换的变量（例如 `c`）位于括号内，新类型位于括号中（例如 `int`）。`c` 的类型被临时转换为\
  \ `int`，并将整数值赋值给 `d`。“临时”一词意味着编译器将下一个 `c` 视为 `double`。注意，强制转换不会改变 `c` 的值，即 `c` 保持为\
  \ 1.23。\n\n\n\n\n\n正如第 25 章所示，使用特殊类型转换运算符的主要目的是为了安全性，以避免可能在程序运行时引起问题的类型转换。此外，通过在程序中简单搜索运算符名称（例如\
  \ `static_cast`），我们可以快速找到所有类型转换，从而对程序进行更好的控制。相比之下，使用传统方法，我们必须逐行搜索程序并浪费更多时间来寻找类型转换，因为没有特殊的标记来标识它们。\n\
  \n### 常量变量\n\n除了变量的类型，我们还可以指定额外的属性。例如，有时我们可能希望声明一个在程序执行期间值保持不变的变量。这种变量被称为 `constant*`。要声明一个常量变量，我们使用\
  \ `const` 关键字。`const` 变量在声明时必须初始化，并且之后不允许更改其值。例如：\n\n在程序稍后尝试更改变量的值（例如 `a = 20;`）将产生编译错误。`const`\
  \ 变量可以像非 `const` 变量一样参与表达式，只要不尝试改变它的值。例如：\n\n`const`常用的用法是声明一个在程序中多次使用的常量。例如：\n\n\
  编译器会将所有出现的 `RATE` 替换为值 `50`。因此，`a`、`b` 和 `c` 的值分别变为 `150`、`30` 和 `-1`。为了区分 `const`\
  \ 变量和普通变量，许多程序员喜欢使用大写字母命名。不要忘记为你声明的常量使用描述性名称，以帮助读者理解它们的作用。在多个源文件中可以使用相同常量的大型程序中，做法是将它们放在一个头文件中，并在需要它的源文件中通过\
  \ `#include` 包含。\n\n好了，有人可能会问，是否有必要将 `RATE` 声明为 `const`，为什么不声明为简单的整数变量呢？我们当然可以，尽管如此，将其变为\
  \ `const` 要安全得多，以避免其值被无意修改。\n\n例如，让我们在不声明 `RATE` 常量的情况下编写之前的程序：\n\n如果我们以后需要更改值 `50`，就必须进行三次替换而不是一次。这在小型程序中可能看起来很简单，但想象一下在一个长达数千行的程序中更改每一个值是什么体验！准确地说，我们必须找到真正需要更改的\
  \ `50` 的出现位置，因为数字 `50` 也可以用于其他必须不能更改的情况。因此，声明一个常量并在必要时将其值更改在一个点，要快得多也安全得多。这使得程序更容易维护和控制。此外，常量的名称可能比普通值（通常称为*魔数常量*）更生动地指示其作用，并使程序更易读。\n\
  \n或者，我们可以使用 `#define` 指令来声明常量。`#define` 指令用于定义宏。在大多数情况下，宏是一个代表数值的名称。要定义这样一个宏，我们这样写：\n\
  \n例如，与其使用常量 `RATE`，不如我们可以定义一个名为 `RATE` 的宏，如下：\n\n当程序被编译时，预处理器会将每个出现的 `RATE` 替换为\
  \ `50`。`RATE` 看起来像一个变量，但它与变量毫无关系。它只是一个在代码编译之前被替换为 `50` 的名称。与 `const` 变量一样，使用全大写字母命名宏是一种常见做法。与普通语句不同，注意\
  \ `#define` 指令不以分号 `;` 结尾。\n\n尽管 `const` 和 `#define` 都可以用于创建常量的名称，但它们之间存在显著差异。我们可以使用\
  \ `#define` 为数值、字符或字符串常量创建名称。然而，我们无法指定常数的数据类型。另一方面，我们可以将 `const` 用于任何类型，如数组、指针和类。其次，`const`\
  \ 常量遵循与普通变量相同的作用域规则（我们将在第 11 章中讨论），而 `#define` 常量不是。因此，`const` 的作用域可以限于特定的函数或文件。另一个区别是\
  \ `const` 常量的名称可以在调试器中查看；而 `#define` 常量则不能，因为预处理器已经将名称替换为它们的值。这些都是推荐使用 `const` 或自\
  \ C++11 的 `constexpr` 代替 `#define` 的原因。\n\n我们将在后续章节中看到 `const` 限定符的其他用法。例如，`const`\
  \ 通常在向函数传递数据时用于保护，正如我们在第 11 章中所看到的。\n\n此外，C++11 引入了 `constexpr` 限定符来声明常量。它们之间的主要区别是，`const`\
  \ 变量不要求在编译时初始化，也就是说，它可以在运行时初始化（即程序运行时），而 `constexpr` 变量必须用在编译时已知的值进行初始化。`constexpr`\
  \ 的核心思想是提高程序性能，因为计算是在编译时而不是运行时完成的。如果初始化值不是常量表达式，或者通常情况下，编译器无法初始化该变量，编译将失败。让我们来看一些示例：\n\
