  *   U.18.7 定义类 `Polynomial`，模拟形式为 `f(x) = ax² + bx + c` 的多项式。该类应包含：\n\n    1. 构造函数，初始化多项式的系数，即将\
  \ `a`、`b` 和 `c` 初始化为 1。系数应为私有成员，并假设它们是整数。\n\n    2. 构造函数，用用户输入的值初始化多项式的系数。\n\n \
  \   3. `show()` 函数，以 `ax² + bx + c` 的形式显示多项式。\n\n    4. `calc(int x)` 函数，返回多项式在值\
  \ `x` 处的结果。\n\n    5. 重载 `+` 运算符函数，以便多项式与整数之间可以加法（例如 `t1+i`，其中 `t1` 是 `Polynomial`\
