  \ `x.x.x.x`，其中每个 `x` 必须是 [0, 255] 范围整数。\n\n## 10 字符串\n\nDOI: [10.1201/9781003230076-10](https://doi.org/10.1201/9781003230076-10)\n\
  \n现在你已经学会了如何使用单个字符，我们可以继续学习字符串。字符串是存储在连续内存位置的字符序列。C++ 支持两种处理字符串的方法。第一种与 C 语言相同，即使用字符数组（`C\
  \ 风格字符串`）。C 风格字符串必须以一个特殊字符——空字符 `null` 结尾，它标识字符串的结束。它是 ASCII 集合中的第一个字符，其 ASCII 值为\
  \ 0。我们还将使用字符串类，它更安全。\n\n## 字符串字面量\n\n字符串字面量是包含双引号的字符序列。字符串字面量是一个常量。具体来说，引号不是字符串的一部分，仅起界定作用。字符串字面量可以是空的。例如，字符串字面量\
  \ `\"\"` 是单个空字符 `\\0`。\n\n### 存储字符串\n\n为了在变量中存储 C 风格字符串，我们使用字符数组。因为 C 风格字符串以空字符结尾，存储\
  \ N 个字符的数组的大小应为 N+1。例如，为了存储 4 个字符，我们写道：\n\n```cpp\nchar str[5] = \"text\";\n```\n\
  \n与普通数组一样，如果字符数小于数组的大小，剩余元素将初始化为 0。如果大于，则编译将失败。例如，使用声明：\n\n```cpp\nchar str[10]\
  \ = \"text\";\n```\n\n同样，使用声明：\n\n```cpp\nchar str[10] = {};\n```\n\n所有 `str` 元素都将初始化为\
  \ `\\0`。\n\n初始化数组的一种灵活方法是省略长度并让编译器来计算。例如，使用声明：\n\n```cpp\nchar str[] = \"text\"\
  ;\n```\n\n编译器计算 \"text\" 的长度，然后为 `str` 分配五个字节，以存储四个字符和一个空字符。如果我们使用 `sizeof(str)`\
  \ 输出其长度，我们会发现它确实是 5。让编译器计算长度更简单也更安全，因为手动计数可能会导致错误。\n\n如果缺少空字符且程序使用了库函数处理数组（例如我们之后将看到的函数），可能会产生不可预测的结果。这是因为处理\
  \ C 风格字符串的函数假设字符串是以空字符结尾的。事实上，有些程序员喜欢在声明中通过加 1 来强调这一点。例如：\n\n```cpp\nchar s[4] =\
  \ \"abc\";\n```\n\n所以注意，声明 `char s[] = \"abc\";` 和 `char s[3] = \"abc\";` 是不同的。在第一情况下\
  \ `s` 的大小为 4，存储了空字符，我们得到了 C 风格字符串；而在第二情况下大小为 3，我们没有字符串。\n\n### 写入字符串\n\n\n\n\n显示字符串有多种方法。例如，我们可以使用\
