  \n### 多个虚基类的对象构造\n\n当没有基类时，基类子对象按照它们在派生类声明中的顺序构造。如果存在，虚基类的子对象首先由最远派生类的构造函数构造，然后是非虚类的对象。如果一个类有多个基类呢？在这种情况下，虚基类的子对象首先按照它们在声明中的顺序从左到右构造。然后是非虚类的对象构造。例如：\n\
  \n为了构造 `e1`，构造函数的调用顺序如下。首先将构造 `B` 子对象，然后是 `A` 子对象，然后是 `D` 子对象，然后是 `C` 子对象，最后 `E`\
  \ 构造函数完成构造。注意，相同的顺序适用于拷贝构造函数（例如创建 `e2`），以及使用默认拷贝函数拷贝成员时（例如 `e3 = e2`）。按照惯，析构函数反序调用，首先是\
