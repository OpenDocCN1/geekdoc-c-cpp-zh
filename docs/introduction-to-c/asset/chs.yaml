  \n### char 类型\n\n由于 ASCII 集合中的字符由 0 到 255 之间的整数表示，我们可以使用 `char` 类型来存储它的值。一旦字符存储在变量中，实际存储的是字符的\
  \ ASCII 值。在下面的示例中：\n\n`ch` 的值变为字符 'a' 的 ASCII 值，即 97。因此，语句 `ch = 'a';` 和 `ch = 97;`\
  \ 是等价的。当然，'a' 比 97 更好；因为它不仅更易读，而且你的程序也不会依赖于特定的字符集。\n\n例如，如果你省略它们并写成 `ch = a;`，编译器将把\
