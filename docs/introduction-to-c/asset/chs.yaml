  \ `D = b² – 4ac`。\n\n1. 如果 `D > 0`，它有两个根 `r[1,2] = (-b ± $\\sqrt{D}$ )/2a`。\n2.\
  \ 如果 `D = 0`，它有一个双根 `r = -b/2a`。\n3. 如果 `D < 0`，它没有实根。\n\n**注释：** 由于返回类型为 `void`，我们使用指针参数，这样函数就可以返回所需的值。\n\
  \nC.11.9 在数学中，梯形法则是一种近似区间 `[a, b]` 内函数 `f(x)` 的定积分的技术。该规则通过累加用多折线近似函数时所形成的梯形面积来工作，如图所示：\n\
  \n![一张显示梯形法法的图。](img/fig11_1.jpg) <details><summary>编号图 1 的详细描述</summary>\n\n水平轴从左到右列出了值\
  \ `a = x subscript 0`、`x subscript 1`、`x subscript 2`、`x subscript 3` 等，`x subscript\
  \ n minus 2`、`x subscript n minus 1` 以及 `b = x subscript n`。垂直轴代表 `f of x`。曲线从 `a\
  \ = x subscript 0` 开始，向上凹减少，在大约 `x = x subscript 3` 处达到低点，然后再次增加，在到达拐点后变为向下凹。从每个值\
  \ `x subscript 0`、`x subscript 1`、`x subscript 2`、`x subscript 3` 等向曲线画出垂直虚线，分别在\
  \ `f of x subscript 0`、`f of x subscript 1`、`f of x subscript 2`、`f of x subscript\
  \ 3` 等处相交。在曲线上的连续点之间绘制线段，形成梯形区域。</details>\n\n该过程涉及以下步骤：\n\n1. 将区间 `[a, b]` 分分为\
  \ `N` 个等宽的子区间。因此，$x_{i} = x_{0} + \\frac{i \\times (b - a)}{N},\\quad i = 0,...,N.$。对于较大的\
  \ `N` 值，近似值越接近积分的值。\n2. 计算 `i = 0, ..., N` 的值 `f(x[i])`。\n3. 计算在多折线下方形成的 `N` 个梯形的面积并将它们相加。积分近似为：\n\
  \n$$\\int\\limits_{a}^{b}{f(x) = E_{\\tau\\rho 1} + ... + E_{\\tau\\rho N} = \\\
  frac{(x_{1} - x_{0})}{2}}$$\n\n\n\n\n\n一个生命周期与代码块内运行时间等长、且在该块之外不存在的变量被称为 `automatic`（自动），并具有\
  \ `automatic` 存储持续时间。我们在书中为止的程序中所使用的所有变量都是自动的。\n\n每次调用函数时，编译器都会分配内存来创建其局部变量。这部分内会在函数终止时被自动释放；因此，局部变量在连续的调用之间不会保留其值。因为局部变量在函数终止时就会消失，所以它是一个自动变量。总结来说，局部变量的默认属性是块作用域、无链接和自动存储持续时间。由于函数的参数实际上是局部变量，因此它们也具有相同的属性。\n\
  \n正如我们所说，C++98 支持 `register` 存储类说明符，但该说明符在 `C++17` 中被删除了。以便你遇到它，我将提供简短的描述。`register`\
  \ 符表示自动存储持续时间；它可以应用于自动变量和函数参数。`register` 变量与自动变量具有相同的作用域、链接和生命周期。将局部变量声明为 `register`（例如\
  \ `register int i;`）是对编译器的提示，表示该变量将被频繁使用，并建议将其保存在系统寄存器中以便快速访问。然而，编译器可以自由忽略该提示，并像处理其他变量一样将其存储在主内存中。现代编译器已经进化了很多，可以自己判断某些变量是否应该存储在寄存器中。因此，`C++17`\
  \ 决定没有理由保留它，并将其从语言中移除。\n\n由于局部变量的内存会被释放，因此函数不应该返回它的地址。例如：\n\n```cpp\n当调用 test()\
  \ 时，编译器为局部变量 `i` 分配内存。一旦它终止，它就会返回 `i` 的地址。然而，由于这部分内存被释放了，新数据可以存储在那里并覆盖值 `10`。因此，程序可能会输出\
  \ `10` 和一个随机值，或者两个随机值，而不是 `10` 和 `10`。程序的行为是不可预测的。最可能的，编译器会向你发出警告信息，如 *returning\
  \ address of local variable*（返回局部变量地址）。\n```\n\n然而，正如我们后面看到的，如果我们将变量 `i` 声明为 `static`，就可以安全地返回它的地址，因为为\
  \ `static` 变量分配的内存在函数终止时不会被释放。\n\n在之后的某个地方，将有一个练习来测试你是否掌握了这条规则。期待你的答案。\n\n### 在块内声明变量\n\
  \n尽管在书中的所有示例中，我们都在函数开始声明自动变量，但我们允许在复合语句的 `{` 之后声明变量。复合语句的一般形式是 `{ 声明语句 }`，这种形式指定了一个块。在块中声明的变量的作用域延伸到匹配的\
  \ `}`；因此，它不会与块外的任何同名变量冲突。默认情况下，它的存储持续时间是自动的；编译器在进入块时分配内存来存储它，在退出块时释放该内存。考虑以下程序：\n\
  \n```cpp\n因为在 `if` 块内部声明的变量 `i` 与第一个 `i` 无关，程序显示 `20`。在复合语句内部而不是函数开头声明变量的原因是，内存只有在需要时才会分配。这在为内存受限的系统编写应用程序时可能有用。连接条件语句或循环语句不需要复合语句；它可以独立存在。例如，以下程序输出\
  \ `50` 和 `20`。\n```\n\n### 全局变量\n\n声明在任何函数之外且类型具有块作用域（如枚举、类或命名空间）的变量被称为 `global`（全局）。它的作用域从声明处延伸到其声明所在文件的末尾。因此，它可以被其声明之后的所有函数访问。与自动变量不同，全局变量具有永久的生命周期并保留其最后赋值的值。在程序启动时会为其预留内存，并在程序终止时释放。总结来说，全局变量的默认属性是文件作用域、外部链接和静态存储持续时间。为了清楚起见，静态存储持续时间意味着该变量永久存在，直到程序终止。\n\
  \n当同一个变量在许多函数中使用时，许多程序员倾向于将其声明为全局变量，而不是作为参数在函数调用中传递。事实上，全局变量可以作为函数间通信数据的替代方法。注意，为了更好地控制和理解程序，为全局变量选择一个描述其角色的非常有帮助。例如，不要使用通常在局部变量中使用的无意义名称（例如\
  \ `i`）。\n\n默认情况下，编译器会将全局变量或复合类型的元素（例如数组）初始化为 `0`；然而，我更倾向于自己这样做以使其更清晰。让我们来看使用全局变量的示例：\n\
  \n```cpp\n所有函数都可以访问全局变量 `glob`，因为它在它们的定义之前声明了。程序显示 `2`。\n```\n\n尽管使用全局变量看起来很有吸引力，但你最好避免使用它们。原因之一是它难以识别错误条件。例如，如果给全局变量分配了错误值，我们必须检查所有使用它的函数以找出罪魁祸首。此外，过度依赖全局变量可能会对程序设计产生负面影响，使其更难以理解和管理。例如，读者将很难将每个全局变量与使用它的函数关联起来。通常，在每个文件可能使用数百个变量的大程序中，你应该尽可能让它们保持局部的，以便更好地管理和维护。\n\
  \n### 作用域规则\n\n局部变量可能与全局变量同名。作用域规则规定，当块内部的变量与已经可见的变量同名时，新声明会隐藏该块中的旧变量。例如：\n\n```cpp\n\
  四个名为 `a` 的变量是不同的。让我们应用作用域规则。在 `if` 条件中测试的 `a` 是 `test()` 中声明的，而语句 `a++` 指的是 `if`\
  \ 块中声明的 `a`。它的作用域延伸到 `}`，接下来的语句 `a+=20;` 增加了 `test()` 的 `a`。它的作用域延伸到函数结尾的 `}`。`main()`\
  \ 增加了全局 `a` 的值，变为 `150`。`last()` 增加了局部参数 `a`，变为 `201`。结果，程序输出：`501 320 150 201`。这个程序只是一个向你展示在使用同名时如何应用作用域规则的示例；这是一种糟糕的编程方法。正如你看到的，代码变得更难以阅读、混乱且容易出错。\n\
  ```\n\n访问全局名称可以使用作用域解析运算符 `::`。由于全局命名空间没有名称，因此在 `::` 左侧不添加内容。例如：\n\n```cpp\n在 `for`\
  \ 语句中声明名称的作用域是局部的，也就是说它延伸到它的结束。因此，我们可以在函数中多次使用相同的名称。例如：\n```\n\n### extern 的使用\n\
  \n\n\n\n全局变量可以在多个源文件中可见，也就是说，它可能具有外部链接（external linkage）。这非常有用，特别是在大型程序中，因为几个源文件可能需要共享同一个变量。`extern`\
  \ 关键字是一个存储类说明符，它允许变量在多个文件之间共享。通常，这种变量在频繁使用它的文件中声明为全局变量，其他文件则使用 `extern` 关键字引用它。\n\
  \n我们已经在 第 2 章 中讨论过变量的*声明*（declaring）与*定义*（defining）之间的区别。让我们再次看看区别。`int size;` 语句不仅声明了\
  \ `size` 的类型为 `int`，还定义了 `size`，也就是说编译器分配了内存来存储它的值。一个变量只能有一个定义；其他文件可以包含 `extern`\
  \ 声明以访问它。例如，为了在另一个文件中使用它，我们写道：\n\n```\nextern int size;\n```\n\n由于使用了 `extern` 单词，变量\
  \ `size` 仅被声明，也就是说编译器告知了变量的名字和类型。该变量没有被定义，也就是说编译器没有为它分配新内存。`extern` 单词告诉编译器变量 `size`\
  \ 定义在其他地方。链接器会将对 `size` 的引用与它在另一个文件中的定义链接。如果我们忘记了 `extern` 单词，每个文件的独立编译将成功，但链接器将显示一条错误信息，说明\
  \ `size` 被定义两次。注意，变量只有在定义时才能被初始化，因此，在第二个文件中这样写是错误的：\n\n```\nextern int size = 10;\n\
  ```\n\n如果需要，可以在任何被引用为 `extern` 的文件中访问并修改 `size`。由于编译器没有分配新内存，如果该变量是一个数组，我们可以在 `extern`\
  \ 声明中省略它的长度。例如：\n\n```cpp\nextern int size[];\n```\n\n注意，`const` 全局变量的链接以及我们在下文中看到的\
  \ `static` 变量的链接是内部的（internal），也就是说，该变量只能在包含其声明的文件中使用。例如：\n\n```cpp\nconst int size\
  \ = 10;\n```\n\n如果我们希望它具有外部链接，我们必须在它的定义中添加 `extern` 单词。例如：\n\n```cpp\nextern const\
  \ int size = 10;\n```\n\n在另一个文件中使用它，我们写道：`extern const int size;`。\n\n测试时间。找出以下示例中的错误：\n\
  \n```cpp\n```第二个文件中所有的声明都是错误的。`i` 被定义了两次，`d` 用不同的类型声明了两次，`f` 被声明了两次但没有定义。正如我所说，这些错误不会由编译器检测，而是由链接器检测。注意，`d`\
  \ 和 `f` 的错误将在程序中使用时被检测。\n\n本质上，`extern` 是位于不同文件的函数之间交换数据的一种另一种方式。虽然在文件之间共享变量非常流行，但必须小心，因为一个文件中的错误赋值可能会在使用该变量的其他文件中导致不可预测的结果。此外，使用许多\
  \ `extern` 变量的程序更难阅读和维护，因为 `extern` 变量的依赖性使得它更加复杂。因此，与全局变量一样，我尽量避免使用 `extern` 变量。我们将在本章后面的部分以及\
  \ 第 27 章 的程序中看到使用 `extern` 变量的示例。\n\n### 静态变量\n\n正如所讨论，分配用于存储局部变量的内会在函数终止时释放。因此，无法保证局部变量在再次调用函数时仍然保留其旧值。如果我们想让局部变量保留其值，我们应该使用\
  \ `static` 存储类说明符。与普通局部变量不同，`static` 变量具有静态存储期，也就是说它具有永久寿命。`static` 变量的内存只在函数第一次调用时被保留。该变量在整个程序执行过程中位于相同的内存位置，该内存在函数终止时不释放，直到程序终止。总结来说，在函数内部定义的\
  \ `static` 变量的默认属性是块作用域（block scope）、无链接和静态存储期。\n\n`static` 变量只初始化一次，即函数第一次被调用时。与全局变量一样，初始化器必须是一个常量表达式；如果没有显式初始化，默认值为\
  \ 0。在随后的调用中，它保留最后的值且不再再次初始化。例如，考虑以下程序：\n\n```cpp\n```\n\n当 `test()` 第一次被调用时，`i`\
  \ 变为 `101`。由于 `i` 被声明为 `static`，它保留了自己的值，下一次调用 `test()` 使其变为 `102`。同样，第三次调用使其变为\
  \ `103`。由于静态数组的元素默认初始化为 0，`arr[0]` 分别变为 `2`、`4` 和 `6`。另一方面，由于 `j` 是自动变量，它在 `test()`\
  \ 调用之间不保留其值。因此，程序输出：\n\n在块内部声明的 `static` 变量只在第一次进入该块时初始化。例如：\n\n```cpp\n```\n\n\
  程序输出：`101 102`\n\n使用 `static` 可能会提高性能。例如，如果在多次调用的函数内部声明一个 `const` 变量，那么将其声明为 `static`\
  \ 会更有效，这样它只初始化一次。这里有一个示例：\n\n```cpp\n```\n\n全局变量或函数的链接默认是外部的，也就是说，它们可以在不同文件中共享。然而，如果它们被声明为\
  \ `static`，链接将变为内部的，这意味着它们只在定义范围内可见。例如：\n\n```cpp\n```\n\n`flag` 和 `test()` 仅在该文件中可见，这意味着其他函数无法访问它们。特别是，`flag`\
  \ 具有文件作用域、静态存储但内部链接。将它们声明为 `static` 的主要原因是向其他文件隐藏它们，从而在不需要时防止作为 `extern` 使用。事实上，在一个由多个程序员编写的大型项目中，将函数声明为\
  \ `static` 是一个好主意。除了隐藏信息，另一个原因是如果应该修改 `static` 函数的代码，你不必担心这些更改会影响其他文件（向其他文件传递函数指针除外）。此外，你不必担心选择的名字在其他文件中也被使用，因为即使发生了也不会产生冲突。由于链接是内部的，可以在其他文件中重用相同的名称。定义内部链接的另一种方法（这也是推荐的方法）是使用匿名命名空间，我们将在\
  \ 第 25 章 中看到。然而，由于 `static` 在现有代码中非常广泛，了解它是如何使用的很好。\n\n让我们来看最后一个结合这些概念的示例。考虑以下由两个源文件组成的程序。必须编译并链接它们生成最终的可执行文件。你能告诉我它显示什么吗？\n\
  \n```cpp\n```\n\n由于 `st` 在第一个文件中声明为 `static`，它不会与第二个文件中的 `st` 冲突（无论第二个 `st` 是否声明为\
  \ `static`）。注意 `test()` 定义在第二个文件中。由于 `st` 默认初始化为 0，`test()` 显示 `10` 和 `1`。由于 `test()`\
  \ 将 `ext` 的值改为 `30`，`main()` 显示 `30` 和 `20`。\n\n### 一维数组作为参数\n\n当函数的参数是一个一维数组时，我们在数组名称后面加上一对括号。数组的长度可以省略；事实上，这是常见的做法。我稍后会解释原因。例如：\n\
  \n```cpp\n```\n\n将数组传递给函数时，我们只写它的名称，不带括号。例如：\n\n```cpp\n```\n\n\n\n所以请记住，当一个普通变量被传递给函数时，函数操作的是它的拷贝。但如果传递的是数组，则不会创建拷贝；函数操作的是原始数组。为什么采取这个决定呢？为了获得更好的性能，节省复制所有元素原本可能需要的内存和时间。传递的只是一个指向其第一个元素的指针，函数可以访问它的任何一个元素。例如：\n\
  \n注意，在 `test()` 函数中，我们可以使用名称 `a` 而不是 `arr`，因为你现在已经知道不同函数的局部变量即使命名相同，它们也是无关的。当调用\
  \ `test()` 时，我们有 `arr = a = &a[0]`。因此，语句 `arr[0] = 0;` 和 `arr[1] = 0;` 改变了前两个元素的值，程序显示：`0\
  \ 0 30 40 50`\n\n数组参数也可以被声明为指针。例如，以下声明：\n\n```c\nvoid test(int arr[]);\nvoid test(int\
  \ *arr);\n```\n\n这两种声明是等价的。编译器对两者的处理方式相同，并将指针传递给函数。因此，第二种声明更准确，因为它清楚地说明了传递的是指针，而不是数组的拷贝。然而，我更倾向于第一种，以显式表示意图是传递一个数组。第二种声明具有歧义性；读者无法判断函数接收的是多个值，还是指向单个变量的指针。\n\
  \n或者，我们可以使用指针算术来访问数组元素。例如：\n\n```c\narr[i]\n```\n\n真正有趣的是 `arr++` 这条语句。我们可以改变数组的值吗？显然不能，你从第\
  \ 8 章 中知道，当数组名被用作指针时，它是一个 `const` 指针。那么，为什么编译器允许这条语句呢？因为正如提到的，尽管 `arr` 被声明为数组，但它实际上是一个指针。因此，我们可以给它赋一个新值。再举一个例子：以下代码可以编译吗？如果是，输出是什么？\n\
  \n```c\nvoid test(int arr[]) {\n    printf(\"%d %d\\n\", arr[0], arr[2]);\n}\nint\
  \ main() {\n    int a[] = {5, 10, 30, 40, 50};\n    test(a);\n    printf(\"%d\\\
  n\", a[0]);\n    return 0;\n}\n```\n\n当然它可以编译，`arr` 被视为一个普通指针。`test()` 输出了 `10`\
  \ 和 `30`。由于 `test()` 没有访问 `a[0]`，因此程序输出 `5`。\n\n当然，和使用普通数组一样，我们确保我们所进行的所有操作都在数组的范围内。注意，如果我们愿意，可以传递整个数组，而不是指向其第一个元素的指针。我们将在第\
  \ 16 章 中看到一个带有引用的示例。\n\n### 确定数组末尾\n\n虽然我们可以使用 `sizeof` 运算符来找到数组变量的大小，但我们不能在函数中使用它来找到数组参数的大小。例如，考虑以下程序：\n\
  \n```c\nvoid test(int arr[]) {\n    printf(\"%zu\\n\", sizeof(arr));\n}\nint main()\
  \ {\n    int a[] = {1, 2, 3, 4, 5};\n    test(a);\n    printf(\"%zu\\n\", sizeof(a));\n\
  \    return 0;\n}\n```\n\n由于数组参数被视为指针，`sizeof` 运算符计算的是指针变量的大小（例如 `4`），而不是数组的实际大小。因此，程序对指针输出\
  \ `4`，对数组输出 `20`。\n\n因为实际传递到函数的是指针，所以即使我们在括号内放入数组长度（例如 `void test(int arr[5])`），它也没有影响。编译器会忽略它；它不会检查数组是否真的具有指定的长度（例如\
  \ `5`）。本质上，传递的指针是指向未知长度数组的第一个元素的指针。这就是为什么我强烈建议将括号留空；这样你就不会产生错误的印象，认为编译器会强制要求只有特定大小（例如\
  \ `5`）的数组作为参数传递。不，无论数组长度是多少，编译器都能成功编译程序。让函数知道数组长度的一种简单方法是作为额外参数传递。例如，我们可以这样声明 `test()`：\n\
  \n```c\nvoid test(int arr[], int size)\n```\n\n并编写 `test(a, 5);` 来调用它。\n\n或者，我们可以定义一个常量，例如\
  \ `const int SIZE = 5;`，并在需要的地方使用该常量，而不是传递额外的参数。另一种方法是使用一个特殊值来表示数组的末尾，当然，这个值不会出现在数组中。例如，如果数组包含一个\
  \ C 格式的字符串，就不需要传递它的长度，因为空字符表示了它的结束。\n\n另一种方法是传递第一个元素的指针以及最后一个元素之后位置的指针。例如，我们可以这样声明\
  \ `test()`：\n\n```c\nvoid test(int *begin, int *end);\n```\n\n并在调用它时写道：`test(a,\
  \ a+5);`\n\n### const 的使用\n\n为了安全起见，和使用普通数组一样，我们确保我们所进行的所有操作都在数组的范围内。注意，如果我们愿意，可以传递整个数组而不是指向其第一个元素的指针。我们将在第\
  \ 16 章 中看到一个带有引用的示例。\n\n### const\n\n虽然我们可以使用 `sizeof` 运算符来找到数组变量的大小，但我们不能在函数中使用它来找到数组参数的大小。例如，考虑以下程序：\n\
  \n```c\nvoid test(int arr[]) {\n    printf(\"%zu\\n\", sizeof(arr));\n}\nint main()\
  \ {\n    int a[] = {1, 2, 3, 4, 5};\n    test(a);\n    printf(\"%zu\\n\", sizeof(a));\n\
  \    return 0;\n}\n```\n\n由于数组参数被视为指针，`sizeof` 运算符计算的是指针变量的大小（例如 `4`），而不是数组的实际大小。因此，程序对指针输出\
  \ `4`，对数组输出 `20`。\n\n因为实际传递到函数的是指针，所以即使我们在括号内放入数组长度（例如 `void test(int arr[5])`），它也没有影响。编译器会忽略它；它不会检查数组是否真的具有指定的长度（例如\
