  \n## 创建类型别名\n\n在几种情况下，创建类型别名可以使我们的程序更灵活、更易读。为了创建别名，我们可以使用 `typedef` 关键字，并且从 C++11\
  \ 开始还可以使用 `using` 关键字。这些标识符用于为现有的数据类型创建同义词。例如，语句：\n\n```\ntypedef unsigned int size_t;\n\
  ```\n\n使得名称 `size_t` 成为 `unsigned int` 类型的同义词。因此，声明：\n\n```\nsize_t var1;\n```\n\
  \n该语法类似于变量声明（例如，如我们要声明 `size_t` 一样），前面带有 `typedef` 关键字。该名称是该类型的同义词。例如，语句：\n\n```\n\
  typedef float arr[100];\n```\n\n使得 `arr` 成为 100 个 `float` 数组的同义词。注意，`typedef`（`using`\
  \ 也同样适用）不会创建变量（即 `arr` 不是数组变量），也不会创建新类型，而是一个新名称。因此，语句：\n\n```\nfloat arr1[100];\n\
  ```\n\n将变量 `arr1` 声明为 100 个 `float` 的数组。如果我们需要将数组的类型改为 `double`，只需将 `float` 更改为\
  \ `double`。使用 `arr` 的变量声明保持不变；我们不需要更改它们。\n\n由于我们为现有类型创建了同义词，你可能认为这个功能是多余的。不，事实并非如此。例如，如果你的程序将在数据类型取决于系统的系统上运行，那么使用同义词非常有帮助。例如，语句：\n\
  \n```\ntypedef short int size_i;\n```\n\n使得所有 `size_i` 变量的类型变为 `short int`。如果这些变量在另一个平台上必须是\
  \ `int`，我们只需将 `short int` 改为 `int`，它们就变成了 `int`。因此，使用同义词有助于我们在不同需求非常方便地调整类型。\n\n\
  另一个常见用途是创建复杂类型的同义词，这样我们就不需要重复它们。例如：\n\n```\ntypedef int (*pcpy)(const char*, int);\n\
  ```\n\n`pcpy` 是一个指向函数的指针的同义词，该函数返回一个整数并接受一个 `const char*` 和整数参数。为了创建同义词，我们编写原型，并在函数名处放置表达式\
  \ `(*pointer_name)`。现在，可以使用同义词声明该类型的变量。例如：\n\n```\npcpy func1;\n```\n\n正如你所见，变量类型的读取和编写比传统方法容易得多。相反，与其创建指针的同义词（尽管这是最流行的方法），我们可以创建相应函数的同义词，然后声明指针。例如：\n\
  \n```\ntypedef int (*funcType)(const char*, int);\nfuncType* func2;\n```\n\n通常，同义词的创建被放在头文件中，以便我们在任何源文件中包含它并使用这些新名称。\n\
  \nC++11 提供了另一种通过 `using` 关键字创建同义词的方法。例如，语句：\n\n```\nusing pint = int*;\n```\n\n\
  使得名称 `pint` 成为 `int*` 类型的同义词。另一个示例：\n\n```\n\nusing void (*fp)(int);\n```\n\n名称\
  \ `fp` 成为指向接受 `int` 且返回内容的指针类型的同义词。使用 `typedef` 的相同声明为：\n\n```\ntypedef void (*fp)(int);\n\
  ```\n\n与 `typedef` 相比，`using` 语法看起来更直观。它允许我们为模板创建别名（例如，我们将在[第 16 章](#chapter16.xhtml_c16）中看到它们），这是\
  \ `typedef` 无法实现的。\n\n## 函数参数\n\n函数可以接受参数列表，用逗号分隔。每个参数前面都有其类型。正如我们稍将看到的，函数参数本质上是函数的一个变量，在调用函数时将用一个值对其进行初始化。\n\
  \n\n\n\n\n如果函数没有参数，我们使用空括号 `()`。注意，在 C 语言中，当我们想声明一个函数不接受参数时，我们会在括号内添加 `void` 关键字。在\
  \ C 中，空括号表示该函数接受任意数量的参数，而不是不接受。因为在 C++ 中，空括号表示该函数不接受参数，因此我们可以省略 `void` 单词。让我们来看一些函数定义的示例：\n\
