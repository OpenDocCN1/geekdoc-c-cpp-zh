  \ int a;`\n\n在到达 第 11 章 之前，我们将在 `main()` 中声明所有的变量。这些变量被称为自动变量，意味着它们的生命周期在程序终止时结束。它们的初始值是不确定的（即垃圾值），也就是说，变量的初始值是其内存位置上随机产生的值。例如，以下程序显示了\
  \ `i` 的初始值：\n\n```cpp\nint main() {\n    int i;\n    std::cout << i << std::endl;\n\
  \    return 0;\n}\n```\n\n通常，使用未初始化的变量是非常危险的，可能会导致程序行为不可预测。极率情况下，编译器会警告你进行这种使用，但你也应该小心。\n\
  \n变量可以在程序的任何地方声明。许多人倾向于在使用需要变量时声明它。在大多数情况下，我倾向于在每个函数的开头声明所有变量，这样阅读代码的人就可以快速了解函数的复杂性及其所使用的变量类型。此外，我觉得将它们都放在一起更方便，这样当你想要查看变量的类型时，就不需要寻找它的声明点。另一方面，在某些情况下，检查某些条件后声明变量更高效。这里有一个避免不必要的内存分配的示例：\n\
  \n```cpp\nif (condition) {\n    int x = 10;\n    // use x\n}\n```\n\n从风格上来说，我使用空行来分隔代码。作为一种风格，我使用空行将函数开始的声明与代码的其余部分隔开。为了解释更*\
  \ 变量，我们在 第 11 章 中讨论。\n\n### 值的赋值\n\n给变量赋值的传统方法是使用赋值运算符 `=`。例如，以下代码为 `a` 赋值为 2：\n\
