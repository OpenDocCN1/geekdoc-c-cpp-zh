  \ `str` 中，但其余部分将存储在数组边界外的内存中，这会导致程序出现不可预测的行为。例如，如果 `i` 的值被存储在这块内存中，该值将会发生改变。在你的系统中尝试一下。为了避免内存溢出，一种方法是使用\
  \ `setw()`。例如：\n\n现在，存储的最大数量限制为十个。特别是，如果用户输入了更多字符，前九个将存储在前九个位置，空字符存储在第十个位置。\n\n\
  请注意，如果用户输入了多个单词（例如 nice day），因为 `cin` 在遇到像空格这样的空白字符时停止读取字符，所以第一个单词会被存储在数组中（例如 nice）。剩余字符将留在输入队列中。为了能够读取包含空格的字符串，我们可以使用\
  \ `getline()` 函数，它是 `istream` 类的一个成员。正如我们在第 17 章 中看到的，调用类的成员函数，我们需要编写对象的名称（例如 `cin`）并添加\
