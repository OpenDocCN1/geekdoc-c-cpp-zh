  2. 显示已存储学生的数据。\n3. 显示最后插入的学生的数据。\n4. 删除第一个插入的学生。\n5. 程序退出。\n\n为了简单起见，我选择使用两个全局指针来处理队列。第一个指针始终指向队列的头部，第二个指针指向末尾。\n\
