  \ `t1` 和 `t2`。\n\n**答案：**\n\n`cmp()` 变为：\n\n以及 `main()` 变为：\n\n由于 `this` 指向调用者对象，表达式\
  \ `this` 等于该对象，即 `t1`。由于 `t` 指向 `t2`，`*t` 等于 `t2`。\n\n第二个。修改 `main()` 和 `cmp()`，使得\
  \ `cmp()` 接受一个引用作为参数，并返回指向 `a` 值较大的对象的引用。仅使用变量 `t1` 和 `t2`。\n\n**答案：**\n\n`cmp()`\
  \ 变为：\n\n以及 `main()` 中对 `cmp()` 的调用变为：`cout << t1.cmp(t2).a << '\\n';`\n\n另一个。以下程序是否有任何错误？如果没有，输出是什么？\n\
  \n是的，有错误。首先，是 `t` 的声明。由于在 `T` 中定义了非默认构造函数，必须定义默认构造函数使该声明有效。让我们来看 `set()`。由于它是一个\
  \ `const` 函数，`set()` 能改变 `a` 的值吗？当然不能。所以，语句 `this->a = a;` 是错误的。正如我们所说，`const` 关键字使得\
  \ `this` 指针指向 `const`。`return` 语句是错误的吗？不，因为 `this` 对应于 `t`，`set()` 返回了 `a` 的地址。最后，在\
  \ `main()` 中，对 `p` 的赋值是错误的，因为它的类型不是 `const int*`（`set()` 的返回值类型）。\n\n## 对象数组\n\n\
  对象数组是一个元素为对象的数组。例如，在程序 C17.1 中，语句\n\n`Student s[10];` 将 `s` 声明为包含十元素的数组，其中每个元素都是一个\
  \ `Student` 对象。默认构造函数会被每个创建的对象调用，也就是说被调用十次。通常情况下，我们可以使用相同或不同的构造函数来初始化数组。例如：\n\n\
  第二个构造函数用于 `t[0]` 和 `t[2]`，而默认构造函数用于 `t[1]`。由于初始化列表短于元素数量，默认构造函数会被剩下的七个对象调用。如果缺失，编译器将显示错误信息。程序显示每个对象的成员值。\n\
  \n如果我们写：`Test *p = new Test[3];` 会调用哪个构造函数？默认构造函数。多少次？三次，每个对象一个。如果默认构造函数缺失呢？在这种情况下我们应该使用另一个构造函数。这是一个初始化示例：\n\
  \n当我们写 `delete[] p;` 时会调用哪个函数？默认析构函数，再次三次。按什么顺序？正如我们所说，析构函数的调用顺序与构造顺序相反，即 `p[2]`\
  \ 先销毁，`p[0]` 最后销毁。\n\n或者，正如我们所知，可以使用元素类型为 `Test` 的对象的 `vector` 对象。例如：\n\n## 类常量\n\
  \n在声明类时，我们可能想要使用一些常量。可以使用全局变量，但由于它们只在类内部使用，根据封装理念，将它们定义在类内部更为合适。例如，假设我们使用一个常量来指定数组的大小。因为这个常量对于所有对象都是相同的，如果它只被创建一次并由所有对象共享将是最好的。例如，我们会写类似这样的：\n\
  \n\n\n为了让 `SIZE` 变量只创建一次并被所有 `T` 对象共享。然而，这是不允许的，因为类的声明并没有创建对象来为 `SIZE` 预留内存并存储其值，它只是描述了类的结构。我们可以做什么呢？在类内部定义常量的一种方法是声明一个枚举。例如：\n\
  \n枚举并没有创建类的成员。也就是说，枚举并不包含在每个 `T` 类的对象中。简单来说，`SIZE` 是一个符号名称，编译器每次在类作用域内遇到它时，都会将其替换为\
  \ 10。\n\n另一种方法是使用 `static` 常量。事实上，`static` 成员通常用于定义常量。这是合理的，因为没有必要在每次创建对象时都为同一个常量变量创建一个副本。通过将其定义为\
  \ `static`，只会被创建一个该常量的唯一实例，并在所有对象之间共享。正如我所提到的，我倾向于用大写字母来写常量，以便让它们在程序中脱颖而出。例如：\n\n\
  现在，只创建了一个名为 `SIZE` 的常量，它被所有 `T` 对象共享。正如我们在下一节中看到的，`SIZE` 并不存储在每个对象中，而是存储在程序存储其他静态变量的内存区域。`SIZE`\
  \ 在类的作用域内是可见的，调用 `f()` 输出 19。正如注释所示，如果你尝试在类外部使用它，编译器将显示错误信息。如果你使用作用域运算符并编写 `T::SIZE`，则没有问题。\n\
  \n关于初始化，有一些限制。例如，静态常量的类型必须是整数、枚举或 `constexpr` 表达式，且初始值也必须是常量。\n\n随着 C++17 引入 `inline`\
  \ 变量，初始化规则被简化。它允许我们不分变量类型地初始化变量。例如，我们可以写道：\n\n`static`、`inline` 和 `const` 关键字的顺序并不重要。\n\
  \n# 静态成员变量\n\n当我们想在类中声明一个被该类所有对象共享的变量时，我们将其声明为 `static`。`static` 变量可以在任何部分声明，并且可以被任何对象访问。它属于类整体，而不是某个特定的对象。为了向你展示一个示例，让我们在\
  \ `test.h` 文件中声明 `T` 类：\n\n与 `static` 常量一样，无论创建多少个对象，编译器都会为 `static` 变量 `num` 的单个副本分配内存。例如，如果我们创建十个对象，编译器将为十个整数\
  \ `v`、十个双精度浮 `d` 分配内存，但只为一个整数 `num` 分配内存。为 `num` 预留的内存不属于特定对象；它被保留在一个独立的区域，并由所有\
  \ `T` 对象共享。与在函数内部声明的静态变量一样，它具有永久生命周期，并且仅在类内部可见。让我们看看程序：\n\n正如我们所说，静态常量可以在类内部初始化。然而，对于非常量静态变量是不允许的。它必须在类外部定义，且不带\
  \ `static` 关键字，使用类名和作用域运算符。如果你忘记定义，将得到一个类似于 `«T::num undefined reference»` 的编译错误。\n\
  \n此类静态变量的内是在程序启动时预留的，就像全局变量一样。因此，即使没有创建 `T` 对象，`num` 也会被定义（即为它预留内存）。因为为单个 `num`\
  \ 预留了内存，`num` 是所有对象共有的，程序显示 20。如果你没有分配初始值，即编写 `int T::num;`，则 `num` 变为 0。类成员（例如\
  \ `set()`）可以直接访问静态变量，而无需使用 `::` 运算符。\n\n我们还看到，尽管静态变量不是对象的离散成员，但我们可以使用对象（例如 `t[2]`\
  \ 或指针或对象引用）来访问它。为了清楚说明该变量是静态的，我倾向于使用带有类名和 `::` 运算符的语法（例如 `T::num`）。\n\n人们可能会问，我们不能定义一个构造函数并在那里初始化\
  \ `num`，而不是进行这种“奇怪”的外部初始化吗？不，我们不能，即使允许，我们也不希望在每次创建对象时都初始化。此外，即使没有创建对象，静态成员也存在。这就是为什么我们在类外部初始化它。事实上，外部语句定义了变量。类内部的行仅声明了\
  \ `num` 是一个静态成员，它将在别处定义。C++17 通过引入 `inline` 变量放宽这一限制并简化了定义。特别是 C++17 提供了通过将静态成员标记为\
  \ `inline` 在类内定义静态成员变量的能力。例如：\n\n现在，我们不需要在类外部定义它了；将其变为 `inline` 要方便得多。此外，它是 `inline`\
  \ 的这一事实允许我们在多个源文件中包含该头文件，而不会违反单一定义规则。\n\n总结一下，只需记住，当你想要一个变量被所有对象共享时，请将其声明为 `static`。例如，在我的一个应用程序中，每个对象代表一个浏览器的标签页，我将存储机器网络地址（例如\
  \ `MAC` 和 `IP`）的成员声明为 `static`，因为这些地址是所有对象共有的。本章结束了，进入练习吧。*在本书的一些练习中，我使用 `char**`\
  \ 类型来处理字符串。我这样做是为了获得使用指针的经验，并观察危险的情况。此外，有很多代码使用了这种类型，所以了解如何处理它很有用。正如我们所说，最好的选择是\
