  \n### 异常的传递\n\n异常处理系统可以是多层级的。也就是说，每一层都尽可能处理许多问题，并将剩下的留给更高层。因此，如果异常没有被当前函数捕获，异常将传递到它的调用函数，然后从那里传递到上层调用函数，一直到\
  \ `main()`，直到在路径某处找到可以捕获该异常的 `catch` 块。如果 `main()` 没有捕获该异常，程序默认将终止。这个过程被称为*栈回溯*（stack\
  \ unwinding）。例如，让我们看看下面的代码：\n\n`h()` 中的异常被传递给上层，并最终被 `main()` 的 `catch` 块捕获，该块可以处理整数类型的异常。如果我们不是写\
  \ `throw 20;` 而是写 `throw 1.2;`，此异常将被 `f()` 的 `catch` 块捕获；而如果我们写 `throw \"Test\"\
  ;`，它将由 `g()` 的 `catch` 块捕获。如果已经声明了一个 `A` 类且 `a` 是它的对象，我们写 `throw a;`，此异常将到达 `main()`，由于没有针对\
  \ `A` 类型的 `catch` 块，程序将终止。\n\n这个示例还展示了 `throw` 机制的一个非常重要的方面。虽然 `return` 将程序的执行转移到函数调用后的第一个语句，但\
  \ `throw` 将执行一直向上转移到第一个可以捕获该异常的 `catch` 块。\n\n### 重新抛出异常\n\n当 `catch` 块捕获到一个异常时，它可能无法处理它，或者决定由更高层来处理更好。在这种情况下，你可以重新抛出异常，以便将其传递到与异常类型更相关的更高层来接管它的处理。要实现这一点，我们只需要写\
  \ `throw` 而不带任何参数。`throw` 必须在 `catch` 块内部，或者在从 `catch` 块（直接或间接地通过调用链）调用的函数内部。否则，对\
  \ `throw` 的调用会导致程序终止。重新抛出的异常是被捕获的原始异常。例如，在下面的程序中，`throw` 的初始参数将一直传递到最终处理异常的 `catch`\
  \ 块：\n\n`g()` 抛出的 `int` 异常被 `f()` 中的 `catch` 块捕获。`f()` 重新抛出它，并在 `main()` 中被捕获。`throw`\
  \ 的原始参数也被传递到了 `main()`。因此，程序显示：\n\n顺便说，这个程序也是嵌套 `try` 块的示例。正如我们在上一节看到的，`try` 块同它的\
