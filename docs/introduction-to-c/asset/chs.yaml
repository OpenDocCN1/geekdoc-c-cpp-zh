  \n### C.10.21 一个通用产品码（UPC）条形码由 12 位数字组成。最后一位是校验位，用于错误检测。要计算它的值，我们使用前 11 位，如下：\n\n\
  1. 将奇数位上的数字相加，并将结果乘以 3。\n2. 将偶数位上的数字加上上一次的结果。\n3. 将结果除以 10。用 10 减去余数，得到校验位。如果减法结果为\
  \ 10（意味着余数为 0），则使用 0 作为校验位。\n\n例如，让我们看看条形码 `123456789015` 是否正确。校验位的计算方法如下：\n\n1.\
  \ `1+3+5+7+9+1 = 26`。乘以 3  `26*3 = 78`。\n2. `2+4+6+8+0 = 20`。加上上一次的结果得到 `78+20 =\
  \ 98`。\n3. 校验值为 `10–(98%10) = 10-8 = 2`。\n\n由于最后一位是 5 而计算出的校验位是 2，因此条形码是不正确的。\n\n\
