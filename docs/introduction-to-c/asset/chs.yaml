  对于此示例，程序应该显示：\n\n## 21 关于继承的更多信息\n\nDOI: [10.1201/9781003230076-21](https://doi.org/10.1201/9781003230076-21)\n\
  \n在本章中，我们将首先讨论抽象类和纯虚函数。然后，我们将讨论私有和保护访问的继承。接下来，我们将看到如何更改基类成员的访问权限，使其与继承类型所指定的权限不同。我们还将讨论多重继承，并介绍在使用过程中可能出现的一些问题。最后，我们将讨论虚基类以及继承层次结构中静态成员的属性。\n\
  \n### 抽象类和纯虚函数\n\n当我们设计应用程序的类时，某些看似不相关的类可能具有共同的数据。例如，假设我们想开发一个管理直角三角形和矩形的应用程序。为了管理三角形，我们可以定义\
  \ `Triangle` 类，其成员为三角形的两个垂直边。为了管理矩形，我们可以定义 `Rectangle` 类，其成员为矩形的两个垂直边。此外，我们可以在两个类中都添加一个显示形状尺寸的函数（例如\
  \ `show()`）、一个计算其面积的函数（例如 `area()`）以及另一个计算周长的函数（例如 `perim()`）。\n\n为了实现这些类，我们可以使用继承并使其中某一个作为基类，但由于这两个形状之间没有关系，这种方法显得很笨拙。因此，分别定义\
  \ `Rectangle` 和 `Triangle` 类似乎更好。然而，这种方法仍然看起来效率很低。这两个类有许多共同点，但分别定义它们却忽略了这一事实。\n\n\
  一种优雅的编程方法是应用*抽象*（abstraction）的概念。那是什么呢？我们定义第三个类（例如 `Shape`），它包含了这两个类的共同成员（例如两条垂直边）和函数（例如\
  \ `show()`）。`Shape` 将作为基类，另外两个类将继承它。我们将在每个类中工作方式不同的函数声明为虚函数。例如，我们将 `area()` 声明为虚函数，因为每个形状的面积计算方式不同。由于\
  \ `Shape` 不代表具体的形状，它不需要实现 `area()`。但是，类是否允许包含一个没有定义的函数呢？是的，C++ 通过将函数声明为*纯虚函数*（pure\
  \ virtual）赋予我们这种能力。要使函数变为纯虚，我们在其声明末尾添加奇特的 `= 0` 语法。让我们看看程序：\n\n为了方便见，我将 `l` 和 `h`\
  \ 成员声明为保护（protected），以便派生类可以直接访问它们。作为 `C.20.12` 示例的替代方案，为了用一个实体管理 `Triangle` 和 `Rectangle`\
  \ 类的对象并利用多态性，我选择使用指向基类 `Shape` 的指针向量。所示，纯虚函数没有定义。它的目的是允许派生类中的函数版本能够以多态的方式调用。\n\n\
  包含至少一个纯虚函数的类（例如 `Shape`）被称为*抽象类*（abstract）。抽象类只能包含纯虚函数。注意，不允许创建抽象类的对象。也就是说，如果我们写：\n\
  \n```cpp\nShape s(1, 2);\n```\n编译器将显示错误信息。抽象类的目的是仅作为基类使用；它代表了相关实体的共同特征。由于我们无法创建对象，因此不允许按值向函数传递它或从函数返回它。但对于抽象类的指针和引用，将其作为参数或返回类型是完全合法的。事实上，为了利用虚函数的多态行为，这是非常必要的。那么，问题出现了：既然我们无法创建对象，为什么\
  \ `Shape` 要包含构造函数呢？它是为了初始化成员变量。是谁来调用它？它将由派生类的构造函数调用，以构建 `Shape` 对象。\n\n派生类中未定义的纯虚函数仍被纯虚函数。因此，派生类也变成了抽象类。例如：\n\
  \n由于 `B` 中没有定义 `g()`，`B` 变成了抽象类，因此不允许创建该类的对象。\n\n基于抽象概念的编程模型非常常见。回到这一点，类设计产生的共同元素放在基类中，而将每个派生类中实现方式不同的函数声明为纯虚函数。这种设计避免了代码的重复，从而有利于程序的维护和升级。通常，抽象类倾向于只包含纯虚函数（数据成员定义在派生类中），因此通常没有构造函数（因为没有数据成员需要初始化，不太需要构造函数）。本质上，抽象类是派生类应该提供的某种契约。\n\
  \n### 私有和保护继承\n\n除了我们在第 20 章 中看到的公有继承之外，类还可以通过私有保护访问进行派生。在私有继承中，基类的公共和保护成员变为派生类的私有成员。这意味着它们可以在派生类的函数中被访问，但在派生类外部无法访问。例如，考虑以下程序：\n\
  \n\n\n\n要声明私有继承，我们在派生类的声明中使用 `private` 关键字。由于默认的访问类型为 `private`，因此可以省略 `private`\
  \ 关键字。然而，我更倾向于加上它，以明确继承类型。对于结构体类型（structure），默认的访问类型是 `public`。例如：\n\n由于 `B` 类是以私有访问权限派自基类\
  \ `A`，因此 `A` 类的成员和函数将成为 `B` 类的私有成员。因此，`B` 类的函数（例如 `show()`）可以访问它们，但它的对象（例如 `b`）不能。\n\
  \n要派生具有受保护访问权限的类，我们在其声明中使用 `protected` 关键字。基类的公共（public）和受保护（protected）成员将成为派生类的受保护成员。因此，与私有访问一样，它们可以从派生类的函数访问，但不能从外部访问。私有继承和保护继承的主要区别在于当我们从派生类派生一个新类时。在私有继承中，第二个派生类无法直接访问基类的成员，因为这些成员在第一次派生中已经变成了私有的。例如，让我们在之前的程序添加类\
  \ `C`：\n\n由于 `A` 类的成员和函数已成为 `B` 类的私有成员，不允许从类 `C` 直接访问它们。另一方面，如果继承是受保护的，则允许访问。例如：\n\
  \n由于访问类型为 `protected`，基类 `A` 的公共和受保护成员成为派生类 `B` 的受保护成员。这些成员连同类 `B` 的公共和受保护成员，共同成为新派生类\
  \ `C` 的受保护成员。因此，函数 `h()` 可以直接访问这两个类的成员。结果是，程序显示了 30 30。\n\n现在我们已经讨论了所有类型的继承，让我们来总结一下访问基类成员的规则，以便你可以在一个地方找到它们的所有内容。假设\
  \ `B` 类派生自 `A` 类：\n\n1. 如果 `A` 是私有基类，`A` 的公共和受保护成员将成为 `B` 的私有成员，它们只能通过 `B` 的成员函数和友元函数访问。\n\
  2. 如果 `A` 是受保护基类，`A` 的公共和受保护成员将成为 `B` 的受保护成员，它们只能通过 `B` 的成员函数和友元函数访问，也可以通过派生自 `B`\
  \ 的类的成员函数和友元函数访问。\n3. 如果 `A` 是公共基类，它的公共成员可以从 `B` 的任何函数访问。`A` 的受保护成员可以从 `B` 的成员函数和友元函数访问，也可以从派生自\
