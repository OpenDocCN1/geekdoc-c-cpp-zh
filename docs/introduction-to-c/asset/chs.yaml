  由于 `str2` 不包含空字符，拷贝操作将无法成功执行，并可能发生运行时错误。\n\n例如，考虑以下程序：\n\n由于 `str` 的大小不足以容纳字符串的所有字符，`str`\
  \ 之后的数据将被覆盖（例如，`c` 可能会存储在那个位置）。\n\n是的，将未初始化的指针传递给 `strcpy()` 是一个严重的错误。例如：\n\n`strncpy()`\
  \ 函数在 `cstring` 中声明：\n\n`strncpy()` 与 `strcpy()` 类似，区别在于只有 `src` 指向的字符串的前 `count`\
  \ 个字符会被复制到 `dest` 中。如果 `count` 的值小于或等于 `src` 所向字符串的长度，则不会向 `dest` 指向的内存追加空字符。如果大于该值，则会追加空字符，直到达到\
