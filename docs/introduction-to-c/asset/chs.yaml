  \n## 22 异常\n\nDOI: [10.1201/9781003230076-22](https://doi.org/10.1201/9781003230076-22)\n\
  \n在本章中，我们将讨论异常。异常是 C++ 语言不可或的一部分。我们使用异常来捕获和识别程序执行过程中可能出现的问题（运行时错误）。它们在标准库中被广泛用于信号错误。了解异常机制的工作原理非常，这样你就可以将其集成到程序中。\n\
  \n### 异常\n\n正如你所料的，当程序运行时可能会发生错误，如果处理不当，可能会导致程序崩溃。传统的错误处理技术是使用分散的代码，让程序的每个部分都负责处理它们自己的错误。例如，当我们使用一个函数时，需要检查它是否执行成功。如果失败了，程序员应该添加代码来捕获并处理该错误。如果函数返回一个值，检查错误的典型方法是：\n\
  \n注意，如果函数没有返回值，我们可以使用指针或引用参数来获取结果。C++ 提供了异常机制作为替代的错误处理技术。异常报告运行时发生的错误。特别是，异常允许将错误检测与错误处理分离。这意味着，错误可能发生在程序的某部分，而处理则在另一个部分。该机制的哲学思想是在程序中的特定点来处理错误，而不是使用分散的代码来处理。这使得代码更简单，错误管理更易读和控制。让我们来看看一个抛出和捕获异常的典型示例语法：\n\
  \n其想法是，如果函数（例如 `g()`）中发生错误且该函数无法处理该错误，它可以使用 `throw` 语句创建一个异常，通知调用函数发生了错误。为了捕获异常，必须将可能创建异常的函数调用放在以\
  \ `try` 语句开头的块中。处理异常的代码放置在 `try` 语句之后，位于以 `catch` 关键字开头的一个或多个块中。注意，不允许在 `try` 块和第一个\
  \ `catch` 块之间，或在连续的 `catch` 块之间放置任何代码；程序将无法编译。每个 `catch` 块指定了它能捕获的异常类型。因为它处理异常，所以该块也被称为异常处理器。类型可以是基本类型，也可以是用户定义的类型。它通过\
  \ `catch` 关键字后括号内的单个参数来标识。\n\n异常的基本概念是，当程序的某部分（例如 `g()`）发生某些“异常”情况时，该部分能够通知另一部分（例如\
  \ `f()`）由于发生了了这一“异常”事件，并向该部分传递与事件相关的信息。程序员必须确定什么是这种“异常”。例如，可能导致程序功能故障的语句（如尝试除以零）就是一种“异常”。注意，“异常”事件并不总是非要是灾难性的，程序员应该指定其严重性，它可能只是无法执行某项任务。本质上，创建一个异常是程序中无法在本地处理“异常”事件的部分（例如\
  \ `g()`）将其传递给可能能够处理它的更高层级部分（例如 `f()`）的一种方式。\n\n### 捕获异常\n\n`throw` 语句创建一个异常，其参数指定了抛出异常的类型。`throw`\
  \ 会终止当前函数（例如 `g()`）的执行，并将程序执行转移到调用函数（例如 `f()`）。在那里，程序将按顺序检查 `catch` 语句，查看是否有与抛出的异常类型匹配的语句。例如，语句\
  \ `throw 20;` 创建了一个类型为 `int` 的异常并传递值 20。如果针对整数异常的 `catch` 语句，例如 `catch(int a)`，它将捕获该异常，`a`\
  \ 的值将变为 20，并执行其块中的代码。注意，如果我们写 `catch(double a)`，异常将不会被捕获，因为编译器不会执行通常的算术转换。它支持的转换是有限。特别是，它支持忽略\
  \ `const` 修饰符的类型转换。例如，`throw` 的非 `const`整数参数可以匹配 `catch` 的 `const` 整数参数。它还支持从派生类型到基类类型的转换，以及数组参数或函数到相应指针的转换。\n\
  \n`catch` 块可能包含修复问题的代码（如果可以修复的话）。如果没有，程序员可能会终止程序。剩余的块将不会被检查。注意，没有必要声明参数名称，我们可以写\
  \ `catch(int)`。通常，传递给 `catch` 语句的 `throw` 参数提供了与异常的信息，因此 `catch` 参数用于持有这些信息。\n\n\
  `catch(...)` 块是可选的，它可以捕获所有类型的异常。它捕获之前的 `catch` 块未捕获的异常。这有点像 `switch` 语句中的 `default`\
  \ 情况。注意，它应该放置在 `catch` 块的末尾。如果它放在其他地方，因为它捕获所有异常，之后可能存在的 `catch` 语句将不会被检查。如果缺少它，且异常没有被任何\
  \ `catch` 语句捕获，那么正如我们在讨论异常转发时将看到的，异常将向 `main()` 传递，直到找到匹配的 `catch` 块。如果没有找到捕获异常的块，程序将终止。\n\
  \n`catch(...)` 块在不确定调用函数是否抛出异常时特别有用。例如，即使我们不知道 `g()` 或 `g()` 调用的函数是否创建异常（当然还有它们的类型），我们可以在\
  \ `catch(...)` 块中捕获它们。由于 `catch(...)` 可以捕获任何类型的异常，有人可能会说为什么不只使用这个块来捕获所有异常，而不是浪费时间为每可能的异常类型添加单独的\
  \ `catch` 块。也就是说，编写如下代码：\n\n\n\n\n是的，你可以那样做，但这种方法没有提供关于异常的任何信息，无法妥善处理它并识别问题。如果你知道可能的异常类型，最好使用单独的\
  \ `catch` 块，显式说明可能会抛出哪些异常。这样，你就可以单独处理每个异常（某些异常可能需要更具体的处理方式）。此外，当我们讨论异常对象时，我们将看到可以获取有用信息来帮助我们处理和检测错误。\n\
  \n如果在 `try` 块中没有抛出异常，`catch` 块将被跳过，程序将继续执行最后一个 `catch` 块之后的语句。让我们来看一个例子。以下程序读取一个密码并检查它是否有效：\n\
