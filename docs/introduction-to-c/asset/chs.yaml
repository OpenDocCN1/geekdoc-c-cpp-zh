- "# C++ 入门指南\n\n\n\n![](img/cover.jpg)\n\n\n第一版出版于 2023\n由 CRC Press 出\n6000 Broken\
  \ Sound Parkway NW, Suite 300, Boca Raton, FL 33487-2742\n以及 CRC Press 出\n4 Park\
  \ Square, Milton Park, Abingdon, Oxon, OX14 4RN\n\n\n\n\n\n\n\n\n使用 Times 字体排版\n\
  \n本书献给我的家人。\n\n# 前言\n\n本书主要面向正在学习 `C++` 语言课程的学生、希望自学 `C++` 语言的人，以及具有 `C` 语言经验并想转向\
  \ `C++` 的程序员。对于正在寻找解释性编程示例以添加到讲座中的 `C++` 课程教师来说，这本书也大有裨益。\n\n本书旨在向读者介绍 `C++` 的基本原理和面向对象编程的哲学。它并没有介绍语言所有的技术和语法细节，而是试图以简单易于理解的方式介绍语言的底层概念。因此，本书并不是一本参考书；它的目标是让读者理解如何使用某个功能，而不是描述该功能的每个语法或技术细节。对技术细节的理解将随着时间和实践而积累。毕竟，你不需要了解\
  \ `C++` 的所有细节就能编写 `C++` 程序。\n\n此外，本书没有详细介绍标准模板库 (`STL`）的各种服务。它仅提供了最重要功能的概述。详细介绍\
  \ `STL` 需要一整本书。然而，由于学习 `STL` 是学习 `C++` 的不可或缺的一部分，因此在读完本书后，您应该读一本 `STL` 参考书，以熟悉 `STL`\
  \ 提供的许多实用服务和工具。\n\n那么，这本书与该领域的其他书籍究竟有何区别？本书通过提供坚实的 `C++` 理论介绍，并辅以技巧和建议，同时配有大量难度递增的示例和解析的编程练习，展示了概念是如何转变为代码的，以此测试了读者的技能。当我第一次作为学生接触\
  \ `C++` 语言时，我需要一本能够平稳地向我介绍 `C++` 语言基础知识的书，对其原理提供稳健的基础理解，一本专注于通过实践示例和有意义的建议提供内部信息和编程知识的书。这正是本书旨在捕捉的精神。\n\
  \n它以紧凑且实质的方式呈现了 `C++` 语言的精要内容，并包含了大量的解释性示例和不同难度的解析练习。通过这些内容，经常讨论语言的陷阱，以便读者理解程序员（特别是初学者，但不限于此）通常会遇到的细微调整和隐藏陷阱。书中存在读者会被诱导掉进去的陷阱。有些示例说明了看起来正常的事情如何仍然会出错。请确保，如果你能够理解书中的示例并解决练习，你就可以安全地编写更长的程序，你能够阅读更复杂的程序，并且你已经建立了坚实的基础概念和实践背景，以扩展你的知识。练习的源代码可以在\
  \ [www.cplusplus.gr](http://www.cplusplus.gr) 获取。\n\n对于是否需要了解 `C` 或其他编程语言才能读这本书的问题，答案是不需要的。本书从零开始介绍\
  \ `C++`。不需要任何先前的编程经验。此外，对于是否有人需要在学习 `C++` 之前先学习 `C` 的问题，我的意见是从 `C++` 开始。`C++` 更安全、更强大，并且具有更强的表达和技术能力。它是一门容易的语言吗？不，它包含了许多困难的概念，需要大量的练习才能理解它们并在程序中正确、高效地应用。即使是高级程序员，偶尔翻阅这本书也会受益匪浅。对于你们所有打算从事计算机编程的人，来自我经验的一些建议可能会大有用处：\n\
  \n- 编程是一项艰的任务，除了其他因素，还需要清醒的头脑、冷静、耐心、自信以及运气。当你心情不好（例如，绝对不要在你喜欢的球队输掉比赛时）、疲劳或压力大时不要写代码。\n\
  - 编写代码时，尝试用简单全面的方式编写，为了你自己，也为了那些将阅读你代码的人。记住，对复杂方式编写的代码进行调试、维护和升级是一个痛苦的过程。\n- 动手！要学习任何编程语言的功能，你必须编写自己的程序并对其进行实验。\n\
  - 编程确实是一种创造性活动，但不要忘记生活中还有许多创意、愉快且压力较小的活动。不要浪费生命在电脑屏幕前寻找无限循环、悬挂指针、抛出的异常、缓冲区溢出和错误条件。编程一段时间，然后去玩一玩。继续生活，不要一直编程。\n\
  \n祝你的 `C++` 之行顺利；虽然会有一些颠簸，但它是。\n\n\n\n\n\n`Dr. George S. Tselikis` 在雅典国立技术大学（NTUA）的电气与计算机工程学院获得了了他的硕士学位和博士学位。1998\
  \ 年，他加入了纽约哥伦比亚大学电气工程系，担任博士后研究员。他是 `4Plus S.A.`（1999–2014）的创始成员，在职期间负责网络协议和服务的开发工作。他在电信领域拥有丰富的工作经验，其主要研究方向集中在有线和无线网络中网络协议和服务的软件规范、开发和测试。他参与了许多欧洲研究项目，并与电信行业的几家公司合作。自\
  \ 2004 年以来，他一直担任多家希腊大学的客座讲师，教授与网络技术、协议通信以及编程语言相关的课程。\n\n## 1 C++ 简介\n\nDOI: [10.1201/9781003230076-1](https://doi.org/10.1201/9781003230076-1)\n\
  \n在深入接触 C++ 语言细节之前，本章将简要介绍它的历史、演变和优势。然后，我们将讨论编写首个程序时需要的一些基本概念。\n\n### 简要历史\n\nC++\
  \ 是最流行的语言之一，已用于许多广泛使用的应用程序的开发。尽管它是较老的编程语言之一，但 C++ 始终稳居位居最广泛使用和最强大的编程语言之列。`C++` 并非专门用于某个应用领域；相反，它被用于令人印象的广泛范围。例如，`C++`\
  \ 被广泛用于开发游戏应用、网络应用程序、操作系统、网络应用、金融软件、浏览器、编译器、嵌入式系统等。我们日常生活中使用的许多流行程序都是用 `C++` 编写的。此外，在跨不同计算系统和环境（如个人电脑、工作站、平板电脑和手机）开发应用程序方面，它比许多其他语言都更高效。\n\
  \n`C++` 起源于 `C`，`C` 是由 Dennis Ritchie 等人在 20 世纪 70 年初在贝尔实验室开发的。`C` 语言的快速扩张和普及度的提高促使许多公司开发了自己的\
  \ `C` 编译器。然而，由于缺乏官方标准，未被清楚描述的特征可以用不同的方式实现。结果导致同一个程序用一个 `C` 编译器可以编译，但用另一个就不行。与此同时，`C`\
  \ 语言通过增加新功能以及替换或废弃现有功能而继续演变。`C` 语言标准化的需求变得显而易见。1983 年，美国国家标准协会（ANSI）开始制定 `C` 标准，该标准于\
  \ 1989 年完成并正式批准，称为 `ANSI C` 或“标准 C”。`ANSI C` 标准还定义了一个每个 `ANSI C` 实现都必须支持的库。`C++`\
  \ 也支持该库。\n\n`C++` 的设计和开发于 20 世纪 80 年代初由 Bjarne Stroustrup 在贝尔实验室开始，作为 `C` 语言的扩展。Stroustrup\
  \ 有几个理由将 `C` 为基础开发 `C++`，例如 `C` 的简洁性、高性能、可移植性和广泛的普及率。事实上，`C++` 的名字来自 `C` 的递增运算符\
  \ `++`，该运算符会将变量的值加 1。根据 Stroustrup 的说法，这个名字代表了从 `C` 变化的演变性质。\n\n本质上，在少数例外情况下，`C++`\
  \ 是 `C` 的超集。`C` 是一种相对简单的语言。它的核心组件是控制流、迭代、数组、指针、函数和结构。这些是 `C` 程序员编写程序提供的基础工具。在 `C++`\
  \ 中，工具要多得多。在概念层面，增加最重要的特性是数据隐藏、多态、继承、对泛型编程的支持，以及为开发者提供大量工具的标准库。在设计层面，`C++` 支持基于控制流、迭代语句和函数调用（在调用时执行一组动作）的`procedural`过程化编程、基于隐藏实现细节的类型设计的`abstract`抽象编程、基于类层次结构和代表程序处理实体对象的`object-oriented`面向对象编程，以及基于模板和泛型算法（允许程序员编写类型无关的代码）的`generic`泛型编程。编写程序时结合所有这些编程设计技术的能力凸显了\
  \ `C++` 的灵活性和强大。是的，我认为对于单一语言来说，这提供的编程服务已经足够了。\n\n此外，`C++` 的一个主要目标是继续像 `C` 一样紧贴硬件，提供高效的内存使用和低层函数的高性能，同时允许开发者定义与基本类型具有相同语法支持、应用范围和性能的自定义类型。这种结合使得\
  \ `C++` 得以普及。\n\n`C++` 开始开始，，正如 `C` 语言的情况一样，发布一个标准来描述其特性是必要的。`C++` 最初于 1998 年被标准化为\
  \ `ISO/IEC 14882:1998`，后通过 `C++03`、`C++11`、`C++14` 和 `C++17` 标准进行了修订。`C++03` 主要是对\
  \ `C++98` 的技术修订，旨在修复错误并减少歧义。由于 `C++03` 没有添加新功能，`C++98` 通常被称为 `C++98/C++03`。后续版本为语言增加了新功能。`C++`\
  \ 仍在持续演变，在本书期间 `C++20` 正在进行中。\n\n### 程序生命周期\n\n`C++` 程序的生命周期涉及几个步骤：编写代码、编译代码、将生成的对象代码与所需的任何代码链接以生成执行文件，以及运行程序。通常，`C++`\
  \ 编译器提供一个集成开发环境（IDE），允许我们在不离开环境的情况下完成系列操作。\n\n### 编写 C++ 程序\n\n要编写 `C++` 程序，可以使用任何可用的文本编辑器来创建源文件。编辑器通常与编译器集成。命名源文件时，必须使用正确的扩展名来标识该文件是\
  \ `C++` 文件。扩展名取决于你使用的编译器。常见的扩展名是 `.cpp`，但 `.cc` 和 `.cxx` 等其他扩展也用于识别 `C++` 源文件。通常，一个\
  \ `C++` 程序由多个源文件组成；然后每个文件单独编译。\n\n### 我们的第一个 C++ 程序\n\n\n\n\n\n我们的第一个程序将是大多数程序员入门学习的程序的“摇滚版”版本。与经典的\
  \ *Hello world* 消息不同，我们的第一个程序将在屏幕上显示 *Ramones* 乐队的经典歌曲 *Hey Ho, Let’s Go*。大声地播放它，让我们开始吧。\n\
  \n在解释程序的每一行代码之前，让我们简要讨论一下标准库。\n\n### 标准库\n\n*library*（库）一词指的是软件资源（例如函数）的集合，这些资源通常由他人编写，我们可以在自己的程序中使用它们。标准库占据了\
  \ C++ 标准的很大一部分，并提供了大量的组件，以方便程序员工作。例如，`string` 类就是这些组件之一，它让程序员更轻松地管理字符串。每个 C++ 编译器都必须支持标准库。\n\
  \n标准库定义在一个独立的命名空间中，称为 `std`。我们稍后会讨论命名空间。标准库的服务（例如在屏幕上显示数据）通过特殊文件提供。这些文件通常被称为*header\
  \ files*（头文件），并随编译器一起提供。其中之一就是 `iostream` 文件。正如我们所说，C++ 库包含了 C 语言库。对于 C 库中的每个 `X.h`\
  \ 头文件，C++ 库中都有对应的 `cX` 头文件。字母 `c` 表示该头文件是 C 库的一部分。例如，`stdio.h` 的对应文件是 `cstdio` 文件。尽管它们的内容可能相同，但\
  \ `cX` 格式最适合 C++ 程序。特别是，包含 `cX` 文件会将该文件中定义的名称置于 `std` 命名空间中。注意，你可能会读到包含 `iostream.h`\
  \ 文件而不是 `iostream` 的程序。`iostream.h` 是 `iostream` 的旧版本，已不再被 C++ 标准支持。\n\n### #include\
  \ 指令\n\nC++ 使用一个名为预处理器（preprocessor）的软件程序。预处理器通常是编译器的一部分，它的作用是在程序编译之前对其进行处理。预处理器通过指令（directives）与编译器通信。预处理器指令指示编译器采取相应的行动。例如，通过\
  \ `#include` 指令，预处理器指示编译器在程序编译之前将 `iostream` 文件的内容包含在程序中。关于语法，指令指令始终以 `#` 字符开头，并且不以分号（`;`）或其他特殊标记结束。我们将在第\
  \ 15 章中看到更多的预处理器指令。\n\n`iostream` 文件中的字母 `i` 对应 *input*（输入），`o` 对应 *output*（输出），它包含了读取和显示数据所需的类和函数信息。如果不包含此文件，编译器将无法识别\
  \ `cout` 并导致编译失败。要包含标准库的文件（如 `iostream`），我们将文件名放在尖括号 `<>` 中。被包含的文件也可能包含 `#include`\
  \ 指令并包含其他文件。通常情况下，当我们在程序中使用标准库的组件时，应该包含对应的头文件。例如，如果我们正在使用 `string` 类，我们需要包含 `string`\
  \ 文件。包含文件的顺序并不重要。通常的做法是将 `#include` 指令放在文件的开头。\n\n当你熟悉了 C++ 语言后，你可能会编辑自己的头文件并将它们包含在你的程序中。要包含你自己的头文件，你将它的名称放在双引号（`\"\
  \"`）中。\n\n当程序被编译时，编译器会搜索被包含的文件。搜索规则取决于实现方式。通常，如果文件名被括在 `<>` 中，编译器将在包含标准库头文件的预定义目录中搜索。如果它被括在双引号（`\"\
  \"`）中，编译器通常从包含源文件的目录开始，然后搜索预定义目录。如果找不到文件，编译器将产生错误信息并且编译失败。文件名可以包含相对路径或全路径信息。例如：\n\
  \n然而，最好避免包含路径或驱动器信息，因为如果你的程序被传输到另一个系统，它的编译可能会失败。\n\n一旦你熟悉了这种语言，你就可以打开被包含的文件（例如 `iostream`）并阅读它们。不要只把它们视为隐藏未见秘密的神秘知识来源。它们是存在于你计算机上的文本文件。找到它们并查看其内容。它是获取额外知识和信息的极佳来源。\n\
  \n### main() 函数\n\n每个 C++ 程序必须包含一个名为 `main()` 的函数。`main()` 单词必须用小写字母编写。程序的代码或函数体必须被括在大括号（`{}`）中。语句（statement）是在程序运行时执行的命令。语句通常单独成行写，并且几乎总是每条语句都以分号（`;`）结束。尽管编译器并不关心程序的布局，但适当的缩进和间距会让你的程序更易读。大括号用于将声明和语句分组为一个块或复合语句，编译器将其视为一个整体。除了函数外，我们将在控制语句和循环中使用大括号。\n\
  \n`main()` 顾如其名，是任何程序的主函数。我们将在第 11 章中讨论函数。简单来说，函数是一系列被组合在一起并命名的声明和语句（例如 `main()`）。函数通过其名称被调用以执行特定任务，并可能可选返回一个值。当程序运行时，操作系统会*自动*调用\
  \ `main()` 函数。程序的执行从 `main()` 的第一语句开始，到 `main()` 的最后语句执行时结束，除非提前调用了退出语句（例如 `return`）。当然，如果在程序执行过程中发生了严重错误（例如除以零），程序将异常终止。`int`\
  \ 关键字表示 `main()` 在终止时必须向操作系统返回一个整数。该值通过 `return` 语句返回；值 0 表示正常终止，而非零值表示某种失败。这种 `main()`\
  \ 的声明相当常见。然而，你可能会看到其他的声明，例如：\n\n正如我们将在第 11 章中看到的，`void` 关键字表示 `main()` 不返回任何值。尽管\
  \ C++ 编译器可能接受这种声明，但它符合标准，因为 `main()` 必须返回一个值。另一种常见的声明是：\n\n`void` 单词显式地表示 `main()`\
  \ 不接受参数；然而，它的使用是没有必要的，因为空括号 `()` 已经表示了这一点。\n\n\n\n\n\n`cout` 是一个声明在 `std` 命名空间中的对象，它与预定义的标准输出（例如屏幕）相关。`cout`\
  \ 知道如何显示各种数据，包括字符串、数字和单个字符。在 C++ 中，包含在 `\"\"` 中的一系列字符被称为`字符串字面量`（string literal）。`<<`\
  \ 符号表示该字符串被发送到 `cout`。正如我们在第 3 章中将看到的，换行符 `\\n` 会将光标移动到下一行的开头。我在字符串末尾添加 `\\n` 的主要原因是，像\
  \ `Press any key to continue`（按任意键继续）这样的消息（某些编译器可能会在程序结束后显示此类消息）会出现在下一行。\n\n 编写风格\n\
  \n关于程序的语法，大括号 `{}` 并不非要放在单独的行中。例如，我们可以在 `main()` 旁边添加 `{` 并编写 `main(){`，或者在 `return`\
  \ 语句旁边写 `}`。此外，没有必要对代码进行缩进。正如你所想的，编写程序有许多方法。例如，我们可以写 `main(){` 并将代码放在单行大中；然而，这种选择会让我们的程序变得难以阅读。一行可能包含多个语句。例如，以下写法是合法的：\n\
  \n除了任何人可能有的偏好之外，真正重要的是编写程序的方式不仅要让编写者易读，也要让其他阅读它的人易读。为了提高可读性，我倾向的编写风格是始终将 `{}` 放在单独的行中，每个语句占一行，并对代码进行缩进。\n\
  \n 命名空间\n\n让我们简要介绍一下命名空间（namespaces）。C++ 允许在公共命名空间中对数据进行分组（例如类、函数、变量等……）。因此，命名空间是程序的一部分，其中声明了某些名称（例如变量）。这些名称在该区域之外是不可知的。例如，标准库的所有名称都定义在一个名为\
  \ `std` 的命名空间中。正如我们在第 25 章中将看到的，为了访问命名空间的元素，我们必须编写命名空间，后跟作用域解析运算符 `::`。例如，当我们写 `std::cout`\
  \ 时，我们访问的是声明在 `std` 命名空间中的 `cout` 对象。如果我们想让 `std` 命名空间中的所有名称可用，我们写：\n\n`using namespace\
  \ std;`\n\n现在，我们不需要在使用的名称前添加 `std::` 前缀，也就是说，我们可以写：\n\n`cout <<`\n\n或者，我们可以只让使用的名称可用。这是通过使用相应的\
  \ `using` 声明实现的。例如：\n\n`using std::cout;`\n\n现在，我们使用 `cout` 时不需要添加 `std::` 前缀，但在使用其他\
  \ `std` 标识时，我们必须添加它。我通常遵循的习惯是为我使用的名称编写单独的 `using` 声明，或者如果这些名称在程序中出现次数不多，则使用前缀，就像我在第一个程序中使用\
  \ `std::` 所做的那样。我倾向于使用单独的 `using` 声明而不是整个命名空间的原因是，明确我从该命名空间使用了哪些元素。偶尔，如果使用的名称很多，为了方便编写和阅读代码，我会让整个命名空间可用。在某些程序中，如果我声明了整个\
  \ `std`，尽管名称并不多，但这是为了本书的页面格式以节省一些行数。我们将在第 25 章详细讨论命名空间。目前，只需要知道通过命名空间，C++ 允许不同的空间包含相同名称的元素（例如变量），这些可以在程序中使用而不会在之间产生冲突。\n\
  \n 添加注释\n\n添加注释可以提高程序的可读性，并使其更容易理解其工作原理。注释以 `//` 开始，并在行尾结束。编译器会忽略注释，因此注释不会增加可执行文件的大小，不会影响程序的运行，也不会增加执行时间。例如，添加了两个注释：\n\
  \n```\n// This is a comment\n// This is another comment\n```\n\nC++ 还支持使用 `/* */`\
  \ 插入注释。编译器会忽略 `/* */` 之间的包含任何内容。如果注释跨多行，我们可以在每行的开头使用 `//` 或 `/* */`。这取决于个人喜好。我倾向于对单行注释使用\
  \ `//`，而对多行注释使用 `/* */`。例如：\n\n```\n/* This is a\n   multi-line   comment */\n```\n\
  \n不允许嵌套注释。例如，以下代码是非合法的，编译器将抛出错误信息：\n\n```cpp\n/* This is a comment\n   /* Nested\
  \ comments are not allowed */ */\n```\n\n在编写程序时添加注释是必须的。一个解释性的程序可以在你需要修改它时节省你的时间和精力，并节省其他可能需要理解和演进你程序的人的时间。最可能受益于注释的人将是你自己，当你将来在某时刻回到那段代码，却不确切记得你为什么要那样写代码时。事实上，在过去我多次后悔在程序的非显而易见部分没有添加注释，因为我以为我总是能明白自己在写什么。我是错的，并为此付出了代价。\n\
  \n\n\n\n\n`Console Application 1.cpp` 文件包含以下代码：\n第 1: `#include <iostream>`\n第 2:\
  \ `int main()`\n第 3: `{`\n第 4: `std::cout << \"Hey Ho\\nLet's Go\";`\n第 5: `return\
  \ 0;`\n第 6: `}`\n有一个箭头从 `int main` 指向右括号。窗口最底的任务面板有两个选项，`Error list`（错误列表）和 `Output`（输出），当前选择了\
  \ `Output`。输出窗口在主屏幕下方打开，有一个 `Show output from`（显示输出来源）选项，并在下拉菜单选择了 `Build`（构建）。显示以下行：\n\
  第 1: `1> Build started: Project: Console Application 1, Configuration: Debug Win\
  \ 32.`\n第 2: `1> Console Application 1.cpp`\n第 3: `1> Console Application 1.vcxproj\
  \ C:\\edu\\projects\\cplusplus_test\\Console Application 1\\Debug\\Console Application\
  \ 1.exe`\n第 4: ` Build: 1 succeeded, 0 failed, 0 up to date, 0 skipped.`\n\n当我们编译并运行程序时，会显示输出控制台。\n\
  \n![Microsoft Visual Studio 输出控制台窗口的截图](img/fig1_2.jpg)\n\n输出屏幕的标题为 `\"C:\\edu\\\
  temp\\Debug\\first.exe\"`。显示以下行：\n第 1: `Hey Ho, Let's Go.`\n第 2: `Press any key\
  \ to continue`（按任意键继续），末尾有光标符号。\n\n当程序编译时，编译器会检查程序的语法是否符合语言规则。如果编译失败，编译器会告知程序员失败原因。如果编译成功，编译器会生成一个对象文件，该文件包含翻译成机器语言的源代码。默认情况下，它的名称与包含源代码的文件相同，取决于操作系统，其扩展名为\
  \ `.obj` 或 `.o`。例如，对象文件名可能是 `first.obj`（Windows）或 `first.o`（Unix/Linux）。\n\n###\
  \ 链接 (Linking)\n\n在成功编译后，链接器会将上一步产生的对象代码与程序使用的库代码以及其他必要信息链接起来。库代码包含了程序所使用的类和函数的机器代码。这些代码包含在编译器提供的库文件中，通常具有\
  \ `.lib` 扩展名。例如，`sqrt()` 函数的代码就在此类文件中。\n\n为了清楚起见，头文件和库文件由编译器提供；头文件包含程序组件的信息（例如函数声明），而库文件包含机器语言的实现代码（例如函数定义）。此外，在某些情况下必须显式加载必要的库。例如，如果你使用\
  \ `g++` 编译器且你的程序（例如 `test.cpp`）使用了数学函数（例如 `sqrt()`），你可能需要通过编写 `g++ test.cpp –lm`\
  \ 来加载数学库。在集成环境中，通常可以找到一个名为 `Build` 或 `Make` 的菜单命令，它可以在一步内完成程序的编译和链接。\n\n如果链接成功，就会创建一个可执行文件。例如，`g++`\
  \ 编译器生成的可执行文件默认名称为 `a.out`，而 `Microsoft` 编译器生成的可执行文件与源文件同名，扩展名为 `.exe`。\n\n可执行文件是针对特定系统生成的，也就是说，在\
  \ `Windows` 系统上创建的可执行文件无法在 `Mac` 上运行。那么源代码呢？如果代码可以在无需任何修改的情况下在多种系统上成功编译，我们就说该程序是可移植的（portable）。\n\
  \n### 运行程序 (Run The Program)\n\n运行程序有多种方法。例如，如果可执行文件是由 `g++` 编译器生成的，在命令行中输入：\n\n\
  ```bash\n./a.out\n```\n\n如果显示类似 `No such file or directory` 或 `command not found`\
  \ 的错误信息，输入：\n\n```bash\n./\n```\n以便在当前文件夹中搜索文件。在 IDE 中，通常可以找到类似 `Build->Execute`\
  \ 的菜单命令来运行程序。\n\n### 错误 (Errors)\n\n错误可能出现在程序开发的所有阶段。编译器报告的错误称为编译错误，链接器报告的错误称为链接错误，程序运行时运行的错误称为运行时错误或逻辑错误。正如你所猜测的，后者是最糟糕的类型。\n\
  \n最常见的编译错误是语法错误。例如，如果你在 `cout` 中写 `<` 而不是 `<<`，或者漏掉双引号，或者没有在结尾添加 `;`，编译就会失败，编译器将显示错误信息。拼写错误也非常常见。例如，如果你写\
  \ `mein`，编译就会失败。C++ 是一种区分大小写的语言，这意味着它能区分大写和小写字母。例如，如果你写 `Cout` 而不是 `cout`，编译就会失败。\n\
  \n如果编译器显示许多错误，请修复第一个错误以及任何明显的错误并重新编译程序。通常，一个错误就会导致编译器显示比实际存在的更多的错误。新的编译可能会显示更少的错误，甚至没有错误。此外，请注意编译器检测到的错误可能并未发生在指定的行，而是在之前的某行，最可能是紧邻的前的一行。\n\
  \n除了错误信息外，编译器还可能显示警告信息。如果只有警告信息，程序将被编译。然而，不要忽略它们；它们可能会警告你的程序可能存在功能故障。事实上，为了更好地控制程序，将警告级别设置为编译器支持的最高级别更安全，以便捕捉所有警告。\n\
  \n理解这一点非常重要：编译器检测到的错误是因为语言使用不当，而不是由于你程序中可能存在的逻辑错误。编译器并不“在你的脑子里”，不知道你意图要做什么。因此，编译成功并不意味着你的程序会按你预期运行。我再次强调这一点，特别是对于初学者。*如果你的程序编译通过了，并不意味着它会按你想要的方式运行。例如，如果你想写一些代码，当整数变量\
  \ `a` 的值小于 5 时显示单词 `Less`，你写道：\n\n```cpp\nif (a > 5) {\n    std::cout << \"Less\"\
  ;\n}\n```\n\n那么，尽管这些行会被成功编译，但代码不会显示 `Less`。这种错误是编译器检测不到的逻辑错误 `(bug)`。将 `bug` 一词作为编程错误的同义词归于数学家兼计算机科学家格蕾斯·霍珀（Grace\
  \ Hopper），当时她发现计算机内部的一个隐藏 bug 导致了它的异常运行。\n\n\n\n\n\n关于本书的语言表达，我想并没有特别之处。如果某些代码被标记为\
  \ `program behaviour is undefined`（程序行为未定义），这意味着该程序可能会继续运行、崩溃或产生意外的结果。所有情况都是可能的。最可能的情况是什么呢？根据墨菲定律，它会在开发阶段运行正常，在你进行公开演示时崩溃。此外，即使你的程序在某个编译器上运行正常，它在其他编译器或同一编译器的下一个版本上可能会失败。因此，请避免可能导致\
  \ `undefined behaviour`的行为。\n\n如果某些代码被标记为 `the result depends on the implementation`（结果取决于实现）或\
  \ `it is platform dependent`（取决于平台），这意味着如果你用另一个编译器编译程序，或者将其转移到另一个系统并编译，该代码可能会产生不同的结果。你可以想象，调试一个在一个系统上运行正常但在另一个系统上运行的程序是非常痛苦的过程。因此，如果你希望你的程序具有可移植性，请编写依赖于你工作所在系统的代码。\n\
  \n根据我的经验，学习编程语言的第一步是通过代码示例。你将在书中发现许多示例。有些只是代码片段，而另一些是帮助你理解材料的完整程序。在理解（而不仅仅是阅读）一个主题后，下一步是编写代码来测试你的知识。你不能仅仅通过读书来学习编程语言；你必须编写代码。因此，每章都提供了许多编程练习。一个程序可以用多种方式编写。在阅读练习时，我的建议是隐藏答案并编写你自己的版本。然后对比解决方案。特别关注所有类型为“以下程序的输出是什么？”的问题。不要急着看答案；隐藏它，给自己留一点时间。每章末都有一些未解决的练习以供更多练习。在继续下一章之前，始终尝试它们来测试你的技能和对所学内容的理解。记住，要学习任何编程语言，你必须编写自己的程序并对其进行实验；动手操作，这是唯一的途径。\n\
  \n*C++ 是一门强大的语言，具有许多特性、规则和概念。所以，如果书中的某些文本或示例让你难以理解，请不要感到失望。这种感觉是正常的。克服此类困难的最佳方法是编写小型简单的程序并对其进行实验，这样你就能逐渐熟悉语言的特性及其工作原理。*\n\
  \n哦对了，差点忘了，正如你在第一个程序中“听到”的那样，你需要一对扬器……\n\n## 2 变量、常量与算术转换\n\nDOI: [10.1201/9781003230076-2](https://doi.org/10.1201/9781003230076-2)\n\
  \n在本章中，我们将学习基本数据类型，并查看如何使用它们在程序中声明变量。在进入后续章节时，我们将学习构建基于基本类型的复合类型，例如数组和结构体。本章还讨论了算术转换和常量变量。\n\
  \n### 变量\n\n计算机的 RAM（随机存存储器）由数百万连续的内存单元组成，用于存储数据。每个单元的大小为一个字节。例如，一个拥有 8GB（吉字节）内存的\
  \ PC 将拥有 8 × 1024 × 1024 × 1024 字节。\n\n`variable`（变量）是一个给定名称的内存位置。变量的值是其内存位置的内容。\n\
  \n### 变量命名\n\n命名遵循一些基本规则：\n1. 名字可以包含字母、数字和下划线。\n2. 名字必须以字母或下划线开头。\n3. C++ 是区分大小写的，这意味着它区分大写字母和小写字母。\n\
  4. 下列关键字不能用变量名，因为它们具有特殊含义：\n\n| `and` | `const_cast` | `friend` | `template` | `volatile`\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `and_eq` | `continue` | `goto`\
  \ | `private` | `this` | `wchar_t` |\n| `asm` | `default` | `if` | `public` | `true`\
  \ | `xor` |\n| `bitand` | `delete` | `int` | `register` | `try` | `xor_eq` |\n|\
  \ `bititor` | `double` | `long` | `reinterpret_cast` | `throw` | | |\n| `bool` |\
  \ `dynamic_cast` | `return` | `typedef` | | | |\n| `break` | `else` | `mutable`\
  \ | `short` | `typeid` | | |\n| `case` | `enum` | `namespace` | `signed` | `typename`\
  \ | | |\n| `catch` | `explicit` | `new` | `sizeof` | `union` | | |\n| `char` | `extern`\
  \ | `not` | `static` | `unsigned` | | |\n| `class` | `false` | `not_eq` | `static_cast`\
  \ | `using` | | |\n| `compl` | `float` | `operator` | `struct` | `virtual` | | |\n\
  | `const` | `for` | `or` | `switch` | `void` | | |\n\nC++11 还预留了以下内容：`export`、`final`\
  \ 和 `override`。此外，单词 `asm` 允许程序员添加汇编语言编写的代码。本书解释了每个关键字的含义，`thread_local` 除外。只需知道\
  \ `thread_local` 用于线程中声明局部变量。本书不讨论线程。\n\n1. 为了避免命名冲突，不要选择以一个或两个 `_`字符开头的名字，因为这些选择被留给标准库使用。此外，不要使用编译器使用的名称，例如库函数或变量的名称（例如\
  \ cout）。虽然允许这样做，但它是令人困惑且危险的。因此，将预定义名称视为保留字来处理是更安全的。\n\n除了之前给出的规则，在命名变量时还有一些很好的遵循惯例。虽然编译器不强制执行这些规定，但这些“经验法则”往往能让你的程序变得更容易理解，对于阅读你代码的人也是如此。\n\
  \n\n\n\n\n在必要时，不要害怕使用长名称来描述变量的角色。如果变量名由多个单词组成，通常的做法是使用划线字符 `_` 将它们分隔，以提高可读性。例如，你可以将存储天数的变量命名为\
  \ `days_number`，而不是 `daysnumber` 或其他可读性差的名称。通常，无论你选择哪种方法，保持一致并贯穿应用于整个程序都是好的。\n\n\
  ### 数据类型\n\nC++ 提供了一组数据类型。每个变量必须有一个类型。类型决定了分配给变量的内存量、可以赋值给它的值范围，以及可以应用于它的操作类型。类型的大小取决于实现，也就是说，它在不同系统之间可能会有所不同。32\
  \ 位系统中的数据类型及其常见大小如表 2.1 所示。\n\nTable 2.1 数据类型\n\n| 数据类型 | 常见大小（字节） | 值范围（最小-最大）\
  \ |\n| --- | --- | --- |\n| `bool` | 1 | false/true |\n| `char` | 1 | −128 … 127\
  \ |\n| `wchar_t` | 2 | −32.768 … 32.767 |\n| `short int` | 2 | −32.768 … 32.767\
  \ |\n| `int` | 4 | −2.147.483.648…2.147.483.647 |\n| `long int` | 4 | −2.147.483.648…2.147.483.647\
  \ |\n| `float` | 4 | 最小正值：1.17*10^(−38) 最大正值：3.4*10³⁸ |\n| `double` | 8 | 最小正值：2.2*10^(−308)\
  \ 最大正值：1.8*10³⁰⁸ |\n| `long double` | 12, 16 | |\n| `unsigned char` | 1 | 0 … 255\
  \ |\n| `unsigned short int` | 2 | 0 … 65535 |\n| `unsigned int` | 4 | 0 … 4.294.967.295\
  \ |\n| `unsigned long int` | 4 | 0 … 4.294.967.295 |\n\nC++11 增加了以下类型：\n\n- `char16_t`:\
  \ 用于存储 16 位字符集，例如 UTF-16。\n- `char32_t`: 用于存储 32 位字符集，例如 UTF-32。\n- `long long int`:\
  \ 用于非常大的整数（例如至少 64 位）。`sizeof(long) <= sizeof(long long int)` 是合法的。\n\n`char`、`short`、`int`\
  \ 和 `long` 类型用于存储整数值，可以是有符号的也可以是无符号的。如果我们添加 `unsigned` 单词，变量将没有符号位，它可能只存储正值或零。`int`\
  \ 单词可以省略。例如，使用 `long` 代替 `long int`。此外，这些单词可以任意顺序混合。例如，声明 `unsigned long int a;`\
  \ 与 `int long unsigned a;` 是相同的。\n\n除 `char` 类型外，所有其他类型默认都是有符号的。在有符号类型中，最左侧位保留用于符号。如果数字是负数，则其值为\
  \ 1，否则为 0。使用 `unsigned` 类型的优势是它们的上限比对应的有符号类型更高，因为它们不需要考虑负值。\n\n字符通过特定的数值代码表示。`char`\
  \ 类型通常用于存储基础字符集中字符的数值代码，例如 ASCII 字符集（例如，它包含了键盘上出现的字符，如数字、字母、标点符号等）。`wchar_t` 类型用于存储更大字符集（如\
  \ Unicode）中字符的数值代码。\n\n`char` 类型可以是有符号或无符号的，这取决于实现。因此，如果这对你的程序很重要，你应该显式地写 `signed\
  \ char` 或 `unsigned char` 而不是 `char`。例如，如果我们写道：\n\n```\nthe value of b is unspecified.\
