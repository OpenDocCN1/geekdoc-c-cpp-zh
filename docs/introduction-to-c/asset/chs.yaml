  \n## 文件\n\nDOI: [10.1201/9781003207624](https://doi.org/10.1201/9781003207624)\n\
  \n现实程序通常需要对文件进行操作。C++ 处理输入输出的方式正如。在本章中，我们将讨论文本文件和二进制文件，还将描述打开文件的模式，以及如何使用它们来读取和存储数据。\n\
  \n流\n\n正如我们所说的，流指的是从源进入程序或从程序流向目标的字节流。如果流是进入的（例如来自键盘），则被称为输入流；如果流是流出的（例如到屏幕），则被称为输出流。在我们目前的所有程序中，输入流与键盘关联，输出流与屏幕关联。大型程序可能需要额外的流，例如与磁盘文件相关的流，……\n\
  \n到此为止，我们讨论了 `cout` 和 `cin` 对象。例如，`cout` 与标准输出流（例如屏幕）关联。由于 `cout` 是 `ostream` 类的对象，它拥有与输出格式相关的成员（例如字段宽），以及一个用于存储显示信息的内存缓冲区。例如，如果我们写：\n\
  \n```\n消息存储在由 cout 管理的内存中。\n```\n当我们说 `cout` 代表输出流时，基本上意味着信息像流一样，从程序通过 `cout` 对象流向输出（例如屏幕）。同样，当我们说\
  \ `cin` 代表输入流时，意味着信息像流一样，从输入（例如键盘）通过 `cin` 对象流向程序。在本章中，我们将讨论与文件相关的流，即输出重向文件，反之，输入来自文件。\n\
  \n为了从流（例如 `cin`）读取数据，许多程序员倾向于使用如下表达式：\n\n```\ncin >> a;\n```\n\n这两个循环的工作方式相似。例如，`operator>>`\
  \ 函数从流中读取一个值，将其存储在 `a` 中，并返回流的引用。如果发生读取错误或没有更多数据，条件将变为假，循环终止。现在你已经有了经验，可以再次阅读示例\
  \ C3.8 来检查用户输入的整数值。正如我所说，为了简化书中的程序，我没有在每次输入输出操作后检查流的状态。然而，在专业应用程序中，你应该检查它。\n\n###\
  \ 流状态\n\n在流上执行操作（例如写入数据）后，我们应该检查流的状态以判断操作是否成功。如下，程序可以检查某些特定值（标志）或调用相应的函数来确定是否发生了错误。每个标志都是单比特，并且它们声明在\
  \ `ios_base` 类中。\n\n| 标志 | 描述 | 函数 |\n| :--- | :--- | :--- |\n\n\n\n\n\n| 变量 | 描述\
  \ | 功能 |\n| :--- | :--- | :--- |\n| `badbit` | 如果发生不可恢复的错误，其值将变为 1。 | `bad()` 如果\
  \ `badbit` 的值为 1，则返回 `true`。 |\n| `failbit` | 如果输入/输出操作失败，其值变为 1。 | `fail()` 如果\
  \ `badbit` 或 `failbit` 的值为 1，则返回 `true`。 |\n| `eofbit` | 如果到达文件末尾，其值变为 1。 | `eof()`\
  \ 如果 `eofbit` 的值为 1，则返回 `true`。 |\n| `goodbit` | 如果没有发生错误，其值将变为 0，即如果之前的三个值均为 0。\
  \ | `good()` 如果没有发生错误，则返回 `true`。 |\n\n还有一个 `clear()` 函数，它以 0 作为默认参数。例如，语句 `clear();`\
  \ 会清空 `badbit`、`failbit` 和 `eofbit` 的值。在一般情况下，如果设置了 `badbit`、`failbit` 或 `eofbit`\
  \ 之一，并且你想再次使用该流，你应该清除它以重置流的状态。\n\n检查流状态的典型方法是使用 `operator!` 函数。例如，为了检查 `cin` 的状态，我们可以写：\n\
  \n```cpp\nif (!cin)\n```\n\n如果发生了错误，该条件将变为真。\n\n### 二进制文件与文本文件\n\n*文本*文件由一行或多行组成，这些行包含了根据标准格式（如\
  \ ASCII 码）的可读字符。文本文件非常易于读写，因为我们可以使用任何可用的编辑器来处理它。每行都以操作系统用于指示行结束的特殊字符结束。例如，在 *Windows*\
  \ 系统中，`\\r`（回车）和 `\\n`（换行）字符对对（即 CR/LF，其 ASCII 码分别为 13 和 10）表示行的结束。因此，当在写入文本文件时，换行符\
  \ `\\n` 会被替换为 `\\r` 和 `\\n`。在读取文件时会发生相反的替换。另一方面，这种替换在 *Unix* 系统中不会发生，因为 `\\n` 字符本身就表示行的结束。\n\
  \n与*文本*文件不同，*二进制*文件的字节并不一定代表可读字符。例如，一个可执行的 C++ 程序、图像或声音文件都是以二进制形式存储的。如果你打开它，可能会看到一些无法理解的字符。二进制文件不分行，且不进行任何字符转换。例如，在\
  \ *Windows* 中，当写入二进制文件时，换行符不会被扩展为 `\\r\\n`。\n\n*文本*文件和*二进制*文件之间的另一个区别是，操作系统可能会文本文件的末尾添加一个特殊字符来标记其结束。例如，在\
  \ *Windows* 中，`Ctrl+Z` 字符标记文本文件的结束。另一方面，二进制文件中没有字符具有特殊含义，它们都被视为相同的。\n\n与文本文件相比，在二进制文件中存储数据可以节省空间。例如，假设我们正使用\
  \ ASCII 字符集在文本文件中写入数字 47654。由于这个数字由五个字符表示，该文件的大小将为 5 字节，如下图所示：\n\n![一个数组表示大小为 5\
  \ 字节的文本文件中数字 47654。](img/fig24_1.jpg)\n<details><summary>无编号图 1 的详细描述</summary>\n\
  5 个字符的数组一行显示，每个字符包含 8 位。从左到右，数字为 4 7 6 5 4。最左侧的字符 4 等于 0 0 1 1 0 1 0 0。下一个字符 7 等于\
  \ 0 0 1 1 0 1 1 1。下一个字符 6 等于 0 0 1 1 0 1 1 0。下一个字符 5 等于 0 0 1 1 0 1 0 1。最右侧的字符 4\
  \ 等于 0 0 1 1 0 1 0 0。\n</details>\n\n另一方面，如果这个数字以二进制形式存储，文件的大小将仅为 2 字节，如下图所示：\n\n\
  ![一个数组以二进制形式表示十进制数字 47654。](img/fig24_2.jpg)\n<details><summary>无编号图 2 的详细描述</summary>\n\
  十进制形式的 47654 对应的二进制形式为 1 0 1 1 1 0 1 0 0 0 1 0 0 1 1 0 (base 2)。并排排列的 2 位字段数组显示左侧的二进制\
  \ 1 0 1 1 1 0 1 0 和右侧的二进制 0 0 1 0 0 1 1 0。\n</details>\n\n二进制文件似乎是更好的选择；但它们也有一些缺点。当二进制文件从一个系统传输到另一个系统时，数据的表示可能不同，因为不同的系统可能以不同的方式存储它们。例如，一个系统可能会以不同的方式存储数据。\n\
  \n### 文件输入输出\n\nC++ 提供了各种类来管理文件。具体的，`ofstream` 类派自 `ostream`，`ifstream` 类派自 `istream`，而\
  \ `fstream` 类派自 `iostream`，用于同时读写。让我们来看一个写入文件的示例：\n\n```cpp\nofstream fout;\nfout.open(\"\
  test.txt\");\nfout << \"Hello World!\";\nfout.close();\n```\n\n当我们读取文件内容时，就像使用 `cin`\
  \ 一样，我们需要创建一个 `ifstream` 对象：\n\n```cpp\nifstream fin(\"test.txt\");\nint temp;\n\
  while (fin >> temp) {\n    cout << temp << endl;\n}\n```\n\n如果我们想在文件中进行读写，我们需要将文件与\
  \ `fstream` 对象关联。\n\n```cpp\nfstream file(\"test.txt\", ios::in | ios::out);\nfile\
  \ << \"Data\";\nint value;\nfile >> value;\nfile.close();\n```\n\n\n\n\n正如我们稍后看到的，该文件是以读写模式打开的；如果文件已存在，其内容将被删除。我之所以选择使用结构体而不是普通变量，是为了向你展示一个使用其成员对文件进行读/写的示例。如你所见，我们将结构体的数据写入文件，并使用\
  \ `seekg()`（我们稍后会讨论它）将文件指针设置为文件的开头，以便读取其内容。为了存储信息，我使用了第二个结构体 `s2`。我可以再次使用 `s1`，不使用它的目的是为了让示例更清晰。程序显示\
  \ `s2` 的数据（这些数据与 `s1` 相同），然后关闭文件并终止。请注意，如果我们使用类而不是结构体，并将相应的成员声明为 `public`，代码将保持不变。\n\
  \n### 流缓冲区 (STREAM BUFFER)\n\n`ofstream` 类使用缓冲区来存储数据。对于每个创建的 `ofstream` 对象，程序都会分配相应的内存。这段内存充当了程序和文件之间的中间缓冲区。数据不会直接写入文件，而是存储在这个输出缓冲区中。当缓冲区满时，程序会冲刷（flush）缓冲区，数据会被写入文件。缓冲可以提高性能，因为一次向磁盘的大型传输远比多次单次传输要高效得多。同样，当我们使用\
  \ `ifstream` 对象从磁盘读取文件时，也存在缓冲。也就是说，程序读取大块数据并将其存储在对象的输入缓冲区中，然后处理缓冲区中的数据。这种方法比比从磁盘一次一个字节地读取要快得多且高效得多。\n\
  \n注意，我们可以随时冲刷输出缓冲区。例如，正如我们在第 3 章中看到的，可以使用 `flush`、`endl`、`ends` 或 `unitbuf` 操符来冲刷缓冲区。此外，输出流可以与另一个流关联。在第二个流中的读或写操作可能会导致输出流中内存的冲刷。例如，`cin`\
  \ 和 `cerr` 流默认与 `cout` 关联。因此，从 `cin` 读取或写入到 `cerr` 会冲刷 `cout` 的缓冲区。\n\n如果程序异常结束（例如崩溃），缓冲区将不会冲刷。因此，留在缓冲区中的数据很可能没有被处理（例如，没有打印在屏幕上）。然而，这种丢失会导致我们对程序的运行得出错误的结论。例如，当我们调试一个崩溃的程序时，我们希望看到所有打印出来的诊断消息，以知道哪些代码部分已经执行过。如果某些消息没有出现，我们会假设相应的代码没有执行，但这可能并非事实。代码可能已经执行，但由于输出缓冲区没有被冲刷，消息没有被打印。\n\
  \n### 关闭文件 (CLOSE A FILE)\n\n正如我们所说，当我们向文件写入数据时，通过缓冲方法，数据不会直接写入磁盘上的文件，而是写入为此目的预留的缓冲区。当缓冲区满或文件被关闭时，缓冲区会被冲刷，数据会被存储在文件中。这样，我们就避免了频繁访问磁盘，因为这会降低程序的性能。`close()`\
  \ 函数用于关闭已打开的文件。如果文件是以写模式打开的，`close()`会将可能留在缓冲区中的数据存在写入。\n\n例如，让我们来看下面的代码：\n\n由于\
  \ `p` 不指向有效地址，程序可能会崩溃。在这种情况下，可能留在缓冲区中的数据将丢失。如果我们完成写入操作后调用了 `close()`，缓冲区将被冲刷，数据将存储在文件中。因此，请记住在不再需要文件时将其关闭，以确保数据不会丢失。\n\
  \n### 文件打开模式 (FILE OPEN MODES)\n\n在将文件与流对象关联时（无论是通过文件名初始化对象，还是先创建对象后使用 `open()`\
  \ 函数），我们可以使用第二个参数，该参数决定了在文件上执行的操作。`ios_base` 类定义了表示打开模式的常量（例如 `ios_base::in`）。可以使用\
  \ `|` 位操作运算符来启用多种模式，如下表所示。\n\n| 打开模式 | 操作 |\n| --- | --- |\n| `ios_base::in` | 以读模式打开文件。\
  \ |\n| `ios_base::out` 或 `ios_base::out | ios_base::trunc` | 以写模式打开文件。如果文件存在，它将被截断且数据丢失。如果文件不存在，则将创建它。\
  \ |\n| `ios_base::app` | 以追加模式打开文件。如果文件存在，现有数据将被保留，新数据将添加到末尾。如果文件不存在，则将创建它。 |\n\
  | `ios_base::in | ios_base::out` | 以读写模式打开文件。 |\n| `ios_base::in | ios_base::out\
  \ | ios_base::trunc` | 以读写模式打开文件。如果文件存在，它将被截断且数据丢失。如果文件不存在，则将创建它。 |\n| `ios_base::in\
  \ | ios_base::out | ios_base::app` | 以读和追加模式打开文件。如果文件存在，现有数据将被保留，新数据将添加到末尾。如果文件不存在，则将创建它。\
  \ |\n\n还有 `ios_base::ate` 选项，它将文件指针置于文件末尾。`ios_base::app` 和 `ios_base::ate` 的区别在于，前者允许你只向文件末尾添加数据，而后者只是将文件指针放在文件末尾。\n\
  \n要打开文本文件，我们选择上述模式之一。要打开二进制文件，我们添加常量 `ios_base::binary`。例如，要以读模式打开二进制文件，我们写入 `ios_base::in\
