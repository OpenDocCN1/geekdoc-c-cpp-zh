  \nC++ 库继承了 C 语言的字符串函数。记住，C 风格字符串以空字符结束。如果缺失，它们的行为可能是不可预测的。本节介绍了一些最常用的函数。虽然我们将在下一章讨论函数，但我认为你可以理解如何使用它们。此外，记住比使用\
