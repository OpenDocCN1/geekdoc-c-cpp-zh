  \ [10.1201/9781003203](https://doi.org/10.1201/9781003203)\n\n在第 16 章中，我们讨论了 `template`\
  \ 如何工作。`template` 关键字允许我们定义一个可以与任何类型工作的类。这是 C++ 的一个强大功能，允许我们编写供不同数据类型重用的泛型代码。\n\n\
  ## 模板\n\n与函数模板一样，类模板也提供了定义适用于不同类型代码的能力。这对于列表、栈和队列等数据结构特别有用。例如，`vector<T>` 可以包含任何类型的数据。\n\
  \n\n\n\n编译器将 `T` 类型替换为 `int`，并定义该类的“整数”版本。因此，`vec_n` 中包含的元素类型为 `int`。`Lifo<int>`\
  \ 类被称为类模板的*隐式实例化*或*特化*。这个术语将它与模板的*显式实例化*区分开来，我们稍后会看到显式实例化。类模板的每个版本都是一个独立的类。生成的类像普通类一样工作。请注意，我写的是\
  \ `Lifo<int>` 类，而不是 `Lifo`，因为这是为该特定类型定义的类。`lifo_int` 是该版本的一个对象，即 `Lifo<int>` 类的对象。为了更清楚地见，写成\
  \ `Lifo lifo_int;` 是错误的。你声明的每个对象都必须类模板某个特定版本的对象。\n\n所以，类模板只有在需要创建某种类型的对象时，才被隐式地实例化。请注意，指向特定类类型的指针的声明不会导致模板的实例化。例如：\n\
  \n```\nLifo<char>* p;\n```\n\n此条语句将 `p` 声明为类型 `Lifo<char>` 的指针。由于此声明不需要创建 `Lifo<char>`\
  \ 对象，因此类模板没有实例化。\n\n同样，当声明 `lifo_string` 对象时，编译器将 `T` 类型替换为 `string` 并定义该类的“字符串”版本，即\
  \ `Lifo<string>`。`Lifo<string>` 类与 `Lifo<int>` 类没有任何关系，它们是两个完全不同的类。正如你所看到的，当声明对象时，编译器会将泛型替换为参数的类型，并创建类的对应版本。因此，得益于类模板，我们可以在同一个程序中有不同的类定义和相应的对象，而不需要复制任何代码。我们不仅避免了重写相似的代码，而且程序也变得更加灵活、紧凑、易读且易于维护。请注意，同一种类型只会创建一个定义。也就是说，如果我们写下：\n\
  \n`Lifo` 类将只为第一个对象定义一次，然后编译器将对这个实例用于另外两个对象。\n\n在使用模板时，为类型创建别名可能会更方便、更具可读性。例如：\n\n\
  ```cpp\ntypedef Lifo<int> IntStack;\n```\n\n正如我们所说的，`T` 参数被赋值为一个类型而不是数值值。例如，在 `Lifo<int>`\
  \ 类的定义中，`T` 的值变成了 `int`。这与普通的函数模板不同，函数模板会检查参数的类型来确定创建什么种函数。例如：\n\n```cpp\ntemplate\
  \ <class T>\nvoid func(T arg);\n```\n\n多态（正如函数模板的情况）是在编译程序时实现的。最后，程序显示：Three One\
  \ Two 3 1 2\n\n请注意，除了基本类型外，我们还可以传递我们定义的类型。事实上，我们已经多次在我们的类型中使用了 `vector` 类模板。另一个例子是，创建一个包含我们在\
  \ C.17.9 练习中定义的 `Node` 类元素的堆栈，我们写道：\n\n```cpp\nLifo<Node> lifo_n;\n```\n\n编译器将 `T`\
  \ 替换为 `Node` 并定义了 `Lifo<Node>` 类。让我问你一个问题，这个问题在概念上与下一节有关：允许写 `lifo_n.show_all()`\
  \ 吗？当然不能，通过 `<<` 运算符我们可以显示基本数据类型的值，但不能显示 `Node` 类型的值。正如我们所知，为了显示其成员的值，我们需要重载 `<<`\
  \ 运算符。去做吧，以此刷新你的知识。\n\n总之，在定义类模板时，我们必须指定模板参数类型。这里有一个更短的例子：\n\n```cpp\ntemplate <class\
  \ T>\nclass Lifo { ... };\n```\n\n当声明对象 `a` 时，`T` 被替换为 `int`，`p` 变为 `10`。C++17 放宽了显式指定类型的限制。特别是，C++17\
  \ 支持类模板参数推导，这允许我们在构造函数能够推断出类型时跳过类型指定。例如，我们可以写道：\n\n```cpp\nLifo a(10);\n```\n\n\
  ### 类模板的误用\n\n在使用类模板时，我们必须记住它的设计方式，而不仅仅是使用它。例如，如果我们将 `const char*` 类型传递给 `Lifo`，下面的代码有效吗？如果你发现任何错误，请修复它们。\n\
  \n```cpp\nLifo<const char*> lifo;\nstring s = \"Three\";\nlifo.push(\"Three\");\n\
  lifo.pop(s);\n```\n\n编译器为 `const char*` 类型创建了一个类版本。`push()` 调用有问题吗？没有，因为字面量字符串的类型是\
  \ `const char*`，它可以存储在栈中。但 `pop()` 调用呢？由于 `pop()` 的声明是 `pop(T& t);` 且 `s` 的类型是 `string`，编译器将显示参数类型与参数类型不兼容的错误信息。因此，程序无法编译。解决此问题的方法之一是写道：\n\
  \n```cpp\nLifo<string> lifo;\nstring s = \"Three\";\nlifo.push(\"Three\");\nlifo.pop(s);\n\
  ```\n\n\n\n与函数模板一样，类模板也可以接受非类型参数。它的写法类似于函数参数，即在类型名后跟上参数名称。非类型参数最常见的用法是整数参数。通常，当我们想要传递与数值大小和范围限制相关的值时使用它们。例如，整数参数的一个常见用法是在我们需要指定内存大小时。让我们来看这样一个例子：\n\
  \n在类模板的声明中，`typename` 的使用意味着 `T` 对应某种类型，而第二个参数 `size` 对应一个整数值。编译器为了定义 `Grades<float,\
  \ 5>` 类，会将 `T` 替换为 `float`，将 `size` 替换为 `5`。因此，两个实验数组和理论数组的类型变为 `float`，它们的大小也等于\
  \ `5`。它还会调用类的构造函数来创建 `g` 对象。\n\n注意，非类型参数有一些限制。它允许是一个整数字面量（例如 `5`）、枚举类型、常量整数表达式、空指针、类成员的指针，或者指向对象或函数的指针或引用。例如，写以下内容是错误的：\n\
  \n如果我们将 `p` 声明为 `const`，则没有问题。此外，如果我们写 `float size`，编译器将显示错误信息。然而，我们可以写 `float&\
  \ size` 或 `float *size`。如果你愿意，可以使用类型参数的类型作为非类型参数的类型。例如：\n\n名称 `T` 在用作非类型参数的类型之前必须出现，而类型参数的选择必须符合非类型参数的约束。\n\
  \n此外，我们在模板内部使用非类型参数的方式也有限制。特别是，不允许更改参数的值或访问其地址。也就是说，像 `size++` 或 `&size` 这样的表达式是不允许的。\n\
  \n### 类模板作为参数\n\n类模板可以接受另一个类模板作为参数。例如：\n\n`C` 模板接受一个类型为 `template <typename T>`\
  \ 的类模板作为参数。因此，当定义 `C<A>` 时，传入参数的类型（即 `A`）必须与模板参数 `Test` 的类型匹配。否则，编译器将显示错误信息。`Test`\
  \ 参数被替换为传入参数的类型，即 `A`。因此，`c` 对象包含了 `A<int>` 类的 `t1` 对象和 `A<double>` 类的 `t2` 对象。通过语句\
