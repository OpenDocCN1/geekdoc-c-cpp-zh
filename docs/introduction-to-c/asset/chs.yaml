  \n## 13 结构体与联合体\n\n本章介绍了两种可以由程序员定义的新类型：*结构体*（structures）和*联合体*（unions）。（此处省略）本章将讨论如何声明结构体和联合体类型、声明变量以及对它们进行操作。\n\
  \n## 结构体\n\n由于结构体的概念与类（class）相似，类是 C++ 的基本概念，请特别注意本章，以便我们在讨论类时你了解基础。\n\n结构体是数据项的集合，用于分组描述逻辑实体的信息。例如，结构体可以包含有关公司信息，如其名称、业务核心、税号、员工人数、联系方式以及其他数据或管理存储数据的函数。\n\
  \n### 声明结构体\n\n声明结构体时使用 **struct** 关键字。结构体声明的通用语法为：\n\n\n\n\n一个 `struct` 声明创建了一个类型。由于该类型是由程序员定义的，因此是一个`用户定义`类型。虽然\
  \ `structure_tag`（结构标签）是可选的，但我们将为创建的每个结构类型命名，以便在任何需要的时候使用该名称来声明相应的变量。在第 14 章中声明自引用结构以形成链表时，我们将看到\
  \ `structure_tag` 的另一个用途。在这种情况下，必须使用结构标签。结构的 `members`（成员）或称为 `fields`（字段）的使用方式普通变量相同。结构比数组更灵活，因为它可以包含不同数据类型的元素。它们的逻辑联系在于它们包含了描述特定实体所需的信息。此外，结构还可以包含函数。为了简单起见，我们将使用只包含变量而不包含函数的结构。我们将在稍后讨论类时添加函数。\n\
  \n正如我们接下来将看到的，我们可以声明该结构类型的可选 `variable_list`。不要忘记末尾的 `;`。例如，为了存储关于公司的信息，我们声明了 `Company`\
  \ 类型：\n\n```cpp\nstruct {\n    char name[20];\n    int employees;\n    int turnover;\n\
  };\n```\n\n名称的首字母通常大大写。虽然相同类型的成员可以在同一行中声明，但我更倾向于将它们分开声明，以便读者更容易阅读存储的数据。\n\n如果使用了结构标签，我们就可以使用该标签来声明变量。例如：\n\
  \n```cpp\nCompany c1, c2;\n```\n\n为了清晰起见，`Company` 结构的声明定义了一个带有该名称的用户定义数据类型；它不会导致内存分配，`Company`\
  \ 也不是一个变量。`Company` 描述了结构变量在声明时的样子。`c1` 和 `c2` 变量被声明为 `Company` 类型的结构。每个变量都包含自己的成员，编译器会为它们分配内存。这种语法就像我们声明某个基本类型（例如\
  \ `int`）的变量一样，我们只需要将结构类型的名称（例如 `Company`）放在 `int` 的位置即可。或者，我们也可以在 `variable_list`\
  \ 中直接声明变量。例如：\n\n```cpp\nstruct {\n    char title[50];\n    int pages;\n} b1, b2;\n\
  ```\n\n`b1` 和 `b2` 变量被声明为 `Book` 类型的结构。如果我们在 `variable_list` 中声明了所有需要的变量，标签（即 `Book`）可以省略。然而，为了在需要时随时声明变量，我的建议是始终为结构命名并使用该标签来声明变量。典型的做法是将结构声明与函数原型、宏等其他声明一起放在头文件中，并在需要时使用\
  \ `#include` 指令将其包含进来。为了简单起见，在接下来的所有程序中，我们将每个结构类型定义为全局作用域，以便所有函数可以使用它。如果它定义在函数内部，它的作用范围将变为局部的，因此只能在该函数中使用。\n\
  \n每个结构（或联合体）类型创建一个独立的空间，为其成员指定单独的作用范围。因此，允许声明与成员或结构标签同名的普通变量。出于相同的原因，相同的成员名称可以在结构中重用。例如：\n\
  \n```cpp\nstruct Employee {\n    int id;\n    float salary;\n};\n\nstruct Student\
  \ {\n    int id;\n    float grade;\n};\n```\n\n这三个成员与 `Company` 类型的相应成员没有关系。作为另一个例子，查看以下声明：\n\
  \n```cpp\nstruct Point {\n    int x;\n    int y;\n};\n\nstruct Rectangle {\n   \
  \ Point topLeft;\n    Point bottomRight;\n};\n```\n\n接下来，你将学习到我们可以顺利地编写 `s1.a[0]\
  \ = a;`、`s2.a = &a;` 或 `s2.a = s1.a;`。\n\n虽然结构类型是用右括号 `}` 完成的，但结构可以包含指向自身实例的指针，因为\
  \ C++ 允许声明指向不完整类型的指针。例如：\n\n```cpp\nstruct Node {\n    int data;\n    Node* next;\n\
  };\n```\n\n当声明结构变量时，编译器分配内存按照它们声明的顺序存储其成员。例如，以下程序显示了变量 `d` 分配了多少字节内存。\n\n```cpp\n\
  struct Date {\n    int day;\n    int month;\n    int year;\n};\n\nint main() {\n\
  \    Date d;\n    cout << sizeof(d) << endl;\n    return 0;\n}\n```\n\n对于那些熟悉 C\
  \ 语言结构的人来说，C 结构与 C++ 结构有类似的属性，但也有不同之处。一个不同点是，在 C++ 中，声明此类变量时不需要添加 `struct` 关键字。在\
  \ C++ 中，标签可以像基本类型一样使用。这种变化强调了结构声明定义了一个新类型。另一个不同点是 C++ 结构也可以包含函数。然而，我们不会看到此类结构示例，因为正如我们在第\
  \ 17 章中看到的，当我们想要使用函数时，通常选择的是类类型而不是结构。还有更多差异，那两个是最重要的。\n\n让我们解释一下程序。由于 `d` 包含三个整数成员，分配的内存是\
  \ `3*4 = 12` 字节。然而，分配的大小可能大于成员大小之和。例如，如果我们把 `day` 成员的类型从 `int` 改为 `char`，程序可能会显示\
  \ 12，而不是预期的 9。\n\n如果编译器要求每个成员存储在某个数字倍数（通常是四）的地址上，就会发生这种情况。这种要求可能是为了更快访问结构成员而设置的。如果我们假设\
  \ `month` 成员应该存储在四的倍数地址上，编译器将在 `day` 成员之后额外分配三个字节，即一个“洞”。在这种情况下，程序将显示 12。成员之间和结构末尾可能存在空洞，但开头不会。\n\
  \n我不会涉及细节，但如果你编写一个使用许多结构且内存有限的应用程序，请记住成员声明的顺序可能会影响对齐并产生空洞。例如：\n\n```cpp\nstruct\
  \ S1 {\n    char day;\n    int month;\n    int year;\n};\n```\n\n虽然成员相同，但从大到小重新排列成员可以节省内存。例如，`S1`\
  \ 变量分配的字节比 `S2` 变量多，而不是 16 字节，这是因为编译器为了对齐较大的类型（即 `double`）留下了空洞。\n\n```cpp\nstruct\
  \ S2 {\n    int month;\n    int year;\n    char day;\n};\n```\n\n虽然不经常使用，但了解 `offsetof`\
  \ 宏是有用的。它定义在 `cstddef` 中，两个参数：第一个是结构类型，第二个是成员名称。该宏计算从结构开始到成员的字节数。例如，考虑 `S2` 结构。由于\
  \ C++ 保证第一个成员的地址与整个结构的地址相同，语句：\n\n```cpp\ncout << offsetof(S2, d) << endl;\n```\n\
  \n输出 0。如果我们把 `d` 替换为 `s`，代码输出 8。由于结构可能包含空洞，如果你编写运行在不同平台的应用程序且成员对齐很重要，该宏对于检查程序的可移植性很有用。注意使用\
  \ `offsetof` 有限制限制，在使用前应该考虑。\n\nC++11 提供了 `alignof` 运算符，它返回指定类型的对齐值（字节）。例如：\n\n\
  ```cpp\ncout << alignof(double);\n```\n\n输出 `double` 类型的对齐值（例如 8）。\n\nC++11 还提供了\
  \ `alignas` 指定符，可用于指定类型的对齐。例如：\n\n```cpp\nstruct alignas(64) A {\n    int x;\n};\n\
  ```\n\n每个 `A` 变量将对齐到 64 字节的边界。注意字节数应该是有效的对齐值，例如 2 的幂。\n\n### 初始化结构\n\n访问结构成员常用的方法是编写结构变量名称，加上\
  \ `.` 运算符和成员名称。例如，以下程序显示了 `b` 成员的值：\n\n除了 `.` 运算符，你接下来将学习如何使用 `->` 运算符访问结构成员。\n\n\
