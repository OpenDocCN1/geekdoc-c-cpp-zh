  \ 5 位标记为 `A C`。第 6 位留白。第 7 位标记为 `Z`。第 8 位标记为 `S.`。</details>\n\n处理寄存器值的另一种方法是使用像我们在练习\
  \ C.4.7 中做的那样的位运算符。使用上面的结构，处理寄存器并为其字段赋值会变得容易得多。例如，如果我们有一个 `Flags_Reg` 变量（例如 `fr`），要访问\
  \ `ac` 字段可以写写：\n\n`unsigned int ac = fr.ac;` 而如果我们使用一个整数来表示寄存器值（例如 `reg`）并像在第 4\
  \ 章中那样操作位，我们应该写：\n\n前一种语法使代码更清晰、更易读。然而，正如我们以后将看到的，如果我们希望程序具有可移植性，最好使用位运算符，这样它就不会依赖于编译器如何分配这些位。\n\
  \n位域可以是无名的。无名字段通常用于填充（padding）。例如，为了表示上述寄存器的精确形式，我们可以添加三个无名字段：\n\n位域被封装在存储单元中（其典型大小为\
  \ 32 位）。为了强制编译器将位域存储在下一个单元的开头，在该之前添加一个零长度的位域。例如，在下面的结构中，如果编译器使用 32 位的存储单元，它将为 `f`\
  \ 字段分配三位，跳过后续 29 位到达下一个单元，并为 `k` 字段再分配四位。\n\n当你给位域赋值时，应确保该值适合该位域。例如，假设将值 2 分配给 `cs`\
  \ 字段：\n\n如果我们假设位域是从右到左分配的，那么 `cs` 将变为 0 而不是 2，因为 2 被编码在两个位中（`10[2]`）。注意，位域分配的顺序是从右到左（小端序）还是从左到右（大端序）取决于实现，并可能随系统而异。\n\
  \n由于位域的内存不像普通变量那样分配的，因此不允许使用 `&` 运算符。例如，这条语句是错误的：\n\n### 结构体指针\n\n指向结构的指针用法类似于指向普通变量的指针。考虑以下程序：\n\
  \n`ptr` 被声明为指向类型为 `Student` 的结构变量的指针。语句 `ptr = &stud;` 使 `ptr` 指向 `stud` 的地址。特别是它指向其第一个成员的地址。由于\
  \ `ptr` 指向 `stud` 的地址，`ptr` 等同于 `stud`。通过使用 `.` 运算符我们可以访问其成员。表达式 `*ptr` 必须用括号起来，因为\
  \ `.` 运算符的优先级高于 `*`。这意味着表达式 `*ptr.grd` 尝试访问 `ptr` 结构的 `grd` 成员，由于 `ptr` 是一个指针，编译失败。\n\
  \n或者，我们可以使用 `->` 运算符来访问结构的成员。`->` 运算符由 `-` 和 `>` 字符组成。这是上一个程序的另一个版本：\n\n表达式 `ptr->name`\
  \ 等于 `(*ptr).name`，表达式 `ptr->grd` 等于 `ptr[0].grd`。在两种使用指针访问结构成员的方法之间，我发现使用 `->`\
  \ 运算符更具表现力且更容易用。\n\n### 结构体数组\n\n结构体数组是一个元素为结构的数组。它的典型用途是存储许多项目的信息，例如公司员工的数据、学生数据或仓库的产品。事实上，结构体数组可以被用作简单的数据库。例如，使用语句：\n\
  \n变量 `stud` 被声明为一个数组，其中每个元素都是 `Student`。结构体数组可以在声明时进行初始化。例如，给定声明：\n\n一个初始化示例是：\n\
  \n初始化方式与初始化二维数组非常相似。每个结构成员的初始值被包在大括号中，并用逗号分隔。例如，`stud[0].name` 变为 \"nick sterg\"\
  ，`stud[1].code` 变为 160，而 `stud[2].grd` 变为 6.7。每个结构的外层括号可以省略；然而，我倾向于使用它们来使每个结构的初始化更加清晰。通常情况下，如果\
  \ `[]` 留空，编译器将计算元素的数量。\n\n与简单结构一样，我们可以使用 `{}` 语法初始化所有结构。例如，如果我们写：\n\n每个结构的成员将根据其类型初始化为默认初始值。也就是说，数值成员初始化为\
  \ 0，名称初始化为 \"\"。我们可以在声明结构体定义同时声明并初始化数组。例如：\n\n以下程序使用循环将 100 个学生的数据存储到类型为 `Student`\
  \ 的学生数组：\n\n与普通数组一样，我们可以使用指针表示法访问元素。例如，`*stud` 等于 `stud[0]`，`*(stud+1)` 等于 `stud[1]`，依此类推。因此，为了访问第三个学生的\
  \ `code` 成员，`stud[2].code` 和 `(*(stud+2)).code` 都是可以。后一种情况中的括号由于优先级原因是必要的。与普通数组一样，我倾向于使用数组下标而不是指针表示法，以获得更具读性的代码。\n\
  \n正如我们所知，与其使用普通数组可以使用 `vector` 对象。例如：\n\n### 结构体作为函数参数\n\n结构变量可以像任何其他变量一样传递给函数，即传递变量本身或其地址。此外，函数也可以返回一个结构。考虑以下程序：\n\
  \n\n\n\n当调用 `test()` 时，`st` 成员的值会被复制到 `s` 的相应成员中。由于 `s` 和 `st` 存储在不同的内存位置，`s` 成员的任何更改都不会影响\
  \ `st` 成员。正如你现在已经了解到的那样，即使我们使用名称 `st` 而不是 `s`，结果也是相同的，因为无论命名如何，它们都是不同的变量。接下来，`test()`\
  \ 返回的结构被复制到 `st` 中。因此，程序显示：`new 30 7`\n\n另一方面，当传递结构体的地址时，函数可能会改变其成员的值。例如，让我们修改 `test()`\
  \ 以修改 `st` 的成员：\n\n当调用 `test()` 时，我们拥有 `ptr = &st`。因此，由于 `ptr` 指向 `st` 的地址，函数可能会改变其成员的值。结果是，程序显示：`new\
  \ 30 7`\n\n当将结构体传递给函数时，它的成员会被复制到相应参数的成员中。请注意，如果结构体很大或函数被调用多次，这种复制操作可能会增加内存需求并增加时间开销。另一方面，当通过指针或引用将结构体的地址传递给函数时，成员不会被复制。\n\
  \n为了防止函数更改成员的值，我们将指针或引用声明为 `const`。例如：\n\n现在，`test()` 无法修改 `ptr` 指向的结构体的成员。\n\n\
