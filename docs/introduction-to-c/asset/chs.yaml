  \ `const`。例如，如果我们写：\n\n```cpp\nvoid test(const int &a) {\n    a = 100;\n}\n```\n\
  \n语句 `a = 100;` 是不允许的。将引用参数声明为 `const` 防止了改变被引用变量的值。\n\n\n\n使用引用参数而不是指针似乎写起来更简单、更容易理解。然而，在这种情况下，我更倾向于使用指针，这样值可能改变的参数就能清晰地显示。例如，使用引用时，像\
  \ `f(i, j, k)` 这样的调用让读者无法看出 `f()` 是会改变所有参数、部分参数还是不改变任何参数。了解此点的唯一方法是查找函数原型或其定义。相反，如果我们使用指针并写成\
  \ `f(&i, j, k)`，读者就会得出结论：`f()` 可能改变 `i` 的值。此外，在函数内部非常很容易发现 `*` 解引用运算符，并找到参数值发生变化的地方。因此，控制代码要容易得多。另一方面，当函数接收一个指针而我们意图对其进行解引用时，我们应该检查它是否为空指针，否则程序可能会崩溃。这在引用情况下是不可能发生的，因为引用始终指向一个变量；不存在空引用。当然，我可能更倾向于指针，是因为我是从\
  \ C 开始编程的，而 C 不支持引用。C 使用指针来访问原始数据。如果我是从 C++ 开始的，我可能更倾向于引用，因为它们的使用确实更简单。\n\n在关于何时使用指针或引用的问题上，我通常的做法是：传递基本类型（如\
  \ `int`）、结构体和联合体使用指针；由于 C++ 在类设计中经常需要使用引用，所以在将类对象传递给函数时使用引用。当然，这只是我的个人偏好，可能有理由做出不同的选择。无论你如何选择，可以确定的是你应该熟悉这两种方法，因为它们都非常流行。\n\
  \n正如你已经从第 13 章所知，当大型实体（如结构体和类）传递给函数时，即使函数不会修改它们，我们也选择传递引用或指针。这样做是为了节省创建原始实体副本所需的时间和内存。因此，程序的性能得到了提高。对于简单变量（如基本类型），典型的选择是*值传递*（call\
  \ by value），只要我们不想函数修改原始值。\n\n另一个例子，让我们传递一个指针的引用以改变指针的值。以下程序的输出是什么？\n\n参数 `r` 被声明为类型\
  \ `int*` 的引用。在 `test()` 中，`r` 等于 `p`，因此 `p = &b`。由于 `p` 的值发生了变化，程序显示 20。或者，正如我们从第\
  \ 11 章所知，为了改变指针的值，我们可以传递指向指针变量指针。事实上，这是我的偏好。例如：\n\n并写成：`test(&p);` 我认为这种语法更简单，而且让读者更清晰、更容易理解传递的指针的值可能会改变。当然，正如我提到的，我可能这样做是因为我是从\
  \ C 开始编程的。我猜从 C++ 开始的人可能更倾向于使用引用语法。\n\n### 作为返回值的引用\n\n看下面的程序并告诉我它显示了什么：\n\n现在再次看到它，我可能应该在第一个例子中写得更简单一些。这确实是一个奇怪的程序，因为我们第一次看到函数调用出现在\
  \ `=` 的左侧。让我们解释一下程序。由于 `i` 和 `j` 的引用被传递给 `test()`，语句 `a++` 等同于 `i++`，语句 `b += a;`\
  \ 等同于 `j += i;`。因此，第一次调用 `test()` 使 `i` 等于 11，`j` 等于 31。由于 `test()` 返回 `i`，而 `i`\
  \ 是第二次调用的参数，所以我们再次得到 `test(i, j);`。本质上，语句 `test(test(i, j), j) = 1;` 等同于：\n\n因此，`i`\
  \ 将变为 12，`j` 将变为 43。由于 `test()` 返回 `i`，语句 `test(test(i, j), j) = 1;` 等同于 `i = 1;`。因此，程序显示\
  \ 1 和 43。\n\n注意，我们允许写入语句 `test(i, j) = 1;` 是因为 `test()` 返回的是一个引用。记住第 4 章，在赋值操作中（例如\
  \ `a = 1;`），左侧操作数必须是一个可修改的左值（lvalue），也就是说必须为它留出内存，并且该内存是可以修改的。对于该语句确实如此，因为 `test()`\
  \ 返回了 `i` 的引用，而 `i` 已经留有了内存。也就是说，返回的引用对应于一个左值。如果我们将返回类型从 `int&` 改为 `int`，编译器将显示类似于\
  \ *«left operand must be lvalue»* 的错误信息，因为左侧操作数现在不是左值了。\n\n如果我们想防止此类赋值以避免无意的值改变，我们将返回类型从\
  \ `int&` 改为 `const int&`。现在，由于返回值不允许发生改变（即它是一个不可修改的左值），编译器将显示错误信息。\n\n有人可能会问，函数返回引用常见吗？是的，除了作为函数参数外，引用的另一个常用用法就是返回值。为什么要让函数返回引用呢？最常见的情况是我们想在赋值的左侧使用函数调用，就像之前的\
  \ `test()`。由于返回的引用是左值，这样做是被允许的。例如，正如我们在第 18 章中看到的，赋值在重载运算符时非常常见（例如 `[]` 运算符）。泛而言，在处理类时经常使用引用类型。\n\
  \n另一个原因是为了性能。例如，假设 `f()` 返回一个整数。当我们写：\n\n返回值可能会复制到一个临时位置，然后该值被赋值给 `i`。如果 `f()` 返回的是引用，则不会创建副本，返回值直接赋值给\
  \ `i`，因为引用只是所引用变量的别名。对于基本类型，内存和时间的节省并不显著，但如果返回值是一个大型实体（如大型结构体），且函数被多次调用，返回引用以避免在临时位置进行一系列复制操作会更高效。当然，优化编译器可能会跳过临时复制，但由于这并不确定，返回实体的引用更好。\n\
  \n例如，由于变量 `b` 在 `test()` 结束后就不存在了，函数返回了一个已不存在的变量引用。如果我们尝试引用该内存会发生什么是不可预测的。本质上，这条规则与我们在第\
  \ 11 章中讨论的返回指针的情况类似。记住，我们说过永远不要返回局部变量的地址，除非声明为 `static`。也就是说，如果 `b` 被声明为 `static`，则没有问题。\n\
  \n注意，如果你想让编译器推导返回类型，你应该使用 `auto&` 而不是简单的 `auto`，以便编译器推导出引用类型。例如：\n\n如果你写不带 `&` 的\
  \ `auto`，编译器将推导出返回类型为 `int`，而不是 `int&`。\n\n### 通过引用传递数组\n\n如果由于某种原因我们要将数组传递给函数而不是其第一个元素的指针，我们可以使用数组的引用。原因之一可能是为了强制传递一个特定大小的数组，而不仅仅是任意大小数组第一个元素的指针。例如：\n\
  \n\n\n\n\n原型表明，必须向函数传递一个指向三个整数数组的引用。因此，第二次调用会导致编译错误，因为数组 `a2` 并不包含预期的元素数量。请注意，`r`\
  \ 周围的括号是必须的，否则编译器会将该类型解释为一个包含三个 `int` 引用的数组。由于不允许引用的数组，编译将失败。\n\n使用数组引用的另一个例子是在函数模板中。所传数组的大小可能会变化。例如：\n\
  \n正如我们稍后看到的，`f()` 是一个函数模板。当第一次调用 `f()` 时，`T` 被替换为 `int`，`size` 被替换为 `5`；而在第二次调用中，`T`\
  \ 被替换为 `float`，`size` 被替换为 `10`。\n\n如果你想在这里声明数组引用变量，这里有两个一维数组和二维数组的示例。\n\n### 右值引用\
  \ (rvalue References)\n\nC++11 引入了一种新的引用类型——右值引用（rvalue reference）。右值引用引用一个临时对象，该对象在使用后将不再被再次使用。因此，右值引用可以引用右值表达式的结果，尽管这个值通常是临时的。一旦右值引用绑定到结果，用于存储结果的内存的生命周期将持续到该右值引用作用范围内为止。然后，该内存会被释放。要声明一个右值引用，我们在类型名后使用两个\
  \ `&`。例如：\n\n引用 `r` 是右值表达式 `a+b` 结果的别名。请注意，这个示例没有实际意义；它只是为了展示右值引用的语法。\n\n右值引用的主要目的是，由于对象是临时的，将拷贝操作转换为移动操作（move\
  \ operation）。例如，在拷贝可能包含大量数据的实体（如 `vector`）时，如果源实体将不再被使用，那么移动它们比拷贝数据更高效，因为拷贝数据不仅没有必要，而且是一个代价昂的操作。很好，但我们如何告诉编译器移动数据呢？通过使用右值引用。例如，考虑以下程序：\n\
  \n通过 `static_cast`（我们将在第 25 章 中看到），`s1` 的类型被强制转换为 `string&&`。正如我们在第 19 章 中看到的，如果被引用类型（例如\
  \ `string`）重载了 `=` 运算符以提供移动赋值运算符，则将执行移动操作。如果没有，则不会执行移动操作，而是代之执行普通的拷贝操作。由于 `string`\
  \ 类型提供了移动赋值运算符，数据从 `s1` 移动到 `s2`。空字符串 `\"\"` 被赋值给 `s1`。因此，程序显示一个。如果我们不使用右值引用，即我们写成：\n\
  \n执行的将是普通的拷贝操作而非移动操作，程序将显示两个。\n\n由于使用 `static_cast` 会使代码更难读，我们也可以选择使用标准库中的 `move()`\
  \ 函数。本质上，`move(a)` 等同于 `static_cast<T&&>(a)`，其中 `T` 是 `a` 的类型。也就是说，尽管名字叫 move，但\
  \ `move()` 并没有移动它的参数（例如 `a`），它只是返回了它的一个右值引用。我再说一遍，`move()` 既不移动也不拷贝数据；它只执行到右值引用的类型转换，当作为参数使用时（正如我们在第\
  \ 19 章 中看到的），它会指示编译器调用移动构造函数或移动赋值运算符。因此，我们可以通过编写代码以更优雅的方式移动数据：\n\n如所说，移动操作的想法是将其应用于程序中数据不再被再次使用的对象，例如\
  \ `s1`。通常情况下，在调用 `move()` 后，我们可以销毁源对象（例如 `s1`）或为其赋一个新值，但我们不能对其初始值或当前状态做假设。让我们来看一个使用函数模板交换值的示例（我们稍后会讨论它们），以更好地理解移动数据的用处：\n\
  \n在赋值中，不拷贝数据而是移动它们会更有效率。例如，在第一次赋值中，没有理由让 `a` 拥有两个拷贝。由于数据存储在 `tmp` 中且 `a` 将不再被使用，因此没有理由将它们保留在\
  \ `a` 中。为了实现性能提升，请考虑 `a` 是一个包含数千个字符串的 `vector`，每个字符串包含数百个字符的情况。拷贝和维护两个拷贝的代价将是巨大的。将数据移动到目标（例如\
  \ `tmp`）然后释放为源对象（例如 `a`）预留的资源更有效率。\n\n在现实世界中，这种移动操作对应于送出某物的行为。例如，当我把一本书给某人时，他得到的不是书的副本，而是拿了我自己的书，而我不再拥有它了。换句话说，属性发生了转移。正如我们所说，我们使用右值引用指示编译器移动数据。让我们修改\
  \ `do_swap()` 以实现移动：\n\n当调用 `do_swap()` 时，`T` 将替换为 `string`。正如我们所说，由于 `string` 类型提供了移动构造函数并重载了\
  \ `=` 运算符来移动数据，字符串对象是可以移动的。例如，`do_swap()` 首先输出一个。如果我们使用之前的版本 `do_swap()`，它会显示两个一个，因为一个从\
  \ `a` 移动到了 `tmp`。另一个留在 `a` 中。\n\n比较两个 `do_swap()` 版本，显而易见，带有右值引用的 `do_swap()` 是一个非常高效的交换函数，比用通常方式编写得多。最后一个示例。假设我们要将一个\
  \ vector 对象的内容拷贝到另一个，而原始 vector 将不再被使用。\n\n由于我们不再使用 `v1` 的内容，执行移动操作比对那数千个元素进行多余的拷贝更有效。当然，为了移动数据，被引用类应该提供这种能力，是的，`vector`\
  \ 类提供了这种能力。\n\n让我们以一些语法问题结束。右值引用必须引用一个右值，例如字面量字符串或返回值的表达式。不返回引用的函数或带有算术、关系、逻辑、位运算以及单增/减运算符的表达式都是产生右值的示例。左值引用不允许引用此类表达式的结果。通常在这些表达式中，我们可以关联常量左值引用或右值引用。右值引用不允许引用左值。\n\
  \n左值和右值引用的本质区别在于左值引用引用一个持续存在的实体，而右值引用引用一个即将被销毁的实体。右值引用访问其引用对象的方式与左值引用或普通变量相同。毕竟，右值引用和左值引用一样，都是被引用变量的别名。例如：\n\
  \n请注意，如果我们写成：\n\n编译器将显示错误信息，因为左值（例如 `s`）不能与右值引用（例如 `str`）关联。\n\n\n\n\n有时，我们可能希望在编译时评估函数的返回值（例如，假设某个函数计算出一个值），而不是在运行时反复进行相同的评估。这就是\
  \ `constexpr` 函数的核心思想：通过在编译时而非运行时进行计算，来提高程序的性能。\n\n自 C++11 以来，我们使用 `constexpr` 标识符来告诉编译器可以在编译时对函数进行评估。然而，`constexpr`\
  \ 函数必须满足几项要求。例如，任何给定的参数必须是常量表达式。关于其函数体，C++11 规定了许多限制。例如，不允许使用循环和 `if` 语句。幸运的是，C++14\
  \ 放宽了 C++11 的限制，允许我们使用熟悉的语言结构来编写编译时函数。它仅施加了少量限制（例如，在定义变量时必须进行初始化）。让我们来看一个 `constexpr`\
  \ 函数的示例：\n\n当使用 `constexpr` 函数的返回值进行初始化时，程序的性能会提高，因为该值是在编译时计算的，而不是在运行时。例如：\n\n正如你所见，当使用常量参数调用时，`constexpr`\
  \ 函数会产生一个编译时常量。当使用非常量参数调用时，它会像普通函数一样在运行时产生一个值。\n\n`constexpr` 函数可以接受引用作为参数，并返回引用或指针。例如：\n\
  \n## 函数重载\n\n与 C 语言不同，C++ 允许函数具有相同的名称。这种特征被称为*函数重载*（function overloading）或*函数多态*，意味着函数可以有许多形式。函数重载是泛型编程的核心部分。重载概念的一个示例是算术运算符的使用。例如，同一个\
  \ `+` 运算符可以用于相整数、浮点数或这两种类型。这种思想被扩展到了函数。\n\n允许有多个同名函数的限制是：每个函数必须具有不同的*签名*（signature）。函数的签名由其参数的数量和类型决定；参数名称并不重要。当调用重载函数时，编译器会检查传递给它的参数的数量和类型，并决定调用哪一个版本。因此，多态性是在程序编译期间实现的（*静态绑定*）。\n\
  \n尽管我们可以重载执行完全不同任务的函数，但当重载用于处理执行相似操作的函数时，它更有意义。这样，就不需要寻找不同的函数名，也不会给读者留下它们在执行不同任务的假象。相同的名称向读者指示这些操作是类似的，但数据类型不同。例如，在下面的程序中，`abs_v()`\
  \ 函数被重载了三次，编译器选择了合适的版本：\n\n程序显示：100 1.2345 70。对于有 C 语言经验的人来说，因为 C 不支持重载，为了获得相同的结果，我们必须定义三个不同名称的，如\
  \ `abs()`、`fabs()` 和 `labs()`。注意，重载函数的顺序不会影响对合适版本的选择。\n\n注意，只有签名（而不是返回类型）允许函数进行重载。记住，为了重载一个函数，函数必须具有不同的签名，即参数的数量或类型不同，或者两者都不同。编译器不检查返回类型。例如，第三个\
  \ `abs_v()` 的签名是 (`int`, `int`)。因此，如果我们添加以下 `abs_v()`：\n\n编译器将为两个具有相同签名的版本显示错误信息。\n\
  \n在重载函数之前，检查你是否可以使用默认参数获得相同的结果。例如，与其声明以下三个重载函数：\n\n为了计算它们的参数之和，我们可以声明一个带默认参数的单一函数。例如：\n\
  \n声明单个函数绝对更好，因为你只需要为它编写代码，而且如果你需要更改它，只需要在一个地方进行更改。此外，编译器为一个函数分配内存，而不是三个。\n\n###\
  \ 歧义情况\n\n在某些情况下，签名看起来不同的函数无法进行重载。例如：\n\n当调用 `f()` 时（例如 `f(i)`），编译器无法决定调用两个中的哪一个。为了避免这种歧义，当编译器检查签名时，它认为对类型的引用和类型本身具有相同的签名。因此，编译器将在\
  \ `f()` 调用中显示类似于*对重载函数的歧义调用*（ambiguous call to overloaded function）的错误信息。\n\n如果函数调用中的参数与任何原型都不完全匹配，也可能产生歧义。例如：\n\
  \n如果 `i` 被声明为 `float`，那么在类似 `f(i)` 的调用中，编译器会做什么？当没有原型完全匹配函数调用时，编译器会应用转换规则，如果没有产生歧义，它会选择最匹配的项。因此，`i`\
  \ 被转换为 `double` 并选择了第一个 `f()`。但如果 `i` 是 `unsigned int` 会发生什么？现在，由于有三个候选函数可以转换 `i`，编译器不会选择其中任何一个，并在\
  \ `f()` 调用中显示歧义错误信息。如果最后两个原型缺失且 `i` 被声明为 `bool` 呢？编译器将 `i` 转换为 `double` 并再次选择第一个\
  \ `f()`。当有多个候选者时决定使用哪个函数的过程被称为*重载解析*（overload resolution）。详细讨论超出了本书的范围。简而言之，编译器在选择最合适函数时采用的从优到坏的排序是：\n\
  \n1. 参数的精确匹配。\n2. 使用整型提升匹配，正如我们在第 2 章中所示（例如 `short` 转换为 `int`）以及 `float` 转换为 `double`。\n\
  3. 使用标准转换（例如 `int` 转换为 `double`）。\n\n如果存在多个“最佳”函数，编译器将拒绝该调用并视为歧义。\n\n注意，编译器区分引用和指针的\
  \ `const` 和非 `const`。例如：\n\n假设我们写道：\n\n在第一次调用 `f()` 时，编译器选择了第一个版本，在第二次调用时它选择了第二个版本。注意在第二次调用中，由于非\
  \ `const` 参数可以传递给 `const` 参数，两个版本都是候选者，但编译器选择了第二个版本，因为它精确匹配。\n\n## 函数模板\n\n函数模板允许我们根据泛型类型（s）定义函数，以便它可以处理不同类型的数据。每当调用此类函数时，编译器都会检查参数的类型并为该特定类型创建一个函数版本。定义函数模板的示例是：\n\
  \n\n\n\n让我们来看看它是如何工作的。假设我们想创建一个返回数字绝对值的函数。由于我们不知道数字的类型，因此我们必须编写不同的函数，或者为所有可能的类型对一个函数进行重载。现在来看看模板为我们提供的灵活性。通过模板，我们不需要编写不同的版本；只需要根据某些泛型类型写一个函数模板，同一个函数就可以适用于各种类型。这就是*泛型编程*（generic\
  \ programming）的概念。以下程序使用模板函数 `abs()` 来查找不同类型数字的绝对值：\n\n关于程序设计，在一个可能使用相同模板的多个源文件的项目中，通常的做法是将函数模板的定义放在头文件中，并在任何使用该模板的文件包含该文件。在我们由单个源文件组成的示例中，为了简单起见，我将函数模板的声明和定义都放在该文件中。\n\
  \n要声明一个函数模板，我们编写 `template` 关键字，并在 `<>` 内部编写 `typename` 关键字以及模板参数的名称。与用于传递值的普通函数参数不同，函数模板的参数通常用于传递*类型*。注意，我们也可以使用\
  \ `class` 替换代替 `typename`。`typename` 词是后来添加到 C++ 中的，因此你可能会遇到使用 `class` 的代码。我倾向于使用\
  \ `typename`，因为它清楚地表示参数 `T` 对应某些类型的名称。此外，`class` 词可能会产生该类型必须是类的虚假印象，事实并非如此。至于参数名称，你可以选择任何喜欢的名称，只要它们遵循命名规则即可。通常的做法是使用以字母\
  \ T 开头的短名称（例如 `T1`、`T2`）。\n\n模板不是函数定义。它只是一个蓝图，为编译器提供如何定义函数的指示。那么，函数何时创建呢？每当编译器遇到对\
  \ `abs()` 的调用时，它会将 `T` 类型替换为参数的类型并创建函数。这被称为*模板参数推导*（template argument deduction）。例如，在第一次调用中，它将\
  \ `T` 类型替换为 `int` 并创建一个 `int` 版本的函数。因此，生成的定义为：\n\n```cpp\nint abs(int v) { return\
  \ (v < 0) ? -v : v; }\n```\n\n同样，在第二次调用中，编译器将 `T` 类型替换为 `float`，生成的 `float` 版本的定义为：\n\
  \n```cpp\nfloat abs(float v) { return (v < 0.0f) ? -v : v; }\n```\n\n因此，我们看到在每次调用中，编译器都会检查参数的类型；它将泛型类型的每次出现替换为该类型并创建相应的版本。这种类型的实例化被称为*隐式实例化*（implicit\
  \ instantiation），因为编译器在遇到调用时创建函数并推导出所传参数的类型。如果另一个函数调用需要相同的实例，编译器将使用现有的实例。\n\n由于参数的类型是固定且已知的，编译器在编译时实例化模板。因此，与函数重载一样，多态是在编译时实现的，这意味着使用模板不会导致程序执行时间的延迟。换句话说，模板提供了编译时参数化多态。最后，程序显示：6\
  \     1.2     3.4\n\n我们可以省略 `k` 的声明，并如下所示编写 `abs()`：\n\n```cpp\ntemplate <typename\
  \ T>\nT abs(T k) { return (k < 0) ? -k : k; }\n```\n\n我使用 `k` 的法为了向你展示你可以声明一个泛型类型变量，就像声明普通变量一样（例如\
  \ `T k`）。也就是说，模板参数的使用就像普通数据类型一样。例如，我们可以使用它的名称来构造派生类型（例如 `T*`、`T&`、……）。\n\n注意，使用函数模板并不会缩小可执行文件的大小。可执行文件包含了三个定义函数的定义，就像我们单独编写了它们一样。正如我们所说，模板的优势在于我们不需要为不同的数据类型编写相同的代码。我们只需根据泛型类型编写一次代码，该代码适用于多种类型。因此，代码更容易阅读、验证和维护，因为它只出现在一个地方。因为模板赋予我们编写使用泛型类型而非特定类型的程序的能力，我们说\
  \ C++ 支持泛型编程。特别是，泛型编程强调使用函数模板来编写可以应用于容器的泛型算法。例如，编写一个通用的 `sort()` 函数来对 vector 的元素进行排序：\n\
  \n练习 U.16.2 要求你以泛型方式实现我们在 C.12.10 中看到的 `bubble_sort()` 算法，以便对包含任何类型算术元素的 vector\
  \ 的元素进行排序。\n\n关于函数模板的参数，并不是所有参数都必须泛型类型。我们可以将它们与特定类型混合。这里有一个例子：\n\n```cpp\ntemplate\
  \ <typename T>\nvoid func(T v, int n) { ... }\n```\n\n像普通函数一样，函数模板可以声明为 `inline`\
  \ 或 `constexpr`。修符添加到返回类型之前。例如：\n\n```cpp\ntemplate <typename T>\nconstexpr T max(T\
  \ v) { ... }\n```\n\n### 模板变量\n\nC++14 允许创建模板变量。例如：\n\n```cpp\ntemplate <typename\
  \ T>\nT global_var;\n```\n\n通常，模板变量用于函数模板和类。例如：\n\n```cpp\ntemplate <typename T>\n\
  class Box {\n    static T value;\n};\n```\n\n模板变量背后的想法是，为了通用目的，可以使用不同的类型进行初始化。例如，我们可以写：\n\
  \n```cpp\nglobal_var<int> = 5;\n```\n\n当调用 `circle_perim()` 时，编译器会将 `T` 替换为参数类型并创建函数。由于\
  \ `T` 变为 `int`，返回 3。\n\n### 使用模板时的错误\n\n先尝试这个练习。写一个交换两个参数值的函数模板。假设参数类型相同。然后，写一个程序来验证该操作。\n\
  \n```cpp\ntemplate <typename T>\nvoid swap(T &a, T &b) {\n    T temp = a;\n    a\
  \ = b;\n    b = temp;\n}\n```\n\n在第一次调用 `swap()` 时，`T` 被替换为 `int`，在第二次调用时替换为 `double`。程序显示：2\
  \     1     5.6     3.4\n\n注意参数必须具有相同的类型，因为编译器期望替换相同的 `T`。也就是说，如果我们写：\n\n```cpp\n\
  int a = 1;\ndouble b = 2.5;\nswap(a, b);\n```\n\n编译器将显示错误信息。有人可能会问，编译器不进行通常转换吗？答案是否定的。特别是它会将数组或函数参数转换为指针，并允许传递给指向非**const**\
  \ 的引用或指针。例如：\n\n```cpp\nint arr[] = {1, 2};\nint *p = arr;\n```\n\n当你编写或使用函数模板时，并不意味着它适用于所有类型。例如，如果你将字符数组传递给\
  \ `swap()`，编译器将显示不允许赋值的错误信息：\n\n```cpp\nchar s1[4] = \"a\";\nchar s2[4] = \"b\"\
  ;\nswap(s1, s2);\n```\n\n解决这个问题的方法是如我们在下一节中看到的，编写一个对应类型的重载版本。例如：\n\n```cpp\nvoid\
  \ swap(char *a, char *b) { ... }\n```\n\n此外，在编写函数模板时，代码可能不支持某些类型的某些操作或提供无意义的结果。例如：\n\
  \n我们将数值传递给 `cmp()`，它将按预期工作。但，如果我们传递两个数组，它将只比较地址而不是元素。如果我们传递用户自定义类型（例如类），`cmp()`\
  \ 只有在类重载了 `<` 运算符的情况下才能工作，正如我们在第 18 章中所示。否则，编译器将显示错误信息。\n\n\n\n\n注意，像之前的错误一样，这些错误只有在创建了函数模板定义时才会发生。在这种情况下，编译器会执行常规检查，例如检查参数的类型和数量、返回值以及函数内部类型的正确使用情况。如果没有定义函数模板，编译器能做的只是检测语法错误，例如使用未声明的变量。\n\
  \n### 使用不同类型的模板参数\n\n模板参数可以具有不同的类型。例如，让我们写一个函数模板来显示两个数中较大的那一个：\n\n例如，在第二次调用中，编译器将\
  \ `T1` 类型替换为 `double`，将 `T2` 类型替换为 `int`，生成的定义如下：\n\n编写模板时可能会出现的一个问题是，你不知道在声明中使用什么类型。例如，让我们改变\
  \ `f()`，将其参数之和赋值给一个变量：\n\n`sum` 的类型会是什么？由于我们无法预先知道 `f()` 将被如何使用，因此无法指定该类型。例如，如果\
  \ `T1` 是 `double` 且 `T2` 是 `int`，则 `sum` 必须声明为 `double`。然而，如果 `T1` 是 `short` 且 `T2`\
  \ 是 `int`，则 `sum` 必须声明为 `int`。解决这个问题的一种方法是使用 `auto` 限定符。或者，我们可以使用 `decltype` 限定符。例如：\n\
  \n`sum` 的类型将与 `a+b` 的类型相同。\n\n下一个可能的问题是，如果函数模板返回的值的类型取决于参数，那该怎么办？例如，如果我们想修改函数并返回\
  \ `sum`，返回类型应该是什么？和之前一样，我们无法指定返回类型，因为我们不知道将传递何种类型的参数给 `f()`。解决方案解决方案是使用 `auto` 限定符，正如我们在第\
  \ 11 章中讨论返回类型推导时所示。看这个程序：\n\n`auto` 关键字被放在返回类型的位置。太棒了，这种返回类型推导是一个非常棒的功能！在调用函数时，类型将根据\
  \ `sum` 的类型进行推导。因此，返回类型变为 `double`，程序显示 3.3。\n\n### 模板参数的类型\n\n在某些情况下，我们可能希望或必须显式指定模板参数的类型。一种情况是函数返回的值的类型与其参数的类型不同。例如：\n\
  \n当我们调用 `f()` 时，我们在 `<>` 中指定了 `T1` 类型。`T2` 和 `T3` 类型将根据参数的值进行推导。例如，如果我们写：\n\n`T1`\
  \ 类型将被替换为 `int`，编译器将根据对应参数的类型确定 `T2` 和 `T3` 类型。当显式设置了多个模板参数时，每个参数（例如 `int`）从左到右对应于相应的模板参数（例如\
  \ `T1`）。\n\n### 非类型参数的使用\n\n函数模板可以接受以下参数：\n\n1. 类型。\n2. 整数类型（例如 `int`）。\n3. 指向函数或对象类型的指针和引用。\n\
  4. 指向类成员的指针。\n5. 枚举类型。\n\n参数的数量可以是固定的也可以是可变的，正如我们下面所示。最常见的参数是我们目前为止遇到的，即类型。让我们再次看一些例子：\n\
  \n非类型参数代表一个值而不是类型。非类型参数的值应该能够在编译时确定。例如，整数参数的一个典型用法是我们想要指定内存大小时：\n\n参数值在函数内部被视为常量，我们不允许更改其值。也就是说，编写\
  \ `size = 20` 是错误的。我们将在第 23 章的相应部分进一步讨论非类型参数。\n\n### 默认参数值\n\n与普通函数一样，我们可以为函数模板的参数设置默认值。例如：\n\
  \n如果省略了 `T2` 的类型，即写 `f<double>()`；`T1` 的类型将是 `double`，`T2` 的类型将是 `int`。\n\n我们也可以为非类型参数指定默认值。例如：\n\
  \n如果我们写 `f<int>()`；`T` 的类型将是 `int`，且 `s` 等于 20。\n\n### 显式实例化\n\n除了隐式实例化，我们还可以指示编译器直接创建函数定义。这种实例化被称为*显式实例化*。显式实例化以\
  \ `template` 单词开头，但不带 `<`。类型包含在 `<>` 内部。例如，如果在 C.16.11 示例中添加以下语句：\n\n编译器将使用 `abs()`\
  \ 函数模板直接使用 `int` 类型创建一个定义。如果程序中使用了该函数，也会发生显式实例化。例如：\n\n这为 `double` 类型创建了一个显式实例化。如果指定的类型与参数的类型不匹配，编译器将尝试类型转换。例如，如果我们写：\n\
  \n编译器创建了一个 `int` 类型的实例。因此，`c` 被转换为 `int`，代码输出 3。所以，请注意类型不匹配，因为编译器可能会提供不希望的隐式转换。\n\
  \n显式实例化可以提高编译和链接速度。此外，在大型应用程序中如果需要在多个文件中使用同一个函数模板，我们可以通过 `extern` 避免重复创建。例如，如果 `abs<int>`\
  \ 定义在一个文件中，而我们在第二个文件中使用它，我们写：\n\n通过 `extern` 声明，编译器不会在此文件中重新定义 `abs<int>`。就像普通的变量声明一样，`abs<int>`\
  \ 的定义将在另一个文件中查找。同样的，对于给定的实例化可以有很多 `extern` 声明，但只有一个定义。\n\n### 函数模板的重载\n\n正如我们所说，编写函数模板是为了对多种类型应用相同的代码。然而，可能我们需要一个执行相似而非相同操作函数。在这种情况下，我们可以重载函数模板，就像我们学习重载普通函数一样。例如，假设我们想写一个返回其参数绝对值的函数模板，以及另一个显示其参数绝对值的模板：\n\
  \n就像重载一样，签名必须不同。第一个签名是 `(T)`，而第二个是 `(T, T, int)`。我在第二个 `abs()` 中添加整数 `c` 是为了向你展示，与普通函数一样，我们可以拥有带有默认值的参数。程序显示：1\
  \ 1.2\n\n### 显式特化\n\n在编写函数模板时，可能存在我们希望函数针对特定类型以不同的方式工作。为了实现这一点，我们可以声明一个函数模板的显式特化。例如，假设我们声明了以下结构：\n\
  \n如果我们想交换两个结构的内容，可以使用我们之前在示例 C.16.12 中看到的 `do_swap()` 函数。但如果我们只想交换成绩而不是名字，它将不起作用。解决方案是提供一个显式特化来处理显式的\
  \ `Student` 参数。例如：\n\n我猜特化版本的语法吓到你了。在讨论它之前，我想说明，没有必要创建一个特化版本。例如，我们可以声明一个名称不同的函数（例如\
  \ `swap_studs`）并调用它。这是一个使用相同名称的例子，这是典型的选择。\n\n\n\n\n如所示，特化函数的原型以 `template` `<>`\
  \ 开始，特化类型的名称（例如 `Student`）被括在函数名后的 `<>` 中。当参数类型为 `Student` 时，将选择该函数。由于编译器可以从传递的参数推断出特化类型，因此可以省略\
  \ `<Student>`，原型变得更加简单：\n\n注意，我们不使用特化版本，而是可以使用一个普通函数来重载函数模板。其原型将是：\n\n让我们来看一个例子：\n\
  \n我们之前看到的显式特化（explicit specialization）和显式实例化（explicit instantiation）之间的区别是：显式特化告诉编译器，如果参数类型为\
  \ `Student`，不要使用函数模板来创建函数定义，而是使用显式式为 `Student` 类型定义的特化定义。显式实例化则指示编译器为特定类型（或）立即创建一个定义。让我们来看包含所有情况的示例：\n\
  \n当编译器遇到 `int` 类型的 `do_swap()` 声明时，它会立即创建一个 `int` 版本的 `do_swap()`。在 `main()` 中，编译器检查\
  \ `do_swap()` 的参数并选择合适的版本。例如，在第一次调用时，它调用已经创建的 `int` 版本；在第二次调用时，它创建了一个 `double` 版本；在第三次调用时，它选择了针对\
  \ `Student` 类型的特化版本。\n\n### 变数量类型的模板\n\nC++11 允许我们定义一个接受任意类型变数量参数的函数模板。这被称为变参模板（variadic`\
  \ template 让我们让我们来看一个例子：\n\n在 `f()` 的第二个版本中，为了声明第二个参数接受变数量的类型，我们在 `typename` 之后添加了省略号\
  \ `…`。对于名称（例如 `T_List`），你可以选择任何想要的有效名称。因此，`T_List` 包含一个类型列表，而 `T` 对应于单个类型。`…` 也添加在参数列表的名称之后。`v_list`\
  \ 包含与 `T_List` 中的类型列表匹配的值列表，而 `val` 对应于类型 `T` 的单个值。\n\n所以，当第一次调用 `f()` 时，`T_List`\
  \ 参数包含了所有与参数匹配的类型，即 `int`、`double` 和 `const` `char*`。`v_list` 参数包含了值 2、3.4 和 `t1`。同样，在第二次调用中，`T_List`\
  \ 包含了两个类型的 `const` `char*`，`v_list` 包含了值 `t2` 和 `t3`。\n\n那么，`f()` 如何访问这些值呢？注意，我们不能对\
  \ `v_list` 进行索引，即通过类似 `v_list[1]` 来显示第二个值。访问是通过递归实现的。具体来说，每次调用 `f()` 时，第一个参数的类型被赋值给\
  \ `T`，值被赋值给 `val`。剩余的类型和值留在 `T_List` 和 `v_list` 中，并通过 `f()` 的下一次递归调用逐一个地访问，直到参数列表耗尽。此时，将调用\
  \ `f()` 的第一个版本。这就是它存在的原因，以便结束递归。在我们的示例中，它只是换了行，使得第二个 `f()` 的参数出现在下一行。注意，在 `f()`\
  \ 调用中，我们在参数名称后添加了 `…`，以展开 `v_list` 中包含的值列表。\n\n让我们分析一下 `f(2, 3.4, \"t1\")` 的调用以便更好地理解。`T`\
  \ 变为 `int`，`val` 等于 2。另外两个类型留在 `T_List` 中，两个值留在 `v_list` 中。`f()` 显示 2，然后我们进行了递归调用\
  \ `f(3.4, \"t1\")`；也就是说，每次 `v_list …` 参数都会被替换为剩余的值。现在，`T` 变为 `double`，`val` 等于 3.4。最后一个类型留在\
  \ `T_List` 中，其值留在 `v_list` 中。`f()` 显示 3.4，下一次递归调用是 `f(\"t1\")`。现在，`T` 变为 `const`\
