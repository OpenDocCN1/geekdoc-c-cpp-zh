  ### `strcmp()` 和 `strncmp()` 函数\n\n`strcmp()` 函数在 `cstring` 中声明：\n\n`strcmp()` 比较\
  \ `str1` 指向的字符串与 `str2` 指向的字符串。如果字符串相同，`strcmp()` 返回 0。如果第一个字符串小于第二个字符串，`strcmp()`\
  \ 返回负值；而如果它大于第二个，则返回正值。如果满足以下条件之一，则认为一个字符串小于另一个字符串：\n\n1. 字符串的前 `n` 个字符匹配，但第一个字符串中第\
  \ `n+1` 个字符的值小于第二个字符串中第 `n+1` 个字符的值。\n2. 所有字符都匹配，但第一个字符串比第二个短。\n\n让我们看一些例子。`strcmp(\"\
  onE\", \"one\")` 返回负值，因为第一个不匹配字符 'E' 的 ASCII 码小于 'e' 的 ASCII 码。`strcmp(\"w\", \"\
  many\")` 返回正值，因为第一个不匹配字符 'w' 的 ASCII 码大于 'm' 的 ASCII 码。`strcmp(\"some\", \"something\"\
  )` 返回负值，因为前四个字符匹配，但第一个字符串比第二个短。\n\n一个非常常见的错误是使用 `==` 运算符来比较字符串。例如，再次查看 C.10.5 练习。因此，接下来的代码中的\
  \ `if` 条件：\n\n并没有比较字符串，而是比较了 `str` 的值与指向字符串字面量的指针的值。由于值不同，无论用户输入什么字符串，条件始终为假。\n\n\
