  \ 5000、5001、5002 和 5003 关联的内存内容分别为 10、0、0 和 0。其余的框是空的。</details> \n\n当声明一个变量时，编译器会预留所需的连续字节来存储其值。如果一个变量占据超过一个字节，则变量的地址就是第一个字节的地址。例如，通过声明\
  \ `int a = 10;`，编译器预留四个连续的未使用字节（例如地址 5000–5003），并在那里存储值 10，假设该值的低位字节存储在低地址字节中（*小端*\
  \ (little-endian) 架构）。编译器将变量名与其内存地址关联。当在程序中使用该变量时，编译器会访问其地址。例如，通过语句 `a = 3;`，编译器知道\
  \ `a` 的内存地址是 5000 并将其内容设置为 3。\n\n### 指针声明\n\n指针变量是一个可以存放内存地址的变量，例如另一个变量的内存地址。要声明指针，我们写道：\n\
  \n```\nint *ptr;\n```\n\n所示，`*` 字符必须位于指针变量名之前。例如，通过声明：`int *ptr;` `ptr` 被声明为指向 `int`\
  \ 类型的指针变量。因此，`ptr` 可以存放 `int` 变量的内存地址。在一般情况下，如果类型是 *T*，则 `T*` 的类型是“指向 *T*”。指针变量可以与其他相同类型的变量一起声明。例如：\n\
  \n```\nint *p1, p2;\n```\n\n注意，允许将 `*` 放在类型旁边（例如 `int* p`）。我们可以说，当我们写 `int *p;`\
  \ 时，我们强调的是值，即 `p` 是一个整数；而当我们写 `int* p;` 时，我们强调的是类型，即 `p` 是一个指向整数的指针。\n\n### 指针初始化\n\
  \n在声明指针变量后，我们可以用它存储另一个变量的内存地址。要找到变量的地址，我们在其名称前使用 `&` 运算符。例如：\n\n```\nptr = &a;\n\
  ```\n\n通过语句 `ptr = &a;` `ptr` 变得相等，或者说“指向” `a` 的内存地址。正如我们所说，编译器分配内存来存储其值。程序输出 `a`\
  \ 的地址和 `ptr` 的地址，采用十六进制。如所示，使用指针我们更接近硬件和系统内存。将整数值赋值给指针变量可能会导致编译错误。这是逻辑上的，因为指针不是整数。然而，在需要直接访问硬件地址的应用程序（例如嵌入式系统），可以使用类型转换来允许赋值。例如：\n\
  \n```\nptr = (int*)10;\n```\n\n指针变量可以在声明时进行初始化，前提是它所指向的变量已经声明。例如：\n\n```cpp\nint\
  \ *ptr = &a;\n```\n\n作为一种风格习惯，我倾向于在单独的语句中初始化指针变量，而不是与它们的声明一起，以便使其更清晰。在某些示例中，为了节省空间将不会这样做。\n\
  \n如果你想知道指针变量的大小，在你的系统中使用 `sizeof` 运算符（例如 `sizeof(ptr)`）。\n\n`&` 运算符不能应用于常量（例如 `&20`）、表达式（例如\
  \ `&(a+b)`）和位域（我们将在第 13 章中讨论它们）。它只应用于内存对象，如变量、数组元素和函数。\n\n### 空指针\n\n\n\n\n与普通变量一样，指针变量的初始值是其地址的内容，也就是说指针最初指向一个“垃圾”地址。当我们想要显式地声明指针不指向任何地方时，我们将其赋值为\
  \ 0。许多人倾向于使用宏 `NULL` 而不是 0。`NULL` 宏定义在几个头文件中（例如 `stdlib`）。被赋值为 0 或 `NULL` 的指针被称为空指针，它不指向任何内容。例如，以下程序首先输出指针的初始值，然后输出\
  \ 0：\n\n虽然值 0 可以在指针上下文中使用，但使用 `NULL` 会使代码更易读。例如，赋值 `p = 0;` 可能会误导读者。`p` 是一个数值变量还是一个指针？相反，赋值\
