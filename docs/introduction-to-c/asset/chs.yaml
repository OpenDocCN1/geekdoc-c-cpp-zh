  \ `true` 在转换为值时变为 1，而 `false` 转换为 0。相反，非零值转换为 `true`，而零值转换为 `false`。例如：\n\n```\n\
  通常情况下，bool 变量用于存储操作的结果，例如是否在数组中是否找到了某个值。\n```\n\n`float`、`double` 和 `long double`\
  \ 类型用于存储带有小数部分的值，即浮点数。与整数类型不同...\n\n\n\n\n总而言之，由于浮点变量只能存储特定数量的有效数字，任何额外的有效数字都会丢失，因此请注意舍入误差的可能，这可能会影响你程序的行为。\n\
  \n你可能认为这段讨论应该出现在书的后部分，而不是现在这么早。你可能是对的，但我倾向于在讨论类型时现在讨论它，并在此处引起你的注意，而不是将其添加到其他你可能不会注意到的地方。\n\
  \n为了简单起见，我在整本书中都做了一些假设。我假设编译器支持的类型特性如 表 2.1 所示，一个字节包含八个位（是的，它可以包含更多），并且系统使用最常用的表示符号数的方法，即二补码。此外，我假设底层的字符集是\
