  \ `n`：\n\n```\nptr += n;\n```\n\n会将指针的值增加 `n*指针数据类型的大小`，并使指针指向其所指向元素之后的第 n 个元素的地址。例如，如果\
  \ `ptr` 指向数组元素 `arr[i]` 且 `n` 为 3，则 `ptr` 将指向 `arr[i+3]`。根据我们在第 2 章中对数据类型的假设，如果\
  \ `ptr` 被声明为指向 `int` 或 `float` 数组的指针，其值将增加 `n*4`，因为这两种类型都是四个字节。如果是 `char` 数组，其值将增加\
  \ `n*1=n`；而如果是 `double` 数组，则增加 `n*8`。在对指针加上整数后，指针必须指向数组元素或末尾之后的第一个位置，这被视为有效结果。如果不是，加法和解引用指针都会引发未定义行为。让我们下面的程序：\n\
