  \ 将 `str3` 中的三个字符复制到 `str1`，并追加两个空字符以达到值 5。因此，程序显示 Get。\n\n### `strcat()` 函数\n\n\
  `strcat()` 函数在 `cstring` 中声明：\n\n`strcat()` 将 `src` 指向的字符串附加到 `dest` 指向的字符串的末尾。`strcat()`\
