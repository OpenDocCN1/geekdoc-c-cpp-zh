  \ `p` 是一个指向该类型结构体的指针。或者，我们可以写成 `Book b2(b1);`。我们将在稍后讨论对结构的操作。\n\n最后，在 `variable_list`\
  \ 中声明的结构变量可以同时初始化。例如：\n\n自 C++11 起，我们可以跳过 `=` 来指定初始值。例如：\n\n### 指向结构成员的指针\n\n指向结构成员的指针像普通指针一样。例如，以下代码使用指针显示\
  \ `b` 成员的值：\n\n要使指针变量指向结构成员，其类型应与成员的类型兼容。例如，由于 `year` 成员的类型为 `int`，因此 `p2` 被声明为\
  \ `int*`。\n\n### 结构操作\n\n虽然我们不能使用 `=` 运算符将一个数组拷贝到另一个数组，但可以使用它将一个结构拷贝到另一个结构。结构必须是相同的类型。考虑以下程序：\n\
  \n`s2 = s1;` 语句将 `s1` 的成员拷贝到 `s2`。它等同于：\n\n注意，如果 `s1` 和 `s2` 不是相同结构类型的变量，即使这两个类型包含完全相同的成员，`s2\
  \ = s1;` 语句也无法通过编译。\n\n同样注意，如果结构包含一个字符数组（例如 `char name[100];`），尽管不允许编写 `s2.name\
  \ = s1.name;`，但一旦结构被拷贝（例如 `s2 = s1`），`s1` 数组就会拷贝到 `s2`。此外，如果它包含一个指针成员，在拷贝后两个指针将指向同一个地方。这可能是危险的。我们将在接下来的两个章节看到此类示例。\n\
  \n除了赋值外，无法对整个结构执行任何其他操作。例如，运算符 `==` 和 `!=` 不能用于来测试两个结构是否相等。因此，不允许写成：\n\n要测试两个结构是否相等，我们应该逐个比较它们的成员。例如：\n\
  \n在序言中我告诉过你，编程时可能需要一些运气。这是一个例子。有一次，我必须比较两个结构。该结构不包含比较时可能危险的成员，例如浮点数成员、指针或字符数组。由于结构包含许多成员，我决定使用\
  \ `memcmp()`（我们将在第 14 章中看到）来节省编写工作，而不是逐个比较。然而，我忘记了为了对齐结构，可能会添加值不确定的填充位（holes）。这意味着两个结构的比较，即使相应的成员具有相同的值，也可能因为填充位中不同的值而失败。对我来说幸运的是，填充位的值相同。更幸运的是，我不需要将应用程序迁移到另一个平台。想象一下这种情况：比较在我的平台上运行正常但在客户那里失败了，只因为那里的填充位不同。一一想到要去寻找那个\
  \ bug，我就感到害怕！有时，每个程序员都需要运气的避风港，就像*滚石乐队*（*Rolling Stones*）的*Gimme Shelter*。\n\n###\
  \ 包含数组的结构\n\n由于结构可以包含任何类型的数据，因此它可能包含一个或多个数组。例如，以下程序的输出是什么？\n\n正如你所猜的，数组成员的对待方式就像普通数组一样。例如，语句\
  \ `strcpy(s1.name, \"somebody\");` 将字符串 `somebody` 拷贝到 `name`。`s1.name[0]` 的值变为\
  \ `'s'`，`s1.name[1]` 变为 `'o'`，依此类推。\n\n当使用指针运算处理数组元素时，`*` 运算符必须位于结构名称之前。例如，由于 `s1.name`\
  \ 可以用指向其第一个字符的指针，`*s1.name` 等于 `s1.name[0]`，`*(s1.name+1)` 等于 `s1.name[1]`，依此类推。由于优先级原因，必须存在括号。赋值\
  \ `s2 = s1;` 会拷贝数组。因此，程序输出：\n\n### 包含指针的结构\n\n结构可以包含一个或多个指针成员。指针成员的对待方式就像普通指针。例如，以下程序的输出是什么？\n\
  \n通过语句 `s1.name = \"somebody\";` 编译器分配内存来存储 `somebody`，然后 `name` 指向该内存的开头。语句 `s1.avg_grd\
  \ = &grd;` 使 `avg_grd` 指向 `grd` 的地址。要访问指针成员指向的内存的内容，`*` 运算符必须位于结构名称之前。因此，程序显示：`8.5`。\n\
  \n然后语句 `s2 = s1;` 使 `s2` 的指针指向与 `s1` 指针相同的地方。因此，程序显示：`body3.4`（小心，否则如此）。\n\n我放这条语句是为了警告你拷贝包含指针的结构。目标结构（例如\
  \ `s2`）当前的指针值将丢失。所以注意，这可能会在你的程序中引起严重问题。\n\n### 嵌套结构\n\n结构可以包含一个或多个结构。嵌套结构必须在包含它的结构之前声明，否则编译将失败。例如，在以下程序中，`prod`\
  \ 包含了嵌套结构 `s_date` 和 `e_date`。`s_date` 持有生产日期，`e_date` 持有有效期。\n\n注意，为了访问嵌套结构的成员，必须使用两次\
  \ `.` 运算符。程序相减相应的成员并显示产品的寿命。通常情况下，结构允许包含包含另一个结构的结构，依此类推。\n\n让我们来看一个特殊情况。假设我们想要声明两个相互依赖的结构，结构\
  \ `A` 一个类型为 `B` 的结构，而结构 `B` 一个类型为 `A` 的结构。如果我们写类似这样的：\n\n编译器将为 `b` 的声明显示错误信息，因为它不知道\
  \ `B` 及其大小。如果我们反转声明，编译器将为成员 `a` 显示相同类型的错误。克服这种情况的一种方法是使 `b` 变成指针（我们修改两者以保持相似性）：\n\
  \n\n\n\n由于编译器知道需要为指针分配多少内存，因此在声明 `b` 时，不需要知道 `B` 的完整声明。为了通知编译器 `B` 的存在，会添加一个不完整的声明，也称为**前向声明**（forward\
  \ declaration）。C++ 允许对结构进行不完整声明，只要完整声明在同一作用域内稍后出现即可。注意，正如错误语句中的注释所示，在声明完成之前，你不允许访问其成员或声明变量。\n\
  \n### 位域（Bit Fields）\n\n结构可以包含长度指定为位数的字段。位域的声明方式如下：\n\n位域可以像其他成员一样被使用。位域的类型必须是整型。由于某些编译器可能将位域的高位处理为符号位，而另一些则不会，为了可移植性，请显式地将位域声明为\
  \ `signed`（有符号）或 `unsigned`（无符号）。这是一个包含多个位域的结构示例：\n\n由于字段的类型相同，我们可以写成：\n\n`unsigned\
  \ int card_id: 4, tax_id: 6, age: 3;` 由于 `age` 字段的大小为 3 位，它可以取 0 到 7 之间的值。其余字段也是此类推。为了存储这些值，需要\
  \ `4+6+3 = 13` 位。由于它们的类型是 `unsigned int`，编译器分配了四个字节，并剩余 `4×8-13 = 19` 位未使用。注意，不允许创建位域数组。\n\
  \n使用位域的主要优势是节省内存空间。例如，如果不使用位域，编译器将分配 12 字节而不是 4 字节。因此，如果我们使用 `Person` 结构来存储 200,000\
  \ 个人的数据，我们将能节省 1,600,000 字节。\n\n位域通常用于描述和访问以位级编码的信息，例如硬件寄存器。例如，图中所示的寄存器信息可以这样编码：\n\
