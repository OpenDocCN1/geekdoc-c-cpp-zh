  \ 个整数并使用 `switch` 语句显示用户输入 1 和 2 的次数。\n\n### C.6.3\n编写一个程序，读取一个整数并显示它的阶乘。正整数 `n`（`n\
  \ ≥ 1`）的阶乘定义为 `1 × 2 × 3 × … × n`，而 `0` 的阶乘等于 `1 (0! = 1)`。由于阶乘增长迅速，可能很快就会超过较大整数类型的容量，因此不要输入大整数。\n\
  \n**注释：** 我将 `fact` 声明为 `unsigned long long int` 的法为了最大化可以计算的阶乘范围。例如，如果我们使用 `int`\
