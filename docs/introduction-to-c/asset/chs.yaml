  \ 类的默认值是 `\"\"`。\n\n结构变量可以在声明时进行初始化。声明之后跟着一个包含在大括号 `{}` 中的初始化器列表。该列表的顺序必须与结构成员的顺序一致，并与它们的数据类型匹配。列表值之间用逗号分隔，且值不能多于成员。考虑以下声明：\n\
  \n`b.title` 的值变为 `\"Literature\"`，`b.year` 变为 `2016`，`b.price` 变为 `10.85`。\n\n与数组一样，任何未赋值的成员都被赋予值\
  \ `0`。例如，通过声明：\n\n`year` 和 `price` 成员的值被设置为 `0`。\n\n如果 `{}` 是空的，成员将用其类型的默认值初始化。例如，通过声明：\n\
  \n`b.title` 的值变为 `\"\"`，`b.year` 和 `b.price` 的值等于 `0`。\n\n具有自动存储生存周期的结构可以通过赋值进行初始化。例如：\n\
