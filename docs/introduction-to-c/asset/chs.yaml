  \n## 12 数组搜索与排序\n\nDOI: [10.1201/9781003230076-12](https://doi.org/10.1201/9781003230076-12)\n\
  \n本章描述了用于在数组中搜索值以及按升序或降序排列数组元素的一些最常用算法。如需更多算法、性能分析、指标和最佳实现，你应该阅读一本专注于该主题的书。本章的目的是让你接触这一领域，并对算法如何实现有一个初步的感觉。\n\
  \n## 搜索数组\n\n为了检查一个值是否存储在数组中，我们将描述线性搜索和二分搜索算法。\n\n### 线性搜索算法\n\n线性搜索算法（也称为顺序搜索）是在\
  \ `non-sorted` 非排序数组中搜索值的最简单算法。将搜索的值与每个元素的值进行比较，直到找到匹配项为止。在一个包含 `n` 个元素的数组中，最大搜索次数为\
  \ `n`，这发生在被搜索的值是最后一个元素或不在数组中时。在下面的程序中，`linear_search()` 函数实现了线性搜索算法。\n\n## 练习题\n\
  \n**C.12.1** 编写一个函数在双浮数数组中搜索一个数字。如果该数字被存储，函数应返回其位置。在下面的程序中，`linear_search()` 函数实现了线性搜索算法。\n\
  \n**C.12.2** 编写一个函数，接受整数数组作为参数并返回位置。\n\n### 二分搜索算法\n\n二分搜索算法用于在 `sorted` 排序数组（升序或降序）中搜索值。为了理解算法原理，假设我们在数组中搜索一个值：\n\
  \n步骤 1：使用变量 `start` 和 `end` 指定部分的开始和结束：`middle = (start+end)/2`。\n\n步骤 2：将搜索的值与\
  \ `middle` 元素比较：\n1. 如果它们相等，则找到了被搜索的值，算法终止。\n2. 如果大于，则从中间位置到结束继续搜索。`start` 的值变为\
  \ `middle+1`。\n3. 如果较小，则从开始到中间继续搜索。`end` 的值变为 `middle-1`。\n\n简而言之，二分搜索算法将数组分为两部分。然后，将搜索的值与\
  \ `middle` 元素比较，并在相应的部分继续搜索。如果找到了搜索的值或 `start` 大于 `end`，算法终止。在 `n` 个元素的排序数组的最大搜索次数为\
  \ `log[2]n`。在下面的程序中，`binary_search()` 函数实现了二分搜索算法。\n\n## 练习题\n\nC-12.3 编写一个函数在整数数组中搜索一个数字。如果找到了该数字，函数应返回其位置，否则返回\
  \ -1。编写一个程序初始化一个升序排序的整数数组。程序应该读取一个整数并使用函数显示其在数组中的位置。\n\n**注释：** 为了观察算法原理，假设用户输入数字\
  \ 45。\n\n第一次迭代：`start` 的初始值为 0，`end` 为 6。`middle` 变为 `(start+end)/2 = 6/2 = 3`。由于\
  \ `arr[middle]` 是 40，小于 45，下次执行的语句是 `start = middle+1 = 3+1 = 4`。\n\n第二次迭代：`middle`\
  \ 变为 `(start+end)/2 = (4+6)/2 = 5`。由于 `arr[middle]` 是 60，大于 45，下次语句是 `end = middle-1\
  \ = 4`。\n\n第三次迭代：`middle` 变为 `(start+end)/2 = (4+4)/2 = 4`。由于 `arr[middle]` 是 50，大于\
  \ 45，下次语句是 `end = middle-1 = 3`。\n\n\n\n\n\n由于 start 大于 end，循环终止，函数返回 -1。\n\n**C.12.4**\
  \ 编写一个程序，读取 `[0, 1000]` 之间的整数，并使用二分查找算法“猜”这个数字。程序应该通过提问来确定我们正在搜索的数字是小于还是大于检查区间的中间值。答案必须以\
  \ 0（否）或 1（是）的形式给出。程序应该显示找到该数字所需的尝试次数。\n\n## 数组排序\n有多种算法可以对数组进行排序。我们将描述一些最流行的算法：选择排序、插入排序、冒泡排序和快速排序算法。\n\
  \n### 选择排序算法\n为了描述该算法，我们将按升序对数组进行排序。首先，我们找到值最小的元素并将其与数组的第一个元素交换。因此，最小值被存储在第一个位置。\n\
  \n然后，我们在剩余元素中找到最小值，像之前一样将其与数组的第二个元素交换。因此，第二小的值被存储在第二个位置。此过程对剩余元素重复，一旦比较最后两个元素，算法停止。\n\
  要按降序排序数组，唯一的区别是找到最大值而不是最小值。在下面的程序中，`sel_sort()` 函数实现了按升序排序数组的选择排序。\n\n## 练习\n**C12.5**\
  \ 编写一个接收双精度数组作为参数的函数，使用选择排序将其升序排序。编写一个程序读取十个学生的成绩，将其存储在数组中并使用该函数排序。\n**注释：** 在内部循环的每次迭代中，`arr[i]`\
  \ 与 `i+1` 到 `SIZE-1` 的元素进行比较。如果某个元素小于 `arr[i]`，则交换它们的值。因此，在外层循环的每次迭代中，`i` 到 `SIZE-1`\
  \ 元素的最小值被存储在 `arr[i]`。要按降序排序，只需将 `if` 语句改为 `if(arr[i] < arr[j])`。\n\n**C12.6** 继续上一个练习，程序还应该读取十个学生的姓名（每个少于\
  \ 10 个字符）并升序显示。姓名应存储在向量中传递给 `sel_sort()`。\n\n**C12.7** 编写一个 `add_sort()` 函数，将一个数字插入已排序的数组中，使数组保持有序。编写一个程序读取九个整数，将其存储在十个整数的数组中并对这九个元素进行升序。然后，程序读取最后一个整数，使用\
  \ `add_sort()`将其插入数组并显示排序后的数组。\n\n**C12.8** 编写一个接收二维数组作为参数的函数并按行升序排序，另一个函数按列降序排序。编写一个程序生成\
  \ 20 个随机整数并将其存储在 4×5 的数组中。然后，程序读取一个整数，如果是 1，调用第一个函数，否则调用第二个。\n\n### 插入排序算法\n为了描述该算法，我们将按升序对数组进行排序。算法的操作基于每个元素（从第二个到最后一个元素）与其左侧形成“已排序子数组”的元素之间的比较。右侧的元素形成“未排序子数组”。特别是，“未排序子数组”中最左的元素（即被检查的元素）与“已排序子数组”的元素从右向左进行比较，如下：\n\
  \n> **步骤 1**：首先，将被检查的元素存储在一个临时变量中（图 a）。\n\n> **步骤 2a**：如果它小于“已排序子数组”的最右元素，则其位置不变，算法继续测试下一个最左的元素。\n\
  \n> **步骤 2b**：如果它小于“已排序子数组”的最右元素，则后者向右移动一位，同时被检查的元素与右数第一个元素进行比较（图 b 和 c）。如果不小于，则将被检查的元素存储在最后一个元素的位置；否则重复相同的过程（右数第一个元素向右移动一位，被检查的元素与右数第二个元素进行比较）（图\
  \ c 和 d）。步骤 2b 取决于被检查元素元素小于“已排序子数组”的元素（图 d 和 e），或到达“已排序子数组”的第一个元素。然后，对新的最左元素重复步骤\
  \ 1（图 e 和 f）。\n\n![六张图根据每个元素之间的顺序比较，分六步描述了插入排序算法](img/fig12_1.jpg)\n<details><summary>无编号图\
  \ 1 详细描述</summary>\n所有六张图都包含一个九个元素的数组，成行排列。步骤 1：图 a 中的元素从左到右的顺序为 -2, 1, 8, 11, 4,\
  \ -5, 7, 13, 2。深蓝色高亮的元素 4 被标记为 `temp`，这是存储在 `temp` 中的当前元素。`temp` 左侧的四个元素用浅蓝色突出并标记为已排序子数组。`temp`\
