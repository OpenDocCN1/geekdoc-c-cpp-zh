  \ 所引用的对象的类型。因此，程序显示 `Err3`。如果我们不使用引用，嗯，你知道会发生什么，会调用基类的拷贝构造函数来拷贝派生对象的基类子对象，而派生部分会被“**切片**（sliced）”。如果关于错误的诊断信息在该部分，它将会丢失。因此，安全的做法是使用引用。在我们的示例中，如果不使用引用，`Err1`\
