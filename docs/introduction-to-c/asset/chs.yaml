  \ 之间的随机值。然后，程序应该显示原始图像，将图像向右旋转 90°，并显示旋转后的图像（例如 5×3）。\n\n*提示*：使用第二个数组来存储旋转后的图像。\n\
  \n## 联合体 (UNIONS)\n\n类似于结构体，联合体包含一个或多个成员，这些成员可能具有不同的类型。联合体的属性与结构体的属性几乎相同；允许进行与结构体相同的操作。它们的区别在于，结构体的成员存储在`不同的`地址上，而联合体的成员存储在`相同的`地址上。由于使用包含类成员（例如\
  \ `string`）的联合体更为复杂，我将通过使用基本类型作为成员来描述联合体的属性。\n\n### 联合体声明\n\n联合体类型的声明与结构体相似，使用 `union`\
  \ 关键字代替了 `struct`。当声明联合体变量时，编译器只为其最大的成员分配空间。因此，其所有成员都存储在内存内存中相互相互叠。例如，在下面的程序中，变量\
  \ `s` 分配了八字节，因为它最大的成员类型是 `double`：\n\n该 `s` 联合体可以存储一个值，其类型可以是 `char`、`int` 或 `double`。由于编译器不为每个联合体成员分配内存，联合体的主要应用是节省内存空间。例如，联合体经常用于内存有限的嵌入式系统。\n\
  \n由于所有联合体成员共享相同的内存，在声明联合体变量时，`只有`第一个成员可以被初始化。例如，编译器允许我们写：\n\n但不能写成：`Sample s = {'x',\
  \ 10, 1.23};`\n\n### 访问联合体成员\n\n访问联合体成员的方式与访问结构体成员相同。然而，由于它们存储在相同的内存中，只有最后一个赋值的成员具有意义值。\n\
