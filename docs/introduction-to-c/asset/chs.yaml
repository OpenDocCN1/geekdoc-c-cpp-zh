  \ 153 是一个阿姆斯特数，因为 1³ + 5³ + 3³ = 1 + 125 + 27 = 153。\n\n## 7 数组\n\nDOI: [10.1201/9781003230076-7](https://doi.org/10.1201/9781003230076-7)\n\
  \n我们目前为止使用的变量可以存储单个值。在本章中，我们将讨论一种能够存储多个值的新类型变量。这种类型被称为数组（array）。本质上，数组是一种在连续内存中将相同类型的元素组合在一起的数据结构。它可能包含基本类型元素（例如\
  \ `int`）或用户定义的元素（例如结构体）。数组可以是多维的。我们将讨论最常见的数组形式，即一维数组和二维数组。为了向你介绍数组，我们将使用整数和浮点数元素等基本类型。我们还会讨论标准类\
  \ `vector`，这是一种对相同类型元素进行更灵活、更安全的方法。在随后的章节中，我们将讨论其他类型的数组，以及它们与指针之间的紧密关系。在第 12 章中，我们将描述一些在数组中搜索值和对其元素排序流行算法。\n\
  \n### 一维数组\n\n数组是一种包含多个相同类型的值（或称为元素）的数据结构。可以通过每个元素在数组中的位置来访问该元素。\n\n### 声明\n\n要声明一维数组，我们必须指定它的名称、元素数量和数据类型，如下所示：\n\
  \n`number_of_elements`（或数组的长度/大小）由方括号括起来的正整数常量表达式指定。所有元素都是相同类型；它可以是任何类型（例如 `int`、`float`、`char`\
  \ 等……）。例如，语句：`int arr[1000];` 声明了具有 1000 个 `int` 类型元素的数组 `arr`。为了理解数组的重要性，想象一下，如果\
  \ C++ 不支持这种聚合变量，我们就必须声明 1000 个不同的整数变量。\n\n也就是说，不允许向数组添加新元素或从中删除元素。如果数组的长度在程序中多次使用，良好的做法是使用常量代替。如果你以后需要更改它，只需在一个地方更改常量即可。否则，你将面临忘记更改某些地方的风险。例如：\n\
  \n一个常见的错误是使用变量来声明长度。例如：\n\nC++ 标准不允许在运行时指定大小。如所述，它必须是一个在编译时已知的常量表达式。然而，某些 C++ 编译器允许程序员使用变量进行声明。因此，如果你使用的编译器编译了之前的代码，请不要感到惊奇。\n\
  \n在声明数组时，编译器会分配一个内存块来存储其元素的值。这些值连续存储在相邻的内存位置中。通常，这块内存被分配在一个被称为*栈*（stack）的区域，并在声明数组的函数终止时自动释放。例如，通过语句\
  \ `int arr[3];`，编译器分配 12 字节来存储 3 个元素的值。如果我们假设第一个元素的内存地址位于位置 100，则第一个元素的值存储在 100-103\
  \ 位置，第二个元素的值存储在 104-107 位置，第三个元素的值存储在 108-111 位置。要找到分配内存的大小，我们可以使用 `sizeof` 运算符。例如，`sizeof(arr)`\
  \ 的值为 12。\n\n例如，以下程序：\n\n可能无法在你的计算机上运行，除非可用栈空间足够大以容纳这些值。在第 14 章中，我们将看到可以从更大的区域（称为*堆*，heap）中分配所需的内存。\n\
  \n### 访问元素\n\n要访问某个元素，我们编写数组名称，后面跟方括号 `[]` 内的元素索引。索引指定了元素在数组中的位置，它必须是一个整数常量、变量或表达式。在一个包含\
  \ n 个元素的数组中，第一个存储在位置 [0]，第二个存储在位置 [1]，最后一个存储在 [n-1]。例如，语句：\n\n声明了具有 1000 个 `float`\
  \ 类型元素的数组 `arr`，即 `arr[0]`、`arr[1]`、……、`arr[999]`。元素可以像普通变量一样使用。这里是一些示例：\n\n避免在索引中产生副作用。例如，不要编写这样的代码：`b[i]\
  \ = a[i--];`。`i` 何时递减取决于编译器。\n\n让我们看看如何使用数组。以下程序读取五个整数并将它们存储在数组中。然后，它倒序显示数组的元素。\n\
  \n### 常见错误\n\n初学者一个常见的错误是忘记索引计数从 0 开始。记住，在一个包含 n 个元素的数组中，第一个元素存储在位置 0 而不是 1，最后一个存储在位置\
  \ *n-1*，而不是 *n*。\n\n另一个常见错误。假设我们有两个相同大小和类型的数组，并且我们想将第一个数组（例如 `a`）的元素复制到第二个（例如 `b`）中。写\
  \ `b = a;` 看起来很自然。然而，这种看似合理的赋值是非法的；它无法通过编译。在第 8 章以及研究数组与指针之间的紧密关系时，你将看到原因。最简单的复制方法是使用循环并逐个复制元素，或者使用复制函数，如\
  \ `memcpy()`。\n\n还有一个。考虑 `a` 和 `b` 数组，假设我们要检查两个数组是否具有相同的值。逻辑上是写 `if (b == a)`。不，它的作用不像你预期的那样，元素并没有被比较。我们将在第\
  \ 8 章中看到实际比较的是什么。更糟糕的是这个误导性的语句可以编译，并给我们留下了数组正在被比较的假象。小心，这是一个常见的陷阱。\n\n还有一个非常严重的错误，它是许多程序崩溃的根源。\n\
  \n例如，考虑以下程序：\n\n由于 `a` 有三个元素，有效索引是从 0 到 2。因此，当 `i` 变为 3 时，语句 `a[3] = 0;` 将值赋值给了数组边界之外的元素。不，不幸的是，编译器不会通知我们这个重大错误。即使我们写\
  \ `a[-100] = 0;`，代码也能编译。为了继续执行，值 0 会覆盖 `a[2]` 之后内存的内容。如果这块内存是分配给 `i` 的，`i` 就会变成\
  \ 0，循环变成死循环。在你的计算机上测试一下会发生什么。\n\n永远不要忘记，越界数组会污染程序。大声播放 *Strychnine*（一种毒药），来自 *Fuzztones*（原曲来自\
  \ *Sonics*），让它深深刻在脑子里。\n\n### 初始化\n\n像普通变量一样，数组可以在声明时初始化。未初始化的元素将获得其内存位置的任意值，就像未初始化的变量一样。在最常见的形式，数组初始化器是由花括号括起来并用逗号分隔的值列表。列表允许逗号结尾。例如，通过声明：\n\
  \n`a[0]`、`a[1]`、`a[2]` 和 `a[3]` 的值分别变为 10、20、30 和 40。\n\n\n\n\n如果初始化列表短于元素的数量，则剩余元素将被设置为该元素类型的默认值。整数的默认值为\
  \ `0`，浮点数类型为 `0.0`。例如，通过如下声明：\n\n```cpp\nint a[5] = {};\n```\n\n当 `a` 被声明时，它的元素被初始化为\
  \ `0`。语句 `a[++i] = 20;` 先增加 `i`，然后使 `a[i]` 等于 `20`。`for` 语句再次增加 `i` 一次。因此，偶数索引的元素，即\
  \ `a[0]`、`a[2]` 等……保持为 `0`，而奇数索引的元素，即 `a[1]`、`a[3]` 等……变为 `20`。\n\n值的列表不能超过元素的数量。例如：\n\
  \n如果省略了数组的长度，编译器将创建一个长度等于列表中值数量的数组。例如，通过该语句：\n\n```cpp\nint a[] = {10, 20, 30, 40};\n\
  ```\n\n编译器创建了一个包含四个整数的数组，并将值 `10`、`20`、`30` 和 `40` 分配给它的元素。\n\n如果我们希望数组的值（无论一维还是多维的）在程序执行期间保持不变，我们将数组声明为\
  \ `const`。`const` 数组必须在声明时进行初始化。例如，通过如下声明：\n\n```cpp\nconst int a[3] = {1, 2, 3};\n\
  ```\n\n`a` 数组被声明为 `const`。如果我们尝试更改任何元素的值，编译器将产生错误信息。例如，写入 `a[1] = 5;` 是非法的。\n\n\
  从 C++11 开始起，没有必要添加 `=`。例如：\n\n```cpp\nconst int a[3]{1, 2, 3};\n```\n\n我们还可以使用空括号\
  \ `{}` 将所有元素初始化为 `0`。例如：\n\n```cpp\nint a[100] = {};\n```\n\n### 基于范围的 for 语句\n\n\
  C++11 引入了一种更简单的 `for` 语句形式来访问值序列，例如数组或容器（如 `vector`）中的值。这种形式的 `for` 语句被称为 `range-for`。它的语法是：\n\
  \n```cpp\nfor (declaration : expression) {\n    statement;\n}\n```\n\n其中 `:` 之后的表达式表示一个值序列，而声明指定了用于存储序列元素值的变量。例如：\n\
  \n```cpp\nint arr[] = {10, 20, 30, 40};\nfor (auto i : arr) {\n    cout << i <<\
  \ \" \";\n}\n```\n\n在每次迭代中，从数组的第一个元素到最后一个元素，`i` 都会等于数组对应元素的值，也就是说，它的值被复制到 `i` 中并显示。循环遍历了数组的所有元素。也就是说，`i`\
  \ 将顺序赋值值 `10`、`20`、`30`、`40`。我们可以将 `i` 声明为 `int`，我只是使用了 `auto` 关键字，这样迭代的写法就是一种通用的方式，不依赖于数组的类型。让编译器推断类型更加灵活方便。\n\
  \n注意，数组的值被赋值给 `i`，这意味着我们不能通过改变 `i` 的值来改变它们的值。换句话说，`i` 是每个元素的局部拷贝。例如，如果我们写道：\n\n\
  ```cpp\nfor (auto i : arr) {\n    i += 5;\n}\n```\n\n这段代码只是给 `i` 增加了 `5`，它并没有改变元素的值。如果我们想更改元素的值，我们使用引用。我们将在第\
  \ 16 章 中讨论引用，目前只需知道引用是它所引用变量的别名即可。例如：\n\n```cpp\nfor (auto &i : arr) {\n    i +=\
  \ 5;\n}\n```\n\n在每次迭代中，从数组的第一个元素到最后一个元素，`i` 都会等于数组对应元素的值，也就是说，它的值被复制到 `i` 中并显示。循环遍历了数组的所有元素。也就是说，`i`\
  \ 将顺序赋值值 `10`、`20`、`30`、`40`。我们可以将 `i` 声明为 `int`，我只是使用了 `auto` 关键字，这样迭代的写法就是一种通用的方式，不依赖于数组的类型。让编译器推断类型更加灵活方便。\n\
  \n注意，数组的值被赋值给 `i`，这意味着我们不能通过改变 `i` 的值来改变它们的值。换句话说，`i` 是每个元素的局部拷贝。例如，如果我们写道：\n\n\
  ```cpp\nfor (auto i : arr) {\n    i += 5;\n}\n```\n\n这段代码只是给 `i` 增加了 `5`，它并没有改变元素的值。如果我们想更改元素的值，我们使用引用。我们将在第\
  \ 16 章 中讨论引用，目前只需知道引用是它所引用变量的别名即可。例如：\n\n```cpp\nfor (auto &i : arr) {\n    i +=\
  \ 5;\n}\n```\n\n## vector 类\n\n正如我们在第 26 章 中看到的，标准模板库（STL）包含了大量的容器、迭代器、函数对象。与数组不同，`vector`\
  \ 在内存中连续存储相同类型的元素。`vector` 允许动态增加其大小。要使用 `vector` 类，我们将在第 17 章 中讨论构造函数。例如：\n\n```cpp\n\
  vector<int> v1;\nvector<int> v2(5);\nvector<int> v3{1, 2, 3, 4, 5};\n```\n\n`vector`\
  \ 类提供了多种访问元素的方法。例如，以下程序读取学生数量，创建一个包含他们成绩的 vector 对象，以及另一个包含名字的 vector。\n\n```cpp\n\
  int n;\ncin >> n;\nvector<int> grades(n);\nvector<string> names(n);\nfor (int i=0;\
  \ i<n; ++i) {\n    cin >> grades[i] >> names[i];\n}\n```\n\n然后，显示成绩大于或等于平均分的学生的名字和成绩。我们将在第\
  \ 10 章 中讨论字符串类。目前，考虑每个名字都存储在字符串对象中。因此，`names` 对象包含了 `num` 个 `string` 类型的元素。注意我们使用\
  \ `[]` 运算符访问 vector 元素，就像数组一样。事实上，正如我们在第 18 章 中将学的，`vector` 类重载了 `[]` 运算符。此外，`vector`\
  \ 类提供了 `at()` 函数，它将元素的索引作为参数。例如：\n\n```cpp\nfor (int i=0; i<n; ++i) {\n    cout\
  \ << grades.at(i) << endl;\n}\n```\n\n与 `[]` 运算符的区别在于 `at()` 会检查是否越了 vector 的边界，在这种情况下会创建一个\
  \ `out_of_range` 异常。因此，如果你关心安全性，请使用 `at()` 并检查异常。另一方面，如果你确定你的代码永远不会限制，请使用 `[]` 以获得更高的速度。\n\
  \n\n\n\n让我们来看看内存是如何管理的。通常，编译器最初会分配比需要更多的内存，以避免在每次添加新元素时都进行连续的内存分配。如果可用内存耗尽，编译器将分配新内存来存储新元素。其大小取决于实现，典型大小是原始大小的一半。新内存的分配可能不只是相邻内存的简单扩展，因为这些内存可能用于其他用途。在这种情况下，编译器会在另一个区域分配新内存，并将原始内存的内容复制到新内存中。记住，vector\
  \ 元素始终存储在连续的内存位置中。`capacity()` 函数返回分配内存可以存储的元素数量，而 `size()` 函数返回已存储的元素数量。例如，使用我使用的编译器运行上述程序显示\
  \ 10 和 16。\n\n除了 `at()` 函数外，安全管理 vector 对象的另一种方法是使用 `begin()` 和 `end()` 函数。`begin()`\
  \ 返回一个指向对象第一个元素的迭代器，而 `end()` 返回一个指向最后一个元素之后位置的迭代器。目前，请认为迭代器的行为类似于指针。关于指针，我们将在第\
  \ 8 章中讨论。请看以下示例以获得直观理解，你可以在阅读第 8 章后再次查看它：\n\n像任何容器一样，`vector` 类声明了一个迭代器类型。`iter`\
  \ 变量被声明为 `iterator`。所示，我们使用 `iter` 用作指针，并将值 200 分配给 `vec` 对象的所有元素。使用 `begin()` 和\
  \ `end()` 函数配合迭代器遍历 vector 是一种安全的做法，因为它确保了不会超出 vector 的边界。\n\n通过使用迭代器，我们可以删除或向其中添加元素。例如，`erase()`\
  \ 函数接受两个迭代器作为参数，用于指定要删除的部分：\n\n第一个迭代器指定要删除部分的起始位置，而第二个迭代器指定其结束位置（不包含该位置）。因此，该语句删除了前三个元素，即从\
  \ `vec[0]` 到 `vec[2]`。如果我们调用 `size()` 显示元素数量，会发现它确实是 7。在另一个示例中，如果我们写道：\n\n除了第一个元素外，`vec`\
  \ 对象的所有元素元素被删除了。这意味着 `size()` 返回 1。`vector` 类支持 `erase()` 的重载版本，它接受一个迭代器作为参数并删除它所指的元素。例如，该语句：\n\
  \n删除了对象的最后一个元素。如果我们想添加一个新元素，则使用 `insert()` 函数。例如，该语句：\n\n在迭代器指示的位置之前（即 `vec[3]`\
  \ 之前）插入值 50。因此，新元素 `vec[3]` 的值为 50，而插入前存储为 `vec[3]` 的元素（现在变为 `vec[4]`）的值为 20。`vector`\
  \ 类支持 `insert()` 的重载版本来添加多个元素。其参数是三个迭代器。假设它们的名字分别为 `pos`、`first` 和 `last`。新元素被插入在\
  \ `pos` 所指位置的元素之前。该函数复制 `first` 和 `last` 之间的所有元素，包括 `first` 指向的元素，但不包括 `last` 指向的元素。也就是说，复制范围包含了区间\
  \ `first, last)` 中的所有元素。通常，此版本的 `insert()` 用于将元素从一个 vector 对象复制到另一个。例如：\n\n`v1`\
  \ 的内容变为：20 10 10 20 20\n\n`vector` 类提供了 `swap()` 函数并重载了几个运算符，例如 `=` 和 `==`。例如：\n\
  \n`swap()` 函数交换两个对象的内容，并在必要时分配更多内存来存储元素。因此，`v1` 的元素变为五个值为 10 的元素，而 `v2` 的元素变为三个个值为\
  \ 20 的元素。`=` 运算符将 `v1` 的元素赋值给 `v3`，而 `==` 运算符比较两个对象。如果它们相同，即它们具有相同数量的元素且值相等，则返回\
  \ `true`。\n\n另一方面，正如我们所说的，如果 `v1` 和 `v3` 是普通数组，那么编写 `v3 = v1` 是非法的。要复制元素，我们需要使用循环或某些复制函数。你将在[第\
  \ 8 章中看到，通过 `if(v3 == v2)` 来检查两个数组是否具有相同值是错误的。\n\n人们可能会问，是否在我们学习了类和模板之后再介绍 `vector`\
  \ 类更好，这样我们就能更好地理解它？在回答之前，让我们先讨论一下数组和 vector 之间非常重要的区别。数组的主要弱点是它不支持越界检查，正如我们所说的，如果发生这种情况，对程序的后果可能是灾难性的。相反，`vector`\
  \ 类支持对元素进行安全访问。其次，数组的大小是固定的，这意味着我们无法从中添加或删除元素。相反，`vector` 对象的大小可以根据需要随时通过添加或删除元素动态改变。第三，使用数组时，我们需要编写代码来管理它并支持各种功能，例如在其中搜索值。而\
  \ `vector` 代码是现成的，我们只需要调用适当的函数。例如我们看到了 `erase()` 和 `insert()`，还有更多。\n\n正如你看到的，`vector`\
  \ 类易于使用，并且比数组提供了更高的安全性和活性这就是我决定在本章讨论 vector 而不是之后的原因。你越早学会使用它对你越有利；我们将在几个编程练习中使用\
  \ vector 以便熟悉它。C++11 添加了 `array` 类，与数组相比，这也是一个易用且安全的选项。由于空间限制，我将不会介绍它。关于 vector\
  \ 和 array 的更多信息，请参阅标准库。\n\n尽管如此，由于数组在标准容器出现很久就已经存在，并且在生产代码中仍然很流行，学习它们的语义并良好、安全地使用它们是非常重要的，因为你几乎肯定会在现有代码中使用它们或遇到它们。\n\
  \n`a[i] = b[i]` 等于 `(a[i] = b[i]) != 0`，这意味着只要 `a[i]` 不变为 0，`b` 的元素就会复制到 `a` 对应的元素中。如果变为\
  \ 0，循环将终止。由于 `a` 的类型是 `int`，只有 `b` 元素的整数部分会被存储到相应的 `a` 元素中。因此，当复制值 0.5 时，`a[2]`\
  \ 变为 0 循环终止。`a[3]` 和 `a[4]` 的值保持不变。结果是程序输出 `a[0]` 和 `a[1]` 的和，即 3+1=4。\n\n## 练习\n\
  \nC.7.1 下面程序的输出是什么？\n\nC.7.2 编写一个教师可以使用来获取成绩统计的程序。\n\n\n\n\n\n## C.7.3 编写一个程序，读取一个整数并显示出现超过一次的数字及其出现的次数。例如，如果用户输入\
  \ `1868`，程序应该显示数字 `8` 出现了两次。如果没有数字出现超过一次，程序应该显示一条相关的提示消息。\n\n## C.7.4 编写一个程序，连续读取整数并将它们存储在一个\
  \ `vector` 对象中。如果用户输入 `-1`，则停止插入数字。然后，程序应该检查该 `vector` 是否是对称的，即：第一个元素的值等于最后一个元素的值，第二个元素的值等于倒数第二个元素的值，以此此类推。如果不是对称的，程序应该检查是否存在重复的值，如果有，则终止。如果没有，程序应该显示一条所有值都不同的不同的消息。\n\
  \n**注释：** 如果有人好奇当元素个数为奇数时会发生什么，代码仍然有效，因为中间元素没有与任何其他元素进行比较。\n\n## C.7.5 编写一个程序，读取一个整数并以二进制形式显示它。使用数组来存储数字的位。要显示负数的位，请使用二补码技术。例如，如果用户输入\
  \ `-5`：\n\n1. 将其转换为正数（即 `5`）。\n2. 反转其位（即 `101[2]` 变为 `11111111111111111111111111111010[2]`）。\n\
  3. 加 `1`（即数字变为 `11111111111111111111111111111011[2]`，且这应该应该是输出值）。\n\n**注释：** 我使用移位运算符是为了提高性能。然而，这可能没有必要，因为编译器会自己优化该操作。\n\
  \n### C.7.6 下面程序的输出是什么？\n\n**答案：** 让我们跟踪第一个循环的迭代：\n\n> *第一次迭代* (i=0)。 `a[a[0]-b[2]]++\
  \ = a[-1-(-1)]++ = a[0]++ = 0.`\n>\n> *第二次迭代* (i=1)。 `a[a[1]-b[1]]++ = a[5-4]++\
  \ = a[1]++ = 6.`\n>\n> *第三次迭代* (i=2)。 `a[a[2]-b[0]]++ = a[7-5]++ = a[2]++ = 8.`\n\
  \n因此，`a[0]`、`a[1]` 和 `a[2]` 分别变为 `0`、`6` 和 `8`。在第二个循环中，`i` 先减 1 变为 `2`。条件等价于 `a[i]\
  \ != 0`。由于 `a[0]` 为 `0`，循环输出 `a[2]` 和 `a[1]` 的值，即 `8` 和 `6`，然后终止。\n\n## C.7.7 编写一个程序，读取产品代码并将它们存储在一个长度为\
  \ 50 的整数型数组中。只有当代码尚未存储时，程序才将其存储在数组中。如果数组满了或用户输入 `-1`，程序应该显示已存储的代码并终止。\n\n## C.7.8\
  \ 编写一个程序，读取 100 个整数并将它们存储在数组中。然后，程序应该找到并显示两个不同的最大值。\n\n**注释：** 找到数组第 `n` 个最小或最大元素的典型方法是使用某些排序算法对数组进行排序，例如第\
  \ 12 章中所示的方法。然后，我们要搜索的元素就是 `arr[n-1]`。\n\n## C.7.9 编写一个程序，声明一个十个整数的数组并为其元素分配 `[5,\
  \ 20]` 范围内的随机值。然后，程序应该检查数组是否包含重复值，如果有，则将其删除。当删除一个元素时，后续元素应该向左移动一位。空位置应该赋予值 `-1`。例如，如果数组为\
  \ `{9, 12, 8, 12, 17, 8, 8, 19, 1, 19}`，它应该变为 `{9, 12, 8, 17, 19, 1, -1, -1, -1,\
  \ -1}`。要记住如何使用 `srand()` 和 `rand()`，请再次阅读示例 C.6.2。\n\n## C.7.10 编写一个程序，读取 100 名游客在回答问题“你在希腊最喜欢什么？”时的偏好顺序。\n\
  \n1. 自然的多样性\n2. 气候\n3. 岛屿\n4. 夜生活\n5. 遗迹\n6. 人们\n7. 食物\n\n每个答案根据其排名获得 1–7 分。第一个答案得\
  \ 7 分，第二个得 6 分，最后一个得 1 分。例如，如果两名游客回答了以下内容，程序应该显示：\n\n| 第 1 位游客 | 第 2 位游客 | 程序输出\
  \ |\n| --- | --- | --- |\n| 5 (7 分) | | |\n| 4 (6 分) | | |\n| 3 (5 分) | | |\n| 2\
  \ (4 分) | | |\n| 1 (3 分) | | |\n| 6 (2 分) | | |\n| 7 (1 分) | | |\n\n\n\n\n虽然二维数组被视觉化为一个具有行和列的数组，但它的元素是以行主序存储在连续的内存位置中的，其顺序是先存储第\
  \ 0 行的元素，然后是第 1 行的元素，依此类推。例如，数组 `a` 包含 12 个连续存储在内存中的整数，我们访问它们的方式就像访问三个包含 4 个整数的一维数组一样。\n\
  \n例如，数组 `a` 的元素是 `a[0]`、`a[1]` 和 `a[2]`，其中每一个都是包含 4 个整数的数组。我将在第 8 章 讨论指针和二维数组时详细分析。此外，我们将在练习\
  \ C.8.27 中看到如何将二维数组视为一维数组。在另一个例子中，如果我们写下 `int a[3][4][5];`，`a` 是包含 3 个元素的数组，其中每个元素都是一个包含\
  \ 4 个元素的数组。这四个元素中的每一个都是包含 5 个整数的数组。\n\n与一维数组一样，当声明二维数组时，编译器会在栈中分配一个内存块来存储其元素的值。例如，通过声明\
  \ `int a[4][5];`，编译器会分配 80 字节的块来存储其 20 个元素的值。要访问某个元素，必须指定它的行索引和列索引。这里是一些示例：\n\n\
  考虑二维整数数组 `a[ROWS][COLS]`。由于其元素在内存中顺序存储，编译器为了找到 `a[i][j]` 的内存地址，会计算行的大小，即 `row_size\
  \ = COLS × sizeof(int)` 并将其乘以 `i`。然后，它将 `j` 乘以元素的大小，并将乘积加到数组地址上。因此，我们得到：\n\n###\
  \ 初始化\n\n二维数组可以在声明时进行初始化，就像一维数组一样。初始化值按行顺序赋值，从第一行开始，然后是第二行，依此类推。例如，通过声明：\n\n`arr[0][0]`\
  \ 变为 10，`arr[0][1]` 变为 20，`arr[0][2]` 变为 30，并继续后续行。或者，我们可以省略内层的大括号并写成：\n\n一旦编译器填满一行，它就会继续下一行。然而，我倾向于始终使用内层大括号，这样每行的初始化都会清晰地显示。使用大括号时，如果初始化列表比行的元素少，编译器会将该行中剩余元素赋值为\
  \ 0。如果初始化列表更长，则是非法的。例如，通过声明：\n\n`arr[0][2]`、`arr[1][2]`、`arr[2][1]` 和 `arr[2][2]`\
  \ 的值被初始化为 0。\n\n如果我们省略了某行的初始化，编译器将将其元素初始化为 0。例如，通过声明：\n\n第二行和第三行的元素被设置为 0。\n\n如果省略了内层大括号且初始化列表比数组元素总数少，剩余元素将设置为\
  \ 0。例如，通过声明：\n\n`arr[0][0]` 变为 10，`arr[0][1]` 变为 20，剩余元素被设置为 0。\n\n在声明二维数组时，必须指定列数。然而，行数是可选的。如果没有指定，编译器将根据初始化列表创建一个二维数组。例如，通过声明：\n\
  \n由于数组有三列且初始化值为六个，编译器创建了一个两行三列的二维数组。\n\n关于初始化列表就说这么多。根据你所学的知识，你能告诉我以下代码的输出是什么吗？\n\
  \n由于数组有三列且值为七个，编译器创建了一个三行三列的二维数组，即一个包含九个元素的数组。由于初始化列表较短，最后两个即 `arr[2][1]` 和 `arr[2][2]`\
  \ 被设置为 0。因此，代码输出为 36。\n\n如果初始化值相同或可以很容易生成，初始化数组的典型选择是嵌套循环。例如，以下程序声明了一个二维数组并向其元素赋值值\
