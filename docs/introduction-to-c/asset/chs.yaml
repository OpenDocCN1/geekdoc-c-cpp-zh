  \n在本章中，我们将讨论 C++（以及通用的面向对象编程语言）中最重要的特征之一：继承的概念。继承允许程序员复用现有的代码，而不是重新发明。程序员可以从现有类派生出新类，派生类继承并扩展现有类的属性。继承是整个程序设计中关键的一步，因为使用已经过过并测试的代码可以节省大量的时间和精力。本章描述了公共继承，这是最常见的形式。然后，我们将研究基类和派生类之间的关系。最后，我们将讨论由强大的虚函数机制支持的运行时多态。继承和运行时多态是设计和实现健壮应用的关键点。\n\
  \n### 公共继承\n\n继承是 C++ 以及通用面向对象编程的基本特征之一。具体来说，继承允许从现有类创建新类。继承类被称为 `derived`（派生类），而现有类被称为\
  \ `base`（基类）。派生类继承基类的特性，这意味着继承不会移除基类的属性。程序员可以在派生类中添加新功能、使用现有的功能或修改其行为以满足新需求。派生类的通用声明为：\n\
  \n派生类对象包含一个基类对象。`access_type` 决定了对基类成员的访问。如果缺失，默认访问类型为 `private`。在本章中，我们将使用最常用的\
  \ `public` 类型。在第 21 章中，我们将讨论 `private` 和 `protected` 访问类型。当访问类型为 `public` 时，派生类的函数、对象以及派生类的友函数可以访问基类的公共成员，但不能访问私有成员。特别，派生类只能通过基类的公共函数和保护函数来访问基类的私有成员。此外，派生类的函数及其友函数可以直接访问基类的保护成员，而其对象则不能。\n\
  \n现在我们已经学习了一些关于可访问性的继承规则，让我们复习数据隐藏规则。我们已经知道允许直接访问公共成员。我们现在正在学习，从派生类直接访问其保护成员也是允许的。从本质上说，无法从类外部直接访问且从而提供大量数据隐藏的成员只有私有成员。\n\
  \n派生类可以作为基类来创建新的派生类，该派生类又可以作为新派生类的基类，从而创建一个类的层次链。例如，`C` 类可以派生自 `B` 类，`B` 类又可以派生自\
  \ `A`，依此类推。\n\n基类包含实体的通用属性（例如 `Product`）。派生类通常是基类的特化（例如 `Book`），它继承基类的成员变量和函数并添加自身的特性。因此，派生类对象除了自身的成员外，还包含一个完整的基类子对象。例如，考虑以下程序：\n\
  \n为了简单起见，我只使用了公共成员。继承的主要优势是它允许我们使用现有代码而无需重写。我们只需要编写实现派生类的代码。在我们的示例中，`Book` 继承了所有的\
  \ `Product` 成员和函数。我们不需要再次添加它们。也就是说，`Book` 对象继承了代码、`prc` 成员以及 `show()` 函数。`Book`\
  \ 也包含自己的成员和函数。\n\n当创建派生对象时，首先调用派生类的构造函数。然后，该构造函数调用基类的构造函数以创建包含派生对象中的基类对象。也就是说，派生对象包含一个基类子对象。这种关系也被称为\
  \ *is-a*（是一个）关系，因为派生类对象也是一个基类对象。例如，一个 `Book` 对象也是一个 `Product` 对象。\n\n\n\n\n特别是，必须先创建基类的子对象，然后创建派生对象的部分。因此，当\
  \ `b` 被创建时，`Book` 的构造函数首先调用 `Product` 的构造函数来创建 `Product` 子对象，然后继续构造 `b`，即执行 `Book`\
  \ 构造函数的函数体。因此，程序最初显示：\n\n通常情况下，正如我们稍后将看到的，在类层次结构中（例如 `A`、`B`、`C`、`D`），当创建一个派生类对象（例如\
  \ `D`）时，会首先调用最基类的构造函数（例如 `A`），然后调用其派生类的构造函数（例如 `B`），以此此类推（例如 `C`），直到调用目标类的构造函数（例如\
  \ `D`）。也就是说，首先创建在 `D` 对象中包含的 `A`、`B`、`C` 子对象，然后由 `D` 构造函数完成 `D` 对象的创建。\n\n由于 `Book`\
  \ 是以公有访问权限创建的，`b` 可以访问 `Product` 的公共成员。程序读取用户输入的数据，将其存储在 `Product` 和 `Book` 成员中，并调用这两个类的函数来显示它们。当派生对象被销毁时，销毁顺序与构造顺序相反，即程序首先调用派生类的析构函数，然后调用基类的析构函数。因此，程序显示：\n\
  \n为了更好地说明继承的价值，我将给你提供另一个例子。在我的几个应用程序中，我经常需要设计一个基于窗口的界面与用户进行交互。在这种情况下，继承非常有帮助的。例如，我使用对话框（dialogs）让用户可以输入数据。我必须从零开始创建这些对话框吗？通常不需要，否则我永远无法完成。对于\
  \ `Windows` 应用程序，我使用 `Microsoft` 库中现成的类（例如 `CDialog`）作为基类，该类提供了管理对话框的所有资源（例如显示对话框以及在用户点击\
  \ OK/Cancel 按钮时关闭它）。当我想要更改对话框的行为时（例如当用户选择 OK 将输入数据保存到文件中时），我会创建一个派生自基类（例如 `CDialog`）的新类（例如\
  \ `CMyDialog`），这样我就可以利用它的功能而无需编写代码。我只需要编辑我的 `CMyDialog` 类来让对话框按照我的意愿运行。如果你处理面向对象编程，请务必使用继承来从现有的（无论是你自己设计的还是他人设计的）类创建类。\n\
  \n除了我们不需要编写相同的代码之外，继承还简化了程序的维护和升级。例如，假设我们正在使用 `Product` 类来创建其他类。如果未来我们需要添加一个与所有派生类相关的新功能，我们不需要单独向每个类中添加它。我们只需要将其添加到基类中，每个派生类都将继承它。此外，如果基类中出现错误，我们只需要在该处发现并修复错误，而不需要更改派生类中的代码。我认为类的概念连同继承以及我们将看到的动态多态是\
  \ C++ 最重要的特征，泛而言也是面向对象编程最重要的特征。现在尝试找到以下程序中的错误：\n\n首先，没有类有构造函数是错的吗？当然不是，会调用默认构造函数。记住，基类的默认构造函数首先执行，然后是派生类的。我们继续，由于成员\
  \ `a` 和函数 `f()` 是私有的（private），`B` 类的对象和函数被允许访问它们。C++ 标准防止这种访问是为了保护基类成员的隐私性，这是合理的。否则，某些人可以通过创建一个派生类并使用它来访问基类的私有成员，从而违反数据隐藏的概念。关于保护成员（protected\
  \ members），记住，对于类本身，它们的行为类似于私有成员。但对于派生类，它的函数被允许访问基类的保护成员，而它的对象则不允许。因此，以下语句是不可接受的：\n\
  \n类 `A` 不包含任何名为 `c` 的成员。`c` 成员在派生类 `B` 中声明，类 `A` 无法访问它。因此，以下语句是不可接受的：\n\n这是合理的。继承不是反向工作的，也就是说，基类及其对象并不知道派生自它的类，因此无法访问它们的成员。\n\
  \n### “是”（is-a）与“拥有”（has-a）关系\n\n正如早早提到的，公有继承模型在程序设计中更好地模拟了 `is-a` 关系，即派生类对象也应该是一个基类对象。例如，`Book`\
  \ 对象也是一个 `Product` 对象。`Book` 类继承了 `Product` 成员，并可能会添加特别适用于书籍而非普通产品的额外成员，例如作者。\n\n\
  为了更好地理解 `is-a` 关系，我将给你一个不符合该模型的例子。假设我们有一个 `BookStore` 类。书店不是一本书。因此，最好不要从 `BookStore`\
  \ 类派生出 `Book` 类。为了澄清这一点，如果你进行了这种派生，并不意味着代码不会编译，或者在程序执行时不会发生错误。没有什么阻止你这样做，但这种程序设计通常会导致编程问题。由于书店“拥有”书籍，因此关联这些类的正确方法是\
  \ `has-a` 关系。即将 `Book` 对象作为 `BookStore` 类的成员。\n\n我将给你提供更多例子。假设你有一个 `Engine` 类、`Tires`\
  \ 类，并且你想定义 `Car` 类。由于汽车“拥有”引擎和轮胎，使用 `has-a` 模型是合适的，并如下所示编写：\n\n在另一个 `has-a` 关系的例子中，假设你定义了\
  \ `Date` 类，并且你想定义 `Employee` 类。由于员工“拥有”日期信息，我们会写：\n\n现在，假设你定义了 `Shape` 类，并且你想定义\
  \ `Circle` 类。由于圆形“是”形状，使用 `is-a` 模型是合适的，并如下所示编写：\n\n同样，假设你定义了 `BankAccount` 类，并且你想定义\
  \ `CheckingAccount` 类。由于支票账户“是”银行账户的一种类型，我们会使用继承。\n\n`Animal` 类和 `Cat` 类呢？由于猫“是”动物的一种，使用继承并从\
  \ `Animal` 派生出 `Cat` 是合理的。\n\n因此，当你必须决定是将一个类作为成员还是从其派生时，通用规则是看哪一种（`has-a` 或 `is-a`）更合适并采取相应行动。\n\
  \n### 保护成员与继承\n\n通常情况下，当我们创建一个可能被用作基类的类，并允许派生类访问它的某些成员时，可以将这些成员声明为保护（protected）而不是私有（private）。基类的保护成员在派生类中仍然是保护的。因此，不仅仍然实现了对外部世界的隐藏（即我们仍然保持它们的\
  \ `protected` 状态），而且还提高了速度并使代码变得更简单，因为派生类可以直接访问它们。然而，我们丢失了内部安全性，因为直接访问可能会对基类的操作产生意外的副作用。\n\
  \n\n\n\n例如，如果你创建了一个类并将其交给其他开发者，他们可以通过简单创建一个派生类来访问你类的受保护（protected）成员并破坏其数据。因此，如果你将你的类发布到外部世界，你必须考虑到访问受保护成员缺乏安全性，并据此做出决定。此外，派生类可能会在程序的许多部分使用受保护成员，这一事实使得控制基类的操作变得更加困难，从而影响了程序的维护。通常情况下，最佳实践是将成员声明为私有（private）而不是受保护，并提供受保护函数，在这些函数中你指定如何使用它们，并控制它们从派生类被调用时的操作。\n\
  \n在这里，我想澄清一下关于从派生类的函数访问基类受保护成员的问题。这种访问仅允许访问派生类中所包含的基类子对象（sub-object）的受保护成员，而不允许访问派生类中可能声明的其他普通基类对象的受保护成员。我知道上句话很难理解，我已经尽力了。让我们来看一个例子来更好地理解它：\n\
  \n不允许第二种访问是有意义的。如果允许，我们就可以很容易地打破“对象不允许访问类的受保护成员”的规则。怎么做呢？如示例所示，我们会创建一个派生类，在成员函数（例如\
  \ `f()`）中声明一个基类对象（例如 `a`）并使用它来访问受保护成员。不，不允许访问普通对象的受保护成员，只允许访问基类子对象的受保护成员。\n\n###\
  \ 作用域与继承\n\n正如我们所知，每个类都定义了自己的作用域。在继承的情况下，情况有所不同。虽然基类和派生类定义在程序的不同部分，但派生类的作用域包含在基类的作用域内。这就是为什么派生类的成员不需要使用范围运算符\
  \ `::` 来访问基类的成员。当类内部使用名称时，编译器首先在类作用域中查找它的声明。如果找不到，它将继续在其基类的作用域中搜索，一直从直接基类搜索到顶层。例如，假设类\
  \ `C` 派生自类 `B`，而 `B` 又派生自类 `A`，且只有类包含一个名为 `p` 的公共成员。如果我们写：\n\n```\nc.p\n```\n\n\
  由于 `c` 是类 `C` 的对象，编译器会在它内部搜索 `p` 的声明。因为 `p` 在 `C` 中没有声明，编译器继续在其基类（即 `B`）中搜索。同样，由于\
  \ `p` 在 `B` 中没有声明且由于 `B` 派生自 `A`，搜索继续到那里并最终在那里找到。如果缺少声明，编译器将显示相关的错误信息。\n\n人们可能会提出的一个逻辑问题是，如果名称\
  \ `p` 也出现在另一个类中怎么办？例如：\n\n当然，使用相同的名称是令人困惑的，你不应该故意做出这种选择，因为代码会变得更难以理解，出错的可能性也会增加。然而，疏忽或环境可能会导致这种情况发生。那么，如果使用了相同的名称会发生？正如我们在第\
  \ 11 章中所知，内部作用域中声明的名称会隐藏其外部的名称。因此，通过 `c.p` 语句，我们指的是类 `C` 的成员 `p`。由于编译器在 `C` 中找到了\
  \ `p` 的声明，它就会停止搜索。如果 `p` 没有在 `C` 中中声明，它将继续在基类中搜索，因此我们指的是类 `B` 的成员 `p`。如果我们想引用另一个类的成员\
  \ `p`，该怎么办？我们只需要使用范围解析运算符 `::` 即可。例如：\n\n注意，编译器对任何名称都应用相同的搜索程序，无论它是变量、函数还是其他东西。例如，假设是一个函数名。如果调用了\
  \ `f()`，编译器会在 `C` 的作用域内搜索 `g()` 的定义。如果找不到，它会在 `B` 的作用域内继续搜索，然后在 `A` 的作用域内继续。如果仍然找不到，它将继续搜索全局\
  \ `g()`，如果再次失败，它将显示错误信息。\n\n这里是另一个示例：\n\n```\nf() 使用限定名 A::p 来引用基类成员，而 p 指的是在 B\
  \ 中声明的成员。\n```\n\n### 派生类与构造函数\n\n在示例 C.20.2 中，我们说如果没有定义任何构造函数，则会调用默认构造函数。在示例 C.20.1\
  \ 中，我们看到定义的构造函数会被调用，并且正如提到的，因为基类子对象首先被创建，因此它自己的构造函数首先执行，然后程序继续执行派生类的构造函数。让我们修改程序，为两个构造函数添加参数，看看派生类的构造函数如何将值传递给基类的构造函数：\n\
  \n首先，我将成员声明为私有，以便类的设计类似于真实的应用程序。正如我们所说的，当创建一个派生类对象时，基类的子对象必须首先被创建。这将如何发生呢？派生类必须调用基类构造函数来初始化基类子对象。\n\
  \n所以，当创建对象 `b` 时，会调用 `Book` 类的构造函数并将参数值传递给相应的参数。例如，`c` 等于 `AB25`，`p` 等于 `8.5`。这里有一个括号。可以看到，字面量\
  \ C 形式字符串（本质上，正如我们所知，字符串开头的指针）被传递给构造函数，而相应参数的类型是 `const` string&。这种类型不匹配没有问题吗？没有，因为\
  \ `string` 类有一个带有 `const` `char*` 参数的构造函数，该构造函数会被调用以创建一个字符串对象并用 C 形式字符串初始化它。括号结束。传递值后，执行代码的后续部分：\n\
  \n```\nBook(c, p)\n```\n\n这使用了我们在第 19 章中看到的初始化语法调用基类的构造函数，并将 `c` 和 `p` 的值传递给它。如果基类支持多个构造函数，我们选择想要调用的那个。为了记住成员初始化语法，我们也可以写：\n\
  \n```\nProduct : Book(c, p) {}\n```\n\n`Product` 类的构造函数创建 `b` 的 `Product` 子对象并将\
  \ `AB25` 和 `8.5` 存储在它的成员中。然后，程序继续构建 `b` 对象并将 `Nice` 和 `Many` 值分别存储在 `title` 和 `auth`\
  \ 成员中。正如第 19 章所述，成员的初始化不是基于它们在初始化列表中的位置，而是基于它们在 `Book` 类中声明的顺序。最后，执行 `Book` 构造函数的空体。注意我们可以跳过对基类构造函数的调用。即写：\n\
  \n```\nProduct() {}\n```\n\n因为基类子对象必须首先创建，基类的默认构造函数将被自动调用。记住，所有参数都具有预定义值的构造函数也被视为默认构造函数。所以，`show()`\
  \ 将显示 No 和 0。注意，如果 `Product` 没有默认构造函数，例如，我们将声明更改为：\n\n```\nProduct(const string&,\
  \ double);\n```\n\n并且我们像以前一样写 `Book` 类的构造函数，编译器将显示类似 *‘Product’: 没有适当的默认构造函数* 的错误信息。\n\
  \n人们可能会问，与其使用基类的构造函数来初始化其成员，难道不能使用派生类的构造函数来初始化基类的成员吗？是的，我们可以使用它来初始化公共和受保护成员。例如：\n\
  \n\n\n\n\n虽然我们可以使用派生类的构造函数来初始化基类成员，但我并不倾向于这种方法。主要原因是我不希望职责发生混淆。我希望清楚知道哪个构造函数负责哪些初始化。如果每个构造函数都可以初始化基类的成员，那么控制和维护代码将变得困难且容易出错。知道每个构造函数只负责初始化其所属类的成员，要方便方便且安全得多。因此，我倾向于让派生类通过基类的构造函数来承担包含的子对象成员的初始化。毕竟，派生类的构造函数无法初始化基类的私有成员（例如\
  \ `a1`）。\n\n顺便提一下，请注意虽然可以从派生类访问基类的非私有成员，但不允许在派生构造函数的初始化列表中初始化它们。例如：\n\n如果我们想初始化它们，应该在派生构造函数的体部内进行。\n\
  \n## 类的层次结构\n\n在派生类链中，每个类都可以使用初始化语法将值传递给其直接基类的构造函数。但请注意，只针对直接基类，而不是针对更高层次的基类。此规则的例外是虚基类，我们将在第\
  \ 21 章中看到。例如：\n\n当创建 `c` 对象时，会调用类 `C` 的构造函数，它又调用类 `B` 的构造函数并将值 `20` 传递给它。接着，它调用类\
  \ `A` 的构造函数，传递值 `21` 给它，并执行 `A` 构造函数的体。程序显示 `A:21`。然后执行 `B` 构造函数的体，程序显示 `B:20`。因此，首先创建类\
  \ `A` 的子对象，然后创建类 `B` 的子对象。也就是说，`c` 对象包含两个子对象，一个 `A` 类和一个 `B` 类对象。在这两个子对象构造完成后，执行\
  \ `C` 构造函数的体，程序显示 `C:10`。\n\n通常情况下，在类的层次结构中，派生对象包含其直接基类的一个子对象以及其每个间接基类的一个子对象。析构函数的调用顺序与构造函数的调用顺序相反，贯穿整个层次结构，从最后一个派生类到根类。最后，程序显示：\n\
  \n如所述，`C` 类的构造函数不允许使用上述语法直接调用类 `A` 的构造函数。允许的是只从其直接基类（即 `B`）调用构造函数，并且 `B` 构造函数只调用类\
  \ `A` 的构造函数。例如，我们不允许写成：\n\n编译器将显示一条类似于 `A is not a direct base of C` 的错误信息。\n\n\
  如果我们不希望某个类被继承，我们使用 C++11 引入的 `final` 关键字。例如：\n\n尝试继承类 `A` 或 `D` 会导致编译错误。我们稍后会更多地讨论\
  \ `final` 关键字。\n\n## 基类与派生类之间的特殊关系\n\n在本节中，我们将讨论基类和派生类之间的一些特殊关系。\n\n### 从派生类到基类的转换\n\
