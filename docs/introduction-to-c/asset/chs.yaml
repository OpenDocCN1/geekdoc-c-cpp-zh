  \ `5`）的数组作为参数传递。不，无论数组长度是多少，编译器都能成功编译程序。让函数知道数组长度的一种简单方法是作为额外参数传递。例如，我们可以这样声明 `test()`：\n\
  \n```c\nvoid test(int arr[], int size)\n```\n\n并编写 `test(a, 5);` 来调用它。\n\n或者，我们可以定义一个常量，例如\
  \ `const int SIZE = 5;`，并在需要的地方使用该常量，而不是传递额外的参数。另一种方法是使用一个特殊值来表示数组的末尾，当然，这个值不会出现在数组中。例如，如果数组包含一个\
