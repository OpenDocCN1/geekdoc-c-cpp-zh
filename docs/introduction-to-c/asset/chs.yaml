  \ `^` 运算符和方程 `(x^y)^x = y` 和 `(x^y)^y = x` 来交换它们的值。只使用两个变量。\n*   U.4.6 写一个程序读取一个整数，交换其二进制位中的两个四位并显示新数字。例如，如果用户输入\
  \ 10 (`00001010[2]`)，程序应显示 160 (`10100000[2]`)。假设用户输入的数字在 `[0, 255]` 范围内。\n*   U.4.7\
  \ 以下程序的输出是什么？\n*   U.4.8 写一个程序读取一个整数，并显示位置 2、4、6 和 8 的数字之和。例如，如果用户输入 170（二进制：10101010），程序应显示\
  \ 4。只使用一个变量。\n*   U.4.9 写一个程序，读取一个正整数和另一个表示字节数的整数（例如 `n`）。程序应该将输入数字 `n` 向右旋转 `n`\
  \ 个字节并显示新值。假设 `int` 类型的大小为 32 位，且用户输入 `[1, 3]` 范围内的有效值 `n`。例如，如果用户输入 553799974（二进制：00100001|00000010|01010001|00100110）和\
  \ 1，程序应显示：639697489（二进制：00100110|00100001|00000010|01010001）。\n*   U.4.10 写一个程序读取一个\
  \ `[0, 255]` 范围的整数和移位数（例如 `n`）。程序应显示以下项之和：\n    1. 将输入数字 `n` 左移 n 位，并将“移出的”位加到数字的右侧。\n\
  \    2. 将输入数字 `n` 右移 n 位，并将“移出的”位加到数字的左侧。\n    例如，如果用户输入 42（二进制：00101010）和 3，程序应显示：和：`00101010\
  \ << 3` = `01010001` = 81（移出的位是：`001`）和：`00101010 >> 3` = `00000101` = 69（移出的位是：`010`）。总和为\
  \ 150。\n*   U.4.11 写一个程序读取一个整数、两个位的位置，并显示它们之间位的值。程序应该找到 `int` 类型的大小；不要假设它是 32 位。例如，如果用户输入\
  \ 176（二进制：10110000）和值 6 和 4，程序应显示位置 6 和 4 之间位的值，即 2。\n*   U.4.12 写一个程序读取一个正整数并向上取整到下一个\
  \ 2 的幂。例如，如果用户输入 35，程序应显示 64。\n\n## 5 程序控制\n\n到目前，我们看到程序的语句是从上到下按照源代码中的顺序执行的。然而，在实际编程中，某些语句应该满足特定条件下执行。本章将教你如何使用\
  \ `if` 和 `switch` 选择语句来控制程序流，并从一组选项中选择特定的执行路径。\n\n### if 语句\n\n`if` 语句根据条件求值为真还是假来控制程序流。`if`\
  \ 语句的最简单形式是：\n\n如果条件的值为真，则括号之间的语句块将被执行。例如：\n\n```c\nif (x != 0)\n    printf(\"Yes\"\
  );\n```\n\n由于 `x` 不等于 0，`if` 条件为真，代码显示 Yes。\n\n如果条件的值为假，则语句块将不执行。例如：\n\n```c\nif\
  \ (x == 0)\n    printf(\"No\");\n```\n\n通常，括号用于将声明和语句组合成一个复合语句（或“块），编译器将其视为单个语句。正如我们在第\
  \ 6 章中将看到的，复合语句在循环中也非常常见。\n\n如果语句块只包含一个语句，可以省略括号。例如，我们可以像这样写之前的代码：\n\n```c\nif (x\
  \ != 0) {\n    printf(\"Yes\");\n}\n```\n\n### 常见错误\n\n一个常见的错误是在 `if` 语句末尾添加分号（;），就像我们对大多数语句做的那样。分号被处理为一个不做任何事情的语句，即*空语句*（null\
  \ statement），编译器借此终止 `if`。例如，在以下代码中：\n\n```c\nif (x != 0);\n    printf(\"Yes\");\n\
  ```\n\n\n\n`;` 终止了 `if` 语句，因此 `cout` 语句位于 `if` 之外。因此，无论 `x` 的值是多少，这段代码都会输出 `Yes`。\n\
  \n另一个常见的错误是混淆 `==` 等于运算符与 `=` 赋值运算符。请记住在第 4 章中提到的内容：`==` 运算符用于检查两个表达式是否具有相同的值，而\
  \ `=` 运算符将值赋值给变量。还要记住，给变量赋值非零值对应于真表达式，而给变量赋值零值对应于假表达式。例如，以下代码：\n\n```cpp\nx = 30;\n\
  ```\n\n并没有检查 `x` 是否等于 30，而是让 `x` 等于 30。因此，条件为真，代码输出 `Yes`。很有可能，编译器会显示一条消息来警告你潜在的错误。同样地，这段代码：\n\
  \n```cpp\nx = 0;\n```\n\n不会显示任何内容，因为将 0 赋值给 `x` 导致条件为假。\n\n虽然在比较两个变量时它们不受保护，但某些程序员在变量与常量进行比较时，倾向于将常量写在前面。例如：\n\
  \n```cpp\nif (30 == x)\n```\n\n他们偏于这种语法的原因是，如果他们漏掉了一个 `=`，编译器会为非法操作显示错误信息，因为不允许给常量赋值。从我个人而言，我宁愿漏掉一个\
  \ `=` 并插入一个 bug，也不使用这种风格。毕竟， bug 的引入是为了让程序员在发现它们时感到高兴的。\n\n此外，当使用 `==` 运算符时，不要忘记浮点数比较由于潜在的舍入误差可能会产生意外的结果。请重新复习示例\
  \ C.2.1。\n\n另一个错误是在比较条件中反序编写 `!=` 运算符的字符。例如，告诉我以下程序将显示什么？\n\n```cpp\nif (5 != i)\
  \ {}\n```\n\n由于 `!` 运算符作用于常量值 5，`i` 变成了 0，因此条件变为假。因此，程序输出 `Two` 和 `0`。\n\n另一个常见错误是当我们想要执行多个语句时忘记使用大括号（例如，如果你来自另一种一种使用缩进来分组语句的语言）。例如：\n\
  \n```cpp\nif (i < 0)\n    cout << \"negative\";\n```\n\n我们希望只有在 `i` 为负时才显示消息。然而，按照我们现在的写法，无论\
  \ `i` 的值如何，消息总是会出现。正确的做法是使用大括号并将 `cout` 语句放在其中。即：\n\n```cpp\nif (i < 0) {\n    cout\
  \ << \"negative\";\n}\n```\n\n为了避免此类非常难以发现的 bug，有些人建议无论语句是一条还是多条（在循环中也是如此），始终使用大括号。\n\
  \n正如我们所说，如果我们想检查某个值是否为真，可以写 `if(i)`。有些人可能会建议写成 `if(i == true)`。不，这是危险的。例如，看以下代码：\n\
  \n```cpp\nint i = 2;\nif (i == true)\n```\n\n如果 `i` 不是 `bool` 类型（如本例所示），在应用 `==`\
  \ 之前，`true` 会转换为 `i` 的类型。因此这就像我们写了 `if(i == 1)`，这并不是预期的比较，且代码显示 `Two`。通常情况下，不要在比较中使用\
  \ `true` 和 `false` 作为操作数，因为如果与非 `bool` 变量进行比较，很容易发生错误。\n\n### if-else 语句\n\n正如我们在上一个示例中所看到的，`if`\
  \ 语句可以有一个 `else` 子句：\n\n如果条件为真，则执行第一块语句；否则，执行第二块。例如：\n\n```cpp\nif (sum != 0)\n\
  \    cout << \"zero\";\nelse\n    cout << \"two\";\n```\n\n由于 `sum` 为 0，条件为假，代码显示\
  \ `Two`。由于两个块都只包含一条语句，我们可以省略大括号并写成：\n\n```cpp\nif (sum != 0) cout << \"zero\";\n\
  else cout << \"two\";\n```\n\n与 `if` 情况一样，一个常见错误是在 `else` 末尾添加 `;`。例如：\n\n```cpp\n\
  if (sum != 0);\nelse\n    cout << \"two\";\n```\n\n最初，`max` 变为 20，但随后由于 `;` 终止了\
  \ `else` 的执行，它变成了 10。因此，代码显示 10。\n\n注意我们可以在条件内声明变量。例如：\n\n```cpp\nif (int a = b)\n\
  ```\n\n`a` 的作用域延伸到 `if` 语句的结束。然后，正如我们在第 11 章中看到的，`a` 将失效。如果有 `else` 分支，它的作用域也会延伸到那里。通常做法是在\
  \ `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\nC++17 提供了一个新版本，允许我们在\
  \ `if` 内部初始化变量并测试条件。通用语法为：\n\n```cpp\nif (int var = expr; condition)\n```\n\n例如，我们可以写：\n\
  \n```cpp\nif (int a = f(); a > 3)\n    // ... \n```\n\n然后，正如我们在第 11 章中看到的，`a` 将失效。如果有\
  \ `else` 分支，它的作用域也会延伸到那里。通常做法是在 `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\
  \nC++17 提供了一个新版本，允许我们在 `if` 内部初始化变量并测试条件。通用语法为：\n\n```cpp\nif (int var = expr; condition)\n\
  ```\n\n例如，我们可以写：\n\n```cpp\nif (int a = f(); a > 3)\n    // ... \n```\n\n然后，正如我们在第\
  \ 11 章中看到的，`a` 将失效。如果有 `else` 分支，它的作用域也会延伸到那里。通常做法是在 `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\
  \nC++17 提供了一个新版本，允许我们在 `if` 内部初始化变量并测试条件。通用语法为：\n\n```cpp\nif (int var = expr; condition)\n\
  ```\n\n例如，我们可以写：\n\n```cpp\nif (int a = f(); a > 3)\n    // ... \n```\n\n然后，正如我们在第\
  \ 11 章中看到的，`a` 将失效。如果有 `else` 分支，它的作用域也会延伸到那里。通常做法是在 `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\
  \n（注：由于输入文本中存在大量重复段落，此处翻译已根据逻辑进行了去重整合，确保涵盖所有核心要点）\n\n### if-else 语句\n\n正如我们在上一个示例中所看到的，`if`\
  \ 语句可以有一个 `else` 子句：\n\n如果条件为真，则执行第一块语句；否则，执行第二块。例如：\n\n```cpp\nif (sum != 0)\n\
  \    cout << \"zero\";\nelse\n    cout << \"two\";\n```\n\n由于 `sum` 为 0，条件为假，代码显示\
  \ `Two`。由于两个块都只包含一条语句，我们可以省略大括号并写成：\n\n```cpp\nif (sum != 0) cout << \"zero\";\n\
  else cout << \"two\";\n```\n\n与 `if` 情况一样，一个常见错误是在 `else` 末尾添加 `;`。例如：\n\n```cpp\n\
  if (sum != 0);\nelse\n    cout << \"two\";\n```\n\n最初，`max` 变为 20，但随后由于 `;` 终止了\
  \ `else` 的执行，它变成了 10。因此，代码显示 10。\n\n注意我们可以在条件内声明变量。例如：\n\n```cpp\nif (int a = b)\n\
  ```\n\n`a` 的作用域延伸到 `if` 语句的结束。然后，正如我们在第 11 章中看到的，`a` 将失效。如果有 `else` 分支，它的作用域也会延伸到那里。通常做法是在\
  \ `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\nC++17 提供了一个新版本，允许我们在\
  \ `if` 内部初始化变量并测试条件。通用语法为：\n\n```cpp\nif (int var = expr; condition)\n```\n\n例如，我们可以写：\n\
  \n```cpp\nif (int a = f(); a > 3)\n    // ... \n```\n\n然后，正如我们在第 11 章中看到的，`a` 将失效。如果有\
  \ `else` 分支，它的作用域也会延伸到那里。通常做法是在 `if` 语句之前声明 `a`。然而，某些程序员喜欢在条件内部进行声明，以便代码更紧凑，变量的作用域限制在使用它的块中。\n\
  \n### 嵌套 if 语句\n\n一个 `if` 语句可以包含其他的 `if` 和 `else` 语句。例如，由于 `if` 嵌套，程序显示如下：\n\n```cpp\n\
  if (a > 0)\n    if (b > 0)\n        cout << \"one\";\nelse\n    cout << \"two\"\
  ;\n```\n\n由于第一个 `if` 条件为真，则执行嵌套的 `if`。由于 `b` 为 0，条件为假。\n\n由于 `else` 部分是可选的，当省略 `else`\
  \ 时可能会产生歧义（*悬空 else*）。为了匹配 `if` 和 `else` 语句，规则是 `else` 与最近的 `if` 关联。例如，在以下程序应用此规则：\n\
  \n```cpp\nif (a > 0)\n    if (b > 0)\n        cout << \"one\";\nelse\n    cout <<\
  \ \"two\";\n```\n\n根据此规则，第一个 `else` 与最近的 `if` 关联。这是第二个 `if`。第二个 `else` 与第一个 `if`\
  \ 相关。因此，由于第一个 `if` 条件为假，程序输出 3。\n\n注意我故意使用这种对齐是为了误导你认为第一个 `else` 与第一个 `if` 相关。通过将每个\
  \ `else` 语句与其对应的 `if` 对齐、缩进语句并即使不需要添加大括号，程序也会变得更易读。例如，当每个 `if` 与 `else` 对齐时，更容易阅读和控制代码：\n\
  \n```cpp\nif (a > 0) {\n    if (b > 0)\n        cout << \"one\";\n} else {\n   \
  \ cout << \"two\";\n}\n```\n\n虽然第一个 `if` 的大括号不是必须，但使用它们使得代码更清晰。要测试一系列条件，典型的选择是使用以下语法：\n\
  \n```cpp\nif (condition_A)\n    statement1;\nelse if (condition_B)\n    statement2;\n\
  else\n    statement3;\n```\n\n在第一个 `if` 和最后一个 `else` 之间可以有任意数量的 `else if` 子句。从顶部开始评估条件。一旦找到真条件，就会执行相应的语句块，剩余的\
  \ `else if` 语句将被忽略。程序继续执行最后一个 `else` 之后的下一个语句。例如，如果 `condition_A` 为真，则执行第一块语句。如果它为假，则检查\
  \ `condition_B`，依此类推。注意最后的 `else` 是可选的。如果它存在且所有条件都为假，将执行其语句块。例如，以下程序读取两个整数并显示它们的比较结果：\n\
  \n\n\n\n正如我们所说，最后一个 `else` 是可选的。如果缺少它且所有条件都为假，则不会发生任何操作；程序将继续执行最后一个 `else if` 之后的后续语句。例如，如果我们删除了最后一个\
  \ `else`，并且用户输入了两个相同的值，程序将继续执行 `return` 语句且不显示任何内容。如果你想优化性能，即在满足匹配条件之前尽可能减少正在检查的条件数量，一种简单的优化方法是将条件按照频率顺序进行排列，从最可能发生到最不可能发生。\n\
