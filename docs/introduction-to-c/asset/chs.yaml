  \ noskipws`\n\n空白字符就不会被忽略。所以，如果用户输入空格，程序将显示空格的 ASCII 值（即 32）并终止。在程序连续读取字符通常情况下，我倾向于使用\
  \ `get()`，因为它不会跳过空白字符（例如程序可能需要统计所有字符），而且易于检查 EOF 和字符的有效性。\n\n一种让初级程序员困惑为什么程序没有正常运行，甚至气到想砸电脑的意外行为，发生在读取数值值后读取字符。下面的程序就是这样一个例子。当用户输入整数并按下\
  \ *Enter* 时，你注意到以下程序是否存在任何故障吗？\n\n当用户输入整数并按下 *Enter* 时，生成的行字符存储在输入队列中。`get()` 从那里获取并存储在变量\
  \ `ch` 中，而不需要让用户输入任何其他字符。程序只显示输入的整数。有几种方法去掉 '\\n' 字符。一种解决方案是在第二个 `cout` 之前添加另一个\
  \ `get()`，即 `cin.get();` 此外，如果我们反转读取顺序，即先读取字符后读取整数，程序将正常运行，因为空白字符（如 '\\n'）在数值值之前会被忽略。\n\
