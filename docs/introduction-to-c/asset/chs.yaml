  \ `char str[10] = {0};`，那么，由于元素被初始化为 0，程序将显示 `ab`。\n\n正如我们所知的，为了在字面量字符串中表示某些特殊字符（如\
  \ `\"` 或 `\\`），我们必须先添加一个 `\\`。但如果字符串包含许多此类字符，结果字符串的编写和读取将变得更加复杂。为了方便此类字符串的输出，C++11\
