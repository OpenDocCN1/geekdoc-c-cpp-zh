  \n程序通常包含必须执行多次的代码块。一种只要控制表达式的值为真，就重复执行相同代码的语句创建了迭代循环。在本章中，我们将讨论迭代语句：`for`、`while`\
  \ 和 `do-while`，它们允许我们建立循环；以及 `break`、`continue` 和 `goto` 语句，它们可以将控制流从程序的一个点转移到另一个点。\n\
  \n### for 语句\n\n`for` 语句是三种循环语句之一。`for` 语句的一般形式为：\n\n三个表达式 `exp1`、`exp2` 和 `exp3`\
  \ 可以是任何有效的表达式。`for` 语句的执行涉及以下步骤：\n\n1.  `exp1` 只执行一次。通常，`exp1` 初始化在另外两个表达式中使用的变量。\n\
  2.  求值 `exp2` 值。通常，这是一个关系条件。如果为假，则循环终止，程序继续执行大括号之后的语句。如果为真，则执行循环体。\n3.  执行 `exp3`。通常，`exp3`\
  \ 改变 `exp2` 中使用的变量的值。\n4.  重复第 2 和第 3 步，直到 `exp2` 变为假。\n\n通常情况下，循环在 `exp2` 条件变为假时终止，或者在提前执行了终止其执行的语句（如\
  \ `break` 或 `return`）时终止。与 `if` 语句一样，如果循环体只包含一条语句，可以省略括号。以下程序显示从 0 到 9 的数字：\n\n\
  关于左大括号 `{` 的位置，一种常见的做法将其放在语句的末尾，如下：\n\n正如我在 `if` 语句中提到的，我更倾向于将其单独另起一行。让我们来看执行步骤：\n\
  \n1.  执行语句 `i = 0;`。\n2.  检查条件 `i < 10`。由于为真，程序显示 0。\n3.  执行 `i++` 语句，`i` 变为 1。再次检查条件\
  \ `i < 10`。因为仍然为真，程序显示 1。这个过程不断重复直到 `i` 变为 10，此时条件 `i < 10` 变为假，循环终止。结果是程序显示了 0\
  \ 到 9 的数字。\n\n```\nfor (int i = 0; i < 10; i++) {\n    System.out.println(i);\n\
  }\n```\n\n\n\n\n\n一个非常常见的错误是使用 `=` 来检查是否达到了最终值。也就是说，编写 `i = 10` 而不是 `i < 10` 是错误的。由于这个赋值使得条件为真，循环将变成无限循环并持续显示\
  \ 10，这会显著降低计算机性能。编写 `i == 10` 也是错误的。在第一步中，由于 `i` 为 0，条件为假，循环终止；屏幕上什么都不显示。\n\n与 `if`\
  \ 语句一样，一个常见的错误是不经意在 `for` 语句的末尾添加了分号 `;`。例如，考虑以下程序：\n\n正如我们在 `if` 语句的类似情况中所说的，`;`\
  \ 代表空语句，即不执行任何操作的语句。因此，编译器认为循环体只有 `;`。因此，`cout` 语句不属于循环；它只会在循环结束后执行一次。让我们追踪一下迭代过程：\n\
  \n> *第一次迭代。* 由于 `i` 是 16，条件 `i > 10` 为真。由于循环体为空，下一个执行的语句是 `i-=3`（`i = i-3 = 16-3\
  \ = 13`）。\n\n> *第二次迭代。* 由于 `i` 是 13，条件仍然为真，语句 `i-=3` 使 `i` 等于 10。\n\n> *第三次迭代。*\
  \ 由于 `i` 是 10，条件变为为假，循环终止。\n\n接下来，程序输出 `i` 的值，即 10。\n\n如果你的意图确实是创建一个空循环，建议将分号单独放在一行，以便读者清晰可见。例如：\n\
