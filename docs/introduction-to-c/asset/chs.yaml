  `=` 运算符用于给变量赋值。例如，语句 `a = 20;` 将值 `20` 赋值给变量 `a`，而语句 `a = b;` 将变量 `b` 的值赋值给 `a`。当用于链式赋值时，赋值会被存储在链中的所有变量中。例如：\n\
  \n`a`、`b` 和 `c` 的值变为 `20`。特别是，由于附录 A 所示 `=` 运算符是右结合的，因此最右侧的表达式先计算，计算从右向左进行。因此，首先\
  \ `c` 变为 `20`，然后将 `c` 赋值给 `b`，最后将 `b` 赋值给 `a`。\n\n赋值操作如 `a = 30;` 会产生一个结果，即为赋值后左操作数（即\
  \ `a`）的值。例如：\n\n赋值 `b = 10-a` 的结果为 `-20`，因此 `c` 变为 `10`。请使用单独的赋值而不是将它们混合在一起；这样代码更容易易读和控制。\n\
  \n如果变量和赋值的值类型不同，如果可能，值将先转换为变量的类型，然后进行赋值。例如，在以下代码中，`j` 的值是多少？\n\n由于 `i` 的类型是 `int`，它的值变为\
  \ `5`，该值被存储在 `j` 中。\n\n正如我们在第 2 章中所提到的，如果在带符号数字的计算中发生溢出（例如，加法结果太大无法存储在变量中），则结果是未定义的。如果数字是无符号的，结果定义为对\
  \ `2^n` 取模，其中 `n` 是无符号类型的位数。例如，如果 `unsigned int` 类型的大小为 `32` 位，则 `4000000000u +\
  \ 1000000000u` 的结果为 `705032704`。\n\n例如，如果我们使用 `new` 运算符分配内存，我们将在第 14 章中看到；如果在其大小计算中发生溢出（例如，我们使用\
  \ `short` 变量来保存大小），分配的内存大小将不是请求的大小，并对程序执行产生不可预留的后果。给你一个提示，避免溢出的基本思想是在溢出发生之前检查潜在的溢出。例如，假设\
  \ `a`、`b` 和 `c` 都是整数且 `b` 为正；在将 `a+b` 的结果赋值给 `c` 之前，我们可以写：\n\n为了简单起见，我假设书中程序中使用的值都在有效范围内，不会发生溢出。\n\
  \n### 左值 (Lvalues) 和 右值 (Rvalues)\n\n右操作数是一个具有值的表达式，例如常量值或变量。左操作数必须是一个 `lvalue`。`lvalue`\
  \ 指存储在内存中的对象（例如变量），我们可以在其中存储内容。也就是说，该对象应该是可寻址的，这意味着我们可以提取并使用它的内存地址。不允许使用常量或计算结果。例如：\n\
  \n编译器将产生类似于 `error ‘=’’: left operand must be lvalue` 的错误信息。此外，`lvalue` 必须是可修改的。例如，将在第\
  \ 8 章中看到数组变量不是可修改的 `lvalue`。`lvalue` 概念的对面是 `rvalue`。根据经验，`rvalue` 是不是 `lvalue`\
  \ 的表达式，例如常量值（如 `10`）、表达式（如 `a+b`）或返回非引用类型的函数调用。特别地，`rvalue` 表达式求出的结果只临时存储在内存中。例如，如果我们写\
  \ `c = a+b;`，表达式 `a+b` 的结果临时存储在内存的某处，仅复制到 `c` 中，然后该内存被丢弃。因此，表达式 `a+b` 是一个 `rvalue`。总结来说，`rvalue`\
  \ 是一个求出临时值的表达式，而 `lvalue` 则求出一个在内存中可寻址的更持久的值。\n\n如果不确定，判断一个表达式是 `lvalue` 还是 `rvalue`\
  \ 的快速测试方法是问自己是否可以获取并在稍后使用它的地址（我们将在第 8 章中学习如何使用 `&` 运算符来实现）。如果可以，它就是 `lvalue`。例如：\n\
  \n### 算术运算符\n\n算术运算符 `+`、`-`、`*` 和 `/` 分别用于执行加、减、乘、除法运算。如果操作数具有算术类型，则在需要时应用第 2 章中讨论的算术转换。\n\
  \n当两个操作数都是整数时，`/` 运算符会截断小数部分。例如，假设 `a` 和 `b` 是值分别为 `8` 和 `5` 的 `int` 变量。那么 `a/b`\
  \ 为 `1`。如果两个操作数都是浮点类型，`/` 运算符执行浮点除法。`%` 运算符用于求整数除法的余数。它对浮点类型没有定义。例如，`8%5` 的结果为 `3`。\n\
  \n注意在 C++11 之前，如果其中一个运算符为负数，余数的符号取决于实现。C++11 规定余数的符号与除数的符号相同。例如，`-9%-5` 的结果为 `-4`。\n\
  \n### ++ 和 -- 运算符\n\n`++` 增量运算符将变量的值增加 `1`。它可以位于变量名之前（前缀）或之后（后置）。操作数必须是可修改的 `lvalue`，例如普通变量。例如：\n\
  \n`a` 的值增加了两次，变为 `12`。\n\n如果 `++` 运算符以后置形式使用，则在变量当前值用于表达式之后执行增加。例如：\n\n`a` 的当前值首先存储到\
  \ `b` 中，然后 `a` 增加。因此，`a` 变为 `11`，`b` 变为 `10`。\n\n如果以前缀形式使用，则先增加变量的值，然后将新值用于表达式求值。例如：\n\
  \n先增加 `a`，并将该值存储到 `b` 中。因此，两个变量都变为 `11`。\n\n`--` 递减运算符将变量的值减少 `1`。例如：\n\n\n\n\n\
  `a` 的值被减了两次，变为 8。当在表达式中使用 `--` 运算符时，它的行为类似于 `++` 运算符。例如：\n\n`a` 的当前值先减 1，然后将新值存储到\
  \ `b` 中。因此，程序输出：`9 9`。然后，`a` 的值先存储到 `b` 中，再减 1。因此，程序输出：`8 9`。另一个例子：\n\n`a` 的当前值先加\
  \ 1，代码显示 `2.23`。然后，代码先显示 `a` 的值（即 `2.23`），然后 `a` 减 1。`++` 和 `--` 运算符可以组合在同一个表达式中。例如，以下程序的输出是什么？\n\
  \n通过操作 `b++`，`b` 的值先被使用后增加。通过 `--a`，`a` 的值先减 1 然后在表达式中使用。通过 `c--`，`c` 的值先被使用后减 1。因此，程序输出\
  \ `1-(-1)*2 = 3`，且 `a`、`b` 和 `c` 的值分别变为 `-1`、`2` 和 `1`。\n\n例如，`a * a++` 的结果取决于实现。这取决于编译器是先增加\
  \ `a` 再进行乘法，还是不是。在大多数情况下（如本例所示），编译器可以按任何顺序评估运算符。存在一些例外，例如 `&&`、`||`、`?:` 和逗号运算符，它们的求值顺序是有规定的，但通常情况下编译器可以选择任何顺序。因此，不要创建像之前那样的表达式，因为它们的结果是定义。\n\
  \n### 关系运算符\n\n关系运算符 `>`, `>=`, `<`, `<= `, `!=`, 和 `==` 用于比较两个操作数并确定它们的关系。正如我们将在接下来的章节中看到的，关系运算符主要用于\
  \ `if` 语句和迭代循环。例如，使用语句：\n\n*   `if(a > 5)` 我们检查 `a` 是否大于 5。\n*   `if(a >= 5)` 我们检查\
  \ `a` 是否大于等于 5。\n*   `if(a < 5)` 我们检查 `a` 是否小于 5。\n*   `if(a <= 5)` 我们检查 `a` 是否小于等于\
  \ 5。\n*   `if(a != 5)` 我们检查 `a` 是否不等于 5。\n*   `if(a == 5)` 我们检查 `a` 是否等于 5。\n\n\
  关系运算符产生类型为 `bool`，即 `true` 或 `false`。例如，表达式 `(a < 5)` 的值仅在 `a` 小于 5 时才为 `true`，否则为\
  \ `false`。一个更复杂的例子是，告诉我表达式 `-10 < a < -3` 的结果是什么；它取决于 `a` 的值吗？\n\n由于 `<` 运算符是左结合的（参见附录\
  \ A），首先计算 `-10 < a` 的值。结果为 `true` 或 `false`。回想第 2 章](#chapter2.xhtml_c2)，`bool`\
  \ 值会被提升 `int`，其中 `true` 的默认值为 `1`，`false` 的默认值为 `0`。因此，比较的结果（即 `1` 或 `0`）与 `-3`\
  \ 进行比较。因此，无论 `a` 的值是什么，表达式的值始终为 `false`。正如我们接下来看到的，为了测试一个值是否在给定集合内，我们使用 `&&` 运算符。\n\
  \n例如，表达式 `a == 5` 的值仅在 `a` 等于 5 时才为 `true`，否则为 `false`。`a` 的值保持不变。另一方面，表达式 `a =\
  \ 5;` 将值 `5` 赋值给 `a`。我们将在下一章介绍 `if` 语句时看到更多此类示例。\n\n## 练习题\n\nC.4.1 以下程序的输出是什么？\n\
