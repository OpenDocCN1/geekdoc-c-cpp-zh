  \ 的元素是 `const`，也就是说我们不能更改它们的值。此外，该类型支持 `begin()` 和 `end()` 函数（类似于 `vector`），用于访问其元素。让我们来看一个例子：\n\
  \n程序使用模板函数 `show()` 显示 `initializer_list` 参数中包含的元素。当我们在第 16 章中讨论函数模板时，你会看到如何工作的。目前，只需知道变量\
  \ `str_lst` 的类型 `T` 将替换为 `string`，`int_lst` 将替换为 `int` 即可。正如注释所示，当将值列表传递给 `initializer_list`\
  \ 参数时，必须在大括号中。最后，程序显示：\n\n注意，带有 `initializer_list` 参数的函数也可以接受额外的普通参数。例如：\n\n以及一个如何调用它的示例：`f({1,\
  \ 2}, 3.4);`\n\n## 递归函数\n\n调用自身的函数被称为递归函数。例如：\n\n为了看到递归如何工作，假设用户输入了一个大于 1 的数字，例如\
  \ 3，这样 `show()` 就会被再次调用。\n\n1. 在 `show()` 的第一次调用中，由于 `num = 3 > 1`，`show()` 使用参数\
  \ `num-1 = 3-1 = 2` 再次自身，且没有执行 `cout`。由于 `show()` 没有终止，为值为 3 的变量 `num` 以及与函数调用相关的内存不会被释放。\n\
  2. 在 `show()` 的第二次调用中，为 `num` 变量分配了新内存。由于 `num = 2 > 1`，`show()` 再次使用参数 `num-1 =\
  \ 2-1 = 1` 调用自身。与之前一样，`cout` 未执行，为值为 2 的新变量 `num` 分配的内存也不会释放。\n3. 与之前一样，在 `show()`\
  \ 的第三次调用中，为 `num` 变量分配了新内存。由于 `num` 不大于 1，`show()` 不再次被调用。因此，执行此 `cout` 并输出 `val\
  \ = 1`。该 `num` 分配的内存释放。\n\n接下来，所有未执行的 `cout` 将顺序执行，从最后一个到第一个。在每次 `show()` 终止时，为相应的\
  \ `num` 分配的内存都会被释放。\n\n在我们的示例中，这个条件是语句 `if(num > 1)`。我再次强调，确保递归最终达到一个终止条件是非常重要的，以避免无限递归和程序崩溃。\n\
  \n然而，栈的大小可能不足以存储与每次函数调用相关联的信息。例如，如果用户输入一个很大的值，例如 100000，程序的执行可能会异常终止，并出现 *Stack\
  \ overflow*（栈溢出）消息，这表示栈中没有其他可用内存。默认栈大小取决于实现。\n\n\n\n\n在实践中，递归通常用于实现数据结构中的数学算法或操作。通常情况下，当单个任务是待执行的原始任务的较小版本时，它就是使用递归函数来实现的候选方案。例如，我们将在第\
  \ 14 章中使用递归来实现二叉搜索树中的几个函数。然而，如果你能编写出等效的代码，可能会是一个更好的主意。例如，使用迭代循环代替。虽然递归代码可能更容易阅读和编写，但循环的性能可能会更好，因为它避免了连续的函数调用和栈中的内存分配。\n\
