  \n引用的主要用途是函数调用，我们稍后会。\n\n### 作为函数参数的引用 (References as Function Parameters)\n\n正如我们所学的，当我们想要让函数更改参数的值时，我们会传递对应变量的指针。另一种方法是传递它的引用。例如：\n\
  \n```cpp\nvoid test(int &a) {\n    a = 50;\n}\n```\n\n当变量的引用传递给函数时，实际传递的是变量的内存地址。因此，函数可以访问调用函数的变量。例如，当调用\
  \ `test()` 时，变量 `i`是通过引用传递的。事实上，这种传递数据的方法被称为*引用传递 (call by reference)*。注意 `&` 运算符只添加到函数声明中，而不是在调用时添加。在\
