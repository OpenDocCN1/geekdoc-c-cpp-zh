  \ 对象的系数 `a` 应变为 3，而通过语句 `t1[1] = 10;`，系数 `b` 应变为 10）。如果索引值无效（即它不是 0、1 或 2），则程序应终止。\n\
  \n    8. 重载 `==` 运算符函数，以便我们可以检查两个多项式是否相等，即它们的各自系数是否相等。\n\n    编写一个程序测试 `Polynomial`\
  \ 类的功能。\n\n# 19 更多关于类\n\nDOI: [10.1201/9781003230076-19](https://doi.org/10.1201/9781003230076-19)\n\
  \n在本章中，我们将讨论一些关于类属性的更专门的话，例如如何对类执行自动类型转换、在类中声明静态函数，以及如何使用成员初始化列表定义构造函数。我们将继续从第 16\
  \ 章开始讨论，查看移动语义和右值引用是如何运作的。我们还将讨论拷贝构造函数、友元类和嵌套类（即在其他类内部声明的类）。\n\n## 向类类型的转换\n\n正如我们在第\
  \ 17 章中所述的，当构造函数接受单个参数时，该参数类型的值可以转换为类类型。也就是说，构造函数充当了转换函数。例如，考虑 `T` 类：\n\n现在，我们可以写：\n\
