  \n### C.11.21\n编写一个函数，接收两个包含名称的 `vector` 对象作为参数，并返回一个包含共同名称的 `vector` 对象。编写一个程序读取名称的数量，创建两个\
  \ `vector` 对象，读取名称并将它们存储到对象中。然后，程序应该调用该函数并显示共同名称。存储名称时请使用 `string` 类型。\n\n**注释：**\
  \ `vector` 的使用对你来说可能很困难。不要担心，习惯了就好。当我们之后讨论类和对象时，你会更好地得理解它。\n\n### C.11.22\n在我的职业生涯中，我经常使用\
  \ C++ 来实现通信协议。例如，我将向你展示一种创建网络数据帧的方法。\n\n为了让系统连接到 Internet 地址，其网卡应该发送一个封装了特殊 `TCP`\
  \ 分段的 IP 包。假设使用了 `IPv4` 地址。`IPv4` 头部格式如图所示：\n\n![I P v4 头部格式示例，包含选项和填充。](img/fig11_2.jpg)<details><summary>无编号图\
  \ 2 的详细说明</summary>\n\nIPv4 头部包含六行字段。每行长 32 位。列从 0 编号到 31。第一行包含四个字段，即 `Version`（版本）、`IHL`（头部长度）、`Type\
  \ of Service`（服务类型）和 `Total length`（总长度）。`version` 字段长 4 位，`IHL` 字段长 4 位，服务类型字段长\
  \ 8 位，总长度长 16 位。第二行包含三个字段 `identification`（标识符）、`flags`（标志）和 `fragment offset`（碎片偏移）。`identification`\
  \ 字段长 16 位，`flags` 字段长 3 位，`fragment offset` 长 13 位。第三行包含三个字段 `Time to Live`（生存时间）、`Protocol`（协议）和\
  \ `Header Checksum`（头部校验和）。生存时间字段长 8 位，`protocol` 字段长 8 位，头部校验和字段长 16 位。第四行包含 `source\
  \ address`（源地址）字段，长 32 位。第五行包含 `destination address`（目的地址），长 32 位。第六行包含 `options`（选项）加填充，长\
  \ 32 位。IPv4 头部前五行的大小为 20 字节。</details> \n\n`TCP` 头部格式如图所示：\n\n![表格格式的 TCP 头示例，包含选项和填充。](img/fig11_3.jpg)<details><summary>无编号图\
  \ 3 的详细说明</summary>\n\nTCP 头部包含六行字段。每行长 32 位。列从 0 编号到 31。第一行包含两个字段，即 `Source Port`（源端口）和\
  \ `Destination Port`（目的端口），每个长 16 位。第二行包含 `sequence number`（序列号），长 32 位。第三行包含 `acknowledgment\
  \ number`（确认号），长 32 位。第四行包含四个字段，即 `data offset`（数据偏移）、`reserved`（保留）、`flags`（标志）和\
  \ `window`（窗口）。`data offset` 长 4 位，`reserved` 字段长 6 位，如 `UR`、`ACK`、`PSH`、`RST`、`SYN`\
  \ 和 `FIN` 等标志共占 6 位长度，`window` 字段长 16 位。第五行包含两个字段 `checksum`（校验和）和 `urgent pointer`（紧急指针），每个长\
  \ 16 位。第六行包含选项加填充，长 32 位。TCP 头部前五行的大小为 20 字节。</details> \n\n编写一个程序读取 `x.x.x.x` 格式的源\
  \ IP 地址（每个 `x` 是 `[0, 255]` 之间的整数）、`x.x.x.x` 格式的目的 IP 地址、`TCP` 目的端口（`[1, 65535]`\
  \ 之间的整数），并创建一个封装了适当 `TCP` 分段的 IP 包。程序必须将 IP 包的内容以十六进制格式存储在用户选择的文本文件中。每行包含 16 字节。在\
  \ IPv4 头部中设置以下值：\n\n1. `Version` = 4。\n2. `IHL` = 5。\n3. `Total Length` = IP 包的总长度，包括\
  \ TCP 数据。\n4. `Protocol` = 6。\n5. `Time to Live` = 255。\n6. `Destination Address`\
  \ = 目的 IP 地址。\n7. `Source Address` = 源 IP 地址。\n\n在 TCP 头部中设置以下值：\n\n1. `Destination\
  \ Port` = 目的 TCP 端口。\n2. `Source Port` = 1500。\n3. `Window` = 最大允许值。\n4. `SYN` 位\
  \ = 1。\n\n将其余字段设置为 0，并假设没有 `Options` 字段。\n\n程序有一个限制；如果目的 IP 地址以 `130.140` 或 `160.170`\
  \ 开始且 TCP 目的端口为 `80`，则不要创建 IP 包并显示相关消息。\n\n**注释：** 你对这个程序实际在做什么有什么想法吗？这个程序是一个流行应用程序*防火墙*的简化版本。事实上，防火墙的主要部分只是一个\
  \ `if-else` 语句。是的，我理解这对你来说可能很奇怪，我只是试图向你介绍计算机网络的世界。\n\n作为参数的二维数组\n\n声明一个接收二维数组作为参数的常用方法是编写数组名称后跟其维度。例如，`test(5,\
  \ 10)` 接收一个具有 5 行 10 列的二维数组作为参数。\n\n因为正如在第 7 章中讨论的，编译器不需要知道行数就能计算元素的位置，第一个维度可以省略。如果你指定了它，编译器将忽略它。例如：\n\
  \n然而，列数必须指定。通常情况下，当将多维数组传递给函数时，第一个维度可以省略。其他所有维度必须指定并与数组的声明匹配。这样，编译器就有了进行地址算术所需的必要信息。在这个示例中，任何第二个维度为\
  \ 10 的数组都可以传递给函数，但维度不是 10 的数组则不行。\n\n由于 C++ 将二维数组视为一维数组的数组，编译器实际上将二维参数转换为指向数组的指针。因此，我们可以等效地写为：\n\
  \n```cpp\nvoid test(int (*arr)[10]);\n```\n\n因为括号 `[]` 的优先级高于 `*`，所以括号是必要的，否则 `arr`\
  \ 将被解释为 10 个指针的数组，而不是指向 10 个整数数组的指针。\n\n\n\n\n现在来防御一下，一连串的问题接踵而至。`arr` 指向哪里？它指向数组的第一行。如果我们写\
  \ `arr++`，它会指向哪里？在下一个位置，因为它是按行的大小增加的。那么 `(*arr)[1]` 是什么呢？它是 `arr` 所指向的行中的第二个元素。那么\
  \ `(*++arr)[0]` 又是什么呢？它将 `arr` 指向下一行，并访问该行的第一个元素。我们如何知道已经到达了数组的最后一行呢？通常，我们要么使用一个常量，要么传递一个参数来声明总行数。警报结束。如果你有任何疑问，请再次阅读第\
  \ 8 章](#chapter8.xhtml_c8) 中的“指针与二维数组”一节。\n\n我再写一遍，编译器将二维数组翻译为指向数组的指针，而不是你可能预想的指向指针的指针。因此，写成\
  \ `void test(int arr);` 是非法的。当我们在第 14 章](#chapter14.xhtml_c14) 中讨论 `new` 运算符时，你将在示例\
  \ C.14.5 中看到我们如何使用指向指针的变量来动态创建一个二维数组并将其传递给函数。让我们总结一下编译器如何翻译数组参数：\n\n> *一维的*：例如，`arr[10]`\
  \ 被翻译为指针 `arr`。\n\n> *二维*：例如，`arr[10][20]` 被翻译为指向数组的指针 `(*arr)[20]`。\n\n> *指针数组*：例如，`*arr[10]`\
  \ 被翻译为指向指针的指针 `arr`。\n\n另一种，我们可以将数组视为一维的，但我并不希望这样做，因为访问元素会变得更难理解且容易出错。当然，我们需要知道数组的维度。例如：\n\
  \n与一维数组一样，在将二维数组作为参数传递时，我们只写它的名字，不带括号。如果我们想传递某行（例如 `i`），我们就传递指向该行的指针（例如 `arr[i]`），就像我们传递一维数组时一样。例如，以下程序显示了第一行的元素：\n\
  \n## 练习题\n\nC.11.23 写一个函数，接受一个 3×4 的二维数组作为参数，并返回两个数组：其中每个元素都等于二维数组对应行元素之和；另一个数组的每个元素都等于二维数组对应列元素之和。写一个程序读取\
