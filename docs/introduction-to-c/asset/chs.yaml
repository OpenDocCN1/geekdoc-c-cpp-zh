  \ 类似的程序，处理三位正数。例如，如果赋值的值为 `123`，程序应该显示 `6`。\n\n## 3 数据输入/输出\n\nDOI: [10.1201/9781003230076-3](https://doi.org/10.1201/9781003230076-3)\n\
  \n在本章中，我们将学习使用 `cout` 对象格式化输出的各种方法。我们还将学习如何使用 `cin` 对象从用户获取输入，将输入存储在变量中并在程序中使用。我们不会涵盖数据输入/输出的所有方面，但你将获得足够读取和输出数据所需的知识。\n\
  \n### 使用 cout 进行数据输出\n\n在 C++ 中，数据输入和输出是通过*流*（streams）实现的。“流”一词指的是数据源或数据点。例如，输出流可能与屏幕、文件或输出设备（如打印机）关联。C++\
  \ 提供了在 `iostream` 和 `fstream` 头文件中声明的一系列类来支持数据输入/输出操作。我们将在第 17 章 中讨论类和对象。目前，只需要知道类是程序员定义的类型类型，它代表一个逻辑实体。对象是特定类的实例，它是根据类的描述创建的。类包含变量和函数，这些变量和函数决定了可以在该类对象上执行的操作。例如，`ostream`\
  \ 类包含了负责数据输出的函数。\n\n`cout` 是 `ostream` 类的一个对象。默认情况下，`cout` 对象与预定义的标准输出（如屏幕）关联。对于熟悉\
  \ C 语言的人，`cout` 对应于 `stdout`。`cout` 后面跟着 `<<` 运算符和我们要显示的表达式。默认情况下，写入 `cout` 的值会被转换为字符序列。例如，如果我们写道：\n\
  \n```\ncout << 3 << 5;\n```\n\n字符 3 和 5 被插入到输出流中。在继续之前，为那些来自 C 语言的人解释一下，`<<` 是左移运算符。这在\
  \ C++ 中同样适用，只是 `ostream` 类重载了它并改变了它的行为。按这种方式使用时，`<<` 运算符将其右侧的数据发送到 `cout`。`<<` 在视觉上暗示数据流的方向是从右到左的。当我们读到第\
  \ 18 章 并讨论运算符重载时，你将看到如何改变运算符的行为。\n\n如果你熟悉 C 的输入/输出系统以及 `stdio.h` 中声明的函数（例如 `printf()`），你也可以在\
  \ C++ 程序中使用它们来显示数据。然而，`printf()` 的格式和语法更复杂，因为必须指定每个变量的类型。此外，`printf()` 无法扩展到用户定义的类型（例如，没有特定的标识符来显示类的所有成员），而且在安全性方面也不够好，因为它不检查传递给它的类型和参数。例如：\n\
  \n```\nprintf(\"%d\", x);\n```\n\nC++ 提供了灵活性、安全性并简化了数据输出，因为 `cout` 和 `<<` 运算符知道如何处理每种数据类型。\n\
  \n写入 `cout` 的数据并没有直接发送到目的地，而是存储在内存中的缓冲区区域。当缓冲区满时，数据会被发送到目的地。使用 `endl` 或 `\\n` 可以强制刷新缓冲区。写入\
  \ `cout` 的数据并没有直接发送到目的地，而是存储在内存中的缓冲区区域。当缓冲区满时，数据会被发送到目的地。使用 `endl` 或 `\\n` 可以强制刷新缓冲区。写入\
  \ `cout` 的数据并没有直接发送到目的地，而是存储在内存中的缓冲区区域。。使用 `endl` 或 `\\n` 可以强制刷新缓冲区。\n\n### 转义序列\n\
  \n在 C++ 中，有些字符具有特殊含义。对于不可打印字符（例如退格）和具有特殊含义的字符（例如 `\"`），C++ 提供了特殊的表示法，称为*转义序列*。一个转义序列由反斜杠\
  \ `\\` 后跟一个字符组成。尽管这些序列看起来像两个字符，但它们只表示一个。例如，当我们写 `\\n` 时，编译器将其解释为换行。表 3.1](#chapter3.xhtml_t3_1)\
  \ 列出了转义序列及其含义。\n\n如果 `\\` 之后的字符不受支持，其行为是未定义的。转义序列分为*字符转义序列*和*数字转义序列*。字符转义序列可以表示常见的\
  \ ASCII 控制字符（例如换行），而数字转义序列（即表中后两个）可以表示任何字符。让我们看看以下程序：\n\n\n\n\n\n正如我们稍后看到的，除了 `\\\
