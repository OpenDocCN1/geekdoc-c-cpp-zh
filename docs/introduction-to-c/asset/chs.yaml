  ### 指针与数组\n\n数组的元素存储在连续的内存位置，第一个存储在最低内存地址。数组的类型定义了元素在内存中的距离。例如，在 `char` 数组中，距离是一个字节，而在\
  \ `int` 数组中，距离等于 `int`的大小（例如，四个字节）。\n\n类似地，`arr+1`可以作为指向第二个元素的指针，`arr+2`作为指向第三个元素的指针，依此类推。通常，以下表达式是等价的：\n\
  \n```\narr[i] == *(arr + i)\n```\n\n作为结果，以下程序输出四次相同的值：\n\n\n\n\n注意，尽管表达式 `&arr`\
  \ 输出的值相同，但它与其他表达式不同。该表达式求值结果指向整个数组的指针，而其他表达式求值结果指向其第一个元素的指针。特别地，`&arr` 的类型是“指向包含五个整数的数组的指针”，而其他的类型是“指向整数的指针”。很困难吗？\n\
  \n为了让它变得更难，如果我们写的是 `&arr+1` 而不是 `&arr`，它与其他值相比会有什么区别（是 1、4 还是别的……）？要回答这个问题，请使用表达式的类型和指针算术。我不会告诉你答案；自己思考一下，运行程序，检查输出，并尝试弄清楚为什么是那样。如果你需要解释，不要给我发邮件，我不在了……\n\
  \n由于数组名可以用作指向其第一个元素的指针，因此它的内容等于其第一个元素的值。因此，`*arr` 等于 `arr[0]`。同样地，由于 `arr+1` 是指向第二个元素的指针，`*(arr+1)`\
  \ 等于 `arr[1]`，依此类推。通常情况下，以下表达式是等价的：\n\n```c\n*(arr+n)\n```\n\n括号是必要的，因为 `*` 运算符的优先级高于\
  \ `+` 运算符。因此，表达式 `*(arr+n)` 和 `*arr + n` 的求值方式不同。例如，考虑以下程序：\n\n通过语句 `ptr = arr+1;`，`ptr`\
  \ 等于 `arr[1]` 的地址，所以 `*ptr` 等于 `arr[1]`，即 20。由于 `*` 运算符的优先级高于 `+`，`*ptr+2` 等于 `20+2\
  \ = 22`。`*(ptr+2)` 的值是 `ptr` 所指向的地址的内容增加两个整数位置后的值。因此，`*(ptr+2)` 等于 `arr[3]`。结果是，程序显示：22\
  \ 40\n\n接下来的程序使用数组下标和指针算术以两种不同的方式显示 `arr` 元素的地址和值：\n\n第一种方法使用元素的索引，而第二种方法使用数组名作为指针。我更倾向于使用数组下标而不是指针算术。原因是为了获得更清晰且不易出错的代码。换句话说，我认为\
  \ `arr[i]` 比 `*(arr+i)` 更易读且更安全。例如，缺少括号会引入 bug，而这种 并不容易追踪。然而，由于这两种方法都很流行，你必须学习并使用它们。在性能方面，无论你如何编写，目前高级编译器所做的优化都会产生同样高效的代码。\n\
  \n需要记住的重要的一点是，编译器会将 `arr[i]` 转换为 `*(arr+i)`。我们可以说 `arr[i]` 是 `*(arr+i)` 的一种优雅快捷方式。你将在后面的练习中遇到该规则的一个非常奇妙的应用。陷阱已经设好，正等着你！\n\
  \n接下来的程序使用另一个指针变量来显示 `arr` 元素的值和地址。\n\n语句 `ptr = arr;` 让 `ptr` 指向第一个元素，而每次执行 `ptr++;`\
  \ 都让 `ptr` 指向下一个元素。注意我没有写 `ptr = &arr;`，因为 `&arr` 的类型对应于指向数组的指针，而 `ptr` 是指向整数的指针。这会导致编译错误。\n\
  \n因此，如果我们在上一个例子中写 `arr++;` 或 `arr = &i;`，编译器将对非法操作显示错误信息。现在，你就可以理解为什么我在第 7 章中告诉过写\
  \ `b = a;` 将数组 `a` 的元素拷贝到 `b` 是非法的。然而，允许将其值拷贝到指针变量中，正如我们通过 `ptr = arr;` 所做，并使用该指针访问数组元素。\n\
  \n尽管数组和指针密切相关，但你必须明确，数组不是指针，反之亦然。例如，声明 `int a[50];` 和 `int *a;` 是完全不同的。对于第一个声明，编译器为\
  \ 50 个整数分配内存。数组可以在不同时间被填入不同的值，但数组名 `a` 始终指向同一个内存地址。正如所说，不能给它赋新值，也就是说，写 `a = arr;`\
  \ 是非法的。对于第二个声明，编译器分配内存来存储指针的值（例如，通常为 4 字节）。与数组不同，允许为指针赋新值并使其指向其他地方，例如，写 `a = arr`\
  \ 是合法的。\n\n只需记住，每当表达式中使用数组名时，它总是作为指向其第一个元素的指针。并不总是如此，有几种例外：\n\n1. 当数组名作为 `sizeof`\
  \ 运算符的操作数时，它被转换为整个数组的大小。\n2. 当数组名作为 `&` 运算符的操作数时，它返回其第一个元素的地址。正如我们在第 11 章 中讨论的，它返回指向整个数组的指针。\n\
  3. 当数组名作为 `+` 运算符的操作数时，它返回指向后续位置的指针。我们将在第 16 章 中看到这样的例子。\n4. 当数组名作为 `*` 运算符的操作数时，它被解引用为其第一个元素。\n\
  \n### 使用下标法访问指针\n\n尽管指针变量不是数组，但它可以像数组一样被索引。例如，接下来的程序通过以下方式使用指针并像数组一样索引来显示 `arr`\
  \ 元素的地址。注意尽管 `arr[i]` 和 `ptr[i]` 访问的是同一个元素，但获取方式不同。例如，访问 `arr[2]`，它获取 `arr` 的地址，增加\
  \ 8 字节（假设 `int` 为 4 字节），然后到达该地址获取值。另一方面，访问 `ptr[2]`，它获取 `ptr` 的地址，获取其存储的值，增加 8 字节，然后到达该地址获取值。\n\
  \n```c\nint arr[] = {10, 20, 30, 40, 50, 60, 70};\nint *ptr = arr;\nfor (int i =\
  \ 0; i < 7; i++)\n    printf(\"%p %d\\n\", &arr[i], arr[i]);\nfor (int i = 0; i\
  \ < 7; i++)\n    printf(\"%p %d\\n\", ptr + i, ptr[i]);\n```\n\n\n\n\n### C.8.11\
