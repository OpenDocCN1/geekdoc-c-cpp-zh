  \n### sizeof 运算符\n\n`sizeof` 运算符用于计算存储特定类型、变量、常量或表达式的值所需的字节数。结果的类型为 `size_t`，它在\
  \ `cstddef` 文件以及其他头文件中被定义为某些无符号整数类型的别名（例如 `unsigned int`）。例如，以下程序使用 `sizeof` 运算符显示程序变量在内存中分配的字节：\n\
  \n在我的环境中，程序显示：1 4 8。注意，如果我们声明另一个变量，例如 `int j`，并写 `sizeof(i+j)`，程序将显示 4，因为表达式的类型是整数。然而，如果我们写\
  \ `sizeof(i+d)`，程序将显示 8，正如我们在第 2 章中所学的。\n\n注意，如果操作数是类型（例如 `int`），则需要括号，但如果是变量则不需要。然而，如果不使用括号，如\
  \ `sizeof i*j` 等表达式的结果是不明确的。`sizeof` 先作用，然后是乘法。\n\n### enum 类型\n\n`enum` 类型用于定义枚举类型，它是一组命名的常量。名称在相同作用域内必须互不同，但值不需要。通常，其声明如下：\n\
  \n标签是一个可选的标识符，用于标识枚举列表。例如，语句定义了 `Day_Parts` 枚举类型以及枚举常量 `MORNING`、`AFTERNOON`、`EVENING`\
  \ 和 `NIGHT`。常量名称受作用域规则。例如，如果枚举定义在函数内部，则其常量在函数外不可见。我们将在第 11 章 作用域规则。无标签枚举用于我们需要一组常量整数且对声明该类型的变量不感兴趣。\n\
  \n第一个常量的默认值为 0；尽管如此，我们可以在声明枚举时设置特定值。例如：\n\n如果常量没有显式赋值，它将初始化为上一个初始化常量的值加一。因此，第一个示例中\
  \ `MORNING`、`AFTERNOON`、`EVENING` 和 `NIGHT` 常量的值分别为 0、1、2 和 3，而在第二个示例中分别变为 5、6、10\
  \ 和 11。注意，值不需要是唯一的。例如，我们可以让 `AFTERNOON` 等于 `MORNING` 的值。\n\n回顾第 2 章，我们可以使用 `#define`\
  \ 指令和 `const` 限定符来声明常量。它们与 `enum` 的主要区别在于，`enum` 类型将常量分组以形成一组值。也就是说，当我们需要一组值来表征一个实体（例如：）时，`enum`\
  \ 类型更具代表性。而且，如果要把这样一个集合传递给函数，传递枚举变量比传递普通整数更好。\n\n\n\n为了声明一个命名枚举类型的枚举变量，我们这样写：\n\n\
  例如，使用语句：`Day_Parts d1, d2;`\n\n`d1` 和 `d2` 被声明为 `Day_Parts` 类型的枚举变量。对于熟悉 C 语言中 `enum`\
  \ 类型的人来说，请注意，在声明枚举变量时不需要添加 `enum` 关键字。在 C++ 中，枚举的名称定义了一个新类型，该类型可以像基本类型一样使用。或者，我们也可以在定义类型时声明变量。例如：\n\
  \n在这个示例中，如果标签 `Day_Parts` 之后不再用于声明额外的变量，则可以省略它。然而，即使以后不再使用，我的偏好始终是使用枚举标签（tag），以便读者更更容易地意识到该枚举的目的。\n\
  \n我们可以像对待整数变量一样对待枚举变量，但并不总是如此，因为它们并不是真正的整数变量。特别是，枚举变量会隐式转换为整数，但整数不会隐式转换为枚举类型。例如，考虑以下程序：\n\
  \n该程序读取一个整数，将其存储在枚举变量 `d` 中，并显示与一天中下一部分对应的数字。由于整数不会隐式转换为枚举类型，因此需要进行强制转换（cast）。注意，编译器不会检查存储在枚举变量中的值是否为枚举的有效值。你必须手动检查其有效性。如果赋值了一个与其常量以外的值，编译器可能会发出警告。\n\
  \nC++11 定义了第二种枚举类型，称为 `enumeration class`（枚举类）。与我们看到的枚举的一个区别是，枚举类中名称的作用域是局限于枚举内部的。因此，我们允许在不同的枚举中使用相同的名称。例如，在简单枚举中，写成这样是错误的：\n\
  \n但如果我们使用枚举类（像以前一样通过添加 `class` 关键字来创建），就没有问题了。例如：\n\n由于作用域是局部的，我们必须使用作用域解析运算符 `::`\
  \ 来访问这些名称。例如：\n\n同样，枚举常量的值不会像简单枚举那样隐式转换为整数。也就是说，写成这样是错误的：\n\n我们应该进行强制转换。例如：\n\n\
  通过禁止隐式转换为整数，可能有助于避免产生错误操作的风险。例如，在简单枚举中，我们可以进行无效的比较：\n\n尽管如此，代码可以编译。如果 `dp` 是一个 `enum\
  \ class`，这段代码将无法编译。\n\n通常情况下，由于强制转换以及枚举类定义了其独立的作用域（我们将在第 11 章中讨论作用域），避免了名称冲突的潜在风险，使得\
  \ `enum class` 比简单枚举是一个更安全、更好的选择。\n\n## 位运算符\n\n位运算符通常用于访问整数变量或常数的二进制位。位值可以是 0 或\
  \ 1。包含位运算符的表达式的求值是通过将它们应用于运算符对应的位来完成的。\n\n位运算符在几个应用中特别有用。例如，我曾将其用于通信协议、数据加密算法以及与硬件通信的低层应用程序。稍后我会向你展示一些示例。\n\
  \n### & 运算符\n\n`&` 运算符对两个操作数的所有位执行布尔“与”（AND）操作。如果两个对应的位均为 1，则结果位为 1。否则，该位被设置为 0。例如，`23\
  \ & 11` 的结果是 3（为了简单起见，我使用 8 位）：\n\n`&` 运算符经常用于将某些位清零。例如，语句：`a = a & 15;` 将 `a` 的低四位以外的所有位都置零。\n\
  \n### | 运算符\n\n`|` 运算符对两个操作数的所有位执行布尔“或”（OR）操作。如果两个对应的位均为 0，则结果位为 0。否则，该位被设置为 1。例如，`23\
  \ | 11` 的结果是 31：\n\n`|` 运算符经常用于将某些位置 1。例如，语句：`a = a | 15;` 将 `a` 的低四位置 1。\n\n###\
  \ ^ 运算符\n\n`^` 运算符对两个操作数的所有位执行布尔“异或”（XOR）操作。如果对应的位不同，则结果位为 1。否则，该位被设置为 0。例如，`23\
  \ ^ 11` 的结果是 28：\n\n`^` 运算符常用于数据加密。例如，以下程序读取一个对应密钥的整数和另一个将用该密钥加密的整数。加密通过对它们应用 `^`\
  \ 运算符来完成。然后，程序再次使用 `^` 运算符解密加密后的结果并将其打印在屏幕上。\n\n由于 `(a ^ b) ^ b = a`，解密的结果就是输入的数字。\n\
  \n### ~ 运算符\n\n`~` 取反运算符是一个一元运算符，它对操作数的所有位执行布尔“非”（NOT）操作。特别是，它会将 1 反转为 0，反之亦然。例如，在\
  \ 32 位系统中，`~23` 的结果是：\n\n### 移位运算符\n\n移运算符将整数变量或常数的位向左或向右。`>>` 运算符将位右移，而 `<<` 运算符将位向左移。两个运算符都接受一个右操作数，指示位移动的位数。如果\
  \ `i` 是负数，右移的结果是未定义的。`>>` 将 `i` 的位右移 `n` 位。如果 `i` 是正数，左侧空出的位填充 0。如果 `i` 是负数，取决于实现是填充\
  \ 1 还是 0。程序员有责任确保右操作数有效。`<<` 将 `i` 的位向左移 `n` 位。如果 `i` 是正数，右侧空出的位填充 0。如果 `i` 是负数，取决于实现是填充\
  \ 1 还是 0。\n\n当你使用 `<<` 运算符将移位结果存储到变量时，请确保变量的类型足够容纳该值。例如，在代码中 `a` 的值是多少？\n\n语句 `a\
  \ <<= 3` 将 `a` 的值向左移 3 位并在右侧插入零位。因此，移位结果为 `100000000`。然而，由于 `a` 被声明为 `unsigned char`，它只能容纳低八位的值。因此，`a`\
  \ 变为 0 而不是你预期的 256。如果被声明为 `int`，其值将是 256。让我们来看另一个例子：\n\n`a` 的值向左移 4 位并变为 `10000000`。如果\
  \ `char` 类型是有符号的，最左位留作符号位，`a` 变为 -128。如果 `a` 被声明为 `unsigned char`，其值将是 128。\n\n\
  *记住，在无符号类型上进行位运算更安全。*\n\n\n\n\n现在你已经学习了 `<<` 和 `>>` 运算符，你可能想知道它们是如何与 `cout` 和 `cin`\
  \ 对象一起使用的？答案是，当像这样使用它们时，它们并不作为移位运算符工作。正如我们在第 18 章中所将学的，`ostream` 类重载了它们并改变了它们的行为。对于编译器而言，它们的使用方式根据上下文是非常清晰的。\n\
  \n### 替代表示\n\n语言提供了一系列保留字，用于以下运算符的替代表示：\n\n例如，表达式：\n\n等同于：\n\n我更倾向于使用运算符。\n\n虽然我们将在下一章中讨论\
  \ `if` 语句，但我们将在后续的一些程序中使用它，以便你更好地理解这些运算符的使用。\n\n## 练习题\n\nC.4.4 编写一个程序，读取一个整数并显示一条消息，指示它是偶数还是奇数。使用\
  \ `&` 运算符。\n\n**注释：** 为了确定一个数是偶数还是奇数，我们检查它的最后一位。如果是 0，则为偶数；否则为奇数。假设变量 `num` 的二进制编码为：\n\
  \n其中每个 'x' 代表 0 或 1 的位。那么，`num & 1` 的结果是：\n\n因此，结果等于最后一位的值。如果为 1，则 `if` 语句中的条件为真，程序显示该数是奇数的消息。如果是\
  \ 0，则条件为假，程序显示该数是偶数的消息。\n\n注意，这个解决方案基于我们在第 2 章中所做的假设，即系统使用最常用的表示负数的方法，即补补码。对于一个更通用且可移植的解决方案，你应该使用\
  \ `%` 运算符。\n\nC.4.5 下面程序的输出是什么？\n\n**答案：** 根据附录 A 中的优先级表，`~` 运算符的优先级高于 `<<` 运算符；因此，表达式\
  \ `~0` 先求值，然后将结果向左移动三位。在 32 位系统中，`~0` 的结果是所有 32 位都设置为 1 的数字。因此，`(~0 << 3)` 的值是数字：11111111\
  \ 11111111 11111111 11111000\n\n由于再次应用 `~` 运算符，赋值给 `i` 的值是：00000000 00000000 00000000\
  \ 00000111，即 7。\n\n由于表达式 `(i >> 3)` 的值为 0，第一个 `if` 语句显示 Two。注意，`if` 语句并没有将 `i` 的值改为\
  \ 0；它只是测试 `i` 向右移动三位后是否为 0。第二个 `if` 语句测试 `(i << 2)` 的值是否为 28。由于结果为真，程序显示 One。与之前一样，`i`\
  \ 没有改变，因此程序显示 7。\n\nC.4.6 从硬件获取数据的应用程序通常需要检索某些位的值。例如，编写一个程序，读取一个整数和一个位位置，并显示相应位的值。假设用户输入的是\
  \ [1, 32] 范围内的位位置。\n\nC.4.7 位运算运算符经常用于网络通信中的数据编码。例如，传输控制协议 (TCP) 数据包头部的某些特定位编码如下：\n\
  \n![一行 8 个方框表示 TCP 头部的位。](img/fig4_1.jpg)<details><summary>无编号图 1 的详细描述</summary>\n\
  \n这些位从右到左命名为：bit 1、bit 2、bit 3、bit 4、bit 5、bit 6、bit 7 和 bit 8。某些位被标记了。bit 1 标记为\
  \ FIN。bit 2 标记为 SYN。bit 5 标记为 ACK。bit 6 标记为 URG。其他位未被标记。</details> \n\n> FIN (bit1):\
  \ 如果为 1，表示释放 TCP 连接。\n\n> \n\n> SYN (bit2): 如果为 1，表示建立 TCP 连接。这就是那个著名的负责拒绝服务 (DoS)\
  \ 洪泛攻击的位，但那是另一个故事了……\n\n> \n\n> ACK (bit5): 如果为 1，表示确认接收数据。\n\n> \n\n> URG (bit6):\
  \ 如果为 1，表示传输紧急数据。\n\n编写一个程序读取 URG、ACK、SYN 和 FIN 位的值，并将这些信息编码在程序变量中。然后，程序应该解码该变量的值并显示相应位的值。\n\
  \nC.4.8 位运算运算符经常用于与硬件通信的应用程序。例如，异步串口通信中一种常用的配置方法是八位字符，带有一个 `start_bit`、一个 `stop_bit`\
  \ 和一个 `parity_bit`。数据传输由 `start_bit` 信号指示，`stop_bit` 用于指示结束。![一行 8 个方框表示 TCP 头部的位。](img/fig4_1.jpg)<details><summary>无编号图\
  \ 1 的详细描述</summary>\n\n这些位从右到左命名为：bit 1、bit 2、bit 3、bit 4、bit 5、bit 6、bit 7 和 bit\
  \ 8。某些位被标记了。bit 1 标记为 FIN。bit 2 标记为 SYN。bit 5 标记为 ACK。bit 6 标记为 URG。其他位未被标记。</details>\
  \ \n\n发送方可以选择传输 `parity_bit`，接收方用它检测错误。校验有两种方式：偶偶校验和奇校验。在偶校验中，`parity_bit` 的值计算方式使得数据中\
  \ 1 的个数为偶数。在奇校验的情况下，总数应该是奇数。在我们的示例中，选择了偶校验。因此，由于数据中 1 的个数为二（即偶数），`parity_bit` 被设置为\
  \ 0。\n\n编写一个程序模拟发送方。该程序应该读取五个数据位并使用偶校验生成 8 位值。\n\n\n\n\n接下来，所有变量都等于 5。由于 `==` 运算符是左结合的，表达式\
  \ `a == b` 首先被求值。由于 `a` 等于 `b`，其值为真。因此，表达式 `a == b == c` 等价于 `1 == c`。由于 `c` 是 5，该表达式求值为为假，程序输出\
  \ 0。如果 `c` 是 1，程序将输出 1。注意整个表达式被括在括号中，因为 `<<` 运算符的优先级高于 `==`。\n\n复合运算符从右到左执行。因此，该表达式等价于\
  \ `a = a-(b += c--);`。单独来看，表达式 `(b += c--)` 等价于 `b = b+(c--)`。因此，`b = b+5 = 5+5\
  \ = 10`，而 `c` 减 1 变为 4。结果是表达式等价于 `a = a-10 = 5-10 = -5`，程序输出：-5 10 4。\n\n某些运算符的优先级并不是我们预期的，也不是我们想要的。例如，假设我们想将变量向左移动两位并加\
  \ 3。假设求值顺序是从左到右，那么写成 `a = b << 2 + 3;` 是合理的。遗憾的是，这是错误的；加法先执行，因为 `+` 运算符的优先级更高。为了得到想要的结果，必须将表达式\
  \ `b << 2` 括在内。在另一个例子中：\n\n由于 `==` 运算符的优先级高于 `&` 运算符，表达式 `8 == 0` 首先被求值，结果为假，然后是\
  \ `a & 0` 的值，对于任何 `a` 的值，结果都是假。因此，这个 `if` 条件始终为假。为了得到想要的结果，必须将表达式 `a & 8` 括起来。\n\
  \n注意，你不需要记住所有运算符的优先级和结合性。如果你不确定求值顺序，请使用括号。事实上，即使在没有必要时使用括号也能增加代码的可读性，并明确表达式的求值方式。例如，写成\
  \ `a = b-(c/d)+d;` 比写成 `a = b-c/d+d;` 更清晰。\n\n## 未完成的练习题\n\n在以下任何练习中不要使用 `if` 语句。\n\
