  \ C.10.27 中介绍的方法更高效。没有浪费内存。\n\nC.14.7 定义结构类型 `Publisher`，成员为 `name`、`address` 和\
  \ `phone number`。然后，定义结构类型 `Book`，成员为 `title`、`author`、`field`、`code`、`price` 以及一个指向\
  \ `Publisher` 类型结构的指针。除了 `price` 之外，所有其他成员必须是指针。假设最大文本长度为 100 个字符。编写一个程序，读取书籍数量，并为存储书籍数据以及出版社的数据分配内存。然后，程序应该读取书籍的\
  \ `code` 并在已注册的情况下显示其 `title` 和其出版者的名称。\n\n## 动态数据结构\n\n我们目前为止遇到的数据结构用于简单快速的方式进行数据存储和处理。例如，数组是数据结构，用于存储相同类型的数据。结构（struct）和联合体（union）也是数据结构，可以存储任何类型的数据。这些数据结构是静态的，意味着分配的内存是固定的，并且在程序执行期间无法修改。然而，在许多应用程序中，使用动态数据结构会更高效，动态数据结构的尺寸可以根据需要进行增长或收小。\n\
  \n接下来的章节将向你介绍动态数据结构的一些简单形式。标准库提供了许多此类结构（例如 `list`），我们可以在程序中使用它们。然而，为了更熟悉动态内存的管理，我们不打算使用这些现箱即用的工具，而是将尝试从零实现一些简单的数据结构，以直观感受发生了什么。\n\
  \n## 链表\n\n链表由一组链结的元素组成，称为 `nodes`（节点）。每个节点通常由一个结构表示，该结构包含其数据以及指向链中下一个节点的指针，如下如下所示：\n\
  \n![显示了一个节点链表，每个节点表示为两个并排的框。](img/fig14_1.jpg) <details><summary>无编号图 1 详细描述</summary>\n\
  \n数据结构的线性序列表示了从 `node_A` 到 `node_N` 的节点，从左到右的顺序相同。每个节点有两个位域，一个标记为 `data`，另一个标记为\
  \ `next`。每个节点指向下一个节点。最后一个节点 `N` 的两个位域是 `data` 和 `Null`。</details>\n\n第一个节点是链表的头，最后一个是尾。最后一个节点中的指针成员的值必须是\
  \ `nullptr`，表示链表的结束。\n\n与大小固定的数组不同，链表更加灵活，因为它的尺寸可以根据程序需要动态调整。由于我们可以轻松地在链表的任何位置插入和删除节点，创建和维护排序顺序要容易得多。另一方面，访问数组元素非常快；我们只需要使用其位置作为索引。通常，要访问链表节点，我们应该从头节点开始（不考虑存储节点地址以进行直接访问的情况），并串行遍历链表，而数组提供了随机访问。因此，访问节点的时间取决于它在链中的位置。如果节点靠近开头，速度就很快；如果靠近末尾，速度就很慢。这会对性能产生巨大影响。\n\
  \n### 插入节点\n\n新节点可以插入到链表的任何位置。要插入新节点，我们检查以下情况：\n\n1. 如果链表为空，节点被插入到开头，并成为链表的头和尾。它的指针成员的值被设置为\
  \ `nullptr`，因为链表中没有下一个节点。\n\n2. 如果链表为空，我们检查以下子情况：\n\n    1. 如果节点插入到链表的开头，它成为链表的新头，其指针成员指向之前的头，现在的头变成链表的第二个节点。\n\
  \n    2. 如果节点插入到链表的末尾，它成为链表的新尾，其指针成员的值被设置为 `nullptr`。旧尾变成倒数第二个节点，其指针成员的值从 `nullptr`\
  \ 指向新节点。\n\n    3. 如果节点插入到现有节点之后，新节点的指针成员必须指向当前节点的下一个节点，而当前节点的指针成员必须指向新节点。下图描述了新节点\
  \ `X` 如何插入到节点 `B` 和 `C` 之间。\n\n    ![图表描述了在两个节点 A 和 B 之间插入新节点 X。每个节点表示为两个并排的框。](img/fig14_2.jpg)\
  \ <details><summary>无编号图 2 详细描述</summary>\n\n链表有一条从 `node_A` 到 `node_N` 的节点链，从左到右的顺序相同。每个节点有两个元素，即\
  \ `data` 和 `next`。最后一个节点 `node_N` 的元素是 `data` 和 `null`。每个节点指向下一个。连接 `node_B` 到 `node_C`\
  \ 的链被断开。标记为 `node_X` 的新节点插入到 `node_B` 和 `node_C` 之间。该节点有元素 `data` 和 `next`。现在流程从\
  \ `node_B` 流向 `node_X`，然后从 `node_X` 流向 `node_C`，然后到 `node_D`，等等。</details>\n\n###\
  \ 删除节点\n\n要从链表中删除节点并释放其分配的内存，我们检查以下情况：\n\n1. 如果是头节点，我们检查以下子情况：\n\n    1. 如果有下一个节点，该节点成为链的新头。\n\
  \n    2. 如果没有下一个节点，链表为空。\n\n2. 如果是尾节点，前一个节点成为新尾，其指针成员被设置为 `nullptr`。\n\n3. 如果是中间节点，前一个节点的指针成员必须指向被删除节点的下一个节点。此操作在图中所示（删除）。\n\
  \n![图表描述了在两个节点 B 和 D 之间删除节点 C。每个节点表示为两个并排的框。](img/fig14_3.jpg) <details><summary>无编号图\
  \ 3 详细描述</summary>\n\n链表有一条从 `node_A` 到 `node_N` 的节点链，从左到右的顺序相同。每个节点有两个元素，即 `data`\
  \ 和 `next`。`node_N` 的元素是 `data` 和 `null`。每个节点指向下一个。连接 `node_B` 到 `node_C` 以及 `node_C`\
  \ 到 `node_D` 的链被断开。节点 `C` 被带有交叉号删除。现在流程从 `node_B` 流向 `node_D`，然后从 `node_D` 流向 `node_E`，等等。</details>\n\
  \n### 实现示例\n\n在创建链表之前，我们将先实现链表的两种特殊情况：栈和队列。请注意，实现这些数据结构有多种方法；我尝试用简单易于理解的方式来实现它们。在接下来的示例中，每个节点都是\
  \ `Node` 结构。如果你以后需要开发类似的数据结构，大部分代码都可以复用。\n\n正如我们所说，STL 提供了许多实现动态数据结构的类。例如，`stack`\
  \ 类实现了一个 LIFO（后进先出）栈。我们将在第 26 章](#chapter26.xhtml_c26) 中简要介绍它们。在这里，我们将尝试实现这些类的一些类似功能，以便获得更多管理动态内存的经验。在将来，如果你没有现成的类可用且需要实现自己的结构，这些经验可能会非常有用。\n\
  \n## 实现栈\n\n\n\n\n[content]\n\n在本节中，我们将创建一个 LIFO（后进先出）栈，正如其名称所示，最后插入的节点最先被提取。它是链表的一种特殊情况，并具有以下限制：\n\
  \n1. 新节点只能插入到栈的头部，并成为栈的新头（head）。\n2. 只有头部可以被删除。\n\n这样的栈好比一堆脏盘子。每个新盘子都放在栈的顶部，而我们清洗的正是最顶部的那个盘子。\n\
  \n## 练习\n\n**C.14.8** 定义结构类型 `Node`，成员包括：`code`、`name`、`grade` 以及一个指向 `Node` 类型结构体的指针。创建一个节点为该类型结构的栈。编写一个程序，显示菜单以执行以下操作：\n\
  \n1. 插入一个学生。程序应读取学生数据并将其存储在一个节点中，该节点成为栈的新头部。\n2. 显示已存储学生的数据。\n3. 显示最后插入的学生的数据。\n\
  4. 删除最后插入的学生。\n5. 显示已存储学生的总数。\n6. 程序退出。\n\n为了简单起见，我选择使用全局指针来处理栈。该指针始终指向栈的头部。\n\n\
  **注释：**\n\n1. 在 `add_stack()` 中，我们传递的是指针而不是结构本身，以避免创建结构的副本并加快函数的执行速度。\n2. 为了在不遍历栈的情况下立即显示存储学生的数量，我们可以移除\
  \ `size_stack()` 函数，并使用一个变量，每次在 `add_stack()` 中插入学生时加 1，每次在 `pop()` 中删除学生时减 1。一旦用户选择该菜单选项，程序只需显示该值即可。这样要简单快捷得多。我添加\
  \ `size_stack()` 是为了向你展示如何遍历栈的节点。\n3. 如果变量 `head` 是在 `main()` 中局部定义的，我们应该将它的地址传递给需要它的函数。例如，`add_stack()`\
  \ 将变为：\n\n```\nadd_stack(&n, &head);\n```\n\n调用它时写成：`add_stack(&n, &head);`。\n\n\
  由于我认为这段代码更复杂（至少对于初学者来说），为了简单起见，我选择将 `head` 声明为全局变量并在需要的地方直接使用。\n\n## 实现队列\n\n在本节中，我们将创建一个\
  \ FIFO（先入先出）队列，正如其名称所示，第一个插入的节点最先被提取。它是链表的一种特殊情况，并具有以下限制：\n\n1. 新节点只能插入到队列的末尾，并成为队列的新尾（tail）。\n\
  2. 只有头部可以被删除。\n\n## 练习\n\n**C.14.9** 定义结构类型 `Node`，成员包括：`code`、`name`、`grade` 以及一个指向\
