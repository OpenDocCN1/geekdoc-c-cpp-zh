  \n\n\n\n\n# C.12.9 编写一个函数，接受一个整数数组作为参数，并使用插入排序算法按升序对其排序。编写一个程序，读取五个整数，将其存储在数组中，并使用该函数进行排序。\n\
  \n**注释：** `for` 循环从第二个元素开始进行比较。在每次迭代中，`temp` 存储当前被检查的元素。`while` 循环将被检查元素左侧且比它大的元素向右移动一位。为了直观展示算法的工作原理，假设数组元素为：7,\
  \ 3, 1, 9, 4。\n\n> *第一次* `for` 循环迭代（`i *= 1` 且 `temp *= arr[1] *= 3`）\n\n> `(j *=\
  \ 1)` *第一次* `while` 循环迭代：7 --> 3 1 9 4\n\n因此，数组转变为：**3** **7** 1 9 4\n\n> *第二次*\
  \ `for` 循环迭代（`i = 2` 且 `temp *= arr[2] *= 1`）\n\n> `(j *= 2)` *第一次* `while` 循环迭代：3\
  \ 7 --> 1 9 4\n\n> `(j *= 1)` *第二次* `while` 循环迭代：3 --> 7 1 9 4\n\n因此，数组转变为：**1**\
  \ **3** **7** 9 4\n\n> *第三次* `for` 循环迭代（`i *= 3` 且 `temp *= arr[3] *= 9`）\n\n> `(j\
  \ *= 3)` 没有发生移动，因为第四个数组元素（即 `arr[3] = 9`）大于“最右侧的元素”（即 `arr[2] = 7`）。\n\n因此，数组保持不变：**1**\
  \ **3** **7** **9** 4\n\n> *第四次* `for` 循环迭代（`i *= 4` 且 `temp *= arr[4] *= 4`）\n\n\
  > `(j *= 4)` *第一次* `while` 循环迭代：1 3 7 9 --> 4\n\n> `(j *= 3)` *第二次* `while` 循环迭代：1\
  \ 3 7 --> 9 4\n\n排序完成，数组转变为：**1** **3** **4** **7** **9**\n\n若要按降序排序数组，我们只需将 `while`\
  \ 语句改为：\n\n为了将“已排序子数组”中比被检查元素元素向右移动一位。\n\n## 冒泡排序算法\n\n冒泡排序算法基于相邻数组元素之间的顺序比较。每个元素都会“泡”上升并存储在合适的位置。例如，假设我们想按升序排序数组。\n\
  \n首先，将最后一个元素与倒数第二个元素进行比较。如果后一个较小，则交换这两个元素，使较小的值“泡”上升。然后，将倒数第二个元素与倒数第三个元素进行比较。由于与之前一样，如果后者较小，则交换元素，使较小的值继续“泡”上升。比较一直持续到数组开头，最终最小值会“泡”到数组顶部，并存储在它的第一个位置。\n\
  \n此过程从第二个元素一直重复到最后一个元素，因此数组的第二次小值会“泡”到顶部并存储在第二个位置。对于数组从第三个元素到最后一个元素的部分重复同样的操作，以此此类推。当没有元素再“泡”到顶部时，算法终止。\n\
  \n若要按降序排序数组，“泡”上升的值是最大值而不是最小值。在下面的程序中，`bubble_sort()` 实现了冒泡排序算法来升序排序数组。\n\n## 练习题\n\
