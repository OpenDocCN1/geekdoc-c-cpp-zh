  \ = 1`。由于 `b` 是 1，`c` 变为 1。结果是，程序显示：`2 1 1`。\n\n### 复合赋值运算符\n\n复合赋值运算符用于通过形式 `exp1\
  \ op= exp2;` 来缩短语句。该语句等同于 `exp1 = exp1 op (exp2)`。注意，编译器出于优先级考虑会将表达式 `exp2` 包在括号中。通常，`op`\
  \ 运算符是算术运算符之一：`+`、`-`、`*`、`%`、`/`，尽管它也可以也可以任何位位运算符：`&`、`^`、`|`、`<<`、`>>`。例如，考虑以下程序：\n\
  \n语句 `a -= 2;` 等同于 `a = a-2 = 1-2 = -1`。\n\n下一条语句等同于 `a = a*(1-b) = -1*(-1) = 1`。注意编译器会将表达式\
  \ `1-b` 包在括号中。\n\n语句 `a += b+3;` 等同于 `a = a+(b+3) = 1+5 = 6`，而下一条语句...\n\n最后，语句\
  \ `a %= b;` 等同于 `a = a%b`。\n\n### 逻辑运算符\n\n逻辑运算符 `!`、`&&` 和 `||` 用于形成逻辑表达式。`!` 是一元的的，而\
  \ `&&` 和 `||` 是二元的。逻辑运算符产生 `true` 或 `false`，正像关系运算符一样。逻辑运算符是左结合的，因此编译器从左到右评估操作数。\n\
  \n### ! 运算符\n\n`!` 非运算符应用于单个操作数。如果 `exp` 的值为非零，则结果为 `false`。否则，结果为 `true`。\n\n###\
  \ && 运算符\n\n`&&` 运算符执行逻辑与。表达式的值仅当两个操作数均为 `true` 时才为 `true`。否则，结果为 `false`。\n\n###\
  \ || 运算符\n\n`||` 运算符执行逻辑或。只要两个操作数之一为 `true`，表达式的值就为 `true`。如果两个操作数都为 `false`，结果则为\
  \ `false`。\n\n\n\n因此，程序的输出为：1 8。\n\n## 练习\n\n### C.4.2 下面程序的输出是什么？\n\n**答案：** 由于\
