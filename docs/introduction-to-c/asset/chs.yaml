  \n### 格式标志 (Format Flags)\n\n格式标志用于指定输出格式。这些标志在 `ios_base` 类中声明，分为两类：独立操作的标志和属于组的标志。独立标志可以相对于其他标志独立开启或关闭。这些标志显示在表\
  \ 3.2 中。\n\nTABLE 3.2 格式标志\n\n| 标志 | 含义 |\n| --- | --- |\n| boolalpha | 使用 true\
  \ 和 false 单词读取/写入布尔值。 |\n| showbase | 在八进制数前加 0，在十六进制数前加 0x。十进制值不加前缀。 |\n| showpoint\
  \ | 为浮点值显示小数点。 |\n| showpos | 在正数值前加 +。 |\n| skipws | 从输入流中读取数据时，丢弃空白字符（即空格、制表符、换行符）。\
  \ |\n| unitbuf | 每次输出操作后都会刷新关联缓冲区。 |\n| uppercase | 以大写显示科学计数法中的 e 和十六进制表示法中的 x。\
  \ |\n\n`ios_base` 类提供了 `setf()` 函数来激活标志。由于 `ostream` 类派自 `ios_base`，我们可以使用 `cout`\
  \ 对象来调用 `setf()`。例如，语句：\n\n```\ncout.setf(ios::showpos);\n```\n设置了 `showpos` 标志。正如我们在第\
  \ 17 章中所学到的，由于这些标志声明在 `ios_base` 类中，我们必须使用类名（或继承它的类）以及作用域运算符 `::`。也就是说，我们必须写 `ios_base::showpos`，而是\
  \ `showpos`。表达式 `ios_base::showpos` 指的是在 `ios_base` 类中声明的 `showpos`常量。\n\n标志会保持激活状态直到被禁用。要禁用标志，可以使用\
  \ `unsetf()` 函数。例如：\n\n```cpp\ncout.unsetf(ios::showpos);\n```\n\n所有标志都对应整数值。C++\
  \ 使用名称 `fmtflags`（通常是 `long` 类型的别名）来存储值。具体来说，每个标志都是一个只有一个位设置为 1 的整数。因此，我们能够使用位运算符\
  \ `|`（我们将在第 4 章中讨论）并在同一个 `setf()` 调用中启用多个标志。\n\n第二类包括如表 3.3 所示的选择性标志。\n\nTABLE 3.3\
  \ 选择性标志\n\n| 标志 | 组别 | 含义 |\n| --- | --- | --- |\n| dec | basefield | 以十进制格式读取/写入整数值。\
  \ |\n| hex |   | 以十六进制格式读取/写入整数值。 |\n| oct |   | 以八进制格式读取/写入整数值。 |\n| fixed | floatfield\
  \ | 以定点计数法写入浮点值。 |\n| scientific |   | 以科学计数法写入浮点值。 |\n| internal | adjustfield\
  \ | 输出被填充到字段宽度。对于数值，在符号位和数字之间插入填充字符。预定义的填充字符是空格。 |\n| left |   | 通过在末尾插入填充字符使输出左对齐。\
  \ |\n| right |   | 在开头插入填充字符使输出右对齐。 |\n\n`ios_base` 类提供了 `setf()` 的第二个重载版本，它接受两个参数并允许同时开启和关闭标志。这第二个版本通常用于处理这些选择性标志。第一个参数指定要激活哪个标志，第二个参数指定要禁用的哪个标志（标志）。例如：\n\
  \n```cpp\ncout.setf(ios::showbase | ios::uppercase, ios::basefield);\n```\n第一个 `setf()`\
  \ 激活了 `showbase` 和 `uppercase` 标志，而第二个禁用了 `basefield` 组标志并激活了 `hex` 标志。因此，值以十六进制显示，程序显示\
  \ `0X64`。\n\n在 C++ 中，浮点值的精度取决于所选的模式。如果选择了 `fixed` 或 `scientific` 模式，精度指定了小数点后的最大数字个数。如果没有选择任何模式，精度指定的是总数字位数。对于所有模式，默认的精度为六位数。要返回默认模式，可以写：\n\
  \n```cpp\ncout.setprecision(6);\n```\n\n### 操纵符 (Manipulators)\n\n比 `setf()` 更方便的格式输出方法是使用操纵符。操纵符声明在\
  \ `std` 命名空间中。表 3.4 显示了最常用的操纵符。\n\n| 操纵符 | 操作 |\n| --- | --- |\n| endl | 向输出中插入换行。与\
  \ `\\n` 的区别在于 `endl` 保证刷新缓冲区。 |\n| ends | 向输出中插入空字符。 |\n| dec | `setf(ios::dec,\
  \ basefield)` |\n| hex | `setf(ios::hex, basefield)` |\n| oct | `setf(ios::oct,\
  \ basefield)` |\n| internal | `setf(ios::internal, adjustfield)` |\n| left | `setf(ios::left,\
  \ adjustfield)` |\n| right | `setf(ios::right, adjustfield)` |\n| fixed | `setf(ios::fixed,\
  \ floatfield)` |\n| scientific | `setf(ios::scientific, floatfield)` |\n| boolalpha\
  \ | `setf(ios::boolalpha)` |\n| noboolalpha | `unsetf(ios::boolalpha)` |\n| showbase\
  \ | `setf(ios::showbase)` |\n| noshowbase | `unsetf(ios::showbase)` |\n| showpoint\
  \ | `setf(ios::showpoint)` |\n| noshowpoint | `unsetf(ios::showpoint)` |\n| showpos\
