  \ One。\n\n## 引入字符串类\n\n为了处理字符串具有更高的灵活性、便利性和安全性，C++ 提供了字符串类。特别是代替字符数组。字符串类定义在 `std`\
  \ 命名空间中。为了使用它，我们需要在程序中包含字符串文件。字符串类提供了一系列方便字符串操作函数，如拷贝字符串、拼接字符串、比较字符串以及自动管理它们占用的内存。让我们看一些使用字符串对象的示例。如你所见，字符串对象被声明为变量而不是字符数组。这些操作的结果是\
  \ `s1` 等于 Test，`s2` 等于 TestMore，`s3` 等于 Test?，而 `s4` 等于 TestTest。这些示例展示了拷贝、添加或比较字符串比使用\
  \ C 风格字符串及相关函数简单得多。例如，看使用最后四个 `if` 比使用 `strcmp()` 简单得多。事实上，正如我们在第 18 章 中将学的，字符串类重载了相应的运算符来支持这些功能。字符串类提供了多个构造函数来创建对象。我们将在第\
  \ 17 章](#chapter17.xhtml_c17) 中讨论构造函数。我使用了最常用的两个。\n\n\n\n\n除了简化字符串操作外，使用字符串对象的巨大优势在于我们不需要担心内存问题。内存的大小会根据需求动态调整，即在程序执行期间。相比之下，对于\
  \ C 风格字符串，数组的大小在编译时就已经确定且无法更改。例如，虽然 `s1` 的初始长度为 0，但在 `s1 = s3` 语句中，它的长度发生了动态变化，以便存储\
  \ `s3`。在 `s2 = s1+s3` 语句中，`s2` 的长度也发生了同样的调整。为了看到与 C 风格字符串的区别，假设 `s1`、`s2` 和 `s3`\
  \ 被声明为数组。那么，等效的操作为：\n\n然而，正如我们所说，使用数组始终存在目标数组（即 `s2`）的长度不足以存储所有字符的风险。例如：\n\n`strcat()`\
  \ 会重写 `s2` 之后的相邻内存，导致程序行为不可预测。另一方面，使用字符串对象时，我们是安全的。内存大小会自动调整，因此没有危险。当然，还有 `strncpy()`\
  \ 和 `strncat()` 函数它们更安全；然而，使用字符串对象要容易得多。正如我们在第 18 章中看到的，字符串类重载了算术运算符（例如 `+` 和 `=`），以简化字符串函数的语法。内存管理是动态的，正如第\
  \ 7 章中对 `vector` 类描述的那样。也就是说，编译器分配比需要的内存，以避免每次添加新字符时都进行连续内存分配。例如，假设顺序添加字符。每次预留一个额外的位置是无效的。此外，如果下一个内存位置被占用，则应该分配一个新块并将旧内容复制到此新位置。为了避免这一切，编译器分配一个比字符串初始大小更的内存块。如果该内存耗尽，编译器将分配新内存来存储现有内容和新字符。`capacity()`\
  \ 函数返回分配内存的大小。\n\n让我们回顾一下读取字符并将其存储在 C 风格字符串中的几种常用方法。\n\n现在让我们看看如何读取字符并将其存储在字符串对象中。\n\
  \n我们可以看到，当我们使用数组时，我们使用 `getline()`，它是 `istream` 类的一个成员函数；而当我们使用字符串对象时，我们使用独立的 `getline()`，它不是类成员。还要注意，此版本没有接受用于指定最大读取字符数的参数，因为正如我们所说的，字符串对象的大小会自动调整以适应字符串。\n\
  \n字符串类包含许多处理字符串的函数。例如，它包含了删除、替换、比较、拷贝全部或部分字符串的函数。同样重要的是，这些函数中的大多数都经过了重载，这样它们就可以同时处理字符串对象和\
  \ C 风格字符串。让我们来看一个例子：\n\n程序读取一个字符串，在它的末尾附加 \"fin\"，显示其长度以及 `a` 的第一个位置。然后，它将所有的 `p`\
  \ 替换为 `w` 并显示新字符串。接着，它将其大小倍增，并将额外的字符设置为它的第一个字符。最后，它删除了前三个字符并显示结果。要访问字符串的字符，我们像使用数组一样使用\
  \ `[]` 运算符。事实上，正如我们在第 18 章中看到的，该运算符在字符串类中被重载了。此外，字符串类还提供了 `at()` 函数，它接受元素的位置作为参数。例如：\n\
  \n与 `[]` 运算符的区别在于 `at()` 会检查索引是否在接受范围内，如果不在，它会抛出一个异常（我们将在第 22 章中讨论异常）。因此，如果你在意安全，请使用\
  \ `at()` 并检查异常。另一方面，如果你确定索引不会超出限制，使用 `[]` 可以获得更高的速度。\n\n此外，字符串类提供了 `c_str()` 函数，它返回指向\
  \ C 风格字符串的指针，该字符串包含了字符串对象的字符。这个函数非常有用，因为可以使用需要 C 风格字符串作为参数的函数。例如：\n\n使用字符串类的另一个优势是字符串对象可以存储在容器（例如\
  \ `vector`）中，而普通的 `char` 数组则不能。\n\n本节并没有涵盖字符串类的所有功能。这只是为了让你了解使用字符串类处理字符串是多么地容易和安全。尽管在大多数情况下它是最佳选择，但你也应该知道如何处理\
  \ C 风格字符串，出于几个原因，例如因为它们被用于许多库函数中，因为你可能需要使用它们，或者你会在别人编写的代码中遇到它们。\n\n注意，C++ 标准库提供了处理所有语言字符集的设施。例如，我们可以写汉字或比较希腊语字符串吗？当然可以，但如何处理不同的国家字符集超出了本书的范围。如果你需要知道，请查阅你的库文档。\n\
