  \n### 函数重定义\n\n正如我们所知的，派生类对象可以使用基类的函数。然而，我们可能需要基类函数在派生类中表现得不同，这意味着让同一个函数具有多种形式（多态性）。因此，特定函数的行为可能取决于调用它的对象。为了实现多态性，我们必须在派生类中重新定义该函数。有两种情况需要探讨：第一种是函数具有相同的签名，第二种是签名不同。\n\
  \n### 相同签名的函数重定义\n\n例如，考虑带有 `Product` 和 `Book` 类的 `C.20.1` 程序。让我们将 `Book` 类中的 `display()`\
  \ 函数名称更改为 `show()` 并编写以下代码：\n\n现在，我们有两个版本的 `show()`，一个在基类中，一个在派生类中。如果我们写：\n\n编译器会检查对象的类型以决定调用两个版本中的哪一个。本质上，当基类函数在派生类中被重定义时，派生类函数会隐藏基类函数。这种现象是合理的，因为正如我们在之前的“作用域与继承”章节中所看到的，如果派生类的成员（内部作用域）与基类的成员（外部作用域）同名，那么派生类的名就会隐藏基类的名。因此，`Book`\
  \ 类的 `show()` 隐藏了 `Product` 类的 `show()`。通过语句 `b.show()`，编译器在 `Book` 的作用域内搜索 `show()`，找到并调用它。\n\
  \n如果如果我们想从派生类调用基类的 `show()`，可以这样做吗？可以，我们只需要使用作用域解析运算符配合基类名。例如：\n\n正如注释所说，如果我们写 `show()`\
  \ 而不是 `Product::show()`，编译器假设调用的是 `Book` 类的 `show()`，导致无限递归。作用域运算符也可以应用于使用对象调用函数的情况。例如：\n\
  \n很好，当使用对象调用函数时这很清楚。但是，当使用指针或引用调用函数时会发生什么？例如：\n\n我现在简要回答；然而，稍后我们在讨论虚函数时还会问这个问题。因为指针的类型是\
  \ `Product*`，尽管它指向一个 `Book` 对象，但调用的 `show()` 是 `Product` 类的。\n\n### 不同签名的函数重定义\n\
  \n现在让我们检查基类函数在派生类中声明不同的情况。例如：\n\n重定义函数会隐藏所有同名的基类函数声明，无论函数签名如何。\n\n\n\n如上一节所述，这并不是函数重载，因为重载函数必须在同一个作用域内定义，而派生类定义了独立的作用域。因此，在类\
  \ `B` 中声明 `show()` 后，我们并没有得到两个 `show()` 的重载版本，而是该声明隐藏了基类 `A` 中相应的声明。特别是，当执行 `b.show();`\
  \ 语句时，编译器会在 `B` 中搜索名称 `show`。一旦找到，它就会停止搜索。由于，由于必须给 `show()` 传递一个参数，编译会失败。我再次强调一下，重要的是理解这一点：编译器会停止搜索，它不会继续在\
  \ `B` 的基类中寻找与调用匹配的另一个 `show()` 版本。同样，在派生类 `C` 中声明 `show()` 也会隐藏基类 `A` 和 `B` 中相应的声明。因此，编译器会显示另外两个错误信息。如前所说，要调用基类中的\
  \ `show()`，我们必须使用作用域运算符和类名。例如，`c.B::show(10);`\n\n那么如果我们想在派生类中拥有基类函数的重载版本呢？我们可以这样做吗？可以，我们使用\
  \ `using` 声明。具体来说，我们使用 `using` 关键字并写出函数名。`using` 声明将函数引入派生类的作用域中，因此这些版本在派生类内部可用。编译器会检查签名以区分它们。例如：\n\
  \n现在，程序成功编译。特别是，我们在类 `C` 的作用域内有三个 `show()` 的重载版本。编译器会检查参数并选择合适的版本。因此，程序显示 Test,\
  \ 10 和 A。请注意，`using` 声明会添加所有同名的函数。例如，如果类 `A` 包含重载版本 `int show(int a, int b) {...}`，那么\
  \ `using` 声明也会将其添加进来。\n\n## 虚函数 (VIRTUAL FUNCTIONS)\n\n所以，我们看到当使用一个对象来调用函数时，调用的是对象所属类的函数。好的，这很清楚。\n\
  \n让我问一个之前问过的相同的问题。假设派生类函数以相同的签名重新定义了基类函数。当我们使用指针和引用调用该函数时会发生什么？例如，再次考虑 C.20.1 程序，用下一个\
  \ `show()` 代替 `display()`。\n\n你认为以下代码会显示什么？\n\n在 `ptr2->show();` 的情况下，你可能会回答由于 `ptr2`\
  \ 指向 `b`，将调用 `Book` 类的 `show()`。不，编译器会检查指针的类型并据此做出决定。因此，由于 `ptr2` 是指向 `Product`\
  \ 类的指针，调用的是该类的 `show()`。如你所见，执行哪个函数的决定是在程序编译时做出的，而且这个决定不会改变。这种选择方法被称为 `静态绑定` (static\
  \ binding)。也使用 `早期绑定` (early binding) 一术语。本质上，函数名与每次调用该函数时将执行的代码的内存地址相关。引用的情况也是如此，即编译器使用静态绑定来选择相应的\
  \ `show()`。与指针一样，选择是基于引用的类型，而不是被引用对象的类型。因此，代码显示：\n\n现在我们来讨论虚函数以及 C++ 最重要的特征之一：动态多态（或称为运行时多态）。如果在基类中将\
  \ `show()` 声明为 `virtual`，结果就会不同。要将其声明为虚函数，我们使用 `virtual` 关键字。例如：\n\n当派生类中的函数以相同的签名重新定义基类的虚函数时，它被称为\
  \ `函数重写` (function overriding)。关于返回类型，通常，派生类中虚函数的返回类型也应该与基类的返回类型相同。严格来说，在不涉及细节的情况下，它应该与函数的类是\
  \ `协变` (covariant) 的。例如，如果基类函数的返回类型指向某个类类型的指针或引用，那么派生类中的虚函数可以返回指向比基类更特化的类型的指针或引用。如果签名相同但返回类型不一致，则派生类函数将无法编译。\n\
  \n注意，如果签名不完全匹配，派生类函数就不会重写基类函数，而是一个隐藏了基类函数的新函数，正如我们在上一节中看到的那样。例如，如果你为派生类函数使用了不同的参数，或者使用了不同的\
  \ `const` 修饰符，那么派生类函数将不再是虚函数，这意味着虚机制将不起作用。我们稍后在遇到 `override` 修饰符时会再次讨论这种情况。\n\n\
  这是运行时多态的关键。当通过引用或指针调用虚函数时，执行函数的选择是基于引用所指的对象或指针所指向的对象的类型。因此，之前的代码显示：\n\n也就是说，我们可以声明指向基类对象的引用或指针，如果它引用或指向一个派生对象，只要该函数是虚函数，就会调用派生对象的函数。例如，考虑一个派生自\
  \ `Shape` 类的层次结构，它包含一个名为 `draw()` 的虚函数。如果我们能声明指向 `Shape` 的引用或指针并能够调用每个类的 `draw()`，那就太好了。多亏了虚函数这个非常棒的概念，我们可以做到这一点。\n\
  \n为了解释虚函数的机制，我们首先应该讨论指针的 `静态` (static) 和 `动态` (dynamic) 类型。每个指针都有一个静态类型（即它的声明类型）和一个动态类型（即它所指向对象的类型）。这些类型可以是相同的，也可以是不同的。例如，`ptr2`\
  \ 的静态类型是 `Product*`，而其动态类型是 `Book*`。静态类型总是不变的，但如果我们改变指针指向其他地方，动态类型就会改变。引用也适用于这一点。例如，在示例\
  \ C.20.5 的代码中，`r` 的静态类型是 `Product&`，当调用 `f(b)` 时，它的动态类型是传递给它的类型，即 `Book&`。运行时多态的魅力源于这些类型。通过虚函数，编译器检查指针或引用的动态类型并决定调用哪个函数。\n\
  \n让我们来看另一个例子：\n\n由于 `p` 指向 `b` 的地址，将调用 `B` 类的 `f()`。注意，如果 `f()` 没有声明为 `virtual`，则将调用\
  \ `A` 类的 `f()`。\n\n声明为虚的类函数在直接或间接派生自该类的类中自动变为虚函数。因此，在 `Book` 类中声明 `show()` 时不需要\
  \ `virtual` 关键字。虽然没有必要，但我倾向于加上它，以便让阅读代码的人再次能够清晰。如果函数在类外定义，则不添加 `virtual` 关键字。它只在函数的声明中添加。\n\
  \n\n\n除了构造函数外，任何非静态函数都可以声明为虚函数（virtual）。构造函数、静态成员函数和函数模板不能是虚函数。友元函数不能声明为虚函数，因为它不是类的一个成员。虚函数必须在首次声明它的类中进行定义，除非如我们在第\
  \ 21 章中所示，它被声明为纯虚函数。请注意，在不需要自己的版本的派生类中，没有必要重新定义它。如果没有定义，则将使用基类中定义的版本。如果派生类属于很长的派生链，则将使用最近定义的版本。\n\
  \n### 动态多态\n\n因此，通过虚函数，关于调用哪个版本的决定并不是在程序编译期间做出的，而是在执行期间做出的。也就是说，通过虚函数，多态是在运行时动态实现的，而不是在编译时实现的。这是因为编译器在编译程序时（我指的是一般情况，而不是之前的代码）不知道引用将引用的对象类型或指针将指向的对象类型。这里有一个类型取决于用户选择的示例：\n\
  \n编译器做的是创建代码，这些代码在程序运行时根据 `ptr` 所指向的对象类型，将 `show()` 绑定到 `Product::show()` 或 `Book::show()`。由于函数是在程序运行时被选择的，这种选择方法被称为*动态绑定*。该也使用*晚绑定*（late\
  \ binding）或*运行时绑定*（runtime binding）。在不涉及实现细节的情况下，编译器处理虚函数的典型方法是每个类创建一个数组（通常称为 `vtbl`），它存储了类虚函数的内存地址。事实上，具有虚函数的对象分配的内存比具有相同函数但声明为非虚函数的等效对象多。当调用虚函数时，编译器检查对象的类型，在对应类的\
  \ `vtbl` 数组中找到函数地址，跳转到该地址并执行在那里找到的代码。\n\n为了确保你理解虚函数与非虚函数之间不同的处理方式，让我们来看另一个示例。当使用指针或引用调用函数时，我们检查该函数是否为虚函数。如果不是，绑定就是静态的，我们查看指针或引用的类型。如果是虚函数，绑定就是动态的，我们查看指针指向的或引用所指的对象的类型。让我们把这一规则应用到程序上。\n\
  \n由于 `f()` 不是虚函数，编译器使用静态绑定来选择调用哪个版本。因为 `r` 的类型是对类 `A` 的引用，所以将调用 `A.f()`。由于 `g()`\
  \ 是虚函数，因此使用了动态绑定。因为 `r` 所引对象 `b` 的类型是类 `B`，将调用 `B.g()`。在派生类中声明 `v()` 为虚函数而在基类中不是没有影响。因此，绑定是静态的，将调用\
  \ `A.v()`。结果是，程序显示：A B A\n\n现在，我们已经讨论了虚函数，让我们总结一下。C++ 支持：\n\n1. 编译时多态（例如，模板）。\n\
  2. 通过虚函数实现的运行时多态。\n\n## 使用 `override` 和 `Final` 饰符\n\nC++11 引入了 `override` 关键字，以防止在派生类中声明虚函数时出错。例如：\n\
  \n`override` 单词被添加到声明的末尾，显式表示该类将重写继承的虚函数。同样，与 `virtual` 关键字一样，在类外的定义添加它是错误的。例如：\n\
  \n使用 `override` 饰符可以保护我们免受潜在疏忽的影响，这些疏忽可能导致难以发现的错误。例如，以下程序显示什么？\n\n程序员忘记在 `A` 中将\
  \ `f()` 声明为虚函数。在 `B` 中将其声明为虚函数的事没有影响。程序成功编译并显示 A。如果 `f()` 被声明为虚函数（这是程序员的真实意图），它将显示\
  \ B。如你所见，这种容易发生的疏忽不仅影响程序的行为，而且在大型应用程序中，它是一个难以发现的错误。\n\n让我们看看 `g()` 的声明。假设你打算在 `B`\
  \ 中重写 `g()`，但你在参数列表中犯了错误，增加了一个额外的参数，或者忘记了添加 `const` 单词。这两个错误都是致命的，因为正如我们所说，派生类函数必须具有完全相同的签名才能重写虚基类函数。编译器不会通知程序员这种不匹配，因为它允许派生类函数与虚基类函数具有不同的签名，尽管它们有相同的名称。它只是假设\
  \ `g()` 和 `g(int)` 是不同的函数并正常编译程序。它不会通知程序员 `B` 中的 `g()` 没有重写 `A` 的虚函数 `g()`。因此，调用了\
  \ `A` 的 `g()`，程序再次显示 A。\n\n使用 `override` 有助于编译器识别此类错误并通知程序员。也就是说，如果我们写道：\n\n在 `f()`\
  \ 的情况下，编译器将显示错误消息，指示 `f()` 被声明为重写基类的虚函数，但 `A` 中没有这样的虚函数。因此，程序员理解 `f()` 的声明中缺少了 `virtual`\
  \ 单词。在 `g()` 的情况下，编译器将显示类似的错误：*B::g() 方法带有 ‘override’ 饰符未重写基类方法*。因此，程序员理解 `B` 中\
  \ `g()` 的声明出了问题。由于 `override` 可以保护我们免受难以检测的潜在错误，从现在起我们在重写虚函数时将使用它。这并不，只需要在声明末尾添加\
  \ `override` 单词；它可能会为我们节省很多麻烦，特别是在复杂的层次结构中。\n\n我们已经看到可以使用 `final` 单词来防止类被用作基类。同样，当我们想要防止在派生类中重写虚函数时，可以使用它。例如：\n\
  \n在以 `Book` 为基类的类中尝试重写 `show()` 会导致编译错误。请注意，在声明中结合 `override` 和 `final` 并不是错误；`final`\
  \ 只表示该函数不允许被进一步重写。在类外的定义中添加 `final` 单词也是错误的。例如：\n\n注意 `override` 和 `final` 并不是保留关键字。例如，你可以将它们作为变量名：\n\
  \n当编译器在代码中遇到它们时，它会检查上下文以确定它们是如何使用的。它们不是保留字是因为在引入它们之前，它们已经作为普通变量名用于现有代码中了。虽然允许将它们作为变量名，最好不要这样做以避免混淆。\n\
  \n### 虚函数的使用\n\n在实际应用中，虚函数的一种非常常见的用法是在接受基类对象引用作为参数的函数中。正如我们熟悉的，我们可以传递基类对象或派生类对象，并使用引用调用虚函数。被调用的虚函数是所传对象的函数。例如：\n\
  \n\n\n\n正如我们所知，允许向 `f()` 传递派生类对象的引用或指针。由于 `draw()` 是虚函数，且 `s` 指向一个 `Circle` 对象，编译器将安排动态绑定到\
  \ `Circle::draw()` 函数。因此，程序显示 `Circle`。为了实现虚函数支持的运行时多态性的强大和灵活性，考虑一个绘制形状的实际应用。我们可以添加任何派生自\
  \ `Shape` 的形状，定义它们自己的 `draw()` 并调用 `f()`。这就是其美丽之处：我们不需要修改 `f()`。尽管如此，`f()` 并不知道实际传递给它的是什么类型的对象，但它调用了正确的\
  \ `draw()`。这意味着，我们可以在不修改现有代码的情况下扩展程序。毫无疑问，虚机制是实现易维护且灵活扩展的应用程序的一种强大技术。\n\n请注意，如果我们传递的是\
  \ `Circle` 对象的指针而不是引用，那么 `Circle::draw()` 函数将再次被调用，当然，代码中需要进行相应的更改。练习 `C.20.4` 和\
  \ `C.20.6` 是类似的示例，展示了虚函数的灵活性。但请注意，如果我们传递一个数组（本质上如你所知，传递的是一个指针），可能会出现问题。我将在最后一节向你展示这样一个例子，类似于我曾经遇到过的一件事。\n\
  \n如果 `draw()` 不是虚函数，程序将显示 `Shape`。如果我们将 `f()` 改为接受一个对象，即我们写道：\n\n```\nvoid f(Shape\
  \ s)\n```\n\n由于 `s` 是一个 `Shape` 对象，函数 `Shape::draw()` 将被调用，程序显示 `Shape`。通过这个例子，我想再次明确：当虚函数通过对象而不是通过指针或引用被调用时，没有特殊处理。也就是说，将调用相应类的函数。在另一个示例中，以下程序的输出是什么？\n\
  \n在每次调用中，都会调用相应类的 `draw()` 函数。因此，程序显示：`Shape Circle`。对象（例如 `sh`）到函数调用的绑定，无论这些函数是虚函数（例如\
  \ `draw()`）还是非虚函数，都是静态的；它发生在程序编译时，取决于取决于对象的类型。\n\n因此，如果我们将 `Circle` 改为：\n\n```\n\
  class Circle : public Shape\n```\n\n并写道：\n```\ncir.sh.draw();\n```\n\n将调用哪个 `draw()`？是\
  \ `Circle` 的还是 `Shape` 的？我不告诉你答案，请你自己寻找。\n\n正如我们所说，如果基类的函数可以在派生类中被重写，我们就将其声明为虚函数。否则，我们不将其变为虚函数，这不仅是为了避免使用额外的内存和处理调用的开销（正如我们之前通过\
  \ `vtbl` 看到的那样），而且为了让阅读类设计的人明确我们的意图并不是让它被重写。\n\n让我们来看另一个虚函数用处的示例。假设我们要管理一组 `Product`\
  \ 和 `Book` 对象集合。我们不能使用普通的数组或 vector 变量来存储对象，因为它的元素类型必须相同。然而，我们可以使用指向 `Product` 对象的指针数组。由于指向\
  \ `Product` 对象的指针也可以指向派生类 `Book` 的对象，我们可以使用这个数组和适当的虚函数按我们所愿管理这两种对象。在一般情况下，得益于虚函数，我们可以使用单一指针数组来管理不同类型的对象。让我们看看程序：\n\
  \n如果 `show()` 没有被声明为虚函数，基类的 `show()` 将始终被调用。现在，调用的 `show()` 取决于指针 `p[i]` 指向的对象类型。或者，与其使用指针数组，我们可以在基类中使用指针的\
  \ vector（例如 `vector<Product*>`）。练习 `C.20.9` 就是这样一个示例。另一种替代方案是使用智能指针 vector（例如 `vector<unique_ptr<Product>>`），正如我们在第\
  \ 24 章中看到的，这样我们就不必担心内存误用（例如内存泄漏）。正如你所猜测的，理解本节中的示例并了解虚函数的行为是非常重要的，以便在你自己的应用程序中利用它们的灵活性。\n\
  \n再次强调，只有当调用的函数是虚函数且通过指针或引用进行调用时，动态绑定和函数的多态行为才会在运行时出现。\n\n### 调用特定的虚函数\n\n由于某些原因我们想要强制调用特定的虚函数，可以使用范围作用符和它的类名来实现。在前面的节的函数重定义部分中，我们已经见过几个关于普通函数的类似示例。例如，假设我们想要调用基类的虚函数：\n\
  \n```\np->f();\n```\n\n通过指针和引用对 `f()` 的两次调用都标识了 `A` 中特定的 `f()`，因此此调用将在编译时静态解析。当然，`b.f()`\
  \ 的调用也是如此。程序显示三次 `A`。\n\n### 虚函数与访问修符\n\n虚函数在派生类中的访问修符可以与基类中的修饰符不同。当我们使用基类指针（或引用）调用虚函数时，基类中的访问修符决定了函数是否可访问，无论指针指向的对象类型为何。如果虚函数在基类中声明为\
  \ `public`，那么无论派生类中如何，都可以通过基类指针访问。例如：\n\n回顾当我们使用对象调用函数时，调用是在编译时解析的。如果 `f()` 是 `private`，则\
  \ `b.f()` 语句将允许。很好，这是正常的，问题是为什么 `p->f()` 是允许的？因为 `f()` 被重写了且我们通过指针调用它，此调用是在运行时解析的。发生的是基类的访问修符被应用于所有的派生类。也就是说，派生类\
  \ `B` 中的 `f()` 没有起任何作用。如果我们把 `A` 中 `f()` 的访问修符从 `public` 改为 `private` 或 `protected`，则\
  \ `p->f()` 将无法编译。\n\n### 虚函数与默认参数\n\n与普通函数类似，虚函数可以接受默认参数。但要小心，当它通过基类指针或引用调用时，使用的默认参数是基类的，即使调用的是派生类的函数。也就是说，派生类函数中的任何默认参数都没有影响；它们将被忽略。例如：\n\
  \n```\nb.f();\n```\n\n`b.f()` 语句是静态解析的，调用了 `B` 类 `f()`，因此使用了它的默认参数，程序显示 `B:20`。意外的结果出现在下次调用\
  \ `r.f()` 中。此调用是动态解析的。尽管调用了派生类 `B` 的 `f()`，使用的却是基类 `A` 的默认值，程序显示 `B:10`。所以我们必须小心，因为我们期望派生函数使用它自己的默认参数值，它却使用的是基类的。为了避免此类可能导致程序执行问题并产生意外结果的情况，不要更改派生类中虚函数的默认值。事实上，最好避免使用默认参数，因为如果你在基类函数中更改了它们，可能会忘记在相应的派生类虚函数中做出相同的更改。\n\
  \n### 虚析构函数\n\n\n\n\n\n析构函数可以是虚函数（virtual）。如果一个类不打算作为基类使用，就没有理由将其声明为虚函数。当然，即使你这样做也不会出现编译错误。然而，它向将要使用该类的人表明，该类并不打算用作基类。但是，如果它可能被用作基类，你就应该将其声明为虚函数。例如，让我们修改\
  \ `Book` 类来理解原因：\n\n当对象被销毁时，调用的是哪个析构函数？是基类的还是派生类的？由于绑定是静态的，调用对应指针类型的析构函数。因此，调用了\
  \ `Product` 的默认析构函数。结果，由于 `Book` 的析构函数没有被调用，指针 `n` 留出的内存将不会释放。情况可能比内存泄漏糟糕得多；标准规定，如果基类析构函数不是虚的，对指向派生对象的基类指针应用\
  \ `delete` 将导致未定义行为。例如，程序可能会崩溃或产生内存泄漏，因为可能存在一个半销毁的对象，其基类部分已销毁，而派生部分仍然存在。为了确保为派生类对象调用正确的析构函数，基类的析构函数必须声明为虚函数。例如：\n\
  \n当我们把基类析构函数变为虚函数时，所有派生类的析构函数也变成了虚函数。因此，绑定变为动态绑定，对应指针指向的对象类型的析构函数将被调用。因此，在我们的示例中，`Book`\
  \ 的析构函数将被调用，释放预留的内存。然后，调用 `Product` 的析构函数。\n\n### 在构造函数和析构函数调用虚函数\n\n正如我们所知，派生对象的基类子对象首先被构造。当其构造函数执行时，派生部分的成员尚未初始化。相反，在销毁派生对象时，当基类子对象的析构函数执行时，派生部分已经被销毁。也就是说，当基类的构造函数和析构函数执行时，对象处于部分状态。问题是，如果我们在基类的构造函数或析构函数内部调用虚函数会发生什么？考虑以下程序：\n\
  \n在回答问题之前，让我们先看看从基类成员函数中调用虚函数会发生什么。`B` 类重写了 `f()`，所以当我们使用 `b` 对象调用 `f()` 时，我们期望调用\
  \ `B` 类的 `f()` 版本，即使对 `f()` 的调用源于基类函数内部。事实上，当调用 `test()` 时，程序输出 B。注意，如果 `f()` 没有声明为虚函数，程序将显示\
  \ A。\n\n现在让我们回答这个问题，看看在基类构造函数内部调用 `f()` 会发生什么。`B` 会再次显示吗？如果调用的是派生类中的版本，很可能导致程序执行出现问题，因为该函数可能会访问尚未初始化的派生部分的成员。因此，为了避免这种危险的情况，当在基类构造函数中调用虚函数时，并且正如我们所说，对象的构造尚未完成，编译器所做的是调用与执行的构造函数相同类中的函数版本。因此，在我们的示例中，程序输出\
  \ A。\n\n关于析构函数，由于子对象的销毁顺序与它们的构造顺序相反，当基类子对象的析构函数执行时，派生部分已经被销毁了。因此，再次调用派生类的成员函数将是危险的。因此，编译器调用了基类的\
  \ `f()`，程序输出 A。总而言，程序输出为：A B A。\n\n总结一下，从构造函数或析构函数内部对虚函数的调用是在编译时解析的，将调用的函数是与执行的构造函数或析构函数处于同一个类中的函数。\n\
  \n### 小心转换\n\n在继续练习之前，我想引起你注意我曾经在某个应用中犯过的一个错误，它给我找了很多麻烦。它是那种让你无法入眠的错误之一；一个线程会在你脑中彻夜运行，处理代码并试图寻找错误。第二天早上，由于一夜的压力，你已经长了几根白发。为了给你一个我所经历的简单例子，请看以下程序：\n\
  \n我的意图是定义一个函数 `f()`，它接受一个基类或派生类对象的数组作为参数，并用它来调用虚函数。听起来不错，为什么不这样做呢？第一次调用 `f()` 没有产生任何问题。第二次调用时，我们知道可以顺利地传递一个派生类的指针。因为\
  \ `show()` 是虚函数，并且正如我们所知，实际传递给 `f()` 的指针，所以将调用的 `show()` 是指针指向的那个 `show()`（例如 `p+i`），即\
  \ `B` 类的 `show()`。很不错，问题在哪里呢？\n\n问题在于，由于 `B` 类的大小比 `A` 大，而 `p+i` 的值增加了 `A` 的大小，当\
  \ `f()` 调用某些 `b` 元素（例如 `b[1]`）的 `show()` 时，`p+i` 不指向它应该指向的 `b` 元素，而是之前的其他地方。因此，对\
