  \ `catch` 块关联，处理内部可能抛出的异常。当从内部块抛出异常时，它将由自己的 `catch` 块处理。如果没有匹配的类型，它将由外部 `try` 块的\
  \ `catch` 块处理。例如，如果在 `f()` 中我们将 `catch` 块中的类型从 `int` 改为 `double`，那么抛出的异常将传递到 `main()`\
  \ 中的外部 `try` 块。\n\n通常情况下，就像普通函数一样，如果我们想修改异常初始参数的值，我们将引用传递 `catch` 块。例如，让我们改变 `f()`\
  \ 的 `catch` 块：\n\n现在，重新抛出异常时传递给 `main()` 的值为 20。\n\n## 异常与内存管理\n\n执行 `throw` 语句时，`throw`\
  \ 到捕获异常的 `catch` 块之间的所有自动变量内存将被释放。如果自动变量是对象，其析构函数将被调用。例如：\n\n`g()` 抛出的 `int` 异常从\
  \ `f()` 传递到 `main()`。调用 `f()` 和 `g()` 时在栈上分配的内存被释放。本该如此；因为它们的执行已经结束，没有理由保留这些内存。因此，`a2`\
  \ 和 `a1` 对象的内存被顺序释放。`exit()` 终止程序。因此，程序显示：\n\n如果我们不是写 `throw 10;` 而是写 `throw 2.3;`，程序将显示什么？现在，异常被\
  \ `f()` 捕获。当它终止时，`a1` 的析构函数被调用。然后，执行在 `main()` 中继续运行 `catch` 块后的语句。因此，程序显示：\n\n\
  释放自动变量的内存没问题，但动态分配内存的释放呢？看下面的示例，你能发现任何问题吗？\n\n\n\n\n\n如果抛出异常，为自动变量 `i` 和 `p` 留的内存将被释放。但请注意，`p`\
  \ 指针指向的内存不会被释放。这意味着我们发生了内存泄漏。解决此问题的方法之一是在 `throw` 之前添加另一个 `delete[] p;`。关键在于，在抛出异常之前释放动态分配的内存是程序员的责任。另一种可以减轻程序员这一责任的方法是使用标准库中的智能指针，正如我们将在第\
  \ 24 章中看到的那样。\n\n### 标准异常\n\n标准库提供了几类异常，供我们在程序中使用。它们存存在于 `std` 命名空间中，并且都派生自 `exception`\
  \ 类。`exception` 类定义在 `exception` 头文件中。例如，以下程序抛出了此类异常：\n\n`what()` 成员函数被声明为虚函数，它返回一个字符串，该字符串取决于实现。它在\
  \ `exception` 类中的声明如下：\n\n如果我们想指定要返回的字符串，可以在派生自 `exception` 的类中重写它，并抛出该类的异常。例如：\n\
  \n正如我们所知，为了处理来自派生类的异常，仍然可以使用带有基类引用的相同 `catch` 块。如果我们想以不同的方式处理它们，只需要在此之前添加一个 `SomeErr`\
  \  `catch` 块。\n\n标准库提供了许多异常类型。在这里，我们只提到其中一些。从 `exception` 类派生出了 `logic_error` 和\
  \ `runtime_error` 类。这些类以及派生自它们的类定义在 `stdexcept` 文件中。从 `logic_error` 类派出了 `domain_error`、`invalid_argument`、`length_error`\
  \ 和 `out_of_range` 类，它们用于处理逻辑错误。简而言之，`domain_error` 用于表示违反函数的有效定义域（例如，尝试计算负数的平方根），`invalid_argument`\
  \ 用于指示意外的参数，`length_error` 用于表示空间不足（例如，如果你在字符串对象中添加的字符超过最大允许长度，则抛出该异常），而 `out_of_range`\
  \ 用于表示超出范围的值（例如，如果你使用越界索引访问 vector 对象，则抛出该异常）。例如，假设我们有一个 `Rectangle` 类。如果在构造函数中传递了错误的维度，我们可以抛出一个\
  \ `out_of_range` 异常，如下：\n\n从 `runtime_error` 类派出了 `range_error`、`overflow_error`\
  \ 和 `underflow_error` 类，它们处理与违反有效值范围或在算术计算中无法表示值（例如由于溢出）相关的错误。有关异常类型的更多信息，请参阅标准库参考文档。\n\
  \n让我们看看 `bad_alloc` 异常，当使用 `new` 和 `new[]` 运算符分配内存失败时（例如由于内存不可），会抛出该异常。`bad_alloc`\
  \ 类定义在 `new` 文件中并生自 `exception`。例如：\n\n如果内存分配失败，将抛出 `bad_alloc` 异常，程序显示相应的消息并终止。标准提供了\
  \ `new` 运算符返回空指针而不创建 `bad_alloc` 异常的能力。在这种情况下，我们如下所示编写代码：\n\n### 处理未捕获的异常\n\n正如我们所说，未捕获的异常默认会导致程序终止。例如，如果为抛出的异常找不到匹配的\
  \ `catch` 块，或者创建异常的函数没有包含在 `try` 块中，就会发生这种情况。如果异常未被捕获，将调用库函数 `terminate()`，它默认会调用\
  \ `abort()` 函数，然后终止程序。标准允许我们更改 `terminate()` 的行为，并使其调用另一个函数而不是 `abort()`。要做到这一点，我们需要使用\
  \ `set_terminate()` 函数。`terminate()` 和 `set_terminate()` 函数声明在 `exception` 文件中。`set_terminate()`\
  \ 的声明如下：\n\n也就是说`set_terminate()` 接受的参数是一个没有参数且返回类型为 `void` 的函数指针。它会返回上一个 terminate\
  \ 处理程序函数的地址（如果有的话）。通常情况下，不建议重写 `terminate()` 的行为，除非你想在程序退出之前做“最后”件事，例如输出一些诊断信息以帮助你发现问题，或向环境返回特定的错误代码以指示失败。请注意，注册的函数在执行完任何所需的任务后应该终止程序。如果它没有这样做并返回给调用者，程序的行为是未定义的。\n\
  \n你可能会想，为什么新的 terminate 函数应该终止程序呢？记住，`set_terminate()` 设计设计用于处理不可恢复的错误。如果没有代码来处理这些错误，程序就不应该恢复正常运行。遗憾的是，它处于某些意外之外的错误状态，这无疑会影响它的运行。因此，我们唯一的选择就是终止它的执行。以下程序注册了一个新的\
  \ terminate 函数，在发生未捕获异常时会写入消息并调用 `abort()`。\n\n由于异常未被捕获，程序调用 `terminate()`，进而调用\
  \ `end_prg()`。`end_prg()` 显示消息，`abort()` 终止程序。\n\n记住，我们可以通过 `catch(...)` 块捕获未知类型的异常。在这种情况下，我们阻止了程序的终止；但我们仍然必须处理异常。\n\
