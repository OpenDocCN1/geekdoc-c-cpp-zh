  \ -1。\n    5. 程序终止。\n\n# 25 命名空间、类型转换运算符和智能指针\n\nDOI: [10.1201/9781003230076-25](https://doi.org/10.1201/9781003230076-25)\n\
  \n在本章中，我们将讨论命名空间及其最重要的特征。接下来，我们将讨论运行时类型识别，并介绍语言提供的运算符，以便比传统的简单类型转换更安全地进行类型转换。然后，我们将描述使用智能指针进行动态内存管理的另一种方法方法。最后，我们将讨论\
  \ `volatile` 限定符。\n\n### 命名空间\n\n我们已经讨论过变量和函数等元素的作用域。例如，我们知道不同函数的局部变量可以使用相同的名称。那么全局作用域的名称呢？对于具有全局作用域的元素（如全局变量），我们它们属于全局命名空间。然而，在大型程序中，代码由许多程序员编写在许多文件中，命名冲突的概率会增加。例如，我们可能在\
  \ `queue.h` 文件中定义了一个名为 `Queue` 的类，而使用的某个库也使用了相同的名称（例如在 `game.h` 文件中）：\n\n编译将由于 `Queue`\
  \ 类的重复定义而失败。当然，如果我们更改类的名称（例如改为 `My_Queue`），问题就解决了。然而，当我们需要使用他人编写的库且选择了相同的名称时，我们无法更改它们。为了避免此类命名冲突，C++\
  \ 提供了使用命名空间的这种优雅机制。\n\n命名空间是一个具有独立作用域的命名区域，我们可以在其中放置程序的元素（例如类、函数、等）。命名空间允许我们将程序元素按逻辑分组，并防止与外部声明的名称发生冲突。\n\
  \n### 创建命名空间\n\n创建命名空间我们使用 **namespace** 关键字。例如：\n\n\n\n\n在命名空间（namespace）内部，我们可以声明我们需要的元素，例如变量、函数声明和定义、模板、类和对象。命名空间可以声明在全局命名空间或另一个命名空间内部，但不能声明在块（例如函数）内部。命名空间定义了它自己的作用域。每个成员的作用域从它的声明点延伸到命名空间的结束。在命名空间内声明的每个名称都带有该命名空间的名称（例如\
  \ `A`）。因此，我们在命名空间中使用的名称不会与其他命名空间或全局命名空间中的相同名称冲突。也就是说，如果我们创建一个包含名为 `var` 变量的 `B`\
  \ 命名空间，并在那里声明一个也名为 `var` 的全局变量，它们之间不会发生名称冲突，即 `A::var`、`B::var` 和全局的 `var` 之间不会冲突。这是命名空间的主要优势，即避免名称冲突。在涉及许多许多员的大型项目中，创建不同的命名空间是常见做法，这样即使选择了相同的名称，也不会引起冲突。\n\
  \n在命名空间内部，我们可以使用命名空间的名称添加新元素。例如，以下语句扩展了命名空间 `A` 的作用域，并在 `A` 的元素中增加了 `g()` 函数的声明：\n\
  \n```cpp\nnamespace A { g(); }\n```\n\n作为另一个示例，我们可以再次使用 `A` 名称并在稍后添加 `f()` 的定义。例如：\n\
  \n```cpp\nnamespace A { void f() {} }\n```\n\n或者，我们可以定义它，就像在类外部定义函数一样：\n\n```cpp\n\
  void A::f() { ... }\n```\n\n由于命名空间定义了它自己的作用域，它的元素在外部是不可可见的。访问它们的一种方法是使用 `::` 作用域运算符。例如：\n\
  \n```cpp\nA::g();\n```\n\n或者，我们可以像接下来看到的，使用 `using` 声明和指令（directives）。\n\n在命名空间内声明的名称在命名空间内部可以不使用作用域运算符进行访问。例如：\n\
  \n```cpp\nnamespace A { g(); } \n```\n\n### 构建命名空间\n\n对命名空间的补充可以在与声明它的不同的文件中进行。总的来说，将元素（例如函数）的声明与其实现区分开是一种良好的做法，这样当有人读取命名空间时，可以快速了解其结构和提供的服务，而必在数页代码中搜索它们。例如，在下面的命名空间中，我们只添加声明：\n\
  \n```cpp\nnamespace Network {\n    void send();\n    void receive();\n}\n```\n\n\
  因此，读者可以快速了解 `Network` 命名空间的结构和目的。事实上，为了更清晰，我倾向于单独声明与命名空间用户构成通信接口的函数。例如：\n\n```cpp\n\
  namespace Network {\n    void send();\n    void receive();\n}\n```\n\n将此类仅包含声明的块放在头文件中是常见做法，然后将其包含在需要它们的代码文件中。代码文件包含函数的定义。此外，为了更好地理解和维护程序，我倾向于将定义拆分为几个块（例如类的定义、函数的定义），并多次使用同一个命名空间，而不是使用几次并在内部放置大块代码。\n\
  \n### using 声明 (using Declarations)\n\n为了避免总是编写命名空间的名称（这可能令人讨厌，而且代码可能会变得更难以阅读，特别是当名称很大时），更方便的方法是使用\
  \ `using` 声明。`using` 声明可以放在全局作用域（如本书示例所示）、命名空间内部或函数内部，甚至可以在语句块内部。让我们来看一个使用相同名称的示例：\n\
  \n```cpp\nnamespace A { int var; }\nusing A::var;\n```\n\n现在，当我们写 `var` 时，我们指的是\
  \ `A::var`。当然，对于 `A` 的其他元素，我们必须加上前缀 `A::`。如果我们从另一个命名空间提供另一个 `var`，编译器将显示 `var` 重复定义的错误信息。如果我们想访问\
  \ `B` 命名空间的 `var`，必须写 `B::var`。正如我们在第 11 章 中看到的，当局部变量与全局变量同名时，局部变量即 `A::var` 会覆盖全局的\
  \ `var`。要引用全局的 `var`，我们只需使用 `::`，因为全局命名空间没有名称。\n\n`using` 声明的名称遵循通常的作用域规则。它从 `using`\
  \ 声明点可见直到包含该声明的块结束。因此，当 `using` 声明在函数内部时，该名称仅在该函数内部可见。如果我们把它放在外面，该名称会被添加到全局命名空间。事实上，这就是我们在本书程序中放置它们的方式。例如：\n\
  \n```cpp\nusing A::f;\n```\n\n在 `using` 声明中，我们只写名称。所以，当我们添加一个函数时，只需写它的名称（例如 `f`）。如果\
  \ `A` 命名空间包含 `f()` 的重载版本，`using` 声明会将声明作用域内的所有版本都加上。注意，如果 `using` 声明在相同作用域添加了与现有函数相同名称和参数列表的，编译器将显示错误信息。\n\
  \n### using 指令 (using Directives)\n\n与 `using` 声明不同，`using` 指令使命名空间的所有元素都可用。因此，我们不需要使用\
  \ `::` 运算符。例如，我们使得整个 `std` 命名空间可用：\n\n```cpp\nusing namespace std;\n```\n\n与 `using`\
  \ 声明不同，如果 `using` 指令的命名空间包含相同的名称，只要这些名称不在指令的作用域内使用，编译器就不会显示错误信息。例如，以下程序正常编译：\n\n\
  ```cpp\nnamespace A { int t; }\nnamespace B { int t; }\nusing namespace A;\nusing\
  \ namespace B;\nint main() { return 0; }\n```\n\n然而，如果我们在指令的作用域内尝试访问共同名称（例如 `t`），编译器将显示错误信息，类似于\
  \ *对 t 的引用是有义的*。也就是说，如果我们移除 `t` 的赋值，程序将无法编译。\n\n这也适用于函数名。如果我们使用多个包含相同函数名（例如 `f`）的\
  \ `using` 指令，其版本都会被加上。如果在相同作用域内声明了与 `using` 指令添加的函数（例如 `g`）相同名称和参数列表的函数，编译器将不会显示错误信息。但是，但如果我们尝试使用该函数，例如写\
  \ `g()`，而不指明指的是哪一个，编译器将发布错误信息。\n\n\n\n\n总结来说，`using` 声明仅使一个名称可用，而 `using` 指令则让所有名称都可用。正如我在第\
  \ 1 章中提到的，如果我不需要多次添加命名空间，我更倾向于使用 `::` 运算符。如果从命名空间中使用许多或仅少数名称，我更倾向于使用单独的 `using`\
  \ 声明，这样阅读代码的人就能看到需要命名空间的哪些元素。如果使用了许多名称，为了代码的方便和简单，我可能会使用 `using` 指令。然而，如果我要使用很多命名空间，我就不会使用它，因为如果可用的名称过多，命名冲突的可能性就会增加。而且即使现在没有冲突，未来新版本的代码也可能发生冲突，因为新版本可能会添加公共名称。\n\
  \n### 结合 using 声明和 using 指令\n\n在命名空间中，允许同时使用 `using` 声明和指令。例如：\n\n现在，如果我们想访问 `A`\
  \ 的 `var` 变量（例如在 `test()` 中），我们可以直接写 `var`，因为 `A` 包含在 `C` 中。出于同样的原因，语句：\n\n```\n\
  使得 `A` 和 `C` 的所有元素可用。\n```\n\n让我们看另一个组合防止冲突的例子。\n\n`using` 声明的优先级高于 `using` 指令，因此我们避免了命名冲突。如果缺少\
  \ `using` 声明，编译器将对歧义显示错误信息，因为它不知道在 `A` 和 `B` 两个类之间选择哪一个。\n\n### 嵌套命名空间\n\n命名空间可以嵌套另一个命名空间中。例如：\n\
  \n如果我们想让 `B` 的所有名称可用，我们写：`using namespace A::B;`\n\n在命名空间内部，适用通常的作用域规则。例如：\n\n如果我们要在嵌套命名空间添加内容，语法是将内部命名空间嵌套在外部命名空间内部。例如：\n\
  \n如果我们这样做并且只写：\n\n```\n\n那么，我们定义了一个名为 `B` 的新命名空间，为了访问 `c`，我们将写 `B::c`。\n```\n\n\
  C++17 为嵌套命名空间提供了另一种更方便、更简单的语法，特别是当内部层级增加时。例如，与其使用：\n\n```\n我们可以写：\n```\n\n### 命名空间别名\n\
  \n为了给命名空间创建别名，我们使用 `=` 运算符。例如，如果为了方便，我们为长名称或嵌套命名空间创建一个别名，我们写：\n\n当同一个命名空间有多个不同的实现时，使用别名很有帮助。例如，如果这个命名空间实现了一个库，而我们想要使用该库的不同版本，我们只需要更改别名的原始值并重新编译程序即可。\n\
  \n### 无命名命名空间\n\nC++ 允许我们跳过名称并创建一个无命名命名空间。无命名命名空间的元素从声明处开始可见，直到包含该声明的块结束（例如，文件末尾）。如果我们在全局空间中声明它，它的元素就像全局变量一样。由于同一个文件中只存在一个无命名命名空间，额外的无命名命名空间声明是第一个空间扩展。例如：\n\
  \n程序显示 11。因为命名空间没有命名，所以我们无法使用 `using` 声明或指令来使它的元素在其他文件中可用。也就是说，无命名命名空间的元素仅在声明它的文件中可见。本质上，当我们想要声明具有内部链接的全局变量或函数时（即将它们的作用域限制在特定文件内），使用无命名命名空间是一种替代方法。例如，而不是写：\n\
  \n```\n\n正如我们在第 11 章中所做的那样，我们创建一个无命名命名空间并将这些声明放在里面。\n```\n\n无命名命名空间中声明的所有名称的链接都是内部的，也就是说它们无法从另一个文件访问。使用\
  \ `static` 声明来实现局部性源于 C 。C++ 建议在相应位置使用无命名命名空间。因为作用域被限制在文件内，我们可以在另一个文件中使用相同的名称而不必担心冲突。例如，如果我们在第二个文件中写：\n\
  \n```\n\n两个 `t` 变量之间将没有冲突。\n```\n每个 `t` 都是不同的且仅在它们自己的文件中访问。如果我们在另一个无命名命名空间中声明这些名称，情况也是一样。两个文件中的无命名命名空间是相互独立的。每个命名空间中声明的名称对于每个文件都是局部的。总结来说，无命名命名空间确保了代码的局部性，从而我们避免了不同文件中命名冲突的可能性。\n\
