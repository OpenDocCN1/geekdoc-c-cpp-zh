  \ `main()`。因此，异常的类型是 `const char*`。`throw` 语句会终止 `check_pswd()`，程序控制将转移到 `main()`。通常情况下，当抛出异常时，实现会*回溯（unwinds）*函数调用栈，将控制权转移到已建立处理此类异常机制的调用函数。由于\
  \ `check_pswd()` 的调用是在 `try` 块内部进行的，程序可以捕获创建的异常。如果调用是在 `try` 块之外，异常将无法被捕获。\n\n程序现在检查是否存在匹配异常异常的\
  \ `catch` 语句。因此，`const char*` 块捕获了该异常并执行其代码。字符串 `\"Error: Short length\\n\"` 被传递给参数\
  \ `msg` 并显示在屏幕上。通过 `continue` 语句，程序继续循环的下一次迭代，用户输入新密码。除了 `continue`，我们也可以使用 `break`\
  \ 或 `return` 来结束程序，或者使用其他方法，例如当用户输入三次无效密码时程序就结束。在每个 `catch` 块中，程序员决定如何处理异常。请注意，如果不存在\
  \ `const char*` 块，异常将由 `catch(…)` 块捕获并执行其代码。如果两者都不存在，程序将终止。\n\n如果密码长度可以接受，`check_pswd()`\
  \ 将检查它是否包含少于三个数字。如果是，它会创建一个类型为 `int` 的异常。然后，`check_pswd()` 终止，`main()` 中的 `int`\
  \ 块捕获该异常。代码变为 10，程序显示相应消息。如果数字数量有效，`check_pswd()` 将检查密码是否包含 !, $, $, 或 # 字符。如果没有，它会创建一个类型为\
  \ `int` 的异常，在 `catch` 块中代码变为 20，程序显示相应消息。与之前一样，`continue` 导致下一次循环迭代。注意，与允许返回一种数据类型的\
  \ `return` 不同，`throw` 可以返回不同的数据类型。\n\n如果密码被接受，`check_pswd()` 不创建异常并返回值 0。我选择让函数返回数值是为了向你们展示，函数既可以创建异常也可以返回结果，这也可以表示它是否执行成功。然后，程序跳过\
  \ `catch` 块并显示密码。程序一直运行到用户输入结束。然后，`break` 语句终止循环。是的，我可以写一个更简单的例子，我只是想向你们展示 `try-catch`\
  \ 块内部的 `break` 和 `continue` 语句按通常方式工作。\n\n这是一个更简单的例子。以下程序显示什么？不要急着看答案，读一下下面的注释，因为我想看确切的结果。\n\
  \n你算 20/7 时用计算器了吗？你是否去过第三章阅读关于精度数字的内容？很好，但没必要，现在听听来自 *Sound* 的 *Can’t escape*（……逃离陷阱）。正如我们所说的，`throw`\
