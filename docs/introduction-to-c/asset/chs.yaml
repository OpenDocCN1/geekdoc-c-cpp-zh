  \ (FUNCTION OBJECTS)\n\n函数对象或称为仿函数（functor）是一个可以应用 `()` 调用语法的对象，类似于函数。为了允许这种语法，类必须通过定义\
  \ `operator()` 函数来重载 `()` 调用运算符。让我们来看一个例子：\n\n尽管 `t` 是一个对象，但我们可以“调用”该对象，就像调用函数一样。由于这种对象的行为像函数，因此它被称为函数对象。表达式\
  \ `t(20)` 会导致 `operator()` 函数的调用，它返回一个整数值。等效表达式是 `t.operator()(20)`。根据我们在第 18 章中看到的重载限制，重载函数必须是类的成员。一个类可以定义许多此类版本，通过其参数的类型或数量来区分。注意，参数列表添加在空\
  \ `()` 之后。\n\n函数对象经常用作 STL 算法的参数。例如，for_each()` 的第三个参数除了函数指针外，还可以是一个仿函数。那么什么时候使用这种对象会很有用呢？在示例\
  \ C.26.1 中，`show()` 只能接受一个代表元素值的参数。然而，在某些应用中，我们可能想向函数传递更多参数。在在这种情况下，我们可以传递一个对象并使用其成员为函数提供这些额外信息。例如，让我们修改\
  \ C.26.1，使得不再显示所有值，而是只显示小于某个值的。\n\n`show()` 只是显示所有值。当用对象作为参数调用 `for_each()` 时，首先调用类的构造函数，此时\
  \ `lim` 等于参数的值，然后通过 `operator()` 显示小于 `lim` 的元素值。也就是说，对于指定范围内的每个元素都会调用一次 `operator()`。因此，我们可以使用不同值的对象（例如\
  \ 6 和 3）配合 `for_each()`。同样注意，我们使用同一个仿函数来比较字符串。我们不需要创建另一个类。因此，程序显示：\n\n这个示例还说明了，使用函数对象而不是普通的函数指针作为参数要灵活且强大得多，因为我们可以使用对象的成员来存储和使用我们需要的任何信息。\n\
