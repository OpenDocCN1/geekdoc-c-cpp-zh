  \ `false`，程序显示 Not bigger。\n\n### 包含指针的对象拷贝\n\n现在让我们看看包含指针的对象拷贝。仔细注意，下面的程序有什么问题？\n\
  \n语句 `t2 = t1;` 在程序运行中引起了问题。让我们为什么。拷贝操作使 `t2.s` 指针指向与 `t1.s` 相同的内存。`t2.s` 预留的内存没有被释放。当程序终止时，会调用\
  \ `t2` 的析构函数，释放 `t2.s` 指向的内存。由于 `t2.s` 和 `t1.s` 指向同一内存，`t1` 的析构函数再次尝试释放该内存。正如我们所知，删除已释放内存的效果是未定义的（例如可能会导致程序崩溃）。\n\
  \n在这种情况下，重载运算符的能力特别有用。具体来说，为了避免危险的情况，我们可以重载 `=` 运算符以定义如何进行拷贝。例如：\n\n现在，通过语句 `t2\
  \ = t1;`（等同于 `t2.operator=(t1)`），首先释放 `t2.s` 分配的内存，这样它就不会被浪费，然后分配新内存来拷贝 `t1.s` 指向的字符串。该函数返回调用者对象，即\
  \ `t2`。因此，程序正常运行并显示 Peter。注意，这段代码对于这个特定的示例是有效的。但是，如果我们写：\n\n\n\n当函数被调用时，`s` 和 `t`\
  \ 指向的共同内存将被释放，因此使用 `t` 来重新分配新内存并对一个不再存在的对象进行拷贝是错误的。那么我们该如何解决这个问题呢？在回答之前，有人可能会问，起初进行这种赋值的意义何在？是的，得对，自赋值是没有意义的，但在某些情况下可能有两个指针（例如\
  \ `*p1 = *p2`），而你无法确定它们是否指向同一个对象。修复此问题的传统方法是在释放内存之前检查是否为自赋值：将调用对象与参数对象进行比较。如果地址相同，函数返回该对象并终止。为什么函数要返回引用呢，它不能直接返回\
  \ `void` 吗？是的，可以，但这样我们就无法在链式表达式中使用 `=` 了，例如 `t1 = t2`。因为 `=` 运算符具有从右到左的结合性，该语句被翻译为：`t1.operator=(t2)`。\n\
  \n当调用 `t2.operator=(t3)` 时，`t2` 指向的内存首先被释放，然后为 `t2` 留出新内存，并将 `t3` 指向的字符串拷贝到其中。函数返回\
  \ `t2` 的引用，它成为下一个参数。因此现在调用了 `t1.operator=(t2)`。同样，`t2` 被拷贝到 `t1`。好了，你可能觉得上述内容很难理解，我们将在下一节分析一个类似的表达式（例如\
  \ `cout << r1 << r2`），你就会理解了。当然，如果你不想支持链式赋值，只需将其声明为 `void` 即可。\n\n另一个问题是，如果我们传递对象本身而不是引用，会产生问题吗？即写入：`t2\
  \ = t1`。当然会产生问题。正如我们所说，语句 `t2 = t1` 被翻译为 `t2.operator=(t1)`。由于 `t1` 是按值传递的，`t` 是\
  \ `t1` 的拷贝。也就是说，`t1` 的值被拷贝到 `t` 的成员中。我们将在第 19 章中遇到拷贝构造函数时学习更多关于这种操作的知识。因此，`s` 指向与\
  \ `t1` 相同的内存地址。但是，当函数终止时，`t` 的析构函数将释放该内存。因此，程序将无法正常运行。所以我们再次看到，传递引用不仅节省了时间和内存，还避免了危险的情况。\n\
  \n自 C++11 以来，如果我们不想定义另一个拷贝函数，可以使用 `=` 语法禁用默认的拷贝函数。例如，我们不被允许 `t2 = t1`；这会导致编译错误。我们将在第\
  \ 19 章中再次看到 `=` 语法。\n\n## 重载限制\n\n大多数运算符都可以像我们在前面的示例中看到那样进行重载。实际上，正如我们在下面看到的看到的，除了某些例外外，重载的运算符不需要是成员函数。然而，它们在使用时存在一些限制：\n\
  \n1. 重载运算符的操作数中至少有一个是用户定义的类型。此规则防止了对基本数据类型的运算符重载。例如，你不能重载 `+` 运算符来返回两个整数的差而不是它们的和。\n\
  2. 你不允许更改运算符的语法。例如，你不允许只用一个操作数使用加法 `+` 运算符。同样，你不能将 `++` 的行为从一元改为二元。特别是对于 `&&` 和\
  \ `||` 运算符，我们从第 4 章知道由于短路求值，第二个操作数并不总是会被。此规则在重载时不适用，也就是说它们被视为普通的二元运算符，两个操作数都会求值。事实上，因为它们是\
  \ `&&`（或 `||`）重载函数的参数，当函数被调用时它们都会被求值，就像普通的函数调用一样。因此，由于程序员所熟悉的短路求值不再有效，最好避免重载它们以跳过潜在的错误。\n\
  3. 你不能更改运算符的优先级和结合性。例如，在表达式 `a*b+c` 中，如果 `a`、`b` 和 `c` 是对象且运算符 `*` 和 `+` 被重载，则会先执行乘法，后执行加法。\n\
  4. 你不允许创建新的运算符符号并对其进行重载。例如，你不允许声明 `operator^^` 函数来表示幂，因为 `^^` 运算符不存在。\n5. 你不允许重载以下运算符：\n\
  6. 大多数运算符可以通过成员函数或非成员函数进行重载。然而，以下运算符只能通过非静态成员函数进行重载：\n7. 在没有限制的情况下，当重载运算符时，为了更好地理解和控制程序，执行与其原始目的相似的函数是有用的。例如，当\
  \ `+` 运算符被重载时，最好执行加法而不是其他操作。同样地，你不应该重载 `&` 取地址运算符。以不同于通常的方式使用它会很奇怪且令人困惑。通常情况下，不常规的运算符用法可能会成为重大的干扰源和潜在的错误源。此外，如果重载运算符的使用并不显而易见，可能使用函数更好，因为函数的名称标明了它的用途并使程序更易读。例如，最好定义一个说明性的函数（如\
  \ `swap`）来交换 `Rect` 对象的尺寸，而不是重载该运算符。通常情况下，重载运算符应该是易于应用、简化编程任务并生成易理解的代码。\n\n## 一元运算符重载示例\n\
