  \n我稍后会告诉你一件曾经发生在我身上的事情。此外，这种做法在调试具有内存问题的程序时对我很有帮助。\n\n与 `new` 和 `new[]` 一样，使用 `delete`\
  \ 和 `delete[]` 会导致相应的运算符函数被调用。例如，让我们看看它们的简单版本：\n\n例如，`delete p;` 语句会导致 `delete(p);`\
  \ 的调用。正如我们在第 17 章 中看到的，如果 `p` 指向用 `new` 分配给对象（例如 `Student`）的内存，则会调用该对象的析构函数；而如果它指向用\
  \ `new[]` 分配给许多对象的内存，`delete[] p;` 会导致从最后一个对象开始调用每个对象的析构函数。也就是说，最后一个元素先销毁，然后是倒数第二个，直到第一个元素。\n\
  \n请注意，内存可以在一个函数中动态分配并在另一个函数中释放，前提是第二个函数可以访问该内存（例如通过返回的指针）。然而，正如我们接下来将看到的，在一个地方分配内存、移动指针并在另一个地方释放内存会增加该内存管理的复杂性，而且也是潜在的内存泄漏或\
  \ bug 根源，因为我们可能会忘记释放内存或多次释放内存。因此，我们应该尝试在同一个函数中分配和释放内存。\n\n正如我提到的，在同一个指针可能在程序的不同部分使用的大型程序中，为了更具安全性和更好地控制程序，我的建议是在释放相应内存时将其赋予\
  \ `nullptr` 值。这里有一个例子，与我曾经遇到过的情况类似。\n\n有一次，我使用了一个包含几千个指向类指针的数组。我将它们初始化为 `nullptr`，并在程序执行期间为其中一些指针分配了内存。到目前为止一切正常。偶尔，内存按随机顺序被释放。之后，程序崩溃了。更糟糕的是，程序是偶尔崩溃，而不是总是崩溃。这是程序员的噩梦，随机故障。在经历了几天的压力和艰苦调试后，我得出结论：崩溃是因为某些指针误用（……还能什么呢？）。以下是有误的代码：\n\
  \n`if` 条件没有让空指针访问类的成员字段。这没问题，但如果一个指针曾经指向内存，而该内存后来被释放了了呢？这样的指针通常被称为*悬挂指针*（dangling\
  \ pointer），因为它曾经指向过一段现在已经释放的内存。例如，假设某些 `arr[i]` 指向的内存被释放了。该条件仍然成立，因为内存被释放这一事实并不意味着\
  \ `arr[i]` 变成了空指针；它可能保留其最后的值。因此，当使用 `arr[i]` 访问成员字段时，`if` 条件为真，程序崩溃了。必须显式分配 `nullptr`\
  \ 值，所以当我在释放内存后添加语句 `arr[i] = nullptr;` 时，问题解决了，我们直接去喝啤酒了。干杯！！！\n\n当然，情况可能会更糟。例如，除了\
  \ `arr[i]` 之外，还有另一个指向相同对象的指针（例如 `q[j]`）。也就是说，在程序的另一个点处有如下代码：\n\n将 `arr[i]` 赋值为 `nullptr`\
  \ 对 `q[j]` 没有影响。因此，我必须在代码中搜索找到 `arr[i]` 和 `q[j]` 对的正确匹配项，并将 `q[j]` 也赋值为 `nullptr`。噩梦，我都不想想它了。如果那时我有\
  \ C++11 的智能指针可用，我本该使用它们并避免许多此类危险情况。当我听到它们时已经太晚了，我早已已经熬了通宵，正如我们听过的 *Jethro Tull*\
  \ 的歌词：“*老到摇滚，年轻到死*（Too old to rock and roll too young to die）”。\n\n### 二维数组的动态分配示例\n\
  \n动态分配的一个典型示例是实现二维数组。让我们使用指向指针的变量来编写这样一个程序；你可能会发现这对以后参考有用，尽管这并不意味着这种方法是最高效的。下一个程序在运行时读取二维数组的维度，为其分配内存，读取值并将其存储在元素中。该程序使用一维动态数组模拟动态二维数组。\n\
  \n程序首先创建一个行指针数组，然后为每个元素创建一个包含 `cols` 个元素的数组。也就是说，每个 `arr[i]` 都是一个指向行 `i` 的指针，包含\
  \ `cols` 个 `double`。我添加该函数的原因是为了记住我们如何传递指向指针的变量，以及我们可以使用数组下标来处理它。正如我所说，上述编程方法不是最高效的。例如，当这种方式分配内存时，元素可能不会像普通声明那样连续存储（例如\
  \ `int arr[100][100]`）。因此，访问它们的速度不够快。我以这种方式编写程序主要是为了教学目的，为了记住使用指针数组以及语法问题。\n\n或者，另一种更简单更高效的技术是使用简单指针并分配所需的内存：\n\
  \n> `double *arr = new double[rows*cols];` 访问任何 i, j 元素时写入 `arr[i*cols+j]`，就像二维数组一样。这样内存的分配和释放变得简单得多。\n\
  \n另外注意，如果第二个维度是已知的（例如 5），我们可以写：\n\n> `double (*arr)[5] = new double[rows][5];` 内存是连续的，我们可以以普通方式访问任何\
  \ i, j 元素，即写入 `arr[i][j]`。如果你想要更简单的语法，可以写：`auto arr = new double[rows][5];`\n\n\
  另一种方法是使用二维 vector，如 C.7.16 练习所示。例如：\n\n不仅它的语法简单，重要的是我们不需要处理与内存管理的问题。vector 类为我们处理了这些，我们不需要担心。正如我们所说的，如何使用指针动态分配和管理内存是有用的，但如果标准库的某种类型满足你的需求，最好选择它。\n\
  \n### 内存泄漏\n\n有人问问既然分配内存会在程序终止时自动返回操作系统，我们还需要释放它吗？在小型程序中可能不是大问题，但对于长时间运行或无限运行的程序（例如嵌入式系统）或在内存有限系统中运行的程序，是的，释放不再使用的内存是关重要的。如果不这样做就会产生内存泄漏，可能会导致程序性能的逐渐下降，甚至导致内存耗尽和应用程序崩溃。\n\
  \n让我们来看内存泄漏的示例：\n\n```\n// 在这个示例中，我们在新分配之前忘记释放第一个内存块。\n// 这是一个内存泄漏，每次调用 f() 时都会发生。\n\
  ```\n\n\n\n另一个非常常见的内存泄漏示例是我们在某处分配了内存，但在另一个应该释放内存的地方忘记了释放它。例如：\n\n当 `g()` 结束时，局部变量\
  \ `p` 会自动销毁，但它所指向的内存不会被自动释放。我们必须通过调用 `delete[] p;` 来显式地释放。正如你所料的，在复杂且大型程序中，当内存会在程序的范围内分配并在另一部分释放时，程序员可能会忘记这样做，从而导致难以察觉的内存泄漏。为了避免此类内存泄漏，请尝试在同一个函数中分配和释放内存。此外，正如我们将在第\
  \ 25 章中将看到的，更安全的做法是使用智能指针。也就是说，如果我们用智能指针代替 `p`，内存将会被自动释放。\n\n另一种常见的内存泄漏情况发生于我们将一个指针赋值给另一个指针时，但忘记了释放该指针原本指向的内存。例如，找到以下程序中的错误并修复它们：\n\
  \n让我们来看看这些问题：\n\n1. 语句 `p1 = p2;` 使 `p1` 和 `p2` 指向同一块内存。语句 `delete[] p1;` 释放了这块内存，因此下一个语句将值赋给了未分配的内存。\n\
  2. 语句 `delete[] p2;` 释放了已经释放的内存。\n3. `p1` 指向的第一块内存从未被释放。\n\n注意，如果在 `p1 = p2;` 之前添加语句\
  \ `delete[] p1;`，程序将正常运行。\n\n还有一个，找到以下程序中的错误并修复它们：\n\n`t->i[0] = 'a'` 或 `t->c[5]\
  \ = 50` 有错吗？显然没有，我们只是赋值了两个整数。循环呢？循环也没有任何问题，它使用数组下标来显示现有值。那么内存释放呢？嗯，这里就是 Bug。首先，我们必须释放为结构体成员分配的内存，然后才是整个结构体的内存，而不是反过来。因此，我们必须将\
  \ `delete t;` 移动到最后。\n\n## 内存管理函数\n\n本节简要讨论经常用于内存管理的 `memcpy()`、`memmove()` 和 `memcmp()`\
  \ 函数。`memcpy()` 用于将任何类型的数据从一个内存区域复制到另一个内存区域。它定义在 `cstring` 中：\n\n`memcpy()` 从 `src`\
  \ 指向的内存复制 `size` 字节到 `dest` 指向的地址。如果源地址和目的地址重叠，其行为是未定义的。例如，以下代码分配了内存并在其中存储了字符串 \"\
  ABCDE\"：\n\n与 `strcpy()` 的主要区别在于，`strcpy()` 在遇到空字符时会停止复制。另一方面，`memcpy()` 在复制完指定的字节数之前不会停止复制。例如，如果我们有：\n\
  \n`memmove()` 与 `memcpy()` 类似，不同之处 `memmove()` 保证即使源内存和目标内存重叠，数据也会被正确复制。由于 `memcpy()`\
  \ 不检查两个内存区域是否重叠，因此它的执行速度比 `memmove()` 快。注意，目标内存的大小至少应该是 `size` 字节。如果不是，额外的字节将将写到未分配的内存中，这意味着现有数据将被覆盖。例如，下一次复制是错误的，因为目标内存的大小为\
  \ 3 字节，而复制的字节数为 6 字节：\n\n例如，以下代码使用 `memcpy()` 将一个数组复制到另一个数组：\n\n`memcmp()` 用于比较存储在一个内存区域中的数据与存储在另一个内存区域的数据。它定义在\
  \ `cstring` 中：\n\n`memcmp()` 比较 `ptr1` 和 `ptr2` 指向的内存区域的 `size` 字节。`memcmp()` 的返回值与\
  \ `strcmp()` 相同。它们的主要区别是，`strcmp()` 在遇到任一字符串中的空字符时停止比较。而 `memcmp()` 仅在比较完 `size`\
  \ 字节后停止比较；它不寻找空字符。例如：\n\n由于 `strcmp()` 在遇到空字符时停止比较，程序显示 Same。相反，`memcmp()` 比较所有字节，程序显示\
  \ Different。\n\n在接下来的练习中，我们可以使用 `vector` 类型并获得更简洁的代码。正如我所说的，我不之所以这样做是为了熟悉使用指针进行动态内存管理。如果你需要使用它们，或者当你遇到他人编写的既有代码时，这种经历将帮助你理解发生了什么、它们是如何被使用的、是否使用得当，并可能修复\
  \ Bug。\n\n## 练习\n\n**C.14.1** 下程序包含错误吗？如果没有，它会显示什么？\n\n**答案：** 一旦分配了内存，`p1` 和 `p2`\
