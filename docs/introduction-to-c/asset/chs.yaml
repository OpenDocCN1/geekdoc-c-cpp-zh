  \ `greater<>`。这些标准函数对象的定义包含在 functional 头文件中。例如：\n\n`greater<int>` 应用了 `>` 运算符来比较元素。因此，程序显示：12\
  \ 8 5 3 1。\n\n## LAMBDA 表达式 (LAMBDA FUNCTIONS)\n\nC++11 引入的最令人兴奋的特性之一是创建 `lambda`\
  \ 函数。Lambda 函数的典型用法是接受函数指针或仿函数作为参数的 STL 函数的参数。正如我们看到的，仿函数比函数指针更强大；然而，需要编写一些代码来支持其功能（例如，定义一个类并重载\
  \ `()` 运算符）。Lambda 表达式或直接称为 lambda 通常比使用仿函数或编写函数是一种更方便的替代方案。特别是，lambda 表达式可以被视为匿名\
  \ `inline` 函数，它直接定义在我们需要使用它的地方。因此，我们不需要定义单独的函数或仿函数。例如，让我们用 lambda 替换 `Filter` 类：\n\
  \n正如我们看到的，我们将 lambda 表达式作为第三个参数传递。程序的输出与之前相同：\n\n让我们解释一下 lambda 表达式的语法。在最简单的形式中，它的定义如下：\n\
  \n参数列表和返回类型是可选部分。lambda 以捕获列表 `[]` 开始。该部分指定要捕获的变量以及是通过引用还是按值捕获。空捕获列表 `[]` 表示不捕获任何内容。在这种情况下，lambda\
  \ 只能通过其参数工作。例如，如果我们在第一次调用 `for_each()` 时没有添加 `i`，将会报错。此外，如果我们尝试在 lambda 内部访问 `j`，编译将失败，因为\
  \ `j` 在捕获列表中。\n\n我在 `[]` 中不同的使用 `i` 和 `j` 是为了展示捕获模式。具体来说，如果 `&` 在变量名前，意味着该变量是通过引用捕获的（例如\
  \ `[&j]`），也就是说 lambda 可以更改它的值。如果只使用名称，则意味着是按值捕获（例如 `[i]`），也就是说传递给函数的是局部变量的拷贝。事实上，为了避免任何混淆，编译器默认不允许更改该拷贝的值。例如，在第一个\
  \ lambda 中写入 `i = 10` 是错误的。注意，允许混合模式并按值捕获某些、按引用捕获另一些（例如 `[i, &j]`）。\n\n如果我们写 `[&]`，意味着作用域内的所有变量都通过引用捕获，而\
  \ `[=]` 意味着所有变量按值捕获。就像普通函数一样，可选的参数列表（例如 `a`）插入在 `()` 中，而 lambda 主体放在 `{}` 中。lambda\
  \ 可以使用包含它的函数之外定义的名称。因此，它可以使用 `cout`。\n\n如果 lambda 没有 `return` 语句，则返回类型为 `void`。否则，返回类型由\
  \ `return` 表达式的类型推导出。如果有多个 `return` 语句，则它们必须返回相同类型的值。或者，可以使用尾随返回类型（例如 `[i]() ->\
  \ int {...}`）。\n\nlambda 表达式的语法支持比这个简单示例更多的选项。实际上，它可能非常复杂。然而，一旦你熟悉了语法细节，你可能会觉得使用\
  \ lambda 作为参数比定义单独的函数或仿函数要舒服得多。\n\n\n\n\n使用 lambda 表达式可能很方便，但也可能更难理解。通常情况下，lambda\
  \ 应该保持简单，以避免混淆。为了让代码更易于读，我们可以为 lambda 表达式命名，以说明其用途，并使其在程序中后续可用。例如：\n\n`auto` 关键字使编译器从\
  \ `=` 的右侧找到 `show_less` 的类型，即一个 lambda 表达式。不详述细节，但知道 lambda 表达式评估为一个函数对象是有好处的。也就是说，当编译器遇到\
  \ lambda 表达式时，它会生成一个类类型，而 lambda 的结果产生一个 `operator()` 函数。因此，`show_less` 的类型就是编译器内部生成的类类型。\n\
  \n当默认行为不符合预期时，lambda 经常被用作 STL 算法的参数。例如，以下代码使用 lambda 表达式按字母降序排列对名称进行排序，然后显示它们。\n\
