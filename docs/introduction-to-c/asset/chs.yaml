  ## 友类 (FRIEND CLASSES)\n\n由于函数可以是某个类的友，类也可以是另一个类的友。友类的函数可以访问该类的所有成员。使用友类的例子是当我们有两个类，并且希望其中一个控制另一个的操作时。例如，我曾经不得不实现一个\
  \ IP 网络管理应用程序。我决定开发一个集中式管理系统，其中 `Net_Mgt` 类代表网络管理员，而 `System` 类代表每个被管理的系统（例如计算机）。因为我希望\
  \ `Net_Mgt` 类访问 `System` 的私有成员，我将 `Net_Mgt` 声明为 `System` 的友。在下面的示例中，`Net_Mgt` 提供了两个设置类型和\
  \ IP 地址的函数。\n\n```cpp\nclass System {\n    int type;\n    string IP_addr;\npublic:\n\
  \    System() : type(0), IP_addr(\"\") {}\n    friend class Net_Mgt;\n};\n\nclass\
  \ Net_Mgt {\npublic:\n    void set_IP(System &s, string addr) {\n        s.IP_addr\
  \ = addr;\n    }\n    inline void display(const System &s) {\n        cout << \"\
  T:\" << s.type << \" IP:\" << s.IP_addr << endl;\n    }\n};\n```\n（注：输入文本在友类部分存在大量重复，已根据文档工程师指令对核心逻辑和示例进行了整合。）\n\
  \n\n\n通常情况下，友元类（friend classes）应该关联密切相关的独立实体。在我们的示例中，`Net_Mgt` 实体并不是 `System` 实体，反亦然，因此我们在第\
  \ 20 章中看到的公继承的 *is-a* 模型并不适用。同样，两者都不可能被视为对方的一部分，因此将其中一个声明在另一个内部是不合适的。`Net_Mgt` 控制\
  \ `System` 状态的事导致了正确的选择：将 `Net_Mgt` 类设置为 `System` 类的友元。\n\n当你选择一个类成为另一个类的友元时，需要小心，因为友元类的所有函数都可以访问其数据。有人可能会问，我们能将类的某些函数声明为友元，而不是整个类吗？可以的，我们将在下一节中看到。\n\
