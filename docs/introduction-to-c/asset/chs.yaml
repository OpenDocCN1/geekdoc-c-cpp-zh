  \n## 27 示例应用\n\nDOI: [10.1201/9781003230076-27](https://doi.org/10.1201/9781003230076-27)\n\
  \n程序的代码可以从几行扩展到数百万行，正如大型商业应用那样。在大型应用程序中，通常做法是让不同的程序员小组承担项目的不同部分。由于每个小组的责任局限于特定的代码文件，整个应用程序的实现、测试、控制和管理将变得更快、更简单。在本章中，我们将简要讨论如何组织程序，并查看一个与通信协议实现相关的简单应用示例。\n\
  \n# 程序结构\n\n有几本书侧重于如何组织程序。在这里，我们只进行非常简短的讨论。首先，我们将应用需求拆分为单独的模块。这种划分有助于项目管理和对程序结构的理解。然后，我们定义不同模块之间的交互、它们的依赖关系以及这些模块如何相互通信。一个通信示例是我们在第\
  \ 8 章中看到的 `callback` 机制。每个模块的服务被映射到编程概念中，如函数和类，这些类定义在相应的代码文件中。\n\n对于每个模块，必须对其目的、提供的服务及其运行方式进行详细描述，以便于其维护、升级和更好的理解。后者在编程团队发生变化（例如增加新成员）时非常重要。每个模块由代码文件组成，每个文件实现该模块提供的服务的子集。每个文件都应该包含关于其所用类型的必要信息。所有文件都是单独编译的，链接器正如我们在第\
  \ 1 章中提到的，将负责链接生成的代码。\n\n对于每个模块，我们选择可能被其他模块共享的函数，并将它们的声明放在头文件中，该头文件代表模块的接口文件。例如，一个模块可以实现为一个库，并提供一个头文件，其中包含将作为与外部通信接口的函数。每个模块的功能和相应的软件任务应该尽可能相互独立，以便不同的程序员小组可以并行工作来实现它们。\n\
  \n至于程序元素，通常做法是将命名空间、`inline` 函数定义、常量、枚举、类型别名、宏、模板、类型和函数的声明放在头文件中，并使用 `#ifndef` 指令防止多次包含，正如我们在第\
  \ 15 章中看到的那样。我们可以使用一个头文件，也可以使用多个文件。变量和函数的定义放在代码文件中。对于 `extern` 变量，许多人倾向于将它们放在头文件中。另一些像我这样的人会将它们放在使用它们的代码文件中，以使其清晰。当放在头文件中时，没有指示它们在哪里被使用。\n\
  \n### 单个头文件\n\n组织包含许多文件的程序的简单方法是将定义（例如函数、类、……）放在使用它们的代码文件中，并将所有的声明放在一个单一头文件中。该头文件被包含在每个代码文件中。按照惯例，头文件的扩展名是\
  \ `.h`。是的，对于小型程序，这种方法可能很方便，因为我们只需要在一个地方搜索和编辑声明。然而，对于大型程序来说，这不是一种高效的方法。一个原因是每当内容更改时，所有代码文件都必须重新编译，这对于大型应用程序来说是非常耗时的。此外，许多程序员对该文件的修改是潜在错误的风险来源。当然，它庞大的体积使得读取、使用、理解和维护等任务变得非常困难。\n\
  \n### 多个头文件\n\n另一种方法是每个代码文件都有自己的头文件。头文件便于阅读它的人快速了解该代码文件实现了程序的哪个部分以及它提供的服务。对于大型程序，这种文件组织方式是最好的方法。它有助于更好地控制、理解和维护程序，将代码文件提供的服务拆分到多个头文件中。如果一个头文件发生变化，只有包含它的代码文件会重新编译。\n\
  \n声明放在头文件中，定义放在相应的代码文件中。多个代码文件使用的公共信息放在头文件中，该头文件被需要的代码文件包含。拥有公共文件的优势是，如果我们需要进行更改，就不需要在不同的文件中查找更改，我们只需要在一个地方进行即可。例如，在多个代码文件中使用的类声明放在头文件中，该头文件被任何使用它的代码文件包含。\n\
  \n## 应用示例\n\n因为在我的工作经验中深度参与了网络协议的开发，所以我决定实现一个简单的协议来向你们展示一个大型应用程序的示例。程序的目的不是为了理解实现的细节，而是为了对面向对象的设计方法以及不同程序文件如何通信有一个直观的概念。此外，如果你决定参与通信协议领域，这个示例将帮助你开始。\n\
  \n\n\n\n# 什么是网络协议？\n\n首先，什么是网络协议？简单来说，它是一组使系统能够通信的规则。协议可以在硬件、软件或两者中实现。通常情况下，它的运行基于国际组织定义的标准。协议的一个示例是著名的\
  \ `Internet Protocol`（`IP`）。它由 `IETF` 组织在 `RFC 791` 标准中规定。协议标准规定了系统之间交换的信息、交换消息的格式、其含义以及消息处理程序等。通常，协议实现的指南是一个有限状态机，它通过状态和事件对协议操作进行建模。\n\
  \n# 协议的实现\n\n让我们描述一下我们将要实现的协议。它是 `ITU-T Q.931` 信令协议的一个过度简化版本。`Q.931` 协议专为 ISDN 网络中通话的建立、维护和释放而设计。当呼叫用户拨打被叫用户的电话号码时，会创建一个名为\
  \ `SETUP` 的消息。`SETUP` 消息通过 ISDN 网络路由到达被叫用户。如果被叫用户接受了通话（例如拿起电话），则一个名为 `CONNECT` 的消息将传回给呼叫用户。被叫用户用\
  \ `CONNECT_ACK` 响应，通话建立程序结束。双方之间的路径上会预留电路以供数据传输。现在，双方可以通信了。如果一方关闭连接（例如挂机），则一个名为\
  \ `RELEASE` 的消息将发送给另一方并释放电路。\n\n应用程序提供了一个菜单选择，并模拟双方之间的消息交换，以建立和释放通话。每条消息都由一个唯一代码标识，并包含特定信息。例如，`SETUP`\
  \ 消息的代码为 5，它包含若干个信息元素，如呼叫用户的电话号码。考虑到面向对象的哲学，我们将每次通话表示为一个对象。每次通话由一个唯一数字标识，命名为 `CRV`（`Call\
  \ Reference Value`，通话引用值）。为了简单起见，我们假设每条消息只包含其代码和 `CRV`。\n\n# 程序结构\n\n包含 `main()`\
  \ 的文件名通常是应用程序的名称，例如 `prtcl.cpp`。我们将程序的功能划分为几个模块。以下每个源文件代表一个模块：\n\n*   `prtcl.cpp`：它包含实现与上层和下层接口的函数。它解析并将收到的消息转发给\
  \ `fsm.cpp`。层的概念在 `Open Systems Interconnection`（`OSI`）模型中进行了描述，这是一个参考模型描述了运行在系统\
  \ A 中的应用程序如何通过网络与运行在系统 B 中的另一个应用程序通信。层可以用软件或硬件实现。例如，下层可能是网卡的驱动程序或网卡本身，而上层可能是提供与另一个系统通信手段的应用程序（例如网络浏览器）。在我们的程序中，上层是一个简单的控制台应用程序，为用户提供了一些选择菜单。\n\
  *   `fsm.cpp`：它包含实现协议有限状态机的函数。每次通话都处于某种状态。例如，当发送 `SETUP` 消息时（即建立通话），通话进入 `CALL_INIT`\
  \ 状态。如果在此状态下收到 `CONNECT` 消息（由被叫用户发送），通话将进入 `ACTIVE` 状态，这意味着通话已建立。当发送 `RELEASE` 消息时（即释放已建立的通话），通话进入\
  \ `RELEASE_INIT` 状态，当收到 `RELEASE_COMPLETE` 消息（由被叫用户发送）时，通话被释放。\n*   `send.cpp`：它包含创建消息并将其发送到下层的函数。此外，在这里我们通过发送\
  \ `CONNECT` 和 `RELEASE_COMPLETE` 响应来模拟被叫方。\n\n# 头文件与类\n\n正如我们所说，我们将许多代码文件中使用的公共信息放在一个头文件中。让我们将其命名为\
  \ `general.h`。为了避免重复包含，我们使用 `#ifndef` 指令。\n\n采用面向对象的方法，让每次通话都由相应的对象表示是合理的。在我们的示例中，每次通话都由\
  \ `Call` 类的对象表示。此外，增加另一个类来管理通话可以简化设计。在我们的示例中，`Prtcl` 类管理通话，并提供与外部世界（与上层和下层）通信的函数。为了存储通话，我们使用\
  \ `vector`。让我们看看 `prtcl.cpp`。\n\n# 消息处理\n\n当接收到来自上层的消息时，会调用 `handle_up_msg()`。在我们的示例中，上层对应于应用程序菜单，它提供了一些可以执行的操作。例如，如果用户选择设置通话选项，就会创建一个新对象来管理通话，并应该向被叫用户发送\
  \ `SETUP` 消息。在实际应用程序中，这条消息是在呼叫用户发起与被叫用户的通信时（例如拨号）时创建的，然后网卡将其传输到物理介质（例如光纤），消息穿越 ISDN\
  \ 网络到达目的地。\n\n当接收到来自下层的消息时，会调用 `handle_low_msg()`。例如，在实际应用程序中，消息是从网卡接收的，传递给卡的驱动程序，驱动程序将其转发给应用程序处理。在我们的示例中，消息包含在数组中。在实际应用程序中，由于\
  \ `handle_low_msg()` 和 `handle_up_msg()` 是异步调用的且共享资源，我将它们放在两个线程中并使用信号量进行同步。STL 提供了多线程编程的类。将线程视为与主程序并行执行的独立程序。在本书中我们不讨论线程，只是提供一些提示，以防以后涉及类似的内容。\n\
  \n接下来的文件是 `fsm.cpp` 和 `fsm.h`。这些文件实现了协议的状态机。例如，当在 `IDLE` 状态下收到 `SETUP` 消息时，通话状态变为\
  \ `CALL_INIT`，并将消息转发给 `send.cpp` 进行传输。当通话处于 `CALL_INIT` 状态且收到 `CONNECT` 消息时，状态变为\
  \ `ACTIVE`，这意味着通话已建立。要释放通话，通话状态从 `ACTIVE` 变为 `RELEASE_INIT`，并将 `RELEASE` 消息转发给 `send.cpp`\
  \ 进行传输。当收到 `RELEASE_COMPLETE` 消息时，通话被释放，相应的对象从 vector 中删除。为了简单，我使用了 `switch` 语句。然而，我通常的选择是使用函数指针数组，如第\
  \ 8 章相应章节的示例所示，以提高性能。\n\n下一个文件是 `send.cpp`。每条消息根据协议规范创建并传递给下层。这个下层可能是网卡的驱动程序，驱动程序将消息转发给网卡以便在网络中传输。\n\
  \n\n\n\n如果你被分配去实现一个网络协议，这里有一些建议。假设你正在实现 A 端。你创建并向 B 端发送消息。问题是，你如何验证你的代码能够正确处理了预期的从\
  \ B 端接收的响应呢？如果你能在市场上找到一个可以模拟 B 端的应用程序，那就很好，获取它并使用它来测试你的代码。但如果你找不到的话呢？例如，我曾参与过一个协议的开发，其中\
  \ B 端是一个无线网络的交换节点，而我找不到任何可以模拟其运行的应用程序。我以前工作的那家公司很小，负担不起购买一个真实节点的费用。那么，我是怎么做的？\n\n\
  我做了你刚才看到的那样。即，我定义了 `LOOPBACK_MODE` 宏，并在同一个应用程序中添加了模拟 B 端的代码。结果，我成功在去客户现场交付软件之前，在我的办公室本地测试了大部分代码并修复了错误。当然，当协议集成到客户的网络平台时，其操作经过了彻底的测试，但大部分测试已经完成了。因此，得益于回环测试，集成阶段比预期提前完成，为公司节省了时间和金钱。供你参考，客户是一家网络设备（如交换机）制造商，他们正在寻找能够模拟许多用户行为（例如并行建立数千个通话并发送数据）的系统，以便在卖给网络运营商之前评估其设备的性能。\n\
  \n在另一个应用中，我在另一个系统中实现了模拟 B 端的程序，并使用网络服务（例如 sockets）与该系统通信并测试 A 端的实现。当然，对于这两种方法，模拟代码都应该格外小心编写，因为如果其中包含错误，将导致你得出错误的结论，认为\
  \ A 端代码写得不对。由于这个原因，B 模拟器的代码应该分步编写，首先支持一些基础测试，逐渐增加更多功能以支持更复杂的测试。\n\n到目前，我们所有的程序都由单个源文件组成。我们如何创建一个由多个文件组成的程序呢？这取决于你使用的编译器。例如，我正在使用的\
  \ `Microsoft Visual Studio` 集成开发环境（IDE）提供了类似于 `File->New->Project` 的菜单选项来创建程序，并使用\
  \ `Project->Add_New_Item` 来添加文件。源文件可以单独编译，也可以通过 `Build` 命令一起编译。运行程序的示例如下：\n\n# 结语\n\
