  \ 6`。\n\n因此，前三次迭代计算了 1 × 2 × 3 的乘积。同样，后续迭代计算了输入数字的阶乘。一个合理的问题是，我们如何计算较大数字的阶乘？为了让你有一个概念，对于无法存储在变量中的较大阶乘，思路是像我们在学校学的那样，逐位地进行乘法，并将每个结果的位存储在数组中。\n\
