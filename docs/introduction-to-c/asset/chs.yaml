  \ 100 个字符的字符串并使用该函数将它们存储到动态分配的内存中。\n\n**注释：** 第一个循环将 `str1` 指向的字符串字符复制到 `fin` 指向的内存。同样，下一个循环添加第二个字符串的字符。注意，我们可以使用\
  \ `for` 循环代替 `while` 循环。例如：\n\n一个带有单循环的更复杂的解决方案如何？\n\n这是另一个我认为的糟糕编码风格的例子。别忘记我的建议。写代码时考虑到简单性。\n\
