  \ 语句\n\n当我们需要将一个表达式的值与一系列值进行比较并分别处理每种情况时，`switch` 语句可以作为 `if-else-if` 系列的替代方案。在最常见的形式（或至少是我喜欢的）中，`switch`\
  \ 语句的语法如下：\n\n从风格上说，写 `switch` 语句有几种。最流行是将语句放在 `case` 标签下方，并将 `break` 语句缩进一段或与语句对齐。我的倾向是让每个\
  \ `break` 与 `case` 标签对齐，并在每个 `case` 和其之前的 `break` 之间留一个空格。\n\n表达式必须是整类型（例如整数变量或表达式），或者是提供到整类型无歧转换的类类型，且所有\
  \ `constant_1, …, constant_n` 的值必须是不同值的整数常量表达式（例如，30 是常量表达式，`30+40` 也是）。也就是说，你不允许写：\n\
  \n自然地，任何 `constant_` 必须与表达式的类型相同，或者可以转换为该类型。`case` 的顺序并不重要。当执行 `switch` 语句时，表达式的值将与每个\
  \ `case` 常量进行比较。如果找到匹配项，将执行相应 `case` 的语句组，剩余的 case 将不再测试。如果没有找到匹配项，将执行 `default`\
  \ 情况的语句。在任何情况下，`break` 语句都会终止 `switch` 的执行，程序继续执行 `switch` 之后的下一个语句。我们将在第 6 章中详细讨论\
  \ `break` 语句。`switch` 语句可以嵌套，`case` 或 `default` 子与外层的 `switch` 关联。\n\n例如，以下程序读取一个整数，如果是\
  \ 1，则输出 One；如果是 2，则输出 Two；否则输出 Other。在任何情况下，`break` 语句都会终止 `switch`，程序输出 End。\n\n\
  注意，`default` 情况是可选的；它也可以出现在 case 列表的任何位置，并在没有匹配项时执行。如果存在，我的建议是始终将其放在末尾以使其逻辑清晰。如果它缺失且没有匹配的\
  \ case，则不会发生任何操作。\n\n让我们为 `default` 情况加个括号。通常，它被用于报告一种“不可能”的情况，即不应该发生的情况。有一次，我选择输出消息\
  \ *Panic: Wish you weren’t here*，这是在引用*平民旅乐队*的经典歌曲。正如你可能猜到的，这种错误情况在测试期间从未出现过。另一种，C++17\
  \ 提供了 `[[fallthrough]]` 属性，可以用于告知读者这种预期的行为，并通知编译器不要在 `case` 标签后在没有 `break` 语句的情况下发出警告。例如，在之前的程序中，我们在本该放置\
  \ `break` 语句的相同位置添加它。\n\n如果我们想在多个 case 中执行同一块语句，可以将它们合并在一起。例如：\n\n\n\n\n\n例如，以下程序读取一个代表月份的整数（1\
  \ 代表 1 月，12 代表 12 月）并显示天数：\n\n### 在 Switch 内部声明变量\n\n正如我们所说，当执行匹配的 `case` 代码时，该标签之前的代码会被忽略。问题是，如果在这段代码中声明了变量会怎样？例如：\n\
  \n编译器不会编译这段代码。原因是，如果执行的是第二个 `case` 的代码而不是第一个 `case` 的代码，那么 `i` 将使用一个未初始化的值，而不是程序员可能预期的值\
  \ `10`。为了防止这种情况，编译器会显示错误信息，告知程序员这种初始化是不允许的。如果 `i` 没有被初始化（像 `j` 那样），则代码可以成功编译。如果我们想在某个特定的\
  \ `case` 中声明并使用变量，可以使用大括号定义一个块并将声明放在其中。变量的作用域被限制在块内部。例如：\n\n这段代码无法编译，因为 `i` 仅在块内可见。\n\
  \n与 `if` 语句一样，C++17 了一个了一个新版本的 `switch`，允许我们在 `switch` 内部添加初始化子句，然后测试条件。这种语法类似于：\n\
  \n例如：\n\n由于 `a` 变为 `10`，代码输出 One。`a` 的作用域被限制在 `switch` 块中。与新的 `if` 版本一样，这种简洁的语法可以用于初始化被测试的变量并将其作用域限制在块内。\n\
  \n### switch 对比 if\n\n`switch` 语句的主要缺点是我们仅对对等性进行测试，即测试表达式的值是否匹配其中一个 `case` 常量。相反，我们可以使用\
  \ `if` 测试任何种的条件。此外，`case` 常量仅限于整数，且表达式必须仅为整数变量或表达式。由于字符被视为小整数，因此可以使用字符，但不允许使用浮点数和字符串。另一方面，如果被测试的\
  \ `if` 条件数量很大，那么使用 `switch` 可能更合适，以便使代码更易于读和维护。例如，`switch` 语句的一个典型用法是处理来自大型选项菜单的用户选择。此外，`switch`\
  \ 可能会比长长的 `if` 条件列表更快，因为编译器可能在编译时生成一个由 `case` 值索引的跳转表，并在程序运行时立即找到匹配的 `case`。这可能比\
  \ `if` 列表更快，在后者，每个 `if` 条件都必须按顺序求值以到达匹配项。\n\n## 练习题\n\nC.5.14 编写一个模拟物理计算器的程序。该程序读取一个算术运算符号和两个整数，并显示运算结果。\n\
