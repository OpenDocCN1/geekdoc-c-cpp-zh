  \n现在，表达式 `5+a1;` 被翻译为 `operator+(5, a1);` 让我们定义它：\n\n\n\n\n这正确吗？不，因为 `t` 成员是私有的。我们在上一章中学习了什么？非成员函数如何访问类的私有成员？我们将其声明为\
  \ `friend`。让我们来看程序：\n\n注意，没有必要将该函数声明为 `friend`。我们可以将它的定义改为：\n\n```cpp\n我们只是改变了操作数的顺序，以便调用类成员。通常情况下，当一个函数与类相关联时，我更倾向于将其声明为\
  \ `friend`，即使它没有访问私有成员，这样做以明确这种关联关系。此外，如果以后需要访问私有成员，你只需要更改函数的定义，而不需要更改类的声明。\n\n\
  所以请记住，当我们想要重载一个第一个操作数是某些基本类型（例如 `int`）的运算符时，重载后的函数不能是类的成员。如果我们希望该函数能够访问类的私有成员，我们就将其声明为\
  \ `friend`。\n\n### 重载 `<<` 运算符\n\n现在你已经看到了一些运算符重载的示例，你就可以理解你在第 3 章中读到的内容（是的，这路回得有点远）了：`<<`\
  \ 和 `>>` 移位运算符分别被重载用于输出和输入数据。例如，`cout` 是 `ostream` 类的一个对象，它包含了针对每种基本类型重载的 `operator<<`\
  \ 函数。也就是说，有一个带有 `int` 参数的定义，一个带有 `double` 的，一个带有 `char*` 的，以此此类推。例如，如果我们写：\n\n`cout\
  \ << n;`\n\n`cout.operator<<(int)` 函数被调用，它负责显示该整数。\n\n让我们看看如何将 `cout` 用于自定义类型，例如\
  \ `Rect`。显示类值的典型方法是定义一个公共的 `show()` 函数并调用它。问题是，我们能否不写 `show()`，而是编写类似这样的代码并显示它们的值？\n\
  \n可以的，前提是 `<<` 运算符被重载了。事实上，重载 `<<` 并与 `cout` 对象配合使用显示对象的值是非常常见的。看看它是如何工作的。由于左操作数是\
  \ `ostream` 类的对象，而右操作数是 `Rect` 类的对象，我们必须定义一个接受这两个类型作为参数的函数。该函数应该是 `Rect` 类的 `friend`\
  \ 吗？由于函数必须访问私有成员才能显示它们的值，所以，它应该是 `friend`。让我们来看程序：\n\n让我问你，对 `out` 的引用可以是 `const`\
  \ 吗？不可以，因为向 `out` 写入内容会改变它的状态。注意参数类型是引用，因为我们不能拷贝 `ostream` 对象。通常，第二个参数被声明为 `const`\
  \ 引用不仅是为了避免拷贝参数，还因为函数没有改变其数据。除了 `cout`，我们还可以向函数传递其他 `ostream` 对象（或如我们在第 20 章中看到的派生类）。例如，`cerr`\
  \ 默认将输出重定向到屏幕。由于 `cerr` 可能被重定向，输出可以发送到文件。我们还可以传递一个 `ofstream` 对象并将输出重指向文件。因此我们看到，取决于传递的\
  \ `ostream` 对象的类型，我们可以使用 `operator<<` 函数将输出重指向屏幕或文件。\n\n另一个问题，假设对象 `r1` 和 `r2` 已经声明，我们可以使用上面的函数并写道：\n\
  \n```cpp\ncout << r1 << r2;\n```\n\n为了回答这个问题，我们分析一下该语句的各个。语句从左到右执行，也就是说，它等同于：`(cout\
  \ << r1) << r2;`\n\n因此，`cout << r1`（即调用 `operator<<(cout, r1)`）将首先执行。很好，它返回了什么？什么都没有，所以我们不能继续执行\
  \ `<< r2` 部分。返回类型应该是什么？它必须是 `r1` 左侧的类型。具体来说，它应该是 `ostream` 对象的引用，这样语句的执行才能继续。因此，我们将函数定义改为：\n\
  \n```cpp\nostream& operator<<(ostream &out, Rect &r) {\n    // ... 显示 r 的代码 ...\n\
  \    return out;\n}\n```\n因为传递的是引用，每次调用函数时，它总是返回传递给它的对象，即 `cout`。现在，语句 `cout <<\
  \ r1 << r2;` 正常运行。具体来说，第一部分 `cout << r1` 显示了 `r1` 的尺寸，并被返回值替换，即 `cout`。所以，原始语句变成了\
  \ `cout << r2` 并显示了 `r2` 的尺寸。\n\n实际上，这就是 `ostream` 中定义的用于各种基本数据类型的 `<<` 重载函数的工作方式。特别是，它们返回\
  \ `ostream` 的引用。例如，显示整数的原型类似于：\n\n```cpp\nostream& operator<<(ostream &out, int\
  \ n) {\n    // ... 显示 n 代码 ...\n    return out;\n}\n```\n因此，`<<` 运算符可以在这样的语句中连续使用：\n\
  ```cpp\ncout << a << b << c;\n```\n表达式 `cout << a` 触发了对 `cout.operator<<(int)` 的调用，它显示\
  \ `a` 的值并返回调用对象的引用，即 `cout`。因此，原始语句变为：`cout << ' ' << b;`，我们依此继续。\n\n当然，我们可以像通常做的那样格式化输出。例如，写道：\n\
  \n```cpp\ncout << a << \" \" << b;\n```\n当编译器遇到字符串作为右操作数时，它使用带有 `const char*` 参数的\
  \ `operator<<` 对应 `ostream` 定义来显示它；而当它遇到 `Rect` 对象作为右操作数时，它使用我们看到的那个定义。由于两个定义都返回\
  \ `cout` 的引用，语句的每个部分都被 `cout` 替换，语句的执行没有任何问题地进行。\n\n### 重载 `>>` 运算符\n\n为了读取值，`cin`\
  \ 是 `istream` 类的一个对象，它包含了针对每个基本类型重载的 `operator>>` 函数。它的原型类似于：\n\n```cpp\nistream&\
  \ operator>>(istream &in, int &n) {\n    // ... 读取代码 ...\n    return in;\n}\n```\n\
  其中 `>>` 运算符可以在这样的语句中连续使用：\n```cpp\ncin >> a >> b;\n```\n表达式 `cin >> a` 触发了对 `cin.operator>>(int&)`\
  \ 的调用，它读取一个整数值，存入 `a` 并返回调用对象的引用，即 `cin`。由于参数是引用，`cin` 可能会改变变量的值。因此，原始语句变为 `cin\
  \ >> b;` 并读取下一个值。\n\n让我们来看 `>>` 运算符的重载示例，用于读取并存储值到 `Rect` 对象中：\n\n```cpp\nistream&\
  \ operator>>(istream &in, Rect &r) {\n    // ... 读取 r 的代码 ...\n    return in;\n\
  }\n```\n第一个参数是 `istream` 的引用，而第二个参数是要存储值的对象的引用。因为对象的状态会改变，引用不能是 `const`。\n与 `<<`\
  \ 情况类似，该函数通常被定义为返回 `istream`，这样它就可以在语句中连续使用：\n\n```cpp\ncin >> r;\n```\n正如我们所说的，当我们重载运算符时，应该尽量让它接近其原始用途。嗯，`<<`\
  \ 和 `>>` 是这一建议的例外，因为它们作为移位运算符的原始用途与重载后的用法并没有相似之处。\n\n## 总结 ……\n\n二进制运算符可以通过接受一个参数的非静态类成员函数或接受两个参数的非成员函数来重载。也就是说，对于一个二进制运算符，假设是\
  \ `$`，表达式 `a$b` 被解释为 `a.operator$(b);` 或 `operator$(a, b);`。例如，如果我们想重载 `+` 运算符来相加\
  \ `Rect` 对象，可以在 `Rect` 类中声明函数：\n\n```cpp\nRect operator+(const Rect &r) const;\n\
  ```\n或者一个非成员函数。例如：\n\n```cpp\nRect operator+(const Rect &r1, const Rect &r2);\n\
  ```\n如果需要访问私有成员，它也可以被声明为 `friend`。编译器检查函数的声明方式，并相应地翻译语句。例如：\n\n```cpp\nRect r3 =\
  \ r1 + r2;\n```\n正如我所说的，因为我想明确该函数与类相关联，我更倾向于将其声明为成员。如果它不能声明为成员，那么你就得求助于非成员函数的解决方案，并决定是否成为类的\
  \ `friend`。并且不要忘记，如果函数是成员，左操作数必须是一个对象。如果两个函数都定义了，编译器将选择适当的一个一个。例如：\n\n```cpp\nRect\
  \ r3 = r1 + r2;\n```\n\n\n\n\n\n一元运算符可以通过不接受任何参数的非静态类成员函数，或者可以通过接受一个参数的非成员函数来重载。也就是说，对于一个一元运算符（例如\
  \ `$`），表达式 `$a` 被解释为 `a.operator$();` 或 `operator$(a);`。如果这两个函数都定义了，编译器将选择恰合适的一个。对于后置运算符，表达式\
  \ `a$` 被解释为 `a.operator$(int);` 或 `operator$(a, int);`。\n\n正如我们所说，你不允许更改运算符的语法。例如：\n\
  \n关于类的设计，我们应该考虑是否要重载运算符。通常，如果重载运算符可以简化操作并让类的使用变得更简单、更安全，就这样做；否则不要这样做。我认为这是最重要的准则。常见的候选运算符有：\n\
  \n1. 如果类支持输入/输出操作，那么重载 `<<` 和 `>>` 运算符是有意义的。\n2. 如果类支持相等性测试，那么重载 `==` 和 `!=` 运算符是有意义的。\n\
  3. 如果类支持比较测试，那么重载关系运算符（例如 `<`）是有意义的。\n4. 如果重载了算术运算符（例如 `+`）或位运算符，那么重载对应的复合运算符（例如\
  \ `+=`）是有意义的，以便为类的用户提供他们期的选择。\n5. 函数返回类型的良好实践是与运算符通常产生的结果类型兼容，这样函数的使用就符合运算符的典型用法。例如，重载逻辑运算符和关系运算符的函数返回类型应为\
  \ `bool`；对于算术运算符（例如 `+`），返回类型应为该类的类型；对于赋值运算符（例如 `=`, `+=`），返回类型应为引用（例如 `this` 的引用，或者如果函数定义为非成员，则为第一个参数的引用），这样我们就可以更大的链式表达式中使用赋值表达式的结果。至于参数，对于通常不修改操作数的运算符（例如关系运算符），它们通常被定义为\
  \ `const` 引用，以避免复制参数并防止被修改。\n\n在继续练习之前，我想指出，重载主要适用于算术运算符和关系运算符，但不限于这些运算符。例如，重载 `[]`、`<<`\
  \ 和 `>>` 运算符非常常见。此外，重载 `()` 调用运算符并创建函数对象也非常常见。你将在第 26 章中看到此类对象的示例。\n\n## 练习题\n\n\
