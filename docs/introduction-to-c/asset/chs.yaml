  \ `1` 到 `n` 的整数的积，即 `1×2×3×…n`。`0` 的阶乘为 `1 (0!=1)`。编写一个程序读取正整数并使用该函数显示其阶乘。由于阶乘增长迅速，并可能很快超过大类型的容量，请勿输入大整数。\n\
  \n**注释：** 注意，对于较大的 `num` 值，对 `fact()` 的调用会增加；因此，计算其阶乘的时间随之增加。在这种情况下，`C.6.3` 中 `for`\
  \ 循环的替代方案计算阶乘的速度更快。\n\n### C.11.32 编写一个递归函数，接受整数（例如 `N`）作为参数并返回斐波那契序列的第 $N^{th}$\
  \ 项，使用公式 `F(N) = F(N-1) + F(N-2)`，其中 `F(0) = 0` 且 `F(1) = 1`。编写一个程序读取 2 到 40 之间的整数\
  \ `N` 并使用该函数显示第 $N^{th}$ 项。\n\n**注释：** 这种计算斐波那契数的递归解决方案并不高效，因为低项的计算被重复了。例如，`fib(5)\
