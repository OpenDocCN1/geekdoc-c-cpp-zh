  \n> *内循环的第三次迭代* (j=2): 由于 `j=2`，条件 `(j < 2)` 为假，循环终止。然后，程序显示 One。\n\n> *外循环的第三次迭代*\
  \ (i=3): 由于条件 `(i < 3)` 为假，循环终止。\n\n`i` 和 `j` 的值分别为 `3` 和 `2`。因此，程序显示：\n\n## 练习题\n\
  \nC.6.10 以下程序的输出是什么？\n\n**答案：** 让我们追踪迭代过程：\n\n> *外循环的第一次迭代* (i=0): 由于条件 `(i < 2)`\
  \ 为真，程序显示？并执行内循环。\n\n> *内循环的第一次迭代* (j=1): 条件 `j` 对应 `(j != 0)`，为真。因此，程序显示 !。\n\n\
  > *内循环的执行* (k=0): 循环在 `k=0` 和 `k=1` 时执行两次，程序显示两个 *。\n\n> *内循环的第二次迭代* (j=0): 由于条件\
  \ `(j != 0)` 为假，循环终止。\n\n接下来的迭代以类似的方式执行。最后，程序显示：? ! * *? ! * * ! * *\n\nC.6.11 编写一个程序，读取一个表示行数的整数。该程序应该在第一行显示与输入数量相等的\
  \ `*` 号，在之后的每一行中少少一个。例如，如果用户输入 5，程序应该显示：\n\n**注释：** 假设用户输入了 5。让我们通过追踪外循环的前两次迭代来解释代码。\n\
  \n> *外循环的第一次迭代* (i=0): 由于条件 `(i < 5)` 为真，执行内循环。\n\n> *第一个内循环的执行* (j=0): 由于 `j=0`\
  \ 且 `i=0`，条件 `(j < i)` 为假，循环终止。\n\n> *第二个内循环的执行* (j=5): 由于 `j=5` 且 `i=0`，条件 `(j\
  \ > i)` 为真，循环显示 *。此过程又重复了四次。然后，换行。\n\n> *外循环的第二次迭代* (i=1): 由于条件 `(i < 5)` 为真，执行内循环。\n\
  \n> *第一个内循环的执行* (j=0): 由于 `j=0` 且 `i=1`，条件 `(j < i)` 为真，因此程序显示空格。\n\n> *第二个内循环的执行*\
  \ (j=5): 由于 `j=5` 且 `i=1`，条件 `(j > i)` 为真，循环显示 *。此过程又重复了三次。然后，换行。\n\n到目前为止，程序已经显示了：\n\
  \n并且后续输出以类似的方式产生。\n\nC.6.12 编写一个程序，读取五个学生在三门不同课程的成绩，并显示每个学生在这三门课程中的平均分以及所有学生的平均分。\n\
  \nC.6.13 编写一个程序，显示方程的整数解（如果有）：`4x − 2y + 3z = 20`、`xyz < 15` 和 `x² + y² + z² > 8`，其中\
  \ `x` 是 `[−10, 10]` 内内的整数，`y` 在 `[-3, 3]` 内，`z` 在 `[2, 6]` 内。\n\n### while 语句\n\n\
  `while` 语句创建迭代循环简单的方法。它的语法如下：\n\n与 `if` 和 `for` 语句一样，如果循环体只包含语句，可以省略括号。计算控制表达式 `exp`\
  \ 的值。如果它为假，则不执行循环。如果它为真，则执行循环体并再次计算 `exp`。如果它为假，循环终止。如果不是，则再次执行循环体。这个过程重复直到 `exp`\
  \ 变为假。例如，以下程序使用 `while` 语句显示从 10 到 1 的整数：\n\n*注意我们可以用 `while(i)` 代替 `while(i !=\
  \ 0)`。同样，`while(!i)` 等同于 `while(i == 0)`。*\n\n`for` 语句和 `while` 语句密切相关。事实上，`for`\
  \ 语句：\n\n等同于：\n\n除非 `for` 循环包含 `continue` 语句。\n\n对于问题中关于应该使用 `while` 还是 `for` 的回答，由于两者产生的代码相同，我认为主要取决于个人喜好。通常，`while`\
  \ 语句用于迭代次数未知或直接测试条件的情况。\n\n当迭代次数已知且使用了步长时，使用 `for` 语句更好，因为其紧凑的形式更易读。然而，某些情况下 `for`\
  \ 语句虽然看起来是最佳选择，可能会产生“不优雅”的代码。练习 C.6.7 中 `for` 使用就是这样一个例子。如果此 `for` 语句替换为 `while`\
  \ 语句，代码会变得更优雅。尝试一下区别。\n\n如果 `exp` 恒为真，循环将一直执行，除非主体包含退出语句（例如 `break`）。例如，以下循环是无限的：\n\
  \n按照惯例，大多数程序员使用 1 或 `true` 来创建无限循环。然而，任何非零常量都可以。通常，程序持续读取数据直到条件变为真，我倾向于使用无限循环。例如，让我们读取整数：\n\
  \n与 `for` 语句一样，`while` 语句末尾的分号表示声明了一个空循环体。例如，在括号后加上分号：\n\n会导致循环变为无限，且语句 `a++` 永远不会执行。进入练习题前的最后一个例子。以下程序的输出是什么？\n\
  \n追踪迭代并仔细注意计算，在看下一页答案之前；这对你来说应该很简单。\n\n睡着了吗？答案是 80 吗？\n\n是谁告诉你 `=+` 是复合运算符的？你在第\
  \ 4 章就被警告过复合运算符中的 `= ` 是在后面的，不是吗？因此，语句 `sum =+ 20;` 等同于 `sum = +20;`，这仅仅是将 20 赋值给\
  \ `sum`，这就是输出值。如果我写的是 `sum += 20`，程序确实会显示 80。\n\n基本上，这个例子的主要目的是向你展示，在阅读代码时，即使只有几行，想象成成万行，也很容易漏掉简单的\
  \ bug。有时，你插入 bug 越容易，发现它就越困难。记住，写代码时你应该特别专注、谨慎并保持心情良好。继续做题吧，但要注意后面的陷阱。\n\n\n\n**答案：**\
  \ 与嵌套 `for` 循环一样，外层 `while` 循环的每次迭代都会触发嵌套循环的执行。注意 `while(i >> 1)` 等同于 `while((i\
  \ >> 1) != 0)`，也就是说，检查 `i` 向右移动一位的值是否为 0。同样，`while(!(j%i))` 等同于 `while(j%i == 0)`。让我们跟踪外层循环的第一次迭代：\n\
  \n> *外层循环的第一次迭代*：由于 `i` 为 4，条件为真，因此执行内层循环。\n\n> *内层循环的第一次迭代*：由于 `i` 和 `j` 均为 3，条件\
  \ `!(j%i)` 为真，因此程序显示 One，`j` 变为 2。正如所述，`break` 语句会终止其所在的循环。\n\n> *内层循环的第二次迭代*：由于条件为假，循环终止。然后，`j`\
  \ 变为 4。\n\n最终，程序输出：One One One 6\n\nC.6.15 编写一个程序，读取一个整数并显示其数字个数以及数字和。例如，如果用户输入\
  \ 1234，程序应显示 4 和 10 (1+2+3+4 = 10)。\n\nC.6.16 编写一个程序，连续读取 [0, 255] 范围内的整数并以二进制形式显示。例如，如果用户输入\
  \ 32，程序应显示 00100000。程序还应根据输入数字的次数显示单词 Hi。如果用户输入的数字不在 [0, 255] 范围内，程序应显示显示的 Hi 总数，然后终止。它还应该显示最小和最大的输入数字，以及\
  \ [8, 50] 范围内输入数字的平均值。仅使用 `while` 循环。\n\nC.6.17 序列 1/1 – 1/3 + 1/5 - 1/7 + 1/9 –\
  \ … 收敛于 pi/4。编写一个程序，找到需要添加多少项才能使结果收敛到 pi/4，精度为 0.001。考虑 pi 等于 3.14。使用 `fabs()` 函数检查收敛性。\n\
  \nC.6.18 编写一个程序，连续读取月份数字（1=1 月，12=12 月）、每月的第一天（1=周一，7=周日），并显示该月的日历。如果输入的月份是二月，程序应提示用户输入天数，即\
  \ 28 或 29。如果给定的月份超出 [1, 12]，程序应终止。\n\n**注释：** 上一个 `for` 循环中的 `if` 语句检查是否到达了一周的最后一天。如果是，则添加一个换行符。`rows`\
  \ 变量计算到为止显示了多少行日期。例如，如果用户输入 3 作为月份的第一天（`day = 3`），当 `i` 变为 `8-day+(rows*7) = 8-3+(0*7)\
  \ = 5` 时，将添加第一个换行符。接着，`rows` 变为 1。当 `i` 分别变为 12、19 和 26 时，将分别添加下一个换行符。\n\nC.6.19\
  \ 编写一个模拟剧院票务处的程序。假设座数为 300。程序应显示菜单以提供以下选择：\n\n1. 买票。成人票价为 15 美元，儿童票为 10 美元。购买超过三张票可享\
  \ 10% 折扣。\n2. 根据输入数字次数显示 Hi。\n3. 退出。\n\n### do-while 语句\n\n与 `for` 和 `while` 语句不同，`do-while`\
  \ 语句在执行循环体后测试控制表达式。因此，`do-while` 循环至少执行一次。其形式如下：\n\n执行循环体，然后评估 `exp`。如果为假，循环终止。否则，再次执行循环体。当\
  \ `exp` 为假时，循环终止。如果不是，再次执行循环体。当 `exp` 为假时，循环终止。\n\n例如，`do-while` 语句用于从 1 到 10 的跳转，通常可以使用\
  \ `while`：\n\n在实践中，`do-while` 语句比 `for` 或 `while` 语句使用得少，但它可以用于检查输入的有效性。例如：\n\n\
  虽然可以省略单个语句的括号，但否则可能会误认为 `while` 语句。例如，`do-while` 循环重复过程直到 `exp` 为假。\n\n### goto\
  \ 语句\n\n`goto` 语句用于跳转到同一函数内的另一个语句，是该语句有一个标签。其语法如下：\n\n当执行 `goto` 语句时，程序跳转到标签后的语句。标签的命名方式类似于变量，并且在使用\
  \ `goto` 语句的函数内必须唯一。标签的作用范围是整个函数。例如，在以下程序中，如果用户输入 -1，`goto` 语句跳转到 `START` 标签并重复循环。\n\
  \n通常最好避免使用 `goto`，因为程序执行从一个点到另一个点再到另一个点的跳转会导致晦涩、难以阅读和复杂的代码，难以维护和修改。事实上，大多数程序员反对使用它，认为它没有位置。\n\
  \n## 练习\n\nC.6.20 编写一个程序，连续读取一个整数并根据输入数字次数显示 Hi。如果用户输入负值，程序应终止。仅使用 `do-while` 循环。\n\
  \nC.6.21 编写一个程序，老师可以用它测试学生是否知道乘法表。程序应在 [1, 10] 范围内生成两个随机值（例如 `a` 和 `b`）并显示 axb（较小的数字在前）。程序应提示学生输入结果并指示是否正确。如果学生输入\
  \ -1，程序应显示正确错误答案的数量并终止。\n\nC.6.22 编写一个程序，根据泰勒级数计算 sin(x)：sin(x) = x – x³/3! + x⁵/5!\
  \ – x⁷/7! + x⁹/9 – … 直到项之间的绝对差小于 0.0001。不要计算阶乘或幂。特别是计算新一项时使用前一项并乘以适当数字。例如，计算 x⁵/5!\
  \ 使用前一项 x³/3! 并乘以 x*x。考虑 pi 等于 3.14。使用 `fabs()` 函数查找差异并使用 `sin()` 函数比较结果。\n\n\n\n\
  \n在结束本章之前，我想再次指出，编写清晰且易读的代码是非常重要的，特别是在开发大型应用程序时。事实上，当一家公司想要聘佣程序员时，让候选人写一篇短文来测试其写作能力、表达方式，以及文本是否清晰、简洁、结构是否良好、平衡且无重复等，这可能比问他在诸如\
  \ `int *(*p[5])(**int*)` 这样的声明中 `p` 的类型是什么（别担心，我们将在会在 第 11 章 中回答这个问题），或者编译器将选择哪个版本的重载函数模板要有用得多。即使他无法回答类似的问题，这些知识也容易获得。另一方面，学习以一种直观、全面、简洁且不重复的方式组织思路是一项非常艰巨的任务。在高中时期，我低估了“如何写作”这门课程的价值；作为一名程序员，我意识到它的重要性。\n\
