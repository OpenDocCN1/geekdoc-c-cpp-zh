  \n## 练习题\n\n**C.14.10** 定义结构类型 `Node`，成员包括：`code`、`name`、`grade` 以及一个指向 `Node` 类型结构体的指针。创建一个节点为该类型结构的链表。编写一个程序，显示菜单以执行以下操作：\n\
