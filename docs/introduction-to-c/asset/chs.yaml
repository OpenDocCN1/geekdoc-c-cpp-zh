  \n从风格上来说，我不喜好的语法是 `if(!p)`。\n\n由于 `NULL` 值是一个整数值，它的使用并不能确定所引用的变量一定是指针变量。为了消除整数和指针之间的任何潜在混淆，C++11\
  \ 定义了 `nullptr` 常量，它表示空指针，并且只能被赋值给指针变量。例如：\n\n由于 `nullptr` 仅与指针关联，这就是我优于 `NULL`\
  \ 和 0 常量的原因。\n\n### 使用指针\n\n为了访问指针变量所引用的内存地址的内容，我们在其名称之前使用 `*`（*间接引用或解引用*）运算符。虽然使用了相同的符号，但它并不是乘法运算符。编译器使用上下文来确定使用的是解引用运算符还是乘法运算符。如果你想知道为什么标准委员会决定使用相同的符号，我并不确定，这可能是由于可用字符的短缺。编译器分析表达式并决定使用哪一个。这里有一个例子：\n\
