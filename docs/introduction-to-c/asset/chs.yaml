  \n## 17 类与对象\n\nDOI: [10.1201/9781003230076-17](https://doi.org/10.1201/9781003230076-17)\n\
  \n面向对象编程在程序设计和开发中引入了新的概念和不同的哲学。最重要的引入是“类”的概念。事实上，C++ 最初的名字是“带类的 C 语言”。本质上，如名称所示，面向对象编程涉及类和对象的使用。面向对象编程的关键特征，如数据封装、数据隐藏和继承都是基于类的。在本章中，我们将学习如何定义类和创建对象，并查看类的概念如何支持数据封装和数据隐藏。我们还将讨论构造函数和析构函数、友函数和常量函数以及\
  \ `this` 指针。\n\n### 类与对象\n\n类类型与结构体类型相似。与结构体一样，类是用户定义的类型，用于定义抽象实体的特征和操作。类使程序员能够以一种更自然的方式表示现实世界中的实体。类包含一组根据我们的需求描述该实体的数据值，并且也可以包含一组操作这些值的函数。这种在类内部将数据值和函数封装在一起的做法被称为*数据封装*。\n\
  \n类是表示程序中某个概念的关键构建块。例如，为了表示一次电话通话，我们可以定义一个包含相关信息的类，如拨号号码、被叫号码、通话时长，以及通话建立、通话挂断和计费函数。通常，我们根据意图使用该类的语境来决定类应该包含什么。由于类将抽象转换为用户定义的类型，程序变得更具描述性、更优雅，并且更容易于读、写、使用和维护。类声明的通用语法为：\n\
  \n与具名结构体类似，一旦声明了类，我们就可以声明该类型的变量。这些变量被称为类的*对象*或*实例*，它们是根据规范创建的。\n\n为了清楚起见，类的声明像结构体的声明一样并不会创建对象。例如，一个特定的汽车模型是该类的一个对象。我们可以在程序中创建并操作任意多个汽车对象，每个对象都有自己的属性。通常，我们可以使用类来模拟我们任何需要的现实世界实体，并基于它们编写程序。这就是面向对象编程的核心。\n\
  \n与结构体一样，我们可以将对象传递给函数，定义返回对象的函数，并将一个对象赋值给另一个同类对象。例如，以下程序声明了 `Student` 类，读取学生数据，将其保存到对象的成员中，并在屏幕上显示。典型的做法是将类声明放在头文件中，文件名通常与类名相同。成员函数的实现放在一个或多个代码文件中，这些文件包含该头文件。将类声明与实现分离使得代码更容易阅读和维护。让我们看看这两个文件：\n\
  \n然后在源文件中包含该文件。\n\n为了简单起见并节省空间，我将所有内容放在一个文件中；然而，有一些示例将类声明和实现放在不同的文件中，正如本例所示。为了区分类名和普通名称，许多程序员（包括我也）倾向于首字母大写。在声明对象时，不需要\
  \ `class` 关键字，因为类名本身就是一个类型名称。例如，`Student` 名字是用户定义的类型类型名称，即你（或者说程序员）。\n\n\n\n\n类还可以包含由我们或其他程序员创建的其它类的对象。例如，`name`\
  \ 字段是字符串库类的一个对象。因此，我们是字符串类的用户，并且正如我们在下一节将看到的那样，我们可以访问 `string` 类开发者决定设置为公开的区域。顺便问一下，我们是否可以使用字符串对象以外的其他内容来存储名称？当然可以，例如，我们可以使用字符数组。然而，这种方案限制了可以存储的名称的长度。如果我们将数组开得太大，就会浪费内存。因此，使用\
  \ `char` 指针并为存储名称分配所需的精确内存会更好。但是，我们将在后续章节的示例（例如 `C.18.2`）中看到，这种选择是需要付出的，因为必须添加代码来安全地支持某些操作。因此，使用字符串对象并利用该类提供的许多功能会更加方便、灵活且更安全。\n\
  \n### 成员函数\n\n属于类的函数被称为成员函数。成员函数可以在类内定义，也可以在类外定义。如果它们在类内定义，类的声明可能会变得非常大，导致读者难以阅读和区分其部分和成员。为了让类更易读并快速了解其功能，函数通常定义在类外的单独源文件中。实际上，这种分离使得类“做什么”（函数声明）与“如何做”（函数定义）变得分明。与结构体一样，在访问对象的成员时，我们使用点\
  \ `.` 和 `->` 运算符。也就是说，我们以访问普通数据成员的方式访问函数。\n\n如果函数太短，通常的做法是将其定义在类内部。尽管在我们的示例中 `show()`\
  \ 的代码很短，但我将它的定义放在类外，以展示它是如何定义的。由于不同的类可以拥有同名的函数，为了定义它，我们使用作用域解析运算符 `::` 以及它所属的类名。这样，编译器就知道每个函数属于哪个类并可以编译代码。`set()`\
  \ 设置了调用函数的对象的代码值（即 `s`），而 `show()` 则显示其字段的值。\n\n任何在类内定义的函数都被认为是内联（inline）的。因此，不需要在它的定义中添加\
  \ `inline` 关键字。例如，`set()` 就是内联的。然而，正如第 16 节 所讨论的，这并不意味着它一定将以内联方式实现；这取决于编译器。通常情况下，常见的做法只在类内定义极小的函数。在接下来的示例中，我将声明一些函数为内联，另一些不是，以便你熟悉这两种形式。请注意，在类外定义的函数也可以通过在其定义中添加\
  \ `inline` 修饰符来变为内联。例如：\n\n每当创建一个对象时，编译器都会为其变量分配内存。例如，如果我们声明了 `s1` 和 `s2` 对象，那么为\
  \ `s1.grd` 和 `s2.grd` 留的内存是不同的。相反，为函数分配的内存是相同的。例如，`show()` 的代码只存储在一个地方，每当声明新对象时都不会创建副本；这是合理的，因为所有对象的函数代码都是相同的。因此，语句\
  \ `s1.show()` 和 `s2.show()` 执行的是相同的代码，并且该代码应用到调用它的对象的数据上。\n\n## 类作用域\n\n每个类在 `{}`\
  \ 内部定义了其自己的作用域。类成员的作用域被限制在类内部。因此，在其他类可以使用相同的名称。例如，类 `C` 可能包含它自己的 `show()`：\n\n由于成员名在类外是不可见的，我们必须使用类名。通过类名和作用域运算符\
  \ `::`，每个 `show()` 的定义与相应的类相关联。当调用函数时，成员名指向调用函数的对象。例如，当调用 `show()` 时，调用 `show()`\
  \ 的对象的成员值将被显示。\n\n类成员具有类作用域，也就是说，它从类声明的开始符号 `{` 直到结束符号 `}`。因此，一个成员可以引用另一个成员，无论其声明的位置在哪里。“名称必须在使用之前先声明”的规则不适用于类作用域内。例如：\n\
  \n为了知道发生了什么，编译器首先处理所有数据成员的声明（例如 `code`），然后处理函数的定义。这是符合逻辑的，因为如果与成员声明并行处理函数定义，那么函数必须以特定的顺序定义，以便它们引用的是已经声明的成员。由于这会使类的设计变得非常困难，编译器首先处理所有成员声明，以便在编译函数时它们是可见的。\n\
  \n类名不能被重用来声明成员。正如我们接下来将看到的，该规则的例外是声明构造函数。例如：\n\n## 访问控制\n\n是时候讨论类的可访问性和访问修饰符了。类的成员可以是\
  \ `public`、`private` 或 `protected`。`private` 成员只能从同类的函数中访问。不允许类外的任何函数或对象直接访问它们。例如，不允许写入\
  \ `s.code = 1`。相反，`set()` 中的语句 `code = c;` 是允许的，因为成员函数允许访问私有成员。事实上，成员函数可以访问类的任何其他成员，无论访问修饰符如何，只需使用名称。对于\
  \ `public` 成员，访问它们没有限制，这意味着可以在类内部或任何地方访问。`protected` 成员的行为与 `private` 成员相似，区别在于它们可以被派生类的函数访问，正如我们在第\
  \ 20 节 中看到的。\n\n类的成员默认是私有的。也就是说，如果我们的示例在声明 `code` 之前缺少了 `private` 单词，那么 `code` 将再次是私有的。尽管这没有必要，但我倾向于添加它，以明确将特定变量声明为私有的意图。因此，我们看到类不仅通过将数据封装在类型中（数据封装）来表示逻辑实体，还为程序员提供了这种能力：指定哪些数据可以从外部环境访问，哪些被隐藏以便防止直接访问。这种能力被称为数据隐藏。正如我们以后将看到的，数据隐藏对于确保对象的完整性非常重要。当我们说外部环境时，指的是类的用户，即在程序中使用该类的程序员。例如，在下面的程序中，假设你编写了\
  \ `Test` 类并将其给了另一个程序员，后者用它来创建 `Test` 对象。找出错误：\n\n\n\n\n由于 `a` 和 `f1()` 成员已被声明为 `private`，因此不允许从类外部访问它们。因此，语句\
  \ `t.a = 1;` 和 `t.f1();` 是错误的。`protected` 成员的情况也是如此。因此，语句 `t.b = 2;` 和 `t.f2();`\
  \ 是错误的。由于允许访问 `public` 成员，因此语句 `t.c = 2;` 和 `t.f3();` 是可以的。最后，由于类函数可以访问其成员，因此 `f1()`、`f2()`\
  \ 和 `f3()` 的代码被成功编译。换句话说，`f1()` 可以由编写该类的程序员直接使用，但不能由使用该类的程序员直接使用。所以，我们要记住，可以通过类成员函数来访问\
  \ `private` 和 `protected` 成员，正如我们后面看到的，还可以通过友函数进行访问。\n\n类可以不包含访问限定符，在这种情况下，所有成员默认都是\
  \ `private`。此外，访问限定符可以在类中多次使用，且顺序不限。指定的访问权限一直有效，直到出现下一个限定符或类的结束。例如：\n\n为了更好地理解和组织类，最好不要有重复的区域。关于部分的顺序，当我想强调类用户可以访问的成员时，我将\
  \ `public` 部分放在第一位。否则，我将 `private` 放在第一位。通常情况下，`public` 部分放在第一位，因为这是类用户最感兴趣的查看部分。\n\
  \n### 类设计\n\n当我们设计一个类时，我们将不希望被直接访问的成员声明为 `private`（例如与类实现相关的函数），而我们将决定构成与外部环境接口的成员声明为\
  \ `public`。本质上讲，类的用户通过其 `public` 成员与类进行通信。我们已经遇到过示例 C.10.10，其中 `string` 类的用户使用了\
  \ `public` 函数（例如 `size()`）来处理它。在示例 C.7.5 中，我们也采取了相同的方法来管理 `vector` 类。\n\n另一个例子是，在我的一个应用程序中，我实现了一个\
  \ `Protocol` 类来模拟网络协议的操作。完成后，我将其交给了公司的另一组开发人员，他们正在实现一个使用该类以加密形式发送数据的应用程序。为了与该类通信，我将\
  \ `Init()`、`Stop()` 和 `Send_Data()` 函数放在了 `public` 部分。然而，`Operation()` 函数以及与其他协议实现相关的数据（例如数据加密的候选算法），我想向类用户隐藏这些内容，既是为了防止处理不当的安全，也是因为没有理由发布实现细节，因此将它们放在了\
  \ `private` 部分。数据隐藏防止了意外的操纵，并确保了类数据的完整性及其恰当运行。如果发生了改变类数据状态的错误，该错误是由于类的实现，而不是由于类的使用方式。因此，错误搜索被限制在类代码中，从而更快地检测。\n\
  \n从原则上讲，类设计的基本思想是将与类实现相关的部分与与其外部接口实现相关的部分隔离开。除了安全性之外，这种分离的另一个原因在于，类实现中的任何更改（例如更改\
  \ `Operation()` 的代码）都不会影响类的通信方式（例如不需要更改 `Init()` 的代码）。我们只需要编译新的类代码并将其重新链接到应用程序即可。事实上，这种情况是应该发生的，任何内部变化都不涉及类用户，当然也不应该强迫他们更改代码，也就是说，他们必须继续以以前的方式与类通信。与外部世界的接口应该保持不变，仿佛什么都没有改变一样。用户真正关心的是类是否按照其规范运行、具有可靠性；用户的任务是学习它提供的服务以及如何通过\
  \ `public` 接口使用它们。例如，你是否要使用 `string` 类？读读关于它的内容，熟悉它的 `public` 成员和函数，并学习如何使用它们。你不需要担心类的实现细节。\n\
  \n现在我们已经讨论了类，我们可以更容易地理解面向对象编程哲学与过程化编程之间的区别。让我们看看与 C 语言的区别。C 不支持类的概念，接近的概念是结构（struct）。然而，C\
  \ 结构不允许包含函数。因此，程序员必须定义外部函数（如第 14 章 中的几个示例所示），以便操纵其数据。因此，函数分散在程序中，没有形成一个我们可以容易理解和控制的单元。此外，结构体的用户可以直接访问其所有数据，因为\
  \ C 不支持数据隐藏的概念。相比之下，在 C++ 中，类将数据和处理这些数据的封装封装同一个类型中。因此，类统一了抽象实体的描述，并更准确地表示了它。\n\n\
  为了更好地理解这两种方法的区别，考虑程序 C.14.10。如你所见，定义了几个任何人都可以使用的全局变量和函数来支持列表的功能。这个程序是过程化编程的示例。重点放在了用于处理数据的函数定义上。在面向对象的方法中，重点放在了用于处理数据的类类型定义上。例如，我们可以定义\
  \ `List` 类型来表示列表，并将管理它的所有变量和函数放在其中。现在，代码更具代表性，也更易阅读、编写和维护。\n\n列表数据封装在 `List` 类型内部，指定它们的访问权限是程序员的责任。\n\
  \n总结一下，在 `public` 部分我们放置类用户可以用来与类通信的函数，而在 `private`/`protected` 部分我们放置实现类功能的函数。换句话之，使用类时，你需要知道它的公共接口；编写类时，你需要指定它的公共接口。未声明为公共的成员应该是\
  \ `private` 或 `protected` 的。正如我们在第 20 章 中看到的，将成员设为 `protected` 的决定取决于我们是否允许派生类内部直接访问它。如果是，我们将其设为\
  \ `protected`；否则设为 `private`。我们将在的练习题中看到一些简单的类设计示例。\n\n\n\n等一下；我们还没有结束。我不想营造这样一种错觉，认为类设计是一项非常容易的任务，只需决定你想要支持的操作，选择私有、保护和公共成员就大功告成了。即使这种选择也是一个困难的决定。例如，为了控制访问权限，完全不设置公共成员而仅通过公共的\
  \ `set()`/`get()` 函数来访问类数据难道不是更安全、更简单吗？更糟糕的是，考虑类的创建者。在向外部世界提供一个类（例如 `string`）时，他们必须确保类的公共部分（以及派生类中的保护部分）是功能完备且不会反复变化的。类的开发者对类设计所做的任何更改都应该与实现代码有关，而不是与公共接口有关。想象一下，那些已经在使用该类的程序员，经常因为类的新版本中公共函数的声明发生了变化或某些公共成员被删除，而被迫频繁地更改他们的代码。这将是不可接受的。\n\
  \n此外，在设计类时，除了操作之外，你还需要决定它的许多特征，例如成员的有效值是什么（例如，在 `Time` 类中，小时成员的有效范围是 0-24），类是否重载运算符，是否将作为基类使用，是否会包含虚函数，是否会使用默认函数或你指定的其他函数，是否允许从/到另一种类型的转换，以及许多其他“如果”。谁说类设计是一项容易的工作？\n\
  \n### 结构体/联合体与类\n\n结构体（structure）的概念以及如何使用结构体变量与类和对象非常相似。事实上，区别在于类的成员默认是私有的，而结构体的成员默认是公有的。正如我们在第\
  \ 19 章中看到的，另一个类似的区别是，派生类默认继承具有私有访问权限的基类，而派生结构体默认具有公共访问权限。由于它们之间没有本质区别，可能会有人问，我们难道不能只有一个单一的类型（`struct`\
  \ 或 `class`），并在需要时更改默认访问权限吗？为什么要同时拥有两者？这种疑问很合理，我不确定答案是什么。我想在开始阶段，由于 `struct` 类型在\
  \ C 语言中已经存在，而且面向对象的特性是尚未普及的新型编程概念，Stroustrup 希望在 C++ 中引入一种关注面向对象操作的新类型。然后，决定 `struct`\
  \ 类型也支持面向对象的操作。\n\n通常的做法是，当同时需要变量和函数来表示一个实体时，使用 `class`；而当只需要变量时使用结构体。此外，如果成员仅为公有，通常选择结构体；如果也有私有成员，则选择类。\n\
  \n关于联合体（unions），联合体是类的一种特例，正如我们从第 13 章中知道的，它只有一个成员具有有效值。与结构体一样，联合体的成员默认是公有的。联合体支持类的属性，但并非所有。例如，联合体可以包含\
  \ `public`、`private` 和 `protected` 部分。它还可以包含成员函数，包括构造函数和析构函数。然而，联合体不能作为基类，也不能继承另一个类。因此，它不能包含虚函数。\n\
  \n### const 成员函数\n\n在我们第一个示例 C.17.1 中，`show()` 函数可以改变调用它的对象的值。例如，如果在它的定义中添加以下语句：\n\
  \n并编写 `s.show()`；`s` 对象的 `grd` 值就变成了 2。如果我们不希望一个函数能够改变调用对象的值，就在其声明的末尾添加 `const`\
  \ 关键字。`const` 关键字也必须添加到它的定义中。例如，`show()` 的声明变为：\n\n```cpp\nvoid show() const;\n\
  ```\n\n以及它的定义：\n\n```cpp\nvoid Shape::show() const { grd = 2; }\n```\n\n如果 `show()`\
  \ 尝试更改成员（如 `grd`）的值，编译器将显示非法操作的错误信息。\n\n在 `const` 函数内部，我们可以调用另一个 `const` 成员函数，但调用非\
  \ `const` 函数是错误的。这是有意义的，因为非 `const` 函数可能会修改对象，从而消除了所适用的 `const` 属性。例如：\n\n```cpp\n\
  void Shape::draw() const { show(); }\n```\n\n现在，假设我们添加以下成员函数：\n\n```cpp\nint& grd()\
  \ const { return grd; }\n```\n\n这是正确的吗？不，编译器不允许你这样做。你不能返回指向类成员的普通引用或指针。在 `const`\
  \ 函数内部，每个数据成员都变成 `const`，因此无法被修改。因此，引用必须是 `const`：\n\n```cpp\nconst int& grd() const\
  \ { return grd; }\n```\n\n例如，如果你被允许返回非 `const` 引用，你就可以违反 `const` 对象的 `const` 属性，即修改一个不能被修改的对象。例如，编写这样的代码：\n\
  \n```cpp\ns.grd() = 10;\n```\n\n因此，为了保持 `const` 属性，编译器不允许我们从 `const` 函数返回指向成员变量的非\
  \ `const` 引用。\n\n### 对象\n\n对象可以声明为 `const`。例如，考虑以下程序：\n\n```cpp\nconst Shape s;\n\
  ```\n\n`s` 是一个 `const` 对象，这意味着不允许更改 `s` 的成员。也就是说，`s` 的所有成员变量都变成了 `const`。因此，我们只能调用\
  \ `const` 函数，因为它们不允许成员的值发生变化。调用非 const 函数会导致错误。如果我们想要更改成员的值，我们使用 `mutable` 关键字。\n\
  \n正如你所看到的，尽管 `set_grd()` 被声明为 `const`，它仍然可以更改 `grd`。注意，如果 `show()` 没有声明为 `const`，编译器将由于调用非\
  \ `const` 函数而显示错误信息。如果你奇怪为什么构造函数可以更改值，答案是对象在构造函数完成后才真正变为 `const`。因此，构造函数（我们稍后会讨论）被允许为\
  \ `const` 成员赋值。\n\n### 友函数\n\n正如我们所学的，成员函数可以访问类的私有成员。那么非成员函数有访问私有成员的方法吗？有的，只要它被声明为类的友（friend）。简而言之，友函数是一种可以访问类成员的非成员函数，无论这些成员在哪里声明。也就是说，友函数与成员函数具有相同的访问权限。要使一个函数成为友元，必须在类中使用\
  \ `friend` 前缀进行声明。声明的位置并不重要，它可以声明在私有、保护或公共区域；该区域不会影响它的可访问性。但请不要忘记，尽管它在类中声明，但它并不是类的成员。定义时，因为不是类的成员，所以不需要添加作用域运算符\
  \ `::` 和类名。在声明友函数时，一种常见的做法是将它们分组放在类的开头或末尾，以便区分。让我们来看以下程序：\n\n\n\n\n由于友元函数不是类的成员，因此在\
  \ `f()` 的定义中我们不添加 `T::`。为了更清晰起见，如果我们声明了对象 `t1` 并编写 `t1.f(t)`，编译器将显示类似于 `f is not\
  \ a member of T` 的错误信息。出于相同的原因，因为 `f()` 不是 `T` 的成员，我们不能仅通过使用它们的名称来访问其成员。注意，在 `f()`\
  \ 的定义中不需要为其添加 `friend` 关键字，除非它是在类内部定义的。正如我们所说的，尽管 `f()` 不是成员函数，但它具有与成员函数相同的访问权限。因此，它允许访问私有成员\
  \ `a`，程序显示 `10`。\n\n友元函数可以是像本例这样的全局函数，也可以是另一个类的成员。人们可能会问，有必要将 `f()` 声明为 `friend`\
  \ 吗？我们不能在类外将其声明为普通函数吗？当然可以的，但由于 `a` 是私有的，因此不允许访问它。所以，我们需要向类中添加一个公共函数，在调用该函数时更改 `a`\
  \ 的值。例如：\n\n为了避免这种弯路，将 `f()` 设为 `friend` 更加方便简单。是的，这更简单，但为什么不一开始就让 `f()` 成为类的成员呢？是的，我们可以这样做，这个程序只是一个观察友元函数属性的示例，没有其他实际价值。那么什么时候使用友元函数呢？最常见的用法是当我们想要定义一个接受不同类对象作为参数并对它们的私有数据进行操作时。我们将该函数声明为每个类的\
  \ `friend`，因此它充当了类之间的链接。练习 `C.17.4` 就是这样一个例子。此外，我们将在 第 18 章 中看到示例，在重载运算符时，友元函数会非常有用。此外，我们将在\
  \ 第 19 章 中看到，一个某个类的成员函数甚至整个类都可以是另一个类的友元。\n\n最后说一点。函数模板也可以是普通类的友元。在这种情况下，函数模板的所有实例化都将成为该类的友元。例如：\n\
  \n由于 `f` 函数模板被声明为 `A` 类的 `friend`，它的每个实例都是 `A` 类的友元。在这里，我们有两个 `f` 实例，程序首先输出 `20`\
  \ 然后输出 `50`。\n\n现在我们已经讨论了友元函数，让我们来总结一下访问类成员的规则，以便你可以在一个地方找到它们：\n\n1. 私有成员只能通过类的成员函数和类的友元函数访问。\n\
  2. 保护成员只能通过类的成员函数和其友元函数，以及通过派生类的成员函数和友元函数访问。\n3. 公有成员可以由类内部或外部的任何函数访问。\n\n### 构造函数和析构函数\n\
  \n类的构造函数和析构函数是特殊的成员函数。特别是：\n\n1. 每当对象被创建时，就会调用类的构造函数之一。\n2. 每当对象被销毁时，就会调用类的析构函数。\n\
  \n让我们讨论一下它们。\n\n### 构造函数\n\n构造函数是类的一种特殊函数，每当该类的对象被创建时就会被调用。构造函数的声明必须遵循一些规则。特别是，它必须与类名相同，没有返回类型，不允许被声明为\
  \ `const`，它可以接受参数，并且可以重载，也就是说一个类可以有多个构造函数。与普通重载函数一样，不同版本的构造函数在参数的数量或类型上不同。\n\n通常，构造函数用于为对象的成员分配初始值或分配内存。例如，在\
  \ `C.17.1` 示例中，由于不允许直接访问 `code` 成员，我们无法编写这样的代码：\n\n当然，如果所有成员都声明为 `public`，那么这个声明是可以的，但我指的是类包含私有成员的通用情况，因为数据隐藏是使用类的主要原因。代码在创建\
  \ `s` 之后通过调用公共成员函数（如 `set()`）进行初始化。注意，如果基本类型（例如 `int`）或指针（例如 `int*`）的成员变量没有被初始化，它将有一个任意的垃圾值。\n\
  \n如果我们想在声明对象时初始化其成员，可以使用构造函数来完成。。事实上，这是我的偏好，即我更倾向于定义一个构造函数并在那里初始化成员，而不是在创建对象后调用某些初始化函数（如\
  \ `set()`）。这不仅更方便，而且更安全，特别是在创建多个对象时，因为我们可能会忘记初始化某些对象。当使用构造函数来分配初始值时，没有理由担心这个问题。\n\
  \n顺便说一下，这种允许从类外部设置成员函数（例如 `set()`）以及返回其值的相应函数通常称为 *setters*（set）和 *getters*（get）。\n\
  \n注意，如果类 `A` 包含一个另一个类对象的成员（例如 `string name`），它的构造函数会首先调用以创建该成员，然后完成 `A` 对象的构造。练习\
  \ `C.17.3` 就是这样一个例子。\n\n如果构造函数出现问题，我们如何处理这种情况呢？例如：\n\n如果给 `size` 传递一个负值怎么办？我们确实不能做的是返回一个指示错误的特殊值，因为正如我们所说，构造函数不返回值。正如我们在\
  \ 第 22 章 中看到的，一种简单的方法是创建一个异常来告知程序员该错误。例如，我们可以添加这样的内容：\n\n### 析构函数\n\n类可能包含另一个特殊函数，称为析构函数。当该类的对象被销毁时（例如当它超出范围时），会自动调用析构函数，以处理任何可能的清理工作。它必须与类名相同并在前面加上波浪号\
  \ `~`，它没有返回类型，不接受参数，因此不能重载。也就是说，一个类只能有一个析构函数。`~` 取反运算符可能被选择为析构函数的符号，以暗示析构函数“补全”了构造函数。\n\
  \n定义析构函数是因为我们希望在对象销毁时执行某些事情。如果不需要做任何事情，那么正如我们稍后看到的，*默认*析构函数就足够了。例如，析构函数通常用于释放对象可能动态分配的内存。我们很快就会看到这样的示例。现在，你能告诉我是以下程序的输出吗？\n\
  \n正如我们所说，构造函数和析构函数没有返回类型。由于有两个重载的构造函数，编译器根据每个对象创建的方式选择合适的一个。正如我们接下来看到的，不接受任何参数的构造函数被称为*默认*构造函数。当创建\
  \ `t1` 对象时，调用第一个构造函数，程序显示 First。`t1` 的变量 `a` 和 `b` 用垃圾值初始化。事实上，我的意图是不初始化它们，以便观察它们具有垃圾值；不要忘记初始化数据成员，否则在使用它们时可能会出现意想不到的问题。\n\
  \n\n\n构造函数遵循与普通函数相同的重载规则。编译器会检查参数的类型以选择合适的构造函数。因此，当创建 `t2` 时，会调用第二个构造函数，传递值 `5`\
  \ 和 `10`，程序将显示 `Second`。然后，程序会显示 `t1` 对象中 `a` 和 `b` 的垃圾值，以及 `t2` 对应成员的值 `5` 和 `10`。当调用\
  \ `check()` 时，会创建 `t` 对象并调用第一个构造函数。然后，`check()` 终止，`t` 不再存在了。因此，`t` 的析构函数会被自动调用，它会显示消息\
  \ `Out`。\n\n当程序结束时，`t1` 和 `t2` 的析构函数会被调用，程序会再次显示两次 `Out`。让我们来看看析构函数被调用的顺序。由于变量 `t1`\
  \ 和 `t2` 的内是在栈中保留的，因此最后一个创建的对象第一个被销毁。所以，`t2` 的析构函数将先被调用，然后是 `t1` 的析构函数。如果我们有一个对象数组，例如\
  \ `Test t[10];`，销毁顺序将从最后一个到第一个，即 `t[9]…t[0]`。\n\n一旦析构函数执行，类中的非静态成员就会自动被销毁。如果某个成员具有类类型，则会调用该类对应的析构函数。例如，在\
  \ `C.17.1` 示例中，一旦对象 `s` 被销毁，就会调用 `string` 类的析构函数，以释放为成员 `name` 预留的内存。\n\n### 调用构造函数\n\
  \n首先，我们不能使用对象来调用构造函数，就像我们调用类的方法时（例如 `t1.check()`）一样，因为对象尚未被创建。构造函数用于创建对象。如果我们想传递值，最常见的方法就像我们处理\
  \ `t2` 对象时那样。我们也可以这样直接调用构造函数：\n\n```\nt2.a becomes 5 and t2.b becomes 10.\n```\n\
  \n从 C++11 开始，我们可以使用大括号 `{}` 将初始值传递给构造函数。例如：`Test t2{5, 10};`\n\n正如我们在第 2 章中所说，这种方法是优的，因为编译器可以通知我们不兼容的值。\n\
  \n注意，使用 `new` 运算符动态创建对象也会调用构造函数。例如：\n\n在这种情况下，`p` 代表对象，`p` 指针可以用于管理该对象。通常情况下，像下面这样的初始化语句：\n\
  \n```\np = new class_name(type_name);\n```\n\n会调用构造函数 `class_name(type_name)`，其中\
  \ `type_name` 是值的类型。更准确地说，正如我们在第 14 章中所说，它首先触发 `operator new` 函数的调用以为对象分配内存，然后调用构造函数。当我们使用\
  \ `delete` 运算符销毁对象时（例如 `delete p`），首先会调用它的析构函数，然后释放对象对象使用的内存。\n\n同样，像下面这样的语句：\n\n\
  ```\np = new class_name;\n```\n\n会调用默认构造函数，我们接下来将看到。例如：\n\n```\nt = new Test;\n\
  ```\n\n这是一个特殊情况。如果构造函数接受单个参数，则允许用与参数相同类型的值来初始化对象。例如，如果在类 `A` 中定义了以下构造函数：\n\n```cpp\n\
  class A {\npublic:\n    A(int x);\n};\n```\n\n这种初始化会调用构造函数。注意，此功能可能会导致问题，但它可以被禁用，正如我们在第\
  \ 19 章中讨论的。\n\n### 调用析构函数\n\n正如我们所说，当对象超出范围或通过 `delete` 运算符销毁时，析构函数会自动调用。考虑以下类：\n\
  \n```cpp\nclass T {\npublic:\n    ~T();\n};\n```\n\n问题是，我们可以显式地调用析构函数吗，也就是说，我们可以写类似代码：\n\
  \n```cpp\nt.~T();\n```\n\n答案是；我们可以直接调用它，但不要这样做，因为可能会发生意外错误。你不需要调用析构函数，它会被自动调用。不过，我只是提到这一点而不作进一步分析，可能存在某些需要显式调用析构函数的特殊情况。\n\
  \n另一个可能的问题是，析构函数可以是私有的吗？可以，但请看以下程序：\n\n```cpp\nclass T {\nprivate:\n    ~T();\n\
  public:\n    T();\n};\n```\n\n因为析构函数是私有的，当在使用 `delete` 时，编译器会显示由于未经授权访问私有成员的错误信息。在声明\
  \ `t` 时也会发生同样的错误。如果出于某种原因你想指定对象何时被销毁，你可以将析构函数设为私有，使用指针创建对象（例如 `p`），定义一个函数（例如 `end()`），并在你任何需要的时候调用该函数（例如\
  \ `p->end()`），以释放内存并销毁对象。例如，如果你删掉那两个错误的语句并运行程序，它会输出 `Out`。`this` 指针指向对象本身，我们稍后会讨论这一点。\n\
  \n### 默认构造函数和析构函数\n\n构造函数的存在对于对象的创建至关重要。但，人们可能会问，在我们第一个例子中，`Student` 对象是如何创建的，因为没有定义构造函数？答案是，如果一个类没有包含任何构造函数，那么编译器会自动提供没有实体的默认构造函数。没有这个构造函数，我们就无法创建\
  \ `Student` 对象。每当声明一个 `Student` 对象时，编译器都会调用默认构造函数来创建对象。默认构造函数不会初始化基础类型的成员（例如 `int`）。\n\
  \n\n\n\n在问题中，构造函数可以是私有的吗？答案是肯定的。例如，我们可以有许多公共构造函数，它们都调用一个负责创建对象的私有构造函数。我们将在第 19 章中通过委托构造函数看到这种技术。使用私有构造函数的一个原因是我们不希望将其暴露给外部世界。\n\
  \n在类似的问题中，构造函数可以是保护的吗？答案同样是定的。例如，在继承中，可以在基类中将构造函数声明为`protected`，以防止直接创建基类对象，并仅允许派生类使用它。例如，正如我们在第\
  \ 20 章所示：\n\n### 默认函数\n\n到为止，我们已经学习编译器为类 `T` 默认提供的函数有：\n\n1. 默认构造函数：`T()`。\n\n2.\
  \ 默认拷贝赋值运算符，其声明为如下函数：\n   `T& operator=(const T&)`。例如，正如我们在第 18 章所示，当我们写 `t1 = t2;`\
  \ 时，会调用 `operator=` 函数，它将 `t2` 的非静态成员的值拷贝到 `t1`。如果该成员是数组，则其元素会被拷贝。该函数返回左操作数的引用。\n\
  \n3. 默认析构函数：`~T()`。\n\n这些是编译器将为你生成并默认调用的函数，除非你定义了自己的版本。在第 19 章中，我们将看到更多默认函数。注意，在某些特殊情况下，编译器不会创建默认函数。通用规则是，如果一个类有一个根据定义无法被构造、拷贝或销毁的成员，那么编译器就会删除相应的默认函数，正如我们在第\
  \ 19 章中所示。例如，如果类包含引用或 `const` 成员，编译器就不会生成拷贝赋值运算符。查看以下代码并阅读注释：\n\n编译器删除拷贝函数是有的，因为不允许更改\
  \ `const` 变量的值。让我们来进行简短的测试，找出以下程序中的错误：\n\n构造函数和其他函数一样，允许在类内定义，所以这没有错误。是否存在只接受一个整数参数的构造函数？没有，所以\
  \ `t1` 的声明是错误的。在使用默认构造函数时，一个常见的错误是加上括号。例如，看 `t2` 的声明。该声明表示 `t2` 是一个函数，返回一个 `T` 类的对象。\n\
  \n让我们检查 `t3` 的声明。调用了带有预定义整数值的构造函数。`str` 字段是私有的。允许通过调用 `strcpy()` 来访问它吗？是的，因为正如我们所说的，类的函数可以访问其私有成员。但是，`str`\
  \ 的大小足够容纳传递给它的字符串字符吗？不，正如你所知道的，这是一个严重的运行时错误。如果我们把 `str` 声明为字符串变量，我们就是安全的，就不需要关心参数的长度了。让我们来看\
  \ `t4`，你可能在那里给了一个错误的答案。本质上是 `T` 类使用者的程序，可以直接访问私有成员（例如相应的构造函数）吗？不能，编译器会针对未经授权访问私有成员的行为显示错误消息，因此\
  \ `t4` 的声明是不正确的。最后一个错误。记住，一个类只能有一个析构函数，且该析构函数不接受参数。因此，析构函数的声明是错误的。\n\n### 析构函数与内存释放\n\
  \n正如我们所见，具有自动存储周期的对象（例如示例 C.17.5 中的 `t`）的析构函数会在程序退出定义该对象的块时自动调用。如果对象具有静态存储存储期，它的析构函数会在程序终止时被调用。如果对象是用\
  \ `new` 运算符创建的，当使用 `delete` 运算符释放预留内存时，它的析构函数将被调用。此外，程序可能会创建临时对象来执行某些操作；程序在不再需要它们时会调用它们的析构函数。例如：\n\
  \n首先，调用默认构造函数并创建对象 `t`。通过下一条语句，编译器创建一个值为 3 和 4 的匿名临时对象，并将其内容拷贝到 `t`，即 `t.a` 变为 3，`t.b`\
  \ 变为 4。然后，调用它的析构函数，该临时对象被销毁。\n\n让我们来看一个演示析构函数最常用处的示例，即释放成员指针分配的内存。\n\n由于元素没有用某些特定值初始化，程序显示了它们的随机值。当对象被销毁时，为其预留的内存会自动释放，但成员指针可能预留的内存不会被释放。为了释放这些内存，我们可以使用析构函数。为了清楚起见，整数并不存储在对象中。值存储在\
  \ `new[]` 运算符预留的内存中，对象使用 `data` 字段访问该内存。析构函数使用 `delete[]` 运算符释放内存。提醒一下，当我们使用 `new`\
  \ 运算符分配内存时，我们使用 `delete` 运算符释放它；当我们使用 `new[]` 运算符时，我们使用 `delete[]` 运算符释放它。通常情况下，如果一个类分配了资源（例如内存），你可能需要定义一个析构函数来释放对象拥的所有资源。这使得程序更容易控制和维护。这种技术通常被称为资源获取初始化（RAII）。\n\
  \n我有一个问题。以以下方式编写 `show()` 是正确的吗？在看答案之前思考一下。\n\n显然不是。如果 `if` 条件为真，内存将被释放，当对象销毁时，析构函数将尝试释放已经释放的内存。为了避免这种错误，记住我们在第\
  \ 14 章中告诉过，当释放可能在别处释放的内存时，良好的做法是将相应的指针等于 `nullptr`（例如 `data = nullptr`）。现在，析构函数尝试释放内存就不会引起问题，因为正如我们知道的，对空指针应用\
  \ `delete` 运算符没有影响。\n\n另一个问题。假设我们添加以下函数：\n\n在 `main()` 中我们调用 `check()`，如下所示。代码正确吗？注意，这是一个重要的练习。\n\
  \n尽管 `check()` 没有问题，因为它没有做任何特殊操作，但它的调用创建了一个大问题。让我们看看为什么。调用 `check()` 时，对象 `t` 是按值传递的。`a`\
  \ 对象是 `t` 的拷贝，即 `a.data` 等于 `t.data`，`a.size` 等于 `t.size`。当 `check()` 时，`a` 对象的析构函数被调用并释放\
  \ `a.data` 指向的内存，这与 `t.data` 指向的是同一内存。所以，当调用 `show()` 时，内存已经被释放，程序无法正常工作。此外，当程序结束时会发生错误。然后，`t`\
  \ 对象的析构函数尝试释放已经释放的内存，这是错误的。\n\n很好，我们能做什么来避免这个问题呢？我们可以传递对象的引用或指针，这样就不会创建拷贝。例如：\n\n\
  我们继续，看以下程序。是否有任何错误？如果有，修复它们并告诉我输出是什么。\n\n\n\n\n一个类允许只包含析构函数，`f()` 为 `T` 对象预留内存并返回它，而\
  \ `main()` 首先调用 `f()` 然后释放返回的内存。我没有看到任何错误。析构函数被调用两次，一次是为了销毁 `f()` 中的 `t` 对象，另一次是在调用\
  \ `delete` 时销毁 `f()` 中动态创建的对象。因此，程序显示两次 Out。\n\n此外，对于包含 `string` 或 `vector` 成员的类，默认函数可以正常工作。例如，当我们拷贝一个拥有\
  \ `vector` 成员的的对象时，`vector` 类的拷贝函数会负责其所包含的元素的拷贝。当对象被销毁时，`vector` 类的析构函数会负责其元素的销毁。练习\
  \ C.17.5 就是这样一个例子。\n\n## this 指针\n\n每个成员函数（下文将看到的静态成员函数除外）都可以访问一个名为 `this` 的隐藏指针。需要记住的一点是，当调用成员函数时，`this`\
  \ 指向调用该函数的对象。例如，假设 `T` 类包含 `f()` 和 `g()` 函数、一个名为 `mem` 的整数成员，并且 `t` 是该类的一个对象。如果我们写：\n\
  \n编译器将 `t` 对象的地址传递给 `f()`，并且 `f()` 中的 `this` 指针被初始化为该地址。这就像编译器将调用解释为：\n\n`f(&t)`\
  \ 而声明解释为 `f(T ***const* this);`\n\n`this` 参数是为我们隐式定义的。在函数内部，对成员的任何直接访问都被假设为通过 `this`\
  \ 的隐式引用。例如：\n\n当访问 `mem` 时，编译器访问 `this` 所向对象的 `mem`。也就是说，编译器实际上将该访问翻译为 `this->mem`。我们可以像注释中说的那样写该语句，但这是没有必要的，因为编译器已经为我们完成了。调用\
  \ `g()` 时也发生相同的情况。\n\n`this` 指针最常用的用法是希望函数返回指向调用该函数的对象或对象本身的指针。例如，考虑以下程序：\n\n`cmp()`\
  \ 函数接受一个指向 `Test` 对象的指针作为参数，如果指针指向的对象（即 `t2`）的 `a` 值大于调用该函数的对象（即 `t1`）的 `a` 值，则返回该指针。否则，它返回\
  \ `this` 指针，该指针指向调用该函数的对象，即 `t1`。\n\n让我们在这个例子中看看 `this` 指针是如何工作的。正如我们所说，非静态成员函数通过一个参数列表中未显示的间接参数——即\
  \ `this` 指针——来访问调用该函数的对象。当函数被调用时，`this` 被初始化为调用者对象的地址。例如，通过 `t1.cmp()`，编译器将 `t1`\
  \ 的地址传递给 `cmp` 中未显示的 `this` 参数。简单来说，只需记住此点：\n\n在成员函数内部，对类中非静态成员（如 `a`）的任何引用都意味着使用\
  \ `this` 来访问该成员。也就是说，当 `cmp()` 引用 `a` 时，它间接的引用了 `this` 所向对象的 `a`。如注释所示，我们可以写 `this->a`\
  \ 代替 `a`，但这是没有的；编译器为我们完成了该翻译。此外，请注意我们可以省略变量 `p` 并写成：\n\n`t1.cmp(&t2)->a` 而不是 `p->a`。程序显示\
  \ 10。\n\n许多程序员更倾向于使用与成员名称相同的参数名称。我们可以通过使用 `this` 指针来实现这一点。例如，假设我们有一个类 `T`，带有整数成员\
  \ `a` 和 `b` 以及一个初始化它们的适当构造函数：\n\n由于 `this` 持有当前对象的地址，我们可以为参数和成员使用相同的名称，并使用 `this`\
  \ 来访问对象的成员。\n\n注意，我们不能改变 `this` 指针的值。例如，在 `cmp()` 内部写 `this = t;` 是错误的。`this` 的值是不可变的，它始终指向当前对象。特别地对于\
  \ `const` 函数，它的类型是 `const T*`，因此该函数不能修改对象的成员变量。现在你可以更好地理解为什么在之前讨论 `const` 函数的章节中，语句\
  \ `grd = 2;` 是不被允许的。它被翻译为 `this->grd = 2;`，这无法编译，因为 `this` 的类型是指向 `const` 的指针。\n\
