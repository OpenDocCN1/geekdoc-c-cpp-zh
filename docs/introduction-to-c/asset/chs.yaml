  \ or the move function.\n\n\n\n\n# 4. 如果你声明了移动构造函数或移动函数，编译器将不会生成默认的拷贝构造函数或拷贝函数。\n\
  \n因此，当我们设计一个类时，我们需要考虑以下问题：\n\n1. 我们需要定义自己的默认构造函数吗？如果默认构造函数不能满足我们的需求，或者我们定义了其他构造函数，那么可能需要。\n\
  2. 我们需要定义自己的拷贝构造函数或拷贝函数吗？如果我们的类包含指针，可能是需要的。\n3. 我们需要定义自己的析构函数吗？如果我们的类获取了资源（例如内存），那么可能需要。如果需要，我们可能必须定义自己的拷贝构造函数和拷贝函数。\n\
  4. 我们需要定义自己的移动构造函数或移动函数吗？为了更好的性能，可能是需要的。\n\n通常，如果一个类需要定义拷贝函数、拷贝构造函数或析构函数之一，它很可能也需要定义移动构造函数和移动函数。例如，如果类包含指针，除了前三个函数外，几乎可以确定你应该定义后两个以获得更好的性能，以便从即将消失的临时对象接接所有权。因此，“三规则”扩展到了“五规则”，也就是说，如果你定义了这五个函数中的任何一个，通常应该声明所有的它们。\n\
  \n注意，这条规则并不要求为所有五个函数提供显式定义。你可以使用 `=delete` 或 `=default` 语法，我们将在下一节中看到。另一方面，不要忘记你可能还可以选择避免在编写自己的函数时招致的麻烦和引入\
  \ bug 的风险。例如，如果你想实现一个动态数组，可以使用 `vector` 对象 own 指针。这让你免于定义自己的函数的任务。你已经看到，完成这项任务并不是一件容易的事。毕竟，添加的代码越多，引入\
  \ bug 的可能性就越大。\n\n## =default 和 =delete 的用法\n\nC++11 允许我们防止特定默认函数的使用。为了实现这一点，我们使用\
  \ `=delete` 语法。通常，在我们不希望编译器创建默认拷贝函数时使用它。例如：\n\n为了给你举一个使用 `=delete` 可能很有例子，假设你有一个\
  \ `Employee` 类，用于存储员工数据。由于每个员工都是唯一的，你可能希望防止将一个 `Employee` 赋值给另一个，以避免覆盖并保持其数据安全。为了防止这一点，你可以使用\
  \ `=delete` 语法移除相应的函数。回到过去，在 C++11 引入 `=delete` 之前，如果你想防止拷贝操作，典型的方法是创建自己的拷贝构造函数和拷贝函数，以便编译器不会创建默认的。你会将它们声明为\
  \ `private`，这样当类的用户尝试拷贝对象时，编译器会发出错误信息。此外，为了防止类的成员函数和友函数调用它们，你只需要声明而不定义它们，这样如果它们被调用，链接器将发出错误信息。\n\
  \n`=delete` 的另一个应用是我们想要防止不希望的类型转换时。例如：\n\n如果我们没有阻止传递 `double` 参数，构造函数将被调用，将进行转换，并且\
  \ `a` 将变  2。注意，我们也可以在普通成员函数中使用 `=delete` 语法。例如，向 `f()` 传递整数参数会导致编译错误。很好，现在告诉我，你认为以下代码是正确的吗？\n\
  \n由于析构函数被移除，`T` 对象无法被销毁。因为编译器不允许创建没有析构函数的类型对象，它会抛出错误。\n\nC++11 还引入了 `=default` 语法。该语法用于我们想要显式说明将使用默认函数时。例如：\n\
  \n有些人可能更喜欢这种语法，以明确将使用哪些默认函数。其他人则可能不愿这样做，因为它们的缺失意味着它们无论如何会被使用。注意，如果你想定义一个空的默认构造函数，出于技术原因，最好倾向于使用\
