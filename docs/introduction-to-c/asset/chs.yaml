  \ 语句改为\n\n### C.12.11 编写一个程序，读取 50 个国家的名称（每个少于 100 个字符）以及访问这些国家的游客人数。程序应使用数组存储数据。然后，程序应显示每个国家的年度访问人数。在结束前，程序应显示访问人数最多的五个国家（检查是否存在多个国家访问人数并列的情况）。\n\
  \n**注释：** 为了存储名称，我们可以像 C.12.6 那样使用向量对象而不是二维数组。正如我提到的，我选择这种方法是为了习惯两种方法。\n\n### 快速排序算法\n\
  \n快速排序算法是一种*分治法*类型。它是一种非常流行的算法，也是各种排序应用的最佳选择。它的操作基于将数组分为两个部分并对每个部分单独排序。首先，选择划分元素（即\
  \ `a[i]`）。根据以下规则重新排列数组：\n\n1. a[i] 设置在它的最终位置。\n2. 左侧子数组 `a[l], … a[i-1]` 中的元素不大于\
  \ `a[i]`。\n3. 右侧子数组 `a[i+1], … a[r]` 中的元素不 `a[i]`。\n\n此过程对每个子数组递归重复，直到这些部分变成单个元素。\n\
  \n\n\n\n**注释：** 为了查看算法是如何运作的，假设用户输入以下值：2, 15, 4, 1, 7, 20, 5。让我们跟踪 `partition()`\
  \ 的第一次调用。我们有 `i=l=0`，`j=r-1=5`，`v=a[6]=5`。第一个循环执行左扫描，并在 `i` 变为 `1` 时停止（因为 `a[1]\
  \ > 5`）。第二个循环执行右扫描，并在 `j` 变为 `3` 时停止（因为 `a[3] < 5`）。交换这两个元素，数组转变为：2, 1, 4, 15, 7,\
  \ 20, 5。\n\n左扫描继续并在 `i` 变为 `3` 时停止（因为 `a[3] > 5`）。右扫描继续并在 `j` 变为 `2` 时停止（因为 `a[2]\
  \ < 5`）。由于 `i > j`，无限循环终止。交换 `a[3]` 和 `a[6]`，数组转变为：2, 1, 4, 5, 7, 20, 15。注意 `5`\
  \ 已设置在它的最终位置，其左侧的所有元素都较小，而其右侧的所有元素都较大。函数返回 `i` 的值，即 `3`。然后，使用递归对左子数组（位置 0 到 2）和右子数组（位置\
  \ 4 到 6）重复相同的步骤。\n\n在结束本章之前，我想指出，尽管标准库提供了许多现成可用的算法（例如 `find()`），但具备一些自己实现算法的经验是非常重要的。这不仅是因为你可能需要这些知识来编写自己的算法或理解他人编写的代码，还因为你可以了解它们是如何实现的。例如，了解一个排序算法是如何实现的，比在完全不了解的情况下使用\
  \ `sort()` 函数对你的编程专业知识更有帮助。通过本章的实现示例，我试图给你们带来这种“知其门道”的感觉。\n\n## 未完成的练习\n\n- **U.12.1**\
