  \ 输入\n\n在本节中，我们将学习如何获取输入数据，将其存储在变量并在程序中使用。与 `cout`一样，`cin` 是 `istream` 的对象。默认情况下，`cin`\
  \ 与键盘关联，但它也可以与文件或其他设备关联。对于了解的人来说，`cin` 重载了 `>>` 运算符来读取数据。此外，我们将在第 18 章中看到，我们可以像使用基本类型（如\
  \ `int`）一样使用 `cin` 获取自定义类型（如 `class`）的数据。来看示例：\n\n执行 `cin` 语句时，程序等待用户输入一个值。通常，`cout`\
  \ 语句位于 `cin` 之前，以指示用户输入什么类型的数据。一旦用户输入整数并按下 *Enter*，该值将存储在 i 中。因为在按下 *Enter* 之前值不会被存储，用户可以更改它。例如，如果用户输入\
  \ 5 并按下 *Enter*，i 将变为 5。然后，程序等待用户输入新值 j。例如，如果用户输入 1.23 并按下 *Enter*，j 将变为 1.23。\n\
  \n\n\n\n\n`>>` 运算符会跳过数值之前可能存在的任何空白字符（即空格、制表符或换行符），并继续读取直到遇到非空白字符。如果它遇到一个与变量类型不匹配的字符，它将停止读取。未读取的字符将留在\
  \ `cin` 中。例如，如果用户输入值 `5` 和 `1.23ABC`，那么 `ABC` 字符将留在 `cin` 中，而 `A` 将是下一个 `cin` 语句读取的第一个字符。\n\
  \n如果我们想指定要读取的整数的进制，可以使用 `hex`、`oct` 和 `dec` 操纵符。例如，如果我们写：\n\n`cin >> hex >> i;`\n\
  \n且用户输入 `f`，那么 `i` 将变为 `15`。\n\n对于熟悉 C 语言中 `scanf()` 的人，也可以使用它，但它的用法像 `printf()`\
  \ 一样，复杂、不安全且不可扩展。这里有一个常见错误的错误示例：\n\n```\nscanf(\"%d\", &i);\n```\n\n对于那些仍然倾向于使用\
  \ `printf()`/`scanf()` 而不是 `cout`/`cin` 的人，即使你知道它们所有的特性，也该停止使用它们了。把它们放进编程记忆的抽屉里。\n\
  \n### 读取特定的输入格式\n\n通常，程序只是要求用户输入一些值。然而，在某些情况下，可能会要求用户以特定格式输入数据。例如，一个要求以日/月/年格式输入日期程序。获取我们感兴趣的值并将其分配相应变量的一种方法是使用额外的变量来提取我们不感兴趣的字符。例如，变量\
  \ `ch` 被用于提取 `/` 字符：\n\n```\ncin >> day >> ch >> month >> ch >> year;\n```\n\n在这个示例中，用户必须按照预期的形式输入日期（例如\
  \ 13/5/2030），否则代码将无法工作。\n\n### 检查输入流状态\n\n不深入细节，但知道你可以检查输入数据是否导致 `cin` 语句失败是有用的。一种方法是使用成员函数\
  \ `good()`。如果没有发生错误，它返回一个非零值。如果发生了错误，你可以使用成员函数 `clear()` 来恢复流的状态。例如，以下程序检查 `good()`\
  \ 的返回值，以确保整数值存储在 `i` 中。不要被这个程序吓到，看一眼就好，但只有在学习了语言基础后才能理解它。\n\n例如，如果用户输入值 `z123`，`good()`\
  \ 将返回零，内部循环将清除 `cin` 中留下的字符以便读取新值。注意，有多种处理不可接受的输入值的变体；这只是一个简单的示例。\n\n为了简单起见，我们假设用户输入是有效的，在整本书中不会检查输入流的状态。然而，请记住，一个健壮的程序应该始终检查它以验证没有发生读取失败。我们将在第\
  \ 24 章 中进行讨论。\n\n*`istream` 和 `ostream` 类提供了许多读取和输出数据的替代方案。对其所有能力的完整描述超出了本书的范围。更多细节，请参阅您的编译器文档。*\n\
