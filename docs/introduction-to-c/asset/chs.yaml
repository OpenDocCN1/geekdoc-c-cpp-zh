  \ 34, 55, 89, 144, …… 例如，`F(7) = 13`，它是之和。\n\n\n\n\n\n### C.11.20\n编写一个函数，接收一个数组作为参数，并检查它是否包含重复值。如果是，该函数应返回指向出现次数元素的指针，否则返回\
