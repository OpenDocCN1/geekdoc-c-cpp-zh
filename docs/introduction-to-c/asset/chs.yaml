  \ 和 `catch` 块定义了它们自己的作用域。这意味着，如果一个名称要在两个块中使用，那么它必须在它们之外声明。例如：\n\n为了简单起见，为了向你们介绍抛出和捕获异常的机制，我使用了基本类型来抛出异常。然而，在实际程序，典型的选择是抛出类对象，我们稍后会看到。\n\
  \n### noexcept 指定符\n\nC++98 提供了指定函数是否可能抛出异常以及它们的类型是什么的能力，即异常规范。例如：\n\n`f()` 创建 `int`\
  \ 和 `double` 类型的异常，而 `g()` 则没有。\n\n尽管这看起来是一个很有用的特性，但异常规范在实践中的效果并不好，并在 C++11 中被弃用。让我们多讨论一下为什么。原则上讲，异常规范还应该包括从其他嵌套函数调用可能抛出的异常。在这个例子中，`f()`\
  \ 告知读者它可能抛出 `int` 和 `double` 异常。然而，`f()` 调用另一个函数，该函数又调用另一个函数，以此此类推，这可能会创建异常。在这种情况下，它们的类型也必须被添加。如果是你编写的函数，你知道它们的类型并可以添加它们。但如果这些函数是由他人实现的（例如库函数），你就需要找到可能的异常，这可能是非常困难或不可能的，如果异常没有被指定。无论如何，在实践中，这一特性被发现存在问题，C++11\
  \ 弃用了它。C++17 最终删除了它；它保留了 `throw()` 作为我们即将看到的 `noexcept` 的弃用别名。\n\nC++11 委员会认为指示函数不抛出异常是有用的，并为此引入了\
  \ `noexcept` 指定符。通常情况下，如果我们知道一个函数不抛出异常，将简化调用它时需要编写的代码，因为我们不需要添加处理异常的代码。它还可以允许编译器执行某些优化。例如：\n\
  \n关于语法，在类成员函数中，`noexcept` 关键字添加在 `const` 之后，在 `final`、`override` 或 =0 饰符之前（如果是虚函数的话）。如果虚函数声明为\
  \ `noexcept`，则派生类中的函数重写也必须是 `noexcept`。\n\n请注意，当你将一个函数声明为 `noexcept` 时，它可能会刻意或无意地抛出异常，或调用另一个抛出异常的函数。例如，假设\
  \ A 类如下：\n\n`vector` 的构造函数可能无法为 `v` 的所有元素找到内存并抛出异常，尽管该函数被声明为 `noexcept`。\n\n\n\n\
  \n\n因此，在函数声明中使用 `noexcept` 仅仅向阅读代码的人以及编译器表明，该函数不打算抛出异常。然而，它并不能实际上阻止函数抛出异常或调用另一个可能抛出异常的函数。事实上，只有当你确定该函数所调用的所有函数（无论是直接还是间接的）也都声明为\
  \ `noexcept` 时，最好才将函数声明为 `noexcept`。在实践中，编译器允许 `noexcept` 函数包含 `throw` 语句或调用另一个可以抛出异常的函数。如果抛出了异常，它必须在该函数内部的某处被捕获而不重新抛出。如果没有被捕获，异常将不会传播到调用函数，而是导致程序终止。本质上，`noexcept`\
  \ 防止了异常离开函数。也就是说，如果我们写道：\n\n编译不会失败；请注意，编译器可能会发出警告信息。但是，如果执行了 `throw`，异常将不会传播，由于它没有被捕获，程序将终止。当然，你可以将函数代码放置在\
  \ `try` 块中。例如：\n\nC++11 还引入了 `noexcept` 运算符。它是一个一元运算符，如果其操作数可能抛出异常，则返回 `true` 或\
  \ `false`。与 `sizeof` 一样，`noexcept` 不求值操作数。例如：\n\n注意，`noexcept` 运算符的返回值可以作为参数，用于声明函数是否可能抛出异常。例如：\n\
  \n### 讨论异常\n\n现在你已经对异常有了初步了解，让我们简要讨论一下它们可能有多用。人们可能会问，为什么不使用传统技术，即让函数返回与错误对应的特定值，并让调用函数检查返回值并处理错误呢？当然我们可以这样做，但这并不总是可行的。例如，函数返回的整数值可能都是有效的，没有\
  \ 1 一个值可以用于错误编码。但即使是可行的，这些检查也应该在每次函数调用后进行，这不仅是一项繁琐的任务，还可能显著增加程序的大小。通过将函数调用放置在 `try`\
  \ 块中，`catch` 块只需要定义一次。\n\n有时我们无法返回一个值。例如，当我们创建一个对象时，如果类构造函数发生错误（例如，初始化值错误），则没有返回值可以检查。我们如何获这些错误呢？有人可能会说，我们可以在类中定义一个私有变量来保存对象的状态，每次构造对象时，我们都可以用公共函数检查它的值。如果它的值（例如是\
  \ 0），则意味着对象的构造成功；否则，它的值表示错误代码。与其做所有这一切，让构造函数抛出一个异常并通知我们失败要简单得多。关于析构函数，通常，析构函数不应该抛出异常。如果它抛出了异常，它应该自己捕获并处理，否则可能会出现内存泄漏和程序不可预测的行为。\n\
  \n在某些情况下，错误必须沿着函数调用链传递给原始调用者。我们将在下一节中看到，如果嵌套函数中发生错误（例如，`a()` 调用 `b()`，`b()` 调用 `c()`，`c()`\
  \ 调用 `d()`，而错误发生在 `d()` 中），我们可以抛出异常，并立即通知第一次调用的函数（例如 `a()`）失败了。这种使用每个函数的返回值传递给其直接调用者，一直向上传递给第一个调用者（例如\
  \ `a()`）的传统方法需要更多的代码，并使程序更难以阅读、更复杂、低效且容易出错，因为程序员可能会忘记转发某些返回值。\n\n另一方面，明确的是，我并不总是推荐使用异常。是的，将错误检测与处理分离可以简化并提高程序的可读性，但这是一条通用规则，并不一定适用于所有情况。它并不是非黑即白的，也就是说，并不是永远不使用返回码或永远不使用异常。\n\
  \n每个程序都有自己的需求。例如，如果程序接受用户输入，并且输入了错误数据，那么抛出异常并不是严重问题。程序可以简单地丢弃输入并提示用户输入新数据。在这种情况下，处理错误输入的代码与处理整个数据输入过程的代码结合在一起。毕竟，*exception*（异常）这个词的选择意味着它用于信号异常错误，而不是微小错误。在另一个例子中，当潜在失败是正常的时候，使用\
  \ `if-else` 条件检查返回值的传统方法完全足够了。当然，你可以同时使用返回值和异常，没有一种规则适用于所有应用，这由你决定。如果混合使用两者有助于代码的理解和维护，那可能就是最佳实践。\n\
  \n此外，每个程序员对如何处理错误可能会有不同的想法。例如，你可能认为某个错误非常严重，无法解决，因此没有理由抛出异常。所以，你决定显示一条诊断信息或将其写入文件，并调用函数（例如\
  \ `exit()`）来结束程序。当然你可以这样做，而其他人可能决定抛出一个异常，并让上层来处理该错误。\n\n然而，在大型应用程序的情况下，你很可能必须使用异常机制，例如如果你正在使用会抛出异常的库。通常，在分成多个部分由不同程序员小组实现的大型应用开发中，为了更好地控制和维护程序对于发生在不同部分且无法本地处理的严重错误，最灵活、可靠且有效的错误管理策略是异常，这样错误可以在中心点（如\
  \ `main()`）进行转发和处理。\n\n#### 带类型的的异常\n\n除了使用基本数据类型（如 `int`）创建异常外，异常也可以抛出一个对象。通常，这是惯常的选择。这种选择的一个优势是，我们可以使用不同的对象来区分创建异常的不同类型的问题。另一个优势是，对象可以包含识别导致异常的原因所需的任何信息。例如，让我们修改第一个程序，让异常抛出一个对象：\n\
  \n首先，我更改了代码，如果用户输入有效密码，`break` 语句将终止循环并由程序显示。`continue` 语句是不必要的，因为在最后一个 `catch`\
  \ 块之后没有代码。`check_pswd()` 抛出一个类型为 `int` 的异常，以及另外两个类型为 `Err_Rpt` 对象的异常。每个对象都用指示错误类型的值初始化。这些异常被相应的\
  \ `catch` 块捕获，该块调用传递对象的 `show()` 方法来显示其成员中包含的信息。\n\n注意，除了 `int` 异常，我们也可以抛出另一个 `Err_Rpt`\
  \ 类型的异常。例如，我们可以写 `throw Err_Rpt()`，其中传递的对象不包含任何信息。我只是想向你展示一个结合了基本类型和自定义类型异常的示例。在大型应用程序中，由于可能来自不同库的异常，选择自己的类型比基本类型（例如整数值）更安全，以避免某些库使用相同异常值的情况。\n\
  \n\n\n\n\n让我问你，我们是否可以传递对象而不是引用并编写 `catch(Err_Rpt err);`，或者传递一个基本类型的引用并编写 `catch(int&\
  \ code);`。当然可以，没问题。事实上，当抛出异常时，即使指定了引用，实际传递的也是对象的副本。而这本该是这样的，因为 `Err_Rpt` 对象在 `check_pswd()`\
  \ 结束后就不再存在了。特别是，当抛出一个异常对象时，由于 `try` 块被退出且它将超出作用域，它首先会被拷贝到**临时对象中，然后被销毁。这就是为什么在 `try`\
  \ 块内部抛出局部对象是没有问题的。请注意，在多层级异常系统中，由于对象在最终被捕获之前可能会被多次拷贝，因此最好不要包含过多的信息。要问的逻辑问题是，既然对象被拷贝了，为什么还要使用引用呢？我将在下一节回答这个问题。\n\
