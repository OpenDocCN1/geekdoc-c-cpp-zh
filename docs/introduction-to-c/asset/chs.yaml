  \ `strlen()` 不能修改字符串。\n\n\n\n\n作为 `strlen()` 的用法示例，请告诉我以下代码的输出结果：\n\n由于数组名可以作为指向其第一个元素的指针——我知道我已经写过很多次了，我只是想确保你已经\
