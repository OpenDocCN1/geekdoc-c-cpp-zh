  \ sequence）*。因为在过去，某些系统不支持以下 ASCII 字符，因此定义了相应的三重符号序列来表示它们。所有的三重符号都以 `??` 开头。\n\n\
  因此，即使键盘缺少这些字符，也可以编写等效的 C++ 程序。例如，以下程序的输出是什么？\n\n预处理器将三重符号替换为相应的 ASCII 字符，程序被翻译为：\n\
  \n因此，程序输出 3。C++17 从语言中删除了三重符号。然而，编译器可能继续支持三重符号替换。\n\n### 读取字符\n\n有许多方法从输入流中读取字符。最常见的是使用\
  \ `get()` 函数，它是 `istream` 类的成员。对于有 C 语言经验的人来说，`get()` 的工作类似于 `getchar()`。注意也可以使用\
  \ `getchar()`。`get()` 在用户按下 *Enter* 键时开始读取字符。如果执行成功，它将读取的字符作为 `int` 返回。如果流中没有更多字符，`get()`\
  \ 返回一个在 `iostream` 中定义的特殊常量值，名为 `EOF`（文件结束）。该值与任何有效的字符值都不同，因此它不会与普通字符混淆。尽管 `EOF`\
  \ 通常是 -1，但最好使用 `EOF`，这样你的程序就不会依赖于具体的数值。\n\n例如，如果用户输入 abc 并按下 *Enter*，第一次调用 `get()`\
  \ 返回 'a'，第二次返回 'b'，第三次返回 'c'，第四次返回 '\\n'如果再次调用，程序将“阻塞”直到用户输入新字符并再次按下 *Enter*。下一个程序显示并统计输入的字符，直到用户按下\
  \ *Enter*。\n\n`get()` 逐个返回输入字符，直到遇到 '\\n' 字符。每个字符都存储在 `ch` 中，并与 EOF 进行测试以确定是否有效。\n\
  \n注意 `get()` 的返回值应该存储在 `int` 变量中，而不是 `char`。原因如下：假设 `ch` 定义为 `char`。如果 `char` 类型是有符号的且读取到字符\
  \ 255，它将被存储为 -1。结果是测试该值是否等于 EOF 的条件变为为假，循环停止。如果 `char` 类型是无符号的，`get()` 返回 EOF。\n\
  \n如果你好奇为什么我们不象读取数值值那样用 `cin` 读取字符，原因是空白字符（例如空格）默认会被跳过。例如：`cin >>`\n\n由于空白字符被跳过，如果用户输入空格并按下\
