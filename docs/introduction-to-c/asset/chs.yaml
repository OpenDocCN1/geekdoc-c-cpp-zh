  \n指针是该语言中最重要的部分之一。它是访问内存地址并直接操作内存的机制，从而使你更接近硬件，这对于更完整地理解事物的工作原理至关重要。本章将使用数值变量的指针向你介绍指针概念。文中将介绍指针与数组之间的紧密关系。你还将学习如何使用指针数组和函数指针。指针的其他主要应用，例如在函数中传递参数、处理字符串、构建动态数据结构、实现多态，以及指向其他数据类型的指针，将在接下来的章节中逐步介绍。你不仅应该学会学习指针以便直接处理内存并获得对内存操作的实际理解，而且为了能够使用指针阅读大量的真实世界代码。\n\
  \n### 指针与内存\n\n在现代计算机中，主内存由数百万个连续编号的内存单元组成，每个单元存储 8 位信息，并由唯一的数字（称为内存地址）进行标识。例如，在一个具有\
  \ N 字节内存的计算机中，每个单元的内存地址都是从 0 到 N-1 的唯一数字，所示：\n\n![图说明了内存地址与内存内容之间的关系。](img/fig8_1.jpg)\n\
