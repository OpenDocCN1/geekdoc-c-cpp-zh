  \ 100 个字符的字符串和一个字符并调用该函数。不要急着看答案，试一下。\n\n### C.11.35 有时在数学中，证明某些看起来简单的问题是非常困难的，数学家洛塔尔·科拉拉茨（Lothar\
  \ Collatz）最初提出的那个问题就是如此。想一个正整数 `n` 并执行以下算法：\n\n1. 如果它是偶数，将其除以二（`n/2`）。\n2. 如果它是奇数，将其乘以三倍并加一（`3n+1`）。\n\
  \n对每个产生的数字重复相同的步骤，你将得到一个令人惊讶的结果：对于你选择的任何整数，你最终将得到 …1！！！！例如，如果我们选择数字 53，产生的数字是：`53\
  \ -> 160 -> 80 -> 40 -> 20 -> 10 -> 5 -> 16 -> 8 -> 4 -> 2 -> 1`\n\n这个数学问题广为人知的科拉拉茨猜想（Collatz\
