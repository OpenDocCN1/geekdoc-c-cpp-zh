  \n指针是该语言中最重要的部分之一。它是访问内存地址并直接操作内存的机制，从而使你更 way 硬件，这对于更完整地理解事物的工作原理至关重要。本章将使用数值变量的指针向你介绍指针概念。文中将介绍指针与数组之间的紧密关系。你还将学习如何使用指针数组和函数指针。指针的其他主要应用，例如在函数中传递参数、处理字符串、构建动态数据结构、实现多态，以及指向其他数据类型的指针，将在接下来的章节中逐步介绍。你不仅应该学会学习指针以便直接处理内存并获得对内存操作的实际理解（这在未来无疑会被证明是有用的），而且为了能够使用指针阅读大量的真实世界代码。\n\
  \n### 指针与内存\n\n在现代计算机中，主内存由数百万个连续编号的内存单元组成，每个单元存储 8 位信息，并由唯一的数字（称为内存地址）进行标识。例如，在一个具有\
  \ N 字节内存的计算机中，每个单元的内存地址都是从 0 到 N-1 的唯一数字，所示：\n\n![图说明了内存地址与内存内容之间的关系。](img/fig8_1.jpg)\n\
  <details><summary>无编号图 1 详细描述</summary>\n\n图包含两列：内存地址和内存内容。内存地址单元从上到下编号为 0 到 n-1。内存内容由几个矩形框堆组成。与内存地址\
  \ 5000、5001、5002 和 5003 关联的内存内容分别为 10、0、0 和 0。其余的框是空的。</details> \n\n当声明一个变量时，编译器会预留所需的连续字节来存储其值。如果一个变量占据超过一个字节，则变量的地址就是第一个字节的地址。例如，通过声明\
  \ `int a = 10;`，编译器预留四个连续的未使用字节（例如地址 5000–5003），并在那里存储值 10，假设该值的低位字节存储在低地址字节中（*小端*\
  \ (little-endian) 架构）。编译器将变量名与其内存地址关联。当在程序中使用该变量时，编译器会访问其地址。例如，通过语句 `a = 3;`，编译器知道\
  \ `a` 的内存地址是 5000 并将其内容设置为 3。\n\n### 指针声明\n\n指针变量是一个可以存放内存地址的变量，例如另一个变量的内存地址。要声明指针，我们写道：\n\
  \n```\nint *ptr;\n```\n\n所示，`*` 字符必须位于指针变量名之前。例如，通过声明：`int *ptr;` `ptr` 被声明为指向 `int`\
  \ 类型的指针变量。因此，`ptr` 可以存放 `int` 变量的内存地址。在一般情况下，如果类型是 *T*，则 `T*` 的类型是“指向 *T*”。指针变量可以与其他相同类型的变量一起声明。例如：\n\
