  6. 删除学生。程序应读取学生的代码，如果已注册，则移除与该学生对应的节点。\n7. 程序退出。\n\n**注释：** 如果你想更改第一个菜单选项，将新学生的数据插入列表开头而不是末尾，请将\
  \ `add_list_end()` 替换为栈程序中提供的 `add_stack()`。在这种情况下，不需要尾指针。\n**C.14.11** 考虑之前的链表。编写一个函数，以两个学生的代码作为参数，如果它们存储在列表中，该函数应交换它们的成绩并返回\
  \ 0。否则，函数应返回 -1。\n**C.14.12** 下列程序的输出是什么？\n\n**注释：** 该程序是另一种列表——循环双向链链的简单实现示例，其中每个节点除了指向下一个节点的指针外，还包含另一个指向上一个节点的指针。注意，最后一个节点的\
  \ `next` 指针指向列表头部，而 `head` 的 `prev` 指针指向最后一个节点。\n\n## 二叉搜索树\n\n为了按顺序组织数据，通常使用一种名为“树”（tree）的灵活数据结构。这种类型的结构出现在许多现实案例中，如家谱、组织结构图或计算机文件夹系统。有许多类型的树，在这里我们将描述二叉搜索树的基本操作。\n\
  \n让我们简要介绍一些基础概念。带有根（root）的树是连接节点的集合。只有一个节点没有父节点，即顶部节点。该节点被称为根。除了根之外，每个节点只连接一个上方的节点，即父节点。直接连接在下方的节点是子节点。每个节点最多有两个子节点的树被称为二叉树（binary\
  \ tree）。这两个部分分别称为左子树和右子树。每个节点都有一个键，且该键：\n\n1. 大于或等于左子树中所有节点的键且\n2. 小于或等于右子树中所有节点的键\n\
  \n被称为二叉搜索树（binary search tree）。使用这种结构的主要优点是插入和搜索值等关键操作性能很高。相关的排序和搜索算法可以非常高效。下图展示了一个二叉搜索树的示例。\n\
  \n![二叉搜索树由五个节点组成。](img/fig14_4.jpg)\n<details><summary>无编号图 4 详细描述</summary>\n\n\
  顶部节点标记为 9，连接到两个节点：左侧的节点 6 和右侧的节点 18。节点 6 进一步连接到两个节点：左侧的节点 4 和右侧的节点 8。</details>\
  \ \n\n让我们看看二叉搜索树最基本操作的一些实现示例。假设每个节点由以下结构表示：\n\n我们将存储不同的键。指针指向节点的子节点。如果缺少子节点，指针则为\
  \ `nullptr`。\n\n\n\n\n\n`add_node()` 在树中创建并插入新节点，前提是没有其他节点具有相同的键值。该函数将插入的键与被检查节点的键进行比较，并使用递归来进入正确的子树。例如，假设用户输入了数字：9,\
  \ 6, 18, 4, 和 8。\n\n> **插入 9**: 由于根节点为 `nullptr`，函数创建了树的根节点并将其指针赋值为 `nullptr`。根节点的地址返回给主程序。\n\
  \n> **插入 6**: 因为 6 小于 9，该函数以 `p->left` 指针作为参数进行递归调用。由于它是 `nullptr`，递归调用创建一个新节点（在根节点的左侧）并将其指针赋值为\
  \ `nullptr`。该新节点的地址被返回，且 `p->left` 等于该值。函数在返回根指针后终止。\n\n> **插入 18**: 与节点 6 类似，不同之处使用了\
  \ `p->right` 指针。\n\n> **插入 4**: 因为 4 小于 9，该函数以 `p->left` 指针作为参数进行递归调用。由于它是 `nullptr`\
  \ 且 4 小于 6，则以节点 6 的左指针作为参数进行第二次递归调用。由于它是 `nullptr`，第二次调用创建一个新节点，并在第一次递归调用处返回其地址。该值存储在\
  \ `p->left` 中，此时 `p` 指向节点 6。第一次调用在返回 `p` 后终止。接下来，函数在返回根指针后终止。\n\n> **插入 8**: 与节点\
  \ 4 类似，不同之处第二次递归调用的参数是节点 6 的右指针。\n\n通过这种方式，树形成了如上一图所示的二叉搜索树形式。\n\n在树中插入键的过程与搜索键的过程相似。尝试完成练习\
  \ U.14.16 来编写一个递归搜索函数。或者，这里有一个非递归的实现。事实上，这是我的偏好；请记住我们在第 11 章 相应章节中讨论过的递归性能问题。\n\n\
  代码比较键并选择合适的子树。如果到达底层，意味着未找到该键。既然你已经了解了这种方法，尝试练习 U.14.18 在不使用递归的情况下实现 `add_node()`。为了帮助你，请使用上面的代码找到新节点必须连接的节点，即父节点。然后创建新节点并将其与父节点连接。\n\
  \n作为一个新练习题，假设调用了 `show_inorder()`。尝试弄清楚它在做什么并解释它的工作原理。花点时间思考，不要急着看下一页的答案。\n\n你立刻翻页了，对吧？回去重试一下。测试你的技能是值得的，看看你是否能解码多次递归。\n\
  \n让我们看看该函数是如何工作的。在第一次递归调用中，`p->left` 指向节点 6。由于它不是 `nullptr`，因此进行了第二次递归调用，此时 `p->left`\
  \ 指向节点 4。进行了第三次调用（此时 `p` 指向 4），由于 `p->left` 为 `nullptr`，函数返回。\n\n第二次递归调用输出 4，并以\
  \ `p->right` 为参数进行了一个新调用。由于它是 `nullptr`，函数返回。第二次递归调用结束，我们继续第一次调用。\n\n第一次调用输出 6，并以\
  \ `p->right` 为参数进行了一个新的递归调用。递归执行时 `p` 指向 8。新的递归因为 `p->left` 为 `nullptr` 而返回。程序输出\
  \ 8，下一次递归返回，因为 `p->right` 为 `nullptr`。\n\n我们在哪儿？我们迷路了。如果我没记错，我们正在检查 `p->left` 指向节点\
  \ 6 的第一次递归，而该递归刚刚结束。程序输出 9，并以 `p->right` 为参数进行了一个新的递归调用。像之前一样，程序输出 18，函数结束了……终于。\n\
  \n本质上，`show_inorder()` 执行的是中序遍历。具体来说，对于每个遍历到的节点，它首先访问左子树的节点，然后是当前节点，最后是右子树的节点。结果是，函数按升顺序显示键值。\n\
  \n同样，`show_preorder()` 执行前序遍历。具体来说，对于每个遍历到的节点，它首先访问节点本身，然后访问左子树的节点，最后访问右子树的节点。\n\
  \n`show_postorder()` 执行后序遍历。对于每个遍历到的节点，它首先访问左子树的节点，然后访问右子树的节点，最后是当前节点。\n\n`delete_tree()`\
  \ 使用后序方法来释放分配的内存。对于每个遍历到的节点，首先释放其两个子树节点的内存，然后释放节点本身的内存。在之前的示例中，节点按以下顺序释放：4, 8, 6,\
  \ 18 和 9。\n\n遍历树的另一种方法是从根节点开始按层序访问节点。在每一层中，节点从左到右访问。在之前的示例中，节点的访问顺序为：9, 6, 18, 4,\
  \ 和 8。\n\n## 习题\n\n**C.14.13** 添加一个递归函数显示树中的最小键值。注释：在二叉搜索树中，最小值存储在最左节点。然后递归结束。要找到最大值，只需将指针改为\
