  \ `test()`：\n\n```c\nvoid test(int *begin, int *end);\n```\n\n并在调用它时写道：`test(a,\
  \ a+5);`\n\n### 传递数组段\n\n为了安全起见，和使用普通数组一样，我们确保我们所进行的所有操作都在数组的范围内。注意，如果我们愿意，可以传递整个数组而不是指向其第一个元素的指针。我们将在第\
  \ 16 章 中看到一个带有引用的示例。\n\n### const\n\n为了安全起见，和使用普通数组一样，我们确保我们所进行的所有操作都在数组的范围内。注意，如果我们愿意，可以传递整个数组而不是指向其第一个元素的指针。我们将在第\
  \ 16 章 中看到一个带有引用的示例。\n\n### 传递 vector 对象\n\n正如我们在第 7 章 中提到的，为了更大的安全性和灵活性，使用 `vector`\
  \ 类比普通数组更好。当然，我们可以在函数中传递 `vector` 对象。例如，尝试以下练习题。\n\n\n\n\n编写一个函数，接收一个包含学生考试成绩的向量对象以及两个分数（例如\
  \ `a` 和 `b`）作为参数，并返回 `[a, b]` 范围内分数的平均值。编写一个程序，读取学生人数，创建一个向量对象，读取他们的成绩并存储在其中。然后，读取两个分数\
  \ `a` 和 `b` 并调用该函数显示平均值。该程序应强制用户输入一个小于或等于 `b` 的值。\n\n我认为这个程序逻辑很清晰，除了向量参数中的 `&` 以外。当我们在第\
  \ 16 章中讨论引用时，你就会理解它的作用了。为了让你有一个直观的感受，如果我们不使用它，向量将按值传递，因此其元素会被复制，这对于一个包含许多元素的向量来说可能是非常耗费时间的。我使用\
  \ `const` 是为了向你展示我们可以像处理普通数组一样防止修改。\n\n## 练习题\n\n### C.11.10 下面程序包含错误吗？如果没有，它的输出是什么？\n\
