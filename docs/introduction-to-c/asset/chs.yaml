  \ 替换为 `int`，`Y` 替换为 `double`。\n\n### 默认参数值\n\n在类模板中，我们可以为参数指定默认值。例如：\n\n它的工作原理与函数参数的默认值相似。例如，如果我们省略\
  \ `T2` 的类型并写 `Group<double> g;`，则 `T2` 的类型将是 `int`。如果类模板为它的所有参数提供了默认值，并且我们想要使用所有参数，则使用空\
  \ `<>`。例如：\n\n如果我们写 `Group<> g;`，`T1` 的类型将是 `string`，`T2` 的类型将是 `int`。\n\n我们也可以为非类型参数指定默认值。例如：\n\
  \n如果我们写 `Grades<int> g;`，`T` 的类型将是 `int`，`s` 等于 20。\n\n### 静态成员\n\n类模板可以包含静态成员。但注意，类的每个版本都包含自己的静态成员。例如：\n\
  \n类的每个版本都有自己的静态成员实例。也就是说，`A<int>::cnt` 与 `A<double>::cnt` 不同。所有的 `A<int>` 对象共享同一个\
  \ `A<int>::cnt` 变量和 `A<int>::f()` 函数，而 `A<double>` 对象共享相同的 `A<double>::cnt` 变量和\
  \ `A<double>::f()` 函数。当创建 `A<int>` 和 `A<double>` 类时，相应的 `cnt` 变量被初始化为 0。因此，因为创建了三个\
