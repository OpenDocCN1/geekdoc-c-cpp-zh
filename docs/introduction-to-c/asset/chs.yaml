  \ `strcmp()` 的实现示例。\n\n### C.11.12 下面程序的输出是什么？\n\n**答案：** `f()` 的调用是由内向外执行的。当第一次调用\
  \ `f()` 时，我们有 `ptr = a = &a[0]`。因此，语句 `(*ptr)++` 等于 `a[0]++`，且 `a[0]` 变为 1.1。返回值\
  \ `a+2` 被第二次调用的参数，因此 `f(f(a))` 被翻译为 `f(a+2)`。因此，`a[2]` 变为 1.3。同样，返回值 `a+4` 作为第三次调用的参数，`a[4]`\
  \ 变为 1.5。由于最后一次调用 `f()` 返回 `a[6]` 的地址，使用 `*` 运算符显示其值，即 0.7。结果是 `a` 的内容为：1.1 0.2\
  \ 1.3 0.4 1.5 0.6 0.7 0.8\n\n### C.11.13 编写一个函数，根据下面的欧几里得算法计算两个正整数的最大公约数（MCD）。假设我们有两个整数\
  \ `a` 和 `b`，且 `a > b`。如果 `b` 能整除 `a`，则这就是 MCD。如果除法 `a/b` 的余数 `r` 不为 0，则用 `b` 除以\
  \ `r`。如果新的余数为 0，则 MCD 是 `r`，否则重复此过程。编写一个程序读取两个正整数（进行数据校验），并使用该函数计算它们的 MCD。\n\n###\
  \ C.11.14 下面程序的输出是什么？\n\n**答案：** 当调用 `test()` 时，我们有 `p1 = arr`，因此指针 `p1+1` 指向 `arr[1]`。因此，语句\
  \ `*(p1+1) = 10;` 使 `arr[1]` 等于 10。同样，我们有 `p2 = arr+3`，所以 `p2` 指向 `arr[3]`。因此，语句\
  \ `*(p2-1) = 20;` 使 `arr[2]` 等于 20。由于 `p1` 指向 `arr`，表达式 `p1+3` 返回指向 `arr[3]` 的指针。因此，`arr[3]`\
  \ 变为 30。结果是，程序显示：1 10 20 30\n\n### C.11.15 编写一个函数，接收一个整数（例如 `N`）并根据公式 `F(N) = F(N-1)+\
  \ F(N-2)` 计算斐波那契数列的第 `N` 项，其中 `F(0) = 0` 且 `F(1) = 1`。编写一个程序读取 2 到 40 之间的整数 `N`，并使用该函数显示第\
