  \n## 运行时类型识别\n\nC++ 允许我们在程序执行期间确定对象的类型。为了实现运行时类型识别，C++ 提供了 `dynamic_cast` 运算符、`typeid`\
  \ 运算符和 `type_info` 结构。让我们描述它们的基本特征。\n\n### dynamic_cast 运算符\n\n`dynamic_cast` 运算符通常用于类层次结构，并允许我们检查从一种类型到另一种类型的转换是否有效。在讨论它之前，让我们看一些派生类类型转换的例子，正如我们在第\
  \ 20 章中所看到的那样。假设我们有以下类层次结构：\n\n现在，让我们声明以下指针并用传统方式进行类型转换：\n```\n\n\n\n上述类型转换是安全的吗？在类型转换的通用情况下，取决于类的声明，所有转换可能是安全的，但只有当被转换的指针指向派生对象时，才能保证安全。因此，第一次类型转换是安全的。这是因为一个\
  \ `B` 对象包含一个 `A` 子对象。事实上，正如我们在第 20 章中所知，这种转换并不是必要的。第二次转换是不安全的，因为指向基类对象的指针（例如 `b`）被转换为了派生对象的指针（例如\
  \ `c`）。由于 `B` 对象不包含 `C` 子对象，因此在逻辑上它是不安全的，因为 `c` 对象可能包含 `b` 中不存在的成员。\n\n众所周知，判断类型转换是否安全的一种简单方法是检查右侧对象类型与转换类型之间的关系。例如，第一次转换是安全的，因为\
  \ `B` 对象也是一个 `A` 对象；而第二次转换是不安全的，因为 `B` 对象不是一个 `C` 对象。\n\n所以我们看到，尽管第二次转换是不安全的，但编译器允许了它的存在。这就是为什么\
  \ C++ 引入类型转换运算符的主要原因。以便在执行转换时设置一些规范规则，使它们更具安全性。也就是说，是否有方法可以进行此类类型转换并检查它们是否安全完成？是的，通过借助\
  \ `dynamic_cast` 运算符可以实现。`dynamic_cast` 运算符仅适用于多多态类的指针和引用，也就是说，指针指向或引用引用的类中必须至少有一个虚函数（声明或继承）。它接受两个操作数：位于\
  \ `<>` 内部的类类型的指针（或引用），以及位于 `()` 内部的待转换指针（或引用）。我们正在转换的类型必须是同一类层次结构内类的指针或引用。让我们来看一个使用指针的语法示例：\n\
  \n`p` 是被转换的指针。`Type` 是 `p` 应该转换到的目标类型。`dynamic_cast` 的目的是确保类型转换的结果指向目标类型（例如 `Type`）的有效对象。如果类型转换成功，运算符返回一个\
  \ `Type*` 指针。如果失败，它返回一个空指针。如果 `p` 是空指针，运算符也返回空指针。正如我们所说，这种类型转换是在运行时完成的，而不是在编译时。事实上，“dynamic”（动态）一词意味着运行时行为。`dynamic_cast`\
  \ 运算符主要用于安全的下转型（downcast），即将基类指针（或引用）转换为派生类指针（或引用）。它也可以用于上转型（upcasting），即将派生类指针（或引用）转换为基类指针（或引用）。让我们看看结合之前看到的类型转换的使用示例：\n\
  \n第一次转换是安全的，`dynamic_cast` 运算符返回一个非空指针。由于 `show()` 是虚函数且指针 `a` 指向 `B` 类的对象，程序显示\
  \ `B`。然后，由于 `a` 和 `b` 指针指向同一个地址，程序显示两次相同的值。由于第二次转换是不安全的，运算符返回空指针，程序显示 `Error`。\n\
  \n正如我们所说，我们可以将 `dynamic_cast` 应用于引用。因为在失败的情况下，不存在可以返回的空引用概念，运算符会抛出 `bad_cast` 类型的异常。该异常派自异常类，并在\
  \ `typeinfo` 文件中声明。例如：\n\n由于转换是不安全的，抛出了 `bad_cast` 异常，该异常被相应的 `catch` 块捕获。\n\n###\
  \ typeid 运算符\n\n`typeid` 运算符用于确定对象的类型。它返回一个 `type_info` 对象的引用，正如其名称所示，它持有有关传入参数类型的信息。`type_info`\
  \ 类声明在 `typeinfo` 文件中。在通常情况下，`typeid` 以类名或求值为结果对象的表达式作为参数。如果它是一个类型（例如 `int`），返回的值代表该类型。如果它是一个标识多态类（至少包含一个虚函数的类）的表达式，则返回的值代表该表达式的动态类型。否则，如果表达式标识的是非多态类，则返回的值代表该表达式的静态类型。`type_info`\
  \ 类重载了 `==` 和 `!=` 运算符，以便它们用于比较类型。例如，让我们使用之前定义的 `A`、`B` 和 `C` 类：\n\n由于 `C` 类是多态的，第一个\
  \ `if` 条件检查 `p` 指向的对象的类型。由于它指向一个 `C` 类的对象，条件为真，程序显示 `C`。因为 `C` 类是多态的，`p` 的类型是在运行时评估的。如果\
  \ `p` 是空指针，`typeid(*p)` 会抛出 `bad_typeid` 异常。该异常派自异常类，并在 `typeinfo` 文件中声明。此外，`type_info`\
  \ 类包含 `name()` 函数，它返回一个指向类型名称的 C 风格字符串，可用于诊断。此字符串取决于实现，通常包含类名。例如，使用我使用的编译器程序显示 `Class\
  \ C`。然后，因为 `C` 类是多态的，第二个 `if` 条件为真，由于 `show()` 是虚函数，程序显示 `C`。\n\n注意，如果我们在类 A 和 B\
  \ 中将 `show()` 改为非虚，`C` 类将不再是多态的，`typeid` 将返回表达式的静态类型（编译时已知）。因此，`if` 条件为假，程序不显示任何内容。特别是，`typeid(*p)`\
  \ 返回 `B` 类的类型，因为这是 `*p` 的静态类型。同样，`typeid(r)` 返回 `A` 类的类型，因为这是 `r` 的静态类型。\n\n类型识别应该只在需要时使用。例如，假设我们有一个\
  \ `A`、`B` 和 `C` 类的层次结构，并且我们想要根据指针指向或引用引用的对象类型执行某些操作：\n\n由于类型识别可能涉及运行时开销，这段代码并不高效。……\n\
  \n## 类型转换运算符\n\nC++ 提供了我们可以使用的运算符来执行更安全的类型转换。例如，我们看到了 `dynamic_cast` 运算符。其他运算符是\
  \ `const_cast`、`static_cast` 和 `reinterpret_cast`。它们都是在编译时处理的。除了安全性，使用它们的第二个理由是易于检测程序中的类型转换。我们只需通过名称进行搜索即可立即发现。相反，在传统方法中无法进行这种搜索，我们需要逐行搜索代码。接下来我将简要描述它们。\n\
  \n### const_cast 运算符\n\n`const_cast` 运算符用于添加或移除变量的 `const` 或 `volatile` 属性。`const_cast`\
  \ 适用于指针和引用。其语法与 `dynamic_cast` 相似：\n\n\n\n\n`type_name` 和 `expression` 应该是相同类型，`const`\
  \ 和 `volatile` 修饰符除外。也就是说，`const_cast` 无法改变底层类型（例如，从 `const int*` 转换为 `double*`）。返回的类型是\
  \ `type_name` 的类型。通常，它用于移除传递参数的 `const` 属性。让我们来看一个使用用例：\n\n假设我们想通过指针改变 `i` 的值。由于我们无法使用\
  \ `p2` 来做到这一点，我们使用另一个指针变量。使用 `const_cast` 运算符去除了 `const` 属性，因此 `p1` 指针可以改变 `i` 的值。注意，这对于\
  \ `p2` 来说仍然是不可能的。因此，程序显示了 20。当然，我们可以使用传统方式进行类型转换，而不是使用 `const_cast`：\n\n但在另一种情况下，我们可能会不小心写成：\n\
  \n此时编译器不会显示错误信息来通知我们这一无意的操作。如果我们改用 `const_cast` 运算符，即：\n\n编译器将显示错误信息，因为 `p2` 的类型不是\
  \ `double*`。因此，使用 `const_cast` 比简单的类型转换更安全。\n\n另一种 `const_cast` 运算符可能有用的情况是：如果你想向他人实现的函数传递常量参数（例如在库中），而该函数接受非常量参数。例如：\n\
  \n由于我们无法修改 `f()` 的原型并将 `p` 的类型改为 `const` 以传递 `p2` 指针，我们使用 `const_cast` 运算符并传递 `p1`\
  \ 指针。当然，现在 `f()` 可以改变 `p` 的值，从而改变 `i` 的值。\n\n在结束本节之前，请注意，你不应该使用它来修改 `const` 值。例如：\n\
  \n尝试修改 `const` 值会导致程序的未定义行为。\n\n同样的道理，尽管你可以使用 `const_cast` 来移除 `const` 对象的 `const`\
  \ 属性，但你不应该这样做。如果一个对象被设计为 `const`，意味着它是不应预期被修改的。如果由于某种原因你必须这样做，请额外注意不要违反该对象的 `const`\
  \ 特性，否则你可能会引入难以追踪的 bug。\n\n### static_cast 运算符\n\n这种类型的转换是最简单的类型。通常，`static_cast`\
  \ 运算符用于将一种类型转换为另一种相关类型。例如，将类层次结构中的一种指针类型转换为另一种，或者将一种数值类型（例如整数）转换为另一种（例如浮点数）。它的语法与其他运算符相同：\n\
  \n表达式的类型将转换为 `type_name`。该运算符可用于将指针转换为相关类，例如将派生类指针转换为基类指针（*向上转换*）以及反之，即将基类指针转换为派生类指针（*向下转换*）。例如：\n\
