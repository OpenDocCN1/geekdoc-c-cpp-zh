  \n**注释：** 由于数组元素已初始化为 0，剩下的就是将主对角线的元素赋值为 1。`if` 条件检查元素是否在对角线线上。该条件的形式基于观察结果：两个相邻对角线元素之间的元素个数为\
  \ `SIZE`。例如，在 5×5 数组中，对角线元素位于位置 0, 6, 12, 18 和 24。\n\n此外，通过这个示例，我想向你展示将二维数组当作一维数组来处理是完全合法的。我们利用了元素存储在内存连续位置的特性。\n\
  \n### C.8.28 编写一个程序，为 3×5 数组分配随机整数，并显示每行每列的最小值和最大值。使用指针算术处理数组。\n\n### 函数指针\n\n很可能在阅读完第\
  \ 11 章之后再读这一节更好。不过，你可以继续阅读并获得一些概念。\n\n当定义一个函数时，编译器会分配内存来存储其代码。因此，每个函数都有一个地址，就像普通变量一样。函数指针指向存储函数代码的内存地址。我们可以使用此指针调用函数；但不允许更改它的代码。声明函数指针的通用语法为：\n\
  \n`return_type (*pointer_name)(type type1, type2, ...)`\n\n`return_type` 指定函数的返回类型，而变量\
  \ `name_1`、`name_2`、……到 `name_n` 表示函数的参数（如果有的话）。这里是一些示例：\n\n指针只能指向与其声明中指定的具有相同参数列表和返回类型的函数。函数指针的名称必须括在括号内，因为函数调用运算符\
  \ `()` 的优先级高于 `*` 运算符。例如，语句：\n\n`int *ptr(int a);` 而不是 `int (*ptr)(int a);` 声明了一个名为\
  \ `ptr` 的函数，它接受一个整数参数并返回一个指向整数的指针。\n\n声明函数指针的一种简单方法是先写出函数原型，然后将函数名替换为 `(*ptr)` 形式的表达式。因此，`ptr`\
  \ 被声明为该原型函数的指针。正如我们所说，为了让指针指向函数，指针的声明必须与函数的原型匹配。例如，考虑以下程序：\n\n因此，语句 `ptr = test;`\
  \ 让 `ptr` 指向 `test()` 的地址。该语句是被允许的，因为 `ptr` 的声明匹配 `test()` 的声明。例如，如果我们把 `test()`\
  \ 的返回类型从 `void` 改为 `int`，编译将失败。注意如果我们写 `ptr = &test;`，结果是相同的，因为表达式 `&test` 被解释为指向\
  \ `test()` 的指针，而不是指向指向 `test()` 的指针。当然，我们可以在声明函数指针时对其初始化。例如：`void (*ptr)(int a)\
  \ = test;`。\n\n为了简化声明，我们可以使用 `auto` 关键字。例如：`auto ptr = test;`。为了强调 `ptr` 是指针，我们可以写\
  \ `auto*`，即 `auto* ptr = test;`。你可以向 `ptr` 存储任何与 `test()` 具有相同原型的函数地址。\n\n要通过指针调用函数，我们可以像使用函数名一样使用指针，或者对指针进行解引用。例如，`ptr(10);`\
  \ 或 `(*ptr)(10);` 调用 `test()` 并显示 20。虽然第一种形式与普通调用相似，但我倾向于第二种，以便向读者明确 `ptr` 是指针而不是函数。传递参数的规则与调用相同。例如，如果我们写\
  \ `ptr(\"msg\");` 编译器将显示类型不匹配错误。\n\n在下一个示例中，我们写了一个接收两个分数并返回较大值的函数。程序读取两个分数并使用指针调用函数以显示较大值。\n\
  \n我们可以省略 `max` 的声明，直接写 `cout << \"Max:\" << (*ptr)(i, j) << '\\n';`\n\n### 作为参数的函数指针\n\
  \n你可能会想，这一节不是太专业了，我真的需要向函数传递函数指针吗？你是对的，如果是我，可能也会这样想并跳过这一节。然而，在许多情况下你几乎都需要这种知识，例如调用接受此类参数的库函数，或者实现程序不同部分之间的通信。\n\
  \n让我们讨论第二种情况。应用程序需要程序的一部分（例如 B）在发生发生时通知另一个部分（例如 A）。为了实现这一点，A 中的函数调用 B 中的一个函数，并传递一个指向\
  \ A 中函数的指针。B 中的函数将该指针拷贝到变量中，每当 B 需要通知 A 时，就会使用该变量。这种通信方法被称为*回调机制*。例如，在我的一个应用程序中，B\
  \ 是串口的控制器，它使用该回调机制通知主程序（A）接收数据。让我们来看这种机制的编码示例：\n\n首先，主程序（例如 A）调用 `make_rand()`（例如\
  \ B），它接受一个指向接受两个整数参数且无返回值的函数指针作为参数。注意，我们只写了 `handle_event()` 的名称。当函数名后面没有跟括号时，编译器产生指向该函数的指针；小心，它并不会调用函数。为了确保你理解这种区别，这里有一个有两个函数\
  \ `a` 和 `b` 的示例：\n\n\n\n\n\n`make_rand()` 生成随机整数，一旦生成了`[1000, 2000]`范围内的整数，它就会使用回调函数句柄\
  \ `handle_event()` 的指针，并将生成的数字个数以及指定区间内的数字作为参数传递过去。这个示例没有实际价值；我只是想向你展示一个回调机制的实现示例。你可能会在未来发现它很有用。\n\
  \n此外，将函数指针作为参数可以使你的函数以通用的方式工作。这里有一个例子：\n\n在每次调用 `find_val()` 时，都会传递相应函数的地址，并且 `op`\
  \ 指向该地址。程序输出向量元素的最大值和最小值，即 `12` 和 `-5`。如你所见，`find_val()` 以一种通的方式工作，这意味着同一个函数可以支持这两种操作。该函数可以变得更通用，并适用于不同类型的数据（即不仅适用于\
