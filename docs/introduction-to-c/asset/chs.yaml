  \n## 向 main() 传递数据\n\n当我们从命令行运行程序时，通常需要向它传递信息。例如，假设执行文件是 `hello`，`argc` 等于命令行参数的数量。为了获取数据，`main()`\
  \ 必须定义如下：\n\n`int main(int argc, char *argv[])`\n\n `argc` 是命令行参数的数量，包括程序本身。`argv`\
  \ 是一个字符串指针数组。按照约定，`argv[0]` 指向程序名，`argv[1]` 指向 \"100\"，`argv[2]` 指向 \"200\"，而 `argv[3]`\
  \ 为 `nullptr`。\n\n以下程序检查用户名和密码。假设这些是 `user` 和 `pswd`。如果 `argc` 为 3，`if` 语句会检查用户名是否正确。\n\
  \n## 练习题\n\nC.11.26 以下程序的输出是什么？\n\n**答案：** `argc` 等于命令行参数的数量。如果唯一的参数是程序名，`argc`\
  \ 将为 1，循环不会执行。如果有更多参数，程序会打印它们的值，用空格分隔，并在最后一个后添加换行符。\n\n例如，假设命令行参数是 one 和 two。那么，`argc`\
  \ 为 3，循环条件变为 2。由于 (`argc > 1`) 为真，程序显示 `++argv` 的值和一个空格。由于 `argv` 指向 `argv[0]`，表达式\
  \ `++argv` 使其指向 `argv[1]`。因此，`*argv` 等于 `argv[1]`，程序输出 one。在下一次迭代中，`argc` 变为 1，所以程序显示\
  \ `argv[2]` 的值。结果是程序输出 two 和换行符。\n\n现在，回答这个问题。如果我们写 `*argv++` 而不是 `++argv`，输出是什么？\n\
  \n**答案：** 程序将显示程序名和命令行参数，但不最后一个。\n\nC.11.27 流行的 `ping` 命令用于测试 IP 网络两个系统之间的通信。例如，`ping\
  \ [www.ntua.gr](http://www.ntua.gr)`。写一个程序读取命令行参数并检查它是否对应有效目标。为了有效，假设它应该符合示例的形式，即以\
  \ \"www.\" 开头，第二个点之后的部分应该是两个或三个字符。\n\n## 变长参数函数\n\n函数可以接受数量变化的参数。声明此类函数的一种方法（来自\
  \ C）是先放置固定参数（即那些在函数调用中必须存在的参数），然后是 … 符号，该符号被称为*省略号*（ellipsis）。通常情况下，… 表示“某物的出现零次或多次”。例如，声明：\n\
  \n\n\n\n表示 `test()` 接收两个固定参数，一个整数和一个指向 `char` 的指针，后面可以紧跟任意数量的额外参数。在实践中，你很少需要编写具有可变参数的函数。如果你想编写一个通用函数时，可能会遇到这种情况，例如一个接受任意数量值并返回它们的和的函数。\n\
  \n要调用此类函数，我们首先编写固定参数的值，然后编写可选参数的值。例如，我们可以这样调用 `test()`：\n\n可选参数的数据类型分别为 `int`、`float`\
  \ 和 `char`，值分别为 5、8.9 和 \"sample\"。为了处理可选参数列表，我们使用在 `stdarg` 文件中定义的一组宏。宏将在第 15 章中讨论。目前，假设它们的行为与函数相似。\n\
  \n- `va_list`：类型为 `va_list` 的变量用于指向参数列表。\n- `va_start()`：`va_start()` 宏接收两个参数。第一个参数类型为\
  \ `va_list`，第二个应该是固定参数的名字。例如，`test()` 中固定参数的名字是 `str`。`va_start()` 将 `va_list` 参数指向第一个可选参数。在第一次使用\
  \ `va_arg()` 之前必须调用 `va_start()`。\n- `va_arg()`：`va_arg()` 宏接收两个参数。第一个类型为 `va_list`，第二个是可选参数的类型。例如，`test()`\
  \ 中可选参数的类型是 `int`。`va_arg()` 返回可选参数的值，并将 `va_list` 参数指向下一个可选参数。因此，为了获取所有可选参数的值，我们应该根据可选参数的数量调用多次\
  \ `va_arg()`。\n- `va_end()`：`va_end()` 宏接收一个类型为 `va_list` 的参数。必须调用它来结束对参数列表的处理。\n\
  \n在下面的程序中，`test()` 接收任意数量的 `char` 类型的参数。固定参数 `num` 表示它们的数量。\n\n程序输出可选参数的值：t1 t2\
  \ t3\n\n使用可变参数列表函数的主要困难在于，没有简单的方法来确定其可选参数的数量和类型。要找到数量，一种简单的解决方案是添加一个声明该数量的固定参数。在\
  \ във面的例子中，我们使用了参数 `num`。如果所有参数都是相同类型，我们可以使用特殊值来标记列表的结束。此外，函数必须以某种方式被告知它们的类型。例如，对于熟悉\
  \ C 语言 `printf()` 和 `scanf()` 函数的人来说，它们都使用格式字符串来获取必要的类型。通常，由于 `...` 源自 C 语言，它应该与\
  \ C 和 C++ 中常见的类型一起使用，而不应与其他类型一起使用。\n\n## 练习\n\nC.11.28 编写一个函数，接收 `double` 类型的可变参数列表并返回最大值。编写一个程序读取三个浮点数并使用该函数显示最大值。\n\
