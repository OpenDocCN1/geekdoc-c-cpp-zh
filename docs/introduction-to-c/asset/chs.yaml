  \ 是指向 `p[m+1]` 元素的指针。让我们追踪迭代：\n\n> *第一次迭代* (m=0): `a[*p[0]] = **(p+1) = *p[1] =\
  \ b`，这意味着 `a[0] = 1`。\n\n> *第二次迭代* (m=1): `a[*p[1]] = **(p+2) = *p[2] = c`，这意味着\
  \ `a[1] = 2`。\n\n> *第三次迭代* (m=2): `a[*p[2]] = **(p+3) = *p[3] = d`，这意味着 `a[2] =\
  \ 3`。\n\nC.8.23 使用 `p1` 并完成以下程序，连续读取一个整数，并根据输入数字的绝对值输出单词 `test`。程序应使用 `p2` 来显示输出单词的总数。如果用户输入\
  \ 0，则停止数字数字。仅使用 `for` 循环。\n\n**答案：**\n\n### 指针与二维数组\n\n正如指针与一维数组密切相关一样，它们也多维数组相关。在本节中，我们将关注最常见的情况，即二维数组。\n\
  \n回想第 7 章，当声明一个二维数组时，它的元素被存储在连续的内存位置上，从第一行的元素开始，然后是第二行的元素，依此类推。例如，以下程序声明了一个二维数组并显示了其元素的内存地址。它们的距离是\
  \ `int` 类型的大小（例如 4）。\n\n还要记住，C++ 将二维数组视为一维数组，其中每个元素都是一个数组。例如，`a` 的元素是 `a[0]`、`a[1]`\
  \ 和 `a[2]`，其中每一个都是一个包含三个整数的数组。特别，C++ 将 `a[0]` 视为数组，通过对其名称使用下标我们得到了它的元素，即 `a[0][0]`、`a[0][1]`\
  \ 和 `a[0][2]`。事实上，如果我们写 `sizeof(a[0])`，程序将输出 12。\n\n为了通过指针算术处理二维数组 `a[N][M]`，我们使用每个数组名称\
  \ `a[0]`、`a[1]`、 ..., `a[N-1]` 作为指向各行第一个元素的指针。例如，由于 `a[0]` 可以用作指向 `a[0][0]` 的指针，因此\
  \ `*a[0]` 等于 `a[0][0]`。\n\n由于 `a[0]` 指向第一个元素，`a[0]+1` 可以用作指向第二个元素（即 `a[0][1]`）的指针，`a[0]+2`\
  \ 可以用作指向第三个元素（即 `a[0][2]`）的指针。在一般情况下，`a[0]+j` 可以用作指向第一行 `a[0][j]` 元素的指针。所以，我们有：\n\
  \n*   `a[0]+j` 等于 `&a[0][j]`。\n*   `*(a[0]+j)` 等于 `a[0][j]`。\n\n同样地，`a[1]+j` 可以用作指向第二行\
  \ `a[1][j]` 元素的指针。所以，我们有：\n\n*   `a[1]+j` 等于 `&a[1][j]`。\n*   `*(a[1]+j)` 等于 `a[1][j]`。\n\
  \n因此，在一般情况下我们有：\n\n*   `a[i]+j` 等于 `&a[i][j]`。\n*   `*(a[i]+j)` 等于 `a[i][j]`。\n\n\
  并且由于我们现在已经知道 `a[i]` 被转换为 `*(a+i)`，我们有：\n\n*   `*(a+i)+j` 等于 `&a[i][j]`。\n*   `*(*(a+i)+j)`\
  \ 等于 `a[i][j]`。\n\n\n\n\n\n### C.8.25 这段代码的作用是什么？\n\n**答案：** 语句 `ptr = arr[1]+2;`\
  \ 让 `ptr` 指向 `arr[1][2]` 的地址。由于 `*ptr` 等于 `arr[1][2]`，因此语句 `*ptr = 0;` 等于 `arr[1][2]\
  \ = 0;`。语句 `ptr++;` 让 `ptr` 指向当前行的下一个元素。例如，当 `ptr` 第一次增加时，它指向 `arr[1][3]` 的地址，下一次递增则使其指向\
  \ `arr[1][4]` 的地址。因此，这段代码的作用是将第二行的最后三个元素置零。\n\n### C.8.26 既然我是一个“坏孩子”，想再多刁难你一下，如果我们把\
