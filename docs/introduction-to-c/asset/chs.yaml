  \ 修饰符\n\n`volatile` 修饰符很少使用。通常，它被用于与系统硬件通信的代码中。它被用于通知编译器变量的值可能会变化，即使它在程序内部看起来没有发生变化。事实上，它防止了编译器执行可能不理想的优化。让我们来看一个例子：\n\
  \n该条件检查 `out` 的值是否为 200。由于 `out` 的值似乎保持不变，优化编译器可能会将此循环替换为无限循环，例如 `while(1)`。然而，如果\
  \ `out` 可以被某个“隐藏”的实体（如系统硬件）修改，那么这种优化将影响程序的行为。为了防止编译器优化代码，我们在声明中使用 `volatile` 修饰符，即\
  \ `volatile int out;`。\n\n# 26 标准模板库介绍\n\nDOI: [10.1201/9781003230076-26](https://doi.org/10.1201/9781003230076-26)\n\
  \n在本章中，我们将简要介绍标准模板库 (STL) 及其特性。STL 是模板类、类、算法和函数的集合。STL 的目标是提供一组高度通用的数据结构和算法。STL\
  \ 由几个部分组成：容器（containers）、迭代器（iterators）、算法（algorithms）和函数。\n\n容器是存储数据的数据结构。STL 中有类型的容器，例如序列容器、关联容器和容器适配器。序列容器包括\
  \ `vector`、`list`、`deque`、`array` 和 `forward_list`。关联容器包括 `set`、`multiset`、`map`\
  \ 和 `multimap`。容器适配器包括 `stack`、`queue` 和 `priority_queue`。\n\n迭代器用于遍历容器的对象。它们提供了一个共同接口，用于在不知道底层实现的情况下访问不同容器的元素。迭代器有多种类型，例如输入迭代器、输出迭代器、双向迭代器和随机访问迭代器。\n\
  \n算法是在容器上执行操作的函数。常见的算法包括 `sort`、`find`、`count`、`copy`、`transform` 和 `reverse`。这些算法是通用的并与迭代器工作，允许它们用于任何容器。\n\
  \n函数是可以与 STL 算法配合使用的额外函数。例如，谓词（predicates）和函数对象（functors）可以自定义算法。\n\nSTL 是一个强大的工具，提供了广泛的高效通用组件。通过使用\
  \ STL，程序员可以编写更简洁、更易维护的代码。在接下来的章节中，我们将讨论 STL 的重要特性。\n\n### 算法\n\nSTL 中的算法是在容器上执行操作的函数。这些算法是通用的并与迭代器工作，允许它们用于任何容器。常见的算法包括\
  \ `sort`、`find`、`count`、`copy`、`transform` 和 `reverse`。\n\nSTL 中的算法设计得高效且经过优化。例如，`sort`\
  \ 算法的时间复杂度为 $O(n \\log n)$，而 `find` 算法的时间复杂度为 $O(n)$。\n\nSTL 中的算法也是灵活的。它们可以使用谓词和函数对象进行自定义。例如，可以通过提供自定义的比较器来使用\
  \ `sort` 算法按降序排列元素。\n\nSTL 中的算法是 C++ 标准库的基础部分。它们被广泛应用于各种场景，为程序员提供了一套强大的工具。\n\nSTL\
  \ 中的算法设计得易于使用。它们遵循一致的接口，使其易于学习和记忆。例如，大多数算法接受一两个迭代器作为参数。\n\nSTL 中的算法还设计为线程安全。这意味着只要容器不被修改，就可以在多个线程中同时使用而不会出现任何问题。这在第\
  \ 18 章 中有所解答。\n\n\n\n\n`find()` 函数适用于每种容器，并用于在容器中搜索特定值。它接受三个参数。前两个是输入迭代器（例如 `first`、`last`），它们指示了搜索范围，即\
  \ `[first, last)`。第三个是需要搜索的值。如果找到了该值，`find()` 将返回一个指向其首次出现位置的迭代器。如果未找到，它将返回第二个参数的值（例如\
  \ `last`）。正如我们接下来将看到的，指针也可以用作迭代器，让我们来看一个在数组和容器中的用法示例：\n\n为了让你对 `find()` 在 STL 中可能的定义方式有一个直概念，这里有一个实现示例：\n\
  \n在第一次调用 `find()` 时，`Iterator` 类型被替换为 `int*`，而在第二次调用时，则使用了 `vector` 类的迭代器成员。\n\n\
  ### `sort()` 函数\n\n`sort()` 函数适用于包含随机访问迭代器的容器。它有两个版本。第一个接受两个参数，即随机访问迭代器（例如 `first`、`last`），它们指示排序范围，即\
  \ `[first, last)`。`sort()` 使用 `<` 运算符对基本类型的元素进行升序排序。例如，如果在 C.26.1 中我们在 `for_each()`\
  \ 之前添加了语句：\n\n`sort()` 将元素按升序排列，程序显示 10、20 和 30。\n\n如果容器的元素是用户定义的类型，则必须为该类型定义 `operator<()`，以便让\
  \ `sort()` 正常工作。例如，在以下程序中，容器 `v` 包含了 `Student` 类型的结构体：\n\n`sort()` 根据每个学生的成绩对结构体进行升序排序，程序显示它们的数据。\n\
  \n但如果我们想有多种排序方式，比如让用户来决定呢？在这种情况下，我们使用 `sort()` 的第二个版本。该版本接受三个参数，其中前两个与第一个版本相同，第三个是指向要使用的函数（或函数对象）的指针，用于代替\
  \ `operator<()` 进行比较。它的返回值必须能够转换为 `bool` 类型，值为 `true` 表示元素顺序正确。例如，让我们修改之前的程序：\n\n\
  现在，如果用户不输入 0，`name_order()` 将比较名称成员，并按字母顺序对结构体进行排序。\n\n### `count_if()` 函数\n\n某些\
  \ STL 函数有一个第二个版本可以对容器的每个元素应用函数。这第二个版本通常以 `_if` 结尾。例如，`count()` 和 `count_if()`。`count_if()`\
  \ 的前两个参数是输入迭代器（例如 `first`、`last`），它们指示范围 `[first, last)`。第三个参数是指向函数的指针（或函数对象），该函数被应用于\
  \ `[first, last)` 中的每个元素。返回值必须能够转换为 `bool` 类型，值为 `true` 表示该元素必须被计数。`count_if()`\
  \ 返回函数返回真值的元素总数。通常，当我们对查找符合某些标准的值时，会使用 `_if` 版本。让我们来看它的用法示例：\n\n`islong()` 接受一个参数，其类型与元素相同。它被调用了三次，分别对应\
  \ `v` 中包含三个字符串对象。因为只有一个字符串超过了五个字符，所以程序显示 1。注意，如果我们想将字符串的大小与另一个值（例如 10）进行比较，我们需要编写另一个函数或定义一个变量（例如\
  \ `size`）并相应修改。这两种方法都不灵活。我们真正需要的是将大小作为一种参数传递给 `islong()`。我们稍后会看到如何通过函数对象来实现。\n\n\
  ## 迭代器 (ITERATORS)\n\n迭代器是一个指向容器元素的对象或简单指针。迭代器可以用于遍历容器的内容。通过迭代器，我们可以相同的方式访问不同容器的元素，而不取决于所存储的数据类型。因此，相同的\
  \ STL 算法可以以统一的方式应用于不同的容器。例如，假设我们在 `vector<int>` 对象中搜索一个值：\n\n现在假设我们在 `list<int>`\
  \ 对象中搜索一个值，它是一个整数链表：\n\n虽然再次使用索引法是有意义的，但我们不允许这样做，因为 `list` 容器没有提供 `[]` 的重载函数。\n\n\
  然而，通过迭代器，我们可以为两个容器编写相同的搜索代码。迭代器的使用类似于指针。例如，假设对象（vector 或 list）的名字为 `c`。在 `vector<int>`\
  \ 的情况下，我们写道：\n\n而在 `list<int>` 的情况下，我们写道：\n\n代码中唯一的变化是迭代器的声明，这取决于容器的类型。我们使用 `auto`\
  \ 关键字，搜索代码变得相同：\n\n也就是说，通过迭代器，我们可以以相同的方式遍历不同的容器（例如 `++it`）并以相同的方式访问它们的元素（例如 `*it`），而不取决于它们的类型，且无论它们是位于连续的内存位置（例如\
  \ vector）还是随机位置（例如 list）。\n\n这就是 STL 的哲学，即它引入了迭代器的概念，使得每个函数的实现不依赖于容器类型，而是以通用的方式进行。从本质上说，迭代器是容器与算法之间的桥梁。因此，所有容器有一个通用的\
  \ `for_each()`，而不是为每个容器准备单独的版本。正如我们在上一节看到的，当调用 STL 函数时传递的是特定容器的迭代器。例如，`find()` 的原型类似于：\n\
  \n正如我们稍后将看到的，这个原型表示 `find()` 返回并接收迭代器（或更好的）作为参数。正如我们所说，STL 函数并不取决于容器的类型（例如 vector,\
  \ list, ...），它对允许调用它的容器都有效。总结来说，将迭代器传递给 STL 函数使其更具通用性，因为函数适用于任何容器，这就是 STL 的方法。\n\
  \n当然，为了调用 STL 函数，每个容器应该声明适用于类的迭代器类型。例如，`vector<int>` 类拥有类型为 `vector<int>::iterator`\
  \ 的迭代器。对于一个类，迭代器可能是简单的指针，而对于另一个类，它可能是一个对象。\n\n无论迭代器的实现如何，重要的是迭代器支持访问容器元素所需的函数，例如\
  \ `*` 和 `++` 运算符。此外，如果我们有两个迭代器（例如 `p` 和 `q`）指向同一个容器的元素，则支持赋值（例如 `p = q`）和比较（例如 `p\
  \ == q`）函数。此外，每个容器都提供了 `begin()` 函数返回指向其第一个元素的迭代器，以及 `end()` 返回指向最后一个元素之后位置的迭代器。注意，虽然指针是迭代器的一种形式，但反之则不然，即迭代器并不一定像指针那样运行。你将在下一节看到不同类型的迭代器时理解为什么。\n\
  \n\n\n\n不同的算法对迭代器可能有不同的要求。例如，搜索算法要求迭代器支持 `++` 运算符，以便能够遍历容器中的元素。它还需要读取元素值的权限，但不需要写入这些值。也就是说，对于迭代器来说，没有必要允许诸如\
  \ `it = 5` 的写入操作。另一方面，排序算法（例如 `sort()`）要求迭代器除了支持 `++` 运算符外，还需要支持 `+` 运算符以对容器的元素进行随机访问，以便算法能够交换任何元素。也就是说，对于迭代器来说，应该被允许写入\
  \ `it+5`。此外，该算法还要求迭代器可以同时用于读取和写入数据。因此，由于迭代器设计中存在不同的需求，STL 定义了不同类型的迭代器。这是下一节的主题。\n\
  \n### 迭代器的类型\n\nSTL 定义了五种迭代器，并根据每个算法所需的迭代器来描述每个算法。每种类型都有自己的属性并支持特定的操作。这些类型分别是输入迭代器、输出迭代器、前迭代器、双向迭代器和随机访问迭代器。例如，在\
  \ `find()` 的描述中，我们看到它接受两个输入迭代器作为参数。所有迭代器都可以用 `*` 运算符解引用，并用 `==` 和 `!=` 运算符进行比较。这五种类型形成了一种层次结构，除了输出迭代器外，每种类型都支持前一种类型的属性并添加了自身的特性。让我们简要查看它们的特征。\n\
  \n### 输入迭代器\n\n通过输入迭代器，我们可以顺序读取容器元素的值。然而，我们不能更改它们的值。例如，对于迭代器来说，我们可以进行比较 `it == 2`，但不能进行赋值\
  \ `it = 2`。因此，使用输入迭代器的算法（如 `find()`）只能读取而不能更改容器的值。输入迭代器支持 `++` 运算符的两种形式（后置/前置），即\
  \ `++it` 或 `it++` 用于遍历元素。容器的遍历仅在前正方向进行，也就是说，迭代器不支持 `--` 运算符来向后移动。\n\n### 输出迭代器\n\
  \n输出迭代器被认为是输入迭代器的互补。也就是说，通过输出迭代器，我们可以更改容器元素的值，但不能读取它们。例如，对于迭代器来说，我们可以写入 `it = 2`，但不能进行比较\
  \ `it == 2`。因此，它可以被那些只需要写入而不需要读取值的算法使用。\n\n### 前迭代器\n\n前迭代器被认为是输入迭代器和输出迭代器的结合。也就是说，通过前迭代器，我们可以读取和更改容器元素的值。和输入、输出迭代器一样，前迭代器使用\
  \ `++` 运算符来遍历容器。与它们一样，我们只能向正方向移动，一次一个元素。\n\n### 双向迭代器\n\n通过双向迭代器，我们可以在两个方向上读取和更改容器元素的值。它与前迭代器具有相同的属性，并增加了对\
  \ `--` 运算符两种形式（后置/前置）的支持，以便向后访问元素。例如，对于迭代器来说，我们可以写入 `--it` 或 `it--`。\n\n### 随机访问迭代器\n\
  \n某些算法（如 `sort` 算法）能够随机访问容器的元素。随机访问迭代器支持双向迭代器的所有属性，并添加了支持随机访问的功能。因此，随机访问迭代器在功能上是最强大的迭代器。例如，对于迭代器来说，我们被允许写入\
  \ `it+5`、`it[2]` 或 `it -= 3`。本质上，随机访问迭代器的工作原理类似于指针。也就是说，普通指针满足随机访问迭代器的所有要求，因此也满足所有迭代器的要求。\n\
  \n人们可能会想，为什么我们需要这五种类型？这种想法是，在编写算法时，使用满足其需求的迭代器。例如，`find()` 不需要使用随机访问迭代器，而是需要输入迭代器。因此，所有包含与输入迭代器相同或更高能力迭代器的容器都可以使用\
  \ `find()`。然而，需要随机访问迭代器的 `sort()` 只能支持这种类型迭代器的容器使用。\n\n在实现方面，迭代器可以用类或普通指针表示。例如，前迭代器可以实现为一个顺序访问容器元素的对象。STL\
  \ 算法可以与任何满足要求的迭代器实现协同工作。要了解一个容器可以使用哪些算法，我们需要知道它支持什么种的迭代器。例如，如果我们阅读 `vector` 的描述，会看到它支持随机访问迭代器。因此，这个容器可以使用处理任何类型迭代器的\
  \ STL 算法，因为随机访问迭代器支持所有迭代器的属性。同样地，如果我们看到其他某些容器支持双向迭代器，我们就明白该容器无法使用需要随机访问迭代器的算法。\n\
  \n# STL 算法与指针\n\n正如我们所说的，迭代器是指针的泛化，而指针满足迭代器的所有要求。因此，由于指针是一个迭代器且 STL 算法与迭代器工作，可以将\
  \ STL 算法应用于基于指针的非 STL 容器。例如，我们可以将 STL 算法应用于普通数组。假设我们要对一个包含 100 个整数的数组（例如 `int a[100]`）。正如我们看到的，`sort()`\
  \ 接受两个随机访问迭代器作为参数来指定排序范围。由于指针是迭代器，我们可以使用指针作为参数。因此，以下语句按升序排序数组：\n\n另一个实用的 STL 函数是\
  \ `copy()`。它接受三个迭代器，用于将一个容器的元素复制到另一个。前两个参数是输入迭代器（例如 `first`, `last`），指示复制范围。第三个是输出迭代器，指示数据复制的位置。程序员应该确保目标内存足够存储复制的数据。由于我们可以使用指针作为参数，可以从或数组复制数据。让我们来看示例：\n\
  \n此代码将 `a[0]`、`a[1]` 和 `a[2]` 的值复制到向量从 `v[2]` 元素开始的三个位置。因此，`v` 的内容变为：60 60 10 20\
  \ 30 60 60\n\n### 预定义迭代器\n\nSTL 提供了一些预定义的迭代器，它们定义在迭代文件中。它们的主要目的是扩展 STL 算法的通用性。在本节中，我们将简要介绍其中一些。例如，STL\
  \ 提供了 `ostream_iterator`，它是一种用于向输出流写入数据的输出迭代器。通常，`ostream_iterator` 和 `istream_iterator`\
  \ 作为算法的参数。例如：\n\n第一个模板参数（例如 `int`）指示要写入输出流的数据类型。第二个（例如 `char`）指示输出流处理的字符类型。在迭代器的构造函数中，第一个参数（例如\
  \ `cout`）指示输出流。第二个指示值之间的分隔符（例如空格）。程序显示数组的值，并在它们之间有一个空格。注意，与其使用命名的迭代器（例如 `out_it`），我们可以像这样创建一个匿名迭代器：\n\
  \n\n\n第一个模板参数（例如 `int`）指示要从输入流中读取的数据类型。第二个参数（例如 `char`）指示输入流所使用的字符类型。构造函数的参数（例如\
  \ `cin`）指示输入流。如果缺少该参数，它将对应一个迭代器，该迭代器表示没有其他数据可读，或者发生了读取错误。在我们的示例中，这两个迭代器被用于确定 `copy()`\
  \ 中的复制范围。也就是说，将一直复制，直到遇到输入数据的末尾或发生其他读取错误。因此，当用户输入五个整数时，程序读取这些整数并将它们存储在 `vector`\
  \ 中，当遇到用户输入的字符（例如 `b`）时，程序会停止读取，因为发生了类型不兼容读取错误。然后，它会显示 `vector` 的内容。\n\n另一个迭代器是\
  \ `reverse_iterator`（反向迭代器），它可以按反序（从尾到开头）显示容器的元素。例如，`vector` 类包含 `rbegin()` 函数，它返回一个指向最后一个元素的反向迭代器，以及\
  \ `rend()`，它返回一个指向第一个元素之前位置的反向迭代器。例如：\n\n第一种方法使用 `for_each()` 按反序显示数据，而第二种方法使用反向迭代器（例如\
  \ `it`）。请注意，递增反向迭代器（例如 `++it`）实际上会使其递减。\n\n当使用复制函数（如 `copy()`）时，我们可能希望向容器中添加新元素而不是覆盖现有的元素。三种插入迭代器\
  \ `back_insert_iterator`、`front_insert_iterator` 和 `insert_iterator` 提供了这种能力。它们的类型是输出迭代器。\n\
  \n`back_insert_iterator` 可以用于支持在末尾插入元素的容器。例如，`vector` 容器符合条件，因为它提供了 `push_back()`\
  \ 函数。`front_insert_iterator` 可以用于支持在开头插入元素的容器。例如，`list` 容器符合条件，因为它提供了 `push_front()`\
  \ 函数。`insert_iterator` 更为通用，它可以用于支持插入元素的容器。也就是说，它可以用于在任何位置插入数据；容器只需要支持插入操作即可。创建\
  \ `back_insert_iterator` 和 `front_insert_iterator` 迭代器时，模板参数是容器的数据类型，构造函数的参数是特定的容器。`insert_iterator`\
  \ 在构造函数中接受一个额外的参数，指示插入位置。让我们来看以下程序：\n\n第一个 `copy()` 将 `v2` 的元素添加到由 `back_it` 迭代器引用的\
  \ vector 的末尾，即 `v1` 中。第二个 `copy()` 将 `v3` 的元素添加到由 `ins_it` 迭代器指示的 vector 位置，即 `v1`\
  \ 的第三个元素。检查程序输出，确认 `v1` 的大小是否动态增长以适应新数据。第三个 `copy()` 将 `q2` 的元素添加到由 `front_it` 迭代器引用的队列\
  \ `queue` 的开头，即 `q1`。最后，程序显示：\n\n通过这些预定义的迭代器，我们看到它们的使用扩展了 STL 算法的通用性。例如，`copy()`\
  \ 不仅可以将数据从一个容器复制到另一个容器，还可以从一个容器复制到输出流、从输入流复制到容器，甚至将数据插入到容器中。\n\n## 容器 (CONTAINERS)\n\
  \n容器是一个存储对象集合的类，这些对象就是它的元素。每个容器都管理其元素的存储空间，并提供访问这些元素的成员函数。它们被实现为模板类，为存储元素的类型提供了极大的灵活性。元素可以是对象也可以是基本数据类型。例如，`vector<Student>`\
  \ 和 `vector<int>`。通常情况下，在应用程序中使用哪种类型的容器不仅取决于应用程序的需求，还取决于容器所提供的操作的性能。例如，`vector`\
  \ 容器提供了对其元素的快速访问，但对于插入操作则不然，因为插入位置之后的元素必须移动以为新元素腾留空间。容器分为三大类：序列容器、容器适配器和关联容器。\n\n\
  ### 序列容器 (Sequence Containers)\n\n序列容器包含按顺序存储的相同类型的对象。顺序顺序保持不变，也就是说，每次遍历容器时，存储的对象的顺序都不会改变。由于布局保持不变，因此可以在特定位置执行插入数据和删除操作。`vector`、`deque`\
  \ 和 `list` 模板类是序列容器的示例。C++11 添加了 `array` 和 `forward_list`。我们已经见过 `vector` 类。`deque`（双端队列）支持在开头和结尾高效添加/删除元素。`array`\
  \ 与普通数组相比，是一种易于使用且更安全的替代方案。与 `array` 类似，`array` 的长度在编译时指定，即不允许其动态调整大小。`forward_list`\
  \ 实现了单向链表。除了 `array` 之外，所有容器都支持在运行时添加/删除元素，因此分配内存的大小会发生变化。\n\n选择哪种序列容器取决于应用程序的要求。例如，如果应用程序只需要在开头或结尾插入/删除元素，最佳选择是\
  \ `deque`。如果应用程序对元素的随机访问需求高于插入/删除元素的需求，最佳选择是 `vector`。通常情况下，`vector` 类是更好的选择；除非你有充分的理由去选择其他容器。让我们快速查看\
  \ `list`。\n\n#### list 模板类\n\n`list` 模板类实现了双向链表。列表中的每个元素（第一个和最后一个除外）与其前一个和后一个元素链接，以便列表可以进行双向遍历。与\
  \ `vector` 不同，`list` 不允许对数据的随机访问，只能顺序访问。也就是说，我们不能使用数组下标符号编写类似 `lst[i]`，其中 `lst`\
  \ 是一个对象。比较这两个类，`vector` 的优势在于它可以快速访问任何元素，而 `list` 提供了快速插入/删除元素的能力。例如，要访问 `list`\
  \ 的第十个元素，我们通过指针成员访问所有之前的元素直到到达它。相比之下，在 `vector` 中，由于元素存储在连续内存位置，访问非常快。另一方面，`list`\
  \ 的优势在于在任何位置插入/删除元素的代价是常数时间，我们只需要更改相应指针的值。相比之下，在 `vector` 中，这些操作需要更多时间，因为元素需要重新排列。例如，插入新元素需要将插入点之后的所有元素向右移动位置以便空间。\n\
  \n`list` 支持的迭代器是双向的。因此，如果是 `list` 的迭代器，我们不允许编写 `it+5`。使用 `list` 必须包含 `list` 头文件。让我们来看一个示例：\n\
  \n\n\n\n\n`insert()` 在迭代器指示的位置插入元素。`remove()` 所有与参数相同的元素。`unique()` 移除所有连续的重复元素。它只保留每组相同元素中的第一个元素。`pop_front()`\
  \ 移除列表的第一个元素。`push_front()` 将元素添加到列表开头，而 `push_back()` 则将其添加到列表末尾，即当前最后一个元素之后。`sort()`\
  \ 对列表进行排序。如果我们先使用 `sort()` 然后再使用 `unique()`，则每个元素将只会出现一次。程序使用两种方式来显示列表元素：使用迭代器和\
  \ `for_each()`。最后，程序显示：\n\n请注意，由于我们之前看到的非成员函数 `sort()` 需要随机访问迭代器，因此我们无法使用它。所以，我们使用\
  \ `list` 的成员函数 `sort()`。\n\n### 容器适配器 (Container Adaptors)\n\n容器适配器实现在其他容器之上，并根据其自身的需求调整其功能。容器适配器提供了被封装容器的有限服务，并针对特定用例进行了定制。例如，`stack`\
  \ 容器虽然默认基于 `deque`，但它允许在栈顶进行元素的插入和删除。它们没有迭代器，也不支持通过索引符号访问。标准的容器适配器是 `queue`、`priority_queue`\
  \ 和 `stack` 模板类。让我们简要查看它们。\n\n### queue 模板类\n\n`queue` 模板类实现了一个 FIFO（先入先出）队列，其中元素插入到容器的末尾并从其头部提取。该实现支持队列的基本功能。因此，我们可以在队列的末尾添加元素、移除第一个元素、查找第一个和最后一个元素的值、检查队列是否为空以及查找存储的元素数量。不支持对其元素进行随机访问，也无法遍历队列。使用\
  \ `queue` 必须包含 `queue` 头文件。让我们来看一个例子：\n\n`push()` 将元素添加到队列的末尾。`front()` 返回第一个元素的值，`back()`\
  \ 返回最后一个元素的值。`pop()` 移除第一个元素，`size()` 返回队列中元素的数量。因此，程序显示：Front: 1 End: 3 Size: 2\n\
  \n### priority_queue 模板类\n\n`priority_queue` 模板类与 `queue` 类似。它们的主要区别在于，在 `priority_queue`\
  \ 中，元素根据某些优先级进行排序。默认优先级基于使用 `<` 运算符对元素进行比较。因此，存储在队列头的元素是最大的。例如：\n\n`top()` 返回队列的第一个元素，即\
  \ 30。如果我们想更改排序顺序，我们将所需的方法作为第三参数添加。第二个参数表示用于存储元素的底层容器的类型。例如，如果我们写：\n\n排序将按降序进行。因此，第一个元素将是\
  \ 10。我们稍后会讨论 `greater<>`。\n\n### stack 模板类\n\n`stack` 模板类实现了一个 LIFO（后进先出）栈，其中元素只在容器的一端进行插入和提取。该实现支持栈的基本功能。因此，我们可以在栈顶添加元素、从栈顶移除元素、查找顶元素的值、检查栈是否为空以及查找存储的元素数量。对其元素进行随机访问，也无法遍历栈。使用\
  \ `stack` 必须包含 `stack` 头文件。让我们来看一个例子：\n\n`push()` 将元素添加到栈顶。`top()` 返回顶元素的值。`pop()`\
  \ 移除顶元素，`size()` 返回栈中元素的数量。因此，程序显示：Top: 30 Size: 2\n\n### 关联容器 (Associative Containers)\n\
  \n关联容器将每个元素与一个键关联，并使用该键在容器中查找元素。也就是说，关联容器的设计是为了通过键来查找和访问元素，而顺序容器的设计是为了根据其位置来查找和访问元素。例如，假设每个元素都是一个表示学生的结构体，包含名称、代码、成绩、地址、联系信息等成员。键可以是学生的代码，它是唯一的。容器使用该键来存储和定位每个元素。当我们添加元素时，无法指定它们被插入的位置，因为容器会应用算法来确定插入位置。实现关联容器的常用方法是二叉搜索树形式。该容器提供了对其元素的快速访问。\n\
  \nSTL 提供了 `set`、`multiset`、`map` 和 `multimap` 容器，它们按顺序存储元素。前两个定义在 `set` 文件中，另外两个在\
  \ `map` 文件中。在 `set` 容器中，每个元素的值与其键相同，且每个键都是唯一的，而 `multiset` 容器可能包含具有键的元素。在 `map`\
  \ 容器中，每个元素的键与映射的数据关联。每个键都是唯一的，而 `multimap` 容器可能包含具有相同键的元素。STL 还提供了 `unordered_set`、`unordered_multiset`、`unordered_map`\
  \ 和 `unordered_multimap` 容器，它们不按顺序存储元素。这些容器在元素不需要按顺序存储的应用中非常有用。让我们来看 `set` 和 `map`\
  \ 容器的两个例子。\n\n### set 模板类\n\n`set` 容器包含元素，其中每个元素的值也是标识它的键。它在我们只需要快速检查给定值是否存在于容器中的应用中非常有用。`set`\
  \ 中的值（键）是唯一的，即每个元素最多出现一次。元素按键顺序排序。默认情况下，容器使用 `<` 运算符按升序排序元素；但我们可以指定比较方法。通常，set 容器的实现基于某种平衡树数据结构。查找元素或插入新元素执行很快。元素的值不能修改，只能删除。该类支持双向迭代器。让我们来看一个例子：\n\
  \n当我们创建一个 `set` 对象时，指定它包含的键的类型（例如 `string`）。`insert()` 将参数插入容器中。`find()` 返回指向参数存储位置的迭代器（如果找到的话）。`erase()`\
  \ 移除迭代器指示的元素。因此，程序显示：\n\n如你所见，尽管在列表中出现了两次，但在容器中只存储一次，因为每个键必须是唯一的。此外，输出确认了元素是按顺序存储的。\n\
  \n### map 模板类\n\n在 `vector` 之后，`map` 可能是第二个常用的容器。`map` 容器包含由键值和关联的数据组成的元素。它在键值（例如学生代码）与一组信息（例如学生数据）关联的应用中非常有用。给定键值，我们可以快速存储或检索关联的信息。与\
  \ `set` 容器一样，map 中的每个元素由其键值唯一标识，键是唯一的，元素按键顺序排序。此外，它的实现基于某种平衡树。当我们创建一个 `map` 对象时，指定键的类型和它包含的数据类型。例如，声明：\n\
  \n\n\n\n创建一个键类型为 `int`且数据类型为 `string` 的 map 对象。可以添加第三个参数来指定要使用的排序方法。默认排序为升序。map\
  \ 类使用 `pair<class K, class T>` 模板类将键和数据组合在一起。特别是，如果 `key_type` 是键的类型而 `data_type`\
  \ 是存储数据的类型，那么组合后的信息类型为 `pair<key_type, data_type>`。例如，`m` 对象包含类型为 `pair<int, string>`\
