  \ = type;` 是不可接受的。\n\n## 嵌套类\n\n一个类可以声明在另一个类内部。这种类被称为*嵌套类*（nested）。使用嵌套类的典型原因是将仅在一个地方使用的类组合在一起，并以更紧凑的形式描述该实体。例如，在一个管理公司的应用程序中，我们可以声明\
