  \n## 14 内存管理与数据结构\n\nDOI: [10.1201/9781003230076-14](https://doi.org/10.1201/9781003230076-14)\n\
  \n内存管理主要涉及内存分配以及在不再需要时对已分配内存的释放。内存分配可以通过*静态*或*动态*方式进行。在目前到目前为止的程序中，我们大多使用静态分配，即程序变量存储在固定大小的内存中。在本章中，你将学习如何在程序执行期间动态分配内存，以便构建灵活的数据结构，如链表和二叉树。\n\
  \n### 内存块 (MEMORY BLOCKS)\n\n当程序运行时运行时，它会向操作系统请求内存资源。不同的操作系统和编译器使用自己的模型来管理可用内存。通常，运行中程序的内存布局分为四个部分：\n\
  \n1. `code` 段，用于存储程序代码。\n2. `data` 段，用于存储全局变量和静态变量。\n3. `stack` 段（栈段），用于存储函数数据，例如局部变量。\n\
  4. `heap` 段（堆，也称为 `free store`），用于动态内存分配。\n\n注意，这种分布模型是一种典型的选择；每个系统可能会定义自己的模型。此外，每个编译器都可能应用自己的优化策略。例如，函数的参数可能会存储在系统寄存器中以便快速访问，而不是栈中。\n\
  \n## 静态内存分配 (STATIC MEMORY ALLOCATION)\n\n在静态分配中，内存是从栈中分配的。分配内存的大小是固定的；我们在编写程序时必须指定其大小，且它在程序执行期间不能改变。例如：\n\
  \n编译器在编译程序时分配 `1000×sizeof(float)` 字节来存储 1000 个学生的成绩。无论程序最终是否使用该数组，内存都会被分配。数组的长度保持固定；如果我们需要存储更多学生的成绩，无法在程序执行期间更改它。如果证明学生少于\
  \ 1000 人，内存就会浪费。更改数组长度的唯一方法是修改程序并重新编译。\n\n让我们简要讨论一下调用函数时发生了什么。编译器在栈中分配内存来存储函数数据。如所述，可能会使用系统寄存器；为了简单起见，我们假设分配发生在栈中。例如，如果函数返回一个值、接受参数并使用局部变量，编译器将分配内存来存储：\n\
  \n1. 参数的值。\n2. 局部变量。\n3. 返回值。\n4. 函数终止时下一条语句的地址。\n\n当函数终止时，会发生以下操作：\n\n1. 如果返回值被赋值给变量，它将从栈中提取并存储到该变量中。\n\
  2. 从栈中提取下一条语句的地址，程序继续执行该语句。\n3. 分配存储函数数据的内存被释放（`static` 变量除外）。\n\n例如，在下面的程序中，调用\
  \ `test()` 时，编译器在栈中分配 `202×sizeof(int)` 字节来存储 `i`、`j` 和 `arr` 元素的值：\n\n这些内会在 `test()`\
  \ 终止时自动释放。同样，为 `main()` 的局部变量分配的 `1010×sizeof(float)` 字节内会在程序结束时释放。\n\n当函数分配了大块内存，并调用了具有相当内存需求的其他嵌套函数时，可能会发生这种情况。例如，一个多次调用自身的递归函数可能会导致可用栈内存耗尽。\n\
  \n### 动态内存分配 (DYNAMIC MEMORY ALLOCATION)\n\n在动态分配中，内是在程序执行期间从堆中分配的，而不是在编译时。与静态分配不同，它的大小可以动态指定。此外，此大小可能会根据程序需求动态收缩或增长。例如，`vector`\
  \ 类动态分配它存储其元素所需的内存。动态分配在用户与程序交互的应用中非常常见。例如，如果程序不知道学生人数，它会提示用户输入，然后为结构体数组分配内存以存储他们的数据。\n\
