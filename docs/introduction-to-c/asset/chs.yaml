  \n注意模板成员函数不允许是虚函数。例如，写以下内容是错误的：\n\n不允许这样做是因为第 20 章中提到的虚函数数组 (*vtbl*) 将变得复杂，因为每当用新类型调用\
  \ `f()` 时，都要为 A 类添加新条目。\n\n## 类模板与朋友\n\n与普通类一样，类模板也可以朋友。它的朋友可以是类、函数、类模板或函数模板。如果一个类是类模板的朋友，那么它的成员函数成为该类模板所有实例的朋友。朋友函数可以是：\n\
  \n1.  非模板。\n2.  模板，其中朋友函数的某个实例化仅是相应类实例的朋友。\n3.  模板，其中朋友函数的所有实例化都是每个类实例的朋友。\n\n让我们简要描述这些情况。\n\
  \n### 非模板朋友函数\n\n当类模板包含一个非模板朋友函数时，该函数成为类模板所有实例的朋友。例如：\n\n`g()` 函数成为 `A` 类模板所有实例的朋友。我之所以让\
  \ `f()` 接收模板参数是为了观察它是如何与 `A` 实例关联的。当声明 `a` 对象时，`T` 被替换为 `int`，`f()` 的原型变为：\n\n\n\
  \n因此，参数为 `A<int>&` 的 `f()` 成为 `A<int>` 类的友函数。同样，参数为 `A<double>&` 的 `f()` 成为 `A<double>`\
  \ 类的友函数。注意 `f()` 不是一个函数模板，它只是接收一个模板参数。这就是为什么我们需要为计划使用的类型为 `f()` 定义显式的特化版本。例如，如果缺少参数为\
  \ `A<double>&` 的 `f()` 定义，编译器将在语句 `f(d);` 处显示错误信息。为了更清楚地说明，`g()` 与类 `A` 具有一对多的友元关系，即它是\
  \ `A` 所有实例的友元，而 `f()` 则具有一对一的关系。程序输了 5、2.3 和 `t`。\n\n### 绑定到类模板的友函数模板\n\n当一个类模板包含一个友函数模板时，该类的每个版本都可以绑定到匹配的友函数版本。让我们来看一个例子，其中类模板包含两个友函数模板：\n\
  \n对于带有模板绑定的友函数，情况比非模板的要复杂。首先，我们在定义类模板之前声明它们的原型。然后，我们在类中再次将它们声明为友函数。声明中的 `<>` 表示它们被声明为模板特化版本。我之所以让\
  \ `f()` 不接收参数是为了观察如何使用此类函数。因为 `f()` 不接收参数，当我们调用它时，必须使用模板语法 `<>` 来指示其特化版本的类型（例如 `f<int>`）。对于\
  \ `g()` 的情况，`<>` 可以留空，因为模板参数的类型可以从函数参数的类型推断出来。\n\n当定义类模板的一个版本时，绑定到该版本的相应友函数也会被定义。也就是说，对于\
  \ `A` 的每个实例化，每个友函数都将有一个匹配的实例化。例如，当定义 `A<int>` 类时，模板特化版本 `f<int>()` 和 `g<A<int>&>()`\
  \ 成为 `A<int>` 类的友元。同样，当定义 `A<float>` 类时，`f<float>()` 和 `g<A<float>&>()` 函数成为它的友元。如你所见，存在一对一友元关系。\n\
  \n让我们看看调用它们时会发生什么。由于 `f()` 不接收任何可以让编译器推断预期特化类型（`int` 或 `float`）的参数，我们应该在 `<>` 中指定类型。因此，当调用\
  \ `f<int>()` 时，`T` 被替换为 `int`，程序显示 `A<int>::cnt` 的值。由于创建了两个 `A<int>` 类对象和一个 `A<float>`\
  \ 类对象，`A<int>::cnt` 的值变为 2，`A<float>::cnt` 的值变为 1。调用 `g()` 时，编译器检查参数类型以推断特化版本。例如，通过语句\
  \ `g(a1);`，编译器发现 `a1` 的类型是 `A<int>`，程序显示 `a1.p` 的值。\n\n### 未绑定到类模板的友函数模板\n\n在上一节中，我们看到友函数是类外声明的模板的特化。我们还看到类的每个实例化都绑定到匹配的友函数版本。例如，`A`\
  \ 类的 `int` 版本绑定到友函数的 `int` 版本。如果我们在类内部声明模板，就可以创建非绑定的友函数，也就是说，每个友元实例化都成为类所有版本的友元，而不再像以前那样仅限于特定实例。对于非绑定友元，我们在其参数类型中使用与类的参数类型不同的名称。考虑以下程序：\n\
  \n对于 `A` 的所有实例化，`f()` 的所有实例化都是友元。也就是说，`f()` 与 `A` 类具有多对多的友元关系。因此，`f()` 可以访问 `a1`、`a2`\
  \ 和 `a3` 对象的私有成员 `p`。请注意，只有在程序中调用友函数时，才会创建友模板的实例。例如，语句 `f(a1);` 导致了 `void f(A<char>&\
  \ v)` 的实例化，程序显示 `a1.p` 的值。最后，程序输出 `r` 5 和 2.3。\n\n### 作为友元的类模板\n\n类模板可以是普通类的友元。在这种情况下，类模板的所有实例化都成为该类的友元。例如：\n\
  \n由于 `B` 类模板被声明为 `A` 类的友元，因此 `B` 模板每个实例的每个成员函数都是 `A` 类的友元。在这里，我们有两个 `B` 实例化，程序两次输出了\
  \ 20。\n\n## 类模板特化\n\n你可能会遇到许多情况，类模板无法支持所有可以想象的参数类型。例如，类模板的比较函数可能适用于传递的字符串类型，但可能适用于\
