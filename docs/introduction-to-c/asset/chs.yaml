  \ C++ 支持静态类型控制，这意味着类型使用的有效性检查是在编译期间完成的，而不是在程序运行期间完成的。也就是说，如果我们执行了该类型不支持的操作，编译器将生成错误信息。静态类型控制是有效使用语言的基础，因为在运行程序之前就可以检测到错误。在书的后面，我们将看到可以使用运算符使用基本类型创建其他类型（例如，指针）。我们还将学习创建自己的类型，例如结构体和类。\n\
  \n### 变量声明\n\n变量在程序中使用之前必须声明。声明告知编译器变量的名称及其类型。我们已经在上一节中看到了一些声明的示例。要声明一个变量，我们写：\n\
  \n```\ndata_type variable_name;\n```\n\n`variable_name` 是变量名，`data_type` 是它的类型。正如我们所说，C++\
  \ 是一种静态类型语言，这意味着编译器在变量使用时必须知道每个实体（例如变量）的类型。实体的类型决定了我们可以对其执行的操作。例如，要声明一个名为 `i` 的整数变量和一个名为\
  \ `j` 的浮点变量，我们写道：\n\n```\nint i;\nfloat j;\n```\n\n相同类型的变量可以在同一行中声明，并用逗号分隔。例如，与其在三不同的行中声明变量\
  \ `i`、`j` 和 `k`：\n\n```\nint i;\nint j;\nint k;\n```\n\n我们可以在同一行中声明它们并节省空间：`int\
  \ i, j, k;`\n\n例如，如 表 2.1 所示，`char` 类型保留一个字节，而 `double` 类型保留八个字节。此外，编译器会保存变量的名称及其内存地址，因此每当在程序中使用变量时，编译器都会使用名称检索对应的地址并访问内容。例如，通过语句\
  \ `i = 10;`，编译器将值 `10` 存储在与名称 `i` 对应的内存位置。正如我们在 第 8 章 中看到的，可以使用 `&` 运算符获取 `i` 的内存地址。注意，值\
  \ `10` 与任何其他值（例如 float、字符……）一样，是以二进制位 0 和 1 的序列存储在内存中的。\n\n接下来，我们将看到声明变量时可以指定更多属性，例如类型限定符和存储类（我们将在将在\
