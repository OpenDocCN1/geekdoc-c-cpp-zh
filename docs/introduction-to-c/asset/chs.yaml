  \n\n\n\n\n就像普通变量一样，当声明指针变量时，编译器会分配内存来存储它的值。因此，我们可以声明另一个指针变量来指向这个内存地址。要声明一个指向指针变量的指针，我们使用两次\
  \ `*`。例如，以下语句：\n\n```cpp\nint **pp; // 将 pp 声明为指向 int 的另一个指针的指针。\n```\n\n要使用指向指针的变量，单个\
  \ `*` 提供了访问第二个指针地址的方法，而双星 `**` 则提供了访问第二个指针所指向的内容的方法。例如：\n\n由于 `pp` 指向 `p` 的地址，因此\
  \ `*pp` 等于 `p`。由于 `p` 指向 `i` 的地址，因此 `**pp` 等于 `i`，程序显示 20。\n\n指向指针的变量最常见的用法是当我们希望函数更改一个指针类型参数的值时。我们将在第\
  \ 11 章中讨论此类示例。通常情况下，允许声明指向另一个另一个指针变量的指针，以此类推（例如 `int ***p;`），但在实践中，很少需要超过两层深度。让我们来看一个结合了数组、指针数组和指向指针的指针的示例：\n\
  \n初始时，`pp` 指向 `p[0]`，`p[0]` 指向 `a[0]` 的地址。因此，`**pp` 等于 `a[0]`。增加时，`pp` 指向 `p[1]`，`p[1]`\
  \ 指向 `a[1]`。结果是程序显示：10 20 30。\n\n## 练习\n\nC.8.21 下程序的输出是什么？\n\n**答案：** 由于 `pp` 指向\
  \ `p` 且 `p` 指向 `i`，因此 `**pp` 等于 `i`。因此，语句 `**pp = j;` 等于 `i = j = 20`。语句 `p = &j`\
  \ 使 `p` 指向 `j`，因此 `**pp` 等于 `j`。因此，语句 `**pp += 10;` 等于 `j = j+10 = 20+10 = 30`。结果是程序显示\
  \ 50。\n\nC.8.22 下程序中 `a` 元素的值是多少？\n\n**答案：** 由于 `p[0]` 等于 `&k`，`p[1]` 等于 `&b`，`p[2]`\
