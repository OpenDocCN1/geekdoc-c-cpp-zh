    \   catch (DivideByZeroException e)\n    {\n        Console.WriteLine(\"Exception\
    \ caught: {0}\", e);\n    }\n    finally\n    {\n        Console.WriteLine(\"\
    Result: {0}\", result);\n    }\n}\n```\n\nTake a look at the above code to get\
    \ an idea of how the try catch statement works within an actual application.\n\
    \nWe created a division function that divides two numbers. The function takes\
