  md: '# Final Words


    This is the start of your journey as a C# programmer. You have just barely scratched
    the surface with this guide, as learning the syntax and conventions of a language
    is just the beginning. The most important part of programming is the logical aspect
    of it. Sure, you may know how to loop through an array of variables like a list
    of shopping items, but if someone asks you to process an image using your knowledge
    of programming, with the help of an API and some thing you can figure out how
    to invert the colors of an image, flip it, rotate it, scale it, etc.


    The real programming comes in the logical portion of the mind. It''s similar to
    learning any other language, like English for example. You may understand the
    grammar rules and the conventions, like adding periods to the end of sentences—but
    the true skill lies in being able to write clean and logically thought-out structured
    essays. The same concept applies to programming, where the person writing the
    code must know how to apply or his knowledge of the rules of the language (like
    C#) and use it to his or her advantage to come up with neat programs.


    The knowledge and understanding of programming is truly great because it''s the
    closest thing we have to have magical powers. You can literally create something
    from scratch out of an empty notepad and have it to do things you want to do.
    Whether that be a bot to analyse and predict the stock market or a video game,
    that choice is yours.


    In this guide you have learned the fundamentals of C#. You haven''t learned all
    the possible methods that can be used in the language, but that isn''t the point.
    This guide was designed to set you on a journey toward discovering objects and
    methods that you need in order to help you to create programs that you desire.
    You have been given the optimum knowledge to understand how to read an API and
    to be able to understand what it adds to your code.


    Good luck and we hope you enjoy this book!


    Alphy Books Team.'
