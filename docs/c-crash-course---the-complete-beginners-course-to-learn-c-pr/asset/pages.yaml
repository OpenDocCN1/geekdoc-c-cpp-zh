    \ from multiple classes by adding a comma and then adding more names of parent\
    \ classes to indicate that you want to derive from multiple parents. Child classes\
    \ can also derive from other child classes. The parent class definition doesn't\
    \ matter as long as it's not set to private. Once you set a class to private,\
    \ you can't derive from or instantiate it, so be careful with the specifiers that\
