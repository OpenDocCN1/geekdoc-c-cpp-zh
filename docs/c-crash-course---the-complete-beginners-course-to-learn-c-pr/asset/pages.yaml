  md: '# # Chapter 15

    # Error Handling


    **Objective:** Before you deploy your application, you need to fix any bugs. This
    chapter focuses on debugging and how you can test your applications before you
    deploy them to your users and production.


    It''s always a priority to test an application before you promote it to a production
    server or deploy it to your users. You can still use a beta testing application
    before you actually deploy the full version, but even then you should debug your
    application. One part of debugging is through error handling. Error handling is
    a way to trap errors and “handle” them for the user. These error handling events
    display a user-friendly message to the user, so your code doesn''t frustrate your
    users. This chapter discusses how you can manage this type of process within your
    code.


    # ## Using the Visual Studio Debugger


    As mentioned, you need the Visual Studio code editor to create and compile code
    in C#. Visual Studio includes a debugger that you can use to walk through your
    code. Is one advantage of working with C# over other languages that don''t have
    a good IDE for programming. C# lets you walk through each of your lines of code,
    and then you can watch the value of a variable as you walk through these lines
    of code.


    You can start the debugger menu using the F5 key or by using the debugger menu
    item in your Visual Studio main. You can also set stop points called breakpoints
    in your code. These breakpoints let pause the compiler and run processes to see
    what is happening in your code. For instance, suppose you have an error or bug
    in one of your modules. You''re not sure what variable is being set to a value,
    and you think that this variable is causing the bug in your program. You can set
    a breakpoint at a certain part of your code to view the value of the variable
    at a certain point in the run process for your code.


    The Visual Studio Watch List is important for this process because it gives you
    the ability to view variable values in real time. If it weren''t for this tool,
    you would only be able to guess the value of a variable as you worked through
    your code. The Visual Studio Watch List lets you see the value of a variable as
    you walk through your code. It''s an excellent way to identify if a variable has
    been given the wrong value, and it lets you identify if you have a logic error
    in your code. Because logic errors occur during run time, it''s useful for your
    debugging process to consider if you have a logic error in an area such as a loop
    or an if statement.


    # ## The Try Catch Statement in C#'
