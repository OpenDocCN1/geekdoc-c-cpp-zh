  md: "For error handling, the main component in any .NET language (including C# and\
    \ VB.NET) is the try catch statement. This statement lets you trap errors and\
    \ perform a user-friendly function that handles the errors for your users. You\
    \ don't want to create unfriendly, messy errors for your users. In some cases,\
    \ these errors can cause security issues for your application. Poorly handled\
    \ error messages can display information, and in some cases, they can show passwords\
    \ and user information that can be used for hacking your server—which you don't\
    \ want displayed to the Internet public. The solution to this issue is to trap\
    \ your errors and display a user-friendly message that tells your user how to\
    \ handle the errors without causing them much frustration.\n\nLet's first look\
    \ at the template used to create a try catch statement. We have created a basic\
    \ template for you to follow.\n\n```\ntry\n{\n  // statements causing exception\n\
    }\ncatch(ExceptionName e1)\n{\n  // error handling code\n}\ncatch(ExceptionName\
    \ e2)\n{\n  // error handling code\n}\ncatch(ExceptionName eN)\n{\n  // error\
    \ handling code\n}\nfinally\n{\n  // statements to be executed\n}\n```\n\nIn the\
    \ code above, we first declare the try statement. This indicates that you're starting\
    \ the try catch statement.\n\nEach catch statement in the try catch statement\
    \ catches a different type of error. This part of the statement can be tricky\
    \ if you don't know what type of errors you should expect, but you should create\
    \ catch statements that trap any type of error. When the compiler catches these\
    \ types of statements, then they move into the catch statement block, which is\
    \ where you create your custom code that handles the errors that you weren't"
