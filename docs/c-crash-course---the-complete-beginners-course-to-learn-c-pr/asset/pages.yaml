    \ place them in the Animal class so all other child classes could use these properties\
    \ and methods.\n\n# Inheritance and Interfaces\n\nInterfaces are the foundation\
    \ of inheritance. Interfaces allow you to define one class that can contain the\
    \ declaration of each class that links to the interface, but any class can derive\
    \ from it. It provides a way to create a “contract” between the child class and\
    \ the parent classes that are linked to the interface.\n\nInterfaces are different\
    \ than classes in that they only contain the declaration of the classes and not\
    \ the class definitions. Let’s take a look at a sample interface.\n\n```\npublic\
    \ interface IAnimal {\n    // interface members\n    void breathe();\n}\n```\n\
    \nSince we only have one method in the Animal class, we only have one animal method\
    \ defined in the interface. Notice that there are no class definitions in the\
    \ interface. You just define the functions that are used in the interface. This\
    \ also defines the ones that can be used in child classes. These interfaces make\
    \ it easier to scale your classes, because you can create methods within your\
    \ class that aren't ready to be released without any child classes to derive these\
    \ methods until they are ready for use."
