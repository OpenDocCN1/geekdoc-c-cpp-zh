    C# is case sensitive, so MyClass is a class and myclass is a variable, and the
    compiler understands the difference.


    # Constants


    You don''t always need to dynamically assign a value to a variable. Sometimes
    know that you know the value of pi is always 3.14. You don’t need to dynamically
    assign this value, so you can create a constant. A constant holds a static value
    that never changes. If you attempt to change this variable’s value, the compiler
    gives you an error.


    You define a constant same you define a dynamic variable, except you use the const
    keyword as the first specifier. Let’s take a look at an example using a pi variable.


    ```cs

    const decimal pi = 3.14;

    ```


    We used the decimal data type because pi has several precision points that we
    can use. We won’t be able to change the value in our code, so the pi variable
    will remain with the value 3.14 throughout the lifetime of the program.


    The const data type is used within a class to specify that the variable should
    have the same value throughout the lifetime of the class. The variable is destroyed
    when the class is destroyed in memory, but you should know that the variable’s
    value doesn’t change, regardless of where the variable is used in the code. Because
    a constant can’t have a dynamic value, you must give it a value when you define
    it. If you recall, assigning a value to a dynamic variable is optional.


    Using data types is something you’ll use in every C# program you create. You’ll
    need to know how identify data types as you read other coders’ code. You might
    need to reference the values that can be used with each data type, but you should
    at least understand which ones store numbers versus strings and other data types.


    # Lab Questions


    - 1. When you want to use a small decimal variable, what data type should you
    give it?


    - a. decimal

    - b. double

    - c. float

    - d. int


    Explanation: The float data type is the smallest decimal data type in C#.


    - 2. When you want to store a numeric value with no decimal precision, what data
    type do you give the variable?


    - a. decimal

    - b. double

    - c. float

    - d. int


    Explanation: The integer data type stores a numeric value that can be either positive
    or negative (unsigned or signed).


    - 3. When you need scientific-level storage that contains high-precision decimal
    values, what data type do you use?


    - a. decimal

    - b. double

    - c. float

    - d. int


    Explanation: The decimal data type stores up to 28 decimal place precision points
    for precise calculations.


    # Chapter 4

    ## Operators


    **Objective:** Operators are a good follow-up to data types, because they perform
    the operations on your values. This chapter discusses the main operators in C#
    and how you use them to manipulate your code.


    After you store values to your variables, you need to perform actions, whether
    they are mathematical calculations or just string manipulation. Regardless of
    what you need to do with the variables, you need an operator to perform each action.
    In this chapter, we discuss operators and how you can use them for your C code.


    ## Mathematical Operators


    Mathematical operators are probably the most common, because you''ll need to perform
    some type of calculation on your numeric variables. Mathematical operators are
    intuitive, because they follow the same rules that you learned in math class.
    Mathematical operators include addition, subtraction, division, and multiplication.
    C# also has a modulus operator for division remainders. With programming in C-style
    languages, you can also choose to use incremental and decremental operators. We''ll
    cover all of these in this section.


    The first operator is the addition operator. As the name suggests, you use this
    operator to add a value to an existing variable. The following code shows you
    how to add in C#.


    ```cs

    int myNumber = 3;

    int addedNumber = myNumber + 4;

    ```


    In the code above, we first created a variable and then we created a second variable
    that contained the result of the addition of myNumber to 4. As you can probably
    guess, the result is 7.


    The next operator is subtraction. Just like the addition operator, the subtraction
    operator is intuitive. It simply subtracts a number from a variable. The following
    code is an example of the subtraction operator.


    ```cs

    int myNumber = 3;

    int addedNumber = myNumber - 4;

    ```


    The code above is the same as that we used in the addition example, except this
    time we subtracted the number 4 from the myNumber variable. The result is -1,
    stored in the addedNumber variable.

