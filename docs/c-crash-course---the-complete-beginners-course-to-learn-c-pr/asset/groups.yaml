    \ OOP 及其概念工作。\n\n## 理解 OOP 基础\n\nOOP 使用创建组合在一起以构建整个程序的各个部分的概念。这些部分被称为类（classes）。它们也被称为类对象。类代表了你程序的每个部分。\n\
    \n为了理解为什么类代表了程序的部分，请想象一下汽车。汽车有几个部分组合成一整辆汽车。每个部分单独来说都是没用的，但当它们组合在一起时，它们就创造了一台许多人无法制造的机器。\n\
    \n以汽车为例，你需要（除其他之外）发动机、方向盘和轮胎来组成一台汽车。没有这些组件，汽车就是没用的。类代表了汽车的这些部分。类包含了这些部分的所有属性，以及它们移动或停止汽车所需的任何操作。\n\
