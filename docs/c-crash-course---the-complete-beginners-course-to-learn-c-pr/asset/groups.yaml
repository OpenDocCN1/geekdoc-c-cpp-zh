    \ `private`（私有），父类的定义就并不重要。一旦你将一个类设置为私有，你就无法派生它或对其进行实例化，因此在选择修饰符时要小心。\n\n我们的 `Lion`\
    \ 类还拥有属性和方法，它们定义了狮子特有的特征。狮子会咆哮，因此我们有一个 `Roar` 方法来定义狮子说话的方式。我们还有一个 `mane` 属性，来定义狮子的鬃毛。这两个特征是狮子特有的，因此它们属于\
    \ `Lion` 类。如果它们对所有动物都是通用的，我们会把它们放在 `Animal` 类中，以便所有其他子类都能使用这些属性和方法。\n\n## 继承与接口\n\
    \n接口是继承的基础。接口允许你定义一个类，该类可以包含链接到接口的每个类的声明，但任何类都可以派生它。它为子类与链接到接口的父类之间提供了一种创建“合约”的方法。\n\
    \n接口与类不同，它们只包含类的声明而不包含类的定义。让我们来看一个示例接口。\n\n```c\npublic interface IAnimal {\n\
    \    // interface members\n    void breathe();\n}\n```\n\n由于我们在 `Animal` 类中只有一个方法，因此在接口中也只定义了一个动物方法。注意，接口中没有类定义。你只需要定义接口中使用的函数。这同时也定义了可以在子类中使用的函数。这些接口使得扩展你的类变得更容易，因为你可以在类中创建尚未准备好发布的方法，而在这些方法准备好使用之前，不需要有任何子类来派生它们。\n\
    \n标准的命名方案还包括在命名接口时使用 `I` 前缀。当你在代码中同时处理类和接口时，该前缀可以区分类和接口之间的区别。\n\n一旦你创建了接口，就可以在你的类中继承它。让我们来看看\
    \ `Animal` 类派生自 `IAnimal` 接口的情况。\n\n```csharp\npublic interface IAnimal {\n  \
    \  // interface members\n    void breathe();\n}\n\nabstract class Animal : IAnimal\
