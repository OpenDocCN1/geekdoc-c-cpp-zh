    \n## 公共修饰符 (Public Specifier)\n\n一旦你设计了类，就必须决定要让它们对程序的其他部分可用。我们将在下一节讨论如何创建类，但理解围绕它们的基础知识很重要。\n\
    \n`public` 修饰符告诉程序该类可以在程序的任何区域访问。让我们来看一个带有 `public` 修饰符的 `Customer` 类示例。\n\n```\n\
    public class Customer {\n    public Customer() { }\n    public string first_name;\n\
