    \ example, you need (among other things) an engine, a steering wheel, and tires\
    \ to make up a car. Without these components, the car is useless. Classes represent\
    \ these parts of the car. The class contains all attributes for these parts and\
    \ any actions that they need to move or stop the car.\n\nBefore you begin your\
    \ program, you need to design it prior to programming it. When you design your\
    \ classes using either a third-party diagramming program or your own sketches\
    \ and drawings. Whatever you use, it's important to lay out the program and determine\
    \ the way your classes will represent the parts of your program. When you design\
