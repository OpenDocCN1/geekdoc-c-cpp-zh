    \ 类中，注意类的第一个修饰符是 `public` 关键字。如果我们删除了 `public` 关键字，该类将对程序的其他部分不可用。\n\n你还会注意到构造函数被设置为\
    \ `public`。我们将在下一节介绍构造函数的作用，但只需知道这对于程序的其他部分实例化该类并使用其属性和方法是必要的。它也也被设置为 `public`\
    \ 的，但我们也可以将其设置为 `private`。`public` 修饰符允许程序的其他部分实例化该类。\n\n为了向你展示示例，以下代码实例化了类并将其赋值给变量。\n\
    \n```\nCustomer cust = new Customer();\ncust.firstLine = \"John\";\nConsole.WriteLine(cust.first_name);\n\
    ```\n\n## 私有修饰符 (Private Specifier)\n\n与 `public` 修饰符一样，`private` 修饰符也是你类的一个选项。它将类从程序的其他部分隐藏起来。通过\
