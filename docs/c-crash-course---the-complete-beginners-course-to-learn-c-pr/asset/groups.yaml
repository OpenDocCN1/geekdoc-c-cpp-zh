    \n```\nint j = 0;\nj--;\n```\n\n注意，我们只是把加号替换成了减号。结果是变量 `j` 递减了 1。上面的代码与下面的代码相同。\n\
    \n```\nint j = 0;\nj = j - 1;\n```\n\n结果是变量 `j` 包含值 -1。\n\n上面的运算符都是你在整个 C# 代码中将使用的运算符。这些计算在任何\
    \ C# 程序中都是常见的。\n\n# 关系运算符\n\n关系运算符用于我们将在后续章节中讨论的循环和条件。关系运算符在两个值（静态或动态变量）之间进行比较。在本节中，我们将介绍不同的运算符。\n\
    \n在许多情况下，你需要确保两个变量彼此相等。关系运算符用于 `if` 条件中，我们将使用 `if` 语法——但请知道，此操作的完整覆盖将在后面的章节中介绍。\n\
    \n让我们先来看相等运算符。\n\n```\nint myNumber1 = 1;\n myNumber2 = 2;\nif ( myNumber1 ==\
    \ myNumber2)\n{\n  //如果条件成立，则执行这些操作\n}\n```\n\n在上面的代码中，我们创建了名为 `myNumber1` 和 `myNumber2`\
    \ 的两个变量，并将它们初始化为 1 和 2。显然，这两个值不相等，`if` 条件中的关系运算符返回 `false`。由于结果为 `false`，`if`\
    \ 条件内部的语句不会执行。记住，如果关系运算符的结果为 `false`，则 `if` 语句括号内的任何内容都不会执行，代码执行将跳转到条件下方的任何代码。\n\
    \n就像相等运算符一样，你也可以识别两个变量是否不相等。使用相同的语法，让我们来看示例。\n\n```\nint myNumber1 = 1;\nint myNumber2\
