    \n在上面的语句中，`myNumber1` 确实小于 `myNumber2`，因此计算结果为 `true`。在这个示例中，`if` 语句括号内的语句将执行。\n\
    \n在之前的操作中，变量要么大于要么小于，但如果你想知道该值是否相等呢？你可以将大于和小于运算符与相等运算符结合，以检查两种条件。让我们来看大于等于运算符。\n\
    \n```\nint myNumber1 = 1;\nint myNumber2 >= myNumber1\n//如果条件成立，则执行这些操作\n```\n\
    \n在上面的语句中，没有任何条件是真实的。两个变量不相等，且 `myNumber1` 不大于 `myNumber2`。因此，没有任何 `if` 语句将执行。现在让我们来看小于等于语句。\n\
    \n```\nint myNumber1 = 1;\nint myNumber2 = 2;\nif ( myNumber1 <= myNumber2)\n\
    {\n//如果条件成立，则执行这些操作\n```\n\n# 逻辑运算符\n\n逻辑运算符允许你在语句中组合条件。你可以通过评估两个条件来控制执行流。有三个逻辑运算符：`&&`（与）、`||`（或）和\
    \ `!`（非）。\n\n让我们首先使用上一节中使用的 `if` 条件来看 `&&` 运算符。\n\n```\nint myNumber1 = 1;\nint\
    \ myNumber2 = 2;\nif ( myNumber1 < myNumber2 && myNumber1 == 2)\n{\n//如果条件成立，则执行这些操作\n\
    }\n```\n\n在上面的语句中，我们首先评估 `myNumber1` 是否小于 `myNumber2`。在这个示例中，结果为 `true`，但我们添加了\
    \ `&&` 逻辑运算符，所以语句在确定执行流之前必须评估第二个条件。第二个条件评估 `myNumber1` 是否等于 2。这个条件的结果为 `false`。因为我们使用了“与”，两个条件都为真时语句才会执行。由于其中之一为\
    \ `false`，`if` 语句不执行。\n\n让我们使用相同的值但将逻辑运算符更改为或（`||`）。\n\n```\nint myNumber1 = 1;\n\
    int myNumber2 = 2;\nif (myNumber1 < myNumber2 || myNumber1 == 2)\n{\n//如果条件成立，则执行这些操作\n\
    }\n```\n\n最后一个逻辑运算符是非（`!` 操作。非运算符改变条件的逻辑。让我们来看一些代码。\n\n```\nint myNumber1 = 1;\n\
    int myNumber2 = 2;\nif (!myNumber1 == 2)\n{\n//如果条件成立，则执行这些操作\n}\n```\n\n在上面的代码中，我们不是在评估条件是否为真，而是识别条件是否为假。因为有非运算符，你知道我们正在评估为\
    \ `false`。这个运算符有点让人困惑，但由于表达式计算结果为 `true`，非运算符将条件更改为 `false`。由于条件为 `false`，`if`\
    \ 语句执行。\n\n# 赋值运算符\n\n你已经见过赋值运算符了。等号是赋值运算符的一个简单示例。\n\n"
