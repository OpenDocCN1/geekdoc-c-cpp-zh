    \ put product inventory in the Product class or you would risk the possibility\
    \ of accidentally creating the same method twice when you realize it's not available\
    \ in the right class.\n\n## The Public Specifier\n\nOnce you design your classes,\
    \ you have to decide if you want to make them available to other parts of your\
