    # Chapter 5

    Loops and If Statements


    Objective: Loops and If statements control the way your code executes. We saw
    if statements in the last chapter, and we''ll dive deeper into them along with
    a review of loops.


    In every program, you need to evaluate statements and execute code depending on
    the way statements calculate. Loops iterate through a statement until they reach
    the stop condition, and if statements evaluate two conditions and execute statements
    based on the results. In this chapter, we''ll show you how to use both structures
    to control the way your code executes.


    # The For Loop


    The for loop is the most popular of all the loop structures. Loops iterate through
    a series of conditions until a stop condition is met. If the stop condition is
    never met, you create an infinite loop, so you always need to remember to include
    the stop condition. The for loop is the most popular, because it''s very difficult
    to reach the stop condition.


    Let''s take a look at the general syntax template you use for the for loop.


    ```

    for ( init; condition; increment )

    {

    // statements execute here

    }

    ```


    The for loop initializes a variable, sets a stop condition, and then increments
    the initialized variable. These three statements are separated by semicolons.
    With each iteration, the initialized variable is incremented until the condition
    is met and the loop exits. Let''s take a look at an example.


    ```

    for ( int j = 0; j < 5; j++) )

    {

    // statements execute here

    }

    ```


    In the above for loop, the j variable is initialized and set to 0. You can set
    the variable to any value, but the standard is to set it to zero because loops
    are usually used to iterate through arrays and these structures begin with index
    0. The next statement is the condition. As long as j is less than 5, the loop
    continues. Once j equals 5 or is more than 5, the loop executes. The increment
    statement adds 1 to j after every loop. Let''s add some more detail to what happens
    during a loop.'
