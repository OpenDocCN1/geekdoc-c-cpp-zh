    \ function breathe() {\n        return \"Animals breathe air.\";\n    }\n}\n```\n\
    \n派生主 `Animal` 接口只需要这些操作。现在，你的其他任何类都可以继承该接口或主 `Animal` 类。对于一个包含接口的程序来说，只允许程序员派生自接口是标准做法，但这取决于你设计代码和布局类的方式。\n\
    \n## 静态类\n\n静态类需要被提到，因为它们与普通的 `public` 类有些不同。静态类不需要实例化，当你想要创建一个包含你想在代码中随机使用的函数的类时，这使得它们是有益的。静态类使用\
    \ `static` 关键字定义。\n\n你可能需要一个静态类，因为它包含一个在你在编写代码时可能随手就的函数。例如，C# 中的 `ToString` 方法就是一个静态方法。你可以在不实例化类的情况下随时使用它。只需调用\
    \ `ToString` 方法，它就会将你的变量转换为字符串。当你想要将数字（例如）转换为字符串值时，就会使用此方法。`ToString` 方法无论其包含什么类型的数据，都会将任何变量转换为字符串。\n\
    \n让我们来看静态类。\n\n```csharp\nstatic class Animal : IAnimal\n{\n    public string\
    \ eye_color;\n    public string number_of_feet;\n    public function breathe()\n\
    \    {\n        return \"Animals breathe air.\";\n    }\n}\n```\n\n注意，我们将上述 `Animal`\
    \ 类中的 `abstract` 类型改为 `static`。现在，我们不需要实例化这个类了。由于它不再是抽象定义的类，我们现在可以实例化它。通过 `static`\
