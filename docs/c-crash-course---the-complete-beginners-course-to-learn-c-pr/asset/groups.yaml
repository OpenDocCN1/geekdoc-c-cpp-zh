    \ An abstract class is good for a top-level class that defines several child class\
    \ methods and properties, but it cannot be instantiated by any other parts of\
    \ your code. Instead, it can only be derived through child classes.\n\n- 2. What\
    \ type of function uses the same method name as another within a class, but passes\
    \ different parameters to distinguish it from the main method?\n  - a. overridden\n\
    \  - **b. overloading**\n  - c. private\n  - d. void\n\n**Explanation:** Function\
    \ overloading is a way to use a method name that is the same as others in its\
    \ class without causing errors from the compiler. Methods with the same name but\
    \ different parameters won't create a compiler error.\n\n- 3. What type of function\
    \ is used in a child class that derives a parent class method but changes its\
    \ functionality?\n  - a. overridden\n  - b. overloading\n  - c. private\n  - d.\
    \ void\n\n**Explanation:** Overridden classes change the way a parent class method...\n\
    \n# Chapter 15\n# Error Handling\n\n**Objective:** Before you deploy your application,\
    \ you need to fix any bugs. This chapter focuses on debugging and how you can\
    \ test your applications before you deploy them to your users and production.\n\
    \nIt's always a priority to test an application before you promote it to a production\
    \ server or deploy it to your users. You can still use a beta testing application\
    \ before you actually deploy the full version, but even then you should debug\
    \ your application. One part of debugging is through error handling. Error handling\
    \ is a way to trap errors and “handle” them for the user. These error handling\
    \ events display a user-friendly message to the user, so your code doesn't frustrate\
    \ your users. This chapter discusses how you can manage this type of process within\
    \ your code.\n\n## Using the Visual Studio Debugger\n\nAs mentioned, you need\
    \ the Visual Studio code editor to create and compile code in C#. Visual Studio\
    \ includes a debugger that you can use to walk through your code. Is one advantage\
    \ of working with C# over other languages that don't have a good IDE for programming.\
    \ C# lets you walk through each of your lines of code, and then you can watch\
    \ the value of a variable as you walk through these lines of code.\n\nYou can\
    \ start the debugger menu using the F5 key or by using the debugger menu item\
    \ in your Visual Studio main. You can also set stop points called breakpoints\
    \ in your code. These breakpoints let pause the compiler and run processes to\
    \ see what is happening in your code. For instance, suppose you have an error\
    \ or bug in one of your modules. You're not sure what variable is being set to\
    \ a value, and you think that this variable is causing the bug in your program.\
    \ You can set a breakpoint at a certain part of your code to view the value of\
    \ the variable at a certain point in the run process for your code.\n\nThe Visual\
    \ Studio Watch List is important for this process because it gives you the ability\
    \ to view variable values in real time. If it weren't for this tool, you would\
    \ only be able to guess the value of a variable as you worked through your code.\
    \ The Visual Studio Watch List lets you see the value of a variable as you walk\
    \ through your code. It's an excellent way to identify if a variable has been\
    \ given the wrong value, and it lets you identify if you have a logic error in\
    \ your code. Because logic errors occur during run time, it's useful for your\
    \ debugging process to consider if you have a logic error in an area such as a\
    \ loop or an if statement.\n\n## The Try Catch Statement in C#\n\nFor error handling,\
    \ the main component in any .NET language (including C# and VB.NET) is the try\
    \ catch statement. This statement lets you trap errors and perform a user-friendly\
    \ function that handles the errors for your users. You don't want to create unfriendly,\
    \ messy errors for your users. In some cases, these errors can cause security\
    \ issues for your application. Poorly handled error messages can display information,\
    \ and in some cases, they can show passwords and user information that can be\
    \ used for hacking your server—which you don't want displayed to the Internet\
    \ public. The solution to this issue is to trap your errors and display a user-friendly\
    \ message that tells your user how to handle the errors without causing them frustration.\n\
    \nLet's first look at the template used to create a try catch statement. We have\
    \ created a basic template for you to follow.\n\n```csharp\ntry\n{\n  // statements\
    \ causing exception\n}\ncatch(ExceptionName e1)\n{\n  // error handling code\n\
    }\ncatch(ExceptionName e2)\n{\n  // error handling code\n}\ncatch(ExceptionName\
    \ eN)\n{\n  // error handling code\n}\nfinally\n{\n  // statements to be executed\n\
    }\n```\n\nIn the code above, we first declare the try statement. This indicates\
    \ that you're starting the try catch statement.\n\nEach catch statement in the\
    \ try catch statement catches a different type of error. This part of the statement\
    \ can be tricky if you don't know what type of errors you should expect, but you\
    \ should create catch statements that trap any type of error. When the compiler\
    \ catches these types of statements, then they move into the catch statement block,\
    \ which is where you create your custom code that handles the errors that you\
    \ weren't\n"
  mdcn: "\n\n```csharp\nConsole.WriteLine(\"Animals say Hello\");\n);\nclass Lion:\
    \ Animal\n{\n    public Lion ()\n    {\n    }\n    public override void Speak()\n\
    \    {\n        Console.WriteLine(\"A lion roars\");\n    }\n    public override\
    \ void Speak ( string gender)\n    {\n        if ( gender == \"male\")\n     \
    \   {\n            Console.WriteLine(\"The female lion purrs.\");\n        } else\
    \ {\n            Console.WriteLine(\"The male lion roars.\");\n        }\n   \
    \ }\n}\n```\n\n注意我们现在已经在 `Lion` 类中添加了第二个方法。注意此方法的名字与我们的另一个 `Speak` 方法相同，但新方法接收一个\
    \ `gender` 参数。这个参数将不带任何参数的主 `Speak` 方法与这个接收 `gender` 参数的新方法区分开。这被称为**方法重载**（overloading），它是为你的程序创建动态类的一种完全合法的方法。\n\
    \n对于基础编程，你知道你可以为两个方法命名相同的名称，但你唯一需要更改的是参数的数量或参数所接收的数据类型。这产生了编译器可以理解的区分。因此，当编译器尝试编译你的代码时，不会返回错误。\n\
    \n让我们来看调用你新重载方法的代码以及在你调用它们后返回的结果。\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    Lion l1 = new Lion();\n    l1.Speak();\n    l1.Speak(\"male\");\n}\n```\n\
    \n上述代码的结果产生了如下输出：\n\nAnimals say hello.\nMale lions roar.\n\n编译器能够理解并区分这种差异，因为每个方法使用的参数数量不同。第一个没有参数，而第二个有一个\
    \ `string` 类型参数。\n\n# 抽象类\n\n你已经在我们的许多示例中看到抽象类了，但我们还没有真正讨论过抽象类与区别及其在你的编程项目中的重要性。抽象类通常是程序的主、顶层类。它们包含了所有子类之间的相似性。\n\
    \n以 `Animal` 类为例。我们为 `Lion` 和 `Bird` 类准备了一个 `Animal` 类。\n\n抽象类始终位于类设计的顶端。如果以 `Animal`\
    \ 类为例，任何会说话的动物都可以派生自主抽象类。\n\n多态是 C# 编码和通用面向对象编程（OOP）的重要部分。在几乎任何主要的企业级应用程序中，你都需要处理这种类型的编码。一旦你习惯了这些程序的运行方式，你就可以设计自己的多态编码设计，让你的\
    \ C# 代码更加动态且易于处理。\n\n# 实验题\n\n- 1. 哪种类型的类适用于主顶层类，但不能被代码的其他部分实例化？\n  - a. private\n\
    \  - b. abstract（抽象）\n  - c. private\n  - d. sealed（密封）\n\n**解释：** 抽象类适用于定义了多个子类方法和属性的顶层类，但它不能被代码的任何部分实例化。相反，它只能通过子类派生。\n\
    \n- 2. 哪种类型的函数在类中与另一个方法使用相同的方法，但通过传递不同的参数将其区别于主方法？\n  - a. overridden（重写）\n  -\
    \ **b. overloading（重载）**\n  - c. private\n  - d. void\n\n**解释：** 方法重载在使用类内与其他方法相同的方法的方法，而不会引起编译错误。同相同但参数不同的方法不会创建编译器错误。\n\
    \n- 3. 子类中使用哪种类型的函数派生自父类方法但更改了其功能？\n  - a. overridden（重写）\n  - b. overloading（重载）\n\
    \  - c. private\n  - d. void\n\n**解释：** 重写类改变了父类方法的方式……\n\n# 第 15 章\n# 错误处理\n\n\
    **目标：** 在部署应用程序之前，你需要修复任何 bug。本章侧重于调试以及你在部署给用户和生产环境之前如何测试你的应用程序。\n\n在将应用程序推广到生产服务器或部署给用户之前，测试应用程序始终是首要任务。在实际部署完整版本之前，你仍然可以使用\
    \ beta 测试应用程序，但即使如此，你也应该调试你的应用程序。调试的一个部分是通过错误处理。错误处理是一种捕获错误并为用户“处理”它们的方法。这些错误处理事件向用户显示友好的信息，这样你的代码就不会让用户感到沮丧。本章将讨论你如何在代码中管理这种类型的流程。\n\
    \n## 使用 Visual Studio 调试器\n\n如所述，你需要 Visual Studio 代码编辑器来创建和编译 C# 代码。Visual Studio\
    \ 包含一个调试器，你可以用它来逐行执行代码。与没有良好编程 IDE 的其他语言相比，使用 C# 的优势之一是 C# 允许你逐行执行每一行代码，然后你可以在执行这些行时观察变量的值。\n\
    \n你可以通过 F5 键或调试菜单启动调试器。你可以在代码中设置断点（breakpoints），这些断点可以让程序停下来以查看正在发生什么。例如，假设你的模块中存在错误，你不确定哪个变量导致了问题。\n\
    \n调试器中的变量监视窗口（Watch List）对于这一过程非常重要，因为它让你能够实时查看变量的值。如果没有这个工具，你在执行代码时只能猜测变量的值。监视窗口让你在执行代码时查看变量的值。它是识别变量是否被赋予错误值的绝佳方法由于逻辑错误发生在运行时，这对你的调试过程非常有用。\n\
    \n## C# 中的 Try Catch 语句\n\n对于错误处理，任何 .NET 语言（包括 C# 和 VB.NET）的主要组件都是 `try-catch`\
    \ 语句。该语句允许你捕获错误并执行一个处理用户错误的友好的函数。你不想为用户创建不友好、混乱的错误。在某些情况下，这些错误会给应用程序带来安全问题。处理不当的错误可能会显示信息，在某些情况下，它们可能会显示用于破解你服务器的密码和用户信息——这些是你不想向互联网公开的。解决此问题的方案是捕获错误并显示友好的信息，告诉用户如何处理错误而不会让他们感到沮丧。\n\
    \n让我们先看看创建 `try-catch` 语句的模板。我们为你创建了一个可以遵循的基础模板。\n\n```csharp\ntry\n{\n  // 导致异常的语句\n\
    }\ncatch(ExceptionName e1)\n{\n  // 错误处理代码\n}\ncatch(ExceptionName e2)\n{\n  //\
    \ 错误处理代码\n}\ncatch(ExceptionName eN)\n{\n  // 错误处理代码\n}\nfinally\n{\n  // 将执行的语句\n\
    }\n```\n\n在上面的代码中，我们首先声明 `try` 语句。这表示你正在开始 `try-catch` 语句。\n\n`try-catch` 语句中的每个\
    \ `catch` 语句捕获不同类型的错误。如果你不知道应该遇到什么类型的错误，语句的语句可能会很难，但你应该创建捕获任何类型错误的 `catch` 语句。当编译器捕获到这些类型的语句时，它们将进入\
    \ `catch` 语句块，这就是你创建处理你遇到的错误的自定义代码的地方。"
