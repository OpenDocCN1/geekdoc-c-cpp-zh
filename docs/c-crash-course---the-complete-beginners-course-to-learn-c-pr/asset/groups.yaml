    \ 语句与 `if` 语句类似，但它是对一个变量进行多个条件的评估。让我们先看看该语句的模板。\n\n```\nswitch(expression) {\n\
    \  case constant-expression :\n    // 要执行的语句\n    break;\n  case constant-expression\
    \ :\n    // 要执行的语句\n    break;\n  default :\n    // 要执行的语句\n}\n```\n\n通过该语句，变量被设置为\
    \ `switch` 表达式的值，然后每个 `case` 语句将确定变量是否等于该值。让我们来看 `switch` 语句的运行。\n\n```\nint myNumber\
    \ = 1;\nswitch (myNumber) {\n  case: 1\n    Console.WriteLine(\"Value is 1\");\n\
    \    break;\n  case: 2\n    Console.WriteLine(\"Value is 2\");\n    break;\n \
    \ default:\n    Console.WriteLine(\"Don’t know the value\");\n}\n```\n\n在上面的代码中，我们评估变量\
    \ `myNumber` 的值。我们将其初始化为 1，然后使用 `case` 语句遍历每个可能的值。因为我们知道值是 1，我们可以看到第一个 `case`\
    \ 语句评估为真，然后在控制台上显示“Value is 1”。\n\n`default` 语句类似于 `if` 块中的 `else` 语句。如果没有任何 `case`\
    \ 语句的结果为真，则执行 `default` 语句。\n\n`break` 语句用于退出 `case` 语句。如果你不添加 `break` 语句，下一个\
    \ `case` 将一直执行，直到代码到达 `default` 语句。只需记住，每个 `case` 语句都需要一个 `break` 来退出 `switch`\
