    \ C 语言的变量命名约定。你会发现 C# 遵循了许多标准的 C 风格。\n\n语句的最后一个要求是分号。分号告诉编译器语句已结束。\n\n变量的最后一个规则是，你可以在声明变量的同时为它赋值。让我们看看这种赋值语法。\n\
    \n```\ndatatype variable name = value;\n```\n\n再次，赋值是可选的，但上面的语法是你在声明的同时赋予值的方式。记住，值必须与数据类型匹配。例如，如果你尝试将字符串字符赋值给整数数据类型，编译器将给出错误。\n\
    \n### 字符串数据类型\n\n在任何程序中，你都会处理字符串。字符串是包含单词的变量。这些单词可以是任何字母数字字符，甚至是特殊字符。大多数用户输入都是字符串形式的，但然后你可以将其转换为其他数据类型。例如，你可能会要求用户输入数字，然后将其转换为整数以进行某种计算。\n\
    \n让我们看一个字符串变量的示例。\n\n```\nstring myName = \"John\";\n```\n\n注意，string 数据类型首先用于定义字符串变量。这是一个原始字符串数据类型。数据类型\
