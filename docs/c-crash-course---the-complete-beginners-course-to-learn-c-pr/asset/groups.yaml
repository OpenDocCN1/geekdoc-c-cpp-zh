    \ = 2;\nif ( myNumber1 > myNumber2)\n{\n//如果条件成立，则执行这些操作\n}\n```\n\n我们使用了相同的语法，只需将关系运算符切换为大于符号即可。在这个示例中，计算结果为\
    \ `false`，所以没有任何 `if` 语句被执行。\n\n与大于运算符类似，让我们来看小于语句。\n\n```\nint myNumber1 = 1;\n\
