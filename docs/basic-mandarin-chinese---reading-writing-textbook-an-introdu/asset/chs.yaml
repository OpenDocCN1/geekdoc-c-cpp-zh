  \ | 十路口 [**N**] |\n\n### BMC 中的新词及字\n\n![images](img/img_disc.jpg)\n\n### 阅读练习（简体字）\n\
  \n![images](img/img_disc.jpg)\n\n现在练习本单元在句子、对话和叙述中的汉字。请参考本单元末尾的注释，使用配套的光盘练习正确的读音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出下列句子，这些句子包含了本单元所有的生字。第一次读句子时，注意你所陌生的汉字和词，记住它们的读音和意义。第二次读，理解句子的整体意思。\n\
  \n一、您往前走，一直走到那个路口，就到和平饭了。\n二、从 1928 一直到 49 年，北京不叫“北京”，叫“北平”。\n三、小妹妹，你真有钱！你说，你那儿有分钱？\n\
  四、（电话里）平小姐，我十分到您那儿，您等我一下！\n五、本地的日本好吃，也不贵。\n六、明明，你听我说，这个路口车很多，我们得看一下。\n七、对不起，我写得不太清楚，这是一个“平”字，不是“半”。八、我问你，要是一个分钟能写三十字的话，那么十分能写多少？\n\
  九、日本的首都叫东京；听说东京人说的话真好听。\n十、王大海需要换钱，可是他不清楚什么地方去钱。\n\n##### B. 对话\n\n大声读下列对话，包括说话人的名字或角色。如果可能，找一个伙伴，每个人扮演一个角色。然后交换角色，以便练习所有的句子。\n\
  \n![images](img/img_p21-1.jpg)\n\n北京路牌\n\n一、\n钱：请问，和平饭店离这儿有多远？\n王金平：对不起，我不是本地人，我也不太清楚。\n\
  钱海文：请问，和平饭店离这儿有多远？\n安中天：要走差不多十分吧。\n钱海文：一直走就可以到吗？\n安中天：不是，你得在下一个路口往东走。\n钱海文：我知道了，谢谢！\n\
  二、\n高老师：请问，机场在哪里？\n林小明：对不起，我不是本地人，这个我不太清楚。您问那位先生吧。\n高老师：先生，请问机场在哪里？\n山口：我不是中国人，我是日本人。您说机场？对不起，我也不清楚。\n\
  高老师：先生，请问，你知道不知道机场在哪里？\n王京生：机场，是吗？机场在城外头，离这儿很远。不过，我也要去机场，我车上还有一个位子，你可以和我一起去。\n\n\
  #### C. 字辨练习\n\n仔细区分以下相似字，大声读出每一个并思考它的意义。\n\n![images](img/img_p321-2.jpg)\n\n台北路牌\n\
