  \n# 课练习（简体字） ![images](img/img_disc.jpg)\n\n现在在语境（句子、对话和叙述文中）练习本课的新字和新词。请务必参考课末尾的附记，并利用随附的光光盘来听并练习正确的读音、断句和语调。\n\
  \n\n\n\n\n##### A. 句子\n\n大声读出以下句子的每一个句子，这些句子包含了本课的所有生字。第一次读句子时，特别注意对你来说是新的汉字和单词，提醒自己它们的读音和含义。第二次读时，目标是理解句子的整体意思。\n\
