  \ |\n| 找到 | `zhăodào` | 寻找并找到，找到 [`RC`] |\n\n### 朗读（简体字）\n![images](img/img_disc.jpg)\n\
  \n现在练习阅读这些简体字。在句子、对话和短文中练习本课的新汉字和单词。请参考结尾的 `Notes`，并利用附带图片练习正确的发音和声调。\n\n##### A.\
  \ 句子\n大声读以下句子，它们包含了本课的所有新字。第一次读句子时，特别注意对你来说新的字和词，记住它们的发音和意义。第二次读时，努力理解整体意义。\n\n\
  1. 老毛，你现在就要走了？\n2. 请准备早饭，我们家里不吃饭。\n3. 从北方，“北京人”可以知道，以前，那个地方就住了。\n4. 这条路太多了，你要记得，走路要小心！\n\
  5. 你的名片记得我有张，可是不知道。\n6. 我们还吃早饭，请等一会儿。\n7. 我准备九月去香港，然后去台湾。\n8. 有中国人的地方就听到中国话。\n9.\
  \ 你是找不着字的话，可以写一个。\n10. 大海前给女朋友准备了，不太好吃。\n\n##### B. 对话\n大声读以下对话，包括说话者的名字或角色。如果可能，找一个或几个伙伴，每个人扮演一个角色。然后交换角色，练习所有台词。\n\
  \n1. 外国人：到了吧？\n   小姐：早着呢，还有五站，到时候我叫。（过了几分钟）这位先生，下一站就是动物儿了，您要准备下车。\n   外国人：好，谢谢您⋯对不起，我的票找不着！\n\
  \   小姐：我记得您买过，以后得小心。\n   外国人：好的，真对不起。\n\n2. 姐姐：弟弟，你怎么还没去学？\n   弟弟：听到了？听到了，我会记得。\n\
  \n#### C. 字形区分\n仔细区分以下相似的字，大声读每一个并思考其意义。\n\n1. 着着看 看\n2. 着着差差差\n3. 着看差差看\n4. 早早中中中\n\
  5. 早早千千\n6. 早中早早\n\n#### D. 短文\n读以下短文，特别注意标点和整体结构。第一次读短文时，大声读；第二次读时，尝试逐渐加快阅读速度。始终思考你所读内容的意义。\n\
  \n北京有一个地方叫“京广中心”，“京”是“北京”的，“广”是“广州”的，在北京市的东边。这个地方北京人都知道，从 1990 年到现在有 20 多年了。京广中心很高很大，里面有一家很好的饭店、几十家公司，还有卖东西的地方和人的地方，所以有的人京广中心是“城里面的城”。京广中心住很贵，一个月大概要一万五千块到两万五千块。不少外国人在广中心开了公司，也在那儿上班，也在那儿住。京广中心交通还行，外面有很多车站，离北京站也不远，早上五、六点钟去首都机场也只要半小时就到了。有一家美国大学开的中文中心离广比较近。要是你是外国人，住在广中心的话，你大概可以在那儿学中文。\n\
  \n#### E. 补充：手写告示\n（见上文）准备好回答老师或同学关于告示内容的问题。\n\n![images](img/img_p341.jpg)\n\n\
  ### 朗读（繁体字）\n![images](img/img_disc.jpg)\n\n##### A. 句子\n大声读以下句子，包含了本课的所有新字。第一次读句子时，特别注意对你来说新的字和词，记住它们的发音和意义。第二次读时，努力理解句子的整体意义。\n\
  \n![images](img/img_p342-1.jpg)\n\n##### B. 对话\n大声读以下对话，包括说话者的名字或角色。如果可能，找一个或几个伙伴，每个人扮演一个角色。然后交换角色，练习所有台词。\n\
  \n![images](img/img_p342-2.jpg)\n\n#### C. 字形区分\n仔细区分以下相似的字，大声读每一个并思考其意义。\n\n![images](img/img_p343-1.jpg)\n\
  ![images](img/img_p343-2.jpg)\n\n#### 台北巴士广告\n\n#### D. 短文\n读以下短文，特别注意标点和整体结构。第一次读短文时，大声读；第二次读时，尝试逐渐加快阅读速度。始终思考你所读内容的意义。\n\
  \n#### E. 补充：手写告示\n（见上文）\n\n等等，我漏掉了 `images` 下方的文本：\n外国人：到了吧？\n小姐：早着呢，还有五站，到时候我叫。（过了几分钟）这位先生，下一站就是动物儿了，您要准备下车。\n\
  外国人：好，谢谢您⋯对不起，我的票找不着！\n小姐：我记得您买过，以后得小心。\n外国人：好的，真对不起。\n\n二、\n姐姐：弟弟，你怎么还没去学？\n弟弟：听到了？听到了，我会记得。\n\
  姐姐：东西准备好了？\n弟弟：都准备好了。\n\n\n\n\n### A1B. 还早着呢，多坐一会儿吧 (還早着呢，多坐一會兒吧) “It’s still early,\
  \ why don’t you sit a while longer?” 短语 `多坐一会儿`(多坐一會兒) 字面意思是“more sit a while”。这将在课程后面进行更详细的解释和练习。\n\
  \n### A3A. 确保你理解，介词 从 (從) “from” 并不是跟它后面的年份“1929”连用（这在其他句子中经常如此），而是与句子后面的名词 `北京人`\
  \ 相连。所以第一个短语的“骨架”是：`从“北京人” 可以知道`(從 北京人 可以知道) “from ‘Peking Man’ we can know that….”\n\
  \n### A3B. 很早以前，那个地方就有人住了 (很早以前，那個地方就有人住了) “Long ago, there were already people\
  \ living in that place.” 很早以前 “long ago, a long time ago”是一个常用且实用的短语，你应该作为一个“语块”（chunk）来记忆。句子中后面的\
  \ `就` 意思是“as early as then”或“already”。\n\n### A3C. 这里，`北京人` 指的是“Peking Man”，即 1923\
  \ 年在北京附近发现的早期人类——`Homo erectus pekinensis` 的化石。\n\n### A4. `要` 是有多种含义的动词。在 `你要记得`(你要記得)中，`要`\
  \ 表示必要，所以我们可以将这个短语翻译为“you need to remember”、“you should remember”或“you must remember”。\n\
  \n### A6. 我们还吃着早饭呢，请她等一会儿，还早着呢 (我們還吃着早飯呢，請她等一會兒，還早着呢) “We’re still eating breakfast;\
  \ ask her to wait a while, it’s still early.” 在句子的第一个和最后一个分句，着 (着) 加上 呢 表示持续体，换句话说，吃饭的动作和早早的状态仍在持续，尚未完成。\n\
  \n### A7. 虽然 `准备`(準備)的意思通常是“prepare”或“get ready”，但在句中它的意思是“plan”或“intend”。\n\n###\
  \ A8. 有中国人的地方就听得到中国话，吃得到中国饭 (有中國人的地方就聽得到中國話，吃得到中國飯) “Wherever there are Chinese\
  \ people, you can hear the Chinese language and you can eat Chinese food” (lit.\
  \ “Places where there are Chinese people, can hear Chinese speech, can eat Chinese\
  \ food”).\n\n### B1. 过了几分钟以后 (過了幾分鐘以後) “after a few minutes had passed.”\n\n###\
  \ B2. 我会记得的 (我會記得的) “I’ll remember.” 这 `会`(會) 意思是“will”。在很多中国人的口语和书书中，尤其是中国南方和台湾的人，句末经常跟着一个可选的\
  \ `的`。\n\n### D1. 京广中心交通还行，外头就有很多车站 (京廣中心交通還行，外頭就有很多車站) “Transportation at the Jingguang\
  \ Centre is fairly convenient, there being many bus stops right outside.” 这里的 `外头就有`(外頭就有)\
  \ 意思是“as close as that”或“that close”。\n\n### E1. 美国话 (美國話) 不是一个特别常用的术语，但可以表示“American\
  \ English”，相对于例如英国英语。\n\n### E2. 一小时 100 元 (一小時 100 元) “one hundred dollars per\
  \ hour.” 你还记得 BMC–RW 9-3 Notes 中提到的字符 `元` `yuán` 吗？虽然这一卷没有正式介绍 `元`，但你应该现在尝试学习它。正如我们在上一节课中提到的，`元`\
  \ 在书面汉语中相当于口语中的 `块`(塊) `kuài`，表示“dollar”。\n\n# 第 10 单元\n## 天气\n\n![images](img/img_p345.jpg)\n\
  \n### 教学目标\n\n一旦你掌握了本单元，你将能够用中文读写：\n\n1. 关于天气和天气预报：“热”、“冷”、“干燥”、“雨”、“某某几度”、“高温”、“低温”等。\n\
  2. 表达比较和对比的句子：“The U.S. east coast is colder than the west coast, but the east coast\
  \ is not so dry as the west coast,” 等等。\n3. 一篇关于北京气候的文章。\n4. 一篇关于中国姓氏历史和背景的文章。\n\
  5. 一个笑话和几个有趣的故事。\n6. 几张手写笔记。\n7. 列出几个中国主要城市每月最高最低温度的表格。\n8. 若干常见的 成语(成語) `chéngyŭ`\
  \ 或四字词。\n\n# 第一部分\n## 天气预报\n\n![images](img/img_p346.jpg)\n\n### 生字和生词 ![images](img/img_disc.jpg)\n\
