  \ Jenny F. So 及其工作人员。\n\n最后，我要感谢 1993 年至 2010 年在威廉姆斯学院学习基础汉语课程的学生们，感谢他们的指正和建议，以及给我的鼓励和启发。\n\
  \nCornelius C. Kubler\n\n亚洲研究系\n\n威廉姆斯学院\n\n威廉姆斯斯顿，马萨诸塞州，美国\n\n\n\n\n\n`Basic Mandarin\
  \ Chinese Speaking & Listening` 和 `Basic Mandarin Chinese Reading & Writing` 成了现代汉语（普通话）的入门课程。普通话是世界上母语者人数最多的语言，也是中国大陆和台湾的官方语言，以及新加坡的官方语言之一。本课程专为英语母语学习者设计，重点在于在实际日常场合中使用中文进行交流。我们努力兼顾了从高校学生到商务人士及政府人员等广大用户的需求。通过对进度进行适当调整，高中生也能够从中利用这些材料。通过参考详细的用法说明并充分利用\
  \ `Practice Books`、视频和音频，有积极性的自学学者甚至可以独立完成这些材料的学习，尽管如果可能的话，他们每周与老师或母语者见面一到两小时会更有助益。尽管有特殊需求的用户在学习的后期可能需要补充材料，但我们认为本课程为所有中文学习者提供了所需的坚实通用基础或“基础”（这也是课程命名的由来），他们可以在此基础上通向未来的的精通。\n\
  \n## 课程结构\n\n课程分为口语和书面两个轨道，每个轨道配有各种类型的辅助材料。底图将阐明整个课程的结构：\n\n![images](img/img_p7-1.jpg)\n\
  \n![images](img/img_p7-2.jpg)\n\n这些材料有几种学习模式：\n1. 仅学习口语系列；\n2. 学习口语系列课程后，在几天、几周或几个月后学习相应的书面系列课程；以及\n\
  3. 同时学习口语和书面系列的课程。\n\n不可能的情况是先学习或仅学习书面系列，因为书面系列要求学习掌握发音系统以及相关的语法和文化信息，而这些内容是在口语系列中介绍的。\n\
  \n## 学习预期\n\n开始学习中文的学生应当意识到，中文和日语、韩语以及阿拉伯语一样，是英语母语者最困难的语言之一。本课程并不自称是这门“简单”的入门课程。然而，学生可以放心，只要他们努力彻底掌握这里介绍的材料，他们将获得坚实的中文基础。\n\
  \n在完成课程的 `Intermediate Mandarin Chinese Speaking & Listening` 和 `Intermediate Mandarin\
  \ Chinese Reading & Writing` 部分后，口语和阅读的目标将达到美国外教协会（ACTFL）中文能力指南中的“中级高级”（Intermediate-High）水平，这对应于美国政府机构语言小组（ILR）语言技能水平描述中的\
  \ S-1+/R-1+。在达到这一水平时，学习者能够就各种日常话题与中文使用者进行简单、实用的对话（参见目录）。他们能够阅读用简体或繁体中字打印的简单连贯文本，并识别约\
  \ 600 个高频字和用这些字书写的常用词汇。当然，他们还无法进行专业话题的对话，或阅读报纸或小说，这些技能在中文学习中需要相当长的时间才能培养出来。\n\n\
  ## 特色\n\n`Basic Mandarin Chinese Speaking & Listening` 和 `Basic Mandarin Chinese\
  \ Reading & Writing` 的一些特色包括：\n\n### 口语和书面中文分离但集成的轨道\n大多数基础汉语教学教材都是从相同的材料中教授口语和书面技能，并以相同的进度进行。学生通常学习一段对话，学习如何在口语中使用对话包含的词汇和语法，并学习如何读写写该对话中使用的每一个汉字。但事实是，由于汉字的固有难度，英语母语者学习口语词汇的速度远快于他们学习书写这些词汇的汉字。正如东亚语言教育学家\
  \ Eleanor H. Jorden 和 A. Ronald Walton 所指出的^(1)，为什么口语中文的进度必须放慢到书面中文最高可能的进度？此外，中文比大多数语言\
  \ hơn 在标准口语风格和标准书面风格之间存在巨大差异，许多在口语中常见的词汇和语法模式在写作中很少见，反之亦然。由于这些原因，本课程对口语和书面中文训练使用了分离但相关的材料。然而，考虑到书面中文基于口语中文的事实，为了相互强化四项（听、说、读、写），书面轨道与口语轨道紧密结合。一天的口语课基于一段对话，通常介绍一到三个新语法模式和\
  \ 15 到 20 个新口语词汇；而相应的书面课则引入六个新高频字和若干用这些字书写的词，这些词是从对应课程基础对话所使用的字（但不包括全部）中挑选的。经验表明，如果学习者针对他们已经学过的口语和理解的词汇进行读写学习，中文书面技能的学习进展会更高效。在这种方法下，当学生开始新的书面中文课时，他们已经认识了新词的发音、含义和用法，只需要学习它们的书写形式——这大大减轻了学习负担。这种方法还允许学生和教师在何时、如何、甚至是否引入阅读和书写方面具有最大的灵活性。\n\
  \n### 渐进式方法\n要精通中文需要学习的内容非常多，中文学习很容易让人无所从心。通过将大任务分解为一系列许多小任务，中文学习变得更易掌握。因此，每节口语课只包含一段较短（五到十二行）的对话，而每节书面课只引入六个新字。这种方法的额外好处是，学习者通过频繁完成小任务能获得成就感，而不是陷入似乎永无止境的长课程中。\n\
  \n### 语言的自然性\n我们特别努力呈现自然、地道、现代的中文，而不是死板的“教科书式”。例如，这体现在语气词、填充词和语气助词的使用上，这些词在本文出现的频率比大多数汉语教材都要高。为了理解练习，我们有时会录制略带口音的普通话录音，以便学习者熟悉他们可能会遇到的常见发音变化。\n\
  \n\n\n\n\n# 语言的真实性\n\n中文和英语一样，都是在多个社会中使用的语言，具有多种标准和多变的用法。虽然本课程的重点是汉语在任何地方通用的核心内容，但在适当的情况下，我们也涵盖了主要汉语语社区之间的语言差异以及近期的创新。在《基础汉语口听力]（Basic\
  \ Mandarin Chinese Speaking & Listening）和《中级汉语口听力]（Intermediate Mandarin Chinese\
  \ Speaking & Listening）的 96 个基础对话中，有 56 个的音视频是在北京录制的，另 31 个在台北，3 个在香港，1 个在澳门，2 个在新加坡，2\
  \ 个在马来西亚，1 个在美国。对于在特定地区使用的较少术语已进行了标注。\n\n# 强调实用性与即时用处\n\n我们尝试提供高频且具有最大即时“回报价值”的。根据多项已发表频率研究以及作者的研究，我们尽可能包含了最实用的词汇、语法模式、情景和功能。本课程的单元根据通用性和实际重要性进行安排。虽然课程被设计为从头到尾学习，但如果只有时间学习前五个或十个单元，学习者至少可以接触到许多实用的词汇项和结构模式。\n\
  \n# 方法的兼顾\n\n我们相信语言是如此复杂，学习者的性格也如此不同，因此没有单一的方法能够始终满足所有学习者的需求。出于如此，我们选择的教学方法是有意采取兼顾的。本课程采用以能力为导向、情境化的方法，并配有严谨的语法基础。我们广泛借鉴了听语法、交际法、功能概念法以及语法翻译法。\n\
  \n# 使用的高度灵活性\n\n学生和教师的需求及性格迥异，教授汉语的课程类型也是如此。我们尽可能留下了选择空间。例如，在如何教发音上；是只教口语还是也教书面技能；何时引入读写；教简体字还是繁体字或两者兼顾；做哪些练习以及按什么顺序做练习。《基础汉语口听力]和《基础汉语读写]（Basic\
  \ Mandarin Chinese Reading & Writing）的教师指南对所有这些及其他问题进行了详细讨论。\n\n# 关注社会语言和文化特征\n\n\
  知道用正确的语法和发音表达某些内容对于有效沟通是不够的。学习者必须知道在该情况下该说什么、不该说什么、何时说，以及根据场合调整自己的话。说话者和听者的性别、年龄和社交地位如何影响语言？最后，语言脱离其使用者的文化而存在。汉语使用者的文化假设是什么？这些是我们努力关注的等方面。\n\
  \n# 广泛的内置复习\n\n为了促进所学内容的长期记忆，我们在教材后期单元和《练习册]（Practice Book）中定期对介绍过的词汇和语法进行循环复习。此外，每个单元末尾都有复习和学习指南。\n\
  \n# 关注具有汉语基础的学习者需求\n\n虽然课程是为初学者设计的，且假设他们没有汉语基础，但它尝试考虑到那些从家庭或海外居住获得某些语言知识的学习者的特殊情况和需求。因此，对于标准普通话读音和用法，特别说明了它们与学习者可能接触过的粤语或受台湾影响的汉语的区别。\n\
  \n# 组织与使用\n\n《基础汉语口听力]包含十二单元。前两个是介绍性单元，与《基础汉语口听力]中的内容无直接关系。后面是十个单元，编号为 1 到 10，与《基础汉语口听力]中的十个单元对应。这些单元每个由四个部分组成，每个部分介绍六个字、用这些字编写的常用词以及帮助你掌握新内容的阅读练习。\n\
  \n《基础汉语读写]的十二个单元共介绍了 288 个字和大约 700 个常用词汇和表达。除了两个介绍单元外，每课的六个字是根据出现频率，从《基础汉语口听力]对应课程的基础对话所使用的字中选出的。由于《基础汉语读写]的每课都设计为在《基础汉语口听力]和《基础汉语口听力练习册]的对应课程之后学习，当你开始《基础汉语读写]的新课时，你已经知道了新词的发音、含义和用法，因此你只需要学习它们的书面表达。这大大减轻了你的学习负担！\n\
  \n我们在频率方面的参考是北京语言学院于 1985 年出版的《现代汉语频率词典（Xiàndài Hànyŭ Pínlǜ Cídiǎn）》中的通用字表。《基础汉语读写]中的所有字都选自该字典的前\
  \ 1000 个（大部分是前 300 个）字，有三个例外：姓氏 `李 Lĭ`、`台湾 (台灣) Táiwān` 中的 `湾 (灣)` 以及 `天津 Tiānjīn`\
  \ 中的 `津`。\n\n# 新字和新词\n\n《基础汉语读写]每个部分或每课的第一部分被称为“新字和新词”。它介绍了本课的六个新字以及用这些字编写的常用词。对于每个新字，提供了以下信息：\n\
  \n1. **编号**。每个新字部分开头的数字是该字在本中的编号。在课程后期，有时会通过编号指代字。\n2. **简体形式**。如果只给出一个，则简体形式与繁体形式相同。\n\
  3. **繁体形式**。如果字的繁体形式与简体形式不同，则紧随其后放在括号内。为了让学习者始终清楚哪些是简体字哪些是繁体字，每当简繁字同时出现时，简体字在前，繁体字在后并括起来。\n\
  4. **拼音**。拼音标注在同一行的字后面。\n5. **英语**。每个新字部分第一行的最后一项是该字基本含义的英语翻译。这里的翻译仅供参考，不需要记忆。单字的含义可能与包含该字的词汇的含义不同。此外，英语翻译并非完整的，仅包含了认为在汉语学习这一阶段对学习者具有教学意义的含义。\n\
  \n\n\n\n\n### 6. 部首。在每个新字部分的第二行开始，会给出新字的部首。如果汉字的简体和繁体形式不同，且这两种形式的部首不同，则会标出两个部首。如果部首有通用的口语名称，也会给出。\n\
  \n### 7. 声旁。如果有具有教学意义的声旁，会予以标注。如果汉字本身是一个常见的声旁，则会给出该声旁出现在其他字中的示例。\n\n### 8. 其他成分。将提到并讨论汉字的任何其他成分。\n\
  \n### 9. 结构解释。当关于汉字的历史和发展有任何教学意义的内容时，会将其包含在内。我们的首要考虑是帮助学生记住汉字，因此会提到一些具有记忆价值的解释，即使这些解释在历史上可能并不准确。另一方面，过于复杂且对普通学习者没有帮助的解释则会被省略。\n\
  \n### 10. 相似字。在新字部分的末尾，将列出任何与新字需要对比的“形似”字。\n\n### 11. 使用该字的新词。在每个新字部分的下方，列出了使用该字的新词列表。这些词以简体字、繁体字（如果与简体不同）、拼音标注和英语翻译给出。它们也会记录在随附的光谱盘中。\n\
  \n### 12. 使用已知汉字的新词。这一部分也记录在随附的光谱盘中，介绍了《基础汉语听说口语》（*Basic Mandarin Chinese Speaking\
  \ & Listening*）相应课程中的新词，这些字在之前的《基础汉语读写》（*Basic Mandarin Chinese Reading & Writing*）中已与其他词介绍过。\n\
  \n**给学习者的重要提示：** 在开始阅读练习并进入下一课之前，你必须学习的是**第((1)和(12)部分中后面带有粗体括号词类缩写的新词**。其他所有内容仅供参考。\n\
  \n# 阅读练习\n\n每课的下一部分是阅读练习。这些练习应该是学习和练习的重点，因为它们在语境中介绍了新的汉字、词汇以及书汉语的其他特征。在进行阅读练习时，你应该同时练习朗读和默读。请务必经常使用随附的光谱盘，以听并练习正确的发音、断句和语调。\n\
  \n阅读练习以两次呈现：首先是简体字的横排格式，然后是繁体字的竖排格式。这样做是为了让学习者练习阅读这两种类型的汉字和两种格式。当然，学习者可以选择只读一个版本的阅读练习，或者先读一个版本，几个月后再读另一个版本。\n\
  \n第 1 到第 10 单元的阅读练习包含以下组成部分：\n\n### 1. 句子。这些句子说明了新字和新词在语境中的用法。部分始终有十个句子，它们例举了本课中所有的新字和大部分新词。\n\
  \n### 2. 对话。对话采用口语化风格。包含了每个说话人的名字或角色，并应与对话本身一起学习。在课堂或练习期间，你应该找一个一个或多个伙伴，你们每人都扮演一个角色。然后交换角色，这样你就能练习阅读所有的台词。\n\
  \n### 3. 字形辨析练习。正如练习对于教学口语有用一样，它们也可以帮助教学书面语。字形辨析练习的目的是让你练习区分汉语初学者可能会混淆的“形似”字。大声读出每个练习，并思考你所读出的字的含义。\n\
  \n### 4. 叙述。叙述的目的是让你练习阅读连贯的散文，这与一系列独立的句子在许多方面都不同。几篇叙述包含了一些书面语汉语的元素。第一次阅读叙述时，你应该朗读；第二次时，默读并尝试逐渐加快阅读速度。始终要思考你所读内容的含义。\n\
  \n### 5. 注释。这些是帮助你理解阅读练习中材料的含义、结构和文化背景的各种杂注释。我们没有尝试对语法进行系统性的处理，因为那已经在《基础汉语听说口语》（*Basic\
  \ Mandarin Chinese Speaking & Listening*）中提供了。\n\n某些课程包含关于特殊主题的额外部分，如数字、人名地名、金钱、时间和日期。此外总共有\
  \ 18 个补充部分，介绍了流行文化和现实生活的示例，范围从绕口令、谜语到表格和手写笔记。\n\n# 汉语写作系统概览\n\n大多数人将汉语写作系统等同于汉字。汉字无疑是书汉语最显著的特征，但汉语写作系统实际上包含多得多。除了简体字、繁体字以及非正式但经常遇到的异体字外，汉语写作系统还包括罗马字母的大写和小写字母（如\
  \ X 光“X-ray”、B 型肝炎“Hepatitis B”、卡拉 OK“Karaoke”、和 e 世代“digital generation”）；拼音罗马化系统（用于电脑输入或指示生字的读音）；阿拉伯数字加中文符号`〇`；数学符号如`+`–`×`\
  \ `÷` `=` 和 `%`；汉语货币符号`¥`；重复符号`々`；标点符号；谦字的使用以及空格规范。当然，作为一名受过教育的英语读写，你已经熟悉上述内容，所以并不是所有内容对你来说全新的。\n\
  \n汉字被称为“意形文字”（ideograms）、“表意文字”（ideographs）、“日志文字”（logographs）或“图形”（graphs）。在书中，我们将简单地称它们为“汉字”（字。要记住，正如所有语言一样，汉语口语是主要的，现今标准的汉语写作系统本质上是一套记录汉语口语的书写符号；汉字并不像某些人声称的那样构成一个“独立于语言的逻辑符号系统”。\n\
  \n\n\n\n\n直到最近，中国孩子在学校里学到的都是汉字是由一个人发明的，他是大约公元前 2600 年黄帝时期的一位官员仓颉。根据这个传说的一个版本，仓颉从鸟类和其他动物在地上留下的足迹中获得了创造文字的灵感。然而，今天的学者们一致认为，汉字并非由某个人发明的，而是许多人在很长时间里积累的产物。汉字在起源上具有明显的象形特征。汉字的原型是动物和其他自然物的简单画，这些线条刻在追溯到公元前\
  \ 2000 年的古代陶器碎片上。最近，有报道称在中国西北部的悬崖上发现了数千个象形符号，其年代甚至比上述时期还要更早。\n\n## 甲骨文\n\n我们今天拥有的最早的、成熟的汉字例子是所谓的甲骨文\
  \ `Jiăgŭwén`（oracle bone inscriptions），可以追溯到商代晚期（约公元前 1300 年）。为了给商代的统治者占卜未来，祭司会将牛肩骨和龟壳放在火上烤，直到它们产生裂纹，然后解释裂纹的含义，对天气、宗教、政治和战争做出预测。这些解释和预测随后记录在骨头和壳上，用当时的文字写成几行字（参见本页的图片和第\
  \ 15 页）。目前现存超过 10 万片 `Jiăgŭwén`，包含 3000 多个不同的字，其中大约一半在今天是可以辨读的。\n\n![images](img/img_p13.jpg)\n\
  \n甲骨文\n\n`Jiăgŭwén` 的发现是中国古文字学史上一个色彩斑斓的章节。这些在河南安阳附近发现的甲骨一段时间以来被视为“龙骨”，并在北京地区的药店里售卖和磨成中药。1899\
  \ 年，一位名叫王铁荣的学者在用龙骨治疗疟疾时检查了骨上的文字，并与他的朋友刘硕开始进行研究。他们得出结论，骨上的刻文比当时已知的任何文字都要古。王铁荣次年去世，但刘硕在\
  \ 1903 年出版了一本关于他与王铁荣收藏的骨头的书，使他们的发现闻名于世。\n\n## 汉字的演变\n\n汉字的形式和总数在随后的周朝时期（公元前 11 世纪到公元前\
  \ 221 年）都大幅增加，且不同地点的字体差异很大。这一时期的文字（现存的样本大多刻在各种铜器上）统称为大篆 `Dàzhuàn`（Great Seal Script）。\n\
  \n公元前 221 年，首位皇帝秦始皇统一了中国，并在全中国范围内强制使用秦文字。这种字体被称为小篆 `Xiăozhuàn`（Small Seal Script），是所有后期汉字形式的祖先，直到今天有时仍用于装饰目的和刻章。在官方的\
  \ `Xiăozhuàn` 字出现的大约同时，民间还发展出了一种简单得多的小篆形式，称为隶书（ 隸書 ） `Lìshū`（Clerical Script），其特点是将圆笔画变为平画，且整体的象形特征大大减弱。到汉代晚期（约公元\
  \ 200 年），`Lìshū` 被进一步简化为楷书（ 楷書 ） `Kăishū`（Standard Script），从那以后它一直是印刷字和精工手写字的标准。\n\
  \n下表总结了两个字从其 `Jiăgŭwén` 形式到 `Kăishū` 形式的演变（但请记住，这在某种程度上是简化的，在实际操作中并没有一种整齐且易于划分的线性过程——两种或两种类型的文字通常在不同地区共存了几十年甚至几个世纪）：\n\
  \n![images](img/img_p14.jpg)\n\n## 汉字的结构\n\n每个汉字由一到二十个或更多的独立笔画组成。基本笔画共有八个：`diăn`（丶）、`héng`（一）、`shù`（丨）、`piĕ`（丿）、`nà`（![images](img/img_p14-1.jpg)）、`tí`（![images](img/img_p14-2.jpg)）、`gōu`（亅）和\
  \ `zhé`（![images](img/img_p15-1.jpg)\n\n![images](img/img_p15-2.jpg)\n\n### 2. 指事字\
  \ `Zhĭshìzì`（Simple Ideographs）\n\n不像象形字是物体的形象，而是抽象概念的符号表示，如数字和位置。指事字在书汉语中的比例比象形字更小。示例：\n\
  \n![images](img/img_p15-3.jpg)\n\n### 3. 会意字（會意字）`Huìyìzì`（虽然简单的指事字是由统一整体组成的且是完整的，而会意字的含义依赖于两个或多个独立部分含义的结合或相互作用，每个部分都可以作为独立的汉字出现。这一类别的字虽然指事字更重要，但也只占字的一小部分。示例：\n\
  \n![images](img/img_p16.jpg)\n\n\n\n\n\n## 4. 假借字 `Jiăjièzì` “Borrowed Characters.”\n\
  \n尽管语言中的某些词可以设计成象形或会意字，但许多其他词并不容易通过这两种书写方式来表达。通常，当中国古代人想写一个没有对应字的词时，他们会借用另一个读音相同或相似的字。例如，在中国古代，有两个不同的词发音都类似于英语的“lug”：一个是指生长谷物的词，用象形字\
  \ `來` 写作；另一个是动词“来”（to come），当时还没有对应的字。有人想出了一个当时的新颖想法，用表示“谷物”的字 `來` 来表示“来”。虽然原意“谷物”和借用义“来”曾共存了一段时间，但最终在这个特定案例中，“来”胜出了，结果是在现代汉语中，这是该字唯一可能的含义。\n\
  \n在形声字（见下文）之后，假借字构成了汉字的第二大类。它们在 20 世纪 50 年代和 60 年代的汉字简化过程中也发挥了重要作用。事实上，与形声字一起，它们证明了即使在古代，汉字在很大程度上也是表音的。但尽管上下文通常能明确假借字的含义，但有时也会产生歧义。在为读音借用字时避免歧义的问题，产生了下一类汉字，这组字如今占了该语言中绝大多数字。\n\
  \n## 5. 形声字 ( 形聲字 ) `Xíngshēngzì` “Phonetic-Semantic Compounds.”\n\n为了解决避免歧义的问题，中国古代人想出了将`假借字`的借音原则与前三类汉字的意意原则相结合，创造出复合字。其中一部分被称为“声旁”（`phonetic`），通常位于字的右侧，表示读音；另一部分被称为“形旁”（`semantic`），通常位于字的左侧，表示含义。\n\
  \n以一个常见的汉语名词为例，读音 `mā`，意为“妈”或“母亲”。在过去的某个时期，这个词还没有对应的字时，一位想写这个词的中国写作者借用了字 `馬 mmă`（马）来表示\
  \ `mā` 的读音（这两个词除了声调外读音完全相同），但他做了一个至关重要的补充：他在 `馬` 的左侧加上了字 `女 nǚ`（女性），以此告诉读者：第一，这是一个不同于\
  \ `馬` 的词；第二，这个词与“女性”有关。就这样创造了字 `媽` `mā`（母亲）。同样地，考虑 `螞 măă`（蚂蚁），它由相同的声旁和形旁 `虫 ch`（昆虫）或疑问助词\
  \ `ma` 的声旁 `口 kŏu`（口）组成，这表示这是一个经常用于口语的词。\n\n以下是几组形声字的示例：\n\n![images](img/img_p17.jpg)\n\
  \n在上面的例子中，这些例子是为了阐明`形声字`原则而经过精心挑选的，声旁的读音与复合字的读音之间存在相当密切的关联。遗憾的是，由于几个世纪以来的语音变化和方言间的借用，加上某些读音的“匹配度”从一开始就并不精确而只是近似的，许多关联关系已变得模糊，以至于现今形声字中所包含的声韵信息往往是不准确的。\n\
  \n汉字的语音有点像英语中不同的元音和辅音组合。在英语中，我们有很多规律的音形对应关系，例如组合“-ill”，它在所有以“-ill”结尾的单词中读音都相同，例如“pill”、“kill”和“hill”。但我们也有一些不规则的对应关系，例如“-ove”，它可以有几种不同的读法，例如“shove”、“cove”和“prove”。汉语的语音通常像英语中那些不规则的对应，一个声旁往往代表两个或三个常见的读音。\n\
  \n汉字的语音通常像英语中不规则的对应，一个声旁往往代表两个或三个常见的读音。\n\n在具有相同声旁的不同字，韵尾最可能相似，声母次之可能相似，而声调最可能不同。即使一个声旁系列中不同字的声母或韵尾不同，它们在语音上通常也是相关的，也就是说，它们可能都是用嘴唇发出的唇音，如\
  \ `[b p f]`；或者它们都是用口部软腭发出的音，如 `[g k h]`；或者它们都以相同的辅音结尾，如 `[-eng -ing]`。\n\n至于形声字中的语义，它们只能提供字义的提示，例如“与水有关”或“金属制成”或“某种鱼”。有时语义看起来不符合逻辑，但这可能是由于自语义系统首次发明以来文化和社会的变化而导致的；例如，`枕\
  \ zhĕn`（枕头）用形旁 `木 mù` 写作，那是因为以前的枕头确实是木头制成的。汉字的语义元素在英语中通常被称为字的“部首”（`radical`），因为汉语字典传统上是根据\
  \ 214 个部部的顺序排列的，从笔画最少到最多。\n\n## 6. 转注 ( 轉注 ) `Zhuănzhù` “Mutually Explatory Characters.”\n\
  \n《说文解字》中提到的第六类汉字是转注 ( 轉注 ) `Zhuănzhù`。这些涉及一组语音和意义都相似的词，每对词中的一个词已经有了字，而另一个还没有。随后，通过修改配对中已有的字，为没有字的词创造了一个字。大多数转注字已不再使用，但一个经常被引用的例子是`老\
  \ lăo`（老）和 `考 kăo`（先父）这对。由于转注在《六书》中占比最小，而且即使是专家对其精确性质也没有统一意见，我们在此将不再详细讨论这一类字。\n\n\
  ### 草书\n\n除了上面讨论的汉字类型（即楷书 `Kăishū`，标准的印刷或工整的手写字体），还存在汉字的草书形式。就像我们在手写英语时通常会连接字母一样（即我们通常不分开写字母，而是用连续的笔画写整个单词），中国写作者在手写汉字时通常也会连接字中的许多笔画。\n\
  \n\n\n\n\n取决于多种因素，例如场合的正式程度、作者与收读者的教育水平、作者的个人偏好，以及作者当时有多匆忙，任何特定手写体的草化程度都会有很大差异。含有中等程度草化的手写中文非常常见，被称为`连笔字\
  \ ( 連筆字 )` `Liánbĭzì` “Connected Characters”或`行书 ( 行書 )` `Xíngshū` “Running Script”。我们将在课程的后续内容中介绍少量的略微草化书写。更极端的草化程度被称为`草书\
  \ ( 草書 )` `Căoshū` “Grass Script”，对于学习这种语言的外国学习者来说，幸运的是，它比以前少得多。实际上，往往很难准确判断 `Xíngshū`\
  \ 何时结束、`Căoshū` 何时开始。有一句著名的中国谚语说：“`草书三天不認主 ( 草書三天不認主 )` `Căoshū sāntiān bú rèn zhŭ`”（意为：草书三个三天不写，连作者自己都认不出来）。还有一种更激进的草书被称为`狂草`\
  \ `Kuángcăo` 或“Crazy Grass”，但不用担心，我们在本课程中不会涉及这类内容！\n\n以下是用`Xíngshū`和`Căoshū`书写的汉字示例：\n\
  \n![images](img/img_p19.jpg)\n\n## 简体字\n\n为了提高识字率，中华人民共和国政府通过其在 1955 年和 1964 年颁布的两份官方名单，开始推广所谓的`简体字\
  \ ( 簡體字 )` `jiăntĭzì` 或“simplified characters”的使用。这里的“简化”一词主要指的是减少汉字的笔画，特别是对于那些笔画高于平均水平的高频字。实际上，中国汉字简化的历史非常悠久，这两个列表中的大多数字在几个世纪以前就已经被非正式地使用了，就像我们在英语中在非正式写作中长期以来使用“nite”\
  \ 代替“night”或用“thru” 代替“through”等缩写一样。在中文里，与以前的主要区别在于，在中国大陆和新加坡，简体字现在已经标准化并赋予了官方地位。\n\
  \n毫无疑问，简体字由于笔画减少，书写速度比繁体字快（尽管过去大多数成年书写者都是用 `Xíngshū` 进行快速书，那甚至更快）。然而，恰恰是因为笔画的减少，字之间的对比点也减少了，导致相似字的数量增加。以两个表达\
  \ `shèyŏu`“已有”和 `méiyou`“没有”为例。用繁体字写（設有, 沒有），区别很明显；但用简体写（设有, 没有），它们很容易被混淆，尤其是在快速手写时。其他此类简体形似字的例子包括`活话`（对应繁体\
  \ 活話）、`向问`（对应繁体 向問）和`刷剧`（对应繁体 刷劇）。有人可能会认为汉字简化让写作变得更容易，但在某些情况下实际上让阅读变得更困难（更不用说大多数读者现在必须熟悉*两*套字了）。\n\
  \n中文识字所需的约三千个字中，大约有一半受到了简化过程的影响。在《基础汉语读写》中介绍的 288 个字中，总共有 197 个字的简体和繁体形式相同，只有 91\
  \ 个不同——而且其中许多差异非常细微，几乎难以察觉。学习简体字和繁体字之间的区别并不像初看起来看起来那样有负担，因为在很多情况下，一个汉字部首的简化——例如所谓的“言字旁”从\
  \ `言` 变为 `讠`——影响了包含它的几十个字。\n\n汉字简化的主要方法包括：\n\n1. 已经在流行使用的简体字被赋予官方地位。示例：\n過 → 过 `guò`“通过”\n\
  當 → 当 `dāng`“担任”\n\n2. 恢复使用原本是汉字标准形式但后来被更复杂的形式取代的更简单形式。示例：\n從 → 从 `cóng`“从”\n眾 →\
  \ 众 `zhòng`“众”\n雲 → 云 `yún`“云”\n\n3. 根据假借原则（`Jiăjiè`），借用更简单的字来写读音相同的更复杂的字。虽然这偶尔会产生歧义，但上下文通常会让意思清晰。示例：\n\
  困 `kùn`“困难，” 睏 `kùn`“困倦” → 困 `kùn`“困难；困倦”\n谷 `gŭ`“谷，” 穀 `gŭ`“谷” → 谷 `gŭ`“谷；谷”\n\n\
  4. 将汉字的草书形式规范为`楷书`风格。示例：\n東 → 东 `dōng`“东”\n樂 → 乐 `lè`“快乐”\n為 → 为 `wéi`“为”\n\n5.\
  \ 用汉字的部分代替整个字。示例：\n習 → 习 `xí`“练习”\n與 → 与 `yǔ`“和”\n雖 → 虽 `suī`“虽然”\n條 → 条 `tiáo`“条”\n\
  飛 → 飞 `fēi`“飞”\n電 → 电 `diàn`“电”\n\n6. 删除了汉字的冗余部分。示例：\n蟲 → 虫 `chóng`“虫”\n齒 → 齿 `chǐ`“齿”\n\
  \n7. 宽字变窄，长字变短。示例：\n噸 → 吨 `dūn`“吨”\n蠶 → 蚕 `cán`“蚕”\n\n8. 根据形声原则（`Xíngēng`）构造了新字。示例：\n\
  歡 → 欢 `huān`“欢”\n觀 → 观 `guān`“看”\n勸 → 劝 `quàn`“劝”\n權 → 权 `quán`“权”\n\n9. 用更简单的部件替换常用的汉字部件。例如，常用的但复杂的部件\
  \ `雚 被 被简单的部件 `又` 代替。示例：\n藝 → 艺 `yì`“艺术”\n\n## 汉系统的最新发展\n\n在现在的中国大陆，所有媒体出版物（如报纸和杂志）全部使用简体字。从幼儿园到高中的教材也是如此。学术著作和大学教材，尤其是涉及古代文学和历史的作品，有时仍用繁体字印刷。街道标牌和手写材料（如笔记和信件）通常包含简体和繁体字的混合，取决于作者的年龄、教育水平和个人偏好。\n\
  \n有趣的是，近年来——尽管政府不鼓励这样做——在中国某些地区，在酒店、餐厅和商店的招牌上使用繁体字已成为一种时尚。专业人士的名片上通常也会有一些繁体字。这种繁体字部分回归的原因包括它们被认为更正式、更美观、更时尚，因为它们与香港和台湾的富裕华人社会联系在一起。\n\
  \n\n\n\n在台湾，情况在某种程度上是相反的。除了少数例外，印刷品上只有繁体字。然而，与 1949 年前的中国一样，许多简化字被用于非正式手写，例如笔记、个人信件和招牌中。近年来，随着台湾与中国大陆之间通过信件、电子邮件、电视节目和个人访问的交流增加，台湾的许多人已经熟悉了\
  \ 1949 年后创新的相对较少的简化字。然而，虽然受过教育的台湾人通常能识别大多数简化字，但他们可能并不会写。\n\n至于其他使用汉语的社会，繁体字在香港和澳门是官方字体并被广泛使用，但人们越来越多地看到简体字，这在部分是由于来自大量大陆游客的影响。在新加坡，简体字是官方字体，但在商店招牌上看到繁体字也并不罕见。在马来西亚华人社区，简体字和繁体字都在共同使用，世界上其他地区的华人社区情况也是如此。\n\
  \n因此，我们拥有的是一种具有多种书写标准的语言——这在世界主要语言中是一个相当常见的情况，本质上与各个英语国家盛行的不同拼写和用法没有太大区别。作为汉语学习者，对你来说底线是：如果你希望精通阅读今天所有的汉语书面语（即使只是中国大陆的中文），你最终需要能够读懂简体字和繁体字。随着时间的推移和练习，这完全可行，你现在手中的材料旨在帮助你尽可能高效、轻松地完成目标，因为每节课都先用简体字呈现，然后用繁体字再次（当然，你也可以选择只学习一种字体）。现在关于书写，由于大多数受过教育的中国人都能识别这两种形式的字体，而且电脑对简繁互反的转换可以轻松完成，因此大多数学习者真的不需要学习如何写这两种字体。你可能希望学习你计划经常居住或旅行的地区所使用的字体。\n\
  \n### 字体格式\n\n最后，是汉字格式的问题。传统上，汉字是从上到下、从右到左写的。自 20 世纪 50 年代以来，按照西方格式书写汉语变得越来越普遍，即水平方向、从左到右。这现在是大陆的标准格式，尽管近年来在关于文学或文化主题的文章中，竖排风格似乎正在经历有限的回潮。在台湾和香港，传统的竖排格式仍然常见，尽管科学技术文章、非正式手写笔记和信件，以及电影电视节目字幕现在通常采用水平格式。水平或竖排格式的选择——以及第三种更罕见的、水平书写但从右向左的格式——为中文增加了英语及大多数其他语言所不具备的风格多样化和通用性。由于水平和竖排格式在所有使用汉语的地方都随处可见，本教科书包含了两种格式的文本。\n\
  \n### 书写系统的未来\n\n汉语书写系统的未来将如何？这并不容易预测。毫无疑问，如果按照口音书写，汉语可以用拼音来写。也许有一天，拼音可能会取代汉字，这是许多中国知识分子和政治领袖过去曾倡过的。计算机在处理汉字方面的广泛使用（大多数人输入拼音并在显示器上选择他们想要的汉字），对汉语母语者记忆手写汉字的能力已经产生了显著影响，电子邮件和短信等较新的通信技术也是如此。不仅人们写字的能力受到了影响，他们所书写的汉语内容也受到了影响，其中包括许多新词、简化形式和缩写，并反映了汉字与拼音及罗马字母频繁混合的现象。\n\
  \n另一方面，中国社会像我们一样非常保守，汉字几千年来一直是中国文化不可分割的整体。尽管汉字具有学习困难和有时处理起来繁琐的缺点，但它们确实具有某些优点，包括格式的灵活性（想想书名）、空间的高效利用（联合国文件中的一页英文通常相当于`![images](img/img_222.jpg)`\
  \ 一页中文），以及在中文中扫读或查找特定单词或短语比在字母语言中更快（因为汉字往往更突出）。必须承认的是，汉语书写系统受住了时间的考验，并证明是极其成功的，因为它今天的使用人数比历史上任何其他书面语言都多。现实情况是，汉字在可见的未来将存在，因此对于希望学习汉语读写的母语人士来说，唯一现实的方法就是下功夫学习它们。事实上，由于语言的简化和标准化、更好的参考工具以及技术、教材和教学方法的改进，书面汉语今天比以往任何时候都更容易学习。在下一节中，我们将提供一些帮助你更好学习的实用建议。\n\
  \n## 学习读写汉语的建议策略\n\n在学习读写汉语时，不仅要努力，还要聪明地工作，即尽可能有效地利用你的时间和精气。《Basic Mandarin Chinese\
  \ Speaking & Listening》（基础汉语口语与听力）入门部分建议的许多策略也适用于书面汉语，因此现在复习这些策略是非常值得的。下面列了一些专门适用于阅读和写的额外策略。\n\
  \n**1. 学习手写本书中所有的汉字。** 会手写汉字不仅对写作很重要，对阅读也重要，因为如果你能从记忆中正确写出一个汉字，你更有可能识别它并将其与相似字区分开来。在学习汉语的后期，你还会想学习如何使用电脑处理汉字，但我们认为对于初级学习者来说，手写数百个高频字的体验是非常重要的。\n\
  \n**2. 在学习和复习汉字时，多次练习写每一个字很重要，这样你最终就能从记忆中写出它。** 配套书籍《Basic Mandarin Chinese Reading\
  \ & Writing Practice Book》（基础汉语读写练习册）中的汉字练习字旨在帮助你以正确的笔顺和方向完成练习。不要只是“画”汉字；在你写一个汉字的同时，大声读出它的声音并思考它的意义。通过这种结合了机械、视觉和听觉刺激的方式，你更有可能记住你学习的汉字。\n\
  \n\n\n\n\n### 3. 务必遵循正确的笔顺和方向。如果不这样做，你的汉字不仅看起来不好，而且在查字典时可能会遇到困难，因为字典传统上是基于汉字的笔画数或部件来编写的。如果笔画顺序和方向错误，手写识别软件的准确性也会受到影响。如果你不熟悉正确的笔顺，将来在读和写中文草书时可能会遇到问题，因为哪些笔画可以连接与单个笔画的顺序和方向密切相关。\n\
  \n### 4. 虽然准确性最重要，但要努力让你的汉字看起来越美越有“中国味”。要意识到，在中国社会，你写汉字的方式很大程度上反映了你的人品和受教育的程度。\n\
  \n### 5. 对汉字的组成部分保持敏感，许多部分会在其他汉字中反复出现。例如，有很多汉字共享一个被称为`语义`或`部首`的部件，例如“河、湖、海”这三个字，左侧都包含了所谓的“水”旁（氵），含义都与“水”有关（分别为“河流”、“湖泊”和“海洋”）。还有其他组汉字共享一个被称为`声旁`的部件，例如“生、姓、星”，它们都共享声旁“生”，且发音与`shēng`音相似。本教材提供了关于汉字部件的详细信息，但你最好自己列一份清单，记录你学过的共享部首、声旁或其他部件的字。\n\
  \n### 6. 当你遇到一个新字或曾经学过但已忘记的字时，根据声旁猜测它的读音，根据部首猜测它的含义。务必始终仔细考虑上下文——该字所代表或所属的词汇、它所在的句子以及整体语境。这正是母语读者的做法。\n\
  \n### 7. 注意与其他汉字外形相似的字。事实上，中文里有很多组外观相似的字组，如“干千、大太、文交、可司、住往、王五正”或“差着看”。这些“形似字”很多在教材中都指出并进行了练习，但你可能也希望在单独的笔记本上建立自己的收集集。\n\
  \n### 8. 学习汉字最好的方法是每天学习几个新字。每天学习几个新字（并定期复习“旧”字）比在考试前晚上临时突击要高效得多。\n\n### 9. 学习汉字最有效的方法之一是经常测试。在学习了几个字以及用它们组成的单词后，将一张单独的纸长边对折，遮住页面左侧写中文的部分。现在测试自己，看看是否能看英文写出中文。用铅笔在你仍然有问题的项目旁画一个小小的“X”，以后再复习。然后再次测试自己。\n\
  \n### 10. 无论你去哪里，都带上几十张来自《基础汉语读写练习册》（Basic Mandarin Chinese Reading & Writing Practice\
  \ Book）的汉字闪闪卡。利用排队或课前的“碎片”时间学习闪闪卡。你的目标应该是识别出你仍然有困难的字和词，并将它们从大集中抽出来进行特别关注。\n\n###\
  \ 11. 用正确的读音和断句大声朗读中文的能力，以及以合理的速度默读中文的能力都至关重要。在阅读本教材中的句子、对话和叙述时，先大声读一或两次，然后再静默读一或两次。\n\
  \n### 12. 要达到高水平的中文阅读能力，进行两种类型的阅读非常重要：`精读`（intensive reading），即读得慢而仔细，试图理解并掌握每一个新字、单词和语法模式；以及`泛读`（extensive\
  \ reading），即读得更快、量更大，但为了理解大意，不必费力查每一个不熟悉的词，除非该词对理解文章至关重要。虽然本课程中的大多数阅读将是精读为主，但你也将有机会体验泛读。\n\
  \n### 13. 在敦促你练习写汉字之后，我们现在需要警告你不要走极端路线。有些学习者倾向于花大量时间在“玩”汉字上，以至于忽略了其他类型的课前准备（如配合音频录音进行练习、背诵对话或学习语法和文化注释）。当然，汉字是一种艺术形式，我们鼓励你把它们写得越漂亮越好，但不要过头。要清楚你的优先级：听、说是第一，然后是读。这三项技能几乎肯定比写字对你更有用——而且也更容易掌握。\n\
  \n### 14. 虽然在世界各种书写系统中，汉字在某些方面是独特的，而且研究单个字的结构和发展可能很有趣且有帮助，但不要“执着于”汉字也同样重要。在大多数情况下，汉字并不比其他代表语言的符号更多或少，对它们采取务实的态度最好。比学习单个字更重要的是，你需要专注于获得阅读能力至关重要的中文其他方面：用汉字写的词、标点符号、书面词汇和语法、阅读流利度、读懂弦外之、略读、扫读等。祝你的中文书面语学习顺利！\n\
  \n## 脚注\n\n- [1] 参见 Eleanor H. Jorden 和 A. Ronald Walton，“Truly Foreign Languages:\
  \ Instructional Challenges”，见 *The Annals of the American Academy of Political and\
  \ Social Science*, 1987 年 3 月。\n- [2] 两个单元介绍了数字、人名地名，旨在让学习者在（许多情况下）通过《基础汉语听说听力》学习发音和拼音时，熟悉汉字的基本笔画。数字和名字除了显而易见的用途外，优点是可以独立出现，不需要语法知识即可理解。\n\
  - [3] 在相应课程的基础对话中没有合适汉字的少数情况下，我们会从相应课程的补充词汇中选择字，或者从之前课程中过剩的字中选择。\n- [4] 注意，在大声朗读汉字时，中文读者倾向于给每个音节完整的调，因此某些在对话中是轻声的字会被读成完整的调（例如，“朋友”可能被读成\
  \ **péngyŏu** 而不是 **péngyou**）。在这种情况下我们的建议是遵循老师、导师或随本文音频录音的发音。\n\n\n\n\n\n# 这一点的唯一例外是单元\
  \ A，它的简体和繁体字完全相同；因此，它只以水平格式呈现一次。虽然在书中简体字以水平格式呈现，而繁体字通常以垂直格式呈现（这反映了中文“现实世界”中的普遍做法），但学习者应该意识到，简体字也可以竖排打印或手写，而繁体字也可以（而且经常如此）水平打印或手写。\n\
  \n## 缩写词\n\n### 词类\n\n| [A] | 副词 (Adverb) |\n| :--- | :--- |\n| [AT] | 定语 (Attributive)\
  \ |\n| [AV] | 助动词 (Auxiliary Verb) |\n| [BF] | 黏着语 (Bound Form) |\n| [CJ] | 连词 (Conjunction)\
  \ |\n| [CV] | 掩备 (Coverb) |\n| [EV] | 等系动词 (Equative Verb) |\n| [EX] | 表达 (Expression)\
  \ |\n| [I] | 感叹 (Interjection) |\n| [IE] | 成语/习语 (Idiomatic Expression) |\n| [L]\
