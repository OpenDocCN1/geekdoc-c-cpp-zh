  ## D. 叙述文\n\n阅读以下叙述文，特别注意标点符号和整体结构。第一次读叙述文时，大声读出来；第二次读时，默读并尝试逐渐增加阅读速度。始终思考你所读内容的意义。\n\
  \n![images](img/img_p73-3.jpg)\n\n## 附记\n\n**A1A.** `顿号` (頓號) `dùnhào` (、) 的另一个用法是分隔一系列中处于无标记关系的并列项，有点类似于英语的连词“and”。因此，`香港、台北也都很好`\
  \ 的意思可以是“香港和台北也都很好”。`顿号` 的用法例如：用在你想要购买的不同物品名称之间，在句子中提到的系列姓名中的每个名字之间，或者在句子中的不同国家名称之间。由于这个原因，`顿号`\
  \ 在英语中有时被称为“列举逗号”（enumerative comma）或“列表逗号”（listing comma）。在汉语口语中，每当出现`顿号`时，会有短的停顿。注意`顿号`和普通的`逗号`\
  \ (逗號) `dòuhào` 在外观上的区别：\n\n| **DÙNHÀO:**、 | **DÒUHÀO:**， |\n\n如你上方所示，`顿号`向*右侧*倾斜且*底部*是圆的，这与`逗号`不同，后者在*顶部*是圆的，然后向左侧倾斜。\n\
  \n**A1B.** 注意，汉字 `都` 可以表示两个读音不同的词。读作 `dū`（如成都 `Chéngdū`）时，意思是“城市”；但读作 `dōu` 时它是一个副词，意思是“全部、都”。语境通常会让意图的意义和读音变得清晰。汉语中有很多常用字可以代表几个读音不同的口语词。当然，在英语中也有一个书写形式代表几个不同口语形式的情况；例如，考虑“What\
  \ will you read?”中的“read”与“What have you read?”中的“read”的区别。\n\n**A3.** 在列出一系列名字之后，通常会加上适当的复数代词，以“总结”并明确或强调所涉及的人群。因此，在这个句子中，`李小明、何台生他们\
  \ (李小明、何台生他们)` 的字面意思是“李小明和何台生，他们……”。通常，在英语翻译中，“they”是被省略的。\n\n**B2, B3.** 注意，虽然\
  \ `她们` (她們) 始终指代两个或多个女性的“他们”，但 `他们`（他們）既可以指男性群体，也可以指由男女组成的混合群体。当然，这种区别仅存在于书面语，因为口语只有一个术语（`tāmen`），且不区分性别。\n\
  \n**D1, D2.** 注意在汉语中，如果你到达了一行的末尾（无论是横排还是竖排）并且处于一个多音节词的中间，你写下该行能容下的所有音节，然后直接在下一行继续。汉语没有等同于英语行末连字符的方法来表示前一个音节通常与下一行开头的音节连写在一起。\n\
