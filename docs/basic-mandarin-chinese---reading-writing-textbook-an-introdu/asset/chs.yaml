  \ Publishing 的核心使命是创作通过一页页书将人们联系在一起。Tuttle 成立于 1832 年，位于美国新英格兰地区佛蒙特州拉特兰（Rutland）的小镇。我们的基本价值观至今与那时一样坚定——即出版顶级书籍，向英语世界介绍亚洲的国家和人民。如今世界已变得更小，亚洲的经济、文化和政治影响力不断扩大，但人们对这一多元化地区有意义的对话和信息的需求从未如此巨大。自\
  \ 1948 年以来，Tuttle 一一直是亚洲文化、艺术、美食、语言和文学书籍的领导者。我们的作者和摄影师已获得众多奖项，Tuttle 出版了从武术到纸质工艺等领域的数千书籍。欢迎访问\
