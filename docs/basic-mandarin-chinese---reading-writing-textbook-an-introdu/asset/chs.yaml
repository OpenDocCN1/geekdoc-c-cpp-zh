  \n![images](img/p129.jpg)\n\n### 注释\n**A1.** 你可能已经注意到，从本课开始，中文字字体缩小了。这本教材旨在为你提供阅读各种大小和风格的印刷及手写中文文本的机会。\n\
  \n**B6.** 看这句话 高老师先生的公司 (高老師先生的公司) “高老师丈夫的公司”。我们可以说，在更深层次上，这个句子的语法结构原本是 高老师的先生的公司\
  \ (高老師的先生的公司)，里面有两个 `的`，但根据我们在 2-2 注释 A1 中提到的规则——中国人不喜欢连续出现几个 `的` 的“读音”，通常会删除除了最后一个以外的所有\
  \ `的`——这个句子变成了 高老师先生的公司 (高老師先生的公司)，里面只了一个 `的`。\n\n**B7.** 看这个句子：她的先生姓李，是一位很好的老师\
  \ (她的先生姓李，是一位很好的老師) “她的丈夫姓李；他是一位很好的老师。”首先，我们注意到中文的逗号有时等同于英语的分号（如果翻译成“Her husband’s\
  \ last name is Li, he’s a very good teacher”会产生英语连句）。其次，我们注意到在中文里第二个分句没有主语（字面意思是“是一位很好的老师”）。你应该意识到，如果主语或主题已经明确（如此处在前一个分句中那样），那么在后面的分句或句子中不重复它是完全正常的。事实上，过度重复主语或主题被认为是不好的、受西方影响的风格。\n\
  \n\n\n\n\n## B8. 根据语境，“两位男老师…… 三位女老师…… (兩位男老師…… 三位女老師……)” 可以表示“两位男老师……三位女老师……”或“那两位男老师……那三位女老师……”\n\
  \n## C1. 这个对话可能发生在一家餐厅。\n\n## E1. 正如我们在上单元看到的，“高兴 (高興)” 有时可以作为动词，后面的句子作为宾语，意思是“高兴……”。所以句子我们很高兴他们都是我们的老师\
  \ (我們很高興他們都是我們的老師) 可以翻译为“We are very happy that they are both our teachers.”\n\n\
