  \n![images](img/img_p190.jpg)\n\n## F. 补充：一个中国笑话\n\n大声读出以下笑话，它出现在几本中国大陆的笑话合集中。\n\
  \n老师：东东，我问你，哪个月有二十八天？\n\n东东：老师，一月、二月、三月、四月、五月、六月、七月、八月、九月、十月、十一月、十二月都有二十八天！\n\n\
  ### 笔记\n\n- **B5.** 是你？是他？“Is it you or is it him?” 是一个带有 `Choice Implied`（隐含选择）的\
  \ `Choice-type` 问题（参见 BMC—RW 4-3 中的注释 B2B）。\n- **B8.** 小李有个同屋，姓万，海南人，海口来的（小李有个同屋，姓萬，海南人，海口來的）。这是非正式的口语体。直译为“Little\
  \ Li has a roommate, (he) is surnamed Wan, (he) is from Hainan, (he) has come from\
  \ Haikou.”在地道的英语中，我们可以翻译为“Little Li has a roommate with the last name Wan who is\
  \ from Haikou, Hainan。”注意在口语中，量词、主语或话题以及系动词“是”有时会被省略。“有个同屋 (有个同屋)”是“有一个同屋”的缩写，“海南人”是“他是海南人”的缩写，而海口来的\
  \ (海口来的)”是“他是海口来的 (他是海口來的)”的缩写。\n\n# 第五单元：确定人物、地点和事物\n\n![images](img/img_p191.jpg)\n\
  \n### 教学目标\n\n一旦你掌握了这个单元，你将能够用中文读写关于：\n\n1. 某人或某物相对于另一人或某物的位置：“这里”、“那里”、“右”、“左”、“顶”、“底”、“上面”、“下面”、“里面”和“外面”。\n\
  2. 某地相对于另一个地所在的方向：“北”、“南”、“东”、“西”。\n3. 中国各省份相互之间的相对位置。\n4. 一篇讨论北京地理和历史的文章。\n5. 一篇介绍广州中山大学的文章。\n\
  6. 一篇关于台北国立台湾大学的文章。\n7. 一段在上海公园里听到的手机通话对话转录。\n8. 一位中国留学生写给另一位学生的手写笔记。\n9. 一句 20\
