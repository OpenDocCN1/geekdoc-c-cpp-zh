  \ `长` (`長`)，它被用来读作 `cháng` 表示“长”，也被用来读作 `zhăng` 表示“增长”。实际上，我们之前见过这种情况：`都`，它在成都 `Chéngdū`\
  \ 中读作 `dū`，但也可以用来写词 `dōu`（都、全部）。\n\n这种两个不同的词具有相同写形式的现象在中文或英语中并不稀奇。在英语中，这类单词被称为异形同音词（heteronyms）；考虑“minute”（“一分钟时间”\
  \ vs. “极微的量”）、“number”（“一个质数” vs. “我的嘴变得麻木了”）以及“tear”（“流泪” vs. “撕碎一张纸”）。\n\n在中文里，一个有两个或多个不同读音和含义的字被称为多音字\
  \ `duōyīnzì`（有些地方也使用破音字 `pòyīnzì` 一术语）。中文有很多两个读音的字，三个读音的少得多，而且至少有一个字有四个读音！\n\n在某些情况下，读音和含义可能只有细微差别，但在其他情况下它们可能完全不同。在读中文时，密切注意上下文以判断指的是哪个词是关重要的。偶尔会有歧义，但通常意思是清晰的。从现在起，每当我们遇到一个新的多音字\
  \ `duōyīnzì`，我们都会提醒你。另参阅光盘上的“多音字列表”。\n\n## A1B\n\n长高 (長高) `zhănggāo` “长高”是一个结果补语，在语法上与长大\
