  \n## 注释\n\n**A1.** 中文逗号逗号（逗號）**dòuhào**（，）和中文叹号叹号（嘆號）**tanhào**（！）的用法通常与英语相似。\n\n\
  **A2A.** 取句子 我去山东 (我去山東) **Wŏ qù Shāndōng** “我去山东”。它显然由三个独立的单词组成：我 + 去 + 山东，但它们是写在一起的。你可能已经意识到了，中文写作系统在单词之间不留空格（但在极少数情况下，词前的空格可以表示深敬）。中文写作系统的这一特征解释了为什么普通中国人对“词”的概念很少。相反，他们通常会说“字”，因为字是语言的基本单位。\n\
  \n**A2B.** 观察这个句子：我去山东，你去山西 (我去山東，你去山西) “我去山东；你去山西”或“我去山东，你去山西”。考虑这种翻译策略：两个从句之间的中文逗号在英语中通常被翻译为分号（；）或单词“and”。\n\
  \n\n\n\n\n### A2C. 注意这句话末尾的“中文句号”。中文句号被称为`句号`(句號) `jùhào`。它不像英语中的点点，而是一个小圆圈，像这样：。。在水平排版中，中文句号放在句子最后一个字的右下角。在竖排版中，它通常位于最后一个字的下方。无论哪种情况，它占据的空间与其他任何字符相同。\n\
  \n### A5. 动词，例如这句话中的`去`，有时会为了强调而重复。\n\n### A6. 注意名字`何台生`。你认为这个姓`何` 的人可能出生在哪里呢？（答案：`台`在这里可以代表`台湾`(台灣)，而`生`\
  \ 的意思是“出生”，所以`台生` 可能是表示“出生在台湾”的缩写。）\n\n### A7. 考虑到上一条笔记中的信息，你认为`王京生` 可能出生在哪里呢？\n\
  \n### A8. 这句话有两种可能的解释。除了“你去广东，我也去广东”之外，它也可以被解释为“如果你去广东，我也去广东”。虽然中文里有明确的“如果”一词，但要注意“if”有时必须从上下文中推断并在英语翻译中补充。句子\
  \ A9 在这方面与句子 A8 。\n\n### B1A. 注意说话者名字后的冒号`（：)`。中文冒号是`冒号 AC 冒號) `màohào`。中文冒号的使用与英语非常相似。\n\
  \n### B1B. 注意第一行末尾的问号`（？)`。在中文里，问号被称为`问号 AC 問号) `wènhào`。中文问号的使用与英语相似（有时中文问号不仅用于直接提问，也用于间接提问，这与英语不同）。\n\
  \n### B3. `好`在这里充当状态词，意思是“好”。因此，`北京好`意思是“北京很好”或“北京更好”。`台北好` 的用法完全一样。\n\n![images](img/img_p66.jpg)\n\
