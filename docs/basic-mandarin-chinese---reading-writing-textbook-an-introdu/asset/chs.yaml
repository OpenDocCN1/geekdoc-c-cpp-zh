  五、你今天去哪家公司？你可别忘了带你的名片。\n六、我忘了今天是星期一，那家公司星期一不开门。\n七、我家左边有一家公司，右边有一家饭店。\n八、我大哥在一家公司工作，很忙，不过我忘了那家公司叫什么。\n\
  九、因为星期六我小妹京京要来看我，所以我星期五就不回家了。\n十、王大海在他们家是老二，他上面有一个姐姐，下面有一个妹妹。\n\n##### B. 对话\n\n\
  大声朗读以下对话，包括说话者的名字或角色。如果可能，请找一个或几个伙伴，每个人扮演一个角色。然后交换角色，这样你就能练习读所有的行。\n\n一、\n台湾人：我在我们家是老大。我有一个弟弟、两个妹妹。\n\
  美国人：他们都住在台北吗？\n台湾人：我大妹住在台北。\n美国人：对不起，我忘了我还有一点事，先走了。我姓高，高大文。这是我的名片。\n台湾人：谢谢您，高先生。我姓何。我也给您我的名片。\n\
  \n二、\n林先生：您贵姓？\n谢小姐：我姓谢。您贵姓？\n林先生：我姓林，这是我的名片。您能给我您的名片吗？\n谢小姐：对不起，我今天忘了带了。下次给您，好吗？\n\
  \n#### C. 汉字辨析练习\n\n仔细区分以下相似的汉字，大声读出每一个字并思考它的意思。\n\n一、哥 哥 哥 可 可 可\n二、哥 哥 哥 何 何 何\n\
  三、哥 哥 哥 司 司 司\n四、哥 哥 哥 同 同 同\n五、哥 可 哥 何 哥 司 哥 同\n\n#### D. 叙述\n\n阅读以下叙述，特别注意标点符号和整体结构。第一次读叙述时，大声朗读；第二次读时，默读并尝试逐渐增加阅读速度。始终思考你所读内容的意思。\n\
  \n中国有一个小学生，姓高，名字叫明山，今年十岁。他们家住在西安。高明山不是好学生，学校的老师问他的事，他差不多都不知道，所以老师不太喜欢他。有一天，是星期一，有一位老师问他：\n\
  老师：高明山，中国有多少人口？你知道不知道？忘了吧？\n高明山：我没忘，中国有 1,300,000,001 个人。\n老师：不对！上个星期我们不是学过中国有 1,300,000,000\
  \ 人吗？\n高明山：可是老师，您还不知道吧？星期六我的小妹妹出生了，所以中国的人口多了一个，今天中国有 1,300,000,001 个人了！\n\n####\
