  \ (that soon) you can arrive (at my school).” 这里的 就 意味着“as early as.”\n\n# 第 9 单元\n\
  \n## 在北京出行 (II)\n\n![images](img/img_p318.jpg)\n\n### 教学目标\n\n掌握本单元后，你将能够用中文读写：\n\
  \n1. 关于在京地区的各个目的地出行：首都机场、北京站、北京西站、香香山、北京大学、北京外国语、天安门、北京动物园、北京酒店、长城酒店等。\n2. 关于通过各种交通方式在北京出行的文章：步行、公交车、电车和出租车。\n\
  3. 关于乘坐公交车或电车的详细语言：坐哪几路车、站在哪里、在哪里下车、在哪里换乘其他公交或电车。\n4. 与公交或电车务员的对话：在哪里上车、想去哪里、买票、还有几站到、请务员在到时提醒你等。\n\
  5. 一篇关于北京著名的京光中心的长篇文。\n6. 几个幽默故事。\n7. 一个汉字谜谜。\n8. 北京主要公交路线列表。\n9. 一张招募英语老师的手写告示。\n\
  10. 不同货币面额的口语化和书面化术语：“分”、“角”和“元”。\n\n# 第一部分\n\n## 迷失北京\n\n![images](img/img_p319.jpg)\n\
