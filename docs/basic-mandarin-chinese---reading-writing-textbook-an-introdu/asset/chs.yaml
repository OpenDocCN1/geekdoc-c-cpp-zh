  \ (惆悵) `chóuchàng` 忧郁的）、张 (張) `Zhāng`（姓氏）、涨 (漲) `zhăng`（涨价 (漲價) `zhăngjià` 涨价）、帐\
  \ (帳) `zhàng`（蚊帐 (蚊帳) `wénzhàng` 蚊帐）、账 (賬) `zhàng`（账单 (賬單) `zhàngdān` 账），以及胀 (脹)\
  \ `zhàng`（通货膨胀 (通貨膨脹) `tōnghuò péngzhàng` 通胀）。这个字最初是一个显示“长”和“生长”头发的象形字。由于古代通常不剪头发，人越大，头发“生长”得越多，越“长”。对比简体字\
