  \ (我没钱买公交票，一毛钱都没有。)\n\n**D.**** `他去哪儿都只带五毛钱｡` (他去哪里都只带五毛钱。)疑问词后跟 `都` 时，通常带有“无论哪里、谁、什么”等不定含义。这将在以后详细解释。\n\
  \n### E.\n\n中国人非常喜欢字谜。由于汉字的复杂性，他们有很多机会增加乐趣。关于本补充部分的字谜，答案是：“一”字。这是因为在 `人` 字上加上 `一`\
  \ 就变成了 `大` 字；而如果 `天` 字没有 `一`，也会变成 `大` 字。\n\n# 第四部分：乘公交和电车去暑宫（续）\n\n![images](img/img_p338.jpg)\n\
  \n## 生字词 ![images](img/img_disc.jpg)\n\n学习以下六个字以及它们组成的常用词，特别注意每个字的读音、意思和结构，以及字形相似的字。在学习完一个字后，翻到《练习册》卷，在练习纸上书写它，在大声读并思考它的意思的同时，确保遵循正确的笔顺和方向。\n\
  \n### 259. 早 (zăo): 早上\n\n部首是 日“太阳” [**BF**] (132)。另一个部分是 十 (11)，在这里代表地平线。如果看到“太阳”从地平线上升起，那就是“早”。这个字也作为声旁，例如在\
  \ `căo` “草”。将早与中 `zhōng` (23) 和 千 `qiān` (114) 进行对比。\n\n- `早` `zăo`: 早 [s**V**]\n\
  - `早上` `zăoshang`: 早上 [**TW**]\n- `早饭` (早飯) `zăofàn`: 早餐 [**N**]\n\n### 260. 着(着):\
  \ `-zháo` / `-zhe`\n\n- (表示动作实现)(表示持续)\n\n\n\n\n部首是目 `mù` “眼” [`BF`]。简体字的另一个组成部分是羊\
  \ `yáng` “羊”。注意简体字 着 与繁体字 相比有细微的差别——少了一笔画。在实践中，大多数人手写繁体字时与其简体字写法完全相同。此外，注意繁体字有一个常见的替代形式\
  \ 著。将 着 (着) 与 差 (差) `chà` (118) 和 看 `kàn` (176) 进行对比。最后，注意 着（着）是一个多音字 `duōyīnzì`，因为它同时代表\
  \ `-zháo` 和 `-zhe`（参见 6-2，注 A1A）。\n\n| | | | 意义/备注 |\n| :--- | :--- | :--- | :---\
