  \n![images](img/img_disc.jpg)\n\n现在在句子、对话和叙事语文中练习本课的新字和新词。务必参考本课末尾的笔记，并利用随附的音频光盘听并练习正确的读音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些句子包含了本课的所有新字。第一次读句子时，特别关注对你来说是新的字和词，提醒自己它们的读音和含义。第二次，旨在理解句子的整体含义。\n\
  \n一、我觉得美国东岸的气候比西岸好，但是小李觉得东岸的气候没有西岸那么好。\n\n二、对不起，实在对不起，我听错了，所以就说错话了！\n\n三、他已经学了半年的中文了，已经会说不少东西了。\n\
  \n四、今天早上太阳出来的时候实在太美了，你说是不是？\n\n五、我觉得北京饭店不但比和平饭店贵，饭也没有和平饭店的那么好吃。\n\n六、我小的时候喜欢去阳明山，现在太忙了，已经多年没去了。\n\
  \n七、今天出太阳了，明天大概不错。\n\n八、你的表哥走了，别难过了，我们早晚都会……九、我刚来的时候，不喜欢东岸的气候，但是现在喜欢了。\n\n十、“大海，你别难过”，王大海的朋友说：“要是你晚上一定要去动物园看动物的话，我可以和你一起去”。\n\
  \n##### B. 对话\n\n大声读出以下对话。如果可能，找伙伴各自扮演角色。然后交换角色，这样你就能练习所有的台词。\n\n一、\n中国人：你家在美国什么地方？\n\
  美国人：在美国的西岸，离 San Francisco 不太远。\n中国人：那儿的气候怎么样？\n美国人：那儿的气候还不错。比北京好，也没有这儿干。\n\n二、\n\
  万太太：弟弟，晚饭你要吃什么？\n儿子：我要吃早饭！\n万太太：什么？是你说错了？是我听错了？你要吃早饭？！\n儿子：我没说错，你也没听错。我晚上就是喜欢吃早饭。现在美国年轻人都是这样，你不知道吗？\n\
  \n三、\n外国学生：老师，您觉得我的中文怎么样？\n\n\n\n\n\n中文老师：比以前好｡不过，这个字你看错了｡不是“要不要”的“要”，这是“车票”的“票”｡还有，“年轻”的“轻”，你写成“已经”的“经”了｡。。\n\
  \n外国学生：对不起，是我的错｡谢谢老师｡。\n\n## C. 字形辨析练习\n\n仔细区分以下形似字，大声读出每个字并思考它的含义。\n\n一、经 经 经 轻\
  \ 轻 轻\n\n二、经 轻 轻 经 经 轻 经 轻\n\n三、阳 阳 阳 场 场 场（繁体字）\n\n四、阳 场 场 阳 阳 场（繁体字）\n\n五、阳 阳\
  \ 阳 日 日 日\n\n六、阳 日 日 阳 日 阳 日\n\n## D. 叙述\n\n阅读以下叙述，特别注意标点符号和整体结构。第一次阅读叙述时，大声读出来；第二次默读并尝试逐渐加快速度。始终思考你所读内容的含义。\n\
  \n| 一、 | 我有一个老同事姓高，他是贵阳人｡他有一个女儿，名字叫“高兴”｡要是有人问她叫什么名字，她就说“高兴”｡要是高先生，高太太找女儿的时候，他们就叫：“高兴！高兴！”他们家里从早到晚都有人叫：“高兴！高兴！高兴！”所以这一家人真的都很高兴｡\
  \ |\n\n| 二、 | 我是北京人，现在给你们说一说我老家北京的气候吧｡从三月到五月，北京的天气还不错，不是太冷也不是太热，有时候下一点儿雨｡从六月开始，天气越来越热，七月和八月有时候雨也很大｡七、八月的时候，最高温度差不多四十度，最低温度差不多二十度｡最近几年，北京好像越来越热，有时候热得要死｡九月、十月是北京天气最好的时候，人人都喜欢｡那个时候不冷也不热，出太阳的时候多｡这个时候很多外国人到北京来看天安门、后海、北京动物园、长山和长城，还有很多别的地方｡这正是来北京的好时候｡从十二月到二月天气又干又冷，很少下雨，那个时候来北京的外国人也比较少｡所以说，要是你有机会到北京来，还是九月、十月那个时候来最好！\
  \ |\n\n## E. 补充：四字成语\n\n中国人喜欢成语（成語）`chéngyŭ` “four-character expressions”的节奏、简洁和博学。你能猜出以下成语的意思吗？它们使用的字都是你在书书中十二单元中学过的字。英文译文请参阅本课末尾的注释。\n\
