  \ ![images](img/img_disc.jpg)\n\n现在在句子、对话和叙述中练习本课的新字新词。务必参考本课末的注释，并利用随附的光盘练习正确的读音、断句和语调。\n\
  \n##### A. 句子\n\n大声读下列句子，它们包含了本课所有的新字。第一次读句子时，特别注意对你来说是新的字词，记住它们的读音和含义。第二次读，目的是理解句子的整体含义。\n\
  \n1. 先生，请问，去天安门怎么走？离这儿还远吗？\n2. 你往前差不多一刻钟，过了北京饭店就到了。\n3. 小李的家离我的家很近，可是老王的家离我的家很远。\n\
  4. 我要是知道那么远的话，我大概就不来了！\n5. 北方人说北方话，南方人说南方话。\n6. 他是西方人，不过有很多朋友是东方人。\n7. 大学离我的家不远，走半个钟头就可以。\n\
  8. 我的公司离我住的地方很近，走一刻钟就可以到\n9. 我的生日是八月三号，今天是三月八号，所以离我的生日还远。\n十、王大海说他不高兴，因为他的生日过了，朋友都没给他东西；我说他们大概太忙了，所以忘了。\n\
  \n![images](img/294.jpg)\n\n##### B. 对话\n\n大声读下列对话，包括说话人的名字或角色。如果可能，找一个或多个伙伴，每个人扮演一个角色。然后交换角色，这样就可以练习所有的句子。\n\
  \n一、\n美国人：请问，去北京饭店怎么走？\n北京人：北京饭店是吗？往前走，过了天安门就到了。\n美国人：离这儿还远吗？\n北京人：离这儿比较远。走路的话，大概要半个钟头左右吧。\n\
  美国人：好，谢谢您！\n\n二、\n东方人：你的中国话说得太好了！\n西方人：哪里，哪里。我的中文不好，还差得很远⋯⋯\n三、(电话中)\n小姐：先生，你好像是北方人吧？\n\
  先生：是的，我是北方人，你怎么知道的？\n小姐：我听你说话就觉得你大概是北方人。\n先生：可是我不是中国的北方人，我是美国的北方人！\n\n![images](img/img_p295-1.jpg)\n\
