  \ | 从……开始 [PT] |\n\n## 阅读练习（简体字） ![images](img/img_disc.jpg)\n\n现在在句子、对话和叙述中情练习练习本课的新汉字和词汇。请务必参考本课末尾的注释，并利用随附的音频光片来听并练习正确的发音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些包含了本课所有的新汉字。第一次读句子时，特别注意对你来说新的汉字和单词，提醒自己它们的读音和意思。第二次读，目标是理解句子的整体意思。\n\
  \n一、你的中文说得越来越准，可是我的中文好像越来越差！\n二、你最喜欢吃什么？最不喜欢吃什么？\n三、你会不会觉得最近温度好像越来越低了？\n四、本地的最高温大概几度？最低温几度？\n\
  五、我们不一定得去动物园，你不要去我们就不去了！\n六、这个我以前还真没听说过，不可能吧！\n七、小心！有一个小动物离你越来越近了！\n八、我开始上班以后，不知道为什么，越来越没钱了。\n\
  九、那个人不是中国人，可能是越南人吧。\n十、王大海那个人真好，早上看到人，一定说“早，您好”。\n\n##### B. 对话\n\n大声读出以下对话，包括说话者的名字或角色。如果可能，找一个或几个伙伴，每个人扮演一个角色。然后交换角色，这样就可以练习读所有的句子。\n\
  \n一、\n王先生：李开来，早！\n李先生：王定和，早！你最近还好吧？\n王先生：我最近越来越忙了。\n李先生：可是你最近钱越来越多，不是吗？\n王先生：不是。我越来越忙，不过钱越来越少！\n\
  李先生：那你可能得换一个工作！\n\n二、\n弟弟：最贵的车子一定是最好的车子吧？\n哥哥：不一定。\n弟弟：那么，最好的车子一定是最贵的车子吧？\n哥哥：那也不一定。弟弟，你听我说，有的时候最贵的东西不一定是最好的，最好的也不一定是最贵的。现在清楚了吧？\n\
  \n三、\n温州人：你知道中国去年的 GDP 是多少吗？\n上海人：我只知道中国的 GDP 最近几年越来越高，可是说真的，我不太清楚去年是多少。\n\n###\
