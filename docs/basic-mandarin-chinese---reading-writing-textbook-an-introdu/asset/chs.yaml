  ![images](img/img_p234-1.jpg)\n![images](img/img_p234-2.jpg)\n“自助餐和便当”（从右起\n\n##\
  \ 注释\n\n**A4A.** `朋友` 在这里用作呼语。也就是说，它是引起某人的注意，就像英语中说“friend, could you do me a favor?”\n\
  **A4B.** `里边` (`裡`) 指“inside”。\n**A4C.** `东西` (`東西`) 可以指代食物；事实上，`吃的` (`東西`) 是“things\
  \ to eat”的常用说法。\n**A5A.** `要是……就……` 意思是“if…then…”。\n**A5B.** `多一点儿` (`一點兒`) 意思是“more”。同样，出现在后面的\
  \ `少一点儿` (`一點兒`) 表示“less”。\n**A6A.** `金山大一那年` 应该解析为：`金山` + `大一` + `那年`。提示：`金山` 是人名，`大一`\
  \ 是 `大学级` 的缩写。\n**A6B.** `他今年大四，朋友可真多！` 他大四了，朋友真！（直译：He year fourth grade, friends\
  \ indeed!）\n**A8.** `这位同学` (`同學`) 在这里用于称呼学生并引起其注意。最好的英语可能是“Excuse me, young lady”或“Excuse\
  \ me, young man”。`这位同学` (`同學`) 可以由任何人说（例如游客），而不只是同学。\n**B1.** `小朋友` 字面意思是“Little\
  \ friend”，常用于称呼不知道名字的孩子，就像英语“Little boy”或“Little girl”。\n**B2.** 对很多中文使用者来说，`男朋友`（boyfriend）和\
  \ `男朋友`（male friend）或者 `女朋友`（girlfriend）之间是有区别的。\n**D1A.** `你有事儿可以去找他` (`你有事兒可以找`)\
  \ “When you have something (you need help with, you) can seek him.”\n**D1B.** `坐在那边的那个人`\
  \ (`坐在那邊的那個人`) “That person (who is) sitting over there.”\n**D2.** `老钱要先在他们公司里吃饭`\
  \ (“Old Qian wants me to eat in their company”). 关于 `他们公司里` (`他們公司裡`), 注意人代词和 `公司`\
  \ 之间通常没有 `的`，因为人和公司之间的关系被认为是亲密的。此外，在中国许多大公司都有员工食堂，所以有时可以邀请外地的人来公司用餐。\n\n![images](img/img_p235.jpg)\n\
