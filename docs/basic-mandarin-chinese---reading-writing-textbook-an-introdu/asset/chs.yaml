  \n![images](img/img_p367.jpg)\n\n## E. 补充：几处手写笔记\n\n（参见简体字部分）\n\n### 笔记\n\n**A3.**\
  \ 看您的样子 (看您的樣子) “Looking at your appearance”或更地道的英语，“From the way you look.”\n\n\
  **A6.** 我看不太清楚，但是外面看起来好像在下毛毛雨的样子 (我看不太清楚，但是外面看起來好像在下毛毛雨的樣子) “I can’t see very clearly,\
  \ but outside, from looking at it, it appears to be drizzling.” 注意 `看不清楚`。这是一个否定可能结果补复合词\
  \ `看不清楚` (`can’t see clearly`)（参见 BMC–SL 9-4: 5），中间插入了额外的 `太`：`不太清楚` “not be able\
  \ to see too clearly”或“can’t see very clearly.”\n\n**A7.** 林进明天天早上六点钟就出门 (林進明天天早上點鐘就出門)\
  \ “Lin Jinming goes out every morning at 6:00, that early.” `就` 表示“that early”或“as\
  \ early as that.”\n\n**A8.** 这班学生里头只有一个同学天天都来 (這班學生裏頭只有一個同學天天都來) “In this class\
  \ of students there is only one classmate who comes every day.” 注意 `天天` 后面的 `都`。\n\
  \n**B1.** 是又要下雨了？ “Is it going to rain again?” 通常，`又` 用于过去事件，例如`老毛又生气了( 老毛又生氣了 )`\
  \ “Old Mao got angry again.” 然而，对于规律发生的事件（如天气），在讨论未来时可以使用 `又`。\n\n**D1A.** 很少下雨，也很少会冷\
  \ (很少下雨，也很少會冷) “It seldom rains, and it’ll seldom get cold.”\n\n**D1B.** 最近两个月一次也没下雨\
  \ (最近兩個月一次也沒下雨) “The last two months it hasn’t rained even once.” 模式 `一次也没` (`一次也沒`)\
  \ + `VERB` 表示“didn’t VERB even once.”这一模式将在未来的课程中详细解释。\n\n**D1C.** 看样子 (看樣子) “The\
  \ way it looks”（字面意思是“Looking at appearance”).\n\n**D1D.** 明后天 ( 明後天 ) 表示“tomorrow\
  \ or the day after tomorrow.” `明`在这里是 `明天` 的缩写。你认为同样存在的 `明后年` ( 明後年 ) 什么意思？\n\n\
  **D2A.** 这个可不能吃 (這個可不能吃) “This you certainly can’t eat.” 记得 `可` 可以作副词表示“certainly,\
  \ indeed.”\n\n**D2B.** 过了一会儿 (過了一會兒) “after a while.”\n\n**E2.** 错字 (錯字) `cuòzì`\
  \ 表示“wrong characters.”字符 `错` (錯) `cuò` “be wrong”将在下节课介绍（字号 284）。\n\n![images](img/img_p368.jpg)\n\
