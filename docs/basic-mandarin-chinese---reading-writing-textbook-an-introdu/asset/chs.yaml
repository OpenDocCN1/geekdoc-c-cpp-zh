  \n如需支持，请发送邮件至 info@tuttlepublishing.com。\n\n## 给学习者的说明\n欢迎学习这门书面汉语课程！\n\n作为英语母语者，仅仅努力学习汉语是不够的；你必须学会聪明学习，才能高效地学习这种非常不同的语言。无论你选择学习汉语是为了什么——商务、旅行、文化研究还是其他目标——`基础汉语`这种将口语和书面语分为独立但整合的轨道相结合的方法，将帮助你最高效、最成功地学习这种语言。\n\
