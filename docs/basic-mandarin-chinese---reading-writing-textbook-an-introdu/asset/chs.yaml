  \n![images](img/img_p146.jpg)\n\n## 备注\n\n**A17-20.** 中文数字 `〇` `líng` “零”的写法比英语更圆；用阿拉伯数字\
  \ `0` 写会被认为是不正确的。`Líng` 也可以用汉字 `零` 写，但现在 `〇` 更加常见，特别是在写年份、房间号、电话号码和页码时。\n\n**A20.\
  \ 数字的大写。**（以下仅供参考；你现在不需要学习这些信息。）由于汉字 `一二三四五六七八九十` 非常简单，只由几笔组成，不诚实的人可能会尝试篡改它们，例如，增加两画将\
  \ `一` 变成 `三`，或增加一画将 `一` 变成 `十`。因此，为了防止篡改或混淆，并让数字在财务记录和货币上看起来更“正式”，数字通常写成更复杂的“大写”。如果你在中国大陆、台湾或香港开银行账户，你需要在取款单和其他正式表格上写这些数字的大写形式。大写的读音与普通形式相同。从\
  \ 1 到 10，100 和 1000 的大写形式如下：\n\n| 普通形式 | 大写 | | 普通形式 | 大写 |\n| :--- | :--- | :---\
