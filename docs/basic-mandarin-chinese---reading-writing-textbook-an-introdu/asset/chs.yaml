  \n# 注释\n\nA1. 在这个句子中，看短语 你同屋的名字“你的同屋的名字”。通常，说“你的同屋”你会说 你的同屋，所以为什么这里不是 你的同屋的名字？答案是，通常，中国人不喜欢连续出现几个“的”的声音，所以他们通常会删除最后一个之外的所有的。换句话说，我们可以说这个短语的深层结构原本是你的同屋的名字，但当它变成表层结构时，第一个的被删除了，所以短语变成了你同屋的名字。\n\
  \n\n\n\n\n### A3. 在`你的同屋是……？`中，句末的省略号（省略號）`shĕnglüèhào`（……）表示一个不完整的问题。英文翻译为“Your\
  \ roommate is…?”。在中文里，这种不完整的问题通常用于人们不想问得太直接（如“你的同屋是谁？”），但仍想以一种更“温柔”的方式，让对方处于一种几乎被迫完成你句子的境地中。对比\
  \ B3 中类似的用法。\n\n### A5. 注意这句话中 `叫` 的用法。`她的名字很难叫`（她的名字很难難）的字面意思是“Her name is hard\
  \ to call out”。在更地道的英语中，我们会说“Her name is hard to say”或“Her name is hard to pronounce”。这是因为对于普通话母语者来说，音节金香川\
  \ `Jīn Xiāngchuān` 连续读起来听起来并不好听（它们都是第一声，且都以鼻音结尾）。\n\n### A9. 看这一句：`台湾是不是中国的一省？`（台灣是不是中國的一省？）。字面意思是“Taiwan\
  \ is it or is it not China’s a province?”。在良好的英语中，我们当然会将其翻译为“Is Taiwan a province\
  \ of China?”\n\n### D1. 注意`我请我的同屋去广州，他不去`（我請我的同屋去廣州，他不去）中的`不去` 结构。在这里，`不去`意味着“didn’t\
  \ want to go”或“could’t go”。整个句子可以翻译为“I asked my roommate to go to Guangzhou, but\
  \ he didn’t want to go。（表示过去否定“didn’t”，会使用另一个词，我们将在 BMC—RW 2-4 中介绍。）\n\n# 第三部分\n\
