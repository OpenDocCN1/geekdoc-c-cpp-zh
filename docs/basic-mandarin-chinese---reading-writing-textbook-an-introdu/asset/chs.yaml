  \n![images](img/img_p324-1.jpg)\n\n# 笔记\n\n**A2A.** 从⋯⋯一直到⋯⋯ (`从⋯⋯一直到⋯⋯`) 是一个常用句型，意思是“从…一直到…”或“从…一直直到…”。\n\
  \n**A2B.** 1928 年，中华民国政府将首从北京迁到了南京。由于 `北京` 字面意思是“北方首都”，因此决定将名称 `北京` 改为 `Beiping`\
  \ 北平，意思是“北方的和平”。\n\n**A10.** 他不太清楚到什么地方去换钱 (`他不太清楚到什麼地方去換錢`) “He wasn’t very clear\
  \ about where he should go to change money.” 注意，状态动词 `清楚` 像这里一样可以跟一个从句。\n\n**B1.**\
  \ 观察钱海文在这里问了：和平饭店离这儿有多远？(`和平飯店離這兒有多遠？`) “Peace Hotel 离这里有多远?” 确保你理解并可以使用这个句型：\n\n\
  ![images](img/img_p324-2.jpg)\n\n“A 离 B 有多远？”\n\n**D1.** 注意间接问句中的问号前天有一个人问我和和平饭店在哪里？(`前天有一個人問我和平飯店在哪裏？`)\
  \ “The day before yesterday a person asked me where the Peace Hotel was.”汉语纯洁者可能认为这种标点符号用法不当，但事实是，汉语作者经常在这样的间接问句中使用问号。\n\
