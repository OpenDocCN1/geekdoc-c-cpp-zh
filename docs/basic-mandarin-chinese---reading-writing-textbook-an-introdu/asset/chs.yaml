  \ 叙述\n\n请阅读以下叙述，特别注意标点符号和整体结构。第一次阅读叙述时，请大声读出来；第二次默读并尝试逐渐加快阅读速度。始终思考你所读内容的含义。\n\n\
  ![images](img/img_p269.jpg)\n\n## 备注\n\n**A1A.** 如你所注意，到本课为止，中文字号再次缩小了。你需要习惯阅读各种字体和字号书写的中文，以及手写中文。\n\
  \n**A1B.** 统计中国县的总数并不容易，因为除了传统的县，“县 (縣)”一词还涵盖了所谓的自治县、县级市和其他等同县的行政区域。此外，总数每隔几年就会变化。但可以说中国有两千多个县。\n\
  \n**A4.** 那个工人现在是不是还在那家工厂工作？(那個工人現在是不是還在那家工廠工作？) 直译为：“That worker, is it or is it\
  \ not the case that he/she is now still working at that factory?” 用更流利的英语表达，我们可以说：“Is\
  \ that worker now still working at that factory?”\n\n**A5.** 一家五口 “all five of us\
  \ in our family” (lit. “whole family five members”)。数字“一”有时可以表示“整个”。其他例子还有一天 “the\
  \ whole day long”和一路 “the whole road—all along the way。”\n\n**B2.** 是男生多？是女生多？“Are\
  \ there more male students or female students?” (lit. “Is it that male students\
  \ are many? Is it that female students are many?”) 这是另一个带有隐含选择的选择疑问句（参见 4-3: B2B,\
  \ 4-4: B5）。\n\n**D1.** 开工厂 (開工廠) “operate a factory,” “run a factory.”\n\n**D2.**\
  \ 开工厂差不多一年半了 (開工廠差不多一年半了) “has been operating a factory for about a year and a half.”\
  \ 意思是高先生现在仍在经营工厂（或在本文写作时）。在表示时间持续的句子中，句末的助词`了` 表示动词动作已经持续了一段时间，并包含现在（参见 4-1: A5）。\n\
  \n# 第二部分\n\n## “你会说中文！”\n\n![images](img/img_p270.jpg)\n\n## 新字与新词\n\n![images](img/img_disc.jpg)\n\
  \n学习下面的六个汉字以及它们组成的常用词，仔细注意每个字的读音、含义和结构，以及字形相似的字。学习一个字后，翻到*练习册*相应章节，在练习纸上书写它，确保在朗声读出并思考其含义的同时，遵循正确的笔顺和方向。\n\
  \n| **199** | 会(會) | **huì** | 懂得，能够 |\n| :--- | :--- | :--- | :--- |\n| 简体形式的部首是\
