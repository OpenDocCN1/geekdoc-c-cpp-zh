  ## 阅读练习（简体字）\n\n![images](img/img_disc.jpg)\n\n现在请在句子、对话和叙述中练习阅读本课的新汉字和新词。务必参考本课末尾的注释，并利用随附的光盘片来听并练习正确的发音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些句子包含了本课的所有新汉字。第一次读句子时，特别注意对你来说是新的字和词，提醒自己它们的读音和含义。第二次读，目标是理解句子的整体意思。\n\
  \n一、你是你，我是我。\n二、请问，李先生，你是哪国人？\n三、李先生、林太太、谢小姐都不是中国人。\n四、你叫林国文，是不是？请问，你去哪国？\n五、我叫金山，他叫李文。\n\
  六、你叫李台生吗？你是台湾人吗？\n七、我们都是美国人。你呢？你也是美国人吗？\n八、请问，老高、小何他们都是北京人吗？\n九、我们不都是美国人。小高是，我不是。\n\
  十、王大海是美国人，也是中国人。\n\n### B. 对话 \n\n大声读出以下对话，包括说话者的名字或角色。如果可能，找一个或几个伙伴，每个人扮演一个角色。然后交换角色，这样你就可以练习读所有的行。\n\
