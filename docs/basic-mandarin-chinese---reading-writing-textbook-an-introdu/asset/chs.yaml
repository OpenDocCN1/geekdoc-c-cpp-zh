  \n### D. 叙述文\n\n读以下叙述文，特别注意标点符号和整体结构。第一次读这段叙述文时，请大声读出来；第二次，请默读并尝试逐渐加快阅读速度。始终要思考你所读内容的含义。\n\
  \n住在我们家后面的林老太太可真喜欢说话！上个星期日七点钟我去看她，她说她儿子现在在一个学校学日文｡她说她儿子是很好的儿子，也是很好的学生，日文差不多全会说了，日文的字也会写不少了｡。她还说她女儿也是好女儿，会说很多地方的话—台湾话、广东话、台山话、上海话都说得很好｡。差不多九点钟我说：“林老太太，对不起，我还有事儿，得走了，”不过她不要我走，她说她还有很多的话还没说｡。九点半我说：“林老太太，对不起，现在我真得走了，”不过林老太太还要说话！十点多钟她还要说话，我很不高兴，走了｡。在她家外面的大街上，她说请我下个星期日还来｡。有人说女人都很喜欢说话，我不知道这个话对不对，不过我知道林老太太这个人真的太喜欢说话了！\n\
