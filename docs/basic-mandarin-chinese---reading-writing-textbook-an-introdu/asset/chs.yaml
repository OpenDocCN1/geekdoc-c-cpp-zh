  \ |\n\n##  阅读练习（简体字）\n\n![images](img/img_disc.jpg)\n\n现在在句子、对话和叙述等上下文中练习本课的新字和新词。务必参考本课末尾的备注，并利用随附的光盘听听并练习正确的读音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些包含了本课的所有新汉字。第一次读句子时，特别关注对你来说是新的汉字和词，提醒它们的读音和含义。第二次，目标是理解句子的整体。\n\
  \n一、那个美国人会说中国话，可是不会写中国字。\n二、他中国话说得很好，不过中国字写得不太好，他还得学几年。\n三、你写的中文全对，你的中文写得真好！\n四、你说得对，我这儿真的有几百块钱，可是为什么全得给你呢？\n\
  五、我的朋友有的是男的，有的是女的。\n六、有的中国人在美国住了几十年，中国字差不多全忘了。\n七、有的人说中国话很难说，有的人说中国字很难写。你说呢？\n八、中国字看起来很好看，不过写起来不太好写。\n\
  九、老王会写几百个字，小何会写几十个，我会写几个。你呢？你会写几个？\n十、王大海说他得走了，好像他家里还有一点儿事。\n\n##### B. 对话\n\n\n\
  \n\n\n大声朗读以下对话，包括说话者的名字或角色。如果可能的话，找一个或几个几个同伴，由你们每个人扮演一个角色。然后交换角色，这样你就可以练习读所有的台词。\n\
  \n### 一、\n\n北京人：您会说中国话！\n美国人：会一点儿｡。\n北京人：您说得很好｡。是在哪儿学的？\n美国人：原来我在美国学过一点儿，现在在北京的一个学校学｡。\n\
  北京人：您会写中国字儿吗？\n美国人：我会几百个中国字｡有的会写，有的不会｡。\n北京人：您还会说什么话？\n美国人：我学过一点儿广东话，可是现在全忘了｡。\n\
  \n### 二、\n\n李明山：大安，这个地方是不是你的学校？\n何大安：对，这就是台北美国学校｡。\n李明山：这里的学生都会中文吗？\n何大安：有的会说，也会写；有的会说，不会写；还有的不会说也不会写｡。\n\
