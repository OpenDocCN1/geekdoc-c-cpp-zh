  \n首先，要意识到这里 (這裏)、那里 (那裏) 和 哪里 (哪裏) 在标准书面中文中比它们的北方口语形式这儿 (這兒)、那儿 (那兒) 和 哪儿 (哪兒) 得多。\n\
  \n其次，记住在旧文献中——即使在今天某些人的写作中——字符 `那` 也可以代表 `那` 或 `哪`。如果这句话写成 我不知道那个东西在那里 (我不知道那個東西在那裏)，你就应该考虑过\
