  \n![images](img/img_p88.jpg)\n\n## 注释\n\n**A8.** 句语 `你先请坐` (` 你先請坐 `) 在这里的意思是“你先坐（一会儿，在你做其他需要做的事情之前）”。\n\
  \n**A9.** 在从句 `我请你去香港` (` 我請你去香港 `) 中，“我邀请你去香港”，动词 `请` (` 請 `) 用的是它的基本含义“邀请”。\n\n\
  **B1.** 在这段对话的第三行中，`……` 是一个中文标点符号，叫做`省略号` (` 省略號 `) shĕnglüèhào。在英语中这可以被称为“ellipsis\
  \ mark”。这个标点符号表示句子突然中断了，或者某部分被省略了。推测在这一行中，说话的人——刚刚说了“我们都老了”——本想说些类似“我们很快就要死了”的话，但在最后一刻决定省略这个比较好（因为在中国传统的文化中，谈论死亡被认为是非常不吉利的）。\n\
  \n**D1.** 正如我们在上面的注释 A9 中所示，除了“请”的意思外，`请` (` 請 `) 也可以用于它的基本含义“邀请”。这就是第一段叙述中两个 `请`\
  \ (` 請 `) 的用法方式。所以 `请她坐很难` (` 請她坐很難 `) 可以翻译为“邀请她坐是很困难的”，而 `请王先生坐不难` (` 請王先生坐很難 `)\
  \ 可以翻译为“邀请王先生坐并不难”。\n\n**D2.** 注意在 `太忙了，不去了吗？` (` 太忙了，不去了嗎？`) 中，主语是省略的 `你们` (` 你們\
  \ $) “你们”。\n\n# 第二单元\n\n## 介绍\n\n![images](img/img_p89.jpg)\n\n## 教学目标\n\n一旦掌握了本单元，你将能够：\n\
