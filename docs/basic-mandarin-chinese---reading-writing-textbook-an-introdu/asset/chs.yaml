  \ 興 字 學\n十二、兒 儿 幾 幾\n十三、兒 儿 九 九\n十四、兒 幾 幾兒 儿\n\n### D. 敘述\n\n讀以下敘述，特別注意標點符號和整體結構。第一次讀敘述時，大聲讀出；第二次，默讀，並嘗試逐漸加快你的閱讀速度。始終思考你所讀內容的意思。\n\
  \n一、\n大學在台灣是很好的大學，叫「台大」。台大在台北市。這個大學很大，有差不多萬學生，有千多位老師。台大的學生都很好，在那裡找老師也不難。我是台大的學生，這是我在那裡的第一年。姐姐也是台大的學生。\n\
  \n二、\n那個大學生我，在哪兒學中文？我知道北大學很好。那裡有很多中國學生，美國學生也不少。那裡的老師也都好。學生可以在北大住，也可以在那裡吃飯，都不貴。住一個月錢。中文很，可是是要學，在大學比較好。這是北京大學王國片。你明天可以去北大找老師問問。\n\
  \n### E. 補充：一句俗語\n\n大聲讀出以下俗語，它在台灣的 60 年代很流行。\n\n來、來、台大，去、去、美國。\n\n## 注釋\n\n**A7.**\
  \ 他是我台大的同學（他是台大的同學）“He’s a classmate of mine at Taiwan University.”\n\n**A9.** 學中文的女學生多，男學生少（學中文的女學生多，男學生少）“There\
  \ are many female students studying Chinese, but few male students”. In the case\
  \ of stark contrasting clauses like this, in Chinese it’s often not necessary to\
  \ have 可是（不過）。 However, a “but” can sometimes be added to the English to make the\
  \ translation smoother.\n\n**B3.** 我是美國來的大學（我是美國的大學生）“I’m a college student from\
  \ America.”\n\n**D2.** 你明天可以去北大找老師問問（你明天可以去北大找老師問問）“Tomorrow you can go to Peking\
  \ University and look for Teacher Wang and ask.” Regarding the verb duplication\
  \ of `問問` (`問問`), as was mentioned in BMC–SL 3-3: 5a, some one-syllable verbs are\
  \ frequently reduplicated (i.e., repeated) so as to give a relaxed, casual sense\
  \ to the verb and make the sentence they occur in smoother and less abrupt. The\
  \ meaning is the same as when they are not reduplicated. Note that `問問` (`問問`) is\
  \ pronounced with a neutral tone on the second syllable as `wènwen`, not as `wènwèn`.\n\
  \n**E.** This saying was popular in Taiwan in the 1960s, a time when modern economic\
  \ development was just beginning and many people wished to go to the U.S. for graduate\
  \ study. The idea was that if you studied and did well on the college exam, you\
  \ could “come to Taiwan” and then, after graduation, you could “go to America” and,\
  \ perhaps, find a well-paying job.\n\n\n\n\n\n| 159 | 边(邊) | `biān` | 边 |\n\n部首是\
