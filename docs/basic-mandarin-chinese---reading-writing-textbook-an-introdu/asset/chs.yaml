  12. 二十点\n13. 十八点四十\n14. 四个钟头\n15. 六个半钟头\n16. 半个钟头\n17. 一个半钟头\n18. 两个半钟头\n19. 二十四个钟头\n\
  20. 七十二个钟头\n\n### B. 句子\n\n大声读出每一个句子，这些句子包含了本课的所有新汉字。第一次读句子时，特别关注对你来说是新的汉字和单词，提醒自己它们的读音和意思。第二次读，目标是理解句子的整体意思。\n\
  \n一、这位先生，请问，几点钟了？\n二、九点一刻了，我不坐了，我先走了。\n三、差一刻六点了，我们走吧！\n四、别太高兴，这个钟很贵，一千六百块钱！\n五、我的四位老师，一半是男的，一半是女的。\n\
  六、三个是男生，三个是女生，一半一半。\n七、你也去成都吗？我坐三点的，你坐几点的？\n八、五点钟去台北的那位老先生姓文，不姓王。\n九、名字叫李京生的那个女的是小李的姐姐，不是我的姐姐。\n\
  十、没带钱的那个男生是王大海，不是我！\n\n### C. 对话\n\n大声读出以下对话，包括说话者的名字或角色。如果可能，请找一个或多个伙伴，每个人扮演一个角色。然后交换角色，这样你就可以练习读所有的词。\n\
  \n一、\n老李：几点了？\n老谢：十一点三刻了。\n老李：十一点三刻了吗？！\n老谢：不对，不对。十点三刻。\n\n二、\n美国人：上海，两个人。多少钱？几个钟头？\n\
  中国人：一个人一百五十五五。去上海⋯⋯差不多一个半钟头。\n美国人：半个钟头？\n中国人：不是半个钟头，是一个半钟头。\n美国人：这是钱。谢谢您！\n\n三、\n\
  美国人：天津，十点半的。多少钱？\n中国人：十一块五。\n美国人：好，这是钱，十一块五。去天津几个钟头？\n中国人：差不多两个半钟头。\n美国人：好，谢谢您！\n\
