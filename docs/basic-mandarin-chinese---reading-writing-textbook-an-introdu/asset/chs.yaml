  \n一、有一位老先生姓钱。他是北方人，可是说的是南方话。我前天问他天安门怎么走？他先说得往东走，后来又说不对，得往西走。我问他天安门离北京饭店远不远？他说天安门离北京饭店很近，可是又说北京饭店离天安门很远！钱老先生大概忘了天安门在哪了吧。\n\
  \n二、我家住在北京西长安街 55 号，离天安门、北京饭店都很近。我家后面是南长街。从南长街往北走不远有一家饭店名字叫海南大饭店。我觉得那家饭店还可以，不太贵，他们的海南饭也。我很喜欢和我们公司的同事在那家饭店吃中饭。你的美国朋友谢小姐可以住在那里。要是谢小姐不要住那家，南长街还有其他的饭店可以去看看。\n\
