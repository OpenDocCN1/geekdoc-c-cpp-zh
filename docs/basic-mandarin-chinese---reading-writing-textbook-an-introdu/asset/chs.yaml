  \n一、\n边外山：这边儿的位子上上有东西，我们去右边儿坐吧。\n金文明：右边儿位子上也有东西。我们去哪儿呢？\n边外山：里边儿的位子上好像没有东西，我们去里边儿坐吧。\n\
  \n\n\n\n\n上个月我的同事老金第一次去广州。在广州他先去了中大，就是中山大学。那边的学生很多，差不多八万四千人，也有不少美国学生。老师有八千一百多位。中大里边、外边都有很多饭店可以住，不过外边的饭店比较贵。吃饭也不难，可以在大学里面吃，也可以在外面吃，可是在中大里面吃比较好。老金很高兴他去了广州，也很高兴他住在中山大学的饭店里。下个月十五号他要第二次去广州，这次他的太太也去。\n\
