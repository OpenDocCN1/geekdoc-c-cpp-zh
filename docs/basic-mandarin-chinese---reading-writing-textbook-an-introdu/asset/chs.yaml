  \ 分 万 万 万\n七、分 万 分 万 分 万\n\n#### D. 叙述\n\n阅读下列叙述，特别注意标点符号和整体结构。第一次读叙述时，大声读出来；第二次，静默读并尝试逐渐增加阅读速度。始终思考你所读内容的含义。\n\
  \n一、前天有一个人问我和和平饭店在哪里？我因为不是本地人，所以我说对不起，我也不清楚。今天又有两个人问我和和平饭店在哪里？为什么这么多人要找这家饭店呢？\n\n\
