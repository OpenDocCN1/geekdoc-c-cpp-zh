  \ `难` 字区别很大。一个是“困难”，另一个是“不好……”。比较 `难吃 (難吃)`（难吃，味道差）和 `难看 (難看)`（不好看，外丑）。\n\n**A6B.**\
  \ 你觉得呢？（你覺得呢？）“你觉得呢？”（字面：你感觉……？”）。\n\n**A9.** 这一行来自一个标牌，是书面语。在口语中，会说八点开门，五点半关门（八點開門，五點半關門）。\n\
