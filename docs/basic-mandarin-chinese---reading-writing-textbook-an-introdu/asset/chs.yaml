  \ |\n\n### 朗练习（简体字）\n![images](img/img_disc.jpg)\n\n现在在语境、句子、对话和叙述中练习本课的新字和新词。请务必参考本课末的注释，并利用随附的音频光片来听并练习正确的发音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些包含了本课的所有新字。第一次读句子时，特别关注对你来说是新的字和词，提醒自己它们的读音和意思。第二次，目标是理解句子的整体意思。\n\
  \n一、那次我太忙，没去北京，这次我要去。\n二、请问，这是你第几次来中国？你要住几天？\n三、她的第一个先生是台湾人，第二个先生是香港人。\n四、来、来、来，公司开门了，八点就开了。今天第一天开，不要走！\n\
  五、我问，他姓什么，叫什么？他要台北住几天？\n六、你要带他吗？\n七、我要坐三点的，去南京。您呢？您坐几点的？\n八、钱先生住广东大街，钱太太住四川路。\n\
