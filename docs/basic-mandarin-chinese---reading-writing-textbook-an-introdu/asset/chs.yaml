  \n# 注释\n\n**A1.** 就像英文可以用不同的字体打印一样中文也可以用多种字体打印。从本课开始，中文文本以所谓的“宋体”打印，这与你目前看到的“楷体”略有不同。对你来说，习惯看到不同字体的汉字很重要。虽然新字体起初看起来陌生，但你很快就会习惯。\n\
  \n**A2.** 我们可不可以去 (我們可不可以去) “Can we go…?”是我们可以不可以去 (我們可以不可以去)的省略形式，意思相同。复习 `BMC–SL\
  \ 5-1` 中的语法笔记 8A，关于在正反疑问句肯定部分省略双节动词第二个音节的内容。\n\n**A3.** 恰好在这个句子使用了正反疑问句的完整形式：你知道不知道\
  \ “Do you know…?” 然而，说话者完全也可以问你知不知道，意思完全一样。\n\n**B1.** 先生贵姓？(先生貴姓？) “Sir, what is\
  \ your honorable surname?”请注意，这个问题是针对说话者想要了解姓氏的人；这并不是针对第三人的。在非常礼貌的风格中，倾向于避免使用“你”或“您”等代词，而是提到人的头衔或角色。因此，在中文里，问一些直译成英文为“这是校长的第一次美国之旅吗？”或“经理有什么地方需要我帮忙的吗？”的问题是非常正常的。\n\
  \n**B2A.** 注意，在这一段对话的书面记录中，使用了“女”和“男”来表示谁在说话。这些是书面语的额外示例（参考 `BMC–RW 4-2: A1`）。在口语中，“男”和“女”永远不会这样单独使用。相反，人们说“男的”或“男人”表示“man”，说“女的”或“女人”表示“woman”。\n\
  \n**B2B.** 我知道了 “Now I know.” 最初，男人不知道女士在找哪一个“王女士”，但现在知道了。\n\n**D1.** 可是，老万明天很忙，他就不来了\
  \ (可是，老萬明天很忙，他就不來了) “But Old Wan is busy tomorrow, so he’s not coming.”\n\n**D2.**\
  \ 要是我问她，她也不知道，我就不去了 (要是我問她，她也不知道，我就不去了) “If I ask her, and if she doesn’t know either,\
