  \n现在在语境中练习这些新汉字和新词。请务必参考本课结尾的注释，并利用随附的光盘来听并练习正确的发音、断句和语调。\n\n\n\n\n\n## A1A. 关于中文字体的说明。\n\
  \n为了帮助你熟练阅读印刷体中文，本教材的设计目的是让你接触到几种不同的印刷字体。A、B 单元和 1-4 单元的阅读练习采用了楷体，这是最接近手写风格的字体。从第\
  \ 5 单元开始，开始使用了宋体——这是书籍和期刊物中最常用的字体。\n\n在每课开头的“生字与词汇”部分，六个新生字使用了较大号的楷体，其余所有地方均使用较小号的宋体；宋体也用于每课末“注释”中的汉字。你可能会注意到这些不同字体在某些笔画的写法上会有细微差别，但请放心，你将逐渐适应它们的。虽然你需要能够识别各种字体印刷的汉字，但对于你自己的手写字，你应该遵循随附的*《基础汉语基础读写练习》*中汉字练习表上的模型。\n\
  \n## A1B. 关于中文书面语变体的说明。\n\n鉴于中国人口众多、地域广阔，以及不同汉语语社会之间存在巨大的多样性，中文书面语出现大量的变体是可以预料的。不同地区的母语者有时会使用不同的词汇和语法，并可能有不同的风格偏好。本教材始终提供至少一种可接受的替代方案，但如果你遇到变体，也不要感到惊讶。对你来说，最好的做法是学习至少一种正确的表达或写作方式，然后仔细观察母语者在社会中是如何使用中文的。\n\
  \n## B7.\n\n中国大城市的电话号码为八位数。在小城市和农村，电话号码可能少于八位数。手机号码通常为十位数。\n\n## B10.\n\n在正式书写中（如名片或信头），电话号码可以使用中文数字表示，如此处所示。然而，电话号码也像英语一样常用阿拉伯数字书写，但通常不使用任何连字符，例如使用\
  \ `42235151` 而不是 `4223-5151`。缺少连字符似乎并没有困扰中国人，他们习惯于阅读和记忆长数字序列，但这往往会给美国人带来困难。\n\n\
