  \ |\n| 要 | **yào** | 想要 [**AV**] |\n\n## 阅读练习（简体字）![Images/img_disc.jpg)\n\n现在在句子、对话和叙述中练习本课的新字和新词。请务必参考本课末尾的注释，并利用随附的音频光盘听听并练习正确的发音、断句和声调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些包含了本课所有的新字。第一次读句子时，特别注意对你来说的新字和词，记住它们的读音和意义。第二次读，目标是理解句子的整体意思。\n\
  \n一、那个东西我先去找一下儿，要是没有，我们可以在里面问一下儿。\n二、坐在高先生左边的小姐是谁？高太太在哪儿？\n三、你要是找我们，我们不是在上面，就是在下面。\n\
  四、我上个星期去西安了，这个星期要去成都，下个星期要回天津。\n五、我不知道这个公司里头有多少人，可是我知道不少。\n六、你的名片就在你左边的那个位子上。七、这个饭店里有多少工人？好像今天有很多没来，是不是？\n\
  八、那个大钟下头是什么东西？\n九、那三个人里头一个是我的老师，一个是我的同学，一个是我的学生。\n十、王大海在里边找，在外边找，在上边找，在下边找，在左边找，在右边找，可是都没有。\n\
