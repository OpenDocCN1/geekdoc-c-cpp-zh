  六、年级，年纪，年级，年纪\n七、欢 欢 欢 难 难 难\n八、欢 难 难 欢 欢 难 欢\n\n![images](img/img_p231-2.jpg)\n\
  台湾书店\n\n#### D. 叙述\n\n读以下叙述，特别注意标点符号和整体结构。第一次读叙述时，大声读出来；第二次时，默读并尝试逐渐加快你的阅读速度。始终思考你所读内容的意思。\n\
