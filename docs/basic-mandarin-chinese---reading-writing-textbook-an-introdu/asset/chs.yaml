  \n# 台湾的初中\n\n## 阅读练习（简体字）\n![images](img/img_disc.jpg)\n\n现在请在句子、对话和叙述的语境中练习本课的新字和词汇。请务必参考本课末尾的注释，并利用随附的音频光片听并练习正确的发音、断句和语调。\n\
  \n##### A. 句子\n\n大声读出每一个句子，这些句子包含了本课的所有生字。第一次读句子时，特别关注对你来说是新的字和词，提醒自己它们的发音和意思。第二次读，目标是理解句子的整体意思。\n\
  \n一、我喜欢北京，可是我的朋友都比较喜欢上海｡\n二、我们要是没事儿，喜欢去北京饭店吃饭，那儿的饭真好吃｡\n三、我有两个高中同学，一个叫王安，一个叫万安，他们都是我很好的朋友｡\n\
  四、朋友，你喜欢吃中国饭吗？里边的东西可好吃了，来吧！\n五、要是好吃你就多吃一点儿，要是不好吃你就少吃一点儿｡\n六、金山大一那年，没有朋友｡他今年大四，朋友可真多！\n\
  七、明年我要上大二，我的女朋友要上大三｡\n八、这位同学，你多大了？你上几年级？\n九、我的同屋是大一的学生，她的男朋友是大四的学生｡\n十、大海上大学四年级，文文上高中三年级｡\n\
  \n##### B. 对话\n\n大声读出以下对话，包括说话者的名字或角色。如果可能，找一个或几位伙伴，每个人扮演一个角色。然后交换角色，这样你就可以练习读所有的台词。\n\
  \n一、\n美国太太 ：小朋友，你叫什么名字？\n中国小朋友 ：我叫小明｡\n美国太太 ：小明，你几岁了？\n中国小朋友 ：六岁了｡\n美国太太 ：你上小学了吧？\n\
  中国小朋友 ：对，上一年级了｡\n美国太太 ：来，这是你的｡你喜欢不喜欢？\n中国小朋友 ：我很喜欢，谢谢！真好吃！\n\n二、\n男：你有没有男朋友？\n女：我有男的朋友，可是没有男朋友｡\n\
  男：你喜欢我吗？\n女：你别问我这个！\n\n![images](img/img_p231-1.jpg)\n“双喜”\n\n#### C. 字形辨析\n\n仔细区分以下相似的字，大声读出每一个字并思考它的意思。\n\
