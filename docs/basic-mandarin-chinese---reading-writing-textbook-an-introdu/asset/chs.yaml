  \n![images](img/img_p118-2.jpg)\n\n![images](img/img_p119.jpg)\n\n台北国立师范大学游泳馆的入口。注意，`游泳馆\
  \ (游泳館)` `yóuyŏngguăn` “natatorium”一词在这里是从右向左书写的。\n\n## Note 事项\n\n**A3.** 李小姐是哪个公司的？她是不是中美公司的？(李小姐是哪個公司的？她是不是中美公司的？)\
  \ 字面意思是“Ms. Li is one from which company? Is she one from Zhongmei Company?” 也许，在这个句子的深层结构中，有一个表示“人”或“员工”的名词，所以这个句子最初可能可能是“李小姐是来自哪家公司的员工？她是中美公司的员工吗？”然而，这个名词在表层结构中被删除了，只剩下“的”表示“来自……的”。在更地道的英语中，我们可以将这两个问题翻译为“Ms.\
  \ Li is with which company? Is she with Zhongmei Company?” 除了“with”，你也可以说“from”：“Ms.\
  \ Li is from which company? Is she from Zhongmei Company?”\n\n**A5. 汉语中外来词的字体表示。**\
  \ 这个句子对你来说应该理解：这是美国 IBM 公司的 CEO (這是美國 IBM 公司的 CEO) “This is the CEO of the American\
  \ IBM company.” 现代汉语（由为城市年轻人在报纸、杂志、菜单、标牌、电子邮件、博客、短信等处书写的汉语）充满了来自英语和其他语言的借用词，这些词用罗马字母表示，有时会与阿拉伯数字结合。这里是一些常见的例子：CD,\
  \ DIY, DNA, DVD, ID, IQ, IT, KTV, MP3, MTV, OK, PVC。某些术语可以单独出现，但另一些可能与汉字结合，例如：B\
  \ 型 `B xíng` “blood type B”、3D 银幕 (3D 銀幕) `3D yínmù` “3D screen”、维生素 C (維生素 C) `wéishēngsù\
  \ C` “vitamin C。” 通常只使用大写字母，但也有常见的小写借用词（例如：n 次 `n cì` “无限）。注意，当借入汉语时，每个罗马字母或数字被视为一个独立的单位，等同于一个汉字。显然，这些借用词都与现代受外国影响的社会有关，而不是传统的中国文化。出于因此，政府部门、汉语教师和其他纯洁者经常批评这种用法。然而，事实是，大多数汉语作者很少在意它们，并继续使用这些外来词。我们确实不鼓励你在自己的书面（或口语）汉语中频繁使用这些借用词。然而，由于本教科书试图展示现今实际使用的书面汉语，我们在阅读练习中确实包含了这类借用词。\n\
  \n**A6.** 这是我们公司的谢先生 (這是我們公司的謝先生) “This is Mr. Xie from our company.”\n\n**A10.**\
  \ 请你带我们去你的公司 (請你帶我們去你的公司) “Please take us to your company.” 注意，动词带（帶）可以表示带上或带来*东西*，或者像这里一样，带上*人*。\n\
  \n**B1.** 您带名片了吗？(您帶名片了嗎？) “Did you bring a name card?”\n\n**B2.** 查看中文说话者的最后一句：我们公司叫“太山公司”\
  \ (我們公司叫 太山公司) “Our company is called ‘Taishan Company.’” 在这句话中，我们公司（我們公司）意思是“our\
  \ company”，但为什么我们（我們）和公司之间没有“的”呢？答案是，虽然说我们的公司（我們的公司）在语法上没有错误，但在汉语中，当代词和名词之间有特别紧密的联系时，特别是涉及高频短语时，“的”经常会被省略。这适用于身体部位（“我的手”）、亲属（“我的母亲”）以及——正如我们在这里看到的——对于具有强烈归属感的机构（“我们的公司”、“我们的学校”等）。此外，注意说话者说的不是“我的公司”，而是“我们的公司”。这与中国社会中强烈的群体认同感有关，而与西方社会更具个人化的观点相比。\n\
  \n**B3.** 你们公司 (你們公司) “your company.” 在语法上，这就像上面 B2 中的我们公司（我們公司）一样。\n\n**D1.** 老王也是美山公司的，小何也是我们公司的\
  \ (老王也是美山公司的，小何也是我們公司的) “Old Wang is also with Meishan Company, and Little He is\
  \ also with Little Company.”\n\n**D2.** 老王也是美山公司的，小何也是我们公司的 (老王也是美山公司的，小何也是我們公司的)\
  \ “Old Wang is also with Meishan Company, and Little He is also with Little Company.”\n\
