  ## 笔记\n\n**A1.** `65 路`公共汽车是从北京西站到动物园的 (65 路公共汽車是從北京西站到動物園的) “Public bus number\
  \ 65 is from Beijing West Railway Station to Zoo.” 这里的模式 `是⋯⋯的` 强调“事实就是如此”。虽然后面的句子通常不会这样说，但前一个句子的底层结构可以分析为：`65\
  \ 路公共汽车是从北京西站到动物园的公共汽车`(65 路公共汽車是從北京西站到動物園的公共汽車) “Public bus number 65 is a public\
  \ bus that from Beijing West Railway Station goes to Zoo.”\n\n**A3.** `公车` (“public\
  \ bus”）是 `汽车` 的常用缩写。\n\n**B2.** `不谢`（“You’re welcome”）是一种常用的回复。\n\n**D1.** `有时候他觉得没有好`（時候他覺得沒有好）“Sometimes\
  \ he feels people aren’t good.”模式 `没有 B` 意味着“A is/are not B.”句子的核心是 `没有好` “People’t\
  \ have animals” (lit. “People’t have good”).你将在 BMC 中学习更多这种模式。\n\n**D2.** `今天六点半，我的儿子就要去`（今天六點半，我的兒子就要要去）“Today\
  \ at 6:30, my son wanted to go.” `就` 意味着“as early as”时间。\n\n第 3 部分：公交与香山（续）\n\n\
