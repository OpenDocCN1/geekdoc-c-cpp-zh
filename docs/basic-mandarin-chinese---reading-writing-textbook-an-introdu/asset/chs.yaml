  九、今天是六月十三号星期五。十三号星期五不好吗?\n十、王大地上个月去了河南，这个月去湖北，明年二月去四川。\n\n### C. 对话\n大声读出以下对话，包括说话者的名字或角色。如果可能，找一个或几个伙伴，你们每个人扮演一个角色。然后交换角色，这样你就能练习读所有的句子。\n\
  \n一、\n安先生：何小姐，你好！\n何小姐：安先生，你好！你这个星期不去台南吗？\n安先生：六号是我的生日，我就不去了。\n何小姐：六号？明天就是六号。那，明天你多大了？\n\
  安先生：我明天三十岁了，老了！\n\n二、\n男生：老师，请问，这个中文叫什么？\n老师：这个中文叫“钟”。\n男生：那个中文叫什么？叫“门”，是吧？\n老师：对，那个就叫“门”。中文不难吧？\n\
