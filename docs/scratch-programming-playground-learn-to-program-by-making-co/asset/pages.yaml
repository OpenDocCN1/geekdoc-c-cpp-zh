  md: '# VERSION 2.0:

    TWO-PLAYER MODE


    Now that the basic maze game is working, you can do some iterative development
    and add small improvements one at a time. Iterative development helps you avoid
    trying to make a game that is too large for you to finish.


    In version 2.0 of Maze Runner, you''ll add a second player. The two players will
    race against another. The first player starts at the bottom and races to the top;
    the second player races from the top to the bottom. Because they both must travel
    the same path, the distance for each is the same.


