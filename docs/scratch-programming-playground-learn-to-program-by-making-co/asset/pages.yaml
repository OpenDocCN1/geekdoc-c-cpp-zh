  md: '# VERSION 2.0: LIMITED AMMO


    Once you get the hang of the game, Asteroid Breaker can become too easy. The one
    feature that makes it easy is that you can fire as fast as you can press the spacebar.
    This action lets the player fire indiscriminately instead of carefully aiming
    at the asteroids. But we can change that behavior by adding a new Energy variable.
    Firing an energy blast will reduce this variable by 1 each time. If the Energy
    variable is 0, the spaceship can''t fire. The Energy variable will increase slowly
    over time, but it forces the player to carefully aim their shots and not waste
    them.


