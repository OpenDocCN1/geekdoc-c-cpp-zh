  md: '# VERSION 3.0: TRAPS


    After you''ve played Maze Runner against another player a few times, running through
    the mazes can become too easy. Let''s make Maze Runner a bit more difficult by
    adding spike traps. The spike traps will shoot out spikes and retract them. If
    a player touches the trap while the spikes are out, the player will slow down.
    This gives the other player time to race ahead!


    # Draw a New Sprite for the Traps


    Click the Paint new sprite button next to New sprite to draw a new sprite. This
    sprite will have two different costumes that we draw: one costume with the spikes
    retracted and another with the spikes out. But don''t worry, the spike trap drawings
    are simple. Just click the Line tool and the color black to draw a simple line,
    which is what the spike trap looks like when the spikes are retracted. Rename
    this costume trap off.


