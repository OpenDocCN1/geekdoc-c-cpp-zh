- img_proc: true
  md: "quickly as possible instead of playing it safe. Click the Paint new sprite\
    \ button, and draw the text Time's Up in the Paint Editor. Mine looks like this:\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_276_0.png)\n\nRename the sprite Time's\
    \ Up. Then create a For all sprites variable named Timer, and add the following\
    \ code.\n\n```\nwhen clicked\nhide\nset Timer to 45\nrepeat until <Timer = 0>\n\
    \  wait 1 secs\nchange Timer by -1\nshow\nstop all\n```\n\nThis code gives the\
    \ player 45 seconds to collect as many\\apples as possible while trying to avoid\
    \ the crabs who will\nsteal one. When the Timer variable reaches 0, the Time's\
    \ Up\\sprite will appear and the game will end.\n\nNow the Platformer game is\
    \ ready for final testing!"
