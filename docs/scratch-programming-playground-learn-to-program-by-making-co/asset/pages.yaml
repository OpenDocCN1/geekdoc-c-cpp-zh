  md: 'When the White Fade Out sprite receives the end game message, it moves itself
    to the origin at the x- and y-coordinates (0, 0). Because the sprite is the same
    size as the Stage (480 pixels wide, 360 pixels tall), putting it at the origin
    makes it completely cover the Stage. The **go to front** block also places it
    in front of every other sprite. This makes sure that all the other sprites are
    behind it.


    Before showing itself, the White Fade Out sets its ghost effect to 100, making
    it completely invisible. Then the **repeat** loop decreases the ghost effect by
    10 times. The White Fade Out sprite gradually becomes more visible, and the white
    color slowly covers everything on the Stage.


    If the Score variable is higher than the High Score variable, the High Score variable
    is updated. After a short, 1 second delay, the White Fade Out sprite broadcasts
    the start screen message. The White Fade Out sprite **hides itself**, the Stage
    goes back to the start screen backdrop, and the Begin Button sprite shows itself.
    The game looks like it did when the player clicked the green flag, but the High
    Score variable is set to the highest score achieved so far.


