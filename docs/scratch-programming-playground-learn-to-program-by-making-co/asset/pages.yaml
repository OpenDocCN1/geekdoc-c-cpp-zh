    The original Body sprite code runs under the green flag clicked in script ①. As
    the Head sprite moves over the Stage, the Body sprite creates a trail of Body
    clones in its path.


    The Body clones run under when I start as a clone in script ②. When the Body clone
    is first created, it points in a random direction. The pick 0 to 3 * 90 block
    makes the Body clone face 0, 90, 180, or 270 degrees. This rotation makes the
    body segments look slightly different.


    The clones eventually need to delete themselves from the Stage so that the snake
    doesn''t keep growing longer. So each clone waits for a short time based on the
    Score variable in the wait Score / 5 secs block before deleting itself. Every
    clone waits this amount of time, so the first Body clones made are deleted.


    Eating apples increases the Score variable. As the Score variable increases, the
    amount of time a Body clone waits before deleting itself also increases. This
    longer wait makes the snake look longer, because more Body clones remain on the
    Stage. The more apples the snake eats, the longer the snake gets.


    When Score is set to 0, the wait is 0/5 seconds, or 0 seconds. When Score is set
    to 1, the wait is 1/5, or 0.2 seconds. When Score is set to 2, the wait is 2/5,
    or 0.4 seconds. Each point added to Score adds another 0.2 seconds of wait time,
    resulting in a longer and longer snake. As the snake gets longer, the difficulty
    of the game really scales up!'
