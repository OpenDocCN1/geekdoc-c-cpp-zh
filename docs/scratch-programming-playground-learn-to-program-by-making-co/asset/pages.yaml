  md: '# SHOWING OFF YOUR PROGRAMS


    When you’re logged in to your Scratch account, click the Share button at the top-right
    corner of the editor to let other Scratchers see your program. They’ll be able
    to play your game and leave comments. If Scratchers enjoy playing the game, they
    can Like and Favor your program.


    Once you''ve finished a project, you can also add it to the Scratch Programming
    studio. This features projects and remixes you and other readers have made. Once
    you''ve shared your project in Scratch, copy the URL and paste it into the text
    field, and click Add by URL. Now other readers will be able to view your game
    in the studio!


    Don’t worry if you think your game isn''t good enough. Everyone begins their coding
    journey with simple games. Most people on the Scratch website are beginners, too.
    Over 11 million people have shared their programs on the Scratch website, so don’t
    fret if yours doesn’t get many views. Games can be difficult to find with so many
    available on the site!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_36_0.png)


    # GETTING STARTED


    Becoming a super programmer isn’t about knowing all the answers; it’s knowing
    how to find answers. You can follow the steps for the projects in this book, but
    you might have questions of your own.'
