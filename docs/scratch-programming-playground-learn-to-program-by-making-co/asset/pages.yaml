    # # EXPLORE: ROTATION STYLES


    The rotation style sets how the sprite looks when it changes direction. The three
    rotation styles are all around, left-right, and don''t rotate.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_122_0.png)


    When a sprite is set to all around, it will face exactly where its direction points.
    But this won''t work for a side-view game (like the Basketball game in Chapter
    4), because the sprite will be upside down when its direction faces left. Instead,
    for these games you''ll use the left-right rotation style. The sprite will face
    only 90 degrees (right) or -90 degrees (left), whichever is closest to the sprite''s
    direction. If you don''t want the sprite to rotate at all, even as its direction
    changes, set the rotation style to don''t rotate.'
