  md: '![](img/44bc3b30bef7ae1ad43f0775f36b6931_52_0.png)


    Before you run the code, let''s talk through how it works. When you click the
    green flag in script, the Drawing sprite runs the clear block to clear away any
    pen drawing already on the Stage. Then the script runs the pen block: as the sprite
    moves around, it draws a line on the Stage.


    To better understand what the pen down block does, imagine drawing a marker on
    a piece of paper while you walk around it: a line would be drawn following you!
    The drawing dot goes to Dot 1, puts its pen down, goes to Dot 2, and then goes
    to Dot 3. Next, the change pen color by 10 block changes the colors slightly.
    (You can change this number to make the colors faster.) At the same time, Dot
    1, Dot 2, and Dot 3 sprites continue to move around on their own. So the V line
    that the Drawing sprite draws also moves.


    Script is a lot simpler to understand. Code waits 10 seconds and then clears the
    screen of any marks made by the Pen blocks. Now the Stage won''t become overcrowded
    with rainbow lines.


    > SAVE POINT\Click the green flag to test the code so far. You should see a flying
    rainbow V move across the Stage. Then, every 10 seconds, the rainbows clear. Click
    the red stop sign and save your program!'
