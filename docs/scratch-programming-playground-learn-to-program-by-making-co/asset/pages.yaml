    next to Energy is checked (just like the checkbox for Score is checked) so that
    it will appear on the Stage.


    The Energy variable will start at 10 at the beginning of the game and then decrease
    by 1 each time the player fires an energy blast. The player should be able to
    fire only if the Energy variable is larger than 0.


