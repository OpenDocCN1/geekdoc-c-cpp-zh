    # 6. Create the Hitbox Sprite


    Now let''s think about how to create code that determines whether or not the player
    makes a basket. We could write a program that checks whether the basketball is
    simply touching the hoop. The hoop is so wide, just the edges of the basketball
    touching the hoop would count as a basket. We want the basket to count only if
    the basketball goes through the middle of the hoop. We''ll have to think of a
    better fix.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_0.png)


    Instead, you can create a hitbox. A hitbox is a game-design term for a rectangular
    area that determines whether two game objects have collided with each other. We''ll
    make a hitbox sprite. Create a new sprite by clicking the Paint new sprite button.
    Draw a small black square in the middle of the crosshairs by using the Rectangle
    tool and selecting the solid fill option. Rename this sprite Hitbox. The Hitbox
    sprite will look like this:


