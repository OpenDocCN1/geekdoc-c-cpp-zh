  md: 'If the up arrow key is not being pressed, Scratch skips the code inside the
    **then** block.


    Pressing the up arrow key makes the cat move up. The **forever** loop block means
    Scratch will check over and again whether the up arrow key is being pressed. This
    continues until you click the stop sign.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_66_0.png)


    The **forever** block is needed for this program to work. Without it, Scratch
    would only check **once** if the up arrow key was pressed. Then the program would
    end. But you want Scratch to keep checking if the up arrow key is pressed. If
    your program doesn''t seem to be doing anything, make sure you didn''t forget
    to add the **forever** block.


    When you code this on your own, be sure you use the **change y** by code instead
    of the **change x** or **set y** to code blocks. If your program isn''t working
    correctly, check that your code is the same as the code in this book.


