    # # RAINBOW LINES IN SPACE!


    In this chapter, you''ll create a cool-looking animation: a rainbow V that flies
    through space and leaves colorful trails behind. This program was inspired by
    the demoscene, a subculture of elite programmers who made amazing graphical programs
    starting in the 1980s.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Demosceners made beautiful, elaborate programs called demos that showed off
    their artistic, musical, and programming skills. But most amazing of all, these
    programs were tiny—just a few kilobytes! The program we''ll write isn''t quite
    as small, but it''s dramatic and colorful, and it uses only a few lines of Scratch
    code.


    Before you start coding, look at the following figure to see what the final program
    will look like. Then go to https://www.nostarch.com/scratchplayground/ to play
    the animation.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_41_0.png)


    Just like demosceners, you can make beautiful programs. Let''s create our own
    graphics demo in Scratch!


    # SKETCH OUT THE DESIGN


    The first step of turning an idea into a Scratch program is to sketch out what
    you want it to look like. Planning your program helps you figure out the sprites
    you want and how they''ll behave. I recommend drawing your ideas on paper so you
    can cross them out if you don''t like them and write down notes and reminders.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'It''s also best to keep the project simple. If you start by making a complicated
    game like Minecraft or Zelda, you''ll quickly realize that it''s a lot of work.
    It''s more rewarding to finish a small project than to deal with the frustration
    of an unending, unfinished, and unplayable game.


    When you''ve completed your simple game, you can then build on top of it to make
    it more complex, which is the idea behind iterative development. First, you make
    the program work. Then, you make the program better. You can always add cool elements
    to the basic program after you finish it. Or, if your program becomes too complicated,
    you can return to your sketches and figure out what the sketch you want to remove.


    Don''t worry about a sketch making the sketch nice. It''s more important to have
    a solid plan for the main parts of the program. In my sketch, I have three parts:
    A, B, and C. We will work on these parts one at a time until we''ve built the
    full program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_42_0.png)


    After you''ve completed a sketch of what you want your program to do, you can
    start programming! Go to https://scratch.mit.edu/, sign up for an account on the
    site, and log in (having an account lets you save your programs on the Scratch
    website). After you''ve logged in, click the Create button at the'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'top of your screen to start making your own Scratch project. Then click the
    text field in the top left to change the name of the project from Untitled to
