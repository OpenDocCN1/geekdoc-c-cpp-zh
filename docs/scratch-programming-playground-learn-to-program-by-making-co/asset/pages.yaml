  md: 'Add the following code to the Fruit sprite.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_193_0.png)


    Script 1 hides the fruit at the start of the game. Script 2 cleans up the Stage
    when the game ends by deleting clones when the end game broadcast is received.
    Script 3 runs when the player slices the Begin Button sprite and starting clones.


    Let''s take a closer look at how script 3 works. After waiting 1 second, the number
