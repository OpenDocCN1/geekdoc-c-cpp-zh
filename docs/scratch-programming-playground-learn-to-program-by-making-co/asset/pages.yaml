    way. We''ll need to take another look at the code to figure out why this happens.


    The **repeat until** loop block keeps looping until the ball hits the ground,
    so all of this code is for a single throw. The **repeat until** loop block checks
    several times whether or not the Basketball sprite is touching the Hitbox sprite
