  md: '![](img/44bc3b30bef7ae1ad43f0775f36b6931_275_0.png)


    The Crab sprites subtract 1 from Apples Collected and say “Got one!” when they
    touch the player. If the player has 0 apples, the Crab sprites will say “Apples!”
    but will not subtract 1 from Apples Collected.


    The game will be a bit more exciting with two crabs, so right-click the Crab sprite
    in the Sprite List and select duplicate from the menu.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_275_1.png)


    > SAVE POINT

    Click the green flag to test the code so far. Make sure the two crabs are jumping
    around. When they touch the cat, they should steal an apple and say “Got one!”
    If the cat doesn''t have any apples, the crabs should just say “Apples!” Then
    click the red stop sign and save your program.


    # 20. Add the Time’s Up Sprite


    We’re almost done! The last thing we need to add to the game is a timer. The player
    will be under pressure to grab apples as'
