  md: '# SAVE POINT


    Click the green flag to test the code so far. Walk and jump around, collecting
    apples while trying to avoid the crabs. Make sure that when the timer reaches
    0, the game ends. Then click the red stop sign and save your program.


    The code for this program is too large to list the completed code in this book.
    However, you can view the completed code in the resources ZIP file—the filename
    is platformer.sb2.


    # SUMMARY


    You did it! You''re a Scratch master! The advanced Platformer game is the most
    elaborate and complex project in this book. You combined and lots of different
    concepts to make this game, so it might help to read through this chapter a few
    times.


    +   In this chapter, you built a game that

    - Uses a ground sprite that the player stands on

    - Uses dark purple custom blocks with the Run without screen refresh option enabled

    - Lets the player walk up and down slopes

    - Having ceiling detection so the player bumps their head on low platforms

    - Has detailed animations for walking, jumping, and falling

    - Implements AI for enemies so they move around on their own


    This wraps it up for this book, but don''t let that stop you from continuing your
    programming adventure. You can always look through otherer''s programs to get
    more ideas. Find a game you like, and try to create it from scratch. (All my puns
    are intended.)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_277_0.png)'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'The great thing about Scratch is that it provides you with unlimited possibilities
    for the types of games you can make. You can create clones of popular classic
    games like Pac-Man or Flappy Bird. Or you can make unique games using your own
    designs. Good luck!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_278_0.png)


    # REVIEW QUESTIONS


    Try to answer the following practice questions to test what you''ve learned. You
    probably won''t know all the answers off the top of your head, but you can explore
    the Scratch editor to figure out the answers. (The answers are also online at
    http://www.nostorch.com/scratchplayground/)


    +   1. The dark purple custom blocks help you avoid duplicating code. Why is this
    a good thing?

    2. How is a dark purple custom block''s input like a variable?

    3. Where can you use a dark purple custom block''s input?

    4. What does modulo mean in mathematics?

    5. What does floor mean in programming?'
