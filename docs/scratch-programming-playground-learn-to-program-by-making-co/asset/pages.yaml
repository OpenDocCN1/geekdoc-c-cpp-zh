    # SUMMARY


    In this chapter, you built a game that does the following:


    +   - Uses a hockey-puck push style to control a spaceship

    - Has x velocity and y velocity variables to keep track of how fast the Spaceship
    sprite is moving

    - Lets sprites wrap around the edges of the Stage

    - Has Asteroid clones that can create two smaller clones of themselves

    - Has variables Score and Energy that constantly decrease and increase, respectively,
    over time

    - Has frame-by-frame animation for an explosion


    This game offers players a real challenge, but as programmers, we had to add those
    features one by one! The player doesn''t directly control the spaceship but instead
    pushes it. If we stopped coding the Spaceship sprite at that point, the player
    could just hide in a corner, safe from asteroids, so we made all the sprites wrap
    around the edges. Even with that addition, the player might have tried to stay
    still in the center of the Stage. That''s when we added random small pushes to
    the spaceship.


    It''s difficult to avoid many small asteroids, so the player could have taken
    it slow and carefully finished off small asteroids before targeting large ones.
    At that point, we made the


