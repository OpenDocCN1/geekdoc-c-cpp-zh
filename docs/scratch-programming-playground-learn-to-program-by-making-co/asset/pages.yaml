    # EXPLORE: CLONING


    **The create clone of myself** block makes a duplicate of the sprite, which is
    called a *clone*. This feature is handy whenever you want to create many copies
    of an object in your game, such as a lot of bad guys that look the same, a bunch
    of coins for the player to collect, or in the *Brick Breaker* game, the bricks
    you need to hit.


    Let''s look at how clones work. Open Scratch in a new tab, and create a new program.
    Add this code to the Cat sprite:


    ```

    when clicked

    point in direction 120

    forever

    wait 2 secs

    move 10 steps

    if edge, bounce

    ```


    ```

    when I start as a clone

    say I''m a clone!

    forever

    turn 2 degrees

    ```


    Script makes the Cat sprite bounce around the Stage, just like the *Tennis Ball*
    sprite does in the *Brick Breaker* game. But in script, we create a clone again
    and again, every 2 seconds. Script uses the **when I start as a clone** block
    to control the behavior of the cloned sprites. What do you think will happen when
    you run this code? Run the code now to find out if you were right.


    The original Cat sprite bounces around the Stage. Every 2 seconds a duplicate
    of the sprite is created: these are the clones. Each clone will then start to
    run because of script.'
  merge: -1
