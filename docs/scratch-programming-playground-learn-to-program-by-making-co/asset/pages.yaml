  md: 'Next, the code for gravity and slice detection repeats in a loop as long as
    the clone is up in the air. When the clone''s position drops below -170, the clone
    has fallen to the bottom of the Stage.


    The first part of the **repeat until** block makes the clone fall faster by gravity
    by changing the y velocity by -1. Then the x position, position, and direction
    of the clone are changed by the values in the x velocity, y velocity, and rotation
    `speed` variables, moving the fruit in a parabola-shaped path through the air.
    A parabola shape is drawn when the horizontal speed (in this case, x velocity)
    doesn''t change but the vertical speed (in this case, y velocity) decreases over
    time.


    The color in the **touching color** block should match the color of the Slice
    sprite. The clone detects whether it has been sliced by checking whether it is
    touching the color of the Slice sprite''s trail (Step 6). If it is touching this
    color, the **if then else** block does another check for the costume number of
    the clone is set to 5 (which is the costume number of the bomb costume). If the
    bomb has been sliced, the Fruit clone makes the alien creek


    running the **change size by 30** block, and then broadcasts the end game message.


    Otherwise, if the sliced clone isn''t set to costume 5 (that is, if it isn''t
    the bomb costume), the code in the **else** part of the **if then else** block
    runs which of the four fruit costumes the clone is set to, change the costume
