  md: '# DON''T JUST PLAY\ GAMES—MAKE THEM!


    Scratch, the colorful drag-and-drop programming language, is used by millions
    of first-time learners, and in Scratch Programming Playground, you''ll learn to
    program by making cool games. Get ready to destroy asteroids, shoot hoops, slice
    and dice fruit!


    +   - Fruit Slicer: a *Fruit Ninja* clone

    - Brick Breaker: a remake of *Breakout!*, the brick-breaking classic

    - Platformer: a game inspired by *Super Mario Bros.*


    Each game includes easy-to-follow instructions, review questions, and creative
    coding challenges to make the game your own. Want to add more levels or a cheat
    code? No problem, just write some code.


    +   You''ll learn to make games:

    - Maze Runner: escape the maze!

    - Snaaaaaake: gobble apples and avoid your tail

    - Asteroid Breaker: smash space rocks


    Learning how to program shouldn''t be dry and dreary. With *Scratch Programming
    Playground*, you''ll make a game of it!


    # ABOUT THE AUTHOR


    Al Schweigart is a software developer who teaches programming to kids and adults.
    He has written several best-selling Python books for beginners, including *Automate
    the Boring Stuff with Python*, also from No Starch Press.


