  md: '# # VERSION 2.0: HIGH SCORE


    Scratch can store variables on its website using cloud variables. Scratch''s cloud
    variables act just like regular variables except their value is remembered even
    after the web browser closes. Cloud variables are shared among every Scratcher
    using a program. You can make a competition for high scores using cloud variables
    for everyone who''s played your game!


    Because cloud variables store a lot of the Scratch website''s bandwidth, there
    are some limitations for using them:


    +   - Cloud variables store only numbers, not text.


    +   - Cloud variables can''t be used to make chat or multiplayer games.


    +   - It takes a second or two for the cloud variable''s value to update for everyone.


    +   - New Scratchers who haven''t used the website which can''t use cloud variables.


    The High Score variable shows the highest score a player has made. By using a
    cloud variable, you can make the game show the highest score of every player on
    the Scratch website! Select the White Fade Out sprite and click the **Make a Variable**
    button in the orange **Data** category. Enter the Cloud High Score and make it
    a **For all sprites variable (just like High Score). Then check the **Cloud variable
    (stored on server)** checkbox.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_204_0.png)


    FRUIT SLICER 179'
