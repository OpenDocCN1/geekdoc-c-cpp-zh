  md: '# SUMMARY


    In this chapter, you built a game that


    +   - Implements gravity and realistic falling

    - Has a side-view perspective instead of a top-down view

    - Uses variables to keep track of scores, falling speeds, and the first time a
    basket is made

    - Has a hitbox to detect when a basket is made


    The use of gravity in this program was pretty simple. By the time you reach Chapter
    9, you''ll be able to make an advanced platformer game with more complex jumping
    and falling. But there are plenty of Scratch programming techniques to practice
    first. In Chapter 5, you''ll make a side-view game that uses cloning to duplicate
    a sprite dozens of times.


    # REVIEW QUESTIONS


