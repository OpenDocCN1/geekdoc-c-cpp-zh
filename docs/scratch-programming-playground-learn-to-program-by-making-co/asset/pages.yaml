  md: 'New dark orange blocks will appear under the Make a List button.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_178_0.png)


    Lists have more than set to and change by blocks. Lists have values, but each
    value also has a position, so the values need different kinds of code blocks.
    Positions in a list are defined by numbers; number 1 is the first value in the
    list. The following blocks control lists:


    +   - The add to block adds a value to the end of the list.

    - The delete block removes the value at a certain position.

    - The insert at block is like the add to block, but you can also select the position
    where the value should be inserted.

    - The replace item block is like a combination of delete and insert at. It replaces
    the value at a certain position with a new value.


    Add the following code and double-click-it to run it. Take a look at the effects
    of these code blocks on a list named example list.


