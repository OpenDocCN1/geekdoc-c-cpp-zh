  md: '# Menu bar


    # Green flag and red stop sign


    # Tabs


    # Project name


    # Stage


    # Scripts Area


    # Sprite List


    # Blocks Area


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_30_0.png)


    The most basic object in Scratch is the sprite. Sprites appear on the Stage ⑥,
    and their code blocks control their behavior. The editor automatically starts
    with a cat sprite for all new projects, but you can add more sprites. You can
    program a sprite by adding code blocks to the Scripts Area ⑤ on the right side
    of the screen. In Scratch, a stack of code blocks is called a script.


    The field at the top of the editor contains the project name ④. After you''ve
    named your project using a descriptive name, remember to occasionally save your
    project by clicking File ► Save Now from the menu bar ① to avoid losing your work
    if your browser crashes.


    You access the code blocks from the Blocks Area ⑦ in the center. At the top of
    the Blocks Area are 10 categories of code blocks: Motion, Looks, Sound, Pen, Data,
    Events, Control,'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Sensing, Operators, and More Blocks. Every code block belongs to one category
    and is the color of that category. For example, the say block comes from the purple
    Looks category. An infinite supply of code blocks is available; drag them from
    the Blocks Area to the Scripts Area.


    Each sprite has its own scripts. When you click the sprite in the Sprite List,
    that sprite''s scripts will display in the Scripts Area. Select the Scripts tab
    to display the Scripts Area. The Scripts Area is replaced by the Paint Editor
    and Sound Editor when the Costumes and Sounds tabs are selected.


    Clicking the green flag will start your program, and clicking the red stop sign
    will stop it.


    # THE PAINT EDITOR


    There are a few ways to get sprites into your programs. You can use the sprites
    that come with Scratch, upload sprites from your computer, or draw your own. If
    you want to draw your own, you can use Scratch''s Paint Editor.


    The Paint Editor is similar to other painting programs, such as Microsoft Paint
    or Paintbrush. To draw a new sprite, click the Paintbrush button next to New sprite.
    You can change how sprites look by switching to one of many costumes. To create
    a new costume for a sprite, click the Costumes tab, and then click the Paintbrush
    button next to New Costume.


    The main parts of the Paint Editor are


    +   The drawing tools, which you can select using the buttons on the left side


    +   The Canvas, where you draw images


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: '+   * The Costume center, which indicates the center of the costume with the
    crosshairs symbol


    +   * The Line width slider, which sets the width of the drawing tools


    +   * The Color selector, which changes the color of the drawing tools


    +   * The Zoom buttons for zooming into or out of the canvas


    +   * The Undo and Redo buttons, which can help you correct mistakes


    The Paint Editor looks like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_32_0.png)


    Experiment with the Paint Editor by clicking the drawing tool buttons and dragging
    the mouse over the Canvas to see how the tools work. Change the color and width
    of the drawing tools with the Color selector and Line width slider. Then use the
    Eyedropper to select a color from the Canvas rather than picking a color from
    the Color selector. If you make a mistake, click the Undo button at the top.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'The list of sprite costumes is in the column to the left of the drawing tools.
    If you want to save a costume as an image file, right-click the costume and select
    Save to local file.


    # WORKING WITH CODE BLOCKS


    Before you begin programming, it''s good to get an idea of how the code blocks
    snap together in the editor. Throughout this book, you''ll learn what each code
    block does.


    # Adding Blocks


    To create a new code block, drag it from the center Blocks Area to the Scripts
    Area. The code blocks that have a notch on top and bump on the bottom are called
    stack blocks. To snap a stack block together with another stack block, drag the
    code block close to the bottom of the other. When a white outline appears, drop
    the block to connect it to the stack.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_33_0.png)


    Stack blocks can also fit in between blocks. Look carefully at where the white
    outline appears in the script: this is where the block will snap into place. This
    figure shows a wait 1 secs block moving into the middle of a script:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_33_1.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'You can change a white field inside a block by clicking the white area and
    entering new input. The rectangular white fields accept text; the rounded white
    fields accept numbers.


    The rounded blocks are called reporter blocks. They fit inside the white fields.
    For example, in the following figure, the green pick random 1 to 10 block fits
    inside the white field. When the left edge of the reporter block is over the white
    field, if the left edge isn''t over the white field, the outline won''t appear
    and the reporter block cannot be placed inside.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_34_0.png)


    # Deleting Blocks


    To remove blocks, drag them out of the script. If you remove a stack block, you''ll
    also remove the stack blocks connected under it, as shown in the next figure.
    You may need to set aside these blocks if you want to reconnect some of them to
    the script. Drag the blocks you want to delete over the center Blocks Area to
    remove them from the Stage. You can always add more blocks from the Blocks Area
    when you need them.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_34_1.png)


    You can also right-click a block and delete from the menu that appears. However,
    doing so will also delete all the blocks underneath that block. If you accidentally
    delete some'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'blocks, you can restore them by selecting Edit ► Undelete from the menu bar.


    # Running Programs


    Create the following program by dragging blocks from the Blocks Area to the Scripts
    Area:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_35_0.png)


    When you click the green flag at the top of the Stage, this program will start.
    Programs begin at (**green flag clicked**) and then run the next block in the
    script. In this example, a speech bubble appears above the sprite and displays
    the word “Hello!” In the forever loop, the sprite moves forward 10 steps and then
    turns clockwise by 15 degrees. When the program gets to the last block, it **loops**
    back to the top. All the blocks in the **forever** block will run in a loop forever.
    The program stops only when you click the red stop sign.


    You can also run a script or block by double-clicking it. But clicking the green
    flag is the normal way to start your program.


    You can have as many sprites and code blocks in your programs as you want. As
    you create the programming projects in this book, you''ll learn about Scratch
    many different types of code blocks.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_35_1.png)'
