  mdcn: '

    当游戏开始时，网球（Tennis Ball）角色从舞台中心的坐标 (0, 0) 位置开始；然后，网球角色指向右下方位于板板（Paddle）角色的方向。接下来，在
    `forever`（重复执行）循环中，网球角色开始移动。当网球角色碰到舞台边缘时，它将向新的方向反弹。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_124_0.png)


    ### 保存点点 (SAVE POINT)

    点击绿色旗帜测试目前的代码。确保网球角色在周围移动并在边缘处反弹。网球将不会在板板上反弹，因为你还没有添加那部分代码。点击红色停止按钮并保存你的程序。


    # 让球从板板上反弹


    网球角色现在会在墙壁上反弹，但不会在板板角色上反弹。让我们现在添加那部分代码。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_124_1.png)


    # 3. 在网球角色上添加反弹代码


    将以下代码添加到网球角色中，使其能够从板板角色上反弹。为此，你需要创建一个新的广播消息：bounce（反弹）。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_125_0.png)


    你将在脚本 ① 中使用广播消息来控制当脚本 ② 中的球碰到板板时发生的情况。

    脚本 ② 中的 **point in direction 180 - direction code（指向方向180减方向代码）** 看起来有点神秘，但这个简单的方程根据球当前的方向计算出球反弹的方向。如果球指向右上（45度），那么当它反弹自砖块底部时，它的新方向将指向右下（135度），因为
    $180 - 45 = 135$。如果球指向左上（-45度），那么当它反弹自砖块底部时，它的新方向将指向左下（225度），因为 $180 - (-45) =
    225$。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_125_1.png)


    稍后在程序添加让球从砖块上反弹的代码时，你会再次使用这个广播消息。


    # 保存点 (SAVE POINT)


    点击绿色旗帜测试目前的代码。确保网球会在板板上反弹。然后点击红色停止按钮并保存你的程序。


    # 探索：克隆 (CLONING)


    **create clone of myself（将我克隆）** 模块会创建一个角色的副本，这个副本被称为 *clone（克隆）*。当你需要在游戏中创建一个对象的许多副本时，这个功能非常有用，例如许多外观相同的坏人、玩家收集的一堆硬币，或者在*打砖块（Brick
    Breaker）* 游戏中你需要击中的的砖块。


    让我们看看克隆是如何工作的。在新标签页中打开 Scratch，并创建一个新程序。将此代码添加到猫（Cat）角色中：


    ```

    when clicked

    point in direction 120

    forever

    wait 2 secs

    move 10 steps

    if edge, bounce

    ```


    ```

    when I start as a clone

    say I''m a clone!

    forever

    turn 2 degrees

    ```


    脚本让猫角色在舞台上弹跳，就像*打砖块*游戏中的*网球*角色执行一样。但在脚本中，我们每隔 2 秒就会不断创建一个克隆。脚本使用 **when I start
    as a clone（当我作为克隆启动时）** 模块来控制克隆出的行为。你认为运行这段代码会发生什么？现在运行代码看看你是否正确。


    原始的猫角色在舞台上弹跳。每 2 秒就会创建一个角色的副本：这些就是克隆体。每个克隆随后都会因为脚本开始运行。


    # 为砖块创建克隆


    现在游戏需要很多砖块，所以你将创建一个砖块（Brick）角色，然后使用 Scratch 的 **create clone（创建克隆）** 模块将其克隆。


    # 4. 添加砖块角色


    点击新建（New sprite）旁边的 **Choose sprite from library（从库中选择角色）** 按钮，从角色库窗口选择 Button
    2 角色。点击 **i** 按钮打开信息区域（Info Area），并将此角色重命名为 Brick（砖）。


    你需要通过选择橙色的 **Data（数据）**分类并点击 **Make a Variable（制作变量）** 按钮创建一个新变量。将此变量命名为 Score（分数），并设置为
    **For all sprites（所有角色）**。然后将以下代码添加到砖角色中：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_127_0.png)


    在游戏开始时，Score 变量被设置为 0，以便重置之前游戏的任何分数。原始角色使用 **hide（隐藏）** 模块隐藏自己，缩小 50%，并移动到舞台左上角的
    (~200, 140) 处。我们接下来创建的克隆体将使用 **show（显示）** 模块显示自己。


    # 5. 克隆砖块角色


    对于**打砖块**游戏，我们需要许多行砖块。让网球从砖块上反弹。为了形成这些行，网球移动到舞台左上角的 (~200, 140)。我们接下来创建的克隆体将使用
    **show** 模块显示自己。


