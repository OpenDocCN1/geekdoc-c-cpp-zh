    \n对于每个重复的造型（造型 6, 7, 8 和 9），选择该造型并点击“转换为位图”（Convert to bitmap）。然后使用选择工具拖动矩形覆盖造型的一半部分。将选中的部分与另一部分移开，并稍微旋转使其看起来像被切开了一。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_189_0.png)\n\n## 10. 为水果角色添加代码\n\n\
