  mdcn: "\n随着时间的推移分数降低，以鼓励玩家射射。\n玩家也可以在不仔细瞄准的情况下乱射，因此我们设置了一个“能量”（Energy）变量来限制玩家的射击速度。\n\
    \n每当你为游戏添加新功能时，太难玩的游戏会令人沮丧，但太容易的游戏又很无聊。关键在于找到平衡。\n\n下一个游戏是迄为止最先进的程序：它是一个像《超级马里奥》或《超级肉肉》那样的平台游戏。它不仅像《篮球》游戏那样具有跳跃和重力，你还可以在不改变代码的情况下为其设计自定义关卡！\n\
    \n# 复习题\n\n尝试回答以下练习题来测试你所学的知识。你可能无法立刻想出所有答案，但你可以探索 Scratch 编辑器来找到答案。（答案也可以在 http://www.nostarch.com/scratchplayground/\
    \ 找到）\n\n- 1. 循环代码（wrap-around code）是如何工作的？\n- 2. 为什么“能量射击”（Energy Blast）精灵有一个克隆变量？\n\
    - 3. 是什么防止了小行星（Asteroid）克隆无限地分裂成指数倍数量的碎片？\n- 4. “爆炸”（Explosion）精灵的代码是如何让它看起来像太空船爆炸的？\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_234_0.png)\n\n# 9 制作高级平台游戏\n\n第一款《超级马里奥》游戏于1985年推出，成为任天堂最成功的视频游戏系列，也是历史上影响力最大的游戏之一。由于该游戏涉及让角色奔跑、跳跃并在平台之间跳跃，这种游戏风格被称为平台游戏（platformer\
    \ 或 platform game）。\n\n在这一章的 Scratch 游戏中，猫将扮演马里奥或路易吉的角色。玩家可以控制猫在单个关卡中跳跃以收集苹果，同时躲避偷取苹果的螃蟹。游戏是有时间限制的：玩家只有\
    \ 45 秒时间在尽可能躲避螃蟹的同时收集尽可能多的苹果！\n\n在开始编码之前，先查看 https://www.nostarch/scratchplayground/\
    \ 上的最终程序。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_235_0.png)\n\n准备好编写一个比之前章节更复杂的游戏吧！\n\
    \n# 设计草图\n\n让我们在纸上勾勒出游戏的样子。玩家控制一只猫在到处跳跃，而苹果会随机出现。螃蟹也会在平台上随机行走和跳跃。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_236_0.png)\n\
    \n以下是我们在每个部分要做的工作：\n\n- A. 创建重力、坠落和落地\n- B. 处理斜坡和墙壁\n- C. 让猫跳高跳低\n- D. 添加天花板检测\n\
    - E. 为猫精灵使用碰撞盒（hitbox）\n- F. 添加更好的行走动画\n- G. 创建关卡\n- H. 添加螃蟹敌人和苹果\n\n这个平台游戏是书中中最野心的项目，但只要按照本章的步骤，任何人都可以编写它。让我们一步一步编写每个部分。\n\
    如果你想节省时间，可以从资源 ZIP 文件中名为 `platformer-skeleton.sb2` 的骨架项目文件开始。访问 https://www.nostarch.com/scratchplayground/\n\
    \n通过右键点击链接并选择**链接另存为**或**目标另存为**将 ZIP 文件下载到你的电脑。从 ZIP 文件中提取所有文件。骨架项目文件已经加载了所有精灵，你只需要将代码块拖入每个精灵中。\n\
    \n# 创建重力、坠落和落地\n\n在第一部分，我们将添加重力、坠落和落地的代码，类似于第 4 章中的《篮球》游戏。重要的区别在于，在平台游戏中，猫在接触地面时落地，而不是在舞台的底部。编码会稍微复杂一些，因为我们希望地面有山丘并最终有平台！\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_237_0.png)\n\n开始，点击 Scratch 编辑器左上角的文本框，将项目从“Untitled”（未命名）重命名为“Platformer”（平台游戏）。\n\
    \n# 1. 创建地面精灵\n\n在前几个脚本中，我们为地面使用简单的形状，仅用于探索代码将如何工作。\n\n点击“新增精灵”旁边的**画画**（Paint\
    \ new sprite）按钮，在你学习执行代码时创建一个临时的地面精灵。在画编辑器中，使用画笔或线条工具为地面画一个形状。你可以使用画编辑器左下角的线条宽度滑块让线条变粗。请确保在右侧画一个平缓的斜坡，在左侧画一个陡峭的斜坡。\n\
    \n打开精灵的信息区域，将精灵重命名为 Ground（地面）。同样将 Sprite1 重命名为 Cat（猫）。\n\n# 2. 添加重力和落地代码\n\n\
    现在我们有了一个地面精灵，我们需要猫掉落并落在它上面。\n\n- 选择猫精灵。在橙色的“数据”（Data）类别中，点击“制作变量”按钮并创建一个名为 velocity（速度）的变量。\n\
    \n```scratch\nwhen clicked\nset rotation style left-right\nforever\n  change velocity\
    \ by -2\n  change y by velocity\n  repeat until <touching Ground?>\n    set velocity\
    \ to 0\n    change y by 1\n```\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_239_0.png)\n\
    \n坠落代码 ① 将速度减去 2 并改变 y 轴坐标。然后 **重复直到 <碰到 Ground?>** ② 将速度设为 0 并改变 y 轴坐标。这会让猫向上抬起，直到它不再接触地面。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_240_0.png)\n\n# 3. 让猫行走并循环舞台\n\n猫还需要使用\
    \ WASD 键左右行走，因此在猫精灵中添加以下脚本：\n\n```scratch\nforever\n  if <key a pressed?> then\n\
    \    point in direction -90\n    change x by -6\n  end\n  if <key d pressed?>\
    \ then\n    point in direction 90\n    change x by 6\n  end\n  if <y-position\
    \ < -170> then\n    set y to 180\n  end\n```\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_241_0.png)\n\
    \n# 4. 移除地面抬起延迟\n\n目前代码的一个大问题是猫精灵是从地面内部缓慢地抬升到地面上方。代码需要运行得足够快，让玩家只看到精灵在地面上，而不是在内部。\n\
    深紫色的自定义块可以帮助我们做到。进入“更多块”（More Blocks）类别，点击“制作积木”按钮。\n\n"
