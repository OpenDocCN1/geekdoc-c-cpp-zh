    `set x velocity to [ ... ]` 模块块使用了一个复杂的公式，该公式为 `-1 * x position / 50 + pick random
    -2 to 2`，用于给 x velocity 变量赋值。x velocity 值决定了水果向左或向右抛出的远程度。这应该是一个很小的值，所以角色的 x 位置（一个
    -200 到 200 之间的随机数）除以 50 后，等于一个 -4 到 4 之间的数字。


    我们总是希望水果向舞台的中心抛出。这意味着如果 Fruit 角色位于舞台的左侧，它的 x 位置将为负数，克隆应该向右抛出。换句话说，x velocity 变量应该设置为正数。如果
    Fruit 在右侧（具有正 x 位置），它应该向左抛出。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_0.png)


