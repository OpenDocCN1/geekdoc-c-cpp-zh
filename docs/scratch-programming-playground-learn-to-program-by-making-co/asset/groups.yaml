    \ an energy blast. The player should be able to fire only if the Energy variable\
    \ is larger than 0.\n\nModify the code in the Energy Blast sprite to match the\
    \ following.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_230_0.png)\n\nScript\
