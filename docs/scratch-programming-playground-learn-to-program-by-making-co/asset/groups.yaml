  mdcn: '

    # 菜单栏

    # 绿色旗帜和红色停止按钮

    # 标签

    # 项目名称

    # 舞台

    # 脚本区域

    # 角色列表

    # 积木区域


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_30_0.png)


    Scratch 中是最基础的对象是角色（sprite）。角色显示在舞台 ⑥ 上，它们的代码块控制着它们的行为。编辑器为所有新项目都会自动加载一个猫咪角色，但你可以添加更多角色。你可以通过在屏幕右侧的脚本区域
    ⑤ 中添加代码块来对角色进行编程。在 Scratch 中，一堆代码块被称为一个脚本（script）。


    编辑器顶部的字段包含项目名称 ④。当你使用描述性名称为项目命名后，记得偶尔点击菜单栏 ① 上的文件（File）► 立即保存（Save Now）来保存项目，以防浏览器崩溃时丢失工作。


    你可以从中间的积木区域 ⑦ 访问代码块。积木区域顶部有 10 类代码块：移动、外观、声音、画笔、数据、事件、控制、侦测、运算符和更多积木。每个代码块都属于一个类别，并具有该类别的颜色。例如，“说”积木来自紫色的“外观”类别。代码块是无限供应的；将它们从积木区域拖动到脚本区域。


    每个角色都有自己的脚本。当你点击角色列表中的角色时，该角色的脚本将显示在脚本区域中。选择“脚本”标签以显示脚本区域。当选择“造型”和“声音”标签时，脚本区域会被画画编辑器和声音编辑器取代。


    点击绿色旗帜将启动你的程序，点击红色停止按钮将停止程序。


    ## 画画编辑器


    有几种方法可以将角色引入到你的程序中。你可以使用 Scratch 自带的角色、从电脑上传角色，或者自己绘制。如果你想自己绘制，可以使用 Scratch 的画画编辑器。


    画画编辑器与其他绘画程序（如微软画画或 Paintbrush）类似。要绘制一个新角色，请点击“新角色”旁边的画笔按钮。你可以通过切换到许多造型之一来改变角色的外观。要为角色创建一个新造型，点击“造型”标签，然后点击“新造型”旁边的画笔按钮。


    画画编辑器的主要部分是


    - 绘制工具，你可以使用左侧的按钮进行选择

    - 画布，你可以在这里绘制图像


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_31_0.png)


    - 造型中心，用十字准符号指示造型的中心

    - 线宽滑条，设置绘制工具的宽度

    - 颜色选择器，更改绘制工具的颜色

    - 缩放按钮，用于放大或缩小画布

    - 撤销和重做按钮，可以帮助你纠正错误


    画画编辑器看起来像：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_32_0.png)


    通过点击绘制工具按钮并在画布上移动鼠标来尝试画画编辑器，查看这些工具是如何工作的。使用颜色选择器和线宽滑条更改绘制工具的颜色和宽度。然后使用吸管工具从画布上选择颜色，而不是从颜色选择器中挑选颜色。如果你犯了错，点击顶部的撤销按钮。


    角色造型列表位于绘制工具左侧的列。如果你想将造型保存为图像文件，右键点击造型并选择“保存到本地文件”。


    ## 使用代码块


    在开始编程之前，先了解代码块在编辑器中是如何组合在一起的很有帮助。在整本书中，你将学习每个代码块的作用。


    ### 添加积木


    要创建一个新的代码块，将它从中间的积木区域拖动到脚本区域。顶部有凹槽、底部有凸起的代码块被称为栈积木（stack blocks）。要将一个栈积木与另一个栈积木组合，将代码块靠近另一个的底部。当出现白色轮廓时，释放代码块。

