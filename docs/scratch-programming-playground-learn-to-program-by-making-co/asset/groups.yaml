    use the Text tool to write GAME OVER in red.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_131_0.png)


    Click the i button to open the Info Area, and rename this sprite Game Over. Then
    add this code to the Game Over sprite:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_131_1.png)


    The sprite stays hidden until it receives the game over broadcast. The stop all
    block then stops all the sprites from moving as well.'
- md: "\n> SAVE POINT\nClick the green flag to test the code so far. Let the tennis\
    \ ball fall past the paddle, and make sure the Game Over sprite appears and the\
    \ program stops. Save your program.\n\n# 9. Create the You Win Sprite\n\nClick\
    \ the Paint new sprite button next to New sprite. In the Paint Editor, use the\
    \ Text tool to write You win! in green.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_132_0.png)\n\
    \nClick the i button to open the Info Area, and rename this sprite You Win. Add\
    \ this code to the You Win:\n\n```\nwhen clicked\ngo to x: 0 y: 0\nhide\nset Score\
    \ to 0\nwait until Score = 28\nshow\nstop all\n```\n\nAs with the Game Over sprite,\
    \ the You Win sprite is hidden until a condition is met. In this game, the player\
    \ needs to break all 28 bricks to win, so the condition is Score = 28. After the\
    \ You Win sprite displays, the program stops all the other sprites from moving\
    \ with stop all.\n\n# SAVE POINT\n\nClick the green flag to test the code so far.\
    \ Make sure the You Win sprite appears after breaking all the bricks and the program\
    \ stops. To make winning the game faster, temporarily change the wait until Score\
    \ = 28 block to wait until Score = 1. Then you only need to break one brick to\
    \ win. Save your program.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_133_0.png)\n\
    \n# THE COMPLETE PROGRAM\n\nThe final code for the entire program is shown here.\
    \ If your program isn't working right, check your code against this code.\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_133_1.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_0.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_1.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_2.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_3.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_4.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_5.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_6.png)\n\
    \n# VERSION 2.0: POLISHING TIME\n\nThe game works well as it is. But now you'll\
    \ add some polish to the game. Many of the ideas for the polished features in\
    \ the Brick Breaker game came from a Nordic Game Indie Night presentation called\
    \ \"Juice It or Lose It!\" by Martin Jonasson and Petri Purho. The word juice\
    \ in game design means polish, or modifying a game in small ways to make it feel\
    \ more alive and responsive. These tricks can turn a bare game into an exciting,\
    \ colorful one. A Juicy game looks more professional than a plain game. You can\
    \ watch their presentation where they add juice to their brick breaker game at\
    \ https://www.nostarch.com/scratchplayground/\n\nYou can add many tricks to the\
    \ Brick Breaker game to make it look polished. Even better, you can use these\
    \ tricks in any of your games. Before you start coding, take a look at the complete\
    \ program at https://www.nostarch.com/scratchplayground/\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_135_0.png)\n\
    \n# Draw a Cool Backdrop\n\nAdding an interesting background is a simple way to\
    \ make the game look cooler. Click the Stage in the Sprite List, and then click\
    \ the Backdrops tab above the Blocks Area. In the Paint Editor, select two different\
    \ purple colors. First, click a light purple color; then click the Color switcher\
    \ and click a dark purple color. Using the Fill tool's various gradient settings,\
    \ randomly click around the Paint Editor to create an unusual but interesting\
    \ background like the one shown in the following figure.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_135_1.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_136_0.png)\n\n# Add Music\n\nSounds\
    \ set the mood and make a game feel more alive. With the Stage selected in the\
    \ Sprite List, click the Sounds tab at the top of the Blocks Area. Click the Choose\
    \ sound from library button (it looks like a speaker) under New sound. When the\
    \ Sound Library window appears, select the dance-celebrate sound and click OK.\n\
    \nThen click Scripts tab and add this code to the Stage’s Scripts Area to give\
    \ the game background music:\n\n```\nwhen clicked\nforever\nplay sound celebrate\
    \ until done\n```\n\n# Make the Paddle Flash When Hit\n\nIn this step, you'll\
    \ make the paddle flash different colors when it is hit by the ball. Add the following\
    \ code to the Paddle sprite.\n\n```\nwhen receive bounce\nif distance to Tennis\
    \ Ball < 60 then\n  repeat 10\n    change color effect by 25\n```\n\nThe bounce\
    \ message is broadcast when Tennis Ball bounces off a clone. The if distance to\
    \ Tennis Ball < 60 block makes the color change when Tennis Ball sprite bounces\
    \ off the Paddle sprite (which means the ball will be less than 60 steps).\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_137_0.png)\n\n> SAVE POINT\nClick the\
    \ green flag to test the code so far. Make sure the paddle flashes different colors\
    \ when the ball bounces off it. Then click the red stop sign and save your program.\n\
    \n# Add an Animated Entrance and Exit to Bricks\n\nThe Brick clones' entrance\
    \ to the game is boring. They just appear as soon as they're cloned. To animate\
    \ their entrance, modify the Brick sprite's code to match this:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_138_0.png)\n\
    \nSetting the ghost effect to 100 and then slowly decreasing it makes the Brick\
    \ clones fade into view rather than instantly appear. The code also sets the Brick\
    \ clones 10 steps below their final positions and slowly raises them by changing\
    \ their y position in the repeat block. This makes the Brick clones look like\
    \ they're sliding into place.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_138_1.png)\n\
    \n# SAVE POINT\nClick the green flag to test the code so far. Make sure the Brick\
    \ clones fade into view rather than just appearing. Then click the red stop sign\
    \ and save your program.\n\nNow let's animate the exit of the Brick clones. Modify\
    \ the Brick sprite's code so the Brick clones have an animated exit instead of\
    \ just disappearing.\n\n```\nwhen start as a clone\nchange y by -10\nset ghost\
    \ effect to 100\nshow\nrepeat 10\n  change y by 1\n  change ghost effect by -10\n\
    \  wait 0.01 secs\nforever\n  if touching Tennis Ball then\n    broadcast bounce\n\
    \    change Score by 1\n    repeat 10\n      change color effect by 25\n     \
    \ change ghost effect by 5\n      change size by -4\n      change y by 4\n   \
    \ turn 15 degrees\ndelete this clone\n```\n\nNow the Brick clones will disappear\
    \ in an exciting way! The change effect blocks inside the repeat loop will make\
    \ the Brick clones different colors and increase their ghost effect so they become\
    \ more transparent. Meanwhile, the change size by -4 block causes the Brick clones\
    \ to shrink, the change y by 4 block lifts them up, and the turn clockwise 15\
    \ degrees block rotates them. This animated exit is short but fun to watch.\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_140_0.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_140_1.png)\n\
    \n# SAVE POINT\nClick the green flag to test the code so far. Hit the bricks with\
    \ the tennis ball, and make sure they spin and move up as they fade out of sight\
    \ rather than just disappearing. Then click the red stop sign and save your program.\n\
    \n# Add a Sound Effect to the Brick Exit\n\nLet's also make the Brick clones play\
    \ different sound effects as they disappear. Select the Brick sprite in the Sprite\
    \ List, and then click the Sounds tab above the Blocks Area. Click the Choose\
    \ sound from library button under New sound, and select laser1 from the Sound\
    \ Library. Repeat this step to add the laser2 sound as well.\n\nModify the Brick\
    \ sprite's code to match this:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_141_0.png)\n\
    \nWhen these sounds have been loaded and the following code has been added, the\
    \ Brick clones will play a random sound effect as they disappear. The if then\
    \ else block adds some variety to the program's sound effects by randomly selecting\
    \ which sound to play. Each time the Tennis Ball sprite touches a Brick clone,\
    \ the program will choose either 1 or 2 at random and then play a different sound\
    \ as a result.\n\n# Add a Sound Effect to the Tennis Ball\n\nNow you'll add a\
    \ sound effect for the Tennis Ball sprite hits the Paddle sprite. The pop sound\
    \ is already loaded for each sprite; all you have to do is update the Tennis Ball's\
    \ code to match this:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_142_0.png)\n\
    \n# Add a Trail Behind the Tennis Ball\n\nAdding a trail of clones behind the\
    \ Tennis Ball sprite as it moves around the Stage will give it a cool comet tail.\
    \ You don't want to use clones of the Tennis Ball sprite, because they would respond\
    \ to the bounce broadcast whenever the Tennis Ball sprite bounces. Instead, click\
    \ the Choose sprite from library button next to New sprite. Then select Tennis\n"
  mdcn: "\n\n> 保存点\n点击绿色旗帜测试目前为止的代码。让网球掉落球拍，并确保“游戏结束”（Game Over）精灵出现且程序停止。保存你的程序。\n\
    \n# 9. 创建“胜利”（You Win）精灵\n\n点击“新角色”旁边的“画新角色”按钮。在画编辑器中，使用文字工具用绿色写下“You win!”。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_132_0.png)\n\n点击“i”按钮打开信息区域，并将此角色重命名为“You\
    \ Win”（胜利）。在“You Win”角色中添加以下代码：\n\n```\nwhen clicked\ngo to x: 0 y: 0\nhide\n\
    set Score to 0\nwait until Score = 28\nshow\nstop all\n```\n\n和“游戏结束”精灵一样，“胜利”精灵在满足条件之前都是隐藏的。在在这个游戏中，玩家需要打破所有\
    \ 28 块砖块才能获胜，因此条件是 `Score = 28`。当“胜利”精灵显示后，程序通过 `stop all` 停止所有其他精灵的移动。\n\n# 保存点\n\
    \n点击绿色旗帜测试目前为止的代码。确保在打破所有砖块后，“胜利”精灵出现且程序停止。为了更快地赢得游戏，临时地将 `wait until Score =\
    \ 28` 积块更改为 `wait until Score = 1`。这样你只需要打破一块砖块就能获胜。保存你的程序。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_133_0.png)\n\
    \n# 完整程序\n\n这里显示了整个程序的最终代码。如果你的程序运行异常，请对照你的代码与此代码进行检查。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_133_1.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_0.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_1.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_2.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_3.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_4.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_5.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_134_6.png)\n\n# 版本 2.0：打磨时间\n\n游戏目前运行良好。但现在你将为游戏添加一些润色。在接块消除游戏中润色功能的许多灵感源于\
    \ Martin Jonasson 和 Petri Purho 在北欧游戏独立之夜的一场演讲，名为“Juice It or Lose It!”。在游戏设计中，“juice”（汁液）意味着打磨，或通过微小的方式修改游戏使其感觉更有活力、响应更灵敏。这些技巧可以将一个单调的游戏变成一个有趣、多彩的游戏。一个具有“汁感”的游戏比普通的游戏看起来更专业。你可以在这里观看他们的演示，看他们如何为接块消除游戏添加“汁”：https://www.nostarch.com/scratchplayground/\n\
    \n你可以为接块消除游戏添加许多技巧来让它看起来更精美。更好的是，你可以在任何游戏中使用这些技巧。在开始编码之前，请查看 https://www.nostarch.com/scratchplayground/\
    \ 上的完整程序。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_135_0.png)\n\n# 绘制酷炫的背景\n\
    \n添加有趣的背景是让游戏看起来更酷的简单方法。点击角色列表中的“舞台”，然后点击代码区上方的“背景”选项卡。在画编辑器中，选择两种不同的紫色。首先，点击浅紫色；然后点击颜色选择器并点击深紫色。使用填充工具的各种渐变设置，在画编辑器中随机点击，以创建一个如附所示的不寻常但有趣的背景。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_135_1.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_136_0.png)\n\
    \n# 添加音乐\n\n声音可以营造氛围并让游戏感觉更有活力。在角色列表中选中了“舞台”的情况下，点击代码区最上方的“声音”选项卡。点击“新声音”下方的“从库中选择声音”按钮（它看起来像一个扬声器）。当声音库窗口出现时，选择\
    \ `celebrate` 音并点击确定。\n\n然后点击“脚本”选项卡，并将此代码添加到舞台的脚本区域，为游戏提供背景音乐：\n\n```\nwhen clicked\n\
    forever\nplay sound celebrate until done\n```\n\n# 被击中时让球拍闪烁\n\n在这一步中，你让球拍在被球击中时闪烁不同的颜色。在“球拍”精灵上添加以下代码。\n\
    \n```\nwhen receive bounce\nif distance to Tennis Ball < 60 then\n  repeat 10\n\
    \    change color effect by 25\n```\n\n当网球克隆体弹回时，会广播 `bounce`get。`if distance\
    \ to Tennis Ball < 60` 积块会在网球精灵弹回球拍精灵时改变颜色（这意味着球的距离小于 60 步）。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_137_0.png)\n\
    \n> 保存点\n点击绿色旗帜测试目前为止的代码。确保当球弹回球拍时，球拍会闪烁不同的颜色。然后点击红色停止按钮并保存你的程序。\n\n# 为砖块添加动画进入和退出\n\
    \n砖块克隆进入游戏的方式很无聊。它们一旦被克隆就会出现。为了让它们的进入带有动画，请修改“砖块”精灵的代码以匹配此项：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_138_0)\n\
    \n设置 `ghost effect` 为 100 会让砖块缓慢淡出而不是立即出现。通过改变 `y` 坐标让它们缓慢上升。在 `repeat` 积块中让砖块看起来像在滑行。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_138_1.png)\n\n# 保存点\n点击绿色旗帜测试目前为止的代码。确保砖块是淡出而不是直接消失。然后点击红色停止按钮并保存你的程序。\n\
    \n现在让我们让砖块的退出带有动画。修改砖块精灵的代码，而不是直接消失。\n\n```\nwhen start as clone\nchange y by\
    \ -10\nset ghost effect to 100\nshow\nrepeat 10\n  change color effect by 25\n\
    \  change ghost effect by 5\n  change size by -4\n  change y by 4\n  turn 15 degrees\n\
    delete clone\n```\n\n现在砖块将以一种有趣的方式消失！`repeat` 循环内的 `change effect` 块会让砖块呈现不同的颜色并增加它们的透明度，使它们变得更透明。同时，`change\
    \ size by -4` 积块导致砖块缩小，`change y by 4` 积块将它们向上移动，而 `turn 15 degrees` 则让它们旋转。这种退出动画很短但很有趣。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_140_0.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_140_1.png)\n\
    \n# 保存点\n点击绿色旗帜测试目前为止的代码。用网球击中砖块，确保它们在消失时会旋转并移动而不是直接消失。然后点击红色停止按钮并保存你的程序。\n\n\
    # 为砖块退出添加特效\n\n让我们让砖块克隆体在消失时播放不同的特效。在角色列表中选择“砖块”精灵，然后点击代码区上方的“声音”选项卡。点击“新声音”下的“从库中选择声音”按钮，从声音库中选择\
    \ `laser1`。重复此步骤添加 `laser2` 声音。\n\n修改“砖块”精灵的代码以匹配此项：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_141_0.png)\n\
    \n加载这些声音并添加以下代码后，砖块克隆体消失时播放随机特效。`if then else` 积块通过随机选择播放哪个声音为程序的特效增加了多样性。每当网球精灵碰到砖块克隆体时，程序都会随机选择\
    \ 1 或 2，然后播放不同的声音。\n\n# 为网球添加特效\n\n现在你将为网球精灵击中球拍时添加特效。每个精灵都已加载了 `pop` 声音；你只需要更新网球的代码以匹配此项：\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b931_142_0.png)\n\n# 为网球后面添加尾迹\n\n在网球精灵绕舞台移动时在其后面添加一系列克隆体轨迹将使其看起来像酷酷的彗尾。你不想使用网球精灵的克隆体，因为每当网球精灵弹回时，它们都会对\
    \ `bounce` 广播响应。相反，点击“新角色”旁边的“从库中选择角色”按钮。然后选择“Tennis”。\n\n"
