    # 创建迷宫关卡


    接下来，我们将创建迷宫角色（sprite）并设置背景。如果迷宫游戏只有一个迷宫，很快就会变得无味，因此我们还要为游戏添加多个关卡。


    ## 3. 下载迷宫图片


    你可以自己绘制迷宫角色，但让我们直接使用 ZIP 文件中的图片吧。其中一张图片是 `Maze.sprite2`。


    在 Scratch 编辑器中，点击“从文件上传角色”按钮，并选择 `Maze.sprite2` 来上传该文件。这将创建一个名为 `Maze` 的新角色，它有若干个造型（costumes）。Scratch
    中的每个角色都可以有多个造型来改变它的外观。你可以通过点击“造型”标签页来查看这些造型，它们通常用于制作角色的动画。你的“角色列表”（Sprite List）看起来像这样：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_68_0.png)


    ## 4. 修改背景


    让我们通过在背景中放置一些 artwork来为迷宫增添色彩。你可以选择任何你喜欢的背景。点击“新背景”下方的“从库中选择背景”按钮，打开 Scratch 背景窗口来更改舞台背景。选择一个背景（我选择了浅色），点击确定。


    ## 5. 从第一个迷宫开始


    为 `Maze` 角色添加以下代码。你可以在“事件”（Events）、“外观”（Looks）和“动作”（Motion”）分类中找到这些模块。


    `Maze` 角色的每个造型都将为一个新等级。当玩家点击绿色旗帜启动程序时，游戏应该从第一个造型开始，并确保迷宫位于舞台的中心。我们将在第 8 和第 9 步中添加切换到下一关的代码。


    请注意，“脚本区域”（Scripts Area）显示的是所选角色的代码块。确保在“角色列表”中选择了 `Maze` 角色；否则，你会将代码添加到另一个角色中。每个角色都需要自己的代码才能正常工作。如果你在“换造型为”模块中没有看到
    `maze1`，那么很可能是选中了“小猫”（Orange Cat）角色。


    如果你的 Scratch 程序无法运行且你不知道如何修复，可以尝试从使用资源 ZIP 文件中的 `maze-part-b.sb2` Scratch 项目文件开始。在
    Scratch 编辑器中点击“从电脑上传文件”加载 `maze-part-b.sb2` 文件，然后移动到 C 部分。


    # 让小猫穿墙行走


    现在，当你点击绿色旗帜时，你就能让猫穿过迷宫。但你也能让猫穿过迷宫的墙壁，因为程序中没有任何东西阻止这种情况发生。代码只写道：“当按下右方向键时，让猫向右移动”。无论那里是否有墙，猫都会移动。


    ## 6. 检查猫是否碰到了墙壁


    让我们添加代码来检查猫是否碰到了蓝色墙壁。如果是，猫应该向后移动。因此，如果猫向右移动并碰到了墙壁，它应该自动向左移动。这将撤销玩家的操作并防止猫穿过墙壁。在“角色列表”中点击“小猫”角色，并将代码修改如下所示。注意，我们使用的是“碰到？”（touching?）模块，而不是“碰到颜色？”（touching
    color?）模块。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_70_0.png)


    此外，你可能注意到“小猫”角色相对于迷宫来说大如哥斯拉，让猫看起来很不真实。从“外观”分类中添加一个“将大小设”（set size）模块来让“小猫”角色变小。你可能还想让“小猫”角色始终显示在迷宫上方，因此你会添加“移到最层”（go
    to front）模块。这两个代码块位于脚本的顶部。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_71_0.png)


    # 保存点


    点击绿色旗帜测试目前的代码。确保“小猫”角色不能穿过迷宫墙壁。测试所有四个方向。然后点击红色停止按钮并保存你的程序。


    如果你的 Scratch 程序无法运行且你不知道如何修复，可以从使用资源 ZIP 文件中的 `maze-part-c.sb2` Scratch 项目文件重新开始。在
    Scratch 编辑器中点击“从电脑上传文件”加载 `maze-part-c.sb2` 文件，然后移动到 D 部分。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_71_1.png)


    # 在迷宫末端创建一个目标


    现在，还不清楚玩家应该到达迷宫的哪里。让我们在迷宫的另一端添加一个苹果，让玩家的目标更加明显。


