    \nTo start, click the text field at the top left of the Scratch editor and rename\
    \ the project from *Untitled* to *Platformer*.\n\n# 1. Create the Ground Sprite\n\
    \nLet's use a simple shape for the ground in the first few scripts, just to explore\
    \ how the code will work.\n\nClick the **Paint new sprite** button next to New\
