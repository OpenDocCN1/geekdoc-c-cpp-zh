    # ADD CEILING DETECTION


    The cat can walk on the ground, and now walls will stop the cat from moving through
    them. But if the player bumps the Cat sprite''s head against a platform from below,
    the Cat sprite will rise above it! To solve this problem, we need to make some
    adjustments to the lifting code to add ceiling detection.


    # 7. Add a Low Platform to the Ground Sprite


    Add a short, low platform to the Ground sprite''s costume, as shown in the following
    figure. Make sure it is high enough for the cat to walk under but low enough that
    the cat can jump up and touch it.


