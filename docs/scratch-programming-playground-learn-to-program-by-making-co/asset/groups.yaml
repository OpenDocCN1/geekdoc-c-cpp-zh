- md: "\n# THE COMPLETE PROGRAM\n\nThe final code for the entire program is shown\
    \ here. If your program isn't working correctly, check it against this code.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_162_0.png)\n\n```\nwhen clicked\nswitch\
    \ costume to costume1\nforever\n  go to Head\n  wait 0.01 secs\n  create clone\
    \ of myself\nwhen I start as a clone\npoint in direction pick random 0 to 360\n\
    wait 0.1 secs\nswitch costume to costume2\nwait Score / 5 secs\ndelete this clone\n\
    ```\n\n# VERSION 2.0: ADD BONUS FRUIT\n\nJust having one type of goal in a game\
    \ gets boring after a while. Let's add some bonus fruit!\n\nLet's add a second\
    \ type of fruit that will increase the score by 3 points when the snake eats it.\
    \ Click the Choose sprite from library button. From the Sprite Library window,\
    \ select Fruit Platter and click OK. (Or maybe choose a dessert instead if your\
