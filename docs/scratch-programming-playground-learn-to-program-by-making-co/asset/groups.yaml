    \nNow we need to create a plain backdrop. When the game begins, the program should\
    \ hide the Fruit Slicer title and switch to this backdrop. Click the Paint new\
    \ backdrop button under New backdrop to create a second backdrop. Then draw a\
    \ brown gradient for this backdrop, like this:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_175_0.png)\n\
    \nRename this new backdrop game screen. We'll switch between the start screen\
    \ and game screen backdrops when the game starts.\n\n# 2. Add the Code for the\
    \ Stage\n\nNow let's program the Stage. Select the Stage in the Sprite List, and\
    \ click the Scripts tab at the top of the Blocks Area. Create two variables, Score\
    \ and High Score, by clicking the Make a Variable button in the orange Data category.\
    \ both variables For all sprites.\n\n> NOTE The Stage only uses For all sprites\
