    The **point in direction 180 - direction code** in script ② seem a bit mysterious,
    but this simple equation calculates the direction in which the ball will bounce
    based on the ball''s current direction. If the ball is pointed up and right (45
    degrees), then when it bounces off the bottom of a brick, its new direction will
    be down and right (135 degrees), because $180 - 45 = 135$. If the ball is pointed
    up and left (-45 degrees), then when it bounces off the bottom of a brick, its
    new direction will be down and left (225 degrees), because $180 - (-45) = 225$.


