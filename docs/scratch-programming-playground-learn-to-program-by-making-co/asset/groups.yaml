    \n# 添加天花板检测\n\n猫可以在地面上行走，现在墙壁会阻止猫穿过它们。但如果玩家从下方用猫角色（Cat sprite）的头部碰撞平台，猫角色将会升到平台之上！为了解决这个问题，我们需要对抬升代码进行一些调整，添加天花板检测。\n\
    \n# 7. 在地面角色上添加一个低平台\n\n如下图所示，在地面角色（Ground sprite）的造型中添加一个短而低矮的平台。确保它足够高让猫走过去，同时又足够低让猫跳起并碰到它。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_249_1.png)\n\n这个平台应该足够低，让猫的头部撞到它。如果不能，请将平台重新画低一点。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_250_0.png)\n\n# 8. 添加天花板检测代码\n\n代码的问题在于自定义的\
    \ **handle ground** 模块中。这段代码始终假设猫角色是从上方落下的，如果猫角色碰到地面角色，它应该被抬升到其上方。地面角色代表猫无法穿过的任何实体部分，包括天花板。我们需要修改代码，使得当猫在碰到地面角色时正在向上跳，猫就会*停止*上升，因为它撞到了头。我们知道当猫角色的速度大于\
    \ 0 时它正在向上移动。因此，让我们编辑 **handle ground** 模块，添加一个新的布尔输入 **moving up**（向上移动）。\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_250_1.png)\n\n*布尔值*（Boolean）是一个真或假值。我们使用布尔输入是因为我们需要在第一次调用\
    \ **handle ground** 模块时，知道它的速度是否大于 0。这个真或假值存储在 **moving up** 输入中，就像变量存储它一样。如果我们在\
    \ **if** 模块中放入 **velocity > 0** 而不是 **moving up**，猫最终会升到天花板上方，而不是撞到它。\n\n右键点击\
    \ **define handle ground** 模块并从菜单中选择 **edit**。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_251_0.png)\n\
    \n点击 **Options** 旁边的灰色三角形展开窗口，点击 **Add boolean input** 旁边的按钮。将此新输入字段命名为 **moving\
    \ up**，然后点击 **OK**。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_251_1.png)\n\n\
    这将添加一个新的 **moving up** 模块，你可以像从积木区域拖动模块一样从 **define handle ground** 模块上拖出它。这个\
    \ **moving up** 模块将用于一个新的 **if then else** 模块。修改 **define handle ground** 模块的代码以匹配它。\n\
    \n```\ndefine handle ground moving up\nrepeat until not touching Ground\n  if\
    \ moving up then\n    change y by -1\n  else\n    change y by 1\n    set in air\
    \ to 0\n  set velocity to 0\n```\n\n如果猫正在向上移动，**change y by -1** 模块会让猫看起来像撞到了头。否则，脚本将像之前一样运行，将猫抬起使其位于地面上方。\n\
    \n接下来，我们需要编辑此脚本中的 **handle ground** 调用。我们将添加一个布尔条件来判断角色是否正在向上移动，即 **y velocity\
    \ > 0**。\n\n```\nwhen clicked\nset rotation style left-right\nset y velocity to\
    \ 0\nforever\n  change y velocity by\n  change y by velocity\n  change in air\
    \ by 1\n  handle ground velocity > 0\n```\n\n**handle ground velocity > 0** 模块会在\
