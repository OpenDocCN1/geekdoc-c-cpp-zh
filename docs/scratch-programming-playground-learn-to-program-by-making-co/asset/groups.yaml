    These costumes, which you can see by clicking the Costumes tab, are often used
    to animate the sprite. Your Sprite List will look like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_68_0.png)


    # 4. Change the Backdrop


    Let''s add a little flair to the maze by placing some artwork in the background.
    You can choose whichever background you like. Change the Stage''s backdrop by
    clicking the Choose backdrop from library button under New backdrop to open the
    Scratch Backdrop window. Choose a background (I chose light), and click OK.


    # 5. Start at the First Maze


    Add the following code to the Maze sprite. You can find these blocks in the Events,
    Looks, and Motion categories.'
  - '[PAGE 69]


    Each of the Maze sprite''s costumes will be a new level. When the player clicks
    the green flag to start the program, the game should begin with the first costume
    and make sure the maze is in the center of the Stage. We will add code to switch
    to the next level in Steps 8 and 9.


    Note that the Scripts Area shows code blocks for the selected sprite. Be sure
    the Maze sprite is selected in the Sprite List; otherwise, you''ll add the code
    to a different sprite. Each sprite needs its own code to work correctly. If you
    don''t see maze1 in the switch costume to block, the Orange Cat sprite is most
    likely selected.


    If your Scratch program doesn''t work and you don''t know how to fix it, you can
    start by using the maze-part-b.sb2 Scratch project file, which is in the resources
    ZIP file. Click File Upload from your computer in the Scratch editor to load the
    maze-part-b.sb2 file, and then move to Part C.


    # KEEP THE CAT WALKING THROUGH WALLS


    When you click the green flag now, you''ll be able to move the cat through the
    maze. But you''ll also be able to move the cat through the walls of the maze,
    because nothing in the program prevents this from happening. The code only states,
    "when the right arrow key is pressed, move the cat right." The cat moves, whether
    or not a wall is there.


    # 6. Check Whether the Cat Is Touching the Walls


    Let''s add code that checks whether the cat is touching the blue walls. If it
    is, the cat should move backward. So if the cat moves to the right and is touching
    a wall, it should automatically move left. This will undo the player''s move and
    prevent'
  - '[PAGE 70]


    the cat from moving through walls. Click the Orange Cat sprite in the Sprite List,
    and modify the code to look like the following. Notice that we''re using the touching?
    block, not the touching color? block.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_70_0.png)'
  - '[PAGE 71]


    Also, you might have noticed that the Orange Cat sprite is Godzilla-sized compared
    to the maze, making the cat look unrealistic. Add a set size block from the Looks
    category to make the Orange Cat sprite smaller. You also might want the Orange
    Cat sprite to always be shown on top of the maze, so you''ll add the go to front
    block. These two code blocks are at the top of the script.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_71_0.png)


    # SAVE POINT


    Click the green flag to test the code so far. Make sure the Orange Cat sprite
    cannot walk through the maze walls. Test this for all four directions. Then click
    the red stop sign and save your program.


    If your Scratch program doesn''t work and you don''t know how to fix it, you can
    start over by using the maze-part-c.sb2 Scratch project file, which is in the
    resources ZIP file. Click **Upload from your computer** in the Scratch editor
    to load the maze-part-c.sb2 file, and then move to Part D.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_71_1.png)


    # MAKE A GOAL AT THE END OF THE MAZE


    Right now, it isn''t clear where the player is supposed to end up in the maze.
    Let''s add an apple at the other end of the maze to make the player''s goal more
    obvious.'
  - '[PAGE 72]


    # 7. Create the Apple Sprite


    Click the **Choose sprite from library** button (which looks like a face) next
    to New sprite. When the Sprite Library window appears, select **Apple** and click
    **OK** to add a new sprite named **Apple** to the Sprite List.


    When the game starts, you want the Apple sprite to move to the end of the maze
    at the top of the Stage. The Apple sprite also has to be small enough to fit in
    the maze. The following code to the Apple sprite:


    ```

    when clicked

    set size to 25 %

    go to x: -10 y: 170

    ```


    # 8. Detect When the Player Reaches the Apple


    The **Maze Runner** game has a sprite for the player, the maze, and the apple
    at the end of the maze. Now it just needs the code to detect when the player reaches
    the end. When that happens, you''ll have Scratch play a sound and then swap costumes
    to the next level. But before you add the code, you need to load the sound. Select
    Orange Cat in the Sprite List. Click the **Sounds** tab at the top of the Blocks
    Area, and then click the **Choose sound from library** button. This button looks
    like a speaker and is under New sound.


    In the Sound Library window that appears, select cheer and then click **OK** to
    load the cheer sound. Now click the **Scripts** tab.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_72_0.png)'
  - '[PAGE 73]


    Add this script to the Orange Cat sprite’s code:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_73_0.png)


    To make the broadcast block broadcast the next maze message, click the black triangle
    in the broadcast block and select new message.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_73_1.png)


    In the window that appears, type next maze as the message name and click OK.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_73_2.png)'
  - '[PAGE 74]


    # 9. Add the Broadcast Handling Code to the Maze Sprite


    Click the Maze sprite in the Sprite List, and add the following code to it:


    ```

    when I receive next maze

    next costume

    ```


    This code changes the maze level when it receives the next maze broadcast.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_74_0.png)


