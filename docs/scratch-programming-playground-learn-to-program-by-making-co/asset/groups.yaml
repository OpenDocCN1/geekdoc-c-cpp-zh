  - '[PAGE 217]


    Now add the following script to the Energy Blast sprite. The player will fire
    an energy blast by pressing the spacebar. The original Energy Blast sprite will
    create clones that show them-selves and move toward the mouse. Since the Energy
    Blast clones move toward the mouse, the player can move to aim the energy blasts.


    ```

    when space = key pressed

    if player is alive = yes I am a clone = no then

    go to Spaceship

    point towards mouse-pointer

    create clone of myself

    ```


    The code under the **space key pressed** block will run for the original sprite
    *and* the clones if we don''t give instructions that this code should only run
    for the original sprite. But we don''t want the existing clones to create clones.
    The **if then** block checks that the I am a clone variable is set to no so that
    only the original- Energy Blast sprite runs this code and creates clones.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_217_0.png)


    Obviously, the Spaceship sprite can fire Energy Blast clones only if the player
    is alive, so the code also checks that the player is alive variable is set to
    yes.


    Next, add the following code to the Energy Blast sprite so that the clones move
    toward the mouse after they''ve been created.'
  - "[PAGE 218]\n\n```\nwhen I start as a clone\n  set I am a clone to yes\n  play\
