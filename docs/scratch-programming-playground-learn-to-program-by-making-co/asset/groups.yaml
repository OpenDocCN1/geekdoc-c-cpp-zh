    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_208_0.png)


    # 8

    ASTEROID BREAKER ...IN SPACE!


    Asteroids is a classic game developed in 1979 by Atari. Since then, many programmers
    have remade the game, and it’s a great programming project to make in Scratch,
    too. The player pilots a spaceship that must destroy space asteroids while avoiding
    the space pieces that break off . . . in space! (It’s a well-known fact that adding
    “. . . in space!” makes everything more exciting.)


    Instead of directly controlling where the spaceship moves, the player pushes the
    spaceship like a hockey puck on ice; because the player''s ship has inertia, it
    slides around the Stage. To slow down the spaceship, players must push it in the
    opposite direction. It takes skill to move the spaceship without losing control,
    but that''s half the fun of the game. The other half of the fun is blowing up
    asteroids.


    Before you start coding, look at the final Asteroid Breaker program at https://www.nostarch.com/scratchplayground/


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_209_0.png)


    # SKETCH OUT THE DESIGN


    Let''s draw on paper what the game should look like. In our version of the game,
    the player controls their spaceship with the WASD keys and aims at incoming asteroids
    with the mouse.


    Here is what my sketch looks like:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_210_0.png)


    And here''s what we''ll be doing in each part:


    - A. Make a spaceship that is pushed around

    - B. Make the spaceship wrap around the edges

    - C. Aim with the mouse and fire with the spacebar

    - D. Make asteroids that float around

    - E. Make asteroids split in two when hit

    - F. Keep score and a timer

    - G. Make the spaceship explode if it is hit


    If you want to save time, you can start from the skeleton project file, named
    asteroidbreaker-skeleton.sb2, in the resources ZIP file. Go to https://www.nostarch.com/scratchplayground/
    and download the ZIP file to your computer by right-clicking the link and selecting
    **Save link as** or **Save target as**. Extract all the files from the ZIP file.
    The skeleton project file has all the sprites already loaded, so you''ll only
    need to drag the code blocks into each sprite.


    ## MAKE A SPACESHIP THAT IS PUSHED AROUND


    Before we code the exciting parts of the game, we need to set up the backdrop
    and sprite. We''ll make this game spacey by adding the stars backdrop and the
    spaceship sprite. Click the **Choose backdrop from library** button under New
    back-drop, select **stars**, and click OK.


    We won''t use the cat sprite Scratch starts with, so right-click that sprite and
    select **delete** before continuing. Start a new project in the Scratch editor,
    and enter *Asteroid Breaker* as the project name.


    ### 1. Create the Spaceship Sprite


    We''ll use a flying saucer image for the spaceship, which you''ll find in the
    resources ZIP file.


    Click the **Upload sprite from file** button next to New sprite. Then select the
    *Spaceship.png* image file from the resources ZIP file.


    In the **Data** category, click **Make a Variable** and create a variable named
    x velocity. Make x velocity a This sprite only variable. Repeat the preceding
    steps to create a variable named y velocity.


    > **NOTE** If For this sprite only does not appear, the **Stage** is selected
    instead of the **Spaceship** sprite. Close the New Variable window, select the
    *Spaceship* sprite, and click **Make a Variable** again.


    You''ll also need to create two variables named Score and player is alive, but
    make these variables For all sprites.


    Next, add the following code to the *Spaceship* sprite. The code defines the ship''s
    starting position and the initial values of variables; it also contains the logic
    that defines the user''s controls.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_212_0.png)


    You might be wondering why we didn''t reuse code from previous games in which
    we used the change x by block. In this program, holding down one of the WASD keys
    adds to or subtracts from the x velocity and y velocity variables. The code at
    the bottom of the script changes the x and y position of the Spaceship sprite
    by using the values in these variables. Even after the player lets go of the key,
    the variables still reflect the updated position, so the spaceship continues to
    move.


    ### SAVE POINT


    Click the green flag to test the code so far. Press the WASD keys to see how the
    spaceship gets pushed. Make sure all four WASD keys push the spaceship in the
    correct directions. Then click the red stop sign and save your program.


    ## MAKE THE SPACESHIP WRAP AROUND THE EDGES


    When you tested the code, did you notice that the Spaceship sprite stops immediately
    when it runs into the edge of the Stage? The reason is that Scratch prevents sprites
    from moving off the Stage, which is helpful in most Scratch programs. But in Asteroid
    Breaker, we want sprites to go off the Stage.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_213_0.png)


    ### 2. Add the Wrap-Around Code to the Spaceship Sprite


    The left and right edges of the Stage are at -240 and 240. The bottom and top
    edges of the Stage are at -180 and 180. We''ll use these boundaries to make the
    spaceship wrap around to the other side.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_214_0.png)


    The original sprite hides itself at the start of the game and remains hidden.
    The clones it makes will appear on the Stage. All the Blast sprites that appear
    on the Stage will be clones.


    ### SAVE POINT


    Click the green flag to test the code so far. Make sure the spaceship wraps around
    the edges. Then click the red stop sign and save your program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_214_0.png)


    ### 3. Add the Random-Push Code to the Spaceship


    The controls for this game offer a challenge, but let''s make playing the game
    more difficult. We''ll add random pushes to the spaceship every second.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_215_0.png)


    Inside the forever loop, the x velocity and y variables are changed by a random
    amount after a 1 second pause. This means the spaceship receives a random push.


    ### SAVE POINT


    Click the green flag to test the code so far. Don''t press any of the WASD keys.
    Wait to see if the spaceship starts moving its own.


    ## AIM WITH THE MOUSE AND FIRE WITH THE SPACEBAR


    The code that controls the Spaceship sprite is complete, so let''s add energy
    blasts. These blasts will bust up those space asteroids!


    ### 4. Create the Energy Blast Sprite


    Scratch''s Sprite Library has a sprite we can use for the energy blasts. Click
    the **Choose sprite from library** button to New sprite. Select the Ball sprite
    and click *OK*. Open the sprite''s Info Area by clicking the [i] button, and rename
    it Energy Blast.


    We want the Energy Blast sprite to make a loud sound when it fires. Click the
    **Sounds** tab above the Blocks Area. Then click the **Choose sound from library**
    button. Select layer1 sound and click *OK.


    We''ll make clones of the Energy Blast sprite, but the clones and original sprite
    will run different code. There is only one Energy Blast sprite, but the player
    should be able to fire many energy blasts at once. We''ll create clones of the
    original Energy Blast sprite so that more than one energy blast can appear on
    the Stage. The original sprite will remain hidden; all the Energy Blast sprites
    that appear on the Stage will be clones.


    We''ll use a variable named I a clone to keep track of which is original and which
    are clones. Click the **Scripts** tab to go back to the Scripts Area. In the orange
    Data category, click the **Make a Variable** button. Create a Variable for this
    sprite only named I a clone. The original Energy Blast sprite will set this variable
    to no, and the clones will set it to yes. Add the following code to the Energy
    Blast sprite:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_216_0.png)


    The original sprite hides itself at the start of the game and remains hidden.
    The clones it makes will appear on the Stage. Also, the sprite we''re using is
    too big for the game, so set its size to 10 percent to make it smaller.

