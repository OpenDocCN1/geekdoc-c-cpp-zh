  mdcn: '

    当你点击绿色旗帜时，`y velocity` 变量被设置为 0，然后脚本进入无限循环。猫咪角色的 y 位置（垂直位置）随 `y velocity` 改变，而
    `y velocity` 则通过 -2 来改变。随着程序的循环运行，y 位置的变化速度会变得越来越快，让猫掉落得越来越快。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_98_0.png)


    ## 2. 添加地面高度代码


    现在，猫在掉落。但我们希望猫在撞击地面时停止。让我们继续为猫咪角色的代码添加代码，看起来像这样：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_98_1.png)


    在这段代码中，我们将地面高度的 y 位置设置为 -130。如果猫咪角色的 y 位置大于（高于）地面高度，那么 `y velocity` 就会变为 -2，猫咪角色就会掉落。最终，猫咪角会掉过了
    -130，其 y 位置将小于（低于）-130 的地面高度。当这种情况发生时，猫咪角色将重置在 -130 的地面高度，且 `y velocity` 将恢复为
    0 以停止角色的掉落。


    ### 保存点


    点击绿色旗帜测试目前的代码。用鼠标将猫向上拖动，然后松开。确保猫掉落到了地面，但没有掉出舞台边缘。你可以通过将 -130 改为其他数字来尝试不同的地面高度。然后点击红色停止按钮并保存你的程序。


    完成程序测试后，通过取消橙色“数据”（Data）类别旁边的复选框，使舞台上的 `y` 变量隐藏。


    ## 3. 为猫咪角色添加跳跃代码


    在为猫咪角色添加重力代码后，让猫跳起来就变得简单了。为猫咪角色添加以下代码：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_99_0.png)


    当你按下向上方向键时，`y velocity` 被设置为正数 20，让猫咪角色向上跳跃。但每次循环运行时，`y velocity` 变量仍然会被改变为 -2。所以，虽然猫起初跳了
    20 格，但在下一次循环时它将变为 18、16，依此类推。注意，**if then** 模块块会检查猫咪角色是否在地面上。如果猫已经在空中，你不应该能让它再次跳跃的！


    当速度设置为 0 时，猫咪角色处于跳跃的顶点。然后每次循环 `y velocity` 都会变为 -2，猫咪角色将继续掉落，直到撞击地面。尝试在 **set
    y velocity to change y velocity** 模块块中使用不同的数字。研究如何让猫跳得更高或更低（但始终在地面以上），或者让重力更强或更弱。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_0.png)


    > 保存点

    > 点击绿色旗帜测试目前的代码。按下向上方向键，确保猫跳起并落回。然后点击红色停止按钮并保存你的程序。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_1.png)


    ## 让猫向左右移动


    接下来我们添加猫咪角色的行走代码，以便玩家可以使用键盘控制猫。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_2.png)


    ## 4. 为猫咪角色添加行走代码


    在猫咪角色代码的底部添加以下代码：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_101_0.png)


    在无限循环内部，程序检查是否按下了左方向键或右方向键。如果是，猫咪角色将切换到下一个造型，并将其 x 位置改变为 -10（向左移动）或 10（向右移动）。猫咪角色自带两个造型，你可以通过点击“积木区域”（Blocks
    Area）上方的“造型”（Costumes）标签页来查看它们。通过使用“下一个造型”块在两个造型之间切换，你可以让猫看起来像在走路。![](img/44bc3b30bef7ae1ad43f0775f36b6931_101_1.png)


    ### 保存点

    > 点击绿色旗帜测试目前的代码。按下左、右方向键，确保猫向正确的方向移动。猫在向左移动时向后走也可以的；这正是我们想要的。然后点击红色停止按钮并保存你的程序。


    ## 制作一个悬空的篮筐


    现在猫咪角色已经制作完成，让我们处理游戏中的下一个角色：篮球篮。


    ## 5. 创建篮筐角色


    点击“新角色”（New sprite）旁边的“绘制”（Paint）角色按钮。在开始之前，点击右下角的“矢量”（Vector）按钮。在开始之前，右侧会出现绘制工具。（矢量模式允许你绘制形状而不是单个像素。）点击椭圆（Ellipse）工具并用它画一个圈。你还可以通过增加线条的宽度来让篮筐变厚。![](img/44bc3b30bef7ae1ad43f0775f36b6931_102.png)


    将篮筐角色重命名为 Hoop（篮筐）。我们希望在玩家进篮时播放声音。点击顶部的“声音”（Sounds）标签页，从库中选择 cheer（欢呼）。![](img/44bc3b30bef7ae1ad43f0775f36b6931_103.png)


    “欢呼”声音现在会出现在“播放声音”（play sound）的选项中。![](img/44bc3b30bef7ae1ad43f0775f36b6931_103.png)


    在篮筐上添加以下代码，让它在舞台上随机移动：


    ```

    当点击时滑移 1 秒到 x:(随机 -240 到 240) y:(随机 -50 到 180)

    当收到 swoosh

    播放 cheer

    说Sosh! 持续 2 秒

    ```


    脚本会让篮筐每秒移动到一个新位置。移动的篮筐会让游戏更有挑战性！当收到 swoosh 广播时，脚本会播放声音并显示“Sosh!”。


    ## 6. 创建碰撞箱角色 (Hitbox)


    现在让我们思考如何创建代码来判断玩家是否进篮。我们可以写一个程序检查猫是否触碰了篮筐。篮筐太大了，猫的边缘触碰到它就会算进篮。我们希望只有当猫通过篮筐中间时才算球。我们需要一个更好的改进。![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_0.png)


    相反，你可以创建一个碰撞箱（hitbox）。碰撞箱是一个游戏设计术语，用于判断游戏对象是否碰撞。我们将制作一个碰撞箱角色。点击绘制按钮创建一个新角色。在交叉点中心画一个小黑色正方形，并选择实心填充。将此角色命名为
    Hitbox。碰撞箱角色看起来像这样：![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_1.png)


    为 Hitbox 角色添加以下代码：![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_0.png)


    碰撞箱角色现在会跟随篮筐角色，无论它移动到何处。在第 9 步中，我们将编写一个程序确保只有当猫触碰 Hitbox 角色而不是 Hoop 角色时才算进篮。猫必须非常接近篮筐的中心才能算进篮！！[](img/44bc3b30bef7ae1ad43f0775f36b6931_105_1.png)


    在篮筐角色中间看到黑色正方形看起来很奇怪，所以让我们让碰撞箱角色隐藏。为 Hitbox 角色添加“设置 Ghost效果”（set ghost effect）模块并将其设置为
    100![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_2.png)


    “隐藏”（hide）块和“设置 Ghost效果为 100”之间是有区别的。如果你使用隐藏块来让碰撞箱变为不可，那么触碰块将永远检测不到球正在触碰碰撞箱，玩家将永远无法得分。设置
    Ghost 效果为 100 会让角色不可见，但此模块仍然允许触碰块检测到碰撞箱的。。

