    # 关于作者


    Al Sweigart 是一位软件开发人员、技术书籍作者，也是一个知道自己的毛巾在哪里的奇人（hoopy frood）。他写过几本面向初学者的编程书籍，包括同样由
    No Starch Press 出版的《Python自动化无聊工作》（Automate the Boring Stuff with Python）。他的书籍已根据
    Creative Commons 协议在其网站 http://www.inventwithpython.com/ 上免费提供。


    # 关于技术审查员


    Martin Tan 帮助在澳大利亚运营代码俱乐部（Code Club），并为 Moonhack 2016 编写了太空主题的 Scratch 和 Python
    项目，这些项目聚集了超过 9000 名儿童，打破了儿童同时编码的世界纪录。Martin 还担任渗透测试员，为各种开源项目和研究做出贡献。


