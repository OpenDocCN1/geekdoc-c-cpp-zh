    \ the Energy variable is 0, the spaceship can't fire. The Energy variable will\
    \ increase slowly over time, but it forces the player to carefully aim their shots\
    \ and not waste them.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_229_0.png)\n\
    \nYou'll need a variable to keep track of the spaceship's energy level. Select\
