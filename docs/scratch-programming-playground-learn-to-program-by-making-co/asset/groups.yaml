    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_264_0.png)


    ## CREATE THE LEVEL


    The new walking animation makes the Platformer game look more appealing. Now let''s
    change the plain background into a real level. What''s great about the code we''ve
    written for the Cat sprite to walk, jump, and fall is that it will work with a
