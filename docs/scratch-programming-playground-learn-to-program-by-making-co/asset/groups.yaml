    # # CHEAT MODE:

    WALK THROUGH WALLS


    Teleporting is a cool cheat, but players can''t control where they teleport to.
    Also, it''s too obvious that a player is cheating when they suddenly move across
    the Stage and through many walls. However, you can add a more subtle cheat that
    lets the cats move through walls when a special key is held down.


