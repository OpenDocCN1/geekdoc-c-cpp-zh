    # HANDLE STEEP SLOPES AND WALLS


    The Ground sprite has hills and slopes that the cat can walk on, and you can change
    the Ground sprite to pretty much any shape in the Paint Editor. This is a big
    improvement for the player compared to just walking on the bottom of the Stage,
    in the Basketball game. But now the problem is that the Cat sprite can walk up
    the steep slope on the left as easily as it can walk up the gentle slope on the
    right. This isn''t very realistic. We want the steep slope to block the cat. To
    do this, we''ll make a small change to the walking code blocks.


    At this point, the sprites are becoming overcrowded with lots of different scripts.
    So, right-click on the Scripts Area, and select clean to reorganize the scripts
    into neat rows.


    # 5. Add the Steep Slope Code


    Now we need to edit the Cat sprite''s walking code and add some new code. Instead
    of simply changing the x position by a particular value, we''ll use a new custom
    block. Let''s call it walk and give this new custom block an input called steps.
    An input is somewhat like a variable, but you can only use it in the custom block’s
    define block.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_243_1.png)'
