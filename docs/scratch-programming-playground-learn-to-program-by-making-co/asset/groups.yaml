  mdcn: "\n将以下脚本添加到“时间到了”（Out of Time）角色中。\n\n```\nwhen clicked\n  hide\n  forever\n\
    \    wait 1 secs\n    change Score by -1\n    if Score < 1 then\n      show\n\
    \      stop all\n    end\n```\n\n这段代码在游戏开始时隐藏“时间到了”角色，并在暂停1 秒后将 `Score` 变量减 1。当\
    \ `Score` 变量达到 0 时，代码会显示“时间到了”角色。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_225_0.png)\n\
    \n> ### 保存点\n> 点击绿色旗帜测试目前的代码。确保 `Score` 变量每秒减少 1 分。当 `Score` 变量为 0 时，“时间到了”角色应该显示。然后点击红色停止按钮并保存你的程序。\n\
    \n# 如果飞船被击中让其爆炸\n\n如果玩家不能足够快地发射小行星以防止分数达到 0，他们就会输。但如果小行星击中飞船，他们也会输。让我们添加代码来检测这种情况的发生并显示酷炫的动画。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_226_0.png)\n\n# 9. 上传爆炸角色\n\n有 8 张图片用于爆炸动画的帧。这些造型位于资源\
    \ ZIP 文件中的 `Explosion.sprite2` 文件中。\n\n在 Scratch 编辑器中，点击“新增角色”旁边的“从文件上传角色”按钮。选择\
    \ `Explosion.sprite2` 并点击确定。爆炸动画的 8 个造型将出现在角色的“造型”选项卡中。\n\n# 10. 为爆炸角色添加代码\n\n\
    对于“爆炸”角色，你将创建一个名为 `explode` 的新广播消息。当爆炸角色接收到此消息时，它将出现并切换它的造型来显示爆炸动画。\n\n当爆炸发生时，爆炸角色还会播放音效。点击区块区域上方的“声音”选项卡来加载声音。然后点击“新声音”下方的“从库中选择声音”按钮。选择“外星人吱声”（alien\
    \ creak）声音并点击确定。\n\n[content]为爆炸角色添加以下代码：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_227_0.png)\n\
    \n爆炸角色在接收到广播之前保持隐藏状态。然后它会播放声音，移动到飞船的位置，并切换七次造型，创造出极佳的爆炸动画！\n\n# II. 为飞船角色添加爆炸代码\n\
    \n当飞船角色碰到其中一个小行星克隆时，它会广播 `explode` 。为飞船角色添加以下脚本：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_227_1.png)\n\
    \n爆炸动画的原理是在移动到下一个造型之前短暂地显示其中一个造型。这类似于动画片和翻书使用的逐帧动画。每个造型都是帧，代码通过快速切换造型使爆炸看起来真实。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_228_0.png)\n\n# 保存点\n\n点击绿色旗帜测试目前的代码。确保游戏开始时“爆炸”角色是不可见的。飞入一个小行星，确保“爆炸”角色出现在飞船所在的位置。然后点击红色停止按钮并保存你的程序。\n\
    \n此程序的代码量太大，无法在此显示，但你可以在资源 ZIP 文件中查看完成的代码——文件名为 `asteroidbreaker.sb2`。\n\n# 版本\
    \ 2.0：有限弹药\n\n一旦你掌握了游戏，“小行星破碎者”（Asteroid Breaker）可能会变得太简单。让它变得简单的特性是你可以按按下空格键的速度不断发射。这种动作让玩家可以无目的地发射，而不是仔细地瞄准小行星。但我们可以通过添加一个新的\
    \ `Energy` 变量来改变这种行为。每次发射能量射线都会将变量变量 1。如果 `Energy` 变量为 0，飞船就无法发射。`Energy` 变量将随时间缓慢增加，但它迫使玩家仔细瞄准射击，不要浪费。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_229_0.png)\n\n你需要一个变量来跟踪飞船的能量水平。选择橙色的“数据”分类，点击“建立变量”按钮。创建一个名为\
    \ `Energy` 的变量，并选择“所有角色”。在区块区域中，确保勾选 `Energy` 旁边的复选框（就像勾选 `Score` 的复选框一样），这样它就会出现在舞台上。\n\
    \n`Energy` 变量在游戏开始时初始为 10，每当玩家发射一次能量射线减少 1。只有当 `Energy` 变量大于 0 时，玩家才能发射。\n\n修改“能量射线”角色中的代码以与以下匹配。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_230_0.png)\n\n脚本 1 是全新的。它在进入“重复”循环之前首先将\
    \ `Energy` 设置为 10。在循环内部，如果 `Energy` 小于 10，它将等待 0.4 秒。脚本 2 经过轻微修改，使得 `Energy` 必须大于\
    \ 0 才能发射。\n\n> ### 保存点\n> 点击绿色旗帜测试目前的代码。确保 `Energy` 变量在舞台上可见。发射能量射线并观察 `Energy`\
    \ 减少 1。当 `Energy` 为 0 时，飞船不应能够发射。能量每半秒恢复 1。然后点击红色停止按钮并保存你的程序。\n\n# 作弊模式：星爆弹\n\n\
    2.0 的有限能量更具挑战性，但让我们添加一个以星爆模式发射的秘密炸。无限能量的作弊会很无聊，因此我们将添加一个可以工作的特殊技能。\n\n在“如果”区块内部，“能量射线”角色移动到飞船并指向鼠标方向。然后它克隆自己\
    \ 24 次。在每个克隆之后，角色逆时针旋转 15 度。这导致了各个方向的能量射线星爆。\n\n> ### 保存点\n> 点击绿色旗帜测试目前的代码。按下\
    \ X 键，观察能量射线克隆从飞船角色飞向各个方向。由于这个作弊技能是秘密，请确保玩家无论能量水平如何都可以使用。\n\n# 总结\n\n在本章中，你构建了一个具有以下功能的游戏：\n\
    \n- 使用冰球推式的风格来控制飞船\n- 使用 `x velocity` 和 `y velocity` 变量来跟踪飞船角色移动的速度\n- 让角色在舞台边缘环绕\n\
    - 有小行星克隆，它们可以创建自己两个更小的克隆\n- 有 `Score` 和 `Energy` 变量，它们随时间分别减少和增加\n- 具有爆炸的逐帧动画\n\
    \n这个游戏提供了真正的挑战，但作为程序员，我们必须一个一个地添加这些功能！\n"
