- md: '

    Add the following code to the Fruit sprite.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_193_0.png)


    Script 1 hides the fruit at the start of the game. Script 2 cleans up the Stage
    when the game ends by deleting clones when the end game broadcast is received.
    Script 3 runs when the player slices the Begin Button sprite and starting clones.


    Let''s take a closer look at how script 3 works. After waiting 1 second, the number
    of fruit variable is set to 1, 2, 3, or 4. The code in the repeat-number of fruit
    loop will create a new clone on each iteration. Inside the loop, the original
    Fruit sprite sets its x position to a random position and its y position to -170,
    placing the original Fruit sprite somewhere at the bottom of the Stage.


    Next, the x velocity, y velocity, and rotation speed variables are randomly set
    (so the cloned fruit be thrown randomly). The sprite''s costume is also randomly
    set to costume 1, 2, 3, 4, or 5. All this code sets up the Fruit sprite to create
    a clone of itself. The clone''s position, variables, and costume are cloned from
    the original Fruit sprite, which means the original is ready to randomly set itself
    up for the next clone.


    The set x velocity to block uses a complicated equation, which is -1 * x position
    / 50 + pick random -2 to 2, for the x velocity variable''s value. The x velocity
    value determines how far to the left or right the fruit is thrown. This should
    be a small value, so the sprite''s x position (a random number from -200 to 200)
    is divided by 50, which is equal to a number between -4 and 4.


    We always want the fruit to be thrown toward the center of the Stage. That means
    if the Fruit sprite is on the left side of the Stage, its x position will be negative
    and the clone should be thrown to the right. In other words, the x velocity variable
    should be set to a positive number. And if the Fruit is on the right (with a positive
    x position), it should be thrown to the left.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_1.png)


    the x position / 50 number should be multiplied by -1; so if x position is positive,
    x velocity will be negative, and vice versa. Multiplying x velocity by -1 ensures
    that fruit on the left side of the Stage is thrown right and fruit on the right
    side is thrown left. Just to add some variation in the throws, a random number
    between -2 and 2 is added. You''ll see how the clones use the x velocity variable
    in Step 11.


    The x velocity and y variables are used together so the fruit is thrown in a curved
    shape called a parabola. The mathematics of parabolas is used in many science
    and engineering applications, but you don''t need to learn much about parabolas
    to use them in your games. Don''t worry if you don''t understand the math in these
    code blocks. As long as you copy the blocks from this book exactly shown, your
    fruit will be thrown correctly.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_195_0.png)


    ## II. Add the Code for the Fruit Sprite''s Clones


    When the original Fruit sprite creates a clone of itself, the clone running its
    own code to throw itself up and detect if it''s sliced.


    First, create the missed fruit message by clicking the broadcast block''s black
    triangle, selecting new message, and entering the name missed fruit. Then add
    the following code to the Fruit sprite.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_196_0.png)


    This script controls the Fruit clones, but it looks complicated, so let''s break
    it down step-by-step. The original Fruit sprite is hidden, so the first thing
    the clone does is show itself.


    Next, the code for gravity and slice detection repeats in a loop as long as the
    clone is up in the air. When the clone''s position drops below -170, the clone
    has fallen to the bottom of the Stage.


    The first part of the **repeat until** block makes the clone fall faster by gravity
    by changing the y velocity by -1. Then the x position, position, and direction
    of the clone are changed by the values in the x velocity, y velocity, and rotation
    speed variables, moving the fruit in a parabola-shaped path through the air. A
    parabola shape is drawn when the horizontal speed (in this case, x velocity) doesn''t
    change but the vertical speed (in this case, y velocity) decreases over time.


    The color in the **touching color** block should match the color of the Slice
    sprite. The clone detects whether it has been sliced by checking whether it is
    touching the color of the Slice sprite''s trail (Step 6). If it is touching this
    color, the **if then else** block does another check for the costume number of
    the clone is set to 5 (which is the costume number of the bomb costume).


    The x position / 50 number should be multiplied by -1; so if x position is positive,
    x velocity will be negative, and vice versa. Multiplying x velocity by -1 ensures
    that fruit on the left side of the Stage is thrown right and fruit on the right
    side is thrown left. Just to add some variation in the throws, a random number
    between -2 and 2 is added. You''ll see how the clones use the x velocity variable
    in Step 11.


    The x velocity and y variables are used together so the fruit is thrown in a curved
    shape called a parabola. The mathematics of parabolas is used in many science
    and engineering applications, but you don''t need to learn much about parabolas
    to use them in your games. Don''t worry if you don''t understand the math in these
    code blocks. As long as you copy the blocks from this book exactly shown, your
    fruit will be thrown correctly.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_195_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_1.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_196_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_197_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_198_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_1.png)


    ## 12. Create the Health Sprite


    The Health sprite will indicate how many more fruits the player can miss before
    losing the game. Each time the player misses a fruit, the sprite will switch to
    the next costume.


    Click the new sprite button next to New sprite. Open the Paint Area for this new
    sprite and rename it Health. In the Paint Editor, use Line tool to draw three
    Xs and duplicate this costume three times. I made my Xs increase from left to
    right, but you can style yours any way as long as you have three of them.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_0.png)


    Rename costume1 to 3 health, costume2 to 2 health, costume3 to 1 health, and costume4
    to 0 health. Leave all three Xs in 3 health blue. But for the other costumes,
    use the Fill tool. click the vertical gradient, and select a lighter red and a
    darker red color to paint the Xs a red gradient. The costume 2 health will have
    one red X, 1 health will have two red Xs, and 0 health will have three red Xs.
    Make sure that your costumes are in the same order as in the figure shown here:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_1.png)


    The Health sprite will switch costumes based on different broadcast messages it
    receives. Add the following code to the Health sprite. All the messages should
    already exist by this step, so you shouldn''t need to create them.


    ```

    when clicked

    hide

    when I receive start game

    switch costume to 3

    show

    when I receive missed fruit

    next costume

    if costume = 4 then

    broadcast end game

    when I receive end game

    hide

    ```


    When the player clicks the green flag and is at the start screen, the Health sprite
    hides itself in script 1. When the player slices the Begin Button sprite, it broadcasts
    the start game message, and the Health sprite sets itself to show the 3 health
    costume in script 2. Each time an unsliced fruit falls to the bottom of the Stage,
    that fruit broadcasts a missed fruit message, which makes the Health sprite switch
    to the next costume in script 3. This next costume will have one more red X. If
    the Health sprite switches to 0 health,


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_200_0.png)


    FRUIT SLICER 175

