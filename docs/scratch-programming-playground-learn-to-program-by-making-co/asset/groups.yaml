    Backdrop Library window. Select **brick wall1** and click **OK** to change the
    backdrop. The Stage will look like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_94_0.png)'
  - '[PAGE 95]


    Programming gravity requires variables. You can think of a variable as a box for
    storing numbers or text that you can use later in your program. We''ll create
    a variable that contains a number representing how fast the cat is falling.


    First, make sure the Cat sprite is selected in the Scripts List and then click
    the Scripts tab. In the orange Data category, click the Make Variable button to
    bring up the New Variable window. Enter y velocity as the variable name. (Velocity)
    means how fast something is going and in what direction. When y velocity is a
    positive number, the cat moves up. When y velocity is a negative number, the cat
    moves down.) Make sure For this sprite only is selected. (If you see only all
    sprites, the Stage is selected, not the Cat sprite.) Then click OK.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_95_0.png)


    Several new blocks will appear in the Data category, and one of them is the round
    y variable block, shown here:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_95_1.png)'
  - '[PAGE 96]


    # EXPLORE: FOR ALL SPRITES VS. FOR THIS SPRITE ONLY


    When you create the y velocity variable, you have to select For this sprite only.
    This option creates a variable that only the Cat sprite can use. The For all sprites
    option will create a variable that all sprites can use.


    To identify the kind of variable you''ve created, check the box next to the round
    variable block in the Blocks Area to make the variable appear on the Stage. If
    you selected For this sprite only, the sprite name will display in front of the
    variable name. But if you select For all sprites, only the variable name will
    show.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_96_0.png)


    The Cat sprite name before y velocity means that this is For this sprite only.


    Check this box to make the variable visible on the Stage.


    If you made a mistake, and the sprite name Cat does not appear at the start of
    the variable name in your program, right-click the y velocity block in the orange
    Data category and select delete variable from the menu. Then create the y velocity
    variable again, making sure you select For this sprite only.


    As with any variable block, you can place the y velocity block anywhere where
    you would normally enter a number or some'
  - '[PAGE 97]


    text. The code block will use the number or text set in the variable. When you
    use variables, your program can change the variable''s number or text while the
    program is running.


    To put a value in your variable, you use the orange set to block. For example,
    if you created a variable greeting, you could use set to to put the value Hello!
    In It, you could use greeting in a say block, which would be the same as entering
    Hello! (Don''t add these blocks or create a greeting variable in your Basketball
    program; this is just an example.)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_97_0.png)


    If you want to change the greeting text while the program is running, you can
    add another set to block to to your program. If the variable contains a number,
    you can add to or subtract from this number by using the change by block.


    Gravity makes objects accelerate downward. In the game, the Cat sprite has to
    move down, and the speed at which it moves down must change while the program
    is running. Add the following code to the Cat sprite to add gravity to your Scratch
    program. This is the minimal amount of code you need to make a sprite fall under
    gravity. You could add this code to any sprite to make it fall.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_97_1.png)'
- md: '

    When you click the green flag, the y velocity variable is set to 0, and then the
    script enters a forever loop. The y position (vertical position) of the Cat sprite
    is changed by y velocity, and y velocity is changed by -2. As the program goes
    through the loop, the y position will change faster and faster, making the cat
    fall faster and faster.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_98_0.png)


    ## 2. Add the Ground Level Code


    Right now, the cat falls. But we want the cat to stop when it hits the ground.
    Let''s keep adding to the Cat sprite''s code it looks like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_98_1.png)


    In this code, we set the y position of the ground level to -130. If the Cat sprite''s
    y position is greater than (above) the ground level, then y velocity is changed
    by -2 and the Cat sprite will fall. Eventually, the Cat sprite will fall past
    -130, and its y position will be less than (below) the -130 ground level. When
    that happens, the Cat sprite will be reset at the ground level of -130, and y
    velocity will go back to 0 to stop the sprite from falling.


    ### SAVE POINT


    Click the green flag to test the code so far. Drag the cat up using your mouse,
    and let go. Make sure the cat falls to the ground but does not fall past the edge
    of the Stage. You can experiment with different ground levels by changing -130
    to another number. Then click the red stop sign and save your program.


    When you''re done testing your program, make the y variable invisible on the Stage
    by unchecking the checkbox next to it in the orange Data category.


    ## 3. Add the Jumping Code to the Cat Sprite


    After adding the gravity code to the Cat sprite, making the cat jump is easy.
    Add this code to the Cat sprite:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_99_0.png)


    When you press the up arrow key, y velocity is set to the positive number 20,
    making the Cat sprite jump up. But the y velocity variable will still be changed
    by -2 each time the loop runs. So although the cat jumps by 20 at first, the next
    time through the loop it will be 18, 16, and so on. Notice that the **if then**
    block checks that the Cat sprite is on the ground. You shouldn''t be able to make
    the cat jump if it''s already in midair!


    When velocity is set to 0, the Cat sprite is at the peak of the jump. Then y velocity
    changes by -2 each time through the loop, and the Cat sprite continues falling
    until it hits the ground. Try experimenting with different numbers for the **set
    y velocity to change y velocity** by blocks. Figure out how to make the cat jump
    higher or lower (but always above the ground) or make gravity stronger or weaker.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_0.png)


    > SAVE POINT

    > Click the green flag to test the code so far. Press the up arrow key, and make
    sure the cat jumps up and falls back down. Then click the red stop sign and save
    your program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_1.png)


    ## MAKE THE CAT MOVE LEFT AND RIGHT


    Let''s add the Cat sprite''s walking code next so that the player can control
    the cat with the keyboard.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_100_2.png)


    ## 4. Add the Walking Code to the Cat Sprite


    Add the following code to the bottom of the Cat sprite’s code:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_101_0.png)


    Inside the forever loop, the program checks if the left or right arrow key is
    pressed. If it is, the Cat sprite switches to the next costume and changes its
    x position by -10 (moves to the left) or 10 (moves to the right). The Cat sprite
    comes with two costumes that you can view by clicking the Costumes tab above the
    Blocks Area. By switching between the two costumes using the next costume block,
    you can make it look like the cat is walking.![](img/44bc3b30bef7ae1ad43f0775f36b6931_101_1.png)


    ### SAVE POINT

    > Click the green flag to test the code so far. Press the left and right arrow
    keys, and make sure the cat moves in the correct direction. It''s okay if the
    cat walks backward when moving to the left; that''s what we want. Then click the
    red stop sign and save your program.


    ## MAKE A HOVERING BASKET HOOP


    Now that the Cat sprite is complete, let''s move on to the next sprite in the
    game: the basketball hoop.


    ## 5. Create the Hoop Sprite


    Click the Paint sprite button next to New sprite. Before starting, click the Vector
    button in the lower-right corner. The drawing tools will appear on the right side
    of the Paint Editor. (Vector mode lets you draw shapes rather than drawing individual
    pixels.) Click the Ellipse tool and use it to draw a hoop. You can also slide
    the Line width in the lower-left corner to make the ellipse thicker. Make sure
    the Paint Editor''s crosshairs are in the center of the hoop.![](img/44bc3b30bef7ae1ad43f0775f36b6931_102_0.png)


    Rename the sprite Hoop in its Info Area. We want the Hoop to play a sound when
    the player makes a basket, so let''s load the cheer. Click the Sounds tab at the
    top of the Blocks Area, and then click Choose sound from library. When the Sound
    Library opens, select cheer and click OK.![](img/44bc3b30bef7ae1ad43f0775f36b6931_103_0.png)


    The cheer sound will now appear as an option for the **play sound** block you''ll
    add to the Hoop sprite.![](img/44bc3b30bef7ae1ad43f0775f36b6931_103_1.png)


    Add the following code to the Hoop sprite to make it glide randomly around the
    top half of the Stage. You''ll need to create a broadcast message by clicking
    the **when I receive** block''s triangle and selecting new message. Name the broadcast
    message swoosh.


    ```

    when clicked

    glide 1 secs to x: [pick random -240 to 240] y: [pick random -50 to 180]

    when I receive swoosh

    play sound cheer

    say Swoosh! for 2 secs

    ```


    Script makes the hoop slide to a new position every second. A moving hoop will
    make the game more challenging to play! Script plays the cheer sound and displays
    “Swoosh!” when the swoosh broadcast is received. Later, we''ll make the Basketball
    sprite broadcast this message when a basket is made.


    ## 6. Create the Hitbox Sprite


    Now let''s think about how to create code that determines whether or not the player
    makes a basket. We could write a program that checks whether the basketball is
    simply touching the hoop. The hoop is so wide, just the edges of the basketball
    touching the hoop would count as a basket. We want the basket to count only if
    the basketball goes through the middle of the hoop. We''ll have to think of a
    better fix.![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_0.png)


    Instead, you can create a hitbox. A hitbox is a game-design term for a rectangular
    area that determines whether two game objects have collided with each other. We''ll
    make a hitbox sprite. Create a new sprite by clicking the Paint sprite button.
    Draw a small black square in the middle of the crosshairs using the Rectangle
    tool and selecting the solid fill option. Rename this sprite Hitbox. The Hitbox
    sprite will look like this:![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_1.png)


    Add the following code to the Hitbox sprite:![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_0.png)


    The Hitbox sprite will now follow the Hoop sprite, no matter where it glides.
    In Step 9, we''ll write a program that makes sure a basket counts only if the
    basketball is touching the Hitbox sprite, not the Hoop sprite. The basketball
    will have to be much closer to the middle of the hoop to count as a basket!![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_1.png)


    It looks odd to see a black square in the middle of the Hoop sprite, so let''s
    make the Hitbox sprite invisible. Add the set ghost effect block to the Hitbox
    sprite and set it to 100.![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_2.png)


    There''s a difference between the hide block and the set ghost effect to 100.
    If you used the hide block to make the Hitbox sprite invisible, the touching blocks
    would never detect that the ball was touching the Hitbox sprite, and the player
    would never be able to score. The set ghost effect to 100 makes the sprite invisible,
    but this block still allows the touching blocks to detect the Hitbox sprite''s
    presence.

