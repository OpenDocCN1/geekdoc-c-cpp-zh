    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_0.png)


    You''re allowed to copy and modify, or remix, other Scratchers'' code. All Scratch
    programs on the website are automatically released under a Creative Commons license,
    so you don''t need to ask the original creator for permission, as long as you
    give them credit. Scratchers remix each other''s programs to create their own
    versions.


    Still need help and want to talk to other Scratchers? Click the Discuss link at
    the top of the website to visit the forums.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_1.png)


    GET STARTED WITH SCRATCH 13'
  - '[PAGE 39]


    # SUMMARY


    The Scratch editor is a creative tool with great potential. You''ll see all sorts
    of Scratch projects on the Scratch website: games, cartoons, simulations, and
    informative presentation slides.


    Now that you know how to access the Scratch website, create an account, use the
    Scratch and Paint editors, and snap together code blocks into scripts, you''re
    ready to follow the step-by-step instructions in the rest of this book. If you
    have questions, be sure to use the Tips window in the Scratch editor and the discussion
    forums on the Scratch website to find the answers you need.


    Let''s start creating your first Scratch program!'
  - '[PAGE 40]


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_40_0.png)


    # # RAINBOW LINES IN SPACE!


    In this chapter, you''ll create a cool-looking animation: a rainbow V that flies
    through space and leaves colorful trails behind. This program was inspired by
    the demoscene, a subculture of elite programmers who made amazing graphical programs
    starting in the 1980s.'
  - '[PAGE 41]


    Demosceners made beautiful, elaborate programs called demos that showed off their
    artistic, musical, and programming skills. But most amazing of all, these programs
    were tiny—just a few kilobytes! The program we''ll write isn''t quite as small,
    but it''s dramatic and colorful, and it uses only a few lines of Scratch code.


    Before you start coding, look at the following figure to see what the final program
    will look like. Then go to https://www.nostarch.com/scratchplayground/ to play
    the animation.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_41_0.png)


    Just like demosceners, you can make beautiful programs. Let''s create our own
    graphics demo in Scratch!


    # SKETCH OUT THE DESIGN


    The first step of turning an idea into a Scratch program is to sketch out what
    you want it to look like. Planning your program helps you figure out the sprites
    you want and how they''ll behave. I recommend drawing your ideas on paper so you
    can cross them out if you don''t like them and write down notes and reminders.'
  - '[PAGE 42]


    It''s also best to keep the project simple. If you start by making a complicated
    game like Minecraft or Zelda, you''ll quickly realize that it''s a lot of work.
    It''s more rewarding to finish a small project than to deal with the frustration
    of an unending, unfinished, and unplayable game.


    When you''ve completed your simple game, you can then build on top of it to make
    it more complex, which is the idea behind iterative development. First, you make
    the program work. Then, you make the program better. You can always add cool elements
    to the basic program after you finish it. Or, if your program becomes too complicated,
    you can return to your sketches and figure out what the sketch you want to remove.


    Don''t worry about a sketch making the sketch nice. It''s more important to have
    a solid plan for the main parts of the program. In my sketch, I have three parts:
    A, B, and C. We will work on these parts one at a time until we''ve built the
    full program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_42_0.png)


    After you''ve completed a sketch of what you want your program to do, you can
    start programming! Go to https://scratch.mit.edu/, sign up for an account on the
    site, and log in (having an account lets you save your programs on the Scratch
    website). After you''ve logged in, click the Create button at the'
  - '[PAGE 43]


    top of your screen to start making your own Scratch project. Then click the text
    field in the top left to change the name of the project from Untitled to Rainbow
    Lines. Let''s begin by tackling Part A of the sketch.


    # CREATE THE SPACE BACKDROP


    First, let''s clean up sprites we won''t use and set a background.


    # 1. Clean Up and Set the Stage


    Every time you create a new Scratch project, you''ll see an orange sprite on a
    blank, white Stage. We don''t need the cat sprite for our program, right-click
    the Sprite1 cat in the Sprite List, and select delete to remove the cat from the
    Stage and the Sprite List.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_0.png)


    Click the Choose backdrop from library button (which looks like a landscape painting)
    under New backdrop.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_1.png)'
  - '[PAGE 44]


    The Backdrop Library window will open and display all the backdrops in alphabetical
    order. Select the stars backdrop and click OK.


    > Make sure All is selected, or the stars backdrop won''t show up.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44_0.png)


    +   - Select the stars backdrop.

    - Click OK to finish.


    Now the Stage''s backdrop looks like outer space!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44_1.png)'
  - '[PAGE 45]


    # CREATE THREE BOUNCING DOTS


    Next, we''ll add three new sprites that represent the three points of the flying
    V.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_45_0.png)


    # 2. Paint the Dot


    Click the Paint new sprite button (which looks like a paint-brush) next to New
    sprite.


    | x: 167 y: -180 |

    | New sprite: | |

    | | Paint new sprite |


    A new sprite named Sprite1 is created in the Sprite List. Clicking this button
    also switches to the point tab, which contains the Paint Editor. Use the Brush
    tool to draw a small red dot near the crosshairs in the Paint Editor. It might
    help to zoom in by clicking the Zoom button (which looks like a magnifying glass)
    in the Paint Editor.'
  - '[PAGE 46]


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_0.png)


    Click the i button for the Sprite1 dot sprite to open its Info Area. (You can
    also open the Info Area by right-clicking the sprite and selecting info.)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_1.png)'
  - '[PAGE 47]


    Change the sprite''s name from Sprite1 to Dot 1. Then click the back button to
    close the Info Area and display the Sprite List again.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_47_0.png)


    # 3. Add Code for the Dot 1 Sprite


    Now we can start programming. Click the Scripts tab to make the Scripts Area visible.
    Add the following code to the Scripts Area. You can find these blocks in the *Events*
    (brown), *Motion* (dark blue), *Operators* (green), and *Control* (yellow) categories.
    If you have trouble understanding how to drag these blocks, view the animation
    at https://www.nostarch.com/scratchplayground/


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_47_1.png)


    When you click the green flag, the Dot 1 sprite points in a random direction between
    –180 and 180 degrees. Then, the **forever** loop moves the sprite forward 10 steps
    and makes the sprite bounce when it hits the edge of the Stage. The sprite will
    continue to do this forever.


    Notice that the Dot 1 sprite isn''t drawing any rainbow lines yet. We''ll do that
    later when we''ve created more sprites.'
  - '[PAGE 48]


    # EXPLORE: DIRECTION AND DEGREES


    Words like up or right are perfectly understood directions by humans like you
    and me. But the computer needs a number to indicate an exact direction. All sprites
    in Scratch have their own direction number. The direction numbers are between
    -180 and 180 degrees. Pointing at 0 degrees is facing up. Pointing at 90 degrees
    is facing to the right. The following figure shows several directions and their
    degrees. Notice that the degrees increase in the clockwise direction and decrease
    in the counterclockwise direction. Also, notice that -180 and 180 degrees point
    in the same direction: down.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_48_0.png)


    The pick random -180 to 180 block to use as the direction. Then the point in direction
    block points the sprite in that direction. This means that the sprite could be
    pointed in any possible direction.


    Let''s write a new script that demonstrates how degrees work. Open a new tab by
    pressing CTRL-T in your web browser, and go to https://scratch.mit.edu/ to open
    a new Scratch editor. You can edit multiple Scratch programs at the same time.


    (continued)'
- md: "\nIn the Scripts Area for the cat sprite named Sprite1, add the following code\
    \ using blocks from the Events (brown), Control (yellow), Motion (dark blue),\
    \ and Looks (purple) categories. Keep in mind that we're writing a totally separate\
    \ program from the Rainbow Lines program!\n\n```\nwhen clicked\nforever\n  point\
    \ towards mouse-pointer\n  say direction\n```\n\nWhen you run this program, the\
    \ cat sprite points toward the mouse. The cat will say the direction in which\
    \ it's pointing.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_49_0.png)\n\nNotice\
    \ that the direction number changes as the cat's direction changes.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_49_1.png)\n\
    \n## 4. Duplicate the Dot I\n\nRight-click the Dot 1 sprite in the Sprite List\
    \ and select **duplicate**. Do this twice so that you make two duplicates: Dot\
    \ 2 and Dot 3. (Scratch automatically names the sprites with increasing numbers.)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_50_0.png)\n\n## SAVE POINT\n\nClick\
    \ the green flag to test the code so far. Check that all three dots are moving\
    \ and bouncing around the Stage. When you duplicated the sprites, you also duplicated\
    \ the sprite code. Click the red stop sign and save your program.\n\n## DRAW THE\
    \ RAINBOW LINES\n\nNow that we've created all the bouncing dots, we can create\
    \ a fourth dot sprite to draw the rainbow lines. We'll write a program that makes\
    \ this drawing dot move quickly between the three bouncing dot sprites, drawing\
    \ a line as it moves. This process will repeat three times, and then after 10\
    \ seconds the screen will clear.\n\n## 5. Add the Code for the Drawing Dot Sprite\n\
    \nRight-click one of the bouncing dots sprites and select **duplicate**. Because\
    \ this is a duplicate of the bouncing dots, it has some code we need to delete.\
    \ In its Scripts Area, delete all the code blocks by right-clicking the **when\
    \ green flag clicked** block and then selecting **delete**. You can also delete\
    \ blocks by dragging them to the Blocks Area in the middle of the editor, where\
    \ they'll disappear.\n\nClick the i button and rename this sprite Drawing Dot.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_0.png)\n\nAdd the following two\
    \ scripts to the Drawing Dot sprite. You can find these blocks in the Events (brown),\
    \ Pen (turquoise), Control (yellow), and Motion (dark blue) categories.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_1.png)\n\
    \nIn script 1, make sure you use the go block, not the go to x block. Also, be\
    \ sure to change the go blocks so they aren't going to the mousepointer. To do\
    \ so, click the black triangle on the block and select a sprite from the menu.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_2.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_52_0.png)\n\
    \nBefore you run the code, let's talk through how it works. When you click the\
    \ green flag in script, the Drawing sprite runs the clear block to clear away\
    \ any pen drawing already on the Stage. Then the script runs the pen block: as\
    \ the sprite moves around, it draws a line on the Stage.\n\nTo better understand\
    \ what the pen down block does, imagine drawing a marker on a piece of paper while\
    \ you walk around it: a line would be drawn following you! The drawing dot goes\
    \ to Dot 1, puts its pen down, goes to Dot 2, and then goes to Dot 3. Next, the\
    \ change pen color by 10 block changes the colors slightly. (You can change this\
    \ number to make the colors faster.) At the same time, Dot 1, Dot 2, and Dot 3\
    \ sprites continue to move around on their own. So the line that the Drawing sprite\
    \ draws also moves. Script is a lot simpler to understand. Code waits 10 seconds\
    \ and then clears the screen of any marks made by the Pen blocks. Now the Stage\
    \ won't become overcrowded with rainbow lines.\n\n## SAVE POINT\n\nClick the green\
    \ flag to test the code so far. You should see a rainbow move across the Stage.\
    \ Then, every 10 seconds, the rainbows clear. Click the red stop sign and save\
    \ your program!\n\n## THE COMPLETE PROGRAM\n\nThe final code for the entire program\
    \ is shown here. Notice that the code for Dot 1, Dot 2, and Dot 3 sprites is identical.\
    \ If your program isn’t working correctly, check your code against this:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_53_0.png)\n\
    \n## TURBO MODE\n\nIf you hold shift while clicking the green flag, you can start\
    \ the program in Turbo Mode. The computer is usually able to run code quickly,\
    \ but a program that draws slows down the computer. In Turbo Mode, instead of\
    \ drawing to the screen after each code block, you won't notice the skipped drawings,\
    \ and the program will look like it's running faster.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_53_1.png)\n\
    \nTo end Turbo Mode, shift-click the green flag again.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_54_0.png)\n\
    \n## VERSION 2.0: RAINBOW TRIANGLES\n\nYour Rainbow Lines program is complete\
    \ as is, but you can take this program to the next level. You can always think\
    \ of new ideas to add to your programs after you have the basics working. For\
    \ version 2.0 of the program, let's connect Dot 3 and Dot 1 so that, instead of\
    \ a rainbow, the program has a rainbow triangle. Modify the code for the Drawing\
    \ sprite to match the following, but leave the rest of the code the same.\n\n\
    ```\nwhen clicked\nclear\nset pen size to 8\nforever\n  pen up\n  go to Dot 1\n\
    \  pen down\n  go to Dot 2\n  go to Dot 3\n  go to Dot 1\n  change pen color by\
    \ 10\n```\n\nThe new **go to Dot 1** block draws a line from Dot 3 to 1, forming\
    \ a triangle.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_55_0.png)\n\n## SAVE\
    \ POINT\n\nClick the green flag to test the code so far. Make sure you see a rainbow\
    \ triangle moving around the Stage. Then click the red stop sign and save your\
    \ program.\n\n## VERSION 3.0: TWO RAINBOW LINES\n\nFor version 3.0, let's create\
    \ two separate lines instead of a single line. Right-click the Dot 3 sprite and\
    \ select **duplicate** to make a Dot 4 sprite. Then modify the Drawing sprite's\
    \ code to match the following.\n\n```\nwhen clicked\n  clear\n  set pen size to\
    \ 8\n  forever\n    pen up\n    go to Dot 1\n    pen down\n    go to Dot 2\n \
    \   pen up\n    go to Dot 3\n    pen down\n    go to Dot 4\n    change pen color\
    \ by 10\n```\n\nThe new code puts the pen down while moving between Dot 1 and\
    \ Dot 2. Then it lifts the pen up, goes to Dot 3, and puts the pen down again\
    \ to draw a line from Dot 3 to 4.\n\n## SAVE POINT\n\nClick the green flag to\
    \ test the code so far. Make sure you see two rainbow lines. Then click the red\
    \ stop sign and save your program.\n\n## VERSION 4.0: YOU DECIDE!\n\nYou can start\
    \ making your own changes to create new-scene programs. In this chapter's program\
    \ you drew lines, but if you learn the mathematics behind Bézier curves, you can\
    \ make beautiful curves. Another mathematical concept that produces beautiful\
    \ images is fractals, as shown in the following figure. Go to the Scratch website\
    \ and search for \"bézier,\" \"fractals,\" or \"demoscene\" to get ideas for your\
    \ own programs. You can also look at the code blocks for every Scratch program\
    \ by clicking the See inside the program's web page. Check out some example projects\
    \ at https://www.nostarch.com/scratchplayground/\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_57_0.png)\n\
    \n## SUMMARY\n\nIn this chapter, you built a project that:\n\n- Has custom sprites\
    \ that you created (even if they are just dots)\n- Uses the pick random block\
    \ to point a sprite in a random direction\n- Makes sprites move and bounce off\
    \ the edges of the Stage\n- Duplicates sprites and their code\n- Uses the Pen\
    \ blocks to draw rainbow lines\n\nThis project is a demo that users can watch\
    \ but can't control. In Chapter 3, you'll make a maze game that lets players interact\
    \ with the program by using the keyboard instead of just watching. This will be\
    \ the first real game project in this book!\n\n## REVIEW QUESTIONS\n\nTry to answer\
    \ the following practice questions to test what you've learned. You probably won't\
    \ know all the answers off the top of your head, but you can explore the Scratch\
    \ editor to figure out the answers. (The answers are also online at http://www.nostarch.com/scratchplayground/)\n\
    \n- What happens when a sprite moves after it has run the pen down block?\n- Some\
    \ code moves a sprite, but no line is drawn behind it. What might cause this bug?\n\
    - Which block causes the lines in the Rainbow Lines program to look like a rainbow?\n\
    - Which code block do you use to make the rainbow lines thicker?\n- How do you\
    \ turn on Turbo Mode? How do you turn it off?\n- How do you duplicate a sprite\
    \ and its code blocks?\n- Where does a sprite point when its direction is 90 degrees?\n\
    - What is the degree direction for pointing up?\n- In which color of blocks category\
    \ would you find code blocks to point down and move in that direction?\n- How\
    \ do you select a new backdrop from Scratch's Backdrop Library?\n- You see a sprite\
    \ named Sprite1 in the Sprite List. How do you rename this sprite?\n"
  mdcn: "\n\n在名为 Sprite1 的猫角色的脚本区域（Scripts Area）中，使用来自事件（棕色）、控制（黄色）、动作（深蓝色）和外观（紫色）类区块添加以下代码。请记住，我们正在编写一个与“彩虹线”（Rainbow\
    \ Lines）完全不同的程序！\n\n```\nwhen clicked\nforever\n  point towards mouse-pointer\n\
    \  say direction\n```\n\n当你运行这个程序时，猫角色会指向鼠标指针。猫会说出它所指向的方向。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_49_0.png)\n\
    \n注意，随着猫的方向改变，方向数字也会随之变化。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_49_1.png)\n\
    \n## 4. 复制圆点 I\n\n在角色列表中右键点击 Dot 1 角色并选择 **duplicate**（复制）。重复此操作两次，创建两个副本：Dot\
    \ 2 和 Dot 3。（Scratch 会自动用递增的数字命名角色。）\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_50_0.png)\n\
    \n## 保存点\n\n点击绿色旗帜测试目前的代码。检查所有三个圆点是否都在舞台（Stage）上移动并弹跳。当你复制角色时，你也复制了角色代码。点击红色停止按钮并保存你的程序。\n\
    \n## 绘制彩虹线\n\n现在我们已经创建了所有跳动的圆点，可以创建第四个圆点角色来绘制彩虹线。我们将编写一个程序，让这个绘制圆点在三个跳动的圆点角色之间快速移动，并在移动时画线。这个过程将重复三次，10秒后屏幕将清空。\n\
    \n## 5. 为绘制圆点角色添加代码\n\n右键点击其中一个跳动的圆点角色并选择 **duplicate**（复制）。因为它是跳动圆点的副本，它包含一些我们需要删除的代码。在它的脚本区域中，右键点击\
    \ **when green flag clicked** 区块并选择 **delete**（删除）来删除所有代码区块。你也可以将区块拖到编辑器中间的区块区域，这样它们就会消失。\n\
    \n点击 i 按钮并将此角色重命名为 Drawing Dot（绘制圆点）。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_0.png)\n\
    \n为 Drawing Dot 角色添加以下两个脚本。你可以在事件（棕色）、画笔（青色）、控制（黄色）和动作（深蓝色）类中找到这些区块。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_1.png)\n\
    \n在脚本 1 中，确保你使用的是 `go` 区块，而不是 `go to x` 区块。此外，确保修改 `go` 区块，让它们不再指向鼠标指针。要这样做，请点击区块上的黑色三角形并从菜单中选择一个角色。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_51_2.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_52_0.png)\n\
    \n在运行代码之前，让我们过一下它是如何工作的。当你点击脚本中的绿色旗帜时，Drawing 角色运行 `clear` 区块来清除舞台上已有的画笔画迹。然后脚本运行画笔区块：随着角色的移动，它会在舞台上画出线条。\n\
    \n为了更好地理解 `pen down`（画笔落下）区块的作用，想象一下在行走时在纸上用记号笔画画：线条会跟随你移动！绘制圆点去 Dot 1，放下画笔，去\
    \ Dot 2，然后去 Dot 3。接下来，`change pen color by 10` 区块改变颜色（你可以更改这个数字来让颜色变化更快）。同时，Dot\
    \ 1、Dot 2 和 Dot 3 角色继续独立移动。因此 Drawing 角色画的线也会移动。这个脚本简单得多。代码等待 10 秒，然后清除画笔留下的任何痕迹。现在舞台不会被彩虹线挤满。\n\
    \n## 保存点\n\n点击绿色旗帜测试目前的代码。你会看到彩虹在舞台上移动。每隔 10 秒彩虹清除一次。点击红色停止按钮并保存你的程序！\n\n## 完整程序\n\
    \n这里显示整个程序的最终代码。注意 Dot 1、Dot 2 和 Dot 3 角色的代码是完全相同的。如果你的程序运行异常，请对比此代码：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_53_0.png)\n\
    \n## 加速模式 (Turbo Mode)\n\n如果在点击绿色旗帜时按住 Shift 键，可以在加速模式下启动程序。计算机通常可以快速运行代码，但绘图程序会减慢速度。在加速模式下，你不会观察到每个代码区块之间跳跃的绘图过程，程序看起来运行得更快。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_53_1.png)\n\n要结束加速模式，再次 Shift-点击绿色旗帜。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_54_0.png)\n\n## 版本 2.0：彩虹三角形\n\n你的“彩虹线”程序已经完成了，但你可以将此程序推向新水平。在基础功能运行正常后，你可以不断构思新想法添加到程序中。对于程序的\
    \ 2.0 版本，让我们连接 Dot 3 和 Dot 1，让程序画出彩虹三角形而不是彩虹线。修改 Drawing 角色的代码如下，但保持其余代码不变。\n\n\
    ```\nwhen clicked\nclear\nset pen size to 8\nforever\n  pen up\n  go to Dot 1\n\
    \  pen down\n  go to Dot 2\n  go to Dot 3\n  go to Dot 1\n  change pen color by\
    \ 10\n```\n\n新的 **go to Dot 1** 区块从 Dot 3 画到 1，形成一个三角形。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_55_0.png)\n\
