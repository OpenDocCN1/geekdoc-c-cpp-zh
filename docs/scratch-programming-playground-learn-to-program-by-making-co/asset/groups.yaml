    8, we want to go back to costume 4, not costume 12.


    The mod block helps us do this wrap around the costume numbers. We can control
    the costume that is displayed by using a math trick: because mod 8 = 0, a frame
    value of 8 will show the first walking costume! We have to add 4 to this number,
    because the first walking costume is actually costume 4. (Remember, costume 1,
    costume 2, and costume 3 are the standing, jumping, and falling costumes, respectively.)
    This sum is then used with the floor block.


    Floor is a programming term that means "round down." Sometimes frame will be set
    to a number like 4.25 or 4.5, and so 4 + frame would be 8.25 or 8.5, but we just
    want to round down to show costume 8.


