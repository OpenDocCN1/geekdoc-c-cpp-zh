    Delete the original costume1 and costume2 costumes, but keep the hitbox costume.
    Put the costumes in the following order (it''s important that you match this order
    exactly):


    - 1. Stand

    - 2. Jump

    - 3. Fall

    - 4. Walk1

    - 5. Walk2

    - 6. Walk3

    -7. Walk4

    8. Walk5

    9. Walk6

    10. Walk7

    11. Walk8

    12. hitbox


    Each costume has not only a name (like Walk1, Jump, or Fall) but also a number.
    The costume number is based on the costume''s order in the Costumes tab. For example,
    the costume at the top is named Stand, but it is also known as costume 1. The
    costume beneath it is named Jump, but it is also known as costume 2. The code
    we add in the next step will refer to costumes by their names and numbers.


    ## 12. Create the Set Correct Costume Block


    With all these different costumes, it will be a bit tricky to determine which
    frame we need to show and when. We''ll use the idea of animation frames; several
    frames shown together quickly make a moving image, just like a flip book.


    To keep track of the frames, create two variables named frame and frames per costume.
    Then add two set blocks for these initial variables to the Cat sprite''s when
    green flag clicked script.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_259_0.png)


    Now the setup is done.

    As the player moves the Cat left or right, we want the frame variable to increase.
    The frames per costume variable keeps track of how fast or slow the animation
    runs.

    Let''s edit the code in the **define walk** custom block to increase the frame
    variable by an amount calculated from frames per costume.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_259_1.png)


    When the cat is standing still (that is, not moving left or right), the frame
    variable should be reset to 0. Modify the Cat sprite’s existing **when green flag
    clicked** script to add a third **if then** block that resets the frame variable.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_260_0.png)


    > Be sure to put the green **and** block in the **if then** block first. You want
    the **not** blocks to go inside the **and** block.


    Now let’s write some code to determine which costume to show. We’ll use this code
    in a few places in the scripts we’ve written, let’s make a custom block.


    In the dark purple **More Blocks** category, click the **Make a Block** button
    and name this block **set correct costume**. Click the gray **Options** triangle,
    check the option **Run without screen refresh**, and then click **OK**. Add the
    following blocks to the Cat sprite, starting with the new **define set correct
    costume** block.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_260_1.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_261_0.png)


    If the Cat sprite is on the ground (or has just started jumping or falling so
    that in air is less 3), then we want to display either the standing costume or
    one of the walking costumes. Remember that the when green flagged script keeps
    setting frame to 0 if the player isn''t pressing the A key or D key. When frame
    is 0, the switch costume to Stand displays the Stand costume. Otherwise, we must
    calculate which of the eight walking costumes to show. This calculation refers
    to costumes by their numbers, which are based on their order in the Costumes tab.


    Which walking costume is shown is decided by the switch costume to floor of 4
    + frame mod 8 blocks. Wow, that looks complicated! Let''s break it down to better
    understand each part.


    The mod block does a modulo mathematical operation, which is the remainder part
    of division. For example, 7 / 3 = 2 remainder 1, so mod 3 = 1 (the remainder part).
    We''ll use mod to calculate which costume number to display.


    236 CHAPTER 9


    The frame variable keeps increasing, even though we only have eight walking costumes.
    When frame is set to a number from 0 to 7, we want it to display costumes 4 to
    11. This is why our code has the 4 + frame blocks. But when frame increases to
    8, we want to go back to costume 4, not costume 12.


    The mod block helps us do this wrap around the costume numbers. We can control
    the costume that is displayed by using a math trick: because mod 8 = 0, a frame
    value of 8 will show the first walking costume! We have to add 4 to this number,
    because the first walking costume is actually costume 4. (Remember, costume 1,
    costume 2, and costume 3 are the standing, jumping, and falling costumes, respectively.)
    This sum is then used with the floor block.


    Floor is a programming term that means "round down." Sometimes frame will be set
    to a number like 4.25 or 4.5, and so 4 + frame would be 8.25 or 8.5, but we just
    want to round down to show costume 8.


    Whew! That''s the most math you''ve seen in this book so far, but when it''s broken
    down, it becomes easier to understand.


    The code in the else part of the if block handles what happens if in air is greater
    than or equal to 3. We check y velocity to see if the cat is falling (that is,
    if y velocity is less than or equal to 0) or jumping (that is, if y velocity is
    greater than 0) and switch to the correct costume code finishes.


    Replace the switch costume to costume1 blocks in the define handle group and define
    walk blocks with the new set correct costume blocks. Also, add the change frame
    by 1 / frames per costume blocks so that the frame variable increases over time,
    as shown here.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_262_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_263_0.png)


