- md: "\none of the gradient buttons to select the gradient type. I used the vertical\
    \ gradient.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_174_0.png)\n\nClick the\
    \ Paint Editor's canvas to fill the background with your gradient. If you want\
    \ to experiment, click the Undo button at the top of the Paint Editor before you\
    \ try a different gradient. Be sure to fill in the holes in the R letters. When\
