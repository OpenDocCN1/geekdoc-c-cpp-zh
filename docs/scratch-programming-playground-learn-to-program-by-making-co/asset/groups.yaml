    从 Sprite2 库窗口选择 Ball，以创建一个名为 Tennis Ball2 的新角色。你将克隆这个第二个球来创建轨迹。与网球（Tennis Ball）的克隆体不同，Tennis
    Ball2 的克隆体没有 `当收到 bounce` 模块。将此代码添加到 Tennis Ball2 角色中：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_143_0.png)


    克隆体程序设置的操作是移动到当前 Tennis Ball 角色的位置。网球持续移动，但克隆体留在原地，缩小并变得透明。在这次缩小和淡出动画结束后，克隆体会被删除。


    你还需要用以下代码更新 Tennis Ball 角色：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_143_1.png)


    此脚本在等待 0.1 秒后创建一个新的 Tennis Ball2 克隆体，从而创建出网球的轨迹。


    ## 保存点


    点击绿色旗帜测试目前的代码。确保有一条不断缩小的 Tennis Ball2 克隆体跟随原始的 Tennis Ball 角色。然后点击红色停止按钮并保存你的程序。


    ## 为游戏结束”角色添加动画入场


    当玩家失败时，GAME OVER 文字会直接出现。如果 GAME OVER 文字能像砖块（Brick）克隆体那样具有动画入场会更有趣。修改 Game Over
    角色的代码以匹配以下代码。首先，在声音（Sounds）选项卡上点击“从库中选择声音”按钮，加载 gong 音效。你将创建一个新的广播消息 `stop game`，这将告诉挡板（Paddle）和网球（Tennis
    Ball）角色停止移动。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_144_0.png)


    在游戏开始时，Game Over 角色隐藏自己并将虚影效果设置为 100。当 `显示` 模块在游戏结束时运行时，GAME OVER 文字仍然是完全不可见的。`重复
    10` 模块内的动画代码通过将虚影效果变为 -10，让 GAME OVER 文字缓慢淡入。`顺时针旋转 15 度` 和 `将大小增加 12` 模块会让文字旋转并放大。在等待
    4 秒后，`停止全部` 模块结束程序。


    为了在 Tennis Ball 和 Paddle 角色中处理 `stop game` 广播消息，请向这两个角色都添加以下代码：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_145_0.png)


    你之所以需要使用 `停止此角色内的其他脚本` 模块而不是 `停止全部`，是因为在 GAME OVER 文字执行动画期间时，程序需要继续运行。`停止此角色内的其他脚本`
    会停止 Tennis Ball 和 Paddle 角色的移动，但会允许程序中的其他角色继续运行。当 Game Over 角色在屏幕上显示完成后，`停止全部`
    模块将结束整个程序。


    > 保存点

    点击绿色旗帜测试目前的代码。尝试输掉游戏，确保 GAME OVER 文字具有动画入场，而不是仅仅瞬间出现在屏幕上。然后点击红色停止按钮并保存你的程序。


    ## 为“你胜利”角色添加动画入场


    让我们也给 You Win 角色增加一个华丽的动画入场。更新 You Win 角色的代码以匹配以下内容。你需要在声音选项卡上点击“从库中选择声音”按钮，加载名为
    gong 的音效。


    这里有两组动画，一组在 `重复 10` 模块中。`重复 10` 模块中的代码让 You Win 角色逐渐淡入可见、放大并向上移动。在这段短动画播放后，`重复
    2` 模块的代码将角色的亮度增加到 50，等待分之一，然后将亮度重置为 0。这会让角色看起来在闪烁。在等待 4 秒后，`停止全部` 模块结束程序。


    ## 保存点


    点击绿色旗帜测试目前的代码。当你赢得游戏时，确保 You win! 文字具有动画入场，而不是仅仅瞬间出现在屏幕上。为了让胜利更快，临时将 `等待直到 分数
    = 28` 模块改为 `等待直到 分数 = 1`。这样你只需要打破一块砖块就能赢。保存你的程序。


    ## 总结


    - 在这一章中，你构建了一个游戏：

    - 使用克隆来快速创建许多砖块（Brick）角色的副本以及一系列 Tennis Ball2 角色的轨迹

    - 使用鼠标而非键盘方向键来控制挡板（Paddle）角色

    - 显示了你使用画编辑器（Paint Editor）文本工具创建的 GAME OVER 和 You Win! 消息

    - 为角色添加了多个动画入场和出场效果

    - 使用音效和背景音乐让游戏感觉更加生动


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_147_0.png)


    制作这个打块游戏为你提供了几项技术，你可以将其应用到未来的游戏中。你可以在许多程序中加入动画入场、颜色闪烁和音效，让它们更有趣、更好玩。但最好的方法总是确保你的游戏基础、简约的版本运行正常，然后再开始让它变得好看。


    这一章还介绍了克隆技术，这是一项你可以应用到未来游戏中的技术。你可以在许多程序中加入动画入场、颜色闪烁和音效，让它们更有趣、更好玩。


    ## 复习


    尝试回答以下问题以测试你学到的知识。（我不为这一章中冷掉的蛇类笑话道歉；我觉得它们简直“嘶”十足/hiss-terical。）


    1. 程序是如何知道什么时候……

    2. 哪个模块创建了克隆体？

    3. 有三种旋转样式？

    4. 为什么角色在您点击绿色旗帜后会隐藏自己？

    5. `等待` 模块的作用是什么？

