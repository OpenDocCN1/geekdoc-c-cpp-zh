- md: "\nThis script hides the Slice sprite and sets the pen to the right size and\
    \ color. Then the forever loop continually runs the draw slice block.\n\nNext,\
    \ you need to define the define draw slice block. You want draw slice to draw\
    \ a line with the first coordinates: the first value in the slice list (for the\
    \ x position) and the first in the y list (for the y position). This line goes\
    \ to the x and y positions in the next values of the slice x and y lists, then\
    \ the next values, and so on, until the last pair of values is reached. Our code\
    \ will make sure the lengths of the slice x and y lists are always the same. Add\
    \ the following to the define draw slice block. Notice that the length of slice\
    \ x is dark orange and from the Data category, not the green Operators category.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_184_0.png)\n\nThis code lifts the pen\
    \ before moving it to the first x-y-coordinate values in slice x and y and then\
    \ sets the pen down. Inside the repeat loop, the code uses a temporary variable\
    \ named i to keep track of where the pen should move next.\n\nThe first time through\
    \ the repeat until loop, the sprite moves to value 2 of the slice x and slice\
    \ y lists. The pen draws a line as the sprite moves. Then i increases by 1 the\
    \ next time through the loop, and the sprite moves to value 3 of the slice x and\
    \ slice y lists. The loop continues until i is larger than the number of values\
    \ in the list (that is, length of the list).\n\n# NOTE All the code under define\
    \ draw slice could have been put in the other script's forever loop, but then\
    \ it wouldn't have run in Turbo Mode. The Run without screen refresh option that\
    \ you checked when you made the draw slice block enables Turbo Mode for the code\
    \ in define draw slice. Otherwise, the slice drawing would be too slow for the\
    \ game.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_185_0.png)\n\n# SAVE POINT\
    \ Click the green flag to test the code so far. Hold down the mouse button and\
    \ drag the cursor around the Stage. Make sure the light trail is drawn behind\
    \ the mouse cursor and that it quickly disappears when the mouse button is released.\
    \ Then click the red stop sign and save your program.\n\n# MAKE THE BEGIN BUTTON\n\
    \nFruit Slicer requires the player to have quick reflexes. So let's add a button\
    \ to the start screen to give the player a chance to get ready to play. Slicing\
    \ a begin button with the mouse will start the game.\n\n## 7. Create the Begin\
    \ Button Sprite\n\nYou don't need to draw the begin button, because Scratch already\
    \ has one. Click the Choose sprite from library button next to New sprite. Select\
    \ Button1 from the Sprite Library window and click OK. Open the Info Area for\
    \ this sprite and rename it Begin Button.\n\nClick the Costumes tab at the top\
    \ of the Blocks Area. Select the white color; then, using the Text tool, type\
    \ begin and click somewhere on the canvas but not on the text. Then resize and\
    \ drag the text over the bottom part of the green button.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_186_0.png)\n\
    \nUsing the Text tool, create the text begin again. And again, click somewhere\
    \ on the canvas but not on the text. Grab the top handle of the text box and rotate\
    \ the text so it's upside down. Then position it at the top of the green button.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_186_1.png)\n\nAdd this code to the\
    \ Begin Button sprite:\n\n```\nwhen I receive start screen\nforever\n  turn (2)\
    \ degrees\n  if <touching color?> then\n    hide\n    broadcast start game and\
    \ wait\n  stop this script\n```\n\nSet the color in the **touching color?** block\
    \ to the color of the Slice sprite in the Sprite List. Click the block's color\
    \ square, and then click the light blue color, as you did in Step 6.\nThe Begin\
    \ Button slowly rotates on the Stage until the player slices it. The button knows\
    \ it's sliced when the light blue slicing color touches it, at which point it\
    \ broadcasts the start game message to all the other sprites.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_187_0.png)\n\
    \n> SAVE POINT\nClick the green flag to test the code so far. Slice the Begin\
    \ Button sprite. Make sure it disappears and the backdrop changes when it's sliced.\
    \ Then click the red stop sign and save your program.\n\n# MAKE THE FRUIT AND\
    \ BOMBS THROW THEMSELVES\n\nBecause the fruits in the game look different but\
    \ have the same behavior, you'll use one sprite with the same code but different\
    \ costumes.\n\n## 8. Create the Fruit Sprite\n\nClick the Choose sprite library\
    \ button next to New sprite, and select Apple from the Sprite Library. Then click\
    \ OK. Click the new sprite's button to open the Info Area, and rename the sprite\
    \ Fruit.\n\nClick the Fruit sprite' tab. Click the Choose costume library button\
    \ next to New costume. Add the banana costume. Click the button again and add\
    \ the orange costume. Then click the button one more time to add the watermelon-a\
    \ costume. Then click the button one more time to add the watermelon-a costume.\
    \ costume.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_188_0.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_188_1.png)\n\
    \n## 9. Make the Sliced Costumes\n\nThe fruit costumes were drawn in Vector Mode,\
    \ which means they were drawn as shapes rather than a grid of pixels. Although\
    \ vector images look better than bitmap images, vector images can't be split in\
    \ half. You'll need to convert the costumes to Bitmap Mode first. (Wait, let's\
    \ re-order based on the OCR flow).\n\nActually, the OCR text has some jumbled\
    \ sectionsumbles. Let's re-align based on the logical flow:\n\nThe fruit costumes\
    \ were drawn in Vector Mode, which means they were drawn as shapes rather than\
    \ a grid of pixels. Although vector images look better than bitmap images, vector\
    \ images can't be split in half. You'll need to convert the costumes to Bitmap\
    \ Mode first.\n\nFor each duplicated costume (costumes 6, 7, 8, and 9), select\
    \ the costume and click the **Convert to bitmap**. Then you use the Select tool\
    \ to drag a selection rectangle over half of the costume. Drag the selected half\
    \ away from the other half, and rotate it a little to make it look like it's cut\
    \ in.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_189_0.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_188_1.png)\n\
    \n## 10. Add the Code to the Fruit Sprite\n\nThe Fruit sprite now has all the\
    \ costumes it needs, so let's code its behavior. The Fruit sprite creates clones\
    \ of itself, and each clone will randomly choose 1, 2, 3, 4, or 5. Then the clone\
    \ throws itself up in the air. The clone will detect if it was sliced and switch\
    \ to its sliced costume. Or, if the clone randomly chose the bomb costume and\
    \ the player slices it, it will end the game.\n\nCreate For sprite only variables\
    \ named x velocity, y velocity, rotation speed, and number of fruit. All clones\
    \ will use these variables to determine how they are thrown up and fall down.\
    \ Make sure these variables are For this sprite. The only for all sprites variables\
    \ in this program are Score and High Score.\n\nIf the bomb is sliced, the game\
    \ will make a noise. Click the Sounds tab and then click the Choose sound from\
    \ library button under New sound. Select alien creak2 and click OK.\n"
  mdcn: "\n此脚本会隐藏 Slice（切片）角色，并将画笔设置为合适的大小和颜色。然后，无限循环会持续运行 `draw slice` 模块。\n\n接下来，你需要定义\
    \ `define draw slice` 模块。你希望 `draw slice` 根据第一组坐标画一条线：`slice` 列表中的第一个值（作为 x 坐标）和\
    \ `y` 列表中的第一个值（作为 y 坐标）。这条线将连接到 `slice x` 和 `slice y` 列表中下一个值对应的 x 和 y 位置，然后是下一个值，依此类推，直到达到最后一对值。我们的代码将确保\
    \ `slice x` 和 `slice y` 列表的长度始终相同。将以下内容添加到 `define draw slice` 模块中。注意，`slice x`\
    \ 的长度是深橙色的，它来自 Data（数据）分类，而不是绿色的 Operators（运算符）分类。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_184_0.png)\n\
    \n这段代码在移动到 `slice x` 和 `slice y` 中的第一组 x-y 坐标值之前抬起画笔，然后放下画笔。在 `repeat` 循环内部，代码使用一个名为\
    \ `i` 的临时变量来跟踪画笔下一步应该移动的位置。\n\n第一次执行 `repeat until` 循环时，角色移动到 `slice x` 和 `slice\
    \ y` 列表中的值 2。画笔在角色移动时画一条线。在下一次循环中，`i` 增加 1，角色移动到 `slice x` 和 `slice y` 列表中的值 3。循环一直持续，直到\
    \ `i` 大于列表中值的数量（即列表的长度）。\n\n# 注意 `define draw slice` 下的所有代码都可以放在另一个脚本的无限循环中，但那样它们就不会在\
    \ Turbo 模式（加速模式）下运行。你在创建 `draw slice` 模块时勾选的“不经屏幕刷新”（Run without screen refresh）选项将启用\
    \ `define draw slice` 中代码的 Turbo 模式。否则，切片的速度对于游戏来说太慢了。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_185_0.png)\n\
    \n# 保存点 点击绿色旗帜以测试目前为止的代码。按住鼠标键并在舞台（Stage）上拖动光标。确保光迹画在鼠标光标后面，并在松开鼠标键时它迅速消失。然后点击红色停止按钮并保存你的程序。\n\
    \n#制作开始按钮\n\n水果切片游戏（Fruit Slicer）要求玩家具有敏捷的反应。因此，我们在启动屏幕上添加一个按钮，给玩家一个准备游戏的机会。用鼠标切开开始按钮将开始游戏。\n\
    \n## 7. 创建开始按钮角色\n\n你不需要绘制开始按钮，因为 Scratch 已经有一个。点击“新建角色”（New sprite）旁边的“从库中选择角色”按钮。在角色库窗口中选择\
    \ Button1，然后点击确定。打开该角色的信息区域（Info Area）并将其重命名为 Begin Button（开始按钮）。\n\n点击区块区域（Blocks\
    \ Area）顶部的造型（Costumes）选项卡。选择白色；然后使用文字工具输入 begin，点击画布上的某处（不要点在文字上）。然后调整文字大小并将其拖到绿色按钮的底部。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_186_0.png)\n\n再次使用文字工具创建文字 begin。再次如此，点击画布上的某处（不要点在文字上）。抓住文本框顶部的句柄并旋转文字使其倒置。然后将其放置在绿色按钮的顶部。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_186_1.png)\n\n为 Begin Button 角色添加以下代码：\n\
    \n```\nwhen I receive start screen\nforever\n  turn (2) degrees\n  if <touching\
    \ color?> then\n    hide\n    broadcast start game and wait\n  stop this script\n\
    ```\n\n将 **touching color?** 区块中的颜色设置为角色列表中 Slice 角色的颜色。点击该区块的颜色方块，然后像你在第 6 中做的那样点击浅蓝色。\n\
    Begin Button 在舞台上缓慢旋转，直到玩家切到它。当浅蓝色的切片颜色碰到它时，按钮知道自己被切开了，此时它向所有其他角色广播开始游戏的消息。\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_187_0.png)\n\n> 保存点 点击绿色旗帜测试目前为止的代码。切开\
    \ Begin Button 角色。确保它在被切开时消失且背景发生变化。然后点击红色停止按钮并保存你的程序。\n\n# 让水果和炸弹自动发射\n\n由于游戏中的水果看起来不同但行为相同，你将使用一个具有相同代码但不同造型的角色。\n\
    \n## 8. 创建水果角色\n\n点击“新建角色”旁边的“从库中选择角色”按钮，并在角色库中选择 Apple（苹果）。然后点击确定。点击新角色的按钮打开信息区域，并将角色重命名为\
    \ Fruit（水果）。\n\n点击 Fruit 角色的造型（sprite）选项卡。点击“新建造型”（New costume）旁边的“从库选择造型”按钮。添加\
    \ banana（香蕉）造型。再次点击按钮添加 orange（橙子）造型。再点击一次按钮添加 watermelon-a（西瓜a）造型。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_188_0.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_188_1.png)\n\n## 9.制作切开后的造型\n\n水果造型是在矢量模式（Vector\
    \ Mode）下绘制的，这意味着它们是形状而非像素网格。虽然矢量图像比位图图像好看，但矢量图像无法被切开。你需要先将造型转换为位图。\n\n实际上，OCR\
