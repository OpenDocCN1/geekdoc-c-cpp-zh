    \ these steps to make variables named x velocity, y velocity, and rotation. All\
    \ are For this sprite only variables. In Step 6, we'll use the hits to keep track\
    \ of how many times the asteroid has been hit and the size of the asteroid.\n\n\
    Let's write some code that makes the Asteroid sprite create new clones that appear\
    \ on the Stage; each clone will have a random velocity and rotation. The result\
    \ will be an unpredictable asteroid swarm... in space!\n\nAdd the following scripts\
    \ to the Asteroid sprite.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_219_0.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_220_0.png)\n\nLike the Energy Blast\
    \ sprite, the original Asteroid sprite will hide itself and generate clones. New\
    \ clones are created every 8 to 12 seconds. When the clone is created, it shows\
    \ itself, assigned random velocities and rotations, and begins moving.\n\nAlso,\
    \ like the Spaceship and Energy Blast sprites, the Asteroid sprites will wrap\
    \ around the edges of the Stage. Add the following script to the Asteroid sprite.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_220_1.png)\n\nASTEROID BREAKER . .\
    \ . IN SPACE! 195\n\n# SAVE POINT\n\nClick the green flag to test the code so\
    \ far. Make sure the Asteroid sprite slowly moves and rotates and that it wraps\
    \ around the edges of the Stage. Also, make sure that new clones appear every\
    \ 8 to 12 seconds. Then click the red sign and save your program.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_221_0.png)\n\
    \n# MAKE ASTEROIDS SPLIT IN TWO WHEN HIT\n\nWhen an Energy Blast clone hits an\
    \ Asteroid, the Asteroid will create two new smaller clones of itself.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_221_1.png)\n\
    \nASTEROID BREAKER . . . IN SPACE! 195\n\n# 6. Add the Asteroid's Splitting\n\n\
    When an Energy Blast clone hits an Asteroid, the Asteroid will create two new\
    \ smaller clones of itself. From the Sounds tab, click the Choose sound button.\
    \ Then select chomp and click OK. You need to create a new broadcast named asteroid\
    \ blasted.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_222_0.png)\n\nWhen an Energy\
    \ Blast clone hits an Asteroid, the Asteroid will create two new smaller clones\
    \ of itself. The Asteroid will play the chomp sound and the asteroid blasted message.\
    \ The Asteroid adds 2 points to Score and increases the hits variable by 1. The\
    \ Asteroid will also shrink a little, changing its size by -25. This is how.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_222_1.png)\n\nASTEROID BREAKER . .\
    \ . IN SPACE! 197\n\nWhen an Energy Blast clone hits an Asteroid, the Asteroid\
    \ will create two new smaller clones of itself. The Asteroid will play the chomp\
    \ sound and the asteroid blasted message. The code after the delete clone block\
    \ doesn't run, because the clone no longer exists. This prevents the asteroid\
    \ from becoming.\n\n# 7. Add the Asteroid Blasted Message to the Energy Blast\
    \ Sprite\n\nSelect the Energy Blast sprite in the Sprite List, and add this script\
    \ to it:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_223_0.png)\n\nAll the Energy\
    \ Blast clones will receive the asteroid blasted message, but only those currently\
    \ touching an Asteroid sprite will be deleted. (One will be touching an Asteroid,\
    \ because the message is only broadcast by the Asteroid sprite when it is touching\
    \ an Energy Blast sprite.) This is how an Energy Blast sprite disappears after\
    \ hitting an Asteroid.\n\n> Click the green flag to test the code so far. Try\
    \ blasting some of the asteroids. Make sure the energy blast disappears and the\
    \ Asteroid sprite is replaced by two smaller clones. The fourth time an asteroid\
    \ is hit, it should just disappear. Then click the red stop sign and save your\
    \ program.\n\n# KEEP SCORE AND MAKE A TIMER\n\nThe Asteroid Breaker game quickly\
    \ becomes challenging when many tiny asteroids are flying around the Stage. A\
    \ good game strategy is to be slow and careful, finishing off small Asteroid sprites\
    \ before firing at larger ones. But we also want to put some pressure on the player,\
    \ so let's make the Score variable start dropping by 1 point every second and\
    \ have the game end when the Score is 0. This way, the player will have to keep\
    \ up a quicker pace when blasting Asteroid sprites.\n\n# 8. Create the Out of\
    \ Time Sprite\n\nClick the Paint sprite button next to New sprite. In the Paint\
    \ Editor, use the Text tool to write OUT OF TIME in red capital letters.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_224_0.png)\n\
    \nClick this new sprite's button in the Sprite List to open its Info Area. Rename\
    \ the sprite Out of Time.\n"
  mdcn: "\n现在将以下脚本添加到“能量弹”（Energy Blast）精灵中。玩家按下空格键将发射能量弹。原始的能量弹精灵会创建克隆，克隆会显示自己并向鼠标移动。由于能量弹克隆是向鼠标移动的，玩家可以通过移动来瞄准能量弹。\n\
    \n```\nwhen space = key pressed\nif player is alive = yes and I am a clone = no\
    \ then\ngo to Spaceship\npoint towards mouse-pointer\ncreate clone of myself\n\
    ```\n\n如果我们不规定这段代码仅对原始角色运行，那么**按下空格键**（space key pressed）模块下的代码将在原始角色*以及*克隆上运行。但我们不希望现有的克隆再次创建克隆。**如果...那么**模块会检查“我是一个克隆”（I\
    \ am a clone）变量是否设置为否，这样只有原始能量弹精灵会运行这段代码并创建克隆。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_217_0.png)\n\
    \n显然，只有在玩家存活时，飞船精灵才能发射能量弹克隆，因此代码还会检查“玩家存活”变量是否设置为是。\n\n接下来，为能量弹精灵添加以下代码，以便克隆在创建后能向鼠标移动。\n\
    \n```\nwhen I start as a clone\n  set I am a clone to yes\n  play sound laser!\n\
    \  repeat 50\n    move 10 steps\n    if x position < -235 then\n      set x to\
    \ 235\n    if x position > 235 then\n      set x to -235\n    if y position <\
    \ -175 then\n      set y to 175\n    if y position > 175 then\n      set y to\
    \ -175\n  delete this clone\n```\n\n克隆首先显示自己并向前移动。克隆也应该像飞船精灵一样在舞台边缘环绕，因此我们在这里使用了类似的代码来实现这一点。\n\
    \n注意，克隆会将它们自己的“我是一个克隆”变量设置为是。这样做是为了让克隆不会运行“按下空格键”脚本中的代码。该脚本中的“如果...那么”模块仅在“我是一个克隆”设置为否时才会运行代码。\n\
    \n克隆每次前进10步，重复50次。这意味着能量弹克隆有有限的范围，而不会一直移动下去。当循环重复50次完成后，克隆会删除自己并从舞台上消失。\n\n点击绿色旗帜测试目前的代码。用鼠标瞄准并按下空格键发射。确保能量弹克隆从飞船精灵开始并向鼠标移动。克隆应该在舞台边缘环绕并最终消失。然后点击红色停止按钮并保存你的程序。\n\
    \n# 制作漂浮的小行星\n\n现在我们需要为玩家提供可以击中的目标。游戏中的小行星会一直漂浮，直到被能量弹克隆击中。它们会不断碎裂成两个更小的小行星，直到它们小到可以被气化为止。\n\
    \n# 5. 创建小行星精灵\n\n点击“从文件上传精灵”按钮并选择 `asteroid.png` 文件来添加新的小行星精灵。该文件位于资源压缩文件中。点击橙色的“数据”分类，然后点击“制作变量”按钮。创建一个仅限此种色的变量，名为\
    \ `hits`。重复这些步骤创建名为 `x velocity`、`y velocity` 和 `rotation` 的变量。它们都是“仅限此精灵”变量。在第6步中，我们将使用\
    \ `hits` 来跟踪小行星被击中的次数以及小行星的大小。\n\n让我们写一些代码，让小行星精灵创建出现在舞台上的新克隆；每个克隆将具有随机的速度和旋转角度。这将产生一个不可预测的小行星群……在太空中！\n\
    \n为小行星精灵添加以下脚本。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_219_0.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_220_0.png)\n\
    \n和能量弹精灵一样，原始的小行星精灵会隐藏自己并生成克隆。每隔8到12秒创建一个克隆。当克隆被创建时，它会显示自己，分配随机的速度和旋转角度，并开始移动。\n\
    \n同样，像飞船和能量弹精灵一样，小行星精灵会在舞台边缘环绕。为小行星精灵添加以下脚本。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_220_1.png)\n\
    \n小行星破碎者 . . . 在太空中！ 195\n\n# 保存点\n\n点击绿色旗帜测试目前的代码。确保小行星精灵在缓慢移动和旋转，并且在舞台边缘环绕。还要确保每隔8到12秒出现一个新的克隆。然后点击红色按钮并保存你的程序。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_221_0.png)\n\n# 让小行星在被击中时分裂为\n\n当能量弹克隆击中小行星时，小行星将创建两个新的更小的克隆。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_221_1.png)\n\n小行星破碎者 . . . 在太空中！ 195\n\
    \n# 6. 添加小行星的分裂逻辑\n\n当能量弹克隆击中小行星时，小行星将创建两个新的更小的克隆。从“声音”选项卡，点击“选择声音”按钮。然后选择 `chomp`\
    \ 并点击“确定”。你需要创建一个名为 `asteroid blasted` 的新广播。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_222_0.png)\n\
    \n当能量弹克隆击中小行星时，小行星将创建两个新的更小的克隆。小行星将播放 `chomp` 声音并发送 `asteroid blasted` 消息。小行星为得分（Score）增加2分，并将\
    \ `hits` 变量增加1。小行星还会稍微缩小，将其尺寸改变-25。实现方法如下。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_222_1.png)\n\
    \n小行星破碎者 . . . 在太空中！ 197\n\n当能量弹克隆击中小行星时，小行星将创建两个新的更小的克隆。小行星将播放 `chomp` 声音并发送\
    \ `asteroid blasted` 消息。“删除克隆”模块之后的代码不会运行，因为克隆已不存在。这防止了小行星变成。\n\n# 7. 为能量弹精灵添加“小行星被击”消息\n\
    \n在精灵列表中选择能量弹精灵，为其添加此脚本：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_223_0.png)\n\
    \n所有的能量弹克隆都会接收 `asteroid blasted` 消息，但只有正在接触小行星的克隆会被删除。（只有一个正在接触小行星，因为小行星只有在接触能量弹精灵时才会广播。）这就是能量弹在击中小行星后消失的方式。\n\
    \n> 点击绿色旗帜测试目前的代码。尝试击中一些小行星。确保能量弹消失且小行星精灵被两个更小的克隆取代。当小行星被第四次击中时，它应该直接消失。然后点击红色停止按钮并保存你的程序。\n\
    \n# 计分与计时\n\n当许多微小的小行星在舞台上飞舞时，“小行星破碎者”游戏很快变得具有挑战性。一种很好的策略是缓慢小心，在射击较大的小行星之前先处理较小的小行星。但我们也想给玩家一些压力，所以让我们让\
    \ `Score` 变量每秒减少1分，并在分数为0时结束游戏。这样，玩家在击中小行星时必须保持更快的节奏。\n\n# 8. 创建“时间到”精灵\n\n点击“新建精灵”旁边的“绘制精灵”按钮。在绘制编辑器中使用文本工具用红色大写字母写下\
    \ OUT OF TIME。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_224_0.png)\n\n点击列表中此新精灵的按钮打开其信息区域。将精灵重命名为\
    \ Out of Time。\n"
