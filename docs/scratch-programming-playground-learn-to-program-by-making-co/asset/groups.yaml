    ## Add an Animated Entrance for the Game Over Sprite


    When the player loses, the GAME OVER text simply appears. It would be more exciting
    if the GAME OVER text had an animated entrance like the Brick clones do. Modify
    the Game Over sprite''s code to match the following code. First load the gong
    sound at the start of by clicking the Choose sound from library button on the
    Sounds tab. You''ll create a new broadcast message stop game that will tell the
    Paddle and Tennis Ball sprites to stop moving.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_144_0.png)


    At the start of the game, the Game Over sprite hides itself and sets its ghost
    effect to 100. When the show block runs at the end of the game, the GAME OVER
    text is still completely invisible. The animation code inside the repeat 10 block
    makes the GAME OVER text slowly fade in by changing the ghost effect by -10. The
    turn clockwise 15 degrees and change size by 12 blocks rotate and enlarge the
    text. After a 4 second pause, the stop all block ends the program.


    To handle the stop game broadcast message in the Tennis Ball and Paddle sprites,
    add the following code to both of these sprites:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_145_0.png)


    The reason you need to use the stop other scripts in sprite block instead of stop
    all is that the program needs to continue running while the GAME OVER text is
    animated. The stop other scripts in sprite will stop the Tennis Ball and Paddle
    sprites from moving but let the other sprites in the program continue running.
    When the Game Over sprite has finished appearing on the screen, the stop all block
    will end the entire program.


