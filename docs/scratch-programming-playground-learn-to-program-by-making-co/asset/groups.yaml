    If you're lost, open platformer2.sb in the resources ZIP file and continue reading\
    \ from this point.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_243_0.png)\n\n\
    ## HANDLE STEEP SLOPES AND WALLS\n\nThe Ground sprite has hills and slopes that\
    \ the cat can walk on, and you can change the Ground sprite to pretty much any\
    \ shape in the Paint Editor. This is a big improvement for the player compared\
    \ to just walking on the bottom of the Stage, in the Basketball game. But now\
    \ the problem is that the Cat sprite can walk up the steep slope on the left as\
    \ easily as it can walk up the gentle slope on the right. This isn't very realistic.\
    \ We want the steep slope to block the cat. To do this, we'll make a small change\
    \ to the walking code blocks.\n\nAt this point, the sprites are becoming overcrowded\
    \ with lots of different scripts. So, right-click on the Scripts Area, and select\
    \ clean to reorganize the scripts into neat rows.\n\n## 5. Add the Steep Slope\
    \ Code\n\nNow we need to edit the Cat sprite's walking code and add some new code.\
    \ Instead of simply changing the x position by a particular value, we'll use a\
    \ new custom block. Let's call it walk and give this new custom block an input\
    \ called steps. An input is somewhat like a variable, but you can only use it\
    \ in the custom block’s define block.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_243_1.png)\n\
    \nClick the Make a Block button in the dark purple More Blocks category to make\
    \ the walk block. Be sure to click the Add a number input button to make the steps\
    \ input. When we want to call the new walk block, we'll have to define that with\
    \ a number of steps to take. Make sure you check the Run without screen refresh\
    \ checkbox!\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_244_0.png)\n\nThis code\
    \ also requires you to make a variable for the Cat sprite named lift (which should\
    \ be for this sprite only). We'll use this new variable to determine whether a\
    \ slope is too steep for the cat to walk up. This code is a little complicated,\
    \ but we'll walk through it step-by-step. For now, make the cat sprite's code\
    \ look like the following:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_244_1.png)\n\
    \n```\ndefine walk steps\n```\n\nAdd the new walk definition.\n\n```\nchange x\
    \ by steps\n```\n\nThe value of steps is used to make the cat walk ...\n\n```\n\
    set ground lift 0\n```\n\n```\nrepeat until not touching Ground ? or ground lift\
    \ = 8\n```\n\n```\nchange y by 1\n```\n\n```\nchange ground lift = 1\n```\n\n\
    ```\nif ground lift = 8 then\n```\n\n```\nchange x by -1 steps\n```\n\nand to\
    \ prevent the cat from walking up steep slopes.\n\n```\nchange y by -8\n```\n\n\
    We want the cat to walk to six units, as we did earlier, we use -6 and 6 in the\
    \ walking script when we call walk. In the define walk block, the steps input\
    \ block is used in until the change x by blocks. This makes the code more compact,\
    \ because we can use the same script for moving the cat to the left (with the\
    \ walk -6 block) or to the right (with the walk 6 block).\n\nThe code in the repeat\
    \ until loop uses the lift variable to determine if the slope is a walkable slope\
    \ or a wall that should block the Cat Sprite's progress. The ground lift variable\
    \ starts at 0 and changes by 1 each time the repeat until loop lifts the Cat sprite's\
    \ y position by 1. This loop continues until the sprite is no longer touching\
    \ the ground or ground lift is equal to 8.\n\nIf ground lift is less than 8, then\
    \ the slope is steep. The sprite can walk up the slope, so the define walk script\
    \ doesn't have to do anything else.\n\nBut if ground lift = 8, the repeat until\
    \ loop stops looping. This code means “the sprite has been lifted up by 8 but\
    \ it's still touching the Ground sprite, this must be a steep slope.”\n\nIn that\
    \ case, we need to undo the lift and the walking movement. The change y by -8\
    \ and change x by -1 * steps blocks undo the Cat sprite's movement. Multiplying\
    \ the walk input by -1 gives the opposite number of the input and variable.\n\n\
    - Gentle slope: The Cat sprite is lifted eight steps and is no longer touching\
    \ the ground. The Cat sprite can walk up this slope.\n- Steep slope: The Cat sprite\
    \ is lifted eight steps but is still touching the ground. The Cat sprite cannot\
    \ walk up this slope.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_246_0.png)\n\
    \nThis code is exactly like the code in the Maze Runner game in Chapter 3 that\
    \ blocks the player from walking through walls.\n\n> SAVE POINT\n> Click the green\
    \ flag to test the code so far. Use the A and D keys to make the cat walk around.\
    \ If you're lost, open platformer2.sb in the resources ZIP file and continue reading\
    \ from this point.\n\n## MAKE THE CAT JUMP HIGH AND LOW\n\nWith the walking code\
    \ done, let's add jumping. But in many games, the player can do a short jump by\
    \ pressing the jump button or higher by holding it down. We want to use high and\
    \ low jumping in this platform game, so we'll have to\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_247_0.png)\n\
    \n## 6. Add the Jumping Code\n\nLet's first create a for sprite only variable\
    \ named air. This variable will be set to 0 whenever the Cat sprite is on the\
    \ ground. But in air will start increasing when the Cat sprite is jumping. The\
    \ larger the in air value is, the longer the cat will have off the ground. Add\
    \ this script to the Cat sprite:\n\n```\nwhen [space clicked]\nforever\nif <key\
    \ [w] pressed?> and <in air < 8>> then\n  set [y velocity] to [14]\n```\n\n222\
    \ CHAPTER 9\n\nThe forever loop keeps checking whether the W key is held down.\
    \ If it is, this will give the Cat sprite a velocity of 14—that is, the Cat sprite\
    \ will be moving up. But note that there are two conditions for the cat to continue\
    \ moving up—the player must hold down W and air variable must be less than 8.\n\
    \nLet's edit two of the existing Cat sprite scripts to add air variable that limits\
    \ how high the cat can jump.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_248_0.png)\n\
    \nThe player first holds down the W key to make the cat jump, the y velocity variable\
    \ is set to 14. This makes the code in the forever loop in script change the Cat's\
    \ y position by the positive y velocity, moving it upward. At the start of the\
    \ jump, the air variable is increasing but is still less than 8. So if the player\
    \ continues to hold down the W key, y velocity keeps getting set to 14 instead\
    \ of decreasing because of the change velocity by -2 block. This causes the jump\
    \ to go upward longer than if the player held down the W key for just one iteration\
    \ through the loop. But eventually air will equal or greater than 8, so it won't\
    \ matter if the W key is pressed.\n\nAt this point, the y velocity variable will\
    \ decrease as expected, and the Cat sprite will eventually fall. In script, when\
    \ the cat is on the ground, the air variable is reset to 0.\n"
