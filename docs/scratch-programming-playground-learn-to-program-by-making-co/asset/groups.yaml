    hide

    ```


    当玩家点击绿色旗标志并处于启动屏幕时，Health 角色在脚本 1 中隐藏自己。当玩家切割“开始”角色时，它会广播“start game”消息，Health
    角色通过脚本 2 将自己设置为显示 3 health 造型。每当一个未切割的水果掉到舞台底部时，该水果就会广播“missed fruit”消息，使 Health
    角色在脚本 3 中切换到下一个造型。这个下一个造型将多出一个红色 X。如果 Health 角色切换到 0 health，


