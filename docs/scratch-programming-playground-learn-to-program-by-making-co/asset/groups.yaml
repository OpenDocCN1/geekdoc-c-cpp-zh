    # VERSION 3.0: TRAPS


    After you''ve played Maze Runner against another player a few times, running through
    the mazes can become too easy. Let''s make Maze Runner a bit more difficult by
    adding spike traps. The spike traps will shoot out spikes and retract them. If
    a player touches the trap while the spikes are out, the player will slow down.
    This gives the other player time to race ahead!


    # Draw a New Sprite for the Traps


