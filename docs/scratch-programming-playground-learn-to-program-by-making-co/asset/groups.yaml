    \ Then click the\n"
  mdcn: "\n\n# 完整程序\n\n整个程序的最终代码在此处。如果你的程序运行不正常，请对照此代码进行检查。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_162_0.png)\n\
    \n```\nwhen clicked\nswitch costume to costume1\nforever\n  go to Head\n  wait\
    \ 0.01 secs\n  create clone of myself\nwhen I start as a clone\npoint in direction\
    \ pick random 0 to 360\nwait 0.1 secs\nswitch costume to costume2\nwait Score\
    \ / 5 secs\ndelete this clone\n```\n\n# 第 2.0 版本：添加奖励水果\n\n在游戏中只有一种目标，久而久之会变得无聊。让我们添加一些奖励水果吧！\n\
    \n让我们添加第二种的水果，当蛇吃到它时，分数会增加 3 分。点击“从库中选择角色”按钮。在“角色库”窗口中，选择“水果拼盘”（Fruit Platter）并点击确定。（如果你的蛇是一条蟒，也许可以选择一个甜点。）\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_163_0.png)\n\n为新角色添加此代码：\n\n```\nwhen\
    \ clicked\n  hide\n  set size to 50 %\n  forever\n    wait 10 secs\n    go to\
    \ x: pick random -150 to 150 y: pick random -150 to 150\n    show\nwhen clicked\n\
    \  forever\n    if touching Head ? then\n      hide\n      change Score by 3\n\
    ```\n\n“水果拼盘”角色的代码与“苹果”角色的代码几乎相同，不同之处在于蛇碰到它后，在重新出现在舞台其他地方之前会有 10 秒的暂停。有了这些奖励分，蛇的分数将会非常可观！\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_164_0.png)\n\n# 保存点\n\n点击绿色旗帜测试目前的代码。10\
    \ 秒后，“水果拼盘”角色应该会出来。确保当蛇碰到“水果拼盘”角色时，Score 变量增加了 3 分，并且角色消失了。然后点击红色停止按钮并保存你的程序。\n\
    \n# 作弊模式：无敌\n\n让蛇变得非常、非常长会很有趣！让我们添加一个作弊模式，让蛇可以一直生长而不会撞到自己。我们还会给蛇添加彩虹效果，这样玩家就能看到作弊模式何时开启。\n\
    \n## 修改头部\n\n修改“头部”角色的代码以与以下内容匹配。你是在之前编写的脚本基础上添加内容，同时也添加了一个完整的脚本。这两个都需要创建一个名为\
    \ `cheat mode`（作弊模式）的新变量。将此变量设为所有角色。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_165_0.png)\n\
    \n脚本控制着作弊模式如何工作。按下空格键可以在 `cheat mode` 变量开启和关闭之间切换。当设置为“开启”时，即使头部碰到了较浅颜色，也不会广播“游戏结束”的消息。原因是，在脚本\
    \ ① 中，你在检查蛇是否撞到自己的 `如果...那么` 块中**添加了 cheat mode = off**。如果 `cheat mode` 设置为“开启”，蛇是否撞到自己就不重要了，因为在运行\
    \ **broadcast game over and wait** 之前，**碰到颜色？** 和 **cheat mode = off** 必须同时为真。\n\
    \n脚本 ② 也有一个 `如果...那么` 块，在作弊模式开启时给头部添加彩虹效果。当作弊模式未开启时，颜色效果被重置为 0，使角色恢复到原始颜色。\n\n\
    # 修改身体代码\n\n现在我们想将这种彩虹效果添加到“身体”克隆体上。修改“身体”角色的代码以匹配此：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_166_0.png)\n\
    \n当 `cheat mode` 变量设置为“开启”时，“身体”角色将逐渐改变其颜色效果以产生彩虹。否则，“身体”角色将将其颜色效果设置为 0。\n\n#\
    \ 保存点\n\n点击绿色旗帜测试目前的代码。按住空格键并尝试撞向自己。游戏不应该结束。然后松开空格键再次尝试撞向自己。现在游戏应该结束了。确保在你按住空格键时出现了彩虹效果。然后点击红色停止按钮并保存你的程序。\n\
    \n# 作弊模式：切掉你的尾巴！\n\n如果蛇是无敌的，游戏就不再具有挑战性。但如果你正要撞上身体，如果暂时移除蛇身体就很方便。让我们添加一个可以立即移除身体的作弊。\n\
    为“身体”角色添加此代码：\n\n```\nwhen key pressed\ndelete this clone\n```\n\n当玩家按下 C 键时，所有克隆体都会删除自己。（原始角色不受影响，因为它不是克隆体。）\n\
    \n# 总结\n\n在本章中，你构建了一个游戏：\n\n- 使用角色在舞台上移动时生成一系列克隆体轨迹\n- 使用了你在画画编辑器中绘制的蛇头身体服装\n\
