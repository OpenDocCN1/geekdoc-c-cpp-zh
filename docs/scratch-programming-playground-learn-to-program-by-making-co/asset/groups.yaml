    # 关于本书


    每一章都将带你完成一个单一游戏的编程，并在遇到编程概念时对其进行解释。你将从勾勒最终游戏的样式开始，并规划程序的各个部分。接下来的章节将逐步介绍如何为这些每个部分编写代码，直到你构建出整个游戏。在构建完主游戏后，你还可以选择添加特殊功能和外挂模式。每章末尾的回习题将帮助检查你是否理解了所涵盖的主题。


    - 第1章：入门 Scratch（Getting Started with Scratch）将向你如何访问 Scratch 网站以及 Scratch 编辑器的不同部分。

    - 第2章：太空中的彩虹线（Rainbow Lines in Space!），你将使用基础代码块和精灵的协作工作，创建一个动画艺术项目。你还将学习方向和角度。

    - 第3章：迷宫逃生者（Maze Runner），你将制作一个迷宫游戏，玩家使用键盘改变猫的坐标并引导它穿过八个不同的迷宫关。

    - 第4章：带重力的投篮（Shooting Hoops with Gravity）将向你介绍如何制作篮球游戏，为跳跃的猫和掉落的篮球实现真实的重力。

    - 第5章：精美的俄罗斯块消除游戏（A Polished Brick Breaker Game）涵盖了简单的技术，将一个普通的俄罗斯块消除游戏变成一个带有动画、音效等的精美且令人兴奋的游戏。

    - 第6章：蛇——蛇——蛇！（Snaaaaaake！）介绍了这款经典的电脑游戏，玩家在屏幕上引导一条不断生长的蛇绕行。它解释了如何使用 Scratch 的精灵克隆功能来制作伸长的蛇身。

    - 第7章：切水果大师（Fruit Slicer），你将制作手机游戏《水果忍者》的克隆，在游戏中玩家在空中切割水果。

    - 第8章：太空中的小行星碎片者……（Asteroid Breaker... in Space!）介绍了经典太空射击游戏《小行星》（Asteroids）的克隆。你为太空船添加鼠标和键盘控制。

    - 第9章整合了之前章节使用的许多概念：制作高级平台跳游戏（Making an Advanced Platformer）解释了如何创建一个带有行走和跳跃动画、平台和
    AI 控制敌人的平台跳跃游戏。


    # 如何使用本书


    书中所有的项目都始于我们将要制作的游戏草图。草图上的标签指向了我们将通过代码添加的功能。


    为了保持易于管理，我们将一次处理游戏的每一个部分。书中的蓝色 ABC 标题对应草图中的这些功能。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_23_0.png)


    将一个大问题拆分成许多小问题真的有助于组织你的思路，并让大问题看起来易于着手。在我们运行一个简单版本的游戏后，我们将添加新功能、作弊代码等等。当你准备好自己开始创建游戏时，我建议从一个简单的草图开始。


    # 保存点（SAVE POINT）


    在整本书中，你会看到这些“保存点”框。由于你是逐步制作程序的，你可能经常想要暂停并运行程序，即使它还没有完成。你将能够看到程序是否运行正常，并尽早发现任何错误。保存点框还会提醒你通过选择菜单栏中的
    File ► Save Now（文件 ► 立即保存）来保存程序。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_24_0.png)


    # 在线资源


    虽然 Scratch 环境包含了许多图像，但你还需要一些额外文件来完成书中的项目。这些文件在资源 ZIP 包中，你可以从 https://www.nostarch.com/scratchplayground/
    下载。你需要将文件解压到硬盘上才能访问它们。


    资源 ZIP 包包含书中项目用到的图像文件，以及每个程序的“骨架项目文件”。这些骨架项目文件已经完成了所有设置，你只需要添加代码块。如果你在完成程序时遇到困难，可以尝试从骨架项目文件开始，而不是从全新的空白项目开始。如果你是一个指导几名学生的老师且时间有限，使用骨架项目文件可能是一个好主意，因为他们只需要添加代码块即可完成程序。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_24_1.png)


    # 错与更新


    尽管我们尽力保持本书无错误，本书的修正和更新将列在 https://nostarch.com/scratchplayground/。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_26_0.png)


    # 开始学习 Scratch


    Scratch 是目前最好的教育性编程软件。没有其他工具能像 Scratch 那样让编程变得简单。许多类似的产品都受到了 Scratch 的启发，但 Scratch
    仍然是最流行的。通过 Scratch，你可以创建交互式游戏、动画和科学项目，同时享受很多乐趣！


    Scratch 是一个在网络浏览器中运行的免费编程环境。它由 MIT 媒体实验室的终身幼儿园小组（Lifelong Kindergarten Group）设计。Scratch
    用户可以通过在 Scratch 编辑器中拼接代码块来创建程序。虽然 Scratch 是为孩子设计的，但它适用于所有年龄段。


    由于 Scratch 在你的网络浏览器中运行，因此无需安装软件。Scratch 是完全免费的——没有广告或应用内购买。在 Scratch 中，你使用鼠标拖放代码块。这里有一个拼合代码块的示例：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_27_0.png)


    Scratch 编辑器为你提供快速反馈。与其他编程语言不同，Scratch 不会产生困扰程序员的错误信息。Scratch 让编程变得直观。


    # 运行 Scratch


    要开始使用 Scratch，请打开浏览器并访问 https://scratch.edu/。无论你运行 Windows、OS X 还是 Linux 都可以，但你必须在笔记本电脑或台式机上运行
    Scratch。


    > NOTE 树莓派电脑无法运行本书中所介绍的 Scratch。


    注册账户是免费的。你可以在没有账户的情况下创建程序，但拥有账户可以在线保存程序。这样你可以在任何连接互联网的计算机上继续工作。


    点击顶部的 Join Scratch（加入 Scratch）创建账户。弹出的新窗口：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_28_0.png)


    选择用户名和密码，并输入你的信息。未经你的许可，Scratch 不会共享你的电子邮件地址或个人信息。完整隐私政策请见 /privacy_policy/


    登录 Scratch 网站后，点击顶部的 Create（创建）链接启动 Scratch 编辑器。


    # 离线编辑器


    离线编辑器让你可以在不连接互联网的情况下编程。如果你没有互联网连接或 Wi-Fi 不稳定，可以在计算机上安装离线编辑器，而不是使用 Scratch 网站。唯一的区别是程序将保存在你的计算机上，而不是
    Scratch 网站上。你可以之后上传 Scratch 程序或复制到 U 盘移动到另一台计算机。


    https://scratch.edu/scratch2download/


    > NOTE 你可能会找到早期版本的编辑器软件 Scratch 1.4。不要使用这个版本；它过时了，且没有 Scratch 2.0 的新功能。如果你在浏览器中使用
    Scratch，你使用的是 Scratch 2.0。如果你下载了离线 Scratch 编辑器，请确保下载的是 2.0 版本。


    # 编辑器与精灵


    Scratch 编辑器是你拼接代码块创建游戏、动画或艺术品的地方。页面顶部的 Create 链接会打开编辑器（如下所示），你可以开始制作 Scratch 程序。


