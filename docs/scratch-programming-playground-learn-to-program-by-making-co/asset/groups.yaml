    ## 总结\n\n在本章中，你构建了一个具有以下功能的游戏：\n\n- 实现了重力和真实的掉落效果\n- 采用了侧视图视角而非俯视图视角\n- 使用变量记录分数、掉落速度以及第一次进球的情况\n\
    - 拥有碰撞框（hitbox）来检测是否进球\n\n程序中对重力的使用非常简单。当你到达第 9 章时，你将能够制作具有更复杂跳跃和掉落效果的高级平台游戏。但有很多\
    \ Scratch 编程技术需要先练习。在第 5 章中，你将制作一个使用克隆功能将一个角色复制几十次的侧视图游戏。\n\n## 复习题\n\n尝试回答以下练习题以测试你的所学知识。你可能无法脱口而出所有答案，但你可以探索\
    \ Scratch 编辑器来找到答案。（答案也可以在网上 http://www.noostart.com/scratchplayground/ 查看）\n\n\
    1. 侧视图游戏（如篮球游戏）与俯视图游戏（如迷宫跑步游戏）有什么区别？\n2. 变量可以存储什么？\n3. “仅限此角色”和“此所有角色”有什么区别？\n\
    4. 你如何让一个角色跳跃？\n5. 当猫在篮球游戏中跳跃时，是什么防止了它一直向上移动？\n6. “滑行”（glide）模块和“移动到 x y”（go to\
    \ x y）模块有什么区别？\n7. 如何在两个条件都为真时运行 if-then 语句块内部的代码？\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_118_0.png)\n\
    \n## 5 一个精细的打砖块游戏\n\n你见过打砖块游戏吗？玩家控制屏幕底部的挡板来弹球，使球打破屏幕顶部的方块。当球越过挡板时，玩家就会失败。这个游戏编写起来足够简单，但看起来可能有点无聊。在本章中，你将学习一些技巧，通过添加动画和效果让游戏变得多彩有趣。\n\
    \n你将使用一个迭代过程：首先制作基础游戏，然后对其进行小改进。结果将是一个看起来更专业的游戏，Scratch 网站上的其他玩家会认为它看起来非常酷。\n\n\
    下图展示了打砖块游戏在精化前后的样子。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_119_0.png)\n\n\
    在开始编码之前，请查看 https://www.nostarch.com/scratchplayground/ 上的最终游戏。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_119_1.png)\n\
    \n## 草拟设计\n\n让我们从画出游戏应该的样子开始。下图展示了打砖块游戏在精化前后的对比。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_120_0.png)\n\
    \n## 分数\n\n挡板位于屏幕底部。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_120_1.png)\n\n\
    ## 左右移动的挡板\n\n玩家控制屏幕底部的挡板来弹球，使球打破屏幕顶部的方块。当球越过挡板时，玩家就会失败。这个游戏编写起来足够简单，但看起来可能有点无聊。在本章中，你将学习一些技巧，通过添加动画和效果让游戏变得多彩有趣。\n\
    \n你将使用一个迭代过程：首先制作基础游戏，然后对其进行小改进。结果将是一个看起来更专业的游戏，Scratch 网站上的其他玩家会认为它看起来非常酷。\n\n\
    挡板位于屏幕底部。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_121_0.png)\n\n## 探索：旋转样式\n\
    \n旋转样式决定了角色在方向方向时的样子。三种样式是：全方位、左右和不旋转。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_122_0.png)\n\
    \n当角色被设置为“全方位”时，它将正对着它的方向指向。但这对于侧视图游戏（如第 4 章的篮球游戏）并不适用，因为当它朝左时角色会倒过来。相反，对于这些游戏，你将使用“左右”旋转样式。角色只会面向\
    \ 90 度（右）或 -90 度（左），取决于哪个角度更接近角色的方向。如果你希望角色即使在方向改变时也不旋转，将旋转样式设置为“不旋转”。\n\n## 制作一个会在墙壁反弹的球\n\
    \nScratch 角色库中有许多可以作为球的角色，但我们在这个游戏中使用“网球”（Tennis Ball）角色。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_123_0.png)\n"
