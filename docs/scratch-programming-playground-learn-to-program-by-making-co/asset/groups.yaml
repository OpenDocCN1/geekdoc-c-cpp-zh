    \n## 处理陡坡和墙壁\n\n地面（Ground）角色拥有猫可以行走的山丘和斜坡，你可以在画笔（Paint Editor）中将地面角色更改为几乎任何形状。与篮球游戏中只在舞台底部行走相比，这对玩家来说是一个巨大的改进。但现在的问题是，猫角色可以轻松地走上左侧的陡坡，就像上右侧的缓坡一样。这不符合现实。我们希望陡坡能阻挡猫。为了实现这一点，我们将对行走代码块进行微小的修改。\n\
