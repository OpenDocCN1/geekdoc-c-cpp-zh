    You also need to create two new broadcast messages, start screen and start game.\
    \ Do this by clicking the black triangle in a broadcast or when I receive block\
    \ and selecting new message. Then add the following scripts to the Stage.\n\n\
    This code resets High Score and Score to 0 when the program begins. The start\
    \ screen message is broadcast at the beginning of the program and when the player\
    \ loses a game. The Score variable is reset to 0, and **switch backdrop to start\
    \ screen** makes the start screen appear again when the player loses a game.\n\
    \n# B MAKE THE SLICE TRAIL\n\nThere isn't a sprite used for the player's character\
    \ in Fruit Slicer. Instead, the player clicks and drags the mouse across the screen,\
    \ causing a trail to briefly appear as a blade slice effect.\n\n# 3. Draw the\
    \ Slice Sprite\n\nClick the **Paint new sprite** next to New sprite. Open the\
    \ Info Area and rename the sprite Slice. In the Paint Editor, draw a light blue\
    \ rectangle that looks like the following.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_0.png)\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_1.png)\n\nThe Slice sprite should\
    \ not be the same color as any color used in the fruits. Otherwise, some of the\
    \ fruits will end up slicing other fruit.\n\n# EXPLORE: MAKING LISTS\n\nNow you'll\
    \ learn about an advanced Scratch feature—a new way to store data. A list is like\
    \ a variable except it can store many values instead of just one value. Open a\
    \ new web browser tab and start a new Scratch editor. We will explore the list\
    \ blocks in a new Scratch project. Select the orange Data category and click the\
    \ Make a List button to open the New List window. Name the list example list and\
    \ make it For all sprites.\n\n| New List |\n| --- |\n| List name: example list\
    \ |\n| ○ For all sprites ○ For this sprite only |\n\nNew dark orange blocks will\
    \ appear under the Make a List button.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_178_0.png)\n\
    \nLists have more than set to and change by blocks. Lists have values, but each\
    \ value also has a position, so the values need different kinds of code blocks.\
    \ Positions in a list are defined by numbers; number 1 is the first value in the\
    \ list. The following blocks control lists:\n\n- The add to block adds a value\
    \ to the end of the list.\n- The delete block removes the value at a certain position.\n\
    - The insert at block is like the add to block, but you can also select the position\
    \ where the value should be inserted.\n- The replace item block is like a combination\
    \ of delete and insert at. It replaces the value at a certain position with a\
    \ new value.\n\nAdd the following code and double-click-it to run it. Take a look\
    \ at the effects of these code blocks on a list named example list.\n\n(continued)\n\
    \n- 1 add Alice to example list\n- 2 insert Bob at 1 of example list\n- 3 delete\
    \ 1 of example list\n- 4 replace item 1 of example list with Carol\n\n| example\
    \ list | example list | example list | example list |\n| --- | --- | --- | ---\
    \ |\n| (empty) | 1 Alice | 1 Bob | 1 Carol |\n| + length: 0 | + length: 1 | +\
    \ length: 2 | + length: 1 | + length: 1 |\n\nRecall that you can use the value\
    \ in a variable in its bubble-shaped block. The list's bubble-shaped blocks are\
    \ similar but require you to specify a position so the bubble-shaped block knows\
    \ which value in the list it should get. The scripts on the left and right sides\
    \ both make the cat say \"Hello!\", but the code that uses a list (left) must\
    \ also specify the position of the value to use:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_179_0.png)\n\
    \n# 4. Create Lists and Variables for the Slice Sprite\n\nYou'll create a list\
    \ for the Fruit Slicer game to keep track of where the player is “slicing” on\
    \ the screen. Because the slice is drawn between many x and y positions with Pen\
    \ blocks, using a list is ideal.\n\nClick the Scripts tab at the top of the Blocks\
    \ Area, and select the orange Data category. Click the Make a List button to open\
    \ the New List window. Name the list slice x and make it For this sprite only.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_0.png)\n\nNew dark orange blocks\
    \ will appear under the Make a List button.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_1.png)\n\
    \nIn the orange Data category, click the Make a List button to make a second list.\
    \ Name the list slice y and make it For sprite only. Then click Make Variable,\
    \ create a variable named i, and make it For sprite only. You'll use this variable\
    \ in the next step.\n\n# 5. Record the Mouse Movements\n\nYou'll use the Pen blocks\
    \ to draw the slice. But first you need to know where to draw. Add the following\
    \ code to the Slice sprite:\n\n```\nwhen clicked\ndelete all of slice x\ndelete\
    \ all of slice y\nforever\n  if mouse down?\n    add x to slice x\n    add y to\
    \ slice y\n  if length of slice x > 4 or not mouse down?\n    delete 1 of slice\
    \ x\n    delete 1 of slice y\n```\n\nWhen the player clicks and holds down the\
    \ mouse, the mouse position's x- and y-coordinates are repeatedly added to the\
    \ end of the slice x and y lists. If more than four values are in the lists, the\
    \ value at the beginning of each list is deleted. The first values are also deleted\
    \ when the mouse button isn't held, so the trail shortens when the player releases\
    \ the mouse.\n\nThis script provides the proper coordinates for the slice x and\
    \ slice y lists. The next script will actually draw the slice.\n\n# 6. Make a\
    \ Custom Block to Draw the Slice\n\nSelect the purple More Blocks and click the\
    \ Make a Block button to open the New Block window. The purple blocks are custom\
    \ Scratch blocks that you create.\n\nFill in the name draw slice for your new\
    \ purple block. Click the gray triangle to expand the Options, and check the Run\
    \ without screen refresh. With this box checked, Scratch will run the code in\
    \ your custom block in Turbo Mode, even if the player didn't enable Turbo Mode\
    \ by SHIFT-clicking on the green flag. Click OK to create the custom block.\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_182_0.png)\n\nThe new draw slice block\
    \ will appear in the dark purple More Blocks category.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_182_1.png)\n\
    \nThis new block with the curved top in the Scripts Area is the defining block\
    \ for the draw slice block. When you want to use this new defining block, you\
    \ must also drag the draw slice block, which is the calling block, from the Blocks\
    \ Area into the code. Whenever Scratch runs this calling block, the code in the\
    \ defining block is run.\n\nAdd the following code to the Slice sprite:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_183_0.png)\n\
    \nThe color for the set pen color to block should be the same color as the blue\
    \ rectangle Slice sprite. Click the block's color square, and then click the light\
    \ blue color.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_183_1.png)\n\n-   Click\
    \ the Slice sprite's light blue color.\n"
  mdcn: "\n这是一个用于选择渐变类型的渐变按钮。我使用了垂直渐变。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_174_0.png)\n\
    \n点击绘制编辑器（Paint Editor）的画布，用你的渐变填充背景。如果你想尝试一下，在尝试不同的渐变之前，点击绘制编辑器顶部的“撤销”按钮。务必填满\
    \ R 字母中的空隙。完成后，重命名启动屏幕背景。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_174_1.png)\n\
    \n现在我们需要创建一个纯背景。当游戏开始时，程序应该隐藏“水果切西瓜”（Fruit Slicer）标题并切换到这个背景。点击“新背景”（New backdrop）下的“绘制新背景”按钮创建第二个背景。然后为这个背景绘制一个棕色的渐变，如下所示：\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_175_0.png)\n\n重命名这个新背景为游戏屏幕。游戏开始时，将在启动屏幕和游戏屏幕背景之间切换。\n\
    \n# 2. 为舞台添加代码\n\n现在让我们为舞台编写程序。在角色列表（Sprite List）中选择舞台，并点击区块区域（Blocks Area）顶部的脚本（Scripts）选项卡。在橙色的“数据”（Data）分类中点击“制作变量”按钮创建两个变量：分数（Score）和高分（HighScore）。这两个变量都设置为“所有角色”（For\
    \ all sprites）。\n\n> 注意：舞台只使用“所有角色”变量，因此“仅此此角色”选项在这里甚至不会出现！\n\n你还需要创建两个新的广播消息：启动屏幕（start\
    \ screen）和开始游戏（start game）。通过点击广播或“当收到消息”区块中的黑色三角形并选择“新消息”来执行此操作。\n\n然后向舞台添加以下脚本。\n\
    \n这段代码在程序开始时将高分和分数重置为 0。程序开始时和玩家输掉游戏时会广播“启动屏幕”消息。分数变量被重置为 0，**切换背景到启动屏幕**会让启动屏幕在玩家输掉游戏时再次出现。\n\
    \n# B 制作切割痕迹\n\n在“水果切西瓜”中没有用于玩家角色的角色。相反，玩家点击并拖动鼠标横跨屏幕，导致轨迹短暂出现，作为刀片切割的特效。\n\n\
    # 3. 绘制切片角色\n\n点击“新角色”（New sprite）旁边的**绘制新角色**。打开信息区域（Info Area）并将角色重命名为 Slice。在绘制编辑器中，画一个看起来如下所示的浅蓝色矩形。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_0.png)\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_1.png)\n\
    \nSlice 角色的颜色不应与水果使用的任何颜色相同。否则，某些水果最终会切到其他水果。\n\n# 探索：制作列表\n\n现在你将学习一种高级 Scratch\
    \ 功能——一种存储数据的新方法。列表就像变量，但它可以存储多个值，而不仅仅是一个值。打开一个新的浏览器标签页并启动一个新的 Scratch 编辑器。我们将在一个新的\
    \ Scratch 项目中探索列表区块。选择橙色的“数据”分类，并点击“制作列表”按钮打开“新列表”窗口。将列表命名为 example list（示例列表）并将其设置为“所有角色”。\n\
    \n| 新列表 |\n| --- |\n| 列表名称：example list |\n| ○ 所有角色 ○ 仅此此角色 |\n\n“制作列表”按钮下方会出现新的深橙色区块。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_178_0.png)\n\n列表不仅有设置为”（set to）和“增加”（change\
    \ by）区块。列表有值，但每个值还有一个位置，因此值需要不同类型的代码区块。列表中的位置由数字定义；数字 1 是列表中的第一个值。以下区块控制列表：\n\n\
    - “添加到”（add to）区块向列表末尾添加一个值。\n- “删除”（delete）区块移除某个特定位置的值。\n- “插入到”（insert at）区块类似于“添加到”区块，但你也可以选择要插入值的位置。\n\
    - “替换项目”（replace item）区块类似于“删除”和“插入到”的结合。它用新值替换特定位置上的值。\n\n添加以下代码并双击运行它。看一看这些代码区块对名为\
    \ example list 的列表产生的影响。\n\n（继续）\n\n- 1 将 Alice 添加到 example list\n- 2 在 example\
    \ list 的 1 处插入 Bob\n- 3 删除 example list 的 1\n- 4 将 Carol 替换 example list 的第 1\
    \ 个项目\n\n| example list | example list | example list | example list |\n| ---\
    \ | --- | --- | --- |\n| (空) | 1 Alice | 1 Bob | 1 Carol |\n| + 长度: 0 | + 长度:\
    \ 1 | + 长度: 2 | + 长度: 1 | + 长度: 1 |\n\n记得可以在气泡区块中使用变量中的值。列表的泡泡区块类似，但要求你指定一个位置，这样气泡区块才知道它应该获取列表中的哪个值。左右两边的脚本都会让猫说“Hello!”，但使用列表的代码（左侧）还必须指定要使用的值的位置：\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_179_0.png)\n\n# 4. 为 Slice 角色创建列表和变量\n\
    \n你将为“水果切西瓜”游戏创建一个列表，以跟踪玩家在屏幕上“切割”的位置。因为切割是用画笔（Pen）区块在许多 x 和 y 位置之间绘制的，所以使用列表是理想的。\n\
    \n点击区块区域顶部的脚本选项卡，选择橙色的数据分类。点击“制作列表”按钮打开“新列表”窗口。将列表命名为 slice x 并将其设置为“仅此此角色”。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_0.png)\n\n“制作列表”按钮下方会出现新的深橙色区块。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_1.png)\n\n在橙色的数据分类中，点击“制作列表”按钮创建第二个列表。将列表命名为\
    \ slice y 并将其设置为“所有角色”。然后点击“制作变量”，创建一个名为 i 的变量，并设置为“仅此此角色”。你将在下一步中这个这个变量。\n\n\
    # 5. 记录鼠标移动\n\n你将使用画笔区块来绘制切片。但首先你需要知道在哪里画。向 Slice 角色添加以下代码：\n\n```\n当点击\n删除所有\
    \ slice x\n删除所有 slice y\n重复\n  如果鼠标按下?\n    将 x 添加到 slice x\n    将 y 添加到 slice\
    \ y\n  如果 slice x 的长度 > 4 或鼠标未按下?\n    删除 slice x 的 1\n    删除 slice y 的 1\n```\n\
    \n当玩家点击并按住鼠标时，鼠标位置的坐标会被重复添加到 slice x 和 slice y 列表末尾。如果列表中超过四个值，第一个值将被删除。当松开鼠标时，第一个值也会删除，这样轨迹就会缩短。\n\
    \n此脚本为 slice x 和 slice y 列表提供了正确的坐标。下一个脚本将实际绘制切割。\n\n# 6. 创建一个用于切割的自定义区块\n\n选择紫色的“更多”分类，并点击“制作区块”按钮打开“新区块”窗口。紫色区块是你创建的\
    \ Scratch 区块。\n\n为你的新紫色区块输入 draw slice。点击灰色三角形展开选项，并勾选“不刷新屏幕”。勾选此框后，Scratch 将快速模式运行你自定义区块中的代码，即使玩家没有通过\
    \ Shift 点击绿旗来开启快速模式。点击“确定”创建自定义区块。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_182_0.png)\n\
    \n新的 draw slice 区块出现在深紫色的“更多”分类中。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_182_1.png)\n\
    \n脚本区域中带有圆角的区块是 draw slice 区块的定义区块。当你想要使用这个新的定义区块时，必须从区块区域拖入 draw slice 调用区块中。每当\
    \ Scratch 运行此调用区块时，定义区块中的代码就会运行。\n"
