    ## 添加螃蟹敌人和苹果


    整个平台跳跃（Platformer）游戏的设置已完成！玩家可以控制猫精灵行走、跳跃、掉落并站在平台上。猫精灵有一些酷炫的动画，背景看起来像一个真正的视频游戏。


    现在，我们要做的就是使用所有组件制作一个游戏——我们将添加一个在舞台周围随机出现的苹果（类似于第 6 章中的“蛇蛇游戏”），并添加一些试图触摸猫精灵并偷走苹果的敌人。


    ## 17. 添加苹果精灵和代码


    点击“从库中选择精灵”按钮，并在出现的精灵库窗口中选择苹果精灵。


    正如之前的游戏一样，我们将使用一个变量来跟踪分数。在数据（Data）分类中，点击变量。在苹果精灵的脚本区域添加以下代码：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_269_0.png)


