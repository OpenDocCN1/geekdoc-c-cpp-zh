    SAVE POINT

    Click the green flag to test the code so far. Press the left and right arrow keys,
    and make sure the cat moves in the correct direction. It''s okay if the cat walks
    backward when moving to the left; that''s what we want. Then click the red stop
    sign and save your program.'
  - '[PAGE 102]


    # MAKE A HOVERING BASKETBALL HOOP


    Now that the Cat sprite is complete, let''s move on to the next sprite in the
    game: the basketball hoop.


    # 5. Create the Hoop Sprite


    Click the Paint new sprite button next to New sprite. Before you starting, click
    the Convert to vector button in the lower-right corner. The drawing tool buttons
    will appear on the right side of the Paint Editor. (Vector mode lets you draw
    shapes, rather than drawing the individual pixels of an image.) Click the yellow
    color and use the Ellipse tool to draw a hoop. You can also slide the Line width
    slider in the lower-left corner to make the ellipse''s line thicker. Make sure
    the Paint Editor''s crosshairs are in the center of the hoop.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_102_0.png)


    Rename the sprite Hoop in its Info Area. We want the Hoop to play a cheer sound
    when the player makes a basket, so let''s load the cheer next. Click the Sounds
    tab at the top of the Blocks Area, and then click the Choose sound from library
    button under New sound. When the Sound Library window opens, select cheer and
    click OK.'
  - '[PAGE 103]


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_103_0.png)


    The cheer sound will now appear as an option for the **play sound** block you''ll
    add to the Hoop sprite.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_103_1.png)


    Add the following code to the Hoop sprite to make it glide randomly around the
    top half of the Stage. You''ll need to create a broadcast message by clicking
    the **when I receive** block''s black triangle and selecting **new message**.
    Name the new broadcast message swoosh.


    ```

    when clicked

    glide 1 secs to x: [pick random -240 to 240] y: [pick random -50 to 180]

    when I receive swoosh

    play sound cheer

    say Swoosh! for 2 secs

    ```'
  - '[PAGE 104]


    Script makes the hoop slide to a new position every second. A moving hoop will
    make the game more challenging to play! Script plays the cheer sound and displays
    “Swoosh!” when the swoosh broadcast is received. Later, we''ll make the Basketball
    sprite broadcast this message when a basket is made.


    # 6. Create the Hitbox Sprite


    Now let''s think about how to create code that determines whether or not the player
    makes a basket. We could write a program that checks whether the basketball is
    simply touching the hoop. The hoop is so wide, just the edges of the basketball
    touching the hoop would count as a basket. We want the basket to count only if
    the basketball goes through the middle of the hoop. We''ll have to think of a
    better fix.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_0.png)


    Instead, you can create a hitbox. A hitbox is a game-design term for a rectangular
    area that determines whether two game objects have collided with each other. We''ll
    make a hitbox sprite. Create a new sprite by clicking the Paint new sprite button.
    Draw a small black square in the middle of the crosshairs by using the Rectangle
    tool and selecting the solid fill option. Rename this sprite Hitbox. The Hitbox
    sprite will look like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_104_1.png)'
  - '[PAGE 105]


    Add the following code to the Hitbox sprite:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_0.png)


    The Hitbox sprite will now follow the Hoop sprite, no matter where it glides.

    In Step 9, we''ll write a program that makes sure a basket counts only if the
    basketball is touching the Hitbox sprite, not the Hoop sprite. The basketball
    will have to be much closer to the middle of the hoop to count as a basket!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_1.png)


    It looks odd to see a black square in the middle of the Hoop sprite, so let''s
    make the Hitbox sprite invisible. Add the set ghost effect block to the Hitbox
    sprite and set it to 100.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_105_2.png)


    There''s a difference between the hide block and the set ghost effect to 100.
    If you used the hide block to make the Hitbox sprite invisible, the touching blocks
    would never detect that the ball was touching the Hitbox sprite, and the player
    would never be able to score. The set ghost effect to 100 makes the sprite invisible,
    but this block still allows the touching blocks to detect the Hitbox sprite''s
    presence.'
- md: '

    # SAVE POINT


    Click the green flag to test the code so far. Make sure the hoop glides around
    the Stage and the hitbox rectangle is always in the middle of it. Then click the
    red stop sign and save your program.


    # MAKE THE CAT SHOOT HOOPS


    Next, you''ll add a basketball for the cat to throw. Like the cat, the basketball
    will have gravity code and fall to the ground.


    # 7. Create the Basketball Sprite


    Click the Choose sprite from library button next to New sprite to open the Sprite
    Library window. Select the Basketball and click OK.


    Next, click the Sounds tab at the top of the Blocks Area, and then click the Choose
    sound from library button to New sound to open the Sound Library window. Select
    the pop sound and click OK. Click the Scripts tab at the top of the Blocks Area
    to bring the Scripts Area.


    Now go to the orange Data category. You''ll make two variables. Click the Make
    a variable button. Name the variable y velocity, and make sure For sprite only
    is selected before you click OK. Because they are For this sprite only variables,
    the Basketball sprite''s y velocity variable is separate from the Cat sprite''s
    y variable. Even though they have the same name, they are two different variables.


    Click the Make a variable button again to make another variable named Player 1
    Score, but this time select All sprites. (We capitalize Player 1 Score because
    we''ll make it visible on the Stage. Uncheck the box next to y velocity to hide
    it on the Stage.) The new variable blocks should appear in the orange Data category.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_106_0.png)


    SHOOTING HOOPS WITH GRAVITY 81


    # 8. Add the code for the Basketball Sprite


    After you''ve added the pop sound and two variables, add this code to the Basketball
    sprite:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_107_1.png)


    Script 1 makes sure the player starts with 0 points and hides the Basketball sprite
    to start.


    Script 2 uses code similar to the Cat sprite code. When the player presses the
    spacebar, the basketball appears in front of the cat and starts moving forward.
    The code sets the Basketball sprite''s velocity variable to a positive number,
    just like the Cat sprite''s y velocity variable is set to a positive number when
    the cat jumps; this is how the cat throws the ball.


    **The repeat until position < -130** block will keep the Basketball sprite falling
    until it reaches the ground. When it reaches the ground, the basketball will be
    hidden until the next time the player presses the spacebar.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_108_0.png)


    # 9. Detect Whether a Basket Is Made


    Next, you''ll add the code that checks whether the Basketball sprite is touching
    the Hitbox sprite. This is how you know whether a basket has been made, and if
    it has, the Player 1 Score variable should increase. However, there is one snag:
    the basket shouldn''t count if the basketball goes *up* through the hoop.


    Keep in mind that if the y velocity variable is positive, the **change by y velocity**
    block will move the Basketball sprite up. If y velocity is 0, then the Basketball
    sprite is not moving up or down. But if y velocity is a negative number, then
    the Basketball sprite will be falling down.


    So you''ll add another **if** condition to the Basketball sprite''s code. You''ll
    increase the score only if the basketball is touching the hitbox (using the **touching
    Hitbox?** block) and falling downward (**y velocity < 0**).


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_109_0.png)


    The and block combines two conditions. For Scratch to run the code blocks inside
    the **if then** block, both of these conditions must be true. It isn''t enough
    for the sprite to be touching the Hitbox *or* for the y velocity variable to be
    less than 0. Both **touching Hitbox? and y velocity < 0** must be true for the
    player to score. If these conditions are true, the Player 1 Score variable is
    increased by 1 and the swoosh message is broadcasted.


    > SAVE POINT: Click the green flag to test the code so far. Shoot some baskets.
    The Player 1 Score variable should increase only if the basketball touches the
    center of the hoop and is moving down. The Hoop sprite should also say *swoosh*
    and play the cheer sound when this happens. Click the red stop sign and save your
    program.


    # 10. Fix the Scoring Bug


    Did you notice that Player 1 Score increases by several points for a single basket?
    This is a bug, which is a problem that makes the program behave in an unexpected
    way. We''ll need to take another look at the code to figure out why this happens.


    The **repeat until** loop block keeps looping until the ball hits the ground,
    so all of this code is for a single throw. The **repeat until** loop block checks
    several times whether or not the Basketball sprite is touching the Hitbox. We
    need to fix this by using a variable that tracks if the basketball has touched
    the hoop once.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_110_0.png)


    The made variable is set to no when the player presses the spacebar. In the loop,
    if the basketball is touching the hitbox and the made variable is no, we increase
    the score and set the made variable to yes. When the basketball hits the ground,
    we set the made variable back to no.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_111_0.png)


    # 11. Add a Second Player


    Now let''s upgrade the Basketball game by adding a second player. This will be
    easy since the second player''s code will be almost identical to the first player''s
    code.


    # Duplicate the Cat and Basketball Sprites


    Duplicate the Cat sprite and the Basketball sprite by right-clicking them in the
    Sprite List and selecting **duplicate**. Select the new Cat2 sprite and click
    the **Costumes** tab at the top of the Blocks Area. Use the Fill tool to make
    the cat blue.

    '
  mdcn: '


    # 保存点


    点击绿色旗帜来测试目前的代码。确保篮圈在舞台上滑动，且击中框（hitbox）矩形始终位于它的中心。然后，点击红色的停止按钮并保存你的程序。


    # 让猫投篮


    接下来，你将为猫添加一个可以投掷的篮球。和猫一样，篮球也将具有重力代码并掉到地面。


    # 7. 创建篮球角色


    点击“新增角色”旁边的“从库中选择角色”按钮，打开角色库窗口。选择“篮球”（Basketball）并点击确定。


    接下来，点击代码积块区域顶部的“声音”（Sounds）选项卡，然后点击“新增声音”旁边的“从库中选择声音”按钮，打开声音库窗口。选择“pop”声音并点击确定。点击积块区域顶部的“脚本”（Scripts）选项卡回到脚本区域。


    现在转到橙色的“数据”（Data）分类。你将创建两个变量。点击“制作变量”按钮。将变量命名为 `y velocity`，并在点击确定前确保勾选“仅针对此角色”（For
    sprite only）。因为它们是“仅针对此角色”的变量，篮球角色的 `y velocity` 变量与猫角色的 `y velocity` 变量是独立的。尽管它们的名称相同，但两个不同的变量。


    再次点击“制作变量”按钮创建另一个名为 `Player 1 Score` 的变量，但这次选择“所有角色”（All sprites）。我们之所以将 Player
    1 Score 的首字母大写，是因为我们需要在舞台上显示它。取消 `y velocity` 旁边的复选框以便舞台上隐藏它。）新的变量积块将出现在橙色的“数据”分类中。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_106_0.png)


    重力投篮 81


    # 8. 为篮球角色添加代码


    在添加了 pop 声音和两个变量后，为篮球角色添加以下代码：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_107_1.png)


    脚本 1 确保玩家开始时得分为 0 分，并在开始时隐藏篮球角色。


    脚本 2 使用与猫角色代码类似的代码。当玩家按下空格键时，篮球出现在猫的前面并开始向前移动。该代码将篮球角色的 `y velocity` 变量设置为正数，就像当猫跳跃时猫角色的
    `y velocity` 变量被设置为正数一样；这就是猫投球的方式。


    **重复直到位置 < -130** 积块块会让篮球角色一直掉落，直到它到达地面。当它到达地面时，篮球将被隐藏，直到玩家下一次按下空格键。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_108_0.png)


    # 9. 检测是否进球


    接下来，你将添加代码来检查篮球角色是否触碰了击中框（Hitbox）角色。通过这种方式你可以判断是否进球了，如果进球了，Player 1 Score 变量应该增加。然而，有一个问题：如果篮球是从*向上*穿过篮筐的是不应该计分的。


    请记住，如果 `y velocity` 变量为正数，**将 y velocity 变化**积块会让篮球角色向上移动。如果 `y velocity` 为 0，则篮球角色既不向上也不向下。但如果
    `y velocity` 为负数，则篮球角色将向下掉落。


    因此，你将在篮球角代码中添加另一个 **如果** 条件。只有当篮球触碰击中框（使用 **碰碰 Hitbox?** 积块）且正在向下移动（**y velocity
    < 0**）时，你才增加分数。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_109_0.png)


    `and`（和）积块组合了两个条件。要让 Scratch 运行 **如果那么** 积块内部的代码块，这两个条件都必须为真。仅仅让角色触碰击中框*或者* `y
    velocity` 变量小于 0 是不够的。**碰碰 Hitbox? 和 y velocity < 0** 必须同时为真，玩家才能得分。如果这些条件成立，Player
    1 Score 变量将增加 1，并广播“swoosh”消息。


    > 保存点：点击绿色旗帜测试目前的代码。投几次篮。只有当篮球触碰篮筐中心并正在向下移动时，Player 1 Score 变量才会增加。发生这种情况时，篮筐角色还应该说
    *swoosh* 并播放欢呼声。点击红色的停止按钮并保存你的程序。


    # 10. 修复得分 Bug


    你是否注意到投一次篮 Player 1 Score 就增加了好几分？这是一个 Bug，一个让程序以意料之外的方式运行的问题。我们需要再次查看代码找出为什么会发生这种情况。


    **重复直到** 循环积块会一直循环直到球落地，所以所有代码都是用于单次投掷。**重复直到** 循环积块会多次检查篮球角色是否触碰击中框。我们需要通过使用一个变量来跟踪篮球是否已经碰过一次筐来解决这个问题。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_110_0.png)


    当玩家按下空格键时，该变量被设置为 `no`。在循环中，如果篮球触碰击中框且变量为 `no`，我们就增加分数并将变量设置为 `yes`。当篮球落地时，我们将变量设回
    `no`。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_111_0.png)


    # 11. 添加第二个玩家


    现在让我们通过添加第二个玩家来升级篮球游戏。这将会很容易，因为第二个玩家的代码与第一个玩家的代码几乎完全相同。


    # 复制猫和篮球角色


    通过在角色列表中右键点击猫角色和篮球角色并选择**复制**来复制它们。选择新的 Cat2 角色，点击代码积块区域顶部的“造型”（Costumes）选项卡。使用油漆桶工具将猫涂成蓝色。


    '
