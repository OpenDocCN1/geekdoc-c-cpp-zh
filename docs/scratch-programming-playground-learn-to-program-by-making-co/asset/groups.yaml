    \n# 13. Create the White Fade Out Sprite\n\nWe'll use a ghost effect trick to\
    \ make the Stage fade. Click the Paint new sprite button next to New sprite. In\
    \ the Info Area, rename this sprite White Fade Out. In the Paint Editor, use the\
    \ Fill tool to fill the entire canvas with white. None of the white-gray checkered\
