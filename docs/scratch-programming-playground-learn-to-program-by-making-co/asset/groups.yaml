    There''s so much that you can do with Scratch, it''s hard to know where to start.
    That''s where this book comes in. This book guides you through creating video
    games in Scratch. By building the projects in this book, you''ll get a good idea
    of which blocks are commonly used to create video games in Scratch. These projects
    provide a solid foundation for you to build upon when creating your own original
    programs.


    # WHO THIS BOOK IS FOR


    No previous programming experience is necessary to read this book. The only mathematics
    skills required are basic arithmetic: addition, subtraction, multiplication, and
    division. Don''t let math phobia prevent you from learning to program. And don''t
    forget that the computer will perform calculations for you!


    Each program in the book is easy to make by following the step-by-step instructions.
    You''ll learn about the code blocks and programming concepts as you make games
    that use. No matter your skill level, there''s no reason you can''t start reading
    this now!


    Kids can follow along with the activities on their own, this book is also for
    parents, teachers, and volunteers who want to introduce their children or students
    to the world of programming. The projects are ideal for a weekend activity or
    afterschool computer club. Adults don''t have to use this book to help others
    learn.


    If you want a thorough guide to all Scratch''s features, I recommend the book
    Learn to Program with Scratch by Majdi Mardi (No St Press, 2014) to supplement
    this one. You can also watch video tutorials online at https://scratch.mit.edu/help/videos/
    and https://inventwithscratch.com/


    But programming is a hands-on skill like karate or guitar: you can''t learn it
    by reading alone! Make sure you''follow along and creating the games—you''ll learn
    a lot more that way.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_21_0.png)'
- md: '

    # ABOUT THIS BOOK


    Each chapter walks through programming a single game, and programming concepts
    are explained as they come up. You''ll start by sketching out what the final game
    will look like and planning the main parts of the parts of the program. The sections
    that follow will cover how to code each of these parts step-by-step until you''ve
    built the full game. After building the main game, you''ll have the option of
    adding special features and cheat modes. Review questions at the end of each chapter
    help check whether you understand the topics covered.


    - Chapter 1: Getting Started with Scratch shows you how to access the Scratch
    website and the different parts of the Scratch editor.

    - Chapter 2: Rainbow Lines in Space!, you''ll create an animated art project using
    basic code blocks and sprites working together. You''ll also learn about directions
    and degrees.

    - Chapter 3: Maze Runner, you''ll make a maze game in which the player uses the
    keyboard to change the cat''s coordinates and guide it through eight different
    maze levels.

    - Chapter 4: Shooting Hoops with Gravity shows you how to make a basketball game
    that implements realistic gravity for jumping cats and falling basketballs.

    - Chapter 5: A Polished Brick Breaker Game covers simple techniques for taking
    a plain brick breaker game and turning it into a polished, exciting game with
    animations, sound effects, and more.

    - Chapter 6: Snaaaaaake! features the classic computer game in which the player
    guides an ever-growing snake around the screen. It explains how to use Scratch''s
    sprite cloning feature to make the stretching snake body.

    - Chapter 7: Fruit Slicer, you''ll make a clone of the smartphone game Fruit Ninja,
    in which the player slices fruit in mid-air.

    - Chapter 8: Asteroid Breaker... in Space! features a clone of the classic space
    shooter Asteroids. You''ll add mouse and keyboard controls to the spaceship.

    - Pulling together many of the concepts used in previous chapters, Chapter 9:
    Making an Advanced Platformer explains how to create a platformer game with walking
    and jumping animations, platforms, and AI-controlled enemies.


    # HOW TO USE THIS BOOK


    All of the book''s projects start with a sketch of the game we''ll make. The labels
    on the sketch point to features that we''ll add with the code.


    To keep things manageable, we''ll tackle each part of the game one at a time.
    The blue ABC headings in the book correspond to these features in the sketch.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_23_0.png)


    Splitting a big problem into a bunch of little problems really helps organize
    your thinking and make a big problem feel approachable. After we get a simple
    version of the game up and running, we''ll add new features, cheat codes, and
    more. When you''re ready to start creating games yourself, I recommend starting
    with a simple sketch.


    # SAVE POINT


    Throughout this book you''ll see these Save Point boxes. Because you''ll be making
    programs step-by-step, you''ll want to pause and run the program so often, even
    if it isn''t finished. You''ll be able to see whether the program is working correctly
    so and catch any mistakes early. The Save Point boxes will also remind you to
    save the program by selecting


    File ► Save Now in the menu bar.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_24_0.png)


    # ONLINE RESOURCES


    Although the Scratch environment includes many images, you''ll need some extra
    files to make the projects in this book. These files are in the resources ZIP
    file, which you can download from https://www.nostarch.com/scratchplayground/.
    You''ll need to unzip the files to your hard drive to access them.


    The resources ZIP file contains the image files used in the book''s projects and
    the skeleton project files for each of the programs. These skeleton project files
    have all the setup already completed and only require you to add the code blocks.
    If you are having trouble finishing your program, you can try starting from the
    skeleton project file instead of a brand new, blank project. Using the skeleton
    project files may be a good idea if you are a teacher who is coaching several
    students and time is limited, because they''ll only have to add the code blocks
    to complete the program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_24_1.png)


    # ERRATA AND UPDATES


    While we''ve done our best to keep this book error free, corrections and updates
    for this book will be listed at https://nostarch.com/scratchplayground/.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_26_0.png)


    # GETTING STARTED WITH SCRATCH


    Scratch is the best educational programming software available today. No other
    tool makes programming as easy as Scratch does. Many similar products have been
    inspired by Scratch, but Scratch remains the most popular. With Scratch, you can
    create interactive games, animations, and science projects, all while having lots
    of fun!


    Scratch is a free programming environment that runs in your web browser. It was
    designed by the MIT Media Lab''s Lifelong Kindergarten Group. Scratch users can
    create programs by snapping together code blocks in the Scratch editor. Although
    Scratch was designed for kids, it is available for all ages.


    Because Scratch runs in your web browser, there''s no software to install. Scratch
    is completely free—there are no ads or in-app purchases. In Scratch, you use the
    mouse to drag and drop code blocks. Here''s an example of snap-together code blocks:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_27_0.png)


    The Scratch editor provides you with quick feedback. Unlike other programming
    languages, Scratch doesn''t have error messages that confuse programmers. Scratch
    makes programming immediate.


    # RUNNING SCRATCH


    To start using Scratch, open your web browser and go to https://scratch.edu/.
    It doesn''t matter whether you''re running Windows, OS X or Linux, but you do
    have to run Scratch on a laptop or desktop computer. Scratch does not work on
    tablets or smartphones.


    > NOTE The Raspberry Pi computer cannot run Scratch, the version covered in this
    book.


    Signing up for an account is free. You can create Scratch programs without an
    account, but having an account lets you save your programs online. Then you can
    continue working on them from any computer connected to the internet.


    Click the Join Scratch at the top of the page to create an account. A new window
    opens:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_28_0.png)


    Choose a username and password, and enter your account information. Scratch will
    never share your email address or personal information without your permission.
    Your full privacy policy is at https://scratch.edu/privacy_policy/


    After you''ve logged in to the Scratch website, click the Create link at the top
    of the page to start the Scratch editor.


    # THE OFFLINE EDITOR


    The offline editor lets you program without being connected to the internet. If
    you don''t have internet access or if your Wi-Fi is unreliable, you can install
    the offline editor on your computer instead of using the Scratch website. The
    only difference is that programs will be saved on your computer instead of on
    the Scratch website. You can later upload your Scratch programs or copy them to
    a flash drive to move them to another computer.


    https://scratch.edu/scratch2download/


    > NOTE You may find the editor software for an earlier version, Scratch 1.4. Don''t
    use this version; it''s out-of date and doesn''t have the new features that Scratch
    2.0 has. If you''re using Scratch in your web browser, you''re using Scratch 2.0.
    If you download an offline Scratch editor, be sure to download Scratch 2.0.


    # THE SCRATCH EDITOR AND SPRITES


    The Scratch editor is where you snap code blocks to create your game, animation,
    or artwork. The Create link at the top of the page opens the editor, as shown
    in the following figure, so you can start making Scratch programs.

