    # 8. Add the Ceiling Detection Code


    The problem with the code is in the custom **handle ground** block. This code
    always assumes the Cat sprite is falling from above, and if the Cat sprite is
    touching the Ground sprite, it should be lifted above it. The Ground sprite represents
    any solid part that the cat can''t move through, including ceilings. We need to
    change the code so that if the Cat is jumping up when it touches the Ground sprite,
    the cat *stops* rising because it bumps its head. We know the Cat sprite is moving
    upward when its velocity is greater than 0. So let''s edit the **handle ground**
    block to add a new Boolean input **moving up**.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_250_1.png)


    A *Boolean* is a true or false value. We use a Boolean input because we need to
    know if its velocity is greater than 0 when the **handle ground** block is first
    called. This or'
