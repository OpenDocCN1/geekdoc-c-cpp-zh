    ## 迷宫逃生者


    你可能以前玩过迷宫游戏，但你尝试过制作一个吗？迷宫的完成可能很复杂，但编程却很容易。在本章中，你将创建一个游戏，让玩家引导猫穿过迷宫到达它的目标——一个美味的苹果！你将学习如何使用键盘移动猫，以及如何用墙阻挡它的进度。


    在开始编码之前，先看看最终的程序。

    访问 https://www.nostarch.com/scratchplayground/ 并玩玩游戏。


    你的目标是拿到苹果！


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_61_0.png)


    你控制猫。


    ## 设计草图


    首先，在纸上画出你想要游戏的样子。

    通过一些规划，你可以让你的迷宫游戏变得“迷人”（a-maze-ing，我从不为自己的双关语道歉）。我的迷宫游戏草图如图所示。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_62_0.png)


    如果你想节省时间，可以从资源 ZIP 包中名为 maze-skeleton.sb2 的骨架项目文件开始。访问 https://www.nonostarch.com/scratchplayground/
    ，并通过右键点击链接并选择**链接另存为**或**目标另存为**将 ZIP 文件下载到电脑。从 ZIP 文件中提取所有文件，这样你只需要将代码块拖入每个角色中。在
    Scratch 编辑器中点击**文件 ► 从电脑上传**来加载 *maze-skeleton.sb2* 文件。


    即使你不使用该骨架项目，也应该从网站下载该 ZIP 文件。该文件包含了本章将用到的迷宫图像。


    如果你想自己创建所有内容，点击**文件 ► 新建**开始一个新的 Scratch 项目。在左上角的文本框中，将项目重命名从 *Untitled*（无标题）更改为
    *Maze Runner*。


    ## 让猫走起来


    在《迷宫逃生者》游戏中，玩家将控制猫的角色。在 A 部分中，你将设置代码，使用键盘上的方向键控制猫。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_63_0.png)


    ## 探索：X 和 Y 坐标


    为了让猫在舞台上移动，你需要使用坐标。坐标是表示精确位置的数字。x 坐标（也称为 x 位置）代表角色在舞台上向左或向右的距离。换说，x 是角色的水平位置。y
    坐标（也称为 y 位置）代表角色在舞台上向上或向下的距离。y 坐标是角色的垂直位置。


    x 和 y 坐标结合使用可以指示角色在舞台上的精确位置。在编写坐标时，x 坐标始终在前，坐标之间用逗号隔开。例如，x 坐标为 42，y 坐标为 100，显示如下：(42,
    100)。


    舞台正中心有一个标记为 (0, 0) 的点，称为原点。在下面的图中，我使用了 Scratch 背景库中的 xy 网格背景。（要加载 xy 网格背景，请点击“新背景”标签旁边的“选择背景”按钮并选择该背景）。我添加了几只猫的角色，它们都在说话。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_64_0.png)


    舞台右侧的 x 坐标为 240，向左移动时 x 坐标减小。舞台左侧的 x 坐标为 -240。y 坐标的情况类似：舞台顶部的 y 坐标为 180，中心为 0，底部为
    -180。


    舞台右下角显示了鼠标的坐标。在后续图中，鼠标位于 (42, -27)，这表示 x 坐标是 42，y 坐标是 -27。Scratch 在左上角的文本框中显示当前选中角色的
    x 和 y 坐标。


