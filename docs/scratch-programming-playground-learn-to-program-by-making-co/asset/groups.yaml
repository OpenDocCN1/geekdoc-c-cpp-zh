    outline appears in the script: this is where the block will snap into place. This
    figure shows a wait 1 secs block moving into the middle of a script:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_33_1.png)'
  - '[PAGE 34]


    You can change a white field inside a block by clicking the white area and entering
    new input. The rectangular white fields accept text; the rounded white fields
    accept numbers.


    The rounded blocks are called reporter blocks. They fit inside the white fields.
    For example, in the following figure, the green pick random 1 to 10 block fits
    inside the white field. When the left edge of the reporter block is over the white
    field, if the left edge isn''t over the white field, the outline won''t appear
    and the reporter block cannot be placed inside.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_34_0.png)


    # Deleting Blocks


    To remove blocks, drag them out of the script. If you remove a stack block, you''ll
    also remove the stack blocks connected under it, as shown in the next figure.
    You may need to set aside these blocks if you want to reconnect some of them to
    the script. Drag the blocks you want to delete over the center Blocks Area to
    remove them from the Stage. You can always add more blocks from the Blocks Area
    when you need them.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_34_1.png)


    You can also right-click a block and delete from the menu that appears. However,
    doing so will also delete all the blocks underneath that block. If you accidentally
    delete some'
  - '[PAGE 35]


    blocks, you can restore them by selecting Edit ► Undelete from the menu bar.


    # Running Programs


    Create the following program by dragging blocks from the Blocks Area to the Scripts
    Area:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_35_0.png)


    When you click the green flag at the top of the Stage, this program will start.
    Programs begin at (**green flag clicked**) and then run the next block in the
    script. In this example, a speech bubble appears above the sprite and displays
    the word “Hello!” In the forever loop, the sprite moves forward 10 steps and then
    turns clockwise by 15 degrees. When the program gets to the last block, it **loops**
    back to the top. All the blocks in the **forever** block will run in a loop forever.
    The program stops only when you click the red stop sign.


    You can also run a script or block by double-clicking it. But clicking the green
    flag is the normal way to start your program.


    You can have as many sprites and code blocks in your programs as you want. As
    you create the programming projects in this book, you''ll learn about Scratch
    many different types of code blocks.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_35_1.png)'
  - '[PAGE 36]


    # SHOWING OFF YOUR PROGRAMS


    When you’re logged in to your Scratch account, click the Share button at the top-right
    corner of the editor to let other Scratchers see your program. They’ll be able
    to play your game and leave comments. If Scratchers enjoy playing the game, they
    can Like and Favor your program.


    Once you''ve finished a project, you can also add it to the Scratch Programming
    studio. This features projects and remixes you and other readers have made. Once
    you''ve shared your project in Scratch, copy the URL and paste it into the text
    field, and click Add by URL. Now other readers will be able to view your game
    in the studio!


    Don’t worry if you think your game isn''t good enough. Everyone begins their coding
    journey with simple games. Most people on the Scratch website are beginners, too.
    Over 11 million people have shared their programs on the Scratch website, so don’t
    fret if yours doesn’t get many views. Games can be difficult to find with so many
    available on the site!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_36_0.png)


    # GETTING STARTED


    Becoming a super programmer isn’t about knowing all the answers; it’s knowing
    how to find answers. You can follow the steps for the projects in this book, but
    you might have questions of your own.'
- md: '

    # The Tips Window


    The first place to look for help is in the Scratch editor''s Help section. Click
    the Question mark button on the right side of the editor to open the Tips window.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_37_0.png)


    In the Tips window, you can learn what a particular code block does by selecting
    it from the Blocks tab, as shown here:


    You can also access and read through several tutorials. Although you can ask for
    help in the discussion forums, it''s faster to find answers in the Tips window.


    # The See Inside Button


    You can learn many new techniques by looking at other Scratchers'' code. Find
    a project on the Scratch website, and then click the See inside button, Discuss,
    as shown here:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_0.png)


    You''re allowed to copy and modify, or remix, other Scratchers'' code. All Scratch
    programs on the website are automatically released under a Creative Commons license,
    so you don''t need to ask the original creator for permission, as long as you
    give them credit. Scratchers remix each other''s programs to create their own
    versions.


    Still need help and want to talk to other Scratchers? Click the Discuss link at
    the top of the website to visit the forums.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_1.png)


    GET STARTED WITH SCRATCH 13


    # SUMMARY


    The Scratch editor is a creative tool with great potential. You''ll see all sorts
    of Scratch projects on the Scratch website: games, cartoons, simulations, and
    informative presentation slides.


    Now that you know how to access the Scratch website, create an account, use the
    Scratch and Paint editors, and snap together code blocks into scripts, you''re
    ready to follow the step-by-step instructions in the rest of this book. If you
    have questions, be sure to use the Tips window in the Scratch editor and the discussion
    forums on the Scratch website to find the answers you need.


    Let''s start creating your first Scratch program!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_40_0.png)


    # RAINBOW LINES IN SPACE!


    In this chapter, you''ll create a cool-looking animation: a rainbow V that flies
    through space and leaves colorful trails behind. This program was inspired by
    the demoscene, a subculture of elite programmers who made amazing graphical programs
    starting in the 1980s.


    Demosceners made beautiful, elaborate programs called demos that showed off their
    artistic, musical, and programming skills. But most amazing of all, these programs
    were tiny—just a few kilobytes! The program we''ll write isn''t quite as small,
    but it''s dramatic and colorful, and it uses only a few lines of Scratch code.


    Before you start coding, look at the following figure to see what the final program
    will look like. Then go to https://www.nostarch.com/scratchplayground/ to play
    the animation.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_41_0.png)


    Just like demosceners, you can make beautiful programs. Let''s create our own
    graphics demo in Scratch!


    # SKETCH OUT THE DESIGN


    The first step of turning an idea into a Scratch program is to sketch out what
    you want it to look like. Planning your program helps you figure out the sprites
    you want and how they''ll behave. I recommend drawing your ideas on paper so you
    can cross them out if you don''t like them and write down notes and reminders.


    It''s also best to keep the project simple. If you start by making a complicated
    game like Minecraft or Zelda, you''ll quickly realize that it''s a lot of work.
    It''s more rewarding to finish a small project than to deal with the frustration
    of an unending, unfinished, and unplayable game.


    When you''ve completed your simple game, you can then build on top of it to make
    it more complex, which is the idea behind iterative development. First, you make
    the program work. Then, you make the program better. You can always add cool elements
    to the basic program after you finish it. Or, if your program becomes too complicated,
    you can return to your sketches and figure out what the sketch you want to remove.


    Don''t worry about a sketch making the sketch nice. It''s more important to have
    a solid plan for the main parts of the program. In my sketch, I have three parts:
    A, B, and C. We will work on these parts one at a time until we''ve built the
    full program.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_42_0.png)


    After you''ve completed a sketch of what you want your program to do, you can
    start programming! Go to https://scratch.mit.edu/, sign up for an account on the
    site, and log in (having an account lets you save your programs on the Scratch
    website). After you''ve logged in, click the Create button at the top of your
    screen to start making your own Scratch project. Then click the text field in
    the top left to change the name of the project from Untitled to Rainbow Lines.
    Let''s begin by tackling Part A of the sketch.


    # CREATE THE BACKDROP


    First, let''s clean up sprites we won''t use and set a background.


    ### 1. Clean Up and Set the Stage


    Every time you create a new Scratch project, you''ll see an orange sprite on a
    blank, white Stage. We don''t need the cat sprite for our program, right-click
    Sprite1 in the Sprite List, and select delete to remove the cat from the Stage
    and the Sprite List.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_0.png)


    Click the Choose backdrop button (which looks like a landscape) under New backdrop.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_1.png)


    The Backdrop Library will open and display all the backdrops in alphabetical order.
    Select the stars backdrop and click OK.


    - Make sure All is selected, or the stars backdrop won''t show up.

    - Select the stars backdrop.

    - Click OK.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44_0.png)


    Now the Stage''s backdrop looks like space!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44_1.png)


    # CREATE THREE BOUNCING DOTS


    Next, we''ll add three new sprites that represent the three points of the flying
    V.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_45_0.png)


    ### 2. Paint the Dot


    Click the Paint sprite button (which looks like a brush) next to New sprite.


    | New sprite: |

    | :--- |

    | x: 167 y: -180 |

    | Paint new sprite |


    A new sprite named Sprite1 is created in the Sprite List. Clicking this button
    also switches to the tab, which contains the Paint Editor. Use the Brush tool
    to draw a small red dot near the crosshairs in the Paint Editor. It might help
    to zoom in by clicking the Zoom button (which looks like a magnifying glass) in
    the Paint Editor.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_0.png)


    Click the i button for Sprite1 dot to open its Info Area. You can also open the
    Info Area by right-clicking the sprite and selecting info.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_1.png)


    Change the sprite''s name from Sprite1 to Dot 1. Then click the back button to
    close the Info Area and display the Sprite List again.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_47_0.png)


    ### 3. Add Code for the Dot 1


    Now we can start programming. Click the Scripts tab to make the Scripts Area visible.
    Add the following code to the Scripts Area. You can find these blocks in the *Events*
    (brown), *Motion* (dark blue), *Operators* (green), and *Control* (yellow) categories.
    If you have trouble understanding how to drag these blocks, view the animation
    at https://www.nostarch.com/scratchplayground/


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_47_1.png)


    When you click the green flag, the Dot 1 sprite points in a random direction between
    –180 and 180 degrees. Then the **forever** loop moves the sprite forward 10 steps
    and makes the sprite bounce when it hits the edge of the Stage. The sprite will
    continue to do this forever.


    Notice that the Dot 1 sprite isn''t drawing any rainbow lines yet. We''ll do that
    later when we''ve created more sprites.


    # EXPLORE: DIRECTION AND DEGREES


    Words like up or right are perfectly understood directions by humans like you
    and me. But the computer needs a number to indicate an exact direction. All sprites
    in Scratch have their own direction number. The direction numbers are between
    -180 and 180 degrees. Pointing at 0 degrees is facing up. Pointing at 90 degrees
    is facing to the right. The following figure shows several directions and their
    degrees. Notice that the degrees increase in the clockwise direction and decrease
    in the counterclockwise direction. Also, notice that -180 and 180 degrees point
    in the same direction: down.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_48_0.png)


    The pick random -180 to 180 block to use as the direction. Then the point in direction
    block points the sprite in that direction. This means that the sprite could be
    pointed in any possible direction.


    Let''s write a new script that demonstrates how degrees work. Open a new tab by
    pressing CTRL-T in your web browser, and go to https://scratch.mit.edu/ to open
    a new Scratch editor. You can edit multiple Scratch programs at the same time.

    '
  mdcn: '


    # 提示窗口


    寻找帮助的第一个地方是 Scratch 编辑器的“帮助”（Help）部分。点击编辑器右侧的问号按钮可以打开“提示”窗口。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_37_0.png)


    在提示窗口中，你可以通过从“积木”（Blocks）选项卡中选择特定的代码块来学习它的作用，如下所示：


    你还可以访问并阅读几个教程。虽然你可以在讨论论坛中寻求帮助，但在提示窗口中找到答案会更快。


    # 查看内部按钮（See Inside Button）


    你可以通过查看其他 Scratch 者的代码来学习许多新技巧。在 Scratch 网站上找到一个项目，然后点击“查看内部”（See inside）按钮、“讨论”（Discuss），如下所示：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_0.png)


    你可以复制、修改或重混（remix）其他 Scratch 者的代码。网站上所有的 Scratch 程序都自动根据知识共享许可（Creative Commons
    license）发布，因此只要注明来源，你不需要请求原作者的许可。Scratch 者通过互相重混程序来创建他们自己的版本。


    仍然需要帮助并想与其他 Scratch 者聊天吗？点击网站顶部的“讨论”链接访问论坛。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_38_1.png)


    开始学习 Scratch 13


    # 总结


    Scratch 编辑器是一个具有巨大潜力的创意工具。你会在 Scratch 网站上看到各种 Scratch 项目：游戏、动画片、模拟和信息演示幻灯片。


    现在你已经了解了如何访问 Scratch 网站、创建账户、使用 Scratch 和画笔编辑器，以及将代码块拼接成脚本，你已经准备好按照书中其余部分的逐步分说明进行操作了。如果你有任何问题，请务必使用
    Scratch 编辑器中的提示窗口和 Scratch 网站上的讨论论坛来寻找所需的答案。


    让我们开始创建你的第一个 Scratch 程序吧！


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_40_0.png)


    # 太空中的彩虹线！


    在本章中，你将创建一个酷炫的动画：一个穿过太空并在身后留下彩色轨迹的彩虹 V 字。这个程序的灵感源于“演示场景”（demoscene），这是一种由精英程序员组成的亚文化，他们从
    20 世纪 80 年代开始制作惊人的图形程序。


    演示场景者制作被称为“演示”（demos）的美丽且复杂的程序，展示他们的艺术、音乐和编程技巧。但最令人惊讶的是，这些程序非常小——只有几 KB！我们将编写的程序没有那么小，但它非常戏剧且色彩斑斓，并且只需要几行
    Scratch 代码。


    在开始编码之前，请查看下图了解最终程序的样式。然后前往 https://www.nostarch.com/scratchplayground/ 播放该动画。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_41_0.png)


    就像演示场景者一样，你也可以制作出美丽的程序。让我们在 Scratch 中创建自己的图形演示吧！


    # 勾画设计


    将想法转换为 Scratch 程序的第一步是勾画出你希望它的的样子。规划你的程序有助于你确定你想要的角色（sprites）以及它们将如何运行。我建议在纸上画出你的想法，这样如果你不喜欢，就可以把它划掉，并写下注释和提醒。


    保持项目简单也是最好的。如果你从制作像《我的世界》（Minecraft）或《塞尔达》（Zelda）这样复杂的游戏开始，你会很快发现这工作量巨大。完成一个一个小项目，比应对一个永无止境、未完成且不可玩的游戏带来的挫败感要有成就感。


    当你完成简单的游戏后，你可以在此基础上进行构建使其变得复杂，这就是迭代开发的核心思想。首先，让程序运行起来。然后，让程序变得更好。在完成基础程序后，你始终可以为其添加酷炫的元素。或者，如果你的程序变得太复杂，你可以回到草图，找出你想删除哪部分设计。


    不要担心草图会让草图变得完美。为程序的主要部分有一个稳固的计划更重要。在我的草图中，我有三个部分：A、B 和 C。我们将逐个处理这些部分，直到构建出完整的程序。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_42_0.png)


    在你完成了程序运行功能的草图后，就可以开始编程了！访问 https://scratch.mit.edu/，在网站注册账户并登录（拥有账户可以让你将程序保存到
    Scratch 网站上）。登录后，点击屏幕顶部的“创建”（Create）按钮开始制作你自己的 Scratch 项目。然后点击左角的文本框，将项目名称从“未命名”（Untitled）更改为“彩虹线”（Rainbow
    Lines）。让我们从处理草图的 A 部分开始。


    # 创建背景


    首先，清理我们用不到的角色并设置背景。


    ### 1. 清理并布置舞台


    每当你创建一个新的 Scratch 项目时，你都会看到空白白色舞台上有一个橙色的角色。我们的程序不需要小猫角色，右键点击“角色列表”（Sprite List）中的
    Sprite1，并选择“删除”（delete）以从舞台和角色列表中移除猫。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_0.png)


    点击“添加背景”（New backdrop）下的“选择背景”（Choose backdrop）按钮（看起来像一片风景）。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_43_1.png)


    背景库将打开并按字母顺序显示所有背景。选择“星星”（stars）背景并点击“确定”（OK）。


    - 确保选中了“全部”（All），否则星星背景不会显示。

    - 选择“星星”背景。

    - 点击“确定”。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44_0.png)


    现在舞台看起来像太空了！


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_44.png)


    # 创建三个跳动的点


    接下来，我们将添加三个角色来代表 V 字的三个顶点。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_45_0.png)


    ### 2. 绘制点


    点击“新建角色”旁边的“绘制”（Paint）按钮（看起来像画笔）。


    | 新角色： |

    | :--- |

    | x: 167 y: -180 |

    | 绘制角色 |


    角色列表中出现了一个名为 Sprite1 的新角色。使用画笔工具在绘制编辑器中画一个小点。可以通过点击放大镜按钮（看起来像放大镜）来放大。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_0.png)


    点击 Sprite1 的“i”按钮打开信息窗口。也可以通过右键点击角色来打开信息。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_46_1.png)


    将角色的名称从 Sprite1 改为 Dot 1。然后点击返回关闭信息窗口并显示角色列表。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_47_0.png)


    ### 3. 为 Dot 1 添加代码


    现在我们可以开始编程了。点击“脚本”（Scripts）标签页让脚本区域可见。在脚本区域添加以下代码。你可以在“事件”（Events，棕色）、“动作”（Motion，深蓝色）、“运算符”（Operators，绿色）和“控制”（Control，黄色）分类中找到这些积木。如果你对如何拖动这些积木有困难，请观看动画：https://www.nostarch.com/scratchplayground/


    ![](img/44bc3b30bef7ae1ad43f0775f36b.png)


    当你点击绿旗时，Dot 1 角色将指向 -180 到 180 度之间的随机方向。然后，“重复”（forever）循环会让角色前进 10 步，并在碰到舞台边缘时反弹。角色将一直执行此操作。


    注意 Dot 1 角色还没有绘制任何彩虹线。我们将在创建更多角色之后再做。


    # 探索：方向与角度


    对于像你和我这样的人类来说，“向上”或“向右”这样的词是可以完全理解的方向。但计算机需要数字来指示精确的方向。Scratch 中的所有角色都有自己的方向数字。方向数字在
    -180 到 180 度之间。指向 0 度面向向上。指向 90 度面向向右。下图显示了几个方向及其对应的角度。注意角度在顺时针方向增加，逆时针方向减少。此外，注意
    -180 度和 180 度指向同一个方向：向下。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_48_0.png)


    使用“随机选取 -180 到 180”积木作为方向。然后“指向”（point in direction）积木让角色指向该方向。这意味着角色可以指向任何可能的方向。


    让我们写一个新的脚本来演示角度是如何工作的。在网络浏览器中按 CTRL-T 打开新标签页，访问 https://scratch.mit.edu/ 打开一个新的
    Scratch 编辑器。你可以同时编辑多个 Scratch 程序。


    '
