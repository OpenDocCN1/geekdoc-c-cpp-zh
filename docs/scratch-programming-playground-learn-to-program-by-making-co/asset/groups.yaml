    (say, for different levels) we don''t have to reprogram the Cat sprite.


    ### 13. Download and Add the Stage Backdrop


    Click the Ground sprite''s Costumes tab. Click the Upload costume from file button
    and select Platformbackdrop.png, which is in the ZIP file. After this costume
    has uploaded, you can delete the previous costume.


    It''s not enough to add the file Platformer.png as a costume for the Ground sprite.
    You must also upload it as a Stage backdrop. Click the Upload backdrop from file
    button to New backdrop, and select PlatformBackdrop.png to upload it. We need
