    ```


    地面精灵的造型需要与舞台背景完美对齐，这样你就看不出它的存在。由于舞台的造型也源自同一个文件，你可以通过将地面精灵移动到坐标 (0, 0) 来实现这一点。否则，地面精灵的造型将无法与背景完美对齐。


    地面精灵造型的绘图内容并不像造型的形状那么重要。只要地面精灵完美地覆盖在背景之上，我们就可以将幽灵效果（ghost effect）设置为 100，这样地面造型和背景就会对齐。背景显示了关卡的样子，而地面精灵则充当它的碰撞箱（hitbox）。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_267_0.png)


    ## 16. 为猫精灵添加更多环绕代码


    注意，关中有几个悬浮平台和一个中间带有坑的山丘。当猫掉进坑里时，它会环绕舞台并在顶部重新出现。让我们为舞台的左右边缘也添加环绕代码。为猫精灵添加以下脚本。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_267_1.png)


    当猫行走走到舞台的左侧边缘时，它的 x 坐标将小于 -230。在这种情况下，我们通过将 x 坐标设置为 230 来让它环绕到右边缘。


    此外，如果猫从舞台的左侧移动，它的 y 坐标将小于 5。这会导致它在移动到舞台右边缘时进入地面内部，因此一个 `if...then` 模块会检查此条件并将
