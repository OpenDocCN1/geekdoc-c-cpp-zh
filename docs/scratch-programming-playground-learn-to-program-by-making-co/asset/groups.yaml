    # Add the Walk-Through-Walls Code to Orange Cat


    For the Orange Cat sprite, modify the walking code so the touching Maze? blocks
    are replaced with the touching Maze? and not key L pressed? blocks. Only the code
    for the up arrow is shown here, but you''ll want to replace the touching Maze?
    blocks in all four of the if key pressed.


    ```

    if key up arrow then

    change y by 4

    if touching Maze? and not key L pressed? then

    change y by 4

    ```


    This enables the wall-blocking code only if the L key is not being pressed. If
    the L key is pressed, this wall-blocking code is skipped, and the player walks
    through the walls.


    # Add the Walk-Through-Walls Code to Blue Cat


    Make the same walk-through-walls code changes to the Blue Cat sprite, except instead
    of key I pressed, make it key q pressed. The second player can walk through walls
    when the Q key is held down.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_88_0.png)


    # SUMMARY


    In this chapter, you built a game that


    - Has a cat sprite that can walk up, down, left, and right when the player presses
    certain keys

    - Has walls that the sprites can''t walk through

    - Broadcasts messages from one sprite that another sprite receive

    - Has a maze sprite with eight different costumes

    - Supports two players using different keyboard keys

    - Adds traps that turn on at random intervals to delay players

    - Includes cheat modes that let the cats walk through walls


    A two-player game is more exciting than a single-player game. Now, instead of
    just solving a maze, you are racing against another player! And you get to show
    off your Scratch game to someone else.


    In Chapter 4, you''ll work with a basketball game. This game uses a side view,
    unlike the maze''s bird''s-eye view. But this means you''ll be able to add jumping
    and gravity, which are great techniques to use in many types of Scratch games!


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_89_0.png)


    # REVIEW QUESTIONS


    Try to answer the following practice questions to test what you''ve learned. You
    probably won''t know all the answers off the top of your head, but you can explore
    the Scratch editor to figure out the answers. (The answers are also online at
    http://www.nostarch.com/scratchplayground/)


    1. Which block will change the size of a sprite?

    2. How can the code in one sprite send a message to another sprite to do something?

    3. How might you use the WASD keys on the keyboard?

    4. How can you duplicate some code blocks from one sprite to another sprite?

    5. What will happen if you accidentally use a change y by code block instead of
    a change x by code block?

    6. If you want a sprite to play the cheer sound, how do you load this sound?

    7. Look at the following code. It lets the player press the arrow keys to move
    the sprite left and right. It works, but what would you change to make the sprite
    walk faster?


    ```

    when 🚩 clicked

    forever

    if key right arrow pressed? then

    change x by 4

    if key left arrow pressed? then

    change x by -4

    ```


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_92_0.png)


    # 4 SHOOTING HOOPS WITH GRAVITY


    any platformer games, such as Super Mario Bros. and Donkey Kong Country, show
    a side view of the action, where the bottom of the screen is the ground and the
    character is shown from the side. These games have gravity: characters can jump
    up and then fall until they land on the ground. In this chapter, we''ll write
    a basketball game that has gravity. The player will jump and throw a basketball,
    and the basketball player and ball will fall downward.


    Before you start coding, look at the final program at https://www.nostarch.com/scratchplayground/.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_93_0.png)


    # SKETCH OUT THE DESIGN


    First, let''s sketch out what we want the game to do. The player controls the
    cat, which can move left and right and jump. The goal is to have the cat shoot
    baskets into a moving hoop, which will glide around the Stage.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_93_1.png)


    If you want to save time, you can start from the skeleton project named basketball-skeleton.sb.
    Go to https://www.nostarch.com/scratchplayground/ and download the ZIP file to
    your computer by right-clicking the link and selecting **Save as**. Extract all
    files from the ZIP file. The skeleton project has all the sprites loaded, so you''ll
    only need to drag the code into each sprite.


    # MAKE THE CAT JUMP AND FALL


    Let''s start by adding gravity to the cat jump up and fall down.


    1. Add Gravity to the Cat Click the variable button to open its Info Area. Rename
    the sprite Cat, and then close the Info Area. Then rename Untitled to Basketball
    in the text field at the top of the Scratch editor. Click the **Choose backdrop**
    button under New backdrop to open the Backdrop Library. Select **basketball**
    and click **OK**. The Stage will look like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_94_0.png)


    Programming gravity requires variables. You can think of a variable as a box for
    storing numbers or text that you can use later in your program. We''ll create
    a variable that represents how fast the cat is falling. First, make sure the Cat
    sprite is selected and then click the Scripts tab. In the orange Data category,
    click Make Variable button to bring up the New Variable window. Enter y velocity
    as the variable name. Velocity means how fast something is going and in what direction.
    When y velocity is a positive number, the cat moves up. When y velocity is a negative
    number, the cat moves down. Make sure For sprite only is selected. (If you see
    all sprites, the Cat sprite is not selected.) Then click OK.


    Several new blocks will appear in the Data category, and one of them is the round
    variable block, shown here:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_95_0.png)


    # EXPLORE: FOR ALL SPRITES VS. FOR THIS SPRITE ONLY


    When you create the y velocity variable, you have to select For sprite only. This
    option creates a variable that only the Cat sprite can use. The For all sprites
    option will create a variable that all sprites can use.


    To identify the kind of variable you''ve created, check the box next to the round
    variable block in the Blocks Area to make the variable appear on the Stage. If
    you selected For sprite only, the sprite name will display in front of the variable
    name. But if you select all sprites, only the variable name will show.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_96_0.png)


    The Cat sprite name before y velocity means that this is For sprite only. Check
    this box to make the variable visible on the Stage.


    If you made a mistake, and the sprite name Cat does not appear at the start of
    the variable name in your program, right-click the y velocity block in the orange
    Data category and select delete variable from the menu. Then create the y velocity
    variable again, making sure you select For sprite only.


    As with any variable block, you can place the y velocity block anywhere where
    you would normally enter a number or some text. The code block will use the number
    or text set in the variable. When you use variables, your program can change the
    variable''s number or text while the program is running.


    To put a value in your variable, you use the orange set to block. For example,
    if you created a variable greeting, you could use set to to put the value Hello!
    In it, you could use greeting in a say block, which would be the same as entering
    Hello! (Don''t add these blocks or create a greeting variable in your Basketball
    program; this is just an example.)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_97_0.png)


    If you want to change the greeting text while the program is running, you can
    add another set to block to your program. If the variable contains a number, you
    can add to or subtract from this number by using the change by block.


