    Click the green flag to test the code so far. When you win the game, make sure
    the You win! text has an animated entrance instead of just instantly appearing
    on the screen. To make winning the game faster, temporarily change the wait until
    Score = 28 block to wait until Score = 1. Then you need to break only one brick
    to win. Save your program.


    ## SUMMARY


    - In this chapter, you built a game that:

    - Uses clones to quickly create many copies of the Brick sprite and a trail of
    Tennis Ball2 sprites

    - Controls the Paddle sprite with the mouse instead of the keyboard arrow keys

    - Shows the player GAME OVER and You Win! messages that you created using the
    Paint Editor''s Text tool

    - Has several animated entrances and exits for sprites

    - Uses sound effects and background music to make the game feel more alive


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_147_0.png)


    Making the Brick Breaker game provided you with several techniques that you can
    add to future games. You can include animated entrances, color flashes, and sound
    effects in many programs to make them more exciting and fun. But it''s always
    best to make sure the plain, basic version of your game is working first and then
    start making it look later.


    This chapter also introduced cloning, which is a technique that you can add to
