    \ y position < -175 then\n      set y to 175\n    if y position > 175 then\n \
    \     set y to -175\ndelete this clone\n```\n\nThe clone starts by showing itself\
    \ and moving forward. The clones should also wrap around the edges of the Stage\
    \ just like the Spaceship sprite, so we use similar code to do that here.\nNotice\
    \ that the clones will set their own I am a clone variable to yes. This is so\
    \ that the clones do not run the code in the when space key pressed script. The\
    \ if then block in that script runs the code only if I am a clone is set to no.\n\
    The clones move forward 10 steps at a time 50 times. That means the Energy Blast\
    \ clones have a limited range and won’t keep moving forever. After the loop finishes\
    \ repeating 50 times, the clone deletes itself and disappears from the Stage."
