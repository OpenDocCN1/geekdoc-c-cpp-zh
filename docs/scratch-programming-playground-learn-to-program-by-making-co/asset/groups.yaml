    模块会检查它是否碰到猫精灵。由于苹果精灵隐藏在背景上，将其幽灵效果设置为 100。当猫精灵碰到苹果时，`Apples` 变量增加 1。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_270_0.png)


    > 保存点

    > 点击绿色旗帜测试目前的代码。确保猫可以走出舞台的左边缘并环绕到右侧，反之亦然。然后点击红色停止按钮并保存你的程序。


    ## 添加螃蟹敌人（Crab Enemies）


    为了让游戏更有挑战，我们需要添加一些玩家必须躲避的敌人。如果通过键盘按键控制它们，游戏将不再具有挑战性。右键点击猫精灵并选择克隆。将此克隆精灵命名为 Crab（螃蟹）。


