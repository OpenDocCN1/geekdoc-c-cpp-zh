    # EXPLORE: CLONING


    **The create clone of myself** block makes a duplicate of the sprite, which is
    called a *clone*. This feature is handy whenever you want to create many copies
    of an object in your game, such as a lot of bad guys that look the same, a bunch
    of coins for the player to collect, or in the *Brick Breaker* game, the bricks
    you need to hit.


    Let''s look at how clones work. Open Scratch in a new tab, and create a new program.
    Add this code to the Cat sprite:


    ```

