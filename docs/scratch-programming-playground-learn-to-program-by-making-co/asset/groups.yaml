    `x position / 50` 的数字应该乘以 -1；因此如果 x position 是正数，x velocity 将是负数，反之亦然。将 x velocity
    乘以 -1 确保舞台左侧的水果向右抛出，右侧的水果向左抛出。为了给抛掷增加一些变化，增加了一个 -2 到 2 之间的随机数。你将在第 11 步看到克隆是如何使用
    x velocity 变量的。


    x velocity 和 y 变量一起使用，使水果以一种称为抛物线（parabola）的曲线形状抛出。抛物线的数学用于许多科学和工程领域，但你在游戏中使用它们不需要学习太多关于抛物线的知识。如果你不懂这些代码块中的数学原理，不要担心。只要你完全按照书中所示复制这些块，你的水果就会被正确地抛出。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_195_0.png)


    ## II. 为水果角色克隆添加代码


    当原始 Fruit 角色创建自身的克隆时，克隆会运行自己的代码来将自己抛向上并检测自己是否被切割。


    首先，点击广播（broadcast）模块的黑色三角形，选择新消息，并输入“missed fruit（掉的水果）”，创建缺失的消息。然后将以下代码添加到 Fruit
    角色。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_196_0.png)


    此脚本控制 Fruit 克隆，但它看起来很复杂，让我们逐步拆解。原始 Fruit 角色是隐藏的，所以克隆做的第一件事是显示自己。


    接下来，只要克隆在空中，重力（gravity）和切割检测的代码就会循环运行。当克隆的位置低于 -170 时，克隆已掉到舞台底部。


    `repeat until` 块的第一部分通过将 y velocity 改变 -1 来让克隆受重力影响掉得更快。然后，克隆的位置的位置和方向通过 x velocity、y
    velocity 和 rotation speed 变量的值进行改变，使水果在空中沿抛物线路径移动。水平速度（在此情况下为 x velocity）不会改变，但垂直速度（在此情况下为
    y velocity）会随时间减少。


    `touching color` 块应该匹配 Slice（切割）角色的颜色。克隆通过检查自己是否碰到 Slice 角色的颜色来检测自己是否被切割。如果碰到这种颜色，`if
    then else` 块将造型编号设置为 5。


    `x position / 50` 的数字应该乘以 -1；因此如果 x position 是正数，x velocity 将是负数，反之亦然。将 x velocity
    乘以 -1 确保舞台左侧的水果向右抛出，右侧的水果向左抛出。为了给抛掷增加一些变化，增加了一个 -2 到 2 之间的随机数。你将在第 11 步看到克隆是如何使用
    x velocity 变量的。


    x velocity 和 y 变量一起使用，使水果以称为抛物线的曲线形状抛出。抛物线的数学用于许多科学和工程应用，但你在游戏中使用它们不需要学习太多关于抛物线的知识。如果你不懂这些代码块中的数学原理，不要担心。只要你完全按照书中所示复制这些块，你的水果就会被正确地抛出。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_195_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_194_0.png)


