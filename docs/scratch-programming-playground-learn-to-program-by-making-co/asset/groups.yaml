    \n在显示自己之前，“白色淡出”将它的幽灵效果设置为 100，使其完全不可见。然后，**repeat** 循环将幽灵效果减少 10 次。“白色淡出”精灵逐渐变得可见，白色缓慢地覆盖舞台上的所有内容。\n\
