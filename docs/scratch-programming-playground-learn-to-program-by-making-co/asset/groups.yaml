    \n# SAVE POINT\n\nClick the green flag to test the code so far. After 10 seconds,\
    \ the Fruit Platter sprite should appear. Make sure the Score variable increases\
    \ by 3 points when the snake touches the Fruit Platter sprite and that the sprite\
    \ disappears. Then click the red stop sign and save your program.\n\n# CHEAT MODE:\
    \ INVINCIBILITY\n\nIt would be fun to make the snake very, very long! Let's add\
    \ a cheat mode so the snake can keep growing without crashing into itself. We'll\
    \ also add a rainbow effect to the snake so that the player can see when cheat\
    \ mode is enabled.\n\n## Modify the Head\n\nModify the Head sprite's code to match\
    \ the following. You're adding to the script you wrote earlier and adding a whole\
    \ script, too. Both will require you to make a new variable named cheat mode.\
    \ Make this variable for all sprites.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_165_0.png)\n\
    \nScript controls how the cheat mode works. Pressing the spacebar toggles the\
    \ cheat mode variable between on and off. When set to on, the game over message\
    \ will not be broadcast, even if the Head is touching the lighter color. The reason\
    \ is that, in script ①, you've **added cheat mode = off** to the **if then** block\
    \ that checks whether the snake crashed into itself. If cheat mode is set to on,\
    \ it doesn't matter if the snake has crashed into itself, because both **touching\
    \ color?** and **cheat mode = off** must be true before **broadcast game over\
    \ and wait** runs.\n\nScript ② also has an **if then** block that will give the\
    \ Head a rainbow effect when the cheat mode is enabled. When the cheat mode is\
    \ not enabled, the color effect is reset to 0, which makes the sprite revert to\
    \ its original color.\n\n# Modify the Body Code\n\nNow we want to add this rainbow\
    \ effect to the Body clones. Modify the Body sprite's code to match this:\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_166_0.png)\n\nWhen the cheat mode variable\
    \ is set to on, the Body sprite will gradually change its color effect to produce\
    \ a rainbow. Otherwise, the Body sprite sets its color effect to 0.\n\n# SAVE\
    \ POINT\n\nClick the green flag to test the code so far. Hold down the spacebar\
    \ and try to crash into yourself. The game should not end. Then release the spacebar\
    \ and try to crash into yourself. Now the game should end. Make sure the rainbow\
    \ effect appears while you are holding down the spacebar. Then click the red stop\
    \ sign and save your program.\n\n# CHEAT MODE: CHOP OFF YOUR TAIL!\n\nThe game\
    \ is no longer a challenge if the snake is invincible. But it would be convenient\
    \ if you could temporarily get rid of the snake's body if you're about to crash\
    \ into it. Let's add a cheat that will instantly remove the body.\nAdd this code\
    \ to the Body sprite:\n\n```\nwhen key pressed\ndelete this clone\n```\n\nWhen\
    \ the player presses the C key, all the clones will delete themselves. (Nothing\
    \ happens to the original sprite because it is not a clone.)\n\n# SUMMARY\n\n\
    In this chapter, you built a game that:\n\n- Uses a sprite to generate a trail\
    \ of clones as it moves around the Stage\n- Uses a snake head and body costumes\
    \ that you drew in the Paint Editor\n- Detects when the snake head touches the\
    \ body by checking whether the head is touching the colors on the body\n- Uses\
    \ a variable to track when a cheat mode is turned on or off\n- Lets the player\
    \ control the direction of the snake with the keyboard but not the speed\n- Has\
    \ no end goal; the player continues playing as long as possible\n\nThe Snaaaaaake\
    \ game's keyboard controls are similar to those the Maze Runner game in Chapter\
    \ 3. The player has top-down view and moves up, down, left, and right. However,\
    \ the Snaaaaaake game is different because the player's character is always moving.\
    \ The player can control only the direction. You can use this style of movement\
    \ in fast-paced games of your design.\n\nIn Chapter 7, you'll learn how to use\
    \ the mouse in your programs by creating a clone of the Fruit Ninja game. Then\
    \ your programs will be able to use a keyboard, a mouse, or both!\n\n# REVIEW\
    \ QUESTIONS\n\nTry to answer the following practice questions to test what you've\
    \ learned. You probably won't know all the answers off the top of your head, but\
    \ you can explore the Scratch editor to figure out the answers. (The answers are\
    \ also online at http://www.nostarch.com/scratchplayground/)\n\n- 1. What is the\
    \ difference between when key pressed blocks and if key pressed? then blocks?\n\
    - 2. What does the go to x: pick random -220 to 220 y: pick random -160 to 160\
    \ block do?\n- 3. What is the difference between the glide block and the go to\
    \ block?\n- 4. Why do you need to draw the snake head facing to the right?\n-\
    \ 5. Why does the costume center of the Head sprite need to be set at the center?\n\
