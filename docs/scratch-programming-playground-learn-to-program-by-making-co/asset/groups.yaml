  - "[PAGE 280]\n\n# WHERE TO GO\nFROM HERE\n\nReady for more? There are plenty of\
    \ Scratch resources to keep\nthings exciting.\n\n+   - Scratch Programming Playground\
    \ Studio (http://nwww.inventwithscratch.com/studio/) is a place to share\nyour\
    \ own games based on the ones in the book! You can\ncheck out other readers while\
    \ you're there.\n\n+   - The Scratch Forums (http://scratch.mit.edu/discuss/)\
    \ is\na place for Scratchers to share ideas and ask answer\nquestions.\n\n+  \
    \ - ScratchEd (http://scratched.gse.harvard.edu/), is an\nonlinear community created\
    \ for teachers and other edu-\ncators who use Scratch. Share your success stories,\n\
    exchange Scratch resources, ask questions, and more.\n\nThere are many fun games\
    \ and animations you can make\n Scratch, but it does have some limitations. Your\
    \ Scratch\nprograms might not look like “real” games you play on a PC,\ngame console,\
    \ or smartphone.\n\nSo it's all natural that you want to learn how to\nwrite code\
    \ in a professional programming language. There are\nm languages to choose from,\
    \ but I recommend Python or\nJavaScript. Python is the easiest language to learn\
    \ (aside from\nScratch) but it is still a language used by professional software\n\
    developers. JavaScript is not quite as easy, but it's the lan-\ngauge used for\
    \ web apps that run in your browser."
