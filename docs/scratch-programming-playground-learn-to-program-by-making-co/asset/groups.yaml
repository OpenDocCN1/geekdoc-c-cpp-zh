    # 8

    ASTEROID BREAKER ...\IN SPACE!


    Asteroids is a classic game developed in 1979 by Atari. Since then, many programmers
    have remade the game, and it’s a great programming project to make in Scratch,
    too. The player pilots a spaceship that must destroy space asteroids while avoiding
    the space pieces that break off . . . in space! (It’s a well-known fact that adding
    “. . . in space!” makes everything more exciting.)'
