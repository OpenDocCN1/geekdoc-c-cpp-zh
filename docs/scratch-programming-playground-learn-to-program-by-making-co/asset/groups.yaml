- md: "\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_154_0.png)\n\nAdd this code to the\
    \ Head sprite:\n\n```\nwhen clicked\ngo to x: 0 y: -100\npoint in direction 0\n\
    set Score to 0\nforever\nmove 10 steps\nwhen up arrow key pressed\npoint in direction\
    \ 0\nwhen down arrow key pressed\npoint in direction 180\nwhen left arrow key\
    \ pressed\npoint in direction -90\nwhen right arrow key pressed\npoint in direction\
    \ -90\n```\n\nScript sets the starting position and the starting direction (0\
    \ degrees, or straight up) for the snake head. It sets the player's score to 0,\
    \ which will require you to create a For all sprites named Score. As in previous\
    \ projects, you can create a variable by clicking the Make Variable button on\
    \ the orange Data category. Because we want the snake to never stop moving, program\
    \ includes a forever 10 steps loop.\n\nScripts are short scripts that handle the\
    \ player's controls: the directions correspond to the up, down, left, and right\
    \ arrow keys.\n\nSNAAAAAAKE! 129\n\n# SAVE POINT\n\nClick the green flag to test\
    \ the code so far. Make sure the arrow keys correctly direct the snake head in\
    \ all four directions: up, down, left, and right. Then click the red stop sign\
    \ and save your program.\n\n# EXPLORE: WHEN KEY PRESSED VS. IF KEY PRESSED? THEN\n\
    \nIn this Snaaaaaake program, the when key pressed code block moves the player\
    \ around and is used when a key is supposed to be pressed once.\n\nIn the maze\
    \ game in Chapter 3, the if then block with a key pressed? block inside a forever\
    \ loop moved the player around. Use the if key pressed? then code when a key is\
    \ meant to be pressed and held down.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_155_0.png)\n\
    \nThese two ways of programming the player's controls are not quite the same.\
    \ Be sure to use the appropriate blocks for the game you want to make. Because\
    \ the snake is always moving, the player needs to press a key only to change the\
    \ snake's direction. This is why the Snaaaaaake game uses the when key pressed\
    \ blocks.\n\n# MAKE APPLES APPEAR\n\nThe basics of moving the snake around are\
    \ done, so let's add the apple the snake will try to eat.\n\n## 2. Add the Apple\
    \ Sprite\n\nClick the **Choose sprite from library** button next to New sprite,\
    \ and select the Apple sprite from the Sprite Library. Add this code:\n\n```\n\
    when clicked\nset size to 50 %\nforever\n  if touching Head ? then\n    change\
    \ Score by 1\n    go to x: pick random -220 to 220 y: pick random -160 to 160\n\
    ```\n\nThis code makes the Apple sprite disappear when the snake touches it and\
    \ then reappear elsewhere on the Stage. The new position is picked from random\
    \ numbers, like rolling dice. The script also adds 1 to the Score variable each\
    \ time the Head sprite touches the Apple sprite.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_156_0.png)\n\
    \n# SAVE POINT\n\nClick the green flag to test the code so far. Move the snake\
    \ around to eat the apple. When the snake's head touches the apple, make sure\
    \ the apple moves somewhere else. The Score variable should increase by 1 each\
    \ time the snake's head touches the apple. Then click the red stop sign and save\
    \ your program.\n\n# MAKE A BODY THAT APPEARS BEHIND THE SNAKE HEAD\n\nNext, we'll\
    \ add the body of the snake, which we want to grow with each apple it eats.\n\n\
    ## 3. Create the Body Sprite\n\nClick the Paint new sprite button next to New\
    \ sprite to create a new sprite. Draw a small square using the same color as the\
    \ snake's head. Make sure the costume center is in the middle of the square by\
    \ clicking the Set costume center button and then clicking the middle of the square.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_157_0.png)\n\nClick the sprite's i\
    \ button to open its Info Area, and rename the sprite Body.\n\n## 4. Create the\
    \ Body Sprite's Second Costume\n\nWhile you're still in the Paint Editor, right-click\
    \ the costume1 costume, and select duplicate from the menu. Using the Fill tool,\
    \ change the color of the square to a different color, such as a light green.\
    \ (My program uses dark green for the snake's head and a lighter green for the\
    \ body's second costume.) We'll use the light green color to detect whether the\
    \ snake has crashed into itself. You can also add patterns on top of this.\n\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_158_0.png)\n\nYou can draw clothes on\
    \ the snake's body if you want. I'd recommend a boa-tie, a feather boa, or some\
    \ Nike snakeakers. Or you can leave it s-naked. (Will these snake puns ever end?\
    \ Don't ask me!)\n\nJust make sure the Body costumes are square and that costume2\
    \ uses a different color than costume1.\n\n## 5. Add the Code for the Body Sprite\n\
    \nClick the Scripts tab, and add the following code to the Body sprite. We want\
    \ the Body sprite to always follow the Head sprite and generate clones of itself.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_0.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_1.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_2.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_3.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_4.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_5.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_6.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_7.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_8.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_9.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_10.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_11.png)\n\
    \nThe original Body sprite code runs under the green flag clicked ①. As the Head\
    \ sprite moves over the Stage, the Body sprite creates a trail of Body clones\
    \ in its path.\n\nThe Body clones run under when I start as a clone ②. When the\
    \ Body clone is first created, it points in a random direction. The pick 0 to\
    \ 90 block makes the Body clone face 0, 90, 180, or 270 degrees. This rotation\
    \ makes the body segments look different.\n\nThe clones eventually need to delete\
    \ themselves from the Stage so that the snake doesn't keep growing. So each clone\
    \ waits for a short time based on the Score variable in the wait Score / 5 secs\
    \ block before deleting itself. Every clone waits this amount of time, so the\
    \ first Body clones made are deleted.\n\nEating apples increases the Score variable.\
    \ As the Score variable increases, the amount of time a clone waits waits deleting\
    \ itself also increases. This longer wait makes the snake look longer, because\
    \ more Body clones remain on the Stage. The more apples the snake eats, the longer\
    \ the snake gets.\n\nWhen Score is set to 0, the wait is 0/5 seconds, or 0 seconds.\
    \ When Score set to 1, the wait is 1/5, or 0.2 seconds. When Score is set to 2,\
    \ the wait is 2/5, or 0.4 seconds. Each point added to Score adds another 0.2\
    \ seconds of wait time, resulting in a longer and longer snake. As the snake gets\
    \ longer, the difficulty of the game really scales up!\n\n# SAVE POINT\n\nClick\
    \ the green flag to test the code so far. Make sure the Body clones form a trail\
    \ behind the snake that gets longer as the snake eats more apples. Then click\
    \ the red stop sign and save your program.\n\n## 6. Detect Whether the Snake Crashes\
    \ into itself or a Wall\n\nWhen the snake crashes into itself or the edges of\
    \ the Stage, we want to run the **when I receive game over** code: the Head sprite\
    \ will say “Ouch!” for 2 seconds and then stop the program. Instead of writing\
    \ the same code twice, let's put the code for all crashes under a **when I receive\
    \ game over** block so that either crash can broadcast game over and run this\
    \ code. If you want to change the code, you just need to change it in one place—in\
    \ the **when I receive game over** script.\n\nAdd the following code to the Head\
    \ sprite:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_160_0.png)\n\n```\nwhen\
    \ I receive game over\n  say Ouch! for 2 secs\n  go to x: 0 y: -100\n  point in\
    \ direction 90\n  set Score to 0\n  forever\n    move 10 steps\n    if touching\
    \ color ? then\n      broadcast game over\n    if touching edge ? then\n     \
    \ broadcast game over\n```\n\nUsing the touching color? block, the first if loop\
    \ tests for the condition when the snake touches its own body: make sure you use\
    \ the color used in costume2 for this condition. The next two if statements test\
    \ the horizontal and vertical boundaries of the Stage. When the snake crosses\
    \ them, the same game over broadcast is sent. Let's hope the player is quick to\
    \ avoid crashing; otherwise, snake is history!\n\nDid you notice the wait 0.01\
    \ secs block in the Body sprite that makes the Body waits bit before changing\
    \ costumes? Here's the code for the Body sprite:\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_161_0.png)\n\
    \nThe second costume for the Body sprite has a lighter color that the Head sprite\
    \ uses to detect if the snake has crashed into itself. Because the Body clones\
    \ are created at the same place as the Head sprite, they are touching when they\
    \ first appear. This is why we want to pause the crash detection when the clone\
    \ is created. Without this pause, the Head sprite would think it crashed into\
    \ the Body clone that was just created.\n\n# SAVE POINT\n\nClick the green flag\
    \ to test the code so far. Crash into the wall and into the snake's body on purpose\
    \ to make sure the crash detection works. If your snake appears to be crashing\
    \ even though it not touching itself or the edges, try increasing the wait time\
    \ from 0.01 to 0.02 or larger. Also make sure that the game over code doesn't\
    \ run if the snake isn't crashing into anything. Then click the red stop sign\
    \ and save your program.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_161_1.png)\n"
  mdcn: "\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_154_0.png)\n\n将此代码添加到“Head”（头部）角色中：\n\
    \n```\nwhen clicked\ngo to x: 0 y: -100\npoint in direction 0\nset Score to 0\n\
    forever\nmove 10 steps\nwhen up arrow key pressed\npoint in direction 0\nwhen\
    \ down arrow key pressed\npoint in direction 180\nwhen left arrow key pressed\n\
    point in direction -90\nwhen right arrow key pressed\npoint in direction -90\n\
    ```\n\n该脚本设置了蛇头的初始位置和初始方向（0 度，即垂直正上方）。它将玩家的分数设置为 0，这将要求你创建一个名为 Score 的“所有角色”变量。与之前的项目一样，你可以通过点击橙色“数据”（Data）类别上的“建立变量”按钮来创建一个变量。因为我们希望蛇永远不会移动，程序包含了一个\
    \ `forever` 10 步的循环。\n\n这些脚本是处理玩家控制的短脚本：方向分别对应上、下、左、右方向键。\n\nSNAAAAAAKE! 129\n\
    \n# 保存点\n\n点击绿色旗帜测试目前的代码。确保方向键能正确地引导蛇头在四个四个方向上移动：上、下、左、右。然后点击红色停止按钮并保存你的程序。\n\n\
    # 探索：当按下键 (WHEN KEY PRESSED) 与 如果按下键 (IF KEY PRESSED? THEN)\n\n在这个贪蛇程序中，`when\
    \ key pressed` 代码块用于移动玩家，并适用于预期只需按下一次键的情况。\n\n在第 3 章的迷宫游戏中，通过在 `forever` 循环中使用带有\
    \ `key pressed?` 的 `if then` 块来移动玩家。当需要按下并按住按键时，请使用 `if key pressed? then` 代码。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_155_0.png)\n\n这两种编程玩家控制的方法并不完全相同。请确保为你想要制作的游戏使用适当的代码块。因为蛇始终在移动，玩家只需要按下按键来改变蛇的方向。这就是为什么贪蛇游戏使用\
    \ `when key pressed` 代码块的原因。\n\n# 让苹果出现\n\n移动蛇的基础操作已经完成，现在让我们添加蛇尝试吃掉的苹果。\n\n##\
    \ 2. 添加苹果角色\n\n点击“新角色”（New sprite）旁边的**从角色库选择角色**按钮，并从角色库中选择“Apple”（苹果）角色。添加此代码：\n\
    \n```\nwhen clicked\nset size to 50 %\nforever\n  if touching Head ? then\n  \
    \  change Score by 1\n    go to x: pick random -220 to 220 y: pick random -160\
    \ to 160\n```\n\n这段代码会在蛇碰到苹果时让苹果角色消失，然后出现在舞台的另一个地方。新位置是通过随机数选取的，就像掷骰子一样。每当“Head”角色碰到苹果角色时，脚本都会向\
    \ `Score` 变量加 1。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_156_0.png)\n\n# 保存点\n\
    \n点击绿色旗帜测试目前的代码。移动蛇去吃苹果。当蛇头碰到苹果时，确保苹果移动到其他地方。每当蛇头碰到苹果时，`Score` 变量应该增加 1。然后点击红色停止按钮并保存你的程序。\n\
    \n# 创建一个出现在蛇头后方的身体\n\n接下来，我们将添加蛇的身体，我们希望它能随着吃掉每一个苹果而增长。\n\n## 3. 创建身体角色\n\n点击“新角色”旁边的“画新角色”（Paint\
    \ new sprite）按钮来创建一个新角色。使用与蛇头相同的颜色画一个小正方形。点击“设置造型中心”按钮然后点击正方形的中心，确保造型中心位于正方形的中间。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_157_0.png)\n\n点击角色的 `i` 按钮打开其信息区域，并将角色重命名为“Body”（身体）。\n\
    \n## 4. 创建身体角色的第二个造型\n\n当你还在画编辑器中时，右键点击 `costume1` 造型，并在菜单中选择“复制”（duplicate）。使用填充工具将正方形的颜色改为另一种颜色，例如浅绿色。（我的程序蛇头使用深绿色，身体的第二个造型使用较浅的绿色。）我们将使用浅绿色来检测蛇是否撞到了它自己。你也可以在上面添加图案。\n\
    \n![](img/44bc3330bef7ae1ad43f0775f36b6931_158_0.png)\n\n如果你愿意，可以在蛇的身体上画上衣服。我建议画围巾、羽毛披巾或一些耐克的运动鞋。或者你也可以让它光溜的。（这些关于蛇的笑话什么时候是个头？别问我！）\n\
    \n只需确保“Body”造型是正方形的，且 `costume2` 的颜色与 `costume1` 不同即可。\n\n## 5. 为身体角色添加代码\n\n\
    点击“脚本”（Scripts）标签页，为“Body”角色添加以下代码。我们希望“Body”角色始终跟随“Head”角色并生成自身的克隆。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_0.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_1.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_2.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_3.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_4.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_5.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_6.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_7.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_8.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_9.png)\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_10.png)\n\
    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_159_11.png)\n\n原始的“Body”角色代码在点击绿色旗帜时运行\
    \ ①。当“Head”角色在舞台上移动时，“Body”角色在其路径上创建一条 Body 克隆的痕迹。\n\nBody 克隆在“作为克隆时”运行时 ②。当 Body\
    \ 克隆被创建时，它指向一个随机方向。`pick 0 to 90` 块让 Body 克隆面向 0、90、180 或 270 度。这种旋转让身体部分看起来不同。\n\
    \n克隆最终需要从舞台上删除自己，否则蛇会一直增长。因此，每个克隆根据 `Score` 变量等待一段时间（使用 `wait Score / 5 secs`\
    \ 块）。每个克隆等待这段时间后，先创建的 Body 克隆会被删除。\n\n吃苹果会增加 `Score` 变量。随着 `Score` 变量的增加，克隆等待的时间也会增加。这种更长的等待让蛇看起来更长，因为舞台上留下了更多的\
    \ Body 克隆。蛇吃的苹果越多，就越长。\n\n当 `Score` 设置为 0 时，等待时间为 0/5 秒，即 0 秒。当 `Score` 设置为 1\
    \ 时，等待时间为 1/5 秒，即 0.2 秒。当 `Score` 设置为 2 时，等待时间为 2/5 秒，即 0.4 秒。Score 每增加分数都会增加\
    \ 0.2 秒的等待时间，导致蛇变得越来越长。随着蛇变长，游戏的难度也大大增加了！\n\n# 保存点\n\n点击绿色旗帜测试目前的代码。确保 Body 克隆在蛇后面形成一条痕迹，并随着蛇吃苹果而变长。然后点击红色停止按钮并保存你的程序。\n\
    \n## 6. 检测蛇是否撞到自己或墙壁\n\n当蛇撞到自己或舞台边缘时，我们希望运行“当收到游戏结束”（when I receive game over）代码：“Head”角色会说“Ouch!”2\
    \ 秒然后停止程序。与其编写两次相同的代码，让我们把所有碰撞代码放在一个 `when I receive game over` 块下，这样任何碰撞都可以广播游戏结束并运行这段代码。如果你想更改代码，只需要在一个地方更改——即\
    \ `when I receive game over` 脚本中。\n\n为“Head”角色添加以下代码：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_160_0.png)\n\
    \n```\nwhen I receive game over\n  say Ouch! for 2 secs\n  go to x: 0 y: -100\n\
    \  point in direction 90\n  set Score to 0\n  forever\n    move 10 steps\n   \
    \ if touching color ? then\n      broadcast game over\n    if touching edge ?\
    \ then\n      broadcast game over\n```\n\n使用 `touching color?` 块，第一个 `if` 循环测试蛇撞到自己身体的情况：确保你在该条件中使用\
    \ `costume2` 中的颜色。接下来的两个 `if` 语句测试舞台的水平和垂直边界。当蛇跨越这些边界时，会发送相同的游戏结束广播。希望玩家足够快以避免碰撞；否则蛇就没完蛋了！\n\
    \n你注意到“Body”角色中的 `wait 0.01 secs` 块了吗？它让身体在切换造型之前等待一下。这里是“Body”角色的代码：\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_161_0.png)\n\
    \n“Body”角色的第二个造型有一个较浅的颜色，“Head”角色用它来检测蛇是否撞到了自己。因为 Body 克隆与“Head”角色相同的位置创建，所以它们在第一次出现时是接触的。这就是为什么我们要在克隆被创建时暂停碰撞检测。如果没有这个暂停，“Head”角色会认为它撞到了刚创建的\
    \ Body 克隆。\n\n# 保存点\n\n点击绿色旗帜测试目前的代码。故意撞向墙壁和蛇身体以确保碰撞检测正常。如果你的蛇在没有撞到自己或边缘的情况下看起来在碰撞，尝试将等待时间从\
    \ 0.01 增加到 0.02 或更大。还要确保当蛇没有撞到任何东西时，游戏结束代码不会运行。然后点击红色停止按钮并保存你的程序。\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_161_1.png)\n\
    \n"
