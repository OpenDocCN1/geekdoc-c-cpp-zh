    \ way, Energy never goes above 10.\n\n> ### SAVE POINT\n> Click the green flag\
    \ to test the code so far. Make sure the Energy variable is visible on the Stage.\
    \ Fire an energy blast and watch Energy decrease by 1. When Energy is 0, the spaceship\
    \ should not be able to fire. Energy recharges by 1 every half second. Then click\
    \ the red stop sign and save your program. (Wait, the OCR text was flawed here,\
    \ correcting logic based on context):\n> *Correction based on context:* Modify\
    \ the code in the Energy Blast sprite... Then click the red stop sign and save\
