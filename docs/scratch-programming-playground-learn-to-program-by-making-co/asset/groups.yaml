    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_1.png)


    ## 12. 创建 Health（血量）角色


    Health 角色将指示玩家在游戏结束前还可以漏多少水果。每当玩家漏掉水果时，角色就会切换到下一个造型。


    点击 New sprite（新角色）旁边的添加按钮。打开此新角色的绘制区域并将其重命名为 Health。在画编辑器中，使用线条（Line）工具画三个 X，并复制三次这个造型。我的
    X 是左到右增加的，但只要你有三个，你可以以任何方式设计它们。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_0.png)


    将造型1 重命名为 3 health，造型2 重命名为 2 health，造型3 重命名为 1 health，造型4 重命名为 0 health。将 3 health
    的三个 X 都保持蓝色。但对于其他造型，使用填充（Fill）工具。点击垂直渐变，选择一个较浅的红色和一个较深的红色，将 X 涂成红色渐变色。2 health
    造型有一个红色 X，1 health 造型有两个红色 X，0 health 造型有三个红色 X。确保你的造型顺序与此处所示如图一致：


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_199_1.png)


    Health 角色将根据它收到的不同广播消息切换造型。将以下代码添加到 Health 角色中。到这一步，所有消息都应该已经存在，所以你不需要创建它们。


