    To create a new code block, drag it from the center Blocks Area to the Scripts
    Area. The code blocks that have a notch on top and bump on the bottom are called
    stack blocks. To snap a stack block together with another stack block, drag the
    code block close to the bottom of the other. When a white outline appears, drop
    the code block.


