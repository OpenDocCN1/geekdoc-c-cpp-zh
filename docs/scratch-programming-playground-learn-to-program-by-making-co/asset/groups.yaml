  - '[PAGE 270]


    During the game, the Apple sprite needs to appear in random places on the Stage.
    We make the Apple sprite invisible using set ghost effect to 100. It then moves
    to a random place on the Stage.


    But not any random place on the Stage will do. We need to make sure the Apple
    sprite is not inside the Ground sprite, because it would be impossible for the
    player to get it. To prevent the Apple sprite from moving to somewhere inside
    the Ground sprite, the loop keeps trying new random places until the Apple sprite
    is no longer touching the Ground sprite. The movement of the apple will be visible
