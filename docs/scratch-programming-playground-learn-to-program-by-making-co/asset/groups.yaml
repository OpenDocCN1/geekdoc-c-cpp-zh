- md: "\nscore decrease over time to encourage the player to fire faster.\nThe player\
    \ could also keep blasting willy-willy without aiming carefully, so we made an\
    \ Energy variable to limit how fast the player could fire.\n\nEach time you add\
    \ a feature to your games, a game that is too hard to play is frustrating, but\
    \ a game that is too easy is boring. It's all about finding a balance.\n\nThe\
    \ next game is the most advanced program yet: it's a platformer game like Super\
    \ Mario Bros. or Super Meat Boy. Not only will it have jumping and gravity like\
    \ the Basketball game, but you'll be able to design custom levels for it without\
    \ changing the code!\n\n# REVIEW QUESTIONS\n\nTry to answer the following practice\
    \ questions to test what you've learned. You probably won't know all the answers\
    \ off the top of your head, but you can explore the Scratch editor to figure out\
    \ the answers. (The answers are also online at http://www.nostarch.com/scratchplayground/)\n\
    \n- 1. How does the wrap-around code work?\n- 2. Why does the Energy Blast sprite\
    \ have a clone variable?\n- 3. What prevents the Asteroid clone from breaking\
    \ into exponentially more pieces forever?\n- 4. How does the Explosion sprite's\
    \ code make it look like the spaceship explodes?\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_234_0.png)\n\
    \n# 9 MAKING AN ADVANCED PLATFORMER\n\nThe first *Super Mario Bros.* game was\
    \ introduced in 1985 and became Nintendo's greatest video game franchise and one\
    \ of the most influential games of all time. Because the game involves making\
    \ a character run, jump, and hop from platform to platform, this game style is\
    \ called a platformer (or platform game).\n\nIn the Scratch game in this chapter,\
    \ the cat will play the part of Mario or Luigi. The player can make the cat jump\
    \ around a single level to collect apples while avoiding the crabs who steal them.\
    \ The game is timed: the player has just 45 seconds to collect as many apples\
    \ as possible while trying to avoid the crabs!\n\nBefore you start coding, look\
    \ at the final program at https://www.nostarch/scratchplayground/\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_235_0.png)\n\
    \nGet ready to program a more complicated game than those in previous chapters!\n\
    \n# SKETCH OUT THE DESIGN\n\nLet's sketch out on paper what the game should look\
    \ like. The player controls a cat that jumps around while apples appear randomly.\
    \ The crabs walk and jump around the platforms randomly, too.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_236_0.png)\n\
    \nHere's what we'll do in each part:\n\n- A. Create gravity, falling, and landing\n\
    - B. Handle falling slopes and walls\n- C. Make the cat jump high and low\n- D.\
    \ Add ceiling detection\n- E. Use a hitbox for the cat sprite\n- F. Add a better\
    \ walking animation\n- G. Create the level\n- H. Add crab enemies and apples\n\
    \nThis platform game is the most ambitious one in the book, but anyone can code\
    \ it if they follow the steps in this chapter. Let's code each part one step at\
    \ a time.\nIf you want to save time, you can start from the skeleton project file,\
    \ named platformer-skeleton.sb2, in the resources ZIP file. Go to https://www.nostarch.com/scratchplayground/\n\
    \nand download the ZIP file to your computer by right-clicking the link and selecting\
    \ **Save link as** or **Save target as**. Extract all the files from the ZIP file.\
    \ The skeleton project file has all the sprites already loaded, so you'll only\
    \ need to drag the code blocks into each sprite.\n\n# CREATE GRAVITY, FALLING,\
    \ AND LANDING\n\nIn the first part, we'll add gravity, falling, and landing code,\
    \ similar to the *Basketball* game in Chapter 4. The important difference is that\
