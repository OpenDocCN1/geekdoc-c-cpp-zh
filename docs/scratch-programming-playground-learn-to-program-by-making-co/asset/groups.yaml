    \ 253\n\n# WHERE TO GO FROM HERE 255\n# INDEX 257\n\n# ACKNOWLEDGMENTS\n\nIt's\
    \ misleading to have just my name on the cover. This book wouldn't exist without\
    \ the efforts of many people. I'd like to thank my publisher, Bill Pollock; my\
    \ editors, Laurel Chun and Tyler Ortman; my technical reviewer, Martin Tan;\n\n\
    Special thanks to MIT Media Lab, and of Digital Entertainment, California.\n\n\
    Wait,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,\
    \ to, No St Press.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b931_20.png)\n\n# INTRODUCTION\n\
    Playing games is fun, but programming your own games is a creative, challenging\
    \ skill that will let you make your own fun. The free Scratch environment gives\
    \ everyone an easy way to learn skills. While Scratch is primarily designed for\
    \ 8- to 16-year-olds, it’s used by people of all ages, including younger children\
    \ with their parents and college students learning their first language.\n\nThere's\
    \ so much you can do with Scratch, it's hard to know where to start. That's where\
    \ this book comes in. This book guides you through creating games in Scratch.\
    \ By building the projects in this book, you'll get a good idea of which blocks\
    \ are commonly used to create games in Scratch. These projects provide a solid\
    \ foundation for you to build upon when creating your original programs.\n\n#\
    \ WHO THIS BOOK IS FOR\n\nNo programming experience is necessary to read this\
    \ book. The only mathematics skills required are basic arithmetic: addition, subtraction,\
    \ multiplication, and division. Don't let math phobia prevent you from learning\
    \ to program. And don't forget that the computer will perform calculations for\
    \ you!\n\nEach program in the book is easy to make by following the step-by-step\
    \ instructions. You'll learn about the code blocks and programming concepts as\
    \ you make games that use. No matter your skill level, there's no reason you can't\
    \ start this now!\n\nKids can follow along with the activities on their own, this\
    \ book is also for parents, teachers, and volunteers who want to introduce their\
    \ children or students to the world of programming. The projects are ideal for\
    \ a weekend activity or afterschool computer club. Adults don't have to use this\
    \ book to help others.\n\nIf you want a thorough guide to all Scratch's features,\
    \ I recommend the book Learn to Program with Scratch by Majdi Mardi (No St Press,\
    \ 2014) to supplement this one. You can also watch video tutorials online at https://scratch.mit.edu/help/videos/\
    \ and https://inventwithscratch.com\n\nBut programming is a hands-on skill like\
    \ karate or guitar: you can't learn it by reading alone! Make sure you follow\
    \ along and creating the games—you'll learn a lot more that way.\n"
