    # ABOUT THE AUTHOR


    Al Sweigart is a software developer, tech book author, and hoopy frood who knows
    where his towel is. He has written several programming books for beginners, including
    Automate the Boring Stuff with Python, also from No Starch Press. His books are
    freely available under a Creative Commons license at his website http://www.inventwithpython.com/


    # ABOUT THE TECHNICAL REVIEWER


    Martin Tan helps run a Code Club in Australia, and he wrote the space-themed Scratch
    and Python projects for Moonhack 2016 that brought over 9,000 kids together to
    break the world record for children coding simultaneously. Martin also works as
    a penetration tester, contributing to various open source projects and research.'
