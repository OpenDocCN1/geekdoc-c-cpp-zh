    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_116_0.png)\n\n> Remember to add the\
    \ new pick random block for y!\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_116_1.png)\n\
    \n### SAVE POINT\nClick the green flag to test the code so far. Press the 7 key,\
    \ and make sure the hoop stops gliding to new positions for 6 seconds. Then click\
    \ the red stop sign and save your program.\n\n## SUMMARY\n\nIn this chapter, you\
    \ built a game that:\n\n- Implements gravity and realistic falling\n- Has a side-view\
    \ perspective instead of a top-down view\n- Uses variables to keep track of scores,\
    \ falling speeds, and the first time a basket is made\n- Has a hitbox to detect\
    \ when a basket is made\n\nThe use of gravity in this program was pretty simple.\
    \ By the time you reach Chapter 9, you'll be able to make an advanced platformer\
    \ game with more complex jumping and falling. But there are plenty of Scratch\
    \ programming techniques to practice first. In Chapter 5, you'll make a side-view\
    \ game that uses cloning to duplicate a sprite dozens of times.\n\n## REVIEW QUESTIONS\n\
    \nTry to answer the following practice questions to test what you've learned.\
    \ You probably won't know all the answers off the top of your head, but you can\
    \ explore the Scratch editor to figure out the answers. (The answers are also\
    \ online at http://www.noostart.com/scratchplayground/)\n\n1. How is a side-view\
    \ game (like the Basketball game) different from a top-down game (like the Maze\
    \ Runner game)?\n2. What can a variable store?\n3. What is the difference between\
    \ For this sprite only and For all sprites?\n4. How can you make a sprite jump?\n\
    5. When the cat jumps in the Basketball game, what keeps it from just going up\
    \ forever?\n6. What is the difference between the glide and go to x y blocks?\n\
    7. How do you make the code inside an if-then block run if two conditions are\
    \ true?\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_118_0.png)\n\n## 5 A POLISHED\
    \ BRICKAKER GAME\n\nHave you ever seen a brick breaker game? The player controls\
    \ a paddle at the bottom of the screen to bounce a ball that breaks blocks at\
    \ the top of the screen. The player loses when the ball gets past the paddle.\
    \ This game is simple enough to program, but it can look a bit boring. In this\
    \ chapter, you'll learn a few tricks to make the game more colorful and interesting\
    \ by adding animations and effects.\n\nYou'll use an iterative process: first,\
    \ you'll make the basic game, and then you'll make small improvements to it. The\
    \ result will be a more professional-looking game that other Scratchers on the\
    \ Scratch website will think looks awesome.\n\nThe following figure shows what\
    \ the Brick Breaker game looks like before and after polishing it.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_119_0.png)\n\
    \nBefore you start coding, take a look at the final game at https://www.nostarch.com/scratchplayground/.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_119_1.png)\n\n## SKETCH OUT THE DESIGN\n\
    \nLet's start by drawing what the game should look like. The following figure\
    \ shows what the Brick Breaker game looks like before and after polishing it.\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_120_0.png)\n\n## SCORE\n\nThe paddle\
    \ is set at the bottom of the screen. It follows the mouse, but we want the sprite\
    \ to always look flat.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_120_1.png)\n\
    \n## MAKE PADDLE THAT MOVES LEFT AND RIGHT\n\nThe player controls a paddle at\
    \ the bottom of the screen to bounce a ball that breaks blocks at the top of the\
    \ screen. The player loses when the ball gets past the paddle. This game is simple\
    \ enough to program, but it can look a bit boring. In this chapter, you'll learn\
    \ a few tricks to make the game more colorful and interesting by adding animations\
    \ and effects.\n\nThe paddle is set at the bottom of the screen. You'll make the\
    \ basic game, and then you'll make small improvements to it. The result will be\
    \ a more professional-looking game.\n\nThe paddle follows the mouse, but we want\
    \ the sprite to always look flat.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_121_0.png)\n\
    \nThe paddle is set at the bottom of the screen. It follows the mouse, but we\
    \ want the sprite to always look flat.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_121_1.png)\n\
    \n## EXPLORE: ROTATION STYLES\n\nThe rotation style sets how the sprite looks\
    \ when it changes direction. The three styles are all around, left-right, and\
    \ don't rotate.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_122_0.png)\n\nWhen\
    \ a sprite is set to all around, it will face exactly where its direction points.\
    \ But this won't work for a side-view game (like the Basketball game in Chapter\
    \ 4), because the sprite will be upside down when its faces left. Instead, for\
    \ these games you'll use the left-right rotation style. The sprite will face only\
    \ 90 degrees (right) or -90 degrees (left), whichever is closest to the sprite's\
    \ direction. If you don't want the sprite to rotate at all, even as its direction\
    \ changes, set the rotation style to don't rotate.\n\n## MAKE A BALL THAT BOUNCES\
    \ OFF THE WALLS\n\nThe Scratch Sprite Library has several sprites you could use\
    \ for the ball, but let's use the Tennis Ball sprite for this game.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_123_0.png)\n"
