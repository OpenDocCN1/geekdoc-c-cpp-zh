  - '[PAGE 239]


    This code performs two actions in its *forever* loop: it makes the Cat sprite
    fall until it touches the Ground sprite ① and then lifts up the Cat sprite if
    it is deep in the ground ②. With these two code sections, the cat will fall down,
    the ground, and then rise if necessary, eventually settling on top of the Ground
    sprite.


    In the air, falling down


    Hitting the ground and rising up


    Resting on top of the ground


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_239_0.png)


    The falling code at ① subtracts 2 from the y velocity variable and then moves
    the Cat sprite''s y position by y velocity, making the Cat fall faster and faster.
    If you programmed the Basketball game in Chapter 4, the falling code should be
    familiar.


    But the **repeat until** block ② will loop until the Cat is no longer touching
    the Ground sprite. (If the Cat is still in the air and falling, it will not be
    touching the ground, so the code in the loop is skipped.) Inside this loop, the
    y velocity is set to 0 so that the Cat stops falling farther. The **change y by
    1** block will lift up the Cat sprite a little. The **repeat until not touching
    Ground** block continues lifting the sprite until it is no longer sunk into the
    Ground. This is how the cat stays on top of the ground, no matter what the shape
    of the Ground sprite is.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_239_1.png)'
