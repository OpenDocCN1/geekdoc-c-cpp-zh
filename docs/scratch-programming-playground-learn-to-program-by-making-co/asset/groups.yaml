    \nAdd this code to the new sprite:\n\n```\nwhen clicked\n  hide\n  set size to\
    \ 50 %\n  forever\n    wait 10 secs\n    go to x: pick random -150 to 150 y: pick\
    \ random -150 to 150\n    show\nwhen clicked\n  forever\n    if touching Head\
    \ ? then\n      hide\n      change Score by 3\n```\n\nThe Fruit Platter sprite's\
    \ code is almost identical to the Apple sprite's code except it has a 10-second\
