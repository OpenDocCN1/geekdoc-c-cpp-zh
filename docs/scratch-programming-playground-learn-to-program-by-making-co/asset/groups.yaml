    # B MAKE THE SLICE TRAIL


    There isn''t a sprite used for the player''s character in Fruit Slicer. Instead,
    the player clicks and drags the mouse across the screen, causing a trail to briefly
    appear as a blade slice effect.


    # 3. Draw the Slice Sprite


    Click the **Paint new sprite** next to New sprite. Open the Info Area and rename
    the sprite Slice. In the Paint Editor, draw a light blue rectangle that looks
    like the following.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_0.png)


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_176_1.png)'
  - '[PAGE 177]


    The Slice sprite should not be the same color as any color used in the fruits.
    Otherwise, some of the fruits will end up slicing other fruit.


    # EXPLORE: MAKING LISTS


    Now you''ll learn about an advanced Scratch feature—a new way to store data. A
    list is like a variable except it can store many values instead of just one value.
    Open a new web browser tab and start a new Scratch editor. We will explore the
    list blocks in a new Scratch project. Select the orange Data category and click
    the Make a List button to open the New List window. Name the list example list
    and make it For all sprites.


    | New List |

    | --- |

    | List name: example list |

    | ○ For all sprites ○ For this sprite only |'
  - '[PAGE 178]


    New dark orange blocks will appear under the Make a List button.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_178_0.png)


    Lists have more than set to and change by blocks. Lists have values, but each
    value also has a position, so the values need different kinds of code blocks.
    Positions in a list are defined by numbers; number 1 is the first value in the
    list. The following blocks control lists:


    +   - The add to block adds a value to the end of the list.

    - The delete block removes the value at a certain position.

    - The insert at block is like the add to block, but you can also select the position
    where the value should be inserted.

    - The replace item block is like a combination of delete and insert at. It replaces
    the value at a certain position with a new value.


    Add the following code and double-click-it to run it. Take a look at the effects
    of these code blocks on a list named example list.


    (continued)'
  - '[PAGE 179]


    +   1 add Alice to example list


    +   2 insert Bob at 1 of example list


    +   3 delete 1 of example list


    +   4 replace item 1 of example list with Carol


    | example list | example list | example list | example list |

    | --- | --- | --- | --- |

    | (empty) | 1 Alice | 1 Bob | 1 Carol |

    | + length: 0 | + length: 1 | + length: 2 | + length: 1 | + length: 1 |


    Recall that you can use the value in a variable in its bubble-shaped block. The
    list''s bubble-shaped blocks are similar but require you to specify a position
    so the bubble-shaped block knows which value in the list it should get. The scripts
    on the left and right sides both make the cat say "Hello!", but the code that
    uses a list (left) must also specify the position of the value to use:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_179_0.png)'
  - '[PAGE 180]


    # 4. Create Lists and Variables for the Slice Sprite


    You''ll create a list for the Fruit Slicer game to keep track of where the player
    is “slicing” on the screen. Because the slice is drawn between many x and y positions
    with Pen blocks, using a list is ideal.


    Click the Scripts tab at the top of the Blocks Area, and select the orange Data
    category. Click the Make a List button to open the New List window. Name the list
    slice x and make it For this sprite only.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_0.png)


    New dark orange blocks will appear under the Make List button.


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_180_1.png)'
  - "[PAGE 181]\n\nIn the orange Data category, click the Make a List button to make\
    \ a second list for Fruit Slicer. Name the list slice y and make it For this sprite\
    \ only.\n\nThen click Make Variable, create a variable named i, and make it For\
    \ this sprite only. You'll use this i variable in the next step. The Slice sprite\
    \ will use the two lists and i-variable to draw the light blue trail.\n\n# 5.\
    \ Record the Mouse Movements\n\nYou'll use the Pen blocks to draw lines for the\
    \ slice. But first you need to know where to draw the lines. Add the following\
    \ code to the Slice sprite:\n\n```\nwhen clicked\ndelete all of slice x\ndelete\
    \ all of slice y\nforever\n  if mouse down? then\n    add x to slice x\n    add\
    \ y to slice y\n  if length of slice x > 4 or not mouse down? then\n    delete\
    \ 1 of slice x\n    delete 1 of slice y\n```\n\nWhen the player clicks and holds\
    \ down the mouse button, the mouse position's x- and y-coordinates are repeatedly\
    \ added to the end of the slice x and slice y lists. If more than four values\
    \ are in the lists, the value at the beginning of each list is deleted. This is\
    \ how the program records the mouse's last four x- and y-coordinates. The first\
    \ values are also deleted when the mouse button isn't being held down, so the\
    \ trail shortens when the player releases the mouse button."
