    Click the green flag to test the code so far. Try to lose the game, and make sure
    the GAME OVER text has an animated entrance instead of just instantly appearing
    on the screen. Then click the red stop sign and save your program.


    ## Add an Animated Entrance for the You Win Sprite


    Let''s give the You Win sprite a fancy, animated entrance to. Update the code
    in the You Win sprite to match the following. You will have to load the sound
    effect named gong by clicking the Choose sound from library button on the Sounds
    tab.


    There are two sets of animations, one in the repeat 10 block. The code in the
    repeat 10 block makes the You Win sprite fade into visibility, enlarges it, and
    moves it upward. After this short animation plays, the repeat 2 block''s code
    increases the sprite''s brightness to 50, waits a tenth of a second, and then
    resets the brightness to 0. This makes the sprite look like it''s flashing. After
    a 4 second pause, the stop all block ends the program.


