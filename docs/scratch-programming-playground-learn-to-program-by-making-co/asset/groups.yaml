    # 在橙色猫中添加穿墙代码


    对于橙色猫（Orange Cat）角色，修改移动代码，将 `碰到迷宫?` 块替换为 `碰到迷宫?` 且 `未按下 L 键?` 块。这里只显示了向上箭头的代码，但你需要替换四个
    `如果按下按键...` 块中的所有 `碰到迷宫?` 块。


    ```

    if key up arrow then

    change y by 4

    if touching Maze? and not key L pressed? then

    change y by 4

    ```


    这使得只有在没有按下 L 键时才会启用阻墙代码。如果按下了 L 键，这段阻墙代码就会被跳过，玩家就可以穿墙行走。


    # 在蓝猫中添加穿墙代码


    对蓝猫（Blue Cat）角色进行相同的穿墙代码修改，不同的是将 `按下 I 键?` 替换为 `按下 q 键?`。当按住 Q 键时，第二个玩家就可以穿墙行走了。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_88_0.png)


    # 总结


    在本章中，你构建了一个游戏：


    - 有一个猫角色，当玩家按下某些键时，它可以上、下、左、右移动

    - 有角色无法穿过的墙

    - 一个角色发送的消息可以被另一个角色接收

    - 包含一个拥有八种不同造型的迷宫角色

    - 支持使用不同键盘键的两个玩家

    - 添加了随机间隔开启的陷阱以延缓玩家

    - 包含了可以让猫穿墙行走的作弊模式


    双人游戏比单人游戏更有趣。现在，你不仅仅是在解迷宫，而是在与另一名玩家竞争！你还可以向别人展示你的 Scratch 游戏。


    在第 4 章中，你将制作一个篮球游戏。这个游戏使用侧视图，与迷宫的俯视图不同。这意味着你将能够添加跳跃和重力，这些是在许多类型的 Scratch 游戏中非常有用的技巧！


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_89_0.png)


    # 复习题


    尝试回答以下练习题以测试你学到的内容。你可能无法立刻想起所有答案，但你可以探索 Scratch 编辑器来找到答案。（答案也可以在网上 http://www.nostarch.com/scratchplayground/找到。）


    1. 哪个块会改变角色的大小？

    2. 一个角色中的代码如何向另一个角色发送消息以执行某个操作？

    3. 你会如何使用键盘上的 WASD 键？

    4. 如何将一个角色中的某些代码块复制到另一个角色？

    5. 如果你不小心使用了 `将 y 增加` 代码块而不是 `将 x 增加` 代码块，会发生什么？

    6. 如果你想让一个角色播放欢呼声，你应该如何加载这个声音？

    7. 查看以下代码。它允许玩家按下方向键让角色向左右移动。它可以正常工作，但你会修改什么来让角色走得更快？


    ```

    when 🚩 clicked

    forever

    if key right arrow pressed? then

    change x by 4

    if key left arrow pressed? then

    change x by -4

    ```


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_92_0.png)


    # 4 带有重力的投篮游戏


    任何平台类游戏，如《超级马里奥兄弟》和《大刚王国》，都显示侧面动作，屏幕底部是地面，角色从侧面显示。这些游戏具有重力：角色可以向上跳跃然后掉落直到落地。在本章中，我们将编写一个具有重力的篮球游戏。玩家将跳跃并投篮，篮球球员和球将向下掉落。


    在开始编写代码之前，请查看 https://www.nostarch.com/scratchplayground/ 最终程序。


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_93_0.png)


