  - '[PAGE 88]


    # Add the Walk-Through-Walls Code to Orange Cat


    For the Orange Cat sprite, modify the walking code so the touching Maze? blocks
    are replaced with the touching Maze? and not key I pressed? blocks. Only the code
    for the up arrow is shown here, but you''ll want to replace the touching Maze?
    blocks in all four of the if key pressed.


    ```

    if key up arrow then

    change y by 4

    if touching Maze? and not key pressed? then

    change y by 4

    ```


    This enables the wall-blocking code only if the L key is not being pressed. If
    the L key is pressed, this wall-blocking code is skipped, and the player walks
    through the walls.


    # Add the Walk-Through-Walls Code to Blue Cat


    Make the same walk-through-walls code changes to the Blue Cat sprite, except instead
    of key I pressed, make it key q pressed. The second player can walk through walls
    when the Q key is held down.


