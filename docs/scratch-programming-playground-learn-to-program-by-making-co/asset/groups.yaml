    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_30_0.png)


    The most basic object in Scratch is the sprite. Sprites appear on the Stage ⑥,
    and their code blocks control their behavior. The editor automatically starts
    with a cat sprite for all new projects, but you can add more sprites. You can
    program a sprite by adding code blocks to the Scripts Area ⑤ on the right side
    of the screen. In Scratch, a stack of code blocks is called a script.


    The field at the top of the editor contains the project name ④. After you''ve
    named your project using a descriptive name, remember to occasionally save your
    project by clicking File ► Save Now from the menu bar ① to avoid losing your work
    if your browser crashes.


    You access the code blocks from the Blocks Area ⑦ in the center. At the top of
    the Blocks Area are 10 categories of code blocks: Motion, Looks, Sound, Pen, Data,
    Events, Control, Sensing, Operators, and More Blocks. Every code block belongs
    to one category and is the color of that category. For example, the say block
    comes from the purple Looks category. An infinite supply of code blocks is available;
    drag them from the Blocks Area to the Scripts Area.


    Each sprite has its own scripts. When you click the sprite in the Sprite List,
    that sprite''s scripts will display in the Scripts Area. Select the Scripts tab
    to display the Scripts Area. The Scripts Area is replaced by the Paint Editor
    and Sound Editor when the Costumes and Sounds tabs are selected.


    Clicking the green flag will start your program, and clicking the red stop sign
    will stop it.


    ## THE PAINT EDITOR


    There are a few ways to get sprites into your programs. You can use the sprites
    that come with Scratch, upload sprites from your computer, or draw your own. If
    you want to draw your own, you can use Scratch''s Paint Editor.


    The Paint Editor is similar to other painting programs, such as Microsoft Paint
    or Paintbrush. To draw a new sprite, click the Paintbrush button next to New sprite.
    You can change how sprites look by switching to one of many costumes. To create
    a new costume for a sprite, click the Costumes tab, and then click the Paintbrush
    button next to New Costume.


    The main parts of the Paint Editor are:


    - The drawing tools, which you can select using the buttons on the left side

    - The Canvas, where you draw images


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_31_0.png)


    - The Costume center, which indicates the center of the costume with the crosshairs
    symbol

    - The Line width slider, which sets the width of the drawing tools

    - The Color selector, which changes the color of the drawing tools

    - The Zoom buttons for zooming into or out of the canvas

    - The Undo and Redo buttons, which can help you correct mistakes


    The Paint Editor looks like this:


    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_32_0.png)


    Experiment with the Paint Editor by clicking the drawing tool buttons and dragging
    the mouse over the Canvas to see how the tools work. Change the color and width
    of the drawing tools with the Color selector and Line width slider. Then use the
    Eyedropper to select a color from the Canvas rather than picking a color from
    the Color selector. If you make a mistake, click the Undo button at the top.


    The list of sprite costumes is in the column to the left of the drawing tools.
    If you want to save a costume as an image file, right-click the costume and select
    Save to local file.


