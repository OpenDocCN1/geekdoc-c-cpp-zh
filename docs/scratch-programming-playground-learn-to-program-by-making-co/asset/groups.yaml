- md: "\n# SAVE POINT\n\nIf you're lost, open platformer4.sb in the resources ZIP\
    \ file and continue reading from this point.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_249_0.png)\n\
    \n# ADD CEILING DETECTION\n\nThe cat can walk on the ground, and now walls will\
    \ stop the cat from moving through them. But if the player bumps the Cat sprite's\
    \ head against a platform from below, the Cat sprite will rise above it! To solve\
    \ this problem, we need to make some adjustments to the lifting code to add ceiling\
    \ detection.\n\n# 7. Add a Low Platform to the Ground Sprite\n\nAdd a short, low\
    \ platform to the Ground sprite's costume, as shown in the following figure. Make\
    \ sure it is high enough for the cat to walk under but low enough that the cat\
    \ can jump up and touch it.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_249_1.png)\n\
    \nThis platform should be low enough that the cat could hit its head on it. If\
    \ it can't, then redraw the platform a little bit lower.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_250_0.png)\n\
    \n# 8. Add the Ceiling Detection Code\n\nThe problem with the code is in the custom\
    \ **handle ground** block. This code always assumes the Cat sprite is falling\
    \ from above, and if the Cat sprite is touching the Ground sprite, it should be\
    \ lifted above it. The Ground sprite represents any solid part that the cat can't\
    \ move through, including ceilings. We need to change the code so that if the\
    \ Cat is jumping up when it touches the Ground sprite, the cat *stops* rising\
    \ because it bumps its head. We know the Cat sprite is moving upward when its\
    \ velocity is greater than 0. So let's edit the **handle ground** block to add\
    \ a new Boolean input **moving up**.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_250_1.png)\n\
    \nA *Boolean* is a true or false value. We use a Boolean input because we need\
    \ to know if its velocity is greater than 0 when the **handle ground** block is\
    \ first called. This or false value is stored in the **moving up** input just\
    \ like a variable would store it. If we put **velocity > 0** in the **if** block\
    \ instead of **moving up**, the cat would end up rising above the ceiling instead\
    \ of bumping against it.\n\nRight-click the **define handle ground** block and\
    \ select **edit** from the menu.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_251_0.png)\n\
    \nClick the gray triangle next to **Options** to expand the window, and click\
    \ the button next to **Add boolean input**. Name this new input field **moving\
    \ up** and then click **OK**.\n\n![](img/44bc3b30bef7ae1ad43f0775f36b6931_251_1.png)\n\
    \nThis will add a new **moving up** block that you can drag off the **define handle\
    \ ground** block just like you do with blocks from the Blocks Area. This **moving\
    \ up** block will be used in a new **if then else** block. Modify the **define\
    \ handle ground** block’s code to match this.\n\n```\ndefine handle ground moving\
    \ up\nrepeat until not touching Ground\n  if moving up then\n    change y by -1\n\
    \  else\n    change y by 1\n    set in air to 0\n  set velocity to 0\n```\n\n\
    If the cat is moving up, the **change y by -1** block makes the cat look like\
    \ it's bumping its head. Otherwise, the script behaves as it did previously, raising\
    \ the cat so it sits above the ground.\n\nNext, we have to edit the **handle ground**\
    \ call in this script.\nWe'll add a Boolean condition to determine whether the\
    \ sprite is moving up, which is **y velocity > 0**.\n\n```\nwhen clicked\nset\
    \ rotation style left-right\nset y velocity to 0\nforever\n  change y velocity\
