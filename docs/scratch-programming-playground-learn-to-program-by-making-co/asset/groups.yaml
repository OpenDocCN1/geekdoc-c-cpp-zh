    # 14. Create a Hitbox Costume for the Ground Sprite


    The Platformer game code is based on the Cat sprite touching the Ground sprite.
    The Ground sprite''s costume is a hitbox, if the Ground sprite''s costume is a
    full rectangle that takes up the entire Stage, it will be treated as though the
    entire Stage is solid ground. We need to remove the parts of the Ground sprite''s
    costume that are part of the background and not platforms.


    The easiest way to do this is to click the Select tool in the Paint Editor. Drag
    a Select rectangle over the part of the costume you want to delete. After selecting
    an area, press DELETE to remove that piece.


