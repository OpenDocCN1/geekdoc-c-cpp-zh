    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_201_0.png)\n\n# 制作游戏结局\n\n玩家有两种不同的失败方式：当玩家错过了三个水果，或者他们切到了炸弹。无论哪种方式，都会广播游戏结束的消息，并导致一系列结果。水果的克隆体会删除自己，健康精灵隐藏自己，舞台逐渐变白。我们已经为克隆体和健康精灵了代码，现在让我们添加让舞台逐渐变白的代码吧。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_201_1.png)\n\n# 13. 创建白色淡出精灵\n\n我们将使用幽灵效果（ghost\
    \ effect）技巧来让舞台淡出。点击“新精灵”旁边的“画新精灵”按钮。在信息区域，将此精灵重命名为“白色淡出”（White Fade Out）。在画编辑器中，使用填充工具将整个画布填充为白色。画布上不应该看到白灰色的棋格图案。\n\
    \n![](img/44bc3b30bef7ae1ad43f0775f36b6931_202_0.png)\n\n“白色淡出”精灵遮住了舞台大部分。当程序开始时，“白色淡出”精灵将隐藏，只有在广播游戏结束消息时才会显示。为“白色淡出”精灵添加以下代码：\n\
    \n```\nwhen I receive start screen\nhide\n\nwhen I receive end game\ngo to x:\
