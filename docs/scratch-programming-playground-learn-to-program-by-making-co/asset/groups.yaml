    ![](img/44bc3b30bef7ae1ad43f0775f36b6931_93_1.png)


    如果你想节省时间，可以从名为 `basketball-skeleton.sb` 的骨架项目开始。访问 https://www.nostarch.com/scratchplayground/，右键点击链接并选择
    **另存为** 下载 ZIP 文件到你的电脑。从 ZIP 文件中提取所有文件。骨架项目已加载了所有角色，你只需要将代码拖入每个角色中。


