- pgno: 18
  md: '# About This Book


    C++17 is the next evolution in modern C++ programming, which is already at least
    partially supported by the latest version of gcc, clang, and Visual C++. Although
    the move to C++17 is not as big a step as the move to C++11, C++17 contains a
    large number of small and valuable language and library features that again will
    change the way we program in C++. This applies to both application programmers
    and programmers who provide foundation libraries.


    This book will present all the new language and library features in C++17. It
    will cover the motivation and context of each new feature with examples and background
    information. As usual for my books, the focus lies on the application of the new
    features in practice and the book will demonstrate how features impact day-to-day
    programming and how you can benefit from them in projects.


    # What You Should Know Before Reading This Book


    To get the most from this book, you should already be familiar with C++, ideally
    C++11 and/or C++14. However, you do not have to be an expert. My goal is to make
    the content understandable for the average C++ programmer, not necessarily knowing
    all details of the latest features. You should be familiar with the concepts of
    classes and inheritance, and you should be able to write C++ programs using components
    such as IOStreams and containers from the C++ standard library. You should also
    be familiar with the basic features of “Modern C++”, such as auto, decltype, move
    semantics, and lambdas.


    Nevertheless, I will discuss basic features and review more subtle issues as the
    need arises, even when such issues are not directly related to C++17. This ensures
    that the text is accessible to experts and intermediate programmers alike.


    Note that I usually use the modern form of initialization (introduced in C++11
    as uniform initialization) with curly braces:


    ```

    int i{42};

    std::string s{"hello"};

    ```


    This form of initialization, which is called list initialization, has the advantage
    that it can be used with fundamental types, class types, aggregates (extended
    with C++17), enumeration types (added with C++17), and auto (fixed with C++17)
    and is able to detect narrowing errors (e.g., initialization of an int by a floating-'
  merge: -1
