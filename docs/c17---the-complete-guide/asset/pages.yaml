    \ std::tuple\n\nThe following code initializes a, b, and c as alias names for\
    \ the three elements of a copy of the std::tuple<> returned by getTuple():\n\n\
    ```\nstd::tuple<char,float,std::string> getTuple();\n...\nauto [a,b,c] = getTuple();\
    \    // a,b,c have types and values of returned tuple\n```\n\nThat is, a gets\
    \ type char, b gets type float, and c gets type std::string.\n\n# std::pair\n\n\
    As another example, the code for dealing with the return value of calling insert()\
    \ on an associative/unordered container\n\n```\nstd::map<std::string, int> coll;\n\
    ```\n\ncan be made more readable by avoiding the generic names first and second\
    \ from the resulting std::pair<> object:\n\n```\nauto ret = coll.insert({\"new\"\
    ,42});\nif (!ret.second){\n    // if insertion failed, handle error using iterator\
    \ ret.first\n    ...\n}\n```\n\nand instead binding to names that convey semantic\
    \ meaning about their purpose:\n\n```\nauto [pos,ok] = coll.insert({\"new\",42});\n\
    if (!ok) {\n    // if insertion failed, handle error using iterator pos:\n   \
    \ ...\n}\n```\n\nNote that in this particular case, C++17 provides a way to improve\
    \ this even further using if with initializers.\n\n# Assigning New Values to Structured\
    \ Bindings for pair and tuple\n\nAfter declaring a structured binding, you usually\
    \ cannot modify all bindings together because structured bindings can only be\
    \ declared but not used together. However, you can use std::tie() if the value\
    \ assigned can be assigned to a std::pair<> or a std::tuple<>.\nThat is, you can\
    \ implement the following:\n\n```\nstd::tuple<char,float,std::string> getTuple();\n\
    ```"
