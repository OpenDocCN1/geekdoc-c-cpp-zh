  md: 'If we cannot create the symbolic link because, for example, it already exists
    or we need special rights, you get something like the following message:


    ```

    EXCEPTION: create_directory_symlink: Can’t create a file when it already exists:
    "tmp\test\data.txt", "testdir"

    path1: "tmp\test\data.txt"

    ```


    or:


    ```

    EXCEPTION: create_directory_symlink: A required privilege is not held by the client.:
    "test", "tmp\slink"

    path1: "test"

    ```


    In any case, note that the situation in a multi-user/multi-process operating system
    can change at any time, which means that your created directory might even be
    removed, renamed, or replaced by a regular file after you create it. Therefore,
    it is simply not possible to ensure the validity of a future request by finding
    out the current situation. For this reason, is the best approach it usually to
    try to do what you want (i.e., create a directory, open a file) and process exceptions
    and errors or validate the expected behavior/outcome.


    However, sometimes the attempt to do something with the filesystem might work
    but not the way you had in mind. For example, if you want to create a file in
    a specific directory and a symbolic link to another directory already exists,
    the file is created or overwritten at an unexpected location. This might be OK
    (the user might have a good reason to create a symbolic link where a directory
    was expected), but if you want to detect that situation, you have to check for
    the existence of a file (which is a bit more complicated than you might think
    at first) before you create something.


    Once again: there is no guarantee that results of filesystem checks are still
    valid when you process them.


    # 20.1.4 Dealing with Filesystems Using Parallel Algorithms


