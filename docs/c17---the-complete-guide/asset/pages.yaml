- pgno: 206
  md: '# Chapter 19


    # String Views


    With C++17, a special string class was adopted by the C++ standard library that
    allows us to deal with character sequences like strings without allocating memory
    for them: std::string_view. That is, objects of type std::string_view refer to
    external character sequences without owning them. Therefore, a string view object
    can be considered as a kind of reference to a character sequence.


    ![](img/c238a88db1e46699358aa4a874079892_206_0.png)


    Using such a string view is cheap and fast (passing a string_view by value is
    always cheap). However, it is also potentially dangerous because, in the same
    way as for raw pointers, it is up to the programmer to ensure that the referred
    character sequence is still valid when using a string_view.




    In contrast to std::string, std::string_view objects have the following properties:


    +   - The underlying character sequence is read-only. There is no operation that
    enables modification of the characters. You can only assign a new value, swap
    values, and shrink the view to a subset of the character sequence.

    +   - The character sequence is not guaranteed to be null terminated. Therefore,
    a string view is not a null terminated byte stream (NTBS).'
