- pgno: 398
  md: 'If you pass a requested alignment in the new expression, the passed alignment
    argument is always passed and has to be supported by the operator new(). In fact,
    alignment arguments are handled just like any other additional argument you can
    pass to new expressions: they are passed as they are as additional parameters
    to operator new().


    ```

    std::string* p = new(std::align_val_t{64}) std::string; //64-byte aligned

    ```


    will always try to call:

    operator new(std::size_t, std::align_val_t)


    A size-only overload would not serve as a fallback here.


    If you have a specific alignment request for an over-aligned type, the behavior
    is even more interesting. If, for example, you call:

    MyType32* p = new(std::align_val_t{64}) MyType32{};

    and MyType32 is over-aligned, the compiler first tries to call

    operator new(std::size_t, std::align_val_t, std::align_val_t)

    with 32 as the second argument (the general over-alignment of the type) and 64
    as the third argument (the requested specific alignment). It is only as a fallback
    that

    operator new(std::size_t, std::align_val_t)

    is called with 64 as the requested specific alignment. In principle, you could
    provide an overload for the three requested arguments to implement specific behavior
    when a specific alignment is requested for over-aligned types.


    Again, note that if you need special deallocation functions for over-aligned data,
    you have to call the correct deallocation function when passing the alignment
    in the new expression:


    ```

    std::string* p1 = new(std::align_val_t{64}) std::string{};

    MyType32* p2 = new(std::align_val_t{64}) MyType32{};


    ...

    p1->~basic_string();

    ::operator delete(p1, std::align_val_t{64}); // !!!

    p2->~MyType32();

    MyType32::operator delete(p2, std::align_val_t{64}); // !!!

    ```


    This means that the new expressions in this example will call

    operator new(std::size_t size, std::align_val_t align);

    while the delete expressions will call one of the following two operations for
    default-aligned data:


    +   - operator delete(void* ptr, std::align_val_t align);

    +   - operator delete(void* ptr, std::size_t size, std::align_val_t align);


    and one of the following four operations for over-aligned data:


    +   - operator delete(void* ptr, std::align_val_t align);

    +   - operator delete(void* ptr, std::size_t size, std::align_val_t align);

    +   - operator delete(void* ptr, std::align_val_t typealign, std::align_val_t
    align);

    +   - operator delete(void* ptr, std::size_t size, std::align_val_t typealign,
    std::align_val_t align);'
