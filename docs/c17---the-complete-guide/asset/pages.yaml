- pgno: 29
  md: "+   - std::tuple_size<type>::value has to return the number of elements.\n\
    +   - std::tuple_element<idx,type>::type has to return the type of the idxth element.\n\
    +   - A global or member get<idx>() has to yield the value of the idxth element.\n\
    \nThe standard library types std::pair<>, std::tuple<>, and std::array<> are examples\
    \ of types that provide this API.\n\nIf structures or classes provide the tuple-like\
    \ API, the API is used.\n\nIn all cases, the number of elements or data members\
    \ has to match the number of names in the declaration of the structured binding.\
    \ You cannot skip a name and you cannot use a name twice. However, you could use\
    \ a very short name such as '_' (as some programmers prefer but others hate and\
    \ which is not allowed in the global namespace), but this works only once within\
    \ the same scope:\n\n```\nauto [_,val1] = getStruct(); // OK\nauto [_,val2] =\
    \ getStruct(); // ERROR: name _ already used\n```\n\nNested or non-flat decomposition\
    \ is not supported.\n\nThe next subsections will discuss all of these uses of\
    \ structured bindings in detail.\n\n# 1.2.1 Structures and Classes\n\nThe introductory\
    \ examples of structured bindings in the sections above have already described\
    \ some simple uses for structures and classes with public members. A typical application\
    \ is the direct use of multiple return values returned in one data structure (e.g.,\
    \ see insert() for node handles). However, there are a few edge cases to be aware\
    \ of.\n\nNote that only limited use of inheritance is possible. All non-static\
    \ data members must be members of the same class definition (thus, they must be\
    \ direct members of the type or of the same unambiguous public base class):\n\n\
    ```\nstruct B {\n    int a = 1;\n    int b = 2;\n};\n\nstruct D1 : B {\n};\nauto\
    \ [x, y] = D1{};      // OK\n\nstruct D2 : B {\n    int c = 3;\n};\nauto [i, j,\
    \ k] = D2{};   // compile-time ERROR\n```\n\nNote that you should use structured\
    \ bindings on public members only if their order is guaranteed to be stable. Otherwise,\
    \ if the order of int a and int b inside B changes, x and y suddenly are initialized\
    \ with different values. To support this stability, C++17 defines the order of\
    \ members for some standard library structures (e.g., insert_return_type).\n\n\
    Structured bindings for unions are not allowed."
