- pgno: 117
  md: "```\n#include \"ifcomptime.hpp\"\n#include <iostream>\n\nint main()\n{\n  \
    \  std::cout << asString(42) << '\\n';\n    std::cout << asString(std::string(\"\
    hello\")) << '\\n';\n    std::cout << asString(\"hello\") << '\\n';\n}\n```\n\n\
    # 10.1 Motivation for Compile-Time if\n\nIf we used the runtime if in the example\
    \ above, the corresponding code would never compile:\n\n```\n#include <string>\n\
    \ntemplate<typename T>\nstd::string asString(T x)\n{\n    if (std::is_same_v<T,\
    \ std::string>) {\n        return x;\n    }\n    else if (std::is_numeric_v<T>)\
    \ {\n        return std::to_string(x);\n    }\n    else {\n        return std::string(x);\n\
    \    }\n}\n```\n\nThis is a consequence of the rule that function templates are\
    \ compiled as a whole when being instantiated. The check of the if condition is\
    \ a runtime feature. Even if at compile-time it becomes clear that a condition\
    \ must be false, the then part must be able to compile. Therefore, when passing\
    \ a std::string or string literal, the compilation fails because the call of std::to_string()\
    \ for the passed argument is not valid. Furthermore, when passing a numeric value,\
    \ the compilation fails because the first and third return statements would be\
    \ invalid.\n\nUsing the compile-time if, the then and else parts that cannot be\
    \ used become discarded statements:\n\n+   • When passing a std::string value,\
    \ the else part of the first if is discarded.\n\n+   • When passing a numeric\
    \ value, the then part of the first if and the final else part are discarded."
