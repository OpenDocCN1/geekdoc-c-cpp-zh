    # 20.2 Principles and Terminology


    Before discussing the details of the filesystem library, we have to introduce
    a couple of design principles and some terminology. This is necessary because
    the standard covers different operating systems and maps them to a common API.


    # 20.2.1 General Portability Disclaimer


    The C++ Standard does not merely standardize what all possible operating systems
    have in common for their file systems; in many cases, the C++ Standard follows
    POSIX standards and requests that implementations follow POSIX as closely as possible.
    As long as it is reasonable, the behavior should still be there, but with some
    limitations. If no reasonable behavior is possible, an implementation shall report
    an error. Possible examples of such errors are:


    +   - Particular characters are not valid to be used as file names'
