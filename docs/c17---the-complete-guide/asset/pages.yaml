    \ the one definition rule (ODR). When built with an optimizing compiler, it might\
    \ have worked as expected or might have given a link error due to the missing\
    \ definition. When built without any optimizations, it will almost certainly be\
    \ rejected due to the missing definition of D::n.¹ Creating a pointer to the static\
    \ member does even more likely result in a link error due to the missing definition\
    \ (but it might still work with some compiler modes):\n\n```\nconst int* p = &D::n;\
    \          // was usually an ERROR\n```\n\nAs a consequence, before C++17, you\
    \ had to define D::n in exactly one translation unit:\n\n```\nconstexpr int D::n;\
    \            // C++11/C++14: definition\n                               // since\
    \ C++17: redundant declaration (deprecated)\n```\n\nNow, when built with C++17,\
    \ the declaration inside the class is a definition by itself, so all examples\
    \ above are now valid without the former definition. The former definition is\
    \ still valid but a deprecated redundant declaration.\n\n# 3.4 Inline Variables\
    \ and thread_local\n\nBy using thread_local you can also make an inline variable\
    \ unique for each thread:\n\n```\nstruct ThreadData {\n    inline static thread_local\
    \ std::string name;      // unique name per thread\n    ...\n};\n\ninline thread_local\
    \ std::vector<std::string> cache;   // one cache per thread\n```\n\nAs a complete\
