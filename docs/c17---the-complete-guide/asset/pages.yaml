- pgno: 170
  md: '# Chapter 16


    # std::variant<>


    With std::variant<>, the C++ standard library provides a new union class, which,
    among other benefits, supports a new approach to implement polymorphism dealing
    with heterogeneous collections. That is, it allows us to deal with elements of
    different data types without the need for a common base class and pointers (raw
    or smart).


    # 16.1 Motivation for std::variant<>


    Adopted from C, C++ provides support for unions, which are objects that can be
    used to hold values of one of a list of possible types. However, there are some
    drawbacks with this language feature:


    +   - Objects do not know which type of value they currently hold.

    +   - Therefore, you cannot have non-trivial members, such as std::string (without
    specific effort).¹

    +   - You cannot derive from a union.


    With std::variant<>, the C++ standard library provides a closed discriminated
    union (which means that there is a specified list of possible types)


    +   - Where the type of the current value is always known

    +   - That can hold values of any specified type

    +   - That you can derive from


    In fact, a std::variant<> holds a value of various alternatives, which usually
    have different types. However, two alternatives can also have the same type, which
    is useful if alternatives with different semantic meanings have the same type
    (e.g., holding two strings, which represent different database columns, so that
    you still know which of the columns the value represents).


    ¹ Since C++11, in principle, unions can have non-trivial members, but you have
    to implement special member functions such as the copy-constructor and destructor
    because you only know by programming logic which member is active.'
