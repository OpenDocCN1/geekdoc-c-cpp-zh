- pgno: 338
  md: "# 26.3 Container Support for Incomplete Types\n\nThis also applies to classes\
    \ with private members and a public API.\n\nHere is a complete example:\n\n```\n\
    ```cpp\n#ifndef NODE_HPP\n#define NODE_HPP\n#include <vector>\n#include <iostream>\n\
    #include <string>\n\nclass Node\n{\nprivate:\n    std::string value;\n    std::vector<Node>\
    \ children; // OK since C++17 (Node is an incomplete type here)\npublic:\n   \
    \ // create Node with value:\n    Node(std::string s) : value(std::move(s)), children{}\
    \ {\n    }\n\n    // add child node:\n    void add(Node n) {\n        children.push_back(std::move(n));\n\
    \    }\n\n    // access child node:\n    Node& operator[](std::size_t idx) {\n\
    \        return children.at(idx);\n    }\n\n    // print node tree recursively:\n\
    \    void print(int indent = 0) const {\n        std::cout << std::string(indent,\
    \ ' ') << value << '\\n';\n        for (const auto& n : children) {\n        \
    \    n.print(indent+2);\n        }\n    }\n\n    ...\n};\n\n#endif // NODE_HPP\n\
    ```\n```"
