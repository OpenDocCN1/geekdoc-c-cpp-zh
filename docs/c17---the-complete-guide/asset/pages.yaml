  md: "```\ntypename Allocator = allocator<pair<const Key, T>>\nmap(initializer_list<pair<const\
    \ Key, T>>,\n    Compare = Compare(),\n    Allocator = Allocator())\n-> map<Key,\
    \ T, Compare, Allocator>;\n}\n```\n\nAll arguments are passed by value, therefore\
    \ this deduction guide enabled the type of a passed comparator or allocator to\
    \ decay as discussed. However, we naively used the same argument types, which\
    \ meant that the initializer list took a const key type. As a consequence, the\
    \ following did not work (as Ville Voutilainen pointed out in http://wg21.link/lwg3025):\n\
    \n```\nstd::pair elem1{1,2};\nstd::pair elem2{3,4};\n...\nstd::map m1{elem1, elem2};\
    \    // ERROR with original C++17 guides\n```\n\nBecause elem1 and elem2 are deduced\
    \ as std::pair<int,int>, the deduction guide requiring a const type as first type\
    \ in the pair did not match. Therefore, you still had to write the following:\n\
    \n```\nstd::map<int,int> m1{elem1, elem2};  // OK\n```\n\nAs a consequence, in\
    \ the deduction guide, the const had to be removed:\n\n```\nnamespace std {\n\
    template<typename Key, typename T,\n        typename Compare = less<Key>,\n  \
    \      typename Allocator = allocator<pair<const Key, T>>>\nmap(initializer_list<pair<Key,\
    \ T>>,\n    Compare = Compare(),\n    Allocator = Allocator())\n-> map<Key, T,\
    \ Compare, Allocator>;\n}\n```\n\nHowever, to still support the decay of the comparator\
    \ and allocator, we also have to overload the deduction guide for a pair with\
    \ const key type. Otherwise, the constructor would be used for class template\
    \ argument deduction when passing a pair with a const key type, meaning that the\
    \ deduction would differ slightly between passing pairs with const and non-const\
    \ keys.\n\n# No Deduction Guides for Smart Pointers\n\nNote that some places in\
    \ the C++ standard library do not have deduction guides even though you might\
    \ expect them to be present.\n\nYou might expect to have deduction guides for\
    \ shared and unique pointers, so that instead of:\n\n```\nstd::shared_ptr<int>\
    \ sp{new int(7)};\n```\n\nyou could just write:\n\n```\nstd::shared_ptr sp{new\
    \ int(7)};      // not supported\n```"
