- pgno: 87
  md: 'Note also that list initialization still does not allow narrowing, which means
    that you cannot pass a floating-point value:


    ```

    enum MyInt : char { };

    MyInt i5{42.2};    // still ERROR

    ```


    This feature was motivated to support the trick of defining new integral types
    just by defining an enumeration type that maps to an existing integral type as
    done here with MyInt. Without the feature, there is no way to initialize a new
    object without a cast.


    In fact, since C++17, the C++ standard library also provides std::byte, which
    uses this feature directly.


    # 8.4 Fixed Direct List Initialization with auto


    After the introduction of uniform initialization with braces in C++11, it turned
    out that there were some unfortunate and non-intuitive inconsistencies when using
    auto instead of a specific type:


    ```

    int x{42};      // initializes an int

    int y{1,2,3};    // ERROR

    auto a{42};      // initializes a std::initializer_list<int>

    auto b{1,2,3};   // OK: initializes a std::initializer_list<int>

    ```


    These inconsistencies were fixed for direct list initialization (brace initialization
    without =) so that we now have the following behavior:


    ```

    int x{42};      // initializes an int

    int y{1,2,3};    // ERROR

    auto a{42};      // initializes an int now

    auto b{1,2,3};   // ERROR now

    ```


    Note that this is a breaking change that might even silently result in a different
    program behavior (e.g., when printing a). Therefore, compilers that adopt this
    change usually also adopt it even in C++11 mode. For the major compilers, the
    fix was adopted for all modes with Visual Studio 2015, g++ 5, and clang 3.8.


    Note also that copy list initialization (brace initialization with =) still has
    the behavior to initialize a std::initializer_list<> when auto is used:


    ```

    auto c = {42};      // still initializes a std::initializer_list<int>

    auto d = {1,2,3};    // still OK: initializes a std::initializer_list<int>

    ```


    Thus, we now have another significant difference between direct initialization
    (without =) and copy initialization (with =):


    ```

    auto a{42};      // initializes an int now

    auto c = {42};    // still initializes a std::initializer_list<int>

    ```


    This is one additional reason by default to prefer direct list initialization
    (brace initialization without =) when initializing variables and objects.'
