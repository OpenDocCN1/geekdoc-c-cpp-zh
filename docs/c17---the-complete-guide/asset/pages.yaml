  md: "# 20.1.3 Create Different Types of Files\n\nAfter having only read-access to\
    \ the filesystem, let us now give a first example of modifying it. The following\
    \ program creates different kinds of files in the subdirectory tmp:\n\nfilesystem/createfiles.cpp\n\
    \n```\n#include <iostream>\n#include <fstream>\n#include <filesystem>\n#include\
    \ <cstdlib>    // for std::exit() and EXIT_FAILURE\n\nint main ()\n{\nnamespace\
    \ fs = std::filesystem;\ntry {\n    // create directories tmp/test/ (if they don't\
    \ exist yet):\n    fs::path testDir{\"tmp/test\"};\n    create_directories(testDir);\n\
    \n    // create data file tmp/test/data.txt:\n    auto testFile = testDir / \"\
    data.txt\";\n    std::ofstream dataFile{testFile};\n    if (!dataFile) {\n   \
    \     std::cerr << \"OOPS, can't open \\\"\" << testFile.string() << \"\\\"\\\
    n\";\n        std::exit(EXIT_FAILURE);  // exit program with failure\n    }\n\
    \    dataFile << \"The answer is 42\\n\";\n\n    // create symbolic link from\
    \ tmp/slink/ to tmp/test/:\n    create_directory_symlink(\"test\", testDir.parent_path()\
    \ / \"slink\");\n}\ncatch (const fs::filesystem_error& e) {\n    std::cerr <<\
    \ \"EXCEPTION: \" << e.what() << '\\n';\n    std::cerr << \"    path1: \\\"\"\
    \ << e.path1().string() << \"\\\"\\n\";\n}\n\n    // recursively list all files\
    \ (also following symlinks)\n    std::cout << fs::current_path().string() << \"\
    :\\n\";\n    auto iterOpts{fs::directory_options::follow_directory_symlink};\n\
    \    for (const auto& e : fs::recursive_directory_iterator(\".\", iterOpts)) {\n\
    \        std::cout << \"  \" << e.path().lexically_normal().string() << '\\n';\n\
    \    }\n}\n```\n\nLet us also go through this program step by step."
