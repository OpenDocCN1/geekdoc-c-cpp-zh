  md: "```\nnamespace fs = std::filesystem;\n\nswitch (fs::path p{argv[1]}; status(p).type())\
    \ {\n    case fs::file_type::not_found:\n        std::cout << \"path \\\"\" <<\
    \ p.string() << \"\\\" does not exist\\n\";\n        break;\n    case fs::file_type::regular:\n\
    \        std::cout << '\\'' << p.string() << \"\\\" exists with \"\n         \
    \         << file_size(p) << \" bytes\\n\";\n        break;\n    case fs::file_type::directory:\n\
    \        std::cout << '\\'' << p.string() << \"\\\" is a directory containing:\\\
    n\";\n        for (const auto& e : std::filesystem::directory_iterator{p}) {\n\
    \            std::cout << \"  \" << e.path().string() << '\\n';\n        }\n \
    \       break;\n    default:\n        std::cout << '\\'' << p.string() << \"\\\
    \" is a special file\\n\";\n        break;\n}\n}\n```\n\n# Namespace fs\n\nFirst,\
    \ we do something very common: we define fs as a shortcut for namespace std::filesystem:\n\
    \n```\nnamespace fs = std::filesystem;\n```\n\nUsing this namespace we initialize,\
    \ for example, the path p in the switch statement:\n\n```\nfs::path p{argv[1]};\n\
    ```\n\nThe switch statement is an application of the new switch with initialization,\
    \ where we initialize the path and provide different cases for its type:\n\n```\n\
    switch (fs::path p{argv[1]}; status(p).type()) {\n    ...\n}\n```\n\nThe expression\
    \ status(p).type() creates a file_status for which type() creates a file_type.\
    \ This way we can handle the different types directly instead of following a chain\
    \ of calls like is_regular_file(), is_directory(), and so on. The type is intentionally\
    \ provided in multiple steps (calling status() and then type()) so that we do\
    \ not have to pay the price of operating system calls if we are not interested\
    \ in all information.\n\nNote also that an implementation-specific file_type might\
    \ exist. For example, Windows provides the special file type junction. However,\
    \ using it is not portable."
