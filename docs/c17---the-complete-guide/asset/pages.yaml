    \ you cannot and should never rely on that. If you do not know whether an optional\
    \ object has a value, you have to call the following instead:\n\n```\nif (o) std::cout\
    \ << *o;  // OK (might output nothing)\n```\n\nAlternatively, you can use value(),\
    \ which throws a std::bad_optional_access exception if there is no contained value:\n\
    \n```\nstd::cout << o.value();   // OK (throws if no value)\n```\n\nstd::bad_optional_access\
    \ is derived directly from std::exception.\n\nPlease note that both operator*\
    \ and value() return the contained object by reference. Therefore, you have to\
    \ be careful when calling these operations directly for temporary return values.\
    \ For example, for a function that returns an optional string:\n\n```\nstd::optional<std::string>\
    \ getString();\n```\n\nit is always safe to assign any optional return value to\
    \ a new object:\n\n```\nauto a = getString().value();          // OK: copy of\
    \ contained object or exception\n```\n\nHowever, using the returned value directly\
    \ (other than passing it as an argument) is a source of trouble:\n\n```\nauto\
    \ b = *getString();                 // ERROR: undefined behavior if std::nullopt\n\
    const auto& r1 = getString().value(); // ERROR: reference to deleted contained\
    \ object\nauto&& r2 = getString().value();       // ERROR: reference to deleted\
    \ contained object\n```\n\nThe problem with the references is that by rule, they\
    \ extend the lifetime of the return value of value() but not the lifetime of the\
    \ optional object returned by getString(). Thus, r1 and r2 refer to values that\
    \ no longer exist and using them results in undefined behavior.\n\nNote that this\
    \ problem easily arises when using a range-based for loop:\n\n```\nstd::optional<std::vector<int>>\
    \ getVector();\n```\n\n```\n...\nfor (int i : getVector().value()) {  // ERROR:\
    \ iterate over deleted vector\n    std::cout << i << '\\n';\n}\n```\n\nNote that\
    \ iterating over a returned non-optional vector of int would work. Therefore,\
    \ do not blindly replace the return type of a function foo() with the corresponding\
    \ optional type; call foo().value() instead."
