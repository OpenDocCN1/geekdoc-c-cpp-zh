    # 20.2.5 Member Function versus Free-Standing Functions


    The filesystem library provides several functions, which can be both member and
    free-standing functions. The general approach is:


    +   - **Member functions are cheap.** This is because they are pure lexical operations
    that do not take the actual filesystem into account, meaning that no operating
    systems calls are necessary.

    +     For example:


    ```

    mypath.is_absolute()        // check whether path is absolute or relative

    ```


    +   - **Free-standing functions are expensive** because they usually take the
    actual filesystem into account, meaning that operating systems calls are necessary.

    +     For example:


    ```

    equivalent(path1, path2);    // true if both paths refer to the same file

    ```


    Sometimes, the filesystem library even provides the same functionality operating
    both lexically and by taking the actual filesystem into account:


    ```

    std::filesystem::path fromP, toP;

    ...

    toP.lexically_relative(fromP);    // yield lexical path from fromP to toP

    relative(toP, fromP);             // yield actual path from fromP to toP

    ```


    Due to argument dependent lookup (ADL), in many situations you do not have to
    specify the full namespace std::filesystem when calling free-standing filesystem
    functions and an argument has a filesystem-specific type. You only have to qualify
    the call when implicit conversions from other types are used. For example:


    ```

    create_directory(std::filesystem::path{"tmpdir"});    // OK

    remove(std::filesystem::path{"tmpdir"});               // OK

    std::filesystem::create_directory("tmpdir");           // OK

    std::filesystem::remove("tmpdir");                     // OK

    ```'
