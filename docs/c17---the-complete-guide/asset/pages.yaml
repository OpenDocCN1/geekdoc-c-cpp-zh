    \ [a,b] = getStruct();\nstd::cout << \"a: \" << a << '\\n';    // OK\n```\n\n\
    # Qualifiers Do Not Necessarily Apply to the Structured Bindings\n\nAs written,\
    \ the qualifiers apply to the new anonymous entity. They do not necessarily apply\
    \ to the new names introduced as structured bindings. In fact, after\n\n```\n\
    const auto& [u,v] = ms;  // a reference, so that u/v refer to ms.i/ms.s\n```\n\
    \nboth u and v are not declared as being references. This only specifies that\
    \ the anonymous entity e is a reference. u and v have the type of the members\
    \ of ms, both of which, however, become const here (just as you cannot modify\
    \ members of an object passed as a constant reference). With our initial declaration,\
    \ this means that decltype(u) is const int and decltype(v) is const std::string.\n\
    \nThis also makes a difference when specifying an alignment:\n\n```\nalignas(16)\
    \ auto [u,v] = ms;  // align the object, not v\n```\n\nHere, we align the initialized\
    \ anonymous entity and not the structured bindings u and v. This means that u\
    \ as the first member is forced to be aligned to 16, while v is not.\n\nFor the\
    \ same reason, structured bindings do not decay² even though auto is used. For\
    \ example, if we have a structure of raw arrays:\n\n```\nstruct S {\n    const\
    \ char x[6];\n    const char y[3];\n};\n```\n\nthen after\n\n```\nS s1{};\nauto\
    \ [a, b] = s1;   // a and b get the exact member types\n```\n\nthe type of a is\
    \ still const char[6]. Again, the auto applies to the anonymous entity, which\
    \ as a whole does not decay. This is different from initializing a new object\
    \ with auto, where types decay:\n\n```\nauto a2 = a;        // a2 gets decayed\
