    \ define a special type for such strings:\nusing icstring = std::basic_string<char,\
    \ ignoreCaseTraits>;\n```\n\n```\nstd::filesystem::path p{\"/dir\\\\subdir/subsubdir\\\
    \\./\\\\\"};\nicstring s2 = p.string<char,ignoreCaseTraits>();\n```\n\nNote also\
    \ that you should not use a function c_str(), which is also provided, because\
    \ it converts to the native string format, which might be a wchar_t so that, for\
    \ example, you have to use std::wcout instead of std::cout to write it to a stream.\n\
    \n# 20.3.4 Conversions Between Native and Generic Format\n\nTable Conversions\
    \ Between Native and Generic Format lists the operations you can use to convert\
    \ between the generic path format and the implementation-specific format of the\
    \ actual platform.\n\nThese functions should have no effect on POSIX-based systems,\
    \ where there is no difference between the native and the generic path format.\
    \ Calling these functions on other platforms might matter:\n\n+   - The generic...()\
    \ path functions yield the path converted to the corresponding string format with\
