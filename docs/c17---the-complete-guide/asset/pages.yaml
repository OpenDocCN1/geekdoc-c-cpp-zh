- pgno: 209
  md: "The fact that `asInt()` now takes a string view by value has significant consequences.\
    \ First, it no longer makes sense to use `std::stoi()` to create the integer because\
    \ `stoi()` takes a string, and creating a string from a string view is a relatively\
    \ expensive operation.\n\nInstead, we pass the range of characters to the new\
    \ standard library function `std::from_chars()`. This function takes a pair of\
    \ raw character pointers for the begin and end of the characters to be converted.\
    \ Note that this means that we can skip any special handling of an empty string\
    \ view, where `data()` is `nullptr` and `size()` is 0, because the range from\
    \ `nullptr` until `nullptr+0` is a valid empty range (for any pointer type, adding\
    \ 0 is supported and has no effect).\n\n`std::from_chars()` returns a `std::from_chars_result`,\
    \ which is a structure with two members, a pointer `ptr` to the first character\
    \ that was not processed, and a `std::errc ec`, for which `std::errc{}` represents\
    \ no error. Thus, after initializing `ec` with the `ec` member of the return value\
    \ (using structured bindings), the following check returns `nullptr` if the conversion\
    \ failed:\n\n```\nif (ec != std::errc{}) {\n    return std::nullopt;\n}\n```\n\
    \nUsing string views can also provide significant performance boosts when sorting\
    \ substrings.\n\n# 19.3.1  String View Considered Harmful\n\nUsually “smart objects”\
    \ such as smart pointers are considered to be safer (or at least not more dangerous)\
    \ than corresponding language features. Therefore, the impression might be that\
    \ a string view, which is a kind of string reference, is safer or at least as\
    \ safe as using string references. Unfortunately, this is not the case. String\
    \ views are in fact more dangerous than string references or smart pointers. They\
    \ behave more like raw character pointers.\n\n# Do Not Assign Temporary Strings\
    \ to String Views\n\nConsider declaring a function that returns a new string:\n\
    \n```\nstd::string retString();\n```\n\nUsing the return value is usually pretty\
    \ safe:\n\n+   - Initializing a string or an object declared with `auto` with\
    \ the return value is safe:\n+   \n+     ```cpp\n+     std::string s1 = retString();\
    \        // safe\n+     ```\n+   \n+   - Initializing a string reference with\
    \ the return value is, if it is possible, pretty safe as long we use the object\
    \ locally because references extend the lifetime of return values to the end of\
    \ their lifetime:\n+   \n+     ```cpp\n+     std::string& s2 = retString();  \
    \     // compile-time ERROR (const missing)\n+   \n+     const std::string& s3\
    \ = retString(); // s3 extends lifetime of returned string\n+     std::cout <<\
    \ s3 << '\\n';              // OK\n+   \n+     auto&& s4 = retString();      \
    \        // s4 extends lifetime of returned string\n+     std::cout << s4 << '\\\
    n';              // OK\n+     ```\n\nFor a string view this safety is not given.\
    \ It *neither copies nor extends* the lifetime of a return value:"
