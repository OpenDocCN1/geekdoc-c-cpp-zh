    std::string s[4];

    };

    ```


    a new expression now guarantees that the requested heap memory is aligned as requested
    (provided over-alignment is supported):


    ```

    MyType32* p = new MyType32;    // since C++17 guaranteed to be 32-byte aligned

    ...

    ```


    Before C++17, the request was not guaranteed to be 32-byte aligned.²


    As usual, without any value for initialization, the object is default initialized,
    which means that available constructors are called but (sub)objects of fundamental
    types have an undefined value. Therefore, the recommendation is to use list initialization
    with curly braces to ensure that the (sub)objects have either their default value
    or 0/false/nullptr:


    ```

    MyType32* p = new MyType32{};    // aligned and initialized

    ```


    # 30.1.1 Distinct Dynamic/Heap Memory Arenas


    Note that the request for aligned memory might result in a call to get the memory
    from a disjoint memory allocation mechanism. Therefore, a request for aligned
    memory might require a specific corresponding request to deallocate the aligned
    data. It is possible that the memory is allocated with the C11 function aligned_alloc()
    (which is now also available in C++17). In that case, deallocation with free()
    would still be acceptable, meaning that there is no difference compared to memory
    allocated with malloc().


    However, other implementations of new and delete are allowed for platforms, which
    leads to the requirement that different internal functions have to be used to
    deallocate default-aligned data and over-aligned data. For example, on Windows,
    _aligned_malloc() is usually used, which requires the use of _aligned_free() as
    a counterpart.³


    In contrast to the C standard, the C++ standard respects this situation and therefore
    conceptionally assumes that there are two disjoint, non-interoperable memory arenas,
    one for default-aligned data and one for over-aligned data. Compilers generally
    know how to handle this correctly:


    ```

    std::string* p1 = new std::string;    // using default-aligned memory operations

    MyType32* p2 = new MyType32;          // using over-aligned memory operations

    ...

    delete p1;                            // using default-aligned memory operations

    delete p2;                            // using over-aligned memory operations

    ```


    However, sometimes the programmer has to do the right thing, as we will see in
    the remaining sections of this chapter.


    ² Compilers/platforms do not have to support over-aligned data. If they do not,
    a request to over-align should not compile.


    ³ This is because the Windows operating systems provide no ability to request
    aligned storage, which means that the calls over-allocate and align manually.
    As a consequence, support for aligned_alloc() will be unlikely in the near future,
    because support for the existing Windows platforms will still be required.'
