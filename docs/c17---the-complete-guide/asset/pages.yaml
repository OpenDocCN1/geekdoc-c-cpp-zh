- pgno: 30
  md: '# 1.2.2 Raw Arrays


    The following code initializes x and y with the two elements of the raw C-style
    array:


    ```

    int arr[] = { 47, 11 };

    auto [x, y] = arr;  // x and y are the int elems of a copy of arr

    auto [z] = arr;    // ERROR: number of elements doesn''t fit

    ```


    Note that this is one of the few places in C++ where a raw array is copied by
    value.


    The initialization is only possible as long as the array still has a known size.
    For an array passed as an argument by value, this is not possible because the
    array decays to the corresponding pointer type.


    Note that C++ allows us to return arrays with size by reference, so that this
    feature also applies to functions that return an array, provided the size of the
    array is part of the return type:


    ```

    auto getArr() -> int(&)[2];  // getArr() returns reference to raw int array

    ...

    auto [x, y] = getArr();      // x and y are the int elems of a copy of the returned
    array

    ```


    You can also use structured bindings for a std::array, which uses the tuple-like
    API, as described in the next section.


    # 1.2.3 std::pair, std::tuple, and std::array


    The structured binding mechanism is extensible, which means that you can add support
    for structured bindings to any type. The standard library uses this for std::pair<>,
    std::tuple<>, and std::array<>.


    # std::array


    For example, the following code initializes a, b, c, and d as alias names for
    the four elements of a copy of the std::array<> returned by getArray():


    ```

    std::array<int,4> getArray();

    ...

    auto [a,b,c,d] = getArray();  // a,b,c,d name the 4 elements of the copied return
    value

    ```


    Here, a, b, c, and d are structured bindings to the elements of the std::array
    returned by getArray().


    Write access is also supported, provided the value for initialization is not a
    temporary return value and we are using non-const references. For example:


    ```

    std::array<int,4> stdarr { 1, 2, 3, 4 };

    ...

    auto& [a,b,c,d] = stdarr;

    a += 10;                  // OK: modifies stdarr[0]


    const auto& [e,f,g,h] = stdarr;

    e += 10;                  // ERROR: reference to constant object


    auto&& [i,j,k,l] = stdarr;

    i += 10;                  // OK: modifies stdarr[0]

    ```'
