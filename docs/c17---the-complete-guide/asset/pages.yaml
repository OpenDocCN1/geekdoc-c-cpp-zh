  md: "# # Chapter 3: Inline Variables\n\nYou can even apply this to define atomic\
    \ types in header files only:\n\n```\ninline std::atomic<bool> ready{false};\n\
    ```\n\nAs usual for std::atomic, you always have to initialize the values when\
    \ you define them.\n\nNote that you still have to ensure that types are complete\
    \ before you can initialize them. For example, if a struct or class has a static\
    \ member of its own type, the member can only be defined inline after the type\
    \ declaration:\n\n```\nstruct MyType {\n\tint value;\n\tMyType(int i) : value{i}\
    \ {\n\t}\n\t// one static object to hold the maximum value of this type:\n\tstatic\
    \ MyType max; // can only be declared here\n};\ninline MyType MyType::max{0};\n\
    ```\n\nSee the header file for tracking all new calls for another example of using\
    \ inline variables.\n\n# ## 3.3 constexpr Now Implies inline For Static Members\n\
    \nFor static data members, constexpr implies inline now, such that since C++17,\
    \ the following declaration defines the static data member n:\n\n```\nstruct D\
    \ {\n\tstatic constexpr int n = 5; // C++11/C++14: declaration\n\t// since C++17:\
    \ definition\n};\n```\n\nThat is, it is the same as:\n\n```\nstruct D {\n\tinline\
    \ static constexpr int n = 5;\n};\n```\n\nNote that before C++17, you could often\
    \ have the declaration only without a corresponding definition. Consider the following\
    \ declaration:\n\n```\nstruct D {\n\tstatic constexpr int n = 5;\n};\n```\n\n\
    This was enough if no definition of D::n was needed, which was the case if D::n\
    \ was only passed by value:\n\n```\nstd::cout << D::n; // OK (ostream::operator<<(int)\
    \ gets D::n by value)\n```\n\nIf D::n was passed by reference to a non-inlined\
    \ function and/or the call was not optimized away, this was invalid. For example:\n\
    \n```\nint twice(const int& i);\n```"
