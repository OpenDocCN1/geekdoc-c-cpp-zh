- pgno: 162
  md: "However, note that if the contained type itself can be constructed from an\
    \ optional object, then the construction from the optional object is preferred:²\n\
    \n```\nstd::optional<int> o11;\nstd::optional<std::any> o12{o11};    // o12 contains\
    \ an any object of an empty optional int\n```\n\nNote that there is also a convenience\
    \ function make_optional<>(), which allows an initialization with single or multiple\
    \ arguments (without the need for the in_place argument). As usual for make..\
    \ functions, its arguments decay:\n\n```\nauto o13 = std::make_optional(3.0);\
    \        // optional<double>\nauto o14 = std::make_optional(\"hello\"); // optional<const\
    \ char*>\nauto o15 = std::make_optional<std::complex<double>>(3.0, 4.0);\n```\n\
    \nHowever, note that there is no constructor that takes a value and decides, according\
    \ its value, whether to initialize an optional with a value or nullopt. For this,\
    \ operator ?: has to be used.³ For example:\n\n```\nstd::multimap<std::string,\
    \ std::string> englishToGerman;\n...\nauto pos = englishToGerman.find(\"wisdom\"\
    );\nauto o16 = pos != englishToGerman.end()\n    ? std::optional{pos->second}\n\
    \    : std::nullopt;\n```\n\nHere, the type of o16 is std::optional<std::string>\
    \ due to class template argument deduction for std::optional{pos->second}. Class\
    \ template argument deduction would not work for std::nullopt alone, but by using\
    \ operator ?:, std::nullopt also converts to an optional string as the common\
    \ type of both alternatives.\n\n# Accessing the Value\n\nTo check whether an optional\
    \ object has a value, you can call has_value() or use it in a Boolean expression:\n\
    \n```\nstd::optional o{42};\n\nif (o) ...                // true\nif (!o) ...\
    \               // false\nif (o.has_value()) ...    // true\n```\n\nNo I/O operators\
    \ are defined (because there is no obvious output if the optional object has no\
    \ value):\n\n```\nstd::cout << o;          // ERROR\n```\n\nPointer syntax is\
    \ provided to access the value. That is, with operator*, you can directly access\
    \ the underlying value of an optional object, while operator-> enables access\
    \ to members of the value:\n\n```\nstd::optional o{std::pair{42, \"hello\"}};\n\
    ```"
