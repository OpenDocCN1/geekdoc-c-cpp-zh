    \ tp)\n{\n    auto rawtime{std::chrono::system_clock::to_time_t(tp)};\n    std::string_view\
    \ ts{std::ctime(&rawtime)};  // NOTE: not thread safe\n\n    ts.remove_suffix(1);\
    \      // skip trailing newline\n\n    return std::string{prefix} + ts;  // unfortunately\
    \ no operator + yet\n}\n```\n\nNote that we cannot concatenate both string views\
    \ by simply calling operator+. Instead, we have to convert one of the operands\
    \ into a std::string (which unfortunately might unnecessarily allocate additional\
    \ memory). If the string view has no value (data() is nullptr), the string is\
    \ empty.\n\nAnother example application of string views is demonstrated when using\
