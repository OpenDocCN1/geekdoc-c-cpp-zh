    \    // yields true\nis_swappable_with_v<std::string&&, std::string&&> // yields\
    \ false\n```\n\n# Type Trait has_unique_object_representations<>\n\n```\nstd::has_unique_object_representations<T>::value\n\
    ```\n\nyields true if any two objects of type T have the same object representation\
    \ in memory. That is, two identical values are always represented using the same\
    \ sequence of byte values.\n\nObjects with this property can produce a reliable\
    \ hash value by hashing the associated byte sequence (there is no risk that some\
    \ bits not participating in the object value might differ from one case to another).\n\
    \n# Type Traits is_invocable<> and is_invocable_r<>\n\n```\nstd::is_invocable<T,Args...>::value\n\
    std::is_nothrow_invocable<T,Args...>::value\nstd::is_invocable_r<Ret,T,Args...>::value\n\
    std::is_nothrow_invocable_r<Ret,T,Args...>::value\n```\n\nyield true if you can\
    \ use T as a callable for Args... returning a value convertible to type Ret (with\
    \ the guarantee that no exception is thrown). That is, we can use these traits\
    \ to test whether we can call (directly or via std::invoke()) a callable of type\
    \ T for arguments of type Args... and use the return value as type Ret.\n\nFor\
    \ example, given:\n\n```\nstruct C {\n    bool operator() (int) const {\n    \
    \    return true;\n    }\n};\n```\n\nwe get the following results:\n\n```\nstd::is_invocable<C>::value\
    \        // false\nstd::is_invocable<C,int>::value    // true\n```"
