- pgno: 382
  md: "```\nvoid setName(std::pmr::string s) {\n    name = std::move(s);\n}\nstd::pmr::string\
    \ getName() const {\n    return name;\n}\nstd::string getNameAsString() const\
    \ {\n    return std::string{name};\n}\n;\n```\n\nThe first thing to note is that\
    \ we use a pmr string as member. This not only holds the value (here the name),\
    \ it also holds the current allocator used:\n\n```\nstd::pmr::string name; //\
    \ also used to store the allocator\n```\n\nThen, we have to specify that this\
    \ type supports polymorphic allocators, which we can do simply by providing a\
    \ corresponding declaration of type allocator_type:\n\n```\nusing allocator_type\
    \ = std::pmr::polymorphic_allocator<char>;\n```\n\nThe type passed to the polymorphic_allocator\
    \ is irrelevant (when it is used the allocator is rebound to the necessary type).\
    \ You could, for example, also use std::byte there.⁴ Alternatively, you can also\
    \ use the allocator_type of the string member:\n\n```\nusing allocator_type =\
    \ decltype(name)::allocator_type;\n```\n\nNext we define the usual constructor(s)\
    \ with an additional optional allocator parameter:\n\n```\nPmrCustomer(std::pmr::string\
    \ n, allocator_type alloc = {})\n  : name{std::move(n), alloc} {\n}\n```\n\nYou\
    \ might think about declaring constructors like this as explicit. At least, if\
    \ you have a default constructor, you should do so to avoid implicit conversions\
    \ from an allocator to a customer:\n\n```\nexplicit PmrCustomer(allocator_type\
    \ alloc = {})\n  : name{alloc} {\n}\n```\n\nThen, we have to provide the copy\
    \ and move operations that ask for a specific allocator. This is the main interface\
    \ of pmr containers to ensure that their elements use the allocator of the container:\n\
    \n```\nPmrCustomer(const PmrCustomer& c, allocator_type alloc)\n  : name{c.name,\
    \ alloc} {\n}\nPmrCustomer(PmrCustomer&& c, allocator_type alloc)\n  : name{std::move(c.name),\
    \ alloc} {\n}\n```\n\n⁴ http://wg21.link/p0339r0 proposed to also allow the specification\
    \ of polymorphic_allocator<void> or just polymorphic_allocator<> here, but that\
    \ was rejected."
