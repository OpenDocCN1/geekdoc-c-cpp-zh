  md: "# Namespace fs\n\nFirst, again, we define fs as the usual shortcut for namespace\
    \ std::filesystem:\n\n```\nnamespace fs = std::filesystem;\n```\n\nUsing this\
    \ namespace we initialize the paths for a basic subdirectory for temporary files:\n\
    \n```\nfs::path testDir{\"tmp/test\"};\n```\n\n# Creating Directories\n\nWe then\
    \ try to create the subdirectory:\n\n```\ncreate_directories(testDir);\n```\n\n\
    By using create_directories(), we create all missing directories of the whole\
    \ passed path (there is also create_directory() to create a directory only inside\
    \ an existing directory).\n\nIt is not an error to perform this call if the directory\
    \ already exists. However, any other problem is an error and raises a corresponding\
    \ exception.\n\nIf testDir already exists, create_directories() returns false.\
    \ Thus, you could also call:\n\n```\nif (!create_directories(testDir)) {\n   \
    \ std::cout << \"\\\"\" << testDir.string() << \"\\\" already exists\\n\";\n}\n\
    ```\n\n# Creating Regular Files\n\nThen we create a new file /tmp/test/data.txt\
    \ with some contents:\n\n```\nauto testFile = testDir / \"data.txt\";\nstd::ofstream\
    \ dataFile{testFile};\nif (!dataFile) {\n    std::cerr << \"OOPS, can't open \\\
    \"\" << testFile.string() << \"\\\"\\n\";\n    std::exit(EXIT_FAILURE);  // exit\
    \ program with failure\n}\ndataFile << \"The answer is 42\\n\";\n```\n\nHere,\
    \ we use operator / to extend a path, which we then pass as an argument to the\
    \ constructor of a file stream. As you can see, the creation of a regular file\
    \ can still only be done with the existing I/O streams library. However, a new\
    \ overload for the constructors is provided to allow us to directly pass a filesystem\
    \ path (this also applies to functions such as open()).\n\nNote that you should\
    \ still always check whether the creation/opening of the file was successful.\
    \ A lot of things can go wrong here (see below).\n\n# Creating Symbolic Links\n\
    \nThe next statement tries to create a symbolic link tmp/slink that refers to\
    \ directory tmp/test:\n\n```\ncreate_directory_symlink(\"test\", testDir.parent_path()\
    \ / \"slink\");\n```"
