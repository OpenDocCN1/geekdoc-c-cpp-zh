  md: "# 9.1.4 Class Template Argument Deduction Instead of Convenience Functions\n\
    \nIn principle, by using class template argument deduction, we can get rid of\
    \ several convenience function templates that existed only to allow the deduction\
    \ of class template parameters from the passed call arguments.\n\nThe obvious\
    \ example is std::make_pair(), which avoided the need to specify the type of the\
    \ passed arguments. For example, after:\n\n```\nstd::vector<int> v;\n```\n\nwe\
    \ use:\n\n```\nauto p = std::make_pair(v.begin(), v.end());\n```\n\ninstead of\
    \ writing:\n\n```\nstd::pair<typename std::vector<int>::iterator,\n    typename\
    \ std::vector<int>::iterator> p(v.begin(), v.end());\n```\n\nHere, std::make_pair()\
    \ is no longer needed, as we can now simply declare:\n\n```\nstd::pair p(v.begin(),\
    \ v.end());\n```\n\nor\n\n```\nstd::pair p{v.begin(), v.end()};\n```\n\nHowever,\
    \ std::make_pair() is also a good example to demonstrate that sometimes the convenience\
    \ functions do more than just deduce template parameters. In fact, std::make_pair()\
    \ decays the passed argument (passing them by value in C++03 and using traits\
    \ since C++11). This has the effect that the type of passed string literals (arrays\
    \ of characters) are deduced as const char*:\n\n```\nauto q = std::make_pair(\"\
    hi\", \"world\");  // deduces pair of pointers\n```\n\nIn this case, q has type\
    \ std::pair<const char*, const char*>.\n\nUsing class template argument deduction\
    \ makes things more complicated. Look at the relevant part of a simple class declaration\
    \ like std::pair:\n\n```\ntemplate<typename T1, typename T2>\nstruct Pair1 {\n\
    \  T1 first;\n  T2 second;\n  Pair1(const T1& x, const T2& y) : first{x}, second{y}\
    \ {\n  }\n};\n```\n\nThe elements are passed by reference and according to language\
    \ rules, when passing arguments of a template type by reference, the parameter\
    \ type does not decay, which is the term for the mechanism to convert a raw array\
    \ type to the corresponding raw pointer type. Therefore, when calling:\n\n```\n\
    Pair1 p1{\"hi\", \"world\"};  // deduces pair of arrays of different size, but...\n\
    ```\n\nT1 is deduced as char[3] and T2 is deduced as char[6]. In principle, such\
    \ a deduction is valid. However, we use T1 and T2 to declare the members first\
    \ and second. As a consequence, they are declared as\n\n```\nchar first[3];\n\
    char second[6];\n```"
