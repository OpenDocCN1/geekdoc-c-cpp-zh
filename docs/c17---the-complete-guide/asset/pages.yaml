  md: "When passing an int, the deduction guide is used because it is preferred by\
    \ overload resolution.² Therefore, T is deduced as long:\n\n```\nC1 x1{42};  \
    \      // T deduced as long\n```\n\nHowever, if we pass a char, the constructor\
    \ is a better match (because no type conversion is necessary), which means that\
    \ we deduce T to be char:\n\n```\nC1 x3{'x'};        // T deduced as char\n```\n\
    \nIn overload resolution, there is no preference between call-by-value and call-by-reference.\
    \ However, deduction guides are preferred for equally good matches. Therefore,\
    \ it is usually fine to let the deduction guide take the argument by value (which\
    \ also has the advantage of decaying).\n\n# 9.2.4 Explicit Deduction Guides\n\n\
    A deduction guide can be declared as explicit. It is then ignored for cases where\
    \ the explicit would disable initializations or conversions. For example, given:\n\
    \n```\ntemplate<typename T>\nstruct S {\n    T val;\n};\n```\n\n```\nexplicit\
    \ S(const char*) -> S<std::string>;\n```\n\na copy initialization (using the =)\
    \ ignores the deduction guide. In this case, it means that the initialization\
    \ becomes invalid:\n\n```\nS s1 = {\"hello\"};        // ERROR (deduction guide\
    \ ignored and otherwise invalid)\n```\n\nDirect initialization or an explicit\
    \ deduction on the right-hand side is still possible:\n\n```\nS s2{\"hello\"};\
    \        // OK, same as: S<std::string> s2{\"hello\"};\nS s3 = S{\"hello\"}; \
    \     // OK\nS s4 = {S{\"hello\"}};    // OK\n```\n\nAs another example, we could\
