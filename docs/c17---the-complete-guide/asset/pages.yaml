    \t<< '\\n';\n\treturn ::operator new(size, align);\n}\n\nstatic void operator\
    \ delete (void* p) {\n\t// called for default-aligned data:\n\tstd::cout << \"\
    MyType32::delete() without alignment\\n\";\n\t::operator delete(p);\n}\n\nstatic\
    \ void operator delete (void* p, std::size_t size) {\n\tMyType32::operator delete(p);\
    \ // use the non-sized delete\n}\n\nstatic void operator delete (void* p, std::align_val_t\
    \ align) {\n\t// called for default-aligned data:\n\tstd::cout << \"MyType32::delete()\
    \ with alignment\\n\";\n\t::operator delete(p, align);\n}\n\nstatic void operator\
