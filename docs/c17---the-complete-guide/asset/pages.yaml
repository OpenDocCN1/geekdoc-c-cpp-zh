    \ template parameters, and this happened again with C++17. Templates now can be\
    \ used without having to be defined outside the current scope.\n\n# 12.1 Using\
    \ Strings in Templates\n\nNon-type template parameters can be only constant integral\
    \ values (including enumerations), pointers to objects/functions/members, lvalue\
    \ references to objects or functions, or std::nullptr_t (the type of nullptr).\n\
    \nFor pointers, before C++17, external or internal linkage was required. However,\
    \ since C++17, you can have pointers with what is called “no linkage.” However,\
    \ you still cannot pass string literals directly. For example:\n\n```\ntemplate<const\
    \ char* str>\nclass Message {\n...\n};\n```\n\n```\nextern const char hello[]\
    \ = \"Hello World!\";      // external linkage\nconst char hello11[] = \"Hello\
    \ World!\";            // internal linkage\n```\n\n```\nvoid foo()\n{\n    Message<hello>\
    \   msg;      // OK (all C++ versions)\n    Message<hello11> msg11;    // OK since\
    \ C++11\n\n    static const char hello17[] = \"Hello World!\";  // no linkage\n\
    ```"
