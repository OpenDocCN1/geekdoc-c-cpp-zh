  md: "+   - The `boyer_moore_horspool_searcher` trades space for time. It is usually\
    \ slower than the `boyer_moore_searcher`, but should not use that much memory.\
    \ The improvement I noted varied a lot from platform to platform. While on one\
    \ platform it was close to `boyer_moore` (50 times better than `search()`, and\
    \ 10 times better than `find()`), on other platforms the improvement was a factor\
    \ of only 2 or 3 compared to `search()` and using `find()` was much faster.\n\
    +   - Where already supported, using the parallel `search()` gave me a factor\
    \ of 3 compared to the ordinary `search()`, which indicated that using the Boyer-Moore\
    \ searcher should usually still be much faster.\n\nTherefore, there is only one\
    \ piece of advice I can give: **Measure!** Test the typical scenarios on your\
    \ target platforms. It is worth it because you might get an improvement of a factor\
    \ of 100 (which I got, for example, when searching for a substring of 1000 characters\
    \ located close to the end of a string with 10 million characters).\n\nThe code\
    \ in `lib/searcher1.cpp` also prints measurements of the different search options\
    \ so that you can compare the numbers on your platform.\n\n# 24.1.2 Using Searchers\
    \ Directly\n\nAlternatively, you can use the function-call operator of the searcher,\
    \ which returns a pair of both the begin and the end of any subsequence found.\n\
    \nThe code would look as follows:\n\n```\nstd::boyer_moore_searcher bmsearch{sub.begin(),\
    \ sub.end()};\n...\nfor (auto begend = bmsearch(text.begin(), text.end());\n \
    \   begend.first != text.end();\n    begend = bmsearch(begend.second, text.end()))\
    \ {\n  std::cout << \"found \" << sub << \"\" at index \"\n            << begend.first\
    \ - text.begin() << '-'\n            << begend.second - text.begin() << '\\n';\n\
    }\n```\n\nHowever, because you can use `std::tie()` to reassign new values to\
    \ structured bindings of a `std::pair<>`, you can simplify the code as follows:\n\
    \n```\nstd::boyer_moore_searcher bmsearch{sub.begin(), sub.end()};\n...\nfor (auto\
    \ [beg, end] = bmsearch(text.begin(), text.end());\n    beg != text.end();\n \
    \   std::tie(beg,end) = bmsearch(end, text.end())) {\n  std::cout << \"found \"\
    \ << sub << \"\" at index \"\n            << beg - text.begin() << '-'\n     \
    \       << end - text.begin() << '\\n';\n}\n```\n\nTo find the first occurrence\
    \ of a substring using the searchers directly, you can use `if` with initialization\
    \ and structured bindings:\n\n```\nstd::boyer_moore_searcher bmsearch{sub.begin(),\
    \ sub.end()};\n...\n```"
