  md: "Finally, we can also use operator* to modify the value because it yields the\
    \ value by reference. However, note that this requires the existence of a value\
    \ to modify:\n\n```\nstd::optional<std::complex<double>> o;\n*o = 42;        \
    \        // undefined behavior\n...\nif (o) {\n    *o = 88;            // OK:\
    \ value becomes complex(88.0, 0.0)\n    *o = {1.2, 3.4};    // OK: value becomes\
    \ complex(1.2, 3.4)\n}\n```\n\n# Move Semantics\n\nstd::optional<> also supports\
    \ move semantics. If you move the object as a whole, the state is copied and the\
    \ contained object (if there is one) is moved. As a result, a moved-from object\
    \ still has the same state but any value becomes unspecified.\n\nHowever, you\
    \ can also move a value into or out of the contained object. For example:\n\n\
    ```\nstd::optional<std::string> os;\nstd::string s = \"a very very very long string\"\
    ;\nos = std::move(s);            // OK, moves\nstd::string s2 = *os;         //\
    \ OK, copies\nstd::string s3 = std::move(*os); // OK, moves\n```\n\nNote that\
    \ after the last call, os still has a string value, but as usual for moved-from\
    \ objects, the value is unspecified. Thus, you can use it as long as you do not\
    \ make any assumption about its value. You can even assign a new string value\
    \ there.\n\nAlso note that some overloads ensure that temporary optionals are\
    \ moved.⁵ Consider a function that returns an optional string:\n\n```\nstd::optional<std::string>\
    \ func();\n```\n\nIn this case, the following is well defined to move the value:\n\
    \n```\nstd::string s4 = func().value(); // OK, moves\nstd::string s5 = *func();\
    \        // OK, moves\n```\n\nThis behavior is possible by providing rvalue overloads\
    \ for the corresponding member functions:\n\n```\nnamespace std {\n    template<typename\
    \ T>\n    class optional {\n        ...\n        constexpr T& operator*() &;\n\
    \        constexpr const T& operator*() const&;\n        constexpr T&& operator*()\
    \ &&;\n        constexpr const T&& operator*() const&&;\n    }\n}\n```"
