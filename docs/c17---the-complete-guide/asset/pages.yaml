- pgno: 243
  md: '# Path I/O


    First, note that the I/O operators write and read paths as quoted strings. You
    have to convert them into a string to write them without quotes:


    ```

    std::filesystem::path file{"test.txt"}

    std::cout << file << ''\n'';        // writes: "test.txt"

    std::cout << file.string() << ''\n'';  // writes: test.txt

    ```


    On Windows, this has even worse effects. The following code:


    ```

    std::filesystem::path tmp{"C:\\Windows\\Temp"};

    std::cout << tmp << ''\n'';

    std::cout << tmp.string() << ''\n'';

    std::cout << ''"'' << tmp.string() << "\"\n";

    ```


    has the following output:


    ```

    "C:\\Windows\\Temp"

    C:\Windows\Temp

    "C:\Windows\Temp"

    ```


    Note that reading file names supports both forms (quoted with a leading " and
    non-quoted). Thus, all printed forms will be read back correctly using the standard
    input operator for paths:


    ```

    std::filesystem::path tmp;

    std::cin >> tmp;  // reads quoted and non-quoted paths correctly

    ```


    # Normalization


    Normalization might have more surprising outcomes when you are dealing with portable
    code. For example:


    ```

    std::filesystem::path p2{"//dir\\subdir/subsubdir\\./.\\"};

    std::cout << "p2:"                     << p2 << ''\n'';

    std::cout << "lexically_normal(): " << p2.lexically_normal() << ''\n'';

    ```


    has the following probably expected output on Windows systems:


    ```

    p2:                "//host\\dir/sub\\./.\\"

    lexically_normal(): "\\\\host\\dir\\sub\\"

    ```


    However, on POSIX-based systems, the output becomes:


    ```

    p2:                "//host\\dir/sub\\./.\\"

    lexically_normal(): "/host\\dir/sub\\\\"

    ```


    The reason is that for POSIX-based systems, the backslash is neither a directory
    separator nor a valid character for a rootname, which means that we have an absolute
    path with the three file names host\dir, sub\, and \. On POSIX-based systems,
    there is no way to detect the backslash as a possible directory separator (neither
    generic_string() nor make_preferred() will help in this case). Therefore, for
    portable code, you should always use the generic path format when dealing with
    paths.'
  merge: -1
  img_proc: true
- pgno: 244
  md: "Nevertheless, it is a good approach to use lexically_normal() to remove the\
    \ leading dot when iterating over the current directory.\n\n# Relative Path\n\n\
    Both lexically_relative() and lexically_proximate() can be called to compute the\
    \ relative path between two paths. The only difference is the behavior if there\
    \ is no path, which only can happen if one path is relative and the other is absolute\
    \ or the root names differ. In that case:\n\n+   - p.lexically_relative(p2) yields\
    \ the empty path if there is no relative path from p2 to p.\n+   - p.lexically_proximate(p2)\
    \ yields p if there is no relative path from p2 to p.\n\nBecause both operations\
    \ operate lexically, the actual filesystem (which might have symbolic links) and\
    \ the current_path() are not taken into account. If both paths are equal, the\
    \ relative path is \".\". For example:\n\n```\nfs::path{\"/a/d\"}.lexically_relative(\"\
    /a/b/c\")      // \"../../d\"\nfs::path{\"/a/b/c\"}.lexically_relative(\"/a/d\"\
    )      // \"../../b/c\"\nfs::path{\"/a/b\"}.lexically_relative(\"/a/b/\")    \
    \   // \".\"\nfs::path{\"/a/b\"}.lexically_relative(\"/a/b/\")       // \".\"\n\
    fs::path{\"/a/b\"}.lexically_relative(\"/a/b\\\\\")     // \".\"\nfs::path{\"\
    /a/b\"}.lexically_relative(\"/a/d/../c\")   // \"../b\"\nfs::path{\"a/d/../b\"\
    }.lexically_relative(\"a/c\")      // \"../../d/../b\"\nfs::path{\"a//d/../b\"\
    }.lexically_relative(\"a/c\")     // \"../../d/../b\"\n```\n\nOn Windows systems,\
    \ we have:\n\n```\nfs::path{\"C:/a/b\"}.lexically_relative(\"c:/c/d\") ;   //\
    \ \"\"\nfs::path{\"C:/a/b\"}.lexically_relative(\"D:/c/d\") ;   // \"\"\nfs::path{\"\
    C:/a/b\"}.lexically_proximate(\"D:/c/d\") ;   // \"C:/a/b\"\n```\n\n# Conversions\
    \ to Strings\n\nWith u8string() you can use the path as a UTF-8 string, which\
    \ nowadays is the common format for stored data. For example:\n\n```\n// store\
    \ paths as a UTF-8 string:\nstd::vector<std::string> utf8paths;  // std::u8string\
    \ with C++20\nfor (const auto& entry : fs::directory_iterator(p)) {\n    utf8paths.push_back(entry.path().u8string());\n\
    }\n```\n\nNote that the return value of u8string() will probably change from std::string\
    \ to std::u8string with C++20 (the new UTF-8 string type as proposed together\
    \ with char8_t for UTF-8 characters in http://wg21.link/p0482)."
