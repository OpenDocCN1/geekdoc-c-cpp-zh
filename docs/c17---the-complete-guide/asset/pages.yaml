    \ bm{sub.begin(), sub.end()};\nauto [beg, end] = bm(coll.begin(), coll.end());\n\
    if (beg != coll.end) {\n    std::cout << \"found subsequence at \" << beg - coll.begin()\
    \ << '\\n';\n}\n```\n\nTo make this possible, it must be possible to use the elements\
    \ in a hash table (i.e., a default hash function must be provided and comparing\
    \ two elements with == has to be supported). If this is not the case, you can\
    \ use predicates (as described below):\n\nAgain: measure to find out the benefit\
    \ in performance (speed and memory). I note an even greater variety of factors\
    \ when trying out some examples. For example, using the boyer_moore_searcher could\
