  md: "```\nclass CopyOnly {\npublic:\n    CopyOnly() {\n    }\n    CopyOnly(int)\
    \ {\n    }\n    CopyOnly(const CopyOnly&) = default;\n    CopyOnly(CopyOnly&&)\
    \ = delete;  // explicitly deleted\n};\n\nCopyOnly ret() {\n    return CopyOnly{};\
    \  // OK since C++17\n}\n\nCopyOnly x = 42;      // OK since C++17\n```\n\nThe\
    \ initialization of x was invalid before C++17 because the copy initialization\
    \ (initialization using the =) needed the conversion of 42 to a temporary and\
    \ that temporary in principle needed the move constructor, although it was never\
    \ called. (The fact that the copy constructor serves as a fallback for a move\
    \ constructor applies only if the move constructor is not user-declared.)\n\n\
    # 5.3 Clarified Value Categories\n\nAs a side effect of the proposed change to\
    \ require copy elision for temporaries when initializing new objects, some adjustments\
    \ were made to value categories.\n\n# 5.3.1 Value Categories\n\nEach expression\
    \ in a C++ program has a value category. In particular, the category describes\
    \ what can be done with an expression.\n\n# History of Value Categories\n\nHistorically\
    \ (taken from C), we had only lvalue and rvalue, based on an assignment:\n\n```\n\
    x = 42;\n```\n\nwhere x used as an expression was an lvalue because it could stand\
    \ on the left side of an assignment, and 42 used as an expression was an rvalue,\
    \ because it could only stand on the right side. However, things already became\
    \ more complicated with ANSI-C because an x declared as const int could not stand\
    \ on the left side of an assignment but was still a (non-modifyable) lvalue.\n\
    \nThen, C++11 introduced movable objects, which from a semantic perspective, were\
    \ objects for the right side of an assignment only but could be modified because\
    \ an assignment operator could steal their value. For this reason, the category\
    \ xvalue was introduced and the former category rvalue was renamed to prvalue."
