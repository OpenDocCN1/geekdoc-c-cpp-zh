- pgno: 19
  md: 'point value). If the braces are empty, the default constructors of (sub)objects
    are called and fundamental data types are initialized with 0/false/nullptr.


    # Overall Structure of the Book


    This book covers *all* changes to C++ introduced with C++17. This applies to both
    language and library features as well as both features that affect day-to-day
    application programming and features for the sophisticated implementation of (foundation)
    libraries. However, the more general cases and examples usually come first.


    The different chapters are grouped, but the grouping has no deeper didactic reasoning
    other than that it makes sense to first introduce language features because they
    might be used by the following library features. In principle, you can read the
    chapters in any order. If features from different chapters are combined, there
    are corresponding cross-references.


    As a result, the book contains the following parts:


    +   - **Part I** covers the new non-template language features.

    +   - **Part II** covers the new language features for generic programming with
    templates.

    +   - **Part III** introduces the new standard library components.

    +   - **Part IV** covers the extensions and modifications to the existing components
    of the standard library.

    +   - **Part V** covers language and library features for experts such as foundation
    library programmers.

    +   - **Part VI** contains some concluding general hints about C++17.


    # How to Read This Book


    In my experience, the best way to learn something new is to look at examples.
    Therefore, you will find a lot of examples throughout the book. Some are just
    a few lines of code illustrating an abstract concept, whereas others are complete
    programs that provide a concrete application of the material. The latter kind
    of examples will be introduced by a C++ comment describing the file containing
    the program code. You can find these files on the website for this book at `http://www.cppstd17.com`.


    # Error Terminology


    Note that I often talk about programming errors. If there is no special hint,
    the term *error* or a comment such as


    ```

    …    // ERROR

    ```


    means a compile-time error. The corresponding code should not compile (with a
    conforming compiler).


    If I use the term *runtime error*, the program might compile but not behave correctly
    or result in undefined behavior (thus, it might or might not do what is expected).


    > The only exception are atomic data types (type `std::atomic<>`), where even
    list initialization does not guarantee proper initialization. This will hopefully
    be fixed with C++20.'
