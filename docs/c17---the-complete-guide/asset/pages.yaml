  md: "# Chapter 27\n\n# Multi-Threading and Concurrency\n\nA couple of minor extensions\
    \ and improvements were introduced in the area of multi-threading and concurrency.\n\
    \n# 27.1 Supplementary Mutexes and Locks\n\n# 27.1.1 std::scoped_lock\n\nC++11\
    \ introduced a simple std::lock_guard to allow a simple RAII-style way for locking\
    \ a mutex:\n\n+   - The constructor locks\n+   - The destructor unlocks (which\
    \ might be caused by an exception)\n\nUnfortunately, this was not standardized\
    \ as a variadic template to allow multiple mutexes to be locked with a single\
    \ declaration.\n\nstd::scoped_lock<> closes this gap. It allows us to lock one\
    \ or multiple mutexes. The mutexes may have different mutex types.\n\nFor example:\n\
    \n```\n#include <mutex>\n...\nstd::vector<std::string> allIssues;\nstd::mutex\
    \ allIssuesMx;\nstd::vector<std::string> openIssues;\nstd::timed_mutex openIssuesMx;\n\
    \n// lock both issue lists:\n{\n    std::scoped_lock lg(allIssuesMx, openIssuesMx)\n\
    \    ...  // manipulate both allIssues and openIssues\n}\n```"
  merge: -1
  img_proc: true
- pgno: 343
  md: "Note that due to class template argument deduction, you do not have to specify\
    \ the types of the mutexes when declaring lg.\n\nThis example usage is equivalent\
    \ to the following code, which can be called since C++11:\n\n```\n// lock both\
    \ issue lists:\n{\n    std::lock(allIssuesMx, openIssuesMx);    // lock with deadlock\
    \ avoidance\n    std::lock_guard<std::mutex> lg1(allIssuesMx, std::adopt_lock);\n\
    \    std::lock_guard<std::mutex> lg2(openIssuesMx, std::adopt_lock);\n    ...\
    \  // manipulate both allIssues and openIssues\n}\n```\n\nThus, if more than one\
    \ mutex is passed, the constructor of scoped_lock uses the variadic convenience\
    \ function lock(...), which guarantees that the call does not result in a deadlock\
    \ (the standard notes: “A deadlock avoidance algorithm such as try-and-back-off\
    \ must be used, but the specific algorithm is not specified to avoid over-constraining\
    \ implementations”).\n\nIf only one mutex is passed to the constructor of a scoped_lock,\
    \ it simply locks the mutex. Thus, in a scoped_lock with a single constructor,\
    \ argument acts like a lock_guard. It then even defines the member mutex_type,\
    \ which is not defined for multiple mutexes.¹ Therefore, you can replace all uses\
    \ of lock_guard with scoped_lock.\n\nIf no mutex is passed, the lock guard has\
    \ no effect.\n\nNote that you can also adopt multiple locks:\n\n```\n// lock both\
    \ issue lists:\n{\n    std::lock(allIssuesMx, openIssuesMx);    // Note: deadlock\
    \ avoidance algorithm used\n    std::scoped_lock lg{std::adopt_lock, allIssuesMx,\
    \ openIssuesMx};\n    ...  // manipulate both allIssues and openIssues\n}\n```\n\
    \nHowever, note that the constructors that adopt the locked mutexes now have the\
    \ adopt_lock argument at the front.²\n\n# 27.1.2 std::shared_mutex\n\nC++14 added\
    \ a std::shared_timed_mutex to support read/write locks, where multiple threads\
    \ read a value concurrently, while from time to time a thread might update the\
    \ value. However, mutexes that do not support timed locks can be implemented more\
    \ efficiently on some platforms. Therefore, the type std::shared_mutex has now\
    \ been introduced (as std::mutex has existed in addition to std::timed_mutex since\
    \ C++11).\n\nstd::shared_mutex is defined in header <shared_mutex> and supports\
    \ the following operations:"
