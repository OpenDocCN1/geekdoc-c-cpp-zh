  md: "# Chapter 2\n\n# if and switch with Initialization\n\nThe if and switch control\
    \ structures now allow us to specify an initialization clause before the usual\
    \ condition or selection clause.\n\nFor example, you can write:\n\n```\nif (status\
    \ s = check(); s != status::success) {\n    return s;\n}\n```\n\nwhere the initialization\n\
    \n```\nstatus s = check();\n```\n\ninitializes s, which is then valid for the\
    \ whole if statement (including the optional else part).\n\n# 2.1 if with Initialization\n\
    \nAny value initialized inside an if statement is valid until the end of the then\
    \ and the else part (if this part exists). For example:\n\n```\nif (std::ofstream\
    \ strm = getLogStrm(); coll.empty()) {\n    strm << \"<no data>\\n\";\n}\nelse\
    \ {\n    for (const auto& elem : coll) {\n        strm << elem << '\\n';\n   \
    \ }\n}\n// strm no longer declared\n```\n\nThe destructor for strm is called at\
    \ the end of the whole if statement (at the end of the else part, if any, or at\
    \ the end of the then part, otherwise)."
