    \ // true\n```\n\n# Type Trait invoke_result<>\n\n```\nstd::invoke_result<T,Args...>::type\n\
    ```\n\nyields the return type of using T as the type of a callable for Args....\
    \ That is, we can use this trait to get the return type obtained when we call\
    \ (directly or via std::invoke()) a callable of type T for arguments of type Args....\n\
    \nThe trait replaces result_of<>, which should no longer be used.\n\nFor example:\n\
    \n```\nstd::string foo(int);\n\nusing T1 = std::invoke_result_t<decltype(foo),\
    \ int>;    // T1 is std::string\n\nstruct ABC {\n    virtual ~ABC() = 0;\n   \
    \ void operator() (int) const {\n    }\n};\n\nusing T2 = typename std::invoke_result<ABC,\
    \ int>::type;  // T2 is void\n```\n\n# Logical Operations for Boolean Type Traits\n\
    \nTable Type Traits to Combine Other Type Traits lists the type traits that are\
    \ provided to logically combine or apply Boolean type traits (almost all standard\
    \ type traits that yield a value).\n\n| Traits | Effect |\n|---|---|\n| conjunction<B...>\
    \ | Logical and for Boolean traits B... |\n| disjunction<B...> | Logical or for\
    \ Boolean traits B... |\n| negation<B> | Logical not for Boolean trait B |\n\n\
    Table 21.2. Type Traits to Combine Other Type Traits"
