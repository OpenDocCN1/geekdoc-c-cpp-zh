    \ if, you can put all the logic together in one function.\n\nFor example, instead\
    \ of overloading the std::advance() algorithm:\n\n```\ntemplate<typename Iterator,\
    \ typename Distance>\nvoid advance(Iterator& pos, Distance n) {\n    using cat\
    \ = typename std::iterator_traits<Iterator>::iterator_category;\n    advanceImpl(pos,\
    \ n, cat{});    // tag dispatch over iterator category\n}\n```\n\n```\ntemplate<typename\
    \ Iterator, typename Distance>\nvoid advanceImpl(Iterator& pos, Distance n,\n\
    \                std::random_access_iterator_tag) {\n    pos += n;\n}\n```\n\n\
    ```\ntemplate<typename Iterator, typename Distance>\nvoid advanceImpl(Iterator&\
    \ pos, Distance n,\n                std::bidirectional_iterator_tag) {\n    if\
    \ (n >= 0) {\n        while (n--) {\n            ++pos;\n        }\n    }\n  \
    \  else {\n        while (n++) {\n            --pos;\n        }\n    }\n}\n```\n\
