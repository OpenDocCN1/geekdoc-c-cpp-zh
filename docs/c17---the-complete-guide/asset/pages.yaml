  md: '# 28.3 Numeric Extensions


    The following numeric functions were also added with C++17.


    # 28.3.1 Greatest Common Divisor and Least Common Multiple


    In header <numeric>:


    +   - gcd(x, y)

    +     returns the greatest common divisor of x and y

    +   - lcm(x, y) returns the least common multiple of x and y


    Both arguments have to be of an integral type, except bool. The types may differ.
    In that case, the return value has the common type of both arguments.


    For example:


    ```

    #include <numeric>


    int i{42};

    long l{30};


    auto x{std::gcd(i, l)};  // x is long 6

    auto y{std::lcm(i, l)};  // y is long 210

    ```


    # 28.3.2 Three-Argument Overloads of std::hypot()


    In header <cmath>:


    +   - hypot(x, y, z)

    +     returns the square root of the square of the passed arguments


    As usual for functions in <cmath>, this function has overloads to support all
    floating point types. These overloads are not provided in math.h or outside namespace
    std.


    For example:


    ```

    #include <cmath>


    // compute distance of two points in 3D space:

    auto dist = std::hypot(p2.x - p1.x, p2.y - p1.y, p2.z - p1.z);

    ```


    Before C++17, you had to call something like the following:


    ```

    auto dist = std::hypot(p2.x - p1.x, std::hypot(p2.y - p1.y, p2.z - p1.z));

    ```


    # 28.3.3 Mathematical Special Functions


    A collection of table Mathematical Special Functions already standardized in the
    international standard IS 29124:2010 is now required to be unconditionally available
    in the C++ standard in header <cmath>.


    With the original names, the functions take floating-point parameters and declare
    return values as double. All these functions also exist with'
