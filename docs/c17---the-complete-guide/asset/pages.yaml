- pgno: 333
  md: "We extract an element from src twice (once passing the key and once passing\
    \ an iterator) and insert it into dst. Thus, the program has the following output:\n\
    \n```\nvalues:\n    [1.1:one]  [2.2:two]  [3.3:three]\n    [3.3:old data]\nvalues:\n\
    \    [3.3:three]\n    [1.1:one]  [2.2:two]  [3.3:old data]\n```\n\nNote that when\
    \ no duplicates are allowed (set, map, unordered set, unordered map), the insert()\
    \ member function that takes a node handle returns a structure container::insert_return_type\
    \ with three elements (in the following order):\n\n+   - An iterator **position**\
    \ referring to the new inserted element or to the existing element if the insertion\
    \ failed because there was already an element with the same key\n+   - A bool\
    \ **inserted** to signal whether the insertion was successful\n+   - The container::node_type\
    \ **node** with the node handle if the insertion was not possible\n\nThat is,\
    \ the key information is the second member inserted. Using structured bindings,\
    \ you might use the return value as follows:\n\n```\nauto [pos,done,node] = dst.insert(src.extract(3.3));\n\
    if (!done) {\n    std::cout << \"insert() of node handle failed:\"\n         \
    \     << \" tried to insert key '\" << node.key()\n              << \"' with value\
    \ '\" << node.mapped()\n              << \"' but key exists with value '\" <<\
    \ pos->second << \"'\\n\";\n}\n```\n\nIf a node is extracted and never inserted,\
    \ the destructor of a node handle will free the memory allocated for it. Therefore,\
    \ in this code, there is no memory leak even if the insertion failed.\n\n# 26.1.3\
    \ Merging Containers\n\nBased on the node handle API, all associative and unordered\
    \ containers provide a member function merge() now, which allows us to merge all\
    \ elements from one container to another.\n\nAgain, the containers can even differ\
    \ in the following way:\n\n+   - One supports duplicates while another does not\
    \ (e.g., you can merge elements from a multimap to a map)\n+   - Comparison functions\
    \ and hash functions might differ\n\nIf a node cannot be moved because there is\
    \ already an element with the same key, the element remains in the source container.\n\
    \nFor example, the following program:\n\nlib/nodemerge.cpp\n\n```\n#include <iostream>\n\
    #include <string>\n#include <map>\n```"
