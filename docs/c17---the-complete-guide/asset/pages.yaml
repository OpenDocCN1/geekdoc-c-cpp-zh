  md: "```\n```cpp\nvoid foo() {\n    auto l1 = [*this] { std::cout << name << '\\\
    n'; };\n    ...\n};\n```\n```\n\nThat is, the capture *this means that a copy\
    \ of the current object is stored in the closure object defined by the lambda.\n\
    \nYou can still combine capturing *this with other captures, as long as there\
    \ is no contradiction for handling this:\n\n```\n```cpp\nauto l2 = [&, *this]\
