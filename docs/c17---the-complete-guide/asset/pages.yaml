  md: "# 10.2 Using Compile-Time if\n\nIn principle, you can use the compile-time\
    \ if like the runtime if provided the condition is a compile-time expression.\
    \ You can also mix compile-time and runtime if:\n\n```\nif constexpr (std::is_integral_v<std::remove_reference_t<T>>)\
    \ {\n    if (val > 10) {\n        if constexpr (std::numeric_limits<char>::is_signed)\
    \ {\n            ...\n        }\n        else {\n            ...\n        }\n\
    \    }\n    else {\n        ...\n    }\n}\nelse {\n    ...\n}\n```\n\nNote that\
    \ you cannot use if constexpr outside function bodies. Thus, you cannot use it\
    \ to replace conditional preprocessor directives.\n\n# 10.2.1 Caveats for Compile-Time\
    \ if\n\nEven when it is possible to use compile-time if, there might be some consequences\
    \ that are not obvious. These are discussed in the following subsections.²\n\n\
    # Compile-Time if Impacts the Return Type\n\nCompile-time if might impact the\
    \ return type of a function. For example, the following code always compiles but\
    \ the return type might differ:\n\n```\nauto foo()\n{\n    if constexpr (sizeof(int)\
    \ > 4) {\n        return 42;\n    }\n    else {\n        return 42u;\n    }\n\
    }\n```\n\n2 Thanks to Graham Haynes, Paul Reilly, and Barry Revzin for bringing\
    \ all these aspects of compile-time if to my attention."
