  md: "# 29.3 Providing Memory Resource Support for Custom Types\n\nNow that we have\
    \ introduced standard memory resources and user-defined memory resources, one\
    \ topic remains: how can we make our custom types polymorphic-allocator-aware\
    \ so that they can be used like a pmr::string as an element of a pmr container?\n\
    \n# 29.3.1 Definition of a PMR Type\n\nThe recipe for supporting polymorphic allocators\
    \ is surprisingly easy, provided you use pmr members for all data that needs heap\
    \ memory. You have to:\n\n+   - Define allocator_type as a public member defined\
    \ as a polymorphic allocator\n+   - Add overloads for all constructors to take\
    \ the allocator as an additional argument (this includes copy and move constructor)\n\
    +   - Let initializing constructors without an allocator argument to use allocator_type\
    \ (this would not apply to the copy and move constructor, if implemented)\n\n\
    Here is a first example:\n\n```\npmr/pmrcustomer.hpp\n#include <string>\n#include\
    \ <memory_resource>\n\n// Customer as polymorphic-allocator-aware type\n// - the\
    \ allocator is stored in the string member\nclass PmrCustomer\n{\nprivate:\n \
    \   std::pmr::string name;  // also used to store the allocator\npublic:\n   \
    \ using allocator_type = std::pmr::polymorphic_allocator<char>;\n\n    // initializing\
    \ constructor(s):\n    PmrCustomer(std::pmr::string n, allocator_type alloc =\
    \ {})\n    : name{std::move(n), alloc} {\n    }\n\n    // copy/move with allocators:\n\
    \    PmrCustomer(const PmrCustomer& c, allocator_type alloc)\n    : name{c.name,\
    \ alloc} {\n    }\n    PmrCustomer(PmrCustomer&& c, allocator_type alloc)\n  \
    \  : name{std::move(c.name), alloc} {\n    }\n\n    // setters/getters:\n```"
