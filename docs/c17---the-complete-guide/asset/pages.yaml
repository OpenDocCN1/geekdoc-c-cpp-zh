    \ you could also iterate over the Customer elements of a vector:\n\n```\nstd::vector<Customer>\
    \ coll;\n...\nfor (const auto& [first, last, val] : coll) {\n    std::cout <<\
    \ first << ' ' << last << \": \" << val << '\\n';\n}\n```\n\nInside the loop,\
    \ no customer is copied because const auto& is used. However, the initialization\
    \ of the structured bindings calls the getters via get<>( ), returning a copy\
    \ of both the first name and the last name. Then, in the body of the loop, the\
    \ value of the initialized bindings is just used without calling the getters again.\
    \ And at the end of an iteration, the copied strings are destructed.\n\nNote that\
    \ decltype for a structured binding still yields its type, not the type of the\
    \ anonymous entity behind it. This means that here, decltype(first) is const std::string\
    \ and not a reference.\n\n# Enable Structured Bindings with Write Access\n\nThe\
    \ tuple-like API can use functions that yield non-const references. This enables\
