- pgno: 118
  md: "+   - When passing a string literal (i.e., type const char*), the then parts\
    \ of the first and second if are discarded.\n\nTherefore, on each instantiation,\
    \ each invalid combination is discarded at compile-time and the code compiles\
    \ successfully.\n\nNote that a discarded statement is not ignored. Even for discarded\
    \ statements, the syntax must be correct and calls that do not depend on template\
    \ parameters must be valid. In fact, the first translation phase (the definition\
    \ time) is always performed, which checks for correct syntax and the validity\
    \ of all names that do not depend on template parameters. All static_asserts must\
    \ also be valid, even in branches that are not compiled.\n\nFor example:\n\n```\n\
    template<typename T>\nvoid foo(T t)\n{\n    if constexpr(std::is_integral_v<T>)\
    \ {\n        if (t > 0) {\n            foo(t-1); // OK\n        }\n    }\n   \
    \ else {\n        undeclared(t);   // error if not declared and not discarded\
    \ (i.e., T is not integral)\n        undeclared();    // error if not declared\
    \ (even if discarded)\n        static_assert(false, \"no integral\");  // always\
    \ asserts (even if discarded)\n    }\n}\n```\n\nWith a conforming compiler, this\
    \ example never compiles for two reasons:\n\n+   - Even if T is an integral type,\
    \ the call of\n+   \n+     undeclared();      // error if not declared (even if\
    \ discarded)\n+   \n+     in the discarded else part is an error if no such function\
    \ is declared, because this call does not depend on a template parameter.\n\n\
    +   - The assertion\n+   \n+     static_assert(false, \"no integral\");  // always\
    \ asserts (even if discarded)\n+   \n+     always fails even if it is part of\
    \ the discarded else part, because again it does not depend on a template parameter.\
    \ A static assertion repeating the compile-time condition would be fine:\n+  \
    \ \n+     static_assert(!std::is_integral_v<T>, \"no integral\");\n\nNote that\
    \ some compilers (e.g., Visual C++ 2013 and 2015) do not implement or perform\
    \ the two-phase translation of templates correctly. They defer most of the first\
    \ phase (the definition time) to the second phase (the instantiation time), which\
    \ means that invalid function calls and even some syntax errors might compile."
