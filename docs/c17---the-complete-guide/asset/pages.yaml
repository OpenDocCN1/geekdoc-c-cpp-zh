    \ std::underlying_type_t<std::byte> instead of unsigned char to make the purpose\
    \ of the using declaration clearer.\n\nYou can also use this to write the binary\
    \ representation of a std::byte into a string:\n\n```\nstd::string s = ByteBitset{std::to_integer<unsigned>(b1)}.to_string();\n\
    ```\n\nIf you already have a character sequence, you can also use std::to_chars()\
    \ as follows:\n\n```\n#include <charconv>\n\nint value = 42;\nchar str[100];\n\
    std::to_chars_result res = std::to_chars(str, str+99, std::to_integer<int>(b1),\
    \ 2);\n*res.ptr = '\\0';  // ensure a trailing null character is behind\n```\n\
    \nNote that this form does not write any leading 0, which means that for the value\
    \ 42, the following is written:\n\n```\n1111110\n```\n\nInput is possible in a\
    \ similar way: just read the value as an integral, string, or bitset value and\
    \ convert it. For example, you can write an input operator that reads a byte from\
    \ a binary representation as follows:\n\n```\nstd::istream& operator>> (std::istream&\
    \ strm, std::byte& b)\n{\n    // read into a bitset:\n    std::bitset<std::numeric_limits<unsigned\
    \ char>::digits> bs;\n    strm >> bs;\n    // without failure, convert to std::byte:\n\
    \    if (!strm.fail()) {\n        b = static_cast<std::byte>(bs.to_ulong()); \
