  md: '# Chapter 15


    # std::optional<>


    In programming, we often have the situation that we might return/pass/use an object
    of a certain type. That is, we could have a value of a certain type or we might
    not have any value at all. Therefore, we need a way to simulate semantics similar
    to pointers, where we can express having no value by using nullptr. The way to
    handle this is to define an object of a certain type with an additional Boolean
    member/flag that signals whether a value exists. std::optional<> provides such
    objects in a type-safe way.


    Optional objects simply have internal memory for the contained objects plus a
    Boolean flag. Thus, the size is usually one byte larger than the contained object
    (plus a possible alignment overhead). No heap memory is allocated. The objects
    use the same alignment as the contained type.


    However, optional objects are not just structures that add the functionality of
    a Boolean flag to a value member. For example, if there is no value, no constructor
    is called for the contained type (that way, objects that do not have a default
    constructor can get a default state).


    As with std::variant<> and std::any, the resulting objects have value semantics.
    That is, copying is implemented as a deep copy that creates an independent object
    with the flag and the contained value (if there is one) in its own memory. Copying
    a std::optional<> without a contained value is cheap; copying a std::optional<>
    with a contained value is as cheap/expensive as copying the contained type/value.
    Move semantics is supported.


    # 15.1 Using std::optional<>


    std::optional<> models a nullable instance of an arbitrary type. The instance
    might be a member, an argument, or a return value.


    # 15.1.1 Optional Return Values


    The following program demonstrates some abilities of std::optional<> by using
    it as a return value:


    lib/optional.cpp


    ```

    #include <optional>

    #include <string>

    ```'
