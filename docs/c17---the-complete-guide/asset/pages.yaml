- pgno: 14
  md: '# Preface


    This book is an experiment in two ways:


    +   - I am writing an in-depth book covering language features without the direct
    help of a core language expert as a co-author. However, I can ask questions and
    I do.

    +   - I am publishing the book myself on Leanpub and for printing on demand. That
    is, this book was written step by step and I will publish new versions as soon
    as there is a significant improvement that makes the publication of a new version
    worthwhile.


    The good thing is:


    +   - You get the view of the language features from an experienced application
    programmer—somebody who feels the pain a feature might cause and asks the relevant
    questions to be able to motivate and explain the design and its consequences for
    programming in practice.

    +   - You can benefit from my experience with C++17 while I am still learning
    and writing.


    However, you are also part of the experiment. So help me out: give feedback about
    flaws, errors, features that are not explained well, or gaps so that we all can
    benefit from these improvements.


    # Versions of This Book


    Because this book is written incrementally, the following is the history of its
    “releases” (newest first):


    +   - **2019-12-20**: Various small fixes due to feedback by readers

    +   - **2019-09-06**: Proof reading fully done and processed

    +   - **2019-08-20**: Publication of a first printed version with several fixes
    and improvements due to feedback from readers and proof reading

    +   - **2019-08-11**: Description of guarantees to deal with signal handlers

    +   - **2019-08-10**: Description of compatibility to C11

    +   - **2019-07-07**: Description of removed and deprecated features

    +   - **2019-07-06**: String view improvements

    +   - **2019-07-04**: Description of all shared pointers improvements

    +   - **2019-06-28**: Various proofreading updates and minor fixes

    +   - **2019-05-31**: Description of chrono extensions, noexcept extensions, constexpr
    extensions'
  merge: -1
  img_proc: true
