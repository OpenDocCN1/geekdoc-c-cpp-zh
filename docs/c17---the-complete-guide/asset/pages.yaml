- pgno: 285
  md: "That is, we create a vector of elements that start with \"id\" or \"ID\" followed\
    \ by an integral number:\n\n```\nid0 ID0 id1 ID1 id2 ID2 id3 ... id99 ID99 id100\
    \ ID100 ...\n```\n\nAs usual, we can sort the elements sequentially as follows:\n\
    \n```\nsort(coll.begin(), coll.end());\n```\n\nThis can now be done by explicitly\
    \ passing a “sequential” execution policy:\n\n```\nsort(std::execution::seq,\n\
    \    coll.begin(), coll.end());\n```\n\nPassing sequential execution as a parameter\
    \ can be useful if the decision whether to run sequentially or in parallel is\
    \ taken at runtime and you do not want to have different function calls.\n\nRequesting\
    \ parallel sorting instead is easy:\n\n```\nsort(std::execution::par,\n    coll.begin(),\
    \ coll.end());\n```\n\nNote that there is also another parallel execution policy:\n\
    \n```\nsort(std::execution::par_unseq,\n    coll.begin(), coll.end());\n```\n\n\
    I will explain the difference later.\n\nSo again, the question is, (when) is using\
    \ parallel sorting better? On my laptop with only 10,000 strings, you could see\
    \ that the parallel sorting took half the time of sequential sorting. And even\
    \ sorting 1000 strings was slightly better with parallel execution.\n\n# Combining\
    \ with Other Improvements\n\nNote that further modifications might give you more\
    \ or additional benefits. For example, if we sort just by the numbers, using substrings\
    \ without the two leading characters, we could use string operations inside the\
    \ predicate and again see a two-fold improvement with parallel execution:\n\n\
    ```\nsort(std::execution::par,\n    coll.begin(), coll.end(),\n    [] (const auto&\
    \ a, const auto& b) {\n        return a.substr(2) < b.substr(2);\n    });\n```\n\
    \nHowever, substr() is a pretty expensive member function for strings because\
    \ it creates and returns a new temporary string. By using class string_view, we\
    \ see a three-fold improvement even with sequential execution:\n\n```\nsort(coll.begin(),\
    \ coll.end(),\n    [] (const auto& a, const auto& b) {\n        return std::string_view{a}.substr(2)\
    \ < std::string_view{b}.substr(2);\n    });\n```\n\nWe can easily combine using\
    \ parallel algorithms and string views:"
