  md: '```

    }

    ```


    ```

    };

    ```


    In C++11 and C++14, you have to pass this either by value or by reference:


    ```

    ```cpp

    class C {

    private:

    std::string name;

    public:

    ...

    void foo() {

    auto l1 = [this] { std::cout << name << ''\n''; }; // OK

    auto l2 = [] { std::cout << name << ''\n''; }; // OK

    auto l3 = [&] { std::cout << name << ''\n''; }; // OK

    ...

    }

    };

    ```

    ```


    However, the problem here is that even copying this captures the underlying object
    by reference (as only the pointer was copied). This can become a problem if the
    lifetime of the lambda exceeds the lifetime of the object upon which the member
    function is invoked. One critical example is when the lambda defines the task
    of a new thread which should use its own copy of the object to avoid any concurrency
    or lifetime issues. Another reason might simply be to pass a copy of the object
    with its current state.


    A workaround has been possible since C++14 but does not read and work well:


    ```

    ```cpp

    class C {

    private:

    std::string name;

    public:

    ...

    void foo() {

    auto l1 = [thisCopy=*this] { std::cout << thisCopy.name << ''\n''; };

    ...

    }

    };

    ```

    ```


    For example, programmers could still accidentally use this when also using = or
    & to capture other objects:


    ```

    ```cpp

    auto l1 = [&, thisCopy=*this] {

    thisCopy.name = "new";

    std::cout << name << ''\n''; // OOPS: still the old name

    };

    ```

    ```


    Since C++17, you can explicitly ask to capture a copy of the current object by
    capturing *this:


    ```

    ```cpp

    class C {

    private:

    std::string name;

    public:

    ...

    }

    ```

    ```'
