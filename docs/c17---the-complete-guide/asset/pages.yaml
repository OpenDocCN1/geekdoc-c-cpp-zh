- pgno: 160
  md: "# 15.2 std::optional<> Types and Operations\n\nThis section describes the types\
    \ and operations of std::optional<> in detail.\n\n# 15.2.1 std::optional<> Types\n\
    \nIn the header file <optional>, the C++ standard library defines class std::optional<>\
    \ as follows:\n\n```\nnamespace std {\n    template<typename T> class optional;\n\
    }\n```\n\nIn addition, the following types and objects are defined:\n\n+   - nullopt\
    \ of type std::nullopt_t as a “value” for optional objects that have no value.\n\
    +   - Exception class std::bad_optional_access, which is derived from std::exception,\
    \ for value access without a value.\n\nOptional objects also use the object std::in_place\
    \ (of type std::in_place_t) defined in <utility> to initialize the value of an\
    \ optional object with multiple arguments (see below).\n\n# 15.2.2 std::optional<>\
    \ Operations\n\nTable std::optional Operations lists all operations that are provided\
    \ for std::optional<> .\n\n| Operation | Effect |\n|---|---|\n| constructors |\
    \ Creates an optional object (might or might not call constructor for contained\
    \ type) |\n| make_optional<>() | Creates an optional object initialized by the\
    \ passed value(s) |\n| destructor | Destroys an optional object |\n| = | Assigns\
    \ a new value |\n| emplace() | Assigns a new value to the contained type |\n|\
    \ reset() | Destroys any value (makes the object empty) |\n| has_value() | Returns\
    \ whether the object has a value |\n| conversion to bool | Returns whether the\
    \ object has a value |\n| * | Value access (undefined behavior if no value) |\n\
    | -> | Access to member of the value (undefined behavior if no value) |\n| value()\
    \ | Value access (exception if no value) |\n| value_or() | Value access (fallback\
    \ argument if no value) |\n| swap() | Swaps values between two objects |\n| ==,\
    \ !=, <, <=, >, >= | Compares optional objects |\n| hash<> | Function object type\
    \ to compute hash values |\n\nTable 15.1. std::optional<> Operations"
