    \ auto& v) {\n            if constexpr(std::is_same_v<decltype(v),\n         \
    \       const std::string&>) {\n                std::cout << '\"' << v << \"\\\
    \" \";\n            }\n            else {\n                std::cout << v << '\
    \ ';\n            }\n        },\n        val);\n    }\n}\n```\n\nAgain, we define\
    \ our own type for objects that represent one of multiple possible types:\n\n\
    ```\nusing Var = std::variant<int, double, std::string>;\n```\n\nWe can also create\
    \ and initialize a heterogeneous collection with them:\n\n```\nstd::vector<Var>\
    \ values {42, 0.19, \"hello world\", 0.815};\n```\n\nNote that we can initialize\
    \ the vector with a heterogeneous collection of elements because they all convert\
    \ to the variant type. However, if we pass a long, the initialization would not\
    \ compile because the compiler would not know whether to convert it to int or\
    \ double.\n\nWhen we iterate over the elements, we use visitors to call functions\
    \ for them. Here, a generic lambda is used. The lambda instantiates the function\
    \ call operator for the three different types the alternatives might have. To\
    \ have different behavior for strings (putting quotes around their value), we\
    \ use a compile-time if:\n\n```\nfor (const Var& val : values) {\n    std::visit([]\
    \ (const auto& v) {\n        if constexpr(std::is_same_v<decltype(v),\n      \
    \      const std::string&>) {\n            std::cout << '\"' << v << \"\\\" \"\
    ;\n        }\n        else {\n            std::cout << v << ' ';\n        }\n\
