  md: "# Implementing Placement delete\n\nIf you have to write (generic) code, where\
    \ you have to use over-alignment in new calls and have no idea whether the types\
    \ have their own operator delete, you might want to implement your own placement\
    \ delete.⁶\n\nYou can simply implement a type trait that finds out whether an\
    \ operator delete is defined:\n\nlang/hasdelete.hpp\n\n```\n#include <type_traits>\
    \ // for true_type, false_type, and void_t\n\n// primary template:\ntemplate<typename,\
    \ typename = std::void_t<>>\nstruct HasDelete\n: std::false_type {\n};\n\n// partial\
    \ specialization (may be SFINAE'd away):\ntemplate<typename T>\nstruct HasDelete<T,\
    \ std::void_t<decltype(T::operator delete(nullptr))>>\n: std::true_type {\n};\n\
    ```\n\nHere, we use std::void_t<> to SFINAE away the specialization if the expression\
    \ calling the type-specific operator delete is not valid.\n\nBy using std::void_t<>,\
    \ we can define our own placement delete helper:\n\n```\ntemplate<typename TP,\
    \ typename... Args>\nvoid placementDelete(TP* tp, Args&&... args)\n{\n    // destruct\
    \ value:\n    tp->~TP();\n\n    // free memory using the right operator delete:\n\
    \    if constexpr(HasDelete<TP>::value) {\n        TP::operator delete(tp, std::forward<Args>(args)...);\n\
    \    }\n    else {\n        ::operator delete(tp, std::forward<Args>(args)...);\n\
    \    }\n}\n```\n\nand use this helper as follows:\n\n```\nstd::string* p1 = new(std::align_val_t{64})\
    \ std::string;   // 64-byte aligned\nMyType32* p2 = new(std::align_val_t{64})\
    \ MyType32{};       // 64-byte aligned\n```"
