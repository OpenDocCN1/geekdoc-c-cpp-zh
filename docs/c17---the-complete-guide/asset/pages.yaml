  md: "Variants simply have internal memory for the maximum size of the underlying\
    \ types plus a fixed overhead to manage which alternative is used. No heap memory\
    \ is allocated.\n\nIn general, variants cannot be empty unless you use a specific\
    \ alternative to signal emptiness. However, in very rare cases (such as due to\
    \ exceptions during the assignment of a new value of a different type), the variant\
    \ can come into a state that has no value at all.\n\nAs with std::optional<> and\
    \ std::any, the resulting objects have value semantics. That is, copying is implemented\
    \ as a deep copy that creates an independent object with the current value of\
    \ the current alternative in its own memory. However, copying a std::variant<>\
    \ is slightly more expensive than copying the type/value of the current alternative,\
    \ because the variant has to find out which value to copy. Move semantics is supported.\n\
    \n# 16.2 Using std::variant<>\n\nThe following example demonstrates the core abilities\
    \ of std::variant<>:\n\nlib/variant.cpp\n\n```\n#include <variant>\n#include <iostream>\n\
    \nint main()\n{\n    std::variant<int, std::string> var{\"hi\"};    // initialized\
    \ with string alternative\n    std::cout << var.index() << '\\n';            \
    \ // prints 1\n    var = 42;                                      // now holds\
    \ int alternative\n    std::cout << var.index() << '\\n';             // prints\
    \ 0\n    ...\n    try {\n        int i = std::get<0>(var);                  //\
    \ access by index\n        std::string s = std::get<std::string>(var); // access\
    \ by type (throws exception here)\n        ...\n    }\n    catch (const std::bad_variant_access&\
    \ e) {     // in case a wrong type/index is used\n        std::cerr << \"EXCEPTION:\
    \ \" << e.what() << '\\n';\n        ...\n    }\n}\n```\n\nThe member function\
    \ index() can be used to find out which alternative is currently set (the first\
    \ alternative has the index 0).\n\n2 This is different from Boost.Variant, where\
    \ memory had to be allocated to be able to recover from exceptions during value\
    \ changes."
