    Note that this is a problem only since C++11. Before C++11, using elements with\
    \ constant members was either not possible (std::vector) or not formally supported,\
    \ because elements had to be CopyConstructible and Assignable (although node-based\
    \ containers such as lists worked perfectly fine with elements with const members).\
    \ However, with C++11 introducing move semantics, elements with constant members\
    \ such as class X above are supported and cause this undefined behavior.\n\nstd::launder()\
    \ was introduced with the aim of solving these problems. However, as I will describe\
    \ below, it turned out that we cannot solve the vector problem with std::launder()\
    \ at all.\n\n# 32.2 How launder() Solves the Problem\n\nThe core working group\
    \ of the C++ standards committee decided to solve this problem by introducing\
    \ std::launder() as follows (see http://wg21.link/cwg1776): if you have a pointer\
    \ where access is undefined behavior because the underlying memory was replaced:\n\
    \n```\nstruct X {\n    const int n;\n    double d;\n};\nX* p = new X{7, 8.8};\n\
    new (p) X{42, 9.9};    // request to place a new value into p\nint i = p->n; \
    \         // undefined behavior (i is probably 7 or 42)\nauto d = p->d;      \
    \   // also undefined behavior (d is probably 8.8 or 9.9)\n```\n\nyou can call\
    \ std::launder() whenever a pointer is used to ensure that the underlying memory\
    \ is reevaluated:\n\n```\nint i = std::launder(p)->n;  // OK, i is 42\n```"
