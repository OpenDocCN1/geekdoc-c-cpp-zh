  md: "Consider the following example:\n\npmr/pmrnul.l.cpp\n\n```\n#include <iostream>\n\
    #include <string>\n#include <unordered_map>\n#include <array>\n#include <cstddef>\
    \  // for std::byte\n#include <memory_resource>\n\nint main()\n{\n    // use memory\
    \ on the stack without fallback on the heap:\n    std::array<std::byte, 200000>\
    \ buf;\n    std::pmr::monotonic_buffer_resource pool{buf.data(), buf.size(),\n\
    \                                            std::pmr::null_memory_resource()};\n\
    \n    // and allocate too much memory:\n    std::pmr::unordered_map<long, std::pmr::string>\
    \ coll {&pool};\n    try {\n        for (int i=0; i<buf.size(); ++i) {\n     \
    \       std::string s{\"Customer\" + std::to_string(i)};\n            coll.emplace(i,\
    \ s);\n        }\n    }\n    catch (const std::bad_alloc& e) {\n        std::cerr\
    \ << \"BAD ALLOC EXCEPTION: \" << e.what() << '\\n';\n    }\n    std::cout <<\
    \ \"size: \" << coll.size() << '\\n';\n}\n```\n\nWe allocate memory on the stack\
    \ and pass this to a monotonic buffer as a memory resource:\n\n```\nstd::array<std::byte,\
    \ 200000> buf;\nstd::pmr::monotonic_buffer_resource pool{buf.data(), buf.size(),\n\
    \                                        std::pmr::null_memory_resource()};\n\
    ```\n\nBy also passing null_memory_resource() as the fallback memory resource,\
    \ we ensure that any attempt to allocate more memory throws an exception instead\
    \ of allocating the memory on the heap.\n\nThe effect is that sooner or later\
    \ the program ends, for example, with the following output:\n\n```\nBAD ALLOC\
    \ EXCEPTION: bad allocation\nsize: 2048\n```\n\nWhen heap memory allocation is\
    \ not an option, this helps to get reasonable feedback instead of running into\
    \ behavior you have to avoid."
