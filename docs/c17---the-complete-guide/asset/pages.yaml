  md: "and\n\n```\nconstexpr auto squared2 = [](auto val) {  // compile-time initialization\n\
    \    return val*val;\n};\n```\n\nIf (only) the lambda is constexpr it can be used\
    \ at compile time, but squared1 might be initialized at run time, which means\
    \ that some problems might occur if the static initialization order matters (e.g.,\
    \ causing the static initialization order fiasco). If the (closure) object initialized\
    \ by the lambda is constexpr, the object is initialized when the program starts\
    \ but the lambda might still be a lambda that can only be used at run time (e.g.,\
    \ using static variables). Therefore, you might consider declaring:\n\n```\nconstexpr\
    \ auto squared = [](auto val) constexpr {\n    return val*val;\n};\n```\n\n# 6.1.1\
    \ Using constexpr Lambdas\n\nHere is an example using constexpr lambdas. Assume\
    \ we have a generic hash function for character sequences which is still parameterized\
    \ according to the way a hash value is combined with the next character value:²\n\
    \n```\nauto hashed = [](const char* str) {\n    std::size_t hash = 5381;     \
    \   // initial hash value\n    while (*str != '\\0') {\n        hash = hash *\
    \ 33 ^ *str++;  // combine hash value with next character\n    }\n    return hash;\n\
    };\n```\n\nWith that lambda, we can initialize enumeration values for different\
    \ strings at compile time:\n\n```\nenum Hashed { beer = hashed(\"beer\"),\n  \
    \              wine = hashed(\"wine\"),\n                water = hashed(\"water\"\
    ), ... };  // OK, compile-time hashing\n```\n\nWe can also compute case labels\
    \ at compile time:\n\n```\nswitch (hashed(argv[1])) {      // runtime hashing\n\
    \    case hashed(\"beer\"):         // OK, compile-time hashing\n        ...\n\
    \        break;\n    case hashed(\"wine\"):\n        ...\n        break;\n   \
    \ ...\n}\n```"
