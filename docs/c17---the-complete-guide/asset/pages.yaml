- pgno: 25
  md: "The benefit is direct access and the ability to make the code more readable\
    \ by binding the value directly to names that convey semantic meaning about their\
    \ purpose.¹\n\nThe following code demonstrates how code can improve significantly\
    \ with structured bindings. To iterate over the elements of a std::map<> without\
    \ structured bindings, you would have to program:\n\n```\nfor (const auto& elem\
    \ : mymap) {\n    std::cout << elem.first << \": \" << elem.second << '\\n';\n\
    }\n```\n\nThe elements are std::pairs of the key and value type, and as the members\
    \ of a std::pair are first and second, you have to use these names to access the\
    \ key and the value. By using structured bindings, the code becomes a lot more\
    \ readable:\n\n```\nfor (const auto& [key,val] : mymap) {\n    std::cout << key\
    \ << \": \" << val << '\\n';\n}\n```\n\nWe can use the key and value member of\
    \ each element directly, using names that clearly demonstrate their semantic meaning.\n\
    \n# 1.1 Structured Bindings in Detail\n\nIn order to understand structured bindings,\
    \ it is important to be aware that there is a hidden anonymous variable involved.\
    \ The new names introduced as structured bindings refer to members/elements of\
    \ this anonymous variable.\n\n# Binding to an Anonymous Entity\n\nThe exact behavior\
    \ of an initialization\n\n```\nauto [u,v] = ms;\n```\n\nis as if we had initialized\
    \ a new entity e with ms and let the structured bindings u and v become alias\
    \ names for the members of this new object, similar to defining:\n\n```\nauto\
    \ e = ms;\naliasname u = e.i;\naliasname v = e.s;\n```\n\nThis means that u and\
    \ v are just other names for the members of a local copy of ms. However, we do\
    \ not have a name for e, which means that we cannot access the initialized entity\
    \ directly by name. Note that u and v are not references to e.i and e.s respectively.\
    \ decltype(u) is the type of the member i and decltype(v) is the type of the member\
    \ s.\n\nAs a result,\n\n```\nstd::cout << u << ' ' << v << '\\n';\n```\n\nprints\
    \ the values of e.i and e.s, which are copies of ms.i and ms.s.\n\n> ¹ Thanks\
    \ to Zachary Turner for pointing that out."
  merge: -1
  img_proc: true
- pgno: 26
  md: 'e exists as long as the structured bindings to it exist. Thus, it is destroyed
    when the structured bindings go out of scope.


    As a consequence, unless references are used, modifying the value used for initialization
    has no effect on the names initialized by a structured binding (and vice versa):


    ```

    MyStruct ms{42,"hello"};

    auto [u,v] = ms;

    ms.i = 77;

    std::cout << u;      // prints 42

    u = 99;

    std::cout << ms.i;   // prints 77

    ```


    u and ms.i also have different addresses.


    When using structured bindings for return values, the same principle applies.
    An initialization such as


    ```

    auto [u,v] = getStruct();

    ```


    behaves as if we had initialized a new entity e with the return value of getStruct()
    so that the structured bindings u and v become alias names for the two members/elements
    of e, similar to defining:


    ```

    auto e = getStruct();

    aliasname u = e.i;

    aliasname v = e.s;

    ```


    That is, structured bindings bind to a new entity, which is initialized from a
    return value, instead of binding to the return value directly.


    To the type of the anonymous entity e the usual layout guarantees apply. Structured
    bindings are aligned as the corresponding members they bind to.


    # Using Qualifiers


    We can use qualifiers, such as const and references. Again, these qualifiers apply
    to the anonymous entity e as a whole. Usually, the effect is similar to applying
    the qualifiers to the structured bindings directly, but beware that this is not
    always the case (see below).


    For example, we can declare structured bindings to a const reference:


    ```

    const auto& [u,v] = ms;   // a reference, so that u/v refer to ms.i/ms.s

    ```


    Here, the anonymous entity is declared as a const reference, which means that
    u and v are the names of the members i and s of the initialized const reference
    to ms. As a consequence, any change to the members of ms affect the value of u
    and/or v.


    ```

    ms.i = 77;               // affects the value of u

    std::cout << u;           // prints 77

    ```


    Declared as a non-const reference, you can even modify the members of the object/value
    used for initialization:


    ```

    MyStruct ms{42,"hello"};

    auto& [u,v] = ms;         // the initialized entity is a reference to ms

    ms.i = 77;                // affects the value of u

    std::cout << u;           // prints 77

    ```'
