  md: "```\nauto pos = m.find(42);\nif (pos == m.end()) {\n    m.insert({42, std::move(t1)});\
    \    // insert\n}\nelse {\n    pos->second = std::move(t1);      // update\n}\n\
    ```\n\nwhich is similar to\n\n```\nm[42] = std::move(t1);            // same with\
    \ value initialization first\n```\n\nwith the benefit that the position of a new\
    \ element is looked up only once and the value of a new element is not first initialized\
    \ with its default value and then overwritten.\n\nThus, this member function also\
    \ allows us to insert or update an element when no default constructor can be\
    \ called.\n\nNote that insert_or_assign() takes key and value as separate arguments,\
    \ while insert() takes them as one. Also, an additional first parameter can be\
    \ passed as a hint to where the new element should be looked up:\n\n```\nstd::map<int,\
    \ std::string> m;\n...\nstd::string s1{\"s1\"};\nm.insert({42, std::move(s1)});\n\
    ```\n\n```\nstd::string s2{\"s2\"};\nauto pos = m.insert_or_assign(42, std::move(s2));\n\
    ```\n\n```\nstd::string s3{\"s3\"};\nm.insert_or_assign(pos, 42, std::move(s3));\n\
    ```\n\n# 26.3 Container Support for Incomplete Types\n\nSince C++17, std::vector,\
    \ std::list, and std::forward_list are required to support incomplete types.\n\
    \nThe main motivation for this is described in an article by Matt Austern, entitled\
    \ The Standard Librarian: Containers of Incomplete Types:¹ you can now have a\
    \ type, which recursively has a member of a container of its type. For example:\n\
    \n```\nstruct Node\n{\n    std::string value;\n    std::vector<Node> children;\
    \  // OK since C++17 (Node is an incomplete type here)\n};\n```"
