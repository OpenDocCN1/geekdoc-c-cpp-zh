  md: '| Operation | Effect |

    |---|---|

    | *constructors* | Creates or copies a string view |

    | *destructor* | Destroys a string view |

    | `=` | Assigns a new value |

    | `swap()` | Swaps values between two strings views |

    | `==, !=, <, <=, >, >=, compare()` | Compares string views |

    | `empty()` | Returns whether the string view is empty |

    | `size(), length()` | Returns the number of characters |

    | `max_size()` | Returns the maximum possible number of characters |

    | `[], at()` | Accesses a character (read-only) |

    | `front(), back()` | Accesses the first or last character (read-only) |

    | `<<` | Writes the value to a stream |

    | `copy()` | Copies or writes the contents to a character array |

    | `data()` | Returns the value as nullptr or constant character array (note: no
    terminating null character) |

    | *find functions* | Searches for a certain substring or character |

    | `begin(), end()` | Provides iterator support (const_iterator only) |

    | `cbegin(), cend()` | Provides constant iterator support |

    | `rbegin(), rend()` | Provides constant reverse iterator support |

    | `crbegin(), crend()` | Provides constant reverse iterator support |

    | `substr()` | Returns a certain substring |

    | `remove_prefix()` | Removes leading characters |

    | `remove_suffix()` | Removes trailing characters |

    | `hash<>` | Function object type to compute hash values |


    Table 19.1. String View Operations


    # Construction


    You can create a string view with the default constructor, as a copy, from a raw
    character array (null terminated or with specified length), from a std::string,
    or as a literal with the suffix sv. However, note the following:


    +   - String views created with the default constructor have nullptr as data().
    Thus, there is no valid call of operator[].

    +     ```

    +     std::string_view sv;

    +     auto p = sv.data();        // yields nullptr

    +     std::cout << sv[0];       // ERROR: no valid character

    +     ```

    +   - When initializing a string view with a null terminated byte stream, the
    resulting size is the number of characters without ''\0'' and using the index
    of the terminating null character is not valid:

    +     ```

    +     std::string_view sv{"hello"};

    +     std::cout << sv;          // OK

    +     std::cout << sv.size();   // 5

    +     ```'
