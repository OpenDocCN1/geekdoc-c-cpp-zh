  md: "```\n#include \"structbind1.hpp\"\n#include <iostream>\n\nint main()\n{\n \
    \   Customer c{\"Tim\", \"Starr\", 42};\n\n    auto [f, l, v] = c;\n\n    std::cout\
    \ << \"f/l/v:    \" << f << ' ' << l << ' ' << v << '\\n';\n\n    // modify structured\
    \ bindings:\n    std::string s{std::move(f)};\n    l = \"Waters\";\n    v += 10;\n\
    \    std::cout << \"f/l/v:    \" << f << ' ' << l << ' ' << v << '\\n';\n    std::cout\
    \ << \"c:        \" << c.getFirst() << ' '\n              << c.getLast() << '\
    \ ' << c.getValue() << '\\n';\n    std::cout << \"s:        \" << s << '\\n';\n\
    }\n```\n\nWith the initialization:\n\n```\nauto [f,l,v] = c;\n```\n\nas usual,\
    \ the Customer c is copied to a hidden anonymous entity. This entity is destroyed\
    \ when the structured bindings go out of scope.\n\nIn addition, for each structured\
    \ binding f, l, and v, its get<>() function is called, calling the corresponding\
    \ getters of type Customer. Because get<>() has return type auto, the getters\
    \ return copies of the members, which means that the addresses of the structured\
    \ bindings differ from the address of the created copy of c. Thus, after the initialization\
    \ of the structured bindings, modifying c has no effect for them (and vice versa).\n\
    \nUsing the structured bindings is then equivalent to using the values returned\
    \ by get<>(). Thus:\n\n```\nstd::cout << \"f/l/v:    \" << f << ' ' << l << '\
    \ ' << v << '\\n';\n```\n\nsimply outputs the values (without calling the getters\
    \ (again)). And\n\n```\nstd::string s{std::move(f)};\nl = \"Waters\";\nv += 10;\n\
    std::cout << \"f/l/v:    \" << f << ' ' << l << ' ' << v << '\\n';\n```\n\nmodifies\
    \ the structured bindings as initialized std::strings and long.\n\nTherefore,\
    \ the program usually has the following output:\n\n```\nf/l/v:      Tim Starr\
    \ 42\nf/l/v:      Waters 52\n```"
