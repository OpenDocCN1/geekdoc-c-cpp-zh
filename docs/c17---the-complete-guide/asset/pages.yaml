  md: '# 34.3 Dealing with Signal Handlers


    As a side effect of becoming compatible to C11, C++17 clarifies which calls and
    functionality are possible in signal handlers.


    C++17 introduces the term *signal-safe* evaluation. According to its definition,
    the following is not allowed in signal handlers:


    +   - Calling any standard library function (unless explicitly specified as signal-safe)

    +   - Calling new or delete (unless a safe memory allocator is used)

    +   - Using objects that are thread_local

    +   - Using dynamic_cast

    +   - Throwing an exception or entering a try block

    +   - Performing or waiting for the first initialization of a variable with static
    storage duration


    The following functions are signal-safe and can be called:


    +   - abort() and _Exit()

    +   - quick_exit(), if the functions registered with at_quick_exit() are signal-safe

    +   - memcpy() and memmove()

    +   - All member functions of std::numeric_limits<

    +   - All functions for std::initializer_lists

    +   - All type traits


    # 34.4 Forward Progress Guarantees


    C++17 clarifies what it means for a program to “make progress” or “block.”


    See http://wg21.link/p0072r1 for a motivating discussion of this topic.


    # 34.5 Afternotes


    C++17 referring to C11 instead of C99 was first proposed by Hans-J. Boehm and
    Clark Nelson in http://wg21.link/p0063r0 (based on a paper by Thomas Plum that
    analyzed the situation in http://wg21.link/n3631). The finally accepted wording
    for this feature was formulated by Clark Nelson and Hans-J. Boehm in http://wg21.link/p0063r3.


    The clarification of dealing with signal handlers was first proposed by Hans-J.
    Boehm in http://wg21.link/p0270r0. The finally accepted wording for this feature
    was formulated by Hans-J. Boehm in http://wg21.link/p0270r3.


    Forward progress guarantees were accepted as proposed by Torvald Riegel in http://wg21.link/p0296r2.'
