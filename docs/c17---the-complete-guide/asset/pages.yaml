  md: "Another application of the new expression evaluation order is the function\
    \ that inserts a space before passed arguments.\n\n# Backward Incompatibilities\n\
    \nThe new guaranteed evaluation order might impact the output of existing programs.\
    \ This is not just theory. Consider, for example, the following program:\n\nlang/evalexcept.cpp\n\
    \n```\n#include <iostream>\n#include <vector>\n\nvoid print10elems(const std::vector<int>&\
    \ v) {\n    for (int i=0; i<10; ++i) {\n        std::cout << \"value: \" << v.at(i)\
    \ << '\\n';\n    }\n}\n\nint main()\n{\n    try {\n        std::vector<int> vec{7,\
    \ 14, 21, 28};\n        print10elems(vec);\n    }\n    catch (const std::exception&\
    \ e) {    // handle standard exception\n        std::cerr << \"EXCEPTION: \" <<\
    \ e.what() << '\\n';\n    }\n    catch (...) {                        // handle\
    \ any other exception\n        std::cerr << \"EXCEPTION of unknown type\\n\";\n\
    \    }\n}\n```\n\nBecause the vector<> in this program has only four elements,\
    \ the program throws an exception in the loop in print10elems() when calling at()\
    \ as part of an output statement for an invalid index:\n\n```\nstd::cout << \"\
    value: \" << v.at(i) << \"\\n\";\n```\n\nBefore C++17, the output could be:\n\n\
    ```\nvalue: 7\nvalue: 14\nvalue: 21\nvalue: 28\nEXCEPTION: ...\n```"
