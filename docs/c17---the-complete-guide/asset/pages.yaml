    # 13.2 Using auto as Variable Template Parameter


    You can also use auto as template parameters with variable templates.² For example,
    the following declaration, which might occur in a header file, defines a variable
    template arr parameterized for the type of elements and both the type and value
    of the number of elements:


    ```

    template<typename T, auto N> std::array<T,N> arr;

    ```


    In each translation unit, all uses of arr<int,10> share the same global object,
    while arr<long,10> and arr<int,10u> would be different global objects (again,
    both can be used in all translation units).


    As a full example, consider the following header file:


    tmp/var tmpl auto.hpp


    ```

    #ifndef VARTMPLAUTO_HPP

    #define VARTMPLAUTO_HPP


    #include <array>

    ```


    > ² Do not confuse variable templates, which are templified variables, with variadic
    templates, which are templates that have an arbitrary number of parameters.'
