  md: "# 23.2 New Numeric STL Algorithms\n\nThis section lists the new STL algorithms\
    \ defined in the header file <numeric>. Note that the motivation of these new\
    \ algorithms was discussed before.\n\n# 23.2.1 std::reduce()\n\n```\ntypename\
    \ iterator_traits<InputIterator>::value_type\nreduce (ExecutionPolicy&& pol, \
    \ // optional\n        InputIterator beg, InputIterator end)\n\nT\nreduce (ExecutionPolicy&&\
    \ pol,  // optional\n        InputIterator beg, InputIterator end,\n        T\
    \ initVal)\n\nT\nreduce (ExecutionPolicy&& pol,  // optional\n        InputIterator\
    \ beg, InputIterator end,\n        T initVal,\n        BinaryOp op)\n```\n\n+\
    \   - The first two forms compute and return the sum of all elements in the range\
    \ [beg,end) with an initial value. Thus, after the initialization:\n+     result\
    \ = initialValue\n+     the following is called for each element:\n+     result\
    \ = result + elem\n+   - For the first form, the initial value is the “value-initialized\
    \ default value” of the element types (default constructed value or equivalent\
    \ value for 0, 0.0, false, nullptr).\n+   - For the second form, the initial value\
    \ is initVal."
  merge: -1
  img_proc: true
- pgno: 303
  md: "+   - Thus, for the values\n+     a1 a2 a3 a4 ...\n+     the forms compute\
    \ and return:\n+     initVal + a1 + a2 + a3 + ...\n\n+   - The third form computes\
    \ and returns the result of calling op for initVal and all elements in the range\
    \ [beg,end). In particular, it calls the following for each element:\n+     result\
    \ = op(result, elem)\n+     Thus, for the values\n+     a1 a2 a3 a4 ...\n+   \
    \  the form computes and returns:\n+     initVal op a1 op a2 op a3 op ...\n\n\
    +   - If the range is empty (beg==end), all forms return the initial value.\n\n\
    +   - op must not modify the passed arguments.\n\n+   - Complexity: linear (numElems\
    \ calls of operator + or op(), respectively).\n\n+   - The algorithm is the parallel\
    \ version of std::accumulate() called for associative operations. If the first\
    \ optional execution policy is passed:\n+     - There is no guaranteed order for\
    \ using the operator op, which means that op must be commutative and associative.\n\
    +     - It is up to the caller to ensure that parallel calls of the operations\
    \ do not result in a data race.\n+     - The iterators must be forward iterators.\n\
    \nFor example, the following program:\n\nlib/reduce.cpp\n\n```\n#include <array>\n\
    #include <iostream>\n#include <numeric>\n\nint main()\n{\n    std::array coll{3,\
    \ 1, 7, 5, 4, 1, 6, 3};\n\n    // process sum of elements\n    std::cout << \"\
    sum: \"\n              << std::reduce(coll.cbegin(), coll.cend())  // range\n\
    \              << '\\n';\n\n    // process sum of elements with initial value:\n\
    \    std::cout << \"sum: \"\n              << std::reduce(coll.cbegin(), coll.cend(),\
    \  // range\n                             0)                           // initial\
    \ value\n              << '\\n';\n```"
