  md: "```\nauto x1 = make_vector(v, v);  //vector<vector<int>>\nauto x2 = make_vector(v);\
    \      //vector<int> or vector<vector<int>> ?\n```\n\nCurrently, different compilers\
    \ handle this differently and the issue is under discussion.\n\n# 9.1.2 Deducing\
    \ the Type of Lambdas\n\nWith class template argument deduction, we can instantiate\
    \ class templates with the type of a lambda (to be precise: the closure type of\
    \ a lambda). For example, we could provide a generic class that wraps and counts\
    \ calls of an arbitrary callback:\n\ntmpl/classarglambda.hpp\n\n```\n#include\
    \ <utility>      //for std::forward()\n\ntemplate<typename CB>\nclass CountCalls\n\
    {\nprivate:\n    CB callback;        //callback to call\n    long calls = 0; \
    \    //counter for calls\npublic:\n    CountCalls(CB cb) : callback(cb) {\n  \
    \  }\n    template<typename... Args>\n    decltype(auto) operator() (Args&&...\
    \ args) {\n        ++calls;\n        return callback(std::forward<Args>(args)...);\n\
    \    }\n    long count() const {\n        return calls;\n    }\n};\n```\n\nHere,\
    \ the constructor, taking the callback to wrap, enables the deduction of its type\
    \ as the template parameter CB. For example, we can initialize an object passing\
    \ a lambda as an argument:\n\n```\nCountCalls sc[]{[](auto x, auto y) {\n    \
    \    return x > y;\n    }};\n```\n\nwhich means that the type of the sorting criterion\
    \ sc is deduced as CountCalls<TypeOfTheLambda>. This way, we can count the number\
    \ of calls for a passed sorting criterion:\n\n```\nstd::sort(v.begin(), v.end(),\
    \  //range\n          std::ref(sc));        //sorting criterion\nstd::cout <<\
    \ \"sorted with \" << sc.count() << \" calls\\n\";\n```"
