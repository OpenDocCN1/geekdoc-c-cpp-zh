- pgno: 66
  md: "An xvalue is then considered a special location, representing an object whose\
    \ resources can be reused (usually because the object is near the end of its lifetime).\n\
    \nC++17 then introduces a new term, called materialization (of a temporary), for\
    \ the moment a prvalue becomes a temporary object. Thus, a temporary materialization\
    \ conversion is a prvalue-to-xvalue conversion.\n\nAny time a prvalue validly\
    \ appears where a glvalue (lvalue or xvalue) is expected, a temporary object is\
    \ created and initialized with the prvalue (remember that prvalues are primarily\
    \ “initializing values”), and the prvalue is replaced by an xvalue designating\
    \ the temporary. So in the example above, strictly speaking, we have:\n\n```\n\
    void f(const X& p);  // accepts an expression of any value category,\n       \
    \              // but expects a glvalue\n\nf(X());              // passes a prvalue\
    \ materialized as xvalue\n```\n\nBecause f() in this example has a reference parameter,\
    \ it expects a glvalue argument. However, the expression X() is a prvalue. The\
    \ “temporary materialization” rule therefore kicks in, and the expression X()\
    \ is “converted” into an xvalue designating a temporary object initialized with\
    \ the default constructor.\n\nNote that materialization does not mean that we\
    \ create a new/different object. The lvalue reference p still binds to both an\
    \ xvalue and a prvalue, although the latter now always involves a conversion to\
    \ an xvalue.\n\nWith this modification (that prvalues are no longer objects but\
    \ are instead expressions that can be used to initialize objects), the required\
    \ copy elision makes perfect sense because the prvalues no longer need to be movable\
    \ in order to initialize a variable using assignment syntax. We simply pass an\
    \ initial value around that, sooner or later, is materialized to initialize an\
    \ object.\n\n# 5.4 Unmaterialized Return Value Passing\n\nUnmaterialized return\
    \ value passing applies to all forms of returning a temporary object (prvalue)\
    \ by value:\n\n+   - When we return a literal that is not a string literal:\n\
    +   ```\n+   int f1() {  // return int by value\n+       return 42;\n+   }\n+\
    \   ```\n+   - When we return a temporary object by its type or auto:\n+   ```\n\
    +   auto f2() {  // return deduced type by value\n+       ...\n+       return\
    \ MyType{...};\n+   }\n+   ```\n+   - When we return a temporary object by decltype(auto):\n\
    +   ```\n+   decltype(auto) f3() {  // return temporary from return statement\
    \ by value\n+       ...\n+       return MyType{...};\n+   }\n+   ```"
  merge: -1
