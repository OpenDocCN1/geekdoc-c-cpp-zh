  md: "As a consequence of the corresponding wording in the standard, we have to ensure\
    \ that the return value of placement new is always used with each access to the\
    \ memory if the objects there have constant or reference members:\n\n```\nstruct\
    \ X {\n    const int n;\n    double d;\n};\nX* p = new X{7, 8.8};\np = new (p)\
    \ X{42, 9.9};  // Note: assign return value of placement new to p\nint i = p->n;\
    \           // OK, i is guaranteed to be 42\nauto d = p->d;          // OK, d\
    \ is guaranteed to be 9.9\n```\n\nUnfortunately, this rule is not widely known\
    \ and used. Even worse, in practice, you cannot always easily use the return value\
    \ of placement new. You might need additional objects, and the current allocator\
    \ interface does not support this.\n\nOne example where using the return value\
    \ causes overhead is when the storage is an existing member.\n\nThat would be\
    \ the case for std::optional and std::variant.\n\nHere is a simplified example\
    \ of implementing something like std::optional:\n\n```\ntemplate<typename T>\n\
    class optional\n{\nprivate:\n    T payload;\npublic:\n    optional(const T& t)\n\
    \    : payload(t) {}\n\n    template<typename... Args>\n    void emplace(Args&&...\
    \ args) {\n        payload.~T();\n        ::new (&payload) T(std::forward<Args>(args)...);\
    \ // *\n    }\n\n    const T& operator*() const & {\n        return payload; \
    \ // OOPS: returns payload not reinitialized\n    }\n};\n```\n\nIf here, T is\
    \ a structure with constant or reference members:\n\n```\nstruct X {\n    const\
    \ int _i;\n    X(int i) : _i(i) {}\n}\nfriend std::ostream& operator<< (std::ostream&\
    \ os, const X& x) {\n    return os << x._i;\n```"
