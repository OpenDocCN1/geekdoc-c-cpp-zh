  md: "# # Chapter 9\n\n# ## Class Template Argument Deduction\n\nBefore C++17, you\
    \ always had to explicitly specify all template arguments for class templates.\
    \ For example, you cannot omit the double here:\n\nstd::complex<double> c{5.1,3.3};\n\
    or omit the need to specify std::mutex here a second time:\n\nstd::mutex mx;\n\
    std::lock_guard<std::mutex> lg(mx);\n\nSince C++17, the constraint of always having\
    \ to specify the template arguments explicitly has been relaxed. By using class\
    \ template argument deduction (CTAD), you can omit explicit definition of the\
    \ template arguments if the constructor is able to deduce all template parameters.\n\
    \nFor example:\n\n+   - You can now declare:\n+   \n+   std::complex c{5.1,3.3};\
    \ // OK: std::complex<double> deduced\n\n+   - You can now implement:\n+   \n\
    +   std::mutex mx;\n+   std::lock_guard lg{mx}; // OK: std::lock_guard<std::mutex>\
    \ deduced\n\n+   - You can even let containers deduce element types:\n+   \n+\
    \   std::vector v1 { 1, 2, 3 } // OK: std::vector<int> deduced\n+   \n+   std::vector\
