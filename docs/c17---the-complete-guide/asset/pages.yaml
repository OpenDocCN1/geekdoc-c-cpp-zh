  md: "```\nstruct std::tuple_element<2, Customer> {\n    using type = long;     \
    \       // last attribute is a long\n};\ntemplate<std::size_t Idx>\nstruct std::tuple_element<Idx,\
    \ Customer> {\n    using type = std::string;     // the other attributes are strings\n\
    };\n```\n\nThe type of the third attribute is long, specified as a full specialization\
    \ for index 2. The other attributes have type std::string specified as a partial\
    \ specialization (which has a lower priority than the full specialization). The\
    \ types specified here are the types decltype yields for the structured bindings.\n\
    \nFinally, we define the corresponding getters as overloads of a function get<>()\
    \ in the same namespace as type Customer:\n\n```\ntemplate<std::size_t> auto get(const\
    \ Customer& c);\ntemplate<> auto get<0>(const Customer& c) { return c.getFirst();\
    \ }\ntemplate<> auto get<1>(const Customer& c) { return c.getLast(); }\ntemplate<>\
    \ auto get<2>(const Customer& c) { return c.getValue(); }\n```\n\nIn this case,\
    \ we have a primary function template declaration and full specializations for\
    \ all cases.\n\nNote that all full specializations of function templates have\
    \ to use the same signature (including the exact same return type). This is because\
    \ we provide only specific “implementations,” no new declarations. The following\
    \ will not compile:\n\n```\ntemplate<std::size_t> auto get(const Customer& c);\n\
    template<> std::string get<0>(const Customer& c) { return c.getFirst(); }\ntemplate<>\
    \ std::string get<1>(const Customer& c) { return c.getLast(); }\ntemplate<> long\
    \ get<2>(const Customer& c) { return c.getValue(); }\n```\n\nBy using the new\
    \ compile-time if feature, we can combine the get<>() implementations into one\
    \ function:\n\n```\ntemplate<std::size_t I> auto get(const Customer& c) {\n  \
    \  static_assert(I < 3);\n    if constexpr (I == 0) {\n        return c.getFirst();\n\
    \    }\n    else if constexpr (I == 1) {\n        return c.getLast();\n    }\n\
    \    else { // I == 2\n        return c.getValue();\n    }\n}\n```\n\nWith this\
    \ API, we can use structured bindings for objects of type Customer as follows:\n\
    lang/structbind1.cpp"
