  md: 'The lambda takes a copy of *this, which means that a copy of d is passed. Therefore,
    it is no problem that the thread probably uses the passed object after the destructor
    of d was called.


    If we have captured this with [this], [=], or [&], the thread would run into undefined
    behavior, because when printing the name in the lambda passed to the thread, the
    lambda would use a member of a destroyed object.


    # 6.3 Capturing by const Reference


    Using a new library utility, you can now also capture objects by const reference.


    # 6.4 Afternotes


    constexpr lambdas were first proposed by Faisal Vali, Ville Voutilainen, and Gabriel
    Dos Reis in http://wg21.link/n4487. The finally accepted wording was formulated
    by Faisal Vali, Jens Maurer, and Richard Smith in http://wg21.link/p0170r1.


    Capturing *this in lambdas was first proposed by H. Carter Edwards, Christian
    Trott, Hal Finkel Jim Reus, Robin Maffeo, and Ben Sander in http://wg21.link/p0018r0.
    The finally accepted wording was formulated by H. Carter Edwards, Daveed Vandevoorde,
    Christian Trott, Hal Finkel, Jim Reus, Robin Maffeo, and Ben Sander in http://wg21.link/p0180r3.'
