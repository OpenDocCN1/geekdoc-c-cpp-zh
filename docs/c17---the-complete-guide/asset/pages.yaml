- pgno: 161
  md: "# Construction\n\nSpecial constructors enable you to pass the arguments directly\
    \ to the contained type.\n\n+   - You can create an optional object that does\
    \ not have a value. In that case, you have to specify the contained type:\n+ \
    \    ```\n+     std::optional<int> o1;\n+     std::optional<int> o2(std::nullopt);\n\
    +     ```\n+     This does not call any constructor for the contained type.\n\n\
    +   - You can pass a value to initialize the contained type. Due to a deduction\
    \ guide, you do not have to specify the contained type:\n+     ```\n+     std::optional\
    \ o3{42};      // deduces optional<int>\n+     std::optional o4{\"hello\"}; //\
    \ deduces optional<const char*>\n+     using namespace std::string_literals;\n\
    +     std::optional o5{\"hello\"s}; // deduces optional<string>\n+     ```\n\n\
    +   - To initialize an optional object with multiple arguments, you have to pass\
    \ an existing object or add std::in_place as the first argument (the contained\
    \ type cannot be deduced):\n+     ```\n+     std::optional o6{std::complex{3.0,\
    \ 4.0}};\n+     std::optional<std::complex<double>> o7{std::in_place, 3.0, 4.0};\n\
    +     ```\n+     Note that the latter form avoids the creation of a temporary\
    \ object. By using this form, you can even pass an initializer list plus additional\
    \ arguments:\n+     ```\n+     // initialize set with lambda as sorting criterion:\n\
    +     auto sc = [] (int x, int y) {\n+         return std::abs(x) < std::abs(y);\n\
    +     };\n+     std::optional<std::set<int,decltype(sc)>> o8{std::in_place,\n\
    +         {4, 8, -7, -2, 0, 5},\n+         sc};\n+     ```\n\nHowever, this works\
    \ only if all initial values match the element type of the container exactly.\
    \ Otherwise, you have to explicitly pass a std::initializer_list<>:\n```\n// initialize\
    \ set with lambda as sorting criterion:\nauto sc = [] (int x, int y) {\n    return\
    \ std::abs(x) < std::abs(y);\n};\nstd::optional<std::set<int,decltype(sc)>> o8{std::in_place,\n\
    \    std::initializer_list<int>{4, 5L},\n    sc};\n```\n\n+   - You can copy optional\
    \ objects (including type conversions) provided their underlying type supports\
    \ copying:\n+     ```\n+     std::optional o9{\"hello\"};      // deduces optional<const\
    \ char*>\n+     std::optional<std::string> o10{o9}; // OK\n+     ```"
