  md: "```\n// \"inherit\" all function call operators of passed base types:\ntemplate<typename...\
    \ Ts>\nstruct overload : Ts...\n{\n    using Ts::operator()...;\n};\n\n// base\
    \ types are deduced from passed arguments:\ntemplate<typename... Ts>\noverload(Ts...)\
    \ -> overload<Ts...>; \n```\n\nYou can use overload to visit a variant by providing\
    \ lambdas for each alternative:\n\n```\nstd::variant<int, std::string> var(42);\n\
    ...\nstd::visit(overload{    // calls best matching lambda for current alternative\n\
    \    [](int i) { std::cout << \"int: \" << i << '\\n'; },\n    [](const std::string&\
    \ s) {\n        std::cout << \"string: \" << s << '\\n'; },\n},\n    var);\n```\n\
    \nYou can also use generic lambdas. It is always the best match that is used.\
    \ For example, to modify the current alternative of a variant, you can use the\
    \ overload to “double” the value for strings and other types:\n\n```\nauto twice\
    \ = overload{\n    [](std::string& s) { s += s; },\n    [](auto& i) { i *= 2;\
    \ },\n};\n```\n\nWith this overload, for string alternatives, the current value\
    \ is appended, while for all other types, the value is multiplied by 2, which\
    \ demonstrates the following application for a variant:\n\n```\nstd::variant<int,\
    \ std::string> var(42);\nstd::visit(twice, var);  // value 42 becomes 84\n...\n\
    var = \"hi\";\nstd::visit(twice, var);  // value \"hi\" becomes \"hihi\"\n```\n\
    \n# 16.3.4 Valueless by Exception\n\nWhen you modify a variant so that it gets\
    \ a new value and this modification throws an exception, the variant can get into\
    \ a very special state: the variant has already lost its old but has not received\
    \ its new value. For example:\n\n```\nstruct S {\n    operator int() { throw \"\
    EXCEPTION\"; }  // any conversion to int throws\n};\n```"
