- pgno: 349
  md: 'Therefore, when using a Request, leaving the scope would either commit() or
    rollback() depending on whether or not an exception was thrown:


    ```

    ```cpp

    Request r1{...}; // usually destructor calls commit()

    ...

    if (...) {

    throw ...; // let destructor call rollback()

    }

    ...

    } // calls commit() in the good case and rollback() on exception

    ```

    ```


    However, this API did not work for the following use case: if we create a new
    use Request object while we are already handling an exception, the request would
    always rollback() even if no (further) exception occurs during its use:


    ```

    ```cpp

    try {

    ...

    }

    catch (...) {

    Request r2{...};

    ...

    } // calls rollback() even if without any additional exception in the catch clause

    ```

    ```


    The new standard library function uncaught_exceptions() (note the additional s
    at the end of the name) solves this problem. Instead of returning whether we are
    handling an exception, it returns how many (nested) exceptions are currently unhandled.
    This allows us to find out whether (even while handling an exception) an additional
    exception was raised.


    ```

    ```cpp

    class Request {

    private:

    ...

    int initialUncaught{std::uncaught_exceptions()};

    public:

    ...

    ~Request() {

    if (std::uncaught_exceptions() > initialUncaught) {

    rollback();

    }

    else {

    commit();

    }

    }

    };

    ```

    ```


    Now both example scenarios work fine:


    ```

    ```cpp

    try {

    Request r1{...}; // usually destructor calls commit()

    ...

    }

    ```

    ```'
