  md: "+   - The value returned by data() can be nullptr. For example, nullptr is\
    \ returned after initializing a string view with the default constructor.\n+ \
    \  - There is no allocator support.\n\nDue to the possible nullptr value and possible\
    \ missing null terminator, you should always use size() before accessing characters\
    \ via operator [] or data() (unless you know better).\n\n# 19.2 Using String Views\n\
    \nThere are two major applications of string views:\n\n+   1. You might have allocated\
    \ or mapped data with character sequences or strings and want to use this data\
    \ without allocating more memory. Typical examples are the use of memory-mapped\
    \ files or dealing with substrings in large texts.\n+   2. You want to improve\
    \ the performance for functions/operations that receive strings to simply process\
    \ them read-only, without needing a trailing null terminator.\n\nA special form\
    \ of this might be to deal with string literals as objects with an API similar\
    \ to strings:\nstd::string_view hello{\"hello world\"};\n\n```\nstd::string_view\
    \ hello{\"hello world\"};\n```\n\nThe first application usually means that only\
    \ string views are passed around, while the programming logic has to ensure that\
    \ the underlying character sequences remain valid (i.e., the mapped file content\
    \ is not unmapped). You might use a string view at any time to initialize or assign\
    \ its value to a std::string.\n\nBeware of using string views just as “the better\
    \ string.” This can result in performance problems and severe runtime errors.\
    \ Read the following subsections carefully.\n\n# 19.3 Using String Views as Parameters\n\
    \nA first example of using a string view as a read-only string is a function that\
    \ prints a collection of elements with a prefix passed as a string view:\n\n```\n\
    #include <string_view>\ntemplate<typename T>\nvoid printElems(const T& coll, std::string_view\
    \ prefix = {})\n{\n  for (const auto& elem : coll) {\n    if (prefix.data()) {\
