  md: "# Chapter 1\n\n# Structured Bindings\n\nStructured bindings allow you to initialize\
    \ multiple entities with the elements or members of an object.\n\nFor example,\
    \ suppose you have defined a structure of two different members:\n\n```\nstruct\
    \ MyStruct {\n    int i = 0;\n    std::string s;\n};\n```\n\n```\nMyStruct ms;\n\
    ```\n\nYou can bind members of this structure directly to new names by using the\
    \ following declaration:\n\n```\nauto [u, v] = ms;\n```\n\nHere, the names u and\
    \ v are what are called structured bindings. To some extent, they decompose the\
    \ objects passed for initialization (at some point they were called decomposition\
    \ declarations).\n\nEach syntax for initializations is supported:\n\n```\nauto\
    \ [u2, v2] {ms};\nauto [u3, v3] (ms);\n```\n\nStructured bindings are especially\
    \ useful for functions that return structures or arrays. For example, consider\
    \ a function that returns a structure\n\n```\nMyStruct getStruct() {\n    return\
    \ MyStruct{42, \"hello\"};\n}\n```\n\nYou can assign the result to two entities\
    \ directly giving local names to the returned data members:\n\n```\nauto[id,val]\
    \ = getStruct(); // id and val name i and s of returned struct\n```\n\nHere, id\
    \ and val are names for the members i and s of the returned structure. They have\
    \ the corresponding types, int and std::string, and can be used as two different\
    \ objects:\n\n```\nif (id > 30) {\n    std::cout << val;\n}\n```"
