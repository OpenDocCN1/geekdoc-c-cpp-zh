  md: "# 33.3 std::void_t<>\n\nA small but very useful helper for defining type traits\
    \ was standardized in C++17: std::void_t<>. It is simply defined as follows:\n\
    \n```\nnamespace std {\n    template<typename...> using void_t = void;\n}\n```\n\
    \nThat is, it yields void for any variadic list of template parameters. This is\
    \ helpful where we only want to deal with types solely in an argument list.\n\n\
    The major application is the ability to check for conditions when defining new\
    \ type traits. The following example demonstrates the application of this helper:\n\
    \n```\n#include <utility>      // for declval<>\n#include <type_traits>  // for\
    \ true_type, false_type, and void_t\n\n// primary template:\ntemplate<typename,\
    \ typename = std::void_t<>>\nstruct HasVarious : std::false_type {\n};\n\n// partial\
    \ specialization (may be SFINAE'd away):\ntemplate<typename T>\nstruct HasVarious<T,\
    \ std::void_t<decltype(std::declval<T>().begin()),\n                    typename\
    \ T::difference_type,\n                    typename T::iterator>>\n    : std::true_type\
    \ {\n};\n```\n\nHere, we define a new type trait HasVariousT<>, which checks for\
    \ three things:\n\n+   - Does the type have a member function begin()?\n\n+  \
    \ - Does the type have a type member difference_type?\n\n+   - Does the type have\
    \ a type member iterator?\n\nThe partial specialization is used only when all\
    \ the corresponding expressions are valid for a type T. In that case, it is more\
    \ specific than the primary template and as we derive from std::true_type, a check\
    \ against the value of this trait yields true:\n\n```\nif constexpr (HasVarious<T>::value)\
    \ {\n    ...\n}\n```\n\nIf any of the expressions results in invalid code (i.e.,\
    \ T has no begin(), or no type member difference_type, or no type member iterator),\
    \ the partial specialization is SFINAE'd away, which means that it is ignored\
    \ due to the rule that substitution failure is not an error. Then, only the primary\
    \ template is available, which derives from std::false_type, which means that\
    \ a check against the value of this trait yields false.\n\nIn the same way, you\
    \ can use std::void_t to easily define other traits that check for one or multiple\
    \ conditions, where the existence/ability of a member or operation matters. See\
    \ HasDelete<> for an example."
  merge: -1
