  md: "This does not work automatically because the corresponding constructor is a\
    \ template, which means that no implicit deduction guide applies:\n\n```\nnamespace\
    \ std {\n    template<typename T> class shared_ptr {\n        public:\n      \
    \      ...\n            template<typename Y> explicit shared_ptr(Y* p);\n    \
    \        ...\n    };\n}\n```\n\nY is a different template parameter to T, meaning\
    \ that deducing Y from the constructor does not mean that we can deduce type T.\
    \ This is a feature to be able to call something like:\n\n```\nstd::shared_ptr<Base>\
    \ sp{new Derived(...)};\n```\n\nThe corresponding deduction guide would be simple\
    \ to provide:\n\n```\nnamespace std{\n    template<typename Y> shared_ptr(Y*)\
    \ -> shared_ptr<Y>;\n}\n```\n\nHowever, this would also mean that this guide is\
    \ taken when allocating arrays:\n\n```\nstd::shared_ptr sp{new int[10]};     \
    \ // OOPS: would deduce shared_ptr<int>\n```\n\nAs so often in C++, we run into\
    \ the nasty C problem that the type of a pointer to one object and an array of\
    \ objects have or decay to the same type.\n\nThis problem seems dangerous and\
    \ therefore, the C++ standards committee has decided not to support it.\n\nFor\
    \ single objects, you still have to call:\n\n```\nstd::shared_ptr<int> sp1{new\
    \ int};      // OK\nauto sp2 = std::make_shared<int>();      // OK\n```\n\nand\
    \ for arrays:\n\n```\nstd::shared_ptr<std::string> p(new std::string[10],\n  \
    \  [](std::string* p) {\n        delete[] p;\n    });\n```\n\nor, using the new\
    \ feature to instantiate shared pointers for raw arrays, just:\n\n```\nstd::shared_ptr<std::string[]>\
    \ p{new std::string[10]};\n```\n\n# 9.3 Afternotes\n\nClass template argument\
    \ deduction was first proposed in 2007 by Michael Spertus in http://wg21.link/n2332.\
    \ The proposal was revisited in 2013 by Michael Spertus and David Vandevoorde\
