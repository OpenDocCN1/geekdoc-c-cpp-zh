  md: "transform_inclusive_scan() computes\n    initVal op2 op1(a1), initVal op2 op1(a1)\
    \ op2 op1(a2), ... op2 op1(aN)\nwhile transform_exclusive_scan() computes\n  \
    \  initVal, initVal op2 op1(a1), initVal op2 op1(a1) op2 op1(a2), ... op2 op1(aN-1)\n\
    This means that for inclusive_scan(), initVal serves as an offset for each output\
    \ value, while for exclusive_scan(), it serves as the first element (although\
    \ it is not written if the input range is empty).\n\n+   - All forms return the\
    \ position after the last written value in the destination range (the first element\
    \ that is not overwritten).\n+   - If no initVal is passed (transform_inclusive_scan()\
    \ only), no initial value is added. Thus, the first output value is just the first\
    \ transformed input value.\n+   - If the range is empty (beg==end), all forms\
    \ write no elements.\n+   - The caller must ensure that the range starting with\
    \ outBeg contains enough elements to overwrite (in fact, at least as many elements\
    \ as in the source range), or that insert iterators are used.\n+   - op1 and op2\
    \ must not modify the passed arguments.\n+   - Complexity: linear (numElems calls\
    \ of operator op1 and op2).\n+   - If the first optional execution policy is passed:\n\
    +     - There is no guaranteed order for using the operator op2, which means that\
    \ op2 must be commutative and associative.\n+     - It is up to the caller to\
    \ ensure that parallel calls of the operations do not result in a data race.\n\
    +     - The iterators must be forward iterators.\n\nFor example, the following\
    \ program:\n\nlib/transformscan.cpp\n\n```\n#include <numeric>\n#include <algorithm>\n\
    #include <iostream>\n#include <iterator>\n#include <array>\n\nint main()\n{\n\
    \    std::array coll{3, 1, 7, 0, 4, 1, 6, 3};\n\n    auto twice = [] (int v) {\
    \ return v*2; };\n\n    std::cout << \" source:               \";\n    std::copy(coll.begin(),\
    \ coll.end(),\n              std::ostream_iterator<int>(std::cout, \" \"));\n\n\
    \    std::cout << \"\\n transform_inclusive_scan():   \";\n    std::transform_inclusive_scan(coll.begin(),\
    \ coll.end(),\n                                  std::ostream_iterator<int>(std::cout,\
    \ \" \"),\n```"
