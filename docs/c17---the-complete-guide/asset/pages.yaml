- pgno: 267
  md: "# 20.5.1 Directory Entries\n\nThe elements directory iterators iterate over\
    \ are of the type std::filesystem::directory_entry. Thus, if a directory iterator\
    \ is valid, operator*() yields that type. This means that the correct types of\
    \ the range-based for loop are as follows:\n\n```\nfor (const std::filesystem::directory_entry&\
    \ e\n    : std::filesystem::directory_iterator(p)) {\n    std::cout << e.path()\
    \ << '\\n';\n}\n```\n\nDirectory entries contain both a path object and additional\
    \ attributes such as hard link count, file status, file size, last write time,\
    \ whether it is a symbolic link, and where it refers to if it is.\n\nNote that\
    \ the iterators are input iterators. This is because iterating over a directory\
    \ might result in different results as directory entries might change at any time.\
    \ This has to be taken into account when using directory iterators in parallel\
    \ algorithms.\n\nTable Directory Entry Operations lists the operations you can\
    \ call for a directory entry e. They are more or less the operations you can call\
    \ to query file attributes, get the file status, check permissions, and compare\
    \ the paths.\n\nassign() and replace_filename() call the corresponding modifying\
    \ path operations but do not modify the files in the underlying filesystem.\n\n\
    # Directory Entry Caching\n\nImplementations are encouraged to cache such additional\
    \ file attributes to avoid additional filesystem access when using the entries.\
    \ However, implementations are not required to cache the data, which means that\
    \ these usually cheap operations might become more expensive.\n\nBecause all the\
    \ values are usually cached, these calls are usually cheap and therefore member\
    \ functions:\n\n```\nfor (const auto& e : std::filesystem::directory_iterator{\"\
    .\"})\n{\n    auto t = e.last_write_time();    // usually cheap\n    ...\n}\n\
    ```\n\nWhether cached or not, in a multi-user or multi-process operating system,\
    \ all these iterations might yield data about files that is no longer valid. File\
    \ contents and therefore sizes might change, files might be removed or replaced\
    \ (thus, even file types might change), and permissions might be modified.\n\n\
    In that case, you can request a refresh of the data a directory entry holds:\n\
    \n```\nfor (const auto& e : std::filesystem::directory_iterator{\".\"})\n{\n \
    \   ...                 // data becomes old\n    e.refresh();    // refresh cache\
    \ data for the file\n    if (e.exists()) {\n```"
