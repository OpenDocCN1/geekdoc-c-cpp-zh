    \ {\n    std::cout << *ip << '\\n';\n}\nelse {\n    std::cout << \"alternative\
    \ with index 1 not set\\n\";\n}\n```\n\nAnother way to access the values of the\
    \ different alternatives is using variant visitors.\n\n# Changing the Value\n\n\
    Assignment and emplace() operations exist corresponding to the initializations:\n\
    \n```\nstd::variant<int, int, std::string> var; // sets first int to 0, index()==0\n\
    var = \"hello\";                         // sets string, index()==2\nvar.emplace<1>(42);\
    \                    // sets second int, index()==1\n```\n\nNote that operator=\
    \ will directly assign the new value if the variant currently holds the matching\
    \ alternative. emplace() always destroys the old value and assigns the new value.\n\
    \nYou can also use get<>() or get_if<>() to assign a new value to the current\
    \ alternative:\n\n```\nstd::variant<int, int, std::string> var; // sets first\
    \ int to 0, index()==0\nstd::get<0>(var) = 77;                  // OK, because\
    \ first int already set\nstd::get<1>(var) = 99;                  // throws exception\
    \ (other int currently set)\n```\n\n```\nif (auto p = std::get_if<1>(&var); p)\
    \ { // if second int set\n    *p = 42;                            // modify it\n\
    }\n```\n\nAnother way to modify the values of the different alternatives is using\
    \ variant visitors.\n\n# Comparisons\n\nFor two variants of the same type (i.e.,\
    \ they have the same alternatives in the same order), you can use the usual comparison\
    \ operators. The operators act according to the following rules:\n\n+   - A variant\
    \ with a value of an earlier alternative is less than a variant with a value with\
    \ a later alternative."
