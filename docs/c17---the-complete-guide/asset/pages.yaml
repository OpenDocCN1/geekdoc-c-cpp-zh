  md: "# # 29.1 Using Standard Memory Resources\n\n```\n```cpp\n#include <iostream>\n\
    #include <string>\n#include <map>\n#include <memory_resource>\n\nint main()\n\
    {\n    std::pmr::synchronized_pool_resource pool;\n    std::pmr::map<long, std::pmr::string>\
    \ coll{&pool};\n\n    for (int i=0; i<10; ++i) {\n        std::string s{\"Customer\"\
    \ + std::to_string(i)};\n        coll.emplace(i, s);\n    }\n\n    // print element\
    \ distances:\n    for (const auto& elem : coll) {\n        static long long lastVal\
    \ = 0;\n        long long val = reinterpret_cast<long long>(&elem);\n        std::cout\
    \ << \"diff: \" << (val-lastVal) << '\\n';\n        lastVal = val;\n    }\n}\n\
    ```\n```\n\nAs you can see, we simply create the resource and pass it to the constructor\
    \ of the container as an argument:\n\n```\n```cpp\nstd::pmr::synchronized_pool_resource\
    \ pool;\nstd::pmr::map<long, std::pmr::string> coll{&pool};\n```\n```\n\nThe output\
    \ now looks as follows, for example:\n\n```\n```diff\n2548552461600\n128\n128\n\
    105216\n128\n128\n128\n128\n128\n128\n```\n```\n\nAs you can see, the elements\
    \ are now located close to each other. However, they are still not located in\
    \ one chunk of memory. When the pool finds out that the first chunk is not big\
    \ enough for all the elements, it allocates more memory for even more elements.\
    \ Thus, the more memory we allocate, the larger the chunks"
