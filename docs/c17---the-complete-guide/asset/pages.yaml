- pgno: 203
  md: '# 18.2.2 std::byte Operations


    Table std::byte Operations lists all operations that are provided for std::byte.


    | Operation | Effect |

    |---|---|

    | constructors | Creates a byte object (value undefined with default constructor)
    |

    | destructor | Destroys a byte object (nothing to be done) |

    | = | Assigns a new value |

    | ==, !=, <, <=, >, >= | Compares byte objects |

    | <<, >>, |, &, ^, ~ | Binary bit-operations |

    | <<=, >>=, |=, &=, ^= | Modifying bit-operations |

    | to_integer<T>() | Converts a byte object into the integral type T |

    | sizeof() | Yields 1 |


    Table 18.1. std::byte Operations


    # Conversion to Integral Types


    Using to_integer<>(), you can convert a std::byte into any fundamental integral
    type (bool, a character type, or an integer type). This is necessary, for example,
    to compare a std::byte with a numeric value or to use it in a condition:


    ```

    if (b2) ...                      // ERROR

    if (b2 != std::byte{0}) ...      // OK

    if (to_integer<bool>(b2)) ...    // ERROR (ADL doesn''t work here)

    if (std::to_integer<bool>(b2)) ...  // OK

    ```


    Another example usage is std::byte I/O.


    to_integer<>() uses the rules for static casts from an unsigned char to the destination
    type. For example:


    ```

    std::byte ff{0xFF};

    std::cout << std::to_integer<unsigned int>(ff);     // 255

    std::cout << std::to_integer<int>(ff);                 // also 255 (no negative
    value)

    std::cout << static_cast<int>(std::to_integer<signed char>(ff));   // -1

    ```


    # I/O with std::byte


    There are no input and output operators defined for std::byte, so you have to
    convert them into an integral value:


    ```

    std::byte b;

    ...

    std::cout << std::to_integer<int>(b);               // prints value as decimal
    value

    std::cout << std::hex << std::to_integer<int>(b);    // prints value as hexadecimal
    value

    ```


    By using a std::bitset<>, you can also output the value as a binary value (a sequence
    of bits):'
