    \ range [beg,end) with all previous elements and write them to the destination\
    \ range starting with outBeg.\n+   - The difference between inclusive_scan() and\
    \ exclusive_scan() is that exclusive_scan() starts with the initial value and\
    \ excludes the last input element from the result. Note that the order of the\
    \ trailing function parameters differs and that for exclusive_scan(), the initial\
    \ value is mandatory.\n+   - Thus, for the values\n+       a1 a2 a3 ... aN\n+\
    \     inclusive_scan() computes\n+       initVal op a1, initVal op a1 op a2, initVal\
    \ op a1 op a2 op a3, ... aN\n+     while exclusive_scan() computes\n+       initVal,\
    \ initVal op a1, initVal op a1 op a2, ... op aN-1\n+     This means that for inclusive_scan(),\
    \ initVal serves as an offset for each output value, while for exclusive_scan(),\
    \ it serves as the first output value (although it is not written if the input\
    \ range is empty).\n+   - All forms return the position after the last written\
    \ value in the destination range (the first element that is not overwritten).\n\
    +   - If no op is passed, std::plus is used, so that the sum of all elements is\
    \ computed.\n+   - If no initVal is passed (inclusive_scan() only), no initial\
    \ value is added. Thus, the first output value is just the first input value.\n\
    +   - If the range is empty (beg==end), all forms write no elements."
