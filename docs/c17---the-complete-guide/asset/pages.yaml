    \  [] (const auto& a, const auto& b) {\n        return std::string_view{a}.substr(2)\
    \ < std::string_view{b}.substr(2);\n    });\n```\n\nis much faster than using\
    \ substrings of strings:\n\n```\nsort(std::execution::par,\n    coll.begin(),\
    \ coll.end(),\n    [] (const auto& a, const auto& b) {\n        return a.substr(2)\
    \ < b.substr(2);\n    });\n```\n\nThis is because for strings, a substring is\
    \ a new string that allocates its own memory.\n\n# 19.6 Afternotes\n\nThe first\
