  md: 'Note that for iterators, we need global or static objects because we cannot
    take the address of objects on the stack at compile time:


    ```

    constexpr static std::array arr{0, 8, 15, 42};

    constexpr auto pos = std::next(arr.rbegin());  // OK

    static_assert(*pos == 15);                      // OK and doesn''t fail

    ```


    # 28.6 noexcept Extensions and Fixes


    As usual for each new C++ version since C++11, at a couple of places support for
    noexcept was added and/or fixed.


    The most important fixes are:


    +   - For std::vector<> and std::string (std::basic_string<>), C++17 guarantees
    not to throw

    +     - In the default constructor (provided the default constructor of the allocator
    does not throw)

    +     - In the move constructor

    +     - In the constructor that takes an allocator


    +   - For all containers (including std::string/std::basic_string<>), C++17 guarantees
    not to throw

    +     - In the move assignment operator (provided the allocators are interchangeable)

    +     - In the swap() functions (provided the allocators are interchangeable)


    # Consequences for Vector Reallocation


    Note that one of the noexcept fixes is very special and remarkable: only vectors
    and strings now guarantee not to throw in their move constructor. The other containers
    might still throw.


    This has a significant impact if these types are used in a vector, because on
    reallocation, vectors can only use move semantics if the move constructor of the
    elements guarantees not to throw.


    In other words:


    +   - Reallocating a vector of strings/vectors is now guaranteed to be fast.

    +   - Reallocating a vector of other container types might be slow.


    This is yet another good reason to use vectors as the default container unless
    you have good reason to do otherwise.


    # 28.7 Afternotes


    The motivation for std::uncaught_exceptions() was first raised by Herb Sutter
    in http://wg21.link/n3614. The finally accepted wording for this feature was formulated
    by Herb Sutter in http://wg21.link/n4259.


    Extending shared pointers for array types and adding reinterpret_pointer_cast
    was first proposed by Peter Dimov in http://wg21.link/n3640. The finally accepted
    wording for this feature was formulated by Jonathan Wakely in http://wg21.link/p0414r2.'
