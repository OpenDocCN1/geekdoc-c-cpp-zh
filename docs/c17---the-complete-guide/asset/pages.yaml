    \   [](const auto& a, const auto& b) {\n         return std::string_view{a}.substr(2)\
    \ < std::string_view{b}.substr(2);\n     });\n```\n```\n\nAs a result, we become\
    \ faster by a factor of up to 10 compared to a sequential execution with `string`’s\
    \ `substr()` members:\n\n```\n```cpp\nsort(coll.begin(), coll.end(),\n     [](const\
    \ auto& a, const auto& b) {\n         return a.substr(2) < b.substr(2);\n    \
    \ });\n```\n```\n\n# ## 22.2 Execution Policies\n\nYou can pass different *execution\
    \ policies* to parallel STL algorithms as the first argument. They are defined\
    \ in header `<execution>`. Table *Execution Policies* lists the standardized *execution\
    \ policies*.\n\n| Policy | Meaning |\n|---|---|\n| `std::execution::seq` | Sequential\
    \ execution |\n| `std::execution::par` | Parallel sequenced execution |\n| `std::execution::par_unseq`\
    \ | Parallel unsequenced (vectorized) execution |\n\n*Table 22.1. Execution Policies*\n\
    \nLet us discuss the execution policies in detail:\n\n+   - **Sequential execution**\
    \ with `seq`\n+   \n+     This means that, as with the non-parallel algorithms,\
    \ the current thread of execution executes the necessary operations sequentially\
    \ element by element. Using this policy should behave like using the non-parallel\
    \ way of calling algorithms that do not accept any execution policy at all. However,\
    \ with the parallel algorithms that take this argument, additional constraints\
    \ might apply, such as `for_each()` not returning any value or all iterators having\
    \ to be at least forward iterators.\n+   \n+     This policy is provided to allow\
    \ you to request sequential execution by just passing a different argument instead\
    \ of using a different signature. However, note that parallel algorithms with\
    \ this policy might behave slightly differently to corresponding non-parallel\
    \ algorithms.\n\n+   - **Parallel sequenced execution** with `par`\n+   \n+  \
    \   This means that multiple threads might sequentially execute the necessary\
    \ operations for the elements. When an algorithm starts the execution of the necessary\
    \ operations, it finishes this execution before it deals with other elements.\n\
    +   \n+     In contrast to `par_unseq`, this ensures that no problems or deadlocks\
    \ occur when processing a first specific step for one element requires the call\
    \ of a following step for this element before the same thread performs the first\
    \ specific step with another element."
