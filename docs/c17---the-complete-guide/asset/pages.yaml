  md: "```\n#include <iostream>\n#include <charconv>\n#include <cassert>\n\nvoid d2str2d(double\
    \ value1)\n{\n    std::cout << \"in:  \" << value1 << '\\n';\n\n    // convert\
    \ to character sequence:\n    char str[1000];\n    std::to_chars_result res1 =\
    \ std::to_chars(str, str+999,\n                                            value1);\n\
    \    *res1.ptr = '\\0';  // add trailing null character\n\n    std::cout << \"\
    str: \" << str << '\\n';\n    assert(res1.ec == std::errc{});\n\n    // read back\
    \ from character sequence:\n    double value2;\n    std::from_chars_result res2\
    \ = std::from_chars(str, str+999,\n                                          \
    \  value2);\n\n    std::cout << \"out: \" << value2 << '\\n';\n    assert(res2.ec\
    \ == std::errc{});\n\n    assert(value1 == value2);  // should never fail\n}\n\
    ```\n\nHere we convert a passed double value into a character sequence and parse\
