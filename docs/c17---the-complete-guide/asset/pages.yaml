  md: "```\nstd::variant<double,int> var{12.2};    // initialized as double\nvar.emplace<1>(S{});\
    \                  // OOPS: throws while set as int\n```\n\nIf this happens, then:\n\
    \n+   - var.valueless_by_exception() returns true\n+   - var.index() returns std::variant_npos\n\
    \nwhich signals that the variant holds no value at all.\nThe exact guarantees\
    \ are as follows:\n\n+   - If emplace() throws, valueless_by_exception() might\
    \ be set to true.\n+   - If operator=() throws and the modification would not\
    \ change the alternative, both index() and valueless_by_exception() keep their\
    \ old state. The state of the value depends on the exception guarantees of the\
    \ value type.\n+   - If operator=() throws and the new value would set a different\
    \ alternative, the variant might hold no value (valueless_by_exception() might\
    \ become true). This depends on when exactly the exception is thrown. If it happens\
    \ during a type conversion before the actual modification of the value started,\
    \ the variant will still hold its old value.\n\nUsually, this behavior should\
    \ be no problem provided you no longer use the variant you tried to modify. If\
    \ you still want to use a variant even though using it caused an exception, you\
    \ should check its state. For example:\n\n```\nstd::variant<double,int> var{12.2};\
    \    // initialized as double\ntry {\n    var.emplace<1>(S{});               //\
    \ OOPS: throws while set as int\n}\ncatch (...) {\n    if (!var.valueless_by_exception())\
    \ {\n        ...\n    }\n}\n```\n\n# 16.4 Polymorphism and Heterogeneous Collections\
    \ with std::variant\n\nstd::variant enables a new form of polymorphism and dealing\
    \ with heterogeneous (also called inhomogeneous) collections. It is a form of\
    \ runtime polymorphism with a closed set of data types.\n\nThe key approach is\
    \ that a variant<> can hold values of multiple alternative types. By creating\
    \ collections of variants, the collections become heterogeneous, holding values\
    \ of the different alternative types. Because each variant knows which alternative\
    \ it holds, and due to the visitor interface, we can program that at runtime different\
    \ functions/methods are called for different types. As variants have value semantics,\
    \ we do not need pointers (and the corresponding memory management) or virtual\
    \ functions."
