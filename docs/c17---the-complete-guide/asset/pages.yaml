- pgno: 379
  md: "The output demonstrates the following:\n\n+   - With the first allocation by\
    \ an object, the syncpool allocates 48 bytes, which causes the keeppool to allocate\
    \ its initial 10,000 bytes. These 10,000 bytes are allocated on the heap, using\
    \ the resource from get_default_resource() when the keeppool was initialized.\n\
    +   - Subsequent objects allocate and deallocate memory, which causes the syncpool\
    \ to allocate more chunks of memory from time to time, but also to deallocate\
    \ chunks of memory. If the syncpool effectively allocates more memory than the\
    \ keeppool has allocated, the keeppool again allocates more memory from the heap.\
    \ That is, only the keeppool allocations become (rather expensive) system calls.\n\
    +   - With additional tracing of the end of the third iteration, you can see that\
    \ all these allocations take place during the first three iterations of the outer\
    \ loop. The amount of memory (re)used is then stable. Thus, the remaining 97 iterations\
    \ allocate no memory at all from the operating system.\n+   - The keeppool does\
    \ not deallocate any memory even when the syncpool has deallocated all of its\
    \ memory.\n+   - It is only when the keeppool is destroyed that the six allocated\
    \ chunks of memory are really deallocated, calling ::delete (or whatever was defined\
    \ with set_default_resource() when the keeppool was initialized).\n\nIf we introduced\
    \ a third tracker in this program, we could also track when objects allocate and\
    \ deallocate memory from the syncpool:\n\n```\n// track each call, the effect\
    \ in the sync pool, and the effect in the mono pool:\nTracker track1{\"keeppool:\"\
    };\nstd::pmr::monotonic_buffer_resource keepAllocatedPool{10000, &track1};\nTracker\
    \ track2{\"  syncpool:\", &keepAllocatedPool};\nstd::pmr::synchronized_pool_resource\
    \ syncPool{&track2};\nTracker track3{\"     objects:\", &syncPool};\n...\nstd::pmr::vector<std::pmr::string>\
    \ coll{&track3};\n```\n\n# 29.2.1 Equality of Memory Resources\n\nLet us briefly\
    \ discuss do_is_equal(), the function that defines when two memory resources are\
    \ interchangeable. This function requires more thought than first expected.\n\n\
    In our tracker, we have defined that the allocators are interchangeable if they\
    \ are both of type Tracker and use the same prefix:\n\n```\nbool do_is_equal(const\
    \ std::pmr::memory_resource& other) const noexcept override {\n    // same object?:\n\
    \    if (this == &other) return true;\n    // same type and prefix and equal upstream?:\n\
    \    auto op = dynamic_cast<const Tracker*>(&other);\n    return op != nullptr\
    \ && op->prefix == prefix\n        && upstream->is_equal(other);\n}\n```"
