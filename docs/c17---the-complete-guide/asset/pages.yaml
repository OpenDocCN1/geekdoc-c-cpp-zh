  md: "# Chapter 27: Multi-Threading and Concurrency\n\nIf the is_always_lock_free()\
    \ yields true for an atomic type, then is_lock_free() yields true for any object\
    \ of this type:\n\n```\nif constexpr(atomic<T>::is_always_lock_free) {\n  assert(atomic<>{}.is_lock_free());\
    \ // never fails\n}\n```\n\nThe value corresponds to the macro that had to be\
    \ used before C++17. For example, the value of std::atomic<int>::is_always_lock_free\
    \ is true if and only if ATOMIC_INT_LOCK_FREE yields 2 (which stands for “always”):\n\
    \n```\nif constexpr(std::atomic<int>::is_always_lock_free) {\n  // ATOMIC_INT_LOCK_FREE\
    \ == 2\n  ...\n}\nelse {\n  // ATOMIC_INT_LOCK_FREE == 0 || ATOMIC_INT_LOCK_FREE\
    \ == 1\n  ...\n}\n```\n\nThe reason for replacing the macro with a static member\
    \ is to have more type safety and support the use of these checks in complicated\
    \ generic code (e.g., using SFINAE).\n\nRemember that std::atomic<> can also be\
    \ used for trivially copyable types. Thus, you can also check whether your own\
    \ structure would need locks if used atomically. For example:\n\n```\ntemplate<auto\
    \ SZ>\nstruct Data {\n  bool set;\n  int values[SZ];\n  double average;\n};\n\n\
    if constexpr(std::atomic<Data<4>>::is_always_lock_free) {\n  ...\n}\nelse {\n\
    \  ...\n}\n```\n\n# 27.3 Cache Line Sizes\n\nIt is sometimes important for a program\
    \ to deal with cache line sizes:"
