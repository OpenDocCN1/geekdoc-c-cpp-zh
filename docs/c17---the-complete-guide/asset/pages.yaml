  md: "# Chapter 17\n\n# std::any\n\nIn general, C++ is a language with type binding\
    \ and type safety. Value objects are declared to have a specific type that defines\
    \ which operations are possible and how the objects behave. Furthermore, the objects\
    \ cannot change their type.\n\nstd::any is a value type that can change its type\
    \ while still having type safety. That is, objects can hold values of any arbitrary\
    \ type but they know which type the value has that they currently hold. There\
    \ is no need to specify the possible types when declaring an object of this type.\n\
    \nThe trick is that objects contain both the contained value and the type of the\
    \ contained value. Because the value can have any size, the memory might be allocated\
    \ on the heap. However, implementations should avoid the use of heap memory for\
    \ small contained values such as int.\n\nThat is, if you assign a string, the\
    \ object allocates memory for the value and copies the string, while also storing\
    \ that fact that a string was assigned. Later, runtime checks can be done to find\
    \ out which type the current value has. To use the current value with its type,\
    \ an any_cast<> is necessary.\n\nAs for std::optional<> and std::variant<>, the\
    \ resulting objects have value semantics. That is, copying is implemented as a\
    \ deep copy that creates an independent object with the current value of the current\
    \ type in its own memory. Because heap memory might be involved, copying a std::any\
    \ is usually expensive. You should prefer to pass objects by reference or move\
    \ them. Move semantics is partially supported.\n\n# 17.1 Using std::any\n\nThe\
    \ following example demonstrates the core abilities of std::any:\n\n```\nstd::any\
    \ a;            // a is empty\nstd::any b = 4.3;       // b has value 4.3 of type\
    \ double\na = 42;                // a has value 42 of type int\nb = std::string{\"\
    hi\"}; // b has value \"hi\" of type std::string\n```\n\n```\nif (a.type() ==\
    \ typeid(std::string)) {\n    std::string s = std::any_cast<std::string>(a);\n\
    \    useString(s);\n}\n```"
