    # 20.3.5 Path Modifications


    Table *Path Modifications* lists the operations that allow us to modify paths
    directly.


    | Call | Effect |

    |---|---|

    | p = p2 | Assigns a new path |

    | p = sv | Assigns a string (view) as a new path |

    | p.assign(p2) | Assigns a new path |

    | p.assign(sv) | Assigns a string (view) as a new path |

    | p.assign(beg, end) | Assigns elements of the range from beg to end to the path
    |

    | p1 / p2 | Yields the path that appends p2 as sub-path of path p1 |

    | p /= sub | Appends sub as sub-path to path p |

    | p.append(sub) | Appends sub as sub-path to path p |

    | p.append(beg, end) | Appends elements of the range from beg to end as sub-paths
    to path p |

    | p += str | Appends the characters of str to path p |

    | p.concat(str) | Appends the characters of str to path p |

    | p.concat(beg, end) | Appends elements of the range from beg to end to path p
    |

    | p.remove_filename() | Removes a trailing file name from the path |

    | p.replace_filename(repl) | Replaces the trailing file name (if any) |

    | p.replace_extension() | Removes any trailing file name extension |

    | p.replace_extension(repl) | Replaces the trailing file name extension (if any)
    |

    | p.clear() | Makes the path empty |

    | p.swap(p2) | Swaps the values of two paths |

    | swap(p1, p2) | Swaps the values of two paths |

    | p.make_preferred() | Replaces directory separators in p with native format and
    yields the modified p |


    *Table 20.7. Path Modifications*


    While += and concat() simply append new characters to a path, /, /=, and append()
    add a sub path separated with the current directory separator:


    ```

    std::filesystem::path p{"myfile"};

    p += ".git";              //p:myfile.git

    p /= ".git";              //p:myfile.git/.git

    p.concat("1");            //p:myfile.git/git1

    p.append("1");            //p:myfile.git/git1/1

    ```'
