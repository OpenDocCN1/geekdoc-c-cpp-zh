    \\top\"\n\"temp\\\\top\\\\a/x\"\n\"..\\\\x\"\n\"..\\\\x\"\n\"a\\\\x\"\n\"..\\\\\
    x\"\n\"..\\\\x\"\nps: \"C:\\\\temp\\\\top\\\\a/s\" -> \"C:\\\\temp\\\\top\"\n\"\
    ..\\\\x\"\n\"a\\\\x\"\n```\n\nNote again that you need administrator rights to\
    \ create symbolic links on Windows.\n\n# 20.4.6 Other Filesystem Operations\n\n\
    Table *Other Operations* lists other filesystem operations not mentioned yet.\n\
    \n| Call | Effect |\n|---|---|\n| equivalent(p1, p2) | Yields whether p1 and p2\
    \ refer to the same file |\n| space(p) | Yields information about the disk space\
    \ available at path p |\n| current_path(p) | Sets the path of the current working\
    \ directory to p |\n\n*Table 20.20. Other Operations*\n\nThe equivalent() function\
    \ is discussed in the section about path comparisons.\n\nThe return value of space()\
    \ is the following structure:\n\n```\nnamespace std::filesystem {\n    struct\
    \ space_info {\n        uintmax_t capacity;\n        uintmax_t free;\n       \
    \ uintmax_t available;\n    };\n}\n```\n\nThus, using structured bindings, you\
    \ can print the available disk space of root as follows:\n\n```\nauto [cap, _,\
    \ avail] = std::filesystem::space(\"/\");\nstd::cout << std::fixed << std::precision(2)\n\
    \          << avail/1.0e6 << \" of \" << cap/1.0e6 << \" MB available\\n\\n\"\
    ;\n```\n\nThe output might be, for example:\n\n```\n43019.82 of 150365.79 MB available\n\
    ```"
