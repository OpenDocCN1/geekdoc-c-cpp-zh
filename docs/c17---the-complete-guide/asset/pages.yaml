  md: "# Chapter 3\n\n# Inline Variables\n\nFor portability and ease of integration,\
    \ it often makes sense to provide classes and libraries that are entirely contained\
    \ in header files. However, up to C++17, this was only possible if no global variables/objects\
    \ were needed or provided by such a library.\n\nSince C++17, you can define a\
    \ variable/object in a header file as inline:\n\n```\nclass MyClass {\n    inline\
    \ static std::string msg{\"OK\"};  // OK since C++17\n    ...\n};\n```\n\n```\n\
    inline MyClass myGlobalObj;  // OK even if included/defined by multiple CPP files\n\
    ```\n\nNo further definition in one translation unit is necessary, and if this\
    \ definition is used by multiple translation units, they all refer to the same\
    \ unique object.\n\n# 3.1 Motivation for Inline Variables\n\nIn C++, initializing\
    \ a non-const static member inside the class structure is not allowed:\n\n```\n\
    class MyClass {\n    static std::string msg{\"OK\"};  // compile-time ERROR\n\
    \    ...\n};\n```\n\nDefining the variable outside the class structure is also\
    \ an error if this definition is part of a header file included by multiple CPP\
    \ files:\n\n```\nclass MyClass {\n    static std::string msg;\n    ...\n};\nstd::string\
    \ MyClass::msg{\"OK\"};  // Link ERROR if included by multiple CPP files\n```"
