  md: "};\n\nPlacing the attribute between friend and bool or between bool and operator==\
    \ is not correct.\n\nAlthough the language feature was introduced with C++17,\
    \ it is not used in the standard library yet. The proposal to apply this feature\
    \ there simply came too late for C++17. Therefore, one of the key motivations\
    \ for this feature, adding it to the declaration of std::async(), has not been\
    \ done yet. However, for all the examples discussed above, corresponding fixes\
    \ will come with the next C++ standard (see http://wg21.link/p0600r1 proposal,\
    \ accepted for C++20).\n\nHowever, to make your code more portable, you should\
    \ use [[nodiscard]] instead of non-portable means (such as [[gnu: warn_unused_result]]\
    \ for gcc and clang or _Check_return_ for Visual C++) to mark functions accordingly.\n\
    \nWhen defining operator new(), you should mark the functions with [[nodiscard]]\
    \ as is done, for example, when defining a header file to track all calls of new.\n\
    \n# 7.2 Attribute [[maybe_unused]]\n\nThe new attribute [[maybe_unused]] can be\
    \ used to avoid warnings by the compiler for not using a name or entity.\n\nThe\
    \ attribute may be applied to the declaration of a class, a type definition with\
    \ typedef or using, a variable, a non-static data member, a function, an enumeration\
    \ type, or an enumerator (enumeration value).\n\nOne application is to name a\
    \ parameter without (necessarily) using it:\n\n```\nvoid foo(int val, [[maybe_unused]]\
    \ std::string msg)\n{\n#ifdef DEBUG\n    log(msg);\n#endif\n    ...\n}\n```\n\n\
    Another example would be to have a member without using it:\n\n```\nclass MyStruct\
    \ {\n    char c;\n    int i;\n    [[maybe_unused]] char makeLargerSize[100];\n\
    \    ...\n};\n```\n\nNote that you cannot apply [[maybe_unused]] to a statement.\
    \ Therefore, you cannot counter [[nodiscard]] with [[maybe_unused]] directly:\n\
    \n```\n[[nodiscard]] void* foo();\n```\n\n```\nint main()\n```"
