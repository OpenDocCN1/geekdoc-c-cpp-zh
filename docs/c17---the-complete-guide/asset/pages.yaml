  md: '```

    oos1 = "hello";        // OK: assign new value

    ooc.emplace(std::in_place, 7.2, 8.3);

    ```


    Due to the two levels of having no value, an optional of optional enables you
    to have “no value” on the outside or on the inside, which can have different semantic
    meanings:


    ```

    *oos1 = std::nullopt;  // inner optional has no value

    oos1 = std::nullopt;   // outer optional has no value

    ```


    This means that you have to take special care to deal with the optional value:


    ```

    if (!oos1) std::cout << "no value\n";

    if (oos1 && !*oos1) std::cout << "no inner value\n";

    if (oos1 && *oos1) std::cout << "value: " << **oos1 << ''\n'';

    ```


    However, from a semantic perspective, this is a type with two different states
    that both represent having no value. Therefore, a std::variant<> with two Boolean
    or monostate alternatives might be more appropriate.


    # 15.4 Afternotes


    Optional objects were first proposed in 2005 by Fernando Cacciola in http://wg21.link/n1878,
    referring to Boost.Optional as a reference implementation. This class was adopted
    as part of the Library Fundamentals TS as proposed by Fernando Cacciola and Andrzej
    Krzemienski in http://wg21.link/n3793.


    The class was adopted with other components for C++17 as proposed by Beman Dawes
    and Alisdair Meredith in http://wg21.link/p0220r1.


    Tony Van Eerd significantly improved the semantics for comparison operators with
    http://wg21.link/n3765 and http://wg21.link/p0307r2. Vicente J. Botet Escriba
    harmonized the API with std::variant<> and std::any with http://wg21.link/p0032r3.
    Jonathan Wakely fixed the behavior for in_place tag types with http://wg21.link/p0504r0.'
