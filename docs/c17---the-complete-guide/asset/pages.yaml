    \               // v2 == true, v2 is bool\nauto v3 = val<'a'>;               \
    \ // v3 == 'a', v3 is char\n```\n\nTo clarify what is happening here:\n\n```\n\
    std::is_same_v<decltype(val<5>), int>          // yields false\nstd::is_same_v<decltype(val<5>),\
    \ const int>    // yields true\nstd::is_same_v<decltype(v1), int>;           \
    \  // yields true (because auto decays)\n```\n\n# 13.3 Using decltype(auto) as\
    \ Template Parameter\n\nYou can also use the other placeholder type decltype(auto)\
    \ (introduced with C++14) as template parameter. However, note that this type\
    \ has very special rules regarding how the type is deduced. According to the rules\
    \ of decltype, if expressions instead of names are passed to decltype(auto), the\
    \ deduction yields a type that depends on the value category of the expression:\n\
    \n+   - type for a prvalue (e.g., temporaries)\n+   - type& for an lvalue (e.g.,\
    \ objects with names)\n+   - type&& for an xvalue (e.g., objects marked with std::move()).\n\
    \nThat means that you can easily deduce template parameters to become references,\
    \ which might result in surprising effects.\n\nFor example:\n\ntmp1/decltypeauto.cpp\n\
    \n```\n#include <iostream>\n\ntemplate<decltype(auto) N>\nstruct S {\n    void\
    \ printN() const {\n        std::cout << \"N: \" << N << '\\n';\n    }\n};\n\n\
    static const int c = 42;\nstatic int v = 42;\n\nint main()\n{\n    S<c> s1;  \
    \      // deduces N as const int 42\n    S<(c)> s2;      // deduces N as const\
    \ int& referring to c\n    s1.printN();\n```"
