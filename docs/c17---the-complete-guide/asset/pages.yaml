    # 8.6 UTF-8 Character Literals


    Since C++11, C++ supports the prefix u8 for UTF-8 string literals. However, the
    prefix was not enabled for character literals. C++17 fixes this gap, so that you
    can write:


    ```

    auto c = u8 ''6'';  // character 6 with UTF-8 encoding value

    ```


    In C++17, the type of u8 ''6'' is char, which might change in C++20 to char8_t,
    so that using auto here might be appropriate.


    This way you guarantee that your character value is the value of the character
    ''6'' in UTF-8. You can use all 7-bit US-ASCII characters for which the UTF-8
    code has the same value. That is, u8 ''6'' specifies to have the correct character
    value for the character ''6'' according to 7-bit US-ASCII (and therefore also
    according to ISO Latin-1, ISO-8859-15, and the basic Windows character set).³
    Usually, your source code interprets characters in US-ASCII/UTF-8 anyway meaning
    that the prefix is not necessary. The value of c will almost always be 54 (hexadecimal
    36).


    To give you some background regarding where the prefix might be necessary: for
    character and string literals in source code, C++ standardizes the characters
    you can use but not their values. The values depend on the source character set.
    And when the compiler generates the code for the executable program, it uses the
    execution character set. The source character set is almost always 7-bit US-ASCII
    and the execution character set is usually the same; this means that in any C++
    program, all character and string literals (with and without the u8 prefix) have
    the same value.


    However, in very rare scenarios, this might not be the case. For example, on old
    IBM hosts, which (still) use the EBCDIC character set, the character ''6'' would
    have the value 246 (hexadecimal F6) instead. In a program using an EBCDIC character
    set, the value of the character c above would therefore be 246 instead of 54,
    and running the program on a UTF-8 encoding platform might therefore print the
    character δ, which is the character with the value of 246 in ISO/IEC 8859-x encodings
    (if available). In situations like this, the prefix might be necessary.


    Note that u8 can be used only for single characters and characters that have a
    single byte (code unit) in UTF-8. An initialization such as:


    ```

    char c = u8 ''ö'';

    ```


    is not allowed because the value of the German umlaut ö in UTF-8 is a sequence
    of two bytes, 195 and 182 (hexadecimal C3 B6).


    As a result, both character and string literals now accept the following prefixes:


    ³ ISO Latin-1 is formally named ISO-8859-1, while the ISO character set that was
    introduced to include the European Euro symbol €, ISO-8859-15, is also named ISO
    Latin-9 (yes, this is not a spelling error).'
