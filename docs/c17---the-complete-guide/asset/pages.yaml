  md: '# 35.2.3 unary_function and binary_function


    The helper types for implementing function objects, std::unary_function and std::binary_function,
    were finally removed. They were provided to support a simple, standardized way
    for type definitions when defining function objects. However, with all the new
    language features of C++11 (lambdas, decltype, ...) they are no longer necessary
    or are inapplicable in some situations.


    Remove the base class and provide the necessary type definitions manually.


    # 35.2.4 ptr_fun(), mem_fun(), and Binders


    The binders and the wrappers for creating more sophisticated function call adapters
    were finally removed:


    +   - Instead of std::ptr_fun(), you can now use lambdas, the class template std::function<>,
    and the function template std::bind().

    +   - Instead of std::mem_fun() and std::mem_fun_ref(), you can now use lambdas
    and std::mem_fn().

    +   - Instead of std::bind1st() and std::bind2nd(), you can now use lambdas and
    the function template std::bind().


    # 35.2.5 Allocator Support for std::function<>


    Originally, the class template std::function<> was standardized with allocator
    support. However, no major compiler implemented the support completely and the
    specification raised some interesting issues in terms of behavior (see library
    issues 2385, 2386, 2062, 2370, 2501, 2502).


    As a result, allocator support for std::function<> was removed with C++17.


    # 35.2.6 Deprecated IOStream Aliases


    The IOStream aliases for types and functions that were already deprecated in C++98
    were finally removed:


    +   - Type io_state in std::ios_base

    +   - Type open_mode in std::ios_base

    +   - Type seek_dir in std::ios_base

    +   - Type streamoff in std::ios_base

    +   - Type streampos in std::ios_base

    +   - stossc() in std::std::basic_streambuf<>

    +   - clear(io_state) in std::basic_ios<>

    +   - setstate(io_state) in std::basic_ios<>

    +   - exceptions(io_state) in std::basic_ios<>

    +   - pubseekoff(off_type, ios_base::seek_dir, ios_base::open_mode) in std::basic_streambuf<>

    +   - pubseekpos(pos_type, ios_base::open_mode) in std::basic_streambuf<>

    +   - open(const char*, ios_base::open_mode) in std::basic_filebuf<>, std::basic_ifstream<>,
    and std::basic_ofstream<>'
  merge: -1
