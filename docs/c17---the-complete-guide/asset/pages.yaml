- pgno: 189
  md: "# 16.5 Special Cases with std::variant<>\n\nSpecific variants can result in\
    \ special or unexpected behavior.\n\n# 16.5.1 Having Both bool and std::string\
    \ Alternatives\n\nIf a std::variant<> has both a bool and a std::string alternative,\
    \ assigning string literals can produce surprises because a string literal converts\
    \ better to bool than to std::string. For example:\n\n```\nstd::variant<bool,\
    \ std::string> v;\nv = \"hi\";  // OOPS: sets the bool alternative\nstd::cout\
    \ << \"index: \" << v.index() << '\\n';\nstd::visit([](const auto& val) {\n  \
    \  std::cout << \"value: \" << val << '\\n';\n},\nv);\n```\n\nThis code snippet\
    \ will have the following output:\n\n```\nindex: 0\nvalue: true\n```\n\nThus,\
    \ the string literal is interpreted as initializing the variant by the Boolean\
    \ value true (true because the pointer is not 0).\n\nThere are a couple of options\
    \ to “fix” the assignment here:\n\n```\nv.emplace<1>(\"hello\");          // explicitly\
    \ assign to second alternative\n\nv.emplace<std::string>(\"hello\");  // explicitly\
    \ assign to string alternative\n\nv = std::string{\"hello\"};         // make\
    \ sure a string is assigned\n\nusing namespace std::literals;     // make sure\
    \ a string is assigned\nv = \"hello\"s;\n```\n\nSee http://wg21.link/p0608 for\
    \ further discussion of this issue.\n\n# 16.6 Afternotes\n\nVariant objects were\
    \ first proposed in 2005 by Axel Naumann in http://wg21.link/n4218, referring\
    \ to Boost.Variant as a reference implementation. The finally accepted wording\
    \ was formulated by Axel Naumann in http://wg21.link/p0088r3.\n\nTony Van Eerd\
    \ significantly improved the semantics for comparison operators with http://wg21.link/p0393r3.\
    \ Vicente J. Botet Escriba harmonized the API with std::optional<> and std::any\
    \ with http://wg21.link/p0032r3. Jonathan Wakely fixed the behavior for in_place\
    \ tag types with http://wg21.link/p0504r0. The restriction to disallow references,\
    \ incomplete types, arrays, and empty variants was formulated by Erich Keane with\
    \ http://wg21.link/p0510r0."
