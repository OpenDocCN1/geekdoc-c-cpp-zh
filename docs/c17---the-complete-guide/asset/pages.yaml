  md: "and initializing an array from an lvalue of an array is not allowed. It is\
    \ like trying to compile:\n\n```\nconst char x[3] = \"hi\";\nconst char y[6] =\
    \ \"world\";\nchar first[3] {x};      // ERROR\nchar second[6] {y};    // ERROR\n\
    ```\n\nNote that we would not have this problem when declaring the parameter to\
