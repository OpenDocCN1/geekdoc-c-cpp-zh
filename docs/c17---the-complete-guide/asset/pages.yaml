  md: "# 9.2.6 Standard Deduction Guides\n\nThe C++ standard library introduces a\
    \ couple of deduction guides with C++17.\n\n# Deduction Guides for Pairs and Tuples\n\
    \nAs introduced in the motivation for deduction guides, std::pair needs deduction\
    \ guides to ensure that class template argument deduction uses the decayed type\
    \ of the passed argument:³\n\n```\nnamespace std {\n    template<typename T1,\
    \ typename T2>\n    struct pair {\n        ...\n        constexpr pair(const T1&\
    \ x, const T2& y);  // take argument by-reference\n        ...\n    };\n\n   \
    \ template<typename T1, typename T2>\n    pair(T1, T2) -> pair<T1, T2>;  // deduce\
    \ argument types by-value\n}\n```\n\nAs a consequence, the declaration\n\n```\n\
    std::pair p{\"hi\", \"world\"};  // takes const char [3] and const char [6]\n\
    ```\n\nis equivalent to:\n\n```\nstd::pair<const char*, const char*> p{\"hi\"\
    , \"world\"};\n```\n\nFor the variadic class template std::tuple, the same approach\
    \ is used:\n\n```\nnamespace std {\n    template<typename... Types>\n    class\
    \ tuple {\n    public:\n        constexpr tuple(const Types&...);  // take arguments\
    \ by-reference\n        template<typename... UTypes> constexpr tuple(UTypes&&...);\n\
    \        ...\n    };\n\n    template<typename... Types>\n    tuple(Types...) ->\
    \ tuple<Types...>;  // deduce argument types by-value\n};\n```\n\nAs a consequence,\
    \ the declaration:\n\n```\nstd::tuple t{42, \"hello\", nullptr};\n```\n\n deduces\
    \ the type of t as std::tuple<int, const char*, std::nullptr_t>."
