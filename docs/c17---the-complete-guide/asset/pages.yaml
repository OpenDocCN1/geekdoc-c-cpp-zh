    \ beg1, InputIterator1 end1,\n    InputIterator2 beg2,\n    T initVal,\n    BinaryOp1\
    \ op1, BinaryOp2 op2)\n```\n\n+   - The first form computes and returns the inner\
    \ product of initVal and all elements in the range [beg,end) multiplied by the\
    \ elements in the range starting with beg2. In particular, it calls the following\
    \ for all corresponding elements:\n+     initVal = initVal + elem1 * elem2\n+\
    \   - The second form computes and returns the result of calling op for initVal\
    \ and all elements in the range [beg1,end1) combined with the elements in the\
    \ range starting with beg2. In particular, it calls the following for all corresponding\
    \ elements:\n+     initVal = op1(initVal, op2(elem1, elem2))\n+   - Thus, for\
    \ the values\n+     a1 a2 a3 ...\n+     b1 b2 b3 ...\n+     the forms compute\
    \ and return either\n+     initVal + (a1 * b1) + (a2 * b2) + (a3 * b3) + ...\n\
    +     or\n+     initVal op1 (a1 op2 b1) op1 (a2 op2 b2) op1 (a3 op2 b3) op ...\n\
    +     respectively.\n+   - If the range is empty (beg==end), all forms return\
    \ initVal.\n+   - The caller must ensure that the range starting with beg2 contains\
    \ enough elements to overwrite (in fact, at least as many elements as in the range\
    \ [beg,end)), or that insert iterators are used.\n+   - op1 and op2 must not modify\
    \ the passed arguments.\n+   - Complexity: linear (numElems calls of operator\
