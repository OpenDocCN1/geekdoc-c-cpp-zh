- pgno: 64
  md: '# Value Categories Since C++11


    Since C++11, the value categories are as described in Figure 5.1: We have the
    primary categories lvalue, prvalue (“pure rvalue”), and xvalue (“eXpiring value”).
    The composite categories are: glvalue (“generalized lvalue,” which is the union
    of lvalue and xvalue) and rvalue (the union of xvalue and prvalue).


    ![](img/c238a88db1e46699358aa4a874079892_64_0.png)


    Figure 5.1. Value categories since C++11


    Examples of lvalues are:


    +   - An expression that is just the name of a variable, function, or data member
    (except a plain value member of an rvalue)

    +   - An expression that is just a string literal (e.g., "hello")

    +   - The return value of a function if it is declared to return an lvalue reference
    (return type Type&)

    +   - Any reference to a function, even when marked with std::move()

    +   - The result of the built-in unary * operator (i.e., what dereferencing a
    raw pointer yields)


    Examples of prvalues are:


    +   - Expressions that consist of a built-in literal that is not a string literal
    (e.g., 42, true, or nullptr)

    +   - The return type of a function if it is declared to return by value (return
    type Type)

    +   - The result of the built-in unary & operator (i.e., what taking the address
    of an expression yields)

    +   - A lambda expression


    Examples of xvalues are:


    +   - The result of marking an object with std::move()

    +   - A cast to an rvalue reference of an object type (not a function type)

    +   - The returned value of a function if it is declared to return an rvalue reference
    (return type Type&&)

    +   - A non-static value member of an rvalue


    Roughly speaking:


    +   - All names used as expressions are lvalues.

    +   - All string literals used as expression are lvalues.

    +   - All other literals (4.2, true, or nullptr) are prvalues.

    +   - All temporaries without a name (especially objects returned by value) are
    prvalues.

    +   - All objects marked with std::move() and their value members are xvalues.'
