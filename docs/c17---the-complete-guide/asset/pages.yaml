  md: "# Chapter 30\n\n# new and delete with Over-Aligned Data\n\nSince C++11, you\
    \ can specify over-aligned types, which have a bigger alignment than the default\
    \ alignment, by using the alignas specifier. For example:\n\n```\nstruct alignas(32)\
    \ MyType32 {\n\tint i;\n\tchar c;\n\tstd::string s[4];\n};\n```\n\nMyType32 val1;\
    \ // 32-byte aligned\nalignas(64) MyType32 val2; // 64-byte aligned\n\nNote that\
    \ the alignment value must be a power of 2 and specifying any value less than\
    \ the default alignment for the type is an error.¹\n\nHowever, dynamic/heap allocation\
    \ of over-aligned data is not handled correctly in C++11 and C++14. Using operator\
    \ new for over-aligned types by default ignores the requested alignment, which\
    \ means that a type that is usually 64-byte aligned might, for example, only be\
    \ 8-byte or 16-byte aligned.\n\nThis gap was closed with C++17. The new behavior\
    \ provides new overloads with an alignment argument to allow you to provide your\
    \ own implementations of operator new for over-aligned data.\n\n\n\nBy using an\
    \ over-aligned type such as:\n\n```\nstruct alignas(32) MyType32 {\n\tint i;\n\
    };\n```"
