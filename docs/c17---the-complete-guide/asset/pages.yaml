  md: '# Chapter 29


    # Polymorphic Memory Resources (PMR)


    Since C++98, the standard library has supported the ability to configure the way
    classes allocate their internal (heap) memory. Therefore, almost all types in
    the standard library that allocate memory have an allocator parameter. This allows
    you to configure the way containers, strings, and other types allocate their internal
    memory if they need more space than that allocated on the stack.


    The default way to allocate this memory is to allocate it from the heap. However,
    there are different reasons for modifying this default behavior:


    +   - You can use your own way of allocating memory to reduce the number of system
    calls.

    +   - You can ensure that memory is allocated contiguously to benefit from CPU
    caching.

    +   - You can place containers and their elements in shared memory available for
    multiple processes.

    +   - You can even redirect these heap memory calls to use memory allocated earlier
    on the stack.


    Thus, there can be performance and functional reasons for modifying the default
    behavior.


    However, until C++17, using allocators (correctly) was in many ways both tricky
    and clumsy (due to some flaws, too much complexity, and modifications with backward
    compatibility).


    C++17 now provides a fairly easy-to-use approach for predefined and user-defined
    ways of memory allocation, which can be used for standard types and user-defined
    types.


    Therefore, this chapter discusses:


    +   - Using standard memory resources provided by the standard library

    +   - Defining custom memory resources

    +   - Providing memory resource support for custom types


    This chapter would not have been possible without the significant help of Pablo
    Halpern, Arthur O’Dwyer, David Sankel, and Jonathan Wakely.


    1 The initial reason for allocators was to be able to deal with pointers of different
    size (“near” and “far” pointers).'
