- pgno: 370
  md: '# 29.1.3 Standard Memory Resources in Detail


    Let us discuss the different standard memory resources in detail.


    # new_delete_resource()


    new_delete_resource() is the default memory resource. It is returned by get_default_resource()
    unless you have defined a different default memory resource by calling set_default_resource().
    This resource handles allocations in the same way that they are handled when using
    the default allocator:


    +   - Each allocation calls new

    +   - Each deallocation calls delete


    However, note that a polymorphic allocator with this memory resource is not interchangeable
    with the default allocator because they simply have different types. Therefore


    ```

    std::string s{"my string with some value"};

    std::pmr::string ps{std::move(s), std::pmr::new_delete_resource()}; // copies

    ```


    will not move (pass the allocated memory for s to ps). Instead, the memory of
    s will be copied to the new memory of ps allocated with new.


    # (un)synchronized_pool_resource


    synchronized_pool_resource and unsynchronized_pool_resource are classes for memory
    resources that try to locate all memory close to each other. Thus, they force
    only minimal fragmentation of memory.


    The difference is that synchronized_pool_resource is thread-safe (which costs
    more performance), while unsynchronized_pool_resource is not. Therefore, if you
    know that the memory of this pool is handled only by a single thread (or that
    (de)allocations are synchronized), unsynchronized_pool_resource is the better
    choice.


    Both classes still use an underlying memory resource to actually perform the allocations
    and deallocations. They act only as a wrapper that ensures that these allocations
    are better clustered. Thus,


    ```

    std::pmr::synchronized_pool_resource myPool;

    ```


    is the same as


    ```

    std::pmr::synchronized_pool_resource myPool{std::pmr::get_default_resource()};

    ```


    In addition, they deallocate all memory when the pool is destroyed.


    One major application of these pools is to ensure that elements in a node-based
    container are located next to each other. This may also increase the performance
    of the containers significantly, because then the CPU caches load elements together
    in cache lines. The effect is that after you have accessed one element, accessing
    other elements becomes very fast because they are already in the cache. However,
    you should measure, because the performance depends on the implementation of the
    memory resource. For example, if the memory resource uses a mutex to synchronize
    memory access, performance might become significantly worse.


    Let us look at the effect with a simple example. The following program creates
    a map that maps integral values to strings.'
