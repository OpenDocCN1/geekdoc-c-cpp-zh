- pgno: 71
  md: "# Chapter 6: Lambda Extensions\n\nNote that we use the lambda hashed in the\
    \ case labels at compile time, but inside the switch expression we use it at run\
    \ time.\n\nIf we initialize a container using a compile-time lambda, it becomes\
    \ more likely that an optimizing compiler will compute the initial values at compile\
    \ time (here, also using class template argument deduction for std::array):\n\n\
    ```\nfor std::array:\nstd::array arr{hashed(\"beer\"), hashed(\"wine\"), hashed(\"\
    water\")};\n```\n\nYou can even parameterize such a constexpr lambda with another\
    \ constexpr lambda. Assume that we parameterized the lambda hashed according to\
    \ the way a hash value is combined with the next character value:\n\n```\nauto\
    \ hashed = [](const char* str, auto combine) {\n  std::size_t hash = 5381; //\
    \ initial hash value\n  while (*str != '\\0') {\n    hash = combine(hash, *str++);\
    \ // combine hash value with next character\n  }\n  return hash;\n};\n```\n\n\
    The lambda can then be used at compile time as follows:\n\n```\nconstexpr std::size_t\
    \ hv1{hashed(\"wine\", [](auto h, char c){return h*3 + c;});}\nconstexpr std::size_t\
    \ hv2{hashed(\"wine\", [](auto h, char c){return h^3 + c;});}\n```\n\nHere, we\
    \ initialize two different hash values for \"wine\" at compile time using different\
    \ sub-algorithms for combining a hash value with the value of the next character.\
    \ Both the lambda hashed and the passed lambdas are called at compile time.\n\n\
    # 6.2 Passing Copies of this to Lambdas\n\nWhen using lambdas in non-static member\
    \ functions, you have no implicit access to the object the member function is\
    \ called for. That is, inside the lambda, you cannot use members of the object\
    \ without capturing this in some form (whether you qualify the members with this->\
    \ does not matter):\n\n```\nclass C {\n  private:\n    std::string name;\n  public:\n\
    \    ...\n    void foo() {\n      auto l1 = []( ){ std::cout << name << '\\n';\
    \ }; // ERROR\n      auto l2 = []( ){ std::cout << this->name << '\\n'; }; //\
    \ ERROR\n      ...\n    }\n  ...\n}\n```"
