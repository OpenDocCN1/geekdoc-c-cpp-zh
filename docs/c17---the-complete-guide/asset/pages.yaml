    \ align);\n```\n\n# 30.3 Implementing Global operator new()\n\nBy default, C++\
    \ platforms now provide a significant number of global overloads for operator\
    \ new() and delete() (including the corresponding array versions):\n\n```\nvoid*\
    \ ::operator new(std::size_t);\nvoid* ::operator new(std::size_t, std::align_val_t);\n\
    void* ::operator new(std::size_t, const std::nothrow_t&) noexcept;\nvoid* ::operator\
    \ new(std::size_t, std::align_val_t,\n    const std::nothrow_t&) noexcept;\n\n\
    void ::operator delete(void*) noexcept;\nvoid ::operator delete(void*, std::size_t)\
    \ noexcept;\nvoid ::operator delete(void*, std::align_val_t) noexcept;\nvoid ::operator\
    \ delete(void*, std::size_t, std::align_val_t) noexcept;\nvoid ::operator delete(void*,\
    \ const std::nothrow_t&) noexcept;\nvoid ::operator delete(void*, std::align_val_t,\n\
    \    const std::nothrow_t&) noexcept;\n\nvoid* ::operator new[](std::size_t);\n\
    void* ::operator new[](std::size_t, std::align_val_t);\nvoid* ::operator new[](std::size_t,\
    \ const std::nothrow_t&) noexcept;\nvoid* ::operator new[](std::size_t, std::align_val_t,\n\
    \    const std::nothrow_t&) noexcept;\n\nvoid ::operator delete[](void*) noexcept;\n\
    void ::operator delete[](void*, std::size_t) noexcept;\nvoid ::operator delete[](void*,\
    \ std::align_val_t) noexcept;\nvoid ::operator delete[](void*, std::size_t, std::align_val_t)\
    \ noexcept;\nvoid ::operator delete[](void*, const std::nothrow_t&) noexcept;\n\
    void ::operator delete[](void*, std::align_val_t,\n    const std::nothrow_t&)\
    \ noexcept;\n```\n\nIf you want to implement your own memory management (e.g.,\
    \ to allow you to debug dynamic memory calls), you do not have to override all\
    \ of these overloads. It is sufficient to implement the following basic functions\
    \ because by default, all other functions (including all array versions) call\
    \ one of these basic functions:\n\n```\nvoid* ::operator new(std::size_t);\nvoid*\
    \ ::operator new(std::size_t, std::align_val_t);\nvoid ::operator delete(void*)\
    \ noexcept;\nvoid ::operator delete(void*, std::size_t) noexcept;\nvoid ::operator\
    \ delete(void*, std::align_val_t) noexcept;\n```"
