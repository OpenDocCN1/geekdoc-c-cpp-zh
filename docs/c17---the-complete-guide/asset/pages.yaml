  md: "# 22.6 Motivation for New Algorithms for Parallel Processing\n\nSome supplementary\
    \ algorithms were introduced to handle the parallel processing of standard algorithms\
    \ available since C++98.\n\n# 22.6.1 reduce ()\n\nFor example, reduce() was introduced\
    \ as a parallel form of accumulate(), which “accumulates” all elements (you can\
    \ define which operation performs the “accumulation”). For example, consider the\
    \ following use of accumulate():\n\n```\n#include <iostream>\n#include <vector>\n\
    #include <numeric> // for accumulate()\n\nvoid printSum(long num)\n{\n // create\
    \ coll with num sequences of 1 2 3 4:\n std::vector<long> coll;\n coll.reserve(num\
    \ * 4);\n for (long i=0; i < num; ++i) {\n coll.insert(coll.end(), {1, 2, 3, 4});\n\
    \ }\n \n auto sum = std::accumulate(coll.begin(), coll.end(), 0L);\n std::cout\
    \ << \"accumulate(): \" << sum << '\\n';\n}\n\nint main()\n{\n printSum(1);\n\
    \ printSum(1000);\n printSum(1000000);\n printSum(10000000);\n}\n\n```\n\nWe compute\
    \ the sum of all elements, which outputs:\n\naccumulate(): 10\naccumulate(): 10000\n\
    accumulate(): 1000000\naccumulate(): 10000000"
