    \   std::cout << '\\n';\n}\n\nint main()\n{\n    std::multimap<double, std::string>\
    \ src {{1.1, \"one\"},\n                                            {2.2, \"two\"\
    },\n                                            {3.3, \"three\"}};\n    std::map<double,\
    \ std::string> dst {{3.3, \"old data\"}};\n\n    print(src, dst);\n\n    // merge\
    \ all elements from src into dst:\n    dst.merge(src);\n\n    print(src, dst);\n\
    }\n```\n\nhas the following output:\n\n```\nvalues:\n    [1.1:one]  [2.2:two]\
    \  [3.3:three]\n    [3.3:old data]\nvalues:\n    [3.3:three]\n    [1.1:one]  [2.2:two]\
    \  [3.3:old data]\n```\n\nPointers and references to the merged elements remain\
    \ valid but change the container they refer to."
