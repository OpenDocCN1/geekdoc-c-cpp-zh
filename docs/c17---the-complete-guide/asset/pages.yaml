- pgno: 365
  md: "First, we allocate our own memory on the stack (using the new type std::byte):\n\
    \n```\n// allocate some memory on the stack:\nstd::array<std::byte, 200000> buf;\n\
    ```\n\nInstead of std::byte you could also just use char.\n\nThen, we initialize\
    \ a monotonic_buffer_resource with this memory, passing its address and its size:\n\
    \n```\nstd::pmr::monotonic_buffer_resource pool{buf.data(), buf.size()};\n```\n\
    \nFinally, we use a std::pmr::vector, which takes the memory resource for all\
    \ its allocations:\n\n```\nstd::pmr::vector<std::string> coll{&pool};\n```\n\n\
    This declaration is just a shortcut for the following:\n\n```\nstd::vector<std::string,\n\
    \    std::pmr::polymorphic_allocator<std::string>> coll{&pool};\n```\n\nThat is,\
    \ we declare that the vector uses a polymorphic allocator, which can switch between\
    \ different memory resources at runtime. The class monotonic_buffer_resource is\
    \ derived from the class memory_resource and can therefore be used as a memory\
    \ resource for a polymorphic allocator. So, by passing the address of our memory\
    \ resource, we ensure that the vector uses our memory resource as a polymorphic\
    \ allocator.\n\nIf we measure the allocated memory of this program, the output\
    \ might become:\n\n```\n1000 allocations for 32000 bytes\n```\n\nThe 18 allocations\
    \ of the vector are no longer performed on the heap. Instead, our initialized\
    \ buffer buf is used.\n\nIf the pre-allocated memory of 200,000 bytes is not sufficient,\
    \ the vector will still allocate more memory on the heap. This happens because\
    \ the monotonic_memory_resource uses the default allocator, which allocates memory\
