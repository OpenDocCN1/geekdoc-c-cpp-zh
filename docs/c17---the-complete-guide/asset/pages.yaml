  md: '# Chapter 35


    # Deprecated and Removed Features


    There are a few features that were deprecated in C++17 or finally removed.

    Implementations might still provide removed features but you cannot rely on that.
    Implementations might or might not issue a warning if you use deprecated features.


    # 35.1 Deprecated and Removed Core Language Features


    # 35.1.1 Throw Specifications


    Dynamic exception specifications are no longer supported (they have been deprecated
    since C++11):


    ```

    void f6() throw(std::bad_alloc);  // ERROR: invalid since C++17

    ```


    The empty throw specification can still be used but is still deprecated:


    ```

    void f5() throw();  // deprecated since C++11

    ```


    Use noexcept instead (which is now part of the type of a function):


    ```

    void f5() noexcept;  // OK

    ```


    # 35.1.2 Keyword register


    The keyword register no longer has any standardized semantics but is still reserved:


    ```

    register int x = 42;  // ERROR since C++17

    ```


    ```

    std::string register;  // still ERROR in all C++ versions

    ```


    One reason why register is still reserved is that it is still a keyword with standardized
    semantics in C (e.g., it can appear in a function parameter list).


    Because the keyword was already deprecated in C++11 and C++14, if a compilation
    fails due to using register, simply remove the keyword.'
