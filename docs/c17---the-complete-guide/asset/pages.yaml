    \n+   - c_str() does the same but yields the result as a null terminated character\
    \ sequence. Note that using this function is also not portable, because printing\
    \ the sequence with std::cout does not result in the correct output on Windows.\
    \ You have to use std::wcout there.\n\n+   - make_preferred() replaces any directory\
    \ separator except for the root name with the native directory separator. Note\
    \ that this is the only function that modifies the path it is called for. Thus,\
