- pgno: 44
  md: "As another example, consider inserting a new element into a map or unordered\
    \ map. You can check whether this was successful as follows:\n\n```\nstd::map<std::string,\
    \ int> coll;\n...\nif (auto [pos,ok] = coll.insert({\"new\",42}); !ok) {\n   \
    \ // if insert failed, handle error using iterator pos:\n    const auto& [key,val]\
    \ = *pos;\n    std::cout << \"already there: \" << key << '\\n';\n}\n```\n\nHere,\
    \ we also use structured bindings to give both the return value and the element\
    \ at the return position pos useful names instead of just first and second. Before\
    \ C++17, the corresponding check had to be formulated as follows:\n\n```\nauto\
    \ ret = coll.insert({\"new\",42});\nif (!ret.second){\n    // if insert failed,\
    \ handle error using iterator ret.first\n    const auto& elem = *(ret.first);\n\
    \    std::cout << \"already there: \" << elem.first << '\\n';\n}\n```\n\nNote\
    \ that the extension also applies to the new compile-time if feature.\n\n# 2.2\
    \ switch with Initialization\n\nUsing the switch statement with an initialization\
    \ allows us to initialize an object/entity for the scope of the switch before\
    \ formulating the condition to decide where to continue the control flow.\n\n\
    For example, we can initialize a filesystem path before we deal with its category:\n\
    \n```\nnamespace fs = std::filesystem;\n...\nswitch (fs::path p{name}; status(p).type())\
    \ {\n    case fs::file_type::not_found:\n        std::cout << p << \" not found\\\
    n\";\n        break;\n    case fs::file_type::directory:\n        std::cout <<\
    \ p << \":\\n\";\n        for (const auto& e : std::filesystem::directory_iterator{p})\
    \ {\n            std::cout << \"- \" << e.path() << '\\n';\n        }\n      \
    \  break;\n    default:\n        std::cout << p << \" exists\\n\";\n        break;\n\
    }\n```\n\nHere, the initialized path p can be used throughout the whole switch\
    \ statement."
