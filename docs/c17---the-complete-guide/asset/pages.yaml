  md: "By using visitors, we can then iterate over the elements and “do the right\
    \ thing” depending on the element type:\n\n```\nstd::vector<GeoObj> figure = createFigure();\n\
    for (const GeoObj& geoobj : figure) {\n    std::visit([] (const auto& obj) {\n\
    \        obj.draw();  // polymorphic call of draw()\n    },\n    geoobj);\n}\n\
    ```\n\nHere, visit() uses a generic lambda to be instantiated for each possible\
    \ GeoObj type. That is, when compiling the visit() call, the lambda is instantiated\
    \ and compiled as three functions:\n\n+   - Compiling the code for type Line:\n\
    +     [] (const Line& obj) {\n+       obj.draw();  // call of Line::draw()\n+\
    \     }\n+   - Compiling the code for type Circle:\n+     [] (const Circle& obj)\
    \ {\n+       obj.draw();  // call of Circle::draw()\n+     }\n+   - Compiling\
    \ the code for type Rectangle:\n+     [] (const Rectangle& obj) {\n+       obj.draw();\
    \  // call of Rectangle::draw()\n+     }\n\nIf one of these instantiations does\
    \ not compile, the call of visit() does not compile at all. If all compiles, code\
    \ is generated that, for each element type, calls the corresponding function.\
    \ Note that the generated code is not an if-else chain. The standard guarantees\
    \ that the performance of the calls does not depend on the number of alternatives.\n\
    \nThat is, effectively, we get the same behavior as a virtual function table (with\
    \ something like a local virtual function table for each visit()). Note that the\
    \ called draw() functions do not have to be virtual.\n\nIf the type interfaces\
    \ differ, we can use compile-time if or visitor overloading to deal with this\
    \ situation (see the second example below).\n\n# 16.4.2 Other Heterogeneous Collections\
    \ with std::variant\n\nAs another example of using heterogeneous collections with\
    \ std::variant<>, consider the following example:\n\nlib/variantpoly2.cpp\n\n\
    ```\n#include <iostream>\n#include <string>\n#include <variant>\n#include <vector>\n\
    ```"
