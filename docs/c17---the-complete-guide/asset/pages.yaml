    \ dynamic_pointer_cast, and const_pointer_cast, you can now call reinterpret_pointer_cast\
    \ to reinterpret the type of the bits a shared pointer refers to.\n\n# 28.2.3\
    \ weak_type for Shared Pointers\n\nTo support the use of weak pointers in generic\
    \ code, shared pointers now provide a member weak_type.\nFor example:\n\n```\n\
    template<typename T>\nvoid observe(T sp)\n{\n    // initialize weak pointer from\
    \ passed shared pointer:\n    typename T::weak_type wp{sp};\n    ...\n}\n```\n\
    \n# 28.2.4 weak_from_this for Shared Pointers\n\nSometimes you need another shared\
    \ pointer to an existing object without having access to the existing shared pointer(s).\
    \ For this problem, C++11 introduced the base class enable_shared_from_this, which\
    \ provides the member function shared_from_this:\n\n```\n#include <memory>\n\n\
    class Person : public std::enable_shared_from_this<Person>\n{\n    ...\n};\n\n\
    Person* pp = new Person{...};\nstd::shared_ptr<Person> sp1{pp};  // sp1 gets owner\n\
    std::shared_ptr<Person> sp2{pp};  // fatal runtime ERROR: sp2 gets independent\
    \ owners\nstd::shared_ptr<Person> sp3{pp->shared_from_this()}; // OK: sp1 and\
    \ sp3 share ownership\n```"
