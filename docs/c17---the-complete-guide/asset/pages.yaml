  md: "current_path() called for a path argument modifies the current working directory\
    \ of the whole program (it therefore applies to all threads). With the following\
    \ code, you can switch to another working directory and restore the old one when\
    \ leaving the scope:\n\n```\n// save current path:\nauto currentDir{std::filesystem::current_path()};\n\
    \ntry {\n    // change current path temporarily:\n    std::filesystem::current_path(subdir);\n\
    \    ...    // perform some operations\n}\ncatch (...) {\n    // restore current\
    \ path on exception:\n    std::filesystem::current_path(currentDir);\n    throw;\
    \  // rethrow\n}\n// restore current path without exception:\nstd::filesystem::current_path(currentDir);\n\
    ```\n\n# 20.5 Iterating Over Directories\n\nOne key application of the filesystem\
    \ library is to iterate over directories or all files of a filesystem (sub)tree.\n\
    \nThe most convenient way to do this is to use a range-based for loop. You can\
    \ iterate over all files in a directory:\n\n```\nfor (const auto& e : std::filesystem::directory_iterator(dir))\
    \ {\n    std::cout << e.path() << '\\n';\n}\n```\n\nor iterate recursively over\
    \ all files in a filesystem (sub)tree:\n\n```\nfor (const auto& e : std::filesystem::recursive_directory_iterator(dir))\
    \ {\n    std::cout << e.path() << '\\n';\n}\n```\n\nThe passed argument dir can\
    \ be a path or anything implicitly convertible to a path (especially all forms\
    \ of strings).\n\nNote that e.path() yields the file name including the directory\
    \ the iteration was started from. Thus, if we iterate over \".\" a file name file.txt\
    \ becomes ./file.txt or .\\file.txt.\n\nIn addition, this path is written quoted\
    \ to a stream, which means that the output for this file name becomes \"./file.txt\"\
    \ or \".\\file.txt\". Thus, as discussed before in an initial example, the following\
    \ loop is more portable:\n\n```\nfor (const auto& e : std::filesystem::directory_iterator(dir))\
    \ {\n    std::cout << e.path().lexically_normal().string() << '\\n';\n}\n```"
  merge: -1
  img_proc: true
- pgno: 266
  md: "To iterate over the current directory, pass \".\" as the current directory\
    \ instead of \"..\". Passing an empty path works on Windows but is not portable.\n\
    \n# Directory Iterators Are Ranges\n\nYou might be surprised that you can pass\
    \ an iterator to a range-based for loop because you usually need a range.\n\n\
    The trick is that both directory_iterator and recursive_directory_iterator are\
    \ classes for which global overloads of begin() and end() are provided:\n\n+ \
    \  - begin() yields the iterator itself,\n+   - end() yields the end iterator,\
    \ which you can also create with the default constructor\n\n```\n```cpp\nstd::filesystem::directory_iterator\
    \ di{};\nfor (auto pos = begin(di); pos != end(di); ++pos) {\n    std::cout <<\
    \ pos->path() << '\\n';\n}\n```\n```\n\nOr as follows:\n\n```\n```cpp\nfor (std::filesystem::directory_iterator\
    \ pos{};\n     pos != std::filesystem::directory_iterator{};\n     ++pos) {\n\
    \    std::cout << pos->path() << '\\n';\n}\n```\n```\n\n# Directory Iterator Options\n\
    \nWhen iterating over directories, you can pass values of the type directory_options,\
    \ which are listed in table Directory Iterator Options. The type is a bitmask\
    \ scoped enumeration type, defined in namespace std::filesystem.\n\n| directory_options\
    \ | Effect |\n| --- | --- |\n| none | Default (value 0) |\n| follow_directory_symlink\
    \ | Follow symbolic links (rather than skipping them) |\n| skip_permission_denied\
    \ | Skip directories where permission is denied |\n\nThe default behavior is not\
    \ to follow symbolic links and to throw an exception, if you do not have enough\
    \ permissions to iterate over a (sub)directory. With skip_permission_denied, the\
    \ iteration ignores directories you are not allowed to iterate over.\n\nfilesystem/createfiles.cpp\
    \ shows an application of the option follow_directory_symlink."
