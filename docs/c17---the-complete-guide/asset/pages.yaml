  md: "# 30.1.2 Passing the Alignment with the new Expression\n\nThere is also a way\
    \ to request a specific over-alignment for a specific call of new. For example:\n\
    \n```\n#include <new>  //for align_val_t\n...\n\nstd::string* p = new(std::align_val_t{64})\
    \ std::string;  //64-byte aligned\nMyType32* p = new(std::align_val_t{64}) MyType32{};\
    \      //64-byte aligned\n...\n```\n\nThe type std::align_val_t is defined in\
    \ header <new> as follows:\n\n```\nnamespace std {\n  enum class align_val_t :\
    \ size_t {\n  };\n}\n```\n\nstd::align_val_t is provided to allow you to now pass\
    \ alignment requests to the corresponding implementation of operator new().\n\n\
    # Passing Alignment with new Affects delete\n\nRemember that operator new() can\
    \ be implemented in different ways in C++:\n\n+   - As a global function (different\
    \ overloads are provided by default, which can be replaced by the programmer)\n\
    \n+   - As type-specific implementations, which can be provided by the programmer\
    \ and have higher priority than the global overloads\n\nBecause implementations\
    \ might differ in that different memory arenas are used,⁴ special care has to\
    \ be taken to deal with them correctly. The problem is that when specifying a\
    \ special alignment with the new expression, the compiler cannot use the type\
    \ to know whether and which alignment was requested. As a consequence, the programmer\
    \ has to specify which delete to call.⁵\n\nUnfortunately, there is no placement\
    \ delete operator where you can pass an additional argument:\n\n```\ndelete(std::align_val_t{64})\
    \ p;  //ERROR: no placement delete supported\n```\n\nTherefore, you have to call\
    \ the corresponding operator delete() directly, which means:\n\n+   - You have\
    \ to know which of the multiple overloads are implemented so that you call the\
    \ right one.\n\n+   - Before calling operator delete(), you have to call the destructor\
    \ explicitly.\n\nIn fact, you have to call the destructor and the global delete\
    \ if no type-specific delete is defined:\n\n```\nstd::string* p = new(std::align_val_t{64})\
    \ std::string;  //64-byte aligned\n...\n```\n\n⁴ Memory arenas do actually differ.\
    \ For example, Windows has no over-aligned version of HeapAlloc(), which means\
    \ that they must over-allocate and align inside the returned space.\n\n⁵ This\
    \ is not the first time that the type system is not good enough to call the correct\
    \ implementation of delete. The first example was that it is up to the programmer\
    \ to ensure that delete[] is called instead of delete if arrays were allocated."
