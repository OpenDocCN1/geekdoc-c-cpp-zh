  md: "# transform_reduce() for Filesystem Operations\n\nHere is a another example\
    \ of running transform_reduce() in parallel:\n\n```\nlib/dirsiz e.cpp\n#include\
    \ <vector>\n#include <iostream>\n#include <numeric>      // for transform_reduce()\n\
    #include <execution>    // for the execution policy\n#include <filesystem>   //\
    \ filesystem library\n#include <cstdlib>      // for EXIT_FAILURE\n\nint main(int\
    \ argc, char* argv[])\n{\n    // root directory is passed as command line argument:\n\
    \    if (argc < 2) {\n        std::cout << \"Usage: \" << argv[0] << \" <path>\
    \ \\n\";\n        return EXIT_FAILURE;\n    }\n    std::filesystem::path root{argv[1]};\n\
    \n    // init list of all file paths in passed file tree:\n    std::vector<std::filesystem::path>\
    \ paths;\n    try {\n        std::filesystem::recursive_directory_iterator dirpos{root};\n\
    \        std::copy(begin(dirpos), end(dirpos),\n                  std::back_inserter(paths));\n\
    \    }\n    catch (const std::exception& e) {\n        std::cerr << \"EXCEPTION:\
    \ \" << e.what() << std::endl;\n        return EXIT_FAILURE;\n    }\n\n    //\
    \ accumulate size of all regular files:\n    auto sz = std::transform_reduce(\n\
    \                std::execution::par,                 // parallel execution\n\
    \                paths.cbegin(), paths.cend(),        // range\n             \
    \   std::uintmax_t{0},                   // initial value\n                std::plus<>(),\
    \                       // accumulate ...\n                [](const std::filesystem::path&\
    \ p) { // file size if regular file\n                    return is_regular_file(p)\
    \ ? file_size(p)\n                              : std::uintmax_t{0};\n       \
    \         });\n    std::cout << \"size of all \" << paths.size()\n           \
    \   << \" regular files: \" << sz << '\\n';\n}\n```"
