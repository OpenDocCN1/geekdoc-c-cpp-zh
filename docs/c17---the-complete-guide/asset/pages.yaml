- pgno: 287
  md: '+   - **Parallel unsequenced execution** with `par_unseq`

    +     This means that multiple threads might execute the necessary operations
    for multiple elements without the guarantee of one thread executing all steps
    for the element without switching to other elements. In particular, this enables
    vectorized execution, where a thread might first perform the first step of an
    execution for multiple elements before it executes the next step.


    Parallel unsequenced execution needs special support from the compiler/hardware
    to detect where and how operations can be vectorized.


    All execution policies are `constexpr` objects of a corresponding new unique class
    in namespace `std` (`sequenced_policy`, `parallel_policy`, and `parallel_unsequenced_policy`).
    The new type trait `std::is_execution_policy<>` is provided to support generic
    programming that needs special handling of template parameters that are execution
    policies.


    # 22.3 Exception Handling


    All parallel algorithms call `std::terminate()` whenever element access functions
    exit via an uncaught exception.


    Note that this also applies if the sequential execution policy is chosen. If this
    is not acceptable, using the non-parallel version of an algorithm might be the
    better choice.


    Note also that parallel algorithms might still throw. If they fail to acquire
    temporary memory resources for parallel execution, they can throw `std::bad_alloc`.
    However, nothing else may be thrown.


    # 22.4 Benefit of Not Using Parallel Algorithms


    With the ability to call parallel algorithms and the fact that they even provide
    a sequential execution policy, the question might arise as to whether we still
    need the non-parallel algorithms.


    However, besides backward compatibility, using a non-parallel algorithm might
    provide significant benefits:


    +   - Input and output iterators can be used.

    +   - Algorithms do not `terminate()` on exceptions.

    +   - Algorithms may avoid side effects due to an unintended use of elements.

    +   - Algorithms might provide additional functionality, such as `for_each()`
    returning the passed callable to be able to deal with its resulting state.


    1 For example, if a CPU supports registers of 512 bits, a compiler might perform
    computations by loading eight 64-bit values or four 128-bit values into a register
    simultaneously and performing multiple computations with them in parallel.'
