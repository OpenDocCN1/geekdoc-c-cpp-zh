  md: "The key modifications are:\n\n+   - Via command line, we can pass how many\
    \ values we operate on.\n+   - We use the class Timer to measure the duration\
    \ of calling the algorithms.\n+   - We perform multiple measurements in a loop\
    \ to make the durations more mature.\n\nThe result depends significantly on the\
    \ hardware, C++ compiler, and C++ library used. On my laptop (using Visual C++\
    \ on an Intel i7 with 2 cores and hyper-threading), we get the following results:\n\
    \n+   - With 100 elements, the sequential algorithm is significantly (more than\
    \ 10 times) faster. That is because starting and managing the threads takes too\
    \ much time and is not worth it for a few elements.\n+   - With 10,000 elements\
    \ we are close to break even.\n+   - With 1,000,000 elements the parallel execution\
    \ is around three times faster.\n\nAgain, that is not general proof of where and\
    \ when parallel algorithms are worthwhile, but it demonstrates that even for non-trivial\
    \ numeric operations, it can be worth using them.\n\nThe key is that using parallel\
    \ algorithms is worthwhile for:\n\n+   - Long operations\n+   - Many many elements\n\
    \nFor example, using a parallel version of the algorithm count_if(), counting\
    \ the number of even elements in a vector of ints was never worth it, not even\
    \ with 1,000,000,000 elements:\n\n```\nauto num = std::count_if(std::execution::par,\
    \      // execution policy\n    coll.cbegin(), coll.cend(),    // range\n    [](int\
    \ elem){                  // criterion\n        return elem % 2 == 0;\n    });\n\
    ```\n\nIn fact, for a simple algorithm with a fast predicate (as in this example),\
    \ running in parallel probably never pays off. To justify using a parallel algorithm,\
    \ something should happen with each element that takes significant time and is\
    \ independent of the processing of the other elements.\n\nHowever, you cannot\
    \ predict anything because it is up to the implementer of the C++ standard library\
    \ when and how to use parallel threads. In fact, you cannot control how many threads\
    \ are used and the implementation might decide to use multiple threads only with\
    \ a certain number of elements.\n\nMeasure with the typical scenarios on your\
    \ target platform(s).\n\n# 22.1.2 Using a Parallel sort ()\n\nSorting is another\
    \ example where parallel algorithms can help. Because sorting criteria are used\
    \ significantly more than once for each element, you can save significant time.\n\
    \nConsider the initialization of a vector of strings as follows:\n\n```\nstd::vector<std::string>\
    \ coll;\nfor (int i=0; i < numElems / 2; ++i) {\n    coll.emplace_back(\"id\"\
    \ + std::to_string(i));\n    coll.emplace_back(\"ID\" + std::to_string(i));\n\
    }\n```"
