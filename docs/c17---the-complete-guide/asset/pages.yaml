  md: "This means that the output becomes:\n\n```\n42 0.19 \"hello world\" 0.815\n\
    ```\n\nBy using visitor overloading, we could also implement this as follows:\n\
    \n```\nfor (const auto& val : values) {\n    std::visit(overload{\n        []\
    \ (const auto& v) {\n            std::cout << v << ' ';\n        },\n        []\
    \ (const std::string& v) {\n            std::cout << '\"' << v << \"\\\" \";\n\
    \        }\n    },\n    val);\n}\n```\n\nHowever, beware of the traps from overload\
    \ resolution. There are cases where a generic lambda (i.e., a function template)\
    \ is a better match than an implicit type conversion, which means that the wrong\
    \ function might be called.\n\n# 16.4.3 Comparing variant Polymorphism\n\nLet\
    \ us summarize the pros and cons of using std::variant<> for polymorphism and\
    \ heterogeneous collections.\n\nThe benefits are:\n\n+   - You can use any type\
    \ and do not need common base types (the approach is non-intrusive)\n+   - You\
    \ do not have to use pointers for heterogeneous collections\n+   - No need for\
    \ virtual member functions\n+   - Value semantics (no access of freed memory or\
    \ memory leaks)\n+   - Elements in a vector are located together (instead of distributed\
    \ via pointers in heap memory)\n\nThe constraints and drawbacks are:\n\n+   -\
    \ Closed set of types (you have to know all alternatives at compile time)\n+ \
    \  - Elements all have the size of the biggest element type (this is an issue\
    \ if element type sizes differ a lot)\n+   - Copying elements might be more expensive\n\
    \nIn general, I wonder whether to recommend to program polymorphism with std::variant<>\
    \ by default because this approach is a lot safer (no pointers, meaning no new\
    \ and delete) and does not require virtual functions. However, using visitors\
    \ is a bit clumsy, sometimes you need reference semantics (using the same objects\
    \ at multiple places), and there are scenarios where not all types are known at\
    \ compile-time of all code.\n\nPerformance can also be very different. Not calling\
    \ new and delete might save a lot of time. On the other hand, passing objects\
    \ by value might cost a lot of time. In practice, you have to measure, which approach\
    \ is faster for your code. On different platforms, I have seen significant differences\
    \ in performance."
