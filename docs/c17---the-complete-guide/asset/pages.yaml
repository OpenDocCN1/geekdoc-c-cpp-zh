- pgno: 374
  md: 'From time to time the inner block with the loop will allocate memory for the
    vector and its elements. Because we are using a pool, allocations are combined
    into chunks of memory. This might result, for example, in 14 allocations. By calling
    coll.reserve(100) first, this usually becomes only two allocations.


    As written, no deallocation is done as long as the pool exists. Thus, if the creation
    and use of the vector is done in a loop, the memory allocated by the pool will
    continually rise.


    monotonic_buffer_resource also allows us to pass an initial size, which it then
    uses as the minimum size of its first allocation (which is done when the first
    request for memory occurs). In addition, you can define which underlying memory
    resource the resource uses to perform the allocations. This allows us to chain
    memory resources to provide more sophisticated memory resources.


    Consider the following example:


    ```

    { // allocate chunks of memory (starting with 10k) without deallocating: std::pmr::monotonic_buffer_resource
    keepAllocatedPool{10000}; std::pmr::synchronized_pool_resource pool{&keepAllocatedPool};
    for (int j=0; j < 100; ++j) { std::pmr::vector<std::pmr::string> coll{&pool};
    for (int i=0; i < 100; ++i) { coll.emplace_back("just a non-SSO string"); } }
    // deallocations are given back to pool, but not deallocated // so far nothing
    was deallocated } // deallocates all allocated memory

    ```


    With this code, we first create a pool for all of our memory, which never deallocates
    as long as it lives and is initialized by starting to allocate 10,000 bytes (allocated
    using the default memory resource):


    ```

    std::pmr::monotonic_buffer_resource keepAllocatedPool{10000};

    ```


    Then, we create another pool that uses this non-deallocating pool to allocate
    chunks of memory:


    ```

    std::pmr::synchronized_pool_resource pool{&keepAllocatedPool};

    ```


    The combined effect is that we have a pool for all our memory, which starts its
    allocations for 10,000 bytes, allocates more memory with little fragmentation
    if necessary, and can be used by all pmr objects that use the pool.


    The allocated memory, which might be the initial 10,000 bytes plus a few additional
    allocations for bigger chunks of memory, will all be freed when keepAllocatedPool
    goes out of scope.


    What happens here exactly is demonstrated later when we extend this example to
    track all allocations of this nested pool.


    # null_memory_resource()


    null_memory_resource() handles allocations such that each allocation throws a
    bad_alloc exception.


    The most important application is to ensure that a memory pool that uses memory
    allocated on the stack does not suddenly allocate additional memory on the heap.'
