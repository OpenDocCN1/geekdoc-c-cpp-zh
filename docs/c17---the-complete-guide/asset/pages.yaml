  md: '# 20.3.3 Path I/O and Conversions


    Table *Path I/O and Conversions* lists the operations to read or write and to
    yield a converted path. These functions do not take the actual filesystem into
    account. If you have to deal with paths where symbolic links matter, you might
    want to use the *filesystem-dependent path conversions*.


    | Call | Effect |

    |---|---|

    | strm << p | Writes the value of a path as quoted string |

    | strm >> p | Reads the value of a path as quoted string |

    | p.string() | Yields the path as a std::string |

    | p.wstring() | Yields the path as a std::wstring |

    | p.u8string() | Yields the path as a UTF-8 string of type std::u8string |

    | p.u16string() | Yields the path as a UTF-16 string of type std::u16string |

    | p.u32string() | Yields the path as a UTF-32 string of type std::u32string |

    | p.string<...>() | Yields the path as a std::basic_string<...> |

    | p.lexically_normal() | Yields p as normalized path |

    | p.lexically_relative(p2) | Yields the path from p2 to p (empty path if none)
    |

    | p.lexically_proximate(p2) | Yields the path from p2 to p (p if none) |


    Table 20.5. Path I/O and Conversions


    The lexically_...() functions return a new path, while the other conversion functions
    yield a corresponding string type. None of these functions modifies the path they
    are called for.


    For example, the following code:


    ```

    std::filesystem::path p{"/dir/./sub//sub1/../sub2"};

    std::cout << "path:" << "          " << p << ''\n'';

    std::cout << "string():" << "          " << p.string() << ''\n'';

    std::wcout << "wstring():" << "          " << p.wstring() << ''\n'';

    std::cout << "lexically_normal(): " << p.lexically_normal() << ''\n'';

    ```


    has the same output for the first three rows:


    ```

    path:               "/dir/./sub//sub1/../sub2"

    string():           /dir/./sub//sub1/../sub2

    wstring():          /dir/./sub//sub1/../sub2

    ```


    but the output for the last row depends on the directory separator. On POSIX-based
    systems it is:


    ```

    lexically_normal(): "/dir/sub/sub2"

    ```


    while on Windows it is:


    ```

    lexically_normal(): "\\dir\\sub\\sub2"

    ```'
