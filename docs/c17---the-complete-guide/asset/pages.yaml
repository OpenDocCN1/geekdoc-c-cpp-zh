- pgno: 407
  md: "# 31.2 Example Usage\n\nTwo overloaded functions are provided:\n\n+   - std::from_chars()\
    \ converts a given character sequence into a numeric value.\n+   - std::to_chars()\
    \ converts numeric values into a given character sequence.\n\n# 31.2.1 from_chars()\n\
    \nstd::from_chars() converts a given character sequence into a numeric value.\
    \ For example:\n\n```\n#include <charconv>\n```\n\n```\nconst char* str = \"12\
    \ monkeys\";\nint value;\nstd::from_chars_result res = std::from_chars(str, str+10,\n\
    \    value);\n```\n\nAfter a successful parsing, value contains the parsed value\
    \ (12 in this example). The result value is the following structure:\n\n```\n\
    struct from_chars_result {\n    const char* ptr;\n    std::errc ec;\n};\n```\n\
    \nAfter the call, ptr refers to the first character not parsed as part of the\
    \ number (or the passed second argument, if all characters were parsed) and ec\
    \ contains an error condition of type std::errc or is equal to std::errc{} if\
    \ the conversion was successful. Thus, you can check the result as follows:\n\n\
    ```\nif (res.ec != std::errc{}) {\n    ...  // error handling\n}\n```\n\nNote\
    \ that there is no implicit conversion to bool for std::errc, which means that\
    \ you cannot check the value as follows:\n\n```\nif (res.ec) {  // ERROR: no implicit\
    \ conversion to bool\n```\n\nor:\n\n```\nif (!res.ec) { // ERROR: no operator!\
    \ defined\n```\n\nHowever, by using structured bindings and if with initialization,\
    \ you can write:\n\n```\nif (auto [ptr, ec] = std::from_chars(str, str+10, value);\
    \ ec != std::errc{}) {\n    ...  // error handling\n}\n```"
  merge: -1
