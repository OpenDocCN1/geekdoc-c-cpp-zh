  md: "# ## 29.1 Using Standard Memory Resources\n\nThis section introduces the standard\
    \ memory resources and the ways you can use them.\n\n# ## 29.1.1 Motivating Example\n\
    \nLet us first compare memory consumption with and without standard memory resources.\n\
    \n# ### Allocating Memory for Containers and Strings\n\nAssume that in your program,\
    \ you have a vector of some strings, which you initialize with quite long strings:\n\
    \n```\n```cpp\n#include <iostream>\n#include <string>\n#include <vector>\n#include\
    \ \"../lang/tracknew.hpp\"\n\nint main()\n{\n\tTrackNew::reset();\n\tstd::vector<std::string>\
    \ coll;\n\tfor (int i=0; i < 1000; ++i) {\n\t\tcoll.emplace_back(\"just a non-SSO\
    \ string\");\n\t}\n\tTrackNew::status();\n}\n```\n```\n\nNote that we track the\
    \ number of memory allocations using a class that tracks all ::new calls performed\
    \ with the following loop:\n\n```\n```cpp\nstd::vector<std::string> coll;\nfor\
    \ (int i=0; i < 1000; ++i) {\n\tcoll.emplace_back(\"just a non-SSO string\");\n\
    }\n```\n```\n\nThere are a lot of allocations because internally, the vector uses\
    \ memory to store the elements. In addition, the string elements themselves might\
    \ allocate memory on the heap to hold their current value (with the usually implemented\
    \ small string optimization, this typically happens only if the strings have more\
    \ than 15 characters).\n\nThe output of the program might be something like the\
    \ following:\n\n1018 allocations for 134,730 bytes"
