    +   - Do not use string views in call chains to initialize/set strings.\n\nWith\
    \ this taken into account, let us go through some examples where using string\
    \ views is an improvement.\n\n# 19.5.1 Using String Views instead of Strings\n\
    \nConsider the following code:\n\n```\n// print time point with prefix:\nvoid\
    \ print (const std::string& prefix,\n            const std::chrono::system_clock::time_point&\
    \ tp)\n{\n    // convert to calendar time:\n    auto rawtime{std::chrono::system_clock::to_time_t(tp)};\n\
    \    std::string ts{std::ctime(&rawtime)};  // NOTE: not thread safe\n\n    ts.resize(ts.size()-1);\
    \  // skip trailing newline\n\n    std::cout << prefix << ts;\n}\n```\n\nThis\
    \ could easily be replaced by the following:\n\n```\nvoid print (std::string_view\
    \ prefix,\n            const std::chrono::system_clock::time_point& tp)\n{\n \
    \   auto rawtime{std::chrono::system_clock::to_time_t(tp)};\n    std::string_view\
    \ ts{std::ctime(&rawtime)};  // NOTE: not thread safe\n\n    ts.remove_suffix(1);\
    \      // skip trailing newline\n\n    std::cout << prefix << ts;\n}\n```\n\n\
    The first and easy fix is to pass the read-only string prefix as a string view\
    \ as long as we do not use operations that fail if there is no value or no null\
    \ terminator. In this case, we print the value of the string view and this is\
    \ fine. If the string view has no value (data() is nullptr), no characters are\
    \ written. Note that the string view is taken by value, because copying a string\
    \ view is cheap.\n\nWe can also use a string view here internally for the value\
    \ returned by ctime(). However, we have to be careful to ensure that the value\
    \ still exists as long as we use it in the string view. Thus, the value is only\
    \ valid"
