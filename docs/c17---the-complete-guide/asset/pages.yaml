- pgno: 67
  md: '# # Chapter 5: Mandatory Copy Elision or Passing Unmaterialized Objects


    Remember that a declaration with decl1type(auto) operates by value if the expression
    used for initialization (here the return statement) is an expression that creates
    a temporary (a prvalue).


    Because we return a prvalue in all these cases by value, we do not require any
    copy/move support at all.




    The mandatory copy elision for initializations from temporaries was first proposed
    by Richard Smith in http://wg21.link/p0135r0. The finally accepted wording was
    also formulated by Richard Smith in http://wg21.link/p0135r1.'
