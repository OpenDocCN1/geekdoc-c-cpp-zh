  md: "# Chapter 4\n\n# Aggregate Extensions\n\nC++ has different ways and rules to\
    \ initialize objects. One approach is called *aggregate initialization*, which\
    \ describes the initialization of an aggregate.¹ As introduced by C you have to\
    \ use curly braces to pass multiple values for initialization:\n\n```\nstruct\
    \ Data {\n    std::string name;\n    double value;\n};\n```\n\n```\nData x = {\"\
    test1\", 6.778};\n```\n\nSince C++11, you no longer need the equal sign:\n\n```\n\
    Data x{\"test1\", 6.778};\n```\n\nSince C++17, aggregates can have base classes,\
    \ which means that for such structures, that are derived from other classes/structures,\
    \ list initialization is allowed:\n\n```\nstruct MoreData : Data {\n    bool done;\n\
    };\n```\n\n```\nMoreData y{{\"test1\", 6.778}, false};\n```\n\nAs you can see,\
    \ aggregate initialization can now be used to pass initial values to the members\
    \ of the base class. The base class members count as a sub-aggregate which means\
    \ that you can use nested braces to initialize these values.\n\nHowever, you can\
    \ also even skip nested braces:\n\n```\nMoreData y{\"test1\", 6.778, false};\n\
    ```\n\nThis follows the general rules of initializing nested aggregates, where\
    \ you use the initial values according to the order of base structures/classes\
    \ and members.\n\n> ¹ Aggregates are either arrays or simple, C-like classes that\
    \ have no user-provided constructors, no private or protected non-static data\
    \ members, no virtual functions, and before C++17, no base classes."
  merge: -1
  img_proc: true
- pgno: 55
  md: "# 4.1 Motivation for Extended Aggregate Initialization\n\nWithout this feature,\
    \ deriving a structure from another type disabled aggregate initialization, which\
    \ meant that you had to define a constructor:\n\n```\nstruct Cpp14Data : Data\
    \ {\n    bool done;\n    Cpp14Data (const std::string& s, double d, bool b)\n\
    \        : Data{s,d}, done{b} {\n    }\n};\n```\n\n```\nCpp14Data y{\"test1\"\
    , 6.778, false};\n```\n\nNow we have this ability without declaring any constructor.\
    \ The feature uses the syntax of nested braces, which can be omitted if at least\
    \ one value is passed:\n\n```\nMoreData x{{\"test1\", 6.778}, false};  // OK since\
    \ C++17\nMoreData y{\"test1\", 6.778, false};    // OK\n```\n\nNote that because\
    \ this is an aggregate now, other initializations are possible:\n\n```\nMoreData\
    \ u;      // OOPS: value/done are uninitialized\nMoreData z{};    // OK: value/done\
    \ have values 0/false\n```\n\nIf this is too dangerous, use default member initializers\
    \ if you can:\n\n```\nstruct Data {\n    std::string name;\n    double value{0.0};\n\
    };\n```\n\n```\nstruct Cpp14Data : Data {\n    bool done{false};\n};\n```\n\n\
    Alternatively, continue to provide a constructor.\n\n# 4.2 Using Extended Aggregate\
    \ Initialization\n\nOne typical application of aggregate initialization is the\
    \ ability to initialize members of a C-style structure derived by a class to add\
    \ additional data members or operations. For example:\n\n```\nstruct Data {\n\
    \    const char* name;\n    double value;\n};\n```\n\n```\nstruct CppData : Data\
    \ {\n    bool critical;\n```"
