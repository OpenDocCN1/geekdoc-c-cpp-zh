- pgno: 120
  md: "Here, because we use auto, the return type of the function depends on the return\
    \ statements, which depend on the size of int:\n\n+   - If the size is greater\
    \ than 4, there is only one valid return statement returning 42, meaning that\
    \ the return type is int.\n+   - Otherwise, there is only one return statement\
    \ returning 42u, meaning that the return type becomes unsigned int.\n\nThis way,\
    \ the return type of a function with if constexpr might differ even more dramatically.\
    \ For example, if we skip the else part the return type might be int or void:\n\
    \n```\nauto foo()\n{\n    if constexpr (sizeof(int) > 4) {\n        return 42;\n\
    \    }\n}\n// return type might be int or void\n```\n\nNote that this code never\
    \ compiles if the runtime if is used here, because then both return statements\
    \ are taken into account meaning that the deduction of the return type is ambiguous.\n\
    \n# else Matters Even if then Returns\n\nFor runtime if statements there is a\
    \ pattern that does not apply to compile-time if statements: if code with return\
    \ statements in both the then and the else part compiles, you can always skip\
    \ the else in the runtime if statements. That is, instead of\n\n```\nif (...)\
    \ {\n    return a;\n}\nelse {\n    return b;\n}\n```\n\nyou can always write:\n\
    \n```\nif (...) {\n    return a;\n}\nreturn b;\n```\n\nThis pattern does not apply\
    \ to compile-time if because in the second form, the return type depends on two\
    \ return statements instead of one, which can make a difference. For example,\
    \ modifying the example above results in code that might or might not compile:\n\
    \n```\nauto foo()\n{\n    if constexpr (sizeof(int) > 4) {\n        return 42;\n\
    \    }\n    return 42u;\n}\n```"
