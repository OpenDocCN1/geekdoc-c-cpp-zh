- pgno: 274
  md: '| Trait | Effect |

    |---|---|

    | is_aggregate<T> | Is aggregate type |

    | is_swappable<T> | Can call swap() for this type |

    | is_nothrow_swappable<T> | Can call swap() for this type and that operation cannot
    throw |

    | is_swappable_with<T,T2> | Can call swap() for these two types with specific
    value category |

    | is_nothrow_swappable_with<T,T2> | Can call swap() for these two types with specific
    value category and that operation cannot throw |

    | has_unique_object_representations<T> | Any two objects with same value have
    same representation in memory |

    | is_invocable<T,Args...> | Can be used as callable for Args... |

    | is_nothrow_invocable<T,Args...> | Can be used as callable for Args... without
    throwing |

    | is_invocable_r<RT,T,Args...> | Can be used as callable for Args... returning
    RT |

    | is_nothrow_invocable_r<RT,T,Args...> | Can be used as callable for Args... returning
    RT without throwing |

    | invoke_result<T,Args...> | Result type if used as callable for Args... |

    | conjunction<B...> | Logical and for Boolean traits B... |

    | disjunction<B...> | Logical or for Boolean traits B... |

    | negation<B> | Logical not for Boolean trait B |

    | is_execution_policy<T> | Is execution policy type |


    Table 21.1. New Type Traits


    # Type Traits is_swappable<> and is_swappable_with<>


    ```

    std::is_swappable<T>::value

    std::is_nothrow_swappable<T>::value

    std::is_swappable_with<T1,T2>::value

    std::is_nothrow_swappable_with<T1,T2>::value

    ```


    yield true if


    +   - Lvalues of type T can be swapped, or

    +   - Values of value category and of type T1 and T2 can be swapped


    (with the guarantee that no exception is thrown using the nothrow form).


    Note that is_swappable<> and is_nothrow_swappable<> check in general whether you
    can swap values of a specified type (checking the operation for lvalues). In contrast,
    is_swappable_with<> and is_nothrow_swappable_with<> take the value category into
    account. That is,


    ```

    is_swappable_v<int>        // yields true

    ```


    is equivalent to


    ```

    is_swappable_with_v<int&,int&>    // yields true (equivalent)

    ```'
