    \ lookup (ADL)*, you do not have to qualify the calls of `is_regular_file()`,\
    \ `file_size()`, `is_directory()`, and `exists()`. The functions belong to namespace\
    \ `std::filesystem` but are automatically looked up there because they take an\
    \ argument that has a type of this namespace. However, note that there are traps\
    \ with ADL.\n\n# Path Handling under Windows\n\nThe fact that by default, paths\
    \ are written quoted is an issue under Windows because the usual directory separator\
    \ backslash is then always escaped and written twice. Thus, calling this program\
    \ under Windows as follows:\n\n```\ncheckpath C:\\\n```\n\nwill output something\
    \ like:\n\n```\n\"C:\\\\\" is a directory containing:\n...\n\"C:\\\\Users\"\n\"\
    C:\\\\Windows\"\n```\n\nWriting paths quoted ensures that written file names can\
    \ be read back into a program restoring the original file names. However, for\
    \ standard output, this is usually not acceptable.\n\nTherefore, a portable version\
    \ also that also runs well under Windows should avoid writing paths quoted to\
