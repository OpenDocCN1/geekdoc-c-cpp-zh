- pgno: 373
  md: "of memory are, so that more elements are located close to each other. The details\
    \ of these algorithms are implementation-specific.\n\nOf course, this output is\
    \ special because we create the elements in the order that they are sorted inside\
    \ the container. Thus, in practice, if you create objects with random values,\
    \ the elements will not be located sequentially one after the other (in different\
    \ chunks of memory). However, they are still located close to each other and that\
    \ is important for good performance when dealing with the elements of this container.\n\
    \nNote also that we do not look at how memory for the element values is arranged.\
    \ Here, use of the small string optimization usually causes no memory to be allocated\
    \ for the elements. However, as soon as we enlarge the string values, the pool\
    \ also tries to place those together. Note that the pool manages different chunks\
    \ of memory for different allocated sizes. That is, in general, the elements are\
    \ located next to each other and the string values for elements of the same string\
    \ size are also located close to each other.\n\n# monotonic_buffer_resource\n\n\
    The class monotonic_buffer_resource also provides the ability to place all memory\
    \ in big chunks of memory. However, it has two other abilities:\n\n+   - You can\
    \ pass a buffer to be used as memory. In particular, this can be memory allocated\
    \ on the stack.\n+   - The memory resource never deallocates until the resource\
    \ as a whole is deallocated.\n\nThat is, this memory resource is very fast because\
    \ deallocation is a no-op and you skip the need to track deallocated memory for\
    \ further use. Whenever there is a request to allocate memory, the resource just\
    \ returns the next free piece of memory until all memory is exhausted.\n\nNote\
    \ that objects are still destructed. Only their memory is not freed. If you delete\
    \ objects, which usually deallocates their memory, the deallocation has no effect.\n\
    \nThis resource is recommended if you either have no deletes or if you have enough\
    \ memory to waste (not reusing memory that was previously used by another object).\n\
    \nWe have already seen applications of monotonic_buffer_resource in our first\
    \ motivating examples, where we passed memory allocated on the stack to the pool:\n\
    \n```\nstd::array<std::byte, 200000> buf;\nstd::pmr::monotonic_buffer_resource\
    \ pool{buf.data(), buf.size()};\n```\n\nYou can also use this pool to allow any\
    \ memory resource to skip deallocations (optionally passing an initial size).\
    \ By default, this would apply to the default memory resource, which is new_delete_resource()\
    \ by default. That is, with\n\n```\n// use default memory resource but skip deallocations\
    \ as long as the pool lives:\n{\n    std::pmr::monotonic_buffer_resource pool;\n\
    \n    std::pmr::vector<std::pmr::string> coll{&pool};\n    for (int i=0; i < 100;\
    \ ++i) {\n        coll.emplace_back(\"just a non-SSO string\");\n    }\n    coll.clear();\
    \  // destruction but no deallocation\n} // deallocates all allocated memory\n\
    ```"
