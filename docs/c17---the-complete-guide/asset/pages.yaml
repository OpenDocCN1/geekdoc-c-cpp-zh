    \ (std::is_same_v<MyType, T> && T::i == 42) {\n    ...\n}\n```\n\n# 10.2.2 Other\
    \ Compile-Time if Examples\n\n# Perfect Return of a Generic Value\n\nOne application\
    \ of compile-time if is the perfect forwarding of return values, where they have\
    \ to be processed before they can be returned. Because decltype(auto) cannot be\
    \ deduced for void when declaring a variable (as void is an incomplete type),\
    \ you have to write something like the following:\n\ntmpl/perfectreturn.hpp\n\n\
    ```\n#include <functional>  // for std::forward()\n#include <type_traits>  //\
    \ for std::is_same<> and std::invoke_result<>\n\ntemplate<typename Callable, typename...\
    \ Args>\ndecltype(auto) call(Callable op, Args&&... args)\n{\n    if constexpr(std::is_void_v<std::invoke_result_t<Callable,\
    \ Args...>>) {\n        // return type is void:\n        op(std::forward<Args>(args)...);\n\
    \        ... // do something before we return\n        return;\n    }\n    else\
    \ {\n        // return type is not void:\n        decltype(auto) ret{op(std::forward<Args>(args)...)};\n\
    \        ... // do something (with ret) before we return\n        return ret;\n\
    \    }\n}\n```\n\nThe return type declaration works for void but the declaration\
    \ of ret does not, so we have to skip the use of ret in that case."
