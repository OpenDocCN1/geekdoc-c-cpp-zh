  md: "# 31.2 Example Usage\n\nFor integral values, you can pass a base for the value\
    \ read as an optional last argument. The base might be between 2 and 26 (inclusive).\
    \ For example:\n\n```\n```cpp\n#include <charconv>\n\nconst char* str = \"12 monkeys\"\
    ;\nint value;\nstd::from_chars_result res = std::from_chars(str, str+10, value,\
    \ 16); // char sequence to read from\nvalue, // value to set\n16); // optional\
    \ base\n```\n```\n\n+   - The conversion of a bit sequence to a std::byte\n+ \
    \  - The parsing of a passed string view\n\n# 31.2.2 to_chars()\n\nstd::to_chars()\
    \ converts numeric values into a given character sequence. For example:\n\n```\n\
    ```cpp\n#include <charconv>\n\nint value = 42;\nchar str[10];\nstd::to_chars_result\
    \ res = std::to_chars(str, str+9, value);\n*res.ptr = '\\0'; // ensure a trailing\
    \ null character is behind\n```\n```\n\nAfter a successful conversion, str contains\
    \ the character sequence that represents the passed value (42 in this example)\
    \ without a trailing null character.\n\nAgain, for integral values, you can pass\
    \ a base for the value read as an optional last argument. The base might be between\
    \ 2 and 26 (inclusive). For example:\n\n```\n```cpp\n#include <charconv>\n\nint\
    \ value = 42;\nchar str[10];\nstd::to_chars_result res = std::to_chars(str, str+9,\
    \ value, 16); // char sequence to write to\nvalue, // value to convert\n16); //\
    \ optional base\n```\n```\n\nFor another example, see the conversion of a std::byte\
    \ to a bit sequence.\n\nThe result value is the following structure:\n\n```\n\
    ```cpp\nstruct to_chars_result {\n char* ptr;\n}\n```\n```\n\nNote that the accepted\
    \ wording for C++17 declared ec as a std::error_code which was also changed via\
    \ a defect report after C++17 was standardized (see http://wg21.link/p06821)."
