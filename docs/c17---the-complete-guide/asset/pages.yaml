  md: "```\nvoid printSum(long num)\n{\n    // create coll with num sequences of 1\
    \ 2 3 4:\n    std::vector<long> coll;\n    coll.reserve(num * 4);\n    for (long\
    \ i=0; i < num; ++i) {\n        coll.insert(coll.end(), {1, 2, 3, 4});\n    }\n\
    \n    auto sum = std::transform_reduce(std::execution::par,\n                \
    \                    coll.begin(), coll.end(),\n                             \
    \       0L,\n                                    std::plus{},\n              \
    \                      [] (auto val) {\n                                     \
    \   return val * val;\n                                    });\n    std::cout\
    \ << \"transform_reduce(): \" << sum << '\\n';\n}\n\nint main()\n{\n    printSum(1);\n\
    \    printSum(1000);\n    printSum(1000000);\n    printSum(10000000);\n}\n```\n\
    \nWhen calling transform_reduce(), we pass\n\n+   - The execution policy to (allow\
    \ us to) run this in parallel\n+   - The range of the values to deal with\n+ \
    \  - 0L as the initial value of the outer accumulation\n+   - The operation +\
    \ as operation of the outer accumulation\n+   - A lambda to process each value\
    \ before the accumulation\n\ntransform_reduce() will probably be by far the most\
    \ important parallel algorithm because we often modify values before we combine\
    \ them (also called the map reduce principle).\n\nFor further details about transform_reduce(),\
    \ see its reference section."
