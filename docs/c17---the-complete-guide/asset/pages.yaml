- pgno: 252
  md: "# Check for Existence of a File\n\nexists() answers the question of whether\
    \ there is effectively a file to open. Thus, as just discussed, it follows symbolic\
    \ links. Therefore, it yields false if there is a symbolic link to a non-existing\
    \ file.\n\nAs a consequence, code like this does not work as expected:\n\n```\n\
    // if not done yet, create a symbolic link to file:\nif (!exists(p)) {       \
    \     // OOPS: checks if the file p refers to doesn't exist\n    std::filesystem::create_symlink(file,\
    \ p);\n}\n```\n\nIf p already exists as a symbolic link to a non-existing file,\
    \ create_symlink() will try to create the symbolic link at the location where\
    \ the symbolic link already exists and raise a corresponding exception.\n\nBecause\
    \ the situation in a multi-user/multi-process filesystem can change at any time,\
    \ the best approach is usually to try to perform an operation and handle the error\
    \ if it fails. Thus, we can simply call the operation and handle a corresponding\
    \ exception or handle an error code passed as an additional argument.\n\nHowever,\
    \ sometimes you need to check for the existence of a file (before performing a\
    \ filesystem operation). For example, if you want to create a file at a specific\
    \ location and there is already a symbolic link, the file is created or is overwritten\
    \ at a (possibly) unexpected location. In that case, you should check for the\
    \ existence of a file as follows:\n\n```\nif (!exists(symlink_status(p))) {  //\
    \ OK: checks if p doesn't exist yet (as symbolic link)\n    ...\n}\n```\n\nHere,\
    \ we use symlink_status(), which yields the status that does not follow symbolic\
    \ links, to check for the existence of any file at the location of p.\n\n# Other\
    \ File Attributes\n\nTable Operations for File Attributes lists a couple of free-standing\
    \ functions for checking for additional file attributes.\n\n| Call | Effect |\n\
    |---|---|\n| is_empty(p) | Yields whether the file is empty |\n| file_size(p)\
    \ | Yields the size of a file |\n| hard_link_count(p) | Yields the number of hard\
    \ links |\n| last_write_time(p) | Yields the timepoint of the last write to a\
    \ file |\n\nTable 20.11. Operations for File Attributes\n\nNote that there is\
    \ a difference between whether a path is empty and whether the file specified\
    \ by a path is empty:\n\n```\np.empty()     // true if path p is empty (cheap\
    \ operation)\nis_empty(p)   // true if file at path p is empty (filesystem operation)\n\
    ```\n\n6 Thanks to Billy O'Neal for pointing this out."
  merge: -1
  img_proc: true
