    \ here. However, note that all parallel algorithms require the iterators to be\
    \ at least forward iterators (we iterate through the same elements in different\
    \ threads, which makes no sense if the iterators would not iterate over the same\
    \ values).\n\nThe way the algorithms run in parallel is implementation-specific.\
    \ And of course, using multiple threads might not always be faster, because starting\
