- pgno: 346
  md: "+   - On one hand, it is important for concurrency that different objects accessed\
    \ by different threads do not belong to the same cache line. Otherwise, the memory\
    \ of the cache line has to be synchronized between different threads when the\
    \ objects are accessed concurrently.\n+   - On the other hand, your goal might\
    \ be to place multiple objects in the same cache line so that accessing the first\
    \ object gives direct access to the others instead of loading them in the cache.\n\
    \nFor this, the C++ standard library introduces two inline variables in header\
    \ <new>:\n\n```\nnamespace std {\n    inline constexpr size_t hardware_destructive_interference_size;\n\
    \    inline constexpr size_t hardware_constructive_interference_size;\n}\n```\n\
    \nThese objects have the following implementation-defined values:\n\n+   - hardware_destructive_interference_size\
    \ is the recommended minimum offset between two objects that might be accessed\
    \ by different threads concurrently to avoid worse performance because the same\
    \ L1 cache line is affected.\n+   - hardware_constructive_interference_size is\
    \ the recommended maximum size of contiguous memory within which two objects are\
    \ placed in the same L1 cache line.\n\nBoth values are only hints because the\
    \ ideal value might depend on the exact architecture. These constants are the\
    \ best values a compiler can provide when dealing with the variety of platforms\
    \ supported by the generated code. Therefore, if you know better, use specific\
    \ values, but using these values is better than any assumed fixed size for code\
    \ supporting multiple platforms.\n\nThe values are both at least alignof(std::max_align_t).\
    \ The value is usually the same. However, semantically, they represent different\
    \ purposes for using different objects, so you should use them accordingly as\
    \ follows:\n\n+   - If you want to access two different (atomic) objects with\
    \ different threads:\n+   ```\n+   struct Data {\n+       alignas(std::hardware_destructive_interference_size)\
    \ int valueForThreadA;\n+       alignas(std::hardware_destructive_interference_size)\
    \ int valueForThreadB;\n+   };\n+   ```\n+   - If you want to access two different\
    \ (atomic) objects with the same thread:\n+   ```\n+   struct Data {\n+      \
    \ int valueForThreadA;\n+       int otherValueForTheThreadA;\n+   };\n+   ```\n\
    +   // double-check we have best performance due to shared cache line:\n+   static_assert(sizeof(Data)\
    \ <= std::hardware_constructive_interference_size);\n+   \n+   // ensure objects\
