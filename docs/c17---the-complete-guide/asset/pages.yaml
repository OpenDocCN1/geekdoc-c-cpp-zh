    \ {\n  T1 first;\n  T2 second;\n  Pair2(T1 x, T2 y) : first{x}, second{y} {\n\
    \  }\n};\n```\n\nIf we would create an object of this type as follows:\n\n```\n\
    Pair2 p2{\"hi\", \"world\"};  // deduces pair of pointers\n```\n\nT1 and T2 would\
    \ both be deduced as const char*.\n\nHowever, because the constructors of class\
    \ std::pair<> take the arguments by reference, the following initialization should\
    \ normally not compile:\n\n```\nstd::pair p{\"hi\", \"world\"};  // seems to deduce\
    \ pair of arrays of different size, but...\n```\n\nHowever, it does compile because\
    \ class std::pair<> has deduction guides, which we discuss in the next section.\n\
    \n# 9.2 Deduction Guides\n\nYou can define specific deduction guides to provide\
    \ additional class template argument deductions or fix existing deductions defined\
    \ by constructors. For example, you can define that whenever the types of a Pair3\
    \ are deduced, the type deduction should operate as if the types had been passed\
    \ by value:\n\n```\ntemplate<typename T1, typename T2>\nstruct Pair3 {\n  T1 first;\n\
    \  T2 second;\n  Pair3(const T1& x, const T2& y) : first{x}, second{y} {\n  }\n\
    };\n```\n\n```\n// deduction guide for the constructor:\ntemplate<typename T1,\
    \ typename T2>\nPair3(T1, T2) -> Pair3<T1, T2>;\n```\n\nHere, on the left side\
    \ of the ->, we declare what we want to deduce. In this case, it is the creation\
    \ of a Pair3 from two objects of arbitrary types T1 and T2 passed by value. On\
    \ the right side of the ->, we define the resulting deduction. In this example,\
    \ Pair3 is instantiated with the two types T1 and T2."
