- pgno: 376
  md: "# 29.2 Defining Custom Memory Resources\n\nYou can provide your custom memory\
    \ resources. To do this, you have to:\n\n+   - Derive from std::pmr::memory_resource\n\
    +   - Implement the private members\n+     - do_allocate() to allocate memory\n\
    +     - do_deallocate() to deallocate memory\n+     - do_is_equal() to define\
    \ whether and when your type can interchange memory allocated with an other memory\
    \ resource object\n\nHere is a complete example that simply allows us to track\
    \ the allocations and deallocations of any other memory resource:\n\n```\npmr/tracker.hpp\n\
    #include <iostream>\n#include <string>\n#include <memory_resource>\n\nclass Tracker\
    \ : public std::pmr::memory_resource\n{\nprivate:\n    std::pmr::memory_resource*\
    \ upstream; // wrapped memory resource\n    std::string prefix{};\npublic:\n \
    \   // we wrap the passed or default resource:\n    explicit Tracker(std::pmr::memory_resource*\
    \ us)\n        : upstream{us} {\n    }\n    explicit Tracker(std::string p, std::pmr::memory_resource*\
    \ us)\n        : prefix{std::move(p)}, upstream{us} {\n    }\nprivate:\n    void*\
    \ do_allocate(size_t bytes, size_t alignment) override {\n        std::cout <<\
    \ prefix << \"allocate \" << bytes << \" Bytes\\n\";\n        void* ret = upstream->allocate(bytes,\
    \ alignment);\n        return ret;\n    }\n    void do_deallocate(void* ptr, size_t\
    \ bytes, size_t alignment) override {\n        std::cout << prefix << \"deallocate\
    \ \" << bytes << \" Bytes\\n\";\n        upstream->deallocate(ptr, bytes, alignment);\n\
    \    }\n    bool do_is_equal(const std::pmr::memory_resource& other) const noexcept\n\
    \    {\n        return upstream->is_equal(other);\n    }\n};\n```"
