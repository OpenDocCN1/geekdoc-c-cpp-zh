- pgno: 368
  md: 'This way, you can easily program memory pools, where you allocate memory once
    (either on the stack or on the heap) and reuse this memory with every new task
    (service request, event, data file to process, and so on).


    We will discuss more sophisticated examples of memory pools later on.


    # 29.1.2 Standard Memory Resources


    To support polymorphic allocators, the C++ standard library provides the memory
    listed in table Standard Memory Resources.


    | Memory Resource | Behavior |

    |---|---|

    | new_delete_resource() | Yields a pointer to a memory resource calling new and
    delete |

    | synchronized_pool_resource | Class to create memory resources with little fragmentation,
    thread-safe |

    | unsynchronized_pool_resource | Class to create memory resources with little
    fragmentation, not thread-safe |

    | monotonic_buffer_resource | Class to create memory resources that never deallocates,
    optionally using a passed buffer, not thread-safe |

    | null_memory_resource() | Yields a pointer to a memory resource where each allocation
    fails |


    Table 29.1. Standard Memory Resources


    new_delete_resource() and null_memory_resource() are functions that return the
    pointer to a global memory resource, which is defined as a singleton. The other
    three memory resources are classes, where you have to create objects and pass
    pointers to these objects to the polymorphic allocators. Some usage examples:


    ```

    std::pmr::string s1{"my string", std::pmr::new_delete_resource()};

    ```


    ```

    std::pmr::synchronized_pool_resource pool1;

    std::pmr::string s2{"my string", &pool1};

    ```


    ```

    std::pmr::monotonic_buffer_resource pool2{...};

    std::pmr::string s3{"my string", &pool2};

    ```


    In general, memory resources are passed as pointers. Therefore, it is important
    that you ensure that the resource objects these pointers refer to exist until
    the last deallocation is called (this might be later than you expect if you move
    objects around and memory resources are interchangeable).


    # Default Memory Resource


    Polymorphic allocators have a default memory resource that is used if no other
    memory resource is passed. Table Operations for the Default Memory Resource lists
    the operations defined for it.


    You can get the current default resource with std::pmr::get_default_resource(),
    which is what you can pass to initialize a polymorphic allocator. You can globally
    set a different default memory resource'
