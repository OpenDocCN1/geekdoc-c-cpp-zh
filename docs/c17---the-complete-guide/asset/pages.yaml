- pgno: 436
  md: '# Glossary


    This glossary provides a short definition of the most important non-trivial technical
    terms used in this book.




    # **bitmask type**


    An integral or scoped enumeration type (enum class) for which different values
    represent different bits. If it is a scoped enumeration type, only the bit operators
    are defined and you need a static_cast<> to use its integral value or use it as
    a Boolean value.




    # **full specialization**


    An alternative definition for a (primary) template that no longer depends on any
    template parameter.




    # **incomplete type**


    A class, struct, or unscoped enumeration type that is declared but not defined,
    an array of unknown size, void (optionally with const and/or volatile), or an
    array of an incomplete element type.




    # **partial specialization**


    An alternative definition for a (primary) template that still depends on one or
    more template parameters.'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# S


    **small/short string optimization (SSO)**

    An approach to save allocating memory for short strings by always reserving memory
    for a certain number of characters. A typical value in standard library implementations
    is to always reserve 16 or 24 bytes of memory so that the string can have 15 or
    23 characters (plus 1 byte for the null terminator) without allocating memory.
    This makes all string objects larger but usually saves a lot of running time because
    in practice, strings are often shorter than 16 or 24 characters and allocating
    memory on the heap is quite an expensive operation.


    # V


    **variable template**

    A templified variable. It allows us to define variables or static members by substituting
    the template parameters with specific types or values.


    **variadic template**

    A template with a template parameter that represents an arbitrary number of types
    or values.'
