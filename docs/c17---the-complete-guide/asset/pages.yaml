- pgno: 174
  md: 'That is, std::variant<> is a variadic class template (a feature introduced
    with C++11 that allows you to deal with an arbitrary number of types).


    In addition, the following types and objects are defined:


    +   - Class template std::variant_size

    +   - Class template std::variant_alternative

    +   - Value std::variant_npos

    +   - Type std::monostate

    +   - Exception class std::bad_variant_access, derived from std::exception.


    Variants also use the two variable templates std::in_place_type<> and std::in_place_index<>,
    which have their own types std::in_place_type_t and std::in_place_index_t and
    are defined in the header file <utility>.


    # 16.3.2 std::variant<> Operations


    Table std::variant Operations lists all operations that are provided for std::variant<>.


    | Operation | Effect |

    |---|---|

    | constructors | Creates a variant object (might call constructor for underlying
    type) |

    | destructor | Destroys a variant object |

    | = | Assigns a new value |

    | emplace<T>() | Destroys the old value and assigns a new value to the alternative
    with type T |

    | emplace<Idx>() | Destroys the old value and assigns a new value to the alternative
    with index Idx |

    | valueless_by_exception() | Returns whether the variant has no value due to an
    exception |

    | index() | Returns the index of the current alternative |

    | swap() | Swaps values between two objects |

    | ==, !=, <, <=, >, >= | Compares variant objects |

    | hash<> | Function object type for computing hash values |

    | holds_alternative<T>() | Returns whether there is a value for type T |

    | get<T>() | Returns the value for the alternative with type T |

    | get<Idx>() | Returns the value for the alternative with index Idx |

    | get_if<T>() | Returns a pointer to the value for the alternative with type T
    or nullptr |

    | get_if<Idx>() | Returns a pointer to the value for the alternative with index
    Idx or nullptr |

    | visit() | Performs an operation for the current alternative |


    Table 16.1. std::variant<> Operations'
