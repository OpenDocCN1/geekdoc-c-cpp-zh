  md: "# # Chapter 34\n\nCommon C++17 Settings\n\nThis chapter contains a few concluding\
    \ general aspects of C++17.\n\n\n\nThe preprocessor value that signals the current\
    \ C++ version, __cplusplus shall now be defined as 201703L. However, note that\
    \ Visual C++ still uses the value 199711 by default in all modes. To activate\
    \ the correct behavior, use the option /Zc:__cplusplus, as it is discussed in:\
    \ http://docs.microsoft.com/en-us/cpp/build/reference/zc-cplusplus\n\n\n\nC++17\
    \ is based on C11 instead of C99, which was the basis for C++14. In principle,\
    \ this means that C++17 benefits from and has to honor the modifications C11 introduced.\
    \ However, there are various constraints:\n\n+   - The C11 standard introduced\
    \ several functions and macros for “safer, more secure programming” that shall\
    \ replace traditional C functions and macros that can be a problem such as overwriting\
    \ an unlimited amount of memory. Most of them just have the additional suffix\
    \ _s. For example, strcpy_s(), sprintf_s() were introduced to take an additional\
    \ size parameter to ensure that they do not overwrite a character sequence that\
    \ is too short for the operation.\n+   \n+   In C11, these functions are introduced\
    \ in the header files where the corresponding unsafe versions exist. In the corresponding\
    \ C++17 header file, they are not introduced in namespace std. It is implementation-defined\
    \ whether they are available declared in the global namespace when any C++ header\
    \ file is included.\n+   \n+   - The new C headers <stdatomic.h>, <stdnoreturn.h>,\
    \ and <threads.h> are all ignored and have no C++ counterparts.\n+   \n+   - The\
    \ use of the header files <complex>, <stdalign>, <stdbool>, and <ctgmath> is deprecated."
  merge: -1
