  md: "# Chapter 20\n\n# The Filesystem Library\n\nWith C++17, the Boost.Filesystem\
    \ library was finally adopted as a C++ standard library. As part of this process,\
    \ during this, the library was adjusted to new language features, made more consistent\
    \ with other parts of the library, cleaned up, and extended to provide some missing\
    \ pieces (such as operations to compute a relative path between filesystem paths).\n\
    \n# 20.1  Basic Examples\n\nLet us start with some basic examples.\n\n# 20.1.1\
    \  Print Attributes of a Passed Filesystem Path\n\nThe following program allows\
    \ us to use a passed string as a filesystem path to print some aspects of the\
    \ path according to its file type:\n\n```\n```cpp\n#include <iostream>\n#include\
    \ <filesystem>\n#include <cstdlib>      // for EXIT_FAILURE\n\nint main(int argc,\
    \ char* argv[])\n{\n    if (argc < 2) {\n        std::cout << \"Usage: \" << argv[0]\
    \ << \" <path>\\n\";\n        return EXIT_FAILURE;\n    }\n\n    std::filesystem::path\
    \ p{argv[1]};  // represents a filesystem path (might not exist)\n    if (is_regular_file(p))\
    \ {          // is path a regular file?\n        std::cout << p << \" exists with\
    \ \" << file_size(p) << \" bytes\\n\";\n```\n```"
