  md: "# 24.3 Using Searcher Predicates\n\nWhen using searchers, you can use predicates,\
    \ which might be necessary for two reasons:\n\n+   1. You want to define your\
    \ own way of comparing two elements.\n\n+   2. You want to provide a hash function,\
    \ which is necessary for the Boyer-Moore(-Horspool) searchers.\n\nYou have to\
    \ provide the predicates as additional arguments to the constructor of the searchers.\
    \ For example, here we are searching for a substring case-insensitively:\n\n```\n\
    std::boyer_moore_searcher bmic{substr.begin(), substr.end(),\n    [](char c){\n\
    \        return std::hash<char>{}(std::toupper(c));\n    },\n    [](char c1, char\
    \ c2){\n        return std::toupper(c1)==std::toupper(c2);\n    }\n};\nauto begend\
    \ = bmic(sub.begin(), sub.end());\n```\n\nDo not forget to call toupper() before\
    \ you hash the value, because otherwise you violate the requirement that the hash\
    \ value must be the same for all values, where operator== yields true.\n\nAnd\
    \ here, if we have a class Customer defined as follows:\n\n```\nclass Customer\
    \ {\n    ...\npublic:\n    Customer() = default;\n    std::string getID() const\
    \ {\n        return id;\n    }\n    friend bool operator== (const Customer& c1,\
    \ const Customer& c2) {\n        return c1.id == c2.id;\n    }\n};\n```\n\nwe\
    \ can search for a subsequence of customers in a vector of customers as follows:\n\
    \n```\nstd::vector<Customer> customers;\n...\nstd::vector<Customer> sub{...};\n\
    ...\nstd::boyer_moore_searcher bmcust(sub.begin(), sub.end(),\n    [](const Customer&\
    \ c) {\n        return std::hash<std::string>{}(c.getID());\n    });\nauto pos\
    \ = bmcust(customers.begin(), customers.end());\nif (pos.first != customers.end())\
    \ {\n    ...\n}\n```"
