  md: "purpose of calling std::async(). Compilers can warn about this when std::async()\
    \ is marked with [[nodiscard]].\n\n+   - Another example is the member function\
    \ empty(), which checks whether an object (container/string) has no elements.\
    \ Programmers pretty often call this function to “empty” the container (remove\
    \ all elements):\n\n```\ncont.empty();\n```\n\nThis incorrect application of empty()\
    \ can often be detected because it does not use the return value. Therefore, marking\
    \ the member function accordingly:\n\n```\nclass MyContainer {\n    ...\n    public:\n\
    \        [[nodiscard]] bool empty() const noexcept;\n    ...\n};\n```\n\nhelps\
    \ to detect such an logical error.\n\nIf for whatever reason you do not want to\
    \ use a return value marked with [[nodiscard]] you can cast the return value to\
    \ void:\n\n```\n(void)coll.empty();  // disable [[nodiscard]] warning\n```\n\n\
    Note that attributes in function declarations are not inherited if the functions\
    \ are overwritten:\n\n```\nstruct B {\n    [[nodiscard]] int* foo();\n};\n\nstruct\
    \ D : B {\n    int* foo();\n};\n```\n\n```\nB b;\nb.foo();        // warning\n\
    (void)b.foo();  // no warning\n```\n\n```\nD d;\nd.foo();        // no warning\n\
    ```\n\nTherefore, you have mark the derived member function with [[nodiscard]]\
    \ again (unless there is a reason that not using the return value makes sense\
    \ in the derived class).\n\nAs usual, you can place an attribute that applies\
    \ to a function in front of all declaration specifiers or after the function name:\n\
    \n```\nclass C {\n    ...\n    [[nodiscard]] friend bool operator== (const C&,\
    \ const C&);\n    friend bool operator!= [[nodiscard]] (const C&, const C&);\n\
    ```"
