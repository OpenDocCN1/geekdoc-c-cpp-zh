- pgno: 269
  md: '# 20.6 Afternotes


    The filesystem library was developed under the lead of Beman Dawes for many years
    as a Boost library. In 2014, for the first time it became a formal beta standard,
    the *File System Technical Specification* (see http://wg21.link/n4100).


    With http://wg21.link/p0218r0 the *File System Technical Specification* was adopted
    as part of the standard library as proposed by Beman Dawes. Support for computing
    relative paths was added by Beman Dawes, Nicolai Josuttis, and Jamie Allsop in
    http://wg21.link/p0219r1. A couple of minor fixes were added as proposed by Beman
    Dawes in http://wg21.link/p0317r1, by Nicolai Josuttis in http://wg21.link/p0392r0,
    by Jason Liu and Hubert Tong in http://wg21.link/p0430r2, and especially by the
    members of the filesystem small group (Beman Dawes, S. Davis Herring, Nicolai
    Josuttis, Jason Liu, Billy O’Neal, P.J. Plauger, and Jonathan Wakely) in http://wg21.link/p0492r2.


    After C++17 was released http://wg21.link/p1164r1 by Nicolai Josuttis fixed the
    behavior of `make_directory()` as a defect against C++17.'
