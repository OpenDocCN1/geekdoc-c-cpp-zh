  md: "```\nint main()\n{\n    auto p = new MyType32;\n    ...\n    delete p;\n}\n\
    ```\n\nAs stated, since C++17, you can skip the overhead of implementing operations\
    \ to allocate/deallocate aligned data. The example works well even without defining\
    \ operator new() and operator delete() for your type:\n\nlang/alignednew17.cpp\n\
    \n```\n#include <string>\n\nstruct alignas(32) MyType32 {\n    int i;\n    char\
    \ c;\n    std::string s[4];\n    ...\n};\n\nint main()\n{\n    auto p = new MyType32;\
    \  // allocates 32-byte aligned memory since C++17\n    ...\n    delete p;\n}\n\
