    }\n```\n\nYou can declare a std::any as empty or initialized by a value of a specific\
    \ type. If an initial value is passed, the type of the contained value gets the\
    \ type of the passed value.\n\nBy using the member function type(), you can check\
    \ the type of the contained value against the type ID of any type. If the object\
    \ is empty, the type ID is typeid(void).\n\nTo access the contained value, you\
    \ have to cast it to its type with a std::any_cast<>:\n\n```\nauto s = std::any_cast<std::string>(a);\n\
