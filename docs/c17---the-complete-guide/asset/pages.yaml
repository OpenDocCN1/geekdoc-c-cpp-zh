    n\";\n}\nint main() {\n    call(f1, f2); // ERROR since C++17\n}\n```\n\nThe problem\
    \ is that since C++17, f1() and f2() have different types so that the compiler\
    \ no longer finds a common type T for both types when instantiating the function\
    \ template call().\n\nSince C++17, you have to use two different template parameter\
    \ types to ensure that this still compiles:\n\n```\ntemplate<typename T1, typename\
    \ T2>\nvoid call(T1 op1, T2 op2)\n{\n    op1();\n    op2();\n}\n```\n\nIf you\
    \ want or have to overload on all possible function types, you also have to double\
    \ the overloads now. This applies, for example, to the definition of the standard\
    \ type trait std::is_function<>. The primary template is defined so that in general\
    \ a type T is not a function:\n\n```\n// primary template (in general type T is\
    \ no function):\ntemplate<typename T> struct is_function : std::false_type { };\n\
    ```\n\nThe template derives from std::false_type so that is_function<T>::value\
    \ in general yields false for any type T.\n\nFor all types that are functions,\
    \ partial specializations exist which derive from std::true_type so that the member\
    \ value yields true for them:\n\n```\ntemplate<typename Ret, typename... Params>\n\
    struct is_function<Ret (Params...)> : std::true_type { };\n```\n\n```\ntemplate<typename\
    \ Ret, typename... Params>\nstruct is_function<Ret (Params...) const> : std::true_type\
    \ { };\n```\n\n```\ntemplate<typename Ret, typename... Params>\nstruct is_function<Ret\
    \ (Params...) &> : std::true_type { };\n```\n\n```\ntemplate<typename Ret, typename...\
    \ Params>\nstruct is_function<Ret (Params...) &&> : std::true_type { };\n```"
