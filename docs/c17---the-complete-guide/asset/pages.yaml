    \ static_cast<size_t>(align));\n#else\n    // standard C++17 API:\n    return\
    \ std::aligned_alloc(static_cast<size_t>(align), size);\n#endif\n}\n```\n\n```\n\
    static void operator delete (void* p, std::align_val_t align) {\n    ...\n#ifdef\
    \ _MSC_VER\n    // Windows-specific API:\n    _aligned_free(p);\n#else\n    //\
    \ standard C++17 API:\n    std::free(p);\n#endif\n}\n```\n\nNote that all allocation\
    \ functions take the alignment parameter as type size_t, which means that we have\
    \ to use the static cast to convert the value from type std::align_val_t.\n\n\
