  md: "# 11.1 Motivation for Fold Expressions\n\nFold expressions avoid the need to\
    \ recursively instantiate templates to perform an operation on all parameters\
    \ of a parameter pack. Before C++17, you had to implement:\n\n```\ntemplate<typename\
    \ T>\nauto foldSumRec (T arg) {\n    return arg;\n}\ntemplate<typename T1, typename...\
    \ Ts>\nauto foldSumRec (T1 arg1, Ts... otherArgs) {\n    return arg1 + foldSumRec(otherArgs...);\n\
    }\n```\n\nSuch an implementation is not only cumbersome to write, it also stresses\
    \ C++ compilers. With\n\n```\ntemplate<typename... T>\nauto foldSum (T... args)\
    \ {\n    return (... + args);  // arg1 + arg2 + arg3...\n}\n```\n\nthe effort\
    \ reduces significantly for both the programmer and the compiler.\n\n# 11.2 Using\
    \ Fold Expressions\n\nGiven a parameter args and an operator op, C++17 allows\
    \ us to write\n\n+   - Either a unary left fold\n+     ( ... op args )\n+    \
    \ which expands to: ((arg1 op arg2) op arg3) op ...\n+   - Or a unary right fold\n\
    +     ( args op ... )\n+     which expands to: arg1 op (arg2 op ... (argN-1 op\
    \ argN))\n\nThe parentheses are required. However, the parentheses and the ellipsis\
    \ (...) do not have to be separated by whitespaces.\n\nThe difference between\
    \ left and right fold is important more often than expected. For example, there\
    \ might be different effects even when you use operator +. With the left fold\
    \ expression:\n\n```\ntemplate<typename... T>\nauto foldSumL(T... args){\n   \
    \ return (... + args);  // ((arg1 + arg2) + arg3)...\n}\n```\n\nthe call\n\n```\n\
    foldSumL(1, 2, 3)\n```\n\nevaluates to:"
