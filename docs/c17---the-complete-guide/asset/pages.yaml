  md: "# Chapter 23\n\n# New STL Algorithms in Detail\n\nC++17 introduces a few new\
    \ STL algorithms. The main reason for this is to support parallelization, but\
    \ you can also use these algorithms sequentially.\n\n# 23.1 std::for_each_n()\n\
    \nAs part of the parallel STL algorithms, a new algorithm for_each_n() was proposed,\
    \ which is also available in the traditional non-parallel form. Similarly for\
    \ copy_n(), fill_n(), and generate_n(), an integral parameter is required to specify\
    \ for how many elements of the passed range the passed callable is called.\n\n\
    ```\nInputIterator\nfor_each_n (ExecutionPolicy&& pol,  // optional\n    InputIterator\
    \ beg,\n    Size count,\n    UnaryProc op)\n```\n\n+   - Calls op(elem) for the\
    \ first count elements in the range starting with beg.\n+   - Returns the position\
    \ after the last element for which op() was called.\n+   - The caller must ensure\
    \ that the range starting with beg contains enough elements.\n+   - Any return\
    \ value of the passed op is ignored.\n+   - If no execution policy is passed,\
    \ for_each_n() guarantees that the passed callable is called for each element\
    \ in order.\n+   - If the first optional execution policy is passed:\n+     -\
    \ There is no guaranteed order for using the operator op for all elements.\n+\
    \     - It is up to the caller to ensure that parallel calls of the operations\
    \ do not result in a data race.\n+     - The iterators must be forward iterators.\n\
    +   - Complexity: linear (count calls of op())."
  merge: -1
  img_proc: true
