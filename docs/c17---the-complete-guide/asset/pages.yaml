  md: 'However, note that using a predicate might create a significant overhead to
    using searchers, which means that using them is only worth it if you have a huge
    number of elements and are searching for a subsequence of significant size (e.g.,
    finding a subsequence of 1000 customers in a collection of 1 million customers).


    Once again: think big and measure.


    # 24.4 Afternotes


    The searchers were first proposed by Marshall Clow in http://wg21.link/n3411 referring
    to Boost.Algorithm as a reference implementation. They became part of the first
    Library Fundamentals TS. For C++17 they were then adopted with other components
    as proposed by Beman Dawes and Alisdair Meredith in http://wg21.link/p0220r1,
    including an interface fix proposed by Marshall Clow in http://wg21.link/p0253R1.'
