- pgno: 20
  md: '# The C++17 Standard


    The original C++ standard was published in 1998 and was subsequently amended by
    a technical corrigendum in 2003, which provided minor corrections and clarifications
    to the original standard. This “old C++ standard” is known as C++98 or C++03.


    The world of “Modern C++” began with C++11 and was extended with C++14. The international
    C++ standards committee now aims to issue a new standard every three years. Clearly,
    that leaves less time for massive additions, but it brings the changes to the
    broader programming community more quickly. The development of larger features,
    therefore, takes time and might cover multiple standards.


    C++17 is just the next step. It is not a revolution, but it does bring a huge
    number of improvements and extensions.


    At the time of writing this book, C++17 is already at least partially supported
    by major compilers. However, as usual, compilers differ greatly in their support
    of new different language features. Some will compile most or even all of the
    code in this book, while others may only be able to handle a significant subset.
    However, I expect that this problem will soon be resolved as programmers everywhere
    demand standard support from their vendors.


    # Example Code and Additional Information


    You can access all example programs and find more information about this book
    from its website, which has the following URL:


    ```

    http://www.cppstd17.com

    ```


    # Feedback


    I welcome your constructive input—both negative and positive. I have worked very
    hard to bring you what I hope you will find to be an excellent book. However,
    at some point I had to stop writing, reviewing, and tweaking to “release the new
    revision.” You may therefore find errors, inconsistencies, presentations that
    could be improved, or topics that are missing altogether. Your feedback gives
    me a chance to fix these issues, inform all readers about the changes through
    the book’s website, and improve any subsequent revisions or editions.


    The best way to reach me is by email. You will find the email address at the website
    for this book:


    ```

    http://www.cppstd17.com

    ```


    Please be sure to have the latest version of this book available (remember it
    is written and published incrementally) and refer to the publishing date of this
    version when giving feedback. The current publishing date is 2022-01-11 (you can
    also find it on page ii, the page directly after the cover).


    Many thanks.'
