- pgno: 107
  md: "For this reason, a corresponding deduction guide sounds very reasonable for\
    \ any class template that has a constructor that takes an object of its template\
    \ parameter by reference. The C++ standard library provides corresponding deduction\
    \ guides for pairs and tuples.\n\n# 9.2.2 Non-Template Deduction Guides\n\nDeduction\
    \ guides do not have to be templates and do not have to apply to constructors.\
    \ For example, implementing the following structure and deduction guide is valid:\n\
    \n```\ntemplate<typename T>\nstruct S {\n    T val;\n};\n```\n\n```\nS(const char*)\
    \ -> S<std::string>;  // map S<> for string literals to S<std::string>\n```\n\n\
    Here, we have a deduction guide without a constructor. The deduction guide is\
    \ used to deduce parameter T, but then the structure is used as if the template\
    \ parameter had been specified explicitly.\n\nFor this reason, the following declarations\
    \ are possible and deduce std::string as class template parameter T:\n\n```\n\
    S s1{\"hello\"};              // OK, same as: S<std::string> s1{\"hello\"};\n\
    S s2 = {\"hello\"};            // OK, same as: S<std::string> s2 = {\"hello\"\
    };\nS s3 = S{\"hello\"};           // OK, both S deduced to be S<std::string>\n\
    ```\n\nAll initializations are valid because the passed string literals implicitly\
    \ convert to std::string\n\nNote that aggregates need list initialization. The\
    \ following deductions work, but the initializations are not allowed because no\
    \ braces are used:\n\n```\nS s4 = \"hello\";             // ERROR: can’t initialize\
    \ aggregates without braces\nS s5(\"hello\");              // ERROR: can’t initialize\
    \ aggregates without braces\n```\n\n# 9.2.3 Deduction Guides versus Constructors\n\
    \nDeduction guides compete with the constructors of a class. Class template argument\
    \ deduction uses the constructor/guide that has the highest priority according\
    \ to overload resolution. If a constructor and a deduction guide match equally\
    \ well, the deduction guide is preferred.\n\nConsider the following definition:\n\
    \n```\ntemplate<typename T>\nstruct C1 {\n    C1(const T&) {\n    }\n};\nC1(int)\
    \ -> C1<long>;\n```"
