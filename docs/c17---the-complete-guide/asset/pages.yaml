  md: "Alternatively, if move semantics should be supported:\n\n```\ntemplate<typename...\
    \ Types>\nvoid callFoo(Types&&... args)\n{\n    ...\n    (... , foo(std::forward<Types>(args)));\
    \   // calls foo(arg1), foo(arg2), ...\n}\n```\n\nTo make this code safe in case\
    \ the called function returns a value of a type with an overloaded comma operator,\
    \ you should cast the return type to void:\n\n```\ntemplate<typename... Types>\n\
    void callFoo(Types&&... args)\n{\n    ...\n    (... , (void)foo(std::forward<Types>(args)));\
    \   // calls foo(arg1), foo(arg2), ...\n}\n```\n\nNote that due to the nature\
    \ of the comma operator, whether we use the left or right fold operator is usually\
    \ irrelevant. The functions are always called from left to right. With\n\n```\n\
    (foo(args) , ...);\n```\n\nthe parentheses only group the calls so that the first\
    \ foo() call is combined with the result of the next two foo() calls as follows:\n\
    \n```\nfoo(arg1) , (foo(arg2) , foo(arg3));\n```\n\nHowever, because the evaluation\
    \ order of the comma operator is usually from left to right, the first call still\
    \ takes place before the group of two calls inside the parentheses, while within\
    \ the parentheses, the middle call still takes place before the right call.²\n\
    \nNevertheless, as the left fold expression matches with the “native” evaluation\
    \ order, again the use of left fold expressions is recommended if you use fold\
    \ expressions for multiple function calls.\n\n# Combining Hash Functions\n\nAnother\
    \ example of using the comma operator for fold expressions is to combine hash\
    \ values. This can be done as follows:\n\n```\ntemplate<typename T>\nvoid hashCombine\
    \ (std::size_t& seed, const T& val)\n{\n    seed ^= std::hash<T>()(val) + 0x9e3779b9\
    \ + (seed<<6) + (seed>>2);\n}\n```\n\n```\ntemplate<typename... Types>\nstd::size_t\
    \ combinedHashValue (const Types&... args)\n```\n\n² By overloading the comma\
    \ operator, you can change its evaluation order, which might then affect the order\
    \ of calls of both left and right folds."
