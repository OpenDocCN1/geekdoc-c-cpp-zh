    ```\n\nIn principle, the default of the sized versions of operator delete() also\
    \ just call the unsized versions. However, this might change in the future, therefore\
    \ you must implement both (some compilers issue a warning if you do not do this).\n\
    \n# 30.3.1 Backward Incompatibilities\n\nNote that the behavior of the following\
    \ program changes silently with C++17:\n\nlang/alignednewincomp.cpp\n\n```\n#include\
    \ <cstddef>    // for std::size_t\n#include <cstdlib>    // for std::malloc()\n\
    #include <cstdio>     // for std::printf()\n\nvoid* operator new (std::size_t\
    \ size)\n{\n    std::printf(\":new called with size: %zu\\n\", size);\n    return\
    \ ::std::malloc(size);\n}\n\nint main()\n{\n    struct alignas(64) S {\n     \
    \   int i;\n    };\n\n    S* p = new S;  // calls our operator new only before\
    \ C++17\n}\n```\n\nIn C++14, the global ::operator new(size_t) overload was called\
    \ for all new expressions, which meant that the program always had the following\
    \ output:\n\n```\n::new called with size: 64\n```\n\nSince C++17, the behavior\
    \ of this program has changed, because now the default overload for the over-aligned\
    \ data\n\n```\n::operator new(size_t, align_val_t)\n```\n\nis called here, which\
    \ is not replaced. As a result, the program will no longer output the line above.\n\
    \n9 There might be additional output for other initializations that allocate memory\
    \ on the heap.\n\n10 Some compilers warned about calling new for over-aligned\
    \ data before C++17, because the alignment was not handled properly before C++17."
