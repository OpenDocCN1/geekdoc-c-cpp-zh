  md: "# # Chapter 26\n\n# ## Container and String Extensions\n\nThere are a couple\
    \ of minor or small changes to the standard containers of the C++ standard library,\
    \ which are described in this chapter.\n\n\n\n+   - Modify keys of (unordered)\
    \ maps or values of (unordered) sets\n+   - Use move semantics in (unordered)\
    \ sets and maps\n+   - Move elements between (unordered) sets and maps\n+   -\
    \ Merge elements from one (unordered) set or map into another\n\n\n\nFor example,\
    \ consider the following program:\n\n```\n```cpp\n#include <iostream>\n#include\
    \ <string>\n#include <map>\n\nint main()\n{\n    std::map<int, std::string> m{1,\
    \ \"mango\"},\n    {2, \"papaya\"},\n    {3, \"guava\"}};\n\nauto nh = m.extract(2);\
    \ // nh has type decltype(m)::node_type\nnh.key() = 4;\n}\n```\n```"
