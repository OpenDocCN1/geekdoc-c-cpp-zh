- pgno: 229
  md: "Note that the first argument defines the path from the view of the link created.\
    \ Thus, you have to pass \"test\" instead of \"tmp/test\" to effectively link\
    \ from tmp/slink to tmp/test. If you called:\n\n```\nstd::filesystem::create_directory_symlink(\"\
    tmp/test\", \"tmp/slink\");\n```\n\nyou would effectively create tmp/slink as\
    \ a symbolic link to tmp/tmp/test.\n\nNote that often, calling create_symlink()\
    \ instead of create_directory_symlink() also works. However, some operating systems\
    \ have special handling for symbolic links to directories or perform better when\
    \ they know that a file is a directory, which means that you should use create_directory_symlink()\
    \ if you know that the symbolic link refers to a directory.\n\nFinally, note that\
    \ this call might fail on Windows systems and cause error handling, because you\
    \ might need administrator rights to create a symbolic link there.\n\n# Recursive\
    \ Directory Iteration\n\nFinally, we recursively list our current directory:\n\
    \n```\nauto iterOpts = fs::directory_options::follow_directory_symlink;\nfor (auto&\
    \ e : fs::recursive_directory_iterator(\".\", iterOpts)) {\n    std::cout << \"\
    \   \" << e.path().lexically_normal().string() << '\\n';\n}\n```\n\nNote that\
    \ we use a recursive directory iterator and pass the option follow_directory_symlink\
    \ to also follow symbolic links. Therefore, we should get an output like the following\
