  md: "Note that this problem applies only to the global operator new(). If the type-specific\
    \ operator new() is defined for S, the operator is still also used as a fallback\
    \ for over-aligned data, which means that such a program behaves in the same way\
    \ that it did before C++17.\n\nNote also that printf() is used intentionally here\
    \ to avoid an output to std::cout allocating memory while we are allocating memory,\
    \ which might result in nasty errors (core dumps at best).\n\n# 30.4 Tracking\
    \ All ::new Calls\n\nThe following program demonstrates how to use the new operator\
    \ new() overloads in combination with inline variables and [[nodiscard]] to track\
    \ all calls of ::new simply by including this header file:\n\n```\nlang/tracknew.hpp\n\
    #ifndeF TRACKNEW_HPP\n#define TRACKNEW_HPP\n\n#include <new>      // for std::align_val_t\n\
    #include <cstdio>   // for printf()\n#include <cstdlib>  // for malloc() and aligned_alloc()\n\
    #ifdef _MSC_VER\n#include <malloc.h> // for _aligned_malloc() and _aligned_free()\n\
    #endif\n\nclass TrackNew {\nprivate:\n    static inline int numMalloc = 0;   \
    \   // num malloc calls\n    static inline size_t sumSize = 0;     // bytes allocated\
    \ so far\n    static inline bool doTrace = false;   // tracing enabled\n    static\
    \ inline bool inNew = false;     // don't track output inside new overloads\n\
    public:\n    static void reset() {                 // reset new/memory counters\n\
    \        numMalloc = 0;\n        sumSize = 0;\n    }\n\n    static void trace(bool\
    \ b) {           // enable/disable tracing\n        doTrace = b;\n    }\n\n  \
    \  // implementation of tracked allocation:\n    static void* allocate(std::size_t\
    \ size, std::size_t align,\n                          const char* call) {\n  \
    \  // track and trace the allocation:\n    ++numMalloc;\n    sumSize += size;\n\
    ```"
