  md: "```\nstd::default_searcher{sub.begin(), sub.end()};\n```\n\n# 5. Using a boyer_moore_searcher:\n\
    \n```\nauto pos = std::search(text.begin(), text.end(),\n    std::boyer_moore_searcher{sub.begin(),\
    \ sub.end()});\n```\n\n# 6. Using a boyer_moore_horspool_searcher:\n\n```\nauto\
    \ pos = std::search(text.begin(), text.end(),\n    std::boyer_moore_horspool_searcher{sub.begin(),\n\
    \        sub.end()});\n```\n\nThe new searchers are defined in <functional>.\n\
    \nThe Boyer-Moore and the Boyer-Moore-Horspool searchers are well-known algorithms\
    \ that pre-compute tables (of hash values) before the search starts to improve\
    \ the speed of the search if the search covers a text and/or substring of significant\
    \ size. To use these searchers, the algorithms require random-access iterators\
    \ (instead of forward iterators, which suffice for a naive search()).\n\nIn lib/searcher1.cpp,\
    \ you can find a full program demonstrating the use of these different ways to\
    \ search for a substring.\n\nNote that all applications of search() yield an iterator\
    \ to the first character of a matching subsequence.\n\nIf there is no matching\
    \ subsequence, the passed end of the text is returned. This allows us to search\
    \ for all occurrences of a substring as follows:\n\n```\nstd::boyer_moore_searcher\
    \ bmsearch{sub.begin(), sub.end()};\nfor (auto pos = std::search(text.begin(),\
    \ text.end(), bmsearch);\n    pos != text.end();\n    pos = std::search(pos+sub.size(),\
    \ text.end(), bmsearch)) {\n    std::cout << \"found '\" << sub << \"' at index\
    \ \" << pos - text.begin() << '\\n';\n}\n```\n\n# Performance of Searchers\n\n\
    Which is the best way to search for a substring (fastest and/or least memory)?\
    \ One special aspect of this question is that we can also use the traditional\
    \ search() in parallel mode (which is not possible when using the new searchers).\n\
    \nThe answer depends on the circumstances:\n\n+   - Using just (non-parallel)\
    \ search() is usually the slowest approach, because for each character in text,\
    \ we start to find out whether a substring matches.\n+   - Using the default_searcher\
    \ should produce an equivalent result, but I noted a running time of up to a factor\
    \ of 3 slower.\n+   - Using find() might be faster, but this depends on the quality\
    \ of implementation in the library. With the measurements I did, I noted an improvement\
    \ in running time of between 20% and a factor of 100 compared to search().\n+\
    \   - For texts and substrings of significant size, the boyer_moore_searcher should\
    \ be the fastest approach. Compared to search(), I noted an improvement with a\
    \ factor of 50 or even 100. In large texts with significant substrings, this was\
    \ always the fastest search."
