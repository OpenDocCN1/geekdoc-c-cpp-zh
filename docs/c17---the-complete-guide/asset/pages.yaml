    Note that for std::string(), the destructor has the name ~basic_string.


    If a type-specific delete is defined, you have to call it after calling the destructor:


    ```

    MyType32* p = new(std::align_val_t{64}) MyType32{}; // 64-byte aligned

    ...

    p->~MyType32(); // destruct value

    MyType32::operator delete(p, std::align_val_t{64}); // free memory

    ```


    If you do not know the details of the type, one of the following functions for
    an object of type T could be called:


    ```

    void T::operator delete(void* ptr, std::size_t size, std::align_val_t align);

    void T::operator delete(void* ptr, std::align_val_t align);

    void T::operator delete(void* ptr, std::size_t size);

    void T::operator delete(void* ptr);

    void ::operator delete(void* ptr, std::size_t size, std::align_val_t align);

    void ::operator delete(void* ptr, std::align_val_t align);

    void ::operator delete(void* ptr, std::size_t size);

    void ::operator delete(void* ptr);

    ```


    Yes, it is that complicated and I will explain later in detail which one is called
    when. For the moment, I recommend that you stick to the following guidelines:


    +   1. Do not use over-alignment directly in new expressions at all. Instead,
    create your own helper type.

    +   2. Provide implementations of operator new() and operator delete() that use
    the same memory arena (so that calling plain delete always works).

    +   3. Provide type-specific implementations of operator delete() that match those
    of operator new() and call them directly instead of using delete expressions.


    Note that you cannot use a typedef or using declaration instead:


    ```

    using MyType64 = alignas(64) MyType32; // ERROR

    typedef alignas(64) MyType32 MyType64; // ERROR

    ...

    MyType64* p = new MyType64; // and therefore not possible

    ```


    This is because a typedef or using declaration is only a new name/alias for the
    original type and what is requested here is a different type that follows different
    rules for alignment.


    If you want to call an aligned new that returns the nullptr instead of throwing
    std::bad_alloc, you can do this as follows:


    ```

    // allocate a 64-byte aligned string (nullptr if none):

    std::string* p = new(std::align_val_t{64}, std::nothrow) std::string;

    if (p != nullptr) {

    ...

    }

    ```'
