  md: "This would mean having one allocation for each element plus 18 allocations\
    \ for the vector internally, because the vector allocates 18 times (more) memory\
    \ to hold its elements.²\n\nBehavior like this can become critical because memory\
    \ (re-)allocations take time and in some contexts (such as embedded systems),\
    \ allocating heap memory at all might be a problem.\n\nWe could ask the vector\
    \ to reserve sufficient memory ahead of time, but in general, you cannot avoid\
    \ reallocations unless you know the amount of data to be processed ahead of time.\
    \ If you do not know exactly how much data you process, you always have to find\
    \ a compromise between avoiding reallocations and not wasting too much memory.\
    \ And you need at least 1001 allocations (one allocation to hold the elements\
    \ in the vector and one for each string that does not use the small string optimization).\n\
    \n# Not Allocating Memory for Containers\n\nWe can easily improve the situation\
    \ by using a polymorphic allocator. First, we could use a std::pmr::vector and\
    \ allow the vector to allocate its memory on the stack:\n\npmr/pmr1.cpp\n\n```\n\
    #include <iostream>\n#include <string>\n#include <vector>\n#include <array>\n\
    #include <cstdlib>  // for std::byte\n#include <memory_resource>\n#include \"\
    ../../lang/tracknew.hpp\"\n\nint main()\n{\n    TrackNew::reset();\n\n    // allocate\
    \ some memory on the stack:\n    std::array<std::byte, 200000> buf;\n\n    //\
    \ and use it as initial memory pool for a vector:\n    std::pmr::monotonic_buffer_resource\
    \ pool{buf.data(), buf.size()};\n    std::pmr::vector<std::string> coll{&pool};\n\
    \n    for (int i=0; i < 1000; ++i) {\n        coll.emplace_back(\"just a non-SSO\
    \ string\");\n    }\n\n    TrackNew::status();\n}\n```\n\n2 The number of reallocations\
    \ might differ from platform to platform because the algorithms for reallocating\
    \ more memory differ. If the current memory capacity is exceeded, some implementations\
    \ enlarge it by 50%, while others double the size of the memory."
