- pgno: 272
  md: "# Chapter 21\n\n# Extensions of Type Traits\n\nC++17 extends the general abilities\
    \ to use type traits (standard type functions) and introduces some new type traits.\n\
    \n# 21.1 Type Traits Suffix _v\n\nSince C++17, you can use the suffix _v for all\
    \ type traits that yield a value (just like you can use the suffix _t for all\
    \ type traits that yield a type). For example, for any type T, you can now write:\n\
    \n```\nstd::is_const_v<T>      // since C++17\n```\n\ninstead of\n\n```\nstd::is_const<T>::value\
    \  // since C++11\n```\n\nThis applies to all type traits. The approach is that\
    \ a corresponding variable template is defined for each standard type trait. For\
    \ example:\n\n```\nnamespace std {\n    template<typename T>\n    constexpr bool\
    \ is_const_v = is_const<T>::value;\n}\n```\n\nSuch a type trait can be used to\
    \ formulate Boolean conditions which you can use at runtime:\n\n```\nif (std::is_signed_v<char>)\
    \ {\n    ...\n}\n```\n\nHowever, because type traits are evaluated at compile\
    \ time, you can also use the result at compile time (e.g., in a compile-time if\
    \ statement):\n\n```\nif constexpr (std::is_signed_v<char>) {\n    ...\n}\n```"
  merge: -1
  img_proc: true
- pgno: 273
  md: "Another application is to support different instantiations of templates:\n\n\
    ```\n// primary template for class C<T>\ntemplate<typename T, bool = std::is_pointer_v<T>>\n\
    class C {\n    ...\n};\n```\n\n```\n// partial specialization for pointer types:\n\
    template<typename T>\nclass C<T, true> {\n    ...\n};\n```\n\nHere, class C provides\
    \ a special implementation for pointer types.\n\nThe suffix _v can also be used\
    \ if type traits yield a non-Boolean value, such as std::extent<>, which yields\
    \ the size of the dimension of a raw array:\n\n```\nint a[5][7];\nstd::cout <<\
    \ std::extent_v<decltype(a)> << '\\n';    // prints 5\nstd::cout << std::extent_v<decltype(a),1>\
    \ << '\\n';  // prints 7\n```\n\n# 21.2 New Type Traits\n\nTable New Type Traits\
    \ lists the new type traits introduced with C++17.\n\nIn addition, is_literal_type<>\
    \ and result_of<> are deprecated since C++17.\n\nThe following paragraphs discuss\
    \ these traits in detail.\n\n# Type Trait is_aggregate<>\n\n```\nstd::is_aggregate<T>::value\n\
    ```\n\nyields whether T is an aggregate type:\n\n```\ntemplate<typename T>\nstruct\
    \ D : std::string, std::complex<T> {\n    std::string data;\n};\n```\n\n```\n\
    D<float> s{\"hello\", {4.5,6.7}, \"world\"};        // OK since C++17\nstd::cout\
    \ << std::is_aggregate<decltype(s)>::value;  // outputs: 1 (true)\n```"
