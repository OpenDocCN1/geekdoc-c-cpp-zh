- pgno: 43
  md: "Another example would be the use of a lock while performing some tasks depending\
    \ on a condition:\n\n```\nif (std::lock_guard<std::mutex> lg{collMutex}; !coll.empty())\
    \ {\n    std::cout << coll.front() << '\\n';\n}\n```\n\nwhich, due to class template\
    \ argument deduction, can now also be written as:\n\n```\nif (std::lock_guard\
    \ lg{collMutex}; !coll.empty()) {\n    std::cout << coll.front() << '\\n';\n}\n\
    ```\n\nIn any case, this code is equivalent to:\n\n```\n{\n    std::lock_guard<std::mutex>\
    \ lg{collMutex};\n    if (!coll.empty()) {\n        std::cout << coll.front()\
    \ << '\\n';\n    }\n}\n```\n\nwith the minor difference that lg is defined in\
    \ the scope of the if statement so that the condition is in the same scope (declarative\
    \ region).\n\nNote that this feature works in the same way as the initialization\
    \ statement of a traditional for loop. For the guard to be effective, the initializer\
    \ needs to declare a variable with a name. Otherwise, the initialization itself\
    \ is an expression that creates and immediately destroys a temporary object. As\
    \ a consequence, initializing a lock guard without a name is a logical error,\
    \ because the guard would no longer lock when the condition is checked:\n\n```\n\
    if (std::lock_guard<std::mutex>{collMutex}; // runtime ERROR:\n    !coll.empty())\
    \ {                 // - no longer locked\n    std::cout << coll.front() << '\\\
    n'; // - no longer locked\n}\n```\n\nIn principle, a single _ as a name would\
    \ be enough (as some programmers prefer but others hate and which is not allowed\
    \ in the global namespace):\n\n```\nif (std::lock_guard<std::mutex> _{collMutex};\
    \ // OK, but...\n    !coll.empty()) {\n    std::cout << coll.front() << '\\n';\n\
    }\n```\n\nYou can have multiple declarations with optional initializations:\n\n\
    ```\nif (auto x = qqq1(), y = qqq2(); x != y) {\n    std::cout << \"return values\
    \ \" << x << \" and \" << y << \" differ\\n\";\n}\n```\n\nor:\n\n```\nif (auto\
    \ x{qqq1()}, y{qqq2()}; x != y) {\n    std::cout << \"return values \" << x <<\
    \ \" and \" << y << \" differ\\n\";\n}\n```"
