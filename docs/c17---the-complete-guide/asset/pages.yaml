    \ (probably outputs 42 or 77)\n```\n\nThis is because the output operation calls\
    \ operator*, which returns payload, where placement new (called in emplace())\
    \ placed a new value without using the return value.\n\nIn a class like this,\
    \ you would have to add an additional pointer member that keeps the return value\
    \ of placement new and is used whenever the value is needed:\n\n```\ntemplate<typename\
    \ T>\nclass optional\n{\nprivate:\n    T payload;\n    T* p;           // to be\
    \ able to use the return value of placement new\npublic:\n    optional(const T&\
    \ t)\n    : payload(t) {\n        p = &payload;\n    }\n\n    template<typename...\
    \ Args>\n    void emplace(Args&&... args) {\n        payload.~T();\n        p\
    \ = ::new (&payload) T(std::forward<Args>(args)...);\n    }\n\n    const T& operator*()\
    \ const {\n        return *p;  // don't use payload here!\n    }\n};\n```\n\n\
    There is also a similar problem with allocator-based containers such as std::vector,\
    \ because internally, they use placement new via allocators. For example, a class\
    \ like vector is roughly implemented as follows:\n\n```\ntemplate<typename T,\
