  md: "# Chapter 5\n\n# Mandatory Copy Elision or Passing Unmaterialized Objects\n\
    \nThe topic of this chapter can be seen from two points of view:\n\n+   - Technically,\
    \ C++17 introduces a new rule for *mandatory copy elision* under certain conditions:\
    \ the former option to eliminate the copying of temporary objects when passing\
    \ or returning them by value now becomes mandatory.\n+   - The effect of this\
    \ is that we pass around the values of *unmaterialized objects* for initialization.\n\
    +   I will introduce this feature technically, coming later to the effect and\
    \ terminology of *materialization*.\n\n# 5.1 Motivation for Mandatory Copy Elision\
    \ for Temporaries\n\nSince the first standard, C++ has permitted the omission\
    \ (*elision*) of certain copy operations even if this might impact the behavior\
    \ of a program (e.g., skipping a print statement in the copy constructor). One\
    \ such case is when a temporary object is used to initialize a new object. This\
    \ happens especially when a temporary is passed to or returned from a function\
    \ by value. For example:\n\n```\nclass MyClass\n{\n    ...\n};\n\nvoid foo(MyClass\
    \ param) { //param is initialized by passed argument\n    ...\n}\n\nMyClass bar()\
    \ {\n    return MyClass{};      // returns temporary\n}\n```"
  merge: -1
  img_proc: true
- pgno: 61
  md: "```\nint main()\n{\n    foo(MyClass{});      // pass temporary to initialize\
    \ param\n    MyClass x = bar();   // use returned temporary to initialize x\n\
    \    foo(bar());          // use returned temporary to initialize param\n}\n```\n\
    \nHowever, because these optimizations were not mandatory, it had to be possible\
    \ to copy the objects by implicitly or explicitly providing a copy or move constructor.\
    \ That is, although the copy/move constructor was usually not called, it had to\
    \ exist. Code like this did not compile when no copy/move constructor was defined.\n\
    \nThus, with the following definition of the class MyClass, the code above did\
    \ not compile:\n\n```\nclass MyClass\n{\npublic:\n    ...\n    // no copy/move\
    \ constructor defined:\n    MyClass(const MyClass&) = delete;\n    MyClass(MyClass&&)\
    \ = delete;\n    ...\n};\n```\n\nIt was enough not to have the copy constructor,\
    \ because the move constructor is only implicitly available when no copy constructor\
    \ (or assignment operator or destructor) is user-declared.\n\nThe copy elision\
    \ to initialize objects from temporaries is mandatory since C++17. In fact, what\
    \ we will see later is that we simply pass a value for initialization as an argument\
    \ or return value that is then used to materialize a new object.\n\nThis means\
    \ that even with a definition of class MyClass not enabling copying at all, the\
    \ example above compiles.\n\nHowever, note that all other optional copy elisions\
    \ are still optional and require a callable copy or move constructor. For example:\n\
    \n```\nMyClass foo()\n{\n    MyClass obj;\n    ...\n    return obj;  // still\
    \ requires copy/move support\n}\n```\n\nHere, foo() contains a variable obj that\
    \ has a name (which is an lvalue when used). Therefore, the named return value\
    \ optimization (NRVO) is used, which still requires copy/move support. This would\
    \ be the case even if obj were a parameter:\n\n```\nMyClass bar(MyClass obj) \
    \ // copy elision for passed temporaries\n{\n    ...\n    return obj;  // still\
    \ requires copy/move support\n}\n```"
