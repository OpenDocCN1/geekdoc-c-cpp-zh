  md: '# Chapter 24


    # Substring and Subsequence Searchers


    Since C++98, the C++ standard library has provided a search algorithm for finding
    a subsequence of elements in a range. However, there are also other search algorithms.
    For example, by pre-computing statistics about the pattern you are searching for,
    these algorithms can perform significantly better for special tasks such as finding
    a substring in a large text.


    C++17 therefore introduced the Boyer-Moore and Boyer-Moore-Horspool search algorithms
    and various interfaces for using them. In particular, they are provided for searching
    for substrings in large texts, but can also make it faster to find subsequences
    in containers or ranges.


    # 24.1 Using Substring Searchers


    The new searchers were especially developed to search for strings (e.g., words
    or phrases) in large texts. So let us first demonstrate how to use them in such
    a scenario and how you can benefit with them.


    # 24.1.1 Using Searchers with search()


    We now have the following options for searching for a substring sub in a string
    text:


    +   1. String member find():

    +   ```

    +   std::size_type idx = text.find(sub);

    +   ```

    +   2. Algorithm search():

    +   ```

    +   auto pos = std::search(text.begin(), text.end(),

    +                         sub.begin(), sub.end());

    +   ```

    +   3. Parallel algorithm search():

    +   ```

    +   auto pos = std::search(std::execution::par,

    +                         text.begin(), text.end(),

    +                         sub.begin(), sub.end());

    +   ```

    +   4. Using a default_searcher:

    +   ```

    +   auto pos = std::search(text.begin(), text.end(),

    +   ```'
