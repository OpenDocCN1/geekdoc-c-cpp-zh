    \             // true\n\nstd::is_invocable_r<bool,C,int>::value         // true\n\
    std::is_invocable_r<int,C,long>::value         // true\nstd::is_invocable_r<void,C,int>::value\
    \         // true\nstd::is_invocable_r<char*,C,int>::value        // false\nstd::is_invocable_r<long,int(*)(int)>::value\
