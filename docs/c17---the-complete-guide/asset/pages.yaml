- pgno: 250
  md: "# 20.3 Path Operations\n\n• Only different formats for specifying a directory\
    \ separator are detected. Thus, the following paths are all equal (provided the\
    \ backslash is a valid directory separator):\n\n```\ntmp1/f\n/tmp1/f\n/tmp1\\\
    f\ntmp1\\ /f\n```\n\nIt is only if you call lexically_normal() for each path that\
    \ all of the paths above are equal (provided the backslash is a valid directory\
    \ separator). For example:\n\n```\nstd::filesystem::path p1{\"tmp1/f\"};\nstd::filesystem::path\
    \ p2{\"../tmp1/f\"};\n```\n\n```\np1 == p2 //true\np1.compare(p2) //not 0\np1.lexically_normal()\
    \ == p2.lexically_normal() //true\np1.lexically_normal().compare(p2.lexically_normal())\
    \ //0\n```\n\nIf you want to take the filesystem into account so that symbolic\
    \ links are handled correctly, you can use equivalent(). However, note that this\
    \ function requires that both paths represent existing files. Thus, a generic\
    \ way to compare paths as accurately as possible (which does not have the best\
    \ performance) is as follows:\n\n```\nbool pathsAreEqual(const std::filesystem::path&\
    \ p1, const std::filesystem::path& p2)\n{\n\treturn exists(p1) && exists(p2) ?\
    \ equivalent(p1, p2)\n\t\t: p1.lexically_normal() == p2.lexically_normal();\n\
    }\n```\n\n# 20.3.7 Other Path Operations\n\nTable Other Path Operations lists\
    \ the remaining path operations not listed yet.\n\n| Call | Effect |\n|------|--------|\n\
    | p.hash_value() | Yields the hash value for a path |\n\nNote that only equal\
    \ paths are guaranteed to have the same hash value. The following paths yield\
    \ different hash values:\n\n+   tmp1/f\n+   ./tmp1/f\n+   /tmp1/. /f\n+   tmp1/tmp11/..\
    \ /f\n\nTherefore, you might want to normalize paths before you put them in a\
    \ hash table."
