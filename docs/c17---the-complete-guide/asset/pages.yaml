  md: 'Note that list initialization (using curly braces) is the only way you can
    directly initialize a single value of a std::byte object. All other forms do not
    compile:


    ```

    std::byte b1{42};      // OK (as for all enums with fixed underlying type since
    C++17)

    std::byte b2(42);      // ERROR

    std::byte b3 = 42;     // ERROR

    std::byte b4 = {42};   // ERROR

    ```


    This is a direct consequence of the fact that std::byte is implemented as an enumeration
    type, using the new way of initializing scoped enumerations with integral values.


    There is also no implicit conversion, which means that you have to initialize
    the byte array with an explicitly converted integral literal:


    ```

    std::byte b5[] {1};           // ERROR

    std::byte b6[] {std::byte{1}};  // OK

    ```


    Without any initialization, the value of a std::byte is undefined for objects
    on the stack:


    ```

    std::byte b;          // undefined value

    ```


    As usual (except for atomics), you can force an initialization with all bits set
    to zero with list initialization:


    ```

    std::byte b{};        // same as b{0}

    ```


    std::to_integer<>() allows you to use a std::byte object as an integral value
    (including bool and char). Without the conversion, the output operator would not
    compile. Note that because it is a template, you even need the conversion fully
    qualified with std:::


    ```

    std::cout << b1;                     // ERROR

    std::cout << to_integer<int>(b1);     // ERROR (ADL doesn''t work here)

    std::cout << std::to_integer<int>(b1);  // OK

    ```


    A using declaration would work too (but use it in a local scope only):


    ```

    using std::to_integer;

    ...

    std::cout << to_integer<int>(b1);     // OK

    ```


    Such a conversion is also necessary to use a std::byte as a Boolean value. For
    example:


    ```

    if (b2) ...                     // ERROR

    if (b2 != std::byte{0}) ...      // OK

    if (to_integer<bool>(b2)) ...    // ERROR (ADL doesn''t work here)

    if (std::to_integer<bool>(b2)) ...  // OK

    ```


    Because std::byte is defined as an enumeration type with unsigned char as the
    underlying type, its size is always 1:


    ```

    std::cout << sizeof(b);     // always 1

    ```


    The number of bits depends on the number of bits of the underlying type unsigned
    char, which you can find out with the standard numeric limits:


    ```

    std::cout << std::numeric_limits<unsigned char>::digits; // number of bits of
    std::byte

    ```


    which is the same as:'
