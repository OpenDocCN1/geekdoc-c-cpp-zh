  md: "```\n[[nodiscard]] static void* operator new (std::size_t size) {\n    ...\n\
    }\n```\n\n```\n[[nodiscard]] static void* operator new (std::size_t size,\n  \
    \  std::align_val_t align) {\n    ...\n}\n```\n\nIt is rare but (as you can see\
    \ here) possible to call operator new() directly (not using a new expression).\
    \ With [[nodiscard]], compilers will then detect whether the caller forgot to\
    \ use the return value, which would result in a memory leak.\n\n# When Is operator\
    \ new() Called?\n\nAs explained, we now can have two overloads of operator new():\n\
    \n+   - The version with only the size argument, which was also supported before\
    \ C++17, is generally provided for requests of default-aligned data. However,\
    \ it can also serve as a fallback if a version for over-aligned data is not provided.\n\
    +   - The version with the additional align argument, which is available since\
    \ C++17, is generally provided for requests of over-aligned data.\n\nWhich overload\
    \ is used does not necessarily depend on whether alignas is used; it depends instead\
    \ on the platform-specific definition of over-aligned data.\n\nA compiler switches\
    \ from default-alignment to over-alignment according to a general alignment value,\
    \ which you can find in the new preprocessor constant\n\n```\n__STDCPP_DEFAULT_NEW_ALIGNMENT__\n\
    ```\n\nThat is, with any alignment larger than this constant, a call of new switches\
    \ from trying to call\n\n```\noperator new(std::size_t)\n```\n\nto trying to call\n\
    \n```\noperator new(std::size_t, std::align_val_t)\n```\n\nAs a consequence, the\
    \ output of the following code might vary from platform to platform:\n\n```\n\
    struct alignas(32) MyType32 {\n    ...\n    static void* operator new (std::size_t\
    \ size) {\n        std::cout << \"MyType32::new() with size \" << size << '\\\
    n';\n        return ::operator new(size);\n    }\n    static void* operator new\
    \ (std::size_t size, std::align_val_t align) {\n        std::cout << \"MyType32::new()\
    \ with size \" << size\n                  << \" and alignment \" << static_cast<std::size_t>(align)\
    \ << '\\n';\n        return ::operator new(size, align);\n    }\n    ...\n```"
