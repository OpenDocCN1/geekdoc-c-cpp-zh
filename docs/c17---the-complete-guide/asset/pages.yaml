- pgno: 433
  md: '# 35.2.7 Deprecated Library Features


    The following library features are deprecated since C++17 and should no longer
    be used:


    +   - The type trait `result_of<>`.

    +     Use `invoke_result<>` instead.

    +   - The type trait `is_literal_type<>` is deprecated.

    +   - For shared pointers, the member function `unique()` is deprecated.

    +     Use `use_count()` instead.

    +   - The support for character code conversions (the whole contents of the header
    file `<codecvt>` and the standard classes `wstring_convert<>` and `wbuffer_convert<>`)
    are deprecated.

    +     This functionality was introduced in C++11, but it turned out that the approach
    is not very helpful in practice and has security flaws. To make room for better
    support of character encoding in C++20, the whole contents of `<codecvt>` with
    the standard classes for character type conversions became deprecated in C++17.

    +   - Class `std::iterator<>` is deprecated.

    +   - Class `std::raw_storage_iterator<>` is deprecated.

    +   - `std::get_temporary_buffer()` is deprecated.

    +   - `std::allocator<void>`, the specialization for void of the standard allocator,
    is deprecated.

    +   - The use of the header files `<ccomplex>`, `<cstdalign>`, `<cstdbool>`, and
    `<ctgmath>` is deprecated.

    +   - The use of `std::uncaught_exception()` is deprecated.

    +     Use `std::uncaught_exceptions()` instead.

    +   - The memory synchronization order `memory_order_consume` is temporarily discouraged.
    The way it is specified now, it is not useful, but this might be fixed later.

    +     In the meantime, use `memory_order_acquire` instead.


    # 35.3 Afternotes


    Removing throw specifications was finally accepted with the wording proposed by
    Alisdair Meredith in http://wg21.link/p0003r5.


    Removing the use of the keyword register was finally accepted with the wording
    proposed by Alisdair Meredith in http://wg21.link/p0001r1.


    Removing ++ and -- for bool was finally accepted with the wording proposed by
    Alisdair Meredith in http://wg21.link/p0002r1.


    Removing trigraphs was accepted with the wording proposed by Richard Smith in
    http://wg21.link/n4086.


    Removing auto_ptr<> was first proposed by Billy Baker in http://wg21.link/n4168.
    The finally accepted wording for this removal was formulated by Stephan T. Lavavej
    in http://wg21.link/n4190.


    Removing random_shuffle() and the functional helpers for function objects was
    finally accepted with the wording proposed by Stephan T. Lavavej in http://wg21.link/n4190.


    Removing allocator support for std::function<> was finally accepted with the wording
    proposed by Jonathan Wakely in http://wg21.link/p0302r1.'
  merge: -1
  img_proc: true
