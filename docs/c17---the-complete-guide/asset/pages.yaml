- pgno: 332
  md: "# 26.1.2 Moving Nodes Between Containers\n\nYou can also use node handles to\
    \ move (splice) elements from one container to another. The containers can even\
    \ differ in the following way:\n\n+   - One supports duplicates while another\
    \ does not (e.g., you can move elements from a multimap to a map)\n+   - Comparison\
    \ functions and hash functions might differ\n\nFor example, consider the following\
    \ program:\n\nlib/nodemove.cpp\n\n```\n#include <iostream>\n#include <string>\n\
    #include <map>\n\ntemplate<typename T1, typename T2>\nvoid print(const T1& coll1,\
    \ const T2& coll2)\n{\n    std::cout << \"values:\\n\";\n    for (const auto&\
    \ [key, value] : coll1) {\n        std::cout << \" [\" << key << \":\" << value\
    \ << \"]\";\n    }\n    std::cout << '\\n';\n    for (const auto& [key, value]\
    \ : coll2) {\n        std::cout << \" [\" << key << \":\" << value << \"]\";\n\
    \    }\n    std::cout << '\\n';\n}\n\nint main()\n{\n    std::multimap<double,\
    \ std::string> src {{1.1, \"one\"},\n                                        \
    \    {2.2, \"two\"},\n                                            {3.3, \"three\"\
    }};\n\n    std::map<double, std::string> dst {{3.3, \"old data\"}};\n\n    print(src,\
    \ dst);\n\n    // move some elements from multimap src to map dst:\n    dst.insert(src.extract(src.find(1.1)));\
    \  // splice using an iterator\n    dst.insert(src.extract(2.2));            //\
    \ splice using the key\n\n    print(src, dst);\n}\n```"
