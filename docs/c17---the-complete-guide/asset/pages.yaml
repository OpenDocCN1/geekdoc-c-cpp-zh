  md: "```\n};\n```\n\n```\nauto p = new MyType32;\n```\n\nIf the default alignment\
    \ is 32 (or more and the code compiles), the expression new MyType32 will call\
    \ the first overload of operator new() with only the size parameter, so that the\
    \ output is something like:⁸\n\n```\nMyType32::new() with size 128\n```\n\nIf\
    \ the default alignment is less than 32, the second overload of operator new()\
    \ for two arguments will be called, so that the output becomes something like:\n\
    \n```\nMyType32::new() with size 128 and alignment 32\n```\n\n# Type-Specific\
    \ Fallbacks\n\nIf the std::align_val_t overloads are not provided for a type-specific\
    \ operator new(), the overloads without this argument are used as fallbacks. Thus,\
    \ a class that (as supported before C++17) provides only operator new() overloads\
    \ still compiles and has the same behavior (note that for the global operator\
    \ new() this is not the case):\n\n```\nstruct NonalignedNewOnly {\n    ...\n \
    \   static void* operator new (std::size_t size) {\n        ...\n    }\n     \
    \   ...    // no operator new(std::size_t, std::align_val_t align)\n};\n```\n\n\
    ```\nauto p = new NonalignedNewOnly;  // OK: operator new(size_t) used\n```\n\n\
    The opposite is not true. If a type provides only the overloads with the alignment\
    \ parameter, any attempt to allocate storage with new using the default alignment\
    \ will fail:\n\n```\nstruct AlignedNewOnly {\n    ...    // no operator new(std::size_t)\n\
    \    static void* operator new (std::size_t size, std::align_val_t align) {\n\
    \        return std::aligned_alloc(static_cast<size_t>(align), size);\n    }\n\
    };\n```\n\n```\nauto p = new AlignedNewOnly;  // ERROR: no operator new() for\
    \ default alignment\n```\n\nIt would also be an error if an alignment that is\
    \ (less than) the default alignment is requested for the type."
