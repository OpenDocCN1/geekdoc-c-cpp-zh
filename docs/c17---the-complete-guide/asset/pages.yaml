    form the *other* file types.


    # 20.3  Path Operations


    There are plenty of operations that you can call to deal with filesystems. A key
    type for dealing with the filesystem is type `std::filesystem::path`, which can
    be used as an absolute or relative path of a file that might or might not exist
    (yet).


    You can create paths, inspect them, modify them, and compare them. Because these
    operations usually do not take the filesystem into account (ignoring whether files
    exist, not following symbolic links, etc.), they are cheap to call. As a consequence,
    they are usually member functions (if they are neither constructors nor operators).


    # 20.3.1  Path Creation


    Table *Path Creation* lists the ways to create a new path object.


    | Call | Effect |

    |---|---|

    | `path{charseq}` | Initializes a path from a character sequence |

    | `path{beg,end}` | Initializes a path from a range |

    | `u8path(u8string)` | Yields a path from a UTF-8 string |

    | `current_path()` | Yields the path of the current working directory |

    | `temp_directory_path()` | Yields the path for temporary files |


    *Table 20.3. Path Creation*


    The first constructor, which takes a character sequence, represents a couple of
    valid ways to pass a character sequence:


    +   - A `string`

    +   - A `string_view`

    +   - An array of characters ending with a null terminator

    +   - An input iterator (pointer) to characters ending with the null terminator'
