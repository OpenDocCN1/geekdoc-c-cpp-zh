- pgno: 47
  md: "According to the one definition rule (ODR), a variable or entity has to be\
    \ defined in exactly one translation unit—unless the variable or entity is declared\
    \ to be inline.\n\nEven include guards do not help:\n\n```\n#ifndef MYHEADER_HPP\n\
    #define MYHEADER_HPP\n\nclass MyClass {\n    static std::string msg;\n    ...\n\
    };\nstd::string MyClass::msg{\"OK\"};    // Link ERROR if included by multiple\
    \ CPP files\n\n#endif\n```\n\nThe problem is not that the header file might be\
    \ included multiple times; the problem is that two different CPP files include\
    \ the header so that both define MyClass::msg.\n\nFor the same reason, you get\
    \ a link error if you define an object of your class in a header file:\n\n```\n\
    class MyClass {\n    ...\n};\nMyClass myGlobalObject;            // Link ERROR\
    \ if included by multiple CPP files\n```\n\n# Workarounds\n\nFor some cases, there\
    \ are workarounds:\n\n+   - You can initialize static const data members of integral\
    \ and enumeration types in a class/struct:\n\n```\nclass MyClass {\n    static\
    \ const bool trace = false;  // OK, literal type\n    ...\n};\n```\n\nHowever,\
    \ this is only allowed for literal types, such as fundamental integral, floating-point,\
    \ or pointer types, or for classes with only constant expressions to initialize\
    \ non-static data members and no user-defined or virtual destructor. In addition,\
    \ you still need a definition in one translation unit once you need the location\
    \ of the member (e.g., by binding it to a reference).\n\n+   - You can define\
    \ an inline function that returns a static local variable:\n\n```\ninline std::string&\
    \ getMsg() {\n    static std::string msg{\"OK\"};\n    return msg;\n}\n```\n\n\
    +   - You can define a static member function that returns the value:\n\n```\n\
    class MyClass {\n    static std::string& getMsg() {\n    static std::string msg{\"\
    OK\"};\n```"
  merge: -1
  img_proc: true
- pgno: 48
  md: "```\nreturn msg;\n}\n...\n};\n```\n\n+   - You can use variable templates (since\
    \ C++14):\n+     `template<typename T = std::string>`\n+     `T myGlobalMsg{\"\
    OK\"};`\n\n+   - You can define a class template for the static member(s):\n+\
    \     `template<typename = void>`\n+     `class MyClassStatics`\n+     `{`\n+\
    \     `    static std::string msg;`\n+     `};`\n+   \n+     `template<typename\
    \ T>`\n+     `std::string MyClassStatics<T>::msg{\"OK\"};`\n+   \n+     and then\
    \ even derive from it:\n+     `class MyClass : public MyClassStatics<>`\n+   \
    \  `{`\n+     `    ...`\n+     `};`\n\nHowever, all of these approaches lead to\
    \ significant overhead, less readability, and/or different ways to use the global\
    \ variable. In addition, the initialization of a global variable might be postponed\
    \ until its first use, which disables applications in which we want to initialize\
    \ objects at program start (such as when using an object to monitor the process).\n\
    \n# 3.2 Using Inline Variables\n\nNow, with inline, you can have a single globally\
    \ available object by defining it only in a header file, which might be included\
    \ by multiple CPP files:\n\n```\nclass MyClass {\n    inline static std::string\
    \ msg{\"OK\"};  // OK since C++17\n    ...\n};\n```\n\n```\ninline MyClass myGlobalObj;\
    \  // OK even if included/defined by multiple CPP files\n```\n\nFormally, the\
    \ inline used here has the same semantics as a function declared inline:\n\n+\
    \   - It can be defined in multiple translation units, provided all definitions\
    \ are identical.\n\n+   - It must be defined in every translation unit in which\
    \ it is used.\n\nBoth are given by including the definition from the same header\
    \ file. The resulting behavior of the program is as if there were exactly one\
    \ variable."
