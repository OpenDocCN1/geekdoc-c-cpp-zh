  md: "```\nelse { //I==2\n    return c.value();\n}\n}\ntemplate<std::size_t I> decltype(auto)\
    \ get(const Customer& c) {\n    static_assert(I < 3);\n    if constexpr (I ==\
    \ 0) {\n        return c.firstname();\n    }\n    else if constexpr (I == 1) {\n\
    \        return c.lastname();\n    }\n    else { //I==2\n        return c.value();\n\
    \    }\n}\ntemplate<std::size_t I> decltype(auto) get(Customer&& c) {\n    static_assert(I\
    \ < 3);\n    if constexpr (I == 0) {\n        return std::move(c.firstname());\n\
    \    }\n    else if constexpr (I == 1) {\n        return std::move(c.lastname());\n\
    \    }\n    else { //I==2\n        return c.value();\n    }\n}\n```\n\nNote that\
    \ you should have all three overloads, to be able to deal with constant, non-constant,\
    \ and movable objects.⁶ To enable the return value to be a reference, you should\
    \ use decltype(auto).⁷\n\nAgain, we use the new compile-time if feature, which\
    \ makes the implementation simple if the getters have different return types.\
    \ Without this feature, we would need full specializations again, such as:\n\n\
    ```\ntemplate<std::size_t> decltype(auto) get(const Customer& c);\ntemplate<std::size_t>\
    \ decltype(auto) get(Customer& c);\ntemplate<std::size_t> decltype(auto) get(Customer&&\
    \ c);\ntemplate<> decltype(auto) get<0>(const Customer& c) { return c.firstname();\
    \ }\ntemplate<> decltype(auto) get<0>(Customer& c) { return c.firstname(); }\n\
    ```\n\n⁶ The standard library provides a fourth get<>() overload for const&&,\
    \ which is provided for other reasons (see http://wg21.link/lwg2485) and not necessarily\
    \ to support structured bindings.\n\n⁷ decltype(auto) was introduced with C++14\
    \ to allow a (return) type to be deduced from the value category of an expression.\
    \ By using this as a return type, roughly speaking, references are returned by\
    \ reference, but temporaries are returned by value."
