    elem: 19\nelem: 17\nelem: 13\nelem: 11\nelem: 9\nelem: 7\nelem: 5\nelem: 3\nelem:\
    \ 2\noutput with 9 calls\n```\n\nIf the counter for the calls is atomic, you could\
    \ also use parallel algorithms:\n\n```\nstd::sort(std::execution::par,\n    v.begin(),\
    \ v.end(),\n    std::ref(sc));\n```\n\n# 9.1.3 No Partial Class Template Argument\
