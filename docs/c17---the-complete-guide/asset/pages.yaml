- pgno: 248
  md: '```

    std::cout << p << ''\n'';

    std::cout << p / p << ''\n'';

    ```


    On POSIX-based systems the output is:


    ```

    "myfile.git/.git1/1"

    "myfile.git/.git1/1/myfile.git/.git1/1"

    ```


    On Windows systems the output is:


    ```

    "myfile.git\\.git1\\1"

    "myfile.git\\.git1\\1\\myfile.git\\.git1\\1"

    ```


    Note that appending an absolute sub-path means replacing an existing path. For
    example, after:


    ```

    namespace fs = std::filesystem;

    auto p1 = fs::path("/usr") / "tmp";      // path is /usr/tmp or /usr\tmp

    auto p2 = fs::path("/usr/") / "tmp";      // path is /usr/tmp

    auto p3 = fs::path("/usr") / "/tmp";      // path is /tmp

    auto p4 = fs::path("/usr/") / "/tmp";     // path is /tmp

    ```


    we have 4 paths referring to two different files:


    +   - p1 and p2 are equal and refer to the file /usr/tmp (note that on Windows
    they are equal with p1 being /usr\tmp).

    +   - p3 and p4 are equal and refer to the file /tmp because an absolute path
    was appended.


    For root elements, whether a new element is assigned is also important. For example,
    on Windows, we have:


    ```

    auto p1 = fs::path("usr") / "C:/tmp";    // path is C:/tmp

    auto p2 = fs::path("usr") / "C:";        // path is C:

    auto p3 = fs::path("C:") / "";          // path is C:

    auto p4 = fs::path("C:usr") / "/tmp";   // path is C:/tmp

    auto p5 = fs::path("C:usr") / "C:tmp";  // path is C:usr\tmp

    auto p6 = fs::path("C:usr") / "c:tmp";  // path is c:tmp

    auto p7 = fs::path("C:usr") / "D:tmp";  // path is D:tmp

    ```


    The function make_preferred() converts the directory separators inside a path
    to the native format. For example:


    ```

    std::filesystem::path p{"//server/dir//subdir///file.txt"};

    p.make_preferred();

    std::cout << p << ''\n'';

    ```


    writes the following on POSIX-based platforms:


    ```

    "//server/dir/subdir/file.txt"

    ```


    On Windows, the output is as follows:


    ```

    "\\\server\\dir\\\subdir\\\\file.txt"

    ```


    Note that the leading root name is not modified because it has to consist of two
    slashes or backslashes. Note also that this function cannot convert backslashes
    into a slash on a POSIX-based system because the backslash is not recognized as
    a directory separator.'
