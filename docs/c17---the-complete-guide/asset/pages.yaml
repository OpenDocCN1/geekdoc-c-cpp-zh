    std::cout << sv.data();            // OK

    ```


    +   - To create a string view from a string, an implicit conversion operator is
    provided in class std::string. Again, having the null terminator right after the
    last character, which is usually guaranteed for a string, is not guaranteed to
    exist for the string view:


    ```

    std::string s = "hello";

    std::cout << s.size();     // 5

    std::cout << s.at(5);      // throws std::out_of_range

    std::cout << s[5];         // OK, prints the value of ''\0''

    std::cout << s.data();     // OK

    ```


    ```

    std::string_view sv{s};

    std::cout << sv.size();    // 5

    std::cout << sv.at(5);     // throws std::out_of_range exception

    std::cout << sv[5];        // undefined behavior

    std::cout << sv.data();    // OOPS: only works because ''\0'' is behind sv

    ```


    +   - Because the literal operator is defined for the suffix sv, you can also
    create a string view as follows:


    ```

    using namespace std::literals;

    auto s = "hello"sv;

    ```


    Note that std::char_traits members were changed to be constexpr so that you can
    initialize a string view from a string literal at compile time:


    ```

    constexpr string_view hello = "Hello World!";

    ```


    # Null Termination


    The different ways to create a string view demonstrate a remarkable aspect of
    string views that is important to understand: in general, the values of string
    views are not null terminated and can even be nullptr. Therefore, you should always
    check the size() before accessing the characters of a string view (unless you
    know specific things about the value).


    However, you can have two special scenarios, which can both be considered confusing:


    +   1. You can ensure that the value of the string view is null terminated, although
    the null terminator is not part of the value. This is what you get when you initialize
    a string view from a string literal:


    ```

    std::string_view sv1{"hello"};      // ''\0'' is right behind the value of sv1

    ```'
