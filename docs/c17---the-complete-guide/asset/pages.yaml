  md: "```\nif (...) {\n  throw ... ; // let destructor call rollback()\n}\n\n// calls\
    \ commit() in the good case and rollback() on exception\ncatch (...) {\n  Request\
    \ r2{...};\n}\n\n// calls commit() if no additional exception\n```\n\nHere, the\
    \ constructor of r2 initializes initialUncaught with 1 because we are already\
    \ handling an exception inside the catch clause. However, when the destructor\
    \ for r2 is called and no additional exception was raised, initialUncaught is\
    \ still 1 and therefore commit() is called. std::uncaught_exceptions() will only\
    \ yield 2 if a second unhandled exception is raised inside the catch clause. As\
    \ a consequence, the destructor of r2 will call rollback().\n\nSee lib/uncaught.cpp\
    \ for a complete example.\n\nThe old API std::uncaught_exception() (without the\
    \ s at the end) is deprecated since C++17 and should no longer be used.\n\n# 28.2\
    \ Shared Pointer Improvements\n\nFor shared pointers a few improvements were added\
    \ with C++17.\n\nNote that in addition, the member function unique() was deprecated.\n\
    \n# 28.2.1 Special handling for Shared Pointers to Raw C Arrays\n\nSince C++17,\
    \ you can instantiate shared pointers explicitly for arrays to ensure that delete[]\
    \ is called by the deleter (as was already possible for unique pointers since\
    \ C++11). You can now simply call:\n\n```\nstd::shared_ptr<std::string[]> p{new\
    \ std::string[10]};\n```\n\ninstead of:\n\nstd::shared_ptr<std::string> p{new\
    \ std::string[10], std::default_delete<std::string>()};\n\nor:\n\nstd::shared_ptr<std::string>\
    \ p{new std::string[10], [](std::string* p) { delete[] p; }};\n\nWith the instantiation\
    \ as an array, the API also changes slightly: instead of operator*, you have to\
    \ use operator[] (as for unique pointers of raw arrays):\n\n```\nstd::shared_ptr<std::string>\
    \ ps{new std::string};\n*ps = \"hello\"; // OK\n```"
