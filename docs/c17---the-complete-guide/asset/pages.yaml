  md: "This feature is needed in particular if a member function of the object shall\
    \ yield a shared pointer to the object:\n\n```\nclass Person : public std::enable_shared_from_this<Person>\n\
    {\n    ...\n    std::shared_ptr<Person> sharedPtrTo() {\n        return shared_from_this();\n\
    \    }\n};\n```\n\nSince C++17, there is an additional helper function to yield\
    \ a weak pointer to the object:\n\n```\nPerson* pp = new Person{...};\nstd::shared_ptr<Person>\
    \ sp{pp};                 // sp gets ownership\n...\nstd::weak_ptr<Person> wp{pp->weak_from_this()};\
    \ // wp observes ownership of what sp owns\n```\n\nBefore C++17, you could have\
    \ the same functionality with\n\n```\nweak_ptr<Person> wp{pp->shared_from_this()}\n\
    ```\n\nbut weak_from_this() achieves the same effect with fewer reference count\
    \ modifications.\n\nIn addition, the behavior of a specific corner case was clarified:\
    \ If a raw pointer is passed to two different shared pointers (which is valid\
    \ if only one of them really deletes the associated resource), then shared_from_this()\
    \ and weak_from_this() share the ownership with the shared pointer created first.\
    \ This means that the following is possible:\n\n```\nstruct Person : public std::enable_shared_from_this<Person>\n\
    {\n    ...\n};\n```\n\n```\nPerson* p = new Person;\nstd::shared_ptr<Person> sp1(p);\
    \      // create a first shared pointer\n\n{\n    std::shared_ptr<Person> sp2(p,\
    \      // create a second shared pointer not sharing ownership\n        [](void*)\
    \ {\n        });\n    auto sp3{p->shared_from_this()};   // sp3 shares ownership\
    \ with sp1\n}\n\nauto sp4{p->shared_from_this()};      // sp4 shares ownership\
    \ with sp1\n```\n\nBefore this clarification, some implementations allowed sp3\
    \ and sp4 to share ownership with the shared pointer created last, which threw\
    \ std::bad_weak_ptr when initializing sp4."
