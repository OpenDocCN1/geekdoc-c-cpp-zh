  md: "# Chapter 7\n\n# New Attributes and Attribute Features\n\nSince C++11, it has\
    \ been possible to specify attributes (formal annotations that enable or disable\
    \ warnings). With C++17, new attributes were introduced. In addition, attributes\
    \ can now be used in a few more places and with some additional convenience.\n\
    \n# 7.1 Attribute [[nodiscard]]\n\nThe new attribute [[nodiscard]] can be used\
    \ to encourage warnings by the compiler if a return value of a function is not\
    \ used (however, the compiler is not required to issue a warning).\n\n[[nodiscard]]\
    \ should usually be used to signal misbehavior when return values are not used.\
    \ The misbehavior might be:\n\n+   - Memory leaks, such as not using returned\
    \ allocated memory\n+   - Unexpected or non-intuitive behavior such as getting\
    \ different/unexpected behavior when not using the return value\n+   - Unnecessary\
    \ overhead, such as calling something that is a no-op if the return value is not\
    \ used\n\nHere are some examples of where using this attribute is useful:\n\n\
    +   - Functions that allocate resources that have to be released by another function\
    \ call should be marked with [[nodiscard]]. A typical example would be a function\
    \ to allocate memory, such as malloc() or the member function allocate() of allocators.\n\
    +   \n+     However, note that some functions might return a value meaning that\
    \ no compensating call is necessary. For example, programmers call the C function\
    \ realloc() with a size of zero bytes to free memory so that the return values\
    \ do not have to be saved to call free() later. For this reason, marking realloc()\
    \ with [[nodiscard]] would be counterproductive.\n+   - A good example of a function\
    \ changing its behavior non-intuitively when not using the return value is std::async()\
    \ (introduced with C++11). std::async() starts a functionality asynchronously\
    \ in the background and returns a handle that can be used to wait for the end\
    \ of the started functionality (and get access to any return value or exception).\
    \ However, when the return value is not used the call becomes a synchronous call\
    \ because the destructor of the unused return value is called immediately waiting\
    \ for the end of the started functionality. Therefore, not using the return value\
    \ silently contradicts the whole"
