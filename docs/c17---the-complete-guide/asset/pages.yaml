  md: "# 8.5 Hexadecimal Floating-Point Literals\n\nC++17 standardizes the ability\
    \ to specify hexadecimal floating-point literals (which some compilers supported\
    \ even before C++17). This notation is especially useful when an an exact floating-point\
    \ representation is desired (for decimal floating-point values there is no general\
    \ guarantee that the exact value exists).\n\nFor example:\n\nlang/hexfloat.cpp\n\
    \n```\n#include <iostream>\n#include <iomanip>\n\nint main()\n{\n    // init list\
    \ of floating-point values:\n    std::initializer_list<double> values {\n    \
    \    0x1p4,      // 16\n        0xA,        // 10\n        0xAp2,      // 40\n\
    \        5e0,        // 5\n        0x1.4p+2,   // 5\n        1e5,        // 100000\n\
    \        0x1.86Ap16, // 100000\n        0xC.68p+2,  // 49.625\n    };\n\n    //\
    \ print all values both as decimal and hexadecimal value:\n    for (double d :\
    \ values) {\n        std::cout << \"dec: \" << std::setw(6) << std::defaultfloat\
    \ << d\n                  << \"  hex: \" << std::hexfloat << d << '\\n';\n   \
    \ }\n}\n```\n\nThe program defines different floating-point values by using different\
    \ existing notations and the new hexadecimal floating-point notation. The new\
    \ notation is a base-2 scientific notation:\n\n+   - The significand/mantissa\
    \ is written in hexadecimal format.\n\n+   - The exponent is written in decimal\
    \ format and interpreted with respect to base 2.\n\nFor example, 0xAp2 is a way\
    \ to specify the decimal value 40 (10 multiplied by “2 to the power of 2”). The\
    \ value could also be expressed as 0x1.4p+5, which is 1.25 multiplied by 32 (0.4\
    \ is a hexadecimal quarter and 2 to the power of 5 is 32).\n\nThe program has\
    \ the following output:\n\n```\ndec:      16  hex: 0x1p+4\ndec:      10  hex:\
    \ 0x1.4p+3\ndec:      40  hex: 0x1.4p+5\ndec:       5  hex: 0x1.4p+2\n```"
