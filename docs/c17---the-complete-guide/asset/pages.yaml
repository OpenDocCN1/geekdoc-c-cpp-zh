- pgno: 172
  md: "Initializations and assignments always use the best match to find the new alternative.\
    \ If the type does not fit exactly, there might be surprises.\n\nNote that empty\
    \ variants, variants with reference members, variants with C-style array members,\
    \ and variants with incomplete types (such as void) are not allowed.³\n\nThere\
    \ is no empty state. This means that for each constructed object, at least one\
    \ constructor has to be called. The default constructor initializes the first\
    \ type with the default constructor:\n\n```\nstd::variant<std::string, int> var;\
    \        // => var.index() == 0, value == \"\"\n```\n\nIf there is no default\
    \ constructor defined for the first type, calling the default constructor for\
    \ the variant is a compile-time error:\n\n```\nstruct NoDefConstr {\n    NoDefConstr(int\
    \ i) {\n        std::cout << \"NoDefConstr::NoDefConstr(int) called\\n\";\n  \
    \  }\n};\n```\n\n```\nstd::variant<NoDefConstr, int> v1;    // ERROR: can't default\
    \ construct first type\n```\n\nThe auxiliary type std::monostate provides the\
    \ ability to deal with this situation and also provides the ability to simulate\
    \ an empty state.\n\n# std::monostate\n\nTo support variants where the first type\
    \ has no default constructor, the C++ standard library provides a special helper\
    \ type: std::monostate. Objects of type std::monostate always have the same state.\
    \ Thus, they always compare to be equal. Their own purpose is to represent an\
    \ alternative type so that the variant has no value of any other type.\n\nThat\
    \ is, the struct std::monostate can serve as a first alternative type to make\
    \ the variant type default constructible. For example:\n\n```\nstd::variant<std::monostate,\
    \ NoDefConstr, int> v2;    // OK\nstd::cout << \"index: \" << v2.index() << '\\\
    n';          // prints 0\n```\n\nTo some extent, you can interpret the state to\
    \ signal emptiness.⁴\n\nThere are various ways to check for the monostate, which\
    \ also demonstrates some of the other operations you can call for variants:\n\n\
    ```\nif (v2.index() == 0) {\n    std::cout << \"has monostate\\n\";\n}\nif (!v2.index())\
    \ {\n    std::cout << \"has monostate\\n\";\n}\nif (std::holds_alternative<std::monostate>(v2))\
    \ {\n```\n\n³ These features might be added later, but for C++17, there was not\
    \ enough experience to support it.\n\n⁴ In principle, std::monostate can serve\
    \ as any alternative, not just the first one. However, this alternative does not\
    \ help to make the variant default constructible."
