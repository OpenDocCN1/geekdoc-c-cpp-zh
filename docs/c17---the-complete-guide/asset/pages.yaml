- pgno: 277
  md: "One application is the definition of new type traits by logically combining\
    \ existing type traits. For example, you can easily define a trait that checks\
    \ whether a type is “a pointer” (a raw pointer, a member pointer, or the null\
    \ pointer):\n\n```\ntemplate<typename T>\nstruct IsPtr\n: std::disjunction<std::is_null_pointer<T>,\n\
    \                  std::is_member_pointer<T>,\n                  std::is_pointer<T>>\n\
    {};\n```\n\nWe can now use this new trait, for example, in a compile-time if expression:\n\
    \n```\ntemplate<typename T>\nvoid foo(T x)\n{\n    if constexpr(IsPtr<T>) {\n\
    \        ...  // handle as pointer\n    }\n    else {\n        ...  // handle\
    \ as no pointer\n    }\n}\n```\n\nAs another example, we could define a type trait\
    \ that checks whether a specific type is an integral or enumeration type, but\
    \ not a bool:\n\n```\ntemplate<typename T>\nstruct IsIntegralOrEnum\n: std::conjunction<std::disjunction<std::is_integral<T>,\n\
    \                                   std::is_enum<T>>,\n                   std::negation<std::is_same<T,\
    \ bool>>>\n{};\n```\n\nHere, we roughly compute\n\n```\n(is_integral<T> || is_enum<T>)\
    \ && !is_same<T,bool>\n```\n\nOne benefit is that std::conjunction<> and std::disjunction<>\
    \ short-circuit Boolean evaluations, which means that they stop the evaluation\
    \ after the first false for conjunction or first true for disjunction. This saves\
    \ compile time but can even help to make traits valid.\n\nFor example, if incomplete\
    \ types are used as follows:\n\n```\nstruct X {\n    X(int);  // converts from\
    \ int\n};\nstruct Y;  // incomplete type\n```"
  merge: -1
  img_proc: true
- pgno: 278
  md: "the following static assertion fails because is_constructible results in undefined\
    \ behavior for incomplete types (some compilers accept this code though):\n\n\
    ```\n// undefined behavior:\nstatic_assert(std::is_constructible<X,int>{}\n  \
    \  || std::is_constructible<Y,int>{},\n    \"can't init X or Y from int\");\n\
    ```\n\nInstead, the static assertion is guaranteed not to fail using std::disjunction,\
    \ because the evaluation stops after is_constructible<X,int> yields true:\n\n\
    ```\n// OK:\nstatic_assert(std::disjunction<std::is_constructible<X, int>,\n \
    \   std::is_constructible<Y, int>>{},\n    \"can't init X or Y from int\");\n\
    ```\n\n# 21.3 Afternotes\n\nVariable templates for standard type traits were first\
    \ proposed in 2014 by Stephan T. Lavavej in http://wg21.link/n3854. They were\
    \ finally adopted as part of the Library Fundamentals TS as proposed by Alisdair\
    \ Meredith in http://wg21.link/p0006r0.\n\nThe type trait std::is_aggregate<>\
    \ was introduced as a US national body comment for the standardization of C++17\
    \ (see http://wg21.link/lwg2911).\n\nThe is_swappable trait family was first proposed\
    \ by Andrew Morrow in http://wg21.link/n3619. The finally accepted wording was\
    \ formulated by Daniel Krügler in http://wg21.link/p0185r1.\n\nstd::has_unique_object_representations<>\
    \ was first proposed under the name is_contiguous_layout by Michael Spencer in\
    \ http://wg21.link/p0258r0. The finally accepted wording was formulated by Michael\
    \ Spencer in http://wg21.link/p0258r2.\n\nThe is_invocable trait family was first\
    \ proposed by Agustin Berge in http://wg21.link/n4446. Together with std::invoke_result_t<>\
    \ the finally accepted wording was formulated by Daniel Krügler, Pablo Halpern,\
    \ and Jonathan Wakely in http://wg21.link/p0604r0.\n\nThe logical operations for\
    \ Boolean type traits were first proposed by Jonathan Wakely in http://wg21.link/p0013r0.\
    \ The finally accepted wording was formulated by Jonathan Wakely in http://wg21.link/p0013r1."
