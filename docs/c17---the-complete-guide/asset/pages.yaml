    \ from a std::variant<> as follows:\n\n```\nclass Derived : public std::variant<int,\
    \ std::string> {\n};\n```\n\n```\nDerived d = {{\"hello\"}};\nstd::cout << d.index()\
    \ << '\\n';      // prints: 1\nstd::cout << std::get<1>(d) << '\\n'; // prints:\
    \ hello\nd.emplace<0>(77);                  // initializes int, destroys string\n\
    std::cout << std::get<0>(d) << '\\n'; // prints: 77\n```\n\n# 16.3 std::variant<>\
    \ Types and Operations\n\nThis section describes the types and operations of std::variant<>\
    \ in detail.\n\n# 16.3.1 std::variant<> Types\n\nIn the header file <variant>,\
    \ the C++ standard library defines class std::variant<> as follows:\n\n```\nnamespace\
    \ std {\n    template<typename Types...> class variant;\n}\n```"
