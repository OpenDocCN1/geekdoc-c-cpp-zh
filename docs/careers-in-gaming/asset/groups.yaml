    除了软件技能外，3D 艺术家还必须具备高级的数学技巧，以及与其选择的工作领域相关的特定技能。《Animation Career Review》网站指出，视频游戏行业中的
    3D 艺术家被期望带来创造力和设计能力，但根据取决于 3D 建模师的工作地点，可能还需要其他技能。例如……科学领域的 3D 建模师可能在科学的某个特定领域具有深厚的背景。你选择的专业和研究方向将完全取决于你希望进入的领域。例如，如果你感兴趣成为游戏行业中的
    3D 建模师，可以考虑主修游戏设计专业。


    3D 艺术家通常使用许多不同类型的计算机程序，包括如 3D Studio Max 和 Maya 这样的 3D 图形程序、如 ZBrush 和 Mudbox
    这样的雕刻程序，以及如 Photoshop 这样的 2D 程序。工作的一部分还要求跟进行业趋势，并在新技术不断引入和开发的同时参与持续教育（包括职内和职外教育）。


    ## 认证与执照


    3D 艺术家可能需要游戏编程认证，这通常涉及参加四到五门课程，涵盖游戏数学、3D 图形编程、游戏引擎架构、C++ 编程、基础物理、游戏开发和计算机动画。有提供这些证书的在线课程，学生可以按照自己的节奏进行学习，尽管需要高速互联网连接。


    ## 志愿者工作与实习


    实习通常是美术专业学生的学生的要求，这些实习提供了学习职场技能以及与潜在雇主建立人关系的绝佳机会。此外，3D 艺术家将希望从事志愿者工作以帮助建立自己的作品集。例如，EA
    Games 提供了一项艺术和动画实习/合作计划，面向学习纯美术、视觉艺术、工作室艺术、计算机动画、交互式娱乐、插画或相关专业的本科生和硕士生。在同类实习期间，3D
    艺术家无疑可以通过观察和与其他 3D 艺术家一起工作来学到很多知识，并感受行业内团队合作的动态。


    除了追求实习之外，3D 艺术家还需要能够通过在线作品集展示自己的工作成果（实习是为作品集搜集素材的绝佳方式）。潜在的雇主希望看到艺术家制作的艺术作品类型，以及艺术家精通的不同风格。正如
    3D 艺术家 Sam R. Kennedy 在他的书籍《如何成为视频游戏艺术家》中提到的：


    “作品集是你最优秀艺术作品的精选，用于向潜在雇主展示你的技能、天赋和艺术愿景。艺术作品可以是画作、数字绘画、3D 模型、动画和/或其他图形。你的作品集还应该出现在网上。你作品集中的工作应该在视觉上说明你感兴趣的工作所需的技能，并应该展示你对所有所需软件程序的精通程度。”


    ## 技能与性格


    为了在视频游戏行业取得成功，3D 艺术家必须在技术上精通并在艺术上有造诣。除了艺术技能外，3D 艺术家一些重要的性格特质实际上围绕着软技能。与工作同一项目的设计师、程序员和艺术家小组协调的能力非常重要，例如积极倾听、批判性思维和沟通等技能。3D
    艺术家还必须能够监控自己并具有主动性，以确保满足所有期限。在面对工作室截止日期时，时间管理能力也至关重要。


    有抱负的艺术家需要现实的预期。游戏行业有很多优秀的3D 艺术家，年轻艺术家很容易将自己的作品与这些经验丰富的艺术家进行比较。这样做可能会让人压力巨大——甚至对年轻艺术家的成长有害。相反，2D
    培训网站 CG Cookie 的 3D 艺术家 Jonathan Williamson敦促年轻艺术家从经验丰富的艺术家那里学习一切所学，但要记住培养人才需要时间。在为
    materialise 网站的一篇文章中，Williamson 解释说要专注并避免自我怀疑。


    3D 艺术家或建模师通过创建三维模型赋予游戏角色、物体和环境生命。他们的工作大部分是数字化的，但他们有时也会进行绘画、插画或雕塑等。


    ## 职工作中


    3D 艺术家或建模师通过创建三维模型赋予游戏角色、物体和环境生命。他们的工作大部分是数字化的，但他们有时也会进行绘画、插画或雕塑等。


    ## 工作条件


    3D 艺术家没有典型的典型工作日，因为他们总是在处理不同的事情。在 2016 年 6 月对 We Ares 网站的采访中，Joe Perez 描述了典型的一天：“这很难，因为情况一直在变化。某一天我可能在处理光影，另一天我可能修复
    Bug 或创建新模型。我喜欢这种动态感；我通常 9 点上班，6 点下班。我们真的没有……”

