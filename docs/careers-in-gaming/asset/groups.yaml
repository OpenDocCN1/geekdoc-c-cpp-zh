    26,500 个工作岗位。然而，BLS 并没有专门针对视频游戏行业收集数据——而该行业是科技世界增长最快的分领域之一。


    同样，随着消费者继续寻求更新、更复杂的游戏——包括新兴虚拟现实（VR）领域的游戏——对胜练、经验丰富的程序员的需求将持续增加。正如作者 Caroline Zaayer
    Kaufman 在 2015 年 10 月于职位搜索网站 Monster 发表的文章提到的：“对具有 VR 知识的候选人的需求比去年增加了 37%……由于该技术是新的，公司很难满足这一需求。”因此，尽管低级编程工作可能继续外包，但经验丰富的首席程序员、AI
    程序员以及其他能够创建这些更复杂游戏的人将处于更容易找到工作的地位。


    ## 了解更多


    人工智能推进协会 (Association for the Advancement of Artificial Intelligence)

    www.aaai.org


    AAAI 是一个非营利科学学会，致力于推进对底层思维和智能行为机制及其在机器中体现的科学理解。该小组为对了解更多 AI 感兴趣的人举办年度会议，并在全年范围内举办各种研讨会。


    娱乐软件协会 (Entertainment Software Association)

    www.theesa.com


    这个美国协会专门为为视频游戏主机、手持设备、个人电脑和互联网发布计算机和视频游戏的公司提供业务和公共事务服务。该小组还为对进一步了解新视频游戏和产品感兴趣的人举办年度贸易展会。


    ## VR 之路


    ### 硅谷虚拟现实 (SVVR)


    www.svvr.com

    SVVR 是一个快速发展的开发者、企业家、黑客和艺术家的社区，致力于推进负担得起且易于使用的虚拟现实，并促进健康、多样化的 VR 生态系统。学生可以在当地的创客空间（maker
    spaces）和黑客松中在自己的家乡参与虚拟现实领域。


    ## 音效设计师


    ### 音效设计师做什么的？


    音效设计师创建视频游戏的音频世界。他们构建游戏过程中发生的噪音和听觉线索——就像电影和电视中的拟音师。通过与创意总、游戏设计师、制作人以及游戏开发团队的其他成员合作，音效设计师了解更多关于设定、角色和故事，为游戏创建一个沉浸式环境。根据音效设计师
    Aaron Marks 在 Designing 网站上的一篇文章：“许多游戏行业之外的人不知道，音效设计师仍然被要求能够创作合适的音效，还要成为现场录音师来捕捉特定的声音作为元素或真实的音效，成为拟音师来创建特定的物体处理声音以用于游戏或游戏电影场[用于引入新角色或其他以此打破游戏节奏的视频场景]，成为音频编辑师以根据需要编辑和处理音频元素……并根据需要进行后期制作。”


    ### 概览：音效设计师


    - 最低教育要求：高中毕业或专科学历

    - 个人特质：创造性问题解决者；有天赋；自律；压力下冷静

    - 工作环境：室内

    - 薪资范围：约 41,780 美元至 68,000 美元

    - 职位数量：截至2014 年约为117,200个

    - 未来职业前景：到2024年的增长率为7%


