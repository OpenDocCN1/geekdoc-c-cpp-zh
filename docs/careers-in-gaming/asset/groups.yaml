    ## Interview with a Game Designer


    Sandra Chen is currently a freelance writer and game designer. She is also the
    leader of the Game Design Special Interest Group for the International Game Developers
    Association and has worked in the video game industry for more than fifteen years.
    Chen runs the popular game design blog Game Design Aspect of the Month and is
    both a Writers Guild of America- and Grammy-nominated video game designer and
    writer. She discussed her career with the author via the author.


    Q: Why did you become a game designer?


    A: Game design was the perfect blend of analytical and creative. While a lot of
    people can see the creative side, there is mathematical part that really appealed
    to me.


    Q: How does math come into play when designing a game?


    A: An understanding of mathematics is needed for game design. Even if we look
    at a simple game, like a platformer, there is mathematics required for actions
    like walking or jumping. The requirement can be very complex, especially for games
    that require the use of algorithms or AI. Game balance ensures that a game is
    fun for the player. There needs to be the right level of challenge or the player
    will find the game too easy and get bored. If the game is too difficult, then
    the player will get frustrated and may quit the game. Game balance is also about
    ensuring no golden path to victory. For example, if you have many kinds of weapons,
    then the stats of the weapons need to be balanced so that they are all viable
    choices. If players find that one weapon is overpowered compared to other weapons,
    they will only use that weapon. Every aspect of a game needs to have balance,
    including character stats, combat abilities, reward tables, etc. When it comes
    to balancing the game, game designers may spend lots of time in spreadsheets and
    manipulating numbers.


    Q: Can you describe your typical workday?


    A: I work on various projects. Bulk of the time is spent on creating documents.
    Game designers are often the social glue between artists, producers, and programmers.
    They need to be in good communication with all of these interested parties and
    get their buy-in proposed ideas. One important thing about game design documents
    is getting other people to read them. Beyond team mechanics, sometimes a game
    designer is involved in the pitch to publishers or other editors. This kind of
    game documentation will have to be succinct and understandable to laypeople.


    Q: What do you like most and least about your job?


    A: What I like most is because the subject matter from game to game is varied,
    I usually end up learning new about the world. While I may not be faced with a
    zombie apocalypse any soon, I can apply the same precautions about sheltering
    in place to other plausible situations. What I like least is the public sentiment
    that I don''t have a real job or I must be playing video games all day.


