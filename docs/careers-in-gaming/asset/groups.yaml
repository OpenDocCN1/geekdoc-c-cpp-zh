    # Working Conditions


    Sound designers in the video game industry typically work in a sound studio rather
    than the company''s headquarters. This may be a production company studio. Or,
    for freelancers, it might be a home studio. Long workdays, especially as deadlines
    near completing a new game, are not uncommon. Raison Varner, an in-house senior
    designer at Gearbox Software, describes his workdays in an interview with the
    website Careers: "In a low cycle I''ll have fairly normal eight-hour days at a
    relaxed pace. In a peak cycle, I''ll have eight-hour high intensity days for a
    while and then nine to 12-hour high intensity days for a week or two preceding
    a major milestone. Depending on the milestone, I sometimes work a couple of Saturdays
    or a weekend or two in a row."


    A typical day for a sound designer in the game industry can have a lot of variety.
    Varner continues:


    In the mornings I go through emails, bug tracking notifications, attend lead meetings
    I''m a lead on the project or sometimes I need to just jump into content development.
    Issues will come and go during the day; we may get news that makes us orient the
    entire department''s priorities. Other times I''m just head down working on a
    creature, maybe [creating] a voice processing chain [a series of hardware or software
    effects to create a desired outcome] or implementing a number of sounds into a
    boss fight. Occasionally I''ll spend entire days in meetings, speaking with composers,
    developing outsourcing plans and schedules. Some of my favorite days are when
    I''m head down, working on music and everything is just coming together nicely
    and no fires popped into existence!


