    # Working Conditions


    Technical support technicians are often scheduled twenty-four hours day, seven
    days a week, in order to quickly respond to players'' questions. Therefore, aspiring
    tech support workers should have flexibility when it comes to scheduling since
    they may be asked to work early mornings, late nights, or weekends to cover all
    the shifts. As an article on customer service in the gaming industry from the
    5CA website notes, “The need for technical support & customer care in the game
    industry is evolving exponentially and gamers are known to be some of the most
    demanding customers.” Technical support specialists who work for large companies
    work in a call center. The typical call center consists of a large room or rooms
    filled with cubicles in which workers answer calls from customers. Working in
    a call center can be stressful, the lack of privacy and personal space typical
    in most cubicle setups. Tech support is often seen as the lowest rung on the ladder
    for most video game companies, and therefore workers may be crammed into what
    is often referred to as the boiler room, with no assigned seating or particular
    order to the chaos. Desks may be randomly assigned or given based on seniority.


    Additionally, technical support workers are traditionally heavily monitored by
    supervisors, with calls being recorded for quality assurance purposes. These calls
    are occasionally monitored by the head of the department, to ensure that all technicians
    are performing their jobs properly. That being said, working in a call center
    can also have its perks, as snacks and meals while on duty and occasional frees
    from the company to boost morale.


