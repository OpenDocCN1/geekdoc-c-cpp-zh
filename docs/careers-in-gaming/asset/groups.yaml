    setting up their own shops, and it seems that this trend will continue in the
    future. Joseph Humfrey, art and code director for Inkle studios, adds, in an Indie
    Game Reviewer article, “Platforms like Steam and the App Store have created a
    blossoming market, and tools like Unity have leveled the playing field for developers
    of different backgrounds and years of experience. You no longer need a vast team
    to build a technically and visually impressive game.”


    # Working Conditions


    Game developers typically work in office or studio environments, alongside fellow
    designers and programmers. Developers may have their own office or cubicle, or
    there may be an open floor plan in order to facilitate group work. Most developers
    work full-time, and there are typically many overtime hours logged as well.


    Independent game developers may also work on their days off, over lunch breaks,
    or on weekends to collaborate with teammates working in other cities around the
    world. As Emeric Thoa, creative director for the Game Bakers, describes life as
    an indie for the website Indie Game Reviewer, “It’s like being in a music band.
    You can be successful and admired like an artist and a star, or you can go from
    small gig to small gig, hoping it takes off one day. But in both cases it is very
    satisfying and tiring at the same time.”


    # Earnings


    The salary of video game developers depends on the type of company they work for
    as well as the skills and experience they have amassed on the job. According to
    O*NET Online, which groups video game developers in software designers, at one
    end of the spectrum are beginning designers, who earn about $63,970 to $73,864
    a year. At the other end are more advanced designers, who can earn between $98,260
    and $100,690 per year. According to information obtained by the job search website
    Indeed July 2016, typical video game designers make an average of $58,253 per
    year.


    # Opportunities for Advancement


    Video game developer is not an entry-level job; therefore, there is not much room
    for advancing to higher-level positions. However,'
