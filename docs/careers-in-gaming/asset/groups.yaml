    The work of 3-D artists is is never boring because they are always working on
    something different. With no two days alike, 3-D artist Mark Masters says that
    he never quite knows what to expect from the job, and that is precisely what he
    likes about it. In a Digital Tutors article, he says, "As a 3D modeler you will
    never be able to predict the types of projects thrown your way. There may be times
    when a studio is recruiting 3D modelers to only model specific items such as characters,
    but you can never predict when that may be."


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_59_0.png)


    # Education


    3-D artists typically study fine art, graphic design, or illustration in order
    to obtain a bachelor''s or associate''s degree. The top five schools for fine
    art degrees, according to the U.S. News & World Report, are Yale University; Virginia
    Commonwealth University; the University of California, Los Angeles; the School
    of the Art Institute of Chicago; and the Rhode Island School of Design. In addition
    to formal education, it is also important for aspiring 3-D artists to experiment
    with 3-D modeling software as much as possible. As Jordan Banks, a freelance 3-D
    artist for the 3-D printing website Shapeways, notes,


    College is a great start because it shows you how to focus on your skill.... What
    separated me from my peers when I got home, I continued to watch tutorial afterward
    to learn the programs. After no time at all, I started trying things on my own,
    even changing things in the book. I thought that watching the tutorials was making
    me better at modeling and using the software. What I learned it was not the fact
    that I was watching tutorials that made me great at modeling, it was the experimenting
    with the program that made me understand to better manipulate the software.'
