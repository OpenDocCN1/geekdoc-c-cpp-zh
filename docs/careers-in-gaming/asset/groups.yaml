    和 App Store 这样的平台创造了一个繁荣的市场，而 Unity 这样的工具为不同背景和经验年限开发者提供了平等的竞争环境。你不再需要一个庞大的团队来制作一个在技术和视觉上令人印象深刻的游戏。”


    ## 工作条件


    游戏开发人员通常在办公室或工作室环境中工作，与设计师和程序员并肩。开发者可能有自己的办公室或隔间，也可能是开放式平面布局，以便于小组协作。大多数开发者是全职工作，而且通常会有大量的加班记录。


    独立游戏开发者还可能在休息日、午休或周末工作，以便与在世界其他城市的队友协作。正如 Game Bakers 的创意总监 Emeric Thoa 在《Indie
    Game Reviewer》网站上描述独立开发者的生活一样：“这就像在一个乐队里。你可以像艺术家和明星一样获得成功并受推崇，也可以从小场场接一个小场场，希望有一天能大红。。但无论哪种情况，这都是非常充实且疲惫的。”


    ## 收入


    视频游戏开发人员的薪水取决于他们工作的公司类型以及他们在工作中积累的技能和经验。根据 O*NET Online（将视频游戏开发者归类为软件设计师），在光谱的一端是初级设计师，年薪约为
    $63,970 到 $73,864。另一端是更高级的设计师，他们的年收入可以在 $98,260 到 $100,690 之间。根据求职网站 Indeed 在
    2016 年 7 月获得的信息，典型的视频游戏设计师平均年薪 $58,253。


    ## 晋升机会


    视频游戏开发者并不是入门级工作；因此，晋升到高级职位的空间有限。然而，开发者可以在工作中学习额外的技能，并随着技能增加和承担更大的责任获得加薪。或者他们也可以建立自己的公司，独立制作和发布自己的游戏。虽然这种选择风险最高，因为开发者必须能够独立完成一切（或雇佣员工帮助他们无法做的事情），但它包含了获得最大回报——特别是当开发者的游戏走红或在游戏社区中引起共鸣时。


    ## 游戏开发者的未来前景如何？


    游戏开发者的前景一片光明。根据 O*NET 的预测，到 2024 年增长率将达到 14% 或更高。这被认为远高于平均水平。O*NET 还预计同一时期（到 2024
    年）将有238,000 个职位空缺，这意味着进入视频游戏行业底层并努力达到开发者水平是一个绝佳时机。消费者对新游戏有着永无止的渴望；因此，开发者将会有充足的工作要做。


    ## 了解更多信息


    游戏中心 (Game Center)

    http://gamecenter.nyu.edu


    纽约大学游戏中心网站（是其游戏设计系的一部分）提供了有关学术课程、展览、游戏设计工作坊、竞赛和会议的信息。它还提供了该大学游戏中心孵化器的信息，帮助学生为市场开发他们的游戏。


    游戏行业职业指南 (Game Industry Career Guide)

    www.gameindustrycareerguide.com


    这是一个视频游戏职业求职者的信息中心，为在行业内找工作提供了许多实用建议。该网站详细介绍了游戏行业的职业；学生还可以找到关于写简历、申请工作、建立人脉和面试的信息。


    ## Kotaku

    www.kotaku.com


    专业人士和狂热玩家在这里发布关于视频游戏的新闻和观点。这个网站是了解许多不同游戏的好地方——无需实际购买并玩所有游戏——还可以通过其一些最大的粉丝跟踪最新的行业新闻。


    ## 游戏中的价值观 (Values at Play)

    www.valuesatplay.org


    该网站旨在帮助设计师更有针对性地将多样性和人类价值观整合到游戏和基于游戏的系统中。学生可以探索游戏工具和课程、进行研究、探索资源，并观看该领域专家的视频访谈。


    ## We Are Game Devs

    www.weareamedevs.com


    该网站赞扬视频游戏行业的多样性，并对游戏开发者、设计师、艺术家、动画师、程序员等进行了深度访谈。特别强调了女性和有色人种，旨在促进和扩大行业对他们的包容性。读者也可以通过对想要采访的新开发者提出建议来帮助引导讨论。


    ## 游戏机制设计师 (Game Mechanics Designer)


    ### 游戏机制设计师做什么的？


    游戏机制设计师也称为系统设计师，负责游戏内交互的规则和系统。这项工作让游戏玩成为可能。正如 Schell Games 创始人 Jesse Schell 在他的书《游戏设计艺术：透镜书》中所解释的：“这些是你们游戏的程序和规则。机制描述了你们游戏的目标、玩家可以和不能尝试实现目标的方式，以及他们尝试时发生了什么。”


    ### 概览：# 游戏机制设计师


    | 类别 | 详情 |

    | :--- | :--- |

    | 最学历要求 | 学士或副学士学位 |

    | 个人素质 | 创意和叙故事能力；解决问题的能力；团队合作精神；良好的文字沟通能力 |

    | 工作条件 | 室内 |

    | 薪资范围 | 约 $63,970 到 $100,690 |

    | 职位数量 | 截至2014年约110万个 |

    | 未来职业前景 | 到2024年增长率达到14%或更高 |


    所有的游戏（而不仅仅是视频游戏）都是根据规则运行的。sharon Boller 在她的在线文章《学习设计系列，第3部分：游戏机制》中引用了《大富翁》的规则——“当玩家经过起点时，他们可以领取$200元”——这是一个显式规则（或机制）的例子。在视频游戏中，规则或机制被程序化到游戏中。Boller
    举了一个例子：“当玩家对问题的回答不正确时，他们会立即获得关于正确答案是什么的反馈，然后获得重新尝试的机会。”


    并不是所有的游戏机制设计师都做同样的事情。例如，那些从事战斗游戏的人被称为战斗设计师，他们的工作是为两个或多个角色战斗时发生的情况创建一个连贯的系统。游戏机制设计师还根据他们工作的类型持有不同的头衔，包括关卡设计师、成就设计师、世界构建者、任务或剧情设计师、经济设计师和谜题设计师。


    游戏机制设计师的主要任务是为玩家创造引人入的体验。有时这些体验是简单而有趣的，但有时是极其困难或令人沮丧的。无论难度如何，目标都是确保玩家想要继续玩。更有难的游戏在过关时会提供更丰的回报，这就是鼓励用户继续玩的原因。设计师使用各种心理技术和游戏设计理论来鼓励玩家向前，，即使游戏变得艰难。不同的方法帮助设计师创作精良的游戏和玩家认为值得投入时间的独特体验。这可能包括“胡萝卜加大棒子”的方法，即对正确行为给予胡萝卜或有价值物品的奖励，对错误行为给予大棒子的惩罚或其他负面体验。游戏机制可以是复杂的，也可以是简单的，取决于游戏的类型，如果做得当，两种类型都可以创造出色的色的体验。在电脑和主机上运行的视频游戏通常比手机或平板电脑上的游戏使用更复杂的机制，因为它们更依赖于计算机的处理器速度。任何给游戏中也存在几种不同类型的机制。例如，GameDesigning.org
