    对于所有致力于同一项目的艺术家来说，某些技能非常重要，例如积极倾听、批判性思维和沟通能力。Beaulieu 解释道，“首席动画师的职责是多元化的。”他/她指出，首席动画师不仅要完成动画工作，还被要求指导和支持团队的其他成员。对于
    Beaulieu 来说，作为艺术家对团队成员进行指导，与确保整个团队的动画风格保持一致同样重要。耐心、理解和乐于帮助只是工作的一部分。


    除了要有耐心和理解之外，动画师还必须具备有效的时间管理能力，这在面对截止日期进行工作时至关重要。无论是与他人小组合作还是单独工作，动画师都必须合理规划时间，以满足多个截止日期并保持项目推进。那些能够跟上截止日期的人将被认为更有价值的团队成员，并在职业生涯中进步得更快。


    动画师还必须处理工作中遇到的复杂问题。能够对这些错误承担责任，并解决技术和设计问题，将有助于项目的推进。解决问题是视频游戏行业大多数工作共同具备的关键特质，因为每款游戏都由大量复杂的碎片以及各种团队成员的许多不同贡献组成。


    ## 职场


    ## 雇主


    大多数视频游戏动画师是受雇于视频游戏公司的全职薪资工人，这些公司可能是核心玩家 easily识别的大型机构，也可能是特定移动平台发布游戏的小公司。许多人任职
    Ubisoft、天堂、EA Games 和暴雪等领先的游戏公司。


    ## 工作条件


    视频游戏动画师通常使用许多不同类型的程序，从计算机辅助设计软件、视频和图形程序，到像 Drupal、DHTML、JavaScript 和 PHP 这样的网页开发程序。动画师还经常使用特定的计算机动画程序，如
    3D Studio Max 和 Maya 来渲染他们的作品。工作的另一部分还需要关注行业趋势，并在新技术引入和开发时参与持续教育（包括职内和职外教育）。


    除了跟上行业标准外，动画师还必须与同事保持同步，以便继续和谐合作。同事们在工作中花费大量时间，有时在下班后还会聚在一起，无论是正式还是非正式的，作为企业文化的一部分。Beaulieu
    在接受 Animation Arena 采访时描述了她的工作条件：


    制作视频游戏意味着许多人必须共同努力，包括游戏设计师、程序员、关卡设计师、3D 艺术家等。在 Ubisoft 工作非常愉快，即使是一家大公司，我们也得到了很好的对待。公司经常为生日、游戏首映和其他活动组织活动。制作游戏要求非常高，且某些项目需要加班。总的来说，我告诉你们努力工作并来制作视频游戏吧；你们会玩得很心的。


    ## 收入


    视频游戏动画师的薪水取决于他们在领域获得的经验和技术熟练程度。根据 O*NET 的，光谱的一端是初级多媒体艺术家和动画师，他们的年薪约为 $63,970，并可以随着经验进入更高的薪资水平。另一端是在该领域时间更长的高级艺术家，他们的年薪约为
    $70,300。根据求职网站 Indeed 在 2016 年 7 月获得的信息，典型的视频游戏动画师平均年薪为 $82,000。首席动画师的年薪范围从 $80,000
    到 $215,000 不等，取决于资历。


    ## 晋升机会


    动画师可以获得同行的尊重、行业内的赞誉，并且在该领域工作时间越长，就越能期待加薪。通常，在视频游戏行业工作三年后，动画师被认为具有丰富经验，并可能被考虑担任动画师职位。游戏动画师也有跳跃到电影和电视动画的可能性，但动画过程可能会显著不同。


    ## 动画师的未来前景如何？


    尽管由于需要大量的专业知识和在职培训，动画工作很难获得，但该职业的就业前景是好的。到 2024 年，增长率为 5 到 8%，职位数量仍在增加，随着手机和便携式平板电脑游戏的持续扩张，高质量的动画师无疑会有需求。


    维护并扩大其技术熟练程度的动画师无疑会有需求。


    ### 概览

    - 3D 艺术家

    - 最低教育要求：学士或专科学位

    - 个人素质：批判性思维；积极倾听；良好的书面和口头沟通能力；复杂问题解决；团队合作精神

    - 证书和许可：建议

    - 工作条件：室内

    - 薪资范围：约 $63,970 至 $70,300

    - 职位数量：截至 2014 年约 64,000 个

    - 未来就业前景：到 2024 年增长率为 5 到 8%


    ## 3D 艺术家


    ## 3D 艺术家做什么？


    3D 艺术家也被称为 3D 建模师，他们创建角色、物体和环境。尽管他们的工作主要是数字化的，但他们也使用纸张、水彩或粘土等传统媒介进行绘画、上色或雕刻。根据
    Creativeset 的说法，3D 艺术家的工作是“构建生命、风景、植被、家具和车辆。他们需要平衡功能性和细节。”


    3D 艺术家的工作从不无聊，因为他们总是在处理不同的事情。由于每天都不一样，3D 艺术家 Mark Masters 表示，他从不知道工作中能期待什么，而这正是他喜欢这份工作的原因。在
    Digital Tutors 的一中，他表示：“作为一个 3D 建模师，你无法预测推给你的项目类型。有时会有工作室招募 3D 建模师仅建模特定的角色，但你无法预测何时会发生。”


    ## 教育


    3D 艺术家通常学习美术、平面设计或插画，以获得学士或专科学位。除了正式教育外，对于有志的 3D 艺术家来说，尽可能地尝试 3D 建模软件也同样重要。 3D
    打印网站 Shapeways 的自由职业 3D 艺术家 Jordan Banks 指出：


    “大学是一个很好的开始，因为它教你如何专注于自己的技能……我与同龄人的区别在于，当我回到家后，我继续看教程来学习程序。没多久，我就开始自己尝试东西，甚至改变书中的内容。我曾以为看教程让我在建模和使用软件方面变得更优秀。后来我发现，并不是看教程让我建模很棒，而是对程序的实验让我理解了如何更好地操作软件。”

