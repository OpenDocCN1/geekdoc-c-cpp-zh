    Giampa 也建议尽可能参与独立游戏的制作，以努力进入大型游戏公司。


    ## 工作条件


    视频游戏行业的音效设计师通常在音效工作室工作，而不是公司总部。这可能是一家制作公司的工作室。对于自由职业者来说，这可能是一个家庭工作室。长时间的工作时间并不少见，特别是在接近新游戏完成的截止日期时。Gearbox
    Software 的内部高级设计师 Raison Varner 在接受 Careers 网站的采访时描述了他的工作日：“在低谷期，我会有节奏较慢的、相对正常的八小时工作。在高峰期，我会有一段时间每天工作八小时的高强度日，然后在重大里程碑到来前的一到两周内进行九到12小时的高强度工作。根据里程碑的情况，我有时需要工作几个周六，或者连续工作两个周末。”


    游戏行业音效设计师的典型一天可以非常多样化。Varner 继续说道：


    早晨，我处理电子邮件、错误跟踪通知，参加我担任负责的项目会议，有时我只需要投入到内容开发中。问题在一天中会接来又去；我们可能会收到一些让我们重新调整整个部门优先事项的新闻。其他时候，我只是埋头处理某个生物，可能是在[创建]一个声音处理链[一系列用于产生预期效果的硬件或软件效果]，或者将许多声音实现到
    Boss 战斗中。偶尔，我会花整整一天的时间开会，与作曲家交流，制定外包计划和进度表。我最喜欢的日子就是当我埋头处理音乐，一切都进展得非常顺利，而且没有出现任何突发故障状况！


    ## 收入


    视频游戏音效设计师的薪水取决于他们在领域获得的经验程度和技术熟练程度。根据劳工统计局的数据，光谱的一端是初级助理音效设计师，他们的年收入约为 41,780
    美元。另一端是经验丰富的音效设计师，他们的年收入约为 63,340 美元（尽管招聘网站 Indeed 显示，2016年7月音效设计师的平均年薪为 68,000
    美元）。


    ## 职业发展机会


    当音效设计师开始在该领域工作时，他们通常会从实习生或初级音效设计师做起，随着职业生涯的进步，逐步成为成熟的音效设计师。在行业内工作几年后，他们可以成为高级音效设计师或音频总监。此外，自由职业音效设计师可能加入公司成为内部设计师。音效设计师的其他机会包括横向转型为作曲家、录音工程师或制作人。


