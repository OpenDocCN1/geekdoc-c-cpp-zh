    # 动画师


    ## 动画师做什么做什么？


    视频游戏动画师通过描绘虚拟世界中的屏幕动作和行为来帮助游戏生动。他们的工作是确保角色、物体和场景——本质上是出现在屏幕上的任何东西——在游戏语境及其运行平台上恰当地移动。


    Creative Skillset 指出，动画师必须根据游戏的技术和平台限制，找到创建既有功能又具效益的动画的最佳方法。由于许多动作在游戏过程中会重复，动画师会为每个角色建立动作库，这有助于在无缝移动与优化游戏在不同平台的性能之间取得平衡。其中一些动作必须通过代码或手动关键帧，而另一些则可以在动画软件的帮助下更快地制作和复制。


    ## 动画师概览


    - **最低教育要求**：学士学位或副科学学位

    - **个人素质**：批判性思维；积极倾听；良好的书面和口头沟通能力；复杂问题解决；团队合作

    - **认证与许可**：建议性

    - **工作环境**：室内

    - **薪资范围**：约 $63,970 至 $215,000

    - **职位数量**：截至 2014 年约 64,000 个

    - **未来职业展望**：到 2024 年增长率为 5% 到 8%


    动画师经常与程序员和艺术家合作，以确保他们的工作根据游戏出现的平台得到平稳呈现。视频游戏动画师帮助让屏幕上的虚拟世界生动起来。动画师的工作是确保角色、物体、场景和所有动作在游戏语境及其运行平台（移动设备、计算机、游戏机等）中恰当得移动。Creative
    Skillset 描述了视频游戏动画师的工作：“游戏制作是协作性的，动画师作为艺术部门团队的一部分工作。利用 3D 艺术家创建的物体、模型，以及最重要的角色，动画师定义了它们的动作和行为，并使用所选的
    3D 动画软件包提供的工具和技术来应用它们。


    对单个角色进行骨骼绑定（Rigging）和蒙皮（skinning），这是一个类似于构建骨架的过程是动画师的主要任务之一，涉及计算机建模程序的使用。根据游戏的类型，动画师可能处理二维或三维（2-D
    或 3-D）图像，每种图像都需要不同类型的计算机操作来实现所需的效果。通过调整游戏世界中的颜色、光影甚至透明度，可以实现逼真的效果。”


    ## 如何成为动画师？


    ### 教育


    视频游戏动画师通常学习计算机动画以获得学士或副科学学位。根据 Game Designing.org 的介绍，游戏设计排名前五学校是南加州大学、卡内基·梅隆大学、犹他州大学、DigiPen
    科技学院和罗彻斯特理工学院。然而，重要的是，视频游戏的动画需要电影或电视动画不同的技能组合，因此学生应该考虑具有行业针对性的课程。根据 O*NET 的数据，62%
    的视频游戏动画师拥有学士学位，19% 拥有副科学学位，17% 上过大学课程但没有学位。


    ### 认证与许可


    动画师可能需要游戏编程认证，这通常涉及游戏数学、3D 图形编程、游戏引擎架构、C++ 编程、基础物理、游戏开发和计算机动画。有在线课程提供这些证书，因此学生可以按照自己的节奏学习，但需要高速互联网连接。


    ### 志愿者工作与实习


    实习通常是动画专业学生的要求。实习提供了学习在职技能以及拓展潜在雇主人脉的绝佳机会。EA Games 为目前就读美术、视觉艺术、工作室艺术、计算机动画、交互娱乐、插画或相关领域的本科或硕士生提供年度艺术和动画实习计划。暴雪娱乐（Blizzard
    Entertainment）也为大三学生以及有天赋的大一和大二学生提供动画暑期。


    此外，新动画师可能想要从事志愿者工作以帮助积累经验。虽然一些动画师可能对免费提供工作望而却步，但这种进的困境在于，公司不想给未受过训练的动画师机会，而精通所需的许多技能是在工作中获得的。因此，志愿者工作提供了一个获取领域经验的直接途径，同时建立可以通向付费工作的作品集。


