    # The Ever-Expanding Video Game Industry


    The video game industry is growing faster than ever before. More and more Americans
    are packing computing power in their pockets with powerful cell phones and tablets.
    Some even access the Internet as frequently to play games as they do their e-mail.
    As a result of all this online activity, the gaming industry is growing exponentially.
    As staff Dylan Lewis states on the financial topics website Motley Fool, “The
    worldwide mobile gaming market is a high $20 billion market. I have seen projections
    that that will hit $45 billion by 2018.” And as the demand for games continues
    to grow, this means jobs for game developers, designers, animators, programmers,
    and many more in the gaming industry will expand too.


    No longer solely the domain of teenagers playing on their bedroom or their family''s
    basement, modern video games have expanded their reach. The 2016 Essential Facts
    About the Computer and Video Game Industry reports that “the average video game
    player is 35 years old and has been playing video games for about 13 years.” Video
    games attract older players too. According to a June 2016 Entertainment Software
    Association study, “Three-quarters of gamers 50-plus play weekly, with four in
    10 playing daily. Among gamers 60 and above, 43 percent play video games every
    day.


    The recently released Pokémon Go is even getting gamers out of the house and interacting
    with the world around them (the tune of 9.55 million users, daily, according to
    a July 13, 2016, article on the Website Recode). Offering a blend of virtual and
    actual reality dubbed augmented reality, the game requires users to physically
    walk to various landmarks in their city in order to advance game play, making
    exercise a core ingredient not just for participation but for success within the
    game. The gamification of our culture continues unabated, as the geeks of yesterday
    continue to become the leaders of today.'
