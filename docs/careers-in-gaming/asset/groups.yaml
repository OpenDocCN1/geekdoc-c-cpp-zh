    ## 如何成为技术支持专家？


    ## 教育背景


    技术支持专家并不一定需要计算机科学、游戏设计或信息科学学位才能成功，但这些类型的学位无疑有助于对视频游戏和计算机系统的通用理解。它们在潜在雇主眼中也显得**很有**。根据
    O*NET 的分类（该机构将技术支持专家归类为计算机网络专家或计算机用户支持专家），约 47% 的计算机网络支持专家拥有学学位，22% 的拥有专科学位，14%
    的上过一些大学课程但没有学位。相比之下，约 29% 的计算机用户支持专家拥有学学位，22% 的人上过大学但没有学位，18% 的拥有专科学位。


    ## 认证与许可


    根据公司的不同，可能需要相关认证。通常要求获得计算机技术行业协会（CompTIA）的 A+ 认证，该认证证明了其在技术和客户服务技能方面的基础。其他可能需要的认证类型还包括
    Apple、微软、Cisco 和 Linux 提供的针对这些计算机操作系统的特定计划。


    ## 技能与性格


    技术支持专家依靠他们的客服技能来与愤怒、沮丧的玩家进行互动。因此，他们最重要的两个特质是耐心和理解。配合良好的倾听技巧，他们需要能够迅速理解用户通过电话或即时消息描述的问题。同样，他们必须提出良好的后续问题，以帮助消除任何困惑。冷静的态度至关重要，特别是在激烈的互动期间。


    解决问题的能力是技术支持的另一个关键特质。简单和更困难的问题每天都会出现。对于常规问题，技术人员通常依靠脚本回复。对于不常见且更困难的问题，专家需要开放心态来构解决方案。


    沟通技能同样重要。技术支持专家必须以清晰、简洁的方式向消费者口头传解决方案。良好的书面沟通技能对于编写报告给质量保证团队以及通过电子邮件或在线聊天消息回复玩家至关重要。Get
    In Media 网站指出，作为负责排除故障并安抚客户的问题解决者，该职位的人应当对游戏系统有深入了解。此外，该职位要求具备出色的冲突解决能力、组织能力和专注。


    ## 工作


    ## 雇主


    大多数技术支持专家是轮班制的，在暴雪、EA、任天堂和 Ubisoft 等大型游戏公司现场工作。他们也可能由猎头公司外包，或作为临时季节性员工在忙季提供帮助。2016
    年 8 月，职位招聘网站 Indeed 上的一份虚拟游戏支持代表广告表明，对于具备正确技能和技术设备的申请者来说，许多技术支持工作实际上是居家办公。描述建议了以下要求：


    良好的互联网连接：上传速度 5 Mbps，下载速度 7 Mbps——越快越好（无线或互联网服务提供商不兼容）。


