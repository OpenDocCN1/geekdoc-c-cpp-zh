    ## 程序员


    ## 程序员是做什么的？


    视频游戏程序员在后台从事艰苦的工作：他们创建了所有让游戏顺利运行的代码。《游戏职业指南》（Game Career Guide）网站这样描述视频游戏行业的程序员职业：


    | 程序员简介 |

    | :--- | :--- |

    | 最教育要求 | 学士或副学士 |

    | 个人特质 | 批判性思维、解决问题的能力以及良好的书面和口头沟通能力；团队合作精神 |

    | 认证 | 需要 |

    | 工作条件 | 室内 |

    | 薪资范围 | 约 $77,550 至 $102,000 |

    | 职位数量 | 截至2014年约 328,600 个 |

    | 未来职业前景 | 随着工作流向海外，增长率正在下降 |


    在最基础的层，程序员编写让视频游戏中发生事情的代码。这包括将玩家从控制面板的输入连接或“映射”到屏幕上正在发生的动作。它还包括所有非玩家角色 [NPC] 的动作或移动；例如，当你看到
    NPC 在视频游戏的地形上游荡时，是程序员赋予了这些角色人工智能，让它们能够在那里某处漫游。


    程序员通常专攻几个领域中的一个。


    人工智能 (AI) 程序员决定游戏中的角色如何对人类玩家在计算机上执行的不同动作做出反应。一些示例包括策略（决策算法，计算执行某项动作与另一个动作相比的优缺点）、路径规划（规划游戏中两点之间的最短路线）以及敌人战术（游戏中的反派可以采取的各种动作类型，以提高或巩固其在游戏中的地位）。需要使用不同的代码脚本来编写这些内容，AI
    程序员通常精通数种不同的计算机语言。


    物理程序员制定管理游戏世界的规则，包括重力等效果以及角色与物体交互的方式。这些程序员还控制特效，包括爆炸、火和激光束。角色的身体也受物理定律的影响，因此程序员将负责创建身体撞击地面或遭受其他撞击的效果，这通常被称为软骨骼物理学（soft
    ragdoll physics）。


    图形程序员专注于使用颜色、阴影、光、暗影和纹理，为玩家提供关于他们在每个场景中应该做的视觉线索。他们努力让二维艺术具有三维感，并还帮助压缩数据，以便在玩游戏时没有延迟。


    用户界面程序员编写运行游戏引擎的代码。换句话说，这种编程负责玩家如何导航游戏。导航通常使用某种菜单系统来控制从选择关卡或角色服装到增大或减小音量的一切操作。


    ## 如何成为程序员？


    ## 教育


    无论他们的专长是什么，对于想要成为程序员的人来说，理想的专业领域都是计算机科学。正如《游戏职业指南》网站在《游戏编程：导论》文章中所提到的：“程序员是数学和科学人才，更具体地说，是代数、微积分和计算机科学人才。通常，程序员拥有计算机科学学位（或对该领域有深知识）。”大多数学院和大学都提供计算机科学学位课程。根据《美国新闻与世界报道》（U.S.
    News & World Report），计算机科学排名前四的学校是卡内基·梅隆大学、麻省理工学院、斯坦福大学和加州大学伯克利分校，尽管全美各地的大学还有许多其他类似的课程。这些四年制课程向学生介绍游戏设计的的核心概念，包括编程、故事和角色开发、视觉和声音设计以及游戏引擎开发的课程。获得计算机科学学位让想要成为程序员的人接触有关各种操作系统、编程概念、输入/输出方法和算法的信息。


    根据 O*NET 的数据，约 78% 的通用计算机程序员拥有学士学位，11% 拥有中专证书，6% 仅有高中毕业或同等学历。AI 专家通常拥有计算机科学或认知科学的硕士或博士学位。


    ## 认证


    对各种编程语言的认证是必须的；如今的程序员通常被要求精通 C++、OpenGL、PhysX、Perl、Perforce、Python 和 XML。正如《游戏职业指南》在《游戏编程：导论》中提到的：“在程序员在游戏行业找到工作之前，他们需要对编程语言有坚实且实用的掌握，通常是
    C++，尽管许多人也需要知道汇编、C 或 Java。C++ 是目前游戏行业中最常用的语言。”


    ## 获得经验


    即使对于刚开始做游戏程序员的人来说，经验也非常重要。幸运的是，有很多获得经验的方法，尽管大多数方法都需要个人的主动性。正如育碧蒙特利尔首席游戏玩法和 AI
    程序员 Alessia Laidacker 在 2016 年 4 月接受 We Are Game Devs 网站采访时提到的，被视频游戏开发者和寻求招聘的公司关注的最佳方法之一是编写自己的游戏并参加游戏开发者聚会：


    - 制作你自己的游戏。使用 Unity3D [一个游戏开发程序] 对任何人来说都非常容易，而游戏大松（Game Jams）是花费 48 小时产出一个游戏原型的极佳方式。我倾向于选择拥有个人项目、游戏大松经验、黑客松等的申请者，而不是只有成绩优秀的人。对进入游戏行业的热情以及展示出的这一点很重要。


    ## 技能与性格


    程序员最重要的性格特质之一是灵活性。由于他们需要使用不同的编程语言编写代码或脚本，并与艺术家和设计师合作，这正如育碧蒙特利尔首席游戏玩法和 AI 程序员 Alessia
    Laidacker 在 2016 年 4 月接受 We Are Game Devs 网站采访时提到的，被视频游戏开发者和寻求招聘的公司关注的最佳方法之一是编写自己的游戏并参加游戏开发者聚会：……对进入游戏行业的热情以及展示出的这一点很重要，这是我最看重的点。”


    良好的书面和口头沟通能力也是必要的，还需要批判性思维能力。《游戏职业指南》建议程序员必须能够寻找他们问题的答案和面对问题的解决方案。从这个意义上说，程序员必须是强大的独立学习者。然而，程序员知道如何与他人有效沟通至关重要，因为他们的工作需要每天分享知识。


    编程是任何视频游戏公司中最技术性的工作之一，但它也是一项高度创造性的活动。许多程序员将他们多种计算机语言的能力视为艺术形式。正如自称为“极客”的自由职业程序员
    Gil Fewster 在 freeCodeCamp 网站的一篇文章解释道：“不写代码的人很少相信这一点，尽管有所有的技术规则和结构纪律，编程是一项高度创造性的活动。
    . . 没有两个程序员会产生相同的代码，即使最终软件从外面看起来一样。给十个程序员一个功能规范，每个人都会产生独特的东西，那是他们作为程序员的自己的表达。”


    ## 上岗


    ## 雇主


    大多数视频游戏程序员是全职薪薪员工，受雇于视频游戏公司，这些公司可能是资深玩家熟悉的大公司，可能是为特定移动平台发布游戏的小公司。许多程序员在育碧、任天堂、EA
    Games 和暴雪娱乐等领先游戏公司工作。根据《游戏职业指南》对创始人 Peter Lee 的采访，雇主最感兴趣的是那些能够把事情完成的申请者，无论是一个计算机科学学位还是他们开始开发的游戏。“我看到太多应毕业生缺乏创建一个完整应用程序的能力，无论它有多小，”Lee
    说道。


    ## 工作条件


    程序员的工作日可能会很长，特别是当他们设计新游戏时。有时他们会花整天时间与其他团队成员一起修复漏洞。即使在游戏完成后，团队通常也会很快转向下一个项目。在 2016
