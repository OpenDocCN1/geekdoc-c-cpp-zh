    # ## How Do You Become a Sound Designer?


    # # Education


    Sound designers do not typically require any specific degrees in order to get
    their foot in the door. For those who do choose to study sound, high school courses
    in math, physics, and electronics will help pave the way; a degree or certificate
    in audio engineering or recording arts will also build skills. According to O*NET,
    about 31 percent of sound engineering technicians have a high school diploma or
    equivalent, 25 percent have a postsecondary certificate, and 22 percent have an
    associate’s degree. More important than coursework, sound designers should have
    a strong command of audio editing software like Logic or Pro Tools as well as
    familiarity with recording and mixing hardware, which can be learned through free
    online courses or during internships. A sound designer should understand the constraints
    of current-generation game platforms, as well as the capabilities of multiple
    game engines. Knowledge of audio editing software like Pro Tools is required,
    as is proficiency with recording and mixing consoles.


    # # Volunteer Work and Internships


    Volunteer work or internships at a recording studio would be an ideal fit for
    anyone considering sound design as a career. Learning to record, mix, and manipulate
    sounds in the booth will give aspiring sound designers all of the educational
    training they need. Access to expensive equipment is also a huge plus since it
    can be hard to obtain familiarity with the devices professionals are using outside
    of a studio setting.


    Any experience in the field is good experience—even if it is unpaid. Would-sound
    designers should be able to demonstrate their abilities with a show reel or portfolio
    of sounds they have designed. In an article on the Gamasutra website, sound designer
    Mark Kilborn advises aspiring sound designers to keep videos or sound clips short:'
- md: '

    "90-180 seconds. Put your best stuff first.... Assume you have about 10 seconds
    to hook them." Kilborn also suggests including "a cue sheet of some sort.


    ## Skills and Personality


    The most successful sound designers blend creativity and technical know-how. Inventing
    every unique audio worlds requires a special kind of ability to listen to real-life
    sounds and manipulate them in order to represent fictional characters and interactions.
    This means that sound designers must be both musically inclined and able to think
    outside the box when it comes to blending and distorting sounds for clever solutions
    to audio problems. "Not only must the designer have the ability to create balanced,
    quality sound, he or she should also have the creative talent to imagine an entirely
    new aural world, like the unique sound of a light saber or a dinosaur tail," says
    Get In Media.


    At some stages in the game development process, sound designers work on their
    own in a studio setting; at other stages, they interact with team members. They
    must be both self-directed and able to work well with other people. For instance,
    a sound designer will work with other team members to make sure all sounds match
    the game''s visual elements.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_38_0.png)


    ## Employers


    Hiring managers and producers for leading game companies like Ubisoft, Nintendo,
    EA Games, and Blizzard Entertainment are in charge of hiring sound designers.
    In a Gamasutra article aimed at applicants for sound design jobs, Kilborn notes
    that aspiring designers should always be working on something they can put in
    their portfolios—particularly something interactive. His advice to designers is,
    simply, "Always be making noise." Sound designer and blogger Kris Giampa also
    recommends working on as many indie games as possible in an effort to break into
    the big game companies.


    ## Working Conditions


    Sound designers in the video game industry typically work in a sound studio rather
    than the company''s headquarters. This may be a production company studio. Or,
    for freelancers, it might be a home studio. Long workdays, especially as deadlines
    near completing a new game, are not uncommon. Raison Varner, an in-house senior
    designer at Gearbox Software, describes his workdays in an interview with the
    website Careers: "In a low cycle I''ll have fairly normal eight-hour days at a
    relaxed pace. In a peak cycle, I''ll have eight-hour high intensity days for a
    while and then nine to 12-hour high intensity days for a week or two preceding
    a major milestone. Depending on the milestone, I sometimes work a couple of Saturdays
    or a weekend or two in a row."


    A typical day for a sound designer in the game industry can have a lot of variety.
    Varner continues:


    In the mornings I go through emails, bug tracking notifications, attend lead meetings
    I''m a lead on the project or sometimes I need to just jump into content development.
    Issues will come and go during the day; we may get news that makes us orient the
    entire department''s priorities. Other times I''m just head down working on a
    creature, maybe [creating] a voice processing chain [a series of hardware or software
    effects to create a desired outcome] or implementing a number of sounds into a
    boss fight. Occasionally I''ll spend entire days in meetings, speaking with composers,
    developing outsourcing plans and schedules. Some of my favorite days are when
    I''m head down, working on music and everything is just coming together nicely
    and no fires popped into existence!


    ## Earnings


    The salary of video game sound designers depends on the amount of experience and
    technical proficiency they have obtained in the field. According to the Bureau
    of Labor Statistics, at one end of the spectrum are entry-level junior sound designers,
    who earn about $41,780 year. At the other end are more experienced sound designers
    who earn about $63,340 per year (although the job search website Indeed showed
    the average annual salary for a sound designer in July 2016 was $68,000 per year).


    ## Opportunities for Advancement


    As sound designers begin to work in the field, they will often apprentice as interns
    or junior sound designers, working their way up the career ladder to becoming
    fully-fledged sound designers as they progress. After several years in the industry,
    they can move on to become senior sound designers or audio directors. Additionally,
    freelance sound designers may be able to join a company as an in-house designer.
    Other opportunities for sound designers include lateral moves toward becoming
    composers, recording engineers, or producers.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_40_0.png)


    Sound designer jobs in the video game industry can be difficult to get. It is
    a very competitive area of the industry. As sound designer Will Morton warns in
    a 2015 interview on the Game Career Guide website,


    > Before applying for a job in game audio, make sure you REALLY REALLY REALLY
    want to do it. There are far more people trying to get these jobs available, so
    you''re in a flooded market. Be sure this is what really motivates you to get
    out of bed in the morning. If you just think it “might be cool” or that it’s “better
    than a normal job,” then do something else.


    With a projected 7 percent growth rate through 2024, however, the number of jobs
    is still increasing, and quality sound designers with a wide range of skills and
    experience will always be in demand.


    Sound designers who maintain and expand their technical proficiency will become
    more in demand as digital music creation continues to evolve and the accompanying
    technology also changes. Staying up-to-date with both formal and informal methods
    of continuing education, including online courses and self-directed study, will
    help sound designers maintain that cutting edge.


