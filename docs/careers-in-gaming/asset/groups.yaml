    and story lines—along with the rest of the game’s design team. In addition, 3-D
    artists help model or build 3-D characters based on concept artwork, creating
    environmental surfaces and character skins, and rig skeletons that animators can
    map and control. According to Creative Skillset, the job of a 3-D artist is to
    “build the characters, objects and environments of the game, including life forms,
    scenery, vegetation, furniture, and vehicles, etc. They need to balance visual
    richness and detail with the limitations of the game’s technology.” Similar to
