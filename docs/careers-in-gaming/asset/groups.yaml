    in the game industry, consider majoring in game design.


    3-D artists typically work with many different types of computer programs, including
    3-D graphics programs such as 3D Studio Max and Maya, sculpting programs like
    ZBrush and Mudbox, and 2-D programs like Photoshop. Part of the job also requires
    keeping up with industry trends and participation in ongoing education (both on
    and off the job) as new technology is introduced and developed.


    ## Certification and Licensing


    3-D artists may require game programming certification, which typically involves
    taking four or five classes in game mathematics, 3-D graphics programming, game
    engine architecture, C++ programming, basic physics, game development, and computer
    animation. There are online courses that offer these certificates, so students
    can study at their own pace, although a high-speed Internet connection is required.


    ## Volunteer Work and Internships


    Internships are often a requirement for students majoring in fine art programs,
    and these offer a great opportunity to learn on-the-job skills as well as network
    with potential employers. In addition, 3-D artists will want to take on volunteer
    work in order to help build up their portfolios. EA Games, for example, offers
    an art and animation internship/co-op program available to both undergraduate
    and master''s students studying fine art, visual art, studio art, computer animation,
    interactive entertainment, illustration, or a related field. 3-D artists can certainly
    learn a great deal from observing and working with fellow 3-D artists during this
    kind of internship as well as get a feel for the dynamics of group work within
    the industry.


    In addition to pursuing internships, 3-D artists will need to be able to show
    their work through an online portfolio (Internships are a great way to get material
    for a portfolio.) Potential employers want to see the kinds of artwork that an
    artist has produced as well as the different styles in which the artist is proficient.
    As 3-D artist Sam R. Kennedy notes in his book How to Become a Video Game Artist,


    A portfolio is a selection of examples of your best artwork to show a potential
    employer your skills, talents, and artistic vision. The artwork can be drawings,
    digital paintings, 3D models, animation, and/or other graphics. Your portfolio
    should also be available on the web. The work in your portfolio should visually
    illustrate the skills needed for the job you''re interested in and should also
    show your proficiency in all software programs required.


    ## Skills and Personality


    3-D artists must be technically proficient and artistically skilled in order to
    succeed in the video game industry. Aside from artistic skills, some of the most
    important personality traits for 3-D artists actually revolve around soft skills.
    The ability to coordinate with a group of designers, programmers, and artists
    who are all working on the same project is important, as skills like active listening,
    critical thinking, and communication. 3-D artists must also be able to monitor
    themselves and be self-starters to ensure that all deadlines are met. Time-management
    skills can also be critical when working on studio deadlines.


