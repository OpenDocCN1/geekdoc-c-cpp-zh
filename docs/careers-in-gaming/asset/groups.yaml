    # Game Mechanics Designer


    # What Does a Game Mechanics Designer Do?


    Game mechanics designers, also known as systems designers, create the rules and
    systems for interacting within a game. This work is what makes game play possible.
    As Jesse Schell, founder of Schell Games, explains in his book The Art of Game
    Design: A Book of Lenses: "These are the procedures and rules of your game. Mechanics
    describe the goal of your game, how players can and cannot try to achieve it,
    and what happens when they try."


    # At a Glance:


    # Game Mechanics Designer


    Minimum Educational Requirements

    Bachelor''s or associate''s degree


    Personal Qualities

    Creativity and storytelling skills; problem-solving ability; team player; strong
    written communication skills


    Working Conditions

    Indoors


    Salary Range

    About $63,970 to $100,690


    Number of Jobs

    As of 2014 about 1.1 million


    Future Job Outlook

    Growth rate of 14 percent or higher through 2024


    All games, not just video games, operate with rules. Sharon Boller, in her online
    article "Learning Game Design Series, Part 3: Game Mechanics," cites the Monopoly
    rule—"When players pass Go, they collect $200"—an example of an explicit rule
    (or mechanic) that players follow. In a video game, a rule or mechanic is programmed
    into the game. Boller gives an example:"When players respond incorrectly to a
    question they get immediate feedback on on what a correct response should be,
    followed by an opportunity to re-try answering the question."'
  - '[PAGE 20]


    Not all game mechanics designers do the same thing. For instance, those who work
    on fighting games are called combat designers, and their job is to create a coherent
    system for what occurs when two or more characters fight. Game mechanics designers
    may also hold titles based on the type of work they do, including level designers,
    achievement designers, world builders, mission or quest designers, economy designers,
    and puzzle designers.


    he main task of a game mechanics designer is to create engaging experiences for
    players. Sometimes these experiences are simple and fun, but other times are incredibly
    difficult or frustrating. Regardless of difficulty, the goal is to make sure a
    player will want to continue playing the game. More difficult games usually offer
    more significant rewards for beating a level, which is what encourages users to
    continue playing. Designers use a variety of psychological techniques and game
    design theories to encourage players to push forward, even when the game gets
    tough. Different approaches help designers create well-crafted games and unique
    experiences that players deem worthy of their time. This might include the carrot-and-stick
    approach, in which players are either rewarded for correct actions with a carrot,
    or valuable item, or punished for incorrect actions by beating with a stick, or
    other negative experience. As game design expert Amy Jo Kim explains in an interview
    with the website Bokardo,“Game mechanics are a collection of tools and systems
    that an interactive designer can use to make an experience more fun and compelling...
    These core mechanics are a good place to start: collecting, points, feedback,
    exchange, and customization."


    ame mechanics can be complex or simple, depending on the type of game, and both
    types can create great play experiences if properly done. Video games played on
    computers and consoles typically use more complex mechanics than games played
    on a cell phone or tablet, as they are more dependent on a computer''s processing
    speed. There are also several different types of mechanics at play in any given
    game. For example, the “Beginner''s Guide to Game Mechanics” at GameDesigning.org
    explains, Tetris (a game that can be played on multiple platforms) involves four
    different types of game mechanics:'
- md: '

    - 1. Rotation system: Where the tetrominoes [puzzle pieces] spawn, in what position
    they spawn, how they rotate, and their wall kick (their position when you try
    to rotate on the edge).

    - 2. Randomizers: The order/sequence in which the tetromino types spawn.

    - 3. Scoring Systems: The points you get for line clears, including back-to-back
    lines, combos, T-spins, etc.

    - 4. Mobility: The player''s ability to manipulate the tetrominoes, including
    rotating, dropping, etc.


    The guide goes on to suggest that "if you''re an aspiring game designer, one of
    the best exercises you can do is take any game and to break it down into main
    game mechanics." This exercise helps would-be-designers understand exactly what
    any game tick and how they can begin to assemble complex or simple games of their
    own.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_21_0.png)


    # Education


    An ideal field of study for would-be game mechanics designers is computer science
    or video game design. Most colleges and universities of computer science degree
    programs. The top four schools for computer science, according to the U.S. News
    & World Report, are Carnegie Mellon University, the Massachusetts Institute of
    Technology, Stanford University, and the University of California, Berkeley, although
    there are other similar programs in universities throughout the United States.
    These four-year programs introduce students to the core concepts of game design,
    including classes in programming, story and character development, visual and
    sound design, and game engine development. Earning a degree in computer science
    exposes would-be-designers to information about various operating systems, programming
    concepts, input/output methods, and algorithms.


    Video game design programs are still few in number, but the best-known ones are
    at the Art Institute, the University of Southern California, Carnegie Mellon University,
    the University of Utah, and Rochester Institute of Technology. The University
    of Utah’s program boasts a strong relationship with EA Sports, headquartered in
    Salt Lake City. The Rochester Institute of Technology offers more than 150 classes
    a year, along with several different types of game design and development degrees.
    Additional fields of study useful for game mechanics are formal logic and mathematics;
    these fields will help aspiring designers understand and improve their programming
    skills. A strong grasp of physics is also important when designing a game’s mechanics
    and environment. According to O*NET, about 62 percent of game designers have a
    bachelor’s degree, 19 percent have an associate’s degree, and 17 percent have
    attended some college but possess no degree.


    # Internships


    Would-be game mechanics designers should definitely apply for internships with
    video game companies that match their skills and ambitions. Not only will an internship
    provide valuable experience, but it can also be a foot in the door of the ultracomcompetitive
    gaming industry. Most, if not all, of these opportunities are paid internships,
    and even including housing stipends or arrangements and cover participants’ travel
    expenses. Blizzard Entertainment offers college students to join their twelve-week
    summer internships, which take place at one of the company’s three US locations
    (Austin, Texas; Irvine, California; or San Francisco, California). PlayStation
    also offers twelve-week summer internships, which are open to both undergraduate
    and graduate students.


    # Skills and Personality


    Game mechanics designers are computer programmers with strong coding skills as
    well as problem solvers. Being able to think through difficult questions and come
    up with innovative solutions is key to a game mechanics designer’s success. They
    must remain flexible in their thinking, offering solutions to problems that arise
    in order to keep the project moving forward. Being able to keep calm to work through
    these challenges is essential. Work hours can often be long, which may cause frayed
    nerves, so patience with fellow team members—especially when on deadlines—is very
    important.


    The most successful mechanics designers are able to work well as part of a team.
    Game design requires many different moving parts and specialized abilities, so
    being able to express ideas clearly is important. Mechanics designers must work
    with fellow designers, coders, artists, animators, developers, and more to create
    a game, so being able to understand where each member of the team is coming from
    as game designer Jake Fleming explained during a 2014 Treehouse website interview,


    When the [team feels] good about any particular idea, we start developing a prototype
    with basic colored shapes to show to friends, family, and even strangers. We can
    get a sense for just how fun our core game mechanic can be without fancy art and
    music clouding the user''s judgment. Showing the game to everyone who will listen
    and quickly iterating based on feedback is how we know when we want to take an
    idea to the next level.


    # On the Job


    # Employers


    Game mechanics designers may work for top studios, such as Ubisoft, Nintendo,
    Sony, EA Games, or Blizzard. These designers are responsible for the majority
    of the video games available for consoles and mobile devices. In addition, there
    are also many freelance designers who are self-employed but contract out their
    work to different studios.


    # Working Conditions


    Game mechanics designers typically work in office or studio environments, alongside
    fellow designers and programmers. Designers may have their own office or cubicle,
    or there may be an open floor plan in order to facilitate group work. Most designers
    work full-time, and there are typically many overtime hours logged as well.


    Working conditions can vary drastically according to a designer''s wants and needs.
    In a July 2015 interview on Medium.com, independent artist and game designer Kara
    Stone talked about her workplace and its effect on her work: “I mostly work at
    home surrounded by plants, burning incense, spending a lot of time away from my
    computer lying on the ground thinking. Not feeling forced to sit in front of a
    screen and having my hippie surroundings makes the process and the outcome a little
    more serene, personal, thoughtful.” In short, most designers want and require
    their own particular time and space to figure out the mechanics and assorted issues
    related to the games they are working on. Fortunately, most successful video game
    companies allow them that time and space.


    # Earnings


    The salary of game mechanics designers depends on the type of company they work
    for and the skills and experience they have amassed on the job. According to O*NET
    and the Bureau of Labor Statistics, at one end of the spectrum are beginning designers,
    who earn about $63,970 to $73,864 a year. At the other end are more advanced designers,
    who can earn between $98,260 and $100,690 per year. According to information obtained
    by the job search website Indeed in July 2016, typical game designers make an
    average of $87,000 per year.


    # Opportunities for Advancement


    Game mechanics designer is not an entry-level job, and therefore there is not
    much room for advancing to higher-level positions. However, mechanic designers
    can learn additional skills on the job and can receive pay bumps as they add skills
    and take on greater responsibilities. Or they can start their own companies, independently
    producing and publishing their games. Although this option carries the most risk
    since designers must be able to do everything (or hire staff to help with), it
    also holds the opportunity for the greatest reward—particularly if a designer''s
    games go viral or strike a chord within the game community.


    ## What Is the Future Outlook for Game Designers?


    Game mechanics designers have a very bright future. According to O*NET, there
    is a predicted growth rate of 14 percent through 2024, which is designated as
    much faster than average. There are 238,000 projected job openings for the same
    period, which means it is a great time to get in on the ground floor of the video
    game industry and work your way up to the level of designer. Consumers continue
    to have an insatiable thirst for new games; therefore, designers will always have
    plenty of jobs for the taking.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_25_0.png)


    # Develop Online

    www.develop-online.net


    This European-based website details the latest business, coding, art, sound, and
    game design trends, and covers creative and commercial leaders in the field. The
    site is intended for use by creatives currently working in the gaming industry,
    and it does not shy away from technical subjects or industry issues.


    # Game Sauce

    www.gamesauce.biz


    Use this website to follow game development news from around the world, including
    exclusive interviews, studio spotlights, video coverage, and more.


    # Gamestar Mechanic

    www.gamestarmechanic.com


    This website is devoted to helping people learn to design video games using game-based
    quests and courses. Although the site is aimed at kids aged seven to fourteen,
    it is also open to anyone who wants to learn more about game design.


    # Indie Games

    www.indiegames.com


    A resource for indie game designers and developers, this site explores games produced
    and developed by independent designers. Read reviews of new games and reports
    on the state of the indie gaming industry, and keep up with the work of fellow
    designers.

