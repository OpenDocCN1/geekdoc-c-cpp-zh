    | Salary Range | About $63,970 to $100,690 |

    | Number of Jobs | As of 2014 about 1.1 million |

    | Future Job Outlook | Growth rate of 14 percent or higher through 2024 |


    All games, not just video games, operate with rules. Sharon Boller, in her online
    article "Learning Design Series, Part 3: Game Mechanics," cites the Monopoly rule—"When
    players pass Go, they collect $200"—an example of an explicit rule (or mechanic).
    In a video game, a rule or mechanic is programmed into the game. Boller gives
    an example: "When players respond incorrectly to a question they get immediate
    feedback on what a correct response should be, followed by an opportunity to re-try."


    Not all game mechanics designers do the same thing. For instance, those who work
    on fighting games are called combat designers, and their job is to create a coherent
    system for what occurs when two or more characters fight. Game mechanics designers
    may also hold titles based on the type of work they do, including level designers,
    achievement designers, world builders, mission or quest designers, economy designers,
    and puzzle designers.


    The main task of a game mechanics designer is to create engaging experiences for
    players. Sometimes these experiences are simple and fun, but other times incredibly
    difficult or frustrating. Regardless of difficulty, the goal is to make sure a
    player will want to continue playing. More difficult games offer more significant
    rewards for beating a level, which is what encourages users to continue playing.
    Designers use a variety of psychological techniques and game design theories to
    encourage players to push forward, even when the game gets tough. Different approaches
    help designers create well-crafted games and unique experiences that players deem
    worthy of their time. This might include the carrot-and-stick approach, in which
    players are either rewarded for correct actions with a carrot, or valuable item,
    or punished for incorrect actions by beating with a stick, or other negative experience.
    Game mechanics can be complex or simple, depending on the type of game, and both
    types can create great play experiences if properly done. Video games played on
