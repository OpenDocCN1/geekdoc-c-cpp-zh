    # Q: How do you come up with new game ideas?


    A: Game ideas come from anywhere. I mentioned Shigeru Miyamoto previously. Nintendogs
    was inspired when Miyamoto''s family got a new puppy. Pokémon creator Satoshi
    Tajiri loved collecting bugs. But all game ideas need to be developed further
    into a paper prototype or demo so that they can be play tested. Sometimes, the
    prototype ends up not being fun, so the designer has to try something different
    with the idea.


    # Q: What advice do you have for students who might be interested in this career?


    A: Play all kinds of games, bad and good. Read books. Know about a lot of things.'
