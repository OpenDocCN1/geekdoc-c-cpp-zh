    # 不断扩张的视频游戏行业


    视频游戏行业的增长速度比以往任何时候都快。越来越多的美国人通过强大的手机和平板电脑将计算能力带在口袋里。有些人访问互联网玩游戏的频率甚至和收发邮件一样频繁。由于所有这些在线活动，游戏行业正以指数级增长。正如员工
    Dylan Lewis 在财经话题网站 Motley Fool 上所述：“全球移动游戏市场是一个价值200亿美元的高端市场。我看到过预测，到2018年该市场将达到450亿美元。”随着对游戏需求的持续增长，这意味着游戏行业中开发人员、设计师、动画师、程序员以及许多其他人的职位也将随之扩大。


    现代视频游戏不再仅仅是青少年在卧室或家庭地下室玩游戏的领地，它们的触角已经扩大。2016年《计算机和视频游戏行业基本事实》报告指出，“视频游戏玩家平均年龄为35岁，玩视频游戏已有13年。”视频游戏也吸引了年长的玩家。根据2016年6月娱乐软件协会的一项研究，“50岁以上的玩家中，四之三每周玩游戏，十分之四每天玩。在60岁及以上的玩家中，有43%的人每天玩视频游戏。”


    最近发布的《Pokémon Go》让玩家走出家门与周围的世界互动（根据2016年7月13日Recode网站上的一篇文章，每天有950万用户）。这种结合了虚拟与现实世界的游戏被称为“增强现实”，它要求用户物理上走到城市中的各个地标以推进游戏，这使得运动不仅是参与的核心要素，也是在游戏中成功的要素。我们文化的游戏化正在不断加剧，昨天的极客正成为今天的领导者。


    # 变化对工作者有利


    尽管游戏行业自创立以来一直由男性主导，但情况正在发生变化。女性开始加入游戏行业专业人士的行列，未来可能成为该行业的重要力量。在2016年5月接受CBS新闻采访时，来自费城的摩尔艺术与设计学院的游戏艺术教授
    Stephen Wood评论道：“在未来10年，将出现女性进入该行业的巨大热潮。在80年代和90年代，视频游戏被认为是男孩玩的东西。但在90年代和21世纪初，女孩们说：‘我们也要玩。’现在，女孩们正在上大学学习视频游戏。我们正在帮助缩小性别差距并成为解决方案的一部分。”


    尽管如此——也许是因为 Gamergate 事件（2014年发生的丑闻，像Zoë Quinn和Brianna Wu这样的女性游戏开发者遭到了特定的网络骚扰），年轻女性渴望加入视频游戏行业，教育系统也渴望满足它们的兴趣。随着越来越多的女性加入程序员和开发者的行列，行业正变得更加包容，设计领域的女性开始与它们的男性同胞获得同样的成功。


    尽管劳工统计局没有专门追踪视频游戏行业的工作，但显然，科技世界的这个角落正在蓬勃发展。全球约有26亿玩家在惊人的平台上玩游戏，视频游戏行业正爆发式增长。这对于求职者是一个好消息。


    # 主要学习领域


    视频游戏行业对……感兴趣的学生来说是一个很好的选择……（等等，文本继续）


    # 游戏中的职业


    | 职位名称 | 职责 |

    |---|---|

    | 动画师 | 游戏动画师负责游戏中动作的刻画 |

    | 副制片 | 副制片与游戏制作合作以确保按时交付 |

    | 音效工程师 | 音效工程师为游戏创建配乐，包括音乐、音效 |

    | 创意总监 | 创意总监负责游戏的整体视觉和感受 |

    | 开发与运维(DevOps)工程师 | DevOps工程师负责为游戏创建在线基础设施 |

    | 外部制片 | 外部制片在外部工作时确保游戏的成功交付 |

    | 游戏设计师/开发人员 | 游戏设计师设计游戏的内容和玩法，定义 |

