    | 首席游戏艺术家 | 首席艺术家负责游戏的整体视觉 |

    | 游戏艺术家 | 游戏艺术家创建游戏的视觉元素，如角色、场景、物体 |

    | 卡卡编辑器 | 卡卡编辑器为游戏片段定义并创建交互架构 |


    游戏行业中，大多数人最终是在项目上进行协作，而不是孤立工作。


    美术艺术家可以寻找动画师、角色艺术家或建模、概念、环境、纹理或灯光艺术家的工作。程序员可能会发现自己涉及引擎、游戏玩法、物理、用户界面或人工智能。对音乐感兴趣的人可以在行业中寻找音频程序员或工程师、作曲家、配音演员，甚至是拟音（音效）艺术家的工作。视频游戏行业成功所需的正确结合。

