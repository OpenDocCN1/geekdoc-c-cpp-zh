    after receiving customer complaints about the service they received from overseas
    call centers. Additionally, since part of the job requires a familiarity with
    the company''s games, there is an advantage to keeping this job in-house. The
    Bureau of Labor Statistics, which considers technical support specialists to be
    computer support specialists, predicts that this field will grow 12 percent through
    2024—which is faster than average for all occupations—and employment of support
    specialists in computer systems design is expected to grow by 31 percent.'
  - '[PAGE 49]


    # Find Out More


    Tech Republic

    www.techrepublic.com


    This site offers blogs, community forums, vendor reports, software downloads,
    webcasts, and research for information technology professionals. This site is
    full of technical information that will appeal to anyone interested in cybersecurity,
    computer networks, and the ever-expanding world of high-tech gizmos and gadgets.


    Tech Support Guy

    www.techguy.org


    Tech Support Guy hosts free forums for online computer help. This is a perfect
    place to start for anyone interested in finding—or solving—computer problems.


    Tom''s Hardware

    www.tomshardware.com


    This site is a good place to find out more about the computer hardware and peripherals
    most people use every day. It features how-to articles, reviews of assorted computer
    hardware, and opinion pieces on technology.


    Tom''s IT Pro

    www.tomsitpro.com


    This site includes buying guides, product reviews, news analysis, how-to articles,
    and case studies around vital technology in business. It is a great source for
    information about information technology businesses and services.'
  - '[PAGE 50]


    # Animator


    # What Does an Animator Do?


    Video game animators help bring games to life by portraying on-screen movement
    and behaviors in a fictional world. Their job is to make sure characters, objects,
    and scenery—essentially anything that appears on-screen—move appropriately within
    the context of the game and the platforms on which it is played.


    Creative Skillset notes, animators must find the best ways to create both functional
    and cost-effective animations, with respect to the game''s technological and platform
    limitations. Since many motions will be repeated throughout game play, animators
    build libraries of movements for each character, which help to create balance
    between seamless movement and optimizing the game''s performance on different
    platforms. Some of these will have to be coded or keyed by hand, whereas others
    may be more quickly produced and reproduced with the help of animation software.


    # At a Glance:


    # Animator


    +   Minimum Educational Requirements

    Bachelor''s or associate''s degree


    +   Personal Qualities

    Critical thinking; active listening; strong written and oral communication skills;
    complex problem solving; team player


    +   Certification and Licensing

    Suggested


    +   Working Conditions

    Indoors


    +   Salary Range

    About $63,970 to $215,000


    +   Number of Jobs

    As of 2014 about 64,000


    +   Future Job Outlook

    Growth rate of 5 to 8 percent through 2024


    Animators frequently work with programmers and artists to make sure their work
    is presented smoothly, depending on the platform on which the game'
  - '[PAGE 51]


    A video game animator helps bring an an on-screen fictional world to life. The
    animator’s job is to make sure that characters, objects, scenery, and all action
    move appropriately within the context of the game and the platforms on which it
    is played.


    appears (mobile, computer, console, etc.). Creative Skillset describes a video
    game animator’s job: “Game production is collaborative and Animators work as part
    of the art department team. Using the objects, models, and most importantly, characters
    created by 3D Artists, Animators define their movements and behaviors and apply
    them using the animation tools and techniques provided by the selected 3D animation
    software package.


    Rigging and skinning individual characters, a process similar to building a skeleton,
    is one of the animator’s main tasks and involves the use of computer modeling
    programs. Depending on the type of game, animators may be working with two- or
    three-dimensional (2-D or 3-D) images, each of which requires different types
    of computer manipulations to give the desired effects. Lifelike effects are achieved
    by tinkering with colors, light and shadow, and even'
  - '[PAGE 52]


    transparency within the game''s world. Hilda Karugabira


    # ## How Do You Become an Animator?


    # # Education


    Video game animators typically study computer animation in order to obtain a bachelor''s
    or associate''s degree. According to Game Designing.org, the top five schools
    for game design are the University of Southern California, Carnegie Mellon University,
    the University of Utah, the DigiPen Institute of Technology, and the Rochester
    Institute of Technology. It is important to note, however, that the animation
    of video games requires a different skill set than animation for film or television,
    and therefore students ought to consider a program with industry-specific training.
    According to O*NET, 62 percent of video game animators have a bachelor''s degree,
    19 percent have an associate''s degree, and 17 percent have had some college courses
    but no degree.


    # # Certification and Licensing


    Animators may require game programming certification, which typically involves
    taking four or five classes in game mathematics, 3-D graphics programming, game
    engine architecture, C++ programming, basic physics, game development, and computer
    animation. There are online courses that offer these certificates, so students
    can study at their own pace, although a high-speed Internet connection is required.


    # # Volunteer Work and Internships


    Internships are often a requirement for students majoring in animation programs.
    These offer a great opportunity to learn on-the-job skills as well as network
    with potential employers. EA Games offers an annual art and animation internship/co-op
    program for students'
  - '[PAGE 53]


    currently enrolled in bachelor''s or master''s programs for fine art, visual art,
    studio art, computer animation, interactive entertainment, illustration, or related
    fields. Blizzard Entertainment also offers summer internships in animation for
    juniors in college as well as talented freshmen and sophomores.


    In addition, new animators may want to take on volunteer work in order to help
    build experience. Although some animators may balk at the idea of giving their
    work away for free, the catch-22 is that companies do not want to take a chance
    on an untrained animator and yet many of the skills required for becoming proficient
    are obtained on the job. Therefore, volunteer work provides a straightforward
    way to obtain experience in the field while simultaneously building a portfolio
    that can become a bridge to paid work.


    An online portfolio, or show reel, is a sampling of one''s work—and it is something
    that prospective employers want to see. Reels are samples from an animator''s
    creative work, detailing their specific contributions, and typically run two to
    three minutes long. Potential employers watch reels to see how well animators
    can portray their characters'' personalities through both simple and complex movements,
    and also look for different genres and styles illustrated. As Ubisoft''s lead
    animator, Patrick Beauieu, explains in an interview with Animation Arena.


    > Concerning a portfolio, they like to see original animations [that] avoid all
    clichés or movement[s] that are often used or seen everywhere. Put only your best
    stuff in a demo. It''s better to have three good animators than fifteen bad ones.
    A good selection of clips[:] A bit of variety is always interesting[.] For example[:]
    cartoon, realistic, acting lip sync. . . When I interview potential candidates,
    these are some of the things I look for and I''m always surprised.


    # Skills and Personality


    Some of the most important personality traits for video game animators actually
    revolve around soft skills rather than technical expertise. The ability to coordinate
    with a group of designers, programmers,'
- md: '

    and artists who are all working on the same project is important, as skills like
    active listening, critical thinking, and communication. Beaulieu explains that
    “the duties of a Lead Animator are diversified.” He notes that not only are lead
    animators expected to do their animation work, but they are also required to advise
    and support other members of the team. Mentoring team members as artists is as
    important to Beaulieu as making sure the animation is being done in a consistent
    style across the team. Being patient, understanding, and helpful is just part
    of the job.


    In addition to being patient and understanding, animators must also have effective
    time-management skills, which are critical when working on a deadline. Whether
    working with others in a group or working solo, animators must budget their time
    accordingly in order to meet multiple deadlines and keep projects moving forward.
    Those who can stay on top of these deadlines will be considered more valuable
    team members and will advance more quickly in their careers.


    Animators must also deal with complex problems in their own work. Being able to
    take responsibility for these errors, as well as solve technical and design problems,
    will help move the project forward. Problem solving is a key trait that most jobs
    in the video game industry share, as each game is made up of a huge number of
    complex bits and pieces and many different contributions made by various team
    members.


    ## On the Job


    ## Employers


    Most video game animators are full-time, salaried workers employed by video game
    companies, which can be large organizations that are easily recognized by avid
    gamers or smaller companies that release games for specific mobile platforms.
    Many work for leading gaming companies like Ubisoft, Nintendo, EA Games, and Blizzard.


    ## Working Conditions


    Video game animators typically work with many different types of computer programs,
    ranging from computer-aided design software, video and graphics programs, to web
    development programs like Drupal, DHTML, JavaScript, and PHP. Animators also frequently
    use specific types of computer animation programs like 3D Studio Max and Maya
    to render their creations. Part of the job also requires keeping up with industry
    trends and participation in ongoing education (both on and off the job) as new
    technology is introduced and developed.


    In addition to keeping up with industry standards, animators must keep up with
    their fellow coworkers in order to continue working together harmoniously. Coworkers
    spend spending a lot of time on the job and sometimes even hang out with each
    other after work, whether formally or informally, as part of the corporate culture.
    Beauieu describes her working conditions in an interview with Animation Arena:


    Making a video game implies that a lot of people must work together, the game
    designer, programmers, level designers, 3D artists, etc. Working at Ubisoft is
    very pleasant and we are well treated even if it''s a big company. There are always
    hours organized for birthdays, game premieres and other activities. Working on
    a game is very demanding [and] certain projects require overtime. In general I''m
    telling you to work hard and come work on a video game; you''ll have a ball.


    ## Earnings


    The salary of video game animators depends on the amount of experience and technical
    proficiency they have obtained in the field. According to O*NET, at one end of
    the spectrum are entry-level multimedia artists and animators, who earn about
    $63,970 per year and can advance to a higher pay scale with experience. At the
    other end are more advanced artists who have been in the field longer, who earn
    about $70,300 per year. According to information obtained by the job search website
    Indeed in July 2016, typical video game animators make an average of $82,000 per
    year. Lead animators can earn anywhere from $80,000 to $215,000 a year, depending
    on seniority.


    ## Opportunities for Advancement


    Animators can earn the respect of their peers, acclaim within the industry, and
    expect a salary raise the longer they work in the field. Typically, animators
    are considered experienced after working three years in the video gaming industry
    and may be considered for lead animator positions. There is also some possibility
    for game animators to make a leap to film and television animation, but the animation
    processes can differ significantly.


    ## What Is the Future Outlook for Animators?


    Although animation jobs can be difficult to obtain due to the significant amount
    of technical expertise and on-the-job training required, the job outlook for this
    profession is good. With a growth rate of 5 to 8 percent through 2024, the number
    of jobs is still increasing, and as pocket gaming on cell phones and portable
    tablets continues to expand, quality animators will certainly be in demand.


    Animators who maintain and expand their technical proficiency will certainly be
    in demand.


    ### At a Glance

    - 3D Artist

    - Minimum Educational Requirements: Bachelor’s or associate''s degree

    - Personal Qualities: Critical thinking; active listening; strong written and
    oral communication; complex problem solving; team player

    - Certification and Licensing: Suggested

    - Working Conditions: Indoors

    - Salary Range: About $63,970 to $70,300

    - Number of Jobs: As of 2014 about 64,000

    - Future Job Outlook: Growth rate of 5 to 8 percent through 2024


    ## 3D Artist


    ## What Does a 3D Artist Do?


    3D artists, also known as 3D modelers, create characters, objects and environments.
    Although their work is predominantly digital, they also draw, paint, or sculpt
    using traditional media like paper, watercolors, or clay. According to Creativeset,
    the job of 3D artists is to “build life, scenery, vegetation, furniture, and vehicles.
    They need to balance functionality and detail.”


    The work of 3D artists is never boring because they are always working on something
    different. With no two days alike, 3D artist Mark Masters says that he never quite
    knows what to expect from the job, and that is precisely what he likes about it.
    In a Digital Tutors article, he says, "As a 3D modeler you will never able to
    predict the types of projects thrown your way. There may be times when a studio
    is recruiting 3D modelers to only model specific items as characters, but you
    can never predict when that may be.”


    ## Education


    3D artists typically study fine art, graphic design, or illustration in order
    to obtain a bachelor''s or associate''s degree. In addition to formal education,
    it is also important for aspiring 3D artists to experiment with 3D modeling software
    as much as possible. As Jordan Banks, a freelance 3-D artist for the 3-D printing
    website Shapeways, notes,


    “College is a great start because it shows you how to focus on your skill....
    What separated me from my peers when I got home, I continued to watch tutorial
    afterward to learn the programs. After no time at all, I started trying things
    on my own, even changing things in the book. I thought that watching the tutorials
    was making me better at modeling and using the software. What I learned it was
    not the fact that I was watching tutorials that made me great at modeling, it
    was the experimenting with the program that made me understand to better manipulate
    the software.”

