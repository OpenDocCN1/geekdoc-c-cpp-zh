  mdcn: '

    信息技术招聘公司提供的长期派遣工作。视频游戏测试员为视频游戏公司工作，这些公司可能是被狂热玩家轻易识别的大型机构，也可能是为特定移动平台发布游戏的小型公司。许多人任于
    Ubisoft、任天堂（Nintendo）、EA Games 和暴雪娱乐等领先的游戏公司。


    ## 工作条件


    质量保证测试员通常在办公环境中独立工作。首席测试员将监督一个质量保证团队，该团队规模可能从小公司的几名测试员到大公司的数百名测试员不等。有些测试员可以居家办公，每周可能远程办公几天。大多数测试员为全职工作。由于游戏开发通常由截止日期驱动，测试员长时间加班的情况并不罕见。此外，在冲刺阶段（crunch
    time），测试员可能需要加班和/或上夜，以确保在游戏交付消费者之前，游戏层面的所有漏洞都已定位并修复。


    尽管如此，在制作游戏的公司工作确实有一些好处。正如游戏测试员 Danny McGee 在 Newsvine 网站的一篇文章中提到的，在 EA Games 工作包括福利：


    - 休息室提供免费的麦片和牛奶，此外还有便宜得离谱的自动贩卖机（备有充足的山山露）和免费的街机游戏；一家摆满了 EA 旗下所有发行商和开发者的视频游戏的商店，折扣超过
    50%；而且偶尔——为了保险起见——还有计薪时间内的啤酒派对，配有免费的披萨、鸡翅和视频游戏比赛。


    ## 收入


    质量保证测试员的薪水取决于他们居住的地方、工作的对象、测试的类型类型，以及他们拥有多少经验。根据一个来源，游戏测试员通常每小时赚约 10 到 18 美元，按小时计薪而非固定月薪。但另一个来源，求职网站
    Indeed 指出，2016 年 6 月，典型的视频游戏测试员平均年薪 45,000 美元。


    ## 晋升机会


    即使视频游戏测试员获得了更多经验，在测试领域内的晋升机会也很少。有些人可能会获得首席测试员等更高级别的职位，但攀爬公司阶梯的额外机会非常有限。那些希望在同一公司内转型管理、设计或编程工作的人，通常需要接受更多教育才能进入这些角色。对于有管理抱负的人来说，研究生级别的管理课程是理想的选择，而对于寻求设计或编程工作的人来说，软件设计或计算机编程学位会更理想。具有高级测试技能的游戏测试员也可以成为软件质量保证工程师，他们是能够编写脚本测试复杂、专业软件的软件开发人员。无论测试员决定追求哪个方向，这种变动将是横平移动而非直接的职业晋升。


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_71_0.png)


    与其他类型的软件测试不同，视频游戏测试员将始终需要手动玩游戏以寻找漏洞。由于测试员必须既模仿普通玩家，又要积极寻找破坏游戏的方法以提高性能，因此没有真实的方法可以实现这些职位。此外，玩游戏时必须考虑几个不同的目标，这对机器来说——即使是带有人工智能的——也是非常费劲的。尽管如此，这些工作的竞争可能会非常激烈，因为总有许多新成员渴望通过玩视频游戏谋生。


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_72_0.png)


    ## 3D World


    www.creativebloq.com/3d-world-magazine


    3D World 是一本面向游戏开发艺术家（以及特效和电视制作人员）的杂志，特色是对知名公司游戏开发人员的采访，以及如何进入该行业的技巧。


    ## Gamasutra


    www.gamasutra.com


    Gamasutra 是一家成立于 1997 年的网站，致力于“制作游戏的艺术与商业”，涵盖了游戏开发各个方面的方面的文章。


    ## 游戏职业指南


    www.gamecareerguide.com


    Game Career Guide 是与 Gamasutra 附属的网站。它专门为寻求游戏行业职业的人提供建议。


    ## GameDev.net


    www.gamedev.net


    这是一个面向所有水平游戏开发者的在线社区，包括专业人士、爱好者和学生。


    ## GamesIndustry.biz


    www.gamesindustry.biz


    该网站涵盖全球游戏行业的突破新闻。它是 Gamer Network 的一部分。


    ## 国际游戏开发者协会 (IGDA)


    www.igda.org


    IGDA 是一个全球协作项目和社区网络，由来自游戏开发所有领域的个人组成。成员可能希望使用该网站与游戏行业的同事建立联系，并通过建立人脉来推动职业发展。


    ## 游戏设计师的采访


    Sandra Chen 目前是一位自由职业作家和游戏设计师。她还是国际游戏开发者协会游戏设计特殊小组的组长，并在视频游戏行业工作了十五年以上。Chen 经营流行的游戏设计博客
    Game Design Aspect of the Month，并是一位获得美国作家协会奖和格莱美奖提名的视频游戏设计师兼作家。她通过作者讨论了她的职业生涯。


    Q：你为什么成为一名游戏设计师？


    答：游戏设计是分析与创意的完美结合。虽然很多人能看到创意的一面，但有一部分数学内容真正吸引了我。


    Q：数学在设计游戏时是如何发挥作用的？


    答：游戏设计需要理解数学。即使我们看一个简单的游戏，比如平台跳跃，行走或跳跃等动作也需要数学。这些要求可能非常复杂，特别是对于需要使用算法或人工智能的游戏。游戏平衡确保游戏对玩家来说是有有趣的。需要合适的挑战水平，否则玩家会觉得游戏太简单而感到无聊。如果游戏太难，玩家会感到沮丧并可能放弃。游戏平衡还意味着确保没有胜利的“黄金路径”。例如，如果你有多种武器，那么武器的属性需要平衡，以便它们都是可行的选择。如果玩家发现某一种武器与其他武器相比过于强大，他们将只会使用那种武器。游戏的每个方面都需要平衡，包括角色属性、战斗能力、奖励表等。在平衡游戏时，游戏设计师可能花费大量时间在电子表格中操纵数字。


    Q：你能描述一下你典型的一天工作吗？


    答：我处理各种项目。大部分时间花在创建文档上。游戏设计师通常是艺术家、制片人和程序员之间的社交胶水。他们需要与所有这些利益方保持良好沟通，并获得他们对建议的认可。游戏设计文档的一个重要点是让其他人阅读它们。除了团队机制之外，有时游戏设计师还要参与向发行商或其他编辑的推介。这种游戏文档必须简洁明了并让外行也能理解。


    Q：你对工作最喜欢和最讨厌什么？


    答：我最喜欢的是因为每个游戏的主题都不同，我通常能学到很多新知识。虽然我可能不会面临僵尸爆发，但我可以将同样的避难所保护措施应用到其他可能的情况中。我最讨厌的是公众认为我没有正经工作或者我整天都在玩视频游戏。


    Q：你认为哪些个人特质对这类工作最有价值？


    答：一个人应该对系统如何运作、一件事如何影响另一件事以及日常生活的关联性保持自然的好奇心。


    '
