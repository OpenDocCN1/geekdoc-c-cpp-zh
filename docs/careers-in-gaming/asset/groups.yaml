    # Contents\n\n- Introduction: The Ever-Expanding Video Game Industry 4\n- Game\
    \ Developer 8\n- Game Mechanics Designer 16\n- Programmer 24\n- Sound Designer\
    \ 32\n- Technical Support Specialist 39\n- Animator 47\n- 3-D Artist 55\n- Quality\
    \ Assurance Tester 63\n- Interview with a Game Designer 70\n- Other Jobs in Gaming\
    \ 73\n- Index 74\n- Picture Credits 79\n- About the Author 80\n\n# The Ever-Expanding\
    \ Video Game Industry\n\nThe video game industry is growing faster than ever before.\
    \ More and more Americans are packing computing power in their pockets with powerful\
    \ cell phones and tablets. Some even access the Internet as frequently to play\
    \ games as they do their e-mail. As a result of all this online activity, the\
    \ gaming industry is growing exponentially. As staff Dylan Lewis states on the\
    \ financial topics website Motley Fool, “The worldwide mobile gaming market is\
    \ a high $20 billion market. I have seen projections that that will hit $45 billion\
    \ by 2018.” And as the demand for games continues to grow, this means jobs for\
    \ game developers, designers, animators, programmers, and many more in the gaming\
    \ industry will expand too.\n\nNo longer solely the domain of teenagers playing\
    \ on their bedroom or their family's basement, modern video games have expanded\
    \ their reach. The 2016 Essential Facts About the Computer and Video Game Industry\
    \ reports that “the average video game player is 35 years old and has been playing\
    \ video games for about 13 years.” Video games attract older players too. According\
    \ to a June 2016 Entertainment Software Association study, “Three-quarters of\
    \ gamers 50-plus play weekly, with four in 10 playing daily. Among gamers 60 and\
    \ above, 43 percent play video games every day.\n\nThe recently released Pokémon\
    \ Go is even getting gamers out of the house and interacting with the world around\
    \ them (the tune of 9.55 million users, daily, according to a July 13, 2016, article\
    \ on the Website Recode). Offering a blend of virtual and actual reality dubbed\
    \ augmented reality, the game requires users to physically walk to various landmarks\
    \ in their city in order to advance game play, making exercise a core ingredient\
    \ not just for participation but for success within the game. The gamification\
    \ of our culture continues unabated, as the geeks of yesterday continue to become\
    \ the leaders of today.\n\n# Changes Bode Well for Workers\n\nThough the gaming\
    \ industry has been male dominated since its inception, things are changing. Women\
    \ have begun joining the ranks of game industry professionals and are likely to\
    \ be a big part of the industry in the future. In a May 2016 interview with CBS\
    \ News, Stephen Wood, a Moore College of Art & Design gaming arts professor from\
    \ Philadelphia, commented,\n\n“There’s going to be a huge boom of women entering\
    \ the industry in the next 10 years. In the '80s and '90s, video games were seen\
    \ as things boys do. But in the '90s and early 2000s, girls said, ‘We’re going\
    \ to play, too.’ Now girls are going to college and studying video games. We’re\
    \ helping close gender gap and being part of the solution.”\n\nDespite—or perhaps\
    \ because of Gamergate (a 2014 scandal in which female game developers like Zoë\
    \ Quinn and Brianna Wu were specifically targeted for harassment online), young\
    \ women are eager to join the video game industry, and the educational system\
    \ is eager to accommodate their interests. As more women join the ranks of programmers\
    \ and developers, the industry continues to become more welcoming, and women in\
    \ design careers are beginning to enjoy the same success as their male counterparts.\n\
    \nThough the Bureau of Labor Statistics does not track jobs in the video game\
    \ industry specifically, it is clear that this particular corner of the tech world\
    \ is booming. With approximately 2.6 billion gamers worldwide, playing on an astounding\
    \ array of platforms, the video game industry is simply exploding. This bode well\
    \ for job seekers.\n\n# The Major Areas of Study\n\nThe video game industry is\
    \ a great choice for students interested in... (Wait, text continues)\n\n# Careers\
    \ in Gaming\n\n| Job Title | Role |\n|---|---|\n| Animator | Game animators are\
    \ responsible for the portrayal of movement within game |\n| Assistant Producer\
    \ | Assistant producers work with game production to ensure timely delivery of\
    \ |\n| Audio Engineer | Audio engineers create sound track for game, including\
    \ music, sound effects |\n| Creative Director | Creative directors are responsible\
    \ for the overall look and feel of game |\n| Development and Operations (DevOps)\
    \ Engineer | DevOps engineers are responsible for creating online infrastructure\
    \ for game |\n| External Producer | External producers ensure successful delivery\
    \ of game while working externally |\n| Game Designer/Developer | Game designers\
    \ devise what game consists of and how it plays, defining |\n| Lead Programmer\
    \ | Lead programmers manage computer code that runs and controls game |\n| Lead\
    \ Game Artist | Lead artists are responsible for overall look of game |\n| Game\
    \ Artist | Game artists create visual elements of game, such as characters, scenery,\
    \ objects |\n| Level Editor | Level editors define and create interactive architecture\
    \ for segment of game |\n\ngame industry, and most end up collaborating on projects\
    \ rather than working in isolation.\n\nFine artists may find work as animators;\
    \ character artists or model; concept, environment, texture, or lighting artists.\
    \ Programmers may find themselves involved with engine, game play, physics, user\
    \ interface, or artificial intelligence. The musically inclined find jobs in the\
    \ industry as audio programmers or engineers, composers, voice-over artists, or\
    \ even Foley (sound effects) artists. just the right blend required for success\
    \ in the video game industry.\n[/content] (Note: The OCR text provided was fragmented\
