    final software appears from the outside to be the same.

    ... Give ten programmers a functional specification and each one will produce
    something unique, an expression of their own voice as a programmer.


    # On the Job


    # Employers


    Most video game programmers are full-time, salaried workers employed by video
    game companies, which can be large organizations that are easily recognized by
    avid gamers or smaller ones that release games made for specific mobile platforms.
    Many programmers work for leading gaming companies like Ubisoft, Nintendo, EA
    Games, and Blizzard Entertainment. According to a Game Career Guide interview
    with Gamel founder Peter Lee, employers are most interested in hiring applicants
    who are able to see things through to completion, whether it is a computer science
    degree or a game on which they have begun working. “I see too many recent graduates
    lacking the capability to create a complete application no matter how small it
    is,” says Lee.


    # Working Conditions


    The workday for programmers can be long, especially when they are designing a
    new game. Sometimes they spend an entire day working on bug fixes with other team
    members. Even after the game is done, the team often moves quickly to the next
    project. In a 2016 interview with We Are Game Devs, Laidacker described their
    typical workday:


    My day for one'
