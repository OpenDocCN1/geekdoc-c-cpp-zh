    game jam experience, hackathons, etc., rather than someone with just good grades.
    Passion for wanting to get into games and showing that you''ve spent some time
    working on your own projects is what I look for most.


    ## Skills and Personality


    One of the most important personality traits for programmers is flexibility. Since
    they will be required to write code or script in a variety of different programming
    languages, as well as work with a team of fellow programmers, artists, and designers,
    adaptability is key. Strong written and verbal communication skills are also necessary,
    along with critical thinking skills. The Game Career Guide suggests that programmers
    must be able to seek out the answers to questions they have and the solutions
    to problems they face. In this sense, programmers must be strong independent learners.
