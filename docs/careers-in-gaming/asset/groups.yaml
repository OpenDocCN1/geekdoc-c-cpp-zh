    # What Does a 3-D Artist Do?


    3-D artists, also sometimes known as 3-D modelers, create different types of three-dimensional
    artwork to bring a game’s characters, objects, and environment to life. Although
    their work is predominantly digital, they may also draw, paint, or sculpt these
    characters using more traditional media like paper and pencil, watercolors, or


