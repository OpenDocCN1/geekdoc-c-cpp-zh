    ## Quality Assurance

    ## Tester


    ### What Does a Quality Assurance Tester Do?


    Quality assurance testers (also known as video game testers) locate and report
    problems with individual video games during the post-production phase. This is
    the period after the game is completed but before it is made available to customers.
    Even the best-designed video games have glitches. The goal of testers is to find
    all of those glitches—or as many as possible—before the game goes public, but
    they may also be involved with reproducing player-reported glitches once the game
    is available to consumers. Testers typically look for bugs in the game’s software
    that take away from the overall user experience. For instance, bugs might cause
    the game to get stuck at the same point in a certain level, or they may prevent
    the game from advancing. Testers might also look for art glitches, such as failure
    to properly render a character or environment. Although quality assurance testers
    are the ones who find the glitches, they do not necessarily fix them. When they
    identify problems in a game, they alert other members of the game development
    team so that they can fix the problems.


    Finding the glitches is not always easy. Often it requires hours of playing and
    replaying specific parts of a game in search of problems that a player might encounter.
    And although part of their work entails playing a game like any gamer, they also
    use specific testing methods to root out any problems. For example, they might
    use matrix testing, which requires playing every character against each of the
    others in a game at every level. Or they might use functionality testing, which
    involves testing all of a game''s features to make sure their work according to
    the game''s documentation. In addition, once programmers have fixed the reported
    bugs, quality assurance testers might conduct regression testing, which is the
    act of retesting levels that have been previously tested.


    Sometimes the object of testing is actually to break the game, but other times
    the goal is simply to play as any ordinary gamer might. When an error, glitch,
    or potential problem is found, the tester flags the issue, documents it, and alerts
    the lead tester. Documentation usually involves a written description of the problem,
    notes about how it can be reproduced, screenshots (particularly for art glitches),
    and any relationship that the tester may notice between additional errors he or
    she has already spotted. As Brent Gocke, the senior release manager at Sony Computer
    Entertainment America, "If you enjoy tinkering and trying to break things, video
    game testing could potentially be a route for you. It''s for someone who is meticulous,
    someone who enjoys games and is passionate about playing these things and the
    different possibilities."


    ### How Do You Become a Quality Assurance Tester?


    #### Education

    The typical route to becoming a video game tester comes from a love of playing
    video games, but there are many different skills that ultimately bring people
    into the world of testing. Although there are no specific educational requirements
    for game testers, more and more employers do require some formal study, whether
    in computer-programming or a related field. Technical and community colleges offer
    undergraduate certificates in software quality assurance, which can be completed
    in as little as six months.


    However, those who only hold certificates may find themselves up against tough
    competition from applicants with bachelor''s degrees in more specialized fields,
    such as computer science, information technology, or software engineering. According
    to O*NET, about 64 percent of software testers have a bachelor''s degree, 14 percent
    have an associate''s degree, and 9 percent have a master''s degree. Students who
    want to advance within the field but do not want to opt for a master''s degree
    can also find graduate certificate programs in software quality assurance, which
    can be completed in about one year. These programs can also typically be completed
    while the student works full-time, and course credit can sometimes be transferred
    toward the pursuit of a master''s degree.


    #### Certification

    Many employers require video game testers to be certified. One of the most common
    qualifications is the software tester certification offered by the International
    Software Board. This certification must be renewed every three years, and work
    experience is required in addition to the written test. Additional certifications
    that may benefit a quality assurance tester include the certified quality engineer
    and certified reliability engineer, both offered by the American Society for Quality.


    #### Skills and Personality

    Video game testing attracts a specific type of individual. Although most gaming
    enthusiasts, the key to being a good tester is enthusiasm for improving the game.
    But that alone is not enough. Quality assurance testers must be patient, methodical,
    and able to work on their own without direct supervision. Testers should be analytical,
    with the ability to discover problems and offer possible solutions. They also
    need to have strong written and oral communication skills to describe problems
    clearly and to team members. It can also be helpful for testers to analyze problems
    from a developer''s or designer''s view as well as using a gamer''s mind set.


