    looking to hire is to code your own game and take part in game devel-oper gatherings:


    Make your own game. With Unity3D [a game devel-op program] it''s so accessible
    to anybody, and Game Jams are a great way to spend 48 hours of your time to come
    out with a game prototype. I tend to fa-vor applicants with personal projects,
    game jam exper-rience, hackathons, etc., rather than someone with just good grades.
    Passion for wanting to get into games and showing that you''ve spent some time
    working on your own projects is what I look for most.


    # Skills and Personality


    One of the most important personality traits for programmers is flex-ibility.
    Since they will be required to write code or script in a variety of different
    programming languages, as well as work with a team of fellow programmers, artists,
    and designers, adaptability is key. Strong written and verbal communication skills
    are also necessary, along with critical thinking skills. The Game Career Guide
    suggests that


    programmers must be able to seek out the answers to questions they have and the
    solutions to problems they face. In this sense, programmers must be strong independent
    learners. However, it''s crucial that game programmers also know how to communicate
    eff-ectively with others, as their jobs require that they share their knowledge
    on an everyday basis.


    Programming is one of the most technical jobs in any video game company, but it
    is also a highly creative endeavor. Many programmers regard their ability to write
    in multiple computer languages to be a kind of art form. As Gil Fewster, a self-described
    "tinker" and freelance programmer, explains in an article on the website freeCodeCamp,


    People who don''t code rarely believe this, for all of its technical rules and
    structural discipline, program-ming is a highly creative activity. . . No two
    program-mers will ever produce identical code, not even if the'
