    Depending on experience, technical proficiency, and customer service skills, the
    earnings of technical support specialists may vary widely. According to O*NET,
    the average computer user support specialist''s median income for 2015 was $48,620,
    and median income for computer network support specialists was $62,250. The highest
    10 percent in both categories earned anywhere from $81,260 to $106,310. According
