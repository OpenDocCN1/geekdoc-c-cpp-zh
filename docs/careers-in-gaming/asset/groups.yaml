    # Sound Designer


    # What Does a Sound Designer Do?


    Sound designers create the audio world of a video game. They build a library of
    noises and auditory cues that occur during game play—much like the Foley artists
    of film and television. Working in concert with creative directors, game designers,
    producers, and other members of the game development team, the sound designer
    learns more about the setting, characters, and story to create an immersive a
    environment for the game. According to an article on the Designing website by
