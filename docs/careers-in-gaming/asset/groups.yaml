    ## Programmer


    ## What Does a Programmer Do?


    Video game programmers do the hard work behind the scenes: they create all of
    the code that makes games run smoothly. The Game Career Guide website describes
    the job of a programmer in the video game industry this way:


    | At a Glance: Programmer |

    | :--- | :--- |

    | Minimum Educational Requirements | Bachelor''s or associate''s degree |

    | Personal Qualities | Critical-thinking, problem-solving, and strong written
    and oral communication skills; team player |

    | Certification | Required |

    | Working Conditions | Indoors |

    | Salary Range | About $77,550 to $102,000 |

    | Number of Jobs | As of 2014 about 328,600 |

    | Future Job Outlook | Rate of growth is declining as jobs shift overseas |


    At the most basic level, programmers write the code that makes things happen in
    a video game. This includes connecting or “mapping” the player input from the
    control pad to the action that''s happening on the screen. It also includes all
    the action or movement of nonplayer characters [NPC]; for instance, when you see
    NPCs wandering the terrain of a video game, it''s the programmers who gave the
    characters the artificial intelligence to roam where they do.


    Programmers typically specialize in one of several areas.


    Artificial intelligence (AI) programmers decide how the characters in a game will
    react in response to different actions performed by a human player on his or her
    computer. Some examples of this include strategy (decision-making algorithms,
    which calculate the pros and cons of taking one action versus another), Pathfinder
    (plotting the shortest route between two points in the game), and enemy tactics
    (the types of actions a game''s villain can take to improve or her position within
    the game). Different coding scripts are used to program these, and AI programmers
    are typically well versed in several different computer languages.


    Physics programmers make the rules that govern the game world, including effects
    like gravity and the way characters interact with objects. These programmers also
    control special effects, including explosions, fire, and laser beams. Characters''
    bodies are also subject to the laws of physics, so programmers will be in charge
    of creating effects for bodies hitting the ground or suffering impacts of other
    kinds, which are usually referred to as soft ragdoll physics.


    Graphics programmers focus on using colors, shading, light, shadows, and textures
    to give players visual cues about what they are supposed to do in each scene.
    They work to give two-dimensional art a feeling of being three-dimensional, and
    they also help to compress data so that there is no lag time within a game as
    it is played.


    User interface programmers write code that runs the game engine. In other words,
    this kind of programming is responsible for how players navigate the game. Navigation
    typically uses some type of menu system to control everything from choosing a
    level or a character''s costume to turning the volume up or down.


    ## How Do You Become a Programmer?


    ## Education


    No matter what their specialty, an ideal field of study for would-be programmers
    is computer science. As the Game Career Guide website notes in the article "Game
    Programming: An Introduction," "Programmers are math and science people, and more
    specifically, algebra, calculus, and computer science people. Typically, programmers
    hold a degree in (or have advanced knowledge of) computer science.” Most colleges
    and universities offer computer science degree programs. The top four schools
    for computer science, according to the U.S. News & World Report, are Carnegie
    Mellon University, the Massachusetts Institute of Technology, Stanford University,
    and the University of California, Berkeley, although there are many other similar
    programs in universities throughout the United States. These four-year programs
    introduce students to the core concepts of game design, including classes in programming,
    story and character development, visual and sound design, and game engine development.
    Earning a degree in computer science exposes would-be programmers to information
    about various operating systems, programming concepts, input/output methods, and
    algorithms.


    According to O*NET, about 78 percent of general computer programmers have a bachelor''s
    degree, 11 percent have a postsecondary certificate, and 6 percent have only a
    high school diploma or equivalent. AI specialists typically have a master''s degree
    or a doctorate in computer science or cognitive science.


    ## Certification


    Certification in a variety of programming languages is a must; and programmers
    today are typically expected to have fluency in C++, OpenGL, PhysX, Perl, Perforce,
    Python, and XML. As the Game Career Guide notes in “Game Programming: An Introduction,”
    “Before programmers find work in the game industry, they need to have a firm and
    working grasp of a programming language, usually C++, though many also need to
    know Assembly, C, or Java. C++ is the most common language used in the game industry
    today.


    ## Getting Experience


    Even for people just starting out as game programmers, experience matters. Fortunately,
    there are many ways to get experience, although most of them require individual
    initiative. As Alessia Laidacker, lead gameplay and AI programmer at Ubisoft Montreal,
    noted during an April 2016 interview with the We Are Game Devs website, one of
