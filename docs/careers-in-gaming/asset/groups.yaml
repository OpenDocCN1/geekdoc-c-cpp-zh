    developers can learn additional skills on the job and can receive bumps as they
    add skills and take on greater responsibilities. Or they can start their own companies,
    independently producing and publishing their own games. Although this option carries
    the most risk since developers must be able to do everything themselves (or hire
    staff to help with things they cannot), it also holds the opportunity for the
    greatest reward—particularly if a developer’s games go viral or strike a chord
