    long-term assignments by information technology recruiting firms. Video game testers
    work for video game companies, which can be large organizations that are easily
    recognized by avid gamers or smaller companies that release games made for specific
    mobile platforms. Many work for leading gaming companies like Ubisoft, Nintendo,
    EA Games, and Blizzard Entertainment.


    ## Working Conditions


    A quality assurance tester usually works independently in an office environment.
    A lead tester will oversee a quality assurance team, which may range from just
    a handful of testers in a small company to several hundreds of testers in a large
    one. Some testers are able to work from home and may tele-commute a few days a
    week. Most testers work full-time. Since game development is often driven by deadlines,
    it is not uncommon for testers to work long hours. In addition, crunch time may
    require testers to work overtime and/or night shifts in order to make sure that
    all bugs at levels of game play have been located and fixed before the game ships
    to consumers.


    Nonetheless, there are definitely some benefits to working for a company that
    produces games. As game tester Danny McGee notes in an article on the website
    Newsvine, working at EA Games included perks:


    - free cereal and milk in the break room, in addition to absurdly cheap vending
    machines (well-stocked with Mountain Dew) and free-to-play arcade games, a company
    store filled with video games from every EA-owned publisher and developer discounted
    at more than 50%, and every once in a while—just for good measure—there are the
    on-the-clock keg parties complete with free pizza, wings and video game tournaments.


    ## Earnings


    Pay for quality assurance testers varies depending on where they live, who they
    work for, what type of game they are testing, and how much experience they have.
    According to one source, game testers typically earn about $10 to $18 per hour
    and are paid hourly rather than being salaried. But another source, the job search
    website Indeed, states that in June 2016, typical video game testers made an average
    of $45,000 per year.


    ## Opportunities for Advancement


    Even as video game testers gain more experience, there is little opportunity for
    advancement within the testing realm. Some may be able to attain the more senior-level
    position of lead tester, but additional opportunities for climbing the corporate
    ladder are limited. Those who wish to transition to management, design, or programming
    jobs within the same company will typically need more education in order to break
    into those roles. Graduate-level management courses would be ideal for those with
    management-level aspirations, and software design or computer programming degrees
    would be preferable for those seeking design or programming jobs. Game testers
    who have advanced testing skills can also become software quality assurance engineers,
    who are software developers with the ability to write scripts to test complex,
    specialized software. Whatever angle a tester decides to pursue, the move will
    be a lateral rather than a straightforward career progression.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_71_0.png)


    Unlike other types of software testing, video game testers will always be required
    to play through games manually in search of bugs. Since testers must both imitate
    regular game players and actively seek out ways to break the game in order to
    improve its performance, there is no real way to automate these positions. Additionally,
    games must be played with several different goals in mind, something that would
    be quite taxing for a machine—even one with artificial intelligence. Nonetheless,
    competition for these jobs is likely to be stiff since there are always plenty
    of new recruits eager to play video games for a living.


