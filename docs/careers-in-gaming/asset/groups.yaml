    next system we are working on. Sometimes I''m working design docs. Sometimes I
    have headphones on coding all day.


    ## Earnings


    The salary of video game programmers depends on the type of company they work
    for and on their skills and experience. At one end of the spectrum are beginning
    programmers, who earn about $77,550 a year. At the other end are more advanced
    programmers, who can earn up to $92,000 per year. O*NET and the Bureau of Labor
    Statistics (BLS) group video game programmers in general computer programmers
    and software engineers, who earned a median salary of $79,530 in 2015. According
    to information obtained by the job search website Indeed in July 2016, typical
    video game programmers make an average of $102,000 per year.


    ## Opportunities for Advancement


    Different types of programmers will have different experiences within the video
    game industry, depending on their specialty. AI programmers, for instance, can
    advance in the field by obtaining a master’s degree or doctorate as well as working
    their way up from C++ programmer or junior software engineer. They may also be
    interested in making the jump from the video game industry into research groups
    focused on AI, or they may start their own companies to focus on a pet project.
    AI programmers can also find work in the robotics, voice-recognition, machine
    vision systems, and natural language industries. No matter what their specialization,
    programmers must continue to advance their skills and knowledge of the tools and
    programming languages used in the video game industry. The more they hone their
    skills, and add years of experience to their resume, the more in demand they will
    become, with an accompanying bump in pay to match.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_32_0.png)


    Video game programmers face some difficult realities. The BLS predicts that the
    number of computer programmer jobs will decline by 8 percent through 2024, due
    to the outsourcing of jobs to countries where the average programmer can be paid
    much less than a programmer in the United States. As a result there are 26,500
    projected jobs that will be lost during this time period. However, the BLS does
    not collect data specifically on the video game industry—which is one of the fastest-growing
    segments of the tech world.


    Likewise, as consumers continue to seek out newer, more complicated games—including
    those in the emerging realm of virtual reality (VR)—the skills of competent, experienced
    programmers will be required. As author Caroline Zaayer Kaufman notes in an October
    2015 article on the job search Monster, "Demand for job candidates with VR knowledge
    is up 37% over last year . . and because the technology is new, companies are
    having difficulty meeting that demand." So although lower-level programming jobs
    may continue to be outsourced, experienced lead programmers, AI programmers, and
    others who can create these more complicated games will be in a better position
    to find jobs.


    ## Find Out More


    Association for the Advancement of Artificial Intelligence

    www.aaai.org


    The AAAI is a nonprofit scientific society devoted to advancing the scientific
    understanding of the mechanisms of underlying thought and intelligent behavior
    and their embodiment in machines. This group hosts a yearly conference for those
    interested in learning more about AI as well as a variety of symposiums throughout
    the year.


    Entertainment Software Association

    www.theesa.com


    This American association is dedicated exclusively to serving the business and
    public affairs needs of companies that publish computer and video games for video
    game consoles, handheld devices, personal computers, and the Internet. The group
    also hosts an annual trade show for those interested in learning more about new
    video games and products.


    ## Road to VR


    ### Silicon Valley Virtual Reality (SVVR)


    www.svvr.com

    SVVR is a fast-growing community of developers, entrepreneurs, hackers, and artists
    dedicated to advancing affordable and accessible virtual reality and promoting
    a healthy, diverse VR ecosystem. Students can find local maker spaces and hackathons
    where they they can get involved with virtual reality in their own backyards.


    ## Sound Designer


    ### What Does a Sound Designer Do?


    Sound designers create the audio world of a video game. They build a library of
    noises and auditory cues that occur during gameplay—much like the Foley artists
    of film and television. Working in concert with creative directors, game designers,
    producers, and other members of the game development team, the sound designer
    learns more about the setting, characters, and story to create an immersive environment
    for the game. According to an article on the Designing website by sound designer
    Aaron Marks,


    "A lot of people don''t know outside of the games industry is that sound designers
    are still expected to not only be able to craft appropriate sound effects but
    also to be a field recorder to capture specific sounds to use as elements or as
    realistic sound effects, be a Foley artist to create specific object handling
    sounds to follow gameplay or for a game''s cinematics [movelike scenes used to
    introduce new characters or otherwise break up play], be an audio editor to edit
    and manipulate audio elements as needed ... and perform post-production as needed."


    ### At a Glance: Sound Designer


    - Minimum Educational Requirements: High school diploma or associate''s degree

    - Personal Qualities: Creative problem solver; musically inclined; self-directed;
    calm under pressure

    - Working Conditions: Indoors

    - Salary Range: About $41,780 to $68,000

    - Number of Jobs: As of 2014 about 117,200

    - Future Job Outlook: Growth rate of 7 percent through 2024

