    # What Is the Future Outlook for Game Developers?


    Game developers have a bright future. There is a predicted growth rate of 14 percent
    or higher through 2024, according to O*NET. This is considered much faster than
    average. O*NET also projects 238,000 job openings for the same time period (through
    2024), which means it is a great time to get in on the ground floor of the video
    game industry and work your way up to the level of developer. Consumers continue
    to have an insatiable thirst for new games; therefore, developers will always
    have plenty of jobs for the taking.


