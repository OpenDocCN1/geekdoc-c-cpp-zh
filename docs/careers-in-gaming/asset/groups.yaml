    ## 测试员


    ### 质量保证测试员是做什么的？


    质量保证测试员（也称为视频游戏测试员）在后期阶段定位并报告单款视频游戏中的问题。这一阶段是在游戏完成之后、交付客户之前。即使是设计最好的视频游戏也有漏洞（glitches）。测试员的目标是在游戏发布之前找到所有这些漏洞——或尽可能多地找到——但在游戏向消费者开放后，他们也可能参与重现玩家报告的漏洞。测试员通常寻找游戏软件中影响整体用户体验的
    Bug。例如，Bug 可能会导致游戏卡在某个关卡的某一个点，或者可能会阻止游戏继续进行。测试员可能还会寻找艺术故障，例如未能正确渲染角色或环境。虽然质量保证测试员是发现漏洞的人，但他们并不一定负责修复它们。当他们发现游戏中的问题时，他们会提醒游戏开发团队的其他成员，以便他们修复这些问题。


    发现漏洞并不总是易的。这通常需要花费几个小时玩和反复玩游戏的特定部分，以寻找玩家可能会遇到的问题。尽管他们工作的一部分像任何玩家一样玩游戏，但他们也使用特定的测试方法来根除任何问题。例如，他们可能会使用矩阵测试，这要求在游戏的每个关卡让每个角色与其它所有角色进行对决。或者他们可能会使用功能测试，涉及测试游戏的所有功能，以确保其工作符合游戏文档。此外，一旦程序员修复了报告的
    Bug，质量保证测试员可能会进行回归测试，即对以前测试过的关卡进行重新测试。


    有时测试的目标实际上是破坏游戏，但其他时候的目标仅仅是像普通玩家一样玩。当发现错误、故障或潜在问题时，测试员会标记该问题，将其记录，并通知首席测试员。记录通常包括对问题的书面描述、关于如何重现问题的笔记、截图（特别是针对艺术故障）以及测试员可能注意到的已发现的任何额外错误之间的任何关系。正如索尼互动娱乐美国公司高级发布经理
    Brent Gocke 所说：“如果你喜欢钻研事物并尝试弄坏它们，视频游戏测试可能成为你的一条道路。它适合那些细致入微的人、热爱游戏并热衷于玩这些事物以及探索不同可能性的人。”


    ### 如何成为一名质量保证测试员？


    #### 教育背景

    成为视频游戏测试员的典型路径源于对玩游戏的热，但许多不同的技能最终将人们带入测试领域。虽然游戏测试员没有特定的教育要求，但越来越多的雇主要求接受过正式学习，无论是在计算机编程还是相关领域。技术学院和社区学院提供软件质量保证的本科证书，最快只需六个月即可完成。


    然而，那些仅持有证书的人可能会发现自己面临着来自更专业领域（如计算机科学、信息技术或软件工程）的学士学位申请者的激烈竞争。根据 O*NET 的数据，约 64%
    的软件测试员拥有学士学位，14% 拥有专科学位，9% 拥有硕士学位。想在该领域内晋升但不想选择硕士学位的学生也可以找到软件质量保证的研究证书课程，这些课程大约可以在一年内完成。这些课程通常可以在学生全职工作的同时完成，且课程分有时可以转为追求硕士学位的积分。


    #### 认证

    许多雇主要求视频游戏测试员经过认证。最常见的资格之一是由国际软件委员会（International Software Board）提供的软件测试员认证。该证书必须每三年更新一次，而且除了笔试外，还需要工作经验。可能对质量保证测试员有利的额外认证还包括认证质量工程师和认证可靠性工程师，两者由美国质量协会（American
    Society for Quality）提供。


    #### 技能与性格

    视频游戏测试吸引特定类型的人。虽然大多数游戏爱好者都是如此，但成为优秀测试员的关键是对改进游戏的热情。但仅凭这些是不够的。质量保证测试员必须耐心、有方法，并且能够在没有直接监督的情况下独立工作。测试员应该具有分析能力，能够发现问题并提供可能的解决方案。他们还需要强大的书面和口头交流能力，向团队成员清晰地描述问题。测试员从开发者或设计者的角度分析问题，以及使用玩家的心态也会很有帮助。


