    ## How Do You Become a Technical Support Specialist?


    ## Education


    Technical support specialists do not necessarily require a degree in computer
    science, game design, or information science in order to be successful, but these
    types of degrees certainly help with a general understanding of video games and
    computer systems. They also look


    good to potential employers. According to O*NET, which classifies technical support
    specialists as either computer network specialists or computer user support specialists,
    about 47 percent of computer network support specialists have a bachelor''s degree,
    22 percent have an associate''s degree, and 14 percent have some college courses
    but hold no degree. Comparatively, about 29 percent of computer user support specialists
    hold a bachelor''s degree, 22 percent have had some college but hold no degree,
    and 18 percent hold an associate''s degree.


    ## Certification and Licensing


    Certification may be required, depending on the company. An A+ certification from
    the Computer Technology Industry Association is often requested, which certifies
    grounding in both technology and customer service skills. Other types of certification
    that may be required include programs offered by Apple, Microsoft, Cisco, and
    Linux that are specific to these computer operating systems.


    ## Skills and Personality


    Technical support specialists rely on their customer service skills to interact
    with angry, frustrated gamers. Therefore, two of their most important traits are
    patience and understanding. Paired with excellent listening skills, they need
    to be able to quickly understand the problems users describe over the phone or
    via instant messaging. Likewise, they must ask good follow-up questions in order
    to help clear up any confusion. A calm demeanor is essential, particularly during
    heated interactions.


    Problem-solving skills are another key trait for tech support. Both simple and
    more difficult problems arise on a daily basis. For routine questions, the tech
    support specialist can usually rely on scripted responses. For less common and
    more difficult issues, specialists need to have an open mind to come up with possible
    solutions.


    Communication skills are also important. Technical support specialists must be
    able to verbally communicate their solutions to consumers in a clear, concise
    manner. Strong written communication skills are essential for writing reports
    on individual issues to pass along to the quality assurance team and when writing
    e-mails or live chat messages in response to gamers. As the website Get In Media
    notes,


    As a problem solver that is tasked with troubleshooting technical glitches and
    with appeasing the customer, the individual in this role should have a solid understanding
    of game systems, as well as excellent interpersonal skills. A college degree in
    computer science or game design is beneficial. The customer service technician
    must be familiar with the systems of the game engine and console platform, as
    well as multiple computer browsers and network configurations for PC and Mac gaming.
    Additionally, this position demands a person who can demonstrate strong conflict
    resolution skills, organization, and focus.


    ## On the Job


    ## Employers


    Most technical support specialists are shift workers, who work onsite at large
    video game companies, such as Blizzard, EA Games, Nintendo, and Ubisoft. They
    may also be contracted out by staffing companies or hired as temporary or seasonal
    employees to help out during busier times of year. An August 2016 ad for a virtual
    game support representative on the job search website Indeed suggests that many
    tech support jobs are actually work-from-home opportunities for applicants with
    the right skills and technical setups. The description suggests the following
    requirements for applicants:


    Excellent Internet connectivity: access speeds of 5 Mbps upload and 7 Mbps download—the
    faster the better (wireless and/or Internet Service Providers are not compatible
    with systems).


    ## Working Conditions


    Technical support technicians are often scheduled twenty-four hours day, seven
    days week, in order to quickly respond to players. Therefore, aspiring tech support
    workers should have flexibility when it comes to scheduling since they may be
    asked to work early mornings, late nights, or weekends. As an article on customer
    service in the gaming industry from the 5CA website notes, “The need for technical
    support & customer care in the game industry is evolving exponentially and gamers
    are known to be some of the most demanding customers.” Technical support specialists
    who work for large companies work in a call center. The typical call center consists
    of a large room or rooms filled with cubicles in which workers answer calls from
    customers. Working in a call center can be stressful, the lack of privacy and
    personal space typical in cubicle setups.


    Wait, wait. According to O*NET, the average computer user support specialist''s
    median income for 2015 was $48,620, and median income for computer network support
    specialists was $62,250. The highest 10 percent in both categories earned anywhere
    from $81,260 to $106,310. According to information obtained by Indeed in July
    2016, typical technical support specialists make an average of $39,000 per year.'
