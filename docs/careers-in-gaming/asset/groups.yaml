    3-D artists, or modelers, create the three-dimensional artwork that gives life
    to a game''s characters, objects, and environments. Most of their work is digital
    but they sometimes also draw, paint, or sculpt life-forms, scenery, and other
    elements of a game.


    ## On the Job


    3-D artists, or modelers, create the three-dimensional artwork that gives life
    to a game''s characters, objects, and environments. Most of their work is digital
    but they sometimes also draw, paint, or sculpt life-forms, scenery, and other
    elements of a game.


    ## Working Conditions


    A typical workday doesn''t exist for 3-D artists, as they are always working on
    something different. In a June 2016 interview with the website We Are Devs, Joe
    Perez described a typical day, "That''s a tough question because it changes all
    the time. One day I could be working on lighting, another day I would fix bugs
    or create new models. I love that kind of dynamic; I typically go in at 9 and
    finish at 6. We really don''t have much..."


    ## Earnings


    The salary of 3-D artists depends on the amount of experience and technical proficiency
    they have obtained. According to O*NET, at one end of the spectrum are entry-level
    artists, who earn about $63,970 per year, and can advance to a higher pay scale
    with experience. At the other end are more advanced artists who have been in the
    field longer, who earn about $70,300 per year. According to information obtained
    by the job search website Indeed in July 2016, typical 3-D artists make an average
    of $66,000 per year.


    ## Opportunities for Advancement


    3-D artists can earn the respect of their peers, acclaim within the industry,
    and expect a salary the longer they work in the field. Typically, artists are
    considered to be experienced after working three years in the gaming industry;
    at that time, they may be considered for senior artist or lead artist positions.
    There is also some potential for 3-D artists to switch from the video game industry
    into the film industry, which may bring additional risks and rewards. As the website
    The Art Career Project points out, "3D modeling is a very multifaceted career
    that can involve working for a large variety of industries. While many associate
    3D with computer animation and filmmaking, this is only one option that a 3D model
    may pursue. In fact, they can work for architecture firms, the health care industry,
    laboratories, product design, the automotive industry, manufacturing and many
    others. This is because 3D modeling has become extremely popular in the recent
    years, since it gives the opportunity to test concept art in a more realistic
    environment."

