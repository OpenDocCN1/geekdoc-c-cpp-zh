- img_proc: true
  md: 'ones who find the glitches, they do not necessarily fix them. When they identify
    problems in a game, they alert other members of the game development team so that
    they can fix the problems.


    Finding the glitches is not always easy. Often it requires hours of playing and
    replaying specific parts of a game in search of problems that a player might encounter.
    And although part of their work entails playing a game like any gamer, they also
    use specific testing methods to root out any problems. For example, they might
    use matrix testing, which requires playing every character against each of the
    others in a game at every level. Or they might use functionality testing, which
    involves testing all of a game''s features to make sure their work according to
    the game''s documentation. In addition, once programmers have fixed the reported
    bugs, quality assurance testers might conduct regression testing, which is the
    act of retesting levels that have been previously tested.


    Sometimes the object of testing is actually to break the game, but other times
    the goal is simply to play as any ordinary gamer might. When an error, glitch,
    or potential problem is found, the tester flags the issue, documents it, and alerts
    the lead tester. Documentation usually involves a written description of the problem,
    notes about how it can be reproduced, screenshots (particularly for art glitches),
    and any relationship that the tester may notice between additional errors he or
    she has already spotted. As Brent Gocke, the senior release manager at Sony Computer
    Entertainment America, "If you enjoy tinkering and trying to break things, video
    game testing could potentially be a route for you. It''s for someone who is meticulous,
    someone who enjoys games and is passionate about playing these things and the
    different possibilities."


    # How Do You Become a Quality Assurance Tester?


    Education

    The typical route to becoming a video game tester comes from a love of playing
    video games, but there are many different skills that ultimately bring people
    into the world of testing. Although there are no'
  merge: -1
