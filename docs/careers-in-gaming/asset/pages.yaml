  md: '# Changes Bode Well for Workers


    Though the gaming industry has been male dominated since its inception, things
    are changing. Women have begun joining the ranks of game industry professionals
    and are likely to be a big part of the industry in the future. In a May 2016 interview
    with CBS News, Stephen Wood, a Moore College of Art & Design gaming arts professor
    from Philadelphia, commented,


    There’s going to be a huge boom of women entering the industry in the next 10
    years. In the ''80s and ''90s, video games were seen as things boys do. But in
    the ''90s and early 2000s, girls said, ‘We’re going to play, too.’ Now girls are
    going to college and studying video games. We’re helping close gender gap and
    being part of the solution.


    Despite—or perhaps because of Gamergate (a 2014 scandal in which female game developers
    like Zoë Quinn and Brianna Wu were specifically targeted for harassment online),
    young women are eager to join the video game industry, and the educational system
    is eager to accommodate their interests. As more women join the ranks of programmers
    and developers, the industry continues to become more welcoming, and women in
    design careers are beginning to enjoy the same success as their male counterparts.


    Though the Bureau of Labor Statistics does not track jobs in the video game industry
    specifically, it is clear that this particular corner of the tech world is booming.
    With approximately 2.6 billion gamers worldwide, playing on an astounding array
    of platforms, the video game industry is simply exploding. This bode well for
    job seekers.


    # The Major Areas of Study


    The video game industry is a great choice for students interested in a wide variety
    of academic fields. Combining elements of fine art, computer technology and design,
    game theory, music, psychology, and sociology, video games incorporate multimedia
    disciplines from across a wide spectrum. Artists and engineers alike are welcome
    in the video'
