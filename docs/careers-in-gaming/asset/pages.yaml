  md: 'specific educational requirements for game testers, more and more employers
    do require some formal study, whether in computer-programming or a related field.
    Technical and community colleges offer undergraduate certificates in software
    quality assurance, which can be completed in as little as six months.


    However, those who only hold certificates may find themselves up against tough
    competition from applicants with bachelor''s degrees in more specialized fields,
    such as computer science, information technology, or software engineering. According
    to O*NET, about 64 percent of software testers have a bachelor''s degree, 14 percent
    have an associate''s degree, and 9 percent have a master''s degree. Students who
    want to advance within the field but do not want to opt for a master''s degree
    can also find graduate certificate programs in software quality assurance, which
    can be completed in about one year. These programs can also typically be completed
    while the student works full-time, and course credit can sometimes be transferred
    toward the pursuit of a master''s degree. Master''s degree programs are usually
    in softwareengineering with a concentration on testing issues.


    Additionally, many of the skills required of testers can only be learned on the
    job. Things like understanding how an applicationprogramming interface or a particular
    gaming company’s proprietary software and setups work, for instance, can only
    be learned with experience.


    # Certification


    Many employers require video game testers to be certified. One of the most common
    qualifications is the software tester certification offered by the International
    Software Certification Board. This certification must be renewed every three years,
    and work experience is required in addition to the written test. Additional certifications
    that may benefit a quality assurance tester include the certified software quality
    engineer designation and the certified reliability engineer designation, both
    offered by the American Society for Quality.


    # Skills and Personality


    Video game testing attracts a specific type of individual. Although most gaming
    enthusiasts, the key to being a good tester is enthusiasm for improving the game.
    But that alone is not enough. Quality assurance'
