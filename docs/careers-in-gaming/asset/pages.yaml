  md: '# Quality Assurance

    Tester


    # What Does a Quality Assurance Tester Do?


    Quality assurance testers (also known as video game testers) locate and report
    problems with individual video games during the postpro-duction phase. This is
    the period after the game is completed but before it is made available to customers.
    Even the best-designed video games have glitches. The goal of testers is to find
    all of those glitches—or as many as possible—before the game goes public, but
    they may also be in-volved with reproducing player-reported glitches once the
    game is available to consumers. Tes-ters typically look for bugs in the game’s
    software that take away from the overall user experi-rience. For instance, bugs
    might cause the game to get stuck at the same point in a certain level, or they
    may prevent the game from advancing. Testers might also look for art glitches,
    such as failure to properly render a char-acter or environment. Although quality
    assurance testers are the


    # At a Glance:

    Quality Assurance

    Tester


    Minimum Educational Requirements

    Bachelor''s or associate''s degree


    Personal Qualities

    Critical thinking; self-directed;

    strong written and oral communi-cation skills; calm under pressure


    Certification and Licensing

    Suggested


    Working Conditions

    Indoors


    Salary Range

    At $20,000 to $45,000


    Number of Jobs

    As of 2015 about 233,000


    Future Job Outlook

    Growth rate of 2 to 4 percent

    through 2024'
