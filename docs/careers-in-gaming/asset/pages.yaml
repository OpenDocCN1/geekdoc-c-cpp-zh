  md: 'A game developer, or designer, creates a story and its characters. The developer
    also oversees how all of the components of the game—including the story line,
    characters, rules, environments, and game play experience—come together.


    Game design is the process of designing the content and rules of a game; the gameplay,
    environments, storyline and characters. A games designer may specialize in one
    category (level design, writing, balancing difficulty) or all depending on the
    size and complexity of the project. There are many components that go into making
    video games: art, animation, audio and user interface design. There can be script
    writing, creating systems of economy within the product itself, the wide variety
    of potential social components and more. My job is to see how all of these can
    come together to achieve the game''s goals—and then be able to communicate this
    vision to a wide variety of stakeholders.


    Developers may also be involved in coding software, art direction, or graphic
    design. They may even be involved in beta testing pre-release versions of the
    game before sending it to quality assurance


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'testers. Depending on the size of the studio they work for, some parts of a
    developer''s job may also be similar to the role of a producer director in the
    film industry, such as keeping the project on track and delivering the finished
    game to consumers on time.


    Different types of game developers will be responsible for different aspects of
    game play. Game mechanics designers make sure that the rules of the game are properly
    defined, and environmental designers devise many different scenes (or environments)
    in which the game can be played. Lead designers coordinate all of the individual
    designers and help direct communication within the team. As leaders, they must
    also take charge to make important decisions about the game as a whole. For example,
    Tom, a lead designer at Firemonkey Studios (part of EA Games), notes on the EA
    Games website that “a lead, I have a sizable say in the project''s long-term direction.
    I also do a bunch of mentoring and helping people to achieve their career goals.
    It always gives me a thrill when one of the designers on my team has a great idea,
    creates some sweet content, or comes up with a clever solution to a problem. Makes
    me proud!


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_13_0.png)


    # Education


    Students looking for a job as a game developer should strongly consider a degree
    or certificate in game design; this degree will focus on the skills most often
    required for game design and development, including knowledge of game theory,
    game planning, and strategy. Creative writing degrees can also prove useful as
    game designers must be strong storytellers with excellent character development
    skills. According to O*NET Online which groups game developers with software developers,
    about 62 percent of software developers have a bachelor''s degree, 19 percent
    have an associate''s degree, and 17 percent have attended some college but possess
    no degree.


    # Internships


    Would-be video game developers should definitely apply for internships with video
    game companies that match their skills and'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'ambitions. Not only an internship help provide valuable experience, but it
    can also be a foot in the door of the ultracomcompetitive gaming industry. Most,
    if not all, of these opportunities are paid internships, and some include housing
    stipends or cover participants''travel expenses. Blizzard Entertainment offers
    students a chance to join their twelve-week summer internships, which take place
    at one of the company’s three US locations (Austin, Texas; Irvine, California;
    or San Francisco, California). PlayStation also offers twelve-week summer internships,
    which are open to both undergraduate and graduate students.


    # Skills and Personality


    Game developers are creative types with a passion to share their ideas for games
    and create entirely new worlds from scratch. Developers are also storytellers.
    They need strong storyboarding abilities to convey their vision to the design
    team through drawings of various scenes that need to appear in the game. Developers
    are also computer programmers with coding skills, which means they must strike
    the right balance of creativity and computer science. As part of finding this
    balance, developers need to be able to analyze creative suggestions as well as
    the practicality of achieving them—and without losing sight of the intended audience.
    An article on the game review and news website ZTGD describes the qualities that
    make a successful game developer. Successful developers are those who ask themselves
    like


    Who is the player? What type of game is the intended outcome?... Game design will
    vary depending on the answer to these two questions. Good analytical skills will
    help answer these questions and is the next favorable characteristic game developers
    are looking for. Being able to determine what part of the game is and not working
    is important to a promising result. Video game players are looking for a game
    that grabs their attention right away and holds it.


    The most successful developers are able to work well as part of a team. Game design
    requires many different moving parts and'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'specialized abilities, so being able to express ideas clearly is very important.
    Developers must work with fellow designers, coders, artists, animators, and more
    to create a game, so being able to understand where each member of the team is
    coming from is critical for solving problems.


    Problem-solving skills and patience are also core traits for game developers.
    They must remain flexible creatively and financially, offering solutions to problems
    that arise and keeping the entire project moving forward. Being able to keep calm
    to work through these challenges is essential. Work hours can be long, which may
    cause nerves, so patience with fellow team members—especially when on deadlines—is
    very important.


    Developers must also possess managerial skills since they are both producers and
    directors of a game''s overall production. Developers often take up the tasks
    of managing the budget, organizing the team''s work schedules, and keeping projects
    on schedule in order to hit various milestones as well as the final deadline.


    # On the Job


    # Employers


    Game developers may work for top studios, such as Ubisoft, Nintendo, Sony, EA
    Games, or Blizzard. These developers are responsible for the majority of the video
    games available for consoles and mobile devices. In addition, there are many freelance
    game developers; these developers are self-employed and run their own businesses
    or may work on developing games in their free time. Bianca Wu and Amanda Warner
    are independent game developers and cofunders of Giant Spacecat. On the company''s
    website they note that they create games “where we are the the heroes, not an
    afterthought.” Dave Castlenuovo, the sole programmer at Bolt Creative, is another
    freelancer. The perks, as Castlenuovo puts it in an interview with the website
    All Things D, come from the company''s indie status: “We made a decision to stay
    small. To me, I get the most enjoyment working out of my home, getting to see
    my wife.


    As a 2014 VentureBeat article explains, more and more high-profile developers
    are making the move from larger companies to'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'setting up their own shops, and it seems that this trend will continue in the
    future. Joseph Humfrey, art and code director for Inkle studios, adds, in an Indie
    Game Reviewer article, “Platforms like Steam and the App Store have created a
    blossoming market, and tools like Unity have leveled the playing field for developers
    of different backgrounds and years of experience. You no longer need a vast team
    to build a technically and visually impressive game.”


    # Working Conditions


    Game developers typically work in office or studio environments, alongside fellow
    designers and programmers. Developers may have their own office or cubicle, or
    there may be an open floor plan in order to facilitate group work. Most developers
    work full-time, and there are typically many overtime hours logged as well.


    Independent game developers may also work on their days off, over lunch breaks,
    or on weekends to collaborate with teammates working in other cities around the
    world. As Emeric Thoa, creative director for the Game Bakers, describes life as
    an indie for the website Indie Game Reviewer, “It’s like being in a music band.
    You can be successful and admired like an artist and a star, or you can go from
    small gig to small gig, hoping it takes off one day. But in both cases it is very
    satisfying and tiring at the same time.”


    # Earnings


    The salary of video game developers depends on the type of company they work for
    as well as the skills and experience they have amassed on the job. According to
    O*NET Online, which groups video game developers in software designers, at one
    end of the spectrum are beginning designers, who earn about $63,970 to $73,864
    a year. At the other end are more advanced designers, who can earn between $98,260
    and $100,690 per year. According to information obtained by the job search website
    Indeed July 2016, typical video game designers make an average of $58,253 per
    year.


    # Opportunities for Advancement


    Video game developer is not an entry-level job; therefore, there is not much room
    for advancing to higher-level positions. However,'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'developers can learn additional skills on the job and can receive bumps as
    they add skills and take on greater responsibilities. Or they can start their
    own companies, independently producing and publishing their own games. Although
    this option carries the most risk since developers must be able to do everything
    themselves (or hire staff to help with things they cannot), it also holds the
    opportunity for the greatest reward—particularly if a developer’s games go viral
    or strike a chord within the gaming community.


    # What Is the Future Outlook for Game Developers?


    Game developers have a bright future. There is a predicted growth rate of 14 percent
    or higher through 2024, according to O*NET. This is considered much faster than
    average. O*NET also projects 238,000 job openings for the same time period (through
    2024), which means it is a great time to get in on the ground floor of the video
    game industry and work your way up to the level of developer. Consumers continue
    to have an insatiable thirst for new games; therefore, developers will always
    have plenty of jobs for the taking.


