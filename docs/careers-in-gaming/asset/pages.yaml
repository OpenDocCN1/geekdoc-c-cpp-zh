  md: 'game industry, and most end up collaborating on projects rather than working
    in isolation as in other careers.


    Fine artists may find work as animators; character artists or model; concept,
    environment, texture, or lighting artists; or art directors. Programmers may find
    themselves involved with engine, game play, physics, user interface, or artificial
    intelligence programming. The musically inclined find jobs in the industry as
    audio programmers or engineers, composers, voice-over artists, or even Foley (sound
    effects) artists. Writers, designers, developers, and many more staff are also
    required to create video games that will amuse, educate, and enchant players.


    # A Competitive Field


    Although the video game industry is certainly welcoming of a wide variety of disciplines
    and career directions, it is also a highly competitive field. Part of the reason
    for this is its obvious draw: playing video games for a living. But, of course,
    there is much more than it that, and although working for a gaming company can
    certainly be fun, there is plenty of hard work involved.


    Cross-discipline STEAM (science, technology, engineering, art, and math) degrees
    come in handy in the industry, but it will take more than good grades to get a
    foot in the door. What employers are really looking for is a passion for video
    games and gaming as well as the creative ability to build new games. As John Newcomer,
    the creative director at Reliance Games, mentions in a recent interview with Digital-Tutors.com,
    "I want to see a twinkle in the candidate''s eye that they are in this business
    because they want to be. There''s a joy and passion to create games and entertainment.
    I want to know if the person has creative ability and how universal it is. They
    need to be able to dissect a game and tell me why it''s fun or successful. What
    makes it tick? Newcomer also notes that although knowledge of an array of digital
    tools, from Photoshop to Maya LT (and many more), is important, what is even crucial
    to any new hire''s success is his or her ability to communicate with the other
    members of the team. Combining soft skills like the ability to work well in groups,
    technical ability, and creativity is often just the right blend required for success
    in the video game industry.'
