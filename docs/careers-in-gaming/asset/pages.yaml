  md: '# Game Mechanics Designer


    # What Does a Game Mechanics Designer Do?


    Game mechanics designers, also known as systems designers, create the rules and
    systems for interacting within a game. This work is what makes game play possible.
    As Jesse Schell, founder of Schell Games, explains in his book The Art of Game
    Design: A Book of Lenses: "These are the procedures and rules of your game. Mechanics
    describe the goal of your game, how players can and cannot try to achieve it,
    and what happens when they try."


    # At a Glance:


    # Game Mechanics Designer


    Minimum Educational Requirements

    Bachelor''s or associate''s degree


    Personal Qualities

    Creativity and storytelling skills; problem-solving ability; team player; strong
    written communication skills


    Working Conditions

    Indoors


    Salary Range

    About $63,970 to $100,690


    Number of Jobs

    As of 2014 about 1.1 million


    Future Job Outlook

    Growth rate of 14 percent or higher through 2024


    All games, not just video games, operate with rules. Sharon Boller, in her online
    article "Learning Game Design Series, Part 3: Game Mechanics," cites the Monopoly
    rule—"When players pass Go, they collect $200"—an example of an explicit rule
    (or mechanic) that players follow. In a video game, a rule or mechanic is programmed
    into the game. Boller gives an example:"When players respond incorrectly to a
    question they get immediate feedback on on what a correct response should be,
    followed by an opportunity to re-try answering the question."'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Not all game mechanics designers do the same thing. For instance, those who
    work on fighting games are called combat designers, and their job is to create
    a coherent system for what occurs when two or more characters fight. Game mechanics
    designers may also hold titles based on the type of work they do, including level
    designers, achievement designers, world builders, mission or quest designers,
    economy designers, and puzzle designers.


    he main task of a game mechanics designer is to create engaging experiences for
    players. Sometimes these experiences are simple and fun, but other times are incredibly
    difficult or frustrating. Regardless of difficulty, the goal is to make sure a
    player will want to continue playing the game. More difficult games usually offer
    more significant rewards for beating a level, which is what encourages users to
    continue playing. Designers use a variety of psychological techniques and game
    design theories to encourage players to push forward, even when the game gets
    tough. Different approaches help designers create well-crafted games and unique
    experiences that players deem worthy of their time. This might include the carrot-and-stick
    approach, in which players are either rewarded for correct actions with a carrot,
    or valuable item, or punished for incorrect actions by beating with a stick, or
    other negative experience. As game design expert Amy Jo Kim explains in an interview
    with the website Bokardo,“Game mechanics are a collection of tools and systems
    that an interactive designer can use to make an experience more fun and compelling...
    These core mechanics are a good place to start: collecting, points, feedback,
    exchange, and customization."


    ame mechanics can be complex or simple, depending on the type of game, and both
    types can create great play experiences if properly done. Video games played on
    computers and consoles typically use more complex mechanics than games played
    on a cell phone or tablet, as they are more dependent on a computer''s processing
    speed. There are also several different types of mechanics at play in any given
    game. For example, the “Beginner''s Guide to Game Mechanics” at GameDesigning.org
    explains, Tetris (a game that can be played on multiple platforms) involves four
    different types of game mechanics:'
  merge: -1
  pgno: 20
- img_proc: true
  md: '+   1. Rotation system: Where the tetrominoes [puzzle pieces] spawn, in what
    position they spawn, how they rotate, and their wall kick (their position when
    you try to rotate on the edge). 2. Randomizers: The order/sequence in which the
    tetromino types spawn.

    3. Scoring Systems: The points you get for line clears, including back-to-back
    lines, combos, T-spins, etc. 4. Mobility: The player''s ability to manipulate
    the tetrominoes, including rotating, dropping, etc.


    The guide goes on to suggest that "if you''re an aspiring game designer, one of
    the best exercises you can do is take any game and to break it down into main
    game mechanics." This exercise helps would-be-designers understand exactly what
    any game tick and how they can begin to assemble complex or simple games of their
    own.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_21_0.png)


    # Education


    An ideal field of study for would-be game mechanics designers is computer science
    or video game design. Most colleges and universities of computer science degree
    programs. The top four schools for computer science, according to the U.S. News
    & World Report, are Carnegie Mellon University, the Massachusetts Institute of
    Technology, Stanford University, and the University of California, Berkeley, although
    there are other similar programs in universities throughout the United States.
    These four-year programs introduce students to the core concepts of game design,
    including classes in programming, story and character development, visual and
    sound design, and game engine development. Earning a degree in computer science
    exposes would-be-designers to information about various operating systems, programming
    concepts, input/output methods, and algorithms.


    Video game design programs are still few in number, but the best-known ones are
    at the Art Institute, the University of Southern California, Carnegie Mellon University,
    the University of Utah, and'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Rochester Institute of Technology. The University of Utah’s program boasts
    a strong relationship with EA Sports, headquartered in Salt Lake City. The Rochester
