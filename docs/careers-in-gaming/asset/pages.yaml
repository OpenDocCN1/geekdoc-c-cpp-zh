  md: '# Game Developer


    # What Does a Game Developer Do?


    Game developers (or game designers) wear many hats. The bulk of their job is to
    establish a game''s plot and develop its characters. Different types of games
    will necessarily have different types of plots and characters. For example, whereas
    first-person shooter games typically follow military or postapocalyptic story
    lines that require physical fighting to advance, quest games often involve solving
    puzzles to move forward in the game. The type of game characters usually dictates
    what


    kinds will appear, offering players different personalities with assorted traits
    that can help them succeed in the game. Game developers are responsible for designing
    different types of quests for players to embark upon, creating the levels for
    players to work through, writing story lines for characters to follow and dialogue
    for characters to say during the game, and even creating the mechanics of the
    game to make it run as planned. Developers are, ultimately, responsible for designing
    everything from characters to puzzles to art and animation. According to an Eurocom
    interview with Pete Low, a game designer at Chunk,


    At a Glance:

    Game Developer

    Minimum Educational Requirements

    Bachelor''s or associate''s degree

    Personal Qualities

    Creativity and storytelling skills; problem-solving ability; team player; strong
    communication skills

    Working Conditions

    Indoors

    Salary Range

    About $58,253 to $100,690

    Number of Jobs

    As of 2014 about 1.1 million

    Future Job Outlook

    Growth rate of 14 percent or higher through 2024'
