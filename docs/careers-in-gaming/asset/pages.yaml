    “Developers get hundreds of suggestions nearly every day from forum posts, Twitter
    posts, posts on their Facebook pages, sent via in-game support tickets, etc. The
    vast majority of these ''suggestions'' are just players complaining without providing
    any sort of suggestion on how to fix the thing they don''t like.


    Being able to successfully keep cool under pressure is also an important component
    in video game testing. Testers are required to play through the same portions
    of a game over and over again, particularly as crunch time (the lead-up to the
    game''s release date) occurs. Testers may also be subjected to eighty-hour workweeks
    during this period in order to make sure the game releases on time. Since the
    tester''s feedback on a game is critical to its success, the pressure can sometimes
    be overwhelming. The tester''s job is an invaluable one, making sure that the
    consumer''s game play experience is the best it can possibly be.


    ![](img/5ffb35298ffd34b0969fe596ba9f5b27_69_0.png)


