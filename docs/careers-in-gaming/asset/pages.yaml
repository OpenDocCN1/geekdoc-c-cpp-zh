- img_proc: true
  md: 'testers must also be patient, methodical, and able to work on their own without
    direct supervision. Testers should be analytical, with the ability to discover
    problems and offer possible solutions. They also need to have strong written and
    oral communication skills to describe problems clearly and accurately to other
    team members. It can also be helpful for testers to analyze problems from a developer''s
    or designer''s point of view as well as using a gamer''s mind-set. The best testers
    have a good understanding of how the entire game development process works.


    At times, working as a quality assurance tester can be a thankless job. When gamers
    discover glitches, their reports and complaints end up with testers. Sometimes
    these reports help testers identify missed glitches, but sometimes they are just
    avid gamers spouting off about features of the game that they do not like. Patience—and
    the ability to not take criticism personally—are helpful traits in a game tester.
    On a 2015 “Ask Me Anything” question-answer forum on the social media website
