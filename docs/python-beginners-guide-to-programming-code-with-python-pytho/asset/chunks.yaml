    There are four primary concepts within object-oriented programming that we need
    to discuss more in-depth. These are inheritance, polymorphism, abstraction, and
    encapsulation. Python provides for all of these, and very well at that.


    Inheritance is the notion of deriving a class and things from within that class
    into another child class. There’s a very simple way to explain this concept. Classes
    can break down into other more specific classes. For example, Roscoe is an animal.
    But he’s also a dog. A dog is a type of animal. Shouldn’t Roscoe be a dog and
