    \ 提供了所有这些，并且做得非常好。\n\n继承是将一个类从另一个类派生出类的概念。这里有一个非常简单的方法可以解释这一点。类可以细分为更具体的类。例如，Roscoe\
    \ 是一个动物。但他也是一只狗。狗是动物的一种类型。难道 Roscoe 不应该是狗而不是动物吗？我们如何处理这个问题？\n\n这样想吧：每只狗都是动物，但不是每个动物都是狗。所以我们可以进一步细分动物类。我们通过继承从一个类派生另一个类。这就是如何声明一个继承动物类的狗类。所有的狗都有\
