    # Chapter 2:


    ![image](d2d_images/chapter_title_below.png)


    ## Python Variables, Math, and Comments


    WHEN YOU WERE YOUNGER, you probably took a basic algebra class where you’d have
    to work with equations like `y = mx + b`. You could actually fill in these letters
    with other values in order to give you `y`. These values were called variables.


    Variables in programming are somewhat similar. Variables are ways to give a name
    to a value so that you can use it throughout your program. Variables aren’t restricted
    to numbers, though.


    Go back to your `first.py` file and a few lines above your `print` statements,
    type the following, with your name in the quotations:


    ```

    name = “John Doe”

    ```


    Afterwards, go back to the line which says “My name is [your name]” and rewrite
    it to be the following:


    ```

    print “my name is ” + name

    ```


    Then save and run it in console. It should say “my name is “ along with whatever
    you wrote in the quotations. Go ahead and modify the string some more, add a y,
    do whatever you want to do to it really, then save and execute it again.


    The way that variables work is that they store a value to a name. Python makes
    working with variables very, very easy compared to other languages. Since it’s
    a scripting language, it’s rather straightforward with the way that it allows
    you to type variables. Scripting languages are intended to have you up-and-running
    as soon as possible and waste as little time as possible, staying out of your
    way while you create your program.


    The variable we just created is called a “string”, which is a set of characters.
    Every time you print something to the console, you’re printing out a string. If
    you’re only printing out string values, you can use the `+` in order to concatenate
    the strings, which is a fancy word meaning put them together. In order to properly
    include other kinds of variables in your code, however, you need to use a formatted
    string.


    ```

    print “my name is %s” % name

    ```


    There are a number of formatted types you can use, but for right now, just remember
    that:


    - `%s`-prints a string

    - `%d`-prints a base-10 number

    - `%f`-prints a float

    - `%r`-prints the raw data of the variable (used for debugging)


    As I just implied, there are more kinds of variables beyond strings that you can
    use. Let’s do some work with numbers. Create a new script. I’m going to call mine
    `fruit.py`. In Atom, you do this by right-clicking the sidebar where your files
    are listed and clicking “New file”. When it prompts you for the path, you can
    simply type the file name.


    Firstly, there’s a type of variable called an integer in other languages which
    is essentially a whole number. Let’s say that you had four apples and your friend
