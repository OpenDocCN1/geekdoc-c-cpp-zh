    # Chapter 4:


    ![image](d2d_images/chapter_title_below.png)


    Lists and Loops


    IT’S A LITTLE UNCOMMON to put these two concepts in the same chapter, but I’m
    trying to be brief and they really do go hand in hand.


    We’ve talked about variables, sure. But variables can only hold a single value.
    What if you had multiple values that you wanted to put in something? This is where
    lists come in handy.


    Lists in Python are very straightforward.


    Let’s say that we wanted to create a list of our favorite TV shows. We could do
    this like so:


    favoriteShows = [‘Breaking Bad’, ‘Narcos’, ‘House of Cards’]


    These are all different elements in a list which starts counting at 0\. You can
    also access the lists rather simply.


    If you were to type the following:


    print favoriteShows[0]


    Then it would print out the first element of the list, here being Breaking Bad.


    You can also enter data into a list rather simply! Lists have a built in function
    called “append()” which allows you to add data to the list, like so:


    listExample.append(raw_input())


    This would take the user’s input and add it to the function. (It’s also an example
    of calling a function as an argument of a function, which makes no sense at all
    right now but hopefully will in the next chapter!)


    You can actually declare empty lists to be used, as well. You’d do so by declaring
    the variable and setting it with empty brackets, like this:


    emptyList = []


    From here, you could add elements to the list and start to use it like you would
    any other list.


    To move to the next portion of the lesson and get off the whole list tangent,
    we should talk about loops. Loops are an integral part of many programs. They
    serve a great many purposes, but at their most basic level they’re simply a way
    for a chunk of code within a program to repeat multiple times, most likely changing
    in one way or another each time.


    There are three main kinds of loops in Python: while, for, and do...while. All
    of these have their own particular uses that they’re tailored for.


    While loops are the most simple, they execute over and over for as long as a given
    condition still comes back as true, and that’s all there really is to it.


    Observe the following code:


    dogs = 0


    while (dogs <= 10):


    print “There are %d dogs in the yard!”


    dogs += 1


    print “Wow! That’s a lot of dogs!”


    Can you guess what’s happening here? We declared a variable called dogs and we
    set it to 0\. We then started the while loop, giving it a condition. While the
    variable dogs is less than or equal to 10, we want to run this loop. Every iteration
    of this loop will print “There are x dogs in the yard!”, and the loop increments
    every single time.


    For loops are similar to while loops, but they automatically increment over a
    set of data, such as the lists we were talking about earlier.


    You don’t necessarily have to iterate over lists. Python has a built-in range
    function that lets you iterate through a certain number of variables. For example,
    a for loop iterating through range(5) would iterate 5 times, from 0 to 4\. Let’s
    use this to count to 5.


    Here’s an example of that for loop:


    for i in range(5):


    print “%d” % (i + 1)


    Simple enough, right? Not too hard at all. We can also iterate through lists like
    earlier. If we wanted to print out every TV show on our list from earlier, we
    could do something like:


    print “My favorite shows are: “


    for i in favoriteShows:


    print “%s” % i


    The i is what’s called a loop variable, and in Python, it assumes the type of
    whatever your list is made of. Since lists can hold mixed values (even at once),
    this is great and super important.


    Let’s actually start working with this and combining a lot of the concepts that
    we’ve worked on.


    Create a new file, call it what you like but I’m going to call mine bookList.py.


    The first thing that we’re going to do is create an empty list of books and a
    boolean called running set to True.


    bookList = []


    running = True


    Now what we’re going to do is create something called a running loop. This is
    to show you a way that while loops can be used.


    We’re going to create a loop that runs for as long as the variable “running” is
    true.


    while running == True:


    The first thing we’re going to do within the loop is prompt the user to add a
    book, list the current books, or exit the program. We’re going to want to compare
    the response to other things, so we need to set it to a variable.


    userInput = raw_input(“Book List v1.\nType \”add\” to add a book, \”list\” to
    list the books, or \”exit\” to exit the program: ”)


    Now we need to parse the input and compare it. First, we’re going to see if the
    user wanted to add a book, and add a book if they did:


    if userInput.lower() == “add”:


    userInput = raw_input(“Enter the name of the book: \n”)


    bookList.append(userInput)


    Perfect. There’s actually a way to simplify that line by just passing the function
    “raw_input(‘...’)” to bookList.append, but I wanted to show you that you can append
    any variable to your list.


    Now we’re going to determine what happens if the user entered “list”, which should
    be checking to see if the list is empty and printing out its contents if not:


    elif userInput.lower() == “list”:


    if not bookList: # this is shorthand for “if the bookList is empty”


    print “The list is empty!\n”


    else:


    for i in bookList:


    print “%s\n” % i # prints everything on the list'
