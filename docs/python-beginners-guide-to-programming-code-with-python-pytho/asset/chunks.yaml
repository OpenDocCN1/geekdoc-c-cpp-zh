  trans: "\n还有一种变量叫做浮点数（floating-point），它们本质上是小数。这并不完全符合“苹果”的逻辑，但你可以这样声明一个浮点数变量：\n\
    \n```python\npercentageOfMyFriendThatRolfIsFollowingOurArgumentAboutApples = 0.3\n\
    ```\n\n你可能会问，为什么在关于苹果的争论之后，Rolf 还是我的 .3 朋友？让我用代码向你解释一下：\n\n```python\npercentageOfMyFriendThatRolfIsFollowingOurArgumentAboutApples\
    \ = 0.3\n```\n\n# Rolf 仍然是我 30% 的朋友，因为他让我借了他的卡车搬家。\n\n哇！这是什么？嗯，它的技术名称是井号（octothorpe），但也被称为“hash”（hash）或“磅号”（pound\
    \ sign）。它被用于引导代码中的注释。注释是代码的一部分，编译器在准备你的代码供计算机读取时会忽略这些部分。\n\n你可以反复放置这些符号，编译器会忽略它们——这对于在代码中间插入诗歌休息简直太棒了。\n\
    \n```python\nprint “Oh, what a beautiful morning!”\n\n# Rolf, by Allen Ginsberg\n\
    \n# I saw the best minds of my generation destroyed by madness,\n\n# starving,\
    \ hysterical, naked,\n\nprint “What a time to be alive!”\n```\n\n编译器只会看到两个 `print`\
    \ 语句，而忽略 20 世纪 50 年代比特派诗歌对社会的毒舌。（不要真的在代码中间写诗歌休息，这是不受欢迎的。）\n\n你也可以在代码之后之后这些符号，编译器会忽略该行的剩余部分。\n\
    \n```python\nprint “Rolf is my friend!” # just kidding\n```\n\n注释如果使用得当，是绝对良性的工具，并可以帮助陌生人（包括未来的你偶然发现旧代码时）理解你正试图通过某段代码表达的什么。\n\
    \n然而，请避免频繁地使用它们。过度使用注释会让代码读起来令人反胃，而且代码通常应该是自解释自懂的。\n\n在我们处理 `print` 语句时，还有最后一件事。我们现在不会经常使用它，但之后会用到，而且值得了解：转义序列（escape\
    \ sequences）。这些是你可以在 Python 中用来修改文本的内容。\n\n第一个也是最主要的例子是换行转义序列——`\\n`。它用于指定字符串有一个换行符。尝试打印以下内容：\n\
    \n```python\nprint “Hello\\nworld\\nHow are you?”\n```\n\n保存并运行此程序。它应该跨多行打印。\n\
    \n另一个你可以使用的是 `\\t` 转义序列，它在两个字符之间或行首处放置一个制表符：\n\n```python\nprint “I have:\\n\\\
    t%d boxes of strawberries,\\n\\t%d apples, \\n\\t and %d peaches.” % (2, 3, 4)\n\
    ```\n\n还有其他几个转义字符。例如，如果你需要在字符串内编写单引号或双引号，你有两种选择：\n\n用三引号包裹整个内容，如下所示：\n\n```python\n\
    “””He said “see you tomorrow,” and that’s all.”””\n```\n\n或者对它们进行转义，如下所示：\n\n\
    ```python\n“He said \\”see you tomorrow,\\” and that’s all.”\n```\n\n反斜线也是如此——你必须对它们进行转义。这些是你将要使用的，但简单的\
    \ Google 搜索就能找到其他的。它们通常非常冷门，仅对特定的程序调试或类似情况有用。作为一个只是试图熟悉该语言的新手程序员，你不会发现它们有多大用。尽管如此，我不会束缚你，如果你是一个富有创造力或有实验精神的人，你可能可以通过尝试其他转义字符获得一些有趣的结果和输出。尽管去尝试吧。\n\
    \n回顾本章，我们涵盖了变量和数学的基础。这些是编程的巨大巅峰，如果你真的打算继续学习编程，那么尽可能地理解它们是至关重要的，因为它们以某种方式构成了程序将执行的每项主要操作的核心。但在完成所有这些之后，现在是时候进入条件和循环的广阔世界了，在那里你将开始接触到\
    \ Python 那些专横的但其实相当古怪的缩进规则。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 3 章：\n\n![image](img/chapter_title_below.png)\n\n## 条件与布尔值\n\n之前，我们讨论了比较运算符以及如何使用它们来判断语言中的语句是真是假。这是我们进入任何给定程序底层最大的概念之一的地方。如果事情总是能让你预知某件事或另一件事，那么这个世界将会完全不同。然而，事实并非如此，有时你必须评估一种状况，做出判断，然后对该条件做出决策。\n\
    \n这类情况通常非常严肃，需要你做出最大的反应。例如，如果你的朋友 Rolf（他不懂基本的苹果算术）正尝试登录你的电脑，你会希望电脑告诉他走开。那么，我们该怎么做呢？（我们在这个脚本中使用第一个命令来接受用户输入，所以也请做好相应准备。）\n\
    \n创建一个新脚本。随你怎么起名——我会把我的命名为 `login.py`。\n\n我们想创建几个名为 `username` 和 `password` 的变量。将\
    \ `username` 和 `password` 设置为任何你想要的。\n\n要求用户输入他们的用户名，如下：\n\n```python\nuserInput\
    \ = raw_input(“What is your username? ”)\n```\n\n现在我们将施展魔法，让 Python 决定他们是否输入了描述的用户名。\n\
    \n```python\nif userInput == username:\n    userInput = raw_input“Password? “\n\
    else:\n    print “You entered the incorrect username.”\n```\n\n我们很快就会涉及到 `else`\
    \ 部分，但现在，只需保存并尝试运行它。先通过输入错误的用户名进行测试，然后再次运行程序并输入正确的用户名。如果一切顺利，你将看到正确的响应。\n\n现在让我们聊聊这里发生了什么。\n\
    \n这被称为 `if/else` 语句，是 Python 中（以及大多数编程语言）中最基础的条件判断形式。\n\n发生的是你给它一个语句，它评估该语句的真假，然后根据真假采取行动。\n\
    \n在上面的代码块中发生的是，它评估 `userInput`（我们刚刚让用户输入的字符串）是否与 `username` 相同。如果是，它会提示用户密码。如果不是，它会告诉他们输入的用户名错误。很简单对吧？\n\
    \n但我们对 Rolf 先生确实有个人恩怨，所以我们应该将其包含在代码中。但我的意思是，我们已经有一个完整的 `if` 语句了，对吧？\n\n错误！还有另一种方法，叫做\
    \ `else if`。看这个：\n\n```python\nif userInput == username:\n    userInput = raw_input“Password?\
    \ “\nelif userInput == “rolf” or userInput == “Rolf” or userInput == “ROLF”:\n\
    \    print “这台电脑没有 Rolf 的位置。”\nelse:\n    print “You have entered the incorrect\
    \ username.”\n```\n\n这评估 `userInput` 以查看用户名是否为“Rolf”或任何变体。字符串比较本质上是对大小写敏感的，所以“ROlf”不等于“ROLf”。如何修复这个问题？\n\
    \n嗯，我们可以通过将 else-if 行更改为如下，同时解决大小写敏感问题并使代码更优雅。\n\n```python\nelif userInput.lower()\
    \ == “rolf”:\n```\n\n这会将 `userInput` 变量转换为小写。我们现在只需将其与小写的“rolf”进行比较，问题就解决了。\n\n\
    你可能注意到了那个 `or`，它可能让你措手不及。那被称为布尔运算符。\n\nPython 中三个主要的布尔运算符：`and`、`or` 和 `not`。\n"
- fmt: "\n“And” is used to check two conditions and see if they both return true.\
    \ If either returns false, then the whole thing returns false. So to use the apple\
    \ values from the last script, if we were to write this:\n\n```python\nif myApples\
    \ == 5 and friendApples == 6:\n```\n\nIt’d come back as true. However, if even\
    \ one of those weren’t true, the whole thing would return false.\n\n“Or” is similar,\
    \ but it checks to see if either condition or expression is true. If even one\
    \ is true, the whole thing comes back true.\n\n“Not” checks to see if a boolean/condition/expression\
    \ is not true. For the sake of illustration and exposition, you can actually put\
    \ a single boolean variable into an if-statement, because an if statement only\
    \ checks to see if whatever following it is true.\n\nIf you had a variable called\
    \ `IAmCool` which is set to `True`, and you typed:\n\n```python\nif IAmCool:\n\
    \    print “I am cool”\n```\n\nIt would actually print “I am cool”, because the\
    \ if-statement sees that as a true statement. Following?\n\nNow, if `IAmCool`\
    \ were set to `False` because the only thing stronger than your self-deprecating\
    \ sense of humor is your will to teach yourself various programming languages,\
    \ and you instead of `if IAmCool` typed this:\n\n```python\nif not IAmCool:\n\
    \    print “I am not cool”\n```\n\nIt would check to see if `IAmCool` were false.\n\
    \nSo between `if`, `else if`, and `else` statements, you’ve got a pretty solid\
    \ chunk of conditional decision making under wraps.\n\nLet’s go back to that code\
    \ we had just a moment ago.\n\n```python\nif userInput == username:\n    userInput\
    \ = raw_input(“Password? “)\nelif userInput.lower() == “rolf”:\n    print “There\
    \ is no room on this computer for Rolf.”\nelse:\n    print “You have entered the\
    \ incorrect username.”\n```\n\nWe got the username, and it was right. Where do\
    \ we go from here?\n\nThis is where we start to utilize a concept known as nested\
    \ conditional statements. You can put an if-statement within an if-statement!\n\
    \nThis is your time to shine, friend. After prompting for the password, write\
    \ another if-statement within that if-statement, as well as an else statement.\
    \ You need to compare `userInput` to your variable `password` and see if they’re\
    \ the same. If they are, you need to welcome the user; if they aren’t, you need\
    \ to tell them that they’ve entered the wrong password.\n\nBy the end, your code\
    \ should look like this:\n\n```python\nif userInput == username:\n    userInput\
    \ = raw_input(\"Password? \")\n    if userInput == password:\n        print \"\
    Welcome!\"\n    else:\n        print \"That's the wrong password.\"\nelif [...]\n\
    ```\n\nIf it does, then you succeeded.\n\n# Chapter 4: Lists and Loops\n\nIT’S\
    \ A LITTLE UNCOMMON to put these two concepts in the same chapter, but I’m trying\
    \ to be brief and they really do go hand in hand.\n\nWe’ve talked about variables,\
    \ sure. But variables can only hold a single value. What if you had multiple values\
    \ that you wanted to put in something? This is where lists come in handy.\n\n\
    Lists in Python are very straightforward.\n\nLet’s say that we wanted to create\
    \ a list of our favorite TV shows. We could do this like so:\n\n```python\nfavoriteShows\
    \ = [‘Breaking Bad’, ‘Narcos’, ‘House of Cards’]\n```\n\nThese are all different\
    \ elements in a list which starts counting at `0`. You can also access the lists\
    \ rather simply.\n\nIf you were to type the following:\n\n```python\nprint favoriteShows[0]\n\
    ```\n\nThen it would print out the first element of the list, here being Breaking\
    \ Bad.\n\nYou can also enter data into a list rather simply! Lists have a built\
    \ in function called `append()` which allows you to add data to the list, like\
    \ so:\n\n```python\nlistExample.append(raw_input())\n```\n\nThis would take the\
    \ user’s input and add it to the function. (It’s also an example of calling a\
    \ function as an argument of a function, which makes no sense at all right now\
    \ but hopefully will in the next chapter!)\n\nYou can actually declare empty lists\
    \ to be used, as well. You’d do so by declaring the variable and setting it with\
    \ empty brackets, like this:\n\n```python\nemptyList = []\n```\n\nFrom here, you\
    \ could add elements to the list and start to use it like you would any other\
    \ list.\n\nTo move to the next portion of the lesson and get off the whole list\
    \ tangent, we should talk about loops. Loops are an integral part of many programs.\
    \ They serve a great many purposes, but at their most basic level they’re simply\
    \ a way for a chunk of code within a program to repeat multiple times, most likely\
    \ changing in one way or another each time.\n\nThere are three main kinds of loops\
    \ in Python: `while`, `for`, and `do...while`. All of these have their own particular\
    \ uses that they’re tailored for.\n\nWhile loops are the most simple, they execute\
    \ over and over for as long as a given condition still comes back as true, and\
    \ that’s all there really is to it.\n\nObserve the following code:\n\n```python\n\
    dogs = 0\nwhile (dogs <= 10):\n    print “There are %d dogs in the yard!”\n  \
    \  dogs += 1\nprint “Wow! That’s a lot of dogs!”\n```\n\nCan you guess what’s\
    \ happening here? We declared a variable `dogs` and set it to `0`. We then started\
    \ the `while` loop. While `dogs` is less than or equal to `10`, we want to run\
    \ this. Every iteration of the loop increments `dogs`.\n\nFor loops are similar\
    \ to while loops, but they automatically iterate over a set of data. Python has\
    \ a built-in `range()` function that lets you iterate a certain number. For example,\
    \ `range(5)` would iterate 5 times.\n\n```python\nfor i in range(5):\n    print\
    \ “%d” % (i + 1)\n```\n\nSimple enough, right? Not too hard at all. We can also\
    \ iterate through lists. If we wanted to print out every show on our list, we\
    \ could do something like:\n\n```python\nprint “My favorite shows: “\nfor i in\
    \ favoriteShows:\n    print “%s” % i\n```\n\n`i` is what is called a loop variable,\
    \ and in Python, it assumes the type of whatever list is made of. Since lists\
    \ can hold mixed values (even at once), this is great and super important.\n\n\
    Let’s actually start working with this and combining a lot of the concepts we’ve\
    \ worked on. Create a new file, call it what you like but I’m going to call mine\
    \ `bookList.py`.\n\nThe first thing that we’re going to do is create an empty\
    \ list and a boolean `running` set to `True`.\n\n```python\nbookList = []\nrunning\
    \ = True\n```\n\nNow what we’re going to do is create something called a running\
    \ loop. This is to show you a way that while loops can be used. We’re going to\
    \ create a loop that runs for as long as the variable `running` is true.\n\n```python\n\
    while running == True:\n```\n\nThe first thing we’re going to do within the loop\
    \ is to prompt the user to add a book, list the current books, or exit the program.\
    \ We’re going to want to compare the response to other things, so we need to set\
    \ it to a variable.\n\n```python\nuserInput = raw_input(“Book List v1.\\nType\
    \ add to add a book, list to list the books, or exit to exit the program: ”)\n\
    ```\n\nNow we need to parse the input and compare it. First, we’re going to see\
    \ if the user wanted to add a book, and add a book if they did:\n\n```python\n\
    if userInput.lower() == “add”:\n    userInput = raw_input(“Enter the name of the\
