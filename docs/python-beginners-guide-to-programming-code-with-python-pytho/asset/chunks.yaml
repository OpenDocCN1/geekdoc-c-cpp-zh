    File I/O


    ALRIGHT, LET’S PUT the bookList away for a second, we’ll come back to it momentarily
    after talking about file input/output and string manipulation, once we finally
    get to the chapter on object-oriented programming. For now, it’s time to talk
    about reading and writing files.


    There’ll be many times in your programming career (or hobby) that you’ll need
    to read or write data to a file. There are a crazy amount of applications for
    this, as well. If you were designing a game, you could save your player’s progress.
    We could use it in our book list in order to export a list of books (intense foreshadowing.)
    Even the word processor I’m writing this on needs to export and import data from
    files constantly.


    So how exactly do we do this in Python?


    Python, like many other things, makes reading from and writing to a file relatively
    painless.


    First what you’d have to do is open the file and give the value of said file to
    a variable, like so:


    file1 = open(‘example’, mode)


    Mode can be many things. w for writing to a file only, a for appending to existing
    files, r+ for reading and writing, and r to only be read. The mode part may be
    omitted, and if it is, then it will be assumed you are only reading the file.


    Once the file is open, there are a few methods that you can use.


    file1.read(size), where size is optional. If size is included, it will read size
    amount of data and return it as a string, which you could assign to a variable
    or print or whatever, really. If you exclude size, it will read over the entire
    file and return the entire thing.


    file1.readline() reads only a single line from a file, which can be very useful
    for certain applications where you need to feed data into a list or something
    along those lines.'
