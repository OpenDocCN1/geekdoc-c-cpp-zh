    # 第 1 章：孵化你的 Python


    ![image](img/chapter_title_below.png)


    Python 是当今最流行的语言之一，它无处不在。Python 是一门非常出色的语言，不仅简单，而且功能强大。


    在学习 Python 之前，你需要确保你的电脑上安装了它。我们将从基础概念开始，帮助你创建真实世界的应用程序。


    在学习 Python 之前，你需要学习一门编程语言。Python 是一门优异的语言，可以用于从服务器到视频游戏的各种领域。


    学习 Python 对你来说将是一个巨大的机会。虽然它很简单，但它非常强大。


    为了使用 Python，你需要先设置它。你可以在 Windows、Mac 和 Linux 上进行设置。


    为了设置 Python，你首先需要一个文本编辑器。有很多可供选择：我个人将使用 `Atom`，你可以从 `atom.io` 下载。`Notepad++` 和
    `Sublime Text` 也是很好的选择。


    有了文本编辑器后，你需要确保已安装了 Python。进入 `Terminal`（Windows 下为 `Powershell`）并尝试运行 `python`
    命令。如果 Python 未安装（显示类似无法识别 `python` 命令的信息），你需要安装它。


    为了安装它，你需要访问 `Python.org` 并根据相应平台下载 `2.7.12`。


    安装完成后，再次确保它运行正常——应该是正常的。


    现在我们将编写编写并运行你的第一个程序。


    进入你的文本编辑器创建一个新文件。在开始编写代码之前保存它，这样你就可以可以使用语法高亮，这对你有很大帮助。你可以以后以任何喜欢的名称保存，但出于本例的需要，你需要将其保存为
    `first.py`。


    在文本文件中输入以下：


    ```

    print “hello world”

    ```


    然后回到你的 `Terminal` 或 `PowerShell` 并导航到保存文件的位置。


    通过以下命令运行它：


    ```bash

    python first.py

    ```


    '
- fmt: '

    What happens? It should run perfectly and print out “hello world” to the console.


    Now let’s go back and change that text file a bit more. Let’s add a few lines.


    ```

    print “hello world”

    print “my name is [type your name here]“

    print “it’s nice to meet you”

    ```


    Save the file and execute it again. It should print across multiple lines.


    Awesome! We’re done with your very first program. We’re going to be messing with
    this file a little in the coming chapters in order to teach you important fundamentals
    of Python.


