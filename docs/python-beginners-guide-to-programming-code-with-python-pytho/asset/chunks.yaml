  raw: 'There’s one more type of variable called floating-point, which is essentially
    decimal numbers. This doesn’t fit terribly well into the idea of apples, but you’d
    declare a float variable like this:


    percentageOfMyFriendThatRolfIsFollowingOurArgumentAboutApples = 0.3


    You may be asking why Rolf is still .3 my friend after an argument about apples.
    Allow me to explain in code:


    percentageOfMyFriendThatRolfIsFollowingOurArgumentAboutApples = 0.3


    # Rolf is still 30% my friend because he let me borrow his truck to move.


    Whoa! What’s this? Well, the technical name is an octothorpe, but it’s also called
    a “hash” and the “pound sign”. But it’s used to lead off comments in your code.
    Comments are parts of your code that the compiler ignores when it’s preparing
    your code to be read for the computer.


    You can place these over and over and the compiler will ignore them - fantastic
    for mid-code poetry breaks.


    print “Oh, what a beautiful morning!”


    # Howl, by Allen Ginsberg


    # I saw the best minds of my generation destroyed by madness,


    # starving, hysterical, naked,


    print “What a time to be alive!”


    The compiler will only see the two print statements and ignore the society-questioning
    vitriol of 1950s Beat poetry. (Don’t actually take mid-code poetry breaks, it’s
    frowned upon.)


    You can also use these after a line of code, and the compiler will ignore the
    rest of the line.


    print “Rolf is my friend!” # just kidding


    Comments, used sparingly, are a tool for absolute good and can help strangers
    (including yourself in the future when you stumble upon old code) to understand
    what you’re trying to get at with any given chunk of code.


    Avoid, however, using them too often. Overuse of comments makes code nauseating
    to read, and code should generally be self-explanatory anyway.


    One last thing while we’re working with print statements. We aren’t going to use
    it too much right now, but it will come up later, and it’s worth knowing: escape
    sequences. These are things you can use in Python in order to modify your text.


    The first and foremost example is the newline escape sequence - “\n”. This is
    used to designate that a string has a line break. Try printing the following:


    print “Hello\nworld\nHow are you?”


    Save and run this program. It should print across multiple lines.


    Another thing you can use is the \t escape sequence, which places a tab between
    two characters, or at the beginning of a line:


    print “I have:\n\t%d boxes of strawberries,\n\t%d apples, \n\t and %d peaches.”
    % (2, 3, 4)


    There are a few other escape characters. For example, if you need to write a single-quote
    or double-quote within a string, you have two options:


    Encase the whole thing in triple quotes, like so:


    “””He said “see you tomorrow,” and that’s all.”””


    Or escape them, like so:


    “He said \”see you tomorrow,\” and that’s all.”


    The same goes for backslashes - you have to escape them. These are the primary
    ones you’ll be using, but a simple Google search will turn up the rest. They’re
    generally very niche and are only useful for certain situations specific to program
    debugging or something along those lines. As a novice programmer just trying to
    find your way around the language, you won’t find much use for them. That said,
    I won’t stifle you, and if you’re a creative or experimental person, you can probably
    get some fun results and outputs out of playing around with the other escape characters.
    By all means, do it.


    To recap this chapter, we covered the essentials of variables and math. Those
    are massive pinnacles of programming, and it’s imperative that you understand
    them as much as possible if you’re really intending to go forward with programming
    because they make up the bulk of every major action your program will perform
    in one way or another. But with all of that done, it’s now time to jump into the
    wide, wide world of conditionals and loops, where you will start to be exposed
    to Python’s despotic indentation rules that are actually rather quaint.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


