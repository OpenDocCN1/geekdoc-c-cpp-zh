    the animal class. All dogs have 4 legs aside (for the most part), so we can declare
    that ahead of time and manually change it if a dog ever doesn’t have 4 legs.


    class Dog(Animal):


    def __init__(self, name):


    self.name = name


    self.legs = 4


    The way that this works is that the Dog class is an extension of the Animal class.
    The Dog class receives all the functions and variables of the dog class, so we
    don’t have to redefine them.


    This also means that if we were to erase our first line and re-declare Roscoe
    more accurately as a dog, we could still declare sleep. Observe.


