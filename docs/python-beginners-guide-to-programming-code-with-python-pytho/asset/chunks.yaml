    Python is ultimately derived from a language called `C`, and the `C` programming
    language would go onto inspire a huge number of languages - not only `Python`,
    but also `C++`, `Java`, `Lua`, `Go`, `D`, `R`, `Ruby`, and so many more. This
    book was intended to teach you the underlying concepts so that you’re not restricted
    by any given programming language, because programming languages are much the
    same across one or another. The important thing is that you understand the underlying
    concepts - control flow, objects, input and output, manipulating variables - so
    that you can produce the end result that you want.


    I hope you found this book to be a useful and fantastic starting place as a Python
    learner and hopeful programmer, whether you’re programming for your career or
    programming simply as a hobby.


    ![Charlie Masterson](d2d_images/ata_image.jpg)


    # About the Author


    Charlie Masterson is a computer programmer and instructor who has developed several
    applications and computer programs.


    As a computer science student, he got interested in programming early but got
    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop his
    programming skills. He soon discovered a teaching series that made him learn faster
    and better.


    Applying the same approach, Charlie successfully learned different programming
    languages and is now teaching the subject matter through writing books.


    With the books that he writes on computer programming, he hopes to provide great
    value and help readers interested to learn computer-related topics.

