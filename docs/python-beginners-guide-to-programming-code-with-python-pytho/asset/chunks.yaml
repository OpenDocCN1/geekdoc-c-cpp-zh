    \n## Functions\n\nFUNCTIONS ARE AN INTEGRAL part of any given programming language.\
    \ They supply a way to define something that’s supposed to happen and may have\
    \ to happen many times or basic functions of the program in general, and reuse\
    \ that chunk of code as often as you need to. They also allow you to modify existing\
    \ values and work with variables that you already have.\n\nThe basic breakdown\
    \ of a function in pseudocode is like this:\n\n```python\nfunction(parameter1,\
    \ parameter2, etc...) {\n    do things\n}\n```\n\nAnd it will normally be called\
    \ within your main portion of code or from other functions like so:\n\n```python\n\
    function(variable1, variable2)\n```\n\nFunctions can be used to massively simplify\
    \ abrasively verbose code and make it much easier to understand, while at the\
    \ same time making it more modular and reusable.\n\nSo how do you work with functions\
    \ in Python? They follow a very simple structure.\n\nIn order to declare a function\
    \ in Python, you simply type:\n\n```python\ndef functionName(arguments):\n   \
    \ code here\n```\n\nThat’s really all that there is to it. The parameters that\
    \ you define for a function can be used within the body of that function’s code.\
    \ When you call the function later on, you can put any values of the same type\
    \ in the place. The best way to explain it is that the parameters you use in your\
    \ function definition are hypothetical, and are intended to be replaced with actual\
    \ values.\n\nIf we wanted to code a function which was to take the length and\
    \ width of a rectangle, find the area, and return that value, we could do it like\
    \ this:\n\n```python\ndef findArea(length, width):\n    return length * width\n\
    ```\n\nYou could then call this later in your code. You can use actual values,\
    \ like so:\n\n```python\narea = findArea(4, 6) # “area” would have the value of\
    \ 24\n```\n\nOr you can use already existent variables in order to call the function.\n\
    \n```python\nl = 6\nw = 3\narea = findArea(l, w) # “area” would have the value\
    \ of 18\n```\n\nYou can even use other functions as arguments, since every function\
    \ simply returns a value.\n\n```python\ndef add(number1, number2):\n    return\
    \ number1 + number2\n\ndef findArea(length, width):\n    return length * width\n\
    \narea = findArea(4, add(2,2))\n```\n\nThis code would first do the `add` function\
    \ which would return the value `4`, then multiply the return value of the `add`\
    \ function by the first argument (`4`). It would ultimately return the value of\
    \ `16`.\n\nSo the question now is, how can we use functions in order to pretty\
    \ up our existing code and make it more functional? Let’s go back to our `bookList`\
    \ code. It’s perfectly functional, right? But looking at it is a mess. Let’s give\
    \ functions to our `addBook` and `listBook` functions, and make them a little\
    \ bit more, well, functional while we’re at it. \n\nSo let’s look at the if statement\
    \ for adding a book.\n\n```python\nif userInput.lower() == “add”:\n    userInput\
    \ = raw_input(“Enter the name of the book.\\n”\n    bookList.append(userInput)\n\
    ```\n\nWhat we want to do is make this so it’s simpler, like so:\n\n```python\n\
    if userInput.lower90 == “add”:\n    addBook(bookList)\n```\n\nHere’s how we’d\
    \ do this. Functions have to be declared and defined before you call them. You\
    \ can do it anywhere before. I’m going to do it at the beginning right after our\
    \ `variableList`.\n\n```python\ndef addBook(bList):\n    userInput = raw_input(“Enter\
    \ the name of the book you’d like to add.\\n”)\n    bList.append(userInput)\n\
    ```\n\nYou could have named the variable `bList` anything, even `bookList` - the\
    \ reason I didn’t name it `bookList` for simplicity’s sake is in order to drive\
    \ home the point that function parameters are only hypothetical values that you\
    \ replace with real values when you call them.\n\nNow if we replace our current\
    \ if-statement with this:\n\n```python\nif userInput.lower() == “add”:\n    addBook(bookList)\n\
    ```\n\nIt should work perfectly fine.\n\nNow we need to add a function which will\
    \ allow us to list the books. This is going to be much the same: we need to send\
