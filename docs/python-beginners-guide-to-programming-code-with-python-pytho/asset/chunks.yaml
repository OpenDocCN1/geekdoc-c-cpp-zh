    # Chapter 1:


    # Hatching Your Python


    ![image](d2d_images/chapter_title_below.png)


    PYTHON IS ONE OF THE most popular programming languages out there today, full
    stop. There are few languages as prolific as Python has become. Python is a beautiful
    and multi-purpose language which can be found everywhere from on web servers to
    running video games to being the powerhouse behind popular applications.


    Learning Python is a huge boon to you as a person in several ways. The largest
    is, of course, you’re learning a programming language. Learning a programming
    language in general opens up a huge number of possibilities for the things which
    you can do with a computer. It can be a career skill and a hobby, too.


    Python in particular is a fantastic language to learn because it can be used for
    a multitude of things. It’s simple enough for beginners to grasp easily and, though
    simple, it’s incredibly powerful.


    In order to use Python, you need to set it up. You can set up Python on Windows,
    Mac, and Linux. For the purposes of this book, I personally will be using a Linux
    system, but the instructions should be relatively straightforward and apply to
    every operating system.


    In order to set up Python, you first need to grab a text editor. Many will work
    and many are out there indeed: I personally will be using Atom, which you can
    download from the website atom.io. Notepad++ and Sublime Text are also fantastic
    options.


    After you’ve got your text editor, you need to check to be sure you have Python
    installed. Go to your Terminal (or Powershell in Windows) and try to run the command
    python. If Python isn’t installed (it says something along the lines of command
    “python” not recognized), then you need to install it.


    In order to install it, you need to go to Python.org and grab Python 2.7.12 for
    your respective platform.


    After it’s installed, make sure it’s working again - it should be.


    You’re going to be using your Terminal/PowerShell to navigate and execute files,
    so you need to know how to navigate using those. If you don’t know, I highly suggest
    doing a Google search on the topic. There are a ton of very simple tutorials on
    the subject, but for brevity’s sake, I’d like to avoid going to in-depth on extraneous
    things as such.


    Now we’re going to work on writing and running your first program.


    Go into your text editor and create a new file. Save it before you even start
    writing code, because then you’ll have access to syntax highlighting which will
    help you out a fair amount. You can save it under whatever name you’d like going
    forward, but for the purpose of this example, you need to save it as first.py.


    In the text file, type the following:


    print “hello world”


    Then head back to your Terminal or PowerShell and navigate to where you saved
    the file.


    Run it by the following command:


    python first.py'
