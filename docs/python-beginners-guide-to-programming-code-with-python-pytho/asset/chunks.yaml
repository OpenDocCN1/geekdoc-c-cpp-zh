    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    THANK YOU FOR MAKING it through to the end of the book, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    they may be.


    The next step is to use this knowledge to your advantage. Do something with it.
    You can absolutely use this book as a reference, but it wasn’t written to necessarily
    be one - this book was written in order to teach you the essence of programming
    and everything that you need to do to start programming in Python, as well as
    the essential tools of the language that you’ll have to know how to use as a beginner.


    Python has a ton of support and is immensely popular, so you can find a way to
    use it for whatever you may need to do. For example, for game programming, there
    is the PyGame library.


    Ultimately this book was written with the goal in mind of teaching you not necessarily
    about Python, but programming at large. Programming is a science, yet it is also
    an art - it’s a form of self-expression, of manipulating computer bytecode in
    order to get the end result you desire out of your brain and onto the computer
    screen. Python is just one means by which you can accomplish this goal.'
