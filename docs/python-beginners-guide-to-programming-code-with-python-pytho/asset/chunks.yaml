    # Chapter 3:


    ![image](d2d_images/chapter_title_below.png)


    Conditionals and Booleans


    EARLIER ON, WE TALKED about comparison operators and how they could be used to
    determine whether a statement within a language was true or false. This is where
    we get into one of the biggest concepts underlying any given program. If things
    were such that you always knew one thing or another, the world would be a very
    different place. However, this really isn’t the case, and there are times where
    you have to evaluate a situation, make a determination, and then make a decision
    regarding that condition.


    These kinds of situations are often very serious and demand your utmost response.
    For example, if your friend Rolf, who doesn’t understand basic apple arithmetic,
    were trying to log into your computer, you would want it to tell him to go away.
    So how would we go about this? (We’re going to use our first command to accept
    user input in this script, so saddle in for that as well.)


    Create a new script. Call it what you like - I’ll be calling mine login.py.


    We want to create a few variables called username and password. Set username and
    password to anything that you want.


    Ask the user to enter their username, like so:


    userInput = raw_input(“What is your username? ”)


    Now we’re going to work some magic and have Python decide whether they entered
    the described username or not.


    if userInput == username:


    userInput = raw_input(“Password? “)


    else:


    print “You entered the incorrect username.”


    We’re going to get to the else part in a second, but for now, just save this and
    try to run it. Test it by entering the wrong username first, then run the program
    again and enter the correct username. If all goes well, you’ll see the proper
    responses.


    Now let’s talk about what’s happening here.


    This is called an if/else statement, and is the most basic form of conditional
    decision making within Python (and most programming languages, for that matter.)


    What happens is that you give it a statement that it evaluates the truthfulness
    of a given statement and then takes action based off of whether or not the statement
    was true.


    What is occurring in that chunk of code up there is that it’s evaluating whether
    or not userInput—which is the string that we just had the user enter—is the same
    as “username”. If it is, then it prompts the user for their password. If it isn’t,
    then it tells them that they entered the wrong username. Simple enough, right?


    But we do have that personal vendetta against Mr. Rolf, so we should probably
    include that within our code. But how? I mean, we’ve already got a completed if
    statement, right?


    Wrong! There’s another thing we can do, called an else if. Check this out:


    if userInput == username:


    userInput = raw_input(“Password? “)


    elif userInput == “rolf” or userInput == “Rolf” or userInput == “ROLF”:


    print “There is no room on this computer for Rolf.”


    else:


    print “You have entered the incorrect username.”


    This evaluates the userInput to see if the username is “Rolf” or any variant thereof.
    String comparison is innately case-sensitive, so “ROlf” would not be equal to
    “ROLf”. How can we fix this?


    Well, we can simultaneously fix the case-sensitivity issue and make the code more
    elegant by changing our else-if line to the following.


    elif userInput.lower() == “rolf”:


    This converts whatever the userInput variable is to lower-case. We can now simply
    compare it to lower-case “rolf” and the issue would be fixed.


    You may have noticed the little “or”, and it might have caught you off guard.
    That’s called a boolean operator.


    There are three primary boolean operators in Python: and, or, and not.'
