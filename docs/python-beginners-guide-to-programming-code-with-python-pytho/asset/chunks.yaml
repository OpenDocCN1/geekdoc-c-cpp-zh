    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    CONGRATULATIONS ON downloading Python: Beginner’s Guide to Programming Code with
    Python and thanks for doing so.


    The following chapters will discuss the Python programming language, how to get
    started, and how to program in Python - starting at the most simple concepts and
    helping you to create real world applications by the end of the book.


    I say it a lot near the end, but it’s only because it’s true: programming is the
    apex of self-expression for a great number of people. There are a great many things
    you can accomplish using Python, and an even greater number of things if you’re
    looking at the big picture of the all-encompassing everything of computers and
    programming.


    We’re going to help you get set and get on the path to being the best programmer
    that you can possibly be. Even if you’re an absolute and total novice, you’ll
    find this book easy to comprehend and work through, as well as engaging enough
    to not be an absolute and total bore as some programming books can very much be.


    All in all, there are many things to be said about Python, and we may just scratch
    the surface - but that surface will be enough to prepare you for any and everything
    you will encounter going forward in the language. 


    That is to say, there are plenty of books on this subject on the market, thanks
    again for choosing this one! Every effort was made to ensure it is full of as
    much useful information as possible, please enjoy!


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
