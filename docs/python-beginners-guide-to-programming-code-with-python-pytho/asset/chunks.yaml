    Functions


    FUNCTIONS ARE AN INTEGRAL part of any given programming language. They supply
    a way to define something that’s supposed to happen and may have to happen many
    times or basic functions of the program in general, and reuse that chunk of code
    as often as you need to. They also allow you to modify existing values and work
    with variables that you already have.


    The basic breakdown of a function in pseudocode is like this:


    function(parameter1, parameter2, etc...) {


    do things


    }


    And it will normally be called within your main portion of code or from other
    functions like so:


    function(variable1, variable2)


    Functions can be used to massively simplify abrasively verbose code and make it
    much easier to understand, while at the same time making it more modular and reusable.


    So how do you work with functions in Python? They follow a very simple structure.


    In order to declare a function in Python, you simply type:


    def functionName(arguments):


    code here


    That’s really all that there is to it. The parameters that you define for a function
    can be used within the body of that function’s code. When you call the function
    later on, you can put any values of the same type in the place. The best way to
    explain it is that the parameters you use in your function definition are hypothetical,
    and are intended to be replaced with actual values.


    If we wanted to code a function which was to take the length and width of a rectangle,
    find the area, and return that value, we could do it like this:


    def findArea(length, width):


    return length * width


    You could then call this later in your code. You can use actual values, like so:


    area = findArea(4, 6) # “area” would have the value of 24


    Or you can use already existent variables in order to call the function.


    l = 6


    w = 3


    area = findArea(l, w) # “area” would have the value of 18


    You can even use other functions as arguments, since every function simply returns
    a value.


    def add(number1, number2):


    return number1 + number2


    def findArea(length, width):


    return length * width


    area = findArea(4, add(2,2))


    This code would first do the add function which would return the value 4, then
    multiply the return value of the add function by the first argument (4). It would
    ultimately return the value of 16.


    So the question now is, how can we use functions in order to pretty up our existing
    code and make it more functional? Let’s go back to our bookList code. It’s perfectly
    functional, right? But looking at it is a mess. Let’s give functions to our addBook
    and listBook functions, and make them a little bit more, well, functional while
    we’re at it. 


    So let’s look at the if statement for adding a book.


    if userInput.lower() == “add”:


    userInput = raw_input(“Enter the name of the book.\n”


    bookList.append(userInput)


    What we want to do is make this so it’s simpler, like so:


    if userInput.lower90 == “add”:


    addBook(bookList)


    Here’s how we’d do this. Functions have to be declared and defined before you
    call them. You can do it anywhere before. I’m going to do it at the beginning
    right after our variableList.


    def addBook(bList):


    userInput = raw_input(“Enter the name of the book you’d like to add.\n”)


    bList.append(userInput)


    You could have named the variable bList anything, even bookList - the reason I
    didn’t name it bookList for simplicity’s sake is in order to drive home the point
    that function parameters are only hypothetical values that you replace with real
    values when you call them.


    Now if we replace our current if-statement with this:


    if userInput.lower() == “add”:


    addBook(bookList)


    It should work perfectly fine.


    Now we need to add a function which will allow us to list the books. This is 
    going to be much the same: we need to send it our list, bookList, and have it
    read it off. First we need to define it. I’m putting it right after our last function:


    def listBooks(listOfBooks):


    Now we need to transfer our logic over.


    def listBooks(listOfBooks):


    if not listOfBooks:


    print “The list is empty!\n”


    else:


    for i in listOfBooks:


    print “%s\n” % i


    After that, we can go back to our if-statement and replace the ugly code with
    the far more elegant:


    elif userInput.lower() == “list”:


    listBooks(bookList)


    Save and run your code to ensure that it works. It should go just fine. By the
    end, it should look a bit like this:


    bookList = []


    running = True


    def addBook(bList):


    userInput = raw_input("Enter the name of the book you''d like to add.\n")


    bList.append(userInput)


    def listBooks(listOfBooks):


    if not listOfBooks:


    print "The list is empty!\n"


    else:


    for i in listOfBooks:


    print "%s\n" % i


    while running == True:


    userInput = raw_input("Book List v1.\nType \"add\" to add a book, \"list\" to
    list the books, or \"exit\" to exit\n")


    if userInput.lower() == "add":


    addBook(bookList)


    elif userInput.lower() == "list":


    listBooks(bookList)


    elif userInput.lower() == "exit":


    running = False


    else:


    print "The command was invalid!\n"


    Notice how much cleaner and easier to read that our primary code is, starting
    at the run loop and going to the end of the program.


