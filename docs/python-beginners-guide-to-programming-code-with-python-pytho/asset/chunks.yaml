    This program has hopefully helped you to understand how we can synthesize a lot
    of the concepts that we’ve covered so far. I also hope that it helped you to understand
    a bit more the relation between classes and objects. There are certainly far more
    confusing things in the language, but object-oriented concepts as such can be
    a little difficult to comprehend anyway.


    Having gone through the major concepts and facets of the language, we’ve covered
    the bulk of the important things that there are to cover. At this point, I’d like
    to drive home how important of a resource the internet can be. Programming can
    be something that will make you want to tear your hair out at times. Admittedly,
    Python is an easier language, and even better, the compiler can be very informational,
    especially compared to other languages such as C++ or C where the compiler can
    be very confusing.


    There will always be something you don’t know in the world of programming, and
    when you’re starting out, the list is endless. For practical purposes, there’s
    only so much that I can cover in the relatively limited scope of a beginner book.
    However, there are also more answers than you can ever imagine. The beautiful
    thing about programming is that everything has a solution somewhere. Often, it’ll
    already be developed in an API or module somewhere. When it’s not, it’s ultimately
    possible. The beauty of programming is that it’s an incredible way to express
    yourself, and if something can be done, it can be done on a computer. Computers
    break down in a very, very simple way to sequences of 1s and 0s and computations
    that are performed constantly, but in that simplicity is an endless amount of
    extrapolated complexity.


    We may have written a relatively simple program. But the concepts contained therein
    will underlie a lot of the concepts that you may work with going forward while
    working with any other program or programming language.


    And at the end of the day, if nothing else, you can say that you’ve written a
    really cool program to help you keep track of any and all books that you own,
    including this one. Isn’t that really a victory in and of itself?


