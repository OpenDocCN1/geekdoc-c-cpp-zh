    *   `>` – 此运算符检查两个操作数的值。如果左侧操作数的值大于右侧操作数的值，则条件为真。例如：`(y > x)` 为真。\n*   `<` – 此运算符是\
    \ `<` 的相反运算符。如果左侧操作数的值小于右侧操作数的值，则条件为真。例如：`(y < x)` 不为真。\n*   `!=` – 此运算符检查两个操作数之间的相等性。如果值不相等，则条件为真。例如：`(x\
    \ != y)` 为真。\n*   `<=` – 通过此运算符，你可以检查左侧操作数的值是否小于等于右侧操作数的值。如果是，则条件为真。例如：`(x <=\
    \ y)` 为真。\n*   `>=` – 在这里，你检查左侧操作数的值是否大于等于右侧操作数的值。如果是，则条件为真。例如：`(y >= x)` 为真。\n\
    \n## 杂项运算符\n\n在本节中，你将学习 C++ 提供的其他运算符：\n\n*   `sizeof` - 你应该使用此运算符来确定变量的大小。例如，`sizeof(x)`（其中\
    \ `x` 是整数）将给你 `4`。\n*   `Cast` – 此运算符允许你转换数据类型。\n*   `,` – 程序员将此称为“逗号运算符”。它在你的语句中激活一组操作。逗号表达式的值等于逗号分隔集合中的最后一项。\n\
    *   `.` 和 `->` – 这些运算符分别被称为“点”和“箭头”。你可以使用这些运算符引用联合体、类和结构的成员。\n*   `*` – 这被称为“指针”变量。例如：`*new;`\
    \ 将生成一个指向名为 `new` 变量的指针。\n*   `&` – 此运算符可以给出地址。\n*   `? :` – 运算符优先级\n\n运算符优先级决定了运算符执行的顺序。通常情况下，你必须使用它们来执行逐位操作。下方的截图显示了\
    \ `&`、`|` 和 `^` 的真值表。\n\n![](img/00017.jpeg)\n\n假设 `x = 60;` 且 `y = 13`。我们将这些值转换为二进制形式，将得到以下数据：\n\
    \n```\nx = 0011 1100\ny = 0000 1101\nx|y = 0011 1101\n~x = 1100 0011\nx&y = 0000\
    \ 1100\nx^y = 0011 0001\n```\n\n下表将显示 C++ 中可用的位运算符。假设 `x = 60` 且 `y = 13`。\n\n\
    *   `&` – 此运算符被称为“按位与”。如果两个操作数中都存在某个比特，按位与将将其复制到结果中。例如：`(x & y)` 产生 `12`（即 `0000\
    \ 1100`）。\n*   `^` – 这被称为“按位异或”。如果一个比特存在于一个操作数中但不同于另一个，它将复制该比特。`(x ^ y)` 得到 `49`，或\
    \ `0011 0001`。\n*   `|` – 程序员将此称为“按位或”运算符。它将复制存在于操作数之一的比特。例如：`(x | y)` 将给你 `61`，即\
    \ `0011 1101`。\n*   `>>` – 此运算符被称为“按位右移”。它根据右侧操作数提供的比特移动左侧操作数的值。例如：`x >> 2` 得到\
    \ `15`，即 `0000 1111`。\n*   `<<` – 这被称为“按位左移”。它根据右侧操作数提供的比特数移动左侧操作数的值。例如：`x <<\
    \ 2` 得到 `240`，即 `1111 0000`。\n*   `~` – 程序员将此称为“按位取反”。这是一个一元运算符。此外，它会“翻转”所作用的比特。例如：由于是符号数，如果以补码格式书写，`(~x)`\
    \ 得到 - 61，即 `1100 0011`。\n\n## 关系运算符\n\n本书的这一部分节将侧重于 C++ 编程语言中可用的关系运算符。假设 `x =\
    \ 2` 且 `y = 4`。\n\n第 9 章：循环类型\n\n在某些情况下，你可能需要重复代码块。C++ 提供了不同的结构：\n\n| 循环类型 | 定义\
    \ |\n| :--- | :--- |\n| for loop | 此循环类型执行一组语句。它也控制变量。 |\n| while loop | 此类型在指定条件为真时重复执行。\
    \ |\n| do… while loop | 这类似于 while loop。唯一的区别是“do… while loop”在执行体后检查条件。 |\n|\
    \ nested loop | 你可以在现有的“for”、“while”或“do… while”循环中放置循环。 |\n\n### while 循环\n\n\
    此循环类型在条件为真时重复执行语句。\n\n#### 语法\n\n这是 C++ while 循环的语法：\n\n```\nwhile (condition)\
    \ {\n    statement\n}\n```\n\n在此语法中，statement 可以单个语句或一组语句。另一方面，`condition` 可以采取任何\
    \ C++ 表达式的形式，且真是非零值。记住，只要条件为真，此循环就会重复选择的语句。\n\n#### while 循环图\n\n![](img/0020.jpeg)\n\
    \n根据此图，while 循环可能永远不会运行。如果条件为假，系统将忽略循环体并执行循环后的语句。\n\n#### for 循环\n\n这种循环结构帮助你高效地编写循环。这种循环类型在需要执行多次循环时特别有用。\n\
    \n这种循环类型的语法为：\n\n```\nfor (init; condition; increment) {\n    statement\n}\n```\n\
    \n以下列表解释了 `for 循环` 的控制流：\n\n1.  `init` – 系统首先执行此步骤（仅执行一次）。你可以使用这部分创建并激活用于控制的变量。\n\
    2.  `condition` – 在此部分，你必须指定要使用的条件。如果条件的结果为真，则执行循环体。然而，如果结果为假，循环体将被忽略。然后，系统将控制流传递到循环后的语句。\n\
    \n"
