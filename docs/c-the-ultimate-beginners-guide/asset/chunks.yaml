    我想感谢并祝贺你买了我的书……


    “C++：终极入门指南！”


    这本书是为想要学习 C++ 编程语言基础的人士编写的。如果你正在寻找一本能够教你关于 C++ 所需一切知识的综合书籍，这可能正是你寻找的内容。


    通过阅读这本书，你将学习 C++ 的基础知识。你将发现专家 C++ 程序员所使用的思想、概念、技术和方法。例如，本书将讨论变量、字符串、函数和数据结构。这意味着在阅读这些材料后，你将能够使用
    C++ 语言编写程序。


    再次感谢购买本书，希望你读得愉快！


    ## 第一章：C++ 编程语言 – 概述


    C++ 是一种编译型、自由格式的、大小敏感的、多用途的静态类型编程语言。它支持泛型、过程和面向对象的编程。


    计算机程序员将 C++ 视为一种中间级语言，因为它既具有低级特性具有高级特性。


    丹麦计算机科学家比雅恩·斯特斯特鲁普（Bjarne Stroustrup）于 1979 年创建了 C++。由于他将这种编程语言作为“C”（另一种计算机语言）的改进版本，因此他称其为“带有类的
    C”。然而，在 1983 年，名称更改为 C++。


    **重要提示：** 如果在编译期间进行类型检查，则该语言被认为是“静态类型”。


    ### C++ - 一种面向对象的编程语言


    C++ 兼容面向对象编程。它还支持面向对象软件开发的四大基础：


    - 继承

    - 封装

    - 多态

    - 数据隐藏


    ### C++ 的三个主要部分


    C++ 编程语言由三个大部分组成：


    1. 核心语言 – 这部分是 C++ 程序的基础。它包含了字面量、变量、运算符等。

    2. 标准库 – 这部分提供了广泛的函数，你可以使用它们来操作核心语言。

    3. 标准模板库（也称为 STL） – 它提供了许多可以配合 C++ 使用的方法和技术。


    ### 学习这种编程语言


    在学习 C++ 时，你应该专注于与编写代码相关的思想和概念。


    毕竟，你试图学习一种编程语言是因为你想成为一名优秀的程序员。你希望希望在维护旧程序和创建新程序方面是高效的。


    这种编程语言与广泛的编程技术兼容。你可以将其作为 C、Smalltalk、Fortran 等使用。无论你偏好哪种编程风格，你一定能实现创建优秀程序并保持运行效率的目标。


    ### 使用这种编程语言


    世界各地许多人都在使用 C++。这意味着它是可靠且有效的。事实上，C++ 是编程行业领先的语言之一。


    通常情况下，程序员在编写设备驱动程序和需要直接控制硬件的程序未使用 C++。研究人员和编程教师使用 C++ 来完成任务：这种语言强大且易用。即使是新手也能快速掌握这种语言的基础。


    根据计算机专家的说法，如果你的计算机运行在 Windows 或 macOS，你已经在使用 C++ 了。因为这些操作系统是用 C++ 编写的。


    ## 第二章：C++ 环境


    在阅读本书时，不需要建立自己的 C++ 环境。这是因为有很多工具可以用来编写和编译 C++。这些工具易于使用并且提供即时反馈。这意味着你可以迅速发现程序中的错误。最流行的在线工具之一是
    `www.compileonline.com`。在阅读本书时，你可以使用喜欢的浏览器访问该网站。


    为了帮助你开始，这里有一个你可以配合 `www.compileonline.com` 使用的基础代码：


    ```

    ![](img/cover.jpeg)

    ```


    你应该能立即看到结果。


    ### 本地 C++ 环境


    如果你仍然想为本地建立 C++ 环境，你的计算机必须具备以下程序：


    1. 文本编辑器 – 你将使用文本编辑器编写 C++ 程序。以下是 C++ 程序员常用的文本编辑器：`vi`、`vim`、`Brief`、`EMACS` 和
    Windows 记事本。


    文本编辑器的名称和版本可能会根据你的操作系统而变化。例如，记事本是 Windows 计算机的默认文本编辑器。然而，Vi 或 vim 适用于 UNIX、Linux
    和 Windows。


    你使用编辑器产生的源文件。在 C++ 语言中，这些文件以以下后缀命名：`.c`、`.cp` 或 `.cpp`。


    **重要提示：** 在本地使用 C++ 之前，确保你的计算机上有文本编辑器。没有这种计算机程序，你将无法编写任何 C++ 代码。


    2. C++ 编译器 – 它是 C++ 编程语言的实际编译器。你将使用该软件将源代码编译为可执行程序。


