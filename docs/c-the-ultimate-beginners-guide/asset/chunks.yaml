    What is a Loop Control Statement?


    A loop control statement can alter the execution of a loop’s body. Once the execution
    is altered, all of the automatic objects you created for the previous process
    will be destroyed.


    The C++ programming language supports these loop control statements:


    | The Control Statement | Definition |


    | goto statement | This statement can transfer the loop control to a targeted
    statement. You should not use this loop control statement in your C++ programs.
    |


    | continue statement | This statement can cause the loop to ignore the rest of
    its body and check the condition immediately before reiteration. |


    | break statement | Break statements can terminate the switch or loop statement
    and pass control to the C++ statement after the switch or loop. |


    Let’s discuss each loop control statement in detail:


    The “goto” Statement


    Basically, goto statements allow you to set unconditional jumps in your functions.


    Important Note: Often, it is extremely hard to trace the flow of program control
    when goto statements are being used. That means you might encounter problems in
    reading or modifying your C++ programs if you’ll use a goto statement. Because
    of this reason, you are advised to stay away from this loop control statement.


    Here is the syntax of a C++ goto statement:


    ![](images/00028.jpeg)


    In the syntax given above, label is the identifier that specifies your labeled
    statement/s. Here is the syntax of C++ goto statements:


    ![](images/00029.jpeg)


    The “continue” Statement


    Continue statements force the activation of a loop. They also ignore codes that
    may affect the loop’s functions.


    When it comes to for loops, this forced continuation executes the loop’s conditional
    check and increment parts. For while and do… while loops, however, control of
    the program is passed on to the conditional check.


    The syntax of C++ “continue” statements is:


    continue;


    Here is the flow diagram of continue statements:


    ![](images/00030.jpeg)


    The “break” Statement


    This statement serves two purposes in the C++ language:


    *   If the system encounters a break statement within a loop, that loop will be
    terminated. Then, program control will be passed on to the statement after the
    loop.


    *   You can use it to end a case in your switch statement (you’ll learn about
    it in the next chapter).


    For nested loops, break statements will terminate the innermost loop and execute
    the line after the code block.


    Here is the syntax of a C++ break statement:


    break;


    The Flow Diagram of a Break Statement


    ![](images/00031.jpeg)


    Infinite Loops


    Loops become infinite if their condition is always true. In general, programmers
    use for loops to achieve this goal. Since the expressions involved in a “for”
    loop are optional, you can create endless loops just by leaving the condition
    part empty. Here’s an example:


    ![](images/00032.jpeg)


    Conditional expressions are supposed to be true if they aren’t present. C++ users
    usually employ ‘for (;;)’ to represent infinite loops. However, you may include
    an increment and initialization expression in your C++ statements.


    Important Note: You can press Ctrl + C to terminate infinite loops.


    Chapter 10: The Decision-Making Statements in C++


    A decision making structure requires you to indicate conditions, which can be
    tested or evaluated by your C++ program. You should also provide statements that
    will be run based on the condition’s result (i.e. either true or false). The image
    below shows the basic structure of a normal decision-making statement in C++ programs:


    ![](images/00033.jpeg)


    The C++ language offers the following decision-making statements:


    | Name of Statement | Definition |


    | switch statement | This kind of statement allows you to test a variable’s equality
    against a group of values. |


    | if statement | Generally, an “if” statement involves a Boolean expression and
    one or more C++ statements. |


    | if… else statement | C++ allows you to place an “else” statement after an “if”
    statement. The “else” statement will run if the specified Boolean condition is
    false. |


    | nested switch statement | You may place a “switch” statement inside an existing
    “switch” statement. |


    | nested | You may place an “if” or “if else” statement inside an “if” or “if
    else” statement. |


    Let’s discuss each decision-making statement in detail:


    Switch Statements


    Switch statements allow you to check a variable’s equality against a set of values.
    These values are called cases – the variable you want to check will be compared
    with each case.


    The syntax of C++ switch statements is:


    ![](images/00034.jpeg)


    When working with a switch statement, there are certain rules that you need to
    remember. These rules are:


    *   The expression of your switch statement should be an enumerated or integral
    class type. Alternatively, it may belong to a type where classes have one conversion
    function to the enumerated or integral class types.


    *   C++ doesn’t have a limit regarding the amount of case statements that you
    can add into your switch. However, make sure that each case has a colon and a
    value you can compare to.


    *   The case’s constant-expression and switch’s variable must belong to the same
    type of data. Additionally, your constant-expression must be a literal.


    *   If the variable you’re switching on is equivalent to one of the cases, the
    statements after that case will run until the system reaches a break statement.


    *   Once the system reaches a break statement, the switch statement will stop.
    Then, the control flow will be passed on to the line after the switch.


    *   You don’t have to place a break statement in all of your cases. If a case
    doesn’t have break, the control flow will be passed on to the next cases until
    the system finds a break statement.


    *   You may add a default case to your switch statements. In C++, you should include
    the default case at the end of your statement. Programmers generally use default
    cases when they need to perform a task but all of the cases are false. Additionally,
    default cases don’t need break statements.


    The Flow Diagram of a Switch Statement


    ![](images/00035.jpeg)


    If Statements


    Basically, an “if” statement involves one Boolean expression and a statement or
    a group of statements.


    Here is the syntax of a C++ if statement:


