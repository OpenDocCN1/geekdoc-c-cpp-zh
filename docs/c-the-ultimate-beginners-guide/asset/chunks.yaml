  raw: 'In general, compilers are not sensitive in terms of the file extension that
    you use for your source codes. If you won’t specify the file extension, however,
    C++ compilers will assign .cpp (which is the default extension for this language).


    These days, the most popular compiler is the GNU C/C++ compiler.


    How to Install the GNU C/C++ Compiler


    *   For UNIX/Linux computers – First, check whether your machine has GCC (GNU
    Compiler Collection). You can do this by accessing the computer’s command line
    and entering this command:


    ![](images/00002.jpeg)


    If your computer has GCC, your screen should give you this kind of message:


    ![](images/00003.jpeg)


    If your computer doesn’t have GCC, you have to visit [http://gcc.gnu.org/install](http://gcc.gnu.org/install)
    to download and install it. The given webpage includes detailed instructions so
    you won’t experience any difficulties.


    *   For Macintosh computers – The quickest and easiest way to get GCC is by downloading
    the Xcode programming environment from the Apple website. Just follow the detailed
    instructions provided there. Here’s the link: [http://developer.apple.com/technologies/tools](http://developer.apple.com/technologies/tools).  


    *   For Windows computers – You have to download and install a program called
    MinGW. To do this, visit [www.mingw.org](http://www.mingw.org) and access the
    website’s download page. It would be best if you’ll get the latest version of
    MinGW.


    While getting MinGW, you should install these important programs: gcc-core, binutils,
    gcc-g++, and MinGW runtime. There are other supporting programs that you can download,
    depending on your situation and preferences.


    You should add MinGW’s bin subdirectory into the PATH environment variable. By
    doing so, you can activate the tools inside this subdirectory just by entering
    their basic names.


    After completing the installation process, your computer will let you to run GNU
    tools such as ar, gcc, g++, dlltool, and ranlib using the command line.


    Chapter 3: The Basic Syntax of the C++ Programming Language


    For computer experts, C++ programs are collections of objects that interact with
    each other by invoking methods. At this point, let’s discuss the basic elements
    of this language:


    *   Object – An object has different behaviors and states.


    *   Class – This is defined as a blueprint/template that defines the states/behaviors
    of an object.


    *   Method – Basically, this is the behavior of an object. Classes may contain
    various methods. A method is the part of the language where data is controlled,
    logic is written, and actions are performed.


    *   Instant Variable – Every object has a distinct collection of instant variables.
    The values given to the instant variables create that state/s of the object concerned.


    The Program Structure in C++


    Here’s a basic C++ code that prints “Hello World.”


    ![](images/00004.jpeg)


    Let’s analyze the different parts of this code:


    *   C++ involves different headers, which hold useful or necessary data to the
    program. In the code given above, the <iostream> header is required.


    *   using namespace std; - This line asks the C++ compiler to utilize the namespace
    called std.


    *   The third line (i.e. // main () is… begins.) is the comment section of this
    programming language. C++ comments start with two slashes (i.e. //).


    *   int main() serves as the primary function where execution of the program starts.


    *   The fifth line tells the screen to display “This is my first C++ program.”


    *   The last line (i.e. return 0;) ends the main() function and requires it to
    return “0” during the calling procedure.


    Compiling and Executing C++ Programs


    In this section of the book, you’ll learn how to compile and execute C++ programs.
    Here are the steps you need to take:


    1.  Access your favorite text editor and write the code. At this point, you may
    enter the “Hello World” code given above.


    2.  Save the code as a C++-compatible source file. For this exercise, use the
    filename: “helloworld.cpp”


    3.  Access a command prompt and check the location where you stored the source
    file.


    4.  Type in “g++ helloworld.cpp” and hit the Enter key – this action will compile
    the code. If your code doesn’t have any error, the command prompt will create
    an “a.out” file.


    5.  Then, run the program by typing “a.out”


    6.  Your computer will open a new window and show you the following message:


    ![](images/00005.jpeg)


    Important Note: You have to ensure that g++ is in the appropriate path. Also,
    make sure that it runs in the location where you saved the source file.


    Blocks and Semicolons in the C++ Language


    In this language, you should use a semicolon to terminate a statement. Thus, each
    statement in your C++ codes should end with this character. Semicolons indicate
    the end of a programming entity.


    For instance, here are four different C++ statements:


    *   a + b;


    *   add(a, b);


    *   b = a+1;


    *   a = b;


    Blocks, on the other hand, are sets of logically related statements that are enclosed
    by curly braces. Here’s an example:


    ![](images/00006.jpeg)


    This programming language doesn’t consider line endings as valid terminators.
    Thus, you don’t have to worry about the placement of your statements. The following
    example will illustrate this concept:


    a = b; b = b+1; add(a, b);


    is similar to


    a = b;


    b = b+1;


    add(a, b);


    The Identifiers of C++


    In this language, identifiers are names you use to identify classes, functions,
    modules, variables, or any user-defined object. Identifiers can start with a letter
    or an underscore. You may use numbers when naming identifiers, but you cannot
    use them as the initial character. Thus, “identifier1” is valid but “1identifier”
    is not.


    You cannot use punctuation and special characters (e.g. commas, periods, dollar
    signs, ampersands) when naming identifiers. Additionally, the C++ programming
    language is case-sensitive. That means “SCIENCE”, “Science”, and “science” are
    three different identifiers.


    The following list shows you several examples of valid identifiers:


    *   admin


    *   space_bar


    *   _perm


    *   z_000


    *   yourtitle23


    *   a


    *   z56a9


    *   GetVal


    The Keywords in C++


    Similar to other programming languages, C++ has a set of “reserved” keywords (i.e.
    words that cannot be used when naming variables, constants, and other identifiers).
    The table below will show you the keywords in the C++ language.


    | new | asm | try | for |


    | if | int | do | this |


    | else | enum | auto | true |


    | bool | case | char | goto |


    | void | long | throw | break |


    | false | catch | union | class |


    | short | const | using | while |


    | private | explicit | protected | export |


    | typedef | public | register | extern |


    | typeid | typename | reinterpret_cast | return |


    | unsigned | friend | signed | const_cast |


    | virtual | continue | sizeof | static |


    | default | inline | volatile | delete |


    | struct | static_cast | wchar_t | switch |


    | double | mutable | namespace | dynamic_cast |


    | template |  |  |  |


    The Trigraphs


    In this programming language, some character sets have an alternate representation,
    known as trigraph sequence. Trigraphs are sequences that involve three characters
    where each sequence represents a character. Additionally each trigraph sequence
    begins with “??”.


    Here are the most popular trigraph sequences in this language:


    | Trigraph Sequence | Replacement |


    | ??- | ~ |


    | ??< | { |


    | ??> | } |


    | ??! | &#124; |


    | ??( | [ |


    | ??) | ] |


    | ??= | # |


    | ??’ | ^ |


    | ??/ | \ |


    Important Note: Some C++ compilers are not compatible with trigraph sequences.
    Additionally, since these sequences are inherently complex, beginners are advised
    to stay away from them.


    Whitespace


    C++ compilers ignore lines that hold whitespace. These lines are known as blank
    lines.'
