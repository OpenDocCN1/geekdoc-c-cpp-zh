  raw: 'You’ll find variable declarations extremely useful when you have several available
    files and you specify a variable in one of them. You should use extern, another
    C++ keyword, when declaring a variable in your statements. This language allows
    you to declare the same variable several times in your program. However, you can
    only define it once in a function, file, or code block.


    Rvalues and Lvalues


    The C++ language supports two types of expressions:


    *   rvalue – This term refers to a value stored somewhere in the memory. Rvalues
    are expressions that cannot hold the value/s assigned to them. That means you
    may place an rvalue on the right-hand side, but never on the left-hand side, of
    your C++ statements.


    *   lvalue – These are expressions that point to a specific memory location. You
    can place lvalues on either side of your C++ statements.


    All variables are classified as lvalues. That means they can appear on the right-hand
    and left-hand side of your statements. Numeric literals, on the other hand, are
    considered as rvalues. That means they cannot be written on the left-side of a
    C++ statement.


    Chapter 5: The Scope of a Variable


    Basically, the term “scope” refers to a part of a C++ program. Here are three
    areas where you can declare variables:


    *   Outside the functions of your program. These variables are known as global
    variables since they can be accessed at any part of the program.


    *   Inside a block or function. Variables declared this way are known as local
    variables.


    *   Inside the definition of a function parameter. These parameters are known
    as formal parameters.


    In this section of the book, you’ll learn about the global and local variables.
    Formal parameters will be discussed in a later chapter.


    The Global Variables


    These variables are declared outside the functions. Typically, global variables
    are placed on the top section of C++ programs. Variables that belong to this type
    can store their value permanently.


    You may access global variables using any function; thus, you may utilize global
    variables at any part of your program.


    The Local Variables


    These variables are declared within a block or function. Since              these
    variables are placed within a certain function or code block, you can only use
    them for statements that are located in the same function or block. You cannot
    use local variables for external statements (i.e. statements stored outside the
    function or block of code).


    How to Initialize Global and Local Variables


    Once local variables are defined, the system won’t initialize them. That means
    you have to initialize them manually. On the other hand, the system initializes
    global variables automatically. Here are some valid data types and their corresponding
    initializer:


    | Data Type | The Initializer |


    | char | ‘\0’ |


    | int | o |


    | float | 0 |


    | pointer | NULL |


    | double | 0 |


    Important Note: While writing programs, you should initialize all of your variables
    properly. If you won’t, your programs might generate unexpected or unwanted results.


    Chapter 6: Literals/Constants


    The term “constant” refers to a fixed value that can prevent your program from
    making future alterations. This kind of value is also known as a literal.


    Important Note: C++ programs treat literals as ordinary variables. The only difference
    is that programs cannot modify these literals in any way.


    Literals can belong to any of the fundamental data types. Expert programmers divide
    these values into five major categories. These are:


    Boolean Values


    The C++ programming language has two Boolean constants, which are considered as
    keywords:


    *   false – A value that represents false.


    *   true – A value that represents true.


    Important Note: True is not equal to 1 and false is not equal to 0.


    Characters


    You should enclose character constants using single quotes. Constants that begin
    with L (uppercase) belong to the “wide character” category and must be stored
    inside a wchar_t variable. If your constant doesn’t begin with an uppercase L,
    on the other hand, it is considered as a narrow character and can be kept inside
    a simple char variable.


    Character constants can take the form of plain characters (e.g. ‘y’), universal
    characters (e.g. ‘\u01C0’), or escape sequences (e.g. ‘\n’).


    In the C++ programming language, some characters gain a special function if they
    are introduced by a backslash. These characters are known as sequence codes. Check
    the following examples:


    | The Escape Sequence | The Meaning |


    | \’ | Single quote |


    | \? | Question mark |


    | \” | Double quote |


    | \\ | Backslash |


    | \b | Backspace |


    | \f | Form feed |


    | \a | Bell or alert |


    | \n | Newline |


    | \000 | An octal number that has 1 – 3 digits |


    | \v | Vertical tab |


    | \r | Carriage return |


    | \xhh | Hexadecimal number |


    | \t | Horizontal tab |


    Strings


    You must enclose string constants using double quotes. Strings contain characters
    similar to that of character constants: escape sequences, universal characters,
    and plain characters.


    String constants allow you to divide long lines into smaller ones. If you’ll use
    this functionality, you should add whitespaces between the smaller lines to separate
    them.


    Floating-Point


    Floating-point constants have four parts: (1) exponent, (2) fraction, (3) integer,
    and (4) decimal point. You may represent these constants either in exponential
    or decimal form.


    When writing a floating-point literal in the decimal form, include the exponent,
    the decimal point, or both. When writing in the exponential form, on the other
    hand, you should include the fraction, the integer, or both. Introduce signed
    exponents using an E or e.


    Integers


    Integer constants can be octal, decimal, or hexadecimal literals. You should use
    a prefix to specify the radix (i.e. the base of the value) of these constants.
    Here are the integer constants and their corresponding prefix:


    *   Decimal Integers – nothing


    *   Octal Integers – o


    *   Hexadecimal Integers – oX


    The C++ language allows you to add L and/or U (L stands for long, U stands for
    unsigned) as suffix for your integer literals. These suffixes are not case-sensitive.
    Also, you can place them in any order.


    The list below will show you some integer constants:


    *   0xFalL                                          // Valid


    *   616                                                        // Valid


    *   615U                                                        // Valid


    *   049                                                        // Invalid - 9
    is not an octal number


    *   065                                                        // Invalid – You
    cannot repeat any suffix


    Here are some samples of valid Integer constants:


    *   65                                                                      //
    decimal


    *   0312                                                                     
    // octal


    *   20                                                                      //
    int


    *   20u                                                                      //
    unsigned int


    *   20ul                                                                     
    // unsigned long


    *   20l                                                                      //
    long


    How to Define a Constant


    In this programming language, you can define literals in two different ways:


    *   using const (a C++ keyword)


    *   using #define (a C++ preprocessor)


    What is #define?


    This preprocessor uses the following syntax while defining literals:


    ![](images/00011.jpeg)


    The example below will help you understand this preprocessor:


    ![](images/00012.jpeg)


    If you will compile and execute the code given above, you’ll get this result:
    50.


    What is const?


    Basically, const is a C++ keyword that you can use to declare literals with a
    particular type. Here is the syntax of this keyword:


    ![](images/00013.jpeg)


    Important Note: According to expert programmers, you should use capital letters
    when defining literals.'
