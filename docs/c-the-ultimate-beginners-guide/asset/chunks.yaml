    “if”语句的流程图如下：


    ![](img/00037.jpeg)


    ## If-Else 语句


    你可以在“if”语句之后包含一个“else”语句。这个可选的“else”语句会在布尔表达式的结果为假时运行。


    该语句的语法如下：


