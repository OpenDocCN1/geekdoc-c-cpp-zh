- fmt: '

    Whitespace is a word used in this language to describe tabs, blanks, comments,
    and newline characters. Basically, whitespaces allow you to divide your statements
    into smaller parts. In addition, they help compilers in identifying the beginning
    and end of code elements (e.g. `int`). Analyze the following examples:


    ```cpp

    int age;

    ```


    The statement given above requires a whitespace character between `age` and `int`.
    The C++ compiler won’t work properly if the statement is written without a whitespace
    character (i.e. `intage;`).


    ```cpp

    tree = leaves + wood;

    ```


    For the second example, you don’t have to place whitespace characters between
    `tree` and `=`, or between `=` and `leaves`. You can add whitespace characters
    to improve the readability of your C++ codes. However, these characters won’t
    affect the resulting programs.


    ## Comments in the C++ Language


    A program comment is an explanatory statement that you may add to your codes.
    Comments can help people read your source codes. In general, programming languages
    support comments to improve the usability of the resulting computer programs.


    This language allows you to place single- and multi-line comments in your codes.
    C++ compilers ignore characters that are placed in the code’s comment section.


    You should use `/*` to begin your comments and `*/` to terminate them. For instance:


    ```cpp

    /* This is an awesome comment */

    ```


    You may also use `//` to start your comments. Here’s an example:


    ![](images/00007.jpeg)


    C++ compilers will ignore the part that says “// prints Hello World”. The finished
    program will give you Hello World once it is executed.


    ## Chapter 4: The Different Data Types and Variable Types in C++


    ### Data Types


    Like other programming languages, C++ supports different types of data. That means
    you have a wide range of options when it comes to storing information. C++ also
    allows you to use various variables, which are memory locations designed to keep
    values. Thus, “creating a variable” is synonymous with “reserving some memory
    space.”


    While writing your C++ programs, you’ll need to store different data types (i.e.
    integer, Boolean, character, floating point, wide character, double floating point,
    etc.). Depending on the variable’s data type, the OS (i.e. operating system) of
    your computer allots memory and determines what kind of data can be stored inside
    that memory.


    ### The Primitive Types (Built-in)


    This programming language offers a collection of user-defined and built-in data
    types. Here are the major categories of data types in C++:


    | Data Type | Keyword |

    | :--- | :--- |

    | Integer | int |

    | Valueless | void |

    | Character | char |

    | Boolean | bool |

    | Wide character | wchar_t |

    | Double floating point | double |

    | floating point | float |


    You can modify the data types given above using these modifiers:


    * `short`

    * `long`

    * `unsigned`

    * `signed`


    ### The typedef Declaration


    You may use `typedef` to assign a new name to an existing data type. Here is the
    syntax that you should use when making a `typedef` declaration:


    ![](images/00008.jpeg)


    For instance, the following statement informs the C++ compiler that `head` is
    an alternative term for character:


    ```cpp

    typedef char head;

    ```


    Once you have executed that statement, the declaration below will be 100% valid
    and produce a character variable called `letters`:


    ```cpp

    head letters;

    ```


    ### The Enumerated Types


    Enumerated types declare an alternate type name and an array of identifiers. You
    may use these identifiers as values for the data type you are working with. All
    enumerators are constants whose data type is the given enumeration.


    To generate an enumeration, you should use `enum` (a C++ keyword). Here is the
    syntax that you should use:


    ![](images/00009.jpeg)


    In this syntax, “enum-name” represents the type name of the enumeration. You should
    use commas to separate the names inside the brackets.


    For instance, the code given below creates an enumeration called `sizes`, gives
    it three different sizes, and a variable (i.e. `c`) to determine the type size.
    Lastly, “large” is assigned to the `c`-variable.


    ```cpp

    enum sizes { small, medium, large } c;

    c = large;

    ```


    By default, the first name’s value is equal to 0, the second name’s value is equal
    to 1, the third name’s value is equal to 2, etc. However, you can add an initializer
    to assign a certain value to your selected names.


    For instance, in the enumeration given below, `medium` will get the value 100.


    ```cpp

    enum sizes { small, medium=100, large };

    ```


    A name’s value is 1 greater than the one before it. Thus, in the latest example,
    the value of `large` is equal to 101.


    ### Variable Types


    Variables provide you with storage that can be modified and controlled by your
    programs. Every variable belongs to a certain type, which states the following:


    * The layout and size of the memory space

    * The values that you can store inside the memory space

    * The operations that you can apply


    You may use the underscore, numbers and letters when naming a variable. However,
    you can’t use a number as the first character of the variable’s name. For example,
    `variable1` is valid but `1variable` isn’t. Additionally, this programming language
    is case-sensitive. That means `VARIABLE`, `Variable`, and `variable` are considered
    as three different entities.


    | Variable Type | Description |

    | :--- | :--- |

    | `int` | This is natural size. |

    | `bool` | This can store true or false. |

    | `void` | It represents the lack of variable. |

    | `char` | This is integer type. Often, it is represented as one byte. |

    | `float` | This is single single point. |

    | `wchar_t` | It represents wide characters. |

    | `double` | This variable type. |


    Additionally, the C++ programming language allows you to define other variable
    types using certain tools (e.g. classes, array, etc.). The next part of the book
    will explain how you can describe, declare, and utilize different types.


    #### How to Define Variables in C++


    By defining a variable, you are informing the C++ compiler regarding the location
    and storage space you want to use for the variable. Your variable definitions
    specify the data type, and hold a list of the variables that belong to that type.
    Here’s the syntax:


    ```cpp

    type variable_list;

    ```


    In this syntax, `type` should be a C++-compatible data type (e.g. `int`, `bool`,
    `float`). The `variable_list`, on the other hand, might hold single or multiple
    identifiers. If you have more than one, separate the entries using commas. Here
    are some legitimate declarations:


    ```cpp

    int a, z;

    double y;

    char x, a;

    ```


    The section `int a, z, x;` both defines and declares the variables `a`, `z`, and
    `k`; this tells the C++ compiler to generate variables named `a`, `z`, and `k`
    that belongs to the `int` type.


    You may initialize (i.e. assign a value to a variable) your variables during the
    declaration phase. The initializers in C++ have two main parts: (1) an equal sign,
    and (2) a constant expression. Here’s the syntax:


    ![](images/0010.jpeg)


    Here are some initializers:


    ```cpp

    int x = 4, z = 10;

    byte a = 99;

    char b = ''b'';

    ```


    #### How to Declare Variables in C++


    Variable declarations assure the C++ compiler that a variable exists with the
    specified name and type. That means the language compiler can complete the compilation
    process without having to perform further analysis regarding the variable. Variable
    declarations have their meaning during the compile-time only.

