    ### Functions


    | `double tan(double);` | 使用此函数，你可以通过将角度作为 double 类型来获取其正切值。 |

    | `double cos(double);` | 它允许你通过将任何角度作为 double 类型来获取余弦。 |

    | `double log(double);` | 通过使用此函数，你可以确定一个数的自然对数。 |

    | `double sin(double);` | 此函数允许你获取角度的正弦值。 |

    | `double sqrt(double);` | 你可以通过将任何数字传递给此函数来获取平方根。 |

    | `double pow(double, double);` | 此函数有两个元素：(1) 你想要求幂的数，(2) 你想要计算的幂次。 |

    | `int abs(int);` | 使用此函数，你可以获取整数的绝对值。 |

    | `double hypot(double, double);` | 此函数允许你获取直角三角形斜边的长度。但是，你必须提供另外两条边的长度。 |

    | `double floor(double);` | 此函数寻找一个小于或等于给定参数的整数。 |

    | `double fabs(double);` | 使用此函数，你可以获取小数的绝对值。 |


    # 第 13 章：C++ 数组


    这种编程语言提供了“数组”，这是一种数据结构。数组存储了一组属于相同类型的顺序元素。程序员使用数组来存储数据组，尽管将数组视为一组相同类型的变量集合会更有益。


    与其逐一个地声明变量（例如 `number1`、`number2`、`number3` 等），你可以声明一个数组变量（例如 `number`），并使用 `number[1]`、`number[2]`、`number[3]`
    等来表示变量。你可以使用索引访问数组内部的元素。


    每个数组都具有相邻的内存位置。最低的内存位置指向数组中的第一个对象，而最高的内存位置则指向最后一个对象。


    ## 如何声明数组


    在声明数组时，你应该指定数组中所需的元素类型和数量。以下是你应该使用的语法：


    ![](img/00045.jpeg)


    这种数组被称为“一维”数组。你的数组的“arraySize”部分应该包含一个大于零的整数字面量。另一方面，“type”部分应该包含 C++ 支持的任何数据类型。例如，你应该使用下面的语句来声明一个包含
    10 个元素的数组。该数组名为 `balance`，数据类型为 `double`。


    ![](img/00046.jpeg)


    ## 如何初始化数组


    在 C++ 语言中，你可以通过两种方式初始化数组元素：(1) 单独地，或者 (2) 通过单个 C++ 语句（见下例）。


    ![](img/00047.jpeg)


    大括号之间的值必须小于或等于你在括号内声明元素数量。


    ## 如何访问数组元素


    可以通过索引数组名称来访问数组元素。要这样做，在数组名称后的括号内输入元素的索引。


    ## 与数组相关的不同 C++ 概念


    数组在用 C++ 编写程序起着巨大的作用。因此，你应该熟悉它们。下面的列表显示了 C++ 语言中最重要的数组相关概念。作为 C++ 用户，你必须掌握以下概念：


    | 概念 | 解释 |

    | :--- | :--- |

    | 指向现有数组的指针 | C++ 允许你通过输入数组名称创建一个指向数组初始元素的指针。在这里，你不需要包含任何索引。 |

    | 多维数组 | 这种编程语言允许你创建多维数组。显然，二维数组是你可以创建的最基础的多维数组。 |

    | 将数组传递给函数 | 你可以将数组的指针传递给函数。要这样做，你只需要指定数组的名称。你不应该输入任何索引。 |

    | 从函数获取数组 | 在 C++ 中，你可以从函数检索数组。 |


    ## 结论


    我希望这本书能够帮助你学习 C++ 的基础知识。


    下一步是使用 C++ 编写你自己的计算机程序。


    你能帮我个忙吗？


    最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表积极的评价。我将不胜感激！


    感谢你并祝你好运！


