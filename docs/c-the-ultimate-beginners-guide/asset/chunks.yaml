    ### Functions


    | `double tan(double);` | With this function, you can get the tangent of an angle
    by taking it as a double. |

    | `double cos(double);` | It allows you to get the cosine by taking any angle
    as a double. |

    | `double log(double);` | By using this function, you can determine a number’s
    natural log. |

    | `double sin(double);` | This function allows you to get the sine of an angle.
    |

    | `double sqrt(double);` | You can get the square root of any number by passing
    it into this function. |

    | `double pow(double, double);` | This function has two elements: (1) the number
    you want to raise, and (2) the power you want to raise the number to. |

    | `int abs(int);` | With this function, you can get an integer’s absolute value.
    |

    | `double hypot(double, double);` | This function allows you to get the length
    of a right triangle’s hypotenuse. However, you must provide the length of the
    remaining sides. |

    | `double floor(double);` | This function searches for an integer that is lesser
    than or equal to the assigned argument. |

    | `double fabs(double);` | With this function, you can get a decimal number’s
    absolute value. |


    # Chapter 13: C++ Arrays


    This programming language offers the “array,” which is a data structure. Arrays
    keep a sequential set of elements that belong to the same type. Programmers use
    arrays to store groups of data, although it is more beneficial to consider arrays
    as sets of variables that belong to the same type.


    Rather than declaring variables one by one (e.g. `number1`, `number2`, `number3`,
    etc.), you may declare an array variable (e.g. `number`) and represent the variables
    using `number[1]`, `number[2]`, `number[3]`, etc. You can access elements inside
    an array using an index.


    Each array has adjacent memory locations. The lowest memory location links to
    the first object in the array while the highest memory location links to the final
    object.


    ## How to Declare an Array


    When declaring an array, you should specify the type and quantity of the elements
    needed in the array. Here’s the syntax that you should use:


    ![](images/00045.jpeg)


    This array is known as “single-dimension.” Your array’s “arraySize” section should
    hold an integer literal that is greater than zero. The “type” section, on the
    other hand, should contain any data type supported by C++. For instance, you should
    use the statement below to declare an array that holds 10 elements. This array
    is named `balance` and the data type is `double`.


    ![](images/00046.jpeg)


    ## How to Initialize an Array


    In the C++ language, you may initialize array elements in two ways: (1) individually,
    or (2) through a single C++ statement (see the example below).


    ![](images/00047.jpeg)


    The values between the curly braces must always be lower than or equal to the
    quantity of elements you declared inside the brackets.


    ## How to Access an Array Element


    You can access array elements by indexing the name of the array. To do this, enter
    the element’s index number inside the brackets after the array’s name.


    ## The Different C++ Concepts Related to Arrays


    Arrays play a huge part in using C++ for writing programs. Thus, you should be
    familiar with them. The list below shows the most important array-related concepts
    in the C++ language. As a C++ user, you have to master the following concepts:


    | Concept | Explanation |

    | :--- | :--- |

    | Pointers to existing arrays | C++ allows you to create a pointer to the array’s
    initial element just by entering the array’s name. Here, you don’t have to include
    any index. |

    | Multi-dimensional array | This programming language allows you to create multi-dimensional
    arrays. Obviously, two-dimensional arrays are the most basic multi-dimensional
    arrays you can create. |

    | Passing an array to a function | You may pass an array’s pointer to a function.
    To do this, you just have to specify the name of the array. You should not enter
    any index. |

    | Getting an array from a function | In C++, you can retrieve arrays from a function.
    |


    ## Conclusion


    I hope this book was able to help you learn the basics of C++.


    The next step is to use C++ in writing your own computer programs.


    Would you do me a favor?


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a positive review on Amazon. It’d be greatly appreciated!


    Thank you and good luck!

