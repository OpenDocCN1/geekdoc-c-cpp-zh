    空白符（Whitespace）是该语言中用于描述制表符、空格、注释和换行符的词。基本上，空白符允许你将语句拆分为更小的部分。此外，它们帮助编译器识别代码元素的开始和结束（例如
    `int`）。请分析以下示例：


    ```cpp

    int age;

    ```


    上述语句在 `age` 和 `int` 之间需要一个空白字符。如果语句在编写时没有空白字符（即 `intage;`），C++ 编译器将无法正常工作。


    ```cpp

    tree = leaves + wood;

    ```


    对于第二个示例，你不需要在 `tree` 和 `=` 之间，或在 `=` 和 `leaves` 之间放置空白字符。你可以添加空白字符来提高 C++ 代码的可读性。然而，这些字符不会影响最终生成的程序。


    ## C++ 语言中的注释


    程序注释是你可以添加到代码中的解释性语句。注释可以帮助人们理解阅读你的源代码。总的来说，编程语言支持注释以提高所生成的计算机程序的可用性。


    该语言允许你在代码中放置单行和多行注释。C++ 编译器会忽略放置在代码注释区域的字符。


    你应该使用 `/*` 开始注释，并使用 `*/` 结束注释。例如：


    ```cpp

    /* 这是一个非常棒的注释 */

    ```


    你也可以使用 `//` 来开始注释。这里有一个示例：


    ![](img/00007.jpeg)


    C++ 编译器将忽略“// prints Hello World”部分。完成后的程序一旦执行，将会为你输出 Hello World。


    ## 第 4 章：C++ 中不同的数据类型和变量类型


    ### 数据类型


    与其他编程语言一样，C++ 支持不同类型的数据。这意味着在涉及存储信息时，你有广泛的选择。C++ 还允许你使用各种变量，变量是设计用于保留数值的内存位置。因此，“创建一个变量”等同于“预留一些内存空间”。


    在编写 C++ 程序时，你需要存储不同类型的数据（即：整数、布尔值、字符、浮点数、宽字符、双精度浮点数等）。根据变量的数据类型，计算机的操作系统（即操作系统）会分配内存并决定在该内存中可以存储什么类型的数据。


    ### 原生类型（内置）


    这种编程语言提供了一系列用户定义和内置的数据类型。以下是 C++ 中数据类型的主要分类：


    | 数据类型 | 关键字 |

    | :--- | :--- |

    | 整数 | int |

    | 无值 | void |

    | 字符 | char |

    | 布尔值 | bool |

    | 宽字符 | wchar_t |

    | 双精度浮点数 | double |

    | 浮点数 | float |


    你可以使用这些修饰符修改上述数据类型：


    * `short`

    * `long`

    * `unsigned`

    * `signed`


    ### typedef 声明


    你可以使用 `typedef` 为现有的数据类型分配一个新名称。以下是你在进行 `typedef` 声明时应该使用的语法：


    ![](img/00008.jpeg)


    例如，以下语句告知 C++ 编译器 `head` 是字符的另一种备用术语：


    ```cpp

    typedef char head;

    ```


    一旦你执行了该语句，下面的声明将是 100% 有效的并产生一个名为 `letters` 的字符变量：


    ```cpp

    head letters;

    ```


    ### 枚举类型


    枚举类型声明了一个备用类型名和标识符数组。你可以使用这些标识符作为你正在处理的数据类型的值。所有枚举员都是常量，其数据类型为给定的枚举。


    要生成一个枚举，你应该使用 `enum`（一个 C++ 关键字）。以下是你应该使用的语法：


    ![](img/00009.jpeg)


    在此语法中，“enum-name”代表枚举的类型名。你应该使用逗号来分隔括号内的名称。


    例如，给下面的代码创建了一个名为 `sizes` 的枚举，给它赋予了三个不同的尺寸，以及一个变量（即 `c`）来确定类型的大小。最后，将“large”赋值给变量
    `c`。


    ```cpp

    enum sizes { small, medium, large } c;

    c = large;

    ```


    默认情况下，第一个名称的值等于 0，第二个名称的值等于 1，第三个名称的值等于 2，以此此类推。然而，你可以添加一个初始化器来为所选的名称分配特定的值。


    例如，在下面给出的枚举中，`medium` 将获得值 100。


    ```cpp

    enum sizes { small, medium=100, large };

    ```


    一个名称的值比前一个大 1。因此，在最新的示例中，`large` 的值等于 101。


    ### 变量类型


    变量提供了可以由你的程序修改和控制的存储。每个变量都属于特定的类型，该类型规定了：


    * 内存空间的布局和大小

    * 你可以在内存空间中存储的值

    * 你可以应用的操作


    在命名变量时可以使用下划线、数字和字母。但是，你不能使用数字作为变量名的第一个字符。例如，`variable1` 是有效的，但 `1variable` 则无效。此外，这种编程语言对大小写敏感。这意味着
    `VARIABLE`、`Variable` 和 `variable` 被视为三个不同的实体。


    | 变量类型 | 说明 |

    | :--- | :--- |

    | `int` | 整数大小。 |

    | `bool` | 可以存储真或假。 |

    | `void` | 表示无。 |

    | `char` | 整数类型（通常为一个字节）。 |

    | `float` | 单精度浮点。 |

    | `wchar_t` | 表示宽字符。 |

    | `double` | 变量类型。 |


    此外，这种编程语言允许你使用某些工具定义其他类型（例如类、数组等）。本书的后续部分将介绍如何描述、声明和利用这些类型。


    #### 如何在 C++ 中定义变量


    通过定义变量，你是在告知 C++ 编译器你想要使用的位置和存储空间。你的变量定义指定了数据类型并持有属于该类型的变量列表。以下是你应该使用的语法：


    ```cpp

    type variable_list;

    ```


