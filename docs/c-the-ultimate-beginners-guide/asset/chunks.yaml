    ### 3. 递增

    你可以使用这部分来修改用于循环控制的变量。你可以简单在该部分放置一个分号——这并不是强制性的。基本上，一旦循环体执行完毕，递增就会变得有用。


    ### 4.

    系统将重新检查条件的结果。如果结果为真，循环语句将激活，程序将重新开始。一旦结果变为假，该循环将终止。


    #### For 循环的流程图

    ![](img/00022.jpeg)


    ### Do… While 循环

    与之前的循环类型（这些类型在执行循环体之前检查条件）不同，`do… while` 在循环执行后才检查指定的条件。


    `do… while` 循环与 `while` 循环相似，唯一的区别是 `do… while` 循环至少执行一次（无论条件结果如何）。


    C++ `do… while` 循环的语法是：


    ![](img/00023.jpeg)


    如你所见，条件位于循环的最后部分。这意味着循环将在测试指定的条件之前执行。


    如果结果为真，控制流将重启，目标语句将再次重复。此过程将一直重复，直到条件的结果变为假。


    #### Do… While 循环的流程图

    ![](img/00024.jpeg)


    ### 嵌套循环

    C++ 允许你将循环放在另一个循环内部。这个过程被称为“嵌套”循环。这种类型的语法取决于你想要嵌套的循环：


    #### 嵌套 For 循环的语法

    ![](img/00025.jpeg)


    #### 嵌套 While 循环的语法

    ![](img/00026.jpeg)


    #### 嵌套 Do… While 循环的语法

    ![](img/00027.jpeg)


    ### 什么是循环控制语句？

    循环控制语句可以改变循环体的执行。一旦执行被改变，你为之前的过程创建的所有自动对象都将被销毁。


    C++ 编程语言支持这些循环控制语句：


    | 控制语句 | 定义 |

    | :--- | :--- |

    | `goto` 语句 | 该语句可以将循环控制转移到目标语句。你不应该在 C++ 程序中使用这种循环控制语句。 |

    | `continue` 语句 | 该语句可以导致循环忽略其主体的剩余部分，并在下次迭代前立即检查条件。 |

    | `break` 语句 | break 语句可以终止 switch 或循环语句，并将控制传递给 switch 或循环之后的 C++ 语句。 |


    让我们详细讨论每个循环控制语句：


    #### “goto” 语句

    基本上，`goto` 语句允许你在函数中设置无条件跳转。


    **重要注意：** 通常，在使用 `goto` 语句时，追踪程序控制流是极其困难的。这意味着如果你使用 `goto` 语句，在读取或修改你的 C++ 程序时可能会遇到问题。由于这个原因，建议你远离这种循环控制语句。


    这里是 C++ `goto` 语句的语法：


    ![](img/00028.jpeg)


    在上述语法中，`label` 是指定你的标记语句/语句的标识符。这里是 C++ `goto` 语句的语法：


    ![](img/00029.jpeg)


    #### “continue” 语句

    continue 语句强制激活循环。它们还会忽略可能影响循环功能的代码。


    当涉及 `for` 循环时，这种强制继续会执行循环的条件检查和递增部分。然而，对于 `while` 和 `do… while` 循环，程序的控制权将传递给条件检查。


    C++ `continue` 语句的语法是：


    ```cpp

    continue;

    ```


    这里是 `continue` 语句的流程图：


    ![](img/00030.jpeg)


    #### “break” 语句

    该语句在 C++ 语言中有两个用途：


    *   如果系统在循环内部遇到 `break` 语句，该循环将终止。然后，程序控制权将传递到循环之后的语句。

    *   你可以用它来结束 `switch` 语句中的一个 case（你将在下一章学习它）。


    对于嵌套循环，`break` 语句将终止最内层循环并执行代码块之后的行。


    这里是 C++ `break` 语句的语法：


    ```cpp

    break;

    ```


    #### Break 语句的流程图

    ![](img/00031.jpeg)


    ### 无限循环

    如果循环的条件始终为真，循环就会变成无限循环。通常，程序员使用 `for` 循环来实现这个目标。由于 `for` 循环涉及的表达式是可选的，你只需留空条件部分就可以创建无尽循环。这里有一个例子：


    ![](img/00032.jpeg)


    如果不存在，则条件表达式被认为是真的。C++ 用户通常使用 `for (;;)` 来表示无限循环。然而，你可以在你的 C++ 语句中包含递增和初始化表达式。


    **重要注意：** 你可以按 `Ctrl + C` 来终止无限循环。


    ### 第 10 章：C++ 中的决策语句

    决策结构需要你指示条件，这些条件可以由你的 C++ 程序进行测试或评估。你还应该提供根据条件的结果（即真或假）运行的语句。下面的图显示了 C++ 程序中普通决策语句的基本
    结构：


    ![](img/00033.jpeg)


    C++ 语言提供了以下决策语句：


    | 语句名称 | 定义 |

    | :--- | :--- |

    | `switch` 语句 | 这种语句允许你针对一组值检查变量的相等性。 |

    | `if` 语句 | 通常，“if”语句涉及一个布尔表达式和一个或多个语句。 |

    | `if… else` 语句 | C++ 允许在“if”语句之后放置一个“else”语句。当指定的布尔条件为假时，该“else”语句运行。 |

    | 嵌套 switch 语句 | 你可以在 `switch` 语句内部放置一个 `switch` 语句。 |

    | 嵌套 | 你可以在 `if` 或 `else` 语句内部放置 `if` 或 `else` 语句。 |


    让我们详细讨论每个决策语句：


    #### Switch 语句

    switch 语句允许你针对值检查变量的相等性。这些值被称为 case —— 你检查的变量将与每个 case 进行比较。


    C++ `switch` 语句的语法是：


    ![](img/00034.jpeg)


    在使用 `switch` 语句时，需要记住某些规则。这些规则是：


    *   `switch` 的表达式应该是枚举类型或整数类型。或者，它可能属于具有枚举或整数类型转换函数的类型。

    *   C++ 对你向 `switch` 中添加的 case 语句数量没有限制。但请确保每个 case 都有冒号和一个可以比较的值。

    *   case 的常量表达式和 switch 的变量必须属于相同的数据类型。此外，你的常量表达式必须是一个字面量。

    *   如果你正在切换的变量等同于某个 case，该 case 之后的语句将一直运行，直到系统遇到 break 语句。

    *   一旦系统遇到 `break` 语句，`switch` 语句将停止。然后，控制流将传递到 switch 之后的。

    *   你不需要在所有的 cases 中都放置 `break` 语句。如果某个 case 没有 break，控制流将传递到下一个 cases，直到系统找到
    `break` 语句。

    *   你可以为你的 `switch` 语句添加一个 `default` case。在 C++ 中，你应该将 `default` case 放在语句的末尾。程序员通常在需要执行任务但所有
    case 都为假时使用默认 case。此外，默认 case 不需要 break 语句。


    #### Switch 语句的流程图

    ![](img/00035.jpeg)


    #### If 语句

    基本上，一个 `if` 语句涉及一个布尔表达式和一个语句或一组语句。


    这里是 C++ `if` 语句的语法：


    ![](img/00036.jpeg)


