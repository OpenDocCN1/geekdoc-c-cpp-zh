    # Chapter 7: Modifiers and Storage Classes


    ## The Different Kinds of Modifiers in the C++ Language


    In the C++ language, you may use modifiers to introduce `double`, `int`, and `char`
    data types. Modifiers allow you to change the meaning of data types so that they
    can meet your needs.


    This section will discuss the following modifiers:


    * `short`

    * `long`

    * `unsigned`

    * `signed`


    You may apply all of these modifiers when working on integer constants. Additionally,
    you can apply `unsigned` and `signed` on `char` constants. Finally, you can apply
    `long` on double-precision floating point literals.


    **Important Note:** This programming language allows you to combine modifiers.
    You may use `signed` and `unsigned` to introduce `short` or `long` modifiers.
    For instance, `signed short int`.


    C++ offers a shortcut for declaring `long`, `short`, or `unsigned` integers. You
    may simply enter `long`, `short`, or `unsigned`, respectively. This programming
    language will add `int` automatically. For instance, the two statements given
    below both declare short integer variables:


    ```cpp

    short a;

    short int z;

    ```


    The following screenshot shows the code of a simple program. This program will
    help you understand how C++ interprets signed and unsigned modifiers.


    ![](images/00014.jpeg)


    If you have entered and run the program correctly, you’ll get the following result:


    ![](images/00015.jpeg)


    ## The Different Kinds of Qualifiers


    A type qualifier provides useful data about the variable it precedes. Here are
    the qualifiers that you will encounter while using C++:


    | Name of Qualifier | The Meaning |

    | :--- | :--- |

    | `volatile` | This modifier informs the C++ compiler that the value of a variable
    can be changed using methods that are not specified in the statement. |

    | `restrict` | This modifier provides you with different access methods to an
    object. |

    | `const` | You can use this modifier to prevent your program from changing an
    object during the execution phase. |


    ## The Storage Classes in C++


    Storage classes define the visibility (also known as scope) and lifetime of functions
    and/or variables inside a program. A storage class is a modifier that precedes
    the object type that it modifies. The C++ language supports five storage classes,
    namely:


    * `static`

    * `auto`

    * `extern`

    * `mutable`

    * `register`


    Let’s discuss each storage class in detail:


    ### Static


    This storage class tells the C++ compiler to keep a local variable as long as
    a program is active. This is because C++ programs sometimes create and destroy
    variables on a continuous cycle. Thus, tagging local variables as `static` allows
    those variables to retain their values even if they go in/out of scope.


    You may also apply this modifier on global variables. Once you have applied this
    modifier, the scope of the variable will be limited to the file it is declared
    in.


    ### Auto


    This serves as the default class for defining local variables. Here’s a basic
    example:


    ![](images/00016.jpeg)


    This sample code defines two different variables that belong to the same class.
    You can only use `auto` inside functions. That means you can only apply this storage
    class on local variables.


    ### Extern


    With this storage class, you can make references to global variables that are
    accessible to all of your program files. When using the `extern`, you cannot initialize
    the variable since it only points the variable name to a memory location you have
    defined previously.


    If you have several files and you have defined a global function or variable,
    which can also be used in different files, you may use `extern` on a different
    file to reference your predefined function or variable.


    This modifier is typically used when the programmer has multiple files that share
    similar global functions or variables.


    ### Mutable


    You can only apply this modifier on class objects. The `mutable` storage class
    allows an object’s member to override the `const` function.


    ### Register


    You should use this storage class when defining local variables that must be saved
    inside a register (i.e. not in the machine’s RAM). Thus, the variable’s maximum
    size is equal to the register’s size (typically a single word). Additionally,
    these variables cannot possess the `&` operator since they don’t have a specific
    location in the computer’s memory.


    In general, you should use this `register` to store variables that need fast access
    (e.g. counters). It is important to note that defining a `register` is different
    from storing a variable in the register. That means you can store quick-access
    variables inside a register, based on implementation and hardware limitations.


    # Chapter 8: The Operators in the C++ Language


    In this programming language, operators are symbols that require the compiler
    to conduct logical or mathematical manipulations. The C++ language offers a wide
    range of pre-installed operators. These are:


    ## The Logical Operators


    The list below will show you the logical operators available in the C++ programming
    language. Let’s assume that `x = 2` and `y = 0`.


    * `||` – This operator is known as “Logical OR.” The condition is true if one
    of the operands is not equal to zero. For instance: `(x || y)` is true.

    * `&&` – This is called “Logical AND.” If the two operands are not equal to zero,
    the condition is true. Here’s an example: `(x && y)` is false.

    * `!` – Programmers call this operator “logical NOT.” You can use it to reverse
    the status of an operand. If the condition is false, `!` will give you true. For
    example: `!(x && y)` is true.


    ## The Arithmetic Operators


    In this part of the book, you’ll learn about the arithmetic operators available
    in C++. To help you understand how each operator works, let’s use two sample variables:
    `x = 1; y = 3`.


    * `+` – This operator adds operands. For example: `x + y = 4`.

    * `-` – You should use this operator to perform subtraction. It subtracts the
    right-hand operand from that of the left-operand. For instance: `y - x = 2`.

    * `*` – This operator allows you to perform multiplication. For instance: `x *
    y = 3`.

    * `/` – With this operator, you can conduct division. For example: `y / x = 3`.

    * `++` – This is known as the increment operator. It increases the value by one.
    For example: `y++ = 4`.

    * `--` – This is called the decrement operator. With this, you can decrease the
    operand’s value by one. For instance: `x-- = 0`.


    ## Assignment Operators


    Here, you’ll learn about the assignment operators offered by C++:


    * `=` – This operator is called “simple assignment.” It assigns the value of the
    right-hand operand to the left-hand. For instance: `z = x + y`.

    * `+=` – This is known as “Add AND.” It adds the values of both operands and assigns
    the sum to the left-hand operand. For example: `z += x` is equal to `z = z + x`.

    * `*=` – Programmers call this the “Multiply AND” operator. It multiplies the
    value of the left-hand operand with that of the right-hand operand and gives the
    result to the left-hand operand. For example: `z *= x` is equal to `z = z * x`.

    * `-=` – This operator is called “Subtract AND.” It subtracts the value of the
    right-hand operand from that of the left-hand operand and assigns the difference
    to the left-hand. For instance: `z -= x` is equal to `z = z – x`.

    * `/=` – This is called the “Divide AND” operator. It divides the value of the
    left-hand operand with that of the right-hand operand and assigns the quotient
    to the left-hand operand. For example: `z /= x` is equal to `z = z / x`.

    * `&=` – This is called the “Bitwise AND” operator. The following example will
    show you how it works: `z &= x` is identical to `z = z & x`.

    * `|=` – Programmers refer this operator as “Bitwise inclusive OR and.” Here’s
    how it works: `z |= x` is identical to `z = z | x`.

    * `^=` – This is called “Bitwise exclusive OR and.” It works this way: `z ^= x`
    is identical to `z = z ^ x`.

