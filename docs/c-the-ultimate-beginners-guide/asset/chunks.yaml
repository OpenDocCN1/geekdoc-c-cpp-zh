    ## Introduction


    I want to thank you and congratulate you for getting my book…


    “C++: The Ultimate Beginner’s Guide!”


    This book is written for people who want to learn the basics of the C++ programming
    language. If you are looking for a comprehensive book that will teach you everything
    you need to know about C++, this just might be what you’re looking for.


    By reading this book, you’ll learn the basics of C++. You’ll discover the ideas,
    concepts, techniques, and methods used by expert C++ programmers. For example,
    this book will discuss variables, strings, functions, and data structures. That
    means you’ll be able to write programs using the C++ language after reading this
    material.


    Thanks again for purchasing this book, I hope you enjoy it!


    ## Chapter 1: The C++ Programming Language – An Overview


    C++ is a compiled, free-form, case-sensitive, multi-purpose, and statically typed
    programming language. It supports generic, procedural, and object-oriented programming.


    Computer programmers consider C++ as an intermediate-level language, since it
    has both low-level and high-level features.


    Bjarne Stroustrup, a Danish computer scientist, created C++ in 1979. Since he
    created this programming language as an improved version of “C” (another computer
    language), he called it “C with Classes.” However, during 1983, the name was changed
    to C++.


    **Important Note:** A language is considered as “statically typed” if type checking
    is conducted during the compilation.


    ### C++ - An Objected-Oriented Programming Language


    C++ is compatible with object-oriented programming. It also supports the four
    foundations of object-oriented software development:


    - Inheritance

    - Encapsulation

    - Polymorphism

    - Data Hiding


    ### The Three Major Parts of C++


    The C++ programming language is composed of three major parts:


    1. Core Language – This part serves as the foundation of C++ programs. It includes
    literals, variables, operators, etc.

    2. Standard Library – This part provides a wide range of functions that you can
    use to manipulate the core language.

    3. Standard Template Library (also known as STL) – This provides you with a wide
    range of methods and techniques that you can use with C++.


    ### Learning this Programming Language


    When studying C++, you should concentrate on ideas and concepts related to writing
    codes.


    You are, after all, trying to learn a programming language because you want to
    be a good programmer. You would want to be effective in terms of maintaining old
    programs and creating new ones.


    This programming language is compatible with a wide range of programming techniques.
    You may use it as C, Smalltalk, Fortran, etc. Regardless of your preferred programming
    style, you’ll surely achieve your goal of creating excellent programs and maintaining
    runtime efficiency.


    ### Using this Programming Language


    A lot of people all over the world are using C++. That means it is reliable and
    effective. Actually, C++ is one of the leading languages in the programming industry.


    In general, programmers use C++ when writing device drivers and programs that
    require direct hardware control. Researchers and programming instructors use C++
    to accomplish their tasks: this language is powerful and easy-to-use. Even beginners
    can master the basics of this language quickly.


    According to computer experts, you are already using C++ if your computer runs
    on either Windows or Macintosh. This is because these operating systems were written
    using C++.


    ## Chapter 2: The C++ Environment


    You don’t have to establish your own C++ environment when reading this book. This
    is because there are online tools that you can use to write and compile C++ codes.
    These tools are user-friendly and capable of giving immediate feedback. That means
    you’ll quickly discover the mistakes in your programs. One of the most popular
    online tools is `www.compileonline.com`. You may access that site using your favorite
    browser as you read this book.


    To help you get started, here’s a basic code that you can use with `www.compileonline.com`:


    ```

    ![](cover.jpeg)

    ```


    You should immediately see the resulting program.


    ### Setting Up a Local C++ Environment


    If you still want to establish a local environment for the C++ language, your
    computer must have the following programs:


    1. Text Editing Software – You’ll use a text editor to write your C++ programs.
    Here are the text editors commonly used by C++ programmers: `vi`, `vim`, `Brief`,
    `EMACS`, and `Windows Notepad`.


    The text editor’s name and version may change, depending on your machine’s operating
    system. For instance, `Notepad` serves as the default text editor for Windows
    computers. `Vi` or `vim`, however, are compatible with UNIX, Linux, and Windows.


    The text files you’ll produce using an editor are known as source files. In the
    C++ language, these files end with the following extensions: `.c`, `.cp`, or `.cpp`.


    **Important Note:** Make sure that your computer has a text editor before you
    use C++ locally. Without this kind of computer program, you won’t be able to write
    any C++ code.


    2. C++ Compiler – It is an actual compiler for the C++ programming language. You
    will use this software to compile source codes into executable programs.

