    \ statement(s) can be an individual statement or a group of statements. On the\
    \ other hand, `condition` can take the form of any C++ expression, and true must\
    \ be a non-zero value. Keep in mind that this loop will repeat the selected statement\
    \ as long as the condition is true.\n\nIf the condition is false, the system passes\
