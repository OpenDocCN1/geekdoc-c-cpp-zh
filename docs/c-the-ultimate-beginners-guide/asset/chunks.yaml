    value is greater than that of the right-hand one, the condition is true. For example:
    (y > x) is true.


    *   “<” – This operator is the opposite of “<”. If the value of the left-hand
    operand is lesser than that of the right-hand operand, the condition is true.
    For instance: (y < x) is not true.


    *   “!=” This operator checks the equality between two operands. If the values
    are unequal, the condition is true. For example: (x != y) is true.


    *   “<=” – With this operator, you’ll check whether the left-hand operand’s value
    is less than or equal to that of the right-hand operand. If it is, the condition
    is true. For example: (x <= y) is true.


    *   “>=” – Here, you’ll check if the left-hand operand’s value is greater than
    or equal to that of the right-hand operand. If it is, the condition is true. For
    instance: (y >= x) is true.


    The Miscellaneous Operators


    In this section, you’ll learn about other operators offered by C++:


    *   “sizeof” - You should use this operator to determine a variable’s size. For
    instance, sizeof(x), where x is an integer, will give you 4.


    *   “Cast” – This operator allows you to convert data types.


    *   “,” – Programmers refer to this as the “comma operator.” It activates a group
    of operations in your statements. The comma expression’s value is equal to that
    of the last item in the comma-separated set.


    *   “.” and “->” – These operators are known as “dot” and “arrow,” respectively.
    You can use these operators to reference the members of unions, classes, and structures.


    *   “*” – This is known as the “pointer” variable. For instance: *new; will generate
    a pointer to a variable named new.


    *   “&” – This operator can give you the address of any variable. For instance,
    &x; will provide you with the address of that variable.


    *   “Condition ? X : Y” – This is known as the conditional operator. If the condition
    is true, this operator will give you the value of x. If it false, however, the
    operator will give you the value of y.


    The Operator Precedence in the C++ Language


    Operator precedence dictates the division of terms in C++ expressions. This precedence
    influences how the system evaluates expressions. Some operators are lower than
    others in terms of precedence. For instance, the subtraction operator (i.e. “-”)
    has lower precedence than the division operator (i.e. “/”).


    Here’s a simple mathematical expression: (x = 8 – 6 /2). In this expression, x’s
    value is 5, not 1 since “-” has lower precedence than “/” (i.e. subtraction will
    be performed after division). Thus, 6 will be divided by 2\. Then, the quotient
    will be subtracted from 8.


    Chapter 9: The Different Types of Loops in C++


    In some cases, you might need to repeat blocks of code several times. Typically,
    C++ statements are conducted in a sequential manner: the system executes statements
    according to their position in the code.


    The C++ programming language offers different structures for controlling blocks
    of codes. With these structures, you can easily manipulate codes even if they
    have complex execution paths.


    Loop statements allow you to execute one statement or a set of statements several
    times. The screenshot given below shows the basic form of loop statements in major
    computer languages:


    ![](images/00018.jpeg)


    C++ offers the following loop types:


    | Type of Loop | Definition |


    | for loop | This loop type executes a group of statements several times. It also
    shortens the code that controls the looping variable. |


    | while loop | This type will repeat statements as long as a specified condition
    is met. Basically, while loop checks the condition prior to performing the body
    of the loop. |


    | do… while loop | This is similar to a while loop. The only difference is that
    a “do… while loop” checks the condition once the loop body has been executed.
    |


    | nested loop | You may place a loop or a set of loops within an existing “for,”
    “while,” or “do… while” loop. |


    Let’s discuss each loop type in detail:


    The While Loop


    This loop type executes the targeted statement repeatedly while the specified
    condition is true.


    The Syntax


    Here is the syntax of a C++ while loop:


    ![](images/00019.jpeg)


    In this syntax, statement(s) can be an individual statement or a group of statements.
    On the other hand, (condition) can take the form of any C++ expression, and true
    must be a non-zero value. Keep in mind that this loop will repeat the selected
    statement as long as the condition is true.


    If the condition is false, the system passes program control to the line after
    the while loop.


    The Diagram of a While Loop


    ![](images/00020.jpeg)


    Based on this diagram, it is possible that a while loop will never run. If the
    condition is false, the system will ignore the loop’s body and execute the statements
    after the loop.


    The For Loop


    This loop is a control structure that helps you to write loops efficiently. This
    loop type is particularly useful when you have to execute loops multiple times.


    The syntax for this loop type is:


    ![](images/00021.jpeg)


    The following list explains the control flow of “for loops:”


    1.  init – The system executes this step first (and once only). You can use this
    part to create and activate variables for loop control. This part isn’t mandatory
    – placing a semicolon is enough if you don’t have any entry for init.


    2.  condition – In this part of the syntax, you must specify the condition you
    want to use. If the result of the condition is true, the loop’s body will be executed.
    If the result is false, however, the loop’s body will be ignored. Then, the system
    will pass the control flow to the statement after the loop.'
