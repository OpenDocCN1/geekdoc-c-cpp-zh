    *   第五行告诉屏幕显示“This is my first C++ program.”\n*   最后一行（即 `return 0;`）结束了 `main()`\
    \ 函数并要求在调用过程中返回“0”。\n\n## 编译和执行 C++ 程序\n\n在本书的这一部分，你将学习如何编译和执行 C++ 程序。以下是你需要采取的步骤：\n\
    \n1.  打开你喜欢的文本编辑器并编写代码。此时，你可以输入上面的“Hello World”代码。\n2.  将代码保存为兼容 C++ 的源文件。对于这次练习，使用文件名：`helloworld.cpp`。\n\
    3.  打开命令行提示符并检查存储源文件的位置。\n4.  输入 `g++ helloworld.cpp` 并按回车键 – 此操作将编译代码。如果你的代码没有错误，命令行提示符将创建一个\
    \ `a.out` 文件。\n5.  然后，输入 `a.out` 运行程序。\n6.  你的电脑将打开新窗口并显示以下消息：\n\n![](img/00005.jpeg)\n\
