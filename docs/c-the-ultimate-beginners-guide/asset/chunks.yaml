    ## Chapter 11: The Different Functions in C++


    Functions are group of statements designed to perform a particular task. Each
    program written using C++ has a function, which exists in the `main()` section
    of the code. Additionally, even the simplest C++ programs can have extra functions.


    C++ allows you to divide your code into different functions. The method of division
    depends on your needs and preferences, although you have to make sure that each
    function accomplishes a certain task.


    Function declarations inform the C++ compiler regarding the name, parameters,
    and return type of a function. Function definitions, on the other hand, give the
    function’s actual body.


    The standard library of this programming language offers different functions.
    Here are two basic functions and their capabilities:


    * `strcat()` – This function concatenates two strings.

    * `memcpy()` – It copies a memory location to a different one.


    **Important Note:** Some programmers refer to functions as methods, procedures,
    or sub-routines.


    ### How to Define a Function


    Here is the syntax of functions in C++:


    ![](images/00042.jpeg)


    Let’s discuss the different parts of a C++ function:


    * **Name** – This is the function’s actual name.

    * **Parameters** – Programmers consider parameters as placeholders. Whenever you
    invoke a function, you give a value to the function’s parameter. C++ users refer
    to this value as an argument or actual parameter. The list of parameters refers
    to the order, number, and type of the function’s parameters. Keep in mind that
    parameters aren’t mandatory: your functions can be active even without any parameter.

    * **Return Type** – Functions can retrieve a value. The values returned by a function
    belong to a data type called “return_type.” In some cases, functions perform the
    required task without retrieving any value. Here, the `return_type` of the data
    is “void.”

    * **Function Body** – This part holds a group of C++ statements that determine
    the purpose and capabilities of the function.


    ### How to Declare a Function


    Function declarations inform the C++ compiler about functions (i.e. their name
    and how to call them). You may define the function’s body separately.


    Function declarations have these parts:


    ![](images/00043.jpeg)


    You don’t have to worry about parameter names while declaring a function. You
    can simply focus on the function’s type. That means the declaration below is valid:


    ![](images/00044.jpeg)


    You have to use a function declaration if you’ll call a function that is defined
    in another source file. In this situation, you must declare the needed function
    on top of the source file requiring the function.


    ### How to Call a Function


    When you create a function in C++, you define the function’s purpose. To run a
    function, you should invoke or call the function.


    When C++ programs run a function, the system transfers the program control to
    the invoked function. An invoked function conducts the assigned task. Once it
    completely executes its `return` statement or reaches its closing brace, the system
    returns the program control to the C++ program.


    To invoke a function, you just have to specify the function’s name and pass the
    parameters. You may store any value that will be returned by the function.


    ### The Arguments of a C++ Function


    If your function has arguments, you should declare variables that are compatible
    with the arguments’ values. Programmers refer to these variables as “formal parameters.”


    Generally, formal parameters act like ordinary variables located within the function.
    They pop into existence once the program enters the function. Then, they disappear
    as soon as the program exits the function.


    When you call a function, you can pass arguments to the function in three different
    ways. These are:


    | Type of Call | Definition |

    | :--- | :--- |

    | By pointer | This technique sends the argument’s address into the formal parameter/s.
    Basically, the address helps you to access the argument involved in the call.
    Thus, the modifications on the parameter influence the argument. |

    | By value | In this technique, the argument’s actual value is sent to the function’s
    formal parameter. In this situation, modifications on the parameter within the
    function don’t influence the argument. |

    | By reference | This technique copies the argument’s reference and gives it to
    the function’s formal parameter. Within the function, references help you to access
    the arguments involved in the call. Thus, the changes applied on the parameter
    influence the argument. |


    Following is more information regarding each technique:


    #### By Pointer

    To forward values using this technique, you should pass argument pointers to the
    function as if you are working with ordinary values. That means you must declare
    each parameter as a pointer type.


    #### By Value

    This technique copies the real value of the argument and gives it to the function’s
    formal parameter. Actually, this technique serves as the default method of passing
    arguments in the C++ programming language.


    **Important Note:** Codes located inside a function cannot change the arguments
    involved in invoking that function.


    #### By Reference

    To pass values using this technique, you just have to think that you are working
    on ordinary values. Declare the parameter/s of the function as the reference type/s.


    ### The Default Values of Parameters in C++


    While defining a function, you may assign a default value to the last parameter.
    You’ll benefit from this default value once you encounter a blank argument while
    invoking a function.


    You can assign a default value through an assignment operator. Then, place values
    for the correct arguments in the function’s definition. If the system doesn’t
    get any value when the function is invoked, it will use the default value you
    assigned. If a value is returned, however, the default value will be ignored.


