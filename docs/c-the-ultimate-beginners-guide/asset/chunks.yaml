    # 第三章 C++ 编程语言基础语法\n\n对于计算机专家来说，C++ 程序是通过调用方法相互作用的对象的集合。现在，让我们讨论一下这种语言的基本元素：\n\
    \n*   **对象 (Object)** – 对象具有不同的行为和状态。\n*   **类 (Class)** – 被定义为一个蓝图/模板，用于定义对象的状态/行为。\n\
    *   **方法 (Method)** – 基本上，这是对象的行为。类可以包含各种方法。方法是语言中控制数据、编写逻辑和执行操作的部分。\n*   **瞬时变量\
    \ (Instant Variable)** – 每个对象都有一组独特的瞬时变量。赋予瞬时变量的值创建了该对象相关的状态。\n\n## C++ 中的程序结构\n\
