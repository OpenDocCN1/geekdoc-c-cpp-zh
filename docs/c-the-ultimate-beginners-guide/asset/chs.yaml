  {\n    \n\n    add(a)\n}\n```\n\n## 标识符 (Identifiers)\n\n标识符以字母或下划线开头。C++ 是区分大小写的。这意味着\
  \ `SCIENCE`、`science` 是不同的。\n\n在语言中，标识符用于标识类、函数、变量。此外，使用使用符号符号（（符号））标识。。。显示显示了了有效的标识符：\n\
  \n![](img/00006.jpeg)\n\n## 关键字 (Keywords)\n\n与其他编程语言类似，C++ 有一组“保留”关键字（即不能用于命名变量、常量的单词）。下表显示了\
  \ C++ 的关键字：\n\n| `new` | `asm` | `try` | `for` |\n| `if` | `int` | `do` | `this`\
  \ |\n| `else` | `enum` | `auto` | `true` |\n| `bool` | `case` | `char` | `goto`\
  \ |\n| `void` | `long` | `throw` | `break` |\n| `false` | `catch` | `union` | `class`\
  \ |\n| `short` | `const` | `using` | `while` |\n| `private` | `explicit` | `protected`\
  \ | `export` |\n| `typedef` | `public` | `register` | `extern` |\n| `typeid` | `typename`\
  \ | `reinterpret_cast` | `return` |\n| `unsigned` | `friend` | `signed` | `const_cast`\
  \ |\n| `virtual` | `volatile` | `namespace` | `delete` |\n| `default` | `inline`\
  \ | `sizeof` | `static` |\n| `struct` | `static_cast` | `wchar_t` | `switch` |\n\
  | `double` | `mutable` | | `dynamic_cast` |\n| `template` | | | |\n\n**注意：** 某些\
  \ C++ 编译器不兼容三连序列。此外，由于这些序列本质上很复杂，建议初学者避开它们。\n\n## 三连序列 (Trigraphs)\n\n在语言中，某些字符具有另一种表示方式，称为三连序列。三连序列是三个字符的序列，每个序列代表一个字符。此外，每个三连序列都以\
  \ `??` 开头。\n\n以下是该语言中最流行的三连序列：\n\n| 三连序列 | 替换 |\n| :--- | :--- |\n| `??-` | `~`\
  \ |\n| `??<` | `{` |\n| `??>` | `}` |\n| `??!` | `|` |\n| `??(` | `[` |\n| `??)`\
  \ | `]` |\n| `??=` | `#` |\n| `??’` | `^` |\n| `??/` | `\\` |\n\n## 空格 (Whitespace)\n\
  \nC++ 编译器忽略包含空白的行。这些行被称为空行。\n\n\n\n\n\n空白符（Whitespace）是该语言中用于描述制表符、空格、注释和换行符的词。基本上，空白符允许你将语句拆分为更小的部分。此外，它们帮助编译器识别代码元素的开始和结束（例如\
  \ `int`）。请分析以下示例：\n\n```cpp\nint age;\n```\n\n上述语句在 `age` 和 `int` 之间需要一个空白字符。如果语句在编写时没有空白字符（即\
  \ `intage;`），C++ 编译器将无法正常工作。\n\n```cpp\ntree = leaves + wood;\n```\n\n对于第二个示例，你不需要在\
  \ `tree` 和 `=` 之间，或在 `=` 和 `leaves` 之间放置空白字符。你可以添加空白字符来提高 C++ 代码的可读性。然而，这些字符不会影响最终生成的程序。\n\
  \n## C++ 语言中的注释\n\n程序注释是你可以添加到代码中的解释性语句。注释可以帮助人们理解阅读你的源代码。总的来说，编程语言支持注释以提高所生成的计算机程序的可用性。\n\
  \n该语言允许你在代码中放置单行和多行注释。C++ 编译器会忽略放置在代码注释区域的字符。\n\n你应该使用 `/*` 开始注释，并使用 `*/` 结束注释。例如：\n\
  \n```cpp\n/* 这是一个非常棒的注释 */\n```\n\n你也可以使用 `//` 来开始注释。这里有一个示例：\n\n![](img/00007.jpeg)\n\
  \nC++ 编译器将忽略“// prints Hello World”部分。完成后的程序一旦执行，将会为你输出 Hello World。\n\n## 第 4 章：C++\
  \ 中不同的数据类型和变量类型\n\n### 数据类型\n\n与其他编程语言一样，C++ 支持不同类型的数据。这意味着在涉及存储信息时，你有广泛的选择。C++\
  \ 还允许你使用各种变量，变量是设计用于保留数值的内存位置。因此，“创建一个变量”等同于“预留一些内存空间”。\n\n在编写 C++ 程序时，你需要存储不同类型的数据（即：整数、布尔值、字符、浮点数、宽字符、双精度浮点数等）。根据变量的数据类型，计算机的操作系统（即操作系统）会分配内存并决定在该内存中可以存储什么类型的数据。\n\
  \n### 原生类型（内置）\n\n这种编程语言提供了一系列用户定义和内置的数据类型。以下是 C++ 中数据类型的主要分类：\n\n| 数据类型 | 关键字 |\n\
  | :--- | :--- |\n| 整数 | int |\n| 无值 | void |\n| 字符 | char |\n| 布尔值 | bool |\n| 宽字符\
  \ | wchar_t |\n| 双精度浮点数 | double |\n| 浮点数 | float |\n\n你可以使用这些修饰符修改上述数据类型：\n\n*\
  \ `short`\n* `long`\n* `unsigned`\n* `signed`\n\n### typedef 声明\n\n你可以使用 `typedef`\
  \ 为现有的数据类型分配一个新名称。以下是你在进行 `typedef` 声明时应该使用的语法：\n\n![](img/00008.jpeg)\n\n例如，以下语句告知\
  \ C++ 编译器 `head` 是字符的另一种备用术语：\n\n```cpp\ntypedef char head;\n```\n\n一旦你执行了该语句，下面的声明将是\
  \ 100% 有效的并产生一个名为 `letters` 的字符变量：\n\n```cpp\nhead letters;\n```\n\n### 枚举类型\n\n\
  枚举类型声明了一个备用类型名和标识符数组。你可以使用这些标识符作为你正在处理的数据类型的值。所有枚举员都是常量，其数据类型为给定的枚举。\n\n要生成一个枚举，你应该使用\
  \ `enum`（一个 C++ 关键字）。以下是你应该使用的语法：\n\n![](img/00009.jpeg)\n\n在此语法中，“enum-name”代表枚举的类型名。你应该使用逗号来分隔括号内的名称。\n\
  \n例如，给下面的代码创建了一个名为 `sizes` 的枚举，给它赋予了三个不同的尺寸，以及一个变量（即 `c`）来确定类型的大小。最后，将“large”赋值给变量\
  \ `c`。\n\n```cpp\nenum sizes { small, medium, large } c;\nc = large;\n```\n\n默认情况下，第一个名称的值等于\
  \ 0，第二个名称的值等于 1，第三个名称的值等于 2，以此此类推。然而，你可以添加一个初始化器来为所选的名称分配特定的值。\n\n例如，在下面给出的枚举中，`medium`\
  \ 将获得值 100。\n\n```cpp\nenum sizes { small, medium=100, large };\n```\n\n一个名称的值比前一个大\
  \ 1。因此，在最新的示例中，`large` 的值等于 101。\n\n### 变量类型\n\n变量提供了可以由你的程序修改和控制的存储。每个变量都属于特定的类型，该类型规定了：\n\
  \n* 内存空间的布局和大小\n* 你可以在内存空间中存储的值\n* 你可以应用的操作\n\n在命名变量时可以使用下划线、数字和字母。但是，你不能使用数字作为变量名的第一个字符。例如，`variable1`\
  \ 是有效的，但 `1variable` 则无效。此外，这种编程语言对大小写敏感。这意味着 `VARIABLE`、`Variable` 和 `variable`\
  \ 被视为三个不同的实体。\n\n| 变量类型 | 说明 |\n| :--- | :--- |\n| `int` | 整数大小。 |\n| `bool` | 可以存储真或假。\
  \ |\n| `void` | 表示无。 |\n| `char` | 整数类型（通常为一个字节）。 |\n| `float` | 单精度浮点。 |\n| `wchar_t`\
  \ | 表示宽字符。 |\n| `double` | 变量类型。 |\n\n此外，这种编程语言允许你使用某些工具定义其他类型（例如类、数组等）。本书的后续部分将介绍如何描述、声明和利用这些类型。\n\
  \n#### 如何在 C++ 中定义变量\n\n通过定义变量，你是在告知 C++ 编译器你想要使用的位置和存储空间。你的变量定义指定了数据类型并持有属于该类型的变量列表。以下是你应该使用的语法：\n\
  \n```cpp\ntype variable_list;\n```\n\n\n\n\n当你有多个可用文件并且在其中一个文件中指定变量时，你会发现变量声明非常有用。在语句中声明变量时，你应该使用另一个\
  \ C++ 关键字 `extern`。该语言允许你在程序中多次声明同一个变量。但是，你只能在函数、文件或代码块中定义它一次。\n\n## Rvalues 和左值\
  \ Lvalues\n\nC++ 语言支持两种类型的表达式：\n\n* `rvalue` – 该术语指的是存储在内存某处的值。`Rvalues` 是不能包含赋值给它们的值的表达式。这意味着你可以将\
  \ `rvalue` 放在 C++ 语句的右侧，但永远不能放在左侧。\n* `lvalue` – 它们是指向特定内存位置的表达式。你可以将 `lvalues`\
  \ 放在 C++ 语句的任意一侧。\n\n所有变量都被归类为 `lvalues`。这意味着它们可以出现在语句的右侧和左侧。另一方面，数字字面量被视为 `rvalues`。这意味着它们不能写在\
  \ C++ 语句的左侧。\n\n## 第 5 章：变量的作用域\n\n基本上，“作用域”一词指的是 C++ 程序的一部分。这里有三个你可以声明变量的地方：\n\n\
  * 你的程序函数外部。这些变量被称为全局变量，因为它们可以在程序的任何部分被访问。\n* 块或函数内部。以这种方式声明的变量被称为局部变量。\n* 函数参数定义内部。这些参数被称为形式参数。\n\
  \n在书的这一部分中，你将学习全局变量和局部变量。形式参数将在后面的章节中讨论。\n\n### 全局变量\n\n这些变量在函数外部声明。通常，全局变量被放置在\
  \ C++ 程序的顶部。属于这种类型的变量可以永久存储它们的值。\n\n你可以使用任何函数访问全局变量；因此，你可以在程序的任何部分利用全局变量。\n\n###\
  \ 局部变量\n\n这些变量在块或函数内部声明。由于这些变量被放在特定的函数或代码块中，你只能将它们用于相同函数或块中的语句。你不能将局部变量用于外部语句（即存储在函数或代码块之外的语句）。\n\
  \n### 如何初始化全局和局部变量\n\n一旦定义了局部变量，系统就不会初始化它们。这意味着你必须手动初始化它们。另一方面，系统会自动初始化全局变量。以下是一些有效的数据类型及其对应的初始化器：\n\
  \n| 数据类型 | 初始化器 |\n| :--- | :--- |\n| `char` | `'\\0'` |\n| `int` | `o` |\n| `float`\
  \ | `0` |\n| `pointer` | `NULL` |\n| `double` | `0` |\n\n**重要注意：** 在编写程序时，你应该妥善地初始化所有的变量。如果不这样做，你的程序可能会产生意外或不需要的结果。\n\
  \n## 第 6 章：字面量/常量\n\n“常量”一词指的是固定值，它可以防止你的程序进行未来的更改。这种值也被称为字面量。\n\n**重要注意：** C++\
  \ 程序将字面量视为普通变量。唯一的区别是程序无法以任何方式修改这些字面量。\n\n字面量可以属于任何基本数据类型。专家级程序员将这些值分为五大类。这些是：\n\
  \n### 布尔值\n\nC++ 编程语言有两个布尔常量，它们被认为是关键字：\n\n* `false` – 代表虚的值。\n* `true` – 代表真的值。\n\
  \n**重要注意：** true 不等于 `1` 且 false 不等于 `0`。\n\n### 字符\n\n你应当使用单引号将字符常量括起来。以 `L`（大写）开头的常量属于“宽字符”类别，必须存储在\
  \ `wchar_t` 变量中。另一方面，如果你的常量不是大写 `L` 开头，它被视为窄字符并可以放在简单的 `char` 变量中。\n\n字符常量可以用普通字符（例如\
  \ `‘y’`）、通用字符（例如 `‘u01C0’`）或转义序列（例如 `'\\n’`）的形式存在。\n\n在 C++ 编程语言中，某些字符如果通过斜斜引入将获得特殊功能。这些字符被称为序列代码。查看以下示例：\n\
  \n| 转义序列 | 含义 |\n| :--- | :--- |\n| `\\'` | 单引号 |\n| `\\?` | 问号 |\n| `\\”` | 双引号\
  \ |\n| `\\\\` | 反斜杠 |\n| `\\b` | 退格 |\n| `\\f` | 换页 |\n| `\\a` | 铃声或警报 |\n| `\\\
  n` | 换行 |\n| `\\000` | 具有 1–3 位的八进制数 |\n| `\\v` | 垂直制表符 |\n| `\\r` | 回车 |\n| `\\\
  xhh` | 十进制数 |\n| `\\t` | 水平制表符 |\n\n### 字符串\n\n你必须使用双引号将字符串常量括起来。字符串包含与字符常量类似的字符：转义序列、通用字符和普通字符。\n\
  \n字符串常量允许将长行分成更短行。如果你使用此功能，应该在较短行之间添加空格以将它们分开。\n\n### 浮点数\n\n浮点常量有四个部分：(1) 指数，(2)\
  \ 小数，(3) 整数，(4) 小数。你可以以指数或小数形式表示这些常量。\n\n在小数形式编写浮点字面量时，包含指数、小数点或两者。另一方面，在指数形式编写时，你应该包含小数、整数或两者。使用\
  \ `E` 或 `e` 引入。\n\n### 整数\n\n整数常量可以是八进制、进制或十六进制字面量。你应该使用前缀来指定这些常数的基数（即值）。以下是整数及其对应的前缀：\n\
  \n* 十进制整数 – 无\n* 八进制整数 – `o`\n* 十六进制整数 – `X`\n\nC++ 语言允许为你的整数字面量添加 `L/l` 或 `U` 作为后缀。这些后缀大小写不敏感。此外，你可以以任何顺序放置它们。下面的列表显示了一些整数：\n\
  \n* `0FL` 有效\n* `16` 有效\n* `15U` 有效\n* `09` 无效 – `9` 不是八进制数\n* `065` 有效\n\n## 如何定义常量\n\
  \n在该语言中，你可以通过两种不同的方式定义字面量：\n\n* 使用 `const`（C++ 关键字）\n* 使用 `#define`（C++ 预处理器）\n\n\
  ### 什么是 #define?\n\n该预处理器在定义字面量时使用以下语法：\n\n```\ndefine CONSTANT value\n```\n\n下面的示例将帮助你理解这个预处理器：\n\
  \n```define PI 50\n\n\n\n如果你编译并执行上述代码，你将得到结果：50。\n\n### 什么是 const?\n\n基本上，`const`\
  \ 是一个 C++ 关键字，你可以用它声明具有特定类型的字面量。这是该关键字的语法：\n\n```cppconst type variable_name = value;\n\
  ```\n\n**重要注意：** 根据专家级程序员的建议，定义字面量时应使用大写字母。\n\n\n\n\n## 第 7 章：修饰符与存储类型\n\n## C++\
  \ 语言中不同的修饰符\n\n在 C++ 语言中，你可以使用修饰符引入 `double`、`int` 和 `char` 数据类型。修饰符允许你更改数据类型的含义以满足你的需求。\n\
  \n本节将讨论以下修饰符：\n\n* `short`\n* `long`\n* `unsigned`\n* `signed`\n\n处理整数常量时，你可以应用所有的修饰符。此外，你可以在\
  \ `char` 常量上应用 `unsigned` 和 `signed`。最后，你可以在双精度浮点字面量上应用 `long`。\n\n**注意：** 该编程语言允许你组合修饰符。你可以使用\
  \ `signed` 和 `unsigned` 来引入 `short` 或 `long` 修饰符。例如：`signed short int`。\n\nC++ 为声明\
  \ `long`、`short` 或 `unsigned` 整数提供了快捷方式。你只需分别输入 `long`、`short` 或 `unsigned`。该编程语言会自动添加\
  \ `int`。例如，下面的两个语句都声明了短整型变量：\n\n```cpp\nshort a;\nshort int z;\n```\n\n接下来的截图了一个简单程序的代码。该程序将帮助你理解\
  \ C++ 如何解释有符号和无符号修饰符。\n\n![](img/00014.jpeg)\n\n如果你正确输入并运行了程序，将得到以下结果：\n\n![](img/00015.jpeg)\n\
  \n## 不同的限定符\n\n类型限定符（Type qualifier）为其其前的变量提供有用数据。以下是你在使用 C++ 时会遇到的限定符：\n\n| 限定符名称\
  \ | 含义 |\n| :--- | :--- |\n| `volatile` | 此修饰符告知 C++ 编译器，变量的值可以使用语句未指定的方法进行更改。 |\n\
  | `restrict` | 此修饰符为你提供了对对象的不同访问方法。 |\n| `const` | 你可以使用此修饰符防止程序在执行阶段更改对象。 |\n\n\
  ## C++ 中的存储类型\n\n存储类型定义了程序内部函数和/或变量的可见性（也称为作用域）和生命周期。存储类型是位于其修饰的对象类型之前的修饰符。C++ 语言支持五种存储类型，即：\n\
  \n* `static`\n* `auto`\n* `extern`\n* `mutable`\n* `register`\n\n让我们详细讨论每种存储类型：\n\
  \n### Static\n\n此存储类型告诉 C++ 编译器只要程序处于活动状态，就保留局部变量。这是因为 C++ 程序有时会在持续循环中创建和销毁变量。因此，将局部变量标记为\
  \ `static` 可以这些这些即使进入/离开作用域也能保留其值。\n\n你也可以将此修饰符应用于全局变量。一旦你应用了此修饰符，变量的作用域将限制在声明它的文件中。\n\
  \n### Auto\n\n它是定义局部变量的默认类。这里有一个基本示例：\n\n![](img/00016.jpeg)\n\n此示例代码定义了两个属于同一类的不同变量。你只能在函数内部使用\
  \ `auto`。这意味着你只能在局部变量上应用这种存储类型。\n\n### Extern\n\n通过这种存储类型，你可以引用全局变量，这些变量对你的程序所有文件都可见。使用\
  \ `extern` 时，不能初始化变量，因为它仅仅是将变量名指向你之前定义的内存位置。\n\n如果你有多个文件并且定义了一个全局函数或变量（该变量可以在不同的文件中使用），你可以在另一个文件中使用\
  \ `extern` 来引用你预定义的函数或变量。\n\n当程序员有多个共享相似全局函数或变量的文件时，通常使用此修饰符。\n\n### Mutable\n\n\
  你只能将此修饰符应用于对象。`mutable` 存储类型允许对象的成员覆盖 `const` 函数。\n\n### Register\n\n当你定义必须保存在寄存器中（即不在机器的\
  \ RAM 中）的局部变量时，应该使用这种存储类型。因此，变量的最大大小等于寄存器的大小（通常为单个字长）。此外，这些变量不能拥有 `&` 运算符，因为它们在计算机内存中没有特定的位置。\n\
  \n通常，你应该使用此 `register` 来存储需要快速访问的变量（例如计数器）。需要注意的是，定义 `register` 与将变量存储在寄存器中是不同的。这意味着根据实现和硬件限制，你可以将快速访问的变量存储在寄存器中。\n\
  \n## 第 8 章：C++ 语言中的运算符\n\n在这个编程语言中，运算符是需要编译器执行逻辑或数学操作的符号。C++ 语言提供了广泛的预装运算符。这些是：\n\
  \n## 逻辑运算符\n\n下面的列表将向你展示 C++ 编程语言中可逻辑运算符。假设 `x = 2` 且 `y = 0`。\n\n* `||` – 此运算符被称为“逻辑或”。如果其中一个操作数不等于零，则条件为真。例如：`(x\
  \ || y)` 为真。\n* `&&` – 这被称为“逻辑与”。如果两个操作数都不等于零，则条件为真。这是一个示例：`(x && y)` 为假。\n* `!`\
  \ – 程序员将此运算符称为“逻辑非”。你可以使用它来反转操作数的状态。如果条件为假，`!` 将给你真。例如：`!(x && y)` 为真。\n\n## 算术运算符\n\
  \n在这一部分，你将学习 C++ 中提供的算术运算符。为了帮助你理解每个运算符如何工作，让我们使用两个变量：`x = 1; y = 3;`。\n\n* `+`\
  \ – 此运算符相加。`x + y = 4`。\n* `-` – 你可以使用此运算符执行减法。`y - x = 2`。\n* `*` – 此运算符允许执行乘法。`x\
  \ * y = 3`。\n* `/` – 通过此运算符，你可以执行除法。`y / x = 3`。\n* `++` – 这被称为自增运算符。它增加一个值。`y++\
  \ = 4`。\n* `--` – 这被称为递减运算符。通过它你可以减少操作数的值。`x-- = 0`。\n\n## 赋值运算符\n\n在这里，你将学习 C++\
  \ 提供的赋值运算符：\n\n* `=` – 此运算符被称为“简单赋值”。它将右操作数的值赋值给左侧。例如：`z = x + y`。\n* `+=` – 这被称为“相加”。它将两个操作数相加并将和赋给左。例如：`z\
  \ += x` 等于 `z = z + x`。\n* `*=` – 程序员称之为“相乘”。它将左操作数的值与右操作数的值相乘并将结果赋给左。例如：`z *= x`\
  \ 等于 `z = z * x`。\n* `-=` – 此运算符被称为“相减”。它从左操作数减去右操作数的值并将差赋给左。例如：`z -= x` 等于 `z =\
  \ z – x`。\n* `/=` – 此运算符被称为“相除”。它将左操作数的值除以右操作数的值并将商赋给左。例如：`z /= x` 等于 `z = z / x`。\n\
  * `&=` – 此运算符被称为“按位与”。接下来的示例将向你展示它是如何工作的：`z &= x` 等同于 `z = z & x`。\n* `|=` – 程序员引用此运算符为“按位或”。它的工作原理如下：`z\
  \ |= x` 等同于 `z = z | x`。\n* `^=` – 这被称为“按位异或”。它的工作方式如下：`z ^= x` 等同于 `z = z ^ x`。\n\
  \n\n\n\n\n*   `>>=` – 这被称为“右移并与”。它的工作原理如下：`(z >>= x)` 等同于 `(z = z >> x)`。\n*   `<<=`\
  \ – 程序员将此称为“左移并与”。它的工作方式如下：`(z <<= x)` 等同于 `(z = z << x)`。\n\n## 位运算符\n\n你可以在比特位上应用位运算符。通常情况下，你必须使用它们来执行逐位操作。下方的截图显示了\
  \ `&`、`|` 和 `^` 的真值表。\n\n![](img/00017.jpeg)\n\n假设 `x = 60;` 且 `y = 13`。我们将这些值转换为二进制形式，将得到以下数据：\n\
  \n```\nx = 0011 1100\ny = 0000 1101\nx|y = 0011 1101\n~x = 1100 0011\nx&y = 0000\
  \ 1100\nx^y = 0011 0001\n```\n\n下表将显示 C++ 中可用的位运算符。假设 `x = 60` 且 `y = 13`。\n\n*\
  \   `&` – 此运算符被称为“按位与”。如果两个操作数中都存在某个比特，按位与将将其复制到结果中。例如：`(x & y)` 产生 `12`（即 `0000\
  \ 1100`）。\n*   `^` – 这被称为“按位异或”。如果一个比特存在于一个操作数中但不同于另一个，它将复制该比特。`(x ^ y)` 得到 `49`，或\
  \ `0011 0001`。\n*   `|` – 程序员将此称为“按位或”运算符。它将复制存在于操作数之一的比特。例如：`(x | y)` 将给你 `61`，即\
  \ `0011 1101`。\n*   `>>` – 此运算符被称为“按位右移”。它根据右侧操作数提供的比特移动左侧操作数的值。例如：`x >> 2` 得到 `15`，即\
  \ `0000 1111`。\n*   `<<` – 这被称为“按位左移”。它根据右侧操作数提供的比特数移动左侧操作数的值。例如：`x << 2` 得到 `240`，即\
  \ `1111 0000`。\n*   `~` – 程序员将此称为“按位取反”。这是一个一元运算符。此外，它会“翻转”所作用的比特。例如：由于是符号数，如果以补码格式书写，`(~x)`\
  \ 得到 - 61，即 `1100 0011`。\n\n## 关系运算符\n\n本书的这一部分节将侧重于 C++ 编程语言中可用的关系运算符。假设 `x = 2`\
  \ 且 `y = 4`。\n\n*   `==` – 此运算符检查两个操作数的相等性。如果操作数相等，则条件为真。例如：`(x == y)` 不为真。\n* \
  \  `>` – 此运算符检查两个操作数的值。如果左侧操作数的值大于右侧操作数的值，则条件为真。例如：`(y > x)` 为真。\n*   `<` – 此运算符是\
  \ `<` 的相反运算符。如果左侧操作数的值小于右侧操作数的值，则条件为真。例如：`(y < x)` 不为真。\n*   `!=` – 此运算符检查两个操作数之间的相等性。如果值不相等，则条件为真。例如：`(x\
  \ != y)` 为真。\n*   `<=` – 通过此运算符，你可以检查左侧操作数的值是否小于等于右侧操作数的值。如果是，则条件为真。例如：`(x <= y)`\
  \ 为真。\n*   `>=` – 在这里，你检查左侧操作数的值是否大于等于右侧操作数的值。如果是，则条件为真。例如：`(y >= x)` 为真。\n\n##\
  \ 杂项运算符\n\n在本节中，你将学习 C++ 提供的其他运算符：\n\n*   `sizeof` - 你应该使用此运算符来确定变量的大小。例如，`sizeof(x)`（其中\
  \ `x` 是整数）将给你 `4`。\n*   `Cast` – 此运算符允许你转换数据类型。\n*   `,` – 程序员将此称为“逗号运算符”。它在你的语句中激活一组操作。逗号表达式的值等于逗号分隔集合中的最后一项。\n\
  *   `.` 和 `->` – 这些运算符分别被称为“点”和“箭头”。你可以使用这些运算符引用联合体、类和结构的成员。\n*   `*` – 这被称为“指针”变量。例如：`*new;`\
  \ 将生成一个指向名为 `new` 变量的指针。\n*   `&` – 此运算符可以给出地址。\n*   `? :` – 运算符优先级\n\n运算符优先级决定了运算符执行的顺序。通常情况下，你必须使用它们来执行逐位操作。下方的截图显示了\
  \ `&`、`|` 和 `^` 的真值表。\n\n![](img/00017.jpeg)\n\n假设 `x = 60;` 且 `y = 13`。我们将这些值转换为二进制形式，将得到以下数据：\n\
  \n```\nx = 0011 1100\ny = 0000 1101\nx|y = 0011 1101\n~x = 1100 0011\nx&y = 0000\
  \ 1100\nx^y = 0011 0001\n```\n\n下表将显示 C++ 中可用的位运算符。假设 `x = 60` 且 `y = 13`。\n\n*\
  \   `&` – 此运算符被称为“按位与”。如果两个操作数中都存在某个比特，按位与将将其复制到结果中。例如：`(x & y)` 产生 `12`（即 `0000\
  \ 1100`）。\n*   `^` – 这被称为“按位异或”。如果一个比特存在于一个操作数中但不同于另一个，它将复制该比特。`(x ^ y)` 得到 `49`，或\
