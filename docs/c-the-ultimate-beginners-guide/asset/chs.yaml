  \ 且 `y = 4`。\n\n第 9 章：循环类型\n\n在某些情况下，你可能需要重复代码块。C++ 提供了不同的结构：\n\n| 循环类型 | 定义 |\n\
  | :--- | :--- |\n| for loop | 此循环类型执行一组语句。它也控制变量。 |\n| while loop | 此类型在指定条件为真时重复执行。\
  \ |\n| do… while loop | 这类似于 while loop。唯一的区别是“do… while loop”在执行体后检查条件。 |\n| nested\
  \ loop | 你可以在现有的“for”、“while”或“do… while”循环中放置循环。 |\n\n### while 循环\n\n此循环类型在条件为真时重复执行语句。\n\
  \n#### 语法\n\n这是 C++ while 循环的语法：\n\n```\nwhile (condition) {\n    statement\n}\n\
  ```\n\n在此语法中，statement 可以单个语句或一组语句。另一方面，`condition` 可以采取任何 C++ 表达式的形式，且真是非零值。记住，只要条件为真，此循环就会重复选择的语句。\n\
  \n#### while 循环图\n\n![](img/0020.jpeg)\n\n根据此图，while 循环可能永远不会运行。如果条件为假，系统将忽略循环体并执行循环后的语句。\n\
  \n#### for 循环\n\n这种循环结构帮助你高效地编写循环。这种循环类型在需要执行多次循环时特别有用。\n\n这种循环类型的语法为：\n\n```\n\
  for (init; condition; increment) {\n    statement\n}\n```\n\n以下列表解释了 `for 循环` 的控制流：\n\
  \n1.  `init` – 系统首先执行此步骤（仅执行一次）。你可以使用这部分创建并激活用于控制的变量。\n2.  `condition` – 在此部分，你必须指定要使用的条件。如果条件的结果为真，则执行循环体。然而，如果结果为假，循环体将被忽略。然后，系统将控制流传递到循环后的语句。\n\
  \n\n\n\n\n### 3. 递增\n你可以使用这部分来修改用于循环控制的变量。你可以简单在该部分放置一个分号——这并不是强制性的。基本上，一旦循环体执行完毕，递增就会变得有用。\n\
  \n### 4.\n系统将重新检查条件的结果。如果结果为真，循环语句将激活，程序将重新开始。一旦结果变为假，该循环将终止。\n\n#### For 循环的流程图\n\
  ![](img/00022.jpeg)\n\n### Do… While 循环\n与之前的循环类型（这些类型在执行循环体之前检查条件）不同，`do… while`\
  \ 在循环执行后才检查指定的条件。\n\n`do… while` 循环与 `while` 循环相似，唯一的区别是 `do… while` 循环至少执行一次（无论条件结果如何）。\n\
  \nC++ `do… while` 循环的语法是：\n\n![](img/00023.jpeg)\n\n如你所见，条件位于循环的最后部分。这意味着循环将在测试指定的条件之前执行。\n\
  \n如果结果为真，控制流将重启，目标语句将再次重复。此过程将一直重复，直到条件的结果变为假。\n\n#### Do… While 循环的流程图\n![](img/00024.jpeg)\n\
  \n### 嵌套循环\nC++ 允许你将循环放在另一个循环内部。这个过程被称为“嵌套”循环。这种类型的语法取决于你想要嵌套的循环：\n\n#### 嵌套 For\
  \ 循环的语法\n![](img/00025.jpeg)\n\n#### 嵌套 While 循环的语法\n![](img/00026.jpeg)\n\n####\
  \ 嵌套 Do… While 循环的语法\n![](img/00027.jpeg)\n\n### 什么是循环控制语句？\n循环控制语句可以改变循环体的执行。一旦执行被改变，你为之前的过程创建的所有自动对象都将被销毁。\n\
  \nC++ 编程语言支持这些循环控制语句：\n\n| 控制语句 | 定义 |\n| :--- | :--- |\n| `goto` 语句 | 该语句可以将循环控制转移到目标语句。你不应该在\
  \ C++ 程序中使用这种循环控制语句。 |\n| `continue` 语句 | 该语句可以导致循环忽略其主体的剩余部分，并在下次迭代前立即检查条件。 |\n\
  | `break` 语句 | break 语句可以终止 switch 或循环语句，并将控制传递给 switch 或循环之后的 C++ 语句。 |\n\n让我们详细讨论每个循环控制语句：\n\
  \n#### “goto” 语句\n基本上，`goto` 语句允许你在函数中设置无条件跳转。\n\n**重要注意：** 通常，在使用 `goto` 语句时，追踪程序控制流是极其困难的。这意味着如果你使用\
  \ `goto` 语句，在读取或修改你的 C++ 程序时可能会遇到问题。由于这个原因，建议你远离这种循环控制语句。\n\n这里是 C++ `goto` 语句的语法：\n\
  \n![](img/00028.jpeg)\n\n在上述语法中，`label` 是指定你的标记语句/语句的标识符。这里是 C++ `goto` 语句的语法：\n\
  \n![](img/00029.jpeg)\n\n#### “continue” 语句\ncontinue 语句强制激活循环。它们还会忽略可能影响循环功能的代码。\n\
  \n当涉及 `for` 循环时，这种强制继续会执行循环的条件检查和递增部分。然而，对于 `while` 和 `do… while` 循环，程序的控制权将传递给条件检查。\n\
  \nC++ `continue` 语句的语法是：\n\n```cpp\ncontinue;\n```\n\n这里是 `continue` 语句的流程图：\n\n\
  ![](img/00030.jpeg)\n\n#### “break” 语句\n该语句在 C++ 语言中有两个用途：\n\n*   如果系统在循环内部遇到 `break`\
  \ 语句，该循环将终止。然后，程序控制权将传递到循环之后的语句。\n*   你可以用它来结束 `switch` 语句中的一个 case（你将在下一章学习它）。\n\
  \n对于嵌套循环，`break` 语句将终止最内层循环并执行代码块之后的行。\n\n这里是 C++ `break` 语句的语法：\n\n```cpp\nbreak;\n\
  ```\n\n#### Break 语句的流程图\n![](img/00031.jpeg)\n\n### 无限循环\n如果循环的条件始终为真，循环就会变成无限循环。通常，程序员使用\
  \ `for` 循环来实现这个目标。由于 `for` 循环涉及的表达式是可选的，你只需留空条件部分就可以创建无尽循环。这里有一个例子：\n\n![](img/00032.jpeg)\n\
  \n如果不存在，则条件表达式被认为是真的。C++ 用户通常使用 `for (;;)` 来表示无限循环。然而，你可以在你的 C++ 语句中包含递增和初始化表达式。\n\
  \n**重要注意：** 你可以按 `Ctrl + C` 来终止无限循环。\n\n## 第 10 章：C++ 中的决策语句\n决策结构需要你指示条件，这些条件可以由你的\
  \ C++ 程序进行测试或评估。你还应该提供根据条件的结果（即真或假）运行的语句。下面的图显示了 C++ 程序中普通决策语句的基本 结构：\n\n![](img/00033.jpeg)\n\
  \nC++ 语言提供了以下决策语句：\n\n| 语句名称 | 定义 |\n| :--- | :--- |\n| `switch` 语句 | 这种语句允许你针对一组值检查变量的相等性。\
  \ |\n| `if` 语句 | 通常，“if”语句涉及一个布尔表达式和一个或多个语句。 |\n| `if… else` 语句 | C++ 允许在“if”语句之后放置一个“else”语句。当指定的布尔条件为假时，该“else”语句运行。\
  \ |\n| 嵌套 switch 语句 | 你可以在 `switch` 语句内部放置一个 `switch` 语句。 |\n| 嵌套 | 你可以在 `if` 或\
  \ `else` 语句内部放置 `if` 或 `else` 语句。 |\n\n让我们详细讨论每个决策语句：\n\n#### Switch 语句\nswitch\
  \ 语句允许你针对值检查变量的相等性。这些值被称为 case —— 你检查的变量将与每个 case 进行比较。\n\nC++ `switch` 语句的语法是：\n\
  \n![](img/00034.jpeg)\n\n在使用 `switch` 语句时，需要记住某些规则。这些规则是：\n\n*   `switch` 的表达式应该是枚举类型或整数类型。或者，它可能属于具有枚举或整数类型转换函数的类型。\n\
  *   C++ 对你向 `switch` 中添加的 case 语句数量没有限制。但请确保每个 case 都有冒号和一个可以比较的值。\n*   case 的常量表达式和\
  \ switch 的变量必须属于相同的数据类型。此外，你的常量表达式必须是一个字面量。\n*   如果你正在切换的变量等同于某个 case，该 case 之后的语句将一直运行，直到系统遇到\
  \ break 语句。\n*   一旦系统遇到 `break` 语句，`switch` 语句将停止。然后，控制流将传递到 switch 之后的。\n*   你不需要在所有的\
  \ cases 中都放置 `break` 语句。如果某个 case 没有 break，控制流将传递到下一个 cases，直到系统找到 `break` 语句。\n\
  *   你可以为你的 `switch` 语句添加一个 `default` case。在 C++ 中，你应该将 `default` case 放在语句的末尾。程序员通常在需要执行任务但所有\
  \ case 都为假时使用默认 case。此外，默认 case 不需要 break 语句。\n\n#### Switch 语句的流程图\n![](img/00035.jpeg)\n\
  \n#### If 语句\n基本上，一个 `if` 语句涉及一个布尔表达式和一个语句或一组语句。\n\n这里是 C++ `if` 语句的语法：\n\n![](img/00036.jpeg)\n\
  \n\n\n\n如果布尔表达式的结果为真（true），系统将执行“if”语句中的代码块。然而，如果结果为假（false），系统将执行“if”语句之后的代码。\n\
  \n“if”语句的流程图如下：\n\n![](img/00037.jpeg)\n\n## If-Else 语句\n\n你可以在“if”语句之后包含一个“else”语句。这个可选的“else”语句会在布尔表达式的结果为假时运行。\n\
  \n该语句的语法如下：\n\n![](img/00038.jpeg)\n\n如果布尔表达式的结果为真，则代码的“if”部分将运行。另一方面，如果结果为假，则将运行代码的“else”部分。\n\
  \n### “If-Else”语句的流程图\n\n![](img/00039.jpeg)\n\n## 嵌套 switch 语句\n\nC++ 允许你将一个 `switch`\
  \ 作为另一个 `switch` 的一部分。即使外层和内部 `switch` 的常量具有相同的值，你也不会遇到任何问题。\n\n在这一门编程语言中，你可以对 `switch`\
  \ 语句使用约 256 层嵌套。\n\n以下是 C++ 嵌套 `switch` 的语法：\n\n![](img/00040.jpeg)\n\n## 嵌套 if\
  \ else 语句\n\n你始终可以在代码中嵌套“if else”语句。这意味着你可以在另一个“if”或“if else”语句内部添加一个“if”或“if else”语句。\n\
  \n这是该 C++ 语句的语法：\n\n![](img/00041.jpeg)\n\n## 第 11 章：C++ 中的不同函数\n\n函数是用于执行特定任务的语句组。每个使用\
  \ C++ 编写的程序都有一个函数，它存在于代码的 `main()` 部分。此外，即使是是最简单的 C++ 程序也可以有额外的函数。\n\nC++ 允许你将代码划分为不同的函数。划分方法取决于你的需求和偏好，尽管你必须确保每个函数都能完成某项任务。\n\
  \n函数声明告知 C++ 编译器有关函数的名称、参数和返回类型。另一方面，函数定义提供了函数的实际体内容。\n\n这门编程语言的标准库提供了不同的函数。以下是两个基本函数及其功能：\n\
  \n* `strcat()` – 此函数连接两个字符串。\n* `memcpy()` – 此函数将一个内存位置复制到另一个内存位置。\n\n**重要提示：**\
  \ 有些程序员将函数称为方法、过程或子程序。\n\n### 如何定义函数\n\n以下是 C++ 中函数的语法：\n\n![](img/00042.jpeg)\n\
  \n让我们讨论一下 C++ 函数的不同部分：\n\n* **名称 (Name)** – 这是函数的实际名称。\n* **参数 (Parameters)** –\
  \ 程序员将参数视为占位符。每当你调用函数时，你都会给函数的参数赋值值。C++ 用户将此值称为参数（argument）或实际参数。参数列表指的是函数参数的顺序、数量和类型。记住，参数不是强制性的：即使没有任何参数，你的函数也可以运行。\n\
  * **返回类型 (Return Type)** – 函数可以获取值。函数返回的值属于名为“return_type”的数据类型。在某些情况下，函数执行所需任务而不获取任何值。在这里，数据的\
  \ `return_type` 是“void”。\n* **函数体 (Function Body)** – 这部分包含一组 C++ 语句，决定了函数的用途和功能。\n\
  \n### 如何声明函数\n\n函数声明告知 C++ 编译器有关函数的信息（即它们的名称以及如何调用它们）。你可以单独定义函数体。\n\n函数声明包含这些部分：\n\
  \n![](img/00043.jpeg)\n\n在声明函数时，你不需要担心参数名称。你只需要关注函数的类型。这意味着下面的声明是有效的：\n\n![](img/00044.jpeg)\n\
  \n如果你要调用一个在另一个源文件中定义的函数，就必须使用函数声明。在这种情况下，你必须在需要该函数的源顶部声明所需的函数。\n\n### 如何调用函数\n\n\
  当你在 C++ 中创建一个函数时，你定义了函数的用途。要运行函数，你应该调用（invoke or call）该函数。\n\n当 C++ 程序运行函数时，系统会将程序控制权转移到被调用的函数。被调用的函数执行分配的任务。一旦它完全执行了\
  \ `return` 语句或到达其右括号，系统就会将程序控制权返回给 C++ 程序。\n\n要调用函数，你只需要指定函数名称并传递参数。你可以存储函数返回的任何值。\n\
  \n### C++ 函数的参数 (Arguments)\n\n如果你的函数有参数，你应该声明与参数值兼容的变量。程序员将这些变量称为“形式参数（formal parameters）”。\n\
  \n通常，形式参数的作用就像位于函数内的普通变量。一旦程序进入函数，它们就会出现。然后一旦程序退出函数，它们就会消失。\n\n当你调用函数时，你可以通过三种不同的方式向函数传递参数。这些是：\n\
  \n| 调用类型 | 定义 |\n| :--- | :--- |\n| 通过指针 (By pointer) | 此技术将参数的地址发送到形式参数中。基本上，地址帮助你访问调用涉及的参数。因此，对参数的修改会影响实际参数。\
  \ |\n| 通过值 (By value) | 在此技术中，参数的实际值被发送到函数的形式参数。在这种情况下，对参数的修改不会影响实际参数。 |\n| 通过引用\
  \ (By reference) | 此技术将参数的引用发送到形式参数中。基本上，引用帮助你访问调用涉及的参数。因此，对参数的修改会影响实际参数。 |\n\n\n\
  \n\n\n### Functions\n\n| `double tan(double);` | 使用此函数，你可以通过将角度作为 double 类型来获取其正切值。\
  \ |\n| `double cos(double);` | 它允许你通过将任何角度作为 double 类型来获取余弦。 |\n| `double log(double);`\
  \ | 通过使用此函数，你可以确定一个数的自然对数。 |\n| `double sin(double);` | 此函数允许你获取角度的正弦值。 |\n| `double\
  \ sqrt(double);` | 你可以通过将任何数字传递给此函数来获取平方根。 |\n| `double pow(double, double);` |\
  \ 此函数有两个元素：(1) 你想要求幂的数，(2) 你想要计算的幂次。 |\n| `int abs(int);` | 使用此函数，你可以获取整数的绝对值。 |\n\
  | `double hypot(double, double);` | 此函数允许你获取直角三角形斜边的长度。但是，你必须提供另外两条边的长度。 |\n| `double\
  \ floor(double);` | 此函数寻找一个小于或等于给定参数的整数。 |\n| `double fabs(double);` | 使用此函数，你可以获取小数的绝对值。\
  \ |\n\n## 第 13 章：C++ 数组\n\n这种编程语言提供了“数组”，这是一种数据结构。数组存储了一组属于相同类型的顺序元素。程序员使用数组来存储数据组，尽管将数组视为一组相同类型的变量集合会更有益。\n\
  \n与其逐一个地声明变量（例如 `number1`、`number2`、`number3` 等），你可以声明一个数组变量（例如 `number`），并使用 `number[1]`、`number[2]`、`number[3]`\
  \ 等来表示变量。你可以使用索引访问数组内部的元素。\n\n每个数组都具有相邻的内存位置。最低的内存位置指向数组中的第一个对象，而最高的内存位置则指向最后一个对象。\n\
  \n## 如何声明数组\n\n在声明数组时，你应该指定数组中所需的元素类型和数量。以下是你应该使用的语法：\n\n![](img/00045.jpeg)\n\n\
  这种数组被称为“一维”数组。你的数组的“arraySize”部分应该包含一个大于零的整数字面量。另一方面，“type”部分应该包含 C++ 支持的任何数据类型。例如，你应该使用下面的语句来声明一个包含\
  \ 10 个元素的数组。该数组名为 `balance`，数据类型为 `double`。\n\n![](img/00046.jpeg)\n\n## 如何初始化数组\n\
  \n在 C++ 语言中，你可以通过两种方式初始化数组元素：(1) 单独地，或者 (2) 通过单个 C++ 语句（见下例）。\n\n![](img/00047.jpeg)\n\
  \n大括号之间的值必须小于或等于你在括号内声明元素数量。\n\n## 如何访问数组元素\n\n可以通过索引数组名称来访问数组元素。要这样做，在数组名称后的括号内输入元素的索引。\n\
  \n## 与数组相关的不同 C++ 概念\n\n数组在用 C++ 编写程序起着巨大的作用。因此，你应该熟悉它们。下面的列表显示了 C++ 语言中最重要的数组相关概念。作为\
  \ C++ 用户，你必须掌握以下概念：\n\n| 概念 | 解释 |\n| :--- | :--- |\n| 指向现有数组的指针 | C++ 允许你通过输入数组名称创建一个指向数组初始元素的指针。在这里，你不需要包含任何索引。\
  \ |\n| 多维数组 | 这种编程语言允许你创建多维数组。显然，二维数组是你可以创建的最基础的多维数组。 |\n| 将数组传递给函数 | 你可以将数组的指针传递给函数。要这样做，你只需要指定数组的名称。你不应该输入任何索引。\
  \ |\n| 从函数获取数组 | 在 C++ 中，你可以从函数检索数组。 |\n\n## 结论\n\n我希望这本书能够帮助你学习 C++ 的基础知识。\n\n\
