  \ `GCC`，你需要访问 [`gcc.gnu.org/install`](http://gcc.gnu.org/install) 下载并安装它。提供的网页包含了详细的说明，因此你不会遇到任何困难。\n\
  \n*   对于 Macintosh 计算机 – 获取 `GCC` 最快最简单的方法是从 Apple 网站下载 Xcode 编程环境。只需按照那里提供的详细说明操作即可。链接：[`developer.apple.com/technologies/tools`](http://developer.apple.com/technologies/tools)。\n\
  \n*   对于 Windows 计算机 – 你需要下载并安装名为 `MinGW` 的程序。为此，访问 [www.mingw.org](http://www.mingw.org)\
  \ 并进入网站的下载页。获取最新版本的 `MinGW` 是最好的。\n\n在获取 `MinGW` 的同时，你应该安装这些重要程序：`gcc-core`、`binutils`、`gcc-g++`\
  \ 和 `MinGW runtime`。根据你的情况和喜好，下载其他辅助程序。\n\n你应该将 `MinGW` 的 bin 子目录添加到 `PATH` 环境变量。这样做，你只需输入基本名称即可激活该子目录中的工具。\n\
  \n完成安装过程后，你的电脑将允许你通过命令行运行 `ar`、`gcc`、`g++`、`dlltool` 和 `ranlib` 等 GNU 工具。\n\n# 第三章\
  \ C++ 编程语言基础语法\n\n对于计算机专家来说，C++ 程序是通过调用方法相互作用的对象的集合。现在，让我们讨论一下这种语言的基本元素：\n\n*  \
  \ **对象 (Object)** – 对象具有不同的行为和状态。\n*   **类 (Class)** – 被定义为一个蓝图/模板，用于定义对象的状态/行为。\n\
  *   **方法 (Method)** – 基本上，这是对象的行为。类可以包含各种方法。方法是语言中控制数据、编写逻辑和执行操作的部分。\n*   **瞬时变量\
  \ (Instant Variable)** – 每个对象都有一组独特的瞬时变量。赋予瞬时变量的值创建了该对象相关的状态。\n\n## C++ 中的程序结构\n\
