  \ 你必须确保 `g++` 在正确的路径中。同时，确保它在你保存源文件的位置运行。\n\n## C++ 语言中的块和分号\n\n在 във语言中，你应该使用分号来结束语句。因此，你\
  \ C++ 代码中的每个语句都应该以该字符结尾。分号表示编程实体的结束。\n\n例如，这里有四条不同的 C++ 语句：\n\n*   `a + b;`\n* \
