    # ### 4.1 Locking Concept


    During transaction execution a DDB commonly goes into temporary periods of inconsistency.
    The purpose of every concurrency control method is to ensure that no reads or
    writes are performed on a data item whose consistency is temporarily violated.
    For this purpose, in the locking method a lock is associated with a data access
    unit $x \in D$ (more precisely, a lock may be associated with a data access unit,
    e.g. a virtual memory page containing the whole data item or its part). It is
