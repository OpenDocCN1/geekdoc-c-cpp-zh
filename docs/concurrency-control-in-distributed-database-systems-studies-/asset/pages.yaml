    # 9.4 Performance Failures in the Multiversion Timestamp Ordering Method


    The multiversion $T/O$ method in its basic form of Reed''s algorithm is free from
    deadlock, permanent blocking and cyclic restarting. Indeed, the only conflict
    that can occur in the system is a conflict between an older write operation and
    a younger read operation. In Reed''s algorithm this problem is always unequivocally
    resolved by aborting the writing transaction. This guarantees that the only failure
    that can occur is infinite restarting. No particular solution of the problem of
    restarting in multiversion $T/O$ has date been proposed. In order to reduce the
    number of aborted transactions, the methods used to minimize the number of transaction
    restarts in the moniversion $T/O$ method [BG80], [BG81] can be applied. The timepaid
    algorithm, presented in Section 9.2, is also an attempt to solve this problem.
    The timepaid mechanism allows for a considerable reduction of the number of transaction
    abortions. However, a consequence of that is a possible of deadlock. The following
    example illustrates this fact.


    # Example 9.5


    Assume that the temporal relations between the versions of $x$ and $y$ and the
    transaction timestamps are as in Figure 9.5.'
