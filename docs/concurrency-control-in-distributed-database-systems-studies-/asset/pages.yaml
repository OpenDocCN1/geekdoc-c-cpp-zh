    section set r is ordered in two orders: prefixed and postfixed.

    The prefixed order is used to prevent deadlock and to detect data access conflicts.
    The postfixed order is used to guarantee schedule serializability.

    Transactions that have not been allowed to access a data item in the prefixed
    order are then executed in the prefixed order. In this way the number of aborts
    of transactions that do not satisfy the prefixed order is reduced since a transaction
    is aborted only if danger of deadlock exists.

    The basic tool of this algorithm is a transaction request list associated with
    each data item x denoted by Tran-list(x). A Tran-list(x) contains all uncommitted
    requests of transactions wishing to access or currently accessing the data item
    x. For each transaction Ti on the list the request type (read or write), the timestamp
    (TS(Ti)), and the request status (processing, waiting or ready-to-commit) are
    indicated.

    Each request list has its own timestamp, the commit timestamp, and denoted by
    CT(Tran-list(x)).nThe SABRE system algorithm is composed of the following rules.


    +   (R1) Access rule list


    When a transaction Ti requests to read or write a data item x that has no transaction
    request list associated with it then the list is created and the request is placed
    on it:


