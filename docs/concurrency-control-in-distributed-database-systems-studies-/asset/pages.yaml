    In order to resolve the deadlock problem, a timeout mechanism is used. If an access
    request cannot be granted within a specified time, the $TM$ module supervising
    transaction''s execution aborts it. The timeout mechanism solves the problem of
    deadlock, but, as seen in Chapter 3, may lead to cyclic restarting.'
