    # 14.1 The Mathematical Model of Global Performance


    The notation we shall adopt in this Chapter is a simplified version of that which
    is used in previous chapters, since we are dealing with here specific issue.


    Consider a set $D = \{D_1, \dots, D_m\}$ of $n$ distinct data items (files, parts
    of a data base, distinct bases, etc.) distributed at $n$ distinct sites $S_1,
    \dots, S_n$. Each $S_i$ represents a LDBS. Let


    ```

    $$\delta_{ij} = \begin{cases} 1 & \text{if item } j \text{ is stored at } S_i
    \ 0 & \text{otherwise} \end{cases}$$

    ```


    and by $D^i$ the subset of $D$ stored in $C_i$:n$$D^i = \{D_j \| \delta_{ij} =
    1\$.


    Transactions access each of the $S_i$. Simple queries are executed at the center
    to which they are addressed; these correspond, for instance, to local queries
    of the data base at a given site. A transaction, however, has to be executed at
    all sites whose $LDB$ is affected by it. Let $T$ denote a transaction; then define


    ```

    $$\beta(T,j) = \begin{cases} 1 & \text{if update } T \text{ modifies } D_j \ 0
    & \text{otherwise.} \end{cases}$$

    ```


    Thus we may define


    ```

    $$D(T) = \{D_j \| \beta(T,j) = 1\}$$\n$$C(T) = \{S_i \| D(T) \cap D^i \neq \emptyset\}$$

    ```


    so that $C(T)$ is the set of sites where $T$ must be executed.


    Transaction execution is assumed to have preemptive priority over the execution
    of queries; the arrival of $T$ interrupts an ongoing query operation, which restarts
    as soon as the transaction queue of the site is empty. Thus the system provides
    the most up-to-date response to a query which is addressed to it.'
