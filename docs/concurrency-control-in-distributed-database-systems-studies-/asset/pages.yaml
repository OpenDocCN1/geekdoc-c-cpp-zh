    \ transaction $T_i$ leads to the abortion of those transactions that have read\
    \ versions of $T_i$. This in turn may force the abortion of other transactions,\
    \ etc. Recall that this is called the *domino effect* or *cascading aborts*. Its\
    \ prevention is precisely the purpose of the *commitment condition* given in step\
    \ (iv) of Muro's algorithm. The condition for a transaction $T_i$ to commit is\
    \ that all transactions $T_k \rightarrow T_i$ be committed. This guarantees that\
    \ a committed transaction will never be aborted because of the domino effect.\
