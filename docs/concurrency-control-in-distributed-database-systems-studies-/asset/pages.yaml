    # 8.1 Multiversion Locking Algorithm


    The concept of multiversion data items was first used to control concurrent data
    accesses in a version of the Honeywell FMS system [Hon73]. The first multiversion
    locking algorithms used for concurrency control were the algorithms proposed in
    [BEHR80] and [SR81]. They were applied to a particular multiversion algorithm
    presented in [BG82], namely two-version DDBS. A multiversion locking algorithm
    called WAB presented in [BG82], [BG83b], [BHG87], is a generalization of those
    algorithms for a K-version DDBS. We present two multiversion locking algorithms:
    the WAB algorithm mentioned above and the Chan-Gray algorithm [CG85]. These algorithms
    are multiversion two-phase locking algorithms.


    The concept of multiversion two-phase locking is broader than the concept of multiversion
    two-phase locking in the 2PL algorithm. We say that an algorithm is a multiversion
    two-phase locking algorithm if it satisfies the following conditions:


    +   (i) there are two phases of transaction execution: the locking phase and the
    unlocking phase. During the locking phase a transaction must obtain all locks
    when it requests. The moment when all locks are granted, which is equivalent to
    the end of the locking phase and the beginning of the unlocking phase, is called
    the commit point of a transaction. New versions of the data items prepared in
    the transaction''s private workspace are written to the DDB during the unlocking
    phase;'
