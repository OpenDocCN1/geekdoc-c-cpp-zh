    # Multiversion heterogeneous guard policy MHGP


    +   (i) an update transaction $W_i$ can only request $LW$ locks; a query can only
    request $LR$ locks;


    +   (ii) an update transaction must start by locking the root $f$ of the guard
    graph $G$ first; a query may lock any vertex $e(R_j)$ first;


    +   (iii) a data item may be locked by a transaction at most once;


