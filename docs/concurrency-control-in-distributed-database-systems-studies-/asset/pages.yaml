    We now present the hypergraph policy [YPK79], [FKS81], [Yan82a]. As we have mentioned,
    this is the most general currently known locking policy. Both the M-pitfall policy
    and the $2PL$ algorithm are the instances of this policy.


    The starting point to designing the hypergraph policy is by asking the two fundamental
    questions concerning locking as a concurrency control method:


    +   (i) given a certain knowledge about the $DDB$ data structure, and the structure
    of transactions (i.e. how the data items are accessed by transactions), is there
    a set of necessary and sufficient rules for a locking algorithm to be safe?


    +   (ii) are the various locking *algorithms* instances of a “nice” structured
    locking policy for different $DDB$ data structures?


    By a “nice” structured locking policy operating on a set of data structures $\Delta$
    we mean a policy which efficiently recognizes the set $\Delta$, and (ii) operates
    in polynomial time, i.e., for each structure of $\Delta$ and every transaction
    mapping of a transaction into a locked transaction is computable by an algorithm
    running in polynomial time in the size of the set of data items accessed.


    Yannakis showed that in general, the above questions have negative answers [Yan82b]
    (also [Kan81], [YPK79]). He proved that determining the safety of a set of locked
    transactions is NP-complete. This result was originally proved for the centralized
    database systems [YPK79], [Yan82b]. Kannellakis and Papadimitriou showed that
    for the distributed database systems even determining whether a schedule of two
    arbitrary locked transactions is safe is NP-complete [KP82]. These results imply
    that'
