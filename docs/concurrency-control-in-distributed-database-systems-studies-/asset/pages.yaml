    \ the serializability, procedure S-Validate must be performed in an indivisible\
    \ manner, i.e. in a critical section. Therefore, the execution of the validation\
    \ and write phases of a transaction partially blocks the entire system since no\
    \ other transactions can enter these phases at the same time. On the contrary,\
