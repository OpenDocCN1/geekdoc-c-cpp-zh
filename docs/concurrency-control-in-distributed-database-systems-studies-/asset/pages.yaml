    # Hierarchical Reed''s algorithm


    +   (R1) Read Rule:

    - Read version $x^k \in H_{rw}(x)$ with the largest timestamp $W-ts(x^k)$ such
    that $W-ts(x^k) \le TS(T_i)$;

    - Update $H_{rw}(x)$ as follows:

    $R-ts(x^k) < TS(T_i)$ then $R-ts(x^k) \leftarrow TS(T_i)$;

    - Update $H_s(y)$ being an ancestor of $x$ adding to the updated history $H_{rw}(x)$:n$H_s(x)
    \leftarrow H_s(x) \cup H_{rw}(x)$;

    - For each granule $y$ being an ancestor of $x$ update the summary history of
    $y$:n$H_s(y) \leftarrow H_s(y) \cup H_{rw}(x)$.


    +   (R2) Prewrite Rule:

    - For each granule $y$ being an ancestor of $x$ perform the following test: if
    there exists a version $y^k \in H_{rw}(y)$ such that the condition $W-ts(y^k)
    \le TS(T_i) \le R-ts(y^k)$ is satisfied, then the result of the test is negative;

    - For granule $x$ perform the following test: if there exists such a version $x^k
    \in H_s(x)$ thatn$W-ts(x^k) \le TS(T_i) \le R-ts(x^k)$ then the result of the
    test is negative;'
