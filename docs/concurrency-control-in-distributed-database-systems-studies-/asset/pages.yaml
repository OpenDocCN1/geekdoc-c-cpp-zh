  md: '# 6


    # Validation Method


    # 6.1 Validation Concept


    The basic idea behind the validation method is the assumption that data access
    conflicts occur rarely enough for most concurrent transaction executions to be
    correct and to require no concurrency control. Therefore, no transaction is aborted
    or delayed during its execution as it is done by means of locking or timestamp
    ordering methods. Instead, each transaction is first executed to its commit point
    and then a validation test is performed to see whether or not there have been
    any data access conflicts that may have caused consistency of the database to
    lost. If the result of the validation test is positive, then the transaction tested
    is aborted and restarted. With the optimistic assumption concerning the probability
    of data access conflicts, the number of transaction restarts should be small.


    Concurrency control algorithms of the validation methods are numerous. They can
    be classified into two groups. In the first group [Bad79], [Cas81], [BG81], [BG82],
    [BCFP84], [Cl87], [Sug87], the precedence relation graph is constructed and tested
    for acyclicity (see Section 2.1). The precedence relation graph is updated whenever
    a read or write request has been accepted in a DDBS. As is well known, the presence
    of cycles in the precedence relation graph is sufficient for a set of transactions
    $r$ to be serializable. Designing an efficient mechanism for maintaining the precedence
    relation graph is the crucial problem concerning the implementation of the above
    algorithm in a DDBS. In fact there are two aspects of this problem.


    All sites of a DDBS have to be involved in the validation test of any transaction.
    Even sites never accessed by a given transaction must participate in testing the
    acyclicity of the precedence relation graph. A solution of'
