  md: '# #1 Distributed Database System Model


    This chapter introduces the formal model of a Distributed Database System (DDBS)
    which we use for presenting concurrency control algorithms. The model highlights
    those aspects of DDBSs that are essential for understanding concurrency control
    problems, while disregarding aspects that do not affect them.

    We define a DDBS as a triple


    > $$(DDB, \tau, C(\tau))$$


    where:


    DDB is a distributed database,

    $\tau = (T_1, T_2, \dots, T_m)$ is a set of transactions, and

    $C(\tau)$ is the set of all correct executions of $r$ known as the correctness
    criterion.

    Each component of this model will now be introduced.


    # ## 1.1 Distributed Database Model


    A distributed database DDB is a collection of data items. Each data item is named
    and has a value. In a particular system, data items might be files, records, record
    fields, relations, tuples of relations, etc.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# I. Distributed Database System Model


    We distinguish between the data items seen by the users and their implementation.
    A data item viewed by the users, i.e. invoked in users'' programs, is called a
    logical data item. We denote logical data items by upper case letters, usually
    X, Y, Z. A collection of all logical data items in a DDB is called a logical database
    :


    ```

    $\mathcal{L} = (X_1, X_2, \dots, X_n).$

    ```


    Each logical data item $X_i$ is, in general, implemented as a set of physical
    data items $x_{i1}, x_{i2}, \dots, x_{ic}$, which are copies, distributed over
    DDB sites :


    ```

    $\mathcal{S} = (S_1, \dots, S_N)$$

    ```


    A collection of all physical data items in a DDB is called a physical database:


    ```

    $\mathcal{D} = (x_{11}, x_{12}, \dots, x_{1c}; x_{21}, x_{22}, \dots, x_{2c};
    \dots, x_{n1}, x_{n2}, \dots, x_{nc}).$

    ```


    We say that a DDB is nonreplicated if any physical data item $x \in \mathcal{D}$
    does not have a copy resident on another site. We say that a DDB is completely
    replicated if any physical data item $x \in \mathcal{D}$ has a copy on every site.
    Finally, we say that a DDB is partially replicated if there are some data items
    $x \in \mathcal{D}$ which have copies on different sites.


    Each physical data item $x$ is, in general, in a sequence of versions:


    ```

    $x = x^0, x^1, \dots, x^q >$

    ```


    storing its consecutive values. The number of versions of a physical data item
    can be limited or not. If it is unlimited then modification of the data item value
    gives rise to its next version. If it is limited then modification replaces its
    oldest version. For every data item $x$ there always exists at least its version
    $x^0$. The values of all physical data versions comprise the database state.


    A physical data item $x$ is called moniversion if at any moment there exists only
    one version, otherwise it is called multiversion. A DDB is said to be moniversion
    if $x \in \mathcal{D}$ is a moniversion item; otherwise, it is said to be multiversion.


    A single version of a physical data item may be implemented as one or more access
    units to the disk storage. In practice, of virtual memory is usually assumed to
    be an access unit to the disk storage. Since the fragmentation of physical data
    item versions onto a set of access units is not relevant to concurrency control
    problems, we assume that each version is represented by a single access unit.'
  merge: -1
  pgno: 20
