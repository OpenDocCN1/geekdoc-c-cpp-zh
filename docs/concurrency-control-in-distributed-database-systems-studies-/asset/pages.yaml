    # 9.3 Hierarchical Multversion Timestamp Ordering Algorithm


    We present the hierarchical version of Reed''s multversion timestamp ordering
    algorithm proposed in [Car83]. As in Section 9.1, to simplify the algorithm being
    considered, we confines our presentation to its basic version of Reed''s algorithm
    presented in this section can be used to inspire a similar version in which the
    two-phase commitment is ignored. The hierarchical version of Reed''s algorithm
    is a modification of the timepad algorithm.


    In order to present the hierarchical multversion T/O algorithm we introduce the
    following terms. The set of all granules that succeed $x$ in the granularity hierarchy
    is denoted by $descendants(x)$; the set of all granules that precede $x$ in the
    granularity hierarchy is denoted by $ancestors(x)$. $Parent(x)$ refers to the
    granule immediately preceding $x$ in the granularity hierarchy. Each granule $x$,
    in its history $H_{rw}(x)$, has a $summary history$, denoted by $H_s(x)$. The
    summary history $H_s(x)$ is defined as follows:


    ```

    $H_s(x) = \bigcup \{H_{rw}(y) : y \in x \cup descendants(x)\}$

    ```


    The union can be interpreted graphically. The history $H_{rw}$ of a granule can
    be thought of as a timeline with the intervals in the history are line segments
    drawn on this timeline. The union of two or more histories'
