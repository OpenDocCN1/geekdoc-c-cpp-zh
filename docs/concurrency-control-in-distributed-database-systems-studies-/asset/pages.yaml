    ```


    A triplet of timestamps $(W-ts(x^k), R-ts(x^k), ER-ts(x^k))$ is called the *history*
    of the *version* $x^k$. in the same way as in Reed''s algorithm. The value of
    $R-ts(x^k)$ of a data item version $x^k$ read by a transaction is updated during
    its commit phase. The timestamp $W-ts(x^k)$ of a temporary data item version $x^k$
