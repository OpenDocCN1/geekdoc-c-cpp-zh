  md: '# 6.3. Snapshot Validation Algorithm


    According to the original Kung-Robinson algorithm the validation procedure of
    transaction $T$ against the set $T_{SF}(T) = \{T_i, T_j, T_k\}$ requires the following
    validation tests to be performed:


    ```

    $fw(T_i) \cap \{x, y, z, v, w\},$

    $fw(T_j) \cap \{x, y, z, v, w\},$

    $fw(T_k) \cap \{x, y, z, v, w\}.$

    ```


    The result of the modifications proposed in [UPS83], [PSU86] is a decreased size
    of the sets $fr(T)$. The modified validation algorithm requires only the following
    validation tests to be performed:


    ```

    $fw(T_i) \cap \{x, y\},$

    $fw(T_j) \cap \{x, y, z\},$

    $fw(T_k) \cap \{x, y, z, v, w\}.$

    ```


    ![](img/e304c9ea647471fa6dc1cba30e81bf9e_175_0.png)


    The second modification of the algorithm consists of the substitution of the validation
    procedure (serial or parallel) executed during transaction life by a number of
    snapshot validations. Snapshot validation is performed at the end of the write
    phase of each transaction. Let $T_i$ be a transaction finishing its write phase.
    At this moment each transaction $T_j$ currently performing its read phase is validated
    against $T_i$. To this end, the set $fr(T_j)$ containing the trace of data items
    read by $T_j$ until the end of $T_i$''s write phase is compared with the set $fw(T_i)$.
    If the intersection of these two sets is not empty $T_j$ is aborted since it read
    some data items updated by $T_i$, which can violate database consistency. Write
    and validation phases have to be contained in a critical section.


    Snapshot validation has the following advantages over the Kung-Robinson algorithm:


    +   (i) the number of transaction abortions is reduced,


    +   (ii) data access conflicts are detected earlier, thus preventing unnecessary
    transaction execution,


    +   (iii) transaction read-sets used for data access conflict detection are smaller
    and thus the detection is performed faster,'
