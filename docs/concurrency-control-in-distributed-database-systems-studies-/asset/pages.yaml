  md: '# Performance Evaluation of Resequencing Algorithms


    In this chapter we evaluate the performance of a set of algorithm which preserve
    the consistency of a distributed database using the principle of timestamp ordering.
    These algorithms have been introduced and discussed in Chapter 5.


    The primary measure of performance considered will be the delay induced by the
    algorithm itself, and more particularly the delay with which the transactions
    are effectively carried out.


    Consider one of the sites of the DDBS. It receives a sequence of transactions
    which affects the contents of the LDBS, or which inform the user of the contents
    of the LDBS. We assume that each transaction is identified by a timestamp, and
    that each site of the DDBS carries out the transactions in timestamp ordering.


    $T_1, T_2, \dots, T_n$, denote a sequence of transactions which enter the system
    via site and are directed to each of the DDBS sites via a network, and let $t_n$
    denote the timestamp associated with $T_n$. $t_n$ is also the instant at which
    transaction $T_n$ is admitted into the system or recognized by it. For some particular
    site, let $D_n$ be the total delay (often called the "network delay") separating
    the instant $t_n$ from the instant at which the transaction $T_n$ "arrives" at
    destination site or is recognized by it. $D_n$ can include both software delays
    and communication delays, and is a characteristic of the particular entrance and
    destination sites being considered and of the DDBS.


    The timestamp ordering algorithm at the particular site will retard the'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# 17. Performance Evaluation of Resequencing Algorithms


    transaction it receives at time $t_n + D_n$ until all updates whose timestamp
    is prior to $t_n$ have been received at the site.


    In the sequel we shall consider three algorithms which are “more general” than
    strict timestamp ordering, the latter being a special case of each of the three
    algorithms considered. Indeed in some practical situations, strict ordering may
    be unnecessarily severe certain transactions may be unrelated to each other. In
    general, we shall assume that each transaction needs to be ordered with respect
    to some subset of the preceding transactions.


    Three ways of constructing such a subset will be analyzed. First we shall consider
    a probabilistic precedence relation between the transactions $T_i$ with $i < n$,
    and $T_n$. Then we will assume $T_n$ is only concerned by the $T_i$ such that
    $t_i$ lies within a “window” $[t_n - s_i, t_n]$. We will propose that $T_n$ is
    only concerned by $T_{n-1}$ up to $T_{n-k}$ where $k$ takes a random value.


    Assuming Poisson arrivals for the sequence of timestamps, each of these cases
    will be analyzed. We then consider a more general arrival process, and include
    the transaction execution time at the $LDBS$ in the analysis of the algorithm.


    # 17.1 The Mathematical Model


    In this section we assume that transactions’ timestamps are generated according
    to a Poisson process with parameter $\lambda$. They are numbered by the order
    of their generation: the nth will be denoted by $T_n$ and it carries the timestamp
    $t_n$. Each $T_n$ enters the system via some site, then traverses a communication
    system (or network) and reaches the site where it must be executed after a delay
    $D_n$. Delays in the network are independent identically distributed random variables
    with distribution $F$ and density $f$. Thus, at the output of the network, i.e.
    at the $LDBS$, they arrive at instants that do not necessarily respect the timestamp
    order. They are then processed by the resequencing algorithm, so that the resequenced
