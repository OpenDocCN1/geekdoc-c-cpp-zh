    We present a distributed version of the Kung-Robinson algorithm [CO82].


    We assume that each transaction receives its identifier at the moment it is initiated.
    This identifier is assigned to all $T_i$ subtransactions $T^{S_k}, \dots, T_i^n$.
    Transaction validation is performed at two levels: local and global. The local
    level involves acceptance of each subtransaction $T^{S_k}$ locally at the site
    $S_k$ according to one of the validation procedures presented above. The global
    level involves acceptance of a distributed transaction $T_i$ on the basis of local
    acceptance of all subtransactions $T_i^k, \dots, T_i^n$. For this reason, each
    site maintains a record of the successive events at this site (information about
    the completion of read and write operations, commitment or abortion of subtransactions,
    etc.). By the use of the record, a set $HB(T_i^{S_k})$ is created for each subtransaction
    $T_i^{S_k}$, containing the identifiers'
