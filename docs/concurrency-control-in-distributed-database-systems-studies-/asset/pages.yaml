    # 4.3 Non Two-Phase Locking Algorithms


    As mentioned above, the 2PL algorithm is the optimal algorithm when the items
    in a DDB are independent of each other and represent the same level of abstraction.
    In reality, a DDB data structure is often more complex. For example, a DDB data
    structure may be a tree with vertices representing physical or logical relations
    between them, a directed graph, or a hypergraph. In these cases, transactions
    have access to data items in accordance with the DDB data structure. for, if arcs
    of the DDB data graph represent consistency constraints imposed on the data items
    then transactions have to access the entire set of data items for which the consistency
    constraints have been determined. A classic example of a database system with
    a hierarchical, tree structure is IBM’s IMS system [Gra78]. Other examples of
    such systems are given in [SK80], [PK79], [CM86], [DK83].


    As has shown in [PK79], [PK79], [SK80], [SK82], [KS83], [CM86], [DK83], additional
    information about the physical or logical structure of a DDB allows for the elaboration
    of locking algorithms that are not two-phase. We call “non-two-phase locking algorithms”
    may be somewhat misleading. It does not mean the term “non-two-phase” may be that
    every locked transaction resulting from a non-2PL algorithm is not two-phase.
    Locked transactions generated by a non-2PL algorithm can be both two-phase and
    non-two-phase.


    In comparison with the 2PL algorithm non-2PL algorithms affect DDBS performance
    in two opposite positions. On the one hand, they may need further restrictions
    on data accessibility to be imposed, since locking some data items that a transaction
    does not access can be necessary. Of course, additional restrictions on data accessibility
    reduces concurrency degree in the DDBSs . On the other hand, non-2PL algorithms
    allow data items to be unlocked before a transaction executes to completion if
    they are no longer necessary for this transaction. This naturally allows for a
    higher concurrency degree.


