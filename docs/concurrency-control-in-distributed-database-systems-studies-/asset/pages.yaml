  md: '# Multiversion Validation Method


    # 10.1 Multiversion Validation Algorithm


    In this chapter we present Muro''s multiversion validation algorithm and discuss
    the problems related to its implementation in DDDBs . All the multiversion validation
    algorithms proposed to date [Lau83], [LW84], [MKM84], [PSU86], [Rob82] have been
    designed to operate in centralized database systems.


    As indicated in Chapter 6 the validation method can be implemented in two ways:


    +   (i) by testing serialization graphs,


    +   (ii) by the use of a transaction validation procedure which is run during
    or after the execution of each transaction.


    Muro''s multiversion validation algorithm [MKM84] represents the first approach.
    The algorithm consists of testing the multiversion DMV-serialization graph DMVSRG
    . Recall from Section 2.2 that the acyclicity of this cycle is a sufficient condition
    of the multiversion serializability of a schedule. The DMVSRG is constructed by
    the use of the multiversion schedule graph MVSG (cf. Section 2.2), which in turn
    is updated each time a read or write request is granted.


    In Muro''s algorithm the multiversion schedule graph MVSG(mvs(r)=(V,A) is constructed
    and updated as follows:'
