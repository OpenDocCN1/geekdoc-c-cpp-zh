    # Garcia-Molina’s Locking Method


    # 11.1 Concept


    Garcia-Molina''s concurrency control method differs considerably from the methods
    presented in Chapters 4 through 10. It exploits directly the semantic concurrency
    control model presented and discussed in Section 2.3.


    So far we have assumed directly a syntactic concurrency control model, in which
    a concurrency control algorithm utilizes purely syntactic information concerning
    the DDBS, i.e. the only information it has at its disposal is the information
    about the DDB data structure and about the identifiers of data items accessed
    by transactions. Moreover, it is assumed that a transaction is a partially ordered
    set of read and write operations. The correctness criterion of a schedule is based
    on the serializability. When we say that a concurrency control algorithm is correct
    with respect to the serializability, we mean that it preserves database consistency
    for any set of consistency constraints, for any set of transactions and for any
    computations performed by the transactions.


    In the semantic model of concurrency control it is assumed that a concurrency
    control algorithm, apart from syntactic information, has also semantic information
    about the computations performed by the transactions at its disposal. This additional
    semantic information about transactions permits the relaxation of the restrictive
    conditions of the serializability criterion and the use of more general correctness
    criteria, of which serializability is a special case. These criteria permit a
    higher degree of concurrency by including'
