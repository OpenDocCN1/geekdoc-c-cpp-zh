    So far we have limited the scope of our examples to the syntactic concurrency
    model in which one object was defined (Data-Item) and two operations (read and
    write). We now present three examples showing the specification of consistent
    schedules for three other objects: Stack, Directory and FIFO-Queue. In this case
    we deal with a semantic concurrency model since a specification of consistent
    schedules requires explicit information about the semantics of the operations
    performed on the objects.


    # Example 12.6


    Reconsider the object Stack with two operations: Push(St,t) and Pop(St) (cf Example
    12.2). Eight dependency relations can be defined for this object:


    +   * $T_i \prec_{\Delta_1} T_k$ pushes an element $x$ on the stack and $T_k$
    subsequently pushes another element $y$ on the stack;


    +   * $T_i \prec_{\Delta_2} T_k$ pushes an element $x$ on the stack and $T_k$
    subsequently pushes the same element $x$ on the stack;


    +   * $T_i \prec_{\Delta_3} T_k$ pushes an element $x$ on the stack and $T_k$
    returns the same element $x$ from the stack;


    +   * $T_i \prec_{\Delta_4} T_k$ pushes an element $x$ on the stack and $T_k$
    returns another element $y$ from the stack;


    +   * $T_i \prec_{\Delta_5} T_k$ returns an element $x$ from the stack and $T_k$
    subsequently pushes another element $y$ on the stack;


    +   * $T_i \prec_{\Delta_6} T_k$ returns an element $x$ from the stack and $T_k$
    subsequently pushes another element $y$ on the stack;


    +   * $T_i \prec_{\Delta_7} T_k$ returns an element $x$ from the stack and $T_k$
    subsequently returns the same element $x$ from the stack;


    +   * $T_i \prec_{\Delta_8} T_k$ returns an element $x$ from the stack and $T_k$
    subsequently returns another element $y$ from the stack.


    Note that the set of dependency relations depends not only on the semantics of
    the operations but also on the arguments of these operations.

    The set of proscribed dependency relations is the following:


    $P_{Stack} = \{\Delta_1, \Delta_3, \Delta_5, \Delta_8\}$.'
