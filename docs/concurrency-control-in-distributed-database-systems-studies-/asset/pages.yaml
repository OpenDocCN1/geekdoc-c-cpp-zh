    # 5.3 Conservative Timestamp Ordering Algorithm


    The conservative timestamp ordering algorithm has been designed to reduce the
    number of abortions in the $T/O$ method [BSR80], [BG80], [BG81], [CP84], [GS79],
    [KNTH79]. Note that the order of execution assumed a priori lead to permanent
    aborting and restarting transactions that access data items in an order that is
    inconsistent with the timestamp order. This is especially common of data dependent
    transactions that dynamically generate data requests, during their execution.


    In conservative $T/O$ algorithms an access request is accepted only if it does
    not cause any transaction in the system to restart. To eliminate restarts, operations
    of more recent transactions are buffered until conflicting operations of all older
    transactions have been executed. This requires each site to communicate with all
    other sites in order to gather information about the set of transactions currently
    being processed.


    We present below the conservative $T/O$ algorithm proposed in [BG80]. Each $DM_k$
    module has associated with it a set of $2*N$ queues which contain access requests
    from transactions initiated in $N$ modules $TM_1, \dots, TM_N$.'
