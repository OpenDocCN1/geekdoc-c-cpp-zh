  md: '# 2. Concurrency Control Models


    # 2.2 Multiversion Serializability


    In this section we consider the problem of schedule correctness in multiversion
    DDBs . As mentioned in Section 1.1, in a DDB each write operation on a data item
    x creates its new version. Thus, any subsequent read operation of the data item
    x may read any of its currently existing versions. A formal specification of a
    multiversion schedule of a transaction must therefore contain a mapping of the
    data item read operations into the data item read operations.


    We introduce a formal definition of a multiversion schedule of a set of transactions
    [BG83a], [BG83b], [Lau83], [MKM84].

    A multiversion schedule mvs of a set of transaction r is a triple


    mvs(r) = (T(r), h, <mvs>)


    where


    +   (i) T(r) = U_i T_i ∪ T_f is the set of all database operations involved in
    the transactions of the set r extended by the database operations

    T_0 = {wo_j(x) : x ∈ D} and {r_ij(x) : x ∈ D} of two hypothetical initial and
    final transactions T_0 and T_f which respectively write the initial state of the
    DDB and read the final state of the DDB;

    (ii) h is a function which maps each read operation r_ij(x) ∈ T(r) into a write
    operation w_ki(x) ∈ T(r)

    (iii) <mvs = U_i <T_i is a partial order relation over T(r) such that

    * if T_i <T_k then T_ij <mvs T_k,

    * if h(r_ij(x)) = w_ki(x) w_ki(x) <mvs r_ij(x).


    Function defined above maps operations of a data item into the write operation
    of a version of this data item — more precisely — into the write operation that
    created the version of the data item read. Relation <mvs> is defined by two conditions.
    First <mvs> honors all orderings stipulated by transactions of the set r. The
    second one states that a transaction cannot read a version of a data item until
    it has been created.


    A graph similar to the one we used for monoverversion schedules can be used to
    represent multiversion schedules.

    A multiversion schedule graph is a directed graph MVSG(s(r)) = (V,A) whose vertices
    V corresponds to the set of database operations T(r)'
