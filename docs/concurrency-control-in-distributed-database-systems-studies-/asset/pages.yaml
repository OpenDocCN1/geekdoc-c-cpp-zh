    The second modification of the $2PL$ algorithm consists of the introduction of
    the locking precondition which is tested whenever a lock is requested on a data
    item. The locking precondition is defined as follows:


    # Locking precondition


    Transaction $T_i$ is allowed to lock data item $x$ if and only if $TS(T_i) \leq
