  md: '# 2

    Concurrency Control Models


    In Chapter 1 we presented a DDB model and a transaction model and\introduced the
    concept of database consistency. In this chapter we deal with

    a set of transactions $r$.


    We have already mentioned that one of the primary causes of the violation of DDB
    consistency is improper concurrent execution of a set of transactions. A concurrent
    execution of a set of transactions requires control of\he way in which database
    operations originating from different transactions interleave. This control, called
    concurrency control, consists of a schedule of the database operations, which
    is a formal description of the execution of transaction set $r$. In a schedule
    only database operations originating from the committed transactions appear. Database
    operations originating from aborted transactions are disregarded since an aborted
    transaction has no effect on the DDB state (cf. the property of transaction atomicity).


    Any schedule is a result of the application of a concurrency control algorithm
    to the set of transactions. The size of the set of different correct schedules
    generated by a concurrency control algorithm is a measure of the concurrency degree
    it provides, and thus, a measure of its quality [Pap79], [KP81].


    The size of the set of correct schedules generated by a given concurrency control
    algorithm is a function of the information that it has at its disposal: information
    about the structure and organization of the DDB, about the consistency constraints
    imposed on the DDB, about the set of database operations involved in transactions,
    about the computations performed by'
