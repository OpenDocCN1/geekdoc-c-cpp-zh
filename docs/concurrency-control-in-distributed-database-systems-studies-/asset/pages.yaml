    # 17.3 Practical Implications of the Analysis


    Throughout the results presented in Figures 17.1, 17.2, and 17.3, we see that
    the probability $w(0)$ of not waiting due the resequencing algorithm decreases
    as the rate at which transactions are generated increases. This is true both for
    the case where resequencing is strict ($p=1$ for Case I, $\gamma=0$ for Case II,
    $q=0$ for Case III) and when there is only partial ordering.

    The results we present also exhibit strong sensitivity of the results to the average
    network delay $1/\mu$. As $\mu$ increases, the average resequencing delay decreases.
    Of course, our choice of an exponentially distributed network delay for the numerical
    examples, while the theoretical results are obtained for a generally distributed
    network delay given by the distribution function $F(y)$. Consider an extreme case
    where the network delay is equal to some constant $d$:


    ```

    $F(y)=0$ for $y<d, F(y)=1$ for $y\ge d$

    ```


    From (17.1), we have


    ```

    $w(x)=e^{-\lambda d}pd\lambda e^{\lambda pd}, x\ge 0$

    ```


    ```

    $w(x)=1$

    ```


    which indicates that the resequencing delay is zero in this case, as expected
    since every transaction arrives in proper sequence ! In general, we expect that
    the average resequencing delay will increase as the $variance$ of the network
    delay increases.'
