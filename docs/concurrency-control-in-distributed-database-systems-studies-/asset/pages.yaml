    # References


    Relevant references on the effects of granularity on locking policies and their
    performance include [GST83], [RS79], and [SS81]. Many issues in this important
    area remain yet to be completely resolved. For instance, it would be useful to
    have a thorough theoretical basis to make choices concerning the "best" granularity
    level at which one should implement locking policies.


    Indeed, one''s intuition indicates that if the granules used for locking are too
    small, the overhead associated with their management and locking or even schema
    level in a relational database system then the level of concurrency for transaction
    processing will be excessively low. Issues related to "locality of reference"
    of transactions to the data they access, as well as the amount of write with respect
    to read operations obviously are relevant to the problem. A complete and satisfactory
    theoretical treatment of this problem is not yet available.


    The presentation in this chapter follows closely the work presented in [CGM83].'
