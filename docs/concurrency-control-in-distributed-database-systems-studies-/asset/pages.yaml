  md: '# 6 I Distributed Database System Model


    Mutual relations among logical and physical data items, and access units are given
    in Figure 1.1.


    Thus we see that a distributed database DDB has been defined as a quadruple:


    $(\mathcal{L}, D, S, Loc)$


    where:


    $\mathcal{L} = (X_1, X_2, \dots, X_n)$ is a set of logical data items called the
    logical database;


    $\mathcal{D} = (z_{11}, \dots, z_{1c1}, \dots, z_{i1}, \dots, z_{ic}, \dots, z_{n1},
    \dots, z_{nc})$ is a set of physical data items called the physical database;


    $S = (S_1, \dots, S_N)$ is the collection of sites;


    $Loc : D \rightarrow S$ is a function that determines the site where each physical
    data item is stored.


    Henceforth, if there is no danger of confusion, by a "data item" we mean a "physical
    data item".


    We now introduce the concept of a distributed database management system. For
    this purpose we first define the notion of a local database. By a Local Database
    $LDB_k$ we mean the collection of all data items stored at the site $S_k$


    $LDB_k = \{x_{ij} : x_{ij} \in D \ \wedge Loc(x_{ij}) = S_k\}$.


    Each LDB is controlled by an autonomous Local Database Management System (DBMS).
    The DDBS is controlled by the Distributed Database Management System (DDBMS) which
    organizes the cooperation of logically independent and autonomous DBMSMS.


    Let us emphasize that the notion of "distribution" refers to both the DDB and
    to the DDBS. In fact, the decentralization and distribution of the management
    system is one of the basic features distinguishing distributed database systems
    from centralized ones (cf. Section 1.4).


    # 1.2 Distributed Database Consistency


    An important goal of a DDBMS is to maintain the correctness of mutual relations
    between the data items stored in the DDB, i.e. preserving its consistency and
    integrity $^1$ [BG80], [BG81], [Cas81], [CP84], [Dat82], [Dat83],


    > $^1$Further on we will exclusively use the term "consistency" to mean both "consistency"
    and "integrity".'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 1.2. Distributed Database Consistency


    [Gar80], [Hol81], [Koh81], [Lin79], [Par77], [TGGL82], [Ull82].nThere are three
    sources of the violation of DDB consistency:


    +   - incorrect concurrency control of programs requiring access to the red data
    items;


    +   - hardware or software failures leading to the partial or complete crash of
    the system;


    +   - erroneous programs.


    Problems due to system crashes and program errors are not considered in this book.
    Our main concern will be the violation of DDB consistency due to incorrect concurrency
    control.


    We distinguish between internal and external DDB consistency: [CP84], [Dat82],
    [Dat83], [Gar80], [Par77], [TGGL82]. Internal consistency is determined by the
    set of static and dynamic consistency constraints imposed on the semantics of
    a logical database.


    Static consistency constraints determine a set of admissible DDB states. For example,
    for a relation


    EMPLOYEE (EMP-No, ADDRESS, SALARY, AGE, MARITAL-STATUS )


    a static consistency constraint may be:


    > “ values of the attribute AGE belong to the interval <16,66>”,


    or :


    > “ values of the attribute SALARY are always greater than zero”.


    Dynamic consistency constraints determine a set of admissible transitions between
    DDB states. For example, in the above relation the following transitions may be
    admitted:


    ![](img/e304c9ea647471fa6dc1cba30e81bf9e_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# I. Distributed Database System Model


    Another example of a dynamic consistency constraint is the following:


    “successive values of the attribute AGE can only be increasing”.


    The problem of preserving DDB internal consistency is essentially the same as
    in centralized databases. In practice, very few centralized systems (see [SB83])
    are equipped with a mechanism for defining and setting consistency constraints.
    In DDBs the situation can be even worse [CP84].


    The external consistency problem is specific to DDBs [CP84], [Gar80], [TGL82].
    We say that a DDB is in state of external consistency if the values of all physical
    copies $x_{i1}, x_{i2}, ..., x_{ic}$ of every logical data item $X$, are identical.
    A mechanism guaranteeing external DDB consistency can not consist simply in the
    procedures for testing DDB states, since this would require blocking the whole
    system before updating every data item. Therefore, to solve the problem of DDB
    consistency the concept of a “transaction” has been introduced.


    # 1.3 Transaction Model


    A transaction is the execution of a program containing database operations by
    two markers beginning and ending the transaction [GD85], [Gra80], [Gra81], [Mos81],
    [SS83], [SS84], [TGGL82], [Ull82], [BHG87].


    Two particularly important database operations are read and write. The read operation
    $r(x)$ returns the value of a version of the data item $x$, usually the last version.
    The write operation $w(x)$ creates a new version of the data item $x$. This new
    version replaces the old one (the case of a monoversion DDB), or replaces the
    oldest one (the case of a multiversion DDB with a fixed number of data item versions)
    or is added to the DDB (the case of a multiversion DDB with an unlimited number
    of data item versions).


    Transactions containing no write operations are called queries; transactions containing
    write operations are called updates.


    In general, database operations can be executed concurrently (i.e. in parallel)
    within a transaction. The set of database operations composing a transaction can
    be unknown at the moment of its initialization, but determined dynamically during
    its execution. We say that a transaction is data-dependent. This occurs if a transaction
    contains, for example, a statement such as:


    ```

    “if X > 0 then update Y, otherwise update Z”.

    ```'
