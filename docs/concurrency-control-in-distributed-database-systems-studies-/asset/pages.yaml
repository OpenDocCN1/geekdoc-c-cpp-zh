  md: '# 4. Locking Method


    data item, it is allowed to be locked by one of the requesters (eg. the first
    one in the FIFO order). A deadlock is detected by circulating a message, called
    probe, through the deadlock cycle. A probe is generated by the DM module at the
    site where the antagonistic conflict has occurred. A probe can be interpreted
    as an ordered pair <initiator, junior>, where initiator denotes the requester
    faced the antagonistic conflict, triggering the deadlock detection procedure and
    Junior denotes the youngest transaction which has traversed. A probe can only
    be sent in the following two directions: DM -> TM, when a DM module sends a probe
    to the holder of its data; and TM -> DM, when the DM module supervising the execution
    of a transaction $T_i$ sends a probe to the DM module from which it is waiting
    to receive the lock grant. Moreover, each transaction $T_i$ supervised by a DM
    maintains a queue, called PROBQ($T_i$), where it stores all probes. The PROBQ($T_i$)
    contains information about the transactions which wait for $T_i$, directly or
    transitively. The arc racing algorithm is assumed that each transaction is serial
    (cf. Section 1.3). This means that the requests for locks on successive data items
    are issued sequentially. Thus, a transaction $T_i$ may have only one ungranted
    lock request. Transactions can be in one of two states: waiting or running. A
    transaction is waiting if its lock request waits in a queue, otherwise it is running.


    We now present a simplified version of the arc racing algorithm, in which we ignore
    the distinction between read and write locks, and the management of WQ queues.
    Details of the arc racing algorithm can be found in [SN84].


    # Arc chasing algorithm


    +   The DM module at a site initiates a probe in the following two situations:

    (i) the DM module has received a request from a transaction $T_i$ to set a lock
    on a data item $x$ previously locked by $T_j$, and $TS(T_i) < TS(T_j)$. The probe
    is sent to the transaction $T_j$;n(ii) the data item $x$ in the DM module has
    been unlocked by a transaction $T_k$, which was its holder and locked by a transaction
    $T_j$. The DM module sends a probe to all transactions $T_i$ whose lock requests
    for $x$ are still waiting in the queue WQ and whose $TS(T_i) < TS(T_j)$.'
