  md: "# 6.2. Kung-Robinson Validation Algorithm\n\n# 6.2 Kung-Robinson Validation\
    \ Algorithm\n\nIn this section we present the validation algorithm designed by\
    \ Kung and Robinson [KR81]. Historically, it was the first algorithm to use the\
    \ concept of validation of an entire transaction, not of a single operation as\
    \ earlier algorithms did [Bad79], [Cas81], [BG82].\n\nWe first consider this algorithm\
    \ in the centralized database environment. The execution of a transaction according\
    \ to the Kung-Robinson algorithm proceeds in three phases: a read phase, a validation\
    \ phase and a write phase. Read and write phases were explained in the previous\
    \ section so we focus on the validation phase. Two validation algorithms were\
    \ proposed in [KR81]: serial validation and parallel validation.\n\nWe begin by\
    \ presenting the serial validation algorithm. Each transaction $T_i$ is assigned\
    \ a unique identifier $TC(T_i)$ which is not a timestamp, but a transaction number.\
    \ Transaction identifiers are taken from the global transaction counter, denoted\
    \ by $GTC$. A transaction is assigned the identifier after successfully completing\
    \ the validation phase.\n\n$TC_{start}(T_i)$ denote the largest transaction identifier\
    \ generated in the system at the moment $T_i$ is initiated and $TC_{finish}(T_i)$\
    \ denote the largest transaction identifier generated in the system at the time\
    \ $T_i$ begins its validation phase. Transactions whose identifiers are:\n\n$TC_{start}(T_i)\
    \ + 1, TC_{start}(T_i) + 2, \\dots, TC_{finish}(T_i)$\n\n$T_{SF}(T_i) = \\{T_k\
    \ : TC(T_k) \\in \\{TC_{start}(T_i) + 1, \\dots, TC_{finish}(T_i)\\}\\}$\n\nFinally,\
    \ the set of data items to be read by the validation transaction $T_i$ is denoted\
    \ by $fr(T_i)$, whereas the set of data items to be written by $T_i$ is denoted\
    \ by $fw(T_i)$.\n\nThe serial validation algorithm is as follows:\n\n```\nprocedure\
    \ S-Validate$(T_i)$;\nbegin\n  $TC_{finish}(T_i) \\leftarrow GTC$;\n  test $\\\
    leftarrow true$;\n  for each $T_j \\in T_{SF}(T_i)$ do\n    if $fr(T_i) \\cap\
    \ fw(T_j) \\neq \\emptyset$ then test $\\leftarrow false$;\n```"
