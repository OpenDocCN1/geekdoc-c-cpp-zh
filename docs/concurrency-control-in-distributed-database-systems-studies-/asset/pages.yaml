  md: "# 2.1. Serializability\n\ncorrectness criterion called D-serializability² [BSW79],\
    \ [EGLT76], [Kel83], [Pap79], [Yan84].\n\nThe main difference between serializability\
    \ and D-serializability concerns the notion of schedule equivalence. The D-serializability\
    \ criterion uses the notion of schedule equivalence in a narrow sense. Schedule\
    \ equivalence in a narrow sense is a sufficient but not necessary condition of\
    \ schedule equivalence defined above. Thus, D-serializability is a stronger requirement\
    \ than serializability, i.e. it more restricts the concurrency degree. On the\
    \ other hand, the D-serializability problem belongs to the class of polynomial\
    \ problems for all transaction models. Thus, using this criterion it is possible\
    \ to construct computationally efficient procedures to examine schedule correctness.\
    \ This is why the D-serializability criterion is used in practice instead of the\
    \ serializability criterion.\n\nIn order to define D-serializability we first\
    \ define schedule equivalence in the narrow sense as the equivalence of data access\
    \ conflicts [BSW79], [BG80], [BG81], [Cas81], [CB81], [EGLT76], [Kel83], [Pap79],\
    \ [Yan84], [Vid87].\n\nWe say that two databases $T_{ij}$ and $T_{kl}$ are in\
    \ a data access conflict with respect to a data item $x$, denoted by $T_{ij} \\\
    xrightarrow{x} T_{kl}$, if both their access data item $x$ and at least one of\
    \ them is write. Two transactions $T_i$ and $T_k$ are in a data access conflict,\
    \ denoted by $T_i \\xrightarrow{x} T_k$, if there exists a data item $x$ and operations\
    \ $T_{ij} \\in T_i$ and $T_{kl} \\in T_k$, such that $T_{ij} \\xrightarrow{x}\
    \ T_{kl}$. It follows from the definition of a schedule that all conflicting database\
    \ operations must be executed. Therefore, we can define two precedence relations\
    \ — one over all conflicting database operations and the other over conflicting\
    \ transactions.\n\n$T_i$ precedes $T_{kl}$ with respect to a data item $x$ in\
    \ a schedule $s(\tau)$, denoted by $T_{ij} \\xrightarrow{x} T_{kl}$, if $T_{ij}\
    \ \\xrightarrow{x} T_{kl}$.\n\nTransaction $T_i$ precedes $T_k$ in a schedule\
    \ $s(\tau)$, which is denoted by $T_i \rightarrow T_k$, if there exists a data\
    \ item $x$ and database operations $T_{ij} \\in T_i$ and $T_{kl} \\in T_k$, such\
    \ that $T_{ij} \\xrightarrow{x} T_{kl}$.\n\nIt is clearly noticed that the precedence\
    \ relation $\rightarrow$ partially orders the set of transactions $\tau$.\n\n\
    Using the precedence relation $\rightarrow$, we can now formulate the D-serializability\
    \ criterion [BSW79], [BG81], [EGLT76], [Pap79], [Yan84].\n\n> Other names for\
    \ the D-serializability that have been used in the literature are: CPSR, CSR,\
    \ or DSR serializability [BG80], [BG81], [Cas81], [CB81], [Kel83]."
