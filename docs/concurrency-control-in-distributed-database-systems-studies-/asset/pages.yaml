    criterion to be violated. Transaction $T_k$ reads data item $y$ after it has been
    updated by $T_i$; thus, $T_i \xrightarrow{y} T_k$. Since data items in the Kung-Robinson
    algorithm are updated according to the order of transaction identifiers, any data
    item $z$ such that


    ```

