  md: "# 2.3. Multilevel Atomicity\n\nSecond, assuming the serializability criterion,\
    \ only independent transactions are allowed in a DDBS. In some DDBS applications\
    \ users' programs require a set of dependent transactions, i.e. cooperating with\
    \ one another, Then the serializability criterion is inadequate and has to be\
    \ replaced by another one.\n\nThird, in some cases of DDBS users are satisfied\
    \ with schedules a partially inconsistent view of the database [Gra78], [SS84],\
    \ schedules which therefore do not require the serializability. A user defines\
    \ a level of database consistency that is necessary for his/her application [GLPT75],\
    \ [LBS86].\n\nIn this section we consider the problem of consistent nonserializable\
    \ schedules with the reference to the first of the cases above. We will ignore\
    \ the case of cooperating transactions since the results obtained to date in this\
    \ field are only preliminary and any generalizations will be [GD85]. We will also\
    \ skip the case of inconsistent, user accepted schedules because of its exceptional\
    \ and limited character.\n\nWe now present the problem of specifying and verifying\
    \ consistent nonserializable schedules. We explain for precision that these schedules\
    \ are nonserializable in general whereas a particular instance may be serizable.\
    \ In this section we use the approach proposed by Garcia-Molina in [Gar83] and\
    \ later generalized by Lynch in [FGL82], [Lyn83].\n\nIt might seem possible to\
    \ solve the problem of specifying consistent nonserializable schedules, that is\
    \ the problem of specifying the set C($\tau$), by specifying all consistency constraints\
    \ imposed on a DDB. Such a solution, however, is impossible for three reasons.\n\
    \nFirst, using exclusively the knowledge of consistency constraints it is practically\
    \ impossible to control concurrency on-line. This follows from the fact that a\
