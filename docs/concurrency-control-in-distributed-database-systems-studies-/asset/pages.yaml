    # # Performance Evaluation of a Global Locking Policy


    In this Chapter we consider the performance of a global locking policy in a *LDBS*.
    According to this policy, the complete set of data items which a transaction will
    access must be known before transaction execution. The execution of a transaction
    is allowed if it can acquire all of these items, which are locked and hence reserved
    for the transaction until it terminates. Transactions which require distinct sets
    of data items are allowed to execute concurrently.


    The smallest unit of data addressable by a transaction will be called a granule.
    The global locking policy obviously avoids deadlocks between transactions. However
    it does not prevent permanent blocking, (or famine) i.e. the permanent exclusion
    of certain transactions from being able to be executed in the database. Its main
    advantage is its simplicity. Its major disadvantage is that granules are locked
    by a transaction for the whole duration of its execution, when in fact they may
    be necessary to the transaction for only a fraction of that time. Furthermore,
    it may not always possible to know in advance all of the data items which a transaction
    may need.


    # ## 15.1 The Model Assumptions


    We shall consider a *LDBS* containing $D$ granules, to which transactions arrive
    according to a Poisson process. Each transaction belongs to a class $c$, and there
    is a total number $K$ of classes ($1 \le c \le K$). A transaction class is defined
    by the number of granules requested and locked by each'
