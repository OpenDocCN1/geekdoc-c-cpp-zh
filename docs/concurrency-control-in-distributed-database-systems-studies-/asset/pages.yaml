    \ $T_k$ and all the arcs incident to it to be removed from the $MVSRG$ graph,\
    \ the commitment condition is equivalent to the requirement that the vertex of\
    \ the $DMVSRG$ graph representing $T_k$ has no incoming arcs.\n\nThe problem of\
