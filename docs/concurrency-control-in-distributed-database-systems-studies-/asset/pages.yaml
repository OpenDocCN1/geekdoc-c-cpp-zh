    it means that synchronization message $v(S_i, T_j)$ was generated for a transaction
    $T_j$. If the priority of $T_i$ is lower than the priority of $T_j$, then $v(S_k,
    T_i)$ is delayed in the internal queue at site $S_i$ until $T_i$''s completion.
    Otherwise $v(S_k, T_i)$ can continue to process since $v(S_i, T_j)$ will be delayed
    at the site $S_k$. When a commit message $p(S_k, T_i)$ is generated at the site
    $S_k$, it is associated with two states:


    +   - negative, if the internal queue of $S_k$ is not empty, to indicate that
    each site must perform the commit of $T_i$ and must remain in the same state (active
    or passive);

    - positive, otherwise, to indicate that after the commitment of $T_i$, the site
    returns to the idle state, if it was passive.


    The precaution ensures that the update transactions of the lowest priority, delayed
    at site $S_k$, will be executed to completion.

    Let us summarize the successive steps of the ring algorithm. We consider an update
    transaction $T_i$ initiated at a site $S_k$.


    # Ring algorithm


    +   (i) If site $S_k$ is active or passive $T_i$ is delayed in the external queue
    at site $S_k$. If $S_k$ is idle it becomes active, and $v(S_k, T_i)$ is sent to
    the successor of $S_k$ in the ring.

    (ii) When $v(S_k, T_i)$ reaches site $S_i$:


    +   - if $S_i$ is idle, it becomes passive,

    - if $S_i$ is passive, it remains passive,

    - if $S_i$ is active and $\pi(S_i) > \pi(S_k)$, it remains active,

    - if $S_i$ is active and $\pi(S_i) < \pi(S_k)$, it remains active and $v(S_k,
    T_i)$ is delayed in the internal queue at site $S_i$.


    Except if $v(S_k, T_i)$ is delayed, $v(S_k, T_i)$ is sent to the successor of
