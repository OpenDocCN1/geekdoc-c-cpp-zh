    $LR$ lock on it that


    ```

    $ts(x^k) = max\{ts(x^l) : ts(x^l) \leq TS(R_j)\};

    ```


    +   (vi) an update transaction $W_i$ reads the version $x^k$ of a data item $x$
    after setting an $LW$ lock on it that


    ```

    $ts(x^k) = max\{ts(x^l) : ts(x^l) \leq TS(W_j)\};

    ```


    +   (vii) a data item $x$ may be unlocked at any moment.'
