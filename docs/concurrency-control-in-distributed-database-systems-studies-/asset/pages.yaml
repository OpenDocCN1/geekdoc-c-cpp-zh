  md: '# 4.3. Non Two-Phase Locking Algorithms


    related to the notion of the DDB data structure.


    Let $\Delta$ denote a collection of DDB data structures. A locking policy on $\Delta$
    is understood as a family of locking algorithms, such that each data structure
    in $\Delta$ has a corresponding locking algorithm. In other words, a locking policy
    generates an appropriate locking algorithm for a given data structure.


    We now present two locking policies: the guard policy and the hypergraph policy.
    The guard policy is a special case of the hypergraph policy, which is the most
    general of the currently known locking policies. There are two types of guard
    policies: homogeneous and heterogeneous. A guard policy is homogeneous if the
    set of transactions is homogeneous in the sense that each transaction can request
    both read and write locks. A guard policy is heterogeneous if the set of transactions
    is split into two disjoint subsets: the subset of queries and the subset of update
    transactions. In this policy a query can only request read locks, unless is admitted.
    In this section we present the guard policy which is more general. We present
    it in two versions, the first, when lock conversion is not admitted, and the second,
    M-pitfall guard policy, when lock conversion is admitted.


    A guard policy concerns databases whose data structure is a guarded graph. A guarded
    graph is a directed acyclic graph $G = (V, A)$ whose set of vertices correspond
    to the set of all items in the DDB and whose arcs correspond to locking rules:
    if $(x_{ij}, x_{ki}) \in A$ then data item $x_{ki}$ can be locked only after $x_{ij}$
    has been locked.


    Formally, an acyclic directed graph $G = (V, A)$ is a guarded graph if with each
    vertex $v_k \in V$ there is associated a set (in particular empty) guard$(v_k)$
    of pairs:


    ```

    $guard(v_k) = {< PL_k^L, AL_k^L, < PL_2^L, AL_2^L>, ..., < PL_{n_k}^L; AL_{n_k}^L>}^1$

    ```


    satisfying the following conditions:


    +   (i) $0 \neq AL_k^L \subseteq PL_k^L \subseteq V$


    +   (ii) vertices contained in $PL_k^L, PL_2^L, ..., PL_{n_k}^L$ immediately precedes
    $v_k$;


    +   (iii) for any $i, 1 \leq i \leq n_k$, graph $G$ contains a bi-connected component
    including $PL_k^L$;


    > $1 PL$ is an acronym for "previously locked";AL$ is an acronym for "actually
