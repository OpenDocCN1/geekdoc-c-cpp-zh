    # 12.2 Algorithm


    The synchronization algorithms for the abstract data types can use different concurrency
    control methods: locking [SS84], [Her86], [SDD*85], [BR87], timestamp ordering
    [Her86c], [Her86a], or validation [GM85]. In this section we present an abstract
    data type synchronization algorithm which is based on locking.


    Each transaction, before it is permitted to access an object and operate on, must
    obtain a lock on it. The purpose of locking is to limit the set of possible concurrent
    schedules as to prevent cycles dependency relations between transactions. When
    two transactions request access to the same object, a proscribed dependency relation
    is prevented from occurring by restricting access to the object by the transaction
    that does not hold a lock on until the transaction holding releases it. In other
    words, locking guarantees that for any schedule of a set of transactions that
    request concurrent access to an object O the proscribed dependency relation <Po
    for this object is acyclic.


    The easiest way to guarantee that the compound proscribed dependency relation
    <p be acyclic for any schedule of a set of transactions that request concurrent
    access to a set of objects {O1,O2,...,Ok} is to use two-locking. In the abstract
    data type synchronization algorithm a type-specific lock class is defined for
    each object which corresponds to the set of operations on it. As shown in the
    previous section, the set of proscribed dependency relations for an object depends
    on both the semantics of the operations and on its dynamics. Thus, each consists
    of two elements: lock type and lock argument. The lock argument is the value of
    the object. Let us recall that in the usual locking algorithm the lock argument
    is the identifier of an object (data item) that the transaction accesses, not
    its value. To represent a lock, we use the following notation: Lock-Type(argument).'
