    procedure is then initiated. The occurrence of a cycle that contains the vertex
    $EXT_k$ in a $LWFG(S_k)$ graph, signifies a potential deadlock. The selection
    rules are then applied and, if necessary, a message about a potential deadlock
    at $S_k$ is generated. It is easy to notice on the basis of the selection rules
    presented above that transmitting messages proceeds sequentially along a path
    connecting sites that are in a hypothetical deadlock.

    The detailed algorithm of an iteration of the $GWFG$ graph construction performed
    at site $S_k$ is the following:


    # OberMack''s deadlock detection algorithm


    +   (i) construct the $LWFG(S_k)$ graph;


    +   (ii) on receiving a message from vertex $S_i$ update the $LWFG(S_k)$ graph
    in the following way:


    * update the set of vertices of $LWFG(S_k)$ graph with all the subtractions mentioned
    in the message which are not yet included;

    * update the set of arcs of the $LWFG(S_k)$ graph with all the arcs mentioned
    in the message.


    The updated $LWFG(S_k)$ graph contains all vertices and arcs of $LWFG(S_i)$.


    +   (iii) if the $LWFG(S_k)$ graph includes a cycle that does not contain the
    vertex $EXT_k$, initiate the deadlock elimination procedure;


    +   (iv) if the $LWFG(S_k)$ graph includes a cycle that contains the vertex $EXT_k$,
    apply the selection rules. If necessary, transmit a message about a potential
    deadlock to site $S_i$ determined by the selection rules.


