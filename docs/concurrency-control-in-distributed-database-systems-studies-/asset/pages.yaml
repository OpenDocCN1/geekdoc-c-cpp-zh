    It was mentioned in Chapter 3 that the basic methods for lock conflict resolution
    in distributed systems are transaction abort and transaction killing. As shown
    in Figure 4.15, this may provoke the occurrence of two other DDBS performance
    failures, namely, cyclic and infinite restarting. These failures were defined
    and illustrated in Chapter 3 where we also presented a general method for resolving
    cyclic and infinite restarting proposed in [CM85]. We now present an implementation
    of this method in the context of locking algorithms taking as an example the $2PL$
    algorithm.


    The first modification of the 2PL algorithm necessary for cyclic and infinite
    restarting prevention consists of its extension by the mechanism of data and transaction
    marking. Recall that a transaction is marked if the number of its restarts exceeds
    the value of a predefined restart indicator. A transaction is considered to be
    involved in infinite or cyclic restarting.'
