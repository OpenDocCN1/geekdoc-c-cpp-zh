    Figure 4.15: Classification of the DDBS performance failures


    (iii) "kill" option - transaction T causes an abortion of the transaction currently
    holding a lock on a requested data item and sets its own lock on it.


    Figure 4.15 shows DDBS performance failures and the methods of lock conflict resolution
    that cause them.


    The wait option may cause deadlock and permanent blocking. The abort and kill
    options may cause cyclic and infinite restarting. The locking method, therefore,
    must involve additional mechanisms for preventing or detecting possible failures.


    We now introduce and briefly discuss some selected schemes for resolving DDBS
    performance failures in the locking method.


    In the literature of locking much attention has been paid to the deadlock-lock
    problem [BG81], [CM82], [CMH83], [ES86], [GS80], [IM80], [KIT79], [KKNR83], [MM79],
    [M081], [Obe80], [Obe82], [RL57], [SN84], [St69] (a detailed bibliography on this
    problem can be found in [Zob83]). Recall from Chapter 3 that deadlock is equivalent
    to a cycle in the data allocation graph and the waits-for graph. As already mentioned,
    there are two principal approaches to deadlock resolution: deadlock prevention
    and deadlock detection with recovery.


    The most common procedures for deadlock prevention are the WW and WD procedures
    discussed in detail in Chapter 3. These procedures can be successfully implemented
    in the locking method. It must be pointed out, however, they do not resolve permanent
    blocking and infinite restarting'
