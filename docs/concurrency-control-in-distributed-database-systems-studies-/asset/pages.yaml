    Case I expresses a random association of data items, whereas Cases II and III
    express the idea of locality in the precedence constraints, which is actually
    the case in many practical situations.


    For each of the three cases presented above, we shall derive the distribution
    of the waiting time of transactions in the requeencing buffer in steady state.
    We also compute the probability of not waiting, the mean waiting time and the
    mean number of transactions waiting in the buffer in steady state.


    # 17.2 Analysis of the Model


    The analysis of the three cases considered follows similar principles. Let us
    begin with Case I.


    Consider some transaction $T$ whose timestamp is $\tau$. Let $W$ denote its waiting
    time in the requeencing buffer. We define


    ```

    $w(t, y, x) = \mathcal{P}[W \le x \mid D = y, \tau = t]$

    ```


    where $D$ denotes its network delay. If $n$ other transactions have preceded $T$
    in the interval $[0, t]$, then as a consequence of the Poisson process, their
    timestamps will be mutually independent random variables, which uniformly distributed
    in $[0, t[$ (see for instance [CM65]). The same will be true of those who have
    to respect timestamp order with $T$, except that they will constitute a Poisson
    stream of rate $\lambda p$, rather than $\lambda$ for the complete stream. Thus
    $w(t, y, x)$ is simply the probability that all such transactions have'
