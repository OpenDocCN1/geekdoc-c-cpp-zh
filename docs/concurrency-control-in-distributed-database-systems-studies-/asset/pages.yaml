  md: '# 2.3. Multilevel Atomicity


    A DDB user or the DDB administrator can precisely determine the set of transactions
    executed in the DDB and characterize the relationships between them without having
    the entire knowledge of the consistency constraints. To illustrate this consider
    the following example [Lyn83].


    # Example 2.7


    Consider a banking system containing information on its customers'' accounts.
    Let us assume that the customers are grouped by family. In the system we can distinguish
    four classes of banking operations and four corresponding classes of transactions.
    The first class consists of individual transactions operating on individual customer
    accounts. These transactions involve standard banking operations such as deposit,
    withdrawal, or transfer. The second class is family transactions operating on
    a subset of accounts, i.e. the accounts of customers who belong to a family. These,
    for example, are withdrawals from the accounts of several family members, or transfers
    between the family accounts. The third class is credit transactions. These are
    initiated by the bank or a credit company and an audit of the contents of all
    the accounts of particular families. The fourth class are transactions that taking
    a complete audit of the contents of all accounts.


    Note that a description and specification of the set of consistency constraints
    in this banking system is a very difficult task, whereas these constraints in
    the course of execution of each transaction is almost impossible. On the other
    hand, it is much easier to describe the relationships between audits which have
    to be executed indivisibly with reference to particular classes of transactions.
    The strongest constraints occur in the case of audits which have an update transaction
    and an audit cannot be executed concurrently. Interleavings between credit transactions
    and individual and family transactions can occur only if credit transactions do
    not involve transfers between the accounts of one family and the accounts of another.
    However, there are practically no constraints on concurrent execution of individual
    and family transactions.


    Other examples related to the thesis presented above can be found in [FGL82],
    [Lyn83], [Gar83].


    We now present and discuss a formal specification of consistent but not necessarily
    serializable schedules based on the concept of transaction compatibility [Gar83].


