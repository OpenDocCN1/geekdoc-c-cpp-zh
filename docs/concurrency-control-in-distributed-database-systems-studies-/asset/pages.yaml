    # Concurrency Control

    Methods for the Multilevel

    Atomicity Model


    In this part we present an approach which is based on a semantic model of concurrency
    control. Each method presented involves a different aspect of this model.


    In Garcia-Molina’s concurrency control method presented in Chapter 11 the semantic
    information is supplied to a DDBMS directly by the database administrator, who
    classifies transactions and specifies the complete set of correct schedules. Thus,
    he/she is directly responsible for the correctness of the concurrency control.


    Lynch’s method presented in Chapter 12 takes advantage of the information about
    the semantics of different operations involved in transactions. This method requires
    broadening the classical transaction model beyond the assumption that a transaction
    is merely a partially ordered set of simple read and write operations on data
    items.'
