    We now recall the notions of a hypergraph, and a walk and a path in a hypergraph
    which are necessary for the presentation of the hypergraph policy.


    A *directed hypergraph* is a pair $H = (V, A)$, where $V$ is a set of vertices
    and $A = \{a_1, a_2, \dots, a_m\}$ is a set of hyperarcs, $a_i = s_i, h_i$ each
    hyperarc $a_i \in A$ is a subset of $V$. Each hypergraph has two elements: $head(a_i)
    = h_i$ and $tail(a_i) = s_i - \{h_i\}$.


    A walk from vertex $v_0$ to vertex $v_n$ in a hypergraph $H$ is the sequence of
    vertices and hyperarcs


    ```

    $v_0 \ a_0 \ v_1 \ a_1 \ \dots \ v_{n-1} \ a_n \ v_n$

    ```


    where


    $\forall \ 0 \leq i \leq n-1, (v_i \subseteq s_i, v_{i+1} \subseteq s_i) \wedge
    (head(a_i) \in \{v_i, v_{i+1}\})..$


    A path in which


    $\forall \ 0 \leq i \leq n-1, (v_i \in tail(a_i)) \wedge (v_{i+1} = head(a_i))..$


