  md: '# # Modelling the Parallel Access of Transactions to Common Granular Data


    The performance evaluation presented in this chapter concerns the behaviour of
    the TM module at any one of the sites of a DDBS. It can also apply to a centralized
    database.


    In the presence of concurrent transactions at the LDBS a way to insure consistency
    of the data is to use a control algorithm based on locking the data. In the previous
    chapter we considered an algorithm which locks all of the data required by a transaction
    as soon as the decision is taken to execute the transaction. This policy requires
    perfect knowledge of all the data needed by each transaction. In this chapter
    we assume data dependent transactions executed concurrently and hierarchical organization
    of the database, i.e. we assume granules are locked by a transaction in the course
    of its execution. Indeed in most database systems which allow the concurrent execution
    of transactions, the choice of the granularity of the smallest accessible data
    item determines the degree of currency which is obtained in practice.


    During its execution, a transaction will attempt to acquire granules an individual
    basis, and each granule can only be locked by a single transaction at a given
    time. When acquired, these are locked until the transaction either terminates
    or is aborted. If a transaction requires a granule that is under the lock of another
    transaction, it waits for a random period of time before requesting it again.
