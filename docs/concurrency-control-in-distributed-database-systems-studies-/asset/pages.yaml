  md: '# 3 DDBS Performance Failures


    The problem of DDBS concurrency control has to be considered as :


    +   (i) the problem of preserving database consistency, and

    (ii) of guaranteeing the successful completion of each transaction submitted to
    the system.


    An implementation of a given concurrency control method which serves database
    consistency (condition (i)) may cause DDBS performance failures. We distinguish
    four such phenomena: deadlock, cyclic restarting, permanent blocking, and infinite
    restarting. The occurrence of any of these failures violates condition (ii), that
    is, it prevents some transactions submitted to the system from completion.


    A situation in which an update transaction cannot be completed leads also to the
    violation of database consistency. In this context we use the term “consistency”
    in a more abstract manner, as the consistency of the database with respect to
    a “real world” which it reflects. To clarify this point let us consider the situation
    when a transaction updating a bank account after a withdrawal can never be completed.
    The data items stored in the database are consistent among themselves, but the
    database is not consistent with respect to the real word since money has been
    withdrawn from the account, but the account has not been updated to reflect that
    the transaction has not been completed.


    DDBS performance failures are side-effects of the concurrency control method used
    to guarantee database consistency. Therefore, in order to detect or prevent them
    additional control mechanisms have to be introduced to the DDBS.'
