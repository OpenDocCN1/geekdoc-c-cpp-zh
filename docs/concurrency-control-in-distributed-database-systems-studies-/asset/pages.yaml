    T ∈ LA and data items x,y ∈ L(T) such that the undoing operation ULR(z) or ULW(z)
    precedes locking operation LR(y) or LW(y), respectively, the set of data items
    locked by T at the moment when T requests locking of y separates from y in H_LA.


    Yannakakis [Yan82a] showed that the problem of testing the above criterion is
    of polynomial complexity.


    The above criterion provides an affirmative answer to the question asked before
    testing L-algorithms for safety. To answer the second question referring to the
    existence of a general locking policy we present now the hypergraph policy [Yan82a].


    Let the DDB data structure be a directed hypergraph H = (V, A).


    # Hypergraph policy


    +   1. Lock the first data item requested by a transaction T.


    +   2. Lock a subsequent data item x requested by T


    Yannakakis [Yan82b] proved that an L-algorithm is safe if and only if it is covered
    by the hypergraph policy for some directed hypergraph H which represents the data
    structure of the database.


    As we have mentioned, all currently known safe centralized algorithms are instances
    of the hypergraph policy, that is, every algorithm is covered by the hypergraph
    policy for some hypergraph H.


    Let us use the 2PL algorithm as an example. In the 2PL algorithm it is assumed
    that:


    +   (i) data items are independent,


    +   (ii) a consistency constraint can be imposed on any pair of data items;


