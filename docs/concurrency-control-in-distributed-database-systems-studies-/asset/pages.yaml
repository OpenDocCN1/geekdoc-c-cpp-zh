  md: '# Preface


    The book is intended primarily for DBMS designers, but can also be of use to those
    who are engaged in the design and management of databases in general, as well
    as in problems of distributed system management such as distributed operating
    systems, computer networks, etc.


    This text consists of five parts. Part I is devoted to basic definitions and models.
    In Chapter 1 a model of DDBS is presented and its components, the distributed
    database model and the transaction model, are discussed. Distributed database
    consistency is introduced next. This chapter ends with a description of DDBS architecture.
    In Chapter 2 definitions are given of syntactic and semantic concurrency control
    models. For the syntactic serializability criterion of transaction execution correctness
    is discussed in relation to both mono- and multiverse DDBS. Garcia-Molina''s and
    Lynch''s approaches are presented for the semantic model. Chapter 3 covers issues
    related to DDBS performance failures: deadlock, permanent blocking, cyclic and
    infinite restarting.


    In Part II, Chapters 4, 5, 6, and 7 discuss concurrency control methods in monoverversion
    DDBS: the locking method, the timestamp ordering method, the validation method
    and hybrid methods. For each method, the concept, basic algorithms, a hierarchical
    version of the basic algorithms, and methods for avoiding performance failures
    are given.


    In Part III, Chapters 8, 9, 10 cover concurrency control methods in multiversion
    DDBS: the multiversion timestamp ordering method and the multiversion validation
    method.


    Concurrency control methods for the semantic concurrency model are given in Part
    IV. In Chapter 11, Garcia-Molina''s locking algorithm which uses the semantic
    criterion of transaction execution correctness is presented and discussed. Chapter
    12 is devoted to a locking algorithm which uses the abstract data type approach.


    Part V is composed of five chapters concerning performance issues. Chapter 13
    presents a general statement of the issue of performance in a DDBS with respect
    to the service received by a particular transaction. Chapter 14 discusses the
    effect of concurrency control algorithms in general on the DDBS''s transaction
    processing capacity. Chapter 15 is devoted to the performance evaluation of global
    locking policies, while Chapter 16 analyzes the performance issues related to
    locking policies based on individual data items or granules. Finally, in Chapter
    17 recent results on the performance of resequencing such as timestamp ordering
    algorithms are presented. The whole of Part V uses the performance evaluation
    methodology based on queuing models and simulation tools.'
