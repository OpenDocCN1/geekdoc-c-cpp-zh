  md: "# Validation Method\n\nthis problem is to store a full copy of the precedence\
    \ relation graph at each DBBS site and update it every time a read or write operation\
    \ is performed. This results in significant system communications overhead.\n\n\
    Information about committed transactions has to kept in the precedence relation\
    \ graph. To clarify this problem let us note that if there is an arc $T_i \rightarrow\
    \ T_j$ in the precedence relation graph, such that $T_i$ is active and $T_j$ is\
    \ committed, it is still possible that transaction $T_i$ will read later a data\
    \ item written by $T_j$ and, thus, the arc $T_j \rightarrow T_i$ will be generated.\
    \ Thus, if the vertex corresponding to the committed transaction deletes the information\
    \ about the cycle $T_i \rightarrow T_j \rightarrow T_i$ would be lost. It is thus\
    \ necessary to keep the information about committed transactions in the precedence\
    \ relation graph.\n\nUntil the problems mentioned above are solved efficiently,\
    \ the validation algorithms based on the construction of the precedence relation\
    \ graph seem to be impractical for DDBS.\n\nIn the second group [AD82], [Cel86],\
    \ [KR81], [Rob82], [Sch81], [Sch82], [PSU86], [UPS83], [HP87], [KT84], [CO82]\
    \ a transaction consists of three phases: a *read phase*, a *validation phase*\
    \ and a *write phase*. During the read phase, a transaction is executed locally,\
    \ in the private workspace. During the validation phase, as soon as the logical\
    \ transaction has been completed, all updates prepared by the transaction are\
    \ tested if they do not cause a loss of DDB consistency. If validation is successful,\
    \ the transaction begins its write phase in which data items updated by the transaction\
    \ are written to the DDB. Otherwise, the transaction is aborted and restarted\
    \ as a new transaction.\n\nThe validation method has the following advantages.\n\
    \n+   (i) the execution of transactions that do not violate database consistency\
    \ (especially queries to the DDBS) is not delayed;\n\n+   (ii) deadlock, permanent\
    \ locking and cyclic restarting do not occur.\n\nThe following are its major disadvantages\n\
    \n+   (i) information about transactions has to be collected so that it can be\
    \ used to perform validation;\n\n+   (ii) infinite restarting is possible."
