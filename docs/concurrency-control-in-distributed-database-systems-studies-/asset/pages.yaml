    # 4.5 Performance Failures in the Locking Method


    As mentioned in Section 4.1, performance failures are one of the major disadvantages
    of the locking method. DDBS performance failures follow from lock conflicts between
    transactions. The type of performance failure depends on the method chosen to
    resolve lock conflicts. When a transaction $T$ wishes to set a lock on a data
    item that is not compatible with the lock already assigned to this data item,
    the following three scenarios are possible:


    +   - “wait” option - transaction $T$ is halted, and its lock request is appended
    to a wait queue;


    +   - “abort” option - transaction $T$ is aborted, i.e. all locks that $T$ has
    already been granted are released and eventually $T$ is restarted;'
