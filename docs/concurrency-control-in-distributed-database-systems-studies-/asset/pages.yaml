  md: '# 8.2. Non-Two-Phase Multiversion Locking Algorithms


    # 8.2 Non-Two-Phase Multiversion Locking Algorithms


    As mentioned in Section 4.2, two-phase locking algorithms, both moniversion and
    multiversion, are optimal when the data items in the DBDS are mutually independent
    or if the information about their organization can be used for concurrency control.
    However, if a priori knowledge of the physical or logical structure of the DDB
    is available, it is possible to design non-two-phase locking algorithms which
    ensure both serializability and freedom from deadlock. The characteristic feature
    of these algorithms is that they do not require each locked transaction resulting
    from the algorithm to be two-phase. Non-two-phase algorithms potentially allow
    a higher degree of concurrency.


    In Section 4.3 two multversion locking policies were presented — the guard policy
    and the hypergraph policy, which generate an appropriate algorithm for a given
    DDB data structure. Recall that the guard policy is used for DBSAs whose data
    structure is a directed acyclic graph. In Section 4.3 we presented the multiversion
    heterogeneous guard policy, labeled MHGP [SB82], [Sil82]. Recall that a guard
    policy is heterogeneous if the set of locked transactions is divided into two
    subsets — the subset of queries (denoted by $R_j$) and the subset of update transactions
    (denoted by $W_i$). Queries may only issue read locks, while updates may only
    issue write locks.


    We introduce some additional notations and definitions that are necessary for
    the explanation of the MHGP policy.


    Let $f$ be the root of a guarded graph $G=(V, A)$. Let $e(R_j)$ be the first data
    item locked by $f$. Associated with each transaction $W_i$, $R_j$, and with each
    version $x^k$ of a data item $x$ is a timestamp denoted by $TS(W_i)$ and $ts(x^k)$,
    respectively. Timestamps are associated with transactions and data item versions
    in the following way:


    +   (i) an update transaction $W_i$ is assigned the timestamp $TS(W_i)$ when it
    sets the lock LW on $f$ being the root of the guarded graph G.'
