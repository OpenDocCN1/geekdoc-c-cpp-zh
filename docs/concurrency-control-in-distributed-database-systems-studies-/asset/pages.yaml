    # 6.3 Snapshot Validation Algorithm


    As we have seen in the previous section, the Kung-Robinson validation algorithm
    is not free from some deficiencies. The drawbacks most widely quoted are the following
    [AD82], [UPS83], [Cel86], [PSU86]:


    +   (i) the necessity to abort a transaction due to a data access conflict discovered
    during the validation phase even though this conflict does not lead to a violation
    of the serializability criterion,


    +   (ii) high overhead caused by late discovery of data access conflicts,


    +   (iii) high risk of infinite restarting, and in the case of the parallel validation,
    of cyclic restarting. The problem concerns particularly long-lived transactions.


    We will return to the problem of the performance failures in the validation method
    in Section 6.5. In this section we present the validation algorithm proposed in
    [UPS83], [PSU86]. It is based on two modifications of the Kung-Robinson algorithm
    which aims at solving the problems indicated in (i) and (ii).


