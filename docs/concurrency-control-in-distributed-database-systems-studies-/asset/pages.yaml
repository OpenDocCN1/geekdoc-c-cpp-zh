    # 9.1 Reed''s Algorithm


    Reed''s algorithm is the first multiversion concurrency control algorithm published
    in the literature [Ree78]¹. The basic tool of Reed''s algorithm is the history
    of a multiversion data item $x=<x^0, x^1, \dots, x^q>:


    ```

    $H_{rw} = \{(W-ts(x^0), R-ts(x^0)), (W-ts(x^1), R-ts(x^1)), \dots,$

    ```


    ```

    $\dots (W-ts(x^k), R-ts(x^k))\}$.

    ```


    The pair $(W-ts(x^k), R-ts(x^k)), k=0, 1, \dots, g,$ is called a *history of a
    version x$^k$*. A history contains two timestamps. The timestamp $W-ts(x^k)$ is
    assigned the value of the timestamp of the transaction that created (wrote) $x^k$,
    while $R-ts(x^k)$ is assigned the largest timestamp of a completed transaction
    that read this version. Until the first transaction that has read the version
    $x^k$ completes, the timestamp has the value $W-ts(x^k)$.


    A data item history can be represented graphically on two axes showing the order
    of the timestamps $W-ts(x^k)$ and the corresponding order of the timestamps $R-ts(x^k)$
    for the successive data versions. An example is shown in Figure 9.1.


    The history $H_{rw} = \{(1, 5), (8, 10), (13, 18), (19, 19)\}$ means that the
    data item $x$ has four versions $x^0, x^1, x^2, x^3$, created at times 1, 8, 13,
    19


    > Originally, Reed''s concept pertained to file access synchronization in a file
    server. It was implemented along with a multiversion timestamp ordering algorithm
    in the experimental system SWALLOW [Svo80], [Svo84].'
