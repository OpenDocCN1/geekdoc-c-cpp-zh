    In the Chan-Gray algorithm each LDB consists of two parts: the one that holds
    the most recent data versions and the other, called version pool, that contains
    old versions of all data items. The version pool serves two purposes. First, it
    enables an aborted transaction to be rolled back and, second, it allows a consistent
    view of the DDB to be obtained.


    The Chan-Gray algorithm is heterogeneous (cf. Section 4.3). This means that the
    set of transactions is split into queries and update transactions. Concurrency
    control applied to update transactions is different from the one applied to queries.
    Update transactions are controlled according to the 2PL algorithm. In order to
    update a data item, a transaction locks it, places the version read in the LDB
    version pool and prepares its new version. When this sequence of operations is
    completed, the DBMS informs the TM which supervises transaction execution after
    a successful transaction completion at a local site. This message is an acknowledgement
    of a prewrite request in the two-phase commitment procedure.


    Queries do not lock data items and thus never conflict with update transactions.
    In order to guarantee that a query always gets a consistent view of the DDB, each
    LDB maintains a completed update transaction list, denoted by CTL. The CTL contains
    information about all updates made in the whole DDBS. A DDB view a query receives
    is the view at the moment of its initiation.


    The following three problems need to be solved in order to implement efficiently
    the above algorithm in a DDBS.'
