    # 9.2 Timepad Algorithm


    In this section we present the timepad algorithm proposed in [Sin80], [Sin86]
    which, according to Takaga''s classification, is semi-deterministic (cf. Section
    5.1). The basic premise of this algorithm is the assumption that the user is more
    interested in minimizing execution time of transactions than in the chronological
    order of their execution. In some cases, the algorithm should allow younger transactions,
    i.e. those initiated later, to be executed before older transactions. This is
    provided by introducing a mechanism of dynamic timestamp assignment, called the
    timepad scheme. The timepad scheme works as follows


    Each transaction $T_i$ receives two timestamps when it is initialized: the basic
    timestamp $TS(T_i)$ and the deadline timestamp $TS(T_i) + \sigma_i$. Associated
    with $T_i$ is a set of allowable timestamps within the range $(TS(T_i), TS(T_i)
    + \sigma_i)$. This means that the value of $T_i$''s timestamp initially set to
    $TS(T_i)$ can change during its execution and be assigned a new value from the
    range $(TS(T_i), TS(T_i) + \sigma_i)$. The final value of its negated during its
    execution is the commit timestamp and is denoted by $CTS(T_i)$. To a large extent,
    the timepad algorithm takes advantages of two-phase commitment. The execution
    of a transaction proceeds in two phases the negotiation phase and the commit phase.
    During the negotiation phase the $TM$ module supervising $T_i$''s execution sends
    access requests together with the range of values $(TS(T_i), TS(T_i) + \sigma_i)$
    to all $DM$ modules. If a request can be granted, the $DM$ module of site $S_i$
    sends to the $TM$ module the acknowledgement timestamp of the transaction $T_i$,
    denoted by $ack^{si}(T_i)$. The acknowledgement timestamp is a pair $ack^{si}(T_i)
    = (tack^{si}(T_i), tack^{si}(T_i))$, whose elements satisfy the inequality $TS(T_i)
    \le tack^{si}(T_i) \le tack^{si}(T_i) \le TS(T_i) + \sigma_i$. After receiving
    affirmative'
