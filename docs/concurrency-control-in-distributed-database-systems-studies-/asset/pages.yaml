  md: '# 5 Timestamp Ordering Method


    # 5.1 Timestamp Ordering Concept


    The timestamp ordering method will be labeled T/O. The basic tool of this method
    is a "timestamp". The timestamp of a transaction $T_i$, denoted by $TS(T_i)$,
    is a "number obtained by concatenating the local clock time with the unique identifier
    of the site where $T_i$ is initiated. To each data item $x \in D$ two timestamps
    are assigned: a read timestamp $R$-$ts(z)$ and a write timestamp $W$-$ts(z)$.
    They are set to the value of the timestamp of the transaction that accessed $x$
    last to read or to write, respectively.


    The timestamp assignment mechanism in distributed environments uses a called multi-clock
    system. It is composed of local clocks (logical or physical) maintained by all
    DDBS sites. synchronized so that the relative drift of any two local clocks is
    less than a predicted constant. If an event $a < b$ at a site $S_k$ occurs before
    an event $b < a$ at a site $S_l$ then the time assigned to event $a < b$ by the
    use of the local clock at $S_k$ is less than the time assigned to event $b < a$
    by the use of the local clock at $S_l$. By an event we mean here such occurrences
    as: receiving or transmitting a message, transaction initiation or completion,
    etc.


    The T/O method assumes that the serialization order of a concurrent schedule of
    transactions is strictly determined by the order of transaction timestamps. In
    other words, the order in which transactions access data items is the order of
    their timestamps. The T/O algorithm verifies that this'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# 126


    # 5. Timestamp Ordering Method


    order has not been violated by concurrent execution of transactions (due

    de to delays in the communications network, for example).


    The serialization order assumed a priori is the main drawback of the

    T/O method since any violation of this order leads to multiple abortions of

    trans whose access requests arrive at a site too late. A number of

    algorithms have been reported in the literature that aim at minimizing the

    effect of this drawback. Some of them use dynamic timestamp allocation

    in order to reduce the number of transaction abortions [BEHR82], [LB86].

    over, most of them use static timestamp allocation. According to a class-

    sification by Takaga [Tak79] they can be grouped into three basic

    categories: deterministic, non-deterministic and semi-deterministic, depend-

    ing on the way they tackle this problem.


    Deterministic T/O algorithms include algorithms in which the DM-\odule grants
    to a data item if this will not cause any transaction

    the DDBS to restart at a later time. In other words, a request to access a

    data item by one transaction is buffered by the DM module until there are

    trans with smaller timestamps request access to this data item.

    this also includes conservative T/O algorithms [BSR80], [BG80],

    [BG81], [CP84], [HV79], [KNH79] (cf. Section 5.3).


    Non-deterministic T/O algorithms are directly descended from the two-

    phase commitment procedure [BGR81], [Gra78]. When a transaction Ti

    requests a data item to which incompatible access has previously

    grant to a transaction Tj, TS(Ti) > TS(Tj), whether or not Ti

    will be accepted depends on the processing status of Tj. If Tj’s

    request be accepted then the Ti’s request is rejected. Otherwise, Ti’s

    request is accepted causing the rejection of the Ti’s request. An example

    of a non-deterministic algorithm is the algorithm used in system SABRE

    [VG82] (cf. Section 7.2) or Takaga’s algorithm [Tak79].


    Semi-deterministic T/O algorithms include algorithms that use a queue

    to minimize the number of abortions. Associated with each data item is a

    queue of transactions waiting to access it. The DM module, after complet-

    ing the execution of a current access request, takes a transaction with

    t smallest timestamp from the queue. If the queue associated with a given

    data item is empty at the moment of the arrival of a request, then this

    request is accepted immediately under condition that the transaction making

    the request has a greater timestamp than the transaction which has

    data item last.


    The following advantages of the T/O method should be pointed out:'
