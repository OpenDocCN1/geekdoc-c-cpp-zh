    \ is often trivial $TC_{start}(T) = TC_{finish}(T)$.\n\nThe second validation\
    \ algorithm proposed in [KR81], namely the parallel validation algorithm, allows\
    \ the validation phase of a given transaction and the write phases of other transactions\
    \ to be executed concurrently. In this algorithm it is assumed that a transaction\
    \ is assigned a transaction number after the write phase. As in the serial validation\
