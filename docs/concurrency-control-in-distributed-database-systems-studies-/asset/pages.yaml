    In order to present an algorithm to determine $M$, we introduce the following
    additional notation. The function which generates a timestamp for an update transaction
    $W_i$ is denoted by $Suc(TS(W_{i-1}))$, where $W_{i-1}$ is the last update transaction
    that received a timestamp. For example, the $Suc$ function can be defined as


    $Suc(TS(W_{i-1})) \leftarrow TS(W_{i-1}) + 1.1$


    Let AUL be a list containing all active update transactions ordered in ascending
    order of their timestamp. The algorithm to determine the value of $M$ is the following:


    +   (i) initiate $AUL \leftarrow; M \leftarrow 0$;n(ii) when a new update transaction
    $W_i$ is initiated append it to $AUL$;n(iii) when $W_i$ completes, delete it from
    $AUL$. If $TS(W_i) = Suc(M)$, then update $M$; otherwise, do not alter $M$. $M$
    is updated as follows: if $AUL$ is empty, then $M$ is set to the timestamp of
    the update transaction that last locked the root of $G$, where $W_k$ is actually
    the first element of $AUL$.


    In order to guarantee $M$ is the lower boundary of timestamps assigned to new
    queries, it is necessary to modify the way they are assigned timestamps. When
    initiated, $R_j$ receives the timestamp


    $TS(R_j) = max\{M, ts(e(R_j))\}$,


    where $e(R_j)$ is the most recent version of the data item $e(R_j)$, which is
    the first item locked by $R_j$. This scheme guarantees that for active transactions
    $W_i$ and $R_j$, $TS(W_i) > M$ and $TS(R_j) \geq M$. Moreover, we assume that,
    apart from the timestamp $TS(R_j)$ of any query, the DDBMS also stores the value
    of $M$ at $R_j$''s initiation, denoted by $M_j$. From the viewpoint of some pre-assumed
    value of $M$, denoted by $M$, the set of active queries can be divided into two
    subsets: one containing queries $R_j$ that $M_j \geq M$ and the other containing
    queries $M_j < M$.


    We now present an algorithm to discard unused versions by Silberschutz and Buckley
    for the multiversion heterogeneous locking protocol [SB82] in the above division
    of the set of queries is used.


    Let $RC_1$ and $RC_2$ denote the cardinalities of the two query subsets. At the
    DDBMS initiation $RC_1 = RC_2 = M = 0$.


