    # 10.2 Performance Failures in the Multiversion Validation Method


    The multiversion validation method, like the monoverision validation method, is
    not free from two performance failures, namely infinite and cyclic restarting.
    On the other hand, deadlock and permanent blocking cannot occur.


    No particular algorithms for solving the performance failure problems in the multiversion
    validation method have been proposed to date. The failures can be eliminated by
    using the methods applicable to the monoverision validation method (cf. Section
    6.5): the method of substitute transactions and the method of data marking. Both
    of these methods need to be slightly modified because of the multiversion data.
    The reason for this is that they use a mechanism for reserving those data items
    which are necessary to complete an infinitely restarting transaction. In multiversion
    DBMS it is sufficient to reserve some data item versions instead of the entire
    data items. Otherwise the reservation may result in the abortion of transactions
    whose requests do not conflict with the requests of an infinitely restarting transaction.
    This occurs when the sets of data item versions accessed are mutually exclusive,
    which is often the case with queries.'
