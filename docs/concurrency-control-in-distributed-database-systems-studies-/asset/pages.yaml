    # 4.2 Two-Phase Locking Algorithm


    In this section present the most used algorithm of the locking method called two-phase
    locking (2PL) [BG81], [EGL76]. The idea of this algorithm is the following: the
    last item has to be locked by a transaction before the first data item is unlocked
    by it; no data item is locked if it is not accessed.


    The execution of every transaction proceeds through two phases: locking phase
    and unlocking phase. In the locking phase a transaction must be granted locks
    on all data items it wants to access. In the unlocking phase locks are released
    but not requested. The end of the locking phase, when a transaction owns all the
    locks it will ever owe, is called the commit point of the transaction.


    In the 2PL algorithm it is possible to read a data item immediately after a lock
    has been granted, i.e. still in the locking phase. On the contrary, writing is
    possible only after the transaction has reached its commit point, that is in the
    unlocking phase. More precisely, the write operation is implemented as follows.
    Granting a write lock is followed by a private operation made in the private workspace
    associated with each transaction. The private workspace of a given transaction
    is a temporary buffer for the values of data items read from or written into the
    database by the transaction. The write operation to the database is performed
    using the contents of the workspace during the unlocking phase, together with
    lock releasing. This procedure guarantees atomicity of


    In the 2PL algorithm the execution order of a set of transactions r is determined
    by the order of their commit points. Figure 4.3 shows a diagram of the transaction
    execution of the 2PL algorithm.


