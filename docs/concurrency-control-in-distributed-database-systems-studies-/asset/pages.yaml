    versions necessary for a consistent view of the DDB. Moreover, removing some versions
    too early may make the correct abortion of update transactions impossible. On
    the other hand, if the garbage collecting procedure is initiated too late, the
    database may grow excessively.


    This problem has been solved by organizing the version pool in such a way that
    the useless data versions are removed automatically. It is assumed that each version
    of a data item is stored on a page of the virtual memory. The version pool consists
    of three sets of pages: a set of active pages of queries, a set of active pages
    of update transactions, and a set of blank pages. The set of active pages of queries
    contains old data versions that still may be accessed by currently executing queries.
    Similarly, the set of active pages of update transactions contains versions that
    are necessary if any of the update transactions currently executing have to be
    aborted. The remaining pages of the version pool are blank. The structure of the
    version pool is presented in Figure 8.6. The garbage collection procedure modifies
    the sets of pages automatically.


    It is worth to point out that the Chan-Gray algorithm does not always guarantee
    multiversion serializability, though it guarantees to each transaction a consistent
    view of the DDB. Consider for instance the following example.'
