    # 16.2 Equations for $F$ and $F_1$


    Consider the steady-state behavior of the full system subject to a constant load
    of $K$ statistically identical transactions. Suppose that the requests of each
    transaction are uniformly distributed over the database, that is, the target of
    a new request is equally likely to be any granule that the transaction does not
    lock. The average number of granules locked by all other transactions is $(K-1)m$;
    hence the probability that a transaction will request a granule that is not available
    is approximately


    ```

    $F = \frac{(K-1)m}{D-m} \quad (16.5)$

    ```


    Clearly, this argument is simplistic, ignoring as it does the dependence of $F$
    on the detailed system state. Nevertheless, it provides an acceptable approximation
    when the contention for granules is not too large. Another way of obtaining $F$
    is to consider the behavior of a single granule as viewed from a given transaction:
    the granule goes through alternating periods, $A$ and $U$, of which being available
    and being unavailable or locked. Let the average lengths of these periods be $1/\sigma$
    and $1/r$, respectively. Then


    ```

    $E[U] = \frac{m}{\lambda}$

    ```


    by Little''s theorem, since $m$ is the average number of granules locked by a
    transaction and $\lambda$ is the rate at which it acquires them. The granule is
    acquired by the remaining $(K-1)$ transactions at a rate $\lambda(K-1)/(D-mk)$
    if it is requested it is not one of the $mT$ items which are held, and requests
    are assumed to be uniform over the database. Assuming that this process of obtaining
    transactions is Poisson, we see that


    ```

    $E[A] = \frac{1}{\sigma} \frac{(D-mk)}{\lambda(K-1)}$

    ```'
