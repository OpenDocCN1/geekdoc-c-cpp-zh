    ```

    $w(t,y,x) = \sum_{n=0}^{\infty} e^{-\lambda pt} \frac{(\lambda pt)^n}{n!} \left[\int_0^t
    \frac{du}{t} F(t+y+x-u)\right]^n$

    ```


    where we have summed over all possible values of $n$, have taken into account
    the fact that the $u$ of arrival of any of the other transactions are uniformly
    distributed in $[0,t]$, and that the network delay of any one of them cannot exceed
    $t+y+x$. We can now write


    ```

    $w(t,y,z)=\exp[-\lambda p \int_0^t(1-F(t+y+x-u))du]$

    ```


    ```

    $=\exp[-\lambda p \int_0^{t+y+z}(1-F(z))dz+\lambda p \int_0^{y+z}(1-F(z))dz]$

    ```


    To obtain the steady-state distribution, we shall take $t\to\infty$ in the above
    expression to obtain


    ```

    $w(y,x)=\lim_{t\to\infty}w(t,y,x)$

    ```


    ```

    $=\exp[-\lambda E[D]+\lambda p \int_0^{y+z}(1-F(z))dz]$

    ```


    $E[D]$ denotes the average value of the network delay. To obtain the distribution
    of the resequencing delay for an update in steady-state, we have to integrate
    $w(y,x)$ over all values of $y$ (i.e. over the distribution of the delay $D$),
    which gives


    ```

    $w(x)=\exp[-\lambda E[D]] \int_0^{\infty} dF(y) \exp[-\lambda p \int_0^{y+z}(1-F(z))dz]
