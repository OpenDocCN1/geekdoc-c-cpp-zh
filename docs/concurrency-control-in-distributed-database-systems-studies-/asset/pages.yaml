    # Hybrid Methods


    # 7.1 Basic concepts


    From the comparative analysis is said of the basic concurrency control methods
    discussed so far, their advantages and drawbacks are to a large extent complementary.
    Therefore, it seems only natural to try to integrate them and design hybrid methods
    [BG80], [BG81], [BG82], [BGL83], [BR83], [CM86a], [Leu82], [MJC84], [Re83], [VG82],
    [VR84)], [BHG87]. In [BG80], [BG81], [BG82], for example, the number of conceivable
    monversion hybrid concurrency control algorithms is said to be over a hundred.
    Considering additional modifications of these algorithms, such as variations of
    system performance failure resolution, the number of hybrid algorithms increases
    considerably. An attempt at a classification of hybrid concurrency control algorithms
    can be found in [BG80], [BG81], [BHG87].


    We present below two algorithms that in our view are the most interesting attempts
    at designing and correct hybrid algorithms for monversion DDBS.


