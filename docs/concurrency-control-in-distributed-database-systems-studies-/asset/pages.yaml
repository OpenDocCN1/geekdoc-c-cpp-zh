  md: '8.3. Performance Failures in the Multiversion Locking Method 209


    # # 8.3 Performance Failures in the Multiversion Locking Method


    The problem of DDBS performance failures in the multiversion locking must be considered
    separately for the multiversion two-phase locking (Section 8.1) and multiversion
    non-two-phase locking (Section 8.2). Multiversion two-phase locking is not free
    from deadlock and both cyclic and infinite restarting. Both prevention and detection
    can be used for dead-lock elimination. For example in the algorithm presented
    in [SR81] deadlock prevention is used, and in the algorithm presented in [BEHR80]
    deadlock detection is used.


    Cyclic and infinite restarting can be solved by the application of the data and
    transaction marking method presented in Chapter 3.


    On the other hand, performance failures do not occur in multiversion non-two-phase
    locking. Indeed, the set of transactions is divided into exclusive subsets of
    queries and update transactions each of which can request only one lock mode.
    Furthermore, data items that constitute the DDB are partially ordered, since the
    database is organized as a directed acyclic guard graph, and this order is observed
    by all the transactions during their execution.'
