    # 4.4 Hierarchical Locking Algorithms


    Hierarchical locking algorithms address the problem of lock granularity [GLPT75].
    The problem of lock granularity consists of selecting the optimal lockable units.
    To clarify this point note that executing a transaction which requests an access
    to, three data items requires six lock operations, while executing a transaction
    which requests an to one thousand data items, requires two thousand lock operations.
    Thus, there is evidently a need to find the optimal size of lockable unit of data.
    This problem involves a tradeoff between a pair of conflicting goals — maximizing
    the concurrency degree versus small transactions, many small lockable units are
    best; to minimize locking overhead for large transactions, a few large lockable
    units are best. In [GLPT75], Gra78 the concept of hierarchical locking was proposed
    which incorporates the idea here as a hierarchy of granules. A granularity hierarchy
    can be represented by a rooted acyclic graph where vertices are granules and edges
    connect higher level granules to lower level granules. An example of a granularity
    hierarchy is shown in Figure 4.9.


    We emphasize that the granularity hierarchy and the DDB data structure discussed
    in Section 4.3 have nothing in common. A DDB data structure represents semantic
    relations between data items or their physical organization, whereas a granularity
    hierarchy is introduced independently for the purpose of minimizing locking overhead
    and thus maximizing performance.


    There are two types of lock modes in hierarchical locking algorithms: basic and
    intention lock modes [GLPT75], Gra78], [Kor80], [Kor83]


    Basic locks are the locks we have already discussed in Sections 4.1–4.3. As before,
    we distinguish a basic read lock on a data item x, denoted by LR(x), and a basic
    write lock on x, denoted by LW(x). The presented'
