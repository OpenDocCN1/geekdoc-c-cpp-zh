  md: '# # Preface


    In recent years research and practical applications in the area of distributed
    systems have developed rapidly, stimulated by several factors.


    In the first place, this is a consequence of significant progress in two fields
    of computer science, namely computer networks and database systems. These areas
    have constituted the technical and scientific foundations for the development
    of distributed systems.


    This rapid development is also the result of the need for such systems for management
    and control applications. Distributed computer systems arise mainly because of
    the distributed nature of many engineering and management systems such as banking
    systems, systems for production line automation, service systems, reservation
    systems, inventory systems, information retrieval systems, military systems, etc.
    The distributed nature of these applications is better satisfied by distributed
    computer systems than by centralized configurations.


    The third motivation for distributed systems is of economic nature. The development
    of VLSI circuit technology has considerably reduced the cost of computer equipment,
    and changed the orders of magnitude of its price/performance ratio. Present day
    "small" computers offer at far lower cost many of the capabilities which previously
    provided only by large mainframes. Thus it has become possible to construct distributed
    computer systems consisting of many small yet powerful computers instead of installing
    one mainframe.


    This evolution of computer technology has also lowered the relative cost of computing
    versus communication and the cost of communication facilities is now comparable
    with that of powerful mini-computers. The network is now comparable. Therefore,
    again it is worth constructing a distributed system in which computers interchange
    computation results between them via communication links instead of installing
    one large mainframe in which data is gathered via communication links.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# xii


    # Preface


    Another attractive aspect of distributed systems is the possibility of simpler
    software design. Individual processors can thus be dedicated to particular functions
    of the system leading to the elimination of very complex multiprogramming software
    usually associated with large mainframes.


    Furthermore, the most important indices characterizing the quality of computer
    systems can be improved by distributed systems. In particular they:


    +   * increased reliability and accessibility of the system due to the physical
    replication and distribution of computer resources (i.e. data, computing, etc.),
    since the crash of a single site does not necessarily affect the other sites and
    does not lead to the unavailability of the whole system;


    +   * better system performance as a consequence of the increased level of parallel
    processing, also obtained by bringing the system resources closer to data sources
    and users;


    +   * increased flexibility of the system resulting from its modular structure
    which allows growth and smoother change of functions and capacity;


    +   * increased data security due to better protection in the case of hardware
    and software failures or attempts to destroy data.


    Some of the most advanced types of distributed systems are Distributed Database
    Systems (DDBS) which may be defined as integrated database systems composed of
    autonomous local databases geographically distributed and interconnected by a
    computer network.


    Research in the field of DDBS is experiencing rapid growth ever since the mid
    seventies. Experimental DDBSs are in the initial stages of commercialization.
    Experimental DDBSs such as SDD-1, R*, SIRIUS-DELTA, Distributed-Ingres, DDM and
    PORE have been tested and evaluated. Some commercial systems such as ENCOMPASS
    by Tandem, and CICS/ISC from IBM, are already available.


    New problems arise in distributed database systems, in comparison with centralized
    database systems, with respect to their management. A DDBS is managed by a Distributed
    Database Management System (DDBMS) whose main task is to give the users a “transparent”
    view of the distributed structure of the database, i.e. the illusion of having
    a monolithic and centralized'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Preface


    database at their disposal. Distribution transparency, i.e. location and replication
    transparency, implies that the conceptual and external-level problems (using the
    ANSI/SPARC terminology) of distributed databases do not essentially differ from
    similar issues in centralized database systems. On the other hand, the internal-level
    problems, i.e. physical database design and DDBMS management, are specific and
    qualitatively new.


    The main issues in DDBS management can be classified in three principal groups:
    concurrency control, query processing optimization, and reliability. Solutions
    to these problems in a centralized environment are inappropriate for a distributed
    environment because of differences in the internal-level structure of the databases.
    Their effective solution conditions the possibility of taking full advantage of
    DDBS structure and applications.


    The fundamental problem facing the designers of DDBMS is that the correct control
    of concurrent access to the distributed database by many different users. This
    can be viewed as the design of an appropriate concurrency control algorithm. The
    construction of concurrency control algorithms is of key importance to the whole
    management of distributed databases. A solution of this problem will influence
    the solution of the two remaining issues.


    The general aim of a concurrency control algorithm is to ensure consistency of
    the distributed database and the correct completion of each transaction initiated
    in the system. An obvious additional requirement is to minimize overhead and transaction
    response time, and to maximize DDBs.


    In the study of concurrency control in DDBs there have been three successive phases
    that can be distinguished. Initially, there been an attempt to adopt concurrency
    control algorithms designed for multiaccess but centralized database systems.
    This attempt was not successful for the following reasons. In a DDBS every transaction
    can request simultaneous access to many local databases located on physically
    dispersed computer sites. Thus, the concurrency control problem for DDBs is more
    general than the similar problem for centralized database systems concurrency
    control has to ensure the internal consistency of one local database. In DDBs
    concurrency control has to guarantee the internal consistency of several different
    local databases and the external consistency of the distributed database understood
    as the identity of copies of the data items.


    Furthermore, in DDBs no computer site will in general hold information on the
    global state of the whole system. Hence, all control decisions'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# xiv


    # Preface


    taken at a site of DDBS have been made on the basis of incomplete sites and not
    entirely up-to-date information on the activities of the remaining sites. This
    fact must be taken into consideration in every concurrency control method.


    In a more recent past, three basic methods were designed in relation to the syntactic
    model of concurrency control, in which no semantic information on transactions
    or data is assumed. These are locking, timestamp ordering and validation. Studies
    related to the syntactic model of concurrency control are still of interest. At
    present, research focuses on integrating the basic concurrency control methods
    and the construction of hybrid methods. Algorithms using hybrid methods, e.g.
    the bi-ordering locking guarantee better performance and eliminate system performance
    failures (deadlock, permanent blocking, and infinite restarting), which can prevent
    some transactions from completing. The global resolution of the problems of DDBS
    consistency and DDBS failures is one of the major advantages of hybrid methods.


    In the next phase of studies on concurrency control provides a multiversion data
    model assumed. In this model every data is a sequence of versions as a result
    of successive updates. Thus, the history of data updates is stored in the database.
    Multiversion DDBS are attractive to DDBS designers for several reasons. They allow
    a higher degree of concurrency, which can be combined with reliability mechanisms
    in a natural way, and they can be easily designed so that queries are delayed
    or rejected.


    In recent years there has been a new trend in research characterized by a shift
    from the syntactic model of concurrency control to the semantic model. Semantic
    information can concern data (e.g. physical structure of the database, consistency
    constraints, etc.) or the set of transactions. At present only preliminary results
    in this area are available. However this trend seems to be very promising and
    will presumably provide significant results in the future.


    The purpose of this monograph is to present DDBS concurrency control algorithms
    and their related performance issues. The most recent results have been taken
    into consideration. A detailed analysis and selection of these results have been
    made so as to include those which, in the authors'' opinion, will promote applications
    and progress in the field. It can also be said that the application of the methods
    and algorithms presented in the book is not limited to DDBS but also relates to
    centralized database systems and database machines which can often be considered
    as particular examples of DDBS.'
  merge: -1
