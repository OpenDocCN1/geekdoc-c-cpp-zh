    by solving at $s = \mu$, completing the proof.


    Let us examine the practical consequences of Theorem 1. First of all, the condition
    $\lambda E[S] < 1$ for stability simply indicates that the LDBS transaction execution
    time $S$ and the transaction arrival rate $\lambda$ are solely responsible for
    stability; the requencing algorithm has no impact on it. This confirms the results
    of the previous sections. Furthermore if we consider the total value of the end-to-end
    delay''s average value at stationary state given by


    ```

    $E(V) = E(D) + E(S) + E(W)$

    ```


    we see that it can be computed if we know $E(W)$ the average steady-state requencing
    delay. We have


    ```

    $E(V) = E(Y) - E(D)$

    ```


    so that


    ```

    $E(V) = E(S) + E(Y)$

    ```


    Theorem 1 provides us the L.S. transform of the distribution function $U(x) =
    Y(x)/D(x)$, for $x > 0$, where $Y(x)$ and $D(x)$ are the distribution functions
    of $Y$ and $D$ respectively. The dominant term for computing $E[V]$ is thus the
    computation of $U(x)$ is the quantity $U(0)m(s)$. From (17.8) we know that, by
    taking derivatives with respect to $s$ and evaluating the result at $s = 0$,


    ```

    $E[Y] = E[U] - \frac{1}{\mu}U_t^*(\mu)$

    ```


    Using the dominant term in $U_t^*(s)$, we have


    ```

    $E[Y] = U_t^*(0)m''(0) - \frac{1}{\mu}U_t^*(\mu)$

    ```


    ```

    $= U^*(0)[m''(0) - \frac{1}{\mu}m(\mu)]$

    ```


    Taking the derivative of $m(s)$ and evaluating it at $s = 0$, we obtain


    ```

    $m''(0) = \frac{\lambda E[S^2]}{2(1 - \lambda E[S])^2}$

    ```


    We also have


    ```

    $m(\mu) = \frac{\mu}{\mu + \lambda(S^*(\mu) - 1)}$

    ```'
