    state. The influence of the other transactions is reflected in the analysis by
    two unknown parameters — the probability F that a granule required by the transaction
    is unavailable and the probability Fi that a granule which was unavailable at
    the previous attempt to acquire it is still unavailable at the next attempt. This
    analysis yields various characteristics of the granule requests; assuming that
    all transactions are statistically identical, one can then write equations from
    which the unknown parameters can be determined. The accuracy of the approximation
    is evaluated by performing simulation experiments.


