    his/her particular application. Thus, the computational complexity of the problem
    of recognizing the set $C(r)$ differs considerably for various classes of applications.
    In one extreme case we deal with applications where all transaction semantic types
    are mutually compatible and a transaction step corresponds to a database operation.
    The problem of concurrency control is then trivial. In the other extreme case
    we deal with the applications where the semantic concurrency control model is
    reduced to the syntactic model $C(r) = SR$ or $C(r) = MVSR$. The problem of concurrency
    control then becomes NP-complete.'
