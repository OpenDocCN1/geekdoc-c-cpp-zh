  md: "# 2. Concurrency Control Models\n\n![](img/e304c9ea647471fa6dc1cba30e81bf9e_46_0.png)\n\
    \n# D-serializability criterion\n\nA schedule s(r) is D-serializable if and only\
    \ if its precedence relation $\rightarrow$ is acyclic.\n\nThe order of transactions\
    \ in a schedule induced by the acyclic relation $\rightarrow$ is called the serialization\
    \ order [BG81]. The meaning of the serialization order of a schedule $s(r)$ is\
    \ the following: if the transactions from the set $\tau$ were executed serially\
    \ in the serialization order, the serial schedule obtained in this way would be\
    \ equivalent to the schedule $s(r)$.\n\nWe denote the set of all schedules of\
    \ a set of transactions $\tau$ which meet the D-serializability criterion by $DSR$,\
    \ $DSR \\subseteq SR$.\n\nIt was proved in [BSW79], [Pap79], [Cas81] that the\
    \ computational complexity of testing D-serializability of a schedule $s(r)$ is\
    \ $O(|D(r)||\tau|^2)$, where $|D(r)|$ denotes the size of data items accessed\
    \ by the transactions contained in $\tau$ and $|\tau|$ denotes the size of the\
    \ set $\tau$.\n\nBy the use of the D-serializability criterion is reduced to a\
    \ relatively simple procedure of testing the acyclicity of the precedence relation\
    \ $\rightarrow$. This graph is called the D-serialization graph of a schedule\
    \ $s(r)$ and is denoted by $DSR(s(r))$. Formally, the D-serialization graph of\
    \ a schedule $s(r)$ is a directed graph $DSR(s(r))=\\{V,A\\}$ whose vertices corresponds\
    \ to transactions $\tau$ extended by the initial and final transactions $T_0$\
    \ and $T_f$, and whose arcs are $A=\\{T_i, T_j\\} : T_i \rightarrow T_j, T_i \\\
    in \\{T_0, T_f\\}$. Figure 2.5 shows the D-serialization graph of the schedule\
    \ $s(r)$ presented in Example 2.1. Serialization order of transactions from this\
    \ schedule is: $T_0, T_2, T_1, T_3, T_f$.\n\nIn order to show that the D-serializability\
    \ criterion is more restrictive than the serializability criterion consider the\
    \ following example."
