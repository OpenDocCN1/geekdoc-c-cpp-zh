  md: '# 2.3 Multilevel Atomicity


    In Sections 2.1 and 2.2 we considered the syntactic concurrency control model
    assuming the serializability as the correctness criterion of a concurrent execution
    of a set of transactions. When we say a given schedule is correct in the sense
    of the serializability criterion, we mean that any set of consistency constraints
    imposed on the database, and for any set of transactions, the serializability
    criterion is too strong and inadequate for many DDBS applications [AM85], [FGL82],
    [Gar83], [Her85], [LBS86], [Lyn83], [SJRN83], [SLJ84]. The reasons for this are
    threefold:


    First, the serializability criterion considerably decreases the concurrency degree
    that could be reached in a DDBS. Recall that the measure of the concurrency degree
    is the C(R) of correct transaction schedules. In the case of the syntactic model,
    the set C(R) is equal to the set of serializable schedules SR or the set of multiversion
    serializable schedules MVSR depending on the mono- or multiverse data model. In
    fact, both SR and MVSR are subsets of a larger set of correct schedules. This
    follows from the fact that serializability, in a sense, approximates a set of
    possible consistency constraints imposed on a DDB. This approximation is pessimistic
    since occurrence the worst case of these constraints is assumed. In other words,
    the syntactic model includes no knowledge of the consistency constraints among
    the data items, thus it must be assumed that all data items are dependent upon
    one another with respect to the consistency constraints. Thus, the serializability
    criterion is only a sufficient condition for preserving database consistency.
    More than purely syntactic information about a DDB makes it possible to weaken
    the correctness criterion and allows nonserializable schedules which are correct,
    i.e. which preserve database consistency, and which provide the DDB with a higher
    concurrency degree. This additional information about DDB can be classified as
    follows:


    +   - information about consistency constraints,


    +   - syntactic information about the set of transactions,


    +   - semantic information about the set of transactions.


    Such information is often available for DDBMSs. The use of it can substantially
    improve the DDBS efficiency.


    > 4Serializability is understood here as both the monoversion and multiversion
    serializability.'
