    # The warning algorithm


    We say that transaction $T_i$''s execution obeys the warning algorithm if the
    following conditions are satisfied:


    +   (i) the first vertex requested by $T_i$ to lock is the root vertex of the
    granularity hierarchy;

    (ii) $T_i$ can set an IR or LR lock on a non-root vertex if it is holding an $IR$
    or $IW$ on its predecessor;

    (iii) $T_i$ can set an $IW$, LR or LW lock on a non-root vertex if it is holding
    an $IW$ or $RIW$ on its predecessor;

    (iv) all locks set by $T_i$, must be released either at the end of $T_i$ execution
    or in the leaf-to-root order during $T_i$ execution.


