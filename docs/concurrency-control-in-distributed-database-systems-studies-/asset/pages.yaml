    so that


    $Y(x) = 1 - e^{-\mu z} \left[ \frac{\lambda/mu}{1+\lambda/mu} + e^{-2\mu z} \frac{\lambda/mu}
    \right]$


    yielding the following approximation:


    $E[Y] = \frac{1}{\mu} \left[ 1 + \frac{\lambda/mu}{1+\lambda/mu} \right] - \frac{1}{2\mu}
    \frac{\lambda/mu}{1+\lambda/mu}$


    $E[Y] = \frac{1}{\mu} \frac{1}{2\mu} \frac{\lambda/mu}{1+\lambda/mu}$


    Thus the pure resequencing delay $E[W] = E[Y] - E[D]$ becomes approximately


    $E[W] = \frac{1}{2\mu} \frac{\lambda/mu}{1+\lambda/mu}$


    # References


    The presentation in this chapter is essentially based on the results of [BGP84]
    and [SG86]. Reference [Bor76] is a good sourse for the mathematical techniques
    used, while [BZ80], [HP82], [KKM81], [LL78] cover early work done on resequencing.
    In [GS79] another approach to the analysis of time-stamp ordering is presented.'
