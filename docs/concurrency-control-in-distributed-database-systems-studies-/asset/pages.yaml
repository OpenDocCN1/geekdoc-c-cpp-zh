    case where the network delay is exponentially distributed we shall have


    ```

    $w(x)=\frac{\mu}{\lambda p}e^{\mu x}(1-e^{-\frac{\lambda p}{\mu}x})$

    ```


    ```

    $w(0)=\frac{\mu}{\lambda p}(1-e^{-\frac{\lambda p}{\mu}})$

    ```'
