  md: '# 16.1. An Isolated Transaction


    of transactions'' access to granules.


    At any moment in time, a transaction may be running, waiting, committing, or aborting.
    If a transaction is running at time $t$, then it will require a new granule in
    the interval $[t, t+\Delta t]$ with probability $u\Delta t + o(\Delta)$. If the
    granule is available, the transaction will lock it and will continue running;
    otherwise it will wait. Similarly, if a transaction is running at time $t$, then
    it will decide to complete in the interval $[t, t+\Delta t]$ with probability
    $\mu\Delta t + o(\mu)$. In that case, the transaction will start to commit.


    A transaction that is waiting for a granule at time $t$ will make another attempt
    to get it in the interval $[t, t+\Delta t]$ with probability $r\Delta t + o(\Delta)$.
    If the attempt is successful, the transaction will start running; otherwise it
    will still wait (if that attempt is not the $(L+1)^{st}$ consecutive for the same
    granule) or it will enter the abort phase if that attempt is the $(L+1)^{st}$
    consecutive.


    Both the commit and the abort are involved with housekeeping operations. A commit
    follows a successful completion of a transaction: all changes to the database
    are committed and all locks are released. A new replica of the transaction can
    then start. On the other hand, an abort follows a series of unsuccessful attempts
    to lock a granule: all changes to the database are undone, all locks are released,
    and the transaction is restarted from the beginning. Both the commits and the
    abortions are assumed to take a time which is distributed exponentially, with
    means linearly with the number $n$ of granules held: $(n-1)Q$ and $(n+1)R$, respectively.


    The states in the life of a transaction are illustrated in Figure 16.1. The dotted
    arrows represent the start of a new transaction.


    At this stage, we introduce two assumptions which are likely to be violated in
    practice but will allow us to account for the presence of the other transactions
    in a painless, yet reasonably accurate way. First, the probability $F$ that an
    attempt by a running transaction to lock a granule is failed to be constant, independent
    of the number of granules locked and of past history. Second, the probability
    $F_1$ that an attempt by a waiting transaction to lock a granule is independent
    of the number of granules locked and of past history.


    If one knows that a transaction has made many attempts to lock a granule and has
    failed, this increases the likelihood that it is in deadlock with other transaction.
    Hence the probability that it will fail again can also increase. Conversely, if
    deadlocks are infrequent, the chance of success may increase with the number of
    retries.


    The state of a transaction can be described by a few integers $(i, n)$.'
