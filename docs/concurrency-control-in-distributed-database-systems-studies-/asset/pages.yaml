    # 7.4 Performance Failures in Hybrid Methods


    The main purpose of constructing hybrid concurrency control algorithms, apart
    from improving DDBS efficiency, has been to solve the problem of performance failures.
    This applies to particular locking algorithms with $T/O$ or validation methods.
    A vast majority of the hybrid concurrency control algorithms are free from deadlock,
    permanent blocking and cyclic restarting. A problem that remains to be solved
    in most algorithms is of infinite restarting, especially with reference to long-lived
    transactions, which can be resolved by the mechanism of data and transaction marking
    presented in Chapter 3.'
