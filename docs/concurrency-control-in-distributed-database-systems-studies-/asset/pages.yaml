    Figure 1.10: Client/server DDBS using a local area network


    module TM and the Data Manager module DM. The task of a TM is to supervise the
    processing of transactions initiated at a site of a DDBS, with the task of a DM
    is to manage the access to the LDB located at a given site. In each module two
    levels can be distinguished: the global level concerning the DBMS and the local
    level concerning LDBMS. The TM and DM modules at the global level of all the sites
    of the DDBS constitute the DDBS.


    A site equipped with only the TM module is known as a transaction access and management
    site. A site equipped with the DM module is known as a data storage and processing
    site.


    Two kinds of DDBS architectures may be distinguished: integrated DDBS and client/server
    DDBS [Cel81], [Mor83], [CM86]. In integrated DDBS all sites are equipped with
    both TM and DM modules. These systems can use wide of area and local area networks
    as a communication medium. The architecture of an integrated DDBS is shown in
    Figures 1.8 and 1.9.


    In a client/server DDBS transaction access and management sites (clients) are
    separated from the data storage and processing sites (servers). In practice, these
    systems use only local networks. The architecture of a client/server DDBS is given
    in Figure 1.10. In some particular cases clients and servers, which are logically
    separated, can share common hardware.'
