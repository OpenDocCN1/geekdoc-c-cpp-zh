    # 5.4 Hierarchical Timestamp Ordering Algorithm


    In this section we present the hierarchical algorithm of the T/O method. It was
    first presented in [Car83] as a response to the objective objections to T/O algorithms,
    namely that the problem of data granularity was largely ignored by them [Gra81]
    1


