  md: "# 10.1. Multivers Validation Algorithm\n\n+   - create version $T_i$; if it\
    \ already exists do nothing;\n- if an arc $(w_{ki}(x), w_{ij}(x))$ is appended\
    \ to $MVSG$ then append an arc $(T_k, T_i)$ to $DMVSRG;\n- if an arc $(w_{ki}(x),\
    \ w_{ij}(x))$ is appended to $MVSG$ and $MVSG$ already contains any arc $(w_{ki}(x),\
    \ r_{pq}(x))$ then append arc $(T_p, T_i)$ to $DMVSRG;\n\n(iv) deletion of versions\
    \ and arcs according to $T_i$'s operations:\n\n+   - delete version $T_i$ together\
    \ with the arcs inserted into it;\n\nThe selection of an appropriate version of\
    \ the data item for a given read operation, i.e. the specification of function\
    \ $h$, is essential to Muro's algorithm. It should be chosen so that queries are\
    \ never aborted. Then we can ask: which of the existing versions of $x$ can be\
    \ read without a danger of creating a cycle in the the $DMVSRG$ graph by adding\
    \ a new arc to it, and without provoking transaction abort? The procedure to select\
    \ an appropriate version of $x$ to be read by an operation $r_{ij}(x)$ is as follows.\n\
    \nSort topologically the vertices of the $DMVSRG$ graph. Since $DMVSRG$ is acyclic,\
    \ all of the versions corresponding to the set of all uncommitted transactions\
    \ executed in the $DBDS$ can be partially ordered. Select for reading a version\
    \ of the data item $x$ written by an uncommitted transaction $T_k$ such that $T_k$\
    \ is the last transaction $x$ preceding $T_i$ in the $DMVSRG$. The last transaction\
    \ preceding $T_i$ is well defined since all transactions in the $DMVSRG$ are partially\
    \ ordered. For transaction $T_k$ must hold: $T_k \to T_i$ writing $x$ and must\
    \ not exist transaction $T_i$ writing $x$ such that $T_k \to T_i \to T_i$. If\
    \ such transaction $T_i$ does not exist, select the oldest version of the data\
    \ item $x$. Note that if an operation $r_{ij}(x)$ reads the version of $x$ created\
    \ by a write operation $w_{ki}(x)$ of an uncommitted transaction $T_k$ preceding\
    \ $T_i$, or if $h(r_{ij}(x)) = w_{ki}(x)$, then reads the oldest version of $x$\
    \ created by an already committed transaction then no cycle appears in the $DMVSRG$.\
    \ Similarly, if an operation $r_{ij}(x)$ reads the version of $x$ created by an\
    \ already committed transaction then no cycle appears in the $DMVSRG$."
