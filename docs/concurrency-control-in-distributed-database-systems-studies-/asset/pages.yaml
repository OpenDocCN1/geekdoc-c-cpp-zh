  md: '# 1.3. Transaction Model


    A transaction can finish normally or abnormally. In the first case we say that
    it is committed. In the second case we say that it is aborted. Until a transaction
    is committed it can be aborted. A transaction itself can issue an abort request
    if it cannot complete correctly, for instance for incorrect input data. A transaction
    can also be forced to abort by the DDBMS, for instance due to the constraints
    of concurrency control.


    A transaction can be a part of a larger user''s application program containing
    many transactions. An important point is, however, that no database operation
    can be executed outside the framework of a transaction.


    We assume that transactions are independent of each other, i.e. that they do not
    directly communicate. The only way they can communicate is by storing and retrieving
    data in the DDB.


    In order to maintain arbitrary consistency constraints imposed on a DDB, despite
    possible crashes and without unnecessarily restricting the concurrent processing
    of programs, a transaction must have the following properties:


    +   (i) consistency, which means that each transaction maps a DDB from one consistent
    state to another, while the DDB does not have to be in a consistent state during
    transaction execution;


    +   (ii) atomicity, which means that when a transaction contains write operations,
    all or none of them must be performed. In other words, if a transaction has to
    abort then all changes it has made in the DDB have to be restored;


    +   (iii) durability, which means that when a transaction is committed the changes
    made by it in the DDB will never be lost even when the system crashes.


    The second and third property are sometimes together called totality. They protect
    a transaction against failure in reading inconsistent states of the database.
    Note that according to the third property, once a transaction has been committed
    then its effects can only be altered by executing other transactions.


    We now introduce the following formal transaction model [CM86b], [Gra80], [Kan81],
    [Mor83].


    Transaction T_i is defined as an ordered pair:


    $(\overline{T_i}, <r_i)$


