    so that they are mutually consistent and reflect the current state of the DDB.
    Each time an update transaction completes, all CTL lists must be updated. This
    must be done in an atomic manner, i.e. either all CTL are updated or none. One
    of the possible ways of updating is twphase commit procedure. However, this would
    require locking CTL lists and providing deadlock detection and elimination procedures.
    For this reason, the problem has been solved differently. Each CTL kept at a given
    site contains full and current information about the set of transactions that
    were initiated and completed at this site. Each update is performed according
    to the 2PL algorithm. In the locking phase the TM supervising its execution sends
    requests to the LDBs that are participating in the execution of the transaction.
    Each response is sent to the TM copy of the local CTL. Using local CTL lists,
    the TM creates the global CTL list and appends it to each write request it sends
    to all the LDBs participating in the execution of the transaction. LDBs use the
    global list they receive to update their local CTL lists.


    The execution of a query begins with a dispatch of requests for copies of local
    CTL from all LDBs that contain required data items. They are used to verify which
    updates have been completed and then to determine a set of consistent data versions.


    The problem of efficient organization of the version pool was solved as follows.
    Successive versions of a data item are stored in the form of a chain in reverse
    chronological order. Each version has a unique identifier corresponding to the
    timestamp of the transaction that updated. The selection of a given version for
    reading is determined by the CTL and is made by searching the chain of versions
    in the version pool.


    The last problem mentioned above is about efficiently implementing the procedure
    of garbage collection. Two questions need to be answered. First, when to execute
    the garbage collecting procedure, that is, when to remove the "old" versions of
    the data items that are no longer useful for the transactions currently executing,
    and second how to ensure its efficiency. If the procedure for removing the old
    versions is initiated too early, some queries will not be executed because they
    will not be able to access the older data'
