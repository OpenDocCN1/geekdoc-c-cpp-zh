    # Optimum Number of Centers for a Replicated DDBS


    The preceding analysis leads directly to the following question. Suppose that
    in order to increase overall reliability and processing capacity, it has been
    decided to place all of the data D at each of the n sites, and that the transaction
    stream now concerns all of the centers:


    ```

    $$\lambda_i = \lambda, \quad 1 \le i \le n.$

    ```


    We now ask what the optimum number of centers may be if our objective is to maximize
    the effective processing capacity $\pi_E$. Since all centers are identical we
    shall take


    ```

    $$f_i = f, \quad 1 \le i \le n.$

    ```


    We then have


    ```

    $$\pi_E = N\lambda(1 - \lambda f)/E(e^{\lambda\tau}) - 1$$

    ```


    where $\tau_i = \tau$. We see by taking the derivative with respect to $N$ and
    setting it to zero that the optimum number of sites which maximizes $\pi_E$ must
    satisfy


    ```

    $$N = (1 - \lambda f)/\frac{\partial f}{\partial n}.$$

    ```


