    non-serializable schedules.


    In Garcia-Molina''s concurrency control method semantic information about the
    set of transactions is used directly in the definition of the set of correct schedules
    $C(r)$. This definition takes the form of the set of rules specifying transactions
    or groups of transactions which can be executed concurrently, even though their
    schedules are not serializable.


    Recall from Chapter 2 that in Garcia-Molina''s semantic concurrency model every
    transaction is a sequence of atomic steps each performed at a single DDBS. We
    say that two transactions are compatible if it is possible to interleave their
    steps without violating database consistency. In order to define transaction compatibility
    for a given application, the user classifies transactions into groups called semantic
    types. For a semantic type Y we define a set of compatible semantic types CS(Y),
    and we call its elements interleaving descriptors (dw).


    Note that the classification of transactions and their inter-relationships is
    performed by the user, that is at the level of application. Thus, it is the user
    who takes the responsibility for maintaining database consistency and for ensuring
    the necessary degree of concurrency.


    # 11.2 Algorithm


    In this section we present Garcia-Molina''s algorithm. We make two preliminary
    assumptions which, without changing the essence of the method, allow for the simplification
    of the algorithm and a reduction of the cost of its implementation in a DDBS.
    The first assumption is as follows. For each semantic type Y, if the set CS(Y)
    contains an interleaving descriptor dw such that $dw \in CS(Y)$ and $dw \neq \emptyset$
    then $dw \in Y$. This means that transactions of the same semantic type are allowed
    to interleave their steps if they can interleave their steps with transactions
    of any other semantic type.


    Before presenting the second assumption, consider the concepts of local and non-local
    semantic types. A semantic type Y is local if every transaction T such that $type(T)=Y$
    consists of a single step. A semantic type is non-local. The set of all local
    transaction types is denoted by LOCAL. Obviously, a transaction of a local semantic
    type is executed at a single DDBS site.


    The second assumption can be formulated as follows. For any semantic type Y such
    that $Y \notin LOCAL, |CS(Y)| = 1$, where $|CS(Y)|$ denotes the size of the set
    CS(Y). In other words, for each local semantic type Y,'
