  md: '# 12


    # Abstract Data Type Synchronization Method


    # 12.1 Concept


    The abstract data type synchronization method is inspired by research in distributed
    operating systems and programming languages oriented toward distributed systems
    [AM85], [BSE*83], [Lis82], [LS83], [Wei83], [BR87], [LS83], [SDD*85]. In particular,
    the work on the incorporation of a concept into programming languages was of great
    significance considered in Parts II and III of this book (cf. Section 1.3), in
    which a transaction is defined as a partially ordered set of read and write operations.
    Recent work on the implementation of transactions in DDDBs has suggested the need
    to extend and develop the traditional transaction model so as to simplify the
    development of software for distributed systems.


    From the viewpoint of concurrency control in DDDBs, the modification of the three
    following aspects of the transaction model are important.


    Firstly, the set of operations involved in a transaction is extended to include
    operations that are specific to a particular object type, e.g. directory, queue,
    data item, procedure, stack, library, etc., in addition to simple data item read
    and write operations. In other words, a transaction acting on, say, a queue uses
    operations that are specific to queues, e.g. initialize queue, enter into queue,
    remove from queue, etc.


    Secondly, the traditional model, where a task is performed by one transaction
    or a set of independent transactions, is modified to allow inter-'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# 12. Abstract Data Type Synchronization Method


    transaction communication and cooperation.


    Finnally, it is possible to initiate nested transactions within a transaction
    [Bee84], [BBG*83], [Mos81], which allows for more flexible software to be designed,
    requires intra-transaction communication mechanisms.


    In this chapter we present a concurrency control method, called the abstract data
    type synchronization method, which uses a transaction model extended by the first
    modification mentioned above. The remaining two extensions of the transaction
    model, i.e. synchronization of cooperating transactions and synchronization of
    nested transactions, are new research areas and the results obtained so far are
    still preliminary. Problems concerning cooperating transaction synchronization
    are considered in [GD85], some problems of nested transaction synchronization
    are discussed in [BBG*83], [Bee84], [WS84], [Wei86].


    We now present the basic concepts and definitions concerning the synchronization
    of abstract data types.


    The basic concurrency control model is considered in this section that of an abstract
    data type (ADT) [GH80], [GHM78], [GTW76], [Mor81], [Mor83], [Wei83]. An ADT is
    understood as a set of values of particular type together with a set of operations
    that are specific to them. Examples of a ADTs in this model are queue, directory,
    data, buffer, stack, library, etc. The semantics of the operations of a given
    ADT are formally defined by a set of axioms. In a DDBS environment ADTs are assumed
    to be shared more than one transaction. In the literature the term abstract data
    type that is, they can be accessed concurrently by more than one transaction is
    often replaced by the term object. We will treat these terms as synonyms for the
    remainder of this chapter.


    In the concurrency control model we are considering the definitions of a transaction
    and a schedule in Sections 1.3 and 2.1 are still valid, except that now the set
    of operations that make up a transaction includes all the operations of the ADTs
    in addition to read, write, and in some cases, locking operations. In the following
    examples we consider schedules of transactions operating on abstract data types.


