  md: '# A Global Approach to the Evaluation of Overload Caused by Concurrency Control
    Algorithms in DBBSs


    The purpose of this chapter is to discuss the global effect of concurrency control
    on the performance of a distributed data base system. Indeed, concurrency control
    algorithms influence the performance at each LDBS in ways which will be discussed
    in Chapters 15, 16, and 17. However, these algorithms also have an effect on the
    performance of the system as a whole, in a manner which cannot be perceived by
    examining only the local level.


    The influence of the concurrency control algorithm occurs in several ways at the
    global level. First of all it induces message and packet traffic in the network
    which links the LDBS sites together, over and beyond the traffic induced by data
    base transactions. This additional traffic also influences the time spent by the
    computers at each LDBS in handling routines; it reduces the time available at
    each computer for managing the LDBS and therefore degrades the performance of
    each site. Secondly, the concurrency control algorithm will often create software
    synchronisation between the various LDBS, both at the communication protocol level
    for the exchange of acknowledgement messages, and for the purpose of the algorithm
    itself. It is well known that in a system with interacting components,,'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# 282 14. A Global Approach to the Evaluation...


    global performance is strongly influenced by the slowest components. Thus the
    effect of the concurrency control algorithm, which necessarily requires different
    sites'' interaction indicated in Chapter 13, can slow down each of the LDBS via
    the effect of the slowest local system.


    The approach taken in this chapter will address these issues in the context of
    a general mathematical model. In particular, we shall show how performance evaluation
    methodology can be used to evaluate the effect of a concurrency control algorithm
    in a distributed data system.


    We consider a system consisting of $N$ sites $s_1, \dots, s_N$ interconnected
    by a communication medium which behaves as a virtual ring: site $(i)$ can only
    send messages to $(i+1)$, and receive messages from site $(i-1)$ for the purposes
    of the concurrency control algorithm, the successor of $s_N$ being $s_1$.


    Each site is assumed to store a copy of the same data base. Thus we are dealing
    with a partially or completely duplicated DDBS.


    We assume that transactions arrive to the system at a rate of $\lambda$ transactions/unit,
    and that each transaction occupies site $i$ for a time of average value $f_i$
    which is composed of two parts $f_i = w_i + g_i(N)$ where $w_i$ is the average
    processing time of the transaction once the transaction manager decides that this
    transaction is allowed to be executed at the LDB. $g_i(N)$ is, the average time
    during which the LDB is blocked by the concurrency control algorithm before the
    transaction, and depends on the number of sites $N$, or more precisely on the
    number of sites concerned by the transaction.


    We shall suppose that the concurrency control algorithm is of the “two-phase commit”
    type, with an initial portion of average length $g_i(N)$ when sites are being
    locked.


    Clearly $f_i$ does not include the time during which a transaction may be queued
    waiting for its turn to be processed.


    The performance measures which will be considered related to both the total load
    which transactions impose on the system and on the effect of the concurrency control
