    # Basic Definitions and Models


    In Chapter 1 a formal model of a DDBS is presented with a discussion of its components.
    Chapter 2 gives three basic models of concurrent execution of a set of transactions:
    a syntactic model of monoverversion serializability, a syntactic model of multiversion
    serializability and a semantic model of multilevel atomicity. In Chapter 3 DDBS
    performance failures, i.e. deadlock, permanent blocking, and cyclic and infinite
    restarting, are introduced.'
