    < create Tran-list(x) >;nTran-list(x) ← -

    Tran-list(x) ← Tran-list(x) ∪{Ti''s request};

    CT(Tran-list(x)) ← -;

    ```


    If the data item x already has a transaction request list is appended to its end.
    If it is immediately preceded by a request of a transaction Tj such that TS(Ti)
    > TS(Ti), then the list is ordered in accordance with rule R2.


