  md: '# 6. Validation Method


    resolve data access conflicts. Cyclic restarting occurs only in a distributed
    environment. Both kinds of performance failures particularly concern long transactions.


    The techniques for performance failure resolution proposed so far have been limited
    to infinite restarting.


    The simplest and also the least effective solution is the one proposed in [KR81].
    It involves blocking the entire database in order to allow the infinitely restarting
    transaction to execute completion.


    In [PSU86] another solution to infinite restarting was proposed. When a transaction
    $T_i$ is found to be restarting indefinitely a substitute transaction, denoted
    by $T_i''$ is created, such that $fr(T_i'') = fr(T_i)$ and $fw(T_i'') = fw(T_i)$.
    $T_i''$ is present in the system concurrently with $T_i$. When $T_i$ executes
    to completion, $T_i''$ is eliminated from the system.


    When initiated, the substitute transaction $T_i''$ receives a unique identifier
    $TC(T_i'')$ equal to the current value of the GTC and a status of an aborted transaction.
    $T_i''$ differs from $T_i$ in that it does not perform any operations to the database.
    However, it is included in the sets $T_{SF}(T_i)$ of all transactions executed
    concurrently with $T_i$. Therefore, any transaction $T_i$ is aborted (i.s. if
    $fr(T_i) \cap fw(T_i'') \neq \emptyset$). If the transaction $T_i$ is data independent
    (i.s. its read and write sets do not change during the subsequent transactions
    of $T_i$''s restarting), the above mechanism provides a correct solution of infinite
    restarting. In the case of data dependent transactions, this mechanism only makes
    infinite restarting less probable.


    The combined problem of infinite and cyclic restarting can be solved by the method
    of data marking presented in Chapter 3 [CM85b]. For data marking to be incorporated
    into the validation method, two more modifications of this method are necessary.
    First, the moment it is initiated, each transaction $T_i$ is assigned an initiation
    timestamp, denoted by $ITS(T_i)$, which does not change when the transaction is
    restarted. Second, a set denoted by $mark-set$ of data items which are accessed
    by the restarting transactions is identified. Associated with each data item $x_k
    \in mark-set$ is $mark(x_k)$, which takes the value of the initiation timestamp
    of the oldest transaction that requests access to the data item.


