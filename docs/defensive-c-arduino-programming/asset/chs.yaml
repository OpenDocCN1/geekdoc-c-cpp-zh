  \ 通过 ID 识别类/函数。\n\n类与函数名引用框架（第 176 页）提供了识别事件来源的机制：哪个类中的哪个函数触发了事件。类名和函数名可以用于识别事件，但由于需要在类和函数定义中存储字符串形式的，这些需要大量的内存。\n\
  \n\n\n\n\n# 类与函数名称引用框架\n\n## CandFnames 处理所有工作\n类名和函数名数组由 `CandFnames` 类（类名/函数名数组结构体、类枚举列表、类特定函数枚举列表以及函数名数组）管理。该类的\
  \ `Get` 函数使用 ID（枚举）来生成用于报告的类名和函数名字符串：\n\n```cpp\nclass CandFnames{\npublic:\n  \
  \  CandFnames();\n    ~CandFnames();\n    char* GetClassName (uint16_t _classID);\n\
  \    char* GetFunctionName ( uint16_t _classID, uint8_t _functionID);\n    uint16_t\
  \ GetNumberOfClasses();\n    uint8_t GetNumberOfFunctions (uint16_t _classID);\n\
  \    bool CheckClassID (uint16_t _classID);\n    bool CheckFunctionID (uint16_t\
  \ _classID, uint8_t _functionID);\n    void PrintClassList();\n    void PrintFunctionList\
  \ (uint16_t _classID);\nprivate:\n    ClassesAndFunctionsNames classesAndFunctionsNames[EClassNames::end];\n\
  \    uint16_t classID{0};\n    uint8_t functionID{0};\n}; // class CandFnames\n\
  ```\n\n该类的大部分函数用于内部管理。从用户角度来看，`GetClassName` 和 `GetFunctionName` 是两个相关的函数。该类包含了内部检查，以防止使用无效的类和函数索引。如果发现此类错误，则由程序员决定如何处理：终止并修复问题，或者在报告中使用默认类名或函数名。\n\
  \n## 自动插入类和函数 ID\n为了使系统运行，需要创建枚举列表和名称数组，并在每个类和函数中插入枚举标识符。对于小型应用程序，手动进行这些插入是，但大型应用程序可能有\
  \ 100 多个类和每个类 10 多个函数，总计需要管理 1000 多个名称。手动创建枚举、结构体内容和 `char*` 数组既耗时又容易出错。此外还存在在所有类和函数声明中插入\
  \ ID 的问题。鉴于完成此任务的工作量，强烈建议进行自动化。这需要一个特殊程序，该程序在第一遍提取类名和函数名，并在第二遍通过插入 ID 作为变量以及 `GetFunctionIDs`\
  \ 作为类函数来相应地修改源代码。这一过程被称为插桩（Instrumentation）。\n\n可以编写一个微型编译器来识别类和函数，但这是编译器编写人员留的任务，需要专门的技能。`lex`（词法分析）和\
  \ `yacc`（另一个编译器生成器）也可以使用；但其实现非常复杂，且存在灵活性不足的风险。然后是 Perl，它具有类 C 的编程语言和正则表达式引擎。它可以是创建一个从\
  \ C++ 源文件中提取所需数据的合适工具。它可以生成一个 `.h` 文件和一个 `.cpp` 文件，其中包含枚举和字符串数组，这些文件可以添加到项目中。它还可以通过在类和函数中插入枚举标识符和\
  \ `GetID` 函数来对项目源文件进行插桩，修改后的文件放在单独的目录中保留原始文件。一旦完成插桩，程序员需要修改一个应用程序源文件——执行 `#include\
  \ \"CandFnames.h\"` 并添加 `#define USE_CLASS_NAMES` 来开启或关闭框架。当然，应该对应用程序进行重新测试。参见类与函数名称引用框架插桩（第\
  \ 178 页）。\n\n最后一点：类名和函数名可以存储在 EEPROM 中以节省贵的 RAM 空间。这可以通过 `DataGroup` 框架的 `DataGroup`\
  \ 类处理。这已被搁放在以后考虑。\n\n# 1. 内存管理框架（附录）\n\n## 专用框架\n掌握应用程序运行时的内存使用情况至关重要。在开发和测试阶段，内存管理框架（第\
  \ 179 页）注册分配和释放信息并验证分配成功。当应用程序结束时，报告显示内存是如何使用的、由谁使用的以及是否存在内存泄漏。内存管理框架的组件有：\n\n*\
  \ `MemMgt` - 处理内存管理事件的主类。\n* `MemAllocEvt` 和 `MemAllocList` - 管理分配的基类。`MemAllocEvt`\
  \ - 为每次内存分配和释放创建内存分配事件。它们包含以下内容：唯一事件标识符、分配的字节数、可用堆空间、类和函数 ID 以及行号。它继承自 `LinkedItem`\
  \ 类。\n* `MemAllocList` - 此类管理 `MemAllocEvts` 链表。它显示内存分配历史并显示活动项（未释放的项）。它继承自 `LinkedList`\
  \ 类作为链表存储。参见链表框架 (第 172 页)。\n* `TotalHeap` 计算堆空间、碎片化空间和连续空间。`FragmentedHeap` 函数计算总和最大可能的分配（最大空洞）。`ContiguousHeap`\
  \ 函数计算分配空间顶部与栈底之间的空间。\n* 重载的 `new`/`new[]` 以及相应的 `delete`/`delete[]` - 如果分配成功，重载运算符\
  \ `new` 将向内存列表添加一个 `MemAllocEvt`；否则，它将其注册为错误事件以供以后报告。参见运算符重载 (第 186 页) 和 错误报告框架\
  \ (第 185 页)。\n\n内存分配事件链表是内存管理框架报告系统的底层构建模块。这些事件包含以下内容：\n\n* 唯一分配数字标识符 - 当通过 `new`\
  \ 创建对象时，会分配一个唯一的分配数字，该数字用于验证哪些对象未被删除，从而揭示可能的内存泄漏。该数字将对象的创建与其对应的释放关联。\n* `classIndex`\
  \ 和 `functionIndex` - 注册类以告知（如果是全局函数进行的分配则为全局）。报告时，`classIndex`（硬编码在每个类中）通过类与函数名称引用框架的机制获取类名。`functionIndex`\
  \ 也硬编码在每个函数内部的局部枚举中，用于获取函数名。参见类与函数名称引用框架 (第 176 页)。\n* 内存分配事件分为创建事件和释放事件。每个事件都有一个对应的枚举进行标识。\n\
  \n\n\n\n\n- **字节数** - 当项被创建或释放时，由重载的 `new` 运算符会记录字节数。它包含了 `MemAllocEvt` 实例的开销内存需求。\n\
  - **堆空间占用** - 随着对象的创建/释放，堆空间会缩小/扩大。但还有另一种机制在消耗/释放堆空间：函数调用。随着函数的调用和退出，栈会随之增长和收缩。在发生分配/释放以及函数被调用和退出时，定期显示堆空间，有助于检测栈和堆何时存在碰撞的风险。\n\
  \n记录事件的内存分配或释放需要累加以下内容：\n\n- 通过 `sizeof` 运算符计算类的内存需求总和，即：`sizeof(MyClass)` 加上指针的\
  \ 2 字节。\n- `MemAllocEvt` 的开销内存需求，已包含在分配字节计数中。\n- 该类可能需要的任何额外内存需求将由重载的 `new`/`new[]`\
  \ 运算符单独记录。\n\n类 `MemMgt` 在应用程序开始时实例化一次，它提供了监控内存使用情况的函数。\n\n<x>内存管理框架[AUX]MemMgt\
  \ - 处理内存管理事件的主类</x>\n```cpp\nclass MemMgt {\npublic:\n  MemMgt();\n\n  // 内存需求\n\
  \  int16_t CalculateMemAllocEvtSize (uint16_t _classIndex, uint16_t _classSize,\
  \ EMemCreateRemove labelCreateRemove);\n  void HandleMemoryConstructor (uint16_t\
  \ _classIndex, uint8_t _functionIndex, char** functionLabels, uint16_t _classSize);\n\
  \  void HandleMemoryDestructor (uint16_t _classIndex, uint8_t _functionIndex, char**\
  \ functionLabels, uint16_t _classSize);\n\n  // 创建对象计数\n  uint16_t GetNetObjectsCreated();\n\
  \  uint16_t GetGlobalMemObjectCreated();\n  void NetObjectsCreatedIncrement();\n\
  \  void NetObjectsCreatedDecrement();\n\n  // 堆空间测量\n  void SetInitialHeapSpace\
  \ (uint16_t _initialHeapSpace);\n  int16_t GetInitialHeapSpace();\n  void AdjustTheoreticalHeapSpace\
  \ (int16_t _delta);\n\n  // 创建/销毁 F/U 项\n  void CreateMemAllocItem (uint16_t _classIndex,\
  \ int16_t _memAlloc, char* _callingFunction, int _lineNo);\n  void DestroyMemAllocItem\
  \ (uint16_t _classIndex, uint8_t _functionIndex, int16_t _memoryAllocation, char*\
  \ _callingFunction, int _lineNo);\n  MemAllocEvtList* GetMemAllocEvtList();\n  void\
  \ IncrementTheoreticalHeapSpace (int16_t _increment);\n  uint16_t GetTheoreticalHeapSpace();\n\
  \  void CompareRealMinusTheoreticalHeapSpace (uint16_t _heapSpace);\n  void Print();\n\
  \  void PrintReportingMemAllocStats();\n\nprivate:\n  MemAllocEvtList* MemAllocEvtList;\n\
  \  // 这些任何时刻活跃的 new 和 malloc 对象的数量\n  // 每个对象的创建都会获得一个唯一的 new 数字，这些数字不会递减\n  static\
  \ uint16_t netObjectsCreated;\n  static uint16_t globalMemObjectCreated;\n  static\
  \ uint16_t initialHeapSpace;\n  static uint16_t theoreticalHeapSpace; // 随着对象的创建/销毁而发生变化\n\
  }; // class MemMgt\n```\n\n类 `MemAllocEvt` 继承自 `LinkedItem`，以便事件可以存储在链表中。它包含四个变量以及它们相应的\
  \ Set/Get 函数。它将类索引、函数索引和行号传递给基类 `LinkedItem`：\n\n```cpp\nclass MemAllocEvt: public\
  \ LinkedItem {\npublic:\n  MemAllocEvt (uint16_t _classIndex, uint8_t _functionIndex,\
  \ int _lineNo, EMemCreateRemove _status, uint16_t _allocNumber, int16_t _memAlloc);\n\
  \  void PrintItem (bool _insertNewline);\n  int16_t GetMemoryAllocated();\n  uint16_t\
  \ GetAllocNumber();\n  uint8_t GetStatus(); // 0 或 1 (0 表示删除 1 表示创建)\n\nprivate:\n\
  \  uint16_t allocNumber{0}; // 分配标识符\n  int16_t memAlloc{0}; // 分配的内存\n  int16_t\
  \ heapSize{0}; // 堆\n  uint8_t status; // 0 或 1 (0 表示删除 1 表示创建)\n}; // class MemAllocEvt\n\
  ```\n\n下面的代码表明位于第 285 行、分配号 23 的函数 `DoSomething` 分配了 26 字节内存，且在分配后堆空间为 554。稍后，同一个函数\
  \ `DoSomething`（第 326 行、分配号 23）释放了 26 字节，堆空间增加到 580 字节。\n\n```\nMemEvent 23 class\
  \ Sample::DoSomething:285 create 26 heap space = 554\nMemEvent 23 class Sample::DoSomething:326\
  \ release 26 heap space = 580\n```\n\n由于分配 23 既被创建又被释放，它不再是一个活跃的分配。\n\n单独的 `MemAllocEvt`\
  \ 项由继承自 `LinkedList` 的类 `MemAllocEvtList` 管理。\n\n```cpp\nclass MemAllocEvtList:\
  \ public LinkedList {\npublic:\n  MemAllocEvtList(): LinkedList {};\n  void PrintList();\n\
  private:\n  int16_t totalAllocated{0};\n}; // class MemAllocEvtList\n```\n\n`PrintList`\
  \ 函数将打印所有活跃的分配项。当应用程序结束时，所有的分配都应该已经释放。未释放的分配将导致内存泄漏。\n\n### 1. 异常处理框架（补充）\n\n由于\
  \ C++ 不支持异常，我将使用 `setjmp` 和 `longjmp` 来创建替代方案：\n\n想象一下：你是一个徒步队的领队。在某一点你停下来告诉队员们：“如果出现问题，停下来返回这里。我们将决定下一步做什么。”理解这种异常处理机制的关键在于停止并返回。当你在代码内部\
  \ `try` 某些内容时，你定义了一个返回点。\n\n想象一种情况：函数检查某个变量的值不为零。如果它为零，应用程序发生了错误。程序执行可能需要中断。我将在下面的场景通过\
  \ `DoWork` 函数演示这种行为。\n\n- 在函数调用链的深处触发 longjmp 回到 setjmp 点\n- setjmp (try) 设置落地点\n\
  - longjmp (throw) - 返回落地点\n\n在函数调用链的深处，函数 `DoWork` 检测到错误 - 因此它必须处理。它通过触发带有适当参数的\
  \ `longjmp` 来这样做，将执行从 `DoWork` 内部一直传回 `setup` 中的 `setjmp(envGlobal)` 点。`longjmp`\
  \ 返回错误编号 `EErrorType::illegalZero` 以标识问题。\n\n```cpp\n// 可能位于函数调用链的深处\nvoid DoWork()\
  \ {\n  ...\n  if (newItem == 0 ) {\n    // 在此处进行错误报告\n    longjmp(envGlobal, EErrorType::illegalZero);\
  \ // 获取了错误\n  } // if\n  ...\n} // DoWork()\n```\n\n`setup` 中的 `if(setjumpReturn\
  \ != 0)` 语句测试错误编号；如果非零，则执行 `if` 语句内部的代码（`goto ErrorExit`）。\n\n这种错误处理系统的机制在某种微妙之处在于\
  \ `jmp` 会被进入两次：第一次是在进入 `setup` 时，返回 0（因为尚未调用 `DoWork` 所以尚未触发 `longjmp`），第二次是在 `DoWork`\
  \ 内部执行工作时触发 `longjmp`。\n\n\n\n\n\n如果落地点 `setjmp` 返回的值不为 0，则意味着触发了包含错误原因的 `longjmp`。执行将回滚到\
  \ `setjmp` 所在的位置。由于 `setjmp` 返回了非 0 值，`if(setjumpReturn != 0)` 代码将打印一条消息并将执行重定向到由标签\
  \ `ErrorExit` 定义的位置。\n\n程序流可能会被 `longjmp` 回滚到 `setjmp` 这一事实，要求在继续执行包含 `longjmp`\
  \ 的代码之前，必须放置 `if(setjmp return value)` 检查。这是反直觉的——人们会认为你应该先开始工作，并在工作内部对错误进行测试。如果你这样做，就会陷入无限循环中。让我来解释一下。假设你按照如下方式编写代码（伪代码）：\n\
  \n```\nerror = setjmp()\n\nDoWork()\n\nif (error != 0 ) goto ErrorExit\n```\n\n\
  这是事件的发生流程：\n\n*   `Do error = setjmp()` - 由于尚未触发任何 `longjmp`，`error` 被设置为 0。\n*\
  \   进入 `DoWork` - 在调用链的深处遇到了错误。它触发了一个 `longjmp`，将控制权回传到 `error = setjmp()`。`error`\
  \ 被设置为非零值。\n*   `DoWork` 再次被调用；遇到了一个错误；执行再次回传到 `error = setjmp()`。\n\n上述过程会无限重复——你刚刚为自己创建了一个无限循环。\n\
  \n另一个要求 `setjmp` 必须在包含 `longjmp` 的代码之前调用的原因是，`longjmp` 在被触发时应该知道去向哪里。必须首先调用一次 `setjmp`\
  \ 来定位，以防它被 `longjmp` 调用。以下是设置 `setjmp/longjmp` 机制的方法：\n\n*   首先定义一个 `setjmp`，它第一次运行时会返回\
  \ 0，因为还没有触发 `longjmp`。\n*   在 `setjmp` 之后，插入一个 `if` 来测试 `setjmp` 的返回值，从而判断是否触发了\
  \ `longjmp`。第一次运行时，`setjmp` 返回 0，跳过 `if` 的内容。\n*   继续像常一样进行工作，如果发生错误，从 `DoWork`\
  \ 开始的调用链深处的 `longjmp` 将控制权传回 `if` 之前的 `setjmp`。\n*   如果错误触发了 `longjmp`，`setjmp`\
  \ 将被第二次调用。现在它返回一个非零值。程序流进入 `if(setjumpReturn != 0)`。错误被处理，控制权转移到 `ErrorExit`，跳过\
  \ `DoWork`。\n\n重要！！理解上述内容的关键在于 `if(setjumpReturn != 0)` 被遍历了两次（见下文代码）：\n\n*   第一次进入设置或任何地方时——当程序流进入\
  \ `setjmp` 时，它返回 0，因为尚未检测到错误。`if(setjumpReturn != 0)` 不会被激活，因为 `setjmp` 的返回值为 0，因此程序流进入\
  \ `if` 之后的常规工作（上方的 `DoWork`）。\n*   第二次——如果在函数调用链深处检测到错误，则会触发 `longjmp`。程序流回溯到 `setjmp`，但这次它返回非零值，程序流被转移到\
  \ `if(setjumpReturn != 0)` 内部。它通过将正常执行跳出并转移到 `ErrorExit` 来处理错误。\n\n一旦触发了 `longjmp`，就由程序员决定要做什么。可以执行\
  \ `goto end`，或者实现另一个向下的 `setjmp/longjmp` 对，以逐步接近应用程序的起点。你可以想象错误处理具有一个树形结构。每个节点都包含一个\
  \ `setjmp`，作为树上 `longjmp` 的落地点。\n\n以下是 `setjmp/longjmp` 伪异常处理代码（等同于 C++ 异常处理中的 catch）。\n\
  \n你首先需要设置全局 `jmp_buf` 变量，将 `longjmp` 绑定到特定的 `setjmp`：\n\n```\n// 全局空间\n\n...\n\n\
  jmp_buf envGlobal; // 示例 setjmp 的全局变量\n\n...\n```\n\n然后你需要定义一个落地点。在这种情况下，落地点（`setjmp`）放置在\
  \ `setup` 中，位于 `DoWork` 之前。\n\n```\nsetup() {\n\n...\n\nint setjumpReturn = setjmp\
  \ (envGlobal); // 这是落地点\n\nif ( setjumpReturn != 0 ) { // setjmp 错误处理\n\nSerial.print(F(\"\
  setjumpReturn = \")); Serial.println(setjumpReturn);\n\n// goto handle error - 根据\
  \ longjmp 参数在某处记录信息\n\ngoto ErrorExit;\n\n} // if\n\n// 处理正常流程\n\nDoWork();\n\n\
  Serial.println(F(\"Finished normally - normal EXIT\"));\n\ndelay(100);\n\nreturn;\n\
  \n// 处理错误处理\n\nErrorExit:\n\nSerial.println(F(\"setup() Error EXIT\"));\n\ndelay(100);\n\
  \nreturn;\n\n} // setup()\n```\n\n最后，你需要在代码中进行错误检查。如果确实发生了错误，则调用带有错误代码的 `longjmp`（在下方的\
  \ `DoWork` 中进行了插图）。\n\n```\n// longjmp 可能深处在从 DoWork 开始的函数调用链深处\n\nvoid DoWork()\
  \ {\n\n...\n\nif (newItem == 0 ) {\n// 进行错误报告\n\nlongjmp(envGlobal, EErrorType::zeroValue);\
  \ // 发生错误\n\n} // if\n\n...\n\n} // DoWork()\n```\n\n尝试一下并熟悉这三个组件（`env_buf`、`setjmp`、`longjmp`）。整个机制虽然微妙但实现相对简单。\n\
  \n### 1. 错误报告框架（附录）\n\n#### 专用框架 [AUX] 错误报告框架\n错误报告框架与内存管理的相似之处在于它们都继承自链表。枚举和相应的数组提供了这些机制。\n\
  \n```cpp\nenum class EErrorType: uint8_t {\nstart = 0,\noutOfBounds = 0,\nbadAlloc,\n\
  illegalExit,\n...\n};\n\nchar* errorType[] = {\n\"outOfBounds\",\n\"failedAlloc\"\
  ,\n\"illegalExit\",\n...\n};\n```\n\n\n\n\n\n## 函数级宏\n\n- **函数级宏**：每个函数都可能包含标准化的宏，用于指示进入/退出、提供参数和返回值，并告知所选项目的信息。\n\
  - **调试控制宏**：这些宏根据应用程序的架构进行分组，即：应用、文件、函数。\n\n这三类宏将在随后的章节中进行详细介绍。\n\n### 全局级宏\n\n\
  全局级宏可以在应用程序的任何地方使用：函数深处或靠近程序的入口函数。该组由四个宏组成（这些宏在下文中会有进一步阐述）：\n\n- **里程碑宏突出程序位置**：`Milestone`\
  \ 宏（见下一节）通过极高的可见性帮助识别关键事件，以便在串口监视器的输出中轻松找到。这些消息节节使用，可以清晰地划分输出块。例如，我的蜂巢称重系统（它发送/接收短信、报告并从蜂巢获取数据）可以组织成不同的执行块。里程碑可以在串口监视器输出中清晰地划分这些块。\n\
  - **当资源耗尽（电压、内存...）时触发的严重报告宏**：`Critical reporting macros` 会静默地运行在策略性背景中。当资源变得关键时（例如低电压、内存不足或时钟停止工作），它们会被激活。这里是我的蜂巢称重系统中的示例。由于我的原型运行在电池上，我使用严重宏来指示电压较低，是时候更换电池了。另一个例子：如果堆空间运行不足或堆碎片严重，严重宏会显示相关信息。\n\
  - **错误报告宏打印高可见度文本以描述错误**：`Error reporting macros` - 正如之前在`良好编程实践`中建议的，永远不要假设任何情况。始终对参数进行有效性检查。当有效性信号指示问题时，宏将报告函数名和行号、调用函数名和行号，以及描述该问题的文本。这里没有错误处理，宏仅仅报告发生了某事。\n\
  - **内存使用宏告知当前可用内存和堆碎片情况**：`Memory use macros` - 堆空间宏可以放置在任何地方，用于告知当前可用内存和堆碎片情况。\n\
  \n### 里程碑宏\n\n里程碑通过打印带有开头和结尾高可见度字符序列的文本来突出程序的位置。一个典型的里程碑宏看起来如下所示：\n\n```cpp\n#define\
  \ MILESTONE_DISPLAY(desc) \\\nSerial.println(F(\"<MMMMMMMMMMMMMMMMMMMMMMDDDDMM>\"\
  )); \\\nSerial.println(F(desc)); \\\nSerial.print(__FUNCTION__); Serial.print(F(\"\
  :\")); Serial.println(__LINE__); \\\nPRINT_VALUE_EQUAL(millis()) \\\nSerial.println(F(\"\
  <MMMMMMMMMMMMMMMMMMMMMMDDDDMM>\"));\n```\n\n此宏满足了多个需求：\n\n- **可见性**：它打印两行重复的、可见的字符。这是一个引人注目的标记，有助于人们在大量的打印输出中找到它。\n\
  - **标识**：它接收一个字符串参数来揭示里程碑的位置、函数名和行号。\n- **计时**：它通过宏 `PRINT_VALUE_EQUAL(millis())`\
  \ 打印启动以来的毫秒。\n\n里程碑宏\n\n```\nMILESTONE_DISPLAY(\"Just before getting an SMS.\")\n\
  ```\n\n将打印：\n\n```\nMMMMMMMMMMMMMMMMMMMMMMDDDDMM\nJust before getting an SMS.\n\
  GetSMS:155\nmillis() = 1245\nMMMMMMMMMMMMMMMMMMMMMMDDDDMM\n```\n\n此输出具有高可见性，并揭示了应用程序的位置。两个类似的里程碑宏满足了增强的需求：\n\
  \n```cpp\n#define MILESTONE_DISPLAY_VALUE(desc, val)\n#define MILESTONE_DISPLAY_VAL1_VAL2(desc,\
  \ val1, val2)\n```\n\n它们显示描述以及一个或两个参数及其对应的值和 `millis()`。上述的宏是极简的，它可以被增强以显示其他信息。\n\
  \n### 严重报告宏\n\n严重报告宏（例如 `CRITICAL_DISPLAY`）与里程碑宏相似——它们显示高可见度的文本。\n\n```cpp\n#define\
  \ CRITICAL_DISPLAY(text) \\\nSerial.println(F(\"<CCCCCCCCCCCCCCCCCCCCCCCCCCCCCC>\"\
  )); \\\nSerial.println(F(text)); \\\nSerial.print(__FUNCTION__); Serial.print(F(\"\
  :\")); Serial.println(__LINE__); \\\nPRINT_VALUE_EQUAL(millis()) \\\nSerial.println(F(\"\
  <CCCCCCCCCCCCCCCCCCCCCCCCCCCCCC>\"));\n```\n\n该宏的典型用法：\n\n```cpp\nif (heapSpace\
  \ < HEAP_SPACE_MINIMUM ) {\n#ifdef CRITICAL_REPORTING_ON\nCRITICAL_DISPLAY(\"Memory\
  \ prob, heap space getting low\")\nPRINT_VALUE_EQUAL(millis())\nSerial.print(F(\"\
  \ minimum = \"));\n#endif \n}\n```\n\n输出将是：\n\n```\nCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC\n\
  Memory prob, heap space getting low\nGetSMS:160\nCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC\n\
  heapSpace = 255\n```\n\n同样，输出具有高可见性。如果没有此类问题，注释掉就会失效。\n\n### 错误报告宏\n\n错误报告宏与里程碑和严重宏相似。在内容前后打印一串字符以突出它们（`PROGRAM_ERROR_TEXT`）。宏打印描述、函数和行号，以及调用它的函数和相应的行号。\n\
  \n```cpp\n#define PROGRAM_ERROR_TEXT(PARAM_text) \\\nSerial.println(F(\"ERROR- EEEEEEEEEEEEEEEEEEEEEEEEEEE>\"\
  )); \\\nSerial.print(F(\"\\t\")); Serial.println(PARAM_text); \\\nSerial.print(F(\"\
  From: \")); Serial.print(__FUNCTION__); \\\nSerial.print(F(\":\")); Serial.println(__LINE__);\
  \ \\\nSerial.print(F(\"\\tcalled by: \")); Serial.print(_callingFunction); \\\n\
  Serial.print(F(\":\")); Serial.println(_line); \\\nSerial.print(F(\"\\tmillis: \"\
  )); Serial.println(millis()); \\\nSerial.println(F(\"EEEEEEEEEEEEEEEEEEEEEE>\"));\n\
  ```\n\n典型的输出将是：\n\n```\nERROR- EEEEEEEEEEEEEEEEEEEEEEEEEEE>\nParameter should not\
  \ be zero\nFrom: DoWork:42 called by ATest:235\nmillis: 1260\nEEEEEEEEEEEEEEEEEEEEEE>\n\
  ```\n\n上述的数据是最基本的，基于上述内容的宏可以包含更多信息。\n\n### 内存使用宏\n\n基于打印的调试框架使用两个宏获取内存信息：\n\n- `PRINT_HEAP_SPACE`：提供总堆、碎片和连续堆数据以及最大分配。\n\
  \n```cpp\n#define PRINT_HEAP_SPACE(paramDesc) \\\nSerial.println(F(paramDesc));\
  \ \\\nSerial.print(F(\"Largest possible alloc = \")); Serial.println(LargestPossibleAlloc(__FUNCTION__,\
  \ __LINE__)); \\\nSerial.print(F(\"Fragmented heap = \")); Serial.println(FragmentedHeap(__FUNCTION__,\
  \ __LINE__)); \\\nSerial.print(F(\"Contiguous heap = \")); Serial.println(ContiguousHeap(__FUNCTION__,\
  \ __LINE__)); \\\nSerial.print(F(\"Free RAM = \")); Serial.println(TotalHeap(__FUNCTION__,\
  \ __LINE__));\n```\n\n- `PRINT_MEMORY_CONSTANTS`：提供所有系统内存常量的值：\n\n```cpp\n#define\
  \ PRINT_MEMORY_CONSTANTS(_description) \\\n{ \\\nSerial.print(F(\"&__data_start\
  \ \")); Serial.println((uint16_t)&__data_start); \\\nSerial.print(F(\"&__data_end\
  \ \")); Serial.println((uint16_t)&__data_end); \\\nSerial.print(F(\"&__bss_start\
  \ \")); Serial.println((uint16_t)&__bss_start); \\\nSerial.print(F(\"&__bss_end\
  \ \")); Serial.println((uint16_t)&__bss_end); \\\nSerial.print(F(\"&__heap_start\
  \ \")); Serial.print((uint16_t)&__heap_start); \\\nSerial.print(F(\" points to \"\
  )); Serial.println((uint16_t)__heap_start); \\\n}\n```\n\n\n\n\n\n```cpp\nSerial.print(F(\"\
  &__heap_end \")); Serial.print((uint16_t)&__heap_end); \\\nSerial.print(F(\" points\
  \ to \")); Serial.println((uint16_t)__heap_end); \\\nSerial.print(F(\"__brkval \"\
  )); Serial.println((long)__brkval); \\\nSerial.print(F(\"__ctors_start \")); Serial.println((long)&__ctors_start);\
  \ \\\nSerial.print(F(\"__ctors_end \")); Serial.println((long)&__ctors_end); \\\n\
  ```\n\n有关内存使用宏的更多信息，请参阅内存结构（附录（第 296 页）。\n\n## 1. 函数级宏\n\n函数级调试宏分为两类：\n\n*   函数进入和退出（见下一节）\
  \ - 这些宏在进入和退出函数时打印详细信息，例如函数名称和行号、调用该函数的函数名称和行号、通过下方的参数名/值宏打印的参数列表以及返回值。\n*   <x>宏[AUX]参数化名称/值宏简化了参数值的打印</x>\
  \ 打印变量值的宏（第 290 页） - 此宏会同时打印参数的名称和它的对应值。无需重复执行 `Serial.prints` 来分别打印名称和值。\n\n###\
  \ 1.1. 函数进入/退出宏\n\n<x>基于打印的调试框架[AUX]进入/退出宏提供参数和返回值，并对所选项目提供信息</x>函数进入调试宏已通过标准化。它们列出了：\n\
  \n*   通过编译器的内置变量 `__FUNCTION__` 和 `__LINE__` 获取的函数名和行号。也可以使用 `__FILE__`，但由于打印的是完整路径，它会占用过多的内存空间，每次调用轻而达到\
  \ 100 字节。\n*   在打印进入信息时，知道是哪个函数调用了当前报告的函数通常是有用的。这通过向函数添加两个参数来实现：`char* _callingFunction`\
  \ 和 `int _line number`。函数的调试宏会打印正在调试的函数/行号，以及调用者的函数名和行号。\n*   如果调用函数时带有参数，则相关的参数将通过宏\
  \ `PRINT_VALUE_EQUAL` 打印（见打印变量值的宏 第 290 页]）。它会打印参数的标签及其值，例如：`count = 27`。\n\n退出调试宏列出函数名和行号，当函数包含多个返回值时可能有用。进入宏已经提供了相关信息。在退出时，如果有返回值，也可以打印它。\n\
  \n```cpp\nvoid SetMgrID (uint16_t _mgrID, char* _callingFunction, int _line number)\
  \ {\n#ifdef _DEBUG_PERSONNEL_SET_MGR_ID\nPRINT_FILE_FUNCTION_LINE_CALLED_BY_NL\n\
  PRINT_VALUE_EQUAL_TAB(_mgrID)\n#endif // _DEBUG_PERSONNEL_SET_MGR_ID\n...\n\n#ifdef\
  \ _DEBUG_PERSONNEL_SET_MGR_ID\nPRINT_FUNCTION_EXIT\n#endif // _DEBUG_PERSONNEL_SET_MGR_ID\n\
  return;\n} // SetMgrID()\n```\n\n以下进入宏打印 `START`、函数名、行号以及相应的调用者函数名和行号。\n\n```cpp\n\
  #define PRINT_FILE_FUNCTION_LINE_CALLED_BY_NL \\\nSerial.print(F(\"START: \"));\
  \ \\\nSerial.print(__FUNCTION__); Serial.print(F(\":\")); Serial.print(__LINE__);\
  \ \\\nSerial.print(F(\" from \")); Serial.print(_callingFunction); \\\nSerial.print(F(\"\
  :\")); Serial.println(_line number);\n```\n\n该宏的变体可以包含参数，用于打印相关的函数参数、其标签和值。相应的退出宏将打印\
  \ `END`、函数名和退出行号。\n\n```cpp\n#define PRINT_FUNCTION_EXIT \\\nSerial.print(F(\"END:\
  \ \")); \\\nSerial.print(__FUNCTION__); Serial.print(F(\":\")); Serial.println(__LINE__);\n\
  ```\n\n该宏的另一个变体可以打印返回值。\n\n这里是 `Personnel` 类中 `SetMgrID` 函数的典型调试输出。显示 `SetMgrID`\
  \ 在第 143 行被第 253 行的函数 `ATest` 运行。参数 `_mgrID` 的值为 31。退出宏打印了返回行号 166。\n\n```text\n\
  START: SetMgrID:143 from ATest:253\n_mgrID = 31\n...\nEND: SetMgrID:166\n```\n\n\
  ### 1.2. 打印变量值的宏\n\n<x>宏[AUX]参数化名称/值宏简化了参数值的打印</x>与其重复使用 `Serial.print` 先打印变量名再打印其对应值，不如\
  \ `PRINT_VALUE_EQUAL` 宏使用 C++ 的预处理器字符串化运算符 `#` 来打印参数的标签。\n\n```cpp\n#define PRINT_VALUE_EQUAL(var)\
  \ \\\nSerial.print(F(#var)); Serial.print(F(\" = \")); Serial.println(var);\n```\n\
  \n例如，以下代码：\n\n```cpp\nint count = 27;\nPRINT_VALUE_EQUAL(count)\n```\n\n会产生 `count\
  \ = 27`。这种宏减少了大量的重复工作。\n\n## 2. 调试控制宏\n\n<x>宏[AUX]参数化名称/值宏简化了参数值的打印</x>调试控制宏可以在三个级别进行开启或关闭：\n\
  \n*   全局级别：位于 `Globals.h` 中。通过这些宏可以控制整个项目的调试。\n*   文件级别：同样位于 `Globals.h` 中。通过这些宏可以针对特定文件开启调试信息。\n\
  *   函数级别：位于具体的 `.cpp` 文件中。通过在函数内部中使用宏可以实现更细粒度的控制。\n\n<x>基于打印的调试框架[AUX]进入/退出宏提供参数和返回值，并对所选项目提供信息</x>调试控制宏的开启方式如下：\n\
  \n```cpp\n#define GENERAL_REPORTING_ON    // 开启全局调试\n#define FILE_REPORTING_ON \
  \     // 开启文件级调试\n#define FUNCTION_REPORTING_ON // 开启函数级调试\n```\n\n在 `Globals.h`\
  \ 中，你可以定义这些宏来控制调试行为：\n\n```cpp\n#ifdef GENERAL_REPORTING_ON\n    // 全局调试逻辑\n#endif\n\
  \n#ifdef FILE_REPORTING_ON\n    // 文件级调试逻辑\n#endif\n```\n\n通过在特定的 `.cpp` 文件中定义 `FILE_REPORTING_ON`，你可以只开启该文件的调试输出：\n\
  \n```cpp\n#define FILE_REPORTING_ON\n#include \"Personnel.cpp\"\n```\n\n同理，在函数内部使用\
  \ `#ifdef` 配合特定的函数宏，可以只开启该函数的调试：\n\n```cpp\n#define _DEBUG_PERSONNEL_SET_MGR_ID\n\
  void SetMgrID(...) {\n    #ifdef _DEBUG_PERSONNEL_SET_MGR_ID\n        // 调试代码\n\
  \    #endif\n}\n```\n\n这种分层控制机制允许开发者灵活地管理调试输出，避免被无关信息的干扰。\n\n\n\n\n\n## 错误操作与正则表达式\n\
  \n- `if` 或 `while` - 通常为 `if(x = 0)` 等。本意应为 `if(x == 0)`。\n- 在赋值中使用 `==` 代替 `=`\
  \ - 通常为 `x ==`。本意应为 `x =`。\n- `switch` 语句中缺少 `default` 分支或空 `default` 分支 - 在编写 `switch`\
  \ 语句时，始终包含一个带有代码的 `default` 分支。这涉及两种潜在的错误：缺少 `default` 分支和空 `default` 分支（无代码）。\n\
  - `Serial.print` 中缺少 `F()` 宏 - 大多数程序员会编写基础的打印语句，如 `Serial.print(\"Some text\")`。由于没有使用\
  \ `F()` 宏，他们错过了通过将字符串存储在闪存中来节省 RAM 的机会。这些错误将在接下来的章节中描述。\n\n### `if/while` 中用 `=`\
  \ 代替 `==`\n\n在 `if` 或 `while` 语句或涉及 `&&` 或 `||` 的逻辑语句中输入等号 `=` 而不是比较运算符 `==` 是一种常见的编程错误。这些错误通常会被立即发现；然而，偶尔会漏掉，导致程序出现\
  \ Bug。寻找这些错误可能非常耗时，因为它们可能并不是系统性的。\n\n注意，当你在 `if` 语句中使用 `a = b` 时，如果 `b` 不为零，则结果为真；如果\
  \ `b` 等于零，结果为假。`while` 也是如此，除非包含 `break` 语句，否则它可能会导致应用程序陷入无限循环。Perl 错误程序使用以下正则表达式来检测包含等号\
  \ `=` 而非比较符 `==` 的 `if/while` 语句：\n\n```\n/(if\\s*\\(\\s*(\\s*)?|while\\s*\\(\\\
  s*(\\s*)?|&&\\s*(\\s*)?)\\s*\\w+\\s*=[^]/\n```\n\n上述正则表达式将找到简单的错误语句，包括带或不带括号的逻辑语句，例如：\n\
  \n```\nif(a = b || (x = y))\n```\n\n虽然这个正则表达式有点长且难以理解，但只要逐个分析并理解它是重复的，工作就会变得简单一些。该正则表达式可以分解为以下各个组成部分。它首先查找两种模式之一：带括号的\
  \ `if` 或 `while`，或者不带括号的 `&&` 或 `||`：\n\n- 带括号的 `if` `if\\s*\\(`，`while` 亦如此 `while\\\
  s*\\(`。逻辑语句没有强制括号，`&&\\s*` 与 `||\\s*` 相同。\n- 然后它查找 `if`、`while`、`&&` 和 `||` 之后的可选括号：`(\\\
  s*)?`。到目前它找到了类似 `if((a = b` 的内容。\n- 在找到 `if` 或 `while` 或逻辑运算符（`&&` 或 `||`）后，它查找名称\
  \ `\\s*\\w+`。正则表达式已处理到该处。\n- 最后通过查找后面没有跟另一个等号的等号 `\\s*=[^]` 来结束过程。\n\n可以将此正则表达式插入到我的\
  \ Perl 程序中作为类似于 Awk 的规则：\n\n```perl\nif ($line =~ /regex above/) {\n    print \"\
  ************** Warning: = instead of == in if/while/&&/|| ****************\";\n\
  \    print \"$FILENAME:\",$NR, \"-\", $line;\n}\n```\n\n开发此正则表达式后，我尝试在我基于 Arduino\
  \ 的蜂箱称重系统中使用了它。它找到了三个错误；为我节省了数小时的调试时间。\n\n### 赋值中用 `==` 代替 `=`\n\n在赋值语句中使用逻辑运算符\
  \ `==` 代替 `=`（等号）是另一个常见的编程错误。你可能在使用 `a==b` 比较 `a` 和 `b`，而不是通过 `a=b` 将 `b` 赋值给 `a`。这通常发生在从\
  \ `if` 语句中复制/粘贴时，且变量名很长。`==` 可能会无意中没有被改为 `=`。同样，如果不立即发现，这是一种很难发现的错误。可以使用以下正则表达式检测此类\
  \ `==` 赋值语句：\n\n```\n((\\w+|\\s*)()?\\s*\\w+\\s*)?==\n```\n\n该正则表达式的意思是：\n- `((\\\
  w+)\\s*)()`：查找一个被可选空格围绕的可选第一个单词，后面跟着括号。\n- `\\s*\\w*`：后面跟一个被可选空格围绕的单词。\n- `(\\[\\\
  w+\\s]*)?`：后面跟一个可选的索引排序、空格。\n- 后面跟着相等比较 `==`。\n\n该规则将测试 `$2`，即第二个左括号。如果它包含 `if`/`while`，则该行会被丢弃，因为这不是错误，因为\
  \ `==` 是 `if/while` 测试的一部分。此正则表达式被我的 `FindMisdoings.pl` 程序在规则内部使用：\n\n```perl\n\
  if ($line =~ /regex above/) {\n    if ($2 ne 'if' && $2 ne 'while') {\n        print\
  \ \"**** Warning: assignment has a bool operator == instead of assignment =\";\n\
  \        print \"$FILENAME:\",$NR, \"-\", $line;\n    }\n}\n```\n\n开发此正则表达式后，我尝试在我基于\
  \ Arduino 的蜂箱称重系统中使用了它。发现我没有此类缺陷后，我感到很宽慰。\n\n### `switch` 语句为空或缺少 `default` 分支\n\
  \n程序的健壮性在程度上取决于对潜在问题的预见和处理。其中之一涉及 `switch` 语句。C 并不要求定义 `default` 分支，但是，如果 `switch`\
  \ 处理了一个没有定义分支的情况该怎么办？应用程序如何处理这种情况？这使我在编写 `switch` 语句时根据良好的实践定义了两个规则：\n\n- `default`\
  \ 分支是强制的。\n- `default` 分支应该做些什么。要么作为分支之一正常处理 `default`，要么触发错误，说明此特定的 `default` 不应被调用，因为程序员可能认为已经覆盖了所有可能的分支值。\n\
  \n类似性的 Perl 程序 `FindMisdoings.pl` 确实在我的蜂箱称重系统中发现了缺失的 `default` 分支和空的 `default` 分支。\n\
  \n### `Serial.print` 中缺少 `F()` 宏\n\n`Serial.print` 中使用的 `F()` 宏可以节省 RAM 空间。它将活动字符串存储在闪内存中。`Serial.print`\
  \ 应该使用 `F()` 宏来编写，例如：\n\n```cpp\nSerial.print(F(\"This print uses F macro\"));\n\
  ```\n\n`FindMisdoings.pl` 程序中的以下正则表达式检测不包含 `F()` 宏的 `Serial.print`：\n\n```\n/\\\
  s*Serial\\d*\\.print(ln)?\\s*\\(\\s*\"]\n```\n\n```perl\nif ($line =~ /regex above/)\
  \ {\n    print \"**** Warning: Missing F macro in Serial.print\\n\";\n    print\
  \ \"$FILENAME:\",$NR, \"-\", $line;\n}\n```\n\n\n\n\n\n# 内存（使用）\n理解内存结构以优化内存使用\n\
  \n## 内存管理框架\n堆包含两个部分：碎片化堆和连续堆。内存管理框架（第 179 页）依赖于多个宏和函数来验证在整个执行过程中是否有足够的内存运行程序，并验证程序结束时内存已正确释放。这些宏和函数分为四组：\n\
  \n*   **内存管理框架**：内存使用宏提供了可用内存的快照。内存使用宏 - 多个宏在应用程序运行时提供内存使用情况的快照。由于这些宏消耗的内存极少，它们可以在程序员认为任何具有战略意义的地方使用。\n\
  *   **确定内存使用** - 可用内存（堆）被划分为两个区块：底部区块包含整个已分配内存，其中可能存在可用内存空洞（碎片化内存），以及从已分配内存顶部到栈底运行的区块（连续内存）。\n\
  *   **内存（堆，碎片化）** - 由于随机释放内存而产生空洞。高度碎片化的堆 - 在应用程序运行一段时间后，连续内存可能很少。大部分可用内存可能作为空洞分布在碎片化内存中；栈可能会下降到已分配空间，从而导致栈溢出（可能导致崩溃或至少导致内存损坏）。\n\
  *   **free 和 delete 如何知道要释放多少内存** - 通过进行多次连续的 `malloc` 或 `new` 可以发现内存分配消耗了两个额外的字节。此信息被\
  \ `delete` 和 `free` 用于确定要释放多少内存。\n\n### 1. 内存使用宏\n内存使用宏提供了可用内存的快照。内存使用宏可以放置在应用程序中的任何位置，以量化堆空间。\n\
  \n```cpp\n#define PRINT_MEM_STATUS(_description, _callingFunction, _lineNo, \\\n\
  _parentCallingFunction, _parentLineNo) \\\n{ \\\nSerial.println(F(\"*************************************************\"\
  )); \\\nSerial.print(F(\"Memory status: \"));Serial.println(_description); \\\n\
  Serial.print(F(\"Called from \")); Serial.print(_callingFunction); \\\nSerial.print(\"\
  :\")); Serial.println(_lineNo); \\\nSerial.print(F(\"Parent calling function \"\
  )); Serial.print(_parentCallingFunction); \\\nSerial.print(\":\")); Serial.println(_parentLineNo);\
  \ \\\nuint16_t _heapSpace = HeapSpace (); \\\nPRINT_VALUE_EQUAL(_heapSpace) \\\n\
  Serial.println(F(\"*************************************************\")); \\\n}\
  \ // PRINT_MEM_STATUS\n```\n\n以下显示了典型的 `PRINT_MEM_STATUS` 输出：\n\n```\n*************************************************\n\
  Memory status: Test - at beginning of Aardvark()\nCalled from AardvarLG:43\nParent\
  \ calling function setup:99\n_heapSpace 7539\n*************************************************\n\
  ```\n\n注意这些星号行以吸引眼球并引起你的注意。可以想象这种宏的变体。长时间重复打印单个字符会消耗大量的闪存。如果这是一个问题，可以使用函数内部的 `for`\
  \ 循环打印单个字符来替换此类打印：\n\n```cpp\nvoid PrintLongSingleChar(char _charToPrint, uint8_t\
  \ _numberToPrint) {\n  for ( int i = 0; i < _numberToPrint; i++ ) {\n    Serial.print((char)\
  \ _charToPrint);\n  }\n  Serial.println();\n} // PrintLongSingleChar\n```\n\n与其打印一个长字符串，不如调用该函数并顺序打印许多字符：\n\
  \n```cpp\nPrintLongSingleChar('*', 80)\n```\n\n你甚至可以一个宏来让生活变得简单：\n\n```cpp\n#define\
  \ PRINT-_80_ASTERISKS ...\n```\n\n### 2. 确定内存使用\n内存监控函数可以避免内存分配失败。总堆由碎片化部分和连续部分组成。连续堆位于已分配内存顶部和栈底之间。函数嵌套和递归会消耗过多的连续堆空间。可用\
  \ RAM 从微控制器地址空间的某个处开始并延伸到顶部。栈向下增长，悬挂栈帧进入此空间。已分配内存（`malloc` 和 `new`）向上进入此空间。堆是栈未使用的可用\
  \ RAM 部分。程序执行期间，已分配空间随机创建和释放，从而留下空洞。结果是堆包含两个部分：碎片化堆空间和上方的连续堆空间。\n\n碎片化堆空间的底层问题与空洞的大小有关。如果分配请求堆空间足够小，可以利用空洞，系统将从空洞中分配内存，从而使空洞变小。相反，如果内存请求大于最大的空洞，分配将从连续区域获得。一段时间后，将不再留任何显著的连续堆空间，空洞将逐渐变小，除非释放一个大块内存。在这种情况下，如果空洞很小，可用堆空间虽然在绝对值上可能很显著，但可能没有太大用。\n\
  \n`__flp`（空洞）和 `__brkval`（无空洞）是堆起始的地址。`__flp` 是存在空洞时的堆起始地址。`__brkval` 是没有空洞时的堆起始地址。坦率地说，系统跟踪了这些空洞。因此，可以跟踪碎片化和连续堆空间。堆空间的起始由两个变量之一定义：\n\
  \n*   `__brkval` 如果没有空洞，则是堆空间的起始地址；如果有空洞，则是连续堆空间的起始地址。\n*   `__flp` 是存在空洞时堆空间的起始地址。如果\
  \ `__flp` 等于 0，则没有空洞，所有堆空间都是连续的。\n*   系统通过 `FreeList` 结构维护可用空洞的链表。\n\n#### 通过编程技巧找到栈底\n\
  栈底可以通过一种编程技巧找到，该技巧包括定义并调用一个非常小的函数 `BottomOf`，返回其唯一局部变量的地址，如下：\n\n```cpp\nuint16_t\
  \ BottomOfStack () {\n  uint8_t localVariable{0};\n  return (uint16_t) &localVariable\
  \ + 3 + FUNCTION_CALL_OVERHEAD;\n} // BottomOfStack\n```\n\n局部变量地址加上栈帧的大小即可得到栈底地址。参见函数栈帧内存需求（第\
  \ 183 页）。\n\n#### 最大分配：最大的空洞或连续内存\n总堆 = 碎片堆 + 连续堆；显示总可用内存。两个函数 `FragmentedHeap`\
  \ 和 `ContiguousHeap` 提供了 `TotalHeap`，这是应用程序监控的值之一。由于 `FragmentedHeap` 函数遍历空洞以获取总碎片堆，它也确定了最大空洞的大小。这是应该监控的第二个值。\n\
  \n连续堆是栈底与分配空间顶部之间的空间：\n\n```cpp\nuint16_t ContiguousHeap() {\n  return = BottomOfStack\
  \ () - __brkval;\n} // ContiguousHeap\n```\n\n碎片化堆空间使用第一个空洞地址 `__flp` 遍历空洞链表，使用以下结构：\n\
  \n```cpp\n// avr-libc 内存分配程序维护的空列表结构\nstruct FreeList {\n  size_t size;\n  struct\
  \ FreeList* next;\n}; // FreeList\n```\n\n\n\n\n从第一个空洞开始向上遍历列表，直到没有更多空洞，这变得非常简单。`ContiguousHeap`\
  \ 函数执行此操作。在遍历空洞列表时，该函数寻找最大的空洞。如果连续堆空间大于找到的最大空洞，则将 `LargestPossibleAlloc` 设置为该值。\n\
  \n```cpp\nuint16_t FragmentedHeap(uint16_t &_largestPossibleAlloc) {\n    // Starts\
  \ at __flp and moves up the free list\n    // returns total fragmented heap\n  \
  \  // Finds largest hole or contiguous heap space if larger than the largest hole\n\
  \    uint16_t* allocatedMemory{0};\n    uint16_t totalFragmentedHeap{0};\n    FreeList*\
  \ currentHole{__flp};\n\n    // Start by setting largest hole equal to contiguous\
  \ heap space\n    _largestPossibleAlloc = ContiguousHeap();\n\n    if (__flp ==\
  \ 0) {\n        return 0;\n    }\n\n    while(true) {\n        // Break if at end\
  \ of list\n        if (currentHole == 0) {\n            break;\n        } // if\n\
  \        totalFragmentedHeap += currentHole->size;\n        _largestPossibleAlloc\
  \ = currentHole->size > _largestPossibleAlloc\n        ? currentHole->size : largestPossibleAlloc;\n\
  \        currentHole = currentHole->next;\n    } // while\n    return totalFragmentedHeap;\n\
  } // FragmentedHeap\n```\n\n总堆函数 `TotalHeap` 愉快地将碎片化堆加到连续堆中：\n\n```cpp\nuint16_t\
  \ TotalHeap () {\n    return FragmentedHeap() + ContiguousHeap();\n} // TotalHeap\n\
  ```\n\n### 1. 高度碎片化的堆\n\n上一节中 `TotalHeap` 函数的问题在于它包含了碎片化堆空间。它可能会产生一个看起来满足应用程序要求的尺寸；然而，堆可能非常碎片，没有显著的连续堆空间，即充满了小空洞，这些空洞总和产生了一个欺骗性的巨大尺寸。\n\
  \n`FragmentedHeap` 函数旨在输出空洞的总和以及最大可能分配的大小。大多数情况下，最大的可能分配将是连续堆空间的大小，但过一段时间，它可能会开始变小，因为它报告的是最大空洞的大小。此时，程序员可能会决定检查其代码。\n\
  \n碎片化率 `fragRatio` 定义为 `FragmentedHeap` 与 `TotalHeap` 之间的比例，应该被监控。\n\n```cpp\nuint8_t\
  \ fragRatio = (uint8_t) ((float)FragmentedHeap()/(float)TotalHeap()*100.0);\n```\n\
  \n对于许多大量分配后释放的应用程序，确定堆是否严重碎片化是非常用的。碎片化堆和总堆（空闲 RAM）之间的比例是碎片化严重程度的百分比衡量标准 - 100% 的比例表示所有可用内存都是碎片化的。随着应用程序的运行，碎片化将增加；该比例会开始上升。如果该比例上升到不可接受的水平，程序员将重新考虑他的应用程序。\n\
  \n我的 TODO 列表项目之一是设计一个堆管理框架，通过重载 `new` 来执行分配。它将从预留池中分配内存并自动去碎片。该框架可以基于 DataGroup\
  \ Framework（第 164 页）。\n\n### 2. free 和 delete 如何知道要释放多少内存\n\n`malloc` 和 `new` 需要一个分配内存数量的值。然而，在执行\
  \ `free` 或 `delete` 时，这一信息并没有提供。问题是：`free` 和 `new` 如何知道要释放多少内存？程序员提供了要从内存释放的内存分配地址；但他/她没有提供要释放多少内存。\n\
  \n我的互联网搜索显示，每当调用 `new` 或 `malloc` 时，分配空间后面都会附加一个额外的字。这个额外的字包含了分配的字节数，并可能包含一个指示该内存块当前是已分配还是可用的标志。在这样的情况下，由于分配块的起始地址被传递给\
  \ `malloc` 或 `new`，释放算法将从上述附加在分配空间上的额外数据中获取要释放的内存大小。我没有进一步跟进这个问题。如果你对这个主题感兴趣，请查看：\n\
  \n`https://geeksforgeeks.org/g-fact-88/?ref=rp`\n\n### 3. Awk (附录)\n\n以下章节包含了各种特定的\
  \ Awk（第 204 页） 细节。\n\n*   [下载 Awk（下一节）]涵盖了从 [gnu.org/software/gawk](http://gnu.org/software/gawk)\
  \ 下载它。\n*   从 DOS 框调用 Awk - `cmd.exe`（紧随其后的页面）：Awk 是一个命令行应用程序。你将找到使用命令行参数调用 Awk\
  \ 的信息，即指定一个 Awk 程序并传递文件名。\n*   Awk 简示例 (第 303 页) - 一个使用杂货数据生成报告的小应用程序。\n*   Awk\
  \ 某些功能 (第 304 页) - Awk 类似于 C，但存在差异。程序中展示了 Awk 的特性。\n*   Awk 参考 (第 309 页) - 本节详细介绍了\
  \ Awk 语言的重要特性。\n\n#### 1. 下载 Awk\n\n要下载 Awk，请前往 Source Forge (`https://SourceForge.net`)。它提供了\
  \ Software Foundation 的免费下载。说明了如何设置。在我的情况下（Windows 10），我下载了 64 位 Windows 实现：`gawk-3.1.6-1-setup.exe`。使用默认设置运行。Awk\
  \ 将安装在 `C:\\Program Files x86\\Gnu32` 目录下。\n\n安装程序后，将 `C:\\Windows\\System32\\cmd.exe`（DOS\
  \ 框）复制到运行 Awk 的目录。在命令框中输入 `awk` 进行测试。它应该返回关于如何开始 Awk 的文本。\n\n#### 2. 从 DOS 框调用 Awk\n\
  \n调用 Awk 程序需要你先打开一个命令框（`C:\\Windows\\System32\\cmd.exe` 即 DOS 框）。在 DOS 框内部，你可以通过输入\
  \ `Awk` 或调用批处理文件（`.bat` 文件）直接调用 Awk。命令可以是直接输入的单引号单行 Awk 程序，例如：\n\n```bash\nawk -Wlint\
  \ '$1 == \"#define\"' file1 file2 > Output.txt\n```\n\n或者是位于 `.awk` 文件中的完整结构化程序，在这种情况下命令为：\n\
  \n```bash\nawk -Wlint -f MyProgram.awk file1 file2 > Output.txt\n```\n\n或者你可以调用上述批处理文件\
  \ `MyProgram.bat`（参见 DOS 批处理文件第 241 页）。\n\n在上述：\n\n*   `Awk` 调用 `Awk.exe`，这是你下载的程序。只需在\
  \ DOS 框内输入它即可。\n\n\n\n\n- `-Wlint` - 当你用 Awk 编程时，会犯一些错误。如果这是一个 C/C++ 程序，其中许多错误会被编译器捕获；但在\
  \ Awk 中并非如此。由于拼写错误而创建的新变量会静默通过，因为它是合法的 Awk 表达式。`-Wlint` 命令行选项可确保检测到许多此类错误并将其作为警告报告。请注意，该选项必须放在\
  \ `-f MyProgram.awk` 选项之前。尽管如此，请务必小心；不要过度依赖 `-Wlint`，因为 Awk 解释器在检测编程错误方面不如 C++ 编译器。\n\
  \n- `' $1 == \"#define\" '` 是一个完整的 Awk 程序，是一个单行程序。只要用单引号括起来，就可以直接在 DOS 框中输入。这条单行命令的意思是：如果文本中的第一个单词是\
  \ `\"#define\"`，则打印该行。请注意 Awk 程序被包含在单引号中；而字符串被包含在双引号中。\n\n- `-f MyProgram.awk` 是你创建的一个多行\
  \ Awk 程序。这是一个包含 Awk 语句的文本文件，你将其存储在某处并赋予它 `.awk` 后缀。\n\n- `file1 file2 file3...`\
  \ 是 Awk 将合并并处理的文件，就像处理一个连续文件一样。文件名应包含完整路径。我通常会在包含项目文件（`.ino`, `.h`, `.cpp`）的目录内创建一个名为\
  \ `Awk` 的目录。我会在 `file1, file2 file3...` 前加上相对路径（`..\\`）。例如，`..\\BasicClass.h`（这里的\
  \ `..\\` 意味着上一级目录，即向根目录回溯一级）。\n\n- Awk 的 `print` 直接将文本输出到控制台，类似于 C++ 的 `Serial.print`。你可以通过将输出重定向到文件来捕获这些输出：`>\
  \ Output.txt`。`>`符号表示将输出重定向到其他地方，删除其中的原有内容并插入 Awk 的输出。另一个符号 `>>` 意味着追加到现有内容之后。`Output.txt`\
  \ 是 Awk 重定向的目标。\n\n### 多次通过文件处理\n你可能想处理处理一个文件：第一次通过收集信息，第二次通过的逻辑基于第一次通过收集的信息。Awk\
  \ 的问题在于，一旦它完成行处理，它就结束了，你无法指示它重新开始。例如：你可能想通过第一次通过创建一个数值表，然后使用该表处理文件以完成某些任务。Awk 做不到这一点，但\
  \ Perl 可以。如果你真的想用 Awk 进行第二次通过，你可以通过两次输入你想要处理的文件来“欺骗” Awk：\n\n```bash\nAwk -Wlint\
  \ -f MyProgram.awk fileA fileA > Output.txt\n```\n\nAwk 程序将在两个拼接在一起的完全相同的行上工作。检测\
  \ Awk 何时完成第一次通过取决于观察 Awk 的 `ARGIND` 变量；当它开始处理第二组行时，`ARGIND` 会从 `1` 变为 `2`；它并不在乎文件是否相同。你只需要观察\
  \ `ARGIND` 的值来决定何时从第 1 次通过切换到第 2 次通过。\n\n### Awk 简示例\n这个小示例展示了一个完整的 Awk 程序。它根据文本文件中包含的数据生成每周销售报表。\n\
  \n#### 简短数据库示例 Awk 程序\n假设你有一个文本文件，包含该周的所有销售情况。`WeeklySalesData.txt` 中的数据结构如下：\n\n\
  | 产品 | 供应商 | 销售价格 | 购买价格 | 销售数量 |\n| $1 | $2 | $3 | $4 | $5 |\n| 花生酱 | MyVegan |\
  \ $5.90 | $4.75 | 10 |\n| 花生酱 | BodyFit | $10.50 | $8.50 | 5 |\n| 原味酸奶 | Yoplait\
  \ | $0.80 | $0.65 | 30 |\n| 原味酸奶 | Dannon | $0.85 | $0.65 | 25 |\n| 希腊酸奶 | Chobi\
  \ | $1.10 | $0.90 | 0 |\n\n表 25.1 - 每周杂货销售\n\n你想列出每个产品的总销售额和利润，一次一个：首先是供应商、产品、每周销售额以及每周产生的利润。你还需要总计。\n\
  \n在这个示例中，条件是销售额大于 0（`$5 > 0`）。对应的动作块（action-block）是一系列打印操作以及两个字段的乘法，结果结果加到全局变量 `totalSales`\
  \ 和 `totalMargin`。你需要一个 `BEGIN` 块来初始化内容，一组规则（在这种情况下只有一个规则）以及一个 `END` 块来收尾。这里没有函数。\n\
  \n```awk\nBEGIN {\n    print \"Total sales for the week Sales Margins\";\n    totalSales\
  \ = 0;\n    totalMargin = 0;\n    OFS = \"\"; # 避免在包含逗号的内容时插入空格\n}\n\nEND{\n   \
  \ print \"Sales and margin for the week\\t$\", totalSales, \" \\t$\", totalMargin\
  \ ;\n}\n```\n\n这是我们唯一的规则：`condition { action-block }`：\n\n```awk\n$5 > 0 && $1 !=\
  \ \"#\" {\n    sales = $3*$5;\n    totalSales += sales;\n    margin = ($3 - $4 )\
  \ * $5; # (销售价格 - 购买价格) * 销售数量\n}\n```\n\n规则中的 `$1 != \"#\"` 是为了防止注释被处理。\n\nAwk\
  \ 程序可以直接在 DOS 框中调用：\n\n```bash\nAwk -Wlint -f WeeklySales.awk WeeklySalesData.txt\
  \ > WeeklySalesReport.txt\n```\n\n`WeeklySalesReport.txt` 的输出如下：\n\n```\nTotal sales\
  \ for the week Sales Margins\nMyVegan Peanut butter $47.50 $11.50\nBodyFit Peanut\
  \ butter $42.50 $10.00\nYoplait Yogurt plain $19.50 $4.50\nDannon Yogurt plain $16.25\
  \ $5.00\nSales and margin for the week $125.75 $31.00\n```\n\n就是这样。操作起来非常简单、快速。\n\
  \n### Awk 一些特性\n以下章节包含说明特定特性的代码示例。\n\n- **字符串**：在 Awk 中，除了函数参数外，所有变量都是全局的。Awk 的字符串处理比\
  \ C 强大一些，特别是拼接。\n- **一维数组**：代码示例展示了数组处理。\n- **二维数组**：Awk 的多维数组必须通过索引的拼接来平化为一维访问。\n\
  - **仅条件和动作块规则**：没有条件的规则会打印该行。这种功能可以用于对每行执行某些操作后打印文件的所有行。没有动作块的规则会在条件为真时打印该行。\n\n\
  ### Awk 作用域\n**函数变量全局，参数局部**\nAwk 变量除了作为参数外都是全局的。例如，下面 `FunctionA` 中的两个变量（`i` 和\
  \ `a`）是全局的，尽管它们首次是在函数内部使用的。记住，Awk 变量不需要声明类型类型。\n\n```awk\nfunction FunctionA() {\n\
  \    print \"Start FunctionA\";\n    i = 5; a = 10;\n    print \"i =\", i; print\
  \ \"a =\", a, \"\\n\";\n} # FunctionA\n```\n\n在下面的 `FunctionB` 中，`i` 是函数的局部变量，因为它是参数。变量\
  \ `a` 仍然是全局的。\n\n```awk\nfunction FunctionB( i ) {\n    print \"Start FunctionB\"\
  ;\n    print \"i =\", i; print \"a =\", a, \"\\n\";\n} # FunctionB\n```\n\n在下面的\
  \ `FunctionC` 中，`i` 和 `a` 都是全局的。\n\n```awk\nfunction FunctionC( ) {\n    print \"\
  Start FunctionC \";}}\n```\n\n\n\n\n\n```\nprint \"i = \", i; print \"a = \", a,\
  \ \"\\n\";\n\n} # FunctionC\n```\n\n这段代码测试了上述三个函数。它被插入在 `BEGIN` 块中：\n\n...\n\n`FunctionA();`\n\
  \n`x = 99;`\n\n`FunctionB(x);`\n\n`FunctionC();`\n\n...\n\n这些是结果。`FunctionA` 初始化\
  \ `i` 和 `a`。\n\n### Start FunctionA\ni = 5\na = 10\n\n函数的参数使相应的变量在函数内变为局部。`FunctionB`\
  \ 接收一个参数并赋值给局部变量 `i`。\n\n### Start FunctionB\ni = 99\na = 10\n\n如果你使用了 `-Wlint`\
  \ 命令行选项，Awk 会报告：`i shadows global i`。\n\n`FunctionC` 打印 `i` 和 `a`，尽管 `i` 在 `FunctionB`\
  \ 中被作为参数局部使用。`i` 和 `a` 在 `FunctionC` 中仍然是全局的。它们保留了最初在 `FunctionA` 中设置的值。\n\n###\
  \ Start FunctionC\ni = 5\na = 10\n\n上述说明了变量尽管首次在函数内部（`FunctionA`）使用，仍然是全局的，并且函数参数尽管名称与全局变量相同，也是函数局部的（`FunctionB`）。\n\
  \n## 1. Awk 数组\n\n### Awk (arrays)[AUX]数组是关联的，混合了字符串和数值\n如果你是一个 C/C++ 程序员，你必须彻底清空脑海中关于数组的认知。Awk\
  \ 数组的不同之处在于它们是关联的。索引不一定是数值，它们也可以是字符串。Awk 数组索引是伪数据库的键，该伪数据库包含记录，这与 C 语言中通过数值索引按顺序访问的数组项不同。\n\
  \n*   **Awk (arrays)[AUX]支持多维数组**：Awk 一维数组项的写法与 C 语言相同：`MyArray[a]`。而 Awk 二维数组的写法则有所不同：`MyArray[a,b]`。\n\
  \n*   **Awk (arrays)[AUX]数组索引可以是整数、浮点数、字符串，类似于数据库的键**：Awk 数组不像 C 语言那样是连续的数据空间。它们是通过键访问的伪数据库，数组键是多个索引连接成的，索引之间由内置变量\
  \ `SUBSEP` 定义的字符分隔。这意味着 Awk 数组在后台是一维的，但可以像多维数组一样对其进行操作。C 语言的索引是整数，而 Awk 数组索引可以是任何类型：整数、浮点数、字符串。数组内部索引可以是混合类型。索引的某可能是数值；另一部分可能是字符串。\n\
  \n*   在最基础层面，Awk 数组看起来与 C 数组完全一样：\n    ```\n    n = 10;\n    names[n] = \"Sasha\
  \ Gomez\";\n    ```\n    尽管使用了数字来指向数组项（如 `names[n]`），但该索引并不会指向数组中的第 10 个项。它指向的是键为\
  \ `\"10\"` 的项。尽管如此，仍然可以在 `for` 循环中模拟对顺序项的访问，例如：\n    ```\n    for( i=1; i<=10; i++)\
  \ { print(myArray[i]); }\n    ```\n\n*   **Awk (caveats)[AUX]在 C 风格 for 循环中遍历数组可能会创建意外的数组项**：`for`\
  \ 循环将按预期运行。包含字符串索引的数组项将被忽略。但在这样做时必须小心。假设你所做的只是定义了一个数组项（如上方的 `name[10]`，数组只包含一项）并对\
  \ 10 个项执行标准的 `for` 循环，Awk 将创建九个未定义的数组项。\n\n*   **Awk (arrays)[AUX]for (idx in array)\
  \ 循环结构便于遍历数组**：通过 Awk 特有的数组循环结构 `for (idx in array) { ... }` 遍历数组可能效果更好。它类似于 Perl\
  \ 的 `foreach` 结构，不同之处必须通过索引变量访问数组项。循环将迭代 N 次，其中 `N` 是数组中项的数量。在每次迭代中，`idx` 将包含单个数组索引的值。可以通过以下方式遍历整个数组：\n\
  \    ```\n    for ( idx in myArray) { print \"idx = \", idx, \"  - myArray[idx]\
  \ = \", myArray[idx]; }\n    ```\n    该特性在 Awk 某些特性示例（第 304 页) 中介绍。\n\n*   **Awk\
  \ (arrays)[AUX]使用多维数组很复杂**：遍历多维数组变得有点复杂。Awk 将多维索引合并成一个索引，其组件通过内置变量 `SUBSEP` 隔开，该变量默认值为\
  \ `\\034`（十进制 28，即 FS 文件分隔符字符）。由于此默认分隔符不可打印，你可能想将其更改为 `@` (`SUBSEP=\"@\"`) 或其他字符。在打印合并后的索引时，你会得到类似\
  \ `Name@City` 的结果。参见上文 Awk 某些特性示例 (第 304 页) 部分。\n\n*   **Awk (arrays)[AUX]delete\
  \ 数组项**：可以使用 `delete` 运算符移除数组项。当执行：\n    ```\n    delete myArray[10];\n    ```\n\
  \    Awk 将移除键为 `10` 的 `myArray` 项。`myArray[9]` 和 `myArray[11]` 可能仍然存在。你并没有将 `myArray[10]`\
  \ 设为零。\n\n*   **Awk (arrays)[AUX]length 函数返回项的数量**：可以使用 `length` 函数获取项的数量，例如：\n\
  \    ```\n    myArrayLength = length(myArray);\n    ```\n    如果数组是多维的，`length` 返回项总数，因为索引已经通过\
  \ `SUBSEP` 合并成了一个索引。\n\n### Awk 一维数组\nAwk 支持一维数组。通过定义四个元素开始：\n    ```\n    print\
  \ \"Begin array\";\n    arrayIDX[2] = 99;\n    arrayIDX[\"firstN\"] = \"Sasha\"\
  ;\n    arrayIDX[\"lastN\"] = \"Gomez\";\n    arrayIDX[1] = 98;\n    ```\n\n### Awk\
  \ (arrays)[AUX]length 函数返回项的数量\n通过 `length` 函数获取数组中的项数，例如：\n    ```\n    arrayIDXLength\
  \ = length(arrayIDX);\n    print \" arrayIDXLength = \", arrayIDXLength;\n    ```\n\
  结果是预期的 4，因为定义了四个项。注意，它返回的是项的数量，而不是像 C 语言的 `sizeof` 运算符那样的。\n\n### 数组陷阱\n现在观察对五个项执行传统的\
  \ `for` 循环会发生什么：\n```\nfor ( i = 1; i <= 5; i++ ) {\n    print \"\\ti = \", i, \"\
  \ arrayIDX[i] = \", arrayIDX[i];\n}\n```\n有趣的是只有数值索引的项被打印了，另外两个字符串索引的项没有打印。这证实了数组索引是键的事实。它们不是相对于数组头部的位置。这里是打印结果：\n\
  ```\ni = 1 arrayIDX[i] = 98\ni = 2 arrayIDX[i] = 99\ni = 3 arrayIDX[i] = \ni = 4\
  \ arrayIDX[i] = \ni = 5 arrayIDX[i] = \n```\n执行 for 循环后，获取数组的长度。结果为：\n```\narrayIDXLength\
  \ = 7\n```\nAwk 在尝试打印不存在的数组项时创建了额外的数组元素：索引 3、4 和 5。这是 Awk 的陷阱之一。现在通过 Awk 特有的数组遍历结构遍历整个数组：\n\
  ```\nfor ( idx in arrayIDX) {\n    print \"\\tindex = \", idx, \"  - arrayIDX[idx]\
  \ = \", arrayIDX[idx];\n}\n```\n结果是乱序的：\n```\nindex = 4 arrayIDX[idx] = \nindex\
  \ = firstN arrayIDX[idx] = Sasha\nindex = 5 arrayIDX[idx] = \nindex = lastN arrayIDX[idx]\
  \ = Gomez\n```\n\n\n\n\n\n```\nindex = 1 arrayIDX[idx] = 98\n\nindex = 2 arrayIDX[idx]\
  \ = 99\n\nindex = 3 arrayIDX[idx] =\n```\n\n注意看在 `for` 循环执行 `print arrayIDX[idx]`\
  \ 时，那些意外创建的空项是如何作为索引 3、4 和 5 出现的，并且它们的值为 `undefined`。\n\n另外请注意，这里并没有特定的顺序。为什么 `index\
  \ = 4` 先被打印出来？这种意料之外的行为会让 C++ 程序员崩溃的。\n\n## 1. Awk 二维数组\n\n<x>Awk (数组)[AUX]数组是关联数组，可以混合字符串和数值类型</x><x>Awk\
  \ (数组)[AUX]数组在数组项被使用时定义</x>下面的二维数组是一个包含联系人数据的表格，由行和列组成。最左侧的索引（`row`）包含联系人的 ID。最右侧的索引（`columns`）包含特定于某个人的多个浮点数和字符串数据项。由于\
  \ Awk 数组是关联数组，你可以将数值数据项与字符串数据项混合使用。此外，索引可以是任何类型：数值（整数和浮点数）和字符串。在 C/C++ 中，你必须创建结构体数组来实现这一点；且索引必须是整数。\n\
  \n开始使用 Awk 数组可能会令人困惑，因为你不需要像在 C/C++ 中那样，在使用之前经过声明数组的过程。你可以自由地开始定义单个数组项，例如以下针对某个个人的联系人数据：\n\
  \n<x>Awk (数组)[AUX]二维数组示例</x><x>Awk (示例)[AUX]二维数组示例</x>\n\n# Sasha Gomez 的数据\n\n\
  ```\nmyContacts[1067, \"lastName\"] = \"Gomez\";\n\nmyContacts[1067, \"firstName\"\
  ] = \"Sasha\";\n\nmyContacts[1067, \"street\"] = \"41 Sumner street\";\n\nmyContacts[1067,\
  \ \"city\"] = \"Freeport\";\n\nmyContacts[1067, \"zip\"] = \"04032\";\n```\n\n使用专门的\
  \ Awk 数组遍历 `for` 循环打印数组内容：\n\n```\nfor ( idx in myContacts ) {\n    print \"Index\
  \ =\", idx, \"\\t\", myContacts[idx];\n}\n```\n\n输出如下：\n\n```\nIndex 1067@city Portland\n\
  Index 1067@firstName Sasha\nIndex 1067@ZIP 04032\nIndex 1067@street 41 Sumner street\n\
  Index 1067@lastName Gomez\n```\n\n打印输出结果令人惊讶，因为它们似乎并没有任何特定的顺序。\n\n如果你想提取 Sasha Gomez\
  \ 的所有数据，可以可以使用 `for` 遍历循环进行搜索，并使用 `index(str, find)` 函数选择第一个索引为 1067 的项：\n\n```\n\
  for(idx in myContacts) {\n    if (index (1067, idx) != 0) {\n        print \"Index\
  \ =\", idx, \"\\t\", myContacts[idx];\n    } # if\n} # for\n```\n\n将多个索引合并为一个索引，并将数组像一维数组一样进行处理，开启了有趣的可能性。索引由其组成部分组合，并在变量内部通过索引分隔符\
  \ `SUBSEP` 连接起来。例如：\n\n```\nmyContacts[1067, job] = \"Manager\";\n```\n\n可以替换为：\n\
  \n```\nmyContacts[1067@job] = \"Manager\";\n```\n\n这个示例说明了 Awk 多维数组的另一个有趣特性。二维数组可以可视化为一个表格，包含行和列。总单元格数量是行数乘以列数。基于\
  \ C 结构体的数组项数也是行乘以列数。Awk 则并非如此，在上面的联系人数组中添加一个新值，例如：\n\n```\nmyContacts[\"1067@note200606\"\
  ] = \"Sasha turned his/her report in 3 days early\";\n```\n\n如果你在 C 中这样做，必须添加一个新列，并添加与行数相同的新指针。在\
  \ Awk 中，你只添加了一个项。额外的好处是，你可以提取所有日期为 `note200606` (`yymmdd`) 的备注。\n\n## 1. Awk 参考\
  \ \n\n你应该能够根据下面描述的 Awk 主要功能创建出相当复杂的 Awk 程序。\n\n*   Awk 命令行 至少应包含 Awk 程序的名称、`-w`\
  \ 警告开关以及文件列表（全路径或相对路径）。\n*   Awk 注释 - Awk 的注释符号是井号 `#`。它类似于 C++ 的 `//` 注释，#` 之后到行尾的所有内容都会被忽略。\n\
  *   Awk 规则（附录） - Awk 将一组文本文件视为连续的文本行。用户定义的规则集（条件/动作块对）应用在这些行上，一次处理一行。如果规则的条件求值为真，则执行规则的动作块（一个类似\
  \ C 语言的函数体）。\n*   Awk BEGIN 和 END（附录） - Awk 提供了两个函数：在处理行之前的 `BEGIN` 函数，以及在处理完所有行之后的的\
  \ `END` 函数。\n\n*   **Awk 命令行**\n    在 DOS 框通过包含以下内容的命令调用 Awk：\n    *   程序名称，如 `-fAwkProgram.awk`。\n\
  \    *   `-w` 警告选项。\n    *   文件名（全路径或相对路径）。\n\n*   **Awk 注释**\n    使用 `#` 符号表示该行之后为注释。类似于\
  \ C++ 的 `//` 注释，从 # 到行尾的内容都会被忽略。不支持 `/*...*/` 样式的注释注释。\n\n*   **Awk 规则（附录）**\n \
  \   Awk 将一组文本文件视为连续的文本行。用户定义的规则集（条件/动作块对）应用在这些行上，一次处理一行。如果规则的条件求值为真，则执行规则的动作块（一个类似\
  \ C 语言的函数体）。\n\n*   **Awk BEGIN 和 END（附录）**\n    Awk 提供了两个函数：在处理行之前的 `BEGIN` 函数，以及在处理完所有行之后的\
  \ `END` 函数。\n\n*   **Awk 作用域**\n    变量即使在函数内部也是全局的。\n\n*   **Awk 函数和变量**\n    变量不需要声明或指定类型。它们是动态创建的。\n\
  \n*   **Awk 内置变量**\n    Awk 提供了丰富的内置函数。\n\n*   **Awk 程序流控制**\n    支持标准的控制结构 `if`、`while`、`for`、`do...while`、`switch`。\n\
  \n*   **Awk 运算符**\n    支持大多数 C 运算符。\n\n*   **Awk 数组**\n    Awk 数组是关联数组。我最好的类比是将\
  \ Awk 数组视为一个通过键访问值的表。Awk 特有的 `for` 循环可以遍历数组。虽然支持标准的 C 风格索引循环，但它可能会产生意外的副作用。\n\n\
  *   **Awk 字符串**\n    Awk 不像 C 那样区分字符和字符串。Awk 的字符是一个单字节的字符串，例如 \"A\"。Awk 字符串可以使用单引号或双引号限定。\n\
  \n*   **Awk print**\n    Awk 的 `print` 语句类似于 C++ 的 `Serial.println` 语句。但它提供了比 C++\
  \ 版本更灵活的功能。支持类似 C 语言的 `printf`。\n\n*   **Awk 数学函数**\n    提供了基础的 Awk 数学函数。\n\n\n\n\
  \n\n# Awk (规则)\n\n## 基于模式搜索的条件：简单的逻辑语句或正则表达式\n虽然之前提到过，但仍值得重复。`Awk` 是一种对纯文本文件进行操作的文本处理工具。它一次读取一行，如果该行包含匹配模式的文本，则对其进行某些操作。模式匹配（条件）与所执行的操作（动作块，action-block）的组合被称为“规则”。条件是一个逻辑语句、一个正则表达式（`regex`）或两者的组合。逻辑语句是由\
  \ `AND` (`&&`) 和 `OR` (`||`) 运算符连接的一个或多个逻辑语句组成的序列。`regex` 是在两个正斜杠之间的字符序列，它定义了文本匹配模式（参见正则表达式\
  \ (regex) 第 191 页）。如果条件在文本行中找到匹配项，就会调用相应的动作块。动作块类似于函数体——它是一系列封装在花括号中的类 C 语言语句。\n\
  \n### 规则使用来自行分词的 $1, $2 等字段\n无论条件的性质如何（逻辑语句或正则表达式），当 `Awk` 加载新文本行时，它会将其拆分为字段并将并赋值给内置变量\
  \ `$1`、`$2` 等。内置变量 `$0` 包含整行。\n\n搜索 `#define` 宏是一个很好的例子；只需执行 `$1 == \"#define\"\
  ` 即可。当它找到第一个字段为 `#define` 的行时，它会调用相应的动作块。注释掉的 `#define` 将不会找到，因为条件会失败，由于 `$1` 将包含\
  \ `//` 或 `//#define`。如果你想判断该宏是否是被注释的宏，则相应的动作块需要测试注释 `//` 是否在 `#define` 之前。要找到已注释和未注释的\
  \ `#define`，可以执行：\n\n```awk\n$1 == \"#define\" || $1 == \"//#define\" || ( $1 ==\
  \ \"//\" && $2 == \"#define\" )\n```\n\n这些逻辑语句处理了已注释和未注释的 `#define`，但如果你还想处理 `#endif`、`#if`、`#else`、`#error`（每个都可能被注释或未注释），你总共需要由\
  \ OR `||` 运算符分组的 15 个逻辑语句。\n\n使用正则表达式要简单得多且更不容易出错：\n\n### 查找宏的正则：#define, #ifdef,\
  \ 等\n```regex\n/^\\s*(//)?\\s*#(define|if|endif|else|error)/\n```\n\n如示例所示，使用 `regex`\
  \ 进行模式匹配比使用逻辑语句要简洁得多。它的使用可能更优，因为它带来了逻辑语句不具备的灵活性。上面的 `regex` 完成了与 15 个逻辑语句相同的任务！\n\
  \n我承认，当第一次遇到正则表达式时，它们极其晦涩。这是一个学习词汇的问题。一旦你熟悉了它，它们就很容易阅读，因为它们是一系列字符搜索。例如，`\\s` 翻译为空格，`*`\
  \ 意味着零或多次。上面的 `regex` 意思是：从行首 `^` 开始，后面跟着零或多个空格 `\\s*`，接着是一个可选的 C++ 注释 `(//)?`，然后是零或多个空格\
  \ `\\s*`，然后是一个 `#` ，最后是六个字母 `define`，或者两个字母 `if...`。注意 `//` 周围的括号和问号。它的意思是：寻找两个连续的正斜杠\
  \ `//`，但这些是可选的。这意味着 `regex` 并不关心井号 `#` 之前是否有正斜杠。\n\n## 1. 仅条件规则和仅动作块规则\n\n我以前提到过，但仍值得重复：规则是条件/动作块结构。尽管如此，你可以创建仅包含条件的规则和仅包含动作块的规则。仅条件的规则在条件求为真时将打印该行。仅动作块的规则（即没有条件的规则）将应用于所有行。\n\
  \n### 条件成功时，仅条件规则打印行\n这是一个简单实用的仅动作块规则。它会打印每一行，并在行前加上文件名和行号作为注释：\n\n```awk\n{ print\
  \ \"/* \", ARGV[ARGIND], \":\", NRF, \" */ \", $0; }\n```\n\n输出将是：\n`/* MyFile:348\
  \ */ this is the line of text`\n\n### FILENAME 是正在处理的文件，等同于 (ARGV[ARGIND])\n没有条件的规则始终为真——从而调用动作块。反之，仅条件规则仅在条件求为真时才打印该行。它可以用于生成文件的子集，例如仅包含注释行或仅包含未注释行的文件。\n\
  \n## 2. Awk 中断处理行\n\n### getline, next 停止处理行\n随着规则的执行，可能会中断处理并加载下一行。可以使用两个内置函数来实现此点：\n\
  \n*   `next` - 该关键字停止立即处理当前行，获取下一行，并从顶部规则重新开始。它的工作方式就像 `for` 循环中的 `continue` 语句。\n\
  *   `getline` - 该关键字在不带参数使用时与 `next` 类似，区别在于它加载下一行并继续处理。\n\n## 3. Awk BEGIN 和 END\n\
  \n### BEGIN 和 END 在开始和结束时工作\n`Awk` 支持两个预定义的框架：`BEGIN` 和 `END`。`BEGIN` 在任何文本行被处理之前调用。`END`\
  \ 在所有文本行处理之后调用。这使得 `Awk` 程序员可以在程序开始时进行清理工作，并在程序结束时收尾。\n\n*   `BEGIN` 初始化变量以提高代码的可维护性，设置内置变量，打印必要的程序头，并在处理前进行任何其他工作。\n\
  *   `END` 打印整体处理的结果（如总计），并以清晰的消息（如“程序结束”）结束。它也可以根据规则处理期间获取的数据表生成输出。\n\n`BEGIN` 和\
  \ `END` 都是可选的。取决于程序员决定是否使用以及如何使用。\n\n## 4. Awk 函数和变量\n\n`Awk` 函数与 C 函数几乎完全相同。它们有名称，可以接受参数，并像\
  \ C 语言一样可以返回值。参数封装在括号中，体封装在花括号中。没有所谓的函数声明。函数先定义，后使用。\n\n*   `function` 关键字位于函数名之前。\n\
  *   函数可以接受参数，列在强制性括号内的可选参数列表中。\n*   函数名与左括号之间不能有空格。\n*   函数可以通过 `return` 关键字返回值，但它没有特定的返回类型。\n\
  \n`Awk` 函数的结构如下：\n\n```awk\nfunction MyFunction( parameter list ) {\n    statement\n\
  \    statement\n    ...\n    return something; # 可选，可以位于函数块的任何位置\n}\n```\n\n`return`\
  \ 语句是可选的，然而，如果省略了且调用函数假设它确实返回了某些值，则没有错误消息，调用函数将接收到垃圾数据。如果使用了 `-Wlint` 命令行选项，可能会有警告。\n\
  \n\n\n\n\n# Awk (变量与函数)\n\nAwk 变量在第一次使用时动态创建。它们不是强类型的。它们可以包含浮点数和字符串。为变量赋值不会将其绑定到特定类型。一个变量开始可能包含一个浮点数，随后被赋值为字符串，反之亦然。无论是在函数内部还是全局范围内第一次使用，变量总是全局的，但参数是函数局部的。请参阅下文的章节\
  \ Awk 作用域（第 304 页）。\n\n## -Wlint 标记\n\n`awk` - 使用 `-Wlint` 命令行标记来显示错误。\n\n## Awk\
  \ (注意事项)\n\n请注意，由于没有声明变量，Awk 对拼写错误特别敏感。例如，假设你定义了变量 `errorCount`，在后面的代码中你写成了 `errorsCount`。你在不知不意中创建了第二个变量。程序将无法正常运行。你可以带有\
  \ `-Wlint` 选项运行 Awk 程序。它可能会报告 `errorCount` 或 `errorsCount` 为未初始化/未使用的变量，但如果你坚持使用拼写错误的变量，将没有任何警告，你将陷入一段不受欢迎的调试工作中。不要依赖\
  \ Awk 来提醒你此类错误。\n\n## 1 Awk 内置变量\n\nAwk 提供了内置变量。这里是几个常用的变量（完整列表请参阅 参考文献 - Awk（第\
  \ 334 页） 中的 Awk 官方参考）。\n\n### ARGC, ARGV, ARGIND\n\n`ARGC`, `ARGV`, `ARGIND` - 一个完整的\
  \ C/C++ 程序是一个名为 `main` 的函数：\n\n```c\nint main(argc, argv) {}\n```\n\n`argc` 是命令行参数的数量。`argv`\
  \ 是命令行参数数组，其中第一项是程序名。\n\n由于 Awk 是一个 C 程序，它也有一个 `main` 函数以及对应的 `argc` 和 `argv` 参数。当调用它时，你执行的是：\n\
  \n``awk -Wlint -f MyAwk.awk file1 file2...`\n\n从 DOS 命令行调用 Awk 时，会生成 `ARGC` 和 `ARGV`。\n\
  \n`ARGC` 等于上述的 `argc`。它的值是正在处理的文件数加 1。\n\n`ARGV` 等于上述的 `argv` 数组。注意 `ARGV[0]` 返回\
  \ `\"Awk\"`。\n\n`ARGIND` 是 `ARGV` 数组的索引，包含正在处理的文件名。\n\n你可以通过 `ARGV[ARGIND]` 知道正在处理哪个文件。\n\
  \n### FILENAME\n\n`FILENAME` 是命令行中写的正在处理的文件。`FILENAME` 和 `ARGV[ARGIND]` 是等价的。根据情况使用其中之一。注意\
  \ `FILENAME` 是命令行中写的完整名称，包含文件路径。\n\n### NR 和 RS\n\n`NR` 是从第一个处理的文件开始的输入记录数（行号）。`NR`\
  \ 计数从第一个文件的第 1 行开始，一直持续到所有文件处理。空行被计作一行。`NR` 的最终值将文件中包含的总行数。注意，定义记录结束符的内置变量 `RS`\
  \ 默认值为 `\\n`（换行符）——默认情况下，记录号和行号是相同的。如果你将 `RS` 修改为 `\\n\\n` 以处理多行记录，那么行号和记录号就会产生差异。\n\
  \n`FNR` 与 `NR` 相同，但数字是当前处理文件的行号。每当加载一个新文件时，`FNR` 会重置为 1。\n\n### FS, RS, NF, OFS,\
  \ ORS\n\n*   `FS` - 输入字段分隔符（默认是空格 `\" \"`）。\n*   `RS` - 输入记录分隔符（默认是换行符 `\"\\n\"\
  `）。\n*   `NF` - 当前记录中的字段数（当前行的单词数）。\n*   `OFS` - 输出字段分隔符（默认是空格 `\" \"`）。\n*   `ORS`\
  \ - 输出记录分隔符（默认是换行符 `\"\\n\"`）。\n\n### SUBSEP\n\n多维数组可以展平成维数组。相应的一维索引是通过存储在 `SUBSEP`\
  \ 中的特殊字符分隔的索引连接而成的（默认十进制 28 `\\034`，特殊 ASCII 字符 `FS` - 文件分隔符）。因此，如果你执行 `SUBSEP=\"\
  @\"`，二维数组元素 `myArray[i,j]` 就会变成一维元素 `myArray[i@j]`。这种机制适用于更大的多维数组。\n\n### $0, $1,\
  \ $2, 等.\n\n`$1`, `$2` 等 - 包含刚刚读取的记录的标记， `$0` 包含刚刚读取的整个记录。$`（美元符号） `$0` - Awk: 刚刚读取的记录，Perl:\
  \ 程序名（也称为 `$PROGRAM_NAME`）。$`（美元符号）包含刚刚读取的记录的标记。`$1`, `$2` 等是捕捉刚刚读取记录标记的内置变量。`$0`\
  \ 包含刚刚读取的整个记录。\n\n```awk\nif (num < NF) {\n    print \" \", num;\n}\n```\n\n## 1\
  \ Awk 程序流程控制\n\n可以使用标准的 C 程序控制运算符 `if`、`while`、`for`、`do...while`、`continue`、`break`、`switch`。Awk\
  \ 提供了三个额外的控制：`exit`、`next` 和 `getline`。参见 中断处理（第 312 页)。\n\n*   `exit` 用于停止处理文件。Awk\
  \ 仍然会执行 `END` 语句。\n*   `next` 意味着停止处理当前行，获取下一行，并从第一个规则继续处理。\n*   `getline` 类似于 `next`，它停止处理当前行，获取下一行，但从当前规则继续处理。关于\
  \ `getline` 有更多信息请咨询文档。\n\n## 1 Awk 运算符\n\n可以使用以下标准 C 运算符：\n\n*   算术：`+`、`-`,`*`、`/`、`%`、^`\n\
  *   增减：`++`、`--`\n*   赋值：`=`、`+=`,`-=`,`*==`=`%=`,`^=`\n*   一元：`+`、`-`,`!`（非）\n\
  *   逻辑比较：`<`,`>``,`<=``>=`,`==``,`!=`\n*   逻辑运算符 `&&`, `||` 可用于规则的条件部分或语句内部以比较两个变量。\n\
  *   逻辑语句匹配 `~`。在条件中使用 `==` 和 `!=` 时，可以使用 `~`、`!~`，例如：\n\n```awk\n$4 !~ \"New York\"\
  \n```\n\n意味着选择 $4 不包含 \"New York\" 的所有行\n\n*   条件表达式 `condition ? result if true\
  \ : result if false;` 是支持的。\n\n## 1 Awk 字符串\n\nAwk 字符串类似于 C++ 的 String 类和字符链。它们可以拼接，但与\
  \ C 不同，不需要执行 `strcat` 来拼接字符串变量：\n\n```awk\nfirstName = \"Sasha\"; lastName = \"\
  Gomez\";\nfullName = firstName \" \" lastName;\nprint(fullName); 输出 Sasha Gomez.\n\
  ```\n\n\n\n\n\n注意看 `fullName` 内部是如何在没有使用类似 `strcat` 函数的情况下直接拼接空格的。\n\n### Awk (strings)\n\
  \n<x>Awk (strings)[AUX]字符串函数: index, length, substr, match</x><x>Awk (内置变量和函数)[AUX]字符串函数:\
  \ index, length, substr, match</x> Awk 的内置字符串函数与 C 语言中的函数不同。以下是几个常用函数的示例。还有更多函数，完整列表请参阅\
  \ Awk 参考文档。\n\n*   `index(str, substr)` - 返回 `substr` 在 `str` 中的位置。请记住，Awk 字符串是从\
  \ 1 开始计数的，因此如果没有找到 `substr`，则返回 0；`str` 的第一个字母对应的位置值为 1。\n*   `length(str)` - 返回字符串\
  \ `str` 的长度。\n*   `substr(str, i, n)` - 返回从字符串 `str` 中位置 `i`（从 1 开始）开始长度为 `n` 个字符的子字符串。\n\
  *   `match(str, regex)` - 如果存在正则表达式 `regex` 匹配，则返回其位置（从 1 开始），否则返回 0。\n\n#### Awk\
  \ print\n\n<x>Awk (rules)[AUX]Print 等同于 C++ 的 Serial.print</x> Awk 中等同于 C++ `Serial.println`\
  \ 的简单打印语句是：\n\n```\nprint($3, \" \", $4, \" - salary = $\", $8);\n```\n\n<x>Awk\
  \ (rules)[AUX]变量 OFS, ORS 控制 print 的行为</x> 连续两次打印将产生以下结果（OFS 设置为 \"\"遇到逗号时不加空格）：\n\
  \n```\nSasha Gomez - salary = $20\nTed Smith - salary = $22\n```\n\n基础 print 命令是\
  \ `print a b c d`，其中 `a`、`b` 等可以是任何可打印的内容。如果内容不可打印，则会跳过并继续。注意，`print` 命令并不一定要求参数必须放在括号内。分隔打印项的逗号不是必须的，标记\
  \ print 语句结束的分号也不是必须的。以下所有形式都是法的：\n\n1. `print a b c d` # 基础结构\n2. `print a b c\
  \ d;` # 基础结构加分号\n3. `print a, b, c, d;` # 系统使用逗号\n4. `print a b, c d;` # 使用使用逗号\n\
  5. `print (a b, c d);` # 使用括号\n\n使用逗号会对输出产生影响。使用分号和/或括号则没有影响。\n\n*   <x>Awk (内置变量和函数)[AUX]输出记录分隔符\
  \ - 默认是换行 (ORS = \"\\n\")</x> `print` 命令在打印后添加一个换行。它等同于 `Serial.println`。这种默认行为可以通过修改内置变量\
  \ `ORS` 的值来改变。\n*   只要 `print` 语句后续的内容没有歧义，分号就不是强制的。但良好的编程习惯要求系统性地使用分号。\n*   逗号意味着\
  \ `print` 会打印一个空格：\n    *   第 1 行和第 2 行会将项拼接在一起并打印 `abcd`。\n    *   第 3 行会在每个项后打印一个空格：`a\
  \ b c d`。\n    *   第 4 行和第 5 行将打印 `ab` 然后是一个空格，然后 `cd`。\n*   括号是可选的。它们对输出没有影响。\n\
  *   <x>Awk (内置变量和函数)[AUX]OFS 输出字段分隔符控制遇到逗号时是否打印空格</x> 你可以通过两个内置变量修改打印行为：\n    *\
  \   `ORS` (输出记录分隔符) - 控制是否自动打印换行符。默认是 `ORS = \"\\n\"`。\n        如果你想让多次打印输出在同一行，请这样做：\n\
  \        ```\n        ORS = \"\";\n        print...\n        print...\n        ORS\
  \ = \"\\n\";\n        ```\n    *   `OFS` (输出字段分隔符) - 控制遇到逗号时是否打印空格。默认是空格 `OFS =\
  \ \" \"`。如果你为了提高代码可读性使用逗号且不希望它们被转换为空格，可以这样做：\n        ```\n        OFS = \"\";\n\
  \        print a, b, c, d; # abcd 将拼接在一起，不添加空格\n        ```\n\n为了可读性，使用逗号而不让 Awk\
  \ 自动添加空格可能是更好的。要这样做，可以在 `BEGIN` 块中插入 `OFS = \"\"` 和 `ORS = \"\"` 并直接控制格式。通过这样做，逗号不会添加空格。如果你需要换行符，请在\
  \ print 语句中显式添加 `\\n`。\n\n*   可以使用更复杂的 `printf` 语句来精炼格式。如果你需要使用此函数，请参阅官方 Awk 参考文档。\n\
  \n#### Awk 数学函数\n\nAwk 提供了一组数学函数，如下：\n\n*   <x>Awk (general)[AUX]提供三角、对数、类型转换、随机数数学函数</x>\
  \ 三角函数：`sin(x)`、`cos(x)`、`atan2(y/x)` - `x` 和 `y` 单位为弧度。\n*   类型转换：`int(x)` - 将数字截断为\
  \ `int`（Awk 中的所有数字都是浮点数）。\n*   对数：`log(x)`、`sqrt(x)`、`exp(x)` 是 `e` 的 `x` 次方。\n\
  *   随机数：`rand()` 返回 0-1.0 的随机数，`srand(x)` 根据时间设置种子。\n\n#### Perl (appendix)\n\n\
