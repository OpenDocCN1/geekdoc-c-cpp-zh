  \ 将数据拆分成块以便串行传输。\n`Data Packets Framework`：将数据拆分为块/包。\n`Data Packets Framework`：通过串口发送/接收数据包。\n\
  \n数据包框架（第 161 页） 的机制封装在 `DataPackets` 类中。它通过将用户数据块（最大大小为 169 字节）拆分为可管理尺寸的数据包并逐个发送来处理无线传输。\n\
  \n```cpp\nclass DataPackets {\n// 处理基础发送/接收数据\npublic:\n  DataPackets(uint8_t _dataSize,\
  \ char* _dataBuffer);\n  bool PacketsSend();\n  bool PacketsGet();\n  uint8_t GetDataBufferArraySize()\
  \ {return dataSize;}\n  uint8_t GetPacketSize() {return packetSize;}\n\nprivate:\n\
  \  bool GetByte(uint8_t _byteToGet, long _timeLimit);\n  uint8_t Calculatehecksum();\n\
  \  bool VerifyChecksum();\n  bool VerifyParametersCoherence();\n  uint8_t packetSize{0};\
  \ // 大硬编码为 48\n  char* dataBuffer{(char*)0}; // 要发送/接收的数据包数量\n  uint8_t dataSize{0};\
  \ // 要发送/接收数据的总字节数，来自构造函数\n}; // class DataPackets\n```\n\n该类的基本特征如下：\n\n* `DataPackets(uint8_t\
  \ _dataSize, char* _dataBuffer)` 构造函数接收要发送的数据大小和要发送数据的指针。它根据需要将数据拆分为数据包：最多 169 字节。\n\
  * `PacketsSend()` 和 `PacketsGet()` 函数逐个发送/接收数据包。\n* `VerifyCoherence()` 函数检查第一个数据包中的块参数是否与块的特征一致。该函数主要用于检测编程错误。\n\
  * `CalculateChecksum()` 和 `VerifyChecksum()` 处理校验和。这些确保了数据没有被损坏。\n\n### 2. 格式驱动的浮点数到字节转换框架（附录）\n\
  \n`Format Driven float to byte Conversion Framework` 减小了数据量。\n`Format Driven float\
  \ to byte Conversion Framework (FDFBC)`：将浮点值转换为紧凑字节并反之，其凑过程由参数控制，`FDFBC` 类完成所有工作。\n\
  \n格式驱动的浮点数到字节转换框架（第 162 页） 将一组以浮点数数组表示的传感器数据转换为一组紧凑字节并反之，其目标是无缝地压缩传感器数据，以便通过串口进行无线传输。这项工作由\
  \ `FDFBC` 类（格式驱动浮点数字节转换）完成。它将浮点数数组转换为字节数组。在接收端也执行反操作，将字节数组转换为相应的浮点数数组。\n\n每个传感器的转换都通过参数控制以优化凑紧。以浮点数表示的传感器值占用四个字节内存。在分析每个传感器可能的数值范围后，转换结果可能低至一个字节。我基于\
  \ Arduino 的蜂巢称重系统监控八个提供浮点值的传感器，即 32 字节。如后文所示，八个基于 Arduino 的蜂巢称重系统传感器的数据可以减少到 9 字节，待传输的数据量显著减少了\
  \ 23 字节。\n\n完成所有工作的 `FDFBC` 类具有以下特征：\n\n* `FDFBC` 构造函数接收指向三个外部定义数组的指针：控制参数数组 `sensorDataParams`、传感器浮点数组\
  \ `sensorFloatData` 和传感器字节数组 `sensorByteData`。\n* 公有顶层函数负责原始浮点数传感器值与传感器字节值之间的转换。\n\
  * 私有辅助函数被顶层函数用于完成工作。\n* 指向数组的私有指针包含控制参数和要处理的数据。\n\n```cpp\nclass FDFBC{\npublic:\n\
  \  FDFBC( ... ); // 构造函数\n  // 主顶层函数\n  bool TransferFloatToInt8array(... );\n \
  \ bool TransferInt8arrayToFloat(... );\n\nprivate: // 私有函数\n  // 由上述主函数调用的辅助函数\n\
  \  uint8_t CalculateBytesRequiredFloat( ... );\n  uint8_t GetNumberOfDecimals( ...\
  \ );\n  bool GetNegativeOK( ... );\n  uint8_t GetControlVariablesArraySize( ...\
  \ );\n  SensorDataParams GetAllControlParameters( ... );\n  uint8_t GetOffsetSensorInDataPacket(\
  \ ... );\n  uint8_t GetGlobalArraySize( ... );\nprivate: // 私有数据\n  SensorDataParams*\
  \ sensorDataParams; // 控制参数\n  float* sensorFloatData; // 传感器值\n  uint8_t* sensorByteData;\
  \ // 转换后的数据\n}; // class FDFBC\n```\n\n* `FDFBC` 枚举定义了传感器：\n```cpp\nenum EHiveSensors\
  \ {\n  start = 0,\n  volts = 0,\n  hiveTemp,\n  hiveHumid,\n  weight,\n  body,\n\
  \  end\n};\n```\n\n* 浮点到字节转换的机制基于每个传感器的参数。`SensorDataParams` 结构包含了 `FDFBC` 类使用的所有参数。\n\
  \n```cpp\nstruct {\n  uint8_t bytes: 2; // 字节数（0-3），应用偏移量 1\n  uint8_t decimals:\
  \ 2; // 小数位数（0-3）\n  uint8_t divider: 2; // 除数（0-3），以十为位\n  float min{0.0}; // 最小值\n\
  \  float max{0.0}; // 最大值\n} sensorDataParams[number of sensors];\n```\n\n* 发送数据所需的字节数为\
  \ 0-3 字节，应用偏移量 1 来设置字节数。\n* 小数位数可能是 0 或更多。电池电压需要一位小数；温度——0 位小数；湿度——0 位小数；重量需要两位小数。\n\
  * 除数——某些获取的传感器值包含比所需的更高的精度。例如，湿度可以以百分比的十位报告，因此 56% 应该转换为 60% 并除以 10。待传输的值变为 6 而不是\
  \ 56，从而减少了字节数。此外，由于范围是 30% 到 100%，湿度值可以通过以 30 为基准进一步减少，从而将传输值限制在 0 到 7 的增量内（如果你挑战极限，只需要一个字节/4\
  \ 位）。\n\n* 传感器参数存储在结构数组中，每个传感器一组。\n\n\n\n\n\n```cpp\nextern const SensorDataParams\
  \ sensorDataParams[]; // 保存控制参数\n```\n\n* `floats` 数组包含传感器数据。转换后的数据存储在 `uint8_t`\
  \ 数组中：\n\n```cpp\nextern float sensorFloatData[]; // 存储传感器值\nextern uint8_t sensorByteData[];\
  \ // 存储转换后的压缩传感器数据\n```\n\n### 格式驱动的浮点转字节转换框架 (FDFBC)\n蜂箱重量系统传感器值通过 `FDFBC` 将数据传输量从\
  \ 24 字节减少到 9 字节。你将在下文中逐一检查基于 Arduino 的蜂箱称重系统传感器，以指定控制参数值。\n\n* **电压** - 稳压电压在 4.7\
  \ 到 5.0 之间波动，电池电压在 6.1 到 8.1 之间波动。在这两种情况下，0.1 伏特的分辨率都是理想的，一个字节足够了。考虑到 4.7 伏的最小值，数据传输可以限制为传输高于最小值的增量乘以\
  \ 10，而不是传输整个电压值，因此只需要一个字节即可发送从 0 到 3 的增量。对于电池电压，考虑到 6.1 的最小电压，增量范围从 0 到 20，因此每个都需要一个字节。\n\
