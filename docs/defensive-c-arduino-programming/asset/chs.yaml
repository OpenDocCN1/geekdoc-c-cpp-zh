  \ `make` 工具的错误。它本应该列出。\n\n## 1. 项目中不存在的文件未列在错误消息窗口中\n\n<x>AtmelStudio（注意事项）[AUX]由于项目内不存在的文件导致构建失败，且未在错误消息中</x>出于某种原因，在使用\
  \ Arduino IDE 时，我决定不再需要使用某个类。我删除了/修改了对该类及其函数的所有引用，并删除了相应的 `#include`。我重新编译并运行了应用程序。完美吗？并不完全，因为切换到\
  \ `AtmelStudio` 后，构建失败了。这不是编译器错误。它一定是其他原因。\n\n通过分析输出窗口的内容（复制/粘贴到记事本以便于阅读），我发现：\n\
  \n```\nmake: *** No rule to make target '.././MyFile.cpp', needed by MyFile.o'.\
  \ Stop.\n```\n\n事实证明项目属性仍然认为 `MyFile.cpp` 和 `MyFile.h` 是项目的一部分。最后一步是打开解决方案管理器（Solution\
  \ Explorer），从项目文件列表中移除我已物理删除的两个文件。移除这些文件后，问题解决了。总结一下：当从项目中删除一个 `MyFile.h`/`MyFile.cpp`\
  \ 文件对时，请执行以下操作：\n\n* 移除或注释掉 `MyFile.cpp` 和 `MyFile.h` 内容中的所有调用。\n* 移除或注释掉项目文件中 `#include\
  \ \"MyFile\"` 部分。\n* 通过解决方案管理器从项目属性中移除 `MyFile.cpp` 和 `MyFile.h`。\n\n完成上述操作后，一切恢复了正常。这个错误是\
  \ `make` 工具错误未被列出的反例：文件确实存在于正确的文件夹中，但它没有被纳入项目文件列表。\n\n## 2. 查找和替换\n\n<x>AtmelStudio（查找/替换）[AUX]小心查找/替换已打开的文档</x><x>AtmelStudio（查找/替换）[AUX]要更改应用程序的项目名称，请考虑重构而非查找/替换</x><x>AtmelStudio（编辑器）[AUX]重构\
  \ - 重命名整个应用中的项目</x>我应该对 `AtmelStudio` 的查找/替换发出警告。在进行查找/替换时，选项之一是指定在“已打开文档”中进行；选择此选项可能有点危险。在设置“已打开文档”的情况下进行查找/替换时，只有已打开的文件会被处理。包含应修改项的未打开文件将保持原样。如果这些未修改的项触发了编译器/链接器错误，将很容易找到错误；否则，应用程序将出现神秘的\
  \ Bug。\n\n如果你打算使用查找/替换来更改整个应用程序中的变量或函数名称，你应该考虑使用重构（Refactoring）。\n\n## 3. AtmelStudio\
  \ 代码格式化和代码折叠 Bug\n\n代码格式化和代码折叠并不总是有效。你可以点击函数名称左侧的小减号框（在 `AtmelStudio` 术语中称为大纲视图）来折叠函数。你还可以通过执行\
  \ `Edit --> Advanced --> Format`（文档或选择内容）来格式化代码。当没有那个小框时，这两种 `AtmelStudio` 功能都无法起作用。\n\
  \n当我使用 `AtmelStudio` 处理某些函数时，偶尔会有某些函数无法折叠（左侧没有带减号的小框），也无法被正确格式化。经过几次尝试，我发现了两个原因：\n\
  \n* **左大括号后的 C 风格注释** - 遗留代码通常会在函数的左大括号后包含一个 C 风格注释。这里有一个遗留代码的示例：\n\n```\nvoid SomeFunction()\
  \ { /* this function needs to be rewritten */\n\n...\n\n} // SomeFunction\n```\n\
  \n该函数无法折叠，左边缘没有小减号框。将注释改为 C 风格，如下：\n\n```cpp\nvoid SomeFunction() { // this function\
  \ needs to be expanded\n```\n\n函数就变得可以折叠了。这个 Bug 不会阻止函数进行正确的缩进。\n\n* **构造函数的内联初始化**\
  \ - 内联初始化并非必须。程序员完全可以使用单独的代码来初始化类变量，但这会使构造函数代码变得混乱。一个典型的内联构造初始化如下：\n\n```cpp\nSomeClass::SomeClas(\
  \ uint8_t _var1, uint8_t _var2)\n: var1(_var1), var2(_var2) {\n…\n} // SomeClass(\
  \ uint8_t _var1, uint8_t _var2)\n```\n\n你会发现上面的函数既无法折叠，也无法正确缩进。移除初始化列表可以解决这个问题。\n\
  \n## 4. 自动格式化 if...else 的问题\n\n当我编写 `if...else` 语句时，我希望看到这样的：\n\n```cpp\nif (1st)\
  \ {\n...\n} else {\nif (2nd) {\n...\n} else {\n...\n} // 2nd if\n} // 1st if\n```\n\
  \n这非常易读；嵌套的 if 会清晰显示。\n\n如果你在 Arduino IDE 中自动格式化上述内容，效果会很好；但 `AtmelStudio` 则会这样缩进\
  \ `else`：\n\n```cpp\nif (1st) {\n...\n}\nelse\n{\n    if (2nd)\n    {\n    ...\n\
  \    }\n    else\n    {\n    ...\n}\n```\n\n代码变得难以阅读。唯一的解决方法是将 `else` 放置在 `if` 的右大括号之后。你会得到：\n\
  \n```cpp\nif (1st) {\n...\n}\nelse {\nif (2nd) {\n...\n}\nelse {\n...\n} // 2nd\
  \ if\n} // 1st if\n```\n\n这种可读性好一点，但没有 Arduino IDE 的效果。\n\n## 5. 拒绝展开某部分代码\n\n<x>AtmelStudio（注意事项）[AUX]代码固执地折叠着</x>当\
  \ `#ifdef` 很多且嵌套层数较深时，有时折叠代码后，`AtmelStudio` 拒绝通过左侧的图标将其展开。折叠的部分会固执地保持折叠状态。解决方案是格式化整个文档（`Edit\
  \ --> Advanced --> Format`）。这将展开文件中的所有内容。尽管如此，在此之前你可以尝试通过对折叠的可视行进行编辑来让代码展开，但不总是成功。\n\
  \n## 6. 无法为新微控制器生成代码\n\n<x>AtmelStudio（注意事项）[AUX]Arduino Core 内容似乎锁定在了第一个编译设备上</x>从\
  \ Arduino 项目创建 `AtmelStudio` 项目时，需要指定设备。我通常指定 `ATmega2560`（Arduino ATmega 板），因为这是我的开发板。注意，我有时想在\
  \ `ATmega328P`（Arduino Uno 板）上运行应用程序 `MemMgt`。在重新生成时，我在 `ArduinoCore` 和 `MemMgt`\
  \ 项目属性中指定新的微控制器并重建解决方案。由于依赖关系，`Arduino Core` 先重建，然后是我的项目（`MemMgt`）。结果令人失望——`ArduinoCore`\
  \ 上出现了大量错误消息，例如：\n\n```\nError recipe for target 'src/core/wiring_digital.o' failed\n\
  \nError 'DDRA' undeclared here (not in a function)\n\nError 'DDRE' undeclared here\
  \ (not in a function)\n\nError 'DDRF' undeclared here (not in a function)\n\n...\
  \ 40+ 类的错误\n```\n\n\n\n如果我将设备重置回 `ATmega2560`（即原始 Arduino sketch 导入的设备），一切都会恢复正常。看来，如果我想为新的微控制器成功重新编译，我必须在另一个独立的\
  \ Arduino sketch 导入中进行。这需要我定义两个不同的项目目录，一个用于 `ATmega328P`，另一个用于 `ATmega 2560`，从而需要两套文件，以及由此可能产生的所有问题。我可能漏掉了某些信息。\n\
  \n### Arduino IDE 与 AtmelStudio\n\n如果你想在这两个环境中更改开发板/控制器的组合，你需要执行以下操作：\n\n*   `Arduino\
  \ IDE` 允许你指定微控制器和开发板，有时仅限开发板。进入 `Tools-->Board` 并选择。Arduino 将使用相应的核心库，并生成相应的输出以上传到微控制器中。如果需要为不同的开发板/控制器组合编译代码，只需指定新选项、编译并上传到微控制器即可。\n\
  *   `AtmelStudio` - 在导入 sketch 并定义开发板/控制器组合时，`AtmelStudio` 会根据提供的信息生成相应的 Arduino\
  \ 核心文件。之后，你可能想通过项目属性修改目标微控制器并重新编译。开发板的选择似乎不再起作用，随之而来的是麻烦。\n\n### 案例研究：串口通信\n\n这是我在\
  \ AtmelStudio 中非常意料遇到的一个情况。我的项目需要 ZigBee 射电模块之间进行串口通信。在开发阶段，我使用 `ATmega2560` 开发板，因为它有大量内存，并且提供了几个硬件串口。我使用硬件串口在控制台中显示\
  \ `Serial.prints`，并使用硬件串口 serial1 与 ZigBee 射电模块进行通信。\n\n当我执行 `Arduino IDE` 的 sketch\
  \ 导入时，我自然地指定了 `ATmega2560` 开发板和微控制器，因为这是我开发的地方。过程很简单，应用程序运行良好。发布版本旨在运行在较小的 `ATmega328P`\
  \ 上，它只提供一个硬件串口，我将其用于基于打印的调试。由于 `ATmega328P` 没有第二个硬件串口，我的办法是使用 `SoftwareSerial` 库来处理\
  \ ZigBee 通信。这意味着在我的代码中某处：\n\n```cpp\n#ifdef MEGA328P\n\n#include <SoftwareSerial.h>\n\
  \nextern SoftwareSerial XBeeSerial; //RX, TX\n\n#endif // MEGA328P\n```\n\n我在 `Project-->Properties`\
  \ 窗口中将设备设置从 `ATmega2560` 更改为 `ATmega328P` 并执行了 `Build`。这是我得到的结果：\n\n```text\nSoftwareSerial.h:\
  \ No such file or directory\n```\n\n这不是我所希望看到的。解释很简单：当我最初将项目导入到 `AtmelStudio` 时，我在项目属性设备选项中指定了\
  \ `Arduino_2560`，因此不需要 `SoftwareSerial` 库——Arduino 核心在构建时没有包含它。因此，我认为将 `AtmelStudio`\
  \ 的设备选项设置为 `ATmega328P` 并执行 `Rebuild Solution` 就会重新构建 Arduino 核心内容并集成 `SoftwareSerial`\
  \ 库。但并没有发生。我只找到了一个解决方案：专门为 `ATmega328P` 微控制器创建一个全新的项目——这并不理想。\n\n当你执行 `Rebuild Solution`\
  \ 时，它会将微控制器规范传递给编译器，但它不会重新定义需要构建的文件。它保留了项目创建时最初选择的文件。执行 `Rebuild all` 并没有解决问题。\n\
  \n### 1. 快捷键\n\n你可以在下方找到关于 `AtmelStudio` 快捷键的信息源：\n\n*   `AtmelStudio V7 User Guide`\
  \ - 它有 14 页，详细列出了快捷键（参见下文的 Documentation 部分）。注意，我发现列出的快捷键中有一个是没有激活的；`CTRL+SHIFT+SPACE`\
  \ 用于列出高亮函数所接受的参数。\n*   菜单项 - 某些菜单项提供了快捷键。\n*   `AtmelStudio's VAssist help` - 你可以在\
  \ `VAssist` 菜单项底部找到帮助。如果你打算使用 `VisualStudio`，这是必读的，因为它提供的快捷键被证明是节省时间的利器。打开 `VAssist\
  \ shortcuts` 对话框——它显示了预定义的 `VAssist` 快捷键。`Print All` 按钮显示所有 `VAssist` 命令，左侧列带有大拇指图标的项目是预定义的，其他所有项目都是可自定义的。\n\
  *   标准 Windows 快捷键 - `AtmelStudio` 支持标准的 Windows 快捷键，如用于查找的 `ctrl-F`、用于查找/替换的 `ctrl-H`、用于复制的\
  \ `ctrl-C`、用于粘贴的 `ctrl-V`以及用于剪切/复制的 `ctrl-X`。\n*   搜索互联网 - 如果你在 Google 上搜索 `AtmelStudio\
  \ V7` 快捷键，你会找到包括 Microchip 文档网站在内的参考。\n\n在处理完工作区字体大小后，我盲目测试了随机快捷键。你会在下方发现我尝试出来的。\n\
  \n`ctrl+space` 以三种方式之一运行：\n\n*   光标位于非高亮函数上，会打开一个包含函数的文本框。选择其中一个会打开第二个文本框；显示函数的参数和使用帮助。\n\
  *   光标位于空白处——与上述相同，不同在于随着函数名称的输入，列表会缩小。\n*   光标位于高亮单词上——会打开一个包含可插入代码的文本框。\n\n以下是一些实用的快捷键：\n\
  \n*   `ctrl+mouse wheel` - 增大/减小工作区字体。\n*   `ctrl+shift+<` 和 `ctrl+shift+>` - 与鼠标轮相同，用于增大/减小工作区字体。\n\
  *   `ctrl+left click` - 高亮一个单词。当你移动光标时，它将继续一次高亮一个单词，而不是一次高亮一个字符。\n*   `ctrl+l` -\
  \ 删除一行。\n*   `ctrl+m` -- 切换代码折叠，需要操作两次。\n*   `ctrl+u` 和 `ctrl+shift+u` - 转小写/转大写。\n\
  *   `ctrl+t` - 反转当前字符与下一个字符并并进一个字符。\n*   `ctrl$` - 在法文键盘 (AZERTY) 上打开解决方案管理器窗口；在\
  \ QWERTY 键盘上是 `ctrl+l`。\n\n### 2. 文档\n\n`AtmelStudio` 信息的主要来源是 `AtmelStudio 7 User\
  \ Guide`。在 Studio 内部时，你会发现两组帮助：\n\n*   位于 `Help` 菜单项下的内联文档。它似乎与上面的 `AtmelStudio's\
  \ User Guide` 文档相同。\n*   `VAssist` 帮助，位于顶层下拉 `VAssist` 菜单项。这个特定的帮助在 Build 1391 中出现过问题，因为它指向的\
  \ URL (atmel.com) 不再存在。该帮助在 Build 2594 中已得到更新。它包含一个特别实用的功能，快捷键列表。另一个帮助链接标记为 `Documentation`，指向一个包含极其广泛的\
  \ Microchip 文档列表的网页，数百个。幸运的是，有一个搜索框；遗憾的是，搜索 `VAssist` 文档没有得到任何结果。\n\n\n\n\nVisual\
  \ Studio 是微软的旗舰开发工具。它是一款专业工具，具有高可靠性（如 Word、Excel 等）。它是一个非常专业的多语言开发工具。Visual Studio\
  \ 是微软的旗舰开发工具，提供两个版本：2019 和 2022。它支持多种语言：C++、C#、Python……以及多平台：Windows、MacOS、Linux。它提供了嵌入式开发扩展：Arduino、ESP32、RaspberryPi……AtmelStudio（通用）是一个基于\
  \ Visual Studio 的 Atmel 环境，支持多语言（C++、C#、Python……）和多平台（Windows、MacOS、Linux）。它提供了嵌入式开发扩展（Arduino、ESP32、RaspberryPi……）。其学习曲线并不陡峭。此外，社区版提供了足够的\
  \ Arduino 开发功能，并且是免费的。\n\n## 1. Visual Studio 特性\n\n问题是：用 Visual Studio 可以做什么？答案是：多得多！打开\
  \ Visual Studio 并点击“新建项目”时，会弹出一个多选窗口。这非常引人注目，因为它说明了用它可以做多少事情。它提供了许多可能性，具体取决于你正在使用的配置。\n\
  \n以下是三个你可以尝试的 Visual Studio Community 编程场景：\n\n*   你刚下载的开箱即用的 Visual Studio 是基础版的。当你第一次打开\
  \ Visual Studio 时，看到一个窗口，它提供了打开最近项目、执行其他操作以及“创建一个项目”的可能性。\n\n    2022 版本包含了远程 Linux\
  \ 工作等更多功能；但令人惊讶的是，你无法创建一个简单的在 DOS 命令行中运行的打印 Hello world 程序；不过，你之后可以导入控制台应用插件。我确实发现了一个与\
  \ Arduino 相关的选项：名为 `Arduino project template`（Arduino 项目模板）的东西。它看起来很有前景（见下一节）。\n\
  \n    2019 版本包含控制台应用（创建一个在 DOS 命令行中运行的打印 Hello world 程序），但不包含像 2022 版本那样的 Arduino\
  \ 插件；除了下文介绍的 `Visual Micro` 插件外，似乎没有其他可用的插件。\n\n*   通过 Arduino project template\
  \ 或 Visual Micro 创建 Arduino 应用。控制台应用（在 DOS 命令行中运行的程序）——如果你想创建简单的命令行程序，即在 DOS 命令行中作为\
  \ `.exe` 文件运行的程序，你需要安装 `Console App` 插件。当你执行“创建新项目”时，会打开可能的项目类型列表。如果你找不到想要的，点击列表底部的消息，上面写着\
  \ `未找到您要查找的内容？请安装更多工具和功能`。执行此操作，你就会找到 `Console App` 扩展等更多内容。安装此扩展后，创建一个简单的程序，进行生成，然后从\
  \ DOS 命令行中打开并运行 `.exe` 文件。你可能不需要创建此类程序，因为你的重点是做 Arduino 工作；但在掌握了这项新技能后，你将来可能会发现它很有用。当你在寻找\
  \ `Console App` 扩展时，你会发现还有许多你可能感兴趣的扩展。\n\n*   用于 Arduino 的 Visual Studio (Visual\
  \ Micro) 插件（第 82 页）——使用 Visual Studio 创建 Arduino 应用的另一种方法（第一种方法是使用 2022 版本的 `Arduino\
  \ project template`，见下一节）是安装 `Visual Micro` 插件。该插件适用于 2019 和 2022 版本以及 AtmelStudio，负责编译、上传和通过串口终端进行程序输出。Visual\
  \ Studio 被退级为处理源码编辑和项目管理的工具。带有 `Visual Micro` 插件的 Visual Studio 2019 变成了带有 `Visual\
  \ Micro` 插件的 AtmelStudio 的孪生版本。注意 `Visual Micro` 还提供了 `串口调试`（第 125 页）。\n\n如果你精通使用\
  \ Visual Studio 进行 Arduino 应用开发，锦上添花的是还有数百个你现在或以后可能会发现的插件（Python、Raspberry Pi、上述的\
  \ Console App……）。使用 Visual Studio 2022 + Visual Micro 进行开发，使用 AtmelStudio + Xplained\
  \ 板进行硬件调试。我建议将 Visual Studio 2022 配合 `Visual Micro` 作为你的默认开发环境，特别是因为它能够与 Arduino\
  \ IDE 和 AtmelStudio 建立互操作性。这样你就可以使用微软最新的开发工具了。尽管如此，我目前（2023 年 5 月）只知道一种方法。\n\n##\
  \ 2. Visual Studio 下载\n\nVisual Studio 一词指的是一系列产品，无论从版本还是变体来看。在 Google 上搜索 Visual\
  \ Studio download 时，你会被引导到 `https://visualstudio.microsoft.com/downloads/`，那里提供了四种变体的\
  \ Visual Studio 2022（社区版、专业版、企业版）。社区版是你需要的；它是免费的；其他变体需要年度订阅，尽管提供了免费试用。\n\n但请注意提供的变体是\
  \ 2022 版。由于 Atmel Studio 基于 2019 版本，你可能想下载 2019 版本。注意，2019 和 2022 版本可以安装在同一台电脑上并并行使用。它们似乎不会互相干扰。\n\
  \n要下载 2019 版本，请访问 `https://visualstudio.microsoft.com/vs/older-downloads/`。你会找到\
  \ 2019、2017、2015 及更早的版本，选择 `Visual Studio Community 2019` 并点击刚打开窗口中的下载。你会找到 49 个可下载的产品；选择\
  \ `2019` 版本（版本 `16.11`，2023 年 4 月 11 日）。此时你可能会被要求登录 Microsoft 账户；请登录或创建一个并登录。之后，像下载其他产品一样下载即可。\n\
  \n## 3. Visual Studio 2019 对比 Visual Studio 2022\n\n我无法报告这两个最新版本（2019 与 2022）之间的根本区别。但我也确实注意到了一些差异，如下：\n\
  \n*   安装这两个版本后，你会发现桌面图标是相同的。你可以通过鼠标悬停在图标上来区分它们；会弹出一个窗口显示该图标关联的 Visual Studio 版本。\n\
  \n*   两个变体可以共存在于同一台电脑上。它们可以同时运行。\n\n*   每个版本都提供了一些默认插件：\n\n\n\n\n\n2019 版本默认提供控制台应用插件。除了\
  \ `Visual Micro` 之外，似乎没有其他可用的 Arduino 插件。\n\n2022 版本默认提供 `ArduinoProjectTemplate`（Arduino\
  \ 项目模板），但没有提供控制台应用。尽管如此，控制台应用仍然是可用。\n\n*   你可以在这两个版本中都安装 `Visual Micro`。这些插件需要各自的激活密钥。\n\
  \n### 1. 针对 Arduino 开发者的 Visual Studio\n\n由于 `AtmelStudio` 是 `Visual Studio 2019`\
  \ 的定制版本，我对 `Visual Studio` 的介绍较少，因为实际上我写的关于 `AtmelStudio` 的所有内容几乎都适用于 `Visual Studio`。两者之间的差异大多是外观上的；如果你想了解更多关于使用\
  \ `Visual Studio` 的细节，可以快速浏览一下 `AtmelStudio（第 37 页）` 章节。不过，有一个重要的区别：`AtmelStudio`\
  \ 是一个独立产品，开箱即用兼容 Atmel 微控制器。`Visual Studio 2022` 确实默认包含了一个 Arduino 开发插件；然而，这个插件有点像“作弊”，我的意思是它跳过了在板卡上上传和运行应用程序的过程，而是直接在\
  \ DOS 框中作为 `.exe` 文件运行它，这意味着你并没有驱动任何电子设备。尽管如此，它仍然拥有一个保存功能：它允许开发者直接在 `.ino` 文件上工作，并与\
  \ `Arduino IDE` 接口，从而能够从微控制器直接上传和执行。请参见 `Visual Studio（Arduino 项目模板）（第 82 页）`。\n\
  \n如果你真的想像上面描述的那样在不用 `Arduino IDE` 的情况下从 Arduino 板上运行应用程序，你需要为 `Visual Studio` 安装\
  \ `Visual Micro`，也就是你可能为了增强 `AtmelStudio` 而安装的同一个 `Visual Micro`。\n\n`Visual Studio\
  \ 2022` 可能是未来开发需求（包括嵌入式系统）的最佳选择。我建议你先从 `AtmelStudio（第 37 页）` 开始，在不使用 `Visual Micro`\
  \ 的情况下熟悉它。完成之后，下载 `Visual Studio 2022` 并为 `Visual Studio` 安装 `Visual Micro`（下一章）。你的学习曲线将几乎为零。\n\
  \n通过这种组合，你得到了世界上最好的体验：`AtmelStudio` 是我发现的用于 Arduino `硬件调试（第 119 页）` 的最佳工具。在我看来（IMHO），`Visual\
  \ Studio 2022` 是最好的 C++ 开发工具，尽管人们可能会为 `PlatformIO` 以及可能存在的其他我我不熟悉的工具辩护。\n\n### 2.\
  \ Visual Studio (Arduino 项目模板)\n\n<x>Visual Studio[AUX]开箱即用的 Arduino 项目模板解决方案会同时创建\
  \ .ino 文件和命令行 .exe 程序</x>根据我使用 `AtmelStudio` 的经验，我知道 `Visual Micro` 会满足我的需求；然而，看到\
  \ `Visual Studio` 提出了一套 Arduino 项目模板解决方案时，好奇心战胜了我的理智。我决定尝试一下，仅限于写一个 Hello World。\n\
  \n在“创建项目类型”的窗口中，我向下滚动到 Arduino 项目模板。我点击了它并继续创建一个命名为 `SimplePT` 的项目。对于得到的结果，我毫无准备。这些微软的人很精明。构建会生成一个\
  \ `.ino` 文件（你可以从 `Arduino IDE` 编译、上传并运行它）以及一个将打印信息输出到 DOS 框的 `.exe` 文件。\n\n应用程序的结构如下：\n\
  \n*   `MyApp.ino` 文件只做一件事，它调用 `Sketch.h`。\n*   `Sketch.h` 包含 `setup` 和 `loop`，就像\
  \ `.ino` 文件通常的内容一样。\n*   `Application.cpp` 是你程序的控制台版本（`.exe`）。它包含了 `Sketch.h`。\n\
  *   如果存在其他文件，会被添加到构建中。\n\n执行构建后，`Visual Studio` 会生成一个新的 `.ino` 和一个新的 `.exe` 控制台程序；它们完全相同。`.ino`\
  \ 文件可以通过 `Arduino IDE` 编译/上传并在板卡上运行；`.exe` 文件则准备好从 DOS 框中运行。当然，你从 `.exe` 控制台程序中得到的只是\
  \ DOS 框中的打印信息，因为它不驱动任何电子设备。但单单这一点就可能对调试目的有用。很酷！\n\n但可能存在问题，因为我不确定 DOS 框的可执行文件是否与\
  \ `Arduino IDE` 使用相同的编译器（`GNU toolchain`）创建。我没有在大型应用程序上尝试过这个解决方案。只需记住它是存在的，并且如果你想在微控制器中测试之前通过\
  \ DOS 框测试你的应用程序，它是有用的。\n\n在创建 `ArduinoProjectTemplate` 时，微软将控制台扩展与 `Arduino IDE`\
  \ 的钩子相结合，这样你就可以从中进行构建/上传；简单的方案，巨大的回报。\n\n### 3. Visual Studio (Visual Micro)\n\n\
  <x>Visual Studio[AUX]通过 Arduino 项目模板或通过 Visual Micro 创建 Arduino 应用</x><x>Visual\
  \ Studio[AUX]适用于 Visual Studio 的 Visual Micro 与适用于 AtmelStudio 的版本 相同</x>在我看来（IMHO），在\
  \ `Visual Studio` 内部通过 `Visual Micro` 路径创建 Arduino 应用似乎是更直接的方法：打开 `Visual Studio`，点击顶部工具栏上的\
  \ `Extensions（扩展）` --> `vMicro` --> `Open Existing Arduino Project（打开现有 Arduino\
  \ 项目）`；选择一个 `.ino` 文件。执行构建，点击 vMicro 选择底部 `View Port Monitor（端口监视器）`；它打开一个类似于 `Arduino\
  \ IDE` 的串口监视器。这就足够。纯粹的魔法，它有效！\n\n你可以通过 `vMicro` 菜单进行 `串口调试（第 125 页）`。关于 `vMicro`\
  \ 的更多信息请参见下一章。\n\n请注意有两个版本的 `Visual Studio`：2019 版和 2022 版。`AtmelStudio` 基于 `Visual\
  \ Studio 2019`。由于 `Visual Micro` 基于 Visual Studio，一个许可证适用于 `AtmelStudio` 和 `Visual\
  \ Studio 2019`。如果你还需要适用于 `Visual Studio 2022` 的 `Visual Micro`，你需要第二个许可证。\n\n###\
  \ 4. Visual Studio (调试)\n\n<x>Visual Studio[AUX]调试 - 通过 Visual Micro 进行串口调试可行</x>`Visual\
  \ Studio` 无论是否有 `Visual Micro` 似乎都不支持 `硬件调试（第 119 页）`（但我可能错了）。从先来看，在 Arduino 板上运行\
  \ Arduino 应用程序的唯一实际硬件调试方法是使用带有 `AtmelStudio`（不带 `Visual Micro`）的 `AT328P-X` 板卡。请参见\
  \ `硬件调试（第 119 页）`。\n\n但是，你可以想象通过 `Visual Micro` 在 `Visual Studio` 内部进行 `串口调试（第 125\
  \ 页）`。\n\n### 5. Visual Micro\n\nVisual Micro\n\n<x>PlatformIO（通用）[AUX]IDE：Arduino,\
  \ AtmelStudio, Visual Studio, VS Code, PlatformIO, Visual Micro</x><x>Visual Micro[AUX]三个相同的\
  \ 插件：适用于 AtmelStudio 以及 Visual Studio (2019 和 2022)</x><x>Visual Micro[AUX]为 Arduino、ESP32、树莓派等开发应用程序</x><x>使用哪个\
  \ IDE？[AUX]Visual Micro - 适用于 AtmelStudio 和 Visual Studio 的 Arduino 开发</x>`Visual\
  \ Micro` 是 `AtmelStudio` 和 `Visual Studio` 用于处理 Arduino 开发的插件。它处理 Arduino 程序的构建和上传，提供串口终端并支持串口调试。`AtmelStudio`\
  \ 和 `Visual Studio` 被降级为编辑器和项目管理器。适用于 `Visual Studio` 的 `Visual Micro` 与适用于 `AtmelStudio`\
  \ 的版本几乎完全相同，但下载包是分开的。请注意，有三个版本的 `Visual Micro`：适用于 `AtmelStudio` 的、适用于 `Visual Studio\
  \ 2019` 的以及适用于 `Visual Studio 2022` 的。然而，由于 `AtmelStudio` 基于 `Visual Studio 2019`，尽管这两个产品需要两个独立的下载，但你只需要一个许可证，因为\
  \ `AtmelStudio` 基于 `Visual Studio 2019`。\n\n\n\n\n\n*   Visual Micro 提供了一个串口监视器，它可以与板卡接口并启动程序。\n\
  *   编译并上传到微控制器 - 在使用 `AtmelStudio` 时，不需要提供外部工具即可将程序上传到微控制器（将代码上传到微控制器（创建外部工具） 第\
  \ 44 页）。\n*   Visual Micro 允许在没有专用硬件的情况下进行串口调试。串口调试提供了有限的断点功能、条件停止、查看数据值等功能。尽管存在局限性，但它提供了基于打印的调试不具备的功能，但其强大和通用性不如基于硬件的调试\
  \ (第 119 页)]。\n*   三个相同的 Arduino 插件：分别用于 AtmelStudio 和 Visual Studio (2019 和 2022)。据我所知，适用于\
  \ Visual Studio 的 Visual Micro 与 `AtmelStudio` 版本相同。请参阅适用于 Visual Studio 的 Visual\
  \ Micro（第 85 页）。\n\n关于价格的说明：单机爱好者的年度费用为 25 美元。下载后你将获得 45 天的试用期。请注意，可以使用同一个许可证将 Visual\
  \ Micro 安装到 `AtmelStudio` 和 `Visual Studio 2019` 中。但在 `Visual Studio 2022` 内部运行\
  \ Visual Micro 则需要不同的许可证。\n\n### 1. 适用于 AtmelStudio (MicrochipStudio) 的 Visual Micro\n\
  \n#### 顶层工具栏中的 AtmelStudio vMicro\n下载适用于 `Atmel Studio` 的 Visual Micro 非常简单。成功安装后，挑战在于如何运行\
  \ Arduino 程序。我打开了 `MemMgt AtmelStudio` 应用，编译/上传过程立即开始；并且正如 Visual Micro 控制台所示，它立即成功运行。太棒了！\n\
  \n我发现在使用 Visual Micro 使用 `AtmelStudio` 时与不使用它相比，有两个主要区别：\n\n*   单级目录结构 - 将 Arduino\
  \ 项目导入 `AtmelStudio` 的传统方法会生成双层目录结构，并创建一个包含 setup 和 loop 的 `Sketch.cpp` 文件；`.ino`\
  \ 文件会被忽略。当使用 Visual Micro 时，`AtmelStudio` 以单级目录结构工作。\n*   通过 Visual Micro 编译 - 现在编译\
  \ Arduino 应用通过 Visual Micro 菜单中的 `Build` 项完成。从 `AtmelStudio` 顶部工具栏菜单项 `Build` 进行编译会自动调用\
  \ Visual Micro 的 `Build`。\n\n成功将 Visual Micro 整合到 `AtmelStudio` 并测试后，下一步是在 `Visual\
  \ Studio` 中进行相同的操作（下一节）。\n\n### 2. 适用于 Visual Studio 的 Visual Micro\n\n#### 隐藏在顶层工具栏扩展中的\
  \ Visual Studio vMicro\n安装 `Visual Studio 2022` 并添加 Visual Micro 插件非常容易，毫不费力。但在打开\
  \ `Visual Studio 2022` 时，你不会立即发现 Visual Micro (`vMicro`)；你会在顶部 `Extensions` 菜单项中找到它，而不是像\
  \ `AtmelStudio` 那样作为顶级工具栏菜单项。但如果你仔细观察，会在第二个第二个工具栏中发现一个 `vMicro` 图标。我打开了两个 `vMicro`（Visual\
  \ Studio 的和 AtmelStudio 的），它们是完全相同的，只是 `Atmel Studio` 版本多了一行：`Configure Arduino\
  \ IDE location`。\n\n#### 从 Arduino IDE 偏好设置定义 Visual Studio 项目位置\n点击 `vMicro` 后，打开了一个面板，其中包含\
  \ `New Arduino Project` 和 `Open Existing Arduino Project` 等项目。这让我很放心；我创建了一个新项目，然后……`Visual\
  \ Studio` 把我的项目存到哪里了？`vMicro` 没有提供任何关于项目创建在何处的线索。在搜索之后，我发现项目被隐藏在 `C:\\users\\...`\
  \ 的某处。糟糕，我不希望它在那里。于是，我四处寻找并发现我可以在 `vMicro-->General-->Project and Solutions-->Locations-->Project\
  \ Location` 中更改项目位置。很好，我将项目位置设置为我希望 `Visual Micro Visual Studio` 所在的地方。重新创建 Arduino\
  \ 项目时，我发现我的新项目……仍在旧位置。为什么？在互联网上搜索后，我得到了一个清晰的答案：`Visual Studio` 中的 `vMicro` 它的文件设置位置来自\
  \ `Arduino` 而不是 `Visual Studio`。因此我打开了 `Arduino IDE`，转到 `Preferences-->Sketchbook\
  \ location` 并将其更改为我的目标目录。果不其然，成功了。我的项目确实创建在我想要的地方。\n\n从那时起，Visual Studio 的 `vMicro`\
  \ 就和 AtmelStudio 的 `vMicro` 一样了。\n\n#### Visual Micro 允许在没有专用硬件的情况下进行串口调试\n我尝试了基于串口的调试会，运行良好，除了这意味着漫长的学习曲线（参见串口调试第\
  \ 125 页）。\n\n### 1. VS Code\n\nVisual Studio Code（下简称 `VS Code`）是微软的编程基础平台。\n\n\
  IDE：`Arduino`, `AtmelStudio`, `Visual Studio`, `VS Code`, `PlatformIO`, `Visual\
  \ Micro`。\n\n使用哪个 IDE 工作？`VS Code` - 许多工具（包括 `PlatformIO`）创建的基础。`VS Code` - 许多工具（包括\
  \ `PlatformIO`）创建的基础。`VS Code` - 微软的编程基础。在初始状态下，除了像 `Notepad++` 一样编辑代码外可以用。若干扩展将其转换为可以编译、链接和上传的强大工具。\n\
  \n下载 `VS Code` 后的首要任务是理解它旨在通过扩展进行增强。你通过点击左侧工具栏中的扩展图标（底部的一个）会发现有大量的扩展，有些可能是小工具，另一些可能正是你需要的。搜索选项允许你搜索满足特定需求的扩展。\n\
  \n安装后，需要配置扩展（VS Code 第 91 页）。这一阶段非常重要，因为需要告诉扩展如何做以及做什么。\n\n我逐步地使用 `VS Code`。我开始将\
  \ `VS Code` 作为一个独立工具进行实验。在这个阶段它类似于 `Notepad++`。然后我逐渐添加扩展（`C++`, `Arduino`, `PlatformIO`）。\n\
  \n*   VS Code 独立版 - 了解 VS Code 能做什么对于以后区分 VS Code 功能与已安装扩展的功能很重要。参见 VS Code 扩展 (第\
  \ 91 页)part0017.xhtml_a8J5)。\n*   Arduino 认知 - 有很多 VS Code 扩展，其中微软的 [VS Code Arduino\
  \ 扩展 (第 93 页)part0017.xhtml_a8GB) 是之一。请注意，安装 Arduino 扩展也会安装 [VS Code C++ 扩展 (第 94\
  \ 页)part0017.xhtml_a8CX) 和 [VS Code 串口终端扩展 (第 95 页)part0017.xhtml_a8WT)。\n*   PlatformIO\
  \ 全功能 IDE - PlatformIO 团队做了巨大的工作，将 `VS Code` 扩展成为一个专业级的嵌入式系统 IDE ([PlatformIO 第\
  \ 98 页)。\n\n\n\n\n\n# VS Code 特性\n\nVS Code 开箱即用的功能并没有多少——充其量，它只是一个等同于 `Notepad++`\
  \ 的工具。然而，有成百上千的扩展可以将其转变为许多强大工具之一。它本质上具有无限的灵活性，因为这取决于扩展开发者如何将其作为其/她新突破性应用程序的基础。\n\
  \n*   **扩展可以安装/卸载以及启用/禁用**：数以千计的扩展扩展了 VS Code 的功能。它们可以直接在 VS Code 中进行安装/卸载以及启用/禁用，从而为它的功能带来了灵活性。\n\
  *   **通过 Git 仓库提供版本控制**：它通过 `Git` 仓库提供版本控制。由于我没有版本控制的需求，所以我没有尝试过。版本控制解决的是团队协作的需求，而不是个人工作。\n\
  *   **文件、文件夹、工作区用于项目管理**：`File`、文件夹、`workspace` 是项目管理的支持工具。\n*   **用户空间与工作区**：用户空间与工作区的设置允许通过\
  \ `user space` / `workspace` 概念将全局设置与特定项目设置区分开。用户空间指的是你可能在计算机上打开的任何 VS Code。工作区适用于特定的项目。工作区是一个文件夹（目录目录）或一组文件夹。这种区别意味着你可以在用户级别设置偏好，并将其应用于所有通过\
  \ VS Code 完成的工作，无论正在处理哪个文件夹。然后可以对单个工作区/项目进行自定义。\n*   **多语言：有 C++、Python、Perl 等扩展**：VS\
  \ Code 是多语言的——它可以识别 `C`、`C++`、`Python` 以及许多其他语言。它支持语法高亮、名称补全等功能，但还没有达到检查正确结构的程度。要做到这一点，你需要安装合适的扩展。\n\
  *   **文件查找/替换**：VS Code 作为微软的产品，支持传统的 `ctrl-F` 和 `ctrl-H` 查找/替换。\n*   **查找/替换支持正则表达式**：VS\
  \ Code 的查找/替换支持正则表达式（`regex`）。它看起来是标准正则，带有捕获功能，而不是 Word 版的通配符版本。\n\n## 1. VS Code\
  \ 安装\n\n安装 VS Code 非常简单。搜索 `Microsoft Visual Studio Code`；你将很快进入 Windows、Mac 和 Linux\
  \ 的下载页面。我选择了 Windows，点击下载，在大分钟左右后，我的电脑上就安装好了 VS Code。文件很小，小于 `500Kb`。\n\nWindows\
  \ 通常将程序安装在 `C:\\Program files`。不要在这个文件夹中寻找 VS Code 的安装，你将在以下位置找到 VS Code 的安装：\n\n\
  ```\nC:\\Users\\myself\\AppData\\Local\\Programs\\Microsoft VS Code\n```\n\n安装 VS\
  \ Code 后，在使用之前你需要配置几项目（见下一节）。\n\n当我尝试带有 `C++`、`Arduino` 和 `PlatformIO` 扩展的 VS Code\
  \ 时，遇到了很多问题，似乎某些项目已经默认定义并加载了。例如，在编译 `.cpp` 代码时，它会一直使用 `C:\\Strawberry` 中的 GNU 编译器，这是一个旧的\
  \ Perl 安装。因此，我删除了 `C:\\Users` 目录下的所有 `.vscode` 文件，尽管已经删除了 VS Code 及其扩展，那里仍有一百多个文件。似乎\
  \ Windows 在卸载 VS Code 时做得并不好。担心我的 `C:` 盘中还有更多 VS Code 文件，我又进行了一次 `.vscode` 搜索；花了一段时间。果其然，我在\
  \ `C:\\Strawbery Perl` 文件夹中找到了两个 VS Code 相关文件。我删除了它们。\n\n然后我重新安装了 VS Code 并搜索了 `.vscode`\
  \ 文件，认为这次我知道 VS Code 存储设置的位置了。打开时，我惊讶地发现它还记得我的 VScode 文件夹。它应该丢失这些信息的，因为我删除了所有的 `.vscode`\
  \ 文件。也许信息在注册表中；因此我打开了 `regedit` 进行检查。这是个坏主意，有很多可能会损坏 Windows 的复杂内容。\n\n我再次对 `C:\\\
  Users\\MySelf` 搜索了 `.vscode`；资源资源管理器找到了 40 个 VS Code 相关文件。它们大多数是系统文件，但确实发现了两个感兴趣的\
  \ `.vscode` 文件：\n\n*   `C:\\Users\\Myself\\.vscode` - 有一个 `argv.json` 文件，其中包含一个设置为\
  \ `true` 的启用崩溃报告，以及一个扩展文件夹，该文件夹包含一个空的 `extensions.json` 文件。\n*   `C:\\Users\\agir\\\
  AppData\\Local\\Programs\\Microsoft VS Code\\resources\\app\\extensions\\debug-auto-launch\\\
  .vscode` - 这个 `.vscode` 文件夹包含一个带有 `${workspaceFolder}` 变量的 `lauch.json` 文件。\n\n\
  问题仍然是：`${workspaceFolder}` 变量在哪里定义？这个变量似乎正是我要寻找的：VS Code 如何知道从哪个文件夹工作？到这里，我问了自己：`.json`\
  \ 文件是什么。正如我很快发现的，这些文件无处不在——它们是许多应用程序使用的数据文件 `.json` 文件。\n\n对于 VS Code 从哪里获取文件夹信息仍然不清楚，我搜索了\
  \ `C:\\Users\\MySelf` 中所有的 `.json` 文件。总共找到了 1767 个文件。我按目录对结果排序并搜索了 VS Code 相关文件。有很多\
  \ Adobe（我使用 InDesign）、Microsoft Edge、Office、Autodesk（我使用 Fusion 360）等。并且，我确实在\n\n\
  ```\nC:\\Users\\agir\\AppData\\Roaming\\arduino-ide\n```\n\n找到了一个 `config.json`\
  \ 文件，其中包含一个将 `${workspaceFolder}` 定义为我的目标 VS Code 工作目录。似乎这个 `.json` 文件是 Arduino\
  \ 相关的。\n\n从文件中删除了 `${workspaceFolder}` 定义后，我重新安装了 VS Code。没有运气，它仍然打开了我的 VSode 文件夹。到这一点，我决定放弃。我不知道\
  \ VS Code 是从哪里获取文件夹信息的。\n\nVS Code 的安装其他方面很简单，除了通用外观，我无法通过齿轮图标（管理）进行自定义。\n\n## 2.\
  \ VS Code 导航\n\n安装好 VS Code 并加载文件后，开始尝试。打开不同的菜单项并尝试它们；缓慢但确实地，你会熟悉 VS code。由于 VS\
  \ Code 的许多功能基于快捷键，打开快捷键窗口（`ctrl-P` - 转到文本框）。你也可以通过 `ctrl-K ctrl-R` 获取可打印命令列表，通过\
  \ `ctrl-K ctrl-S` 获取交互式字母列表。\n\n如果你要使用 VS Code，有两个命令你应该刻在脑子里：`ctrl-P`（在当前文件夹打开文件）和\
  \ `ctrl+shft+P`（打开充满自解释命令的文本框）。许多可用命令将让你意识到 VS Code 不仅仅是一个程序员编辑器。\n\n## 3. VS Code\
  \ 配置\n\n### 用户界面外观\n\n外观很重要。窗口颜色、字体大小以及工具栏的位置和内容应该让你感到舒适。\n\n下载 VS Code 后，我面对的是黑屏幕、白色的大字体，这似乎是默认的\
  \ VS Code 外观。此外，在编辑文件时，字体大小太大了。我更喜欢 AtmelStudio/Visual Studio 的默认外观。\n\n首要任务是处理\
  \ VS Code 的通用外观；它由主题定义；通过管理--主题（Themes）按钮有预设选择。我选择了浅色 (Visual Studio)。我更喜欢浅色背景上的深色文字，而不是默认的深色背景上的浅色文字。\n\
  \n\n\n\n\n# 还有字体大小的问题，因为默认的视觉界面字体太太大了。你可以通过选择 `Settings`（设置）并在顶部水平搜索栏中输入 `Font Size`（字体大小）来更改字体。`VS\
  \ Code` 会缩小范围，让你专注于字体。你可以在这里更改；但必须在三个位置进行：`User`（用户）、`Workspace`（工作空间）和 `Folder`（文件夹）；这就是我的做法（VS\
  \ Code - 文件夹与项目第 91 页) 和 VS Code 功能第 87 页）。问题在于，这样做确实改变了编辑器的字体，但 `VS code` 用户界面的字体保持不变。\n\
  \n在花费了一个多小时尝试自定义 `VS Code` 环境后，我去向 `ChatGPT` 寻求帮助：我问它如何操作；它回答自定义 `settings.json`\
  \ 文件。但在 `VS Code` 内部这是是不行的，因为它认为该文件是只读的（如果你使用 `notepad`，它是可读写的）。我告诉 `ChatGPT` 我无法修改\
  \ `settings.json` 文件，因为它是只读的，它回复说：\n\n如果你无法编辑 `settings.json` 文件是因为它是只读的，你可能需要额外的步骤来修改它。你可以这样做：\n\
  \n1. 打开 `VS Code` 并进入 \"File\"（文件）菜单。\n2. 选择 \"Open Folder\"打开文件夹）并导航到项目所在的文件夹。\n\
  3. 在文件夹上点击右键并选择 \"Open in Terminal\"在终端中打开）（在 Windows 上是 \"Open in Command Prompt\"\
  在命令提示符中打开）。\n4. 在终端中输入命令 `code --data-dir=\".\"`这将启动带有特定项目数据目录的 `VS Code`。\n5. 进入\
  \ \"File\" 菜单并选择 \"Preferences\"首选项）> \"Settings\"设置）。这将会打开。\n\n我尝试重新生成 `ChatGPT`\
  \ 的回复，因为它没有完成，没有成功。它一直试图让我修改只读的 `settings.json` 文件。于是我尝试了上述 `ChatGPT` 的建议，成功了。问题是更改不是永久的。通过桌面图标重新打开\
  \ `VS Code`，我回到了旧配置：字体大小 14。`ChatGPT` 没有那么聪明。事实上，命令\n\n```\ncode --data-dir=\".\\\
  vscode\"\n```\n\n确实是在：启动 `VS Code`（其执行文件名为 `code`）从 DOS 框（`cmd.exe`）带有 `user-data-dir`\
  \ 选项。所以，而不是打开 `VS Code` 并通过 `ChatGPT` 建议的复杂过程，我使用上述命令创建了一个批处理文件并放在 `VS Code` 项目目录下。它说：使用\
  \ `.vscode` 目录的数据启动 `VS Code`（这里意味着）。从以后，不要从任务栏图标启动 `vs code`；点击你创建的批处理文件启动。\n\n\
  这样做有一个副作用。`code --data-dir` 命令在 `.vscode` 子目录中创建了许多目录和文件，跨越 85 个文件夹，441 个文件。磁盘空间不是问题，我的是的是。问题是这\
  \ 129MB 会被备份到 USB 盘上，绝对不可接受——花费了太长时间。肯定有办法避免这一点。\n\n于是，我在 `C:\\users` 目录中搜索等效文件。确实有\
  \ `C:\\User\\Myself\\.vscode`。我修改了我的批处理文件为：\n\n```\ncode --user-data-dir=\"C:\\\
  Users\\Myself\\.vscode\"\n```\n\n我删除了项目目录中的 129MB 并启动了位于项目目录的批处理文件；成功了。129MB 被创建在\
  \ `C:\\Users\\agir\\.vscode`，因为我没有备份我的 `C:` 盘。\n\n我重新安装了 `VS Code` 以获得干净的开始（你应该先卸载扩展）以看到定义在哪里。我的项目目录下的\
  \ `.vscode` 子目录仍然为空——没有 `.json` 文件；它们现在分布多个 `C:\\Users\\` 子目录下。\n\n我在 `C:\\Users\\\
  Myself\\AppData\\Roaming\\Code\\User` 找到了 `settings.json` 文件。它包含了我选择的 Visual Studio\
  \ 主题，但没有字体信息。我仍然处于困境，从桌面图标打开的 `VS Code` 字体很大；从批处理文件打开的 `VS Code` 字体很小。它们使用相同的 Visual\
  \ Studio（浅色）主题。检查 `VS Code` 启动图标的属性，我发现它只是调用了没有参数的 `code.exe`。如果你在 DOS 框内输入 `code`，你会发现\
  \ `VS Code` 的打开方式就像你从图标调用它一样。理想的解决方案是桌面图标应该以小字体打开。我尝试向 `VS Code` 启动图标添加 `--use-data-dir`\
  \ 参数；我没有成功。某处一定有一个配置文件可以修改。从设置菜单这样做不起起的。\n\n下一步是对 `.json` 文件进行搜索。在 `C:\\users` 中查找所有\
  \ `.json` 文件是不现实的——它们太多了（2000+）。我再次开始将搜索限制在 `C:\\Users\\Myself\\.vscode`；我得到了 342\
  \ 个文件，是可以处理的。我看了 `settings.json` 和其他 `.json` 文件，没有结果；没有一个提供了字体大小设置。\n\n上述 `--use-data-dir`\
  \ 解决方案是一个权宜之计，但我找到了让 `VS Code` 界面符合我喜好的唯一方法。\n\n## 1. VS Code - 文件夹与项目\n\n### VS\
  \ Code 不支持\n我发现 `VS Code` 不支持项目。如果你查找 PlatformIO (第 98 页)，你会发现它确实提到了项目。如果你决定按照 PlatformIO\
  \ 建议的方式工作，你会感到沮丧。在 AtmelStudio 或 Visual Studio 中执行打开项目是直接的；在 PlatformIO 中，打开项目需要从\
  \ Scode 文件夹内部导航到目标目录并选择它。这是最反直觉的，但这可能是像 VS Code 这样高度可定制的工具所付出的代价。\n\n## 2. VS Code\
  \ 扩展\n如上述介绍部分所示，`VS Code` 需要扩展才能变得有用。否则它就是一个像 Notepad++ 一样的编辑器。点击扩展图标（`VS Code`\
  \ 左侧栏底部的类似齿轮图标），会打开一个显示已安装扩展的面板。一个带有“在市场中搜索扩展”灰色文字的水平文本框用于通过输入你要查找的内容来搜索扩展。从那时起，你会得到很多选择，取决于你安装和测试哪些。扩展被安装并启用。你可以随时禁用某个扩展，使其失效。你甚至可以卸载它。\n\
  \n在安装扩展后，你应该：\n- RTM（阅读说明书），即阅读关于如何操作让扩展工作的信息。\n- 按照上述方法点击齿轮图标打开扩展设置；尽办法让扩展开始工作。\n\
  - 关闭并重新打开 VS Code 使更改生效。\n\n\n\n\n\n在 Arduino C++ 编程的背景下，我安装了以下扩展：\n\n*   `C++ editing`\
  \ - 这是进行 C++ 工作最基础的扩展。它将 VS Code 增强为一个智能的 C++ 编辑器。请注意，如果你安装了 Arduino 扩展，则无需安装 C++\
  \ 扩展，因为 Arduino 扩展会自动安装。参阅 VS Code C++ 扩展 (第 94 页)。\n\n*   `Arduino extension` 会安装\
  \ `C++ extension` 和 `Serial monitor extension`。参阅 VS Code Arduino 扩展 (第 93 页)、VS\
  \ Code C++ 扩展 (第 94 页) 以及 VS Code serial terminal 扩展 (第 95 页)。\n\n*   `PlatformIO`\
  \ - `PlatformIO extension` 将 VS Code 转换为一个强大的嵌入式开发 IDE（Arduino, ESP32...），可以与 AtmelStudio\
  \ 和 Visual Studio 媲美。请注意，它也会安装 VS Code C++ 扩展 (第 94 页)。参阅 VS Code PlatformIO 扩展\
  \ (第 95 页)。\n\n*   `Awk` - 有许多 Awk 扩展。我安装了 Awk IDE 版本来查看它能为我做什么；结果令人鼓舞，但我没有进一步探索，因为我很久以前就决定用\
  \ Perl 替换 Awk。参阅 VS Code Awk 扩展 (第 96 页)。\n\n*   `Perl` - 有非常多的 Perl 扩展。选择哪一个是一个两难境地，因为我的迫切需求是一个语法敏感的\
  \ Perl 编辑器，但我最终决定决定一个。参阅 VS Code Perl 扩展 (第 96 页)。\n\n*   `Regular expressions (regex)`\
  \ - VS Code 通过其查找/替换功能（传统的微软 `ctrl-F` 和 `ctrl-H`）支持正则表达式；因此，在编辑代码时不需要特定的正则扩展。某些扩展作者将他们的扩展命名为\
  \ regex something，另一些则命名为 regular expressions something。由于 VS Code 的搜索功能并不“智能”，我分别对\
  \ `regex`（521 个扩展）和 `regular expressions`（123 个扩展）进行了搜索；这意味着共有 644 个扩展需要根据需要查看、选择和测试。安装哪一个是一项艰巨的任务。参阅\
  \ VS Code 正则表达式 (regex) 扩展 (第 96 页)。\n\n市场中心网站 ([`marketplace.visualstudio.com/vscode`](https://marketplace.visualstudio.com/vscode))\
  \ 是 VS Code 扩展的另一个来源。你可以在那里找到与 VS Code 内部访问相同的扩展，但呈现方式更符合用户习惯；而且导航速度更快。\n\n顺便提一下，请注意几乎所有的编程语言都有\
  \ VS Code 扩展，特别是 Python。\n\n### Arduino CLI\n\n`arduino-cli` 正顾如其名：通过命令行界面进行 Arduino\
  \ 开发。任何用户界面都可能使用它来管理 Arduino 源代码，从编译到上传到微处理器。它是 Arduino IDE 在后台使用的工具，用以实现我们在开发 Arduino\
  \ 程序时要求它执行的操作。由于几乎所有的 Arduino 工作都是通过许多 IDE 之一完成的（无论是 Arduino 的还是 AtmelStudio 的），因此从先来看并没有必要花时间在\
  \ `Arduino CLI` 上。但 VS Code Arduino 扩展需要它。因此，我下载并安装了它。\n\n如果你在 Google 上搜索 Arduino\
  \ CLI，你会得到大部分 GitHub 的响应。下载地址是：\n\n[`arduino.github.io/arduino-cli/0.31/installation/#download`](https://arduino.github.io/arduino-cli/0.31/installation/#download)\n\
  \n完成后，将 zip 文件解压到一个新位置（与 VS Code 安装位置相同）\n\n`C:\\Users\\agir\\AppData\\Local\\Programs\\\
  Arduino-cli`\n\n然后你需要定义一个新的 `PATH` 环境变量，以便从任何地方访问它。操作方法：进入 Windows 设置；搜索“系统变量”，打开底部的“环境变量”按钮，在用户区域（上方框）中选择\
  \ `PATH`，点击新建并添加上面的完整文件路径。\n\n通过打开 DOS 窗口并输入 `arduino-cli` 来检查你的 `arduino-cli` 命令是否可以在任何地方运行。你应该会大量的输出，告知你不同的\
  \ `arduino-cli` 选项是什么。\n\n在下载并成功安装 Arduino-cli 后，我执行了：\n\n```\nArduino-cli help\
  \ > ArduinoCLIhelp.txt\n```\n\n此命令将输出重定向到记事本兼容的文本文件中。它包含了所有的命令行选项。然后你可以执行：\n\n```\n\
  Arduino-cli help compile > ArduinoCLIcompile.txt\n```\n\n来获取特定命令的帮助。此时，我开始意识到 Arduino\
  \ CLI 是有多强大。\n\n### VS Code Arduino 扩展\n\nArduino 扩展提供了在 VS Code 内进行 Arduino 开发的界面。任何用户界面都可能使用它来管理\
  \ Arduino 源代码，从编译到上传到微处理器。它是 Arduino IDE 在后台使用的工具，用以实现我们在开发 Arduino 程序时要求它执行的操作。由于几乎所有的\
  \ Arduino 工作都是通过许多 IDE 之一完成的（无论是 Arduino 的还是 AtmelStudio 的），因此从先来看并没有必要花时间在 `Arduino\
  \ CLI` 上。但 VS Code Arduino 扩展需要它。因此，我下载并安装了它。\n\n打开 Arduino 扩展后，它首先显示需要旧版 IDE 或\
  \ Arduino CLI。推荐的方法是使用扩展自带的版本。旧版 IDE 支持将在未来版本中移除。\n\n安装 Arduino-cli 后，我在没有 Arduino\
  \ CLI 的情况下使用了 Arduino 扩展；即使用 Arduino V2。我将省去细节；请注意，安装 VS Code Arduino 扩展还会安装 C++\
  \ （第 94 页) 和 serial monitor 扩展（第 95 页)。\n\n似乎在编辑文件时报告的 Arduino.h 找不到是 VS Code C++\
  \ 扩展的配置问题。我尝试修复这个问题，但被一组很长的设置困扰，其中两个是 `cpp > Default: Include path` 或 `cpp > Default:\
  \ Compiler path`，我将后者设置为 `C:/Program files (x86)/Arduino`。这样做解决了问题，VS Code C++ 扩展确实识别了\
  \ Arduino.h 包含。\n\n在这个阶段，问题是：在哪里定义 Arduino 分发路径？\n\n我决定放弃定义包含路径，尝试使用 VS Code Arduino\
  \ 扩展。执行 `ctrl-shft-P` 会调出一个命令列表，其中之一是 `Arduino-CLI: Verify`。该命令编译活动文件夹中的文件，在我的例子中只有一个文件\
  \ `Simple.ino`。令我惊讶的是，它成功编译了 `.ino` 文件并找到了 Arduino.h 文件。似乎在编辑文件时报告的 Arduino.h 找不到是\
  \ VS Code C++ 扩展的配置问题。\n\n\n\n\nVS Code 工作区底部显示了一个工具栏，其中包含 ISP、Board 和 Comport 设置。我选择了\
  \ `ArduinoISP`。我执行 `ctrl-shft-P` 并选择了 `ArduinoCLI:Upload`。成功了，它将我的程序上传到了板卡上。\n\n\
  我回到顶部菜单栏，选择 `Terminal`-->`New`，从那里成功启动了我的程序——成功。\n\n但仍然有一个奇怪的问题：执行 `ArduinoCLI:Verify`\
  \ 时，我收到了这条消息\n\n```\n[Warning] Output path is not specified. Unable to reuse previously\
  \ compiled files. Build will be slower. See README.\n```\n\n这条信息的意思实际上是 `make` 没有起作用；所有内容都会重新编译。至于\
  \ README，我没找到它。此时，我决定停止对 VS Code Arduino 扩展的研究，因为还有大量工作要做来解决各种错误。VS Code Arduino\
  \ 扩展的练习展示了 VS Code 多么强大；然而，我的经验表明，它并不值得用来替代 Arduino IDE、Atmel Studio、Visual Studio\
  \ 或可能的 PlatformIO。\n\n但我确实学到了一个重要的教训：扩展程序几乎所有的工作都是通过 `ctrl-shft-P` 项目完成的。如果你尝试从顶部工具栏直接“不带调试运行”，它允许你这样做；但你会遇到一系列警告/错误，让你一无所获。我尝试过这样做；这非常耗费时间；我就不详述细节了。\n\
  \n### 1. VS Code C++ 扩展\n\nMicrosoft VS Code C++ 扩展将 VS Code 变为一个智能 C++ 程序员的编辑器。它可以进行名称补全、标记未声明的对象，并检测糟糕的结构（例如极其错误的\
  \ `for` 语句）。如果你输入\n\n```\nfor i = 0 i < 20; i++ ) a++}\n```\n\n它会检测到缺失的括号、缺失的分号、未定义的变量以及缺失的大括号。所有这些都会通过红色波浪线标记。悬停在其中一个错误上时，会弹出一个小窗口建议如何修复问题。VS\
  \ Code C++ 还能做更多，只需点击右键，就会弹出一个详细的弹出窗口。哦，我应该提到，它的查找/替换支持正则表达式（`regex`）。\n\n在打开我的\
  \ `Simple.ino` 文件时，VS Code C++ 扩展触发了 `Arduino.h` 包含文件的未找到错误。这阻止了所有的错误检测。当然，我可以将其注释掉，但那样就会触发\
  \ `Serial` 和其他系统变量的未定义变量错误。解决方案是将 C++ 扩展设置 `cpp > Default: Compiler path` 设置为 `C:/Program\
  \ files (x86)/Arduino`。文件未找到的问题解决了，C++ 扩展证明是一个智能的 C++ 编辑器。\n\n### 2. VS Code 串口终端扩展\n\
  \n这是 VS Code 串口终端扩展的演示窗口中所说的：\n\nSerial Monitor 扩展提供了一个串口监视器，用于查看输出以及向串口发送消息。这在对嵌入式设备进行测试或调试程序时非常有用。\n\
  \n它将 Arduino IDE 的底部面板与 IDE 的串口监视器相结合。它有五个标签页：\n\n*   `Output` 是 `Serial.prints`\
  \ 输出向的地方。\n*   `Terminal` - 这是一个 DOS 框。你可以输入任何命令，无需单独打开 DOS 框。\n*   `Serial terminal`\
  \ - 此标签页显示编译器消息和其他消息。它等同于 Arduino IDE 的底部面板。\n*   `Debug console` - 在调试代码时激活。我还没有尝试过它。\n\
  *   `Problems` - 我没有发现这个面板有任何用途。\n\n总之，VS Code 串口终端扩展为 VS Code Arduino 扩展提供了它所需的界面，以便查看工具和应用程序正在运行。\n\
  \n### 3. VS Code PlatformIO 扩展\n\nVS Code PlatformIO 扩展将 VS Code 变为用于嵌入式开发的 C++\
  \ IDE（Arduino, ESP32...）。参见 PlatformIO (第 98 页)。\n\n在测试了 VS Code Arduino 扩展后，我删除了它，删除了\
  \ C++ 和串口视器扩展，并在干净的 VS Code（未安装任何扩展）中安装了 VS Code PlatformIO 扩展。不需要去 PlatformIO 网站操作。\n\
  \nVS Code PlatformIO 扩展的安装很快，最多只需几分钟。安装过程也安装了 VS Code C++ 扩展，但它没有安装串口终端扩展，因为它有自己的。事实证明在卸载\
  \ Arduino/C++/串口终端扩展后，某个设置遗留下了，因为在安装 PlatformIO 扩展后，重新安装的 C++ 扩展其编译器路径仍然设置为 Arduino\
  \ 目录。\n\n冒着重复的风险，如果你要在 VS Code 中使用 PlatformIO，至关重要的是你必须理解你正处于双环境中工作：VS Code 本身和\
  \ PlatformIO 扩展。在使用 VS Code 及其扩展时的问题之一在于理解谁在做什么。这可能会导致一些混乱。我建议在禁用所有扩展的情况下探索 VS Code（它们可以在下载后被禁用/启用）。在掌握了关于\
  \ VS Code (第 86 页) 的良好知识后，安装 PlatformIO 扩展并探索它能为你做什么。\n\n与 Arduino 扩展不同（后者通过 `ctrl-shft-P`\
  \ 访问任务），PlatformIO 在左侧工具栏中创建了一个快捷方式。你会发现一个新图标，PlatformIO 的小虫子图标。点击它会打开第二个左侧工具栏的任务列表。这些都是\
  \ PlatformIO 特有的。你将找到一个专门介绍 PlatformIO (第 98 页) 的完整章节，其中涵盖了如何使用 PlatformIO 扩展。\n\
  \n### 4. VS Code Awk 扩展\n\n大多数 Awk 扩展都指向一个我完全陌生的 Awk 服务器。有一些 Awk 语法高亮扩展；它们可能有用。我决定放弃安装任何\
  \ Awk 扩展，因为我很早决定改用 Perl。\n\n### 5. VS Code Perl 扩展\n\n我数了 89 个 Perl 扩展；我应该安装哪一个？做什么？最后我安装了\
  \ bscan 的 Perl Navigator。它可以进行语法检查等更多功能，评价很高且很新（2023 年 5 月）。我从 C++ 源文件中加载了 Perl\
  \ 文档。它指出了一些值得审查的问题，我将在完成我的两本 C++ 书后进行。\n\n### 6. VS Code 正则表达式（regex）扩展\n\n我安装了两个扩展来创建函数列表。我在\
  \ `类和函数名引用框架 (第 176 页)` 中需要这个列表。目标是创建一个包含 `.h` 文件定义函数的文件，假设 `.cpp` 文件中没有不在 `.h`\
  \ 中声明的函数。`Misdoings.pl` Perl 程序将使用该函数的内容来搜索不当函数用法。\n\n### 7. .json 文件\n\n我尝试了独立的\
  \ VS Code、带有 C++ 扩展以及带有 Arduino 扩展。在此过程中，我在 ArduinoDev 主项目目录下发现了一个 `.vscode` 子文件夹，其中包含四个\
  \ `.json` 文件。\n\n但在继续之前，关于 `.json` 文件有一点说明。\n\n.json 文件是文本文件，其中数据以键值对的形式组织，并封装在大括号的组中，每个组都可以有一个名称；例如：\n\
  \n```json\nContact = {\n  \"firstName\": \"Sasha\",\n  \"lastName\": \"Orgalov\"\
  ,\n  ...\n  \"Address\": {\n    \"street\": \"Main st.\",\n    ...\n  }\n}\n```\n\
  \n\n\n在上方，名为 `Contact` 的组在大括号内封装了其数据。它包含一个名为 `Address` 的组。要从支持 `.json` 的程序中访问项，你可以执行\
  \ `Contact.firstName` 或 `Contact.Address.street`。注意，我组名使用首字母大写，组项首字母小写；这种选择是基于我个人的命名规范。\n\
  \n现在，这里是我 `ArduinoDev` 项目目录下的 `.vscode` 子文件夹中的四个 `.json` 文件：\n\n*   `arduino.json`\
  \ 可能是由 Arduino 扩展创建的。它包含 `board`、`comm port` 以及其他配置信息。\n*   `tasks.json` 可能也是由 Arduino\
  \ 扩展创建的。它包含一个编译器路径，与 `arduino.json` 文件中的路径不同。\n*   `c_cpp_properties.json` 是在从 Arduino\
  \ 扩展成功执行 `ArduinoCLI: Upload` 后创建的。它包含了编译器路径、包含路径以及其他特定构建的信息。\n*   `launch.json`\
  \ 包含一个指向网页的链接，该网页详细介绍了如何定义 VS Code 启动配置。\n    [VS Code 启动配置](https://code.visualstudio.com/docs/editor/debugging#_launch-configurations)\n\
  \n我决定放弃研究各种可能性（这又是一个陡峭的学习曲线）。\n\n### 1. VS Code 注意事项\n\nVS Code 确实表现出了一些烦人的问题。\n\
  \n*   `<无法从活动文件夹列表中删除文件夹>`无法从活动文件夹删除文件夹 - 我在名为 `ArduinoDev` 的文件夹中进行所有的 Arduino 工作。在实验过程中某个时刻，我通过\
  \ `File-->Open folder` 菜单项打开了这个文件夹。这样做之后，我发现没有简单的方法可以从文件夹列表中删除它。但有一个方法：选择该文件夹，然后执行菜单\
  \ `File-->Close folder`；这可以生效。有一个快捷键 (`ctrl-K F`)；我试过了，但没用。\n*   `<VS Code 不支持项目内容/磁盘内容的概念>`删除文件夹会将其从磁盘删除\
  \ - VS Code 不支持像 `AtmelStudio` 那样的项目内容/磁盘内容概念。在文件夹名称上右键确实提供了删除选项；但这不好，因为它会从磁盘中删除。要从\
  \ VS Code 工作空间中移除文件夹，你应该像上面提到的那样调用 `File-->Close folder` 菜单项。\n*   `<Arduino-cli\
  \ 安装失败>` VS Code Arduino 扩展 (第 93 页) - 尽管扩展说 `Arduino-cli` 是嵌入的，但 `Arduino-cli`\
  \ 仍然安装失败。\n\n### 2. PlatformIO\n\nPlatformIO\n\n当我第一次知道 `PlatformIO` 的存在时，我访问了 [`platformio.org`](https://platformio.org)\
  \ 网站获取关于 `<PlatformIO (通用)[AUX]IDE: Arduino, AtmelStudio, Visual Studio, VS Code,\
  \ PlatformIO, Visual Micro><使用哪个 IDE？AUX]PlatformIO - 免费、专业级、易于导入 Arduino 项目><PlatformIO\
  \ (通用)[AUX]IDE 支持跨平台、跨架构、多框架>` 的信息。\n\n\n\nPlatformIO 的主页有一个巨大的橙色 Bug 表情符号正盯着你看，仿佛在说：有胆就来。页面右侧有几个按钮，其中一个是“导入\
  \ Arduino 项目”（Import Arduino Project），正下方是一个新闻窗口，你可以水平滚动查看，其中包含几条 Web 新闻以及访问 PlatformIO\
  \ 网站的链接。在下方，肉眼不可见但你可以调调出来的是 PlatformIO 项目列表。言尽在此，你就能明白这是一个拥挤且繁忙的界面，意味着它具有显著的学习曲线。\n\
  \n在经过一番搜索后，我成功运行了一个应用程序并在内置的串口监视器中实现了输出可视化。它会进行一些语法检查，具体程度我还需要进一步确定。\n\n此时，我并没有意识到\
  \ PlatformIO 安装时会自动安装 VS Code C++ 扩展（参阅 VS Code 扩展页面第 91 页）。你在 PlatformIO 内部编辑 C++\
  \ 代码时，执行工作的是 C++ 扩展，而不是 PlatformIO。\n\nPlatformIO 使用与 Arduino IDE 和 AtmelStudio\
  \ 相同的工具链（GNU 编译器、链接器、`avrdude`），并支持硬件级调试，这一点稍后会详细介绍，因为它受限于某些限制。\n\n我带着两个目标对 PlatformIO\
  \ 进行了全面测试：(1) 学习足够它的知识以描述这种体验；(2) 可能将其作为我主要的 Arduino 开发工具，取代 AtmelStudio 或 Visual\
  \ Studio (Visual Micro) (第 82 页)。结果是我的心情复杂。PlatformIO 几乎可以完成 Visual Studio 和 AtmelStudio\
  \ 能做的所有我最看重的功能：代码补全、输入时的代码检查、快速访问功能。然而，它的界面太杂乱了，我更喜欢 AtmelStudio 的界面；而且考虑到我的需求，它的学习曲线太高了。\n\
  \n在后续页面中，你将找到更多关于 PlatformIO 的详细信息，结构如下：\n\n*   PlatformIO 安装 (第 100 页 - 如果你对 PlatformIO\
  \ 一无所知，并发现它可能是 Arduino 开发中非常值得研究的替代方案，你将前往 PlatformIO 网站（`https://platformio.org`(https://platformio.org)）并进行下载。你不应该直接这样做，因为你无法完全意识到意识到\
  \ PlatformIO 是一个基于基础工具（VS Code 或 CLion）的插件是多么重要。\n\n*   PlatformIO 特性 (第 101 页 -\
  \ 本节总结了 PlatformIO 能为你做什么。\n\n*   PlatformIO 项目管理 (第 102 页 - 理解 PlatformIO 项目就是一个\
  \ VS Code 文件夹至关重要。\n\n*   PlatformIO 创建项目 (第 103 页 是非常简单的。如果你选择了一个 Arduino 板子，它会创建一个\
  \ Arduino 骨架项目，并在构建时使用 Arduino 的分发版。\n\n*   PlatformIO 项目配置 (platformio.ini) (第\
  \ 106 页 定义在 `platformio.ini` 文件中。这是一个位于 PlatformIO 项目根目录的数据文件。\n\n*   PlatformIO\
  \ 互操作性 (第 107 页 与 Arduino IDE 和 AtmelStudio 的互操作是可行且简单的，尽管存在一些限制。\n\n*   PlatformIO\
  \ 硬件级调试 (第 108 页 - PlatformIO 开始支持对 Atmel 微控制器（Arduino 8 位板子）进行硬件级调试。在编写时（2023 年\
  \ 5 月），它需要特定的硬件，即 Arduino Nano 33 或 Arduino MKR 系列板子以及调试适配器。目前不支持串口调试 (第 125 页 或使用\
  \ Microchip Xplained 板进行调试（参阅 硬件级调试 第 119 页）。\n\n*   PlatformIO 文档很好，易于获取，并且有很多教程。参阅\
  \ 参考文献 - PlatformIO (第 336 页。\n\n*   PlatformIO 的坑与注意事项 (第 109 页 - 本节描述我遇到的问题；你可以称它们为坑、注意事项、陷阱或缺陷。\n\
  \n总之，PlatformIO 是一个强大的工具，值得考虑作为替代方案，尤其是考虑到 PlatformIO 正开始为 AVR Arduino 板子提供硬件级调试。\n\
  \n我远不是使用 PlatformIO 的专家。这些页面浓缩了我学到的内容。尽管有学习曲线，它可能是我未来的开发选择。\n\n## PlatformIO 安装\n\
  \n我的建议是遵循以下三个阶段：\n\n*   下载 VS Code 并熟悉它。\n*   安装 VS Code C++ 扩展。\n*   安装 PlatformIO\
  \ 扩展。\n\n按照上述步骤安装 PlatformIO 将帮助你理解它到底是什么。\n\n# PlatformIO 特性\n\nPlatformIO 作为专业人士的嵌入式系统开发工具，功能丰富。从非专业开发者的角度来看，它的主要特性总结如下：\n\
  \n*   强大的开发工具：我所说的强大是指它可以完成许多 Arduino IDE 做不到。使用 PlatformIO 代替 Arduino IDE 将提高效率并使应用程序更健壮。\n\
  *   多平台、多微控制器：如果你想为 Arduino 和 ESP32 以外的微控制器开发应用程序，务必考虑使用 PlatformIO。\n*   兼容项目结构：我对\
  \ Arduino 项目的最简单定义是它有一个主入口 C++ 文件，扩展名为 `.ino` 而不是 `.cpp`，其中包含两个函数（setup 和 loop）。记住所有\
  \ C/C++ 程序都从 main 函数开始。Arduino 环境在构建时会在后台提供该函数；main 调用由程序员提供的 setup 和 loop。\n\n\
  PlatformIO 遵循 Arduino 项目结构，通过创建一个包含空 `setup` 和 `loop` 函数的 `main.cpp` 文件；由程序员将 Arduino\
  \ `.ino` 文件的内容转移到 `main.cpp` 中。注意 PlatformIO 会忽略 `.ino` 文件。另外注意，项目源文件位于由 `[platformio]`\
  \ `src_dir` 变量定义的子目录。默认位置是名为 `src` 的子目录，你可以更改它。\n\n\n\n\n# 将 PlatformIO 作为 VS Code\
  \ 插件\n\nPlatformIO 并不是像 Arduino IDE 或其他 IDE 那样的独立程序。它是 VS Code（我将介绍的这个）、CLion 以及其他工具之上的插件。了解各自的职责对于高效地使用\
  \ PlatformIO 至关重要。\n\n## 核心特性\n\n- **基于硬件的调试** - PlatformIO 为 `ESP32` 和 Arduino\
  \ 板板提供了基于硬件的调试（参见 PlatformIO 硬件调试 第 108 页）。\n- **Lint 检查工具** - 此功能可能价值连城。静态分析可以检测可疑的赋值、可能错误的指针、未初始变量、未使用的变量和函数以及其他潜在的缺陷。我在我的程序上测试了它。诚如所料，它确实揭示了一些需要清理的项目。但它没有检测出我最喜欢的一种重复性错误，例如在\
  \ `if` 语句中使用 `=` 符号而不是比较操作符 `==`。这就是为什么我创建了一个 Perl 程序来检测这些和其他难以发现的缺陷（参见 错误操作 第 117\
  \ 页）。我应该补充一点，可以通过插件外部 lint 工具来改进 PlatformIO 的 lint 检查。\n- **项目库** - 将所有库位于中央 Arduino\
  \ 库目录中是 Arduino 团队简化的一种策略，这使得 Arduino 在小型应用中非常成功。随着应用程序变得越来越，可能需要在多个平台上运行，因此需要同一库的不同变。PlatformIO\
  \ 完全支持项目特定的库配置；而 Arduino IDE 不支持。对于 `AtmelStudio` 和 `Visual Studio`，可能实现这一点；我无法确定。\n\
  - **配置管理** - 多程序员的专业环境要求源文件必须检出和提交，以确保没有两个程序员在不知道对方操作的情况下修改同一个文件。我们将其称为配置管理。PlatformIO\
  \ 将其称为持续集成。可以将多种工具中的集成到 PlatformIO 中以完成这些任务。\n\n## PlatformIO 管理项目\n\n### 项目管理与\
  \ VS Code 文件夹\n\n大多数 IDE 项目管理（创建、关闭、打开项目）都是直观的。Arduino IDE 有这些功能的菜单项：`New sketch`（新建\
  \ Sketch）、`Open recent`（打开最近）、`Close`（关闭）。`AtmelStudio` 有 `New`（新建）、`Recent projects\
  \ and solutions`（最近项目和解决方案）、`Close`（关闭）。PlatformIO 则不同，因为它具有双重属性。PlatformIO 是 `VS\
  \ Code` 之上的层。PlatformIO 指项目；`VS Code` 指文件夹。这可能是产生混乱的地方。\n\n### 操作\n\n在最初使用 PlatformIO\
  \ 时，你创建了一个项目；假设它是下方 PlatformIO 创建项目部分描述的 `Simple` 项目。创建项目后，你想转向更有实质性的工作，并希望从 PlatformIO\
  \ 工作区中移除 `Simple` 项目。你可以通过点击左侧工具栏顶部的图标来查看已打开的项目，这是资源管理器（Explorer）。你找到了你的 `Simple`\
  \ 项目。如果你右键点击 `Simple` 行，会弹出一个包含几项内容的窗口，但它没有提供从工作区中移除项目的选项。这就是我不得不求助于 `VS Code` 的“啊哈！”时刻。要从\
  \ PlatformIO 工作区移除项目，点击 `File`（顶部菜单栏）并选择 `Close folder`（关闭文件夹，这是 VS Code 的功能）。要打开项目，点击\
  \ `Explorer`（左侧工具栏顶部的图标）并点击 `Open folder`（打开文件夹，这是 PlatformIO 的功能）。\n\n目前为止一切很简单，不容易犯严重的错误。但有一个陷阱。如果你从左侧第二个菜单栏选择一个文件，它会在编辑器中打开。如果你在选择后右键点击，会打开一个文本面板，底部有一个\
  \ `delete`（删除）选项，这里就是陷阱：点击 `delete` 不会像 `AtmelStudio` 那样简单地将其从工作区中移除，它会物理上从你的存储区域删除它。这是一个真正的\
  \ Windows 删除。参见 PlatformIO 陷阱与注意事项（第 109 页）。\n\n## PlatformIO 创建项目\n\n### 项目结构与\
  \ `platformio.ini`\n\n- PlatformIO 项目是一个包含 `platformio.ini` 文件的文件夹。\n- 它在单级或双级目录结构中运行，代码位于\
  \ `src_dir` 指向的子目录。\n- 它创建一个带有空 `setup` 和 `loop` 函数的 `main.cpp`。\n\n创建项目非常简单。点击左侧工具栏上的\
  \ PlatformIO 蚂蚁图标打开 PlatformIO 主页。进入 `Quick access` -> `PIO Home` -> `Open`；这将打开一个提供创建新项目的窗口——执行此操作；不要导入现有的\
  \ Arduino 项目，因为 PlatformIO 会将其放在 `C:\\Users` 某处；它不会将其放在你想要的地方。\n\n在使用 PlatformIO\
  \ 创建新项目时，需要考虑以下一些事实：\n\n- 项目文件夹的名称可以是任何内容。PlatformIO 并不关心。没有像 Arduino IDE 那样的限制（即项目名称必须与去掉\
  \ `.ino` 后缀的 Sketch 名称相同）。\n- 项目属性定义在 `platformio.ini` 文件中。项目的名称是 `platformio.ini`\
  \ 文件所在文件夹的名称。\n- 源代码可以位于任何地方。唯一的约束是它必须相对于由 `src_dir` 定义 PlatformIO 项目配置 (platformio.ini)\
  \ (第 106 页)) 文件。\n\n无论你选择哪种，基本的项目结构都是相同的。在 `src` 子目录下会创建一个包含空 `setup` 和 `loop` 函数的\
  \ `main.cpp` 文件，在构建时会忽略 `.ino` 文件。\n\n### 如何创建 Arduino 项目\n\n我推荐第一种选项 `New project`（新建项目），因为它允许你选择创建项目的目录。第二种选项\
  \ `Import Arduino project`（导入 Arduino 项目）没有提供此选项；它会将项目放在 `C:\\Users\\Somewhere`；你没有选择余。我可能是错了，但在尝试了一个小时指定导入项目位置后，我失败了。\n\
  \n以下是通过点击 `New project` 创建 Arduino 项目的方法：\n\n- 点击 PlatformIO 主页上的 `+New Project`，即带有大蚂蚁表情符号的那个。\n\
  \n\n\n\n\n- 定义项目名称，使用 Arduino 项目的名称。\n- 选择开发板，在编写时有 2000 多种可能的选择。我选择了 `Arduino`\
  \ `ATmega2560`。\n- 取消勾选“使用默认位置”（Use default location）选框；这将文本框向下扩展并显示以下内容：\n    -\
  \ 收藏（Favorites）- 定义在 `C:\\Users\\Agir\\platformio\\homestate.json` 中的 `VS Code`。\n\
  \    - 位置（Places）- 我的用户名 `Agir` (`C:\\Users\\Agir`) 和项目目录 (`C:\\User\\Agir\\Documents\\\
  PlatformIO\\Projects`)。\n    - 磁盘驱动（器号）包含 `C:` 和 `D:`。\n    - 磁盘驱动（名称）包含驱动器的名称，在我的情况下是：`OS`\
  \ 和 `Data`（Windows，我的电脑）。\n\n你可以使用上述任何项来导航到你想要放置项目的位置。收藏文件夹定义在 `C:\\Users\\Agir\\\
  .platformio\\homestate.json`。\n\n默认位置指向 `C:\\Users` 路径；我必须手动修改 `.json` 文件，以便收藏菜单项指向我\
  \ `D:` 驱动器中的 `VScode` 文件夹。\n- 点击“完成”（Finish）。\n\n假设你选择了一个位于名为 `Simple` 的文件夹中的 Arduino\
  \ IDE 项目，该文件夹包含 `Simple.ino`。你现在需要进行一些细小的更改，使你的 PlatformIO 项目能够正常工作。\n\n- `platformio.ini`\
  \ 文件 - PlatformIO 会在 PlatformIO 项目根目录（即你选择的目录）中创建一个 `platformio.ini` 文件（项目配置）。你将在下一节中找到关于\
  \ PlatformIO 项目配置的详尽信息。\n- 项目源代码位置 - PlatformIO 在 PlatformIO 项目根目录内创建一个名为 `src`\
  \ 的源文件子文件夹。你需要在 PlatformIO 项目配置 (platformio.ini) (第 106 页]文件中添加一个新章节和一个变量，告诉它源文件应该放在哪里。在我的情况下，我选择了\
  \ `[platformio] src_dir = .`，告诉 PlatformIO 源文件应该在它的项目根目录中（单目录结构）。\n- PlatformIO\
  \ Arduino 项目入口文件 - PlatformIO 会创建一个 `main.cpp` 文件，其中包含空的 `setup` 和 `loop` 函数。将 `.ino`\
  \ 文件的内容复制到 `main.cpp` 中，或者你可以选择将 `.ino` 文件的内容传输到名为 `Aardvark` 的函数中，以增强互操作性并减少错误。见互操作性\
  \ (第 21 页。\n- 编译标志 - Arduino 库使用 `-fpermissive` 选项防止编译警告阻塞构建过程。似乎此标志是默认引入的。我将其添加到\
  \ `[env]` 章节中。以下是缺少 `-fpermissive` 标志时的典型错误：\n\n```\ntype char* className = \"this\
  \ is the Employee class\"; C++ forbids...\n```\n\n`-fpermissive` 标志将上述内容从停止构建的“错误”转换为允许构建的“警告”。\n\
  \n你已经准备就绪了。通过点击左侧栏上的“构建”（Build）按钮进行构建；假设在 Arduino IDE 中编译无误，那么应用程序也应该无错误编译。你可以将应用程序上传到微控制器，然后从\
  \ PlatformIO 终端运行它（它带有串口控制台）。\n\n我遇到了第一个障碍，是因为我没有意识到 PlatformIO 项目实际上是一个 `VS Code`\
  \ 文件夹。如果你想处理特定的项目，不要像在 AtmelStudio 中那样以打开项目的方式思考，而要以打开 `VS Code` 文件夹的方式思考：从顶部工具栏（`VS\
  \ Code` 工具栏）执行“文件-->打开文件夹”（File-->Open folder）。\n\n另一个问题是，没有像 AtmelStudio 那样的项目属性对话框。项目的配置必须通过项目目录中项目特定的\
  \ PlatformIO 配置（`platformio.ini` - 下一节）文件中手动定义的配置参数完成，类似于 Arduino 的 `platform.txt`\
  \ 文件。例如，在创建项目时，它会询问开发板。我回答了 `ATmega2560`；PlatformIO 在 `platformio.ini` 配置文件中写了以下行代码：\n\
  \n```\nboard = ATmega2560\n```\n\n如果你以后决定在 Arduino UNO (`ATmega328P`) 上运行程序，你需要通过将\
  \ `board` 行更改为：手动在 `platformio.ini` 中输入新开发板：\n\n```\nboard = ATmega328\n```\n\n\
  关于 `platformio.ini` 文件的更多信息，请参见 PlatformIO 项目配置章节（`platformio.ini` - 下一节）。\n\n要运行程序，你必须编译它、上传并在终端中运行（PlatformIO\
  \ 将此称为监控 monitor）。\n\n- 编译和上传 - 与 Arduino IDE 一样，你可以编译和上传；这两个操作都是通过点击左侧工具栏上的小虫图标进入\
  \ PlatformIO 菜单完成的。\n- 运行任务 - 打开顶部工具栏中的“终端”（Terminal）菜单会显示多个选项，其中之一是“运行任务”（run task）。该选项允许触发程序的执行。\n\
  \n上传过程出人地成功了。我说出人地地是因为我不需要像 Arduino IDE 和 AtmelStudio 那样指定 `com port`（串口）。PlatformIO\
  \ 会自动识别 `com port`。我胜利得太早了。当我修改源代码开始尝试 PlatformIO 时，上传时收到了如下消息：\n\n```\navrdude:\
  \ ser_open(): can't open device \"\\\\.\\COM11\": Access denied\n```\n\n这不是 Bug，而是用户友好性问题，在\
  \ PlatformIO 注意事项与警告 (109)章节中有所解释。解决访问拒绝问题后，我能够编译、上传并运行 Arduino 项目。由于我使用的是 `mega2560`，我决定尝试\
  \ `mega328P`。这需要在 `platformio.ini` 文件中指定一个新的 `com port`：\n\n```\nupload_port = COM14\n\
  monitor_port = COM14\n```\n\n简而言之，我最终创建了一个带有 `mega328P` 的新项目来解决问题。PlatformIO 没有识别新的串口设置。我花时间搜索目录寻找旧的\
  \ `COM11` 规范所在，但没有成功。(part0018.xhtml_a8ZH)。\n\n\n\n\n`platformio.ini` 文件是一个数据文本文件，其语法非常简单；它与\
  \ `.json` 文件非常相似（第 96 页）。\n\n- 文件结构 - 该文件是由独立行信息组织的文本文件，即一次一行。\n- 注释 - 分号之后的内容都会被忽略。这等同于\
  \ C++ 风格的 `//`。\n- 区域 - 两个区域（`platformio` 和 `env`）定义了构建过程。特定的数据值定义在这些区域之一。\n   \
  \ - `platformio` section - 只有一个 `platformio` 区域，它会覆盖 PlatformIO 的默认配置。\n    - `env`\
  \ section - 后面可能跟随某些规格，用于指定构建类型（release, debug, mega2560 或 mega328 `platformio.ini`\
  \ 文件 - 项目配置）。请注意，变量不是由用户定义的；它们是由 PlatformIO 预定义的。每个变量属于一个特定的区域（`src_dir` 属于 `platformio`\
  \ 区域，而不是 `env` 区域）。`platformio.ini` 文件的结构是灵活的，因为区域可以继承自其他区域，从而创建层次结构。\n- 数据以变量/值对的形式定义；`=`\
  \ 将值分配给变量（例如 `upload_port = COM11`）。如上所述，变量/值对属于特定的区域。自动补全将帮助你避免错误。例如，如果你尝试在 `env`\
  \ 区域内添加 `src_dir`，一旦你输入它，就会弹出一个窗口；它会包含 `test_speed`、`buil_src_filter`，但找不到 `src_dir`。这应该提醒你你做错了。如果你在\
  \ `platformio` 区域内进行相同操作，一旦你输入，就会得到 `shared_dir` 和 `src_dir`，这样就没了。\n- 环境 - `platformio.ini`\
  \ 文件应该定义目标微控制器类型和框架。\n    - `platform = atmel`\n    - `framework = Arduino`\n\n\
  以上，项目的所有配置都定义在项目的 `platformio.ini` 文件中，如上所示。但我确实遇到了一个难题。我决定更换板子，这导致我在 `platformio.ini`\
  \ 文件中定义了新的 `board =` 和新的 `upload_port =`。问题在于上传时，PlatformIO 固执地尝试上传到旧板子；我无法让它识别新板子。参见\
  \ PlatformIO 陷与注意事项（第 109 页）。\n\n在大量使用 AtmelStudio 之后，习惯于通过文件中的参数进行操作需要一点时间。这是一个知道去哪里寻找答案的问题。链接\
  \ [`docs.platformio.org/page/projectconf.html`](https://docs.platformio.org/page/projectconf.html)\
  \ 将告诉你配置应用程序所需的所有信息。掌握 `platformio.ini` 文件的知识至关重要，因为这些文件定义了项目如何构建和上传。\n\n### 1.\
  \ PlatformIO 互操作性\n\n要在 PlatformIO、Arduino IDE、AtmelStudio、Visual Studio、VS Code\
  \ 和 Visual Micro 之间实现互操作性再简单不过了。其思路是以这种方式组织源文件，使得全局包含文件中一个简单的 `#define` 就能让你选择想要与哪个\
  \ IDE 工作。\n\n在决定了想要与哪些 IDE 互操作后，你必须决定想要单级目录结构还是两级目录结构。PlatformIO 可以适配以适用于任一者。以下是可能选项的总结：\n\
  \n- Arduino IDE 加 AtmelStudio 插件 PlatformIO 需要两级目录结构。\n- Arduino IDE 加 AtmelStudio(Visual\
  \ Micro) 插件 Visual Studio (Visual Micro) 加 PlatformIO 需要单级目录结构。\n\n如果你选择在没有 Visual\
  \ Micro 的情况下使用 AtmelStudio，你将处于两级目录结构中。你应该先按照 PlatformIO 创建项目（第 103 页） 中的描述创建一个\
  \ AtmelStudio 项目。一旦完成这些，你就实现了与 AtmelStudio 和 Arduino IDE 的互操作性。如果你选择使用 Visual Micro，你将处于单级目录结构中。你可以使用现有的\
  \ Arduino 项目目录（两级目录结构）或 Arduino 项目目录（单级目录结构）。\n\n下一步是创建一个新的 PlatformIO 项目（参见上方的\
  \ PlatformIO 创建项目（第 103 页）章节。\n\n### 2. PlatformIO 基于硬件的调试\n\n在定稿此书的过程中（2023 年 5\
  \ 月），我检查了 PlatformIO 网站上基于硬件调试的可能性。所提的解决方案基于使用特定的 Arduino 板子配合调试适配器。ATmega328P-Xmini\
  \ 硬件调试器（参见硬件调试第 119 页）。我特别看了一个章节：使用 PlatformIO 进行 Arduino 在机调试；它包含了：\n\n- 硬件 - PlatformIO\
  \ 硬件调试需要安装相应的硬件（Nano 33 和 MKR 系列）并进行相应的连接。\n- 配置 - 必须在 `platformio.ini` 配置文件中设置特定变量。\n\
  \n设置好环境后，你就可以进行调试。写作时我没有所需的设备，因此没有尝试过。\n\n### 3. PlatformIO 帮助与文档\n\n丰富的 PlatformIO\
  \ 帮助和文档缩短了学习曲线。在 PlatformIO 内部可以访问两个帮助和文档位置：\n\n- 顶部栏中的帮助菜单项 - 这是 VS Code 的帮助，不是\
  \ PlatformIO 特有的。\n\n\n\n\n\n*   PIO 首页底部的“Get Started”（入门指南）和“Docs”（文档）选择项 -->\
  \ 打开页面 - 这是 PlatformIO 特有的帮助。这些内容包含了关于 PlatformIO 是什么、它支持的开发板、平台、框架、如何安装、如何使用以及某些功能介绍的详细信息。它还包含了如何通过\
  \ `platformio.ini` 配置项目以及入门教程的帮助。它将引导你查看 YouTube 上的 PlatformIO 20 分钟介绍视频，我觉得这些视频非常有启发性。在\
  \ `https://maker.pro` 网站上有一个有趣的教程，PlatformIO 官方网站并未列出。请参见 Bibliography - PlatformIO\
  \ (第 336 页)。\n\n## 1. PlatformIO 的坑与注意事项\n\nPlatformIO（坑与注意事项）也有它自己的坑和注意事项——在我看来（IMHO），PlatformIO\
  \ 与 AtmelStudio 平起良坐。但与所有复杂系统一样，我遇到了一些问题，这在部分是因为我没能发现如何进行某些操作，或者是因为 PlatformIO 本身的问题。\n\
  \n### 导入 Arduino 项目位置被硬编码\n导入 Arduino 项目位置被硬编码 - 创建新项目并决定安装位置是简单的；取消勾选默认位置复选框并指定你想要去的地方即可。然而，在导入\
  \ Arduino 项目时无法做到这一点；它会将你的项目放置在它中称为 `Places` 的目录中（位于“导入项目”窗口的左侧）- 处有两个图标：\n\n* \
  \  标记为 `MySelf` 的主页图标：`C:\\Users\\MySelf`\n*   标记为 `Projects` 的文件夹图标：`C:\\Users\\\
  MySelf\\PlatformIO\\Documents\\Projects`\n\n如果你导入一个 Arduino 项目，它会将其放在上述的 `C:` 盘\
  \ `Documents/projects` 中。我没有找到修改这些默认位置的方法。ChatGPT 派不上用场，因为它一直引导我去点击一个似乎已经不再存在的“创建项目设置”图标。我尝试了\
  \ PlatformIO 的帮助文档，但没有成功；于是我放弃了。但是，由于创建新项目似乎与导入 Arduino 项目是一模样的（它们都会在 `src` 子文件夹中创建一个\
  \ `main.cpp` 文件），所以我采取了使用“新建项目”的方式。\n\n### platformio.ini 文件变量位于错误章节未被报告\n\n`platformio.ini`\
  \ 文件变量位于错误章节 - 如果你没有将 `src_dir = .` 变量/值对放在 `platformio` 中，你将得到以下误导性的错误信息：\n\n`Error:\
  \ Nothing to build. Please put your source code files to the PROJECT\\src' folder.`\n\
  \n问题在于该错误信息具有误导性。在我折腾的某个时刻，我发现错误并不是与如何告诉 PlatformIO 放置位置有关，而仅仅是变量/值对的位置不对。\n\n###\
  \ 上传程序失败：拒绝访问\n上传程序失败：拒绝访问 - 随着我对 PlatformIO 使用的深入，我处理事务变得越来越成功。终端窗口中的输出看起来和从 Arduino\
  \ IDE 编译的结果一样。然后当我尝试上传时，偶尔会在我使用的串口上收到“Access denied”（拒绝访问）的消息，$#%*@ 到底是怎么回事？原因是当你运行程序时，因为\
  \ `loop` 函数永远不会停止，应用程序不会退出。这意味着终端正忙碌。所以，当你重新构建并尝试加载时，它不会重新加载，因为终端正忙碌。这很逻辑。但信息却是“拒绝访问”，就好像是某种神秘的\
  \ Windows 权限问题。你会在终端窗口的右部分、PlatformIO 工作区域的底部，看到以 `PlatformIO:` 开头并打勾标记结尾的文本行。最后一行文本可能以一个圆形的\
  \ 220° 弧形结束 - 它在告诉你终端正忙碌。选中它；点击垃圾桶；这会停止程序从而释放终端。问题解决。\n\n### 编译/上传过程正常但程序无输出\n编译/上传过程正常，但你没有得到任何输出\
  \ - 你终于学会了编译和加载应用程序，但令你非常沮丧的是，没有任何输出。你对着夜空尖叫，但不，那解决不了问题。你只是忘记了 PlatformIO 会创建空的\
  \ `setup` 和 `loop` 函数。你可能忘记将你的 `.ino` 代码传输到 PlatformIO 的 `main.cpp` 文件中了。\n\n###\
  \ 目录内容更改后目录内容未更新\n目录内容更改后目录内容未更新 - 在创建项目时，我导航到了目标目录。发现它包含不需要的项目后，我打开了 Windows 资源管理器并删除了一些项目。当重新打开\
  \ PlatformIO 的导入 Arduino 项目窗口时，那些项目仍然在那里。我不得不关闭并重启 PlatformIO 才能重新开始。\n\n### 从项目中删除文件会将其彻底删除\n\
  在资源管理器窗口右键点击选中的文件时，要小心删除选项。从项目中删除文件会将其从磁盘中删除。PlatformIO 在此语境下的行为是危险的，因为可能会丢失珍的工作。原因是通过\
  \ PlatformIO 移除文件等同于使用 `VS Code` 删除文件。再次强调，区分 `VS Code` 和 PlatformIO。你不能直接从项目中删除文件。\n\
  \n### 编译使用了项目源码目录中的文件\n编译使用了项目源码子目录中的文件。我一直在一个子目录中进行 Perl 工作。PlatformIO 编译了目录和子目录中的文件，从而导致了大量错误。认为工具将子目录中所有的\
  \ `.h/.cpp` 文件都包含在项目中并不是好主意。\n\n### 文件编辑窗口可以取消固定，编辑器恢复到类似记事本的状态\n单个源文件无法取消固定以便从多屏幕设置受益。如果你尝试这样做，它们将以链接的形式添加到\
  \ Windows 桌面。然后你可以使用与文件扩展关联的任何程序在 PlatformIO 之外进行处理。专业程序员将在多屏幕环境中工作。我认为能够取消固定文件并保持对\
  \ C++ 编辑功能的访问是一项需求。\n\n### 新串口未识别\n新串口未识别 - 在使用了 `ATmega2560` 之后；我想尝试使用 `ATmeg328P-Xmini`\
  \ 板（参见基于的调试 第 119 页）。尽管我在 `platformio.ini` 文件中更改了串口 `COM14`，PlatformIO 仍然尝试上传到 `COM11`。我不得不为新板创建一个新项目，因为串口规格硬编码在某处了。在花费大量时间搜索后，未能找到\
  \ `COM11` 端口规格是在哪里硬编码的。\n\n\n\n\n\n前面的章节描述了我在 Windows 环境下能找到用于 Arduino 编程的主要 IDE。肯定可能还有其他的。本章涵盖了两个我认为应该提到的\
  \ IDE：\n\n* `Code::Blocks` - 我包含 `Code::Blocks` 是因为它是一个通用的 C++ IDE，在流行的《C/C++ 教程》（C/C++\
  \ for Dummies）系列书中被提到（参见 参考文献 - C/C++ 编程 第 332 页）。\n* `MPLAB (第 112 页) 是 Microchip\
  \ 的工具。我下载了并尝试使用，但放弃了。它的学习曲线似乎很陡。\n\n书中可能还有其他我本应该包含的工具；然而，所涵盖的都是专业级的，能够提高效率，并为开发\
  \ Arduino 应用提供了丰富的手段。\n\n## 1. Code::Blocks\n\n`Code::Blocks` 是一个免费、低成本的 C++ IDE；它似乎并不适合\
  \ Arduino 开发。你可能在《傻瓜指南》系列书籍中见过 `Code::Blocks`（参考文献 - C/C++ 编程第 332 页）。这是一个类似于 `AtmelStudio`\
  \ 的 IDE。它的主要缺点是无法无缝地导入、编译和链接现有的 Arduino 应用。在我看来，它并没有针对 Arduino 开发进行适配。\n\n我在在阅读《傻瓜指南》系列书籍（C、C++、Arduino）第一次遇到\
  \ `Code::Blocks`。我下载了它并开始测试。我的第一次尝试相当顺利，因为我正在熟悉的领域进行操作——我的意思是我处于一个我熟悉的环境中，即一个界面与\
  \ Arduino IDE 相似的 C++ IDE。由于有可能创建 Arduino sketch 文件（即包含 `setup()` 和 `loop()` 的文件），这鼓励我继续下去。我接着开始编译这个文件，但很快就碰了钉头，因为编译器报告找不到\
  \ `Arduino.h` 头文件。我搜索了一下，发现我可以告诉编译器去哪里查找头文件。在告诉 `Code::Blocks` 查找 `Arduino.h` 文件的位置后，它确实找到了，但却找不到该文件所包含的\
  \ `.h` 文件。这时我决定停止。显然，`Code::Blocks` 似乎不像其他 IDE 那样支持无缝的 Arduino 项目开发。\n\n公平起见，我必须承认我发现了一个第三方产品：Freematics\
  \ ([`https://freematics.com`](https://freematics.com)) 提出了一个名为 `FreematicsBuilder`\
  \ (`ArduinoBuilder`) 的应用程序。这个工具能够构建 Arduino 应用；然而，使用两个独立的工具（一个编辑代码，另一个构建应用）远非理想。我决定不再在上面花费任何时间了。\n\
  \n## 2. MPLAB\n\n`MPLAB` (Microchip) 似乎是为专业的嵌入式代码开发设计的。这是 Microchip 对其工具的描述：\n\n\
  `MPLAB X Integrated Development Environment (IDE)` 是一个可扩展、高度配置的软件程序，它包含了强大的工具，帮助您为我们的大多数微控制器和数字信号控制器发现、配置、开发、调试和验证嵌入式设计。`MPLAB\
  \ X IDE` 与 `MPLAB` 开发软件生态系统无缝集成，其中许多是完全免费的。\n\n下载之后，我发现它需要下载其他工具，而且由于它是基于 NetBeans\
  \ 的工具，熟练掌握 `NetBeans` 环境是一个前提，这预示了陡峭的学习曲线。结果是我决定放弃了 `MPLAB`。\n\n## 3. 调试\n\n创建一个应用程序是一个循环往复的设计、编码、测试、调试过程。该过程的每个阶段都同样重要。问题是，调试可能会过度；它可能会消耗整个开发时间的\
  \ 30% 到 90%。鉴于整个开发过程中极端的调试时间，可以确定，首要任务是尽一切减少 bug 出现的概率。这从根本上就是本书及其配套书籍《实用的 C++ Arduino\
  \ 编程》（Pragmatic C++ Arduino Programming*）的要意义。\n\n* 避免 bug（下一节） - 本章从至关重要的避免 bug（下一节）开始。\n\
  * 问题类型 (第 114 页) - 我将 bug 分为三类：`小故障`(part0020.xhtml_a95M) (第 114 页)、`代码抖动`(part0020.xhtml_a94R)\
  \ (第 115 页) 以及 `错误操作`(part0020.xhtml_a8F) (第 117 页)。尽管它们在某种程度上有重叠，但产生原因和表现形式不同。而且它们确实有一个共同特征：产生原因可能极其难以。\n\
  * 基于打印的调试 (第 118 页)，虽然被某些人指责为过时（与硬件调试相比），但它仍然是一种有用的技术。可以在串口监视器上选择性地显示事件。如果出现问题，可以显示相关数据、参数值和返回值。它是基于放置打印命令来显示关于应用程序行为的信息。程序员可以获得所发生情况的整体视图。我开发了一个正式框架（基于打印的调试框架`(part0022.xhtml_a8EU)\
  \ 第 188 页 来组织调试过程。\n* 基于硬件的调试` (第 119 页) 是基于使用外部硬件工具（例如 `Atmel ICE` (第 122 页) 或\
  \ `ATmega328P-Xmini` (第 120 页)）来实现代码层面的调试。此类工具允许你在特定的源代码行停顿、监控变量、观察越界值、更改变量值、检查内存、恢复等。它为调试引入了增强的维度。\n\
  * 串口调试`(part0020.xhtml_a8CD) (第 125 页) 通过 `Visual Micro` 插件集成到 `AtmelStudio` 和 `Visual\
  \ Studio` 中提出。它与硬件调试类似。其主要优势是不需要外部调试板；其不便之处在于其局限性。\n\n三种主要的调试方法（基于打印、基于硬件、串口）是互补的：既能看到森林，也能看到树木。你将在后续章节中看到这些内容。\n\
  \n\n\n\n\n# 基于打印的调试框架\n\n## 避免错误 - 防微胜于治疗\n### 错误（避免错误） - 防微胜于治疗\n减少调试时间的关键在于避免错误的产生。你应当采用良好的工具、实施标准流程、养成良好的编程习惯并使用框架。总的来说，调试时间——无论是基于打印的调试还是基于硬件的调试（或串口调试）——都可以通过针对错误预防或早期错误检测的定制化开发来缩短。任何关于调试的讨论都应该从避免错误开始。事实证明，生产力取决于许多因素，其中就包括对错误的早期发现。你越早发现错误，错误的代价就越低。这就是使用\
  \ `AtmelStudio` 或 `Visual Studio` 的主要原因之一，因为它们在你编写代码时就会检查语法。你不需要等待编译器来告诉你，你在 `for`\
  \ 语句中误用了逗号而不是分号。\n\n此外，你应该采用良好的编程实践来避免错误或尽早捕获它们。请参阅良好的编程实践（第 129 页）。\n\n## 1. 问题类型\n\
  在开发应用程序时，你会遇到各种问题。它们可以分为以下几类：\n\n*   **故障 (Glitches)**（下一节）——这些是最难发现的错误，因为它们不是系统性的。应用程序运行良好，但偶尔会失败，你很难确定其因果关系。\n\
  *   代码抖动 (Code thrashing) (第 115 页) —— 失控的打印显示了乱码。或者变量的值错误。如果问题是系统性的，那么你在方法论上是幸运的，耐心将使你追溯到问题的根源。\n\
  *   误操作 (Misdoings) (第 117 页) —— 小错误，但代码完全合规，例如用 `=` 代替 `==`，这可能会花费大量的调试时间来弄清楚为什么应用程序没有正常工作。\n\
  \n## 1. 故障 (Glitches)\n### 错误（可能的原因和治疗方法） - 故障是人能遇到的糟糕的编程问题；如何修复它们？\n故障是人能遇到的最糟糕的编程问题。当你试图寻找原因时，应用程序运行良好，然后出乎意料地，砰的一了。以下是我在即将完成蜂巢称重系统时遇到的一个场景。早期测试是满意的，随后当我测试真实场景时，我开始偶尔遇到崩溃。注意“偶尔”这个词。大多数时候应用程序运行正常，但有时会抽风——故障露出了丑陋的面目。\n\
  \n*   我的蜂巢称重系统是一个基于父子的数据采集系统。所有模块都有一个 `XBee` 射电和一个 `DS3231` 时钟。父节点拥有这些设备，外加 `GSM`\
  \ 板用于向我发送短信。\n*   工作根据计划执行，计划设置闹钟触发下一个任务、做什么以及何时做。任务之间，系统处于睡眠状态。任务完成后，设置时钟闹钟以唤醒系统处理下一个任务。\n\
  *   我偶尔会向父模块发送 `SMS` 以添加、修改或删除计划。\n\n我让网络中的五个模块运行得完美无缺，最多 `16` 个。一切进展顺利，但遗憾的是，我赢得胜利得太早了，父节点在重新安排下一个作业时偶尔会崩溃。这是一个棘手的故障，因为我可以顺畅地运行五次而毫无问题，但在第\
  \ 6 次，该死了！！！\n\n**问题：你如何寻找故障产生？**\n\n*   **阶段 1**：从查看你的代码开始。审阅它。尝试猜测问题可能在哪里，但不要在上面花费太多精力。不要立即深挖解决问题。离开去做些别的事情。让你的潜意识继续工作，因为你大脑的特性是，当某事困扰你时，它会不断纠结。等恢复精力并变得更有信心后，回来，卷起袖子，重新工作。\n\
  *   **阶段 2**：寻找故障原因的第一步是消除随机性。如果你仍然对应用程序为何随机崩溃而毫无头绪，请尝试将随机发生转换为规律性。这是最终解决问题的关键。你必须消除随机性。运行测试，多次测试，每次都记录测试条件，直到模式出现。一旦你成功重现了问题，只是时间问题。你最终会找到那个作恶的代码。\n\
  *   **阶段 3**：消除随机性说起来容易做起来难。如果你能将故障转换为重复性事件，你就成功设置了寻找 bug 所需条件。我运行了更多测试并记录了测试条件。一段时间后，一个模式出现了。我发现当在没有新\
  \ `SMS` 的运行时，一切运行良好；但在有新 `SMS` 的相同操作时，我会崩溃。问题解决了一半，因为我成功消除了崩溃的随机性。现在 bug 是可重现的。问题似乎在处理新\
  \ `SMS` 的函数内部。它很复杂，因为它对 `SMS` 的有效性进行了大量的检查：其格式、内容等。从那时起，调试变得简单得多，因为我缩小了 bug 的位置。一旦我发现了这种因果关系（消除了随机性），我就走在了寻找\
  \ bug 的道路上。修复这个故障虽然花了我整天的工作，但我把它修复了！！！\n\n如果在执行了阶段 1 到 3 后，你仍然没有找到应用程序报错的原因？这种情况发生在我身上。我能想到的解决方案是暴力法。从设置开始，在打印某些内容后早期退出。它应该运行正常。逐步包含越来越多的功能，同时检查执行情况。早晚程序会出\
  \ bug。这将帮助你缩小问题所在。\n\n---\n\n## 1. 代码抖动 (Code thrashing)\n### 错误（可能的原因和治疗方法） - 应用程序显示乱码、重启等\n\
  应用程序变得越来越大且复杂。它一直运行良好，然而突然，一个 `char` 数组显示乱码且应用程序重启，这意味着它会无限循环。某些东西破坏了应用程序退出函数后应该返回的地址。\n\
  \n这是一个系统性错误，而不是故障。没有随机性。这个 bug 与我在故障问题中描述的不同之处在于，我无法缩小问题所在。我得出结论，需要某种在故障处理章节之外的新方法论。\n\
  \n**问题是：需要一种新的方法论，现在怎么办？** 我决定回到基础，采用一种“白纸”方法。\n\n\n\n\n\n# 错误（避免错误）\n\n### 第一步：理解应用程序逻辑\n\
  我首先查看了代码以弄清楚我在做什么。代码有点复杂，我花了一段时间才理解其逻辑。我虽然对代码做了一些记录，但还不够。因此，我重新审查了代码。我成功地理解了算法是如何工作的、参数的用途等。这促使我增强了函数文档，可以通过我的\
  \ Perl 程序 `GenerateDoc.pl` 打印（程序文档框架 第 155 页）。事实证明这是一个价值的一步。逐函数地记录代码加深了我对程序内部机制的理解。\n\
  \n### 第二步：确定问题何时开始变糟。\n我通过系统地打印出错指针的地址和内容，以缩小问题可能的来源。我创建了一个特殊的宏来处理此操作：\n\n```c\n\
  PRINT_ADDRESS_CONTENT(desc, var, contents)\n```\n\n以下是打印的内容：\n\n```text\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n\
  SMS_PrepareSend lineNo 1214\nJust after SMS_PrepareSendBG\nvariable: smsObtainedCompleteAddress:\
  \ 8156\ncontents: smsObtainedComplete EMPTY\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n\
  ```\n\n在程序中的几处打印上述内容揭示了问题发生的时间——即在程序执行过程中某一点地址被更改了。\n\n### 错误（可能的原因和解决办法）\n该错误由于\
  \ Arduino 编译器的类型检查较弱。我声明了一个有 14 个参数的函数，其中一个是默认值，因此在使用函数时并不是必须的。在我编程时，不知不小心遗漏了一个参数，编译器对此非常满意，但程序完全不开心。一个\
  \ `int` 变成了 `char*`，一个 `char*` 变成了 `int`。你可以想象当对一个 `char*` 执行 `strcpy` 时，而这个 `char*`\
  \ 实际上是 `int` 中的值会发生什么——它会破坏 `char*` 指向的内存位置。这会造成破坏，具体取决于被破坏位置的用途。\n\n### 两步法：审查代码并应用系统性有效性检查\n\
  这种两步法（审查代码，随后对变量地址和内容进行系统性检查）证明是成功的。我找到了错误。而且，它迫使我修改代码，使其更简洁、更易维护。\n\n### ATmega328P-Xmini\
  \ - 监控变量以发现故障\n硬件调试本可以通过对打印乱码的变量设置监控（watch），帮助我更快地找到上述错误。但这并不是一个选项，因为我无法让 AtmelStudio\
  \ 中的 Atmel ICE 硬件调试工作。遗憾的是，当时我并不知道 Atmel 提出了 Xplained 硬件调试板，即 ATmega328P-Xmini（第\
  \ 120 页），这是一块结合了 ATmega328P 微处理器和板载调试能力的奇迹板。如果我使用了这块板，我就能很快找到变量在哪里被破坏的。\n\n# 1.\
  \ 失误 (Misdoings)\n\n失误是看似平庸的错误，由于按键错误、疲劳、注意力瞬间分心、过度扩展多任务处理能力等引起。问题是，在编写代码时几乎不可能不偶尔犯错。编译器大多数时候都能发现这些错误，它们可以立即被纠正。但还有其他更为微妙的错误，由于代码没有语法错误，编译器会放行通过。此类错误的一个例子是在\
  \ `if` 语句中使用 `=` 符号而不是逻辑运算符 `==`。这可能会导致灾难性后果。你的代码可以编译，但偶尔无法正常运行。这种类型的错误（小故障）极其难以发现。我将这类错误称为“失误（misdoings）”。\n\
  \n到为止，我识别了四种可能让程序员耗费大量调试时间的失误。其中任何一个都不容易检测到。我开发了一个 Perl 程序（`FindMisdoings.pl`）来检测这些错误。请注意，它不是执行类似工作的\
  \ C  lint 工具的替代品。\n\n### 在 if 或 while 中用 `=` 代替 `==`，或在赋值中用 `==` 代替 `=`\n在进行 `if`\
  \ 或 `while` 操作时，一种典型的失误是在 `if` 或 `while` 中使用了 `=` 而不是 `==`，或者在赋值语句中使用了 `==` 而不是\
  \ `=`。\n\n```c\nif (condition) {\n    // 错误：使用 = 代替 ==\n}\n```\n\n### switch 默认情况\
  \ case 缺失或为空\n关于 `switch` 的 `default` 情况有两个强制性规则：\n1. 始终应该有一个 `default` 情况。\n2.\
  \ `default` 情况应该始终包含代码，要么处理正常情况，要么触发错误以告知 `switch` 永远不通过 `default` 退出。\n\n### Serial.prints\
  \ 中缺少 F() 宏\n当应用程序启动时，所有字符串都会加载到 RAM，从而减少了堆空间。使用 `F()` 宏允许将字符串存储在闪存中，需要时再加载到 RAM，从而避免无必要地将其留在\
  \ RAM 中。考虑以下示例：\n\n```cpp\nSerial.print(F(\"This string is loaded on an needed basis.\"\
  ));\n```\n\n在编写打印代码时，很容易忘记 `F()` 宏，从而不必要地减少 RAM。检测失误的程序将列出所有包含 `(` 的打印语句——即一个左括号后面跟着一个双引号。包含引号字符串的打印语句后面应该跟上\
  \ `(F`，而不是 `(`。\n\n`FindMisdoings.pl` 程序应该随着编码的进展定期应用。它应该能检测出这些错误，从而节省调试时间。我将其应用于我的\
  \ 35 个文件蜂巢称重系统，得到的结果如下：\n\n```text\nTotal errors found : 14\nif = instead of ==\
  \ : 0\nassign == instead of =: 1\nSwitchNoDefault : 1\nSwitchDefaultNoCode : 2\n\
  F macro missing : 10\n```\n\n那 10 个缺失的 `F()` 宏只是 RAM 使用优化问题。然而，赋值 `==` 代替 `=`、两个\
  \ `SwitchNoDefault` 以及一个 `SwitchDefaultNoCode` 错误可能是错误的根源。我很快纠正了这些错误。参见 失误（附录）（第\
  \ 293 页）。\n\n\n\n\n\n# 1. 基于打印的调试\n\n尝试定位程序为何无法运行以及问题根源时，最直接的方法是打印策略性的数据值以及程序在运行时的状态。随着调试的进行，打印语句会充斥应用程序，并迅速失去控制。解决方案是一个基于宏的系统，它能够选择性地允许某些打印保持激活状态，而让其他打印处于休眠状态。其基础是定义宏类别和三级宏分层结构：全局级、文件级和函数级。\n\
  \n### 宏类别\n宏类别可以分为几类：导航宏（进入/离开函数、程序运行到何种位置）、内存使用宏（碎片化和连续内存、未释放的残留指针）、关键情况宏（电压过低、值低于/高于阈值……）、数据值宏等。\n\
  \n### 调试宏级别：全局、文件、函数\n全局级宏允许启用或禁用全局范围内的宏。程序的生产版本不应包含任何激活的调试 `Serial.prints`。某些特定类别的全局级宏可以控制打印输出。\n\
  \n- **文件级** - 人在调试时的焦点通常集中在极少数文件上，通常只有一个。文件级宏可以启用或禁用特定文件内的所有调试宏。\n- **函数** - 由于一个文件可能有许多函数，且大多数已经经过过验证，将宏的激活限制在选定的函数可以减少串口监视器的输出。程序员可以集中关注似乎是问题所在处的函数。\n\
  \n这些机制在基于打印的调试框架（第 188 页）中已经形式化。\n\n# 2. 基于硬件的调试\n\n正如我之前写的，基于硬件的调试和基于打印的调试是有用且互的工具。两者都应该使用，因为它们解决了不同的需求。有时，你想获取程序执行的全局视图（基于打印的调试）。另一些时候，你想用放大镜观察代码，以确定到底发生了什么（基于硬件的调试）。\n\
  \n基于打印的调试很容易——只需打印你感兴趣的变量并加上注释。基于硬件的调试完全是另一回事——需要特殊设备。第三种调试选项是串口调试。这第三种选项与硬件调试相同，但它受到严重的限制——灵活性不足。接下来的讨论将涵盖基于硬件的调试。\n\
  \n尝试硬件调试时要克服的首要障碍是，微控制器必须实现一种机制，使其能够控制程序的执行（停止、查看变量、恢复）。第二个困难是需要将一个独立的设备（硬件调试器）连接到微控制器以控制执行。微控制器包含了硬件调试的机械结构，而硬件调试器包含了接口，用于告诉微控制器要做什么（停止、恢复……）。\n\
  \n基于硬件的调试需要理解两个概念：\n\n### 微控制器架构\n微控制器的架构：`AVR`、`ARM` 或 `PIC`：`ATmega328P` 和 `ATmega2560`\
  \ 都是 `AVR` 微控制器。`ESP32` 是 `ARM` 微控制器。`AVR` 意味着自动电压调节。`ARM` 意味着高级精简指令。`AVR` 和 `ARM`\
  \ 都是基于 `RISC` 的微控制器。`RISC` 意味着精简指令集。文献中偶尔看到的 `PIC` 意味着可编程智能计算机。硬件调试器通常设计支持一种或多种此类架构。因此，如果特定的调试器仅支持\
  \ `ARM`（`Olimex`），那么在 `AVR` 微控制器上使用它就是没用的。\n\n### 调试标准\n微控制器支持两种调试标准：`debugWire`\
  \ 和 `JTAG`。`ATmega328P` 支持 `debugWire`。`ATmega2560` 和 `ESP32` 都支持 `JTAG`。`debugWire`\
  \ 是 Atmel 针对小型微控制器的专用。`JTAG` 是行业标准。\n\n另一个需要注意的重要问题：调试应该在程序运行的板上进行，还是在更大的开发板上进行？我已经提到，由于\
  \ `ATmega328P` 尺寸小，我在较大的 `ATmega2560` 上开发程序。然而，最终测试应该在目标板上完成，而不是开发板。\n\n在开发工具链方面，取决于你将开发的微控制器，你面临着开发环境的选择（`Arduino\
  \ IDE`、`AtmelStudio`、`Visual Studio` + `Visual Micro`、`PlatformIO`、`MPLAB`、`Code::Blocks`）以及多种硬件调试器。硬件调试需要\
  \ IDE 支持。`Arduino IDE` `1.8.19` 没有调试功能；新版本 `2` 有。`PlatformIO` 支持 `Arduino` 硬件调试，但限于非常特定的硬件。Microchip\
  \ 提供的 MPLAB（第 112 页），但正如描述该部分的章节所示，它对于 Arduino 开发似乎有些大材小用，并且有很高的学习曲线。\n\n\n\n\n\n\
  # 基于硬件的调试\n\n- 硬件调试必须与微控制器架构（`AVR`、`ARM`）兼容\n- `Atmel ICE` - 未成功调试 Uno 或 Mega\n\
  - `ATmega328P-Xmini` `Uno` 引脚兼容，并被 `AtmelStudio` 支持，已成功使用\n- `ATmega2560RFR2 Xplained\
  \ Pro` - 用于 RF 通信的专用硬件，与 Arduino 板引脚不兼容，已成功使用\n\n在硬件调试器的选择上，Atmel 多年来一直提议 `Atmel\
  \ ICE`。它支持 `debugWire` 和 `JTAG`。我尝试过使用它——我必须报告，尝试让它工作的过程简直极度痛苦。更多信息请参阅 Atmel ICE（第\
  \ 122 页）。令我非常惊讶的是，我发现了 Xplained Xmini 系列调试板。这些是二合一的微控制器/硬件调试板——我用我的 `MemMgt` 程序测试了\
  \ `ATmega328P-Xmini`（`Xplained Mini`），成功了，非常棒，纯粹的即插即用！！！遗憾的是，在我开发蜂窝重量系统并尝试用 `Atmel\
  \ ICE` 调试它时并不知道这块板的存在。它本可以节省我大量时间。你将在后续章节中找到如何使用 `ATmega328P-Xmini` 进行程序硬件调试的完整说明（下一节）。有一个\
  \ `ATmega2560` 变体（`ATmega2560RFR2 Xplained Pro`），我已经在 `MemMgt` 应用上成功测试了它。然而，它有两个主要缺点：获取输出到串口控制台可能需要费一番，而且它完全不支持\
  \ Arduino `ATmega2560` 引脚。我仍在寻找兼容 Arduino `ATmega2560` 引脚的硬件级调试解决方案。\n\n还有其他基于硬件的调试器，价格从\
  \ 15 美元到 400 美元不等。简直混乱。我没有尝试过其中任何一个。你可能想看看新的 Arduino IDE V2 的调试功能——它支持 `SAMD` 板（[`docs.arduino.cc/software/ide-v2/tutorials/ide-v2-debugger`](https://docs.arduino.cc/software/ide-v2/tutorials/ide-v2-debugger)）。PlatformIO\
  \ 也为某些 Arduino 板提供了有限的硬件调试能力（参见 PlatformIO 硬件调试第 108 页）。\n\n在安装 Visual Micro for\
  \ AtmelStudio (MicrochipStudio)（第 84 页） 后，我发现它提供了 串口调试（第 125 页）。我不知道存在这种功能。我读过关于仿真器的介绍，但这不是仿真器；它就像一个硬件调试器。\n\
  \n## 1. ATmega328P-Xmini\n\n`ATmega328P-Xmini` `Uno` 引脚兼容并被 `AtmelStudio` 支持，已成功使用。如本章引言所述，`Xplained\
  \ Xmini` 板将微控制器和板载调试功能相结合，其理念是你应该将应用程序加载到板载微控制器中，并能够通过断点、监控变量、显示内存内容、查看变量值以及从许多可能性中受益来进行调试。物理上，`ATmega328P-Xmini`\
  \ 看起来像一个 Arduino Uno 扩展板。你可以焊接排针，以便像连接普通的 Arduino Uno 板一样连接任何设备。\n\n虽说 `ATmega328P-Xmini`\
  \ 是一个带有板载硬件调试功能的 Arduino Uno 板，但它刚拆箱时的外观令人惊讶。它比 Arduino Uno 板稍大一点，带有一个小凸起，你可以在其中插入\
  \ Mini USB 线缆。它不附带排针；你会立刻注意到沿一侧有七排孔，另一侧有六排孔。这些在产品文档中均有引用（参考文献 - 基于硬件的调试第 336 页）。其中两行设计与\
  \ Arduino 引脚配置（`RX`、`TX`、模拟引脚等）完全一致。当你拿到板时，先从焊接 Arduino 式排针开始。\n\n在继续之前，请注意该板的名称可能会引起混淆：`ATmega328P-XMINI`（包装盒上的）、`ATMega328P\
  \ Xplained`（板子上的）、`ATmega328P-Xmini`（用户指南上的）。在本书中，我将统一称之为 `ATmega328P-Xmini`。\n\n\
  连接 `ATmega328P-Xmini` 并使其在 `AtmelStudio V7` 中运行极其简单，完全是即插即用。以下是需要的操作：\n\n*   通过\
  \ USB 线缆将板子连接到串口。\n*   打开 `AtmelStudio` 并导入 Arduino 项目（我在我的 `MemMgt` 应用上就是做的）。你会立即被\
  \ `AtmelStudio` 在工作区域左侧部分对板子的彩色显示所困扰。\n*   将项目目标配置为 `DEBUG`（调试）。\n*   在 C 和 C++\
  \ 选项部分关闭优化，并在编译器选项中添加 `-fpermissive`。\n*   将设备设置为 `ATmega328P`。\n*   打开 Arduino\
  \ IDE，任意一个项目，设置所需的板子。这将启用 `Serial.prints`。9600 波特率似乎是固定的。就是这样。完成这些后，假设你已正确导入了 Arduino\
  \ 项目，它会自动将 `.hex` 文件上传到微控制器。\n\n## 2. ATmega2560RFR2 Xplained Pro\n\n`ATmega2560RFR2\
  \ Xplained Pro` - 用于 RF 通信的专用硬件，与 Arduino 板引脚不兼容，已成功使用。`ATmega2560RFR2 Xplained\
  \ Pro` 并不是标准的 Arduino `ATmega2560` 加调试器（不像小型 `ATmega328P-Xmini` 那样）。`2560 Xplained\
  \ Pro` 是测试 RF 通信的专用硬件。它不支持标准的 `ATmega2560` 引脚，也不用于 Arduino `ATmega2560` 程序的硬件调试。但我还是决定购买它，因为我找不到大内存空间的硬件调试替代方案。而且价格便宜——花了\
  \ 35 美元。\n\n我在定稿时收到了这块板。和 `ATmega328P-Xmini` 一样，我将板连接到电脑（PC - Windows 10），打开 `AtmelStudio\
  \ V7` 并导入 `MemMgt` 程序，设置了编译器选项、设备和调试板。一切进展顺利，除了一个缺点：我无法通过串口控制台获取输出。这是我的初步体验：\n\n\
  *   `AtmelStudio` 无错误编译了 `MemMgt` 并将执行文件上传到板上。到为止一切良好。\n*   我可以在任何需要停止程序的地方放置断点查看变量。太棒了！\n\
  *   我无法通过 `Serial.prints` 获取任何输出。该板确实提供了一个虚拟串口，可能用于在串口终端中可视化打印内容。这还有待尝试。\n\n\n\n\
  \n-   `Arduino IDE` 无法识别该开发板，但它能够将 `ATmega328P-Xmini` 识别为 `UNO`。\n-   `ATmega2560RFR2\
  \ Xplained Pro` 几乎缺少标准 `Arduino ATmega2560` 上找到的所有引脚。\n-   通过串口通信或其他协议与应用程序进行接口可能会出现问题。\n\
  \n结论是，在 `ATmega2560RFR2 Xplained Pro` 上硬件调试 Arduino 程序是可行的，但要让它处理基于引脚的 IOO 和串口通信仍需进行大量工作。我仍在寻找与\
  \ `ATmega2560` Arduino 引脚兼容的硬件调试器。\n\n### 1. Atmel ICE\n\n#### 硬件级调试[AUX]Atmel ICE\
  \ - 调试 Uno 或 Mega 失败\n几年前，由于我的开发环境过去是现在仍然是 `ATmega328P`/`ATmega2560` 组合，我选择了 `Atmel\
  \ ICE`。理由很简单：使用 `Atmel` 工具在 `Atmel` 微控制器上进行开发，该代码在 `Atmel IDE` 内部编译，并由 `Atmel` 硬件调试器进行调试。我完全不知道这个选择会带来多少时间和挫败感。如果你对我经历的体验感兴趣，请继续阅读；否则，请跳转下一节（串口调试第\
  \ 125 页）。以下是故事。\n\n我天真地认为按照说明操作，就能体验到成功的硬件调试。我勤奋地做了功课：YouTube 视频、网页以及 `Atmel` 手册。然后我通过\
  \ `ISP` 接口将 `Atmel ICE` 连接到 `ATmega2560` 板上，然后在 `AtmelStudio` 中点击“Start Debugging”（开始调试）和“Break”（中断）。\n\
  \n只有当微控制器制造商在芯片内部构建了支持机制时，硬件调试才是可能的。目前的标准机制似乎是 `JTAG`。它的功能远超调试，它还允许通过管理单个微控制器引脚来调试\
  \ `PCB`。这些引脚可以被编程为发送和接收数据，以测试 `PCB` 的响应。它还提供了硬件调试功能：可以在源代码中设置断点、查看并修改变量等，从而让程序员能够近距离观察其应用程序的行为。\n\
  \n`debugWire` 是一种类似于 `JTAG` 的协议。它是 `Microchip` 为其某些较小的 `Atmel` 微控制器提供的。简而言之，`ATmega328P`\
  \ (`Arduino UNO`) 支持 `debugWire` 但不支持 `JTAG`。`ATmega2560` 则反之——它支持 `JTAG` 但不支持 `debugWire`。无论使用哪种标准（无论是\
  \ `debugWire` 还是 `JTAG`），都需要硬件调试器。\n\n考虑到它的功能，`Atmel ICE` 是一个廉价的工具。大约 120 美元的价格非常值得投资，因为可以节省大量的调试时间。于是，我买了一个，并按照几个\
  \ YouTube 教学视频操作。看起来相当简单。基本上：\n\n*   AtmelStudio（硬件级调试)[AUX]YouTube Atmel ICE 教程：首先安装\
  \ `AtmelStudio V7`。在安装 `AtmelStudio` 之前，务必**不要**连接 `Atmel ICE`。如果你这样做，Windows 将安装错误的\
  \ `Atmel ICE` 驱动程序，导致你在尝试解决驱动问题时经历漫长而沮丧的夜晚。\n*   通过提供的 `micro-USB` 线将 `Atmel ICE`\
  \ 连接到电脑。正确的驱动程序会自动下载。\n*   连接你将工作的板。打开 `AtmelStudio` 在 `Project Properties`（项目属性）窗口中定义设备。\n\
  *   关闭 `C` 和 `C++` 优化，并将配置（profile）设置为调试（debugging）。\n*   进入 `Project Properties\
  \ Tools`。选择 `Atmel Ice` 调试器并选择 `debugWire`。\n*   现在可以开始了。设置断点并开始调试，逐行步进程序，查看变量的值。你可以做很多事情。这就是一个\
  \ `Atmel` 代表在 YouTube 视频中所说的。够简单吗？一言以之，不！！！\n\n接下去是我尝试让 `Atmel ICE` 在 `debugWire`\
  \ 模式下配合 `ATmega2560`，以及随后配合 `ATmega328P` 微控制器运行的经历。我上面提到过 `ATmega2560` 不支持 `debugWire`，它只支持\
  \ `JTAG`。但在开始使用 `Atmel ICE` 调试时，我并不知道这一点。我应该先说明，我是一个进行硬件调试的完全新手。我的方法是遵循说明并寄予好运。在读完\
  \ `Atmel ICE` 手册、观看 YouTube 视频并在互联网上搜索后，我认为需要做的只是将 `Atmel ICE` 连接到板上并激活 `debugWire`。当时，我并没有意识到还有第二个标准（`JTAG`），并且选择哪一个（`debugWire`\
  \ 或 `JTAG`）取决于使用的微控制器。为我辩护一下，没有任何视频、手册等明确提到过这种二分法。\n\n我首先尝试在 `debugWire` 模式下在 `Arduino\
  \ ATmega2560` 板上使用 `Atmel ICE`，因为 `Atmel` 的 YouTube 视频显示只需要在应用程序的项目属性工具选项中选择 `debugWire`\
