  *   **AtmelStudio (编辑器)[AUX]内联任务提供重命名、创建、声明等多选文本框** 内联函数任务 (第 53 页) - 当光标位于函数上时，会出现一个微小的箭头，指向函数名称下方。点击它——它将显示一个包含各项任务的多选文本框：重命名、创建声明、显示引用等。\n\
