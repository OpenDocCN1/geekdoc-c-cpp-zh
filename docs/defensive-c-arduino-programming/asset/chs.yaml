  \ (第 261 页） - 将字节数据存储在位域中，通过基于枚举的 `Get` 和 `Set` 函数进行访问。\n* 数据组框架（附录） (第 265 页） -\
  \ 通过通用的 `Get` 和 `Set` 函数处理顺序或基于键的多个固定或变长度记录。该系统实际上是一个微数据库，可以将数据存储在任何支持字节级访问的设备中。\n\
