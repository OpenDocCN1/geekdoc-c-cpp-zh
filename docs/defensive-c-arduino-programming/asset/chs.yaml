  \n随后，我灵灵光一现。如果尝试我在 `Arduino Uno`（`ATmega328P`）上使用 `Atmel ICE` 呢？我知道这将是一个毫无意义的练习，因为我不会使用\
  \ `ATmega328P` 进行调试。它太小了，但我想要体验基于硬件的调试。我将其连接上，令我惊讶的是，我终于获得了将 `Atmel ICE` 配置为 `debugWire`\
  \ 模式的选项！！！太好了，我获得了一个重新开始的机会。我可能仍然能让硬件调试工作起来。我选择了 `debugWire`，并期待进行硬件调试。我真的很想尝试一下，并发现这一概念背后的前景。我终于要进行真正的专业工作了。但那还没有考虑到潜伏在\
  \ `Atmel ICE` 阴暗角落里的那些小魔鬼。我的第一次调试尝试产生了一个错误状态，即常见的 `Got 0xC0` 而不是 `0x00`。真是愚傻！我没有设置\
  \ `DWEN` 熔丝（debugWire 启用）。于是，我打开了 `AtmelStudio` 编程设备窗口并设置了熔丝。我天真地认为事情会顺利，但无济于事。我仍然收到了那个臭名昭彰的消息，所以我撤销了操作——恢复到禁用\
  \ `DWEN` 熔丝。令我惊讶的是，我再无法访问熔丝了。它们都变灰了。此外，我发现我无法再向我的开发板上传程序（sketch）了。看来我又弄坏了一块板（实际上是微控制器坏了，而不是板子）。我通过更换一个全新的\
  \ `ATmega328P` 验证了这一点。这解决了问题。我可以再次上传程序了。那个损坏的微控制器拒绝配合。它就此掉进了坏板、坏微控制器和坏元件的垃圾桶。\n\n\
  尝试使用 `Atmel ICE` 进行硬件调试是一次充满挫败感的经历，花费了大量时间却几乎没有成功。我确实学到了很多关于微控制器的知识，但我最终未能通过 `Atmel\
  \ ICE` 为 `ATmega2560` 或 `ATmega328P` 配置硬件调试。\n\n另外一点值得提。`ATmega328P` 数据书中关于 `debugWire`\
  \ 的几页包含了有趣的内容，但它没有提到 `JTAG`。相反，`ATmega2560` 数据书（445 页）既没有提到 `debugWire` 也没有提到 `DWEN`\
  \ 熔丝，但它有几页关于 `JTAG`。这让我得出结论：`ATmega2560` 不支持 `debugWire`。这一点在 `AtmelStudio` 中为 `ATmega2560`\
  \ 配置 `Atmel ICE` 时提供的选项得到了证实，它只提出了 `ISP` 和 `JTAG`。我这才意识到，我看过的视频是基于 `ATmega328P`\
  \ 而不是 `ATmega2560` 的。但视频并没有明确提到 `debugWire` 是 `ATmega328P` 特有的，且无法在 `ATmega2560`\
  \ 上运行。\n\n关于使用 `Atmel ICE` 进行硬件调试，我没什么话可说了。我购买了 `Atmel ICE` 并尝试用它调试。我看到的视频把这个过程描述得像切菜一样简单。不！这是一次真正令人沮丧的经历。它让我放弃了在\
  \ `ATmega2560` 上使用 `Atmel ICE` 进行硬件调试。在弄坏了两个 `Arduino ATmega2560` 开发板后，我决定够此了。未来，我将避免对其他编程器进行进一步投资，避免弄坏更多\
  \ `ATmega2560` 板的风险，也不会再忍受学习曲线的痛苦，更不会再次在这样徒劳的事情上花费大量时间。无论如何，这是我诚诚的愿望。\n\n### 调试硬件\
  \ Dragon 编程器，STK500/600 应该允许使用 HVPP 修复损坏的微控制器\n\n还有一点，`Atmel Ice` 文档确实警告用户操作不当可能会导致微控制器报废。他们指出，如果发生这种情况，可以通过他们的\
  \ `HVPP` 协议（高电压并行编程 - 在复位线上应用 `12V`）恢复微控制器。正如我之前提到的，Microchip 官网和文档毫无用处。YouTube\
  \ 上有一些信息：`Dragon Programmer`（一种旧的已停产 Atmel 设备，即使在 eBay 上也买不到）或 `Atmel AVR STK500/600`\
  \ 评估板（eBay 上售价 150 美以上）。它们很复杂，需要插拔、从排线连接器上剥电线、焊接引脚等更多黑客式的操作。由于这条路线完全不专业，我决定这不是我想走的路。\n\
  \n幸运的是，通过一份附录，Microchip 提供了 `Xplained Xmini` 微控制器/调试器板（`ATmega328P-Xmini 第 120 页`_part0020.xhtml_a8FU）。这让我能够完成之前使用\
  \ `Atmel ICE` 时惨遭失败的任务。而且有一个可靠的打印调试解决方案（见第 188 页 _part0022.xhtml_a8EU\n\n### 1.\
  \ 串口调试\n\n#### Visual Micro 无需硬件即可进行串口调试\n\n在安装 `Visual Micro (Microchip) (第 84\
  \ 页 _part016.xhtml_aKD)` 后，我看到了一个新的顶部栏菜单项 `vMicro`。它包含一个调试器选项，显示了调试类型：串口、硬件或关闭。鉴于我已经在\
  \ `ATmega328P-Xmini` 板上成功了调试，我想尝试串口调试。这正是痛苦的开始。\n\n请注意，以下讨论适用于 `AtmelStudio` 中的\
  \ vMicro。\n\n在下载新程序后，我通常在不读手册的情况下尝试。大多数软件都是易用的，这使得学习曲线很短。我发现自己通常可以开始，只需要偶尔搜索一下。这种情况在\
  \ `AtmelStudio` 和 `Visual Micro` 中都是如此。\n\n\n\n\n啊，问题可能出在哪里呢？回到 Google 搜索吧；但运气并不在我这一边。我在\
  \ Visual Micro 论坛上没有找到任何关于设置启动的信息。所以，我决定我已经充分掌握了背景，可以尝试 Visual Micro 的内联调试教程。\n\n\
  我加载了 `BlinkWithoutDelay` 示例并按照教程一步一步操作，它成功运行了。我在 `loop` 函数内部设置了一个断点；它确实停止了 LED 的闪烁。为什么\
  \ `Blink` 程序中的断点有效，而在我的 `MemMgt` 程序中不起作用呢？\n\n目录结构 - 我花了一段时间，终于揭开了为什么其中一个有效而另一个无效的原因。这与应用程序的创建方式有关。`BlinkWithoutDelay`\
  \ 程序是直接通过 Visual Micro (vMicro) New Arduino Project 菜单创建的。这创建了一个单级目录结构，包含两个子目录：`_vm`\
  \ 和 `DEBUG`。`MemMgt` 程序则是通标准的 AtmelStudio New Arduino Project 菜单创建的。这创建了一个双级目录结构，引入了\
  \ AtmelStudio 的解决方案概念（管理目录 第 39 页）。这种目录结构似乎不支持调试。并没有发出错误信息；然而，串口调试就是无效。\n\n`setup`\
  \ 和 `loop` 应该放在哪里？`BlinkWithoutDelay` 很短，适合放在单个 `.ino` 文件中；没有 `Sketch.cpp` 文件。这让我很惊讶；我原以为\
  \ AtmelStudio 要求 `setup` 和 `loop` 必须在 `Sketch.cpp` 中。我尝试通过从项目中删除 `Sketch.cpp` 并添加具有相同内容的\
  \ `MemMgt.ino` 文件来模拟 `BlinkWithoutDelay` 程序的结构。由于我已经建立了互操作性，这非常简单。在通过 vMicro 重新构建时，令我惊讶的是，我从链接器处得到了一个“未定义的引用”（undefined\
  \ reference）。显然，构建没有识别出 `MemMgt.ino` 文件，但识别了 `BlinkWithoutDelay.ino` 文件。为什么？似乎在创建\
  \ AtmelStudio Arduino 项目时，`setup` 和 `loop` 被放置在 `Sketch.cpp` 文件中。而通过 vMicro 执行相同操作时，这些文件被放置在\
  \ `.ino` 文件中，而不是 `Sketch.cpp` 文件。不遵守这一规则就会产生“找不到 setup 和 loop”的错误。\n\n如何启用调试 - 基于\
  \ AtmelStudio 的创建 Arduino 项目似乎与 vMicro 串口调试不兼容。解决方案创建一个新项目，其中 `setup` 和 `loop` 放置在\
  \ `.ino` 文件中。然后你可以将所有项目的 `.h/.cpp` 文件传输到 vMicro 项目目录，并通过文件资源管理器将它们导入 vMicro。这样做的好处之一是\
  \ Arduino/AtmelStudio 的互操作性；不需要使用 `#define` 宏来区分它们，因为它们运行在完全相同的代码上。\n\n调试会话重新编译应用程序\
  \ - 你无法直接重启调试会话；执行 `Continue`（继续）会重新编译程序。如果程序很长，这将是一种麻烦，此时你最好使用硬件调试板，如 `ATmega328P-Xmini\
  \ Uno`。但是，你可能会遇到 RAM 空间不足的问题。`ATmega2560` 串口调试提供了更大的 RAM 空间。\n\n注意事项 - 虽然我在较大的 `MemMgt`\
  \ 应用程序上成功了串口调试，但我发现我在在预定义断点处停止受到了限制。单步（Step over）、单入（Step into）、运行到光标（Run to cursor）和设置新断点（Set\
  \ new breakpoint）均无效。激活其中任何一个都会恢复程序执行；它会在下一个预设断点处停止。在调试会话期间无法定义新断点是一个严重的限制。\n\n\
  项目属性 - AtmelStudio 和 vMicro 的项目属性是相同的。\n\n数据监 - 文档表明有一个本地窗口（locals window）；它确实存在但无法操作。通过配置断点仍然可以检查局部变量，但这需要一些计划。你可以通过设置断点并对其进行配置来实现。例如，如果你想在程序执行的某处查看\
  \ `myVar`，请放置断点并在设置中添加：\n\n```\nmyVar = {myVar}\n```\n\n这相当于执行一对串口打印：\n\n```cpp\n\
  Serial.print(\"myVar = \"); Serial.println(myVar);\n```\n\n括号内部的是变量，其值会被打印；外部的是字面量文本。\n\
  \n断点也可以设置为条件触发。假设你想检测 `myVar` 的空值条件并预览某些变量的值，你可以在代码的某处添加一个断点，条件为 `myVar == null`，并像上面那样向断点的变量/值显示中添加显示项。\n\
  \n### 良好的编程实践\n\n良好的编程实践\n\n无数的书籍、文章、博客、研讨会、作者等详细说明了如何提高程序的可维护性、黄金法则 KISS 原则——简单的解决方案通常比复杂的更好）、尽早检测错误、提供健壮性、提高生产力等。编程程序和标准，无论是公司内部的、公认的，还是在会议上正式提出的，对于成功至关重要。所有大型复杂的工程，无论是飞机、摩天大楼还是操作系统，都需要定义并采用程序和标准。对于\
  \ Arduino 开发者来说，这些可能过度了，但我们确实需要遵循规则。我称之为良好的编程实践。在我的第一本书《Pragmatic C++ Arduino Programming》中提到了这些内容。在本章中，对它们进行了回顾和扩展：\n\
  \n-   **良好的编程实践 (GPP) 保持一致，特别是在命名文件、函数等时。** 保持一致 第 132 页 - 无论做什么，都要保持一致。这会节省时间并避免错误。例如，如果你决定函数使用大写，变量使用小写，请坚持这样做。这样可以减少将函数名用作变量的反之亦然。\n\
  \n-   **漏洞（避免它们）应用良好的编程实践并遵守黄金法则——检查数据，永远不要假设；进行错误处理。** 命名规范 第 132 页 - 命名应反映变量或函数的功能。小写/大写应区分变量和函数。你可能希望使用前缀来区分函数与类、枚举声明。你应该定义自己的标准并遵循它们。这将提高可读性、维护性并节省时间。\n\
  \n-   **良好的编程实践 (GPP) 缩进、代码折叠并非视觉装饰 AtmelStudio (编辑器) 缩进、代码折叠并非视觉装饰 Arduino (编辑器)\
  \ 缩进、代码折叠并非视觉装饰。** 代码格式 第 133 页 - 意味着让代码具有可读性、验证缩进，并折叠它以避免被满屏的代码淹没。\n\n可读性 - 让你的代码反映其用途。\n\
  \n缩进似乎是源代码的视觉属性。不！它是调试工具。经常使用编辑器缩进并查看结果。\n\n-   **良好的编程实践 (GPP) 离线计划，打字前思考；思考是最困难的事情\
  \ 思考是最困难的事情——需要努力。** 思考 第 135 页 - 这一点再再强调也不为过。思考是最困难的事情。人们很容易在没有考虑潜在替代方案的情况下开启漫长的旅程。这就是智慧发挥的地方。思考得越好，代码就越好，但要不要把自己误导。\n\
  \n\n\n\n\n# 良好的编程实践 (GPP)\n\n## 为代码注释的无数理由\n有无数理由说明你应该对代码进行注释。第一点是，当你几个月后回到某段代码时，你的注释将成为你的救命稻草，因为你已经忘记了你所做的一切事情。此外，如果其他人维护你的代码，他们在发现你对所工作的详细说明后，会对你感激尽尽。只需额外一点，就可以对注释进行格式化，以便通过\
  \ `Perl` 或 `Awk` 程序提取并生成文档。\n\n## 思考：在编码之前进行离线规划可以节省大量时间\n我以前说过，现在还要重复一遍：鉴于如今获取计算机资源极其方便快捷，人们很容易受到诱惑，坐在电脑前就开始编写代码，而不对问题进行充分考虑。结果往往是不得不回溯并从新的角度重新开始——这浪费了时间。\n\
  \n## 黄金准则：验证函数参数和返回值；永远不要假设任何事情\n检查、检查、检查！\n有效检查增加了应用程序的健壮性。从一开始，就对函数参数和返回值进行有效性检查。如果出现问题，进行错误处理并打印值。尽早检测错误参数将为你节省大量的调试时间。在声明变量时，**始终**，我的意思是**始终**，将其初始化为零或其他。不要假设编译器会为你初始化内容。变量初始化将改进你的算法、调试、可读性和理解。在使用函数参数之前也应该对其进行验证。错误处理和算法开发是不同的任务。编写函数代码时，始终从检查参数值开始——它们在可接受范围内吗？\n\
  \n## 验证数据：应用良好的编程实践并遵循黄金准则\n随着应用程序的展开，数据验证将揭示错误，这引发了几个问题：当检测到错误时应用程序应该做什么？应用程序应该继续吗？中止？还是填入默认值？报告错误怎么办？开发者或用户需要被告知错误的发生、位置和原因。我怎么强调都不为：错误检测和错误处理对于应用程序的健壮性至关重要。由于它是与算法一起开发的逻辑，它的状态往往被降级到待办列表中。不！在编写代码时完成它。\n\
  \n## 项目组织：将你的代码组织为单独的文件\nArduino IDE 将你的工作保存在 `.ino` 草图文件中（一个 C++ 文件）。对于小型应用，这足够了；它将包含你的类、函数、变量以及应用程序所需的任何内容。然而，随着应用程序的扩展，你需要将代码放在单独的文件中。为宏创建一个文件\
  \ (`Macros.h`)，为全局变量创建一对文件 (`Globals.h/.cpp`)，包含 `setup()` 和 `loop()` 的 `.ino` 文件，以及为类创建单独的文件对\
  \ (`h/.cpp`)。将所有内容都放在 `.ino` 文件中会让你崩溃，并导致难以管理的局面。\n\n## 监控内存使用：防止栈溢出和堆空间不足\n为了主动防止栈溢出和堆空间不足，了解程序在哪里消耗宝贵的\
  \ RAM。注意内存泄漏（未能释放内存）。\n\n## 小心宽松的编译器类型检查\n当以整数、字符指针或浮点数传递参数时，编译器是宽松的。它会允许整数代替浮点数通过等等；它是极其宽松的。\n\
  \n## 遵循 KISS 原则：简单的解决方案通常比复杂的方案更好\n当一个简单的解决方案就能很好完成工作时，开启一段漫长而复杂的旅程往往是很舒适的。这是自我的陷阱——想两次，或者尝试想象处理特定问题的几种方法。你经常会发现你的第一个方法可能是智力上的过度设计。\n\
  \n## 任务结束阶段：保持专注直到任务完成\n在执行任务时，人的注意力往往在即将完成任务时减弱。许多错误都是在这个时间点产生的。当你正要完成一项任务时，养成告诉自己的习惯：这是最容易出错的时候。\n\
  \n## 状态：良好的心理状态对于良好的工作至关重要\n当你编写代码时，你的大脑在两个水平上运行：自动驾驶水平和意识水平。你可以通过给无意识层面提供足够的空间来正确工作，从而增加无错误编码的机会：慢慢来，退一步，并定期停下来思考。这将提高你的生产力。不要急。听听你的身体在告诉你说。\n\
  \n## 使用 C++ 宏\nC++ 提供了一个允许定义宏的预处理器处理。这些宏简化了编码并提高了程序的健壮性。\n\n## 仅定义一次常量\n不要在代码中硬编码常量。相反，使用\
  \ `#define` 宏或 `const` 变量，并将它们位于 `Globals.h/.cpp` 文件或其他文件中。\n\n## 使用枚举列表：使用 #define\
  \ 宏、`const` 变量、枚举代替硬编码值\n使用 `enum` 列表（具有符号意义的列表）而不是数值来索引数组。它们使代码更具清晰性。\n\n## 参数默认初始化\n\
  这意味着你可以调用一个函数，使用的参数比定义的要少。这与宽松的类型检查相结合，可能是极其隐蔽的 bug 来源。\n\n\n\n\n\n- **良好的编程规范 (GPP)**：初始化变量（无论是局部还是全局）时，优先使用大括号。使用大括号初始化\
  \ (第 146 页) 以确保你的应用程序具有前瞻性。鉴于声明变量时有三种初始化方式：通过等号赋值、圆括号和大括号，使用大括号（如 `int x{0}`）有充分的理由。这在伴侣书籍《实战\
  \ C++ Arduino 编程》（Pragmatic C++ Arduino Programming）中有详细解释。\n\n- **良好的编程规范 (GPP)**：对结束的大括号和\
  \ `#endif` 进行注释。注释结束的大括号和 #endif (第 147 页) 以于理清错或缺失的起始/结束大括号或 `#endif`。\n\n- 在编写代码时使用编辑器的自动缩进功能\
  \ (第 147 页)。这将让你确保大括号没有缺失且位置正确。\n\n- **良好的编程规范 (GPP)**：使用代码骨架启动应用程序。始终从代码骨架开始 (第\
  \ 147 页) - 应用程序由文件组成，文件中包含执行特定工作的相关项和函数（无论它们是全局的还是类内部的）。在创建新项目或编写新类或函数时，通过复制粘贴代码骨架可以节省时间。\n\
  \n- **良好的编程规范 (GPP)**：谨慎使用 C++ 特性。**黄金准则**：不要掉入 EGO 陷阱。**EGO 陷阱**：谨慎使用 C++ 特性。谨慎使用\
  \ C++ 特性 (第 147 页) - 根据你的技能调整 C++ 编码风格——你真的需要 lambda 函数、模板、位级编码、多重继承、虚函数或 pragmas\
  \ 吗？不要掉入 EGO 陷阱。仅仅因为你觉得继承很酷，除非你确定它是当前工作的正确工具，否则不要使用它。人心是微妙的，潜意识会驱使你去做你不该做的事。\n\n\
  - **黄金准则**：做好功课，熟悉工具，更新你的 C++ 技能，不要重复轮子。做好功课 (第 148 页)；这是一个纪律问题。人们很容易屈于匆忙、急于完成任务的愿望以及编码获取结果的喜悦，而不去做绝对必要的准备工作。在开始某项重大任务之前，你应该确保：（1)\
  \ 没有人已经为你的努力提供了解决方案；(2) 你精通使用的工具；(3) 考虑到你的目标，你的 C++ 技能到位。\n\n这份良好的编程规范列表并不是详尽的。遵循这些规范是一个极好的开始。它们将通过帮助编写组织良好且经过验证的代码，为你节省大量时间并减少调试。接下来的章节将更详细描述这些内容。\n\
  \n### 1. 保持一致\n\n- **良好的编程规范 (GPP)**：保持一致，特别是在命名文件、函数等时候。采用一套程序并一如既地遵守这些程序有助于你在编写代码时提高效率。一个很好的例子是如何编写变量和函数。如果你坚持变量以小写字母开头，函数以大写字母开头，并始终保持一致，那么每当你看到一个名称时，总是知道它是一个变量还是函数。你将避免一种常见的错误：将函数赋值给变量（这在\
  \ C 语言中是完全合法的）。当你这样做时，你将函数的地址赋值给变量，这完全不是你本意要做的；编译器不会报错。这是一个典型的“陷阱”（gotcha），你通过在命名规范中保持一致可以避免它。当你翻阅伴侣书籍《实战\
  \ C++ Arduino 编程》中的 C++ 陷阱时，你会遇到几个陷阱，如果你在编写代码的方式上保持一致，这些陷阱是可以避免的。\n\n#### 1.1. 命名规范\n\
  \n- **良好的编程规范 (GPP)**：保持一致，特别是在命名文件、函数等时候。当我开始学习 C 语言编程时，我的第一本参考书是 Kernighan 和 Richie\
  \ 的《C 语言语言第一版》，当然，后来当 C++ 出现后，我潜读了 Bjarne Stroustrup 的《C++ 语言》第二版。当我阅读这些书时，它们的编程风格令我震惊：所有变量和函数都使用小写字母，名称晦涩（`p`\
  \ 表示指针，`s` 表示字符字符串，`v` 或 `val` 表示值）。读起来很困难。我决定采用一些让生活更简单的规则：\n\n- 名称对 RAM 没有影响；所以，不要犹豫写长而有意义的名字，例如用\
  \ `value` 代替 `val`，用 `firstOccurrence` 代替 `f`。定义字符串时不要用 `s1{}`，而要写 `myString1}`。可以使用下划线代替单词片段的大写，如\
  \ `Get_number_of_chars()`。这取决于个人偏好。问题在于，你应该采用一种规范并保持一致。\n\n- 变量应以小写开头；函数、枚举和类应以大写开头，例如\
  \ `JobList* jobList = new JobList()`。注意这种命名规范有多用。小写变量 `jobList` 是大写类 `JobList` 的实例。很棒！记住！C++\
  \ 是区分大小写的。\n\n- 参数以下划线开头。例如，在函数 `int MyFunction(char _delimiter)` 中，下划线将参数与局部/全局变量区分开来。\n\
  \n- 函数以及如 `struct`、`class`、`enum`、`union` 等结构以大写开头。代码 `Record nextRecord = NextRecord()`\
  \ 区分了变量和函数。\n\n- 宏系统地使用大写和下划线编写以便于阅读。这里有两个例子：\n\n```cpp\n#define XBEE_SERIAL_RX\
  \ 9 // 接收端口号\n#define XBEE_SERIAL_TX 10 // 传输端口号\n```\n\n保持一致的命名风格可以提高程序的可读性，便于维护，减少调试并提高健壮性。\n\
  \n### 2. 代码格式\n\n- **良好的编程规范 (GPP)**：缩进、代码折叠并非装饰。遵循一些外观细节可以显著提高你的生产力。小心代码格式（如可读性、缩进和代码折叠）可以让程序更易读且更不容易出错。下文将描述这些：\n\
  \n#### 2.1. 可读性\n\n关于何时以及何处包含空格的小细节非常重要。习惯用一致的方式做事。例如，写 `char* myString` 而不是 `char\
  \ *myString`。在第一种情况下，你明确表示 `myString` 是一个 `char*`。第二种情况并不清楚；你暗示解引用 `*myString` 是一个\
  \ `char`。\n\n作为良好的编程规范（第 129 页)的一部分，让名称具有意义，而不是晦涩。用 `GetNext()` 代替 `Gnxt()`。\n\n\
  此外，智能地使用空格。在编写列表（参数、枚举……）时，在逗号后加空格，不要紧凑在一起。\n\n#### 2.2. 缩进\n\n\n\n\n\n`AtmelStudio\
  \ (编辑器)[AUX]折叠类、函数、枚举、if、while 等以及 #ifdef...#endif 成对代码`\n`大括号[AUX]额外的大括号有助于代码折叠`\n\
  `大括号[AUX]AtmelStudio 不折叠大括号；Arduino IDE 会`\n`Arduino (编辑器)[AUX]折叠大括号，而 AtmelStudio\
  \ 不会`\n`宏[AUX]AtmelStudio 会折叠 #ifdef`；额外的大括号有助于跨平台代码的折叠`\n\n除了让源代码看起来美观且有条理之外，缩进具有真正的编程目的；它反映了作用域的层次结构。人们可以按照\
  \ `level 0` 作用域（全局作用域）、`level 1` 作用域（函数）、`level 2` 作用域等进行思考。这意味着在作用域级别 `1` 的块中定义的变量在作用域为\
  \ `2` 及更低的嵌套块中是可见的。\n\n缩进还有另一个作用：它可以帮助你发现错误。位置错误的大括号和括号会通过异常的左边距偏移暴露出来。最好的情况下，编译器会捕获错误并揭示问题所在。最坏的情况下，大括号/括号是平衡的但位置错误。程序编译无错误，但运行不正常。你会纳闷于为什么。\n\
  \n下面的示例说明了正确的缩进如何提高可读性，以及错误的缩进如何暴露错误。这里是一个嵌套语句块的示例：\n\n```cpp\nFoo() { // scope\
  \ level 0 // global\n    int x{0}; // foo 范围作用域\n    ...\n    if ( x == 0) {\n \
  \       int y{0}: // if 范围作用域\n        ...\n        x = ...;\n    } else { // if\n\
  \        ... 执行其他操作\n    } // if ( x == 0)\n    x++;\n    ... 继续执行\n} // Foo()\n\
  ```\n\n`x` 在 `if` 和 `else` 块中可见，但 `y` 不可见，`y` 只在 `if` 块中可见，在 `else` 块中不可。\n\n上述定义的\
  \ `Foo()` 函数包含三个作用域级别，每层两个缩进空格，因此：\n\n*   `Level 0` 对齐左边距。这是全局级别。函数具有全局作用域，除非它们定义在类内部，在这种情况下它们具有类作用域。\n\
  *   `Level 1` 缩进 2 个空格，这是函数体级别。\n*   `Level 2` 缩进 4 个空格，这些是 `if` 和 `else` 内容级别。\n\
  \n如果大括号位置不正确，应用程序可能无错误编译，但运行不会正常。因此，检查正确的缩进变成了一个重要的诊断工具。尝试加入几个错误看看发生什么：\n\n```cpp\n\
  Foo() {\n    int x{0};\n    ...\n    if ( x == 0) {\n        int y{0}:\n       \
  \ ...\n        x = ...;\n    } else { // if\n        ... 执行其他操作\n        x++; //\
  \ 错误 1 - x++ 应该在 else 的闭合大括号之后\n    } // else\n} // 错误 2 - 多了一个右大括号\n... 继续执行\n\
  } // Foo()\n```\n\n注意自动缩进是如何揭示出存在问题的：\n\n*   `x++` 缩进得太深了，但它看起来没问题，是因为它的位置错了。它应该置于\
  \ `else` 闭合大括号之后，而不是之前。`x++` 的缩进级别揭示了错误。\n*   结尾处有两个对齐左边距的右大括号。（注：原文提到结尾处有两个对齐左边距的右大括号，指的是所提供代码片段中的逻辑错误）。\n\
  \n\n\n\n\n# 良好的编程实践 (GPP)\n\n## 注释代码的无数理由\n\n人类大脑是极其卓越的。它的能力远超我们对其潜力的评估。当我们编程时，大脑会集中在手头的工作上，但在背景中，它会不断处理其他事情；它是多任务处理的。当我们开发算法时，大脑会构建一个逻辑的心理映像。它利用这个映像来指导你，无论你是在纸上画流程图还是在输入代码。在执行其中某一项时，你应该不断注释你正在操作的内容；这将帮助你理清思路。脑中的画面会越来越清晰。逻辑被转化为流程图或代码。然后你对其进行测试，当发现运行正常时，就将其定稿。此时对新开发的逻辑记忆犹新。代码中插入的注释在以后你回来增强它或适应新情况时将非常有帮助。如果你没有记录你所做的工作，很久以后你将需要重新思考并部分重新开发算法。\n\
  \n## 程序文档框架\n\n使用 `Awk` 或 `Perl` 正则表达式提取注释。基于 `Awk`/`Perl` 正则表达式注释提取创建程序文档。\n\n\
  ## 金律：注释！注释！注释！\n\n我很快意识到，我需要给我的金律列表增加一条规则；而且这是毫无悬疑的：注释！注释！注释！（参见伴随书籍 `Pragmatic\
  \ C++ Arduino Programming` 中关于金律的章节）。\n\n程序文档的重要性无论如何都不为过。通过同时完成两个任务（任务 1：开发算法和任务\
  \ 2：记录它），程序员通过解释代码在做什么的这一本身，增强了对正在开发的算法的理解。对算法的洞察力得到了增强，从而带来了更好的代码、更短的开发时间和更少的调试工作。此外，由于人的记忆是易变的，文档以后将起到解释算法内部工作原理的作用。在进行维护和增强应用程序时，它也将提供巨大的帮助。\n\
  \n在我开发基于 `Arduino` 的蜂箱称重系统时，我被正确注释代码的重要性所震撼。开始开发时，我先在纸上规划好一切，然后编写代码。我觉得纸上的工作已经足够作为应用程序的文档。这种方法起初是令人意的，但随着事情变得复杂，很快就会发现我有些疏忽。起初，我添加注释来描述函数的功能。我没有对于注释中应包含的内容或格式采用特定的规则。随着工作的进行，我决定将注释的写法正式化：函数做什么、怎么做、参数及其用途、有效性检查、返回值、调用的函数等。这导致我定义了注释模板，这些模板逐渐演变成一个框架，以便通过\
  \ `Perl` 或 `Awk` 程序提取注释，从而生成应用程序文档的一部分。参见程序文档框架（第 155 页） 和 函数创建框架（第 157 页）。\n\n\
  ### 1. 离线规划你的工作\n\n离线规划工作，在输入之前思考；思考是最困难的事情。坐在电脑前开始编写代码是如此容易，而且很有成就感。一些极其聪明的黑客（这在剧集中可以看到）可以直接从脑海到指尖完成最复杂的任务，手指飞速敲击代码，一个错误也没有。我可以针对简单的重复任务做到这一点，可能没有那么快，但只要任务变得稍微复杂一点，我发现通过在编写任何代码之前先坐在桌边在纸上将算法画成流程图，可以节省大量时间。\n\
  \n开始新任务时，从大局开始，将细节留给以后。这些细节在你测试完整体逻辑后会被填充。画流程图并记录你的思考。这些应该清晰地解释程序的架构、底层算法及其功能。在对算法工作一段时间后，你将清楚地知道自己想要做什么；然后你就可以开始编写代码了。\n\
  \n我这样做规划的好处是迫使我思考，因此一旦我坐在电脑前，就增加了算法正确运行的概率。它还有引导我对我算法进行大量注释的好处。\n\n你可能会认为这属于人为因素范畴，而不是良好的编程实践。但我认为，理解自己如何运作并据此行动是良好编程实践的一部分。\n\
  \n### 2. 永远不要假设任何\n\n遵守“金律”（见上文）。许多程序员（包括我在内）未能应用的一条金律是系统性地检查数据的有效性。如果你不遵守这条规则，应用程序早晚会让你吃苦头。\n\
  \n你应该记住，编程错误的成本（调试和测试时间）会随着开发的进行而增加。这是一个反复证明的事实；如果在函数开发期间发现了函数内部的编程错误，其成本是最低的。然而，如果在应用程序部署后才发现，成本可能会变得极其昂贵。例如：`Ariane\
  \ 5` 火箭在首次飞行期间因为一行坏代码而爆炸了。这意味着应用程序应该包含有效性检查并进行大量测试——尽早发现错误。传递给函数的任何值都应该检查其一致性，所有返回值也是如此。不要假设任何；这是一条金律。如果一个变量被传递给函数，该函数又将其传递给其他函数以此此类推，请在每个函数中检查它的一致性，因为中间函数可能会意外地修改它。\n\
  \n验证函数参数和返回值；永远不要假设任何。应用良好的编程实践并遵守金律——检查数据，永远不要假设任何；处理错误。\n\n始终检查参数值是否在接受范围内。如果你传递一个指针，确保它是有效的。如果你传递一个索引，确保它在范围内。有许多情况需要验证以便安全安全进行。数据在使用之前需要验证；永远不要假设任何。\n\
  \n通过坚持“永远不要假设任何”的准则，有效性检查应该是常态，这是一个有利于程序稳健性的关键过程。你永远不知道会因为假设了某些事情而吃苦头。我敢断言，花在有效性检查和报告上的时间比实现算法的时间要多。函数要么正确执行，要么遇到可能中断其正常执行的错误。一旦检测到错误，决定做什么，停止应用程序，或通知并继续。这是一个典型的例子：`malloc`\
  \ 执行了它的工作吗？\n\n```\nchar *lastName = (char*) malloc (100);\n\nif (lastName == 0)\
  \ {\n\n    ... 处理错误\n\n}\n```\n\n\n\n\n\n在执行 `malloc` 后，测试 `lastName` 的值并处理错误（如果有的话）。上述是典型的做法。问题在于：你将如何实现数据有效性检查？调用函数如何处理被调用函数无法正常工作的事实？这一主题将在下一节中介绍。\n\
  \n## 1. 错误处理\n\n`验证数据[AUX]应用良好的编程实践并遵循黄金法则——检查数据，永远不要假设任何事情；进行错误处理` `良好的编程实践 (GPP)[AUX]不要忽略有效性检查和错误处理——检查、检查、再检查!`\
  \ 数据验证检测到参数的值超出了范围。但那时你该怎么办？函数是否应该返回一个特定值来信号错误的发生？你是否应该继续执行程序的执行？在什么情况下？大多数情况下，应用程序应该停止并报告错误。以下是潜在的意外状况列表：\n\
  \n* 参数是否在可接受范围内？\n* 算法是否生成了正确的值？\n* 使用的函数是否触发了错误？\n*  `switch` 语句通过 `default` 退出是否可以接受？\n\
  *   打开自己的数据库是否成功？\n*   搜索数据库是否成功？\n*   等等。可能会出现更多问题。\n\n我提议了几种错误解决方案：\n\n* 返回一个特定的错误值，调用函数可以对其进行测试以确保一切无碍。返回值可以是一个指定错误发生的唯一值。\n\
  * 函数返回 `true/false` - 函数可以设计为始终返回 `true/false`，以指示它们是否正确完成了工作。如果函数在执行工作时遇到错误，它将返回\
  \ `false`。例如，如果在查找名称时无法打开数据库，则返回 `false`；但如果成功打开了数据库但没有找到搜索的名称，则返回 `true`。第一种结果是错误：数据库打开了吗？第二种结果是正常的：搜索的名称找到了吗？打开打开是一个严重错误，可能会中断程序的流程。未找到名称可能是一种正常情况，例如插入新联系人而不是修改现有联系人。\n\
  * 通过错误处理函数终止应用程序是处理错误的一种整洁方法。该函数可以在控制台上打印内容，向程序员发送消息，或者通过其他手段（如短信）传达信息。\n* 使用 C++\
  \ 的异常处理会将应用程序回滚到预定义的着陆点（当发生错误时，它执行 `throw`）。这是一种强大的错误处理机制。遗憾的是，它在 Arduino 环境中不可用。替代方案是使用\
  \ `longjmp/setjump` 机制长跳转回预定义的着陆点。与终止应用程序的错误处理函数相比，使用这种解决方案有一个重要优势：长跳转的目标可以根据错误的类型进行定制以继续执行。参见伪异常处理框架\
  \ (第 183 页)。\n\n简而言之，如果有效性检查报告为 OK，则必须以某种方式处理该问题。由程序员决定下一步做什么。\n\n## 2. 项目组织\n\n\
  `良好的编程实践 (GPP)[AUX]将你的代码组织为单独的文件，.ino 文件应该是很小的` `项目文件框架[AUX]常识决定了如何组织应用程序的源代码` 应用程序类似于教科书；它被组织成章节、节、小节等。可能有引言，可能还有附录。章节涵盖特定的主题，这就是为什么有目录。应用程序的组织遵循相同的模式，只是程序员在开始编写代码之前通常不会创建一组文件。通常的过程是从小开始，在一个文件（`.ino`\
  \ 文件）中，然后根据需要扩展到其他文件中。这种开发可能会变得混乱。随着开发的进行，文件会不断重新组织。如果从一开始就根据它们将要包含的内容类型组织文件会更好。起初，它们是空的，但随着开发的进行，它们将缓慢但确定地接收内容。将会有类文件、辅助函数文件、宏定义文件、全局变量文件、主应用程序入口文件等。\n\
  \n想象一个柜；每个抽屉经过正确标记，应该包含与抽屉标签一致的物品。你的项目也应该以相同的方式组织。在编写第一行代码之前，创建所有相关文件。不言而喻，代码应该被记录，最好能组织成能够让\
  \ Awk 或 Perl 程序提取注释以作为应用程序文档的形式。一个包含所有文件的骨架化项目将帮助你开始工作。参见项目文件框架（第 152 页）和始终从代码骨架开始（第\
  \ 147 页）。\n\n## 3. 监控内存使用\n\n`内存（使用)[AUX]通过内存监控函数可以避免内存分配失败` `良好的编程实践 (GPP)[AUX]监控内存——防止栈溢出和堆空间不足`\
  \ `内存（使用)[AUX]总堆是碎片化的加连续的` `内存（使用)[AUX]理解内存结构以优化内存使用` `内存（栈)[AUX]栈溢出会破坏内存分配，可能长时间内无法检测到`\
  \ `内存（泄漏)[AUX]可能是内存不足的原因，缓慢耗尽可用内存，在阶段期间不会显现` 你已经在多种测试条件下测试了你的应用程序，并发现它运行良好。你已经达到了一个让你对其稳健性感到放心的置信水平。但在实际情况下，可能会出现“小麻烦”并导致它失败：你耗尽了内存。这可以通过两种方式之一发生：\n\
  \n* 内存分配失败 - 这种事件很容易检测，只需检查 `malloc` 是否成功；赋值给 `malloc` 返回值的指针应该是非零。但这是事后之葛；你的应用程序无法继续工作；被强制停止。如果能监控可用内存会好得多，这样应用程序在内存分配失败之前就可以采取某些预防措施。你可能需要重新设计应用程序以消耗更\
  \ RAM，或者在具有更多 RAM 的微控制器上运行。无论你做什么，检查分配是否成功都能防止应用程序在错误的基础上继续。\n* 栈溢出是一个更隐蔽的错误，因为应用程序可能会破坏分配的\
  \ RAM 顶部，这不会立即显现。随着函数的调用，系统从未分配内存的顶部向下为栈帧分配内存。随着栈帧向下添加，它们可能会延伸到已分配的内存中。应用程序可能会运行一段时间，可能是几周或几个月，直到受损区域被使用。只有在这个时刻，你才被提醒存在错误。但你对原因一无所知。没有像检查指针是否非零这样的神奇机制来防止栈溢出。\n\
  \n\n\n\n\n良好的编程实践的目标之一是帮助程序员减少犯错误的概率。另一个目标是激励程序员以更具健壮性的方式设计其应用程序。伴侣读物 `Pragmatic\
  \ C++ Arduino Programming` 深入地涵盖了内存管理。它解释了内存结构、如何测量连续和碎片化内存、如何检测内存泄漏，以及如何优化内存使用。\n\
  \n## 1. 谨慎对待宽松的编译器类型检查\n\n不要依赖编译器对函数参数类型检查的宽容和默认初始化——从类型检查的角度来看，编译器不会区分 `int` 和\
  \ `char*` 函数参数。请务必小心。避免这些错误只有一种方法：双检你的工作。检查声明、实现和使用。这里有一个示例：从严格的 C 语言语法的角度来看，你可以这样写函数原型：\n\
  \n```c\nbool MyFunction(uint8_t, uint8_t, uint16_t);\n```\n\n这可以通过编译，但查看该原型时，它并不能提供太多信息。为参数添加有意义的标签会效果会好得多，例如：\n\
  \n```c\nbool MyFunction(uint8_t _index, uint8_t _count, uint16_t _value);\n```\n\
  \n遗憾的是，你不能为返回值添加标签，例如：\n\n```c\nbool _success MyFunction(uint8_t _index, uint8_t\
  \ _count, uint16_t _value); // 错误\n```\n\n它将无法编译。但你可以像这样插入 C 风格的注释：\n\n```c\nbool\
  \ /*_success*/ MyFunction(uint8_t _index, uint8_t _count, uint16_t _value);\n```\n\
  \n系统地这样做可以阐清楚函数的功能。\n\n## 2. 遵循 KISS 原则（简单至上）\n\n达芬奇曾说：“完美在于细节，但完美并非细节。”在编程时，对卓越的追求可以成为强大的动力，但它也可能是一个虚假的朋友。在尝试完成非常的工作时，你可能会把事情搞复杂，可能会陷入某种自我感动的陷阱，从而沉溺于某些不必要的复杂工作（参见节制使用\
  \ C++ 特性第 147 页）。更简单的解决方案触手可及，但并没有，你一冲向前，花费数小时将你复杂的思维转化成代码。\n\n可以确定，失败的概率随着系统组件数量的增加而增加。机器越复杂，内部部件越多，部件故障的可能性就越高。编程也是如此。随着代码规模增加，`if`\
  \ 语句、`while` 循环、`switches`、`functions`、`classes` 等越多，犯错误的概率就越高。减小代码规模，即尽可能地简化系统，应该是首要任务。\n\
  \n遵循 KISS 原则要求人们应该沿着几条路径分析问题。如果你根据第一个念头就冲向前，而没有考虑其他方法，你可能创建了一个包含许多潜在故障点的、不必要的复杂解决方案。如果你坚持下去，可能会发现一个更简单、更健壮的解决方案。\n\
  \nKISS 指令的根本目的是让应用程序更健壮——不必要的复杂性会产生 bug。遵守这条规则可能会在设计阶段消耗你的时间，但你将节省大量的调试时间，因为你的应用程序将不容易出错且更加健壮。\n\
  \n## 3. 任务收尾阶段\n\n程序员通常一次只关注一个任务：处理一个错误状况、循环一系列项目、创建一个函数、通过 `switch` 语句处理多种情况等。执行这些每一项都需要专注和集中。当一个人接近完成任务时，其注意力会减弱，从而在任务的收尾阶段变得不那么严谨。我所说的收尾阶段，是指完成正在处理的任务的细节，例如包含函数的结束大括号、插入最后的\
  \ `return` 或管理 `switch` 的 `default` 分。\n\n我将通过像 `int Foo(int param1){ ... }` 这样的函数来说说明上述内容。它将执行计算、进行数据库查询、调用其他函数等等。它的设计目标是返回一个\
  \ `int` 值。这听起来很简单，但有时函数的内部逻辑会导致在收尾阶段产生错误。考虑以下示例，它包含了三个收尾时的遗漏：\n\n```cpp\nint Foo(\
  \ int param1) {\n\n  ...\n\n  if (a > b) {\n\n    Serial.println(F(\"Error: a >\
  \ b\"));\n    return; // 错误 1 - 应该返回某个\n\n  } // if\n\n  switch(x) {\n\n    case\
  \ 1:\n      return 5;\n      break;\n    case 3:\n      return 7;\n      break;\n\
  \    default: // 错误 2 - default 应该始终包含代码\n\n      break;\n\n  } // switch\n\n} //\
  \ Foo() // 错误 3 - 函数应该始终有一个 return，即使是 void 函数也如此\n```\n\n这个示例包含了两个 return 错误和一个\
  \ switch default 错误。\n\n第一个错误涉及有效性检查 `if(a > b)` 之后的 `return`。如代码所示，如果有效性检查检测到失败，函数将在不指定返回内容的情况下返回。因此，它返回了任何内容。程序员专注于有效性检查这一任务：处理错误。一旦他/她完成了处理错误的任务，注意力就减弱了，从而遗漏了指定返回什么。这是一种人为因素导致的错误。程序员专注于处理错误状况。心理惯性驱动思维沿着一条路径运行。我称之为线性思维（专注，一次想一步，并遵循路径）。当程序员完成任务处理时，他/她开始另一个任务，忘记了指定返回值，因为\
  \ `return` 不是任务的一部分。将此称为编码的收尾阶段，它需要发散性思维（让大脑放空，让它在主题周围徘旋）。思维应该沿着并行路径多任务处理（线性思维和发散性思维）。这种人为因素错误只要稍微自律就可以解决。一旦程序员决定要检查\
  \ `a > b`，他/她应该实现骨架化的错误处理代码，例如\n\n```cpp\nif (a > b) {\n  ...\n  ... 处理错误\n  return\
  \ 0;\n} // if\n```\n\n当程序员编写如 `if`、`switch`、`function` 或其他复杂结构时，如果他/她从骨架代码开始，就能避免这种错误。\n\
  \n第二个错误涉及 `switch` 语句。`default` 情况应该包含代码，要么是为了处理正常情况，要么信号错误，因为 `switch` 永远应该通过 `default`\
  \ 情况退出。再次，程序员专注于编写几个 `case` 语句，而 `default` 成了事后才考虑。程序员确实使用了包含了 `default` 的代码段，但忽略了为它编写代码。他/她的重点在于编写\
  \ `case`。在完成这些工作后，程序员忽略了 `switch` 的 `default`，而这是收尾阶段的一部分——又是人为因素。\n\n\n\n\n\n第三个错误涉及缺失返回，它位于函数末尾，紧邻\
  \ `Foo` 函数的结束大括号之前。程序员确定函数始终会通过有效性检查或某个 `switch` 分之一退出，从而忽略了底部的返回。尽管函数认为不应该从底部返回，但在函数的结束大括号之前始终应该有一个返回语句。如果函数永远不应从底部退出，尽管如此，也应该插入一个错误代码，以防万一发生这种情况。省略这种安全特性可能会导致难以检测的故障。程序员应该从定义一个骨架类的\
  \ `Foo()` 函数开始，例如：\n\n```cpp\nint Foo(int param1) {\n    ...\n    return 0; // 好\
  \ - 函数带有一个值退出\n} // Foo()\n```\n\n### 收尾阶段\n代码骨架有助于确保某些项目不被遗漏。在创建函数时，模板可以确保项目不被遗漏。上面的示例说明了在看到终点时放松注意力如何在代码的收尾阶段导致遗漏的。程序员可以在处理细节之前从代码骨架开始，以避免犯此类错误。通过这样做，任务创建的收尾阶段从一开始初就得到了保障。大多数良好的\
  \ IDE 都提供了用于处理此类问题的代码片段。然而，编码任务（例如为上方的 `switch` 默认情况编写代码）需要练习和纪律，因此收尾阶段不应被忽视。\n\n\
  在创建函数时，你可能想要使用特别完整的函数代码骨架，就像我在函数创建框架（第 157 页）中建议的那样。它包含了注释模板以便编写函数文档。\n\n#### 1.\
  \ 状态\n良好的心理状态对于良好的工作至关重要；不要匆忙，注意休息。确保你的状态能够胜当前的工作，从而减少潜意识对你作花招的概率。思考是一个复杂的过程；它结合了意识的心理体操（例如为问题“如果我这样做会发生什么？”寻找答案）与潜意识的心理体操（例如在输入代码时编写正确的\
  \ C++ 语法）。如果你感到疲劳、压力大、接近崩溃、饥饿、寒冷或任何其他原因，可以肯定你的大脑表现会很糟糕，你的工作也会受到此影响。\n\n编写代码类似于说话：你的大脑挑选正确的词汇并正确地组合它们，而不需要你刻意思考它们。你试图传达的想法、概念需要你对其进行深思。在编码时，你的大脑在直觉上确保语法是正确的（例如在\
  \ `if` 中使用 `==` 而不是 `=`），然而，你也在专心地关注逻辑。\n\n参与诸如网球之类的体育比赛是完全相同的。你击球是一个通过多年训练形成的纯无意识过程。当你比赛时，大脑的意识部分在分析对手的策略、优势和缺点，这引导你决定决定将球击向哪里以及如何击球（向前以获得速度或向后击出短球）。\n\
  \n你应该意识到你的心理状态对于完成良好的工作至关重要。当你编写代码时，总会有你意识到应该休息一下、散散步、尽一切努力将你的状态恢复到可接受的水平。急于完成、由于注意力在别处而导致专注、加班、酒喝得稍多、抑郁……这些都是损害你工作质量的因素。保持警惕。尽一切努力使自己处于最佳状态，就像正在比赛的运动员，或者必须确保在发生紧急情况时处于良好状态以确保快速、正确响应的飞机飞行员一样。编码的成功取决于人为因素（心理学\
  \ 101）。你的心理状态越好，表现就越好。正因如此，我在配套书籍《Pragmatic C++ Arduino Programming》中专门用了一个章节讨论这个主题。意识到自己的状态绝对良好编程实践的一部分。\n\
  \n#### 2. 使用 C++ 宏\nC++ 是少数几个提供预处理器的语言之一。它是一个简单但特别的文本替换和条件包含工具。如果你发现自己反复重写某些几行代码，请将这几行重复代码替换为适当的宏或创建一个函数。\n\
  \nBjarne Stroustrup 在他优秀的著作《C++ 编程语言》第 4 版中说：关于宏的第一条规则是：除非必要，否则不要使用宏。他进一步说，几乎每个宏都说明了编程语言、程序或程序员的某个缺陷。你明白其中的要领了。根据\
  \ Bjarne 的说法，如果你大量使用宏，说明你没有正确进行编程。我可能是一个糟糕的程序员，因为我大量使用宏；但是，我认为明智地为了良好的目的使用它们是良好的编程。\n\
  \n当你在 IDE 中点击生成以编译/链接你的应用程序时，宏会由预处理器处理。它是工具链中第一个被调用的工具。它是一个纯文本/替换和条件包含工具，具有两个基本特征：\n\
  \n*   文本替换宏 - 对于宏的每一次出现处，它都会将该宏替换为其定义的相应文本。例如，假设你定义了宏 `#define BUFFER_SIZE 256`，每当预处理器遇到宏\
  \ `BUFFER_SIZE` 时，它就会将其替换为 `256`。它也可以用于避免在基于打印的调试时重复代码行；实际上，你是在进行内联。\n*   条件包含宏（如\
  \ `#ifdef...#endif` 对）允许根据宏是否定义来选择性地包含代码。它用于仅包含一次头文件并根据某些标准选择性地包含部分代码。\n*   `#include`\
  \ 宏会将指向的文件源代码粘贴。\n\n勤奋使用宏对生产力有益，因此是良好编程实践的一部分。它提高了可读性，减少了编程时间，增强了健壮性。配套书籍《Pragmatic\
  \ C++ Arduino Programming》广泛介绍了宏的创建和使用。你可以在附录中找到用于调试目的宏示例（基于打印的调试框架）。\n\n#### 3.\
  \ 仅定义一次常量\n不要在语句中直接硬编码任何内容；使用 `#define` 或 `const` 变量。例如，`#define BUFFER_SIZE 256`\
  \ 或 `const uint16_t bufferSize{256};`。会有某些让你忍不住直接硬编码某些值。以下是一个典型的示例：\n\n```cpp\n\
  WriteDataToEEPROM(0, name, 50);\n```\n\n在上述代码中，`name` 将记录在微控制器 EEPROM 的偏移 0 处。它的偏移和长度分别被硬编码为\
  \ 0 和 50。应该避免这种硬编码，但它确实发生了。随着编码的进行，`name` 一一直是 EEPROM 中的第一个项目，长度为 50，但新要求将其他内容放在第一个项目。现在，假设你想在\
  \ EEPROM 中写入 `category` 的值。\n\n```cpp\nWriteDataToEEPROM(0, category, 10);\n```\n\
  \n\n\n\n\n如果第二行代码在物理位置上靠近上面的第一行代码，你将会发现存在冲突并相应地修改第一行。然而，如果两行在物理位置上相距远，类别行将与名称行发生冲突。显然，两个数据值不能在同一时间占据同一个空间。这种类型的错误可以通过适当的\
  \ `const` 变量或 `#define` 来避免，例如：\n\n```cpp\n#define NAME_LENGTH 50 or const uint8_t\
  \ nameLength{50};\n#define NAME_OFFSET 0 or const uint8_t nameOffset{0};\n```\n\n\
  一个简单的规则是养成只定义一次数量的习惯。当你需要在应用程序中反复使用数字或其他数值时，请使用 `const` 变量或宏。\n\n### 1. 使用枚举列表 (enum)\n\
  \n`enums` 比 `#define` 宏更好；`enums` 可以同步多个数组；良好的编程实践 (GPP)：`enums` 比 `#define` 宏更灵活；常量：使用\
  \ `#define` 或 `const` 变量定义常量，并集中管理它们的位置。\n\n很少有编程语言提供如 C++ `enum` 这样的功能。这些功能被证明是非常有用的，但由于它们可能被视为高级特性，我怀疑大多数新手\
  \ C++ 程序员并不使用它们。他们而是创建 `#define` 宏，而没有意识到 `enum` 列表可以实用得多。我提议有意识地使用它们是良好编程实践的一部分。伴侣书籍《Pragmatic\
  \ C++ Arduino Programming》详细涵盖了这些内容。这里有一个短的 `enum` 使用示例。\n\n假设应用程序需要管理一组不同的水果，如苹果、橙子和葡萄。定义如下的\
  \ `fruits` 枚举列表：\n\n```cpp\nenum class EFruit: uint8_t {\n    start = 0, apple =\
  \ 0, orange, grape, ..., end\n}; // EFruit\n```\n\n可以通过 `enum` 索引访问数组项（数组同步）。考虑以下\
  \ `fruitLabels` 数组：\n\n```cpp\nchar* fruitLabels[] = {\n    \"Apple\", \"Orange\"\
  , \"Grape\", ...\n}; // fruitLabels\n```\n\n可以定义更多此类数组，每个数组项指定特定水果的某些特性。要显示水果名称，使用相应的\
  \ `enum` 可以使代码变得显式化（需要 `uint8_t` 强制转换）：\n\n```cpp\nSerial.println( fruitLabels[(uint8_t)EFruit::orange]);\n\
  ```\n\n所有由 `EFruit` 管理的数组将通过上面定义的 `enum` 列表同步。\n\n`enum` 定义包含了增强其实用性的几个特性：\n\n-\
  \ **enum 声明中的 class 是作用域限定符**：`class` - 此关键字允许将枚举项到特定的作用域，即 `EFruit` 枚举列表。因此，枚举项必须限定在相应的类空间内，如\
  \ `EFruit::orange` 所示。请注意，枚举定义列表中的 `class` 关键字与你定义类时使用的 `class` 关键字不是同一个。它们是不同的结构。\n\
  - **限定符定义了单个枚举项的大小**：`uint8_t` - 此大小限定符结构指定枚举项的大小为 `uint8_t`，默认类型是长度为两个字节的 `int`。在定义较短的枚举列表时，不需要浪费字节。记住，在后台，枚举是数值值。\n\
  - **enum 列表以 start 开始，以 end 结束**：`start = 0` 和 `end` - 由于枚举以数值列表的形式转换，`start = 0`\
  \ 设置了列表开头的值，`end` 设置了列表中的项目总数。单个枚举序列的值递增一，并将 `apple` 设置为零以使列表从零开始。这种机制允许循环遍历与 `enum`\
  \ 列表同步的数组项，例如：\n\n```cpp\nfor ( int i = (int)EFruit::start; i < (int)EFruit::end;\
  \ i++ ) {\n    Serial.println( fruitLabels[i] );\n}\n```\n\n如果向列表中添加更多水果，或者列表被打乱了顺序，则不需要修改上面的\
  \ `for` 语句。\n\n以上是关于 `enum` 列表的简要介绍；我无法想象任何不使用它们的重大应用。它们是重要的工具，也是良好编程实践的一部分。\n\n\
  ### 2. 参数默认初始化\n\n参数默认初始化 - 由于默认初始化允许你用比函数声明中更少的参数调用函数，请谨慎操作。这个功能很有用，但它可能会误导你，特别是当与糟糕的类型检查相结合时，如《注意宽松的编译器类型检查（第\
  \ 40 页）》所示。这里有一个危险的默认参数初始化示例。\n\n```cpp\nbool MyFunction(uint8_t _index, uint8_t\
  \ _count, uint16_t _value = 0);\n```\n\n如果只向函数传递两个参数，最后一个参数（`_value`）将初始化为 `0`。假设你这样调用函数：\n\
  \n```cpp\nsuccess = MyFunction( index, value);\n```\n\n你忘记了 `_count` 参数。编译器不会报错，因为它接受两个参数而不是\
  \ 3 个。而且，由于它的类型检查会认为 `uint8_t` 和 `uint16_t` 是等价的，编译器会让其通过。没有警告。应用程序将会出错，因为函数的 `count`\
  \ 变量接收了位于 `value` 中的任何内容，而函数的 `value` 变量将被设置为 `0`。太糟糕了！找到这个 bug 很难。\n\n#### 2.1.\
  \ 使用大括号初始化\n\n**良好的编程实践 (GPP)：无论是局部还是全局，都尽可能使用大括号初始化变量**。有一条金律：在声明变量时，始终初始化它们。这样做有几个理由：\n\
  \n- 全局变量在声明时保证会被初始化。局部变量（即函数内部的）没有这种保证。初始化它们！\n- 显式初始化使代码更整洁。调试时，可以将变量值与其初始化值进行比较。\n\
  - 算法可能要求变量被初始化。\n\n初始化可以通过三种方式完成：大括号、括号或等号。示例：`char* initialValue{\"Sasha\"}`、`initialValue(\"\
  Sasha\")`、`char* initialValue = \"Sasha\"` 是等的。大括号区分了初始化与赋值以及函数调用。此外，注意在某些情况下大括号初始化是唯一的选择；例如\
  \ - C++11 禁止使用括号初始化成员变量。\n\n### 3. 注释结束大括号和 #endif\n\n**良好的编程实践 (GPP)：注释结束大括号和 #endif；大括号：注释结束大括号和\
  \ #endif；宏：注释结束大括号和 #endif；注释：注释结束大括号和 #endif**。\n\n`#ifdef...#endif` 对有时会导致混乱，甚至导致错误。当代码分隔了大括号或\
  \ `#ifdef...#endif` 对时，注释结束大括号或 `#endif` 以确定它们所属将证明非常有价值。\n\n寻找位置错误或缺失的结束大括号或 `#endif`\
  \ 可能非常耗时。位置错误尤为致命，因为编译器不会报告错误；因此，程序员会满信心地继续，而没有怀疑自己刚刚引入了逻辑缺陷。系统地标记结束大括号和 `#endif`\
  \ 可以减少此类事故，并帮助发现问题所在。\n\n所有 `if`、`for` 和 `while` 的结束大括号都应该被标记，以及函数和类定义的结束。所有位于几十行之后的\
  \ `#endifs` 都应该与其相应的 `#ifdef` 一起标记。这有助于程序员定位问题，特别是当自动格式化代码揭示了缩进问题时。\n\n\n\n\n\n\
  # 错误（避免它们）\n\n## 编辑器的自动缩进可以检测错误的大括号\n自动缩进可以揭示括号和大括号使用不当。Arduino IDE 擅长自动缩进——即使你使用\
  \ `AtmelStudio` 开发，也要使用它，因为后者的缩进效果并不好（参见代码格式页第 133 页中的示例）。\n\n## 1. 始终从代码骨架开始\n\n\
  ### 良好的编程实践 (GPP)：用代码骨架启动应用\n现代 IDE（如 `AtmelStudio`）为用户提供了快速启动的代码片段；这些被称为代码段（snippets）。但这个过程可以更进一步。在创建新应用程序、新类或新函数时，建议从骨架项目和骨架代码开始，这些包含了所创建内容的大部分基础设施。\n\
  \n我在开发基于 Arduino 的蜂箱称重系统时发现，包含“待填空”注释部分的函数骨架节省了我大量时间。此外，在创建新应用时，我不再从 Arduino `.ino`\
  \ 文件从零开始，而是从一个骨架应用开始，该应用包含了主函数（`setup` 和 `loop`）以及区分各个应用组件所需的所有文件（`Macros.h`、`Aardvark.h/.cpp`、`Globals.h/.cpp`\
  \ 等）。随着我对这些骨架的开发，它们迅速演变成了框架：参见项目文件框架（第 152 页）。\n\n## 2. 节制使用 C++ 特性\n\n### 良好的编程实践\
  \ (GPP)：不要掉入 Ego 陷阱\n心理学家创造了一个我觉得在编程时特别贴切的：`EGO 陷阱`（自我陷阱）。他们说的 `EGO 陷阱`是指自我实现、自我表扬、自我拍马等。编写一个复杂的、全位的、高度通用的算法可能是非常有成就感的；如果你使用了许多高级\
  \ C++ 机制（多重继承、Lambda 函数、运算符重载等），这种感觉会更强。大脑会被“看我多聪明”和“我是一个非常优秀的 C++ 程序员”的想法所强化。这些都是幻觉，因为该算法可能很难定稿，可能满是\
  \ Bug，而且无疑会消耗大量时间。程序员已经掉入了 `EGO 陷阱`。\n\n这种情况在我身上发生过多次。在设计基于继承的链表框架时，我掉入了 `EGO 陷阱`。我花了几个小时试图让它正常工作，那是一个很棒的作品，但对于我试图解决的问题来说，这完全是过度设计。结果证明，我只是想练习新学到的\
  \ C++ 知识，纯粹的 `EGO` 编程！我最终放弃了这项工作，并想出了简单得解决方案。\n\n人应该听从潜意识。当你踏上一段设计无意且不必要的算法的长旅程时，一个微小的背景声音会逐渐显现：“嘿，你确定这是正确的路径吗？”有些人在步步前行时很快就能听到这个小声音（对我我很幸运，我属于这一类）；而其他人尽管潮水汹涌、海浪滔天仍会继续，将自己锁在无法逃避的长旅程中。结果在功能上可能是正确的，但开发和调试成本可能过高，解决方案可能缺乏健壮性。这种行为可以归因于\
  \ `EGO 诱惑`。你编程不是为了解决问题，而是为了向自己证明你有多聪明、多优秀。\n\n## 3. 做好作业\n\n### 良好的编程实践 (GPP)：做好功课，熟悉工具，更新你的\
  \ C++ 技能，不要发明轮子\n你有多少次在没有做初步研究的情况下就直接投入工作，而这些研究本可以为你节省大量时间？可能会有更好的工具来实现你的意图；此外，解决方案的一部分可能已经存在于库中了。在开始新项目时，彻底搜索互联网和\
  \ `GitHub` 应该是第一步。不要发明轮子。\n\n在搜索互联网之后，下一步是你确保你熟悉你的工具。合理地使用 C++——定义 `classes` 但不要过度使用。多重继承、运算符重载、Lambda\
  \ 函数、模板等可能并不是必要的。在将变量传递给函数时，务必理解按值传递、按地址传递和引用传递之间的区别。\n\n最后但同样重要的一是，你应该更新你的 C++\
  \ 技能——一些易于学习的功能可能对你的生产力和应用大有裨益。因此，回顾 C++ 并意识到那些你可能认为高级的功能是非常重要的，万一其中某一个恰好就是你正在解决的问题的解决方案呢。\n\
  \n配套书籍 `Pragmatic C++ Arduino Programming` 包含两个章节，涵盖了你肯定会需要的 C++ 特性（需要掌握的内容）以及高级但不太可能使用的特性（需要注意的内容）。\n\
  \n# 框架\n\n我基于 Arduino 的蜂箱称重系统相当复杂。从草图角度来看，它似乎很简单：模块通过无线电发送传感器数据到协调器；协调器汇总数据并发送相应的短信。在幕后，当必须处理所有小细节时，事情变得复杂，例如同步模块、确定如何确保时钟时间保持在之一秒以内，以及其他运行时需求。还需要解析发送到协调器的命令，以便它知道何时称重蜂箱——每天一次还是更频繁？下午\
  \ 3 点开始每 10 分钟一次？处理这些细节导致我有 35 个文件和 15000 多行代码，并且应用了两年时间。\n\n在开发基于 Arduino 的蜂箱称重系统的过程中，我必须组织代码、封装底层机制、高效管理数据以节省内存、处理错误、进行事件报告等。这些促使我创建了一组工具，我称为框架。这些框架减少了调试；增强了应用的健壮性；提高了效率；并能够生成程序文档。由于这些框架不依赖应用程序，我可以再次使用它们。你将在下面看到这样的工具。它们被分为三个类别：组织框架（第\
  \ 151 页）。注意，这些框架的源代码可以从中获取（参见关于书籍源代码的说明第 338 页）。\n\n## 组织框架\n三个框架有助于组织你的文件和源代码。它们管理文件、类、宏的内容。它们共有三个，如下：\n\
  \n\n\n\n\n-   项目文件框架 (第 152 页) - 一旦应用程序变得复杂（即当一个 `.ino`  sketch 文件的内容变得大到难以管理时），就需要将代码拆分成单独的文件来组织应用程序的内容。这促使我定义了九组或更多\
  \ `.h/.cpp` 文件对。一个项目骨架项目可以帮助你启动一个新的应用程序。\n\n-   程序文档框架 (第 155 页) - 我发现，每次在编写代码之前对工作进行记录，我的编码效率就会更高。描述一个函数可以理清思路，结果是我比不记录代码更早地运行算法。对这些注释进行格式化使得它们能够被\
  \ Perl 程序提取并生成文档。我编写了这样一个程序（参见常见错误（附录） 第 293 页 和关于书籍源代码的说明 第 338 页]）。\n\n-   函数创建框架\
  \ (第 157 页) - 函数包含算法。它们执行工作。在开始一个新函数时，我使用函数模板来组织其内容，包括以填空注释模板形式呈现的内联文档，用于描述函数的功能。这个模板被证明可以节省大量时间。\n\
  \n你将在组织框架（附录）（第 243 页）中找到更多关于这些框架的信息。\n\n## 数据处理框架\n\n<x>数据处理框架[AUX]处理数据存储、数据转换、数据压缩的框架</x>\
  \ 数据处理框架（第 158 页） 用于存储、管理和传输数据。这里共有七种，如下：\n\n-   类数据框架 (第 159 页) - 当一个类包含相同类型的数据项时，基于泛型枚举的\
  \ `Get` 和 `Set` 函数会让编程更简单且不易出错。\n\n-   数据包框架 (第 161 页) - 无线传输需要将数据划分为易于管理的数据块。这些数据块被划分为数据包以便单独传输。\n\
  \n-   格式驱动的浮点转字节转换框架 (第 162 页) - 通过将 `float` 数据转换为字节值，可以减少传感器数据的存储空间。这些数据被存储为相对于最小值的偏移量，并根据所需的精度进行调整。这样做通常可以将\
  \ 4 字节的浮点数压缩为 1 字节，从而提供显著的存储节省。\n\n-   数据组框架 (第 164 页) - 这个微型数据库系统允许按顺序或通过键存储和访问数据，支持固定长度和变长度记录。\n\
  \n-   位域存储框架 (第 166 页) - 类可以包含存储在位域中的变量而非完整的 8 字节字节，从而节省空间。单个位域大小的项目可以作为一个连续的内存空间进行管理。数据随后可以存储在\
  \ `EEPROM`、`SD card` 或任何可以留出内存块存储数据的地方。\n\n-   事件存储框架 (第 171 页) - 大型应用程序可能有其需要跟踪的预定义事件。这些真/假条件被存储在一个连续的多字节内存空间中，并通过基于枚举的\
  \ ID 进行访问。\n\n-   链表框架 (第 172 页) 是一种基于继承的链表式存储系统。派生自基类 `LinkedList` 的类可以像链表一样存储。\n\
  \n你将在数据处理框架（附录）（第 253 页）中找到更多关于这些框架的信息。\n\n## 专用框架\n\n<x>>化框架[AUX]完成各种任务的七个框架工具包</x>\
  \ 专门化框架（第 173 页） 响应内存管理和错误处理等特定需求。这里共有七种，如下：\n\n-   算法测试框架 (第 174 页) - 高效创建算法需要在编码之前进行规划。逻辑需要与工作分离。\n\
  \n-   类名和命名引用框架 (第 176 页) - 有意义的报告要求显示类名而非晦涩的 ID。当内存出现问题时，最好使用 `enum` 来标识它们。这些由报告系统使用。\n\
  \n-   内存管理框架 (第 179 页) - 监控内存使用。所有内存分配和释放的日志可以揭示内存泄漏和栈过度增长。\n\n-   伪异常处理框架 (第 183\
  \ 页) - 它模拟了 Arduino 环境中不可用的 C++ 异常处理（`try/catch/throw` 机制）。\n\n-   错误报告框架 (第 185\
  \ 页) - 如反复提到的，永远假设假设；要验证。坏值会产生警告和错误；这些会被记录在链表中。\n\n-   New 和运算符重载框架 (第 186 页) -\
  \ `new` 和 `new[]` 赋予它们无缝生成内存。\n\n-   基于打印的调试框架 (第 188 页) - 在通过串口视器打印进行调试时，`Serial.prints`\
  \ 的数量往往会失控。通过分级 `#define` 宏（全局、文件和函数级）组织打印内容，可以选择打印的内容，从而减少内存需求。\n\n-   常见错误 (第\
  \ 117 页) - 人可能犯的基础编程错误，例如在 if 语句中使用 `=` 代替 `==`。Perl 程序 FindMisdoings.pl 可以检测到潜在的\
  \ Bug。\n\n你将在专门化框架（附录）（第 272 页）中找到关于上述内容的更多信息。\n\n## 1. 组织框架\n\n<x>组织框架[AUX]三个帮助构建文件并记录源码的框架</x>我所说的组织框架指的是超越良好实践的正式组织程序\
  \ - 在此范围内介绍了三个框架：\n\n*   项目文件框架（下一节） - 组织文件（将内容放入哪个文件）是组织项目的第一阶段。创建 `.h/.cpp` 文件组，每个类一组（类之间相互依赖的情况除外），一组用于宏，一组用于全局变量，以及其他。这种组织确保了\
  \ Arduino IDE、AtmelStudio、Visual Micro、Visual Studio、VS Code 和 PlatformIO 之间的互操作性。参见互操作性\
  \ (第 21 页)]。\n\n\n\n\n\n# 程序文档框架（第 155 页）\n\n记录你所创建的内容是非常耗时的，但它将回报你对程序的更深洞察，并缩短整体开发时间。此外，几个月后，当你回到记录了文档的代码时，你会为自己的这种远见感到庆幸，因为你可以快速地进入状态。通过`程序文档框架`（第\
  \ 155 页），你可以使用 Perl 程序 `PerlProgramDocumentation.pl` 从代码中提取注释以生成程序文档。请参阅`错误行为`（第\
  \ 117 页）和`关于书籍源代码的说明`（第 338 页）。\n\n# 函数创建框架（第 157 页）\n\n函数（第 157 页）从一开始就应该具有良好的结构。在定义函数名称、参数和返回类型之后，在编写单行代码之前，还需要定义更多内容。在创建新函数时，复制/粘贴一个函数模板并填充文档模板的内容。这将迫使你对函数给予更多关注，从而增强你的洞察力和创造力。\n\
  \n这三个框架需要一点自律。它们最初会消耗一些设置时间，但结果将证明投入的时间是值得的。\n\n## 项目文件框架\n\n常识决定了如何组织应用程序的源代码。在使用\
  \ Arduino IDE 开始 Arduino 项目时，点击窗口工具栏或屏幕上某处的 Arduino 图标，Arduino IDE 会打开一个骨架 `.ino`\
  \ 文件，其中包含对 `setup` 和 `loop` 的调用；然后你在每个函数中添加代码。点击 Arduino IDE 工具栏上左侧的第二个图标（第一个是仅编译）。IDE\
  \ 将接管工作；编译代码；如果没有错误，则将其上传到板上。这假设已经通过 Arduino IDE 的“工具”菜单设置了正确的串口端口、开发板和微控制器。这种设置对于像\
  \ `Blink`（Arduino 版本的 C 语言“Hello world”）这样的小程序来说已经足够了。\n\n当事情变得复杂时，简单的 `.ino` setup/loop\
  \ 模型就不够用了。我的蜂箱称重系统项目包含 35 个文件、15000 行代码，这需要我非常有组织。随着项目的增长，我逐渐开发了一套`项目文件框架`。这有助于提高健壮性和生产力。此外，我设计了一种方案，通过使用\
  \ IDE 特有的 `#defines` 来确保不同 IDE 之间的互操作性。我没有在 `setup` 中编写应用程序的启动代码，而是将其写在一个名为 `Aardvark`\
  \ 的函数中。所有的设置工作只是调用 `Aardvark`，从而获得 IDE 之间的互操作性。详情请参阅`互操作性（第 21 页）`。\n\n### 文件组织\n\
  \n从 `Aardvark` 开始开发（由 `setup` 调用），然后扩展到其他文件。`Aardvark()`包含原始设置代码，这是互操作性的关键。类定义位于\
  \ `ClassSpecific.h/.cpp` 文件中。`HelperFunctions.h/.cpp`：服务函数。`Globals.h/.cpp`包含 `#includes`\
  \ 和全局变量；宏位于 `Macros.h` 文件。`Functions.h/.cpp` 和 `FunctionsSKL.h/.cpp`包含通用和特定特定的函数。\n\
  \n`项目文件框架`围绕九组文件构建，每组文件都对应一个特定的需求，且独立于项目的性质：\n\n*   **入口文件**：Arduino IDE：`.ino`\
  \ 文件；AtmelStudio 和 Visual Studio/Visual Micro：`sketch.cpp`；PlatformIO：`main.cpp`。`setup`\
  \ 和 `loop` 位于应用程序入口文件中。\n    **应用程序入口文件**：每个 IDE 都需要一个应用程序的主入口文件。`.ino` 文件是 Arduino\
  \ IDE 的应用程序入口文件；它包含 `setup` 和 `loop`。由 AtmelStudio 生成的 `Sketch.cpp` 和由 PlatformIO\
  \ 生成的 `main.cpp` 是各自对应的 `.ino` 文件。它们应该包含 Arduino `.ino` 文件中的所有内容。Visual Micro 不像\
  \ AtmelStudio 和 PlatformIO 那样创建自己的 Arduino 入口文件；它使用 AtmelStudio 的 `Sketch.cpp` 文件。注意，当\
  \ AtmelStudio 导入现有 Arduino IDE 项目时，会生成一个包含所有内容的 `Sketch.cpp` 文件。`.ino` 文件是 Arduino\
  \ 的入口文件（C++ 源代码）。AtmelStudio Arduino 项目入口文件 `sketch.cpp` 包含 `setup` 和 `loop`。\n\n\
  *   **Aardvark**：`Aardvark()`包含原始设置代码，是互操作性的关键。每个 IDE 都有其优点；并不是用一个替代另一个的问题。互操作性基于一组可供任何环境使用的文件。为了避免在三个文件中进行更改，我将通常在\
  \ `setup` 中的所有代码转移到 `Aardvark` 函数中。通过这样做，三个 IDE 特有的入口文件永远不会改变。每个项目的 `setup` 函数只包含一行代码：调用\
  \ `Aardvark`。对于 Arduino 强制要求的 `loop`，我留空；但它必须存在，否则链接器将生成未定义的引用。`Aardvark` 在它自己的\
  \ `Aardvark.h/.cpp` 文件对中声明并定义。随着项目的演进，只需要处理 `Aardvark.cpp` 中的 `Aardvark` 函数。执行工作的是\
  \ `Aardvark`而不是 `setup`。参见`导入 Arduino 项目 (AtmelStudio)（第 40 页）`、`互操作性（第 21 页）`以及\
  \ `PlatformIO 互操作性（第 107 页）`。\n\n*   **测试**：`Atest.h/.cpp`包含用于测试的 `ATest()`。测试代码时我在\
  \ `atest` 函数中进行。它从 `Aardvark` 调用。这使我能够进行测试而不污染 `Aardvark` 函数的内容。\n\n*   **全局变量**：`Globals.h/.cpp`包含\
  \ `#includes` 和全局变量。枚举列表、全局变量、`#includes`（其他头文件仅限于 `#include \"Globals.h\"`）以及跨越整个应用程序的内容都放在这对文件中。例如，`const\
  \ uint16_t charBufferSize{256}` 应该放在 `Globals.cpp` 中，而 `extern const uint16_t charBufferSize`\
  \ 放在 `Globals.h` 中。\n\n\n\n\n\n# 项目文件框架\n\n## Macros.h 包含宏定义\n`Macros.h` - 预处理是\
  \ C/C++ 极其特性之一。随着时间的推移，定义的应用程序范围内的宏越来越多，例如 `#define BUFFER_SIZE 256`。这些宏应该被放在 `Macros.h`\
  \ 文件中。特定于类的宏可以放在该类的头文件 `.h` 中。不需要 `Macros.cpp` 文件，因为宏是声明，它们不占用内存空间。\n\n## ClassSpecific.h/.cpp\
  \ 包含类\n`ClassSpecific.h/.cpp` - 通过数据和函数封装进行自顶而下的开发需要对类进行大量的智能使用。这些应该存储在专门的 `.h/.cpp`\
  \ 文件对中，通常每个类一个文件对。有时，将几个相关的类存储在一个文件对中可能是更好的选择，例如链表类。链表实现了两个类：`LinkedItem` 和 `LinkedList`。这两个类都声明并定义在\
  \ `LinkedList.h/.cpp` 对中。通用规则是每个类或相关类对应一个 `.h/cpp` 文件对。一个应用程序可能有 10 个、20 个、50 个……类。通过采用“一类一文件”的规则，可以提高生产力、健壮性和可维护性。\n\
  \n## HelperFunctions.h/.cpp：服务函数\n`HelperFunctions.h/.cpp` - 有时需要创建低级的、通用的非应用程序特定函数用于整个应用程序，例如字符串到数字的转换以及十六进制到十进制\
  \ ASCII 的转换。这些应该存储在专门的 `HelperFunctions.h/.cpp` 文件对中。\n\n## Functions.h/.cpp 和 FunctionsSKL.h/.cpp\
  \ 包含通用和应用程序特定函数\n`Functions.h/.cpp` - 存在区别于辅助函数的高级函数，它们不依赖于应用程序，例如用于启动的 `DoStartup`\
  \ 和关闭系统的 `DoShutdown`。在父/子应用程序中，父类和子类有共有的函数/类以及它们自有的函数/类。\n\n`FunctionsSKL.h/.cpp`\
  \ - 某些高级函数可能特定于应用程序，例如父类和子类。这些将存储在由关键字 `Functions` 和首字母标识的单独文件对中，以指示该文件对的相关内容。可以是父类的\
  \ `FunctionsPAR` 和子类的 `FunctionsCHD`。`SKL` 指的是骨架（skeleton），是我用来快速启动创建新的非类特定文件的文件对。\n\
  \n上述定义的文件组可以位于名为 `Skeleton` 的目录中，这样在开展新项目时，你可以将文件复制到新创建的项目目录中并根据需要进行调整。\n\n在项目开始时，上述内容可能有些繁琐。随着时间的推移，随着应用程序的增长，它成为构建项目的坚实基础。参见项目文件框架（附录）（第\
  \ 243 页) 关于头文件和 `Globals.h` 文件的细节。\n\n在结束项目文件框架的介绍之前，有两个关于文件包含的细节值得说明。头文件 (.h) 的内容封装在\
  \ `#ifndef MY_CLASS_H #endif` 对中以避免重复包含，因此：\n\n```cpp\n#ifndef MY_CLASS_H\n#define\
  \ MY_CLASS_H\n\n...\n\n...\n\n#endif // MY_CLASS_H\n```\n\n## 头文件 (.h) 包含在 Globals.h\
  \ 中，所有头文件 (.h) 都围绕其被包含\n`Globals.h` 是所有头文件 (.h) 包含的枢纽。它的结构如下：\n\n```cpp\n#ifndef\
  \ GLOBALS_H\n#define GLOBALS_H\n\n#include <Arduino.h>\n#include \"Macros.h\"\n\n\
  ...\n\nglobal declarations\n\n...\n\n#include \"HelperFunctions.h\"\n#include \"\
  Functions.h\"\n#include \"FunctionsSKL.h\"\n#include \"BasicClass.h\"\n#include\
  \ \"Atest.h\"\n#include \"Aardvark.h\"\n\n...\n\n#endif // GLOBALS_H\n```\n\n`#ifndef\
  \ GLOBALS_H` ... `#endif` 对确保文件只被包含一次。对于其他项目头文件，包含被集中在一个 `Globals.h` 文件中。\n\n##\
  \ 头文件 (.h) Arduino.h, Macros.h 包含在 Globals.h 文件中，Macros.h 中 #include <Arduino.h>\n\
  注意上方，`Arduino.h` 和 `Macros.h` 位于 `Globals.h` 文件的顶部，而应用程序的头文件包含在底部。这是因为 `Globals.h`\
  \ 的主体可能需要 `Arduino.h` 和 `Macros.h` 中定义的项。其他头文件位于 `Globals.h` 的底部，因为应用程序的头文件需要 `Globals.h`\
  \ 主体定义的项。\n\n## 头文件 (.h) 尊重头文件依赖关系（自顶向下）并警惕相互依赖\n你应该留意依赖关系。如果一个特定的头文件使用了另一个头文件中定义的项，则另一个头文件排在前。必须避免相互依赖的头文件。如果两个头文件相互依赖，我们就有问题了。如果\
  \ `ClassABC.h` 包含 `ClassXYZ.h` 中定义的项，反之亦然，则必须重新编写应用程序，使其存在依赖关系而不是相互依赖。\n\n# 1. 程序文档框架\n\
  \n## 程序文档框架 通过 Awk/Perl 注释提取创建程序文档\n众所周知，代码应该有详尽的文档说明。做这类工作应该是一种自律的习惯。其益处不言而喻。编写代码有许多原因：\n\
  \n- 在编写代码时的额外思考可以改进你的算法\n- 回忆过去的工作——你可能已经忘了几个月前做过的事情\n- 为可能负责维护的人提供帮助\n- 升级的知识库——在改进算法时，过去工作的文档将是无价之宝。\n\
  \n随着时间的推移，人们会忘记事情。如果代码包含了经过思考的注释，这些将在后的开发和调试期间成为宝资产。它们解释了函数的功能。此外，如果有多个程序员编写项目，良好的文档成为一个绝对要求。\n\
  \nC/C++ 程序包含许多不同的组件。它们是包含类、函数、宏、枚举、全局数据的文件的组合。小型 `.ino` 文件程序大多是自文档的，不需要特别注意；然而，当应用程序变大时，记录工作变得越来越重要，不仅对于程序员自己，也对于对项目起积极作用的人。良好的代码内文档有助于更好地使用和维护程序。\n\
  \n我们倾向于遵循阻力最小的路径，并生生地希望尽快完成工作。结果是注释通常是事后补上的（如果有的话）。为了规避这种倾向，程序文档模板帮助你立即编写文档。它变成了一个填空过程。告诉自己我必须记录我正在做的是不够的。这种态度就像新年计划——意图良好，但缺乏行动。\n\
  \n问题：需要记录什么？文档应该如何结构？文档应该是单独编写的文档，还是其内容依赖于代码中的注释？\n\n\n\n\n\n在明确理解了程序文档的需求后，问题仍然存在：什么需要被记录？当我刚开始开发基于\
  \ Arduino 的蜂巢称重系统时，我的首要任务是让程序运行起来。我有一种挥之不去的觉得，应该在开发过程中对代码进行记录。因此，我确实在逻辑复杂的地方编写了注释，但在起初，我并没有将其正式化或养成习惯。过了一段时间，文档开始变成一种日益重要的需求。这促使我缓慢而坚定地在开发代码时开始组织基于注释的文档；我描述了我在做什么。起初我是以自由格式完成此的，后来通过模板来实现。\n\
  \n记录代码是一个双管齐下的过程：自上而下和自底而上。自上而下（你的思维方式，对应用程序的全局心理映射）从应用程序入口处（入口文件中的 `MyProject.ino`、`sketch.cpp`、`main.cpp`\
  \ 文件）的大局开始，接着是文件级文档。自底而上从语句级注释开始，向上到变量级、函数级，最后是类级。\n\n*   **文件** - C++ 文件通常成对出现：声明类、函数、宏、枚举的头文件\
  \ `.h`，以及包含代码、全局和静态变量的实现文件（`.cpp`）。记录代码的首要目标是汇总关于 `.h`/`.cpp` 文件组包含的内容、其功能、工作原理、主导的算法和思想、关键变量以及任何有助于帮助程序员的相关的顶层信息。先描述森林，然后是树丛，最后是单棵树。这些文件级注释应该位于头文件（`.h`）中。它内部应该包含一个\
  \ `PROGRAM FILE` 模板，在其中编写该文件内容的重要特征。模板的细节请参见程序文档框架（附录） (第 244 页）。\n\n*   **类** -\
  \ 头文件中应包含与类数量等量的 `PROGRAM CLASS` 模板。类的函数在 `.cpp` 文件中通过相应的 `PROGRAM FUNCTION` 模板进行单独文档记录。\n\
  \n*   **函数和方法** - 函数是全局的，也可能属于某个类。它们的体部包含算法。它们接收参数，进行有效性检查，并可能返回一个值。可以通过 `PROGRAM\
  \ FUNCTION` 模板进行记录，该模板涵盖描述、参数、错误检查和返回值。\n\n*   **程序流程** - 随着应用程序变大，它将包含数百个方法和函数。由于极其复杂的相互关系，了解谁调用了谁以及谁被谁调用是非常值得的。每当函数被调用时，程序员都其插入一个\
  \ `PROGRAM FLOW` 宏，其中包含被调用的函数名。由于 Perl 程序此时通过 `PROGRAM FLOW START` 宏已经知道正在处理哪个函数，因此它可以生成一个双字段记录，第一个字段是调用者函数，第二个字段是被调用者函数。这些记录可以导出到\
  \ CSV 文件中，然后将其内容导入 Excel，以便能够按调用者函数和被调用函数进行排序。\n\n*   **宏** (`#define`) - 宏可能特别有用。记录它们是非常值得的，至少要知道它们存在以及定义在哪里，无论它们是否被注释。一个未使用的宏列表也可能很有用。这些是已定义但未使用的宏。一个单独的已注释宏的列表也会很有用。\n\
  \n*   **枚举** - `enums` 通常是宏的替代方案。记录它们是非常值得的，包括那些已创建但尚未使用的枚举。\n\n我最终想出的框架被称为程序文档框架（附录）（第\
  \ 244 页），它包含了插入到代码文件中的文档模板，以及基于 Perl 的程序，用于从文件、类、函数、程序流程、宏和枚举中提取文档。\n\n\n\n\n# 数据处理框架\n\
  \n用于数据存储、数据转换、数据压缩的框架。微控制器的内存通常是稀缺资源，这要求数据尽可能地进行压缩。在我的蜂巢称重系统中，我开发了七个处理数据的框架，统称为\
  \ `Data Handling Frameworks`（数据处理框架）。这些框架实现了更高效的内存利用、更易于编程以及改进的可维护性。\n\n*   `类数据框架`\
  \ (第 159 页` - 当类包含相同类型的变量时，通过枚举驱动的偏移量在包含这些变量的结构体中访问它们可以增加程序的健壮性和可维护性。\n*   `数据包框架`\
  \ (第 161 页` 为无线传输准备数据。数据被分成若干块，然后进一步分成数据包并一次传输一个包。用于验证数据是否损坏的校验和、数据包排序、发送的数据总量等都是提高数据完整性的机制。\n\
  *   表格驱动的`格式驱动浮点数到字节转换框架` (第 162 页` 将浮点数转换为压缩字节，反之亦然。由于通过无线传输的数据量有限，必须竭尽努力在这一点或那里挤出一个字节。例如，当湿度传感器提供\
  \ 64.7% 的读数时，我的反应是：没所谓！那又怎样？我只需要知道它更接近 60% 而不是 70%。因此，我可以将数据传输限制在一个字节内，存储以十个百分比为单位的湿度值。与其传输需要四个字节的\
  \ 64.7 值，不如传输一个只需要一个字节的数值 `6`。这种推理可以导致显著的内存节省。\n*   `数据组框架` (第 164 页` 是一种基于索引/顺序的数据存储系统，用于存储固定或可变的记录。它可以用于将数据存储在\
  \ EEPROM、SD 卡、RAM 或任何可以预留内存块并通过偏移量管理其内容的设备中。\n*   `位域存储框架` (第 166 页` - 在检查了变量可以取的值后，结论是某些变量的单独存储需求可以减少到\
  \ 1 位。对于那些少于 8 位的变量，可以使用 C++ 位域存储机制将变量的内存使用限制到极小。例如，一个 `bool` 值只需要 1 位。如果一个类包含许多位域大小的变量，可以将它们跨越多个字节进行分组。`位域存储框架`管理一个表格驱动的连续字节数组，并带有一个\
  \ `Get(myVarID, value)` 函数和一个 `Set(myVarID, value)` 函数来检索和设置值。这可以实现巨大的存储节省。\n* \
  \  `事件存储框架` (第 171 页` - 有时需要定义一个真/假条件列表，例如错误、已完成工作和里程碑。将这些称为事件。存储这些事件意味着存储 `bool`\
  \ 值。这些应该存储在 1 位的位域中，而不是单独的 8 位字节中。这样空间节省了 8 倍。事件存储被处理为连续的地址空间，因此访问单个事件可以通过一对函数处理：`Get(myEventID,\
  \ value)` 和 `Set(myEventID, value)`。\n*   `链表框架` (第 172 页` - 当单个变量的大小不异且要存储的项目数量未知时，数组存储可能会变得繁琐并且在内存方面可能是低效的。链表是一个更好的替代方案。`链表框架`提供了基类，可以通过继承为任何类提供链表存储。\n\
  \n这些框架在下方的各个框架章节中描述；对于其中某些框架，附录中有更详细的介绍（数据处理框架（附录）第 253 页`）。\n\n## 1. 类数据框架\n\n\
  ### 通过枚举驱动的偏移量通过 Get/Set 数据\n\n某些类可能需要存储多个相同类型的变量；这些变量可能长度相同，在这种情况下，可以通过数组中枚举驱动的偏移量来简化数据访问；或者具有不同长度，在这种情况下它们可以存储在结构体中。无论数据性质如何，使用\
  \ `enums`（枚举）通过允许在 `for` 和 `while` 循环中遍历项目以检查数据有效性等，丰富了数据操作的可能性。\n\n想象一个变量类型不同的类。它们必须通过专用函数单独访问。在下方的\
  \ `Employee` 类中，访问项目通常通过专用的 `Get/Set` 函数（如 `GetName/SetName`）来获取/设置名称变量。此类为每个私有变量都有一个专用的\
  \ `Get` 函数和一个专用的 `Set` 函数。\n\n在创建此类类时，应先单独创建变量和相应的 `Get/Set` 函数，如下：\n\n```cpp\n\
  class Employee {\npublic:\n    Employee() { }\n    void SetName(char* _name) { strcpy(name,\
  \ _name); }\n    char* GetName() { return name; }\nprivate:\n    char name[50];\n\
  };\n```\n\n```cpp\nEmployee empashaDoe;\nempashaDoe.setName(\"John\");\nchar* name\
  \ = empashaDoe.getName();\n```\n\n上面的做法是新手程序员会做的。为了减少设计此类类固有的编程负担，如果变量是相同类型，使用 `#defines`\
  \ 来指定数组大小是方便的改进。\n\n### 枚举同步多个数组\n\n通过如下枚举列表同步数组：\n\n```cpp\nenum class EEmployee\
  \ : uint8_t {\n    start = 0,\n    civility = 0,\n    name,\n    address,\n    ...,\n\
  \    end\n}; // EEmployee\n```\n\n单个项目的大小通过如下表格获取：\n\n```cpp\nuint8_t varSizes[]\
  \ = {\n    EMP_SIZE_CIVILITY, // size 6\n    EMP_SIZE_NAME, // size 60\n    EMP_SIZE_ADDRESS,\
  \ // size 100\n    ...\n}; // varSizes\n```\n\n因此 `Employee` 类变为：\n\n```cpp\nclass\
  \ Employee {\npublic:\n    Employee() { }\n    void Set(EEmployee _eItem, char*\
  \ _item) { // 详细实现请参附录 };\n};\n    char* Get(EEmployee _eItem) { // 详细实现请参附录 };\n\
  private:\n    struct {\n        char civility[varSizes[(int)EEmployee::civility]];\
  \ // 相同类型分组\n        char name[varSizes[(int)EEmployee::name]];\n        char address[varSizes[(int)EEmployee::address]];\n\
  \        ...\n    } charData; // 结构体\n}; // Employee\n```\n\n要获取特定变量的偏移量，将所有之前变量的大小相加，因此\
  \ `address` 从结构体地址开始的偏移量将是 6 + 60 = 66。\n\n注意上述类中专用的 `Get/Set` 函数被两个通用的 `Get/Set`\
  \ 函数取代，这些函数接收一个枚举来标识正在处理的变量。\n\n\n\n\n\n设置 `Employee` 类以使用通用的 `Get/Set` 函数需要设计工作和测试，但一旦完成，使用\
  \ `Employee` 类将变得简单得多，更不容易出错，并显著提高其可维护性。此外，它的数据处理机制可以实现为基类。你可以在类数据框架（附录）（第 254 页）中找到完整细节。\n\
  \n## 1. 数据包框架 (Data Packets Framework)\n\n`数据包框架[AUX]通过串口发送/接收数据包` 在跨串口或通过无线电传输或其他方式传输数据时，必须将数据块数据分成系统可以管理的数据包，每个数据包都被分配一个\
  \ `ID`、校验和（checksum）和序列号，以便收到的数据能够组装成一个完整的数据集。这就是`数据包框架`所做的。\n\n`数据包框架[AUX]将数据拆分成块/包`\n\
  `数据包框架[AUX]数据包包含头部（起始码、数据包大小、ID、序列信息）、正文（数据）、尾部（结束码、校验和）`\n要发送的数据被划分为若干块，每个块又被划分为数据包，数据包的大小基于传输协议的固定值。在我的应用中，由于选择了串口通信，数据包大小基于串口协议的缓冲区大小，Arduino\
  \ 上的默认大小为 64 字节——为了安全起见，我选择了 48 字节的包大小。我发现使用全缓冲区大小（64 字节）会导致稳定性问题。WiFi、无线电或蓝牙也可以以非常的方式进行管理。\n\
  \n一个数据包将包含用户数据和管理数据包传输的开销。我选择每个数据块最多四个数据包，这对应于总 169 字节的数据。如果需要发送超过最大块大小的数据，应用程序必须结构化为发送多个最大尺寸为\
  \ 169 字节的块。\n\n`数据包框架`算法从定义要发送的数据包数量开始。对于每个数据块最大 169 字节，可能需要一个或三个连续的数据包。由于第一个数据包包含块信息，因此它的数据容量小于连续后续的数据包。在创建/接收数据包时，数据被注入到/从数据包中提取，数据字节数如下：\n\
  \n*   第一个数据包：40 - 48 减数据包头部字节（6），减尾部字节（2）。\n*   后续数据包：43 - 48 减连续数据包头部字节（3），减尾部字节（2）。\n\
  \n这意味着由于头部/尾部的开销，一个块中最多可以发送 169 字节，即第一个数据包（40）加上三个连续数据包（3 * 43 = 129）。\n\n组装要发送的数据包从起始/结束分隔符开始：\n\
  \n```\nDATA_PACKETS_START_CODE 0x7E (十进制 126)\nDATA_PACKETS_END_CODE 0x7F (十进制 125)\n\
  ```\n\n`数据包框架[AUX]有效性检查：收到的数据及数据的校验和` 发送的用户数据可能包含这些值。一旦接收到起始码，预期接收 47 字节。这些字节可以是任何值。第\
  \ 48 字节应该是结束码 `0x7F`。如果字节 0 包含起始码 `0x7F` 且结束字节包含结束码 `0x7E`，则该数据包先验是完整的。然后必须通过其 `Checksum`（第\
  \ 47 字节）进行验证。算法在获取 48 个有效字节后，可以进行额外的可靠性检查。\n\n`数据包框架[AUX]数据包被拆分为头部（起始码、数据包大小、ID、序列信息）；正文（数据）；尾部（结束码、校验和）`\
  \ 每个 `Packet` 都有三个部分：头部、正文、尾部。第一个数据包的头部包含比后续数据包头部更多的信息（数据包信息）。\n\n数据包以头部开头（3 字节）：\n\
  \n*   `start code` - 第一个字节，信号数据包开始。\n*   `packet sequence` - 连续数据包中的第 n 个（最多 4 个，从\
  \ 1 开始）。\n*   `data ID` - 标识块——用户定义。\n\n数据包正文包含分布在一个或多个数据包中的用户数据，取决于数据大小。\n\n所有数据包都以尾部结束，以信号数据包结束并提供校验和（2\
  \ 字节）：\n\n*   `Checksum` - 算法计算校验和，并在接收端进行检查以确保数据没有损坏。该字节是数据包中的倒数第二个字节。\n*   `End\
  \ code` - 最后一个字节，信号数据包结束。\n\n第一个数据包包含定义其大小的额外信息（3 字节）：\n\n*   `packet count` - 发送的数据包数量。此信息是冗余的，因为数据包数量可以从数据大小得出，它用于检查数据大小的一致性。\n\
  *   `packet size` - 由于数据包大小是硬编码的固定大小，此参数不需要。它是为了未来可能的使用。\n*   `data size` - 接收端需要知道数据大小，以便确定最后一个数据包最后一个数据字节的位置。它还检查与包数量的一致性。\n\
  \n接收端管理两种错误情况：\n\n*   `数据包框架[AUX]有效性检查：收到的数据及数据的校验和` 已发送——已接收或未接收。它不指定数据是否正常。\n\
  *   `Data OK` - 信号收到的数据是否正常。校验和计算是否正确？\n\n基于 Arduino 的重量系统成为了`数据包框架`的测试平台。它已被证明是非常可靠的。\n\
  \n`数据包框架`的机制是复杂的，但其用法非常简单。更多细节请参见数据包框架（附录）（第 257 页）。\n\n## 2. 格式驱动浮点转字节转换 (Format\
  \ Driven float to byte)\n\n`格式驱动浮点转字节转换框架 (FDFBC)[AUX]将浮点值转换为打包字节并反之，打包由参数控制，DFBC\
  \ 类完成所有工作` 通过无线电通信跨网络发送数据需要尽可能压缩数据。传输的内容需要在发送端打包为字节，并在接收端从字节重建。传感器产生浮点值，由于无线电通信按字节操作，这些值无法直接传输。在这种情况下，可以创建一个\
  \ 4 字节的浮点联合体，从而逐字节地发送浮点值。但是，如果分析了发送的数据后，发现某些浮点值可以打包到一个字节或几个位，这可能证明是浪费的。\n\n定义转换过程从检查传感器可能生成的数值范围开始。由于传感器的值和范围各不同，每个传感器的浮点转字节转换都需要自定义以实现压缩。这在维护方面存在问题。\n\
  \n*   `Number of bytes` - 每个浮点变量可以打包为四个字节或更少。这是在检查了每个传感器范围后手动确定的。\n\n\n\n\n\n# 数据考虑因素\n\
  \n小数位数定义了数据的分辨率。是否应该传输 `28.7°C`（1 位小数）的温度？在管理蜂箱时，`29°C` 就足够了，不需要一位位小数所提供的额外精度。由于蜂箱的温度会在\
  \ `15°C` 到 `45°C` 之间变化，而蜜蜂在低于 `15°` 或高于 `45°` 时会死亡，因此 `15°/45°` 是维持生存所需的温度范围。这让我决定将温度偏移\
  \ `-15°`，并传输 0 到 30 之间的值。一个字节（5 位）就足够了。\n\n除数 - 原始数据值可能包含不必要的精度。以百分比的十为单位显示湿度（40%、50%...）就足够了。从实际角度来看，60%\
  \ 的湿度和 57% 没有区别。由于湿度值范围在 30% 到 100% 之间，应用 `-30` 的偏移量，将湿度舍入到最近的 `10%` 并除以 `10`。因此，传输的数据将是\
  \ 0 到 7。一个字节（3 位）即可。\n\n最小/最大值 - 传感器值处于阈值之间。湿度永远不会低于 30%。蜂箱内的温度在 `15°C` 到 `45°C`\
  \ 之间变化。调节电压读数范围将是 `4.7` 到 `5.0` 伏特等。最小值定义了一个偏移量。\n\n偏移量 - 不需要传输绝对值。传输偏移值之上的增量就足够了，并且可以减少所需的比特数。对于\
  \ `4.9` 的调节电压读数，传输的增量将是 `(4.9 - 4.7) = 0.2/divider`，结果为 `2`（除数设为 `0.1`）。相反的操作将在接收端完成。\n\
  \n## 无电限制\n\n在深入研究将浮点数转换为字节以传输数据转换机制之前，需要考虑以下无线电限制：\n\n*   数据以字节序列的形式传输。以浮点数形式呈现的传感器数据必须转换为适当大小的字节序列，并在接收端解码回相应的浮点值。\n\
  *   传感器数据可能仅为正（电压、湿度、重量），也可能正负均有（环境温度），在这种情况下需要一个偏移量来考虑负值。此外，范围可能很小（电压为 `4.7` 到\
  \ `5.0`），也可能很大（重量电压为 `0.00` 到 `50.00`，2 位小数）。这些考虑要求数据大小为几比特或一个、两个或多个字节。\n*   可以使用（最小/最大）值通过限制传输为最小值（偏移量）之上的增量来减少字节大小。例如，调节电压范围从\
  \ `4.7` 到 `5.0` 伏特 - 考虑到一位小数的需求，数据范围将在 0 到 3 之间，因此仅需 1 个字节（2 位）。\n\n## FDFBC 类\n\
  \n`FDFBC` 类应用了这些限制。它首先将以浮点数表示的传感器数据转换为一组通过无线网络传输的字节字节。在接收端，数据流被转换回单个浮点项目。\n\n该算法从一个枚举列表开始，该列表定义了一组需要传输数据的传感器，因此如下：\n\
  \n```cpp\nenum class EHiveSensors: uint8_t {\n    start = 0,\n    volts5 = 0, volts8,\
  \ tempHive, tempAmbient, humidHive, humidAmbient, body, super,\n    end\n}; // EHiveSensors\n\
  ```\n\n该算法将浮点值转换为紧凑字节反之亦然，打包通过参数控制，这些参数指定了如何将传感器浮点值转换为字节序列。这些参数（目标字节、小数位数...）存储在\
  \ `SensorDataParams` 结构中：\n\n```cpp\nstruct SensorDataParams {\n    uint8_t bytes:\
  \ 2; // 字节数（值: 1 - 4）\n    uint8_t decimals: 2; // 小数位数（值: 0 - 3）\n    uint8_t divider:\
  \ 2;// 除以 10 的倍数（值: 0-3）\n    float min{0.0}; // 可能的最小值\n    float max{0.0}; //\
  \ 最大可能值\n}; // SensorDataParams\n```\n\n### 格式驱动的浮点到字节转换框架 (FDFBC)\n\n浮点值存储在 `SensorFloatData[]`\
  \ 中。此转换过程的结果减少了要传输的 `DataPacket` 的尺寸。传感器浮点数据和传感器字节打包数据存储在各自的数组中：`float SensorFloatData[]`\
  \ 以浮点数形式存储传感器值，`uint8_t SensorByteData[]` 以紧凑字节形式存储转换后的传感器值。\n\n使用 `FDFBC` 类传输我的蜂箱称重系统的传感器数据，将字节需求从\
  \ 32 字节减少到 9 字节 - 这是一个巨大的节省。此外，由于是表驱动的，转换的变化仅限于修改控制参数，从而使调试更加容易并提高了可维护性。可以通过位域存储来实现更进一步的紧凑，但我认为这种收益不值得付出额外的工作。我计算出，在\
  \ 6 个传感器上使用位域可以额外节省两个字节。关于 `FDFBC` 类的细节可以在 格式驱动的浮点到字节转换框架（附录）（第 258 页) 中找到。\n\n\
  ## 1. 数据组框架\n\nDataGroup 框架：索引/顺序固定/变长度数据。内存（池）：EEPROM 写入限制为 100,000 次。可以确定的是，当微控制器关闭时，RAM\
  \ 中的数据将会丢失。由于实际上所有的应用程序都需要数据，提出的问题是：数据可以存储在哪里？SD 卡？还是无线处（蓝牙、互联网）？或者是 USB？如果数据量可以在微控制器的\
  \ EEPROM 中，这将是最佳选择，因为它是成本最低的。\n\n无论是联系列表、蜂箱 ID 数组还是任务列表，每一个都可以被视为具有若干特征的数据组。这些特征如下：\n\
  \n*   ID - 数据组应有一个名称以便进行识别。\n*   大小和位置 - 数据组需要存储在某处的内存中。可以是由 `malloc` 或 `new` 提供的临时内存，可以是\
  \ EEPROM 或其他地方的永久内存。\n*   存储方法 - 数据组可以被视为连续的记录列表，每个记录包含数据。这些记录是固定长度或变长度，可以按顺序访问，也可以通过键访问特定的。这本质上是一种索引顺序变长数据访问方法。\n\
  \n上述数据组概念在 DataGroup 框架中得以实现。它包含了管理微控制器 EEPROM 中数据的类和函数，但可以轻松适配于其他支持设备。\n\nDataGroup\
  \ 内存区域包含两个部分。第一个是头部；它包含了数据组的名称、描述、包括头部在内的总大小，以及指示记录是固定长度还是变长度的标记。第二个是主体；它持有按固定或变记录组织的数据。\n\
  \n头部包含了数据组的特征：\n\n*   名称和描述 - 10 和 50 字节。这些大小通过宏定义。\n*   大小是数据组所需的内存空间，包括头部。\n*\
  \   如果是固定长度记录则记录长度，否则变长记录为 0。\n*   键标记，定义了是否使用键。\n*   相应的键长度，如果不使用键则为 0。\n\n\n\n\
  \nDataGroup 的主体包含长度固定或可变的记录：\n\n*   固定长度记录 - 访问这些记录非常简单！由于每条记录的长度都是预定义的，通过在 DataGroup\
  \ 主体内部的偏移量（offset）访问记录，即记录的索引号（相对位置 -从 0 开始）乘以记录的大小。\n*   可变长度记录 - 访问这些记录要复杂一些。记录写入\
  \ DataGroup 主体时，其头部会带有记录的大小。这使得能够通过从一个记录向前跳转到下一个记录来遍历记录，直到达到所需的记录。\n\nDataGroup\
  \ 函数能够实现查找、插入、删除记录以及存储碎片整理。DataGroup 函数实现了以下功能：\n\n*   **查找记录** - 访问特定记录是应用程序的责任。可以可选地在记录中构建某种键（key）以便进行直接访问。自然地，键应该是唯一的以避免重复。键的可以是任意长度，最高不超过记录的最大尺寸。该算法通过逐一检查记录来搜索所需的记录，直到找到目标。在遍历列表时，如果处理的是变长度记录，则会逐个计算偏移量。`Find`\
  \ 函数会将所需记录的偏移量传递给 `Read` 函数。\n*   **插入记录** 取决于其类型（固定或变长）。对于固定长度记录，算法搜索一个空槽并将其插入其中。如果没有空槽，则在假设有空间的情况下将记录追加在末尾。对于变长度记录，算法将记录追加在末尾或足够大的空隙中。\n\
  *   **记录删除** - 可以逐条删除记录。要删除记录，算法通过将其数据替换为关键字 `EMPTY` 使其槽位变为非活动。这将产生空洞。\n*   **碎片整理**\
  \ - 在处理变长度记录时，在多次随机删除后，DataGroup 看起来会越来越像一块瑞士奶酪。如果空槽的总 own 超过特定的容差，则必须对 DataGroup\
  \ 主体进行重新组织以消除空洞。这被称为碎片整理。\n\n使用 DataGroup 框架而不是直接在 EEPROM 中进行硬编码已被证明是极具实用且不易出错。详情请参阅\
  \ DataGroup 框架（附录）（第 265 页）。\n\n### 1. 位域存储框架\n\n通过位域紧凑变量（bitfield packed variables）优化数据存储。位域存储框架通过使用位域紧凑变量优化了类的数据存储。在检查变量可能获得的值时，很显然，分配全部\
  \ 8 位来存储某些变量是过剩的。某些值的范围是从 0 到 31（5 位），另一些是从 0 到 63（6 位），布尔值（true/false）占 1 位，类等。在处理包含变量的类的多个实例进行工作时，使用位域可以节省大量空间。位域声明语法非常简单\
  \ - 在变量声明的末尾添加一个冒号和位数，如下所示：\n\n```cpp\nuint8_t myVar: 3;\n```\n\n`uint8_t myVar`\
  \ 声明了一个名为 `myVar` 的变量，它只占用三位内存，而不是其数据类型的全部 8 位，从而允许其他变量封装到同一个字节中。请注意，位域机制只能用于结构体和类，而不能直接在全局级别使用。消耗大量内存的数据密集型类，以及/或许多实例的类可以从此机制中获益。在创建类时，标准的步骤是：\n\
  \n*   创建一个带有构造函数、私有部分和公有部分的骨架类。\n*   添加变量；为变量分配位域；并将它们重新组织为 8 位组。\n*   为每个变量添加 Get/Set\
  \ 函数。\n\n位域存储示例，包含 3 个数组：JobData、VarsMinMax、JobLabels 数据数组。这里是我的蜂巢称重系统 `Job` 类的初稿：\n\
  \n```cpp\nclass Job {\npublic:\n    Job(){ };\n    bool GetStatus( );\n    void\
  \ SetStatus( bool _status);\n    uint8_t GetJobType();\n    …\nprivate:\n    bool\
  \ status: 1;\n    uint8_t jobType: 3;\n    …\n    bool repeatType: 1;\n    uint8_t\
  \ repeatNumber: 4;\n    dummy1: 3;\n}; // class Job\n```\n\n注意这里已经使用了位域。变量只占用它们需要的空间，不再多余。减少存储空间且不跨字节边界的最佳方法是最初在电子表格中列出变量并进行重新排列。如有必要，会添加虚拟变量来完成\
  \ 8 位块。以下是 `Job` 类变量以表格形式呈现的结果。除了最后一个可选的变量（`dummy1`）用于完成最后一个 8 位块外，并不需要虚拟变量。\n\n\
  | | Min. | Max. | Size | Offset | Byte # |\n| :--- | :--- | :--- | :--- | :--- |\
  \ :--- |\n| status | 0 | 1 | 1 | 0 | 0 |\n| jobType | 0 | 3 | 3 | 1 | 0 |\n| repeatInterval\
  \ | 0 | 10 | 4 | 4 | 0 |\n| day | 1 | 31 | 5 | 8 | 1 |\n| weekday | 0 | 6 | 3 |\
  \ 13 | 1 |\n| scheduleType | 0 | 3 | 3 | 16 | 2 |\n| hour | 0 | 23 | 5 | 19 | 2\
  \ |\n| repeatType | 0 | 1 | 1 | 24 | 3 |\n| repeatNumber | 0 | 15 | 4 | 25 | 3 |\n\
  | dummy1 | 0 | 7 | 3 | 29 | 3 |\n\n*(注：根据表格内容对原文中缺失的对应行进行了逻辑补全，以保持表格完整)*\n\n注意这里使用了位域。变量只占用它们需要的空间，不再多余。减少存储空间且不跨字节边界的最佳方法是最初在电子表格中列出变量并进行重新排列。如有必要，会添加虚拟变量来完成\
  \ 8 位块。\n\n\n\n\n\n```cpp\nchar* label; // the variable's name\n\n}; // VarsCharacteristics\n\
  ```\n\n<x>位域存储框架[AUX]`BitfieldStorage` 类需要关于存储在 `VarCharacteristics` 中变量的信息；使用位掩码对字节进行操作</x>表征位域紧凑数据的完整数据集将存储在\
  \ `VarsCharacteristics` 数组中，如下所示：\n\n```cpp\nstatic VarsCharacteristics varsCharacteristics[]\
  \ = {\n    {EJobVars::status, 1, 0, 1, \"status\"}, // status\n    {EJobVars::jobType,\
  \ 3, 0, 3, \"jobType\"}, // jobType\n    {EJobVars::repeatinterval, 4, 0, 10, \"\
  repeatInterval}, // repeatInterval\n    ...\n} // varsCharacteristics\n```\n\n将所有数据放入一个\
  \ `VarsCharacteristics` 结构体数组中，而不是通过枚举列表同步的独立数组，可以使程序更具可维护性且更不容易出错。\n\n目前为止，还没有定义任何框架，只是通过一些的编程技巧让代码更紧凑、更健壮，并且稍微更容易管理。`Job`\
  \ 类中添加了三个属性以高效存储数据：\n\n*   变量通过位域进行了维度划分，并进行了正确对齐，以避免跨越 8 位边界。必要时会添加占位变量。\n*   一个类特定的枚举列表标识了要操作哪个变量。\n\
  *   `VarsCharacteristics` 结构体数组包含每个变量的基于枚举的 ID、位大小、最小/最大值以及标签。\n\n<x>位域存储框架[AUX]通过枚举驱动的泛型\
  \ `Get`/`Set` 函数访问变量</x>上述表格通过枚举列表进行同步。然而，访问变量（无论是通过 `Get` 还是 `Set`）都要求为每个变量定义两个专用函数，因此\
  \ `jobType` 需要 `GetJobType` 和 `SetJobType` 等。由于 `Job` 类包含 10 个变量，必须定义 `20` 个这样的函数。显然，有更好的方法，特别是考虑到已经定义了一个变量枚举列表。这正是位域存储框架大显身场的地方它消除了单独的\
  \ `Get`/`Set` 函数。它用一对泛型的 `Get`/`Set` 函数对取代了它们，该函数对接收一个 `EJobVars` 枚举来标识要 `Get` 或\
  \ `Set` 哪个项，无论位域变量的总数是多少。它简化了编程并提高了了可维护性。它使用了一种简单的技术来实现这一点：变量通过其相对于基地址的偏移量进行访问。\n\
  \n由于编译器会将 `Job` 类存储其变量所需的四个字节打包在一起，因此可以通过其相对于第一个位域变量的偏移量来访问变量。例如，`ReportType` 位于偏移量\
  \ `26`，位大小为 `1`。\n\n位域存储框架的算法基于以下：\n\n*   通过变量相对于字节数组起始的总偏移量识别变量所在的字节。`RepeatType`\
  \ 位于第 `3` 字节，即第 4 个字节（`26/8 = 3`）。\n*   通过对 `2` 取模确定变量在字节内部的偏移量。称之为 `localOffset`（`26%8\
  \ = 2`）。\n*   创建一个掩码，通过对字节进行 `AND` 或 `OR` 操作来在字节 `3` 中 `Get`/`Set` `ReportType`\
  \ 的值。对于 `RepeatType`，掩码将是 `b00000100`。它是一个 1 位变量。\n*   如果执行 `Get`，将字节 `3` 拷贝到 `uint8_t`\
  \ 结果字节中，对该字节与掩码进行 `AND` 操作并右移两次。\n*   当执行 `Set` 时，将你想设置到 `RepeatType` 的值放入 `uint8_t`\
  \ 结果字节中，如上所示左移两次，并与 `RepeatType` 的掩码对字节 `3` 进行 `OR` 操作。\n\n为了让这种方法生效，需要定义一个位域字节数组，其基地址是\
  \ `Job` 存储第一个字节的地址。描述的算法使用此基地址来 `Get` 或 `Set` 在字节数组内的位域变量。它需要以下组件来完成工作：\n\n*   `mapped\
  \ bytes` - 映射内存中变量的字节数组：`uint8_t jobVarsArray[]`。\n*   `enum ID` - 操作的具体项由相应的枚举确定。在上面的示例中，将是\
  \ `EJobsVar::repeatType`，其值为 `8`（第九个变量，因为枚举从 0 开始）。\n*   `bit sizes` - `VarsCharacteristics`\
  \ 结构包含每个变量的大小。它被用于计算变量所在的总偏移量。`RepeatType` 位于总偏移量 `26`，其位大小为 `1`。\n\n<x>位域存储框架[AUX]将位域放在结构体中以便通过相对于结构体地址的偏移量轻松访问</x>`mapped\
  \ bytes` 和 `VarsCharacteristics` 数组是 `BitfieldStorage` 类函数在处理由对应枚举（如 `EJobVars::jobType`）标识的变量时使用的参数。位域变量的基地址空间是类实例的地址。例如，在上面的\
  \ `Job` 类中，获取第一个项 `status` 的地址返回的地址与 `Job` 类实例的地址相同。另一种更优雅、不易出错且更具可维护性的解决方案是将位域紧凑变量封装在一个结构体内部，使得该结构体的地址成为字节数组的起始，因此：\n\
  \n```cpp\nstruct JobVars {\n    bool status: 1;\n    uint8_t jobType: 3;\n    …\n\
  \    bool repeatType: 4;\n    uint8_t repeatNumber: 4;\n} jobVars; // struct JobVars\n\
  ```\n\n与其获取类实例的地址 `&job1` 或第一个变量 `status` 的地址来访问字节数组中的数据，不如获取结构体的地址 `&job1.jobVars`。\n\
  \n```cpp\nclass Job {\npublic:\n    Job( ... ){ ... };\n    ...\n    BitfieldStorage(\
  \ ... ) { ... }\n\nprivate:\n    struct JobVars {\n        bool status: 1;\n   \
  \     uint8_t jobType: 3;\n        …\n        bool repeatType: 4;\n        uint8_t\
  \ repeatNumber: 4;\n    } jobVars; // struct JobVars\n\n    static VarsCharacteristics\
  \ varsCharacteristics[EJobVars::end];\n};\n```\n\n整个 `Get`/`Set` 函数被 `BitfieldStorage`\
  \ 中定义的两个函数取代：\n\n```cpp\nbool SetBitfieldStorageItem((((uint8_t) EJobVars _eVar,\
  \ uint8_t _valueToSet);\nbool GetBitfieldStorageItem((uint8_t) EJobVars _eVar, uint8_t&\
  \ _valueToGet);\n```\n\n这些函数接收两个参数：一个强制转换为 `uint8_t` 的枚举用于标识要处理的变量，以及用于 `Set`/Get`\
  \ 其内容的 `uint8_t` 变量。\n\n实现位域存储框架确实会有 RAM 使用成本，因为需要为表内存。考虑到需要 `16` 个 `Job` 类实例，内存节省了\
  \ `19x6=96` 字节。考虑到位大小表的 `10` 字节成本，净节省了 `86` 字节。我并没有包含 `varsCharacteristics` 的成本，因为这些在控制和报告目的上是需要的。\n\
  \n\n\n\n\n# 事件存储框架\n\n## 事件存储框架\n### 预定义的真/假条件以每个事件字节数组 1 位的形式存储，节省 RAM\n事件是否发生是一个“是/否”的条件，例如“Sasha\
  \ 在家吗？”。他要么在家，要么不在家。应用程序可以测试事件类别：无线电传输、程序错误等。如果单个类别中的事件数量不超过 7 或 8 个，可以通过位域（bitfields）作为单独的位存储在单个字节中。然而，如果事件数量更多，则需要多个字节。\n\
  \n## 事件存储框架\n### 由枚举（enum）驱动的 Get/Set 函数获取/设置封装在字节中的事件\n事件存储框架的核心概念是，包含预定义事件的字节应被视为一个连续的内存区域。因此，如果识别出\
  \ 45 种可能的编程错误，可以通过对事件 31 执行 `Get` 或 `Set` 操作来获取或设置事件 31。在后台，在每字节 7 位的设置下，事件 31 将位于第\
  \ 5 个字节；在每字节 8 位的设置下，则位于第 4 个字节。但使用该框架的程序员不需要操心这些细节，他/她只需要关注 `Set` 或 `Get` 事件 31\
  \ 即可。\n\n## 事件存储框架\n### 256 个事件（8 位），244 个事件（7 位）\n事件存储框架以 8 位为基础时限制为 256 个事件，以\
  \ 7 位为基础时限制为 244 个事件。该框架类似于位域存储框架（Bitfield Storage Framework），因为底层原理相似：区别在于变量的大小——在事件存储框架中，变量长度为\
  \ 1 位；而在位域存储框架中，长度可以是任意 7 位。\n\n`EventStorage` 类的特征是具有两个通用函数 `Get`/`Set`，它们使用枚举来获取或设置所需的事件。\n\
  \n```cpp\nclass EventStorage {\n    EventStorage (uint8_t* _eventsArray, uint8_t\
  \ _registerSize, uint8_t _varsCount, char** eventLabels);\n    public:\n    bool\
  \ Set(uint8_t _eventID, uint8_t _eventToSet);\n    bool Get(uint8_t _eventID, uint8_t&\
  \ _eventToGet);\n    ...\n}; // EventStorage\n```\n\n## 事件存储框架\n### 由枚举（enum）驱动的\
  \ Get/Set 函数获取/设置封装在字节中的事件\n枚举列表标识单个事件以及相应的字符串标签数组。下方的枚举列表 `EProgErrors` 定义了程序错误以及相应的标签数组\
  \ `labelsProgErrors`。\n\n```cpp\nenum class EProgErrors: uint8_t {\n    start =\
  \ 0,\n    outOfBounds = 0, badAlloc, illegalDefault, ...\n    end\n}; // EProgErrors\n\
  \nchar* labelsProgErrors {\n    \"out of bounds\",\n    \"bad allocation\",\n  \
  \  \"illegal default\",\n    ...\n}; // labelsProgErrors\n```\n\n实现事件存储框架需要完成以下操作：\n\
  * 创建枚举以以标识事件。\n* 创建一个字符串标签数组，用于出于报告目的标识事件。\n* 创建一个字节数组来存储事件。该数组由 `EventStorage`\
  \ 类管理。\n* 定义事件应按 7 位还是 8 位为基础存储。\n\n## 事件存储框架\n### 可以创建特定的类来处理不同的事件类别\n此示例是通用的。可以创建特定的类来处理不同的事件类别，例如取自我的蜂巢称重系统：\n\
  * `SMScommands` - 8 位 - 标识与管理短信 相关的事件。\n* `Chores` - 8 位 - 与父子之间工作相关的事件。\n* `JoblistErrorCheck`\
  \ - 8 位 - 检查任务列表时的错误报告。\n* `ProgramError` - 7 位 - 对不应发生的事件进行错误报告，例如糟糕的内存分配、switch\
  \ 语句中的非法默认值、缺少 default 分支、变量越界等。之所以是 7 位是因为错误将通过无线电传输给父节点。父节点中的编程错误事件可以设为 8 位，因为它们不需要被传输。\n\
  * `radioTransfer` - 7 位 - 来自父子之间无线电通信的事件。\n\n在报告时，应用程序遍历所有事件类别中的所有事件，以确定是否发生了任何异常。完整细节请参阅事件存储框架（附录）（第\
  \ 269 页）。\n\n# 1. 链表框架\n\n## 链表框架\n### 链表不受项目大小和项目数量的限制；可以增长和缩小\n项目集合可以通过两种基本方式之一存储在内存中：作为数组或链表。数组的优点是易于使用，只需通过下标（如\
  \ `myArray[37]`）索引数组即可。这将直接访问第 38 个项目（第 38 个是因为 C++ 数组是从 0 开始的，37 是第 38 个项目）。这种简单性是有代价的。它带来了两个限制：数组中的项目数量是预定义的，且每个数组元素的长度也预定义为数组类型的长度。\n\
  \n链表要要灵活得多。它可以增长和缩小。堆空间是连续链接的项目数量的限制。存储变变长度的项目是另一个额外益处。将项目连接在一起是基于在每个项目上附加一个持有下一个项目地址的指针，从而实现正向列表遍历。从开始处开始每次移动一个链表项目。也可以包含一个指向上一个项目的指针，从而实现反向遍历。\n\
  \n任何类都可以转换为支持链表存储。添加一个私有变量 `next`、一个私有静态变量 `first`，以及公共函数 `GetNext()` 和 `SetNext()`。尽管类可以轻松地支持链表存储，但将列表管理分组到基类中是一个更灵活且可维护的解决方案。类定义中的链表部分在物理上将与派生类分离。\n\
  \n实现链表需要两个类：\n### 基于 LinkedItem 和 LinkedList\n### LinkedItem::GetNext 正向遍历链表直到达到所需项目\n\
  `LinkedItem` 类处理为了存储目的而链接在一起的项目。它向项目中添加了一个私有变量 `next`。它有一个函数 `GetNext()` 和一个变量 `LinkedItem*\
  \ next`。\n\n### LinkedList: GetFirst, GetLast...\n`LinkedList` 类管理列表。它有三个函数 `Append`、`GetFirst`\
  \ 和 `GetLast` 以及一个私有变量 `LinkedItem* first`。这些函数使得列表能够正向遍历。它还具有打印列表的函数。\n\n`LinkedList`\
  \ 类可以是极简的——从列表头循环并正向遍历它。列表可以通过在 `LinkedItem` 类中添加 `previous` 来增强以支持反向遍历。可以通过添加 `InsertAfter`、`Remove`、`Sort...`\
  \ 进一步增强。\n\n我在应用程序中使用链表框架用于：\n* 内存管理 - 跟踪内存分配和释放的对象列表。\n* 错误报告 - 包含警告和错误等事件的对象列表。\n\
  \n链表可以用于存储几乎任何内容的列表。将其作为基类附加到项目上，使它们变得极其灵活且易于维护和调试。实现细节请参见链表框架附录。\n\n# 2. 专门化框架\n\
  ### 七个框架工具包用于完成各种任务\n专门化框架整合了如测试、报告、内存使用、错误处理等七个框架。它们整合了既不能归类为组织框架（第 151 页）也不可能归类为数据处理框架（第\
  \ 158 页）](#part0022.xhtml_a8M2)的框架。\n\n\n\n\n\n- **算法测试框架**（第 174 页） - 算法可以被可视化为一个决策树：一个定义了待执行任务的\
  \ `if` 语句层级结构。在创建算法时，缺乏纪律的程序员倾向于进行增量编程。他们直接从思考跳跃到代码（我就属于这一类）。这并不一定是最高效的路径。逻辑应该在纸上通过流程图推导，然后编码并测试。`Algorithm\
  \ Test Framework` 提出了这样一个方案，它是一种可以节省开发时间的正式程序。\n\n- **类与函数名引用框架**（第 176 页）——包含了允许使用枚举（enums）访问类和函数名数组以用于报告的机制。这要求每个类和函数都能通过基于枚举的\
  \ ID 来识别。\n\n- **内存管理框架**（第 179 页） - 内存是宝贵的资源——了解剩余内存至关重要。这可以通过 `TotalHeap` 函数实现，但当堆内存变得临界低或高度碎片化时，它的作用有限，除非是为了触发终止以避免崩溃。了解什么消耗了内存以及内存是否被正确释放是非常重要的。该框架包含了在应用程序运行时报告内存使用的机制，从而允许程序员精确定位内存大户并采取相应行动。\n\
  \n- **错误报告框架**（第 185 页） - 谚言是：不要假设任何事情！始终验证！如果在验证变量值后检测到问题，必须进行报告。这就是 `Error Reporting\
  \ Framework` 派上用场。它会在错误和警告发生时记录日志，以便立即或稍后报告。报告错误后，应用程序必须处理它；这就是伪异常处理的用场。\n\n- **伪异常处理框架**（第\
  \ 183 页） - 错误处理始于检测和报告错误——在检测到错误后决定做什么是第二个问题。C++ 提出了异常处理来处理错误。这是一个强大且多功能的结构，遗憾的是\
  \ Arduino 环境不支持它。但 Arduino 环境支持 `setjmp/longjmp` 机制，`Pseudo Exception` 框架利用该机制来模拟\
  \ C++ 的异常处理。\n\n- **运算符重载**（第 186 页） - 记录内存分配事件记录了应用程序如何使用内存。此类记录可以通过函数完成，但 C++\
  \ 提供了一个更优雅的替代方案。`new` 和 `new[]` 运算符及其对应的 `delete` 可以被重载，以包含事件日志和其他任务。\n\n- **误操作**（第\
  \ 117 页） - 新手和疲惫的老练程序员会在 `if` 语句中反转 `=` 和 `==`，并犯其他看似平凡的误操作，导致极难检测的致命错误。Perl 程序\
  \ `FindMisdoings.pl` 有助于检测其中一些问题。\n\n这些框架在下方的各个框架章节中描述；对于某些框架，在附录中有更详细的描述（专门框架（附录）第\
  \ 272 页）。\n\n## 1. 算法测试框架\n\n- 测试程序逻辑的正式程序；逻辑与执行的工作是两个不同的概念。\n- 从流程图开始以确定算法逻辑。\n\
  - 定义执行路径和控制参数，然后填入真实代码。\n\n在我开发蜂箱称重系统的过程中某个时刻，算法的复杂性促使我开发出一种方法论，此后将其完善为一个框架：`Algorithm\
  \ Test Framework`。该框架的底层机制依赖于识别不同的执行路径，并测试相应的控制变量确实遵循了预期的路径。\n\n设计应用程序应该从纸上开始。描述应用程序应该做什么。定义它的特性和行为。绘制流程图。当结果认为足够成熟时，开始编码。创建大型应用程序的专业团队建立了一从初始分析到最终交付的完整流程。我们业余程序员经常会跳过这个过程，在没有先在纸上规划的情况下直接跳入编码，或者我们可能只将设计限制在信封背上。我的情况就是如此。我直接开始写代码，因为程序逻辑对我似乎足够清晰，或者我是这么认为的。起初，一切进展得很顺利，但很快，让某段代码正确运行证明是令人沮丧的。我花在调试代码的时间比编写代码得多。我不得不停止编码并将事情写在纸上，以使算法正常运行。\n\
  \n- 过程：深达几层的决策树。\n\n将应用程序想象成一系列过程，一个过程是一个工作单元，例如 `get sensor values`、`transmit data`、准备并发送短信。从远处看，一个应用程序可以被特征化为线性的。执行一个过程，然后执行下一个过程，依此类推。然而，一个过程可能有点复杂，因为它有一个进入决策树的入口，该树可能运行好几层。树的节点是\
  \ `if` 语句，要么做这个要么做那个，这就是过程的逻辑。这种决策树可以用其层级为特征——即 `if` 语句的深度。1 层树有两个端点。2 层树有四个端点，3\
  \ 层树有八个，依此类推。N 层树有 2N 个端点。这些端点也可以被称为执行路径，因为到达那里需要控制变量值的唯一组合。逻辑由树和相应的控制变量表示。\n\n\
  逻辑与执行的工作是两个不同的概念。例如，在条件语句中\n\n```\nif X equals 0; do A otherwise do B\n```\n\n算法定义了一个单层深的决策树。`do\
  \ A` 和 `do B` 是执行的工作。`if X equals 0` 是逻辑。关键点在于逻辑和执行的工作是不同的。这意味着在开发逻辑时，使用虚设的占位符来代表执行的工作。当逻辑被认为正确时，填入真实的工作。逻辑测试意味着检查控制变量（上述示例中的\
  \ `X`）确实产生了预期的结果。这个例子是微不足道的，但请记住决策树的大小是指数级增长。\n\n根据我的经验，逻辑测试是一个循环过程：绘制流程图 --> 定义执行路径\
  \ --> 编码 --> 检查执行并重新开始。重复此过程直到算法产生满意的结果。测试逻辑确实做了它应该做的事情是容易的。这只需要一点组织。在填充细节之前敲定大框架。当逻辑通过验证后，用真实的工作替换虚设的工作。\n\
  \n我建议以下方法论：\n\n- 从流程图开始；在纸上进行；并使用适当 `if/switch` 语句推导出逻辑。记住 `switch` 语句实际上与一组级联的\
  \ `if...else` 语句相同。\n\n\n\n\n\n- 识别执行路径；可以通过骨架决策树对逻辑进行测试，该树模拟应用程序可能遵循的各种执行路径 - 使用适当的\
  \ `#ifdefs` 进行测试，每个执行路径一个。对于每条执行路径，设置相应的变量来控制程序流。执行路径的数量随着层数呈指数级增长。\n- 定义控制参数 -\
  \ 记住，可能的执行路径数量随控制参数数量呈指数级增长：两条执行路径需要 1 个控制变量；4 条路径需要 2 个；8 条路径需要 3 个；依此类推。执行路径的数量是指数级的，最大为\
  \ `2N`，其中 `N` 是层数。控制变量的数量等于层数。创建占位符工作项以验证是否与流程图保持一致。\n- 测试 - 在定义了所有可能的执行路径后，创建/测试单个路径的场景。这应该在骨架程序中进行，而不是在正在开发的应用程序中。下一步是，将代码传输到应用程序中，并使用真实变量测试不同的场景。\n\
  - 填充真实代码 - 一旦验证了逻辑，即可填充执行工作的真实代码并进行测试。\n\n你可以在我的蜂箱称重系统中找到一个完整的示例，该示例位于算法测试框架（附录）（第\
  \ 272 页）。\n\n## 1. 类和函数名称引用框架\n\n### 类和函数名称引用框架\n在进行任何类型的事件报告（内存使用和检测到的错误）时，识别事件的源——类、函数和行号至关重要。识别事件的第一种方法依赖于在类的定义中定义一个变量\
  \ `char* ClassName`，在函数的定义中定义一个 `char* FunctionName`。这些将用于报告。当我第一次这样做时，报告功能可以工作，但内存需求过高。用于标识类和函数的字符串消耗了大量内存。\n\
  \n我的应用程序是一个父/子系统。父节点运行在 `ATmega2560` 上，它具有足够的内存容量来处理标识类和函数的字符串，然而，子节点运行在较小的 `ATmega328Ps`\
  \ 上。由于它们的内存有限，无法使用基于字符串的解决方案来识别事件来源。\n\n在不消耗大量内存的情况下识别事件的解决方案是基于枚举（enum）的 ID - 使用类\
  \ ID 和函数 ID 来识别事件的源。这些枚举将用于报告系统将 ID 转换为相应的类名和函数名。子节点通过 ID 进行报告，从而在没有字符串内存开销的情况下实现类/函数标识。它们将包含类和函数\
  \ ID 的事件传输给父节点，父节点随后使用这些 ID 全名报告 - 这假设父节点拥有大量内存，因为它位于更大的板上（`ATmega2560`）。\n\n将 ID\
  \ 转换为名称的底层机制是为类和函数标记一个唯一的 ID（枚举），该 ID 定义在枚举类列表以及类特定的枚举函数列表中。\n\n类和函数名称引用框架的机制需要以下内容：\n\
  \n- 一个 `enum` 列表用于标识类。\n- 对于每个类，一个函数的 `enum` 列表和一个名称数组用于标识该类的函数。\n- 一个 `struct StructCandFnames`\
  \ 数组将类的名称信息分组。它包含一个 `char* className` 和函数名称数组 `char* functionNames[]`。该数组的行数等于应用程序中类的数量。\n\
  \n```cpp\nstruct StructCandFnames {\n    char* className; // 指向类名的指针\n    char*\
  \ functionNames[]; // 函数名指针数组\n};\nstructCandFnames[(uint16_t)EClasses::end];\n\
  ```\n\n可以通过索引结构的内容直接访问名称。例如，要从基于枚举的 ID 获取类名及其对应的函数名，可以这样做：\n\n```cpp\nchar* className\
  \ = structCandFnames[classID].name;\nchar* functionName = structCandFnames[classID].functionNames[functionID];\n\
  ```\n\n直接使用这些数组的问题在于，ID 的有效性尚未经过验证。`CandFnames` 类专门设计用于从 ID 获取名称，并验证类 ID 和函数 ID\
  \ 是否有效且连贯。使用该类的 `CandFnames` Get 函数配合相应的 ID 如下：\n\n```cpp\nCandFnames* cAndFnames\
  \ = new CandFnames();\n\n...\n\nchar* className = cAndFnames->GetClassName(classID);\n\
  char* functionName = cAndFnames->GetFunctionName(classID, functionID);\n```\n\n\
  系统要求将 ID 插入到源代码的类和函数定义中，以便事件可以使用它们并正确识别其源头。例如，`Employee` 类将修改为包含一个用于 ID 的私有变量及其对应的\
  \ Get 函数：\n\n```cpp\nclass Employee: ...\n{ // 折叠括号\n// BEGIN 插入类名称框架\n#ifdef USE_CLASS_NAMES\n\
  private:\n    static const uint16_t classID = (uint16_t) EClassID::EmployeeID;\n\
  public:\n    uint16_t GetClassID() { return classID; }\n#endif // USE_CLASS_NAMES\n\
  // END 插入类名称框架\n} // 折叠括号\n...\n};\n```\n\n函数将以类似的方式修改，包含一个 `EFunctionID` 枚举以及相应的类级\
  \ `GetFunctionID` 函数。你可以在`CandFnames` 类的完整代码和类和函数名称引用框架（附录）（第 276 页）部分找到更多细节。\n\n\
  总结：\n\n- 内存分配/释放和错误被记录为事件。报告需要使用完整的类函数名，但这消耗了内存受限应用程序无法负担的内存。\n- 枚举标识类和函数，从而在内存受限应用程序记录日志时实现事件标识。\n\
  - 处理报告的应用程序使用枚举作为 `CandFnames` 的索引，从字符串数组中提取名称。\n\n## 2. 类和函数名称引用框架插桩\n\n从实际角度来看，手动添加所需的枚举列表、结构项并向源代码中添加类和函数\
  \ ID 对于小型应用程序（10 个类，50 到 100 个函数）是可行的。如果应用程序很大，手动执行所需工作将变得难以应对且容易出错。这需要自动化 - 该过程被称为插桩。我开始编写一个\
  \ Perl 程序来生成支持文件并在源代码中插入必要的类和函数 ID。请参见下一节，该节将讨论如何插入代码（插桩）来完成这项工作。\n\n\n\n\n\n由于任何规模较大的程序都会包含许多类和函数，手动创建枚举的内容以及类/函数名称既耗时又极易出错。Perl\
  \ 是自动化这一过程的理想工具，因为它可以从源文件中提取数据、格式化输出并生成支持文件。但在深入研究用于自动化该过程的 Perl 程序细节之前，这里简要回顾一下所需的内容，以便报告系统可以使用类\
  \ ID 和函数 ID 来生成全名。\n\n*   一个 `CandFnames.h` 文件，包含 (1) 类和结构 `StructCandFnames` 的声明，(2)\
  \ 每个类包含一个类枚举列表和一个函数枚举列表，以及对应 `char*` 函数名数组的 `extern` 声明，以及 (3) `StructCandFnames`\
  \ 数组。\n\n*   一个 `CandFnames.cpp` 文件，包含 (1) 结构体项（类名和相应的函数名数组）和 (2) 每个类对应的独立的函数名数组。\n\
  \n*   `.cpp` 文件中的所有类和函数定义都应该经过修改，以包含 ID，报告系统使用这些 ID 来识别事件的源头。\n\n`CandFnames.h`\
  \ 文件的内容在结构上与 `CandFnames.cpp` 文件相同，在 `CandFnames.h` 文件中定义的枚举是 `CandFnames.cpp` 文件中各个数组项的索引。注意，代码被封装在一对\
  \ `#ifdef _USE_CLASS_AND_FUNCTION_NAMES ... #endif` 中，以便在认为没有必要报告时禁用其内容。框架的算法要求在框架的声明文件中包含\
  \ `#include \"CandFnames.h\"`。\n\n项目文件的插桩由 `CandFnames.pl` Perl 程序完成。当它遍历源代码时，它会识别类和函数，并构建一个包含这些内容的数组。这成为了创建枚举列表、字符串数组和其他框架所需的原始材料。难度在于遍历源代码以寻找类和函数。请参见类和函数名引用框架插桩（附录）（第\
  \ 251 页。\n\n# 1. 内存管理框架\n\n内存管理框架：内存分配验证堆的可用性并揭示内存泄漏。错误（可能的原因和补救）：异常行为或崩溃——可能是内存耗尽。\n\
  \n你正在运行代码，突然开始发生奇怪的事情：应用程序反复重启；某个函数似乎没有被调用；值错乱；打印出乱码。原本运行正常的东西现在停止工作了！！！发生了什么事？进入恐慌思维……你可能正面临内存耗尽！查看编译输出窗口显示的构建大小。如果它有点大（在我的案例中，超过了\
  \ ATmega2560 RAM 使用率的 77%），程序可能会耗尽堆空间并崩溃。不幸的是，崩溃可能在错误开始作乱后很久才发生。这是因为崩溃发生在受损代码被使用时，而不是代码被损坏时。\n\
  \n各种事情可能导致崩溃：数组越界、坏指针以及其他此类问题。但其中之一——内存耗尽，可能是罪魁祸首。如果是这种情况，在尝试诊断崩溃原因时需要处理两个问题：\n\n\
  *   确认是否存在内存问题——`malloc` 失败了吗？或者堆和栈是否碰撞了？这必须确定。内存管理框架包含了协助你完成这一目标的工具。\n\n*   内存（泄漏）：内存管理框架会揭露内存大户和内存泄漏。内存（栈）：栈溢出会破坏内存分配，可能长时间内无法被检测。内存（栈）：通过内存监控函数可以避免内存分配失败。内存（使用）：通过内存监控函数可以避免内存分配失败。确认存在内存问题后，第二个问题是“原因是什么？是由于函数调用过多导致栈需求过大？还是存在内存大户？”最近的\
  \ `new`/`malloc` 分配不一定是原因。问题可能是更早时候的内存泄漏（又名大户——未释放内存），或者是某个类或函数对内存的需求过大。由于深层函数嵌套导致的栈增长也可能是原因，特别是当你实现递归时。或者局部变量可能太贪婪了；它们可能需要过量的内存。记住，堆的大小由于内存分配从底部向上收缩，而由于函数调用嵌套从顶部向下延伸。随着函数的调用，栈帧一个接一个地堆叠。由于栈和堆竞争同一内存空间，它们很有可能相遇。这就是问题发生的时候。\n\
  \n内存（堆碎片）：由于随机释放内存产生了空洞。对上述两个问题（来自堆的内存分配和函数调用的栈增长）的响应需要 (1) 监控分配和函数调用的可用内存，以及 (2)\
  \ 将所有的内存分配和释放记录在某处，以检查内存是如何使用的。这就是内存管理框架所做的。它监控对象从堆分配和释放到堆的内存使用。这些事件被记录到链表中，然后用于报告应用程序的内存使用情况。\n\
  \n内存（使用）：RAM（系统 RAM）的底部用于全局、静态、系统变量。内存管理框架：堆分为两部分：碎片化堆和连续堆。内存（堆连续）：分配内存和栈底之间的连续堆。内存（堆连续）：函数：TotalHeap,\
  \ FragmentedHeap, MaximumAlloc。内存（堆碎片）：函数：TotalHeap, FragmentedHeap, MaximumAlloc。内存（栈）：函数嵌套和递归消耗了过多的连续空间。在深入内存管理细节之前，这里是对\
  \ ATmega 微控制器内存的快速回顾。\n\n微控制器的内存（RAM）从底部分为两部分：不可用内存（启动时定义）以及包含堆和栈的可用内存。随着应用程序运行，函数调用从顶部向下消耗可用内存（栈），从而减少堆的大小。分配（`malloc`\
  \ 和 `new`）从底部向上消耗可用内存（堆）。如果两者相遇，堆向上增长，栈向下增长，内存将不再可用。应用程序无法正常运行或崩溃。请注意，栈和堆的收缩方式并不相同。当函数退出时，它们从栈底部向上释放内存。这意味着栈消耗并释放连续空间。这种过程与堆内存分配不同，不会产生空洞。当通过\
  \ `free` 或 `delete` 释放内存时，内存是从第一次分配、最后一次分配或之间的任何一次释放；没有特定的顺序。一段时间后，堆分为两个部分：包含空洞的底部（碎片化堆）和栈下方的顶部（连续堆）。这些概念如下表所示，该表摘自配套书籍《Pragmatic\
  \ C++ Arduino Programming》。\n\n| | Stack | Stack | Stack |\n| :--- | :--- | :---\
  \ | :--- |\n| | main, setup | main, setup, Aardvark | |\n| other functions | main,\
  \ setup, other functions | | |\n| available | | | |\n| RAM | contiguous | contiguous\
  \ | |\n| | heap | heap | fragmented |\n| | fragmented heap | heap |\n| global data\
  \ | global data | global data | global data |\n\n\n\n\n\n| 增强功能 | 启动 | 执行 | 堆栈与堆冲突\
  \ |\n| :--- | :--- | :--- | :--- |\n\n### 表 16.2 - 内存占用\n\n应用程序运行时的内存占用情况。\n\n随着程序的运行，两个内存管理问题变为：\n\
  \n- **内存（连续堆）**：函数调用需要连续的内存空间来存储栈帧。是否有足够的连续堆空间来容纳预期的函数调用？如果没有，该函数将挤占（thrash）顶部的分配内存。这个问题会在挤占的数据被使用时显现，而不是在发生挤占时。\n\
  - **内存管理框架**：有足够的连续堆吗？是否有足够的空洞？连续堆空间是否足够，或者是否存在足够的空洞来容纳预期的分配？如果不是，返回的指针将设置为 `0`。如果程序员已经检查了分配调用以确保其成功，这不应该成为问题。\n\
  \n程序员必须管理内存以确保应用程序的健壮性。如果应用程序耗尽内存，将无法继续运行。程序员应该为此做好准备，以防措手不及。以下三组工具提供了处理内存管理问题的手段：\n\
  \n- **内存监控函数**：可以在任何地方插入 `TotalHeap`、`ContiguousHeap` 和 `FragmentedHeap` 函数来监控内存和堆的碎片化程度（`total\
  \ = fragmented + contiguous`）。在碎片化严重时进行分配时，`total heap` 看起来可能足够，但实际上 `contiguous\
  \ heap` 可能几乎用尽，且 `fragmented heap` 可能不包含足够容纳预期分配的空洞。`FragmentedHeap` 函数设置 `MaximumPossibleAlloc`\
  \ 参数，该参数可检查是否有足够的空间用于预期的分配或内存密集型函数调用。注意，在分配空间之前进行此类检查并非必须。只需进行分配并检查返回指针的值即可。如果分配失败，指针将设置为\
  \ `0`。应据此采取操作。应该在每次 `malloc` 或 `new` 之后系统地进行这些检查。调用函数时没有这种安全网。如果被调用的函数所需的栈帧空间超过了连续内存可用空间，它将静默地挤占分配内存的顶部。当你尝试使用受损的数据时，你就会发现问题，而这可能在损害发生很久之后。解决方案是在调用内存密集型函数之前检查连续堆空间是否足够（这说起来容易做起来难）。\n\
  \n- **函数调用监控**：如果碎片堆空间很大，而连续堆空间很小，程序员可能会根据报告的总堆错误地认为一切正常。但实际上可能没有足够的连续堆空间，在这种情况下，栈将向下增长到堆分配的顶部并挤占它们。避免这种意外的一种方案是定义一个最小连续内存阈值，以确保下一次函数调用有足够的内存。可以使用\
  \ `ContiguousHeap` 函数来确定是否达到了该阈值。请参阅确定内存使用 (第 297 页)。\n\n- **内存事件日志与报告**：由 `MemAllocEvtMgt`\
  \ 类创建的事件包含报告内存使用所需的信息。对于每次分配，会在事件中添加一个唯一标记以识别可能的内存泄漏（即从未释放的分配）。可以通过系统地使用重载的 `new`\
  \ 运算符来记录此类事件并记录内存事件。请参阅运算符重载 (第 186 页)。\n\n实现内存管理会消耗内存。它应该只在开发阶段使用。一旦应用程序经过调优并基本可以保证不会遭受内存泄漏或过度的内存需求，就可以关闭`内存管理框架`，从而节省它消耗的内存。\n\
  \n总结来说，内存管理概念很简单：\n\n- 按需分配内存。检查分配情况；如果失败，则处理错误。\n- 在列表中创建并存储 `MemAllocEvts`，以便稍后检查详细的分配需求。重载的运算符\
  \ `new` 和 `delete` 将自动完成此任务。请参阅运算符重载 (第 186 页)。\n- 使用唯一 ID 标识内存分配以验证内存释放，从而发现可能的内存泄漏。详情请参阅内存管理框架（附录）\
  \ (第 278 页)。\n\n#### 内存分配监控函数\n\n内存分配监控依赖于三个函数：`TotalHeap`、`FragmentedHeap` 和 `ContiguousHeap`（参见确定内存使用第\
  \ 297 页）。它们产生可用堆。如果连续堆或碎片堆低于阈值，函数将触发错误。内存分配和错误处理可以通过重载的 `new` 实现（参见运算符重载第 186 页）。\n\
  \n`FragmentedHeap` 函数可能会由于累积的分配和释放导致关键情况，结果是许多小空洞。最终，所有可用堆分布在许多空洞中，类似于瑞士奶酪，从而增加了由于最大的空洞不再足够而导致分配失败的风险。可以设置一个最小分配大小，当最大的空洞或连续堆太小时停止执行。`FragmentedHeap`\
  \ 函数返回总碎片堆大小。它还会告知最大的可能分配空间。\n\n内存的分配和释放通过重载两个运算符 `new` 和 `new[]` 及其对应的 `delete`\
  \ 来实现：\n\n- 从堆向向堆分配/释放内存。\n- 检查内存分配是否成功，如果没有成功，则处理错误并终止或执行其他操作。这需要执行一次长跳转（参见伪异常处理框架\
  \ 第 183 页）。\n- 如果分配或释放成功，创建一个下述的 `MemAllocEvt`。更多细节请参见内存管理框架（附录） (第 278 页)。\n- 在调用内存密集型函数之前，使用\
  \ `ContiguousHeap` 函数检查连续堆空间是否足够。\n\n\n\n\n\n# 链表框架\n\n## 内存管理\n第二组工具——内存事件日志与报告（第一组是上述的内存分配监控函数），将分配和释放作为事件记录在链表中，该链表包含生成报告所需的必要数据。`MemAllocEvt`\
  \ 类提供了创建分配事件的机制。程序员可以循环遍历这些事件，以确定是否存在问题，或者在何处可以节省几个字节内存。\n\n### 运算符重载\n#### 重载的\
  \ new：内存管理、验证分配成功与、记录事件\n记录事件 - 在进行分配时，检查分配的返回值（重载的 `new` 和 `new[]` 运算符会执行此操作）。如果分配成功，则创建\
  \ `MemAllocEvt` 并将其存储在链表中。如果分配失败，则通过提供有关问题原因和位置（类、函数和行号）的信息来报告错误。然后处理该错误：终止或执行其他操作。参见错误报告框架\
  \ [(第 185 页)]](#part0022.xhtml_a8HF)。\n\n### 内存分配验证堆可用性并揭示内存泄漏\n内存管理框架可以揭示内存大户和内存泄漏。在程序运行期间和/或在程序退出之前，将结果以分配/释放事件列表的形式显示。检查完整的内存分配报告，以确定可能在何时、何地以及何时存在问题（内存泄漏）或有内存优化的空间。\n\
  \n每个 `MemAllocEvt` 事件都包含以下数据：\n\n*   **引用框架的类和函数名**：`MemAllocEvt` 使用函数 ID 配合函数名进行报告。类和函数索引——这些索引被类和函数名引用框架\
  \ [(第 176 页)]](#part0022.xhtml_a8HB) 用于生成具有有意义的类名和函数名的报告。\n*   源代码行号定义了分配或释放发生的位置。\n\
  *   对分配或释放的字节数进行累加，以确定程序结束时从分配和释放中剩余多少净内存。这种内存核算可以揭示是否存在未释放的待分配；这些被称为内存泄漏。\n\n###\
  \ 内存使用\n可用的堆空间揭示了内存的可用情况。它反映了内存的分配和释放，以及栈的增长和收缩。栈可能会因为过多的函数嵌套、大量的局部变量空间需求和/或过度递归而消耗大量的堆空间。\n\
  \n#### 1. 函数栈帧内存需求\n到目前为止，讨论集中在基于函数计算碎片化和连续堆的分配与释放。这些可以用于监控内存，并在发生关键情况时发出警报，从而采取预防措施。\n\
  \n当你分配内存时，检查 `malloc` 或 `new` 返回的内存地址。如果是 `0`，则分配失败，你必须采取相应的行动。这不会造成损害。当你调用函数时，会创建一个栈帧；它被放置在连续堆的顶部。如果那里已经有东西，那糟了，栈帧将覆盖它，损害已经造成。解决方案是在调用函数之前检查连续堆空间，以确保有足够的内存。遗憾的是，我还没有找到在函数被调用之前自动获取其内存需求的方法。当然，你可以建立一个函数栈帧大小表并用它来验证连续堆是否足够大，但这是笨重的、耗时的且是维护的噩梦。另一种方法是设置一个阈值。如果最小连续堆恰好小于阈值，你就可以终止或执行其他操作。\n\
  \n《实用 C++ Arduino 编程》描述了 Arduino 程序的内存结构；函数栈帧是其一部分。简而言之，函数栈帧包含函数的返回地址、其参数、变量和返回值。你可以为每个需要大量内存的函数引入一个\
  \ `SizeOf` 函数，该函数将报告其栈帧大小。遗憾的是，这些值无法自动生成；它们必须逐函数单独定义；由于函数的结构是已知的，其栈帧大小是可以计算的。我将此机制放在了我的待办事项列表中。参见表\
  \ 16.2 内存管理框架（第 179 页）。\n\n## 伪异常处理框架\n伪异常处理框架——基于 `setjmp` 和 `longjmp` 的 C++ 异常处理的替代方案。\n\
  正如良好的编程实践（第 129 页）章节提到的，黄金规则是：永远不要假设任何！应用程序应该始终测试值以确保其在接受范围内。如果测试返回 `false`，应用程序必须通过错误处理机制处理问题，该机制必须：\n\
  \n*   **进行报告**：应通知应用程序的用户或程序员发生了错误，并提供相关信息：什么错误？在哪里？\n*   **处理状况**：检测到错误后，确定其严重性。要么在做出调整后发出警告并继续，要么发布严重错误并放弃处理；即终止或跳过一段代码。\n\
  \n处理严重错误有多种解决方案，首选方案是 C++ 的异常处理机制（`try`/`throw`/`catch`）。它的底层概念是基于程序控制权从错误位置反向传输到一个落点，即返回到安全的位置。问题是\
  \ Arduino 环境不支持 C++ 的异常处理，但它确实拥有 `setjmp`/`longjmp` 机制。这些等同于长范围范围 `goto`。`setjmp`\
  \ 定义了一个落点；`longjmp` 是返回该落点。这种机制提供了模拟 C++ 异常处理的手段。我将其命名为伪异常处理。\n\n\n\n\n\nC++ 异常处理的关键在于长跳转（long\
  \ jump）。应用程序会将控制流反向传回到 `try` 落地点。由于 Arduino 环境提供了长跳转功能，因此使用 C++ 的内置函数 `setjmp` 和\
  \ `longjmp` 创建一个伪异常处理机制变成了一件简单的事。\n\n### 伪异常处理框架\n\n*   `<x>伪异常处理框架[AUX]longjmp\
  \ (throw) - 返回落地点</x>``int setjmp(jmp_buf _env)` 等同于 C++ 异常处理中的 `try`。它为相应的 `longjmp`\
  \ 定义了一个落地点。如果没有触发 `longjmp`，它返回 0。如果触发了 `longjmp`，`setjmp` 将返回 `longjmp` 设置的任何值，从而暴露是哪一个\
  \ `longjmp` 触发了异常。\n*   `<x>伪异常处理框架[AUX]EErrorID 标识 longjmp</x>``void longjmp(jmp_buf\
  \ _env, int _eErrorID)` - `longjmp` 可能会被触发，它们都应该落地到对应的 `setjmp` 中。`longjmp` 的 `jmp_buf\
  \ env` 标识要返回到的 `setjmp`（落地点）。`longjmp` 的 `int _eErrorID` 标识错误。注意，多个 `longjmp` 可能绑定到给定的\
  \ `setjmp`（落地点）；它们通过各自的 `EErrorID` 进行区分。每个不同的 `EErrorID` 都可以定义为标识错误的 `enum`（枚举）。\n\
  *   `jmp_buf` 定义了调用 `setjmp` 时的环境。它区分了不同的 `setjmp`（落地点），以便 `longjmp` 能落地到对应的 `setjmp`\
  \ 中。\n\n总结：C++ 的 `longjmp` 机制依赖于一个结构（`jmp_buf`）两个函数（`setjmp` 和 `longjmp`）。实现该机制是一个四步的过程，两个用于设置，两个用于获取结果。\n\
  \n*   定义落地点（`setjmp` 等同于 `try`）。`setjmp` 与 C++ 异常处理的类比是你创建的每一对 `try`/`throw` 对应一个\
  \ `setjmp`/`jmp_buf` 对。\n*   为每个落地点（`setjmp`）创建一个全局 `jmp_buf env` 变量。C++ 的异常处理会自动完成这一点。\n\
  *   触发返回落地点的跳转 - 在调用栈深处，如果发现错误，则使用相应的 `jmp_buf env` 触发 `longjmp(env, errorID)` 以标识落地点，即带有\
  \ `enumError` 返回到哪个 `setjmp`，以便识别并处理该错误。`longjmp` 与 C++ 异常处理中的 `throw` 是等价的。\n*\
  \   获取错误标识符 `errorID = setjmp(env)`。值为 0 表示没有触发 `longjmp`（即没有检测到错误）。如果确实触发了错误，则根据此继续操作。显然，`longjmp`\
  \ 参数 `errorID` 的值永远不应该为 0。程序员在定义 `enum EErrors` 列表时应该格外小心。\n\n上述内容解释了长跳转错误处理机制 -\
  \ 它模仿了 C++ 的异常处理。但在检测到错误（关键情况）和警告（某些地方不太对劲）时该做什么，这些问题仍然存在。错误和警告之间的区别在于，错误需要终止应用程序或跳过整个代码段，这两者都需要\
  \ `longjmp`。而警告允许应用程序在进行调整后继续运行。两种情况都需要将信息记录在某处以便于报告。这就是错误报告框架的用场（见下一节 错误报告框架）。实现这种四部分伪异常处理机制有点复杂，而且一点也不直观。更多细节请参见\
  \ 伪异常处理框架（附录）（第 281 页）。\n\n### 1. 错误报告框架\n\n`<x>错误报告框架[AUX]ErrorEvt 类存储事件信息并将其链接为链表（ErrorList）</x>`上一节涵盖了如何使用\
  \ `setjmp`/`longjmp` 机制，通过在发生错误时重定向程序流来模仿 C++ 的异常处理。但这只解决了一半问题。另一半涉及如何通知外部（无论是程序员还是最终用户）发生了错误。它应该报告错误的性质以及发生的位置。\n\
  \n一个设计良好的应用程序会进行测试并可能触发警告和错误：C++ 相关的错误、逻辑错误和运行时资源问题。C++ 相关的错误在伴随书籍《Pragmatic C++\
  \ Arduino Programming》的“C++ 阱”章节中有详细的解释和探索。由于逻辑缺陷导致的错误可能像 C++ 阱一样难以捉摸。第三类错误是资源不足。这包括内存不足或电池电压低。作为错误，它们特别棘手，因为程序可能会崩溃却不提供任何关于出错的线索。这就是错误报告可以节省大量调试时间的地方。`<x>错误报告框架[AUX]switch\
  \ default case 缺失或为空</x>`我将通过一个常见的编程错误来说明错误报告。假设你写了一个带有多个 `case` 的 `switch` 语句。应该有一个\
  \ `default` case - 它用于处理未被预定义 case 处理的情况。它是逻辑的一部分，是处理不可预见情况的捕器。显然，如果 `switch` 意外掉入\
  \ `default`，而算法规定这种情况不应该发生，那么就是编程错误；在这种情况下，它应该触发一个错误。应用程序将报告非法默认退出，以及函数名、行号可能其他信息。\n\
  \n`<x>错误报告框架[AUX]处理错误日志和报告</x>`在开发阶段，每当发生糟糕情况时，都应该记录错误日志。这涉及列出类、函数、行号和错误类型。错误报告框架通过两个类来实现：一个处理错误注册，另一个提供错误报告：\n\
  \n*   `ErrorEvt` 类包含事件 ID，即类/函数和行号，以及用 `enum` (`Error`）表示的事件性质。`ErrorEvt` 继承自 `LinkedItem`，以便存储在链表中。\n\
  *   `ErrorList` 类管理 `ErrorEvts` 列表 - 单个错误（`Errevt`）被添加到错误链表中。`ErrorList` 继承自 `LinkedList`。\n\
  \n`<x>错误报告框架[AUX]enums 与数组字符串同步事件</x>``enum EErrors` 列表配合相应的字符串数组，能够以名称显示错误，而不是显示数字。错误报告输出如下：\n\
  \n```\nclass/function: Sample::Constructor lineNo: 345: outOfBounds\nclass/function:\
  \ Contact::SetName lineNo: 498: failedAlloc\n```\n\n面对警告或错误时，记录信息对于调试以及在发布后提供反馈至关重要。感知问题的存在是实现应用程序健健性的重要一步。更多细节请参见\
  \ 错误报告框架（附录）（第 284 页）。\n\n### 1. 运算符重载\n\n`<x>运算符重载[AUX]Overloaded new: memory management,\
  \ verify allocation success, log events</x><x>内存管理框架[AUX]Overloaded new: memory\
  \ management, verify allocation success, log events</x>`C++ 的特征之一是其丰富的运算符集。这使得它成为一门强大的编程语言，强大到可以用它编写如\
  \ Unix 和 Linux 等操作系统以及关键任务型应用程序。对于提供的运算符集仍不满足，C/C++ 创造者认为允许程序员自定义运算符将增强这种语言。这种自定义被称为运算符重载。\n\
  \n\n\n\n\n# 运算符重载\n\n## AddHive += 演示了运算符重载\n\n在“运算符重载”这个术语背后隐藏着一个简单的概念。将运算符想象成一个可以属于类或全局的函数。假设有两个类：`Beeyard`（蜂场）和\
  \ `Beehive`（蜂巢）。当你向蜂场添加一个蜂巢时，你可能会这样做这样做：\n\n```cpp\nbeeyard.AddHive(beehiveNalini);\n\
  ```\n\n`AddHive` 函数接收一个蜂巢并添加到蜂场。更优雅、更简洁的做法是：\n\n```cpp\nbeeyard += beehiveNalini;\n\
  ```\n\n与其使用 `AddHive` 函数，不如创建一个自定义的 `+=` 运算符，以便用于将 `Beehive` 添加到 `Beeyard` 中。自定义这样的运算符被称为运算符重载。在\
  \ `Beeyard` 类的定义内部，像声明函数一样声明重载的 `+=` 运算符，如下所示：\n\n```cpp\nvoid operator += (Beehive&\
  \ _beehive) { code }\n```\n\n这段代码与 `AddHive` 函数的代码相同。请注意，移除蜂巢的 `-=` 运算符也可以以相同的方式进行重载。\n\
  \n要创建一个重载运算符，只需编写一个执行所需任务的函数，并将函数名替换为 `operator xyz`，其中 `xyz` 是目标运算符。以上面为例，`Beeyard`\
  \ 函数 `void AddHive(Beehive &)` 变为 `void operator+=(Beehive &)`。没有更简单的了。与其执行\n\n\
  ```cpp\nbeeyard.AddHive(beehiveNalini);\n```\n\n不如执行\n\n```cpp\nbeeyard += beehiveNalini;\n\
  ```\n\n在重载全局 `new` 运算符时，也采用相同的方法。首先定义一个执行你想要的操作的函数：内存分配、检查分配有效性、注册事件等。因此执行如下：\n\n\
  ```cpp\nvoid* AllocateMemory(size_t _memToAllocate,...) { do work, return pointer\
  \ or null }\n```\n\n创建此类函数后，对其进行测试。一旦你对其满意，就将函数名替换为 `operator new`。你现在拥有了：\n\n```cpp\n\
  void* operator new(size_t _memToAllocate,...) { do work, return pointer or null\
  \ }\n```\n\n使用方法如下：\n\n```cpp\nuint8_t* myArray = (uint8_t*) new(50,...); // 好了，没问题。\n\
  ```\n\n## 首先创建执行任务的函数\n\n并没有根本性的理由去重载 `new` 运算符，使用函数也可以做到。我发现 `new` 运算符让编码变得更容易，而且在阅读代码时，它比使用\
  \ `AllocateMemory` 函数更简洁、更用户友好。以下是我为应用程序创建的全局运算符 `new` 的完整代码：\n\n```cpp\nvoid* operator\
  \ new (size_t _allocSize, uint16_t _classIndex,\nuint8_t _functionIndex, char**\
  \ _functionLabels) {\n#ifdef USE_CLASS_NAMES\nSerial.print(F(\"Entered global operator\
  \ new with allocSize = \"));\nSerial.print(_allocSize);\nSerial.print(F(\" class\
  \ \"));\nSerial.print(structCandFNames[(uint16_t)_classIndex].classLabels );\nSerial.print(F(\"\
  \ function \"));\nSerial.println(_functionLabels[_functionIndex]);\n#endif // USE_CLASS_NAMES\n\
  \nvoid* allocPtr = malloc (_allocSize); // 标准分配\nif (allocPtr == 0) { // 检查 malloc\
  \ 是否成功\n#ifdef _DEBUG_OPERATOR_NEW\nSerial.println(F(\"Error: ITEM alloc failed\"\
  ));\n#endif // _DEBUG_OPERATOR_NEW\ndelay(100);\n// 从此处终止或返回\nreturn 0; // 返回空指针\n\
  } // if (allocPtr == 0)\n#ifdef _DEBUG_OPERATOR_NEW\nSerial.println(F(\"Success:\
  \ ITEM alloc successful - entering HandleMemoryConstructor\"));\n#endif // _DEBUG_OPERATOR_NEW\n\
  // 调整分配大小以考虑 MemAllocEvt 对指针的要求\nuint16_t allocSize = _allocSize + 2 + sizeof(MemAllocEvt)\
  \ + 2;\nmemMgt->HandleMemoryConstructor (_classIndex,\n_functionIndex, _functionLabels,\
  \ allocSize);\nreturn allocPtr;\n} // operator new\n```\n\n请注意使用 `#ifdef` 控制打印（在下一节中将详细介绍）。\n\
  \n# 1. 基于打印的调试框架\n\n## 相对于硬件调试的补充工具，需要特殊的硬件和兼容的 IDE\n\n## 基于打印的调试框架：相对于硬件调试的补充工具\n\
  \n## 基于打印的调试框架：显示特定函数的数据和错误\n\n## 基于打印的调试框架：宏分类：导航、内存使用、关键情况、数据值\n\n- 里程碑宏标记程序位置\n\
  - 当资源耗尽时（电压、内存……）触发关键情况报告宏\n- 内存使用宏告知当前可用内存和堆碎片情况\n- 错误报告宏打印高可见的文本以描述错误\n\n我们所有人都使用过\
  \ `print` 命令来获取应用程序正在运行的信息。这就是基于打印的调试。这种调试通常根据需要随性地进行。一段时间后，应用程序中充斥着打印语句（无论是否被注释掉）。源代码变得混乱。此外，程序员会想要知道上下文——即应用程序所处的位置。这些就是里程碑。如果发生关键情况（例如资源不足），或者发生错误，他/她应该收到通知。最后，由于应用程序可能会迅速用满屏输出覆盖控制台，因此基于打印的调试应该是可控的。\n\
  \n全局、文件和函数级别的调试控制可以开启/关闭。进行基于打印的调试时，打印语句的数量应该是合适的，不能太多，否则屏幕会被淹没；也不能太少，否则无法显示信息。尽管努力限制输出，串口监视器中不可避免地会有大量的输出。调试控制宏、醒眼标记、以及高可见度的字符行，将有助于在长长的屏幕输出中搜索正确的信息。\n\
  \n时间是最宝贵的资产，为什么要浪费时间在如成山般的输出中进行搜索呢？基于打印的调试框架限制并组织输出，以快速定位可能揭示 Bug 原因的信息。解决方案是简单的：插入打印语句来显示理解程序正在运行所需的任何信息。但它有一个重要的缺点：内存消耗。由于基于打印的调试需要大量的文本在串口监视器中显示信息，会消耗大量的\
  \ RAM 和/或闪存。在开发早期，应用程序较小，有足够的内存可以使用，基于打印的调试内存需求似乎无关紧要。但过了一段时间，随着应用程序的增长，调试内存需求可能会产生巨大影响。应用程序耗尽了\
  \ RAM 和/或闪存。\n\n\n\n\n\n# 宏\n\n## 基于打印的调试框架定义了宏的分层结构\n### 调试控制宏\n应用程序的结构可以可视化为三级层次结构（全局、文件和函数），这导致了相应的控制宏层次结构。通过选择性地注释和取消这些控制，可以控制哪些内容通过\
  \ `#ifdef`...`#endif` 对进行打印，从而将输出限制在问题区域。这些宏根据应用程序的结构分组：全局级、文件级和函数级。全局级宏用于开启或关闭全局宏。文件级宏在文件级别执行相同的操作。函数级宏在函数级别亦是如此。\n\
  \n### 函数进入和退出宏在进入和退出函数时打印细节\n函数报告宏显示函数调试信息：进入/退出函数、在进入时显示参数值、在退出时显示返回值。进入宏在进入函数时提供各种详细信息：函数名、行号、调用函数以及相应的行号等。退出宏的长版本提供类似的信息。参数值宏则打印参数名称及其值。\n\
  \n### 错误报告宏打印高可见度文本以描述错误\n### 基于打印的内存调试宏显示总、连续、碎片化的堆\n提供了四种应用程序范围的宏类型：里程碑、关键、错误和内存使用。里程碑宏揭示程序的位置。关键宏在资源低缺时触发。错误（警告）宏在发生糟糕情况时（值越界、分配失败等）被触发。内存使用宏显示内存使用情况。\n\
  \n这三组宏（调试控制、函数报告、应用程序范围）共同构成了基于打印的调试框架。你可以在基于打印的调试框架（附录）（第 285 页）中找到大量的详细信息。\n\n\
  # 应该掌握的工具\n\n专业程序员不应将自己局限于获取 `C++` 的良好编程知识；他们应该学习其他技能。以下是继承自 Unix 环境的文本处理工具；它们可能被证明特别有用。\n\
  \n### 正则表达式 (regex)\n你在 Windows 资源管理器中搜索文件时，多久使用过通配符，例如搜索 `*.txt`（查找所有以 `.txt` 结尾的文件）。星号\
  \ `*` 是一个通配符，它表示任何文本模式。这种通配符概念被扩展为一种强大的机制，称为正则表达式（regex），能够实现对文本行中几乎任何内容的搜索。Microsoft\
  \ Word 在激活“使用通配符”时确实以一个精简版本提供了这种可能。如果你一直在使用这个 Word 功能，你对正则表达式已经有些熟悉。但 Windows 通配符机制对于正则表达式所能做到的仅仅只是冰山一角。VS\
  \ Code、Visual Studio 以及现在的 Arduino V2 都支持全功能的正则表达式引擎；为什么微软没有在 Word 中使用完整版本，我对此也不清楚。在尝试让非开发者使用得更简单时，他们却使其变得同样复杂，而且文档记录不详全。下文介绍的\
  \ `Awk` 和 `Perl` 都支持正则表达式。\n\n### Awk\n这个文本处理工具的主要目标是赋予用户一种可能性：如果某行文本包含通过逻辑语句和/或正则表达式（regex）搜索找到的特定文本，则对该行执行某些操作。简而言之，如果该行包含你正在寻找的内容，则对其进行此操作或那操作；否则，处理下一行。`Awk`\
  \ 相比正则表达式有一个缺点——它不支持捕获组（参见 Regex 分组 第 198 页）。\n\n### Perl\nPerl 可以做到你用 `Awk` 能做的任何事情，因为它也包含正则表达式（regex）搜索引擎。`Perl`\
  \ 也是一种通用编程语言，因此你可以在 `Perl` 程序与 `C/C++` 控制台应用程序之间类比。如果你要在文本文件上进行某些 `Awk` 类型的工作，考虑用\
  \ `Perl` 代替，它功能强大得多，你可以用它做更多事情。注意 `Perl` 与 `Awk` 不同，它支持捕获组（参见 Regex 分组 第 198 页）。\n\
  \n我强烈建议你学习 Perl（第 217 页）,正则表达式 (regex)（第 191 页） 作为使用它的前提。如果你熟悉了 `Perl`，就不需要学习 `Awk`\
  \ 了；你将在后面找到更多内容。\n\n# 正则表达式 (regex)\n\n你可能不知道这些，但你可能从开始使用电脑起就一直在使用正则表达式（regex）了。正则表达式引擎是一种通用的通配符协议，用于查找/替换文本。当你在电脑上通过\
  \ `*.txt` 进行搜索时，你正在使用正则表达式的一种变体（正则表达式应该是 `.*txt`）。Arduino IDE 遗留版本 1.8.19 不支持此类功能。Arduino2、Atmel\
  \ Studio、VS Code 和 PlatformIO 支持。\n\n到目前为止我一直通配符术语；它是正则表达式的简化集。问题是“什么是正则表达式？”我能给出的简单答案是它是文本模式匹配机制。它是一组规则（语法），允许在行中搜索特定模式。例如，搜索地址中的邮政编码或电子邮件的日期。注意它限于匹配纯文本（不包含特殊字符的文本，例如\
  \ Word 文档中的文本）。\n\n正则表达式简单且非常有用。这里有一个简单的正则表达式搜索示例。假设你想找到除 `Serial.prints` 之外的所有\
  \ Serial 调用。你正在寻找 `Serial.begin`、`Serial.end` 等。通过搜索工具查找这些内容需要对每个 `Serial.whatever-you-are-looking-for`\
  \ 执行一次搜索。问题是可能有许多 Serial 调用，如 write、read、open、close……你想找到所有它们，但又不想让散落在代码中的 `Serial.prints`\
  \ 弄乱输出。使用正则表达式，你只需要搜索一次。\n\n```\nSerial\\d*\\.(?!print)\n```\n这个正则搜索所有非 print 的\
  \ Serial。它表示：搜索字符序列 Serial，后面跟着零或多个数字 `\\d*`，然后是一个点 `\\.`（注意 d 和点 . 都用反斜杠 `\\` 转义了），后面是非不是\
  \ `(!)`，然后是单词 print。注意 `!` 之前的问号。这意味着正向前断言。确保字符序列 print 不存在。强大。\n\n\n\n\n\n# 正则表达式（通用）\n\
  \n许多工具都包含正则表达式引擎 - `AtmelStudio` 和 `PlatformIO` 的查找/替换`Perl`、`Awk`、`Word`（通配符）\n\
  \n`Perl (通用)`：支持正则表达式的强大 C 语言编程语言。\n`Awk (通用)`：通过逻辑语句和正则表达式从文本文件中提取信息。\n`AtmelStudio\
  \ (查找/替换)`：支持全词匹配、正则表达式以及历史搜索记录。\n`PlatformIO (通用)`：查找/替换支持正则表达式。\n\n通过正则表达式进行搜索的应用程序都包含正则表达式引擎。就像\
  \ C++ IDE 需要编译器一样，`Perl` 和 `Awk` 也集成了正则表达式引擎。这正是它们强大的源泉。`Arduino V2`（不是旧版的 `1.8.19`）、`AtmelStudio`、`Visual\
  \ Studio+Visual Micro`、`VS Code` 和 `PlatformIO` 在其搜索/替换工具中包含了正则表达式。某些编辑器（`Atom`）允许使用正则表达式进行查找/替换。如上述，`Word`\
  \ 确实允许使用通配符；它们类似于正则表达式，尽管功能弱得多；但请注意，`Word` 通过 `VBA` 编程（Microsoft Office 编程语言）更完整地支持正则表达式。\n\
  \n## 正则表达式应用\n\n正则表达式可以响应多种需求，例如：\n\n*   **正则表达式（通用）**：正则表达式引擎是一种通用的智能通配符协议，用于查找/替换文本。智能搜索例如查找所有不包含\
  \ `print` 的 `Serial` 语句，如 `Serial.begin`、`Serial1.read`、`Serial2.write`……但不包括 `Serial.print`\
  \ 或 `Serial.println`。\n*   **正则表达式（示例）**：`Perl` 和 `Awk` 程序使用正则表达式从源代码中提取程序文档。通过\
  \ `Perl` 和 `Awk` 脚本从源文件中提取注释来生成程序文档。\n*   **正则表达式（示例）**：查找 `if` 中的 `=` 代替 `==`，或者在赋值中使用\
  \ `==` 代替 `=`。一个有趣的用法是查找 `if` 语句中使用赋值运算符 `=` 代替逻辑运算符 `==` 的匹配项。类似的搜索还可以查找赋值语句中使用\
  \ `==` 代替 `=`。\n*   **正则表达式（示例）**：揭示重复的单词，如 \"red red fox\"。在文档中查找重复单词：在 \"red red\
  \ fox\" 中，`red` 是重复的。\n*   **正则表达式（示例）**：用于列出枚举（enums）和 `#defines`，查找未使用的项。列出程序中的枚举和\
  \ `#defines`，并查找未使用的项。\n*   **正则表达式（示例）**：根据每行的内容生成文件的子集。\n\n一旦你熟悉了正则表达式，你会发现它们的用途越来越广泛。更多示例请参阅错误（附录）（第\
  \ 293 页）。\n\n## 正则表达式概念\n\n本章扩展了正则表达式的概念；这些内容将帮助你快速上手正则表达式的创建。\n\n*   正则表达式术语 (第\
  \ 193 页） - 就像所有学科一样，正则表达式有自己的词汇（术语集）和语法（处理问题的方法）。这些规则基于具有名称的实体。`C++` 有类、变量、函数、运算符等。正则表达式有字符、元字符、交替符等。\n\
  *   **正则表达式（通用）**：正则表达式段将单个模式组合成复杂的模式。正则表达式入门（第 194 页） - 各种正则表达式的构建块被组合在一起以创建模式匹配表达式。简单的正则表达式片段可以作为更复杂正则表达式的构建块。\n\
  *   **正则表达式（元字符）**：元字符是变成模式匹配运算符的字母或符号。元字符与文字字符（第 195 页） - 代数使用算术运算符、百分比、取模等符号对数字进行处理。可以将其称为驱动手持计算器的算术引擎。正则表达式相似之处在于，它们使用被赋予特殊角字符来执行模式匹配，例如你在使用\
  \ `Word` 时熟悉的通配符。学习如何使用正则表达式在某种程度上是学习这些元字符是什么、做什么以及如何使用它们。它们是根据上下文转换为特殊字符的普通字符。可以将其称为一个执行文本模式匹配的正则表达式引擎。\n\
  *   正则表达式小贴士 (第 196 页） - 几个正则表达式段可以作为更复杂的搜索模式的构建块。\n*   正则表达式示例 - 搜索枚举 (第 197 页）\
  \ - 此部分介绍了如何通过正则表达式搜索枚举。\n*   **正则表达式（前瞻/后后瞻）**：将正则表达式段与其之前/之后的内容关联。正则表达式向前瞻/后后瞻（第\
  \ 198 页） - 一种特殊的机制，被称为向前瞻（look ahead）和向后瞻（look behind），它允许正则表达式段与紧随其后或之前的内容关联。这种机制允许人们搜索所有\
  \ `Serial.something`，其中 `something` 是任何非 `print` 内容。\n*   **正则表达式（捕获/分组）**：分组（捕获）提取文本。正则表达式分组（第\
  \ 198 页） - 正则表达式不仅是匹配文本，还可以允许捕获文本的部分。\n*   **正则表达式（贪婪性）**：贪婪性意味着在放弃控制之前尽可能获取所有；懒惰性意味着一次获取一个。贪婪性（第\
  \ 199 页） - 正则段可以是贪婪的（在放弃控制前获取所有），也可以是懒惰的（一次获取一个字符）。理解贪婪性很重要，因为 `*` 的工作方式与 `.*?`\
  \ 不同。\n\n## 正则表达式术语\n\n### 1. 术语\n\n与其他编程工具一样，正则表达式有自己的术语。以下是一些针对正则表达式的术语：\n\n**文字字符**：这些是在编写或编码时使用的字母、数字和特殊字符。某些字符根据上下文具有特殊用途，此时被称为元字符。\n\
  \n元字符是具有特殊含义以完成特定任务的文字字符。例如，`*` 在正则表达式正文中表示零次或多次，因此是一个元字符。当它在字符类内部时（如 `[-+/*]`），它表示星号。这意味着查找\
  \ `-` 或 `+` 或 `/` 或 `*`。（有关什么是字符类的解释，请见下文）。同样注意 `-` 符号被放在了开头。在字符类内部，`-` 符号表示范围，例如在\
  \ `[a-z]` 中，它是一个元字符；当放在字符类的开头时，它被降级为文字字符，从而失去了元属性。字符的元属性是取决于上下文的，即它在某个上下文中可能是元字符，而在另一个上下文中可能是文字字符。元字符是使用正则表达式的关键，它们被列出并解释在元字符与文字字符（第\
  \ 195 页）中。\n\n*   **匹配**：如果正则表达式成功则返回 true，否则返回 false。\n\n\n\n\n\n## 正则表达式（元字符）\n\
  \n### 转义（反斜杠 \\ `）将元字符转换为普通字符\n在元字符之前的反斜杠 `\\` 会将其转换为普通字符，或者赋予其特殊含义，例如 `\\s` 表示空格或制表符。当需要将反斜杠降级为字面字符时，请使用双反斜杠\
  \ `\\\\`，第一个 `\\` 意味着将下一个字符视为字面量处理（进行转义）。\n\n### 字符类 `[...]` 定义要搜索的字符\n字符类意味着当前字符可以是方括号内的任意一个字符：数字由\
  \ `0-9` 标识，字母由 `a-zA-Z` 标识。例如，C++ 变量名中的合法字符包括一个或多个下划线、数字和字母——定义 C++ 变量的正则变为 `[_a-zA-Z][_0-9a-zA-Z]*`。注意，这里有两个方括号组（两个字符类组）。这种组合表示：一个有效的\
  \ `C++` 变量名以下划线和/或字母开头，随后是零个或多个下划线和/或字母和/或数字。`*` 符号表示零次或多次（用 `+` 代替 `*` 则表示一次或多次）。这是从基础正则段组合复杂正则的示例。该过程在下文的正则表达式入门\
  \ [(第 194 页)]](#part0023.xhtml_a8B4) 部分有详细介绍。\n\n### 字符类简写\n有很多内置的简写来表示特定的字符类。\n\
  \n- 使用 `\\d` 代替 `[0-9]` 来指定数字。\n- 使用 `\\w` 代替 `[_0-9a-zA-Z]` 来指定下划线、数字或字母。\n- 使用\
  \ `\\s` 代替 `[ \\t]` 来指定空格或制表符。\n- `\\D` 表示不是数字。\n- `\\W` 表示不是字母。\n- `\\S` 表示既不是空格也不是制表符。\n\
  \n### 量\n`?` 表示可选。`*` 表示零次或多次。`+` 表示一次或多次。字符可以重复多次；`{٣}` 表示三次。`[a-zA-Z]{٣}`（三个连续的字母，小写或大写）。`{٠,٣}`\
  \ 表示重复 `٠` 到 `٣` 次。\n\n### 分支\n分支意味着选择，通常表示为括号内用或 符号 `|` 分隔的项：`( red | blue | white\
  \ )`。\n\n### 锚点意味着在文本行的开头 `^` 或结尾 `$` 查找内容\n位置或锚点 `^` 表示行首，`$` 表示行尾。考虑考虑以下正则：`^The.*?fox\\\
  .?$`——你可以将其拆解如下：`^The` 表示搜索以 `The` 开头的行，后面跟着任意内容 `.*?`，并以 `fox` 结尾（`$` 符号标记行尾），且带有一个可选的行末句号\
  \ `\\.`。注意 `.*?` ；它意味着任意字符（点）、零次或多次（星号）、懒惰搜索（问号）。参见后文的正则的贪婪性 [(第 199 页)]](#part0023.xhtml_a8KX)。\n\
  \n### 分组、捕获和反引用\n当正则包含括号时，每个左括号代表一个组，可以引用为 `$١`、`$٢` 等供应用程序使用，或在正则内部作为 `\\١`、`\\\
  ٢`... 进行反引用。参见下文的正则分组 [(第  ١٩٨ 页)]](#part0023.xhtml_a8TC)。\n\n### 正则段组合单个模式形成复杂的模式\n\
  正则可以拆分为它的组成部分，这些部分被称为““段”。例如，正则 `labo[u]?r` 拥有 `٦` 个段：`labo` 中的四个字母是四个段，后面跟着一个可选的\
  \ `[u]?`，最后是 `r`。\n\n### 贪婪性意味着在放弃控制权之前获取所有能获取的内容（速度）；懒惰性意味着只获取一个字符并让正则继续（功能性）\n\
  贪婪性——是的，确实有贪婪性这种说法。这意味着正则段会在将控制权交给下一个正则段之前，尝试获取所有它能获取的内容。贪婪段可以变为懒惰的。它会改变正则引擎的操作方式。这在使用结构\
  \ `.*`（意味着零次或多次获取任意内容——贪婪获取）时尤为重要。某些情况需要贪婪性，另一些则需要懒惰性。参见后文的正则的贪婪性 [(第 199 页)]](#part0023.xhtml_a8KX)\
  \ 章节获取关于贪婪性机制的解释和示例。我无法强调它的重要性。如果你打算使用正则，请花时间理解这个概念，这对你有好处。\n\n## 1. 正则入门\n\n正则表达式是正则引擎使用的模式，用于确定在处理的字符字符串内部是否找到了匹配项。如果整个正则匹配，则返回\
  \ true，否则返回 false。它还可以返回值，供应用程序使用（捕获），或在正则后续解析时在更深处使用。\n\n参见下文的正则分组 [(第 198 页)]](#part0023.xhtml_a8TC)。\n\
  \n最简单的正则是字面量语句。因此，正则 `brown` 会搜索行中的 `b`、`r`、`o`、`n` 出现情况。\n\n上面的行包含 `brown`，但它不在开头。如果正则是\
  \ `^brown`，它将返回 false，因为它被要求寻找以 `brown` 开头的行。\n\n注意为了方便，我可以将正则重写为 `[b][r][o][n]`，这意味着\
  \ `b` 后接 `r`，后接 `o`，后接 `n`。这就是正则执行的方式。它不是搜索单词，而是一次处理一个正则段。\n\n我们也可以搜索 `brown foxes`\
  \ 而不是 `brown dogs`，所以正则可以是 `brown\\s+fox(es)?`，这意味着搜索 `brown`、一个多个空格 `\\s+`、`fox`，以及可选的\
  \ `es`。\n\n到目前为止很简单。一旦你理解了词汇，正则很容易解析。注意上面使用 `^` 指字符串开头。`^` 和 `$` 是位置指示，也称为锚点。`^`\
  \ 表示开头，`$` 表示结尾。这些在正则术语中被称为元字符，由此引出了字符类型的概念。\n\n## 2. 元字符与字面字符\n\n正则使用两种字符：字面字符（要搜索的内容）和元字符（正则运算符）。\n\
  \n### 元字符\n元字符是作为模式运算符的字母或符号。\n- 元字符（又称特殊字符）：`\\ ^ $. [] ( ) | * +? { }`\n\n###\
  \ 字面字符：搜索的字符\n字面字符是任何未定义为元字符的字符，或者是在元字符上下文之外的元字符。要把元字符作为字面字符使用，需要用反斜杠进行转义。例如，星号\
  \ `*`（零次或多次）可以通过转义 `\\*` 转换为普通星号。\n\n\n\n\n\n# 正则表达式（元字符）[AUX]上下文决定了模式匹配字符是元字符还是字面量\n\
  \n字符的字面性与元字符性取决于其上下文。例如，括号在字符类内部是字面字符，在其他则是元字符。因此，`([(]hello[)]` 尽管有些刻意，但它的意思是在一个组内查找\
  \ `(hello)` 序列。第一个括号是元字符，用于开始一个分组；第二个括号（在方括号内部）意味着查找左括号，右括号也是如此。另一种方法是转义括号而不是将它们放入字符类中；该模式变为\
  \ `(\\(hello\\))`。\n\n以下是元字符的详细列表：\n\n*   `Regex (metacharacters)[AUX]?` 意味着前面的段落是可选的，在进行搜索时也意味着贪婪或懒懒性模式。`Regex\
  \ (metacharacters)[AUX]Quantifier {1-x}` 表示重复 1 到 x 次。四种数量量化符如下：:::\n    *   `-`\
  \ 零次或多次。\n    *   `+` 一次或多次。\n    *   `?` 可选，不一定存在。\n    *   `{1-x}` 重复前面的正则段，在本例中为\
  \ 1 到 x 次。例如，五位邮政编码为 `[0-9]{5}`。扩展邮政编码为 `[0-9]{5}(-[0-9]{4})?` —— 第二组四个数字是可选的。\n\
  \n*   `Regex (general)[AUX]Character class [...]` 定义要搜索的字符。`[]` 定义字符类 - 它包含了要搜索的字符。例如，`[a-zA-Z]`\
  \ 意味着查找一个小写或一个大写字母。在上面的邮政编码示例中，`[0-9]{5}` 意味着查找五个连续数字。另一个例子：美国在使用以 'or' 结尾的名词与与人不同。美国人写\
  \ labor, harbor... 英国人写 labour, harbour... 两者都是正确的——处理这些情况的正则可以是 `labo[u]?r`、`harbo[u]?r`。`?`\
  \ 表示可选，不一定存在，这与星号后的问号 `(.*?)` 不同，后者意味着使用懒惰遍历（见下文 正则表达式贪婪性 `(page 199)`）。\n\n*  \
  \ `Regex (metacharacters)[AUX]Escape (backslash \\)` 将元字符转换为普通字符。`\\` 转义符将元字符转换为普通字符，或定义快捷方式，例如用\
  \ `\\d` 表示数字，或用 `\\1` 反向引用组 1。例如：`\\*` 查找星号。它将元字符 `*` 转换为字面字符 `*`。\n\n*   `Regex\
  \ (metacharacters)[AUX]Caret ^` 同时用作锚点（文本开头）和字符类中的否定。脱字符符号 `^` 有两种用途，取决于上下文 —— 将其作为锚点匹配搜索文本的开头。例如，`^The`\
  \ 意味着搜索文本开头的 `The`。`^` 也用作字符类内部的否定，如 `[^  ] ` 意味着既不是 X 也不是 Y 也不是 Z。\n\n*   `Regex\
  \ (metacharacters)[AUX]$` 符号将搜索锚定在文本结束。`$` 符号是一个锚点。在字符串末尾查找匹配。`(fox\\.?)$` 在 The\
  \ little brown fox 中返回 true，因为字符串以 fox 或 fox. 结尾（fox 后面跟着或不跟着点）。注意，这个特定的正则允许可选的点号来标记行尾，并且点号经过了转义以抑制其元字符属性。\n\
  \n*   `Regex (greediness)[AUX]Period/asterisk '.*?', period/plus '.+?'` 后接问号意味着懒惰搜索任何内容。字符类之外的点号意味着匹配任何字符。例如，后续序列\
  \ `.[A-Z]` 开头的点意味着任何字符后紧跟一个大写字母。经常使用的 `.*?` 意味着查找零次或多次任意内容，懒惰版本（见下文 正则表达式贪婪性 `(page\
  \ 199)`）。\n\n*   `Regex (metacharacters)[AUX]OR symbol '|'` 意味着括号组内的几种备选方案（选择）。竖线\
  \ `|` 表示或（OR），即替代方案，例如 `(white|black)` 查找白色或黑色的某些东西。\n\n*   `Regex (captures/groupings)[AUX]Grouping\
  \ with '|' (OR)` 列出备选方案。`Regex (captures/groupings)[AUX]Grouping (capture)` 提取括号对的内容。括号对\
  \ `( )` 在提供备选方案（如 `(white|black)`）时将内容分组。左括号标记组的开始。它还允许正则引擎将选定的值存储到编号缓冲区——例如：在 `(white|black)`\
  \ 中，如果找到了 white， `$3` 将包含 white，`3` 是正则模式中的第三个左括号。见下文 正则表达式分组 `(page 198)`。\n\n\
  *   空格 - 在编写 C++ 代码时，使用空格增强可读性。在编写正则表达式时不要这样做。空格是一个字面字符，就像字母 `a` 一样。例如 `( == | !=\
  \ )` 意味着查找前后都有空格的等于或不等于；这个正则将找不到 `a==b`，因为等号关系没有被空格限制。C++ 编译器并不关心。\n\n## 1. 正则小贴士\n\
  \n这里有几个响应特定目的正则段：\n\n*   `Regex (greediness)[AUX]ZIP code example gotcha or how\
  \ laziness solved the problem` `Regex (examples)[AUX]ZIP code example gotcha or\
  \ how laziness solved the problem` `([0-9]{5}(-[0-9]{4})?)` 邮政编码 —— 括号对用于捕捉数据——见\
  \ 正则表达式分组 `(page 198)`。\n\n*   `\\s*` 零次或多次空格或制表符，或 `\\s+` 一次或多次。\n\n*   `Regex\
  \ (examples)[AUX]Extract a variable's name; define floating-point numbers` `\\d+\\\
  .\\d{4}+` 是四位小数浮点数，即一个或多个数字后面跟着一个点以及四个数字。在这个正则中，字符类之外的点号需要转义。\n\n*   `[_a-zA-Z]\\\
  w*` 代表一个有效的 C++ 名称。第一个字符应该是下划线或字母但不是数字。连续字符，如果有（由于 `\\w` 后有 `*`），可以是下划线、数字、字母。\n\
  \n*   `(abc|12345|really neat)` —— 搜索替代字符串。\n\n*   `Regex (examples)[AUX]Greedy\
  \ vs. lazy search anything` `.*` 意味着任意，贪婪版本；`.*?` 意味着懒惰版本。确保你理解 `.*` 和 `.*?` 的区别。不识别这一点会导致某些搜索无法进行。见下文\
  \ 正则表达式贪婪性 `(page 199)`。\n\n## 1. 正则示例 - 搜索枚举\n\n`Regex (examples)[AUX]Step-by-step\
  \ example regex to find enums` 想象正则表达式是由系列小构建块组成的序列，我们称之为正则段。逐个隔离并检查它们。我将使用上述内容来说明我创建的用于搜索枚举的正则。该正则假设良好的编程实践和标准的代码格式规范。枚举声明应该从行开始，声明应该一直持续并包含大小限定符\
  \ `uint8_t`，但不一定包含大括号，大括号可能在下一行。这是一个典型的枚举：\n\n```\nenum class EMyEnumList: uint8_t\
  \ { list of comma separated items };\n```\n\n定义了枚举的语法后，可以为上面的每个组件创建一个正则并组合成一个完整的正则。创建搜索此类枚举的正则从分析枚举的语法开始：\n\
  \n*   enum 关键字是文本中的第一个单词。这假设枚举声明从换行开始。正则以零或多个空格 `\\s*` 开始跟随关键字 `enum`，然后是一个或多个空格\
  \ `\\s+`，即 `^\\s*enum\\s+`\n\n*   `class qualifier (optional)` —— 枚举关键字可能跟着可选的 `class`\
  \ 关键字，后面跟着一个或多个空格因此：`(class\\s+)?`。\n\n\n\n\n\n- `enum names`（枚举名称）是由一个或多个下划线、大小写字母和数字组成的组合（第一个字符不能是数字）`[_a-zA-Z]\\\
  w*`。由于需要捕获名称，因此整个查找名称的正则表达式段包含括号内，即：`([_a-zA-Z]\\w*)`。\n\n不需要进一步深入，因为我们只想要名称。让 Perl\
  \ 查找枚举名称的完整正则表达式变为上述内容的组合，如下：\n\n`/^\\s*enum\\s+(class\\s+)?([_a-zA-Z]\\w*)/`\n\n\
  开头和结束的正斜杠 `/` 界定了正则表达式。这是 `Perl` 和 `Awk` 的要求，因为正则表达式的语法使用了所有字符，包括空格。尽管上述内容看起来有些晦涩，但通过分解，一次处理一个部分，可以简化其分析。将其输入\
  \ `AtmelStudio`、`Visual Studio`、`PlatformIO` 或 `Arduino IDE V2` 来检查语法（不带正斜杠分隔符）。\n\
  \n## 1. 正则表达式断言/后溯 (Regex look ahead/behind)\n\n<x>正则表达式（断言/后溯）[AUX]基于现有项的条件搜索</x>前瞻（Look\
  \ ahead）和后溯（Look behind）是断言。前瞻表示：使用后续的正则表达式段从此位置查找文本。如果找到，则返回真，否则返回假。例如，假设有以下行文本：\n\
  \nThe little brown fox scrambled through the field. The red fox stayed behind the\
  \ fence.\n\n前瞻正则表达式段 `fox\\s+(?=scrambled)` 匹配第一个 `fox`，但不匹配第二个。光标将定位在 `scrambled`\
  \ 之前。\n\n<x>正则表达式（断言/后溯）[AUX]使用前瞻查找所有不是 prints 的 Serial.???</x><x>正则表达式（示例）[AUX]使用前瞻查找所有不是\
  \ prints 的 Serial.???</x>另一个例子：我使用了前瞻正则特性 `(?=` 和 `(?!)` 来检测所有不是 prints 的 `Serial`\
  \ 语句：`Serial\\d*\\.(?!print)`。它的意思是：查找所有 `Serial`，后面跟着一个可选的数字（`Serial`、`Serial3...`），紧接着是一个句点，且该点后面不是\
  \ print（`?!print)`）。\n\n前瞻和后溯还有很多内容。它们可以变得非常复杂。你可以在以下网站找到详细信息：`regular-expressions.info/lookaround.html`。\n\
  \n## 2. 正则表达式分组 (Regex groupings)\n\n<x>正则表达式（捕获/分组）[AUX]分组（捕获）提取括号对的内容</x>分组允许从文本中提取特定值并在稍后用于正则内部（反向引用）或由包含正则引擎的应用程序使用（捕获）。它基于括号对，例如下面的正则表达式骨架：\n\
  \n`(... (..)...)...( ... )`\n\n上面的骨架有三对开/闭括号，因此有三组，其值由起始括号和相应闭合括号内部的内容定义。注意括号可以嵌套。\n\
  \n假设有以下文本：\n\n`A dark blue background hinders visibility.`\n\n以及以下包含三个组的正则表达式，其中一组是嵌套的。\n\
  \n`.*?((blue|green)\\s+background).*?(visibility|appearance)`\n\n在上述，`\\s+` 指一个或多个空格。`.*?`\
  \ 是对任何内容的懒惰匹配。\n\n这三组分别产生：\n\n`\\1` 或 `$1` = `blue background`\n\n`\\2` 或 `$2` =\
  \ `blue`\n\n`\\3` 或 `$3` = `visibility`\n\n上面的正则表达式有从 1 到 3 编号的三个组，因为从左到右有三个左括号。左括号是组的起始标记。在这个示例中，我们将拥有\
  \ `$1`、`$2` 和 `$3`。这些 `$x` 是变量，包含分组匹配的值。应用程序可以使用它们在找到匹配时继续执行它本应执行的操作。如果没有匹配，则不要使用它们，因为它们是空的。当正则解析文本行时，这些组可以在正则内部用于完成反向引用。改变了\
  \ `\\1`、`\\2` 和 `\\3` 的语义。这种反向引用的典型用途是检测诸如 `this this` 这样的重复单词。正则表达式为 `(\\w+\\s)\\\
  1`。这个正则意思是：找到任意数量的字母或数字，后面跟着空格，然后是组 1 中的任何内容，换句话之，即重复。在你喜欢的 IDE 中尝试一下。在替换部分输入 `$1`\
  \ 等，并观察原始行是如何被修改的。关于 `$x` 变量的一个额外说明：小心 `$0`，它存储正在执行的 `Perl` 程序名称。它与正在处理的行没有关系。在\
  \ `Awk` 中，`$0` 包含正在处理的整行。如果你在 `Perl` 程序中想要行，请使用 `$_`。\n\n将正则应用于文本行时，想象正则光标在正则内部一次移动一个正则段，而字符串光标在行中一次移动一个字符。在文本行\
  \ `The little brown fox.` 中，正则 `brown` 将从行开始并搜索 `b`。一旦找到，它就会搜索 `r`，依此类推。一旦找到 `n`，它就会停止并返回真。在获取正则匹配的真/假结果后，处理做什么取决于应用程序。\n\
  \n在 `Perl` 中使用正则时，在正则捕获过程中可能会出现细微的未初始化变量情况。假设正则包含 `(\\w+)?` 作为第三个左括号。当你执行 `if($3\
  \ != \"\")` 时，如果没有找到文本，`Perl` 会发出警告提示 `$3` 未初始化。其由于没有找到文本，`$3` 没有得到值，因此未初始化。\n\n\
  ## 3. 正则表达式贪婪性 (Regex greediness)\n\n<x>正则表达式（贪婪性）[AUX]贪婪意味着在放弃控制权之前获取所有（速度）；懒惰意味着只获取一个字符并让正则继续（功能性）</x>在我所有的编程中，我从未遇到过“贪婪”这种概念。但确实，正则表达式区分了正则引擎在应用特定正则段时的运行方式。它可以以两种模式之一运行：它是贪婪的，意味着它获取它能得到的一切；它优先考虑自己；它是完全自私的。或者是懒惰的；它将控制权交给连续正则段；它是礼貌的；它是无私的；它对连续正则段说，你感兴趣看一眼后面的字符吗？请注意，贪婪是官方正则术语。\n\
  \n<x>正则表达式（贪婪性）[AUX]邮编陷阱或懒惰解决的方法</x><x>正则表达式（示例）[AUX]邮编陷阱或懒惰解决的方法</x>这是一个贪婪正则的示例，其目标是从地址中提取邮编。正则表达式可以是\
  \ `.*\\d+`。它的意思是查找任意内容 `.*` 后面跟着一个或多个数字 `\\d+`。这就是我们大脑运作的方式——我们扫描行，查找任意内容，在数字出现时停止，然后尽可能获取多个连续的数字。\n\
  \n为了完全理解正则引擎在做什么，添加一对括号来创建一个组，以便应用程序可以使用它找到的内容作为 `$1`。带有分组的相同正则变为 `.*(\\d+)`。\n\n\
  现在，将正则应用于字符串 `Freeport ME 04032, USA`。`$1` 将包含 `2` 而不是 `04032`，这完全出乎意料——预期的是 `04032`，而不是\
  \ `2`。这就是正则的做法：\n\n*   从 `.*` 正则段开始。让它获取它能得到的所有。它获取了整行，因为 `.*` 告诉它获取任何内容，包括邮编、逗号和行尾的\
  \ USA。\n\n\n\n\n\n*   由于第二个正则段 `\\d+` 还没有机会发挥作用，正则表达式引擎从行尾开始一个字符一个字符地向前回溯，直到第二个正则段\
  \ `(\\d+)` 找到它正在寻找的内容。当这个第二个正则段遇到 ZIP 编码中的最后一位数字 `2` 时，它说：好的，没问题，我找到了一个数字；既然我需要一个或多个，所以一个就足够了。我执行完毕。\n\
  *   由于没有更多的正则段需要满足，正则表达式以成功状态返回：`$1` 包含 `2`。\n\n上面的结果令人惊讶，因为原本预期是得到整个 ZIP 编码。解释是引擎为了速度进行了优化。第一个段先抓取了所有内容，然后进行回溯。在这种情况下，匹配任何内容的\
  \ `.*` 被归类为贪婪模式。\n\n### 正则表达式懒性搜索\n\n在贪婪正则段 `.*` 后添加一个 `?` 会将其转换为懒性正则段 `.*?`。完整的正则表达式随后变为\
  \ `.*?(\\d+)`。以下是懒性处理序列：\n\n*   从左到右逐段应用正则段。它从第一个正则段 `.*?` 开始。\n*   它抓取一个字符并将控制权传递给下一个段\
  \ `\\d+`。\n*   `\\d+` 段测试该字符，如果失败，它会将控制权传回给前面的段，该段向前移动字符。\n*   如果第二个段 `\\d+` 成功（它遇到了一个数字），它会抓取它并检查下一个数字。与此同时，第一个段\
  \ `.*?` 不再被调用，因为它已经完成了工作。第二个段 `\\d+` 继续执行，直到遇到非数字。然后停止。\n*   当整个正则表达式被满足时（即 `.*?`\
  \ 和 `\\d+` 都满足了条件），正则表达式停止并返回真。第一个正则 `.*?` 找到了一系列所有可能的字符，直到被第二个正则 `\\d+` 接管。\n\n\
  `$1` 将返回整个 ZIP 编码 `04032`。这种往返的控制权段间转移会显著减慢搜索过程，但它能完成任务。\n\n匹配所有内容的 `.*` 的贪婪行为与懒性行为的区别在于：贪婪模式处理整个字符串然后回溯，从而给第二个段提供寻找内容的机会。在懒性处理方式中，第一个段一次移动一个字符缓慢进行。它找到某些东西，询问第二个段这是否是它想要的东西。如果不是，第一个段继续向前移动一个字符，控制权来回地传递，直到第二个段找到了它想要的东西：一个数字。一旦第二个段开始运行，第一个段就会说：好的，我完成了，你继续吧。由于第二个段正在寻找数字的重复，它会一个接一个抓取它能找到每一个连续数字，直到它发现没有更多连续的数字。在此时，由于两个段都已完成各自的任务，正则表达式返回真，`$1`\
  \ 包含完整的 ZIP 编码。贪婪版本很快但得不到正确结果；懒性版本很但能得到正确结果。可以通过 `(\\d{5})` 找到折中方案。它的意思是：从头开始；寻找任何内容；当你在到达行尾时，回溯，直到你找到五个连续的数字。这个解决方案既快又能完成任务。\n\
  \n### 正则表达式（贪婪性）\n\n这是另一个例子。该正则表达式旨在选择方括号内的文本。\n\nA [garden] offers great [outdoors]\
  \ potential.\n\n你可能会这样做：\n\n```markdown\n\\[(.*)\\]\n```\n\n正则表达式搜索一个左括号 `[`，然后搜索任何内容\
  \ `.*`，然后搜索一个右括号 `]`。你可能期望 `$1` 返回 `garden`。括号的作用是抓取内容，它们不是搜索的一部分。结果是它选择了从第一个括号到最后一个括号之间的所有内容，包括文本，\n\
  \n`$1` 返回 `garden] offers great [outdoors`\n\n因为一旦找到一个左括号，正则段 `.*` 就会抓取直到文本行尾的所有内容，然后将控制权移交给右括号段\
  \ `]`，该段会回溯，直到找到一个右括号。由于它是一个字符一个字符地回溯的，当它一找到右括号时就停止了，而这恰好是第二个右括号，而不是第一个。这是因为序列 `.*`\
  \ 是贪婪的。\n\n在 `.*` 后放置一个 `?`，即 `(.*?)`，将正则表达式转换为懒性，结果是正则表达式一次移动一个字符地缓慢进行。第一个段将控制权传递给第二个段，第二个段尝试寻找右括号；没有找到，它将控制权返回给第一个段，第一个段向前移动一个字符，依此类推，来回传递，直到找到右括号，即第一个右括号。结果是\
  \ `$1` 包含了预期的内容：\n\n`garden`  own 不是 `garden] offers great outdoors`。\n\n贪婪性在匹配所有内容的\
  \ `.*`（任意字符零次或多次）结构中是一个重要概念。务确保你理解如何区分贪婪的 `(.*)` 和懒性的 `(.*?)` 用法，因为你可能会经常使用它。\n\n\
  ### 1. Awk vs Perl\n\n在我继续开发基于 Arduino 的蜂蜂重量系统时，我需要使用之前创建的函数。我发现我忘记了某些函数的作用，而我没有对它们进行记录。当我梳理代码时，我插入了注释。在这样做时，我意识到如果注释组织得当，我就可以用\
  \ Awk 程序提取它们，那是我在 Unix 时代用过的一种文本处理工具。这使我慢慢创建基于关键词的模板，以封装内联文档。我开始用一个 Awk 程序从源代码中提取基于模板的文档；但随后，我迁移到了\
  \ Perl。参见 [程序文档框架（第 155 页）。\n\n\n\n\n\n*   定义条件的最简单方法是使用逻辑语句，例如 `$1 == \"James\"\
  `。这意味着：对第一个标记 `$1` 进行模式匹配，以检查第一个单词是否为 James。`Awk` 会将文本行分解单词（标记），并将它们放入变量 `$1`、`$2`\
  \ 等中。每当读取换行符时，这种操作都会自动进行。这种规则可以通过排除被注释的行来创建一个源文件的子集。\n\n*   条件也可能包含正则表达式（regex），例如\
  \ `^\\s*//`，这意味着从行首 `^` 开始，查找零个或多个空格 `\\s*`，然后查找两个连续的正斜杠 `//`。如果匹配成功，则返回真。正则表达式初看起来可能很晦懂，但你很快就能习惯这种语法，并发现解开它其实很简单。请参阅正则表达式\
  \ (regex) (第 191 页)。\n\n`Awk` 条件可以通过 AND (`&&`) 和 OR (`||`) 运算符将逻辑语句和正则表达式结合起来，从而混合使用它们。\n\
  \n如果对文本块的模式匹配条件成功，则需要执行操作。这被称为动作块（action-block）——它是一组包含在大括号中的语句，就像定义函数时所做的一样。执行工作意味着使用编程语句获取所需的结果：打印一行、设置状态变量、执行某些逻辑或存储处处信息。\n\
  \n### Awk (通用)[AUX]\n\n使用 `Awk` 可能适用于：\n\n在使用带有命令行参数（程序和文件）调用 `Awk` 后，你不需要打开并加载文件，也不需要专门地逐行读取。`Awk`\
  \ 会自动遍历所有文件的所有行并应用规则。当处理完所有行后，程序结束。这再简单不过了。以下是 `Awk` 可能擅长的的一些用途：\n\n#### Awk (示例)[AUX]从代码注释模板生成文档、列出宏和枚举\n\
  程序文档 - 代码注释是一条金律。你应该编写每个函数的作用、参数和变量的作用，以及任何有助于阐明函数如何运行的说明。给定一个设计良好的注释结构，从 `.h/.cpp`\
  \ 文件中提取注释将变得轻而易举。这促成了程序文档框架 (第 155 页) 的创建，该框架在框架章节介绍，最初使用 `Awk` 开发，后来使用 `Perl`。\n\
  \n#### Awk (示例)[AUX]生成函数调用引用 - 谁调用谁以及谁调用谁\n函数调用引用 - 随着函数数量增加，可以通过列出函数调用的交叉引用来改进代码维护：谁调用谁以及谁被调用。\n\
  \n*   列出宏 - 我的蜂箱重量系统应用程序很大。随着时间的推移，我在整个应用程序中创建了宏（#define）。一段时间后，我可能停止了某些宏，但无意中留下了它们。`Awk`\
  \ 可以找到它们——它还可以列出被注释的宏。使用 `Perl` 也可以列出未使用的活动宏，但我偏题了。\n\n*   枚举列表 - `enums` 与宏类似，可能被定义在各处。列出它们是有意义的，包括被注释的枚举也是如此。`Perl`\
  \ 也是。它可以被用于列出未使用的 `enums`。\n\n#### Awk (示例)[AUX]列出潜在错误，例如用 = 代替 ==\n错误检测 - 某些难以发现的错误，例如在\
  \ `if` 语句中使用 `=` 代替 `==`，或者 `switch` 语句中缺失或空的默认值，可以很容易找到。请参阅错误操作 (第 ١١٧ 页)。\n\n\
  #### Awk (示例)[AUX]打印文件的子集\n打印文件的一部分 - 一个 `Awk` 规则可以复制文件并排除注释行。\n\n#### Awk (regex)[AUX]不支持基于括号的捕获\
  \ - Perl 支持\nPerl (Awk vs. Perl)[AUX]不支持基于括号的捕获 - Perl 支持\nAwk (通用)[AUX]学习曲线平缓 -\
  \ 没什么难度\nAwk (regex)[AUX]不支持基于括号的捕获 - Perl 支持\nPerl (通用)[AUX]Perl 比 Awk 好\nPerl\
  \ (Awk vs. Perl)[AUX]Perl 比 Awk 好\nPerl (通用)[AUX]Perl 支持基于括号的正则表达式捕获 - Awk 不支持\n\
  \n开发 `Awk` 程序来涵盖上述某些内容被证明是容易且并不特别耗时的，尽管我确实遇到了一个主要的障碍。在开发文档框架时，我非常沮丧地发现 `Awk` 不支持正则表达式括号的捕获。这意味着无法使用正则表达式来自定义放入内置变量\
  \ `$1`、`$2` 等中的内容。不支持这一功能阻止了我完成某些任务。我有些想做的事情却就是无法做。。我不得不改变策略，寻找另一种具有支持该功能的内置正则表达式引擎的文本处理语言。\n\
  \n\n\n\n我的结论是，当你想要快速上手时，可以使用 `Awk` 来逐行分析文本文件。`Awk` 非常简单，它基于通过模式匹配机制来选择要处理的行。对于每个匹配项，都需要执行特定的工作。然而，如果你需要一个强大的工具（不一定得是功能完备的\
  \ `C++` 工具），你可能会认为投入时间学习 `Perl` 是值得的。最后，如果正则表达式基于括号的捕获对你来说非常重要，那么 `Perl` 就变得必不可少（这就是促使我从\
  \ `Awk` 切换到 `Perl` 的原因）。\n\n尽管我曾建议忘记 `Awk` 并学习 `perl`，但我仍然尝试介绍 `Awk` 并描述它的工作原理，以便你对其进行实验。\n\
  \n# 1. Awk\n\n如果你打算使用 `Perl`，可以跳过整个章节，但我建议你阅读一下这部分介绍内容，它简要描述了 `Awk`。\n\n### Awk\
  \ (概述)\n`Awk` 是一种命令行文本处理工具，它包含一种通过模式匹配（逻辑语句或正则表达式）逐行执行文本搜索的机制，并通过一组类似于 `C` 的指令（动作块）来执行工作。可以称之为\
  \ `Awk` 编程语言。你向它提供一组纯文本文件（不是 Word 文件，也不是任何包含格式代码的文件）。它将这些文件合并成一个大的文本行序列，并逐行（称为“记录”）处理整个部分。一组按顺序顺序激活的规则将测试每行是否与某个模式匹配，以决定是否应该处理该行。\n\
  \n由于 `Awk` 逐行处理文本，因此它会尝试将该行与模式（条件）进行匹配。如果找到匹配项，它就会对其执行某些操作（动作块）。条件/动作块对定义了一个规则。`Awk`\
  \ 读取一行并将第一条规则应用到该行上。如果条件为真，则将相应的动作块应用到该行。然后它会尝试下一条规则，依此类推，直到所有规则都有机会处理该行。完成规则处理后，`Awk`\
  \ 读取下一行并重新开始，逐个应用所有规则，直到所有行都处理完毕。\n\n### Awk (规则)\n当 `Awk` 读取一行文本时，它会将内容分解为字段（令牌），令牌是环绕在空格或制表符的字符序列。第一个令牌放入内置变量\
  \ `$1`，第二个放入 `$2`，依此类推，`$0` 是整行。如果规则的条件评估为真，与条件绑定的代码块（动作块）将处理该行。每条规则（条件/动作块）都可以被看作一个函数，条件是激活函数体的标准，动作块是处理该行的类似于\
  \ `C` 的语句。\n\n请注意，如果条件是正则表达式（regex）且评估为真，它将不会通过正则表达式的括号分组捕获任何内容。这很遗憾。`Awk` 的捕获仅限于在读取行并在应用任何规则之前自动分词令牌为\
  \ `$1`、`$2` 等。\n\n*   条件是两种模式匹配机制之一，评估结果为真或假：逻辑语句和正则表达式。请注意，这些可以混合使用，通过逻辑与 (`&&`)\
  \ 和逻辑或 (`||`) 运算符创建复杂的条件。逻辑语句是任何评估为真或假的 `Awk` 语句。例如：逻辑语句 `$1 == \"Sasha\"` 查看第一个令牌，如果它包含\
  \ Sasha，则返回真。正则表达式模式搜索是一种基于逐个字符搜索以查找匹配的技术。使用正则表达式查找 Sasha 将是 `/^\\s*Sasha/`，`^`\
  \ 表示从行开始，`\\s*` 查找零或多个空格或制表符，查找连续五个字符 S, a, s, h, a。请注意，你并没有要求正则表达式查找字符串 Sasha ——\
  \ 你是要求它查找五个特定字符的序列，一个接一个。重要的是，正则表达式实现的是一种一次一个字符的搜索机制。它不是基于词的搜索引擎。参见正则表达式 (regex)\
  \ (第 191 页)。\n\n*   `Awk` 动作块是类似于 `C` 的函数块。它们包含类似于 `C` 的语句：变量、函数调用、如 `if`、`for`、`while`\
  \ 等控制语句。`C++` 程序员会发现 `Awk` 的语法非常熟悉。\n\n如果你没有选择使用 `Perl`，我建议你继续读下去以了解 `Awk` 能做什么以及如何使用它。`Awk`\
  \ 的其余内容在以下章节中详细介绍：\n\n*   Awk 术语 (第 206 页) - `Awk` 有其专门的术语，就像所有编程语言一样。\n*   Awk\
  \ 程序结构 (第 206 页) - `Awk` 是一种极其基础的编程语言，旨在通过模式匹配机制（逻辑语句或正则表达式）选择性地处理单行。它的语法类似于 `C`。一个\
  \ `Awk` 程序是由自定义函数和变量、内置函数和变量、`BEGIN` 块、`END` 块以及一系列规则组成的。\n*   Awk 与 C (第 214 页)\
  \ - 由于 `Awk` 与 `C` 非常相似，精通 `C` 的初学者可能会误 `Awk` 的行为；在开始 `Awk` 编程之前，这一节是必读的。\n*   注意事项\
  \ - 就像所有工具和编程语言一样，`Awk` 也有它的陷阱和坑。为了你好，始终带有 `-lint` 选项运行 `Awk`。参见在 DOS 框中调用 Awk (第\
  \ 301 页) 和 Awk 坑 (第 216 页)。\n*   Awk (附录) (第 301 页) 部分涵盖了下载和开始使用 `Awk` 以及使用 DOS\
  \ 命令行框 (`cmd.exe`) 启动 `Awk` 程序。它还包含了帮助你入门 `Awk` 的示例和其他信息。考虑到 `Awk` 的用途，我鼓励使用它。然而，在深入学习\
  \ `Awk` 和编写 `Awk` 程序之前，我强烈建议你查看 `Perl`，因为它可以做 `Awk` 能做的所有事情，以及更多。相反，它的学习曲线较长。\n\n\
  \n\n在本章以及 Awk（附录）（第 301 页）中，我尝试总结了足够的内容，让你能够编写大多数需要的 Awk 程序。不过，其中还有更多内容，这从 500 多页的\
  \ `gawk` 官方手册可以推出来，但只要你理解几个基本概念，在开始之前不需要阅读手册。可以参考手册来澄清概念。如果你已经在编写 `C++`，那么学习曲线最多只需要几个小时，时间足够理解它的特殊之处。参见下文的\
  \ Awk 与 C（第 214 页）。\n\n## 1. Awk 术语\n\nAwk 没有专门的词汇表，但有几个术语与之相关。\n\n- 规则（rule）是一个条件/动作块，例如\
  \ `$1 == \"Sasha\" { statements }`。\n-- Awk 条件 (第 209 页） 既是逻辑语句、正则表达式，或是两者的结合。\n\
  -- Awk 动作块 (第 209 页） 是封装在花括号中的 Awk 语句序列。它们类似于 `C` 程序函数。\n-- Awk 语句是动作块内部类似于 `C`\
  \ 的语句。使用分号标记语句结束不是强制的，但为了避免混淆，可能需要。我建议你始终在语句结束加上分号。\n-- 记录（Records）和字段（fields）：记录是文本的一行。字段是文本行中的一个项目，也被称为标记（token）。它是一个由空格分隔的字符序列。它可以被看作是一个单词。注意\
  \ `a = b`（注意空格）定义了三个字段：`a`、`=` 和 `b`；`a=b`（没有空格）定义了一个字段：`a=b`。此类细节可能会导致混淆。\n\n##\
  \ 2. Awk 程序结构\n\nAwk 是一个命令行文本处理工具。你向它输入你创建的 Awk 程序和要处理的文本文件。它将文件合并成一组连续的文本行，然后根据你创建的一组规则（条件/动作块）逐行处理这些行。\n\
  \nAwk 代码类似于 `C` 代码。你的 Awk 程序可能包含四个部分，其中任何部分都不是强制性的。它可能包含函数、变量、数组。函数可能包含基础控制运算符 `if`、`for`、`while`\
  \ 等。在看 Awk 程序时，`C++` 程序员会立即感到熟悉。此外，它的语法类似于 `C++` 的语法。我应该说这种相似性具有欺骗性，因为 `C++` 的专业知识会让新手\
  \ Awk 程序员产生先入为主的偏差。\n\n在用大多数语言创建程序时，代码的前几行包含全局声明、管理性代码（如 `#include \"MyIncludeFile.h\"\
  `）、全局变量、各种声明、初始化等。这些都是单行代码。Awk 则不同，所有代码行必须位于四种构造之一：用户函数、`BEGIN` 块、`END` 块和规则。在这些之外编写独立的单行代码是一个错误，Awk\
  \ 会静地让其通过，因为它将其视为一个仅包含条件的规则。这行多余的代码将被执行，结果是根据该多余代码的内容决定正在处理的文本行是否打印。\n\nAwk 程序从运行\
  \ `BEGIN` 块开始。然后它将文件合并为一组连续的行。它加载第一行，将行划分为标记并赋予内置变量 `$1`、`$2` 等（`$0` 包含整行），并将整个规则集（条件/动作块）应用于它。规则处理在处理下一行时重新开始。当所有行都处理完成后，将调用\
  \ `END` 块。程序在此之后结束。\n\n在创建 Awk 程序时，请关注构成它的四个部分：用户函数、一个 `BEGIN` 块、一个 `END` 块和一组规则（条件/动作块）。这些任何一个都不是强制性的。\n\
  \n这里有一个 Awk 程序框架：\n\n```awk\n# # 号是注释符号\n\nfunction MyFunction1(_param1, param2,\
  \ ... ) {\n    #Awk 语句\n} # MyFunction1 \n\n... 更多用户函数\n\nBEGIN {\n    # 当应用程序启动时执行的代码\n\
  } # BEGIN 块结束\n\nEND {\n    # 当应用程序处理完所有文件的所有行时执行的代码\n} # END 块结束\n\n#规则\ncondition1\
  \ { action-block 1 }\ncondition2 { action-block 2 }\ncondition3 { action-block 3\
  \ }\n...\n```\n\n就是这样——没那么复杂。\n\n- `BEGIN` 块在处理文本行之前执行。它可以用于初始化全局变量、在处理行之前打印文本、更改某些内置变量。\n\
  \  `BEGIN { statements...}`\n- `END` 块与 `BEGIN` 块相同，不同之处在于它在处理完文件后执行。它可以用于报告总值并指示\
  \ Awk 已完成工作工作。\n  `END { statements...}`\n- 规则（条件/动作块）是 Awk 程序的核心。它们与函数的区别在于，它们没有名称，不接受参数，也不返回结果。规则包含两个部分：条件和动作块，两者都不是强制的。条件是一个模式（逻辑语句或正则表达式或两者的结合），定义了在处理的行中搜索的内容。如果模式找到匹配项，则执行动作块。Awk\
  \ 读取一行，将其划分为 `$1`、`$2` 等，并测试其是否与规则条件匹配，规则从上到下逐条进行。如果有匹配项，则执行规则的动作块。当所有规则处理完毕后，它重新开始，加载下一行；进行划分并用第一条规则进行处理。当所有行都处理完成后，它调用\
  \ `END` 块并结束。记住，如果你正在处理多个文件，Awk 会将文件合并为一个整体。整组规则应用于每一行。当所有行都处理完成后，Awk 终止。尽管如此，Awk\
  \ 提供了一种在处理时知道该行属于哪个文件的方法（参见 Awk 内置变量第 313 页）。\n\nAwk 规则可以是只有条件，也可以只有动作块，两者都不是强制性的。如果没有条件，则动作块将应用于读取的每一行。如果没有动作块，则符合条件的行将被打印。最后一种功能允许根据一个或多个标准生成原始文件的子集。例如：如果你想打印所有未注释的行，可以使用规则\
  \ `/^\\s*[^/][^/]`。这意味着：如果行不是以注释开头，则打印它。正则表达式的意思是：从行开始 `^`，查找零或多个空格 `\\s*`，搜索两个不是正斜杠的连续字符\
  \ `[^/][^]`。如果你只想打印注释行，则使用以下正则表达式：`^\\s*//`。\n\n\n\n\n\n# Awk (变量与函数)\n\n### 用户定义函数\n\
  与 C 语言一样，Awk 支持用户定义函数。这些函数与 C 函数相似：它们有名称、接收参数、包含执行任务的语句，并可能返回值。它们封装了代码以完成某些功能。函数以关键字\
  \ `function` 开头，拥有名称，接收括号括起来的参数，定义在大括号括起来的语句块，并可以从函数体内的任何地方返回结果。函数必须在使用之前定义好。Awk\
  \ 不支持函数声明，主要是因为一个 Awk 程序通常只有一个文件；而不是像 C++ 程序那样包含多个文件。这是一个典型的 Awk 函数。\n\n```awk\n\
  function MyFunction( parameters ) { statements... }\n```\n\n注意这里没有定义返回类型，这意味着在查看函数的第一行时，无法判断它是否返回任何内容。你必须查看代码才能确定。为了方便，请系统地编写注释来记录函数，从而说明函数是否有返回值。\n\
  \n### 内置函数和变量\n内置函数和变量对于控制 Awk 的行为以及处理字符串有用。\n\n### 变量\n注意上面的程序骨架，没有定义任何全局变量；这是因为函数中使用的所有变量（参数除外）都是全局变量。\n\
  \n### 注释\n注释与 C++ 中的注释相似，但使用井号符号 `#` 代替了双斜杠 `//`。井号符号 `#` 之后到行尾的所有内容都被视为注释。\n\n\
  ### 调用 Awk 与错误\n当从 DOS 命令行窗口调用 Awk（第 301 页）时，请务必使用 `-Wlint` 选项。这将为你节省麻烦和痛苦，否则 Awk\
  \ 会静默地忽略你可能犯各种错误，例如由于拼写错误意外创建了新变量，或者忘记用双引号括字符串。\n\n### 编辑 Awk\n此外还有使用 Aw Awk 编辑器创建\
  \ Awk 应用的问题。你可以使用记事本（notepad），但有更好的选择。我发现配置了 Perl 的 Notepad++ 是编辑 Awk 应用的良好工具。你也可以使用带有\
  \ Awk 扩展的 VS Code。参见 VS Code Awk 扩展（第 96 页）。\n\n## Awk 条件\n\n条件可以是简单的语句，例如 `$5 ==\
  \ \"Sasha\"`，其中 `$5` 是内置变量，指正在处理的行的第五字段；也可以是任何求值为真（非零）或假（零）的类 C 语句；或者可以是一个正则表达式，例如查找\
  \ `if` 语句 `\\s*if\\s*\\(`。这意味着搜索零或多个空格 `\\s*`，接后是字符 `i` 和 `f`，然后是零或多个空格 `\\s*`，最后是一个左括号\
  \ `\\(`。条件可以是一个逻辑语句（如 `$1 == \"Sasha\"`），也可以是用斜杠括起来的正则表达式（如 `/^\\s*Sasha/`）。在这种情况下，正则表达式表示：从行首\
  \ `^` 开始，搜索零或多个空格 `\\s*`，然后搜索五个字母 `S, a, s, h, a`。注意逻辑语句和正则表达式的作用机制不同。逻辑语句将变量 `$1`\
  \ 与字符串 `\"Sasha\"` 进行比较。正则表达式作用于整行——它在寻找由五个特定字母组成的序列。起始和结束的斜杠表示该条件是正则表达式而非逻辑语句。逻辑语句和正则表达式可以通过逻辑与\
  \ (`&&`) 和逻辑或 (`||`) 运算符混合使用。\n\n## Awk 动作块\n\n动作块和函数块是完全相同的。它们是一组在大括号 `{}` 括起来的语句，就像\
  \ C 函数一样。动作块可以包含任意数量的有效 Awk 语句，因此：\n\n```awk\ncondition {\n    statement;\n    statement;\n\
  \    ...\n}\n```\n\n其中 `statement` 是有效语法，如 `c=a+b` 或 `print($3)`。不过，与 C 相比有两个区别：\n\
  \n- 动作块是无名的。函数块有名称。\n- 动作块不返回值也不接收参数。但它们可以引入 `$1`、`$2` 等内置参数；这些参数包含了构成文本行的各个单词。\n\
  \n随着规则的执行，Awk 允许停止处理当前行并跳转到下一行。有两个内置函数可以做到：\n\n- `next` 函数停止对当前行的立即处理，获取下一行并从顶层规则重新开始。它的工作方式就像\
  \ for 循环中的 `continue` 语句。\n- `getline` 函数在不带参数使用时与 `next` 类似，区别在于它会继续处理下一行，而不会返回顶层规则。`getline`\
  \ 接受参数来执行各种工作。\n\n## Awk 规则\n\n使用 Awk 的关键在于良好理解条件/动作块（规则）：\n\n```awk\ncondition1\
  \ { action-block1 } # 规则 1\ncondition2 { action-block2 } # 规则 2\ncondition3 { action-block3\
  \ } # 规则 3\n```\n\n条件是一个求值为真或假的逻辑语句或正则表达式，或者是通过与 (`&&`) 或或 (`||`) 连接的它们的组合。条件可以是任何内容：变量、常量、代码行、逻辑语句、正则表达式等。无论它是什么，都会被求值，结果为\
  \ 0（假）或非 0（真）。当条件的模式在行上的搜索结果为真时，就会执行对应的动作块。无论动作块是否执行，Awk 都会继续处理规则。在上面的代码段中，Awk 将对当前行应用\
  \ `rule1`，然后是 `rule2`，依此类推。如果相应的条件返回真，则执行动作块。在继续之前，我应该补充一点：规则是条件/动作块的组合，其中条件和动作块都是可选的。这在后文的“无条件规则”和“无动作块规则”中会有进一步解释。\n\
  \n\n\n\n\n# Awk 规则\n\n## Awk 基础\nAwk 文件被分为记录（records），记录分为字段（fields，文本行/单词）。默认记录分隔符\
  \ `ORS` 是换行符（行）；默认字段分隔符 `OFS` 是空格或制表符（文本行中的单词）。\n\n### 内置变量与函数\n- **ORS**: 输出记录分隔符\
  \ - 默认是换行符（`ORS = \"\\n\"`）。\n\n让我补充一下关于记录和字段。从非正式的角度来说，我一直指的是文本行和标记（tokens）或单词。Awk\
  \ 的定义更为具体。它处理记录和字段。记录是以记录分隔符 `RS` 分隔的字符串，`RS` 设置为 `\\n`（换行符）。因此，默认情况下一个记录是一行文本。在默认情况下，记录号和行号是相同的。更改这一点对于处理多行记录很有用，例如将\
  \ `ORS` 改为两个回车符（`ORS = \"\\n\\n\"`）。在这种情况下，一旦发现多行记录，记录和文本行就会不同步。\n\n- **FS**: 字段分隔符（默认\
  \ `\" \"`）。\n- **RS**: 输入记录分隔符（默认 `\"\\n\"`）。\n\n以相同的方式，字段是文本行内的单词，由字段分隔符 `FS` 分隔，`FS`\
  \ 默认为空格或制表符。因此，字段、标记和单词是相同的；单词和文本行是默认值。处理 CSV（逗号分隔值）文件需要将字段分隔符重定义为逗号 `FS = \",\"\
  `。\n\n由于默认记录分隔符（`RS`）是换行符（`\\n`），默认字段分隔符（`FS`）是空格和制表符（`\\t`），可以直接处理 C/C++ 源无需更改\
  \ `RS` 和 `FS`。但如果你想更聪明，可以将分号定义为 `RS` 记录分隔符；通过这样做，你可以一次读取一个 C++ 语句，无论它占据单行还是多行。参见\
  \ Awk 内置变量（第 313 页）。\n\n## 1. Awk 规则 - 标记化\n如前所述，Awk 一时读取一行文本。它使用规则的条件来确定是否对当前行执行操作，即执行相应动作块（action-block）中定义的工作。\n\
  \n### 字段变量\n规则使用行标记中的字段 `$1`、`$2` 等。Awk 将记录的内容分解标记为 `$1`、`$2` 等字段。变量 `$0` 包含整行。非常简单，如果你想找到定义宏的行，只需执行\
  \ `$1 == \"#define\"` 即可。当它找到第一个字段为 `#define` 的行时，会调用相应的动作块。问题是，注释掉的 `#defines`\
  \ 将无法找到，因为条件会失败，由于 `$1` 可能包含 `//` 或 `//#define`。\n\n### 正则与宏\n正则表达式可以查找宏：`#define`、`#ifdef`……。使用正则表达式进行模式匹配要强大得多。使用它更优，因为它提供了基本逻辑语句不具备的灵活性。正则表达式\
  \ `^\\s*(//)?\\s*#define` 可以同时找到已注释和未注释的 `#defines`。它的意思是：从行首 `^` 开始，找到零或多个空格 `\\\
  s*`，紧接着是一个可选的 C++ 注释 `(\\//)?`，然后是零或多个空格 `\\s*`，最后是 7 个字符 `#define`。注意 `//` 周围的括号和问号。它的意思是：寻找两个连续可选的正斜杠\
  \ `//`。这意味着该正则将找到所有 `#defines`，无论是否有正斜杠，无论是否附在 `#define` 上。\n\n如果你想判断该宏是否为注释宏，你需要测试\
  \ `#defines` 后面是否附带了注释 `//`。这样做是复杂的，因为 `$1` 可能包含 `#define` 或者 `//` 或是 `//#define`。由于\
  \ Awk 不支持正则捕获，你无法利用正则分组来通过正则 `(\\//)?#define` 直接测试 `$1` 的内容。Awk 需要代码来确定 `//` 是否存在。在\
  \ Perl 中，你可能可以使用正则捕获，如 `(\\//)?`。此时 `$1` 将为空或包含 `//`，从而定义该宏是激活的还是被注释的。\n\n基于逻辑语句查找\
  \ `#defines` 的条件是：\n```\n$1 == \"#define\" || $1 == \"//#define \" || ($1 == \"\
  //\" && $2 == \"#define\")\n```\n这些逻辑语句处理了已注释和未注释的 `#defines`。然而，如果你还要处理 `#endif`、`#if`、`#else`……（每一个都可能被注释或未注释），你需要共\
  \ 15 个基础逻辑语句并用或运算符 `||` 分组。使用正则表达式要简单得多且不易出错。这是你会编写的正则表达式（开始/结束的正斜杠不是正则的一部分，Awk\
  \ 要求使用它们来以区别于逻辑语句）：\n```\n/^\\s*(//)?s*#(define|if|endif|else|error)/\n```\n这个正则表达式完成了与\
  \ 15 个逻辑语句相同的任务。如果第一个捕获显示它确实是 `//`，则结论是该宏被注释了。这个正则表达式可能看起来有点晦涩；但你可以通过从左到右逐个分析项目来理解它。经过练习，你就会习惯的。\n\
  \n查找宏的 Awk 替代方案是查看前两个标记 `$1` 和 `$2`：\n- `$1` 是否以 `#` 开头？如果是，找到了宏。\n- `$1` 是否以两个斜杠\
  \ `//` 开头并跟有 `#`？\n- `$1` 是否以两个斜杠 `//` 开头且 `$2` 为 `#`？\n\n使用正则表达式会简单得多，但 Awk 不支持正则捕获。\n\
  \n## 1.1. Awk 规则 - 无条件规则\n没有条件的规则等同于条件始终为真的规则。无条件的 `{操作}` 规则等同于始终 true `1 {操作}`\
  \ 规则。由于条件 `1` 求值为真，动作块始终会被调用。\n\n假设你想创建一个带有行号的源文件副本。你可以创建规则：\n```\n{ print \"/*\
  \ line\", NR, \"*/ \", $0 }\n```\n由于没有条件，它将打印每一行并在前面加上行号。这个动作块会产生：`/* line 37 */\
  \ 内容`\n\n另一个简单的规则：它在每行的开头打印文件名和行号：\n```\n{ print ARGV[ARGIND+1],\":\", NRF, \" -\
  \ \", $0; }\n```\n输出将是 `MyFile:348 - 这行文本`。注意这个规则没有条件——这意味着每行都会打印文件名和行号。可以使用内置变量\
  \ `FILENAME` 代替 `ARGV[ARGIND+1]`。\n\n## 1.2. Awk 规则 - 无动作规则\n没有动作块的规则（即只有条件的规则）在条件求值为真时会打印该行。这种规则等同于\
  \ `条件 { print $0 }`。示例：假设你想创建一个不包含注释行的 C++ 文件副本。使用正则表达式 `^\\s*[^/][^/]`。它的意思是：从行首\
  \ `^` 开始，寻找零或多个空格 `\\s*`，然后前两个非空格非制表符字符不是正斜杠 `[^/][^/]`。结果所有不以两个正斜杠开头的行都将被打印。你可以用逻辑语句如\
  \ `$1 == \"//\"` 来实现，但如果 `$1` 包含 `//#define` 呢？条件将求值为假。使用正则表达式要简单得多。\n\n\n\n\n\n\
  关于条件的最后一点：它们可以求值为任何值。任何有效的 Awk 语句都会求得某个值：零或非零。假设你创建了一个独立的语句，即一个相对于左边界对齐、既不在函数内也不在规则内的语句，例如\
  \ `c=a+b`。你只是创建了一个没有规则的动作块（action-block）。当 `c` 求值为非零时，就会打印该行。注意了！\n\n### 1. Awk\
  \ 规则 - 使用逻辑语句或正则表达式\n\n<x>Awk (规则)[AUX]简单条件使用逻辑语句，复杂条件使用正则表达式，或二者结合</x>\n大多数规则都同时包含条件和动作块。这里有一个简单的示例：\n\
  \n```\n$1 == \"class\" { foundClass = 1 }\n```\n\n`$1 == \"class\"` 是一个逻辑语句。该规则的意思是：如果第一个字段\
  \ `$1` 包含字符串 `class`（包含引号内），则调用动作块 - 它将变量 `foundClass` 设置为 `1`。这里有几点需要注意：\n\n* \
  \  该条件是一个类 C 语言的逻辑语句，除了 Awk 特有的 `$1` 变量之外。\n*   动作块看起来很熟悉。它是一个类 C 语言的函数体。注意使用大括号来包裹语句，以及使用赋值运算符\
  \ `=`。\n*   上面的赋值没有包含末尾分号，就像你在 C/C++ 和 Perl 中写的那样。在 Awk 中，分号是可选的。如果对后续内容存在歧义，则必须使用分号。我系统地使用分号来标记语句的结束。这使得代码更具可读性。\n\
  *   Awk 不识别真/假。它认为 `0` 为假。任何非零值（正数或负数）都表示真。\n\n<x>Awk (规则)[AUX]简单条件使用逻辑语句，复杂条件使用正则表达式，或二者结合</x>\n\
  接下来是一个更复杂的逻辑语句示例。程序员的意图是搜索类、结构体和枚举。很简单——只需查看 `$1`。由于这些总是以相应的关键字开头，假设此类声明是从新行开始的。\n\
  \n定义以下规则以获取类、结构或枚举的名称：\n\n```\n$1 == \"class\" || $1 == \"struct\" || $1 == \"enum\"\
  \ { ... }\n```\n\n名称应该在 `$2` 中，或者在枚举的情况下可能在 `$3` 中（第 2 或 3 个字段）。获取名称后，需要一些处理来清理它，因为\
  \ C/C++ 并不总是要求空格来分隔项。类名后面可能紧跟一个大括号，例如\n\n```cpp\nclass myClass{ ... }\n```\n\n从而污染了名称。在这种情况下，$2`\
  \ 将包含 `myClass{`。\n\n`enum` 声明稍微复杂一点。它们可以用几种方式之一进行定义，例如：\n\n```\nenum EEmployee\
  \ {... // 标准短定义，使用了空格\nenum class EEmployee{... // 添加了 class 但省略了大括号前的空格\nenum EEmployee:\
  \ uint8_t{... // 添加了大小限定符，使用了空格\nenum class EEmployee:uint8_t{... // 添加了类限定符大小限定符，省略了空格\n\
  ```\n\n这带来了两个问题：\n\n*   枚举名称可能在 `$2` 或 `$3` 中。\n*   名称可能被大括号 `{` 或冒号 `:` 或更多字符污染，例如上面第\
  \ 4 行中的 `EEmployee:uint8_t{`。\n\n程序员必须测试 `$2`，因为它可能包含枚举名称或 `class` 单词。找到名称后，他/她必须通过移除潜在的不需要的尾随字符（如左大括号\
  \ `{`、冒号 `:` 等）来清理它。\n\n从上述可以判断，使用基于逻辑语句的条件可能是繁琐的。使用正则表达式捕获会高效得多，如下：\n\n```\n(class|struct|enum[\\\
  s]+(class)?)[\\s]+(\\w)+[{:]?\n```\n\n就是这样！花了我五分钟。名称或枚举、类、结构体在 `$3` 中，即第 3 个分组（第\
  \ 3 个左括号）。正则表达式有效地区分了类定义和枚举的类属性之间的类 关键字。但你无法在 Awk 中做到这一点，因为它不支持正则表达式捕获；你需要用 Perl\
  \ 来完成。\n\n结论是，简单条件应使用逻辑语句；复杂条件使用正则表达式，如果你确实需要通过正则表达式捕获文本，可能需要迁移到 Perl。\n\n### 2.\
  \ Awk BEGIN 和 END\n\n<x>Awk (规则)[AUX]BEGIN 和 END 块在程序开始和结束时运行</x>\nAwk `BEGIN` 和\
  \ `END` 块是内置的空函数骨架，就像你启动一个新的 Arduino sketch 时的空设置和循环一样——这取决于程序员决定如何使用它们。它们包含的语句可以是任何合法的\
  \ Awk 语句。`BEGIN` 在处理任何文本行之前调用。`END` 在处理完所有文件中所有文本行后调用。这使得 Awk 程序能够在程序开始和结束时执行内部清理工作。\n\
  \n*   `BEGIN` 可以包含用户变量和内置变量的初始化。它可以执行程序头部的打印以及任何其他初始化。\n*   `END` 可以打印整体处理的结果（如总计），完成收尾工作，并以“End\
  \ of Program”之类的消息结束。\n\n### 3. Awk 函数和变量\n\n<x>Awk (注意事项)[AUX]函数与 C 函数类似，可以返回任何类型的值</x>\n\
  Awk 函数与 C 函数非常相似，它们可以接受参数并返回值，就像 C++ 一样，但没有显式类型。它们通过使用来确定类型。参数在括号中，正体在大括号中。与 C++\
  \ 和 Perl 不同，没有函数声明。函数是先定义后使用的。\n\n*   <x>Awk (变量和函数)[AUX]函数以 'function' 开头</x>关键字\
  \ `function` 在函数名称之前。\n*   <x>Awk (变量和函数)[AUX]函数与 C 函数类似，可以返回任何类型的值</x>函数可以通过 `return`\
  \ 关键字返回。。`return` 语句是可选的，如果省略，调用函数将接收到垃圾值。\n*   函数名和左括号之间不能有空格。\n\nAwk 函数的结构如下：\n\
  \n```\nfunction MyFunction( parameter list ) {\n    statement\n    statement\n \
  \   ...\n}\n```\n\n内部定义的变量是全局的，但函数的参数是局部的，尽管命名可能与全局变量相同。参见功能说明（第 304 页)。\n\n###\
  \ 4. Awk 与 C\n\n<x>Awk (对比 C)[AUX]源于 Unix，因此基于 C 语言</x><x>Awk (对比 C)[AUX]你的 C 语言经验可能是误导</x><x>Awk\
  \ (通用)[AUX]在学习 Awk 时，你的 C 语言经验可能是误导</x><x>误导[AUX]在学习 Awk 时，你的 C 语言经验可能是误导</x>Awk\
  \ 的起源追溯到 Unix。C 语言是为了开发 Unix 而发明的。许多工具被创建用来完成各种任务（grep, sed, Awk, Perl……）。这些都受益于经验。这就是为什么它们看起来像\
  \ C，但存在差异，因为它们是为了不同的需求。如果你从未编写过 C，你将学习 Awk 而不会像丰富的 C 程序员那样犯错，因为他们会像编写 C 程序一样编写 Awk，从而对\
  \ Awk 的工作原理做出错误的假设。因此，丰富的 C 程序员请注意——存在差异，某些差异非常微妙。参见功能说明（第 304 页)。\n\n以下是一些显著的差异。\n\
  \n*   <x>Awk (对比 C)[AUX]# 符号表示到行的注释</x>`#` 符号表示该行剩余部分是注释，类似于 C++ 的 `//`。不支持 C 注释对\
  \ `/*...*/`。\n*   <x>Awk (对比 C)[AUX]两种变量类型：浮点数和字符串 - 需声明，直接使用</x>Awk 只有两种变量类型：浮点数和字符串——没有字符、整数、有符号/无符号、指针等。变量不需要声明，直接使用。\n\
  \n\n\n\n\n## Awk (Awk 对比 C)\n\n#### 函数中使用的变量是全局的\nAwk 变量是全局的，这可能会导致意外情况，特别是在使用 `i`\
  \ 作为索引变量的 `for` 循环中。可以通过以下方式测试：定义第一个包含以 `i` 为索引的 `for` 循环函数。创建第二个打印 `i` 值的函数。调用第一个函数，然后调用第二个函数。你会发现第二个函数中\
  \ `i` 的值将对应于第一个函数执行完毕时 `i` 的值，尽管它并没有被声明为全局变量，也没有作为全局变量使用。\n\n#### 字符串索引从 1 开始\n\
  Awk 字符串是从 1 开始的。字符串中第一个字符的索引是 1，而不是像 C++ 那样从零开始。这意味着返回字符串字符位置的函数将返回从 1 开始的位置，如果未找到则返回\
  \ 0。\n\n#### 数组索引可以是整数、浮点数、字符串\nAwk 数组看起来像 C 数组，但它们的实现完全不同。数组索引是键，键可以是浮点数或字符串。将\
  \ Awk 数组想象成一个通过键访问记录的数据库。一个特殊的 `for` 语句允许遍历数组。参见 Awk 参考 中的数组 (第 309 页)]。\n\n####\
  \ 支持正则表达式\nAwk 支持正则表达式，但它不支持正则表达式基于括号的捕获机制。\n\n#### 语句末尾的分号不是强制的\n语句末尾的分号不是强制的。然而，应该使用它来消除歧义。连续执行两个\
  \ `print` 语句 `print a print b` 是合法的，但 `print a x = 10` 是非法的。为了可读性和良好的编程习惯，我建议系统地使用分号来标记语句的结束，并让每个语句单独成行。\n\
  \n#### print 语句并非完全字面量，需要理解其机制\n`print` 语句并不要求打印列表包含在括号内，此外，相应的项目不需要用逗号分隔。然而，使用逗号会影响在打印项目之间是否添加空格。参见\
  \ Awk print (第 315 页)。我建议你系统地使用逗号，并在 `BEGIN` 块中设置 `OFS`（输出字段分隔符）或 `\"\"`（无空格）。参见\
  \ Awk print (第 315 页)。\n\n这只是冰山一角。参考任何 Awk 参考，你会发现它是一个很好的资源。它是完成各种任务的基础工具。Awk 附录包含更多细节。参见\
  \ Awk 某些示例（第 304 页）。\n\n话虽如此，尽管可能重复，我强烈建议你使用 `Perl` 而不是 `Awk`。使用 `Perl`，你将能够完成 Awk\
  \ 能做的一切，以及更多。\n\n## Awk 的陷阱 (gotchas)\n\n#### 过度简单导致陷阱\n在设计一种不具 C 复杂性的简单易用类 类语言的过程中，其设计者无意中在\
  \ Awk 中内置了一个重要的潜在陷阱。以下是我遇到的一些陷阱。\n\n#### -Wlint 标志：使用命令行标志 -Wlint 显示错误\n编程错误——我以前习惯了让\
  \ C 编译器作为防止我可能犯错误的安全网。这通常效果良好。然而，在 Awk 中，你不能依靠解释器来保护你，因为它会静默地通过错误，除非你使用 `-Wlint`\
  \ 命令行选项对你可能犯的某些错误发出警告。在编写代码时你必须格外小心。例如，如果你拼写错了 `return x` 将其写成 `returns x`，它不会报错，没有错误信息。你只会得到垃圾数据。在不经意间，通过将\
  \ `return` 错拼为 `returns`，你创建了一个名为 `returns` 的变量，导致留下了两个并排坐的变量（`returns` 和 `x`），这是合法的。这就是为什么没有错误信息。你的错误是一个合法的\
  \ Awk 语句。使用 `-Wlint` 选项将触发对 `returns` 的未使用/未初始化告警。如果你做了像 `a b c d` 这样的愚蠢事，你定义了四个未初始化的变量，它们无任何作用。这样的语句是合法的，除非你使用\
  \ `-Wlint` 选项，否则它不会被报告。\n\n#### 小心 if、while、函数等中的空格，括号必须紧跟 if 等\n定义函数时的空格——小心，Awk\
  \ 使用空格来解析内容，因此 `if(` 意味着开始一个 `if` 语句，因为后面跟着一个左括号。然而，`if (` 意味着将 `if` 和 `(` 拼接成一个字符串。同样，函数定义和函数调用不允许在括号前有空格。\n\
  \n```\nfunction MyFunction () { ... }\n```\n由于 `MyFunction` 和 `(` 之间存在空格，这是非法的。问题是\
  \ Awk 并不总是报告错误，你会得到一个空白输出并纳闷为什么。这绝对令人沮丧。\n\n#### 单个字符是字符串\nAwk 不认识字符；它只认识字符串——C++\
  \ 程序员既考虑字符也考虑字符串：`'A'` 是字符；`\"A\"` 是字符串。Awk 只以字符串的形式工作。如果你想定义一个单独字符，必须定义一个长度为一的字符串。\n\
  \n#### 变量类型使用：无声明\n不需要声明变量，因为它们在第一次使用时就会创建。这种简单性可能是危险的。例如，假设你写了\n\n```\nif(name\
  \ == Sasha) instead of if(name == \"Sasha\")\n```\n在 C++ 中你会得到未定义变量错误；Awk 会创建一个名为\
  \ `Sasha` 的新变量——它会被视为一个未初始变量而不是字符串。程序会运行，但结果异常。\n\n#### 孤立代码被静默解释为规则\n孤立代码的副作用——如前所述，一个\
  \ Awk 程序有四个部分：`BEGIN` 块、`END` 块、函数和规则。如果由于不留意，你在这些部分之外写了一行代码，例如 `\"I made a mistake\"\
  ,` Awk 会将其视为规则。记住！一个包含条件没有动作块的规则是合法的；如果条件为真，它将打印整行。所以，如果你写了 `\"I made a mistake\"\
  ,` 你创建了一个包含条件但动作块的规则。由于字符串求非零，它变成了一个条件始终为真的规则。由于没有动作块，该规则将打印每一行，即整个文件。如果你写的是 `b\
  \ = 0`，条件将为 0，因此该行不会被打印。\n\n顺便提一下，一个包含动作块但没有条件的规则也是合法的。它会在每一行上都执行动作块，就像你写了 `1 {\
  \ statements }`。取决于动作块的内容，你可能会得到大量的输出，或者什么都没有。\n\n#### 字符串索引从 1 开始\nAwk 字符串是从 1\
  \ 开始的，不像 C++ 和 Perl 那样从 0 开始。字符串的索引从 1 开始。字符串搜索函数返回 0 通常意味着搜索失败。\n\n\n\n\n\n# Awk\
  \ (注意事项)[AUX]函数变量为全局，参数为局部\n\n函数变量是全局的，函数参数是局部的 - 只要你第一次使用变量，它就会被定义为全局，无论是在函数内部、`BEGIN`/`END`\
  \ 内部还是规则中。你必须小心索引，例如使用 `i` 的 `for` 循环。如果其他函数使用了 `i`，它们使用的是同一个 `i`，因为 `i` 是全局的。\n\
  \n## 1. Perl\n\n### Perl 通用)[AUX]支持正则表达式的强大 C 类编程语言\n\nPerl 是一种第三代过程化编程语言，类似于 `C`、`Fortran`、`Java`、`Basic`\
  \ 等。在使用过 `Awk` 之后，Perl 证明是一个非常令人享受的选择。我对 Perl 的最佳描述是它是一种包含正则表达式引擎（`regex`）的强大 C\
  \ 类编程语言。它的起源于 Unix，与 `grep`、`ed`、`Awk` 等。我应该强调的是，它不仅仅是一个实用的命令行工具。它是一个能够交付大型程序的完整编程工具。然而，它局限于单个程序文件，但程序员可以将代码封装在模块中，这些模块可以像库组件一样引入。注意，有许多\
  \ Perl 第三方模块可以增强你的程序。\n\nPerl 具有许多深远的功能。它可以加载文件、逐行提取文本、进行模式匹配、通过其 C 类编程语言对文本进行处理，并将结果导出到文本文件中。Perl\
  \ 几乎可以做到 `Awk` 能做的任何事情，甚至更多。你将在以下章节中找到关于 Perl 的更多细节：\n\n*   Perl 术语（下一节） - 理解 Perl\
  \ 的词汇很重要，因为它引入了 `C++` 程序员不熟悉的概念。\n*   Perl (通用)[AUX]使用 Notepad++ 或 VS Code 编辑 Awk、Perl\
  \ 程序。`Notepad++[AUX]编辑 Awk 和 Perl 程序 - 为 Perl 配置它：也适用于 C++ 编辑` Perl 入门教程（第 219 页）\
  \ 包含了足够的信息让你开始进行实际工作，如加载文件、循环遍历它们、进行模式匹配和生成结果。\n*   Perl (构建)[AUX]Perl 的程序结构类似于\
  \ C。Perl 程序结构（第 220 页） 是自由风格，非常像 `C`，但它有自己的特性，例如向函数和数组传递参数。要让一个 Perl 程序运行不需要做太多工作。尝试\
  \ `print \"Hello World from Perl\"`。就是这样；你创建了第一个 Perl 程序。\n*   Perl (构建)[AUX]Perl\
  \ 编程快速概览。Perl 快速概览（第 221 页） 展示了 Perl 程序的全景。\n*   Perl (Awk vs Perl)[AUX]用 Perl 模拟\
  \ Awk 或如何将 Awk 程序转换为 Perl。使用 Perl 模拟 Awk（第 223 页） 运行一组文件并进行逐行模式匹配，正如同 `Awk` 使用条件/动作块一样。Perl\
  \ 相比于 `Awk` 的重要优势之一在于，Perl 能够多次处理一组文件，而 `Awk` 只处理一次。\n*   Perl (通用)[AUX]学习 Perl\
  \ 时，你的 C 知识是一个“假朋友”。`假朋友[AUX]学习 Perl 时，你的 C 知识是一个假朋友` 一如往常，知道如何编写 `C` 会让人对事物运作方式产生先入为主的观念，即假朋友。这会导致陷阱。参见\
  \ Perl vs C (第 224 页)。\n\n注意你可以使用带有 Perl 扩展的 VS Code 环境来创建 Perl 程序。参见 VS Code Perl\
  \ 扩展（第 96 页）。\n\n附录介绍了使用 Perl 构造的细节。参见 Perl（附录）（第 318 页）。\n\n## 1. Perl 术语\n\n###\
  \ Perl (内置变量和函数)[AUX]$PROGRAM_NAME 或 $0，包含启动的 Perl 程序；$（美元符号)[AUX]Perl $INPUT_RECORD_SEPARATOR,\
  \ 或 $RS, 或 $/ - 默认值为 \\n`；$（美元符号]$0 - Awk：刚读入的，Perl：程序名（也是 $PROGRAM_NAME）；Per (文件句柄)[AUX]通过\
  \ open 语句从文件名字符串创建句柄\n\nPerl 使用了一些熟悉的名称，这对于疏意的 `C` 程序员来说可能是陷阱，因为它们隐藏了 Perl 特有的概念。它有自己的术语，例如：\n\
  \n*   Perl (文件句柄)[AUX]读、写或更新模式的文件。文件句柄通过 `open` 函数从文件名创建。它们用于打开/关闭输入、输出或两者的文件。\n\
  *   Perl (构建)[AUX]Perl 处理记录和字段。记录和字段 - 在 `Awk` 和 Perl 中，记录都是字符串。\n*   Perl (构建)[AUX]导入包（use\
  \ 指令）：strict, diagnostic, features。编译指令（Pragmas）放在程序开头。模块（即包）是外部组件。\n*   语句是代码行，语法与\
  \ `C` 相同。注意 Perl 要求语句以分号结束。\n*   Perl (构建)[AUX]Perl 提供了三种数据类型：标量（$）、哈希（%）和数组（@）。`Awk`\
  \ 没有特殊的数据类型，除了浮点和字符串，这些在首次使用时是隐式的。\n*   Perl (构建)[AUX]值传递和引用传递。不支持传递指针。Perl 的传递等同于\
  \ `C` 的值传递。也可以实现引用传递。当将数组传递给可能需要修改数组内容的函数时，引用传递特别有用。参见 Perl 引用传递 (第 329 页)。\n* \
  \  作用域运算符 `::` 实现命名空间概念。由于 Perl 程序可以导入模块，Perl 的创建者通过作用域运算符 `::` 添加了命名空间，类似于 `C++`，这样就可以根据所属模块对变量进行限定。\n\
  *   子程序- `Fortran` 有子程序，Perl 也有。`C`、`Java`、`Awk` 等都有函数。它们是由名称标识的代码块，调用时可以接受参数。称它们为函数、过程、方法或子程序取决于术语问题。我倾向于使用函数一词。\n\
  *   参数 - 我用过的所有第三代语言在定义函数参数和编写函数调用方面都是相似的。Perl 很独特 - 需要习惯。参见 Perl 子程序（函数） (第 322\
  \ 页)。\n*   Perl (构建)[AUX]文本匹配运算符 `==` 允许在语句中使用正则表达式。文本匹配运算符如 `$myString =~ /regex/`\
  \ 表示：如果正则表达式在 `$myString` 中找到匹配则返回真。\n*   Perl (通用)[AUX]Perl 支持基于正则括号的捕获 - Awk 不支持。捕获意味着通过正则提取匹配文本的内容。通过正则表达式中的括号对进行捕获。\n\
  \n*   工具（Utilities）是 Perl 分发版的一部分程序。有几个工具，其中一个是 Awk 转 Perl 的翻译器：`a2p`。我没有在 Strawberry\
  \ 下载中找到它，因此无法对其进行评论，但它确实存在于某处。\n\n\n\n\nPerl 程序与 C 程序相似。它们可能包含函数、变量和数组，但它们存在差异。C++\
  \ 程序员应该警惕“虚假朋友”（false friends）。这里的问题在于避免以不符合 Perl 原生的方式来实现功能。\n\nPerl 程序没有特定的结构。它由解释器指令、导入的包、变量、语句和函数组合而成，形成一个完成任务的单元。它可以短如：\n\
  \n```perl\nprint \"Hello World from Perl\"\n```\n\n也可以长到系统允许的程度。\n\nPerl 程序是一个单一文本文件，扩展名通常为\
  \ `.pl` 或 `.PL`。它通过 `cmd.exe` 控制台（DOS 框）调用。有关 `cmd.exe` 的详细信息，请参阅 DOS 框（附录）（第 237\
  \ 页）。与多模块的 C 不同，Perl 程序是单模块的单个文本文件。然而，它可以通过 pragma 或 use 指令（见下文）作为包（模块）引入外部内容。\n\
  \n以下是一个典型的 Perl 程序调用示例（DOS 框命令行）：\n\n```bash\nPerl myperlProgram.pl arg1 arg2 arg3...\n\
  ```\n\n它包含了对 Perl 的调用、程序名和参数：\n\n*   `Perl`（命令行 - DOS 框）是你需要调用的 `Perl.exe`。\n* \
  \  `myperlProgram.pl` 是你创建的 Perl 程序名。注意，并没有像 Awk 那样的 `-f` 标志来标识程序。它是调用 Perl 后第一个参数。\n\
  *   `arg1` `arg2` `arg3` ... 是 Perl 程序参数，它们将传递到 Perl 内置数组 `@ARGV` 中。它们只是程序员可以根据需要用途的名称。它们可以是任何内容，如何使用取决于程序员。在我的案例中，`arg1`\
  \ 和 `arg2` 分别是输入和输出文件路径，`arg3` 及后续是输入文件。这些参数位于 `@ARGV` 数组中，从索引 = 1 开始。第一个参数（`$ARGV[0]`）包含\
  \ Perl，即调用程序的名称。\n\n以下是典型的 Perl 程序的结构：\n\n*   在创建 Perl 程序时，你受限于将所有代码放在一个文件（`.pl`\
  \ 或 `.PL` 扩展）中，就像 Awk 一样。但与 Awk 不同，你可以导入模块，无论是原生 Perl 模块、第三方模块还是你自己的。用 use 指令开始你的程序。它们是用于导入包的\
  \ Perl 指令。Perl 程序员频繁使用它们。你当然应该大量注释（使用 `#` 代替 `//` 或 `/*..*/`）。请注意，Perl 与 Awk 不同，可以用于处理文本文件和二进制文件（如\
  \ Word 文件）。我将 Perl 的范围限制在文本文件。我没有研究过使用 Perl 处理 Word 文件。\n\n*   根据需要定义函数。注意参数——Perl\
  \ 处理参数的方式相当独特；不过，它支持值传递和引用传递。\n\n*   定义可选的 `BEGIN` 和 `END` 块。`BEGIN` 块在程序启动时执行一次。`END`\
  \ 块在程序退出前执行一次。\n\n*   Perl 支持正则表达式。模式匹配通过模式匹配运算符 `=~` 处理。正则项可以基于括号捕获到 `$1`、`$2`\
  \ 等，并作为变量进行工作。以下语句说明了模式匹配捕获：\n\n```perl\nmy $line = \"The little brown fox ran away\"\
  ;\n\nif ( $line =~ /.*?(brown|red|\\s*)/) { print \" the fox's color is $1\"; }\n\
  ```\n\n此正则表达式只有一个括号组。其内容被赋值给 `$1`。注意匹配运算符 `=~`。如果有匹配，打印语句将输出狐狸的颜色。Perl 的模式匹配非常特殊，它是基于正则的。它不支持通过逻辑语句进行模式匹配，也不像\
  \ Awk 那样自动分词 `$1`、`$2` 等。\n\n*   Perl 通过正则模式匹配的括号捕获机制将文本的部分和片段捕获到 `$1`、`$2` 等。注意\
  \ Perl 的 `$0`并不返回整行。要获取整行请使用 `$_`。Perl 的 `$0` 包含 Perl，即正在运行的调用程序。它与 `$ARGV[0]` 相同，即\
  \ `@ARGV` 数组中的第一项。\n\n上述内容将在后续 Perl 程序结构部分进行详细扩展。\n\n### 1. Perl 程序结构\n\n在创建 Perl\
  \ 程序时，你受限于将所有代码放在一个文件（`.pl` 或 `.PL` 扩展）中，就像 Awk 一样。但与 Awk 不同，你可以导入模块，无论是原生 Perl\
  \ 模块、第三方模块还是你自己的。用 use 指令开始你的程序。它们是用于导入包的 Perl 指令。Perl 程序员频繁使用它们。你当然应该大量注释（使用 `#`\
  \ 代替 `//` 或 `/*..*/`）。请注意，Perl 与 Awk 不同，可以用于处理文本文件和二进制文件（如 Word 文件）。我将 Perl 的范围限制在文本文件。我没有研究过使用\
  \ Perl 处理 Word 文件。\n\nPerl 程序结构非常基础。与 C++ 没有太大区别。程序是一个带有 `.pl` 或 `.PL` 扩展名的单一文本文件。你可以导入相当于\
  \ C++ 的包。\n\n*   程序应该以 use 指令开始，其中三个被高度推荐：\n\n```perl\nuse strict; # 强制显式声明\nuse\
  \ diagnostics; # 提供错误的有用信息\nuse warnings; # 在 Strawberry 发行版上不起\n```\n\n在定义 pragma\
  \ 后，你可以导入库组件。这是通过 use 实现的。还有其他导入包的方法，每种都有其优势。注意单引号或双引号的使用。你可以使用其中一种，这并不重要，因为没有实现字符串插值（见下文\
  \ Perl 字符串插值 - 单引号或双引号（第 323 页)）。应该导入两个两个：\n\n```perl\nuse 'say'; # 它是一个添加换行的 print\
  \ 副本\nuse \"switch\"; # 导入 switch/case/default 机制\n```\n\n*   编写你的代码。在定义了 pragma\
  \ 并导入包后，你可以随心所欲。它可以短如：\n\n```perl\nprint \"Hello World from Perl!\"\n```\n\n或者很详尽。参见\
  \ Perl 程序示例和关于编程 Perl 的详细细节（函数传递、数组、字符串等）。\n\n### Perl 快速概览\n\n上一节 Perl 程序结构介绍了\
  \ Perl 程序的样貌。本节解释了 Perl 底层的一些基本机制。\n\n由于背景是让 Perl 程序逐行处理 C++ 源代码，以下是对 Perl 程序应包含内容的粗略定义：\n\
  \n\n\n\n*   准备工作（Preliminaries）是在进行任何工作之前的初始化和清理工作。你可能想定义一个 `BEGIN` 块，它会在启动时被调用。定义编译处理指令（Pragmas）并加载包（库组件）。两者都基于\
  \ `use` 关键字。你可能还想定义一个 `END` 块来处理程序结束时的收尾阶段。\n\n根据你的需要，你可能导入包（库组件）。它们等同于 C++ 环境中的库模块。请查看\
  \ Perl.org 网站或 Google 的 Perl 模块。我推荐以下内容：\n\n- `use strict` - 确保变量经过了正式声明。\n- `use\
  \ warnings` - 对可以编译但可能过时的代码抛出警告。\n- `use diagnostics` - 我的 Perl Strawberry 下载版本不包含这个包。它包含了\
  \ `warnings` 包。它的效果很好。\n- 使用 `feature 'say'` - `say` 与 `print` 相同，不同在于它会添加换行符，而\
  \ Perl 的 `print` 不会自动添加换行符。这并不是大问题，但它省去了系统性地在 print 中添加 `\\n` 的麻烦。\n- `use feature\
  \ 'switch'` - 提供 switch/case/default 机制，称为 `given/when/default`。Perl 的 switch 语句类似于\
  \ C++，但存在差异。这些差异在 Perl 程序流程控制（第 324 页） 中介绍。\n\n这些模块是 Perl 分发版的一部分。你可能考虑使用来自 Perl.org\
  \ 网站的其他模块、第三方模块，或尝试创建自己的 Perl 模块。Google Perl 模块。\n\n### Perl（变量与函数）\nPerl 类型通过特殊字符区分：`$scalars`、`@arrays`、`%hashes`。\n\
  \n变量声明 - 记住有三种变量：`$scalars`、`@arrays`、`%hashes`。每个变量类型必须以相应的特殊字符开头。如果开启了 `strict`\
  \ 指令，变量在使用使用时必须加上作用域解析符 `my`，以使其在声明的作用域内变为局部变量。如果使用了 `use strict` 指令，全局和局部变量都必须声明。注意\
  \ Perl 支持在同一语句中进行变量声明和初始化。全局变量应该声明在程序文件的顶部，位于模块导入（`use package`）之后。\n\n### Perl（文件句柄）\n\
  `$filehandle` 通过 `open` 语句从文件名字符串创建。\n\n导入文件 - 文件名可以作为命令行参数传递。导入的是名称而不是文件本身。Perl\
  \ 程序必须显式地创建一个文件句柄来打开文件。文件不会像 Awk 那样自动加载。这需要在应用程序内部进行适当的命令行参数处理和文件句柄创建。\n\n```\n\
  open $fileHandle, '<', $fileName;\n```\n\n`<` 表示 `open` 用于输入（读取）。然后使用该文件句柄在物理上访问文件。\n\
  \n### Perl（构建）\n处理文件：对 `$FileHandle` 使用 `foreach` 和 `while`。\n\n循环遍历文件 - 由于 Perl\
  \ 将文件视为一个数组，一旦打开，就可以通过 `foreach` 循环逐行读取其内容，并像在 Awk 中那样对其进行操作。\n\n```perl\nforeach\
  \ $line ( <$fileHandle> ) { ... } # 一一行地循环文件。\n```\n\n处理文件也可以通过 `while` 循环以两种方式完成。第一种方法依赖于直接使用隐式文件句柄到数组的转换运算符\
  \ `<...>`，在这种情况下 `while` 的作用就像 `foreach` 一样；\n\n```perl\nwhile ($line = <$fileHandle>\
  \ ) { ... }\n```\n\n当文件打开时，内部游标置于文件头部，并在每次 `while` 迭代后逐行增加。\n\n循环遍历文件的第二种方法依赖于通过数组转换运算符\
  \ `<...>` 使用文件句柄创建一个数组，从而能够通过 `:` 获取/移除数组的第一个项。\n\n```perl\n@tempArray = <$fileHandle>;\n\
  \nwhile ( $line = shift(@tempArray) ) { ... }\n```\n\n`while` 动作块可以作用于变量 `$line`，该变量将包含当前行的文本。每当调用\
  \ `shift` 时，变量 `$line` 就会获取数组中的第一行文本。然后它会被从数组中移除，从而为下一次 `shift` 做好准备。当临时数组为空时循环停止。这种“获取堆顶部的元素并移除”的机制是\
  \ Perl 特有的；C++ 不支持这种机制。\n\n### 实现类似 Awk 的规则（条件/动作块）\n意味着遍历文件中的每一行，以便逐个处理它们，并在每行上应用条件/动作块，带有正则模式匹配和基于正则括号的捕获。Awk\
  \ 规则可以通过对正则模式匹配尝试使用 `if` 语句来模拟。在 Awk 中，你可以用两种方式编写规则。例如：\n\n```awk\n/\\sasha/ { ...\
  \ } # 正则\n```\n```awk\n$5 == \"Sasha\" { ... } # 逻辑语句\n```\n\n在 Perl 中，你将使用 `=~`\
  \ 查找正则匹配或逻辑语句：\n\n```perl\nif ($line =~ /\\sasha /) { ... }\n```\n\n`=~` 是 Perl\
  \ 的模式匹配运算符。简单来说，如果 `$line` 中的文本匹配正则（`=~` 表示匹配），则执行操作。如果正则包含括号，匹配将从左到右逐个将括号内的内容捕获到\
  \ `$1`、`$2` 等变量中。注意包围 Sasha 的两个斜杠并不是正则的一部分——它们标志着正则的开始和结束。\n\n#### 1. 使用 Perl 模拟\
  \ Awk\n很多人选择 Awk 是因为它是一种高度专门的文本处理工具，包含了正则表达式（regex）模式匹配引擎，该引擎为了其工作进行了独特适配；即通过在每行上应用一组规则来处理文件中包含的文本行。尽管如此，既然\
  \ Perl 可以做相同甚至更多的事情，为什么不使用 Perl 呢？当然，学习曲线更陡峭，但你可以做更多，例如多次处理一组文件，而不像像 Awk 那样限于单次通过。\n\
  \n要模拟 Awk 程序，必须先查看 Awk 程序是如何工作的。以下是 Awk 程序执行的概述示意图：\n\n```awk\n执行 BEGIN 块\n\n# 获取命令行参数中的文件列表\n\
  \nwhile ( get file from file list ) { # 这在 Awk 中是自动的\n\n    while ( get line from\
  \ current file ) { # 这在 Awk 中是自动的\n\n        # 对当前行逐一应用规则\n\n        if ( match1\
  \ on line is successful ) { 动作块 1 }\n\n        if ( match2 on line is successful\
  \ ) { 动作块 2 }\n\n        if ( match3 on line is successful ) { 动作块 3 }\n\n     \
  \   ...\n\n    } # 处理行\n\n} # 处理文件\n```\n\n\n\n\n\n# 执行 END 块\n\n上面的代码原理图演示了 Awk\
  \ 对一组文件的处理。你可以在 Perl 模拟 Awk（第 320 页） 章节中找到使用 Perl 模拟 Awk 的完整细节。\n\n## Perl (Awk\
  \ 与 Perl)\n\n### 多次处理同一组文件 - Awk 仅限于处理一次集合\n\n使用 Perl 而不是 Awk 来处理文件文本行的规则，可以通过对文件集进行多次\
  \ `foreach` 循环来提供多路文件处理能力。第一个 `foreach` 循环可以将数据填充数组。第二个循环可以根据第一轮扫描获取的数组内容对文本行进行操作。例如：运行第一次以获取枚举名称，然后进行第二次运行以识别已声明但未使用的枚举，以及已使用的枚举及其出现的位置。对\
  \ `#defines` 也可以进行同样的操作。\n\n## 1. Perl 对比 C\n\nPerl 代码类似于 C，但存在显著差异。你对 C 的认知在学习\
  \ Perl 时可能是一个“虚假朋友”。对 C/C++ 的先有知识可能会适得其反，因此在接触 Perl 时要谨慎。注意以下几点：\n\n*   **Perl 是命令行工具/解释器**：Perl\
  \ 是一个命令行工具/解释器，而 C/C++ 依赖三个工具：预处理器、编译器和链接器（如 GNU C++, Microsoft Visual Studio...）来创建独立的执行文件。C/C++\
  \ 是多文件程序。而 Awk 和 Perl 都基于一个包含程序的单文件。\n\n*   **# 符号与 C++ 注释相同 - 忽略直到行尾**：`#` 符号表示剩余行为注释。不支持\
  \ C++ 的 `//` 注释，也不支持 C 风格的 `/*...*/` 注释。\n\n*   **特殊字符识别类型：$ 标量，@ 数组，% 哈希 / 不支持指针**：Perl\
  \ 有三种变量类型：标量、数组和哈希——没有整数、没有符号/无符号，也没有指针。所有变量都使用特殊字符来标识其类型：`$` 用于标量，`@` 用于数组，`%`\
  \ 用于哈希。\n\n*   **数组是关联的；索引基于整数**：Perl 数组是关联的，基于整数索引。它没有数组声明，它们在第一次使用时被定义。数组索引范围内的所有数据项并不都占用内存位置。这意味着数组可能包含未定义的项。\n\
  \n*   **print 语句项不一定在括号内**：`print` 语句并不要求打印列表封装在括号内。\n\n*   **Perl（字符串）支持字面量（单引号）和插值字符串（双引号）**：Perl\
  \ 引入了两种字符串：字面量（单引号）和插值字符串（双引号）。后者允许变量位于引号内部并打印其值：`print \"$myVar = $myVar\"` 将打印\
  \ `$myVar = 5`。第一个 `$myVar` 被转义了，因此原样打印；第二个 `$myVar` 尽管在引号内也被视为变量，其内容会被打印。这被称为字符串插值。\n\
  \n*   **支持正则表达式**：从开始，Awk 和 Perl 都整合成了正则表达式（regex）引擎。这是使它们相似的特征之一，也是它们区别于 C/C++\
  \ 的地方（至少在支持正则表达式的 C++11 之前）。\n\n*   **Perl（变量和函数）函数有名称和体，但没有参数列表 / 函数可以带参数调用 - 独特的处理方式（通过数组\
  \ @_）**：函数的参数传递非常特殊——它需要学习曲线：参见 Perl 子程序（函数） (第 322 页）。\n\n语句结束不需要分号；我强烈建议系统地使用它们。上述内容并非详尽。Perl\
  \ 非常丰富，使其成为一种可行的编程语言。\n\n## 2. Perl 的注意事项\n\n我在使用 Perl 使用正则表达式时发现了一个小问题。如果你尝试捕获但没有捕获到任何内容，可能会得到一个晦涩的未初始化变量错误信息。这可以很容易解决；参见\
  \ 正则表达式分组（第 198 页），章节末尾。\n\n## 3. 从草图到最终产品\n\n从草图到最终产品\n\n你之所以读这本书是因为你正在制作某种小装置，它需要将一个\
  \ C++ 程序放入微控制器，以便完成某些有用工作。微控制器连接到安装在板子上的电子设备（无论是面包板、焊接原型板还是 PCB）。PCB 放置在某个外壳中，那里很可能有需要支持的设备（舵器、电机、LED、开关...）。这意味着你需要工具来创建原理图和创建\
  \ PCB。\n\n\n\n\n\n# Tinkercad\n\nFusion 360 可以导入 Tinkercad 原图\nTinkercad：创建视觉化面包板接线/原理图\n\
  Tinkercad：原理图导出 Eagle (Fusion 360)\n\n与大多数 IDE 不同，Tinkercad 是一个 Web 应用程序（`https://tinkercad.com`）。你不需要下载它，而是创建一个链接并注册账户登录。你的设计存储在\
  \ Autodesk 的某处。这意味着你需要快速的连接。ADSL 可能无法胜任；因此，如果你在远离高速互联网的偏远地区进行远程工作，使用它可能会遇到一些困难。\n\
  \n开始使用 Tinkercad 就像开始一个新的 Arduino 项目。准备一块面包板、一个 `Arduino Uno`，并开始在面包板上放置组件。使用彩色导线将这些组件相互连接，并连接到你的\
  \ `Uno` 上。一旦你的设计达到足够程度，你就可以添加 `C++` 代码来模拟其运行（例如控制 LED 闪烁、通过按钮重置开发板等）。你还可以生成原理图（`PDF`）和零件清单。非常方便。界面非常友好，在让面包板原型运行方面可以节省大量时间。\n\
  \n锦上添花的是，Tinkercad 允许将原理图导出到 `Eagle`，现在它是 `Fusion 360` 的一部分。完成设计中的面包板部分后，你可以使用 `Eagle`\
  \ 转向焊接原型和 PCB。\n\n这并不是 Tinkercad 所能做的全部功能。它还是一个 CAD 设计工具，供你创建 3D 对象。它没有 `Fusion\
  \ 360` 那么强大，但你仍然可以用它完成相当复杂的工作。\n\nTinkercad 还提出了 `Codeblocks`（不要将其与书中前面介绍的 `C++`\
  \ IDE `Code::Blocks (第 111 页)` 混淆）。在用 Tinkercad 创建 3D 对象时，代码是用户界面背后的支撑；用户每进行一次操作，就会生成代码。这是大多数应用程序的做法。它们由专门为自己设计的专有语言驱动。例如，`Word`\
  \ 和 `Excel` 可以通过 `VBA` 程序实现功能。你可以使用 `JavaScript` 来自动化原本需要手动完成的 `InDesign` 工作。当你在\
  \ Tinkercad 内部进行操作时，会生成代码来执行该工作。这就是为什么你可以撤销操作；代码会回滚。`Codeblocks` 是在后台渲染为可见的代码，以便你可以修改代码，从而对正在处理的\
  \ 3D 对象进行更改。它使得执行更改变得更容易且更不容易出错。例如，如果你想在部件上打一个圆柱形孔，你会创建一个圆并在切削模式下将其挤穿整个部件。如果你想让孔变小，通常必须填补该孔并用新的圆柱重新切削。使用\
  \ `codeblocks`，你只需要更改圆柱代码块中的直径，孔就会自动调整大小。\n\n底线是，Tinkercad 让你能够设计电子设备，插入基于 `Arduino`\
  \ 装置的 `C++` 代码，并在进行任何物理工作之前对其测试。它还能让你创建项目的物理部分。我将在此此结束，由你们自己查看 Tinkercad（`https://tinkercad.com`）。\n\
  \n## 1. Eagle\n\nFusion 360 包含了 `Eagle` 软件（电子原理图和 Gerber 文件）\nEagle 软件：电子原理图和 Gerber\
  \ 文件；现在位于 `Fusion 360` 中\n\n`Eagle` 是主要的专业级电子原理图和 PCB 设计工具之一。我曾多次使用它为我基于 `Arduino`\
  \ 的蜂巢称重系统设计插件式 PCB。由于 `Eagle` 现在已集成在 `Fusion 360` 中，你可以将 PCB 及其周围硬件作为一个整体整体进行设计。PCB\
  \ 变成了你装置的一个组件，而不是一个独立的硬件。\n\n在 `Eagle` 内部开发电子电路时，你首先从设计原理图开始。一个丰富的电子元件库允许你选择想要集成到电路中的组件。如果某个特定组件不存在，你可以创建自己的；你创建它的原理图表示和它的物理\
  \ 3D 布局。\n\n当你的原理图足够先进后，你就可以进入物理布局。你将看到一个电路板（单层、双层或多层 - 由你选择）以及位于电路板外的所有组件，这些组件根据你的原理图相互连接。然后，你开始在电路板内部移动和放置组件，并在顶层、底层或中间层上布置布线，并通过通孔孔建立层与层之间的电气传导性；这样做在某种程度上是一门艺术。布线是将电流从一处传导到另一处的微小打印电路线条——在面包板或原型板上，这些就是导线。\n\
  \n将这些零件和部分组合在一起以确保没有短路需要时间。你显然不能让地线布线跨越 `5V` 布线。一种方法是将所有 `5V` 布线放置在顶层，将所有地线放置在底层。完成后，你还需要放置其他布线。此时，你可能需要重新排列你的原理图，使布线并行运行。例如，在将\
  \ `LCD` 显示器连接到 `Arduino` 时，你需要将 4 或 8 个 `LCD` 数据终端连接到 4 或 8 个 `Arduino` 数字端口。你应该这样选择\
  \ `Arduino` 端口，使数据布线从 `LCD` 并行到 `Arduino`。\n\n一旦原理图完成，并且在面包板和原型板上检查确认电路正确后，是时候创建\
  \ PCB 了（可能先做插件式的，如果你非常有心的话，再做 SMT）。\n\n`Eagle` 的学习曲线很短。花时间学习如何创建 PCB 是非常值得的。当快递员敲门投递一个包含由你的\
  \ `Gerber` 文件创建的专业 PCB 的包裹时，你会感到非常有成就。\n\n## 2. Fusion 360\n\nFusion 360 高端 CAD\
  \ 设计工具\nFusion 360 包含了 `Eagle` 软件（电子原理图和 Gerber 文件）\n\nTinkercad 对于某些 3D 设计工作可能确实足够了。这取决于你想要实现什么。它是一个初级\
  \ CAD 工具，可能满足你们许多人的需求。但如果你想要更强大的工具，`Fusion 360` 提供了让你能够创建最复杂的组件和装体的功能。它可以为 3D 打印、激光切割、CNC\
  \ 加工等生成文件。它具有渲染功能，可以显示装体的外观；它具有动画功能，可以显示部件如何相互作用（例如差速器）；它还具有规划制造部件工具路径的功能。它还可以检测组件之间的干扰。\n\
  \n`Fusion 360` 可能没有 `Autocad`、`Solidworks` 或 `Catia` 那么强大，但它提供的可能性远远超几乎所有 `Arduino`\
  \ 装置开发者的需求。此外，对于爱好者、学生和教育工作者它是免费的，限制是同时处理活动组件的数量，但它保留了完整的功能。\n\n\n\n\nFusion 360\
  \ 的底层用户界面概念依赖于 2D 图形并将其扩展为 3D 组件。例如，画一个 `circle`（圆）；它可以扩展为 `sphere`（球体）、`cylinder`（圆柱，挤伸）、`doughnut`（绕圆心位置偏移的轴旋转）、`pipe`（沿路径扫描）等。这种初始绘制被称为\
  \ `sketch`（草图，不要将 Fusion 360 的 `sketches` 与 Arduino 的 `sketches` 混淆）。当你创建一个与第一个实体相交的第二个实体时，第二个实体可以与第一个融合或将其切割。例如，穿过\
  \ `cube` 的 `cylinder` 可以创建一个 `hole`（孔洞）。当你为你的小设备创建 3D 时，你可以对边缘进行操作（如倒角），或者对表面进行操作（如向内或向外调整）。这些被称为\
  \ `features`（特征）。\n\n如果你在 Fusion 360 中创建了 PCB，就可以创建一个外壳来容纳它，并为开关、LED 等任何组件留出开口。由于通用的坐标系，你可以将它们放置在一起，并让\
  \ Fusion 360 检查是否有干涉。\n\n有很多 CAD 工具，其中一些可能需要付费，另一些则是免费；成本并不是唯一标准。还有可靠性、技术支持、寿命、功能……Autodesk\
  \ 作为 CAD 领域的主要参与者，我觉得我处于很安全的环境中。由于我是从 `123 Design`（Autodesk 之前的入门级免费 3D CAD 工具）偶然开始使用\
  \ Fusion 360，并且它完全符合我的需求，所以我没有再寻找。我现在的工具链是：使用 `AtmelStudio` 进行 C++ 硬件调试、使用 `Visual\
  \ Studio/Visual Micro` 创建 C++ 代码、使用 `Tinkercad` 创建面包板原型、使用 Fusion 360 中的 `Eagle`\
  \ 增强从 `Tinkercad` 导出的原理图并创建 PCB，最后使用 Fusion 360 创建 3D 组件。至于 3D 打印，我使用 `Zortrax M200`（[`Zortrax.com`](https://Zortrax.com)）。所有这些软件都是免费且功能全备的（`Visual\
  \ Micro` 除外——每年 25 美，以及 Fusion 360 限制正在处理的活动组件数量）。如果我的工作变得更加实质化和或成为一项商业活动，我将根据需要支付订阅。\n\
  \n## 1. 3D 打印\n\n小设备制造工具链的最后组件是 3D 打印。在制作了 PCB 并定义了与外部的连接后，你可能需要物理外壳、适配器、支撑物、齿轮、轴等。其中一些你可以购买；另一些你必须自己制造。我的解决方案是使用\
  \ Fusion 360 创建一个对象然后对其进行 3D 打印。完成 3D 设计后，下一步将其导出为 `.stl` 文件进行 3D 打印；它也可以导出为 `.svg`\
  \ 文件进行 3D 打印。\n\n### 3D 打印技术\n\n- 有若干种 3D 打印技术可用\n- 3D 打印从 CAD 工具开始\n- 使用 Fusion\
  \ 360 设计零件\n- 用于 3D 打印的标准化文件格式 `.stl`\n- 我选择了 `Zortrax 200M` 3D 打印机\n\n小设备制造工具链的最后组件是\
  \ 3D 打印。在制作了 PCB 并定义了与外部的连接后，你可能需要物理外壳、适配器、支撑物、齿轮、轴等。其中一些你可以购买；另一些你必须自己制造。我的解决方案是使用\
  \ Fusion 360 创建一个对象然后对其进行 3D 打印。完成 3D 设计后，下一步将其导出为 `.stl` 文件进行 3D 打印；它也可以导出为 `.svg`\
  \ 文件进行 3D 打印。\n\n### 3D 打印的注意事项\n\n- **尺寸**：物体可能很大。\n- **材料**：用于制造的材料。\n- **复杂性**：设计的复杂程度。\n\
  - **精度**：零件需要多精确？\n- **物理特性**：它将承受什么样的应力？\n- **环境因素**：零件所处的环境。\n- **成本**：工艺的成本。\n\
  \n### 技术比较\n\n**熔融沉积建模 (FDM)**：这种技术基于逐层沉积熔融塑料。\n**光固固化 (SLA)**：液体通过激光硬化。\n- **选择性激光层烧结\
  \ (SLS)**：该过程与 SLA 类似，不同之处介质是粉末。\n\n## 2. 熔融沉积建模 FDM\n\n正如熔融沉积建模 FDM 的名称所示，这种 3D\
  \ 打印技术基于逐层将某种熔融物沉积在基底上。这个想法非常简单。取一个零件，任何零件，将其切成薄片。每片切片都有独特的形状；将它们堆叠在一起，正确放置并重新组合，它们就构成了零件。这基本上就是\
  \ 3D 打印的本质。该过程可以总结如下：\n\n- 使用合适的工具创建对象（我选择了 Fusion 360）。\n- 让 CAD 工具按照标准化文件格式 (`.stl`)\
  \ 导出对象。\n- 定义如何打印零件：在决定如何打印零件时，必须考虑两个重要因素：1 - 零件沿打印平面方向要实实得多，例如，纵向还是垂直打印管子？以及 2\
  \ - 悬空部分需要支撑。\n- 定义支撑以处理悬空部分：如果你纵向打印管子，它沿轴方向的抗弯曲性更强，但必须打印支撑，以防止灯丝在打印管子顶部时塌陷。超过某个角度（例如\
  \ 30 度），灯丝会倾向于塌陷。如果你横向打印管子，你必须从管子内部物理移除支撑。如果管子是 S 型的，你可能会发现很难或无法移除管子内部的一些支撑材料。\n\
  - 切片工具根据上所述为悬空部分生成支撑，并将对象切成薄片；结果被转换为机床指令。\n\n\n\n我个人对 3D 打印的选择是 `Fusion 360` 配合\
  \ `Zortrax M200` 打印机。选择 `Fusion 360` 的原因是我找到的唯一可供爱好者免费使用的高端专业级工具。至于 `Zortrax M200`，在参加了\
  \ 3D 打印展、与各种人交流并观看 YouTube 视频后，它似乎是最好的折中方案。它既不便宜也不昂贵，而且证明是可靠的；尺寸可以接受（`20x20x20`\
  \ 厘米）；悬垂处理得当；其切片软件看起来高效；材料范围相当广泛；打印区域是封闭的，从而使表面能够保持高温；简而言之，体验良好。此外，售后支持和保修也非常出色。我是六年前购买的这台机器。我的下一台机器可能是\
  \ `Zortrax M300`，原因之一是它可以自动检测缺料（而 `M200` 只会空喷嘴继续打印），另一个原因是支持类橡胶的材料。\n\n# 1. 附录\n\
  \n## 附录\n\n本附录包含了对本书正文内容的补充。它涵盖了以下内容：\n\n*   `Code size` [AUX]这些 IDE 在代码大小方面是否同样高效：`RAM`\
