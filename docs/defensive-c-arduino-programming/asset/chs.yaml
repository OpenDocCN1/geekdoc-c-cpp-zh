  \ `Perl`、文件处理、子程序、字符串、列表以及许多其他结构的详细说明。\n\n# 1. RAM 要求\n\n## RAM 要求\n\n编译器并非完全相同；某些编译器在紧凑性上可能更好，另一些则在速度上更优。此外，编译/链接选项对应用程序的代码大小有巨大影响。由于所比较的\
  \ IDE 使用相同的 `GNU` 编译器，因此使用哪个编译器并不是判断代码大小的标准，编译器选项定义了代码大小。\n\n你将在下方看到两个部分，一个比较编译代码大小，另一个检查编译/链接选项。\n\
  \n*   `Code size` [AUX]相同的编译/链接选项会产生不同的 RAM/闪存需求：`代码大小（IDE 比较 - 下一节)` —— 在看似相同的构建选项下测试代码大小会导致不同的\
  \ RAM 和闪存需求。\n\n*   `Code size` [AUX]代码大小取决于编译器选项和 `-flto` 标志；可减少 ٤٠٪ 的体积：代码大小（构建选项）（第\
  \ ٢٣ 页） —— 鉴于 IDE 使用相同的 `GNU` 编译器，代码大小取决于编译器和链接器选项。默认情况下，`AtmelStudio` 生成的代码比 `Arduino\
  \ IDE` 或 `PlatformIO` 生成的代码多得多。事实证明缺少链接器优化选项（`-flto`）是原因。修复此后，`AtmelStudio` 的 RAM\
  \ 要求证明与使用 `Arduino IDE` 或 `PlatformIO` 编译相当。\n\n\n\n\n我的最终分析是，AtmelStudio 是开发代码和构建最终发布版本的极佳工具。它提高了程序员的效率，并有助于编写更健壮的代码。然而，使用\
  \ Arduino IDE 构建最终发布版本可能具有优势，因为它对 RAM 的要求略低，对闪存的要求更少。\n\n请注意，这些测试是在我探索 Visual Studio/Visual\
  \ Micro 组合以及 Arduino V2 之前进行的。我敢说，这些测试会产生类似的结果。\n\n## 1. 代码大小（构建选项）\n\n代码大小取决于编译器选项以及\
  \ `-flto` 标志；后者可减少 40% 的体积。在比较两个开发工具的输出时，应当确保构建选项相似。使用了哪些编译器选项？是 Debug（调试）还是 Release（发布）？输出是否经过了优化？可能还有其他相关的代码大小或执行速度选项。\n\
  \nAtmelStudio 的代码大小默认大出 40%，需要 `-flto` 标志。我首先验证了 AtmelStudio 的构建选项对代码大小的影响。由于 AtmelStudio\
  \ 的可执行 RAM 要求最初明显大于 Arduino IDE 和 PlatformIO，我调整了 AtmelStudio 中所有的编译器和链接器选项，以确定是否可以通过选项来解释如此巨大的差异。遗憾的是，Project\
  \ Properties 窗口中提出的任何编译器选项似乎都没有对代码大小产生显著影响。\n\n代码大小取决于 `-flto` 标志；可减少 40%。从这些结果中，我得出结论：AtmelStudio\
  \ 缺少一个减少 RAM 要求的选项。事实证明是了 `-flto` 链接器优化选项。我通过比较三个 IDE 的构建选项发现了这一差异。我将它们列在这里处，是因为它们可以帮助人们理解在按下编译/构建按钮或菜单项时到底发生了什么。\n\
