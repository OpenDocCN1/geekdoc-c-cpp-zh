  \ `AtmelStudio` 两年，它确实偶尔失败，但一次或多次重新构建就能解决问题。`AtmelStudio` 的段错误是非阻塞的，就像 Arduino IDE（版本\
  \ `1.8.9`，我没有检查过 `2.1.1` 版本）。\n\n## 1. 错误列表中未出的错误\n\n### `AtmelStudio (caveats)[AUX]\
