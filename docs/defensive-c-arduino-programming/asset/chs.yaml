  `DataGroup 框架（第 164 页）part0022.xhtml_a8H9)` 是一个微数据库管理系统。由于支持独立存储，它可以管理微控制器或外部 EEPROM、SD\
  \ 卡、互联网上的某处、云端、RAM 或其他的数据。需要对底层的 `Read/Write` 函数进行微调，以根据所用内存系统（RAM、EEPROM、云等）的特定属性调整记录的访问。使用何种内存支持取决于管理的数据量。它唯一的要求是能够从基偏移开始通过直接字节级访问来预留连续的数据空间。\n\
  \n## DataGroup 类\n\n该框架的机制封装在 `DataGroup` 类和辅助函数内部。从内存读取或写入内存的操作每次处理 N 个字节。用 `uint8_t`\
  \ 数组填充数据，然后写入内存。从内存获取数据时则反之。由于存储和检索数据是基于连续内存区域的，因此数据需要存储在一个结构中，将字节映射为各个组件。例如，`DataGroupHeader`\
  \ 包含 8 个不同的项，详见结构体 `DataGroupHeader`：\n\n```cpp\nstruct DataGroupHeader {\n    char\
  \ name[DATA_GROUP_NAME_LENGTH]; // 默认 10 字节\n    char desc[DATA_GROUP_DESCRIPTION_LENGTH];\
  \ // 默认 50 字节\n    uint16_t offset{0}; // DataGroup 在内存中的偏移量\n    uint16_t datagroupSize{0};\n\
  \    uint16_t recordLength{0};\n    bool fixedType{true}: 1; // 固定（默认）或可\n    bool\
  \ hasKeys{false}: 1; // 如果为 true，则记录有键，默认为 false\n    uint8_t keyLength{0}: 3; //\
  \ 键限制为最大 7 字节\n    : 3; // 位域缓冲区，使总位域大小对齐为 8 位\n} storageGroupHeader; // DataGroupHeader\n\
  ```\n\n出于可维护性考虑，请使用 `sizeof(DataGroupHeader)` 获取结构体的大小。然后使用上述定义的结构体 `storageGroupHeader`\
  \ 的地址，在 EEPROM 或其他地方写入或读取相应的字节。\n\n`DataGroup` 类包含了应用程序可以使用的函数用于管理数据并在需要时进行数据碎片整理。\n\
  \n```cpp\nclass DataGroup {\npublic:\n    // 此构造函数创建一个新的 DataGroup\n    DataGroup(char*\
  \ _name, char* _desc, uint16_t _packageSize, ERecordType _type, uint8_t _keyLength\
  \ = 0, uint16_t recordLength = 0);\n\n    // 在第一个可用的固定大小槽写入，在可变长度记录末尾写入\n    //\
  \ 如果是基于键的固定长度记录，如果存在则覆盖\n    void WriteRecord(uint8_t* _data); // 用于固定大小记录写入\n \
  \   void WriteRecord(uint16_t _recordLength, uint8_t * _data); // 可变大小写入\n\n   \
  \ // 基于键获取，返回偏移量\n    bool GetRecordKey(uint8_t keySize, uint8_t& _key, uint16_t*\
  \ _data);\n    bool GetRecordOffset(uint16_t& _offset, uint16_t* _data); // 基于偏移获取\n\
  \    bool GetRecordIndex(uint16_t& _index, uint16_t* _data); // 基于索引获取\n    bool\
  \ RemoveRecord(uint16_t _offset);\n    uint16_t GetRecordCount(); // 返回 DataGroup\
  \ 中的记录数\n    uint16_t GetLastRecord(); // 返回最后一条记录的偏移量\n\nprivate:\n    void Defragment();\
  \ // 移除可变长度记录中的空隙\n    DataGroupHeader storageGroupHeader;\n}; // class DataGroup\n\
  ```\n\n## 数据管理\n\n`DataGroup` 构造函数创建一个新的 `DataGroup`。函数负责操作数据。这些操作针对两种记录类型：固定长度记录或可变长度记录。两种类型都可能包含一个唯一键，以便在搜索数据时标识记录。固定长度记录被插入到第一个可用槽位，或最后一条现有记录之后。可变长度记录被插入到足够大的空隙中，或在最后一条记录之后。在多次写入和删除后，内存可能会充满空空间。当这些空空间达到临界大小时，就是对\
  \ `DataGroup` 进行碎片整理了：遍历整个记录列表并合并它以消除空隙。当空空间小于组分配空间的 10% 时，将执行碎片整理。无论使用何种存储方法，最后一条记录的内容将为\
  \ `#END#`，用以标记存储数据的结束。\n\n`DataGroup` 类提供了 8 个公共函数来管理数据。\n\n### WriteRecord\n有两个\
  \ `WriteRecord` 函数。一个用于固定大小记录，它在第一个可用槽位或最后一条现有记录之后写入记录；另一个用于可变长度记录，它在最后一条记录之后写入记录。如果是基于键的固定长度记录，如果存在则覆盖它；如果是基于键的可变长度记录，如果空隙足够大则插入空隙中，否则追加在最后一条记录之后。如果记录已存在，则修改而不是插入新记录。如果遇到问题，函数返回\
  \ `false`。\n\n```cpp\nvoid WriteRecord(uint8_t* _data); // 固定大小记录\nvoid WriteRecord(uint16_t\
  \ _recordLength, uint8_t * _data); // 可变大小\n```\n\n### GetRecord\n有三个 `GetRecord`\
  \ 函数。它们根据访问方法有所不同：基于键、基于偏移和基于索引。每个函数都返回一个 `bool` 值，以便应用程序判断是否找到记录。基于键的 `GetRecordKey`\
  \ 遍历记录直到找到基于键记录。基于偏移的 `GetRecordOffset` 因为已知偏移量而直接访问。基于索引的 `GetRecordIndex` 获取第\
  \ N 条记录，无论是固定还是可变。对于固定长度记录，它通过 $N-1$ 乘以记录大小计算偏移量。对于可变长度记录，它通过遍历 $N-1$ 次记录并使用记录的大小向前移动来计算偏移量。如果发生错误，上述函数返回\
  \ `false`。如果未找到记录，`_data` 将设置为 0。\n\n```cpp\n// 基于键获取，返回偏移量\nbool GetRecordKey(uint8_t\
  \ keySize, uint8_t& _key, uint16_t* _data);\nbool GetRecordOffset(uint16_t& _offset,\
  \ uint16_t* _data); // 基于偏移获取\nbool GetRecordIndex(uint16_t& _index, uint16_t* _data);\
  \ // 基于索引获取\n```\n\n### RemoveRecord\n有一个删除记录函数 `RemoveRecord`。它有一个参数用于返回该记录确实存在且已被移除。相应的槽位被标记为\
  \ `#EMPTY#`。\n\n```cpp\nbool RemoveRecord(uint16_t _offset);\n```\n如果发生问题（例如尝试删除不存在的记录），该函数返回\
  \ `false`。\n\n### GetRecordCount\n`GetRecordCount` 函数遍历记录并返回记录总数，排除标记为 `#EMPTY#`\
  \ 的记录。\n\n```cpp\nuint16_t GetRecordCount();\n```\n\n\n\n\n* `GetLastRecord` 函数获取最后一条记录的偏移。这定义了数据占用的总空间。根据应用程序的需求，如果分配给\
  \ `DataGroup` 的空间不足，可能信号着存在资源问题。\n\n```cpp\nuint16_t GetLastRecord(); // 返回最后一条记录的偏移\n\
  ```\n\n* 有一个 `Defragment` 函数；如果最后一条记录后的空空间小于分配空间的 10%，它将清理内存空间。\n\n```cpp\nuint16_t\
  \ Defragment(); // 如果空空间 < 分配空间的 10% 则进行碎片整理\n```\n\n此函数返回包括空洞在内的空空间大小。目前尚未完成碎片整理。这是需要完成的工作部分。\n\
  \n以上内容总结了 `DataGroup` 类的内容。\n\n<x>蜂巢重量系统[AUX]DataGroup 框架使用示例</x><x>DataGroup 框架[AUX]蜂巢重量系统良好示例</x>下文说明了该框架在我基于\
  \ Arduino 的蜂巢重量系统背景下的应用。这是一个星形的协调器-蜂巢无线网络。协调器和蜂巢之间相互发送和接收数据。协调器存储了一个任务列表 (`Jobs`)\
  \ 和它连接的蜂巢列表 (`Beehives`)。`Jobs` 是一个变长度的 `DataGroup`。`Beehives` 是固定长度的。两个 `DataGroup`\
  \ 都由它们相应的 `DataGroup` 实例管理。\n\n`Jobs` `DataGroup` 顺序存储变长度的任务。由于任务很少（最多 10 个），访问是顺序的，且任务没有键。\n\
  \n```cpp\nstruct StructJobsData {\n  // 仅支持顺序访问，无键，变长\n  uint16_t lengthData{0};\n\
  \  char* data; // 应用程序需要分配空间\n}; // StructJobsData\n```\n\n`Beehives` `DataGroup`\
  \ 列出了连接到协调器的蜂巢（固定长度）。蜂巢的数量目前最多为 16 个。它存储了无线模块的序列号（作为键）以及蜂巢的用户定义名称。\n\n```cpp\nstruct\
  \ StructHivesData {\n  // 基于键的访问\n  uint8_t hiveID[STRUCT_BEEHIVES_DATA_KEY_LENGTH];\n\
  \  char moduleName [STRUCT_BEEHIVES_DATA_MODULE_NAME_LENGTH];\n}; // StructHivesData\n\
  ```\n\n两个 `DataGroup` 构造函数创建并操作 `DataGroup`，每个 `DataGroup` 有一个构造函数。\n\n```cpp\n\
  DataGroup storageJobs(\"Jobs\", \"存储任务数据\", 100, ERecordType::variable);\nDataGroup\
  \ storageHives(\"Beehives\", \"存储蜂巢数据\", 300, ERecordType::fixed, DATA_GROUP_BEEHIVES_RECORD_LENGTH);\n\
  ```\n\n在带有相应参数（结构体）创建了 `DataGroups` 后，通过 `DataGroup` 类函数管理它们变得轻而易举。\n\n### 1. 事件存储框架（附录）\n\
  \n<x>数据处理框架[AUX]事件存储框架在连续的字节数组中存储事件</x><x>事件存储框架[AUX]预定义的真/假条件存储在每个事件字节数组的 1 位中，节省\
  \ RAM</x>事件是预定义的真/假条件，每个事件 1 位（事件存储框架第 171 页）。它们通过枚举列表映射为一系列 7 位或 8 位的字节。与标准的每个事件一个字节存储方案相比，该框架将内存需求减少了\
  \ 7 到 8 倍。\n\n<x>事件存储框架[AUX]256 个事件（8 位），244 个事件（7 位)</x><x>事件存储框架[AUX]枚举驱动的 Get/Set\
  \ 函数获取/设置封装在字节中的事件</x>`EventStorage` 类包含 `Get` 和 `Set` 函数，通过在枚举列表中定义的 ID 访问事件。\n\
  \n```cpp\nenum class EEventID: uint8_t { start = 0, outOfBounds = 0, badAlloc...,\
  \ end };\n\nclass EventStorage {\npublic:\n  EventStorage (uint8_t* _eventsArray,\
  \ uint8_t _registerSize, uint8_t _varsCount, char** eventLabels);\n  bool Set(uint8_t\
  \ _eventID, uint8_t _eventToSet);\n  bool Get(uint8_t _eventID, uint8_t& _eventToGet);\n\
  \  void PrintVariables();\n  void PrintRawData();\n  void PrintMasks();\n  bool\
  \ VerifyMasks();\n\nprivate: // 私有函数\n  uint8_t GetOffsetInMap(uint8_t _eventID);\n\
  \  uint8_t GetSequenceIndex(uint8_t _eventID);\n  uint8_t GetOffsetInSequence(uint8_t\
  \ _eventID);\n  uint8_t CreateMask( uint8_t _eventID, uint8_t& _mask);\n\nprivate:\
  \ // 私有数据\n  const uint8_t registerSize{8};\n  const uint8_t* eventsArray{(uint8_t*)\
  \ 0 }; // 映射位域的值\n  const uint8_t eventCount{0}; // 包含数量\n  const char** eventLabels;\n\
  }; // EventStorage\n```\n\n该类需要以下内容：\n\n* `uint8_t RegisterSize` 指定使用 7 位还是 8 位块。8\
  \ 位是默认值，如果事件数据需要无线传输，则使用 7 位。\n* `int8_t* EventsArray` 是一个字节序列，其中每个事件映射为 1 位，分为\
  \ 7 位或 8 位块。这些初始化为 0。存储事件的字节数组实例化如下：\n\n```cpp\neventsArray = new uint8_t ( eventSize\
  \ );\n```\n\n```cpp\neventsArray = new uint8_t ( eventCount );\n```\n\n* `uint8_t\
  \ eventCount` 包含数量。\n* `char** eventLabels` 是字符串数组。\n\n\n\n\n\n# LinkedList\n\n\
  *   `LinkedList` - 它通过 `Append`、`GetFirst` 和 `GetLast` 函数管理列表。它包含一个私有变量 `LinkedItem*\
  \ first`。它还有打印函数，用于可视化列表的内容。\n\n## 链表框架\n\n这两个链表类的底层机制依赖于 `LinkedItem` 类，该类允许派生类调用\
  \ `next`。`LinkedList` 类管理列表的正向遍历，并允许将项附加到列表末尾。它不移除项、重新排序项，也不执行 `InsertAfter`。这些或其他功能可以很容易地添加到基础实现中。\n\
  \n```cpp\nclass LinkedItem {\npublic:\n    LinkedItem (LinkedItem* _next);\n   \
  \ LinkedItem* GetNext();\n    virtual void PrintItem(bool _insertNewline) = 0;\n\
  \nprivate:\n    LinkedItem* next{0};\n}; // class LinkedItem\n```\n\n### 单个项或整个列表\n\
  \n如上所示，`LinkedItem` 类非常简单。它有一个私有变量 `next` 和一个获取下一个项的函数 `GetNext`。它有一个纯虚函数 `PrintItem`，定义在派生类中，供下面的\
  \ `LinkedList` 类用于打印整个列表。\n\n```cpp\nclass LinkedList {\npublic:\n    LinkedList();\n\
  \    void AppendItem (LinkedItem* _next);\n    LinkedItem* GetFirst();\n    LinkedItem*\
  \ GetLast();\n    void SetFirst (LinkedItem* _first);\n    virtual void PrintList()\
  \ = 0; // 自定义列表包含头部和尾\n    void PrintItems(); // 使用 LinkedItem::PrintItem\n\nprivate:\n\
  \    LinkedItem* first{0};\n}; // class LinkedList\n```\n\n`LinkedList` 类管理链表。它有一个私有变量\
  \ `first`、设置和获取它的函数、获取最后一个项的函数以及一个附加项的函数。注意 `LinkedItem` 类有一个纯虚函数 `PrintItem`，其代码在派生类中实现。`LinkedList`\
  \ 类有两个打印函数。`PrintItems` 顺序打印项，另一个是纯虚函数 `PrintList`，它允许派生类自定义打印任务，例如：\n\n```cpp\n\
  MyPersonalLinkedList::PrintList() {\n    ... 在打印项之前执行头部的工作\n    PrintItems();\n\
  \    .. 执行收尾工作\n} // PrintList\n```\n\n上述是一个极简的链表类，因为它仅局限于附加项和正向遍历列表。它可以被增强为反向遍历列表、在列表内部某插入项、移除项、排序项、在插入项时进行有效性检查等。它还可以包含派生类常用的其他数据。在我的案例中，我在\
  \ `LinkedItem` 基类中添加了行号、类和函数索引，因为两个派生类——错误处理和内存管理使用了这些内容。派生类中通用的项都可以合并到基类中。特定于派生类的项则由各自的派生类单独处理。\n\
  \n这其实并不复杂，但事实证明它是实用的、易于实现的且节省时间的。\n\n# 1. 特殊化框架（附录）\n\n六个框架不属于组织框架（第 151 页) 或数据处理框架（第\
