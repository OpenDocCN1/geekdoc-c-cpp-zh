  \ 中输入代码时，语法错误（如忘记分号、未完成的 for 语句或未声明的变量）将用红色下划线标出，颜色将变为黑色。这允许立即纠正。你不需要等待编译器来发现错误。就像有一个编译器坐在你的肩上，随时指出你刚刚犯了错误。\n\
  *   **正则表达式 (通用)[AUX]许多工具都包含正则引擎 - AtmelStudio 和 PlatformIO 查找/替换、Perl、Awk、Word\
  \ (通配符) AtmelStudio (查找/替换)[AUX]支持整词、正则表达式、历史搜索** 查找/替换 (第 55 页) 对话框支持整词概念。它还支持正则表达式，这是一种强大灵活的工具并不难掌握。我强烈建议你熟悉它，它是使用\
  \ `Awk` 和 `Perl` 的关键。参见正则表达式 (regex) (第 191 页)。如果你恰好使用 Adobe InDesign、Photoshop\
  \ 等工具，你可能用过 `Grep` 工具——它是基于正则表达式的。注意，Arduino IDE V2 的查找/替换支持正则表达式；而旧的 1.8.19 版本不支持。\n\
  *   **AtmelStudio (编辑器)[AUX]名称补全弹出窗口打开** 名称补全 (第 56 页) - 在输入宏、全局变量、函数和类时，会打开一个文本框列出已有的项，你可以通过选择所需的项来完成输入。此功能不仅节省了输入时间，还能确保项拼写正确。新的\
  \ Arduino IDE V2 支持名称补全。\n*   **AtmelStudio (编辑器)[AUX]折叠类、函数、枚举、ifs、whiles 等以及 #ifdef...#endif\
  \ 对 AtmelStudio (注意事项)[AUX]不支持大括号折叠** 代码折叠与缩进 (第 57 页) - `#ifdef...#endif` 折叠（Arduino\
  \ IDE 不支持）在跟丢了 `#endifs` 时可能特别有用。然而，公平地说，Arduino IDE 在代码折叠方面比 AtmelStudio 更好，因为它可以折叠大括号，而\
  \ AtmelStudio 不可以。两个 IDE 都有其代码折叠的缺点，但是可以规避的。总结来说：两个 IDE 都折叠函数、结构体、枚举等高层级聚合体……AtmelStudio\
  \ 会折叠 `#ifdef...#endif` 对，但不折叠大括号。Arduino IDE 擅长折叠大括号，但不折叠 `#ifdef...#endif`。\n\
  *   **折叠 /* ... */](#part0014.xhtml_a92E)** (第 57 页) - `#ifdef...#endif` 折叠（Arduino\
  \ IDE 不支持）在跟丢了 `#endifs` 时可能特别有用。然而，公平地说，Arduino IDE 在代码折叠方面比 AtmelStudio 更好，因为它可以折叠大括号，而\
  \ AtmelStudio 不可以。两个 IDE 都有其代码折叠的缺点，但是可以规避的。总结来说：两个 IDE 都折叠函数、结构体、枚举等高层级聚合体……AtmelStudio\
  \ 会折叠 `#ifdef...#endif` 对，但不折叠大括号。Arduino IDE 擅长折叠大括号，但不折叠 `#ifdef...#endif`。\n\n\
  ## 工作空间\n\nAtmelStudio 的工作空间确实如其名称所示，是一个开展工作的空间。Arduino IDE 的工作空间可以描述为一个允许通过固定标签一次次访问项目源文件的窗口。AtmelStudio\
  \ 的工作空间要丰富得多。一些更为显著的特征包括：\n\n\n\n\n\n# AtmelStudio (编辑器) 工作区\n\n`Workspace` 包含两个可拆分且固定的工作窗口以及\
  \ `Solution Explorer`（解决方案管理器）。整个工作区可以分为水平或垂直排列的两个独立工作区域，每个区域都可以包含文件，并通过窗口顶部的移动标签页访问。一旦从\
  \ `Solution Explorer` 将文件添加到工作区，`melStudio` 允许对它们进行重新组织。这在编写代码时非常有用，因为程序员可以将 `.h`\
  \ 文件放在一个工作区，将 `.cpp` 文件放在另一个工作区，从而在处理 `.cpp` 文件的同时旁边查看对应的 `.h` 文件。\n\n# AtmelStudio\
  \ (文件管理) 解决方案管理器\n\n`Solution Explorer` 可以作为整个工作区的额外组件添加。它允许通过添加/删除文件来管理项目内容。它还用于将文件加载到两个工作区窗口之一进行查看和编辑。\n\
  \n* 单个文件可以从工作区中取消固定，以便对其进行独立编辑。这在大屏幕或多显示器环境下工作时特别有用。\n* 拆分窗口允许你在查看文件另一部分的同时处理该文件的部分内容。\n\
  \n# AtmelStudio (编辑器) 智能窗口滚动条\n\n智能滚动条（见下一节）包含标记标记，用于定义相对于整个文件的显示区域、定位光标相对于正在查看代码的位置、定位通过查找/替换文本框找到文本、显示构建后错误所在的位置，以及显示自上次将文件加载到工作区以来对文件所做的更改。这些滚动条可以以标签模式或映射模式显示。\n\
  \n## 1. 智能窗口滚动条\n\n`AtmelStudio` 窗口提供了垂直和水平滚动条，用于在窗口的源代码内部进行垂直或水平导航。这些滚动条包含一个灰色区域，指示视图窗口相对于窗口内容的位置和大小。这是几乎每个文本编辑器的标准做法——此中并无新意；只需拖动滑块即可移动视图区域。请注意，`AtmelStudio`\
  \ 使用垂直条为程序员提供额外信息，特别是：\n\n* 一条水平深蓝色线标记了光标相对于源代码的位置。这意味着程序员可以确定光标相对于正在查看内容的位置。他/她可以上下滑动灰色视图滑块到蓝色线处，将视图区域带到光标位置，或者对光标点击右键直接将视图区域移动到光标位置。\n\
  * 通过查找文本框（`ctrl-F`）进行文本搜索后，滚动条中的橙色区块表示找到文本的位置。程序员随后可以通过点击其中一个橙色区块直接跳转到找到的文本。只要查找文本框保持打开，这些区块也会出现在其他文件中。\n\
  * 当程序员对文件进行更改时，滚动条中会出现黄色区块。执行保存后，这些区块将变为绿色。在关闭 `AtmelStudio` 或关闭文件并重新打开后，它们会消失。\n\
  * 滚动条中会出现微小的红色区块。这些表示文本字符串和注释中的拼写错误。\n* 在执行包含错误的构建后，滚动条中会出现绿色区块。它们揭示了错误的位置。\n\n\
  垂直滚动条可以以两种模式之一显示：`Tab mode`（标签模式）和 `Map mode`（映射模式）。默认情况下，`AtmelStudio` 以 `Tab mode`\
  \ 滚动条打开窗口。可以更改为 `Map mode` 以显示微缩源代码。当上下移动滚动条时，它们还会显示一个包含源代码的文本窗口。此功能允许在不移动窗口视图区域或光标位置的情况下查看代码。可以通过在滚动条内点击右键在\
  \ `tab mode` 和 `map mode` 之间切换。这会打开一个带有菜单选项的文本框。选择底部项目 `Scrollbar options`（滚动条选项）；你将找到配置水平垂直滚动条的选择。\n\
  \n## 2. 函数快速访问\n\n某些文件可能包含许多项（全局变量、函数、类、宏等）。如果你知道函数实现在哪个文件中，选择该文件的标签，然后到文件窗口的左上角。在那里，你会找到一个可以向下滚动的多选择文本框，其中包含了文件中声明或实现的所有项。选择你想要处理的项目。无需查找即可跳转到变量或函数。\n\
  \n### 转到实现\n\n在处理 `function`（函数）时，查看函数的功能以及它是如何得到所需结果通常很有用。你可能想查看它的参数列表以及它的代码。当然，始终可以通过函数名进行搜索，但有一种快得多的解决方案。点击你正在查看的函数。会弹出一个显示有\
  \ `Go to implementation`（转到实现）的窗口。它包含 `function` 的声明和实现。选择你想要的一个。`AtmelStudio` 将打开相应的文件并将光标置于所选择的声明或实现上。此\
  \ `Go to implementation` 功能允许你快速验证参数和函数的功能。要回到之前工作的地方，请使用 `AtmelStudio` 的代码导航功能，多次点击返回按钮直到到达你所需的位置。该导航功能在下方的\
  \ `Code navigation (page 61)` 中描述。\n\n## 3. 内联函数相关任务\n\n`AtmelStudio` 提供两个快速访问弹出窗口，用于处理各种任务，这些任务通常可以通过工具栏图标和菜单项访问。这些多选择文本框提供了任务的快捷方式。我将它们称为\
  \ `函数相关快速访问方法` 和 `任何处右键点击快速访问方法`。\n\n`函数相关快速访问方法`基于点击函数调用下方的小箭头。它打开一个包含若干项任务访问权限的多选择文本框：\n\
  \n* `Create declaration in corresponding .h file`：在 `.cpp` 文件中实现一个 `function` 后，你需要在\
  \ `.h` 文件中创建相应的声明。可以通过 `create declaration` 自动完成。\n* `Rename (refactor)`：重命名（重构）更改整个项目中的变量、宏、类、函数等的名称。\n\
  * `Change signature`：更改声明的名称和类型并进行重构。\n* `Document above a function call`：`Document\
  \ methods` 在悬停在函数调用上方时显示形如 `/*...*/` 格式的文档。\n* `Find reference: all uses of variable/function`：`Find\
  \ reference` 列出变量或函数的所有用法。点击列出的用法之一可将光标带到相应位置。我经常使用此功能。\n\n`任何处右键点击快速访问方法`通过通过对被调用的函数点击右键触发。它会弹出快速访问多选择框，即其他任务的快捷方式，如下：\n\
  \n* `Clicking on function opens a goto multiple-choice window for declarations`：`Go\
  \ to implementation` 打开一个多选择窗口，以快速访问 `function` 的声明或实现。\n* `Refactoring  - rename\
  \ items throughout app`：`Refactoring ` - 这是重命名整个项目的快速访问。它节省了去工具栏调用它的操作。\n\n\n\n\n\
  \n### `AtmelStudio (编辑器)[AUX]插入如 if, while, for 等代码片段`\n插入代码片段功能允许插入 `if`、`while`、`for`\
  \ 等的骨架代码。以下是 `switch` 代码片段：\n\n```cpp\nswitch (key) {\ncase value:\n    /* Your\
  \ code here */\n    break;\ndefault:\n    /* Your code here */\n    break;\n}\n\
  ```\n\n### `AtmelStudio (编辑器)[AUX]将选中的代码用 for, if 等包围`\n包裹（Surround with）：选择一组连续的行，并选择控制语句或其他内容将其包围。以下是\
  \ `for` 循环：\n\n```cpp\nfor (i = 0; i < length; i++)\n{\n    你所选择的 own 行\n}\n```\n\
  不会遗漏合括号并将其放置在正确的位置，是使用此代码快捷方式的两个好处。\n\n### `AtmelStudio (编辑器)[AUX]AtmelStudio 中的代码折叠是大纲视图；缩进是格式化`\n\
  在 AtmelStudio 的术语中，大纲视图（Outlining）意味着折叠。它允许访问各种折叠选项。\n\n### `AtmelStudio (硬件调试)[AUX]使用\
  \ ATmega328P-Xmini 进行硬件调试成功，使用 Atmel ICE 效果不佳`\n调试命令- 在进行硬件调试时直接访问调试命令- `stop`（停止）、`resume`（恢复）等。\n\
  \n#### 1. 颜色编码\n\n##### `AtmelStudio (编辑器)[AUX]语法检查 - 当出现编程错误时颜色变为黑色`\n颜色编码是区分程序类型（变量、宏、文本等）的手段。这对于检测通过\
  \ `/*...*/` 组合的意外的大量被注释文本非常有用。Arduino IDE 确实有颜色编码，但 AtmelStudio 在此基础上更了一大步。它将其作为语法检查的辅助。如果出现错误，源首的颜色会变成黑色。以下是颜色编码功能的非穷列举：\n\
  \n*   **`AtmelStudio (编辑器)[AUX]编辑器显示颜色：函数为红色，变量为蓝色，注释为浅绿色等`** 宏是紫色的。如果某个特定的宏被注释，颜色将变为黑色以表示其未定义。这在查看\
  \ `#ifdefs` 时非常有用。\n*   **函数声明错误为黑色** - 你刚刚创建了一个带参数的函数声明。在此过程中，你忘记定义参数的类型。该函数将变为黑色，并在错误的参数下方带有红色的波浪线。\n\
  *   **函数为红色** - 如果函数未定义，它的颜色会变为黑色，并有红色波浪线下划，以指示问题所在位置（未声明、参数错误、括号问题）。\n*   **变量为蓝色**\
  \ - 如果变量未定义，颜色将变为黑色。\n*   **错误的括号会让函数变黑** - 如果函数声明中存在不平衡的括号，函数名将变为黑色，并附有波浪线下划。\n\
  *   **注释 `/*...*/` 为浅绿色** - 不平衡的结束注释 `*/` 会变为黑色。\n*   **字符串为红色** - 缺少起始或结束的双引号会将字符串的颜色变为黑色。\n\
  \n眼睛会习惯这些颜色约定俗。错误的颜色会警示你。你知道某处出了问题。只需寻找任何黑色的内容即可。你节省了时间；不需要等待编译器告诉你某处不对劲。\n\n####\
  \ 2. 内联语法检查\n\n内联语法检查是 AtmelStudio 强大的效率功能之一。当你编写代码时，如果 AtmelStudio 遇到语法错误，它会用红色波浪线将其下划。例如，假设你刚刚输入了一个函数声明并忘记了结尾的分号，你将得到如下：\n\
  \n```cpp\nvoid MyFunction()\n~~~~~~~~~~\n```\n函数名是黑色的而不是蓝色的，并且有红色波浪线下划。加上分号后，变量颜色变为蓝色，红色波浪线消失消失。\n\
  \n```cpp\nvoid MyFunction();\n```\n\n或者，如果你在声明中忘记了参数类型：\n\n```cpp\nvoid MyFunction(\
  \ _param);\n~~~~~~\n```\n你得到相同的结果，只是波浪线较短，且在参数下方，而不是函数名下方。添加参数类型：\n\n```cpp\nvoid\
  \ MyFunction( char* _param);\n```\n一切就恢复了正常。\n\n未定义的变量或函数是另一个例子。它的颜色会变为黑色并被波浪线下划。此外，还能检测出超出作用范围的变量。因此，如果你在任何地方看到波浪线，请仔细查看代码，某处有错误。\n\
  \n这些小错误——如遗漏分号、多了一个括号、缺失或多余的引号等——在输入时就能尽早捕获。它们极大节省了时间。\n\n#### 3. 查找/替换\n\n#####\
  \ `AtmelStudio (查找/替换)[AUX]支持全词、正则表达式、历史搜索`\n`Regex (通用)[AUX]许多工具包含正则引擎 - AtmelStudio\
  \ 和 PlatformIO 查找/替换, Perl, Awk, Word (通配符)`\nArduino IDE 的查找/替换运行良好但有一定的局限性，尽管版本\
  \ 2 的查找/替换确实支持正则表达式。AtmelStudio 的功能更强大。它可以处理全词、历史搜索、正则表达式以及在范围范围。\n\n但 AtmelStudio\
  \ 的查找功能不止于此。一旦你输入了想要查找的文本，两种机制就会激活。\n\n*   **`AtmelStudio (编辑器)[AUX]智能窗口滚动条提供快速访问各种任务`**\
  \ **`AtmelStudio (查找/替换)[AUX]滚动条中的橙色小块显示查找位置`** 你可以通过查看窗口内容立即看到查找文本的位置，因为查找文本的背景已变为深灰色。文件可能很大。窗口右侧的垂直滚动条显示了小块，指示查找文本的位置。你可以点击这些小块直接跳转到文本。如果你进行了项目范围搜索，这些小块也会出现在其他文件中。你还可以从文本向前向后导航。\n\
  \n当查找框关闭时，带有橙色背景的查找文本将恢复正常。\n\n#### 4. 命名补全\n\n`AtmelStudio (编辑器)[AUX]命名补全上下文弹出窗口`\n\
  AtmelStudio 会预测你正在做什么。在输入任何内容时，它都会打开一个建议命名补全的上下文窗口。通过命名补全，理解为在你开始输入名称时显示建议（变量、函数、宏的列表）。大多数\
  \ IDE 都这样做，命名补全还有很多内容。请继续阅读。\n\n*   **变量命名补全** - 在输入第一个字母后，弹出窗口将列出可用类、枚举、宏和变量（全局和局部）。例如，假设你的应用程序包含了两个以\
  \ `temp` 开头的变量，如下：\n\n```cpp\nfloat tempFloat{_floatValue};\nuint32_t tempUint32{0};\n\
  ```\n当你输入 `t` 时，弹出窗口将包含 `time`、`true`、其他内容以及你的两个 `temp` 变量。在你输入 `te` 后，弹出窗口将包含 `tempFloat`\
  \ 和 `tempUint32` 以及其他以 `te` 开头的变量。向下滚动并选择你想要的。\n*   **函数名命名补全** - 在代码中添加函数调用时，你通常不会记得所需参数的细节。你可以从头文件复制粘贴，但这意味着要转到头文件、找到函数声明、选择/复制、然后回来粘贴。步骤太多了。相反，你可以开始输入函数，然后使用命名补全功能选择该函数。这会将函数插入到你的代码中，并带上开闭括号。光标将位于括号对内部，并带有函数参数的弹出窗口。通过填写所需的参数来完成编码。\n\
  \n\n\n\n\n## AtmelStudio 特性\n\n*   **名称补全上下文弹出窗口打开枚举列表访问** - 在 AtmelStudio 中在列表中选择枚举是极其“防呆”的。假设你定义了以下枚举列表：\n\
  \n```cpp\nenum class EMyEnum: uint8_t { first, second... };\n```\n\n如果你在代码的某处，想要将一个枚举值赋值给变量，例如\
  \ `EMyEnum var =`，一旦你输入 `=` 符号，就会弹出一个包含 `first`、`second` 等枚举选项的弹出窗口——只需选择你需要的那个即可。无需在\
  \ `.h` 文件中费力寻找有效的枚举拼写。\n\n以下是上述内容的某种变体。一个函数将枚举作为变量传递并测试变量的值，例如：\n\n```cpp\nvoid\
  \ MyFunction (... EMyEnum _eChore, ...) {\n    ...\n    if ( _eChore == EMyEnum::second\
  \ ) { // 测试枚举值\n        ... 执行某些操作\n    } // if\n    ...\n} // MyFunction\n```\n\
  \n当你创建 `MyFunction` 的时候，在某个时刻你会输入 `if` 语句：\n\n`if ( _eChore ==`\n\n妙就的地方在这里：一旦你完成输入\
  \ `==`，就会弹出一个包含所有 `EChore` 枚举的窗口，让你选择相应的项。无需跳转到定义 `EChore` 的头文件。\n\n*   **宏名称补全**\
  \ - 我大量使用宏，主要用于基于打印的调试。在 `AtmelStudio` 中，一旦你开始输入宏的开头，就会弹出一个小窗口，显示与你所输入内容匹配的宏。此外，当你向下滚动宏列表时，你可以看到每个宏的代码，从而立即知道它的作用以及它接受哪些参数（如果有的话）。\n\
  \n## 1. 代码折叠与缩进\n\n### 折叠类、函数、枚举、if、while 等以及 #ifdef...#endif 结构对\n\nArduino IDE\
  \ 和 AtmelStudio 均提供了代码折叠功能。当一个文件变得非常大（例如超过 1000 多行代码）时，折叠代码对于可视化文件的结构和整体内容非常有帮助。\n\
  \n### AtmelStudio 支持的折叠\n\nArduino IDE 使用大括号对 `{ ... }` 来折叠和缩进代码。这使得只要有一对大括号，代码就可以在任何级别进行折叠。它可以是\
  \ `if` 的内容、`while` 的内容，或者如果你将 `case` 的内容包含在大括号中，也可以折叠。它还会折叠包含在 `/*...*/` 注释中的内容。它依靠左边距中微小的\
  \ `+` 和 `-` 方框进行选择性折叠。Arduino IDE 的一个大缺陷（1.8.19 和 V2 版本）是它没有全局折叠功能。这很遗憾，因为查看文件内容的全局视图需要对所有函数进行折叠。顺便提一下，请注意我使用\
  \ Arduino IDE 来缩进和/或折叠 JavaScript 和 Perl 代码。Arduino IDE 在折叠时并不考虑语法；它仅仅使用大括号来缩进和折叠代码。\n\
  \n### AtmelStudio 中的代码折叠是大纲（Outline）；缩进是格式化\n\n`AtmelStudio` 不依赖大括号来折叠代码。它折叠结构、类、函数、枚举、`/*...*/`\
  \ 注释块以及 `#ifdef ... #endif` 结构对。它可以通过左边距中微小的 `+` 和 `-` 方框逐个折叠/展开这些内容，也可以通过 `Outline\
  \ all` 选项展开整个文件的内容。折叠所有内容可以让你立即查看文件的内容。这对于 `.cpp` 文件特别有用。`AtmelStudio` 将其称为 Outlining（大纲）。要折叠全部，选择\
  \ `Toggle All Outlining`；要展开全部，选择 `Stop Outlining`。\n\n`AtmelStudio` 支持以下代码折叠能力：\n\
  \n*   **AtmelStudio 支持的折叠**：`#ifdef` - 它允许折叠 `#ifdef...#endif` 结构对。旧版 Arduino IDE\
  \ 1.8.19 不支持此功能。新的 Arduino IDE 2.1.1 虽然可以折叠 `#ifdef...#endif` 结构对，但有一个限制：如果 `#ifdef`\
  \ 在函数内部，它不会折叠该函数。如果函数没有 `#ifdef...#endif` 结构对，Arduino IDE V 2.1.1 将折叠该函数。\n\n* \
  \  **AtmelStudio 和 Arduino IDE 支持 C 风格注释折叠**：`/*...*/` - 通过 C 风格注释对注释掉的代码块可以随意折叠。Arduino\
  \ IDE 1.8.19 支持此功能，但新的 V2 版本不支持。\n\n*   结构、类、函数、枚举、联合（union）可以被单独折叠。两个 IDE 都能做到。\n\
  \n*   **支持一键折叠所有代码**：一键折叠所有代码 - 通过点击一下折叠最高层的所有代码，以获取文件内容和组织的俯视图；然后进行选择性展开（`toggle\
  \ All Outlining`）。\n\n*   **键盘快捷键**：`AtmelStudio` 提供通过快捷键（两次 `CTRL+m`）进行折叠的功能。\n\
  \n*   **折叠代码可视化工具** - Arduino IDE、`AtmelStudio` 以及 `Visual Studio/Visual Micro`\
  \ 提供了折叠代码可视化内容，无需展开/收起已折叠的代码。\n\n*   **复制/粘贴代码**：如果需要将折叠的代码复制或移动到其他地方，你可以复制/粘贴折叠后的代码。不需要展开。当复制/粘贴代码块时，它会在粘贴时展开。其他项保持折叠状态。Arduino\
  \ IDE 和 AtmelStudio 都支持此操作。\n\nArduino IDE 和 `AtmelStudio` 之间的差异很大，以至于有时关闭一个打开另一个来可视化代码。我系统性地使用\
  \ `AtmelStudio` 开发，但有时在进行重构时，Arduino IDE 的代码缩进证明更为灵活。\n\n### 匿名块提高可读性，减少内存\n\nArduino\
  \ IDE 基于使用开启/关闭括号对 `{ ... }` 的代码折叠开启了有趣的可能性。程序员可以使用大括号来隔离代码：这样做的好处是限制了在大括号内声明变量的作用域，从而在执行离开时尽早释放内存。我将这些大括号内的代码称为匿名代码块。\n\
  \n### 通过添加大括号建立 Arduino IDE 代码折叠兼容性\n\n遗憾的是，在 AtmelStudio 中无法使用这些额外的大括号进行折叠。幸运的是，`AtmelStudio`\
  \ 识别 `#ifdef...#endif` 结构对。通过组合 Arduino IDE 的括号 `{}` 和 AtmelStudio 的 `#ifdef...#endif`\
  \ 对，可以实现代码折叠的兼容。想象一个 switch 语句，其中有很多 case，每个 case 都有大量代码。这会导致大量的列表。你可以通过以下组合的括号/宏对在两个\
  \ IDE 中选择性地折叠单个 case：\n\n```cpp\n#define ISOLATE_CODE // 永远不要注释此行\n\n...\n\nswitch(\
  \ val ) {\n\ncase 10:\n#ifdef ISOLATE_CODE // 用于 AtmelStudio 的 #ifdef...#endif 结构对\n\
  { // 用于 Arduino 代码折叠的括号对\n    ...\n    break;\n} // 用于 Arduino 代码折叠的括号对\n#endif\
  \ // ISOLATE_CODE 用于 AtmelStudio 的 #ifdef...#endif 结构对\n\ncase 11:\n#ifdef ISOLATE_CODE\
  \ // 用于 AtmelStudio 的 #ifdef...#endif 结构对\n{ // 用于 Arduino 代码折叠的括号对\n    ...\n \
  \   break;\n}\n}\n```\n\n总而言之，在 Arduino IDE 中工作时，折叠基于大括号对。在 AtmelStudio 中，折叠基于定义（函数、类、枚举等）以及\
  \ `#ifdef...#endif` 对。长 case 的替代方案将依赖于函数来封装单个 case 代码。\n\n## 折叠 /*...*/组\n\nAtmelStudio\
  \ 折叠通过 C 风格 /*...*/ 注释对注释的代码组。旧版 Arduino 1.8.19 也支持此功能，版本 2 则不支持。\n\n\n\n\n\n# 1.\
  \ 组注释/取消注释\n\nAtmelStudio (编辑器)[AUX]快速注释/取消注释高亮区域的快捷键。注释一组代码非常简单：选择一组代码，只需点击一下即可作为组进行注释或取消注释。AtmelStudio\
  \ 提供了提供了按钮和键盘快捷键来实现此功能。Arduino IDE 通过菜单选择实现此功能。它确实有一个快捷键（`ctrl-/`），但它仅适用于美式键盘。新的\
  \ Arduino V2 版本的注释/取消注释快捷键在法语键盘上也可以工作。在 AtmelStudio 中实现此操作的另一种方法是选择一组代码并输入 `/`，它会注释/取消注释该组，比点击注释或取消注释按钮快得多。\n\
  \nC++ 的 `//` 注释适用于注释整行或其行尾。但有时需要通过 `/*...*/` 对来注释掉行内部的几个单词。例如，假设你想从以下函数定义中注释掉 `param2`：\n\
  \n```cpp\nvoid MyFunction(int param1, int param2, int param3);\n```\n\n在 AtmelStudio\
  \ 中，高亮 `int param2` 并输入斜杠 `/`。结果将是：\n\n```cpp\nvoid MyFunction(int param1, /*int\
  \ param2,*/ int param3);\n```\n\n这比费力地输入 `/*...*/` 要快得多。\n\n# 2. 重构\n\nAtmelStudio\
  \ (编辑器)[AUX]重构 - 重命名应用程序中的项目。重构意味着重命名变量的所有实例。假设你最初定义了以下枚举列表：\n\n```cpp\nenum EAllocMode\
  \ { eCreate, eRemove };\n```\n\n由于你当时对 C++ 不够精通，还没有完全学会枚举不仅仅是这些，所以这看起来相当原始。你将枚举命名为\
  \ `eCreate` 和 `eRemove` 以确保名称唯一。你确实实现了唯一性，但是以牺牲可读性为代价的。一定有更好的方法。\n\n一段时间后，你的应用程序变得很大，你提高了了自己的\
  \ C++ 知识水平。你发现了 `enum class` 关键字和大小限定符，它们可以用于枚举定义中。你重写了枚举定义如下：\n\n```cpp\nenum class\
  \ EAllocMode: uint_8t {\n    start = 0,\n    create = 0, remove,\n    end;\n}; //\
  \ enum class EAllocMode\n```\n\n注意枚举变得多么易读；`eCreate` 被替换为 `create`。在使用枚举时，你现在需要用作用域运算符\
  \ `::` 来限定它。与其写 `eCreate`，不如写 `EAllocMode::create`。\n\n你删除了单个项目的枚举前缀以提高可读性。你需要将所有的\
  \ `eCreate` 替换为 `EAllocMode::create`。当然，你可以通过 IDE 的全部查找/替换或逐个查找/替换来避免意外的更改。有一个更好的方法。你可以通过“重构”来修改单个枚举。这允许你更改给定实例的所有情况的名称，无论它是枚举、函数、变量、类还是其他。这是一种智能的文本查找/替换。因此，你可以将\
  \ `eCreate` 重构为 `EAllocMode::create`。\n\n这里有一个额外的重构示例。程序员多久决定重命名变量或函数以使代码更具可读性或减少混淆？程序员进入声明处（`.h`\
  \ 文件）并修改它，编辑器随后建议更改对已修改变量/函数的所有。在接受这样做后，所有引用都被更改了。实际上，程序员在没有显式请求的情况下完成了一次重构。\n\n\
  当你想要更改变量名时，使用重构而不是全局查找/替换的另一个好原因是：重构是基于语法的。这意味着如果你想更改变量的名称，它将在其作用域内进行。\n\n想象一下下面的示例。它有两个名为\
  \ `buffer` 的变量，一个是全局的，一个是局部的。诚然，这是糟糕的编程习惯，但当时时间晚了，你不小心，所以你这样做了：\n\n```cpp\nchar*\
  \ buffer; // 全局 buffer\n\nvoid MyFunction() {\n    char * buffer; // 局部 buffer\n\
  \    ...\n} // MyFunction\n```\n\n注意到你的错误后，你想修复这个混淆源。如果你将全局变量 `buffer` 重构为 `globalBuffer`，只有全局变量会被重命名，而不是局部变量。重构后，你将得到：\n\
  \n```cpp\nchar* globalBuffer; // 全局 buffer\n\nvoid MyFunction() {\n    char * buffer;\
  \ // 局部 buffer\n}\n```\n\n如果你使用了全局查找/替换，你将把所有的 `buffer` 实例改为 `globalBuffer` —— 包括全局和局部变量——陷阱！\n\
  \n当你编写程序时，你会创建变量、类、函数、枚举和其他实体，并随地为它们命名。你经常想重命名某些名称，使它们更有意义且不易被误解。重构允许你无风险地做到这一点。如果程序在重构之前可以正确编译，那么重构后也能正确编译。极其有用！我经常使用它。\n\
  \n# 3. 编译器错误报告\n\nAtmelStudio (编辑器)[AUX]一键访问错误行。Arduino (注意事项)[AUX]编译器错误报告 - 必须手动进入文件/行号来访问代码。AtmelStudio\
  \ 支持错误消息与相应的文件/行号位置之间建立直接点击的链接。跳转到错误位置再简单不过了。点击特定的错误消息。光标将直接到错误位置。修复它——然后点击下一条错误消息并继续。\n\
  \nArduino IDE 在报告编译错误方面做得很好。问题是，程序员在决定要处理某个错误后，必须在标签列表中搜索该文件、选择它并跳到该行，这是一种耗时的方法。\n\
  \n# 4. 代码导航\n\nAtmelStudio (编辑器)[AUX]导航到最近工作过的地方。当你继续编写代码时，AtmelStudio 会跟踪你去过哪里。几个按钮允许你沿着路径向后和向前移动导航——这些类似于书签（第\
  \ 61 页）。当你问自己：“我在哪里修改了这样一个参数？”时，这个功能被证明非常有用。它避免了通过查找来定位最近工作过的特定位置。这是一个例子：你进行逐个查找/替换。最后一次替换带你远离了原始位置。完成查找/替换后，你问自己：“当我开始这次查找/替换时在哪里？”在\
  \ AtmelStudio 中，只需反复点击返回导航，它最终会将你带回开始查找/替换的位置。注意这不是 `ctrl-Z`（撤销）；你可以向后和向前导航到最近工作的地方。\n\
  \n# 5. 书签\n\nAtmelStudio (编辑器)[AUX]通过书签来回导航。书签非常有用。书签意味着标记一行代码。标记允许你通过点击下一个书签或上一个书签从一个标记行跳转到另一个标记行。该功能在进行实验性开发时非常有用。\n\
  \n# 6. 拼写检查\n\nAtmelStudio (编辑器)[AUX]检查字符串和注释。在字符串或注释内部编写文本时，AtmelStudio 认为它不是代码——它会验证标准拼写。它通过在违规词下方显示红色波浪线来指示拼写问题。它不像\
  \ Word 那样的功能文本编辑工具，但仍然有用。到为止，我只用英语使用它。它可能支持其他语言——这取决于使用 AtmelStudio 的环境。拼写检查不是基础的程序员辅助功能；但是它很方便。它有助于提高效率。注释和文本变得更整洁，几乎没有拼写错误。\n\
  \n\n\n\n此外，AtmelStudio 的拼写检查器似乎被赋予了智能。如果文本字符串包含代码，例如 `radius =`，它不会将其标记为拼写错误。然而，存在一些边缘情况，例如\
  \ `malloc` 返回。它会将 `malloc` 标记为拼写错误。\n\n## 1. 转到行号\n\n`AtmelStudio (editor)[AUX]Ctrl-G`\
  \ 将您跳转到文件中的第 # 行，`Arduino (editor)[AUX]Ctrl-L` 将您跳转到文件的第 # 行。如果您想跳转到特定的行号，输入 `ctrl-G`。会弹出一个窗口。它允许您跳转到当前文件的特定行。窗口将显示当前行号和文件的总行数。\n\
  \n## 2. AtmelStudio 硬件调试\n\n使用 Atmel Studio 进行硬件调试有三种基本方法。\n\n*   使用硬件调试器板，例如 Atmel\
  \ ICE (page 122)。调试器板是 AtmelStudio 和目标板（运行您应用程序的板卡）之间的接口。它接收来自计算机的停止/恢复命令，并从目标板收集信息，以便编程人员可以可视化变量和内存。Atmel\
  \ ICE 的问题在于，尽管花费了几个小时尝试用它进行调试，我成功的只是弄坏了板卡和微控制器，并体会了许多挫败感。让我感到安慰的是这并不是因为我的无能，因为我在网上发现有许多其他人也有过同样的经历。\n\
  *   使用集了硬件调试器和目标微控制器的集成调试器板，例如 ATmega328P-Xmini 板。幸运的是，我在 ATmega328P-Xmini 板上成功了——为自己一个忙吧，买一个这样的——它将为你开启新的视野。而且，它是纯粹的即插即用。您可以在\
  \ 硬件调试 (page ١١٩) 中找到更多细节。\n*   基于串口的调试介于硬件调试和基于打印的调试之间。它不需要外部板卡；调试直接在目标微控制器上进行。它允许编程人员定义断点来停止应用程序、检查变量、为变量分配新值并恢复。然而，它受到条件的限制。参见\
  \ 串口调试 (page 125)。\n\n## 3. AtmelStudio 注意事项\n\n没有人是完美的，即使是 AtmelStudio 也不是。它有很多漏洞、不足之处以及难以找到失败的原因。以下注意事项总结了我遇到的问题。它们的解决方法在后文中有进一步描述：\n\
  \n*   `AtmelStudio (caveats)[AUX]导入 Arduino 项目 - 搜索 .ino 文件时的目录导航 bug` Sketch 文件\
  \ - AtmelStudio 在创建 Arduino 项目时，浏览 `.ino` 文件时存在一个 bug；不要使用它。相反，从 Windows 资源管理器中复制/粘贴您的\
  \ sketch 文件的完整路径名。您将只路径：`D:\\ArduinoDev\\Frameworks\\MemMgt`。您需要手动添加 sketch 的名称：`\\\
  MemMgt.ino`。\n*   `AtmelStudio (caveats)[AUX]工作区字体大小未文档；'>' 和 '<' 在法语键盘上变为 ',' 和\
  \ ';' - 关联到物理按键，而非键位映射` `AtmelStudio (keyboard shortcuts)[AUX]工作区字体大小未文档 - '>' 和\
  \ '<' 在法语键盘上变为 ',' 和 ';' - 关联到物理按键，而非键位映射` 工作区字体大小 (page 65) - 有一天，我不小心按了 `ctrl-alt`\
  \ 或 `ctrl-shift` 之类的什么，不记得特定的组合键，我工作区的字体变小了。由于 Arduino IDE 有控制工作区字体大小菜单项，我自然地在 AtmelStudio\
  \ 的图标和菜单中寻找，但无无获。我应该提到，AtmelStudio V7 用户指南（见参考文献）提供了一个快捷键列表，但该列表超过了 14 页。我确实搜索了该列表；在其中没有找到增加/减少工作区字体的选项（我稍后会介绍快捷键）。\n\
  *   `-flto flag` 代码大小取决于 `-flto flag; 减少 40%` `AtmelStudio (caveats)[AUX]默认代码大小大出\
  \ 40%，需要 -flto flag` AtmelStudio 生成的代码比 Arduino IDE 大得多（代码大小 (build options) page\
  \ 233）——不存在 `-flto` 编译器选项导致构建结果比应用了该标志时大得多（对于中等规模的应用大出 40%）。遗憾的是，此选项在 AtmelStudio\
  \ 项目属性对话框中没有建议，并且默认没有实现。人们认为 AtmelStudio 的项目属性对话框应该涵盖所有重要的编译器/链接器标志。遗憾的是，重要的 `-flto`\
  \ 标志（其缺失导致构建大小增加了 40%）缺失了。我认为这个缺失的编译器选项是一个缺陷。它让编程人员不知道为什么他们的应用程序消耗了比应更多的 RAM。如果我没有比较来自\
  \ AtmelStudio、Arduino IDE 和 PlatformIO 的代码大小，我就不会意识到我可以节省大量的 RAM 空间。此外，尝试 AtmelStudio\
  \ 的新手可能会决定用它编辑代码并用 Arduino IDE 编译上传，因为 AtmelStudio 没有提供为什么其代码大出 40% 的线索。\n*   `AtmelStudio\
  \ (caveats)[AUX]avrdude 无法上传代码` 上传代码 (page 66) 到微控制器—— 有时 `avrdude` 出于原因无法将 `.hex`\
  \ 文件上传到微控制器。这并不是真的问题，因为再次尝试通常会成功，尽管一次花费了一些精力。问题是输出窗口中的信息看起来上传成功了，误导了编程人员认为一切正常。他/她习惯于扫一眼窗口而不仔细检查信息。这导致浪费时间去研究为什么尽管更改了代码行为仍然保持不变。\n\
  *   `AtmelStudio (caveats)[AUX]未考虑 Debug 和 Release 输出导致混乱` 代码更改 (page 67) 不影响应用程序运行——我做了配置更改并继续开发，不记得做了哪些更改。在某个时刻，我进行了构建并将执行文件上传到微控制器。我感到困惑，因为程序中的更改并没有修改应用程序的行为，但\
  \ `.hex` 文件确实被上传到了微控制器。这并不是上述的无法上传代码的情况。我遗漏了什么！但是什么？\n*   `AtmelStudio (caveats)[AUX]诡异地导入第二组头文件到\
  \ ArduinoCore 目录` 第二组头文件导入 (page 68) —— 当你导入 Arduino 项目以创建 AtmelStudio 项目时，项目的头文件（.h）会被复制到一个方便的目录\
  \ `ArduinoCore/include` 中。有必要删除它们，因为项目的 `.h` 文件应该与项目的 `.cpp` 文件在同一个目录中。在同一个工作区中有两组文件是灾难的根源。\n\
  \n\n\n\n\n# AtmelStudio 注意事项\n\n## AtmelStudio (注意事项)[AUX]文件包含 20 多个函数，但仅两个显示在快速访问选择框中\n\
  在处理文件时，文件窗口左上角的“快速访问函数”下拉多项选择框非常方便。它能让你快速访问位于文件深处的某个函数，而无需进行查找。有一天，我打开那个小框，发现只列出了两个函数。它缺少了文件中定义的其他\
  \ 20 多个函数——然而，编译仍然成功了。这是怎么回事？？请参阅快速访问函数下拉选择框失效 [(第 68 页)]](#part0014.xhtml_a8MB)。\n\
  \n## AtmelStudio (注意事项)[AUX]if...else 语句的缩进取决于左大括号的位置\nAtmelStudio (编辑器)[AUX]AtmelStudio\
  \ 中的代码折叠是大纲视图；缩进是格式化\n不正确的缩进 [(第 69 页)]](#part0014.xhtml_a8TK) - Arduino IDE 称其为缩进；AtmelStudio\
  \ 称其为格式化，这并不重要。在检查括号和圆括号是否平衡且位置正确时，正确的缩进是非常有帮助的。有时 AtmelStudio 无法进行正确的缩进。\n\n##\
  \ AtmelStudio (注意事项)[AUX]额外的 */ 导致缩进失败\n代码格式化失败 [(第 69 页)]](#part0014.xhtml_a8JH)\
  \ - AtmelStudio 与 Arduino IDE 一样，允许通过单击对整个文件进行格式化（缩进）：`Edit --> Advanced --> Format\
  \ document`。有一次，在执行 `Format document` 之后，我发现位于一个大块 C 风格 `/*...*/` 注释代码之后的所有代码都贴着左边距，没有任何一行是缩进的。注释块之前的代码格式化是正确的。为什么呢？尽管如此，程序仍然正确编译并运行。\n\
  \n## AtmelStudio (注意事项)[AUX]偶尔发生的段错误是无害的；无原因线索；重新构建以修复\n段错误 [(第 70 页)]](#part0014.xhtml_a9CF)\
  \ 在使用 Arduino IDE 时，段错误已不仅仅是一个困扰；这个问题促使我切换到了 AtmelStudio。切换后，我发现 AtmelStudio 确实会偶尔发生段错误，且通常没有错误消息；但在其中一次，它确实提供了一个错误消息。修复方法非常出乎意料。AtmelStudio\
  \ 的段错误从未是问题，重新构建一两次后就会消失。\n\n## AtmelStudio (注意事项)[AUX]项目因不存在的文件导致编译失败，但错误消息中未显示\n\
  错误列表中未出的错误 [(第 71 页)]](#part0014.xhtml_a8V0) 和输出窗口 - 为了留出更多工作空间将错误消息窗口收起，我发现编译失败后里面没有任何错误。就好像错误列表窗口处于非活动状态一样。\n\
  \n## AtmelStudio (注意事项)[AUX]缺失 .cpp 文件导致的 Make 错误淹没在大量信息中\n未列出的 Make 工具错误 [(第 72\
  \ 页)]](#part0014.xhtml_a94E) - 编译器和链接器错误显示在错误列表窗口中，但如果你仅仅因为忘记在项目中包含某个文件而导致未定义的引用，你会得到一个编译失败（缺少文件），它被淹没在大量的编译输出中，但在错误消息列表中没有错误。这使得很难找到编译失败的原因。\n\
  \n## AtmelStudio (注意事项)[AUX]项目因不存在的文件导致编译失败，但错误消息中未显示\n编译失败 - 编译输出中无错误 - 当从 AtmelStudio\
  \ 项目目录中物理删除不再需要的文件时，如果忘记通过 `Solution Explorer`（解决方案资源管理器）从项目配置中删除它们，会导致编译失败。这可能让人感到困惑，因为指示文件缺失的错误消息隐藏在大量的输出中。参阅项目中的不存在文件未列在错误消息窗口\
  \ [(第 73 页)]](#part0014.xhtml_a8BS)。\n\n## AtmelStudio (注意事项)[AUX]小心处理打开文档的查找/替换\n\
  查找和替换 [(第 73 页)]](#part0014.xhtml_a8HR) - 注意“查找/替换打开文档”选项。你可能无法在某些文件中进行更改。\n\n##\
  \ AtmelStudio (注意事项)[AUX]代码固执地保持折叠状态\n拒绝展开某部分代码 [(第 75 页)]](#part0014.xhtml_a93C)\
  \ - 当你要求“格式化文档”展开一段代码时，它有时会非常固执。你点击小正方形图标来展开代码，但什么都没有发生。\n\n## AtmelStudio (注意事项)[AUX]自动格式化\
  \ if...else\nif...else 问题 [(第 74 页)]](#part0014.xhtml_a96B) - 在编写 if...else 时，缩进取决于你将\
  \ else 放在同一行还是下一行。编译器并不关心，但代码格式化程序会区分这两者。\n\n## AtmelStudio (注意事项)[AUX]无法为微控制器生成代码\n\
  无法为微控制器生成代码 [(第 75 页)]](#part0014.xhtml_a9CF) - 在将 Arduino IDE Sketch 导入 AtmelStudio\
  \ 时，似乎 AtmelStudio 将设备硬编码了（AT328P）。这意味着如果你在 mega2560 上开发，之后想为 328P 重新构建，你必须创建一个新的\
  \ 328P 项目；这不太好。\n\n你可以在后续页面找到这些注意事项以及相应的解决方案。\n\n### 1. 工作区字体大小\n\nArduino (编辑器)[AUX]编辑菜单项更改字体大小\n\
  AtmelStudio (注意事项)[AUX]工作区字体大小未说明 - `>` 和 `<` 在法语键盘上变为 `,` 和 `;` - 取决于物理键而非映射\n\
  AtmelStudio (快捷键)[AUX]工作区字体大小未说明 - `>` 和 `<` 在法语键盘上变为 `,` 和 `;` - 取决于物理键而非映射\n\n\
  Arduino IDE 的“编辑”菜单有两个选项：增大字体大小和减小字体大小，易访问且在字体大小意外变化时非常有用。这会在误触快捷键时发生。AtmelStudio\
  \ 确实为所有项目提供了字体类型、大小和颜色设置，但似乎没有为整个工作区提供设置。以下是我的经历。\n\nAtmelStudio (编辑器)[AUX]快捷键关联到物理键或符号映射\n\
  我正在尝试快捷键（包括前进和后退导航），它们似乎不起作用。我有一个法语键盘（AZERTY）。AtmelStudio 安装时语言为英语。在尝试键盘时，我的 .h/.cpp\
  \ 文件的字体大小突然变大。我继续尝试，它一直增大直到字母变得巨大。我找到了增大字体的快捷键，但没找到减小的。提问：如何将字体大小恢复到合理大小？AtmelStudio\
  \ 的帮助毫无作用，`Tools-->Options-->Fonts and Colors` 中的所有选项似乎都无效。\n\n\n\n\n我查看了 `AtmelStudio\
  \ 7` 用户指南中的快捷键，但无果（参见参考文献第 332 页）。这是一个不断尝试的过程。如果一个快捷键可以增大字体大小，那么另一个快捷键应该减小它。我终于找到了它。果然，在法语键盘上，`ctrl-shift-comma`\
  \ 增大字体大小，`ctrl-shift-semicolon` 减小。在美式键盘（QWERTY）上，这些键映射到 `ctrl-shift-=` 和 `-`（等，不，它们分别映射到\
  \ `ctrl-shift`-`>` 和 `ctrl-shift`-`<`），这很合逻辑。\n\n最后，理解问题根源的关键在于理解 `AtmelStudio`\
  \ 是一个由美国设计的程序。开发者选择了与他们的使用习惯相关的符号。问题在于，一旦定义了组合键，快捷键本身就是那个按键，而不是快捷键在表示快捷键时该按键映射的字符。这与\
  \ Windows 的 `ctrl-A` 不同，无论你使用 QWERTY 还是 AZERTY 键盘，它对字母 `A` 都起作用。似乎某些快捷键被硬编码在物理按键上，无论它映射到什么字母；而其他快捷键是软编码到字母的，而不是物理按键。在\
  \ `AtmelStudio` 中，当切换到不同的键盘布局时，快捷键的 ID 会变成物理按键上显示的任何字母。在法语键盘上，`<` 和 `>` 分别变成 `,`\
  \ 和 `;`。\n\n## 1. 应用代码大小 (AtmelStudio)\n\n**AtmelStudio (注意事项)** [AUX]默认代码大小大出 40%，需要\
  \ `-flto` 标记。`-flto` 标记 [AUX]代码大小取决于 `-flto` 标记；可减少 40%。在在三个 IDE（`Arduino IDE`、`AtmelStudio`\
  \ 和 `PlatformIO`）之间实现了互操作性后，我比较了编译后的代码大小（RAM 和闪存内存），以确定其中一个环境是否明显优于其他环境。在对我的其中一个程序（`MemMgt`，默认选项，Release\
  \ 构建）进行代码大小比较后，我发现 `AtmelStudio` 生成的代码比另外两个 IDE 大了 40%。这不符合逻辑，因为它们使用相同的编译器（`GNU\
  \ C++`），因此应该产生本质上相同的输出。此外，`Arduino IDE` 和 `PlatformIO` 生成的代码大小几乎相同。\n\n面对这种困境，我的下一步是测试\
  \ `AtmelStudio` 通过“项目属性”对话框提供的众多编译器和链接器选项。我测试了所有选项，每更改一个选项就重新编译。`AtmelStudio` 提供的选项中没有一个对代码大小产生显著影响。谜团变得更加扑朔，因为我错误地假设所有重要的编译器/链接器选项都可以通过“项目属性”对话框访问。那个宽容选项（该选项很重要，否则你的代码将无法编译）并没有出现，但这不是问题，因为编译器的输出中有一条消息建议你使用它将错误转换为警告。\n\
  \n幸运的是，我已经完成了这三个环境之间的互操作性。我复制/粘贴了每个环境的整个构建命令以检查差异。简而言之，`AtmelStudio` 的编译器选项列表中缺少\
  \ `-flto`（链接时优化）。我将 `-flto` 添加到构建选项中，重新编译了程序，一切都迎刃而解。`AtmelStudio` 生成的代码与另外两个编译器的大小相似。你可以在\
  \ 代码大小（构建选项）（第 233 页） 中找到完整细节。\n\n在我看来，缺少 `-flto` 选项作为项目属性对话框的选项之一是一个严重的缺陷。如果我没有建立三个\
  \ IDE 之间的互操作性（这让我能够比较构建选项），我将不得不花大量时间在论坛上寻找答案，或者糟，天真地继续开发，不知道应用程序体积无无地增加了。\n\n##\
  \ 2. 代码上传失败\n\n**AtmelStudio (注意事项)** [AUX]`avrdude` 无法将代码上传到芯片中。似乎有一个偶尔出现的轻微上传错误，但有时会成为真正的麻烦，需要重启\
  \ `AtmelStudio` 才能成功将代码上传到微控制器中。问题是，在向微控制器进行上传时，`avrdude` 会从闪存中读取代码，并偶尔正常退出，而没有将\
  \ `.hex` 文件上传到微控制器中。它以一句“Thank you”结束。如果你没有看到错误，你将继续进行，并当你发现你在代码中实现的更改对应用程序的行为没有影响时，会感到惊讶。在此时，你可能会浪费大量时间寻找原因，而没有意识到\
  \ `avrdude` 没有完成工作。解决方案是重启 `AtmelStudio`，但并非如此简单。\n\n通常情况下，`AtmelStudio` 会首先读取 Microchip\
  \ 闪存内存的内容，然后将 `.hex` 文件写入其中，最后再次读取它。典型的正常行为输出为：\n\n```\navrdude.exe: AVR device\
  \ initialized and ready to accept instructions\nReading | ##################################\
  \ | 100% 0.01s\n...\navrdude.exe: writing flash (25744 bytes):\nWriting | ###################################\
  \ | 100%\n.14s\nReading | ################################## | 100% 3.31s\navrdude.exe:\
  \ verifying ...\navrdude.exe: 25744 bytes of flash verified\n...\navrdude.exe done.\
  \ Thank you.\n```\n\n偶尔你会遇到异常行为，如下：\n\n```\nReading | ##################################\
  \ | 0% 0.01s\n...\navrdude.exe: reading input file\"D:\\...ProjecDir\\ArduinoCore\\\
  Debug\\libArduino.hex\"\navrdude.exe: cannot open input file <-- 这一行很难看到\nD:\\..ProjecDir\\\
  BigGuyV1\\ArduinoCore\\Debug\\libArduino.hex:\nNo such file or directory\navrdude.exe:\
  \ read from file 'D:\\..ArduinoCore\\Debug\\libArduino.hex'\nfailed\n...\navrdude.exe\
  \ done. Thank you.\n```\n\n**AtmelStudio (注意事项)** [AUX]在上面的上方确实有一条提示失败的消息，即“cannot\
  \ open input file”。然而，它被大量的输出掩盖了，而且那个礼貌的“Thank you”具有误导性。没有强烈的视觉信号表明工作未完成。真的感谢。\n\
  \n结论：如果你看到三行 #，说明上传成功了。如果只有一行 #，`avrdude` 没有将 `.hex` 文件上传到微控制器。关闭 `AtmelStudio`；重新打开；然后重试。这种解决方法对我来说一直有效。\n\
  \n## 3. 代码更改\n\n**AtmelStudio (注意事项)** [AUX]代码更改对运行时没有影响。在修改编译器、链接器和活动配置选项以确定内存需求后，我发现代码中的任何更改都没有影响应用程序的运行时行为。本质上，当\
  \ `Arduino IDE` 将 `.hex` 文件上传到微控制器时，它使用的是临时构建目录中的文件。`AtmelStudio` 则并非如此，当它执行构建时，会将\
  \ `.hex` 文件放在项目 Debug 子目录或 Release 子目录下。\n\n**AtmelStudio (构建)** [AUX]$ProjectDir`,\
  \ `$TargetDir`, `$TargetName` 定义了 .hex 文件的位置和名称。**AtmelStudio (注意事项)** [AUX]未考虑\
  \ Debug 和 Release 输出会导致混淆。当我开始使用 `AtmelStudio` 时，我了解到将可执行文件上传到微控制器需要一个外部命令。创建这样的外部命令很容易，只需在详细模式下进行上传，查看消息，复制粘贴上传命令，在记事本中进行一些修改，然后使用它来定义上传外部工具（上传代码到微控制器（创建外部工具）第\
  \ 44 页](part0014.xhtml_a94S)）。上传文件的信息需要定义完整路径。一直以来我都在 Debug 配置下开发，因此自然地将路径为\n\n\
  ```\n$(ProjectDir)Debug/MyFile.ino.hex\n```\n\n\n\n\n我不经意间将 `Debug` 目录硬编码到了文件路径中。当然，如果我将配置切换到\
  \ `Release`，那么 `.hex` 文件会被放在 `Release` 子目录中，而不是 `Debug` 目录。在对应用程序进行修改、编译和更新后，我没有看到结果，这完全是正常的。因为一直以来，我都在从\
  \ `Debug` 子目录上传旧的 `.hex` 文件，而不是从我正在处理的 `Release` 文件夹上传新文件。通过将上述文件路径重新定义，解决了问题：\n\
  \n```\n$(TargetDir)/MyFile.ino.hex\n```\n\n`TargetDir` 会根据配置自动包含 `Debug` 或 `Release`。问题解决。请参阅代码上传失败（第\
  \ 66 页）。\n\n注意，如果你配合 Visual Micro（第 84 页） 使用 `AtmelStudio`，你可以避免这个问题，因为 `Visual\
  \ Micro` 提供了上传功能。\n\n## 1. 第二组头文件的导入\n\n### AtmelStudio 莫名其妙地将第二组头文件导入 ArduinoCore\
  \ 目录\n\n当 `AtmelStudio` 导入 Arduino sketch 时，它会将项目的头文件 `.h` 拷贝到 `ArduinoCore/include`\
  \ 目录。这非常不方便，因为你会把 `.h` 和 `.cpp` 文件复制到不同的目录——即项目的源代码目录。`AtmelStudio` 将头文件拷贝到 `ArduinoCore/include`\
  \ 目录会带来几个问题：\n\n* 因为在开发应用程序时，你会同时处理 `.h` 和 `.cpp` 文件，它们应该位于同一个源代码子目录中。\n* 如果你想让\
  \ `AtmelStudio` 和 `Arduino IDE` 之间具有互操作性，你必须让 `.h` 和 `.cpp` 文件位于同一个目录下。这是基本的常识。\n\
  * `AtmelStudio`并不在乎 `.h` 文件位于，只要 `#include` 语句能找到它们即可。\n\n如果你将项目头文件 `.h` 留在 `ArduinoCore/include`\
  \ 目录，会有混淆的危险，因为两组相同的文件共存。你可能会在其中一组进行修改，而在另一组中进行其他修改。应该只有一组头文件。我建议删除 `AtmelStudio`\
  \ 放置在 `ArduinoCore/include` 目录中的项目 `.h` 文件，并坚持使用 AtmelStudio` 源代码子目录内与 `.cpp` 文件并行的\
  \ `.h` 文件。\n\n## 2. 函数快速访问下拉框失效\n\n还记得窗口左上角那个实用的文本框吗？就是能让你快速访问文件中定义的任何函数的那个。在处理一个文件时，我点击了这个小文本框来访问文件中的一个函数。我惊讶地发现，总共\
  \ 20 多个函数中只列出了两个。然而，应用程序编译正确且格式化也正确——缩进都是正确的。啊！！！到底是怎么了？\n\n### 额外的 `*/` 导致缩进失败\n\
  \n简而言之，问题在于一个失效的 `#ifdef...#endif` 对内部有一个不平衡的左括号 `{`，如下：\n\n```cpp\n//#define DO_SOMETHING\n\
  \n#ifdef DO_SOMETHING\n\n...\n\nDoSomething( ... ) { // 多余的括号\n\n...\n\n#endif //\
  \ DO_SOMETHING\n```\n\n我将函数定义的第一行复制到我的代码中，忘记了将左括号替换为分号。由于预处理器排除了这部分代码，编译器报告一切无事。如果我取消了\
  \ `//#define DO_SOMETHING`，编译器就会报告错误并强制我去处理它。\n\n结论是，`#defines` 会在编译期间隔离掉不需要的代码；但它不会在源代码格式化期间隔离代码。我花了好很长时间才找到显示函数缺失的根本原因。\n\
  \n## 3. 不当的缩进\n\n`AtmelStudio` 在对 `if...else` 语句进行代码缩进时存在一个小问题。如果 `if...else` 语句的左括号与\
  \ `if` 在同一行，然后是 `else`，它不会正确缩进 `else` 部分语句；如下：\n\n```cpp\nif ( ... ) {\n\nsome code\n\
  \n} else {\n\nsome code\n\n} // if...else\n```\n\n注意上面 `if` 的右大括号是如何向内缩进的——它应该与\
  \ `if` 关键字对齐。\n\n如果将左括号放在单独的一行，你将获得正确的缩进：\n\n```cpp\nif( ... )\n\n{\n\nsome code\n\
  \n} else\n\n{\n\nsome code\n} // if...else\n```\n\n在进行缩进时，让左右括号位于相同的缩进级别是一个重要规则。将左括号放在与\
  \ `if/else` 同一行或后续的一行是一个风格问题。我认为，在某些情况下，尽管应用程序编译无错，但未能正确缩进 `else` 仍然是 `AtmelStudio`\
  \ 的一个缺陷。\n\n## 4. 代码格式化失败\n\n缩进（代码格式化）可以提高可读性；使程序逻辑更易理解；并表明括号和大括号是正确的。如果代码行看起来太远或太靠外；即它们看起来没有对齐；那么就出了问题：逗号误用分号、括号、大括号或其他。程序员可以通过追溯缩进开始的地方来快速定位引起问题的行。\n\
  \n偶尔，`AtmelStudio` 的“格式化文档”（`Edit->Advanced->Format Document`）功能会失效。在一次情况下，执行格式化文档后，代码全部对齐到了左边缘；缩进丢失了。这非常令人不安，因为可读性大大降低，且缺失或多余的大括号几乎无法找到。\n\
  \n我花了很长时间才发现这种行为是由注释掉的 `/*...*/` 代码块引起的。注释代码之后的所有内容对齐到了左边缘，但之前的内容都是正常的。\n\n我起初认为原因是\
  \ `/*...*/` 块的大小。但不是！这不是原因。原因与我通常注释掉以后可能想要取消注释的大段代码有关。为了让代码更可见，我添加了一系列 `*` 并在最后一行添加了结尾\
  \ `*/`。这就是我犯错的地方。最后一行是合法的，这里有两个 `*/` C 语言注释结束标记。两个 `*/` 中的第一个被忽略了；第二个则与第一行的起始注释\
  \ `/*` 配对。因此：\n\n```cpp\n/****************************************\n\n这是一个大\n\n\
  代码块\n\n我以后可能想要取消注释\n\n....\n\n*/************************************\n```\n\n如果你在完成上述操作后执行格式化文档，注释块之后的所有代码都将贴在左边缘。然而，应用程序编译无错且运行正常。最后一行只有一个\
  \ `*/` 注释结束标记，这决定了一切。问题解决。\n\n我最初应该这样定义我的两个注释行：\n\n```cpp\n/****************************************\n\
  \n...\n\n*****************************************/\n```\n\n## 5. 段错误\n\n\n\n\n\n\
  # AtmelStudio (注意事项)[AUX] 偶尔出现段错误是无害的；无原因线索；通过重新构建来修复\n\nArduino IDE 的段错误问题已被证明非常痛苦。通常，在修改\
  \ `#defines` 后重新进行构建（build）可以解决该问题。但有些情况真的让我束手无策，导致了挫败并浪费了大量时间。最终，段错误问题促使我切换到 `AtmelStudio`\
