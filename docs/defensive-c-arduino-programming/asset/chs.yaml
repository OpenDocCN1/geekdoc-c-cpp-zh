  \ 应该在错误列表窗口中列出未定义的引用，就像 Arduino IDE 那样。这本可以立即引导我找到问题的所在。`AtmelStudio` 没有列出未定义引用错误的原因是它没有执行链接阶段，而未定义引用信息正是该阶段产生的。`make`\
