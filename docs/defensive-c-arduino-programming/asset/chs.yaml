  \ (build)** [AUX] 作用域解析运算符 `::` 实现命名空间概念。Perl 作用域运算符 `::` 和 my（第 331 页） - Perl 通过强制作用域解析增加了程序的健壮性。\n\
  - **Perl (strings)** [AUX] 支持正则匹配操作符 `=~` Perl 匹配操作符（第 331 页） `=~` 允许根据正则表达式的成功或失败为变量赋值真/假。\n\
  - 参考文献 - Perl (第 334 页) - 一些选定的 Perl Web 链接指向特定的信息源。\n\n## 安装与用法\n\n### 1. 下载 Perl\n\
  \n- **Perl (general)** [AUX] 包含在 Unix、Linux 和 MacOS 中，但 Windows 没有（下载 Strawberry\
  \ Perl）。Perl 包含在 Unix、Linux 和 MacOS 中，但不一定是最新版本。如果你的电脑是 Windows 系统，可以从 [`perl.org`](https://perl.org)\
  \ 网站下载 Perl。建议为 Windows 10 免费下载 Strawberry Perl ([`www.perl.org/get.html`](https://www.perl.org/get.html))。\n\
  \n说明详细描述了如何设置。在我的情况下（Windows 10），我下载了 64 位 Windows 版本并使用默认设置运行。Perl 将安装在名为 `C:\\\
  Strawberry` 的目录中。\n\n安装 Perl 后，将 `C:\\Windows\\System32\\cmd.exe` 复制到你运行 Perl 的目录。在命令行框中输入\
  \ `Perl -h` 进行测试。它应该返回一系列可能的 Perl 命令行选项。\n\n### 2. 从 DOS 框调用 Perl\n\n- **Perl (command\
  \ line - DOS box)** [AUX] 直接调用 Perl 或使用批处理文件。使用 Perl 需要打开命令行框（参见 DOS 框（附录第 237 页））。进入\
  \ DOS 框后，如下所示调用 Perl 及其参数：\n\n- **Perl (command line - DOS box)** [AUX] Perl 命令行文件/目录位于\
  \ `arg1`、`arg2` 等；在 `@ARGV` 数组中。\n- [MyPerlProgram.pl](http://MyPerlProgram.pl)\
  \ arg1 arg2... > Output.txt: `[MyPerlProgram.pl](http://MyPerlProgram.pl) arg1 arg2...\
  \ > Output.txt`\n\n- **DOS 批处理文件** [AUX] 从批处理文件启动 Awk 和 Perl。你也可以调用包含上述内容的批处理文件\
  \ `MyPerlProgram.bat`（参见 DOS 批处理文件第 241 页）。\n\n## 实现示例\n\n```perl\nuse strict;\n\
  use warnings;\n\n# 初始化变量：首先根据命令行创建一个名称数组。\n# 这可以在 BEGIN 块中完成。\nmy $NumberOfFiles\
  \ = scalar(@ARGV) - 3; # ARGV[1/2] 是输入/输出路径，ARGV[0] 包含 \"Perl\"\nmy @filenames =\
  \ @ARGV[3..$NumberOfFiles-1]; # 文件名的子数组\nmy $totalLineCount = 0; # 累计所有文件的行数\n\n\
  # 使用 foreach 遍历所有文件，一次打开一个\nforeach my $filename (@filenames) {\n    open $fileHandle,\
  \ '<', $filename or die \"Could not open $filename: $!\";\n    my $lineCount = 1;\
  \ # 当前处理的文件计数\n\n    # 使用 while 循环遍历每个文件\n    while (my $line = <$fileHandle>) {\n\
  \        # 使用 $line 内容应用规则\n        if ($line =~ /regex1/) {\n            # 操作\n\
  \        }\n        if ($line =~ /regex2/) {\n            # 操作\n        }\n    \
  \    if ($line =~ /regex3/) {\n            # 操作\n        }\n\n        # 处理完当前行的规则后，增加\
  \ $lineCount\n        $lineCount++;\n    }\n    # while\n\n    # 完成一个文件的工作后，更新 $totalLineCount\
  \ 并关闭文件\n    $totalLineCount += ($lineCount - 1); # 调整初始的 1 计数\n    close $fileHandle;\n\
  } # foreach\n\nprint \"Total lines processed: $totalLineCount\\n\";\n```\n\n\n\n\
  上述操作与 Awk 程序的执行方式完全相同。每个 Awk 条件/动作块都将由一个基于正则表达式的 Perl `if` 匹配语句及其相应的动作块处理，因此：\n\n\
  Awk 的条件/动作块等于 `if($line =~ /regex/) { action-block }`\n\n上述表示一个用于像 Awk 一样处理一组文件的代码块。上述\
  \ Perl 代码块可以根据不同的规则重复执行来实现多轮处理，这在 Awk 中是不可能的。例如：第一轮处理可以在表中注册所有枚举（enums）。第二轮处理可以检测枚举的使用位置，以及哪些枚举已声明但未使用。它还可以通过额外的几轮处理对\
  \ `#defines` 执行相同的操作。\n\n## 1. Perl 文件处理\n\n<x>Perl (文件句柄)[AUX]通过 open 语句从文件名字符串创建\
  \ $filehandle</x>Perl 提供了一种被命名为文件句柄（file handle）的结构。这些句柄提供了对文件的读取、写入或更新访问权限。文件句柄是使用\
  \ `open` 函数创建的变量，用于输入或输出。如果未找到文件，它们将返回 `OK` 或 `undef`。\n\n```\n$openFileResult =\
  \ open $myFilehandle, $direction, $myFileName; or die \"message if cannot open\"\
  ;\n```\n\n注意上面的 `die` 关键字；它是 Perl 在尝试打开文件时处理错误的方式。\n\n*   <x>Perl (文件句柄)[AUX]读取、写入或更新模式下的文件</x>使用\
  \ `open` 创建文件句柄需要五个参数：\n    *   `$openFileResult` - 如果成功，则生成一个值；否则生成 `undef`。\n\
  \    *   `$direction`：`<` 表示读取，`>` 表示写入，根据 Perl 版本，`<+` 或 `>>` 表示更新。\n    *   `$myFilehandle`\
  \ 是正在定义的句句柄。\n    *   `$myFileName` 是文件名。\n    *   `die` 是 `open` 的一部分，在失败时会发出消息。\n\
  \n一旦创建并打开，请将文件句柄视为一个记录（行）的数组或列表。你可以一次处理一个记录（行）来遍历文件句柄，就像遍历列表时一次处理一个项目一样。完成文件操作后，应该通过文件句柄关闭它\
  \ `close($myFilehandle)`。\n\n*   使用 Perl 读取文件需要首先声明一个文件句柄，例如：\n\n```\nopen $myFileHandle,\
  \ '<', \"input.txt\";\n```\n\n然后你可以通过以下方式循环文件：\n\n```\nforeach $line ( $myFilehandle)\
  \ { do something on $line }\n```\n\n这与 Awk 不同，Awk 会自动遍历作为命令行参数提供的文件。\n\n*   写入文件需要声明一个文件句柄并使用它来重定向输出，如下：\n\
  \n```\n$myFilehandle;\nopen $myFilehandle, '>', \"Output.txt\";\nprint $myFilehandle\
  \ \"This is text to append to the file Output.txt\";\n```\n\n打印的内容将追加到文件中。\n\n*\
  \   <x>Perl (文件句柄)[AUX]通过 <...> 将 $fileHandle 转换为数组，并使用 foreach 循环</x>访问已打开文件中所有行有一种快捷方法：空角操作符\
  \ `<>` 对打开文件中的所有行执行操作。同样，`while(<>) { ... }` 将处理打开文件的所有行。你可以通过在 `<>` 中插入文件名来将处理限制在特定文件中，例如\
  \ `while(<$myFilehandle>) { ... }`。\n\n## 2. Perl 子程序（函数）\n\n<x>Perl (变量和函数)[AUX]函数有名称和主体，但没有参数列表</x><x>Perl\
  \ (变量和函数)[AUX]函数可以使用参数调用 - 一种独特的处理方式（通过数组 @_）</x>子程序（Subroutines）就是函数。这只是术语问题。它们有名称和主体，但由于\
  \ Perl 向子程序传递参数的方式特殊，它们没有参数列表。一个典型的定义如下：\n\n```\nsub MySubroutine { subroutine's\
  \ body }\n```\n\n注意这里缺少参数列表。然而，它们可以像往常带参数调用，例如：\n\n```\nMySubroutine( param1, param2...);\n\
  ```\n\n子程序体通过内置数组 `@_` 访问函数参数。Perl 的晦涩性莫过于此此了！单个参数作为数组中的连续项被访问：\n\n\n\n*   `param1`\
  \ 是 `$[0]`\n*   `param2` 是 `$[1]`\n*   ...\n\n除了这种参数传递的特殊性外，子程序可以像其他第三代编程语言（C, Basic,\
  \ Fortran, Pascal 等）一样作为函数使用。\n\n## 3. Perl 字符串\n\n<x>Perl (字符串)[AUX]Perl 支持字符串拼接</x>字符串拼接\
  \ - 在 Awk 和 C++ 中，你会这样做：\n\n`$myString = \"first\" \" \" \"time\" \" \" \"around\"\
  ;` 产生 \"first time around\"。\n\n在 Perl 中，你必须使用点（.）：\n\n`$myString = \"first\" .\
  \ \" \" . \"time\" . \" \" . \"around\";` 产生 \"first time around\"\n\n或者你可以对带有空格分隔的列表进行\
  \ `join`：\n\n```\njoin(\" \", (\"first\", \"time\", \"around\"));\n```\n\n`join`\
  \ 函数接受两个参数，`sep` 和 `items`；`sep` 是分隔符（通常是空格），插入在项目之间。`items` 是要合并的列表。\n\n## 4. Perl\
  \ 字符串插值\n\n<x>Perl (字符串)[AUX]支持单双引号字符串插值</x>Perl 字符串可以用单引号或双引号括。在 Perl 中，双引号字符串是插值的；单引号是字面的。以下语句：\n\
  \n```\n$var = \"This is a string.\";\nprint '$var = $var';\n```\n\n将产生 `$var = $var`，因为单引号的内容被视为\
  \ Literal。没有特殊处理。然而，如果你使用双引号：\n\n<x>Perl (字符串)[AUX]双引号在打印语句中区分变量名和其值</x>\n\n```\n\
  print \"$var = $var\";\n```\n\n打印语句将产生 `This is a string. = string.`。Perl 之为字符串插值。它打印\
  \ `$var` 的值。为了得到你想要的，你应该对第一个 `$var` 进行转义，例如：\n\n```\nprint \"\\$var = $var\";\n\
  ```\n\n上述将产生 `$var = $ string.`。\n\n注意你不需要将变量放在双引号之外，而你在 Awk、C 以及大多数其他语言中需要这样做。以下示例进一步说明了插值。在几乎所有的编程语言中，你都可以进行混合字符串和变量的打印，例如：\n\
  \n```\nprint (\"Full name: \", firstName, \" \", lastName);\n```\n\n打印语句的变量和字符串组件用逗号隔开，整体位于括号内。这使得阅读很困难。在\
  \ Perl 中，你会这样做：\n\n```\nprint \"Full name: $firstName $lastName\";\n```\n\n该打印语句的特征是它包含在一个插值的双引号字符串中，并且打印的是变量的内容而不是其名称。\n\
  \n## 5. Perl 列表\n\n<x>Perl (构建)[AUX]列表允许在一行代码中对多个项目执行操作</x>Perl 允许列表化操作，例如多变量赋值：\n\
  \n```\n($a, $b, $c) = (1, 2, 3)\n```\n\n1 被赋值给 `$a`，依此类推。或者交换值：\n\n```\n($lunchDesert,\
  \ $supperDesert) = ($supperDesert, $lunchDesert);\n```\n\n或者给数组赋值：\n\n```\n@daysOfTheWeek\
  \ = (\"Monday\", \"Tuesday\"...);\n``` \n\n## 6. Perl 程序流控制\n\n\n\n\n\n# Perl 程序流程控制\n\
  \nPerl 支持程序流程控制机制，例如 `for`、`if`、`switch` (given) 等。Perl 支持 C 风格的流程控制结构：`if`、`while`、`for`、`foreach`、`given`\
  \ (switch)、`do...while`。其中大多数工作方式与 C++ 相似。其他的有所不同，见下文。\n\n*   Perl 支持 `for`/`while`，但它不是通过\
  \ `continue` 和 `break` 中断循环，语义上使用 `next` 代表 `continue`，`last` 代表 `break`。\n\n##\
  \ 处理文件\n\nPerl 处理文件：在 `$FileHandle` 上使用 `foreach` 和 `while`。`foreach` 结构可以解释为对列表的自动\
  \ `for`。对于列表中的每个项（例如数组），执行某些操作。语法如下：\n\n```perl\nforeach $item (array, or filehandle,\
  \ or list ) { ... }\n```\n\n`$INPUT_RECORD_SEPARATOR` 或 `$RS` 或 `$/` - 默认为 `\\n`。与\
  \ `for` 语句不同，不需要定义从哪里开始以及如何结束处理。它从列表开始，逐个处理每个项，将其值赋值给 `$item`，并在列表结束时停止。如果列表是一个句柄，`$item`\
  \ 将包含一行文本，因为 Perl 将文件视为文本行的列表（假设输入记录分隔符 `$/` 未被修改为默认值，换行符 `\\n`）。\n\n## Switch 语句\n\
  \nC 的 `switch/case/default` 在 Perl 中命名为 `given/when/default`。`given`（又名 switch）——switch\
  \ 语句在 Perl 中称为 `given`，但其工作方式与 C 不相同；`switch`/`case`/`default` 分别命名为 `given`/`when`/`default`。这里没有\
  \ `break` 语句来防止一个 case 的执行流向下一个 case。如果某个 `when` 被激活，其他 `when` 语句将不会被测试，这等于自动 `break`。结果是你无法像在\
  \ C/C++ 中那样将 case 组合，也无法处理完一个 case 后流到下一个 case 进行更多处理。语法如下：\n\n```perl\nuse feature\
  \ \"switch\";\n\n...\n\ngiven ( $controlValue ) {\n    when( value1) { ... };\n\
  \    when( value2) { ... };\n    ...\n    default { ... };\n} // #controlValue\n\
  ```\n\n但也可以如下使用：\n\n```perl\nmy $var = 2;\n\ngiven( $var ) {\n    say \"first\"\
  \ when (1);\n    say \"second\" when (2);\n    default {print \"default\";};\n}\n\
  ```\n\n## Perl 数组\n\nPerl 数组是关联的，可以混合数值（浮点数）和字符串值。Perl 数组与 C 数组不同。Perl 数组是关联的——项可以是不同的类型。在这方面，它们在某种程度上类似于\
  \ Awk 数组，但相似性仅此此。以下是刻画 Perl 数组的几个特征。\n\n### 创建数组\n\nPerl 三种变量类型：`$scalars`、`%hashes`、`@arrays`。创建数组——作为数组的变量必须使用\
  \ `@` 数组标识符声明，例如 `@myArray`。可以通过以下几种方式进行初始化：\n\n- 创建现有数组的子集、从 Perl 列表创建或通过字符串分词创建数组\n\
  - 动态创建单个数组项\n- 通过 `<...>` 将 `$fileHandle` 转换为数组，通过 `foreach` 循环\n\n- 通过列表：`@myArray\
  \ = (4, 1, 'Sasha, 'Gomez' );`\n- 通过另一个数组的子集：`@myArray = @biggerArray[4..7];` #\
  \ 索引 4 到 7\n- 动态创建单个数组项：`$myArray[3] = 5;`\n- 分词字符串：`@myArray = qw/Mr. Sasha Gomez\
  \ Cambridge 02139/, '109 Mass. Ave..'/;`\n- 将文件转换为数组：`@myArray = <$filehandle>;`\n\
  \n通过嵌套方括号初始化创建多维数组。数组不需要预定义大小和包含的数据类型。它们根据初始化自动确定维度，并在使用范围外的索引进行赋值或删除数组项时自动重新调整。至于数据类型，数组可以包含数值和字符串值的混合。\n\
  \n### 数组索引与内容\n\n数组索引必须是整数——会将非整数索引转换为整数。与 Awk 不同，数组索引仅限整数。如果你使用整数，Perl 会接受；如果是浮点数，它将使用其整数部分转换为整数。如果是字符串，它将将其转换为索引\
  \ 0：\n\n```text\nindex 5 becomes 5,\nindex 3.7 becomes 3,\nindex \"first\" becomes\
  \ 0.\n```\n\n数组内容——就像在 Awk 中一样，数组项可以是数字（浮点数或整数）或字符串。因此你可以这样操作：\n\n```perl\n@myArray\
  \ = ('Sasha', 'Gomez', ..., 55, 41...);\n```\n\n### 使用索引获取数组项\n\n访问数组中的项——访问数组项中的项是为了防止一个\
  \ case 的执行流向下一个 case 进行更多处理（等等，检查源码：“如果一个 when 被激活，其他 when 语句将不会被测试，这等于自动 break。结果是你无法像在\
  \ C/C++ 中那样将 case 组合...”）。\n\n*(注：由于原始文本存在大量重复和混乱，此处翻译已根据要求提取核心内容)*\n\n\n\n\n\n\
  # Perl（内置变量和函数）\n\n`$ARG` 或 `$_` 是文本行（记录）。`$_`（美元符号）包含刚刚读取的整行。请注意 `$_` 包含了刚刚读取的整行。同时请注意，不需要通过索引逐个显式地从数组中获取项。此外，`foreach`\
  \ 结构一次处理一个 `$line` 项来遍历数组，就好像它包含了一组连续的变量一样。`for` 循环必须处理的未定义项会被 `foreach` 循环忽略。\n\
  \n## Perl（数组） - 通过 for 循环、foreach 循环和 while 循环遍历整个数组\n\n可以使用 `while` 循环，通过定义一个临时数组并使用\
  \ `shift` 函数在每次迭代开始时获取并移除第一个项：\n\n```perl\nmy @tempArray = @myArray;\n\nwhile( my\
  \ $item = shift( @tempArray ) { do something with $item }\n```\n\n当没有更多 `$items`\
  \ 可供 `shift` 操作时，`while` 退出。虽然这个解决方案有点繁琐，但 `foreach` 数组遍历更加简洁，不需要创建临时数组。可能会存在性能问题，从而有利于采用这种方法。\n\
  \n## Perl（数组） - push/pop 在 Perl 数组中添加/删除最后一个项；shift/unshift 对第一个项执行相同操作\n\n添加和移除数组项\
  \ - 可以使用函数 `shift`/`unshift`（提前/删除第一项）和 `push`/pop`（追加/删除最后一个）在数组的头部或尾部添加或移除数组项。此功能可以如上文所示用\
  \ `while` 循环处理数组。可以通过 `delete(item)` 函数物理地删除单个数组项。也可以通过为未使用的索引的数组项赋值来添加数组项，无论该索引是在数组当前索引范围之内还是之外。请注意，如果在数组当前范围之外添加数组项，数组会自动重新调整尺寸。\n\
  \n## Perl（字符串） - 使用列表函数将 Perl 数组转换为字符串；Perl 字符串分词和拼接函数：split, qw// join\n\n字符串转数组和数组转字符串\
  \ - 可以使用 `split` 函数或 `qw//` 函数将文本行转换为单词数组，如上文 Perl 数组部分所示。相反，将一个单词数组转换为一个连续的字符串，可以通过\
  \ `join(sep, list)` 实现，其中 `sep` 是分隔符，如空格、逗号等；`list` 是要合并项的数组。\n\n## Perl（数组） - 创建现有数组的子集、来自\
  \ Perl 列表或通过字符串字符串\n\n数组复制 - 数组的子集可以复制到另一个数组中：\n\n```perl\n@newArray = @oldArray[0..4]\n\
  ```\n\n将数组 `@oldArray` 索引 0 到 4 的五个项复制到 `@newArray`。\n\n* 从列表创建数组非常简单：\n\n```perl\n\
  @myVars = (5,4,3,2,1);\n```\n\n这五个值的列表创建了 `@myVars` 数组。\n\n## Perl（数组） - Perl 数组可以通过\
  \ sort 函数进行排序\n\n数组排序 - `sort` 函数将根据项的 ASCII 值对数组项进行排序。这是一种基于字符串的排序，而不是数值排序。数字将作为字符串排序，因此排序结果将数字在前，随后是小写字母，然后是大写字母。排序\
  \ `@myArray` 的命令是：\n\n```perl\n@sortedArray = sort( @myArray );\n```\n\n如果数组包含大于\
  \ 10 的小数，基于 ASCII 的排序结果将类似于 1 11 13 2 21 5 55...，这不是数值排序。\n\n## Perl（数组） - + 号重载以启用合并数组\n\
  \n数组合并 - 可以通过相加将两个或多个数组合并成一个更大的数组。\n\n```perl\n@array = @array1 + @array2.\n```\n\
  \n# 1. Perl 多维数组\n\n## Perl（数组） - 通过嵌套方括号初始化创建多维数组\n\nPerl 中的多维数组是包含数组的数组。因此，`@AoA[2]`\
  \ 是二维数组 `@AoA` 的第三个数组。请注意 `AoA` 表示法是数组数组（array of arrays）的助记。如果你写成 `$AoA[2]`，你将引用一维数组\
  \ `AoA` 的第三个项。下面的简短示例显示了 Perl 数组确实可能非常困惑且容易出错。\n\n* 数组是动态维度的——这意味着当你定义一个数组时，例如 `@AoA`（这是数组数组的简写），它可以是一个一维或多维数组。假设如下：\n\
  \n```perl\n@AoA = (\n    [\"Sasha\", \"Mary\", \"Paul\", \"Henry\", 5],\n    [\"\
  Abigail\", \"Joseph\", \"Eve\", \"Arthur\", 8]\n);\n```\n\n上面的语句定义了一个二维数组；它包含两个子数组。可以通过嵌套方括号创建更深层的数组。从其中一个子数组中访问数组项的方法与\
  \ C 语言相同：上述数组的 `$AoA[1][3]` 生成 Arthur。记住，Perl 数组是从零开始的。\n\n## Perl（数组） - 多维数组很繁琐\n\
  \n管理多维数组的子数组是繁琐的。通过使用两个索引获取二维数组变量。就像在 C 语言中，第一个索引（从左到右）定义子数组；第二个索引定义子数组中的项：上述数组的\
  \ `$AoA[1][3]` 生成 Arthur。从概念上讲，`[1]` 是子数组，`[3]` 是子数组中的索引。\n\n管理多维数组的子数组是繁琐的。打印 `@AoA[0]`\
  \ 子数组可以通过遍历来实现：\n\n```perl\nforeach $item ( @AoA[0] ) {say \"\\$item = $item\n```\n\
  \n上面的看起来是正确的，`AoA[0]` 应该是第一个子数组，但它不起。它产生了一个错误，建议使用 `$AoA[0]` 而不是 `@AoA[0]`。这意味着将\
  \ `AoA[0]` 从数组转换为标量，我并不太理解。所以我这样做：\n\n```perl\nforeach $item ( $AoA[0] ) {say \"\
  \\$item = $item\n```\n\n## Perl（数组） - 多维数组的大小\n\n与一维数组一样，获取二维数组的大小基于使用 `scalar`\
  \ 函数。`@AoA` 是上面介绍的二维数组。\n\n```perl\n$arraySize = scalar @AoA;\n```\n\n上面的输出是 2，这很奇怪。AoA\
  \ 确实有两个子数组。我本期望得到变量总数 10；这是 Awk 会做的。我的目标是获取子数组中的变量数量，逻辑上建议这样做：\n\n```perl\n$arraySize\
  \ = scalar @AoA[0];\n```\n\n但并没有，这产生了一个警告并得到了错误的结果 `ARRAY(0x652108)`。Perl 建议将子数组转换为标量。然后我按照建议尝试了：\n\
  \n```perl\n$arraySize = scalar $AoA[0];\n```\n\n并且没有得到警告，但我仍然得到了相同错误的结果。获取子数组的维度变得有点复杂。解决方案在于如上文处理子数组部分所示间接进行。关键是将二维数组的子数组转换为独立的一维数组。因此：\n\
  \n\n\n\n\n# Perl (数组)[AUX]获取子数组的维度需要编程技巧\n\n```perl\n$subArray = $AoA[0][0];\n$arraySize\
  \ = scalar @$subArray;\n```\n\n这不起作用！但看起来很笨拙。我还没有搞清楚为什么，也许某个 Perl 专家程序员可以找到一个优雅的解释。不过这可能有一个原因，与隐式寻址或解引用有关。\n\
  \n## 1. Perl 引用传递\n\n### Perl (构建)[AUX]按值传递和引用传递\n在某些情况下，引用传递是完成任务的唯一方法。例如，如果你想通过函数修改数组项，必须将数组作为引用传递，这样函数内部对数组项的更改也会影响到原始函数中的项。\n\
  \n#### \\[AUX]Perl 引用传递运算符\n执行此操作依赖于引用传递运算符 `\\@`。在调用需要按引用传递数组的子程序时，请执行：\n\n```perl\n\
  my $result = MyFunction(x, y, \\@myArray, ...);\n```\n\n在上面，我的数组是第 3 个参数。该函数将包含以下解引用代码：\n\
  \n```perl\nsub MySubroutine {\n...\nmy @targetArray = @{$ _[2]}; # 第 3 个参数，从 0 开始\n\
  }\n```\n\n哇，真是晦涩难懂(`@{$ _[2]}`)，Perl 简直是极客的乐趣。在执行上述操作后，`@targetArray` 的用法就像使用任何其他数组一样。当你处理\
  \ `@targetArray` 时，就像是你直接操作原始的 `@myArray`。\n\n## 2. Perl 内置变量\n\n### Perl (内置变量和函数)[AUX]英语语言\
  \ pragma：用 AND 代替 &&，用 OR 代替 || \n你几乎可以使用标准英语或字符和符号来访问 Perl 几乎所有的内置变量。默认情况下，Perl\
  \ 内置变量以 `$` 或 `@` 符号开头。必须调用英语 pragma 才能启用使用标准的英文名称版本。\n\n*   `$PROGRAM_NAME` 或 `$0`，包含启动的\
  \ Perl 程序。`$0` - Awk 中表示刚读取的记录，Per 中表示程序名（也是 `$PROGRAM_NAME`）。`$PROGRAM_NAME` 或\
  \ `$0` 包含启动的 Perl 程序。它不包含像 Awk 那样刚从文件中读取的行。要获取刚读取的行，使用 `$_`。\n\n*   `@ARGV` 数组：命令行参数。`@ARGV`（Perl\
  \ 数组）Perl `arg1 arg2` 命令行参数存储在 `@ARGV` 数组中。`@ARGV` 是包含命令行参数的数组。\n\n*   `$ARGV` 数组在从\
  \ `<>` 数组读取时包含当前文件名。Perl `$ARGV` 数组在从 `<>` 数组读取时包含当前文件名。`$ARGV` 是从 `<>` 作为数组读取文件时的当前文件名。\n\
  \n*   `$INPUT_LINE_NUMBER`、`$NR`、`.` 处理文件的行号。Perl `$NR` 可替代 `$INPUT_LINE_NUMBER`\
  \ 或 `.`，表示正在处理的文件行号。`.` 可替代 `$INPUT_LINE_NUMBER` 或 `$NR`，正在处理的文件行号。`$INPUT_LINE_NUMBER`\
  \ 或 `$NR` 或 `.` 是正在处理的文件行号。\n\n*   `$INPUT_RECORD_SEPARATOR` 或 `$RS` 或 `/` - 默认值为\
  \ `\\n`。Perl `$RS` 可替代 `$INPUT_RECORD_SEPARATOR` 或 `/` - 输入记录分隔符，默认值为 `\\n`。`$INPUT_RECORD_SEPARATOR`\
  \ 或 `$RS` 或 `/` - 输入记录分隔符。它定义了如何将文本分割为记录。默认是换行 `\\n`，这意味着源代码是一行读取的。因此，文件是行（记录）的列表。\n\
  \n*   `$OUTPUT_RECORD_SEPARATOR` 或 `$` - 默认换行。Perl `$` 可替代 `$OUTPUT_RECORD_SEPARATOR`（默认换行）。默认情况下，`print`\
  \ 不以换行符结束。设置 `$\\ = \"\\n\"` 可以让 `print` 添加换行。\n\n*   输入字段分隔符 - Perl 似乎没有这个。Perl\
  \ 似乎没有像 Awk 那样显式的输入字段分隔符，但它有 `$OUTPUT_FIELD_SEPARATOR`。\n\n*   `$OUTPUT_FIELD_SEPARATOR`\
  \ 或 `$OFS` 或 `,` 用于分隔各个字段。Perl `$OFS` 可替代 `$OUTPUT_FIELD_SEPARATOR` 或 `,`，分隔各个字段。`,`\
  \ 可替代 `$OUTPUT_FIELD_SEPARATOR` 或 `$OFS`，分隔各个字段。\n\n*   `@ARG` 或 `$_` 是正在处理的文件行。Perl\
  \ 的行是完整的记录。你通常通过这样做访问每行：\n\n```perl\nforeach $line ($myFilehandle) { ... }\n```\n\
  \n另一种方法是使用 `$_`，不需要创建 `$line` 变量。循环将变为：\n\n```perl\nforeach ($myFilehandle) { use\
  \ $_ }\n```\n\n*   `@ARG` 或 `@_`：传递函数的参数。Perl `@ARG` 或 `@_` - 传递给函数的参数数组。\n\n* \
  \  `$SUPSEP` 或 `$` - 索引分隔符。Perl `$` 可替代 `$SUPSEP` - 索引分隔符，默认逗号。还有更多内置变量，请访问 [`perldoc.perl.org/variables`](https://perldoc.perl.org/variables)\
  \ 获取完整列表。\n\n## 3. Perl 字符串函数\n\n从 C++ 程序员的视角来看，Perl 提供了几个 C++ 中没有的有趣字符串运算符：\n\n\
  *   将文本行拆分为单词 - Perl 不像 Awk 那样自动将行拆分为组件；但它可以通过 `split` 函数自动拆分文本行。它还可以通过正则表达式括号捕获机制从行中提取数据并将其放入\
  \ `$1`、`$2` 等。见 Perl 匹配运算符（下一页）。在 Awk 中，文本行存储在 `$0` 中。在 Perl 中，文本行存储在 `$_` 中（$0\
  \ 包含 Perl 程序名）。\n\n*   标记 - `qw//` 函数将字符串拆分为各个独立的标记。如下：\n\n```perl\n@myArray = qw/This\
  \ is a string/\n```\n\n`@myArray` 将包含原始字符串的四个单词作为独立的数组元素。注意字符串没有在在内；如果是引号限定，第一项和最后一项将包含引号，因此：第一项为\
  \ \"This\"，最后一项为 \"string\"。\n\n\n\n\n\n# Perl（内置变量和函数）\n\n- `qq{}` 函数：允许在字符串内部嵌入双引号而无需使用转义字符。\n\
  - Perl（字符串）：`qq{}` 函数允许在字符串内部嵌入双引号，而无需使用转义字符。\n- **嵌套的引号字符串**：几乎所有的编程语言都要求双引号字符串内的双引号字符串必须进行转义。例如：`\"\
  He said \\\"yesss!\\\"\"`。在 Perl 中，你必须也这样做，但 Perl 有 `qq{}` 运算符；使用它可以让你免于转义引号的烦恼；示例字符串可以写成\
  \ `qq{He said \"yesss!\".}`。这样更简洁且不易出错。`q{}` 运算符是单引号的等效写法。\n\n## Perl 导入包\n\nPerl（构建）导入包（使用\
  \ use 指令）：`strict`、`diagnostic`、`features 'switch'`。Perl 与 Awk 一样，是一个单模块程序；一个文本文件定义整个程序。但与\
  \ Awk 不同，它可以导入预定义的代码包，就像 C++ 导入库一样。Perl 通过包（packages）概念来实现这一点：`pragma` 或 `use`。\n\
  \nPragmas 和 `use` 是 Perl 程序中的第一个条目（注释除外，但注释会被忽略）。始终应该加载两个 pragmas：`use strict` 和\
  \ `use diagnostics`。`strict` 强制程序员遵循严格的语法，这应该能提高程序的健壮性。`diagnostics` 在 Perl 遇到编程错误时为程序员提供有用的调试信息。\n\
  \n## Perl 变量类型\n\nPerl（变量和函数）Perl 类型通过特殊字符区分：`$scalars`（标量）、`@arrays`（数组）、`%hashes`（哈希）。\n\
  - `$`（美元符号）：Perl 提供了三种变量类型：`$scalars`、`%hashes`、`@arrays`。\n- `%`：Perl 提供了三种变量类型：`$scalars`、`%hashes`、`@arrays`。\n\
  - `@`（at 符号）：Perl 提供了三种变量类型：`$scalars`、`%hashes`、`@arrays`。\n- Perl（数组）：Perl 提供了三种变量类型：`$scalars`、`%hashes`、`@arrays`。\n\
  \n区分变量类型需要根据其类型在变量名前前加上特殊字符：`$`、`@`、`%`（标量、数组、哈希）。这可能会误导你，因为 `$myVar` 和 `%myVar`\
  \ 可能是互不相关的变量。对于数组，它们用 `@` 声明（`@anArray`）。然而，通过 `$` 符号将数组限定为标量来访问其单个元素，例如 `$anArray[0]`。注意，名称保持不变，在方括号内添加了索引，并且第一个字符从数组符号\
  \ `@` 变为标量符号 `$`。请注意，执行 `@anArray[0]` 指的是被视为多维数组中的第一个数组，而不是一维数组 `@anArray` 中的第一个元素——这很吓人！\n\
  \n## Perl 作用域解析运算符 :: 和 my\n\nPerl（构建）作用域解析运算符 `::` 实现了命名空间概念。假设有一个名为 `DataGroup`\
  \ 的导入模块包含一个名为 `$buffer` 的变量，而你想创建你自己的 `$buffer` 变量。你将使用 `DataGroup::$buffer` 来访问\
  \ `DataGroup` 模块的版本。至于你的 `$buffer` 变量，你将将其声明为 `my $buffer`，你可以在程序中使用它而无需作用域限定符。`my`\
  \ 关键字表示所声明的变量属于主程序，而不是模块。此外，它将其作用域限制在声明它的级别，就像在 C++ 中发生的情况一样。使用 `use strict` prisma\
  \ 的结果之一是必须用 `my` 作用域解析运算符明确声明变量；省略 `my` 关键字将触发错误。\n\n## Perl 文本匹配运算符\n\nPerl（字符串）支持正则文本匹配运算符\
  \ `=~`。正则表达式非常有用。幸运的是，Perl 程序员可以在程序中嵌入正则表达式，将其应用于某些文本，并通过 `$1`、`$2` 等捕获机制在算法中获取数据。这是一个示例：\n\
  \n```perl\nmy $text = \"the little fox had glossy brown fur\";\n\nif ( $text =~\
  \ /(\\w+)\\s+had\\s+(\\w+)/ ) {\n    print(\"\\$1 = $1 \\$2 = $2\");\n}\n```\n\n\
  这个正则表达式获取 \"had\" 两边的两个单词。结果是：\n$1 = fox $2 = glossy\n\n两个 `\\w+` 外围的括号会导致两个 `\\\
  w+` 的内容分别捕获到内置变量 `$1` 和 `$2` 中。如果正则表达式更长且有更多括号对，每个左括号都会增加一个额外的捕获：到 `$3`、`$4` 等。括号可以嵌套，这意味着捕获可能会重叠。\n\
