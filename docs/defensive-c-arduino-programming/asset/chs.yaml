  \n在上述“参考文献 C++”部分介绍的《Defensive C++ Arduino Programming》详尽涵盖了基于硬件的调试。\n\n## 5. 参考文献\
  \ - 编程心理学\n\n《编程心理学》（The Psychology of Computer Programming），Gerald M. Weinberg，计算机科学系列，1971\
  \ 年。完全没有过时——我们大脑运作方式与 50 年前一样。\n\n《无我编程十诫》（The 10 Commandments of Egoless Programming）是对心理引发的误导尝试的简要回顾。参阅\
  \ [`blog.codinghorror.com/the-ten-commandments-of-egoless-programming`](https://blog.codinghorror.com/the-ten-commandments-of-egoless-programming)\
  \ 和一段视频（在 YouTube 上搜索 Dave Xiang）。\n\n马斯洛需求层次 - 在 Google 并在 YouTube 上搜索马斯洛需求层次或需求层次如何影响动机。\n\
  \n《Programmers at》，Susan Lammers，Tempus，1986 年。\n\n\n\n\n\n她从不畏惧卷起袖子，为人务实，并热衷于投入实践工作。她对飞行的热爱使她制造并驾驶了自己的自己的飞机（`RV8`）。她还自称拥有某些艺术天赋（这套双人书封面上的野猪和岩猴插画都是她的画作），曾当过演员（剧院戏剧），并且现在是一位充满热情的养蜂人。\n\
  \n她最近的电子领域尝试是一个基于 `Arduino` 的蜂箱重量系统，旨在帮助监测蜜蜂的健康状况（详细信息请见作者的书`Defensive C++ Arduino\
  \ Programming`——参见 Bibliography - C/C++ programming (page ٣٣٢)）。这个项目最初只是一个随手记下的草案，后来变成了一个完整的系统。随着项目的进展，从单个组件的概念验证到整个全面的集成系统，应用程序的文件增加到了\
  \ 35 多个（15,000 行代码）。她早期的开发相当缺乏规范且是增量式的，这导致她花费了太多时间在调试上——最初是一个令人愉快的消遣变成了痛苦的负担。于是，她退后一步，研究了程序员为什么会犯错。她发现自己需要采用良好的编程实践并使用更好的工具。这使她从\
  \ `Arduino IDE` 切换到 `AtmelStudio`，后来切换到 `Visual Studio/Visual Micro`，以深入审查 `C++`，创建处理特定任务的框架，重新学习适当的\
  \ `Awk` 和 `Perl` 以从源文件中提取文档，学习正则表达式，并承担其他实用的编程工作。\n\n这段经历促使她对涵盖的材料编写了详尽的笔记，以记录进度，因为文献和互联网缺乏针对已经会编写\
  \ `C++` 的业余程序员的资源。或者说，是材料太多了，而且其中大部分内容都不专业、啰嗦，且没有直接回答提出的问题。问一个简单的问题，却会得到冗长而复杂的回答。这些笔记逐渐演变成了两本书：`Pragmatic\
  \ C++ Arduino Programming`，这是一部帮助精通 `C++` 的 `Arduino` 程序员避开 `C++` 可能抛给他们的许多陷阱的参考著作；以及\
  \ `Defensive C++ Arduino Programming`，介绍了 `C++` 工具和框架，以提高程序员编写高效、健壮、可维护且紧凑的 `Arduino`\
  \ 应用的效率。\n\n她基于 `Arduino` 的蜂箱重量系统尚未完全完成。未来的工作将侧重于将她的项目交给一个开源软件团队、重新设计 `SMT` 技术的\
  \ `PCB`、实现替代通信方案以处理没有 `GSM` 信号偏远地区、开发基于 Web 和智能手机的友好用户界面等。这些计划是否会被实施尚待观察，因为她还有其他打算要做的项目。在她脑海中浮现的许多想法中，有一个设备用于探测在蜂箱前盘旋的亚洲胡蜂。她还计划通过蜜蜂发出的声音来解读蜂群活动。这些项目都是巨大的挑战——意味着需要学习并实现数字信号处理、数字图像处理和\
  \ `AI`。这些会让她在未来几年里一直忙碌。不用说，她从不无聊。除了养蜂人可能从她辛勤努力中获得的共同收益外，她持续的满足感来自于挑战和行动。\n\n## 蜂箱重量系统\n\
  \n`Beehive weighing system[AUX]蜂箱重量系统如何促使我写下这两本书`\n`Beehive weighing system[AUX]监测重量、温度、湿度；基于\
  \ RF 通信和 GSM 板`\n\n生活是一系列偶然邂会的集合，我的一个朋友（Charlie H.）向我介绍了养蜂，这是一项回报丰丰的活动。作为一个新手养蜂人，我的首要任务之一是通过手持秤监测蜂箱重量。这些信息对于评估蜜蜂的状况至关重要。\n\
  \n另一次偶然遇到（Daniel T.）向我介绍了 `Arduino`。生活似乎是由偶然邂逅决定的。无论如何，一旦我理解了用 `Arduino` 能做什么，我就问自己：为什么不自己动手制作一个基于\
  \ `Arduino` 的电子蜂箱重量系统呢？从表面上看，这个想法足够简单：从普通的浴室秤上拆下应变计，放入 `opAmps`（运算放大器）、电压调节器和其他几个小零件。再加上一个\
  \ `GSM` 板、一个无线电台和一个时钟，我就能在手机上获取蜂箱的重量、温度、湿度电池电压了。简单！没那么难！额，并不完全如此。\n\n简而言之：养蜂 + `Arduino`\
  \ + `C++` = 基于 `Arduino` 的电子蜂箱重量系统 = 挑战。我当时完全不知道自己不知道什么，也不知道要把这个项目变为现实需要多少大量的工作。在定义了如何从蜂箱获取数据以及如何将它们传输到手机后，我开始缓慢而痛苦地艰难进展。我严重低估了让该系统按我意愿运行所需的工作量和学习量。\n\
  \n我的电子知识仅限于欧姆定律，这个挑战证明是令人生畏的。由于已经退休，除了健身、维持社交关系和做一个守法公民外没什么事可做，这个项目很快变成了一份全职工作。我从不无聊。我必须快速学习晶体管、运算放大器和电压调节器。发现这个世界变得很有趣。让一个基于\
  \ `NPN/PNP` 晶体管的锁存电路工作并理解它为什么能工作，带给我极大的满足感。\n\n至于 `Arduino`，那是一个伟大的发现！微控制器和 `Arduino\
  \ IDE` 非常棒，而且几乎不花钱。我的热情立刻被点燃。我首先让面包板上的概念原型运行起来。我从一个电子浴室秤中拆出应变计，通过 `opAmp` 发送信号。无线通信基于\
  \ `XBee`。我选择了 `DS3231` 实时时钟来同步设备，以减少唤醒时间。一个 `A6 GSM` 板建立了与我手机之间的双向短信通信。\n\n### 蜂箱重量系统架构\n\
  \n随着我对自己使用的电子组件越来越精通，系统的特征从许多可能性中慢慢浮现出来：\n\n- **父子架构**：我选择了父子网络系统，而不是每个蜂箱模块独立报告。子节点位于蜂箱上。它们产生数据并发送给附近的父节点（协调器）。协调器收集蜂箱的数据并将信息发送到我的手机。\n\
  - **蜂箱重量系统[AUX]监测重量、温度、湿度；基于 RF 通信和 GSM 板**：协调器和蜂箱通过 RF 通信进行通信，蜂箱之间没有线缆。我选择了基于 `ZigBee`\
  \ 的系统（`XBee`）。\n- **仅电池供**：由于蜂箱位于偏远地区，需要电力自给，因此电池是必要的（`١٨٦５٠ LiIon`）。我拒绝使用太阳能板，因为它们太显眼，显然是有价值物品，极有可能被盗。\n\
  - **成本**：如果该系统要成为一种商业可行的产品，成本将是一个问题。\n- **易用性**：系统需要灵活性：何时称重、频率如何、获取数据以触发特定事件的通知等。\n\
  - **与外界交互**：我必须决定如何与系统交互（`Firefox`、`Lora`、`WiFi`、`蓝牙`、手机）。我选择了 `A٦ GSM` 板与手机通信，因为这似乎是最简单、最实用且最时的解决方案。\n\
  \n\n\n\n回首过去三年，我必须说，项目的电子部分确实很简单。然而，管理系统的 `C++` 程序证明比预期的要复杂得多。我不再处于 `.ino`  sketch\
  \ 图的思维中——即那种从大脑直接编程到计算机。最后统计，该应用程序不可阻挡地增长到了 35 个代码文件。我必须提高我的 `C++` 专业知识，开发新技术并改变我的思维——让我的工作专业化。\n\
  \n至于我的专业知识，我有 `C++` 经验。我仔细研读了 Kernighan 和 Ritchie 编写《C 语言程序》。接着，我又读了 Bjarne Stroustrup\
  \ 的《C++ 编程语言》。但我的经验已经生锈了。我仍然留着这些书的早期版本；我把它们视为收藏品。\n\n我通过各种手段逐渐改进并组织了我的编程：`C/C++`\
  \ 专业知识、良好的编程实践、框架以及更好的 IDE（`AtmelStudio`、`Visual Studio` + `Visual Micro`、`PlatformIO`）。这些帮助我实现了预期目标：生产力、应用程序的可维护性与健壮性、速度以及紧凑性。\n\
  \n我已经完成了基于 Arduino 的蜂箱称重系统的版本。下一阶段是在几个蜂箱上对其进行测试，并建立其抗天气能力。之后，如果我想将其转化为具有商业可行性的产品，我需要承担大量工作，整合更便宜的组件，使用更便宜的无线电模块，创建与其他世界的替代接口，并使用基于\
  \ `SMT` 的 PCB 来降低成本。\n\n## 现在该怎么办\n\n目前的蜂箱版本虽然可以运行，但仍存在一些小问题：\n\n*   `XBee` 无线模块太贵了（每个\
  \ 30.00 美）。目前的工作重点是使用 `BRF24L01` 模块。它们的价格每个不到 3 美。\n*   使用手机获取数据因为 `SMS` 信息的限制而变得不便，而且因为需要支付\
  \ `SIM` 卡费用而昂贵。\n*   需要整合一个友好的基于互联网的用户界面，用于数据可视化和任务任务调度。\n*   设想从通孔技术迁移到表面贴装技术 (`SMT`)。\n\
  \n一旦这些书出版，我将恢复对蜂箱称重系统的工作。\n\n## 索引表\n\n\n\n\n\n# 术语与技术栈索引\n\n## 编程语言与核心语法\n- `@array[]`:\
