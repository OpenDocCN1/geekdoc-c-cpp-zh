- "# C++ Arduino 防御性编程\n\n\n\n![](img/image_rsrcA2W.jpg)\n\n\n\n\n\nDelsol, Michèle\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# Arduino (版本 2) 功能\n\n* **名称补全**：已实现名称补全，但默认未启用，Arduino\
  \ 将称为 `Editor Quick Suggestions`（编辑器快速建议）。\n* **查找/替换支持正则表达式**：搜索支持正则表达式 - 它确实支持正则捕获。\n\
  * 它有一组很长的快捷键。在选中文本上切换注释的快捷键在法语键盘上可以工作。\n* **新输出窗口：串口绘图器 (serial plotter)**：它有一个新的输出窗口：串口绘图器\
  \ - 非常易于使用 -只需执行 `Serial.println(myVar)`。每当你对 `myVar` 进行打印时，它都会将 `myVar` 的值作为折线图放入串口绘图器。这比将值打印到串口监视器并复制/粘贴到\
  \ Excel 中可视化要好得多。\n\n## 负面影响\n\n* **打开速度慢**：IDE 打开缓慢 - 加载 V2 IDE 比旧版本慢得多（15 到 30\
  \ 秒，而 V1 需要 5 秒），这并不好。Visual Studio 需要 5 秒，AtmelStudio 需要 12 秒。确实有很大的改进空间。\n* **从串口监视器复制文本存在问题**：串口监视器复制问题。可以通过高亮显示从串口监视器中复制文本。遗憾是，在串口监视器中使用全选\
  \ (`ctrl-A`) 获取的是其上方的源代码，而不是监视器的内容。获取文本非常不可靠；我曾通过高亮整个串口监视器内容并执行 `ctrl-C`；但在粘贴时，我只得到了文本可见部分的内容。\n\
  * **编辑器窗口无法取消停靠 / 串口终端是固定的底部面板，而非独立窗口**：用户界面设计很僵化；我的意思是源代码编辑窗口应该是可以取消停靠或关闭的目前的设置是一个顶部工具栏，占据了\
  \ IDE 窗口的整个宽度。工作区左侧有两个垂直左侧面板，最左侧的一个包含 5 个图标，用于选择 5 个面板中的一个 - 这两个都是永久的，尽管人们偶尔非常需要它们。为什么不将这\
  \ 5 个图标放在顶部，并让面板作为临时面板在底部面板打开呢？\n* **加载代码到 ATmega328P-Xmini 时出错**：向 `ATmega328P-Xmini`\
  \ 上传时陷入无限循环 - 在 Arduino Uno 上调试无法工作，但这是正常的，因为 Uno 不支持硬件调试。然而，我尝试了 `ATmega328P-Xmini`，我确实让\
  \ Arduino V2 识别了板并完成了编译，但在尝试将可执行文件上传到板时，它进入了无限循环。关闭并重新加载 IDE 后，它询问我是否更新板。我回答了是。然后我继续编译/上传；结果为：\n\
  \n```\navrdude: ser_open(): can't open device \"\\\\.\\COM14\": Access is denied.\n\
  ```\n\n然而，对于 `com 14` 上的 Uno，`avrdude`访问访问。工具报告端口为 \"Com 14\"，板卡信息正确。这个调试板在 AtmelStudio\
  \ 中运行完美。\n\n在其他情况下，我得到了：\n\n```\nexec: \"C:\\Users\\agir\\AppData\\Local\\Arduino15\\\
  packages\\arduino\\tools\\avr-gcc\\7.3.0-atmel3.6.1-arduino5/bin/avr-g++\": file\
  \ does not exist\n\nCompilation error: exec: \"C:\\Users\\agir\\AppData\\Local\\\
  Arduino15\\packages\\arduino\\tools\\avr-gcc\\7.3.0-atmel3.6.1-arduino5/bin/avr-g++\"\
  : file does not exist\n```\n\n问题列表还层完没了。你大概明白意思，就是存在问题。\n\n* **重构似乎不再受支持**：重构功能消失了\
  \ - 重构在 V2.0 中存在过但无法正常工作。我在 2.1.1 版本中找不到它了。它似乎被 `Change all occurrences`（更改所有出现处）取代了，但这只是全部替换，无论在哪里。我得出的结论是不再有重构功能了。同样，曾有一个重命名功能，我再也找不到了。\n\
  * **C 风格 /*...*/ 注释折叠失效**：C 风格的 `/*...*/` 注释失效 - 版本 1.8.19 可以折叠 C 风格的 `/*...*/`\
  \ 注释。由于某些原因，版本 2 不。\n* **#ifdef…#endif 对可以折叠但函数无法折叠**：`#ifdef…#endif` 对可以折叠 - 在旧版本\
  \ (1.8.19) 中，#ifdef…#endif` 对不可折叠，导致寻找不平衡的对变得困难。在我看来，由于 Arduino IDE 使用闭合花括号折叠代码方面做得非常好，它应该更进一步，对\
  \ `#ifdef...#endif` 对也执行同样的操作。\n\n在新版本 (2.1.1) 中，`#ifdef…#endif` 对可以折叠，但函数和其他代码块无法折叠。\n\
  * **点击输出窗口中的编译错误无法直接跳转到文件**：编译错误 - IDE 不允许你通过点击错误直接进入源代码；你仍然需要手动到达。\n* **旧版本重大撤销\
  \ ctrl-Z 会搞乱代码；分段错误**：运行一段时间后，Arduino IDE 就会放弃，撤销 `ctrl-Z` 会搞乱代码；分段错误阻塞。\n* **相比版本\
  \ 1 有巨大进步，但还有长路要走**：关于 Arduino 2.1.1 有很多说的，但就目前而言，它弥补了与 AtmelStudio、Visual Studio/Visual\
  \ Micro 之间的差距，但还有很长的路要走。Arduino 团队应该逐步引入新功能，并希望解决列出的问题。我将在我正在的项目上测试 V2，并在未来的版本的书中进行报告。\n\
  \n## Arduino 的注意事项（旧版本 1.8.19）\n\n总体而言，Arduino IDE 是相当可靠的；但随着我的应用程序变大，编辑器会出现严重 Bug，需要重启。Arduino\
  \ IDE 1.8.19 有三个主要缺陷。我不知道 2.1.1 是否消除了这些，因为验证它们需要对中大型程序进行长时间的编程。\n\n\n\n\nAtmelStudio\
  \ (MicrochipStudio) 是一款免费的专业级 IDE；它是针对 AVR 和 SAM Atmel 微控制器的定制版 Visual Studio；这包含了在\
  \ Arduino 板板 (AVR) 上使用的那些芯片。Atmel 此后被 Microchip 收购，后者将其更命名为 MicrochipStudio；然而，我将继续将其称为\
  \ AtmelStudio，因为大多数 YouTube 文档和论坛讨论都是关于 AtmelStudio 的。在本书校对时（2023 年 5 月），最新版本为 2020\
  \ 7.0.2594。\n\nAtmelStudio 和 Arduino IDE 都有一个水平分为两部分的大型工作区：上方是源代码，下方是编译器、链接器和上传信息。它们还拥有包含菜单和图标的工具栏。相似之处仅此于此。AtmelStudio\
  \ 在智能、实用的程序员辅助方面表现出色，并且比 Arduino IDE 更健壮。不再有 `ctrl-Z` 撤销问题。不再有因分段错误导致的时间浪费和烦恼。公平起见，我应该提到\
  \ Arduino V2 可能已经解决了这些问题；验证这一点已在我的待办列表中。\n\nAtmelStudio 的安装大约需要 5 分钟。过程非常方便。由于我的大部分工作是在\
  \ Build 1391 中完成的，某些问题可能之后得到了修复，但它们仍列在 AtmelStudio 注意事项（第 62 页) 中供参考。尽管我尝试更新书中关于\
  \ AtmelStudio 的内容，但书中的信息与当前 Build 2594 或更高版本之间可能仍存在差异。\n\n## 为什么在你的 Arduino 项目中采用它\n\
  \nAtmelStudio 能够提高生产力，减轻程序员压力，并帮助构建健壮的代码。它的学习曲线非常平缓；对程序员极其友好；并且具有许多智能生产力功能。它会显示编程错误，你可以点击错误即可跳转到故障行。此外，它还具有强大的查找/替换机制，并支持正则表达式。AtmelStudio\
  \ 的特性在 编辑器功能（第 49 页） 中有所描述。\n\n使用 AtmelStudio 导入 Arduino 项目轻而易举。如果你将工作限制在 Arduino\
  \ 上，它是无与伦比的。不过，它确实有几个细小的缺点：它没有像 Arduino IDE 那样的集成串口监器；而且没有上传功能——你必须自己创建一个（简单但需要完成——详见\
  \ 缺失功能第 39 页）。尽管如此，Visual Micro（第 84 页）](part0016.xhtml_a8G3) 插件添加了这些缺失的功能，外 串口调试（第\
  \ 125 页）。\n\n如果你选择采用 AtmelStudio，请注意它需要 Arduino 库；这就是为什么无论你是否使用 Arduino IDE 编程，都需要下载/安装\
  \ Arduino 发行版（第 31 页)。\n\n我很容易地使用 AtmelStudio 完成了导入、编译/链接和上传 Sketch。然而，在使用 Arduino\
  \ IDE 之后，我发现 AtmelStudio 令我望畏——工具栏上有许多图标，其中许多非常神秘，窗口多得可见，而且词汇也证明相当令人困惑（solution、project、task、build、rebuild、clean）。但过了一段时间后，我发现我只使用了几个。我不使用的那些仍然在那里，我只是忽略它们即可。\n\
  \n当我深入研究 AtmelStudio 时，我发现了一些让生活比使用 Arduino IDE 更容易的功能。得益于它的编程辅助，我的效率大大提高。此外，它更健壮：我免于\
  \ Arduino IDE 的分段错误，以及撤销（`ctrl-Z`）可能造成的混乱(Arduino 注意事项（旧版本 1.8.19）第 36 页)。\n\n促我采用\
  \ AtmelStudio 的重要功能之一是它提供了基于硬件的调试（参见 Arduino 注意事项第 120 页)。\n\n\n\n\n## 互操作性\n在 AtmelStudio、Visual\
  \ Studio、PlatformIO 和 Arduino IDE 之间无缝切换。目标是在 `AtmelStudio` 和 Arduino IDE 之间无缝切换，以便处理同一组源文件。在这两个\
  \ IDE 之间实现互操作性证明是意想不到地简单，但存在一些限制。\n\n## AtmelStudio (编辑器)\n内联任务提供了多选文本框，用于重命名、创建、声明等。这是\
  \ AtmelStudio 的擅长之处。它将程序员的效率比 Arduino IDE 提升了几个数量级。\n\n## 代码大小\nAtmelStudio 的代码大小默认比大出\
  \ 40%，需要 `-flto` 标志。代码大小取决于 `-flto` 标志；后可减少 40%。AtmelStudio（注意事项）代码大小默认大出 40%，需要\
  \ `-flto` 标志，这是一个重要问题。由于 AtmelStudio、Arduino IDE 和 PlatformIO 这三个环境都使用 GNU 编译器，代码大小应该独立于你所使用的工具。我在一个小型应用程序上运行了测试；Arduino\
  \ IDE 和 PlatformIO 产生了等量的 RAM 代码大小；然而 AtmelStudio 产生的代码大小要大得多。只需包含 `-flto` 编译器选项即可将其降低到与其他\
  \ IDE 相同的水平。然而，在闪存内存的使用方面存在显著差异。\n\n## 硬件调试\n这是 AtmelStudio 擅长的领域。只需插上 `ATmega328P-Xmini`\
  \ 并进行构建（上传是自动的）。在你的代码中设置断点并运行应用程序。当程序因断点而停止时，查看变量，如有需要，更改它们的值。一个调试可能的世界就此开启了。\n\n\
  # AtmelStudio 注意事项\nAtmelStudio 与所有工具一样，也有缺陷、错误和不完善之处。你会发现一些，其中有些比其他的更严重。我是使用 Build\
  \ 1391 发现这些问题的。有些可能在 Build 2594 中被修复了；我没有检查哪些 Bug 仍然存在。\n\n## AtmelStudio (文档)\n\
  Atmel (Microchip) 网站有两个内联文档包：入门指南和视频。文档 - Atmel (Microchip) 提到了两个内联文档包：使用 AtmelStudio\
  \ 入门和 AtmelStudio 文档视频教程。\n\n如果你要为 Arduino 编写大型 C/C++ 程序，你应该使用 AtmelStudio、Visual\
  \ Studio 或 PlatformIO。我更倾向于使用 `AtmelStudio + Visual Micro` 或 `Visual Studio + Visual\
  \ Micro`。它们可以提高你的效率，让编程变得舒适得多。它们所谓的陡峭学习曲线是阻碍程序员采用它们的唯一因素——这很遗憾。根据我使用 AtmelStudio\
  \ 的经验，我证实其学习曲线非常平缓，且导入 Arduino 项目极其简单。单单这两个因素就使其成为一个极佳的选择。锦上添花的是，AtmelStudio 支持硬件调试；我用\
  \ `ATmega328P Xplained Mini` 板板对其进行了测试，效果非常出色。\n\n所以，卷起袖子，开始使用 AtmelStudio 以及 Visual\
  \ Studio + Visual Micro 吧。\n\n## 1. 缺失的功能\n\n### Visual Micro\n三个相同的 Arduino 插件：分别用于\
  \ AtmelStudio 和 Visual Studio (2019 和 2022)。AtmelStudio (通用) Visual Micro 弥补了 AtmelStudio\
  \ 缺失的功能：上传工具、串口监视器、串口调试。AtmelStudio 缺少 Arduino IDE 提供的几个功能，即：上传工具和串口监视器。这迫使程序员创建一个外部工具将代码上传到微控制器，并使用外部串口监视器来可视化程序输出。这些缺失的功能可以通过在\
  \ AtmelStudio 中整合 `Visual Micro` 插件来提供（注意 Visual Studio 也有相同的插件）。\n\n## 2. 目录管理\n\
  \n### AtmelStudio (文件管理)\n区分项目（Project，单独管理）和解决方案（Solution，作为项目组管理）。理解 AtmelStudio\
  \ 项目目录的关键在于了解项目和解决方案之间的区别。在创建新项目时，AtmelStudio 会打开一个包含三个字段的文本框：名称、位置和解决方案名称。\n\n\
  *   **Name (名称)**：这是项目的名称。你应该将项目命名为与你导入的 Arduino sketch 相同的名称，但不需要 `.ino` 扩展名。\n\
  *   **Location (位置)**：存放所有 Arduino 项目的根目录。该目录必须已经存在，不会被创建。我使用一个名为 `AtmelDev` 的目录。\n\
  *   **Solution name (解决方案名称)**：如果你想将项目分组到一个文件夹中，为你导入的项目指定一个唯一的解决方案名称。你可能想根据所属的类别对项目进行分组。例如，在我的蜂箱系统中，我有几个类别：框架、设备\
  \ (GSM, DS3231...)、应用领域 (蜂箱、黄蜂等)。\n\n在为项目命名时，会出现两种情况。假设你有两个 Arduino sketch：`MemMgt.ino`\
  \ 和 `DataGroup.ino`。\n\n*   **Scenario 1 (场景 1)**：项目未分组到解决方案中。另一种说法是每个项目都有自己的解决方案，因此解决方案名称和项目名称相同。这是你将得到的目录结构：\n\
  ```\nAtmelDev\nMemMgt solution\n  ArduinoCore\nMemMgt project\nDataGroup solution\n\
  \  ArduinoCore\nDataGroup project\n```\n\n*   **Scenario 2 (场景 2)**：（多个项目，一个解决方案）你决定将项目分组到一个名为\
  \ `Frameworks` 的解决方案中——为了实现这一点，点击 `Create Project from Arduino Sketch` 复选框。这是你得到的目录结构：\n\
  ```\nAtmelDev\nFrameworks solution\n  ArduinoCore\nMemMgt project\nDataGroup project\n\
  ```\n\n第二种情况要清晰得多，但它阻止了与 PlatformIO 的互操作性。一个项目一个解决方案的方案（上述第一种）更为优，因为它开启了与 PlatformIO\
  \ 的互操作性。\n\n## 3. 导入 Arduino 项目 (AtmelStudio)\n\n### AtmelStudio (互操作性)\nAtmelStudio\
  \ 提供了 `Create project from Arduino sketch` 选项。选择此选项时，将创建编译/链接 Arduino sketch 所需的基础，包括预编译库。请谨慎操作，通过对\
  \ AtmelStudio 进行实验，你将理解项目和解决方案之间的区别。这些决定了目录结构。\n\n\n\n\n\n当使用 `AtmelStudio` 导入 Arduino\
  \ 项目时，会创建一个双目录结构：根目录（`MyProject` 目录）包含一些 AtmelStudio 文件，以及一个源代码子目录（`MyProject` 子目录），其中包含\
  \ `.ino` 文件以及 `.h`/`.cpp` 文件。如果你想通过 `Visual Micro` 扩展 `AtmelStudio` 以获取串口监视器、嵌入式上传和串口调试，你需要采用传统的单目录结构。带有\
  \ `Visual Micro` 的 `AtmelStudio` 直接在上述子目录下工作。带有 `Visual Micro` 的 `Visual Studio`\
  \ 工作方式也是相同的（Visual Studio 页面第 79 页）。\n\n非 Visual Micro 的 `AtmelStudio` Arduino 导入将创建如下目录结构，其中\
  \ `MySketch` 为导入的 Arduino IDE 项目名称。`AtmelDev`是我定义的一个方便目录，用于分组所有 AtmelStudio Arduino\
  \ 工作。\n\n```\nAtmelDev\n...\nMySketch\n\nArduinoCore\n\nMySketch\n...\n```\n\n主\
  \ `MySketch` 目录包含 `ArduinoCore` 子目录（AtmelStudio Arduino 核心构建）。`MySketch` 子目录包含 `Sketch.cpp`\
  \ 文件（`.ino` 的等效文件）。在完成 Arduino 程序的 `AtmelStudio` 导入后，你需要将所有 `.h`/`.cpp` 文件从原始 Arduino\
  \ IDE 目录复制/粘贴到 `AtmelStudio` 的源代码子目录中，然后通过 `AtmelStudio` 的“视图 --> 解决方案管理器”窗口将其加载到\
  \ `AtmelStudio` 项目中。`AtmelStudio` 不会自动将文件添加到项目中。它们必须显式地添加到项目中，这样 `.h`/`.cpp` 文件物理上位于源代码目录中，并且在构建时会被包含。在将\
  \ `.h`/`.cpp` 文件复制到源代码目录后，你还需要处理其他几个细节才能将程序上传到微控制器中。\n\n### 关于将 Arduino Sketch 导入到\
  \ `AtmelStudio` 的详情分组在以下章节中：\n\n*   **AtmelStudio（文件管理）** 区分项目（单独管理）与解决方案（作为项目组管理）管理目录\
  \ (第 39 页) - 了解 `AtmelStudio` 在导入 Arduino Sketch 时如何处理项目目录至关重要。项目是单独管理的（项目），也可以作为一组（解决方案）管理。\n\
  \n*   **互操作性 AtmelStudio 导入无忧忧** 导入 Sketch 很容易，但有一些细微之处——请继续阅读。参见导入 Arduino 项目 (AtmelStudio)\
  \ (第 40 页)。\n\n*   **AtmelStudio（构建）使用 Visual Micro 无需外部上传工具** / **AtmelStudio（互操作性）需要外部上传\
  \ `avrdude` 工具** / **avrdude 在 AtmelStudio 需要外部自定义 `avrdude` 上传工具，但 Visual Micro\
  \ 不需要** - 上传代码：与 Arduino IDE 不同，可执行文件的上传是由外部命令处理的，该命令需要被创建（`AtmelStudio` 将其称为“工具”）。这是通过复制、修改并粘贴\
  \ Arduino IDE 的 `avrdude` 命令来创建外部工具实现的。参见将代码上传到微控制器（创建外部工具） (第 44 页)。\n\n*   **AtmelStudio（编辑器）Arduino\
  \ 视器显示输出** 与 Arduino 应用交互 (第 48 页) - `AtmelStudio` 不提供像 Arduino IDE 那样的串口监视器。需要外部监视器。打开\
