  \n    ```\n*   PlatformIO 的命令行是：\n    ```\n    -c -fno-exceptions -fno-threadsafe-statics\
  \ -std=gnu++11 -fpermissive -w -v -Os -Wall\n    -ffunction-sections -fdata-sections\
  \ -flto -mmcu=avr6\n    -specs=device-atmega2560\n    -DF_CPU=16000000L\n    -DARDUINO_AVR_MEGA2560\n\
  \    -DARDUINO_ARCH_AVR\n    ```\n\n\n\n\n# DOS 盒\n\n## 用于文本界面程序的 Windows DOS 盒\n\
  \n如今 PC 用户通过图形用户界面 (GUI) 与计算机交互。几乎所有的应用程序，无论是 Word、Excel、会计程序等，都是基于 GUI 的。屏幕上充满了图标、图形工具栏、图像和符号。情况并非一直如此。在第一代\
  \ PC 时代（IBM PC、Apple II、Atari...），界面是基于文本的。它相当枯燥，没有精美的图形。你只需要在控制台的命令行提示符后输入应用程序的名称和选项。应用程序被加载，PC\
  \ 运行了一会儿。最后，屏幕显示输出或将输出写入文本文件。诸如 `Awk`、`Perl`、`avrdude`、`GNU C/C++ toolchain` 等熟悉的工具都是基于命令行的。如果你计划使用任何这些工具进行工作，你将需要在\
  \ DOS 盒（又称命令框 - `cmd.exe` - 旧 PC 文本屏幕界面）中进行。因此，请继续阅读。以下是关于 DOS 盒的快速课程。\n\n*   **什么是“盒”**\
  \ 回溯了桌面电脑的历史，解释了 DOS 盒是如何产生的（下一节）。\n*   **启动 DOS 盒** 解释了如何让 DOS 盒运行。查看 启动 DOS 盒\
  \ (第 238 页)。\n*   **DOS 命令** - DOS 有自己的 shell，即类似于 Unix 一样的命令行语言（Bourne shell、Korn\
  \ shell）。它们为用户提供了执行各种任务的命令。本节列出了更常见的 DOS 命令 (第 ٢٤٠ 页)。\n*   **批处理文件** 是带有 `.bat`\
  \ 扩展名的普通文本文件。它们封装了 DOS 命令，以便它们可以作为一个单元启动，而不是按顺序逐输入。将你的命令放在批处理文件中，并像运行任何可执行文件一样运行它们。查看\
  \ DOS 批处理文件 (第 241 页)。\n*   **你应该了解的其他信息** 揭示了未记录的 DOS 命令小知识。查看 DOS 盒 - 其他信息 (第\
  \ 242 页)。\n\n## 1. DOS 盒 - 它是什么？\n\n微软为 IBM 个人电脑创建了 DOS 操作系统。文本用户界面（旧 Unix 类型控制台）。\n\
  \nIBM 个人电脑 (1981) 是我们目前基于 Windows 的笔记本电脑和桌面电脑的祖先。它立即获得了成功，因为它基于 16 位，是第一台具有足够容量成为真正业务计算机的桌面电脑。它可以运行会计程序。它的性能是对手\
  \ Apple II（基于 8 位的计算机）的倍。界面是一个文本屏幕，显示 80 列 40 行固定大小的字母。操作系统命名为 `MS-DOS`，是 Microsoft\
  \ Disk Operating System 的缩写，称为 `DOS`。程序以类似于 Unix 终端的命令行文本的形式调用。输出是到控制台或文件的纯文本。\n\
  \n比尔·盖斯与 IBM 签署了一份合同，`DOS` 将以版税的基础上安装在 IBM PC 上。当时，IBM 对制造桌面 PC 不感兴趣。它将 PC 设计为其大型主机的智能终端。IBM\
  \ 的第一个大错误是没有预见到小型桌面电脑将变得如此无处不在。它的第二个大错误是没有意识到软件市场最终将比硬件市场（大型机）大得多。这两个错误部分解释了微软的巨大成功。事后诸葛亮地说“我早就告诉过你”很容易。在当时，情况完全不透明。在类似的规模上，谁能预测到最初开发用于科学社区文件交换工具的互联网将产生深远的影响？智能智能手机和\
  \ Facebook 又是呢？\n\n面对新收购的 IBM/微软所确立的领先地位，苹果在 1983 年引入了基于图形用户界面 (GUI) 的 Apple Lisa，作为回击，这是一次商业上的失败，随后是获得巨大成功的\
  \ MacIntosh (the Mac-1984)。到那时，IBM PC 是一台以业务为导向的计算机，即执行大量数字计算的应用程序。Mac 在研究、大学和其他需要图形用户界面的领域拥有了更多受众。微软于\
  \ 1985 年推出了 Interface Manager 1.0 作为回应，后来重命名为 `Windows 1.0`。直到 `Windows 3.0` (1990)，带有\
  \ GUI 界面的 IBM PC 才获得了更广泛的接受。\n\n简而言之，1990 年基于 Windows 的 PC 必须兼容 8 年以上的文本应用程序。因此，微软包含了一个可以运行这些程序的\
  \ Windows 实用：DOS 盒。当启动 DOS 盒时，它会打开一个类似于旧 IBM-PC 屏幕的窗口。它支持旧的 DOS 命令等。一类实用的基于命令行的\
  \ Unix 工具如移植到 DOS 的 `Awk` 和 `Perl`、`avrdude`、`GNU C/C++ toolchain` 要求在 DOS 盒中运行。\n\
  \n## 2. DOS 盒启动\n\n`cmd.exe` (DOS 盒) 从屏幕、工具栏图标或运行菜单项启动。DOS 盒位于 `c:\\Windows\\System32\\\
  cmd.exe`。\n\n简而言之，1990 年基于 Windows 的 PC 必须兼容 8 年以上的文本应用程序。因此，微软包含了一个可以运行这些程序的 Windows\
  \ 实用：DOS 盒。当启动 DOS 盒时，它会打开一个类似于旧 IBM-PC 屏幕的窗口。它支持旧的 DOS 命令等。一类实用的基于命令行的 Unix 工具如移植到\
  \ DOS 的 `Awk` 和 `Perl`、`avrdude`、`GNU C/C++ toolchain` 要求在 DOS 盒中运行。\n\n\n\n\n#\
  \ DOS 命令\n\n## 使用 CD 命令导航到其他目录\n在理解了命令提示符含义后，下一个任务是能够通过输入 `CD something`（change\
  \ directory 的缩写）导航到其他目录，但首先，输入 `HELP CD`（即 `CHDIR`）。它将返回关于使用更改目录命令的帮助信息。如果你想让当前目录变为\
  \ `D:\\AtmelDev\\framework`，你可以输入：\n\n```\nCD D:\\AtmelDev\\framework\n```\n\n幸运的是，有一种更短的方法，涉及到相对文件路径。与其输入上述内容，假设你处于\
  \ `D:\\AtmelDev\\Awk>`，请执行：\n\n```\nCD ..\\framework\n```\n\n## .. 返回上一级目录，.\\ 从当前目录继续\n\
  你的意思是：返回上一级目录并那里进入 framework。`..\\` 表示后退一个目录级。另一个快捷方式是：`.\\` 表示从当前目录。你也可以不带目标地使用\
  \ `CD` 命令进行导航。执行 `CD ..` 会带你进入层级结构上一级的 `D:\\AtmelDev`。再次执行 `CD ..` 会带你进入 `D:.`。第三次执行\
  \ `CD ..` 则没有任何作用，因为你已经处于磁盘根目录。\n\n关于 `CD` 命令的最后一点：如果你的目标是另一个磁盘，在执行 `CD something`\
  \ 时使用 `/D` 选项。如果不这样做，命令将被忽略，且没有提示。你也可以通过输入 `'C:'` 来切换磁盘；你的新提示符将变为 `C:> `。\n\n现在你理解了文件路径、如何上下导航目录以及如何在不同磁盘之间切换，你需要知道如何调用应用程序。当你在提示符后输入某些内容时，如果系统不认为其为\
  \ DOS 命令，系统将在系统中搜索同名的可执行文件，即具有 `.exe`、`.com` 或 `.bat` 扩展的文件。从实践角度，你不需要理解 `.exe`\
  \ 和 `.com` 文件之间的区别，只需假设它们是相同的。不过，你会创建自己的文本可执行文件（`.bat` - 批处理文件）。这些将在下文中进一步描述。（至少对我来说）：\n\
  \n```\nDNS server not authoritative for zone.\n```\n\n尝试一下：在 DOS 框中输入 `PATH`，它将返回一个长长的\
  \ `PATHS` 列表，定义了 Windows 在何处查找可执行文件。给你的一个建议：`PATH` 是系统命令 - 不要对其进行实验，因为错误可能会不可逆转地破坏你的系统。输入\
  \ `foo` 后，如果 Windows 根据上述的 `PATH` 环境变量机制找到了它，则会启动 `foo` 并执行其设计的任何功能。\n\n## 基础集：CD,\
  \ DIR, DEL, EXIT, MKDIR, COPY, XCOPY, PAUSE, ECHO, REM\n现在你已经了如何使用 DOS 框，应该通过一组基础\
  \ DOS 命令来丰富你的知识。以下列表是一个很好的起点：\n\n*   `CD`，上文已详述，用于在目录树和磁盘之间上下导航。\n*   `DIR` 列出当前目录及其子目录中的文件。输出取决于使用的选项。\n\
  *   `DEL` 删除选定的文件。小心，该命令接受通配符。如果你输入 `del*`，它将删除当前目录中的所有内容，包括子目录。\n*   `EXIT` 关闭\
  \ DOS 框。\n*   `MD` 和 `MKDIR` 创建目录。\n*   `COPY` 将内容从一个文件路径/文件名复制到另一个文件路径/文件名。\n*\
  \   `XCOPY` 是 `COPY` 的扩展版本。我用它来备份时间戳已变化的选目录的文件。`XCOPY` 的选项之一是 `/D` 选项 - 复制比目标文件新的文件。我在一个小批处理文件中使用此功能将关键文件备份到外部硬盘。它效果极佳。\n\
  *   `PAUSE` 中断处理。输入任意字母继续。这对于在屏幕输出滚动出视线之前查看输出有用。它用于下文描述的批处理文件。\n*   `ECHO` 和 `REM`（注释）用于在批处理文件执行时在\
  \ DOS 框中显示消息。与 `pause` 结合使用时，监控程序流可能有用。\n*   **:: 批处理文件的未文档注释**：`::` - 大多数程序都有包含注释的方法，C\
  \ 语言用 `/*...*/`，C++ 用 `//`，Awk 和 Perl 用 `#`。DOS 批处理文件在行开头使用未文档的 `::` 来指示它是一个注释。DOS\
  \ 不对其进行任何操作，它会忽略它。这使得记录批处理文件的内容变得可能。\n*   **管理批处理文件执行：START, TIMEOUT**：`START` 在新的\
  \ DOS 框中启动程序。`TIMEOUT /t 10` - 在继续之前停止 10 秒。这在批处理文件内部连续运行多个程序时是必要的。它让程序在另一个程序启动之前完成。\n\
  \n## 批处理文件\n批处理文件是用记事本创建的普通文本文件；扩展名必须为 `.bat`。在 Windows 资源管理器中双击批处理文件，Windows 将打开\
  \ DOS 框并启动它；其中包含的 DOS 命令将被执行。当命令很长时，批处理文件特别有用。\n\n如果你是 DOS 框和批处理文件的新手，尝试一下：\n\n\
  *   打开记事本并创建一个文件 `DOStest.bat`。\n*   在你创建的 `DOStest.bat` 中插入以下行：\n\n```\n:: 使用批处理文件的示例\n\
  :: REM 显示消息\nREM 你启动了批处理文件\n:: PAUSE 中断批处理文件的处理\nPAUSE\nREM 继续处理批处理文件\nPAUSE\nREM\
  \ 完成批处理文件；之后 DOS 框将关闭\nPAUSE\n```\n*   进行实验。\n\n与其输入冗长的 `Awk` 或 Perl 命令行，在批处理文件中编写完整的命令并如上所示启动批处理文件要简单得多。在下面的示例中，通过输入文件名及其所需的任何参数来启动名为\
  \ `GenerateTypes.bat` 的批处理文件。\n\n```\nGenerateTypes ..\\Personnel.h\n```\n\n## 批处理文件示例\n\
  上述命令启动了 `GenerateTypes.bat` 批处理文件：`GenerateTypes.bat` 文件包含：\n\n```\n:: 使用 Awk 程序\
  \ GenerateTypes.awk\nECHO GenerateTypes.bat BEGIN\nAwk -f GenerateTypes.awk %1 >\
  \ Types.txt\nECHO GenerateTypes.bat END\nPAUSE\nEXIT\n```\n\n注意上述：\n\n*   `::` 表示这是一个注释；它在\
  \ DOS `HELP` 中没有文档。\n*   `ECHO` 在 DOS 框中打印消息。\n*   `Awk` 是被调用的程序名称及其参数。\n*   可以接受如\
  \ `%1`、`%2` 等参数。%1 是批处理文件参数，在这种情况下只有一个；否则你会使用 `%2`、`%3` 等。在上面的示例中，它将包含要处理的文件的完整或相对路径。\n\
  \n\n\n\n\n* `DOS 批处理文件[AUX]显示输出或重定向到文件 (> 和 >>)` 意味着将输出重定向到 `Types.txt` 或使用 `>>`\
  \ 追加到 `Types.txt`。它可以作为第二个参数 `%2` 传递，而不是在批处理文件中硬编码，例如 `%1`、`%2` 等。\n* `DOS 批处理文件[AUX]PAUSE\
  \ 中断处理，EXIT 和 ctrl-C 关闭 DOS 框` `PAUSE` 顾如其名，中断批处理文件的处理。它让你留出时间查看结果。按任意键将恢复批处理文件的处理。\n\
  * `EXIT` 意味着关闭 DOS 框。如果你想在到达命令列表末尾之前停止处理，此命令非常有用。\n\n以上是一个简单的批处理文件。由于批处理文件可以调用其他批处理文件，你可以构建自顶而下的工作会层级结构。请注意，DOS\
  \ 命令已大写；这是我的个人习惯，因为 DOS 对大小写不敏感。\n\n## DOS 框 - 其他信息\n\n### DOS 框详情\n`DOS 框[AUX]你应当熟悉的其他细节`\
  \ 你将在下方找到关于使用 DOS 框的应当熟悉的其他细节：\n\n* `DOS 批处理文件[AUX]PAUSE 中断处理，EXIT 和 ctrl-C 关闭 DOS\
  \ 框` 关闭框 - 使用 `ctrl-C`、点击右上角的 `X`、从左上角的图标菜单中选择关闭，或发送 `EXIT` 命令。\n* `DOS 框[AUX]与其他应用程序交互的复制/粘贴`\
  \ `复制/粘贴` - Windows 工作区和 DOS 框使用相同的缓冲区。你可以将 DOS 框中的任何内容复制到 DOS 框之外的任何地方，反之亦然。你也可以在输入命令行时将缓冲区内容复制到命令行，但要小心，目标是\
  \ DOS 光标，一个微小的闪烁的水平矩形。它不是鼠标光标所在的位置。你必须使用左右方向键在正在输入的命令行上来回移动此光标。\n* `DOS 框[AUX]顽固的应用程序？任务管理器\
  \ (ctrl+alt+del)` 停止顽固的应用程序 - 当屏幕变暗且出现 `cmd.exe` 未响应时，打开 `TaskManager` (`CTRL+ALT+DEL`)，在运行进程中寻找\
  \ `cmd.exe` 并停止该进程。这应该关闭 DOS 框。\n* `重定向输出` 从 DOS 框启动的程序通常将结果输出在框屏幕内。你可以将其重定向到所需的文件。要做到这一点，在你的命令末尾加上\
  \ `> MyFile.txt`（或 `>>`）。`>` 将替换目标文件中的任何内容为你的程序的输出；`>>` 将将输出追加到目标文件的末尾。\n\n## 框架（附录）\n\
  \n`框架[AUX]三种类型的框架：组织、数据处理、专门化` 本附录提供了关于书中介绍的框架的额外信息。框架被分为三类：\n\n* 组织框架（下一节）或如何构建应用程序。它包括`项目文件框架`、`程序文档框架`和`函数创建框架`。\n\
  * `数据处理框架(附录)`（第 253 页）或如何高效使用数据。它包括`数据包框架`、格式驱动的浮点字节转换、`DataGroup`、`位域存储框架`以及`事件存储框架`。\n\
  * `专门化框架(附录)`（第 272 页）或如何处理特定任务。包括`算法测试框架`、`类与函数名引用框架`、`链表框架`、内存管理、伪异常处理、错误报告以及`通用调试宏`。\n\
  \n## 组织框架（附录）\n\n`组织框架[AUX]三个框架帮助构建你的文件和源代码结构` 这些框架有助于构建应用程序（组织源代码）。它有助于提高程序师的生产力。你将在下方找到关于以下内容的额外信息：\n\
  \n* `项目文件框架`（下一节） - 如何避免重复包含头文件以及如何组织项目文件。\n* `程序文档框架(附录)`（第 244 页） - 该框架提出了一个 Perl\
  \ 程序来从源代码中提取文档。\n* `函数创建框架(附录)`（第 249 页） - 创建函数时，建议从复制/粘贴一个完整的函数模板骨架开始。\n\n## 项目文件框架（附录）\n\
  \n`组织框架[AUX]项目文件框架 - 组织你的项目文件` `项目文件框架[AUX]常识决定了如何组织应用程序的源代码` 正如项目文件框架（第 152 页）正文所述，组织应用程序源代码的常识和实际规则使应用程序更健壮，源代码更具可读性，并提高了程序师的生产力。本章涵盖了与项目文件组织相关的细节。\n\
  \n* `头文件 (.h)[AUX]#ifndef 防止多次包含 .h 文件` 避免多次包含 `.h` 文件是通过将头文件（`.h`）封装在 `#ifndef`\
  \ 中实现的，因此：\n```cpp\n#ifndef HEADER_H\n#define HEADER_H\n...\n#endif\n```\n* `项目文件框架[AUX]Globals.h/cpp\
  \ 包含和全局变量` `.h/cpp` 中需要包含的两个主文件是 `Arduino.h` 和 `Globals.h`。`Arduino.h` 应该位于 `Globals.h`\
  \ 顶部，以便项目文件访问其内容。将头文件的包含组织在一个主 `Globals.h` 文件中。它是所有 `.h` 文件包含的枢纽。它的结构是：\n```cpp\n\
  #ifndef GLOBALS_H\n#define GLOBALS_H\n#include <Arduino.h>\n#include \"Macros.h\"\
  \n...\n全局定义\n...\n#include \"HelperFunctions.h\"\n#include \"Functions.h\"\n#include\
  \ \"FunctionsSK.h\"\n#include \"BasicClass.h\"\n...\n#include \"Atest.h\"\n#include\
  \ \"Aardv.h\"\n#endif // GLOBALS_H\n```\n`项目文件框架[AUX]避免 .h 文件之间的依赖关系` `头文件 (.h)[AUX]Globals.h\
  \ 包含 Arduino.h 和 Macros.h，Macros.h 中 #include <Arduino.h>` 注意上方，`Arduino.h` 和 `Macros.h`\
  \ 位于 `Globals.h` 的顶部，而应用程序的头文件包含在底部。这是因为 `Globals.h` 的主体可能需要 `Arduino.h` 和 `Macros.h`\
  \ 定义的内容。\n\n* `项目文件框架[AUX]避免 .h 文件之间的依赖关系` `头文件 (.h)[AUX]尊重头文件依赖关系（自顶而下）并警惕相互依赖`\
  \ 小心处理依赖，即依赖其他内容的内容。应用程序头文件的包含顺序必须考虑这些因素。如果特定的头文件使用了另一个头文件中定义的项，则另一个头文件在前。必须避免相互依赖的\
  \ `.h` 文件。如果两个头文件相互依赖（相互依赖），你就有问题了。如果 `ClassABC.h` 包含了 `ClassXYZ.h` 定义的项反之亦然，则必须重新编写应用程序，以产生自顶而下的依赖，而不是横向依赖。\n\
  \n\n\n\n\n# 组织框架：程序文档框架 - 为你的代码编写\n\n程序文档框架从插入注释开始，并将它们组织成模板（填空空白）。\n\n程序文档的基础第一步（在考虑设计阶段编写的正式文档之前）是在编写代码时插入注释。最好的做法是从创建函数之初就开始这么做。这可以通过注释模板来实现，为文件、类、函数和程序流各准备一个模板。\n\
  \n在为新类创建文件组（`.h/.cpp` 文件）时，从骨架项目中复制一个文件模板并开始描述该文件的内容。在头文件（`.h` 文件）中进行此操作。在你完成对文件的文档记录后，在同一个\
  \ `.h` 文件中对类进行文档记录，其方法与文件文档相同，只是类模板的名称不同。对于 `.cpp` 文件中定义的函数和方法，复制/粘贴函数模板，相应地修改名称，并填充特定于函数的注释：描述、参数、错误检查和返回值。在\
  \ `.cpp` 文件中执行此操作。使用这些模板并在编写代码之前尽可能对它们进行文档记录，有一个重要的副作用：澄清思路，从而缩短整体开发时间。准则应该是：从一开始就为你的文件和函数编写文档。\n\
  \n## 程序文档框架：通过 Awk/Perl 正则的注释提取创建程序文档\n\nAardvark 注释提取示例。在通过插入适当注释完成文件文档记录后，就可以提取这些注释来创建程序文档。`Awk`\
  \ 和 `Perl` 两个工具允许创建一个程序，通过基于正则表达式的规则选择性地提取文本。它依赖关键词短语来提取文档并将其重定向到输出文件中。\n\n以下说明了文件级文档。它取自我的\
  \ `Aardvark.h` 头文件，其中包含了描述文件内容的注释。\n\n```cpp\n// PROGRAM FILES START\n\n// Traditional\
  \ Arduino IDE 程序具有 setup() 和 loop() 函数。\n\n// 由于 loop() 未被使用，程序在 setup() 中开始并结束\n\
  \n// IDE 之间的互操作性通过将原始 .ino 文件 setup 中的代码\n// 传输到 Aardvark（位于 Aardvark.h/.cpp 中）来实现。\n\
  \n// setup() 保持不变，不需要修改 IDE 的入口文件。\n\n// 修改在 Aardvark 中进行，它是独立于 IDE 的。\n\n// PROGRAM\
  \ FILES END\n```\n\n## 类和文件文档模板存储类和文件信息\n\n在上面，文件文档封装在模板中，其中包含 `START/END` 关键字，用于由正则表达式激活/禁用提取过程。这些关键词将\
  \ Perl 变量 `OKtoPrint` 设置为 true 或 false。算法相当简单，三条规则定义了需要的操作：\n\n- **规则 #1**：遇到关键词短语\
  \ `PROGRAM FILES END` 时将 `okToPrint` 设置为 `false`。在其他规则之前处理此规则，如果已开启打印则停止打印。\n- **规则\
  \ #2**：如果 `okToPrint` 为 `true`，Perl 程序提取该行，删除前面的注释 `//`，并将该行追加到输出文件中。可以设输出格式。\n\
  - **规则 #3**：遇到关键字 `PROGRAM FILES START` 时将 `okToPrint` 设置为 `true`。同时打印页头以识别正在打印描述的文件。\n\
  \n## 注释：程序文档框架 - 使用 Awk 或 Perl 正则提取注释\n\n在深入探讨上述三个规则的细节之前，我将用与规则 #1 对应的正则表达式来说明该过程：找到注释块的结束。如果下面的正则表达式遇到关键词\
  \ `PROGRAM FILES END`，则相应的条件/动作块代码将被调用：\n\n```regex\n/^\\s*//\\s*PROGRAM\\s+FILES\\\
  s+END/\n```\n\n像往常，正则表达式会变得有点晦懂，但如果你耐心地逐个检查它的组成部分，它们就会变得清晰：\n\n- `^` 表示行首\n- `\\\
  s*` 表示零或多个空格\n- `//` 两个正斜杠（C++ 风格注释）\n- `\\s*` 零或多个空格\n- `PROGRAM\\s+FILES\\s+END`\
  \ 三个由一个或多个空格的连续关键词。\n\n结果是，该表达式将匹配以注释 `//` 开头的行（该行可能有空格或制表符缩进），随后是寻找的三个单词，无论它们之间有多少个空格。\n\
  \nProject Files Framework 包含一个基于 Perl 的程序，实现了上述三条规则。简单来说，上面的正则表达式找到文档注释的 `START/END`，从而将状态变量\
  \ `$okToPrintLine` 设置为开启或关闭，从而决定是否将该行追加到输出文件中。以下是构造形式的三条规则：\n\n```perl\nif ( $line\
  \ =~ regex ) {\n    do something\n} // if\n```\n\n在上面，`=~` 是 Perl 的匹配操作符。它的意思是：如果有匹配，表达式求值为\
  \ `true`，否则为 `false`。\n\n- **程序段 #1** - 搜索 `END`，将 `$okToPrintLine` 变量设置为 0（关闭）。\n\
  \  ```perl\n  # match // PROGRAM FILES END\n  if ( $line =~ /^\\s*(//)\\s*PROGRAM\\\
  s+FUNCTION\\s+END/) {\n      $okToPrintLine = 0;\n      print (\"$filename:$lineNumber\
  \ File description END\");\n  } # if\n  ```\n\n- **程序段 #2** - 如果 `$okToPrintLine`\
  \ 为 1，则打印当前行；删除前面的 `//` 并将行追加到输出文件中。\n  ```perl\n  if ( $okToPrintLine == 1 ) {\n\
  \      $line = RemoveLeadingComment();\n      print $outputHandle $line; # 将 $line\
  \ 追加到输出文件\n      $lineCount++;\n  } # if\n  ```\n\n- **程序段 #3** - 搜索 `START`，将 `$okToPrintLine`\
  \ 变量设置为 1（开启）。\n  ```perl\n  # match // PROGRAM FILES START\n  if ( $line =~ /^\\\
  s*(//)\\s*PROGRAM\\s+FUNCTION\\s+START/) {\n      $okToPrintLine = 1;\n      print\
  \ (\"$filename:$lineNumber File description START\");\n  } # if\n  ```\n\n为了使上述内容生效，源代码应相应格式以便规则运行。上述输出是骨架文档。这是一个示例：\n\
  \n```text\nAardvark.h:130 File description START\n传统的 Arduino IDE 程序具有 setup() 和\
  \ loop() 函数。\n...\n修改在 Aardvark 中进行，它是独立于 IDE 的。\nAardvark.h:145 File description\
  \ END\n```\n\n上述内容简单、直观且极其有用。良好的文档工作确实需要一些时间和精力，但并不过分。这是一个自律的问题。\n\n## 文件文档模板\n\n\
  文件文档模板与程序文档模板相同。`FILE START` 和 `FILE END` 关键字封装了你关于 `.h/.cpp` 文件对的所有内容。如下：\n\n```cpp\n\
  // PROGRAM FILES START\n// 以下是 .h/.cpp 内容的描述\n// ...\n// PROGRAM FILES END\n```\n\
  \n在上述内容中，你在 START 和 END 注释之间插入任何内容都将被提取。由于 Perl 程序知道正在处理的头文件的名称，程序员在对其进行文档记录时无需显式插入文件名。\n\
  \n## 类文档模板\n\n将类描述插入到头源文件中的处理方式与文件文档完全相同。微小的差别在于，类名已添加到 `CLASS START` 关键字中，因此为：`CLASS\
  \ START 类名`。\n\n文件中包含多少个类，就应该有多少个类文档模板。\n\n```cpp\n// PROGRAM CLASS START MyClass\n\
  // 以下是 MyClass 内容的描述\n// ...\n// PROGRAM CLASS END\n```\n\n\n\n\n\n# 程序文档框架\n\n\
  ## 函数模板包含描述、参数、错误检查和返回值\n\n函数文档模板比文件和类文档模板稍微详尽一些。最好将函数文档放在 `.cpp` 文件中，而类文档在逻辑位置上更适合放在\
  \ `.h` 文件中。\n\n不同的函数特性需要被记录：描述、参数、错误检查和返回值，如下代码示例所示，该示例对 `CountLinesInFile` 函数进行了文档说明：\n\
  \n```cpp\nbool CountLinesInFile(int& _totalCount, const char* _fileName) {\n\n//\
  \ PROGRAM FUNCTION START CountLinesInFile\n// DESCRIPTION\n// 统计文件 _fileName 中的行数。\n\
  // 更新通过引用传递的 _totalCount 变量。\n// PARAMETERS\n// 参数参数总数: 2\n// int& _totalCount \
  \ - 将 _ fileName 中的行数加到 _totalCount\n// const char* _fileName  - 需要统计行数的文件\n// ERROR\
  \ CHECKING\n// 错误检查总数: 1\n// 检查文件是否存在以及是否为空\n// RETURNS\n// 返回 bool  - 成功/失败\n//\
  \ PROGRAM FUNCTION END\n\n...\n\nreturn true;\n} // CountLinesInFile()\n```\n\n\
  上述模板可以插入到被记录的函数中。然后由程序员按照上面的示例填写信息。关键短语会被 Perl 程序用于提取信息，这些信息会被添加到应用程序的文档中。\n\n###\
  \ 1. 程序流模板\n\n程序流文档（谁调用谁，谁被谁调用）基于三个如下排列的注释关键短语：\n\n```cpp\n// PROGRAM FLOW START\
  \ callingFunction MyFunction\n\n...\n\n// PROGRAM FLOW CALLS AnotherFunction\nx\
  \ = AnotherFunction ();\n\n...\n\n// PROGRAM FLOW END\n```\n\n### 谁调用谁？谁被谁调用？\n\n\
  `START` 短语会激活程序流捕获过程；它包含调用函数的名称。这是必要的，因为你捕获程序流信息的函数内部可能没有描述模板。每当遇到 `PROGRAM FLOW\
  \ CALLS` 短语时，Perl 程序会提取被调用函数的名称，并创建一个记录，其中包含调用函数（通过上述描述的 `FLOW START` 短语获取）和被调用函数（通过\
  \ `FLOW CALLS` 短语获取）。`FLOW END` 短语结束提取过程。提取出的信息会被附加到 CSV 文件中，以便导入电子表格中，并按调用函数和被调用函数进行排序。这满足了谁调用谁以及谁被谁调用的需求。\n\
  \n### 2. 列表宏 - Perl 程序\n\n## 通过 Awk/Perl 正则基于注释提取创建程序文档\n\n宏名称通过 Perl 正则表达式提取。提取\
  \ `#define` 非常简单，只需查看可选注释 `//` 之前的第一个标记标记即可。\n\n```regex\n/^\\s*((\\/\\/|\\s*)?\\\
  s*#define\\s+(\\w+)/\n```\n\n该正则表达式的意思是：从行首 `^` 开始，后面跟着零或多个空格 `\\s*`，接着是可选的注释符号或零或多个空格\
  \ `//|\\s*`，然后是零或多个空格 `\\s*`，接着是 `#define`，后面是一个或多个空格 `\\s+`，最后是一个单词 `(\\w+)`。注释符号被\
  \ `(//|\\s*)?` 捕获到 `$1`，这能够区分活动宏和被注释掉的宏。宏名称被 `(\\w+)` 捕获到 `$2`。\n\n该正则将提取活动和被注释掉的宏，Perl\
  \ 将创建一个报告，列出所有宏（活动和被注释掉的），以及文件名和行号。\n\n### 3. 列出枚举 - Perl 程序\n\n提取枚举（enums）非常简单，只需查看第一个标记（这假设枚举声明从新行开始）：\n\
  \n```regex\n/^\\s*((\\/\\/|\\s*)?\\s*(class\\s|\\s*)?\\s*enum\\s+(\\w+)/\n```\n\n\
  枚举正则与宏提取正则相同，不同在于增加了一个正则段，以处理枚举与枚举名称之间可选的 `class` 关键字 `(class\\s|\\s*)?`。该正则会将可选注释捕获到\
  \ `$1`，以区分活动枚举和被注释掉的枚举，将 `class` 关键字捕获到 `$2`（不一定会被使用），并将枚举名称捕获到 `$3`。\n\nPerl 程序将列出所有枚举（活动和被注释掉的），以及文件名和行号。\n\
  \n### 4. 函数创建框架（附录）\n\n## 函数创建框架 - 使用函数创建模板创建新函数\n\n### 用于创建函数的函数模板\n\n当专业程序员创建函数时，他们会在编写代码之前描述函数的操作和内部实现。沿着同样的思路，当\
  \ Arduino 开发者创建一个新函数时，通过从一个包含基于注释描述模板的函数骨架开始，可以节省整体开发时间。\n\n假设你想创建一个函数 `bool Foo`。你可以直接在\
  \ `.h` 和 `.cpp` 文件中开始编码。你会感觉自己正在快速冲刺并取得进展。之后，你将开始添加调试功能并作为注释插入函数文档。这固然很好，但如果你花时间做准备工作，将在将在后节省时间上获得回报。当你创建一个新函数时，我建议按照一个完善的程序进行，该程序涉及五个步骤。这些步骤涵盖了代码结构化、插入注释以及插入基于打印的调试宏。\n\
  \n*   **第一步** - 在 `.h` 和 `.cpp` 文件中创建函数名和函数参数，`.h` 文件以分号结尾，`.cpp` 文件使用大括号。确保函数名有意义并反映其功能。在示例中，`Foo`\
  \ 是一个完美的名称。\n    ```cpp\n    // Foo.h file\n    bool Foo (bool _handleNegatives,\
  \ float& _value, char* _callingFunction, int _lineNo);\n\n    // Foo.cpp file\n\
  \    bool Foo(bool _handleNegatives, float& _value, char* _callingFunction, _lineNo)\
  \ {\n    ...\n    } // Foo\n    ```\n    注意注释掉的大括号。始终这样做。当你尝试理清代码中缺失或多余括号时，这能节省大量时间。注意参数前的下划线，它将参数与全局变量或局部变量区分开来。为了调试增加了两个参数：调用函数和行号。这两个参数系统地放在最后。`.h`\
  \ 文件中没有剩余工作，其余工作在 `.cpp` 文件中。\n\n*   **第二步** - 为函数定义调试宏并将其插入 `.cpp` 文件的顶部。每个函数都有自己的调试\
  \ `#define`，以便通过相应的 `#ifdef` 开启关闭调试打印。调试宏始终以 `_DEBUG_` 开始，后面跟着文件名（FOO）和函数名（FOO）：\n\
  \    ```cpp\n    #define _DEBUG_FOO_FOO\n    ```\n\n*   **第三步** - 在函数实现中插入调试入口出口宏以及相应的打印宏。不要忘记函数末尾的默认返回值。在这种情况下，它返回一个\
  \ `bool` 值。\n    ```cpp\n    bool Foo(bool _handleNegatives, float& _value, char*\
  \ _callingFunction, int _lineNo) {\n    #ifdef _DEBUG_FOO_FOO\n        PRINT_FUNCTION_ENTER\n\
  \        PRINT_VALUE(_handleNegatives)\n    #endif\n\n        // 代码在此开始\n      \
  \  ... 你的代码\n        // 代码在此结束\n\n        #ifdef _DEBUG_FOO_FOO\n        PRINT_FUNCTION_EXIT\n\
  \        #endif\n\n        return true; // 始终在函数结束处插入\n    } // Foo ()\n    ```\n\
  \n\n\n\n\n*   第四步- 插入函数文档模板以正确记录函数。编写注释说明该函数的功能以及参数的作用，这些内容稍后可以扩展。\n\n    ```cpp\n\
  \    // PROGRAM FUNCTION START Foo\n\n    // DOCUMENTATION\n\n    // 在此处描述该函数的功能、算法...\n\
  \n    // PARAMETERS\n\n    // 参数总数: 2\n\n    // bool _handleNegatives - 需要描述\n\n\
  \    // float& _value - 需要描述\n\n    // ERROR CHECKING\n\n    // 错误检查总数: 1\n\n  \
  \  // bool _handleNegatives - 结果应为 0 或 1。\n\n    // RETURNS\n\n    // 返回 bool -\
  \ 成功/失败\n\n    // PROGRAM FUNCTION END\n\n    // PROGRAM FLOW START calling function:\
  \ Foo\n\n    ...\n\n    // PROGRAM FLOW END\n    ```\n\n*   第五步- 尽可能地对函数进行注释并编译，以确保你从开始编写整洁的代码。\n\
  \n<x>函数创建框架[AUX]完整函数骨架示例</x>这里是完成后的函数骨架：\n\n```cpp\nbool Foo (bool _handleNegatives,\
  \ float& _value, char* _callingFunction, int _lineNo) {\n\n// PROGRAM FUNCTION START\
  \ Foo\n\n// DOCUMENTATION\n\n// 在此处描述该函数的功能、算法...\n\n// PARAMETERS\n\n// 参数总数: 2\n\
  \n// bool _handleNegatives - 需要描述\n\n// float& _value - 需要描述\n\n// ERROR CHECKING\n\
  \n// 错误检查总数: 1\n\n// bool _handleNegatives - 结果应为 0 或 1。\n\n// RETURNS\n\n// 返回\
  \ bool - 成功/失败\n\n// PROGRAM FUNCTION END\n\n// PROGRAM FLOW START calling function:\
  \ Foo\n\n#ifdef _DEBUG_FOO\n\nPRINT_FUNCTION_ENTER\n\nPRINT_VALUE(_handleNegatives)\n\
  \n#endif\n\n// 检查参数有效性\n\n// 检查 bool _handleNegatives 的有效性\n\nif ( _handleNegatives\
  \ != 0 && _handleNegatives != 1 ) { handle bad value }\n\n// 代码从此处开始\n\n... 你的代码\n\
  \n// 代码结束\n\n#ifdef _DEBUG_FOO\n\nPRINT_FUNCTION_EXIT\n\n#endif\n\nreturn true;\n\
  \n// PROGRAM FLOW END\n\n} // Foo ()\n```\n\n就是这样，30 多行代码，而你还没有开始编写逻辑。在开始填充逻辑之前，我建议你先根据已知的信息填充文档部分：该函数预期做什么以及如何做、参数是做什么用的、插入参数有效性检查等。这将帮助你理清思路并启动文档工作。完成后，编译以确保你没有无意中引入错误；然后开始编写算法。\n\
  \n### 1. 类和函数名引用框架插桩（附录）\n\n<x>类和函数名引用框架[AUX]通过 ID 识别类/函数</x>识别函数的关键（以便文档能够说明是谁在进行报告）是在是在类和函数内部插入类和函数\
  \ ID 以识别它们。这种插入操作被称为“代码插桩”（instrumenting code）。这可以在小型应用程序中手动完成，也可以在大型应用程序中通过正则表达式自动完成。\n\
  \n`Classes`（类）很容易识别，只需查看行的第一个单词。这假设类声明是从新行开始的。查找类的正则表达式是：\n\n`if ($line =~ /^\\\
  s*class\\s+(\\w+)/ { do something with $1 }`\n\n当正则表达式求值为真时，`$1` 包含类名 - 第一对括号的内容。`Classes`\
  \ 可以通过对文件的第一次扫描来识别它们，从而构建一个类表。\n\n<x>程序文档框架[AUX]使用正则表达式查找函数较为复杂</x>查找函数要复杂一些，因为函数和变量声明几乎完全相同；此外，函数声明将包含类型限定符，从而使问题变得复杂。\n\
  \n插桩函数需要两个步骤：\n\n*   通过在 `.h` 文件中查找函数声明来识别函数 - 创建一个文件/函数名表。\n*   通过从 `.h` 文件创建的文件/函数表，来识别并对\
  \ `.cpp` 文件中的函数定义进行插桩。\n\n下面这个相当长的函数声明是定义正则表达式的模版。\n\n`virtual char** MyClass::MyFunction\
  \ ( params ) { code }`\n\n*   从开头开始，带有可选的空格。\n*   继续搜索可选的关键字（`static`、`virtual`、`friend`...），后面紧跟空格。\n\
  *   搜索如 `char`、`int`... 等类型。\n*   搜索可选的类型限定符（指针或引用，如上面的 `**`）。\n*   搜索可选的作用域限定符，例如\
  \ `myClass::` - 这是我们寻找的内容的一部分。\n*   搜索一个名称，后面跟可选的空格。这就是我们要找的函数名。\n*   搜索一个可选的左括号，可选性由于它可能位于连续的一行中。\n\
  \n到目前，这个正则表达式确实可以找到函数定义。问题是左括号可能在下一行。如果它在同一行，搜索结束，找到了函数。如果它不在同一行，则应该设置一个标记，以启用在后续后续非注释行的第一个项目中搜索左括号。当标记被设置并找到左括号后，前一行即被判定为函数定义。\n\
  \n上述对函数结构的分析得出了以下正则表达式：\n\n`/^\\s*(static\\s+|virtual\\s+|friend\\s+){0-3}(\\w+)\\\
  s*(\\**)\\s*((\\w+)\\s*::\\s*)?\\s*(\\w+)\\s*(|\\s*)/`\n\n该正则表达式可以拆分为它的各个组成部分：\n\
  \n*   从行开头开始，带有可选的空格：`^\\s*`\n*   处理 `static`、`virtual`、`friend` 等关键字；最多尝试三个：`(static\\\
  s+|virtual\\s+|friend\\s+){0-3}`\n*   处理类型。不需要区分不同的类型。从 Perl 的角度来看，类型就是一个名称，因此只需使用\
  \ `(\\w+)` 来识别。如果不是类型，则丢弃该行。\n*   处理可选的指针限定符 `(\\*\\*)?`\n*   处理可选的作用域限定符 `(\\w+|\\\
  s*)::\\s*)?`。类名由 `(\\w+|\\s*)` 提供。\n*   搜索函数名，后面跟若干个空格。函数名由 `(\\w+)` 提供。\n*   通过搜索左括号结束：`(|\\\
  s*)`\n\n诚然，这有点长，但它确实能找到函数定义。\n\n为了让这个正则表达式工作，变量不应使用括号初始化。例如，假设一个类包含 `int x(99)`，正则表达式会认为\
  \ `x` 是函数；请使用大括号初始化，如 `int x{99}`。\n\n上述两个正则表达式演示了如何获取类和函数名以便插桩文件。处理 `.h` 文件后，Perl\
  \ 程序包含了生成 `CandFnames.h/.cpp` 文件所需的信息，并对 `.cpp` 代码文件进行插桩。完成此任务的 Perl 数据提取和代码插桩程序是\
  \ [InsertFunctionEnums.pl](http://InsertFunctionEnums.pl)。\n\n该 Perl 自动数据提取和代码插桩系统基于以下几个假设：\n\
  \n*   C++ 源代码编译无错误。\n*   代码格式合理。我所说的“合理”是指类声明和函数定义应该从新行开始。\n*   函数声明的左括号在第一行。\n\
  *   没有通过 `/*...*/` 对注释掉的代码块。Perl 程序会被这些块中包含的内容欺骗。\n\n\n\n\n\n在编写本文时（2023 年 5 月），Perl\
  \ 类和函数名引用框架程序的某些功能尚未完成。仍有以下待办（TO DO）工作：\n\n* 优化函数查找算法。\n* 对 `.h` 文件中的类和 `.cpp` 文件中的函数进行插桩处理（Instrument）。\n\
  \n## 1. 数据处理框架（附录）\n\n数据处理框架[AUX]用于处理数据存储、数据转换、数据压缩的框架。数据处理框架（第 158 页） 类别将数据压缩分组，以节省空间并为数据传输做好准备。\n\
  \n* 类数据框架（附录） (第 254 页） - 当一个类包含相同类型的变量时，通过枚举驱动的偏移量访问包含这些变量的结构体可以使编程更加清晰，并使应用程序更加健壮且易于维护。\n\
