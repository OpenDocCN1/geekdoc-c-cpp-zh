  \ 不可以。两个 IDE 都有其代码折叠的缺点，但是可以规避的。总结来说：两个 IDE 都折叠函数、结构体、枚举等高层级聚合体……AtmelStudio 会折叠\
  \ `#ifdef...#endif` 对，但不折叠大括号。Arduino IDE 擅长折叠大括号，但不折叠 `#ifdef...#endif`。\n*   **折叠\
