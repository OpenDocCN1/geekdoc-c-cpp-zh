  \ Explorer`（`View-->Solution Explorer`）。右键点击加粗的 `MemMgt` 标题。点击 `Add`（添加），然后选择 `Existing\
  \ Item`（现有项）。将打开文件选择窗口，选择你想添加到项目中的文件 - 你所有的 `.cpp` 文件和 `.h` 文件。与 `Arduino IDE` 和\
  \ `PlatformIO` 会自动将项目文件夹中的所有现有 `.h`/`.cpp` 文件添加到项目不同，`AtmelStudio` 要求你定义哪些文件要包含在项目中。\n\
  \n你现在已准备就绪。编译并链接！你已经通过一个小型草图（sketch）来熟悉操作。假设你刚刚导入的 Arduino 编译无错误，`AtmelStudio` 将不会报告任何错误。你很可能会收到大量的此类错误信息：\n\
  \n`Invalid conversion from 'void*' to 'DateTime*'[-fpermissive]`\n\n在导入过程的阶段，问题在于将\
  \ `DateTime` 指针传递给期望 `void` 指针的函数。这是可以接受的但并不完全合法。`AtmelStudio` 认为这是危险的并将其报告为错误。无论好坏，Arduino\
  \ 库有点松，要求编译器具有一定的宽容性。\n\n# AtmelStudio (build)[AUX]添加 -fpermissive 和 -flto 标志编译器标志\n\
  \n`-fpermissive[AUX]AtmelStudio (导入 Arduino 项目) -向 C/C++ 编译器选项中添加标志`\n`-fpermissive[AUX]将编译器错误转换为警告，完成构建`\n\
  `-fpermissive[AUX]在 Arduino IDE、PlatformIO 中默认包含，AtmelStudio 中没有`\n\n默认情况下，`AtmelStudio`\
  \ 采用严格的编译器规则。解决方案是让 `AtmelStudio` 编译器稍微宽容一点。必须通过 `Project--> Properties` 在 C 和 C++\
  \ 编译器选项中添加 `-fpermissive` 选项。点击此菜单项将显示一个窗口，列出了每个工具的列表和部分。进入 `AVR/GNU C Compiler`，选择\
  \ `Miscellaneous`（杂项），并在 `Other flags` 框中添加 `-fpermissive` 。对 C++ 编译器执行相同的操作，其效果是：不再将\
  \ `void*` 指针问题报告为错误（导致编译失败），而是将其作为警告报告在 `Warnings` 窗口中，从而成功编译。\n\n顺便提一下，你可能想查看警告选项，其中一个特别有趣：\n\
  \n`Warn undefined identifier in an #if directive (-Wundef)`\n\n`AtmelStudio (build)[AUX]添加\
  \ -Wundef 以检测未使用宏` 激活此选项可能会导致输出极其冗长，因为你可能注释掉了调试打印宏。然而，这可能是非常有用的，因为未检测到的未定义宏可能是难以追踪的\
  \ bug 来源。如果你被大量消息淹没（大多数消息以 `_DEBUG_` 开头），将输出复制/粘贴到文件中并使用 `Excel` 对进行排序，这样你就可以关注那些不以\
  \ `_DEBUG_` 开头的消息。\n\n`AtmelStudio` 已经为你完成了若干任务，其中三个主要任务是：\n\n* 它创建了一个目录层次结构，根据上述“管理目录”中描述的场景\
  \ #1：在 AtmelStudio 兼容结构中包含你的项目：1 个项目，1 个解决方案。\n* 它创建了 `ArduinoCore` 目录，其中根据项目设置包含预编译库。\n\
  * 它将你的 Arduino 草图 `MemMgt.ino` 文件中的代码复制到它创建的 `Sketch.cpp` 文件中。\n\n`avrdude[AUX]AtmelStudio\
  \ 需要外部自定义 avrdude 上传工具，Visual Micro 不需要` 下一步也是最后一步是构建并上传编译后的代码到你的板。`AtmelStudio`\
  \ 虽然提供了构建，但没有提供像 `Arduino IDE` 那样的上传功能。相反，你需要创建一个 `avrdude` 命令并添加到 `External Tools`（外部工具）中。这将在下一节描述。但是，如果你安装了\
  \ `Visual Micro for AtmelStudio (MicrochipStudio) (page 84](#part0016.xhtml_a8KD))`，就不需要此类外部工具。\n\
  \n## 1. 将代码上传到微控制器（创建外部工具）\n\n`AtmelStudio (互操作性)[AUX]需要外部自定义 avrdude 上传工具，Visual\
  \ Micro 不需要`\n`avrdude[AUX]AtmelStudio 需要外部自定义 avrdude 上传工具，Visual Micro 不需要`\n\
  `AtmelStudio (build)[AUX]Visual Micro 不需要用于上传的外部工具`\n\n成功编译并链接项目后，你需要将可执行文件上传到微控制器中。当你选择了串口、开发板和微控制器并点击构建并上传按钮时，`Arduino\
  \ IDE` 会自动完成此操作。`AtmelStudio` 没有此规定，它要求你创建一个外部命令供你调用。你必须通过 `Tools-->External Tools`\
  \ 创建。简而言之，你必须创建一个 `avrdude` 命令（AtmelStudio 称之为工具），以便在你决定将可执行文件上传到微控制器时调用它。话虽如此，如果你安装了\
  \ `Visual Micro for AtmelStudio (MicrochipStudio) (page 84](#part0016.xhtml_a8KD))`，就不需要此类外部工具。\n\
  \n创建 `avrdude` 命令非常简单。只需复制 `Arduino IDE` 在上传时执行的内容，在记事本或其他程序中进行修改，并将修改后的命令添加到 `AtmelStudio\
  \ External Tools` 列表中。现在来看细节。\n\n`Arduino (upload)[AUX]在选项中勾选 verbose 以显示命令详情`\n\
  `avrdude[AUX]Arduino 上传命令详情` 首先让 Arduino 显示它正在执行的操作。在后台，`Arduino IDE` 带有相应的参数调用\
  \ `avrdude`。你可以通过在 Arduino IDE 的 `File-->Preferences` 中选择 verbose 来看到。有一个 Show verbose\
  \ output 的复选框可以开启此选项。上传你的草图。\n\nVerbose 表示大量文本。当 `avrdude` 将你的可执行文件上传到微控制器时，你确实会在\
  \ Arduino IDE 工作区的底部获得大量文本。滚动到最后，你会看到类似下面的内容：这是我得到的：\n\n```\nC:\\Program Files (x86)\\\
  Arduino\\hardware\\tools\\avr\\bin\\avrdude -C:\\Program Files (x86)\\Arduino\\\
  hardware\\tools\\avr\\etc\\avrdude.conf -v -p atmega2560 -c wiring -PCOM5 -b115200\
  \ -D - Uflash:w:C:\\Users\\agir\\AppData\\Temp\\arduino_build_981991/MemMgt.ino:i\n\
  ```\n\n了解它包含的内容是非常的。注意所有选项都以横字符开头，后跟着区分大小写的字母和选项参数，例如 `-atmega2560`。我将该行拆分为各个组件，并添加了空格使其更具可读性，如下：\n\
  \n\n\n\n\n- `Arduino (upload)[AUX]Arduino 构建输出`\n- `Arduino (build)[AUX]编译/上传使用\
  \ bootloader 上传程序`\n- `-U flash:w:C:\\Users\\agir\\AppData\\Local\\Temp\\arduino_build_٩٩٣٢٥٦/MemMgt.ino.hex:i`\
  \ 要上传的文件，编译/链接的输出。\n\n上述 `avrdude` 命令包含永不更改的项目；然而，其中三项需要针对每个 AtmelStudio 上传工具进行如下自定义：\n\
  \n- `AtmelStudio (build)[AUX]AtmelStudio 上传工具参数：识别微控制器，定义 COM 端口，波特率`\n- `AtmelStudio\
  \ (interoperability)[AUX]AtmelStudio 上传工具参数：识别微控制器，定义 COM 端口，波特率` 微控制器名称：`-p atmega2560`。你可以通过谷歌搜索\
  \ `avrdude` 来查找微控制器名称。\n- 端口：`-P COM5`。简单示例：`COM1`, `COM2`…\n- 波特率：`-b 115200`。简单示例：`9600`,\
  \ `19200` 等。\n\nArduino 会根据你定义的设置自动调整这些内容。AtmelStudio 则需要每种组合对应一个独立的外部命令：微控制器名称、串口端口、波特率。有方法避免这种限制——后文会进一步解释。\n\
  \n你复制到记事本中的 Arduino IDE `avrdude` 命令需要进行修改，因为 AtmelStudio 要求文件名包含在双引号中。上述 `avrdude`\
  \ 命令包含两个文件名：`avrdude` 配置文件的完整路径 (`avrdude.conf`) 和 `.hex` 文件的完整路径（即你要上传的程序：`-C`\
  \ 和 `-U` 选项）：\n\n- AtmelStudio 的 `avrdude` 配置文件完整路径应为 `-C \"conf_file\"`。以下 Arduino\
  \ IDE 的输出需要修改：\n\n```\n-CC:\\Program Files (x86)\\Arduino\\hardware\\tools\\avr/etc/avrdude.conf\n\
  ```\n\n注意上面的 `-C`：第一个 `C` 是 `avrdude` 选项 `-C`，第二个 `C` 是配置文件完整路径的开头 `\"C:\\Program...\
  \ \"`。此 `-C` 选项要求完整文件路径包含在双引号中，按如下方式修改行：\n\n```\n-C \"C:\\Program Files (x86)\\\
  Arduino\\hardware\\tools\\avr/etc/avrdude.conf\"\n```\n\n- 同样，编译/链接输出命令的完整路径应为 `-Uflash:w:\"\
  full file path\":i`。以下 Arduino IDE 的输出需要修改：\n\n```\n-Uflash:w:C:\\Users\\agir\\\
  AppData\\Local\\Temp\\arduino_build_993256/MemMgt.ino.hex:i\n```\n\n在 `C:\\` 之前插入引号\
  \ `\"C:\\`，在 `hex` 之后插入引号变为 `hex\":i`。`-U` 选项变为：\n\n```\n-U flash:w:\"C:\\Users\\\
  agir\\AppData\\Local\\Temp\\arduino_build_993256/MemMgt.ino.hex\":i\n```\n\n`-U`\
  \ 选项中的文件路径定义了 Arduino IDE 将 `.hex` 文件存放的位置。AtmelStudio 将其放在不同的地方，这需要额外的工作。\n\n-\
  \ `AtmelStudio (build)[AUX]$ProjectDir, $TargetDir, $TargetName 定义 .hex 文件的位置和名称`\n\
  - `AtmelStudio (file management)[AUX]$ProjectDir, $TargetDir, $TargetName 定义 .hex\
  \ 文件的位置和名称`\n- `AtmelStudio (file management)[AUX]AtmelStudio 目标发布：Debug 或 Release`\
  \ 我们还没有结束。`avrdude.conf` 文件始终位于相同位置，因此与项目的位置无关。AtmelStudio 的 `MemMgt.ino.hex` 文件（编译/链接的可执行文件）并非如此。理论上，由于每个项目的名称都不同，你需要为每个项目准备一个命令。幸运的是，AtmelStudio\
  \ 你可以使用的环境变量。其中三个特别相关：`ProjectDir`、`TargetDir` 和 `TargetName`。请注意 `.hex` 文件可能位于两个位置：Debug\
  \ 和 Release。\n\n- Arduino IDE 使用动态创建的临时位置：\n```\n\"C:\\Users\\agir\\Appdata\\...\\\
  MemMgt.ino.hex\"\n```\n- AtmelStudio 使用项目位置：取决于配置设置的 Debug 或 Release 目录：\n```\n\"\
  D:\\ArduinoDev\\AtmelDev\\MemMgt\\MemMgt\\Debug\"\n\"D:\\ArduinoDev\\AtmelDev\\\
  MemMgt\\MemMgt\\Release\"\n```\n\n现在可以通过两个环境变量如下创建 `.hex` 文件的路径：\n\n- `$ProjectDir`\
  \ - 项目的完整路径名：`\"D:\\ArduinoDev\\AtmelDev\\MemMgt\"`\n- `$TargetDir` - 将项目目录 (`$ProjectDir`)\
  \ 与目标目录（Debug 或 Release）结合。\n- `$TargetName` - 目标名称：`\"MemMgt\"`\n\n基于环境变量的完整 `.hex`\
  \ 文件路径名现在是通用的：\n\n`$( TargetDir)\\$( TargetName).hex`\n\n因此，上传命令的 `-U` 选项变为：\n\n\
  ```\n-Uflash:w:\"$( TargetDir)\\$( TargetName).hex\":i\n```\n\n对于不了解的人来说，环境变量是系统范围的宏，应用程序可以定义并使用。AtmelStudio\
  \ 定义了三个这样的宏：`ProjectDir`、`TargetDir` 和 `TargetName`。\n\n\n\n\n你现在可以通过执行 `Build Solution`（生成解决方案）来修改代码使其编译并链接；随后，通过你已创建的命令中相应的外部命令上传可执行文件。确保目标串口端口没有被串口监视器占用。如果是这样，请将其关闭。上传信息将告知你上传是否成功。打开串口监视器。定义波特率。运行。检查输出并根据情况修改代码。重复此过程。但请注意，有几点注意事项：\n\
  \n- 上传时必须关闭串口监视器，以便 `avrdude` 能够使用它。否则，你将收到以下晦涩的信息：\n\n```\navrdude.exe: stk500v2_getsync():\
  \ timeout communicating with programmer\navrdude.exe done. Thank you.\n```\n\n-\
  \ `AtmelStudio (注意事项)[AUX]avrdude 无法将代码上传到芯片` 当通过你的外部命令向微控制器上传代码时，`avrdude` 有时无法将你的代码上传成功。是的，`avrdude`\
  \ 会偶尔失败，且没有给出特定的原因。这有点像偶尔发生的段错误。问题在于，上传后，快速扫一眼 `avrdude` 的信息会让你认为一切顺利。但事实并非，可能发生了错误。问题在于，如果存在错误消息，它并不易于可见，因为它已经滚动移出了视线。请查看\
  \ AtmelStudio 注意事项以获取关于此问题的详细描述。\n\n就是这些。你已经完成了 Arduino Sketch 的导入。你已经对其进行了编译、链接、将其上传到微控制器，并将其输出视觉化。你已准备好使用\
  \ `AtmelStudio` 开发 Arduino 应用了。此外，你即将建立 `AtmelStudio` 和 Arduino IDE 之间的互操作性，以便在两者之间无缝切换。参见互操作性（第\
  \ 21 页)。\n\n我将对 `AtmelStudio` 的外部工具添加最后的最后的说明。外部工具是你任何可能想从 `AtmelStudio` 中运行的可执行文件（以及其参数）。你可以将任何可执行文件放入命令文本框中。尝试这种方法：创建一个名为\
  \ `Notepad` 的工具。将 `notepad` 的完整文件路径放入命令框中（`C:\\Windows\\System32\\notepad.exe`），点击参数检查复选框，然后点击\
  \ OK ——一切就绪了。你现在可以直接从 AtmelStudio 的工具菜单中调用 `notepad`。\n\n### 1. 与 Arduino 应用交互\n\
  \n`AtmelStudio` 不提供外部监视器；你必须使用外部监视器。你可以使用 Arduino 串口监视器，除非你集成了 Visual Micro for\
  \ AtmelStudio (MicrochipStudio) (第 84 页) 插件。\n\n`AtmelStudio (编辑器)[AUX]Arduino 监视器显示输出`\
  \ 要视觉化 `AtmelStudio`程序的输出，请使用 Arduino IDE 打开任何 sketch；设置为正确的开发板、微控制器和串口，并使用其控制台（串口终端）。不要担心刚刚打开的\
  \ Arduino IDE 中恰好是哪个 sketch。控制台和 sketch 之间是无关的。当你打开控制台或重启时，控制台的输出独立于 Arduino IDE\
  \ 的 sketch。它所做的只是重置微控制器并使其运行其中包含的任何程序。这就是为什么你可以用 `AtmelStudio` 构建并上传程序，并使用任何 Arduino\
  \ IDE 的串口监视器将输出视觉化。不过有一个细节值得注意：当从 `AtmelStudio` 将应用程序的可执行文件上传到微控制器时，串口必须是空闲的，这意味着你用于视觉化输出的串口终端必须关闭。在使用\
  \ `AtmelStudio` 时，顺序是：关闭控制台；修改代码；构建并上传到微控制器；打开控制台；视觉化输出。在使用 Arduino IDE 和 PlatformIO\
  \ 时不需要这样做，因为在执行构建/上传时控制台或终端可以保持打开。如果你配合 Visual Micro 使用 `AtmelStudio`，则上述不适用，因为\
  \ Visual Micro 提供了内置监视器（参见 Visual Micro for AtmelStudio (MicrochipStudio 第 84 页）。\n\
  \n### 2. 编辑器功能\n\n`AtmelStudio (编辑器)[AUX]丰富的用户辅助编辑器功能` `AtmelStudio` 和 Arduino IDE\
  \ 都是经典的 C/C++ 编程工具。我说的经典，是指它们的特征是包含一个待处理文件的工作区，上方是一个包含图标和菜单的工具栏。这两个 IDE 之间的相似性到此结束，因为\
  \ `AtmelStudio` 可以做 Arduino IDE 能做的任何事情，而且多得多。它的多窗口功能和编程辅助是 `AtmelStudio` 优势所在。这些编程辅助包含两个嵌入包中：`VAssist`\
  \ 和 `Intellisense`。\n\n- `AtmelStudio (编辑器)[AUX]VAssist 具有许多帮助机制` `VAssist` 是 Visual\
  \ Assist 的缩写，通过顶层菜单项访问。它包含了让编程更舒适、更高效的功能。它提供了快捷键，例如跳转到实现、查找使用该变量的所有位置、当光标在类函数内部时跳转到成员函数等。你应该逐一查看\
  \ `VAssist` 菜单项，以便你知道它们的存在并知道它们能为你做些什么。\n\n- `AtmelStudio (编辑器)[AUX]Intellisense\
  \ 与 VAssist 互补` `Intellisense` 与 `VAssist` 类似，因为它也带来了多样化的辅助。它通过 Edit 顶层菜单的底部访问。`Intellisense`\
  \ 功能的一个示例是通过封装的注释为函数添加自定义文档。结果是，当你在代码的某处将光标置于函数上并执行 `ctrl-alt-space` 时，弹出的将显示函数声明和随附的帮助。你也可以对库函数显示此类帮助。在\
  \ `rand()` 上试试看。\n\n以下是 `AtmelStudio` 中 Arduino IDE 未实现的智能编辑器功能的非详尽列表。新的 Arduino\
  \ IDE V2 提供了这些某些功能，但与 `AtmelStudio` 的功能相比仍有差距。这些功能没有划分为 `VAssist` 或 Intellense 相关；它们是我经常使用的：\n\
  \n- `AtmelStudio (编辑器)[AUX]工作区包含可拆分且固定的工作窗口和解决方案管理器` `Workspace`(part0014.xhtml_a9F0)\
  \ (第 51 页)- 虽然 Arduino IDE 工作区只有一个显示代码的窗口并带有选择文件的固定标签，但 `AtmelStudio` 的工作区可以拆分为两个工作区（并排或上下），每个工作区包含你选择的几个源文件。每个工作区都有可移动的标签来显示文件。因此，你可以将两个工作区并排，一个包含\
  \ `.cpp` 文件，另一个包含 `.h` 文件。此外，窗口可以拆分，这样你就可以在查看文件一部分时处理另一部分。文件可以取消固定，以便在它们自己的窗口中独立显示。这在你使用大屏幕或多显示器时特别有用。\n\
  \n\n\n\n*   **AtmelStudio (编辑器)[AUX]函数的多选快速访问** 快速访问函数 (第 53 页) - 当窗口中显示文件时，窗口左上角的一个小型水平选择框可以让你访问文件中的全局变量和函数。选择其中一个位置会将光标直接置于所选的变量或函数上。这对于快速跳转到你想去的地方非常有用。无需使用查找/替换对话框即可进入你想处理的函数。\n\
  *   **跳转到实现](#part0014.xhtml_a92F)** (第 53 页) - AtmelStudio 提供了另一种快速访问变量以及函数声明和实现的方法。在函数名称上点击鼠标右键，会打开一个小型文本框，其中包含该函数的声明（`.h`\
  \ 文件）和实现（`.cpp` 文件）。这让你能够直观地查看函数的参数列表。如果你需要，可以点击你想要访问的内容。\n*   **AtmelStudio (编辑器)[AUX]内联任务提供重命名、创建、声明等多选文本框**\
  \ 内联函数任务 (第 53 页) - 当光标位于函数上时，会出现一个微小的箭头，指向函数名称下方。点击它——它将显示一个包含各项任务的多选文本框：重命名、创建声明、显示引用等。\n\
  *   **AtmelStudio (编辑器)[AUX]颜色编码高度可定制** 颜色编码 (第 54 页) - 颜色编码不仅是区分不同项的方法（例如：变量为蓝色，文本为绿色，字符串为红色），它还会通过将项的通常颜色改为黑色来提示你某个错误。\n\
  *   **AtmelStudio (编辑器)[AUX]语法检查 - 出现编程错误时颜色变为黑色** 内联语法检查 (第 55 页) - 当你在 AtmelStudio\
  \ 中输入代码时，语法错误（如忘记分号、未完成的 for 语句或未声明的变量）将用红色下划线标出，颜色将变为黑色。这允许立即纠正。你不需要等待编译器来发现错误。就像有一个编译器坐在你的肩上，随时指出你刚刚犯了错误。\n\
  *   **正则表达式 (通用)[AUX]许多工具都包含正则引擎 - AtmelStudio 和 PlatformIO 查找/替换、Perl、Awk、Word\
  \ (通配符) AtmelStudio (查找/替换)[AUX]支持整词、正则表达式、历史搜索** 查找/替换 (第 55 页) 对话框支持整词概念。它还支持正则表达式，这是一种强大灵活的工具工具并不难掌握。我强烈建议你熟悉它，它是使用\
  \ `Awk` 和 `Perl` 的关键。参见正则表达式 (regex) (第 191 页)。如果你恰好使用 Adobe InDesign、Photoshop\
  \ 等工具，你可能用过 `Grep` 工具——它是基于正则表达式的。注意，Arduino IDE V2 的查找/替换支持正则表达式；而旧的 1.8.19 版本不支持。\n\
  *   **AtmelStudio (编辑器)[AUX]名称补全弹出窗口打开** 名称补全 (第 56 页) - 在输入宏、全局变量、函数和类时，会打开一个文本框列出已有的项，你可以通过选择所需的项来完成输入。此功能不仅节省了输入时间，还能确保项拼写正确。新的\
  \ Arduino IDE V2 支持名称补全。\n*   **折叠类、函数、枚举、ifs、whiles 等以及 #ifdef...#endif 对 AtmelStudio\
  \ (注意事项)[AUX]不支持大括号折叠** 代码折叠与缩进 (第 57 页) - `#ifdef...#endif` 折叠（Arduino IDE 不支持）在跟丢了\
