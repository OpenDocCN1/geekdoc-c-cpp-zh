- pgno: 41
  md: '**Network operators of alike structure** are alike network operators that differ
    in unary and binary operations.


    **Variation of network operator** is the change of network operator that leads
    to a similar network operator.


    **Simple variation of network operator** is a variation that cannot be presented
    as a complex of other variations.


    Simple variations of network operator are given in Table 3.


    | Number of simple variation | Simple variation |

    |---|---|

    | 0 | replacement of unary operation on the edge |

    | 1 | replacement of binary operation in the node |

    | 2 | addition of the edge with a unary operation |

    | 3 | deletion of the edge if the node where this edge comes in has at least one
    more incoming edge |

    | 4 | Increase of the node number |

    | 5 | Decrease of the node number |

    | 6 | addition of the node with a binary operation and incoming edge with unary
    operation |

    | 7 | deletion of the sink node with incoming edge if this edge is single. |


    Table 3. Simple variations of network operator


    **Structural variation of network operator** is a variation that changes the set
    of edges of network operator.


    Structural variations change the incident matrix of the graph. In the Table 3
    structural variations are 2 - 5. Variations 0, 1 do not change the incident matrix
    and lead to network operators of alike structure.


    **A complete network operator** is a network operator in which we cannot perform
    variation 2.


    A complete network operator contains L nodes in which the number of source nodes
    is N + P , maximum number of edges is equal to


    |C| = (L - N - P)(L + N + P - 1)/2.   (12)


    If we apply variation 2, addition of an edge, to any network operator, then we
    can construct a full network operator which is alike initial network operator.


    If we apply variation 3, deletion of an edge, to the complete network operator,
    then we can construct any alike network operator.


    Any variation of network operator can be performed by a finite number of simple
    variations.'
