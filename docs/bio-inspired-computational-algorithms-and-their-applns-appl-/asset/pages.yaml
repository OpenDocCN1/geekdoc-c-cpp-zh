  md: 'are corrected up to several significant digits according to the number of zooms
    and the zooming rate. The SZGA can predict the possibility that the solution found
    is the exact optimum solution. The zooming factor, number of sub-iteration populations,
    number of zooms, and dimensions of a given problem affect the possibility and
    accuracy of the solution. In this chapter, we examine these parameters and propose
