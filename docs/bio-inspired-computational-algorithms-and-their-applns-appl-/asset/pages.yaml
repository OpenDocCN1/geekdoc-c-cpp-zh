    F(t) = {f₁(t), f₂(t), ..., f_μ(t)} (6)


    that can be analyzed by itself or compared to the ℓ preceding ones, that is creating
    a time window of width ℓ, F(t - 1), F(t - 2), ..., F(t - ℓ). The fitness distributions
    can be regarded as a data stream and monitoring this data stream should make visible
    the normal optimum finding mode of the EA but also reflect that this normal mode
    is disrupted if a change in the fitness landscape has occurred (and hence results
    in a different pattern when evaluating F(t) and F(t - 1), respectively). Statistically
    speaking, the considered data set F(t) can be regarded as coming from an unknown
    distribution D(t). This transforms the problem of change detection into the problem
    of testing whether the data sets F(t) and F(t - 1) or any data set created from
    any time window including F(t) are coming from different distributions or not,
    which is known as statistical hypothesis testing. This connection is widely applied
    in solving change detection problems, e.g. (14; 23). The obvious question here
    is which test can tell us whether D(t) is different from D(t - 1) and if this
    difference necessarily and sufficiently implies that a change has occurred. In
    the language of statistical hypothesis testing, the test should ideally show only
    true changes, that is have no false positives and indicate all of them, that is
    have no false negatives. However, statistical hypothesis testing methods regularly
    require that the samples F(t) are independent from F(t - 1). This most likely
    is not the case if the samples come form a moving population of an evolutionary
    algorithm. The data set F(t) includes the fitness value of an evolving population
    and represents two types of'
