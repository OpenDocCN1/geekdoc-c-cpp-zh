  md: 'complexity of evolved circuits is so far small. In our opinion, conclusion
    drawn in the paper (Yao & Higuchi, 1999) is still available: “EHW research needs
    to address issues, such as scalability, online adaptation, generalization, circuit
    correctness, and potential risk of evolving hardware in a real physical environment.
    It is argued that a theoretical foundation of EHW should be established before
    rushing to large-scale EHW implementations”.


    Recently appeared the idea of hybridization of a GA with elements of quantum computation
    (Han & Kim, 2002; Han, 2003). We have proposed a new quantum inspired genetic
    algorithm (QIGA) considerably faster than other similar algorithms, based on the
    idea of introducing a new parameter, which we called the probability of collapse,
    and to initiate the collapse of the quantum chromosome in order to generate a
    conventional population of chromosomes from time to time, and not each generation,
    as usually is done. We believe that some improvements in this method may be found
    in a future research, by establishing of a new method of updating the quantum
    chromosome from the current generation to the next one. Finally, some hybridization
    techniques may be useful for new quantum inspired evolutionary algorithms. (Rubinstein,
    2001) used Genetic Programming to evolve quantum circuits with various properties,
    and (Moore & Venayagamoorthy, 2005) has developed an algorithm inspired from quantum
    evolution and Particle Swarm to evolve conventional combinational logic circuits.


