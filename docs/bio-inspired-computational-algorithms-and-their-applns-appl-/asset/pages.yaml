    # 3.6 Modeling temporal dependencies


    The model described in Problem definition 2 can be generalized to incorporate
    temporal restrictions.


    # Problem definition 3.


    An optimal portfolio of projects with temporal dependencies can be selected by
    maximizing U= Σik f(uk(da)) wik, subject to (d, t)∈ R''F, where vector t =((p),
    t(p2)...) denotes the decision variables valid during the period of time when
    each project starts. R''F contemplates time-precedence restrictions, restrictions
    on the time projects can start, and the available funds for each time interval.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'This problem can be solved using a genetic algorithm similar to the one previously
    presented. However, a different encoding for individuals must be devised. Our
    proposal is to encode individuals as a 2N-dimensional vector of the form (μ1,
    t1, μ2, t2, …, μN, tN). As before, genes corresponding to μi have domain defined
    by the continuous interval [0, 1]. Genes corresponding to ti have a domain defined
    by the set {1, 2, 3, …, T}, where T is the maximum number of time periods. Crossover
    can only occur between genes of the same kind. However, mutations may occur at
    any gene. Restrictions such as time precedence and the earliest time a project
    can start are controlled by constraints as described by Carazo et al. (2010).


    # 4. Concluding remarks


    Given a set of premises, it is possible to create a value model for selecting
    optimal portfolios from an SDM perspective. While this problem is Turing-decidable,
    finding its exact solution requires exponential time. However, the use of genetic
    algorithms for solving this problem can closely approximate the optimal portfolio
    selection.


    Inspired by a normative approach, the set of premises presented here is based
    on the following assumptions.


    +   - To the SMD, every project and every portfolio has a subjective value that
    depends on its social impact. This value exists even if it cannot be initially
    quantified.

    +   - The SDM either has already defined a consistent system of preferences, or
    has the aspiration of doing so.

    +   - The SDM is willing to invest a considerable amount of mental effort in order
    to define this consistent set of preferences and produce the aforementioned value
    model.


    As for the algorithmic solution to the portfolio problem, its computational complexity
    can increase considerably when synergic effects and temporal dependencies are
    considered. However strategic planning requires a high quality model. The problems
    defined in this scenario are so important that they justify the use of computational
    intensive solutions.


