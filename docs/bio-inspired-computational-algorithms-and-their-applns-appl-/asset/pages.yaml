  md: '# Mining Frequent Itemsets over Recent Data Stream Based on Genetic Algorithm


    Zhou Yong*, Han Jun and Guo He

    School of Software of Dalian University of Technology, Dalian

    China


    # 1. Introduction


    Data stream is massive sequence of data elements generated at a rapid rate which
    is characterized by continuously flowing, high arrival rate, unbounded size of
    data and real-time query requests. The knowledge embedded in a data stream is
    more likely to be changed as time goes by. Identifying the recent change of a
    data stream, especially for an online data stream, can provide valuable information
    for the analysis of the data stream. Frequent patterns on a data stream can provide
    an important basis for decision making and applications. Because of the data stream''s
    fluidity and continuity, the information of frequent patterns changes with the
    new data coming.


    Mining over data streams is one of the most interesting issues of data mining
    in recent years. Online mining of data streams is an important technique to handle
    real-world applications, such as traffic flow management, stock tickers monitoring
    and analysis, wireless communication management, etc. In most of the data stream
    applications, users tend to pay more attention to the mode information of the
    recent data stream. Therefore, mining frequent patterns in recent data stream
    is a challenging work. The mining process should have one-pass algorithm, high
    efficiency of updating, limited space cost and online response of queries. However,
    most of mining algorithms or frequency approximation algorithms over a data stream
    could not have high efficiency to differentiate the information of recently generated
    data elements from the obsolete information of old data elements which may be
    no longer useful or possibly invalid at present.


    Many previous studies contributed to efficient mining of the frequent itemsets
    over the streams. Generally, three processing models are used which are the landmark
    model, the sliding window model and the damped model[1]. The landmark model analyzes
    the stream in a particular window, which starts from a fixed timestamp called
    landmark and ends up with the current timestamp. For the sliding window model
    case, the mining process is performed over a sliding window of a fixed length.
    Based on the sliding window model, the oldest data is pruned immediately when
    a new data arrives. The damped model uses the entire stream to compute the frequency
    with a decay factor d, which makes the recent data more important than the previous
    ones.'
