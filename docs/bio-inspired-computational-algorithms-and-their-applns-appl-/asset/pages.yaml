  md: 'rigid process that has been questioned by several authors (e.g. Gabriel et
    al., 2006, Fernandez et al., 2009 a,b). According to our perspective, the decision
    on which projects should receive financing must be made based on the best portfolio,
    rather than on the best individual projects. Therefore, it is insufficient to
    compare projects to one another. Instead, it is essential to compare portfolios.
    Selecting a portfolio based on individual projects’ ranking guarantees that the
    set of the best projects will be supported. However, this set of projects does
    not necessarily equals the best portfolio. In fact, these two sets might be disjoint.
    Under this scenario, it is reasonable to reject a relatively good (in terms of
    its social impact) but expensive project if it requires disproportionate funding
    (Fernandez et al. 2009 a,b). Therefore, obtaining the best portfolio is, we argue,
    equivalent to solving the Pα problem defined over the set of all feasible portfolios.


    Mavrotas et al. (2008) argue that, when the portfolio is optimized, good projects
    can be outranked by combinations of low-cost projects with negligible impact.
    However, this is not a real shortcoming whenever the following conditions are
    satisfied.


    +   - Each project is individually acceptable

    +   - The decision maker can define his/her preferences over the set of feasible
    portfolios (by using some quality measure, or even by intuition)

    +   - The decision maker prefers the portfolio composed of more projects with
    lower costs.


    In order to solve the selection problem over the set of feasible portfolios, the
    following issues should be addressed.


    +   - The nature of the decision maker should be defined. It must be clear that
    this entity can address social interest problems in a legit way. In addition,
    the following questions should be answered. Is the decision-maker a single person?
    Or is it a collective with homogeneous preferences such that these can be captured
    by a decision model? Or is it, instead, a heterogeneous group with conflicting
    preferences? How is social interest reflected on the decision model?

    +   - A computable model of the DM’s preferences on the social impacts of portfolios
    is required.

    +   - Portfolio selection is an optimization problem with exponential complexity.
    The set of possible portfolios is the power set of the projects applying for funding.
    The cardinality of the set of portfolios is 2^N, where N is the number of projects.
    The complexity of this problem increases significantly if we consider that each
    project can be assigned a support level. That is, projects can be partially supported.
    Under these conditions, the optimization problem is not only about identifying
    which projects constitute the best portfolio but also about defining the level
    of support for each of these projects.

    +   - If effects of synergetic projects or temporal dependencies between them
    are considered, the complexity of the resulting optimization model increases significantly.


    The first issue is related to the concepts of social preferences, collective decision,
    democracy, and equity. The second issue, on the other hand, constitutes mathematical
    decision analysis’ main area of influence. These capabilities for building preference
    models that incorporate different criteria and perspectives is what makes these
    techniques useful (albeit with some limitations) for constructing multidimensional
    models of conflicting preferences.'
