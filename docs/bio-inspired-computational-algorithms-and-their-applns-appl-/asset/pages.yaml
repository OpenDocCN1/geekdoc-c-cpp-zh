  md: '# 3. Test model


    The power system considered is a single machine infinite bus (SMIB) system as
    shown in Fig. A. 1 of Appendix 8.2.1. The generator is connected to the infinite
    bus through a double-circuit transmission line. The generator is modeled using
    a 6th order machine model, and is equipped with an automatic voltage regulator
    (AVR) which is represented by a simple exciter of first order differential equation
    as given in the Appendix 8.1.4. The block diagram of the AVR is shown in Fig.
    A. 2 of Appendix 8.2.2. A supplementary controller also known as power system
    stabilizer (PSS) is to be designed to damp the system''s oscillations. The block
    diagram of the PSS is shown in Fig. A.3 of Appendix 8.2.3.


    The non-linear differential equations of the system are linearized around the
    nominal operating condition to form a set of linear equations as follows:


    $$\begin{cases}\frac{d}{dt}x = Ax + Bu\\ y = Cx + Du\end{cases}$$ (3)


    where:


    A is the system state matrix, B is the system input matrix, C is the system output
    matrix and D is the feed-forward matrix

    x is the vector of the system states, u is the vector of the system inputs and
    y is the vector of the system outputs.


    In this work, x = [Δδ Δω Δψ_fd Δψ_1d Δψ_1q Δψ_2q ΔE_fd]^T ; u = [ΔT_m ΔV_ref]^T
    ; y = Δω; where, Δδ is the rotor angle deviation, Δω is the speed deviation, Δψ_fd
    is the field flux linkage deviation, Δψ_1d is d-axis amortisseur flux linkage
    deviation, Δψ_1q is the 1st q-axis amortisseur flux linkage deviation, Δψ_2q is
    the 2nd q-axis amortisseur flux linkage deviation, ΔE_fd is the exciter output
    voltage deviation. ΔT_m is the mechanical torque deviation and ΔV_ref is the voltage
    reference deviation.


    Several operating conditions were considered for the design of the controllers.
    These operating conditions were obtained by varying the active power output, P_e,
    and the reactive power Q_e of the generator as well as the line reactance, X_e.
    However, for simplicity, only three operating conditions will be presented in
    this paper. These operating conditions are listed in the Table 1 together with
    the open loop eigenvalues and their respective damping ratios in % in brackets.


    Table 1. Selected operating conditions with open-loop eigenvalues


    | case | Active Power Pe [p.u] | Reactive Power Qe [p.u] | Line reactance Xe [p.u]
    | Eigenvalues (Damping ratio) |

    |------|----------------------|------------------------|------------------------|------------------------------|

    | 1 | 1.1000 | 0.4070 | 0.7000 | -0.2894 ± j5.2785 (0.0547) |

    | 2 | 0.5000 | 0.1839 | 1.1000 | -0.3472 ± j4.3271 (0.0800) |

