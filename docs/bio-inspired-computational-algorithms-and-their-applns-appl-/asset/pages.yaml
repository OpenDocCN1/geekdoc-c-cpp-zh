  md: 'known for its representation of preferences as a fuzzy outranking relation.
    In this work, however, we will focus on the functional approach only.


    When using the functional model, also known as the functional-normative approach
    (e.g. French, 1993), the Decision Maker must establish a weak preference relation,
    known as the at least as good as relation and represented by the symbol ≽. This
    relation is a weak order (a complete and transitive relation) on the decision
    set A. The statement “a is at least as good as b” (a ≽ b) is considered a logical
    predicate with truth values in the set {False, True}. If a ≽ b is false then b
    ≻ a must be true, implying a strict preference in favor of b over a. Given the
    transitivity of this relation, if the DM simultaneously considers that predicates
    a ≽ b and b ≽ c are true, then the predicate a ≽ c is also set to true. This approach
    does not consider the situation where both predicates, a ≽ b and b ≽ a, are false,
    a condition known as incomparability. Because of this, the functional model requires
    the DM to have an unlimited power of discrimination.


    The relation ≽ can be defined over any set whose elements may be compared to each
    other and, as a result of such comparison, be subject to preferences. Of particular
    interest is the situation where the decision maker considers risky events and
    where the consequences of the actions are not deterministic but rather probabilistic.
    To formally describe this situation, let us introduce the concept of lottery at
    this point.


    # Definition 1.


    A lottery is a 2N-tuple of the form (p₁, x₁; p₂, x₂; … pₙ, xₙ), where xᵢ ∈ ℝ represents
    the consequence of a decision, pᵢ is the probability of such consequence, and
    the sum of all probabilities equals 1.


    Given that the relation ≽ is complete and transitive, it can be proven that a
    real-valued function V can be defined over the decision set A (V: A → ℝ), such
    that for all a, b ∈ A, V(a) ≥ V(b) ⇔ a ≽ b. This function is known as a value
    or utility function in risky cases (French, 1993). If the decision is being made
    over a set of lotteries, the existence of a utility function Ũ can be proven such
    that Ũ(L₁) ≥ Ũ(L₂) ⇔ L₁ ≽ L₂, where L₁ and L₂ are two lotteries from the decision
    set and Ũ is the expected value of the utility function (French, 1993).


    The value, or utility, function represents a well formed aggregation model of
    preferences. This model is constructed around the set of axioms that define the
    rational behavior of the decision maker. In consequence, it constitutes a formal
    construct of an ideal behavior. The task of the analyst is to conciliate the real
    versus the ideal behavior of the decision maker when constructing this model.
    Once the model has been created, we have a formal problem definition. This is
    a selection problem that is solved by maximizing either V or Ũ over the set of
    feasible alternatives. From this, a ranking can be obtained by simply sorting
    the values of these functions. By dividing the range of these values into M contiguous
    intervals, discrete ordered categories can be defined for labeling the objects
    in the decision set A (for instance, Excellent, Very Good, Good, Fair, and Poor).
    These categories are considered as equivalence classes to which the objects are
    assigned to.


    When building a functional model, compatibility with the DM’s preferences must
    be guaranteed. The usual approach is to start with a mathematical formulation
    that captures the essential characteristics of the problem. Parameters are later
    added to the model in a way that they reflect the known preferences of the decision
    maker. Hence, every time the'
