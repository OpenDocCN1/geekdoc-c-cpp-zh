  md: '# A Splicing/Decomposable Binary Encoding and Its Novel Operators for Genetic
    and Evolutionary Algorithms


    Yong Liang

    Macau University of Science and Technology

    China


    # 1. Introduction


    Most of the real-world problems could be encoded by different representations,
    but genetic and evolutionary algorithms (GEAs) may not be able to successfully
    solve the problems based on their phenotypic representations, unless we use some
    problem-specific genetic operators. Therefore, a proper genetic representation
    is necessary when using GEAs on the real-world problems (Goldberg, 1989; Liepins,
    1990; Whitley, 2000; Liang, 2011).


    A large number of theoretical and empirical investigations on genetic representations
    were made over the last decades. Earlier work (Goldberg, 1989c; Liepins & Vose,
    1990) has shown that the behavior and performance of GEAs is strongly influenced
    by the representation used. As a result many genotypic representations were made
    for proper GEAs searching. Among of them, the binary, integer, real-valued, messy
    and tree structure representations are the most important and widely used by many
    GEAs.


    To investigate the performance of the genetic representations, originally, the
    schema theorem proposed by Holland (1975) to model the performance of GEAs to
    process similarities between binary bitstrings. Using the definition of the building
    blocks (BBs) as being highly fit solutions to sub-problems, which are decomposed
    by the overall problem, the building block hypothesis (Goldberg, 1989c) states
    that GEAs mainly work due to their ability to propagate short, low order and highly
    fit BBs. During the last decade, (Thierens, 1995; Miller, 1996; Harik, 1997; Sendhoff,
    1997; Rothlauf, 2002) developed three important elements towards a general theory
    of genetic representations. They identified that redundancy, the scaling of Building
    Blocks (BBs) and the distance distortion are major factors that influence the
    performance of GEAs with different genetic representations.


    A genetic representation is denoted to be redundant if the number of genotypes
    is higher than the number of phenotypes. Investigating redundant representation
    reveals that give more copies to high quality solutions in the initial population
    result in a higher performance of GEAs, whereas encodings where high quality solutions
    are underrepresented make a problem more difficult to solve. Uniform redundancy,
    however, has no influence on the performance of GEAs.


    The order of scaling of a representation describes the different contribution
    of the BBs to the individual''s fitness. It is well known that if the BBs are
    uniformly scaled, GEAs solve all BBs'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'implicitly in parallel. In contrast, for non-uniformly scaled BBs, domino convergence
    occurs and the BBs are solved sequentially starting with the most salient BB (Thierens,
    1995). As a result, the convergence time increases and the performance is decreasing
    due to the noise from the competing BBs.


    The distance distortion of a representation measures how much the distance between
    individuals are changed when mapping the phenotypes to the genotypes, and the
    locality of the representation means that whether similar genotypes correspond
    to similar phenotypes. The theoretical analysis shows that representation where
    the distance distortion and locality are equal to zero, that means the distances
    between the individuals are preserved, do not modify the difficulty of the problems
    they are used for, and guarantee to solve problems of bounded complexity reliably
    and predictably.


    The importance of choosing proper representations for the performance of GAs is
    already recognized, but developing a general theory of representations is a formidable
    challenge. Up to now, there is no well set-up theory regarding the influence of
    representations on the performance of GAs. To help users with different tasks
    to search good representations, over the last few years, some researchers have
    made recommendations based on the existing theories. For example, Goldberg (Goldberg,
    1989) proposed two basic design principles for encodings:


    +   - Principle of minimal alphabets: The alphabet of the encoding should be as
    small as possible while still allowing a natural representation of solutions.

    +   - Principle of meaningful building blocks: The schema should be short, of
    low order, and relatively unrelated to schema over other fixed positions.


    The principle of minimal alphabets advises us to use bit string representation.
    Combining with the principle of meaningful building blocks (BBs), we construct
    uniform salient BBs, which include equal scaled and splicing/decomposable alleles.


    The purpose of this chapter is to introduce our novel genetic representation —
    a splicing/decomposable (S/D) binary encoding, which was proposed based on some
    theoretical guidance and existing recommendations for designing efficient genetic
    representations. The S/D binary representation can be spliced and decomposed to
    describe potential solutions of the problem with different precisions by different
    number of uniform-salient BBs. According to the characteristics of the S/D binary
    representation, GEAs can be applied from the high scaled to the low scaled BBs
    sequentially to avoid the noise from the competing BBs and improve GEAs’ performance.
    Our theoretical and empirical investigations reveal that the S/D binary representation
    is more proper than other existing binary encodings for GEAs searching. Moreover,
    a new genotype distance d_g on the S/D binary space Φ_s is proposed, which is
    equivalent to the Euclidean distance d_p on the real-valued space Φ_r during GEAs
    convergence. Based on the new genotype distance d_g, GEAs can reliably and predictably
    solve problems of bounded complexity and the methods depended on the phenotypic
    distance d_p for solving different kinds of optimization problems can be directly
    used on the S/D binary space Φ_s.


    This chapter is organized as follows. Section 2 describes three most commonly
    used binary representations — binary, gray and unary encodings, and their theoretical
    analysis of the effect on the performance of GEAs. Section 3 introduces our proposed
    splicing/decomposable'
  merge: -1
  img_proc: true
- pgno: 96
  md: '(S/D) binary representation and its genotypic distance. Section 4 proposes
    the new genetic algorithm based on the S/D binary representation, the splicing/Decomposable
    genetic algorithm (SDGA). Section 5 discusses the performance of the SDGA and
    compares the S/D binary representation with other existing binary encodings from
    the empirical studies. The chapter conclusion are drawn in Section 6.


    # 2. Background


    Binary encodings are the most commonly used and nature-inspired representations
    for GEAs, especially for genetic algorithms (GAs) (Goldberg, 1989). When encoding
    real-valued problems by binary representations, different types of binary representations
    assign the real-value in different ways to the binary strings. The most common
    binary representations are the binary, gray and unary encodings. According to
    three aspects of representation theory (redundancy, scaled building block and
    distance distortion), Rothlauf (Rothlauf, 2002) studied the performance differences
    of GAs by different binary representations for real encoding.


    # 2.1 The unary encoding and redundancy


    In the unary encoding, a string of length l = s − 1 is necessary to represent
    s different phenotypic values. The iᵗʰ phenotypic value is encoded by the number
    of ones i − 1 in the corresponding genotypic string. Thus, 2ˡ⁻¹ different genotypes
    only encode s different phenotypes. Analysis on the unary encoding by the representation
    theory reveals that encoding is redundant, and does not represent phenotypes uniformly.
    Therefore, the performance of GAs with the unary encoding depends on the structure
    of the optimal solution. Unary GAs fail to solve integer one-max, deceptive trap
    and BinInt (Rothlauf, 2002) problems, unless larger population sizes are used,
    because the optimal solutions are strongly underrepresented for these three types
    of problems. Thus, the unary GAs perform much worse than GAs using the non-redundant
    binary or gray encoding (Jülstrom, 1999; Rothlauf, 2002).


    # 2.2 The binary encoding, scaled building blocks and hamming cliff


    The binary encoding uses exponentially scaled bits to represent phenotypes. Each
    phenotypic value xₚ ∈ Φₚ = {x₁, x₂, ..., xₛ} is represented by a binary string
    x₉ of length l = log₂(s). Therefore, the genotype-phenotype mapping of the binary
    encoding is one-to-one mapping and encodes phenotypes redundancy-free.


    However, for non-uniformly binary strings and competing Building Blocks (BBs)
    for high dimensional phenotype space, there are a lot of noise from the competing
    BBs lead to a reduction on the performance of GAs. The performance of GAs using
    the binary encoding is not only affected by the non-uniformly scaling of BBs,
    but also by problems associated with the Hamming cliff (Schaffer, 1989b). The
    binary encoding has the effect that genotypes of some phenotypical neighbors are
    completely different. For example, when we choose the phenotypes xₚ = 7 and yₚ
    = 8, both individuals have a distance of one, but the resulting genotypes x₉ =
    0111 and y₉ = 1000 have the largest possible genotypic distance ||x − y||₉ = 4.
    As a result, the locality of the binary representation is partially low. In the
    distance distortion theory, an encoding preserves the difficulty of a problem
    if it has perfect locality and if it does not modify the distance between individuals.
    The analysis reveals that the binary encoding'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'changes the distance between the individuals and therefore changes the complexity
    of the optimization problem. Thus, easy problems can become difficult, and vice
    versa. The binary GAs are not able to reliably solve problems when mapping the
    phenotypes to the genotypes.


    # 2.3 The gray encoding and modification of problem difficulty


    The non-redundant gray encoding (Schaffer, 1989a) was designed to overcome the
    problems with the Hamming cliff of the binary encoding (Schaffer, 1989b). In the
    gray encoding, every neighbor of a phenotype is also a neighbor of the corresponding
    genotype. Therefore, the difficulty of a problem remains unchanged when using
    mutation-based search operators that only perform small step in the search space.
    As a result, easy problems and problems of bounded difficulty are easier to solve
    when using the mutation-based search with the gray coding than that with the binary
    encoding. Although the gray encoding has high locality, it still changes the distance
    correspondence between the individuals with bit difference of more than one. When
    focused on crossover-based search methods, the analysis of the average fitness
    of the schemata reveals that the gray encoding preserves building block complexity
    less than the binary encoding. Thus, a decrease in performance of gray-encoded
    GAs is unavoidable for some kind of problems (Whitley, 2000).


    # 3. A novel splicing/decomposable binary genetic representation


    The descriptions in above section show that the existing binary genetic representations
    are not proper for GAs searching and cannot guarantee that using GAs to solve
    problems of bounded complexity reliably and predictably. According to the theoretical
    analysis and recommendations for the design of an efficient representation, there
    are some important points that a genetic representation should try to respect.
    Common representations for GAs often encode the phenotypes by using a sequence
    of alleles. The alleles can separated (decomposed) into building blocks (BBs)
    which do not interact with each other and which determine one specific phenotypic
    property of the solution. The purpose of the genetic operators is to decompose
    the whole sequence of alleles by detecting which BBs influence each other. GAs
    perform well because they can identify best alleles of each BB and combine them
    to form high-quality over-all solution of the problem.


    Based on above investigation results and recommendations, we have proposed a new
    genetic representation, which is proper for GAs searching. In this section, first
    we introduce a novel splicing/decomposable (S/D) binary encoding, then we define
    the new genotypic distance for the S/D encoding, finally we give the theoretical
    analysis for the S/D encoding based on the three elements of genetic representation
    theory (redundancy, scaled BBs and distance distortion).


    # 3.1 A splicing/decomposable binary encoding


    In (Leung, 2002; Xu, 2003a), we have proposed a novel S/D binary encoding for
    real-value encoding. Assuming the phenotypic domain Φp of the n dimensional problem
    can be specified by


    Φp = [α1, β1] × [α2, β2] × ⋯ × [αn, βn].'
