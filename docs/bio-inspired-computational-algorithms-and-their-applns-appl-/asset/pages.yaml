- pgno: 247
  md: 'partly, to the fact that it is capable of enabling many practical applications
    in artificial intelligence, such as natural language understanding [9], man-machine
    interfaces, help for the impaired, and others; on the other hand, it is an intriguing
    intellectual challenge in which new mathematical methods for feature generation
    and new and more sophisticated classifiers appear nearly every year [10], [11].
    Practical problems that arise in the implementation of speech recognition algorithms
    include real-time requirements, to lower the computational complexity of the algorithms,
    and noise cancelation in general or specific environments [12]. Speech recognition
    can be user or not user dependant.


    A specific case of speech recognition is word recognition, aimed at recognizing
    isolated words from a continuous speech signal; it find applications in system
    commanding as in wheelchairs, TV sets, industrial machinery, computers, cell phones,
    toys, and many others. A particularity of this specific speech processing niche
    is that usually the vocabulary is comprised of a relatively low amount of words,
    for instance, see [13] and [14].


    In this chapter we present an innovative method for the restricted-vocabulary
    speech recognition problem in which a genetic algorithm is used to optimally generate
    the design parameters of a set of bank filters by searching in the frequency domain
    for a specific set of sub-bands and using the Fisher''s linear discriminant ratio
    as the class separability criterion in the features space. In this way we use
    genetic algorithms to create optimum feature spaces in which the patterns from
    N classes will be distributed in distant and compact clusters. In our context,
    each class (ω0, ω1, ω2,..., ωN-1) represents one word of the lexicon. Another
    important part of this work is that the algorithm is required to run in real time
    on dedicated hardware, not necessarily a personal computer or similar platform,
    so the algorithm developed should have low computational requirements.


    This chapter is organized as follows: the section 2 will present the main ideas
    behind the concepts of variable and feature selection; section 3 presents an overview
    of the most representative speech recognition methods. The section 4 is devoted
    to explain some of the mathematical foundations of our method, including the Fourier
    Transform, the Fisher''s linear discriminant ratio and the Parseval''s theorem.
    Section 5 shows our algorithmic foundations, namely the genetic algorithms and
    the backpropagation neural networks, a powerful classifier used here for performance
    comparison purposes. The implementation of our speech recognition approach is
    depicted in section 6 and, finally, the conclusions and the future work are drawn
    in section 7.


    # ## 2. Optimal variable and feature selection


    Feature selection refers to the problem of selecting features that are most predictive
    of a given outcome. Optimal feature generation, however, refers to the derivation
    of features from input variables that are optimal in terms of class separability
    in the feature space. Optimal feature generation is of particular relevance to
    pattern recognition problems because it is the basis for achieving high correct
    classification rates: the better the discriminant features are represented, the
    better the classifier will categorize new incoming patterns. Feature generation
    is responsible for the ways the patterns lay in the features space, therefore,
    shaping the decision boundary of every pattern recognition problem; linear as
    well as non-linear classifiers can be beneficiaries of well-shaped feature spaces.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The recent apparition of new and robust classifiers such as support vector
    machines (SVM), optimum margin classifiers and relevance vector machines [4],
    and other robust kernel classifiers seems to demonstrate that the new developments
    are directed towards classifiers which, although powerful, must be preceded by
    reliable feature generation techniques. In some cases, the classifiers use a filter
    that consists of a stage of feature selection, like in the Recursive Feature Elimination
    Support Vector Machine [15], which eliminates features in a recursive manner,
    similar to the backward/forward variable selection methods [1].


    # ## 2.1 Methods for variable and feature selection and generation


    The methods for variable and feature selection are based on two approaches: the
    first is to consider the features as scalars -scalar feature selection-, and the
    other is to consider the features as vectors -feature vector selection-. In both
    approaches a class separability measurement criteria must be adopted; some criteria
    include the receiver operating curve (ROC), the Fisher Discriminant Ratio (FDR)
    or the one-dimensional divergence [1]. The goal is to select a subset of k from
    a total of K variables or features. In the sequel, the term features is used to
    represent variables and features.


    # ### 2.1.1 Scalar feature selection


    The first step is to choose a class separability measuring criterion, C(K). The
    value of the criterion C(K) is computed for each of the available features, then
    the features are ranked in descending order of the values of C(K). The k features
    corresponding to the k best C(K) values are selected to form the feature vector.
    This approach is simple but it does not take into consideration existing correlations
    between features.


    # ### 2.1.2 Vector feature selection


    The scalar feature selection may not be effective with features with high mutual
    correlation; another disadvantage is that if one wishes to verify all possible
    combinations of the features -in the spirit of optimality- then it is evident
    that the computational burden is a major limiting factor. In order to reduce the
    complexity some suboptimal procedures have been suggested [1]:


    *Sequential Backward Selection.* The following steps comprise this method:


    +   a. Select a class separability criterion, and compute its value for the feature
    vector of all the features.

    +   b. Eliminate one feature and for each possible combination of the remaining
    features recalculate the corresponding criterion value. Select the combination
    with the best value.

    +   c. From the selected K-1 feature vector eliminate one feature and for each
    of the resulting combinations compute the criterion value and select the one with
    the best value.

