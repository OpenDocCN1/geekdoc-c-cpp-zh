  md: "```\nline-crossover(x,y)\n{\n  λ ← a random real number in [0,1];\n  for i\
    \ ← 1 to n\n    z_i ← λx_i + (1 − λ) y_i;\n  return z = (z1,z2,...,zn);\n}\n```\n\
    \nFig. 4. Pseudo-code of line crossover\n\n```\nextended-line-crossover(x,y)\n\
    {\n  m ← −∞, M ← ∞;\n  for i ← 1 to n\n    if x_i ≠ y_i\n      t_i ← (l_i − y_i)/(x_i\
    \ − y_i), t_u ← (u_i − y_i)/(x_i − y_i);\n      t_m ← min(t_i,t_u), t_M ← max(t_i,t_u);\n\
    \      m ← max(m,t_m), M ← min(M,t_M);\n  λ ← a random real number in [max(m−α),\
    \ min(M,1 + α)];\n  for i ← 1 to n\n    z_i ← λx_i + (1 − λ) y_i;\n  return z\
    \ = (z1,z2,...,zn);\n  // α is extension rate.\n}\n```\n\nFig. 5. Pseudo-code\
    \ of extended-line crossover\n\nThe most common form of mutation for real-code\
    \ vectors generates an offspring vector by adding a vector M of random variables\
    \ with expectation zero to the parent vector. There are two types of mutations\
    \ bounded and unbounded depending on the fact that the range of the random variable\
    \ is bounded or unbounded. The most frequently used bounded mutations are the\
    \ creep mutation and the single-variable mutation and for the unbounded case is\
    \ the Gaussian mutation. For the creep (or hyper-box) mutation M ∼ U[(-a,a)]^n\
    \ is a vector of uniform random variables, where a is a parameter defining the\
    \ limits of the offspring area. This operator yields offspring within a hyper-box\
    \ centered in the parent vector. For the single-variable mutation M is a vector\
    \ in which all entries are set to zero except for a random entry which is a uniform\
    \ random variable ∼ U[(-a,a)]. Bounded mutation operators may get stuck in local\
    \ optima. In contrast, unbounded mutation operators guarantee asymptotic global\
    \ convergence. The primary unbounded mutation is the Gaussian mutation for which\
    \ M is a multivariate Gaussian distribution.\n\n# 2.2 Adopted operators for this\
    \ study\n\nAs crossover operators for our analysis, we adopted four representative\
    \ crossovers: box, extended-box, line, and extended-line crossovers. Their pseudo-codes\
    \ are shown in Figures 2, 3, 4, and 5, respectively and the possible range for\
    \ each crossover is represented in Figure 1."
