    # 4.2 CA-IM_1


    For the algorithm proposed (CA-IM) various parameters and symbols are also considered
    such as:


    +   - The parameter P is the size of main population;

    +   - The parameter P_M is the probability of mutation and P_R probability of
    recombination.

    +   - The number of islands is K (number of sub-populations);

    +   - The parameter α is the percentage which defines the size of the population
    of each island at function of P.

    +   - The sub-population size in each island is SI, since SI = α * P.

    +   - The percentage of best individuals in Situational Knowledge on population
    space is represented by SK_P and the percentage of best individuals in Situational
    Knowledge on multi population space is represented by SK_M.

