- pgno: 116
  md: '# Genetic Algorithms: An Overview

    with Applications in Evolvable Hardware


    Popa Rustem

    "Dunarea de Jos" University of Galati

    Romania


    # 1. Introduction


    The genetic algorithm (GA) is an optimization and search technique based on the
    principles of genetics and natural selection. A GA allows a population composed
    of many individuals to evolve under specified selection rules to a state that
    maximizes the "fitness" (i.e., minimizes the cost function). The fundamental principle
    of natural selection as the main evolutionary principle has been formulated by
    Charles Darwin, without any knowledge about genetic mechanism. After many years
    of research, he assumed that parents qualities mix together in the offspring organism.
    Favorable variations are preserved, while the unfavorable are rejected. There
    are more individuals born than can survive, so there is a continuous struggle
    for life. Individuals with an advantage have a greater chance for survive i.e.,
    the "survival of the fittest". This theory arose serious objections to its time,
    even after the discovering of the Mendel''s laws, and only in 1920s "was it proved
    that Mendel''s genetics and Darwin''s theory of natural selection are in no way
    conflicting and that their happy marriage yields modern evolutionary theory" (Michalewicz,
    1996).


    The dynamical principles underlying Darwin''s concept of evolution have been used
    to provide the basis for a new class of algorithms that are able to solve some
    difficult problems in computation. These "computational equivalents of natural
    selection, called evolutionary algorithms, act by successively improving a set
    or generation of candidate solutions to a given problem, using as a criterion
    how fit or adept they are at solving the problem." (Forbes, 2005). Evolutionary
    algorithms (EAs) are highly parallel, which makes solving these difficult problems
    more tractable, although usually the computation effort is huge.


    In this chapter we focus on some applications of the GAs in Digital Electronic
    Design, using the concept of extrinsic Evolvable Hardware (EHW). But first of
    all, we present the genesis of the main research directions in Evolutionary Computation,
    the structure of a Simple Genetic Algorithm (SGA), and a classification of GAs,
    taking into account the state of the art in this field of research.


    # 2. A brief history of evolutionary computation


