  md: 'The DM’s preferences on portfolios (or their social impacts) can be modeled
    from different perspectives, using different methods, and to achieve different
    goals. Selecting one of these options depends on who the DM is (e.g., a single
    person or a heterogeneous group), as well as on how much effort this DM is willing
    to invest in searching for the solution to the problem. Therefore, the information
    about the impact and quality of the projects that constitute a portfolio can be
    obtained from the DM using one of several available alternatives. This requires
    us to consider different modeling strategies and, in consequence, different approaches
    for finding the solution to this problem. We should note that the DM’s preferences
    can be modelled using different and varying perspectives; ranging from the normative
    approach that requires consistency, rationality, and cardinal information, to
    a totally relaxed approach requiring only ordinal information. The chosen model
    will depend on the amount of time and effort the decision maker is willing to
    invest during the modelling process, and on the available information on the preferences.
    Here, we are interested in constructing a functional-normative model of the DM’s
    preferences on the set of portfolios.


    Evolutionary algorithms are powerful tools for handling the complexity of the
    problem (third and fourth issues listed above). Compared with conventional mathematical
    programming, evolutionary algorithms are less sensitive to the shape of the feasible
    region, the number of decision variables, and the mathematical properties of the
    objective function (e.g., continuity, convexity, differentiability, and local
    extremes). Besides, all these issues are not easily addressed using mathematical
    programming techniques (Coello, 1999). While evolutionary algorithms are not more
    time-efficient than mathematical programming, they are often more effective, generally
    achieving satisfactory solutions to problems that cannot be addressed by conventional
    methods (Coello et al., 2002).


    Evolutionary algorithms provide the necessary instruments for handling both the
    mathematical complexity of the model and the exponential complexity of the problem.
    In addition, mathematical decision analysis methods are the main tools for modelling
    the DM’s preferences on projects and portfolios, as well as for constructing the
    optimization model that will be used to find the best portfolio.


    The rest of this chapter is organized as follows. An overview of the functional-normative
    approach to decision making, as well as its use as support for solving selection,
    ranking and evaluation problems is considered in Section 2. In Section 3, we study
    the public portfolio selection problem where a project’s impact is characterized
    by a project evaluation, and the DM uses a normative approach to find the optimal
    portfolio (i.e., the case where maximal preferential information is provided).
    In the same section we also describe an evolutionary algorithm for solving the
    optimization problem. An illustrative example is provided in Section 4. Finally,
    some conclusions are presented in Section 5.


    # 2. An outline of the functional approach for constructing a global preference
