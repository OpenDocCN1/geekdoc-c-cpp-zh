    # 5.3 A Quantum Inspired GA for EHW


    Quantum Inspired Genetic Algorithm (QIGA) proposed in (Popa et al., 2010) uses
    a single chromosome, which is represented like a string of qubits, as is described
    in (Han & Kim, 2002; Zhou & Sun, 2005). A quantum chromosome which contains n
    qubits may be represented as:


    $$q = \begin{bmatrix} \alpha_1 & \alpha_2 & \dots & \alpha_n \\ \beta_1 & \beta_2
    & \dots & \beta_n \end{bmatrix}^T \tag{8}$$


    where each couple $\alpha_i$, $\beta_i$, for $i=1,\dots,n$, are the probability
    amplitudes associated with the $|0\rangle$ state and the $|1\rangle$ state such
    that $\alpha_i^2 + \beta_i^2 = 1$ and the values $\alpha_i^2$ and $\beta_i^2$
    represent the probability of seeing a conventional gene, 0 or 1, when the qubit
    is measured.


    A quantum chromosome can be in all the $2^n$ states at the same time, that is:


    $$|q\rangle = a_0|00\dots0\rangle + a_1|00\dots1\rangle + \dots + a_{2^n-1}|11\dots1\rangle
    \tag{9}$$


    where $a_i$ represents the quantum probability amplitude, and $a_i^2$ is the probability
    of seeing the $i$-th chromosome from the all $2^n$ possible classic chromosomes
    (Zhou & Sun, 2005).'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Due to this superposition of states in a quantum chromosome, we use a single
    chromosome in population. In Conventional Genetic Algorithm (CGA) or Simple Genetic
    Algorithm with the structure given in figure 2, the population has always a number
    of chromosomes, and the efficiency of the algorithm depends usually on the size
    of population. But a quantum chromosome can represent all the possible conventional
    chromosomes at the same time, and so, it may generates an arbitrary population
    of conventional chromosomes each generation. Quantum population will be transformed
    to conventional population when the fitness is evaluated.


    Single Chromosome Quantum Genetic Algorithm (SCQGA) is described in (Zhou & Sun,
    2005). In the first step, a quantum chromosome is generated using (8). A random
    number is compared with probabilities of each qubit, and it collapses to 0, or
    to 1. The conventional population of N chromosomes is obtained by repeating this
    process N times. In the next step, the fitness value is calculated for each conventional
    chromosome. It requires a lot of time, that involves the speed performance of
    the algorithm. The same problem of fitness evaluation and the low speed of the
    algorithm subsists also in CGAs.


    Our idea, which was implemented in QIGA, was to initiate the collapse of the quantum
    chromosome each generation but, from time to time to generate a whole population
    of conventional chromosomes, and in the remaining iterations to generate only
    a single conventional chromosome. A new parameter, which we called the probability
    of collapse, establishes the rate of generating a conventional population during
    the evolution. The last important step of the algorithm is to establish a method
    of updating the quantum chromosome from the current generation to the next one.
    QIGA uses the same method described in (Han, 2003). The idea is to modify the
    probabilities of each quantum gene (or qubit) from the quantum chromosome using
    quantum rotation gate. This operator changes the probability amplitude by altering
    the quantum phase θ to θ + Δθ. The idea for the construction of the rotation gate
    is to make the changing of the entire population (quantum chromosome) to the direction
    of the best individual. Each bit from the best conventional chromosome is compared
    with the adequate bit from the average version of the quantum chromosome (this
    version is build using a probability of 0.5 for each qubit). If the two bits are
    equal with 0 or 1, then Δθ = 0. If the bit of the best chromosome is 1 and the
    other one is 0, then Δθ = α, otherwise Δθ = -α. The angle parameter of the rotation
    gate Δθ may be 0, -α, or α, depending on the position of each qubit in chromosome.
    The parameter α is a positive small parameter, which decides the evolving rate
    (Zhou & Sun, 2005).


    Basic structure of QIGA is given in figure 9, q(t) is the quantum chromosome in
    the iteration t, and P(t) is the population in the same iteration t. This population
    may contain a lot of chromosomes, or only one, depending on the probability of
    collapse in q(t). These three algorithms, CGA, SCQGA and QIGA have been compared
    on the same problem, which consists on synthesis of a boolean function with 4
    variables, using different logic gates. The chromosomes define the connection
    in the network between the primary inputs and primary outputs of the gates, and
    decide the logic operators of the gates. The population of CGA has 64 chromosomes,
    20 of them being changed each generation, and genetic operators use a single point
    100% crossover and 5% rate mutation.


    Figure 10 illustrates the average of evolutions of the three algorithms after
    10 successful runnings on 300 generations. A successful running presumes a fitness
    evaluation of 100%,'
