    # 5. Discussion


    The optimization process is iterative, and it was demonstrated with the tests
    that were realized varying the parameters of the genetic algorithm to analyze
    the behavior of the system, which means that they can be modified until finding
    a system whose behavior satisfies the expectations and requirements of the designer.
    The parameters of the GA usually interact with each other in a nonlinear relation,
    that''s why they cannot be optimized in an independent way, been demonstrated
    in the presented study cases. When existing a change in the population size, this
    fact will be reflected in time of convergence and accuracy in the path generation.


    It was demonstrated that the diversity of individuals in the population is obtained
    and it remains along with the operator of crossing and the genetic mutation, since
    in all the analysis, they allow to find better solutions and avoid premature convergence
    to the maximum premises. Although also it must be mentioned that the elitism and
    the forced inheritance help to limit the number of individuals that will cover
    the imposed restrictions. On the other hand, it was observed that the GA has few
    possibilities of making considerable or necessary a number of reproductions for
    the optimal solution if it has an insufficient or small population.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Besides, the excessive population causes that the algorithm requires of a greater
    time of calculation to process and to obtain a new generation. In fact, there
    is not a limit wherein it is inefficient to increase the size of the population
    since it neither obtains a faster speed in the resolution of the problem, nor
    the convergence makes sure. For the referred study cases in this chapter, when
    increasing the population to 3500 individuals no acceptable results are presented
    and the program became extremely slow. If the population remains so large, like
    for example 1000 individuals, this means that it can improve the performance of
    the algorithm, although this is affected by slower initial responses. It is important
    to do emphasis on the relation that exists among the population size and the probabilistic
    relation in the solution space of the problem.


    The study cases of this work are over determined and nonlinear type, which implies
    by necessity a space of multidimensional, nonlinear and non-homogeneous solution,
    therefore, large initial values cover different regions of the solution space
    wherein the algorithm could converge prematurely to a solution that implies optimal
    premises costs, but when maintaining a low probability of mutation is not possible
    to assure that the population, although extensive in the number of individuals,
    continues being probabilistic representative of the problem solution. With this
    in mind and considering that the computation time to evaluate and to generate
    a new population of individuals from the present initial or, directly is the bound
    to the number of individuals of this one, requires a greater number of operations
    to obtain a new generation of possible solutions.


    # 6. Conclusions


    When operating with a population reduced in number of individuals, a sufficient
    representative quantity of the different regions of the solution space is not
    achieved, but the necessary computation time to create a new generation of possible
    solutions diminishes dramatically. When considering a high percentage of the probability
    of mutation in the algorithm, one assures a heuristic search made in different
    regions of the solution space, this combined with the forced inheritance mechanism
    has demonstrated that for the problem treated in this work, it is a strategy that
    power the heuristic capacities of the GA, for nonlinear multidimensional problems,
    non-homogeneous, becoming the algorithm meta-heuristic; it is demonstrated then
    that an important improvement in the diminution of the error is obtained, around
    20% with respect to the reported works previously. Also it was observed that the
    increase in the percentage of mutation improves the off-line performance, since
    all the solutions in the population are taken into account to obtain the optimal
    value. The off-line performance does not penalize the algorithm to explore poor
    regions of the search space, as long as it contributes to reach the best possible
    solutions in terms of aptitude.


    It was verified that for the crossover the rule is fulfilled of which applying
    values smaller to 0.6, the performance is not optimal and it does not change the
    expected result for a specific problem. In the case of mutation, one demonstrated
    that this one can change no mattering the number of times and increasing its value
    to obtain optimal results, reaching almost at the unit, but avoiding to muter
    totally all the chromosomes eliminating the benefits created by the elitism and
    the forced inheritance mechanism.


    By means of the trial and error, also one concludes that the parameters are not
    independent, and searching systematically to obtain all the possible combinations
    of these, is almost'
