    dynamics, γ = 5, may produce rather inferior detection results. These results
    appear to be a little bit surprising as it is know that for the optimization results
    for regular and chaotic dynamics we do not find such significant differences (33;
    35). A possible explanation is that for random dynamics in the landscape the composition
    of the population is more homogeneous and the population dynamics more random-like.
    This in turn leads to better detector design and hence more effective change detection.


    # 6. Conclusions


    We have presented an immunological approach for solving the change detection problem
    in dynamic fitness landscape. A negative selection algorithm has been used to
    decide on whether or not the fitness landscape has changed. This is solely done
    with fitness information from the population on a sample base. Numerical experiments
    evaluated by receiver-operating characteristics (ROC) curves have shown the efficiency
    of the scheme. An important feature of the approach is that it does not directly
    uses any statistical test on which requirements could be imposed regarding the
    independence of the samples. In future work it would be interesting to compare
    and combine the immunological change detector with statistical tests. This could
    be connected with a study of dynamic fitness landscapes with higher dimension
    and complexity.


