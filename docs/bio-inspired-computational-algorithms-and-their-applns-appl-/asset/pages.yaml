    Fig. 5. The evolution of the output functions of the computer interface


    We have implemented both the traditional design and the evolved circuit in a real
    Xilinx XCR3064 CoolRunner CPLD by using the Xilinx ISE 6.1i software. In traditional
    design, that is using equations (1-7), the FSM used only 7 macrocells from a total
