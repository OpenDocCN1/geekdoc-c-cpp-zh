  md: '# 3.2.2 Inverting the problem


    From our discussion on section 2, one can see that generating a synthetic spectrum
    is a P-problem, as the result is obtained from a set of parameters, and no more
    computing is need. The generation time is obviously finite, and there are a number
    of very efficient software tools that do that. The only care to be taken is to
    assure that the artificial spectrum has the same wavelength resolution of the
    observed spectrum, in order to simplify the future comparison.


    The above mentioned step 4, a methodology to optimize the artificial spectrum,
    is the trick point. If one wants to use GA so solve the abundances problem, it
    is necessary to invert the P-problem, that is, it is necessary to use the artificial
    spectrum generation tool as an external routine of a bigger and more complex algorithm.
    The algorithm used to this task is presented in figure 6.


