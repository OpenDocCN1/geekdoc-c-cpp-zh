  md: '+   c. Compute the covariance matrix, Sᵢ = cov(Cᵢ).

    +   d. At any time, the Mahalanobis distance between the model of the i-th command
    and the feature vector x of an incoming command is:


    dM(x, μᵢ) = (x − μᵢ)ᵀ Σᵢ⁻¹(x − μᵢ)    (44)


    To make the real-time implementation, a digital system must sample the input microphone
    continuously. Each sample of a command must be filtered by each filter (sub-band
    extraction). The integral of the energy of the signal leaving each filter over
    the period of the command is used to create the feature vector of that command,
    that is, x in equation 44. The feature vector is compared to each model in the
    vocabulary, and the command is recognized as the one with the minimum dM score.
    This is the so-called “minimum distance classifier” [5].


