  md: '# 2.2 Solution representation and lower bound


    The solution for the PMS problem is represented as a permutation of integers Π={1,...,
    n} where Π defines the processing order of the jobs. As mentioned in the text
    above, three versions of the PSO algorithm are compared in terms of solution quality
    and CPU time.


    In continuous based PSO by Tasgetiren et al. [17], PSO<sub>SPV</sub>, particles
    themselves do not present permutations. Instead, the SPV rule is used to derive
    a permutation from the position values of the particle. In discrete PSO by Pan
    et al.[21] and the proposed algorithm (SPPSO), on the other hand, the particles
    present permutations themselves.


    | Jobs | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |

    |---|---|---|---|---|---|---|---|---|---|

    | p<sub>i</sub> | 7 | 7 | 6 | 6 | 5 | 5 | 4 | 4 | 4 |


    Table 1. An example of 9-job × 4-machine PMS problem


    For all of the three algorithms, the process of finding makespan value for a particle
    can be illustrated by an example. Namely, let’s assume a permutation vector of
    Π= {1 8 3 4 5 6 7 2 9}. By considering 4 parallel machines and 9 jobs, whose processing
    times are given in Table 1, the makespan value of the given vector is depicted
    in Figure 1.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_384_0.png)


    According to the schedule, each value of the vector is iteratively assigned to
    the most available machine. First four elements of the permutation vector (1,8,3,4)
    are assigned to the four machines respectively. The remaining jobs are assigned
    one by one to the first machine available. For instance, 5 goes to second machine
    (M2), since it is the first machine released. If there is more than one available
    machine at the time, the job will be assigned randomly (ties can be broken arbitrarily).
    The makespan value of the given sequence is C<sub>max</sub>(Π)=14, as can easily
    be seen in figure 1.


    The lower bound for P | C<sub>max</sub> is calculated as follows [22]:


    LB(C<sub>max</sub>) = max { ⌈(1/m) Σ<sub>i=1</sub><sup>m</sup> p<sub>i</sub>⌉
    ; max<sub>i</sub> {p<sub>i</sub>} } (3)


    It is obtained by assuming that preemption is not allowed. If C<sub>max</sub>(Π)=LB(C<sub>max</sub>),
    the current solution(Π) is optimum. So, lower bound will be used as one of the
    termination criteria'
