    The change point definition (5) says that a change in the fitness landscape has
    happened no matter how small and insignificant the alteration in the landscape''s
    topology actually is. From a computational point of view this raises some problems
    regarding practical detectability. Change detection based on population data assumes
    that a change in the fitness landscape affects a substantial number of its points
    and makes them to increase or decrease their fitness values. Moreover, generally
    there is no P(t) ≠ P(t - 1) so that we cannot check if f(p_i, γ^{-1}(t - 1)) ||
    f(p_i, γ^{-1}t) as p_i(t - 1) ≠ p_i(t).


    Another aspect is that the given framework is unsuitable for discriminating between
    small but gradual changes and larger but abrupt changes. Such a distinction can
    only be made in terms of the fitness landscape considered. The treatment and discussion
    presented here is intended to apply for fitness landscapes that undergo abrupt
    and substantial changes in their topology. Hence, it can reasonably be assumed
    that these changes are practically detectable. We exclude small but gradual changes
    in the fitness landscape (for instance those resulting from the presence of noise
    and/or other perturbations in the fitness evaluation process). This is in line
    with the application context of the change detection scheme considered here. It
    should help to trigger and control the diversity enhancement and maintenance of
    the EA. For fitness landscapes with small but gradual changes an additional change-activated
    diversity management does not play a prominent role anyway; other types of EAs
    (particularly those emphasizing robustness such as self-adaption) are found to
    be more apt here.


    As shown above it is generally not possible to verify condition (5) directly.
    The basic idea behind using the fitness values f(p_i,k)|_{k=|γ^{-1}t|} of the
    population''s individuals p_i(t) ∈ P(t) is that these quantities form a fitness
