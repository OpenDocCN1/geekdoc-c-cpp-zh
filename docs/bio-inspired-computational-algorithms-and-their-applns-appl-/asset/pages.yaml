    The first step is to provide formalism in such a way that the protective devices
    net could be represented by a set of genes in a chromosome Λ, and that the Bishop
    (1997) model could be expressed as a P-problem whose parameters are given by Λ.


    The solution chosen was to code the circuit as a series of nodes, designed by
    Ni, with i being an integer number, and to build a list of links between the nodes
    (see figure 11). The special node N0 is the main protective switch in the substation
    (which is present in all solutions). Each link between nodes can have a protective
    device, and its location is designed as Pi,j with i and j being the two nodes
    that define the link. Special data structure is provided to the nodes to storage
    information about the number of phases, number of consumers, distance to neighbours
    nodes, etc.


    The adopted solution considers S as a ordered list of tokens, and the position
    in the ordered list corresponds to a location as Pij. Then, for the circuit of
