    # 5.2 Backpropagation Neural Networks


    Backpropagation is the most popular neural network architecture for supervised
    learning. It features a feed-forward connection topology, meaning that data flow
    through the network in a single direction, and uses a technique called the backward
    propagation of errors to adjust the connection weights Rumelhart, Hinton, and
    Williams 1986 in [23]. In addition to a layer of input and output units, a back-propagation
    network can have one or more layers of hidden units, which receive inputs only
    from other units, and not from the external environment. A backpropagation network
    with a single hidden layer or processing units can learn to model any continuous
    function when given enough units in the hidden layer. The primary applications
    of backpropagation networks are for prediction and classification.


    Figure 7 shows the diagram of a backpropagation neural network and illustrates
    the three major steps in the training process.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_260_0.png)


    Fig. 7. Topology of a backpropagation neural network.


    First, input data is presented to the units of the input layer on the left, and
    it flows through the network until it reaches the network output units on the
    right. This is called the forward pass.


    Second, the activations or values of the output units represent the actual or
    predicted output of the network, because this is supervised learning,'
  merge: -1
