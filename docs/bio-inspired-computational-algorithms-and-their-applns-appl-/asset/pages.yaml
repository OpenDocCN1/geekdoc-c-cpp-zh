  md: '# 5.1 Implementation of a FSM using a standard GA


    This first example uses extrinsic hardware evolution, that is uses a model of
    the hardware and evaluates it by simulation in software. The FSM represented in
    the figure 3 is a computer interface for serial communication between two computers.
    A transition from one state to another depends from only one of the 4 inputs x_i,
    i=1..4. The circuit has 4 outputs, each of them beeing in 1 logic only in a single
    state. The FSM has 6 states and has been presented in (Popa, 2004).


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_121_0.png)


    Fig. 3. A FSM described as state transition graph and manual state assignment


    With the state assignment given in the figure 3, the traditional design with D
    flip-flops gives the following equations for the excitations functions:


    ```

    D2 = x3 · Q1 · Q0 + Q1 · Q0̅ + Q1̅ · Q0̅

    D1 = x2 · Q1̅ · Q0 + x1 · Q0 + Q1 · Q0̅

    D0 = x1 · Q0̅ · Q0̅ + x2 · Q1 · Q0 + Q1 · Q0̅

    ```


    The output functions, are given by the following equations:


    ```

    y1 = Q1̅ · Q0

    y2 = Q2̅ · Q1 · Q0̅

    y3 = Q2 · Q1̅

    y4 = Q2 · Q1

    ```'
