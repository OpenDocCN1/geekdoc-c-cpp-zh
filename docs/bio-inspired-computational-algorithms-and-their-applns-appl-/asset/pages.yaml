  md: '# # Optimal Design of Power System Controller Using Breeder Genetic Algorithm


    K. A. Folly and S. P. Sheetekela


    *University of Cape Town Private Bag, Rondebosch 7701*

    *South Africa*


    # ## 1. Introduction


    Genetic Algorithms (GAs) have recently found extensive applications in solving
    global optimization problems (Mitchell, 1996). GAs are search algorithms that
    use models based on natural biological evolution (Goldberg, 1989). They are intrinsically
    robust search and optimization mechanisms and offer several advantages over traditional
    optimization techniques, including the ability to effectively search large space
    without being caught in local optimum. GAs do not require the objective function
    to have properties such as continuity or smoothness and make no use of hessians
    or gradient estimates.


    In the last few years, Genetic Algorithms (GAs) have shown their potentials in
    many fields, including in the field of electrical power systems. Although GAs
    provide robust and powerful adaptive search mechanism, they have several drawbacks
    (Mitchell, 1996). Some of these drawbacks include the problem of “genetic drift”
    which prevents GAs from maintaining diversity in its population. Once the population
    has converged, the crossover operator becomes ineffective in exploring new portions
    of the search space. Another drawback is the difficulty to optimize the GAs''
    operators (such as population size, crossover and mutation rates) one at a time.
    These operators (or parameters) interact with one another in a nonlinear manner.
    In particular, optimal population size, crossover rate, and mutation rate are
    likely to change over the course of a single run (Baluja, 1994). From the user’s
    point of view, the selection of GAs'' parameters is not a trivial task. Since
    the ‘classical’ GA was first proposed by Holland in 1975 as an efficient, easy
    to use tool which can be applicable to a wide range of problems (Holland, 1975),
    many variant forms of GAs have been suggested often tailored to specific problems
    (Michalewicz, 1996). However, it is not always easy for the user to select the
    appropriate GAs parameters for a particular problem at hand because of the huge
    number of choices available. At present, there is little theoretical guidance
    on how to select the suitable GAs parameters for a particular problem (Michalewicz,
    1996). Still another problem is that the natural selection strategy used by GAs
    is not immune from failure. To cope with the above limitations, an extremely versatile
    and effective function optimizer called Breeder Genetic Algorithm (BGA) was recently
    proposed (Muhlenbein, 1994). BGA is inspired by the science of breeding animals.
    The main idea is to use a selection strategy based on the concept of animal breeding
    instead of “natural selection” (Ibraham & Ismail, 2009). The assumption behind
    this strategy is as follows: “mating two individuals with high fitness is more
    likely to produces an offspring of high fitness than mating two randomly selected
    individuals”.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Some of the features of BGA are:


    +   - BGA uses real-valued representation as opposed to binary representation
    used in classical GAs.

    +   - BGA only requires a few parameters to be chosen by the user.

    +   - The selection technique used is (always) truncation, whereby a selected
    top T% of the fittest individuals are chosen from the current generation and goes
    through recombination and mutation to form the next generation. The rest of the
    individuals are discarded.


    The main advantage of using BGA is its simplicity with regard to the selection
    method (Irhamah & Ismail, 2009) and the fewer parameters to be chosen by the user.
    However, there is a price to pay for this simplicity. Since only the best individuals
    are selected in each generation to produce the children for the next generation,
    there is a likelihood of premature convergence. As a result, BGA may converge
    to local optimum rather than the desired global one. It should be mentioned that
    most of the Evolutionary Algorithms including GA have problems with premature
    convergence to a certain degree. The general way to deal with this problem is
    to apply mutation to a few randomly selected individuals in the population. In
    this work, instead of a fixed mutation rate, we have used adaptive mutation strategy
    (Green, 2005), (Sheetekela & Folly, 2010). This means that the mutation rate is
    not fixed but varies according to the convergence and performance of the population.
    In general, even with fixed mutation rate, BGA may still perform better than GA
    as discussed in (Irhamah & Ismail, 2009).


    The application of Evolutionary Algorithm to design power system stabilizer for
    damping low frequency oscillations in power systems has received increasing attention
    in recent years, see for example, (Wang, et al 2008), (Chuang, & Wu, 2006), (Chuang,
    & Wu, 2007), (Eslami, et al 2010), (Hongesombat, et al 2005), (Folly, 2006), and
    (Hemmati, et al 2010).


    Low frequency oscillations in power systems arise due to several causes. One of
    these is the heavy transfer of power over long distance. In the last few years,
    the problems of low frequency oscillations are becoming more and more important.
    Some of the reasons for this are:


    +   a. Modern power systems are required to operate close to their stability margins.
    A small disturbance can easily reduce the damping of the system and drive the
    system to instability.

    +   b. The deregulation and open access of the power industry has led to more
    power transfer across different regions. This has the effect of reducing the stability
    margins.


    For several years, traditional control methods such as phase compensation technique
    (Hemmati et al, 2010), root locus (Kundur, 1994), pole placement technique (Shahgholian
    & Faiz, 2010), etc. have been used to design Conventional PSSs (CPSSs). These
    (CPSSs) are widely accepted in the industry because of their simplicity. However,
    conventional controllers cannot provide adequate damping to the system over a
    wide range of operating conditions. To cover a wide range of operating conditions
    when designing the PSSs several authors have proposed to use multi-power conditions,
    whereby the PSS parameters are optimized over a set of specified operating conditions
    using various optimization techniques such as sensitivity technique (Tiako & Folly,
    2009), (Yoshimura& Uchida, 2000),'
