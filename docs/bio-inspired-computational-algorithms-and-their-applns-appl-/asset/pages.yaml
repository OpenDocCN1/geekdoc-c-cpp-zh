  md: 'Step 3. Generation of Benders'' Cut. We compute a new linear support using
    the dual solution of the transportation subproblem and increment k by 1.


    Step 4. Primal Master system by GA. A trial location plan Y is to be computed
    by implementing a GA whose solution delivers both a feasible investment plan and
    a lower bound to the minimal cost for the equivalent program.


    4a. Initialization. We initialize the variable Y as a string of binary bit with
    the position #i corresponding to the plant #i. We generate initial population
    and their fitness function are evaluated as well.


    4b. Genetic Operations. We perform a standard single-point crossover approach.
    The mutation operation to guarantee the diversity of the population is performed
    as well. The current population is replaced by the new population through the
    incremental replacement method.


    4c. Termination. We terminate the GA if no improvement within 100 iterations.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_423_0.png)


    Fig. 1. Flowchart of the Hybrid Benders/Genetic Algorithm


    This hybrid algorithm would avoid other traditional search methods, i.e., branch-and-bound,
    which were used in the master problem. It will search the solution space in parallel
    fashion and take advantage of the "easy" evaluation of the fitness function.


