  md: 'After the bidder agent builds the active auctions list, the bidder agent will
    start calculating the current maximum bid based on the agent strategy. The current
    maximum bid is defined as the amount of the agent willing to bid at the current
    time that is lesser than or equal to the agent''s private valuation. Four bidding
    constraints are used to determine the current maximum bid namely the remaining
    time left, the remaining auction left, the desire for bargain and the level of
    desperateness.


    The remaining time tactic considers the amount of bidding time the bidder agent
    has to obtain the desire item. This tactic determines the bid value based on the
    bidding time left. Assuming that the bidding time t is between 0 and t_max (0
    ≤ t ≤ t_max), the current bid value is calculated based on the following expression:


    $f_{\pi} = \alpha_{\pi}(t) P_r$  (1)


    where $\alpha_{\pi}(t)$ is a polynomial function of the form:


    $\alpha_{\pi}(t) = k_r + (1 - k_r) \left( \frac{t}{t_{\max}} \right)^{\frac{3}{\beta}}$  (2)


    This function is a time dependent polynomial function where the main consideration
    is the time left from the maximum time allocated. $k_r$ is a constant that determines
    the value of the starting bid of the agent in any auction multiplied by the size
    of the interval. This time dependent functions can be defined as those that start
    bidding near $p_r$ rapidly to those only bid near $p_r$ right at the end along
    with all the possibilities in between with variation of the value $\alpha_{\pi}(t)$.
    Different shapes of curve can be obtained by varying the values of $\beta$ by
    using the equation defined above. There are unlimited numbers of possible tactics
    for each value of $\beta$. In this tactic, $\beta$ value is defined between 0.005
    ≤ β ≤ 1000. It is possible to have two different behaviors for $\beta$. When $\beta$
    < 1, the tactic will bid with a low value until the deadline is almost reached,
    whereby this tactic concides by suggesting the private valuation as the recommended
    bid value. When $\beta$ > 1, the tactic starts with a bid value close to the private
    valuation and quickly reaches the private valuation long before the deadline is
    reached. Fig. 5 shows the different shape of the curves with varying $\beta$ values.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_279_0.png)


    Fig. 5. The curve with varying β value. (Anthony, 2003)'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The remaining auction left tactic, on the other hand, considers the number
    of remaining auctions that the bidder agent is able to participate in order to
    obtain the item. This tactic bids closer to $p_r$ as the number of the remaining
    auctions decreases when the bidder agent is running out of opportunities to obtain
    the desired item. The current bid value is calculated based on the following expression:


    $$f_{ra} = \alpha_{ra}(t) p_r \tag{3}$$


    where $\alpha_{ra}(t)$ is a polynomial function of form:


    $$\alpha_{ra} = k_{ra} + (1 - k_{ra}) \left( \frac{c(t)}{|A|} \right)^{\frac{1}{\beta}}
    \tag{4}$$


    The polynomial function $\alpha_{ra}$ is quite similar to the terms use in $\alpha_{re}$,
    whereby the only difference between the two function is the $c(t)$. $c(t)$ is
    a list of auctions that have been completed between time 0 and $t$. The $\beta$
    value for this tactic is identical to the remaining time tactic between $0.005
    \le \beta \le 1000$.


    The desire for a bargain tactic is the bidder agent that is interested in getting
    a bargain for obtaining the desired item. In this scenario, the bidder agent needs
    to take into account all the ongoing auctions and the time left to obtain the
    item. The current bid value is calculated based on the following expression:


    $$f_{ba} = \omega(t) + \alpha_{ba}(t)(p_r - \omega(t)) \tag{5}$$


    In the expression above, the variable $\omega(t)$ takes into account all the ongoing
    auctions along with the current bid value. The Dutch and English are considered
    solely in this expression as only these two auctions have current bid value. As
    a consequence, the minimum bid value is calculated based on the current bid value
    and also the proportion of the time left in the auction. These values are summed
    and averaged with respect to the number of active auctions at that particular
    time. The expression for $\omega(t)$ is calculated based on the formula as below:


    $$\omega(t) = \frac{1}{|L(t)|} \left( \sum_{i \in L(t)} \frac{t - \sigma_i}{\eta_i
    - \sigma_i} v_i(t) \right) \tag{6}$$


    where $v_i$ is the current highest bid value in an auction $l$ at time $t$, and
    $l \in L(t)$; $\sigma_i$ and $\eta_i$ is the start and end time of auction $i$


    The expression for $\alpha_{ba}(t)$ is defined as:


    $$\alpha_{ba}(t) = k_{ba} + (1 - k_{ba}) \left( \frac{t}{t_{max}} \right)^{\frac{1}{\beta}}
    \tag{7}$$'
