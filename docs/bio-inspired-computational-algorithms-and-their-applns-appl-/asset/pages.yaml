    Figure 9. Sub-band processing in speech have been previously used, but in different
    manners [32], [33], [34]. A genetic algorithm with elitism is used here to select
    each bandwidth (BW), its central frequency (F_c) and a number of sub-bands. The
    main parameters of the genetic algorithm are listed in table 1. The cost function
    of the GA is an expression aimed at maximizing the Fisher''s linear discriminant
    ratio (FLDR). The use of the FLDR in the cost function ensures'
