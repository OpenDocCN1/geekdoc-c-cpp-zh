  md: 'For the evolutionary design of this circuit we take into account that each
    boolean function has a maximum number of 5 inputs and a maximum number of 4 minterms.
    If we want to implement these functions in a PLD structure (an AND array and logic
    cells configurable as OR gate), then the number of fuse array links is 2·5·4=40,
    and we may to consider this number as the total length of the chromosome (Iba
    et al., 1996).


    Our GA is a standard one, with the population size of 30 chromosomes. One point
    crossover is executed with a probability of 80% and the mutation rate is 2%. Six
    worse chromosomes are replaced each generation. The stop criterion is the number
    of generations.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_122_0.png)


    Fig. 4. The evolution of the excitation functions of the computer interface


    Figure 4 reflects the evolution of the circuit for the first 3 functions, called
    excitation functions, which generate the subcircuit A. However, this circuit is
    built from 3 independent circuits, each generating one output bit. Therefore,
    the evolution of a circuit with one output bit is repeated 3 times. The Y axis
    is the correct answer rate. If it reaches 100%, then the hardware evolution succeeds.


    In the same way, figure 5 reflects the evolution of the circuit for the output
    functions, which generate the subcircuit B. The evolution succeeds after a less
    number of generations because the total search space is in this case much lower
    than in previous case (all the output functions have only 3 variables).


    Evolution may provide some non-minimal expressions for these boolean functions,
    but minimization is not necessary for PLD implementations. The length of the chromosomes
    is greater than the optimal one, and the evolved equations are much more complicated
    than the given equations (1-7). The complete cost of the whole combinational circuit
    is consisted of 15 gates and 37 inputs for traditional design, and 30 gates and
    102 inputs for evolutionary design.'
