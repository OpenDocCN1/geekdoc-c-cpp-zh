    # 4.1.4 The choice of chamber constructive material


    The main material properties, the mass density, $\rho_r$, and stress coefficient,
    $\sigma_r$, can also be chosen by the GA. Instead of working directly with these
    parameters, it was created a material parameter, $K_c$, an integer that points
    to a density-stress database. So, our new parameter set becomes


    $\Lambda = \{t_{cy}, P_j, \rho_r(K_c), \sigma_r(K_c)\} ,$ (14)


    or simply


    $\Lambda = \{t_{cy}, P_j, K_c\} .$ (15)


    As $K_c$ is a discrete value, it was needed to build special routines to manipulate
    the genes in the first generation and in mutation events.


