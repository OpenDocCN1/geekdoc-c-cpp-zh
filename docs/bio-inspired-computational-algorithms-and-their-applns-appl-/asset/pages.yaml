    U = Σ_ik w_ik μ_ik  (6)


    Equation 6 was proposed by Fernandez and Navarro (2002) as a measure of a portfolio’s
    subjective value.


    # 3.3 Synergy and redundancy


    Redundancy between projects can be addressed using constraints. For every pair
    of redundant projects, (p_i, p_j), i < j, condition μ_i(d_i) × μ_j(d_j) = 0 should
    be enforced.


    Let S = {S1, S2, ..., Sk} be the set of coalitions of synergistic projects. In
    a model like the one represented by Equation 5, each of these coalitions should
    be treated as an (additional) individual project. As a result, each coalition
    has an associated cost (i.e., the sum of the costs of the individual projects
    in the coalition), and an evaluation. This evaluation should be better than the
    evaluation of any of the projects in the coalition. Let us assume that coalitions
    S_i and S_j become projects P_N+i and P_N+j, respectively. If S_i is a subset
    of S_j, then it does not make sense to include them both in a portfolio. Therefore,
    P_N+i and P_N+j must be considered redundant projects. Furthermore, if project
    p_k is a member of S_i then the pair (p_k, P_N+i) is also redundant (since the
    value of p_k is included in the value of P_N+i).


    # 3.4 A Genetic algorithm for optimizing public portfolio subjective value


    Suppose that a feasible region of portfolios, R_f, is defined by constraints on
    the total budget and on the distribution of projects by area. In addition, the
    SDM could include further constraints on the portfolios due to following reasons.


    +   - The particular budget distribution of the portfolio could be very difficult
    to justify. Let us suppose that the SDM asserts that “project p_i is much better
    than project p_j”. In consequence, any portfolio in which μ_i is greater than
    μ_j could be unacceptable. This implies the existence of some veto situations
    that can be modeled with the following constraint. For every project pair p_i
    and p_j being s_i and s_j their corresponding evaluations, if (s_i - s_j) ≥ v_s,
    then (μ_i (d_i) - μ_j (d_j)) must be greater than (or equal to) 0, where v_s is
    a veto threshold. In the following they will be called veto constraints.

    +   - A possible redundancy exists between projects.


    Let us use R''_f, R''_f ⊂ R_f, to denote the set of values for the decision variables
    that make every portfolio acceptable. All the veto constraints are satisfied in
    R''_f and there are no redundant projects in the portfolios belonging to this
    region. The optimization problem can now be defined as follows.


    Problem definition 2. An optimal portfolio can be selected by maximizing U = Σ_ik
    f_i,k (μ_i,k (d_i,k)) w_i,k, subject to d ∈ R''_f, where d_i,k indicates the financial
    support assigned to the k-th project belonging to the i-th category.'
