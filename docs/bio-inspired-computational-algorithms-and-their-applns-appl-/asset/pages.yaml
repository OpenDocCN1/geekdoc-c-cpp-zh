  md: 'This problem is entirely based on discrete elements – there are no floating
    point parameters. So, the main discussion here is how to build a chromosome syntax
    that can be used under the GA rules, and still be meaningful for the model. Besides,
    as the problem is fully discretized, there are high probabilities of finding different
    solutions that are equally evaluated in their adaptation function. This leads
    to new enhancements in the model to better evaluate the solutions, enhancing the
    separation between different individuals.


    # 5.1 Using GA in the allocation of electric power protective devices


    This subsection is based on the published work Automatic Allocation of Electric
    Power Distribution Protective Devices (Burian et al. 2010).


    The measurement of how well the electric power distribution system can provide
    a secure and adequate supply of power to satisfy the customer’s requirements is
    called “reliability”. Regarding electric power distribution systems, the electric
    utilities companies are responsible for the most reliable service as possible,
    reflecting the most advanced state of technology with reasonable cost to the end
    product that is the electric power³. Most utilities record outage information
    such as the number of outages, elapse time, and the number of customers interrupted.
    These data and statistics may be reported for each circuit or operating division,
    for comparison purposes, using the standard performance indices.


    The performance indices provide historical datum which can be used to determine
    increasing or decreasing trends and to measure whether system improvement plans
    have yielded expected results.


    The quality model we consider in this subsection uses the following indices, based
    on the sustained outage data: the SAIDI and SAIFI indexes, explained as follows:


    +   1. SAIDI (System Average Interruption Duration Index): defined by the rate
    of average interruption duration per customer served per year. This index is commonly
    referred to as minutes of interruption per customer.

    +      SAIDI = Sum of Customer Interruption Durations / Total Number of Customers
    Served (29)

    +   2. SAIFI (System Average Interruption Frequency Index): that defined by the
    rate of average number of times that a customer’s service is interrupted during
    a reporting period per customer served in a given period (usually one year). A
    customer interruption is defined as one sustained interruption to one customer:

    +      SAIFI = Total Number of Customer Interruptions / Total Number of Customers
    Served (30)


    It is easy to see that what is desired is a circuit with minimal SAIDI and SAIFI
    with the smaller cost in protective installed devices. The resulting circuit with
    these characteristics will the optimized circuit.'
