- pgno: 350
  md: 'interfering population dynamics. An evolving population moves (ideally and
    in the best case) monotonically towards the optima and in doing so changes its
    mean and standard deviation. Such a convergence behavior of the EA which is desired
    and the intended working mode is again a statistical phenomenon. Moreover, the
    fitness values of F(t) are a direct result of the values of F(t − 1) and therefore
    can hardly be regarded as independent of each other. A second aspect is the reaction
    of a change in the fitness landscape, which more likely can be seen as independent
    if the dynamics is a stochastic process. For all these reasons we look for an
    alternative to statistical hypothesis testing. So, we intend to use ideas from
    artificial immunology for solving the change detection problem in dynamic fitness
    landscapes.


    # 4. The immunological change detector


    Artificial immune systems (AIS) are soft computing algorithms that take their
    inspiration from and mimicking working principles and functions of their biological
    counterparts (43; 44). AIS date back to the 80s (11) and were initiated by an
    increasing theoretical understanding of the natural immune system in connection
    with a strong interest in utilizing biological processes for computational proposes.
    These algorithms are capable of adaption, learning and memory and have been applied
    to problem solving in areas as different as classification, pattern recognition
    and data mining/analysis (6; 13; 18; 43). Among the different types of AIS, negative
    selection algorithms acclaimed a prominent role in solving so-called anomaly detection
    (7; 10; 13; 18; 42). Here, anomaly detection means to distinguish the normal behavior
    of a dynamic process, usually characterized by some (external) model, from anomalies
    defined by deviations from that model. In the following, we review negative selection
    and show how it can be used for detecting change in dynamic fitness landscapes.


    Negative selection is anchored at the concept of a shape space that represents
    the observable features of the dynamic process for which a change in behavior
    needs to be detected. Within that shape space, we define a set of self elements
    that stem from the normal behavior. From these self elements, in turn, a set of
    detectors is derived that must not match any sample of the self set, usually by
    using some training data. Subsequently, the detectors are taken to decide if an
    incoming new feature data from the dynamic process is normal (self) or not (non-self).
    Thus, negative selection mimics the self/non-self discrimination of the natural
    immune system, see Fig. 1 which shows self and non-self elements in a two-dimensional
    shape space. We now describe the main components of the negative selection algorithm:
    shape space, affinity measure, detector generation and detection process.


    # i.) Shape space.


    The shape space of a negative selection algorithm is a representation of the data
    coming from the dynamic process under study and can be either a string over a
    finite alphabet (for instance a binary string, which has been used in a large
    number of previous works, see e.g. (18)) or real-valued (13). As the base for
    the change detection, the fitness distribution F(t), is real-valued it seems straightforward
    to use a real-valued shape space S = [0,1]^m here, where m is its dimension. Dimensionality
    of the shape space is an important parameter influencing computational effort
    and performance of the detection scheme (42). The dimensionality of the fitness
    distribution F(t) equals the number of individuals in the population μ. So, for
    the reason given above, it appears sensible to pre-process the data from the fitness
    distribution with the aims of both reducing dimensionality and extracting the
    most meaningful information about when the landscape has changed.'
