  md: 'where,

    α: zooming factor, β: improvement factor

    N_VAR: dimension of the solution, N_ZOOM: number of zooms

    N_SIF: number of sub-iterations, N_POP: number of populations

    N_SF: total number of individuals during the sub-iterations (N_SF=N_SUB×N_POP)


    Three parameters control the performance of the SZGA: the zooming factor α, number
    of zooming operations N_ZOOM, and sub-iteration population number N_SF. According
    to previous research, the optimal parameters for SZGA, such as the zooming factor,
    number of zooming operations, and sub-iteration population number, are closely
    related to the number of variables used in the optimization problem.


    # 2.1 Selection of parameters in the SZGA


    The zooming factor α, number of sub-iteration population N_SF, and number of zooms
    N_ZOOM of SZGA greatly affect the possibility of finding an optimal solution and
    the accuracy of the found solution. These parameters have been selected empirically
    or by the trial and error method. The values assigned to these parameters determine
    the reliability and accuracy of the solution. Improper values of parameters might
    result in the loss of the global optimum, or may necessitate a further search
    because of the low accuracy of the optimum solution found based on these improper
    values. We shall optimize the SZGA itself by investigating the relation among
    these parameters and by finding the optimal values of these parameters. A standard
    way of selecting the values of these parameters in SZGA, considering the dimension
    of the solution, will be provided.


    The SZGA is optimized using the zooming factor α, number of sub-iteration population
    N_SF, and the number of zooms N_ZOOM, for the target reliability of 99.9999% and
    target accuracy of 10^6. The objective of the current optimization is to minimize
    the computation load while meeting the target reliability and target accuracy.
    Instead of using empirical values for the parameters, we suggest a standard way
    of finding the optimal values of these parameters for the objective function,
    by using any optimization technique, to find the optimal values of these parameters
    which optimize the SZGA itself. Thus, before trying to solve any given optimization
    problem using SZGA, we shall optimize the SZGA itself first to find the optimal
    values of its parameters, and then solve the original optimization problem to
    find the optimal solution by using these parameters.


    After analyzing the relation among the parameters, we shall formulate the problem
    for the optimization of SZGA itself. The solution vector is comprised of the zooming
    factor α, the number of sub-iteration population N_SF, and the number of zooms
    N_ZOOM. The objective function is composed of the difference of the actual reliability
    to the target reliability, difference of the actual accuracy to the target accuracy,
    difference of the actual N_SF to the proposed N_SF, and the number of total population
    generated as well.


    F(α, N_SF, N_ZOOM) = ΔR_SZGA + ΔA + ΔN_SF + (N_SF × N_ZOOM) (2)


    where,

    ΔR_SZGA : difference to the target reliability'
