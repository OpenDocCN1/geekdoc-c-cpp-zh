- pgno: 353
  md: 'benefits of the schemes (correctly identified instances according to the classification)
    and costs (incorrect identifications). That makes them particularly useful to
    assess change detection schemes. The classification here is between positive and
    negative change detections. Hence, we can define the following performance metrics.
    If there is a positive detection and a change in the fitness landscape has happened,
    it is counted as true positive (tp), if a change happened but is not detected,
    it is a negative positive (np). If, on the other hand, no change has happened
    and the detection is negative, it is a true negative (tn), a positive detection
    in this situation yields a false negative (fn). For this two-by-two change classification,
    we obtain as the elements of performance metrics: the tp rate


    $tp \approx \frac{\text{correctly identified changes}}{\text{total changes}}$
    (8)


    and $fn = 1 - tp$ as well as the $fp$ rate


    $fp \approx \frac{\text{incorrectly identified changes}}{\text{total non changes}}$
    (9)


    and $tn = 1 - fp$. In the ROC plot, the $tp$ rate is given (on the ordinate) versus
    the $fp$ rate (on the abscissa). Hence, the $tp$ and $fp$ rates for the immunological
    change detector for a given threshold value $\bar{\vartheta}$ give a point in
    the ROC space; ROC curves are obtained by plotting the rates for varying the threshold
    value $\bar{\vartheta}$.


    # 5. Experimental results


    In the following we report numerical experiments with the change detection schemes
    described above. In the experiments, we use as dynamic fitness landscape a “field
    of cones on a zero plane”, where $N$ cones with coordinates $c_i(k)$, $i = 1,
    \dots, N$, are moving with discrete time $k \in \mathbb{N}_0$. These cones are
    distributed across the landscape and have randomly chosen initial coordinates
    $c_i(0)$, heights $h_i$, and slopes $s_i$, see Fig. 2. So, we get


    $f(x,k) = \max\left\{ 0, \max_{1 \leq i \leq N} \left\{ h_i - s_i \| x - c_i(k)
    \| \right\} \right\},$ (10)


    where the number of cones is $N = 50$ and its dimension $n = 2$. The dynamics
    of the moving sequence for the cones’ coordinates is mostly normally random, that
    is each $c_i(k)$ for each $k$ is an independent realization of a normally distributed
    random variable. In the last set of experiments we also consider different kinds
    of dynamics, namely regular, circle-like (and hence completely predictable) dynamics
    where the cones’ coordinates form a circle and so return to the same place in
    search space after a certain amount of time, and chaotic dynamics where the cones’
    coordinates follow the trajectory of a nonlinear dynamical system with chaotic
    behavior, see (30) for details of this kind of setting of landscape dynamics.


    Further, we employ an EA with a fixed number of $\lambda = 48$ individuals that
    uses tournament selection of tournament size 2, a fitness-related intermediate
    sexual recombination (which is operated $\lambda$ times and works by choosing
    two individuals randomly to produce offspring that is the fitness-weighted arithmetic
    mean of both parents) and a standard mutation with the mutation rate 0.1. Note
    that the choice of the EA is of secondary importance as long as it'
