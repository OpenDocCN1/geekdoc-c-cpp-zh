    # 3.2 Abundances and Metallicities of young stars via Spectral Synthesis


    This subsection is based on the published work The use of Genetic Algorithms and
    Spectral Synthesis in the Calculation of Abundances and Metallicities of T Tauri
    stars (Hetem & Gregorio-Hetem 2009).


    In the previous subsection, we presented a method that uses a calculation technique
    based on GA aiming to optimize the parameters estimation of protoplanetary disks
    of T Tauri stars. Inspired by the success of that application, which gives accurate
    and efficient calculations, we decided to develop a similar method to determine
    atomic stellar abundances.


    # 3.2.1 Artificial spectra as a measurement tool


    In astrophysics, the absorption spectra are obtained and employed as an analytical
    chemistry tool to determine the presence of atoms and ions in stellar atmospheres
    and, if possible, to quantify the amount of the atoms present. In stellar atmospheres,
    each element produces a number of spectrum absorption lines, at wavelengths which
    can be measured with extreme accuracy when compared to spectra emission tables
    provided by laboratory experiments.


    The presence of a given element in the star atmosphere can be verified (and measured)
    by looking for its absorption lines at the correct wavelength. The hydrogen is
    present in all stars by its Balmer absorption lines, and is often used to calibrate
    the measurements. An example of a high-resolution spectrum is presented in figure
    5.


    The way astrophysics use to calculate the abundances of atoms in stars follows
    the steps:


    +   1. Obtain the star spectrum in a given range (or ranges) of wavelength, where
    the lines of the elements in study should be;

    +   2. Generate an artificial spectrum, considering the lines whose origin are
    the desired elements and the known physics of absorption line production;

    +   3. Compare the artificial and observed spectra. Here a simple χ² test is enough
    to compute a general comparison index;

    +   4. Use a GA methodology to optimize the artificial spectrum in order to minimize
    the differences with the observed spectrum (the inverted problem, subsection 2.1);

    +   5. Once the optimization methodology reaches its goals, consider the elemental
    parameters (density, temperature, ionization, etc) as the measures of the elements
    in the stellar atmospheres.'
