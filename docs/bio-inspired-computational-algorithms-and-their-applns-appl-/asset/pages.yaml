    # 3.3 Genetic algorithm


    # 3.3.1 Representation


    Floating point encoding is applied in this particular work as floating point encoding
    has shown to produce faster, more consistent and more accurate results (Janikow
    & Michalewicz, 1991). The floating encoding is, therefore, represented using an
    array of structure. The individuals that are represented in a floating point array
    structure are shown in Table 1.'
