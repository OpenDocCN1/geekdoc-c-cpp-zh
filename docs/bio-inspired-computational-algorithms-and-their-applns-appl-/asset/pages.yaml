  img_proc: true
- pgno: 138
  md: '![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_138_0.png)


    Fig. 3. Initial Population of Individuals GA (generation "0")


    # 3.2 Production operators


    The production operators are applied to each new generation. One or two individuals
    can be taken to produce new individuals for next generation by applying the transformations
    imposed by the operator. Both mutation operators and crossover will be implemented
    indistinctly. Both operators depend on a mutation probability and / or cross that
    is assigned to GA [7].


    *A mutation operator is applied on nodes (documents), selecting an individual
    from the population using the tournament method, and then randomly select a pair
    of terminal nodes of that individual to mutate its terminal nodes, generating
    a new individual transposing the nodes that have been chosen (see figure 4).*


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_138_1.png)


    Fig. 4. Basic mutation operator applied to terminal'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'For the crossover operator, an operator based on mask crossover [9] is applied,
    which selects through tournament method two parent individuals, randomly chooses
    the chromosome of one parent to be used as "crossover mask of the selected individual".
    The crossing is done by analyzing the chromosome of both parents. If both chromosomes
    have at least one function node (node 0), the chosed father mask is placed, but
    if we find documents in the chromosomes of both parents, then, the father "not
    elected" document will be selected and we''ll use it as pivot on the father "elected"
    (mask) to make the crossing that corresponds to the mentioned father, while interchanging
    the chromosomes of the mentioned father. This creates a new individual, and ensure
    that in the given chromosome set there are the same structural characteristics
    of the parents but we only incorporate it in the population if the child has a
    better fitness than their parents. (see figure 5).


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_139_0.png)


    Fig. 5. Crossover operator (crossover mask)


    # 3.3 Selection


    After we evaluate population''s fitness, the next step is chromosome selection.
    Selection embodies the principle of ''survival of the fittest'' [5]. Satisfied
    fitness chromosomes are selected for reproduction, for it, we apply the method
    of selection of the tournament, using a tournament of 2, and we apply Elitism
    in each generation [2].


    # 4. Parameter control


    For its size, and the influence that small changes have on the behavior of the
    GA during the experiments [1], the choice of parameter values that are going to
    be used appears as a critical factor. For their election we paid attention to
    the variation of the GA performance indicators when it changed the value of any
    of these, specifically the evolution of the successes and the evolution of ''fitness''.
    Therefore, these parameters are very important parts as they directly influence
    the performance of the GA [13]. These parameters can be treated independently,'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'but the overall performance of the algorithm does not depend exclusively on
    a single parameter but on a combination of all parameters. Many researchers pay
    more attention to some parameters than others, but most agree that the parameters
    that should be under controlare: selection schemes, population size, genetic variation
    operators and rates of their chances.


    Because GA have several parameters that must be carefully chosen to obtain a good
    performance and avoid premature convergence, in our case and after much testing,
    we opted for the control of parameters, and some strategies such as:


    To control the population size we use the strategy called GAVAPS (Genetic variation
    in population size) proposed by Michalewicz [9] using the concept of age and lifetime.
    When creating the first generation all individuals are assigned a zero age, referring
    to the birth of the individual, and every time a new generation is born the age
    of each individual increases by one. At the same time an individual is born it
    is assigned a lifetime, which represents how long it will live within. Therefore,
    the individual will die when it will reach the given age. The lifetime of each
    individual depends on the value of its fitness compared to the average of the
    entire population. Thus, if an individual has better fitness will have more time
    to live, giving it greater ability to generate new individuals with their features.
    In our case, we allow each generation to generate new individuals with similar
    characteristics with this strategy.


    Therefore, we adopt this approach essentially the best individuals from each generation,
    and apply it to maintain elitism in the following generations, thus ensuring optimum
    intensification of available space, while keeping them during their lifetime [9].
    However, to ensure diversity we randomly generate the remaining individuals in
    each generation. This way, we explore many different regions of the search space
    and allow for balance between intensification and diversity of feasible regions.


    In all cases, the population size has been set at 50 individuals for the experiments
    conducted with samples following the suggestion of [1], which advises working
    with a population size between l and 2l in most practical applications (the length
    of chromosome l) In our case, "l" the length of our chromosome is always equal
    to:


    2 * number of documents to cluster -1.


    On the hand, we use two measures of function fitness to calculate the distance
    and similarity between documents and to be able to form better cluster (see table
    1).


    Table 1. Measures of the Function


    | Distance Euclidean | $d_y = \sqrt{\sum_{i=1}^n (x_a - x_j)^2}$ |

    | Coefficient of correlation of Pearson (Similarity) | $r = \frac{1}{n} \sum \left(
    \frac{x_i - \bar{x}}{\sigma_{x_i}} \right) \left( \frac{x_j - \bar{x}}{\sigma_{x_j}}
    \right)$ |

    | Fitness Global | Min $(\alpha \text{ Distance(Documents } i) + (1 - \alpha)
    (1/ \text{Similarity(Documents } i)))$ |'
