    # 4.3 Six bar mechanisms optimization


    There are two main six-link configuration mechanisms Watt and Stephenson type,
    whose features make them suitable for the manufacture of polycentric prostheses
    such as (Radcliffe, 1977, Dewen et al., 2003).


    The first example illustrates a six-bar mechanism for covering 21 precision points.
    To evaluate the effectiveness of the analyzed mechanism a Watt-I type will follow
    a path with arbitrarily proposed restrictions on the initial 18 points, being
    the conditions reported in table 4.


    Figure 9 presents the proposed path to be followed by the Watt-I type mechanism.
    As in the previous cases, settings in population, crossing and mutation probability,
    time and number of generation analysis, will be varied in order to demonstrate
    that these adjustments are not independent and that they are affected each other.'
