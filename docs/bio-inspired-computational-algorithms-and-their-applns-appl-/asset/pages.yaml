  md: 'Establishing the abundances of each element as the parameters to be found,
    one individual in the GA terminology is the set of all elemental abundances added
    to some atmospheric parameters. The initial parameter set is used to build the
    first generation with 100 individuals. The evaluator routine creates a synthetic
    spectrum whose entries are the genetic data in each chromosome. This task is performed
    by calling the elected spectral tool.


    There are a number of very efficient software tools that can be chosen. In our
    application, the abundances of chemical species are determined by using the spectral
    synthesis software SPECTRUM provided by Corbally (Gray & Corbally 1994) and the
    atmosphere model software ATLAS9 from Kurucz (1993).


    # 3.2.3 Results


    In this section we present the results of the GA method for three stars, whose
    high-resolution spectra were obtained at European Southern Observatory (ESO) in
    La Silla, Chile, with the Fibber Extended Range Optical Spectrograph (FEROS) at
    the 1.52m telescope. The stellar parameters (effective temperature and gravity)
    were calculated by excitation and ionization equilibrium of iron absorption lines
    (Rojas et al. 2008). The atomic and molecular line data were mainly from the National
    Institute of Standards and Technology¹ and the Kurucz site². The solar atomic
    abundances are from Grevesse & Sauval (1998), and the hyperfine structure constants
    were taken from Dembczynski et al. (1979) and Luc & Gerstenkorn (1972). The atmosphere
    models where obtained from the Kurucz library. Specific atmosphere models were
    calculated through a GNU-Linux porting of the ATLAS9 program (Kurucz 1993).


    The method performs a multi-range fitting of specific regions of the observed
    spectrum, looking for best fit. The demands and commands to SPECTRUM are only
    those for generating the specific regions of interest, but the χ² comparing index
    is evaluated over all wavelength ranges. Figures 7 and 8 present the results for
    some stars on chosen lines.


    The metallicities and abundances found for the stars are compatible with those
    previously obtained for this particular sample. These preliminary results, achieved
    by using the GA technique, indicate the efficiency of the method. In the future,
    we intend to use the method in a larger sample of T Tauri stars.


    # 4. Applications on Rocket Engine engineering


    This section presents two solutions in applying GAs in the aerospace area, both
    concerning the fuel pumping in liquid propellant rocket engines. There are many
    choices to be done in the design of a high performance fuel pump, being one of
    them the type of pump.


    Two different types of pumps were modelled: the Harrington pumps and the turbo
    pumps. Both present a complex design methodology, which includes: tabled functions
    interpolations, numerical integrals and constructive material choices.


