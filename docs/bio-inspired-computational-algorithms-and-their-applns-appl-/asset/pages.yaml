    # 4.2 Using GA to parameterize the design of turbo pumps to be used in rocket
    engines


    This subsection is based on the published work Parametric Design of Rocket Engine
    Turbo pumps with Genetic Algorithms (Burian et al. 2011).


    Turbo pumping in high-thrust, long-duration liquid propellant rocket engine applications,
    generally results in lower weights and higher performance when compared to pressurized
    gas feed systems. Turbo pump feed systems require only relatively low pump-inlet
    pressures, and thus propellant-tank pressures, while the major portion of the
    pressure required at the thrust chamber inlets is supplied by the pumps, saving
    considerable vehicle weight. As stated by Huzel & Huang (1967) the best performing
    turbo pump system is defined as that which affords the heaviest payload for a
    vehicle with a given thrust level, range or velocity increment: gross stage take-off
    weight; and thrust chamber specific impulse (based on propellant combination,
    mixture ratio, and chamber operating efficiency).


    The particular arrangement or geometry of the major turbo pump components is related
    to their selection process (Logan & Roy 2003). Some complex designs, like the
    SSME-Space Shuttle Main Engine, have a multiple stage pump, but most propellant
    pumps have a single-stage main impeller. Eventually, one or more design limits
    are reached which requires more iteration, each with a new changed parameter or
    approach. For a better example, see table 5 which presents some data from the
    V2 (II world war German missile) alcohol pump.


