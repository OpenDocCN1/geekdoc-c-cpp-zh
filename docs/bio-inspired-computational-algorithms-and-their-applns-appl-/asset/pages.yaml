- pgno: 402
  md: '(Reynolds & Chung, 1996). As a result, CAs can provide an explicit mechanism
    for global knowledge and a useful framework within which to model self-adaptation
    in an EC system. The CAs are based on knowledge of an evolutionary system that
    implements a dual mechanism of inheritance. This mechanism allows the CAs to explore
    as much microevolution as macroevolution. Microevolution is the evolution that
    happens in the population level. Macroevolution occurs on the culture itself,
    i.e. the belief space evolution. The belief space is the place where the information
    on the solution of the problem is refined and stored. It is acquired through the
    population space over the evolutionary process. The belief space has the goal
    to guide individuals in search of better regions. In the CAs evolution occurs
    more quickly than in population without the mechanism of macroevolution. The characteristics
    and behaviors of individuals are represented in the Population Space and as mentioned
    earlier the population space can support any population-based computational model
    such as Genetic Algorithms among others (Jin & Reynolds, 1999). The communications
    protocols dictate the rules about individuals that can contribute to knowledge
    in the Belief Space (function of acceptance) and how the Belief Space will influence
    new individuals (Function of Influence), as shown in Figure 2.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_402_0.png)


    Fig. 2. Framework of Cultural Algorithm (Reynolds & Peng, 2004).


    The two most used ways to represent knowledge in the belief space are (Reynolds
    & Peng, 2004): Situational Knowledge and Normative Knowledge. Situational Knowledge
    represents the best individuals found at a certain time of evolution and it contains
    a number of individuals considered as a set of exemplars to the rest of the population.
    The number of exemplars may vary according to the implementation, but it is usually
    small. For example, the structure used to represent this type of knowledge is
    shown in Figure 3. Each individual is stored within its parameters and fitness
    value (Iacoban et al. 2003).


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_402_1.png)


    Fig. 3. Representation of Situational Knowledge.


    The Situational Knowledge is updated when the best individual of the population
    is found. This occurs when its fitness value exceeds the fitness value of the
    worst individual stored.'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'Normative Knowledge represents a set of intervals that characterize the range
    of values given by the features that make the best solutions (Jacoban et al.,
    2003).


    Figure 4 shows the structure used by Reynolds and his students, where are stored
    the minimum and maximum values on the individual''s characteristics.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_403_0.png)


    Fig. 4. Representation of Normative knowledge


    These intervals are used to guide the adjustments (mutations) that occur in individuals.
    With these minimum values, (li) and maximum values (ui), the fitness values are
    also stored. This value results from the individuals that produced each extreme
    Li and Ui respectively.


    The adjustment of the range of Normative Knowledge varies according to the best
    individual. That is, if the individual was accepted by the acceptance function
    and its range is less than the range stored in the belief space, the range is
    adjusted, and vice versa.


    The resolution of problems produces experiences from individuals in the population
    space, which are selected to contribute to the acceptance by the belief space,
    where the knowledge is generalized and stored. In the initial population, the
    individuals are evaluated by the fitness function. Then, the information on the
    performance of the function is used as a basis for the production of generalizations
    for next generations. The experiences of the individuals selected will be used
    to make the necessary adjustments on the knowledge of the current belief space.


    # 2.4 Parallel Genetic Algorithms


    The definition of Parallel Genetic Algorithms (PGAs) is related with execution
    of various GAs in parallel mode. The main goal of PGAs is to reduce the large
    execution times that are associated with simple genetic algorithms for finding
    near-optimal solutions in large search spaces and to find better solutions.


    The PGAs can be implemented through two approaches (Sivanandam, 2007): standard
    parallel approach and the decomposition approach. In the first approach, the sequential
    GA model is implemented on a parallel computer by dividing the task of implementation
    among the processors. The standard parallel approaches are also known as master-slave
    GAs. In the decomposition approach, the full population exists in distributed
    form. Other characteristic in the decomposition approach is that the population
    is divided into a number of sub-populations called demes. Demes are separated
    from one another and individuals compete only within a deme. An additional operator
    called migration is used to move the individuals from one deme to another. If
    the individuals can migrate to any other deme, the model is called island model
    or Multiple-population GAs when implemented in parallel or distributed environments
    (Braun, 1991). Migration can be controlled by various parameters'
