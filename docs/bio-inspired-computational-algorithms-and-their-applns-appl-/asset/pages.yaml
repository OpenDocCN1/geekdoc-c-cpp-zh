    conserve the better one of each pair into next generation according to the fitness
    calculated by the whole S/D binary string for high accuracy. Thus, the bits contributed
    to high fitness in the convergence window USBB will be preserved, and the diversity
    at the low scaled USBBs'' side will be maintain. The mutation will operate on
    the convergence window and not yet converged USBBs according to the mutation probability
    to increase the diversity in the population. These low salient USBBs will converge
    due to GAs searching to avoid the noise from the competing BBs. The implementation
    pseudocode for SDGA algorithm is shown in Figure 5.


    Since identifying high-quality bits in the convergence window USBB of GAs is faster
    than that GAs on the non-uniform BB, while no noise from the competing BBs occurs.
    Thus, population can efficiently converge to the high-quality BB in the position
    of the convergence window USBB, which are a component of overrepresented optimum
    of the problem. According to theoretical results of Thierens (Thierens, 1995),
    the overall convergence time complexity of the new GA with the S/D binary representation
    is approximately of order O(l / √n), where l is the length of the S/D binary string
    and n is the dimensions of the problem. This is much faster than working on the
    binary strings as a whole where GAs have a approximate convergence time of order
    O(l). The gain is especially significant for high dimension problems.


    # 5. Empirical verification


    In this section we present an empirical verification of the performance differences
    between the different genetic representations and operators we described in the
    previous sections.'
