    # ### 6.1 Methodology


    Figure 8 shows a block diagram of the whole speech recognition system. The system
    works in two phases: training and operation. The blocks of the training-phase
    are described below.


    **Lexicon Acquisition and Normalization.** In this stage, the set L = {w_0,w_1,w_2,...,
    w_M} of M words that will comprise the lexicon to be recognized is acquired from
    the speaker(s) that will use the system; vectors containing the digitized versions
    of the voice signals will be at the disposal of the next stage.


    **Power Spectrum.** The power spectrum has been traditionally the source of features
    for speech recognition; here, the power spectrum of the voice signals will be
    used by the genetic algorithm to determine discriminant frequency bands.


    **Optimal Feature Generation.** The features selected here are a) the energy E
