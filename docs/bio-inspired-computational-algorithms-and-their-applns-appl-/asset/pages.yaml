    # 4.1 Main results of the Box Jenkins methodology


    Univariated TS were analyzed by the Box-Jenkins (BJ) methodology from the formulation
    of equations in differences with a random additive component denominated white
    noise. For these BJ models the conditions in which is presented the stationarity
    property of the series and the scheme that has to be follow to determine the parameters
    of the particular model were studied.


    The most general model is denominated ARMA(p,q) (Autoregressive Moving Average)
    and indicates the presence of autoregressive components both in the observable
    variable {Z_t} as well as in the white noise {a_t}. A particular class of model
    for stationary series corresponds to the Autoregressive models AR(p) (that are
    denoted as AR), which is represented by the expression:


    $$Z_t = \delta + \phi_1 Z_{t-1} + \phi_2 Z_{t-2} + ... + \phi_p Z_{t-p} + a_t
    \tag{5}$$


    When the series is stationary δ and φ_i are constants that satisfy the following
    relations:


    $$|\phi_1| < 1, \tag{6}$$


    $$\mu = \frac{\delta}{1 - \sum \phi_i}$$


    and


    $$\sum \phi_i < 1$$


    Where μ represents the average of the series { Z_t }. The relations in (6) are
    a consequence of the stationarity property and can be consulted in (Box & Jenkins,
    1976).


    The correlation structure presented by a TS related to an AR model for separate
    observations k time units is given by the autocorrelation function:


    $$\rho_k = \phi_1 \rho_{k-1} + \phi_2 \rho_{k-2} + ... + \phi_p \rho_{k-p}$$


    where ρ_k is the autocorrelation for data of series separated k time units. From
    the initial conditions that satisfy this equation in differences are presented
    the following possible'
