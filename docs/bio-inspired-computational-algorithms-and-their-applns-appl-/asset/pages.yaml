    Λ = [ P0,1, P1,2, P1,3, P2,4, P2,5, P2,6, P6,7, P6,12, P7,8, P7,9, P9,10, P11,12,
    P12,13, P12,14, P14,15, P14,16 ] . (31)


    So, Λ is a finite set of tokens, and its number of elements is much smaller than
    the number of nodes squared⁴, that assumes the role of parameter set in the P-problem.
    These tokens can represent a protective device to be placed in its respective
    circuit position. The possible devices are: main substation switch, only possible
