  md: '# 4. Fitness function


    The fitness function is used to provide the measure of how individuals performed.
    In this instance, the problem domain was that the PSS parameters should stabilize
    the system simultaneously over a certain range of specified operating conditions.
    The PSS which parameters are to be optimized has a structure similar to the conventional
    PSS (CPSS) as shown in Fig. A. 3. of Appendix 8.2.3. There are three parameters
    K_st, T1 and T2 that are to be optimized, where K_st is the PSS gain and T1 and
    T2 are lead-lag time constants. T_w is the washout time constant which is not
    critical and therefore has not been optimized.


    The fitness function that was used is to maximize the lowest damping ratio. Mathematically
    the objective function is formulated as follows:


    val = max(min(ζ_ij))  (4)


    where i = 1,2 ... n , j = 1,2 ,... m


    ζ_ij = -σ_ij / sqrt(σ_ij² + ω_ij²)


    ζ_ij is the damping ratio of the iᵗʰ eigenvalue of the jᵗʰ operating conditions.
    The number of the eigenvalues is n, and m is the number of operating conditions.


    σ_ij and ω_ij are the real part and the imaginary part (frequency) of the eigenvalue,
    respectively.


    # 5. PSS design


    The following parameter domain constraints were considered when designing the
    PSS.


    0 < K_s ≤ 20

    0.001 ≤ T_i ≤ 5


    where K_s and T_i denote the controller gain and the lead lag time constants,
    respectively.


    # 5.1 BGA-PSS


    The following BGA parameters have been used during the design


    +   - Population: 100

    +   - Generation: 100

    +   - Selection: Truncation selection (i.e., selected the best 15% of the population)

    +   - Recombination: Line and volume

    +   - Mutation initial R_nom: 0.01


    The parameters of the BGA-PSS are given in Table A.1 of Appendix 8.2.3.'
