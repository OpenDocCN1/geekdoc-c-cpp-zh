    # 9. Comparisons with other methodologies


    To evaluate the performance of a model on a TS data is divided into two sets called
    training set and test set. The training set has the first values of the series
    (approximately 90% of the total) and the test set the last 10%. The information
    of the training set model is used to choose the model and evaluate the parameters.
    Once chosen the corresponding model is evaluated its ability to forecast the test
    set, and when it is had different model proposals it is common to choose the best
    result of the test set. For this assessment can be used several measures of performance
    (Hyndman & Koehler, 2006). In this work preferably is used RSS.


    To build the models with the methodology of this wok it is proceeded as follows:


    +   (a). In this first stage is calculated the AR part of the model. For this,
    from K = 2 are built the models AR with K terms and is tested the performance
    on the test set. As soon as the first K value is obtained where the RSS of the
    model is less than the values obtained for the K − 1 and K + 1 is considered that
    the AR part of the model has the already found K terms and passes to the second
    stage.

    +   (b). It is calculated the error series obtained from the original series and
    the ones calculated by the model obtained in the previous stage. On this new series
    it is applied the same procedure above mention and it is obtained the part corresponding
    to the component of the MA moving average of the ARMA model. It may be the case
    that by including the MA components of the model it will be had the worst approximations
    in the test set than those obtained with the AR part. In this case the model would
    only have the AR component.

    +   (c). It is checked if the model AR obtained in the stage 1 presents the FD
    phenomenon occurs, and if so to realize the displacement of the graph one unit
    to the left according to (9) as long as with this procedure the result is improved.


    To test the performance of our models of (8) we used the series A, B, C, D, E
    and F appearing in (Box & Jenkins, 1976), used and presented in chapter 3.


    In (Hansen at all, 1999) are shown the results of building several linear models
    for these series. The first is the classic BJ, and others apply when BJ model
    do not satisfy the postulate that the error is a white noise. In (McDonald & Yexiao,
    1994) it is indicated that the use of these latest models improved from 8% to
    13% the capability of prediction of the model when the error is not white noise.
    Immediately it is presented the relationship of these models for the linear models.'
