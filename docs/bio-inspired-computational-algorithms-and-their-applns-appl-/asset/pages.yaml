  md: 'constant values for parameters that are used by the algorithm (such as population
    size, probability of applying an operator, etc.).


    # ### 2.2.1 Genotype


    The natural representation of the MKP would be the binary representation, in which
    every bit represents the existence or not of a certain element in the Knapsack.
    A bit set to 1 indicates that the corresponding item is packed into the knapsack
    and a bit set to 0 indicates that it is not packed. Hence a typical population
    of two individuals for a six elements in Knapsack would be represented as shown
    in Figure 1. Thus, each element has an identification that is given by the bit
    index.


    In Figure 1 (a) there are three elements in the knapsack, corresponding to the
    following positions: 1, 4 and 6. In Figure 1 (b) there are four elements in the
    knapsack, whose positions are: 2, 3, 5 and 6.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_400_0.png)


    # ### 2.2.2 Initial population


    The population is the solution representation that consists of a set of codified
    chromosomes. There are many ways to generate the initial population such as random
    chromosome or chromosome with the solution closer to the optimum. In most applications
    the initial population is generated at random.


    # ### 2.2.3 Evaluation function


    In GA each individual is evaluated by fitness function. Some individuals produce
    more children than others due to their fitness. By this mechanism, individuals
    that have chromosomes with better fitness have better chances of leaving their
    genes. This leads to better average performance of the whole population as generations
    proceed (Ku & Lee, 2001). A feasible vector solution x needs to satisfy constraint
    (2), otherwise it is infeasible. Hence, a penalty is applied to all infeasible
    solutions in order to decrease their corresponding “fitness”. Therefore, the two
    types of evaluation functions used in this research are based on static (constant)
    and adaptive penalty functions. The standard evaluation function for each individual
    is given by the following expressions:


    ```

    $$Evaluation (x) = \sum_{i=1}^{n}(x[i]*p[i]) - Pen(x)$$ (5)

    ```


    ```

    $$Maximum Profit Possible (MaxP) = \sum_{i=1}^{n}p[i]$$ (6)

    ```


    A vector solution x is optimal when Evaluation (x) =MaxP.'
