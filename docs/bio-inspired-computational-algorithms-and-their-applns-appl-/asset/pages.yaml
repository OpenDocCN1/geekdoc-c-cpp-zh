    ```


    ```

    $$\mathbf{s}^{h+3} = \left[s_1^{h+3}\dots s_k^{h+3} s_{k+1}^{h+3}\dots s_{k+(d-1)}^{h+3}\right]^T,
    \tag{36}$$

    ```


    ```

    $$W^{h+4} = (\mathbf{w}^{h-1},\dots,\mathbf{w}^{h,k-1},\mathbf{w}^{h,k},\dots,\mathbf{w}^{h+1,i}),
    \tag{37}$$

    ```


    ```

    $$\mathbf{s}^{h+4} = \left[s_1^{h+4}\dots s_k^{h+4} s_{k+1}^{h+4}\dots s_{k+(d-1)}^{h+4}\right]^T,
    \tag{38}$$

    ```


    For each new solution $(W^{h+i},s^{h+i}),\ i=\overline{1,4}$, we perform a mutation
    with probability $p_m\in[0,1]$. We find the points of mutation $m_r,\ m_p$ for
    both parts of new solutions. In the new chromosome $(W^{h+i},s^{h+i}),\ 1\le i\le4$,
    we randomly generate a variation vector $\mathbf{w}^{h+i}_{m_r}$ with structural
    and parametric parts. For each new solutions we calculate the functions (14)


    ```

    $$\mathbf{f}^{h+i} = \left[f_0^{h+i}\dots f_D^{h+i}\right]^T,\ i=\overline{1,4}.
    \tag{39}$$

    ```


    For a new solution $j$ we find the distance to Pareto set $\Lambda_{i,j}$ according
    to (28). Then we find the solution with a maximum distance to Pareto set


    ```

    $$\Lambda_{i_*}=\max\{\Lambda_{i},i=\overline{1,H}\}, \tag{40}$$

    ```


    where $i_*$ is a number of solution with maximum distance to Pareto set.


    We compare new solution to the solution that has maximum distance to Pareto set


    ```

    $$\Lambda_{h+i,j}<\Lambda_{i_*}. \tag{41}$$

    ```


    If (41) is fulfilled then we replace the solution with a maximum distance by the
    first new solution $W^*=W^{h+i},\ s^*=s^{h+i},\ f^*=f^{h+i}$, and recalculate
    the distances for all solutions in the set.


    These steps are performed for each new possible solution $(W^{h+i},s^{h+i}),\
    j=\overline{1,4}$.


    The steps are repeated starting from the selection of possible solutions. After
    several given $E$ iterations, where $E$ is called epoch, we change basic solution
    $\Psi^0$.


    As a new basic solution we can take the solution that has minimum of function


    ```

    $$\hat{f}^- = \min\left\{\sum_{i=0}^{N}\left(\frac{\hat{f}_i}{f_i}\right)^2\right\},
    \tag{42}$$

    ```'
