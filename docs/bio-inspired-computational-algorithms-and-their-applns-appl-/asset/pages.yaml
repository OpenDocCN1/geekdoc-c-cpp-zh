    # 5. Conclusion


    In this study, we have proposed a new taxonomy of parameters of GA numerical and
    structural, and examine the effects of numerical parameters of the performance
    of the algorithm in GA based simulation optimization application by the use of
    a test clustering problem. We start with the characteristics of the problem domain.


    The main characteristic features of our problem domain are:


    +   - There is a dominance of a set of decision variables with respect to the
    objective function value of the optimization problem: The objective function value
    is directly related with the combination of this dominant set of variables equal
    a value of a close to 0.85.

    +   - The good solutions are highly dominant over other solutions with respect
    to the objective function value, but not significantly diverse among each other.


    These properties of the problem domain generate a rapid convergent behavior of
    GA. According to our computational results lower mutation rates give better performance.
    GA mechanism creates a lock-n effect in the search space, hence lower mutation
    rates decreases the risk of premature convergence and provides diversification
    in the search space in this particular problem domain. Due to the dominance crossover
    operator does not have significant impact on the performance of GA. Moreover,
    starting with a seeded population generates more efficient results.


    We can conclude that the GA had a favourable evolution, offering optimal document
    cluster in an acceptable and robust manner, based on a proper adjust of the parameters.
    We proved that the medium effectiveness of the GA is very acceptable, being in
    most cases better than Kmeans supervised algorithm, but with the added advantage
    that we processed the documents in an unsupervised way, allowing evolution perform
    clustering with our adjustment. As a result of our experiments, we appreciate
    that we got the best performance with a rate of 0.03 for the mutation operator
    and using a rate of 0.80 for the crossover operator, this values appears to be
    ideal if we maximize the efficiency of the genetic algorithm.'
