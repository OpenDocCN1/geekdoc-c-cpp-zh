    # 3.4 Proper band width for equality constraints


    In a problem having an equality constraint, it is not so simple for GA to satisfy
    the constraint while maintaining efficiency. Optimal solution lies on the line
    of equality constraint. It is very important to generate individuals on or near
    the equality line. However, the desirable narrow area including the equality line
    is very small compared with the whole area. The number of individual generated
    in this narrow area is much less than those in the outer area of the desirable
    narrow area including the equality line. Therefore, the convergence rate of GA
    or SZGA is significantly slow for the problems with equality constraints. The
    bandwidth method is proposed to overcome this kind of slow convergence rate.


    For the minimization problems, we added a basic penalty function to meet the equality
    constraint, which will be explained soon. For this problem with the basic constraint,
    we can not expect a rapid convergence rate as mentioned above. Therefore, we added
    an additional penalty function to the region, located out of the desirable narrow
    area including the equality line, to make an infeasible area of a very highly
    increased objective function. The bandwidth denotes the half width of the narrow
    region with the basic penalty only.


    There are three methods to handle the equality constraints using GA. One is to
    give both sides the penalty functions along the equality condition. The other
    is to give one side the monotonic function and the other side the even (jump)
    penalty function along the equality constraint. However, the one side with the
    monotonic penalty should be feasible. And, the final one is to apply one side
    with no penalty function and the other side with the even (jump) penalty function
    along the equality constraint, and the one side of no penalty function should
    be feasible.


    The penalty methods provided in Fig. 6 only with original penalty, is the basic
    technique for handling the equality constraint 15. With this kind of basic technique
    only, however, the convergence rate would be too slow to reach the optimal point.
    Many generated individuals are wasted because they mostly too far from the equality
    constraint line. Therefore we need an additional penalty function to increase
    the effectiveness of GA. That is an additional'
