    # 5. NN3 results


    The international competition NN3 Artificial Neural Network & Computational Intelligence
    Forecasting Competition 2007 aims at assessing the latest methodologies for the
    forecasting of TS. This competition is open to use methods based on Neural Networks,
    Fuzzy Logic, Genetic Algorithms and others in the area of artificial intelligence.
    The problems in question are presented in two groups called NN3-Complete (with
    111 examples), and the purpose of the competition is to obtain the best models
    for each example of the two sets using the same methodology. The notation of this
    section is similar to that used in NN3.


    To evaluate the performance of a model in some example s, it is estimated the
    forecasting F and it is measured the performance with the average of the indicator
    Symmetric Mean Absolute Percent Error SMAPE in all the values of the series. The
    SMAPE measures the absolute symmetric error in percentage between the real values
    of the original series Z and the forecasting F for all observations t of the test
    set of size n for each series s with SMAPE equal to:


    $$\frac{1}{n} \sum_{t=1}^{n} \frac{|z_t - f_t|}{(z_t + f_t)/2} * 100 \tag{8}$$


    and finally it is averaged over all examples in the same set of data. Other measures
    of forecasting accuracy of a model can be found in (Hyndman & Koehler, 2006).


    This indicator can evaluate the performance of applying different methodologies
    on the same set of data and the methodology that produces the lowest value is
    considered the best. In the set NN3-Complete the best result was of 14.84% and
    applying the algorithms developed in this work was of 16.31%. In the NN3-Reduced
    the results were 13.07% and 15.00% respectively. However, it is possible to build
    linear models with the methodology presented in this work to improve these results
    because:


    +   - Although the competition was intended to determine the best model for each
    example in this work was found an AR model with 4 terms for each example. It is
    expected that if it is divided the series in a training set and in other set of
    test it can be found models with higher forecasting capacity that improve the
    results obtained.

    +   - It were not used ARMA models that include the behavior of the residuals
    or the advancement of forecasting that substantially improve the results.'
