  md: 'The valid range for the constant k_bi is 0.1 ≤ k_bi ≤ 0.5 and the β value is
    0.005 ≤ β ≤ 0.5. The β value is lower than 1 as bidder agent that is looking for
    bargain will never bid with the behavior of β >1. The β value is, therefore, constantly
    lower than 1 in order to maintain a low bid until the closes to the end time.
    Hence, the value of β < 0.5 is used.


    The level of desperateness tactic is the bidder agent''s desperateness to obtain
    the target item within a given period and thus, the bidder agent who possesses
    this behavior tend to bid aggressively. This tactic utilizes the same minimum
    bid value and the polynomial function as the desire for bargain tactic but with
    a minor variation to the β and k_de value. The valid range for the constant k_de
    for this tactic is 0.7 ≤ k_de ≤ 0.9 while the β value is 1.67 ≤ β ≤ 1000. The
    β value is higher than 1 in this case as the bidder agent that is looking for
    bargain will never bid with the behavior of β <1. As a result, the β value is
    always higher than 0.7 since the bidder agent will bid close to the private valuation.


    There is a weight associated to each of this tactic and this weight is to emphasize
    which combination of tactics that will be used to bid in the online auction. The
    final current maximum bid is based on the combination of the four tactics by making
    use of the weight. Fig. 6 shows various combinations of the bidding constraints
    based on the different weight associated to the bidding tactics. It can also be
