  md: 'the error in the prediction is determined by the lack of accuracy with respect
    to s[n], which is defined as [20]:


    e[n] = s[n] - \tilde{s}[n] = s[n] - \sum_{k=1}^{p} a_k s[n - k] \tag{4}


    e[z] = s[z] \left( 1 - \sum_{k=1}^{p} a_k z^{-k} \right) \tag{5}


    from equation (5), it is possible to recognize that the sequence of prediction
    of the error has in its components a FIR-type filter system which is defined by:


    A(z) = 1 - \sum_{k=1}^{p} a_k z^{-k} = \frac{E(z)}{S(z)} \tag{6}


    equations (2) and (4) show that e[n]=G u[n]. The estimation of the prediction
    coefficients is obtained by minimizing the error in the prediction. Where e[n]^2
    denotes the square error of the prediction and E is the total error over a time
    interval (m). The prediction error in a short time segment is defined as:


    E = \sum_m e[m]^2 = \sum_m \left[ s[m] - \sum_{k=1}^{p} a_k s[m - k] \right]^2
    \tag{7}


    the coefficients {a_i} minimize the prediction of error E on the fragment obtained
    by the partial derivatives of E with respect to such coefficients; this means
    that:


    \frac{\partial E}{\partial a_i} = 0, \quad 1 \le i \le p. \tag{8}


    Through equations (7) and (8) the final equation is obtained:


    \sum_{k=1}^{p} a_k \sum_n s[n - k] s[n - i] = - \sum_n s[n] s[n - i], \quad 1
    \le i \le p, \tag{9}


    this equation is written in terms of least squares and is known as a normal equation.
    For any definitions of the signal s[n], equation (9) forms a set of p equations
