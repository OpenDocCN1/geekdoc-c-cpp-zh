    # 3.2 A new genotypic distance on the splicing/decomposable binary representation


    For measuring the similarity of the binary strings, the Hamming distance (Hamming,
    1980) is widely used on the binary space. Hamming distance describes how many
    bits are different in two binary strings, but cannot consider the scaled property
    in non-uniformly binary representations. Thus, the distance distortion between
    the genotypic and the phenotypic spaces make phenotypically easy problem more
    difficult. Therefore, to make sure that GAs are able to reliably solve easy problems
    and problems of bounded complexity, the use of equivalent distances is recommended.
    For this purpose, we have defined a new genotypic distance on the S/D binary space
    to measure the similarity of the S/D binary strings.


    Definition 1: Suppose any binary strings a and b belong to the S/D binary space
    Φ_g, the genotypic distance ||a − b||_g is defined as


    ||a − b||_g = Σ_{i=1}^{n} | 1/(l/n -1) Σ_{j=0}^{l/n -1} [a_{j×n + i} - b_{j×n
    + i}] / 2^{j+1} |


    where l and n denote the length of the S/D binary strings and the dimensions of
    the real-encoding phenotypic space Φ_p respectively,'
