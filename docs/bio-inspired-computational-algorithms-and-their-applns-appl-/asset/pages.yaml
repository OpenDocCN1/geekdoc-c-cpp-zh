  md: 'Solving this problem requires a complex non linear programming algorithm. The
    number of decision variables involved can be in the order of thousands. Due to
    the discontinuity of μ_i, the objective function is discontinuous on the hyper
    planes defined by d_k = m_k. Therefore, its continuity domain is not connected.
    The shape of the feasible region R_f is too convoluted, even more if synergy and
    redundancy need to be addressed. R_f hardly has the mathematical properties generally
    required by non linear programming methods. Note that veto constraints on the
    pairs of projects (p_i, p_k) and (p_k, p_i) are discontinuous on the hyper planes
    defined by d_k = m_k and d_k^v = m_k^v. In a real world scenario, where hundreds
    or even thousands of projects are considered, non-linear programming solutions
    cannot handle these situations. Using Equation 6, a simplified form of Problem
    definition 2, was efficiently solved by Fernandez et al. (2009) and later by Litvinchev
    et al. (2010) using an integer-mixed programming model. Unfortunately, this approach
    cannot handle synergy, redundancy, veto constraints, nor can it handle the non-linear
    forms of function f in Problem definition 2.


    Evolutionary algorithms are less sensitive to the shape of the feasible region,
    the number of decision variables, and the mathematical properties of the objective
    function (e.g., continuity, convexity, differentiability, and local extremes).
    In contrast, all of these issues are a real concern for mathematical non linear
    programming techniques (Coello, 1999). While evolutionary algorithms are not time-efficient,
    they often find solutions that closely approximate the optimal. Problem definition
    2 represents a relatively rough model. However, the main interest is not on fine
    tuning the optimization process but rather on the generality of the model and
    on the ability to reach the optimal solution or a close approximation.


    In Figure 1, we illustrate the genetic algorithm used for solving the optimization
    problem stated in Problem definition 2. This algorithm is based on the work of
    Fernandez and Navarro (2005). As in any genetic algorithm, a fundamental issue
    is defining a codification for the set of feasible solutions to the optimization
    problem. In this case, each individual represents a portfolio and each chromosome
    contains N genes, where N is the number of projects. For the chromosome, we use
    a floating point encoding representing the distribution of funding among the set
    of projects in the portfolio. The financial support for each project is represented
    by its membership function, μ_i(d_i), which is real-valued with range in [0, 1].
    That is, a floating point number represents each project''s membership value.
    This membership value is a gene in our definition of chromosomes. As discussed
    earlier, the number of genes can be increased in order to address the effects
    of synergetic projects.


    The fitness value of each individual is calculated based on function U given by
    Equation 5. Remember that this is a subjective value that captures the SDM''s
    certainty that the project receives the necessary funding for its operation. The
    SDM''s idea that a project has been assigned sufficient funds is modeled using
    two parameters, α and β. The domain for both parameters is the continuous interval
    [0, 1]. The first parameter, α, can be interpreted as the degree of truth of the
    assertion "the project has sufficient financial support if it receives m monetary
    units of funding". When this financial support reaches the value βM, the predicate
    "the project has sufficient funding" is considered true. The value of these two
    parameters is needed to establish models for function μ_i in order to calculate
    the value of U. To generate'
