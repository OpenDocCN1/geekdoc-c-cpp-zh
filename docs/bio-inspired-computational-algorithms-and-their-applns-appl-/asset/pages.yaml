- pgno: 292
  md: '# 6. Self-adaptation


    The idea of self-adaptation is based upon the evolving of evolution. Self-adaptation
    has been used as one of the method to regulate the control parameter. As the name
    implies, the algorithm controls the adjustment of the parameters itself. This
    is done by encoding the parameter into the individual genomes by undergoing mutation
    and recombination. The control parameters can be any of the strategy parameters
    in evolutionary algorithm such as mutation rate, crossover rate, population size,
    selection operators and others (Back et al. 1997). However, the encoded parameters
    do not affect the fitness of the individuals directly, but rather, “better” values
    will lead to “better” individuals and these individuals will be more likely to
    survive and produce offspring and hence, proliferating these “better” parameter
    values. The goal of the self-adaptation is not only to find the suitable adjustment
    but also to execute it efficiently. The task is further complicated when the optimizer
    faced by a dynamic problem is taken into account since a parameter setting that
    was optimal at the beginning of an EA-run might become unsuitable during the evolution
    process. This scenario has been shown in some of the researches that different
    values of parameters might be optimal at different stages of the evolutionary
    process (Back, 1992a; Back, 1992b; Back, 1993; Davis, 1987; Hesser & Manner, 1991).
    Self-adaptation aims at biasing the distribution towards appropriate regions of
    search space and maintains sufficient diversity among individuals in order to
    enable further evolvability (Angeline, 1995; Meyer-Nieberg & Beyer, 2006).


    The self-adaptation method has been commonly used in evolutionary programming
    (Fogel, 1962; Fogel, 1966) and evolutionary strategies (Rechenberg, 1973; Schwefel,
    1977) but it is rarely used in genetic algorithms (Holland, 1975). This work applies
    self-adaptation in genetic algorithm which aims to adjust the crossover rate and
    mutation rate. The optimal rate for different phases of the evolution is obtained
    when different self-adaptation is capable of improving the algorithm by adjusting
    the crossover rate and mutation rate based on the current phase of the algorithm.
    Researchers have shown that the self-adaptation is able to improve the crossover
    in genetic algorithm (Schaffer & Morishima, 1987; Spears, 1995). In addition,
    studies also showed that the self-adaptive mutation rate does perform better than
    fixed constant mutation rate by incorporating the mutation rate into the individual
    genomes (Back, 1992a; Back, 1992b). In this section, three different self-adaptation
    schemes will be tested to discover the best self-adaptation scheme from this testing
    set. The self-adaptation requires the crossover and mutation rates to be encoded
    into the individual’s genomes. Thus, some modification the encoding representation
    needs to be performed. The crossover and mutation rate become part of the genomes
    which will go through the crossover and mutation processes similar to the other
    alleles.


