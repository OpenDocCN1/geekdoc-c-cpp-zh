- pgno: 224
  md: '# # Self Adaptive Genetic Algorithms for Automated Linear Modelling of Time
    Series


    Pedro Flores<sup>1</sup>, Larysa Burtseva<sup>2</sup> and Luis B. Morales<sup>3</sup>


    <sup>1</sup>Universidad de Sonora

    <sup>2</sup>Universidad Autónoma de Baja California

    <sup>3</sup>Universidad Nacional Autónoma de México

    Mexico


    # ## 1. Introduction


    In this work it is developed a methodological proposal to build linear models
    of Time Series (TS) from setting out the problem of obtaining a good linear model,
    such as solving a problem of nonlinear optimization with bounded variables. It
    is worth to mention that to build these problems are taken some ideas of the traditional
    statistical approach.


    As product of the methodology here presented, it will be developed two heuristic
    algorithms for the treatment of TS, which allow building several models for the
    same problem, where the accuracy of these can be increased by increasing the number
    of terms of the model, situation that does not happen with the traditional statistical
    approach. Thus, with this algorithms it can be obtained several proposals of solution
    for the same problem, of which it can be selected the one that presents the best
    results in the forecasting. In addition, the algorithms proposed in this work
    allow building different linear versions, but equivalent to the Autoregressive
    (AR) and the classic Autoregressive with Moving Average (ARMS) models, with the
    added advantage of the possibility of obtaining models for not stationary TS,
    and with non stationary variance, in cases where the traditional methodology does
    not work.


    Since optimization problems set out here may present multiple local minimums,
    it is needed to use a special technique to solve them. With this end it was developed
    a version of the Self Adaptive Genetic Algorithms (SAGA), encoded on real numbers
    that allows, without intervention of the user, to find satisfactory solutions
    for different problems without making changes in the parameters of the code.


    On the other hand, among the principal points of this methodology it is the fact
    that in many cases, these linear versions present a phenomenon that has been named
    ''forecasting delay'', which allows to modify the linear model obtained to find
    a more accurate forecasting.


    It is important to notice that the first AR version of the algorithms developed
    for the TS were tested in the examples of the international competition:


    > > **"NN3 Artificial Networks & Computational Intelligence Forecasting Competition"**


    that from now on it will be called NN3, which was realized in 2006-2007 (http://www.neural-forecasting-competition.com/NN3/results.htm).
    This competition is'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'held annually to evaluate the accuracy of methods in the area of Computational
    Intelligence in diverse problems of TS. In this edition the problem at hand was
    to forecast with the same methodology 18 future values of a set of series where
    the majority are measurements of real phenomena. The competition has two categories:
    the NN3-Complete has 111 problems and the NN3-Reduced consists of 11 problems.
    In this competition using only models with four terms it was obtained the third
    place in the category NN3-Complete from 29 competitors, and the sixth in the category
    NN3-Reduced from 53 competitors. This work will be referenced in various sections
    in relation to the examples of this competition. An analysis of the results of
    NN3 can be found in (Crone & Hibon & Nikolopoulos, 2011)


    # 2. Methodology


    The forecasting process consists in calculating or predicting the value of some
    event that is going to happen in the future. To realize adequately this process
    it is needed to analyze the event data in question and build a model that allows
    the incorporation of the behavior patterns that have occurred in the past under
    the assumption that they can happen again in the future. It is important to note
    that there is not interest in explaining how the mechanism that produces the events
    works, but to predict their behavior.


    The TS models are used for studying the behavior of data that varies with time.
    The data can be interpreted as measurements of some value (observable variable)
    of a phenomenon, realized at time intervals equal and consecutive. There are several
    methods to construct TS models and an overview of the most important can be found
    in (Weigend & Gershenfeld, 1994). In (Palit & Popovic, 2005) it is shown an overview
    of the methodologies most used in the area of computational intelligence. One
    of the most used methods is based on considering the TS as a realization of a
    stochastic process. This approach is the basis of statistical treatment of TS
    that can be found in (Box & Jenkins, 1976) and (Guerrero, 2003). Nowadays the
    construction of model for TS is an area of great development as evidenced by the
    articles of the Journal of Time Series Analysis (http://www.wiley.com/bw/journal.asp?ref=0143-9782&site=1)
    in addition to the papers presented in international competitions on time series
    modelling such as NN3. Nevertheless the existence of GA papers in which are used
    the TS (Alberto et all, 2010; Battaglia & Protopapas, 2011; Chiogna & Gaetan &
    Masarotto, 2008; Hansen et all, 1999; Mateo & Sović & Gadea, 2010; Szpiro, 1997;
    Yadavalli et all, 1999), it is important to note that it was not found any reference
    to the use of SAGA for this purpose.


    The data will be represented by {Z_t} with the implicit assumption that t takes
    the values 1,2,...,N where the parameter N indicates up to what moment the information
    is had. When it is had a model for the data set, then it can be estimated values
    for the TS, which are denoted by {Ŷ_t}. In addition in order to consider a model
    as a good one, it is required that the values of {Ŷ_t} be ''similar'' to those
    of {Z_t}. The main purpose of this work is to build linear models for the data
    set to have good estimates of the K unknown values of the phenomenon being studied
    in the moments N + 1, N + 2, ..., N + K.


    In the forecasting subject, when it is had a TS with these N + K data, the set
    of the first N is called training set, and is used to construct the model of the
    series and realize the estimation of its parameters. The set of the last K terms
    in the series is called training set, and is used for the comparison of different
    models to choose the most suitable. Especially, it is been interested in building
    automated Autoregressive models of order p (AR (p)). For the TS are expressions'
