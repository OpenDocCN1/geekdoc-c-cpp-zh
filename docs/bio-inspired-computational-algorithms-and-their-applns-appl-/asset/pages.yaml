    The existing exponentially scaled representations including binary and gray encodings
    consist of non-uniformly scaled BBs. For non-uniformly and competing BBs in the
    high dimensional phenotype space, there are a lot of noise from the competing
    BBs lead to a reduction on the performance of GAs. Moreover, by increasing the
    string length, more and more lower salient BBs are randomly fixed due to the noise
    from the competing BBs, causing GAs performance to decline. Using large population
    size can reduce the influence of the noise from the competing BBs. However, in
    real-world problem, long binary string is necessary to encode a large search space
    with high precision, and hence we cannot use too large population size to solve
    the noise problem. Thus, GAs will be premature and cannon converge to the optimum
    of the problem.


    To avoid the noise from the competing BBs of GAs, we have proposed a new splicing/decomposable
    GA (SDGA) based on the delicate properties of the S/D binary representation. The
    whole S/D binary string can be decomposed into a non-uniformly scaled sequence
    of USBBs. Thus, in the searching process of GAs on S/D binary encoding, the'
