    # 3.2 Damage detection of structures


    Structures can sometimes experience failures far earlier than expected, due to
    fabrication errors, material imperfections, fatigue, or design mistakes, of which
    fatigue failure is perhaps the most common. Therefore, to protect a structure
    from any catastrophic failure, regular inspections that include knocking, visual
    searches, and other nondestructive testing are conducted. However, these methods
    are all localized and depend strongly on the skill and experience of the inspector.
    Consequently, smart and global ways of searching for damages have recently been
    investigated by using rational algorithms, powerful computers, and FEM.


    The objective function of the difference between the measured data and the computed
    data is minimized according to an assumed structural damage to find the locations
    and intensities of possible damages in a structure. The measured data can be the
    displacement of certain points or the natural frequencies of the structure, while
    the computed data are obtained by FEM using an assumed structural damage, whose
    severity is graded between 0 and 1. For example, Chou et al. used static displacements
    at a few locations in a discrete structure composed of truss members, and adopted
    a kind of mixed string scheme as an implicit redundant representation. Meanwhile,
    Rao adopted a residual force method, where the fitness is the inverse of an objective
    function, which is the vector sum of the residual forces, and Koh adopted a stacked
    mode shape correlation that could locate multiple damages without incorporating
    sensitivity information 11.


    Yet, a typical structure can be sub-divided into many finite elements and has
    many degrees of freedom. Thus, FEM for a static analysis, as well as for a frequency
    analysis, takes a long time. For a GA, the analysis time is related to the number
    of functions used for evaluating fitness. This number can become uncontrollable
    when monitoring a full structure, and as a result, the RAM or memory space required
    becomes too large and the access rate too slow when handling so much data.


    Accordingly, the proposed SZGA is very effective in this case, as it does not
    require so many chromosomes, even as few as 4, thereby overcoming the slow-down
    of the convergence rate of the conventional GA, which need many chromosomes in
    determining the extent of a damage. Furthermore, the issue of many degrees of
    freedom can also be solved by sub-dividing the monitoring problem into smaller
    sub-problems because the number of damages will likely be between 1-4, as long
