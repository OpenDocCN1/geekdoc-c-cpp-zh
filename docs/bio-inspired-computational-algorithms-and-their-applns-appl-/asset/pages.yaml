  md: '# Public Portfolio Selection Combining Genetic Algorithms and Mathematical
    Decision Analysis


    Eduardo Fernández-González, Inés Vega-López and Jorge Navarro-Castillo


    Autonomous University of Sinaloa

    México


    # 1. Introduction


    A central and frequently contentious issue in public policy analysis is the allocation
    of funds to competing projects. Public resources for financing social projects
    are particularly scarce. Very often, the cumulative budget being requested ostensibly
    overwhelms what can be granted. Moreover, strategic, political and ideological
    criteria pervade the administrative decisions on such assignments (Peterson, 2005).
    To satisfy these normative criteria, that underlie either prevalent public policies
    or governmental ideology, it is obviously convenient both to prioritize projects
    and to construct project-portfolios according to rational principles (e.g., maximizing
    social benefits). Fernandez et al. (2009a) assert that public projects may be
    characterized as follows:


    +   - They may be undoubtedly profitable, but their benefits are indirect, perhaps
    only long-term visible, and hard to quantify.

    +   - Aside from their potential economic contributions to social welfare, there
    are intangible benefits that should be considered to achieve an integral view
    of their social impact.

    +   - Equity, regarding the magnitude of the projects’ impact, as well as the
    social conditions of the benefited individuals, must also be considered.


    Admittedly, the main difficulty for characterizing the “best public project portfolio”
    is finding a mechanism to appropriately define, evaluate, and compare social returns.
    Regardless of the varying definitions of the concept of social return, we can
    assert the tautological value of the following proposition.


    **Proposition 1:** Given two social projects, A and B, with similar costs and
    budgets, A should be preferred to B if A has a better social return.


    Ignoring, for a moment, the difficulties for defining the social return of a project
    portfolio, given two portfolios, C and D, with equivalent budgets, C should be
    preferred to D if and only if C has a better social return. Thus, the problem
    of searching for the best project-portfolio can be reduced to finding a method
    for assessing social-project returns, or at least a comparative way to analyze
    alternative portfolio proposals.


    The most commonly used method to examine the efficiency impacts of public policies
    is “cost-benefit” analysis (e.g. Boardman, 1996). Under this approach, the assumed
    consequences of a project are “translated” into equivalent monetary units where
    positive'
