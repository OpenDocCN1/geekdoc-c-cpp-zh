  md: 'b''_j = { s''_j, if (j-1) mod (c+d)=0 , j=1,P(c+d). ; s''_j ⊕ b''_{j-1}, otherwise
    } (24)


    From the binary code we obtain the vector of parameters


    q'' = [q''_1 ... q''_θ]^T , (25)


    q''_k = Σ_{j=1}^{c+d} 2^{c+d-1} b''_j ... , k=1,P . (26)


    To estimate each possible solution Ψ'' and q'' we use parameter which is called
    a distance to a Pareto set


    # A distance to a Pareto set is a number of possible solutions that are better
    in terms of Pareto than the current solution.


    For each solution (W^i, s^i), 1 ≤ i ≤ H we find mathematical equation g''(x,q'')
    and calculate the values of object functions (14)


    f'' = [f''_1 ... f''_θ]^T , (27)


    In the set we find the number of possible solutions that are better than the solution
    (W^i, s^i)


    Λ_i = Σ_{i=1}^{H} λ_i (f'') , (28)


    where


    λ_i (f'') = {1, if f'' ≤ f^i ; 0, otherwise} . (29)


    To construct new solutions we perform genetic operations of selection, crossover
    and mutation.


    We randomly choose two solutions (W^{s1}, s^{s1}), (W^{s2}, s^{s2}) and perform
    a crossover with probability


    p_c = max{ [1+γΛ_{s1}]/[1+Λ_{s1}], [1+γΛ_{s2}]/[1+Λ_{s2}] } , (30)


    where γ is a given crossover parameter, 0 < γ < 1.


    After crossover is performed in two points k_r, k_s we obtain four new solutions
    (W^{H+1}, s^{H+1}), (W^{H+2}, s^{H+2}), (W^{H+3}, s^{H+3}), (W^{H+4}, s^{H+4})


    W^{H+1}=W^{s1} , (31)'
