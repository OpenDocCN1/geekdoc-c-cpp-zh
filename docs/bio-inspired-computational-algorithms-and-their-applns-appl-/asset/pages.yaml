  md: 'it is decreased again as soon as an improvement of the population occurs” (Sivanandam
    & Deepa, 2008).


    Fast Messy Genetic Algorithm (FmGA) is a binary, stochastic, variable string length,
    population based approach to solving optimization problems. The main difference
    between the FmGA and other genetic approaches is the ability of the FmGA to explicitly
    manipulate building blocks (BBs) of genetic material in order to obtain good solutions
    and potentially the global optimum. Some works, like (Haupt & Haupt, 2004), use
    only the term of Messy Genetic Algorithms (mGAs).


    Finally, Independent Sampling Genetic Algorithm (ISGA) are more robust GAs, which
    manipulate building blocks to avoid the premature convergence in a GA. Implicit
    parallelism and the efficacy of crossover are enhanced and the ISGAs have been
    shown to outperform several different GAs (Sivanandam & Deepa, 2008). Other classes
    of efficient GAs may be implemented for different specific applications.


    # 5. Applications of Genetic Algorithms


    “GAs have been applied in science, engineering, business and social sciences.
    Number of scientists has already solved many engineering problems using genetic
    algorithms. GA concepts can be applied to the engineering problem such as optimization
    of gas pipeline systems. Another important current area is structure optimization.
    The main objective in this problem is to minimize the weight of the structure
    subjected to maximum and minimum stress constraints on each member. GA is also
    used in medical imaging system. The GA is used to perform image registration as
    a part of larger digital subtraction angiographies. It can be found that GAs can
    be used over a wide range of applications” (Sivanandam & Deepa, 2008). GAs can
    also be applied to production planning, air traffic problems, automobile, signal
    processing, communication networks, environmental engineering and so on. In (Bentley
    & Corne, 2002), Evolutionary Creativity is discussed, using a lot of examples
    from music, art in general, architecture and engineering design. Evolutionary
    Electronics, both Analog and Digital, have been investigated in many publications
    (Bentley & Corne, 2002; Popa, 2004; Popa et al., 2005). (Higuchi et al., 2006)
    is a very good book on Evolvable Hardware.


    Evolvable Hardware (EHW) is a hardware built on software reconfigurable Programmable
    Logic Devices (PLDs). In these circuits the logic design is compiled into a binary
    bit string and, by changing the bits, arbitrary hardware structures can be implemented
    instantly. The key idea is to regard such a bit string as a chromosome of a Genetic
    Algorithm (GA). Through genetic learning, EHW finds the best bit string and reconfigures
    itself according to rewards received from the environment (Iba et al., 1996).


    In the rest of this section we present three applications in evolutionary design
    of digital circuits developed by the author, using GAs. First of them describes
    a method of synthesis of a Finite State Machine (FSM) in a Complex Programmable
    Logic Device (CPLD), using a standard GA. The other two applications use different
    techniques of hybridisation of a standard GA: first of them with two other optimisation
    techniques (inductive search and simulated annealing), to solve the Automatic
    Test Pattern Generation for digital circuits, a problem described in (Bilchev
    & Parmee, 1996), and the second one to improve the convergence of the standard
    GA in evolutionary design of digital circuits, using the new paradigm of Quantum
    Computation (Han & Kim, 2002).'
