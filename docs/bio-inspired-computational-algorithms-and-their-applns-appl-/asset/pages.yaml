    # 8. Search of optimal mathematic equation


    Let us formulate the problem of search of optimal mathematical equation g(x,q).
    It is necessary to find mathematical equation g(x,q), that provides minimums of
    object functions with restrictions


    min f_i(x,g(x,q)), i=0,D, (14)

    f_i(x,g(x,q)) ≤0, j=D+1,K, (15)


    where x is a vector of variables, q is a vector of parameters.


    The solution to the problem (14), (15) is a mathematical equation g~(x,q). Mathematical
    equation g(x,q) is a function


    g(x,q)=[g₁(x,q)...g_M(x,q)]^T. (16)


    If D ≥1, then the solution of the problem is a Pareto set


    Π={g^k(x,q): k=1,s},


    where ∀g^k(x,q)∈Π ∃g^j(x,q)∈Π, f_i^*(g^j(x,q))≤f_i^*(g^k(x,q)), 0≤i≤D,

    f^*(g(x,q))=[f₀(g(x,q))...f_D(g(x,q))]^T, if f_i(g^k(x,q))≤f_i(g^j(x,q)), i=0,D,
    and ∃_j f_i(g^k(x,q))<f_i(g^j(x,q)).'
