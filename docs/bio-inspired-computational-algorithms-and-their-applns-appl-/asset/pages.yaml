    # 7.2 PDEs models


    The model proposed by Su et al. (2009) uses a system of partial differential equations
    (PDEs) to model not only the functioning of the innate immune system, as well
    as the adaptive immune system. The model considers the simplest form of antigen,
    the molecular constituents of pathogens patterns, taking into account all the
    basic factors of an immune response: antigen, cells of the immune system, cytokines
    and chemokines. This model captures the following stages of the immune response:
    recognition, initiation, effector response and resolution of infection or change
    to a new equilibrium state (steady state). The model can reproduce important phenomena
    of the HIS such as a) temporal order of arrival of cells at the site of infection,
    b) antigen presentation by dendritic cells, macrophages to regulatory T cells
    d) production of pro-inflammatory and anti-inflammatory cytokines and e) the phenomenon
    of chemotaxis.'
