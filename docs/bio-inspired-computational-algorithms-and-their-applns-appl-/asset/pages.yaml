  md: 'to completion in a factor that is almost in reciprocal proportion to the number
    of processors (Aguire, 2000).


    In the island model GA, the sub-populations are isolated during selection, breeding
    and evaluation. Islands typically focus on the evolutionary process within sub-populations
    before migrating individuals to other islands, or conceptual processors, which
    also carry out an evolutionary process. At predetermined times, during the search
    process, islands send and receive migrants to other islands. There are many variations
    of distributed models, e.g. islands, demes, and niching methods, where each requires
    numerous parameters to be defined and tuned (Gustafson, 2006).


    An example of the communication topology, can be defined as a graph in which the
    sub-populations Pi (i = 0, 1, ..., K - 1) are the vertices and each defined edge
    Lij specifies a communication link between the incident vertices Pi and Pj (neighbor
    sub-populations) (Aguire, 2000). In general, assuming a directed graph for each
    defined link Lij we can indicate the number of individuals Rij that will migrate
    from Pi to Pj (migration rate) and the number of generations M between migration
    events (migration interval). The communication topology and migration rates could
    be static or dynamic and migration could be asynchronous or synchronous.


    Various strategies for choosing migrants have been applied. Two strategies often
    used to select migrants are selection of the best and random selection. For example,
    the migration can implement a synchronous elitist broadcast strategy occurring
    every M generation. Each sub-population broadcasts a copy of its R best individuals
    to all its neighbor sub-populations.


    Hence, every sub-population in every migration event receives migrants. Figure
    5 illustrates a communication topology +1+2 island model in which each sub-population
    is linked to two neighbors (L = 2). In this example, the sub-population P0 can
    send individuals only to P1 and P2 and receive migrants only from P4 and P5.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_405_0.png)


    Fig. 5. +1+2 communication topology.


    # 3. Cultural Island Model (CA-IM)


    In this section is presented an approach about the communication topology for
    migration process implemented in a Cultural Algorithm based on the island model.
    As noted earlier in the classical island model implementation, there are sub-populations
    connected with as ring'
