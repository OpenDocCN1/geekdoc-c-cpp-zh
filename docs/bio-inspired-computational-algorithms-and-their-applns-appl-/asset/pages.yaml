    source_N = permeability_N·(N^max - N)

    dN/dt = -μ_N N - λ_N|A·N·A + source_N

    N(0) = 0

    permeability_RM = (p_RM^max - p_RM^min)·CH/(CH + k_pRM) + p_RM^min

    source_RM = permeability_RM·(M^max - (RM + AM))

    dRM/dt = -μ_RM RM - λ_RM|A·RM·A + source_RM

    RM(0) = 1

    dAM/dt = -μ_AM AM + λ_RM|A·RM·A

    AM(0) = 0

    dCH/dt = -β_CH CH + (β_CH|N N + β_CH|AM AM)·A·(1 - CH/CH_inf)

    CH(0) = 0

    ```


    It should be noticed that in this case two distinct initial values for A(0) will
    be used: A(0) = 20 and A(0) = 40.


    The sensitivity analysis has shown that two parameters are relevant to the model:
    the capacity of the tissue to support the entrance of new neutrophils (N^max)
    and the phagocytosis rate of LPS by neutrophils (λ_N|A).


    N^max is the most sensitive parameter in the model. The capacity of the tissue
    to support the entrance of new neutrophils is directed related to the permeability
    of the endothelial cells, which form the linings of the blood vessels. If a positive
    adjustment is made in the parameter related to the permeability, then there are
    more neutrophils entering into the tissue. This larger amount of neutrophils into
    the tissue has many consequences: first, more cells are phagocytosing, so the
    amount of LPS reduces faster. Second, a smaller amount of resting macrophages
    becomes active, because there is less LPS into the tissue. Third, a larger amount
    of cytokines are produced, since neutrophils are the main responsible for this
    production. If a negative adjustment is made, the inverse effect can be observed:
    with a smaller amount of neutrophils in the tissue, more resting macrophages become
    active. Also, a smaller amount of cytokines are produced.


    Figures 2 to 6 illustrate this situation. It can be observed that the LPS decays
    faster when N^max achieves its maximum value.'
