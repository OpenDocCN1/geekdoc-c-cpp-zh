    \ proinflammatory cytokines and LPS. LPS cause a response in both macrophages\
    \ and neutrophils, that recognize LPS and phagocyte them. The process of phagocytosis\
    \ induces, in a rapid way, the apoptosis of neutrophils. This induction is associated\
    \ with the generation of reactive oxygen species (ROS) (Zhang et al. (2003)).\
    \ The resting macrophages become activated when they find LPS in the tissue. The\
    \ pro-inflammatory cytokine is produced by both active macrophages and neutrophils\
    \ after they recognize LPS. It induces an increase in the endothelial permeability\
    \ allowing more neutrophils to leave the blood vessels and enter the infected\
    \ tissue.\n\nOur set of equations is given below, where RM, AM, A, N and CH represent\
    \ the population of resting macrophages, activated macrophages, LPS, neutrophils\
    \ and pro-inflammatory cytokines, respectively. The dynamics of LPS is modelled\
    \ with Equation 1.\n\n```\n{\n  dA/dt = -μ_A A - (λ_N|A N + λ_AM|A AM + λ_RM|A\
    \ RM) A\n  A(0) = 20\n}(1)\n```\n\nThe term μ_A A models the decay of LPS, where\
    \ μ_A is its decay rate. The term -(λ_N|A N + λ_AM|A AM + λ_RM|A RM) A models\
    \ the phagocytosis of LPS by macrophages and neutrophils, where λ_N|A is the phagocytosis\
    \ rate of neutrophils, λ_AM|A is the phagocytosis rate of active macrophages,\
    \ and λ_RM|A is the phagocytosis rate of resting macrophages.\n\nNeutrophils are\
