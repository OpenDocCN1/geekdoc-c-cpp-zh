  md: '# 4.2 Tests to determine the value of the rate of mutation operator and crossover
    operator rate


    We began conducting an analysis of system behavior by varying the rate of mutation
    operator in a wide range of values to cover all possible situations. During experiments
    using different samples distribution Reuters. Thus, for the rate of mutation operator
    discussed a wide range of values in the range of: 0.01, 0.03, 0.05, 0.07, 0.1,
    0.3, 0, 5, 0.7; that allowed us to apply the mutation operator of GA in different
    circumstances and study their behavior. For the study to determine the optimal
    value of the rate of crossover operator, is traced the interval from 0.70 to 0.95;
    value high, but oriented to frequently apply the operator we designed because
    that an optimum value for the mutation probability is much more important than
    the crossover probability, and choose to make a more detailed study of the odds
    ratio in our experiments. As a quality index value of the operator was given to
    the number of hits of the GA.


    As for the size of the tournament, the value 2 has been chosen, because the binary
    tournament has shown a very good performance in a large number of applications
    of EAs. Although determining a optimal fitness function is not one of the fundamental
    objectives of this experiment, we have tried to add in a single value the measuring
    results as powerful and distinct as are the Euclidean distance and the Pearson
    correlation coefficient (based on cosine similarity).


    Therefore, to find and the adjustment coefficient α that governs the weight that
    is to be given to both the distance as the inverse of similarity of the cluster
    documents, we''ve made many parameter controlled tests in order to obtain a value
    that allows an adequate contribution of both metrics with respect to fitness,,
    finally finding a value for of 0.85.


    The number of maximum generations the system has been set to is 5000, but this
    parameter may vary depending on the convergence of the algorithm. As for the number
    of stemmer terms to be used for representing the feature vectors of each of the
    documents we have used the terms, which have been selected through the NZIPF processing
    method [6][11].


    Finally, we have established a limit called the threshold of depth for individuals
    (trees). Such a threshold, in the case of "very few and few documents" take the
    value of 7, and for the "many and enough documents" is set 10. To analyze the
    results, and to verify their effectiveness, we compared the results of the GA
    with the existing real groups of the document collection [6], and also compared
    the results with another supervised type of clustering algorithm in optimal conditions
    (Kmeans). We analyzed the following:


    +   a. **Cluster efectiveness:** It is the most important indicator of the comparison
    of results considering the quality of the cluster. An analyzing process was carried
    out to see the successes achieved with the best fitness of GA, and also the average
    scores in all executions of the GA.

    +   b. **Fitness evolution.** Analysis was carried out to see the evolving fitness
    in each of the performances, assessing their behaviour and successes of the GA
    when varying the probability rate.

    +   c. **Convergence of the algorithm:** In which process the GA obtains the best
    fitness (best cluster).


    Since, the GA parameters directly affect the fitness behavior, before the experiments,
    we performed a comprehensive analysis of all GA performances, in order to determine
    its'
