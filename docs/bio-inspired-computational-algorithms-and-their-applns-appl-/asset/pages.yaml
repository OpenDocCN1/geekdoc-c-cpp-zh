    # 3.3 Link system design using weighting factors


    This section presents a procedure involving the use of a genetic algorithm for
    the optimal designs of single four-bar link systems and a double four-bar link
    system used in diesel engines. Studies concerning the optimal design of the double
    link system comprised of both an open single link system and a closed single link
    system which are rare, and moreover the application of the SZGA in this field
    is hard to find, where the shape of objective function have a broad, flat distribution
    1,2.


    During the optimal design of single four-bar link systems, one can find that for
    the case of equal IO angles, the initial and final configurations show certain
    symmetry. In the case of open single link systems, the radii of the IO links are
    the same and there is planar symmetry. In the case of closed single systems, the
    radii of the IO links are the same and there is point symmetry.


    To control the Swirl Control Valve in small High Speed Direct Injection engines,
    there are two types of actuating systems. The first uses a single DC motor controlled
    by Pulse Width Modulation, while the second uses two DC motors. However, this
    study uses the first type of actuator for the simultaneous control of two Swirl
    Control Valves using a double link system. When two intake valves in a diesel
    engine are controlled by a single motor, they usually exhibit quite different
    angular responses when the design variables for the control link system are not
    properly selected. Therefore, in order to ensure balanced performance in diesel
    engines with two intake valves, an optimization problem needs to be formulated
    and solved to find the best set of design variables for the double four-bar link
    system, which in turn can be used to minimize the different responses to a single
    input.


    Two weighting factors are introduced into the objective function to maintain balance
    between the multi-objective functions. The proper ratios of weighting factors
    between objective functions are chosen graphically. The optimal solutions provided
    by the SZGA and developed FORTRAN Link programs can be confirmed by monitoring
    the fitness. The reduction in the objective functions is listed in the tables.
    The responses of the output links that follow the simultaneously acting input
    links are verified by experiment and the Recurdyn 3-D kinematic analysis package.
    The experimental and analysis results show good correspondence.'
