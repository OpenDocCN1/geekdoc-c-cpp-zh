  md: 'The kind of device defines the algorithm to be used to obtain the overall cost
    of protective devices, and the SAIDI and SAIFI indexes according to Bishop (1997).
    So, each set Λ_i represents a different circuit, and applying the Bishop''s algorithms
    one obtains a result set


    Γ_i (Λ_i) = {SAIDI_i, SAIFI_i, c_Si, c_Ri, c_Fi} .  (32)


    where c_S, c_R and c_f are the costs of the main switch reclose switch and fuses,
    which are expressed in monetary "units", being one unit the cost of the a monophasic
    fuse.


    As the set Γ_i itself cannot express the degree of adaptation the individual Λ_i
    to the problem we want to solve, we must provide an expression to summarize Γ_i
    in a more convenient, single valued variable, like the gof value, described in
    subsection 3.1. The definition of this gof should have a monotonic behaviour as
    the costs and the SAIDI and SAIFI index increase. We adopted the simple expression


    gof = κ_1 (SAIDI + SAIFI) + κ_2 (c_S + c_R + c_F) .  (33)


    where κ_1 and κ_2 are constant scale converters. Then, our optimized circuit will
    be that one that offers the smaller gof. With this, our inverted NP-problem can
    be solved by looking for the individual Λ_i that presents the smaller gof. As
    all the parameters are limited range integer numbers (tokens), some special care
    must be taken in the GA routines that deal with new individuals and mutation.
    So, these routines where rebuild taking into account the discrete character of
    the chromosomes. The overall behaviour of the GA optimization code follows the
    algorithm proposed in figure 2.


