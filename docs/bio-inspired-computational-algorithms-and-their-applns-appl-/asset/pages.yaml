  img_proc: true
- pgno: 348
  md: 'evolve with time (31; 32; 37). Dynamic optimization problems considered in
    the literature so far address all these possibilities of change to some extend.
    Whereas a real alteration of the fundamental components of a search space such
    as dimensionality or representation (binary, integer, discrete, real, etc.) is
    really rare, a change in the feasibility of individuals is another and less substantial
    kind of a dynamic search space and is discussed within the problem setting of
    dynamic constraints (28; 36). The works on dynamic routing can partially be interpreted
    as a changing neighborhood structures (2; 15), while most of the work so far has
    been devoted to time-dependent fitness function (24; 26; 30; 33; 35; 39; 45),
    which will also be the focus of this paper.


    In dynamic optimization problems (DOPs), the fitness landscape


    $$f(x,k) \ge 0 \tag{1}$$


    defined over a fixed bounded search space $M \subset \mathbb{R}^n$ with $x \in
    M$, changes with discrete time $k \in \mathbb{N}_0$. The DOP is solved by an evolutionary
    algorithm (EA) with population $P \in \mathbb{R}^\mu$ and generational time $t
    \in \mathbb{N}_0$. Its population dynamics can be described by the generation
    transition function


    $$P(t + 1) = \psi(P(t)),\; t \ge 0, \tag{2}$$


    which explains how a population $P(t + 1)$ at generation $t + 1$ originates from
    the population $P(t)$ at generation $t$. Both the time scales $t$ and $k$ work
    as a measuring and ordering tool for changes ($t$ for changes in the population
    from one generation to the next, $k$ for changes in the dynamic fitness landscape).
    As $\mu$ individuals $p_i(t) \in P(t)$, $i=1,2,\dots,\mu$, populate the fitness
    landscape (1), they can be labeled with a fitness value $f(p_i(t),k)$. Both time
    scales are related in the solving process of the DOP by the change frequency $\gamma
    \in \mathbb{N}$ with


    $$t = \gamma k. \tag{3}$$


    Usually, $\gamma$ is considered to be constant for all generations $t$, but it
    might also be a function of $k$ and even be different (for instance a positive
    integer realization of a random process) for every $k$. Note that we require more
    than one generation in between landscape changes, $\gamma > 1$, and hence $k =
    \lfloor \gamma^{-1} t \rfloor$.


    # 3. The change detection problem


    From (3), we see that the fitness landscape changes every $\gamma$ generations.
    As the temporal patterns of these changes are assumed to be not explicitly known,
    our interest is now to infer from the fitness values


    $$f_i(k) = f(p_i,k) \tag{4}$$


    of the individuals $p_i(t) \in P(t)|_{t=\gamma k}$ if a change in the fitness
    landscape has occurred or not. This we call the change detection problem in dynamic
    fitness landscapes using fitness data from the population. More specifically,
    we want to detect the change point $t_{cp}$ with the property $\exists x \in M$
    for which


    $$f(x,\lceil \gamma^{-1}(t_{cp} - 1) \rceil) \neq f(x,\lceil \gamma^{-1} t_{cp}
    \rceil). \tag{5}$$


    Our convention is to define the change point $t_{cp}$ in the generational time
    scale $t$ as we base the detection solely on the fitness values $f(x,\lceil \gamma^{-1}
    t \rceil)$ of the population $P(t)$. From (3) follows'
