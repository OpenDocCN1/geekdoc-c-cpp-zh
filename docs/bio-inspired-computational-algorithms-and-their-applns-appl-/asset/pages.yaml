  md: 'where the edges come in. Such numeration is always possible for directed graphs
    without loops.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_37_0.png)


    Fig. 5. Graph of mathematical equation


    To calculate the mathematical equation which is presented as a graph we use additional
    vector of nodes z for storage of intermediate results. Each element of vector
    z is associated with the definite node in the graph. Initially elements of vector
    z that are associated with the source nodes have the values of variables and parameters.
    For example for the graph presented at Fig. 5 we have


    $\mathbf{z} = [z_1 \dots z_9]^T,$


    where 9 is the number of nodes in the graph. For the source nodes we set $z_1
    = x_1$, $z_2 = q_1$, $z_3 = x_2$. Values of other elements $z_i$ are equal to
    the unit elements for binary operations. As a result we get an initial value of
    vector of nodes


    $\mathbf{z} = [x_1 \; q_1 \; x_2 \; 0 \; 1 \; 0 \; 1 \; 0 \; 0]^T.$


    In the given example we use addition and multiplication. Unit element for addition
    is 0 and for multiplication is 1.


    According to the rules of calculation, we calculate unary operation that corresponds
    to the edge that comes out from the node that has no incoming edges. For the edge
    $(i,j)$ node $i$ has no incoming edges at the moment. Unary operation $\rho_i$
    corresponds to the edge $(i,j)$. Binary operation $\chi_j$ corresponds to the
    node $j$. Then we perform the following calculations


    $z_j = \chi_j(z_i, \rho_i(z_i)), \tag{9}$


    where $z_i$ in the right part of the equation is the value on the previous step.


    After calculation of (9) we delete the edge $(i,j)$ from the graph.


