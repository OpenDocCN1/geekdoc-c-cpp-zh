- pgno: 87
  md: 'Let N the population size. A collection of N/2 pairs is randomly composed,
    and crossover and mutation are applied to each pair, generating N/2 offspring.
    Parents and newly generated offspring are ranked and the best N individuals among
    them are selected for the population in the next generation. The population size
    was 400 for all experiments. If the population has no change during n × r × (1.0
    − r) generations, it is reinitialized except for the best individual. Here, r
    is a divergence rate and we set it to 0.25 as in Eshelman (1991). The used GA
    terminates when it finds the global optimum.


    For crossover, we used four crossover operators: box crossover, extended-box crossover
    (extension rate α: 0.5), line crossover, and extended-line crossover (extension
    rate α: 0.5). After crossover, we either mutate the offspring or do not. We used
    two different mutation operators; Gaussian mutation and fine mutation. Different
    mutation rates were applied to each crossover type and the rates decrease as the
    number of generations increases.


    Table 2 shows the results from 30 runs. Each value in ‘Ave’ means the average
    function value from 30 runs. The smaller, the better. The limit of function evaluations
    is 50,000, i.e., the genetic algorithm terminates after 50,000 evaluations and
    outputs the best solution among evaluated ones so far over generations. In the
    table, k = 1 + ⌊numberOfGenerations/100⌋ and the rate of fine mutation is 0.5/k.


    From these experiments we can obtain the following properties.


    +   - There is no superior operator combination for all over the problem instances.
    For the shifted sphere, box crossover with fine mutation showed the best performance.
    For the shifted Schwefel, line crossover with Gaussian mutation, for the shifted
    Rosenbrock, extended-box crossover without mutation, and for the shifted Rastrigin,
    box crossover with fine mutation showed the best performances, respectively. So
    we can know that suitable crossover and mutation can be varied depending on the
    property of given problem.

    +   - Without mutation, extended-box crossover showed the best performance. That
    is, when we do not know the characteristic of given problem, it is a general choice
    that we use extended-box crossover as a crossover operator in real-coded genetic
    algorithms. It is convenient since parameter tuning with mutation is not required.
    However, it is possible to surpass the performance of extended-box crossover using
    well-designed combination of crossover and mutation.

    +   - Unusually, for extended-box crossover, the results without mutation is the
    best and the performance becomes worse as mutation rate increases. However, for
    box crossover, moderate rate of mutation has a good effect to the performance.
    For all cases, box crossover with mutation showed better performance than that
    without mutation. From this fact, we can infer that extended-box crossover contains
    the function of mutation in itself but box crossover does not.

    +   - Except for extended-box crossover, the results of crossover with mutation
    were better than those of crossover without mutation. In particular, fine mutation
    was better than Gaussian mutation. Fine mutation depends on the distance between
    parents so, as population converges, the strength of the mutation approaches zero.
    That is, the amount of mutation becomes very fine as population converges. In
    binary encodings, the main role of mutation is perturbation effect to prevent
    premature convergence. However, we can know that, in real encoding, the function
    of fine tuning by mutation is also important from this experiment.'
