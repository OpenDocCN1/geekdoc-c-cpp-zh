    # ### 4.2.1 The model


    The pump compressor model used in this work is based on chapter 10 of Sutton &
    Biblarz (2001). This model provides a coherent basis for the modeling, and is
    sufficiently complex to be used as a valid test on the further parameter optimizing
    step.


    The pump parameters we want to find are: the inlet compressor diameter, d1, the
    compressor outlet diameter, d2, the fluid input velocity, v1, the suction specific
    speed, S, the shaft cross section, Asi, the pressure in the main tank, Pt, the
    total fluid friction (viscosity included) due to flow through the pipes, valves,
    etc, Pf, the pressure due to the tank elevation from the pump inlet, Pe. In particular,
    this last parameter leads to project insights concerning the pump position inside
    the rocket. These are the GA free parameters, formally Λ = {d1,d2,v1,S,Asi,Pt,Pf,Pe},
    known as the parameter set. The obtained compressor must deliver a desired mass
    rate, ṁ, and from an input pressure P0, generate a flow with an output pressure
    P2. Some constants should be considered, like the fluid mass density, ρ, and the
    external gravity, g0. We assumed as fluid the ethanol (C2H5OH) due to its green
    properties and green results. These three parameters are those the rocket engine
    designer should define to specify the compressor he needs. Differently from the
    first eight parameters described on the above paragraph, these values cannot be
    altered by the algorithm, and can be included in another group, the result set
    = {ṁ, P0, P2}.


    To satisfy the GA formalism, one must write down the model, or the formalism that
    describes the necessary transformations to obtain Γ from Λ, or Γ=f(Λ). One can
    obtain these expressions following Sutton & Biblarz (2001) model and converting
    their expressions. First, the pressures should be converted to heads, or the height
    necessary to the fluid to cause a given pressure, so we define H0, Hi, and Hf,
    the tank head, the elevation head and the friction head, respectively, that can
    be obtained by


    $$P_t = \int_{H_0}^{0} g_0 \rho \, dh, \quad (16)$$


    $$P_e = \int_{H_i}^{0} g_0 \rho \, dh, \quad (17)$$


    and


    $$P_f = \int_{H_f}^{0} g_0 \rho \, dh, \quad (18)$$


    The effective area of the inlet is given by


    $$A_{i0} = \frac{1}{4} \frac{d_1^2}{\pi} - A_{si}, \quad (19)$$


    which determines the volume flow'
