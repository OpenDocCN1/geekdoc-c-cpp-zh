    # ### 2.3 Classic Particle Swarm Optimization


    In PSO, each single solution, called a particle, is considered as an individual,
    the group becomes a swarm (population) and the search space is the area to explore.
    Each particle has a fitness value calculated by a fitness function, and a velocity
    to fly towards the optimum. All particles fly across the problem space following
    the particle that is nearest to the optimum. PSO starts with an initial population
    of solutions, which is updated iteration-by-iteration. The principles that govern
    PSO algorithm can be stated as follows:


    +   - $n$ dimensional position $(X_i=(x_{i1},x_{i2},...,x_{in}))$ and velocity
    vector $(V_i=(v_{i1},v_{i2},...,v_{in}))$ for $i^{th}$ particle starts with a
    random position and velocity.

    +   - Each particle knows its position and value of the objective function for
    that position. The best position of $i^{th}$ particle is denoted as $P_i=(p_{i1},p_{i2},...,p_{in})$,
    and the best position of the whole swarm as $G=(g_1,g_2,...,g_n)$ respectively.
    The PSO algorithm is governed by the following main equations:


    $$

    v_{in}^{t+1}=wv_{in}^{t}+c_1 r_1(p_{in}^{t}-x_{in}^{t})+c_2 r_2(g_n^{t}-x_{in}^{t})
    \tag{4}

    $$

    $$

    x_{in}^{t+1}=v_{in}^{t+1}+x_{in}^{t}

    $$


    where $t$ represents the iteration number, $w$ is the inertia weight which is
    a coefficient to control the impact of the previous velocities on the current
    velocity, $c_1$ and $c_2$ are called learning factors, $r_1$ and $r_2$ are uniformly
    distributed random variables in $[0,1]$.


    The original PSO algorithm can optimize problems in which the elements of the
    solution space are continuous real numbers. The major obstacle for successfully
    applying PSO to combinatorial problems in the literature is due to its continuous
    nature. To remedy this drawback, Tasgetiren et al. [17] presented the smallest
    position value (SPV) rule. Another approach to tackle combinatorial problems with
    PSO is done by Pan et al. [21]. They generate a similar PSO equation to update
    the particle’s velocity and position vectors using one and two cut genetic crossover
    operators.


    # ### 3. The proposed Stochastically Perturbed Particle Swarm Optimization algorithm


    In this chapter, a stochastically perturbed particle swarm optimization algorithm
    (SPSO) is proposed for the PM5 problems. The initial population is generated randomly.
    Initially, each individual with its position, and fitness value is assigned to
    its personal best (i.e., the best value of each individual found so far). The
    best individual in the whole swarm with its position and fitness value, on the
    other hand, is assigned to the global best (i.e., the best particle in the whole
    swarm). Then, the position of each particle is updated based on the personal best
    and the global best. These operations in SPSO are similar to classical PSO'
