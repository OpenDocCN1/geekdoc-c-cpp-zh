    # 10. Conclusions


    From the above it can be obtained several conclusions. The first is that the methodology
    developed here based on setting out the building of linear models as an optimization
    problem, where the construction of the problem is guided by the classical TS theory,
    is correct because allows to build better models than those obtained by the traditional
    methods.


    Another conclusion is that the fact of choosing the SAGA as an alternative to
    solve the problems set out here is very important since this allows exploring
    the solution space of our problem and finding the most significant variables to
    solve it. In addition, the SAGA version developed has proved to be very robust
    in solving many different problems with out adjustment of parameters.


    As a result not contemplated it was found that the phenomenon of FD, which allowed
    us to construct new linear models for TS, which in some cases are better alternatives
    compared to other linear and nonlinear models. In addition, these new models have
    great potential for application in areas such as industrial control, economics,
    finance, etc. In particular, we think that the FD is a characteristic of the phenomenon
    in question, but that is only detected if the model is built with an appropriate
    methodology, particularly in the selection and setting limits of variables.


    Finally, it should be noted that having a fully automated methodology with the
    ability to model phenomena that other methodologies cannot open a whole world
    of possibilities in the development of computer systems for modelling and process
    control.


