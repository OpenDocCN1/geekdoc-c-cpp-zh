  md: '# 3.5 An illustrative example


    Let us now consider the following example taken from (Fernandez and Navarro, 2005).
    The goal is to distribute a budget of 50 million dollars among 400 R&D projects.
    These projects are distributed in four areas, namely engineering, life sciences,
    formal sciences, and social sciences. There are 140 projects in the first area
    (engineering), 80 projects in the second one (life sciences), 100 projects in
    the third area (formal sciences), and 80 project in the last area (social sciences).
    No synergetic effects are considered.


    The classification of the projects, according to their evaluations and areas,
    is described in Table 1. The projects subjective values corresponding to each
    category and area are shown in Table 2. These values were obtained taking a social
    sciences project evaluated as Below Average as baseline (w = 1). These values
    define a ranking on the set of projects that can be used to allocate funds according
    to the conventional heuristic described in Section 1 (with all its known limitations).


    |  | Area 1 | Area 2 | Area 3 | Area 4 |

    |---|---|---|---|---|

    | Very Good | 54 | 28 | 13 | 12 |

    | Good | 23 | 9 | 18 | 24 |

    | Above Average | 62 | 32 | 36 | 28 |

    | Average | 1 | 9 | 17 | 11 |

    | Below Average | 0 | 2 | 16 | 5 |

    | Total | 140 | 80 | 100 | 80 |


    Table 1. Distribution of Projects by Area.


    |  | Area 1 | Area 2 | Area 3 | Area 4 |

    |---|---|---|---|---|

    | Very Good | 5.838 | 4.3785 | 3.892 | 2.9190 |

    | Good | 4.540 | 3.4055 | 3.027 | 2.2700 |

    | Above Average | 3.027 | 2.2700 | 2.018 | 1.5135 |

    | Average | 2.108 | 1.5810 | 1.405 | 1.0540 |

    | Below Average | 2.000 | 1.5000 | 1.333 | 1.0000 |


    Table 2. Projects Subjective Values.


    Four different instances of the problem were generated by assigning random budget
    ranges to each area. For each project, random values of m_i^a and M_i^a were defined,
    representing its minimum and maximum funding requirements. The proposed evolutionary
    algorithm was run 30 times to optimize the expression given by Problem definition
    2. For simplicity f(μ_a) was taken to be identical to μ_a.'
