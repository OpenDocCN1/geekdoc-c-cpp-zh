    # 6. Restricted-vocabulary speech recognition system


    The expression restricted-vocabulary speech recognition refers to the recognition
    of repetitions of spoken words that belongs to a limited set of words within a
    semantic field. This means that the words have connected meanings, for instance,
    the digits = {0,1,2,..., 9} or the days of the week=[Saturday, Monday,..., Friday].
    The applications of the recognition of limited size word-sets include voice-commanded
    systems, spoken entry and search for computer databases in warehouse systems,
    voice-assisted telephone dialing, man-machine interfaces, and others. The advantage
    of a system developed for a specific semantic field is that it can be built to
    be much more accurate than those constructed for the general speech recognition,
    also requiring less extensive training sets.


    Restricted-vocabulary speech recognition is also an important research topic because
    of the intricacies involved in the underlying pattern recognition problem: variable
    selection, feature generation/selection and classifier selection. Variable selection
    is mostly restricted to select the raw digitized voice signal as the variable;
    alternatively, the surrounding environmental noise could be used as another variable
    for noise cancelation purposes. Feature generation has been carried out by obtaining
    linear predictive coefficients (LPC),'
