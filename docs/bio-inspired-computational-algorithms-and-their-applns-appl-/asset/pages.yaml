    # 10. Conclusion


    In this work the new approach to the problem of automatic search of mathematical
    equations was considered. The researcher defines the sets of operations, variables
    and parameters. The computer program generates a number of mathematical equations
    that satisfy given restrictions. Then the optimization algorithm finds the structure
    of appropriate mathematical expression and its parameters. The approach is based
    on the new data structure the network operator.


    If we replace the set of unary and binary operations in the network operator by
    the set of logic operations, then we can perform the search of the most suitable
    logic function (Alnovani et al. 2011).


    # 11. Limitations & development


    Presentation of the network operator as a matrix is limited by its dimension.'
