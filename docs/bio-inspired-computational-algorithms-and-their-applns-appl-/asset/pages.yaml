- pgno: 204
  md: 'The problem with these point crossover methods is that no new information is
    introduced: each continuous value that was randomly initiated in the initial population
    is propagated to the next generation, only in different combinations. Although
    this strategy worked fine for binary representations, in case of continuous variables,
    we are merely interchanging two data points. These approaches totally rely on
    mutation to introduce new genetic material. The blending methods remedy this problem
    by finding ways to combine variable values from the two parents into new variable
    values in the offspring [Randy L. Haupt & Sue Ellen Haupt, 2004]. A single offspring
    variable value, p_{new}, comes from a combination of the two corresponding offspring
    variable values:


    $$p_{new} = βp_{mn} + (1 − β)p_{dn}    (10)$$


    where


    +   - β = random number in the interval [0, 1]

    +   - p_{mn} = the nth variable in the mother chromosome

    +   - p_{dn} = the nth variable in the father chromosome


    The same variable of the second offspring is merely the complement of the first
    (i.e., replacing β by 1 - β). If β = 1, then p_{mn} propagates in its entirety
    and p_{dn} dies. In contrast, if β = 0, then p_{dn} propagates in its entirety
    and p_{mn} dies. When β = 0.5, the result is an average of the variables of the
    two parents. This method is demonstrated to work well on several interesting problems
    in [Randy L. Haupt & Sue Ellen Haupt, 2004].


    Choosing which variables to blend is the next issue to be solved. Sometimes, this
    linear combination process is done for all variables to the right or to the left
    of some crossover point. Any number of points can be chosen to blend, up to N_{var}
    values where all variables are linear combinations of those of the two parents.
    The variables can be blended by using the same β for each variable or by choosing
    different β’s for each variable. These blending methods effectively combine the
    information from the two parents and choose values of the variables between the
    values bracketed by the parents; however, they do not allow introduction of values
    beyond the extremes already represented in the population. The simplest way is
    the linear crossover [Randy L. Haupt & Sue Ellen Haupt, 2004], where three offspring
    are generated from two parents by


    $$p_{new1} = 0.5p_{mn} + 0.5p_{dn}; p_{new2} = 1.5p_{mn} − 0.5p_{dn}; p_{new3}
    = −0.5p_{mn} + 1.5p_{dn}    (11)$$


    Any variable outside the bounds is discarded. Then the best two offspring are
    chosen to propagate. Of course, the factor 0.5 is not the only one that can be
    used in such a method. Heuristic crossover [Randy L. Haupt & Sue Ellen Haupt,
    2004] is a variation where some random number, β, is chosen on the interval [0,
    1] and the variables of the offspring are formed by:


    $$p_{new} = β(p_{mn} − p_{dn}) + p_{mn}    (12)$$'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Variations on this theme include choosing any number of variables to modify
    and generate different β for each variable. This method also allows generations
    of offspring outside the value ranges of the two parent variables. If this happens,
    the offspring is discarded and the algorithm tries to use another β. The blend
    crossover (BLX-α) method [Randy L. Haupt & Sue Ellen Haupt, 2004] begins by choosing
    some parameters that determine the distance outside the bounds of the two parent
    variables that the offspring variable may lay. This method allows new values outside
    of the range of the parents without letting the algorithm stray too far.


    The algorithm is a combination of an extrapolation method with a crossover method.
    The goal was to find a way to closely mimic the advantages of the binary GA mating
    scheme. It begins by randomly selecting a variable in the first pair of parents
    to be the crossover point:


    ```

    α = roundup{random * N_var}  (13)


    Let

    parent₁ = [p_m1 ... p_mα ... p_mN_var]

    parent₂ = [p_d1 ... p_dα ... p_dN_var]  (14)

    ```


    where the m and d subscripts discriminate between the mom and the dad parent.
    Then the selected variables are combined to form new variables that will appear
    in the children:


    ```

    pnew₁ = p_mα - β[p_mα - p_dα]  (15)

    pnew₂ = p_dα + β[p_mα - p_dα]

    ```


    where β is a random value between 0 and 1. The final step is to complete the crossover
    with the rest of chromosome:


    ```

    offspring₁ = [p_m1 p_m2 p_new1 ... p_mN_var]  (16)

    offspring₂ = [p_d1 p_d2 p_new2 ... p_mN_var]

    ```


    where β is also a random value between 0 and 1. The final is to complete the crossover
    with the rest of the chromosome as before:


    If the first variable of the chromosomes is selected, then only the variables
    to the right of the selected variable are swapped. If the last variable of the
    chromosomes is selected, then only the variables to the left of the selected variable
    are swapped. This method does not allow offspring variables outside the bounds
    set by the parent unless β > 1.


    # 2.4.2.1.6 Mutation


    If care is not taken, the GA can converge too quickly into one region on the cost
    surface. If this area is in the region of the global minimum, there is no problem.
    However, some functions have many local minima. To avoid overly fast convergence,
    other areas on the cost surface must be explored by randomly introducing changes,
    or mutations, in some of the variables. Random numbers are used to select the
    row and columns of the variables that are to be mutated [Randy L. Haupt & Sue
    Ellen Haupt, 2004].'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 2.4.2.1.7 Next generation


    After all these steps, the chromosomes in the starting population are ranked and
    the bottom ranked chromosomes are replaced by offspring from the top ranked parents
    to produce the next generation. Some random variables are selected for mutation
    from the bottom ranked chromosomes. The chromosomes are then ranked from lowest
    cost to highest cost. The process is iterated until a global solution is achieved.


    # 2.5 Image fusion


    In last decades, the rapid developments of image sensing technologies make multisensory
    systems popular in many applications. Researchers have begun to work on the fields
    of these systems such as medical imaging, remote sensing and the military applications
    [D.Patnaik, 2006]. The outcome of using these techniques is a great increase of
    the amount of diversity data available. Multi-sensor image data often present
    complementary information about the region surveyed so that image fusion provides
    an effective method to enable comparison and analysis of such data [H. Wang, 2004].
    Image fusion is defined as the process of combining information in two or more
    images of a scene to enhance viewing or understanding of the scene. The fusion
    process must preserve all relevant information in the fused image [A. Mumtaz &
    A. Majid, 2008; S. Erkanli & Zia-Ur Rahman, 2010].


    Image fusion can be done at pixel, feature and decision levels. Out of these,
    the pixel level fusion method is the simplest technique, where average/ weighted
    averages of individual pixel intensities are taken to construct a fused image
    [K. Kannan & S. Perumal, 2007]. Despite their simplicity, these methods are not
    used nowadays because of some serious disadvantages they possess. For instance,
    the contrast of the fused information is reduced and also redundant information
    is introduced in the fused image, which may mask the useful information. These
    disadvantages are overcome by feature level and decision level fusion methods.
    Feature and decision level fusion methods are based on human vision system. Decision
    level fusion combines the results from multiple algorithms to yield a final fused
    image. Several pyramid transform methods for feature level fusion have been suggested
    [A. Wang et al., 2006]. Recently, developed methods based on the wavelet transform
    become popular [A. Wang et al., 2006]. In the method source images are decomposed
    into subimages of different resolutions and in each subimage different features
    become prominent. To fuse the original source images, the corresponding subimages
    of different source images are combined based some criteria to form composite
    subimages. Inverse pyramid transform of composite transform gives the final fused
    image.


    # 3. Enhancing poor visibility images


    # 3.1 Introduction


    The human visual system (HVS) allows individuals to assimilate information from
    their environment [S. Erkanli & Zia-Ur Rahman, 2010b; H. Kolb, 2003]. The HVS
    perceives colors and detail across a wide range of photometric intensity levels
    much better than electronic cameras. The perceived color of an object, additionally,
    is almost independent of the type of'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'illumination, i.e., the HVS is color constant. Electronic cameras suffer, by
    comparison, from limited dynamic range and the lack of color constancy and current
    imaging and display devices such as CRT monitors and printers have limited dynamic
    range of about two orders of magnitude, while the best photographic prints can
    provide contrast up to 10^5:1. However, real world scenes can have a dynamic range
    of six orders of magnitude [S. Erkanli & Zia-Ur Rahman, 2010b; L. Tao et al.,
    2005]. This can result in overexposure that causes saturation in high contrast
    images, or underexposure in dark images [Z. Rahman, 1996]. The idea behind enhancement
    techniques are to bring out details in images that are otherwise too dim to be
    perceived either due to insufficient brightness or insufficient contrast [Z. Rahman,
    1997]. A large number of image enhancement methods have been developed, like log
    transformations, power law transformations, piecewise-linear transformations and
    histogram equalization. However these enhancement techniques are based on global
    processing which results in a single mapping between the input and the output
    intensity space. These techniques are thus not sufficiently powerful to handle
    images that have both very bright and very dark regions. Other image enhancement
    techniques are local in nature, i.e., the output value depends not only on the
    input pixel value but also on pixel values in the neighborhood of the pixel. These
    techniques are able to improve local contrast under various illumination conditions.


    Single-Scale Retinex (SSR), is a modification of the Retinex algorithm introduced
    by Edwin Land [G. D. Hines et al., 2004; E. Land, 1986]. It provides dynamic range
    compression (DRC), color constancy, and tonal rendition. SSR gives good results
    for DRC or tonal rendition but does not provide both simultaneously. Therefore,
    the Multi-Scale Retinex (MSR) was developed by Rahman et al. The MSR combines
    several SSR outputs with different scale constants to produce a single output
    image, which has good DRC, color constancy and good tonal rendition. The outputs
    of MSR display most of the detail in the dark pixels but at the cost of enhancing
    the noise in these pixels and the tonal rendition is poor in large regions of
    slowly changing intensity. As a result, Multi-Scale Retinex with Color Restoration
    (MSRCR) was developed by Jobson et al., for synthesizing local contrast improvement,
    color constancy and lightness/color rendition. Other non-linear enhancement models
    include the Illuminance Reflectance Model for Enhancement (IRME) proposed by Tao
    et al. [L. Tao et al., 2005], and the Adaptive and Integrated Neighborhood-Dependent
    Approach for Nonlinear Enhancement (AINDANE) described by Tao [L.Tao, 2005]. Both
    use a nonlinear function for luminance enhancement and tune the intensity of each
    pixel based on its relative magnitude with respect to the neighboring pixels.


    In this section, a new image enhancement approach is described: Enhancement Technique
    for Nonuniform and Uniform-Dark Images (ETNUD). The details of the new algorithm
    are given in Section 3.2, respectively. Sections 3.3 describe experimental results
    and compare our results with other techniques for image enhancement. Finally in
    Section 3.4, conclusions are presented.


    # 3.2 Enhancement Technique for Nonuniform and Uniform-Dark Images (ETNUD)


    The major innovation in ETNUD is in the selection of the transformation parameters
    for DRC, and the surround scale and color restoration parameters. The following
    sections describe the selection mechanisms.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 3.2.1 Selection of transformation parameters for DRC


    The intensity I of the color image $I_c$ can be determined by:


    $I(m,n)=0.2989r(m,n)+0.587g(m,n)+0.114b(m,n)$ (17)


    where $r$, $g$, $b$ are the red, green, and blue components of $I_c$, respectively,
    and $m$ and $n$ are the row and column pixel locations respectively. Assuming
    I to be 8-bits per pixel, $I_n$ is the normalized version of $I_c$ such that:


    $I_n(m,n)=I(m,n)/255$ (18)


    Using linear input-output intensity relationships typically does not produce a
    good visual representation compared with direct viewing of the scene. Therefore,
    nonlinear transformation for DRC is used, which is based on some information extracted
    from the image histogram. To do this, the histogram of the intensity images is
    subdivided into four ranges:


    $r_1=0-63$, $r_2=64-127$, $r_3=128-191$ and $r_4=192-255$. $I_n$ is mapped to
    $I_n^{drc}$ using the following:


    $I_n^{drc}=\begin{cases}(I_n)^x+\alpha & 0<x<1\\(0.5+(0.5I_n)^x)+\alpha & x\ge1\end{cases}$
    (19)


    The first mapping pulls out the details in the dark regions, and the second suppresses
    the bright overshoots. The value of $x$ is given by


    $x=\begin{cases}0.2, & \text{if } (f(r_1)+r_2)\ge(f(r_3)+r_4)) \land (f(r_1)\ge(f(r_2)))\\0.5,
    & \text{if } (f(r_1)+r_2)\ge(f(r_3)+r_4)) \land (f(r_1)<(f(r_2)))\\3.0, & \text{if
    } (f(r_1)+r_2)<(f(r_3)+r_4)) \land (f(r_1)\ge(f(r_2)))\\5.0, & \text{if } (f(r_1)+r_2)<(f(r_3)+r_4))
    \land (f(r_1)<(f(r_2)))\end{cases}$ (20)


    where $f(a)$ refers to number of pixels between the range $(a)$, $f(a_1+a_2)=f(a_1)+f(a_2)$,
    and $\land$ is the logical AND operator. $\alpha$ is the offset parameter, helping
    to adjust the brightness of image. The determination of the $x$ values and their
    association with the range-relationships as given in Equation 20 was done experimentally
    using a large number of non-uniform and uniform dark images and $x$ value can
    be also determined manually. The DRC mapping of the intensity image performs a
    visually dramatic transformation. However, it tends to have poor contrast, so
    a local, pixel dependent contrast enhancement method is used to improve the contrast.


    # 3.2.2 Selection of surround parameter and color restoration


    Many local enhancement methods rely on center/surround ratios [L. Tao, 2005].
    Hurlbert [A. C. Hulbert, 1989] investigated the Gaussian as the optimal surround
    function. Other'
