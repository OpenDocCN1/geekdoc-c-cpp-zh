    and 7 function block inputs, from a total number of 160. Surprising is the fact
    that, although evolutionary design, with the same state assignment, provides more
    complicated equations, the implementation of this circuit in XCR3064XL CPLD also
    used 7 macrocells from a total number of 64, 10 product terms from a total number
    of 224, and 7 function block inputs, from a total number of 160. This is even
    a better result than in preceding case, because the number of product terms is
    less with 1. Both implementations have used the same number of flip-flops (that
    is 3/64) and the same number of pins used like inputs/outputs (that is 9/32).
    We have preserved the state assignment of the FSM, and the subcircuits A and B
    are in fact as pure combinational circuits. The interesting fact is that our GA
    has supplied a better solution than the one given by the minimization tool used
    for this purpose by the CAD software.


    # ### 5.2 Multiple hybridization of a GA


    Hybrid Genetic Algorithms (HGAs) combine the power of the GA with the speed of
    a local optimizer. Usually the GA finds the region of the optimum, and then the
    local optimizer takes over to find the minimum. (Bilchev & Parmee, 1996) developed
    a search space reduction methodology, which was called the Inductive Search. The
    problem of global optimisation is partitioned into a sequence of subproblems,
    which are solved by searching of partial solutions in subspaces with smaller dimensions.


    This method has been used to solve the Automatic Test Pattern Generation Problem
    in Programmable Logic Arrays (PLAs), that is to find an effective set of input
    test vectors,'
