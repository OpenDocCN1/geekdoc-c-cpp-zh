- pgno: 209
  md: 'surround functions proposed by [E. Land, 1986] were compared with the performance
    of the Gaussian proposed by [D. J. Jobson, et al., 1997]. Both investigations
    determined that the Gaussian form produced good dynamic range compression over
    a range of space constants. Therefore, the luminance information of surrounding
    pixels is obtained by using 2D discrete spatial convolution with a Gaussian kernel,
    G(m, n) defined as:


    G(m,n) = K exp( -(m² + n²)/σ_s² )  (21)


    where σ_s is the surround space constant equal to the standard deviation of G(m,
    n), and K is determined under the constraint that Σ_{m,n} G(m,n) = 1 .


    The center-surround contrast enhancement is defined as:


    I_cs(m,n) = 255 [ I_n^{dec}(m,n) ]^{I(m,n)}  (22)


    where, E(m, n) is given by:


    E(m,n) = [ I_mu(m,n) / I(m,n) ]^S  (23)


    where


    I_mu(m,n) = I(m,n) * G(m,n)  (24)


    S is an adaptive contrast enhancement parameter related to the global standard
    deviation of the input intensity image, I(m, n), and ''*'' is the convolution
    operator, I(m, n) is defined by:


    S = { 3 for σ ≤ 7 ; 1.5 for 7 < σ ≤ 20 ; 1 for σ ≥ 20 }  (25)


    σ is the r,g,b-standard deviation—of the original intensity image. If σ < 7, the
    image has poor contrast and the contrast of the image will be increased. If σ
    ≥ 20, the image has sufficient contrast and the contrast will not be changed.
    Finally, the enhanced image can be obtained by linear color restoration based
    on chromatic information contained in the original image as:


    S_j(x,y) = I_cs(x,y) * I_j(x,y) / I(x,y) * λ_j  (26)


    where j ∈ {r,g,b} represents the RGB spectral band and λ_j is a parameter which
    adjusts the color hue.


