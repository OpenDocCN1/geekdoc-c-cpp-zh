    # 4.1 Studies to determine the value of α in the GA


    We use the distribution Reuters 21 of be that greater dispersion across your documents
    and apply the GA varying the value of α in each of the tests with the usual parameters,
    always trying to test the effectiveness of the GA. We analyzed the relationship
    between fitness and the value of α using the values in table 2. (the results are
    shown in table 3 and figure 6).


    In figure 6, we can see that there is an increased dispersion of fitness values
    over 0.85, due to the increased contribution of Euclidean distance which makes
    it insensitive to fitness to find the clusters. The results, suggest that a value
    of α close to 0.85, provides better results because it gives us more effective
    in terms of number of hits, and a better fitness of the algorithm. This was corroborates
    with other distribution.'
