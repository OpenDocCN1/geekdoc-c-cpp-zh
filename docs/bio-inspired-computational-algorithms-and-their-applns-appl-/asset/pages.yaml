  img_proc: true
- pgno: 58
  md: '+   3. Regeneration takes the value from the individuals by the percentage
    to be regenerated.

    +   4. This population is converted to binary representation.

    +   5. The position that will occupy the regenerated ones in the original population
    is determined without altering the number of individuals.

    +   6. Reinsert the regenerated population into a sector of the original population.

    +   7. The best individual in the regenerated population introduces itself, looking
    forward not to alter the number of individuals.


    Following the development of the genetic algorithm, taking the best individuals
    from the population will pay the selection of those who have been outfitted as
    parents of the new generations.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_58_0.png)


    Fig. 4. Forced Inheritance Mechanism (Merchán-Cruz, 2005).


    For the Parent Selection exists several techniques, but the most used is the proportional
    selection proposed by (Goldberg, 1989) in this each individual have a probability
    of being selected like parents, that is proportional to the value estimated by
    means of the objective function.


    Crossover is based on taking two individuals correctly adapted to obtain descendants
    that share genes of both. There are several types of crossover mechanisms that
    are used depending on the scheme that is analyzed. According to (Kuri-Morales
    and Galaviz-Casas, 2002) the most popular are: single point crossover, two points
    and uniform crossover.


    Mutation is an operator that is applied with probability pm and has the effect
    to invert a single bit using a probability of mutation of bit i-1, being l the
    length of the chain of the chromosome.


    While crossover needs large populations to effectively combine the necessary information,
    mutation works best when applied to small populations during a large number of
    generations. Mutation is usually a secondary search operator which performs a
    random search locally around a solution and therefore has received far less attention.
    However, in evolutionary strategies where crossover is the primary search operator,
    significant attention has been paid to the development of mutation operators.
    Several mutation operators, including adaptive techniques, have been proposed
    by (Lima, 2005). Clearly, mutation cannot perform this role as well as crossover.'
