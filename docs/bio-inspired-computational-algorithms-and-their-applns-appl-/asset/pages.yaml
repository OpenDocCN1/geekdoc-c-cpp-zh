    # Bank-filter Design.


    During the operation phase, the calculation of the power spectrum of the incoming
    voice signals is not practical for real-time response because the discrete Fourier
    transform (DFT [2], [3]) requires too much time to be calculated, and the fast
    Fourier Transform (FFT [2], [3]) requires that the number of samples to be a power
    of 2, requiring zero padding most of the times. Instead of using the power spectrum,
    in this application it is used the Parseval''s theorem, described in section 4.2,
    which states that the energy in time and frequency is equal. In discrete form,
    we recall equation (32):


    $$\sum_{i=0}^{N-1} x[i]^2 = \frac{2}{N^{1/2}} \sum_{k=0}^{N} |X[k]|^2$$'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'where $x[i]$ is the time domain signal with and $X[k]$ is its modified frequency
    espectrum, which is found by taking the DFT of the signal and dividing the first
    and last frequencies by the square rooth of two. Therefore, all that have to be
    done is to filter the sub-bands out of the time signals and then to calculate
    the energy in each sub-band. This can be perfectly accomplished by a bank of digital
    band-pass filters whose parameters match the parameters found by the genetic algorithm,
    and the advantage is that at the end of the last sample of voice in real-time
    a word can be immediately recognized.


    In the Operation Phase, the three first stages operate simultaneously at each
    time a sample of the voice is acquired, and occur between two successive sampling
    intervals; in the first stage the voice signal is acquired and a normalization
    coefficient $N$: is updated with the maximum value of the signal; the block labeled
    filtering represent the action of the filter bank and the outgoing signal is squared
    and added sample by sample. At the end of a voiced segment of sound, the third
    block provides to a classifier with the set of features for word classification.


    # 6.2 System design


    In this section the details of the system design will be presented.


    # 6.2.1 Characterization of the frequency spectrum using sub-bands


    Consider the Fourier Transform of a signal:


    $S(\omega)=F\{s(t)\}$  (40)


    Now consider the frequency spectrum split in sub-bands, as shown in Figure 9.
    Please notice in Figure 9 that $S(\omega)$ has been normalized to unitary amplitude.
    For each sub-band, the energy can be calculated as:


    $E_i = k_0 \sum_{lb}^{ub} \big(S(\omega)\big)^2$  (41)


    where $E_i$ is the energy of the $i$-th sub-band, $k_0$ is a constant proportional
    to the bandwidth ($BW_i$) of the $i$-th sub-band, $lb$ and $ub$ are the lower
    and upper bounds of the $i$-th sub-band. The feature vector of the $n$-th utterance
    of $s(t)$ in the frequency domain becomes:


    $S_{r_n}(\omega)=[E_1\;E_2\;E_3\;\dots\;E_M]$  (42)


    In which $M$ is the number of sub-bands, and $S_{r_n}$ is the reduced version
    of the $n$-th $S(\omega)$. In order to characterize a word in the vocabulary,
    $N$ samples of $s(t)$ must be entered. From the example in Figure 9 and without
    loss of generality, the set of parameters of the respective filter bank that will
    operate in the time domain is:


    $BF = [C_1\;BW_1\;C_2\;BW_2\;C_3\;BW_3\;\dots\;C_L\;BW_L]$  (43)


    The number of filters to be applied in the time-domain signal in this case is
    $L$. For a vocabulary of $K$ words ($K$ small), the spectra in which the solution
    must be searched is given by $K$ matrices of $N$ rows and 2000 columns.'
