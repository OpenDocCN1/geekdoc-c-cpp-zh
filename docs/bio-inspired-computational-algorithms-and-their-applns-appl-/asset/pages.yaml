  md: "```\nbox-crossover(x,y)\n{\n  for i ← 1 to n\n    z_i ← a random real number\
    \ in [min(x_i,y_i),max(x_i,y_i)];\n  return z = (z_1,z_2,...,z_n);\n}\n```\n\n\
    Fig. 2. Pseudo-code of box crossover\n\n```\nextended-box-crossover(x,y)\n{\n\
    \  for i ← 1 to n\n    m ← min(x_i,y_i), M ← max(x_i,y_i);\n    em ← m - α(M -\
    \ m), eM ← M + α(M - m);\n    z_i ← a random real number in [min(em,l_i),max(eM,u_i)];\n\
    \  return z = (z_1,z_2,...,z_n);\n  // α is extension rate.\n```\n\nFig. 3. Pseudo-code\
    \ of extended-box crossover\n\nThe mask is still a binary vector dictating for\
    \ each position of the offspring vector from which parent the (real) value for\
    \ that position is taken.\n\nThe blend recombination family does not exchange\
    \ values between parents like discrete recombinations but it averages or blends\
    \ them. Line recombination returns offspring on the (Euclidean) line segment connecting\
    \ the two parents. Box recombination returns offspring in the box (hyper-rectangle)\
    \ whose diagonally opposite corners are the parents. Extended-line recombination\
    \ picks offspring on an extended segment passing through the parent vectors but\
    \ extending beyond them and not only in the section between them. Analogously\
    \ extended-box recombination picks offspring on an extended box whose main diagonal\
    \ passes through the parents but extends beyond them.\n\nRecently several new\
    \ crossovers for the real-coded representation have been designed. Several non-traditional\
    \ crossover operators for real-coded representation are found in the recent literature.\
    \ They include SBX (simulated binary crossover) (Ballester & Carter, 2003; 2004b;\
    \ Deb & Agrawal, 1995; Deb & Beyer, 1999; Deb & Kumar, 1995; Deb et al., 2007),\
    \ UNDX (unimodal normal distribution crossover) (Kita et al., 1998, 1999; Ono\
    \ et al., 1999; Ono & Kobayashi, 1997), SPX (simplex crossover) (Higuchi et al.,\
    \ 2000; Tsutsui & Goldberg, 2002; Tsutsui et al., 2001, 1999), PCX (parent-centric\
    \ crossover) (Ballester & Carter, 2004a; Deb et al., 2002, etc [Herrera et al.,\
    \ 2003; 2005; Takahashi & Kita, 2001]. Most of them are complex and based on the\
    \ specific probability distribution of the offspring (SBX, UNDX, and PCX), self-adaptivity\
    \ (SBX and UNDX), or multiple parents (UNDX and SPX). Some of them, e.g., include\
    \ the function of mutation operators. In this study, we focus on traditional crossover\
    \ that does not consider the specific probability distribution of the offspring\
    \ but only what offspring can be generated with a probability greater than zero,\
    \ given the two parents."
