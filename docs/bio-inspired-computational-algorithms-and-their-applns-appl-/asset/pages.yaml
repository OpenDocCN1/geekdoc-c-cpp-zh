- pgno: 283
  md: 'best individuals to the new population and to ensure that a significant number
    of the fitter individuals will make it to the next generation. Tournament selection
    is applied in the genetic algorithm for selecting the individuals to the mating
    pools for the remaining ninety percent of the population (Blickle & Thiele, 2001).
    Tournament selection technique was chosen because it is known to perform well
    in allowing a diverse range of fitter individuals to populate the mating pool
    (Blickle & Thiele, 1995). By implementing the tournament selection, fitter individuals
    can contribute to the next generation genetic construction and the best individual
    will not dominate in the reproduction process compared to the proportional selection.


    # 3.3.4 Crossover process


    The extension operator floating point crossover operator is used this work (Beasley
    et al. 1993b). This operator works by taking the differences between the two values,
    adding it to the higher value (giving the maximum range), and subtracting it from
    the lower value (giving the minimum range). The new values for the genes are then
    generated between the minimum and the maximum range that were derived using this
    operator (Anthony & Jennings, 2002).


    # 3.3.5 Mutation process


    Since the encoding is a floating point, the mutation operator used in this work
    must be a non-binary mutation operator. Beasley has suggested a few non-binary
    mutation operators such as random replacement, creep operator and geometric creep
    (Beasley et al. 1993b) that can be used. The creep operator which adds or subtracts
    a small randomly generated amount from selected gene is used to allow a small
    constant of 0.05 to be added or subtracted from the selected gene depending on
    the range limitation of the parameter (Anthony & Jennings, 2002).


    # 3.3.6 Stopping criteria


    The genetic algorithm will repeat the process until the termination criteria are
    met. In this work, the evolution stops after 50 iterations. An extensive experiment
    was conducted to determine the point at which the population converges. It was
    decided to choose 50 as the stopping criterion since it is was observed that the
    population will always converge before or at the end of the 50 iterations.


    Anthony''s work has some shortcoming where the crossover and mutation rate used
    in the work is based on literature review recommended values. However, researches
    have shown that the crossover rate and mutation rate applied in the application
    are application dependent, thus, simulation need to be conducted in order to find
    the suitable crossover and mutation rate. Besides that, other variations of genetic
    algorithm have proven to perform better than traditional genetic algorithm which
    is worthwhile to be investigated.


    # 4. Parameter tuning


    Many researchers such De Jong, Grefenstte, Schaffer and others have contributed
    considerable efforts into finding the parameters values which are good for a number
    of'
