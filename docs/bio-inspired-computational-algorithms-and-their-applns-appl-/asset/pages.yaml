- pgno: 30
  md: '# The Network Operator Method for Search

    of the Most Suitable Mathematical Equation


    Askhat Diveev¹ and Elena Sofronova²

    ¹Institution of Russian Academy of Sciences Dorodnicyn Computing Centre of RAS,

    ²Peoples'' Friendship University of Russia

    Russia


    # 1. Introduction


    For many applied and research problems it is necessary to find solution in the
    form of mathematical equation. These problems are the selection of function at
    approximation of experimental data, identification of control object model, control
    synthesis in the form of state space coordinates function, the inverse problem
    of kinetics and mathematical physics, etc. The main method to receive mathematical
    equations for solution of these problems consists in analytical transformations
    of initial statement formulas of the problem. A few problems have the exact analytical
    solution, therefore mathematicians use various assumptions, decomposition, and
    special characteristics of solutions. Usually mathematicians set the form of mathematical
    equation, and the optimal parameters are found using numerical methods and PC.
    Such methods as the least-square method have been applied to the problems of approximation
    for many years (Kahaner D. et al., 1989).


    Recently the neural networks have been used to solve complex problems when the
    mathematical equation cannot be found analytically. The structure of any neural
    network is also given within the values of parameters or weight coefficients.
    In problems of function approximation and the neural network training the form
    of mathematical equation is set by the researcher, and the computer searches for
    optimum values of parameters in these equations (Callan, 1999; Demuth et al.,
    2008).


    In 1992 a new method of genetic programming was developed. It allows to solve
    the problem of search of the most suitable mathematical equation. In genetic programming
    mathematical equations are represented in the form of symbol strings. Each symbol
    string corresponds to a computation graph in the form of a tree. The nodes of
    this graph contain operations, and the leaves contain variables or parameters
    ( Koza, 1992, 1994; Koza, Bennett et al., 1999 & Koza, Keane et al., 2003).


    Genetic programming solves the problems by applying genetic algorithm. To perform
    the crossover it is necessary to find symbol substrings that correspond to branches
    of trees. The analysis of symbol strings increases the operating time of the algorithm.
    If the same parameter or variable is included in the required mathematical equation
    several times, then to solve the problem effectively the genetic programming needs
    to crossover the trees so that the leaves contain no less than the required number
    of parameters or variables.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Limitations of the genetic programming revealed at the solution of the problem
    of suitable mathematical equation search, have led to creation of the network
    operator.


    In this work we introduce a new data structure which we called a network operator.
    Network operator is a directed graph that contains operations, arguments and all
    information for calculations of mathematical equation.


    Network operator method was used for the problems of control synthesis (Diveyev
    & Sofronova, 2008; Diveev, 2009; Diveev & Sofronova, 2009a,b).


    # 2. Program notations of mathematical equations


    Mathematical equations consist of variables, parameters, unary and binary operations
    that form four constructive sets.


    Set of variables


    X = (x1,...,xN), xi ∈ R^i, i = 1,N. (1)


    Set of parameters


    Q = (q1,...,qp), qi ∈ R^i, i = 1,P. (2)


    Unary operations set


    O1 = (ρ1(z)=z, ρ2(z),...,ρW(z)). (3)


    Binary operations set


    O2 = {χ0(z'',z''''),...,χV-1(z'',z'''')}. (4)


    Unary operations set must have an identity operation


    ρi(z) = z. (5)


    Binary operations must be commutative


    χi(z'',z'''') = χi(z'''',z''), i = 0,V-1, (6)


    associative


    χi((z'',z''''),z'''''') = χi(z'',(z'''',z'''''')), i = 0,V-1, (7)


    and have a unit element


    ∃e_i ⇒ χi(e_i,z) = z, i = 0,V-1. (8)


    A program notation of mathematical equation is a notation of equation with the
    help of constructive sets (1) – (4).'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ### 3. Graphic notations of mathematical equations


    To present mathematical equation as a graph we use a program notation. Let us
    enlarge the program notation by additional unary identity operation ρ_i(z)=z and
    binary operation with a unit element χ_i(ε,z)=z. These operations do not influence
    the result of calculation but they set a definite order of operations in the notation,
    so that binary operations have unary operations or unit elements as their arguments,
    and unary operations have only binary operations, parameters or variables as their
    arguments.


    **A graphic notation** of mathematical equation is a notation of binary operation
    that fulfills the following conditions:


    +   a. binary operation can have unary operations or unit element of this binary
    operation as its arguments;

    +   b. unary operation can have binary operation, parameter or variable as its
    argument;

    +   c. binary operation cannot have unary operations with the same constants or
    variables as its arguments.


    Any program notation can be transformed into a graphic notation.


    # ### 4. Network operator of mathematical expression


    To construct a graph of the mathematical expression we use a graphic notation.
    The graphic notation can be transformed into the graph if unary operations of
    mathematical expression correspond to the edges of the graph, binary operations,
    parameters or variables correspond to the nodes of the graph.


    Suppose that in graphic notation we have a substring where two unary operations
    are arguments to binary operation ...χ_k(ρ_l(...),ρ_m(...))... This substring
    is presented as a graph on Fig. 1


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_32_0.png)


    Fig. 1. The graph for substring ...χ_k(ρ_l(...),ρ_m(...))...


    Suppose we have a substring where binary operation is an argument to unary operation
    ...ρ_k(χ_l(...))... This substring is presented as a graph on Fig. 2.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_32_1.png)


    Fig. 2. The graph for substring ...ρ_k(χ_l(...))...'
