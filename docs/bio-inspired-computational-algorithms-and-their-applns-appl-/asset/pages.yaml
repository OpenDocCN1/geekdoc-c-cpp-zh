- pgno: 203
  md: 'p_lo = highest number in the variable range

    p_hi = lowest number in the variable range

    p_norm = normalized value of variable


    This society of chromosomes is not a democracy: the individual chromosomes are
    not all created equal. Each one''s worth is assessed by the cost function. So
    at this point, the chromosomes are passed to the cost function for evaluation
    [Randy L. Haupt & Sue Ellen Haupt, 2004].


    Now is the time to decide which chromosomes in the initial population are good
    enough to survive and possibly reproduce offspring in the next generation. As
    done for the binary version of the algorithm, the N_pop costs and associated chromosomes
    are ranked from lowest cost to highest cost. This process of natural selection
    occurs in each iteration to allow the population of chromosomes to evolve. Of
    the N_pop chromosomes in a given generation, only the top N_top are kept for mating
    and the rest are discarded to make room for the new offspring [Randy L. Haupt
    & Sue Ellen Haupt, 2004].


    # 2.4.2.1.3 Pairing


    A set of eligible chromosomes is randomly selected as parents to generate next
    generation. Each pair produces two offspring that contain traits from each parent.
    The more similar the two parents, the more likely are the offspring to carry the
    traits of the parents.


    # 2.4.2.1.4 Mating


    As for the binary algorithm, two parents are chosen to produce offsprings. Many
    different approaches have been tried for crossing over in continuous GAs. The
    simplest method is to mark a crossover points first, then parents exchange their
    elements between the marked crossover points in the chromosomes. Consider two
    parents:


    parent₁ = [p₁,₁, ..., p_Nvar,₁]

    parent₂ = [p₁,₂, ..., p_Nvar,₂]  (7)


    two offspring''s might be produced as:


    offspring₁ = [p₁,₁, p₂,₂, p₃,₂, p₄,₂, p₅,₁, p₆,₁, ..., p_Nvar,₁]

    offspring₂ = [p₁,₂, p₂,₁, p₃,₁, p₄,₁, p₅,₂, p₆,₂, ..., p_Nvar,₂]  (8)


    # 2.4.2.1.5 Natural selection


    The extreme case is selecting N_var points and randomly choosing which of the
    two parents will contribute its variable at each position. Thus one goes down
    the line of the chromosomes and, at each variable, randomly chooses whether or
    not to swap information between the two parents. This method is called uniform
    crossover [Randy L. Haupt & Sue Ellen Haupt, 2004]:


    offspring₁ = [p_m1,1, p_m2,2, p_3,1, p_4,2, p_5,1, p_6,0, ..., p_Nvar,1]

    offspring₂ = [p_m1,2, p_m2,1, p_m3,1, p_m4,1, p_m5,2, p_m6,1, ..., p_Nvar,1]  (9)'
