    strategy and the average payoff is observed over 200 runs in the market simulation.


    A series of experiments were conducted with the deterministic dynamic adaptation
    using the testing sets in Table 7. From the experiments, CFMD and CDMI performed
    better than the other combinations (Gan et al, 2008a, Gan et al, 2008b). Fig.
    12 shows that the population evolved with deterministic dynamic adaptation is
    able to perform a lot better than the fixed constant crossover and mutation rates.
    This result is similar to the ones observed by other researches where non-constant
    control parameter performed better than fixed constant control parameter (Back
    1992; Back 1993; Back & Schutz 1996; Fogarty 1989; Hesser & Manner, 1991; Hesser
    & Manner, 1992). Even though, the point of convergence for the different dynamic
    deterministic scheme is similar, the population with CDMI achieved a higher average
    fitness when compared to the populations with CFMD. The CDMI scheme with the increase
    mutation rate is able to maintain exploration velocity in the search space till
    the end of the run with the decreasing crossover rate achieving a balance between
