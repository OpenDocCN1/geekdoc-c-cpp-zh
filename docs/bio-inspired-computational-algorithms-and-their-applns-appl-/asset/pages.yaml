    # 2. The Successive Zooming Genetic Algorithm


    This section briefly introduces the successive zooming genetic algorithm⁶ and
    provides the basis for the selection of the parameters used. The algorithm has
    been applied successively to many optimization problems. The successive zooming
    genetic algorithm involves the successive reduction of the search space around
    the candidate optimum point. Although this method can also be applied to a general
    Genetic Algorithm (GA), in the current study it is applied to the Micro-Genetic
    Algorithm (MGA). The working procedure of the SZGA is as follows. First, the initial
    solution population is generated and the MGA is applied. Thereafter, for every
    100 generations, the elitist point with the best fitness is identified. Next,
    the search domain is reduced to (X_OPT-d^k/2, X_OPT+d^k/2), and then the optimization
    procedure is continued on the reduced domain (Fig. 1). This reduction of the search
    domain increases the resolution of the solution, and the procedure is repeated
    until a satisfactory solution is identified.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_15_0.png)


    Fig. 1. Flowchart of SZGA and schematics of successive zooming algorithm


    The SZGA can assess the reliability of the obtained optimal solution by the reliability
    equation expressed with three parameters and the dimension of the solution N_VAR.


    R_SZGA = [1 - (1 - (α / 2))^{...} × β_AVG]^{...} (1)'
