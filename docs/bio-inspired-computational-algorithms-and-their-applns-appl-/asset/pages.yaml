    # ### 6.1 Building of the ARMA models


    The most general models used in this work are the Autoregressive Moving Averages
    ARMA (p, q) that contain the presence of autoregressive components in the observable
    variable Z_t and in the error a_t, where:


    $$

    a_t = Z_t - \left(\delta + \sum_{i=1}^{p}\phi_i Z_{t-i}\right)

    $$


    and


    $$

    F_t = \delta + \sum_{i=1}^{p}\phi_i Z_{t-i} + \sum_{j=1}^{q}\gamma_j a_{t-j}

    $$


    Once the AR model is obtained for a series it can be built an ARMA model from
    the acquiring other AR model for the series obtained when considering the a_t
    errors between the original series and its AR model. When is added to the AR model
    an additional component that considers the autoregressive terms corresponding
    to the error is obtained the complete ARMA model. Figure 10 shows an example of
    the error for the series.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_237_1.png)


    Fig. 10. Example of a TS corresponding to the error.


    The procedure to build the ARMA models is realized in two stages. First is built
    an AR model for the original series, afterwards it is considered the error series
    a_t to which it is found other'
