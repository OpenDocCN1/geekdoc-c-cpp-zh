- pgno: 407
  md: "# 3.1 Mutation and recombination\n\nIn mutation operation the cultural knowledge\
    \ (such as situational knowledge) as well as the standard binary mutation operation\
    \ (known as “bit-flip mutation”) is utilized. If the cultural knowledge is utilized\
    \ during the mutation process, the mutated chromosome genes are replaced by the\
    \ best genes from chromosome stored in situational knowledge with P_M probability,\
    \ otherwise, the genes are inverted by bit-flip mutation. The chromosome chosen\
    \ among a set of chromosomes from situational knowledge can be the best chromosome\
    \ or a random chromosome.\n\nThe bit-flip mutation is a common operation applied\
    \ in evolutionary algorithms to solve a problem with binary representation. Consequently,\
    \ each bit from current mutated chromosome is flipped, i.e. the value of the chosen\
    \ gene is inverted also with probability of mutation P_M. Figure 7 shows the pseudo-code\
    \ of mutation utilized by CA-IM.\n\n```\n```\nCA-IM Mutation\n1- Get Initial Parameters:\n\
    • P_M (Probability of Mutation);        • C (Current Chromosome) ;\n• S [] (Situational\
    \ Knowledge);        • Sbest (best chromosome of S []);\n• Srandom= random chromosome\
    \ of S [];\n2- Create C' (Chromosome Mutation)\nIf (random <=0.5)\n{\n    for\
    \ (int i=0; i< genotypeLength; i++)\n    {\n        if (random <=P_M)\n      \
    \  {\n            if (random <=0.5)\n                C'[i]=Sbest[i];\n       \
    \     else\n                C'[i]=Srandom[i];\n        }\n    }\n}\nelse\n{\n\
    \    for (int i=0; i< genotypeLength; i++)\n    {\n        If (random <=P_M)\n\
    \            C'= flip(C, i);\n    }\n}\n3- Return C';\n```\n```\n\nFig. 7. Mutation\
    \ pseudo-code.\n\nIn recombination operation the cultural knowledge as well as\
    \ the standard binary recombination operation (known as “uniform recombination”)\
    \ is also utilized. In the uniform recombination the bits are randomly copied\
    \ from the first or from the second parent to the genes in the offspring chromosomes,\
    \ in any sequence of ones and zeros. Figure 8 shows the pseudo-code of CA-IM recombination.\n\
    \nIf the cultural knowledge is utilized during the recombination process, the\
    \ chromosome genes are replaced by the best genes from chromosome stored in situational\
    \ knowledge with P_R probability. Otherwise, the genes are replaced with genes\
    \ from their parents. Here only the best chromosome is chosen from situational\
    \ knowledge during the recombination process."
