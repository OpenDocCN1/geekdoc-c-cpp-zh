  md: 'The value of $f_{sw}/f_{max}$ is plotted versus modulation index in Figure
    3.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_336_0.png)


    Fig. 3. Switching scheme


    Figure 3 shows that as the number of switching angles increases and M declines
    from unity, the curve moves towards the upper limit $f_{sw}/f_{max}$. The curve,
    however, always remains under the upper limit. When N increases and reaches a
    large amount, optimization procedure and its accomplished results are not effective.
    Additionally, it does not show a significant advantage in comparison with space
    vector PWM (SVPWM). Based on this fact, in high power machines, the feeding scheme
    is a combination of optimized PWM and SVPWM.


    At this juncture, feedforward structure of PWM fed inverter is emphasized. Presence
    of current feedback path means that the switching frequency is dictated by the
    current which is the follow-on of system dynamics and load conditions. This may
    give rise to uncontrollable high switching frequencies that indubitably denote
    colossal losses. Furthermore, utilization of current feedback for PWM generation
    intensifies system instability and results in chaos.


    # 4. Optimization procedure


    A numerical optimization algorithm is expected to perform the task of global optimization
    of an objective function. However, as objective function may possess numerous
    local optima, algorithms are prone to get trapped in local solutions. The genetic
    algorithms (GAs) among the numerical algorithms, have been extensively used as
    search and optimization tools in dealing with global optimization problems, due
    to their capability of avoiding local solutions from terminating the optimization
    process. There are certain other advantages to GAs such as their indifference
    to system specific information, especially the derivative information, the versatility
    of application, the ease with which heuristics can be incorporated in optimization,
    the capability of learning and adapting to changes over time, the implicitly parallel
    directed random exploration of the search space, and the ability to accommodate
    discrete variables in the search process, to name a few (Bäck et al., 1997).


    GAs operate on a population of potential solutions to generate close approximations
    to the optimal solution through evolution. The population is a set of chromosomes,
    and the basic GA operators are selection, crossover and mutation. At each generation,
    a new set'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'of approximations is created by the process of selecting individuals and breeding
    them together using crossover and mutation operators which are conceptually borrowed
    from natural genetics. This process leads to the evolution of better individuals
    with near-optimum solutions over time.


    The GA methodology structure for the problem considered herein is as follows:


    +   1. Feasible individuals are generated randomly for initial population. That
    is a n × (N − 1) random matrix, in which the rows’ elements are sorted in ascending
    order, lying in [0, ½] interval.

    +   2. Objective-function-value of all members of the population is evaluated
    by cᵢ. This allows estimation of the probability of each individual to be selected
    for reproduction.

    +   3. Selection of individuals for reproduction is done. When selection of individuals
    for reproduction is done, crossover and mutation are applied, based on forthcoming
    arguments. New population is created and this procedure continues from step (2).
    This procedure is repeated until a termination criterion is reached.


    Whether the algorithm will find a near-optimum solution and whether it will find
    such a solution efficiently is determined through proper choosing of GA parameters.
    In the sequel, some arguments for strategies in setting the components of GA can
    be found.


    Population size plays a pivotal role in the performance of the algorithm. Large
    sizes of population decrease the speed of convergence, but help maintain the population
    diversity and therefore reduce the probability for the algorithm to trap into
    local optima. Small population sizes, on the contrary, may lead to premature convergences.
    With choosing the population size as [(10·N)^1.2], in which the bracket [·] marks
    that the integer part is taken, satisfying results are yielded.


    Gaussian mutation step size (Eiben et al., 1999) is used with arithmetical crossover
    to produce offspring for the next generation. Mutations are realized by replacing
    components of the vector α by

    αᵢ'' = αᵢ + N(0, σ)  (36)

    where N(0, σ) is a random Gaussian number with mean zero and standard deviation
    σ. We replaced the static parameter σ by a dynamic parameter, a function σ(t)
    defined as

    σ(t) = 1 − t/T  (37)

