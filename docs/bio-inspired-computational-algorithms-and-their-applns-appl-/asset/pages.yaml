  md: '# 4.3 Evaluation criteria


    In this section, the following criteria were defined to evaluate the performance
    of the image fusion algorithm.


    # 4.3.1 Image quality assessment


    This evaluation criterion was discussed in Section 3.2.3.


    # 4.3.2 Entropy


    Entropy is often defined as the amount of information contained in an image. Mathematically,
    entropy is usually given as:


    $E = -\sum_{i=0}^{L-1} p_i \log_2 p_i$ (35)


    where $L$ is the total number of grey levels, and $p = \{p_0, ..., p_{L-1}\}$
    is the probability of occurrence of each level. An increase in entropy after fusion
    can be interpreted as an overall increase in the information content. Hence, one
    can assess the quality of fusion by assessing entropy of the original data, and
    the entropy of the fused data.


    # 4.3.3 Mutual information indices


    Mutual Information Indices are used to evaluate the correlative performances of
    the fused image and the source images. Let A and B be random variables with marginal
    probability distributions $p_A(a)$ and $p_B(b)$ and the joint probability distribution
    $p_{AB}(a,b)$. The mutual information is then defined as:


    $I_{AB} = \sum p_{AB}(a,b)\left[\log\left[p_{AB}(a,b) / (p_A(a)p_B(b))\right]\right]$
    (36)


    A higher value of Mutual Information (MI) indicates that the fused image, $F$,
    contains fairly good quantity of information present in both the source images,
    $A$ and $B$. The MI can be defined as $MI = I_{AF} + I_{BF}$.


    A high value of MI does not imply that the information from the both images is
    symmetrically fused. Therefore, information symmetry (IS) is introduced. IS is
    the indication of how symmetrically distributed is the information in the fused
    image, with respect to input images. The higher the value of IS, the better the
    fusion result. IS is given by :


    $IS = 2 - abs\left[I_{AF} / (I_{AF} + I_{BF}) - 0.5\right]$ (37)


    # 4.4 Experimental results


    The goal of this experiment is to fuse visual and IR images. To minimize registration
    issues, it is important that the visual and the thermal images are captured at
    the same time. Pinnacle software was used to capture the visual and the thermal
    images simultaneously. Although radiometric calibration is important, the thermal
    camera can not always be'
