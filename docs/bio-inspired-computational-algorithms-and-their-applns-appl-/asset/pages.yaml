    \ Simulator\n\n# ### 3.2 Bidding strategy\n\nThe bidding algorithm for this framework\
    \ is shown in Fig. 3. Let `Item_NA` be a boolean flag, to indicate whether the\
    \ target item has already been purchased by the agent. Assume that the value of\
    \ `p_r` is based on the current reliable market prices observed from past auctions\
    \ and that the marketplace is offering the item which the agent is interested\
    \ in. While the bidder agent has not obtained the desired item, the bidder agent\
    \ needs to build an active auctions list in order to keep track of the current\
    \ active auction. Active auction is defined as auction that is ongoing or just\
    \ started but has not reach the ending time yet.\n\n```\n```\nwhile (t ≤ tmax)\
    \ and (Item_NA = true)\n    Build active auction list;\n    Calculate current\
    \ maximum bid using the agent’s strategy;\n    Select potential auctions to bid\
    \ in, from active auction list;\n    Select target auction as one that maximizes\
    \ agent’s expected utility;\n    Bid in the target auction using current maximum\
    \ bid as reservation price at this time;\nEndwhile\n```\n```\n\nFig. 3. The bidding\
    \ agent’s algorithm\n\n```\n```\nfor all i ∈ A\n    if ((t ≥ σ_i) and (t ≤ η_i))\
    \ or (S_i(t) = ongoing)\n        add i to L(t)\n    endif\nendfor\n```\n```\n\n\
    Fig. 4. Building active auction list algorithms\n\nIn order to build the active\
    \ auction list, the bidder agent follows the algorithm as shown in Fig. 4. `S_i(t)`\
    \ is a boolean flag representing the status of auction `i` at time `t`, such that\
    \ `i ∈ A` and `S_i(t) ∈ {ongoing, completed}`. Each auction `i ∈ A`, has a starting\
    \ time `σ_i`, and its own ending time `η_i`. The active auction list is built\
    \ by taking all the auctions that are currently running at time `t`. In English\
    \ and Vickrey auctions, any auction that has started but has not reached its ending\
    \ time is considered as active. `S_i(t)` is used in Dutch auctions since the ending\
    \ time of this type of auction is not fixed."
