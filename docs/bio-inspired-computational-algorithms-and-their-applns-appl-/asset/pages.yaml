  md: 'It should be mentioned that a maximum damping ratio of 50% was imposed on the
    BGA and GA, otherwise, their damping ratios could have been higher. If the damping
    of the electromechanical mode is too high this could negatively affect other modes
    in the system.


    # 6.2 Large disturbance


    A large disturbance was considered by applying a three-phase fault to the system
    at 0.1 seconds. The fault was applied at the sending-end of the system (near bus
    1 on line 2) for 200ms. The fault was cleared by disconnecting line 2. Fig. 3
    to Fig. 5 show the speed responses of the system.


    Figure 3 shows the speed responses of the generator for case 1. When the system
    is equipped with GA-PSS and BGA-PSS it settles around 3 seconds. On the other
    hand, the settling time of the system equipped with the CPSS is more than doubled
    (6 seconds). In addition, the subsequent oscillations are larger than those of
    BGA and GA PSSs.


    Figure 4 shows the speed responses for case 2. The system equipped with CPSS is
    seen to have bigger oscillations as compared to the system equipped with BGA-PSS
    and GA-PSS. With both BGA and GA PSSs, the system settled in approximately 3.5
    sec., whereas CPSS takes more than 6 sec. to settle down. The performances of
    the BGA-PSS and GA-PSS are quite similar, even though the BGA-PSS performs slightly
    better than the GA-PSS.


    Figure 5 shows the speed responses of the system for case 3. It can be seen that
    the system equipped with BGA and GA PSS settled in less than 4 sec compared to
    more than 6 sec. for the CPSS. With CPSS, the system has large overshoots and
    undershoots.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_321_0.png)


