    # ## 1. Introduction


    We recognized that the roles of crossover and mutation in real encoding are quite
    different from those in binary encoding during performing previous work with real-coded
    genetic algorithms (Yoon et al., 2012). In this study, we are to argue the distinct
    roles of genetic operators in real encodings.


    Recently many studies on evolutionary algorithms using real encoding have been
    done. They include ant colony optimization (Socha & Dorigo, 2008), artificial
    bee colony algorithm (Akay & Karaboga, 2010; Kang et al., 2011), evolution strategies
    (ES) (Beyer, 2001), differential evolution (Das & Suganthan, 2011; Dasgupta et
    al., 2009; Kukkonen & Lampinen, 2004; 2005; Mezura-Montes et al., 2010; Noman
    & Iba, 2005; Rönkkönen et al., 2005; Storn & Price, 1997; Zhang et al., 2008),
    particle swarm optimization (Chen et al., 2007; Huang et al., 2010; Juang et al.,
    2011; Krohling & Coelho, 2006; J. Sun et al., 2011), and so on. In particular,
    in the field of ES, we can find many studies based on self-adaptive techniques
    (Beyer & Deb, 2001; Hansen & Ostermeier, 2001; Igel et al., 2007; 2006; Jägersküpper,
    2007; Kita, 2001; Kramer, 2008a,b; Kramer et al., 2007; Meyer-Nieberg & Beyer,
    2007; Wei et al., 2011).


    Many researchers have also concentrated on using real-valued genes in genetic
    algorithms (GAs), as in (Ripon et al., 2007). It is reported that, for some problems,
    real-coded representation and associated techniques outperform conventional binary
    representation (Eshelman & Schaffer, 1993; Herrera et al., 1998; Janikow & Michalewicz,
    1991; Lozano et al., 2004; Ono et al., 1999; Ono & Kobayashi, 1997; Surry & Radcliffe,
    1996; Wright, 1991). Several theoretical studies of real-coded GAs have also been
    performed (Goldberg, 1991; Higuchi et al., 2000; Kita et al., 1998; Qi & Palmieri,
    1994a,b). However, the role and behavior of genetic operators in real-coded GAs
    are fundamentally different from those in binary encodings although motivation
    of the operators and the framework of GAs are similar.


    In this chapter, we try to verify different properties of crossover and mutation
    in real encodings from those in binary encodings through various experiments.
    We especially concentrate on the effect of genetic operators (the bias and functions
    of crossover and mutation) when they are used in real-coded GAs.'
