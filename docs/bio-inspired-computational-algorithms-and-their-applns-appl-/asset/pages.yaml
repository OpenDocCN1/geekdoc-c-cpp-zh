- pgno: 59
  md: 'By other hand Crossover Probability indicates how often will be crossover performed.
    If there is no crossover, offspring is an exact copy of parents. If there is a
    crossover, offspring is made from parts of parent''s chromosome. If crossover
    probability is 100%, then all offspring is made by crossover. If it is 0%, a whole
    new generation is made from exact copies of chromosomes from old population (but
    this does not mean that the new generation is the same). Crossover is made expecting
    that new chromosomes will have good parts of old chromosomes and perhaps this
    will be better. However it is good to allow some part of the population survive
    to next generation.


    Mutation probability says how often will be parts of chromosome mutated. If there
    is no mutation, the offspring is taken after crossover (or copy) without any change.
    If mutation is performed, part of a chromosome is changed. If mutation probability
    is 100%, whole chromosome is changed, if it is 0%, nothing is changed. Mutation
    is made to prevent falling GA into local extreme, but it should not occur very
    often, because then GA will in fact change to random search.


    Each operator allows that the evolutionary process progress toward promising regions
    in the area of search and can carry on diversity within the population and inhibit
    the premature convergence to an optimal local by means of new individuals sampled
    randomly. On the other hand is required to manipulate the information through
    a metric that quantifies the evolutionary process, this can be done through the
    design of a function that gets the more suitable individuals. This metric is known
    as a function of ability and it increases the ability of this individual to operate
    with a good performance and to get an unbeatable quality.


    Problems typically contain restrictions, such as the non-linearity and inequality,
    which makes necessary to incorporate information on the violation of restrictions
    on some of the functions and the most known are Criminalization role, this restricts
    the fitness role by extending its domain by a factor of criminalization to any
    restriction raped. It can penalize for not being feasible or to make feasible
    an individual. The penalty function design must take into account how distant
    is an individual from the feasible area, the cost of fulfillment and the cost
    of expected compliance. Some of these penalties are:


    +   - Death Penalty. It assigns a suitability of zero to the individual not feasible,
    avoiding calculate again restrictions or objective function. However, the algorithm
    may be truncated if the initial population does not contain any feasible individual.

    +   - Static Criminalization. It defines levels of violation and chooses a coefficient
    of violation to each one of them.

    +   - Dynamic Criminalization. The factors of criminalization change with time;
    they are susceptible to the values of the parameters and converge prematurely
    when these are not selected properly.

    +   - Adaptive Criminalization: Adjusting the penalty on the basis of a feedback
    process.


    The adaptive criminalization is used in this work.


    # 2.1 Efficiency enhancement of GA


    Goldberg categorized the efficiency enhancement techniques of GA into four broad
    classes: parallelization, hybridization, time continuation, and evaluation relaxation
    (Goldberg, 2002):'
  merge: -1
  img_proc: true
- pgno: 60
  md: '1. **Parallelization:** GAs are executed on several processors and the computational
    load is distributed among these Processors (Cantu-Paz, 2000). This leads to significant
    speedup when solving large scale problems. Parallelization can be achieved through
    different ways. A simple way is to have part of the GA operations such as evaluation
    running simultaneously on multiple processors (Bethke, 1976). Another way is to
    create several subpopulations and allow them evolve separately at the same time,
    while spreading good solutions across the subpopulations (Grosso, 1985).


    2. **Hybridization:** Local search methods or domain-specific knowledge is coupled
    with GA. This are powerful in global search. However, they are not as efficient
    as local search methods in reaching the optimum on micro-scale. Therefore, hybridization
    which incorporates local search methods into GA will facilitate local convergence.
    A common form of hybridization is to apply a local search operator to each member
    of the population after each generation in GA (Sinha, 2002).


    3. **Time Continuity:** The capabilities of both mutation and recombination are
    utilized to obtain a solution of as high quality as possible with a given limited
    computational resource (Srivastava, 2002). Time continuation exploits the tradeoff
    between the search for solutions with a large population and a single convergence
    epoch or using a small population with multiple convergence epochs.


    4. **Relaxation Evaluation:** An accurate, but computationally expensive fitness
    evaluation is replaced with a less accurate, but computationally inexpensive fitness
    estimate. The low-cost, less-accurate fitness estimate can either be 1) exogenous,
    as in the case of surrogate (or approximate) fitness functions, where external
    means that it can be used to develop the fitness estimate; or 2) endogenous, as
    in the case of fitness inheritance (Smith, 1995) where the fitness estimate is
    computed internally and is based on parental fitness.


    # 3. Adjustment in the performance of the parameters of the GA


    Some authors such as (Holland, 1975), have looked into the effect of varying GA''s
    parameters which have to be taken into account to exploit the full potential in
    particular applications. Accordingly to this, for a search algorithm to perform
    well online, one has to decide quickly which are the most promising search regions
    in order to concentrate the search efforts there, the off-line performance does
    not penalize the search algorithm to explore poor regions of the search space,
    provided that this will help to achieve the best possible solutions (in terms
    of fitness), abig generation interval and the use of an elitist strategy also
    improve the performance of the GA''s, in which the usual recommended mutation
    rates between 0.001 and 0.01 for the binary representation (Goldberg, 1989), or
    in general, much smaller value of the crossover probability (Cabrera et al., 2002).


    The main parameters that can be adjusted, by the degree of importance within the
    GA are:


    +   - Population size

    +   - Percentage of crosses

    +   - Percentage of mutation


    The design of the algorithm is limited to choose and determine the degree of control
    or the strategies of parameters such as the ranges and the likelihood of a mutation,
    crossing and extent of the population. (Sánchez-Marín, 2000) supported their research
    in the'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'determination of control parameters, experimenting with different values and
    selecting those that gave better results. (De Jong, 1975) recommended, after experimenting,
    values for the probability of the interbreeding of simple point and the movement
    of a bit in the mutation. In this work, the following parameters are defined:
    a population-based measure of 50 individuals, probability of crossing 0.6, probability
    of mutation of 0.001 and elitist selection; however, it presents the disadvantage
    that these parameters only worked for a particular problem with very specific
    restrictions.


    (De Jong, 1975) described that the operation on-line is based on the monitoring
    of the best solution in every generation, while the operation off-line takes into
    account all the solutions in the population to obtain the optimum value. (Grefenstette,
    1986) used the meta-algorithms as a method of optimization, in order to obtain
    values with similar parameters for the operation on-line and off-line of the algorithm.


    In order to have a good performance on-line of a search algorithm, it must quickly
    decide where the most promising search region is and concentrate their efforts
    there. The performance off-line does not always penalize the search algorithm
    to explore poor regions of the search space, since this will contribute to achieving
    the best possible solutions (in terms of fitness). The best sets of parameters
    analyzed on and off- line were population of 30 and 80 individuals, probability
    of crossing 0.95 and 0.45, probability of mutation 0.01 for both, either using
    a strategy of elitist selection for the on-line case or not elitist for the off-line
    case .


    (Smith, 1993) proposes a genetic algorithm which adjusts the extent of the population
    taking into account the likelihood of error. This is linked with the number of
    generations, if under the conditions of little use is determined a small value
    (20 to 50) to the number of evaluations, the convergence will be quick, but it
    is not ensured an optimum result.


    (Endre Eiben et al., 1999) expose technical drawbacks of the analysis of parameters
    on the basis of experimentation, observing the following points:


    +   - Parameters are not independent, but trying all possible combinations of
    these systematically it is almost impossible.

    +   - The process of tuning parameters is time-consuming, but if the parameters
    are optimized one by one, it is possible to handle their interactions.

    +   - For a given problem, the values for the selected parameters are not necessarily
    the best, but if they are used to analyze uniformly, more meaningful values will
    be obtained.


    In general, here are listed some important observations made by authors such as
    (Holland, 1975),with respect to the genetic algorithms that must be considered
    for the use of this tool, such as:


    +   - A high generational interval and the use of an elitist strategy also improve
    the performance of the GA.

    +   - The use of large populations (> 200) with a high percentage of mutation
    (> 0.05) does not improve the performance of a GA.

    +   - The use of small populations (< 20) with low percentage of mutation (< 0.002)
    does not improve the performance of a GA.

    +   - The mutation seems to have greater importance in the performance of a GA.

    +   - If the size of the population is increased, the effect of crosses seems
    to be diluted.'
