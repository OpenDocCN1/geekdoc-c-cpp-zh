    # 4.1.3 GA optimization method


    Here we describe de Genetic Algorithm (GA) optimization method and the formalism
    applied to code the problem to its needs.


    The pump parameters we want to find are a subset of those described as primary
    parameters: the state changing cycle, t_cy, the fuel pressure, P_f, the fuel mass
    density, ρ_f, and the material properties: the mass density, ρ_s, and stress coefficient,
    σ_s. These are the GA free parameters, formally


    Λ = {t_cy, P_f, ρ_f, σ_s} , (9)


    known as the parameter set. The technique used to work with the material parameters,
    ρ_s and σ_s, are explained in sub-section 4.1.4.


    The obtained pump must deliver a desired mass rate, , of a given propellant, ρ_s
    and must be made of a given material, ρ_s and σ_s. Some variables are project
    dependent, like the volume flow, Q, the specific impulse of the propellants, I_sp,
    at the fuel pressure, and the thrust, T. These three parameters are those the
    rocket engine designer should define to specify the pump he needs. Differently
    from the first parameters described on the above paragraph, these values cannot
    be altered by the algorithm, and can be included in another group, the constant
    set:


    Ψ = {Q, I_sp, T} . (10)'
