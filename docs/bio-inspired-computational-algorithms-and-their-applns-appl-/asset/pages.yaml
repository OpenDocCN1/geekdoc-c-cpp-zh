  md: '# 7. Conclusions


    This paper presents an efficient alternative approach for minimization of harmonic
    losses in high-power synchronous machines. The proposed current harmonic model
    in these machines is dependent on the inductances of d and q axes, the inductances
    in direct and quadrature axes, respectively. As high power application is of concern,
    finding the global optimum solution to have minimum losses in every specific operating
    point is of great consequence. For an identified typical machine, with specified
    characteristics, the problem is redrafted as an optimization task, and the optimal
    pulse patterns are sought through genetic algorithm (GA) in order to minimize
    the total harmonic current distortion (THCD). Optimal pulsewidth modulation (PWM)
    waveforms are accomplished up to 12 switches (per quarter period of PWM waveform),
    in which for more than this number of switching angles, space vector PWM (SVPWM)
    method, is preferred to optimal PWM approach. Selection of GA as the optimization
    method seems completely desirable considering its salient features which can cope
    with shortcomings of the deterministic optimization methods, particularly when
    decision variables increase, more probability of finding the global optimum solution,
    and also nonlinearity and complexity of the proposed objective function.


    The aforementioned inductances are appreciably influenced by modifications in
    operating point, aging, and temperature rise. As such, in-progress switching patterns
    are no longer global optimum patterns, therefore performing optimization process
    to determine new optimal pulse patterns from among prior identification procedure
    results, is indispensable. Substitution in switching patterns provokes an unfavorable
    transient condition. Optimal pulse patterns of induction motor, whose current
    harmonic model is independent of its parameters, are applied to harmonic model
    of synchronous machine with distinct values of i_q/i_d. Effectiveness of the proposed
    approach is noteworthy, particularly in large values of i_q/i_d and high modulation
    indices.


