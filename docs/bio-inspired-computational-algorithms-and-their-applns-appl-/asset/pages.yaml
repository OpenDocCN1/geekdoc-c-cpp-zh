- pgno: 271
  md: 'worst case. Compared to a typical implementation with backpropagation neural
    networks and cepstral coefficients, this approach was at least 10% more effective
    in near real-life application.


    The genetic algorithm consistently maximized the criteria of inter-class separability
    and intra-class compactness, under different conditions of population, probability
    of mutation, etc., and also varying the restriction set. It is remarkable and
    worth to mention that the genetic algorithm didn''t gave the best result in its
    first execution, which means that the execution must be repeated to achieve good
    results; increasing the population and manipulating the restriction set demonstrated
    that it is possible to obtain a variety of different outcomes, so it is important
    to experiment carefully.


    The future work will consist of developing the voice/unvoiced detection in noisy
    environments, investigate an adapt more features that can be easily computed in
    time and with a dual in frequency, start working on the non-dependant speaker
    approach, making use of more robust classifiers, and finally, increase the vocabulary
    size, although still restricted to a specific semantic field, like in [35]. Another
    interesting venue is the one in which the user aging process is taken into account
    by the speech recognition system [36].


