  md: '# 3.2.3.1 A new metric


    There are some metrics such as brightness and contrast to characterize an image.
    Another such metric is sharpness. Sharpness is directly proportional to the high-frequency
    content of an image. So the new metric is defined as [Z. Rahman, 2009]:


    $$S = \sqrt{\|\hat{h} \odot I\|^2} = \sqrt{\sum_{v_2=0}^{M_2-1}\sum_{v_1=0}^{M_1-1}
    |\hat{h}[v_1,v_2]|\,|\hat{I}[v_1,v_2]|^2}$$ (27)


    where $h$ is a high-pass filter, periodic with period $M_1\times M_2$ and $\hat{h}$
    is its direct Discrete Fourier Transform (DFT). $I$ is also DFT of Image $I$.
    The role of $\hat{h}$ (or $h$) is to weight the energy at the high frequencies
    relative to the low frequencies, thereby emphasizing the contribution of the high
    frequencies to $S$. The larger the value of $S$, the greater the sharpness of
    $I$ and conversely.


    Equation 27 defines how the sharpness should be computed and defined as:


    $$\hat{h}[v_1,v_2] = 1 - \exp\left(-\frac{v_1^2 + v_2^2}{\sigma^2}\right)$$ (28)


    where $\sigma$ is the parameter at which the attenuation coefficient $=1.0 - e^{-1}
    \approx 2/3$. A smaller value of $\sigma$ implies that fewer frequencies are attenuated
    and vice versa. For this research $\sigma=0.15$.


    # 3.2.3.2 Image qality assessment


    The overall quality of images can be measured by using the brightness $\mu$, contrast
    $\sigma$ and sharpness $S$, where brightness and contrast are assumed to be the
    mean and the standard deviation. However, instead of using global statistics,
    it is used regional statistics. In order to do this [Z. Rahman, 2009]:


    +   1. Divide the $M_1\times M_2$ image $I$ into $(M_1/10)\times(M_2/10)$ non-overlapping
    blocks, $I_i$, $i=1,...,100$, such that $I = \cup_{i=1}^{N} I_i$, (Total Number
    of Regions are 100).

    +   2. For each block compute the measures, $\mu_i$, $\sigma$ and $S_i$.

    +   3. Classify the block as either GOOD or POOR based on the computed measure
    (will be discussed with the following).

    +   4. Classify the image as a whole as GOOD or POOR based upon the classification
    of regions (will be discussed with the following).


    The following criteria are used for brightness, contrast and sharpness [Z. Rahman,
    2009]:'
