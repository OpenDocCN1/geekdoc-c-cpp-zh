    In each BB_i of the S/D binary string, which consists of the bits (b_{i×n+1},
    b_{i×n+2}, ..., b_{(i+1)×n}), i = 0, ..., l/n - 1, these bits are uniformly scaled
    and independent each other. We refer such delicate feature of BB_i to as the uniform-salient
    BB (USBB). Furthermore, the splicing different number of USBBs can describe the
    potential solutions of the problem with different precisions. So, the intra-BB
    difficulty (within building block) and inter-BB difficulty (between building blocks)
    (Goldberg, 2002) of USBB are low. The theoretical analysis reveals that GAs searching
    on USBB can explore the high-quality bits faster than GAs on non-uniformly scaled
    BB.


    The S/D binary encoding is redundancy-free representation because using the S/D
    binary strings to represent the real values is one-to-one genotype-phenotype mapping.
    The whole S/D binary string is constructed by a non-uniformly scaled sequence
    of USBBs. The domino convergence of GAs occurs and USBBs are solved sequentially
    from high to low scaled.


    The BB-significance-variable and uniform-salient BB properties of the S/D binary
    representation embody many important information useful to the GAs searching.
    We will explore this information to design new GA based on the S/D binary representation
    in the subsequent sections.


