  img_proc: true
- pgno: 352
  md: '# iii.) Detector generation.


    In detector generation, self elements that come from training data with known
    self/non-self discrimination are used to calculate detector center points and
    radii. Similarly to the situation in computing the affinity measure, there is
    a multitude of different detector generation mechanisms, see e.g. (18). In some
    initial experiments (which are not reported here for sake of brevity), a scheme
    mainly using ideas from v-detectors (17) had shown best results and is considered
    here. This scheme has the advantage to address the problem of coverage of the
    non-self space in the generation process and to maximize the size of individual
    detectors to achieve a larger coverage. This comes at the cost of making the number
    of detectors actually created a (not predicable) result of the generation process
    and not a parameter to be set initially.


    The scheme works like this. Input is a collection of self elements s_ej, with
    j = 1,2,... #_s, and #_s the total number of self elements. Further, we set a
    target coverage α and calculate a quantity h = 1/α. Then, the following steps
    are repeated. A candidate detector point and its radius are generated as a realization
    of a uniformly distributed random variable. It is tested if the detector matches
    any of the self elements. If so, its radius is shrunk so that any match is abolished.
    If not so, the radius is enhanced to the limit of any match. After that it is
    tested if the candidate detector with its updated radius is entirely covered by
    a detector that already passed this test. If so, the candidate is discarded, otherwise
    it is saved to the set of detectors that passed the coverage test. These steps
    are repeated until candidate detectors cannot pass the coverage test h times in
    a row. The saved detector candidates are accepted for the change detection process.


    # iv.) Detection process.


    After the training time in which detectors are generated as described above, the
    immunological change detector can be used for deciding if a change point according
    to eq. (5) has been reached or not by monitoring a metric defined on the fitness
    distributions F(t) and F(t - 1). The necessary pre-processing is the same as the
    one given for the training phase above in Sec. 4.1. So, an incoming data sample
    id(t) = (ci(t), ri) is produced every generation t, where the center point comes
    from the pre-processing and the self-radius ri is a quantity that defines the
    sensitivity of the detector, is to be set in initializing the immunological change
    detector and will be examined in the numerical experiments reported below. The
    affinity function is calculated by using a Euclidean distance measure


    w(t) = Σ_{j=1}^{#det} aff(id(t), dt_j),   (7)


    where #det is the total number of detectors dt_j, the individual affinities


    aff(id(t), dt_j) = { β||ci(t) - cd_j|| if ||ci(t) - cd_j|| < rd_j ; ||ri - rd_j||
    if ||ci(t) - cd_j|| < rd_j + ri }


    and β is a weighting factor. From the values w(t), a change point can be concluded.
    Therefore, a threshold value ϑ has to be set and a w(t) > ϑ indicates a change.


    # v.) Performance evaluation.


    To evaluate the success and the quality of the change detection, the method of
    receiver-operating characteristics (ROC) curves can be used, e.g. (12). ROC curves
    are a tool for organizing and visualizing classifications together with their
    performances. So, they can be used to analyze and depict the relative trade-offs
    between'
