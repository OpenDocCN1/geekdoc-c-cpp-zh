  md: '# Artificial Immune Systems, Dynamic Fitness

    Landscapes, and the Change Detection Problem


    Hendrik Richter

    HTWK Leipzig University of Applied Sciences

    Germany


    # 1. Introduction


    To let biological processes, behaviors and structures inspire the design of problem
    solving algorithms and devices has been a prominent and persistent theme in engineering
    and applied sciences in the last few decades. Within this context, bio-inspired
    computing has taken a pioneering role. Fields such as evolutionary computing (1;
    8; 25), artificial immune systems (4; 6; 43), membrane computing (29) or swarm
    systems (9; 22) have outgrown their infancy and found theoretical ground as well
    as important applications. The fact that and the way how these fields advanced
    into its current form is due to three major developments: (i) the upcoming of
    cheap, fast and reliable computational power in form of digital computers, (ii)
    the understanding that computational power in connection with implementing an
    algorithmic approach creates potent problem solvers, and (iii) the insight that
    biological systems can be fruitfully understood as information-processing units
    and can hence frequently be employed for computational and/or algorithmic proposes.
    This trend is of course not to be confused with computational biology, but it
    is highly related and probably unthinkable without the fundamental progress towards
    algorithmization and mathematician in biology, see e.g. (5; 16; 21; 38) for some
    recent discussion. Among the mentioned fields of bio-inspired computing, evolutionary
    algorithms and artificial immune systems play a unique role as their history is
    particularly long and the maturity reached is notably high. In this paper we will
    use both schemes in connection to solve the intertwined problem of maximum tracking
    and change detection in dynamic optimization.


    For successfully solving dynamic optimization problems by evolutionary computation,
    there is a need for additions to the standard algorithmic structure, namely by
    operators maintaining and enhancing population diversity. Dynamic optimization
    here means that the topology of the associated fitness landscape changes with
    time. A considerable number of these operators for diversity management (for instance
    memory schemes, random immigrants or hyper-mutation (24; 26; 30; 33; 35; 39; 45))
    can only be provoked and hence made to work properly if the points in time are
    known where the changes in the fitness landscape occur. So, the problem of change
    detection is of high practical relevance in solving dynamic optimization problems
    (3; 19; 27).


    In principle, change detection is based on using information about the fitness
    values of points in the search space extracted from the fitness landscape. This
    extraction of information can be done in two ways. One is to use the fitness evaluations
    of the evolutionary algorithm''s'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'population, which is called population-based detection, the other is to use
    additional measurement of the landscape’s fitness on prescribed points (26), which
    is called sensor-based detection. Recently, a study (34) compared both types of
    methods. It has been shown that in populations-based detection there is no need
    for additional fitness function evaluation, but elaborate statistical tests have
    to be carried out. On the other hand, sensor-based detection can forgo these tests
    but at the cost of redoing measurements in the fitness landscape. Irrespective
    of the quality of the change detection, using statistical tests on population-based
    fitness data is sometimes generally objectionable. Although using non-parametric
    statistical tests fits the non-Gaussian nature of the fitness distribution, the
    tests require independent samples to be accurately employed. This independence
    might not be given for fitness distributions from sequential generations. The
    fitness values of next generation’s population have their origin in the current
    generation and are only partly affected by the stochastic influence driving the
    evolutionary algorithm. This situation might be different if a (randomly induced)
    change in the fitness landscape has occurred, but again there is no guarantee
    that the resulting fitness distributions are statistically independent. Because
    of these reasons, it would be desirable to have alternative methods. A promising
    option is the use of methods from artificial immune systems, particularly negative
    selection (4; 7; 13; 18; 44). These algorithms have been successfully employed
    to solve similar problems, for instance network security, computer virus detection,
    network intrusion detection and fault diagnosis, see e.g. (13; 18; 43). In this
    paper, we present an immunological approach to change detection in dynamic fitness
    landscapes.


    The paper is organized like this. In the next two sections, dynamic fitness landscapes
    are introduced and the change detection problem is defined. Then, in section 4,
    the immunological change detection scheme is given and its main components, shape
    space, affinity function, detector generation and detection processing, are described.
    In section 5, we present numerical experiments with the scheme and use receiver-operating
    characteristics (ROC) as well as the area under the ROC curve (AUC) as an analyzing
    tool. We end with summarizing the findings and pointing at future work.


    # 2. Dynamics and fitness landscapes


    The concept of fitness landscapes is an important approach to foster theoretical
    understanding in evolutionary computation (20; 40; 41). Such landscapes are traditionally
    considered to be static and can be obtained from either a genotype-to-fitness
    mapping or more generally by encoding all possible solutions of the optimization
    problem and giving a fitness value to each solution. All the possible solutions
    span a search space S , while a fitness function f(s) : S → ℝ provides every point
    s ∈ S with a fitness value. In case of a genotype-to-fitness mapping, S coincides
    with the genotypical space. If the search space S is not metric, we must explain
    which solutions we would obtain if we were to slightly modify a possible solution
    s ∈ S (and hence were to move it locally in the search space). This is done by
    a neighborhood structure n(s) which gives every point in the search space a set
    of direct and possibly also more distant neighbors.


    If the fitness landscape is dynamic all of its three defining ingredients – search
    space S, fitness function f(s), neighborhood structure n(s) – can, in principle,
    be changing with time. So, we additionally need for description a time set and
    mappings that tell how S, f(s) and/or n(s)'
