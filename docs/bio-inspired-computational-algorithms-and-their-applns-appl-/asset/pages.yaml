    probability based on the literatures. However, these recommended values may not
    perform at its best in the genetic algorithm as it has been proven that the parameter
    values are dependent on the nature of problems to be solved (Engelbrecht, 2002).
    In this experiment, the crossover and mutation rates are fine tuned with different
    combination of probabilities in order to discover the best combination of genetic
    operators’ probabilities. Thus, the main objective of this experiment is to improve
    the effectiveness of the bidding strategies by “hand tuning” the values of the
    crossover rate and mutation rate to allow a new combination of static crossover
    and mutation rates to be discovered. By improving the algorithm, more effective
