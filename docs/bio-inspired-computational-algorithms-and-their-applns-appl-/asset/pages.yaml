  md: '# 4.2.2 Second algorithm


    The second algorithm only utilizes of the BJ methodology the estimation of how
    many terms are necessary in the linear approximation of the series of differences,
    which could be stationary, thus, from this is determined the numbers of terms
    that will be used in the original series.


