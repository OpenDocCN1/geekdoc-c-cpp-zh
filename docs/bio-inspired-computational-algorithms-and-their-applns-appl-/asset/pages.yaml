  md: 'DM indicates a preference for object a over object b, the model (i.e., the
    value function V) must satisfy condition V(a) > V(b). Otherwise, the model should
    satisfy condition V(a) = V(b), indicating that the DM has no preference of a over
    b nor has the DM a preference of b over a. This situation is known as indifference
    on the pair (a, b). If V is an elemental function, these preference/indifference
    statements on the objects become mathematical expressions that yield the values
    of V''s parameters. To achieve this, usually the DM provides the truth values
    of several statements between pairs of decision alternatives (a_i, b_i). Then,
    the model''s parameter values are obtained from the set of conditions V(a_i) =
    V(b_i). Finally, the value and utility functions are generally expressed in either
    additive or product forms, and, in the most simple cases, as weighted-sum functions.


    The expected gain in a lottery is the average of the observed gains in the lottery''s
    history. If the DM plays this lottery a sufficiently large number of times, the
    resulting gain should be close the lottery''s expected gain. However, it is not
    realistic to assume that a DM will face (play) the same decision problem several
    times as decision problems are, most of the times, unique and unrepeatable. Therefore
    it is essential to model the DM''s behavior towards risk. Persons react differently
    when facing risky situations. In real life, a DM could be risk prone, risk averse,
    or even risk neutral. Personal behavior for confronting risk is obviously a subjective
    characteristic depending on all of the following.


    +   - The DM''s personality

    +   - The specific situation of the DM as this determines the impact of failing
    or succeeding.

    +   - The amount of the gain or loses that will result from making a decision.

    +   - The relationship of the DM with these gains and loses.


    All these aspects are closely related. While the first of them is completely subjective,
    the remaining three have evident objective features.


    The ability for modeling the decision maker''s behavior when facing risk is one
    of the most interesting properties of the functional approach. At this point,
    it is necessary to introduce the concept of certainty equivalence in a lottery.


    Definition 2. Certainty equivalence is the “prize” that makes an individual indifferent
    between choosing to participate in a lottery or to receive the prize with certainty.


    A risk averse DM will assign a lottery a certainty equivalence value lower than
    the expected value of the lottery. A risk prone DM, on the other hand, will assign
    the lottery a certainty equivalence value larger than the lottery''s expected
    gain. We say a DM is risk neutral when the certainty equivalence value assigned
    to a lottery matches the lottery''s expected gain. This behavior of the DM yields
    quite interesting properties on the utility function. For instance, it can be
    proven that a risk averse utility function is concave, a risk prone utility function
    is convex, and a risk neutral function is linear.


    Let us conclude this section by summarizing both the advantages and disadvantages
    of the functional approach. We start by listing the main advantages of the functional
    approach.


    +   - It is a formal and elegant model of rational decision making.

    +   - Once the model exists, obtaining its prescription is a straight forward
    process.

    +   - It can model the DM''s behavior towards risk.'
