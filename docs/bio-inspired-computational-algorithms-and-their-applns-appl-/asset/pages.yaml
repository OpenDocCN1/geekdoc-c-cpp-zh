  md: '![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_270_0.png)


    # ### 7.1.4 Results of the real-time implementation


    A minimum distance classifier was implemented in a digital signal processor TMS320LF2407
    for each of the four lexons L=[L₀, L₁, L₂, L₃] from Texas Instruments, in order
    to verify the performance using in a nearly real-life application. The voiced/no-voiced
    segmentation was performed using a push-button to start and finish capturing the
    voice. The DSP has a built-in 10-bit analog to digital converter facilitating
    the interfacing task. The digital filters used were IIR topology, elliptic type,
    8th order. The filter coefficients (A, B) were calculate using the Matlab® Software.
    The analog-to-digital conversion was set-up to acquire one sample every T seconds,
    (T=1/6000); each time a sample came into de device, the filters actuated and the
    respective output was squared and accumulated to calculate the energy of the signal.
    Scaling issues had to be solved since the model was created in a real valued [-1
    , 1] scale, while the DSP just “see” integer values. Once a whole command was
    processed, it was just a matter of a few milliseconds to apply the minimum distance
    classifier and provide the classification. The correct classification rate was
    in this case of the order of 94.5%, in a total of 1200 repetitions of the words
    in L.


    # ## 8. Conclusions and future work


    In this chapter was presented a method to implement a high performance, real-time,
    restricted-vocabulary speech recognition system, combining a genetic algorithm
    and the Fisher’s Linear Discriminant Ratio (FLDR) in its matrix formulation. A
    review of the concepts of variable and feature selection as well as feature generation
    was made; also were presented some concepts related with speech processing, like
    the LPC formulation and the DTW method for template matching.


    One of the conceptual tools used here was the energy of the signal in certain
    sub-bands in the frequency domain; thanks to the Parseval’s theorem, the same
    amounts of energy can be calculated in the time domain via a bank of digital filters,
    enabling thus a very fast way to apply the recognizer, since the process goes
    on at the same time as the occurrence of the word is exerted. Mainly, two experiments
    were shown, in Spanish and English, with male and female participants; in both
    cases high performance was attained, beyond 94% at the'
