    u_{\alpha\beta}d\tau - l_{md}\begin{pmatrix}\cos\theta\\ \sin\theta\end{pmatrix}i_F\right\}$


    $= \left(\frac{l_d+l_q}{2l_d l_q}I_2 - \frac{l_d-l_q}{2l_d l_q}\begin{pmatrix}\cos2\theta
    & \sin2\theta\\ \sin2\theta & -\cos2\theta\end{pmatrix}\right)\cdot\left(\int
    u_{\alpha\beta}d\tau - l_{md}\begin{pmatrix}\cos\theta\\ \sin\theta\end{pmatrix}i_F\right).
    \tag{17}$


    With further simplification, we have $i_{\alpha\beta}$ as:


    $i_{\alpha\beta}= \frac{l_d+l_q}{2l_d l_q}\int u_{\alpha\beta}d\tau + l_1 - \frac{l_d-l_q}{2l_d
