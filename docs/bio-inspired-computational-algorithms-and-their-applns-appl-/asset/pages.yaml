    # ## 2.4 Genetic Algorithm


    # ### 2.4.1 Introduction


    Optimization can be distinguished by either discrete or continuous variables.
    Discrete variables have only a finite number of possible values, whereas continuous
    variables have an infinite number of possible ones. Discrete variable optimization
    is also known as combinatorial optimization, because the optimum solution consists
    of a certain combination of variables from the finite pool of all possible variables.
    However, when trying to find the minimum value of $f(x)$ on a number line, it
    is more appropriate to view the problem as continuous [J. H. Holland, 1975; S.
    K. Mitra et al., 1998].


    Genetic algorithms manipulate a population of potential solutions for the problem
    to be solved. Usually, each solution is coded as a binary string, equivalent to
    the genetic material of individuals in nature. Each solution is associated with
    a fitness value that reflects how good it is, compared with other solutions in
    the population. The higher the fitness value of an individual, the higher its
    chances of survival and reproduction in the subsequent generation. Recombination
    of genetic material in genetic algorithms is simulated through a crossover mechanism
    that exchanges portions between strings.


    Another operation, called mutation, causes sporadic and random alteration of the
    bits in strings. Mutation has a direct analogy in nature and plays the role of
    regenerating lost genetic material [M. Srinivas & L. M. Patnaik, 1994]. GAs have
    found applications in many fields including image processing [J. Zhang, 2008;
    L. Yu et al., 2008].


    # ### 2.4.2 Continuous Genetic Algorithm (CGA)


    GAs typically represent solution as binary strings. For many applications, it
    is more convenient to denote solutions as real numbers known as continuous Genetic
    algorithms (CGA). CGAs have the advantage of requiring less storage and are faster
    than the binary counterparts. Figure 1 shows the flowchart of simple CGA [Randy
    L. Haupt & Sue Ellen Haupt, 2004].


    # #### 2.4.2.1 Components of a Continuous Genetic Algorithm


    The various elements in the flowchart are described below [D.Patnaik, 2006].


    # ##### 2.4.2.1.1 Cost function


    The goal of GAs is to solve an optimization problem defined as a cost function
    with a set of parameters involved. In CGA, the parameters are organized as a vector
    known as a chromosome. If the chromosome has Nvar variables (an N-dimensional
    optimization problem) given by p1, p2, p3,...,pNvar, then the chromosome is written
    as an array with 1x Nvar elements as [Randy L. Haupt & Sue Ellen Haupt, 2004]:


    chromosome = [p1, p2, p3, ..., pNvar]    (3)'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_202_0.png)


    Fig. 1. Flowchart of CGA


    In this case, the variable values are represented as floating-point numbers. Each
    chromosome has a cost found by evaluating the cost function f at the variables
    p1,p2,p3,...,pNvar,


    cost = f(chromosome) = f(p1,p2,p3,...,pNvar) (4)


    Equations (3) and (4) along with applicable constraints constitute the problem
    to be solved. Since the GA is a search technique, it must be limited to exploring
    a reasonable region of variable space. Sometimes this is done by imposing a constraint
    on the problem. If one does not know the initial search region, there must be
    enough diversity in the initial population to explore a reasonably sized variable
    space before focusing on the most promising regions.


    # 2.4.2.1.2 Initial population


    To begin the CGA process, an initial population of Nvar must be defined, a matrix
    represents the population, with each row being a 1 x Nvar chromosome of continuous
    values [D.Patnaik, 2006]. Given an initial population of Nvar chromosomes, the
    full matrix of Nvar x Nvar random values is generated by:


    pop = rand(Nvar, Nvar) (5)


    All variables are normalized to have values between 0 and 1. If the range of values
    is between plo and phi, then the normalized values are given by:


    p = (phi - plo)p_norm + plo (6)


    where'
  merge: -1
