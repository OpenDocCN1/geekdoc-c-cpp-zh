  md: 'Table 7 shows the results from standard Cultural Algorithm (CA-S) that utilizes
    single population. According to results, the CA-S reaches optimum average for
    100 runs only for Sento1 and Weing7. However, the results from CA-S for Petersen6,
    Pertersen7 and Sento2 outperform the results presented by DGA-SRM.


    # ## 5. Conclusion


    This work presented a Cultural Algorithm (CA) with single population (CA-S) and
    multi population (CA-IM) in order to improve the search performance on MKP. It
    was observed that CA-S improves the convergence reliability and search speed.
    However, CA-S is not enough to reach global optimum for most problems presented.
    Our cultural algorithm implementation with island model (CA-IM.1 and CA-IM.2)
    allows the migration among islands sub-populations and main population through
    belief space structures that represent the cultural knowledge available in Cultural
    Algorithms.


    The results have shown that the CA-IM.1 is better than CA-IM.2 for the benchmarks
    selected. The results have also shown that the CA-IM.1 and CA-IM.2 perform the
    optimum search and reach optimum values equally or above the ones reached by algorithms
    DGA and DGA-SRM that were chosen for comparison. The positive results obtained,
    give support the idea that this is a desirable approach for tackling highly constrained
    NP-complete problems such as the MKP. In addition, it is possible that the hybridization
    of cultural algorithms based on population of GA with local search techniques
    improves the results obtained by standard CAs. In a future work, a study will
    be done about the behavior of the sub-populations that are eliminated and recreated
    randomly. In addition a local search will be implemented to CAs as much for standard
    CA (single population) as for CA-IM (multi population) so as to verify improvements
    on these algorithms.


