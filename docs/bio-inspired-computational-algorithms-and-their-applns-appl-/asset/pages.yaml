    # 7.1 ODEs models


    A model of inflammation composed by ODEs in a three-dimensional domain considering
    three types of cells/molecules has been proposed by Kumar et al. (2004): the pathogen
    and two inflammatory mediators. The model was able to reproduce some experimental
    results depending on the values used for initial conditions and parameters. The
    authors described the results of the sensitivity analysis and some therapeutic
    strategies were suggested from this analysis. The work was then extended (Reynolds
    et al. (2006)) to investigate the advantages of an anti-inflammatory response
    dependent on time. In this extension, the mathematical model was built from simpler
