  md: '# # Modelling the Innate Immune System


    Pedro Rocha, Alexandre Pigozzo, Bárbara Quintela, Gilson Macedo, Rodrigo Santos
    and Marcelo Loboso


    *Federal University of Juiz de Fora, UFJF* *Brazil*


    # ## 1. Introduction


    The Human Immune System (HIS) is a complex network composed of specialized cells,
    tissues, and organs that is responsible for protecting the organism against diseases
    caused by distinct pathogenic agents, such as viruses, bacteria and other parasites.
    The first line of defence against pathogenic agents consists of physical barriers
    of skin and the mucous membranes. If the pathogenic agents breach this first protection
    barrier, the innate immune system will be ready for recognize and combat them.
    The innate immune system is therefore responsible for powerful non-specific defences
    that prevent or limit infections by most pathogenic microorganisms.


    The understanding of the innate system is therefore essential, not only because
    it is the first line of defence of the body, but also because of its quick response.
    However, its complexity and the intense interaction among several components,
    make this task extremely complex. Some of its aspects, however, may be better
    understood if a computational model is used. Modelling and simulation help to
    understand large complex processes, in particular processes with strongly coupled
    influences and time-dependent interactions as they occur in the HIS. Also, *in
    silico* simulations have the advantage that much less investment in technology,
    resources and time is needed compared to *in vivo* experiments, allowing researchers
    to test a large number of hypotheses in a short period of time.


    A previous work (Pigozzo et al. (2011)) has developed a mathematical and computational
    model to simulate the immune response to Lipopolysaccharide (LPS) in a microscopic
    section of a tissue. The LPS endotoxin is a potent immunostimulant that can induce
    an acute inflammatory response comparable to that of a bacterial infection. A
    set of Partial Differential Equations (PDEs) were employed to reproduce the spatial
    and temporal behaviour of antigens (LPS), neutrophils and cytokines during the
    first phase of the innate response.


    Good modelling practices require the evaluation of the confidence in the new proposed
    model. An important tool used for this purpose is the sensitivity analysis. The
    sensitivity analysis consists of the study of the impact caused by the variation
    of input values of a model on the output generated by it. However, this study
    can be a time consuming task due to the large number of scenarios that must be
    evaluated. This prohibitive computational cost leads us to develop a parallel
    version of the sensitivity analysis code using General-purpose Graphics Processing
    Units (GPUs). GPUs were chosen because of their ability to'
