    \ algorithms\n\nProgramming the SZGA is simple, as explained below. This zooming\
    \ philosophy may not be confined only in GA, but can be applied to most other\
    \ global search algorithms. Let Y(i) be the global variables ranging YMIN(i) ~\
    \ YMAX(i), where i is the design variable number. Z(i) consists of local normalized\
    \ variables ranging 0-1. Thus, the relation between them is as follows in FORTRAN;\n\
    \n```\nDO 10 I=1,NVAR\n10 Y(I)=YMIN(I)+(YMAX(I)-YMIN(I))*Z(I)\n```\n\nThe relation\
    \ between local variable Z(I) and local variable X(I) (0~1) in the zoomed region\
    \ is as follows;\n\n```\nDO 12 I=1,NVAR\n12 Z(I)=ZOPT(I,JWIN-1)+ALP**(JWIN-1)*(X(I)-0.5)\n\
    ```\n\nWhere, ZOPT(I,JWIN) is the elitist in the zoom step (JWIN-1), and ALP is\
    \ the zooming factor. Note that ZOPT(I,JWIN-1) is more logical. However, the argument\
    \ is increased by one to meet old versions of FORTRAN, which require a positive\
    \ integer as a dimension argument. Based on the elitist in step (JWIN-1), we are\
    \ seeking variables in step JWIN. Please note that ZOPT(I,1)=0.\n\nA pre-zoning\
    \ algorithm adjusts the guessed initial zone to a very reasonable zone after one\
    \ set of generation.\n\n```\nDO 14 I=1,NVAR\n    YMIN(I)=YINP(I)-BTA*ABS(YINP(I))\n\
    14  YMAX(I)=YINP(I)+BTA*ABS(YINP(I))\n```\n\nWhere, YINP(I) is the elitist obtained\
    \ after one set of generation. Thus, we eliminate the assumed initial boundary,\
    \ and establish a new reasonable boundary. The coefficient BTA may be properly\
    \ selected, say 0.5."
