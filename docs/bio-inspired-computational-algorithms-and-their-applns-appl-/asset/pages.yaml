  md: '![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_77_0.png)


    Fig. 1. The range of possible offspring in two-dimensional bounded real space


    The remainder of this chapter is organized as follows. Traditional and recent
    genetic operators in real encoding are introduced in Section 2. Previous genetic
    operators are presented in Section 2.1 and ones we used in real encoding in this
    study are described in Section 2.2. In Section 3, we describe the concept of bias
    of genetic operators and analyze that in the case of crossover and mutation for
    GAs. In Section 4, experimental results for various combinations of crossover
    and mutation are provided and analyzed. Finally, we make conclusions in Section
    5.


    # 2. Genetic operators in real encoding


    # 2.1 Previous operators


    The roles of crossover and mutation may change according to the selection of the
    operators. We reviewed the most frequently used crossover and mutation operators
    for real-code representation. We are to analyze how the roles of crossover and
    mutation can change by studying various combinations of crossover and mutation
    operators.


    In literature many crossover operators for real-code representation are found.
    Traditional crossover operators for the real-code representation are described
    in (Bäck et al., 2000). The two main families of traditional crossover operators
    (Mühlenbein & Schlierkamp-Voosen, 1993) are discrete crossovers¹ (Reed et al.,
    1967) and blend crossovers (Michalewicz, 1996). Blend crossover operators can
    be distinguished into line crossovers and box crossovers. Important variations
    of the last two crossover operators are the extended-line crossover and the extended-box
    crossover (Mühlenbein, 1994).


    The discrete recombination family is the straightforward extension to real vectors
    of the family of mask-based crossover operators for binary strings including n-point
    and uniform crossover.


    ¹ It is also called dominant crossover.'
