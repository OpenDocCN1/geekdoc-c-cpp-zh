    Before we proceed to the description of the rest of the assumptions, we need to
    introduce the concept of elementary portfolio.


    **Definition 3:** An elementary portfolio is a portfolio that contains only projects
    of the same category. It will be expressed in the form of a C-dimensional vector,
    where C is the number of discrete categories. Each dimension corresponds to one
    particular category. The value in each dimension corresponds to the number of
    projects in the associated category. Consequently, the C-dimensional vector of
    an elementary portfolio with n projects will have the form (0, 0, ..., n, 0, ...,
    0).


    **Assumption 5:** The SDM can define a complete relation ≽ on the set of elementary
    portfolios. That is, for any pair of elementary portfolios, P and Q, one and only
    one of the following propositions is true.


    +   - Portfolio P is preferred to portfolio Q

    +   - Portfolio Q is preferred to portfolio P

    +   - Portfolios P and Q are indifferent.


    **Assumption 6 (Essentiality):** Given two elementary portfolios, P and Q, defined
    over the same category. Let P = (0, 0, ..., n, 0, ..., 0) and Q = (0, 0, ...,
    m, 0, ..., 0). P is preferred to Q if and only if n > m.


    From the set of discrete categories, let C₁ be the lowest category, C_L be the
    highest, and C_j a category preferred to C₁.


    **Assumption 7 (Archimedean):** For any category C_j there is always an integer
    value n such that the SDM would prefer a portfolio composed of n projects in the
    C₁ category to any portfolio composed of a single project in the C_j category.


    **Assumption 8 (Continuity):** If an elementary portfolio P = (x, 0, ..., 0, ...,
    0) is preferred to an elementary portfolio Q = (0, ..., 1, 0, ..., 0), defined
    over category j for 1 < j ≤ L, there is always a pair of integers values n and
    m (n > m) such that an elementary portfolio with n projects of the lowest category
    is indifferent to another elementary portfolio with m projects of the j-th category.


    Assumption 5 characterizes the normative claim of the functional approach for
    decision-making. Assumption 6 is a consequence of Assumption 4 (additivity) combined
    with the premise that all projects satisfy minimal acceptability requirements.
    Assumption 7 is a consequence of both essentiality and the non-bounded character
    of the set of natural numbers. Assumption 8 simulates the way in which a person
    balances using a scale using a set of two types of weights whose values are relative
    primes.


