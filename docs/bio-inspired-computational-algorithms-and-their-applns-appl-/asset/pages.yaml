- pgno: 227
  md: 'values of these parameters will produce better individuals, which have major
    probability of surviving, and in consequence, will spread towards the whole population
    the best values of the parameters. There are several versions of SAGA that differ
    especially in the parameters that will be adjusted automatically (Eiben at all,
    1999). In the case of this work four self Adaptive parameters are used: individual
    probability of crossing p_c, repetition of crossing r_c, individual probability
    of mutation p_m and repetition of mutation r_m as presented in (4). The selection
    of these parameters and its values is based on the idea that genetic operations
    of crossing and mutation can be multiple, but they cannot have very large values.
    A binary version of this algorithm already had been used by one of the authors
    of this work in other problems (Flores, 1999; Garduño, 2000; Garduño, 2001; Sanchez,
    2004), and this, as well as the presented one here (with the representation of
    real numbers) according to the literature reviewed, are original of himself.


    The individuals for these problems will be proposed as solutions to them, and
    in addition will have four more components, where it will be represented the values
    of: individual probability of crossing p_c, repetition of crossing r_c, individual
    probability of mutation p_m and repetition of mutation r_m. To this section of
    the individual it is called section of the self Adaptive parameters, and with
    this, our entire individual is represented by:


    (δ, φ1, φ2, ..., φp, r_c, r_c, p_m, r_m)  (4)


    The above mentioned is necessary, so in this model, the probability of crossing
    and mutation will be characteristic of each individual (not of the population
    as is traditional in the GA), and in addition it is considered that the crossing
    and the mutation can be multiple, that is to say, to operate several times in
    the same time. The multiple crossing and mutation are repetitions of the crossing
    and mutation that are used in the GA, when are used individuals represented by
    vectors of real components. The way of operating with these parameters is similar
    to that presented in (Back, 1992a, 1992b).


    The limits that were used in the code of this work for the self Adaptive parameters
    are: individual probability of crossing p_c that changes in the interval (0.5,
    0.95), repetition of crossing r_c in (1.0, 4.0) what means that only can be crossed
    from one to three times, individual probability of mutation p_m that varies in
    (0.5, 0.85) and repetition of mutation r_m in (1.0, 5.0) what means that just
    it is possible to mutated from one to four times. The limits of these self Adaptive
    parameters were chosen on the basis of the experience of other works (Flores,
    1999; Garduño, 2000; Garduño, 2001; Sanchez, 2004), where they proved to give
    good results.


    Later there are detailed the procedures of crossing and mutation.


    # 3.1 Crossing and mutation


    Given two individual, the crossing is realized taking as probability of crossing
    the average of the values of the individual crossings. Once it has been decided
    if the individuals cross, it is taken the integer part of the average individual
    crossing, and that is the number of times they cross. The crossing of two individuals
    consists of exchanging the coordinates of both vectors from a certain coordinate
    chosen at random. The multiple crossing is the result of applying this procedure
    several times to the same vectors.


    For the mutation it is taken the individual probability of mutation of the individual,
    and accordingly to this it is decided whether mutated or not. As soon as has been
    decided that'
