  md: 'this section can be found in Goldberg (1989) and Davis (1991). The implementation
    of GA is a step-by-step procedure:


    # 4.1 Initialization


    Initialization is to generate an initial population. The population size and length
    of chromosome depends on the users'' choice and other requirements of the specific
    problem. To start, we usually have a totally random population. Each random string
    (or chromosome) of the population, representing a possible solution for the problem,
    is then evaluated using an objective function. The selection of this objective
    function is important because it practically encompasses all the knowledge of
    the problem to be solved. The user is supposed to choose the proper combination
    of desirable attributes that could be best fit to his purposes. In CPL problem,
    the variable Y is a vector of binary integers. It is easily to be coded as a string
    of binary bit with the position #i corresponding to the plant #i. For example,
    Y = (0 1 1 0 1 0 0 0) means that plants #1, 4, 6 and 7 are not open and plants
    2, 3 and 5 are open. In our GA, a population size of 50 was used and the fitness
    function is evaluated quickly and simply by evaluating a set of linear functions,
    i.e., σ_T(Y) ≡ Max_{1≤i≤T} { α^i Y + β^i }.


    # 4.2 Selection


    Selection (called reproduction by Goldberg) starts with the current population.
    Selection is applied to create an intermediate population or mating pool. All
    the chromosomes in the mating pool are waiting for other operations such as crossover
    and/or mutation to create the next population. In the canonical genetic algorithm,
    selection is made according to the fitness. The fitness could be determined by
    many ways. For example, the fitness could be assigned according to probability
    of a string in the current population (Goldberg, 1989), a string''s rank in the
    population (Baker, 1985; Whitley, 1989), or simply by its performance of scores.
    In our GA, the latter case is used, i.e., a string with an average score is given
    one mating; a string scoring one standard deviation above the average is given
    two matings; and a string scoring one standard deviation below the average is
    given no mating (Michalewicz, 1998).


    # 4.3 Crossover and mutation


    We use a standard single-point crossover method. The duplicated strings in the
    mating pool are randomly paired off to produce two offspring per mating. The crossover
    location of the strings is generally chosen at random but not necessary always
    the case. For example, the distribution for selection the crossover point of the
    GenJam system, an interactive genetic algorithm jazz improviser, which was developed
    by Dannenberg for the Carnegie Mellon MIDI Toolkit, is biased toward the center
    of the chromosome to promote diversity in the population. If a crossover point
    is too near one end of the chromosome or the other, the resulting children are
    more likely to resemble their parents. This will lead the GenJam system to repeat
    itself when two nearly identical phrases happen to be played close to one another
    in the same solo and it does not seem desirable for GenJam to perform in that
    way. The role of mutation is to guarantee the diversity of the population. In
    most case, mutation alters one or more genes (positions in a chromosome) with
    a probability equal to the'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'mutation rate. Typically, but not always, mutation will flip a single bit.
    In fact, GenJam''s mutation operators, on the other hand, are more complex than
    flipping a bit. They adopt several standard melodic development techniques, such
    as transposition, retrograde, rotation, inversion, sorting, and retrograde-inversion.
    Because these operators are all musically meaningful, they operate at the event
    level rather than on individual bits (Biles, 2001).


    # ### 4.4 Replacement


    After the process of selection, crossover, and mutation, the current population
    is replaced by the new population. Those successful individuals of the each generation
    are more likely to survive in the next generation and those unsuccessful individuals
    are less likely to survive. In our GA, we use the incremental replacement method
    (See Beasley et al., 1993), i.e., only the new individuals whose fitness values
    are better than those of the current will be replaced. Thus, the individuals with
    the best fitness are always in the population.


    # ### 4.5 Termination


    In general, a genetic algorithm is terminated after a specified number of generations
    or when fitness values have converged. Our GA terminates when there has been no
    improvement in the best solution found for 100 iterations.


    # ## 5. Hybrid Benders/Genetic algorithm


    The basic idea of Benders'' partitioning algorithm for mixed-integer linear problems
    is to decompose the original problem into a pure integer master problem and one
    or more subproblems in the continuous variables, and then to iterate between these
    two problems. If the objective function value of the optimal solution to the master
    problem is equal to that of the subproblem, then the algorithm terminates with
    the optimal solution of the original mixed-integer problem. Otherwise, we add
    constraints, termed Benders'' cuts, one at a time to the master problem, and solve
    it repeatedly until the termination criteria are met. A major difficulty with
    this decomposition lies in the solution of the master problem, which is a “hard”
    problem, costly to compute.


    For the addressed CPL problem, however, the constraints are explicit only in the
    subproblem and the master problem is free of explicit constraints. Thus, the master
    problem is more amenable to solution by GA.


    Lai et al. (2010) introduced a hybrid Benders/Genetic algorithm which is a variation
    of Benders'' algorithm that uses a genetic algorithm to obtain “good” subproblem
    solutions to the master problem. Lai and Sohn (2011) conducted a study applying
    the hybrid Benders/Genetic algorithm to the vehicle routing problem. Below is
    a detailed description of the hybrid algorithm and it is illustrated in Fig. 1
    as well.


    +   1. **Initialization.** We initialize the iteration counter k to zero, select
    initial trial values for the vector of binary variables Y which selects the plants
    to be opened.

    +   2. **Primal Subsystem.** We evaluate the value of r(Y) by solving a transportation
    linear programming problem whose feasible region is independent of Y.'
