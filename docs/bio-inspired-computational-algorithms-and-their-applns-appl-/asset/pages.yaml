    # 3. A simple Genetic Algorithm


    The set of all the solutions of an optimization problem constitutes the search
    space. The problem consists in finding out the solution that fits the best, from
    all the possible solutions. When the search space becomes huge, we need a specific
    technique to find the optimal solution. GAs provides one of these methods. Practically
    they all work in a similar way, adapting the simple genetics to algorithmic mechanisms.
    GA handles a population of possible solutions. Each solution is represented through
    a chromosome, which is just an abstract representation.


    Coding all the possible solutions into a chromosome is the first part, but certainly
    not the most straightforward one of a GA. A set of reproduction operators has
    to be determined, too. Reproduction operators are applied directly on the chromosomes,
    and are used to perform selection of the parents, by using a fitness function
    (usually the most fitted, with some likelihood), recombinations (crossover) and
    mutations and over solutions of the problem. “Appropriate representation and reproduction
    operators are really something determinant, as the behavior of the GA is extremely
    dependant on it. Frequently, it can be extremely difficult to find a representation,
    which respects the structure of the search space and reproduction operators, which
    are coherent and relevant according to the properties of the problems” (Sivanandam
    & Deepa, 2008).'
