    # 6. Discussion


    This paper has given for the first time a uniform-salient building block (USBB)
    in the S/D binary representation, which include uniformly scaled bits. This assumes
    that the phenotypic space $\Phi_p$ is uniformly scaled in each dimension. If the
    assumption is not satisfied, we need to normalize the phenotypic space $\Phi_p$
    first, then encoding the normalized phenotypic space $\Phi''_p$ into the S/D binary
    space $\Phi_g$ to guarantee that the bits in each USBB have same scaled.


    SDGA applies on the S/D binary representation and converges from high scaled to
    low scaled USBBs sequentially. However, when the convergence window USBB cannon
    converge to single high-quality BB, there are maybe some high-quality BBs existing
    to describe different optima of the problem. At this time, we need to use some
    other methods (e.g., the niche methods) to divide the whole population into several
    sub-populations and each sub-population focus on each optimum. Thus, each optimum
    will be overrepresented by'
