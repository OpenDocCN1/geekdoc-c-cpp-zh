  md: 'itemsets in data streams in Section3. In Section 4, comprehensive experiments
    for the algorithm are implemented in built environment and give the comparison
    with other methods. Moreover, algorithm analysis is also proposed for mining time-sensitive
    sliding windows in this section. Finally, we summarize the work in Section 5.


    # 2. Theoretical foundation


    The study combines the sliding window techniques, frequent itemsets, genetic algorithm
    and parallel processing technology.


    Sliding window has been used in the network communication, time-series data mining,
    data stream mining and so on. This algorithm uses the sliding window [9,10] to
    obtain the current data stream.


    Definition 1 sliding window: For a positive number ω1, a certain time T, data
    sets D = (d0, d1, ..., dn) fall into the window SW(the size of window SW is ω1),
    the window SW is called the sliding window.


    Definition 2 nested sub-window: For a positive number ω2, a certain time T, the
    newest data set dn in sliding window SW falls into the nested window NSW ( the
    size of NSW is ω2), the nested window NSW is called the nested sub-window.


    As shown in Figure 1, the application of sliding window for dynamic updating of
    data sets is explained.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_304_0.png)


    Fig. 1. Dynamic updating of the data in sliding window'
