    Fig. 2. Experimental environment used in the tests with the GA.


    # 3. Genetic algorithm for document clustering


    # 3.1 Individuals


    The population consists of a set of individuals, where each of it is made of a
    linear chromosome that is represented through a tree structure (hierarchical structure).
    An individual shall formed on a binary tree structure *cluster all documents*
    prepared at the top, where each document consists of a *feature vector*. The vector
    will consist of the weighted values of the frequencies of the stemmer terms that
    have been selected to implement the document processing scheme [4]. This representation
    will be attempted to evolve so that the chromosome will undergo genetic changes
    and find the groups ''Clusters'' more appropriate for all documents of the IRS.
    Within the root node we will have our fitness function (*fitness*) that measure
    the quality of the resulting clustering. Depending on the number of documents
    that need to be processed and the depth (height) of the tree you want to create,
    chromosome may be of variable length.


    The Figure 3 shows the initial generation (0), a scheme of tree-based representation
    is adopted in order to allow the encoding of sufficiently complex logical structures
    within a chromosome. The search area for the GA is the space of all possible trees
    that can be generated, resulting from the whole relevant functions and terminals.
    This way we can evolve individuals of various shapes and sizes [8], allowing evolution
    to decide what are the best settings.


    Although the initial population is random, there is a defined set of parameters
    governing the establishment of such individuals. For example, *there should not
    be created in the initial set two equal individuals*, for this production rules
    are created to ensure the compliance with this condition. The above mentioned
    rules require that the building grammar of each individual nodes takes place in
    Preorder.'
