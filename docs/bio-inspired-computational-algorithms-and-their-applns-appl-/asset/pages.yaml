    # 5.2 Enhancement of visual images


    The ETNUD algorithm was applied to 16 visual images as shown in Figure 6 under
    different illumination conditions. In all figures besides the regular room lights,
    the four extra spot lights located in the front of the person were turned off
    and on for creating different illumination conditions. To enhance those visual
    images, the luminance is first balanced, then image contrast is enhanced and finally,
    the enhanced image is obtained by a linear color restoration based on chromatic
    information contained in the original image. The results in the luminance enhancement
    part showed that the algorithms work well for dark images. All the details, which
    cannot be seen in the original image, become evident. The experiment results have
    shown that for all color images, the proposed algorithms work sufficiently well.


    # 5.3 IR and visual images registration


    First, the IR and visual images taken from different sensors, viewpoints, times
    and resolution were resized for the same size. The correspondence between the
    features detected in the IR image and those detected in the visual image were
    then established. Control points were picked manually from those corners detected
    by the Harris corner detection algorithm from both images, where the corners were
    in the same positions in the two images.


    In the second step, a spatial transformation was computed to map the selected
    corners in one image to those in another image. Once the transformation was established,
    the image to be registered was resampled and interpolated to match the reference
    image. For RGB and intensity images, the bilinear or bicubic interpolation method
    is recommended since they lead to better results. In the experiments, the bicubic
    interpolation method was used.


