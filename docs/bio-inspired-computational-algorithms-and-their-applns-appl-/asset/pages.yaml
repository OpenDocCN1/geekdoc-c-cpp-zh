  md: 'generation of a desired trajectory consists controlling a point of the coupler
    link, figure 5 (case I four-bar mechanism and case II six-bar mechanism), so that
    its described trajectory drives the coupler through a discreet set of giving points,
    known as precision points (Norton, 1995). In order to determine this point it
    is necessary to obtain the open and close chain mechanism.


    In the last century, have been developing a variety of mechanisms synthesis methods.
    These are usually based on graphical procedures originally developed by (Freudenstein,
    1954); or on analytical methods of research of (Denavit and Hartenberg, 1964).
    Other techniques include the application of least squares in the finite synthesis
    of four-bar spatial synthesis proposed by (Levitski and Shakvazian, 1960), or
    on the mathematical model and simulation for the exact mechanisms synthesis as
    is described in (A. K. Mallik and A. Ghosh, 1994) and (Tzong-Mou and Cha''o-Kuang,
    2005). However while these works have represented major contributions in the area,
    the principal restriction are the number of points of precision that can be taken
    into account to define the desired path. The foregoing refers to the fact that
    each point of precision defined for the desired path represents a new set of equations
    to be solved. For example, the synthesis of a four- bar mechanism involves a set
    of 7 holonomics restrictions that describe the kinematic relationship of the links
    that make it up; if the designer consider 4 points of accuracy, the problem to
    be solved is a set of 28 non-linear equations with 29 unknowns, which represents
    a non-linear indeterminate problem with an infinite number of possible solutions.


    With all these arguments in mind and taking into account that exist a wide variety
    of applications that require a large number of precision points to define more
    accurately the trajectory to be reproduced by the mechanism, the synthesis of
    these can be seen as an optimization multi-objective problem. For this purpose,
    researchers have developed different methodologies that include non-linear optimization
    (Levitski and Shakvazian, 1960), genetic algorithms (Quintero-R et al., 2004,
    Laribi et al., 2004, Cabrera et al., 2002, Michalewicz, 1999, Roston and Sturges,
    1996), neuronal networks (Vasiliiu and Yannou, 2001), (Starosta, 2006), (Walczak,
    2006)), Monte Carlo optimization (Kalnas and Kota, 2001), or the controlled method
    (Bulalovic and Djordjevic, 2004). All the above methods have been used for four-bar
    mechanisms synthesis and have helped to identify the constraints of space that
    lead to the synthesis of mechanisms and programs developed for applications.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_63_0.png)


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_63_1.png)


    a) Coupler point on the coupler link of a four bar linkage


    b) Type 6-bar Watt mechanism.


    Fig. 5. Diferent mechanisms configuration.'
