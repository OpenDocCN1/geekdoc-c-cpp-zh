- pgno: 19
  md: '# 2.3 Hybrid genetic algorithm


    Genetic algorithms are stochastic global search methods based on the mechanism
    of natural selection and natural reproduction. GAs have been applied to structural
    optimization problems because they can solve optimization problems that involve
    mixing continuous, discontinuous, and non-convex regions etc. The SGA (simple
    GA) has been improved to MGA by using some techniques like tournament selection
    as well as the elitist strategy. Yet, GAs have some difficulty in fast searching
    the exact optimum point at a later stage. The DPE (Dynamic Parameter Encoding)
    GA 4 uses a digital zooming technique, which does not change a digit of a higher
    rank further after a certain stage. The SZGA (Successive Zooming GA) zooms the
    searching area successively, and thus the convergence rate is greatly increased.
    A new hybrid GA technique, which guarantees to find the optimum point, has been
    proposed 7,14.


    The hybrid GA first identifies a quasi optimal point using an MGA, which has better
    searching ability than the simple genetic algorithm. To solve the convergence
    problem at the later stage, we employed hybrid algorithms that combine the global
    GA with local search algorithms (DFP 1 or MGA). The hybrid algorithm using the
    DFP (Davidon Fletcher Powell) method incorporates the advantages of both a genetic
    algorithm and the gradient search technique. The other hybrid algorithm of global
    GA and local GA at the zoomed area is called LGA (Locally zoomed GA), checks the
    concavity condition near the quasi minimum point. The enhancement of the above
    hybrid algorithms is verified by application of these algorithms to the gate optimization
    problem.


    In this hybrid algorithm of minimization problem, an MGA is performed generation-by-generation
    until there is no further change of the objective function, and then the approximate
    optimum solution is found at Z_MCA. The gradients of the objective function as
    a function of the design variables are checked, if the concavity condition 1 is
    satisfied at the boundary of a small zoomed area (Fig. 2). If the condition is
    not satisfied, the small zoomed area is increased by δ. After several iterations,
    concavity conditions are finally achieved at the boundary of the final zoomed
    area (kδ × kδ) centered at Z_MCA. With the elitist solution from the global GA
    (approximate optimum solution, Z_MCA) and the concavity condition, the optimum
    point is found within the final zoomed area [Z(i): (Z_MCA(i) - kδ) ~ (Z_MCA(i)
    + kδ)]. From this point, a local GA is performed for the small finally zoomed
    area, which probably contains the optimum point. Usually, this area is much smaller
    than the original are, so the convergence rate increases considerably (note that
    the first approximate solution prematurely converged to an inexact but near optimum
    point).


    Water gates need to be installed in dams to regulate the flow-rate and to ensure
    the containing function of dams. Among these gates, the radial gate is widely
    used to regulate the flow-rate of huge dams because of its accuracy, easy opening
    and closing, endurance etc. Moreover, 3-arm type radial gate has better performance
    than 2-arm type, in connection with the section size of girders and the vibration
    characteristics during discharging operation. Table 2 compares the optimized results
    for a 3-arm type radial gate, which considers the reactions to the minimized main
    weight of the structure including vertical girders with or without arms. The hybrid
    algorithm (MGA+DFP, MGA+LGA) obtained the exact optimal solution of 0.690488E+10
    after far fewer generations of 4100 than the 9000 by MGA, which result in a close
    but not the exact solution of 0.690497E+10'
