    with the construction of the first generation, where all parameters are randomly
    chosen within an allowed range (for example, 50 ≤ RD ≤ 1000 AU). We chose as the
    number of individuals (parameter sets) in all the generations to be 100. In the
    following interactions loops, the evaluation function runs the Dullemond et al.
    (2001) model for each individual, and compares the synthetic SED with the observed
    data through a χ² measure, using the modified expression (Press et al. 1995):


    χ²_i = 1/N Σ_{j=1}^N (F_j - φ_{ij})² (2) where F_j is the observed flux at wavelength
    λ_j, N is the number of observed data points, and φ_{ij} is the calculated flux
    for the solution S_i. The smallest χ² is assumed to be the gof, the goodness-of-fit
    measure for that generation. The evaluation function is applied to all individuals,
    and then the judgement procedure sorts the list by increasing χ². It also sets
