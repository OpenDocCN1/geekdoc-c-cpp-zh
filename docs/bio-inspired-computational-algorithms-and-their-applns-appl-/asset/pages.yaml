  md: '# ## 4. Mathematical foundations


    # ### 4.1 Fisher’s Linear Discriminant Ratio FLDR


    *Fisher’s Linear Discriminant Ratio*, is used as an optimization criterion in
    several research fields, including speech recognition, handwriting recognition,
    and others [1]. Consider the following definitions:


    **Within-class scatter matrix.**


    $$ S_w = \sum_{i=1}^{M} P_i S_i \qquad (27) $$


    where $S_i$ is the covariance matrix for class $\omega_i$, and $P_i$ the a priori
    probability of class $\omega_i$. Trace[$S_w$] is a measure of the average variance
    of the features, or descriptive elements of the class.


    **Between-class scatter matrix**


    $$ S_b = \sum_{i=1}^{M} P_i(\mu_i - \mu_0)(\mu_i - \mu_0)^T \qquad (28) $$


    where $\mu_0$ is the global mean vector


    $$ \mu_0 = \sum_{i=1}^{M} P_i \mu_i \qquad (29) $$


    Trace[$S_b$] is a measure of the average distance of the mean of each individual
    class from the respective global value.


    **Mixture scatter matrix**


    $$ S_m = E[(x - \mu_0)(x - \mu_0)^T] \qquad (30) $$


    $S_m$ is the covariance matrix of the feature vector with respect to the global
    mean, and E[.] is the mathematical operator of the expected mean value. Based
    on the just given definitions, the following criteria can be expressed:


    $$ J_1 = \frac{trace\{S_m\}}{trace\{S_w\}} \qquad (31) $$

    $$ J_2 = \frac{|S_m|}{|S_w|} = |S_w^{-1} S_m| $$


    It can be shown that J1 and J2 take large values when the samples in the $l$-dimensional
    are well clustered around their mean, within each class, and the clusters of different
    classes are well separated. Criteria in equation (31) can be used to guide an
    optimization process, since they measure the goodness of data clustered; the data
    to be clustered could be the set of features representative of the items of a
    class. Trace[$S_b$] is a measure of the average distance of the mean of each individual
    class from the respective global value.'
