  md: '# ### 4.1 Using GA to parameterize the design of Harrington pumps


    This subsection is based on the published work *Artificial Intelligence Parametrization
    of Harrington Pumps* (Caetano & Hetem 2011).


    Since the beginning of liquid engine spacecraft history, the choices on pumping
    were the turbo pumps (Neufeld 1995). However, turbo pumps present many difficulties
    to design and to achieve their optimum performance. Good and experienced designers
    can project specialized turbo pumps that can deliver 70-90% efficiency, but figures
    less than half that are not uncommon. Low efficiency may be acceptable in some
    applications, but in rocketry this is a severe problem. Common problems include:
    1) excessive flow from the high pressure rim back to the low pressure inlet along
    the gap between the casing of the pump and the rotor; 2) excessive recirculation
    of the fluid at inlet; 3) excessive vortexing of the fluid as it leaves the casing
    of the pump; 4) damaging cavitation to impeller blade surfaces in low pressure
    zones; and 5) critical shaping of the rotor itself is hardly precise (see the
    many examples and demonstrations presented by Dixon & Hall (2010) for a better
    understanding of these concerns).


    On the other end, the options are the pressurized tanks. In this choice, the fuel
    and oxidizer reservoir are filled charged with a high pressure gas (helium or
    nitrogen) that pushes the fluid to the thrust chamber. So, it is easy to see that
    the tank output fuel pressure drops as the rocket engine consumes its content.
    As an option, the designer can increase the inside pressure, but this came also
    with a high cost in material (due to tank thickness) and instability. Actually,
    pressurized propellant tanks are used on small rockets like the last stages on
    space missions.


    As an elegant intermediate solution between these two extremes, Harrington (2003)
    presented a design fills the gap between the pressure fed and the turbo pumps.
    This solution also has the advantage of lowering the costs of a rocket project,
    keeping low weight and without the high complexity of a turbo pump, whose operation,
    theoretical concerns and constructive details are explained in next section.


    # #### 4.1.1 Pump description and operation


    The construction consists of two chambers (B1 and B2 on figure 9) and a set of
    8 valves. The chambers are connected to the main tank (Mt) through valves k3 and
    k4. These chambers also deliver propellant to the combustion chamber (CB) through
    valves k5 and k6. There is a high pressure gas generator (Hp) that is connected
    to the chambers through valves k1 and k2. Valves k7 and k8 serve as ventilation
    for the chambers.


    The pumps work alternating two states. In state 1, B1 is being filled by Mt and
    B2 is feeding the combustion chamber; and in state 2 their role is inverted, say
    B2 is being filled by Mt and B1 is feeding the combustion chamber. The state change
    is done by opening and closing the valves, as presented in figure 9 and table
    2. The opening and closing of the valves is controlled by a small processor.


    # #### 4.1.2 The model: Pump constructive details


    Designing a Harrington pump is simple, but the optimization process is not (as
    expected: a P-problem and a NP-problem respectively). A pump with a small chamber
    must be filled'
  merge: -1
  img_proc: true
