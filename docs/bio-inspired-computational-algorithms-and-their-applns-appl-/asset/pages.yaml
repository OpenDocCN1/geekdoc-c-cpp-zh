  md: '![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_351_0.png)


    Fig. 1. Self and non-self elements and detectors for a two-dimensional shape space.


    Among the several conceivable ways to do the pre-processing, we here consider
    the following scheme. The distributions F(t) and F(t − 1) are independently sorted
    according to their fitness values. Then the m/2 highest and m/2 lowest ranked
    elements of both sorted distributions are taken. The elements coming from F(t
    − 1) are subtracted from the ones from F(t) and finally these calculated quantities
    (which reflect the difference between two consecutive fitness distributions) are
    normalized to the interval [0,1]. Hence, the result is a point in the m-dimensional
    shape space. The given procedure of pre-processing the data is motivated by the
    common sense arguments that a change in the fitness landscape particularly affects
    the magnitude of the best and the worst fitness values and also that their relative
    difference from one generation to the subsequent one is telling if either a standard
    evolutionary search or a reaction to a landscape change has taken place. Note
    that by this pre-processing a metric on the fitness distributions is defined.


    # ii.) Affinity measure.


    The affinity measure states the degree of matching and recognition between elements
    (that are points) in the shape space. In other words, the affinity measure describes
    to what degree elements in the shape space differ. Every element in the shape
    space is defined by its center point c ∈ [0,1]^m and a matching radius r. According
    to their function in the immunological detection and classification process, there
    are three types of elements in the shape space:


    +   (a) self elements se = (cs, rs) that are samples known to belong to the self
    space (usually from a training data set),

    +   (b) detectors dt = (cd, rd) that are derived from the self elements and must
    not match them, and

    +   (c) incoming data samples id = (ci, ri) that must be classified as belonging
    to either the self set or not.


    Self elements, detectors and incoming data are also known by their immunological
    motivated terms self cells, antibodies and antigens, respectively. There is a
    large number of different affinity measures, see e.g. (18) for an overview. We
    here use Euclidean distance so that there is a match if ||ci − cj|| < ri + rj,
    with the indices i, j denoting different elements of the shape space.'
