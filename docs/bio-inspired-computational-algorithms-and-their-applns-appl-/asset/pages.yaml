  md: 'To address the shortcomings mentioned above, an autonomous agent was developed
    that can participate in multiple heterogeneous auctions. It is empowered with
    trading capabilities and it is able to make purchases autonomously (Anthony, 2003;
    Anthony & Jennings, 2003b). Two primary values that heavily influenced the bidding
    strategies of this agent are the k and β. These two values correspond to the polynomial
    function of the four bidding constraints, namely the remaining time left, the
    remaining auction left, the user''s desire for bargain and the user''s level of
    desesperateness. Further details on the strategies will be discussed in Section
    3. The k value ranges from 0 to 1 while the β value is from 0.005 to 1000. The
    possible combinations between these two values are endless and thus, the search
    space for the solution strategies is very large. Hence, genetic algorithms were
    used to find the nearly optimal bidding strategy for a given auction environment.


    This work is an extension of the solution above, which has been successfully employed
    to evolve effective bidding strategies for particular classes of environment.
    This work is to improve the existing bidding strategy through the optimization
    techniques. Three different variations of genetic algorithm techniques are used
    to evolve the bidding strategies in order to search for the nearly optimal bidding
    solution. The three techniques are parameter tuning, deterministic dynamic adaptation,
    and self-adaptation. Each of this method will be detailed in Section 4, 5 and
    6. The remainder of the chapter is organized as follow. Section 2 discusses related
    work. The bidding strategy framework is discussed in Section 3. The parameter
    tuning experiment is discussed in Section 4. Section 5 and 6 discussed the deterministic
    adaptive experiment and self-adaptive experiment. A comparison between all the
    schemes is discussed in Section 7. Finally, the conclusion is discussed in Section
    8.


    # ## 2. Related work


    Genetic algorithm has shown to perform well in the complex system by which the
    old search algorithm has been solved. This is due to the nature of the algorithms
    that is able to discover optimal areas in a large search space with little prior
    information. Many researches in auctions have used genetic algorithm to design
    or enhance the auction''s bidding strategies. The following section discusses
    works related to evolving bidding strategies.


    An evolutionary approach was proposed by Babanov (2003) to study the interaction
    of strategic agents with the electronic marketplace. This work describes the agents''
    strategies based on different methodologies that employ incompatible rules in
    collecting information and reproduction. This work used the information collected
    from the evolutionary framework for economic studies as many researches have attempted
    to use evolutionary frameworks for economics studies (Nelson, 1995; Epstein &
    Axtell, 1996; Roth, 2002; Tesfation, 2002). This evolutionary approach allows
    the strategies to be heterogeneous rather than homogenous since only a particular
    evolutionary approach is applied. This work has shown that the heterogeneous strategies
    evolved from this framework can be used as a useful research data.


    ZIP, introduced by Cliff, is an artificial trading agent that uses simple machine
    learning to adapt and operate as buyers or sellers in online open-outcry auction
    market environments (Cliff, 1997). The market environments are similar to those
    used in Smith''s (Smith, 1962)'
