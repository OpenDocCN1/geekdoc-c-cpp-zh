    Fig. 2. Line recombination


    # 2.2 Mutation


    One problem that has been of concern in GAs is premature convergence, whereby
    a good but not optimal solution will come to dominate the population. In other
    words, the search may well converge to local optimum than the desired global one.
    This problem can be eliminated by adding a small vector of normally-distributed
    zero-mean random numbers (say with a standard deviation R) to each child before
    inserting it into the population. The magnitude of the standard deviation R of
    the vector is very critical, as small R might lead to premature converge and large
    R might impair the search and reduce its ability to converge optimally. Therefore,
    it''s better to use an adaptive approach whereby the rate of mutation is modified
    during the course of the search. We set R to the nominal rate R_nom. The population
    is divided into two halves X and Y. A mutation rate of 2R_nom is applied to X
    whereas a mutation of R_nom/2 is applied to Y. The mutation rate R_nom is adjusted
    depending on the population (X or Y) that is producing better and fitter solutions
    on average. If X individuals are fitter, then the mutation rate R_nom is increased
    slightly by say 10%. If Y is fitter then the mutation rate, R_nom is reduced by
    a similar amount.'
