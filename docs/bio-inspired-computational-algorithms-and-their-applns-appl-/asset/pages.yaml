  md: '# 3.4 Conclusion


    The ETNUD image enhancement algorithms provide high color accuracy and better
    balance between the luminance and contrast in images.


    # 4. Entropy-based image fusion with Continuous Genetic Algorithm


    # 4.1 Introduction


    Image fusion is defined as the process of combining information from two or more
    images of a scene to enhance the viewing or understanding of that scene. The images
    that are to be fused can come from different sensors, or have been acquired at
    different times, or from different locations. Hence, the first step in any image
    fusion process is the accurate registration of the image data. This is relatively
    straightforward if parameters such as the instantaneous field-of-view (IFOV),
    and locations and orientations from which the images are acquired are known, especially
    when the sensor modalities produce images that use the same coordinate space.
    This is more of a challenge when sensor modalities differ significantly and registration
    can only be accomplished at the information level. Hence, the goal of the fusion
    process is to preserve all relevant information in the component images and place
    it in the fused image (FI). This requires that the process minimize the noise
    and other artifacts in the FI. Because of this, the fusion process can be also
    regarded as an optimization problem [K. Kannan and S. Perumal, 2002]. In recent
    years, image fusion has been applied to a number of diverse areas such as remote
    sensing [T. A.Wilson, and S. K. Rogers,1997], medical imaging [C. S. Pattichis
    and M. S. Pattichis, 2001], and military applications [B. V. Dasarathy, 2002].


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_212_0.png)


    Fig. 2. Comparisons of Enhancement Techniques: (top-left) Original; (top-right)
    IRME; (middle-left) Gamma correction, g = 1.4; (middle-right) MSR; (bottom-left)
    AINDANE;(bottom-right) ETNUD.


    Image fusion can be divided into three processing levels: pixel, feature and decision.
    These methods increase in abstraction from pixel to feature to decision levels.
    In the pixel-level approach, simple arithmetic rules like average of individual
    pixel intensities or more sophisticated combination schemes are used to construct
    the fused image. At the feature-level, the image is classified into regions with
    known labels, and these labeled regions from different sensor modalities are used
    to combine the data. At the decision level, a combination of rules can be used
    to include part of the data or not.'
  merge: -1
  img_proc: true
- pgno: 213
  md: "Genetic algorithms (GA) are an optimization technique that seeks the optimum\
    \ solution of a function based on the Darwinian principles of biological evolution.\
    \ Even though there are several methods of performing and evaluating image fusion,\
    \ there are still many open questions. In this section, a new measure of image\
    \ fusion quality is provided and compared with many existing ones. The focus is\
    \ on pixel-level image fusion (PLIF) and a new image fusion technique that uses\
    \ GA is proposed.\n\nThe GA is used to optimize the parameters of the fusion process\
    \ to produce an FI that contains more information than either of the individual\
    \ images. The main purpose of this section is in finding the optimum weights that\
    \ are used to fuse images with the help of CGA. The techniques for GA and image\
    \ fusion are given in Section 4.2. Section 4.3 describes the evaluation criteria.\
    \ Section 4.4 describes the experimental results, and compares our results with\
    \ other image fusion techniques. In Section 4.5, conclusion is provided.\n\n#\
    \ 4.2 The techniques of GA and image fusion\n\n# 4.2.1 Genetic Algorithm\n\nAs\
    \ stated earlier, GA is a non-linear optimization technique that seeks the optimum\
    \ solution of a function via a non-exhaustive search among randomly generated\
    \ solutions. GAs use multiple search points instead of searching one point at\
    \ a time and attempt to find global, near-optimal solutions without getting stuck\
    \ at a local optima. Because of these significant advantages, GAs reduce the search\
    \ time and space. However, there are disadvantages of using GAs as well: they\
    \ are not generally suitable for real-time applications since the time to converge\
    \ to an optimal solution cannot be predicted. The convergence time depends on\
    \ the population size, and the GA crossover and mutation operators. In this fusion\
    \ process, a continuous genetic algorithm has been selected.\n\n# 4.2.2 Continuous\
    \ Genetic Algorithm (CGA)\n\nGAs typically operates on binary data. For many applications,\
    \ it is more convenient to work in the analog, or continuous, data space rather\
    \ than in the binary space of most GAs. Hence, CGA is used because they have the\
    \ advantage of requiring less storage and are faster than binary. CGA inputs are\
    \ represented by floating-point numbers over whatever range is deemed appropriate.\
    \ Figure 6 shows the flowchart of a simple CGA [Randy L. Haupt & Sue Ellen Haupt,\
    \ 2004]. The various elements in the flowchart are described below:\n\n+   i.\
    \ *Definition of the cost function and the variables:* The variable values are\
    \ represented as floating point numbers ($p_i$). In each chromosome, the basic\
    \ GA processing vector, there are number of value depending on the parameters\
    \ ($p_1,...,p_{var}$). Each chromosome has a cost determined by evaluating the\
    \ cost function [Randy L. Haupt & Sue Ellen Haupt, 2004].\n+   \n+    ii. *Initial\
    \ Population:* To begin the CGA process, an initial population must be defined.\
    \ A matrix represents the population, with each row being a $1\\times N_{var}$\
    \ chromosome of continuous values. The chromosomes are passed to the cost function\
    \ for evaluation [Randy L. Haupt & Sue Ellen Haupt, 2004]."
