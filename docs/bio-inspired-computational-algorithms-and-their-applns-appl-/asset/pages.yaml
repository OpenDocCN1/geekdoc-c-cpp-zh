    # 2.1.3 Floating search methods


    The methods explained suffer from the nesting effect, which means that once a
    feature (or variable) has been discarded it can''t be reconsidered again. Or,
    on the other hand, once a feature (or variable) was chosen, it can''t be discarded.
    To overcome these problems, a technique known as floating search method, was introduced
    by Pudil and others in 1994 [1], allowing the features to enter and leave the
    set of the k chosen features. There are two ways to implement this technique:
    one springs from the forward selection and the other from de backward selection
    rationale. A three steps procedure is used, namely inclusion, test, and exclusion.
    Details of the implementation can be found in [1], [16].


    # 2.1.4 Some trends in feature selection


    Recent work in feature selection are, for instance, the one of Somol et al., [17],
    where besides of optimally selecting a subset of features, the size of the subset
    is also optimally selected. Sun and others [18] faced the problem of feature selection
    in conditions of a huge number or irrelevant features, using machine learning
    and numerical analysis methods without making any assumptions about the underlying
    data distributions. In other works, the a feature selection technique is accompanied
    by instance selection; instance selection refers to the “orthogonal version of
    the problem of feature selection” [19], involving the discovery of a subset of
    instances that will provide the classifier with a better predictive accuracy than
    using the entire set of instances in each class.


    # 2.2 Optimal feature generation


    As can be seen from section 2.1, the class separability measuring criterion in
    feature selection is used just to measure the effectiveness of the k features
    chosen out of a total of K features, with independence of how the features were
    generated. The topic of optimal feature generation refers to involving the class
    separability criterion as an integral part of the feature generation process itself.
    The task can be expressed as: If x is an m-dimensional vector of measurement samples,
    transform it into another l-dimensional vector andso that some class separability
    criterion is optimized. Consider, to this end, the linear transformation y=A^T
    x.


    By now, it will suffice to note the difference between feature selection and feature
    generation.


