    # ### 5. Summary


    It is important for prediction and decision-making to find frequent items among
    huge data stream. This chapter presents an approach, namely NSWGA (Nested Sliding
    Window Genetic Algorithm), about mining frequent itemsets on data stream within
    the current window. NSWGA uses the parallelism of genetic algorithm to search
    for the frequent itemset of the latest data in the nested sub-window. The final
    frequent itemsets of the sliding window is obtained by the integrated treatment
    of this series of frequent itemsets in nested sub-window. NSWGA captures the latest
    frequent itemsets accurately and timely on data stream. At the same time the expired
    data is deleted periodically. As the use of nested windows and the parallel processing
    capability of genetic algorithm, this method reduced the time complexity.


    In this chapter, an algorithm about mining frequent patterns of data stream- NSWGA
    algorithm is proposed. The main contributions of this algorithm: (1) The parallelism
    of genetic algorithm is used to mine the frequent patterns of data stream , which
    reduces the runtime; (2) The algorithm combines the sliding window with genetic
    algorithm to propose an improved method to obtain initial population; (3) This
    algorithm guarantees the speed of implementation and query precision.


