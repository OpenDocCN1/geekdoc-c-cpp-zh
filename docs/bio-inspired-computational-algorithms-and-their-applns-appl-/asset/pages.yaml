    # ## 4.2 Parseval''s theorem and the Fourier Transform


    Parseval''s theorem states, in an elegant manner, that the energy of a discrete
    signal in the time domain can be calculated in the frequency domain by a simple
    relation [2], [3]:


    ```

    \[ \sum_{i=0}^{N-1} |x[i]|^2 = \frac{2}{N} \sum_{k=0}^{N-1} |X[k]|^2 \tag{32}
    \]

    ```


    where


    +   - N is the number of samples of the discrete signal,

    +   - x[i] is the i-th sample of the discrete signal,

    +   - X[k] is the k-th sample of the Fourier transform of x[i].


    For a discrete signal x[i], the Fourier transform can be computed using the well
    known Discrete Fourier Transform via the efficient algorithm for its implementation,
    the FFT [2], [3]:


    ```

    \[ X[k] = \sum_{n=0}^{N-1} x[n] e^{-j \frac{2\pi}{N} nk}, \quad k=0,1,\ldots,N-1
    \tag{33} \]

    ```


    The implication of the Parseval''s theorem is that an algorithm can search for
    specific energetic properties of a signal in the frequency domain off-line, and
    then use the information obtained off-line to configure a bank of digital filters
    to look for the same'
