    # 6. Conclusion


    In this chapter we did a summary outline of GAs and discussed some possible applications.
    We presented three extrinsic evolutionary designs of digital circuits at gate
    level using GAs.


    Future research must be done in this area. Firstly it is important to find a better
    representation of the circuit in chromosomes, because complex functions need a
    great number of architecture bits, which directly influences the GA search space.
    EHW successfully succeeds only when fitness reaches 100% and in huge search spaces
    this condition may be not always possible. This is the main reason that for the
    time being the'
