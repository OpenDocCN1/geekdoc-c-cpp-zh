- pgno: 54
  md: '# Performance of Simple Genetic Algorithm Inserting Forced Inheritance Mechanism
    and Parameters Relaxation


    Esther Lugo-González, Emmanuel A. Merchán-Cruz, Luis H. Hernández-Gómez, Rodolfo
    Ponce-Reynoso, Christopher R. Torres-San Miguel and Javier Ramírez-Gordillo


    *Instituto Politécnico Nacional Escuela Superior de Ingeniería Mecánica y Eléctrica*

    *M México*


    # 1. Introduction


    Genetic Algorithms (GA) are powerful tools to solve large scale design optimization
    problems. The research interests in GA lie in both its theory and application.
    On one hand, various modifications have been made to allow them to solve problems
    faster, more accurately and more reliably.


    Genetic Algorithms are a search paradigm that applies principles of evolutionary
    biology (crossover, mutation, natural selection) in order to deal with intractable
    search spaces. The power and success of GA are mostly achieved by the diversity
    with the individuals of a population which evolve, in parallel, following the
    principle of the survival of the fittest. In general, the genetic algorithms resolve
    combinatorial optimization problems that in (Goldberg, 1989) are mentioned, this
    implies a large number of responses associated with an exponential growth in solutions
    potentially feasible according to the magnitude of the problem. In a standard
    GA the diversity of the individuals is obtained and maintained using the genetic
    operators crossover and mutation which allow the GA to find feasible solutions
    and avoid premature convergence to a local maximum (Holland, 1975).


    The performance of a genetic algorithm, like any global optimization algorithm,
    depends on the mechanism for balancing the two conflicting objectives, which are
    exploiting the best solutions found so far and at the same time exploring the
    search space for promising solutions. The power of genetic algorithms comes from
    their ability to combine both exploration and exploitation in an optimal way (Holland,
    1975). However, although this optimal utilization may be theoretically true for
    a genetic algorithm, there are problems in practice. These arise because of Holland
    assumed that the population size is infinite, that the fitness function accurately
    reflects the suitability of a solution, and that the interactions between genes
    are very small (Beasley et al., 1993).


    The evolutionary algorithm proposed in this paper is composed by a classic genetic
    algorithms along with the forced inheritance mechanism proposed by (Merchán-Cruz,
    2005, Merchán-Cruz et al., 2008, Merchán-Cruz et al., 2007) and the regeneration
    mechanisms by'
  merge: -1
  img_proc: true
- pgno: 55
  md: '(Ramirez-Gordillo, 2010, Lugo Gonzalez, 2010), for optimizing the trajectory
    generation in closed chain mechanisms and planning the effects that it has on
    the mechanism by relaxing some parameters. The objective is to show the behavior
    of relaxing the parameters of the GA’s, observing what advantages and disadvantages
    appear when varying some parameter exceeding the recommended values established
    in the literature.


    # ## 2. Genetic Algorithm description


    Once the problem encoding and the fitness functions have been chosen, the evolution
    process begin. To evolve new solutions, an initial population of encoded solutions
    is created randomly or using some problem-specific knowledge. This population
    is subjected to genetic operators to create new promising solutions.


    A typical genetic algorithm starts with a randomly generated population composed
    by genes, locus, allele, chromosome, genotype, variables and phenotype (Holland,
    1975, Goldberg, 1989, Michalewicz, 1999, Coello-Coello, 2007), figure 1.


    ![](img/b6b7f8aebd1f88cc16a4011cc646fc4d_55_0.png)


    Fig. 1. Chromosome binary representation.


    Individuals are probabilistically selected by evaluating the objective function.
    This gene has converged when at least 95% of individuals in the population share
    the same value of that genes. The population converges when all the genes have
    converged.


    Different operators exist in GA’s, being the most popular (1) *selection*, (2)
    *crossover*, and (3) *mutation*, The steps to make a genetic algorithm, as defined
    in (Goldberg, 1989), are shown in the diagram of figure 2.


    *Initial Population* is created randomly and it is encoded within the chromosome
    of an array with variable length. The coding can be done in a binary representation
    (Goldberg, 1989), based on the domain of each variable (figure 3).


    In the *decodification* is necessary to have a representation of the genotype
    to assign the parameters within a chain of symbols known as genes. The *evaluation*
    uses the fitness function that reflect the value of the individual in terms of
    the real value of the variable in the problem’s domain, but in many optimization
    combinatorial cases, where a great amount of restrictions exists; there is a probability
    in which part of the points of the search space represents no valid individuals.
    For example, the equation for the synthesis of planar mechanisms are:


    F = (C_{sd}^{l}(v) - C_{ts}^{l}(v))^{2} + (C_{sd}^{l}(v) - C_{tg}^{l}(v))^{2}    (1)'
