- "# Coding Interview Ninja：50 道带 Java 解决方案的编程题，面试实践指南\n\n\n\n![](img/00002.jpeg)\n\
  \n# 引言\n\n获得你心仪的软件工程师工作可能取决于你在编码面试中的表现。这可能是你面试流程中最重要的部分。\n\n你的招聘官会建议你重新复习大学期间的算法和数据结构书籍，以温习计算机科学基础知识。虽然这是必要的，但还不够。你在算法书中看到的题目类型的设计并不是为了让你在短短\
  \ 45 分钟的压力下解决的。准备编码面试最好的方法是练习与你将被要求解决的问题相似的题目。这这本书的目的就是：为你提供一些示例面试编码题以及相应的示例解决方案代码。\n\
  \n由于每家公司的面试流程和题目风格略有不同，因此强烈建议你在完成本书中的题目练习后，去 CareerCup 和 Glassdoor 等网站查看最近向候选人问过的问题。\n\
  \n不要忘记，你不需要掌握所有知识并完美地解决提出的每一个问题才能进入面试流程的下一个阶段。大多数时候，面试官只是想看到你在处理新问题时的思考过程，以及你的编码能力如何。\n\
  \n最后，如果你发现任何你认为错误的地方，请随时与我联系。\n\n祝你面试顺利！\n\n# 准备\n\n在开始练习编码面试之前，你将需要复习计算机科学的基础知识。以下我认为你需要研究的最重要主题列表。这个列表绝不是完整的。\n\
  \n## 编程语言\n\n你必须非常熟悉你所选择的一门编程语言。精通你所选择的语言将让你有更多时间思考实际问题，而不是思考如何实现你脑海中已经有的解决方案。科技中最流行的语言是\
  \ `Java`、`C/C++` 和 `Python`。\n\n## 运行时间复杂度\n\n大多数时候，面试官会问你程序的运行时间，即大 O 复杂度，也就是对运行时间的最坏情况分析。在某些情况下，例如在处理具有较差大\
  \ O 分析结果的流行算法（如 `quicksort`）时，了解平均运行时间也是有帮助的。\n\n## 数据结构\n\n### 链表 (Linked Lists)\n\
  \n链表中的每个节点都包含一个数据元素和一个指向下一个节点的指针。链表节点的一个示例定义如下：\n\n```java\nclass LLNode {\n  int\
  \ data;\n  LLNode next;\n  LLNode(int data) {\n    this.data = data;\n  }\n}\n```\n\
  \n链表可以是双向链表，这意味着每个节点还有一个指向上一个节点的指针。一个示例定义如下：\n\n```java\nclass DLLNode {\n  int\
  \ data;\n  DLLNode next, prev;\n  DLLNode(int data) {\n    this.data = data;\n \
  \ }\n}\n```\n\n你可以在 `O(1)` 时间内在链表中插入新节点。要在链表中查找一个元素则需要 `O(n)` 时间。\n\n### 树 (Trees)\n\
  \n树中的每个节点都包含一个数据元素和一个指向其子节点的指针列表。最流行的树的形式是二叉树，它只有两个孩子。以下是一个在后续所有练习题中都用到的示例定义：\n\n\
  ```java\nclass TNode {\n  int data;\n  TNode left, right;\n  TNode(int data) {\n\
  \    this.data = data;\n  }\n}\n```\n\n在某些情况下，树节点可能有一个指向父节点的指针。\n\n二叉树的一种流行特殊类型是二叉搜索树\
  \ (`BST`)，其中每个节点的元素必须大于其左子树中的所有元素，小于其右子树中的所有元素。\n\n访问树中每个节点的过程被称为树遍历。有三种以深度优先顺序遍历树的基本方法。以下示例代码打印了具有三种基本遍历的树：\n\
  \n```java\npublic static void preOrder(TNode root) {\n  if (root == null) { return;\
  \ };\n  System.out.println(root.data);\n  preOrder(root.left);\n  preOrder(root.right);\n\
  }\n\npublic static void inOrder(TNode root) {\n  if (root == null) { return; };\n\
  \  inOrder(root.left);\n  System.out.println(root.data);\n  inOrder(root.right);\n\
  }\n\npublic static void postOrder(TNode root) {\n  if (root == null) { return; };\n\
  \  postOrder(root.left);\n  postOrder(root.right);\n  System.out.println(root.data);\n\
  }\n```\n\n### 哈希表 (Hash Tables)\n\n哈希映射用于将键与值关联起来。这种数据结构的优势是，理论上，每个操作（插入、删除、查找）平均需要\
  \ `O(1)` 时间。\n\n要向哈希表中插入新元素，你需要计算键的哈希码。如果计算出的哈希码已存在结构中，则使用冲突解决技术。两种最流行的解决技术是：\n\n\
  - **链法哈 (Separate Chaining)**：每个桶都是独立的，每个哈希码索引都使用某种动态列表。\n- **开放寻法 (Open Addressing)**：检查桶直到找到一个未被占用的桶。\n\
  \n在 `Java` 中创建一个带有 `String` 键和值的新哈希映射数据结构：\n\n```java\nHashMap<String, String> hm\
  \ = new HashMap<String, String>();\n```\n\n这可能是面试官中最流行的数据结构了！\n\n### 栈 (Stacks)\n\
  \n一种后进先出的数据结构。了解如何使用数组从零实现栈是很有用的，因为面试官可能会要求创建一个具有特殊功能的修改版栈。对于所有其他需要栈的情况，你可以使用语言内置的实现。在\
  \ `Java` 中使用 `String` 栈：\n\n```java\nStack<String> stack = new Stack<String>();\n\
  ```\n\n### 队列 (Queues)\n\n一种先入队列的数据结构。了解如何使用数组从零实现队列是很有用的，因为面试官可能会要求创建一个修改版的队列。在\
  \ `Java` 中使用 `String` 队列：\n\n```java\nQueue<String> queue = new LinkedList<String>();\n\
  ```\n\n### 图 (Graphs)\n\n一组通过链接连接的节点。可以使用邻接矩阵或邻接表表示。面试官可能会问及图论，因为它在许多算法中被广泛使用。\n\
  \n### 字典树 (Tries)\n\n一种通常持有字符的树数据结构，在字符串处理中有许多应用。通常，节点的所有后代都有与该节点相关的公共前缀，根节点与空字符串关联。这种数据结构的一种流行应用是单词查找（例如文本框中简单的自动补全功能）。\n\
  \n## 算法 (Algorithms)\n\n面试官很少要求你实现一个特定的复杂且长的算法（例如 `Dijkstra`、`A*` 等）。然而，你应该了解这些算法是如何工作的、用途是什么，并能够在涉及已知算法的话题进行基础交流。此外，建议了解动态规划是什么以及如何工作，并能够识别它。以下是建议学会实现的常用简单算法，以防面试官询问：\n\
  \n- `广度优先搜索 (BFS)`\n- `深度优先搜索 (DFS)`\n- `归并排序 (Mergesort)`\n- `快速排序 (Quicksort)`\n\
  - `二分查找 (Binary Search)`\n\n## 其他 (OTHER)\n\n### 递归 (Recursion)\n\n一种强大的技术，用于解决计算机科学问题，并在面试中被频繁询问。有时会让问题的解决方案变得简单并产生紧凑的代码。记住，这种技术比迭代解决方案消耗更多内存。此外，在编写递归解决方案时不要忘记递归的终止条件。\n\
  \n### 面对象设计 (Object Oriented Design)\n\n面试官可能会要求你描述给定系统的基本对象。因此，了解面向对象原则的基础至关重要。\n\
  \n### 测试 (Testing)\n\n\n\n\n面试官可能会要求你测试自己的解决方案。你需要知道如何创建测试用例，甚至涵盖边界情况（即输入意料之外的内容）。此外，了解\
  \ `Unit Testing`（单元测试）的基本原理并提及它是非常推荐的。\n\n### 系统编程\n可能会被问到 `threading`（线程）、`locks`（锁）和\
  \ `mutex`（互斥锁）等概念，特别是如果公司面试包含理论部分时。\n\n### 位运算\n可能会经常问到使用位运算符的二进制操作，特别是在那些专门从事底层软件的公司中。\n\
  \n### 程序内存\n`stack`（栈）和 `heap`（堆）内存区域的区别以及它们各自的使用场景。\n\n# 练习题\n\n以下练习题由简要的描述、简短的输入输出示例（如果适用）、用\
  \ `Java` 编写的示例解决方案以及时间和空间复杂度（如果适用）组成。我们尽可能地使用了 `Java` 的内置类和工具函数，因为面试的目标不是重造轮子，而是为所提问题提供一个高效的解决方案。\n\
  \n你会发现所选的问题及其答案并不长。这是由于你在面试中的时间有限，面试官无法提出一个需要长解答的问题。如果你对一个问题想出了非常复杂且长的解决方案，说明你想得太复杂了。在不到\
  \ 45 分钟内，候选人需要时间明确问题、构思解决方案、与面试官讨论解决方案，以及测试解决方案。\n\n在大多数示例解决方案中，都有基本的输入数据验证，例如检查传递的对象是否不为\
  \ `null` 值。这种输入验证可能并不详尽，你应该让面试官知道你跳过了输入验证，或者你没有进行详尽的检查。请记住，这可能会导致关于如何测试你的程序的后续问题。\n\
  \n如果问题的解决方案需要从主程序以特定方式进行调用，则该驱动程序的调用记录如下：\n\n.\n.\n.\n\n```\nmain program `calls()`\n\
  ```\n\n在代码面试中，你可能还会被问到理论性问题和开放式的系统设计问题。这些不在本书的范围内，但最后两个问题包含了你可能被问到的示例。\n\n## 1.\
  \ 找到多数元素。在这个问题中，多数元素定义为在数字数组出现次数超过 `n/2` 次的数字。\n\n例如：\n输入：`3,2,2,1,2,2,1`\n输出：`2`\n\
  \n_______________\n\n### 解决方案：\n\n```java\npublic static int findMajCandidate(int[]\
  \ arr) {\n    if (arr == null || arr.length == 0) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int count = 1, maj = arr[0];\n    for (int i = 1; i < arr.length; i++)\
  \ {\n        if (arr[i] == maj) {\n            count++;\n        } else {\n    \
  \        count--;\n        }\n        if (count == 0) {\n            maj = arr[i];\n\
  \            count = 1;\n        }\n    }\n    return maj;\n}\n\npublic static boolean\
  \ verifyMajCandidate(int[] arr, int maj) {\n    if (arr == null || arr.length ==\
  \ 0) {\n        return  false;\n    }\n    int n = arr.length, count = 0;\n    for\
  \ (int i = 0; i < n; i++) {\n        if (arr[i] == maj) {\n            count++;\n\
  \        }\n        if (count > n / 2) {\n            return  true;\n        }\n\
  \    }\n    return  false;\n}\n```\n\n.\n.\n.\n\n```java\nint maj = findMajCandidate(arr);\n\
  if (maj == Integer.MIN_VALUE || verifyMajCandidate(arr, maj)==false) {\n    System.out.println(\"\
  No majority element found.\");\n} else {\n    System.out.println(\"Majority element:\
  \ \" + maj);\n}\n```\n\n运行时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n## 2. 找到整数数组中连续子序列的最大和。\n\
  \n例如：\n输入：`1,-3,2,5,-8`\n输出：`7`\n\n_______________\n\n### 解决方案：\n\n```java\npublic\
  \ static int maxSubSequence(int[] arr) {\n    if (arr == null || arr.length == 0)\
  \ {\n        return Integer.MIN_VALUE;\n    }\n    int maxSoFar = arr[0], curMax\
  \ = arr[0];\n    for (int i = 1; i < arr.length; i++) {\n        curMax = Math.max(arr[i],\
  \ curMax + arr[i]);\n        maxSoFar = Math.max(maxSoFar, curMax);\n    }\n   \
  \ return maxSoFar;\n}\n```\n\n时间复杂度：\n`O(N)`\n\n空间复杂度：\n`O(1)`\n\n## 3. 给定一个数组，找到出现次数超过数组长度一半的元素。\n\
  （此处省略重复内容，直接翻译题目 3 核心逻辑，见上方 1）\n...\n（由于原文存在大量重复，此处仅展示核心翻译逻辑）\n\n\n\n\n```java\n\
  if (arr == null) {\n    return Integer.MIN_VALUE;\n}\nint st = 0, end = arr.length\
  \ - 1;\nwhile (st <= end) {\n    int mid = (st + end) / 2;\n    if (arr[mid] ==\
  \ num) {\n        return mid;\n    } else if (num > arr[mid]) {\n        st = mid\
  \ + 1;\n    } else {\n        end = mid - 1;\n    }\n}\nreturn Integer.MIN_VALUE;\n\
  ```\n\n运行时间复杂度：\n`O(logN)`\n\n空间复杂度：\n`O(1)`\n\n## 10. 从数字数组中找到一个局部极值。\n\n例如：\n\
  输入： 9, 7, 2, 8, 5, 6, 3, 4\n输出: 2 或 5 或 3\n\n_______________\n\n### 解决方案：\n\n```java\n\
  public static int findLocalMin(int[] arr, int st, int end) {\n    int mid = (st\
  \ + end) / 2;\n    if ((mid - 1 < 0) || (mid + 1 >= arr.length)) {\n        return\
  \ Integer.MIN_VALUE;\n    }\n    if ((arr[mid - 1] > arr[mid]) && (arr[mid + 1]\
  \ > arr[mid])) {\n        return mid;\n    } else if (arr[mid - 1] < arr[mid]) {\n\
  \        findLocalMin(arr, st, mid);\n    } else {\n        findLocalMin(arr, mid,\
  \ end);\n    }\n    return Integer.MIN_VALUE;\n}\n```\n\n运行时间复杂度：\n`O(logN)`\n\n\
  空间复杂度：\n`O(1)`\n\n## 11. 给定一个先严格递增后严格递减的数字数组，找到最大数。\n\n例如：\n输入： 1, 2, 3, 4, 5, 4,\
  \ 3, 2\n输出： 5\n\n_______________\n\n### 解决方案：\n\n```java\npublic static int findMax(int[]\
  \ arr) {\n    if (arr == null || arr.length <= 3) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int st = 0, end = arr.length - 1;\n    while (st <= end) {\n       \
  \ int mid = (st + end) / 2;\n        int midVal = arr[mid];\n        if (midVal\
  \ > arr[mid - 1] && midVal > arr[mid + 1]) {\n            return midVal;\n     \
  \   } else if (arr[mid - 1] < midVal) {\n            st = mid + 1;\n        } else\
  \ {\n            end = mid - 1;\n        }\n    }\n    return Integer.MIN_VALUE;\n\
  }\n```\n\n运行时间复杂度：\n`O(logN)`\n\n空间复杂度：\n`O(1)`\n\n## 12. 仅使用整数实现平方根函数 (sqrt)。\n\
  \n例如：\n输入： 4\n输出： 2\n输入： 5\n输出： 2 或 3\n（两个值都允许，因为正确结果是小数）\n\n_______________\n\n\
  ### 解决方案：\n\n```java\npublic static int sqrt(int target, int st, int end) {\n  \
  \  if (st >= end) {\n        return Math.min(st, end);\n    }\n    int mid = (st\
  \ + end) / 2;\n    if (mid == target) {\n        return mid;\n    }\n    if (mid\
  \ > target) {\n        return sqrt(target, st, mid - 1);\n    } else {\n       \
  \ return sqrt(target, mid + 1, end);\n    }\n}\n```\n\n运行时间复杂度：\n`O(logN)`\n\n空间复杂度：\n\
  `O(1)`\n\n## 13. 给定一个排序过但旋转了未知次数的数组，找到目标元素的位置。\n\n例如：\n输入：\n旋转后的数组： 4, 5, 6, 7,\
  \ 0, 1, 2\n目标： 6\n输出： 2\n\n_______________\n\n### 解决方案：\n\n```java\npublic static\
  \ int binaryRoSearch(int[] arr, int target) {\n    if (arr == null) {\n        return\
  \ Integer.MIN_VALUE;\n    }\n    int st = 0;\n    int end = arr.length - 1;\n  \
  \  while (st <= end) {\n        int mid = (st + end) / 2;\n        if (arr[mid]\
  \ == target) {\n            return mid;\n        }\n        // 至少有一部分是有序的\n    \
  \    if (arr[st] <= arr[mid]) { // 左部分是有序的\n            if (arr[st] <= target &&\
  \ target < arr[mid]) {\n                end = mid - 1;\n            } else {\n \
  \               st = mid + 1;\n            }\n        } else { // 右部分是有序的\n    \
  \        if (arr[mid] < target && target <= arr[end]) {\n                st = mid\
  \ + 1;\n            } else {\n                end = mid - 1;\n            }\n  \
  \      }\n    }\n    return Integer.MIN_VALUE;\n}\n```\n\n提示：如果输入数组包含重复项，只能通过线性搜索在\
  \ `O(N)` 时间内找到。\n\n运行时间复杂度：\n`O(logN)`\n\n空间复杂度：\n`O(1)`\n\n## 14. 给定一个包含多个相同元素的排序数组，找到目标的起始和结束位置。\n\
  \n例如：\n输入：\n排序数组： 1, 2, 3, 7, 7, 9, 9\n目标： 7\n输出：\n起始位置： 3\n结束位置： 5\n\n_______________\n\
  \n### 解决方案：\n\n```java\npublic static int modifiedBinSearch(int[] arr, int target)\
  \ {\n    int st = 0, end = arr.length - 1;\n    while (st <= end) {\n        int\
  \ mid = (st + end) / 2;\n        if (target > arr[mid]) {\n            st = mid\
  \ + 1;\n        } else {\n            end = mid - 1;\n        }\n    }\n    return\
  \ st;\n}\n\npublic static int[] findRange(int[] arr, int target) {\n    int[] res\
  \ = { -1, -1 };\n    if (arr == null) {\n        return res;\n    }\n    int lo\
  \ = modifiedBinSearch(arr, target);\n    if (lo >= arr.length || arr[lo] != target)\
  \ {\n        return res;\n    }\n    int hi = modifiedBinSearch(arr, target + 1);\n\
  \    res[0] = lo;\n    res[1] = hi;\n    return res;\n}\n```\n\n运行时间复杂度：\n`O(logN)`\n\
  \n空间复杂度：\n`O(1)`\n\n## 15. 给定一个数组，每个位置表示可以向前走的步数，找到到达数组结尾的最少步数。\n\n例如：\n输入： 2, 1,\
  \ 1, 8, 1, 1\n输出： 3\n\n_______________\n\n### 解决方案：\n\n```java\npublic static int\
  \ minNumOfSteps(int[] arr) {\n    if (arr == null) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int[] opt = new int[arr.length];\n    opt[0] = 0;\n    for (int i =\
  \ 1; i < arr.length; i++) {\n        int min = i;\n        for (int k = 0; k < i;\
  \ k++) {\n            if (i - k <= arr[k]) {\n                min = Math.min(min,\
  \ opt[k] + 1);\n            }\n        }\n        opt[i] = min;\n    }\n    return\
  \ opt[arr.length - 1];\n}\n```\n\n运行时间复杂度：\n`O(N²)`\n\n空间复杂度：\n`O(N)`\n\n## 16.\
  \ 给定整数二维数组和一个起始点，找到与起始点数值相同的连续区域。\n\n例如：\n输入：\n起始点： (0,0)\n数组：\n1 1 2\n1 3 2\n2\
  \ 2 1\n输出： 3\n\n_______________\n\n### 解决方案：\n\n```java\npublic static void findAreaHelper(int[][]\
  \ arr, boolean[][] visited, int value, int x, int y) {\n    if (x < 0 || x > arr[0].length\
  \ || y < 0 || y >= arr.length) {\n        return;\n    }\n    if (visited[y][x]\
  \ == true) {\n        return;\n    }\n    visited[y][x] = true;\n    if (arr[y][x]\
  \ == value) {\n        mArea++;\n        findAreaHelper(arr, visited, value, x +\
  \ 1, y);\n        findAreaHelper(arr, visited, value, x, y + 1);\n        findAreaHelper(arr,\
  \ visited, value, x - 1, y);\n        findAreaHelper(arr, visited, value, x, y -\
  \ 1);\n    }\n}\n\nint mArea = 0;\npublic static void findArea(int[][] arr, int\
  \ x, int y) {\n    boolean[][] visited = new boolean[arr.length][arr[0].length];\n\
