  \ 中删除一个节点。\n\n### SOLUTION:\n```java\npublic static TNode deleteNodeFromBST(TNode\
  \ root, int key) {\n    if (root == null) {\n        return null;\n    }\n    if\
  \ (key > root.data) {\n        root.right = deleteNodeFromBST(root.right, key);\n\
  \    } else if (key < root.data) {\n        root.left = deleteNodeFromBST(root.left,\
  \ key);\n    } else {\n        if (root.left == null) {\n            return root.right;\n\
  \        } else if (root.right == null) {\n            return root.left;\n     \
  \   }\n        TNode n = root.right;\n        while (n.left != null) {\n       \
  \     n = n.left;\n        }\n        root.data = n.data;\n        root.right =\
  \ deleteNodeFromBST(root.right, n.data);\n    }\n    return root;\n}\n```\n### RUNNING\
  \ TIME COMPLEXITY:\n- `O(N)`\n\n### SPACE COMPLEXITY:\n- `O(1)`\n\n## 26. 检查给定字符串是否括号匹配。\n\
