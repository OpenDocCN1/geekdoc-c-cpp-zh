  \n**空间复杂度：**\nO(N)\n\n## 41. 给定一个链表，在原地反转它，使用递归和迭代方法。\n\ne.g:\n输入：`3 -> 9 -> 6 ->\
  \ 2`\n输出：`2 -> 6 -> 9 -> 3`\n\n_______________\n\n**解决方案 - 递归：**\n```java\npublic\
  \ static LLNode revList(LLNode head, LLNode prev) {\n    if (head == null && prev\
  \ == null) {\n        return null;\n    }\n    LLNode next = head.next;\n    head.next\
  \ = prev;\n    if (next == null) {\n        return head;\n    } else {\n       \
  \ return revList(next, head);\n    }\n}\n```\n`head = revList(head, null);`\n\n\
  **解决方案 - 迭代：**\n```java\npublic static LLNode revList(LLNode head) {\n    if (head\
  \ == null) {\n        return null;\n    }\n    LLNode cur = head, prev = null;\n\
  \    while (cur != null) {\n        LLNode next = cur.next;\n        cur.next =\
  \ prev;\n        prev = cur;\n        cur = next;\n    }\n    return prev;\n}\n\
  ```\n\n 42. 实现一个模式匹配函数，其中：\n1. `.` 匹配任意字符。\n2. `*` 匹配前一个字符的零或多个实例。\n\ne.g:\n输入：\n\
  字符串：`abc`\n模式：`a*b.`\n输出：`true`\n输入：\n字符串：`bc`\n模式：`a*b.`\n输出：`true`\n\n_______________\n\
  \n**解决方案：**\n```java\npublic static boolean isMatch(char[] str, char[] pat, int\
  \ s, int p) {\n    if (s >= str.length) {\n        return (p >= pat.length);\n \
  \   }\n    // 当前字符是点或字母\n    if (p == pat.length - 1 || pat[p + 1] != '*') {\n \
  \       return (str[s] == pat[p] || pat[p] == '.')\n        && isMatch(str, pat,\
  \ s + 1, p + 1);\n    }\n    // 当前字符后面跟着星号，所以要么：\n    // 1. 忽略星号\n    // 2. 记住星号并检查相等性\n\
  \    return isMatch(str, pat, s, p + 2) ||\n    (isMatch(str, pat, s + 1, p) &&\
  \ str[s] == pat[p]);\n}\n```\n`boolean result = isMatch(str, pat, 0 ,0);`\n\n###\
  \ 43. 给定一个只包含 0、1 或 2 的数组，在不使用任何排序函数对其排序。\n\ne.g:\n输入：`0, 1, 1, 0, 2, 1`\n输出：`0,\
  \ 0, 1, 1, 1, 2`\n\n_______________\n\n**解决方案：**\n```java\npublic static void swap(int[]\
  \ arr, int x, int y) {\n    int temp = arr[x];\n    arr[x] = arr[y];\n    arr[y]\
  \ = temp;\n}\n\npublic static void sort012(int[] arr) {\n    if (arr == null) {\n\
  \        return;\n    }\n}\n```\n\n\n\n\n\n```java\nint st = 0, mid = 0, end = arr.length\
  \ - 1;\n\nwhile (mid <= end) {\n    switch (arr[mid]) {\n        case 0:\n     \
  \       swap(arr, st, mid);\n            st++;\n            mid++;\n           \
  \ break;\n        case 1:\n            mid++;\n            break;\n        case\
  \ 2:\n            swap(arr, mid, end);\n            end--;\n            break;\n\
  \    }\n}\n```\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(1)\n\n---\n\n## 44. 计算两个以字符数组形式给出的二进制数的和。以字符串返回。\n\
  \n例如：\n输入：\nnum 1: `001`\nnum2: `101`\n输出: `110`\n\n### 解决方案\n```java\npublic static\
  \ String addBinary(char[] num1, char[] num2) {\n    int p1 = num1.length - 1;\n\
  \    int p2 = num2.length - 1;\n    int carry = 0;\n    String res = \"\";\n   \
  \ while (p1 >= 0 || p2 >= 0 || carry != 0) {\n        int curSum = carry;\n    \
  \    curSum += (p1 >= 0) ? (num1[p1] - '0') : 0;\n        curSum += (p2 >= 0) ?\
  \ (num2[p2] - '0') : 0;\n        p1--;\n        p2--;\n        carry = (curSum >=\
  \ 2) ? 1 : 0;\n        int newDigit = curSum % 2;\n        res = newDigit + res;\n\
  \    }\n    return res;\n}\n```\n**运行时间复杂度：**\nO(N)\nN: `max(num1.length, num2.length)`\n\
  \n**空间复杂度：**\nO(1)\n\n---\n\n## 45. 在不使用任何内置函数的情况下反转整数。\n\n例如：\n输入： `123`\n输出： `321`\n\
  输入： `-123`\n输出： `-321`\n\n### 解决方案\n```java\npublic static int revInt(int x) {\n\
  \    boolean negative = false;\n    if (x < 0) {\n        x = x * -1;\n        negative\
  \ = true;\n    }\n    int res = 0;\n    while (x > 0) {\n        int LSB = x % 10;\n\
  \        x = x / 10;\n        res = res * 10 + LSB;\n    }\n    if (negative ==\
  \ true) {\n        res = res * -1;\n    }\n    return res;\n}\n```\n**运行时间复杂度：**\n\
  O(N)\nN: `x` 的数字位数\n\n**空间复杂度：**\nO(1)\n\n---\n\n## 46. 合并两个排序的链表。\n\n例如：\n输入：\n\
  list 1: `2 -> 4 -> 5`\nlist 2: `3 -> 7`\n输出： `2 -> 3 -> 4 -> 5 -> 7`\n\n### 解决方案\n\
  ```java\npublic static LLNode mergeLists(LLNode n1, LLNode n2) {\n    if (n1 ==\
  \ null) {\n        return n2;\n    }\n    if (n2 == null) {\n        return n1;\n\
  \    }\n    LLNode res;\n    if (n1.data <= n2.data) {\n        res = n1;\n    \
  \    n1.next = mergeLists(n1.next, n2);\n    } else {\n        res = n2;\n     \
  \   n2.next = mergeLists(n1, n2.next);\n    }\n    return res;\n}\n```\n**运行时间复杂度：**\n\
  O(N)\n\n**空间复杂度：**\nO(1)\n\n---\n\n## 47. 给定一个单词列表，每行打印可以使用相同字母创建的单词。\n\n例如：\n输入：\
  \ `abc, hello, cba`\n输出：\n`abc cba`\n`hello`\n\n### 解决方案\n```java\npublic static\
  \ void bucketAnagram(List<String> input) {\n    HashMap<String, List<String>> hm;\n\
  \    hm = new HashMap<String, List<String>>();\n    for (String word : input) {\n\
  \        char[] wordArr = word.toCharArray();\n        Arrays.sort(wordArr);\n \
  \       String key = new String(wordArr);\n        List<String> list;\n        if\
  \ (hm.containsKey(key) == false) {\n            list = new LinkedList<String>();\n\
  \        } else {\n            list = hm.get(key);\n        }\n        list.add(word);\n\
  \        hm.put(key, list);\n    }\n    for (Map.Entry<String, List<String>> entry\
  \ : hm.entrySet()) {\n        for (String word : entry.getValue()) {\n         \
  \   System.out.print(word + \" \");\n        }\n        System.out.println();\n\
  \    }\n}\n```\n**运行时间复杂度：**\nO(N*MlogM)\nN: 输入单词数\nM: 最大输入单词中的字符数\n\n**空间复杂度：**\n\
  O(NM)\n\n---\n\n## 48. 给定一个长度为 K 的整数数组，数组的最后一个元素为空，且所有其他值（从 1 到 k）都出现在数组中，找到缺失的数字。\n\
  \n例如：\n输入： `4, 5, 1, 3, _`\n输出： `2`\n\n### 解决方案\n```java\npublic static int missingNumber(int[]\
  \ arr) {\n    if (arr == null) {\n        return Integer.MIN_VALUE;\n    }\n   \
  \ int sumFrom1toK = arr.length;\n    int sumOfArray = 0;\n    for (int i = 0; i\
  \ < arr.length - 1; i++) {\n        sumOfArray += arr[i];\n        sumFrom1toK +=\
  \ i + 1;\n    }\n    return sumFrom1toK - sumOfArray;\n}\n```\n**信息：** 你也可以使用等差数列求和公式：`sumFrom1toK\
  \ = (k*(k+1))/2`。`K` 是输入数组的长度。\n\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(1)\n\n---\n\
  \n## 49. 给定一个二叉树，找到从根到叶节点的路径和。\n\n例如：\n输入：\n树：\n`5`\n`4 8`\n`1 3 6 2`\n目标和：`22`\n\
  输出：`5,4,3,2`\n\n### 解决方案\n```java\nclass Node {\n    int val;\n    Node left, right;\n\
  \    Node(int x) { val = x; }\n}\npublic static List<List<Integer>> pathSum(Node\
  \ root, int targetSum) {\n    List<List<Integer>> result = new ArrayList<>();\n\
  \    findPaths(root, targetSum, new ArrayList<>(), result);\n    return result;\n\
  }\n\nprivate static void findPaths(Node node, int targetSum, List<Integer> path,\
  \ List<List<Integer>> result) {\n    if (node == null) return;\n    path.add(node.val);\n\
  \    if (node.left == null && node.right == null && targetSum == node.val) {\n \
  \       result.add(new ArrayList<>(path));\n    } else {\n        findPaths(node.left,\
  \ targetSum - node.val, path, result);\n        findPaths(node.right, targetSum\
  \ - node.val, path, result);\n    }\n    path.remove(path.size() - 1);\n}\n```\n\
  **运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(N)\n\n---\n\n## 50. 给定一个二叉树，返回它的副本。\n\n例如：\n\
  输入：\n`1`\n`2 3`\n`4 5 6 7`\n输出：\n`1`\n`2 3`\n`4 5 6 7`（一个结构完全相同的树）\n\n### 解决方案\n\
  ```java\nclass Node {\n    int val;\n    Node left, right;\n    Node(int x) { val\
  \ = x; }\n}\npublic static Node copyTree(Node root) {\n    if (root == null) return\
  \ null;\n    Node newNode = new Node(root.val);\n    newNode.left = copyTree(root.left);\n\
  \    newNode.right = copyTree(root.right);\n    return newNode;\n}\n```\n**运行时间复杂度：**\n\
  O(N)\n\n**空间复杂度：**\nO(N)\n\n---\n\n## 51. 给定一个无向图，找到它的最短路径。\n\n例如：\n输入：\n`0-1, 0-2,\
  \ 1-3, 2-3, 2-4, 3-4`\n输出：`[0,2,4`\n\n### 解决方案\n```java\nclass Graph {\n    int\
  \ V;\n    Map<Integer, List<Integer>> adj;\n    Graph(int v) {\n        this.V =\
  \ v;\n        adj = new HashMap<>();\n        for (int i = 0; i < v; i++) adj.put(i,\
  \ new ArrayList<>());\n    }\n    void addEdge(int u, int v) {\n        adj.get(u).add(v);\n\
  \        adj.get(v).add(u);\n    }\n    public List<Integer> shortestPath(int start,\
  \ int end) {\n        Queue<List<Integer>> queue = new LinkedList<>();\n       \
  \ Set<Integer> visited = new HashSet<>();\n        queue.add(new ArrayList<>(Arrays.asList(start)));\n\
  \        visited.add(start);\n        while (!queue.isEmpty()) {\n            List<Integer>\
  \ path = queue.poll();\n            int node = path.get(path.size() - 1);\n    \
  \        if (node == end) return path;\n            for (int neighbor : adj.get(node))\
  \ {\n                if (!visited.contains(neighbor)) {\n                    visited.add(neighbor);\n\
  \                    List<Integer> newPath = new ArrayList<>(path);\n          \
  \          newPath.add(neighbor);\n                    queue.add(newPath);\n   \
  \             }\n            }\n        }\n        return null;\n    }\n}\n```\n\
  **运行时间复杂度：**\nO(V+E)\n\n**空间复杂度：**\nO(V)\n\n---\n\n以下是面试中常见的理论问题：\n\n- HashMap 是如何工作的？\n\
