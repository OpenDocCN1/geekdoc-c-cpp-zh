  \ 31. 给定一个整数数组代表某股票在每天的价格。如果你只允许在某一天买入并在另一天卖出，找到你可以获得的最大收益。\n\n**e.g:**\ninput:\
  \ `2, 1, 6, 5, 9` output: `8`\n\n### SOLUTION:\n```java\npublic static int maxRevenue(int[]\
  \ arr) {\n    if (arr == null || arr.length == 0) {\n        return Integer.MIN_VALUE;\n\
  \    }\n    int lowest = arr[0];\n    int maxRev = 0;\n    for (int i = 1; i < arr.length;\
