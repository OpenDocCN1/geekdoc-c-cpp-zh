  \n运行时间复杂度：\n`O(NlogN)`\n\n空间复杂度：\n`O(1)`\n\n## 20. 反转整数的位。\n\n例如：\n输入： 1011\n输出：\
  \ 1101\n\n_______________\n\n### 解决方案：\n\n```java\npublic static int swapBits(int\
  \ x, int i, int j) {\n    int lo = ((x >> i) & 1);\n    int hi = ((x >> j) & 1);\n\
  \    if ((lo ^ hi) == 1) {\n        x ^= ((1 << i) | (1 << j));\n    }\n    return\
  \ x;\n}\n```\n\n\n\n\n\n```java\npublic static int revBits(int x, int numOfBits)\
  \ {\n    for (int i = 0; i < numOfBits; i++) {\n        x = swapBits(x, i, numOfBits\
  \ - i - 1);\n    }\n    return x;\n}\n```\n\n### INFO:\n- `XOR` (`^`) 与 `1` 操作将反转位的值。\n\
  - `XOR` (`^`) 与两个位操作，如果它们不同则返回 `1`。\n\n### RUNNING TIME COMPLEXITY:\n- `O(N)`\n\n\
  ### SPACE COMPLEXITY:\n- `O(1)`\n\n## 21. 在无序数组中就地找到第 k 大整数。\n\n**e.g:**\ninput:\n\
  - `array`: `5, 8, 3, 1`\n- `k`: `2`\noutput: `3`\n\n### SOLUTION:\n```java\npublic\
  \ static void swap(int[] arr, int x, int y) {\n    int temp = arr[x];\n    arr[x]\
  \ = arr[y];\n    arr[y] = temp;\n}\n\npublic static int partition(int[] arr, int\
  \ first, int last) {\n    int pivot = first;\n    swap(arr, last, pivot);\n    for\
  \ (int i = first; i < last; i++) {\n        if (arr[i] > last) {\n            swap(arr,\
  \ i, first);\n            first++;\n        }\n    }\n    swap(arr, first, last);\n\
  \    return first;\n}\n\npublic static int quickselect(int[] arr, int first, int\
  \ last, int k) {\n    if (first > last)\n        return Integer.MIN_VALUE;\n   \
  \ int pivot = partition(arr, first, last);\n    if (pivot == k) {\n        return\
  \ arr[pivot];\n    }\n    if (pivot > k) {\n        return quickselect(arr, first,\
  \ pivot - 1, k);\n    } else {\n        return quickselect(arr, pivot + 1, last,\
  \ k);\n    }\n}\n```\n\n### INFO:\n如果你能更明智地选择 `pivot`，例如选择每 `5` 个一组集合的中位数，你可以避免\
