  \n例如：\n输入： 2³\n输出： 8\n\n_______________\n\n### 解决方案：\n\n```java\npublic static long\
  \ pow(int a, int b) {\n    long[] M = new long[b + 1];\n    M[0] = 1;\n    M[1]\
