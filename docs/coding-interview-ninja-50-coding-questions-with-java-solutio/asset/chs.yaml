  \ {\n        return Integer.MIN_VALUE;\n    }\n    int element = arr[0];\n    int\
  \ count = 1;\n    int maxElement = arr[0];\n    int maxCount = 1;\n    for (int\
  \ i = 1; i < arr.length; i++) {\n        if (arr[i] == element) {\n            count++;\n\
  \        } else {\n            count = 1;\n            element = arr[i];\n     \
  \   }\n        if (count > maxCount) {\n            maxCount = count;\n        \
  \    maxElement = element;\n        }\n    }\n    return maxElement;\n}\n```\n**运行时间复杂度：**\n\
  O(N)\n\n**空间复杂度：**\nO(1)\n\n## 39. 打印二叉树的垂直层序。\n\ne.g:\n输入：\n树：\n5\n9 7\n输出：\n9\n\
  5\n7\n\n**解决方案：**\n```java\npublic static void makeVerticalOrder(TNode root, int\
  \ hd, HashMap<Integer, List<Integer>> hm, int[] minMax) {\n    if (root == null)\
  \ {\n        return;\n    }\n    minMax[0] = Math.min(minMax[0], hd);\n    minMax[1]\
  \ = Math.max(minMax[1], hd);\n    List<Integer> curHd;\n    if (hm.containsKey(hd))\
  \ {\n        curHd = hm.get(hd);\n    } else {\n        curHd = new LinkedList<Integer>();\n\
  \    }\n    curHd.add(root.data);\n    hm.put(hd, curHd);\n    makeVerticalOrder(root.left,\
  \ hd - 1, hm, minMax);\n    makeVerticalOrder(root.right, hd + 1, hm, minMax);\n\
  }\n```\n`HashMap<Integer, List<Integer>> hm = new HashMap<Integer, List<Integer>>();`\n\
  `int[] minMax = new int[2];`\n`makeVerticalOrder(root, 0, hm, minMax);`\n`for (int\
  \ lvl = minMax[0]; lvl <= minMax[1]; lvl++) {\n    List<Integer> curHd = hm.get(lvl);\n\
  \    for (Integer node : curHd) {\n        System.out.print(node + \" \");\n   \
  \ }\n    System.out.println();\n}\n```\n**运行时间复杂度：**\nO(N)\n\n**空间复杂度：**\nO(N)\n\
  \n### 40. 打印二叉树的层序（即打印每一层节点）。\n\ne.g:\n输入：\n树：\n5\n9 7\n输出：\n5\n9 7\n\n_______________\n\
  \n**解决方案：**\n```java\npublic static void printLevelOrder(TNode root) {\n    if (root\
