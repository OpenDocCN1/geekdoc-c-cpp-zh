  \ Math.min(lowest, arr[i]);\n    }\n    return maxRev;\n}\n```\n### RUNNING TIME\
  \ COMPLEXITY:\n- `O(N)`\n\n### SPACE COMPLEXITY:\n- `O(1)`\n\n## 32. 从双向链表中删除整数的单次。\n\
  \n**e.g:**\ninput:\n`list`: `2 -> 5 -> 8 -> 9`\n`val`: `5`\noutput: `2 -> 8 -> 9`\n\
  \n### SOLUTION:\n```java\nclass DLLNode {\n    int  data;\n}\n```\n\n\n\n\n\n```java\n\
  class DLLNode {\n    int data;\n    DLLNode next, prev;\n}\n\npublic static DLLNode\
  \ removeNode(DDLNode head, int x) {\n    if (head == null) {\n        return null;\n\
  \    }\n    if (head.data == x) {\n        head.next.previous = null;\n        return\
  \ head.next;\n    }\n    DDLNode runner = head;\n    while (runner.next != null)\
  \ {\n        if (runner.next.data == x) {\n            runner.next = runner.next.next;\n\
  \            runner.next.previous = runner;\n            break;\n        }\n   \
  \     runner = runner.next;\n    }\n    return head;\n}\n```\n**运行时间复杂度：**\nO(N)\n\
  \n**空间复杂度：**\nO(1)\n\n## 33. 给定双向链表，在原地反转它。\n\ne.g:\n输入：`2 -> 5 -> 8 -> 9`\n输出：`9\
