    \        std::cout << \"Result: \" << result << std::endl;\n    } catch (const\
    \ std::exception& e) {\n        std::cerr << \"Exception caught: \" << e.what()\
    \ << std::endl;\n    }\n\n    return 0;\n}\n```\n```\n\n# Exception Handling in\
