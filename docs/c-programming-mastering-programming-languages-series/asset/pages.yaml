    \    delete dynamicInt;\n\n    return 0;\n}\n```\n```\n\nIn this example, dynamicInt\
    \ is dynamically allocated using new and then deallocated using delete. Proper\
    \ allocation is crucial to avoid memory leaks and ensure efficient use of system\
    \ resources.\n\n# Memory Leaks: Consequences and Prevention\n\nA memory leak occurs\
    \ when dynamically allocated memory is not deallocated, leading to a gradual depletion\
    \ of available memory. Over time, this can result in degraded performance or program\
    \ failure. Developers must be vigilant in tracking memory allocations and corresponding\
    \ deallocations to prevent memory leaks.\n\n```\n```cpp\n#include <iostream>\n\
    \nvoid createMemoryLeak() {\n    // Creating a memory leak by not deallocating\
    \ memory\n```\n```"
