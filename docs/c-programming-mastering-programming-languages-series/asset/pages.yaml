  md: "handles the exception. In this case, an attempt to divide by zero triggers\
    \ an exception, which is caught and processed, preventing the program from crashing\
    \ and allowing for graceful error recovery.\n\n```\n```cpp\n// Example: Custom\
    \ Exception Class\n#include <iostream>\n#include <stdexcept>\n\nclass CustomException\
    \ : public std::runtime_error {\npublic:\n    CustomException(const std::string&\
    \ message) : std::runtime_error(message) {}\n};\n\nint main() {\n    try {\n \
    \       throw CustomException(\"Custom exception message\");\n    } catch (const\
