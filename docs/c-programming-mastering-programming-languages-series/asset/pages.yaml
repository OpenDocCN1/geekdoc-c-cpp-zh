  md: '```

    ```cpp

    #include <memory>


    std::unique_ptr<int> uniquePointer = std::make_unique<int>(42);

    std::shared_ptr<int> sharedPointer = std::make_shared<int>(42);

    ```

    ```


    In this example, a std::unique_ptr and a std::shared_ptr are created, both pointing
    to dynamically allocated integers. The use of std::make_unique and std::make_shared
    ensures safer memory allocation and ownership.


    # Unique Pointers for Exclusive Ownership


    std::unique_ptr is a smart pointer designed for exclusive ownership of dynamically
    allocated objects. When a std::unique_ptr goes out of scope or is explicitly reset,
    it automatically deallocates the associated memory.


    ```

    ```cpp

    std::unique_ptr<int> uniquePointer = std::make_unique<int>(42);


    // No need for explicit delete, memory is automatically deallocated when uniquePointer

    // goes out of scope

    ```

    ```


    The unique ownership model of std::unique_ptr ensures that there is only one owner
    for the dynamically allocated object, minimizing the risk of memory leaks.


    # Shared Pointers for Shared Ownership


    std::shared_ptr enables shared ownership of dynamically allocated objects. Multiple
    std::shared_ptr instances can share ownership of the same object, and the memory
    is deallocated only when the last std::shared_ptr pointing to it is destroyed.


    ```

    ```cpp

    std::shared_ptr<int> sharedPointer1 = std::make_shared<int>(42);

    std::shared_ptr<int> sharedPointer2 = sharedPointer1;


    // Memory is deallocated when both sharedPointer1 and sharedPointer2 are out of

    // scope

    ```

    ```


    The shared ownership model of std::shared_ptr allows for collaborative memory
    management, reducing the risk of memory leaks in scenarios involving shared resources.


    # Preventing Memory Leaks with Smart Pointers'
