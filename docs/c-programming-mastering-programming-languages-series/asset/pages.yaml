  md: "# # Public, Private, and Protected Access Specifiers\n\nAccess control is a\
    \ fundamental aspect of object-oriented programming that governs the visibility\
    \ and accessibility of class members. C++ provides three access specifiers—public,\
    \ private, and protected—to define the scope of members within a class. This section\
    \ explores the significance of these access specifiers and their impact on encapsulation,\
    \ data hiding, and inheritance.\n\n# ## Public Access Specifier: Interface to\
    \ the World\n\nThe public access specifier in C++ allows class members to be accessed\
    \ from outside the class. Members declared as public form the interface through\
    \ which external code can interact with objects of the class. Consider the following\
    \ example:\n\n```\n    #include <iostream>\n\n    // Class with public access\
    \ specifier\n    class Circle {\n    public:\n        // Public data member\n\
    \        double radius;\n\n        // Public member function\n        double calculateArea()\
    \ const {\n            return 3.14 * radius * radius;\n        }\n    };\n\n \
    \   int main() {\n        // Creating an object of the Circle class\n        Circle\
    \ myCircle;\n        myCircle.radius = 5.0;\n\n        // Accessing public members\
    \ from external code\n        double area = myCircle.calculateArea();\n      \
    \  std::cout << \"Area of the circle: \" << area << std::endl;\n\n        return\
    \ 0;\n    }\n```\n\nIn this example, the Circle class has a public data member\
    \ radius and a public member function calculateArea(). External code can access\
    \ and manipulate these members directly.\n\n# ## Private Access Specifier: Restricted\
    \ to the Class"
