  md: "# When to Use Friend Functions\n\nWhile friend functions provide a way to extend\
    \ access beyond traditional boundaries, their use should be approached with caution.\
    \ Overuse of friend functions can compromise encapsulation and lead to less maintainable\
    \ code. Friend functions are best employed in scenarios where external functions\
    \ need intimate access to the internals of a class, such as for optimization or\
    \ compatibility reasons.\n\n```\n```cpp\n#include <iostream>\n\n// Forward declaration\
    \ of the class\nclass Distance;\n\n// Friend function declaration\nvoid addDistances(const\
    \ Distance& dist1, const Distance& dist2);\n\n// Class definition\nclass Distance\
