  md: "Friend functions are declared with the friend keyword within the class declaration.\
    \ Unlike member functions, friend functions are not bound to a specific instance\
    \ of the class and can access private and protected members without violating\
    \ encapsulation. This allows external functions to work closely with the internals\
    \ of a class, offering a degree of flexibility while maintaining the principles\
    \ of data hiding.\n\n```\n```cpp\n#include <iostream>\n\n// Forward declaration\
    \ of the class\nclass MyClass;\n\n// Friend function declaration\nvoid displayValue(const\
    \ MyClass& obj);\n\n// Class definition\nclass MyClass {\nprivate:\n    int privateValue;\n\
    \npublic:\n    // Constructor to initialize private data member\n    MyClass(int\
    \ val) : privateValue(val) {}\n\n    // Friend function definition\n    friend\
    \ void displayValue(const MyClass& obj);\n};\n\n// Friend function implementation\n\
    void displayValue(const MyClass& obj) {\n    // Accessing private data member\
    \ using the friend function\n    std::cout << \"Private value: \" << obj.privateValue\
    \ << std::endl;\n}\n\nint main() {\n    // Creating an object of the class\n \
    \   MyClass myObject(42);\n\n    // Invoking the friend function to display private\
    \ data\n    displayValue(myObject);\n\n    return 0;\n}\n```\n```\n\nIn this example,\
    \ the displayValue function is declared as a friend of the MyClass class, enabling\
    \ it to access the private data member privateValue directly."
