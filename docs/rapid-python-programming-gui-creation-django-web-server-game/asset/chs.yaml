  'Repr' 仅仅显示对象的打印打印表示。例如：\n\n### rep.py\n\n```python\ni=[]\n\ni.append('blah')\n\n\
  print repr(i)\n```\n\n如果你在编码过程中简单忘记了变量可能是什么，并且需要返回对象的打印表示，这很有用。如果定义了 `__repr__`，你可以控制其级别。\n\
  \n### 7.1.7 switch or case\n\nPython 没有像许多其他编程语言那样的 `switch` 语句（称为 case 语句）。搜索引擎的博客会揭示这一点。它并不是为这种需求而设计的。恰当使用的\
  \ `if/else` 语句的优雅性提供了额外的测试以及等性检查和默认响应。使用字典没有这些功能，你可能会发现自己抛出异常的次数更多。这是一个可以激发你创造性代码的选择，激励你努力改进。下面是一个典型的\
  \ 'C' 语句如下：请勿输入下方的示例代码。\n\n```c\nswitch(num){\ncase val1: /* code for val1 */\n\
  break;\ncase val2: /* code for val2 */\nbreak;\ndefault: /* default code nothing\
  \ chosen */\nbreak;\n}\n```\n\n这是一个在 bash 中的实用示例，如果你没有安装 'C' 或没有 'C' 知识，可以测试它。\n\
  \n```bash\nfunction case1(){\necho \"print case1 statement\"\n}\n\nfunction case2(){\n\
  echo \"print case2 statement\"\n}\n\nfunction case3(){\necho \"print case3 statement\"\
  \n}\n\nfunction case4(){\necho \"print case4 statement\"\n}\necho \"1) case1\"\n\
  echo \"2) case2\"\necho \"3) case3\"\necho \"3) case4\"\necho -e \"enter number\
  \ 1-4: \"\nread blah\ncase $blah in\n1) case1\n;;\n2) case2\n;;\n3) case3\n;;\n\
  4) case4\nesac\n```\n\n这是一个使用字典创建的 case 或 switch 语句示例：\n\n### case.py\n\n```python\n\
  print \"0: exit\"\nprint \"1: sqr 4\"\nprint \"2: list 1-10\"\nprint \"3: print\
  \ even list 1-10\"\ndata=int(raw_input(\"Enter 0-3: \"))\nx=4\ndef exit():\nprint\
  \ \"you exited\"\ndef sqr():\nprint x*x\ndef list():\nfor x in range(1,7) if x %2\
  \ == 0:\n    print x\n```\n\n\n\n\n\n### 1 个泳池，x 个房间，15 个人\n\n```python\nclass complex:\n\
  \    def __init__(self, unit, parking, pool, rooms, people):\n        self.unit=unit\n\
  \        self.parking=parking\n        self.pool=pool\n        self.rooms=rooms\n\
  \        self.people=people\n\nmyCo=complex(10,8,1,20,15)\n# #myCo.unit=10\n# #myCo.parking=8\n\
  # #myCo.pool=1\n# #myCo.rooms=20\n# #myCo.people=15\n\n### 注释掉接两个代码块\ncapacity=float(myCo.people)/myCo.rooms\n\
  uncovered=100-(float(myCo.parking)/myCo.people*100)\nmyCo.rooms=10*2\nfreerooms=myCo.rooms-myCo.people\n\
  \nprint \"The complex is at %g capacity\" % capacity\nprint \"There are %g percent\
  \ people with uncovered parking\" % uncovered\nprint \"We have %g rooms\" % myCo.rooms\n\
  print \"We have %g free rooms left\" % freerooms\n```\n\n## 7.2.3 最后部分的转换\n\n请注意，在工作过程中，你正在注释掉大块需要转换的代码。接下来，创建一个方法来计算你的值，并创建一个方法来打印你的值。然后将每个变量重命名为\
  \ `self.name` 符号，并初始化 `calc` 方法和 `print` 方法。\n\n```python\n### apartment3.py\n\n\
  ### 需要的信息：10 个单元，每个 2 卧室，\n### 8 个室内停车位\n### 1 个泳池，x 个房间，15 个人\n\nclass complex:\n\
