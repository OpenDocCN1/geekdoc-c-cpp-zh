  \ `admin` 工具。\n\n### 13.1.11 注册\n\n这是一个如何创建注册模型、表单和视图的快速示例。你可以利用此示例创建任何你需要的表单，甚至是一个投票。\n\
  \n运行以下命令：`python manage.py startapp reg`\n\n`models.py`\n\n```python\nclass Comment(models.Model):\n\
  \    created = models.DateTimeField(auto_add=True)\n    author = models.CharField(max_length=60)\n\
  \    body = models.TextField()\n    post = models.ForeignKey(Post)\n\n    def __unicode__(self):\n\
  \        return \"%s: %s\" % (self.post, self.body[:60])\n```\n\n同样运行以下操作：\n\n```bash\n\
  python manage.py makemigrations\npython manage.py migrate\n```\n\n视图也需要修改以适应 `Comment()`\
  \ 模型的更改。在 `views.py` 中，在 `post()` 方法下方：\n\n```python\nfrom django.shortcuts import\
  \ render, render_to_response, redirect\nfrom django.urls import reverse\nfrom forms\
  \ import ModelForm\n\nclass CommentForm(ModelForm):\n    class Meta:\n        model\
  \ = Comment\n        exclude = [\"post\"]\n\ndef newreg(request):\n    # 使用下行查看表单前的语句\n\
  \    if request.method == \"POST\":\n        form = CommentForm(request.POST)\n\
  \        if form.is_valid():\n            post = form.save(commit=False)\n     \
  \       #post.author = request.user\n            #use date libs\n            post.date=\
  \ \"2015-05-18\"\n            post.save()\n            #return redirect('blog.views.post',\
  \ pk=post.pk)\n            return render_to_response(\"thanks.html\")\n    else:\n\
  \        form = CommentForm()\n        return render(request,'reg.html', {'form':form})\n\
  ```\n\n`#root urls.py`\n\n```python\nimport signup.views\n```\n\n\n\n\n\n```python\n\
  url(r'^signup/',signup.views.Signup),\n```\n\n# models.py\n\n```python\nfrom django.contrib.auth.models\
  \ import User\nfrom django.db.models.signals import post_save\nfrom django.dispatch\
  \ import receiver\n\nclass Profile(models.Model):\n    user = models.OneToOneField(User,\
  \ on_delete=models.CASCADE)\n    fullnameandaddress = models.TextField(max_length=500,\
  \ blank=True)\n    location = models.CharField(max_length=30, blank=True)\n    birthdate\
  \ = models.DateField(null=True, blank=True)\n\n@receiver(post_save, sender=User)\n\
  def update_user_profile(sender, instance, created, **kwargs):\n    if created:\n\
  \        Profile.objects.create(user=instance)\n        instance.profile.save()\n\
  ```\n\n创建模型后，请运行以下命令：\n\n```bash\npython manage.py makemigrations\npython manage.py\
  \ migrate\n```\n\n# forms.py\n\n```python\nfrom django import forms\nfrom django.contrib.auth.forms\
  \ import UserCreationForm\nfrom django.contrib.auth.models import User\n\nclass\
  \ SignUpForm(UserCreationForm):\n    birthdate = forms.DateField(help_text='必填。格式:\
  \ YYYY-MM-DD')\n    class Meta:\n        model = User\n        fields = ('username',\
  \ 'birthdate', 'password1', 'password2', )\n```\n\n# views.py\n\n```python\nfrom\
  \ django.contrib.auth import login, authenticate\nfrom django.shortcuts import render,\
  \ redirect\nfrom signup.forms import SignUpForm\n\ndef Signup(request):\n    if\
  \ request.method == 'POST':\n        form = SignUpForm(request.POST)\n        if\
  \ form.is_valid():\n            user = form.save()\n            user.refresh_from_db()\
  \ # 加载配置\n            user.profile.birthdate = form.cleaned_data.get('birth_date')\n\
  \            user.save()\n            raw_password = form.cleaned_data.get('password1')\n\
  \            user = authenticate(username=user.username, password=raw_password)\n\
  \            login(request, user) \n            return redirect('/')\n    else:\n\
  \        form = SignUpForm()\n    return render(request, 'signup.html', {'form':\
  \ form})\n```\n\n# signup.html\n\n```html\n{% extends 'base.html' %}\n{% block content\
  \ %}\n<h2>注册</h2>\n<form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p\
  \ }}\n    <button type=\"submit\">注册</button>\n</form>\n{% endblock %}\n```\n\n\
  # admin.py\n\n```python\nfrom signup.models import Profile\nfrom django.contrib.auth.admin\
  \ import UserAdmin\nfrom django.contrib.auth.models import User\n\nclass ProfInline(admin.StackedInline):\n\
  \    model=Profile\n\nclass ProfAdmin(admin.ModelAdmin):\n    inlines = (ProfInline,)\n\
  \nadmin.site.unregister(User)\nadmin.site.register(User,ProfAdmin)\n```\n\n上面的示例是一种添加模型、表单和视图的非常简化的方法，它通过添加配置模型来扩展了\
  \ `User` 库。`admin.py` 将利用 `inline` 方法将该模型组合在 `Users` 的管理界面中。\n\n访问你的网站：`http://localhost:8000/admin`\n\
  \n选择用户。`'Profile'` 模型现在可见了，并带有该用户的额外数据。\n\n## 13.1.13 练习\n\n1. 让博客运行起来。\n2. 模板样式调整。\n\
