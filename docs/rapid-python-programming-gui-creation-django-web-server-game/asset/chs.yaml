  aI2\naI3\natp2\n.\n```\n\n## 4.1.8 Python with Statement\n\n使用 `with` 语句通过避免需要 `try/finally`\
  \ 代码块来减少文件流的异常处理。根据 Python 文档，`with` 语句明确了以前由 `try...finally` 块的代码，以确保执行清理代码。语法如下：\n\
  \n`with expression [as variable]: with-block`\n\n表达式会被求值，并且它应该返回一个支持上下文管理协议 `__enter__()`\
  \ 和 `__exit__()` 方法的对象。\n\n让我们向文件写入数据：\n\n```python\nwith open('output.txt', 'w')\
  \ as f:\n    f.write(\"Usual Hello World!\")\n```\n\n上面的 `with` 语句会在嵌套代码块后自动关闭文件。\n\
  \n### 4.1.8.1 文件处理模式\n\n表 0.1：文件模式\n\n| 模式 | 描述 |\n| :--- | :--- |\n| r | 仅读打开文件\
  \ |\n| rb | 仅以二进制格式读取文件 |\n| r+ | 同时读写打开文件 |\n| rb+ | 以读写模式打开二进制文件 |\n| w | 仅写打开文件\
  \ |\n| wb | 仅以二进制格式写文件 |\n| a | 以追加模式打开文件 |\n| ab | 以二进制格式追加打开文件 |\n| a+ | 以追加和读取模式打开文件\
  \ |\n| ab+ | 以二进制格式以追加和读取模式打开文件 |\n\n### 4.1.8.2 文件属性\n\n表 0.3：文件属性\n\n| 属性 | 描述\
  \ |\n| :--- | :--- |\n| file.closed | 如果已关闭返回 true |\n| file.mode | 返回已打开文件的访问模式\
  \ |\n| file.name | 返回文件名 |\n| file.softspace | 如果 print 显式需要空间则返回 false，否则返回 true。\
  \ |\n\n下方的示例：\n\n```python\n#!/usr/bin/python\n\n#filetest.py\n\nf = open(\"dat.txt\"\
  , \"wb\")\nprint \"Name the file: \", f.name\nprint \"Closed or open: \", f.closed\n\
  print \"mode: \", f.mode\nprint \"Softspace: \", f.softspace\n```\n\n另外注意，运行此脚本不需要\
  \ `dat.txt`。\n\n结果：\nName the file: dat.txt\nClosed or open: False\nmode: wb\nSoftspace:\
  \ 0\n\n## 4.1.9 深度二进制操作\n\nPython 在处理二进制文件时有一个局限性。你可以处理的最小单位是字节。在处理数据流时，这证明是具有挑战性的。处理二进制超本书的范畴，并且需要坚实的计算机软件基础。\n\
  \n但你可以使用位运算符来评估一个值是否为 True 或 False。例如：\n\n```python\n>>> x=3\n>>> x&1!=0\nTrue\n\
  >>> x&2!=0\nTrue\n>>> x&3!=0\nTrue\n>>> x&4!=0\nFalse\n```\n\n### 4.1.9.1 位字符串操作\n\
  \n此示例使用基 2 将字符串转换为二进制\n\n```python\n>>> print int('001101',2)\n13\n>>> print int('0000011001',2)\n\
  25\n>>> print \"0x%x\" % int('0011001',2)\n0x25\n```\n\n请注意你不需要使用 8 位。我上面的示例是 7\
  \ 位。然而，它花费了 7 位。\n\n\n\n\npython 带来丰厚的回报\npython 将让你自由\n我将编写一个 python 脚本\npython\
  \ 将是我的未来\n我所有的程序将用 python 替换\n只有 python\npython python\n\n# 5 异常\n\n## 5.1 异常\n\n\
  毫无疑问，你已经目睹过你的程序崩溃了。每当崩溃发生时，它都会打印出那条熟悉的信息“ Traceback (most recent call):”，随后是你的文件\
  \ `'name.py'`、行号以及一些关于程序何故崩溃的额外信息。归结底，检查错误是既枯燥又无趣的。然而，在你的软件开发生涯中继续前进之前，你必须掌握本节的基础知识。请注意，异常并不是防止程序崩溃的绝对答案。代码可能非常复杂，某些问题是无法预判的。让我们来看一个例子并让程序崩溃：\n\
  \n```python\n#!/usr/bin/python\n\n#tro.py\n\nx=int(raw_input(\"Enter a number: \"\
  ))\n\nprint x\n```\n\n使用任何字母（如 `'a'`）运行程序，你将得到以下结果：\n\n请注意缩进！\n\n```\nEnter a number:\
  \ a\nTraceback (most recent call last):\nFile \"./tro.py\", line 3, in <module>\n\
  x=int(raw_input(\"Enter a number: \"))\nValueError: invalid literal for int() with\
  \ base 10: 'a'\n```\n\n错误是 `ValueError`。`raw_input` 被包裹在 `int()` 中。这一行期望一个整数，而你用字母替换了整数。为了引导用户输入正确类型的数据，我们使用以下信息重写了\
  \ `'tro.py'`。\n\n```python\n#!/usr/bin/python\n\n#tro1.py\n\ntry:\nx=int(raw_input(\"\
  Enter a number: \"))\nprint x\nexcept ValueError:\nprint \"You did not enter a number\"\
  \n```\n\n另一种写法是：\n\n```python\n#!/usr/bin/python\n\n#tro2.py\n\ntry:\nx=int(raw_input(\"\
  Enter a number: \"))\nprint x\nexcept:\nprint \"You did not enter a number\"\n```\n\
  \n这被认为是对多个异常的全捕获。然而，这并不是良好的编程习惯。建议你理解可能发生的不同异常。对于一段常规代码块，很容易发生多个异常。例如：\n\n```python\n\
  #!/usr/bin/python\n\n#try3.py\n\ntry:\nx=int(raw_input(\"Enter a number: \"))\n\
  print x\nexcept EOFError: print \"why did you exit early\"\nexcept ValueError:\n\
  print \"You did not enter a number\"\n```\n\n运行此程序（不要输入数字或字母），然后输入 `'Ctrl-d'` 退出程序。当你提前退出时，就会触发\
  \ `EOF` 错误或‘文件结束’错误。\n\n### 5.1.1 抛出异常 (Raise Exception)\n\n在某些情况下，你希望程序按预期运行，但在需要时仍然抛出异常。你可以创建自己的异常并手动抛出它们。别忘记\
  \ `import sys` 包。\n\n```python\n#!/usr/bin/python\n\n#raise.py\n\nimport sys\n\n\
  def letserror():\nraise RuntimeError('Force the error')\n\ndef main():\nletserror()\n\
  main()\n```\n\n结果（行号可能略有不同）：\n\n请注意缩进！\n\n```\nTraceback (most recent call last):\n\
  File \"raise.py\", line 7, in <module>\nmain()\nFile \"raise.py\", line 6, in main\n\
  letserror()\nFile \"raise.py\", line 4, in letserror\nraise RuntimeError('Force\
  \ the error')\nRuntimeError: Force the error\n```\n\n然而，这看起来并不整洁。以下是稍作修改：\n\n请注意缩进！\n\
  \n```python\n#!/usr/bin/python\n\n#raise2.py\n\nimport sys\n\ndef letserror():\n\
  raise RuntimeError('Force the error')\n\ndef main(num):\ntry:\nletserror()\nexcept\
  \ Exception, err:\nsys.stderr.write(str(err))\nmain(0)\n```\n\n你对如何打印错误信息有很大的控制权。例如，你可以将\
  \ `sys.stderr.write` 替换为：`“sys.stderr.write(\"%s\\n\" % str(err))”`。`sys.stderr`\
  \ 对象是 Unix 标准输入、输出和错误管道的一部分。让我们将其诸诸。这是一个更实用的例子：\n\n请注意缩进！\n\n```python\n#!/usr/bin/python\n\
  \n#raise3.py\n\nimport sys\n\ndef letserror():\nraise RuntimeError('Force the error')\n\
  \ndef main(num):\ntry:\nif num < 3:\nletserror()\nelse:\nblah=num*num\nprint \"\
  my number is\", blah\nexcept Exception, err:\nsys.stderr.write(\"%s your number\
  \ %s is less than 3\\n\" % (str(err),num))\nmain(2)\n```\n\n如果你将 `main(2)` 改为 `'3'`，它将计算数字的平方；但如果它小于\
  \ `'3'` 或 (`< 3`)，就会抛出异常，你可以给用户提供详细的解释。\n\n### 5.1.2 Finally\n\n`finally` 语句块保证即使\
  \ `try` 块抛出异常也会执行。这使其成为清理工作或 `'close()` 的理想选择。例如：\n\n请注意缩进！\n\n```python\n#!/usr/bin/python\n\
  \n#raise4.py\n\nimport sys\n\ndef letserror():\nraise RuntimeError('Force the error')\n\
  \ndef main(num):\ntry:\nif num < 3:\nletserror()\nelse:\nblah=num*num\nprint \"\
  my number is\", blah\nexcept Exception, err:\nsys.stderr.write(\"%s your number\
  \ %s is less than 3\\n\" % (str(err),num))\nfinally:\nprint \"okay I could close...\"\
  \nmain(2)\n```\n\n### 5.1.3 最佳实践 (Best Practice)\n\n上面列出了许多示例。至少，你应该利用基类 `Exception`。尝试一下\
  \ `ctrl-z`。\n\n```python\ntry:\nx=int(raw_input(\"Enter a number: \"))\nexcept Exception,\
  \ e:\nprint e\n```\n\n### 5.1.4 忽略异常 (Ignore Exception)\n\n添加 `pass`，这是一个空操作。\n\n\
  ```python\ntry:\nx=int(raw_input(\"Enter a number: \"))\nexcept Exception, e:\n\
  pass\n```\n\n### 5.1.5 总结 (Summary)\n\n尽力掌握异常处理，因为这将帮助你排除故障并可能提高你的开发质量。本节不需要练习。\n\
  \n# 6 OOP\n\n## 6.1 面对象编程\n\n### 0.1.1 引言 (Intro)\n\n到目前，你一直在通过函数和语句块以过程化的方式创建程序。通过微小的转折，你可以将函数封装到对象中，并进理解面向对象的范式。在没有意识的情况下，你已经在使用面向对象编程的一些方面。\n\
  \n### 6.1.2 对象 (Objects)\n\n现在你已经熟悉了字符串、整数、字典和函数等特征。这些都是对象。字符串对象提供了操作字符串的其他方法。使用点语法，你可以访问对象的属性，例如\
  \ `string.lower()`。所以从开始我们就在访问每个对象的方法。你还可以创建对象的新实例，即实例化。从本质上说，它们是数据类型，并可以使用内置函数\
  \ `type` 进行测试。\n\n```\n>>> dat='a string'\n>>> type('dat')\n<type 'str'>\n```\n\n\
  点语法很容易应用。检查你的 `type`，你会发现它是类字符串对象或 `str(object)`。这是一个可以使用 `type` 测试的类对象的示例。别忘记在类语句后仍然需要缩进文本。提醒：下划线之间没有空格。最后，一如既往，请注意缩进！\n\
  \n```\n>>> class orphan():\n... def __init__(self):\n... self.arg1=arg1\n\n>>> type(orphan)\n\
  <type 'classobj'>\n```\n\n对象通过使用属于自己的变量来存储数据。变量属于对象或类，作为字段。函数也是一样，它们被称为类的方法。所以基本上字段和方法都是类的属性。\n\
  \n\n\n\n类是通过关键字 `class` 创建建的，例如 `class orphan():`。它与函数或（方法）的不同之处在于 `self` 的名称指定符。`self`\
  \ 的值是名称本身，它指代对象本身。将 `self` 想象成 `C++` 中的一个指针。如果你有一个名为 `blahClass` 的类以及该类的一个名为 `blahObj`\
  \ 的实例。当你调用对象的方法，如 `blahObj.method(arg1)` 时，python 会将其转换为 `BlahClass.method(blahObj,arg1)`。即使你定义了一个没有参数的方法，你仍然必须定义一个带有\
  \ `self` 参数的方法。这里有一个实用的用示例：\n\n### #classhello.py\n```python\nclass hello:\n   \
  \ def blah(self):\n        print \"Hello world, again\"\n\na=hello() # 内存中的指针位置\n\
  a.blah() # 打印类的方法\nhello().blah() # 访问类的另一种方式\n```\n\n如你所示，`self` 存在且它不接收参数。\n\n\
  **结果：**\nHello world, again\nHello world, again\n\n### 6.1.4 __init__\n`__init__`\
  \ 方法在对象实例化时会立即初始化。我们并不直接调用 `__init__` 方法（我们的构造函数）。我们只是向它传递参数。例如：\n\n注意缩进！\n\n###\
  \ #classinit.py\n```python\nclass hello:\n    def __init__(self,name):\n       \
  \ self.name=name\n    def blah(self):\n        print \"Hello world, my name is\"\
  ,self.name\n\na=hello('William')\na.blah()\n```\n\n**结果：**\nHello world, my name\
  \ is William\n\n现在传递更多参数：\n\n### #name.py\n```python\nclass hello:\n    def __init__(self,l,f):\n\
  \        self.last=l\n        self.first=f\n    def blah(self):\n        print \"\
  My first name is\", self.first\n        print \"My last name is\", self.last\n\n\
  a=hello('Doe', 'John')\na.blah()\n```\n\n**结果：**\nMy first name is John\nMy last\
  \ name is Doe\n\n这里是另一个示例：\n\n### #shop.py\n```python\nclass cart():\n    def __init__(self):\n\
  \        self.food = \"beans\"\n        self.amt = 0\n    def buyfood(self,amt):\n\
  \        self.amt += amt\n        print \"You purchased\" ,amt,\"cans\",self.food\n\
  \ncheckout = cart()\ncheckout.buyfood(5)\n```\n\n**结果：**\nYou purchased 5 cans beans\n\
  \n### 6.1.5 析构函数\n这是一个析构函数的示例。虽然我在代码中很少使用析构函数，但它们确实存在且是有用的。\n\n### #des.py\n```python\n\
  class Des():\n    def __init__(self, x):\n        self.x = x\n        print self.x,\
  \ 'ready'\n    def __del__(self):\n        print self.x-1, 'destroyed'\n\nx = Des(1)\n\
  ```\n\n**结果：**\n1 ready\n0 destroyed\n\n### 6.1.6 继承\n你可以开发一个继承另一个类类。这个示例展示了如何通过\
  \ `class second(first)` 在 `second()` 类中继承 `first()` 类：\n\n注意缩进！\n\n### #in.py\n\
  ```python\nclass first():\n    n = 0\n    def __init__(self, color='red'):\n   \
  \     self.color = color\n    def Hello1(self):\n        print \"Hello from first\
  \ class!\"\n    def Color(self):\n        print \"My color from first class\", self.color\n\
  \nclass second(first):\n    def Hello2(self):\n        print \"Hello from second\
  \ class!\"\n        print self.n, \"is my favorite number\"\n\na0=first()\na0.Color()\n\
  print '——-'\na1=first('blue')\na1.Hello1()\na1.Color()\nprint '——-'\na2=second('white')\n\
  a2.Hello1()\na2.Hello2()\na2.Color()\n```\n\n### 6.1.7 __private\n双下划线前缀通过名称修饰（name\
  \ mangling）进行处理，从而有效地在类或对象内部使其变为私有。\n\n### 6.1.8 类的功夫\nPython 中所有的类都派生自一个特殊的自顶向下的父类\
  \ `object`，该类可能显式也可能可能式派生。\n\n```python\nclass KungFu(Object):\n```\n\n在 Python\
  \ 中，派生自“父类”的类被称为“子类”。让我们在下面的示例中从父类继承。\n\n### #kungfu.py\n```python\nclass KungFu(object):\n\
  \    mystr=”the master”\n    pass\n\nclass Master(KungFu):\n    pass\n\nteacher=Master.mystr\n\
  print teacher\n```\n\n**结果：**\nThe master\n\n现在在子类中重写属性值。\n\n### #kungfu1.py\n```python\n\
  class KungFu(object):\n    mystr=”the master”\nclass Master(KungFu):\n    mystr=”Student\
  \ is not the master”\nteacher=Master.mystr\nprint teacher\n```\n\n**结果：**\nStudent\
  \ is not the master\n\n在子类内部执行父类的方法。\n\n### #kungfu2.py\n```python\nclass KungFu(object):\n\
  \    mystr=”the master”\n    def crane(self):\n        print ”crane kick”\nclass\
  \ Master(KungFu):\n    mystr=”Student is not the master”\nteacher=Master()\nteacher.crane()\n\
  ```\n\n**结果：**\ncrane kick\n\n用子类覆盖父类。\n\n### #kungfu3.py\n```python\nclass KungFu(object):\n\
  \    mystr=”the master”\n    def crane(self):\n        print ”crane kick”\nclass\
  \ Master(KungFu):\n    mystr=”Student is not the master”\n    def crane(self,bstr):\n\
  \        print ”must learn crane kick”\nteacher=Master()\nteacher.crane(1)\n```\n\
  \n**结果：**\nmust learn crane kick\n\n### 6.1.9 迭代对象\n在 Python 中，派生自“父类”的类被称为“子类”。让我们在下面的示例中从父类继承。（等等，提供的文本在某些章节中似乎有些混乱，让我们根据提供的流程进行重新对齐）。\n\
  \n### #in.py\n```python\nclass first():\n    n = 0\n    def __init__(self, color='red'):\n\
  \        self.color = color\n    def Hello1(self):\n        print \"Hello from first\
  \ class!\"\n    def Color(self):\n        print \"My color from first class\", self.color\n\
  \nclass second(first):\n    def Hello2(self):\n        print \"Hello from second\
  \ class!\"\n        print self.n, \"is my favorite number\"\n\na0=first()\na0.Color()\n\
  print '——-'\na1=first('blue')\na1.Hello1()\na1.Color()\nprint '——-'\na2=second('white')\n\
  a2.Hello1()\na2.Hello2()\na2.Color()\n```\n\n\n\n\n它们的作用完全相同，但 lambda 表达式不包含 return\
  \ 语句。你可以将 lambda 定义放置在任何存在函数的地方，并且不需要将其赋值给变量。Lambda 函数是一种风格问题。它们不是强制要求的，并且可以很容易地使用函数进行替换。如果你发现自己创建了很多短函数，那么\
  \ lambda 可能会是一个实用的解决方案。这里有一个更具实性的示例：\n\n### lambda.py\n\n```python\nfoo=[1,2,3,4,5,6]\n\
  \nprint filter(lambda x: x % 2 == 0, foo)\n\nprint filter(lambda x: x % 2 == 0,\
  \ (x for x in range(1,7)))\n\nblah=[x for x in range(1,7) if x %2 == 0]\n\nprint\
  \ blah\n```\n\n结果：\n\n`[2, 4, 6]`\n\n`[2, 4, 6]`\n\n`[2, 4, 6]`\n\n注意，最后一个表达式被列表推导式（list\
  \ comprehension）替换了。\n\n### 7.1.3 Assert\n\n`assert` 通常用于调试代码。`assert` 的格式为 `(assert\
  \ <test>, <message>)`。例如..\n\n### assert.py\n\n```python\nblah=int(raw_input(\"\
  enter number greater than 3: \"))\n\nassert blah !=3, 'strange why did you enter\
  \ 3'\n```\n\n结果：\n\nenter number greater than 3: 3\n\n```text\nTraceback (most recent\
  \ call last):\nFile \"assert.py\", line 9, in <module>\nassert blah !=3, 'strange\
  \ why did you enter 3'\nAssertionError: strange why did you enter 3\n```\n\n该语句断言某事为真。如果你输入\
  \ `'3'`，将抛出错误并将 `assert` 消息传递到标准输出。如果你有这样一个列表：\n\n```python\nlist=['hello']\n\n\
  assert len(list) >= 1\n```\n\n断言为真，没有传递消息。你可能需要一个断言来强制某物在列表中，因为你可能设计了程序在列表至少包含一个项目时运行。如果该列表为空，你希望程序带有一个\
  \ `assert` 消息退出，该消息规定了程序退出的原因。\n\n### 7.1.4 eval\n\n'Eval' 是另一个评估字符串的函数示例。下面的程序还将演示你从来源接收字符串时缺乏信任的情况。\n\
  \n### aeval.py\n\n```python\na='a'\n\nblah=raw_input(\"enter numbers: \")\n\nprint\
