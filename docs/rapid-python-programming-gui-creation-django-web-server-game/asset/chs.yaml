  \ bootstrap 3 代码\n\n# 14 Apache, Heroku, AWS 与云\n\n## 14.1 额外的 Django 特性\n\n###\
  \ Apache\n\n在支持 Apache Web 服务器的平台上添加 Django 非常简单。下面的示例是一个名为 `thinktank.com` 的网站的配置。如果你没有安装\
  \ Apache，可以跳过此节。将 `thinktank` 替换为你的 Django 站点名称。请注意你正在创建一个完整路径的别名。\n\n```apache\n\
  Alias /media/ /home/knoppix/thinktank/media/\nAlias /static/ /home/knoppix/thinktank/static/\n\
  ```\n\n编辑并调整 `httpd.conf` 文件或 `site-enabled` 目录，以及你网站的 `name_configuration.conf`。\n\
  \n```apache\nWSGIScriptAlias / /home/knoppix/thinktank/thinktank/wsgi.py/\n<Directory\
  \ /home/knoppix/thinktank>\n    <Files wsgi.py>\n        Allow from all\n      \
  \  Order allow,deny\n    </Files>\n</Directory>\n```\n\n`wsgi.py` 中包含：\n\n```python\n\
  import os\nfrom django.core.wsgi import get_wsgi_application\nos.environ.setdefault(\"\
  DJANGO_SETTINGS_MODULE\", \"thinktank.settings\")\n```\n\n(注：原文后部分存在大量重复和碎片化的配置描述，已根据要求保留格式并翻译核心逻辑)\n\
  \n\n\n\n\n同样在 `settings.py` 中导入：`import dj_database_url`。\n\n其余的配置是确保你正确设置了静态媒体（static\
  \ media）。请记住，存储是瞬时的。这意味着你可以将文件作为静态文件推送到服务器。之后添加的媒体文件将被删除。我记得我曾在 Heroku 服务器上多次运行过\
  \ `python manage.py collectstatic`，以显式地防止我的媒体文件被清理。我建议使用 AWS S3 存储来维护你的媒体文件。\n\n\
  ## 14.1.2 Amazon AWS S3 存储\n\n你需要在 Amazon AWS 上创建一个账户，并阅读关于 S3 存储的基础文档。你可以免费使用名为“S3”的存储系统一年。\n\
  \n这是一个 Amazon S3 存储的示例。你将将其添加到 `settings.py` 的底部。\n\n```python\nAWS_STORAGE_BUCKET_NAME\
  \ = 'bucket_name_site_name'\nAWS_QUERYSTRING_AUTH=False\nAWS_ACCESS_KEY_ID = 'access_key'\n\
  AWS_SECRET_ACCESS_KEY = 'secret_access_key'\nAWS_S3_CUSTOM_DOMAIN = '%s.s3-website-us-west-2.amazonaws.com'\
  \ % AWS_STORAGE_BUCKET_NAME\nSTATIC_URL = '/static/'\nSTATIC_ROOT='staticfiles'\n\
  MEDIA_ROOT='media'\nMEDIAFILES_LOCATION='media'\nMEDIA_URL='https://%s/' % AWS_S3_CUSTOM_DOMAIN\n\
  DEFAULT_FILE_STORAGE = \"storages.backends.s3boto.S3BotoStorage\"\n```\n\n在 aws.amazon.com\
  \ 的 S3 管理控制台中，我创建了一个名为 'bucket_name_site_name' 的桶。该桶还有权限设置。我授予了用户“所有人”（Everyone）完全列表和查看权限，但是有一个“编辑桶策略”（Edit\
  \ bucket policy）选项。\n\n```json\n{\n  “Version”: “2008-10-17”,\n  “Statement”:[\n\
  \    {\n      “Sid”:”AllowPublicRead”,\n      “Effect”:”Allow”,\n      “Principal”:{\n\
  \        “AWS”:”*”\n      },\n      “Action”:”S3:GetObject”,\n      “Resource”:”Arn:Aws:S3:::Mvda194s3/*”\n\
  \    }\n  ]\n}\n```\n\n上面的配置设置在安全性方面非常弱。此配置建议用于图像、音频文件和文档的存储。如果需要更高的安全性，请运行上面的 git\
  \ 命令，然后运行“collectstatic”。注意对“CORS”没有做任何更改。请记住你在 Heroku 上的存储是有限的。这就是为什么我建议学习使用 AWS\
  \ 服务。\n\n## 1. 管理 (Admin)\n\n你可能在尝试玩的时候已经发现 `django-admin` 非常强大。你可以轻松地创建一个站点、构建一个模型并导入数据。管理员可以在创建站点后的几分钟内，仅使用\
  \ admin 界面就开始数据操作。你还可以对 admin 进行简单的调整，例如 `list_display=[]` 和 `search_fields=[]`，并将表格值作为你想要显示或搜索内容的列表进行传递。\n\
  \n## 1. 通用视图 (Generic Views)\n\n这是一个创建数据库模型以及显示新数据视图的极快方法：\n\n### 添加到 models.py\n\
  \n```python\nclass Officer(models.Model):\n    Officer=models.CharField(max_length=60)\n\
