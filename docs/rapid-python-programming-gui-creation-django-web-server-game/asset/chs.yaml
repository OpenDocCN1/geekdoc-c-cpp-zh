  ```\n\n使用以下来源 `(3, 2.5, a, b, 'b', 2*3, '2*3', \"len('hello')\")` 分测试该程序 `'8'` 次。\n\
  \n### 7.1.5 exec\n\n这在运行时动态执行。根据你的目标，将 python 与 bash 或脚本语言混合可能非常有用。\n\n```python\n\
