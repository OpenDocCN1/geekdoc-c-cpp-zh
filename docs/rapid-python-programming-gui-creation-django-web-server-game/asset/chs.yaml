  \n```python\n>>> import wx\n>>> help('wx')\n```\n\n关于包 `wx` 的帮助：\n\n### 我们创建一个窗口\n\
  \n#first.py\n```python\nimport wx\napp=wx.App()\nframe=wx.Frame(None, 'first')\n\
  frame.Show()\napp.MainLoop()\n```\n\n这是一个结构化的方式来创建我们的 `wx` 应用。让我们将其迁移到一个类。\n\n#second.py\n\
  ```python\nimport wx\nclass Blah(wx.App):\n    def OnInit(self):\n        frame=wx.Frame(None,\
  \ -1, \"I love python\")\n        frame.Show(True)\n        self.SetTopWindow(frame)\n\
