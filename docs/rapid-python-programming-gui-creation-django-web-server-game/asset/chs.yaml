  \    3. `位置`\n    4. `blit()`\n    5. `display.flip()`\n\n## 16.2.8 游戏引擎架构\n\n在最简单的形式下，架构是章节开头的总结，包含了以下新组件。\n\
  \n- `Action(运行,驱动,跳跃,等...)`\n- `Input()`\n- `game 逻辑(is, else,等...)`\n- `camera(update)`\n\
  - `world(update)`\n- `GUI(update)`\n- `Collision(AI)(update)`\n- `Audio()`\n- `Render(draw)`\n\
  \n所有这些内容都需要在一个网格图中进行映射，其中几乎每个组件都会与另一个组件相互作用。如果你想保持清醒，还应该记录每个组件。当你开始编写每个组件时，它将成为你用于所有任务的框架类。\n\
  \n现在，我们准备好从一个组件向另一个组件发送消息。创建一个每个组件都可以引用的总线模块。\n\n我将开始编写以下类并封装上述组件。\n\n- `class Sprite():`\n\
  \    - `update(), checkboundry()`\n- `class ComplexSprite():`\n    - `Wrap()` #\
  \ 环绕屏幕\n    - `Bounce()` # 从屏幕反弹\n    - `Stop()` # 停止在屏幕边缘\n    - `speed()`\n  \
  \  - `update()`\n    - `angle()`\n    - `等...`\n- `class Scene():`\n    - `init()`\n\
  \    - `start/stop()`\n    - `mainloop()`\n    - `update()`\n    - `events()`\n\
  - `class Label():`\n    - `init()`\n    - `update()`\n- `class Multilabel():`\n\
  \    - `multi(),long(), update()`\n- `class Button():`\n    - `等...`\n- `class scroller():`\n\
  \    - `等...`\n\n## 16.3 创建游戏总结\n\n你希望为你的游戏引擎原型尽可能多的功能，这样你就可以更多地关注游戏逻辑，少关注设计。例如，一个游戏将包含\
  \ `Scene` 类指令、播放、进度、新元素以及重启或结束。引擎中 80% 的功能可以重用于其他相同类型的游戏，例如`横滚卷`、`平台跳`、`俯视角`和`混合型`。虽然从\
  \ 2D 到 3D 有些许跨越，但概念仍然相同。\n\n## 17 股票市场\n\n我使用 Python 进行市场分析已经有一段时间了，并在几家首选公司拥有多个账户。无论它们提供什么服务，每家券商之间似乎总会有缺少某些东西。通常需要从\
