  \ 的值。下一步是初始化 `class: aap=Blah()`，我们还需要循环它 `app.MainLoop()`。\n\n重构代码：\n\n#thirdwx.py\n\
  ```python\nimport wx\n\nclass Blah(wx.Frame):\n\n    def __init__(self,x,y,z):\n\
  ```\n\n\n\n```python\nwx.Frame.__init__(self,x,y,z)\napp=wx.PySimpleApp()\nframe=Blah(x=None,\
  \ y=-1,z=\"wow\")\nframe.Show()\napp.MainLoop()\n```\n\n添加一个按钮：\n\n# fourthwx.py\n\
  \n```python\nimport wx\n\nclass Blah(wx.Frame):\n    def __init__(self,x,y,z):\n\
  \        wx.Frame.__init__(self,x,y,z)\n        panel=wx.Panel(self)\n        button=wx.Button(panel,label=\"\
  press me\")\n\napp=wx.PySimpleApp()\nframe=Blah(x=None, y=-1,z=\"wow\")\nframe.Show()\n\
  app.MainLoop()\n```\n\n让按钮执行关闭窗口（Frame）等的操作。\n\n# fifthwx.py\n\n```python\nimport\
  \ wx\n\nclass Blah(wx.Frame):\n    def __init__(self,x,y,z):\n        wx.Frame.__init__(self,x,y,z)\n\
  \        panel=wx.Panel(self)\n        button=wx.Button(panel,label=\"press me\"\
  )\n        self.Bind(wx.EVT_BUTTON,self.closebutton,button)\n\n    def closebutton(self,event):\n\
  \        self.Close(True)\n\napp=wx.PySimpleApp()\nframe=Blah(x=None, y=-1,z=\"\
  wow\")\nframe.Show()\napp.MainLoop()\n```\n\n## 10.1.1 PythonCard\n\n没有集成开发环境（IDE）的情况下开发\
  \ GUI 应用程序会非常繁琐。以下是三个支持 Python 的 IDE：\n\n1. 打开 Komodo\n2. PyQT\n3. Eclipse\n\nEclipse\
  \ 是一个非常流行的 IDE，主要用于 Java 或 C 语言编程。它支持 WxWidgets 和 `python`。如果你的应用程序达到了很高的复杂度，你可能会发现自己在使用\
  \ Eclipse。由于 Eclipse 超出了本书的范范围，我想介绍的是 PythonCard。PythonCard 是一个使用 Python 语言的 GUI\
  \ 构建套件。“PythonCard 的格言是：‘简单的事情应该是简单的，复杂的事情应该是可能的。’”\n\n本书的目标与 PythonCard 的格言一样，是快速开发图形化应用程序。PythonCard\
  \ 通过使用资源文件用字典来定义界面，将表现层与应用程序逻辑分离开。应用程序逻辑是一个单独的 `python` 文件。这允许开发者专注于应用程序逻辑，而不是关注控件尺寸、位置、颜色和功能等繁琐的方面。要开始我们的第一个应用程序，请从\
  \ http://pythoncard.sourceforge.net 下载“PythonCard”。\n\n# pcard1.py\n\n```python\n\
  from PythonCard import model\n\nclass blah(model.Background):\n    pass\n\nif __name__==\"\
  __main__\":\n    app=model.Application(blah)\n    app.MainLoop()\n```\n\n现在，如果你尝试运行脚本，你将得到一个错误，因为你需要使用\
  \ `\"resourceEditor\"` 创建资源文件。\n\n图 0.1：\npycard 模板\n![](img/00032.jpeg)\n\n就像示例一样，你可以选择一个\
  \ `Component` 并选择 `TextField`。将文件保存为 `'pcard1.rsrc.py'`。当你运行 `'pcard1.py'` 时，应该会出一个窗口，其中包含你新添加的\
  \ `TextField` 条目。\n\n应用程序类是我们为想要处理的每个事件定义方法的地方。方法名称很重要，因为它决定了执行哪块代码。方法名称的格式为 `on_(component_name)_(event\
  \ name)`。\n\n这里是组件列表：\n\n- BitmapCanvas\n- Button\n- Calendar\n- CheckBox\n- Choice\n\
  - CodeEditor\n- ComboBox\n- Gauge\n- Grid\n- HtmlWindow\n- IEHtmlWindow\n- Image\n\
  - ImageButton\n- List\n- MultiColumnList\n- Notebook\n- PasswordField\n- RadioGroup\n\
  - Slider\n- Spinner\n- StaticBox\n- StaticLine\n- StaticText\n- TextArea\n- TextField\n\
  - ToggleButton\n- Tree\n\n事件会自动绑定到每个组件，并如下：\n\n- gainFocus\n- loseFocus\n- mouseContextDoubleClick\n\
  - mouseContextDown\n- mouseContextUp\n- mouseDoubleClick\n- mouseDown\n- mouseDrag\n\
  - mouseEnter\n- mouseLeave\n- mouseMiddleDoubleClick\n- mouseMiddleDown\n- mouseMiddleUp\n\
  - mouseMove\n- mouseUp\n- timer\n- mouseClick\n- closefield\n- keyPress\n\n每个组件都具有如\
  \ `'backgroundcolor'`、命令字符串、字体、`'foregroundColor'`、名称位置、尺寸、`'toolTip'` 和可见性等属性。PythonCard\
  \ 的安装包中包含“65+”个应用程序示例，其中一个示例文件列出了所有示例。\n\n## 10.1.2 PythonCard Application\n\nPythonCard\
  \ 是一个图形化的 WYSIWYG 工具，用于为你的项目开发 WxWidget 界面。它是 `'resourceEditor'` 创建了每个控件（如文本框、按钮等）具有正确坐标的\
  \ XML 文件。你通过将数据作为字典文件传递给每个方法来利用 PythonCard API。让我们创建第一个 pythoncard 应用程序。我们将从一个简单的脚本开始。\n\
