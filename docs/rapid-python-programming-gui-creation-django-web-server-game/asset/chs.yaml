  \    f.write(d)\n    f.close()\n\nif __name__=='__main__':\n    d=raw_input(\"enter\
  \ something: \")\n    FileWrite(d)\n```\n\n在上面的示例中，我们正在使用 `raw_input` 向文件写入内容。验证一切是非常重要的。\n\
  \n# test.py\n\n```python\nfrom bfile import *\nd=raw_input('enter something: ')\n\
  FileWrite(d)\n```\n\n在上面的示例中，我们正在使用 `raw_input` 向文件写入内容。验证一切是非常重要的。\n\n*(注：提供的文本包含大量重复的块和片段化代码，我已按照文档的逻辑流对结构进行了清理。)*\n\
  \n\n\n\n\n# 11 套接字与数据库\n\n## 11.1 socket 编程\n\nPython 提供了许多访问应用层的模块，如 `FTP`、`HTTP`、`Telnet`、`SSH`\
  \ 等。有时你需要实现自己的应用层协议。为了实现这一点，我们使用 `(sockets)`。\n\n```\n>>>help('socket')\n```\n\n\
  ### 描述\n\n该模块提供了 socket 操作和一些相关函数。\n\n在 Unix 上，它支持 `IP`（网络协议）和 Unix 域套接字（domain\
  \ sockets）。\n\n在其他系统上，它仅支持 `IP`。特定 `socket` 的函数作为 `socket` 对象的方法可用。\n\n### 函数：\n\
  \n- `socket()` – 创建一个新的 socket 对象\n- `socketpair()` – 创建一对新的 socket 对象\n- `fromfd()`\
  \ – 从打开的文件描述符创建 socket 对象\n- `gethostname()` – 返回当前主机名\n- `gethostbyname()` – 将主机名映射到其\
  \ IP 地址\n- `gethostbyaddr()` – 将 IP 地址或主机名映射到信息\n- `getservbyname()` – 将服务名和协议名映射到端口号\n\
  - `getprotobyname()` – 将协议名（例如 `'tcp'`）映射到数字\n- `ntohs()`, `ntohl()` – 将 16 位整数从网络字节序转换为主机字节序\n\
  - `htons()`, `htonl()` – 将 16 位整数从主机字节序转换为网络字节序\n- `inet_aton()` – 将 IP 字符串（`123.45.67.89`）转换为\
  \ 32 位压缩格式\n- `inet_ntoa()` – 将 32 位压缩格式转换为字符串（`123.45.67.89`）\n- `ssl()` – 安全层支持（仅配置后可用）\n\
  - `socket.getdefaulttimeout()` – 获取默认超时\n- `socket.setdefaulttimeout()` – 设置默认超时\n\
  - `create_connection()` – 连接到地址，在所有平台上都提供可选的超时\n\n## 11.1.1 TCP 套接字\n\n让我们从 TCP\
  \ 服务器开始。下面的示例代码是客户端。在测试客户端之前运行服务器是非常关重要的。你必须同时拥有这两个文件代码才能正常工作。\n\n```python\n#tcpc.py\n\
  import socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\ndata = s.recv(1024)\ns.close()\n\
  ```\n\n远程主机是 `host=localhost`，所以在这种情况下我们的主机是本地的。远程服务器上的端口是 `8001`，socket 平台是 unix\
  \ 流（stream）或用于数据报的 `DGRAM`。下面的示例使用了流。现在我们需要一个 `connect` 对象来绑定到主机/端口并接收 `1024` 字节。然后我们可以观察数据流入缓冲区。现在关闭该对象。以下是服务器：\n\
  \n```python\n#tcps.py\nimport socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
  print 'Connected by', addr\nconn.close()\n```\n\n这里的区别在于我们正在使用 `bind` 对象将 IP 地址绑定到端口号。我们正在使用\
  \ `accept` 对象将其赋值给变量 `addr`，然后发送确认。。先运行 `tcps.py` 服务器。然后打开另一个终端或提示符并运行 `tcpc.py`\
  \ 客户端程序。服务器将打印出收到了来自客户端数据流的 `('127.0.0.1', 44xx)` 或类似的连接。这对于我们的目的来说并不实际。让我们通过在客户端中添加一些内容来返回一些数据。要做到这一点，在最后一行添加\
  \ `print 'Received', repr(data)`。现在再次启动服务器 `tcps.py` 并在连接客户端时查看结果。你还没有真正收到数据。服务器需要发送它。为了让这种情况发生，我们需要向服务器添加一个发送对象。\n\
  \n```python\n#tcpc1.py\nimport socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\ndata = s.recv(1024)\ns.close()\n\
  print 'Received', repr(data)\n```\n\n现在当你启动服务器并连接客户端时，你会注意到客户端打印出收到了确认。为了进一步测试你的代码，让客户端向服务器发送一些内容。如果你看到“socket\
  \ address in use”，你可能需要关闭之前的服务器应用程序并重新启动服务器。\n\n```python\n#tcpc2.py\nimport socket\n\
  HOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  s.connect((HOST, PORT))\ns.send('Hello, world')\ndata = s.recv(1024)\ns.close()\n\
  print 'Received', repr(data)\n```\n\n但我们必须修改服务器来接收那些数据。\n\n```python\n#tcps2.py\n\
  import socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
  print 'Connected by', addr\ndata=conn.recv(1024)\nconn.send('Acknowledge')\nprint\
  \ data\nconn.close()\n```\n\n现在我们有了客户端和服务器应用程序以高效的方式相互通信。然而，如果发送发送数据流，循环在服务器上效果可能会好一点。\n\
  \n```python\n#tcps3.py\nimport socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
  print 'Connected by', addr\nwhile 1:\n    data= conn.recv(1024)\n    if not data:\
  \ break\n    conn.send(data)\nconn.close()\n```\n\n客户端如下：\n\n```python\n#tcpc3.py\n\
  import socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
  \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\nwhile 1:\n    data=raw_input(\"\
  Text: \")\n    if not data:\n        break\n    else:\n        s.send(data)\n  \
  \      print \"sent message:\", data\ns.close()\n```\n\n当你运行它时，只要客户端发送数据流，服务器就不会断开。例如，这里是我输入的数据流：\n\
  ```\nText: wow\nsend message: wow\nText: working\nsend message: working\nText: cool\n\
  send message: cool\nText:\n```\n所以客户端正在发送数据流并在屏幕上打印发送数据的结果。虽然两个 print 语句可能多此此了，但我们如何才能确定数据正在被发送呢？为了验证这一点，我们在服务器上添加了一个\
  \ print 语句。\n\n```python\n#tcps4.py\nimport socket\nHOST = '127.0.0.1'\nPORT = 8001\n\
  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\n\
  conn, addr = s.accept()\nprint 'Connected by', addr\nwhile 1:\n    data= conn.recv(1024)\n\
  \    if not data: break\n    conn.send(data)\nprint \"sent: \" , data\nconn.close()\n\
  ```\n现在服务器将打印出已发送的数据并在连接丢失时中断服务器。我们还可以添加一个异常来实现优雅退出。（这样做是为了避免 TCPIP 三次握手数据流中的错误。）\n\
  \n## 11.1.2 UDP 套接字\n\nUDP 套接字实际上并没有那么不同。唯一的区别在于三次握手。在 TCP 中，你需要 `SYN`、`SYN/ACK`\
  \ 和 `ACK` 标志。UDP 的可靠性较低，但在网络通信的其他方面具有优势。它无论是否有确认都会发送数据。以下是一个 UDP 服务器：\n\n```python\n\
  #server.py\nfrom socket import *\nhost = \"localhost\"\nport = 8001\nbuf = 1024\n\
  addr = (host,port)\nu= socket(AF_INET,SOCK_DGRAM)\nu.bind(addr)\nwhile 1:\n    data,addr\
  \ = u.recvfrom(buf)\n    if not data:\n        break\n    else:\n        print \"\
  Received message:\", data\nu.close()\n```\n\n客户端如下：\n\n```python\n#client.py\nfrom\
  \ socket import *\nhost = \"localhost\"\nport = 8001\nbuf = 1024\naddr = (host,port)\n\
  u= socket(AF_INET,SOCK_DGRAM)\nmsg= \"Send messages to server: \";\nprint \"Message\
  \ sent:\", msg\nwhile (1):\n    data = raw_input('Text: ')\n    if not data:\n \
  \       break\n    else:\n        if(u.sendto(data,addr)):\n            print \"\
  send message:\",data\nu.close()\n```\n\n注意这个 UDP 数据流没有任何错误的情况下关闭。这是因为它没有像 TCPIP\
  \ 那样的三次握手。\n\n# 11.2 数据库 SQLite\n\nSQLite 是原型和构建 SQL 数据库最方便、快速的方法之一。然而，请记住 SQLite\
  \ 比人们认为的要强大得多。对于小数据集，它可以很容易地与 MySQL 或 Postgress 竞争。它还具有轻量且可移植的优势。这里所有的概念都可以很容易地应用到\
  \ MySQL 和 Postgress。\n\n\n\n\n访问 `http://www.sqlite.org` 并下载适用于你系统的最新二进制文件。以下是在名为\
  \ `mytable.db` 的数据库中创建 '3' 个字段的示例。表名为 `foo`。\n\n```bash\n./sqlite3 mytable.db\n\
  ```\n\nSQLite 版本 3.6.10\n\n输入 \".help\" 查看帮助\n\n输入以 \";\" 结束的 SQL 语句\n\nsqlite>\
  \ create table foo (id INTEGER PRIMARY KEY, fname VARCHAR(50), lname VARCHAR(50));\n\
  sqlite> insert into foo values (1,'john','doe');\nsqlite> select * from foo\n...>\
  \ ;\n1|john|doe\n\nsqlite>\n\n如你所见，这非常简单。请注意我在 `“select * from foo”` 中漏掉了分号。我必须在下一行输入它。下面是可以使用的命令列表。\n\
  \n```bash\nsqlite> .help\n```\n\n- `.bail ON|OFF` 遇到错误后停止。默认 OFF\n- `.databases`\
  \ 列出已连接数据库的名称和文件\n- `.dump ?TABLE? ...` 将数据库以 SQL 文本格式导出\n- `.echo ON|OFF` 开启或关闭命令回\n\
  - `.exit` 退出此程序\n- `.explain ON|OFF` 开启或关闭适用于 EXPLAIN 的输出模式\n- `.header(s) ON|OFF`\
  \ 开启或关闭表头显示\n- `.help` 显示此消息\n- `.import FILE TABLE` 从 `FILE` 将数据导入 `TABLE`\n- `.indices\
  \ TABLE` 显示 `TABLE` 上所有索引的名称\n- `.load FILE ?ENTRY?` 加载扩展库\n- `.mode MODE ?TABLE?`\
  \ 设置输出模式，其中 `MODE` 为以下之一：\n    - `csv` 逗号分隔值\n    - `column` 左对齐列。（参见 `.width`）\n\
  \    - `html` HTML `<table>` 代码\n    - `insert` 针对 `TABLE` 的 SQL 插入语句\n    - `line`\
  \ 每行一个值\n    - `list` 由 `.separator` 字符串分隔的值\n    - `tabs` 制表符分隔值\n    - `tcl` TCL\
  \ 列表元素\n- `.nullvalue STRING` 用 `STRING` 代替 `NULL` 值\n- `.output FILENAME` 将输出发送到\
  \ `FILENAME`\n- `.output stdout` 将输出发送到屏幕\n- `.prompt MAIN CONTINUE` 替换标准提示符\n-\
  \ `.quit` 退出此程序\n- `.read FILENAME` 执行 `FILENAME` 中的 SQL\n- `.schema ?TABLE?` 显示\
  \ `CREATE` 语句\n- `.separator STRING` 更改输出模式和 `.import` 使用的分隔符\n- `.show` 显示各种设置当前值\n\
  - `.tables ?PATTERN?` 列出匹配 LIKE 模式的表名\n- `.timeout MS` 尝试打开锁定表的时长（毫秒）\n- `.timer\
  \ ON|OFF` 开启或关闭 CPU 计时器测量\n- `.width NUM NUM ...` 设置 \"column\" 模式的列宽\n\nsqlite>\n\
  ```\n\n我们可以使用 `\".sechma\"` 查看表的描述。\n\n```bash\n./sqlite3 mytable.db\nSQLite 版本\
  \ 3.6.10\n输入 \".help\" 查看帮助\n输入以 \";\" 结束的 SQL 语句\nsqlite> .schema\nCREATE TABLE\
  \ foo (id INTEGER PRIMARY KEY, fname VARCHAR(50), lname VARCHAR(50));\nsqlite>\n\
  ```\n\n我们可以按照如下方式导出数据：\n\n```bash\nsqlite> .mode csv\nsqlite> .output data.csv\n\
  sqlite> select * from foo;\nsqlite> .quit\n```\n\n```bash\n/home/knoppix:$ cat data.csv\n\
  1,john,doe\n```\n\n为了进一步强调 SQLite 的强大，你可以在命令行执行查询。\n\n```bash\n./sqlite3 mytable.db\
  \ \"select * from foo;\"\n```\n\n结果：\n```\n1|john|doe\n```\n\n此功能使得 SQLite 非常健壮。你可以在\
  \ bash 或 AWK 中快速编写脚本。你还可以导入 'OS' 或 'System' 以外部访问应用程序，并使用 Perl、Python、'C' 或 'C++'\
  \ 等语言。提供了库，这样你不需要外部调用程序。\n\n# 11.2.2 Python SQLite\n\n从 2.6 版本开始，SQLite 库已包含在 Python\
  \ 核心包中。让我们创建一个与上面教程类似的名为 `user.db` 的新表。\n\n### create.py\n```python\n# 创建 user.db\n\
  import sqlite3\n\ncon = sqlite3.connect('user.db')\ncur = con.cursor()\ncur.execute('CREATE\
  \ TABLE userinfo (id INTEGER PRIMARY KEY, fname VARCHAR(20), lname VARCHAR(30))')\n\
  con.commit() # 注释掉\ncur.execute('INSERT INTO userinfo (id, fname, lname) VALUES(NULL,\
  \ \"john\", \"doe\")')\ncon.commit()\ncur.execute('SELECT * FROM userinfo')\nprint\
  \ cur.fetchall()\n```\n\n列出记录：\n\n### record.py\n```python\n# 列出表中的信息\nimport sqlite3\n\
  \ncon=sqlite3.connect('user.db')\ncur=con.cursor()\ncur.execute('SELECT * FROM userinfo')\n\
  print cur.fetchall()\n```\n\n添加新记录：\n\n### record1.py\n```python\n# 列出表中的信息\nimport\
  \ sqlite3\n\ncon=sqlite3.connect('user.db')\ncur=con.cursor()\ncur.execute('insert\
  \ into userinfo(id,fname,lname) VALUES(NULL, \"george\", \"peterson\")')\ncon.commit()\n\
  cur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\n```\n\n更新记录：\n\n###\
  \ update.py\n```python\n# 列出表中的信息\nimport sqlite3\n\ncon=sqlite3.connect('user.db')\n\
  cur=con.cursor()\ncur.execute(\"update userinfo set lname='bob' where fname='george'\"\
  )\ncon.commit()\ncur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\ncur.close()\n\
  con.close()\n```\n注意最后一行关闭了游标和连接。\n\n# 11.2.3 练习\n\n1. 使用 sockets 创建一个简单的聊天服务器。\n\
  2. 创建一个家庭地址录，包含姓名、电话号码、地址等……\n\n# 12 CGI, WSGI 框架开发\n\n## 12.1 CGI\n\nCGI 是引入应用程序的一种快速粗暴的方法。大多数语言都使用它。下面是一个\
  \ bash 脚本示例：\n\n```bash\n#!/bin/bash\necho \"Content-type: text/html\"\necho \"\
  <html>\"\necho \"Hello world\"\necho \"</html>\"\n```\n\n这是一个 python 脚本：\n```python\n\
  #!/usr/bin/python\n# firstweb.py\nprint \"Content-type: text/html\\n\"\nprint \"\
  Hello world\"\n```\n\n注意我也将所有内容放在了引号内：\n```python\n#!/usr/bin/python\n# secweb.py\n\
  print 'Content-type: text/html\\n'\nvar=\"Hello world\"\nprint \"\"\"\n<html><head><title>Second\
  \ Web Page</title></head><body><h1>Messasge to you: %s</h1></body></html>\n\"\"\"\
  \ % var\n```\n\n这是一个简单表单的示例：\n```python\n# form.py\nprint \"Content-type:text/html\\\
  n\"\nprint \"\"\"\n<html>\n<form action=\"pform.py\" method=\"get\">\nFirst Name:\
  \ <input type=\"text\" name=\"fname\"> <br>\nLast Name: <input type=\"text\" name=\"\
  lname\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n</html>\n\"\"\"\n```\n\
  \n为了实际工作，你需要另一个文件来获取表单中存储的值：\n```python\n# pform.py\nimport cgi,cgitb\nform=cgi.FieldStorage()\n\
  # 从字段获取数据\nfirstname=form.getvalue('fname')\nlastname=form.getvalue('lname')\n\n\
  print \"Content-type:text/html\\n\"\nprint \"\"\"\n<html>\n<h1>Entries from form</h1>\n\
  <p>First name is: %s\n<p>Last name is: %s\n<hr>\n</html>\n\"\"\" % (firstname,lastname)\n\
  ```\n注意导入的 `cgi`、`cgitb` 和 `FieldStorage()` 函数。\n\n\n\n\n\n`cgitb` - 为 Python 脚本提供更全面的回溯格式化。\n\
  \n## 文件\n`/usr/lib/python2.6/cgitb.py`\n\n## 模块文档\nhttp://docs.python.org/library/cgitb\n\
  \n## 描述\n要启用此模块，请执行：\n\n```python\nimport cgitb; cgitb.enable()\n```\n\n在你的脚本顶部。`enable()`\
  \ 的可选参数有：\n\n- `display` - 如果为 true，则在 Web 浏览器中显示回溯\n- `logdir` - 如果设置，回溯信息将写入此目录下的文件\n\
  - `context` - 每个堆栈帧显示的源代码行数\n- `format` - 使用 `'text'` 或 `'html'` 控制输出格式\n\n默认情况下，回溯信息会被显示但不会保存，上下文（context）为\
  \ 5 行，输出格式为 `'html'`（为了与该模块原始用法向后兼容）。\n\n或者，如果你捕获了异常并想让 `cgitb` 为你显示它，调用 `cgitb.handler()`。`handler()`\
  \ 的可选参数是一个包含 3 个元素的元组 `(etype, evalue, etb)`，就像 `sys.exc_info()` 的值一样。默认处理器会将输出显示为\
  \ HTML。\n\n## 类\n### `Hook`\n```python\nclass Hook:\n    ...\n```\n\n非常简单，我们从表单中提取值并将其赋值给变量。这里有一个获取用户名和密码的示例。\n\
  \n`form2.py`\n```python\nprint \"Content-type:text/html\\n\\n\"\nprint \"\"\"\n\
  <html>\n<form action=\"pform2.py\" method=\"get\">\nUsername: <input type=\"text\"\
  \ name=\"username\"> <br>\nPassword: <input type=\"text\" name=\"password\">\n<input\
  \ type=\"submit\" value=\"Submit\">\n</form>\n\"\"\"\n```\n\n最好的可能是更改 `password\
  \ type=\"hidden\"`。进行此更改并再次处理表单。\n\n`pform2.py`\n```python\nimport cgi,cgitb\n\n\
  #form=cgi.FieldStorage()\n#从字段中获取数据\n\nmypass=\"jppass\"\n\ndef webpage(username,password):\n\
  print \"\"\"\n<html>\n<h1>Entries from form</h1>h>\n<p>First name is: %s\n<p>Last\
  \ name is: %s\n<hr>\n</html>\n\"\"\" % (username,password)\n\ndef login():\nprint\
  \ \"Content-type:text/html\\n\\n\"\nform=cgi.FieldStorage()\nif form.has_key(\"\
  username\") and form.has_key(\"password\"):\ntoken=form[\"password\"].value\nif\
  \ (token==mypass):\nwebpage(form[\"username\"].value,form[\"password\"].value)\n\
  else:\nprint \"<h1>Wrong username or password!!!</h1>\"\nlogin()\n```\n\n你会注意到继承自\
  \ `'UserDict'` 的新方法 `form.has_key(self,key)`。我将其赋值给变量 `token`。如果 `\"mypass == token\"\
  ` 为真，则将处理 `webpage()` 方法并执行 `'else'` 语句 `\"Wrong username or password!!!\"`。\n\n\
  需要注意的是：本章不包含 Cookies 和 sessions。我不倾向于通过编写 cookie 来处理网页的会话管理。我发现当代码写到这一步时，我可能会迁移到像\
  \ `Django` 这样的 Web 框架，它包含在书中。你可以选择应用最小的加密数据编码，例如 `base64`。\n\n示例：\n`decode=base64.b64decode('encoded_string')`\n\
  \n加密：\n`crypt.py`\n```python\nimport base64\nprint base64.b64encode(\"mypassword\"\
  )\n```\n\n解密：\n`decrypt.py`\n```python\nimport base64\nprint base64.b64decode('bXlwYXNzd29yZA==')\n\
  ```\n\n如果我想在企业环境中使用它，可能会配置使用 `crypt` 库以获得更高的安全性。我会将加密密码存储在 `SQLite` 数据库中，我的会话将由\
  \ python `random` 库结合 `'username'` 进行一次身份验证。然后我会携带 `'username'` 参数并将会话绑定到每个页面。我考虑过将密码的一部分作为会话并结合\
  \ `random()`，以增加 `random()` 库缺陷的增加安全性。如果你已经开发到了这一步，也许你应该选择一个管理身份验证解决方案的 Web 框架，如\
  \ `Django`。\n\n## 12.2 WSGI\n根据 Python 增强计划 (PEP) 333。Web 网关接口 (WSGI) 通过使用回调工作。应用程序利用一个函数调用请求：`application(environ,\
  \ start_response)`\n\n1. `environ` - 这是一个包含 CGI 定义的环境变量的 Python 字典，包括用于 POST 变量的\
  \ `\"wsgi.input\"`。\n2. `start_response` - 用于返回 HTTP 头的回调。\n3. `start_response(status,\
  \ response_headers, exc_info=None)`\n    1. `status` - 这是一个 HTTP 状态字符串\n    2. `response_headers`\
  \ - 包含两个元组，标头和键值对。\n    3. `exc_info` - 异常处理\n\n例如：\n`first.py`\n```python\nfrom\
  \ cgi import *\ndef hello(environ, start_response):\nstart_response('200 OK', [('Content-Type',\
  \ 'text/html')])\nreturn [“<p>Hello World, and good day!!!</p>”]\nif __name__ ==\
  \ \"__main__\":\nfrom wsgiref.simple_server import make_server\nsrv = make_server('localhost',\
  \ 8080, hello)\nsrv.serve_forever()\n```\n\n是的，起初看起来很奇怪，但它是为了满足广泛的潜在框架和服务器而设计的。`start_response`\
  \ 将数据写入……（等等，文本重复了）。\n\n## 12.2.1 创建 Web 框架\n对于一种更实用的方法，让我们创建一个带变量的另一个框架。\n\n`hello.py`\n\
  ```python\nfrom cgi import *\ndef hello(environ, start_response):\nstart_response('200\
