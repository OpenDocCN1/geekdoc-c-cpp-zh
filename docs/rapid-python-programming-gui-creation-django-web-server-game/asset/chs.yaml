  \ %}\n{% block content %}\n<H3>Officers Of 2018</H3>\n<<ul>\n{% for B In object_list\
  \ %}\n<li style=\"list-style:none;\">\n<Img Src=\"../../media/{{B.upjewel}}\" height=\"\
  70\" width=\"70\" style=\"float:left;margin: 0 10px 0 0\">\n{{B.Officer}}: {{B.Name}}\n\
  <Br>{{B.Phone}}\n<Br>{{B.Email}}\n<Br> <Br> <Br>\n</li>\n{% endfor %}\n</</ul>\n\
  {% endblock %}\n```\n\n请注意内联 CSS。这并不是推荐的最佳实践，但我想说明如何装饰页面，并使用内置函数 `object_list` 从你创建的模型中提取对象来迭代\
