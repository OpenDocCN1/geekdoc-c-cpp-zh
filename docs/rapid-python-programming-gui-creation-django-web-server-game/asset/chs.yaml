  \n## 9.1.5 实例示例\n\n下一个示例使用了 `Tkinter` 网格布局管理器。`Grid` 比使用 `pack` 让一切变得更简单。考虑以下示例：\n\
  \n| 标签 1 | 输入 1 | 图片 |\n| 标签 2 | 输入 2 | |\n| 按钮 1 | 按钮 2 | |\n| 按钮 1 | 按钮 2 | |\n\
  \n这种配置使用 `grid` 比 `pack` 更容易。在下一个示例中，我们将创建一个我每天都会使用的股市计算器。\n\n### 9.1.5.1 股市计算器原型\n\
  \n该脚本将根据以下内容计算潜在利润：购买的股票数量、进入市场或购买股票的成本，以及以特定价格退出或卖出的股票。\n\n#stockproto.py\n\n```python\n\
  shares=raw_input(“Enter quantity of shares: “)\n\nentry=raw_input(“Enter price per\
  \ share: “)\n\nexit=raw_input(“Enter future exit price per share: “)\n\nprint “Cost\
  \ to get in: $%f” % ( int(shares) * float(entry))\n\nprint “Exit: $%f” % ( int(shares)\
  \ * float(exit))\n\nprofit = ( ( int(shares) * float(exit) ) - (int(shares) * float(entry))\
  \ )\n\nprint “Profit: $%f” % profit\n```\n\n结果：\n\n输入股票数量: 1000\n输入每股价格: .020\n\
  输入未来的退出退出价格: .030\n入场成本: $20.000000\n退出: $30.000000\n利润: $10.000000\n\n现在我们已经完成了原型。我们将为计算器创建一个界面。\n\
  \n#stockproto.py\n\n```python\nfrom Tkinter import *\n\ndef myinsert():\n\nshares=e1.get()\n\
  \nentry=e2.get()\n\nexit=e3.get()\n\ncost=\"Cost to get in: $%.2f\" % ( int(shares)\
  \ * float(entry))\n\nexitresult=\"Exit: $%.2f\" % ( int(shares) * float(exit))\n\
  \nprofit=( (int(shares) * float(exit) ) - (int(shares) * float(entry)) )\n\nprofitresult=\"\
  Profit: $%.2f\" % profit\n\nfor item in [cost,exitresult,profitresult]:\n\nlistb.insert(END,item)\n\
  \ndef myclear():\n\nlistb.delete(0,END)\n\nroot=Tk()\n\nlabel=Label(root, text=\"\
  Quantity Shares\").grid(row=0)\n\nlabel2=Label(root,text=\"Entry Price\").grid(row=1)\n\
  \nlabel3=Label(root,text=\"Exit Price\").grid(row=2)\n\ne1=Entry(root,bg='white')\n\
  \ne2=Entry(root,bg='white')\n\ne3=Entry(root,bg='white')\n\ne1.grid(row=0,column=1)\n\
  \ne2.grid(row=1,column=1)\n\ne3.grid(row=2,column=1)\n\nbutton=Button(root, text='calculate',\
  \ command=myinsert)\n\nbutton.grid(row=3,column=1)\n\nclearb=Button(root, text=\"\
  clear\",command=myclear)\n\nclearb.grid(row=3,column=0)\n\nlistb=Listbox(root,bg='light\
  \ blue')\n\nlistb.grid(row=4,column=1, padx=20,pady=20)\n\nroot.mainloop()\n```\n\
  \n![](img/00031.jpeg)\n\n当你准备好创建其他项目时，请记住，在添加其他计算之前，如下所示，处理 `root=Tk` 和 `mainloop`\
  \ 之间的代码会更容易。\n\n```python\nroot=Tk()\n...\n...\nroot=mainloop()\n```\n\n`button`\
  \ 命令指向两个方法，用于 `get()` 获取并执行原型中的计算以填充列表框，或清空列表框内容。\n\n## 9.1.6 练习\n\n与上一章相同，但使用 `Grid`\
  \ 代替 `pack`。\n\n## 10 WxWidgets\n\n### 10.1 Wxwidgets\n\n`WxWidgets` 是一个广泛支持且可移植的\
