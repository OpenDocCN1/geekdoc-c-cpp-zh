  \n## 7.3 生成器\n\n生成器可以在函数体内的任意点停止并向调用者返回一个值的函数，然后从停止的地方继续。这里是一个简单的函数示例：\n\n```python\n\
  ### gen1.py\ndef mygen():\n    print \"generate\"\n    yield 1\n    print \"my\"\
  \n    yield 2\n    print \"list\"\n\nif __name__==\"__main__\":\n    print mygen()\n\
  ```\n\n执行时我们得到：“<generator object mygen at 0xb788e694>”。\n\n上面的十六进制转储生成器会有不同的寄存器编号。如果我们按照如下应用循环，将得到不同的结果：\n\
  \n```python\n### gtest1a.py\nfrom gen1 import *\nblah=mygen()\nfor i in blah:\n\
  \    print i\n```\n\n输出：\n```\ngenerate\n1\nmy\n2\nlist\n```\n\n注意 `yield` 语句在旧版本中是一个关键字函数，你需要生成器设施来导入。现在，你可以直接在\
  \ IDLE 解释器中调用 `yield`：\n\n```python\n>>> from gen1 import *\n>>> blah=mygen()\n\
  >>> blah.next()\ngenerate\n1\n>>> blah.next()\nmy\n2\n>>> blah.next()\nlist\nTraceback\
  \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nStopIteration\n\
  >>>\n```\n\n生成器的目的是最小化加载到大列表所消耗的内存。生成器通常用于如 `Fibonacci` 和 `factorial` 等算法。这还需要大量的内存和处理速度。下面是一个显示\
  \ `yield` 关键字各种用法的脚本。注意 `yield` 或 `print` 语句以及列表推导式的用法。\n\n```python\n### mlist.py\n\
  def mlist():\n    print \"a\"\n    yield \"one\"\n    print \"b\"\n    yield \"\
  two\"\n    print \"c\"\n    yield \"three\"\n    print \"d\"\n    yield \"four\"\
  \n    print \"e\"\n    yield \"five\"\n    print \"f\"\n    yield \"six\"\n    print\
  \ \"g\"\n    yield \"seven\"\n    print \"h\"\n\nfor i in mlist():\n    print i\n\
  for x,y in zip([0], mlist()):\n    print x\nfor x,y in zip([0,1,2], mlist()):\n\
  \    print x\nfor x,y in zip([j for range(9) if j>5], mlist()):\n    print x\nfor\
  \ x,y in zip([j for range(9)], mlist()):\n    print x\nfor x,y in zip([j for range(9)],\
  \ mlist()):\n    print y\nimport itertools\nlist(itertools.islice(mlist(),4))\n\
  print \"blah\"\n```\n\n```\n### blah.txt\nHello world\nThis is you\nwow data\nthis\
  \ is cool\nI can wait\n```\n\n这是一个使用文件的生成器示例。\n\n```python\n### tfile1.py\nf=open(\"\
  blah.txt\",\"r\")\ndef mygen(f):\n    for i in f.readlines():\n        yield i\n\
  if __name__==\"__main__\":\n    a=mygen(f)\n    for i in a:\n        print i\n \
  \   f.close()\n```\n\n```python\n### tfile2.py\nfromfile1 import *\nfor x,y in zip([z\
  \ for range(9)], mygen(f)):\n    print repr(x),repr(y)\nfor x,y in zip([z for range(9)\
  \ if z > 5], mygen(f)):\n    print x\nfor x,y in zip([z for range(9) if z > 5],\
  \ mygen(f)):\n    print y\nfor i in mygen(f):\n    print i\nlist(mygen(f))\n```\n\
  \n结果：\n```\n0 'Hello world\\n'\n1 'This is you \\n'\n2 'wow data\\n'\n3 'this is\
  \ cool\\n'\n4 'I can wait to \\n'\n5 'jump in \\n'\n6 'the air\\n'\n```\n\n注意可以做什么。每个条目都是\
  \ `yield` 语句。\n\n## 7.4 线程\n\nPython 有同时执行任务的能力。随着 Python 编程的深入，你可能需要线程来完成工作。示例包括解析多个文件、将文件复制到多个服务器或执行杂项任务。对于\
  \ Python 语言的创始人 Guido Rossum 来说，遗憾的是，对于大多数人来说，线程编程太了……每当有人开始线程编程，他们就会给我大量的错误报告，其中一半是解释器的微妙错误，另一半是对线程的理解问题。关于这一点，我计划以简单的方法引入线程。我们将利用\
  \ Linux 或 Windows 的 `ping` 工具。以下是 Linux 上的 `ping -h`：\n\n```\nUsage: ping [-LRUbdfnqVaAD]\
  \ [-c count] [-i interval] [-w deadline] [-p pattern] [-s packetsize] [-t ttl] [-I\
  \ interface] [-M pmtudisc-hint] [-m mark] [-S sndbuf] [-T tstamp-options] [-Q tos]\
  \ [hop1 ...] destination\n```\n\n接下来将使用 `ping -c 1 address`。在开始之前，你需要一个可以 ping 和不能\
  \ ping 的地址。在 Linux 上，你可以运行 `ifconfig`（Windows 使用 `ipconfig`）来查看分配了哪些地址。\n\n```\n\
  ifconfig\nlan0 Link encap:Ethernet HWaddr 00:1c:bf:c9:6c:9a\ninet addr:10.59.26.111\
  \ Bcast:10.59.31.255 Mask:255.255.224.0\ninet6 addr: fe80::21c:bfff:fec9:6c9a/64\
  \ Scope:Link\nUP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\nRX packets:6488\
  \ errors:0 dropped:0 overruns:0 frame:0\nTX packets:5226 errors:0 dropped:0 overruns:0\
  \ carrier:0 collisions:0 txqueuelen:1000\nRX bytes:4642005 (4.4 MiB) TX bytes:1031603\
  \ (1007.4 KiB)\n```\n\n假设 10.59.26.111 是一个可以 ping 的地址。当我 ping 10.59.26.111 时，我得到：\n\
  \n```\nPING 10.59.26.111 (10.59.26.111) 56(84) bytes of data.\n64 bytes from 10.59.26.111:\
  \ icmp_req=1 ttl=64 time=0.045 ms\n64 bytes from 10.59.26.111: icmp_req=2 ttl=64\
  \ time=0.039 ms\n```\n\n\n\n\n\n```text\n2 packets transmitted, 2 received, 0% packet\
  \ loss, time 999ms\n\nrtt min/avg/max/mdev = 0.039/0.042/0.045/0.003 ms\n```\n\n\
  它将持续 ping 该地址，直到我输入 `Ctrl-C` 退出。现在，让我们来看看 ping 一个不可访问的地址（如 `10.59.26.112`）会发生什么。\n\
  \n```\nPING 10.59.26.112 (10.59.26.112) 56(84) bytes of data.\n\nFrom 10.59.26.111\
  \ icmp_seq=2 Destination Host Unreachable\n\nFrom 10.59.26.111 icmp_seq=3 Destination\
  \ Host Unreachable\n\nFrom 10.59.26.111 icmp_seq=4 Destination Host Unreachable\n\
  \nFrom 10.59.26.111 icmp_seq=6 Destination Host Unreachable\n\nFrom 10.59.26.111\
  \ icmp_seq=7 Destination Host Unreachable\n\nFrom 10.59.26.111 icmp_seq=8 Destination\
  \ Host Unreachable\n\n^C\n\n— 10.59.26.112 ping statistics —\n\n8 packets transmitted,\
  \ 0 received, +6 errors, 100% packet loss, time 7017ms\n\npipe 3\n```\n\n理解这一部分最重要的点是：准备一个你确定可以成功\
  \ ping 通的地址（例如 `google` 或 `yahoo`）和一个你确定无法 ping 通的地址。你可以使用回环回设备（`127.0.0.1`）和本地以太网设备来进行实验。\n\
  \n让我们创建一个脚本来测试一下：\n\n```python\n#!/usr/bin/python\n\n#ping.py\n\nimport os\n\nnum1=2\
  \ # 无法 ping\n\nnum2=1 # 可以 ping\n\ndat=\"ping -c 1 127.0.0.%d\" % num1\n\ndat1=\"\
  ping -c 1 127.0.0.%d\" % num2\n\na=os.system(dat1)\n\na=os.system(dat)\n```\n\n\
  当你运行脚本时，你应该得到如下结果：`python ping.py`\n\n```\nPING 127.0.0.2 (127.0.0.2) 56(84) bytes\
  \ of data.\n\nFrom 127.0.0.1 icmp_seq=1 Destination Host Unreachable\n\n— 127.0.0.2\
  \ ping statistics —\n\n1 packets transmitted, 0 received, +1 errors, 100% packet\
  \ loss, time 0ms\n\nPING 127.0.0.1 (127.0.0.1) 56(84) bytes of data.\n\n64 bytes\
  \ from 127.0.0.1: icmp_req=1 ttl=64 time=0.038 ms\n\n— 127.0.0.1 ping statistics\
  \ —\n\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n\nrtt min/avg/max/mdev\
  \ = 0.038/0.038/0.038/0.000 ms\n```\n\n*   注意：我是先从不可访问的地址开始的。接下来，我们为此创建一个函数。\n\n\
  ```python\n#ping1.py\n\nimport os\n\nnum1=2\n\nnum2=1\n\ndat=\"ping -c 1 127.0.0.%d\"\
  \ % num1\n\ndat1=\"ping -c 1 127.0.0.%d\" % num2\n\n#a=os.system(dat1)\n\n#a=os.system(dat)\n\
  \ndef mythread(x):\na=os.system(x)\n\nmythread(dat1)\n\nmythread(dat)\n```\n\n当我们运行它时，会得到相同的结果。现在，我们将利用\
  \ Python 的线程模块（threads）。\n\n```python\n>>> help('threading')\n\nHelp on module threading:\n\
  \nNAME\nthreading - 模拟 Java 线程模型的子集的模块。\n\nFILE\n/usr/lib/python2.6/threading.py\n\
