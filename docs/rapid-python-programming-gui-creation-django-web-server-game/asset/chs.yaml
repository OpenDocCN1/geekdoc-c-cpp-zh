  \n\n\n\n\n- `aggregation` - 聚合，由一个菱形连接到末端的关联，表示包含整体。\n- `generalization` - 泛化，由一个表示超类的三角形链接表示。\n\
  - `multiplicity` - 多重性，用 `(0..1)` 表示 0 或 1 个实例，`(0..*)` 表示无限制，`1` 表示恰好 1 个实例，或 `(1..*)`\
  \ 表示至少一个实例。\n\n每个图都应该包含类、关联和多重性。\n\n图 0.2:\n类图\n\n![](img/00036.jpeg)\n\n### 15.1.3\
  \ 对象图\n\n类图可以非常详细并占用大量空间。从视觉角度来看，它们可能让屏幕显得很乱，但它们非常有帮助。对象图是一种简化的图表，仅列出类及其依赖关系。\n\n\
  图 0.3:\n对象图\n\n![](img/00037.jpeg)\n\n### 15.1.4 活动图\n\n时序图、协作图和“状态图”已超出了本章的范围。活动图类似于流程图，显示活动之间如何相互依赖。活动图使用的符号与状态图相同，状态气泡除外。状态图关注过程转换的流，而不是整体流。活动图的组件包括：\n\
  \n1. 开始和停止 - 指定为实心圆点。\n2. 活动 - 圆角矩形。比状态组件更圆。\n3. 转换 - 连接活动和分支的带箭头线。\n4. 分支 - 用菱形表示以指示决策。\n\
  5. 叉叉/合并 - 用短粗体线表示。\n\n图 0.4:\n活动图\n\n![](img/00038.jpeg)\n\n组件图和部署图已远远超出了本书和本章的范围。\n\
  \n### 15.1.5 Dia 和 UML\n\n`dia` 是一个基于 GTK+ 的图形创建程序，用于 Linux 或 Windows 系统。它类似于 Visio，但非常轻量。它的优点是可以使用\
  \ XML 扩展程序的组件和设计能力。你 1 可以在 `http://dia-installer.de/` 下载 `dia`。对于 Mac 用户，你可能还需要安装\
  \ `XQuarts`。对于我们的目的，“DIA” 包含一个用于绘制 UML 图的特殊对象。`Dia` 还包含一个用于 Python 脚本的插件，并包含了几个\
  \ Python 脚本，用于扩展、转换、操作 'dia' 或由 'dia' 生成或相关的代码。以下是工具栏和画布屏幕：\n\n图 0.5:\nDIA\n\n![](img/00039.jpeg)\n\
  \n让我们玩玩 `DIA` 吧。从 UML 组件界面中选择类组件。点击屏幕上的任何地方。结果应该如下：\n\n图 0.6:\nDIA 类组件\n\n![](img/00040.jpeg)\n\
  \n下一步是在组件上右键单击（Mac 用户为双击）并选择属性（properties）。要删除一个对象，你可以点击该对象并输入 `(CTRL-X)`。你应该会在屏幕顶部看到五个标记为\
  \ Class（类）、Attributes（属性）、Operations（操作）、Templates（模板）和 Style（样式）的标签。点击“Class”标签并重命名文件为\
  \ `Shop`。接下来，选择 Attributes。通过选择“New”创建 4 个属性，并在 `\"Name:\"` 字段中输入属性名称，列表项如下：fruits（水果）、meats（肉类）、dairy（乳制品）和\
  \ juice（果汁）。你的屏幕应该如下：\n\n图 0.7:\nDIA UML 属性\n\n![](img/00041.jpeg)\n\n现在选择 Operations\
  \ 标签。创建两个操作。第一个将是 `__init__`。确保可见性（Visibility）为 Private（私有），参数（Parameters）为 fruits,\
  \ meats, dairy 和 juice。创建另一个名为 `myprint` 的操作，可见性设置为 Public（公有）。你的屏幕应该如下：\n\n图 0.8:\n\
  DIA UML 操作\n\n![](img/00042.jpeg)\n\n现在将文件保存为 `classshop.dia`。下一步是按照如下转换代码：\n\n\
  ```\ndia2code -t python classshop.dia\n```\n\n它将在执行 `Dia` 的相同目录下创建一个名为 `Shop.py`\
  \ 的文件。该文件名根据第一个标签上的 `Class` 字段名命名。\n\n```python\nclass Shop:\n    \"\"\"Class Shop\n\
  \    \"\"\"\n\n    # Attributes:\n    fruits = None # ()\n    meats = None # ()\n\
  \    dairy = None # ()\n    juice = None # ()\n\n    # Operations\n    def myprint(self):\n\
  \        \"\"\"function myprint\n        returns\n        \"\"\"\n        return\
  \ None # should raise NotImplementedError()\n\n    def ____init__(self, fruits,\
  \ meats, dairy, juice):\n        \"\"\"function __init__\n        fruits:\n    \
  \    meats:\n        dairy:\n        juice:\n        returns\n        \"\"\"\n \
  \       return None # should raise NotImplementedError()\n```\n\n如你所见，它留下了类结构。现在只需要对其进行重构。删除属性以外的所有注释，因为它们是你未来代码的示例占位符。不要忘记删除\
  \ `____init__` 中多余的下划线字符，变为 `__init__`。我通常会将构造函数与 'myprint' 语句交换。以下是重构后的代码：\n\n\
  ```python\nclass Shop:\n    \"\"\"Class Shop\n    \"\"\"\n    fruits = None # ()\n\
  \    meats = None # ()\n    dairy = None # ()\n    juice = None # ()\n\n    def\
  \ __init__(self, fruits, meats, dairy, juice):\n        self.fruits=fruits\n   \
  \     self.meats=meats\n        self.dairy=dairy\n        self.juice=juice\n\n \
  \   def myprint(self):\n        print \"fruit= \", self.fruits\n\nmyclass=Shop(\"\
  apple\",\"steak\",\"eggs\",\"berry\")\nmyclass.myprint()\n```\n\n`dia2code` 程序绝非完美。市上有有很多其他的\
  \ UML 编辑器，但这个是开源的且支持 python。\n\n\n\n\n\n同样需要记住，你脑海中最初的游戏构思会不断演变。无论你有多聪明，或者图形技巧有多高，都要预感到你超过\
  \ 80% 的想法会发生变化，有时甚至是剧烈的变化。这种经典的 80/20 经验法则源于与许多非常有经验的游戏开发者的交流。\n\n### 16.1.1 从何开始？\n\
  \n市上有大量为初学者编写的代码。如果你必须从零开始，将会遇到很多问题。专家们会反复复用相同的方法；例如诸如 `import`、`initialize`、`screen`、`construct\
  \ images`、`load`、`main loop` 等方法。通常，贸易机密隐藏在图形加速和算法之中。\n\n### 16.1.2 首先！\n\n避免在别人的游戏引擎中进行设计是明智的。该引擎是专门为他们的游戏开发环境以及他们的想法或视角构建的。在使用他们的游戏引擎时，你将受到他们想法的限制。对于游戏开发的新手来说，这可能会感到沮丧。他们还可能决定将他们全配置的引擎作为商业产品出售。你也可以这样做！变得非常精通代码复用非常重要。你应该玩玩游戏引擎吗？绝对应该。事实上，探索并发现这些局限性是强制性的。玩游戏引擎的行为会给你带来很多想法。`Blender`\
  \ 就是一个 3D 图形建模工具，它可以被修改为 3D 游戏引擎环境。使用现有的游戏引擎原型新游戏想法会有帮助。\n\n### 16.1.3 图形\n\n一些最出色且最令人着迷的游戏图形很平庸，但它们有高质量的游戏性。随着你想法的推进，图形以后可以不断改进。\n\
  \n### 16.1.4 游戏程序员的最低要求\n\n1. **编程简介**：我们已经涵盖了其中一些主题。但更重要的是你需要理解如何解决问题。\n2. **编程语言**：学习\
  \ `C` 和 `C++` 是通往精通游戏编程的良好跳板。你在 `python` 中开发的内容很容易转换为 `C/C++`。从剥离库开始。然而，如果你利用了诸如\
  \ `SDL` 和 `OpenGL` 等流行的图形库，变化将非常少且微妙。你将花费更多时间处理解析器和分析器。\n3. **数据结构与算法**：这是到目前为止在任何层次编写任何程序最重要的主题。测试并精通\
  \ `arrays`（数组）、`linked lists`（链表）、`binary trees`（二叉树）、`general trees`（树）、`hash tables`（哈希表）和\
  \ `heaps`（堆）将你在任何地方找到工作。大多数人学会后就忘了，然后很难被聘为开发者，很多人转行。\n4. **编译器**：面对现实吧，如果你需要它更快，你需要理解分词（tokenizing）、`parsing`（解析）、`code\
  \ generation`（代码生成）和垃圾回收（garbage collection）等概念。\n5. **操作系统**：你需要了解 `OS` 的局限性。`threading`（线程）、`locking`（锁）、`network\
  \ communication`（网络通信）和 `device drivers`（设备驱动）的知识对于多人游戏或读取 `DVD-ROM` 位以及从 3D 卡显示图形是无价的。\n\
  6. **人工智能**：`Heuristics`（启发式）、`planning`（规划）、`algorithms`（算法）、`bayesian networks`（贝叶斯网络）和\
  \ `natural language parsing`（自然语言解析）为你的游戏环境增加了现实概念。\n7. **数据库**：你必须将这些数据存在某个地方。\n\
  \n### 16.1.5 游戏理论\n\n如何制作别人想玩的东西？这可能是一项艰的任务。游戏公司和营销分析师研究最新趋势来收集这些信息。主题、地图设计、关卡特征、声音、故事和游戏难度之间存在微妙的平衡。最终，你希望你的游戏看起来好看而且好玩。这意味着在从概念到部署的过程中，必须采取平衡的方法。\n\
  \n### 16.1.6 原型\n\n在现实中，在你真正开始编写代码之前，你的梦想和想法不会实现。你会开始构建第一个原型，然后是直到你有几个原型版本。从原型中可以学习到很多，例如通用概念和玩法。你还会发现更多现实情况，如菜单、`screen\
  \ transitions`（屏幕切换）以及如何保存或加载游戏。这里有几考虑：\n\n1. 你需要一个故事者吗？\n2. 你需要一个算法专家吗？\n3. 你需要一个艺术家吗？`Raster`（位图）、`Vector`（矢量）或两者都要。\n\
  4. 你需要一个音乐家或音效师吗？\n\n原型也可以快速告诉你这个游戏是否值得。\n\n**需要学习的内容：**\n\n1. 最佳路径，最短路径。\n\n同样需要记住，你脑海中最初的游戏构思会不断演变。无论你有多聪明，或者图形技巧有多高，都要预感到你超过\
