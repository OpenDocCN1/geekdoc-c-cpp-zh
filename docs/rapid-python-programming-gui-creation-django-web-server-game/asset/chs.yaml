  \ `wx.SplitterWindow`\n\n**动态组件** - 用户编辑的\n- `wx.Button`\n- `wx.BitmapButton`\n\
  - `wx.Choice`\n- `wx.ComboBox`\n- `wx.Grid`\n- `wx.ListBox`\n- `wx.RadioButton`\n\
  - `wx.SpinButton`\n- `wx.SpinCtrl`\n- `wx.Slider`\n- `wx.TextCtrl`\n\n**静态组件** -\
  \ 显示\n- `wx.Gauge`\n- `wx.StaticText`\n- `wx.StaticLine`\n- `wx.StaticBox`\n- `wx.StaticText`\n\
