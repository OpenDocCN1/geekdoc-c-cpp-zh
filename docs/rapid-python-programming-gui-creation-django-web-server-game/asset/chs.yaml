  \ import newroot\nurl('^$',newroot),\n```\n\n### 13.1.4 动态内容：`datetime()`\n为了让网站更加动态，我们将对现有文件进行一些修改。\n\
  \n### views.py\n```python\nimport datetime\ndef mydate(request):\n    now = datetime.datetime.now()\n\
  \    html = \"<html><body>The current time is %s.</body></html>\" % now\n    return\
  \ HttpResponse(html)\n```\n\n### urls.py\n```python\nfrom blahsite.views import\
  \ mydate\n('^mytime/$', mydate),\n```\n\n可以访问网站 `http://localhost:8000/mytime`。问题是，这仍然是硬编码，对于快速更改来说不够灵活。我们需要让设计师在不了解\
  \ Python 的情况下获得更改 HTML 页面的机会。\n\n### 13.1.5 模板\n我喜欢在将代码交给 Web 设计师之前，先在本地测试我的模板。一旦完成，他们就可以对\
  \ HTML、JS 或 CSS 进行调整。\n\n### views.py\n```python\nfrom django.template import Template,\
  \ Context # templatemydate\ndef templatemydate(request):\n    now=datetime.datetime.now()\n\
  \    t=Template(\"<html><body>It is now {{ tempdate }}.</body></html>\")\n    html=t.render(Context({'tempdate':\
  \ now}))\n    return HttpResponse(html)\n```\n\n### urls.py\n```python\nfrom fooblah.views\
  \ import templatemydate\n('^tempdate/$',templatemydate),\n```\n\n### 13.1.6 自由的\
  \ HTML 开发\n我们几乎已经到了平面设计师可以完全获得创作自由来设计网站程度。设计师需要访问并调整 `base.html` 模板。从本质上说，它的功能就像一个\
  \ HTML 模板。\n\n你需要编辑 `settings.py` 并更改 `TEMPLATES = []` 下的以下标记：\n\n```python\n'DIRS':\
  \ [],\n'DIRS': [os.path.join(BASE_DIR,'django_templates')],\n```\n\n你还需要创建一个名为 `django_templates`\
  \ 的目录，其中将包含你的新 HTML 文件。这需要位于你网站的根目录下。在本示例中，确保该目录位于 `fooblah` 目录。\n\n### base.html\n\
  ```html\n<html>\n<body>\n<center><h1>This is my base.html</h1></center>\n<p>I can\
  \ enter all of strange stuff here</p>\n{% block content %}\n{% endblock %}\n</body>\n\
  </html>\n```\n\n在以下内容中，任何与 Python 相关的信息都可以在 `date2.html` 中找到：\n\n```html{% extends\
  \ \"base.html\" %}\n{% block content %}\nit is now {{ date }}\n{% endblock %}\n\
  ```\n\n现在为 `date2.html` 创建一个视图。\n\n### view.py\n```python\ndef d2(request):\n  \
  \  calc=datetime.datetime.now()\n    t=get_template('date2.html')\n    html=t.render(Context({'date':\
  \ calc}))\n    return HttpResponse(html)\n```\n\n### urls.py\n```python\nfrom fooblah.views\
  \ import d2\nurl('^dt/$',d2),\n```\n\n让我们修改根 URL 并使其指向 `index.html`。不要忘记在 `django_templates`\
  \ 目录中创建 `index.html`。你还需要导入名为 `render_to_response` 的库。\n\n### views.py\n```python\n\
  from django.shortcuts import render_to_response\ndef newroot(request):\n    return\
  \ render_to_response(\"index.html\")\n```\n\n### 13.1.7 管理界面\n`admin` 界面基本上是空的，因为我们还没有添加任何模型。为了给管理\
