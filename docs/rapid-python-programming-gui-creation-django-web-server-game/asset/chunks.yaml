    10.1.2 PythonCard Application


    PythonCard is a graphical WYSIWYG tool to develop a WxWidget interface for your
    project. It is the ''resourceEditor'' that creates an XML file with the correct
    coordinates for each widget such as text field, button etc... You leverage the
    PythonCard API by passing your data into each method as a dictionary file. Let''s
    create our first pythoncard application. We will start with a simple script.


