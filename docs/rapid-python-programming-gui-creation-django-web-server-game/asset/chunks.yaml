    \ library I want to utilize. Requirements file will also take additional symbols\
    \ such as '>' or '*' for additional range of versions.\n\n2.  Please note some\
    \ of the above values may change. For instance (Django==1.8.7 was the current\
    \ version I was using when I started this chapter. Gunicorn also changes I was\
