    *   Python 实现 - `IronPython`，适用于 `.NET` 和 Mono 平台的 Python；`Jython`，用 Java 编写的
    Python；`Stackless Python`，带有协程的 Python。


    本书的独特之处在于从初学者到中级编程的过渡。这种过渡将在书中多次出现，当引入 Web 应用程序和 GUI 等新主题时。你会重新回顾编程的基础方面，以简化对新模块的学习，而不是假设你已经精通之前讨论的技术。最重要的是，你将学会如何将代码转换为其他编程风格和技术的能力；这将使得你在重用可复代码时轻松采用任何风格或方法。Python
    还有一个名为 `PEP`（Python 增强计划）的增强计划，其中包含了进一步增强 Python 编程语言的潜在提案索引。Python 正在向 `3.x`
    演进，对于向后兼容性进行了微调。书末的一个章节将专门介绍兼容性变更和迁移。


    ### 历史


    Python 由 `Guido van Rossum` 在 20 世纪 80 年代后期在荷兰的 `CWI` 创建，是 `ABC` 编程语言的继承者。Python
    被重新设计为多范式编程语言，使程序员能够采用多种编程风格，如面向对象编程、结构化、函数式、面向方面编程和元编程。


    ### 安装


    强烈建议你使用 `Linux` 作为学习和使用 Python 的主要平台。但你不受此限制。几乎所有操作在 `Microsoft Windows™` 或 `Apple
    Macintosh™` 上都可以完成，遇到麻烦很少。


    ### Windows


    访问 `http://www.python.org/download`，你将找到 Windows 的安装程序。选择所有安装组件。


    如果你想在 `Microsoft Windows™` 的命令行中使用 Python，则你需要适当设置 `PATH` 变量。


    对于 `Windows™` 2000、`XP`、`2003`、`Vista`、`2008` 等……点击 `控制面板 -> 系统 -> 高级 -> 环境变量`。点击“系统变量”部分中名为
    `PATH` 的变量，然后选择：


    编辑并添加 `C:\Python27` 到行末尾。


    ### Linux


    大多数 Linux 发行版默认都安装了 Python。然而，你可能需要安装额外的包，例如文档。对于 `noppix` 或 `Debian`，运行：


    ```

    sudo apt-get install python27-doc

    ```


    通过选择默认，你将拥有 Python 核心文件，包括文档。


    你可以通过命令行使用 `python -V` 验证 Python 版本，如下：


    ```bash

    $ python -V

    Python 2.7

    ```


    ### 编辑器


    选择编辑器对于成功开发至关重要。你必须完全熟悉编辑器并了解它是如何写入文件的。例如，在 `Microsoft Windows Notepad` 上编写的脚本移植到
    Linux 或 BSD 系统时可能会出现问题。这些文件在每个语句上可能有回车符问题。你需要手动删除它们，或者进行全文件搜索替换，这可能很困难，因为你需要转义代码来查找它。转义代码是
    `\x0D` 或 `\r`。然而，通过使用兼容的编辑器可以避免这些问题。


    ### 大写敏感


    你可能注意到 `Microsoft Windows™` 不区分大小写。然而，在 Unix 变体操作系统或 Linux 上，执行脚本时需要更具体。例如，在提示符输入
    `python` 将显示以下内容：


    ```bash

    $ python

    Python 2.7.6 (default, Mar 22 2014, 22:59:56)

    [GCC 4.8.2] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    注意：要退出解释器请按 "Ctrl-D" 然后回车或输入 `exit()`。


    大写的 Python 将显示如下错误：


    ```bash

    $ Python

    -bash: Python: command not found

    ```


    如果你在 iOS 上使用 Python，Apple 接受大写的 `Python`，你不会看到错误。


