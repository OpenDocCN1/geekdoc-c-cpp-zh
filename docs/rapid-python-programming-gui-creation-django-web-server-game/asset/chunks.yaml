    1.  Create a really simple chat server with sockets


    2.  Create family address book with names, phone numbers, addresses, etc...


    12 CGI, WSGI Framework Development


    12.1 CGI


    CGI is the quick and dirty way to bring your applications to the web. The "Common
    Gateway Interface" (CGI) is an Internet standard that defines how web server software
    generates pages using a programming language or scripting languages. Perl was
    the most common scripting language used for this. However nearly any language
    can be used. Most languages have libraries that can use the CGI, but even a Unix
    bash script can be used to build pages. For instructions on how to setup Apache
    on Mac visit this url: http://www.cgi101.com/book/connect/mac.html. For windows
    or linux visit http://www.apache.org


    Below is an example of a bash script:


    #!/bin/bash


    echo " Content-type: text/html\n"


    echo "<html>"


    echo "<p>Hello world"


    echo "</html>"


    Here is an example of a python script:


    #!/usr/bin/python


    #firstweb.py


    print ''Content-type: text/html\n\n''


    print "hello world"


    The primary thing here is "Content-type" and "print" statement. In Apache Web
    server you can place your files in the ''cgi-bin'' directory to execute. You can
    also rename your files with the ''.pl'' extension which is Perl''s default extension
    for ''cgi-bin'' applications. If you have access to apache ''''httpd.conf'', you
    need to add the extension to the # ''AddType'' handler such as:


    #AddType application/x-httpd-pl .py .pyc


    The ''.py'' or ''.pyc'' will allow you to execute your python applications in
    ''/cgi-bin'' directory. Test to make sure you can execute your application using
    “chmod +ax script.py.” Below is an example of using a variable.


    #secweb.py


    print ''Content-type: text/html\n\n''


    var="Hello world"


    print """


    <html><head>


    <title>Second Web Page</title>


    </head><body>


    <h1> Messasge to you: %s</h1>


    </body>


    </html>


    """ % var


    Notice also that I place most everything within the quotes print """ """ % var.
    Here is an example of a simple form.


    #form.py


    print "Content-type:text/html\n\n"


    print """


    <html>


    <form action="pform.py" method="get">


    First Name: <input type="text" name="fname"> <br>


    Last Name: <input type="text" name="lname">


    <input type="submit" value="Submit">


    </form>


    """


    However you can leave the above form in a regular HTML file. Make sure you call
    the correct file in the action statement action="pform.py" or action="/cgi-bin/pform.py"
    . All of these examples assume you are in the ''cgi-bin'' directory. To do the
    actual work, you would use another file to retrieve the stored values in a form.


    #pform.py


    import cgi,cgitb


    form=cgi.FieldStorage()


    #get data from fields


    firstname=form.getvalue(''fname'')


    lastname=form.getvalue(''lname'')


    print "Content-type:text/html\n\n"


    print """


    <html>


    <h1>Entries from form</h1>


    <p>First name is: %s


    <p>Last name is: %s


    <hr>


    </html>


    """ % (firstname,lastname)


    Notice the import cgi, cgitb and FieldStorage() function.


    >>>help(''cgi'')


