    本许可协议适用于任何软件库或其他程序，其包含版权所有者或其他授权方发布的声明，说明其可能根据本较小通用公共许可（也称为“本许可”）的条款进行分发。每位被许可者均被称为“你”。“库”是指软件函数和/或数据的集合，这些函数和数据的准备是为了方便地与应用程序（这些程序使用其中某些函数和数据）链接，以形成可执行文件。下文的
    `Library` 指的是根据这些条款分发的任何此类软件库或作品。“基于 `Library` 的作品”是指 `Library` 本身或版权法保护下的任何衍生作品：即包含
    `Library` 或其部分的作品，不论是原封不动地包含，还是经过修改和/或直接翻译成另一种语言包含。（在此处，“翻译”包含在“修改”一术语中，但不限于此。）作品的“源代码”是指对该作品进行修改时的首选形式。对于库而言，完整的源代码意味着其包含的所有模块的所有源代码，加上任何相关的接口定义文件，以及用于控制库的编译和安装的脚本。复制、分发和修改以外的活动不受本许可的限制；它们超出了本许可的范围。使用
    `Library` 运行程序的行为不受限制，但只有当该程序的输出内容构成基于 `Library` 的作品时（与在编写该程序的工具中使用 `Library`
    无关），该输出才受本许可涵盖。这是否真实取决于 `Library` 的功能以及使用 `Library` 的程序的功能。


    ### 1

    你可以在任何介质上按接收到的样复制并分发 `Library` 完整源代码的逐字副本，前提是在每份副本上显著且适当地发布适当的版权声明和免责声明；保持所有引用本许可及不提供任何保证的通知完完整；并连同
    `Library` 一起分发本许可的副本。你可以对传输副本的物理行为收取费用，并根据你的意愿通过付费提供保证保护。


    ### 2

    你对 `Library` 的副本或多个副本或任何部分进行修改，从而形成基于 `Library` 的作品，并根据上述第 1 条的条款复制和分发此类修改或该作品，前提是你还满足以下所有条件：


    a) 修改后的作品本身必须是一个软件库。


    b) 你必须使被修改的文件带有显著的通知，说明你更改了这些文件以及更改的日期。


    c) 你必须使整个作品根据本许可的条款免费向所有第三方许可。


    d) 如果修改后的 `Library` 中的某设施引用了使用该设施的应用程序应提供的函数或数据表（调用该设施时作为参数传递的除外），则你必须做出合理努力确保在应用程序未提供此类函数或数据表的情况下，该设施能够运行，并执行其目的中仍具意义的任何部分。（例如，库中用于计算平方根的函数其目的完全独立于应用程序是明确定义的。因此，子第
    2d 条要求此函数所使用的任何应用程序提供的函数或数据表必须是可选的：如果应用程序不提供，平方根函数必须仍然能够计算平方根。）这些要求适用于修改后的作品整体。如果该作品中可识别的部分并非源自
    `Library`，并且其本身可以被合理地认为是独立且分离的作品，那么当你在将这些部分作为独立作品分发时，本许可及其条款不适用于这些部分。但当你将相同部分作为基于
