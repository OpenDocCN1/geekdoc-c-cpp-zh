    for i in list:\n    l.insert(END, i)\nroot.mainloop()\n```\n\n图 0.16:\nlistbox.py\n\
    ![](img/00025.jpeg)\n\n`menu.py`\n```python\nfrom Tkinter import *\nroot=Tk()\n\
    m=Menu(root)\nfilemenu=Menu(m,tearoff=0)\nfilemenu.add_command(label='Exit')\n\
    m.add_cascade(label='File', menu=filemenu)\nroot.config(menu=m)\nroot.mainloop()\n\
    ```\n\n图 0.17:\nmenu.py\n![](img/00026.jpeg)\n\n`scroll.py`\n```python\nfrom Tkinter\
    \ import *\nroot=Tk()\nf= Frame(root, bg='blue')\nmscroll=Scrollbar(f, bg='green')\n\
    text = Text(f, width=20, height=10, yscrollcommand=mscroll.set)\nmscroll.config(command=text.yview)\n\
    mscroll.pack(side = RIGHT, fill=Y)\ntext.pack()\nf.pack()\nroot.mainloop()\n```\n\
    \n图 0.18:\nscroll.py\n![](img/00027.jpeg)\n\n## 9.1.4 深度解析 Entry 组件\n\nEntry 组件是演示组件深入分析的完美示例。这个示例将逐部分地将其组合在一起。它也可以作为密码录输入的构建块。\n\
    \n`ent.py`\n```python\nfrom Tkinter import *\nroot=Tk()\nroot.geometry('200x210+350+70')\n\
    ent=Entry(root, bg='white')\nent.pack()\nbutton=Button(root, text='press me',\
