    \ XML 文件。你通过将数据作为字典文件传递给每个方法来利用 PythonCard API。让我们创建第一个 pythoncard 应用程序。我们将从一个简单的脚本开始。\n\
    \n# 基本文件写入\n\n# bfile.py\n\n```python\ndef FileWrite(d):\n    f=open('file.txt','a')\n\
    \    f.write(d)\n    f.close()\n\nif __name__=='__main__':\n    d=raw_input(\"\
    enter something: \")\n    FileWrite(d)\n```\n\n在上面的示例中，我们正在使用 `raw_input` 向文件写入内容。验证一切是非常重要的。\n\
    \n# test.py\n\n```python\nfrom bfile import *\nd=raw_input('enter something: ')\n\
    FileWrite(d)\n```\n\n在上面的示例中，我们正在使用 `raw_input` 向文件写入内容。验证一切是非常重要的。\n\n*(注：提供的文本包含大量重复的块和片段化代码，我已按照文档的逻辑流对结构进行了清理。)*\n\
    \n"
- fmt: "\n# 11 Sockets and Databases\n\n## 11.1 socket programming\n\nPython has several\
    \ modules which give access to the application layer such as `FTP`, `HTTP`, `Telnet`,\
    \ `SSH`, etc. There are times when you need to implement your own application\
    \ layer protocol. To do this we use `( sockets)`.\n\n```\n>>>help('socket')\n\
    ```\n\n### DESCRIPTION\n\nThis module provides socket operations and some related\
    \ functions.\n\nOn Unix, it supports `IP` (Internet Protocol) and Unix domain\
    \ sockets.\n\nOn other systems, it only supports `IP`. Functions specific for\
    \ a `socket` are available as methods of the `socket` object.\n\n### Functions:\n\
    \n- `socket()` – create a new socket object\n- `socketpair()` – create a pair\
    \ of new socket objects\n- `fromfd()` – create a socket object from an open file\
    \ descriptor\n- `gethostname()` – return the current hostname\n- `gethostbyname()`\
    \ – map a hostname to its IP number\n- `gethostbyaddr()` – map an IP number or\
    \ hostname to info\n- `getservbyname()` – map a service name and protocol name\
    \ to port number\n- `getprotobyname()` – map a protocol name (e.g. `'tcp'`) to\
    \ a number\n- `ntohs()`, `ntohl()` – convert 16 bit int from network to host byte\
    \ order\n- `htons()`, `htonl()` – convert 16 bit int from host to network byte\
    \ order\n- `inet_aton()` – convert IP string (`123.45.67.89`) to 32-bit packed\
    \ format\n- `inet_ntoa()` – convert 32-bit packed format to string (`123.45.67.89`)\n\
    - `ssl()` – secure layer support (only available if configured)\n- `socket.getdefaulttimeout()`\
    \ – get the default timeout\n- `socket.setdefaulttimeout()` – set the default\
    \ timeout\n- `create_connection()` – connects to an address, with an optional\
    \ timeout available on all platforms\n\n## 11.1.1 TCP sockets\n\nLets begin with\
    \ the TCP server. The sample code below is the client. It is important that you\
    \ run the server before testing the client. You must have both files for the code\
    \ to function properly.\n\n```python\n#tcpc.py\nimport socket\nHOST = 'localhost'\n\
    PORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.connect((HOST,\
    \ PORT))\ndata = s.recv(1024)\ns.close()\n```\n\nThe remote host is `host=localhost`,\
    \ so in this case our host is local. The port is `8001` on the remote server and\
    \ the socket platform is unix stream or `DGRAM` for datagram. The following example\
    \ uses stream. Now we need a `connect` object to bind to the host/port and `recv1024`\
    \ bits. We can then watch as data streams into the buffer. Now close the object.\
    \ Below is the server:\n\n```python\n#tcps.py\nimport socket\nHOST = '127.0.0.1'\n\
    PORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((HOST,\
    \ PORT))\ns.listen(1)\nconn, addr = s.accept()\nprint 'Connected by', addr\nconn.close()\n\
    ```\n\nThe difference here is that we are using `bind` object to bind an IP address\
    \ to a port number. We are using the `accept` object and assigning it to the `addr`\
    \ variable and then we are sending acknowledgement. Run `tcps.py` server first.\
    \ Then open up another terminal or prompt and run `tcpc.py` client program. The\
    \ server will print that it received connection from `('127.0.0.1', 44xx)` or\
    \ something similar from the client data stream. This is not really practical\
    \ for our purposes. Let's send back some data by adding something to the client.\
    \ To do this, add the following to the last line `print 'Received', repr(data)`.\
    \ Now startup the server `tcps.py` again and see the results when you connect\
    \ with the client. You not really received data yet. The server needs to send\
    \ it. For this to happen, we need to add send object to the server.\n\n```python\n\
    #tcpc1.py\nimport socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\ndata = s.recv(1024)\ns.close()\n\
    print 'Received', repr(data)\n```\n\nNow when you fire up the server and connect\
    \ with the client, you will notice that client prints it received an acknowledgement.\
    \ To further test your code, have the client send something to the server. If\
    \ you see “socket address in use”, you might want to close the previous server\
    \ application and restart the server again.\n\n```python\n#tcpc2.py\nimport socket\n\
    HOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    s.connect((HOST, PORT))\ns.send('Hello, world')\ndata = s.recv(1024)\ns.close()\n\
    print 'Received', repr(data)\n```\n\nBut first we must modify the server to receive\
    \ that data.\n\n```python\n#tcps2.py\nimport socket\nHOST = '127.0.0.1'\nPORT\
    \ = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((HOST,\
    \ PORT))\ns.listen(1)\nconn, addr = s.accept()\nprint 'Connected by', addr\ndata=conn.recv(1024)\n\
    conn.send('Acknowledge')\nprint data\nconn.close()\n```\n\nSo now we have our\
    \ client and server applications talking to each other in an efficient manner.\
    \ However, a loop may work a bit better on the server if a stream of data is to\
    \ be sent.\n\n```python\n#tcps3.py\nimport socket\nHOST = '127.0.0.1'\nPORT =\
    \ 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.bind((HOST, PORT))\n\
    s.listen(1)\nconn, addr = s.accept()\nprint 'Connected by', addr\nwhile 1:\n \
    \   data= conn.recv(1024)\n    if not data: break\n    conn.send(data)\nconn.close()\n\
    ```\n\nThe client is as follows:\n\n```python\n#tcpc3.py\nimport socket\nHOST\
    \ = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    s.connect((HOST, PORT))\nwhile 1:\n    data=raw_input(\"Text: \")\n    if not\
    \ data:\n        break\n    else:\n        s.send(data)\n        print \"sent\
    \ message:\", data\ns.close()\n```\n\nWhen you run it, the server won't disconnect\
    \ as long as the client is sending a data stream. For example here is the data\
    \ stream that I entered:\n```\nText: wow\nsend message: wow\nText: working\nsend\
    \ message: working\nText: cool\nsend message: cool\nText:\n```\nSo the client\
    \ is sending a stream of data and printing the result of sent data to the screen.\
    \ Though two print statements might be overkill, how do we really know for sure\
    \ that data is being sent? To verify this, we add a print statement to the server.\n\
    \n```python\n#tcps4.py\nimport socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
    print 'Connected by', addr\nwhile 1:\n    data= conn.recv(1024)\n    if not data:\
    \ break\n    conn.send(data)\nprint \"sent: \" , data\nconn.close()\n```\nNow\
    \ the server will print out data that has been sent and break the server when\
    \ the connection is lost. We can also add an exception for a graceful exit. (This\
    \ is done to avoid an error in the TCPIP 3 way handshake data stream.)\n\n## 11.1.2\
    \ UDP sockets\n\nUDP sockets are not that different really. The exception is the\
    \ three way handshake. With TCP you need flags `SYN`, `SYN/ACK`, and `ACK`. UDP\
    \ is less reliable but has advantages in other areas of network communication.\
    \ It will send the data regardless of acknowledgement. The following is a UDP\
    \ server:\n\n```python\n#server.py\nfrom socket import *\nhost = \"localhost\"\
    \nport = 8001\nbuf = 1024\naddr = (host,port)\nu= socket(AF_INET,SOCK_DGRAM)\n\
    u.bind(addr)\nwhile 1:\n    data,addr = u.recvfrom(buf)\n    if not data:\n  \
    \      break\n    else:\n        print \"Received message:\", data\nu.close()\n\
    ```\n\nThe client is as follows:\n\n```python\n#client.py\nfrom socket import\
    \ *\nhost = \"localhost\"\nport = 8001\nbuf = 1024\naddr = (host,port)\nu= socket(AF_INET,SOCK_DGRAM)\n\
    msg= \"Send messages to server: \";\nprint \"Message sent:\", msg\nwhile (1):\n\
    \    data = raw_input('Text: ')\n    if not data:\n        break\n    else:\n\
    \        if(u.sendto(data,addr)):\n            print \"send message:\",data\n\
    u.close()\n```\n\nNotice that this UDP data stream closes without an error. This\
    \ is because it doesn't have a 3 way handshake like TCPIP.\n\n# 11.2 Database\
    \ SQLite\n\nSQLite is one of the most convenient and quick ways to prototype and\
    \ build a SQL database. However keep in mind SQLite is more powerful then people\
    \ realize. It can compete very easily with MySQL or Postgress for small datasets.\
    \ It also has the advantage of being light weight and portable. All concepts here\
    \ can be applied to MySQL and Postgress very easily.\n"
  raw: '11 Sockets and Databases


    11.1 socket programming


    Python has several modules which give access to the application layer such as
    FTP, HTTP, Telnet, SSH, etc. There are times when you need to implement your own
    application layer protocol. To do this we use ( sockets).


    >>>help(''socket'')


    DESCRIPTION


    This module provides socket operations and some related functions.


    On Unix, it supports IP (Internet Protocol) and Unix domain sockets.


    On other systems, it only supports IP. Functions specific for a


    socket are available as methods of the socket object.


    Functions:


    socket() – create a new socket object


    socketpair() – create a pair of new socket objects [*]


    fromfd() – create a socket object from an open file descriptor [*]


    gethostname() – return the current hostname


    gethostbyname() – map a hostname to its IP number


    gethostbyaddr() – map an IP number or hostname to DNS info


    getservbyname() – map a service name and a protocol name to a port number


    getprotobyname() – map a protocol name (e.g. ''tcp'') to a number


    ntohs(), ntohl() – convert 16, 32 bit int from network to host byte order


    htons(), htonl() – convert 16, 32 bit int from host to network byte order


    inet_aton() – convert IP addr string (123.45.67.89) to 32-bit packed format


    inet_ntoa() – convert 32-bit packed format IP to string (123.45.67.89)


    ssl() – secure socket layer support (only available if configured)


    socket.getdefaulttimeout() – get the default timeout value


    socket.setdefaulttimeout() – set the default timeout value


    create_connection() – connects to an address, with an optional timeout


    [*] not available on all platforms!


    11.1.1 TCP sockets


    Lets begin with the TCP server. The sample code below is the client. It is important
    that you run the server before testing the client file. You must have both files
    for the code to function properly.


    #tcpc.py


    import socket


    HOST = ''localhost''


    PORT = 8001


    s = socket.socket(socket. AF_INET, socket. SOCK_STREAM)


    s.connect((HOST, PORT))


    data = s.recv(1024)


    s.close()


    The remote host is “host=localhost”, so in this case our host is local. The port
    is 8001 on the remote server and the socket platform is unix inet, sock stream
    or DGRAM for datagram. The following example uses stream. Now, we need a connect
    object to bind to the host/port and recv 1024 bits. We can then watch as our data
    streams into the buffer. Now, we close the object. Below is the server:


    #tcps.py


    import socket


    HOST = ''127.0.0.1''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.bind((HOST, PORT))


    s.listen(1)


    conn, addr = s.accept()


    print ''Connected by'', addr


    conn.close()


    The difference here is that we are using bind object to bind an IP address to
    a port number. We are using the accept object and assigning it to the ''addr''
    variable and then we are sending an acknowledgement.


    *   Run python ''tcps.py'' server first.


    *   Then open up another terminal or command prompt and run ''tcpc.py'' the client
    program.


    The server will print that it received a connection from (''127.0.0.1'', 444xx)
    or something similar from the client port data stream. This is not really practical
    for our purposes. Let''s send back some data by adding something to the client.
    To do this, add the following to the last line print ''Received'', repr(data).


    Now startup the server ''tcps.py'' again and see the results when you connect
    with the client (see below). You have not really received data yet. The server
    needs to send it. For this to happen, we need to add a send object to the server.


    #tcpc1.py


    import socket


    HOST = ''localhost''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.connect((HOST, PORT))


    data = s.recv(1024)


    s.close()


    print ''Received'', repr(data)


    Now when you fire up the server and connect with the client, you will notice that
    client prints that it received an acknowledgement. To further test your code,
    have the client send something to the server. If you see “socket address in use”,
    you might want to close the previous server application and restart the server
    again.


    #tcpc2.py


    import socket


    HOST = ''localhost''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.connect((HOST, PORT))


    s.send(''Hello, world'')


    data = s.recv(1024)


    s.close()


    print ''Received'', repr(data)


    But first we must modify the server to receive that data.


    #tcps2.py


    import socket


    HOST = ''127.0.0.1''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.bind((HOST, PORT))


    s.listen(1)


    conn, addr = s.accept()


    print ''Connected by'', addr


    data=conn.recv(1024)


    conn.send(''Acknowledge'')


    print data


    conn.close()


    So now we have our client and server applications talking to each other in an
    efficient manner. However, a loop may work a bit better on the server if a stream
    of data is to be sent.


    #tcps3.py


    import socket


    HOST = ''127.0.0.1''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.bind((HOST, PORT))


    s.listen(1)


    conn, addr = s.accept()


    print ''Connected by'', addr


    while 1:


    data= conn.recv(1024)


    if not data: break


    conn.send(data)


    conn.close()


    The client is as follows:


    #tcpc3.py


    import socket


    HOST = ''localhost''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.connect((HOST, PORT))


    while 1:


    data=raw_input("Text: ")


    if not data:


    break


    else:


    s.send(data)


    print "sent message:", data


    s.close()


    When you run it, the server won''t disconnect as long as the client is sending
    a data stream. For example here is the data stream that I entered:


    Text: wow


    send message: wow


    Text: working


    send message: working


    Text: cool


    send message: cool


    Text:


    So the client is sending a stream of data and printing the result of sent data
    to the screen. Though two print statements might be overkill, how do we really
    know for sure that data is being sent? To verify this, we add a print statement
    to the server.


    #tcps4.py


    import socket


    HOST = ''127.0.0.1''


    PORT = 8001


    s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)


    s.bind((HOST, PORT))


    s.listen(1)


    conn, addr = s.accept()


    print ''Connected by'', addr


    while 1:


    data= conn.recv(1024)


    if not data: break


    conn.send(data)


    print "sent: " , data


    conn.close()


    Now the server will print out data that has been sent and break the server when
    the connection stream is lost. We can also add an exception for a graceful exit.
    (This is done to avoid an error in the TCPIP 3 way handshake data stream. )


    11.1.2 UDP sockets


    UDP sockets are not that different really. The exception is the three way handshake.
    With TCP you need TCP header flags for SYN, SYN/ACK, and ACK. UDP is less reliable
    but has advantages in other areas of network communication. It will send the data
    regardless of acknowledgement. The following is a UDP server:


    #server.py


    from socket import *


    host = "localhost"


    port = 8001


    buf = 1024


    addr = (host,port)


    u= socket(AF_INET,SOCK_DGRAM)


    u.bind(addr)


    while 1:


    data,addr = u.recvfrom(buf)


    if not data:


    break


    else:


    print "Received message:", data


    u.close()


    The client is as follows:


    #client.py


    from socket import *


    host = "localhost"


    port = 8001


    buf = 1024


    addr = (host,port)


    u= socket(AF_INET,SOCK_DGRAM)


    msg= "Send messages to server: ";


    print "Message sent:", msg


    while (1):


    data = raw_input(''Text: '')


    if not data:


    break


    else:


    if(u.sendto(data,addr)):


    print "send message:",data


    u.close()


    Notice that this UDP data stream closes without an error. This is because it doesn''t
    have a 3 way handshake like TCPIP sockets. You now have enough information to
    build applications that utilize a network connection.


    11.2 Database SQLite


    SQLite is one of the most convenient and quick ways to prototype and build a SQL
    database. However keep in mind SQLite is more powerful then people realize. It
    can compete very easily with MySQL or Postgress for small datasets. It also has
    the advantage of being light weight and portable. All concepts here can be applied
    to MySQL and Postgress very easily.


    11.2.1 SQLite Primer'
