    \ import post_save\nfrom django.dispatch import receiver\n\nclass Profile(models.Model):\n\
    \    user = models.OneToOneField(User, on_delete=models.CASCADE)\n    fullnameandaddress\
    \ = models.TextField(max_length=500, blank=True)\n    location = models.CharField(max_length=30,\
    \ blank=True)\n    birthdate = models.DateField(null=True, blank=True)\n\n@receiver(post_save,\
    \ sender=User)\ndef update_user_profile(sender, instance, created, **kwargs):\n\
    \    if created:\n        Profile.objects.create(user=instance)\n        instance.profile.save()\n\
    ```\n\n创建模型后，请运行以下命令：\n\n```bash\npython manage.py makemigrations\npython manage.py\
    \ migrate\n```\n\n# forms.py\n\n```python\nfrom django import forms\nfrom django.contrib.auth.forms\
    \ import UserCreationForm\nfrom django.contrib.auth.models import User\n\nclass\
    \ SignUpForm(UserCreationForm):\n    birthdate = forms.DateField(help_text='必填。格式:\
    \ YYYY-MM-DD')\n    class Meta:\n        model = User\n        fields = ('username',\
    \ 'birthdate', 'password1', 'password2', )\n```\n\n# views.py\n\n```python\nfrom\
    \ django.contrib.auth import login, authenticate\nfrom django.shortcuts import\
    \ render, redirect\nfrom signup.forms import SignUpForm\n\ndef Signup(request):\n\
    \    if request.method == 'POST':\n        form = SignUpForm(request.POST)\n \
    \       if form.is_valid():\n            user = form.save()\n            user.refresh_from_db()\
    \ # 加载配置\n            user.profile.birthdate = form.cleaned_data.get('birth_date')\n\
    \            user.save()\n            raw_password = form.cleaned_data.get('password1')\n\
    \            user = authenticate(username=user.username, password=raw_password)\n\
    \            login(request, user) \n            return redirect('/')\n    else:\n\
    \        form = SignUpForm()\n    return render(request, 'signup.html', {'form':\
    \ form})\n```\n\n# signup.html\n\n```html\n{% extends 'base.html' %}\n{% block\
    \ content %}\n<h2>注册</h2>\n<form method=\"post\">\n    {% csrf_token %}\n    {{\
    \ form.as_p }}\n    <button type=\"submit\">注册</button>\n</form>\n{% endblock\
    \ %}\n```\n\n# admin.py\n\n```python\nfrom signup.models import Profile\nfrom\
    \ django.contrib.auth.admin import UserAdmin\nfrom django.contrib.auth.models\
    \ import User\n\nclass ProfInline(admin.StackedInline):\n    model=Profile\n\n\
    class ProfAdmin(admin.ModelAdmin):\n    inlines = (ProfInline,)\n\nadmin.site.unregister(User)\n\
    admin.site.register(User,ProfAdmin)\n```\n\n上面的示例是一种添加模型、表单和视图的非常简化的方法，它通过添加配置模型来扩展了\
    \ `User` 库。`admin.py` 将利用 `inline` 方法将该模型组合在 `Users` 的管理界面中。\n\n访问你的网站：`http://localhost:8000/admin`\n\
    \n选择用户。`'Profile'` 模型现在可见了，并带有该用户的额外数据。\n\n## 13.1.13 练习\n\n1. 让博客运行起来。\n2. 模板样式调整。\n\
    3. 让 flatpages 在博客站点上正常工作。\n4. 通过管理界面添加博客内容。\n5. 添加评论方法和你自己的自定义功能。\n6. 结合 Bootstrap\
    \ 和 Django。你可以利用内置库来使用 bootstrap 工具。\n\n   * `python-bootstrapform` - 为 Django\
    \ 表单生成 twitter-bootstrap 表单输出 - Python 2.x\n   * `python-bootstrapform-doc` -\
    \ 为 Django 表单生成 twitter-bootstrap 表单输出 - doc\n   * `python3-bootstrapform` - 为\
    \ Django 表单生成 twitter-bootstrap 表单输出 - Python 3.x\n   * `pip install django-boostrap3`\
    \ - 将模板转换为 bootstrap 3 代码\n\n# 14 Apache, Heroku, AWS 与云\n\n## 14.1 额外的 Django\
    \ 特性\n\n### Apache\n\n在支持 Apache Web 服务器的平台上添加 Django 非常简单。下面的示例是一个名为 `thinktank.com`\
    \ 的网站的配置。如果你没有安装 Apache，可以跳过此节。将 `thinktank` 替换为你的 Django 站点名称。请注意你正在创建一个完整路径的别名。\n\
    \n```apache\nAlias /media/ /home/knoppix/thinktank/media/\nAlias /static/ /home/knoppix/thinktank/static/\n\
    ```\n\n编辑并调整 `httpd.conf` 文件或 `site-enabled` 目录，以及你网站的 `name_configuration.conf`。\n\
    \n```apache\nWSGIScriptAlias / /home/knoppix/thinktank/thinktank/wsgi.py/\n<Directory\
    \ /home/knoppix/thinktank>\n    <Files wsgi.py>\n        Allow from all\n    \
    \    Order allow,deny\n    </Files>\n</Directory>\n```\n\n`wsgi.py` 中包含：\n\n```python\n\
    import os\nfrom django.core.wsgi import get_wsgi_application\nos.environ.setdefault(\"\
    DJANGO_SETTINGS_MODULE\", \"thinktank.settings\")\n```\n\n(注：原文后部分存在大量重复和碎片化的配置描述，已根据要求保留格式并翻译核心逻辑)\n\
    \n"
- fmt: "\nAlso import the following in `settings.py`: `import dj_database_url`.\n\n\
    The rest of the configuration is making sure that you have static media setup\
    \ correctly. Remember that the storage is ephemeral. What this means is that you\
    \ can push your files to the server as static files. Media files added later will\
    \ be deleted. I recall that I had to run `python manage.py collectstatic` on heroku\
    \ server a few times to explicitly keep my media from becoming purged. I recommend\
    \ using AWS S3 storage to maintain your media files.\n\n## 14.1.2 Amazon AWS S3\
    \ storage\n\nYou will need to create an account on amazon AWS and read the basic\
    \ documentation for S3 storage. You get to utilize a storage system called 'S3'\
    \ free for a year.\n\nHere is an example of amazon s3 storage. You will be adding\
    \ this to the bottom of your `settings.py`.\n\n```python\nAWS_STORAGE_BUCKET_NAME\
    \ = 'bucket_name_site_name'\nAWS_QUERYSTRING_AUTH=False\nAWS_ACCESS_KEY_ID = 'access_key'\n\
    AWS_SECRET_ACCESS_KEY = 'secret_access_key'\nAWS_S3_CUSTOM_DOMAIN = '%s.s3-website-us-west-2.amazonaws.com'\
    \ % AWS_STORAGE_BUCKET_NAME\nSTATIC_URL = '/static/'\nSTATIC_ROOT='staticfiles'\n\
    MEDIA_ROOT='media'\nMEDIAFILES_LOCATION='media'\nMEDIA_URL='https://%s/' % AWS_S3_CUSTOM_DOMAIN\n\
    DEFAULT_FILE_STORAGE = \"storages.backends.s3boto.S3BotoStorage\"\n```\n\nOn aws.amazon.com\
    \ inside the s3 Mangement Console, I created a bucket called 'bucket_name_site_name'.\
    \ The bucket also has permissions. I granted my users full access to 'Everyone'\
    \ with list and view access, however there is an Edit bucket policy.\n\n```json\n\
    {\n  “Version”: “2008-10-17”,\n  “Statement”:[\n    {\n      “Sid”:”AllowPublicRead”,\n\
    \      “Effect”:”Allow”,\n      “Principal”:{\n        “AWS”:”*”\n      },\n \
    \     “Action”:”S3:GetObject”,\n      “Resource”:”Arn:Aws:S3:::Mvda194s3/*”\n\
    \    }\n  ]\n}\n```\n\nThe configuration settings above are very weak with regards\
    \ to security. This configuration is recommended for simple storage of images,\
    \ audio files, and documents. If more security is needed, run the git commands\
    \ above, then run “collectstatic”. Notice that no changes were made to “CORS”.\
    \ Keep in mind that you have limited storage on heroku. This is why I recommend\
    \ learning to use AWS services.\n\n## 1. Admin\n\nThe `django-admin` is crazy\
    \ powerful as you might have discovered playing around. You can can easily create\
    \ a site, build a model, and import data. An admin can begin data manipulation\
    \ within minutes of creating the site using only the admin screen. You can also\
    \ make easy adjustments to admin such as `list_display=[]` and `search_fields=[]`,\
    \ and pass the table values as a list of what you want to display or search.\n\
    \n## 1. Generic Generic Views\n\nHere is an extremely fast method of creating\
    \ a db model, and a view to display your new data:\n\n### add to models.py\n\n\
    ```python\nclass Officer(models.Model):\n    Officer=models.CharField(max_length=60)\n\
    \    Name=models.CharField(max_length=60)\n    Phone=models.CharField(max_length=60)\n\
    \    email=models.CharField(max_length=60)\n    upjewel=models.FileField(upload_to=\"\
    images/\")\n    def __unicode__(self):\n        return self.Officer\n```\n\nAlso\
    \ run the following:\n`python manage.py makemigrations`\n`python manage.py migrate`\n\
    \n### add to views.py\n\n```python\nclass listofficer(ListView):\n```\n\nDepending\
    \ on which model you put this under, it will look for that file in that directory\
    \ example:\nThe location of my file was found in: `django_templates/blog/officer_list.html`.\n\
    \nYou can check the log files for this and add the following to `officer_list.html`.\
    \ This example uses the 'getbootrap' jumbo theme.\n\n```html\n{% extends \"blogbase.html\"\
    \ %}\n{% block content %}\n<H3>Officers Of 2018</H3>\n<ul>\n{% for B In object_list\
    \ %}\n<li style=\"list-style:none;\">\n<Img Src=\"../../media/{{B.upjewel}}\"\
    \ height=\"70\" width=\"70\" style=\"float:left;margin: 0 10px 0 0\">\n{{B.Officer}}:\
    \ {{B.Name}}\n<Br>{{B.Phone}}\n<Br>{{B.Email}}\n<Br> <Br> <Br>\n</li>\n{% endfor\
    \ %}\n</ul>\n{% endblock %}\n```\n\nPlease notice the in-line CSS. This is not\
    \ recommended best practice but I wanted to illustrate how simple it is to dress\
    \ up the page and iterate the contents of the `model()` using `object_list` built\
    \ in function for extracting objects from the model you created. Add the following\
    \ to `urls.py`:\n\n```python\nurl('^officers/',listofficer.as_view()),\n```\n\n\
    ### admin.py\n\n```python\nfrom blog.models import Officer\nclass OfficerAdmin(admin.ModelAdmin):\n\
    \    display_fields=[\"officer\"]\nadmin.site.register(Officer,OfficerAdmin)\n\
    ```\n\nThis model uses `FileField` to upload images. You will also need to adjust\
    \ `urlpatterns` in `url.py` to include the ability to add media files.\n\n###\
    \ urls.py\n\n```python\nfrom django.conf import settings\nfrom django.conf urls\
    \ import static\n\nurlpatterns = [\n    url('^officers/',listofficer.as_view()),\n\
    ] + static(settings.MEDIA_URL, document_root=settings.MEDIA_ROOT)\n```\n\nThis\
    \ model uses `FileField` to upload images. You will also need to adjust `urlpatterns`\
    \ in `url.py` to include the ability to add media files.\n"
