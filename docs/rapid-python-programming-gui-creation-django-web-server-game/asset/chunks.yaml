    ### 表 0.1：常用运算符


    | 运算符 | 名称 | 示例 |

    | :--- | :--- | :--- |

    | `+` | 加号 | `2+2` 得到 4 |

    | `-` | 减号 | `4-2` 得到 2 |

    | `*` | 乘法 | `2*6` 得到 12 |

    | `/` | 除法 | `6/2` 得到 12 |

    | `%` | 取模 | `8%3` 得到 2 |

    | `<` | 小于 | `8<4` 得到 false |

    | `>` | 大于 | `8>4` 得到 true |

    | `<=` | 小于等于 | `8<=4` 得到 false |

    | `>=` | 大于等于 | `8>=4` 得到 false |

    | `==` | 等于 | `x=2; x==2` 得到 true |

    | `!=` | 不等于 | `x=2; x!=3` 得到 true |

    | `**` | 次方 | `2**2` 得到 4，`2**3` 得到 8 |


    输入以下表达式：


    ```

    >>> 8+8

    16

    >>> 8-4

    4

    >>> 4*2

    8

    >>> 8/2

    4

    >>> 2+3*8

    26

    >>> 2/3

    0

    >>> 2.0/3.0

    0.66666666666666663

    ```


    注意在等式 `2+3*8` 中，乘法在加法之前。你可以通过括号来改变顺序，`(2+3)*8` 得到 40。同样注意 `2/3` 得到 0。因为它是整数，所以返回相应的整数。如果你知道该表达式会产生小数，请从开始提供小数，否则你会损坏输出输出。


