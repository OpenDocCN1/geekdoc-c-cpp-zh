    \ `blahClass` and an instance of the class called `blahObj`. You call the method\
    \ of the object like `blahObj.method(arg1)`, python will convert it as `BlahClass.method(blahObj,arg1)`.\
    \ Even if you have a method with no arguments, you still have to define a method\
