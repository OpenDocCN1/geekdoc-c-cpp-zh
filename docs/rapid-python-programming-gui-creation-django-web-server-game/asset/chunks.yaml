    Results:


    1|john|doe


    This feature makes SQLite very robust. You can quickly script something in bash
    or AWK. You can also import ''OS'' or ''System'' to access the application externally
    and use languages such as Perl, Python, ''C'', or ''C++''. Libraries are also
    available so that you don''t have to call the program externally.


    11.2.2 Python SQLite


    As of version 2.6 SQLite library is included in core python package. Let''s create
    another table called user.db similar to our primer above.


    #create.py


    # create user.db


    import sqlite3


    con = sqlite3.connect(''user.db'')


    cur = con.cursor()


    cur.execute(''CREATE TABLE userinfo (id INTEGER PRIMARY KEY, fname VARCHAR(20),


    lname VARCHAR(30))'')


    con. commit() # comment back


    cur. execute(''INSERT INTO userinfo (id, fname, lname) VALUES(NULL, "john", "doe")'')


    con.commit()


    cur.execute(''SELECT * FROM userinfo'')


    print cur. fetchall()


    To list a record:


    #record.py


    # list information in table


    import sqlite3


    con=sqlite3.connect(''user.db'')


    cur=con.cursor()


    cur.execute(''SELECT * FROM userinfo'')


    print cur.fetchall()


