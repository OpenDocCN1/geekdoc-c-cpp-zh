    The program dia2code is by no means perfect. There are tons of other UML editors
    out there but this one is open source and works with python. The idea is to rapidly
    prototype something using a visual tool then export it to functional code. There
    are other UML tools that are more robust but they have weaknesses as well. Cost
    being the primary weakness. The other is language compatibility. With dia you
    have a great deal of flexibility. You can sit in a meeting and immediately start
    flow charting and modeling an application as it is being discussed.


    The visual aspects of the code become immensely important for marketing purposes
    and for managers that have no programming experience. Since documentation is sparse
    on the web, you can reverse engineer more of “dia uml” details and configuration
    using “ dia2uml” or “ autodia”. ''Autodia'' will create an xml file as follows:


