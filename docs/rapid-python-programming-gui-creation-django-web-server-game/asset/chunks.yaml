    1.  REST Representation State Transfer


    There are already many tools for REST API. Django has a Rest Framework API library
    or you can use the popular TastyPie library. Either way Django is inherently designed
    to be RESTful. These are the RESTful URL design tags to add , append, edit and
    delete objects in a RESTFul application.


    http://localhost:8080/blog


    http://localhost:8080/blog/add


    http://localhost:8080/blog/1


    http://localhost:8080/blog/1/edit


    http://localhost:8080/blog/1/delete


    This simple design is not always easy to do correctly. Even with a proven framework
    such as the Rest Framework API or TastyPie, the only thing missing from the above
    example is lsimplejsonl and some serialization or XML. Shown below are two examples
    illustrating how to utilize ''simplejson''.


    from django.http import JsonResponse


    def blahview(request):


    data={}


    return JsonResponse(data)


    #and or serialize


    #html=render_to_string(“blah.html”, data)


    #serial_data= simplejson.dumps({”html”:html})


    #return HttpResponse(serial_data,mimetype=”application/json:)


    So if you are in a bind, you can whip up your own implementation of REST or utilize
    a proper library (highly recommended).


    15 UML


    15.1 UML


    Unified Modeling Language ( UML) is a modeling language used in object-oriented
    software engineering. The standard was created by Object Management Group ( OMG)
    a consortium that sets standards for distributed object-oriented systems and modeling
    programs and processes for model-based standards. UML has a visual set of models
    that construct and document artifacts of an object-oriented software development
    system. There are nine modeling diagrams that represent the architectural blueprints
    of the systems development environment.


    *   Use case diagrams


    *   Class diagrams


    *   Object diagrams


    *   Sequence diagrams


    *   Collaboration diagrams


    *   Statechart diagrams


    *   Activity diagrams


    *   Component diagrams


    *   Deployment diagrams


    15.1.1 Use Case diagrams


    Use-case diagrams describe applications from the position of the external observer.
    It contains a stick figure for an actor, a message arrow to represent communication,
    and an oval to represent use-case.


    Figure 0.1:


    Use Case


    ![](images/00035.jpeg)


    You can have a single actor initiate multiple message requests to a single use
    case or several use case processes. The benefits of these types of diagrams are
    to demonstrate scenarios for application features.


    15.1.2 Class diagrams


    The class diagram gives an overview of the systems relationship with another static
    class relationships. The class relationship consists of the following:


    *   association - a relationship between two or more classes designated by a line
    connecting the class diagrams.'
