    # Preface


    Python is one of the few programming languages that is not only easy to learn
    but also very powerful. Most books on programming focus on the skill level of
    the reader rather then the topic for which the reader picked the book. I got the
    idea to write this book after reading "Programming - Principles and Practice Using
    C++" written by Bjarne Stroustrup the creator of C++ programming language. While
    everything here will be presented differently, the philosophy of programming,
    learning and the methods he presented is what influenced me.


    Programs by nature evolve towards complexity and most languages foster the ability
    to design in a structured way even if the language is not a structured programming
    language. Python supports multi-paradigms (such as object oriented, imperative,
    and functional). The design of Python leans towards a clean modular style with
    everything loosely considered an object.

