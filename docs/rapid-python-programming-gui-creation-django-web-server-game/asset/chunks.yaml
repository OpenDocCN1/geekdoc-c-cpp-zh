    \ import HttpResponse\n\ndef hello(request):\n    return HttpResponse(\"My new\
    \ web view\")\n```\n\n现在打开 “fooblah” 目录下的 `settings.py`，并如下方式向 `INSTALLED_APPS`\
    \ 中添加 “blah”：\n\n```python\nINSTALLED_APPS = (\n    'django.contrib.admin',\n\
    \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'django.contrib.flatpages',\n\
    \    'django.contrib.sites',\n    'blah',\n)\n```\n\n下一步是编辑 “fooblah” 目录下的 `urls.py`。\n\
    \n### urls.py\n```python\nfrom blah.views import hello\n# 添加在 (r'^admin/' 等...)\
    \ 下方，不要忘记逗号 \",\"\nurl('^hello/$', hello),\n```\n\n注意，我们正在将 `^hello` 匹配到函数 `hello`。要查看你的页面，请在浏览器中打开\
    \ `http://localhost:8000/hello`。如果你进入其他目录，将得到 404 错误。让我们向根站点添加一些内容并创建以下函数。\n\n\
    ### views.py\n```python\ndef newroot(request):\n    return HttpResponse(\"oh wow\"\
    )\n```\n\n### urls.py\n```python\nfrom blahsite.views import newroot\nurl('^$',newroot),\n\
    ```\n\n### 13.1.4 动态内容：`datetime()`\n为了让网站更加动态，我们将对现有文件进行一些修改。\n\n### views.py\n\
    ```python\nimport datetime\ndef mydate(request):\n    now = datetime.datetime.now()\n\
    \    html = \"<html><body>The current time is %s.</body></html>\" % now\n    return\
    \ HttpResponse(html)\n```\n\n### urls.py\n```python\nfrom blahsite.views import\
    \ mydate\n('^mytime/$', mydate),\n```\n\n可以访问网站 `http://localhost:8000/mytime`。问题是，这仍然是硬编码，对于快速更改来说不够灵活。我们需要让设计师在不了解\
    \ Python 的情况下获得更改 HTML 页面的机会。\n\n### 13.1.5 模板\n我喜欢在将代码交给 Web 设计师之前，先在本地测试我的模板。一旦完成，他们就可以对\
    \ HTML、JS 或 CSS 进行调整。\n\n### views.py\n```python\nfrom django.template import\
    \ Template, Context # templatemydate\ndef templatemydate(request):\n    now=datetime.datetime.now()\n\
    \    t=Template(\"<html><body>It is now {{ tempdate }}.</body></html>\")\n   \
    \ html=t.render(Context({'tempdate': now}))\n    return HttpResponse(html)\n```\n\
    \n### urls.py\n```python\nfrom fooblah.views import templatemydate\n('^tempdate/$',templatemydate),\n\
    ```\n\n### 13.1.6 自由的 HTML 开发\n我们几乎已经到了平面设计师可以完全获得创作自由来设计网站程度。设计师需要访问并调整 `base.html`\
    \ 模板。从本质上说，它的功能就像一个 HTML 模板。\n\n你需要编辑 `settings.py` 并更改 `TEMPLATES = []` 下的以下标记：\n\
    \n```python\n'DIRS': [],\n'DIRS': [os.path.join(BASE_DIR,'django_templates')],\n\
    ```\n\n你还需要创建一个名为 `django_templates` 的目录，其中将包含你的新 HTML 文件。这需要位于你网站的根目录下。在本示例中，确保该目录位于\
