    Javascript might work better for real time charting. Morningstar.com and Bloomberg
    both provide API''s for metrics and analysis.


    18 Closing Thoughts


    18.1 Closing Thoughts


    As the title suggests, this is rapid programming. Your ultimate goal is to use
    python to create programs or applications that are either free, for sale or just
    fun. Programming allows you to automate repetitive tasks freeing you to focus
    on other things.


    Most authors expect you to read every word in the book. While this works for some,
    I know it''s possible you''re not going to do that. Chances are you skipped a
    lot just to get here. Hopefully, you have written at least a few lines of code.
    It is my goal that this book is flexible enough to appeal to beginner and experienced
    programmers alike. It is filled with delicious reusable morsels of code that are
    also available on my GitHub. Software engineering is complex system made up of
    simple programs that when put together make amazing and fun things possible.


    If you do use any of the code from the book, please take a minute to send me a
    message and let me know what you think!


    See you in cyberspace.


