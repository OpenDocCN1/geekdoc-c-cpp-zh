    这本书既适用于经验丰富的程序员，也适用于零基础的学者。语言的复杂度会逐渐递进，但概念将保持简单且易于理解。读者不受限于任何先前的特定概念。所有的概念和示例都可以轻松地修改和重用。你将能够快速上手
    Python 的高级特性。


    劳动力市场对新产品开发的快速交付提出了更高要求。Python 在游戏市场中也正成为中坚力量，应用于整个游戏开发周期，如渲染、解析、统计和核心开发。Python
    可以 `C/C++` 轻松扩展以提高速度和性能。它在学术界被广泛用于科学、数学、工程、模拟和其他计算实验。Python 最大的卖点是海量的预写工具库。以下是工具的亮点，涵盖了实际存在工具的约
    10%。


    *   集成开发环境 - `Boa Constructor`，一个跨平台的 Python IDE ；`EasyEclipse`，一个适用于 Python 及其他语言的开源
    IDE。

    *   应用 - `BitTorrent` 原始客户端以及其他衍生版本；`Gajim`，即时消息客户端；`Resolver One`，一个电子表格。

    *   Web 应用程序 - 提要聚合器 (`Planet`)、一个用户友好的内容管理系统 (`Plone`)、一个缺陷跟踪系统 (`Roundup`)。

    *   视频游戏 - `Civilization 4` 的大部分任务都使用 Python，`Eve “online"` 使用 `Stackless Python`。`PyGame`
    拥有大量用纯 Python 编写的游戏。

    *   Web 框架 - `CherryPy` 是一个面向对象的 Web 应用服务器和框架；`Django` 是一个 MVC（模型、视图、控制器）Web 框架；`Zope`
    是用于构建内容管理系统的应用程序服务器。

    *   图形框架 - `Pygame` 拥有 `Simple DirectMedia Layer` (`SDL`) 的 Python 绑定；`Pyglet`
    是一个用于 Python 的跨平台窗口和多媒体库；`PIL`（Python Imaging Library）是一个处理图像的模块；`Soya 3D` 是一个
    Python 的高级 3D 游戏引擎。

    *   GUI 框架 - `PyGTK` 是使用 `GTK+` 的流行跨平台 GUI 库；`PyQt` 是另一个使用 `Qt` 的跨平台 GUI 库；`wxPython`
    是 `wxWidgets` 的移植版本，也是一个 Python 的跨平台 GUI 库。

    *   科学包 - `BioPython`，一个 Python 分子生物学套件；`SciPy` 是一个科学和数值例程库。

    *   数学库 - `matplotlib`，一个提供了类似 `MATLAB` 绘图和数学函数的扩展；`NumPy` 是一个语言扩展，增加了对大型、快速的多维数组和矩阵的支持。

    *   其他开发包 - `Cheetah`，一个 Python 驱动的模板引擎和代码生成工具；`mod python` 是一个 Apache 模块，允许 Python
    脚本直接集成到 Apache Web 服务器；`Twisted` 是一个 Python 的网络框架。

    *   作为脚本语言嵌入 - `GIMP`（图形图像处理程序）；`Blender`，一个 3D 图形程序；`Inkscape` 是一个图形程序；`Poser`
    是一个使用 `PoserPython` 工具集的 3D 渲染和动画软件程序。

    *   商业用途 - `Google` 使用 Python 处理许多任务，包括 Web 应用的后端；`Maya` 是一个专业的 3D 建模软件；`NASA`
