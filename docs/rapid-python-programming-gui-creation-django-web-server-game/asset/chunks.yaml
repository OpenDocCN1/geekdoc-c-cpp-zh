    3.3.6 Exercises


    1.  Go through the examples above using the interactive interpreter.


    2.  Convert ''whileguess.py'' into a function and call it ''guess()''.


    3.  Create a function to calculate Celsius and convert to Fahrenheit upon user
    input. Use a while loop to process the temperature until user enters ''x'' to
    exit.


    4.  Using the following list (list="I will master strings"). Use a for loop to
    print the word ''master''.


    4 Files


    4.1 File


    Working with files made simple.


    4.1.1 The Basics


    simple open example:


    >>> blah=open("data.txt", ''w'')


    >>> blah.write("I am learning python\nI love python\nPython is great")


    >>> blah.close()


    >>>


    4.1.2 Variations of Reading Data


    File ''data.txt'' contains the following:


    I am learning python


    I love python


    Python is great


    ''file1.py'' contains the following:


    #!/usr/bin/python


    # file1.py


    blah = open("data.txt", "r")


    print blah.readlines()


    blah.close()


    Results:


    [''I am learning python\n'', ''I love python\n'', ''python is great\n'', ''\n'']


    Let''s make changes to ''file2.py'' with the following:


    #!/usr/bin/python


    # file2.py


    blah = open("data.txt", "r")


    list = blah.readline()


    for i in list:


    print i


    blah.close()


    results:


    I


    a


    m


    l


    e


    a


    r


    n


    ...


    Here is something to remember: ''list = blah. read()'' does the same except output
    is on separate lines. Try it out with the script above and review the differences.


    #!/usr/bin/python


    # file2.py


    blah = open("data.txt", "r")


    list = blah.readlines()


    for i in list:


    print i


    blah.close()


    results:


    I am learning python


    I love python


    python is great


    Adjust ''file3.py'' again:


    #!/usr/bin/python


    # file3.py


    blah = open("data.txt", "r")


    blah.seek(5)


    print blah.readline()


    blah.close()


    results:


    learning python


    4.1.3 Parsing a file


    In the previous chapters you learned to parse strings on a very limited bases.
    This section will provide a more detailed example on how to parse information
    in a very simple way. Pay ATTENTION to indentation!


    #!/usr/bin/python


    # parse.py


    blah = open("data.txt", "r")


    list=blah.readlines()


    for i in list:


    if ''love'' in i:


    new=i


    print "print specific line ''love'' in file"


    print new


    change=new.split()


    print "print specific list in file as a list"


    print change


    print "print specific field in list ''love''"


    print change[1]


    for i in change:


    if ''python'' in i:


    wow=i


    print "search for specific field in list ''python'' to print wow"


    blah.close()


    Results:


    print specific line ''love'' in file


    I love python


    print specific list in file as a list


    [''I'', ''love'', ''python'']


    print specific field in list ''love''


    love


    search for specific field in list ''python'' to print


    python


    The above example demonstrates the ability to only print a specific instance on
    a specific line of a file even if there might be more than one instance of the
    word ''python'' in the file.


    4.1.4 Binary Files


    simple open binary file:


    >>> blahbin = open ( ''binary.txt'', ''wb'' )


    >>> blahbin.write ( ''write binary data.'' )


    >>> blahbin.close()


    >>>


    >>> blahbin = open ( ''binary.txt'', ''rb'' )


    >>> print blahbin.read()


    >>> blahbin.close()


    >>>


    4.1.5 Pickle


    help(''pickle'')


    Now that we can read and write string, what about lists, tuples, and dictionaries?


    4.1.6 Let''s Pickle


    ''Pickle'' is used with databases and a few other python frameworks to assist
    with persistent data manipulation.


    #!/usr/bin/python


    #apickle.py


    import pickle


    filePickle = open ( ''pickleFile.txt'', ''w'' )


    list = [ ''I'', ''love'', ''python'', 1,2,3, ''ok'' ]


    list2 = { ''firstname'': ''john'', ''lastname'': ''doe'', 1: ''one''}


    pickle.dump ( list, filePickle)


    pickle.dump ( list2, filePickle)


    filePickle.close()'
