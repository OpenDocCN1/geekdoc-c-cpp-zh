    \ `csv` 文件进行读取，并将其命名为 `data.csv`。它将包含内容：\n\n### data.csv\n\n```csv\n0a,0b,0c,0d\n\
    1a,1b,1c,1d\n2a,2b,2c,2d\n```\n\n### third.py\n\n```python\n# call data.csv\n\
    from easygui import *\n\nresult=[]\nblah=open(\"data.csv\", \"r\")\n\nfor i in\
    \ blah.readlines():\n    result.append(i)\n\ntextbox(\"data\", \"title\", result)\n\
    # don't forget you can still use console\nprint result\nblah.close()\n```\n\n\
    图 0.4:\nthird.py\n\n![](img/00007.jpeg)\n\n另外注意，如果 `.csv` 文件太长，`textbox` 将自动换行。你可以使用不换行的\
    \ `codebox()`。你也可以不使用循环执行相同的过程，因为文件本质上就是一个列表。\n\n### fourth.py\n\n```python\n\
    from easygui import *\n\nfilename=(\"data.csv\")\nfile=open(filename, \"r\")\n\
    text = file.readlines()\nfile.close()\n\ncodebox(\"Contents\" + filename, \"Display\
    \ File\", text)\n```\n\n总结一下。通过列出的脚本（包括 `easygui` 示例），你已经足够快速编写基础 GUI 应用程序。你将发现的局限性在于唯一性、设计、框的类型、按钮外观、框类型、消息位置、大小和字体。\n\
    \n既然你已经看到了 EasyGui，你可以权衡这些局限性与完成这些任务所需编写的代码量，以实现完全的创意控制。目前，可以玩玩并编辑 `easygui.py`\
    \ 来更改某些字体和功能，直到遇到限制。为了在实践中演示本节，请从上一章导入 `apartment.py` 到我们的新程序 `apt.py` 中。首先让我们复习\
    \ `apartment3.py`：\n\n### apartment3.py\n\n```python\n# required information:10\
    \ units with 2 bedrooms, 8 covered parking\n#1 pool, x rooms, 15 people\n\nclass\
    \ complex:\n    def __init__(self, unit, parking, pool, rooms, people):\n    \
    \    self.unit=unit\n        self.parking=parking\n        self.pool=pool\n  \
    \      self.rooms=rooms\n        self.people=people\n\n    def calc(self):\n \
    \       self.capacity=float(self.people)/self.rooms\n        self.uncovered=100-(float(self.parking)/self.people*100)\n\
    \        self.rooms=10*2\n        self.freerooms=self.rooms-self.people\n\n  \
    \  def result(self):\n        print \"The complex is at %g capacity\" % self.capacity\n\
    \        print \"There are %g percent people with uncovered parking\" % self.uncovered\n\
    \        print \"We have %g rooms\" % self.rooms\n        print \"We have %g free\
    \ rooms left\" % self.freerooms\n\nif __name__==\"main__\":\n    myCo=complex(10,8,1,20,15)\n\
    \    myCo.calc() # these are tied together initialize\n    myCo.result() # these\
    \ are tied together\n```\n\n我们需要添加 `if` 语句来从外部运行此程序。为了做到，你应该首先查看传递到 `textbox`\
    \ 函数的信息是列表形式。现在我们需要更改那些 `print` 语句。\n\n### apartment4.py\n\n```python\n# required\
    \ information:10 units with 2 bedrooms, 8 covered parking\n#1 pool, x rooms, 15\
    \ people\n\nclass complex:\n    def __init__(self, unit, parking, pool, rooms,\
    \ people):\n        self.unit=unit\n        self.parking=parking\n        self.pool=pool\n\
    \        self.rooms=rooms\n        self.people=people\n\n    def calc(self):\n\
    \        self.capacity=float(self.people)/self.rooms\n        self.uncovered=100-(float(self.parking)/self.people*100)\n\
    \        self.rooms=10*2\n        self.freerooms=self.rooms-self.people\n\n  \
    \  def result(self):\n        print \"The complex is at %g capacity\" % self.capacity\n\
