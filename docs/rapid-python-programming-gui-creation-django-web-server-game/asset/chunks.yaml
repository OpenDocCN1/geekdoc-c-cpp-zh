    \ = paginator.page(page)\n    except (InvalidPage, EmptyPage):\n        posts\
    \ = paginator.page(paginator.num_pages)\n    return render_to_response(\"list.html\"\
    , dict(posts=posts, user=request.user))\n```\n\n#### `django_templates/base.html`\n\
    \n```html\n<head>\n    <title>\n        {% block title %}MyBlog{% endblock %}\n\
