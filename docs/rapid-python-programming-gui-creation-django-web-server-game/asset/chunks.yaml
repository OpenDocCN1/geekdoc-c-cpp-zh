- fmt: "\nIt would also be good to remember that the original game idea you have in\
    \ mind will evolve. No matter how clever you are or how graphically skilled you\
    \ are, expect that more than 80% of your ideas will change and sometimes dramatically.\
    \ This classic 80/20 rule of thumb is informed from talking to many very experienced\
    \ game developers.\n\n### 16.1.1 Where to begin?\n\nThere is plenty of code out\
    \ there that is written for beginners. If you have to start from scratch, there\
    \ will be many problems. The experts reuse the same methods over and over; methods\
    \ such as `import`, `initialize`, `screen`, `construct images`, `load`, `main\
    \ loop`, and more. Often the trade secrets are in graphics acceleration and algorithms.\n\
    \n### 16.1.2 Above all!\n\nIt is smart to avoid designing in another person's\
    \ game engine. The engine was built specifically for their game development environment\
    \ and their idea or perspective. While using their game engine, you will be restricted\
    \ to their ideas. This can feel frustrating if you are new to game development.\
    \ They could also decide that they want to sell their engine with all the bells\
    \ and whistles as a commercial product. You can do this too! It is important to\
    \ become very proficient at re-using code. Should you play with game engines?\
    \ Absolutely. In fact it is mandatory to explore and find those limitations. The\
    \ act of playing with the game engine will give you plenty of ideas. `Blender`\
    \ is an example of a 3D Graphics Modeling tool that can be modified into a 3D\
    \ game engine environment. It can be helpful to prototype a new game idea using\
    \ an existing game engine.\n\n### 16.1.3 Graphics\n\nSome of the best and most\
    \ addictive games have mediocre graphics, but they have quality game play. Graphics\
    \ can always improve later as you move forward with your idea.\n\n### 16.1.4 Minimum\
    \ requirements for a Game Programmer\n\n1. **Introduction to programming**: We\
    \ have covered some of these topics already. But more importantly you need to\
    \ understand how to solve problems.\n2. **Programming Languages**: Learning `C`\
    \ and `C++` would be a great stepping stone toward mastery of game programming.\
    \ What you develop in `python` you can easily convert to `C/C++`. Start with stripping\
    \ away the libraries. However if you leverage popular graphics libraries such\
    \ as `SDL` and `OpenGL` the changes are few and subtle. You will spend more time\
    \ dealing with parsers and analyzers.\n3. **Data Structures and & Algorithms**:\
    \ This is by far the most important topic for programming anything at any level.\
    \ Testing and mastering `arrays`, `linked lists`, `binary trees`, `general trees`,\
    \ `hash tables`, and `heaps` will get you a job anywhere. Most people learn them\
    \ and forget them, then barely get hired as a developer and many change careers.\n\
    4. **Compilers**: Let's face it, if you need it to be faster you need to understand\
    \ concepts such as tokenizing, `parsing`, `code generation`, and `garbage collection`.\n\
    5. **Operating Systems**: You need to know the limitations of your `OS`. Knowledge\
    \ of `threading`, `locking`, `network communication`, and `device drivers` is\
    \ invaluable for multi-player games or reading bits of a `DVD-ROM` and displaying\
    \ graphics from a 3D card.\n6. **Artificial Intelligence**: `Heuristics`, `planning`,\
    \ `algorithms`, `bayesian networks` and `natural language parsing` add reality\
    \ concepts to your gaming environment.\n7. **Databases**: You have to keep this\
    \ data somewhere.\n\n### 16.1.5 Game Theory\n\nHow do you make something that\
    \ others want to play? This can be a daunting task. Game companies and marketing\
    \ analysts research latest trends to gather this information. There is a fine\
    \ balance between themes, map design, level features, sound, story, and game play\
    \ difficulty. In the end you want your game to look good and be fun to play. This\
    \ means you must take a balanced approach during as you move from concept to deployment.\n\
    \n### 16.1.6 Prototype\n\nIn reality your dream and ideas won't come to fruition\
    \ until you actually start writing code. You will start building your first prototype\
    \ and then another until you have several prototype versions. Much can be learned\
    \ from a prototype such as the general concept and how to play. You also discover\
    \ more realities such as menus, `screen transitions`, and how to save or load\
    \ a game. Here are a few things to think about:\n\n1. Do you need a story teller?\n\
    2. Do you need an algorithm expert?\n3. Do you need a graphic artist? `Raster`,\
    \ `Vector` or both.\n4. Do you need a musician or sound technician?\n\nA prototype\
    \ can also quickly tell you if the game is worth it or not.\n\n**Things to study:**\n\
    \n1. Best path, shortest path. `Dijkstra's`, `Bellman-Ford`\n2. `Collision Detection/Avoidance\
    \ Behaviors`\n3. `Projectile Motion` and `Vectors`\n4. `Map Generation`, `Tile\
    \ Generation`\n5. `Grid Design Pixel`, `Coordination System`.\n6. Algorithms:\n\
