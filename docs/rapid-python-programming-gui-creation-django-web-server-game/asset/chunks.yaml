    mydisplay=pygame.display.set_mode((800,600))


    print pygame.display.set_mode((800,600))


    mode=help(''pygame.display.set_mode'')


    display=help(''pygame.display'')


    print mode


    print display


    Results: enter ''q'' multiple times to cycle through help in display_set_mode
    and all of pygame display functions.


    16.2.2 Event Handling


    The core events in pygame are as follows:


    Table 0.1:


    Events


    | Event | Description |


    | QUIT | none |


    | ACTIVEEVENT | gain,state |


    | KEYDOWN | unicode,key,mod |


    | KEYUP | key,mod |


    | MOUSEMOTION | pos,rel,buttons |


    | MOUSEBUTTON | pos,button |


    | MOUSEBUTTONDOWN | pos,button |


    | VIDEORESIZE | size,w,h |


    | VIDEOEXPOSE | none |


    | USEREVENT | code |


    Here is a practical example of moving a rectangle across the screen. Ctrl-C to
    exit


    #pygameEvent1.py


    import pygame


    white=(255,255,255) # RGB values


    black=(0,0,0)


    pygame.init()


    display=pygame.display.set_mode((800,600))


    x=300; y=300


    while 1:


    for event in pygame.event.get(): # event handling


    if event.type==pygame.KEYDOWN:


    if event.key == pygame.K_LEFT:


    x -= 10


    if event.key == pygame.K_RIGHT:


