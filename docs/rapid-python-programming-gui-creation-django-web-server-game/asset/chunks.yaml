    \n    def myprint(self):\n        print \"fruit= \", self.fruits\n\nmyclass=Shop(\"\
    apple\",\"steak\",\"eggs\",\"berry\")\nmyclass.myprint()\n```\n\n`dia2code` 程序绝非完美。市上有有很多其他的\
