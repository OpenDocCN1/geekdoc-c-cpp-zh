    8 EasyGUI


    8.1 EasyGUI


    EasyGUI is the quick way to get a small program up and running with a nice interface.
    The goal of this book was to jump in and learn by doing. So far, we''ve created
    some simple programs very quickly using python programming language. EasyGUI allows
    you to program in a linear way and put up dialogs for input/output when needed.
    You can download ''easygui'' from http://easygui.sourceforge.net/ or run “easy_install
    easygui ” or run “pip install python-easygui  ”.


    The download page has a zip containing the ''easygui.py'' and several other documents.
    The only document we need here is ''easygui.py''. Put this easygui.py file in
    the same directory where your scripts are located . The next step is to make sure
    you have Tkinter package installed. I use python-tk Tkinter to write ''Tk'' applications
    with Python. It''s helpful to think of EasyGUI as a bunch of functions or methods
    that act like wrappers to the ''Tkinter'' toolkit meant to allow you to simplify
    and rapidly build GUI''s without the knowledge of ''Tkinter'' internals. Here
    is your first example:


    #first.py first graphical app


    from easygui import *


    msgbox("Hello World. I like EasyGui")


