    `help("for")`


    The `for` statement is used to iterate over the elements of a sequence (such as
    a string, tuple or list) or other iterable object. The syntax is below:


    ```

    for_stmt ::= "for" target_list "in" expression_list ": " suite

    ["else" ":" suite]

    ```


    ### 2.1.3 While Loop


    The `while` statement is used for repeated execution as long as an expression
    is true. Again, the syntax is below.


    ```

    while_stmt ::= "while" expression ":" suite

    ["else" ":" suite]

    ```


