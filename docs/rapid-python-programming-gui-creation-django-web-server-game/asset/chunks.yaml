    \n图 0.3:\n对象图\n\n![](img/00037.jpeg)\n\n### 15.1.4 活动图\n\n时序图、协作图和“状态图”已超出了本章的范围。活动图类似于流程图，显示活动之间如何相互依赖。活动图使用的符号与状态图相同，状态气泡除外。状态图关注过程转换的流，而不是整体流。活动图的组件包括：\n\
    \n1. 开始和停止 - 指定为实心圆点。\n2. 活动 - 圆角矩形。比状态组件更圆。\n3. 转换 - 连接活动和分支的带箭头线。\n4. 分支 - 用菱形表示以指示决策。\n\
    5. 叉叉/合并 - 用短粗体线表示。\n\n图 0.4:\n活动图\n\n![](img/00038.jpeg)\n\n组件图和部署图已远远超出了本书和本章的范围。\n\
    \n### 15.1.5 Dia 和 UML\n\n`dia` 是一个基于 GTK+ 的图形创建程序，用于 Linux 或 Windows 系统。它类似于\
