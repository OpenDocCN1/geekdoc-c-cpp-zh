    ```\n\n#### `urls.py`\n\n```python\nfrom blog.views import blog\n\nurl('^blog/',\
    \ blog),\"\n```\n\n#### `blog/models.py`\n\n```python\nclass Post(models.Model):\n\
    \    title=models.CharField(max_length=60)\n    body=models.TextField()\n    created\
    \ = models.DateTimeField(auto_now_add=True)\n\n    def __unicode__(self):\n  \
    \      return self.title\n```\n\nAlso run the following:\n```bash\npython manage.py\
    \ makemigrations\npython manage.py migrate\n```\n\n#### `settings.py`\n\nAdd `blog`\
    \ to `INSTALLED_APPS`.\n\nNow that you have created the model or `'DB'` for a\
    \ blog, you can activate the database model by running the following:\n\n```bash\n\
