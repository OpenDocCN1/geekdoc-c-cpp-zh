    \ binary only |\n| r+ | Opens file for both reading and writing |\n| rb+ | Opens\
    \ binary file for reading and writing |\n| w | Opens file for writing only |\n\
    | wb | Opens binary file for writing only |\n| a | Opens a file for appending\
    \ |\n| ab | Opens a binary file for appending |\n| a+ | Opens a file for both\
    \ appending and reading |\n| ab+ | Opens a file for both appending and reading\
    \ in binary |\n\n### 4.1.8.2 File Attributes\n\nTable 0.3: File Attributes\n\n\
    | Attribute | Description |\n| :--- | :--- |\n| file.closed | Returns true if\
