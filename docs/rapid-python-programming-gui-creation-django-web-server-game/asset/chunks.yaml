    def FileWrite(d):


    f=open(''file.txt'',''a'')


    f.write(d)


    f.close()


    if __name__==''__main__'':


    d=raw_input("enter something: ")


    FileWrite(d)


    In the example above, we are using raw_input to write something to a file. It
    is important to verify everything step-by-step. Beliow is a test script to verify
