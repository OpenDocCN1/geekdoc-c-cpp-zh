    Python 是少数几种既易于学习又非常强大的编程语言之一。大多数编程书籍关注的是读者的技能水平，而不是读者选择书籍的主题。在阅读了由 C++ 语言发明者
    Bjarne Stroustrup 编写的《C++ 程序：原理与实践》后，我产生了写这本书的想法。虽然这里的呈现方式会有所不同，但他所提出的编程哲学、学习方法和手段影响了我。


    程序本质上会向复杂性演变，大多数语言都培养了结构化设计的能力，即使该语言本身不是结构化编程语言。Python 支持多范式（例如面向对象、命令式和函数式）。Python
    的设计倾向于整洁的模块化风格，一切都被松散地视为一个对象。


    '
- fmt: '

    Once you start programming with `python`, you won''t want to use other languages.
    You may even find yourself converting code written in other languages to `python`.
    `Python` is very fast. You can compile your code into Byte-compiled files or `PYC`
    files. These pre-compiled binaries execute quickly. Conveniently Byte-compiled
    files that are created by the `python` interpreter automatically and can be further
    extended with other `python` modules. If you decide to use `python` for science,
    or gaming, and you need more speed, you can further extend `python` with the “C”
    language. The flexible features of `python` make it an excellent choice for beginners
    and experts. Most important, programming with `python` is fun.


    For the more experienced developer, `python` can be learned on a one page cheat
    sheet. Taking into account the range of skill levels and learning styles, my idea
    was to provide provide just enough examples to learn the language then introduce
    the reader to the fun tools. The reality is that the beginner will learn just
    enough to program then comb through endless “Google” pages to understand tasks
    such as: parsing large files, working with a database, doing network programming,
    creating a graphical interface, designing a website, developing a game, or modeling
    and stock market analysis. My goal is to teach the student just enough that they
    feel confident jumping right into the fun stuff.


    ### Here are some of the highlights:


    #### EasyGUI

    This is a wonderful chapter for newbies, providing you a graphical environment
    in which to program.


    #### Tkinter

    Now that the reader has cut their teeth on the basics of `EasyGUI`, it''s only
    a few more steps to writing `Tkinter` applications without `EasyGUI` templates.


    #### WxWidgests

    `WxWidgets` is one of the most popular cross platform GUI libraries available.
    It is used by a lot of popular high level programming languages.


    #### Network Programming

    This chapter explains how to use `sockets`, and build client and server applications.


    #### SQLite

    Chapter 19 is about `SQlite`, a very lightweight SQL server, that has many advantages
    over a traditional SQL server. It''s really easy to learn and easy for `Python`
    to connect to.


    #### CGI

    Often enough Web application developers run into certain limitations. The client
    might have a server co-located with a provider that only supports `PHP` and `CGI`.
    This chapter explains how to utilize `python` with `CGI`.


    #### WSGI

    Web Server Gateway Interface. It is a specification for web servers and application
    servers to communicate with web applications.


    #### Pygame

    This chapter is about the `Pygame` library, how to utilize it, a short tutorial,
    examples, and options for deployment.


    ### How to use this book

    Learning `python` can be achieved relatively quickly in 6 chapters at the most.
    I explain everything in the simple terms and provide exercises. To get the most
    use out of this book it''s recommended that you type everything out. There is
    no substitute for learning how to deal with typos than the experience of troubleshooting
    your own code.


    ### Conventions

    The `python` code snippets are italicized with a smaller font. Most of the results
    or corresponding output are provided in the same format. Some of the code might
    be truncated. Ellipses or comments similar to the following (`#...`) indicate
    regions where code exists that isn''t essential for expressing a point.


    ### Code and Errata

    It''s useful to view examples in this book as whole programs without interleaved
    prose. You can find the source code for all code snippets in this book on our
    website:


    `http://www.rapidpythonprogramming.com.`


    Corrections for any errors found in the book can be found on the website.


    ### Acknowledgments

    This book would not have been possible without the guidance and support of many
    people in my life.


    Thanks to my friends who have always encouraged me through trials and tribulations
    navigating the fiercely competitive computer technology industry. They always
    encouraged me to remember to stay focused and believe in myself.


    Thanks to Dennis Feick who had enduring faith in my family during some of the
    worst economic times as a programmer these last 7 years.


    Thanks to the wonderful programmers I''ve known and worked with: `Dan White` and
    `Daniel Yount` have both been helpful and inspirational in this matter. I appreciate
    their tutelage over the years. It was a pleasure working with them.


    Thanks to my family, Rachel, Olaf, and Mckinzie who stood by me and endured the
    late hours of work, overtime, and sacrifices made as a writer while working multiple
    jobs.


    ### Author

    William Gunnells has been building computers since he was 10 years old. While
    hardware is his passion he loves to exploit the various hardware features through
    software. Hardware has changed so much in the last 30 years. The market wants
    smaller, faster, better. It''s the same with software. `Python` is smaller, faster,
    and better. With more than 25 years as a programmer, network engineer, and security
    engineer. He designs and engineers from scratch full service solutions using open
    source tools to enterprise standards for the target market. His diverse background
    is as follows:


    #### Network Penetration

    Working knowledge of buffer overflows, race conditions, protocol hijacking, replay
    attacks, stealth attacks, network sniffing, password cracking, denial of service,
    spoofing, covert channels, network tunneling, connection bouncing, system call
    hijacking and “Userland rootkits”. Concentrated knowledge on `TCP/IP` and network
    attack scenarios.


    #### Programming

    He is proficient in shell scripting (`bash`, `CSH`), `C`, `Perl`, `Python`, `PHP`,
    `GNU debugger` and build tools (`Automake`, `Autoconf`, `Libtool`), Version Control
    (`CVS`, `RCS`), Perforce, `GIT`, and `SVN` on large-scale development projects.
    Extensive experience at utilization of both asymmetric and symmetric ciphers.
    He has developed custom code for `OpenBSD` and `Linux Loadable Kernel Modules`
    (`LKM`). Experience using `Queue`, `Libnet`, `Libpcap`, `Pthreads` and `Ncurses`
    API''s. Extensive research in theory and practical implementation of network protocols:
    `[R]ARP`, `DNS`, `IPv4`, `IPv6`, `ICMP`, `GMP`, `OSPF`, `RIP`, `TCP`, `UDP`, and
    `SNMP`. Vast experience in web development (`CMF`, `CRM`, `ERP`), web languages,
    `HTML`, `Python`, `PHP`, `XML`, `CSS`, `MySQL`, `Postgres`, `Gadfly`, and `SQLite`.


    Network Security and Forensics Investigation:

    Extensive experience with `AIX`, `BSD(i)`, `IRIX`, `HPUX`, `Linux`, `SCO`, `Solaris`,
    `Snort` Intrusion Detection Systems. Configuration and Management of `Checkpoint`,
    `IPF`, `OpenBSD` `PF`, `IPtables`, `Cisco` (`ASA`, `ASWSM`, `ASASM`) and `Raptor
    Firewalls`. He has extensive technical writing experience, documenting many Operating
    Systems in a threatened scenario, extensive forensics analysis and assessment
    of enterprise environments, investigative procedures and documentation.


    *   Website Backend Development

    *   Responsive Web Tool Development

    *   Content Management Systems

    *   WordPress Theme Integration

    *   Drupal Theme Integration

    *   Mobile Platform Development

    *   Usability Testing

    *   Django Python Integration

    *   Python Development

    *   Content Management Framework Creation

    *   Analytics

    *   Social Media

    *   Embedded Systems Development

    *   ADC Systems Development


    # 1 Introduction


    ## 1.1 Introduction

    The Python programming community is rapidly growing. More people are either migrating
    to python or choosing it as their first high level programming language. It''s
    multiple programming paradigms feature make it an easier first language to learn,
    because it frees you from focusing on the language itself, and more on problem
    solving.

