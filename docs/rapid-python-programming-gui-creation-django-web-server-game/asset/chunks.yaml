  trans: "\n\n# 11 套接字与数据库\n\n## 11.1 socket 编程\n\nPython 提供了许多访问应用层的模块，如 `FTP`、`HTTP`、`Telnet`、`SSH`\
    \ 等。有时你需要实现自己的应用层协议。为了实现这一点，我们使用 `(sockets)`。\n\n```\n>>>help('socket')\n```\n\
    \n### 描述\n\n该模块提供了 socket 操作和一些相关函数。\n\n在 Unix 上，它支持 `IP`（网络协议）和 Unix 域套接字（domain\
    \ sockets）。\n\n在其他系统上，它仅支持 `IP`。特定 `socket` 的函数作为 `socket` 对象的方法可用。\n\n### 函数：\n\
    \n- `socket()` – 创建一个新的 socket 对象\n- `socketpair()` – 创建一对新的 socket 对象\n- `fromfd()`\
    \ – 从打开的文件描述符创建 socket 对象\n- `gethostname()` – 返回当前主机名\n- `gethostbyname()` –\
    \ 将主机名映射到其 IP 地址\n- `gethostbyaddr()` – 将 IP 地址或主机名映射到信息\n- `getservbyname()`\
    \ – 将服务名和协议名映射到端口号\n- `getprotobyname()` – 将协议名（例如 `'tcp'`）映射到数字\n- `ntohs()`,\
    \ `ntohl()` – 将 16 位整数从网络字节序转换为主机字节序\n- `htons()`, `htonl()` – 将 16 位整数从主机字节序转换为网络字节序\n\
    - `inet_aton()` – 将 IP 字符串（`123.45.67.89`）转换为 32 位压缩格式\n- `inet_ntoa()` – 将 32\
    \ 位压缩格式转换为字符串（`123.45.67.89`）\n- `ssl()` – 安全层支持（仅配置后可用）\n- `socket.getdefaulttimeout()`\
    \ – 获取默认超时\n- `socket.setdefaulttimeout()` – 设置默认超时\n- `create_connection()` –\
    \ 连接到地址，在所有平台上都提供可选的超时\n\n## 11.1.1 TCP 套接字\n\n让我们从 TCP 服务器开始。下面的示例代码是客户端。在测试客户端之前运行服务器是非常关重要的。你必须同时拥有这两个文件代码才能正常工作。\n\
    \n```python\n#tcpc.py\nimport socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\ndata = s.recv(1024)\ns.close()\n\
    ```\n\n远程主机是 `host=localhost`，所以在这种情况下我们的主机是本地的。远程服务器上的端口是 `8001`，socket 平台是 unix\
    \ 流（stream）或用于数据报的 `DGRAM`。下面的示例使用了流。现在我们需要一个 `connect` 对象来绑定到主机/端口并接收 `1024`\
    \ 字节。然后我们可以观察数据流入缓冲区。现在关闭该对象。以下是服务器：\n\n```python\n#tcps.py\nimport socket\nHOST\
    \ = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    s.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\nprint 'Connected by',\
    \ addr\nconn.close()\n```\n\n这里的区别在于我们正在使用 `bind` 对象将 IP 地址绑定到端口号。我们正在使用 `accept`\
    \ 对象将其赋值给变量 `addr`，然后发送确认。。先运行 `tcps.py` 服务器。然后打开另一个终端或提示符并运行 `tcpc.py` 客户端程序。服务器将打印出收到了来自客户端数据流的\
    \ `('127.0.0.1', 44xx)` 或类似的连接。这对于我们的目的来说并不实际。让我们通过在客户端中添加一些内容来返回一些数据。要做到这一点，在最后一行添加\
    \ `print 'Received', repr(data)`。现在再次启动服务器 `tcps.py` 并在连接客户端时查看结果。你还没有真正收到数据。服务器需要发送它。为了让这种情况发生，我们需要向服务器添加一个发送对象。\n\
    \n```python\n#tcpc1.py\nimport socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\ndata = s.recv(1024)\ns.close()\n\
    print 'Received', repr(data)\n```\n\n现在当你启动服务器并连接客户端时，你会注意到客户端打印出收到了确认。为了进一步测试你的代码，让客户端向服务器发送一些内容。如果你看到“socket\
    \ address in use”，你可能需要关闭之前的服务器应用程序并重新启动服务器。\n\n```python\n#tcpc2.py\nimport socket\n\
    HOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
    s.connect((HOST, PORT))\ns.send('Hello, world')\ndata = s.recv(1024)\ns.close()\n\
    print 'Received', repr(data)\n```\n\n但我们必须修改服务器来接收那些数据。\n\n```python\n#tcps2.py\n\
    import socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
    print 'Connected by', addr\ndata=conn.recv(1024)\nconn.send('Acknowledge')\nprint\
    \ data\nconn.close()\n```\n\n现在我们有了客户端和服务器应用程序以高效的方式相互通信。然而，如果发送发送数据流，循环在服务器上效果可能会好一点。\n\
    \n```python\n#tcps3.py\nimport socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
    print 'Connected by', addr\nwhile 1:\n    data= conn.recv(1024)\n    if not data:\
    \ break\n    conn.send(data)\nconn.close()\n```\n\n客户端如下：\n\n```python\n#tcpc3.py\n\
    import socket\nHOST = 'localhost'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.connect((HOST, PORT))\nwhile 1:\n    data=raw_input(\"\
    Text: \")\n    if not data:\n        break\n    else:\n        s.send(data)\n\
    \        print \"sent message:\", data\ns.close()\n```\n\n当你运行它时，只要客户端发送数据流，服务器就不会断开。例如，这里是我输入的数据流：\n\
    ```\nText: wow\nsend message: wow\nText: working\nsend message: working\nText:\
    \ cool\nsend message: cool\nText:\n```\n所以客户端正在发送数据流并在屏幕上打印发送数据的结果。虽然两个 print\
    \ 语句可能多此此了，但我们如何才能确定数据正在被发送呢？为了验证这一点，我们在服务器上添加了一个 print 语句。\n\n```python\n#tcps4.py\n\
    import socket\nHOST = '127.0.0.1'\nPORT = 8001\ns = socket.socket(socket.AF_INET,\
    \ socket.SOCK_STREAM)\ns.bind((HOST, PORT))\ns.listen(1)\nconn, addr = s.accept()\n\
    print 'Connected by', addr\nwhile 1:\n    data= conn.recv(1024)\n    if not data:\
    \ break\n    conn.send(data)\nprint \"sent: \" , data\nconn.close()\n```\n现在服务器将打印出已发送的数据并在连接丢失时中断服务器。我们还可以添加一个异常来实现优雅退出。（这样做是为了避免\
    \ TCPIP 三次握手数据流中的错误。）\n\n## 11.1.2 UDP 套接字\n\nUDP 套接字实际上并没有那么不同。唯一的区别在于三次握手。在\
    \ TCP 中，你需要 `SYN`、`SYN/ACK` 和 `ACK` 标志。UDP 的可靠性较低，但在网络通信的其他方面具有优势。它无论是否有确认都会发送数据。以下是一个\
    \ UDP 服务器：\n\n```python\n#server.py\nfrom socket import *\nhost = \"localhost\"\
    \nport = 8001\nbuf = 1024\naddr = (host,port)\nu= socket(AF_INET,SOCK_DGRAM)\n\
    u.bind(addr)\nwhile 1:\n    data,addr = u.recvfrom(buf)\n    if not data:\n  \
    \      break\n    else:\n        print \"Received message:\", data\nu.close()\n\
    ```\n\n客户端如下：\n\n```python\n#client.py\nfrom socket import *\nhost = \"localhost\"\
    \nport = 8001\nbuf = 1024\naddr = (host,port)\nu= socket(AF_INET,SOCK_DGRAM)\n\
    msg= \"Send messages to server: \";\nprint \"Message sent:\", msg\nwhile (1):\n\
    \    data = raw_input('Text: ')\n    if not data:\n        break\n    else:\n\
    \        if(u.sendto(data,addr)):\n            print \"send message:\",data\n\
    u.close()\n```\n\n注意这个 UDP 数据流没有任何错误的情况下关闭。这是因为它没有像 TCPIP 那样的三次握手。\n\n# 11.2 数据库\
    \ SQLite\n\nSQLite 是原型和构建 SQL 数据库最方便、快速的方法之一。然而，请记住 SQLite 比人们认为的要强大得多。对于小数据集，它可以很容易地与\
    \ MySQL 或 Postgress 竞争。它还具有轻量且可移植的优势。这里所有的概念都可以很容易地应用到 MySQL 和 Postgress。\n\n"
- fmt: "\nVisit `http://www.sqlite.org` and download the latest binary for your system.\
    \ The following is an example of creating '3' fields in a database called `mytable.db`.\
    \ The table is called `foo`.\n\n```bash\n./sqlite3 mytable.db\n```\n\nSQLite version\
    \ 3.6.10\n\nEnter \".help\" for instructions\n\nEnter SQL statements terminated\
    \ with a \";\"\n\nsqlite> create table foo (id INTEGER PRIMARY KEY, fname VARCHAR(50),\
    \ lname VARCHAR(50));\nsqlite> insert into foo values (1,'john','doe');\nsqlite>\
    \ select * from foo\n...> ;\n1|john|doe\n\nsqlite>\n\nAs you can see, it's very\
    \ simple. Also note that I forgot the semicolon in `“select * from foo”`. I had\
    \ to enter it on the next line. Below are the list of commands to use.\n\n```bash\n\
    sqlite> .help\n```\n\n- `.bail ON|OFF` Stop after hitting an error. Default OFF\n\
    - `.databases` List names and files of attached databases\n- `.dump ?TABLE? ...`\
    \ Dump the database in an SQL text format\n- `.echo ON|OFF` Turn command echo\
    \ on or off\n- `.exit` Exit this program\n- `.explain ON|OFF` Turn output mode\
    \ suitable for EXPLAIN on or off.\n- `.header(s) ON|OFF` Turn display of headers\
    \ on or off\n- `.help` Show this message\n- `.import FILE TABLE` Import data from\
    \ `FILE` into `TABLE`\n- `.indices TABLE` Show names of all indices on `TABLE`\n\
    - `.load FILE ?ENTRY?` Load an extension library\n- `.mode MODE ?TABLE?` Set output\
    \ mode where `MODE` is one of:\n    - `csv` Comma-separated values\n    - `column`\
    \ Left-aligned columns. (See `.width`)\n    - `html` HTML `<table>` code\n   \
    \ - `insert` SQL insert statements for `TABLE`\n    - `line` One value per line\n\
    \    - `list` Values delimited by `.separator` string\n    - `tabs` Tab-separated\
    \ values\n    - `tcl` TCL list elements\n- `.nullvalue STRING` Print `STRING`\
    \ in place of `NULL` values\n- `.output FILENAME` Send output to `FILENAME`\n\
    - `.output stdout` Send output to the screen\n- `.prompt MAIN CONTINUE` Replace\
    \ the standard prompts\n- `.quit` Exit this program\n- `.read FILENAME` Execute\
    \ SQL in `FILENAME`\n- `.schema ?TABLE?` Show the `CREATE` statements\n- `.separator\
    \ STRING` Change separator used by output mode and `.import`\n- `.show` Show the\
    \ current values for various settings\n- `.tables ?PATTERN?` List names of tables\
    \ matching a LIKE pattern\n- `.timeout MS` Try opening locked tables for `MS`\
    \ milliseconds\n- `.timer ON|OFF` Turn the CPU timer measurement on or off\n-\
    \ `.width NUM NUM ...` Set column widths for \"column\" mode\n\nsqlite>\n```\n\
    \nWe can look at the description of the table using `\".sechma\"`.\n\n```bash\n\
    ./sqlite3 mytable.db\nSQLite version 3.6.10\nEnter \".help\" for instructions\n\
    Enter SQL statements terminated with a \";\"\nsqlite> .schema\nCREATE TABLE foo\
    \ (id INTEGER PRIMARY KEY, fname VARCHAR(50), lname VARCHAR(50));\nsqlite>\n```\n\
    \nWe can easily export the data as follows:\n\n```bash\nsqlite> .mode csv\nsqlite>\
    \ .output data.csv\nsqlite> select * from foo;\nsqlite> .quit\n```\n\n```bash\n\
    /home/knoppix:$ cat data.csv\n1,john,doe\n```\n\nTo further emphasize the power\
    \ of SQLite, you can execute queries at the command line.\n\n```bash\n./sqlite3\
    \ mytable.db \"select * from foo;\"\n```\n\nResults:\n```\n1|john|doe\n```\n\n\
    This feature makes SQLite very robust. You can quickly script something in bash\
    \ or AWK. You can also import 'OS' or 'System' to access the application externally\
    \ and use languages such as Perl, Python, 'C', or 'C++'. Libraries are also available\
    \ so that you don't have to call the program externally.\n\n# 11.2.2 Python SQLite\n\
    \nAs of version 2.6 SQLite library is included in-core python package. Let's create\
    \ another table called `user.db` similar to our primer above.\n\n### create.py\n\
    ```python\n# create user.db\nimport sqlite3\n\ncon = sqlite3.connect('user.db')\n\
    cur = con.cursor()\ncur.execute('CREATE TABLE userinfo (id INTEGER PRIMARY KEY,\
    \ fname VARCHAR(20), lname VARCHAR(30))')\ncon.commit() # comment back\ncur.execute('INSERT\
    \ INTO userinfo (id, fname, lname) VALUES(NULL, \"john\", \"doe\")')\ncon.commit()\n\
    cur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\n```\n\nTo list a\
    \ record:\n\n### record.py\n```python\n# list information in table\nimport sqlite3\n\
    \ncon=sqlite3.connect('user.db')\ncur=con.cursor()\ncur.execute('SELECT * FROM\
    \ userinfo')\nprint cur.fetchall()\n```\n\nTo add a new record:\n\n### record1.py\n\
    ```python\n# list information in table\nimport sqlite3\n\ncon=sqlite3.connect('user.db')\n\
    cur=con.cursor()\ncur.execute('insert into userinfo(id,fname,lname) VALUES(NULL,\
    \ \"george\", \"peterson\")')\ncon.commit()\ncur.execute('SELECT * FROM userinfo')\n\
    print cur.fetchall()\n```\n\nTo update a record:\n\n### update.py\n```python\n\
    # list information in table\nimport sqlite3\n\ncon=sqlite3.connect('user.db')\n\
    cur=con.cursor()\ncur.execute(\"update userinfo set lname='bob' where fname='george'\"\
    )\ncon.commit()\ncur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\n\
    cur.close()\ncon.close()\n```\nNotice the last line closes the cursor and the\
    \ connection.\n\n# 11.2.3 Exercises\n\n1. Create a really simple chat server with\
    \ sockets.\n2. Create family address book with names, phone numbers, addresses,\
    \ etc...\n\n# 12 CGI, WSGI Framework Development\n\n## 12.1 CGI\n\nCGI is the\
    \ quick dirty way to bring applications. Most languages use it. Below is an example\
    \ of a bash script:\n\n```bash\n#!/bin/bash\necho \"Content-type: text/html\"\n\
    echo \"<html>\"\necho \"Hello world\"\necho \"</html>\"\n```\n\nHere is a python\
    \ script:\n```python\n#!/usr/bin/python\n# firstweb.py\nprint \"Content-type:\
    \ text/html\\n\"\nprint \"Hello world\"\n```\n\nNotice also that I place everything\
    \ within the quotes:\n```python\n#!/usr/bin/python\n# secweb.py\nprint 'Content-type:\
    \ text/html\\n'\nvar=\"Hello world\"\nprint \"\"\"\n<html><head><title>Second\
    \ Web Page</title></head><body><h1>Messasge to you: %s</h1></body></html>\n\"\"\
    \" % var\n```\n\nHere is an example of a simple form:\n```python\n# form.py\n\
    print \"Content-type:text/html\\n\"\nprint \"\"\"\n<html>\n<form action=\"pform.py\"\
    \ method=\"get\">\nFirst Name: <input type=\"text\" name=\"fname\"> <br>\nLast\
    \ Name: <input type=\"text\" name=\"lname\">\n<input type=\"submit\" value=\"\
    Submit\">\n</form>\n</html>\n\"\"\"\n```\n\nTo do the actual work, you would use\
    \ another file to retrieve the stored values in a form:\n```python\n# pform.py\n\
    import cgi,cgitb\nform=cgi.FieldStorage()\n# get data from fields\nfirstname=form.getvalue('fname')\n\
    lastname=form.getvalue('lname')\n\nprint \"Content-type:text/html\\n\"\nprint\
    \ \"\"\"\n<html>\n<h1>Entries from form</h1>\n<p>First name is: %s\n<p>Last name\
    \ is: %s\n<hr>\n</html>\n\"\"\" % (firstname,lastname)\n```\nNotice the import\
    \ `cgi`, `cgitb` and `FieldStorage()` function.\n"
