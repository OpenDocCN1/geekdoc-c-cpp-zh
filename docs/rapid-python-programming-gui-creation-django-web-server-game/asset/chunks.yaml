  trans: '

    一旦你开始用 `python` 编程，你就再也不想用其他语言了。你甚至发现自己正在将其他语言编写的代码转换为 `python`。`Python` 极快。你可以将代码编译成字节码文件或
    `PYC` 文件。这些预编译的二进制文件执行速度很快。方便的是，`python` 解释器会自动创建字节码文件，并且可以通过其他 `python` 模块进一步扩展。如果你决定将
    `python` 用于科学研究或游戏，并且需要更高的速度，你可以用“C”语言进一步扩展 `python`。`python` 灵活的特性使其成为初学者和专家的绝选择。最重要的是，用
    `python` 编程是有趣的。


    对于经验更丰富的开发者来说，可以通过一张速查表（cheat sheet）学会 `python`。考虑到各种技能水平和学习风格，我的想法是提供恰好的示例来学习这种语言，然后向读者介绍那些有趣的工具。现实情况是，学者只会学到足够编程的知识，然后就会翻阅无尽的“Google”页面来理解诸如以下的任务：解析大文件、操作数据库、进行网络编程、创建图形界面、设计网站、开发游戏或进行建模和股市分析。我的目标是让学生学会足够的知识，让他们有信心直接投入到那些有趣的事情中。


    ### 以下是一些亮点：


    #### EasyGUI

    对于新手来说，这是一个精彩的章节，为你提供了一个编程所需的图形化环境。


    #### Tkinter

    既然读者已经掌握了 `EasyGUI` 的基础，再迈几步就可以在不使用 `EasyGUI` 模板的情况下编写 `Tkinter` 应用了。


    #### WxWidgests

    `WxWidgets` 是最流行的跨平台 GUI 库之一。它被许多流行的高级编程语言使用。


    #### Network Programming

    本章解释了如何使用 `sockets` 并构建客户端和服务器应用程序。


    #### SQLite

    第 19 节关于 `SQlite`，这是一个非常轻量级的 SQL 服务器，与传统的 SQL 服务器相比有许多优势。它非常容易学习，而且 `Python` 轻松连接。


    #### CGI

    Web 开发者经常会遇到某些局限性。客户端可能与供应商共用一个服务器，而该供应商仅支持 `PHP` 和 `CGI`。本章解释了如何将 `python` 与
    `CGI` 使用。


    #### WSGI

    Web Server Gateway Interface。它是一个用于 Web 服务器和应用服务器与 Web 应用通信的规范。


    #### Pygame

    本章关于 `Pygame` 库，如何利用它、一个简短教程、示例以及部署选项。


    ### 如何使用此书

    最多通过 6 章内容就可以较快地学会 `python`。我用简单易懂的语言解释了一切并提供了练习题。为了充分发挥这本书的作用，建议你输入所有内容。在学习如何处理拼写错误方面，没有任何能替代自己排除代码故障的体验。


    ### 约定

    `python` 代码段采用斜体显示，字体较小。大多数结果或相应的输出以相同的格式提供。部分代码可能会被省略。省略号或类似以下的注释（`#...`）表示某些代码对于表达观点并非至关重要。


    ### 代码与错

    将书中的示例视为不包含散文的完整程序是有用的。你可以在我们的网站上找到书中所有代码段的源码：


    `http://www.rapidpythonprogramming.com.`


    书中发现的任何错误更正可以在网站上找到。


    ### 谢谢

    如果没有我生活中许多人的指导和支持，这本书将无法完成。


    感谢我的朋友，他们在我在竞争激烈的计算机技术行业中应对困难和挑战的过程中一直鼓励我。他们总是鼓励我记住保持专注并相信自己。


    感谢 Dennis Feick，在过去 7 年我作为程序员最糟糕的经济时期，他对我的家庭保持着持久的信念。


    感谢我认识并共事过的出色的程序员们：`Dan White` 和 `Daniel Yount` 在这方面都提供了帮助和启发。我感谢他们多年来的指导。与他们一起工作是一件乐事。


    感谢我的家人 Rachel、Olaf 和 Mckinzie，他们支持我，并忍受了我在从事多份工作时作为作家所付出的深夜工作、加班和牺牲。


    ### 作者

    William Gunnells 从 10 岁就开始组装计算机。虽然硬件是他的热情，但他喜欢通过软件来利用各种硬件特性。在过去的 30 年里，硬件发生了巨大的变化。市场想要更小、更快、更好的。软件也是如此。`Python`
    更小、更快、更好。作为一名拥有超过 25 年经验的程序员、网络工程师和安全工程师，他使用开源工具按照企业标准为目标市场从零设计并工程化全服务解决方案。他的多元背景如下：


    #### 网络渗透

    具备缓冲区溢出、竞态条件、协议劫持、重放攻击、隐身攻击、网络嗅探、密码破解、拒绝服务、欺骗、隐蔽通道、网络隧道、连接跳跃、系统调用劫持和“用户态 rootkit”的实战知识。专注于
    `TCP/IP` 和网络攻击场景的专业知识。


    #### 编程

    他精通 shell 脚本（`bash`、`CSH`）、`C`、`Perl`、`Python`、`PHP`、`GNU debugger` 以及构建工具（`Automake`、`Autoconf`、`Libtool`）、大型开发项目的版本控制（`CVS`、`RCS`）、Perforce、`GIT`
    和 `SVN`。在利用非对称和对称加密方面拥有丰富经验。他为 `OpenBSD` 和 `Linux 可载内核模块`（LKM）开发过自定义代码。在使用 `Queue`、`Libnet`、`Libpcap`、`Pthreads`
    和 `ncurses` API 方面经验丰富。深入研究 `[R]ARP`、`DNS`、`IPv4`、`IPv6`、`ICMP`、`GMP`、`OSPF`、`RIP`、`TCP`、`UDP`
    和 `SNMP` 等网络协议的理论和实践实现。在 Web 开发（`CMF`、`CRM`、`ERP`）、Web 语言（`HTML`、`Python`、`PHP`、`XML`、`CSS`、`MySQL`、`Postgres`、`Gadfly`
    和 `SQLite`）方面拥有丰富经验。

