    10.1.1 PythonCard


    It can be very tedious to develop a GUI application without an Integrated Development
    Environment (IDE). Below are three IDE''s that support python:


    1.  Open Komodo


    2.  PyQT


    3.  Eclipse


    Eclipse is a very popular IDE primarily used for Java or C programming. It supports
    WxWidgets and python. Should your application reach a high level of complexity,
    you might find yourself using Eclipse. Because Eclipse is beyond the scope of
    this book, I would like to instead introduce PythonCard. PythonCard is a GUI construction
    kit that uses the Python language. ''The PythonCard motto is: "Simple things should
    be simple and complex things should be possible."


    The goal with this book as with PythonCard''s motto is to develop graphical applications
    quickly. PythonCard separates the presentation from the application logic by using
    a resource file to define the presentation using dictionaries. The application
    logic is a separate python file. This allows the developer to concentrate on application
    logic rather then tedious aspects of the widgets size, position, color, and feature.
    To get started with our first application, download “PythonCard” from http://pythoncard.sourceforge.net


    #pcard1.py


    from PythonCard import model


    class blah(model.Background):


    pass


    if __name__=="__main__":


    app=model.Application(blah)


    app.MainLoop()


    Now if you try to run the script, you will get an error because you need to create
    a resource file using " resourceEditor".


