    \ love python'\nI1\n(lp1\nI1\naI2\naI3\natp2\n.\n```\n\n## 4.1.8 Python with Statement\n\
    \nUsing the `with` statement cuts down on exception handling for file stream by\
    \ avoiding the need for `try/finally` blocks of code. According to python documentation,\
    \ the `with` statement clarifies code previously by `try...finally` blocks to\
    \ ensure clean-up code is executed. Syntax is as follows:\n\n`with expression\
    \ [as variable]: with-block`\n\nThe expression is evaluated, and it should result\
    \ in an object that supports the context management protocol `__enter__()` and\
    \ `__exit__()` methods.\n\nLet's write data to a file:\n\n```python\nwith open('output.txt',\
    \ 'w') as f:\n    f.write(\"Usual Hello World!\")\n```\n\nThe above `with` statement\
    \ will automatically close the file after nested block of code.\n\n### 4.1.8.1\
    \ File Handling Modes\n\nTable 0.1: File Modes\n\n| Modes | Description |\n| :---\
