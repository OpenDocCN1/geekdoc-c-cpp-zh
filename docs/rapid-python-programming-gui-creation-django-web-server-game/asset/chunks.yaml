  raw: 'It would also be good to remember that the original game idea you have in
    mind will evolve. No matter how clever you are or how graphically skilled you
    are, expect that more than 80% of your ideas will change and sometimes dramatically
    . This classic 80/20 rule of thumb is informed from talking to many very experienced
    game developers.


    16.1.1 Where to begin?


    There is plenty of code out there that is written for beginners. If you have to
    start from scratch, there will be many problems. The experts reuse the same methods
    over and over; methods such as import, initialize, screen, construct images, load,
    main loop, and more. Often the trade secrets are in graphics acceleration and
    algorithms.


    16.1.2 Above all!


    It is smart to avoid designing in another person''s game engine. The engine was
    built specifically for their game development environment and their idea or perspective.
    While using their game engine, you will be restricted to their ideas. This can
    feel frustrating if you are new to game development. They could also decide that
    they want to sell their engine with all the bells and whistles as a commercial
    product. You can do this too! It is important to become very proficient at re-using
    code. Should you play with game engines? Absolutely. In fact it is mandatory to
    explore and find those limitations. The act of playing with the game engine will
    give you plenty of ideas. Blender is an example of a 3D Graphics Modeling tool
    that can be modified into a 3D game engine environment. It can be helpful to prototype
    a new game idea using an existing game engine.


    16.1.3 Graphics


    Some of the best and most addictive games have mediocre graphics, but they have
    quality game play. Graphics can always improve later as you move forward with
    your idea.


    16.1.4 Minimum requirements for a Game Programmer


    1.  Introduction to programming - We have covered some of these topics already.
    But more importantly you need to understand how to solve problems.


    2.  Programming Languages - Learning C and C++ would be a great stepping stone
    toward mastery of game programming. What you develop in python you can easily
    convert to C/C++. Start with stripping away the libraries. However if you leverage
    popular graphics libraries such as SDL and OpenGL the changes are few and subtle.
    You will spend more time dealing with parsers and analyzers.


    3.  Data Structures and & Algorithms - This is by far the most important topic
    for programming anything at any level. Testing and mastering arrays, linked lists,
    binary trees, general trees, hash tables, and heaps will get you a job anywhere.
    Most people learn them and forget them, then barely get hired as a developer and
    many change careers.


    4.  Compilers - Let''s face it, if you need it to be faster you need to understand
    concepts such as tokenizing, parsing, code generation, and garbage collection.


    5.  Operating Systems - You need to know the limitations of your OS. Knowledge
    of threading, locking, network communication, and device drivers is invaluable
    for multi-player games or reading bits of a DVD-ROM and displaying graphics from
    a 3D card.


    6.  Artificial Intelligence - Heuristics, planning, algorithms, bayesian networks
    and natural language parsing add reality concepts to your gaming environment.


    7.  Databases - You have to keep this data somewhere.


    16.1.5 Game Theory


    How do you make something that others want to play? This can be a daunting task.
    Game companies and marketing analysts research latest trends to gather this information.
    There is a fine balance between themes, map design, level features, sound, story,
    and game play difficulty. In the end you want your game to look good and be fun
    to play. This means you must take a balanced approach during as you move from
    concept to deployment.


    16.1.6 Prototype


    In reality your dream and ideas won''t come to fruition until you actually start
    writing code. You will start building your first prototype and then another until
    you have several prototype versions. Much can be learned from a prototype such
    as the general concept and how to play. You also discover more realities such
    as menus, screen transitions, and how to save or load a game. Here are a few things
    to think about:


    1.  Do you need a story teller?


    2.  Do you need an algorithm expert?


    3.  Do you need a graphic artist? Raster, Vector or both.


    4.  Do you need a musician or sound technician?


    A prototype can also quickly tell you if the game is worth it or not.


    Things to study:


    1.  Best path, shortest path. Dijkstra''s Bellman-Ford


    2.  Collision Detection/Avoidance Behaviors


    3.  Projectile Motion and Vectors


    4.  Map Generation, Tile Generation


    5.  Grid Design Pixel, Coordination System.


    6.  Algorithms -


    a. Minimax - is a decision rule for minimizing the possible loss while maximizing
    the potential gain. This can also be thought of as ''maximizing the minimum gain''.


    Minimax Theorem according to Wikipedia.org established by John Von Neumann states:


    For every two-person, zero-sum game with finite strategies, there exists a


    value V and a mixed strategy for each player, such that (a) Given player


    2''s strategy, the best payoff possible for player 1 is V, and (b)


    Given players 1''s strategy, the best payoff possible for player 2 is - V.


    16.1.7 Zero-sum


    If we add the wins and losses in a game, treating losses as negatives, we find
    that the sum is zero for each set of strategies chosen, then the game is a zero-sum
    game. If a strategy set for which the sum differs from zero, then the game is
    not zero sum. An example would be a single coin toss.


    Figure 0.1:


    zero-sum


    Odd


    Even


    | head | tail |  |


    | head | 1,-1 | -1,1 |


    | tail | -1,1 | 1,-1 |


    16.2 Pygame


    Pygame is a cross-platform set of modules for writing games. Pygame is the replacement
    for the Simple Direct Media Layer ( SDL) Library. The goal was to allow real-time
    computer game development without the need for exhaustive low-level C programming
    to drive the graphical elements of game development. This allows game developers
    to focus more on game logic rather than level programming. Go to pygame.org and
    download pygame or run ''pip install pygame'' from the terminal.


    The basic concepts for creating a game are user input, output and basic world
    simulation. The tools to do this are as follows:


    1.  Input/Output handling - keyboard, mouse, and joystick.


    2.  Screen display - shapes, drawing, image blitting, and font rendering


    3.  Sound - effects and music


    4.  help(''pygame'')


    16.2.1 Screen Initialization


