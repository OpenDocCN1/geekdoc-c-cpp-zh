    1 Introduction


    1.1 Introduction


    The Python programming community is rapidly growing. More people are either migrating
    to python or choosing it as their first high level programming language. It''s
    multiple programming paradigms feature make it an easier first language to learn,
    because it frees you from focusing on the language itself, and more on problem
    solving. Python is highly portable for multiple operating systems, including embedded
    systems. It''s also ``Open Source'''' and can be distributed freely.'
