- fmt: "\nAs you have already discovered EasyGUI works really great for fast projects.\
    \ Just about every piece of code you have written here and some that you are about\
    \ to write can be easily modified for the EasyGUI interface with little effort.\
    \ Now that you understand the basics of EasyGUI it just takes a little extra and\
    \ you can start utilizing Tkinter directly with efficiency.\n\n## 9.1.1 The Basics\n\
    \n### A basic list\n\n`food.py`\n\n```python\nlist= ['milk', 'cheese', 'fruit',\
    \ 'chicken']\nprint list\n```\n\nSo here is our list of food items. To have it\
    \ written to a 'Tk GUI' we import the library and wrap the code with the following\
    \ lines:\n\n`fooda.py`\n```python\nfrom Tkinter import *\nroot=Tk()\nlist= ['milk',\
    \ 'cheese', 'fruit', 'chicken']\nprint list\nroot.mainloop()\n```\n\nFigure 0.1:\n\
    fooda.py\n![](images/00010.jpeg)\n\nTo close the program you will need to use\
    \ your mouse and click the 'x' at the top right of the window you just created.\n\
    \nAs you can see it didn't exactly display the items in the the window and it\
    \ won't appear until the `root.mainloop()` is executed. We need to prepare the\
    \ data to be inserted into the 'X' display or window display.\n\n`foodb.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nlistb=Listbox(root)\nlistb.pack()\n\
    list= ['milk', 'cheese', 'fruit', 'chicken']\nprint list\nroot.mainloop()\n```\n\
    \nFigure 0.2:\nfoodbb.py\n![](images/00011.jpeg)\n\nWhen you run this code you\
    \ will notice a slight difference in appearance. There is a 'Listbox' inside the\
    \ root window. The `listbox.pack()` packs 'listbox' inside the root window to\
    \ appear. All we need to do now is loop the list into `listb.pack()`.\n\n`foodc.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nlistb=Listbox(root)\nlistb.pack()\n\
    list= ['milk', 'cheese', 'fruit', 'chicken']\nfor item in list:\n    listb.insert(END,\
    \ item)\nprint list\nroot.mainloop()\n```\n\nFigure 0.3:\nfoodc.py\n![](images/00012.jpeg)\n\
    \n## 9.1.2 Simplify with functions\n\nYou now have a basic understanding of Tkinter\
    \ and how to populate a 'listbox' using a list. You could do this a lot more easily\
    \ using methods. For example:\n\n`simple.py`\n```python\nfrom Tkinter import *\n\
    root=Tk()\ndef mbutton(mess):\n    b=Button(root,text=mess)\n    b.pack()\nb.mainloop()\n\
    mbutton(\"Press me\")\n```\n\nFigure 0.4:\nsimple.py\n![](images/00013.jpeg)\n\
    \nThis is a lot more refined and we can further extend this by adding a new method\
    \ or extending the existing method.\n\n`simplea.py`\n```python\nfrom Tkinter import\
    \ *\nroot=Tk()\ndef mbutton(mess):\n    b=Button(root,text=mess)\n    b.pack()\n\
    def mlabel(lab):\n    l=Label(root, text=lab)\n    l.pack()\nmbutton(\"Press me\"\
    )\nmlabel(\"My Python\")\nroot.mainloop()\n```\n\nFigure 0.5:\nsimplea.py\n![](images/00014.jpeg)\n\
    \nNotice that we pulled the `mainloop` out so both methods can utilize it. Let's\
    \ extend this further with three methods.\n\n`simpleb.py`\n```python\nfrom Tkinter\
    \ import *\nroot=Tk()\ndef mbutton(mess):\n    b=Button(root,text=mess)\n    b.pack()\n\
    def mlabel(lab):\n    l=Label(root, text=lab)\n    l.pack()\ndef tbox():\n   \
    \ t=Text(root)\n    t.pack()\nmbutton(\"Press me\")\nmlabel(\"My Python\")\ntbox()\n\
    root.mainloop()\n```\n\nFigure 0.6:\nsimpleb.py\n![](images/00015.jpeg)\n\nNext\
    \ we should add data to a 'listbox'.\n\n`simplec.py`\n```python\nfrom Tkinter\
    \ import *\ndef mbutton(mess):\n    b=Button(root,text=mess)\n    b.pack()\ndef\
    \ mlabel(lab):\n    l=Label(root, text=lab)\n    l.pack()\ndef tbox():\n    t=Text(root)\n\
    \    t.pack()\ndef lbox(list):\n    lb=Listbox(root)\n    lb.pack()\n    for i\
    \ in list:\n        lb.insert(END, i)\nroot=Tk()\nmbutton(\"Press me\")\nmlabel(\"\
    My Python\")\ntbox()\nlbox(['milk', 'cheese', 'fruit', 'chicken'])\nroot.mainloop()\n\
    ```\n\nFigure 0.7:\nsimplec.py\n![](images/00016.jpeg)\n\nNotice that we moved\
    \ `root=Tk()` after the methods. This should give insight into the logic of how\
    \ this program works. Let's actually use the button now and print some text with\
    \ color. If you don't see 'asdf'. Run the program and type it in. You can type\
    \ whatever you want.\n\n`simpled.py`\n```python\nfrom Tkinter import *\ndef mlabel():\n\
    \    l=Label(root, text='My Python repeating', fg='red')\n    l.pack()\ndef mbutton(mess,m):\n\
    \    b=Button(root,text=mess,command=m)\n    b.pack()\ndef tbox():\n    t=Text(root)\n\
    \    t.pack()\ndef lbox(list):\n    lb=Listbox(root)\n    lb.pack()\n    for i\
    \ in list:\n        lb.insert(END, i)\nroot=Tk()\nmbutton(\"Press me\",mlabel)\n\
    mlabel(\"My Python\")\ntbox()\nlbox(['milk', 'cheese', 'fruit', 'chicken'])\n\
    root.mainloop()\n```\n\nFigure 0.8:\nsimpled\n![](images/00017.jpeg)\n\n## 9.1.3\
    \ Widgets\n\nAt this point you should realize that pure Tkinter can be very flexible\
    \ and offer an abundance of features for basic programming. Here is a brief list\
    \ of widgets that you can use:\n\n- Frame | Label | Entry | Text | Canvas | Button\
    \ | Radiobutton | Scale | Listbox | Scrollbar | OptionMenu | Spinbox | LabelFrame\
    \ | PanedWindow\n\nThe properties of these widgets are specified in keyword arguments\
    \ you have already seen above as `root`, `text`, etc. The widgets are positioned\
    \ using geometry managers such `Place`, `Pack`, and `Grid`. Actions are bound\
    \ to events by resources. The resource is the keyword argument and `command`.\
    \ Take a look at some of the widgets:\n\n`button.py`\n```python\nfrom Tkinter\
    \ import *\nroot = Tk()\nb= Button(root, text='python', width='6', height='6',\
    \ activebackground='blue', bg='white', fg='red')\nb.pack(padx=20, pady=20)\nroot.mainloop()\n\
    ```\n\nFigure 0.9:\nbutton.py\n![](images/00018.jpeg)\n\n`canvas.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\nc = Canvas(root, width='80', height='60', bg='white')\n\
    c.pack(padx=5, pady=5)\ns=c.create_line(10,30,10,40,10,20,45,30,80)\nroot.mainloop()\n\
    ```\n\nFigure 0.10:\ncanvas.py\n![](images/00019.jpeg)\n\n`canvaspic.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\nc = Canvas(root, width='275', height='100',\
    \ bg = 'white')\nc.pack(padx=5, pady=5)\nphoto=PhotoImage(file='jand.gif')\nitem=c.create_image(0,0,\
    \ anchor=N,image=photo)\nroot.mainloop()\n```\n\nFigure 0.11:\ncanvaspic.py\n\
    ![](images/00020.jpeg)\n\n`checkbutton.py`\n```python\nfrom Tkinter import *\n\
    root=Tk()\nroot.geometry('200x50+250+50')\ncheck=Checkbutton(root,bg = 'white',\
    \ text = 'Check 1', font=('Helvetica',2))\ncheck.pack()\nroot.mainloop()\n```\n\
    \nFigure 0.12:\ncheckbutton.py\n![](images/00021.jpeg)\n\n`entry.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\nentry=Entry(root,bg='white').pack(padx=30,pady=10)\n\
    root.mainloop()\n```\n\nFigure 0.13:\nentry.py\n![](images/00022.jpeg)\n\n`frame.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nframe=Frame(root,bg='green', width=200,\
    \ height=200)\nframe.pack(padx=10,pady=10)\nroot.mainloop()\n```\n\nFigure 0.14:\n\
    frame.py\n![](images/00023.jpeg)\n\n`lable.py`\n```python\nfrom Tkinter import\
    \ *\nroot=Tk()\nlabel=Label(root, font=(\"helvetica\",15),fg='black', text='python\
    \ and tkinter')\nlabel.pack(padx=10,pady=10)\nroot.mainloop()\n```\n\nFigure 0.15:\n\
    label.py\n![](images/00024.jpeg)\n\n`listbox.py`\n```python\nfrom Tkinter import\
    \ *\nroot=Tk()\nl=Listbox(root,width=10)\nl.pack(padx=10,pady=5)\nlist=['John','Jane','Doe']\n\
    for i in list:\n    l.insert(END, i)\nroot.mainloop()\n```\n\nFigure 0.16:\nlistbox.py\n\
    ![](images/00025.jpeg)\n\n`menu.py`\n```python\nfrom Tkinter import *\nroot=Tk()\n\
    m=Menu(root)\nfilemenu=Menu(m,tearoff=0)\nfilemenu.add_command(label='Exit')\n\
    m.add_cascade(label='File', menu=filemenu)\nroot.config(menu=m)\nroot.mainloop()\n\
    ```\n\nFigure 0.17:\nmenu.py\n![](images/00026.jpeg)\n\n`scroll.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\nf= Frame(root, bg='blue')\nmscroll=Scrollbar(f,\
    \ bg='green')\ntext = Text(f, width=20, height=10, yscrollcommand=mscroll.set)\n\
    mscroll.config(command=text.yview)\nmscroll.pack(side = RIGHT, fill=Y)\ntext.pack()\n\
    f.pack()\nroot.mainloop()\n```\n\nFigure 0.18:\nscroll.py\n![](images/00027.jpeg)\n\
    \n## 9.1.4 Entry widget in depth\n\nEntry widget is a perfect example to demonstrate\
    \ a thorough analysis of the widgets. This example will put it together piece\
    \ by piece. It can also be used as a building block for password entry.\n\n`ent.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nroot.geometry('200x210+350+70')\n\
    ent=Entry(root, bg='white')\nent.pack()\nbutton=Button(root, text='press me',\
    \ command='')\nbutton.pack()\nlistb=Listbox(root,bg='blue')\nlistb.pack()\nroot.mainloop()\n\
    ```\n\nFigure 0.19:\nent.py\n![](images/00028.jpeg)\n\nThe above are the building\
    \ blocks for our program. An entry widget, a button widget, and a list box widget.\n\
    \n`ent1.py`\n"
