- fmt: "\nThis is an important module that is used often when handling a list of arguments.\n\
    \n# arg1.py\n\n```python\nimport sys\n\nprint \"script name\", sys.argv[0]\n\n\
    #print \"script arg\", sys.argv[1]\n\n#print \"script arg list\", sys.argv[1:]\n\
    ```\n\nFirst run the script as follows: `python ./arg1.py`.\n\nThen uncomment\
    \ out `sys.argv[1]` and run `python ./arg1.py hello`.\n\nUncomment the last `sys.argv[1:]`\
    \ and run `python ./arg1.py 1 d hello`.\n\noutput:\n```\nscript name arg1.py\n\
    script arg hello\nscript arg ['1', 'a', 'hello']\n```\n\nSo now you get the idea\
    \ that the first field in the list is the script name itself. A loop can easily\
    \ cycle through the list.\n\n# arg.py\n\n```python\nimport sys\n\nfor i in sys.argv:\n\
    \n    print i\n```\n\nNow run it: `python ./arg.py`.\n\nWatch it loop through\
    \ the arguments in the list. You can control your list using an `if` statement.\n\
    \n# arg2.py\n\n```python\nimport sys\n\nif len(sys.argv) > 1:\n\n    print \"\
    Number of arguments:\", len(sys.argv)-1\n    for i in sys.argv[1:]:\n\n      \
    \  print i\n\nelse:\n\n    print \"no arguments...\"\n```\n\nRun the following\
    \ code above: `python ./arg2.py arg1 arg2 hello`.\n\nAs you see it's using a `greater\
    \ than 1` operator. There is always at least one item in the list which is the\
    \ file itself. You need to separate the file name from the arguments. To do this,\
    \ you will need to use `-1\\`.\n\n## 3.3.2 Practical Usage:\n\nHere is a practical\
    \ example. Pay ATTENTION to indentation!\n\n# square.py\n\n```python\nimport sys\n\
    \ndef square(x):\n    return x*x\n\nx = int(sys.argv[1])\n\nprint 'square is %g'\
    \ % square(x)\n```\n\nRun the program as follows: `python ./square.py 4` and it\
    \ should return `16`. However if you run it without an argument it will error.\
    \ To fix you can easily add the `if` statement below to the file above the function\
    \ `def square(x):`. No need to add the `else` label as it is already implicit.\n\
    \n# square1.py\n\n```python\nimport sys\n\ndef square(x):\n    return x*x\n\n\
    if len(sys.argv) != 2:\n\n    print 'Need an integer'\n    sys.exit(1)\n\nx =\
    \ int(sys.argv[1])\n\nprint 'square is %g' % square(x)\n```\n\nRun the following:\
    \ `python ./square1.py 4` then run it again `python ./square1.py`.\n\nThe `if`\
    \ evaluates that an argument exists or not. If not equal (`!=`) then exit. Remember\
    \ that the first field in `sys.argv[0]` is the file itself. Should you choose\
    \ to use more than one integer or a string, the script will error out.\n\nUsing\
    \ `sys.argv` can be very useful when you find yourself using another program or\
    \ script to talk to your python applications. You would be surprised how often\
    \ this happens in the real world. The goal here is that you can create programs\
    \ that require arguments and if the user doesn't enter an argument your code will\
    \ catch it and print out a help statement that explains how to use the program.\n\
    \n## 3.3.3 from import\n\nYou can use both options `from import` but note that\
    \ it can make your code difficult to read. For example `from sys import argv`\
    \ and you could use `argv` rather than `sys.argv`. You can import all names in\
    \ `sys` such as `sys.exit`, `sys.path` in one shot like: `import sys *`. This\
    \ could also make executables larger if compiled on windows. If you are following\
    \ a coding style like `PEP 8`, you will need to be specific and import only the\
    \ modules you plan to use.\n\n## 3.3.4 Testing a Module\n\nSince all modules are\
    \ objects, you can (and should) test them as you write. Make sure you use two\
    \ underscores with no spaces between the underscores. For example: Pay ATTENTION\
    \ to indentation!\n\n# amodtest.py\n\n```python\nif __name__ == '__main__':\n\
    \    print 'access directly'\nelse:\n\n    print 'from import'\n```\n\nNow run\
    \ `python ./amodtest.py`.\n\noutput:\n```\naccess directly\n```\n\nRun interactive\
    \ prompt and confirm you are in same directory as `amodtest.py`.\n\n```\n>>> import\
    \ amodtest\nfrom import\n>>>\n```\n\nAs you can see when the file is imported,\
    \ the `else` statement prints since it is not loaded directly. A more practical\
    \ method would be:\n\n# fmodtest.py\n\n```python\ndef square(x):\n    return x*x\n\
    \nif __name__ == '__main__':\n    print \"testing square(4) directly\", square(4)\n\
    ```\n\nIf you run it directly, it should print out `16`. Next, let's build another\
    \ file and import it as follows:\n\n# testmodf.py\n\n```python\nimport fmodtest\n\
    \nprint \"from import square(16)\", fmodtest.square(16)\n```\n\nNotice this will\
    \ only print the modules function `def square(x)` from `amodtest.py` and nothing\
    \ after.\n\n## 3.3.5 Summary\n\nAt this point you can build any algorithm you\
    \ want. Having the ability to create your own functions gives you the power to\
    \ create custom algorithms without importing additional libraries.\n\n## 3.3.6\
    \ Exercises\n\n1. Go through the examples above using the interactive interpreter.\n\
    2. Convert `whileguess.py` into a function.\n3. Using `sys.argv` can be very useful\
    \ when you find yourself using another program or script to talk to your python\
    \ applications.\n4. `sys.argv` can be very useful.\n"
