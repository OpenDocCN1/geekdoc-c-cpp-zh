- fmt: '

    This book can be used for the experienced programmer, or absolute beginner. The
    complexity of the language gradually progresses, but the concepts will remain
    simple and easy to understand. Readers are not restricted to any previous specific
    concept. All concepts and examples can be easily modified and re-used. You will
    be able to play with the advanced features of python quickly.


    The job market is putting a higher demand for fast turnaround on development for
    new products. It''s also becoming a heavy hitter in the game market for its use
    throughout the game development cycle such as rendering, parsing, statistics and
    core development. Python can be easily extended using `C/C++` for speed and performance.
    It''s used extensively in Academia for Science, Math, Engineering, simulations,
    and other computation experiments. Python''s greatest selling point is the vast
    libraries of pre-written tools. Below is a highlight of tools which comprises
    approximately 10% of what actually exists.


    *   Integrated Development Environments - `Boa Constructor`, a cross-platform
    IDE for Python - `EasyEclipse`, an open source IDE for Python and other languages.

    *   Applications - `BitTorrent` original client, as well as other derivatives
    - `Gajim`, an Instant Message client - `Resolver One`, a spreadsheet.

    *   Web Applications - A feed Aggregator (`Planet`), a user-friendly Content Management
    System (`Plone`), a bug tracking system (`Roundup`).

    *   Video games - `Civilization 4` uses python for most of its tasks, `Eve “online"`
    uses `Stackless Python`. `PyGame` has tons of games written in pure python.

    *   Web frameworks - `CherryPy` an object-oriented web application server and
    framework, `Django` an MVC (Model, View, Controller) web framework, `Zope` is
    an application server commonly used to build content management systems.

    *   Graphics frameworks - `Pygame` has python bindings for `Simple DirectMedia
    Layer` (`SDL`), `Pyglet` is a cross-platform windowing and multimedia library
    for Python, `PIL` (Python Imaging Library) a module for working with images, `Soya
    3D` is a high-level 3D game engine for Python.

    *   GUI frameworks - `PyGTK` is a popular cross-platform GUI library using `GTK+`,
    `PyQt` is another cross-platform GUI library using `Qt`, `wxPython` is a port
    of `wxWidgets` and a cross-platform GUI library for Python.

    *   Scientific packages - `BioPython`, a Python molecular biology suite. `SciPy`
    is a library of scientific and numerical routines.

    *   Mathematical libraries - `matplotlib`, an extension providing `MATLAB`-like
    plotting and mathematical functions. `NumPy` is a language extension that adds
    support for large and fast, multi-dimensional arrays and matrices.

    *   Additional development packages - `Cheetah`, a Python-powered template engine
    and code-generation tool, `mod python` is an Apache module allowing direct integration
    of Python scripts with the Apache web server, `Twisted` is a networking framework
    for Python.

    *   Embedded as a scripting language - `GIMP-` (Graphics Image Manipulation Program),
    `Blender`, 3d graphics program, `Inkscape` is a Graphics program, `Poser` is a
    3D rendering and animation software program that uses `PoserPython` tool-set.

    *   Commercial uses - `Google` uses Python for many tasks including the Backends
    of web App''s, `Maya` is a professional 3D modeler, `NASA` is using Python to
    implement a `CAD/CAE/PDM` repository and model management, integration, and transformation
    system.

    *   Python implementations - `IronPython`, Python for `.NET` and Mono platforms
    - `Jython`, Python coded in Java - `Stackless Python`, Python with co-routines.


    What makes this book unique is the transition from beginner to intermediate programming.
    The transition will occur several times throughout the book, when introducing
    a new topic such as web applications and GUI. You will revisit beginning aspects
    of programming to simplify learning a new module, instead of assuming you are
    already proficient in the previous techniques discussed. Most importantly you
    will be instructed in the ability to convert code to other programming styles
    and technique; this will make it easy to adopt any style or method when re-using
    reusable code. Python also has an enhancement program known as `PEP` (Python Enhancement
    Program), which contains an index of potential proposals to further enhance the
    python programming language. Python is evolving towards `3.x` which includes minor
    changes with regards to backwards compatibility. A chapter at the end of the book
    will be devoted to compatibility changes and migration.


    ### History


    Python was created in the late 1980s by `Guido van Rossum` at `CWI` in the Netherlands
    and was a successor to the `ABC` programming language. Python was re-designed
    to be a multi-paradigm programming language making it possible for programmers
    to adopt multiple styles of programming such as object-oriented programming, structured,
    functional, aspect-oriented programming and meta programming.


    ### Installation


    It is highly recommended that you use `Linux` as your primary platform to learn
    and use python. However you are not restricted. Nearly everything can be done
    in `Microsoft Windows™` or `Apple Macintosh™` with few troubles.


    ### Windows


    Visit `http://www.python.org/download` and you will find an installer for windows.
    Select all installation components.


    If you wish to use Python in `Microsoft Windows™` on the command line, then you
    need to set the `PATH` variable appropriately.


    For `Windows™` 2000, `XP`, `2003`, `Vista`, `2008`, etc... click on `Control Panel
    -> System -> Advanced -> Environment variables`. Click on the variable named `PATH`
    in the “System Variables” section, then select:


    Edit and add; `C:\Python27` to the end of the line.


    Please choose proper directory name. For instance: it could be `C:\Python2.7x`


    ### Linux


    Most Linux distributions come with Python installed by default. However you may
    need to install additional packages such as the documentation. For example, `Knoppix`
    or `Debian` run the following:


    ```

    sudo apt-get install python27-doc

    ```


    By selecting the defaults, you will have installed python core files including
    documentation, such as interactive help and manual pages.


    You can verify the version of python via the command line using `python -V` as
    shown below.


    ```bash

    $ python -V

    Python 2.7.9

    ```


    ### Editors


    Choosing an editor can be very crucial for the successful development of your
    scripts. You have to be completely comfortable with your editor and have full
    knowledge of how it writes files. For instance, scripts written on `Microsoft
    Windows™ Notepad` can have several issues when you port the files to a Linux or
    BSD system. Those files might have carriage return issues `M` on each statement.
    You would have to manually remove them on each statement or do a file wide search
    and replace which can be tricky because you need an escape code to find it. The
    escape code is\x0D` or `\x0D`. However you can avoid these issues by using a compatible
    editor.


    ### Case Sensitive


    You might have noticed `Microsoft Windows™` is not case sensitive. However, on
    a Unix variant operating system or Linux, you will need to be more specific when
    executing scripts. For example, typing `python` at the command prompt would list
    the following:


    ```bash

    $ python

    Python 2.7.6 (default, Mar 22 2014, 22:59:56)

    [GCC 4.8.2] on linux2

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    Note: To exit out of the interpreter press "Ctrl-D" followed by enter or type
    `exit()`.


    Uppercase Python would reveal an error as follows:


    ```bash

    $ Python

    -bash: Python: command not found

    ```


    If you are using python in iOS, Apple accepts the uppercase `Python`, and you
    will not see an error.


    ### Additional Packages


    You will learn how to download the following packages in later chapters as you
    need them:


    *   `python-doc` - Documentation for the high-level object-oriented-programming.

    *   `python-docutils` - Utilities for the documentation of Python.

    *   `python2.7-doc` - Documentation for the high-level object-oriented language.

