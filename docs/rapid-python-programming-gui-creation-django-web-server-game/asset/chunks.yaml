    ## 2.0.15 Variables and Assignment


    Assignments must begin with either an (upper or lower case) letter or an underscore
    (`_`). A number can be used after the first letter or underscore. Here are some
    examples. Please try each one to get a feel for the effect.


    ```

    >>> var1=1

    >>> print var1

    1

    >>> a=2

    >>> print a

    2

    >>> b,c=3,4

    >>> print b,c

    3 4


    >>> s= ''string''

    >>> print s

    string

    >>> s

    ''string''

    ```


    ## 2.0.16 Operators, Order, Indent


    These are the most commonly used operators. The rest are listed in the appendix.


    ### Table 0.1: Common Operators


    | Operator | Name | Example |

    | :--- | :--- | :--- |

    | `+` | Plus | `2+2` gives 4 |

    | `-` | Minus | `4-2` gives 2 |

    | `*` | Multiplication | `2*6` gives 12 |

    | `/` | Division | `6/2` gives 12 |

    | `%` | Modulus | `8%3` gives 2 |

    | `<` | Less than | `8<4` gives false |

    | `>` | Greater Than | `8>4` gives true |

    | `<=` | Less Than or equal | `8<=4` gives false |

    | `>=` | Greater Than or equal | `8>=4` gives false |

    | `==` | Equal | `x=2; x==2` gives true |

    | `!=` | not equal | `x=2; x!=3` gives true |

    | `**` | power | `2**2` gives 4, `2**3` gives 8 |


    Type in the following expressions:


    ```

    >>> 8+8

    16

    >>> 8-4

    4

    >>> 4*2

    8

    >>> 8/2

    4

    >>> 2+3*8

    26

    >>> 2/3

    0

    >>> 2.0/3.0

    0.66666666666666663

    ```


    Notice that in the equation `2+3*8`, multiplication comes before addition. You
    can change this around by using parenthesis `(2+3)*8` gives 40. Also notice `2/3`
    gives 0. Since it''s an integer it returns the appropriate integer. If you know
    that the expression yields a decimal place, then supply it to begin with, otherwise
    you will corrupt your output.


    ## 2.0.17 Pitfalls


    You may have noticed with the above examples that you can run into many pitfalls.
    Truncation, and conversion are the primary causes of corruption. Always test your
    work first before deployment.


    ## 2.0.18 Integer Conversion


    ```

    >>> number=1234

    >>> int(number)

    1234

    >>> int(12.34)

    12

    >>> round(12.34)

    12.0

    >>>oct(number)

    ''02322''

    >>> hex(number)

    ''0x4d2''

    >>> print 2**256

    115792089237316195423570985008687907853269984665640564039457584007913129639936

    >>> x=1234567890

    >>> y=3489493838

    >>> x+y

    4724061728L

    >>> x*x

    1524157875019052100L

    >>> x*y

    4308017044747661820L

    ```


    As you can see, “python” supports large integers out of the box. However you might
    see the “L” statement as listed in above examples. This really depends on the
    operating system.


