    ## 1.1.8 Versions


    At the beginning of this project all applications were compiled using `python`
    version `2.7`. Before completion of this project all applications were compiled
    and tested with `Python` version `2.8`. The code will work in `Python 3.x` with
    minor changes such as: `print` statement. Almost everything here is backwards
    compatible and will translate easily into `Python 3` if you familiarize yourself
    with the minor syntactical changes. Don''t let the version of `python` distract
    you. The changes are often very minor. See the two following examples below:


    * Python `2.2x` is: `print variable`.

    * Python `3.x` is: `print(variable)`

    * Please visit `http://www.wiki.python.org/moin/Python2orPython3`


    ## 1.1.9 Installation and Configuration


    It is highly recommended that you choose an Operating System that you are proficient
    using. It is assumed that you have a clear understanding of your `Operating System`
    and how to execute programs via command line.


    ## 1.1.10 Python Interactive Prompt


    For Microsoft Windows™ users, `Python` interactive interpreter can be executed
    via the `DOS` prompt or through the “IDLE”. (Interactive Development Environment)
    program.


    To start the interactive interpreter enter `"python"` at the command or shell
    prompt in Windows or `xterm` in Linux or `Terminal` in iOS.


    The following information should appear:


    ```bash

    knoppix@Microknoppix:~$ python

    Python 2.5.2 (r252:60911, Jan 4 2009, 17:40:26)[GCC 4.3.2]

    on linux2 Type "help", "copyright", "credits" or "license"

    for more information.

    >>>

    ```


    You can immediately begin typing your program


    ```python

    >>> print ''I am learning python''

    I am learning python

    >>>

    ```


    Please note that `python` is case sensitive. `Print` will give you an invalid
    syntax error.


    ```python

    >>> Print ''hello''

    File "<stdin>", line 1

    Print ''hello''

    ^

    SyntaxError: invalid syntax

    >>>

    ```


    To exit out of the interpreter press `"Ctrl-D"` followed by enter or type `“exit()"`.


    ## 1.1.11 Making a Python Script


    You can create a script using an editor. If you are using Microsoft Windows™ I
    suggest you use `IDLE` or `editpad` to create your script. You may need to download
    `editpad` from: `http://www.editpadpro.com`. If you are using Linux, I suggest
    using `VIM` as your editor or `Sublime` for iOS. Open your editor, create a new
    file and type the following into the editor:


    ```python

    print ''I am learning python''

    ```


    Save the file as `first.py`.


    Once the file is saved you can type the following on the command line or terminal:


    ```bash

    knoppix@Microknoppix:~$ python first.py

    I am learning python

    knoppix@Microknoppix:~$

    ```


    A proper script would include the path to the interpreter, a description, the
    name of the file and other files that might be involved. The path to the interpreter
    is not needed while using `python` on a `windows™` operating system.


    ```python

    #!/usr/bin/python

    # program name first.py

    print ''I am learning python''

    ```


    Edit the file with the information in the figure above, then Save and Close the
    file. If you are on a Linux system, you will need to change the file permissions
    to make it an executable program.


    ```bash

    knoppix@Microknoppix:~$ chmod a+x fist.py

    ```


    You can then execute the program as follows:


    ```bash

    knoppix@Microknoppix:~$ ./first.py

    I am learning python

    knoppix@Microknoppix:~$

    ```


    Notice the `#!` hash or number symbol and exclamation. It''s known in Unix or
    Linux as “explode” and “bang” or “sha-bang” which is the key to execute the shell
    or interpreter. Anything after the first line is considered either code or comments.
    Comments are designated using the hash (`#`) symbol. On Windows™ the path to the
    `Python` interpreter will be, for example, `c:\python27.x\python.exe`. You can
    also omit (`#!`) on first line.


    Python''s built-in interpreter also has a nice interactive feature known as `help()`.
    To start the interactive interpreter enter `"python"` at the command or shell
    prompt:


    ```bash

    knoppix@Microknoppix:~$ python

    Python 2.5.2 (r252:60911, Jan 4 2009, 17:40:26) [GCC 4.3.2] on

    linux2 Type "help", "copyright", "credits" or "license"

    for more information.

    >>> help()

    Welcome to Python 2.7! This is the online help utility.

    If this is your first time using Python, you should definitely

    check out the tutorial on the Internet at

    http://www.python.org/doc/tut/.

    Enter the name of any module, keyword, or topic to get help on

    writing Python programs and using Python modules. To quit

    this help utility and return to the interpreter, just type `"quit"`.

    To get a list of available modules, keywords, or topics, type

    `"quit"`.


    ## 1.1.12 Summary


    In this chapter you have learned how to use the interactive interpreter, how to
    create and execute scripts, and how to activate modules.


    ## 1.1.13 Exercises


    1. Go through the examples above using the interactive interpreter.

    2. Create a script to print out list of modules and redirect that list to a file
    called `python.txt`.

    3. Create another script to print and redirect to `print.txt`.


    ## 2 Strings – Operators - Conditions


    ## 2.0.14 Strings


    ### Single Quotes


    You already wrote your first string `print ''I am learning python''`. Next, open
    up the command prompt or terminal and input the following string into the interpreter
    `print ''It''s python''`. You should receive an error. It''s because of the extra
    single quote. Now try it with an escape key called the back slash (\): `print
    ''It\''s python''`. If you need a back slash such as in `''the good \ bad \ ugly''`
    just add an escape key (`\\`).


    ```python

    >>> print ''the good \\ bad \\ ugly''

    the good \ bad \ ugly

    ```


    ### Double Quotes


    Your scripts might look a little better if you swap between single and double
    quotes as needed.


    ```python

    >>> print "It''s your python"

    It''s your python

    ```


    ### Triple Quotes ('''''' """)


    Before we move into triple quotes keep in mind that you can also create a string
