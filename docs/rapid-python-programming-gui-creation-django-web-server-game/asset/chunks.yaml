    \n图 0.5:\nDIA\n\n![](img/00039.jpeg)\n\n让我们玩玩 `DIA` 吧。从 UML 组件界面中选择类组件。点击屏幕上的任何地方。结果应该如下：\n\
    \n图 0.6:\nDIA 类组件\n\n![](img/00040.jpeg)\n\n下一步是在组件上右键单击（Mac 用户为双击）并选择属性（properties）。要删除一个对象，你可以点击该对象并输入\
