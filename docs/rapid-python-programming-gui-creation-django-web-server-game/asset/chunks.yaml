    当我们谈论“自由软件”时，我们指的是使用的自由，而不是价格。我们的通用公共许可证旨在确保你拥有分发自由软件副本的自由（如果你愿意，可以对此项服务收费）；确保你能收到源代码，或者在你需要时可以获取它；确保你可以修改软件并将其部分内容用于新的自由程序中；并确保你被告知可以做这些事情。


