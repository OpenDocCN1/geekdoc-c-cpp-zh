    \    print i\n```\n\n输出：\n```\ngenerate\n1\nmy\n2\nlist\n```\n\n注意 `yield` 语句在旧版本中是一个关键字函数，你需要生成器设施来导入。现在，你可以直接在\
    \ IDLE 解释器中调用 `yield`：\n\n```python\n>>> from gen1 import *\n>>> blah=mygen()\n\
    >>> blah.next()\ngenerate\n1\n>>> blah.next()\nmy\n2\n>>> blah.next()\nlist\n\
    Traceback (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nStopIteration\n\
    >>>\n```\n\n生成器的目的是最小化加载到大列表所消耗的内存。生成器通常用于如 `Fibonacci` 和 `factorial` 等算法。这还需要大量的内存和处理速度。下面是一个显示\
    \ `yield` 关键字各种用法的脚本。注意 `yield` 或 `print` 语句以及列表推导式的用法。\n\n```python\n# mlist.py\n\
    def mlist():\n    print \"a\"\n    yield \"one\"\n    print \"b\"\n    yield \"\
    two\"\n    print \"c\"\n    yield \"three\"\n    print \"d\"\n    yield \"four\"\
    \n    print \"e\"\n    yield \"five\"\n    print \"f\"\n    yield \"six\"\n  \
    \  print \"g\"\n    yield \"seven\"\n    print \"h\"\n\nfor i in mlist():\n  \
    \  print i\nfor x,y in zip([0], mlist()):\n    print x\nfor x,y in zip([0,1,2],\
    \ mlist()):\n    print x\nfor x,y in zip([j for range(9) if j>5], mlist()):\n\
    \    print x\nfor x,y in zip([j for range(9)], mlist()):\n    print x\nfor x,y\
    \ in zip([j for range(9)], mlist()):\n    print y\nimport itertools\nlist(itertools.islice(mlist(),4))\n\
    print \"blah\"\n```\n\n```\n# blah.txt\nHello world\nThis is you\nwow data\nthis\
    \ is cool\nI can wait\n```\n\n这是一个使用文件的生成器示例。\n\n```python\n# tfile1.py\nf=open(\"\
    blah.txt\",\"r\")\ndef mygen(f):\n    for i in f.readlines():\n        yield i\n\
    if __name__==\"__main__\":\n    a=mygen(f)\n    for i in a:\n        print i\n\
    \    f.close()\n```\n\n```python\n# tfile2.py\nfromfile1 import *\nfor x,y in\
    \ zip([z for range(9)], mygen(f)):\n    print repr(x),repr(y)\nfor x,y in zip([z\
    \ for range(9) if z > 5], mygen(f)):\n    print x\nfor x,y in zip([z for range(9)\
    \ if z > 5], mygen(f)):\n    print y\nfor i in mygen(f):\n    print i\nlist(mygen(f))\n\
    ```\n\n结果：\n```\n0 'Hello world\\n'\n1 'This is you \\n'\n2 'wow data\\n'\n3 'this\
    \ is cool\\n'\n4 'I can wait to \\n'\n5 'jump in \\n'\n6 'the air\\n'\n```\n\n\
    注意可以做什么。每个条目都是 `yield` 语句。\n\n## 7.4 线程\n\nPython 有同时执行任务的能力。随着 Python 编程的深入，你可能需要线程来完成工作。示例包括解析多个文件、将文件复制到多个服务器或执行杂项任务。对于\
