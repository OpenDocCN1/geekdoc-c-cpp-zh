    1.1.8 Versions


    At the beginning of this project all applications were compiled using python version
    2.7\. Before completion of this project all applications were compiled and tested
    with Python version 2.8\. The code will work in Python 3.x with minor changes
    such as: print statement. Almost everything here is backwards compatible and will
    translate easily into Python 3 if you familiarize yourself with the minor syntactical
    changes. Don''t let the version of python distract you. The changes are often
    very minor. See the two following examples below:


    *   Python 2.2x is: print variable.


