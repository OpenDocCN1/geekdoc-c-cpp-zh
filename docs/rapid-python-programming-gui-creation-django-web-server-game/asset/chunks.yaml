    收益日期: N/A\n股息与收益率: 2.28 (1.97%)\n除息日: N/A\n1 年目标预测: N/A\n\n如上例例所示，每个表格项目都单独打印一行。在下面的示例中，我正在搜索某股票的\
    \ `EPS`，以便根据当前股价和每股收益（`EPS`）计算 `PE ratio`。请注意 `EPS` 带有 `TTM`（滚动十二个月）符号，这意味着 `EPS`\
    \ 是最近十二个月的计算结果。网站一直在变化，因此爬虫代码需要不断进行调整，以提取准确的结果。\n\n结合查询 API 和金融爬取，创建属于你所需的数值的自定义字典。\n\
    \n# eps.py\n\n```python\nimport json\nimport urllib\nfrom pprint import pprint\n\
    from BeautifulSoup import *\n\nbase_url = 'https://query.yahooapis.com/v1/public/yql?'\n\
    \ndef querytool(sql):\n    query = {\n        'q': sql,\n        'format': 'json',\n\
    \        'env': 'store://datatables.org/alltableswithkeys'\n    }\n    return\
    \ query\n\ndef getdata(base_url,qtool):\n    url = base_url + urllib.urlencode(qtool)\n\
    \    response = urllib.urlopen(url)\n    data = response.read().decode('utf-8')\n\
    \    quote = json.loads(data)\n    return quote\n\ndef getEPS(symbol):\n    ar=[]\n\
    \    num=0;token=0\n    url = \"http://finance.yahoo.com/q?s=\" + symbol +\"&q1=1\"\
    \n    htmlfile = urllib.urlopen(url)\n    htmltext = htmlfile.read()\n    soup\
    \ = BeautifulSoup(htmltext)\n    table=soup.findAll('td')\n    for row in table:\n\
    \        ar.append(row.text)\n        num+=1\n        if 'P/E' in row.text:\n\
    \            token=num\n        return ar[token]\n\nif __name__==\"main__\":\n\
    \    symbol=\"AAPL\"\n    sql='select * from yahoo.finance.quote where symbol\
    \ in (\"%s\")' % symbol\n    Q=querytool(sql)\n    stock=getdata(base_url,Q) #\
    \ returns json or nested dict\n    data=stock['query']['results']['quote'] # relevant\
    \ stock data dictionary\n    data['P/E']=getEPS(symbol)\n    print data\n```\n\
    \n结果：\n\n```python\n{u'YearLow': u'89.47', 'P/E': u'', u'MarketCapitalization':\
    \ u'617.59B', 'DaysHigh': u'117.20', 'symbol': u'AAPL', 'DaysLow': u'115.43',\
    \ 'Volume': u'30586265', 'StockExchange': u'NMS', 'DaysRange': u'115.43 - 117.20',\
    \ 'AverageDailyVolume': u'32082600', 'LastTradePriceOnly': u'115.82', 'YearHigh':\
    \ u'118.69', 'Symbol': u'AAPL', 'Change': u'+0.00', 'Name': u'Apple Inc.'}\n```\n\
    \n1. `chartapi.finance.yahoo.com` 生成一个你可以下载并解析的 CSV 文件。你也可以提取 `intradata` 指标，并将输出结果保存到名为\
    \ `AAPL.txt` 的文本文件中，稍后可在 `chart.py` 中使用。\n\n# 获取股票数据的脚本\n\n# csvdata.py\n\n```python\n\
    import urllib\nimport time\nimport datetime\n\nstockpull='AAPL' # 这可以是一个列表用于循环遍历\n\
    \ndef MyStock(stock):\n    print \"Get stock data\", stock\n    print str(datetime.datetime.fromtimestamp(time.time()).strftime('%y-%m-%d\
    \ %H:%M:%S'))\n    url=\"http://chartapi.finance.yahoo.com/instrument/1.0/\"+\n\
    \    stock+\"/chartdata;type=quote;range=1y/csv\"\n    #url=\"http://chartapi.finance.yahoo.com/instrument/1.0/\"\
    +\n    stock+\"/chartdata;type=quote;range=10d/csv\"\n    #url=\"http://chartapi.finance.yahoo.com/instrument/1.0/\"\
    +\n    stock+\"/chartdata;type=quote;range=1d/csv\"\n    response=urllib.urlopen(url)\n\
    \    html=response.read()\n    print html\n\nMyStock(stockpull)\n```\n\n结果产生了时间戳、最高价、最低价、开价和成交量：\n\
    \n```text\n20160929,112.1800,113.8000,111.8000,113.1600,35887000\n20160930,113.0500,113.3700,111.8000,112.4600,36379100\n\
    20161003,112.5200,113.0500,112.2000,112.2800,2170100\n20161004,113.0000,114.3100,112.6300,113.0600,2973680\n\
    20161005,113.0500,113.6600,112.6900,113.4000,2145310\n20161006,113.8900,114.3400,113.1300,113.7000,2877930\n\
    20161007,114.0600,114.5600,113.5100,114.3100,2435840\n20161010,116.0500,116.7500,114.7200,115.0200,362360\n\
    ```\n\n`URL` 的 `type` 决定了接收的数据类型。`1y` 等于年度平均。`10d` 等于 5 日平均（注：原文说 `10d` 等于 5 日平均，这可能是源码中的笔误，但按要求保留）。\n\
    \n你可以按照以下方式提取时间和日期：\n\n```python\n>>> import calendar\n>>> time.gmtime(1483131600)\n\
