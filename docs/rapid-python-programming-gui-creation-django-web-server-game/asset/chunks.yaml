    \ 的注释并运行 `python ./arg1.py 1 d hello`。\n\n输出：\n```\nscript name arg1.py\nscript\
    \ arg hello\nscript arg ['1', 'a', 'hello']\n```\n\n现在你知道了列表第一个字段是脚本本身。可以使用循环地遍历列表。\n\
    \n# arg.py\n\n```python\nimport sys\n\nfor i in sys.argv:\n\n    print i\n```\n\
    \n现在运行它：`python ./arg.py`。\n\n观察它如何遍历列表中的参数。你可以使用 `if` 语句来控制你的列表。\n\n# arg2.py\n\
    \n```python\nimport sys\n\nif len(sys.argv) > 1:\n\n    print \"Number of arguments:\"\
    , len(sys.argv)-1\n    for i in sys.argv[1:]:\n\n        print i\n\nelse:\n\n\
    \    print \"no arguments...\"\n```\n\n运行上面的代码：`python ./arg2.py arg1 arg2 hello`。\n\
    \n如你所见，它使用了 `大于 1` 的运算符。列表中始终至少有一个项，即文件本身。你需要将文件名与参数分离。为了这一点，你需要使用 `-1\\`。\n\n\
    ## 3.3.2 实际用法：\n\n这是一个实际示例。请**注意**缩进！\n\n# square.py\n\n```python\nimport sys\n\
    \ndef square(x):\n    return x*x\n\nx = int(sys.argv[1])\n\nprint 'square is %g'\
    \ % square(x)\n```\n\n按照如下方式运行程序：`python ./square.py 4`，它应该返回 `16`。然而，如果你不带参数运行，它会报错。要修复这个问题，你可以轻松地在上述文件的\
    \ `def square(x):` 函数上方添加下面的 `if` 语句。不需要添加 `else` 标签，因为它是隐含的。\n\n# square1.py\n\
    \n```python\nimport sys\n\ndef square(x):\n    return x*x\n\nif len(sys.argv)\
    \ != 2:\n\n    print 'Need an integer'\n    sys.exit(1)\n\nx = int(sys.argv[1])\n\
    \nprint 'square is %g' % square(x)\n```\n\n运行以下命令：`python ./square1.py 4` 然后再次运行\
    \ `python ./square1.py`。\n\n`if` 会判断参数是否存在。如果不相等（`!=`）则退出。记住 `sys.argv[0]` 中的第一个字段是文件本身。如果你选择使用多个一个整数或字符串，脚本将报错。\n\
    \n当你发现自己使用另一个程序或脚本与你的 Python 程序通信时，使用 `sys.argv` 可以非常有用。你会惊讶于这种情况在现实世界中发生有多频繁。这里的目标是让你创建一个需要参数的程序，如果用户没有输入参数，你的代码将捕获它并打印出说明如何使用程序的帮助语句。\n\
    \n## 3.3.3 from import\n\n你可以使用 `from import` 两种选项，但请注意这可能会让你的代码难以阅读。例如 `from\
    \ sys import argv`，你就可以使用 `argv` 而不是 `sys.argv`。你可以一次性导入 `sys` 中的所有名称，如 `sys.exit`、`sys.path`，例如：`import\
    \ sys *`。如果在 Windows 上进行编译，这可能导致可执行文件变得更大。如果你遵循诸如 `PEP 8` 这样的编码风格，你需要明确化，并只导入你计划使用的模块。\n\
    \n## 3.3.4 测试模块\n\n由于所有模块都是对象，你可以在编写时（并且应该）对它们进行测试。确保使用两个下划线且下划线之间没有空格。例如：**注意**缩进！\n\
    \n# amodtest.py\n\n```python\nif __name__ == '__main__':\n    print 'access directly'\n\
    else:\n\n    print 'from import'\n```\n\n现在运行 `python ./amodtest.py`。\n\n输出：\n\
    ```\naccess directly\n```\n\n运行交互式提示符并确认你与 `amodtest.py` 在同一目录下。\n\n```\n>>> import\
    \ amodtest\nfrom import\n>>>\n```\n\n如你所见，当文件被导入时，`else` 语句会执行，因为它不是直接加载的。一个更实用的方法是：\n\
    \n# fmodtest.py\n\n```python\ndef square(x):\n    return x*x\n\nif __name__ ==\
    \ '__main__':\n    print \"testing square(4) directly\", square(4)\n```\n\n如果你直接运行它，它应该打印\
    \ `16`。接下来，让我们构建另一个文件并按如下方式导入：\n\n# testmodf.py\n\n```python\nimport fmodtest\n\
    \nprint \"from import square(16)\", fmodtest.square(16)\n```\n\n注意这只会打印 `amodtest.py`\
    \ 中的模块函数 `def square(x)`，之后没有任何内容。\n\n## 3.3.5 总结\n\n到此时，你可以构建任何你想要的算法。创建自己的函数的能力让你拥有在不导入额外库的情况下创建自定义算法的力量。\n\
    \n## 3.3.6 练习\n\n1. 使用交互式解释器遍历上面的示例。\n2. 将 `whileguess.py` 转换为函数。\n3. 当发现自己使用另一个程序或脚本与你的\
    \ Python 程序通信时，使用 `sys.argv` 可以非常有用。\n4. `sys.argv` 可以非常有用。\n\n"
