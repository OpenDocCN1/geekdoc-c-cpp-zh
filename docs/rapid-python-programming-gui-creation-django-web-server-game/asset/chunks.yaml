    3.3 Modules


    Python comes with a large library of modules that can be used for all sorts of
    tasks from database programming, web programming, to graphics and games. A module
    is a file that contains functions and variables defined for reuse. One of the
    first modules used was the string module that has a series of functions designed
    to manipulate strings. To use the module you import it as follows:


    import string


    Of course string is a standard library. You can build and save functions in another
    file and load them using import. Make sure the file you import has a ''py'' extension.
    For example these two files:


    #hellomodule.py


    def hello():


    print "hello"


    Create another file ''helloprog.py'' and add the following:


    #helloprog.py


    import hellomodule


    hellomodule.hello()


    Then run ''python ./helloprog.py''


    It should print out ''hello'' and it will also create a new file called ''hellomodule.pyc'':
    The ''.pyc'' is a byte compiled file. It pre-compiles the file that is imported
    for speed on repeat usage. This is useful because importing libraries can take
    time to load depending on the library and the resources of the computer you are
    using.


    3.3.1 sys Module'
