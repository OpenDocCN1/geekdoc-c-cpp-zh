    Apartment


    ![](images/00008.jpeg)


    1.  Imported both programs ''apartment.py'' and ''easygui.py''


    2.  Initialize the program ''myCo''


    3.  Create a list data=[]


    4.  Populate the list with our loop statement


    5.  Add the data[] to our ''textbox''.


    It takes six lines to integrate our program for graphical output. The only thing
    missing is a multi-enter box. Feel free to look into ''easygui'' for this example
    listed below.


    multenterbox(msg="Fill in values for the fields."


    , title=" "


    , fields=()


    , values=()


    )


    For example:


    msg = "Enter your personal information"


    title = "Credit Card Application"


    fieldNames = ["Name","Street Address","City","State","ZipCode"]


    fieldValues = [] # we start with blanks for the values


    fieldValues = multenterbox(msg,title, fieldNames)


    Using the example above let''s add it to our code ''extra.py''


    #!/usr/bin/python


    #use and import apartment4.py


    #extra.py


    from apartment4 import *


    from easygui import *


    msg="Enter Fields"


    title="Apartment Complex"


    fieldNames=["unit","parking","pool","rooms","people"]


    fieldValues=[]


    fieldValues=multenterbox(msg,title, fieldNames, fieldValues)


    fd=fieldValues #print fd[0]


    #myCo=complex(10,8,1,20,15)


    myCo=complex(int(fd[0]),int(fd[1]),int(fd[2]),int(fd[3]),int(fd[4]))


    myCo.calc()


    data=[]


    for i in myCo.result():


    data.append(i+”\n”)


    textbox("apt data", "Apartment Complex", data)


    Figure 0.6:


    Apartment input


    ![](images/00009.jpeg)


    So in roughly ''11'' lines we added input fields for our apartment complex. You
    can find many other examples in the ''easygui.py'' file. You can improve this
    code by wrapping ''fd=fieldValues'' with ''int(fd)'' and adding each field to
    ''complex()'' You can also use a loop to populate those fields.


    8.1.1 EasyGui Discontinued


    Stephen Ferg retired the project in 2013 but it was picked up in later in 2014\.
    Either way the framework is simple and not event driven. Get a copy of the code
    and feel free to make modifications of your choice.


