    \ anchor=N,image=photo)\nroot.mainloop()\n```\n\n图 0.11:\ncanvaspic.py\n![](img/00020.jpeg)\n\
    \n`checkbutton.py`\n```python\nfrom Tkinter import *\nroot=Tk()\nroot.geometry('200x50+250+50')\n\
    check=Checkbutton(root,bg = 'white', text = 'Check 1', font=('Helvetica',2))\n\
    check.pack()\nroot.mainloop()\n```\n\n图 0.12:\ncheckbutton.py\n![](img/00021.jpeg)\n\
    \n`entry.py`\n```python\nfrom Tkinter import *\nroot=Tk()\nentry=Entry(root,bg='white').pack(padx=30,pady=10)\n\
    root.mainloop()\n```\n\n图 0.13:\nentry.py\n![](img/00022.jpeg)\n\n`frame.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nframe=Frame(root,bg='green', width=200,\
