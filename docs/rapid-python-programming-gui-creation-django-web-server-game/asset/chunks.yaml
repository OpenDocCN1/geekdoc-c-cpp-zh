    \n## 9.1.3 组件 (Widgets)\n\n此时，你应该意识到纯 Tkinter 可以非常灵活，并为编程提供丰富的功能。这里是你可以使用的组件列表：\n\
    \n- Frame | Label | Entry | Canvas | Button | Radiobutton | Scale | Listbox |\
    \ Scrollbar | OptionMenu | Spinbox | LabelFrame | PanedWindow\n\n这些组件的属性已经在上方\
    \ `root`、`text` 等。组件使用几何管理器 `Place`、`Pack` 和 `Grid` 进行布局。动作通过资源绑定。该资源是关键字参数 `command`。查看一些组件：\n\
    \n`button.py`\n```python\nfrom Tkinter import *\nroot = Tk()\nb= Button(root,\
    \ text='python', width='6', height='6', activebackground='blue', bg='white', fg='red')\n\
    b.pack(padx=20, pady=20)\nroot.mainloop()\n```\n\n图 0.9:\nbutton.py\n![](img/00018.jpeg)\n\
    \n`canvas.py`\n```python\nfrom Tkinter import *\nroot=Tk()\nc = Canvas(root, width='80',\
    \ height='60', bg='white')\nc.pack(padx=5, pady=5)\ns=c.create_line(10,30,10,40,10,20,45,30,80)\n\
    root.mainloop()\n```\n\n图 0.10:\ncanvas.py\n![](img/00019.jpeg)\n\n`canvaspic.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nc = Canvas(root, width='275', height='100',\
