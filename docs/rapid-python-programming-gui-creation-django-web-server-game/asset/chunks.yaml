  trans: "\n访问 `http://www.sqlite.org` 并下载适用于你系统的最新二进制文件。以下是在名为 `mytable.db` 的数据库中创建\
    \ '3' 个字段的示例。表名为 `foo`。\n\n```bash\n./sqlite3 mytable.db\n```\n\nSQLite 版本 3.6.10\n\
    \n输入 \".help\" 查看帮助\n\n输入以 \";\" 结束的 SQL 语句\n\nsqlite> create table foo (id INTEGER\
    \ PRIMARY KEY, fname VARCHAR(50), lname VARCHAR(50));\nsqlite> insert into foo\
    \ values (1,'john','doe');\nsqlite> select * from foo\n...> ;\n1|john|doe\n\n\
    sqlite>\n\n如你所见，这非常简单。请注意我在 `“select * from foo”` 中漏掉了分号。我必须在下一行输入它。下面是可以使用的命令列表。\n\
    \n```bash\nsqlite> .help\n```\n\n- `.bail ON|OFF` 遇到错误后停止。默认 OFF\n- `.databases`\
    \ 列出已连接数据库的名称和文件\n- `.dump ?TABLE? ...` 将数据库以 SQL 文本格式导出\n- `.echo ON|OFF` 开启或关闭命令回\n\
    - `.exit` 退出此程序\n- `.explain ON|OFF` 开启或关闭适用于 EXPLAIN 的输出模式\n- `.header(s) ON|OFF`\
    \ 开启或关闭表头显示\n- `.help` 显示此消息\n- `.import FILE TABLE` 从 `FILE` 将数据导入 `TABLE`\n\
    - `.indices TABLE` 显示 `TABLE` 上所有索引的名称\n- `.load FILE ?ENTRY?` 加载扩展库\n- `.mode\
    \ MODE ?TABLE?` 设置输出模式，其中 `MODE` 为以下之一：\n    - `csv` 逗号分隔值\n    - `column` 左对齐列。（参见\
    \ `.width`）\n    - `html` HTML `<table>` 代码\n    - `insert` 针对 `TABLE` 的 SQL 插入语句\n\
    \    - `line` 每行一个值\n    - `list` 由 `.separator` 字符串分隔的值\n    - `tabs` 制表符分隔值\n\
    \    - `tcl` TCL 列表元素\n- `.nullvalue STRING` 用 `STRING` 代替 `NULL` 值\n- `.output\
    \ FILENAME` 将输出发送到 `FILENAME`\n- `.output stdout` 将输出发送到屏幕\n- `.prompt MAIN CONTINUE`\
    \ 替换标准提示符\n- `.quit` 退出此程序\n- `.read FILENAME` 执行 `FILENAME` 中的 SQL\n- `.schema\
    \ ?TABLE?` 显示 `CREATE` 语句\n- `.separator STRING` 更改输出模式和 `.import` 使用的分隔符\n- `.show`\
    \ 显示各种设置当前值\n- `.tables ?PATTERN?` 列出匹配 LIKE 模式的表名\n- `.timeout MS` 尝试打开锁定表的时长（毫秒）\n\
    - `.timer ON|OFF` 开启或关闭 CPU 计时器测量\n- `.width NUM NUM ...` 设置 \"column\" 模式的列宽\n\
    \nsqlite>\n```\n\n我们可以使用 `\".sechma\"` 查看表的描述。\n\n```bash\n./sqlite3 mytable.db\n\
    SQLite 版本 3.6.10\n输入 \".help\" 查看帮助\n输入以 \";\" 结束的 SQL 语句\nsqlite> .schema\nCREATE\
    \ TABLE foo (id INTEGER PRIMARY KEY, fname VARCHAR(50), lname VARCHAR(50));\n\
    sqlite>\n```\n\n我们可以按照如下方式导出数据：\n\n```bash\nsqlite> .mode csv\nsqlite> .output\
    \ data.csv\nsqlite> select * from foo;\nsqlite> .quit\n```\n\n```bash\n/home/knoppix:$\
    \ cat data.csv\n1,john,doe\n```\n\n为了进一步强调 SQLite 的强大，你可以在命令行执行查询。\n\n```bash\n\
    ./sqlite3 mytable.db \"select * from foo;\"\n```\n\n结果：\n```\n1|john|doe\n```\n\
    \n此功能使得 SQLite 非常健壮。你可以在 bash 或 AWK 中快速编写脚本。你还可以导入 'OS' 或 'System' 以外部访问应用程序，并使用\
    \ Perl、Python、'C' 或 'C++' 等语言。提供了库，这样你不需要外部调用程序。\n\n# 11.2.2 Python SQLite\n\n\
    从 2.6 版本开始，SQLite 库已包含在 Python 核心包中。让我们创建一个与上面教程类似的名为 `user.db` 的新表。\n\n### create.py\n\
    ```python\n# 创建 user.db\nimport sqlite3\n\ncon = sqlite3.connect('user.db')\n\
    cur = con.cursor()\ncur.execute('CREATE TABLE userinfo (id INTEGER PRIMARY KEY,\
    \ fname VARCHAR(20), lname VARCHAR(30))')\ncon.commit() # 注释掉\ncur.execute('INSERT\
    \ INTO userinfo (id, fname, lname) VALUES(NULL, \"john\", \"doe\")')\ncon.commit()\n\
    cur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\n```\n\n列出记录：\n\n\
    ### record.py\n```python\n# 列出表中的信息\nimport sqlite3\n\ncon=sqlite3.connect('user.db')\n\
    cur=con.cursor()\ncur.execute('SELECT * FROM userinfo')\nprint cur.fetchall()\n\
    ```\n\n添加新记录：\n\n### record1.py\n```python\n# 列出表中的信息\nimport sqlite3\n\ncon=sqlite3.connect('user.db')\n\
    cur=con.cursor()\ncur.execute('insert into userinfo(id,fname,lname) VALUES(NULL,\
    \ \"george\", \"peterson\")')\ncon.commit()\ncur.execute('SELECT * FROM userinfo')\n\
    print cur.fetchall()\n```\n\n更新记录：\n\n### update.py\n```python\n# 列出表中的信息\nimport\
    \ sqlite3\n\ncon=sqlite3.connect('user.db')\ncur=con.cursor()\ncur.execute(\"\
    update userinfo set lname='bob' where fname='george'\")\ncon.commit()\ncur.execute('SELECT\
    \ * FROM userinfo')\nprint cur.fetchall()\ncur.close()\ncon.close()\n```\n注意最后一行关闭了游标和连接。\n\
    \n# 11.2.3 练习\n\n1. 使用 sockets 创建一个简单的聊天服务器。\n2. 创建一个家庭地址录，包含姓名、电话号码、地址等……\n\n\
    # 12 CGI, WSGI 框架开发\n\n## 12.1 CGI\n\nCGI 是引入应用程序的一种快速粗暴的方法。大多数语言都使用它。下面是一个 bash\
    \ 脚本示例：\n\n```bash\n#!/bin/bash\necho \"Content-type: text/html\"\necho \"<html>\"\
    \necho \"Hello world\"\necho \"</html>\"\n```\n\n这是一个 python 脚本：\n```python\n\
    #!/usr/bin/python\n# firstweb.py\nprint \"Content-type: text/html\\n\"\nprint\
    \ \"Hello world\"\n```\n\n注意我也将所有内容放在了引号内：\n```python\n#!/usr/bin/python\n# secweb.py\n\
    print 'Content-type: text/html\\n'\nvar=\"Hello world\"\nprint \"\"\"\n<html><head><title>Second\
    \ Web Page</title></head><body><h1>Messasge to you: %s</h1></body></html>\n\"\"\
    \" % var\n```\n\n这是一个简单表单的示例：\n```python\n# form.py\nprint \"Content-type:text/html\\\
    n\"\nprint \"\"\"\n<html>\n<form action=\"pform.py\" method=\"get\">\nFirst Name:\
    \ <input type=\"text\" name=\"fname\"> <br>\nLast Name: <input type=\"text\" name=\"\
    lname\">\n<input type=\"submit\" value=\"Submit\">\n</form>\n</html>\n\"\"\"\n\
    ```\n\n为了实际工作，你需要另一个文件来获取表单中存储的值：\n```python\n# pform.py\nimport cgi,cgitb\nform=cgi.FieldStorage()\n\
    # 从字段获取数据\nfirstname=form.getvalue('fname')\nlastname=form.getvalue('lname')\n\
    \nprint \"Content-type:text/html\\n\"\nprint \"\"\"\n<html>\n<h1>Entries from\
    \ form</h1>\n<p>First name is: %s\n<p>Last name is: %s\n<hr>\n</html>\n\"\"\"\
    \ % (firstname,lastname)\n```\n注意导入的 `cgi`、`cgitb` 和 `FieldStorage()` 函数。\n\n"
- fmt: "\n`cgitb` - More comprehensive traceback formatting for Python scripts.\n\n\
    ## FILE\n`/usr/lib/python2.6/cgitb.py`\n\n## MODULE DOCS\nhttp://docs.python.org/library/cgitb\n\
    \n## DESCRIPTION\nTo enable this module, do:\n\n```python\nimport cgitb; cgitb.enable()\n\
    ```\n\nat the top of your script. The optional arguments to `enable()` are:\n\n\
    - `display` - if true, tracebacks are displayed in the web browser\n- `logdir`\
    \ - if set, tracebacks are written to files in this directory\n- `context` - number\
    \ of lines of source code to show for each stack frame\n- `format` - `'text'`\
    \ or `'html'` controls the output format\n\nBy default, tracebacks are displayed\
    \ but not saved, the context is 5 lines and the output format is `'html'` (for\
    \ backwards compatibility with the original use of this module). \n\nAlternatively,\
    \ if you have caught an exception and want `cgitb` to display it for you, call\
    \ `cgitb.handler()`. The optional argument to `handler()` is a 3-item tuple `(etype,\
    \ evalue, etb)` just like the value of `sys.exc_info()`. The default handler displays\
    \ output as HTML.\n\n## CLASSES\n### `Hook`\n```python\nclass Hook:\n    ...\n\
    ```\n\nVery simply, we pull values from the form and assign them to a variable.\
    \ Here is an example of retrieving a user name and password.\n\n`form2.py`\n```python\n\
    print \"Content-type:text/html\\n\\n\"\nprint \"\"\"\n<html>\n<form action=\"\
    pform2.py\" method=\"get\">\nUsername: <input type=\"text\" name=\"username\"\
    > <br>\nPassword: <input type=\"text\" name=\"password\">\n<input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n\"\"\"\n```\n\nIt might be best to change `password\
    \ type=\"hidden\"`. Make this change and process the form again.\n\n`pform2.py`\n\
    ```python\nimport cgi,cgitb\n\n#form=cgi.FieldStorage()\n#get data from fields\n\
    \nmypass=\"jppass\"\n\ndef webpage(username,password):\nprint \"\"\"\n<html>\n\
    <h1>Entries from form</h1>\n<p>First name is: %s\n<p>Last name is: %s\n<hr>\n\
    </html>\n\"\"\" % (username,password)\n\ndef login():\nprint \"Content-type:text/html\\\
    n\\n\"\nform=cgi.FieldStorage()\nif form.has_key(\"username\") and form.has_key(\"\
    password\"):\ntoken=form[\"password\"].value\nif (token==mypass):\nwebpage(form[\"\
    username\"].value,form[\"password\"].value)\nelse:\nprint \"<h1>Wrong username\
    \ or password!!!</h1>\"\nlogin()\n```\n\nYou will notice new methods inherited\
    \ from `'UserDict'` method `form.has_key(self,key)`. I assigned it to variable\
    \ `token`. If the value of `\"mypass == token\"` then the `webpage()` method will\
    \ be processed with an `'else'` statement `\"Wrong username or password!!!\"`.\
    \ \n\nThings to note: Cookies and sessions are not included in this chapter. I'm\
    \ not partial to writing cookies to deal with the session management of web pages.\
    \ I find that when I get to that point in writing code, I might as well migrate\
    \ to a web framework like `Django`, which is included in this book. You have the\
    \ option to apply minimal cryptographic data encoding such as `base64`.\n\nExample:\n\
    `decode=base64.b64decode('encoded_string')`\n\nTo encrypt:\n`crypt.py`\n```python\n\
    import base64\nprint base64.b64encode(\"mypassword\")\n```\n\nTo decrypt:\n`decrypt.py`\n\
    ```python\nimport base64\nprint base64.b64decode('bXlwYXNzd29yZA==')\n```\n\n\
    If I wanted to use this in an enterprise environment, I might configure using\
    \ `crypt` library for stronger security. I would store my cipher passwords in\
    \ an `SQLite` database and my sessions would be controlled by the python `random`\
    \ library coupled with `'username'` and authenticated once. I would then carry\
    \ the arguments for `'username'` and bind a session to each page. I thought about\
    \ using part of the password as a session coupled with `random()` to add increased\
    \ security for the weakness of the `random()` library. If you have arrived at\
    \ that point in development, perhaps you should choose a web framework that manages\
    \ authentication solution such as `Django`.\n\n## 12.2 WSGI\nAccording to Python\
    \ Enhancement Program (PEP) 333. A Web Server Gateway Interface (WSGI) works by\
    \ using callbacks. The application utilizes a function to call a request: `application(environ,\
    \ start_response)`\n\n1. `environ` - This is a Python dictionary with CGI defined\
    \ environment variables including `\"wsgi.input\"` for POST variables.\n2. `start_resonse`\
    \ - a callback to return HTTP headers.\n3. `start_response(status, response_headers,\
    \ exc_info=None)`\n    1. `status` - This is an HTTP status string\n    2. `response_headers`\
    \ - contains 2 tuples , headers and key values.\n    3. `exc_info` - exception\
    \ handling\n\nFor example:\n`first.py`\n```python\nfrom cgi import *\ndef hello(environ,\
    \ start_response):\nstart_response('200 OK', [('Content-Type', 'text/html')])\n\
    return [“<p>Hello World, and good day!!!</p>”]\nif __name__ ===\"__main__\":\n\
    from wsgiref.simple_server import make_server\nsrv = make_server('localhost',\
    \ 8080, hello)\nsrv.serve_forever()\n```\n\nYes it seems strange at first but\
    \ it's designed to meet a wide range of potential frameworks and servers. The\
    \ `start_response` writes the data to the... (Wait, the text repeats logic).\n\
    \n## 12.2.1 Creating a Web framework\nFor a more practical method, let's create\
    \ another framework with a variable.\n\n`hello.py`\n```python\nfrom cgi import\
    \ *\ndef hello(environ, start_response):\nstart_response('200 OK', [('Content-Type',\
    \ 'text/html')])\nreturn [“<p>Hello %(aname)s!</p>” % {'aname':aname}]\n```\n\n\
    We can now visit the site at the following address: `http://127.0.0.1:8080/?aname=William`\n"
