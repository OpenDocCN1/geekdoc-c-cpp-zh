    You have learned quite a bit in the last few chapters about python and the web.
    This chapter focuses on building a comprehensive web site rapidly without the
    crux and nuisance of repeating repetitive programming tasks that often accompany
    the creation and maintenance of a web site. To achieve this goal a Web Framework
    is needed. Plenty of web frameworks exist for python. They are often referred
    to as Content Management Frameworks ( CMF), or interpreted as Content Management
    Systems (CMS).


    Django uses a Model-View-Controller ( MVC), which is a method for developing software
    by defining and accessing data via a model, but separate from request and routing
    logic. This model is also separate from the user interface or (view).


    MVC allows the components to be loosely coupled. A developer can change the URL
    for a given part of the application without effecting the underlying implementation.
    A designer can change a page''s HTML without


    having to touch the Python code that renders it. And a database ''admin'' can
    rename a database table and specify the change in a single place rather than having
    to run search and replace for dozens of files.


    13.1.1 Setting up django


    Using a Debian based flavor of Linux like Ubuntu, you can get the packages by
    using apt package manager. Type the following command: apt-get install python-django.
    If you are running a Mac OS type: pip install Django


    You will need to be root to run for the command above to work.


    All site development should be done outside of Apache. Integration of Apache will
    come at the end of the tutorial.


    13.1.2 start project


    To create a directory name that will contain the project data, first type in the
    following command:


    django-admin.py startproject fooblah


    The directory fooblah will contain 4 files.


    1.  __init__.py: place holder for python modules


    2.  manage.py: to fire up services


    3.  settings.py: implied


    4.  urls.py: path, search using regular expressions


    Then run the following in the “fooblah” directory:


    python manage.py runserver


    This will start Django framework on port 8000\. By default you can visit: http://127.0.0.1:8000/


    Changing ports or IP ''s can be accomplished as follows: Before you run the command,
    you do need to know the IP address for your computer. Your IP address will be
    different than the one you see below.


    python manage.py runserver 8080


    python manage.py runserver 192.168.1.1:8000


    13.1.3 Create a view


    The next step is to create a view. Typically the name would be ''views.py'', but
    it can be any name. The content of the file is what is important. In the ''fooblah''
    directory. Type the following command: python manage.py startapp blah'
