    同样需要记住，你脑海中最初的游戏构思会不断演变。无论你有多聪明，或者图形技巧有多高，都要预感到你超过 80% 的想法会发生变化，有时甚至是剧烈的变化。这种经典的
    80/20 经验法则源于与许多非常有经验的游戏开发者的交流。


    ### 16.1.1 从何开始？


    市上有大量为初学者编写的代码。如果你必须从零开始，将会遇到很多问题。专家们会反复复用相同的方法；例如诸如 `import`、`initialize`、`screen`、`construct
    images`、`load`、`main loop` 等方法。通常，贸易机密隐藏在图形加速和算法之中。


    ### 16.1.2 首先！


    避免在别人的游戏引擎中进行设计是明智的。该引擎是专门为他们的游戏开发环境以及他们的想法或视角构建的。在使用他们的游戏引擎时，你将受到他们想法的限制。对于游戏开发的新手来说，这可能会感到沮丧。他们还可能决定将他们全配置的引擎作为商业产品出售。你也可以这样做！变得非常精通代码复用非常重要。你应该玩玩游戏引擎吗？绝对应该。事实上，探索并发现这些局限性是强制性的。玩游戏引擎的行为会给你带来很多想法。`Blender`
    就是一个 3D 图形建模工具，它可以被修改为 3D 游戏引擎环境。使用现有的游戏引擎原型新游戏想法会有帮助。


    ### 16.1.3 图形


    一些最出色且最令人着迷的游戏图形很平庸，但它们有高质量的游戏性。随着你想法的推进，图形以后可以不断改进。


    ### 16.1.4 游戏程序员的最低要求


    1. **编程简介**：我们已经涵盖了其中一些主题。但更重要的是你需要理解如何解决问题。

    2. **编程语言**：学习 `C` 和 `C++` 是通往精通游戏编程的良好跳板。你在 `python` 中开发的内容很容易转换为 `C/C++`。从剥离库开始。然而，如果你利用了诸如
    `SDL` 和 `OpenGL` 等流行的图形库，变化将非常少且微妙。你将花费更多时间处理解析器和分析器。

    3. **数据结构与算法**：这是到目前为止在任何层次编写任何程序最重要的主题。测试并精通 `arrays`（数组）、`linked lists`（链表）、`binary
    trees`（二叉树）、`general trees`（树）、`hash tables`（哈希表）和 `heaps`（堆）将你在任何地方找到工作。大多数人学会后就忘了，然后很难被聘为开发者，很多人转行。

    4. **编译器**：面对现实吧，如果你需要它更快，你需要理解分词（tokenizing）、`parsing`（解析）、`code generation`（代码生成）和垃圾回收（garbage
    collection）等概念。

    5. **操作系统**：你需要了解 `OS` 的局限性。`threading`（线程）、`locking`（锁）、`network communication`（网络通信）和
    `device drivers`（设备驱动）的知识对于多人游戏或读取 `DVD-ROM` 位以及从 3D 卡显示图形是无价的。

    6. **人工智能**：`Heuristics`（启发式）、`planning`（规划）、`algorithms`（算法）、`bayesian networks`（贝叶斯网络）和
    `natural language parsing`（自然语言解析）为你的游戏环境增加了现实概念。

    7. **数据库**：你必须将这些数据存在某个地方。


    ### 16.1.5 游戏理论


    如何制作别人想玩的东西？这可能是一项艰的任务。游戏公司和营销分析师研究最新趋势来收集这些信息。主题、地图设计、关卡特征、声音、故事和游戏难度之间存在微妙的平衡。最终，你希望你的游戏看起来好看而且好玩。这意味着在从概念到部署的过程中，必须采取平衡的方法。


    ### 16.1.6 原型


    在现实中，在你真正开始编写代码之前，你的梦想和想法不会实现。你会开始构建第一个原型，然后是直到你有几个原型版本。从原型中可以学习到很多，例如通用概念和玩法。你还会发现更多现实情况，如菜单、`screen
    transitions`（屏幕切换）以及如何保存或加载游戏。这里有几考虑：


    1. 你需要一个故事者吗？

    2. 你需要一个算法专家吗？

    3. 你需要一个艺术家吗？`Raster`（位图）、`Vector`（矢量）或两者都要。

    4. 你需要一个音乐家或音效师吗？


    原型也可以快速告诉你这个游戏是否值得。


