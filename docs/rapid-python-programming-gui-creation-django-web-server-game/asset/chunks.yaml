    ## 6.1 Object Oriented Programming


    ### 0.1.1 Intro


    So far you have been creating programs in a procedural way using functions and
    blocks of statements. With a slight twist you can wrap your functions into an
    object, and advance to understanding the concept of the object oriented paradigm.
    Without realizing it, you have already been using certain aspects of object oriented
    programming but in a procedural way.


    ### 6.1.2 Objects


    By now, you are familiar with features such as strings, integers, dictionaries,
    and functions. These are all objects. The string object has methods which provide
    additional ways to manipulate the string. Using the dot syntax you can access
    the objects attributes such as `string.lower()`. So from the beginning we have
    been accessing the methods of each of our objects. You can also create new instance
    of the object known as instantiation. In essence they are `datatypes` and can
    be tested with a built in function `type`.


    ```

    >>> dat=''a string''

    >>> type(''dat'')

    <type ''str''>

    ```


    The dot syntax would apply easily. Checking your `type`, you find it to be a class
    string object or `str(object)`. Here is an example of a class object easily tested
    using `type`. Don''t forget you will still need to indent your text after the
    class statement. Reminder: There are no spaces between the underscore symbols.
    Finally as always, pay ATTENTION to indentation!


    ```

    >>> class orphan():

    ... def __init__(self):

    ... self.arg1=arg1


    >>> type(orphan)

    <type ''classobj''>

    ```


    Objects store data by using variables that belong to the object. The variables
    belong to the object or class as fields. Functions work the same, they are called
    methods of a class. So basically fields and methods are attributes of a class.

