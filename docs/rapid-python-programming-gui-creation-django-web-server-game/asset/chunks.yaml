    a component to ''namef'' and ''namel''. The file write is not evident in the application
    like it is when done behind the scenes. We have two other components for the text
    field. The last two components become visible after the ''bsubmit'' button is
    clicked. When you build the method, the widget name gets changed to ''on_bsubmit_mouseClick''.
