    \ my base.html</h1></center>\n<p>I can enter all of strange stuff here</p>\n{%\
    \ block content %}\n{% endblock %}\n</body>\n</html>\n```\n\n在以下内容中，任何与 Python\
    \ 相关的信息都可以在 `date2.html` 中找到：\n\n```html{% extends \"base.html\" %}\n{% block\
    \ content %}\nit is now {{ date }}\n{% endblock %}\n```\n\n现在为 `date2.html` 创建一个视图。\n\
    \n### view.py\n```python\ndef d2(request):\n    calc=datetime.datetime.now()\n\
