  trans: "\n正如你已经发现的，EasyGUI 对于快速项目非常有效。你在这里编写的几乎所有代码以及即将编写的一些代码，都可以轻松地修改为 EasyGUI\
    \ 界面。现在你已经理解了 EasyGUI 的基础，只需多花一点精力，就可以开始高效地使用 Tkinter 了。\n\n## 9.1.1 基础\n\n###\
    \ 基础列表\n\n`food.py`\n\n```python\nlist= ['milk', 'cheese', 'fruit', 'chicken']\n\
    print list\n```\n\n这里是我们的食物列表。为了将其写入“Tk GUI”中，我们导入该库并用以下行包裹代码：\n\n`fooda.py`\n\
    ```python\nfrom Tkinter import *\nroot=Tk()\nlist= ['milk', 'cheese', 'fruit',\
    \ 'chicken']\nprint list\nroot.mainloop()\n```\n\n图 0.1:\nfooda.py\n![](img/00010.jpeg)\n\
    \n要关闭程序，你需要使用鼠标点击你刚刚创建的窗口右上角的“x”按钮。\n\n如你所见，它并没有在窗口中准确显示项目，而且在执行 `root.mainloop()`\
    \ 之前它不会出现。我们需要准备要插入到“X”显示或或窗口显示的数据。\n\n`foodb.py`\n```python\nfrom Tkinter import\
    \ *\nroot=Tk()\nlistb=Listbox(root)\nlistb.pack()\nlist= ['milk', 'cheese', 'fruit',\
    \ 'chicken']\nprint list\nroot.mainloop()\n```\n\n图 0.2:\nfoodbb.py\n![](img/00011.jpeg)\n\
    \n当你运行这段代码时，你会注意到外观上的细微差别。根窗口内有一个“Listbox”。`listbox.pack()` 将“listbox”打包在根窗口内以便显示。我们现在需要做的是将列表循环到\
    \ `listb.pack()` 中。\n\n`foodc.py`\n```python\nfrom Tkinter import *\nroot=Tk()\n\
    listb=Listbox(root)\nlistb.pack()\nlist= ['milk', 'cheese', 'fruit', 'chicken']\n\
    for item in list:\n    listb.insert(END, item)\nprint list\nroot.mainloop()\n\
    ```\n\n图 0.3:\nfoodc.py\n![](img/00012.jpeg)\n\n## 9.1.2 使用函数简化\n\n你现在对 Tkinter\
    \ 以及如何使用列表填充“listbox”有了基础了解。你可以使用方法来更简单地做到这一点。例如：\n\n`simple.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\ndef mbutton(mess):\n    b=Button(root,text=mess)\n\
    \    b.pack()\nb.mainloop()\nmbutton(\"Press me\")\n```\n\n图 0.4:\nsimple.py\n\
    ![](img/00013.jpeg)\n\n这种方式精炼得多，我们可以通过添加新方法或扩展现有方法来进一步扩展。\n\n`simplea.py`\n```python\n\
    from Tkinter import *\nroot=Tk()\ndef mbutton(mess):\n    b=Button(root,text=mess)\n\
    \    b.pack()\ndef mlabel(lab):\n    l=Label(root, text=lab)\n    l.pack()\nmbutton(\"\
    Press me\")\nmlabel(\"My Python\")\nroot.mainloop()\n```\n\n图 0.5:\nsimplea.py\n\
    ![](img/00014.jpeg)\n\n注意，我们将 `mainloop` 提取了出来，这样两个方法都可以利用它。让我们用三个方法进一步扩展它。\n\n\
    `simpleb.py`\n```python\nfrom Tkinter import *\nroot=Tk()\ndef mbutton(mess):\n\
    \    b=Button(root,text=mess)\n    b.pack()\ndef mlabel(lab):\n    l=Label(root,\
    \ text=lab)\n    l.pack()\ndef tbox():\n    t=Text(root)\n    t.pack()\nmbutton(\"\
    Press me\")\nmlabel(\"My Python\")\ntbox()\nroot.mainloop()\n```\n\n图 0.6:\nsimpleb.py\n\
    ![](img/00015.jpeg)\n\n接下来，我们应该向“listbox”添加数据。\n\n`simplec.py`\n```python\nfrom\
    \ Tkinter import *\ndef mbutton(mess):\n    b=Button(root,text=mess)\n    b.pack()\n\
    def mlabel(lab):\n    l=Label(root, text=lab)\n    l.pack()\ndef tbox():\n   \
    \ t=Text(root)\n    t.pack()\ndef lbox(list):\n    lb=Listbox(root)\n    lb.pack()\n\
    \    for i in list:\n        lb.insert(END, i)\nroot=Tk()\nmbutton(\"Press me\"\
