    print ”must learn crane kick”


    teacher=Master()


    teacher.crane(1)


    Results:


    must learn crane kick


    6.1.9 Iterate Over Unknown Objects


    Time and again I have found myself working with large applications that are poorly
    documented. Below is a handy method to parse potentially unknown objects via subclass.
    Pretend ''class bar'' has a lot of methods (perhaps thousands of methods) and
    you want to generate a list for easy lookup. This is a great troubleshooting exercise
    to get a summary of methods contained within a class.


    Pay ATTENTION to indentation!


    #!/usr/bin/python


    #unknown.py


    class bar:


    def blah(self):


    print "cool"


    def strange(self):


    print "wow"


    def nice(self):


    print "very cool now"


    def bazinga(self):


    print “bazinga”


    class foo(bar):


    def __iter__(self): # iterate unknown


    return iter(vars(bar)) # vars built-in attr


    a=foo()


    for i in a:


    print i


    Results:


    __module__


    bazinga


    blah


    strange


    __doc__


    nice


    As you venture further into OOP. Subclassing a parent class to change an attribute
    will occur frequently and eventually you will want to track your own methods or
    an existing method this is a brief example on how to look at your work from a
    different perspective.


    6.1.10 Multiple Inheritence


    I''m not crazy about using multiple inheritance or super. Multiple inheritance
    should be avoid and replaced with design patterns and if you plan to use ''super()''
    it''s usage should be consistent. In class hierarchy, super should be used everywhere
    or nowhere. Mixing super and classic call is extremely confusing and doesn''t
    make things explicit. Instead focus on customizing classes and leverage methods
    such as ''__getattr__'', ''__setattr__'' and ''__getattribute__''.


    Please do not type the following code below, it is only an example: Use the IDLE
    interpreter and type help(super)


    >>>help(super)


    class super(object)


    | super(type, obj) -> bound super object; requires isinstance(obj, type)


    | super(type) -> unbound super object


    | super(type, type2) -> bound super object; requires issubclass(type2, type)


    | Typical use to call a cooperative superclass method:


    | class C(B):


    | def meth(self, arg):


    etc...


    6.1.11 Summary


    These are the basic terminologies of object-oriented programming and mastering
    these concepts will allow you to build and scale large applications.


    7 Cool Features of Python


    7.1 Cool Features of Python


    7.1.1 List Comprehension


    A list comprehension is a feature that allows you to create lists without resorting
    to using a built-in function or filter for every iterable item. The following
    is an example of populating a list using basic iteration and a filter or flow
    statement.


    #list.py


    output=[]


    for i in range(10):


    if i > 5:


    output.append(i)


    print output


    The following is an example using a comprehensive list:


    #list2.py


    output=[i for i in range(10) if i> 3]


    print output


    Removing the indentation and encapsulating your statements allows you to evaluate
    expressions within the list. Let''s take a look at a few more examples.


    #list3.py


    square=[i**2 for i in range(10)]


    factor=[2**i for i in range(10)]


    evenSquare=[x for x in square if x % 2 == 0]


    oddSquare=[x for x in square if x % 2 == 1]


    print square


    print factor


    print evenSquare


    print oddSquare


    Results:


    [0, 1, 4, 9, 16, 25, 36, 49, 64, 81]


    [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]


    [0, 4, 16, 36, 64]


    [1, 9, 25, 49, 81]


    7.1.2 Lambda


    Lambda is a special function or anonymous function created at runtime. To illustrate
    the differences, see below.


    This is a regular function:


    #nlam.py


    def blah(x): return x*x


    print blah(2)


    This is a lambda function


    #lam.py


    blah= lambda x: x*x


    print blah(2)'
