    \ tm_wday=4, tm_yday=365, tm_isdst=0)\n```\n\n1. 图形如果你将结果保存到文件，可以使用 `Matplotlib`\
    \ 来绘制图表。你需要将日内时间转换为日期格式。\n\n获取股票数据：\n\n# chart.py\n\n```python\nimport time\n\
    import datetime\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport matplotlib.ticker\
    \ as mticker\nimport matplotlib.dates as mdates\n\nmystock='AAPL'\n\ndef gData(stock):\n\
    \    stockFile=stock+\".txt\"\n    date,closep,highp,lowp,openp,volume= np.loadtxt(\n\
    \        stockFile,delimiter=',',unpack=True,\n        converters={0: mdates.strp2num('%Y%m%d')})\n\
    \    fig=plt.figure()\n    ax1=plt.subplot(1,1,1)\n    ax1.plot(date,openp)\n\
    \    ax1.plot(date,highp)\n    ax1.plot(date,lowp)\n    ax1.plot(date,closep)\n\
    \    ax1.xaxis.set_major_locator(mticker.MaxNLocator(10)) # 最大 10 天\n    ax1.xaxis.set_major_formatter(mdates.DateFormatter('%Y-%m-%d'))\n\
    \    for label in ax1.xaxis.get_ticklabels():\n        label.set_rotation(45)\n\
    \    plt.show()\n\ngData(mystock)\n```\n\n图 0.1: Matplot 图形\n![](img/00047.jpeg)\n\
    \n`Matplotlib` 是一个非常强大的工具，能够绘制 K 线图和其他各种图表。然而，如果你计划将其放在网页上，JavaScript 在实时图表方面可能更好。Morningstar.com\
    \ 和 Bloomberg 都提供了用于指标和分析的 API。\n\n# 18 结语\n\n## 18.1 结语\n\n正如标题所示，这是快速编程。你的最终目标是使用\
    \ Python 创建免费、出售或纯属趣味的程序或应用程序。编程允许你自动化重复性任务，让你能够专注于其他事情。\n\n大多数作者希望你读完书中的每一个字。虽然这对某些人有效，但我知道你可能不会这样做。很可能你到达这里之前跳过了很多内容。希望你至少写了几行代码。我的目标是让这本书足够灵活，能够吸引初学者和经验丰富的人士。它包含了丰富的可重用代码片段，这些代码在我的\
