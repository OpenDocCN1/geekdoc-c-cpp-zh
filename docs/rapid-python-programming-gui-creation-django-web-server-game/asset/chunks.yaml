    4.1.8 Python with Statement


    Using the ''with'' statement cuts down on exception handling for file stream by
    avoiding the need for ''try/finally'' blocks of code. According to python documentation,
    the ''with'' statement clarifies code previously by ''try...finally'' blocks to
    ensure clean-up code is executed. Syntax is as follows:


    with expression [as variable]: with-block


    The expression is evaluated, and it should result in an object that supports the
    context management protocol ''__enter__()'' and ''__exit__()'' methods.


    Let''s write data to a file:


    with open(''output.txt'', ''w'') as f:


    f.write(“Usual Hello World!”)


    The above ''with'' statement will automatically close the file after nested block
    of code.


    4.1.8.1 File Handling Modes


    Table 0.1:


    File Modes


    | Modes | Description |


    | r | Opens file for reading only |


    | rb | Opens file for reading binary only |


    | r+ | Opens file for both reading and writing |


    | rb+ | Opens binary file for reading and writing |


    | w | Opens file for writing only |


    | wb | Opens binary file for writing only |


    | a | Opens a file for appending |


    | ab | Opens a binary file for appending |


    | a+ | Opens a file for both appending and reading |


    | ab+ | Opens a file for both appending and reading in binary |


    4.1.8.2 File A ttributes


    Table 0.3:


    File Attributes


    | Attribute | Description |


    | file.closed | Returns true if closed |


    | file.mode | Returns access mode of opened file |


    | file.name | Returns the name of the file |


    | file.softspace | Returns false if space explicitly required with print, otherwise
    true. |


    Example below:


    #!/usr/bin/python


    #filetest.py


    f = open("dat.txt", "wb")


    print "Name the file: ", f.name


    print "Closed or open: ", f.closed


    print "mode: ", f.mode


    print "Softspace: ", f.softspace


    Also note you did not need ''dat.txt'' to run this script.


    Results:


    Name the file: dat.txt


    Closed or open: False


    mode: wb


    Softspace: 0


    4.1.9 Deep Binary Manipulation


    Python has a limitation when working with binary files. The smallest unit you
    can work with is a byte. This can prove challenging when working with a data stream.
    Working with binary is beyond scope in this book and requires a firm foundation
    in computer software


    But you can use bitwise operators to evaluate if a value is True or False. For
    example:


    >>> x=3


    >>> x&1!=0


    True


    >>> x&2!=0


    True


    >>> x&3!=0


    True


    >>> x&4!=0


    False


    4.1.9.1 bit string manipulation


    This example converts string to binary using base2


    >>>print int(''001101'',2)


    13


    >>>print int(''0000011001'',2)


    25


    >>>print “0x%x” % int(''0011001'',2)


    0x25


    Please note you didn''t need to use 8 bits. My example above has 7 bits. However
    it took 1001 for the first value of 9 in the 1''s place and the next 001 for 10''s
    place making 19\.


    Conversion to Character requires an 8 bit maximum string.


    >>> print chr(int(''1111001'',2))


    y


    >>> print chr(int(''1111011'',2))


    {


    Conversion of characters to integers.


    >>> print int(''1111011'',2)


    123


    >>> ord(''{'')


    123


    Another way to convert individual bits.


    >>> 1<<0


    1


    >>> 1<<1


    2


    >>> 1<<3


    8


    Conversion of Hex string to Integer


    >>> int(''0xff'',16)


    255


    python 3 supports binary literal by adding b''01011'' before the string to denote
    binary string.


    The following is an example of bin(),oct(),and hex() conversion


    >>> x=123


    >>> bin(x)


    ''0b1111011''


    Notice the literal ''b'' encoded in the string representation. Literal data types
    are available in python3.0 or by importing future library


    >>> oct(x)


    ''0173''


    >>> hex(x)


    ''0x7b''


    >>> format(x,''b'')


    ''1111011''


    >>> format(x,''o'')


    ''173''


    >>> format(x,''x'')


    ''7b''


    As you can see above ''int()'' object handles a lot. help(''int'')


    class int(object)


    | int(x=0) -> int or long


    | int(x, base=10) -> int or long


    |


    | Convert a number or string to an integer, or return 0 if no arguments


    | are given. If x is floating point, the conversion truncates towards zero.


    | If x is outside the integer range, the function returns a long instead.


    |


    | If x is not a number or if base is given, then x must be a string or


    | Unicode object representing an integer literal in the given base. The


    | literal can be preceded by ''+'' or ''-'' and be surrounded by whitespace.


    | The base defaults to 10\. Valid bases are 0 and 2-36\. Base 0 means to


    | interpret the base from the string as an integer literal.


    | >>> int(''0b100'', base=0)


    | 4


    4.1.10 Binary Struct


    The structure of ''struct'' to pack and unpack. pack() and unpack() require a
    string to define how binary data is structured.


    #mystruct.py


    import struct


    # i represents integer


    # c represents character


    bdata=struct.pack("icc", 42,b''A'', b''Z'')


    print(bdata)


    # unpack yields a tuple of data


    tdata=struct.unpack("icc",bdata)


    print(tdata)


    Results:


    *AZ


    (42, ''A'', ''Z'')


    The struct module performs conversions between Python values and ''C'' struct''s
    represented as a Python string. Pack and Unpack require character formats to determine
    structure:


    | Format | Type |


    | x | no values |


    | c | char |


    | b | signed int |


    | B | unsigned int |


    | ? | bool |


    | h | int short |


    | H | unsigned short |


    | i | int |


    | I | unsigned int |


    | l | long |


    | L | unsigned long |


    | q | long long |


    | Q | unsigned long long |


    | f | float |


    | d | double |


    | s | char[] |


    | p | char[] |


    | P | void * |


    Below is an example of reading parsing a jpeg file and extracting size


    #readjpg.py


    import sys


    import binascii


    import struct


    signature=[


    binascii.unhexlify(b''FFD8FFD8''),


    binascii.unhexlify(b''FFD8FFE0''),


    binascii.unhexlify(b''FFD8FFE1'') ]


    with open(sys.argv[1],''rb'') as file:


    first_four_bytes=file.read(4)


    if first_four_bytes in signature:


    print("JPEG found.")


    else: print("This is not a JPEG file.")


    print first_four_bytes


    print binascii.hexlify(first_four_bytes)


    second=file.read(1)


    while (ord(second) !=0xDA):


    while (ord(second) !=0xFF): second=file.read(1)


    while (ord(second) ==0xFF): second=file.read(1)


    if (ord(second) >=0xC0 and ord(second) <=0xC3):


    print binascii.hexlify(file.read(3))


    print struct.unpack(''>HH'',file.read(4))


    4.1.11 Summary


    At this point, you have the ability to program just about anything using a structured
    top down method. Python works best as a higher level programming language and
    is not a practical language to work at a low level with large binary data. The
    binary example in this section will only be used as a reference and will not be
    discussed or used later in this book due to the complexity.


