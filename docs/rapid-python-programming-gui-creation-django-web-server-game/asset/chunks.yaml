    # list information in table


    import sqlite3


    con=sqlite3.connect(''user.db'')


    cur=con.cursor()


    cur.execute(''insert into userinfo(id,fname,lname) VALUES(NULL, "george", "peterson")'')


    con.commit()


    cur.execute(''SELECT * FROM userinfo'')


    print cur.fetchall()


    To update a record:


