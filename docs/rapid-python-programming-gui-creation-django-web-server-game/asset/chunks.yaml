    of the code for marketing purposes.


    15.1.6 Exercises


    1.  Optimize the existing code.


    16 Game Programming


    16.1 Game Programming


    Have you ever wondered how hard it would be to create a computer game? Now that
    you have some practice writing python, you might wonder if python is good enough
    for building games. The answer would be an excited “Oh Yes”. Though you will need
    to do patiently plan, design and then write the actual code your game, testing
    as you code. The bottom line is that it can be done. You probably want to start
    with a formal GDD (game design document), which is a full description of the game
    in detail and often exceeds 30 pages. It''s very similar to a book proposal but
    with more technical detail.


    Everyone should write a game engine at least once to fully appreciate the insanity
    that''s involved with commercial engines such as Unreal, Unity, Blender and more.
    When it comes to programming nearly anything, it is ideal to write code that''s
    reusable. Methods that draw images or play sounds can be reused on every game
    project you decide to create. Before designing a game engine you must take into
    consideration essential requirements and basic limitations. Everything should
    be mapped out in a tool such as UML on what the engine specifically targets. For
    instance a 2D engine will lack 3D drawing capabilities while 3D can draw amazing
    graphics but have slower 2D drawing procedures. The engine should be simple but
    effective and have a modular design. The modules should be broken down into 4
    main sections: graphics, audio, input and message passing.'
