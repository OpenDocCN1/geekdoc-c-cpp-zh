    `SetOutputWindowAttributes(self, title=None, pos=None, size=None)`\n\nRefactoring\
    \ code:\n\n#thirdwx.py\n```python\nimport wx\n\nclass Blah(wx.Frame):\n\n    def\
    \ __init__(self,x,y,z):\n```\n"
