    Now that you''ve seen EasyGui, you can weigh the limitations against the amount
    of code you would have to write to accomplish those tasks to achieve total creative
    control. For now, play and edit ''easygui.py'' to change some of those fonts and
    features until you run into limitations. To demonstrate the lesson in a practice,
    import ''apartment.py'' from the last chapter into our new program ''apt.py''.
    First let''s review ''apartment3.py'':


    #apartment3.py


    # required information:10 units with 2 bedrooms, 8 covered parking


    #1 pool, x rooms, 15 people


    class complex:


    def __init__(self, unit, parking, pool, rooms, people):


    self.unit=unit


    self.parking=parking


    self.pool=pool


    self.rooms=rooms


    self.people=people


    def calc(self):


    self.capacity=float(self.people)/self.rooms


    self.uncovered=100-(float(self.parking)/self.people*100)


    self.rooms=10*2


    self.freerooms=self.rooms-self.people


    def result(self):


    print "The complex is at %g capacity" % self.capacity


    print "There are %g percent people with uncovered parking" % self.uncovered


    print "We have %g rooms" % self.rooms


    print "We have %g free rooms left" % self.freerooms


    if __name__=="__main__":


    myCo=complex(10,8,1,20,15)


    myCo.calc() # these are tied together initialize


    myCo.result() # these are tied together


    We need to add the if statement to run this program externally. To do this, you
    should first look to see that information being passed into the ''textbox'' function
    is in the form of a list. Now, we need to change those print statements.


    #apartment4.py


    # required information:10 units with 2 bedrooms, 8 covered parking


    #1 pool, x rooms, 15 people


    class complex:


    def __init__(self, unit, parking, pool, rooms, people):


    self.unit=unit


    self.parking=parking


    self.pool=pool


    self.rooms=rooms


    self.people=people


    def calc(self):


    self.capacity=float(self.people)/self.rooms


    self.uncovered=100-(float(self.parking)/self.people*100)


    self.rooms=10*2


    self.freerooms=self.rooms-self.people


    def result(self):


    a="The complex is at %g capacity" % self.capacity


    b="There are %g percent people with uncovered parking" % self.uncovered


    c="We have %g rooms" % self.rooms


    d="We have %g free rooms left" % self.freerooms


    data=[a,b,c,d]


    return data


    if __name__=="__main__":


    myCo=complex(10,8,1,20,15)


    myCo.calc()


    for i in myCo.result():


    print i


    We have the ability to integrate our program into our ''apt.py'' EasyGUI program.
    For a clean presentation, let''s add \n (newline) to each object in lists so that
    our data will be on separate lines.


    #use and import apartment4.py


    #apt.py


    from apartment4 import *


    from easygui import *


    myCo=complex(10,8,1,20,15)


    myCo.calc()


    data=[]


    for i in myCo.result():


    data.append(i+”\n”)


    textbox("apt data", "Apartment Complex", data)


