    \n`ent1.py`\n"
- fmt: "\n```python\nfrom Tkinter import *\n\nroot=Tk()\n\nroot.geometry('200x210+350+70')\n\
    \nent=Entry(root, bg='white')\n\n#ent.pack()\n\nent.pack(anchor=W)\n\nbutton=Button(root,\
    \ text='press me', command='')\n\n#button.pack()\n\nbutton.pack(pady=20, anchor=E)\n\
    \nlistb=Listbox(root,bg='blue')\n\nlistb.pack()\n\nroot.mainloop()\n```\n\nFigure\
    \ 0.20:\n\nent1.py\n\n![](images/00029.jpeg)\n\nAs you can see we can move our\
    \ widgets and pad them using an x and y coordinate.\n\n#ent2.py\n\n```python\n\
    from Tkinter import *\n\ndef myinsert(): #3\n\nname = ent.get()\n\nprint name\n\
    \nlistb.insert(END,name)\n\nent.delete(0,END)\n\nroot=Tk()\n\nroot.geometry('200x210+350+70')\n\
    \nent=Entry(root, bg='white')\n\nent.pack(anchor=W)\n\nbutton=Button(root, text='press\
    \ me', command=myinsert)\n\nbutton.pack(pady=20, anchor=E)\n\nlistb=Listbox(root,bg='blue')\n\
    \nlistb.pack()\n\nroot.mainloop()\n```\n\nFigure 0.21:\n\nent2.py\n\n![](images/00030.jpeg)\n\
    \n## 9.1.5 Practical Example\n\nThis next example uses the `Tkinter` grid geometry\
    \ manager. `Grid` makes everything easier than using `pack`. Consider the following\
    \ example:\n\n| label 1 | Entry 1 | Image |\n| label 2 | Entry 2 |  |\n| Button\
    \ 1 | Button 2 |  |\n| Button 1 | Button 2 | |\n\nThis type of configuration can\
    \ be done easier with `grid` rather than `pack`. In the next example we will create\
    \ a stock market calculator that I use every day.\n\n### 9.1.5.1 Stock market\
    \ Calculator prototype\n\nThe script will calculate potential profit based on\
    \ the following: Quantity of shares purchased. Entry into market or cost to purchase\
    \ shares and Exit or shares sold at specific price.\n\n#stockproto.py\n\n```python\n\
    shares=raw_input(“Enter quantity of shares: “)\n\nentry=raw_input(“Enter price\
    \ per share: “)\n\nexit=raw_input(“Enter future exit price per share: “)\n\nprint\
    \ “Cost to get in: $%f” % ( int(shares) * float(entry))\n\nprint “Exit: $%f” %\
    \ ( int(shares) * float(exit))\n\nprofit = ( ( int(shares) * float(exit) ) - (int(shares)\
    \ * float(entry)) )\n\nprint “Profit: $%f” % profit\n```\n\nResults:\n\nEnter\
    \ quantity of shares: 1000\nEnter price per share: .020\nEnter future exit price\
    \ per share: .030\nCost to get in: $20.000000\nExit: $30.000000\nProfit: $10.000000\n\
    \nNow that we have our prototype complete. We will create an interface for the\
    \ calculator.\n\n#stockproto.py\n\n```python\nfrom Tkinter import *\n\ndef myinsert():\n\
    \nshares=e1.get()\n\nentry=e2.get()\n\nexit=e3.get()\n\ncost=\"Cost to get in:\
    \ $%.2f\" % ( int(shares) * float(entry))\n\nexitresult=\"Exit: $%.2f\" % ( int(shares)\
    \ * float(exit))\n\nprofit=( (int(shares) * float(exit) ) - (int(shares) * float(entry))\
    \ )\n\nprofitresult=\"Profit: $%.2f\" % profit\n\nfor item in [cost,exitresult,profitresult]:\n\
    \nlistb.insert(END,item)\n\ndef myclear():\n\nlistb.delete(0,END)\n\nroot=Tk()\n\
    \nlabel=Label(root, text=\"Quantity Shares\").grid(row=0)\n\nlabel2=Label(root,text=\"\
    Entry Price\").grid(row=1)\n\nlabel3=Label(root,text=\"Exit Price\").grid(row=2)\n\
    \ne1=Entry(root,bg='white')\n\ne2=Entry(root,bg='white')\n\ne3=Entry(root,bg='white')\n\
    \ne1.grid(row=0,column=1)\n\ne2.grid(row=1,column=1)\n\ne3.grid(row=2,column=1)\n\
    \nbutton=Button(root, text='calculate', command=myinsert)\n\nbutton.grid(row=3,column=1)\n\
    \nclearb=Button(root, text=\"clear\",command=myclear)\n\nclearb.grid(row=3,column=0)\n\
    \nlistb=Listbox(root,bg='light blue')\n\nlistb.grid(row=4,column=1, padx=20,pady=20)\n\
    \nroot.mainloop()\n```\n\n![](images/00031.jpeg)\n\nWhen you are ready to create\
    \ other projects please keep in mind that it's easier to work with the code between\
    \ `root=Tk` and `mainloop` as displayed below before adding other calculations.\n\
    \n```python\nroot=Tk()\n...\n...\nroot=mainloop()\n```\n\nThe `button` command\
    \ points to the two methods to either `get()` and perform the calculations from\
    \ the prototype and populate the listbox or clear contents in the list box.\n\n\
    ## 9.1.6 Exercises\n\nSame as previous chapter except use `Grid` instead of `pack`.\n\
    \n## 10 WxWidgets\n\n### 10.1 Wxwidgets\n\n`WxWidgets` is a widely supported and\
    \ portable GUI API. It has some similarities to `Tkinter` but is far more comprehensive\
    \ and rich. `WxWidgets` relies heavily on `OOP`. Download at `http://python.org`\
    \ and follow the instructions. Please not download `wx3.0`. Search for `wx2.8`.\
    \ This chapter supports an older version of `WxWidgets` to be compatible with\
    \ `Python` in the next section. Here is a quick list of the widget objects to\
    \ get started:\n\n**Base Widgets**\n- `wx.Window`\n- `wx.Control`\n- `wx.ControlWithItem`\n\
    \n**Top Level Widgets**\n- `wx.Frame`\n- `wx.MDIParentFrame`\n- `wx.MChildFrame`\n\
    - `wx.Dialog`\n- `wx.PopupWindow`\n\n**Containers** - contain other widgets as\
    \ children\n- `wx.Panel`\n- `wx.Notebook`\n- `wx.ScrolledWindow`\n- `wx.SplitterWindow`\n\
    \n**Dynamic Widgets** - are widgets edited by users.\n- `wx.Button`\n- `wx.BitmapButton`\n\
    - `wx.Choice`\n- `wx.ComboBox`\n- `wx.Grid`\n- `wx.ListBox`\n- `wx.RadioButton`\n\
    - `wx.SpinButton`\n- `wx.SpinCtrl`\n- `wx.Slider`\n- `wx.TextCtrl`\n- `wx.ToggleButton`\n\
    \n**Static Widgets** - display information not edited by user.\n- `wx.Gauge`\n\
    - `wx.StaticText`\n- `wx.StaticLine`\n- `wx.StaticBox`\n\nThen you have widgets\
    \ for Menu, status and tool bar. These are the primary widget objects you will\
    \ use in your application.\n- `wx.MenuBar`\n- `wx.ToolBar`\n- `wx.StatusBar`\n\
    \nThe first step is to import `wx`.\n\n```python\n>>> import wx\n>>> help('wx')\n\
    ```\n\nHelp on package `wx`:\n\n### Lets create a window\n\n#firstwx.py\n```python\n\
    import wx\napp=wx.App()\nframe=wx.Frame(None, -1, 'first')\nframe.Show()\napp.MainLoop()\n\
    ```\n\nHere is a structured way to create our first `wx` application. Let's migrate\
    \ this to a class.\n\n#secondwx.py\n```python\nimport wx\nclass Blah(wx.App):\n\
    \    def OnInit(self):\n        frame=wx.Frame(None, -1, \"I love python\")\n\
    \        frame.Show(True)\n        self.SetTopWindow(frame)\n        return 1\n\
    app=Blah()\napp.MainLoop()\n```\n\nThe `wx.Frame` is our constructor container\
    \ with three arguments, `None` for parent window, `-1` for window and a title\
    \ \"I love python\". Next we need our frame to be shown and the window to a top\
    \ level window. If this function executes correctly it will have a value of `1`.\
    \ The next step is to initialize the `class: aap=Blah()`, we also need to loop\
    \ it `app.MainLoop()`.\n\nLet's re-factor the code further using `PySimpleApp()`:\
    \ Note this class might be deprecated, but it will still work.\n\n```python\n\
    >>> help('wx.PySimpleApp')\n```\n\nHelp on class `PySimpleApp` in wx:\n\n`wx.PySimpleApp\
    \ = class PySimpleApp(App)`\nA simple application class. You can just create one\
    \ of these and then make your top level windows later, and not have to worry about\
    \ `OnInit`. For example:\n\n```python\napp = wx.PySimpleApp()\nframe = wx.Frame(None,\
    \ title='Hello World')\nframe.Show()\napp.MainLoop()\n```\n\n:see: `wx.App`\n\n\
    Method resolution order:\n`PySimpleApp`\n`App`\n`PyApp`\n`EvtHandler`\n`Object`\n\
    `__builtin__.object`\n\nMethods defined here:\n`OnInit(self)`\n`__init__(self,\
    \ redirect=False, filename=None, useBestVisual=False, clearSigInt=True)`\n:see:\
    \ `wx.App.__init__`\n\nMethods inherited from App:\n`Destroy(self)`\n`MainLoop(self)`\
