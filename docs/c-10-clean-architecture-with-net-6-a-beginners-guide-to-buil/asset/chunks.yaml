  trans: "\n对持久层进行单元测试对于确保软件应用程序中可靠的数据处理至关重要。通过对 CRUD 增删改操作、错误处理场景和数据完整性约束编写单元测试，我们可以验证数据库操作的行为符合预期，并优雅地处理边界情况。此外，通过使用模拟（mocking）库来隔离依赖项，我们可以专注于测试代码逻辑，而不依赖外部资源。总而言，对持久层的单元测试增强了应用程序的可靠性和可维护性。\n\
    \n# 第 9 章：使用 ASP.NET Core MVC 6 的整洁架构\n\n## ASP.NET Core MVC 6 作为整洁架构中的表示层\n使用\
    \ C# 10 和 .NET 6 将 ASP.NET Core MVC 6 实现为整洁架构中的表示层，是构建健壮且可维护的 Web 应用程序的强大组合在本指南中，我们将探索如何结构化结构化并将其集成到整洁架构解决方案中。\n\
    \n### 整洁架构概述\n整洁架构是一种软件设计模式，强调关注点分离以及框架和外部依赖的独立。它由多个层组成，包括：\n1. **表示层**：处理用户交互并向用户显示信息。\n\
    2. **应用层**：包含特定特定的业务逻辑，并协调表示层与领域层之间的交互。\n3. **领域层**：包含核心业务逻辑和实体。\n4. **基础设施层**：实现外部关注点，如数据库访问、外部服务和日志记录。\n\
    \n### 集成 ASP.NET Core MVC 6\n让我们从在整洁架构解决方案中设置 ASP.NET Core MVC 6 开始：\n1. 创建一个新的\
    \ ASP.NET Core Web 应用程序项目：\n```bash\ndotnet new web -n MyApp.Web\n```\n2. 添加对领域层的引用：\n\
    ```bash\ndotnet add reference ../MyApp.Domain/MyApp.Domain.csproj\n```\n3. 添加对应用层的引用：\n\
    ```bash\ndotnet add reference ../MyApp.Application/MyApp.Application.csproj\n\
    ```\n\n### 表示层的结构化\n在整洁架构解决方案中，表示层负责处理用户请求、渲染视图以及与应用层交互。让我们按此结构化表示层：\n```\nMyApp.Web/\n\
    ├── Controllers/\n│   └── HomeController.cs\n├── Views/\n│   └── Home/\n│    \
    \   └── Index.cshtml\n└── Startup.cs\n```\n#### 创建控制器\nASP.NET Core MVC 6 中的控制器负责处理传入的\
    \ HTTP 请求并执行相应的操作。让我们创建一个简单的 `HomeController`：\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
    using MyApp.Application;\nnamespace MyApp.Web.Controllers\n{\n    public class\
    \ HomeController : Controller\n    {\n        private readonly IPostService _postService;\n\
    \        public HomeController(IPostService postService)\n        {\n        \
    \    _postService = postService;\n        }\n        public IActionResult Index()\n\
    \        {\n            var posts = _postService.GetAllPosts();\n            return\
    \ View(posts);\n        }\n    }\n}\n```\n#### 定义视图\nASP.NET Core MVC 6 中的视图负责向客户端渲染\
    \ HTML 标记。让我们创建一个简单的 `Index` 视图来显示帖子列表：\n```html\n<!-- Views/Home/Index.cshtml\
    \ -->\n@model List<MyApp.Domain.Post>\n<h1>Posts</h1>\n<ul>\n    @foreach (var\
    \ post in Model)\n    {\n        <li>@post.Title</li>\n    }\n</ul>\n```\n####\
    \ 配置依赖注入\n在 ASP.NET Core MVC 6 中，我们我们可以在 `Startup` 类中配置依赖注入。让我们注册应用层的服务：\n```csharp\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\nusing\
    \ Microsoft.Extensions.DependencyInjection;\nusing MyApp.Application;\nnamespace\
    \ MyApp.Web\n{\n    public class Startup\n    {\n        public void ConfigureServices(IServiceCollection\
    \ services)\n        {\n            services.AddControllersWithViews();\n    \
    \        // 注册应用服务\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n        public void Configure(IApplicationBuilder app, IWebHostEnvironment\
    \ env)\n        {\n            if (env.IsDevelopment())\n            {\n     \
    \           app.UseDeveloperExceptionPage();\n            }\n            app.UseStaticFiles();\n\
    \            app.UseRouting();\n            app.UseEndpoints(endpoints =>\n  \
    \          {\n                endpoints.MapControllerRoute(name: \"default\",\
    \ pattern: \"{controller=Home}/{action=Index}/{id?}\");\n            });\n   \
    \     }\n    }\n}\n```\n\n将 ASP.NET Core MVC 6 集成到整洁架构解决方案中为构建现代 Web 应用程序提供了坚实的基础。通过通过控制器和视图结构化表示层，并在\
    \ `Startup` 类中配置依赖注入，我们确保了代码库的关注点分离和维护性。此外，利用整洁架构原则允许我们根据需要轻松更换组件或扩展应用程序，同时保持核心业务逻辑独立于外部框架和库。\n\
    \n## 从 ASP.NET Core MVC 控制器消费业务逻辑层\n从 ASP.NET Core MVC 控制器消费业务逻辑层是构建遵循 C# 10 和\
    \ .NET 6 的整洁架构原则的健壮 Web 应用程序的关键方面。在本指南中，我们将探索如何从 MVC 控制器集成并消费包含业务逻辑的应用层。\n\n###\
    \ 整洁架构概述\n整洁架构强调关注点分离以及外部框架的独立。它由多个层组成，包括：\n1. **表示层**：处理用户交互并向用户显示信息。\n2. **应用层**：包含特定特定的业务逻辑，并协调表示层与领域层之间的交互。\n\
    3. **领域层**：包含核心业务逻辑和实体。\n4. **基础设施层**：实现外部关注点，如数据库访问、外部服务和日志记录。\n\n### 集成业务逻辑层\n\
    让我们将包含业务逻辑的应用层集成到 ASP.NET Core MVC 项目中：\n1. 在 ASP.NET Core MVC 项目中引用应用层项目：\n```bash\n\
    dotnet add reference ../MyApp.Application/MyApp.Application.csproj\n```\n\n####\
    \ 从控制器消费业务逻辑\nASP.NET Core 中的 MVC 控制器负责处理传入的 HTTP 请求并调用应用层中的适当方法。让我们创建一个控制器并消费业务逻辑：\n\
    ```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\nnamespace\
    \ MyApp.Web.Controllers\n{\n    public class PostController : Controller\n   \
    \ {\n        private readonly IPostService _postService;\n        public PostController(IPostService\
    \ postService)\n        {\n            _postService = postService;\n        }\n\
    \        public IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n        public IActionResult Details(int\
    \ id)\n        {\n            var post = _postService.GetPostById(id);\n     \
    \       if (post == null)\n            {\n                return NotFound();\n\
    \            }\n            return View(post);\n        }\n        // 其他 CRUD\
    \ 操作的控制器\n    }\n}\n```\n在此代码中：\n1. 我们通过依赖注入将 `IPostService` 接口注入到构造函数中。\n2. 在\
    \ `Index` 操作中，我们调用 `IPostService` 的 `GetAllPosts` 方法获取所有帖子并将其传递给视图。\n3. 在 `Details`\
    \ 操作中，我们调用 `IPostService` 的 `GetPostById` 方法根据 ID 获取特定帖子并将其传递给视图。\n\n#### 配置依赖注入\n\
    为了确保 ASP.NET Core MVC 控制器可以解析应用层的依赖，我们需要在 `Startup` 类中配置依赖注入：\n```csharp\nusing\
    \ Microsoft.Extensions.DependencyInjection;\nusing MyApp.Application;\nnamespace\
    \ MyApp.Web\n{\n    public class Startup\n    {\n        public void ConfigureServices(IServiceCollection\
    \ services)\n        {\n            services.AddControllersWithViews();\n    \
    \        // 注册应用服务\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n        // 其他配置方法\n    }\n}\n```\n在 `ConfigureServices` 方法中，我们将 `IPostService`\
    \ 接口及其实现 (`PostService`) 注册为作用域（scoped）服务。这允许 ASP.NET Core 为每个请求创建一个新实例并进行注入。\n\
    \n从 ASP.NET Core MVC 控制器消费业务逻辑层对于构建可维护的应用程序至关重要。通过将应用层的依赖项注入到控制器，我们确保了关注点分离和维护性。此外，遵循整洁架构原则创建了清晰且结构化的架构。\n"
- fmt: "\n1. We inject an instance of the `IPostService` interface into the controller's\
    \ constructor.\n2. ASP.NET Core MVC automatically resolves the dependency and\
    \ provides an instance of `PostService` when creating an instance of `PostController`.\n\
    \n## Consuming Services in Controller Actions\n\nOnce the service is injected\
    \ into the controller, we can use it in controller actions:\n\n```csharp\npublic\
    \ IActionResult Index(){\n    var posts = _postService.GetAllPosts();\n    return\
    \ View(posts);\n}\n```\n\nIn this code:\n● We call the `GetAllPosts` method of\
    \ the injected `IPostService` to retrieve all posts.\n\n## Dependency Injection\
    \ in Views\n\nIn ASP.NET Core MVC, we can also inject services directly into views\
    \ using the `@inject` directive. For example, to inject the `IPostService` into\
    \ a view, we can do the following:\n\n```html\n@inject MyApp.Application.IPostService\
    \ PostService\n```\n\nThen, we can use `@PostService` to access the service within\
    \ the view.\n\nImplementing dependency injection in ASP.NET Core MVC applications\
    \ is essential for building maintainable and testable codebases. By registering\
    \ services in the `Startup` class and injecting them into controllers using constructor\
    \ injection, we promote loose coupling and improve the overall architecture of\
    \ the application. Additionally, dependency injection enables us to easily swap\
    \ implementations, mock dependencies for unit testing, and adhere to clean architecture\
    \ principles. Overall, incorporating dependency injection into ASP.NET Core MVC\
    \ applications enhances code quality, scalability, and maintainability.\n\n##\
    \ Leveraging Minimal APIs for Concise and Efficient Controllers (New in .NET 6)\n\
    \nLeveraging Minimal APIs in .NET 6 offers a concise and efficient approach to\
    \ building controllers for ASP.NET Core applications. This feature allows developers\
    \ to define routes and handle requests with minimal ceremony, making it particularly\
    \ appealing for clean architecture solutions using C# 10 and .NET 6. In this guide,\
    \ we'll explore how to leverage Minimal APIs to create controllers in a clean\
    \ architecture project.\n\n### Setting Up Minimal APIs\n\nTo get started with\
    \ Minimal APIs in a clean architecture project, follow these steps:\n\n1. Ensure\
    \ you have .NET 6 installed on your machine.\n2. Create a new ASP.NET Core project\
    \ using the `web` template:\n```bash\ndotnet new web -n MyApp.Web\n```\n3. Add\
    \ references to the domain and application layers:\n```bash\ndotnet add reference\
    \ ../MyApp.Domain/MyApp.Domain.csproj\ndotnet add reference ../MyApp.Application/MyApp.Application.csproj\n\
    ```\n4. Delete the `Startup.cs` file generated by the template.\n5. Create a new\
    \ file named `Program.cs` in the `MyApp.Web` project:\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\nvar builder = WebApplication.CreateBuilder(args);\n\
    // Register application services\nbuilder.Services.AddScoped<IPostService, PostService>();\n\
    var app = builder.Build();\napp.MapGet(\"/posts\", async (IPostService postService)\
    \ =>{\n    var posts = await postService.GetAllPosts();\n    await JsonSerializer.SerializeAsync(app.Response.Body,\
    \ posts);\n});\napp.Run();\n```\n\nIn this code:\n1. We use the `WebApplication.CreateBuilder`\
    \ method to create a new `WebApplication` instance.\n2. We register services in\
    \ the dependency injection container using the `Services` property of the builder.\n\
    3. We define a route for handling GET requests to `/posts`. Inside the route handler,\
    \ we use dependency injection to access the `IPostService` and retrieve all posts.\n\
    4. Finally, we call the `Run` method to start the application.\n\n### Running\
    \ the Application\n\nTo run the application, use the following command in the\
    \ terminal:\n```bash\ndotnet run --project MyApp.Web\n```\nThe application will\
    \ start listening on the specified port (default is 5000) and respond to requests\
    \ to `/posts` with a JSON array containing all posts.\n\n### Benefits of Minimal\
    \ APIs\n\nUsing Minimal APIs offers several benefits:\n1. **Simplicity**: Minimal\
    \ APIs have a minimalistic syntax, making it easy to define routes and handle\
    \ requests without unnecessary ceremony.\n2. **Performance**: Minimal APIs are\
    \ lightweight and efficient, resulting in faster startup times and reduced memory\
    \ usage compared to traditional MVC controllers.\n3. **Conciseness**: With Minimal\
    \ APIs, you can define routes and handle requests in a single file, reducing the\
    \ amount of boilerplate code required.\n4. **Testability**: Minimal APIs can be\
    \ easily tested using unit tests, as they rely on standard .NET Core components\
    \ such as dependency injection and asynchronous programming.\n\nLeveraging Minimal\
    \ APIs in .NET 6 provides a concise and efficient approach to building controllers\
    \ for ASP.NET Core applications. By defining routes and handling requests in a\
    \ single file, Minimal APIs reduce complexity and streamline the development process.\
    \ Additionally, Minimal APIs are lightweight, performant, and easy to test, making\
    \ them well-suited for clean architecture projects. Overall, adopting Minimal\
    \ APIs can enhance developer productivity and improve the maintainability of ASP.NET\
    \ Core applications.\n\n## Chapter 10: Testing Strategies for Robust Clean Architecture\
    \ Applications\n\n### Unit Testing: Verifying Business Logic in Isolation\n\n\
    Unit testing is a crucial aspect of software development, especially when following\
    \ clean architecture principles using C# 10 and .NET 6. In clean architecture,\
    \ unit tests verify the business logic in isolation, ensuring that each component\
    \ behaves as expected independently of external dependencies. In this guide, we'll\
    \ explore how to write unit tests to verify business logic in a clean architecture\
    \ project.\n\n### Benefits of Unit Testing\n\n1. **Early Bug Detection**: Unit\
    \ tests help identify bugs and issues early in the development process, reducing\
    \ the cost of fixing them later.\n2. **Regression Testing**: Unit tests provide\
    \ a safety net that ensures existing functionality remains intact when making\
    \ changes to the codebase.\n3. **Improved Design**: Writing tests often leads\
    \ to better-designed code, as it encourages the separation of concerns and modularization.\n\
    4. **Documentation**: Unit tests serve as living documentation that describes\
    \ how components of the system should behave.\n\n### Writing Unit Tests for Business\
    \ Logic\n\nLet's write unit tests to verify the business logic in a clean architecture\
    \ project. We'll focus on testing the `PostService` class, which contains application-specific\
    \ business logic related to posts.\n\n```csharp\nusing System.Collections.Generic;\n\
    using System.Threading.Tasks;\nusing Moq;\nusing Xunit;\nusing MyApp.Application;\n\
    using MyApp.Domain;\npublic class PostServiceTests{\n    [Fact]\n    public async\
    \ Task GetAllPosts_Should_Return_All_Posts() {\n        // Arrange\n        var\
    \ mockPostRepository = new Mock<IPostRepository>();\n        var posts = new List<Post>{\n\
    \            new Post { Id = 1, Title = \"Post 1\", Content = \"Content 1\" },\n\
    \            new Post { Id = 2, Title = \"Post 2\", Content = \"Content 2\" },\n\
    \        };\n        mockPostRepository.Setup(repo => repo.GetAllAsync()).ReturnsAsync(posts);\n\
    \        var postService = new PostService(mockPostRepository.Object);\n     \
    \   // Act\n        var result = await postService.GetAllPosts();\n        //\
    \ Assert\n        Assert.Equal(posts, result);\n    }\n    // Write similar tests\
    \ for other methods in the PostService class\n}\n```\n\nIn this test:\n1. We use\
    \ the XUnit testing framework to define a test method (`GetAllPosts_Should_Return_All_Posts`).\n\
    2. We create a mock implementation of the `IPostRepository` interface using the\
    \ Moq library. This allows us to control the behavior of the repository during\
    \ the test.\n3. We set up the mock repository to return a list of posts when the\
    \ `GetAllAsync` method is called.\n4. We instantiate an instance of the `PostService`\
    \ class with the mock repository.\n"
