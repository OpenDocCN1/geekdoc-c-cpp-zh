  trans: "\n\n从表现层消费业务逻辑层是整洁架构的一个关键方面，确保了表现层与底层业务逻辑解耦。通过遵循依赖注入、接口隔离和封装等原则，开发者可以创建模块化且可维护的应用程序。表现层与业务逻辑层之间的关注点分离提供了灵活性、可扩展性和测试性，允许软件系统随着时间的推移进行更容易演进和维护。\n\
    \n## 在表现层实现依赖注入以提高灵活性\n\n依赖注入（`DI`）是一种强大的设计模式，通过将依赖项与其使用者解耦，促进了软件系统的松耦合和灵活性。在整洁架构以及使用\
    \ `C# 10` 和 `.NET 6` 的背景下，在表现层实现依赖注入可以增强灵活性和可维护性。它允许表现层的组件依赖于抽象而非具体实现，从而便于应用程序的测试、扩展和演进。在这份指南中，我们将探索如何在整洁架构应用的表现层中实现依赖注入，并配有基于\
    \ `C# 10` 和 `.NET 6` 的代码示例。\n\n### 在表现层中使用依赖注入的好处\n\n1. **解耦**：依赖注入将表现层中的组件与其依赖项解耦，减少了紧耦合并促进了模块化。这使得在不影响系统其他部分的情况下替换或修改依赖变得更容易。\n\
    2. **可测试性**：通过依赖抽象而非具体实现，表现层的组件变得更容易测试。在测试期间可以提供 mock 或桩（stub）实现，允许专注于特定行为的隔离单元测试。\n\
    3. **灵活性**：依赖注入通过促进依赖项的不同实现的使用，在表现层中实现了更大的灵活性。这允许开发者更轻松地适应不断变化的需求或集成新功能。\n\n##\
    \ 在表现层实现依赖注入\n\n让我们演示如何在整洁架构应用的表现层中实现依赖注入：\n\n```csharp\n// Presentation Layer\
    \ (表现层)\npublic interface ITodoListViewModel\n{\n    ObservableCollection<TodoItem>\
    \ TodoItems { get; }\n    void AddTodoItem(string title);\n    void UpdateTodoItem(TodoItem\
    \ todoItem);\n    void DeleteTodoItem(int id);\n}\n\npublic class TodoListViewModel\
    \ : ITodoListViewModel\n{\n    private readonly ITodoService _todoService;\n \
    \   public ObservableCollection<TodoItem> TodoItems { get; } = new ObservableCollection<TodoItem>();\n\
    \n    public TodoListViewModel(ITodoService todoService)\n    {\n        _todoService\
    \ = todoService;\n        LoadTodoItems();\n    }\n\n    private void LoadTodoItems()\n\
    \    {\n        TodoItems.Clear();\n        var todoItems = _todoService.GetAllTodoItems();\n\
    \        foreach (var todoItem in todoItems)\n        {\n            TodoItems.Add(todoItem);\n\
    \        }\n    }\n\n    public void AddTodoItem(string title)\n    {\n      \
    \  var newTodoItem = new TodoItem { Title = title };\n        _todoService.AddTodoItem(newTodoItem);\n\
    \        TodoItems.Add(newTodoItem);\n    }\n\n    public void UpdateTodoItem(TodoItem\
    \ todoItem)\n    {\n        _todoService.UpdateTodoItem(todoItem);\n    }\n\n\
    \    public void DeleteTodoItem(int id)\n    {\n        _todoService.DeleteTodoItem(id);\n\
    \        var todoItemToRemove = TodoItems.FirstOrDefault(item => item.Id == id);\n\
    \        if (todoItemToRemove != null)\n        {\n            TodoItems.Remove(todoItemToRemove);\n\
    \        }\n    }\n}\n```\n\n在此示例中：\n\n1. `TodoListViewModel` 类实现了接口 `ITodoListViewModel`，该接口定义了在表现层中与待办事项交互的合约。\n\
    2. `TodoListViewModel` 类依赖于抽象 `ITodoService` 与待办事项交互，从而提供了灵性和可测试性。\n\n### 使用依赖注入容器注册依赖项\n\
    \n要在表现层中使用依赖注入，需要将依赖项注册到依赖注入容器中。在应用程序启动配置中，可以如下注册依赖项：\n\n```csharp\n// Dependency\
    \ Injection Configuration (依赖注入配置)\nservices.AddSingleton<ITodoService, TodoService>();\n\
    services.AddSingleton<ITodoListViewModel, TodoListViewModel>();\n```\n\n在整洁架构应用的表现层实现依赖注入促进了灵活性、可测试性和可维护性。通过依赖抽象而非具体实现，表现层的组件变得更容易测试，并更能适应变化的需求。关注点分离和依赖项解耦允许更大的模块化和扩展性，使得应用程序随时间的推移更易演进。通过依赖注入，开发者可以构建出健壮、可维护且可扩展的整洁架构应用程序。\n\
    \n# 第 8 章：使用 .NET 实现数据持久化\n\n## 选择合适的数据访问技术 (.NET Entity Framework Core)\n\n在整洁架构中，选择合适的数据访问技术对于构建可扩展、可维护且高效的应用程序至关重要。`.NET\
    \ Entity Framework Core` 是 `.NET` 应用程序数据访问的热门选择，因为它具有易用性、灵活性和丰富的特性集。在这份指南中，我们将结合代码示例，探索在基于整洁架构原则的\
    \ `C# 10` 应用程序中，何时选择 `.NET Entity Framework Core` 作为数据访问技术的考虑因素。\n\n### 选择 .NET\
    \ Entity Framework Core 的考虑因素\n\n1. **易用性**：`.NET Entity Framework Core` 为数据库提供了高层抽象，允许开发者使用熟悉的面向对象概念（如实体、关系和\
    \ LINQ 查询）与数据库交互。这简化了数据访问代码并减少了所需的样板代码。\n2. **ORM 特性**：`.NET Entity Framework\
    \ Core` 提供了广泛的功能，如自动更改跟踪、延迟加载和查询翻译。这些功能通过自动处理许多数据库操作简化了开发流程并提高了生产力。\n3. **跨平台支持**：`.NET\
    \ Entity Framework Core` 是跨平台的，可以与 `.NET Core`、`.NET Framework`以及 `.NET 5/6` 使用。这确保了跨环境的兼容性，允许开发者构建运行在各种操作系统上的应用程序。\n\
    4. **性能**：`.NET Entity Framework Core` 相比之前的版本进行了重大的性能改进，在读写操作上提供了更好的性能。它还提供了查询缓存和编译查询等功能来进一步优化性能。\n\
    5. **与整洁架构集成**：`.NET Entity Framework Core` 与整洁架构原则良好集成，允许开发者设计与其他应用层解耦的数据访问代码。这有助于应用程序的测试、维护和演进。\n\
    \n### 在整洁架构中使用 .NET Entity Framework Core 的示例\n\n让我们演示如何在整洁架构中使用 `.NET Entity\
    \ Framework Core` 与数据库交互：\n\n```csharp\n// Infrastructure Layer (基础设施层)\npublic\
    \ class TodoDbContext : DbContext\n{\n    public TodoDbContext(DbContextOptions<TodoDbContext>\
    \ options) : base(options){}\n    public DbSet<TodoItem> TodoItems { get; set;\
    \ }\n}\n\npublic class TodoRepository : IRepository<TodoItem>\n{\n    private\
    \ readonly TodoDbContext _dbContext;\n    public TodoRepository(TodoDbContext\
    \ dbContext)\n    {\n        _dbContext = dbContext;\n    }\n\n    public IEnumerable<TodoItem>\
    \ GetAll()\n    {\n        return _dbContext.TodoItems.ToList();\n    }\n\n  \
    \  public TodoItem GetById(int id)\n    {\n        return _dbContext.TodoItems.Find(id);\n\
    \    }\n\n    public void Add(TodoItem entity)\n    {\n        _dbContext.TodoItems.Add(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n\n    public void Update(TodoItem entity)\n\
    \    {\n        _dbContext.TodoItems.Update(entity);\n        _dbContext.SaveChanges();\n\
    \    }\n\n    public void Delete(TodoItem entity)\n    {\n        _dbContext.TodoItems.Remove(entity);\n\
    \        _dbContext.SaveChanges();\n    }\n}\n```\n\n在此示例中：\n\n"
- fmt: "\n1. The `TodoDbContext` class represents the database context and provides\
    \ access to the `TodoItem` entities.\n2. The `TodoRepository` class implements\
    \ the repository pattern and interacts with the database using .NET Entity Framework\
    \ Core.\n\n## Configuring Entity Framework Core in the Startup Class\n\nTo configure\
    \ .NET Entity Framework Core in the application, you need to register the database\
    \ context and repositories in the startup class:\n\n```csharp\n// Startup Configuration\n\
    public void ConfigureServices(IServiceCollection services)\n{\n    services.AddDbContext<TodoDbContext>(options\
    \ =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n    services.AddScoped<IRepository<TodoItem>, TodoRepository>();\n    //\
    \ Other service registrations...\n}\n```\n\nChoosing the right data access technology\
    \ is critical for the success of a clean architecture application. .NET Entity\
    \ Framework Core offers many advantages such as ease of use, cross-platform support,\
    \ and integration with clean architecture principles. By leveraging .NET Entity\
    \ Framework Core, developers can build robust, maintainable, and efficient applications\
    \ that scale with ease. Whether you're building a small-scale application or a\
    \ large enterprise system, .NET Entity Framework Core provides the tools and features\
    \ necessary to meet your data access requirements while adhering to clean architecture\
    \ principles.\n\n## Defining Data Models and Mapping Entities for Persistence\n\
    \nDefining data models and mapping entities for persistence is a crucial aspect\
    \ of software development, especially in the context of clean architecture using\
    \ C# 10 and .NET 6. In this guide, we'll delve into what data models are, how\
    \ to define them, and how to map entities for persistence in C# 10 with .NET 6.\n\
    \n### What are Data Models?\n\nData models represent the structure and relationships\
    \ of data within a system. They serve as blueprints for organizing and manipulating\
    \ data in software applications. In C# 10 with .NET 6, data models are typically\
    \ represented using classes.\n\nLet's define a simple data model for a blog application:\n\
    \n```csharp\npublic class Post\n{\n    public int Id { get; set; }\n    public\
    \ string Title { get; set; }\n    public string Content { get; set; }\n    public\
    \ DateTime CreatedAt { get; set; }\n    public DateTime UpdatedAt { get; set;\
    \ }\n}\n```\n\nIn this example, the `Post` class represents a blog post with properties\
    \ such as `Id`, `Title`, `Content`, `CreatedAt`, and `UpdatedAt`.\n\n### Mapping\
    \ Entities for Persistence\n\nMapping entities for persistence involves defining\
    \ how data models are stored and retrieved from a data source, such as a database.\
    \ In C# 10 with .NET 6, this is typically achieved using an Object-Relational\
    \ Mapper (ORM) like Entity Framework Core.\n\nLet's create a `DbContext` and map\
    \ the `Post` entity for persistence:\n\n```csharp\nusing Microsoft.EntityFrameworkCore;\n\
    \npublic class BlogDbContext : DbContext\n{\n    public DbSet<Post> Posts { get;\
    \ set; }\n    protected override void OnConfiguring(DbContextOptionsBuilder optionsBuilder)\n\
    \    {\n        optionsBuilder.UseSqlServer(\"your_connection_string_here\");\n\
    \    }\n\n    protected override void OnModelCreating(ModelBuilder modelBuilder)\n\
    \    {\n        modelBuilder.Entity<Post>(entity =>\n        {\n            entity.ToTable(\"\
    Posts\");\n            entity.HasKey(e => e.Id);\n            entity.Property(e\
    \ => e.Title).IsRequired().HasMaxLength(100);\n            entity.Property(e =>\
    \ e.Content).IsRequired();\n            entity.Property(e => e.CreatedAt).IsRequired();\n\
    \            entity.Property(e => e.UpdatedAt).IsRequired();\n        });\n  \
    \  }\n}\n```\n\nIn this code:\n\n1. We define a `BlogDbContext` class that inherits\
    \ from `DbContext`, which is provided by Entity Framework Core.\n2. We create\
    \ a `DbSet<Post>` property to represent the collection of `Post` entities in the\
    \ database.\n3. In the `OnConfiguring` method, we specify the database provider\
    \ and connection string.\n4. In the `OnModelCreating` method, we define the entity\
    \ configuration for the `Post` entity. This includes specifying the table name,\
    \ primary key, and column mappings.\n\n## Using the DbContext\n\nNow that we have\
    \ defined our `DbContext` and mapped the `Post` entity, we can use it to interact\
    \ with the database:\n\n```csharp\nusing System;\nusing System.Linq;\n\nclass\
    \ Program\n{\n    static void Main(string[] args)\n    {\n        using var dbContext\
    \ = new BlogDbContext();\n        // Create a new post\n        var newPost =\
    \ new Post\n        {\n            Title = \"Introduction to Clean Architecture\"\
    ,\n            Content = \"Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit.\",\n            CreatedAt = DateTime.UtcNow,\n            UpdatedAt =\
    \ DateTime.UtcNow\n        };\n        dbContext.Posts.Add(newPost);\n       \
    \ dbContext.SaveChanges();\n\n        // Retrieve all posts\n        var posts\
    \ = dbContext.Posts.ToList();\n        foreach (var post in posts)\n        {\n\
    \            Console.WriteLine($\"Title: {post.Title}, Content: {post.Content}\"\
    );\n        }\n    }\n}\n```\n\nIn this code:\n\n1. We instantiate a new instance\
    \ of `BlogDbContext`.\n2. We create a new `Post` entity and add it to the `Posts`\
    \ DbSet.\n3. We call `SaveChanges` to persist the changes to the database.\n4.\
    \ We retrieve all posts from the database and display their titles and content.\n"
