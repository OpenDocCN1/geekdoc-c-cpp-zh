  trans: "\n\n定义数据模型并为持久化建立实体映射对于构建健壮且可维护的软件应用程序至关重要。在 `C# 10` 和 `.NET 6` 中，这通常使用\
    \ `classes` 来表示数据模型，并使用 `Entity Framework Core` 为 `persistence` 映射实体。通过遵循整洁架构原则，我们可以设计出模块化、可测试且易于维护的系统。\n\
    \n# 使用关注点分离实现数据访问逻辑\n通过关注点分离实现数据访问逻辑是软件开发中的基础实践，特别是使用 `C# 10` 和 `.NET 6` 遵循整洁架构时。在本指南中，我们将探索如何在保持关注分离的同时实现数据访问逻辑。\n\
    \n## 关注点分离\n关注点分离 (`SoC`) 是一种设计原则，主张将软件系统分为不同的部分，每个部分处理一个独立的问题。这种分离增强了系统的可维护性、扩展性和可测试性。在数据访问逻辑中，`SoC`\
    \ 意味着将数据库操作与业务逻辑隔离。\n\n## 仓库模式\n`Repository` 模式是遵循 `SoC` 原则实现数据访问逻辑的常用方法。它将数据访问代码从应用程序的其他部分抽象出来，并为与底层数据存储交互了一个清晰的接口。\n\
    \n让我们为博客应用程序实现仓库模式：\n\n```csharp\npublic interface IPostRepository{\n    Task<List<Post>>\
    \ GetAllAsync();\n    Task<Post> GetByIdAsync(int id);\n    Task AddAsync(Post\
    \ post);\n    Task UpdateAsync(Post post);\n    Task DeleteAsync(int id);\n}\n\
    \npublic class PostRepository : IPostRepository{\n    private readonly BlogDbContext\
    \ _dbContext;\n    public PostRepository(BlogDbContext dbContext){\n        _dbContext\
    \ = dbContext;\n    }\n    public async Task<List<Post>> GetAllAsync(){\n    \
    \    return await _dbContext.Posts.ToListAsync();\n    }\n    public async Task<Post>\
    \ GetByIdAsync(int id){\n        return await _dbContext.Posts.FindAsync(id);\n\
    \    }\n    public async Task AddAsync(Post post){\n        await _dbContext.Posts.AddAsync(post);\n\
    \        await _dbContext.SaveChangesAsync();\n    }\n    public async Task UpdateAsync(Post\
    \ post){\n        _dbContext.Posts.Update(post);\n        await _dbContext.SaveChangesAsync();\n\
    \    }\n    public async Task DeleteAsync(int id){\n        var post = await _dbContext.Posts.FindAsync(id);\n\
    \        if (post != null){\n            _dbContext.Posts.Remove(post);\n    \
    \        await _dbContext.SaveChangesAsync();\n        }\n    }\n}\n```\n\n在此段代码中：\n\
    1. 我们定义了一个 `IPostRepository` 接口，规定了与文章交互的约。\n2. 我们实现了该仓库接口的 `PostRepository` 类。\n\
    3. 仓库类封装了数据库操作，例如获取所有文章、通过 `id` 获取文章、添加新文章、更新现有文章以及删除文章。\n\n## 依赖注入\n为了在应用程序中使用该仓库，我们需要将其在\
    \ `.NET Core` 提供的依赖注入容器中注册：\n\n```csharp\npublic class Startup{\n    public void\
    \ ConfigureServices(IServiceCollection services){\n        services.AddDbContext<BlogDbContext>(options\
    \ =>\n            options.UseSqlServer(\"your_connection_string_here\"));\n  \
    \      services.AddScoped<IPostRepository, PostRepository>();\n        // 其他服务注册...\n\
    \    }\n}\n```\n\n通过将仓库注册为作用域服务（scoped service），我们确保每个 HTTP 请求都获得该仓库的实例。\n\n##\
    \ 使用仓库\n现在，让我们来看看如何在应用程序中使用该仓库：\n\n```csharp\npublic class PostService{\n    private\
    \ readonly IPostRepository _postRepository;\n    public PostService(IPostRepository\
    \ postRepository){\n        _postRepository = postRepository;\n    }\n    public\
    \ async Task<List<Post>> GetAllPosts(){\n        return await _postRepository.GetAllAsync();\n\
    \    }\n    public async Task<Post> GetPostById(int id){\n        return await\
    \ _postRepository.GetByIdAsync(id);\n    }\n    public async Task CreatePost(Post\
    \ post){\n        await _postRepository.AddAsync(post);\n    }\n    public async\
    \ Task UpdatePost(Post post){\n        await _postRepository.UpdateAsync(post);\n\
    \    }\n    public async Task DeletePost(int id){\n        await _postRepository.DeleteAsync(id);\n\
    \    }\n}\n```\n\n在此段代码中：\n1. 我们定义了一个 `PostService` 类，封装了与文章相关的业务逻辑。\n2. 服务类依赖于\
    \ `IPostRepository` 接口，允许它通过仓库与数据库交互。\n3. 服务类中的每个方法都对应于文章的具体操作，例如获取所有文章、通过 `id`\
    \ 获取文章、创建新文章、更新现有文章以及删除文章。\n\n"
- fmt: "\nImplementing data access logic with separation of concerns is essential\
    \ for building maintainable and scalable software applications. By following the\
    \ Repository pattern and utilizing dependency injection, we can isolate database\
    \ operations from the rest of the application and ensure that each component has\
    \ a clear and well-defined responsibility. This approach not only improves code\
    \ organization but also facilitates unit testing and future enhancements.\n\n\
    ## Unit Testing the Persistence Layer for Reliable Data Handling\nUnit testing\
    \ the persistence layer is crucial for ensuring reliable data handling in software\
    \ applications, especially when following clean architecture principles using\
    \ `C# 10` and `.NET 6`. In this guide, we'll explore how to write unit tests for\
    \ the persistence layer to verify that database operations behave as expected.\n\
    \n## Importance of Unit Testing the Persistence Layer\nUnit testing the persistence\
    \ layer helps ensure that:\n1. Database operations, such as inserting, updating,\
    \ and deleting data, work correctly.\n2. Data access code handles edge cases and\
    \ error conditions gracefully.\n3. Changes to the database schema or ORM mappings\
    \ don't break existing functionality.\n4. Business logic interacts with the database\
    \ in the intended manner.\n\n## Testing Strategy\nWhen testing the persistence\
    \ layer, we typically focus on the following aspects:\n1. CRUD Operations: Test\
    \ that we can create, read, update, and delete entities from the database.\n2.\
    \ Error Handling: Verify that error conditions, such as database connection failures\
    \ or constraint violations, are handled appropriately.\n3. Data Integrity: Ensure\
    \ that data integrity constraints, such as foreign key relationships or unique\
    \ constraints, are enforced.\n4. Performance: Measure the performance of database\
    \ operations to ensure they meet the application's requirements.\n\n## Writing\
    \ Unit Tests\nLet's write unit tests for the `PostRepository` class we implemented\
    \ earlier:\n\n```csharp\npublic class PostRepositoryTests\n{\n    private BlogDbContext\
    \ _dbContext;\n    private IPostRepository _postRepository;\n    [SetUp]\n   \
    \ public void Setup()\n    {\n        var options = new DbContextOptionsBuilder<BlogDbContext>().UseInMemoryDatabase(databaseName:\
    \ \"TestDatabase\").Options;\n        _dbContext = new BlogDbContext(options);\n\
    \        _postRepository = new PostRepository(_dbContext);\n    }\n    [Test]\n\
    \    public async Task AddPost_Should_Add_Post_To_Database()\n    {\n        //\
    \ Arrange\n        var post = new Post{\n            Title = \"Test Post\",\n\
    \            Content = \"This is a test post.\",\n            CreatedAt = DateTime.UtcNow,\n\
    \            UpdatedAt = DateTime.UtcNow\n        };\n        // Act\n       \
    \ await _postRepository.AddAsync(post);\n        // Assert\n        var result\
    \ = await _dbContext.Posts.FirstOrDefaultAsync(p => p.Title == \"Test Post\");\n\
    \        Assert.NotNull(result);\n        Assert.AreEqual(post.Title, result.Title);\n\
    \    }\n    // Write similar tests for other CRUD operations and error handling\
    \ scenarios\n}\n```\n\nIn this code:\n1. We use `NUnit` as the testing framework,\
    \ but you can use any testing framework of your choice.\n2. In the `Setup` method,\
    \ we initialize an in-memory database context and repository instance for each\
    \ test.\n3. We write a test to verify that adding a post to the database works\
    \ as expected. We arrange the data, act by calling the repository method, and\
    \ then assert the outcome.\n\n## Mocking Dependencies\nWhen writing unit tests\
    \ for the persistence layer, it's common to mock external dependencies, such as\
    \ the database context, to isolate the code under test. We can use mocking libraries\
    \ like `Moq` for this purpose:\n\n```csharp\npublic class PostRepositoryTests\n\
    {\n    private Mock<BlogDbContext> _dbContextMock;\n    private IPostRepository\
    \ _postRepository;\n    [SetUp]\n    public void Setup()\n    {\n        _dbContextMock\
    \ = new Mock<BlogDbContext>();\n        _postRepository = new PostRepository(_dbContextMock.Object);\n\
    \    }\n    [Test]\n    public async Task AddPost_Should_Add_Post_To_Database()\n\
    \    {\n        // Arrange\n        var post = new Post{\n            Title =\
    \ \"Test Post\",\n            Content = \"This is a test post.\",\n          \
    \  CreatedAt = DateTime.UtcNow,\n            UpdatedAt = DateTime.UtcNow\n   \
    \     };\n        // Act\n        await _postRepository.AddAsync(post);\n    \
    \    // Assert\n        _dbContextMock.Verify(m => m.Posts.AddAsync(post, default),\
    \ Times.Once);\n        _dbContextMock.Verify(m => m.SaveChangesAsync(default),\
    \ Times.Once);\n    }\n    // Write similar tests for other CRUD operations and\
    \ error handling scenarios\n}\n```\n\nIn this code:\n1. We use `Moq` to create\
    \ a mock instance of the `BlogDbContext`.\n2. In the test method, we arrange the\
    \ data, act by calling the repository method, and then assert that the appropriate\
    \ methods on the mock object were called.\n"
