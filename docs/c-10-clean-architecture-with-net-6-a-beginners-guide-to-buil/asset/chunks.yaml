  trans: "\n1. 我们将 `IPostService` 接口的实例注入到控制器的构造函数中。\n2. ASP.NET Core MVC 在创建 `PostController`\
    \ 实例时，会自动解析依赖并提供 `PostService` 的实例。\n\n## 在控制器动作中消费服务\n\n一旦服务注入到控制器中，我们就可以在控制器动作中使用它：\n\
    \n```csharp\npublic IActionResult Index(){\n    var posts = _postService.GetAllPosts();\n\
    \    return View(posts);\n}\n```\n\n在此段代码中：\n● 我们调用注入的 `IPostService` 的 `GetAllPosts`\
    \ 方法来获取所有帖子。\n\n## 视图中的依赖注入\n\n在 ASP.NET Core MVC 中，我们还可以使用 `@inject` 指令将服务直接注入到视图中。例如，要将\
    \ `IPostService` 注入视图中，我们可以执行以下操作：\n\n```html\n@inject MyApp.Application.IPostService\
    \ PostService\n```\n\n然后，我们可以使用 `@PostService` 在视图内部访问该服务。\n\n在 ASP.NET Core MVC\
    \ 应用中实现依赖注入对于构建可维护和可测试的代码库至关重要。通过在 `Startup` 类中注册服务并使用构造函数注入将其注入控制器中，我们促进了松耦合并改进了应用程序的整体架构。此外，依赖注入允许我们轻松切换实现、为单元测试模拟依赖项，并遵循整洁架构原则。总体而言，将依赖注入整合到\
    \ ASP.NET Core MVC 应用中可以提高代码质量、扩展性和可维护性。\n\n## 利用 Minimal APIs 构建简洁高效的控制器（.NET\
    \ 6 新特性）\n\n在 .NET 6 中利用 Minimal APIs 为 ASP.NET Core 应用构建控制器提供了一种简洁且高效的方法。此功能允许开发者以最少的样板代码定义路由和处理请求，这对于使用\
    \ C# 10 和 .NET 6 的整洁架构解决方案特别有吸引力。在本指南中，我们将探索如何利用 Minimal APIs 在整洁架构项目中创建控制器。\n\
    \n### 设置 Minimal APIs\n\n要在整洁架构项目中开始使用 Minimal APIs，请遵循以下步骤：\n\n1. 确保你的机器上安装了\
    \ .NET 6。\n2. 使用 `web` 模板创建一个新的 ASP.NET Core 项目：\n```bash\ndotnet new web -n MyApp.Web\n\
    ```\n3. 添加对领域层和应用层的引用：\n```bash\ndotnet add reference ../MyApp.Domain/MyApp.Domain.csproj\n\
    dotnet add reference ../MyApp.Application/MyApp.Application.csproj\n```\n4. 删除模板生成的\
    \ `Startup.cs` 文件。\n5. 在 `MyApp.Web` 项目中创建一个名为 `Program.cs` 的新文件：\n```csharp\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\nvar builder = WebApplication.CreateBuilder(args);\n\
    // 注册应用服务\nbuilder.Services.AddScoped<IPostService, PostService>();\nvar app =\
    \ builder.Build();\napp.MapGet(\"/posts\", async (IPostService postService) =>{\n\
    \    var posts = await postService.GetAllPosts();\n    await JsonSerializer.SerializeAsync(app.Response.Body,\
    \ posts);\n});\napp.Run();\n```\n\n在此代码中：\n1. 我们使用 `WebApplication.CreateBuilder`\
    \ 方法创建一个新的 `WebApplication` 实例。\n2. 我们使用 builder 的 `Services` 属性在依赖注入容器中注册服务。\n\
    3. 我们定义了一个处理对 `/posts` GET 请求的路由。在路由处理程序内部，我们使用依赖注入来访问 `IPostService` 并检索所有帖子。\n\
    4. 最后，我们调用 `Run` 方法启动应用程序。\n\n### 运行应用程序\n\n要运行应用程序，请在终端中使用以下命令：\n```bash\ndotnet\
    \ run --project MyApp.Web\n```\n应用程序将在指定的端口（默认为 5000）上启动，并对 `/posts` 的请求返回包含所有帖子的\
    \ JSON 数组。\n\n### Minimal APIs 的优势\n\n使用 Minimal APIs 具有多个优势：\n1. **简单性**：Minimal\
    \ APIs 具有极简的语法，使得定义路由和处理请求变得容易，无需冗余的操作。\n2. **性能**：Minimal APIs 轻量且高效，与传统的 MVC\
    \ 控制器相比，具有更快的启动速度和更低的内存占用。\n3. **简洁性**：通过 Minimal APIs，你可以在单个文件中定义路由并处理请求，减少所需的模板代码量。\n\
    4. **可测试性**：Minimal APIs 可以使用单元测试轻松进行测试，因为它们依赖于标准的 .NET Core 组件（如依赖注入和异步编程）。\n\
    \n在 .NET 6 中利用 Minimal APIs 为 ASP.NET Core 应用构建控制器提供了一种简洁且高效的方法。通过在单个文件中定义路由和处理请求，Minimal\
    \ APIs 减少了复杂性并简化了开发流程。此外，Minimal APIs 轻量、高性能且易于测试，非常适合整洁架构项目。总体而言，采用 Minimal APIs\
    \ 可以提高开发者的生产力并提升 ASP.NET Core 应用的可维护性。\n\n## 第 10 章：健壮整洁架构应用程序的测试策略\n\n### 单元测试：隔离验证业务逻辑\n\
    \n单元测试是软件开发中的一个关键方面，特别是在使用 C# 10 和 .NET 6 遵循整洁架构原则时。在整洁架构中，单元测试隔离地验证业务逻辑，确保每个组件在不依赖外部依赖的情况下都能按预期运行。在本指南中，我们将探索如何编写单元测试来验证整洁架构项目中的业务逻辑。\n\
    \n### 单元测试的优势\n\n1. **早期发现 Bug**：单元测试有助于在开发过程的早期识别 Bug 和问题，减少后期修复的成本。\n2. **回归测试**：单元测试提供了一个安全网，确保在修改代码库时现有功能保持完好。。\n\
    3. **改进设计**：编写测试通常会带来更好的设计，因为它鼓励了关注点分离和模块化。\n4. **文档作用**：单元测试作为活文档，描述了系统组件应该的行为。\n\
    \n### 为业务逻辑编写单元测试\n\n让我们编写单元测试来验证整洁架构项目中的业务逻辑。我们将专注于 `PostService` 类，它包含了与帖子相关的应用特定逻辑。\n\
    \n```csharp\nusing System.Collections.Generic;\nusing System.Threading.Tasks;\n\
    using Moq;\nusing Xunit;\nusing MyApp.Application;\nusing MyApp.Domain;\npublic\
    \ class PostServiceTests{\n    [Fact]\n    public async Task GetAllPosts_Should_Return_All_Posts()\
    \ {\n        // Arrange\n        var mockPostRepository = new Mock<IPostRepository>();\n\
    \        var posts = new List<Post>{\n            new Post { Id = 1, Title = \"\
    Post 1\", Content = \"Content 1\" },\n            new Post { Id = 2, Title = \"\
    Post 2\", Content = \"Content 2\" },\n        };\n        mockPostRepository.Setup(repo\
    \ => repo.GetAllAsync()).ReturnsAsync(posts);\n        var postService = new PostService(mockPostRepository.Object);\n\
    \        // Act\n        var result = await postService.GetAllPosts();\n     \
    \   // Assert\n        Assert.Equal(posts, result);\n    }\n    // 为 PostService\
    \ 类中的其他方法编写类似的测试\n}\n```\n"
