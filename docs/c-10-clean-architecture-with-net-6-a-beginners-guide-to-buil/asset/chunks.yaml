  trans: "\n\n1. `TodoDbContext` 类表示数据库上下文，并提供对 `TodoItem` 体的访问。\n2. `TodoRepository`\
    \ 类实现了存储库模式，并使用 .NET Entity Framework Core 与数据库进行交互。\n\n## 在启动类中配置 Entity Framework\
    \ Core\n\n为了在应用程序中配置 .NET Entity Framework Core，你需要在启动类中注册数据库上下文和存储库：\n\n```csharp\n\
    // Startup Configuration\npublic void ConfigureServices(IServiceCollection services)\n\
    {\n    services.AddDbContext<TodoDbContext>(options =>\n        options.UseSqlServer(Configuration.GetConnectionString(\"\
    DefaultConnection\")));\n    services.AddScoped<IRepository<TodoItem>, TodoRepository>();\n\
    \    // 其他服务注册...\n}\n```\n\n选择合适的数据访问技术对于清洁架构应用的成功至关重要。.NET Entity Framework\
    \ Core 提供了许多优势，例如易用性、跨平台支持以及与清洁架构原则的集成。通过利用 .NET Entity Framework Core，开发者可以构建健壮、可维护且易于扩展的应用程序。无论你是在构建小型应用程序还是大型企业级系统，.NET\
    \ Entity Framework Core 都能提供必要的工具和功能，在遵循清洁架构原则的同时满足你的数据访问需求。\n\n## 定义数据模型并为持久化映射实体\n\
    \n定义数据模型并为持久化映射实体是软件开发中的一个关键方面，特别是在使用 C# 10 和 .NET 6 的清洁架构背景下。在本指南中，我们将深入探讨什么是数据模型、如何定义它们，以及如何在\
    \ C# 10 和 .NET 6 中为持久化映射实体。\n\n### 什么是数据模型？\n\n数据模型表示系统内部数据的结构和关系。它们作为软件应用程序中组织和操作数据的蓝图。在\
    \ C# 10 和 .NET 6 中，数据模型通常使用类表示。\n\n让我们为博客应用定义一个简单的数据模型：\n\n```csharp\npublic class\
    \ Post\n{\n    public int Id { get; set; }\n    public string Title { get; set;\
    \ }\n    public string Content { get; set; }\n    public DateTime CreatedAt {\
    \ get; set; }\n    public DateTime UpdatedAt { get; set; }\n}\n```\n\n在这个示例中，`Post`\
    \ 类表示博客文章，具有 `Id`、`Title`、`Content`、`CreatedAt` 和 `UpdatedAt` 等属性。\n\n### 为持久化映射实体\n\
    \n为持久化映射实体涉及定义如何从数据源（如数据库）存储和检索数据模型。在 C# 10 和 .NET 6 中，这通常通过对象关系映射器（ORM）如 Entity\
    \ Framework Core 实现。\n\n让我们创建一个 `DbContext` 并为 `Post` 实体建立持久化映射：\n\n```csharp\n\
    using Microsoft.EntityFrameworkCore;\n\npublic class BlogDbContext : DbContext\n\
    {\n    public DbSet<Post> Posts { get; set; }\n    protected override void OnConfiguring(DbContextOptionsBuilder\
    \ optionsBuilder)\n    {\n        optionsBuilder.UseSqlServer(\"your_connection_string_here\"\
    );\n    }\n\n    protected override void OnModelCreating(ModelBuilder modelBuilder)\n\
    \    {\n        modelBuilder.Entity<Post>(entity =>\n        {\n            entity.ToTable(\"\
    Posts\");\n            entity.HasKey(e => e.Id);\n            entity.Property(e\
    \ => e.Title).IsRequired().HasMaxLength(100);\n            entity.Property(e =>\
    \ e.Content).IsRequired();\n            entity.Property(e => e.CreatedAt).IsRequired();\n\
    \            entity.Property(e => e.UpdatedAt).IsRequired();\n        });\n  \
    \  }\n}\n```\n\n在此代码中：\n\n1. 我们定义了一个继承自 `DbContext` 的 `BlogDbContext` 类，该类由 Entity\
    \ Framework Core 提供。\n2. 我们创建了一个 `DbSet<Post>` 属性来表示数据库中的 `Post` 实体集合。\n3. 在 `OnConfiguring`\
    \ 方法中，我们指定了数据库提供程序和连接字符串。\n4. 在 `OnModelCreating` 方法中，我们定义了实体的配置。这包括指定表名、主键和列映射。\n\
    \n## 使用 DbContext\n\n现在我们已经定义了 `DbContext` 并映射了 `Post` 实体，可以使用它来与数据库交互：\n\n```csharp\n\
    using System;\nusing System.Linq;\n\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        using var dbContext = new BlogDbContext();\n        //\
    \ 创建一篇新文章\n        var newPost = new Post\n        {\n            Title = \"Introduction\
    \ to Clean Architecture\",\n            Content = \"Lorem ipsum dolor sit amet,\
    \ consectetur adipiscing elit.\",\n            CreatedAt = DateTime.UtcNow,\n\
    \            UpdatedAt = DateTime.UtcNow\n        };\n        dbContext.Posts.Add(newPost);\n\
    \        dbContext.SaveChanges();\n\n        // 获取所有文章\n        var posts = dbContext.Posts.ToList();\n\
    \        foreach (var post in posts)\n        {\n            Console.WriteLine($\"\
    Title: {post.Title}, Content: {post.Content}\");\n        }\n    }\n}\n```\n\n\
    在此代码中：\n\n1. 我们实例化了一个 `BlogDbContext` 的新实例。\n2. 我们创建了一个新的 `Post` 实体并将其添加到 `Posts`\
    \ DbSet 中。\n3. 我们调用 `SaveChanges` 将更改持久化到数据库。\n4. 我们从数据库中检索所有文章并显示它们的标题和内容。\n\n"
- fmt: "\nDefining data models and mapping entities for persistence is essential for\
    \ building robust and maintainable software applications. In `C# 10` with `.NET\
    \ 6`, this is typically accomplished using `classes` to represent data models\
    \ and `Entity Framework Core` to map entities for `persistence`. By following\
    \ clean architecture principles, we can design systems that are modular, testable,\
    \ and easy to maintain.\n\n# Implementing Data Access Logic with Separation of\
    \ Concerns\nImplementing data access logic with separation of concerns is a fundamental\
    \ practice in software development, especially when following clean architecture\
    \ principles using `C# 10` and `.NET 6`. In this guide, we'll explore how to implement\
    \ data access logic while keeping concerns separated.\n\n## Separation of Concerns\n\
    Separation of concerns (`SoC`) is a design principle that advocates dividing a\
    \ software system into distinct sections, each addressing a separate concern.\
    \ This separation enhances maintainability, scalability, and testability of the\
    \ system. In the context of data access logic, `SoC` entails isolating database\
    \ operations from business logic.\n\n## Repository Pattern\nThe `Repository` pattern\
    \ is a common approach to implementing data access logic while adhering to `SoC`\
    \ principles. It abstracts the data access code from the rest of the application\
    \ and provides a clean interface for interacting with the underlying data storage.\n\
    \nLet's implement the Repository pattern for our blog application:\n\n```csharp\n\
    public interface IPostRepository{\n    Task<List<Post>> GetAllAsync();\n    Task<Post>\
    \ GetByIdAsync(int id);\n    Task AddAsync(Post post);\n    Task UpdateAsync(Post\
    \ post);\n    Task DeleteAsync(int id);\n}\n\npublic class PostRepository : IPostRepository{\n\
    \    private readonly BlogDbContext _dbContext;\n    public PostRepository(BlogDbContext\
    \ dbContext){\n        _dbContext = dbContext;\n    }\n    public async Task<List<Post>>\
    \ GetAllAsync(){\n        return await _dbContext.Posts.ToListAsync();\n    }\n\
    \    public async Task<Post> GetByIdAsync(int id){\n        return await _dbContext.Posts.FindAsync(id);\n\
    \    }\n    public async Task AddAsync(Post post){\n        await _dbContext.Posts.AddAsync(post);\n\
    \        await _dbContext.SaveChangesAsync();\n    }\n    public async Task UpdateAsync(Post\
    \ post){\n        _dbContext.Posts.Update(post);\n        await _dbContext.SaveChangesAsync();\n\
    \    }\n    public async Task DeleteAsync(int id){\n        var post = await _dbContext.Posts.FindAsync(id);\n\
    \        if (post != null){\n            _dbContext.Posts.Remove(post);\n    \
    \        await _dbContext.SaveChangesAsync();\n        }\n    }\n}\n```\n\nIn\
    \ this code:\n1. We define an `IPostRepository` interface to specify the contract\
    \ for interacting with posts.\n2. We implement the `PostRepository` class that\
    \ implements the repository interface.\n3. The repository class encapsulates database\
    \ operations such as fetching all posts, getting a post by `id`, adding a new\
    \ post, updating an existing post, and deleting a post.\n\n## Dependency Injection\n\
    To use the repository in our application, we need to register it with the dependency\
    \ injection container provided by `.NET Core`:\n\n```csharp\npublic class Startup{\n\
    \    public void ConfigureServices(IServiceCollection services){\n        services.AddDbContext<BlogDbContext>(options\
    \ =>\n            options.UseSqlServer(\"your_connection_string_here\"));\n  \
    \      services.AddScoped<IPostRepository, PostRepository>();\n        // Other\
    \ service registrations...\n    }\n}\n```\n\nBy registering the repository as\
    \ a scoped service, we ensure that each HTTP request gets its own instance of\
    \ the repository.\n\n## Using the Repository\nNow, let's see how we can use the\
    \ repository in our application:\n\n```csharp\npublic class PostService{\n   \
    \ private readonly IPostRepository _postRepository;\n    public PostService(IPostRepository\
    \ postRepository){\n        _postRepository = postRepository;\n    }\n    public\
    \ async Task<List<Post>> GetAllPosts(){\n        return await _postRepository.GetAllAsync();\n\
    \    }\n    public async Task<Post> GetPostById(int id){\n        return await\
    \ _postRepository.GetByIdAsync(id);\n    }\n    public async Task CreatePost(Post\
    \ post){\n        await _postRepository.AddAsync(post);\n    }\n    public async\
    \ Task UpdatePost(Post post){\n        await _postRepository.UpdateAsync(post);\n\
    \    }\n    public async Task DeletePost(int id){\n        await _postRepository.DeleteAsync(id);\n\
    \    }\n}\n```\n\nIn this code:\n1. We define a `PostService` class that encapsulates\
    \ business logic related to posts.\n2. The service class depends on the `IPostRepository`\
    \ interface, allowing it to interact with the database through the repository.\n\
    3. Each method in the service class corresponds to a specific operation on posts,\
    \ such as getting all posts, getting a post by `id`, creating a new post, updating\
    \ an existing post, and deleting a post.\n"
