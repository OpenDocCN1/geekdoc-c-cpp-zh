  trans: "\n通过关注点分离来实现数据访问逻辑，对于构建可维护且可扩展的软件应用程序关重要。通过遵循仓库模式（Repository pattern）并利用依赖注入，我们可以将数据库操作与应用程序的其他部分隔离，并确保每个组件都有清晰且定义的职责。这种方法不仅改进了代码结构，还便于单元测试和未来的增强。\n\
    \n## 持久层的单元测试以确保可靠的数据处理\n对持久层进行单元测试对于确保软件应用程序中可靠的数据处理至关重要，特别是在使用 `C# 10` 和 `.NET\
    \ 6` 遵循清洁架构原则时。在本指南中，我们将探索如何为持久层编写单元测试，以验证数据库操作的行为符合预期。\n\n## 持久层单元测试的重要性\n对持久层进行单元测试有助于确保：\n\
    1. 数据库操作（如插入、更新和删除数据）能够正常工作。\n2. 数据访问代码能够优雅地处理边界情况和错误条件。\n3. 数据库架构或 ORM 映射的更改不会破坏现有功能。\n\
    4. 业务逻辑以预期的方式与数据库交互。\n\n## 测试策略\n在测试持久层时，我们通常关注以下方面：\n1. CRUD 操作：测试我们是否可以从数据库创建、读取、更新和删除实体。\n\
    2. 错误处理：验证错误条件（如数据库连接失败或约束违反）是否被适当处理。\n3. 数据完整性：确保数据完整性约束（如外键关系或唯一性约束）得到执行。\n\
    4. 性能：衡量数据库操作的性能，以确保它们满足应用程序的需求。\n\n## 编写单元测试\n让我们为之前实现的 `PostRepository` 类编写单元测试：\n\
    \n```csharp\npublic class PostRepositoryTests\n{\n    private BlogDbContext _dbContext;\n\
    \    private IPostRepository _postRepository;\n    [SetUp]\n    public void Setup()\n\
    \    {\n        var options = new DbContextOptionsBuilder<BlogDbContext>().UseInMemoryDatabase(databaseName:\
    \ \"TestDatabase\").Options;\n        _dbContext = new BlogDbContext(options);\n\
    \        _postRepository = new PostRepository(_dbContext);\n    }\n    [Test]\n\
    \    public async Task AddPost_Should_Add_Post_To_Database()\n    {\n        //\
    \ Arrange\n        var post = new Post{\n            Title = \"Test Post\",\n\
    \            Content = \"This is a test post.\",\n            CreatedAt = DateTime.UtcNow,\n\
    \            UpdatedAt = DateTime.UtcNow\n        };\n        // Act\n       \
    \ await _postRepository.AddAsync(post);\n        // Assert\n        var result\
    \ = await _dbContext.Posts.FirstOrDefaultAsync(p => p.Title == \"Test Post\");\n\
    \        Assert.NotNull(result);\n        Assert.AreEqual(post.Title, result.Title);\n\
    \    }\n    // Write similar tests for other CRUD operations and error handling\
    \ scenarios\n}\n```\n\n在此段代码中：\n1. 我们使用 `NUnit` 作为测试框架，但你可以使用任何选择的测试框架。\n2. 在\
    \ `Setup` 方法中，我们为每个测试初始化了一个内存数据库上下文和仓库实例。\n3. 我们编写了一个测试来验证向数据库添加帖子是否符合预期。我们准备数据（Arrange），通过调用仓库方法执行（Act），然后断言结果（Assert）。\n\
    \n## 模拟依赖\n在为持久层编写单元测试时，通常会模拟外部依赖（例如数据库上下文），以隔离待测代码。我们可以使用 `Moq` 等模拟库来实现这一目的：\n\
    \n```csharp\npublic class PostRepositoryTests\n{\n    private Mock<BlogDbContext>\
    \ _dbContextMock;\n    private IPostRepository _postRepository;\n    [SetUp]\n\
    \    public void Setup()\n    {\n        _dbContextMock = new Mock<BlogDbContext>();\n\
    \        _postRepository = new PostRepository(_dbContextMock.Object);\n    }\n\
    \    [Test]\n    public async Task AddPost_Should_Add_Post_To_Database()\n   \
    \ {\n        // Arrange\n        var post = new Post{\n            Title = \"\
    Test Post\",\n            Content = \"This is a test post.\",\n            CreatedAt\
    \ = DateTime.UtcNow,\n            UpdatedAt = DateTime.UtcNow\n        };\n  \
    \      // Act\n        await _postRepository.AddAsync(post);\n        // Assert\n\
    \        _dbContextMock.Verify(m => m.Posts.AddAsync(post, default), Times.Once);\n\
    \        _dbContextMock.Verify(m => m.SaveChangesAsync(default), Times.Once);\n\
    \    }\n    // Write similar tests for other CRUD operations and error handling\
    \ scenarios\n}\n```\n\n在此段代码中：\n1. 我们使用 `Moq` 创建 `BlogDbContext` 的模拟实例。\n2. 在测试方法中，我们准备数据，通过调用仓库方法执行，然后断言模拟对象上的适当方法已被调用。\n"
- fmt: "\nUnit testing the persistence layer is essential for ensuring reliable data\
    \ handling in software applications. By writing unit tests for CRUD operations,\
    \ error handling scenarios, and data integrity constraints, we can verify that\
    \ database operations behave as expected and handle edge cases gracefully. Additionally,\
    \ by using mocking libraries to isolate dependencies, we can focus on testing\
    \ the code logic without relying on external resources. Overall, unit testing\
    \ the persistence layer enhances the reliability and maintainability of the application.\n\
    \n# Chapter 9: Clean Architecture with ASP.NET Core MVC 6\n\n## ASP.NET Core MVC\
    \ 6 as the Presentation Layer in Clean Architecture\nImplementing ASP.NET Core\
    \ MVC 6 as the presentation layer in a clean architecture approach using C# 10\
    \ and .NET 6 is a powerful combination for building robust and maintainable web\
    \ applications. In this guide, we'll explore how to structure and integrate ASP.NET\
    \ Core MVC 6 into a clean architecture solution.\n\n### Overview of Clean Architecture\n\
    Clean Architecture is a software design pattern that emphasizes separation of\
    \ concerns and independence of frameworks and external dependencies. It consists\
    \ of multiple layers, including: \n1. **Presentation Layer**: Handles user interaction\
    \ and displays information to the user.\n2. **Application Layer**: Contains application-specific\
    \ business logic and orchestrates interactions between the presentation and domain\
    \ layers.\n3. **Domain Layer**: Contains core business logic and entities.\n4.\
    \ **Infrastructure Layer**: Implements external concerns such as database access,\
    \ external services, and logging.\n\n### Integrating ASP.NET Core MVC 6\nLet's\
    \ start by setting up ASP.NET Core MVC 6 in our clean architecture solution:\n\
    1. Create a new ASP.NET Core Web Application project:\n```bash\ndotnet new web\
    \ -n MyApp.Web\n```\n2. Add a reference to the domain layer:\n```bash\ndotnet\
    \ add reference ../MyApp.Domain/MyApp.Domain.csproj\n```\n3. Add a reference to\
    \ the application layer:\n```bash\ndotnet add reference ../MyApp.Application/MyApp.Application.csproj\n\
    ```\n\n### Structuring the Presentation Layer\nIn a clean architecture solution,\
    \ the presentation layer is responsible for handling user requests, rendering\
    \ views, and interacting with the application layer. Let's structure the presentation\
    \ layer accordingly:\n```\nMyApp.Web/\n├── Controllers/\n│   └── HomeController.cs\n\
    ├── Views/\n│   └── Home/\n│       └── Index.cshtml\n└── Startup.cs\n```\n```####\
    \ Creating Controllers\nControllers in ASP.NET Core MVC 6 handle incoming HTTP\
    \ requests and execute the corresponding actions. Let's create a simple `HomeController`:\n\
    ```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\nnamespace\
    \ MyApp.Web.Controllers\n{\n    public class HomeController : Controller\n   \
    \ {\n        private readonly IPostService _postService;\n        public HomeController(IPostService\
    \ postService)\n        {\n            _postService = postService;\n        }\n\
    \        public IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n    }\n}\n```\n#### Defining Views\n\
    Views in ASP.NET Core MVC 6 are responsible for rendering HTML markup to the client.\
    \ Let's create a simple `Index` view to display a list of posts:\n```html\n<!--\
    \ Views/Home/Index.cshtml -->\n@model List<MyApp.Domain.Post>\n<h1>Posts</h1>\n\
    <ul>\n    @foreach (var post in Model)\n    {\n        <li>@post.Title</li>\n\
    \    }\n</ul>\n```\n#### Configuring Dependency Injection\nIn ASP.NET Core MVC\
    \ 6, we can configure dependency injection in the `Startup` class. Let's register\
    \ services from the application layer:\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.AspNetCore.Hosting;\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\nnamespace MyApp.Web\n{\n    public class Startup\n \
    \   {\n        public void ConfigureServices(IServiceCollection services)\n  \
    \      {\n            services.AddControllersWithViews();\n            // Register\
    \ application services\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n        public void Configure(IApplicationBuilder app, IWebHostEnvironment\
    \ env)\n        {\n            if (env.IsDevelopment())\n            {\n     \
    \           app.UseDeveloperExceptionPage();\n            }\n            app.UseStaticFiles();\n\
    \            app.UseRouting();\n            app.UseEndpoints(endpoints =>\n  \
    \          {\n                endpoints.MapControllerRoute(name: \"default\",\
    \ pattern: \"{controller=Home}/{action=Index}/{id?}\");\n            });\n   \
    \     }\n    }\n}\n```\n\nIntegrating ASP.NET Core MVC 6 into a clean architecture\
    \ solution provides a solid foundation for building modern web applications. By\
    \ structuring the presentation layer with controllers and views, and configuring\
    \ dependency injection in the `Startup` class, we ensure separation of concerns\
    \ and maintainability of the codebase. Additionally, leveraging the clean architecture\
    \ principles allows us to easily swap out components or scale the application\
    \ as needed, while keeping the core business logic independent of external frameworks\
    \ and libraries.\n\n## Consuming the Business Logic Layer from ASP.NET Core MVC\
    \ Controllers\nConsuming the business logic layer from ASP.NET Core MVC controllers\
    \ is a critical aspect of building robust web applications that adhere to clean\
    \ architecture principles using C# 10 and .NET 6. In this guide, we'll explore\
    \ how to integrate and consume the application layer, which contains the business\
    \ logic, from MVC controllers.\n\n### Overview of Clean Architecture\nClean Architecture\
    \ emphasizes separation of concerns and independence of external frameworks. It\
    \ consists of multiple layers, including:\n1. **Presentation Layer**: Handles\
    \ user interaction and displays information to the user.\n2. **Application Layer**:\
    \ Contains application-specific business logic and orchestrates interactions between\
    \ the presentation and domain layers.\n3. **Domain Layer**: Contains core business\
    \ logic and entities.\n4. **Infrastructure Layer**: Implements external concerns\
    \ such as database access, external services, and logging.\n\n### Integrating\
    \ Business Logic Layer\nLet's integrate the application layer, which contains\
    \ the business logic, into the ASP.NET Core MVC project:\n1. Reference the application\
    \ layer project in the ASP.NET Core MVC project:\n```bash\ndotnet add reference\
    \ ../MyApp.Application/MyApp.Application.csproj\n```\n\n#### Consuming Business\
    \ Logic from Controllers\nMVC controllers in ASP.NET Core are responsible for\
    \ handling incoming HTTP requests and invoking the appropriate methods from the\
    \ application layer. Let's create a controller and consume the business logic:\n\
    ```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing MyApp.Application;\nnamespace\
    \ MyApp.Web.Controllers\n{\n    public class PostController : Controller\n   \
    \ {\n        private readonly IPostService _postService;\n        public PostController(IPostService\
    \ postService)\n        {\n            _postService = postService;\n        }\n\
    \        public IActionResult Index()\n        {\n            var posts = _postService.GetAllPosts();\n\
    \            return View(posts);\n        }\n        public IActionResult Details(int\
    \ id)\n        {\n            var post = _postService.GetPostById(id);\n     \
    \       if (post == null)\n            {\n                return NotFound();\n\
    \            }\n            return View(post);\n        }\n        // Other controller\
    \ actions for CRUD operations\n    }\n}\n```\nIn this code:\n1. We inject an instance\
    \ of the `IPostService` interface into the controller's constructor using dependency\
    \ injection.\n2. In the `Index` action, we call the `GetAllPosts` method of the\
    \ `IPostService` to retrieve all posts and pass them to the view.\n3. In the `Details`\
    \ action, we call the `GetPostById` method of the `IPostService` to retrieve a\
    \ specific post by ID and pass it to the view.\n\n#### Configuring Dependency\
    \ Injection\nTo ensure that ASP.NET Core MVC controllers can resolve dependencies\
    \ from the application layer, we need to configure dependency injection in the\
    \ `Startup` class:\n```csharp\nusing Microsoft.Extensions.DependencyInjection;\n\
    using MyApp.Application;\nnamespace MyApp.Web\n{\n    public class Startup\n \
    \   {\n        public void ConfigureServices(IServiceCollection services)\n  \
    \      {\n            services.AddControllersWithViews();\n            // Register\
    \ application services\n            services.AddScoped<IPostService, PostService>();\n\
    \        }\n        // Other configuration methods\n    }\n}\n```\nIn the `ConfigureServices`\
    \ method, we register the `IPostService` interface and its implementation (`PostService`)\
    \ as scoped services. This allows ASP.NET Core to create a new instance per request\
    \ and inject it.\n\nConsuming the business logic layer from ASP.NET Core MVC controllers\
    \ is essential for building maintainable applications. By injecting dependencies\
    \ from the application layer into controllers, we ensure separation of concerns\
    \ and maintenance. Additionally, adhering to clean architecture principles creates\
    \ a clear and structured architecture.\n"
