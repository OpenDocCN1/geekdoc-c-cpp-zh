    we decode the byte as a duration. When we hit a duration byte, we pause for the
    given number of video frames (i.e. duration/60 sec) keeping whatever notes are
    playing.


    ```

    const byte music_score[] = {

    0x2c, // note 44

    0x81, // duration 1

    0x0d, // note 13

    0x8d, // duration 13

    0x2e, // note 46

    0x2f, // note 47

    0x86, // duration 6

