    pcx2will.py - Converts a PCX bitmap file to a sprite definition for Williams games.


    # 30.3 Sound Tools


    mknotes.py - Finds the best base frequency for a given range of notes, then generates
    a table of period values for the PSG.

    midi2song.py - Converts a MIDI file to a song file, as described in Chapter 19.


    Most of the above tools have an example of their usage – look at the Makefile
    in each tools/<platform> directory.


    # 30.4 Third-Party Tools


    You may find third party tools useful for asset creation.

    Gimp - The standard Linux graphics editor.


    8x Pixel ROM Font Editor - A Windows editor for 8x8 bitmap fonts. Assembler exporter
    code that could be massaged into C arrays.


    https://www.min.at/prinz/o/software/pixelfont/


    Turaco - An older DOS program that can edit ROMs of many different arcade platforms,
    including Galaxian-format graphics ROMs. The DOS version runs under the DOSBox
    emulator; there is also a command-line version (turacol) that builds on multiple
    platforms.


    http://umllama.com/projects/turaco/


    Allegro Sprite Editor (aseprite) - A popular pixel editor. An older free version
    (0.9.5) is available for download; it’s also in the aseprite package on Ubuntu.


    https://www.aseprite.org/older-versions/


    # 30.5 Free Art


    https://opengameart.org/ has many freely-licensed sprite files. Search for “8x8”
    or “16x16” to find results.'
