    \nMidway 8080 平台产生 RST $08 和 RST $10 指令，因此我们必须确保有两个中断程序，一个从地址 $08 开始，另一个从 $10\
    \ 开始。\n\n我们的 C 编译器的棘手之处在于它与汇编器不同，它不允许我们为程序设置特定地址。但只要稍留心，我们可以编写程序让它们对齐到正确的位置。\n\
