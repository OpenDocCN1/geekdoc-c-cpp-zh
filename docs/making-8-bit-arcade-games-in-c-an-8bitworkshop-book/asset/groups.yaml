    \ (color set)\n  _at (0x5000) vcolumns[32];n\n```\n\n(In portrait orientation,\
    \ the columns are rotated 90 degrees, they are actually horizontal rows. But we\
    \ call them columns anyway.)\n\nThe scroll byte moves an entire column of tiles\
