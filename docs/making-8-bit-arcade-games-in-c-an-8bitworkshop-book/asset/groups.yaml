    # 7.2. Main Function


    We use memset to fill the entire players array with zeroes, which is an easy way
    to set all the fields of the player objects to zero. Then we set the fields that
    we want to be non-zero, like the head_attr and tail_attr fields. Player 1''s avatar
    will be a “1” and player 2 will be a “2.” (Our game universe is very literal!)


    We need a function to play a “round” of the game, which mean until one of the
    players hits something. We define play_round:


    ```

    void play_round() {

    reset_players();

    clrscr();

    draw_playfield();

    while (1) { // loop indefinitely

    make_move();

    // exit loop if either player collided with something

    if (players[0].collided || players[1].collided) break;

    }

    flash_colliders();

    }

    ```


    Note the while (1) loop. The while keyword loops as long as its condition in parenthesis
    evaluates to true. Its condition is just 1, which means it''ll loop forever. Fortunately,
    we have the break keyword, which immediately exits the current loop. So we exit
    the loop when either player collides with something:


    if (players[0].collided || players[1].collided) break;


    Let''s go through the play_round() function. First, reset_players sets the initial
    position of the two players at the start of the round, and the initial direction
    of movement:


    ```

    void reset_players() {

    players[0].x = players[0].y = 6;

    players[0].dir = D_RIGHT;

    players[1].x = players[1].y = 21;

    players[1].dir = D_LEFT;

    players[0].collided = players[1].collided = 0;

    }

    ```


    We define the four cardinal directions using an enum typedef, which is a handy
    way of declaring constants:


