    \ | 7654 | 3210 |\n| 05 | 7654 | 3210 | 7654 | 3210 | 7654 | 3210 |\n| 06 | 7654\
    \ | 3210 | 7654 | 3210 | 7654 | 3210 |\n| 07 | 7654 | 3210 | 7654 | 3210 | 7654\
    \ | 3210 |\n\nFigure 26.2: Williams frame buffer pixel layout\n\nIf the colors\
    \ are given separately, it can be done via bit-masking:\n\n```\nbyte pixels =\
    \ 0;\npixels |= (left_color << 4); // set left pixel\npixels |= (right_color &\
    \ 0xf); // set right pixel\nvidmem[x][y] = pixels; // write to video memory\n\
    ```\n\nSetting an individual pixel already on the screen without affecting its\
    \ neighbor is more complicated due to bank-switching. You'd have to locate your\
    \ function in the upper ROM segment so you could safely read from the frame buffer.\
    \ It would be just easy to use the bit blender chip for this, as we'll explain\
    \ later.\n\n## 26.5 Palette\n\nEach of the 16 palette entries contains a single\
    \ byte, mapped to RGB values like so:\n\n```\nBit 76543210\nColor BBGGGRRR\n```\n\
    \nThey live in a 16-byte array starting at address $C000:\n\n```\nbyte __at (0xc000)\
    \ palette[16];\n```\n\nYou can convert separate red, green, and blue values (each\
    \ 0-255) to a palette entry by shifting and masking bits:\n\n```\ninline void\
    \ set_palette_rgb(byte i, byte red, byte green, byte\nblue) {\n  byte n = 0;\n\
    \  n |= red >> 5;\n  n |= (green >> 2) & 0x38;\n  n |= blue & 0x0c;\n  pal[i]\
    \ = n;\n}\n```\n\nAs an inline function, this won't take very much code at all\
    \ if all parameters are constant values. To make it even simpler, you could pass\
    \ a single word where each digit is an RGB component (all digits from 0-7 except\
    \ blue, which is 0-3):\n\n```\ninline void set_palette(byte i, word rgb) {\n \
    \ byte n = 0;\n  n |= (rgb >> 8) & 0x77;\n  n |= (rgb >> 1) & 0x38;\n  n |= (rgb\
    \ << 6) & 0x0c;\n  palette[i] = n;\n}\n```\n\n```\nset_palette(0, 0x000); // black\n\
    set_palette(1, 0x700); // red\nset_palette(2, 0x773); // white\n```\n\nYou could\
    \ even use a macro — the format is identical to the Galax palette entries described\
    \ in Chapter 17:\n\n```\n#define PE(r,g,b) ((r)|((g)<<3)|((b)<<6))\n```\n\n##\
    \ 26.6 Bit Blitter\n\nTo use the blitter, you must first program all of its registers\
    \ (there are only six) and write to the flags register last. This gives the “go”\
    \ signal to the blitter. The CPU is halted, the blitter performs its task, and\
    \ then the CPU is released.\n\n## 26.6. Bit Blitter\n\nHere is the basic process\
    \ for performing a blit:\n\n- 1. Set the width and height of the rectangle to\
    \ be blitted. Each value is a byte, so the upper limit of each is 255. There is\
    \ a special hack in the chip that makes a height of 255 act like 256, making it\
    \ easier to draw a shape the entire height of the screen.\n- 2. There is also\
    \ a bug in early Williams hardware that inverts the 3rd bit of the width and height\
    \ registers. We've kept this bug, so instead of setting the register to width,\
    \ you have to set it to width^4.\n- 3. Set the source address (sstart), which\
    \ tells the blitter where to copy from. (Solid rectangles can omit this.) For\
    \ sprites, you'd probably point to an array in ROM.\n- 4. Set the destination\
    \ address (dstart), which tells the blitter where to copy to. Usually this is\
    \ somewhere within the frame buffer RAM.\n- 5. Set the solid color, if the SOLID\
    \ flag is set. Since there are two pixels per byte, this value represents the\
    \ colors of two side-by-side pixels, making it easy to draw vertical patterns.\n\
    - 6. Set the appropriate flags, which also starts the blitter. There are eight\
    \ flags:\n    - SRCSCREEN: Set if the source is the video frame buffer. This should\
    \ not be set when copying sprites from ROM — the blitter will then read bytes\
    \ in row-major order (i.e., bytes are laid out row-by-row).\n    - DSTSCREEN:\
    \ If the destination is the video frame buffer. This should generally be set when\
    \ copying from the screen, otherwise the blitter will write pixels sequentially,\
    \ which, because of the video buffer layout, will smear pixels down the screen\
    \ (might be useful for special effects!).\n    - SYNC: Also known as the SLOW\
    \ flag. This must be set when making a RAM-to-RAM transfer, otherwise the video\
    \ signal generator and the blitter chip will step on each other (technically known\
    \ as “bus contention”) and corrupt the data.\n\n## 26.6. Bit Blitter\n\n- FGONLY:\
    \ Foreground Only. If set, any pixels with value 0 are not written. This makes\
    \ it easy to do transparency\n- SOLID: Before writing to memory, the blitter replaces\
    \ the data with a fixed color (two-pixel byte). If used in tandem with transparency,\
    \ this can be used to draw text or single-color sprites.\n- RSHIFT: If set, shifts\
    \ the source data one pixel to the right. Since every byte holds two pixels (4\
    \ bits each) this is useful for drawing a rectangle starting at an odd-numbered\
    \ X coordinate.\n- EVENONLY: Only draw pixels with even X-coordinates (the upper\
    \ 4 bits of each byte). Can be used to draw individual pixels.\n- ODDONLY: Only\
    \ draw pixels with odd X-coordinates (the lower 4 bits of each byte).\n\n```\n\
    blitter flags\n#define SRCSCREEN 0x1\n#define DSTSCREEN 0x2\n#define SYNC 0x4\n\
    #define FGONLY 0x8\n#define SOLID 0x10\n#define RSHIFT 0x20\n#define EVENONLY\
    \ 0x40\n#define ODDONLY 0x80\n```\n\n```\nstruct {\n    byte flags;     // flags\
    \ and 'go' signal\n    byte solid;     // solid color (both nibbles)\n    word\
    \ start;     // source address\n    word start;      // destination address\n\
    \    byte width;     // width of rectangle\n    byte height;    // height of rectangle\n\
    } __at (0xca00) blitter;\n```\n\nFor ease of use, we've written some functions\
    \ to perform blitter operations. First is a function to fill a rectangle with\
    \ a solid color:\n\n```\n// x1: 0-151\n// y1: 0-255\ninline void blit_solid(byte\
    \ x1, byte y1, byte w, byte h, byte color) {\n  blitter.width = w*4;\n  blitter.height\
    \ = h*4;\n  blitter.start = (x1<<1)+y1*256; // swapped\n  blitter.solid = color;\n\
    \  blitter.flags = DSTSCREEN|SOLID;\n}\n```\n\nFor most of these functions, our\
    \ X coordinate is byte-aligned, i.e., it ranges from 0 to 155 and addresses even\
    \ pixels. This is an acceptable compromise in some cases; in other cases, you'll\
    \ want the full range of X coordinates. The 6809 CPU has big-endian order by default,\
    \ means the most significant byte comes first. The Z80 is little-endian, and our\
    \ emulator uses byte ordering so we have to swap the two bytes before writing\
