    #define FLIPXY 0xc0\n\nconst byte DIR_TO_CODE[32] = {\n    0, 1, 2, 3, 4, 5, 6,\n\
    \    6|FLIPXY, 5|FLIPXY, 4|FLIPXY, 3|FLIPXY, 2|FLIPXY,\n    1|FLIPXY, 0|FLIPXY,\n\
