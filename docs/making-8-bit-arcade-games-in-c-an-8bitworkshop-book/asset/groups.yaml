    \ dx, byte dy) {\ntextbox_sum = 0;\nmul6(dx,dx);\nmul6(dy,dy);\nreturn textbox_sum;\
    \ // dx^2 + dy^2\n}\n```\n\nNote that we first convert coordinates from 16-bit\
