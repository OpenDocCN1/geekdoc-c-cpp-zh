    Most of the sounds you hear in Williams games come from Eugene Jarvis, who developed
    the “Gwave” sound system while working on pinball games:


    Actually I started working with the Williams sound board on the pin Laser Ball.
    On this game the memory was only 512 bytes for all program and data. It was this
    extreme memory crunch that inspired the Gwave wave table synthesizer. By storing
    a waveform (sine, square, triangle, etc.) in 64 bytes, and then a frequency table
    of 10-20 bytes, a sound could be characterized by a few bytes...I was stunned
    to find out that the most brilliant sounds were often created by typing in random
    numbers for the parafeters. 11


    The Williams sound boards have their own Motorola 6800 CPU, attached to an 8-bit
    DAC (digital-to-analog-converter). The CPU shapes the waveform by changing the
    output of the DAC. The timing of the CPU determines the tone and frequency of
    the sound.'
  - "[PAGE 205]\n\n# 29.1 The SWAVE System\n\n> To see it on 8bitworkshop.com: Select\
    \ the Williams Sound (Z80) platform, then select the Wavetable Synth file.\n\n\
    We're going to make our primitive wavetable synthesizer in C. A wavetable is just\
    \ an array of amplitude samples that we cycle through at varying frequencies to\
    \ produce tones. The wavetable is responsible for the texture of the sound, or\
    \ more technically, its spectrum.\n\nOur synth is not identical to the Williams\
    \ synth, since it uses a Motorola 6800, and we'll use an emulated Z80. But the\
    \ concept is the same.\n\nThe sound CPU has only two I/O ports, one in and one\
    \ out:\n\n```\n// command byte in\nconst __sfr __at (0x0) command;\n\n// output\
    \ sample to D/A converter\n__sfr __at (0x0) dac;\n```\n\nThe main routine starts\
    \ by looking at the command port. If it's 0, we just zero out the DAC and HALT\
    \ the CPU.\n\nSoundEffect e;\n\n```\nvoid main() {\n    if (command == 0) { dac\
    \ = 0; HALT; }\n    memcpy(&e, &SOUNDS[command], sizeof(e));\n    play();\n  \
    \  HALT;\n}\n```\n\nThe HALT macro is inline assembly, and just generates the\
    \ Z80 HALT instruction:\n\n```\n#define HALT __asm halt __endam;\n```"
  - "[PAGE 206]\n\n# 29.1. The SWAVE System\n\nAll of our sound generator's state\
    \ will live in the SoundEffect struct:\n\n```\ntypedef struct {\n    word duration;\
    \      // duration of sound\n    word offset;        // starting offset\n    word\
    \ delta;         // increments offset\n    int delta;          // increments delta\n\
    \    byte* wavetable;    // pointer to wavetable\n    byte wavemask;      // mask\
    \ for wavetable\n    signed char lfo;   // increments deltainc\n} SoundEffect;\n\
    ```\n\nThe heart of the sound generator is the sample routine. This looks up a\
    \ single sample in the wavetable based on the offset variable, then increments\
    \ with the delta parameter:\n\n```\nvoid sample() {\n    byte val = e.wavetable[(byte)(e.offset\
    \ >> 8) & e.wavemask);\n    if (val <= volume) dac = val; // output sample, if\
    \ <= volume\n    e.offset += e.delta;\n}\n```\n\nOur play routine loads the appropriate\
    \ wavetable pointer into the wav variable, then loops until duration decrements\
    \ to zero. We call sample eight times in the loop — this is sometimes called unrolling\
    \ the loop.\n\n```\nvoid play() {\n    wav wav = &WAVES[e.wavetable];\n    while\
    \ (e.duration--) {\n        sample();\n        sample();\n        sample();\n\
    \        sample();\n        sample();\n        sample();\n        sample();\n\
    \        sample();\n        e.delta += e.deltainc;\n        e.deltainc += e.lfo;\n\
    \        // taper off volume near end of sound\n        if (e.duration <= 0xff)\
    \ volume = e.duration;\n    }\n}\n```"
  - '[PAGE 207]


    # 29.2. Triggering Sounds from the Main CPU


    An advantage of unrolling the loop is that we update slow-moving values like duration
    and delta less often, effectively increasing their precision.


    # 29.2 Triggering Sounds from the Main CPU


    When the main CPU wants to play a new sound, it sends a single byte command to
    the sound board over its PIA (peripheral interface adapter) port. This immediately
    resets the sound CPU, and its sound program can now read the byte and figure out
    what to do. (This is why in Williams games you never more than one sound at a
    time!)


    ```

    byte __at(0xc08e) sound_pia; // sound PIA

    sound_pia = 0x3f; // prepare sound board

    sound_pia = sound_command; // send sound command

    ```


    Some sounds are more important than others, Williams games have a priority system
    where lower-priority sounds are squelched until higher-priority sounds have finished
    playing. The CPU can keep a table of durations to estimate how long a particular
    sound should play before it can be interrupted.


    > In the 8bitworkshop emulator, the sound ROM must be placed at a certain location
    at memory. The emulator will detect and load it into the virtual sound board.


    const byte __at(0x9000) SOUND_ROM[] = {

    0db, 0x00, 0xb7, 0x20, 0x01, 0x76, 0x11 ....

    };


    To download the ROM, go to the "Williams Sound (Z80)" target and select "Download
    ROM Image". There is an example of converting the ROM image to C array format
    in the williams/ directory of the 8bitworkshop Tools (see Chapter 30.)'
- md: '

    ## Importing Assets


    Writing games requires lots of assets, like bitmaps, fonts, and music scores.
    In the old days, this was done by drawing pixels on graph paper and building lists
    of bytes by hand. Fortunately, we now have better tools at our disposal (although
    the old way is straightforward!).


    The 8bitworkshop IDE is mainly about code, so we leave the graphics editing to
    better-suited tools. We''ve also written some conversion utilities of our own
    that''ll make it easier.


    ## 30.1 Installing 8bitworkshop Tools


    The 8bitworkshop Tools require Python 2.x and ImageMagick. Before downloading
    the tools themselves, you''ll want to get your environment ready. We''ve provided
    instructions for Ubuntu Linux and Windows 10.


    ### Installing 8BitWorkshop Tools on Ubuntu Linux


    - 1. First, install python, python-pip, and ImageMagick:


    ```bash

    $ sudo apt update

    $ sudo apt install python-pip imagemagick

    ```


    - 2. If you plan to convert MIDI files, you''ll need the mido package. You can
    install this using the pip command:


    ```bash

    $ sudo pip install mido

    ```


    - 3. Next, download the tools:


    ```bash

    $ wget http://8bitworkshop.com/release/8bitworkshop-tools.tgz

    ```


    - 4. Extract the tools:


    ```bash

    $ tar -xzvf 8bitworkshop-tools.tgz

    ```


    - 5. The tools will be extracted to the 8bitworkshop-tools directory. Type the
    following to move into the directory and list its contents:


    ```bash

    $ cd 8bitworkshop-tools && ls

    ```


    - 6. To see example usage of the tools, move into each directory and run make;
    for example:


    ```bash

    $ cd williams && make

    ```


    ### Installing 8BitWorkshop Tools on Windows


    Windows 10 provides a Linux-based subsystem (running Ubuntu) you can download
    and use 8bitworkshop tools.


    - 1. Open Settings, select Update and Security, select For Developers, enable
    the Developer Mode radio button.

    - 2. When prompted, select Yes.

    - 3. After installation is complete, open the Control Panel, select Programs and,
    under Programs and Features, select Turn Windows Features On or Off.

    - 4. Scroll down to Windows Subsystem for Linux (beta), enable its checkbox, then
    click OK.

    - 5. You’ll prompted to reboot your computer. Reboot, and after it restarts, type
    bash in your search field and Bash will open. You’ll have to wait several minutes
    for it to install and unpack itself.

    - 6. When prompted, enter a new username and password for your Linux account on
    your system.

    - 7. Install python and ImageMagick:


    ```bash

    $ sudo apt install python python-pip imagemagick

    ```


    - 8. If you plan to convert MIDI files, install mido:


    ```bash

    $ sudo pip install mido

    ```


    - 9. By default, when you first connect to the Windows Linux-based subsystem,
    you’re placed in the System32 directory. We don’t want to put our tools there,
    so let’s move back to our home directory:


    ```bash

    $ cd ~/

    ```


    - 10. Next, download the tools:


    ```bash

    $ wget http://8bitworkshop.com/release/8bitworkshop-tools.tgz

    ```


    - 11. Extract the tools:


    ```bash

    $ tar -xzvf 8bitworkshop-tools.tgz

    ```


    - 12. The tools will be extracted to the 8bitworkshop-tools directory. Type the
    following to move into the directory and list its contents:


    ```bash

    $ cd 8bitworkshop-tools && ls

    ```


    - 13. To see example usage of the tools, move into each directory and run make;
    for example:


    ```bash

    $ cd williams && make

    ```


    ### Installing 8BitWorkshop Tools on Mac OS


    Python is installed on MacOS by default, but you will want to install ImageMagick,
    and if you’re planning on editing MIDI files, install mido. To install ImageMagick,
    you’ll want to download MacPorts if you don’t already have it installed on your
    system. (You can also use Homebrew.)


    - 1. Install Xcode. See https://guide.macports.org/#installing.xcode for full
    instructions specific to your MacOS version.

    - 2. Download and install the MacPorts binary. Links to binaries for each version
    of MacOS are available at https://www.macports.org/install.php

    - 3. Install ImageMagick:


    ```bash

    $ sudo port install ImageMagick

    ```

    - 4. If you plan to convert MIDI files, install mido:


    ```bash

    $ sudo pip install mido

    ```

    - 5. Next, download the tools:


    ```bash

    $ wget http://8bitworkshop.com/release/8bitworkshop-tools.tgz

    ```

    - 6. Extract the tools:


    ```bash

    $ tar -xzvf 8bitworkshop-tools.tgz

    ```


    - 7. The tools will be extracted to the 8bitworkshop-tools directory. The following
    to move into the directory and list its contents:


    ```bash

    $ cd 8bitworkshop-tools && ls

    ```


    - 8. To see example usage of the tools, move into each directory and run make;
    for example:


    ```bash

    $ cd williams && make

    ```


    ## 30.2 Graphics Tools


    - parsedf8.py - Converts a Bitmap Distribution Format (BDF) font file to be used
    in tile-based graphics. BDF fonts are not very common, but are used in X Windows.

    - parsedf4bit.py - Converts a BDF font to be used in Williams games.

    - pbm_to_c.py - Converts a Portable Bitmap (PBM) to a monochrome sprite format
    for 8080 platform.

    - pcx2will.py - Converts a PCX bitmap file to a sprite definition for games.


    ## 30.3 Sound Tools


    - mknotes.py - Finds the best frequency for a given range of notes, then generates
    a table of period values for the PSG.

    - midi2song.py - Converts a MIDI file to a song, as described in Chapter 19.


    Most of the above tools have an example of their usage – look at the Makefile
    in each tools/<platform> directory.


    ## 30.4 Third-Party Tools


    You may find third party tools useful for asset creation.

    - Gimp - The standard Linux graphics editor.

    - 8bit Pixel Font Editor - A Windows editor for 8x bitmap fonts.

    - Turaco - An older DOS program that can edit ROMs of many different platforms,
    including Galaxian ROMs. The DOS version runs under the DOS emulator; there is
    also a command-line version (turacol) that builds on multiple platforms.

    - Allegro Sprite Editor - A popular pixel editor. An older free version (0.9.5)
    is available for download; it’s also in the aseprite package on Ubuntu.


    ## 30.5 Free Art


    https://opengameart.org/ has many freely-licensed sprite files. Search for “8x8”
    or “16x16” to find results.


    ## 30.6 Using 8bitworkshop Offline


    You can use 8bitworkshop IDE offline, too. Just download the latest release from
    here. Unpack it, then open the index.html file in Firefox and start editing. All
    code changes will be persisted to your browser’s local storage, so clearing your
    browser’s cache or resetting it may clear them. Make sure to save your edited
    files elsewhere.


    ## 31 Distributing Your Game


    Now that you''ve put hours of work into designing, developing, playtesting, and
    tweaking your game, it''s time to share it with the world!


    In the 8bitworkshop IDE, choose the “Share File” menu item to generate a shareable
    web link. Anyone opening this link will see the source code and will be able to
    play the emulated game in the browser. (Note: this will publish your source code
    to the Internet.)


    ### 31.1 Making ROM Files


    For certain platforms, you can also play your game on arcade game emulators like
    MAME. For non-Z80 platforms you would have to develop your game in assembly —
    a topic outside the scope of this book, although the IDE has 6502 and 6809 assemblers.


    | Platform | 8bitworkshop ID | MAME driver | Language |

    | :--- | :--- | :--- | :--- |

    | VIC Dual | vicual | carnival | C/Z80 asm |

    | Galaxian | galaxian | galaxian | C/Z80 asm |

    | Scramble | galaxian-scramble | scramble | C/Z80 asm |

    | Atari B&W Vector | vector-atar | asteroid | 6502 ASM |

    | Atari Color Vector | vector-articolor | bwidow | 6502 ASM |

    | Williams | williams | robotron | 6809 ASM |


    Table 31.1: MAME support for 8bitworkshop platforms


    ### 31.2 Playing on Actual Hardware


    Choose the “Download ROM Image” menu item to download a ROM image of your compiled
    game.


    To convert it into a MAME archive, first go into the 8bitworkshop-tools directory
    we downloaded in Chapter 30 for your target platform:


    ```bash

    $ cd vicdual

    $ python rom_carnival.py [your rom image]

    ```


    ```bash

    $ cd scramble

    $ python rom_scramble.py [your rom image]

    ```


    This will split your ROM image into individual ROM files, producing a ZIP file
    to be used in MAME. You can start MAME from the command line, using the -rompath
    setting to tell it where to find your ZIP file, e.g.:


    ```bash

    wine mame64.exe -window -rompath ~/8bitworkshop-tools/scramble/ scramble

    ```


    It will complain about “wrong checksums” – that’s good, that means it found your
    custom ROM file! Remember that the sound boards are not faithfully reproduced
    in the 8bitworkshop emulator, so you probably won’t have sound unless you went
    above and beyond.


    If you’re lucky enough to have a functional arcade cabinet, you could (in theory)
    replace its ROMs with your own game. This is also outside the scope of this book
    (we haven’t tried it!) but we’ll go over some possibilities.


    The most straightforward technique is to get an EPROM Eraser and an EPROM Programmer,
    burn your own EPROMs, and replace the ones in the arcade PCB. You can often replace
    all of the separate ROMs with a single EPROM (there are instructions for several
    machines at http://cambridgearcade.dyndns.org/).

    '
