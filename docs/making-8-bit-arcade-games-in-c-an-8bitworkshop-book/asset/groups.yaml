    \ RAM 的顶端，你可能会在耗尽内存之前遇到栈损坏。\n- **悬空指针**：你可能在仍有指向该对象的指针时 `free()` 掉该对象。这通常会导致问题，特别是当被释放的对象空间被其他对象重用时。\n\
    \n如果我们有一个动态增长和收缩的对象列表，我们可能想要使用链表。\n\n链表是由指针链接的对象链。每个对象指向序列中的下一个对象，最后一个对象指向 `NULL`。（`NULL`\
    \ 指针是一个表示“没有指向任何项”的特殊值，它它通常是值 0。确保你没有想要指向地址 `0x0` 的内容！）\n\n要遍历链表中的所有对象：从指向第一个对象的指针开始（该指针是单独保留的），然后沿着每个对象中的“next”\
    \ 指针移动，直到得到一个 `NULL`。你将访问列表中的每个对象。\n\n例如，我们可以将此应用到所有 Actor：\n\n```c\nActor a =\
    \ first_actor;\nwhile (a != NULL) {\n    draw(a);\n    a = a->next;\n}\n```\n\
    （注：OCR 文本在 while 循环中是碎片化的，我根据标准的 C 模式和提供的片段重构了逻辑）\n\n"
