    # 1.4 Integer Overflow and Arithmetic


    Since the numbers we deal with in 8-bit CPUs are so small, integer overflow is
    a thing we''ll have to deal with often.


    When you add two numbers, the CPU adds just like you by hand, but by binary. Each
    binary digit is added, and if you have to carry the 1 (which only happens when
    adding the bits 1 and 1) you carry it to the next bit. Example:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---||}{

    | Byte A + | 1 | 0 | 1 | 0 | 0 | 1 | 0 | 1 |

    | Byte B + | 1 | 0 | 1 | 1 | 0 | 1 | 1 | 0 |

    | Carry | 1 | 1 | | | | | | |

    | = | | 0 | 1 | 0 | 1 | 1 | 0 | 1 |


    Table 1.1: Binary Addition of Two Bytes With Carry


    What happens to that extra carry? We only have 8 bits in a byte, the result of
    the addition is truncated to 8 bits. We also call this an *integer overflow*.
    The carry bit is retained in the CPU''s Carry flag, and could be used by future
    calculations or just discarded.


    An unsigned byte can only represent the values 0 to 255, so if $a + b >= 256$
    then the 8-bit result is $(a + b) \mod 256$ (mod is the modulus operator, which
    is basically the remainder of a division.) For 16-bit unsigned numbers, it''d
    be $(a + b) \mod2^{16}$ (65536).


    The overflow behavior actually makes subtractions work. The number -1 can be expressed
    as the signed byte $\$FF$ (255). The result of $a + 255$ is $(a + 255) \mod 256$,
    which is the same as adding -1 to $a$.


