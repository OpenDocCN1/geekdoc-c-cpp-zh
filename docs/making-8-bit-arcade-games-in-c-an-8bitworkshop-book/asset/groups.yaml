    The routine that animates the player's explosion (or \"de-rez\" as we'll call\
    \ it) is kinda neat. We want to pretend the player's ship teleported out of existence,\
    \ and use XOR heavily:\n\n```c\nvoid destroy_player() {\n  // animate the derez\
    \ pattern with XOR (1st time)\n  xor_player.derez();\n  // XOR the player's ship,\
