    \ that the CPU can execute directly. It does this by combining your compiled object\
    \ files with external libraries, and applying fixups to unresolved addresses that\
    \ they point to the correct final memory locations.\n\nNote that we have two unresolved\
    \ addresses, ___str_0 and _printf. The first identifier is an internal reference,\
    \ which the linker easily resolves:\n\n```\n0000 21 09 00 [10] 58 ld hl,#__str_0\n\
    ```\n\nThe second identifier, _printf, is an external library function. The linker\
