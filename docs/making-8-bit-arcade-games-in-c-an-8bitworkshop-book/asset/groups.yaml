    # 25.4 Operator Precedence


    Grade-school children learn about the operator precedence of addition versus multiplication
    — for example, multiplication takes precedence over addition, 1+2*3 = 1+(2*3).


    C has a whole bunch of operator precedence rules, which are often learned through
    making mistakes. There are also operator associativity rules, which determines
    if expressions are grouped from right-to-left or left-to-right.


    There''s an almost-complete list of operators, with highest precedence at the
    top and lowest at the bottom:


    | Primary operators | left-to-right |

    | --- | --- |

    | Unary operators | right-to-left |

    | f() a.b->b x++ ++! ! -x (type) * &o | left-to-right |

    | * / % Multiply/divide/mod | left-to-right |

    | + Add/subtract | left-to-right |

    | << >> Shift | left-to-right |

    | < <= > >= Relational | left-to-right |

    | == != Equality | left-to-right |

    | & | Bitwise | left-to-right |

    | && ^ || Logical | left-to-right |

    | ? : Conditional | left-to-left |

    | = += etc. Assignment | right-to-left |

    | , Comma operator | left-to-right |


    Some general tips:


    +   * When used, use parenthesis.

    * Be especially careful when mixing bit operations with comparisons. a & b ==
    1 is parsed as a & (b == 1) which is probably not what you intended.'
