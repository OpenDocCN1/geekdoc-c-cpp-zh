    # 2.5 Logical Operations


    The "logical" instructions combine the bits of two operands, performing a bit
    (logic) operation on each:


    | AND | A & B | Set bit if A and B are set. |

    | OR | A | B | Set bit if A or B (or both) are set. |

    | XOR | A ~ B | Set bit if either A or B are set, but not both (exclusive-or).
    |


    For example, let''s AND a byte variable with the constant $1F:


    ```

    xpos &= 0x1f;

    ```


    For AND, if a bit was set in both the A register and the operand, it''ll be set
    in A after the instruction executes. Let''s say xpos is initially $75:


    ```

    $75 01110101

    $1F 00011111

    ----------------

    $15 00010101

    ```


    The AND operation is useful for limiting the range of a value. For example, AND
    #$1F is the same as (A mod 32), and the result will have a range of 0 to 31.


    What if we did an OR instead?


    ```

    xpos |= 0x1f;

    ```


    OR sets bits if they are set in either A or the operand, i.e. unless they are
    clear in both.'
