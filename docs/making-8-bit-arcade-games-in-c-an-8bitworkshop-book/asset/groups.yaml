    \n```\n// assumes test_x and test_y\nActor* test_collisions(Actor* a) {\n  while\
    \ (a) {\n    if ((byte)(test_x - a->y + 16) < 32 &&\n        (byte)(test_x - a->x\
    \ + 16) < 32 &&\n        test_pixels(a)) {\n        return a; // collision found!\n\
    \    }\n    a = a->next;\n  }\n  return NULL; // collision found\n}\n```\n\nAny\
