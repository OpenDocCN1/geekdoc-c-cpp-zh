    # 12.6. Pixel-Accurate Sprite Shifting


    The Midway 8080 boards also included a chip, the Fujitsu MB14241, which could
    arguably be called the first GPU (Graph-ics Processor Unit) included in a video
    game.


    Its operation was quite simple: It had an internal 16-bit register that the CPU
    could set, and it would return a shifted 8-bit quantity at any bit offset within
    that register. Since the 8080 didn''t have a barrel shifter (i.e., it could only
    shift by one bit per instruction) this would allow sprites to be easily drawn
    at any X coordinate, not just at 8 pixel intervals. Not all games used the chip,
    however.


    Every time the bitshift_value register is written, the 16-bit register is shifted
    right 8 bits, making room for the new bit which is put in the upper 8 bits:


    ```

    XXXXXXXXYYYYYYY

    ------->

    new byte old byte

    ```


    Reading from bitshift_read returns an 8-bit window of this 16-bit register, shifted
    by the number of bits set in the bitshift_offset register:


    ```

    XXXXXXXXYYYYYYY

    <---> offset = 5

    new byte old byte

    ```


    The variables are declared as I/O ports using __sfr:


    +   - __sfr __at (0x2) bitshift_offset;

    - __sfr __at (0x4) bitshift_value;

    volatile __sfr __at (0x3) bitshift_read;


    The volatile keyword tells the C optimizer that a variable may change unexpectedly,
    and not to assume that a previous value that was read can be reused in later expressions.
    Since bitshift_read changes as a result of a write to bitshift_value, it needs
