    \ the struct as an incomplete type before the struct is defined. If you need to\
    \ use the struct name as part of other typedefs, this will prevent \"incompatible\
    \ type\" errors:\n\n```\ntypedef struct Actor; // incomplete type\n// ...other\
    \ typedefs go here...\ntypef struct Actor { // complete type\n    // define fields\
    \ ...\n```\n\n# 23.3 Drawing Actors\n\nDrawing an actor requires several instructions.\
    \ First we center the beam in the middle of the screen:\n\nCNTR();\n\nNow we change\
    \ to screen scale so we can move the beam to the center of the actor. The value\
    \ $2C0 covers pretty much the entire screen:\n\nSCAL(0x2c0); // screen scale\n\
    \nThen we move the beam to the actor's center. The actor's X/Y coordinates are\
    \ 16-bit, but we only have 13 bits of precision in the VCTR command, so we shift\
    \ each coordinate right by 3 bits (16-3 == 13):\n\n```\nVCTR(a->xx >> 3, a->yy\
    \ >> 3, 0); // actor center\n```\n\nNow we convert to object scale to draw the\
    \ actor. Having two separate scales lets us make individual actors larger and\
    \ smaller:\n\n```\nSCAL(a->scale); // object scale\n```"
- md: "\n## 23.4. Moving Actors\n\nEach actor also has its own color and intensity:\n\
    \n```\nSTAT(a->color, a->intensity);\n```\n\nNow we draw the shape, based on the\
    \ actor's current angle. The angshift member is set based on how many shapes are\
    \ prerendered — for example, for 32 shapes you'd have an angshift of 3 (256 >>\
    \ 3 == 32). Then simply extract the correct shape's address from the shapes array\
    \ and output the JSRL (Jump to Subroutine) opcode:\n\n```\nJSRL(a->shapes[a->angle\
    \ >> a->angshift]);\n```\n\n## 23.4 Moving Actors\n\nOur game follows the law\
    \ of inertia — an object in motion remains in motion until a force is applied.\
    \ We keep the current fixed-point velocity of an actor in velx and vely, and update\
    \ the position frame by adding the velocity to each component:\n\n```c\nvoid move_actor(Actor*\
    \ a) {\n  a->xx += a->velx;\n  a->yy += a->vely;\n}\n```\n\nxx and yy are ints,\
    \ so they wrap around at $7FFF (32767) -$8000 (-32768).\n\nTo apply thrust to\
    \ the player's ship, we compute the sin and cosine of the ship's angle, then add\
    \ them to a player's velocity:\n\n```c\nvoid thrust_ship() {\n  sbyte sin = isin(curship->angle);\n\
    \  sbyte cos = icos(curship->angle);\n  curship->velx += sin>>3; // divide by\
    \ 8\n  curship->vely += cos>>3; // divide by 8\n}\n```\n\nAdditionally, the player's\
