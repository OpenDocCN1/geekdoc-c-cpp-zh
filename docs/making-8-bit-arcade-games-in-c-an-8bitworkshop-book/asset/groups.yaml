    # 6.5. Typedefs


    You can write to the palette like any other variable:


    palette = 1; // set palette 1


    The palette switch takes place immediately; the video generator uses the new palette
    from that point forward. This can be used for cool "lighting" effects that flash
    the screen.


    The palette data is contained in a 32-byte PROM (Programmable Read-Only Memory)
    which we''ve mapped in our emulator ROM to address $4000. An example:


    ```

    #define PE (fg, bg) ((fg)<5) | ((bg)<1)

    ```


    ```

    const byte _at (0x4000) color_prom[32] = {

    PE(7,0), PE(3,0), PE(1,0), PE(3,0), PE(6,0), PE(2,0), PE(2,0), PE(6,0),

    PE(1,0), PE(2,0), PE(3,0), PE(4,0), PE(5,0), PE(6,0), PE(7,0), PE(0,7),

    PE(7,0), PE(7,0), PE(7,0), PE(7,0), PE(3,0), PE(3,0), PE(3,0), PE(3,0),

    PE(7,0), PE(7,0), PE(7,0), PE(7,0), PE(7,0), PE(7,0), PE(7,0), PE(7,0),

    };

    ```


    Each palette entry contains the foreground color in bits 5-7, and the background
    color in bits 1-3. To help put the bits in the right places, we defined a preprocessor
    macro PE(fg, bg) that builds each palette entry at compile time.


    (That macro is tricky, but you may have seen | (bitwise or) in a previous chapter).
    << means "shift left" — we''ll cover in a later chapter.)


    # 6.5 Typedefs


    typedef type name;


    Defines name as an alias for the type definition type.


    All C compilers have built-in primitive types to represent integers. The char
    type is usually 8 bits wide, but the other types vary depending on compiler.'
