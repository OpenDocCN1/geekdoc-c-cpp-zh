    # 3.3. Linker


    0003 E5 [11] 59 push hl


    Now we call the _printf function, which does its business and returns. It places
    a return value on the stack, which we''ve ignored in the C code — but the compiler
    knows it''s there, so it does a pop to get rid of it:


    ```

    0004 CD ?? ?? [17] 60 call _printf

    0007 F1 [10] 61 pop af

    ```


    Now we''ve reached the end of our main function, and we return with the ret instruction:


    ```

    0008 C9 [10] 62 ret where''s __str_0 label defined?

    ```


    One more thing we forgot — the compiler defined it right after the function, and
    defined the bytes of our "HELLO WORLD" string, to:


    ```

    0009 63 __str_0:

    0009 48 45 4C 4C 4F 20 64 .ascii "HELLO WORLD"

    57 4F 52 52 4C 44 0014 00 45 .db 0x00

    ```


    Note the 0x00 at the end of the string; this is called a null-terminated or C-style
    string. C functions generally recognize that a zero signals the end of a string.
    Unfortunately, this means you can''t use a zero value as part of a string, but
    that doesn''t usually come in textual data.


    # 3.3 Linker


    The assembler spits out another bunch of files, the most important being object
    code for our C source file. This contains the bytes of the Z80 machine code, plus
    some extra stuff to help the linker. so the object code is relocatable, meaning
    it can run at


    > ¹On a system like UNIX, this would return control to the command prompt. On
    an arcade game, you''d probably loop forever inside main().'
  - '[PAGE 34]


    any location in memory. After the linker runs, all code will be fixed to a particular
    location.


    The linker’s job is to output a ROM-ready code image that the CPU can execute
    directly. It does this by combining your compiled object files with external libraries,
    and applying fixups to unresolved addresses that they point to the correct final
    memory locations.


    Note that we have two unresolved addresses, ___str_0 and _printf. The first identifier
    is an internal reference, which the linker easily resolves:


    ```

    0000 21 09 00 [10] 58 ld hl,#__ __str_0

    ```


    The second identifier, _printf, is an external library function. The linker has
    to look up the identifier in an external file (included with the compiler) and
    include the function in the final image, as well as all of the functions on which
    it depends. Sometimes this can be an awful lot of code!


    Here’s our final code listing with all the fixups applied:


    ```

    0000 56 _main::

    0000 21 09 00 [10] 58 ld hl,#__str_0

    0003 E5 [11] 59 push hl

    0004 41 00 [17] 60 call _printf

    0007 F1 [10] 61 pop af

    0008 C9 [10] 62 ret

    0009 63 ___str_0:

    0009 48 45 4A 4C 4F 20 64 .ascii "HELLO WORLD"

    57 4F 52 4C 44

    0014 00 65 .db 0x00

    ```


    You may even pull in external functions without realizing it. For example, the
    Z280 has no multiplication or division instruction, so the C compiler uses external
    library routines. The same goes for any floating point operations.'
  - '[PAGE 35]


    # 3.4 ROM Image


    The final ROM image is just the sequence of bytes output by the assembler. On
    the Z80, the ROM image is usually loaded at address 0, since that''s where the
    CPU starts executing code after a reset.


    > Note: This Example Doesn''t Work (Yet!)


    This example won''t work out-of-the-box in our Z80 IDE, because our system is
    a bit more stripped-down than your standard C compiler. We''d have to add a couple
    of extra things:


    Standard I/O functions: Although printf is defined in the standard library, there''s
    no definition for the putchar function which it uses to output characters. We''ll
    have to define putchar for the particular display device on our target platform.


    Stack pointer initialization: When the CPU is reset, it sets the Program Counter
    (PC) register to 0. This corresponds to the beginning of our main function, so
    it will begin executing immediately. There''s one small problem: the Stack Pointer
    (SP) register has not yet been set, so when we push/pop values to the stack, the
    CPU will probably not be addressing a valid region of RAM. This is why most C
    compilers don''t start at main, but run an entry routine first to set things up.
    We''ll describe this in a future chapter.'
