    Then we create our game objects, the obstacles, and the player ship:


    ```

    create_obstacles(5);

    new.player_ship();

    ```


    Now our main game loop starts. We''ll loop until there is exactly one actor in
    the actor list, which means we''ve cleared all of the obstacles and only the player''s
    ship remains (and there are no more বাড়িতে, torpedoes, etc.):


    ```

    while (!just_one_actor.left()) {

    ```


    This function is pretty simple:


    ```

    byte_just_one_actor.left() {

    return first_actor && first_actor->next == NULL;

    }

    ```


    This function also demonstrates short-circuit evaluation of logical operators
    like && || || in C. Logical expressions are evaluated left-to-right, and if the
    left part is false, the right part is never evaluated at all. This is why we check
    first_actor on the left side — to protect the right side from potentially evaluating
    a null pointer and crashing the program (it wouldn''t crash on a Z80, because
    there''s no memory protection, but you''d get a nonsensical result).


    In our main loop, we first reset the DVG write pointer to start a new vector program.
    We then call control_player to read the player''s inputs and control the ship,
    then draw_and_update_actors to draw, move, and process all of the actors:


    ```

    dvgreset();

    control_player();

    draw_and_update_actors();

    ```'
  - '[PAGE 176]


    # 23.10. The Main Loop


    Now we do a CNTR to center the vector beam before we write our final HALT instruction
    — a good practice to avoid stressing out the virtual magnets in the virtual CRT.
    Then we call dvgstart to tell the DVG to start processing vectors:


    ```

    CNTR();

    HALT();

    dvgstart();

    ```


    While we''re waiting for the DVG, we remove any actors that got flagged as “removed”
    in the update step:


    ```

    remove_expired_actors();

    ```


    Then we update the frame counter and pet the watchdog:


    ```

    frame++;

    watchdog = 0;

    ```


    Since our loop takes a variable number of CPU cycles depending on the number of
    objects, we need a way to keep our video frame rate consistent. There''s no VSYNC
    signal in a vector monitor, but in our emulator, we''ve added a simple hardware
    counter (vidframe) that increments every 1/60 second, counting from 0 to 3 and
    wrapping back to 0.


    We already have an internal counter, frame, so to limit our frame rate we just
    spin the CPU as long as the first two bits of frame are equal to the hardware
    counter (vidframe):


    ```

    while (vidframe) == (frame & 0x3)) {

    ```


    As long the game loop takes less than 1/60 second, the loop will stay in sync
    with the counter. But if our loop takes longer than that, the counter will go
    out of sync and take four iterations to catch up again. (This is similar to how
    we did it in Chapter 18.)'
