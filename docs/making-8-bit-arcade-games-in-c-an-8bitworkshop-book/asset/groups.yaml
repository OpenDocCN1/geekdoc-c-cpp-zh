    }\n```\n\nWe also have an AI player. It's very simple, almost simpler than the\
    \ human player. The computer player just looks ahead one space, and turns to the\
    \ right if anything is there other than a blank space:\n\n```\nvoid ai_control(byte\
    \ p) {\n    byte x,y;\n    Direction dir = players[p].dir;\n    x = players[p].x\
    \ + DIR_X[dir];\n    y = players[p].y + DIR_Y[dir];\n    if (getchar(x,y) != CHAR('\
    \ ')) {\n        players[p].dir = (dir + 1) & 3;\n    }\n}\n```\n\nThe (dir +\
    \ 1) turns to the right, since our directions are in clockwise order. The & is\
    \ a bitwise AND operation — it only keeps the bits that are in both operands.\
    \ In this context, it wraps the direction value to the range 0 to 3. This is often\
    \ called a bitmask.\n\nWe want some kind of reaction from the game when a player\
    \ collides, so flash_colliders will provide:\n\n```\nvoid flash_colliders() {\n\
    \    byte i;\n    // players that collided\n    for (i=0; i<60; i++) {\n     \
    \   if (players[i].collided) {\n            // ... logic to flash ...\n      \
    \  }\n    }\n}\n```\n\n## 8.1. Shift Operations\n\nThe Z80 has a good variety\
    \ of shift and rotate instructions. The “shift” instructions move one position\
    \ left or right within a byte. The bit that is shifted off the edge gets into\
    \ the Carry flag. The “rotate” instructions shift the Carry flag into the other\
    \ end. For rotate left, the Carry flag is copied into the rightmost (low) bit.\
    \ For rotate right, it's copied into the leftmost (high) bit.\n\nTable 8.1: Shift\
    \ and rotate\n\n| Instruction | Operation | Description |\n|---|---|---|\n| SLA\
    \ | Shift Left | Shift left, moves high bit to Carry |\n| SRA | Shift Right (Arithmetic)\
    \ | Shift right, fills with sign bit |\n| RL | Rotate Left | 9-bit rotation, Carry\
    \ moves to low bit |\n| RR | Rotate Right | 9-bit rotation, Carry moves to high\
    \ bit |\n| RLC | Rotate Left (Logical) | Rotate left, moves high bit to Carry\
    \ |\n| RRC | Rotate Right (Logical) | Rotate right, moves low bit to Carry |\n\
    | RLD | Rotate Left (D) | Rotate 16-bit pair left |\n| RRD | Rotate Right (D)\
    \ | Rotate 16-bit pair right |\n\n## 8.1. Shift Operations (Continued)\n\n| expr\
    \ << n |\n| In C, compute expr shifted left by n bits. |\n\nLet's say we wanted\
    \ a function to double the player's score. We could accomplish this by shifting\
    \ left by 1 bit:\n\n```\nvoid double_score() {\n    score <<= 1;\n}\n```\n\nSince\
    \ score is a 16-bit variable, we need to first shift the low byte... nn (IY) addressing\
    \ mode computes the effective address as [IY + #nn], allowing us to address bytes\
    \ without explicitly incrementing I.\n"
  mdcn: "\n\n## 7.2. 主函数\n\ntypedef enum { D_RIGHT, D_DOWN, D_LEFT, D_UP } Direction;\n\
    \n这在实际上定义了以下常量：\n\n```\nD_RIGHT = 0\nD_DOWN = 1\nD_LEFT = 2\nD_UP = 3\n```\n\n\
    > C 语言风格注释：常量值和宏定义通常使用全大写字母。别担心，我们不是在对你大喊！\n\n游戏的核心是 `make_move()` 函数：\n\n```\n\
    void make_move() {\n  byte i;\n  // 延迟并读取控制输入\n  for (i=0; i<FRAMES_PER_MOVE;\
    \ i++) {\n    human_control(0);\n    wait_for_vsync();\n  }\n  // 决定电脑玩家的移动\n\
    \  ai_control(1);\n  // 移动第 2 个玩家\n  move_player(1);\n  // 移动第 1 个玩家\n  move_player(0);\n\
    }\n```\n\n`human_control` 和 `ai_control` 函数决定了玩家在下一次移动时将向哪个方向移动，而 `move_player`\
    \ 函数负责移动他们并检查碰撞。\n\n我们为什么要循环 `FRAMES_PER_MOVE` 次？这是一个控制游戏速度的延迟循环。每次迭代调用 `wait_for_vsync`（在上一节中描述）会等待直到新帧的开始。因此，每次迭代会暂停最多\
    \ 1/60 秒。\n\n由于我们在延迟循环中也调用了 `human_control`，因为我们想检测这段时间内发生的控制输入。每隔 0.0167 秒检查一次对于即使是操作最快的摇杆控高手来说也足够频繁了。该函数非常简单：\n\
    \n```\nvoid human_control(byte p) {\n  Direction dir = 0xff;\n  if (LEFT1) dir\
    \ = D_LEFT;\n  if (RIGHT1) dir = D_RIGHT;\n  if (UP1) dir = D_UP;\n  if (DOWN1)\
    \ dir = D_DOWN;\n  // 不让玩家反向\n  if (dir != 0xff && dir != (players[p].dir ^ 2))\
    \ {\n    players[p].dir = dir;\n  }\n}\n```\n\n我们声明了一个 `Direction` 类型的局部变量，首先将其设置为\
    \ `0xFF` 作为“无变化”的指示器（我们可以这样做，因为编译器将枚举类型处理为整数类型）。然后，我们使用之前定义的 `LEFT1`/`RIGHT1`/`UP1`/`DOWN1`\
    \ 宏来检查每个摇杆的方向输入。\n\n我们不希望玩家掉头反向移动，否则他们会立即撞击到自己的痕迹。如果我们正在向左移动，我们就想防止玩家向右移动。\n\n\
    这就是 `players[p].dir ^ 2` 表达式用用场。`^` 运算符是按位异或（XOR），它根据另一个操作数设置的位来翻转一个操作数的位。回到我们的方向常量，让我们看看它们的二进制表示以及它们如何响应异或操作：\n\
    \n```\nD_RIGHT = %00 ^ %10 = %10\nD_DOWN = %01 ^ %10 = %11\nD_LEFT = %10 ^ %10\
    \ = %00\nD_UP = %11 ^ %10 = %01\n```\n\n翻转第二位实际上给了我们反向的方向，然后我们可以检查它以确保我们不会向那个方向移动。\n\
    \n`move_player` 函数擦除玩家（用痕迹字符替换它）并沿当前方向移动一个方格。我们还想检查玩家是否与他们自己的痕迹或另一个玩家的痕迹发生了碰撞。\n\
    \n我们已经将两条痕迹都绘制到了屏幕上，所以我们只需要检查玩家所在的网格中是否有任何空白字符（我们使用 `getchar` 函数进行检查），如果是，我们就设置碰撞标记。只有在这种情况下……\n\
    \n*(注：原文后续部分似乎存在逻辑重复或断码的片段，已根据提供的原文内容进行对应翻译)*"
