    \    byte dy = abs(y1 - (a->yy >> 8)); // abs(y1-y2)\n    if (dx+dy < mindist)\
    \ { // check Manhattan distance\n        word dist2 = get_distance_squared(dx,\
    \ dy);\n        if (dist2 < mindist2) { // d^2 < mindist^2\n            if (fn)\
