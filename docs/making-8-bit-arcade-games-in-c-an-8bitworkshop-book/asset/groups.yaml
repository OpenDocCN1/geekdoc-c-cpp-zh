    # 5

    8bitworkshop C IDE


    在本章中，我们将讨论用于开发和测试游戏代码的工具。这些工具构成了我们的交互式开发环境，或者说 IDE。


    要启动 IDE，请在网络浏览器中访问 http://8bitworkshop.com/。为了获得最佳效果，请使用最新版本的 Google Chrome、Mozilla
    Firefox 或 Apple Safari。


    该 IDE 支持书中涵盖的所有街机平台。要在平台之间切换，请点击页面左上角的 Menu（菜单），从 Platform（平台）菜单中选择一个，如图 5.2 所示。


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_41_0.png)


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_42_0.png)

    图 5.2：IDE 平台菜单


    IDE 包含了几个示例程序。在菜单图标右侧，你可以访问下拉菜单，该菜单允许你选择要加载的文件，如图 5.3 所示。


    你可以随意地编辑这些文件——所有更改都会持久化在浏览器本地存储中，如果你关闭标签页并回来，它们仍然在那里。要重置并完全清除你的更改，请从菜单中选择 **Reset
    to Original**（还原原始）。


    要从头开始，请从菜单中选择 **New File**（新建文件）。输入新文件的名称，C 源文件通常使用“.c”扩展名。（你也可以使用“.asm”扩展名编写
    Z80 汇器代码。）


    | 最小示例 |

    |---|

    | 本地文件 ---- |

    | -----共享 ----- |

    | 章节 ---------- |

    | ✓ 最小示例 |

    | Hello World |

    | 图形测试 |

    | 音频测试 |

    | 贪蛇游戏 (原型)|

    | 贪蛇游戏 (完整版)|

    | 音乐示例 |


    图 5.3：IDE 下拉菜单


    要与其他分享文件，请从菜单中选择 Share File as GitHub Gist。这将文件上传到 GitHub 服务，然后显示一个你可以复制到剪贴板的链接。将此链接发送给其他人，他们就可以查看并运行你的源代码，并根据需要进行自己的本地更改。


    IDE 包含每个每个街机平台的模拟器，它在模拟机器上运行代码。要控制游戏，首先点击模拟器屏幕以获取焦点。键盘命令随游戏而异，但通常如下：


    - 方向键 - 移动

    - 空格键 - 射击

    - 5 - 投币

    - 1 - 开始游戏 (单人)

    - 2 - 开始游戏 (双人)


    另一个工具是 C 编译器。我们使用的是 SDCC，它也运行在网络浏览器中，并配有一个基于网页的文本编辑器。每当你对代码进行更改时，IDE 都会将其编译并将最终的
    ROM 镜像发送到模拟器，让你几乎立即看到代码更改。


    最后一个工具是一个简单的调试器，允许你逐步执行机器码指令、查看内存并启动和停止程序。屏幕顶部的按钮执行若干项调试功能：


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_43_0.png)


    - Reset (重置)：硬重置模拟器，然后单步到第一条指令。

    - Pause (暂停)：停止模拟器。

    - Run (运行)：暂停后恢复模拟器。

    - Step (单步)：执行下一条 CPU 指令，然后中断。

    - Run To (运行到)：在当前行（光标所在行）设置“断点”。当执行到达该指令时，模拟器将停止。


    ## 5.1. 调试窗口


    - Step Out of Subroutine (跳出子程序)：运行直到当前子程序返回，然后中断。

    - Step Backwards (后退)：后退单条 CPU 指令。


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_44_0.png)


    - Show Disassembly (显示汇编)：显示 C 源文件的编译汇编列表。

    - Show Memory (显示内存)：显示内存浏览器（见图 5.4）。

    - Show Profile (显示分析)：显示每行源代码的分析信息。


    每当 IDE 遇到断点或单步执行时，屏幕右下角会出现调试窗口。它显示了 CPU 的内部状态，包括所有寄存器和标志位。


    ```

    PC 0098 -Z-H-V--

    SP E7F7 IR 0070

    IX 0000 IY E417

    AF 0054 BC 0807

    DE E400 HL E7F9

    ```


    > 注意：IDE 正在活跃开发中，可能与我们描述的有所。源代码可在 https://github.com/sehugg/8bitworkshop 获取。


    ```

    E3E0 0A 05 02 01 80 40 20 10 08 04 42 21 90 48 24 92 _cellram

    E3F0 49 A4 D2 69 34 1A 0D 46 23 11 08 04 82 41 A0 D0 _cellram

    E400 0F 17 02 00 00 31 FE 60 09 0B 08 00 00 32 FE 00 _players

    E410 01 _atatstract

    E410 09 _frames_per_move

    E410 00 EF AD DE FD 9D credits

    ```


    图 5.4：内存浏览器


    ## 6

    ### VIC 硬件


    ### 6.1 历史


    1976 年，Lane Hauck 感到心心不焉。他在 Gremlin Industries 一忙弹球机和类似 Play Ball 和 Trapshoot
    这种“墙壁游戏”，并希望层进入视频游戏业务。


    他一直在研究一种名为 Blockade 的游戏，该游戏在屏幕上显示一个箭头。可以通过按键在四个方向上移动，并留下痕迹。玩家的目标是避开自己的痕迹和其他人的痕迹。在游戏发布后，Lane
    的游戏很快被其他人克隆——即 Midway 的作品。


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_45_0.png)


    ### 6.2 内存映射


    后来，该公司创建了基于 6502 处理器的 VIC-2。其内存映射如下：


    | 起始 | 结束 | 描述 |

    |---|---|---|

    | $0000 | $3FFF | ROM (16KB) |

    | $4000 | $7FFF | RAM (16KB) |

    | $8000 | $BFFF | I/O 和 RAM |

    | $C000 | $FFFF | RAM (4KB) |


    '
