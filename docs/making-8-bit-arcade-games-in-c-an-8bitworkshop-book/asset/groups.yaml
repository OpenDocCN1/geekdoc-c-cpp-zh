    For each quadrant (90-degree range) of the angle we can com-

    pute a different expression:


    ```

    sbyte isin(byte x) {

    switch (x>>6) {

    case 0: return sintbl[x];

    case 1: return sintbl[127-x];

    case 2: return -sintbl[x-128];

    case 3: return -sintbl[255-x];

    }

    }

    ```


    With some clever bit testing, we can optimize this routine

    further, reducing its compiled size from 103 bytes to 43 bytes:


    ```

    sbyte isin(byte x0) {

    byte x = x0;

    if (x0 & 0x40) x = 127-x;

    if (x0 & 0x80) {

    return -sintbl[x+128];

    } else {

    return sintbl[x];

    }

    }

    ```


    # 22.3 Wireframe Models


    Our shapes will be wireframe models — points connected by

    lines. They consist of a number of vertices, or 3D points,

    connected by a number of edges, or lines between vertices.


    ```

    typedef struct {

    byte numverts;

    const Vector8* verts; // array of vertices

    const sbyte* edges; // array of vertex indices (edges)

    } Wireframe;

    ```


    We represent the edges as a list of vertex indices, with two

    special values. When we want to turn the beam off, we use a

    value of -1 — the beam will start drawing with the next vertex

    index. A -2 marks the end of the list.'
  - '[PAGE 160]


    # 22.3. Wireframe Models


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_160_0.png)


    We''re going to use initializers to define the various parts of our Wireframe
    object in ROM. The following defines a simple tetrahedron pyramid with four vertices
    and six edges:


    ```

    const Vector8 tetra_v[] = =

    {0,-86,86},{86,86,86},{-86,86,86},{0,0,-86} };

    const char tetra_e[] = { 0, 1, 2, 0, 3, 1, -1, 3, 2, -2 };

    const Wireframe tetra = { 4, tetra_v, tetra_e };

    ```


    This is how you define complex objects in C. For tetra_e, we use an array initializer
    which defines an array of chars (signed bytes) but does not specify a length;
    the compiler takes up only as much space as is needed.


    For tetra_v, we define an array of struct initializers, which is why the {} brackets
    are nested. For example, {0,-86,86} defines the x, y, and z fields of a single
    Vector8 struct in the array.


    Note also the const keyword which tells the compiler to put the definitions in
    ROM.'
- md: "\n## 22.4 Transformation\n\nTo rotate a 3D coordinate using a matrix, we use\
    \ the following function:\n\n```c\nvoid vec_transform2(Vector16* dest, const Vector8*\
    \ v,\n    const Matrix* m) {\n    dest->x = v->x*m->m[0][0] + v->y*m->m[0][1]\
    \ + v->z*m->m[0][2];\n    dest->y = v->x*m->m[1][0] + v->y*m->m[1][1] + v->z*m->m[1][2];\n\
    \    dest->z = v->x*m->m[2][0] + v->y*m->m[2][1] + v->z*m->m[2][2];\n}\n```\n\n\
    We'll only use 3D coordinate values ranging from -86 to 86. Why? To avoid overflow\
    \ when doing calculations. For a 3D transform, we compute the sum of three multiplications\
    \ for each coordinate. Our matrix coefficients go up to 127, so 86 is the maximum\
    \ value we can have for our matrix until they overflow the 16-bit signed integer\
    \ (127*86*3 = 32766 < 32767).\n\nOur transform function is a pretty slow and bloated\
    \ routine. We can do a lot better using our custom emulated math hardware, which\
    \ we'll describe next.\n\n## 22.5 The Mult Box\n\nThe 6502 CPU does not have multiply\
    \ or divide instructions, which had to be emulated with software routines — this\
    \ is very slow.\n\nTo speed up 3D calculations, Atari vector games (starting with\
    \ Battlefield and Red Baron) used a custom circuit called the \"Math Box,\" built\
    \ around four AMD 2901 bitslice processors.¹¹ It could perform 16-bit multiplications,\
    \ and divisions much faster than the Z80 CPU.\n\nCinematronics games also used\
    \ these chips.\n\n> ¹The hard-wired CPU in Cinematronics\n\nOur emulator does\
    \ not model the Math Box precisely, but it has got something similar which we’ve\
    \ designed to be easy-to-use. We’ll call it “The Mult Box,” and it has these addresses:\n\
    \n| Address | Description |\n| :--- | :--- |\n| $8100-$8101 | 16-bit sum |\n|\
    \ $8102 | 8-bit multiplicand A |\n| $8103 | 8-bit multiplicand B |\n| $8104-$8105\
    \ | 16-bit dividend (sum / A) |\n| $810F | compute sum += A * B (strobe) |\n\n\
    To do a sum-of-products, first set the 16-bit value at $8100 to 0. For each product,\
    \ set $8102 to the first multiplicand and $8103 to the second multiplicand, then\
    \ strobe $810F. The multiplication will commence and the product will be added\
    \ to the 16-bit sum. When finished, read the 16-bit sum at $8100.\n\nThe Mult\
    \ Box also divides. Before we update sum, it computes the 16-bit dividend sum/A\
    \ and stores it at $8104.\n\nUsing the Mult Box, our transformation looks like\
    \ this:\n\n```c\ninline void mul16(byte a, sbyte b) {\n    mathbox_arg1 = a;\n\
    \    mathbox_arg2 = b;\n    mathbox_go_mul=0; // mathbox_sum += a * b\n}\n```\n\
    \n```c\nvoid vec_mat_transform(Vector16* dest, const Vector8* v, const Matrix*\
    \ m) {\n    byte i;\n    // copy a pointer to the first element of our destination\n\
    \    // vector, and a pointer to the first element of the matrix.\n    int* result\
    \ = &dest->x;\n    const signed char* mval = &m->m[0][0];\n    // loop over all\
    \ 3 vector elements (x, y, z)\n    for (i=0; i<3; i++) {\n        mathbox_sum\
    \ = 0; // reset sum to 0\n        mul16(*mval++, v->x);\n        mul16(*mval++,\
    \ v->y);\n        mul16(*mval++, v->z);\n        *result++ = mathbox_sum; // fetch\
    \ final sum, store\n    }\n}\n```\n\n## Game: Crowded Orbit\n\nNow we're going\
