    \  if (LEFT1) dir = D_LEFT;\n  if (RIGHT1) dir = D_RIGHT;\n  if (UP1) dir = D_UP;\n\
    \  if (DOWN1) dir = D_DOWN;\n  // don't let the player reverse\n  if (dir != 0xff\
    \ && dir != (players[p].dir ^ 2)) {\n    players[p].dir = dir;\n  }\n}\n```\n\n\
