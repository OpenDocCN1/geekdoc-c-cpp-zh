    # 6


    # # The VIC Dual Hardware


    # ## 6.1 History


    In 1976, Lane Hauck was getting restless. He had been working on pinball and “wall
    games” like Play Ball and Trapshoot at Gremlin Industries, and wanted management
    to get into the video game business.²


    He had been messing around with a game called Blockade that displayed an arrow
    on a screen. It could be moved in four directions by pressing switches, and left
    a trail behind it. The player’s goal was to avoid his own trail, and the trails
    of other players. After it was released, Lane’s game was quickly cloned by others
    — Midway’s Checkmate for example, which was cited as inspiration for the light
    cycle sequence in the 1982 Tron arcade game.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_45_0.png)


    34'
  - '[PAGE 46]


    # 6.2. Memory Map


    Later, the company would make Safari, which was based on the Z80 chip. After Gremlin''s
    merger with Sega, this “VIC Dual” architecture would be used for 20 or so games
    through 1981, perhaps the most familiar being Carnival. Also notable Head On,
    a car game which had players eating dots before PacMan arrived on the scene. All
    of these games had similar CPU and video circuits, but the sound board could be
    swapped out.


    The VIC Dual system is built around a Z80 running at 1.934 MHz with 8 KB of RAM,
    most of this shared by the video system.


    # 6.2 Memory Map


    | Start | End | Description |

    | $0000 | $3fff | ROM (16KB) |

    | $8000 | $837f | video RAM (cells) |

    | $8380 | $87ff | free RAM |

    | $8800 | $8ff | video RAM (tiles) |


    > Table 6.1: VIC Dual Memory Map


    The address decoder that selects RAM or ROM only looks at the highest bit, so
    all of the RAM address space is mirrored to $0000, $A000, $B000, $C000, up to
    $F000. Most 16KB VIC Dual systems also mirror the ROM at $4000-$7FFF.


    # 6.3 Video


    The VIC Dual’s video generator has more in common with the dumb terminals than
    later video games. It is based on cells and tiles. Think of cells as the rows
    and columns that determine which characters are displayed on your terminal, and
    tiles as the bitmaps for each character — although we can define the tiles to
    be any shape, not just letters and numbers.


    The video generator can display a 32x28 grid of cells — or 28x32, if the monitor
    was 90 degrees. Each cell is taken from one of 256 8x8 pixel bitmaps, also defined
    in RAM. Early boards only supported monochrome graphics, but later boards could
    output 8 different colors.'
  - '[PAGE 47]


    # 6.3. Video


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_47_0.png)


    Figure 6.2: VIC Dual Video Layout


    The layout of the cell grid is simple — rows and columns of bytes, each byte telling
    the video generator which of the 256 characters to use.


    > Since many games have their monitors rotated 90 degrees in either direction,
    talking about coordinates gets confusing.


    In this book, we refer to X and Y as the horizontal and vertical coordinates,
    independent of monitor rotation.


    When we use the U coordinate, it means going in the direction of the electron
    beam, along a scanline. When we use V, it means across scanlines, perpendicular
    to U.


    If the monitor is in landscape mode then U is horizontal, and V is vertical. In
    portrait mode (rotated) U is vertical and V is horizontal.'
