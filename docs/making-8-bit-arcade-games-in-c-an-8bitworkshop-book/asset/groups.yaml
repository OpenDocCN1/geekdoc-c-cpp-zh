  - "[PAGE 25]\n\n# 2.3. Flags and Branching\n\nThe branch instructions are also good\
    \ for writing loops. Let's say we wanted to count from 0 to 99, and to write each\
    \ value in sequence to an I/O port:\n\n```\nchar i;\nfor (i=0; i<100; i++) {\n\
    \    output_port = i;\n}\n```\n\nThe compiled output uses the LD and INC instructions,\
    \ and the OUT instruction to write to the I/O port. The SUB and JR instructions\
    \ are responsible for implementing the loop:\n\n```\n_write_loop:\n    ld d,#0x00\n\
    repeat:\n    ld a,d\n    out (_output_port),a    ; write to port\n    inc\n  \
    \  ld a,d\n    sub a,#0x64            ; set flags for (d-100)\n    jr C,repeat\
    \            ; if carry set, repeat\n    ret\n```\n\nThe loop variable is kept\
    \ in the D register. When it gets below 0x64 (100 decimal), the SUB instruction\
    \ will set the Carry flag. The following JR C,<label> instruction transfers control\
    \ back to the repeat label as long as the Carry flag is set. So as long as D is\
    \ below 100, the loop will repeat."
