    27.4. Clipping


    # 27.4 Clipping


    The blotter does not perform clipping (except on Sinistar, where the hardware
    supports an optional clipping window) so you can happily write past screen boundaries.
    Writing off the bottom side will wrap the sprite around to the top, shifted by
    one pixel. Writing off the right side, though, will probably chew up a bunch of
    your global variables.


    A proper implementation of clipping would involve computing the intersection of
    the sprite rectangle with the screen rectangle, and only drawing pixels in the
    intersection – similar to what we did for the pixel collision test.


    An easier solution is: Never write past the edges of the screen! In some places
    like the explosion rendering (draw_sprite_strided) we specifically prohibit writing
    past address $9000, just in case.


    # 27.5 Getting By With 8 Bits


    Our screen''s width is 304 pixels, but a single byte can only cover 256 values.
    We want pixel accuracy for smooth animation, but we also want good performance.
    What''s the compromise?


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_200_0.png)


    For performance reasons we decide to use 8-bit values for tracking objects'' X
    and Y coordinates. Since most shapes are about 16 pixels wide, and there''s a
    border around the screen, we only have 24 pixels to the side that are unused –
    we''ll put the scoreboard there.


    Our collision routine needs to be tweaked because computing the bounding box won''t
    work if a coordinate overflows past 255. We''ll handle this by clipping both X
    and Y coordinates to 255 (the right side and bottom side of the bounding box.)


