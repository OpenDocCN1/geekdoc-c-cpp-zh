  - "[PAGE 68]\n\n# 8\n\n# Shift and Rotate\n\n# 8.1 Shift Operations\n\nThe Z80 has\
    \ a good variety of shift and rotate instructions:\n\n| SLA | Shift Left | Shift\
    \ left 1 bit, bit 7 $\rightarrow$ Carry |\n|---|---|---|\n| SRL | Shift Right\
    \ (Logical) | Shift right 1 bit, bit 0 $\rightarrow$ Carry, 0 $\rightarrow$ bit\
    \ 7 |\n| SRA | Shift Right (Arithmetic) | Shift right 1 bit, bit 0 $\rightarrow$\
    \ Carry, 7 unchanged |\n| RL | Rotate Left | 9-bit rotation, Carry $\rightarrow$\
    \ bit 0 |\n| RR | Rotate Right | 9-bit rotation, Carry $\rightarrow$ bit 7 |\n\
    | RLC | Rotate thru Carry | 8-bit rotation, Carry $\rightarrow$ bit 0 |\n| RRC\
    \ | Rotate right | 8-bit rotation, Carry $\rightarrow$ bit 7 |\n| RLD | Rotate\
    \ Left (D) | 12-bit rotation, LSB=(HL), MSB=A |\n| RRD | Rotate Right (D) | 12-bit\
    \ rotation, LSB=(HL), MSB=A |\n\nTable 8.1: Shift and rotate instructions\n\n\
    The “shift” instructions move one position left or right within a byte. The bit\
    \ that is shifted off the edge of the byte (i.e. the high bit for shift left,\
    \ and the low bit for shift right) gets into the Carry flag.\n\nThe “rotate” instructions\
    \ shift the previous Carry flag into the other end of the byte. For rotate left,\
    \ the Carry flag is copied into the rightmost (low) bit. For rotate right, it's\
    \ copied into the leftmost (high) bit. The RL/RR instructions perform 9-bit rotation,\
    \ using the Carry flag as the 9th bit. The RLC/RRC instructions perform 8-bit\
    \ rotation, copying the shifted bit to the Carry flag."
