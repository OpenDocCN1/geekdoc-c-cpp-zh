    # The POKEY Sound Chip


    The POKEY (POtentiometer and KEYboard) is a proprietary sound and interface chip,
    first featured in the Atari home computers and the Battlezone and Asteroids Deluxe
    games. Atari manufactured three versions of the chip, a single-core version for
    home computers and consoles, and dual-core and quad-core POKEYs for arcade games.


    The POKEY chip was designed by Doug Neubauer, who also proved his software skills
    with Atari''s futuristic 3D space combat game Star Raiders. POKEY''s sound generator
    is an upgraded version of the one found on the Atari VCS/2600. Besides making
    sound, it could read paddle controllers and keyboards, handle serial communications,
    and generate random numbers.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_177_0.png)


    Figure 24.1: POKEY chip (by RodCastler, CC BY-SA 3.0)'
  - '[PAGE 178]


    # 24.1. Memory Map


    # 24.1 Memory Map


    | Offset | Name | Description |

    |---|---|--|

    | $00 | AUDF1 | Channel 1 Frequency |

    | $01 | AUDC1 | Channel 1 Control |

    | $02 | AUDF2 | Channel 2 Frequency |

    | $03 | AUDC2 | Channel 2 Control |

    | $04 | AUDF3 | Channel 3 Frequency |

    | $05 | AUDC3 | Channel 3 Control |

    | $06 | AUDF4 | Channel 4 Frequency |

    | $07 | AUDC4 | Channel 4 Control |

    | $08 | AUDCTL | Audio Control |

    | $0A | RANDOM | Random Number (read-only) |


    # 24.2 AUDCTL Bit Map


    The AUDCTL register configures global settings of the POKEY:


    | Bit | Description |

    |---|--|

    | 0 | Clock base (0=64 kHz, 1=15 kHz) |

    | 1 | Channel 2/4 high-pass filter |

    | 2 | Channel 1/3 high-pass filter |

    | 3 | Sync channels 4/3 |

    | 4 | Sync channels 2/1 |

    | 5 | Channel 3 clock 1.79 MHz |

    | 6 | Channel 1 clock 1.79 MHz |

    | 7 | Use 9-bit poly counter |


    The POKEY works by dividing the frequency of a common clock, just like the AY-3-8910
    we covered in Chapter 9. Whereas the 8910 has 12-bit divisors, the POKEY has selectable
    8-bit or bit-16 divisors. The 16-bit divisors are helpful for accurate musical
    pitches, and are configured by pairing two 8-bit channels.


    # 24.3 AUDUCx Bit Map


    Each of the 4 channels has its own AUDC register. The lower nibble of the AUDC
    register sets the 4-bit volume of the channel.'
- md: "\n## 24.4. Setting AUDF Frequency\n\nThe upper nibble selects the polynomial,\
    \ which controls the output waveform.\n\n| Hex | Bit # 76543210 | Description\
    \ | Period |\n|---|---|---|--|\n| XV | ....XXXX | Volume (0-15, 0=off) | noise\
    \ |\n| 0x | | 0000.... | 17-bit poly * 5-bit poly | 31 |\n| 2x | 0010.... | 5-bit\
    \ poly | 31 |\n| 4x | 0100.... | 4-bit poly * 5-bit poly | 31 |\n| 6x | 0110....\
    \ | 5-bit poly | 31 |\n| 8x | 1000.... | 17-bit poly | noise |\n| Ax | 1010....\
    \ | pure tone | 2 |\n| Cx | 1100.... | 4-bit poly | 15 |\n| 1x | xxx1.... | Waveform\
    \ mode | |\n\n## 24.4 Setting AUDF Frequency\n\nWhen using a pure tone, the output\
    \ frequency of each channel depends on the bits set in AUDCTL:\n\n| Frequency\
    \ | Condition |\n|---|--|\n| 64 kHz | AUDCTL bit 0 clear |\n| 15 kHz | AUDCTL\
    \ bit 0 set |\n| 1.79 MHz | AUDCTL bit 6 set (ch1) or bit 5 (ch3) |\n\nThe period\
    \ of each polynomial roughly determines the audible frequency of the tone, lower\
    \ periods having higher frequency.\n\nWhen Fclock is 64000 Hz or 15000 Hz, the\
    \ output frequency Fout is given by this equation:\n\n```\nFrequency = \\frac{Clock}{PolyPeriod\
    \ \\cdot (AUDF + 4)}\n```\n\nWhen using the 1.79 MHz clock:\n\n```\nFrequency\
    \ = \\frac{1790000}{PolyPeriod \\cdot (AUDF + 1)}\n```\n\nIf channels 1 and 2\
    \ are synced (with AUDCTL bit 4) then the output frequency for both channels is:\n\
    \n$Frequency = \\frac{Clock}{PolyPeriod \\cdot (AUDF2 \\cdot 256 + AUDF1 + 7)}$\n\
    \nIf channels 3 and 4 are synced then the output frequency is:\n\n$Frequency =\
    \ \\frac{Clock}{PolyPeriod \\cdot (AUDF4 \\cdot 256 + AUDF3 + 7)}$\n\n## 24.5\
    \ POKEY Music\n\nBy using two POKEYs and putting both pairs of channels into 16-bit\
    \ mode, you can play high-accuracy musical tones. The technique is similar to\
    \ that in Chapter 19.\n\n> To see it on 8bitworkshop.com: Select the Atari Color\
    \ Vector (Z80) platform, then select the POKEY Music file.\n\n## Miscellaneous\
    \ C Topics\n\nThere are a couple of advanced C topics we haven’t covered yet,\
    \ so we’ll talk about them here.\n\n## 25.1 Unions\n\nIn the upcoming chapters,\
    \ you may see the following inside of a type definition:\n\n```\nunion {\n   \
    \ struct { sbyte dx,dy; } laser; // laser direction\n    struct { byte exploding;\
    \ } enemy; // enemy exploding\n}\n```\n\nThis is called a union type, and it’s\
    \ similar to a struct except of its fields being contiguous in memory, all of\
    \ its fields overlap in memory. This conserves space for fields that don’t coexist.\n\
    \nIn the above example, lasers have a direction, and enemies explode, but we don’t\
    \ have objects that need both attributes at the same time. So we define a struct\
    \ for each object type and put them both in a union.\n\nThere is no check to see\
    \ if you are using the union properly, you could, for example, write to the laser\
    \ struct and read from the enemy struct. But you probably shouldn’t.\n\n## 25.2\
    \ Big Numbers\n\nYou can define a floating-point value with the float type:\n\n\
    ```\nfloat floatval = 123.45;\n```\n\nThey are stored as IEEE single-precision\
    \ floats, which take up 4 bytes of memory and range from $-10^{38}$ to $10^{38}$.\
    \ They only have 23 bits of precision, and are very slow to compute on 8-bit platforms,\
    \ so they are not very useful for 8-bit games.\n\nThe long type defines a 4 byte\
    \ (32-bit) integer type which can range from 0 to $2^{32} - 1$ (unsigned). All\
    \ of the examples in this book get just fine with 16-bit numbers — they’re faster\
    \ and use less memory.\n\n## 25.3 Advanced Loop Handling\n\nWe covered the break\
    \ keyword, which exits a loop, in Chapter 7. There is also a continue keyword\
    \ that restarts the loop. It can be used in for and while statements. For example:\n\
    \n```\nfor (i=0; i<100; i++) {\n  // enemy sleeping?) ignore them\n  if (enemy[i].is_sleeping)\
    \ continue;\n    ... process rest of energy\n}\n```\n\nThere is also a goto statement\
    \ that jumps to a label defined elsewhere in your program. This is useful for\
    \ breaking out of multiple nested loops, for example:\n\n```\nfor (i=0; i<10;\
    \ i++) {\n  for (j=0; j<10; j++) {\n    if (grid[i][j]) goto breakout; // break\
    \ out of the loop\n  }\n// this only executes if we’t break out of the loop\n\
    not_found();\nbreakout: // this is a label\n// continue\n```\n\n## 25.4 Operator\
    \ Precedence\n\nGrade-school children learn about the operator precedence of addition\
    \ versus multiplication — for example, multiplication takes precedence over addition,\
    \ 1+2*3 = 1+(2*3).\n\nC has a whole bunch of precedence rules, which are often\
    \ learned through making mistakes. There are also operator associativity, which\
    \ determines if expressions are grouped from right-to-left or left-to-right. There's\
    \ an almost complete list of operators, with highest at the top and lowest at\
    \ the bottom:\n\n| Operators | Associativity |\n|---|---|\n| Primary operators\
    \ | left-to-right |\n| Unary operators | right-to-left |\n| f(), a.b, x++, ! (type)\
    \ | left-to-right |\n| * / % Multiply/divide/mod | left-to-right |\n| + - Add/subtract\
    \ | left-to-right |\n| << Shift | left-to-right |\n| < <= Relational | left-to-right\
    \ |\n| == != Equality | left-to-right |\n| & Bitwise | left-to-right |\n| && ||\
    \ Logical | left-to-right |\n| ? Conditional | left-to-left |\n| = += Assignment\
    \ | right-to-left |\n| , Comma | left-to-right |\n\nSome general tips:\n\n- When\
    \ used, use parenthesis.\n- Be especially careful when mixing bit operations with\
    \ comparisons. a & b == 1 is parsed as a&(b == 1) which is probably what you intended.\n\
    \n## 26 Hardware\n\n### 26.1 History\n\nEugene Jarvis quit Hewlett-Packard to\
    \ make pinball games for Atari, then Williams Electronics hired him to make sound\
    \ for pinball machines. He used a Motorola 6800 CPU to make strange noises with\
    \ an 8-bit digital-analog converter (DAC). He would become lead designer for Williams’\
    \ first video game, called Defender. The Williams hardware team designed an elegant\
    \ architecture that left most of the power (and responsibility) in the software\
    \ developers’ hands. Defender uses a frame buffer — like Spaceaders but in full\
    \ color. The frame buffer is 304 by 256 pixels with 4 bits (16 colors) per pixel,\
    \ taking up 36 KB of memory — in 1980, that was a lot. Each of the 16 colors can\
    \ be chosen from a 256-color RGB palette.\n\n![](img/bbb7f6aa345981163fcfaffe7a93b0_184_0.png)\n\
    \n## 26.2 Memory Map\n\nLacking any sort of hardware acceleration, the Defender\
    \ developers achieved its lightning speed using pixel-sparse visuals and clever\
    \ tricks. For games like Joust and Robotron, Greg Wegner created a custom blitter.\
    \ This was a powerful 4 MHz coprocessor that could draw sprites and rectangles\
    \ to the frame buffer at astounding speeds for the time — moving almost 1 MB/sec\
    \ of data. Games like Robotron their massive sprite count. Called \"the Special\
    \ Chips,\" they worked as a pair, each chip handling 4 bits at a time (a single\
    \ pixel).\n\nDefender was one of the first video games to use the Motorola 6809\
    \ CPU. Many Williams games were written on a Motorola EXorciser, an early desktop\
    \ computer that could assemble 6800 and 6809 programs.\n\n> We adapted the emulator\
    \ to run the Williams architecture with the Z80. It runs the CPU at 4 MHz, a speed\
    \ available on the Z80 chips available in 1981.\n\n| Start | End | Description\
    \ | R/W |\n|---|---|---|---|\n| $0000 | $97FF | bankswitched (video RAM, program\
    \ ROM) | r/w |\n| $9800 | $BFFF | general-purpose RAM | r/w |\n| $C000 | $C00F\
    \ | video palette | write |\n| $C804 | $C807 | control inputs | read |\n| $C80C\
    \ | $C80F | control inputs | read |\n| $C900 | $C9FF | bank select | write |\n\
    | $CA00 | $CA07 | bit blitter | write |\n| $CB00 | | video counter | read |\n\
    | $CBFF | | watchdog | write |\n| $CC00 | $CFFF | NVRAM (diagnostics, high scores)\
    \ | r/w |\n| $D000 | $FFFF | ROM | read |\n\n## 26.3 Bankswitched RAM/ROM\n\n\
    The video frame buffer is so large that there's not much room left in the 16-bit\
    \ address space for ROM access. So, the RAM and ROM coexist at $0000-$97FF via\
    \ bank-switching. Writes always go to RAM, but reads can come from RAM or ROM\
    \ depending on the value of the bank-switching bit at $C900.\n\nReading from video\
    \ memory is infrequent, but can be useful for buffer-to-buffer copying and certain\
    \ detection routines.\n\n## 26.4 Video Frame Buffer\n\n> To see it on 8bitworkshop.com:\
    \ Select the Williams (Z80) platform, then select the Graphics Test file.\n\n\
    The Williams games' frame buffer is atypical; although the monitor is mounted\
    \ horizontally¹, and thus scanlines are horizontal, consecutive bytes in memory\
    \ go downward on the screen.\n\nEach byte contains two pixels — the upper four\
    \ bits on the left, and the lower four bits on the right. Each 4-bit pixel is\
    \ mapped to the 16-color palette.\n\nIt's defined in C as a 152 x 256 byte array:\n\
    \n```\nbyte __at (0x0) vidmem[152][256];\n```\n\nWriting both pixels in a byte\
    \ is pretty easy:\n\n```\nvidmem[x][y] = 0x77;\n```\n\n¹Except for Joust 2.\n"
  mdcn: "\n\n## 24.4. 设置 AUDF 频率\n\n高位四位选择多项式，该多项式控制输出波形。\n\n| 十进制 | 位 # 76543210\
    \ | 说明 | 周期 |\n|---|---|---|--|\n| XV | ....XXXX | 音量 (0-15, 0=关闭) | 噪声 |\n| 0x\
    \ | | 0000.... | 17位多项式 * 5位多项式 | 31 |\n| 2x | 0010.... | 5位多项式 | 31 |\n| 4x |\
    \ 0100.... | 4位多项式 * 5位多项式 | 31 |\n| 6x | 0110.... | 5位多项式 | 31 |\n| 8x | 1000....\
    \ | 17位多项式 | 噪声 |\n| Ax | 1010.... | 纯音 | 2 |\n| Cx | 1100.... | 4位多项式 | 15 |\n\
    | 1x | xxx1.... | 波形模式 | |\n\n## 24.4 设置 AUDF 频率\n\n在使用纯音时，每个通道的输出频率取决于 AUDCTL\
    \ 中设置的位：\n\n| 频率 | 条件 |\n|---|--|\n| 64 kHz | AUDCTL 位 0 清零 |\n| 15 kHz | AUDCTL\
    \ 位 0 置位 |\n| 1.79 MHz | AUDCTL 位 6 置位 (ch1) 或位 5 (ch3) |\n\n每个多项式的周期粗约决定了音调的可听频率，周期越小频率越高。\n\
    \n当 Fclock 为 64000 Hz 或 15000 Hz 时，输出频率 Fout 由此方程给出：\n\n```\nFrequency = \\frac{Clock}{PolyPeriod\
    \ \\cdot (AUDF + 4)}\n```\n\n当使用 1.79 MHz 时钟时：\n\n```\nFrequency = \\frac{1790000}{PolyPeriod\
    \ \\cdot (AUDF + 1)}\n```\n\n如果通道 1 和 2 同步（使用 AUDCTL 位 4），则两个通道的输出频率均为：\n\n$Frequency\
    \ = \\frac{Clock}{PolyPeriod \\cdot (AUDF2 \\cdot 256 + AUDF1 + 7)}$\n\n如果通道 3\
    \ 和 4 同步，则输出频率为：\n\n$Frequency = \\frac{Clock}{PolyPeriod \\cdot (AUDF4 \\cdot\
    \ 256 + AUDF3 + 7)}$\n\n## 24.5 POKEY 音乐\n\n通过使用两个 POKEY 并将对通道都设置为 16 位模式，你可以播放高精度的音乐音。这种技术类似于第\
    \ 19 章中的技术。\n\n> 要在 8bitworkshop.com 查看：选择 Atari Color Vector (Z80) 平台，然后选择 POKEY\
    \ Music 文件。\n\n## 其他 C语言主题\n\n我们还没有涵盖几个高级 C 语言，所以我们在这里讨论它们。\n\n## 25.1 联合体 (Unions)\n\
    \n在接下来的章节中，你可能会在类型定义中看到以下内容：\n\n```\nunion {\n    struct { sbyte dx,dy; } laser;\
    \ // 激光方向\n    struct { byte exploding; } enemy; // 敌人爆炸\n}\n```\n\n这被称为联合体类型，它与结构体相似，区别在于它的字段在内存中不是连续的，而是所有字段在内存中重叠。这为互不共存的字段节省了空间。\n\
    \n在上面的示例中，激光有方向，敌人会爆炸，但我们不需要同时具备这两个属性的对象。因此，我们为每个对象类型定义一个结构体，并将它们都放在一个联合体中。\n\n\
    并没有检查机制来判断你是否正确使用了联合体，例如，你可以向激光结构体写入数据并从敌人结构体读取数据。但你可能不应该这样做。\n\n## 25.2 大数\n\n\
    你可以使用 `float` 类型定义一个浮点值：\n\n```\nfloat floatval = 123.45;\n```\n\n它们被存储为 IEEE\
    \ 单精度浮点数，占用 4 字节内存，范围从 $-10^{38}$ 到 $10^{38}$。它们只有 23 位精度，且在 8 位平台上计算非常慢，因此对 8\
    \ 位游戏来说并不是很有用处。\n\n`long` 类型定义了一个 4 字节（32 位）整数类型，范围可以从 0 到 $2^{32} - 1$（无符号）。书中的所有示例在\
    \ 16 位数字上运行良好良好——它们更快且占用的内存更少。\n\n## 25.3 高级循环处理\n\n我们在第 7 章中涵盖了退出循环的 `break`\
    \ 关键字。还有一个 `continue` 关键字，它可以重启循环。它可以用于 `for` 和 `while` 语句。例如：\n\n```\nfor (i=0;\
    \ i<100; i++) {\n  // 敌人正在睡觉?) 忽略它们\n  if (enemy[i].is_sleeping) continue;\n \
    \   ... 处理剩余的能量\n}\n```\n\n还有一个 `goto` 语句，可以跳转到程序中其他地方定义的标签。这对于跳出多个嵌套循环非常有用，例如：\n\
    \n```\nfor (i=0; i<10; i++) {\n  for (j=0; j<10; j++) {\n    if (grid[i][j]) goto\
    \ breakout; // 跳出循环\n  }\n// 只有在没有跳出循环时才执行此处\nnot_found();\nbreakout: // 这是一个标签\n\
    // continue\n```\n\n## 25.4 运算符优先级\n\n学生们学习加法与乘法的优先级——例如，乘法的优先级高于加法，$1+2*3 = 1+(2*3)$。\n\
    \nC 有大量的优先级规则，通常通过出错来学习。还有运算符结合性，它决定表达式是从右到左还是从左到右分组。这里有一个几乎完整的运算符列表，优先级最高，最低在底部：\n\
    \n| 运算符 | 结合性 |\n|---|---|\n| 原始运算符 | 从左到右 |\n| 一元运算符 | 从右到左 |\n| f(), a.b, x++,\
    \ (type) | 从左到右 |\n| * / % 乘/除/取模 | 从左到右 |\n| + - 加/减 | 从左到右 |\n| << 移位 | 从左到右\
    \ |\n| < <= 关系运算符 | 从左到右 |\n| == != 等于/不等 | 从左到右 |\n| & 位与运算符 | 从左到右 |\n| && ||\
    \ 逻辑运算符 | 从左到右 |\n| ? 条件运算符 | 从右到左 |\n| = += 赋值 | 从右到左 |\n| , 逗号 | 从左到右 |\n\n\
    一些通用提示：\n\n- 使用时，使用括号。\n- 当位操作与比较混合时要格外小心，$a \\& b == 1$ 被解析为 $a \\& (b == 1)$，这可能是你想要的。\n\
    \n## 26 硬件\n\n### 26.1 历史\n\nEugene Jarvis 离开惠普为 Atari 制作弹机游戏，然后 Williams Electronics\
    \ 聘佣他制作弹机游戏。他使用 Motorola 6800 CPU 通过 8 位数模转换器 (DAC) 制作奇怪的声音。\n\n为 Williams 第一款视频游戏《Defender》设计的硬件团队设计了一种优雅的架构，将大部分权力（和责任）留给了软件开发者。《Defender》使用了缓冲区——类似于\
    \ Spaceaders，但是是全色的。缓冲区是 304 x 256 像素，每个像素 4 位（16 色色），占用 36 KB 内存——在 1980 年这很大。16\
    \ 种颜色可以从 256 色 RGB 调色板中选择。\n\n![](img/bbb7faa34598116cfaffe7a93b0_184_0.png)\n\
    \n### 26.2 内存映射\n\n由于任何硬件加速，Defender 的开发者通过稀疏视觉效果和巧妙技巧实现了闪电速度。对于《Joust》和《Robotron》等游戏，Greg\
    \ Wegner 创建了一个自定义绘制器 (blitter)。这是一个强大的 4 MHz 副处理器，可以以当时惊人的速度向缓冲区绘制精灵和矩形——每秒移动近\
    \ 1 MB 数据。《Robotron》拥有大量的精灵。被称为“特殊芯片”，成对工作，每个芯片处理 4 位（一个像素）。\n\nDefender 是最早使用\
    \ Motorola 6809 CPU 的视频游戏之一。许多 Williams 游戏编写在 Motorola EXorciser 上，这是一种可以汇编 6800\
    \ 和 6809 程序的早期桌面计算机。\n\n> 我们适配模拟器以 Z80 运行 Williams 架构。它以 4 MHz 运行 CPU，这是 1981\
    \ 年 Z80 芯片上可提供的速度。\n\n| 起始 | 结束 | 说明 | 读写 |\n|---|---|---|---|\n| $0000 | $97FF\
    \ | 分页切换（视频 RAM，程序 ROM） | r/w |\n| $9800 | $BFFF | 通用 RAM | r/w |\n| $C000 | $C00F\
    \ | 视频调色板 | 写入 |\n| $C804 | $C807 | 控制输入 | 读 |\n| $C80C | $C80F | 控制输入 | 读 |\n\
    | $C900 | $C9FF | 分页选择 | 写入 |\n| $CA00 | $CA07 | 位绘制器 | 写入 |\n| $CB00 | | 视频计数器\
    \ | 读 |\n| $CBFF | | 看门狗 | 写入 |\n| $CC00 | $CFFF | NVRAM（诊断，高分） | r/w |\n| $D000\
    \ | $FFFF | ROM | 读 |\n\n## 26.3 分页 RAM/ROM\n\n视频缓冲区太大，导致 16 位地址空间中留给 ROM 访问的空间不多。因此，RAM\
    \ 和 ROM 通过分页切换在 $0000-$97FF 共存。写入始终进入 RAM，但读取取决于 $C900 处分页位的值来自 RAM 或 ROM。\n\n\
    读取视频内存并不频繁，但对于缓冲区之间的拷贝和某些检测程序有用。\n\n## 26.4 视频缓冲区\n\n> 要在 8bitworkshop.com 查看：选择\
    \ Williams (Z80) 平台，然后选择 Graphics Test 文件。\n\nWilliams 游戏的缓冲区是不典型的；虽然显示器是水平安装的¹，因此扫描线是水平的，但内存中连续的字节在屏幕上向下排列。\n\
    \n每个字节包含两个像素——左侧高四位，右侧低四位。每个 4 位像素映射到 16 色调色板。\n\n它在 C 中定义为 152 x 256 的字节数组：\n\
    \n```\nbyte __at (0x0) vidmem[152][256];\n```\n\n在一个字节中写入两个像素非常简单：\n\n```\nvidmem[x][y]\
    \ = 0x77;\n```\n\n¹除了 Joust 2。\n\n"
