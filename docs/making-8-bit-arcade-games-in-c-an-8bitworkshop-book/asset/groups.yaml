  - '[PAGE 137]


    Playing music on the AY-3-8910 is just a matter of setting the right frequencies
    at the right times (isn''t that true of all music?)


    > To see it on 8bitworkshop.com: Select the VIC Dual platform, then select the
    Music Player file.


    # 19.1 Hitting the Right Note


    First, we need to create a table that maps musical notes to their period register
    values. If we count the first key on a standard 88-key piano as 1, the frequency
    of a note is given by this equation:


    $F_{A4} = \frac{2(\text{note}-49)}{12}$


    A4 is the frequency of the musical note A above middle C, often called A4 or A440,
    since its standard frequency is 440 Hz.


    Since the Tone Period register can only store integer values, we cannot get all
    notes exactly on pitch. The tuning error increases rapidly as the notes get higher
    in pitch, since the integer divisor gets closer to zero.


    However, we can choose a value for A4 to minimize the tuning error in a certain
    note range. Generally, we have to give up accuracy in higher frequencies to get
    more accurate lower'
