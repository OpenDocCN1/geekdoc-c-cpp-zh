    \ can do a lot better using our custom emulated math hardware, which we'll describe\
    \ next.\n\n## 22.5 The Mult Box\n\nThe 6502 CPU does not have multiply or divide\
    \ instructions, which had to be emulated with software routines — this is very\
    \ slow.\n\nTo speed up 3D calculations, Atari vector games (starting with Battlefield\
    \ and Red Baron) used a custom circuit called the \"Math Box,\" built around four\
    \ AMD 2901 bitslice processors.¹ It could perform 16-bit multiplications, and\
    \ divisions much faster than the Z80 CPU.\n\nCinematronics games also used these\
    \ chips.\n\n> ¹The hard-wired CPU in Cinematronics\n\nOur emulator does not model\
    \ the Math Box precisely, but it has something similar which we’ve designed to\
    \ be easy-to-use. We’ll call it “The Mult Box,” and it has these addresses:\n\n\
    | Address | Description |\n| :--- | :--- |\n| $8100-$8101 | 16-bit sum |\n| $8102\
    \ | 8-bit multiplicand A |\n| $8103 | 8-bit multiplicand B |\n| $8104-$8105 |\
    \ 16-bit dividend (sum / A) |\n| $810F | compute sum += A * B (strobe) |\n\nTo\
    \ do a sum-of-products, first set the 16-bit value at $8100 to 0. For each product,\
    \ set $8102 to the first multiplicand and $8103 to the second multiplicand, then\
    \ strobe $810F. The multiplication will commence and the product will be added\
    \ to the 16-bit sum. When finished, read the 16-bit sum at $8100.\n\nThe Mult\
    \ Box also divides. Before we update sum, it computes the 16-bit dividend sum/A\
    \ and stores it at $8104.\n\nUsing the Mult Box, our transformation looks like\
    \ this:\n\n```c\ninline void mul16(byte a, sbyte b) {\n    mathbox_arg1 = a;\n\
    \    mathbox_arg2 = b;\n    mathbox_go_mul=0; // mathbox_sum += a * b\n}\n```\n\
