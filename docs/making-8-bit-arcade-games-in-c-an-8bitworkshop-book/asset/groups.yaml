    ```bash

    $ tar -xzvf 8bitworkshop-tools.tgz

    ```


    - 7. 工具将解压到 `8bitworkshop-tools` 目录。输入以下命令进入目录并列出内容：


    ```bash

    $ cd 8bitworkshop-tools && ls

    ```


    - 8. 要查看工具的示例用法，进入每个目录并运行 `make`；例如：


    ```bash

    $ cd williams && make

    ```


    ## 30.2 图形工具


    - `parsedf8.py` - 将位图分布格式 (BDF) 字体文件转换为用于基于块的图形。BDF 字体。

    - `parsedf8.py` - 将 BDF 字体转换为用于基于块的图形。

    - `pbm_to_c.py` - 将 PBM 转换为 C。

    - `pcx2will.py` - 将 PCX 转换为 Williams。

    - `mknotes.py` - 寻找频率。

    - `midi2song.py` - 将 MIDI 转换为歌曲。


    ## 30.3 音频工具


    - `mknotes.py` - 寻找频率。

    - `midi2song.py` - 将 MIDI 转换为歌曲。


    ## 30.4 第三方工具


    你可能会发现这些工具很有用：

    - `Gimp` - 图形编辑器。

    - `8bitworkshop` - 像素 编辑器。

    - `Turaco` - 较旧版本。

    - `Aseprite` - 像素编辑器。


    ## 30.5 免费艺术


    你可以在 https://opengameart.org/ 找到素材。


    ## 30.6 离线使用 8bitworkshop


    你也可以离线使用 8bitworkshop。下载最新的版本。


    ## 31 分发你的游戏


    当你为设计、开发和调优你的游戏花费了大量精力后，是时候把它们分享给世界了！


    在 8bitworkshop IDE 中，选择“Share File”菜单来生成分享链接。


    ### 31.1 生成 ROM 文件


    对于某些平台，你也可以在 MAME 等模拟器上运行你的游戏。对于非 Z80 平台，你需要在汇编中开发游戏 —— 这超出了本书范围。


    | 平台 | 8bitworkshop ID | MAME 驱动 | 语言 |

    | :--- | :--- | :--- | :--- |

    | VIC Dual | carnival | carnival | C/Z80 |

    | Galaxian | galaxian | galaxian | C/Z80 |

    | Scramble | scramble | scramble | C/Z80 |

    | Atari B&W Vector | vector | asteroid | 6502 |

    | Atari Color Vector | color | widow | 6502 |

    | Williams | williams | robotron | 6809 |


    ### 31.2 在实际硬件上运行


    选择“Download ROM”项下载你编译的游戏镜像。


    要将其转换为 MAME 存档，首先进入我们在30章下载的 8bitworkshop-tools 目录，对应目标平台：


    ```bash

    $ cd vicdual

    $ python rom_carnival.py [你的镜像]

    ```


    ```bash

    $ cd scramble

    $ python rom_scramble.py [你的镜像]

    ```


    这会将你的 ROM 镜像拆分为独立的 ROM 文件，生成一个用于 MAME 的 ZIP 包。你可以从命令行启动 MAME，使用 `-rompath` 设置来告诉它
    ZIP 文件的位置，例如：


    ```bash

    wine mame64.exe -window -rompath ~/8bitworkshop-tools/scramble/

    ```


    它会提示“校验和错误” —— 这是好事，意味着它找到了你的自定义 ROM 文件。记住，音板在 8bitworkshop 模拟器中并没有被真实还原，除非你付出了额外努力，否则可能没有声音。


    如果你足够幸运拥有一台运行良好的街机，你（理论上）可以用自己的游戏替换它的 ROM。这同样超出了本书的范围，但我们将介绍一些可能性。


    最直接的方法是获取一个 EPROM 擦除器和一个 EPROM 编程器，烧录自己的 EPROM，并替换街机 PCB 上的。你通常可以用一个 EPROM 替换所有的
    ROM（在 http://cambridgearcade.dyndns.org/ 有几台机器的说明）。


