    \ rom_select;\n```\n\n`video_counter` 是一个只读位置，返回 CRT 电子束的近似当前扫描行位置（其值的低二位始终为 0）：\n\
    \n```\nbyte __at (0xcb00) video_counter;\n```\n\n如果 CPU 中启用了中断，则每帧会产生四次中断——分别在扫描行\
    \ 0、60、188 和 252 处。\n\n看门狗（watchdog）需要每 8 帧至少写入一次精确的值 0x39 来重置，否则 CPU 将重位：\n\n\
    ```\nbyte __at (0xcbff) watchdog_0x39;\n```\n\n此外还有 1024 字节的非易失性 RAM，用于写入高分等信息：\n\
    \n```\nbyte __at (0xc00) nvram[0x400];\n```\n\n## 26.9 何时不该使用 memset\n\n在 Williams\
    \ 平台上，我们遇到了第 17 章中使用 `memset` 时遇到的相同问题。我们的内存分页模式设置为从 ROM 读取，而该例程会尽职地将 ROM 中的字节拷贝到屏幕上——导致左侧出现垃圾字节。\n\
    \n相反，请使用 blitter（图形加速器）来清除屏幕（高度值 255 被 blitter 解释为 256，因此整个屏幕会被填充）：\n\n```\nvoid\
    \ clscr() {\n  blit_solid(0, 0, 0, 152, 255, 0x00);\n}\n```\n\nWilliams 游戏，尤其是《Robotron:\
    \ 2084》，以其高精灵数量和复杂的视频效果而闻名。\n\n尽管 blitter 帮助完成了将字节移动到帧缓冲器的重量工作，但要制作出一个以 60 Hz\
    \ 动画数十个对象的响应式游戏，仍需大量工作。\n\n> 在 8bitworkshop.com 查看：选择 Williams (Z80) 平台，然后选择 Raster\
    \ Paranoia Game 文件。\n\n## 27.1 跟踪对象\n\n我们的游戏有若干个不同的链表来跟踪不同类型的对象：\n\n- player_list\
    \ - 仅包含玩家以及玩家射击时产生的激光。这些是“快”对象，每帧更新一次。\n- fast_list - 所有其他“快”对象。\n- slow_lists\
    \ - “慢”对象每 4 帧才更新一次。这为我们节省了一些 CPU 时间，可以用于其他用途。我们有 4 个独立的列表并在它们之间循环切换。\n- effects_list\
    \ - 爆炸的对象会移动。每帧更新一次。\n\n## 27.2 消除闪烁\n\nobstacle_list - 完全不移动的对象。\n\n- free_list\
    \ - 一个空闲 Actor 槽列表，可用于生成对象。\n\n每个列表都是双向链表。不是每个节点只指向下一个节点，我们的节点指向上一个和后一个节点：\n\n\
    ```\nstruct Actor* next;              // 列表中的下一个\nstruct Actor** prevptr;    \
    \ // 指向我们的指针\n```\n\n我们的“前一个”实际上是指向一个指针，而不是直接指向 Actor 对象。我们这样做是因为列表中的第一个对象没有前一个对象——我们让第一个对象的\
    \ `prevptr` 指向列表的头指针。这使得在不知道对象包含在哪个列表中时，也能轻松移除对象。\n\n```\nvoid add_actor(Actor*\
