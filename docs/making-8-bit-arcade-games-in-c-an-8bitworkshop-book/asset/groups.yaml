    # 12.7 Watchdog Timer


    The watchdog is an internal timer that tries to prevent errant code or faulty
    hardware from hanging up the game. Your program must “pet the dog” every so often
    – if you don’t, the dog gets scared because it thinks your code went into an infinite
    loop. The dog is unhappy because your arcade game won’t accept any more quarters!
    The dog barks, which resets your CPU – probably also ending the current game.
    So you should make sure to keep the dog happy!


    The Midway 8080 watchdog lives at I/O port 6, and can be pet by writing any value.
    If you don’t, it’ll reset the CPU after 1.1 seconds. Here we show you how to make
    a WATCHDOG macro which does:


    ```

    __fr __at (0x6) watchdog_strobe;

    #define WATCHDOG watchdog_strobe = 0; // reset watchdog

    ```'
