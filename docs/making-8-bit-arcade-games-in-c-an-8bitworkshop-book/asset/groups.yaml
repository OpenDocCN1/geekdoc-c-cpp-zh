    \n```\nif (!input1 & 0x10) { /* move left */ }\n```\n\n很容易编写 C 预处理器宏来为所有的摇杆方向、按钮和硬币检测器编写表达式：\n\
    \n```c\n#define LEFT1 !(input1 & 0x10)\n#define RIGHT1 !(input1 & 0x20)\n#define\
    \ UP1 !(input1 & 0x40)\n#define DOWN1 !(input1 & 0x80)\n#define FIRE1 !(input2\
