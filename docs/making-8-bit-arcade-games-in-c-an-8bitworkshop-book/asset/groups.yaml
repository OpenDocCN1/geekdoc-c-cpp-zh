    \ __at (0x2) ay8910_data;\n```\n\nWe can also define a convenience function to\
    \ set the value of a specific register:\n\n```\ninline void set8910(byte reg,\
    \ byte data) {\n    ay8910_reg = reg;\n    ay8910_data = data;\n}\n```\n\nTo demonstrate,\
    \ let's create a function to play a tone on one of the three channels:"
  - '[PAGE 74]


    # 9.1. The AY-3-8910 PSG


    inline void play_tone(byte channel, word period, byte volume)


    To play a tone on one of the three channels, first set the Low/High Tone Period
    registers to choose the desired frequency. A channel''s tone frequency is defined
    by this equation:


    Frequency = \frac{Clock}{16*TonePeriod}


    In most designs, the clock frequency is 3.57945 Mhz. A period of 0 is invalid
    (the data sheet doesn''t even say what''ll happen, but people knew not to divide
    by zero in those days!)


    You can also rearrange the equation thus:


    TonePeriod = \frac{Clock}{16*Frequency}


    Using our set8910 function, the Tone Period registers can be set like this (assuming
    period is a 16-bit variable):


    ```

    set8910(channel+2+0, period & 0xff); // lo byte

    set8910(channel+2+1, period >> 8); // hi byte

    ```


    Then set the Channel Volume register, which ranges from 0 to 15 (4 bits):


    ```

    set8910(channel+8, volume); // set volume

    ```


    Now enable the channel by clearing its corresponding bit in the Channel Enable
    register:


    ```

    set8910(7, ~(1<<channel)); // enable tone

    ```


    > ~x

    Invert all bits in x.


    63'
  - '[PAGE 75]


    # 9.1. The AY-3-8910 PSG


    To turn off the channel, just set the bit in the Channel Enable register:


    ```

    set8910(7, 1<<channel); // disable tone

    ```


    If you plan to use multiple channels, you should track the Channel Enable bits
    in a variable, and set or clear them as necessary before updating the register.


    Playing noise is similar, but there is only one Noise Period register which defines
    the upper frequency of noise – higher values produce lower frequencies:


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_75_0.png)


    The noise generator can be mixed into any of the three channels, whether a tone
    is playing or not. This example sets the Noise Period register, the Channel Volume,
    and enables the noise bit in the Channel Enable register:


    ```

    set8910(6, noise_period); // set noise period

    set8910(channel+8, volume); // set volume

    set8910(7, ~(8<<channel)); // enable noise

    ```


    These operations can be performed in any order, but note that on the actual hardware,
    the register changes take effect instantly, and there will be some CPU delay between
    register changes.


    The 8910 also has an envelope generator, but this is rarely used as it must be
    shared among all three channels (and our emulator doesn’t support it as of this
    writing). For more information, you can check out the original General Instrument
    datasheet.⁴


    > To see it on 8bitworkshop.com: Select the VIC Dual platform, then select the
    Sound Test file.'
  - '[PAGE 76]


    # 9.2 Inline Functions


    Since the set8910() function is pretty simple, we defined it with the inline keyword.
    This forces the compiler to expand it instead of performing a function call. In
    some cases, this not only saves CPU cycles, but code space as well.


    For comparison, this is the assembly output without the inline keyword:


    ```

    0912 21 07 08  [10] 2326      ld      hl, #0x0807

    0915 E3         [19] 2327      ex      (sp),hl

    0916 CD 7E 08  [17] 2328      call    _set8910

    ```


    And here it is with inline:


    ```

    08FF 3E 07      [ 7] 2309      ld      a,#x07

    0901 D3 01      [11] 2310      out     (_ay8910_reg),a

    0903 3E 08      [ 7] 2312      ld      a,#x08

    0905 D3 02      [11] 2313      out     (_ay8910_data),a

    ```


    The inline version takes one extra byte of code per call, saves at least 10 CPU
    cycles per call (plus 50+ cycles for the set8910() function itself). Also, when
    using inline, the function itself won''t be compiled, which saves even more ROM
    space.


    Inline functions also take advantage of constant folding. If all variables in
    an expression like channel+2 are constants, the compiler will evaluate it at compile-time,
    saving many CPU instructions. Constant folding is performed when inlining, so
    any constants passed to the function will likely be optimized.


    In this case, using inline was a win. You can easily check to see if using inline
    improves your code by comparing the size of ROM with and without it. Short and
    simple functions tend to do well with inlining.'
- md: "\n# 10\nBinary-Coded Decimal\n\nUp to this point, we've only dealt with bytes\
    \ encoded in binary — which represent unsigned values from 0 to 255. Now we're\
    \ going to use binary-coded decimal or BCD values.\n\nBCD represents numbers in\
    \ a more human-readable format. Bytes are split in half, into two 4-bit “nibbles,”\
    \ which each contain a decimal digit from 0 to 9. In this scheme, the hexadecimal\
    \ value reads the same as the decimal representation. For example, $00 to $09\
    \ are the same, but 10 is stored as $10, 11 is $11, all the way up to $99.\n\n\
    Some early computers used the BCD representation for their number-crunching, and\
    \ mainframes used them for processing financial data. They are still handy in\
    \ the 8-bit world, foremost because they are easier to render to the screen. We\
    \ don't have to divide by 10 to convert to decimal digits, because the decimal\
    \ digits are already part of the representation.\n\nTo extract the two digits\
    \ from a BCD byte, we just shift by 4 to isolate the first digit (the high nibble)\
    \ and mask by binary second digit (the low nibble):\n\n```\nvoid bcd2digits(byte\
    \ bcd) {\n  char digit1 = '0' + (bcd >> 4);\n  char digit2 = '0' + (bcd & 0xf);\n\
    }\n```\n\nIn C, we might find it handy to operate with 16-bit BCD numbers, which\
    \ hold a total of 4 decimal digits. Here's a function to render all 4 digits to\
    \ a given X/Y position on the nscreen, by shifting and masking each successive\
    \ digit:\n\n```\nvoid draw_bcd_word(byte x, byte y, word bcd) {\n    byte j;\n\
    \    x += 3;\n    for (j=0; j<4; j++) {\n        putchar(x, y, CHAR('0'+(bcd &\
    \ 0xf)));\n        x--;\n        bcd >>= 4;\n    }\n}\n```\n\nWe can write a BCD\
    \ addition routine in straight C, but a more efficient way would be to use the\
    \ Z80's DAA instruction – it takes the result of any standard binary addition\
    \ and converts it into a BCD result. The final function looks like this:\n\n```\n\
    word bcd_add(word a, word b) {\n    a; b; // to avoid \"unused variable\" warning\n\
    asm\n    ld  hl,#4\n    add hl,sp\n    ld  iy,#2\n    add iy,sp\n    ld  a,1 (iy)\
    \    ; load a (lo)\n    add a,(hl)      ; add b (lo)\n    daa             ; convert\
    \ to BCD\n    ld  c,a\n    ld  a,1 (iy)    ; load a (hi)\n    inc hl\n    adc\
    \ a,(hl)      ; add b (hi) + carry\n    daa\n    ld  b,a\n    ld  l,c\n    ld\
    \  h,b          ; result in HL reg\nendasm\n}\n```\n\n(How this code was written:\
    \ Write the C code for a simple 16-bit addition function, take the assembled output,\
    \ and add a DAA instruction after the two ADD and ADC instructions. I love it\
    \ when a plan comes together!)\n\nEarlier we promised to talk about pointers,\
    \ and so here we are! So what is a pointer? That question has an simple answer,\
    \ but to really understand them you have to see them at work. So let's start:\n\
    \n## 11.1 A Pointer is a Typed Memory Address\n\nA pointer is just a memory location\
    \ with a type attached. Internally, it's a 16-bit number, since the Z80 uses 16-bit\
    \ addresses.\n\n`type* name`\nDeclares a pointer that points to an object of type\
    \ type.\n\nWe declare a pointer by putting a * after the type. So a pointer to\
    \ a byte named ptr would be declared like this:\n\n```c\nbyte* ptr;\n```\n\nYou\
    \ can assign pointers just like you would any other variable — they're just 16-bit\
    \ values underneath. In fact, you can directly set them to a memory address:\n\
    \n```\nbyte* ptr = (byte*)0x4800;\n```\n\nThe (byte*) is a type cast which converts\
    \ the number to a pointer.\n\n## 11.2 A Pointer is a Reference To Another Variable\n\
    \nUsually, you don't want to set the address of a pointer directly, but you want\
    \ to set it to the address of another variable. You can create a pointer to any\
    \ object using the & operator.\n\n```c\n&x\nReturns a pointer to x.\n```\n\nIn\
    \ this example, we first set x to 10. We then declare a pointer and set it to\
    \ the address of x. Then through the pointer, we set x to 20:\n\n```c\nbyte x\
    \ = 10;\nbyte* ptr = &x;\n*ptr = 20;\n```\n\nNote the last line, *ptr = 20. The\
    \ * means we're dereferencing the pointer — in other words, we're no longer treating\
    \ it as a pointer, but as the object at the other end of the pointer.\n\n> *x\n\
    > Dereferences the pointer x (reverses the & operator).\n\nPointers are especially\
    \ useful when dealing with arrays, because you can compute a pointer to a particular\
    \ array index once, using it for multiple operations.\n\n## 11.3 A Pointer is\
    \ a String\n\nIn our \"Hello World\" chapter, we printed a string:\n\n```c\nprintf(\"\
    HELLO WORLD\"); // output some text\n```\n\nWhat we actually passed to the printf\
    \ function, though, was a pointer. We could have rewritten the code like this:\n\
    \n```c\nchar* text = \"HELLO WORLD\"; // pointer to string\nprintf(text);\n```\n\
    \nIn C, a string is just a pointer to an array of char, usually terminated by\
    \ a zero byte (or null terminator). We could have also rewritten our code like\
    \ this:\n\n```c\nchar text[12] =\n{'H','E','L','L','O ','W','O','R','L','D',0};\n\
    printf(text);\n```\n\nWait a second, doesn't text[12] define an array? How are\
    \ we passing it to printf, which takes a pointer argument? The C compiler will\
    \ convert the array to a pointer, passing the address of the first element of\
    \ the array.\n\n## 11.4 A Pointer is an Array ... Sort Of\n\nPointers and arrays\
    \ have a lot in common, and often can be used interchangeably. For example, this:\n\
    \n```c\nvoid putstring(byte x, byte y) {\n    byte i;\n    x += 3;\n    for (j=0;\
    \ j<4; j++) {\n        putchar(x, y, CHAR('0'+(bcd & 0xf)));\n        x--;\n \
    \       bcd >>= 4;\n    }\n}\n```\n\nNote the last line, *ptr = 20. The * means\
    \ we're dereferencing the pointer — in other words, we're no longer treating it\
    \ as a pointer, but as the object at the other end of the pointer.\n"
  mdcn: "\n\n# 10\n二进制编码十进制 (BCD)\n\n目前为止，我们只处理了以二进制编码的字节——它们表示从 0 到 255 的无符号值。现在，我们将使用二进制编码十进制或称\
    \ BCD 值。\n\nBCD 用一种更符合人类阅读的格式表示数字。字节被一分为两半，变成两个 4 位的“半字节”（nibbles），每个半字节包含一个 0\
    \ 到 9 的十进制数字。在这种方案下，十六进制的值与十进制表示法相同。例如，$00 到 $09 是相同的，但 10 被存储为 $10，11 存储为 $11，一直到\
    \ $99。\n\n早期的计算机使用 BCD 表示来进行数字计算，大型机也使用它们来处理财务数据。它们在 8 位世界中仍然非常有用，最主要是因为它们更容易渲染到屏幕上。我们不需要除以\
    \ 10 来转换为十进制数字，因为十进制数字已经是表示的一部分了。\n\n要从 BCD 字节中提取两个数字，我们只需要向右移 4 位来分离第一个数字（高位半字节），并通过二进制第二个数字（低位半字节）进行掩码操作：\n\
    \n```\nvoid bcd2digits(byte bcd) {\n  char digit1 = '0' + (bcd >> 4);\n  char\
    \ digit2 = '0' + (bcd & 0xf);\n}\n```\n\n在 C 语言中，我们可能会发现 16 位的 BCD 数字非常方便，它们总共\
    \ 4 个十进制数字。这里有一个函数，通过位移和掩码每个数字，将所有 4 个数字渲染到屏幕上指定的 X/Y 位置：\n\n```\nvoid draw_bcd_word(byte\
    \ x, byte y, word bcd) {\n    byte j;\n    x += 3;\n    for (j=0; j<4; j++) {\n\
    \        putchar(x, y, CHAR('0'+(bcd & 0xf)));\n        x--;\n        bcd >>=\
    \ 4;\n    }\n}\n```\n\n我们可以用纯 C 语言编写一个 BCD 加法程序，但更高效的方法是使用 Z80 的 DAA 指令——它将任何标准二进制加法的结果转换为\
    \ BCD 结果。最终的函数看起来像这样：\n\n```\nword bcd_add(word a, word b) {\n    a; b; // 避免“未使用的变量”警告\n\
    asm\n    ld  hl,#4\n    add hl,sp\n    ld  iy,#2\n    add iy,sp\n    ld  a,1 (iy)\
    \    ; 加载 a (lo)\n    add a,(hl)      ; 加 b (lo)\n    daa             ; 转换为BCD\n\
    \    ld  c,a\n    ld  a,1 (iy)    ; 加载 a (hi)\n    inc hl\n    adc a,(hl)    \
    \  ; 加 b (hi) + 进位\n    daa\n    ld  b,a\n    ld  l,c\n    ld  h,b          ;\
    \ 结果在HL寄存器中\nendasm\n}\n```\n\n（这段代码是如何写的：编写简单的 16 位加法函数的 C 代码，获取汇编输出，并在两个 ADD\
    \ 和 ADC 指令之后添加 DAA 指令。我喜欢这种计划达成的感觉！）\n\n早些时候我们承诺过讨论指针，现在我们来了！那么什么是指针？这个问题有一个简单的答案，但要真正理解它们，你必须看到它们的工作。。让我们开始吧：\n\
    \n## 11.1 指针是一个带类型的内存地址\n\n指针只是一个带有一个类型的内存位置。在内部，它是一个 16 位数字，因为 Z80 使用 16 位的地址。\n\
    \n`type* name`\n声明一个指向 `type` 类型对象的指针。\n\n我们通过在类型后加上一个 `*` 来声明指针。因此，一个名为 `ptr`\
    \ 的字节指针声明方式如下：\n\n```c\nbyte* ptr;\n```\n\n你可以像给其他变量赋值一样给指针赋值——底层只是 16 位的值。事实上，你可以直接将它们设置为内存地址：\n\
    \n```\nbyte* ptr = (byte*)0x4800;\n```\n\n`(byte*)` 是一个类型转换，它将数字转换为指针。\n\n## 11.2\
    \ 指针是对另一个变量的引用\n\n通常，你不想直接设置指针的地址，而是想将其设置为另一个变量的地址。你可以使用 `&` 运算符创建任何对象的指针。\n\n\
    ```c\n&x\n返回指向 x 的指针。\n```\n\n在例示例中，我们首先将 x 设置为 10。然后我们声明一个指针并将其设置为 x 的地址。然后通过指针，我们将\
    \ x 设置为 20：\n\n```c\nbyte x = 10;\nbyte* ptr = &x;\n*ptr = 20;\n```\n\n注意最后一行，`*ptr\
    \ = 20`。`*` 意味着我们正在解引用指针——换句话说，我们不再将其视为指针，而是将其视为指针另一端的对象。\n\n> *x\n> 解引用指针 x（反转\
    \ `&` 运算符）。\n\n指针在处理数组时，指针特别有用，因为你可以计算一次指向特定数组索引的指针，并将其用于多次操作。\n\n## 11.3 指针是一个字符串\n\
    \n在我们的“Hello World”章节，我们打印了一个字符串：\n\n```c\nprintf(\"HELLO WORLD\"); // 输出某些文本\n\
    ```\n\n然而，我们传递给 `printf` 函数的是一个指针。我们可以这样重写代码：\n\n```c\nchar* text = \"HELLO WORLD\"\
    ; // 字符串的指针\nprintf(text);\n```\n\n在 C 语言中，字符串只是指向一个字符数组的指针，通常由零字节（或空终止符）结束。我们也可以这样重写代码：\n\
    \n```c\nchar text[12] =\n{'H','E','L','L','O ','W','O','R','L','D',0};\nprintf(text);\n\
    ```\n\n等一下，`text[12]` 不是定义了一个数组吗？我们是如何将其传递给接受指针参数的 `printf` 的？C 编译器会将数组转换为指针，传递数组第一个元素的地址。\n\
    \n## 11.4 指针是一个数组 ... 如此\n\n指针和数组有很多共同点，并且通常可以互换使用。例如，这个：\n\n```\nvoid putstring(byte\
