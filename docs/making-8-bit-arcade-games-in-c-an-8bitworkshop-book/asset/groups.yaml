- md: "\n# 9\n## The Programmable Sound Generator\n\nVideo games have had sound since\
    \ the first Computer Space debuted at a convention for jukeboxes. In early arcade\
    \ game designs, the sound board was often custom-made for each title, and included\
    \ a variety of sound circuits that could be triggered from the main CPU board.\
    \ Since the sounds were hard-wired, there was usually little control except “start”\
    \ and sometimes “stop.”\n\nEven after the mid-1970s when CPUs got cheap enough\
    \ to be used in video games, designers still used discrete circuits for sound\
    \ generation. These circuits often made use of the ubiquitous 555 timer chip to\
    \ output a simple oscillating signal, sometimes modified by resistor-capacitor\
    \ filters and/or envelopes. For example, Atari’s Pong could generate different\
    \ sounds — bounce (a short 246 Hz pulse), score (a long 246 Hz pulse), and hit\
    \ (a short 491 Hz pulse).\n\nAs the market for video games and electronic gadgets\
    \ grew, chipmakers developed integrated circuits that produced various sorts of\
    \ noises in a single chip. One of the first was the Texas Instruments SN76477\
    \ “Complex Sound Generator,” which could be described as a mostly-analog monophonic\
    \ synthesizer.\n\nThe SN76477 was not programmable, but controlled by external\
    \ capacitors and resistors, sometimes requiring other ICs for more complex noises.\
    \ The data sheet describes example circuits\n\n### 9.1. The AY-3-8910 PSG\n\n\
    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_72_0.png)\n\nFigure 9.1: AY-3-8912 chip,\
    \ 28-pin DIP package\n\nsuch as “BIRD CHIRP.” “STEAM TRAIN WITH WHISTLE,” and\
    \ “RACE CAR MOTOR/CRASH.” In the post 8-bit era, this chip is beloved by DIY synthesizer\
    \ tinkerers, and it had a production run as recently as 2008.\n\nAs microprocessors\
    \ got cheaper and the personal computer revolution began in earnest, it was clear\
    \ that noisemakers should be controlled by software, not by hard-coded circuits.\
    \ Programmable sound generator (PSG) chips would fulfill this function, producing\
    \ a variety of sounds with no additional components required. The output was determined\
    \ exclusively by a set of registers which were programmed by a CPU.\n\n### 9.1\
    \ The AY-3-8910 PSG\n\nThe General Instrument AY-3-8910 is a popular PSG designed\
    \ in 1978. It was intended to be paired with the company’s CP1600 CPU (used by\
    \ the Intellivision console) and its variants were used in many arcade games,\
    \ pinball machines, game consoles, and home computers over the next decade and\
    \ beyond. In fact, as of 2010 there were still slot machines being produced with\
    \ compatible sound chips!\n\nThe AY-3-8910 has three primary voices (tone generators)\
    \ and one noise channel. Each voice can emit a tone chosen from 4095 different\
    \ pitches by dividing a base frequency by a 12-bit value. The noise source can\
    \ be set to one of 32 different periods (frequencies).\n\nThe AY-3-8910 has 16\
    \ 8-bit registers that control its output. (Some bits of some registers are unused,\
    \ and some registers control the GPIO ports which we won’t cover here.)\n\n###\
    \ 9.1. The AY-3-8910 PSG\n\n| Reg # | Bits 76543210 | Description |\n|---|---|---|\n\
    | R0 R1 | XXXXX XXXX | Channel A Tone Period (Low) . ..... Channel A Tone Period\
    \ (High) |\n| R2 R3 | XXXXX XXXX | Channel B Tone Period (Low) Channel B Tone\
    \ Period (High) |\n| R4 R5 | XXXXX XXXX | Channel C Tone Period (Low) Channel\
    \ C Tone Period (High) |\n| R6 | ......XXXXX | Noise Period Control |\n| R7 |\
    \ ....BCA ....BCA... | Channel Enable (Tone) 1=off Channel Enable (Noise) 1=off\
    \ |\n| R8 R9 R10 | ...EVVV ...EVVV ...EVVV | Channel A Env Enable, Volume (Low\
    \ Byte) Channel B Env Enable, Volume Channel C Env Enable, Volume |\n| R11 R12\
    \ | XXXXXXXX XXX | Envelope Period (Low Byte) Envelope Period (High Byte) |\n\
    | R13 | ...CALH | Envelope Shape (Continue, Alternate, Hold) |\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_73_0.png)\n\
    \nProgramming the AY-3-8910 typically involves two steps: select a register, set\
    \ the value. For example, the VIC Dual platform we've connected the chip so that\
    \ port 1 selects the register and port 2 sets the value. Using the \\_sfr keyword,\
    \ we can define these two ports in C:\n\n```c\n__sfr __at (0x1) ay8910_reg;\n\
    __sfr __at (0x2) ay8910_data;\n```\n\nWe can also define a convenience function\
    \ to set the value of a specific register:\n\n```c\ninline void set8910(byte reg,\
    \ byte data) {\n    ay8910_reg = reg;\n    ay8910_data = data;\n}\n```\n\nTo demonstrate,\
    \ let's create a function to play a tone on one of the three channels:\n\n```c\n\
    inline void play_tone(byte channel, word period, byte volume)\n```\n\nTo play\
    \ a tone on one of the three channels, first set the Low/High Tone Period registers\
    \ to choose the desired frequency. A channel's tone frequency is defined by this\
    \ equation:\n\nFrequency = \\frac{Clock}{16*TonePeriod}\n\nIn most designs, the\
    \ clock frequency is 3.57945 Mhz. A period of 0 is invalid (the data sheet doesn't\
    \ even say what'll happen, but people knew not to divide by zero in those days!)\n\
    \nYou can also rearrange the equation thus:\n\nTonePeriod = \\frac{Clock}{16*Frequency}\n\
    \nUsing our set8910 function, the Tone Period registers can be set like this (assuming\
    \ period is a 16-bit variable):\n\n```c\nset8910(channel+2+0, period & 0xff);\
    \ // lo byte\nset8910(channel+2+1, period >> 8); // hi byte\n```\n\nThen set the\
    \ Channel Volume register, which ranges from 0 to 15 (4 bits):\n\n```c\nset8910(channel+8,\
    \ volume);\n```\n\nNow enable the channel by clearing its bit:\n\n```c\nset8910(7,\
    \ ~(1 << channel));\n```\n\nTo turn off the channel, set the bit:\n\n```c\nset8910(7,\
    \ (1 << channel));\n```\n"
  mdcn: "\n\n# 9\n## 可编程声音发生器\n\n从第一款《太空作战》（Computer Space）在点唱机展会上亮相以来，视频游戏就有声音。在早期的街机游戏设计中，声板通常是每个游戏单独定制的，包含了可以从主\
    \ CPU 板上触发的各种声音电路。由于声音是硬接线的，除了“开始”和有时的“停止”外，通常几乎没有控制。\n\n即使在 20 世纪 70 年代中期，当 CPU\
    \ 变得廉到可以用于视频游戏中，设计人员仍然使用离散电路进行声音发生。这些电路通常利用无处不在的 555 定时芯片输出简单的振荡信号，有时通过电阻电容滤波器和/或包络进行修改。例如，雅达利的《Pong》可以产生不同的声音——反弹（短\
    \ 246 Hz 脉冲）、得分（长 246 Hz 脉冲）和击中（短 491 Hz 脉冲）。\n\n随着视频游戏和电子小用设备市场的增长，芯片制造商开发了可以在单个芯片中产生各种噪声的集成电路。最早的之一是德州仪的\
    \ SN76477 “复杂声音发生器”，它可以被描述为一个基本上是模拟的单声合成器。\n\nSN76477 并不是可编程的，而是由外部电容和电阻控制，有时需要其他\
    \ IC 来产生更复杂的噪声。数据手册描述了示例电路\n\n### 9.1. AY-3-8910 PSG\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_72_0.png)\n\
    \n图 9.1：AY-3-8912 芯片，28 引脚 DIP 封装\n\n例如“鸟鸣”、“带哨声的蒸汽火车”以及“赛车发动机/碰撞”。在 8 位时代之后，这种芯片深受\
    \ DIY 合成器爱好者的喜爱，直到 2008 年它仍在生产。\n\n随着微处理器变得越来越便宜，个人电脑革命的正式开始，显然噪声发生器应该由软件控制，而不是由硬编码电路。可编程声音发生器（PSG）芯片将实现这一功能，在不需要额外组件的情况下产生各种声音。输出完全由一组由\
    \ CPU 编程的寄存器决定。\n\n### 9.1 The AY-3-8910 PSG\n\nGeneral Instrument AY-3-8910 是一种在\
    \ 1978 年设计的流行 PSG。它旨在与该公司的 CP1600 CPU（用于 Intellivision 游戏机）配对，其变体被用于接下来的十年及以后许多街机游戏、弹球机、游戏机和家用电脑中。事实上，直到\
    \ 2010 年，仍在使用兼容声音芯片的老虎机在生产中！\n\nAY-3-8910 有三个主声道（音调发生器）和一个噪声通道。每个声道可以通过将基准频率除以一个\
    \ 12 位值，从 4095 种不同的音高中选择一个音调。噪声源可以设置为 32 种不同的周期（频率）之一。\n\nAY-3-8910 具有 16 个 8\
    \ 位寄存器来控制其输出。（某些寄存器的某些位未未使用，且某些寄存器控制 GPIO 端口，我们在这里不会介绍。）\n\n### 9.1. The AY-3-8910\
    \ PSG\n\n| 寄存器编号 | 位 76543210 | 说明 |\n|---|---|---|\n| R0 R1 | XXXXX XXXX | 通道\
    \ A 音调周期（低位） ..... 通道 A 音调周期（高位） |\n| R2 R3 | XXXXX XXXX | 通道 B 音调周期（低位） 通道 B\
    \ 音调周期（高位） |\n| R4 R5 | XXXXX XXXX | 通道 C 音调周期（低位） 通道 C 音调周期（高位） |\n| R6 | ......XXXXX\
    \ | 噪声周期控制 |\n| R7 | ......BCA | 通道启用（音调） 通道启用（噪声） |\n| R8 R9 R10 | ...EVVV ...EVVV\
    \ | 通道 A 启用、音量（低位） 通道 B 启用、音量 通道 C 启用、音量 |\n| R11 R12 | XXXXXXXX | 包络 | 包络周期（低位）\
    \ 包络周期（高位） |\n| R13 | ...CALH | 包络形状（持续，保持） |\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_72_0.png)\n\
    \n编程 AY-3-8910 通常涉及两个步骤：选择寄存器，设置值。例如，我们连接芯片，使得端口 1 选择寄存器，端口 2 设置值。使用 `_sfr` 关键字，我们可以在\
