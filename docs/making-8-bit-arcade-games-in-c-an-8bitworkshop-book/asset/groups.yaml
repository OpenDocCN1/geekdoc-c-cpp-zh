  - "[PAGE 164]\n\n# 23.1. Shape Prerendering\n\nIn most vector games, the prerendering\
    \ was done offline by a “real” computer and baked into the ROM. The prerendering\
    \ software could be pretty advanced, for instance performing hidden line removal\
    \ which could take hours. Sometimes shapes were even edited by hand!\n\n\nWe’re\
    \ going to perform the prerendering in RAM, when our program starts. For each\
    \ shape, we're going to choose a limited set of rotations and put the drawing\
    \ instructions into RAM. When we need to draw the shape at a certain angle, we\
    \ look up the prerendering shape’s address in memory and use the JSRL opcode to\
    \ draw it.\n\nIt’s not as difficult as it seems. First we choose the AVG offset\
    \ where our prerender shapes will start:\n\n```\ndwgwrofs = 0x800; // AVG offset\
    \ of prerender shapes region\n```\n\nWe declare a global buffer for each shape,\
    \ and choose how many rotations our prerender — 32 is a good number:\n\n```\n\
    word ship_shapes[32];\n thrust_shapes[32];\n tetra_shapes[32];\n```\n\nPrerendering\
    \ is the same as drawing: compute the transformation matrix, then output the drawing\
    \ instructions. The only difference is a RTSL opcode at the end, since these are\
    \ subroutines meant to be used by the JSRL command:\n\n```\nvoid make_cached_shapes()\
    \ {\n  Matrix mat;\n  byte i;\n  for (i=0; i<32; i++) {\n    ship_shapes[i] =\
    \ dwgwrofs; // start of shape\n    mat_rotate(&mat, 2, i<<3); // 32<<8 = 256\n\
    \    draw_wireframe.ortho(&ship.wf, &mat);\n    RTSL(); // end of shape\n  }\n\
    \  // ...draw other shapes...\n```"
  - "[PAGE 165]\n\n# 23.2 Actors\n\nTo make things easier, we're going to define a\
    \ type which holds\nt data for all moveable objects on the screen. We'll call\
    \ this an\nActor, and we'll define it with a struct:\n\n```\ntypedef struct Actor\
    \ {\n    word* shapes;              // array of AVG offsets\n    ActorUpdateFn*\
    \ update_fn;  // update function\n    byte asyncshift;            // converts\
    \ angle to shape\n    index;                     // scale\n    byte color;   \
    \             // color\n    byte intens;               // intensity\n    byte\
    \ collision_flags;      // collision compatibility\n    byte angle;          \
    \       // angle (0-255)\n    word xx;                   // fixed-point X\n  \
    \  word yy;                   // fixed-point Y\n    int velx;                \
    \  // X velocity\n    int vley;                  // Y velocity\n    struct Actor*\
    \ next;        // next actor in linked list\n    byte removed:1;            //\
    \ 'removed' flag\n} Actor;\n```\n\nNote that we put the keyword Actor both before\
    \ and after\ntcurly brackets. This is because of the way C defines namespaces.\n\
    A namespace is a bucket that holds unique identifiers.\n\nWe've mainly used the\
    \ global namespace up until this point,\nwhich includes function names, typedefs,\
    \ global variable names,\netc. The Actor identifier after the } goes in the global\
    \ namespace.\n\nThere is also a tag namespace which holds identifiers for struct\n\
    names. The identifier after the struct keyword but before the\n{ goes into the\
    \ tag namespace. We can use the same identifier,\nActor, in both places because\
    \ they are separate namespaces.\n\nWhy use the tag namespace anywhere? We need\
    \ it if we want to\nrefer to the struct type within its own definition. For example,\n\
    t next pointer is of type struct Actor:\n\n```\nstruct Actor* next;\n```"
