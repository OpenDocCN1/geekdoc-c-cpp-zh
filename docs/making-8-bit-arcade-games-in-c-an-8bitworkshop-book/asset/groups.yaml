    # 8.1. Shift Operations


    expr >> n

    In C, compute expr shifted right by n bits. If a is signed, performs an arithmetic
    shift (fill high bits with 1s) otherwise a logical shift (rotate high bits with
    0s).


    Cutting the score in half (score >> 1) involves a right shift and a right rotate,
    starting with the high byte of score:


    ```

    _halve_score::

    ld      iy,#_score

    sra     1 (iy)      ; right shift hi byte

    ld      iy,#_score

    rr      0 (iy)       ; right shift lo byte w/ carry

    ret

