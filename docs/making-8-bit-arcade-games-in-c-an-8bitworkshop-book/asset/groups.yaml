    ### 在 Windows 上安装 8BitWorkshop 工具


    Windows 10 提供了一个基于 Linux 的子系统（运行 Ubuntu），你可以从中下载并使用 8bitworkshop 工具。


    - 1. 打开“设置”，选择“更新和安全”，选择“开发人员”，启用“开发模式”单选按钮。

