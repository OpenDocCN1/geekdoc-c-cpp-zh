    \ a source of randomness, we define an array starting at address $0 – which happens\
    \ to be the bytes of code in the ROM, random enough for our purposes!\n\n```c\n\
    void xor_player_derez() {\n    byte i,j;\n    byte x = player_x+13;\n    byte\
    \ y = 8;\n    byte* rand = 0; // start of ROM\n    for (j=1; j<=0x1f; j++) {\n\
    \        for (i=0; i<50; i++) {\n            // get next 'random' values for x/y\
    \ coordinates\n            char xx = x + (*rand++ & 0x1f) - 15;\n            char\
    \ yy = y + (*rand++ & j); // mask y with j\n            xor_pixel(xx, yy); //\
    \ draw pixel\n        }\n    }\n}\n```\n\nThe xor_pixel routine is pretty simple\
    \ too. We make it inline, which saves a few bytes of code:\n\n```c\ninline void\
    \ xor_pixel(byte x, byte y) {\n    // find the byte inside the scanline (y / 8)\n\
    \    byte* dest = &vidmem[x][y>>3];\n    // shift bit by (y % 8)\n    *dest ^=\
    \ 1 << (y & 7);\n}\n```\n\n## 14. Interrupts\n\n## 14.1 Interrupts\n\nThe Z80\
    \ can receive interrupts, which are external signals that tell the CPU to stop\
    \ what it's doing and execute a specific code routine.\n\nEach platform has its\
    \ own way of generating and handling interrupts. In the Midway 8080 platform,\
    \ there are two distinct interrupts: one when the video generator reaches scanline\
    \ 96 (1/3 of the way across the frame) and one at scanline 224 (the end of the\
    \ frame).\n\nThe Z80 has three different ways of responding to an interrupt signal;\
    \ this platform uses Mode 0 interrupts. They work like this: When the Z80 receives\
    \ an interrupt signal, it reads a single instruction off the data bus — placed\
    \ there by the signaling device — and executes that instruction.\n\nThe Midway\
    \ 8080 platform generates RST $08 and RST $10 instructions, so we have to make\
    \ sure we have two interrupt routines, one starting at address $08 and one starting\
    \ at $10.\n\nThe tricky thing about our C compiler is that it, unlike the assembler,\
    \ does not allow us to set specific addresses for our routines. But with some\
    \ care, we can write our routines so they line up at the proper locations.\n\n\
    In C, we first declare our interrupt handlers with a special keyword, and our\
    \ main function:\n\n```c\nvoid scanline96() __interrupt;\nvoid scanline224() __interrupt;\n\
    void main();\n```\n\nNow we have to carefully write our functions so that they\
    \ conform to this memory map:\n\n| Address | Description |\n| :--- | :--- |\n\
    | $0000 | Start routine |\n| $0008 | Interrupt entry point for scanline 96 |\n\
    | $0010 | Interrupt entry point for scanline 224 |\n\nFirst, we write the start\
    \ routine, using some inline assembly (as described in Chapter 6) to set up the\
    \ stack pointer and enable interrupts with the EI instruction:\n\n```c\nvoid start()\
    \ {\n__asm\n  SP,#0x2400\n  EI\n__endasm;\n  main();\n}\n```\n\nThis translates\
    \ into the following assembly:\n\n```asm\n0000 31 00 24      LD SP,#0x2400\n0003\
    \ FB            EI\n0004 00            NOP\n0005 C3 D1 0B      jp _main\n```\n\
    \nNote that the routine ends at $0007, meaning the next routine starts at $0008.\
    \ We've only got 8 bytes until the RST $10 handler, so we have to put a quick\
    \ \"trampoline\" to the scanline96 handler which will be defined later:\n\n```c\n\
    void _RST_8() {\n__asm\n  NOP\n  NOP\n  NOP\n  NOP\n__endasm\n  scanline96();\n\
    }\n```\n\nThis translates into the following output:\n\n```asm\n0008         \
    \   _RST_8::\n0008 00            NOP\n0009 00            NOP\n000A 00        \
    \    NOP\n000B 00            NOP\n000C 00            NOP\n000D C3 1F 00      jp\
    \ _scanline96\n```\n\nThis routine does nothing except jump to the scanline96\
    \ function — we don't have space to do much since we have only 8 bytes. Because\
    \ the previous routine ends at address $000F, we can now define the RST $10 handler:\n\
    \n```c\nvoid scanline224() __interrupt {\n}\n```\n\nHere, we just define the scanline224\
    \ function, which was defined with the __interrupt keyword. This causes the compiler\
    \ to generate special entry and exit code, which looks like this:\n\n```asm\n\
    0010              _scanline224::\n0010 FB            ei\n0011 F5            push\
    \ af\n0012 C5            push bc\n0013 D5            push de\n0014 E5        \
    \    push hl\n0015 FD E5        push iy\n                    ...   // your code\
    \ goes here\n0017 FD E1        pop iy\n0019 E1            push hl\n001A D1   \
    \       push de\n001B C1          push bc\n001C F1          push af\n001D ED 4D\
    \      reti\n```\n\nThis is boilerplate interrupt handler code. It pushes all\
    \ of the register pairs (5 16-bit registers, or 10 8-bit registers in all) to\
    \ the stack before the function starts, and pops them back from the stack before\
    \ the function exits. Because the interrupt can happen while executing any bit\
    \ of code, we must preserve all the registers so that the code that was interrupted\
    \ doesn't get confused.\n\nIt also uses a RETI instruction instead of RET. (The\
    \ EI instruction at the beginning is for systems with stackable interrupts, which\
    \ doesn't apply to us.)\n\nWe can now define the scanline96 function, which will\
    \ be used by the RST $08 handler defined earlier:\n\n```c\nvoid scanline96() __interrupt\
    \ {\n}\n```\n\nIt will have the same PUSH and POP boilerplate code as the other\
    \ interrupt function.\n\n now, these interrupt handlers don't do anything. We'll\
    \ use interrupts in Chapter 18 to synchronize our screen writes with the raster\
    \ beam that we avoid flicker.\n\n> Many programs, including the original Space\
    \ Invaders, use the interrupt handlers to execute jobs from a task list. This\
    \ design ensures that animated objects are drawn every frame and also out of the\
    \ way of the raster beam. In the examples in this book, we use the interrupt routines\
    \ only for counting frames and draw everything in the main loop.\n\n## 15. Randomness\n\
    \nMost games have a need to generate random numbers. Maybe the game needs an enemy\
    \ that behaves unpredictably, or requires a game element appears at random positions\
    \ on the screen. This is usually accomplished by using a pseudorandom number generator\
    \ (PRNG). This is an algorithm that starts from a number called a seed and modifies\
    \ it in a complex way to generate successive random numbers.\n\nIf designed correctly,\
    \ the PRNG will cycle through a large range of values that do not repeat themselves,\
    \ or only repeat after many thousands of iterations. This is called the period\
    \ of the PRNG.\n\nA common type of PRNG is a linear-feedback shift register (LFSR)\
    \ which combines shifts with bit operations to generate numbers. The operations\
    \ are usually carefully chosen to maximize the period of the sequence. For math\
    \ reasons, only 16 different 8-bit LFSRs have the maximal period of 255 values\
    \ (zero is not allowed, otherwise it'd be 256). This means it'll cycle through\
    \ every non-zero 8-bit number exactly once, in a seemingly haphazard order, until\
    \ it repeats.\n\nLFSRs were popular in early computer and video game designs,\
    \ since they are easily implemented in hardware. They operate as simple counters,\
    \ produce audio noise, even generate video (the Galaxian starfield comes from\
    \ a 17-bit LFSR.) They’re also easy to implement in software, as we’ll see.\n"
  mdcn: "\n\n## 13.4. 爆炸动画\n\n第二个检查碰撞的函数是 `move_bomb`，它负责检测炸弹是否击中了某个物体：\n\n```c\n\
    void move_bomb() {\n  // 在旧位置擦除炸弹\n  byte leftover = xor_sprite(bomb_bitmap, bomb_x,\
    \ bomb_y);\n  if (bomb_y < 2) { // 炸弹击中\n    bomb_y = 0;\n  } else if (leftover)\
    \ { // 有剩余像素\n    erase_sprite(bomb_bitmap, bomb_x, bomb_y); // 擦除掩体\n    if (bomb_y\
    \ == 2) {\n      destroy_player(); // 击中玩家\n    }\n    bomb_y = 0; // 移除炸弹\n \
    \ } else {\n    bomb_y--; // 炸弹向下移动重绘\n    xor_sprite(bomb_bitmap, bomb_x, bomb_y);\n\
    \  }\n}\n```\n\n这个程序与 `move_bullet` 非常相似，但方向相反。\n\n只有当炸弹的 Y 位置恰好为 2 时检测到碰撞，炸弹才会击中玩家的飞船。任何更高的位置都是击中地面。（这是一个非常“不可靠”的测试，但它有效。如果炸弹精灵图高度超过\
    \ 8 像素，可能就失效了——原因留给读者自己思考！）\n\n制作玩家爆炸（或我们称之为“de-rez”，即消解）动画的程序挺酷的。我们要假装玩家飞船瞬间传送消失了，并大量使用\
    \ XOR 运算：\n\n```c\nvoid destroy_player() {\n  // 使用 XOR 制作消解图案（第1次）\n  xor_player.derez();\n\
    \  // 对玩家飞船进行 XOR，将其擦除\n  xor_sprite(player_bitmap, player_x, 1);\n  // 再次使用 XOR\
    \ 擦除消解图案（第2次）\n  xor_player.derez();\n  // 移除玩家，减少生命\n  player.x = 0xff;\n  lives--;\n\
    }\n```\n\n`xor_player_derez` 函数在玩家的矩形区域内通过 XOR 写入随机点，从精灵图底部开始，向上处理到 32 像素的高度。作为随机性来源，我们定义了一个从地址\
    \ $0 开始的数组——这恰好是 ROM 中的代码字节，对于我们的目的来说足够随机了！\n\n```c\nvoid xor_player_derez() {\n\
    \    byte i,j;\n    byte x = player_x+13;\n    byte y = 8;\n    byte* rand = 0;\
    \ // ROM 起始\n    for (j=1; j<=0x1f; j++) {\n        for (i=0; i<50; i++) {\n \
    \           // 获取 x/y 坐标的下一个“随机”值\n            char xx = x + (*rand++ & 0x1f)\
    \ - 15;\n            char yy = y + (*rand++ & j); // 用 j 掩码 y\n            xor_pixel(xx,\
    \ yy); // 绘制像素\n        }\n    }\n}\n```\n\n`xor_pixel` 程序也很简单。我们将它设为内联（inline），可以节省几个字节的代码：\n\
    \n```c\ninline void xor_pixel(byte x, byte y) {\n    // 在扫描行内查找字节 (y / 8)\n  \
    \  byte* dest = &vidmem[x][y>>3];\n    // 按 (y % 8) 移位\n    *dest ^= 1 << (y &\
    \ 7);\n}\n```\n\n## 14. 中断\n\n## 14.1 中断\n\nZ80 可以接收中断，中断是外部信号，告诉 CPU 停止当前工作并执行特定的代码程序。\n\
