    # 23.9 Collision Detection


    It''d be nice if the hardware could detect when two vectors cross. Unfortunately,
    it can''t. So we still have to do everything in software.


    Instead of doing things on a vector-by-vector basis, we''re going to test actors
    against each other. We''ll have to iterate through every pair of actors that could
    potentially collide, comparing their positions to see if they overlap.


    Collision detection routines often use a simple test to see if an object should
    be considered moving to more complex tests. A bounding box test is a common test
    because it''s computationally simple. This puts a generous rectangle around each
    actor, and we''ll only consider two actors for further collision testing their
    bounding boxes intersect.


    We''re going to use a radius test in our collision detector, because all of our
    moving objects are (approximately) round. The rule is: If the distance between
    the centers of a pair of objects is smaller than the sum of their radii, then
    they are assumed to collide.


    How do we calculate the distance? If you remember your trigonometry, the formula
    for the length of the side of a right triangle is $\sqrt{x^2+y^2}$. We compare
    that against our minimum collision distance *mindist*.


    However, square roots take a lot of CPU cycles to compute. Instead, we''ll square
    both terms: We''ll use the squared distance $(x^2+y^2)$ and compare against *mindist*.


    Because multiplication is expensive on our 8-bit CPU, we''ll do an initial test
    before computing the distance, using the *Manhattan distance* – which is just
    $(x+y)$. This value will always be greater or equal to the actual distance, so
    we can use it to filter out candidates.


    There is also a *collision_flags* field for each actor that we can use to filter
    out candidates based on type. For example, one flag is set for the player''s ship,
    one for player torpedoes, and one for obstacles. We pass the set of flags that
    we''re looking for, and the'
