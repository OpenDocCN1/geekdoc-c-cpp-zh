    Every video frame, we''ll call play_music to update the PSG values. First it sets
    the volume for each channel, decrementing it frame to give a “pizzicato” effect:


    ```

    void play_music() {

    byte ch;

    byte enable = 0; // channel enable flags

    byte free = 0; // free channel

    byte chmask = 1; // this channel''s enable flag

    for (ch=0; ch<3; ch++) {

    if (voice[ch]).volume --;

    set89910(AY_ENV_VOL_A+ch, voice[ch].volume--);

    enable |= chmask; // enable channel

    } else {

    freech = ch; // this channel is free

    chmask <<= 1; // next channel’s enable flag

    n}

    ```'
