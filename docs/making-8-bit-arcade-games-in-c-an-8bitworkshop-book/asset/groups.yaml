    # 3.1. Preprocessor and Compiler


    > To see it on 8bitworkshop.com: Select the VIC Dual platform, then select the
    Hello World file.


    The first line is a *preprocessor directive*, indicated by a hash (#) at the start
    of the line:


    ```

    #include <stdio.h>

    ```


    The *preprocessor* is the first thing that touches the C source code. One of its
    primary jobs is to include header files into the source, which contain various
    C declarations and macro definitions. This is pretty much how C implements modules
    or library routines.


    The other primary job is *macro expansion*. Your C source (or included files)
    can contain *macro definitions*, which tell the preprocessor to substitute one
    string for another, with optional parameters. It''s common to use these for constant
    values, for example:


    ```

    #define EXTRA_LIFE_SCORE 10000

    ```


    You can also use them for complex expressions, code generation, and all sorts
    of other mischief. We''ll cover some practical uses of macros later on.


    Anyway, our #include directive tells the preprocessor to include the text of the
    standard header file stdio.h into the code. This gives us, among other things,
    the declaration of the printf function which we can now use.


    ```

    return-type function-name(param1, param2...)

    Declares or defines a function.

    ```


    In C, all code statements must be placed inside of a *function*. We''re going
    to define a function called *main*, which is tradition-ally the first to run when
    a C program starts:'
