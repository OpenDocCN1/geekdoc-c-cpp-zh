    \ returns a pointer to the allocated memory block, or NULL if the allocation failed\
    \ due to lack of heap space. To use the returned pointer, we do something like\
    \ this:\n\n```\nActor* a = (Actor*) malloc(sizeof(Actor));\n```"
  - '[PAGE 169]


    # 23.6. Linked Lists


    ```

    struct Actor

    first_actor -> struct Actor* next -> NULL

    ```


    Figure 23.2: Linked list data structure


    The (Actor*) expression is a type cast – it converts the untyped (void*) pointer
    to a typed (Actor*) pointer, since we intend to use the allocated memory as an
    Actor struct.


    When we no longer need the allocated memory, we simply call free on the pointer
    returned by malloc:


    ```

    free(a);

    ```


    When using malloc and free, there are a couple of gotchas to watch out for:


    +   - Running out of memory: The C library allocates a finite portion of memory,
    called the heap, In our system, this is whatever RAM is left over after the global
    variables are declared. Because the stack lives at the top end of RAM, you may
    get stack corruption before you run out of memory.

    - Dangling pointers: You might free() an object while still having pointers pointing
    to it. This generally causes problems, especially when the freed object''s space
    is reused by other objects.


    # 23.6 Linked Lists


    If we have a large list of objects that grows and shrinks dynamically, we might
    want to use a linked list.


    A linked list is a chain of objects that are linked by pointers. Each object points
    to the next one in line, and the last object points to NULL. (A NULL pointer is
    a special value that denotes “nothing pointed to,” and it’s usually the value
    of 0. Make sure there’s nothing you want to point to address 0x0!)'
  - "[PAGE 170]\n\n# 23.6. Linked Lists\n\nTo iterate through all objects in the linked\
    \ list: Start with a pointer to the first object (this is kept separately) then\
    \ follow the “next” pointers in each object until you get a NULL. You’ll visit\
    \ every object in the list.\n\nWe can draw this to all actors, for example:\n\n\
    ```\nActor a = first_actor;\nwhile (a != NULL) {\n    draw_actor(a);      // draw\
    \ actor\n    a = a->next;        // move pointer to next actor\n}\n```\n\nTo create\
    \ a new actor and add it to the list, we have to do a couple of things. First,\
    \ we allocate memory for the new actor and get a pointer to it. Then, we set whichever\
    \ needs setting, and set its next pointer. We change the .actor pointer so that\
    \ it’s at the head of the list:\n\n```\nActor* new.actor = (Actor*) malloc(sizeof(Actor));\
    \ // allocate\nmemcpy(a, base, sizeof(Actor));                    // copy starting\
    \ values\na->next = first_actor;                          // set a’s next pointer\n\
    first_actor = a;                                // set head of list ptr.\n\nreturn\
    \ a;\n```\n\nWe pass to new.actor a base pointer that points to an example (prototype)\
    \ object, so that we can easily fill some default data for the new actor, like\
    \ its shape, scale, color, etc. We declare the base actor with a struct initializer,\
    \ which we briefly saw in the previous chapter:\n\n```\nconst Actor ship_actor\
    \ = {\nship_shapes, NULL, 3, 0xb0, WHITE, 7, 0x1\n};\n```\n\nThis constructs an\
    \ Actor struct in ROM with some fields pre-filled with our initialized values.\
    \ We have to put them in the same order as the struct declaration — if we don’t\
    \ put enough values for all of them, the remainder of the struct will be set to\
    \ zero bytes."
  - '[PAGE 171]


    # 23.7 Function Pointers


    Function pointers are variables that store the address of a function. You call
    a function pointer just like a function, passing it parameters and returning its
    result. The function pointer will call the underlying function at its address,
    which may be one of several different underlying functions.


    We''d like our actors to not only have their own shape and appearance, but their
    own behavior. We can add a function pointer to the Actor definition to give it
    this ability:


    ```

    ActorUpdateFn* update_fn;

    ```


    ActorUpdateFn is a function type, and so ActorUpdateFn* is a pointer to a function.
    The function pointer is declared with a typedef:


    ```

    typedef void ActorUpdateFn(struct Actor*);

    ```


    This tells the compiler that our function type ActorUpdateFn takes a pointer to
    an Actor and returns void (nothing). Any function with the same function signature
    will be compatible – in other words, with the same number and type of parameters
    and the same return type.


    Note that our parameter is of type struct Actor* instead of Actor*. This is because
    we''ve got to declare the function type before the Actor struct is defined, and
    so we need to declare Actor as an incomplete type:


    ```

    struct Actor;

    ```


    This tells the compiler that there is a struct called Actor so we can use it in
    declarations. We don''t know its size or what data members it has yet, so if we
    tried to do anything else besides make pointer types with it, we''d probably cause
    a compiler error. (It''s an incomplete type, just like void.)'
  - "[PAGE 172]\n\n# 23.8 Deleting Objects\n\nEventually, objects will be destroyed\
    \ and we'll have to remove them from the list of actors. Removing items from a\
    \ linked list is a little tricky, for a number of reasons:\n\n+   1. The next\
    \ pointers have to be rewritten so that the object to be deleted is skipped in\
    \ the chain.\n\n+   2. The same goes for the first_actor pointer (the first item\
    \ in the list).\n\n+   3. It gets complicated if an object is deleted while a\
    \ list is being iterated over.\n\n+   4. Memory must be freed.\n\nWe're going\
    \ to set a removed flag in the Actor object so that we can defer its removal from\
    \ the linked list until later.\n\nAfter we update all objects, we run through\
    \ the list again to check for the removed flag. We keep a pointer to another pointer\
    \ (the C type is Actor **) so that we can rewrite the previous pointer when needed:\n\
    \n```\nActor** prev = &first_actor;\n```\n\nWe can grab the Actor pointer from\
    \ this pointer:\n\n```\nwhile (a = *prev) {\n```\n\nIf the object was removed,\
    \ we set the previous pointer to this object's next pointer — skipping the deleted\
    \ object:\n\n```\nif (a->removed) {\n    // set previous pointer to skip this\
    \ actor\n    *prev = a->next;\n    // free memory\n    free(a);\n}\n```\n\nOtherwise,\
    \ we grab the address of the next pointer, which becomes our new prev:\n\n```\n\
    } else {\n    prev = &a->next;\n}\n```"
- md: "\n## 23.9 Collision Detection\n\nIt'd be nice if the hardware could detect\
    \ when two vectors cross. Unfortunately, it can't. So we still have to do everything\
    \ in software.\n\nInstead of doing things on a vector-by-vector basis, we're going\
    \ to test actors against each other. We'll have to iterate through every pair\
    \ of actors that could potentially collide, comparing their positions to see if\
    \ they overlap.\n\nCollision detection routines often use a simple test to see\
    \ if an object should be considered moving to more complex tests. A bounding box\
    \ test is a common test because it's computationally simple. This puts a generous\
    \ rectangle around each actor, and we'll only consider two actors for further\
    \ collision testing their bounding boxes intersect.\n\nWe're going to use a radius\
    \ test in our collision detector, because all of our moving objects are (approximately)\
    \ round. The rule is: If the distance between the centers of a pair of objects\
    \ is smaller than the sum of their radii, then they are assumed to collide.\n\n\
    How do we calculate the distance? If you remember your trigonometry, the formula\
    \ for the length of the side of a right triangle is $\\sqrt{x^2+y^2}$. We compare\
    \ that against our minimum collision distance *mindist*.\n\nHowever, square roots\
    \ take a lot of CPU cycles to compute. Instead, we'll square both terms: We'll\
    \ use the squared distance $(x^2+y^2)$ and compare against *mindist*.\n\nBecause\
    \ multiplication is expensive on our 8-bit CPU, we'll do an initial test before\
    \ computing the distance, using the *Manhattan distance* – which is just $(x+y)$.\
    \ This value will always be greater or equal to the actual distance, so we can\
    \ use it to filter out candidates.\n\nThere is also a *collision_flags* field\
    \ for each actor that we can use to filter out candidates based on type. For example,\
    \ one flag is set for the player's ship, one for player torpedoes, and one for\
    \ obstacles. We pass the set of flags that we're looking for, and the routine\
    \ only considers collisions against objects that have any matching flags.\n\n\
    Our main collision routine looks like this:\n\n```c\nif ((a->collision_flags &\
    \ flags) && a->removed) {\n    byte dx = abs(x1 - (a->xx >> 8)); // abs(x1-x2)\n\
    \    byte dy = abs(y1 - (a->yy >> 8)); // abs(y1-y2)\n    if (dx+dy < mindist)\
    \ { // check Manhattan distance\n        word dist2 = get_distance_squared(dx,\
    \ dy);\n        if (dist2 < mindist2) { // d^2 < mindist^2\n            if (fn)\
    \ fn(act1, a); // call hit function\n                count++; // inc. hit counter\n\
    \        }\n    }\n}\n```\n\nThe get_distance_squared function uses our hardware\
    \ multiplier to compute (x² + y²):\n\n```c\ninline word get_distance_squared(byte\
    \ dx, byte dy) {\n    textbox_sum = 0;\n    mul6(dx,dx);\n    mul6(dy,dy);\n \
    \   return textbox_sum; // dx^2 + dy^2\n}\n```\n\nNote that we first convert coordinates\
    \ from 16-bit fixed-point to 8-bit integer (i.e., shifted by 8) so that we don't\
    \ overflow when multiplying.\n\n## 23.10 The Main Loop\n\nFirst, we fill the DVG\
    \ RAM with 0x20 (HALT) opcodes in case we mess something up and the DVG goes into\
    \ the weeds:\n\n```c\nmemset(dvgram, 0x20, sizeof(dvgram)); // HALTs\n```\n\n\
    Now, we make our cached shapes. We set the DVG write offset to $0x800 and call\
    \ the routines:\n\n```c\ndvgwrofs = 0x800;\nmake_cached_font();\nmake_cached_shapes();\n\
    ```\n\nThen we create our game objects, the obstacles, and the player ship:\n\n\
    ```c\ncreate_obstacles(5);\nnew.player_ship();\n```\n\nNow our main game loop\
    \ starts. We'll loop until there is exactly one actor in the actor list, which\
    \ means we've cleared all of the obstacles and only the player's ship remains\
    \ (and there are no more bullets, torpedoes, etc.):\n\n```c\nwhile (!just_one_actor.left())\
    \ {\n```\n\nThis function is pretty simple:\n\n```c\nbyte_just_one_actor.left()\
    \ {\n    return first_actor && first_actor->next == NULL;\n}\n```\n\nThis function\
    \ also demonstrates short-circuit evaluation of logical operators like && || ||\
    \ in C. Logical expressions are evaluated left-to-right, and if the left part\
    \ is false, the right part is never evaluated at all. This is why we check first_actor\
    \ on the left side — to protect the right side from potentially evaluating a null\
    \ pointer and crashing the program (it wouldn't crash on a Z80, because there's\
    \ no memory protection, but you'd get a nonsensical result).\n\nIn our main loop,\
    \ we first reset the DVG write pointer to start a new vector program. We then\
    \ call control_player to read the player's inputs and control the ship, then draw_and_update_actors\
    \ to draw, move, and process all of the actors:\n\n```c\ndvgreset();\ncontrol_player();\n\
    draw_and_update_actors();\n```\n\n## 23.10. The Main Loop\n\nNow we do a CNTR\
    \ to center the vector beam:\n\n```c\nCNTR();\n```\n\nWhile we wait for the DVG,\
    \ we call any start:\n\n```c\ndvgstart();\n```\n\nWhile we wait for the DVG, we\
    \ update any:\n\n```c\nremove_actors();\n```\n\nSince our loop takes less than\
    \ the frame, we increment:\n\n```c\nframe++;\n```\n\nAs long as the loop takes\
    \ less than the frame, we check:\n\n```c\nwhile (frame & 0x3) {\n```\n\nAs long\
    \ as the loop takes less than the frame, we set:\n\n```c\nwatchdog = 0;\n```\n\
    \n## 24 The POKEY Sound Chip\n\nThe POKEY (POtentiometer and KEYboard) interface,\
    \ featured on the Atari VCS/2600, was designed by Doug Neubauer, who created Star\
    \ Raiders. Atari manufactured three versions: single-core, dual-core, and quad-core.\
    \ Besides making sound, it could read paddle controllers, handle serial communications,\
    \ and generate random numbers.\n\nimg/bbb76aa3459811663faffe7a93b60_177_0.png)\n\
    \nFigure 24.1: POKEY (by RodCastler, CC-SA 3.0)\n\n### 24.1. Memory Map\n\n| Offset\
    \ | Name | Description |\n|---|---|---|\n| $00 | AUDF1 | Channel 1 Frequency |\n\
    | $01 | AUDC1 | Channel 1 Control |\n| $02 | AUDF2 | Channel 2 Frequency |\n|\
    \ $03 | AUDC2 | Channel 2 Control |\n| $04 | AUDF3 | Channel 3 Frequency |\n|\
    \ $05 | AUDC3 | Channel 3 Control |\n| $06 | AUDF4 | Channel 4 Frequency |\n|\
    \ $07 | AUDC4 | Channel 4 Control |\n| $08 | AUDCTL | Audio Control |\n| $0A |\
    \ RANDOM | Random Number (read-only) |\n\n### 24.2 AUDCTL Bit Map\n\nThe AUDCTL\
    \ register configures global settings of the POKEY:\n\n| Bit | Description |\n\
    |---|---|\n| 0 | Clock base (0=64 kHz, 1=15 kHz) |\n| 1 | Channel 2/4 high-pass\
    \ filter |\n| 2 | Channel 1/3 high-pass filter |\n| 3 | Sync channels 4/3 |\n\
    | 4 | Sync channels 2/1 |\n| 5 | Channel 3 clock 1.79 MHz |\n| 6 | Channel 1 clock\
    \ 1.79 MHz |\n| 7 | Use 9-bit poly counter |\n\n### 24.3 AUDUCx Bit Map\n\nEach\
    \ of the 4 channels has its own AUDC register. The lower nibble of the AUDC register\
    \ sets the 4-bit volume of the channel.\n"
  mdcn: "\n\n## 23.9 碰撞检测\n\n如果硬件能检测两个向量何时交叉就太好了。遗憾的是，它做不到。因此我们仍然必须在软件中完成所有工作。\n\n\
    我们不会逐个向量进行操作，而是对 actor（实体）之间进行测试。我们必须遍历每一对可能碰撞的 actor，比较它们的位置以查看它们是否重叠。\n\n碰撞检测程序通常使用一个简单的测试来判断对象是否应该视为移动，然后再进行更复杂的测试。边界框（Bounding\
    \ box）测试是一种常用测试，因为它的计算非常简单。这会在每个 actor 周围放置一个大的矩形，只有当两个 actor 的边界框相交时，我们才会对它们进行进一步的碰撞测试。\n\
    \n我们在碰撞检测器中使用半径测试，因为我们所有的移动物体都是（大约）圆形的。规则是：如果一对对象中心之间的距离小于它们半径之和，则假设它们发生了碰撞。\n\
    \n我们如何计算距离？如果你还记得三角函数，直角三角形边边的长度公式为 $\\sqrt{x^2+y^2}$。我们将其与我们的最小碰撞距离 *mindist*\
    \ 进行比较。\n\n然而，平方根的计算需要大量的 CPU 周期。相反，我们将对两项进行平方：我们将使用平方距离 $(x^2+y^2)$ 并与 *mindist*\
    \ 进行比较。\n\n由于乘法在我们的 8 位 CPU 上是昂贵的，我们在计算距离之前会进行一次初始测试，使用*曼哈顿距离*（Manhattan distance）——它只是\
    \ $(x+y)$。这个值始终大于或等于实际距离，因此可以用它来过滤候选对象。\n\n每个 actor 还有一个 *collision_flags* 字段，我们可以根据类型来过滤候选对象。例如，玩家飞船设置一个标志，玩家导弹设置一个标志，障碍物设置一个标志。我们传递正在寻找的标志集，程序只会考虑与具有任何匹配标志的对象发生碰撞。\n\
    \n我们的主碰撞程序看起来像这样：\n\n```c\nif ((a->collision_flags & flags) && a->removed) {\n\
    \    byte dx = abs(x1 - (a->xx >> 8)); // abs(x1-x2)\n    byte dy = abs(y1 - (a->yy\
    \ >> 8)); // abs(y1-y2)\n    if (dx+dy < mindist) { // 检查曼哈顿距离\n        word dist2\
    \ = get_distance_squared(dx, dy);\n        if (dist2 < mindist2) { // d^2 < mindist^2\n\
    \            if (fn) fn(act1, a); // 调用命中函数\n                count++; // 增加命中计数\n\
    \        }\n    }\n}\n```\n\n`get_distance_squared` 函数使用我们的硬件乘法器计算 (x² + y²)：\n\
    \n```c\ninline word get_distance_squared(byte dx, byte dy) {\n    textbox_sum\
    \ = 0;\n    mul6(dx,dx);\n    mul6(dy,dy);\n    return textbox_sum; // dx^2 +\
    \ dy^2\n}\n```\n\n注意，我们首先将坐标从 16 位固定点转换为 8 位整数（即右移 8 位），这样在相乘时就不会发生溢出。\n\n## 23.10\
    \ 主循环\n\n首先，我们用 0x20 (HALT) 操作码填充 DVG RAM，以防我们搞砸了什么导致 DVG 进入死循环状态：\n\n```c\nmemset(dvgram,\
    \ 0x20, sizeof(dvgram)); // HALTs\n```\n\n现在，我们制作缓存形状。我们将 DVG 写入偏移量设置为 $0x800\
    \ 并调用程序：\n\n```c\ndvgwrofs = 0x800;\nmake_cached_font();\nmake_cached_shapes();\n\
    ```\n\n然后我们创建游戏对象、障碍物和玩家飞船：\n\n```c\ncreate_obstacles(5);\nnew.player_ship();\n\
    ```\n\n现在我们的主游戏循环开始了。我们将循环，直到 actor 列表中只剩下一个 actor，这意味着我们清理了所有障碍物，只剩下玩家飞船（并且没有了子弹、导弹等）：\n\
    \n```c\nwhile (!just_one_actor.left()) {\n```\n\n这个函数非常简单：\n\n```c\nbyte_just_one_actor.left()\
    \ {\n    return first_actor && first_actor->next == NULL;\n}\n```\n\n该函数还演示了 C\
    \ 中逻辑运算符（如 && ||）的短路求值。逻辑表达式从左到右求值，如果左部分为假，则右部分将完全不会求值。这就是为什么我们在左侧检查 `first_actor`\
    \ —— 为了防止右侧因评估空指针而导致程序崩溃（在 Z80 上不会崩溃，因为没有内存保护，但你会得到一个无意义的结果）。\n\n在我们的主循环中，我们首先重置\
    \ DVG 写入指针以开始一个新的向量程序。然后调用 `control_player` 读取玩家输入并控制飞船，然后调用 `draw_and_update_actors`\
    \ 来绘制、移动并处理所有的 actor：\n\n```c\ndvgreset();\ncontrol_player();\ndraw_and_update_actors();\n\
    ```\n\n## 23.10. 主循环\n\n现在我们执行 CNTR 使向量束居中：\n\n```c\nCNTR();\n```\n\n在等待 DVG 期间，我们调用任何启动：\n\
    \n```c\ndvgstart();\n```\n\n在等待 DVG 期间，我们更新任何：\n\n```c\nremove_actors();\n```\n\
    \n由于我们的循环小于一帧，我们增加：\n\n```c\nframe++;\n```\n\n由于我们的循环小于一帧，我们检查：\n\n```c\nwhile\
    \ (frame & 0x3) {\n```\n\n由于我们的循环小于一帧，我们设置：\n\n```c\nwatchdog = 0;\n```\n\n##\
    \ 24 POKEY 芯片\n\nPOKEY（POtentiometer and KEYboard）接口出现在 Atari VCS/2600 上，由 Doug\
