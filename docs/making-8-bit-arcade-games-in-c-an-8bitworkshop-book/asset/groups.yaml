    ## 1.6. CPU 指令


    “写入内存。”再次，总线设备查看地址总线和写信号，决定它们应该监听还是忽略它。


    “假设一个内存芯片做出响应——该内存芯片将从数据总线上读取 8 位值，并将其存储在地址 $1234 对应的内存中。CPU 在写入操作时不会得到响应；它只是假设一切运行良好。”


    到目前为止，我们看到的示例 CPU 指令都是用一种人类可读的语言，即汇编语言。CPU 并不精通这种语言，但它理解一种被称为机器码的紧凑代码。一个名为汇编器的程序会将人类可读的汇编代码转换生成机器码。例如：


    ```

    1d      a, (#x1234)      -> 3A 34 12

    ```


    这条汇编指令翻译为三个字节的机器码：$3A、$34 和 $12。$3A 是操作码，决定了指令和寻址模式。$34 和 $12 是操作数的一部分，在这种情况下，操作数是一个跨越两个字节的
    16 位数。


    > 你会注意到，当我们把 16 位值 $1234 分分为字节时，$34 在前，$12 在后——这是因为我们的 CPU 是小端处理器，期望先处理多字节数字的低位部分。


    > 低位字节（LSB）也称为低字节，而高位字节（MSB）也称为高字节。


    ## Z80 CPU


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_19_0.png)


    在 20 世纪 70 年的大部分时间里，CPU 对于街机游戏来说仍然昂贵，每台成本高达数百美元。因此，许多早期街机游戏是在没有 CPU 的情况下构建的——只有自定义电路。例如，雅达（Atari）最初的《Pong》游戏包含了
    66 片接线在定制 PCB（打印电路板）上的微芯片。这些组件实现了整个游戏逻辑、视频信号和声音。


    当时，英特尔 8080 CPU 的每台成本约为 100 美元，竞争对手急于进入市场。费德里科·法金（Federico Faggin）从英特尔离职创立了 Zilog
    并开发了 Z80 CPU，它是 8080 的增强版。它被用作许多家用电脑、视频游戏机以及投币式街机游戏（这本书的主题！）的基础。


    与廉得多的 MOS 6502 相比，Z80 更加强大且复杂。它拥有多得寄存器——与 6502 的五个 8 位寄存器相比，它有 7 个 16 位寄存器和 4
    个备用寄存器。它可以进行 16 位加减法，而这在 6502 上必须通过单独的 8 位指令完成。它还具有块内存、I/O 和搜索指令，可以使用单条指令对多个值进行操作。


    6502 将内存和 I/O 设备都映射到单一的 64k 空间中，而 Z80 将两者分离开。IN 和 OUT 指令执行输入和输出，而像 LD 这样的指令执行内存操作。尽管如此，一些系统设计师仍选择忽略
    I/O 指令，并将所有内容都映射到内存空间。


    Z80 的原始时钟频率为 2.5 MHz，看起来比 6502 的 1 MHz 快得多——但 Z80 的指令周期至少是 6502 的两倍，因此时钟的增加并没有看起来那么显著。


    ## 2.1. 寄存器


    Z80 有八个 16 位寄存器，每个寄存器由一对字母标识。每个寄存器对都有自己的“个性”，对应于它能使用的 CPU 指令类型：


    - AF - 这对的 8 位寄存器通常被分开处理。A 寄存器是累加器，被许多指令使用。F 是标志寄存器，其位根据指令执行的结果进行清零和设置。

    - BC - 通用 16 位寄存器。只能从 A 寄存器加载/存储内存到内存。

    - DE - 另一个通用 16 位寄存器。

    - HL - 有利于 16 位算术运算，也可以使用任何 8 位寄存器进行读写操作。


    上述每个寄存器的 8 位组件都可以被单独寻址；例如，B 是 BC 寄存器的低字节（最低位字节）。


    $1_5 1_4 1_3 1_2 1_1 0_9 0_8 0_7 0_6 0_5 0_4 0_3 0_2 0_1 0_0$（位位置）


    主寄存器


    | A | Flags | AF (累加器和标志) |

    |---|---|---|

    | B | | BC |

    | D | | E |

    | H | L | HL (间接地址) |

    | 备用寄存器 | | |

    | A'' | Flags'' | AF'' (累加器和标志) |

    | B'' | C'' | BC'' |

    | D'' | E'' | DE'' |

    | H'' | L'' | HL'' (间接地址) |

    | 索引寄存器 | | |

    | IX | | Index X |

    | IY | | Index Y |

    | SP | | 栈指针 |

    | 其他寄存器 | | |

    | | I | 中断向量 |

    | | R | 刷新计数 |

    | 程序计数器 | | |

    | | PC | 程序计数器 |

    | 状态寄存器 | | |

    | Z - H - M - P - N | | Flags |


    ![](img/bbb7f6aa3459811633fcfaffe7a93b60_19_0.png)


    其他 16 位寄存器如下：


    **PC - 程序计数器**。它持有当前执行指令的地址。


    **SP - 栈指针**。它持有栈顶的地址，用于 PUSH 和 POP 操作，以及 CALL 和 RET。


    **IX - 索引寄存器**。用于寻址模式 (IX+register)。


    **IY - 另一个索引寄存器**。它用于存储内存地址。


    ## 2.2. 读取内存


