    two variables of type char, which is an 8-bit integer type, and initialize one
    of them:


    ```

    char maxlives = 5;

    char lives;

    ```


    These are global variables because they are declared outside of a function. They
    take up memory for the duration of the program, in the data segment.


    ```

    x = expr

