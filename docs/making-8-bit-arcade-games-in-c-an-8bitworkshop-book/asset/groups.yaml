    \ just copies the bytes from the packet verbatim. For example, this packet outputs\
    \ the numbers 1 through 5:\n\n```\n05 01 02 03 04 05\n```\n\nSince we are drawing\
    \ images, we convert each byte into a pixel and draw them to the screen in a raster\
    \ pattern (left-to-right, then up-to-down).\n\nGetting a bitmap into RLE format\
    \ is tricky, because the computing world has largely moved on to better compression\
