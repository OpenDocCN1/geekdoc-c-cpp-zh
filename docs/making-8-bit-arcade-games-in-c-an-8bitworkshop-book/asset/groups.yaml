    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_11_0.png)


    图 1：Galaxian 街机系统板（照片由 Dennis van Zuijlekom，CC BY-SA 2.0）


    ## 1 CPU 基础


    注意：如果你已经熟悉 8 位 CPU，或者读过我的上一本书《为为 Atari 2600 制作游戏》，你可以安全地跳到下一章。


    ## 1.1 位、字节与二进制


    所有数字计算机都运行在位（bits）和字节（bytes）的基础上。让我们来回顾一下关于它们的一些知识。


    位（bit）是一个二进制值——它可以是 0 (zero) 或是 1 (one)。我们也可以称之为关闭/开启，或者假/真。重要的是，它只能是两个值之一。


    字节（byte）是八（8）个位的有序序列。数字 8 并没有特别之处；它只是一个方便的标准——就像铁轨的相当于两匹马的宽度。如果一台计算机主要处理字节，我们就说它具有
    8 位架构。


    我们可以用二进制表示法创建字节的书面表示，只需从左到右列出位，例如：%00011011。我们可以通过删除前导零来缩短字节表示法，得到 %11011。% 表示二进制数，我们将在书中贯使用这种表示法。


    字节中的八位不仅仅是独立的 0 和 1；它们还可以表示数字。我们为每一位分配值然后将它们相加。最低位（LSB），即最右边的位（我们的索引从 0 开始，即位
    0），值为 1。左侧的每个位置，值按 2 的次方增加，直到达到最高位（MSB），即最左边的位（位 7），其值为 128。


    以下是整个字节的值：


    | 位数 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 数值 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    让我们将示例字节 %11011 与这些值对齐：


    | 位数 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 数值 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | 我们的字节 | 0 | 0 | 0 | 1 | 1 | 0 | 1 | 1 |

    | 位*值 | | | | | 16 | | 2 | 1 |


    当我们把所有位相加时，我们得到 16 + 8 + 2 + 1 = 27。


    一个 N 位的二进制数有 2^N 种唯一组合，因此一个 8 位数可以表示 256 个不同的值，包括零。


    ## 1.2 十进制表示法


    二进制表示法可能很繁琐，因此通常使用十六进制表示法（或 16 进制）来表示字节。我们将字节分为两个 4 位部分，称为“半字节”（nibbles）。我们将每个半字节视为一个从
    0 到 15 的独立值，如下：


    | 位数 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 数值 | 8 | 4 | 2 | 1 | 8 | 4 | 2 | 1 |


    然后，我们将每个 4 位半字节的值转换为一个符号——0-9 保持为 0 到 9，但 10-15 变为 A 到 F。


    ## 1.3 有符号字节与无符号字节


    让我们转换二进制数 %11011，看看它在十六进制中如何表示：


    | 位数 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 数值 | 8 | 4 | 2 | 1 | 8 | 4 | 2 | 1 |

    | 我们的字节 | 0 | 0 | 0 | 1 | 1 | 0 | 1 | 1 |

    | 位*值 | | | 1 | | 8 | | | 1 |

    | 十进制值 | | | 1 | | | 11 | | |

    | 十六进制值 | | | 1 | | | | B | |


    我们从上面的表中看到，十进制数 27（二进制表示为 %11011）在十六进制格式下变为 $0x1b$。


    > $ 前缀表示十六进制数。在 C 语言中，你会看到十六进制数带有“0x”前缀，例如 0x1b 或 0xAA。我们将在书中交替使用这两种表示法。


    关于字节的最后一点：我们已经描述了它们如何被解释为 0 到 255 之间的任何值，或者一个无符号值。我们也可以将其解释为负或有符号的数量。


    这需要一种被称为“补码算术”的技巧。如果高位为 1（换句话说，如果无符号值为 128 或更大），我们将该值视为负值，就好像我们从中减了 256：


    ```

    0-127 ($00-$FF):    正

    128-255 ($80-$FF):  负 (值 - 256)

    ```


    注意，字节中没有任何标识其为有符号——这完全取决于你如何解释它，正如我们后面看到的。


    ## 1.4 整数溢出与算术


    由于我们在 8 位 CPU 中处理的数字非常小，整数溢出是我们必须经常处理的问题。


    当你两个两个数字时，CPU 的加法就像你手动操作一样，但是用二进制的。每个二进制位都相加，如果你需要进位 1（这只在加位 1 和 1 时发生），你就将其进位到下一位。例如：


    | 位数 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 字节 A + | 1 | 0 | 1 | 0 | 0 | 1 | 0 | 1 |

    | 字节 B + | 1 | 0 | 1 | 1 | 0 | 1 | 1 | 0 |

    | 进位 | 1 | 1 | | | | | | |

    | = | | 0 | 1 | 0 | 1 | 1 | 0 | 1 |


    表 1.1：两个字节的进位二进制加法


    那个额外的进位怎么了？字节中只有 8 位，加法的结果被截断为 8 位。我们也称之为*整数溢出*。进位保留在 CPU 的进位标志（Carry flag）中，可以用于未来的计算或直接丢弃。


