    # 31.2. Playing on Actual Hardware


    Another possibility is to connect a Raspberry Pi (or a fast microcontroller) to
    the address and data bus of the PCB, and write a program to “bit-bang” the data
    onto the bus from the Pi’s GPIO ports. This has been done with some success for
    Atari 2600 cartridges.


    If you know how to program an FPGA board, you could in theory replace the RAM,
    ROM, CPU, sound and video generation logic. Or just write a software emulator
    to the same thing. Or just get a PC running AdvanceMame and stick it in the arcade
    chassis (See where this leads...?)


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_216_0.png)


    Figure 31.1: Raspberry Pi Zero, a tiny $5 computer which is 1000x more powerful
    than the Galax arcade system board shown in the preface of this book (photo by
    Gareth Halffree, CC BY-SA 2.0)'
  - '[PAGE 217]


    # Appendix A: Troubleshooting


    # Programmer Error


    Programming is hard. Programming in C is harder. Programming in C with a web-based
    IDE and dodgy debugging support? That''s just crazy! :) Anyway, here are some
    common things that go wrong:


    # Forgetting to set the stack pointer


    If you find that your program crashes soon after it starts, you may have just
    forgotten to set the stack pointer in your entry routine! See Chapter 6.


    # Forgetting to initialize data


    If you find that global variables are zero or not the values you expect, you may
    have forgotten to set up the initialized data segment in your entry routine! See
    Chapter 16.


    # Writing outside of array boundaries


    C does not have array boundary checking, so it will happily write to memory outside
    of arrays if you tell it to. This can easily overwrite your variables in RAM.
    Make sure you check array accesses, especially when drawing sprites.


    C has lots of operator precedence rules that can be confusing. When in doubt,
    use parentheses. You may also have to cast your expression to a signed or unsigned
    value – see Chapter 20.


    # Infinite linked lists or corrupt objects


    Getting pointers right when using linked lists is tricky. Make sure you don''t
    keep a pointer to an object after calling free() on an object you''ve malloc()''ed.
    Consider also whether you would prefer to use a simpler data structure, like an
    array.'
  - "[PAGE 218]\n\n# Compiler Oddities\n\nThe SDCC compiler is under active development\
    \ as of 2017, but sometimes you find a compiler bug. (Some of these bugs might\
    \ be fixed by the time you read this!)\n\n# Non-fatal Compiler Internal Problem\
    \ in file ... line number '1018': Definition not found\n\nThe following code generates\
    \ this cryptic error message:\n\n```\nconst byte* e = \"HELLO\";\nwhile (*e >=\
    \ 0) { // condition always true\n  *e++;\n}\n```\n\nThe problem is that e is a\
    \ byte pointer, which is a type alias for unsigned char, and thus the expression\
    \ *e >= 0 is always true. This misses the loop induction optimizer and it spits\
    \ forth a confusing message. The solution is to remove the offending expression,\
    \ or change it so that it isn't always true.\n\n# inline functions don't always\
    \ work\n\nIf you encounter different behavior with the inline keyword than without\
    \ it, you might have found a bug in the compiler.\n\n# char is unsigned by default\n\
    \nSDCC makes the char type unsigned by default. This is not a bug so much as a\
    \ deviation from the majority of C compilers. We use byte and sbyte in our example\
    \ code, except in cases where the sign doesn't matter."
