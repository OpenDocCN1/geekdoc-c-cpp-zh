    \ which is typically set at program startup to point somewhere in RAM. The stack\
    \ has many uses temporary values, passes function parameters, and it keeps the\
    \ return address when a function is called.\n\n| Program ROM | $0000 |\n|---|---|\n\
    | | $3FFF |\n| Data Segment | $4000 $4xxxx |\n| Stack | $47FF |\n| Initial SP\
    \ | $4800 |\n\n> Figure 2.3: Example of a Z80 memory map\n\nThe PUSH instruction\
    \ pushes a 16-bit register onto the stack. This decrements SP by 2 and then writes\
    \ the register to the address at SP.\n(We say stack grows downward because memory\
    \ addresses decrease as items are pushed.)\n\nThe POP instruction restores the\
    \ last thing PUSH. It reads the 16-bit value at SP to a register, and then increments\
    \ SP by 2.\n\nWhen calling a function, the CALL instruction pushes the current\
    \ Program Counter onto the stack. The C compiler also keeps a lot of other stuff\
    \ in the stack, including local variables and function parameters. All this stuff\
    \ is referred to as the stack frame of function.\n\nLet's write a function that\
    \ has a single 16-bit parameter, and adds it to the current score:\n\n```\nvoid\
