    C doesn''t have any built-in data structures like variable-size lists, so you
    have to build your own or use a library. Here we use a fixed-size array to simulate
    a resizable list. We''ll store the enemy ships in an array with 28 slots, to allow
    for a 7 x 4 formation:


    ```

    #define MAX_ENEMIES 28

    ```


    ```

    Entity entities[MAX_ENEMIES]; // array of enemies

    byte num_entities; // current # of enemies

    ```


    Whenever an enemy is destroyed, we will decrement num_entities and move the array
    slots in memory to fill in the gap left by the deleted object.'
