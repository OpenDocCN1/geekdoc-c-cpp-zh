    # 3.2 Assembler


    The compiler spits out a bunch of files, the most important of which is the assembly
    listing. This is our C program translated into not-quite-final Z80 code. It''s
    not critical to understand it thoroughly, but let''s briefly review it.


    Here''s a quick guide on what the columns mean:


    ```

    OFFSET CYCLES LINE#

    01C 3A 34 12    [10] 42      ld  a,(0x1234)

    ```


    +   OFFSET - The offset, in hex

    BYTES - The bytes of the instruction, in hex

    CYCLES - The # of CPU cycles taken by the instruction

    LINE# - The line number in the assembly outline


    The compiled main function is pretty simple as far as C functions go. The first
    line is a label (_main::) which marks the start of the function for the assembler.
    Note that it is prepended with an underscore; this is standard practice for C
    symbols:


    ```

    0000                56 _main::

    ```


    The first instruction loads the 16-bit register HL with the constant value ___str_0,
    which is the address of the "HELLO WORLD" string:


    ```

    0000 21 ?? ??    [10] 58      ld hl,#_str_0

    ```


    Why the"?? " in our listing? That''s because we don''t know the address of the
    string yet. The linker will figure that out in the next step of the pipeline.


    Now that the HL register contains the address of our string, we want to pass it
    as an argument to the printf function. So we push it to the stack:'
