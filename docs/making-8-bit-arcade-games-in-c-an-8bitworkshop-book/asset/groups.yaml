    \ left */ }\n```\n\nVIC Dual 中的硬币检测器是一个特殊且有趣的案例。它连接到 CPU 复位线，因此当检测到硬币时，CPU 也会被重位。这意味着程序必须重新开始，但内存不会清空。我们可以利用这一点在主函数之后增加\
    \ `credits` 变量：\n\n```c\nif (COIN1) { // 是否检测到硬币？\ncredits++; // 加分\n} else {\n\
    \  test_ram(); // 没有硬币，重置 RAM\n}\n```\n\n如果我们在重位后没有检测到硬币，我们就假设机器刚刚通了电，因此我们清空所有\
    \ RAM 并继续我们的初始化程序。（大多数游戏机在初始启动时有一个诊断测试程序。）\n\n## 6.9 Z80 入口例程\n\n通常，C 程序从内置的入口例程开始（在系统中称为\
    \ `crt0`），该程序设置一些寄存器和内存，然后调用 `main()` 函数。\n\n我们的嵌入式 Z80 系统没有内置的入口函数，因此我们必须编写自己的——我们将将其命名为\
    \ `start`：\n\n```c\nvoid main(); // 我们稍后定义 main()\n\nvoid start() {\n  __asm\n\
    \    LD SP,#e800  ; 设置栈指针\n    DI             ; 禁用中断\n  __endasm\n    main();\n\
