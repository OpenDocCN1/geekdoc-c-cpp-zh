  - "[PAGE 128]\n\n# 18.3 Directions and Trig\n\nWe aliens to be able to fly in any\
    \ direction, so we need to track the angle that they are heading. We’ll encode\
    \ the angle as one of 32 different values — it’s a power of two, which will be\
    \ helpful.\n\nTo move an X,Y position D units along a vector with angle A, we\
    \ generally do this:\n\n```\nX := X + sin(A) * D\nY := Y + cos(A) * D\n```\n\n\
    Floating-point is very expensive in the 8-bit world, and we don’t need nearly\
    \ much precision, so we’ll cheat and use lookup tables.\n\nOur lookup table has\
    \ 32 values, for each integer angle, and ranges from -127 to 127 (we generated\
    \ this with a Python script):\n\n```\nconst byte SINTBL[32] = {\n0, 25, 49, 71,\
    \ 90, 106, 117, 49, 25,\n127, 117, 106, 90, 71, 49, 25,\n0, -25, -49, -71, -90,\
    \ -106, -117, -125,\n-127, -125, -117, -106, -90, -71, -49, -25\n};\n```\n\nOur\
    \ integer sin and cosine routines (isin and icos) become very simple:\n\n```\n\
    signed char isin(byte dir) {\n  return SINTBL[dir & 31]; // limit to 0-31\n```\n\
    \n```\nsigned char icos(byte dir) {\n  return isin(dir+8); // offset 90 degrees\n\
    ```\n\nTo move an alien along its current heading dir, we just do this:\n\n```\n\
    a->x += isin(a->dir) * 2;\na->y += icos(a->dir) * 2;\n```"
