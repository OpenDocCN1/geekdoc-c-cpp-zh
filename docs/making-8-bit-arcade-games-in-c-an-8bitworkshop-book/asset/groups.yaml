  - '[PAGE 215]


    # 31.2. Playing on Actual Hardware


    Choose the “Download ROM Image” menu item to download a ROM image of your compiled
    game.


    To convert it into a MAME archive, first go into the 8bitworkshop-tools directory
    we downloaded in Chapter 30 for your target platform:


    ```

    $ cd vicdual

    $ python rom_carnival.py [your rom image]

    ```


    ```

    $ cd scramble

    $ python rom_scramble.py [your rom image]

    ```


    This will split your ROM image into individual ROM files, producing a ZIP file
    to be used in MAME. You can start MAME from the command line, using the -rompath
    setting to tell it where to find your ZIP file, e.g.:


    ```

    wine mame64.exe -window -rompath

    ~/8bitworkshop-tools/scramble/ scramble

    ```


    It will complain about “wrong checksums” – that’s good, that means it found your
    custom ROM file! Remember that the sound boards are not faithfully reproduced
    in the 8bitworkshop emulator, so you probably won’t have sound unless you went
    above and beyond.


    # 31.2 Playing on Actual Hardware


    If you’re lucky enough to have a functional arcade cabinet, you could (in theory)
    replace its ROMs with your own game. This is also outside the scope of this book
    (we haven’t tried it!) but we’ll go over some possibilities.


    The most straightforward technique is to get an EPROM Eraser and an EPROM Programmer,
    burn your own EPROMs, and replace the ones in the arcade PCB. You can often replace
    all of the separate ROMs with a single EPROM (there are instructions for several
    machines at http://cambridgearcade.dyndns.org/).'
- md: "\n## 31.2. Playing on Actual Hardware\n\nAnother possibility is to connect\
    \ a Raspberry Pi (or a fast microcontroller) to the address and data bus of the\
    \ PCB, and write a program to “bit-bang” the data onto the bus from the Pi’s GPIO\
    \ ports. This has been done with some success for Atari 2600 cartridges.\n\nIf\
    \ you know how to program an FPGA board, you could in theory replace the RAM,\
    \ ROM, CPU, sound and video generation logic. Or just write a software emulator\
    \ to the same thing. Or just get a PC running AdvanceMame and stick it in the\
    \ arcade chassis (See where this leads...?)\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_216_0.png)\n\
    \nFigure 31.1: Raspberry Pi Zero, a tiny $5 computer which is 1000x more powerful\
    \ than the Galax arcade system board shown in the preface of this book (photo\
    \ by Gareth Halffree, CC BY-SA 2.0)\n\n# Appendix A: Troubleshooting\n\n## Programmer\
    \ Error\n\nProgramming is hard. Programming in C is harder. Programming in C with\
    \ a web-based IDE and dodgy debugging support? That's just crazy! :) Anyway, here\
    \ are some common things that go wrong:\n\n### Forgetting to set the stack pointer\n\
    \nIf you find that your program crashes soon after it starts, you may have just\
    \ forgotten to set the stack pointer in your entry routine! See Chapter 6.\n\n\
    ### Forgetting to initialize data\n\nIf you find that global variables are zero\
    \ or not the values you expect, you may have forgotten to set up the initialized\
    \ data segment in your entry routine! See Chapter 16.\n\n### Writing outside of\
    \ array boundaries\n\nC does not have array boundary checking, so it will happily\
    \ write to memory outside of arrays if you tell it to. This can easily overwrite\
    \ your variables in RAM. Make sure you check array accesses, especially when drawing\
    \ sprites.\n\nC has lots of operator precedence rules that can be confusing. When\
    \ in doubt, use parentheses. You may also have to cast your expression to a signed\
    \ or unsigned value – see Chapter 20.\n\n### Infinite linked lists or corrupt\
    \ objects\n\nGetting pointers right when using linked lists is tricky. Make sure\
    \ you don't keep a pointer to an object after calling free() on an object you've\
    \ malloc()'ed. Consider also whether you would prefer to use a simpler data structure,\
    \ like an array.\n\n## Compiler Oddities\n\nThe SDCC compiler is under active\
    \ development as of 2017, but sometimes you find a compiler bug. (Some of these\
    \ bugs might be fixed by the time you read this!)\n\n### Non-fatal Compiler Internal\
    \ Problem in file ... line number '1018': Definition not found\n\nThe following\
    \ code generates this cryptic error message:\n\n```\nconst byte* e = \"HELLO\"\
    ;\nwhile (*e >= 0) { // condition always true\n  *e++;\n}\n```\n\nThe problem\
    \ is that e is a byte pointer, which is a type alias for unsigned char, and thus\
    \ the expression *e >= 0 is always true. This misses the loop induction optimizer\
    \ and it spits forth a confusing message. The solution is to remove the offending\
    \ expression, or change it so that it isn't always true.\n\n### inline functions\
    \ don't always work\n\nIf you encounter different behavior with the inline keyword\
    \ than without it, you might have found a bug in the compiler.\n\n### char is\
    \ unsigned by default\n\nSDCC makes the char type unsigned by default. This is\
    \ not a bug so much as a deviation from the majority of C compilers. We use byte\
    \ and sbyte in our example code, except in cases where the sign doesn't matter.\n\
    \n# Bibliography\n\n- [1] Zilog Z80. https://en.wikipedia.org/wiki/Zilog_Z80.\n\
