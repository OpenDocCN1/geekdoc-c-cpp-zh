  - "[PAGE 145]\n\n# 20.2 Unsigned Comparisons\n\nConsider this: You have a horizontal\
    \ line that starts at coordinate and has width w. You need to see if point x intersects\
    \ the line.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_145_0.png)\n\nSeems pretty\
    \ easy, right? Here's one way you could do it:\n\n```\nchar in_range(byte x, byte\
    \ a, byte w) {\n    return x >= a && x <= a+w;\n}\n```\n\nYou could also write\
    \ it like this:\n\n```\nchar in_range(byte x, byte a, byte w) {\n    return x-a\
    \ >= 0 && x-a <= w;\n}\n```\n\nBoth of these methods work, but they are suboptimal.\
    \ This is because of the C integer conversion rules. 8-bit values are added or\
    \ subtracted, integer promotion converts them to 16-bit values first. The Z80\
    \ doesn't have 16-bit instructions for addition, subtraction, or comparison —\
    \ so the compiled code will be larger.\n\nThe following method only requires one\
    \ comparison, and operates solely on 8-bit values:\n\n```\nchar in_range(byte\
    \ x, byte a, byte w) {\n    return (byte)(x-a) <= w;\n}\n```\n\nNote that we cast\
    \ (x-a) to byte (i.e. unsigned char) before the comparison. Since all values are\
    \ 8-bit quantities, there is no need to promote to 16-bit. Therefore the code\
    \ generated is a lot smaller."
  - '[PAGE 146]


    # The Atari Vector Hardware


    # 21.1 History


    The history of vector games started with the PDP-1 computer and a game called
    Spacewar! developed in 1962 by Steve Russell at MIT. The PDP-1''s Type 30 CRT
    was even more primitive than arcade vector displays, and could only draw individual
    dots, not lines. Another MIT student, Larry Rosenthal, recreated the game with
    a homemade CPU and a line-drawing vector display CRT. Cinematronics purchased
    the technology and released the game as Space Wars in 1978.9


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_146_0.png)


    Atari was not initially interested in Rosenthal''s technology, but the next year,
    they would release a vector game called Lunar Lander. It was inspired by an older
    DEC demo to promote its vector graphics terminals — itself inspired by a text-based
    simulation (LEM) written in an early interpreted language called FOCAL.


    Spacewar! would go on to inspire the hit game Asteroids. Atari’s Ed Logg used
    the same basic control scheme for the ship,'
  - '[PAGE 147]


    # 21.2. How Vector Monitors Work


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_147_0.png)


    Figure 21.2: Cinematronics'' Star Castle, and Atari''s Asteroids Deluxe,

    Space Duel, Major Havoc


    including the hyperspace button. Later, Atari would develop

    RGB color vector technology for the enigmatic Tempest, and 3-D

    wireframe graphics for the arcade version of Space Wars.


    The unique Vectrex game console brought black-and-white vec-

    traphics to the living room, but by 1985, it was discontinu-

    ued. Arcade operators were also tired of the fussy and expensive

    vector monitors, and no new vector games were produced after

    this year. 1


    # 21.2 How Vector Monitors Work


    The vast majority of arcade monitors were raster scan – they

    swept the electron beam in a regular pattern across the entire

    frame, like television sets. A vector monitor, or "random scan"

    as it was then called, could direct the electron beam anywhere


    > ¹In 2015, 68 Crew released VEC9, a one-of-a-kind arcade game using an

    old Asteroids vector monitor.


    136'
  - '[PAGE 148]


    # 21.3. Analog Vector Generator (AVG)


    on the screen. It could draw precise lines and bright dots on a black background,
    much like the display on an oscilloscope.


    Vector monitors are notoriously finicky and prone to problems. If the electron
    beam is left stationary too long, the phosphor can “burn in” and leave a spot
    on the screen — sometimes burning straight through the glass.¹⁰


    The vector monitors in early black-and-white Atari games were controlled by a
    custom circuit called a Digital Vector Generator (DVG). This circuit is a rudimentary
    processor which takes instructions from memory and converts them into signals
    that draw lines on the vector display.


    The CPU fills a special area of RAM with DVG instructions (some were also in ROM,
    used as subroutines) and tells the DVG to start drawing. When the DVG is done,
    it is ready for the next set of instructions.


    The Analog Vector Generator (AVG) replaced the DVG in later color games, adding
    color support, additional scaling effects and simplifying the vector instructions
    a bit. The AVG is the model we’ll use for emulating color games.


    # 21.3 Analog Vector Generator (AVG)


    Like a CPU, the AVG fetches opcodes and decodes them to determine which operation
    to take next. The AVG works with 16-bit words, not 8-bit bytes. The upper 3-4
    bits determine the type of operation. The rest of the bits are parameters. (One
    instruction, VCTR, requires an extra word fetched.)


    The list of AVG commands is as follows:


    # VCTR


    Draw a line from the current beam position to a relative position, defined by
    an X offset and Y offset added to the current position. The Y offsets are 13-bit
    signed quantities, so they can range from -$1000 (-4096) to $SFFF (4095).


    The actual length of the vector on the screen depends on the value passed to the
    SCAL command, as we’ll see next.'
  - '[PAGE 149]


    # 21.3. Analog Vector Generator (AVG)


    | Opcode | Description | Word Format (MSB-LSB) |

    | --- | --- | --- |

    | VCTR | Draw relative vector. | 000YYYYY-YYYYYYY IIXXXX-XXXXXX |

    | HALT | Halt | 00100000-00000000 |

    | SVEC | Draw short relative vector | 01YYYYY-0IIXXXX |

    | STAT | New color/intensity | 0110+000-III0RGB |

    | SCAL | New scale | 0111SSS5-LLLLLLLL |

    | CNTR | Center | 01000000-00000000 |

    | JSRL | Jump to subroutine | 10AAAAAA-AAAAAAA |

    | RTSL | Return from subroutine | 11000000-00000000 |

    | JMPL | Jump to new address | 11AAAAAA-AAAAAAA |


    +   * X Signed X coordinate offset

    * Y Signed Y coordinate offset

    * RGB RGB color bits

    * I Intensity

    * L Linear scale

    * S Shift scale

    * A Address (word offset, DVG memory)

    * "Sparkle" bit (used in Major Havoc)


    > Table 21.1: List of AVG Commands


    An intensity from 0 to 7 is also provided. If it is zero, the beam position is
    moved, but no line is drawn.


    # HALT


    Halts the AVG and notifies the CPU by setting the VGHALT bit, read through one
    of the input ports. On a real vector monitor, it''s a good idea to center the
    beam with the CNTR command right before halting.


    # SVEC


    Draws a line from the current position. This command uses a condensed encoding
    that only uses one word instead of two. This is useful to save memory when drawing
    complex shapes like text.


    The X and Y offsets are provided as signed 5-bit quantities, so they range from
    -16 to 15. There is also a 3-bit intensity like in VCTR.


    The XY offsets are also modified by the SCAL command so the limitation is not
    as bad as it would seem.'
  - '[PAGE 150]


    # 21.3. Analog Vector Generator (AVG)


    # STAT


    Sets a new color and default intensity.


    The color is a 3-bit RGB value, for a total of 8 possible colors.


    The default intensity is given as a 4-bit value between 0 and 15. This value is
    substituted whenever the VCTR or SVEC commands specify an intensity of 2.


    # SCAL


    Sets a new scale value. The AVG has two scaling circuits:


    Linear (Multiplicative) scale: a continuous 255-step scaling implemented by analog
    circuitry. It does not affect the time taken to draw the beam.


    Digital (Shift) scale: Directly shifts the bits in the X/Y coordinates before
    they get to the vector generator. It reduces the time to draw the beam.


    The actual scale is given by this equation:


    ```

    $scale = \frac{(255-M)^{(8-S)}}{32768}$

    ```


    VCTR offsets are multiplied by *scale*; SVEC offsets are multiplied by *scale*
    * 2. The length of the screen on any side is assumed to be 1024.


    # CNTR


    Centers the vector beam. It''s a good idea to do this at the beginning and the
    end of an AVG program.


    # JSRL


    Jumps to a subroutine, given an address.


    The AVG has a three-element stack which allows for subroutines. JSRL pushes the
    next PC onto this stack, then sets the PC to the given address.'
  - '[PAGE 151]


    # 21.4. Z80 Memory Map


    # RTSL


    Returns from a subroutine.


    This pops a value off the AVG''s stack (placed there previously by JSRL) and sets
    the PC to that value, continuing where it left off.


    # JMPL


    Jumps to an address.


    Just like JSRL except it doesn''t push anything onto the stack.


    # 21.4 Z80 Memory Map


    The original Atari vector games used a 6502 CPU and had varied memory maps for
    different games.


    > For purposes of C programming on the emulator, we''re going to create our own
    hypothetical Z80 architecture. We''ll have to tweak the memory map a bit from
    the original 6502 hardware.


    > We''re also going to substitute the AVG''s ROM with RAM to make programming
    easier, for a total of 16KB of addressable AVG RAM.


    | Start | End | Description | R/W |

    | $0000 | $7FFF | Program ROM | read |

    | $8000 | $8003 | button inputs | read |

    | $8000 | $800F | POKEY 1 | write |

    | $8010 | $801F | POKEY 2 | write |

    | $8100 | $810F | Mult Box | r/w |

    | $8840 | | AVG run until halt | write |

    | $8880 | | AVG reset | write |

    | $A000 | $DFFF | AVG ROM | read |

    | $E000 | $FFFF | General-purpose RAM | r/w |


    Table 21.2: Emulated Z80 Memory Map (vector-z80color)'
- md: "\n## 21.5 AVG C Routines\n\n> To see it on 8bitworkshop.com: Select the Atari\
    \ Color Vector (Z80) platform, then select the Vector Fonts file.\n\nFirst, we\
    \ declare the 4096 16-bit words that the AVG uses at address $A000:\n\n```c\n\
    word _at(0xA000) dvgram[0x1000];\n```\n\nOur library is going to sequentially\
    \ write 16-bit words to this array, so we need an index into the array:\n\n```c\n\
    int dwgwrofs; // write offset for DVG buffer\n```\n\nWhen we want to write a new\
    \ frame of AVG data, we reset this index with dvgreset:\n\n```c\ninline void dvgreset()\
    \ {\n  dwgwrofs = 0;\n}\n```\n\nWe call dvgwrite to write a word to the array:\n\
    \n```c\nvoid dvgwrite(word w) {\n  dvgram[dwgwrofs++] = w;\n}\n```\n\nWe'll now\
    \ define a function to write each opcode type. The ones without any parameters\
    \ are pretty simple:\n\n```c\ninline void RTSL() {\n  dvgwrite(0xC000);\n}\n```\n\
    \n```c\ninline void CNTR() {\n  dvgwrite(0x8000);\n}\n```\n\n```c\ninline void\
    \ HALT() {\n  dvgwrite(0x2000);\n}\n```\n\nThe opcodes with just a single parameter\
    \ are still pretty simple, we just OR the parameter with the opcode bits:\n\n\
    ```c\ninline void JSRL(word offset) {\n  dvgwrite(0xa000 | offset);\n}\n```\n\n\
    ```c\ninline void JMPL(word offset) {\n  dvgwrite(0xe000 | offset);\n}\n```\n\n\
    ```c\ninline void SCAL(word scale) {\n  dvgwrite(0x7000 | scale);\n}\n```\n\n\
    The other opcodes that take multiple parameters are pretty complicated, involving\
    \ a lot of shifting and masking with the AND (&) operator:\n\n```c\nenum {\n \
    \ BLACK, BLUE, GREEN, CYAN, RED, MAGENTA, YELLOW, WHITE\n} Color;\n```\n\n```c\n\
    inline void STAT(byte rgb, byte intens) {\n  dvgwrite(0x6000 | ((intens & 0xf)<<4)\
    \ | (rgb & 7));\n}\n```\n\n```c\ninline void VCTR(int dx, int dy, byte bright)\
    \ {\n  dvgwrite((dy & 0x1fff) | ((bright&7) << 13) | (dx & 0xffff));\n}\n```\n\
    \n```c\ninline void SVEC(signed char dx, signed char dy, byte bright) {\n  dvgwrite(0x4000\
    \ | (dx & 0x1f) | ((bright&7)<<5) | ((dy & 0x1f)<<8));\n}\n```\n\nWe've even got\
    \ a function that enables the “sparkling” effect:\n\n```c\ninline void STAT_sparkle(byte\
    \ intens) {\n  dvgwrite(0x6800 | ((intens & 0xf)<<4));\n}\n```\n\nTo start the\
    \ AVG and execute instructions in the list, we call dvgstart:\n\n```c\nbyte __at(0x8840)\
    \ _dvgstart;\n\ninline void dvgstart() {\n  _dvgstart = 0;\n}\n```\n\n> In our\
    \ emulator, we don’t listen for the AVG’s HALT signal — we just assume all vectors\
    \ are drawn instantaneously.\n\nOn actual hardware, you’d likely do some very\
    \ important calculations while the AVG is running, then wait for the HALT signal\
    \ before proceeding with the next batch of vectors. Better yet, you could switch\
    \ between two AVG buffers, filling one while the other is being drawn.\n\n## 22\
    \ 3D Vectors\n\nThe first 3D arcade games came out in 1976 — Sega’s Fonz showed\
    \ a third-person view of a motorcycle traveling down a road, and Atari’s *Night\
    \ Driver* displayed a minimalist first-person view of road markers at night.\n\
    \nAt the 1980 SIGGRAPH conference, Boeing employee Loren Carpenter presented a\
    \ short film called *Vol Libre*, which depicted the flyby of a computer-generated\
    \ fractal landscape — later repurposed for the “Genesis Planet” sequence in Star\
    \ Trek II: The Wrath of Khan. (Loren would later co-found Pixar.) This was state-of-the-art\
    \ at the time, and a two-minute film like this requiring huge computing resources.\n\
    \nMeanwhile, real-time 3D graphics in games was just getting started. Home computers\
    \ were running subLOGIC’s *Flight Simulator*. Atari’s *Battlezone* and *Red Baron*\
    \ were making waves in arcades with their 3D vector graphics technology.\n\n>\
    \ To see it on 8bitworkshop.com: Select the Atari Color Vector (Z80) platform,\
    \ then select the 3D Transformations file.\n\n### 22.1 3D Types\n\nWe don’t have\
    \ floating point hardware (we could emulate it in software, but it’d be so slow\
    \ as to be unplayable), so we use fixed-point integer types for everything.\n\n\
    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_156_0.png)\n\nWe define 3D coordinates\
    \ with X, Y, and Z values, and we need both 8-bit and 16-bit 3D vectors (i.e.,\
    \ a coordinate — the mathematical kind of vector, not the vector-graphics kind\
    \ of vector):\n\n```c\ntypedef struct {\n  sbyte x,y,z;\n} Vector8; // 8-bit signed\
    \ XYZ vector\n```\n\n```c\ntypedef struct {\n  int x,y,z;\n} Vector16; // 16-bit\
    \ signed XYZ vector\n```\n"
  mdcn: "\n\n## 21.5 AVG C 常程\n\n> 在 8bitworkshop.com 上查看：选择 Atari Color Vector (Z80)\
    \ 平台，然后选择 Vector Fonts 文件。\n\n首先，我们声明 AVG 在地址 $A000 处使用的 4096 个 16 位字字：\n\n```c\n\
    word _at(0xA000) dvgram[0x1000];\n```\n\n我们的库将顺序地向此数组写入 16 位字字，因此我们需要一个数组索引：\n\
    \n```c\nint dwgwrofs; // DVG 缓冲区的写入偏移量\n```\n\n当我们想要写入一帧新的 AVG 数据时，我们使用 `dvgreset`\
    \ 重置此索引：\n\n```c\ninline void dvgreset() {\n  dwgwrofs = 0;\n}\n```\n\n我们调用 `dvgwrite`\
    \ 向数组写入一个字字：\n\n```c\nvoid dvgwrite(word w) {\n  dvgram[dwgwrofs++] = w;\n}\n\
    ```\n\n现在我们定义一个写入每种类型操作码的函数。那些没有参数的非常简单：\n\n```c\ninline void RTSL() {\n  dvgwrite(0xC000);\n\
    }\n```\n\n```c\ninline void CNTR() {\n  dvgwrite(0x8000);\n}\n```\n\n```c\ninline\
    \ void HALT() {\n  dvgwrite(0x2000);\n}\n```\n\n只有单个参数的操作码仍然非常简单，我们只需要将参数与操作码位进行或（OR）运算即可：\n\
    \n```c\ninline void JSRL(word offset) {\n  dvgwrite(0xa000 | offset);\n}\n```\n\
    \n```c\ninline void JMPL(word offset) {\n  dvgwrite(0xe000 | offset);\n}\n```\n\
    \n```c\ninline void SCAL(word scale) {\n  dvgwrite(0x7000 | scale);\n}\n```\n\n\
    其他带有多个参数的操作码非常复杂，涉及大量的移位和使用 AND (&) 运算符进行的掩码操作：\n\n```c\nenum {\n  BLACK, BLUE,\
