    \ (Noise) 1=off |\n| R8 R9 R10 | ...EVVV ...EVVV ...EVVV | Channel A Env Enable,\
    \ Volume (Low Byte) Channel B Env Enable, Volume Channel C Env Enable, Volume\
    \ |\n| R11 R12 | XXXXXXXX XXX | Envelope Period (Low Byte) Envelope Period (High\
