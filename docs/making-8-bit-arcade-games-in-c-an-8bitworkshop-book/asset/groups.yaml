    # 22


    # 3-D Vectors


    The first 3D arcade games came out in 1976 — Sega’s Fonz showed a third-person
    view of a motorcycle traveling down a road, and Atari’s *Night Driver* displayed
    a minimalist first-person view of road markers at night.


    At the 1980 SIGGRAPH conference, Boeing employee Loren Carpenter presented a short
    film called *Vol Libre*, which depicted the flyby of a computer-generated fractal
    landscape — later repurposed for the “Genesis Planet” sequence in Star Trek II:
    The Wrath of Khan. (Loren would later co-found Pixar.) This was state-of-the-art
    at the time, and a two-minute film like this requiring huge computing resources.


    Meanwhile, real-time 3D graphics in games was just getting started. Home computers
    were running subLOGIC’s *Flight Simulator*. Atari’s *Battlezone and *Red Baron*
    were making waves in arcades with their 3D vector graphics technology.


    > To see it on 8bitworkshop.com: Select the Atari Color Vector (Z80) platform,
    then select the 3D Transformations file.


    # 22.1 3D Types


    We don’t have floating point hardware (we could emulate it in software, but it’d
    be so slow as to be unplayable), so we use fixed-point integer types for everything.'
