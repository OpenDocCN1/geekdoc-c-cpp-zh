    \ back into their previous position in the formation using the same direction-based\
    \ algorithm, but that's pretty tricky. So we'll cheat, and use a different mode\
    \ of travel when an alien is returning (We'll call the actual flag returning.)\n\
    \nIn our `move_attackers` function, we'll choose one of two other functions based\
    \ on this flag:\n\n```c\nif (a->returning)\n    return_attacker(a);   // return\
    \ to formation\nelse\n    fly_attacker(a);      // fly around\n```\n\nIn `fly_attacker`,\
    \ we see if the alien has wrapped around the bottom of the screen, and if so,\
    \ we set the returning flag:\n\n```c\nif ((a->yy >> 8) == 0) { // convert from\
    \ fixed-point\n    a->returning = 1;\n}\n```\n\nIn `return_attacker`, we slowly\
    \ lower the alien into position, setting its X coordinate exactly where it needs\
    \ to be, and slowly moving the Y coordinate downward. We also rotate the alien\
    \ so it looks like it's flipping over into its space:\n\n```c\nvoid return_attacker(AttackingEnemy*\
    \ a) {\n    byte fi = a->index-1;\n    byte destx = get_attacker_x(fi);\n    byte\
    \ desty = get_attacker_y(fi);\n    byte ydist = desty - (a->yy >> 8); // distance\
    \ to slot\n    // have we arrived at our formation slot?\n    if (ydist == 0)\
    \ {\n        // convert back to formation enemy\n        formation[fi].shape =\
    \ a->shape;\n        a->index = 0; // disable attacker\n    } else {\n       \
    \ // we near our slot, set position and rotation\n        a->dir = (ydist + 16)\
    \ & 31;\n        a->x = destx << 8;\n        a->yy += 128;\n    }\n}\n```\n\n\
    ## 18.6. Missiles\n\nWhen the alien reaches its target Y coordinate, we convert\
    \ it back to a formation enemy — it'll no longer be a sprite, but it'll again\
    \ be drawn as a pair of background tiles.\n\nDrawing missiles is simple, as they\
    \ are supported as separate graphic entities in the hardware, like sprites. We\
    \ can't read from the object RAM segment, so we're going to have to define our\
    \ own \"shadow\" array:\n\n```c\ntypedef struct {\n    signed char dx; // delta-X\
    \ change\n    byte xpos;      // X coordinate\n    signed char dy; // delta-Y\
    \ change\n    byte ypos;      // Y coordinate\n} Missile;\n\nMissile missiles[8];\n\
    \nWe'll use `dy` as the y-position (speed and direction) of the missile. Missiles\
    \ have reversed Y coordinates from sprites, so position 0 is the bottom of the\
    \ screen. We'll use 0 to mean a missile slot is \"available\" since it is also\
    \ offseason.\n\nHere’s the routine that moves missiles every frame:\n\n```c\n\
    void move_missiles() {\n    byte i;\n    for (i=0; i<8; i++) {\n        if (missiles[i].ypos)\
    \ {\n            // move missile, and check to see if hit top of screen\n    \
    \        missiles[i].ypos += missiles[i].dy;\n            if ((byte)missiles[i].ypos\
    \ < 4) {\n                missiles[i].xpos = 0xff; // hide offseason\n       \
    \         missiles[i].ypos = 0;\n            }\n        }\n    }\n    // copy\
    \ all “shadow missiles” to video memory\n    memcpy(missiles, missiles, sizeof(missiles));\n\
    }\n```\n\n## 18.7. Blowing Up Aliens\n\nWe use `memcpy` to copy our \"shadow missiles\"\
    \ array to object RAM. We set up our `Missile` struct so that it's identical to\
    \ the one in object RAM, except we're using the two unused bytes.\nSince misses\
    \ at varying speeds, we'll hide the missile when it comes within 4 pixels of the\
    \ bottom (missiles that go upwards will wrap around to the bottom, and then be\
    \ hidden).\n\n> `(type)` expression\n> Casts expression to the type type. This\
    \ is a signal to the compiler to treat the expression as the given type. The compiler\
    \ will produce an error if a type cast is not allowed.\n\nNote the following expression:\n\
    `((byte)missiles[i].ypos < 4)`\nBut note the `(byte)` at the beginning of the\
    \ expression. This is called a type cast. In our missile struct, the `ypos` field\
    \ is unsigned, by `dy` is signed. In C, this makes the result of the addition.\
    \ Since signed bytes can only range from -128 to 127, we would overflow the signed\
    \ byte halfway up the screen! We cast this expression to `byte` before doing the\
    \ comparison so that we get the 0-255 range, and take advantage of integer overflow.\
    \ (We'll talk more about this in Chapter 20.)\n\nWe reserve a dedicated sprite\
    \ for exploding aliens, and when an alien explodes we activate it and wherever\
