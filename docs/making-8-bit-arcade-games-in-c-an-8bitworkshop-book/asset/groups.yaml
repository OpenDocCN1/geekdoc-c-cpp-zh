  - '[PAGE 22]


    # 2.2. Reading and Writing Memory


    IR - Interrupt and Refresh registers. Special-purpose, not generally used for
    computing.


    There are also four alternate (shadow) registers for AF, BC, DE, and HL. They
    can be quickly swapped with the EX and EX instructions. This is useful for interrupt
    routines.


    # 2.2 Reading and Writing Memory


    Take the following C statement, which assigns one 8-bit variable to another:


    ```

    lives = maxlives;

    ```


    Let''s look at the C compiler''s assembly output. This simple assignment statement
    requires multiple LD instructions:


    ```

    ld      a, (#_maxlives)

    ld      (#_lives)

    ```


    The first LD reads the address of the maxlives variable into the A register. The
    second LD then writes the A register contents to the address of the lives variable.


    Let''s say we wanted to subtract one life (again in C):


    ```

    lives--;

    ```


    The compiler uses the DEC instruction, which decrements its operand by 1:


    ```

    ld      hl, #_lives

    dec     (hl)

    ```


    The DEC instruction can only access memory through a register. So this code first
    loads the HL register with the address of the lives variable, then uses the DEC
    instruction with the (HL) addressing mode. This decrements the value at the address
    in the HL register.'
  - '[PAGE 23]


    # 2.3. Flags and Branching


    The ADD/ADC and SUB/SBC instructions handle addition and subtraction. Things get
    more complicated when going beyond 8-bit values. Let''s say we want to add 100
    to the 16-bit score variable:


    ```

    score += 100;

    ```


    Since score is a 16-bit value, the compiler has two additions to make: First it
    must add 100 ($64 in hex) to the low byte of score, and then add the carry to
    the high byte (we covered binary-addition-with-carry in Chapter 1):


    ```

    _add_100_points:

    ld hl,_score

    ld a, (hl)      ; load low byte of score

    add a, #0x64    ; add low byte

    ld (hl),a      ; store low byte of result

    inc

    ld a, (hl)      ; load hi byte of score

    dc a, #0x00    ; add hi byte

    ld (hl),a      ; store low byte of result

    ret

    ```


    For the first addition, HL is loaded with the address of the score variable''s
    low byte, and ADD is used to add the value to the low byte. (As described earlier,
    Z80 is little-endian, which means the least-significant bytes come first in memory.)
    The INC moves HL to the high byte. The second addition takes place, using ADC
    to add the Carry bit.


    # 2.3 Flags and Branching


    The bits of the F register correspond to various flags. They are changed when
    an instruction executes, according to the result of the calculation. Some instructions
    change them in different ways, and some (like LD) do not change them at all.'
  - "[PAGE 24]\n\n# 2.3. Flags and Branching\n\n| Bit | Flag | Flag Name | Flag Description\
    \ |\n|---|---|---|--|\n| 0 | C | Carry | Result overflowed register |\n| 1 | N\
    \ | Add/Subtract | Last op was subtraction |\n| 2 | V | Parity/Overflow | Signed\
    \ result overflow, or even number of bits |\n| 3 4 | H | Half-Carry | Carry bit\
    \ 3 to 4 |\n| 5 6 | Z | Zero | Result was zero |\n| 7 | S | Signed | Result is\
    \ negative |\n\nThe CPU keeps the address of the current instruction in a 16-bit\
    \ register called the Program Counter (PC). Typically, the CPU reads an instruction\
    \ and increments the PC to the next instruction, but some instructions change\
    \ the PC. These are called branch or jump instructions. Jumps can be conditional,\
    \ which means that the jump may or may not be taken depending on whether a CPU\
    \ flag is set.\n\nThe flags are often used to check for specific conditions. For\
    \ example, this C statement checks to see if we have any more lives, and end_game\
    \ if the number of lives is zero:\n\n```\nif (lives == 0) {\n    end_game();\n\
    }\n```\n\nThis is the compiled output:\n\n```\n_check_lives::\nld      a,(#lives)\
    \  ; load A with lives\nor      a, a          ; set zero flag\nret     NZ    \
    \         ; return if not zero\njp      --end_game      ; if zero, end game\n\
    ```\n\nIt first loads the lives into variable A. Next, it uses the OR instruction\
    \ to set the flags, by OR-ing a register with itself (which changes nothing except\
    \ the flags.) The RET NZ instruction checks the Z flag, and returns if it is not\
    \ set. Otherwise execution proceeds to the JP instruction, and we transfer control\
    \ to the end_game function."
- md: "\n## 2.3. Flags and Branching\n\nThe branch instructions are also good for\
    \ writing loops. Let's say we wanted to count from 0 to 99, and to write each\
    \ value in sequence to an I/O port:\n\n```\nchar i;\nfor (i=0; i<100; i++) {\n\
    \    output_port = i;\n}\n```\n\nThe compiled output uses the LD and INC instructions,\
    \ and the OUT instruction to write to the I/O port. The SUB and JR instructions\
    \ are responsible for implementing the loop:\n\n```\n_write_loop:\n    ld d,#0x00\n\
    repeat:\n    ld a,d\n    out (_output_port),a    ; write to port\n    inc\n  \
    \  ld a,d\n    sub a,#0x64            ; set flags for (d-100)\n    jr C,repeat\
    \            ; if carry set, repeat\n    ret\n```\n\nThe loop variable is kept\
    \ in the D register. When it gets below 0x64 (100 decimal), the SUB instruction\
    \ will set the Carry flag. The following JR C,<label> instruction transfers control\
    \ back to the repeat label as long as the Carry flag is set. So as long as D is\
    \ below 100, the loop will repeat.\n\n## 2.4 Stack\n\nThe Z80 also has a Stack\
    \ Pointer (SP), which is typically set at program startup to point somewhere in\
    \ RAM. The stack has many uses temporary values, passes function parameters, and\
    \ it keeps the return address when a function is called.\n\n| Program ROM | Address\
    \ |\n| :--- | :--- |\n| | $0000 |\n| | $3FFF |\n| Data Segment | $4000 $4xxxx\
    \ |\n| Stack | $47FF |\n| Initial SP | $4800 |\n\nFigure 2.3: Example of a Z80\
    \ memory map\n\nThe PUSH instruction pushes a 16-bit register onto the stack.\
    \ This decrements SP by 2 and then writes the register to the address at SP.\n\
    (We say stack grows downward because memory addresses decrease as items are pushed.)\n\
    \nThe POP instruction restores the last thing PUSH. It reads the 16-bit value\
    \ at SP to a register, and then increments SP by 2.\n\nWhen calling a function,\
    \ the CALL instruction pushes the current Program Counter onto the stack. The\
    \ C compiler also keeps a lot of other stuff in the stack, including local variables\
    \ and function parameters. All this stuff is referred to as the stack frame of\
    \ function.\n\nLet's write a function that has a single 16-bit parameter, and\
    \ adds it to the current score:\n\n```\nvoid add_score(int amount) {\n  score\
    \ += amount;\n}\n```\n\nIf we called this function with the statement add_score(100),\
    \ this code would execute the call:\n\n```\nld    #0x0064\npush  hl          ;\
    \ push argument = 100\ncall _add_score\npop   af          ; pop argument\n```\n\
    \nThe caller loads 100 into HL, pushes it onto the stack, then calls add_score.\
    \ In this C compiler, the caller is responsible for cleaning up the stack, so\
    \ after the CALL returns it does a POP to discard the value it pushed.\n\n## 2.5\
    \ Logical Operations\n\nThe \"logical\" instructions combine the bits of two operands,\
    \ performing a bit (logic) operation on each:\n\n| Instruction | Operation | Description\
    \ |\n| :--- | :--- | :--- |\n| AND | A & B | Set bit if A and B are set. |\n|\
    \ OR | A | B | Set bit if A or B (or both) are set. |\n| XOR | A ~ B | Set bit\
    \ if either A or B are set, but not both (exclusive-or). |\n\nFor example, let's\
    \ AND a byte variable with the constant $1F:\n\n```\nxpos &= 0x1f;\n```\n\nFor\
    \ AND, if a bit was set in both the A register and the operand, it'll be set in\
    \ A after the instruction executes. Let's say xpos is initially $75:\n\n```\n\
    $75 01110101\n$1F 00011111\n----------------\n$15 00010101\n```\n\nThe AND operation\
    \ is useful for limiting the range of a value. For example, AND #$1F is the same\
    \ as (A mod 32), and the result will have a range of 0 to 31.\n\nWhat if we did\
    \ an OR instead?\n\n```\nxpos |= 0x1f;\n```\n\nOR sets bits if they are set in\
    \ either A or the operand, i.e. unless they are clear in both.\n\n```\n$55 01010101\n\
    OR $1F 00011111\n$5F 01011111\n```\n\nSometimes the compiler emits OR A,A just\
    \ to set the flags, usually to see if A is zero. Similarly, OR A,L tests the 16-bit\
    \ AL register both A and the operand are cleared.\n\nWhat about an XOR?\n\n```\n\
    xpos ^= 0x1f;\n```\n\nXOR (exclusive-or) is like an OR, except that bits that\
    \ are set in both A and the operand are cleared.\n\n```\n$55 01010101\nXOR $1F\
    \ 00011111\n$4A 01001010\n```\n\nNote that if we do the same XOR twice, we get\
    \ the original value back.\n\nIn addition, the SET, RES, and BIT instructions\
    \ set, clear, and test individual bits.\n\n## Hello 8-bit C World\n\nSince this\
    \ book is about programming to the bare metal of the hardware, we're going to\
    \ dissect a simple C program all the way to the bytes of the machine code.\n\n\
    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_29_0.png)\n\nFirst, let's talk about\
    \ the C compiler pipeline — the several steps that are needed to turn your source\
    \ code into a final ROM image that is loaded into the machine.\n\n## 3.1 Preprocessor\
    \ and Compiler\n\nMost programming tutorials include a single \"Hello, World!\"\
    \ example, which outputs a single line of text to the console. In keeping with\
    \ this tradition, this will be our sample C program for this chapter:\n\n```\n\
    #include <stdio.h>\n\nvoid main() {\n    printf(\"HELLO WORLD\"); // output some\
    \ text\n}\n```\n\n## 3.1 Preprocessor and Compiler\n\n> The first line of the\
    \ code is #include <stdio.h>. This is a directive that tells the preprocessor\
    \ to include the standard input-output header file, which contains the declaration\
    \ for the printf function.\n\nThe preprocessor also handles macros. A macro is\
    \ a piece of code that is given a name and defined. For example:\n\n```c\n#define\
    \ PI 3.14159\n```\n\nWhen the preprocessor encounters the macro name, it replaces\
    \ it with the defined value. This is useful for defining constants and other reusable\
    \ code.\n\nThe compiler then takes the preprocessed code and translates it into\
    \ assembly code. This is a complex process that involves many steps, including\
    \ lexical analysis, parsing, and code generation. In this book, we will focus\
    \ on the assembly code and how it interacts with the hardware.\n"
