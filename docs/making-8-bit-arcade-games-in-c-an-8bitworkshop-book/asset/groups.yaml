  - "[PAGE 77]\n\n# 10\nBinary-Coded Decimal\n\nUp to this point, we've only dealt\
    \ with bytes encoded in binary — which represent unsigned values from 0 to 255.\
    \ Now we're going to use binary-coded decimal or BCD values.\n\nBCD represents\
    \ numbers in a more human-readable format. Bytes are split in half, into two 4-bit\
    \ “nibbles,” which each contain a decimal digit from 0 to 9. In this scheme, the\
    \ hexadecimal value reads the same as the decimal representation. For example,\
    \ $00 to $09 are the same, but 10 is stored as $10, 11 is $11, all the way up\
    \ to $99.\n\nSome early computers used the BCD representation for their number-crunching,\
    \ and mainframes used them for processing financial data. They are still handy\
    \ in the 8-bit world, foremost because they are easier to render to the screen.\
    \ We don't have to divide by 10 to convert to decimal digits, because the decimal\
    \ digits are already part of the representation.\n\nTo extract the two digits\
    \ from a BCD byte, we just shift by 4 to isolate the first digit (the high nibble)\
    \ and mask by binary second digit (the low nibble):\n\n```\nvoid bcd2digits(byte\
    \ bcd) {\n  char digit1 = '0' + (bcd >> 4);\n  char digit2 = '0' + (bcd & 0xf);\n\
    }\n```\n\nIn C, we might find it handy to operate with 16-bit BCD numbers, which\
    \ hold a total of 4 decimal digits. Here's a"
