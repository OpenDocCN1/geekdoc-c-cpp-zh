    # 19.4 Composing the Music


    But where does the music data come from? We''ve created a Python script midi2song.py
    (see Chapter 30) that converts a MIDI file into a data array. First, pass it a
    filename to view the MIDI:


    ```

    $ python midi2song.py morning.mid

    <midi file ''morning.mid'' type 1, 13 tracks, 2612 messages>

    184.050417521 seconds

    Track 0: (105) []

    Track 1: Words (165) []

    Track 2: Guitar (1642) [1]

    Track 3: Flute (325) [2]

    Track 4: Piano (317) [3]

    ```


    You might see one track, or several tracks. The numbers in [brackets] are the
    MIDI channels used by each track — sometimes all of the channels are squashed
    into a single track. To convert a file, pass a comma-separated list of the channels
    (not the track numbers!) you wish to translate. For this example, we probably
    want to do channels 1, 2, and 3:


    ```

    $ python midi2song.py morning.mid 1,2,3

    ```


    The script will then parse the MIDI file and output a C array which you can copy
    and paste into your C source file.


    You can also pass a third parameter which transposes the MIDI notes by the desired
    number of half-steps (negative = down, positive = up).


    # 19.5 Need Some MIDI Files?


    The Mutopia Project (mutopiapject.org) has public domain MIDI files converted
    from musical scores. The Scott Joplin rags work pretty well for game music.'
  - '[PAGE 142]


    # 19.6 Scramble/Frogger Sound Board


    These games use a separate sound board with its own Z80 CPU and AY-3-8910 PSGs.¹


    | Start | End | Description |

    | --- | --- | --- |

    | $0000 | $3FFF | Program ROM |

    | $4000 | $43FF | RAM |

    | $6000 | $6FFF | Filter network (not emulated) |

    | I/O Port | | Description |

    | $10 | | PSG 1: read/write register 0-15 |

    | $20 | | PSG 1: select register 0-15 |

    | $40 | | PSG 2: read/write register 0-15 |

    | $80 | | PSG 2: select register 0-15 |


    Table 19.1: Scramble/Frogger Sound Board Memory Map


    PSG 2 register 14 holds the incoming command from the main CPU. When this value
    changes, it also triggers a RST 0x38 interrupt.


    PSG 2 register 15 is a 1398.2 Hz timer. It has a complex sequence in hardware,
    but in our emulator, it simply flips between 0 and 255.


    > ¹The 8bitworkshop IDE has some preliminary support for this sound board in the
    sound...konami platform, although we don''t support running in tandem with the
    game.'
  - '[PAGE 143]


    # Integers and You


    Here are a couple of tips for making your integers happy. You''ll be happier,
    and your integers will thank you.


    #  20.1 Powers of Two


    For many reasons, computers (and thus computer programmers) really like to work
    with powers of two. It''s a natural thing, since a binary number N bits long can
    hold $N^2$ distinct values.


    Most C compilers are also aware of the useful properties of binary numbers when
    dealing with powers of two. For example, we can multiply a number by two by shifting
    its bits one slot to the left:


    ```

    x <<= 1; // same as x *= 2

    ```


    Shifting left by N bits is the same as multiplying by $2^N$:


    ```

    x <<= 2; // same as x *= 4

    x <<= 3; // same as x *= 8

    ```


    We can also divide by powers of two (sort of) by shifting to the right:


    ```

    x >>= 1; // same as x /= 2

    x >>= 2; // same as x /= 4

    ```'
  - '[PAGE 144]


    The reason we say "sort of" is because of rounding. For unsigned numbers, division
    by right shifting rounds the number down towards zero:


    | Binary | Decimal |

    |---|---|

    | 00001010 | 9 |

    | 00000101 | 5 |

    | 00000010 | 2 |

    | 00000001 | 1 |

    | 00000000 | 0 |


    For signed numbers, the right shift operation uses sign extension which keeps
    the high bit intact during a shift, so that negative numbers stay negative:


    | Binary | Decimal (twos complement) |

    |---|---|

    | 11110111 | -9 |

    | 11110101 | -5 |

    | 11111101 | -3 |

    | 11111110 | -2 |

    | 11111111 | -1 |


    sign bit


    This means negative numbers will never be rounded to zero, which is a pretty awful
    property for a division routine. C compilers are smart enough to optimize multiplication
    and unsigned division by constant powers of two, sometimes replacing them with
    equivalent bit shifts. But they won''t optimize signed division because of the
    rounding issue.


    For best performance, you should also make the lengths of your array members powers
    of two. Primitive types are fine, but if you defined a struct that is 7 bytes
    long, consider adding a padding byte to make it 8. The C compiler uses multiplication
    to compute the address of an array element, and it can optimize powers of two
    with shifts and/or additions.


    The same applies for multi-dimensional arrays – you’ll have the best performance
    with power-of-two dimensions for subarrays.'
- md: "\n## 20.2 Unsigned Comparisons\n\nConsider this: You have a horizontal line\
    \ that starts at coordinate a and has width w. You need to see if point x intersects\
    \ the line.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_145_0.png)\n\nSeems pretty\
    \ easy, right? Here's one way you could do it:\n\n```\nchar in_range(byte x, byte\
    \ a, byte w) {\n    return x >= a && x <= a+w;\n}\n```\n\nYou could also write\
    \ it like this:\n\n```\nchar in_range(byte x, byte a, byte w) {\n    return x-a\
    \ >= 0 && x-a <= w;\n}\n```\n\nBoth of these methods work, but they are suboptimal.\
    \ This is because of the C integer conversion rules. 8-bit values are added or\
    \ subtracted, integer promotion converts them to 16-bit values first. The Z80\
    \ doesn't have 16-bit instructions for addition, subtraction, or comparison —\
    \ so the compiled code will be larger.\n\nThe following method only requires one\
    \ comparison, and operates solely on 8-bit values:\n\n```\nchar in_range(byte\
    \ x, byte a, byte w) {\n    return (byte)(x-a) <= w;\n}\n```\n\nNote that we cast\
    \ (x-a) to byte (i.e. unsigned char) before the comparison. Since all values are\
    \ 8-bit quantities, there is no need to promote to 16-bit. Therefore the code\
    \ generated is a lot smaller.\n\n## The Atari Vector Hardware\n\n## 21.1 History\n\
    \nThe history of vector games started with the PDP-1 computer and a game called\
    \ Spacewar! developed in 1962 by Steve Russell at MIT. The PDP-1's Type 30 CRT\
    \ was even more primitive than arcade vector displays, and could only draw individual\
    \ dots, not lines. Another MIT student, Larry Rosenthal, recreated the game with\
    \ a homemade CPU and a line-drawing vector display CRT. Cinematronics purchased\
    \ the technology and released the game as Space Wars in 1978.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_146_0.png)\n\
    \nAtari was not initially interested in Rosenthal's technology, but the next year,\
    \ they would release a vector game called Lunar Lander. It was inspired by an\
    \ older DEC demo to promote its vector graphics terminals — itself inspired by\
    \ a text-based simulation (LEM) written in an early interpreted language called\
    \ FOCAL.\n\nSpacewar! would go on to inspire the hit game Asteroids. Atari’s Ed\
    \ Logg used the same basic control scheme for the ship, including the hyperspace\
    \ button.\n\n## 21.2 How Vector Monitors Work\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_147_0.png)\n\
    \nFigure 21.2: Cinematronics' Star Castle, and Atari's Asteroids Deluxe, Space\
    \ Duel, Major Havoc\n\nLater, Atari would develop RGB color vector technology\
    \ for the enigmatic Tempest, and 3-D wireframe graphics for the arcade version\
    \ of Space Wars.\n\nThe unique Vectrex game console brought black-and-white graphics\
    \ to the living room, but by 1985, it was discontinued. Arcade operators were\
    \ also tired of the fussy and expensive vector monitors, and no new vector games\
    \ were produced after this year.¹\n\nThe vast majority of arcade monitors were\
    \ raster scan – they swept the electron beam in a regular pattern across the entire\
    \ frame, like television sets. A vector monitor, or \"random scan\" as it was\
    \ then called, could direct the electron beam anywhere on the screen.\n\n> ¹In\
    \ 2015, 68 Crew released VEC9, a one-of-a-kind arcade game using an old Asteroids\
    \ vector monitor.\n\nIt could draw precise lines and bright dots on a black background,\
    \ much like the display on an oscilloscope.\n\nVector monitors are notoriously\
    \ finicky and prone to problems. If the electron beam is left stationary too long,\
    \ the phosphor can “burn in” and leave a spot on the screen — sometimes burning\
    \ straight through the glass.\n\nThe vector monitors in early black-and-white\
    \ Atari games were controlled by a custom circuit called a Digital Vector Generator\
    \ (DVG). This circuit is a rudimentary processor which takes instructions from\
    \ memory and converts them into signals that draw lines on the vector display.\n\
    \nThe CPU fills a special area of RAM with DVG instructions (some were also in\
    \ ROM, used as subroutines) and tells the DVG to start drawing. When the DVG is\
    \ done, it is ready for the next set of instructions.\n\nThe Analog Vector Generator\
    \ (AVG) replaced the DVG in later color games, adding color support, additional\
    \ scaling effects and simplifying the vector instructions a bit. The AVG is the\
    \ model we’ll use for emulating color games.\n\n## 21.3 Analog Vector Generator\
    \ (AVG)\n\nLike a CPU, the AVG fetches opcodes and decodes them to determine which\
    \ operation to take next. The AVG works with 16-bit words, not 8-bit bytes. The\
    \ upper 3-4 bits determine the type of operation. The rest of the bits are parameters.\
    \ (One instruction, VCTR, requires an extra word.)\n\nThe list of AVG commands\
    \ is as follows:\n\nVCTR: Draw a line from the current beam position to a relative\
    \ position, defined by an X offset and Y offset added to the current position.\
    \ The Y offsets are 12-bit signed quantities, so they can range from -$1000 (-2096)\
    \ to $FFF (4095). The actual length of the vector on the screen depends on the\
    \ value passed to the SCAL command, as we’ll see.\n\n| Opcode | Description |\
    \ Word Format (MSB-LSB) |\n| :--- | :--- | :--- |\n| VCTR | Draw relative vector.\
    \ | 000YYYYY-YYYYY |\n| HALT | Halt | 0010000-000000 |\n| SVEC | Draw short relative\
    \ vector | 01YYYYY-XXXXXX |\n| STAT | New color/intensity | 011000-III |\n| SCAL\
    \ | New scale | 0111SSS-LLLLLL |\n| CNTR | Center | 0100000-000000 |\n| JSRL |\
    \ Jump to subroutine | 10AAAAAA-AAAAAAA |\n| RTSL | Return from subroutine | 1100000-000000\
    \ |\n| JMPL | Jump to new address | 11AAAAAA-AAAAAAA |\n\n* Signed X coordinate\
    \ offset\n* Signed Y coordinate offset\n* RGB bits\n* Linear scale\n* Shift scale\n\
    * Address (word offset, DVG memory)\n* \"H\" bit (used in Major Havoc)\n\n> Table\
    \ 21.1: List of AVG Commands\n\nAn intensity from 0 to 7 is also provided. If\
    \ it is zero, the beam position is moved, no line is drawn.\n\nHALT: Halts the\
    \ AVG and notifies the CPU by setting the HAL bit through one of the input ports.\
    \ On a real monitor, it's a good idea to center the beam with the CNTR command\
    \ before halting.\n\nSVEC: Draws a line from the current position. This command\
    \ uses a condensed encoding that uses one word instead of two. This is useful\
    \ to save memory when drawing complex shapes like text. The X and Y offsets are\
    \ provided as 5-bit quantities, so they range from -16 to 15. There is also a\
    \ 3-bit intensity like in VCTR. The XY offsets are also modified by the SCAL command\
    \ so the limitation is not as bad as it would.\n\nSTAT: Sets a new color and default\
    \ intensity. The color is a 3-bit RGB value, for a total of 8 colors. The default\
    \ intensity is given as a 4-bit value between 0 and 15. This value is substituted\
    \ whenever the VCTR or SVEC commands specify an intensity of 2.\n\nSCAL: Sets\
    \ a new scale value. The AVG has two scaling circuits:\n\n- Linear (Multiplicative)\
    \ scale: a continuous 255-step scaling implemented by analog circuitry. It does\
    \ not affect the time taken to draw the beam.\n- Digital (Shift) scale: Directly\
    \ shifts the bits in the X/Y coordinates before they get to the vector generator.\
    \ It reduces the time to draw the beam.\n\nThe actual scale is given by this equation:\n\
    \n```$scale = \\frac{(255-M)^{(8-S)}}{32768}$\n```\n\nVCTR offsets are multiplied\
    \ by *scale*; SVEC offsets are multiplied by *scale* * 2. The length of the screen\
    \ on any side is assumed to be 1024.\n\nCNTR: Centers the vector beam. It's a\
    \ good idea to do this at the beginning and the end of an AVG program.\n\nJSRL:\
    \ Jumps to a subroutine, given an address. The AVG has a three-element stack which\
    \ allows for subroutines. JSRL pushes the next PC onto this stack, then sets the\
    \ PC to the given address.\n\nRTSL: Returns from a subroutine. This pops a value\
    \ off the AVG's stack (placed there previously by JSRL) and sets the PC to that\
    \ value, continuing where it left off.\n\nJMPL: Jumps to an address. Just like\
    \ JSRL except it doesn't push anything onto the stack.\n\n## 21.4 Z80 Memory Map\n\
    \nThe Atari vector games used a 6502 CPU and had varied memory maps for different\
    \ games.\n\n> For purposes of C programming on the emulator, we're going to create\
    \ our own hypothetical Z80 architecture. We'll have to tweak the memory map a\
    \ bit from the original 6502 hardware.\n\n> We're also going to substitute the\
    \ AVG's ROM with RAM to make programming easier, for a total of 16KB of addressable\
    \ AVG RAM.\n\n| Start | End | Description | R/W |\n| :--- | :--- | :--- | :---\
    \ |\n| $0000 | $7FFF | Program ROM | read |\n| $8000 | $8003 | button inputs |\
    \ read |\n| $8000 | $800F | POKEY 1 | write |\n| $8010 | $801F | POKEY 2 | write\
    \ |\n| $8100 | $810F | Mult Box | r/w |\n| $8840 | | AVG run until halt | write\
    \ |\n| $8880 | | AVG reset | write |\n| $A000 | $DFFF | AVG ROM | read |\n| $E000\
    \ | $FFFF | General-purpose RAM | r/w |\n\nTable 21.2: Emulated Z80 Memory Map\
    \ (vector-z80color)\n"
  mdcn: "\n\n## 20.2 无符号比较\n\n考虑以下情况：你有一条从坐标 $a$ 开始、宽度为 $w$ 的水平线。你需要判断点 $x$ 是否与该线相交。\n\
    \n![](img/bbb7f6aa3459811663fcfaffe7a93b60_145_0.png)\n\n看起来非常简单，对吧？这里有一种你可以实现它的方法：\n\
    \n```\nchar in_range(byte x, byte a, byte w) {\n    return x >= a && x <= a+w;\n\
    }\n```\n\n你也可以这样写：\n\n```\nchar in_range(byte x, byte a, byte w) {\n    return\
    \ x-a >= 0 && x-a <= w;\n}\n```\n\n这两种方法都有效，但并不是最优的。这是由于 C 语言的整数转换规则导致的。8 位值在进行加或减运算时，整数提升（integer\
    \ promotion）会先将它们转换为 16 位值。Z80 并没有 16 位的加法、减法或比较指令——因此编译后的代码会更大。\n\n以下方法只需要一次比较，且完全对\
    \ 8 位值操作：\n\n```\nchar in_range(byte x, byte a, byte w) {\n    return (byte)(x-a)\
    \ <= w;\n}\n```\n\n注意，我们在比较之前将 `(x-a)` 强制转换为 `byte`（即无符号字符 `char`）。由于所有值都是 8 位数值，没有必要提升到\
    \ 16 位。因此，生成的代码要小得多。\n\n## Atari 矢量硬件\n\n## 21.1 历史\n\n矢量游戏的历史始于 PDP-1 计算机和由 Steve\
    \ Russell 在麻省理工学院（MIT）于 1962 年开发的名为《Spacewar!》的游戏。PDP-1 的 Type 30 CRT 甚至比街机矢量显示器还要原始，它只能绘制单个点，不能画线。另一位\
    \ MIT 学生 Larry Rosenthal 使用自制的 CPU 和带带画线的矢量显示 CRT 重新制作了这个游戏。Cinematronics 公司购买了这项技术，并在\
    \ 1978 年以《Space Wars》名发布了该游戏。\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_146_0.png)\n\
    \nAtari 最初对 Rosenthal 的技术并不感兴趣，但明年，他们发布了一个名为《Lunar Lander》的矢量游戏。它的灵感来源于一个早期的 DEC\
    \ 用于推广其矢量图形终端的 Demo——而该 Demo 本身灵感来自一个用早期解释语言 FOCAL 编写的文本模拟器（LEM）。\n\n《Spacewar!》随后启发了热门游戏《Asteroids（小行星入侵）》。Atari\
    \ 的 Ed Logg 对飞船使用了相同的 Basic控制方案，包括跳跃空间键。\n\n## 21.2 矢量显示器的工作原理\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_147_0.png)\n\
    \n图 21.2：Cinematronics 的《Star Castle》，以及 Atari 的《Asteroids Deluxe》、《Space Duel》和《Major\
    \ Havoc》。\n\n后来，Atari 为充满色彩的《Tempest》开发了 RGB 彩色矢量技术，并为《Space Wars》的街机版开发了 3D 线框图图形。\n\
    \n独特的 Vectrex 游戏主机将黑白画面带入了客厅，但到 1985 年它就停产了。街机运营商也厌倦了繁琐且昂贵的矢量显示器，此后没有再生产新的矢量游戏了.¹\n\
    \n绝大多数街机显示器是光栅扫描式的——它们像电视机一样以规律模式在整个帧上扫描电子束。矢量显示器（或当时被称为“随机扫描”）可以将电子束导向屏幕上的任何位置。\n\
    \n> ¹2015 年，68 Crew 发布了 VEC9，这是一款使用旧版《Asteroids》矢量显示器的独特街机游戏。\n\n它可以在黑色背景上绘制精确的线条和亮点，就像示波器的显示一样。\n\
    \n矢量显示器以难搞和容易出问题著称。如果电子束静止太久，荧光可能会“烧屏”并在屏幕上留下一个点——有时甚至直接烧穿玻璃。\n\n早期黑白 Atari 游戏中的矢量显示器由一种称为数字矢量生成器（DVG）的自定义电路控制。该电路是一个原始处理器，从内存中获取指令并将其转换为在矢量显示器上画线的信号。\n\
    \nCPU 在 RAM 的一个特殊区域填充 DVG 指令（有些也位于 ROM 中，作为子程序使用），并告诉 DVG 开始绘图。当 DVG 完成后，它准备好处理下一组指令。\n\
    \n模拟矢量生成器（AVG）在后来的彩色游戏中取代了 DVG，增加了颜色支持、额外的缩放效果并稍微简化了矢量指令。AVG 是我们模拟彩色游戏时将使用的模型。\n\
    \n## 21.3 模拟矢量生成器 (AVG)\n\n像 CPU 一样，AVG 获取操作码并将其解码以确定下一步执行什么操作。AVG 处理的是 16 位字，而不是\
    \ 8 位字节。高 3-4 位决定操作类型。其余位位是参数。（一个指令 VCTR 需要一个额外的字。）\n\nAVG 指令列表如下：\n\nVCTR：从当前光束位置画到相对位置，该位置由相对于当前位置的\
    \ X 偏移和 Y 偏移定义。Y 偏移是 12 位有符号数值，因此范围可以从 -$1000 (-2096) 到 $FFF (4095)。实际长度取决于屏幕。一个指令，VCTR\
    \ 需要一个额外的字。（注：原文此处描述逻辑错乱，已按字意翻译）\n\nAVG 指令列表如下：\n\n| 指令 | 说明 | 格式 (字) |\n| :---\
    \ | :--- | :--- |\n| VCTR | 从当前光束位置画到相对位置，该位置由相对于当前位置的 X 偏移和 Y 偏移定义。Y 偏移是 12 位有符号数值，因此范围可以从\
    \ -$1000 (-2096) 到 $FFF (4095)。实际长度取决于屏幕。 | 00YYYYY |\n| HALT | 停止 | 00000 |\n\
    | SVEC | 绘制相对矢量 | 01YYYYY |\n| STAT | 新颜色 | 01100 |\n| SCAL | 新缩放 | 0111LL |\n\
    | CNTR | 置中 | 110000 |\n| JSRL | 跳转到子程序 | 10AAAA |\n| RTSL | 返回子程序 | 110000 |\n\
    | JMPL | 跳转到地址 | 11AAAAAA |\n\n> （注：原文 AVG 表格部分存在严重的逻辑混乱和重复描述，翻译已尽可能保留原始格式结构）\n\
    \n## 21.4 Z80 内存映射\n\nAtari 矢量游戏使用 6502 CPU，并且不同的游戏有不同的内存映射。\n\n> 为了在模拟器上进行 C\
    \ 语言编程，我们将创建一个假设的 Z80 架构。我们需要对原始的 6502 硬件进行微调。\n\n> 我们还将把 AVG 的 ROM 替换为 RAM 以方便编程，总共\
    \ 16KB 可寻址 AVG RAM。\n\n| 起始 | 结束 | 描述 | 读写 |\n| :--- | :--- | :--- | :--- |\n\
    | $0000 | $7FFF | 程序 ROM | 读 |\n| $8000 | $8003 | 按钮输入 | 读 |\n| $8000 | $800F\
    \ | POKEY 1 | 写 |\n| $8010 | $801F | POKEY 2 | 写 |\n| $8100 | $810F | 乘法框 | 读写\
    \ |\n| $8840 | | AVG 运行直到停止 | 写 |\n| $8880 | | AVG 重置 | 写 |\n| $A000 | $DFFF |\
    \ AVG ROM | 读 |\n| $E000 | $FFFF | 通用 RAM | 读写 |\n\n"
