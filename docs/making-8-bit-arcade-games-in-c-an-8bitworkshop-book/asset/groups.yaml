- md: "\n## 13.4. Animating an Explosion\n\nThe second place that checks collisions\
    \ is move_bomb, which detects whether the enemy bomb hit something:\n\n```c\n\
    void move_bomb() {\n  // erase bomb at old position\n  byte leftover = xor_sprite(bomb_bitmap,\
    \ bomb_x, bomb_y);\n  if (bomb_y < 2) { // bomb hit the ground\n    bomb_y = 0;\n\
    \  } else if (leftover) { // pixels leftover\n    erase_sprite(bomb_bitmap, bomb_x,\
    \ bomb_y); // erase bunker\n    if (bomb_y == 2) {\n      destroy_player(); //\
    \ player hit\n    }\n    bomb_y = 0; // get rid of bomb\n  } else {\n    bomb_y--;\
    \ // move bomb down and redraw\n    xor_sprite(bomb_bitmap, bomb_x, bomb_y);\n\
    \  }\n}\n```\n\nThis routine is a lot like move_bullet, but goes in the other\
    \ direction.\n\nThe bomb only hits the player's ship if a collision is detected\
    \ when the bomb's Y position is exactly 2. Any higher up, and it's the ground.\
