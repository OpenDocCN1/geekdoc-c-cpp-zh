    | 001B C1 [10] 149 pop bc |

    | 001C F1 [10] 150 pop af |

    | 001D ED 4D [14] 151 |


    This is boilerplate interrupt handler code. It pushes all of the register pairs
    (5 16-bit registers, or 10 8-bit registers in all) to the stack before the function
    starts, and pops them back from the stack before the function exits. Because the
    interrupt can happen while executing any bit of code, we must preserve all the
    registers so that the code that was interrupted doesn''t get confused.


    It also uses a RETI instruction at the instead of RET. (The EI instruction at
    the beginning is for systems with stackable interrupts, which doesn''t apply to
    us.)


    We can now define the scanline96 function, which will be used by the RST $08 handler
    defined earlier:


    ```

    void scanline96() __interrupt {

    }

    ```


    It will have the same PUSH and POP boilerplate code as the other interrupt function.


    Right now, these interrupt handlers don''t do anything. We''ll use interrupts
    in Chapter 18 to synchronize our screen writes with the raster beam that we avoid
    flicker.


    > Many programs, including the original Space Invaders, use the interrupt handlers
    to execute jobs from a task list. This design ensures that animated objects are
    drawn every frame and also out of the way of the raster beam. In the examples
    in this book, we use the interrupt routines only for counting frames and draw
    everything in the main loop.


