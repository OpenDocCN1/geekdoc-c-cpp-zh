    \ 表达式是一个类型转换——它将无类型 `(void*)` 指针转换为类型 `(Actor*)` 指针，因为我们打算将分配的内存作为 `Actor` 结构体。\n\
    \n当我们不再需要分配的内存时，只需对 `malloc` 返回的指针调用 `free`：\n\n```\nfree(a);\n```\n\n在使用 `malloc`\
