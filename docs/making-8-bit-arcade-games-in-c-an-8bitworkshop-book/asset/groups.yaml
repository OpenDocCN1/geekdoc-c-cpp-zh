  - '[PAGE 201]


    # Run-Length Encoding


    > To see it on 8bitworkshop.com: Select the Williams (Z80) platform, then select
    the RLE Bitmap file.


    The Williams hardware is capable of drawing quite large bitmaps. You are really
    only limited by the size of the ROM, which can only hold one uncompressed screen-sized
    bitmap. Unless you have some fancy bank-switching hardware, you might have to
    use data compression.


    Most modern data compression methods, like those found in JPEG images or ZIP files,
    require a lot of memory and/or CPU time, but early methods still work fine. Run-length
    encoding (RLE) is a simple method for compressing data that has long sequences
    of identical bytes. Bitmaps with solid colors often work well with RLE compression.


    RLE breaks up data into packets of finite length. The first byte of the packet
    usually gives the length and the type of the packet — in our scheme, the high
    bit determines the type. A “run” packet outputs a string of identical bytes —
    for instance, this packet outputs makes 7 copies of the byte $A5 (first byte is
    $87 since high bit is set):


    87 A5'
  - '[PAGE 202]


    A “copy” packet just copies the bytes from the packet verbatim. For example, this
    packet outputs the numbers 1 through 5:


    ```

    05 01 02 03 04 05

    ```


    Since we are drawing images, we convert each byte into a pixel and draw them to
    the screen in a raster pattern (left-to-right, then up-to-down).


    Getting a bitmap into RLE format is tricky, because the computing world has largely
    moved on to better compression techniques. The Truevision TGA format supports
    RLE encoding, and programs like ImageMagick convert into this format. It could
    be even more efficient if you repacked the data into 4 bits per pixel.'
