    | Byte A + | 1 | 0 | 1 | 0 | 0 | 1 | 0 | 1 |

    | Byte B + | 1 | 0 | 1 | 1 | 0 | 1 | 1 | 0 |

    | Carry | 1 | 1 | | | | | | |

    | = | | 0 | 1 | 0 | 1 | 1 | 0 | 1 |


    Table 1.1: Binary Addition of Two Bytes With Carry


