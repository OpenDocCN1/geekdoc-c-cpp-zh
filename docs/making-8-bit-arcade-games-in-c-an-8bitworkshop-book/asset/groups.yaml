    \n在一个通道上，通过设置低/高音调周期寄存器来选择所需的频率。通道的音调频率由该公式定义：\n\nFrequency = \\frac{Clock}{16*TonePeriod}\n\
    \n在大多数设计中，时钟频率为 3.57945 MHz。周期 0 是无效的（数据手册甚至没有说会什么，但那时候的人知道不要除以零！）\n\n你也可以这样重排公式：\n\
    \nTonePeriod = \\frac{Clock}{16*Frequency}\n\n使用我们的 `set8910` 函数，可以这样设置音调周期（假设\
    \ period 是 16 位变量）：\n\n```c\nset8910(channel+2+0, period & 0xff); // 低位\nset8910(channel+2+1,\
    \ period >> 8); // 高位\n```\n\n"
