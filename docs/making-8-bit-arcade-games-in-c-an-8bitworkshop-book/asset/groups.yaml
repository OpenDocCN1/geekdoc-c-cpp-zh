    \ the SDCC compiler, using the __at keyword seems to imply volatile, but we're\
    \ trying to create good habits here!)\n\nGiven all that, here is a function to\
    \ use the MB14241 to draw a shifted version of a sprite at an X and Y coordinate.\n\
    \n```\nvoid draw_shifted_sprite(const byte* src, byte x, byte y, byte y) {\n \
    \ byte i,j;\n  byte* dest = &vidmem[x][y]>>;\n  byte w = *src;\n  byte h = *src++;\n\
    \  bitshift_offset = y & 7;   // // shift shift amount (0-7)\n  for (j=0; j<h;\
    \ j++) {\n    bitshift_value = 0; // write zero padding\n    for (i=0; i<w; i++)\
    \ {\n      bitshift_value = *src++; // write next sprite byte\n      *dest++ =\
    \ bitshift_read; // read next shifted byte\n    }\n    bitshift_value = 0; //\
    \ write zero padding\n    *dest++ = bitshift_read; // read last shifted byte\n\
    \  }\n  dest += 31-w;\n}\n```\n\nNote that we use zero padding both before and\
    \ after writing a line of the sprite. If our background was white, we'd write\
    \ a 0xff instead.\n\n> To see it on 8bitworkshop.com: Select the Midway 8080 platform,\
    \ then select the Sprite w/ Bit Shifter file."
