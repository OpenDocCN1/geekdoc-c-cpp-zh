    We've been keeping Enable flags in a local variable. Next we actually set the\
    \ Enable register, inverting all the bits since a 1 disables the corresponding\
    \ channel, and a 0 enables it:\n\n```\nset8910a(AY_ENABLE,~enable); // set enable\
    \ flags\n```\n\n# 18.9 Keeping in Sync with Interrupts\n\nWe discussed Mode 0\
    \ interrupts in Chapter 13. This system uses another Z80 interrupt mode, Mode\
    \ 2. In this mode, an interrupt always causes a jump to address 66. Since our\
    \ C compiler doesn't have a way to position functions, we have to add a bunch\
    \ of functions that take up room until our interrupt routine is positioned exactly\
    \ where we need — which is offset $66.\n\nInline assembly is good for this purpose.\
    \ The LD ix,#0 takes 4 bytes, we can repeat it along with a one-byte NOP until\
    \ we reach address $66. We can declare a dummy function and play with it until\
    \ we get the desired result:\n\n```\nvoid _buffer() {\n  _asm\n  ld ix,#0\n  ld\
    \ ix,#0\n  ...\n  nop\n  _endasm;\n}\n```"
  - "[PAGE 136]\n\n# 18.9. Keeping in Sync with Interrupts\n\nOur interrupt handler\
    \ increments a counter every time a VSYNC occurs at the start of each video frame,\
    \ i.e., every 1/60 second:\n\n```\nvolatile word video_framecount;\n\nvoid rst_66()\
    \ __interrupt {\n    video_framecount++; // increment video framecount\n}\n```\n\
    \nSince our main loop takes a variable number of CPU cycles depending on the activity\
    \ on-screen, we need a way to keep our video frame rate consistent.\n\nOne solution\
    \ is to keep another counter in our main loop. Then we compare the video counter\
    \ against our game loop's framecounter, and spin the CPU as long as they are equal:\n\
    \n```\nvoid wait_for_frame() {\n    while (((video_framecount^framecount) & 3)\
    \ == 0);\n}\n```\n\nAs long as the game loop takes less than 1/60 second, the\
    \ loop will stay in sync with the counter. But if our loop takes longer than that,\
    \ the counter will go out of sync, and the main loop will no longer wait for the\
    \ video signal. It'll get back in sync eventually.\n\nWe only compare the first\
    \ two bits of the counters, so that it takes less time to get back in sync.\n\n\
    > On the Galaxian/Scramble platforms, the main loop must acknowledge an interrupt\
    \ to allow interrupts to continue. This is done by setting enable_irq to 0 and\
    \ then 1."
- md: "\nPlaying music on the AY-3-8910 is just a matter of setting the right frequencies\
    \ at the right times (isn't that true of all music?)\n\n> To see it on 8bitworkshop.com:\
    \ Select the VIC Dual platform, then select the Music Player file.\n\n## 19.1\
    \ Hitting the Right Note\n\nFirst, we need to create a table that maps musical\
    \ notes to their period register values. If we count the first key on a standard\
    \ 88-key piano as 1, the frequency of a note is given by this equation:\n\n$F_{A4}\
    \ = \\frac{2(\\text{note}-49)}{12}$\n\nA4 is the frequency of the musical note\
    \ A above middle C, often called A4 or A440, since its standard frequency is 440\
    \ Hz.\n\nSince the Tone Period register can only store integer values, we cannot\
    \ get all notes exactly on pitch. The tuning error increases rapidly as the notes\
    \ get higher in pitch, since the integer divisor gets closer to zero.\n\nHowever,\
    \ we can choose a value for A4 to minimize the tuning error in a certain note\
    \ range. Generally, we have to give up accuracy in higher frequencies to get more\
    \ accurate lower frequencies. Compare the two charts below to see how choosing\
    \ A4 = 440.5 makes notes 49 and below more accurate:\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_138_0.png)\n\
    \nNote 19.1: Note frequency error at 440.0 Hz\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_138_1.png)\n\
    \nFigure 19.2: Note frequency error at 440.5 Hz\n\nWe've provided a Python script\
    \ mknotes.py (see Chapter 30) that figures out the best A4 value for a given range\
    \ of notes, and then generates a C array containing the Tone Period register values\
    \ for all the notes. Its first parameter is the highest note for which to optimize,\
    \ and the second parameter is the number of notes to output. For example:\n\n\
    ```python\nmknotes.py 49 64\n```\n\n## 19.2 Laying out the Score\n\nNow we just\
    \ need to list the notes we want to play in order, right?\n\n```\nconst byte music_score_all_at_once[]\
    \ = {\n  0x2c, 0x0d, 0x2e, 0x2f, 0x2e, 0x2c, 0x12 ...\n};\n```\n\nNot so fast!\
    \ We also need to know how much time elapses between each note, or each set of\
    \ notes. If the high bit is set, we decode the byte as a duration. When we hit\
    \ a duration byte, we pause for the given number of video frames (i.e. duration/60\
    \ sec) keeping whatever notes are playing.\n\n```\nconst byte music_score[] =\
    \ {\n0x2c, // note 44\n0x81, // duration 1\n0x0d, // note 13\n0x8d, // duration\
    \ 13\n0x2e, // note 46\n0x2f, // note 47\n0x86, // duration 6\n};\n```\n\nWe only\
    \ have 3 channels in the AY-38910 PSG, so we can only try to play a 4th note while\
    \ there are 3 playing, we'll have to either ignore it, or choose a currently-playing\
    \ note to interrupt.\n\n## 19.3 Swinging with the Tempo\n\nFirst we need to keep\
    \ track of the three PSG voices. For now, we just need to track the volume for\
    \ each:\n\n```\nstruct {\n  byte volume;\n} voice[3];\n```\n\nEvery video frame,\
    \ we'll call play_music to update the PSG values. First it sets the volume for\
    \ each channel, decrementing it frame to give a “pizzicato” effect:\n\n```c\n\
    void play_music() {\n  byte ch;\n  byte enable = 0; // channel enable flags\n\
    \  byte free = 0; // free channel\n  byte chmask = 1; // this channel's enable\
    \ flag\n  for (ch=0; ch<3; ch++) {\n    if (voice[ch]).volume -- {\n      set89910(AY_ENV_VOL_A+ch,\
    \ voice[ch].volume--);\n      enable |= chmask; // enable channel\n    } else\
    \ {\n      freech = ch; // this channel is free\n      chmask <<= 1; // next channel’s\
    \ enable flag\n    }\n  }\n}\n```\n\nThe enable variable tracks currently-playing\
    \ channels, we’ll use this to set the Enable register:\n\n```c\nset8910(AY_ENABLE,\
    \ ~enable); // set channel flags\n```\n\nWe also update refresh whenever we see\
    \ an unused channel, so if we play a new note, we’ll know which channel to use.\n\
    \nThe next step is to play new notes. If cur.duration is zero, we fetch the next\
    \ byte from music data. If it has the high bit set, we update cur.duration. Otherwise,\
    \ it’s a note value, we look up its value in note.table and set the Tone Period\
    \ of the corresponding channel, and also set a new volume in the voice array:\n\
    \n```c\nif (music_ptr) {\n    ch = freech; // first free channel\n    while (cur.duration\
    \ == 0) {\n        note = next_music_byte(); // get next byte\n        if (note\
    \ & 0x80) { // hi bit set = note\n            int period = note_table[note & 63];\
    \ // set pitch\n            set8910(AY_PITCH_LO+ch*2, period & 0xff);\n      \
    \      voice[ch].volume = 15; // set volume\n            ch = ch - 1; // use next\
    \ channel\n        } else {\n            if (note == 0xff) { // end of song\n\
    \                music_ptr = NULL;\n                cur_duration = note & 63;\
    \ // set duration\n            }\n        }\n    }\n    cur_duration--;\n}\ncondition\
    \ ? expr1 : expr2; // If condition is true, evaluates expr1, otherwise expr2.\n\
    ```\n\n## 19.4 Composing the Music\n\nBut where does the music data from? We've\
    \ created a Python script midi2song.py (see Chapter 30) that converts a MIDI file\
    \ into a data array. First, pass it a filename to view the MIDI:\n\n```bash\n\
    $ python midi2song.py morning.mid\n<midi file 'morning.mid' 1, tracks, 26 messages,\
    \ 45 seconds>\nTrack 0: (5)\nTrack 1: (5)\nTrack 2: Guitar (4)\nTrack 3: Flute\
    \ (2)\nTrack 4: Piano (3)\n```\n\nYou might see one track, or several tracks.\
    \ The numbers in brackets are MIDI channels used by each track — sometimes all\
    \ of channels are squashed into a single track. To convert a file, pass a comma-separated\
    \ list of the channels you wish to translate. For example, we probably want to\
    \ do channels 1, 2, and 3:\n\n```bash\n$ python midi2song.py morning.mid 1,2,3\n\
    ```\n\nThe script will then parse the MIDI file and output a C array you can copy\
    \ and paste into your source file. You can also pass a third parameter which transposes\
    \ the MIDI notes by the desired number of half-steps (negative = down, positive\
    \ = up).\n\n## 19.5 Need Some Files?\n\nThe Mutopia Project (mutopia.org) has\
    \ public domain MIDI files converted from musical scores. The Scott Joplin rags\
    \ work well for game music.\n\n## 19.6 Scramble/Frogger Sound Board\n\nThese games\
    \ use a separate sound board with its own Z80 CPU and AY-38910 PSGs.¹\n\n| Start\
    \ | End | Description |\n| :--- | :--- | :--- |\n| $0000 | $3FFF | Program ROM\
    \ |\n| $4000 | $43FF | RAM |\n| $6000 | $FFFF | Filter network (not emulated)\
    \ |\n| I/O Port | | Description |\n| $10 | | PSG 1: read/write register 0-15 |\n\
    | $20 | | PSG 1: select register 0-15 |\n| $40 | | PSG 2: read/write register\
    \ 0-15 |\n| $80 | | PSG 2: select register 0-15 |\n\n**Table 19.1: Scramble/Frogger\
    \ Sound Board Memory Map**\n\nPSG 2 register 14 holds the incoming command from\
    \ the main CPU. When this value changes, it also triggers a RST 0x38 interrupt.\n\
    \nPSG 2 register 15 is a 1398.2 Hz timer. It has a complex sequence in hardware,\
    \ but in our emulator, it simply flips between 0 and 255.\n\n¹The 8bitworkshop\
    \ IDE has some preliminary support for this sound board in the soundkonami platform,\
    \ although we don't support running in tandem with the game.\n\n## 20 Integers\
    \ and You\n\nHere are a couple of tips for making your integers happy. You'll\
    \ be happier, and your integers will thank you.\n\n## 20.1 Powers of Two\n\nFor\
    \ many reasons, computers (and thus computer programmers) really like to work\
    \ with powers of two. It's a natural thing, since a binary number N bits long\
    \ can hold $2^N$ distinct values. Most C compilers are also aware of the useful\
    \ properties of binary numbers when dealing with powers of two. For example, we\
    \ can multiply a number by two by shifting its bits one slot to the left:\n\n\
    ```c\nx <<= 1; // same as x *= 2\n```\n\nShifting left by N bits is the same as\
    \ multiplying by $2^N$:\n\n```c\nx <<= 2; // same as x *= 4\nx <<= 3; // same\
    \ as x *= 8\n```\n\nWe can also divide by powers of two (sort of) by shifting\
    \ to the right:\n\n```c\nx >>= 1; // same as x /= 2\nx >>= 2; // same as x /=\
    \ 4\n```\n\nThe reason we say \"sort of\" is because of rounding. For unsigned\
    \ numbers, division by right shifting rounds the number down towards zero:\n\n\
    | Binary | Decimal |\n| :--- | :--- |\n| 00001010 | 9 |\n| 00000101 | 5 |\n| 00000010\
    \ | 2 |\n| 00000001 | 1 |\n| 00000000 | 0 |\n\nFor signed numbers, the right shift\
    \ operation uses sign extension which keeps the high bit intact during a shift,\
    \ so that negative numbers stay negative:\n\n| Binary | Decimal (twos complement)\
    \ |\n| :--- | :--- |\n| 11110111 | -9 |\n| 11110101 | -5 |\n| 11111101 | -3 |\n\
    | 11111110 | -2 |\n| 11111111 | -1 |\n\nThis means negative numbers will never\
    \ be rounded to zero, which is a pretty awful property for a division routine.\
    \ C compilers are smart enough to optimize multiplication and unsigned division\
    \ by constant powers of two, sometimes replacing them with equivalent bit shifts.\
    \ But they won't optimize signed division because of the rounding issue. For best\
    \ performance, you should also make the lengths of your array members powers of\
    \ two. Primitive types are fine, but if you defined a struct that is 7 bytes long,\
    \ consider adding a padding byte to make it 8. The C compiler uses multiplication\
    \ to compute the address of an array element, and it can optimize powers of two\
    \ with shifts and/or additions. The same applies for multi-dimensional arrays\
    \ – you’ll have the best performance with power-of-two dimensions for subarrays.\n"
  mdcn: "\n\n在 AY-3-8910 上播放音乐只是在正确的时间设置正确的频率的问题（所有的音乐不都是如此吗？）\n\n> 要想在 8bitworkshop.com\
    \ 上查看：选择 VIC Dual 平台，然后选择 Music Player 文件。\n\n## 19.1 击中准确的音符\n\n首先，我们需要创建一个表格，将音符映射到它们对应的周期寄存器值（period\
    \ register values）。如果我们把标准 88 键钢琴上的第一个键记为 1，那么音符的频率由以下方程给出：\n\n$F_{A4} = \\frac{2(\\\
    text{note}-49)}{12}$\n\nA4 是中音 C 之上音符 A 的频率，通常被称为 A4 或 A440，因为它的标准频率是 440 Hz。\n\
    \n由于音调周期寄存器（Tone Period register）只能存储整数值，我们无法获得完全音准的音音符。随着音高的升高，调准误差会迅速增加，因为整数除数越来越接近零。\n\
    \n然而，我们可以为 A4 选择一个值，以最小化特定音高范围内的调准误差。通常情况下，我们必须牺牲高频的精度来获得更准确的低频。对比下面的两张图，可以看到选择\
    \ A4 = 440.5 如何让音符 49 及以下的音更准确：\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_138_0.png)\n\
    \n注 19.1：440.0 Hz 下的音频误差\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_138_1.png)\n\
    \n图 19.2：440.5 Hz 下的音频误差\n\n我们提供了一个 Python 脚本 `mknotes.py`（见第 30 章），它可以为给定的音符范围计算最佳\
    \ A4 值，然后生成包含所有音符周期器值的 C 数组。它的第一个参数是需要优化的最高音，第二个参数是要输出的音符数量。例如：\n\n```python\n\
    mknotes.py 49 64\n```\n\n## 19.2 编写乐谱\n\n现在我们只需要按顺序列出想要播放的音符，对吧？\n\n```c\nconst\
    \ byte music_score_all_at_once[] = {\n  0x2c, 0x0d, 0x2e, 0x2f, 0x2e, 0x2c, 0x12\
    \ ...\n};\n```\n\n别急！我们还需要知道每个音符或每组音符之间经过了多久。如果高位被设置，我们将该字节解码为持续时间。当遇到持续时间字节时，我们会暂停给定的视频帧数（即\
    \ `duration/60` 秒），同时保持正在播放的音符不变。\n\n```c\nconst byte music_score[] = {\n0x2c,\
    \ // 音符 44\n0x81, // 持续 1\n0x0d, // 音符 13\n0x8d, // 持续 13\n0x2e, // 音符 46\n0x2f,\
    \ // 音符 47\n0x86, // 持续 6\n};\n```\n\nAY-38910 PSG 只有 3 个通道，所以当有 3 个音在播放时，我们只能尝试播放第\
    \ 4 个音，我们要么忽略它，要么选择一个正在播放的音来中断它。\n\n## 19.3 随节奏摇动\n\n首先，我们需要追踪三个 PSG 声道。目前，我们只需要跟踪每个声道的音量：\n\
    \n```c\nstruct {\n  byte volume;\n} voice[3];\n```\n\n每一帧都会调用 `play_music` 来更新\
    \ PSG 值。首先它设置每个通道的音量，每帧递减一次以产生“拨奏音”（pizzicato）效果：\n\n```c\nvoid play_music() {\n\
    \  byte ch;\n  byte enable = 0; // 通道启用标志\n  byte free = 0; // 空闲通道\n  byte chmask\
    \ = 1; // 当前通道的启用标志\n  for (ch=0; ch<3; ch++) {\n    if (voice[ch]).volume --\
    \ {\n      set89910(AY_ENV_VOL_A+ch, voice[ch].volume--);\n      enable |= chmask;\
    \ // 启用通道\n    } else {\n      freech = ch; // 此通道是空闲\n      chmask <<= 1; //\
    \ 下一个通道的启用标志\n    }\n  }\n}\n```\n\n`enable` 变量跟踪正在播放的通道，我们将用它设置启用寄存器：\n\n```c\n\
    set8910(AY_ENABLE, ~enable); // 设置通道标志\n```\n\n每当我们看到空闲通道时还会更新 `refresh`，这样当我们播放新音时，就知道该用哪个通道。\n\
    \n下一步是播放新音。如果 `cur.duration` 为零，我们从音乐数据中获取下一个字节。如果它的高位被设置，我们更新 `cur.duration`。否则，它是一个音符值，我们在\
    \ `note.table` 中查找其值并设置对应通道的 Tone Period，同时在 `voice` 数组中设置新的音量：\n\n```c\nif (music_ptr)\
    \ {\n    ch = freech; // 第一个空闲通道\n    while (cur.duration == 0) {\n        note\
    \ = next_music_byte(); // 获取下一个音乐字节\n        if (note & 0x80) { // 高位设置 = 音符\n\
    \            int period = note_table[note & 63]; // 设置音高\n            set8910(AY_PITCH_LO+ch*2,\
    \ period & 0xff);\n            voice[ch].volume = 15; // 设置音量\n            ch\
    \ = ch - 1; // 使用下一个通道\n        } else {\n            if (note == 0xff) { // 歌曲结束\n\
    \                music_ptr = NULL;\n            }\n            cur_duration =\
    \ note & 63; // 设置持续时间\n        }\n    }\n    cur_duration--;\n}\ncondition ?\
    \ expr1 : expr2; // 如果 condition 为真执行 expr1，否则执行 expr2。\n\n## 19.4 创作音乐\n\n但音乐数据来自哪里？我们创建了一个\
    \ Python 脚本 `midi2song.py`（见第 30 章），可以将 MIDI 文件转换为数组。首先传递文件名：\n\n```bash\n$ python\
    \ midi2song.py morning.mid\n<midi file 'morning.mid' 1, tracks, 26 messages>\n\
    Track 0: (5)\nTrack 1: (5)\nTrack 2: (4)\nTrack 3: (2)\nTrack 4: (3)\n```\n\n\
    你可能会看到一个轨道或多个轨道。括号中的数字是每个轨道使用的 MIDI 通道。转换文件时传递逗号分隔的通道列表。例如，我们可能想转换通道 1、2 和3：\n\
    \n```bash\n$ python midi2song.py morning.mid 1,2,3\n```\n\n脚本将解析 MIDI 文件并输出一个可以复制到源文件的数组。你还可以传递第三个参数，按所需的半音偏移\
    \ MIDI 音符（负值为降）。\n\n## 19.5 需要文件吗？\n\nMutopia Project (mutopia.org) 有从乐谱转换而来的公共领域\
    \ MIDI 文件。Scott Joplin 作品非常适合游戏。\n\n## 19.6 Scramble/Frogger 声板\n\n这些游戏使用带有独立\
    \ Z80 CPU 和 AY-3810 PSG 的独立声板¹\n\n| 起始 | 结束 | 描述 |\n| :--- | :--- | :--- |\n|\
    \ $0000 | $3FFF | 程序 ROM |\n| $4000 | $43FF | RAM |\n| $6000 | $FFFF | 滤波器网络（未模拟）\
    \ |\n| I/O Port | | 描述 |\n| $10 | | PSG 1: 读写寄存器 0-15 |\n| $20 | | PSG 1: 选择寄存器\
    \ 0-15 |\n| $40 | | PSG 2: 读写寄存器 0-15 |\n| $80 | | PSG 2: 选择寄存器 0-15 |\n\n**表\
    \ 19.1：Scramble/Frogger 声板内存映射**\n\nPSG 2 寄存器 14 保存来自主 CPU 的命令。当此值变化时，会触发 RST\
    \ 0x38 中断。\n\nPSG 2 寄存器 15 是一个 1398.2 Hz 时器。在硬件中有一个复杂的序列，但在模拟器中，它简单地在 0 和 255\
    \ 之间切换。\n\n¹8bitworkshop IDE 对 soundkonami 平台的声板有一些初步支持，尽管我们不支持与游戏同步运行。\n\n##\
    \ 20 整数与你\n\n这里有几个让你的整数心情愉快的小技巧。你会更快乐，你的整数也会感谢你。\n\n## 20.1 2 的幂\n\n出于许多原因，计算机（以及计算机程序员）非常喜欢处理\
    \ 2 的幂。这是自然现象，因为长度为 N 位的二进制数可以存储 $2^N$ 个不同的值。大多数 C 编译器在处理 2 的幂时也知道二进制数的特性。例如，我们可以通过将位左移一位将数字乘以\
    \ 2：\n\n```c\nx <<= 1; // 等于 x *= 2\n```\n\n左移 N 位等于乘以 $2^N$：\n\n```c\nx <<= 2;\
    \ // 等于 x *= 4\nx <<= 3; // 等于 x *= 8\n```\n\n我们也可以通过右移在某种程度上除以 2 的幂：\n\n```c\n\
    x >>= 1; // 等于 x /= 2\nx >>= 2; // 等于 x /= 4\n```\n\n我们之所以说“某种”，是因为舍入。对于无符号数，右移除法会将数字向零取整：\n\
    \n| 二进制 | 十进制 |\n| :--- | :--- |\n| 00001010 | 9 |\n| 00000101 | 5 |\n| 00000010\
    \ | 2 |\n| 00000001 | 1 |\n| 00000000 | 0 |\n\n对于有符号数，右移操作使用符号扩展，在移位期间保持高位完整，从而使负数保持为负数：\n\
    \n| 二进制 | 十进制（补码） |\n| :--- | :--- |\n| 11110111 | -9 |\n| 11110101 | -5 |\n|\
    \ 11111101 | -3 |\n| 11111110 | -2 |\n| 11111111 | -1 |\n\n"
