  mdcn: "\n\n## 31.2. 在实际硬件上运行\n\n另一种可能性是将树莓派（或快速的微控制器）连接到 PCB 的地址线和数据线上，并编写一个程序通过树莓派的\
    \ GPIO 端口向总线“位带带（bit-bang）”数据。这种方法在 Atari 2600 卡上已经取得了一些成功。\n\n如果你知道如何为 FPGA 板编程，理论上你可以替换\
    \ RAM、ROM、CPU、音频和视频生成逻辑。或者直接编写一个软件模拟器来实现同样的功能。又干脆找一台运行 AdvanceMame 的 PC 并把它塞进游戏机机箱（看看会发生什么结果……？）\n\
    \n![](img/bbb7f6aa3459811663fcfaffe7a93b60_216_0.png)\n\n图 31.1：树莓派 Zero，一台仅需\
    \ 5 美元的微型电脑，其性能是书序中所示 Galax 游戏机板的 1000 倍（由 Gareth Halffree 拍摄，CC BY-SA 2.0）\n\n\
    # 附录 A：故障排除\n\n## 程序员错误\n\n编程是困难的。用 C 语言更难。在基于 Web 的 IDE 和不靠谱的调试支持下用 C 语言？简直疯了！:)\
    \ 总之，这里是一些常见的错误情况：\n\n### 忘记设置栈指针\n\n如果你发现程序启动后不久就崩溃，你可能只是忘记在入口例（entry routine）中设置栈指针了！请参见第\
    \ 6 章。\n\n### 忘记初始化数据\n\n如果你发现全局变量为 0 或不是你预期的值，你可能忘记在入口例中设置初始化数据段了！请参见第 16 章。\n\
    \n### 在数组边界外写入\n\nC 语言没有数组边界检查，因此如果你告诉它写入，它会乐意地写入数组之外的内存。这很容易覆盖你在 RAM 中的变量。确保你检查了数组访问，特别是在绘制精灵（sprites）时。\n\
    \nC 有许多运算符优先级规则，这可能会令人困惑。疑问时，请使用括号。你可能还需要将表达式强制转换为有符号或无符号值——参见第 20 章。\n\n### 无限链表或损坏的对象\n\
    \n在使用链表时正确处理指针是棘手的。确保在对通过 `malloc()` 分配的对象调用 `free()` 后不再保留该对象的指针。考虑一下是否更倾向于使用简单的数据结构，例如数组。\n\
    \n## 编译器异常\n\nSDCC 编译器截至 2017 年仍在活跃开发中，但有时你会发现编译器 Bug（当你读到这里时，某些 Bug 可能已经修复了！）\n\
    \n### 文件 ... 行号 '1018' 中的非致命编译器内部问题：未找到定义\n\n以下代码生成了这一晦涩的错误信息：\n\n```\nconst byte*\
    \ e = \"HELLO\";\nwhile (*e >= 0) { // 条件永远成立\n  *e++;\n}\n```\n\n问题在于 `e` 是一个字节指针，它是\
    \ `unsigned char` 的类型别名，因此表达式 *e >= 0* 永远为真。这导致错过了循环归纳优化器并产生令人困惑的消息。解决方案是移除该错误的表达式，或者更改它使其不再永远为真。\n\
    \n### 内联函数并不总是有效\n\n如果你发现使用 `inline` 关键字与不使用它的行为不同，你可能发现了编译器中的一个 Bug。\n\n### char\
    \ 默认无符号符号\n\nSDCC 默认将 `char` 类型设为无符号。与其说是 Bug，不如说是与大多数 C 编译器的偏差。在示例代码中，除了符号位不重要的情况下，我们使用了\
    \ `byte` 和 `sbyte`。\n\n# 参考文献\n\n- [1] Zilog Z80. https://en.wikipedia.org/wiki/Zilog_Z80.\n\
