    We only have 3 channels in the AY-38910 PSG, so we can only try to play a 4th
    note while there are 3 playing, we''ll have to either ignore it, or choose a currently-playing
    note to interrupt.


    # 19.3 Swinging with the Tempo


    First we need to keep track of the three PSG voices. For now, we just need to
    track the volume for each:


    ```

    struct {

    byte volume;

    } voice[3];

