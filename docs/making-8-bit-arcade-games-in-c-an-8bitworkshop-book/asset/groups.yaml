    # 15


    # Randomness


    Most games have a need to generate random numbers. Maybe the game needs an enemy
    that behaves unpredictably, or requires a game element appears at random positions
    on the screen. This is usually accomplished by using a pseudorandom number generator
    (PRNG). This is an algorithm that starts from a number called a seed and modifies
    it in a complex way to generate successive random numbers.


    If designed correctly, the PRNG will cycle through a large range of values that
    do not repeat themselves, or only repeat after many thousands of iterations. This
    is called the period of the PRNG.


    A common type of PRNG is a linear-feedback shift register (LFSR) which combines
    shifts with bit operations to generate numbers. The operations are usually carefully
    chosen to maximize the period of the sequence. For math reasons, only 16 different
    8-bit LFSRs have the maximal period of 255 values (zero is not allowed, otherwise
    it''d be 256). This means it''ll cycle through every non-zero 8-bit number exactly
    once, in a seemingly haphazard order, until it repeats.


    LFSRs were popular in early computer and video game designs, since they are easily
    implemented in hardware. They operate as simple counters, produce audio noise,
    even generate video (the Galaxian starfield comes from a 17-bit LFSR.) They’re
    also easy to implement in software, as we’ll see.'
