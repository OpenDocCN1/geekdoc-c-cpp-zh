  mdcn: "\n# 游程编码 (Run-Length Encoding)\n\n> 在 8bitworkshop.com 上查看：选择 Williams (Z80)\
    \ 平台，然后选择 RLE Bitmap 文件。\n\nWilliams 硬件能够绘制非常大的位图。你的限制仅在于 ROM 的大小，它只能容纳一个未压缩的全屏大小位图。除非你有一些花哨的分页切换硬件，否则你可能需要使用数据压缩。\n\
    \n大多数现代数据压缩方法（如在 JPEG 图像或 ZIP 文件中常见的方法）需要大量的内存和/或 CPU 时间，但早期的方法仍然运行良好。游程编码 (RLE)\
    \ 是一种压缩具有长序列相同字节的数据的简单方法。纯色位图通常与 RLE 压缩效果良好。\n\nRLE 将数据划分为长度有限的数据包。数据包的第一个字节通常给出包的长度和类型——在我们的方案中，高位决定类型。一个“游程”（run）包输出一串相同的字节——例如，这个数据包生成字节\
    \ $A5$ 的 7 个副本（第一个字节是 $87，因为高位被设置了）：\n\n87 A5\n\n一个“拷贝”（copy）包只是逐字复制数据包中的字节。例如，这个数据包输输出数字\
    \ 1 到 5：\n\n```\n05 01 02 03 04 05\n```\n\n由于我们正在绘制图像，我们将每个字节转换为像素，并以光栅模式（从左到右，然后从上到）绘制到屏幕上。\n\
    \n将位图转换为 RLE 格式是复杂的，因为计算世界很大程度上转向了更好的压缩技术。Truevision TGA 格式支持 RLE 编码，ImageMagick\
    \ 等程序可以转换为此格式。如果你将数据重新打包为每像素 4 位，可能会更高效。\n\n```c\nvoid draw_tga(const byte* tgadata,\
    \ byte cenx, byte ceny) {\n  const TGAHeader* hdr = (TGAHeader*) tgadata;\n  const\
    \ byte* src = hdr->data;\n  byte* dest = &viddmem(cenx-hdr->width/4)[ceny-hdr->height/2];\n\
    \  byte i,j,lastbyte;\n  // set palette from TGA\n  for (i=0; i<8; i++) {\n  \
    \  byte pal = 0;\n    pal |= (hdr->palette[i].r >> 5);\n    pal |= (hdr->palette[i].g\
    \ >> 2) & 0x38;\n    pal |= (hdr->palette[i].b) & 0xc0;\n    palette[i] = pal;\n\
    \  }\n  // iterate over height of image\n  for (j=0; j<hdr->height; j++) {\n \
    \   byte* start = dest;\n    i = 0;\n    lastbyte = dest;\n    // iterate over\
    \ width of image\n    while (i<hdr->width) {\n      byte count = *src++;\n   \
    \   byte rle = count & 0x80; // RLE has bit set\n      byte color = 0;\n     \
    \ if (rle) {\n        color = *src++; // fetch RLE byte\n        count &= 0x7f;\
    \ // discard hi bit\n        do {\n          if (!rle) {\n            color =\
    \ *src++; // no RLE, fetch raw data\n            if ((i&1)==0) {\n           \
    \ *dest = lastbyte = (color << 4); // even byte\n          } else {\n        \
    \    *dest = lastbyte | color; // odd byte\n            dest += 256; // move right\
    \ two pixels\n          }\n          i++;\n        } while (count--);\n      }\n\
    \      dest = start+1; // next scanline\n      watchdog0x39 = 0x39; // watchdog\
    \ reset\n}\n```\n\n图 28.1：RLE 编码的 TGA 位图显示程序\n\n你在 Williams 游戏中听到的多数声音来自 Eugene\
    \ Jarvis，他在制作弹球游戏时开发了“Gwave”声音系统。实际上，我是在 Williams 板板上开始工作的。在这款游戏中，内存只有 512 字节用于所有程序和数据。正是这种极端的内存压力激发了\
    \ Gwave 波表合成器。通过在 64 字节中存储波形（正弦、方波、三角波等），然后存储一个 10-20 字节的频率表，声音可以通过几个字节来表征……我惊讶地发现，最出色的声音往往是通过输入随机数创建的。\n\
    \nWilliams 板板拥有自己的 Motorola 6800 CPU，连接到 8 位 DAC（数字模模拟转换器）。CPU 通过改变 DAC 的输出来塑造波形。CPU\
    \ 的定时决定了声音的音色和频率。\n\n# 29.1 SWAVE 系统\n\n> 在 8bitworkshop.com 上查看：选择 Williams Sound\
    \ (Z80) 平台，然后选择 Wavetable Synth 文件。\n\n我们将用 C 语言制作我们原始的波表合成器。波表只是一个幅值数组，我们通过不同的频率循环遍历它来产生音调。波表负责声音的纹理，或者更准确地说，是它的频谱。\n\
    \n"
