  mdcn: "\n\n## 18.5. 返回阵型\n\n我们希望外星人可以使用相同的基于方向的算法平滑地回到它们在阵型中的先前位置，但这非常棘手。因此我们将采取捷径，在外星人返回时使用不同的移动模式（我们将此标志位标记为\
    \ `returning`）。\n\n在 `move_attackers` 函数中，我们根据这个标志位选择另外两个函数之一：\n\n```c\nif (a->returning)\n\
    \    return_attacker(a);   // 返回阵型\nelse\n    fly_attacker(a);      // 飞行\n```\n\
    \n在 `fly_attacker` 中，我们检查外星人是否绕过了屏幕底部，如果是，则设置 `returning` 标志位：\n\n```c\nif ((a->yy\
    \ >> 8) == 0) { // 从定点转换\n    a->returning = 1;\n}\n```\n\n在 `return_attacker`\
    \ 中，我们缓慢地将外星人降至位置，将其 X 坐标精确设置为所需位置，并缓慢向下移动 Y 坐标。我们还旋转外星人，使其看起来像是正在翻转进入它的空间：\n\n\
    ```c\nvoid return_attacker(AttackingEnemy* a) {\n    byte fi = a->index-1;\n \
    \   byte destx = get_attacker_x(fi);\n    byte desty = get_attacker_y(fi);\n \
    \   byte ydist = desty - (a->yy >> 8); // 到槽位的距离\n    // 是否已到达阵型槽位？\n    if (ydist\
    \ == 0) {\n        // 转换回阵型敌人\n        formation[fi].shape = a->shape;\n     \
    \   a->index = 0; // 禁用攻击者\n    } else {\n        // 接近槽位，设置位置和旋转\n        a->dir\
    \ = (ydist + 16) & 31;\n        a->x = destx << 8;\n        a->yy += 128;\n  \
    \  }\n}\n```\n\n## 18.6. 导弹\n\n当外星人到达目标 Y 坐标时，我们将其转换回阵型敌人——它将不再是一个精灵（sprite），但将再次作为一对背景瓷砖绘制。\n\
    \n绘制导弹是简单的，因为它们在硬件中像精灵一样作为独立的图形实体受支持。我们无法从对象 RAM 段读取数据，因此我们必须定义自己的“影子”数组：\n\n\
    ```c\ntypedef struct {\n    signed char dx; // X 轴变化\n    byte xpos;      // X\
    \ 坐标\n    signed char dy; // Y 轴变化\n    byte ypos;      // Y 坐标\n} Missile;\n\n\
    Missile missiles[8];\n```\n\n我们将使用 `dy` 作为导弹的 Y 位置（速度和方向）。导弹的 Y 坐标与精灵相反，因此位置 0\
    \ 是屏幕底部。我们使用 0 来表示导弹槽位是“可用的”，因为它也处于非活动状态。\n\n以下是每帧移动导弹的例程：\n\n```c\nvoid move_missiles()\
    \ {\n    byte i;\n    for (i=0; i<8; i++) {\n        if (missiles[i].ypos) {\n\
    \            // 移动导弹，并检查是否撞击屏幕顶部\n            missiles[i].ypos += missiles[i].dy;\n\
    \            if ((byte)missiles[i].ypos < 4) {\n                missiles[i].xpos\
    \ = 0xff; // 隐藏非活动\n                missiles[i].ypos = 0;\n            }\n   \
    \     }\n    }\n    // 将所有“影子导弹”拷贝到视频内存\n    memcpy(missiles, missiles, sizeof(missiles));\n\
    }\n```\n\n## 18.7. 爆炸外星人\n\n我们使用 `memcpy` 将“影子导弹”数组拷贝到对象 RAM。我们设置 `Missile` 结构体，使其与对象\
    \ RAM 中的相同，但我们使用了那两个未使用的字节。\n由于导弹的速度各异，当它距离底部  4 个像素时，我们会隐藏导弹（向上飞行的导弹会绕到底部，然后被隐藏）。\n\
    \n> `(type)` 表达式\n> 将表达式转换为类型 `type`。这是给编译器的信号，将表达式视为给定的类型。如果不允许类型转换，编译器将产生错误。\n\
    \n注意以下表达式：\n`((byte)missiles[i].ypos < 4)`\n注意表达式开头的 `(byte)`。这被称为类型转换。在我们的导弹结构体中，`ypos`\
    \ 字段是无符号的，而 `dy`是有符号的。在 C语言中，这会导致加法结果。由于有符号字节的范围仅为 -128 到 127，在屏幕中间就会导致有符号字节溢出！我们在比较之前将此表达式转换为\
    \ `byte`，以便获得 0-255 的范围，并利用整数溢出的特性。（我们将在第 20 章中详细讨论这一点。）\n\n我们预留了一个专门的精灵用于爆炸的外星人，当外星人爆炸时，我们在任何需要的地方激活它：\n\
    \n```c\nvoid blowup_at(byte x, byte y) {\n    vsprites[6].color = 1; // 色调\n \
