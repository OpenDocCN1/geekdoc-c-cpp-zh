    \ C 风格字符串。C 函数通常能识别出零表示字符串的结束。遗憾的是，这意味着你不能将零值作为字符串的一部分，但那通常不会出现在文本数据中。\n\n## 3.3\
    \ 链接器\n\n汇编器会吐出另一组文件，最重要的是我们 C 源文件的对应的目标代码。它包含了 Z80 机器码的字节，加上一些帮助链接器的额外内容。因此，目标代码是可重定位的，意味着它可以在内存中的任何位置运行。链接器运行后，所有代码将固定在一个特定的位置。\n\
    \n> ¹在像 UNIX 这样的系统上，这将控制权返回给命令行提示符。在街机游戏中，你可能会在 main() 中无限循环。\n\n链接器的工作是输出一个 CPU\
    \ 可以可以直接执行的 ROM 就绪代码映像。它通过将你编译的目标文件与外部库结合，并对指向的未解析地址进行修复（fixups），使其指向正确的最终内存位置。\n\
    \n注意我们有两个未解析的地址，___str_0 和 _printf。第一个标识符是内部引用，链接器可以轻松解析：\n\n```\n0000 21 09 00\
    \ [10] 58 ld hl,#__str_0\n```\n\n第二个标识符 _printf 是一个外部库函数。链接器必须在外部文件（随编译器一起包含）中查找该标识符，并将函数包含在最终映像中，以及它所依赖的所有函数。有时这可能是大量的代码！\n\
    \n这里是我们应用了所有修复后的最终代码列表：\n\n```\n0000 56 _main::\n0000 21 09 00 [10] 58 ld hl,#__str_0\n\
    0003 E5 [11] 59 push hl\n0004 41 00 [17] 60 call _printf\n0007 F1 [10] 61 pop\
    \ af\n0008 C9 [10] 62 ret\n0009 63 ___str_0:\n0009 48 45 2A 4C 4F 20 64 .ascii\
    \ \"HELLO WORLD\"\n57 4F 52 4C 44\n0014 00 65 .db 0x00\n```\n\n你甚至可能在没有意识的情况下引入外部函数。例如，Z280\
    \ 没有乘法或除法指令，因此 C 编译器使用了外部库例程。任何浮点操作也是如此。\n\n## 3.4 ROM 映像\n\n最终的 ROM 映像只是汇编器输出的字节序列。在\
    \ Z80 上，ROM 映像通常加载在地址 0，因为那是 CPU 在重位后开始执行代码的地方。\n\n> 注意：此示例无法运行（目前！）\n\n这个示例在我们的\
    \ Z80 IDE 中无法直接运行，因为我们的系统比你标准的 C 编译器要精简一些。我们需要添加一些额外内容：\n\n- 标准 I/O 函数：虽然 printf\
    \ 定义在标准库中，但对于它使用的用于输出字符的 putchar 函数，那里并没有相应的定义。我们必须为目标平台上的特定显示设备定义 putchar。\n\n\
    - 栈指针初始化：当 CPU 被重位时，它会将程序计数器 (PC) 寄存器设置为 0。这对应于我们 main 函数的开头，所以它将立即开始执行。有一个小问题：栈指针\
    \ (SP) 寄存器尚未设置，所以当我们向栈中推入/弹出值时，CPU 可能不会指向有效的 RAM 区域。这就是为什么大多数 C 编译器不从 main 开始，而是先运行一个入口例程来设置环境。我们将在未来的章节中描述。\n\
    \n## 一些 C 示例\n\n在我们开始制作街机游戏之前，让我们过一下更多的 C 代码示例。\n\n```\ntype name;\ntype name\
    \ = initializer;\n\n声明一个类型为 type、名为 name 的变量，可选初始化其值。\n```\n\n当你声明变量时，会在内存中为它预留空间。在这里我们声明了两个类型为\
    \ char 的变量（这是一种 8 位整数类型），并初始化了其中一个：\n\n```\nchar a;\nchar b = 'A';\n```\n\n这些是全局变量，因为它们定义在函数之外。\n\
    \n```c\nint x;\nint y = 10;\n```\n\n在函数内部定义变量是局部变量，它们在函数执行期间有效。\n\n```c\nvoid\
    \ func() {\n  int z = 5;\n}\n```\n\n注意我们在函数内部声明了变量。这使其成为一个局部变量，临时在栈上占用空间。我们只能在这个函数内部访问它。\n\
    \n```c\nvoid func() {\n  int i;\n}\n```\n\n```c\nwhile (condition) statement;\n\
    如果 condition 为真，则执行 statement。\n```\n\n```c\nwhile (x > 0) {\n  x--;\n}\n```\n\
    \n```c\nreturn expression;\n退出函数，并返回 expression 作为结果。\n```\n\n```c\nint add(int\
    \ a, int b) {\n  return a + b;\n}\n```\n\n```c\nbyte did_hit_high_score() {\n\
    \  if (score > high_score) {\n    high_score = score;\n    return 1;\n  } else\
    \ {\n    return 0;\n  }\n}\n```\n\n```c\nif (expr) statement1 else statement2;\n\
    如果 expr 为真（非零），则执行 statement1。否则执行 statement2。\n```\n\n```c\nif (lives == 0) {\n\
    \  end_game();\n} else {\n  do_something();\n}\n```\n\n```\nfor (init; condition;\
    \ increment)\n```\n\n首先求值 init。然后当 condition 为真时循环，重复执行 statement 和 increment。\n\
    \n```c\nfor (int i = 0; i < 10; i++) {\n}\n```\n\n假设我们想从 0 计数到 99，并对每个数字调用 display_number：\n\
    \n```c\nvoid display_100_numbers() {\n  int i;\n  for (i=0; i<100; i++) {\n  \
    \  display_number(i);\n  }\n}\n```\n\n"
