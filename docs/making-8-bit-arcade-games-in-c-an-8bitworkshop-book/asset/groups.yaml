    | +00 | 7654 | 3210 | 7654 | 3210 | 7654 | 3210 |\n| 01 | 7654 | 3210 | 7654 |\
    \ 3210 | 7654 | 3210 |\n| 02 | 7654 | 3210 | 7654 | 3210 | 7654 | 3210 |\n| 03\
