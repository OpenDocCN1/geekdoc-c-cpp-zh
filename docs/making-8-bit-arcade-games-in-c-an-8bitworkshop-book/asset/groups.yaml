    # The Galaxian Hardware


    # 17.1 History


    Namco''s first game was Gee Bee, a pinball-inspired breakout-style game. Galaxian
    was their follow-up, inspired by the recently released Space Invaders as well
    as the first Star Wars movie.8


    The Galaxian hardware pushed the limit of video game designs in 1979. At its core
    is a Z80 CPU at 3.072 MHz. The graphics system featured color RGB graphics and
    multicolor hardware sprites overlapping a tiled background. (At the time, the
    term “sprite” had not yet been coined, so designers called them “stamps.)


    The designers would reuse the same PCB (printed circuit board) for King & Balloon,
    and also for the legendary sequel Galaga. Other companies by Konami licensed the
    video hardware to make games like Scramble and Frogger.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_113_0.png)


    Figure 17.1: Galaxian, King & Balloon, Scramble, and Frogger'
  - '[PAGE 114]


    # 17.1. History


    The Scramble hardware was a popular target for ports and bootlegs of other Z80-based
    games. Crazy Kong for instance was a bootleg of Donkey Kong, identical except
    for the color palette and sound. Even Scramble itself was hacked to run on older
    Galaxian hardware!


    Galaxian uses a 32x28 tilemap like the VIC Dual hardware, but each column can
    be assigned separate color attributes. Also, individual columns can be scrolled
    left and right, or up and down if the monitor is in landscape orientation.


    Galaxian''s sprites are 16x16 bitmaps with three colors (plus one transparent
    color) that can be positioned anywhere on the screen. Galaxian uses sprites for
    attacking aliens — for aliens in formation, tiles are used, along with the column-scrolling
    feature to move them around. There can be up to eight sprites on a given scanline.


    There are also eight "bullets" that can be separately positioned and show up on
    the screen as short vertical lines (on Scramble hardware, they show up as single
    pixels). Only two bullets can appear on a given scanline. Bullet #7 — the player''s
    bullet appears as a separate color and has priority over the others.


    > To see it on 8bitworkshop.com: Select the Scramble Hardware platform, then select
    the Graphics Test file.'
- md: "\n## 17.2 Memory Map\n\nWe've chosen the Scramble memory map for our emulator\
    \ — it's similar to Galaxian and used as the basis for many other games:\n\n|\
    \ Start | End | Description | R/W |\n|---|---|---|---||\n| $0000 | $3FFF | ROM\
    \ | read |\n| $4000 | $47FF | program RAM | r/w |\n| $4800 | $4BFF | video RAM\
    \ | write |\n| $4C00 | $4FFF | video RAM (mirror) | write |\n| $5000 | $50FF |\
    \ object RAM | write |\n| $6801 | | enable interrupt | write |\n| $6803 | | enable\
    \ blue background | write |\n| $6804 | | enable stars | write |\n| $7000 | | watchdog\
    \ timer | read |\n| $8100 | | input 0 | read |\n| $8101 | | input 1 | read |\n\
    | $8102 | | input 2 | read |\n\nTable 17.1: Scramble Memory Map\n\nThe Galaxian\
    \ hardware is similar except for these changes:\n\n| Start | End | Description\
    \ | R/W |\n|---|---|---|---|\n| $6000 | | input 0 | read |\n| $6800 | | input\
    \ 1 | read |\n| $7000 | | input 2 | read |\n| $7800 | | watchdog timer | read\
    \ |\n| $7001 | | enable interrupt | write |\n| $7004 | | enable stars | write\
    \ |\n\nTable 17.2: Galaxian Memory Map\n\nThe tilemap is defined as a 32x32 byte\
    \ array, defined here as the variable vram:\n\n```\nbyte __at (0x4800) vram[32][32];\
    \ // 32x32 cells\n```\n\nEach byte selects one of the 256 available tiles.\n\n\
    ### 17.2. Memory Map\n\nPORTRAIT\n\n[29][0]\n\n[2][0]\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_116_0.png)\n\
    \n[29][31]\n\n[2][31]\n\nLANDSCAPE\n\n[2][0]\n\n[2][31]\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_116_1.png)\n\
    \n[29][0]\n\n[29][31]\n\nFigure 17.2: Galaxian video RAM layout\n\nSome of the\
    \ tiles are offscreen. In portrait orientation, the leftmost two and rightmost\
    \ two columns are hidden. If you want to hide sprites or missiles, you can position\
    \ them in this area.\n\nThe other section of video RAM, “object RAM,” has a more\
    \ complex structure. We’ll use arrays of C structs to define each section.\n\n\
    First’ll define the column registers. There are 32 columns, each having a scroll\
    \ and attrib byte (for a total of 64 bytes):\n\n```\nstruct {\n  byte scroll;\
    \ // column scroll position\n  byte attrib; // column attribute (color set)\n\
    \   __at (0x5000) vcolumns[32];\n}\n```\n\n(In portrait orientation, the columns\
    \ are rotated 90 degrees, they are actually horizontal rows. But we call them\
    \ columns anyway.)\n\nThe scroll byte moves an entire column of tiles to the right\
    \ by the given number of pixels, wrapping the remainder to the other side. Refer\
    \ to Figure 17.2 and note that four tiles (32 pixels) will always be partially\
    \ or completely hidden.\n\nThe attrib byte controls the colors used by the column.\
    \ The palette is set up as 8 sets with 4 colors in each set, so this byte picks\
    \ out one of the 8 sets. Like the VIC Dual system, it’s contained in a PROM, which\
    \ we’ve mapped to $5000 in the emulator ROM:\n\n```c\n// palette entry macro (red\
    \ 0-7, green 0-7, blue 0-3)\n#define PE(r,g,b) ((r)|((g<<3))|((b<<6))\n```\n\n\
    ```c\nconst char __at (0x5000) palette[32] = {\n  0,PE(0,0,0),PE(0,0,0),PE(6,6,3),\n\
    \  0,PE(7,1,1),PE(0,0,3),PE(7,7,3),\n  ..\n};\n```\n\nEach of the 16 palette entries\
    \ contains a single byte, mapped to RGB values like so:\n\n```\nBit 76543210\n\
    Color BBGGGRRR\n```\n\nThe 8 hardware sprites each use 4 bytes of object RAM:\n\
    \n```c\nstruct {\n    byte xpos; // x position\n    byte code; // tile index\n\
    \    byte color; // color set index\n    byte ypos; // y position\n} __at (0x5040)\
    \ vprites[8];\n```\n\nThe xpos and ypos define the X and Y coordinate of the sprite.\
    \ We've defined these as valid for portrait orientation— X goes from left to right,\
    \ and Y goes from top to bottom. The same visibility rules apply as for tiles,\
    \ X = 0 and X = 255 both offscreen.\n\nThe code byte selects tiles to use for\
    \ the sprite. Sprites are 16x16, so they use 8x8 tiles, which are chosen by adding\
    \ code to offsets in Figure 17.3.\n\nThe color byte selects the palette of the\
    \ sprite from the 8 different sets, similar to how it's done for tiles. The missiles\
    \ or bullets are defined similarly to sprites, except they only have X and Y coordinates:\n\
    \n```c\nstruct {\n    byte unused1;\n    byte xpos; // x position\n    byte unused2;\n\
    \    byte ypos; // y position (inverted)\n} __at (0x5060) vmissiles[8];\n```\n\
    \nFigure 17.3: Galaxian layout\n\nThe Y coordinate is inverted, and an offset\
    \ is applied which depends on the hardware. On Scramble hardware, Y = 240 is the\
    \ top of the screen, and Y = 0 is the bottom.\n\n## 17.3 Other Addresses\n\nThe\
    \ enable_irq switch can be set to 1 to activate interrupts. This causes the video\
    \ hardware to generate a non-maskable interrupt (NMI) once per frame. The interrupt\
    \ handler must live at address $6801 in the ROM. We'll show you how to write interrupt\
    \ handlers in Chapter 18.\n\n```c\nbyte __at (0x6801) enable_irq;\n```\n\nThe\
    \ enable_stars switch, when set to 1, shows blinking stars! These are generated\
    \ by a circuit on the actual PCB.\n\n```c\nbyte __at (0x6804) enable_stars;\n\
    ```\n\nThis system also has a watchdog timer that must be read (not written to)\
    \ at least every 8 frames (8/60 = 0.13 seconds). Here's one easy way to do this\
    \ in C:\n\n```c\nwatchdog++;\n```\n\nFinally, there are input latches for joysticks,\
    \ buttons, DIP switches:\n\n```c\nbyte __at (0x8100) input0;\nbyte __at (0x8101)\
    \ input1;\nbyte __at (0x8102) input2;\n```\n\n```c\n#define LEFT1 (input0 & 0x20)\n\
    #define RIGHT1 (input0 & 0x10)\n#define UP1 (input0 & 0x01)\n#define DOWN1 (input2\
    \ & 0x40)\n#define FIRE1 (input0 & 0x08)\n#define BOMB1 (input0 & 0x02)\n#define\
    \ COIN1 (input0 & 0x80)\n#define COIN2 (input0 & 0x40)\n#define START1 (input1\
    \ & 0x80)\n#define START2 (input1 & 0x40)\n```\n\n## 17.4 Graphics ROMs\n\nIn\
    \ the actual arcade game, the tile graphic data is in separate ROMs. In the emulator,\
    \ they’re tacked onto the end of the program ROM—so we expect them at a certain\
    \ offset, $4000. This is easy to do with the at keyword in SDCC:\n\n```c\nconst\
    \ char __at (0x4000) tilerom[0x1000] = {\n  ..\n};\n```\n\nThe 256 tiles in the\
    \ ROM are arranged just like those in the VIC Dual system, but there are two separate\
    \ bitplanes. The bits in each plane are combined to produce a 4-bit color for\
    \ each pixel.\n\nThe color palette is in a programmable ROM (PROM). The emulator\
    \ expects the data at address $5000:\n\n```c\nconst char __at (0x5000) color_prom[32]\
    \ = {\n  ..\n  32 bytes ...\n};\n```\n\n## 17.5 Sound\n\nGalaxian has a separate\
    \ PCB with discrete circuits based on 555 timers and other counters. Later games\
    \ like Scramble often had a dedicated sound CPU, usually another Z80. The main\
    \ CPU would communicate with the sound CPU via a programmable peripheral interface\
    \ chip like the Intel 8255.\n\nTo make things simpler, we’re going to pretend\
    \ that there are two AY-3-8910 PSGs hooked up directly to the main CPU via I/O\
    \ ports. They are connected similarly to the VIC Dual sound ports:\n\n```c\n__sfr\
    \ __at (0x1) ay8910_a_reg;\n__sfr __at (0x2) ay8910_a_data;\n__sfr __at (0x4)\
    \ ay8910_b_reg;\n__sfr __at (0x8) ay8910_b_data;\n```\n\n```c\ninline void set8910a(byte\
    \ reg, byte data) {\n  ay8910_a_reg = reg;\n  ay8910_a_data = data;\n}\n```\n\n\
    ```c\ninline void set8910b(byte reg, byte data) {\n  ay8910_b_reg = reg;\n  ay8910_b_data\
    \ = data;\n}\n```\n"
  mdcn: "\n\n## 17.2 内存映射\n\n我们为模拟器选择了 Scramble 的内存映射——它与 Galaxian（小行星入侵）类似，并作为许多其他游戏的基础：\n\
    \n| 起始 | 结束 | 描述 | 读写 |\n|---|---|---|---||\n| $0000 | $3FFF | ROM | 读 |\n| $4000\
    \ | $47FF | 程序 RAM | 读写 |\n| $4800 | $4BFF | 显存 RAM | 写入 |\n| $4C00 | $4FFF |\
    \ 显存 RAM (镜像) | 写入 |\n| $5000 | $50FF | 对象 RAM | 写入 |\n| $6801 | | 开启中断 | 写入 |\n\
    | $6803 | | 开启蓝色背景 | 写入 |\n| $6804 | | 开启星空 | 写入 |\n| $7000 | | 看门狗定时器 | 读 |\n\
    | $8100 | | 输入 0 | 读 |\n| $8101 | | 输入 1 | 读 |\n| $8102 | | 输入 2 | 读 |\n\n表 17.1:\
    \ Scramble 内存映射\n\nGalaxian 的硬件与此相似，仅有以下变化：\n\n| 起始 | 结束 | 描述 | 读写 |\n|---|---|---|---|\n\
    | $6000 | | 输入 0 | 读 |\n| $6800 | | 输入 1 | 读 |\n| $7000 | | 输入 2 | 读 |\n| $7800\
    \ | | 看门狗定时器 | 读 |\n| $7001 | | 开启中断 | 写入 |\n| $7004 | | 开启星空 | 写入 |\n\n表 17.2:\
    \ Galaxian 内存映射\n\n瓦片映射定义为一个 32x32 的字节数组，在此定义为变量 `vram`：\n\n```\nbyte __at (0x4800)\
    \ vram[32][32]; // 32x32 单元格\n```\n\n每个字节选择 256 个可用瓦片中的一个。\n\n### 17.2. 内存映射\n\
    \n竖屏\n\n[29][0]\n\n[2][0]\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_116_0.png)\n\
    \n[29][31]\n\n[2][31]\n\n横屏\n\n[2][0]\n\n[2][31]\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_116_1.png)\n\
    \n[29][0]\n\n[29][31]\n\n图 17.2: Galaxian 显存布局\n\n某些瓦片是在屏幕之外的。在竖屏模式下，最左侧的两个列和最右侧的两个列是隐藏的。如果你想隐藏精灵（sprites）或导弹，可以将它们放置在这个区域。\n\
    \n显存的另一部分是“对象 RAM”，具有更复杂的结构。我们将使用 C 结构体数组来定义每个部分。\n\n首先，我们定义列寄存器。共有 32 列，每列有一个滚动字节和一个属性字节（总共\
    \ 64 字节）：\n\n```\nstruct {\n  byte scroll; // 列滚动位置\n  byte attrib; // 列属性（颜色组）\n\
    \   __at (0x5000) vcolumns[32];\n}\n```\n\n（在竖屏模式下，这些列旋转了 90 度，它们实际上是水平行。但我们仍然称它们为列。）\n\
    \n`scroll` 字节将整列瓦片按指定的像素数向右移动，并将剩余部分到另一侧。参考图 17.2，并注意四个瓦片（32 像素）将始终部分或完全被隐藏。\n\
    \n`attrib` 字节控制该列使用的颜色。调色板配置为 8 组，每组 4 种颜色。类似于 VIC Dual 系统，它包含在 PROM 中，我们将其映射到\
    \ `$5000`：\n\n```c\n// 调色板条目（红 0-7, 绿 0-7, 蓝 0-3）\n#define PE(r,g,b) ((r)|((g<<3))|((b<<6))\n\
    ```\n\n```c\nconst char __at (0x5000) palette[32] = {\n  0,PE(0,0,0),PE(0,0,0),PE(6,6,3),\n\
    \  0,PE(7,1,1),PE(0,0,3),PE(7,7,3),\n  ..\n};\n```\n\n每个调色板条目包含一个字节，映射到 RGB 值如下：\n\
    \n8 个精灵使用 4 字节的对象 RAM：\n\n```c\nstruct {\n    byte xpos; // x 位置\n    byte code;\
    \ // 瓦片索引\n    byte color; // 颜色索引\n    byte ypos; // y 位置\n} __at (0x5040) vprites[8];\n\
    ```\n\n`xpos` 和 `ypos` 定义了精灵的 X 和 Y 坐标。适用于竖屏——X 从左到右，Y 从上到下。可见性规则与瓦片相同，X = 0`\
    \ 和 `X = 255` 均在屏幕外。\n\n`code` 字节选择精灵使用的瓦片。精灵是 16x16 的，因此使用 8x8 的瓦片，通过图 17.3 中的偏移量选择。\n\
    \n`color` 字节从 8 组中选择精灵的调色板，类似于处理瓦片的方式。导弹或子弹的定义类似于精灵，它们只有 X 和 Y 坐标：\n\n```c\nstruct\
    \ {\n    byte unused1;\n    byte xpos; // x 位置\n    byte unused2;\n    byte ypos;\
    \ // y 位置（反转）\n} __at (0x5060) vmissiles[8];\n```\n\n图 17.3: Galaxian 布局\n\nY\
    \ 坐标是反的，取决于硬件的偏移量。在 Scramble 硬件上，Y = 240 是顶部，Y = 0 是底部。\n\n## 17.3 其他地址\n\n`enable_irq`\
    \ 开关可以设置为 1，视频硬件每帧产生一次非掩器中断（NMI）。中断处理程序位于 ROM 中的 `$6801` 处。我们将在第 18 章向你展示如何编写中断处理器。\n\
    \n```c\nbyte __at (0x6801) enable_irq;\n```\n\n`enable_stars` 开关设置为 1 时会显示闪烁星空！这些是由实际\
    \ PCB 上的电路生成的。\n\n```c\nbyte __at (0x6804) enable_stars;\n```\n\n该系统还有一个看门狗定时器，必须每\
    \ 8 帧读取一次（8/60 = 0.13 秒）。这是在 C 中实现此的一种简单方法：\n\n```c\nwatchdog++;\n```\n\n最后，是用于摇杆、按钮、\
    \ DIP 开关的输入锁：\n\n```c\nbyte __at (0x8100) input0;\nbyte __at (0x8101) input1;\n\
    byte __at (0x8102) input2;\n```\n\n```c\n#define LEFT1 (input0 & 0x20)\n#define\
    \ RIGHT1 (input0 & 0x10)\n#define UP1 (input0 & 0x01)\n#define DOWN1 (input2 &\
    \ 0x40)\n#define FIRE1 (input0 & 0x08)\n#define BOMB1 (input0 & 0x02)\n#define\
    \ COIN1 (input0 & 0x80)\n#define COIN2 (input0 & 0x40)\n#define START1 (input1\
    \ & 0x80)\n#define START2 (input1 & 0x40)\n```\n\n## 17.4 图形 ROM\n\n在实际街机游戏中，瓦片图形数据存储在独立的\
    \ ROM 中。在模拟器中，它们被附加在程序 ROM 的末尾——因此我们期望在某个偏移量 `$4000` 处。使用 SDCC 中的 `at` 关键字很容易实现：\n\
    \n```c\nconst char __at (0x4000) tilerom[0x1000] = {\n  ..\n};\n```\n\nROM 中的\
    \ 256 个瓦片的排列方式与 VIC Dual 系统中的相同，但有两个独立的位平面。每个平面中的位组合以为每个像素产生 4 位颜色。\n\n调色板位于可编程读读存储器（PROM）中。模拟器期望地址\
    \ `$5000` 处的数据：\n\n```c\nconst char __at (0x5000) color_prom[32] = {\n  ..\n \
    \ 32 字节 ...\n};\n```\n\n## 17.5 音频\n\nGalaxian 有一个独立的 PCB，带有基于 555 定时器和其他计数器的离散电路。后续的游戏（如\
    \ Scramble）通常有一个音频 CPU，通常是另一个 Z80。主 CPU 通过可编程外设接口（如 Intel 8255）与音频 CPU 通信。\n\n\
    为了简单起见，我们将有两个 AY-3-8910 PSG 通过 I/O 端口直接连接主 CPU。它们的连接方式与 VIC Dual 音端口类似。\n\n"
