    \nThe watchdog needs to be reset by writing the exact value 0x39 at least once\
    \ every 8 frames or the CPU will reset:\n\n```\nbyte __at (0xcbff) watchdog_0x39;\n\
    ```\n\nThere's also 1024 bytes of non-volatile RAM for writing high scores and\
    \ such:\n\n```\nbyte __at (0xc00) nvram[0x400];\n```\n\n## 26.9 When Not to Use\
    \ memset\n\nOn the Williams platform, we have the same problem using memset in\
    \ Chapter 17. Our bankswitching mode is set so that reads out of ROM, this routine\
    \ dutifully copies bytes in our ROM to the screen — leading to garbage bytes on\
    \ the left-hand side.\n\nInstead, use the blitter to clear the screen (a height\
    \ value of 255 gets interpreted by the blitter as 256, so the entire screen is\
    \ filled):\n\n```\nvoid clscr() {\n  blit_solid(0, 0, 0, 152, 255, 0x00);\n}\n\
    ```\n\nThe Williams games, especially Robotron: 2084, were famous for their high\
    \ sprite count and tricky video effects.\n\nEven though the blitter helps with\
    \ the heavy lifting of moving bytes to the frame buffer, a lot of work goes into\
    \ making a responsive game that animates dozens of objects at 60 Hz.\n\n> To see\
    \ it on 8bitworkshop.com: Select the Williams (Z80) platform, then select the\
    \ Raster Paranoia Game file.\n\n## 27.1 Keeping Track of Objects\n\nOur game has\
    \ several different linked lists to keep track of different kinds of objects:\n\
    \n- player_list - Contains just the player and a laser, when shot by the player.\
