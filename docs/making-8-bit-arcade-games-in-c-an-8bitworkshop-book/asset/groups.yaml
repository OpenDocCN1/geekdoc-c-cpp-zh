  - '[PAGE 119]


    # 17.3 Other Special Addresses


    The enable_irq switch can be set to 1 to activate interrupts. This causes the
    video hardware to generate a non-maskable interrupt (NMI) once per frame. The
    interrupt handler must live at address $66 in the ROM. We''ll show you how to
    write interrupt handlers in Chapter 18.


    ```

    byte __at (0x6801) enable_irq;

    ```


    The enable_starts switch is fun. When set to 1, it shows blinking stars! These
    are generated by a hardware circuit on the actual PCB.


    ```

    byte __at (0x6804) enable_stars;

    ```


    This system also has a watchdog timer that must be read (not written to) at least
    every 8 video frames (8/60 = 0.133 seconds). Here''s one easy way to do this in
    C:


    ```

    watchdog++;

    ```


    This performs a read of the watchdog, resetting it, and then a write is ignored.


    Finally, there are three input latches for joysticks, buttons, coin counters,
    DIP switches.


    ```

    byte __at (0x8100) input0;

    byte __at (0x8101) input1;

    byte __at (0x8102) input2;

    ```


    ```

    #define LEFT1 !(input0 & 0x20)

    #define RIGHT1 !(input0 & 0x10)

    #define UP1 !(input0 & 0x1)

    #define DOWN1 !(input2 & 0x40)

    #define FIRE1 !(input0 & 0x8)

    #define BOMB1 !(input0 & 0x2)

    #define COIN1 !(input0 & 0x80)

    #define COIN2 !(input0 & 0x40)

    #define START1 !(input1 & 0x80)

    #define START2 !(input1 & 0x40)

    ```'
  - '[PAGE 120]


    # 17.4 Graphics ROMs


    In the actual arcade game, the tile graphic data is in separate ROMs. In the emulator,
    they’re tacked onto the end of the program ROM — so we expect them at a certain
    offset, $4000. This is easy to do with the _at keyword in SDCC:


    ```

    const char __at (0x4000) tilerom[0x1000] = {

    ..

    };

    ```


    The 256 tiles in the ROM are arranged just like those in the VIC Dual system,
    but there are two separate bitplanes. The bits in each plane are combined to produce
    a 4-bit color for each pixel.


    The color palette is in a programmable ROM chip (PROM). The emulator expects the
    data at address $5000:


    ```

    const char __at (0x5000) color_prom[32] = {

    ..

    32 bytes ...

    };

    ```


    # 17.5 Sound


    Galaxian has a separate PCB with discrete circuits based on 555 timers and other
    counters. Later games like Scramble often had a dedicated sound CPU, usually another
    Z80. The main CPU would communicate with the sound CPU via a programmable peripheral
    interface chip like the Intel 8255.


    To make things simpler, we’re going to pretend that there are two AY-3-8910 PSGs
    hooked up directly to the main CPU via I/O ports. They are connected similarly
    to the VIC Dual sound ports:


    ```

    __sfr __at (0x1) ay8910_a_reg;

    __sfr __at (0x2) ay8910_a_data;

    __sfr __at (0x4) ay8910_b_reg;

    __sfr __at (0x8) ay8910_b_data;

    ```'
  - "[PAGE 121]\n\n```\ninline void set8910a(byte reg, byte data) {\n  ay8910_a_reg\
    \ = reg;\n  ay8910_a_data = data;\n}\n```\n\n```\ninline void set8910b(byte reg,\
    \ byte data) {\n  ay8910_b_reg = reg;\n  ay8910_b_data = data;\n}\n```\n\n# #\
    \ 17.6 When Not to Use memset\n\nWe might want to clear the screen by filling\
    \ the entire frame buffer with a blank character tile. So we might try to use\
    \ memset like this:\n\n```\nmemset(vram, 0x10, sizeof(vram));\n```\n\nIf we tried\
    \ this, we'd see garbage instead of a clear screen. What gives?\n\nThe Z80 has\
    \ a special instruction, LDIR, that can copy a range of bytes to another location.\
    \ The C compiler uses this instruction for memcpy and memmove. The memset routine\
    \ uses it too, but it sets a single zero in memory, then LDIR copies that zero\
    \ to all subsequent locations.\n\nHere's the problem: on this platform we can't\
    \ read from video memory (vram, sprites, etc), only write. When LDIR tries to\
    \ copy your target by, it'll read zeros, or garbage bytes.\n\nInstead, we use\
    \ our own memset_safe routine for video and object RAM, which only writes to these\
    \ regions:\n\n```\nvoid memset_safe(void* _dest, char ch, word size) {\n  byte*\
    \ dest = _dest;\n  while (size--) {\n    *dest++ = ch;\n  }\n}\n```"
- md: "\n# Game: Solarian\n\nWe're going to make another game! We'll call it Solarian\
    \ (since our enemies are local to the solar system, not from another galaxy or\
    \ anything...)\n\n> To see it on 8bitworkshop.com: Select the Scramble Hardware\
    \ platform, then select the Solarian Game file.\n\nIn Solarian, enemies will be\
    \ in one of two primary states: in formation, or flying around. For enemies in\
    \ formation, their position will be implied by its position in the array, as seen\
    \ in Figure 18.1.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_122_0.png)\n\nFigure\
    \ 18.1: Array indices of enemies in formation\n\nSo we really only need a single\
    \ byte for each FormationEnemy, to tell us if it is present and what shape to\
    \ draw:\n\n```c\ntypedef struct {\n    byte shape; // shape code\n} FormationEnemy;\n\
    ```\n\nThe attacking enemies have more complex state. They have arbitrary X and\
    \ Y coordinates, and can fly in multiple directions. We also want to track their\
    \ original formation index so they can return to their original positions. The\
    \ AttackingEnemy struct looks like this:\n\n```c\n// should be power of 2 length\n\
    def struct {\n    byte index; // formation index\n    byte shape; // shape code\n\
    \    word x; // X position (* 256)\n    word y; // Y position (* 256)\n    byte\
    \ dir; // direction (0-31)\n    byte returning; // 1 = back to formation\n} AttackingEnemy;\n\
    ```\n\nAttackingEnemy attackers[MAX_ATTACKERS];\n\nThe _unused field is to pad\
    \ the struct so that it's exactly 8 bytes long. It's generally best that structs\
    \ destined to be in arrays have lengths that are powers-of-two. (We'll talk about\
    \ this in Chapter 20.)\n\nYou might ask why the X and Y coordinates are 16-bit\
    \ (word type) instead of 8-bit, when our screen coordinates go as high as 255.\
    \ This will be treated as 16-bit fixed-point values. This means that we treat\
    \ some of the bits in the value as fractional. In this case, we consider the entire\
    \ lower byte to be 1/256th of its integer value. It's like putting an invisible\
    \ decimal point between each 8 bits of the 16-bit value, between the two bytes:\n\
    \n```\nHi Byte Lo Byte\n------\nNNNNNNNN.ffff\n```\n\n## 18.1. Drawing Tiles vs.\
    \ Sprites\n\nTo turn an integer into a fixed-point value, we simply shift by 8\
    \ bits, which is the same as multiplying by 256:\n\n```c\nxx = x << 8;\n```\n\n\
    Similarly, we can extract the integer part of the fixed-point value by shifting\
    \ right by 8 bits:\n\n```c\nx = xx >> 8;\n```\n\nOur C compiler is smart enough\
    \ to know that when you shift a 16-bit value by 8 bits, all you have to do is\
    \ load the high byte of the value. So shifting by 8 bits doesn't take any extra\
    \ time at all.\n\nIf we want the fractional value, we just extract the lower byte,\
    \ maybe with a bitmask:\n\n```c\nxfrac = fpx & 0xff;      // use bitmask\nxfrac\
    \ = (byte)fpx;     // same thing\n```\n\nThe Galax hardware only supports 8 sprites\
    \ at a time, but we want to have dozens of enemies on the screen. The hardware\
    \ has a clever solution for this: just use the background tiles for enemies in\
    \ formation, and only use sprites when enemies are flying around.\n\nSince the\
    \ hardware has column scroll support (this translates to scrolling horizontal\
    \ rows when the screen is rotated), we can move entire rows of enemies left to\
    \ right.\n\nWe can make it seamless enough that the player won't notice when an\
    \ enemy takes flight and transitions from background tile to sprite, and potentially\
    \ back again.\n\n```c\nvoid draw_row(byte row) {\n    byte i;\n    byte y = 4\
    \ + row * 2; // compute row position\n    // set palette entry for row\n    columns[y].attrib\
    \ = 0x2;\n    // scroll position for row (global variable)\n    columns[y].scroll\
    \ = formation_offset_x;\n    // loop over all enemies\n    for (i=0; i<ENEMIES_PER_ROW;\
    \ i++) {\n        byte x = i *3; // tile position within row\n        byte shape\
    \ = formation[1 + row+ENEMIES_PER_ROW].shape;\n        // is an enemy present\
    \ in this space?\n        if (shape) {\n            putchar(x, y, BLANK); // left\
    \ side\n            putchar(x+1, y, shape-2); // right side\n        } else {\n\
    \            putchar(x, y, shape); // left side\n            putchar(x+1, y, BLANK);\
    \ // right side\n        }\n    }\n}\n```\n\nTo save CPU cycles, we draw the formation\
    \ rows individually, only drawing one row per frame. The formation will slowly\
