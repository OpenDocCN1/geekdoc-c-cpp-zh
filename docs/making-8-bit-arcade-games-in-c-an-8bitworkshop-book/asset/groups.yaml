    ## 1.6. CPU Instructions


    “write memory.” Again, the bus devices look at the address bus and the write signal
    and decide if they should listen or ignore it.


    "Let’s say a memory chip responds – the memory chip would read the 8-bit value
    off the data bus and store it in the memory corresponding to address $1234. The
    CPU does not get a response from a write; it just assumes everything worked out
    fine."


    The example CPU instructions we’ve seen so far have been in a human-readable language
    called assembly language. The CPU isn’t fluent in this language, but it understands
    a compact code called machine code. A program called assembler takes the human-readable
    assembly code and produces machine code. For example:


    ```

    1d      a, (#x1234)      -> 3A 34 12

    ```


    This assembly instruction translates to three bytes of machine code: $3A, $34,
    and $12. $3A is the opcode which determines the instruction and addressing mode.
    $34 and $12 are part of the operand, which in this case is a 16-bit number spanning
    two bytes.


    > You’ll note when we split the 16-bit value $1234 into bytes, the $34 is first
    and the $12 is second – this is because our CPU is a little-endian processor,
    expecting the least-significant parts of multibyte numbers first.


    > The least-significant byte (LSB) is also called the low byte, while the most-significant
    byte (MSB) is also called the high byte.


    ## The Z80 CPU


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_19_0.png)


    Throughout most of the 1970s, CPUs were still prohibitively expensive for arcade
    games, at costs of hundreds of dollars per unit. Thus, many early arcade games
    were built without CPUs — just custom designed circuits. For example, Atari’s
    original Pong game contained 66 microchips wired together on a custom PCB (Printed
    Circuit Board). These components implemented the entire game logic, video signal,
    and sound.


    The Intel 8080 CPU cost around $100 per unit at this time, and competitors were
    eager to get in on the market. Federico Faggin defected from Intel to find Zilog
    and develop the Z80 CPU, a souped-up version of the 8080. It would be used as
    the basis for many home computers and video consoles, as well as coin-operated
    arcade games (the subject of this book!)


    Compared to the much-cheaper MOS 6502, the Z80 was more powerful and complex.
    It had many more registers – seven sixteen-bit registers and four alternate registers
    compared to the 6502’s five 8-bit registers. It could add and subtract 16-bit
    values, which on the 6502 had to be done in separate 8-bit instructions. It also
    had block memory, I/O, and search instructions, which could operate on multiple
    values with a single instruction.


    Whereas the 6502 mapped both memory and I/O devices into a single 64k space, the
    Z80 separated the two. The IN and OUT instructions perform input and output, while
    instructions like LD perform memory operations. Still, some system designers opted
    to ignore the I/O instructions and mapped everything into memory space anyway.


    The Z80''s original clock speed was 2.5 MHz, which seems much faster than the
    6502''s 1 MHz — but instructions on the Z80 take at least twice as many as the
    6502, so the clock increase is not as significant as it may seem.


    ## 2.1. Registers


    The Z80 has eight 16-bit registers, each identified by a two-letter pair. Each
    register pair has its own "personality", which corresponds to the kinds of CPU
    instructions available to it:


    - AF - This pair''s 8-bit registers are usually treated separately. The A register
    is the accumulator and is used by many instructions. F is the flags register and
    its bits are cleared and set depending on the results of instructions.

    - BC - General-purpose 16-bit register. Can load/store memory to/from A only.

    - DE - Another general-purpose 16-bit register.

    - HL - Useful for 16-bit arithmetic operations, can also use any 8-bit register
    for read/write operations.


    The 8-bit components of each of the above can be addressed separately; for example,
    B is the low byte (least significant byte) of the BC register.


    $1_5 1_4 1_3 1_2 1_1 0_9 0_8 0_7 0_6 0_5 0_4 0_3 0_2 0_1 0_0$ (bit position)


    Main registers


    | A | Flags | AF (accumulator and flags) |

    |---|---|---|

    | B | | BC |

    | D | | E |

    | H | L | HL (indirect address) |

    | Alternate registers | | |

    | A'' | Flags'' | AF'' (accumulator and flags) |

    | B'' | C'' | BC'' |

    | D'' | E'' | DE'' |

    | H'' | L'' | HL'' (indirect address) |

    | Index registers | | |

    | IX | | Index X |

    | IY | | Index Y |

    | SP | | Stack Pointer |

    | Other registers | | |

    | | I | Interrupt vector |

    | | R | Refresh counter |

    | Program counter | | |

    | | PC | Program Counter |

    | Status register | | |

    | Z - H - M - P - N Flags |


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_21_0.png)


    The other 16-bit registers are as follows:


    **PC - The Program Counter.** It holds the address of the currently executing
    instruction.


    **SP - The Stack Pointer.** It holds the current address of the top of the stack,
    and is used by the PUSH and POP operations, as well as CALL and RET.


    **IX - An index register**, which is used for addressing modes (IX+register).
    Our C compiler reserves it as the frame pointer.


    **IY - Another index register.** The compiler uses it to hold memory addresses.


