    Earlier we promised to talk about pointers, and so here we are! So what is a pointer?
    That question has an simple answer, but to really understand them you have to
    see them at work. So let''s start:


    # 11.1 A Pointer is a Typed Memory Address


    A pointer is just a memory location with a type attached. Internally, it''s a
    16-bit number, since the Z80 uses 16-bit addresses.


    type* name

    Declares a pointer that points to an object of type type.


    We declare a pointer by putting a * after the type. So a pointer to a byte named
    ptr would be declared like this:


    byte* ptr;


    You can assign pointers just like you would any other variable — they''re just
    16-bit values underneath. In fact, you can directly set them to a memory address:


    ```

    byte* ptr = (byte*)0x4800;

    ```


    The (byte*) is a type cast which converts the number to a pointer.'
  - '[PAGE 80]


    # 11.2. A Pointer is a Reference To Another Variable


    # 11.2 A Pointer is a Reference To Another Variable


    Usually, you don''t want to set the address of a pointer directly, but you want
    to set it to the address of another variable. You can create a pointer to any
    object using the & operator.


    ```

    &&x

    Returns a pointer to x.

    ```


    In this example, we first set x to 10. We then declare a pointer and set it to
    the address of x. Then through the pointer, we set x to 20:


    ```

    byte x = 10;

    byte* ptr = &x;

    *ptr = 20;

    ```


    Note the last line, *ptr = 20. The * means we''re dereferencing the pointer —
    in other words, we''re no longer treating it as a pointer, but as the object at
    the other end of the pointer.


    > *x

    Dereferences the pointer x (reverses the & operator).


    Pointers are especially useful when dealing with arrays, because you can compute
    a pointer to a particular array index once, using it for multiple operations.


    # 11.3 A Pointer is a String


    In our "Hello World" chapter, we printed a string:


    ```

    printf("HELLO WORLD"); // output some text

    ```


    What we actually passed to the printf function, though, was a pointer. We could
    have rewritten the code like this:'
  - "[PAGE 81]\n\n```\nchar* text = \"HELLO WORLD\"; // pointer to string\nprintf(text);\n\
    ```\n\nIn C, a string is just a pointer to an array of char, usually\nterminated\
    \ by a zero byte (or null terminator). We could have\nalso rewritten our code\
    \ like this:\n\n```\nchar text[12] =\n{'H','E','L','L','O ','W','O','R','L','D',0};\n\
    printf(text);\n```\n\nWait a second, doesn't text[12] define an array? How are\
    \ we\npassing it to printf, which takes a pointer argument? The C\ncompiler will\
    \ convert the array to a pointer, passing the address\nof the first element of\
    \ the array.\n\n# 11.4 A Pointer is an Array ... Sort Of\n\nPointers and arrays\
    \ have a lot in common, and often can be used\ninterchangeably. For example, this\
    \ function draws a string to\nthe screen one at a time:\n\n```\nvoid putstring(byte\
    \ x, byte y, const char* string) {\nbyte i;\nfor (i=0; string[i]; i++) {\n  putchar(x++,\
    \ y, string[i]);\n}\n}\n```\n\nNote for the statement where we use string[i] as\
    \ the condition.\nThis makes the loop continue as long as the current character\
    \ is\nnon-zero; i.e. we exit when we hit the final zero byte.\n\nWe can rewrite\
    \ this function using pointers exclusively:\n\n```\nvoid putstring(byte x, byte\
    \ y, const char* string) {\nwhile (*string) {\n  putchar(x++, y, *string++);\n\
    }\n}\n```"
