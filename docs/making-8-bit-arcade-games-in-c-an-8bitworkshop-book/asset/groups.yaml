    // assumes test_x and test_y\nActor* test_collisions(Actor* a) {\nwhile (a) {\n\
    \    if ((byte)(test_x - a->y + 16) < 32 &&\n        (byte)(test_x - a->x + 16)\
    \ < 32 &&\n        test_actor_pixels(a)) {\n        return a; // collision found!\n\
    \    }\n    a = a->next;\n}\nreturn NULL; // no collision found\n}\n```\n\nAny\
    \ objects which pass the bounding box test move on to the test_actor_pixels function\
    \ which performs a pixel-accurate collision test. We start by computing the intersection\
    \ of the two bounding rectangles for each sprite being compared:\n\n```\nbyte\
    \ x1 = maxbyte(test_actor->x, a->x);\nbyte y1 = maxbyte(test_actor->y, a->y);\n\
    byte x2 = minbyte(test_actor->x + test_actor->shape[0]+2,\n    a->x + a->shape[0]*2);\n\
