  - "[PAGE 135]\n\n# 18.9. Keeping in Sync with Interrupts\n\nWe also want a big noisy\
    \ boom in channel C when the player explodes, one that starts loud and quickly\
    \ fades. We use the player_exploding variable for the volume. We have to set the\
    \ 6th bit in the Enable register to mix the noise generator into Channel C:\n\n\
    ```\nif (player_exploding && player_exploding < 15) {\n  set8910a(AY_ENV_VOL_C,\
