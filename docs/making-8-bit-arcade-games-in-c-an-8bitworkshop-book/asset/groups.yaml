    \ pixels with value 0 are not written. This makes it easy to do transparency.\n\
    - SOLID: Before writing to memory, the blitter replaces the data with a fixed\
    \ color pattern (a two-pixel byte). If used in tandem with the transparency bit,\
    \ this can be used to draw text or single-color sprites.\n- RSHIFT: If set, shifts\
    \ the source data one pixel to the right. Since every byte holds two pixels (4\
    \ bits each) this is useful for drawing to a rectangle starting at an odd-numbered\
    \ X coordinate. (Pre-blitter games had two copies of each sprite, one copy shifted\
    \ a single pixel to the right)\n- EVENONLY: Only draw pixels with even X-coordinates\
    \ (the upper 4 bits of each byte). Can be used to draw individual pixels, or special\
    \ effects.\n- ODDONLY: Only draw pixels with odd X-coordinates (the lower 4 bits\
    \ of each byte).\n\nIn C, the blitter hardware registers are defined as follows:\n\
    \n```\n// blitter flags\n#define SRCSCREEN 0x1\n#define DSTSCREEN 0x2\n#define\
    \ ESYNC 0x4\n#define FGONLY 0x8\n#define SOLID 0x10\n#define RSHIFT 0x20\n#define\
