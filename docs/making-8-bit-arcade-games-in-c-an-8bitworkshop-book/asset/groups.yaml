    \ 程序遍历列表，使用我们在第 2 章中学的边界盒（bounding box）：\n\n```\n// 假设有 test_x 和 test_y\nActor*\
    \ test_collisions(Actor* a) {\n  while (a) {\n    if ((byte)(test_x - a->y + 16)\
    \ < 32 &&\n        (byte)(test_x - a->x + 16) < 32 &&\n        test_pixels(a))\
    \ {\n        return a; // 发现碰撞！\n    }\n    a = a->next;\n  }\n  return NULL;\
    \ // 未碰撞\n}\n```\n\n通过边界盒测试的对象进入 `test_pixels` 函数进行像素级碰撞检测。我们通过计算每个精灵两个矩形的交集开始：\n\
    \n```\nbyte x1 = maxbyte(test_actor->x, a->x);\nbyte y1 = maxbyte(test_actor->y,\
    \ a->y);\nbyte x2 = minbyte(test_actor->x + test_actor->shape[0],\n    a->x +\
    \ a->shape[0]);\nbyte y2 = minbyte(test_actor->y + test_actor->shape[1],\n   \
    \ a->y + a->shape[1]);\nif (x2 <= x1 || y2 <= y1) return false;\n```\n\n![img/bbb7f6aa3459811663faffe7a93b60_199_0.png)\n\
    \n图 27.2：两个精灵边界盒的交集\n\n如果交集为空，我们继续进行像素测试。我们只想测试交集内的像素，因此我们通过复杂的数学计算找到每个 Actor\
    \ 像素数据的左上角。从那时起，只需遍历每个像素并查看是否有像素碰撞：\n\n```\n// 指向每个 Actor 像素数据的左上角指针\np1 = &test_actor->shape[2*(y1-test_actor->y)\
    \ * test_actor->shape[0]];\np1 += (x1 - test_actor->x) >> 1;\np2 = &a->shape[2*(y1-a->y)\
    \ * a->shape[0]];\np2 += (x1 - a->x) >> 1;\n\n// 遍历交集矩形的每个像素\nfor (y=y1; y<y2;\
    \ y++) {\n    for (x=x1; x<x2; x++) {\n        if (p1[x] && p2[x]) return true;\
    \ // 像素碰撞\n    }\n    // 移动到像素数据的下一行\n    p1 += test_actor->shape[0];\n    p2\
    \ += a->shape[0];\n}\nreturn false; // 无像素碰撞\n```\n\n碰撞程序不检查 RAM，只使用存储在 ROM 中的精灵表。\n\
    \n注意一个字节包含两个像素，所以即使像素设置在一个精灵中，而右侧像素设置在另一个中，我们也能检测到碰撞。这对于我们的目的足够了！\n\n## 27.4 裁剪\n\
    \nblitter 不执行裁剪（除了 Sinistar，其硬件支持一个可选的裁剪窗口），因此你可以放心地写出屏幕边界。从底部写入会将精灵环绕到顶部，偏移一个像素。然而，从右侧写入可能会消耗掉你大量的全局变量。\n\
    \n裁剪的正确实现涉及精灵矩形与屏幕矩形的交集，并且只绘制交集内的像素——类似于我们在像素碰撞测试中所做的。\n\n更简单的解决方案是：永远不要超出屏幕边缘！在某些地方（如爆炸渲染\
