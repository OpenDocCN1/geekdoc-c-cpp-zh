- md: "\n# 5\nThe 8bitworkshop C IDE\n\nIn this chapter, we'll discuss the tools we'll\
    \ use to develop and test our game code. These tools comprise our interactive\
    \ development environment, or IDE.\n\nTo start the IDE, visit http://8bitworkshop.com/\
    \ in a web browser. For best results, use a recent version of Google Chrome, Mozilla\
    \ Firefox, or Apple Safari.\n\nThe IDE supports all arcade platforms covered in\
    \ this book. To switch between platforms, click the Menu at the upper-left of\
    \ the page, choose one from the Platform menu, as shown in Figure 5.2.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_41_0.png)\n\
    \n![](img/bbb7f6aa3459811663fcfaffe7a93b60_42_0.png)\nFigure 5.2: IDE platform\
    \ menu\n\nThe IDE is packaged with several example programs. To the right of the\
    \ menu icon, you can access a pulldown menu that allows you to select a file to\
    \ load, as shown in Figure 5.3.\n\nYou can edit these files as much as you want\
    \ — all changes are persisted in browser local storage and they'll be there if\
    \ you close the browser tab and come back. To reset and fully clear your changes,\
    \ select **Reset to Original** from the menu.\n\nTo start from scratch, select\
    \ **New File** from the menu. Type in the name of your new file, typically with\
    \ a “.c” extension for C source files. (You can also do Z80 assembler with the\
    \ “.asm” extension.)\n\n| Minimal Example |\n|---|\n| Local Files ---- |\n| -----\
    \ Shared ----- |\n| Chapters ---------- |\n| ✓ Minimal Example |\n| Hello World\
    \ |\n| Graphics Test |\n| Sound Test |\n| Snake Game (Prototype)|\n| Snake Game\
    \ (Full)|\n| Music Example |\n\nFigure 5.3: IDE pulldown\n\nTo share your file\
    \ with others, select Share File as GitHub Gist from the menu. This will upload\
    \ your file to the GitHub service, and then show you a link that you can copy\
    \ to the clipboard. Send this link to others, and they can view and play your\
    \ source file, making their own local changes if they wish.\n\nThe IDE includes\
    \ an emulator for each arcade platform, which runs the code on a simulated machine.\
    \ To control the game, first click the emulator screen to gain focus. The keyboard\
    \ commands vary from game-to-game, but they are usually as follows:\n\n- Arrow\
    \ keys - Move\n- Space bar - Fire button\n- 5 - Insert coin\n- 1 - Start game\
    \ (1 player)\n- 2 - Start game (2 players)\n\nThe other tool is a C compiler.\
    \ The one we use is called SDCC and also runs in the web browser, along with a\
    \ web-based text editor. Each time you make a change to the code, the IDE immediately\
    \ compiles it and sends the final ROM image to the emulator, allowing you to see\
    \ code changes near-instantly.\n\nThe last tool is a simple debugger that allows\
    \ you to step through machine code instructions, view memory, and start and stop\
    \ the program. The buttons at the top of the screen perform several debugging\
    \ functions:\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_43_0.png)\n\n- Reset:\
    \ Hard reset the emulator, then single-step to the first instruction.\n- Pause:\
    \ Stop the emulator.\n- Run: Resume the emulator after pausing.\n- Step: Execute\
    \ the next CPU instruction, then break.\n- Run To: Set a \"breakpoint\" on the\
    \ current line (the one cursor is on). The emulator will stop when execution reaches\
    \ that instruction.\n\n## 5.1. Debug Window\n\n- Step Out of Subroutine: Run until\
    \ the current subroutine returns, then break.\n- Step Backwards: Step back a single\
