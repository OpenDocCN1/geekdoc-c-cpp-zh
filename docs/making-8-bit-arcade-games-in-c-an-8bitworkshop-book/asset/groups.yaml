    # 2.5. Logical Operations


    ```

    $55 01010101

    OR $1F 00011111

    $5F 01011111

    ```


    Sometimes the compiler emits OR A,A just to set the flags, usually to see if A
    is zero. Similarly, OR A,L tests the 16-bit AL register both A and the operand
    are cleared.


    What about an XOR?


    ```

    xpos ^= 0x1f;

    ```


    XOR (exclusive-or) is like an OR, except that bits that are set in both A and
    the operand are cleared.


    ```

    $55 01010101

    XOR $1F 00011111

    $4A 01001010

    ```


    Note that if we do the same XOR twice, we get the original value back.


    In addition, the SET, RES, and BIT instructions set, clear, and test individual
    bits.'
