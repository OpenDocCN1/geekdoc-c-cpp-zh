- md: "\nIt's often easier to just use hex notation for a single bit:\n\n```\nif (input1\
    \ & 0x10) { /* move left */ }\n```\n\n```\n!expr\nIf expr evaluates to true, return\
    \ 0. Otherwise, return 1.\n```\n\nAll of the switches in Carnival are active low\
    \ except for the coin detector, so we invert them using the boolean inversion\
    \ operator:\n\n```\nif (!input1 & 0x10) { /* move left */ }\n```\n\nIt's easy\
    \ to write C preprocessor macros to write expressions for all the joystick directions,\
    \ buttons, and coin detector:\n\n```c\n#define LEFT1 !(input1 & 0x10)\n#define\
    \ RIGHT1 !(input1 & 0x20)\n#define UP1 !(input1 & 0x40)\n#define DOWN1 !(input1\
    \ & 0x80)\n#define FIRE1 !(input2 & 0x20)\n#define COIN1 !(input3 & 0x8)\n#define\
    \ START1 !(input2 & 0x10)\n#define START2 !(input3 & 0x20)\n```\n\nThen we can\
    \ just use them like this:\n\n```c\nif (LEFT1) { /* move left */ }\n```\n\nThe\
    \ coin detector in VIC Dual is a special and interesting case. It's connected\
    \ to the CPU reset line, so when a coin is detected, the CPU is also reset. Although\
    \ this means the program must start over, memory is not cleared. We can take advantage\
    \ of this fact to increment a credits variable right after the main functions:\n\
    \n```c\nif (COIN1) { // coin detected?\ncredits++; // add a credit\n} else {\n\
    \  test_ram(); // no coin, reset RAM\n}\n```\n\nIf we don’t detect a coin right\
    \ after reset, we assume the machine has just been plugged in, so we clear all\
    \ the RAM and go on with our initialization routine. (Most arcade machines had\
    \ a diagnostic test routine on initial startup.)\n\n## 6.9 Z80 Entry Routine\n\
    \nTypically a C program starts with a built-in entry routine (called crt0 on systems)\
    \ which sets up some registers and memory, then calls the main() function.\n\n\
    Our embedded Z80 system doesn’t have a built-in entry function, so we have to\
    \ write our own — we’ll call it start:\n\n```c\nvoid main(); // we define main()\
    \ later\n\nvoid start() {\n  __asm\n    LD SP,#e800  ; set up stack pointer\n\
    \    DI             ; disable interrupts\n  __endasm\n    main();\n}\n```\n\n\
    First, we’ve declared the main() function; we’ll define it (fill it out) later.\
    \ Then we define the start() function, which includes some inline assembly, bracketed\
    \ by the __asm and __endam keywords. This feature lets us mix assembly code with\
    \ our C code. Here, it sets up the stack pointer to the end of general-purpose\
    \ RAM ($e800) and disables interrupts, which are not used on the Vic Dual platform.\n\
    \nstart() needs to be the very first function we define, because as our entry\
    \ point it needs to start at address 0x0, which the CPU goes to after a reset.\
    \ The last thing it does is call the main() function, which we’ll define as the\
    \ proper start of our program.\n\n## Siege Game\n\nWe’re now going to write a\
    \ full game for the VIC Dual platform. As our inspiration, we’ll use one of its\
    \ early successes, Blockade, a game that’s been replicated many times over the\
    \ years.\n\nThere will be two players that can move in one of four cardinal directions,\
    \ with no stopping. Each player leaves a trail behind them, and the goal is to\
    \ get the other player to hit your trail or their own trail. The player that survives\
    \ scores a point, and the game continues until one player gets a certain number\
    \ of points.\n\nIn the grand spirit of lazy naming, we’ll just use our thesaurus\
    \ and call this game Siege. We’ll first go go over a simple version of the game,\
    \ which lacks scoring and coin-detection.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_58_0.png)\n\
    \nFigure 7.1: Our game for this chapter, \"Siege\"\n\nTo see it on 8bitworkshop.com:\
    \ Select the VIC Dual platform, then select the Siege Game (prototype) file.\n\
    \n## 7.1 Data Structures\n\nWhen starting to program a game, we'll often think\
    \ not only about what code to write, but which data structures best represent\
    \ the state of the game world.\n\n```c\nstruct { field definitions ... }\nDeclares\
    \ a struct type with the given field definitions.\n```\n\nFor Siege, we need to\
    \ track a lot of things for each player — their X and Y coordinate, direction\
    \ of travel, etc. We use typedef to define a struct type (called Player) that\
    \ holds all of a player's attributes:\n\n```c\ntypedef struct {\n    byte x; \
    \                // x coordinate\n    byte y;                 // y coordinate\n\
    \    byte dir;               // direction (0-3)\n    char head_attr;         //\
    \ char to draw player\n    char tail_attr;        // char to draw trail\n    char\
    \ collided;          // did we collide? 1 if so\n} Player;\n```\n\nThe typedef\
    \ just defines a type, it does not declare a variable. Now that we have typedef\
    \ our struct Player, we can declare an array to represent the two players.\n\n\
    ```c\nPlayer players[2];      // two player structs\n```\n\n## 7.2 Main Function\n\
    \nYou can also define and declare structs in one step, without using a typedef:\n\
    \n```c\nstruct {\n  byte x;\n  byte y;\n} players[2];\n```\n\nIt's usually better\
    \ to use a typedef, though, because having the type enables you to easily do things\
    \ like pointers, which we'll make use of.\n\n> Note on C code: We capitalize all\
    \ user-defined types in this book, except for primitive types like byte and word.\
    \ This helps us distinguish types from variables. The POSIX standard uses a suffix\
    \ for its own types, but doesn't say anything about user-defined types. Anyway,\
    \ let's assume it's not a thing yet.\n\nNow we go to the end of our program, where\
    \ we define the main function:\n\n```c\nvoid main() {\n  palette = 0;\n  memcpy(players,\
    \ font, sizeof(font));\n  draw_playfield();\n  while (1) {\n    init_game();\n\
    \    play_round();\n  }\n}\n```\n\n(Why is the main function at the end? Because\
    \ every function has to be defined first, and so on for these functions.) The\
    \ first thing we do is set the video palette to 0, which gives us a nice yellow/cyan\
    \ blend.\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_61_0.png)\n\nFigure 7.2:\
    \ Code Page 0 font\n\nWhen we memcpy our bitmap data from ROM array into the RAM,\
    \ the 8x8 tiles are defined in a const array—256 entries of 8 bytes each, like\
    \ so:\n\n```c\nconst byte BOX_CHARS[256][8] = {\n  { 0x00, 0x00, 0x00, 0x00, 0x00,\
    \ 0x00, 0x00 }, // tile 0\n  { 0x7e, 0x91, 0xa5, 0xb1, 0x95, 0x81, 0x7e }, //\
    \ tile 1\n  ...\n};\n```\n\nThe tile set we've chosen here is a classic font from\
    \ Code Page 0 that contains useful symbols — see Figure 7.2. Before we start the\
    \ game, we set up the screen with draw_playfield – this draws a border around\
    \ the play area, which has its corners at (0,0) and (27,29):\n\n```c\nvoid draw_playfield()\
    \ {\n  draw_box(0,0,27,29, BOX_CHARS);\n}\n```\n\nIncrement or decrement x by\
    \ 1. If this value is used in an expression, x is evaluated after the increment\
    \ takes place. We also have to define draw_box:\n\n```c\nvoid draw_box(byte x,\
    \ byte y, byte x2, byte y2, const char chars[]) {\n  byte x1 = x;\n  // first\
    \ draw the corners\n  putchar(x, y, chars[2]);\n  putchar(x2, y, chars[3]);\n\
    \  putchar(x, y2, chars[0]);\n  putchar(x2, y2, chars[1]);\n  // draw the top/bottom\
    \ sides\n  while(++x < x2) {\n    putchar(x, y, chars[5]);\n    putchar(x2, y2,\
    \ chars[4]);\n  }\n  // draw the left/right sides\n  while (++y < y2) {\n    putchar(x1,\
    \ y, chars[6]);\n    putchar(x2, y, chars[7]);\n  }\n}\n```\n\nThe BOX_CHARS array\
    \ defines the 8 tile characters used for the corners and sides of the boxes. We've\
    \ passed it as the chars parameter to draw_box so you can make different kinds\
    \ of boxes.\n\nThe init_game function sets up the Player objects defined earlier:\n\
    \n```c\nvoid init_game() {\n  memset(players, 0, sizeof(players));\n  players[0].head_attr\
    \ = CHAR('1');\n  players[1].head_attr = CHAR('2');\n  players[0].tail_attr =\
    \ 254;\n  players[1].tail_attr = 254;\n}\n```\n\nWe use memset to fill the entire\
    \ players array with zeroes, which is an easy way to set all the fields of the\
    \ player objects to zero. Then we set the fields that we want to be non-zero,\
    \ like the head_attr and tail_attr fields. Player 1's avatar will be a \"1\" and\
    \ player 2 will be a \"2.\" (Our game universe is very literal!)\n\nWe need a\
    \ function to play a \"round\" of the game, which means until one of the players\
    \ hits something. We define play_round:\n\n```c\nvoid play_round() {\n  reset_players();\n\
    \  clrscr();\n  draw_playfield();\n  while (1) { // loop indefinitely\n    make_move();\n\
    \    // exit loop if either player collided with something\n    if (players[0].collided\
    \ || players[1].collided) break;\n  }\n  flash_colliders();\n}\n```\n\nNote the\
    \ while (1) loop. The while keyword loops as long as its condition in parenthesis\
    \ evaluates to true. Its condition is just 1, which means it'll loop forever.\
    \ Fortunately, we have the break keyword, which immediately exits the current\
    \ loop. So we exit the loop when either player collides with something:\n\n```c\n\
    if (players[0].collided || players[1].collided) break;\n```\n\nLet's go through\
    \ the play_round() function. First, reset_players sets the initial position of\
    \ the two players at the start of the round, and the initial direction of movement:\n\
    \n```c\nvoid reset_players() {\n  players[0].x = players[0].y = 6;\n  players[0].dir\
    \ = D_RIGHT;\n  players[1].x = players[1].y = 21;\n  players[1].dir = D_LEFT;\n\
    \  players[0].collided = players[1].collided = 0;\n}\n```\n"
