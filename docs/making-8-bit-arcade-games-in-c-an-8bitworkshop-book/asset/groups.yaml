    \ + v->y*m->m[2][1] + v->z*m->m[2][2];\n}\n```\n\nWe'll only use 3D coordinate\
    \ values ranging from -86 to 86. Why? To avoid overflow when doing calculations.\
    \ For a 3D transform, we compute the sum of three multiplications for each coordinate.\
