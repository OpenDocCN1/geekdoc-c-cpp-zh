    \ X 轴或 Y 轴滑动，因为通常一个组件会在另一个组件之前清零。\n\n## 23.5. 使用 malloc() 分配内存\n\n到目前，我们将游戏对象存储在全局内存的固定大小数组中。对于这个游戏，我们将\
    \ Actor 存储在动态内存（即堆）中，并通过一种链链表的数据结构来访问它们。\n\n首先，让我们谈谈内存分配。我们见过两种类型的分配：静态分配（全局变量）和栈分配（局部变量）。对于这两种类型，编译器都负责分配和释放——对于全局变量，它们只是在内存中被预留了一个位置。\n\
    \n我们可以使用 `malloc` 在堆中分配固定数量的字节，传递对象的大小：\n\n```c\nmalloc(sizeof(Actor))\n```\n\n\
