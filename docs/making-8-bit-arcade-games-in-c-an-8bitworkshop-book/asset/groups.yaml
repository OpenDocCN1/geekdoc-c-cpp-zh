    # Interrupts


    # 14.1 Interrupts


    The Z80 can receive interrupts, which are external signals that tell the CPU to
    stop what it''s doing and execute a specific code routine.


    Each platform has its own way of generating and handling interrupts. In the Midway
    8080 platform, there are two distinct interrupts: one when the video generator
    reaches scanline 96 (1/3 of the way across the frame) and one at scanline 224
    (the end of the frame).


    The Z80 has three different ways of responding to an interrupt signal; this platform
    uses Mode 0 interrupts. They work like this: When the Z80 receives an interrupt
    signal, it reads a single instruction off the data bus — placed there by the signaling
    device — and executes that instruction.


    The Midway 8080 platform generates RST $08 and RST $10 instructions, so we have
    to make sure we have two interrupt routines, one starting at address $08 and one
    starting at $10.


    The tricky thing about our C compiler is that it, unlike the assembler, does not
    allow us to set specific addresses for our'
