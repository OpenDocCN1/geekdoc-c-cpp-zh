  - '[PAGE 71]


    # 9


    # The Programmable Sound

    Generator


    Video games have had sound since the first Computer Space debuted at a convention
    for jukeboxes. In early arcade game designs, the sound board was often custom-made
    for each title, and included a variety of sound circuits that could be triggered
    from the main CPU board. Since the sounds were hard-wired, there was usually little
    control except “start” and sometimes “stop.”


    Even after the mid-1970s when CPUs got cheap enough to be used in video games,
    designers still used discrete circuits for sound generation. These circuits often
    made use of the ubiquitous 555 timer chip to output a simple oscillating signal,
    sometimes modified by resistor-capacitor filters and/or envelopes. For example,
    Atari’s Pong could generate different sounds — bounce (a short 246 Hz pulse),
    score (a long 246 Hz pulse), and hit (a short 491 Hz pulse).


    As the market for video games and electronic gadgets grew, chipmakers developed
    integrated circuits that produced various sorts of noises in a single chip. One
    of the first was the Texas Instruments SN76477 “Complex Sound Generator,” which
    could be described as a mostly-analog monophonic synthesizer.


    The SN76477 was not programmable, but controlled by external capacitors and resistors,
    sometimes requiring other ICs for more complex noises. The data sheet describes
    example circuits'
  - '[PAGE 72]


    # 9.1. The AY-3-8910 PSG


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_72_0.png)


    Figure 9.1: AY-3-8912 chip, 28-pin DIP package


    such as “BIRD CHIRP.” “STEAM TRAIN WITH WHISTLE,” and “RACE CAR MOTOR/CRASH.”
    In the post 8-bit era, this chip is beloved by DIY synthesizer tinkerers, and
    it had a production run as recently as 2008.


    As microprocessors got cheaper and the personal computer revolution began in earnest,
    it was clear that noisemakers should be controlled by software, not by hard-coded
    circuits. Programmable sound generator (PSG) chips would fulfill this function,
    producing a variety of sounds with no additional components required. The output
    was determined exclusively by a set of registers which were programmed by a CPU.


    # 9.1 The AY-3-8910 PSG


    The General Instrument AY-3-8910 is a popular PSG designed in 1978. It was intended
    to be paired with the company’s CP1600 CPU (used by the Intellivision console)
    and it its variants were used in many arcade games, pinball machines, game consoles,
    and home computers over the next decade and beyond. In fact, as 2010 there were
    still slot machines being produced with compatible sound chips!


    The AY-3-8910 has three primary voices (tone generators) and one noise channel.
    Each voice can emit a tone chosen from 4095 different pitches by dividing a base
    frequency by a 12-bit value. The noise source can be set to one of 32 different
    periods (frequencies).


    The AY-3-8910 has 16 8-bit registers that control its output. (Some bits of some
    registers are unused, and some registers control the GPIO ports which we won’t
    cover here.)'
