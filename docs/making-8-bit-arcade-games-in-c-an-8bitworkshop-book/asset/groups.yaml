    \ 304 像素，但单个字节只能覆盖 256 个值。我们希望像素精确以实现流畅动画，同时也想要良好的性能。折中方案是什么？\n\n![img/bbb7f6aa3459811663faffe7a93b60_200_0.png)\n\
    \n"
