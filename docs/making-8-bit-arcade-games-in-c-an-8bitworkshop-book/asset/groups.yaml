    ## 导入资源


    编写游戏需要大量的资源，如位图、字体和乐谱。在过去，这些都是通过在网格纸上绘制像素并手动构建字节列表完成的。幸运的是，我们现在有了更好的工具可以使用（尽管老方法非常直观！）。


    8bitworkshop IDE 主要侧重于代码，因此我们将图形编辑留给更适合它的工具。我们还编写了一些自己的转换工具，这会让让工作变得更简单。


    ## 30.1 安装 8bitworkshop 工具


    8bitworkshop 工具需要 Python 2.x 和 ImageMagick。在下载工具本身之前，你可能需要先准备好环境。我们为 Ubuntu Linux
    和 Windows 10 提供了操作说明。


    ### 在 Ubuntu Linux 上安装 8BitWorkshop 工具


    - 1. 首先，安装 python、python-pip 和 ImageMagick：


    ```bash

    $ sudo apt update

    $ sudo apt install python-pip imagemagick

    ```


    - 2. 如果你计划转换 MIDI 文件，你需要 `mido` 包。你可以使用 `pip` 命令安装它：


    ```bash

    $ sudo pip install mido

    ```


    - 3. 接下来，下载工具：


    ```bash

