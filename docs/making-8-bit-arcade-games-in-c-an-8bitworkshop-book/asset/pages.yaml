  md: '# 12.3. Graphics


    > To see it on 8bitworkshop.com: Select the Midway 8080 platform, then select
    the Graphics Test file.


    The screen memory is defined with a 224x32 byte array:


    ```

    byte _at (0x2400) vidmem[224][32]; // 256x2241 video memory

    ```


    One of the best things we want to do is draw a sprite, or bitmap, to the screen.
    We''ll write a draw.sprite function:


    ```

    void draw.sprite(const byte* src, byte x, byte y)

    ```


    It takes three parameters, the first of which is a pointer to the sprite data:


    +   - src - pointer to sprite definition/bitmap

    - x - starting cross-scan (V) coordinate

    - y - starting scanwise (U) coordinate


    Our sprite starts with two bytes giving the width and height of the sprite, followed
    by the bitmap data, e.g.:


    ```

    const byte tiny_216.bitmap[] = {

    2, 2,

    0x88,0x88,0x44,0x44};

    ```


    (The width is given in bytes, so multiply it by 8 to get by pixels. Our screen
    is rotated, so the width is actually the height.)


    To draw the sprite, we first compute a pointer to the corner of the target rectangle
    in video memory:


    ```

    byte i,j;

    byte* dest = &vidmem[x][y]; // get pointer to destination

    ```


    Using the src pointer, we then fetch the width and height of the sprite, found
    in the first and second bytes of the sprite definition:


    ```

    byte w = *src++; // fetch width, advance src

    byte h = *src++; // fetch height, advance src

    ```'
