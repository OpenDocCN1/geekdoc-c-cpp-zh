  md: "# 7.2. Main Function\n\ntypedef enum { D_RIGHT, D_DOWN, D_LEFT, D_UP } Direction;\n\
    \nThis effectively defines the following constants:\n\n```\nD_RIGHT = 0\nD_DOWN\
    \ = 1\nD_LEFT = 2\nD_UP = 3\n```\n\n> C style note: Constant values and macro\
    \ definitions are often declared in ALL_CAPS. Don't worry, we're not yelling at\
    \ you!\n\nThe heart of the game is the make_move() function:\n\n```\nvoid make_move()\
    \ {\n  byte i;\n  // delay and read control inputs\n  for (i=0; i<FRAMES_PER_MOVE;\
    \ i++) {\n    human_control(0);\n    wait_for_vsync();\n  }\n  // decide computer\
    \ player's move\n  ai_control(1);\n  // move 2nd player\n  move_player(1);\n \
    \ // move 1st player\n  move_player(0);\n}\n```\n\nThe human_control and ai_control\
    \ functions determine which direction players will go on their next move, while\
    \ the move_player function moves them and checks for collisions.\n\nWhy do we\
    \ loop FRAMES_PER_MOVE times? This is a delay loop that controls the speed of\
    \ the game. Each iteration calls wait_for_vsync (described in the previous chapter)\
    \ waits until the start of a new frame. So each iteration pauses up to 1/60 second."
