  md: "Writing a string of characters to the screen is easy, too:\n\n```\nvoid putstring(byte\
    \ x, byte y, const char* string) {\n    while (*string) {\n        putchar(x++,\
    \ y, *string++);\n    }\n}\n```\n\nThis function loops through the characters\
    \ in the string until it hits a 0, which marks the end of the string. It calls\
    \ putchar and increments the X position for each character. (The string parameter\
    \ — we'll talk about them soon!)\n\n# 6.8 Controllers\n\nThe controller scheme\
    \ differs between VIC Dual games, but we've chosen one for our emulator based\
    \ on Carnival. It features a single left-right joystick and button; we've also\
    \ added the up and down directions.\n\nThe controller inputs come in through the\
    \ CPU's I/O ports; these the game uses four of them:\n\n+   - sfr_at (0x0) input0;\n\
    - sfr_at (0x1) input1;\n- sfr_at (0x2) input2;\n- sfr_at (0x3) input3;\n\nWhen\
    \ a switch is closed (i.e., button pushed or joystick moved) a particular bit\
    \ in a particular input port changes state. \"Active high\" means closing a switch\
    \ (moving a joystick) changes the bit from 0 to 1, \"active move\" means it goes\
    \ from 1 to 0.\n\nWe can test these switches using the bitwise AND operator (\"\
    &\"). We combine a controller input with a bitmask, which has just a single bit\
    \ set — the bit we wish to test. If the controller input also has this bit, the\
    \ AND operation will be non-zero, thus true (C considers all non-zero values to\
    \ \"true\\ Here we use binary notation for the bitmask value:\n\n```\nif (input1\
    \ & 0b00001000) { /* move left */ }\n```"
