  md: 'Our emulator does not model the Math Box precisely, but it’

    got something similar which we’ve designed to be easy-to-use. We’ll call it “The
    Mult Box,” and it has these addresses:


    ```

    $8100-$8101    16-bit sum

    $8102            8-bit multiplicand A

    $8103            8-bit multiplicand B

    $8104-$8105    16-bit dividend (sum / A)

    $810F            compute sum += A * B (strobe)

    ```


    To do a sum-of-products, first set the 16-bit value at $8100 to 0. For each product,
    set $8102 to the first multiplicand and $8103 to the second multiplicand, then
    strobe $810F. The multiplication will commence and the product will be added to
    the 16-bit sum. When finished, read the 16-bit sum at $8100.


    The Mult Box also divides. Before we update sum, it computes the 16-bit dividend
    sum/A and stores it at $8104.


    Using the Mult Box, our transformation looks like this:


    ```

    inline void mul16(byte a, sbyte b) {

    mathbox_arg1 = a;

    mathbox_arg2 = b;

    mathbox_go_mul=0; // mathbox_sum += a * b

    }

    ```


    ```

    void vec_mat_transform(Vector16* dest, const Vector8* v, const

    Matrix* m) {

    byte i;

    // copy a pointer to the first element of our destination

    // vector, and a pointer to the first element of the matrix.

    int* result = &dest->;

    const signed char* mval = &m->m[0][0];

    // loop over all 3 vector elements (x, y, z)

    for (i=0; i<3; i++) {

    mathbox_sum = 0; // reset sum to 0

    mul16(*mval++, v->x);

    mul16(*mval++, v->y);

    mul16(*mval++, v->z);

    *result++ = mathbox_sum; // fetch final sum, store

    }

    ```'
