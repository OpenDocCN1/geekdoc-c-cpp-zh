- img_proc: true
  md: '# 24.4. Setting AUDF Frequency


    The upper nibble selects the polynomial, which controls the output waveform.


    | Hex | Bit # 76543210 | Description | Period |

    |---|---|---|--|

    | XV | ....XXXX | Volume (0-15, 0=off) | noise |

    | 0x | 0000.... | 17-bit poly * 5-bit poly | 31 |

    | 2x | 0010.... | 5-bit poly | 31 |

    | 4x | 0100.... | 4-bit poly * 5-bit poly | 31 |

    | 6x | 0110.... | 5-bit poly | 31 |

    | 8x | 1000.... | 17-bit poly | noise |

    | Ax | 1010.... | pure tone | 2 |

    | Cx | 1100.... | 4-bit poly | 15 |

    | 1x | xxx1.... | Waveform mode | |


    # 24.4 Setting AUDF Frequency


    When using a pure tone, the output frequency of each channel depends on the bits
    set in AUDCTL:


    | Frequency | Condition |

    |---|--|

    | 64 kHz | AUDCTL bit 0 clear |

    | 15 kHz | AUDCTL bit 0 set |

    | 1.79 MHz | AUDCTL bit 6 set (ch1) or bit 5 (ch3) |


    The period of each polynomial roughly determines the audible frequency of the
    tone, lower periods having higher frequency.


    When Fclock is 64000 Hz or 15000 Hz, the output frequency Fout is given by this
    equation:


    ```

    Frequency = \frac{Clock}{PolyPeriod \cdot (AUDF + 4)}

    ```


    When using the 1.79 MHz clock:


    ```

    Frequency = \frac{1790000}{PolyPeriod \cdot (AUDF + 1)}

    ```'
