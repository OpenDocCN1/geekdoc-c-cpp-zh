  md: "# 18.9. Keeping in Sync with Interrupts\n\nOur interrupt handler increments\
    \ a counter every time a VSYNC occurs at the start of each video frame, i.e.,\
    \ every 1/60 second:\n\n```\nvolatile word video_framecount;\n\nvoid rst_66()\
    \ __interrupt {\n    video_framecount++; // increment video framecount\n}\n```\n\
    \nSince our main loop takes a variable number of CPU cycles depending on the activity\
    \ on-screen, we need a way to keep our video frame rate consistent.\n\nOne solution\
    \ is to keep another counter in our main loop. Then we compare the video counter\
    \ against our game loop's framecounter, and spin the CPU as long as they are equal:\n\
    \n```\nvoid wait_for_frame() {\n    while (((video_framecount^framecount) & 3)\
    \ == 0);\n}\n```\n\nAs long as the game loop takes less than 1/60 second, the\
    \ loop will stay in sync with the counter. But if our loop takes longer than that,\
    \ the counter will go out of sync, and the main loop will no longer wait for the\
    \ video signal. It'll get back in sync eventually.\n\nWe only compare the first\
    \ two bits of the counters, so that it takes less time to get back in sync.\n\n\
    > On the Galaxian/Scramble platforms, the main loop must acknowledge an interrupt\
    \ to allow interrupts to continue. This is done by setting enable_irq to 0 and\
    \ then 1."
