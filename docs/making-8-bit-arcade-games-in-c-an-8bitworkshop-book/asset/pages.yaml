  md: '# Integers and You


    Here are a couple of tips for making your integers happy. You''ll be happier,
    and your integers will thank you.


    #  20.1 Powers of Two


    For many reasons, computers (and thus computer programmers) really like to work
    with powers of two. It''s a natural thing, since a binary number N bits long can
    hold $N^2$ distinct values.


    Most C compilers are also aware of the useful properties of binary numbers when
    dealing with powers of two. For example, we can multiply a number by two by shifting
    its bits one slot to the left:


    ```

    x <<= 1; // same as x *= 2

    ```


    Shifting left by N bits is the same as multiplying by $2^N$:


    ```

    x <<= 2; // same as x *= 4

    x <<= 3; // same as x *= 8

    ```


    We can also divide by powers of two (sort of) by shifting to the right:


    ```

    x >>= 1; // same as x /= 2

    x >>= 2; // same as x /= 4

    ```'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'The reason we say "sort of" is because of rounding. For unsigned numbers, division
    by right shifting rounds the number down towards zero:


    | Binary | Decimal |

    |---|---|

    | 00001010 | 9 |

    | 00000101 | 5 |

    | 00000010 | 2 |

    | 00000001 | 1 |

    | 00000000 | 0 |


    For signed numbers, the right shift operation uses sign extension which keeps
    the high bit intact during a shift, so that negative numbers stay negative:


    | Binary | Decimal (twos complement) |

    |---|---|

    | 11110111 | -9 |

    | 11110101 | -5 |

    | 11111101 | -3 |

    | 11111110 | -2 |

    | 11111111 | -1 |


    sign bit


    This means negative numbers will never be rounded to zero, which is a pretty awful
    property for a division routine. C compilers are smart enough to optimize multiplication
    and unsigned division by constant powers of two, sometimes replacing them with
    equivalent bit shifts. But they won''t optimize signed division because of the
    rounding issue.


    For best performance, you should also make the lengths of your array members powers
    of two. Primitive types are fine, but if you defined a struct that is 7 bytes
    long, consider adding a padding byte to make it 8. The C compiler uses multiplication
    to compute the address of an array element, and it can optimize powers of two
    with shifts and/or additions.


    The same applies for multi-dimensional arrays – you’ll have the best performance
    with power-of-two dimensions for subarrays.'
  merge: -1
