  md: "# 8.1. Shift Operations\n\n| expr << n |\n| In C, compute expr shifted left\
    \ by n bits. |\n\nLet's say we wanted a function to double the player's score.\
    \ We could accomplish this by shifting left by 1 bit:\n\n```\nvoid double_score()\
    \ {\n    score <<= 1;\n}\n```\n\nSince score is a 16-bit variable, we need to\
    \ first shift the low byte left, which moves its high bit into the Carry flag.\
    \ Then we rotate the high byte left, shifting the Carry flag into its low bit:\n\
    \n```\n_double_score::\nld iy,#_score ; left shift lo byte\nsla 0 (iy) ; left\
    \ shift lo byte\nrl 1 (iy) ; left shift hi byte w/ carry\nret\n```\n\nThe nn (IY)\
    \ addressing mode computes the effective address as [IY + #nn], allowing us to\
    \ address bytes without explicitly incrementing I."
