  md: '# 9.2 Inline Functions


    Since the set8910() function is pretty simple, we defined it with the inline keyword.
    This forces the compiler to expand it instead of performing a function call. In
    some cases, this not only saves CPU cycles, but code space as well.


    For comparison, this is the assembly output without the inline keyword:


    ```

    0912 21 07 08  [10] 2326      ld      hl, #0x0807

    0915 E3         [19] 2327      ex      (sp),hl

    0916 CD 7E 08  [17] 2328      call    _set8910

    ```


    And here it is with inline:


    ```

    08FF 3E 07      [ 7] 2309      ld      a,#x07

    0901 D3 01      [11] 2310      out     (_ay8910_reg),a

    0903 3E 08      [ 7] 2312      ld      a,#x08

    0905 D3 02      [11] 2313      out     (_ay8910_data),a

    ```


    The inline version takes one extra byte of code per call, saves at least 10 CPU
    cycles per call (plus 50+ cycles for the set8910() function itself). Also, when
    using inline, the function itself won''t be compiled, which saves even more ROM
    space.


    Inline functions also take advantage of constant folding. If all variables in
    an expression like channel+2 are constants, the compiler will evaluate it at compile-time,
    saving many CPU instructions. Constant folding is performed when inlining, so
    any constants passed to the function will likely be optimized.


    In this case, using inline was a win. You can easily check to see if using inline
    improves your code by comparing the size of ROM with and without it. Short and
    simple functions tend to do well with inlining.'
