  md: "For ease of use, we've written some C functions to perform\ncommon blitter\
    \ operations. First is a function to fill a rectangle\nwith a solid color:\n\n\
    ```\n// x1: 0-151\n// y1: 0-255\ninline void blit_solid(byte x1, byte y1, byte\
    \ w, byte h, byte\ncolor) {\n    blitter.width = w*4;\nblitter.height = h*4;\n\
    blitter.start = x1+y1*256; // swapped\nblitter.solid = color;\nblitter.flags =\
    \ DSTSCREEN|SOLID;\n}\n```\n\nFor most of these functions, our X coordinate is\
    \ byte-aligned,\ni.e., it only ranges from 0 to 151 and addresses even pixels.\
    \ This\nis an acceptable compromise in some cases; in other cases, you'll\nwant\
    \ to have the full range of X coordinates available.\n\nThe 6809 CPU has a big-endian\
    \ byte order by default,\nmeans the the most significant byte comes first in address\
    \ order.\nThe Z80 is little-endian, and our emulator uses the 6809's\nbyte ordering,\
    \ so we have to swap the two bytes before\nwriting to the 16-bit blitter registers\
    \ sstart and dstart.\n\nFor the preceding function, we accomplish this just by\
    \ swapping\nthe X and Y coordinates in our calculation. For other cases, you\n\
    can use this swap function:\n\n```\ninline word swapw(word j) {\n    return ((j\
    \ << 8) | (j >> 8));\n}\n```"
