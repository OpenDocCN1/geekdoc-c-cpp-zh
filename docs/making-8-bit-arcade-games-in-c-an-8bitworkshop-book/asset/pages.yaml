  md: '# The Midway 8080 Hardware


    # 12.1 History


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_83_0.png)


    Figure 12.1: Midway’s “Gun Fight” (left) and Taito’s “Space Invaders” (right)


    The first arcade game to use a microprocessor was Gun Fight. Taito originally
    designed the Japanese version with discrete circuits. Dave Nutt adapted the U.S.
    version for Midway, and chose to base it on the Intel 8080 CPU which he had used
    in pinball projects.³ The original designer, Tomohiro Nishikado, was intrigued
    by the design and would later go to create Space Invaders using a similar architecture.⁶


    The Midway 8080 architecture generates video from a black-and-white frame buffer,
    using a whopping 7KB of RAM. (In 1975, the production run of Gun Fight used $3
    million worth of RAM, estimated to be 60 percent of the world’s supply.⁷)'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# 12.2 Memory Map


    | Start | End | Description |

    | --- | --- | --- |

    | $0000 | $1FFF | ROM |

    | $2000 | $23FF | General-purpose RAM |

    | $2400 | $3FFF | Video buffer RAM |


    Table 12.1: Midway 8080 Memory Map


    The Z80 runs Intel 8080 code unmodified; so, in the 8bitwork emulator we just
    use a simulated Z80.


    # 12.3 Graphics


    The video frame has 256 horizontal pixels, and can also be rotated 90 degrees,
    as it is in Space Invaders. Each byte corresponds to eight pixels – for each bit,
    1 means a pixel, 0 means dark. There are 32 bytes per scanline, 32 * 8 = 256 pixels
    across (or upwards if the screen is rotated).


    Since the Midway 8080 doesn’t have any dedicated sprite hardware, we have to write
    code to draw and erase sprites in frame buffer RAM.


    The most basic method we can implement to draw a sprite is to simply copy bytes
    from a bitmap to a rectangle on the screen. We’ll have an outer loop that iterates
    through the scanlines of the sprite, and an inner loop that copies bytes to the
    screen.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_84_0.png)


    Figure 12.2: Midway 8080 frame buffer layout'
