- img_proc: true
  md: '# 24.1. Memory Map


    # 24.1 Memory Map


    | Offset | Name | Description |

    |---|---|--|

    | $00 | AUDF1 | Channel 1 Frequency |

    | $01 | AUDC1 | Channel 1 Control |

    | $02 | AUDF2 | Channel 2 Frequency |

    | $03 | AUDC2 | Channel 2 Control |

    | $04 | AUDF3 | Channel 3 Frequency |

    | $05 | AUDC3 | Channel 3 Control |

    | $06 | AUDF4 | Channel 4 Frequency |

    | $07 | AUDC4 | Channel 4 Control |

    | $08 | AUDCTL | Audio Control |

    | $0A | RANDOM | Random Number (read-only) |


    # 24.2 AUDCTL Bit Map


    The AUDCTL register configures global settings of the POKEY:


    | Bit | Description |

    |---|--|

    | 0 | Clock base (0=64 kHz, 1=15 kHz) |

    | 1 | Channel 2/4 high-pass filter |

    | 2 | Channel 1/3 high-pass filter |

    | 3 | Sync channels 4/3 |

    | 4 | Sync channels 2/1 |

    | 5 | Channel 3 clock 1.79 MHz |

    | 6 | Channel 1 clock 1.79 MHz |

    | 7 | Use 9-bit poly counter |


    The POKEY works by dividing the frequency of a common clock, just like the AY-3-8910
    we covered in Chapter 9. Whereas the 8910 has 12-bit divisors, the POKEY has selectable
    8-bit or bit-16 divisors. The 16-bit divisors are helpful for accurate musical
    pitches, and are configured by pairing two 8-bit channels.


    # 24.3 AUDUCx Bit Map


    Each of the 4 channels has its own AUDC register. The lower nibble of the AUDC
    register sets the 4-bit volume of the channel.'
