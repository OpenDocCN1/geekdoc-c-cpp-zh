  md: '# 9


    # The Programmable Sound

    Generator


    Video games have had sound since the first Computer Space debuted at a convention
    for jukeboxes. In early arcade game designs, the sound board was often custom-made
    for each title, and included a variety of sound circuits that could be triggered
    from the main CPU board. Since the sounds were hard-wired, there was usually little
    control except “start” and sometimes “stop.”


    Even after the mid-1970s when CPUs got cheap enough to be used in video games,
    designers still used discrete circuits for sound generation. These circuits often
    made use of the ubiquitous 555 timer chip to output a simple oscillating signal,
    sometimes modified by resistor-capacitor filters and/or envelopes. For example,
    Atari’s Pong could generate different sounds — bounce (a short 246 Hz pulse),
    score (a long 246 Hz pulse), and hit (a short 491 Hz pulse).


    As the market for video games and electronic gadgets grew, chipmakers developed
    integrated circuits that produced various sorts of noises in a single chip. One
    of the first was the Texas Instruments SN76477 “Complex Sound Generator,” which
    could be described as a mostly-analog monophonic synthesizer.


    The SN76477 was not programmable, but controlled by external capacitors and resistors,
    sometimes requiring other ICs for more complex noises. The data sheet describes
    example circuits'
