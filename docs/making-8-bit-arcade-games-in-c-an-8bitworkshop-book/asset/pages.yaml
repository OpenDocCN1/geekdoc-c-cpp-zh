  md: '# Preface


    Why read this book?


    +   1. You want to learn about the internals of Golden Age arcade games.

    2. You want to experience what it would have been like to program these games
    if you had access to an advanced 8-bit compiler.

    3. You want to learn C on devices with slow CPUs and little RAM.


    You''ll learn all about the hardware of late 1970s-early 1980s arcade games, and
    we''ll create a few simple games with the programming language along the way.


    Why focus on arcade games?


    The arcade games developed in the late 1970s to early 1980s demonstrate a wide
    range of capabilities that evolved over a relatively short period of time. Memory
    and ROM space got bigger, and video hardware got more sophisticated. Sound evolved
    too, from bleeps and bloops to FM and speech synthesis.


    These architectures were even more stripped down than personal computers of the
    time, in some ways. Things like flexibility and ease of programming were not design
    criteria. All of the magic was in the video hardware and sound board, which were
    a few years ahead of technology available for the home.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'All of the system architectures described in this book were used for more than
    one title. Some games were developed by the original manufacturer or their licensees,
    but some were developed unofficially — “bootlegs,” in other words. Bootleg vendors
    could easily duplicate the PCB, made easier by the fact that most arcade games
    included their own schematic in the service manual. Then it was a matter of reverse-engineering
    the original ROM and adapting to the new hardware.


    Emulator developers have pretty much figured out the hardware by now, but with
    this book you can experience the thrill of writing your own “unauthorized” homebrew
    game for an obsolete hardware platform!


    # Which hardware was most influential?


    We''re going to focus on five distinct arcade platforms — hardware that was repurposed
    for several different games. Each was influential or groundbreaking in its own
    way:


    **Midway 8080 (1975-1980):** Developed by Dave Nutting Associates, this 7 kilobyte
    frame buffer not only powered the hugely influential *Space Invaders*, but also
    a couple of dozen other games. Credited as the first arcade platform that used
    a microprocessor.


    **VIC Dual (Sega/Gremlin, 1977-1981):** A tile-based Z80 platform that drove 20
    titles, including some of the first RGB games. Included for its simplicity and
    historic value.


    **Galactic hardware (Namco, 1979-1984):** *Galaxian* was influential for its RGB
    color, smooth sprites, and sparkling starfield background. It influenced or formed
    the basis of several other hardware designs, including Pac-Man, Frogger, and Donkey
    Key.


    **Atari vector hardware (Atari, 1979-1985):** The most successful vector-based
    platform started in black-and-white (Lunar Lander) and later moved to color (*Tempest,
    Star Wars*). It used a Motorola 6502 or 6809 CPU with custom hardware to draw
    vectors and calculate 3D transformations.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Why use C on an 8-bit platform?


    Williams hardware (Williams, 1980-1986): This 6809-based platform used a whopping
    36K of memory for its 16-color frame buffer, and featured custom GPU chips that
    drew sprites at impressive speeds. The dedicated sound CPU, developed first for
    pinball machines, produced some interesting noises.


    # Why use C on an 8-bit platform?


    This is a good question, because it isn''t always a good idea. Using C isn''t
    practical on the Atari 2600, for instance, because of the small amount of RAM/ROM
    space available and the precise timing required. (You could get away with writing
    some time-critical routines in C, though they''d be less efficient.)


    It wasn''t uncommon for programmers to annotate their printed code in pen, handling
    the reams of paper to someone to input the changes into a primitive line editor,
    or even typing out punch cards to feed into a PDP assembler. Others would skip
    the tools, poking machine code directly into an emulator, inviting the fates to
    deliver a power outage and undo their work.


    They certainly were not using C compilers back then — The C Programming Language
    by Kernighan & Ritchie was published in 1978, the same year Space Invaders was
    rolling off production lines. C was relevant in the academic UNIX world, but otherwise
    it was just another programming language among many.


    However, we have modern compiler technology on our side, and for this book we''ll
    be using a fantastic open-source compiler called SDCC (Small Device C Compiler)
    which supports the Z80 chip and has lots of clever optimizations. It isn''t as
    fast as hand-rolled assembler, but it''s a lot easier to write. You''ll still
    get a taste of the limitations that make 8-bit game programming challenging.'
  merge: -1
  pgno: 10
