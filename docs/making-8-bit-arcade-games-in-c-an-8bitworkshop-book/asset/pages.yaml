  md: "# 26.7. Blitting to Pixel Boundaries\n\n# 26.7 Blitting to Pixel Boundaries\n\
    \nTo put a single pixel on the screen with the blitter, just use the SOLID flag\
    \ with a width and height of 1, and put the color index in both nibbles of the\
    \ color argument:\n\n```\ninline void blitter.pixel(word xx, byte y, byte color)\
    \ {\nblitter.width = 1'4;\nblitter.height = 1'4;\nblitter.start = (xx>>1)+y*256;\
    \ // swapped\nblitter.solid = color;\n  (xx&1) ? SOLID|ODDONLY : EVENLY;\n}\n\
    ```\n\nNote that we're passing a 16-bit word as the X coordinate we can address\
    \ individual X coordinates from 0 to 303. We then set the EVENLY or ODDONLY flag\
    \ depending on whether X's first bit is set.\n\nTo draw a sprite at a pixel boundary,\
    \ you can do something similar with the RSHIFT flag. It moves everything to the\
    \ right by pixel. We can pass a 16-bit value for x and use bit 0 to determine\
