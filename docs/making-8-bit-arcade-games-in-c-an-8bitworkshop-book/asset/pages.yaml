    \ using a matrix, we use the following function:\n\n```\nvoid vec_transform2(Vector16*\
    \ dest, const Vector8* v,\n    const Matrix* m) {\n    dest-x = v->x*m->m[0][0]\
    \ + v->y*m->m[0][1] +\\n    v->z*m->m[0][2];\ndest-y = v->x*m->m[1][0] + v->y*m->m[1][1]\
    \ +\\n    v->z*m->m[1][2];\ndest-z = v->x*m->m[2][0] + v->y*m->m[2][1] +\\n  \
    \  v->z*m->m[2][2];\n}\n```\n\nWe'll only use 3D coordinate values ranging from\
    \ -86 to 86. Why? To avoid overflow when doing calculations. For a 3D transform,\
    \ we compute the sum of three multiplications for each coordinate. Our matrix\
    \ coefficients go up to 127, so 86 is the maximum value we can have for our matrix\
    \ until they overflow the 16-bit signed integer (127*86*3 = 32766 < 32767)\n\n\
    Our transform function is a pretty slow and bloated routine. We can do a lot better\
    \ using our custom emulated math hardware, which we'll describe next.\n\n# 22.5\
    \ The Mult Box\n\nThe 6502 CPU does not have multiply or divide instructions,\
    \ which had to be emulated with software routines — this is very slow.\n\nTo speed\
    \ up 3D calculations, Atari vector games (starting with Battlefield and Red Baron)\
    \ used a custom circuit called the \"Math Box,\" built around four AMD 2901 bitslice\
    \ processors.\\¹ It could perform 16-bit multiplications, and divisions much faster\
    \ than the Z80 CPU.\n\nCinematronics games also used these chips.\n\n> ¹The hard-wired\
    \ CPU in Cinematronics"
