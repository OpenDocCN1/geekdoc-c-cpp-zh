  md: "# 1.5. The CPU and the Bus\n\nCPU comes to rest in a different state. Each\
    \ tick is called a clock cycle, or CPU clock.\n\nAll the CPU does is execute instructions,\
    \ one after another. It fetches an instruction (reads it from memory), decodes\
    \ it (figures out what to do) and executes it (does some things in a prescribed\
    \ order). Each instruction may take several clock cycles to execute, each clock\
    \ cycle performing a specific step. The CPU then figures out which instruction\
    \ to grab next, and repeats the process.\n\n```\nFetch Read Memory[PC++]\n   \
    \    Result: $88\nDecode \"no operand\"\n       \"decrement register\"\n     \
    \  \"Y register\"\nExecute Y = Y -1\n```\n\nFigure 1.1: CPU Cycle\n\nDuring each\
    \ clock cycle, the CPU can read from or write to the bus. The bus is a set of\
    \ “lanes” where each lane can hold a single bit at a time. In an 8-bit processor,\
    \ the data bus is eight bits (one byte) wide.\n\nDevices like memory, sounds,\
    \ and video generators are attached to the bus, and receive read and write signals.\
    \ The CPU doesn’t know which devices are connected to the bus – all it knows is\
    \ that it either receives eight bits from a read, and sends bits out into the\
    \ world during a write.\n\nAs bytes are read into the CPU, they are temporarily\
    \ stored in registers, where they can be manipulated further or written back into\
    \ the world."
