    | # | Bits | Color |

    |---|---|---|n| 0 | ... | Black |

    | 1 | .R | Red |

    | 2 | .G | Green |

    | 3 | .GR | Yellow |

    | 4 | B.. | Blue |

    | 5 | B.R | Magenta |

    | 6 | BG | Cyan |

    | 7 | BGR | White |


    To decide which entry of the palette is used for a given cell, the video generator
    looks at the upper three bits of the value in the cell. This gives us eight different
    byte ranges which correspond to eight colors:


    | Start | End | Palette Index |

    |---|---|---|

    | $00 | $1F | 0 |

    | $20 | $3F | 1 |

    | $40 | $5F | 2 |

    | $60 | $7F | 3 |

    | $80 | $9F | 4 |

    | $A0 | $BF | 5 |

    | $C0 | $DF | 6 |

    | $E0 | $FF | 7 |


    Unfortunately, this means that each cell is locked to a particular palette entry.
    Later systems let us assign different palettes to individual cells, but this design
    is relatively primitive.


    This system has a total of four palettes, and to change to a different palette
    you can write to I/O port $40:


    ```

    __sfr __at (0x40) palette; // I/O port $40

    ```


    We''ve used two keywords here, __sfr which indicates a I/O port, and __at which
    defines the I/O address (in this case, 0x40).'
