  md: '# 6.6. A Minimal Main Function


    Our compiler has the types described in the following table:


    | C type | Alias | Bits | Min. value | Max. value |

    |---|---|---|---|---||

    | unsigned char | byte | 8 | 0 | 255 |

    | signed char | sbyte | 8 | -128 | 127 |

    | unsigned int | word | 16 | 0 | 65535 |

    | int, short | - | 16 | -32768 | 32767 |

    | long | - | 32 | -2147483648 | 2147483647 |

    | float | - | 32 | -10³⁸ | 10³⁸ |


    The typedef keyword defines a synonym (or alias) for a type, so you don''t have
    to spell out the entire type declaration each time you use it. Typing signed and
    unsigned is a bit unwieldy, so in most of our sample programs, we use typedef
    statements to make aliases for we use often:


    ```

    typedef unsigned char byte; // byte = 8 bits unsigned

    typed unsigned char sbyte; // byte = 8 bits signed

    typed unsigned short word; // word = 16 bits unsigned

    typed enum enum { false, true } bool; // boolean enum (0 or 1)

    ```


    The type definition comes first, the identifier. For example, becomes an alias
    for unsigned char. (We''ll discuss unsigned enum in the next chapter, but suffice
    to say false = 0 and true = 1.)


    # 6.6 A Minimal Main Function


    > To see it on 8bitworkshop.com: Select the VIC Dual platform, then select the
    Minimal Main file.


    This example main function does the following:


    +   1. Sets the palette index to 1

    2. Fills tile RAM with %FE bytes (binary %11111110)

    3. Loops through all X and Y coordinates from 0 to 31, setting a different color
    for each row.

    4. Goes into an infinite loop (stops the program).'
