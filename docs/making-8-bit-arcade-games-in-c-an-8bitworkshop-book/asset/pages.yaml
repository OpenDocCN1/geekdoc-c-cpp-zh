  md: '# 31


    # Distributing Your Game


    Now that you''ve put hours of work into designing, developing, playtesting, and
    tweaking your game, it''s time to share it with the world!


    In the 8bitworkshop IDE, choose the “Share File” menu item in the IDE to generate
    a shareable web link. Anyone opening this link will see the source code and will
    be able to play the emulated game in the browser. (Note: This will publish your
    source code to the Internet.)


    # 31.1 Making ROM Files


    For certain platforms, you can also play your game on arcade game emulators like
    MAME. For non-Z80 platforms you would have to develop your game in assembly —
    a topic outside the scope of this book, although the IDE has 6502 and 6809 assemblers.


    | Platform | 8bitworkshop ID | MAME driver | Language |

    |---|---|---|--|

    | VIC Dual | vicual | carnival | C/Z80 asm |

    | Galaxian | galaxian | galaxian | C/Z80 asm |

    | Scramble | galaxian-scramble | scramble | C/Z80 asm |

    | Atari B&W Vector | vector-atarwb | asteroid | 6502 ASM |

    | Atari Color Vector | vector-articolor | bwidow | 6502 ASM |

    | Williams | williams | robotron | 6809 ASM |


    Table 31.1: MAME support for 8bitworkshop platforms


