  md: '# 31.2. Playing on Actual Hardware


    Another possibility is to connect a Raspberry Pi (or a fast microcontroller) to
    the address and data bus of the PCB, and write a program to “bit-bang” the data
    onto the bus from the Pi’s GPIO ports. This has been done with some success for
    Atari 2600 cartridges.


    If you know how to program an FPGA board, you could in theory replace the RAM,
    ROM, CPU, sound and video generation logic. Or just write a software emulator
    to the same thing. Or just get a PC running AdvanceMame and stick it in the arcade
    chassis (See where this leads...?)


