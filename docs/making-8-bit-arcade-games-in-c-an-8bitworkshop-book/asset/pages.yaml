  md: "# 15.2 Entropy\n\nIf you find your random numbers are too predictable, you\
    \ could add entropy to your PRNG. This is a source of uncertainty that makes your\
    \ random number stream a little more unpredictable.\n\nSome good sources for entropy:\n\
    \n+   - The player's control inputs\n- A hardware clock or hardware PRNG\n- A\
    \ counter in a VSYNC wait loop\n\nHere's a simple example of adding entropy by\
    \ combining the LFSR value with a controller input. Since our Galois generator\
    \ doesn't like the value 0, we correct it to 1 when we find it:\n\n```\nfunction\
    \ add_entropy() {\n  lfsr ^= input1;\n  if ((lfsr) lfsr = 1;\n}\n```\n\nWhile\
    \ this might make your RNG more unpredictable, it won't necessarily make it non-repeatable!\
    \ If the addition of entropy makes the LFSR return to a previous value, it'll\
    \ emit the same sequence again. But we're playing games, not generating cryptographic\
    \ keys. Experimentation will likely tell you what works and what doesn't."
  merge: -1
