  md: "# 25.2. Big Numbers\n\n# 25.2 Big Numbers\n\nYou can define a floating-point\
    \ value with the float type:\n\n```\nfloat floatval = 123.45;\n```\n\nThey are\
    \ stored as IEEE single-precision floats, which take up 4 bytes of memory and\
    \ range from $-10^{38}$ to $10^{38}$. They only have 23 bits of precision, and\
    \ are very slow to compute on 8-bit platforms, so they are not very useful for\
    \ 8-bit games.\n\nThe long type defines a 4 byte (32-bit) integer type which can\
    \ range from 0 to $2^{32} - 1$ (unsigned). All of the examples in this book get\
    \ just fine with 16-bit numbers — they’re faster and use less memory.\n\n# 25.3\
    \ Advanced Loop Handling\n\nWe covered the break keyword, which exits a loop,\
    \ in Chapter 7. There is also a continue keyword that restarts the loop. It can\
    \ be used in for and while statements. For example:\n\n```\nfor (i=0; i<100; i++)\
    \ {\n  // enemy sleeping?) ignore them\n  if (enemy[i].is_sleeping) continue;\n\
