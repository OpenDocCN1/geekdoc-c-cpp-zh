  md: "# 23.8 Deleting Objects\n\nEventually, objects will be destroyed and we'll\
    \ have to remove them from the list of actors. Removing items from a linked list\
    \ is a little tricky, for a number of reasons:\n\n+   1. The next pointers have\
    \ to be rewritten so that the object to be deleted is skipped in the chain.\n\n\
    +   2. The same goes for the first_actor pointer (the first item in the list).\n\
    \n+   3. It gets complicated if an object is deleted while a list is being iterated\
    \ over.\n\n+   4. Memory must be freed.\n\nWe're going to set a removed flag in\
    \ the Actor object so that we can defer its removal from the linked list until\
    \ later.\n\nAfter we update all objects, we run through the list again to check\
    \ for the removed flag. We keep a pointer to another pointer (the C type is Actor\
    \ **) so that we can rewrite the previous pointer when needed:\n\n```\nActor**\
    \ prev = &first_actor;\n```\n\nWe can grab the Actor pointer from this pointer:\n\
    \n```\nwhile (a = *prev) {\n```\n\nIf the object was removed, we set the previous\
    \ pointer to this object's next pointer — skipping the deleted object:\n\n```\n\
    if (a->removed) {\n    // set previous pointer to skip this actor\n    *prev =\
    \ a->next;\n    // free memory\n    free(a);\n}\n```\n\nOtherwise, we grab the\
    \ address of the next pointer, which becomes our new prev:\n\n```\n} else {\n\
    \    prev = &a->next;\n}\n```"
