  md: '# 26


    # Williams Hardware


    # 26.1 History


    Eugene Jarvis quit Hewlett-Packard to make pinball games for Atari, then Williams
    Electronics hired him to make sound for pinball machines. He used a Motorola 6800
    CPU to make strange noises with an 8-bit digital-analog converter (DAC). He would
    then become lead designer for Williams’ first video game, called Defender.¹¹¹


    The Williams hardware team designed an elegant architecture that left most of
    the power (and responsibility) in the software developers’ hands. Defender uses
    a frame buffer — like Space Invaders but in full color. The frame buffer is 304
    by 256 pixels with 4 bits (16 colors) per pixel, taking up 36 KB of memory — in
    1980, that was a lot. Each of the 16 colors can be chosen from a 256-color RGB
    palette.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_184_0.png)


    Figure 26.1: Williams’ Defender, Robotron'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 26.2. Memory Map


    Lacking any sort of hardware acceleration, the Defender developers achieved its
    lightning speed using pixel-sparse visuals and clever tricks. For games like Joust
    and Robotron, Greg Wegner created a custom blitter chip.¹12 This was a powerful
    4 MHz coprocessor that could draw sprites and rectangles to the frame buffer at
    astounding speeds for the time — moving almost 1 MB/sec of data. Give games like
    Robotron: 2084 their massive sprite count. Called "the Special Chips," they worked
    as a pair, each chip handling 4 bits at a time (a single pixel).¹13


    Defender was one of the first video games to use the Motorola 6809 CPU. Many Williams
    games were written on a Motorola EXORciser, an early desktop computer that could
    assemble 6800 and 6809 programs.¹14


    > We adapted the emulator to run the Williams architecture with the Z80. It runs
    the CPU at 4 MHz, a speed available on the Z80A chips available in 1981.


    # 26.2 Memory Map


    | Start | End | Description | R/W |

    |---|---|---|-|

    | $0000 | $97FF | bankswitched (video RAM, program ROM) | r/w |

    | $9800 | $BFFF | general-purpose RAM | r/w |

    | $C000 | $C00F | video palette | write |

    | $C804 | $C807 | control inputs | read |

    | $C80C | $C80F | control inputs | read |

    | $C900 | $C9FF | bank select | write |

    | $CA00 | $CA07 | bit blitter | write |

    | $CB00 | | video counter | read |

    | $CBFF | | watchdog | write |

    | $CC00 | $CFFF | NVRAM (diagnostics, high scores) | r/w |

    | $D000 | $FFFF | ROM | read |


    Table 26.1: Wililams (Stargate/Robotron/Joust) Memory Map'
