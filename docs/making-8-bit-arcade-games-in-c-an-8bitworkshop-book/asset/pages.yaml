  md: 'The Williams games, especially Robotron: 2084, were famous for their high sprite
    count and tricky video effects.


    Even though the blitter helps with the heavy lifting of moving bytes to the frame
    buffer, a lot of work goes into making a responsive game that animates dozens
    of objects at 60 Hz.


    > To see it on 8bitworkshop.com: Select the Williams (Z80) platform, then select
    the Raster Paranoia Game file.


    # 27.1 Keeping Track of Objects


    Our game has several different linked lists to keep track of different kinds of
    objects:


    +   player_list - Contains just the player and a laser, when shot by the player.
    These are “fast” objects, updated once per frame.


    +   fast_list - All other “fast” objects.


    +   slow_lists - “Slow” objects are only updated once every 4 frames. This saves
    us some CPU time which can be used for other purposes. We have 4 separate lists
    and cycle between them.


    +   effects_list - Exploding objects are moved. Updated every frame.'
