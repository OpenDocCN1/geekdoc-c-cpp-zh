  md: '# 21.5 AVG C Routines


    > To see it on 8bitworkshop.com: Select the Atari Color Vector (Z80) platform,
    then select the Vector Fonts file.


    First, we declare the 4096 16-bit words that the AVG uses at address $A000:


    word _at(0xA000) dvgram[0x1000];


    Our library is going to sequentially write 16-bit words to this array, so we need
    an index into the array:


    ```

    int dwgwrofs; // write offset for DVG buffer

    ```


    When we want to write a new frame of AVG data, we reset this index with dvgreset:


    ```

    inline void dvgreset() {

    dwgwrofs = 0;

    }

    ```


    We call dvgwrite to write a word to the array:


    ```

    void dvgwrite(word w) {

    dvgram[dwgwrofs++] = w;

    }

    ```


    We''ll now define a function to write each opcode type. The ones without any parameters
    are pretty simple:


    ```

    inline void RTSL() {

    dvgwrite(0xC000);

    }

    ```


    ```

    inline void CNTR() {

    dvgwrite(0x8000);

    }

    ```


    ```

    inline void HALT() {

    dvgwrite(0x2000);

    }

    ```'
