  md: '# Appendix A: Troubleshooting


    # Programmer Error


    Programming is hard. Programming in C is harder. Programming in C with a web-based
    IDE and dodgy debugging support? That''s just crazy! :) Anyway, here are some
    common things that go wrong:


    # Forgetting to set the stack pointer


    If you find that your program crashes soon after it starts, you may have just
    forgotten to set the stack pointer in your entry routine! See Chapter 6.


    # Forgetting to initialize data


    If you find that global variables are zero or not the values you expect, you may
    have forgotten to set up the initialized data segment in your entry routine! See
    Chapter 16.


    # Writing outside of array boundaries


    C does not have array boundary checking, so it will happily write to memory outside
    of arrays if you tell it to. This can easily overwrite your variables in RAM.
    Make sure you check array accesses, especially when drawing sprites.


    C has lots of operator precedence rules that can be confusing. When in doubt,
    use parentheses. You may also have to cast your expression to a signed or unsigned
    value – see Chapter 20.


    # Infinite linked lists or corrupt objects


    Getting pointers right when using linked lists is tricky. Make sure you don''t
    keep a pointer to an object after calling free() on an object you''ve malloc()''ed.
    Consider also whether you would prefer to use a simpler data structure, like an
    array.'
  merge: -1
  pgno: 217
