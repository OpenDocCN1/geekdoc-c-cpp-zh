- img_proc: true
  md: "If we don’t detect a coin right after reset, we assume the machine has just\
    \ been plugged in, so we clear all the RAM and go on with our initialization routine.\
    \ (Most arcade machines had a diagnostic test routine on initial startup.)\n\n\
    # 6.9 Z80 Entry Routine\n\nTypically a C program starts with a built-in entry\
    \ routine (called crt0 on systems) which sets up some registers and memory, then\
    \ calls the main() function.\n\nOur embedded Z80 system doesn’t have a built-in\
    \ entry function, so we have to write our own — we’ll call it start:\n\n```\n\
    void main(); // we define main() later\n\nvoid start() {\n  __asm\n    LD SP,#e800\
    \  ; set up stack pointer\n    DI             ; disable interrupts\n  __endasm\n\
    \    main();\n}\n```\n\nFirst, we’ve declared the main() function; we’ll define\
    \ it (fill it out) later. Then we define the start() function, which includes\
    \ some inline assembly, bracketed by the __asm and __endam keywords. This feature\
    \ lets us mix assembly code with our C code. Here, it sets up the stack pointer\
    \ to the end of general-purpose RAM ($e800) and disables interrupts, which are\
    \ not used on the Vic Dual platform.\n\nstart() needs to be the very first function\
    \ we define, because as our entry point it needs to start at address 0x0, which\
    \ the CPU goes to after a reset. The last thing it does is call the main() function,\
    \ which we’ll define as the proper start of our program."
