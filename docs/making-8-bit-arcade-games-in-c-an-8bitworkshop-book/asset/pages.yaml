  md: '# The POKEY Sound Chip


    The POKEY (POtentiometer and KEYboard) is a proprietary sound and interface chip,
    first featured in the Atari home computers and the Battlezone and Asteroids Deluxe
    games. Atari manufactured three versions of the chip, a single-core version for
    home computers and consoles, and dual-core and quad-core POKEYs for arcade games.


    The POKEY chip was designed by Doug Neubauer, who also proved his software skills
    with Atari''s futuristic 3D space combat game Star Raiders. POKEY''s sound generator
    is an upgraded version of the one found on the Atari VCS/2600. Besides making
    sound, it could read paddle controllers and keyboards, handle serial communications,
    and generate random numbers.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_177_0.png)


    Figure 24.1: POKEY chip (by RodCastler, CC BY-SA 3.0)'
  merge: -1
