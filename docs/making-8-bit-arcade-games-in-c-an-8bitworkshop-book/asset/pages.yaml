  md: "# Compiler Oddities\n\nThe SDCC compiler is under active development as of\
    \ 2017, but sometimes you find a compiler bug. (Some of these bugs might be fixed\
    \ by the time you read this!)\n\n# Non-fatal Compiler Internal Problem in file\
    \ ... line number '1018': Definition not found\n\nThe following code generates\
    \ this cryptic error message:\n\n```\nconst byte* e = \"HELLO\";\nwhile (*e >=\
    \ 0) { // condition always true\n  *e++;\n}\n```\n\nThe problem is that e is a\
    \ byte pointer, which is a type alias for unsigned char, and thus the expression\
    \ *e >= 0 is always true. This misses the loop induction optimizer and it spits\
    \ forth a confusing message. The solution is to remove the offending expression,\
    \ or change it so that it isn't always true.\n\n# inline functions don't always\
    \ work\n\nIf you encounter different behavior with the inline keyword than without\
    \ it, you might have found a bug in the compiler.\n\n# char is unsigned by default\n\
    \nSDCC makes the char type unsigned by default. This is not a bug so much as a\
    \ deviation from the majority of C compilers. We use byte and sbyte in our example\
    \ code, except in cases where the sign doesn't matter."
  merge: -1
