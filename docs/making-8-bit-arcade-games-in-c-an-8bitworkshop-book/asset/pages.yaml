  md: 'It''s often easier to just use hex notation for a single bit:


    ```

    if (input1 & 0x10) { /* move left */ }

    ```


    ```

    !expr

    If expr evaluates to true, return 0. Otherwise, return 1.

    ```


    All of the switches in Carnival are active low except for the coin detector, so
    we invert them using the boolean inversion operator:


    ```

    if (!input1 & 0x10) { /* move left */ }

    ```


    It''s easy to write C preprocessor macros to write expressions for all the joystick
    directions, buttons, and coin detector:


    ```

    #define LEFT1 !(input1 & 0x10)

    #define RIGHT1 !(input1 & 0x20)

    #define UP1 !(input1 & 0x40)

    #define DOWN1 !(input1 & 0x80)

    #define FIRE1 !(input2 & 0x20)

    #define COIN1 !(input3 & 0x8)

    #define START1 !(input2 & 0x10)

    #define START2 !(input3 & 0x20)

    ```


    Then we can just use them like this:


    ```

    if (LEFT1) { /* move left */ }

    ```


    The coin detector in VIC Dual is a special and interesting case. It''s connected
    to the CPU reset line, so when a coin is detected, the CPU is also reset. Although
    this means the program must start over, memory is not cleared. We can take advantage
    of this fact to increment a credits variable right after the main functions:


    ```

    if (COIN1) { // coin detected?

    credits++; // add a credit

    } else {

    test_ram(); // no coin, reset RAM

    }

    ```'
