  md: "# 23.6. Linked Lists\n\nTo iterate through all objects in the linked list:\
    \ Start with a pointer to the first object (this is kept separately) then follow\
    \ the “next” pointers in each object until you get a NULL. You’ll visit every\
    \ object in the list.\n\nWe can draw this to all actors, for example:\n\n```\n\
    Actor a = first_actor;\nwhile (a != NULL) {\n    draw_actor(a);      // draw actor\n\
    \    a = a->next;        // move pointer to next actor\n}\n```\n\nTo create a\
    \ new actor and add it to the list, we have to do a couple of things. First, we\
    \ allocate memory for the new actor and get a pointer to it. Then, we set whichever\
    \ needs setting, and set its next pointer. We change the .actor pointer so that\
    \ it’s at the head of the list:\n\n```\nActor* new.actor = (Actor*) malloc(sizeof(Actor));\
    \ // allocate\nmemcpy(a, base, sizeof(Actor));                    // copy starting\
    \ values\na->next = first_actor;                          // set a’s next pointer\n\
    first_actor = a;                                // set head of list ptr.\n\nreturn\
    \ a;\n```\n\nWe pass to new.actor a base pointer that points to an example (prototype)\
    \ object, so that we can easily fill some default data for the new actor, like\
    \ its shape, scale, color, etc. We declare the base actor with a struct initializer,\
    \ which we briefly saw in the previous chapter:\n\n```\nconst Actor ship_actor\
    \ = {\nship_shapes, NULL, 3, 0xb0, WHITE, 7, 0x1\n};\n```\n\nThis constructs an\
    \ Actor struct in ROM with some fields pre-filled with our initialized values.\
    \ We have to put them in the same order as the struct declaration — if we don’t\
    \ put enough values for all of them, the remainder of the struct will be set to\
    \ zero bytes."
