  md: '# 23.6. Linked Lists


    ```

    struct Actor

    first_actor -> struct Actor* next -> NULL

    ```


    Figure 23.2: Linked list data structure


    The (Actor*) expression is a type cast – it converts the untyped (void*) pointer
    to a typed (Actor*) pointer, since we intend to use the allocated memory as an
    Actor struct.


    When we no longer need the allocated memory, we simply call free on the pointer
    returned by malloc:


    ```

    free(a);

    ```


    When using malloc and free, there are a couple of gotchas to watch out for:


    +   - Running out of memory: The C library allocates a finite portion of memory,
    called the heap, In our system, this is whatever RAM is left over after the global
    variables are declared. Because the stack lives at the top end of RAM, you may
    get stack corruption before you run out of memory.

    - Dangling pointers: You might free() an object while still having pointers pointing
    to it. This generally causes problems, especially when the freed object''s space
    is reused by other objects.


    # 23.6 Linked Lists


    If we have a large list of objects that grows and shrinks dynamically, we might
    want to use a linked list.


    A linked list is a chain of objects that are linked by pointers. Each object points
    to the next one in line, and the last object points to NULL. (A NULL pointer is
    a special value that denotes “nothing pointed to,” and it’s usually the value
    of 0. Make sure there’s nothing you want to point to address 0x0!)'
