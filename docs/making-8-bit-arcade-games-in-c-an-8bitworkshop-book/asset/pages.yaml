  md: '# 26.6. Bit Blitter


    We''ll use this for a function which copies data from ROM to a given rectangle
    on the screen while using transparency:


    ```

    void blitter_copy(byte x1, byte y1, byte w, byte h, const

    byte* data) {

    blitter.width = w^4;

    blitter.height = h^4;

    blitter.ssart = swapw((word)data);

    blitter.dstart = x1+y1*256; // swapped

    blitter.solid = 0;

    blitter.flags = DSTSCREEN|FGFONLY;

    }

    ```


    Another approach is to embed the width (in pixel-pairs, i.e., pixel width/2) and
    height in the first two bytes of your sprite definition, like so:


    ```

    const byte sprite1[] = {

    8,16,

    0x00,0x09,0x99,0x00,0x09,0x99,0x90,0x00,

    ...

    };

    ```


    Then draw your sprite like this, using just three parameters:


    ```

    inline void draw_sprite(const byte* data, byte x, byte y) {

    blitter.width = data[0]^4;

    blitter.height = data[1]^4;

    blitter.ssart = swapw((word)(data+2));

    blitter.dstart = x+y*256; // swapped

    blitter.solid = 0;

    blitter.flags = DSTSCREEN|FGFONLY;

    }

    ```'
