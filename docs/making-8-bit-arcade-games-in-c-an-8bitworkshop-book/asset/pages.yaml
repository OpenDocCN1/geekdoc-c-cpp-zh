    \ usually zeroed out before the other.\n\n# 23.5 Allocating Memory with malloc()\n\
    \nUp until now, we've kept game objects in fixed-size arrays in global memory.\
    \ For this game, we're going to keep our actors in dynamic memory, or the heap\
    \ — and access them via a data structure called a linked list.\n\nFirst, let's\
    \ talk about memory allocation. We've seen two types of allocation: static allocation\
    \ (global variables) and stack allocation (local variables). For both types, the\
    \ compiler takes care of allocation and deallocation — in the case of global variables,\
    \ they are simply reserved a slot in memory.\n\nWe can allocate a fixed number\
    \ of bytes in the heap using malloc, passing the size of the object:\n\n```\n\
    malloc(sizeof(Actor))\n```\n\nThe malloc function returns a pointer to the allocated\
    \ memory block, or NULL if the allocation failed due to lack of heap space. To\
    \ use the returned pointer, we do something like this:\n\n```\nActor* a = (Actor*)\
    \ malloc(sizeof(Actor));\n```"
