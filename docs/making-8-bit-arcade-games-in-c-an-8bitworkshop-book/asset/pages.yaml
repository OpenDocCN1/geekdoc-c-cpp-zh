  md: "```\ninline void set8910a(byte reg, byte data) {\n  ay8910_a_reg = reg;\n \
    \ ay8910_a_data = data;\n}\n```\n\n```\ninline void set8910b(byte reg, byte data)\
    \ {\n  ay8910_b_reg = reg;\n  ay8910_b_data = data;\n}\n```\n\n# # 17.6 When Not\
    \ to Use memset\n\nWe might want to clear the screen by filling the entire frame\
    \ buffer with a blank character tile. So we might try to use memset like this:\n\
    \n```\nmemset(vram, 0x10, sizeof(vram));\n```\n\nIf we tried this, we'd see garbage\
    \ instead of a clear screen. What gives?\n\nThe Z80 has a special instruction,\
    \ LDIR, that can copy a range of bytes to another location. The C compiler uses\
    \ this instruction for memcpy and memmove. The memset routine uses it too, but\
    \ it sets a single zero in memory, then LDIR copies that zero to all subsequent\
    \ locations.\n\nHere's the problem: on this platform we can't read from video\
    \ memory (vram, sprites, etc), only write. When LDIR tries to copy your target\
    \ by, it'll read zeros, or garbage bytes.\n\nInstead, we use our own memset_safe\
    \ routine for video and object RAM, which only writes to these regions:\n\n```\n\
    void memset_safe(void* _dest, char ch, word size) {\n  byte* dest = _dest;\n \
    \ while (size--) {\n    *dest++ = ch;\n  }\n}\n```"
