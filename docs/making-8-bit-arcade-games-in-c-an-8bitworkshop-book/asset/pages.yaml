  md: "# 27.2. Getting Rid of Flicker\n\nobstacle_list - Objects which don't move\
    \ at all.\n\nfree_list - A list of free Actor slots that can be used to spawn\
    \ objects.\n\nEach list is a doubly-linked list. Instead of each node pointing\
    \ to the next node, our nodes point to the next and previous node:\n\n```\nstruct\
    \ Actor* next;              // next in list\nstruct Actor** prevptr;     // pointer\
    \ that points to us\n```\n\nOur “previous” actually points to a pointer, not an\
    \ Actor object directly. We do this because the first object in a list has no\
    \ previous object — we make the first object's prevptr point to the head pointer\
    \ of the list. This makes it easy to remove objects without knowing which list\
    \ it contains.\n\n```\nvoid add_actor(Actor* list, Actor* a) {\n  // if is not\
    \ the first object,\n  // rewrite existing head of list’s prevptr\n  if (*list)\
    \ (*list)->prevptr = &a->next;\n  // next pointer points to former head of list\n\
    \  a->next = *list;\n  // prev pointer points to head of list pointer\n  a->prevptr\
