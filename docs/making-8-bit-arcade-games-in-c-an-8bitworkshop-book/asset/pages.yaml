  md: '# 18.1. Drawing Tiles vs. Sprites


    To turn an integer into a fixed-point value, we simply shift by 8 bits, which
    is the same as multiplying by 256:


    ```

    xx = x << 8;

    ```


    Similarly, we can extract the integer part of the fixed-point value by shifting
    right by 8 bits:


    ```

    x = xx >> 8;

    ```


    Our C compiler is smart enough to know that when you shift a 16-bit value by 8
    bits, all you have to do is load the high byte of the value. So shifting by 8
    bits doesn''t take any extra time at all.


    If we want the fractional value, we just extract the lower byte, maybe with a
    bitmask:


    ```

    xfrac = fpx & 0xff;      // use bitmask

    xfrac = (byte)fpx;     // same thing

    ```


    # 18.1 Drawing Tiles vs. Sprites


    The Galax hardware only supports 8 sprites at a time, but we want to have dozens
    of enemies on the screen. The hardware has a clever solution for this: just use
    the background tiles for enemies in formation, and only use sprites when enemies
    are flying around.


    Since the hardware has column scroll support (this translates to scrolling horizontal
    rows when the screen is rotated), we can move entire rows of enemies left to right.'
