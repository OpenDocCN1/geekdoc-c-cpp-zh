  md: '# 1


    # CPU Basics


    Note: If you''re already familiar with 8-bit CPUs, or you''ve read my previous
    book Making Games for the Atari 2600, you can safely skip to the next chapter.


    # 1.1 Bits, Bytes, and Binary


    All digital computers operate on bits and bytes. Let''s review a few things about
    them.


    A bit is a binary value — it can be either zero (0) or one (1). We might also
    say it is off/on, or false/true. The important thing is that it can only have
    one of two values.


    A byte is an ordered sequence of eight (8) bits. There''s nothing special about
    the number 8; it''s just a convenient standard — like a railroad track is the
    width of two horses. We say a computer has an 8-bit architecture if it primarily
    manipulates bytes.


    We can create a written representation of a byte in binary notation, which just
    lists the bits from left to right, for example: %00011011. We can then shorten
    the byte notation by removing the leading zeros, giving us %11011. The % denotes
    a binary number, and we''ll use this notation throughout the book.


    The eight bits in a byte are not just independent ones and zeros; they can also
    express numbers. We assign values to each bit and'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'then add them up. The least-significant bit, the rightmost (our index starts
    at zero, i.e. bit 0), has a value of 1. For each position to the left, the value
    increases by a power of two until we reach the most-significant bit, the leftmost
    (bit 7) with a value of 128.

    Here are the values for an entire byte:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    Let''s line up our example byte, %11011, with these values:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Our Byte | 0 | 0 | 0 | 1 | 1 | 0 | 1 | 1 |

    | Bit*Value | | | | | 16 | | 2 | 1 |


    When we add up all the bits, we get 16 + 8 + 2 + 1 = 27.


    A binary number with N bits has 2^N unique combinations, so an 8-bit number can
    represent 256 different values including zero.


    # 1.2 Hexadecimal Notation


    Binary notation can be unwieldy, so it''s common to represent bytes using hexadecimal
    notation, or base 16. We split the byte into two 4-bit halvesves, or nibbles.
    We treat each nibble as a separate value from 0 to 15, like this:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | Value | 8 | 4 | 2 | 1 | 8 | 4 | 2 | 1 |


    We then convert each 4-bit nibble''s value to a symbol — 0-9 remains 0 through
    9, but 10-15 becomes A through F.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# 1.3. Signed vs. Unsigned Bytes


    Let’s convert the binary number %11011 and see how it would be represented in
    hexadecimal:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---||

    | Value | 8 | 4 | 2 | 1 | 8 | 4 | 2 | 1 |

    | Our Byte | 0 | 0 | 0 | 1 | 1 | 0 | 1 | 1 |

    | Bit*Value | | | 1 | | 8 | | | 1 |

    | Decimal Value | | | 1 | | | 11 | | |

    | Hex Value | | | 1 | | | | B |


    We see in the above table that the decimal number 27, represented as %11011 in
    binary, becomes $1b in hexadecimal format.


    > \$ prefix indicates a hexadecimal number. In C programs, you’ll see hex numbers
    prefixed by “0x”, e.g. 0x1b or 0xAA. We’ll use these two notations interchangeably
    in this book.


    # 1.3 Signed vs. Unsigned Bytes


    One more thing about bytes: We’ve described how they can be interpreted as any
    value from 0 through 255, or an unsigned value. We can also interpret them as
    negative or signed quantities.


    This requires a trick known as two’s complement arithmetic. If the high bit is
    1 (in other words, if the unsigned value is 128 or greater), we treat the value
    as negative, if we had subtracted 256 from it:


    ```

    0-127 ($00-$FF):    positive

    128-255 ($80-$FF):  negative (value - 256)

    ```


    Note that there’s nothing in the byte identifying it as signed — it’s all in how
    you interpret it, as we’ll see later.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.4 Integer Overflow and Arithmetic


    Since the numbers we deal with in 8-bit CPUs are so small, integer overflow is
    a thing we''ll have to deal with often.


    When you add two numbers, the CPU adds just like you by hand, but by binary. Each
    binary digit is added, and if you have to carry the 1 (which only happens when
    adding the bits 1 and 1) you carry it to the next bit. Example:


    | Bit # | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---||}{

