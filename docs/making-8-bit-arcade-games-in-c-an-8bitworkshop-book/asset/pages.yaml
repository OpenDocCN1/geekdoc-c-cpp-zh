  md: '# 2.2. Reading and Writing Memory


    IR - Interrupt and Refresh registers. Special-purpose, not generally used for
    computing.


    There are also four alternate (shadow) registers for AF, BC, DE, and HL. They
    can be quickly swapped with the EX and EX instructions. This is useful for interrupt
    routines.


    # 2.2 Reading and Writing Memory


    Take the following C statement, which assigns one 8-bit variable to another:


    ```

    lives = maxlives;

    ```


    Let''s look at the C compiler''s assembly output. This simple assignment statement
    requires multiple LD instructions:


    ```

    ld      a, (#_maxlives)

    ld      (#_lives)

    ```


    The first LD reads the address of the maxlives variable into the A register. The
    second LD then writes the A register contents to the address of the lives variable.


    Let''s say we wanted to subtract one life (again in C):


    ```

    lives--;

    ```


    The compiler uses the DEC instruction, which decrements its operand by 1:


    ```

    ld      hl, #_lives

    dec     (hl)

    ```


    The DEC instruction can only access memory through a register. So this code first
    loads the HL register with the address of the lives variable, then uses the DEC
    instruction with the (HL) addressing mode. This decrements the value at the address
    in the HL register.'
