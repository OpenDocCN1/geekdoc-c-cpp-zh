  md: '# 29.2. Triggering Sounds from the Main CPU


    An advantage of unrolling the loop is that we update slow-moving values like duration
    and delta less often, effectively increasing their precision.


    # 29.2 Triggering Sounds from the Main CPU


    When the main CPU wants to play a new sound, it sends a single byte command to
    the sound board over its PIA (peripheral interface adapter) port. This immediately
    resets the sound CPU, and its sound program can now read the byte and figure out
    what to do. (This is why in Williams games you never more than one sound at a
    time!)


    ```

    byte __at(0xc08e) sound_pia; // sound PIA

    sound_pia = 0x3f; // prepare sound board

    sound_pia = sound_command; // send sound command

    ```


    Some sounds are more important than others, Williams games have a priority system
    where lower-priority sounds are squelched until higher-priority sounds have finished
    playing. The CPU can keep a table of durations to estimate how long a particular
    sound should play before it can be interrupted.


    > In the 8bitworkshop emulator, the sound ROM must be placed at a certain location
    at memory. The emulator will detect and load it into the virtual sound board.


    const byte __at(0x9000) SOUND_ROM[] = {

    0db, 0x00, 0xb7, 0x20, 0x01, 0x76, 0x11 ....

    };


    To download the ROM, go to the "Williams Sound (Z80)" target and select "Download
    ROM Image". There is an example of converting the ROM image to C array format
    in the williams/ directory of the 8bitworkshop Tools (see Chapter 30.)'
  merge: -1
