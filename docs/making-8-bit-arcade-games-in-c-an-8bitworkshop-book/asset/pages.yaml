    Figure 1.2: Bus


    Besides the 8-bit data bus, our CPU has a 16-bit address bus. The address bus
    describes “where” and the data bus describes “what.” Since the address bus is
    16 bits wide, this gives us 65,536 possible addresses that we can target, each
    address representing a single byte.


    # 1.6 CPU Instructions


    Let’s look at what happens when the CPU executes the LD (Load) instruction:


    ```

    ld a, (#0x1234)

    ```


    This tells the CPU to load the 8-bit register A with the value found at address
    $1234.


    The CPU will set the 16 pins on the address bus to the binary encoding for $1234,
    set the read/write pins to “read memory,” and wait for a response on the data
    bus.


    Devices on the bus look at the address $1234 and determine whether the message
    is for them – by design, only one device should respond. The CPU reads the value
    from the data bus and puts it in the A register.


    If we swap the two operands, we now have a LD instruction that writes to memory:


    ```

    ld (#0x1234),a

    ```


    The CPU will set the address bus to $1234 and the data bus to whatever is in the
    A register, then set the read/write pins to'
