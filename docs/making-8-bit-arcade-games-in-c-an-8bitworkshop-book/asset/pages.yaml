  md: '# 23.7 Function Pointers


    Function pointers are variables that store the address of a function. You call
    a function pointer just like a function, passing it parameters and returning its
    result. The function pointer will call the underlying function at its address,
    which may be one of several different underlying functions.


    We''d like our actors to not only have their own shape and appearance, but their
    own behavior. We can add a function pointer to the Actor definition to give it
    this ability:


    ```

    ActorUpdateFn* update_fn;

    ```


    ActorUpdateFn is a function type, and so ActorUpdateFn* is a pointer to a function.
    The function pointer is declared with a typedef:


    ```

    typedef void ActorUpdateFn(struct Actor*);

    ```


    This tells the compiler that our function type ActorUpdateFn takes a pointer to
    an Actor and returns void (nothing). Any function with the same function signature
    will be compatible – in other words, with the same number and type of parameters
    and the same return type.


    Note that our parameter is of type struct Actor* instead of Actor*. This is because
    we''ve got to declare the function type before the Actor struct is defined, and
    so we need to declare Actor as an incomplete type:


    ```

    struct Actor;

    ```


    This tells the compiler that there is a struct called Actor so we can use it in
    declarations. We don''t know its size or what data members it has yet, so if we
    tried to do anything else besides make pointer types with it, we''d probably cause
    a compiler error. (It''s an incomplete type, just like void.)'
