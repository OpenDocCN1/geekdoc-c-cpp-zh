  md: '# 17.2 Memory Map


    We''ve chosen the Scramble memory map for our emulator — it''s similar to Galaxian
    and used as the basis for many other games:


    | Start | End | Description | R/W |

    |---|---|---||}{

    | $0000 | $3FFF | ROM | read |

    | $4000 | $47FF | program RAM | r/w |

    | $4800 | $4BFF | video RAM | write |

    | $4C00 | $4FFF | video RAM (mirror) | write |

    | $5000 | $50FF | object RAM | write |

    | $6801 | | enable interrupt | write |

    | $6803 | | enable blue background | write |

    | $6804 | | enable stars | write |

    | $7000 | | watchdog timer | read |

    | $8100 | | input 0 | read |

    | $8101 | | input 1 | read |

    | $8102 | | input 2 | read |


    Table 17.1: Scramble Memory Map


    The Galaxian hardware is similar except for these changes:


    | Start | End | Description | R/W |

    |---|---|---||}{

    | $6000 | | input 0 | read |

    | $6800 | | input 1 | read |

    | $7000 | | input 2 | read |

    | $7800 | | watchdog timer | read |

    | $7001 | | enable interrupt | write |

    | $7004 | | enable stars | write |


    Table 17.2: Galaxian Memory Map


    The tilemap is defined as a 32x32 byte array, defined here as the variable vram:


    ```

    byte __at (0x4800) vram[32][32]; // 32x32 cells

    ```


    Each byte selects one of the 256 available tiles.'
