  md: "# 15.1 Galois LFSR\n\n![](img/bbb7f6aa3459811663fcfaffe7a93b60_107_0.png)\n\
    \nFigure 15.1: 16-bit Galois LFSR\n\nA Galois LFSR is perhaps the most simply-implemented\
    \ variety of LFSR. The routine below produces $2^{16} - 1$ (65535) values — all\
    \ 16-bit values except zero.\n\nword fssr = 1;\n\n```\nword rand() {\n  byte lsb\
    \ = fssr & 1;\n  lfsr >>= 1;\n  if (lsb) fssr ^= 0xd400;\n  return fssr;\n}\n\
    ```\n\nSince half of the time a Galois LFSR just performs a simple shift, you\
    \ may have to iterate at least twice to get plausible-looking random values. Because\
    \ the period of a maximal LFSR is odd, you can iterate twice and still get the\
    \ full range of values.\n\nMany LFSRs are also reversible, i.e., the sequence\
    \ can be run backwards. The reverse of the LFSR shown above uses the constant\
    \ $a801$ (the previous constant rotated left by 1 bit):\n\n```\nword rev_rand()\
    \ {\n  byte lsb = (lfsr & 0x8000) != 0;\n  lfsr <<= 1;\n  if (lsb) fssr ^= 0xa801;\n\
    \  return fssr;\n}\n```\n\nAnother cheap source of pseudo-randomness is to just\
    \ read bytes from the code in the ROM directly. The random-ish nature of the machine\
    \ instructions will be good enough for some applications, like a noisy video or\
    \ audio signal. We used this technique in Chapter 13 to draw a random field of\
    \ dots."
