  md: '# 2.3. Flags and Branching


    The ADD/ADC and SUB/SBC instructions handle addition and subtraction. Things get
    more complicated when going beyond 8-bit values. Let''s say we want to add 100
    to the 16-bit score variable:


    ```

    score += 100;

    ```


    Since score is a 16-bit value, the compiler has two additions to make: First it
    must add 100 ($64 in hex) to the low byte of score, and then add the carry to
    the high byte (we covered binary-addition-with-carry in Chapter 1):


    ```

    _add_100_points:

    ld hl,_score

    ld a, (hl)      ; load low byte of score

    add a, #0x64    ; add low byte

    ld (hl),a      ; store low byte of result

    inc

    ld a, (hl)      ; load hi byte of score

    dc a, #0x00    ; add hi byte

    ld (hl),a      ; store low byte of result

    ret

    ```


    For the first addition, HL is loaded with the address of the score variable''s
    low byte, and ADD is used to add the value to the low byte. (As described earlier,
    Z80 is little-endian, which means the least-significant bytes come first in memory.)
    The INC moves HL to the high byte. The second addition takes place, using ADC
    to add the Carry bit.


    # 2.3 Flags and Branching


    The bits of the F register correspond to various flags. They are changed when
    an instruction executes, according to the result of the calculation. Some instructions
    change them in different ways, and some (like LD) do not change them at all.'
