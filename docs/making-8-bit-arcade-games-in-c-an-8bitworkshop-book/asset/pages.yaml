  md: "# 2.3. Flags and Branching\n\n| Bit | Flag | Flag Name | Flag Description |\n\
    |---|---|---|--|\n| 0 | C | Carry | Result overflowed register |\n| 1 | N | Add/Subtract\
    \ | Last op was subtraction |\n| 2 | V | Parity/Overflow | Signed result overflow,\
    \ or even number of bits |\n| 3 4 | H | Half-Carry | Carry bit 3 to 4 |\n| 5 6\
    \ | Z | Zero | Result was zero |\n| 7 | S | Signed | Result is negative |\n\n\
    The CPU keeps the address of the current instruction in a 16-bit register called\
    \ the Program Counter (PC). Typically, the CPU reads an instruction and increments\
    \ the PC to the next instruction, but some instructions change the PC. These are\
    \ called branch or jump instructions. Jumps can be conditional, which means that\
    \ the jump may or may not be taken depending on whether a CPU flag is set.\n\n\
    The flags are often used to check for specific conditions. For example, this C\
    \ statement checks to see if we have any more lives, and end_game if the number\
    \ of lives is zero:\n\n```\nif (lives == 0) {\n    end_game();\n}\n```\n\nThis\
    \ is the compiled output:\n\n```\n_check_lives::\nld      a,(#lives)  ; load A\
    \ with lives\nor      a, a          ; set zero flag\nret     NZ             ;\
    \ return if not zero\njp      --end_game      ; if zero, end game\n```\n\nIt first\
    \ loads the lives into variable A. Next, it uses the OR instruction to set the\
    \ flags, by OR-ing a register with itself (which changes nothing except the flags.)\
    \ The RET NZ instruction checks the Z flag, and returns if it is not set. Otherwise\
    \ execution proceeds to the JP instruction, and we transfer control to the end_game\
    \ function."
