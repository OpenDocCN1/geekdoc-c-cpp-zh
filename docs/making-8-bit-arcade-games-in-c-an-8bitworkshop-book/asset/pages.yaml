  md: "# 18.3 Directions and Trig\n\nWe aliens to be able to fly in any direction,\
    \ so we need to track the angle that they are heading. We’ll encode the angle\
    \ as one of 32 different values — it’s a power of two, which will be helpful.\n\
    \nTo move an X,Y position D units along a vector with angle A, we generally do\
    \ this:\n\n```\nX := X + sin(A) * D\nY := Y + cos(A) * D\n```\n\nFloating-point\
    \ is very expensive in the 8-bit world, and we don’t need nearly much precision,\
    \ so we’ll cheat and use lookup tables.\n\nOur lookup table has 32 values, for\
    \ each integer angle, and ranges from -127 to 127 (we generated this with a Python\
