    \ We also want to track their original formation index so they can return to their\
    \ original positions. The AttackingEnemy struct looks like this:\n\n```\n// should\
    \ be power of 2 length\ndef struct {\n    byte index; // formation index\n   \
    \ byte shape; // shape code\n    word x; // X position (* 256)\n    word y; //\
    \ Y position (* 256)\n    byte dir; // direction (0-31)\n    byte returning; //\
    \ 1 = back to formation\n} AttackingEnemy;\n```\n\nAttackingEnemy attackers[MAX_ATTACKERS];\n\
    \nThe _unused field is to pad the struct so that it's exactly 8 bytes long. It's\
    \ generally best that structs destined to be in arrays have lengths that are powers-of-two.\
    \ (We'll talk about this in Chapter 20.)\n\nYou might ask why the X and Y coordinates\
    \ are 16-bit (word type) instead of 8-bit, when our screen coordinates go as high\
