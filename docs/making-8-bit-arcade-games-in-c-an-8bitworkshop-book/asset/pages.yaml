    \ it's just a matter of looping over each pixel and seeing if any pixels collide:\n\
    \n```\n// pointers to upper-left corner of each actor's pixel data\np1 = &test.actor->shape[2*(y1-test.actor->y)\
    \ * *\ntest.actor->shape[0]];\np1 += (x1 - test.actor->x) >> 1;\np2 = &a->shape[2*(y1-a->y)\
    \ * a->shape[0];\np2 += (x1 - a->x) >> 1;\n\n// loop over each pixel of intersection\
    \ rectangle\nfor (y=y1; y<y2; y++) {\n    for (x=x1; x<x2; x++) {\n        if\
    \ (p1[x] && p2[x]) return true; // pixels collide\n    }\n    // move to next\
    \ line of pixel data\np1 += test.actor->shape[0];\np2 += a->shape[0];\n}\nreturn\
    \ false; // no pixels collided\n```\n\nThe collision routine does not inspect\
    \ RAM; it uses only the sprite tables stored in ROM.\n\nNote that a byte contains\
    \ two pixels, so we'll detect a collision even if the pixel is set in one sprite\
    \ and the right pixel is set in the other. Good enough for our purposes!\n\n188"
  merge: -1
