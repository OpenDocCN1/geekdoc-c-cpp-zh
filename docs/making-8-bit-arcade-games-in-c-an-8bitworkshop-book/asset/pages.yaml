  md: "# 6.7 C Routines\n\nThese two nested loops iterate over every combination of\
    \ x and y from 0 to 31. First y=0 and the x values from 0 to 31, then y=1, etc.\
    \ The cellram[x][y] syntax sets the appropriate byte in video RAM to the right\
    \ side of the =.\n\nThe loop fills each row with successive multiples of 8, from\
    \ 0 all the way to 248. Since the color of a cell is determined by the upper 3\
    \ bits, we should see all 8 colors of the palette.\n\nWe don't have anything else\
    \ to do, so we just go into an infinite loop. This is pretty easy with a white\
    \ statement:\n\n```\nwhile (1);\n```\n\nThe semicolon here denotes an empty statement\
    \ (you could have also used an empty { } block).\n\n# 6.7 C Routines\n\nIf we\
    \ don't want to deal with the cell array directly, we can write some basic C functions\
    \ that read and write particular cells:\n\n```\nvoid putchar(byte x, byte y, byte\
    \ value) {\n  cellram[x][y] = value;\n}\n```\n\n```\nbyte getchar(byte x, byte\
    \ y) {\n  return cellram[x][y];\n}\n```\n\nOr one that clears the entire screen,\
    \ using the efficient library routine memset:\n\n```\nvoid clrscr() {\n  memset(cellram,\
    \ 0, sizeof(cellram));\n}\n```"
