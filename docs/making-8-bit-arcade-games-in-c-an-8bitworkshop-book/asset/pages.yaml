    The example CPU instructions we’ve seen so far have been in a human-readable language
    called assembly language. The CPU isn’t fluent in this language, but it understands
    a compact code called machine code. A program called assembler takes the human-readable
    assembly code and produces machine code. For example:


    ```

    1d      a, (#x1234)      -> 3A 34 12

    ```


    This assembly instruction translates to three bytes of machine code: $3A, $34,
    and $12. $3A is the opcode which determines the instruction and addressing mode.
    $34 and $12 are part of the operand, which in this case is a 16-bit number spanning
    two bytes.


    > You’ll note when we split the 16-bit value $1234 into bytes, the $34 is first
    and the $12 is second – this is because our CPU is a little-endian processor,
    expecting the least-significant parts of multibyte numbers first.


    > The least-significant byte (LSB) is also called the low byte, while the most-significant
    byte (MSB) is also called the high byte.'
