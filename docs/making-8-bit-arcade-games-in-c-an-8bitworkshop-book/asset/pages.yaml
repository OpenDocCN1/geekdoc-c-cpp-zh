    blitter.start = swapw(word)(data+2);\nblitter.dstart = (x>>1)+ y*256; // divide\
    \ X by 2\nblitter.flags = (x&1) ? DSTCRE|FGONLY|RSHIFT: DSTCRE|FGONLY;}\n```\n\
