  md: "# 23.1. Shape Prerendering\n\nIn most vector games, the prerendering was done\
    \ offline by a “real” computer and baked into the ROM. The prerendering software\
    \ could be pretty advanced, for instance performing hidden line removal which\
    \ could take hours. Sometimes shapes were even edited by hand!\n\n\nWe’re going\
    \ to perform the prerendering in RAM, when our program starts. For each shape,\
    \ we're going to choose a limited set of rotations and put the drawing instructions\
    \ into RAM. When we need to draw the shape at a certain angle, we look up the\
    \ prerendering shape’s address in memory and use the JSRL opcode to draw it.\n\
    \nIt’s not as difficult as it seems. First we choose the AVG offset where our\
    \ prerender shapes will start:\n\n```\ndwgwrofs = 0x800; // AVG offset of prerender\
    \ shapes region\n```\n\nWe declare a global buffer for each shape, and choose\
    \ how many rotations our prerender — 32 is a good number:\n\n```\nword ship_shapes[32];\n\
    \ thrust_shapes[32];\n tetra_shapes[32];\n```\n\nPrerendering is the same as drawing:\
    \ compute the transformation matrix, then output the drawing instructions. The\
    \ only difference is a RTSL opcode at the end, since these are subroutines meant\
    \ to be used by the JSRL command:\n\n```\nvoid make_cached_shapes() {\n  Matrix\
    \ mat;\n  byte i;\n  for (i=0; i<32; i++) {\n    ship_shapes[i] = dwgwrofs; //\
    \ start of shape\n    mat_rotate(&mat, 2, i<<3); // 32<<8 = 256\n    draw_wireframe.ortho(&ship.wf,\
    \ &mat);\n    RTSL(); // end of shape\n  }\n  // ...draw other shapes...\n```"
