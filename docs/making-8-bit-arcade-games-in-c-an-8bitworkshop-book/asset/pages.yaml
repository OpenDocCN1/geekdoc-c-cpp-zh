    \ in Sync with Interrupts\n\nWe discussed Mode 0 interrupts in Chapter 13. This\
    \ system uses another Z80 interrupt mode, Mode 2. In this mode, an interrupt always\
    \ causes a jump to address 66. Since our C compiler doesn't have a way to position\
