  md: "We also call human_control during the delay loop, because we want to detect\
    \ control inputs that occur within this time. Checking every 0.0167 seconds should\
    \ be frequent enough for even the quickest joystick-wrangler. The function is\
    \ pretty simple:\n\n```\nvoid human_control(byte p) {\n  Direction dir = 0xff;\n\
    \  if (LEFT1) dir = D_LEFT;\n  if (RIGHT1) dir = D_RIGHT;\n  if (UP1) dir = D_UP;\n\
    \  if (DOWN1) dir = D_DOWN;\n  // don't let the player reverse\n  if (dir != 0xff\
    \ && dir != (players[p].dir ^ 2)) {\n    players[p].dir = dir;\n  }\n}\n```\n\n\
    We declare a local variable of type Direction, first setting it to $FF as a \"\
    no change\" indicator (we can do this enum types are treated like integer types\
    \ by the compiler.) We then check each joystick directional input using the LEFT1/RIGHT1/UP1/DOWN1\
    \ macros we've previously defined.\n\nWe don't want the player to reverse direction,\
    \ because then they would immediately hit their own trail. If we're going left,\
    \ we want to prevent the player from going right.\n\nThat's where the players[p].dir\
    \ ^ 2 expression comes in. The ^ operator is a bitwise exclusive-or (XOR) which\
    \ flips the bits of one operand based on the bits set in the other. Going back\
    \ to our directional constants, let's look at them in binary and how they respond\
    \ to the XOR:\n\n```\nD_RIGHT = %00 ^ %10 = %10\nD_DOWN = %01 ^ %10 = %11\nD_LEFT\
    \ = %10 ^ %10 = %00\nD_UP = %11 ^ %10 = %01\n```\n\nFlipping the second bit effectively\
    \ gives us the reverse direction, which we can then check to make sure we don't\
    \ go that way."
