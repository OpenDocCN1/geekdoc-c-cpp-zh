  md: '# Siege Game


    We’re now going to write a full game for the VIC Dual platform. As our inspiration,
    we’ll use one of its early successes, Blockade, a game that’s been replicated
    many times over the years.


    There will be two players that can move in one of four cardinal directions, with
    no stopping. Each player leaves a trail behind them, and the goal is to get the
    other player to hit your trail or their own trail. The player that survives scores
    a point, and the game continues until one player gets a certain number of points.


    In the grand spirit of lazy naming, we’ll just use our thesaurus and call this
    game Siege. We’ll first go go over a simple version of the game, which lacks scoring
    and coin-detection.


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_58_0.png)


    Figure 7.1: Our game for this chapter, "Siege"'
