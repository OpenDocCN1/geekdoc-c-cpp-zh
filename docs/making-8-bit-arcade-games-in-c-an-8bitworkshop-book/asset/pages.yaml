  md: '# 9.1. The AY-3-8910 PSG


    To turn off the channel, just set the bit in the Channel Enable register:


    ```

    set8910(7, 1<<channel); // disable tone

    ```


    If you plan to use multiple channels, you should track the Channel Enable bits
    in a variable, and set or clear them as necessary before updating the register.


    Playing noise is similar, but there is only one Noise Period register which defines
    the upper frequency of noise – higher values produce lower frequencies:


    ![](img/bbb7f6aa3459811663fcfaffe7a93b60_75_0.png)


    The noise generator can be mixed into any of the three channels, whether a tone
    is playing or not. This example sets the Noise Period register, the Channel Volume,
    and enables the noise bit in the Channel Enable register:


    ```

    set8910(6, noise_period); // set noise period

    set8910(channel+8, volume); // set volume

    set8910(7, ~(8<<channel)); // enable noise

    ```


    These operations can be performed in any order, but note that on the actual hardware,
    the register changes take effect instantly, and there will be some CPU delay between
    register changes.


    The 8910 also has an envelope generator, but this is rarely used as it must be
    shared among all three channels (and our emulator doesn’t support it as of this
    writing). For more information, you can check out the original General Instrument
    datasheet.⁴


    > To see it on 8bitworkshop.com: Select the VIC Dual platform, then select the
    Sound Test file.'
