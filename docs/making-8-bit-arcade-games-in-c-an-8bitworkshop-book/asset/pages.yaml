- img_proc: true
  md: '# 26.6. Bit Blitter


    Here is the basic process for performing a blit:


    +   1. Set the width and height of the rectangle to be blitted. Each value is
    a byte, so the upper limit of each is 255. There is a special hack in the chip
    that makes a height of 255 act like 256, making it easier to draw a shape the
    entire height of the screen.

    2. There is also a bug in early Williams hardware that inverts the 3rd bit of
    the width and height registers. We''ve kept this bug, so instead of setting the
    register to width, you have to set it to width^4.

    3. Set the source address (sstart), which tells the blitter where to copy from.
    (Solid rectangles can omit this.) For sprites, you''d probably point to an array
    in ROM.

    4. Set the destination address (dstart), which tells the blitter where to copy
    to. Usually this is somewhere within the frame buffer RAM.

    5. Set the solid color, if the SOLID flag is set. Since there are two pixels per
    byte, this value represents the colors of two side-by-side pixels, making it easy
    to draw vertical patterns.

    . Set the appropriate flags, which also starts the blitter. There are eight flags:

    * SRCSCREEN: Set if the source is the video frame buffer. This should not be set
    when copying sprites from ROM — the blitter will then read bytes in row-major
    order (i.e., bytes are laid out row-by-row).

    * DSTSCREEN: If the destination is the video frame buffer. This should generally
    be set when copying from the screen, otherwise the blitter will write pixels sequentially,
    which, because of the video buffer layout, will smear pixels down the screen (might
    be useful for special effects!).

    * ESY: Also known as the SLOW flag. This must be set when making a RAM-to-RAM
    transfer, otherwise the video signal generator and the blitter chip will step
    on each other (technically known as “bus contention”) and corrupt the data.


    178'
