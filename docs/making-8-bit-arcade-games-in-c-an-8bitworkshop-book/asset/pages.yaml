  md: '# 21.4. Z80 Memory Map


    # RTSL


    Returns from a subroutine.


    This pops a value off the AVG''s stack (placed there previously by JSRL) and sets
    the PC to that value, continuing where it left off.


    # JMPL


    Jumps to an address.


    Just like JSRL except it doesn''t push anything onto the stack.


    # 21.4 Z80 Memory Map


    The original Atari vector games used a 6502 CPU and had varied memory maps for
    different games.


    > For purposes of C programming on the emulator, we''re going to create our own
    hypothetical Z80 architecture. We''ll have to tweak the memory map a bit from
    the original 6502 hardware.


    > We''re also going to substitute the AVG''s ROM with RAM to make programming
    easier, for a total of 16KB of addressable AVG RAM.


    | Start | End | Description | R/W |

    | $0000 | $7FFF | Program ROM | read |

    | $8000 | $8003 | button inputs | read |

    | $8000 | $800F | POKEY 1 | write |

    | $8010 | $801F | POKEY 2 | write |

    | $8100 | $810F | Mult Box | r/w |

    | $8840 | | AVG run until halt | write |

    | $8880 | | AVG reset | write |

    | $A000 | $DFFF | AVG ROM | read |

    | $E000 | $FFFF | General-purpose RAM | r/w |


    Table 21.2: Emulated Z80 Memory Map (vector-z80color)'
