  md: "# Miscellaneous C Topics\n\nThere are a couple of advanced C topics we haven’t\
    \ covered yet, so we’ll talk about them here.\n\n# 25.1 Unions\n\nIn the upcoming\
    \ chapters, you may see the following inside of a type definition:\n\n```\nunion\
    \ {\n    struct { sbyte dx,dy; } laser; // laser direction\n    struct { byte\
    \ exploding; } enemy; // enemy exploding\n}\n```\n\nThis is called a union type,\
    \ and it’s similar to a struct except of its fields being contiguous in memory,\
    \ all of its fields overlap in memory. This conserves space for fields that don’t\
    \ coexist.\n\nIn the above example, lasers have a direction, and enemies explode,\
    \ but we don’t have objects that need both attributes at the same time. So we\
    \ define a struct for each object type and put them both in a union.\n\nThere\
    \ is no check to see if you are using the union properly, you could, for example,\
    \ write to the laser struct and read from the enemy struct. But you probably shouldn’t."
