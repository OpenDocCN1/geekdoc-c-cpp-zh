  md: "function to render all 4 digits to a given X/Y position on the nscreen, by\
    \ shifting and masking each successive digit:\n\n```\nvoid draw_bcd_word(byte\
    \ x, byte y, word bcd) {\n    byte j;\n    x += 3;\n    for (j=0; j<4; j++) {\n\
    \        putchar(x, y, CHAR('0'+(bcd & 0xf)));\n        x--;\n        bcd >>=\
    \ 4;\n    }\n}\n```\n\nWe can write a BCD addition routine in straight C, but\
    \ a more efficient way would be to use the Z80's DAA instruction – it takes the\
    \ result of any standard binary addition and converts it into a BCD result. The\
    \ final function looks like this:\n\n```\nword bcd_add(word a, word b) {\n   \
    \ a; b; // to avoid \"unused variable\" warning\nasm\n    ld  hl,#4\n    add hl,sp\n\
    \    ld  iy,#2\n    add iy,sp\n    ld  a,1 (iy)    ; load a (lo)\n    add a,(hl)\
    \      ; add b (lo)\n    daa             ; convert to BCD\n    ld  c,a\n    ld\
    \  a,1 (iy)    ; load a (hi)\n    inc hl\n    adc a,(hl)      ; add b (hi) + carry\n\
    \    daa\n    ld  b,a\n    ld  l,c\n    ld  h,b          ; result in HL reg\n\
    endasm\n}\n```\n\n(How this code was written: Write the C code for a simple 16-bit\
    \ addition function, take the assembled output, and add a DAA instruction after\
    \ the two ADD and ADC instructions. I love it when a plan comes together!)"
