    various combinations of materials, and the velocity will vary depending on factors
    such as whether the material is rigid. To give a sense of the range, something
    very smooth, such as Teflon moving over Teflon, will have a $\mu$ less than 0.05.
    Wood on wood will have a $\mu$ value between 0.25 and 0.5. Steel on steel will
    have a $\mu$ value between 0.5 and 0.8, and some combinations of metals, like
    silver on silver, will have various values greater than 1.0 [The Engineering Toolbox,
