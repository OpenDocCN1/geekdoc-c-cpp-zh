    # C.1 THE NEED FOR GEOMETRIC TRANSFORMATIONS


    ONE COULD IMAGINE A COMPUTER GRAPHICS SYSTEM that requires the user to construct
    everything directly into a single scene. But, one can also immediately see that
    this would be an extremely limiting approach. In the real world, things come from
    various places and are arranged together to create a scene. Further, we may wish
    to define one relative to another—for example, many of these things are themselves
    collections of smaller parts that are assembled together. We may want to place
    a hand at the end of an arm. Also, it is often the case that parts of an object
    are similar, like the tires on a car, and even things that are built on scene,
    like a house for example, are designed elsewhere, at a scale that is usually many
    times smaller than the house as it is built. Even more to the point, we will want
    to animate the objects in a scene, requiring the ability to move them around relative
    to each other. For animation we will want to move not only the objects but also
    the camera, as we render a sequence of images as time advances to create an illusion
    of motion. We need good mechanisms within a computer graphics system to provide
    the flexibility implied by all of the issues raised above.


    The figure below shows an example of what we mean. On the left, a cylinder has
    been built in a convenient place, and to a convenient size. Because of the


