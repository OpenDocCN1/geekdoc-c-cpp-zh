    its radius rs. Let the position of particle i be xi, and its velocity vi. Since
    we want the particle to pass by the sphere without contacting it, we also define
    the distance rp to be a “safe” distance from the collision sphere, and imagine
    that the particle is protected within a sphere of this radius. The resulting path
    is identical to steering the particle so it grazes a sphere of radius R = rs +
    rp.


