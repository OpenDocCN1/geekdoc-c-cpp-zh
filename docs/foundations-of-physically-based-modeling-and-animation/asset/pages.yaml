  md: '# 4.5 PARTICLE RENDERING


    The fact that particles have no geometry, except a spatial position, means that
    approaches to rendering a particle system are limited only by your imagination
    and the available computing time. If your particle system is part of an interactive
    experience, like a video game, then time resources will be in the millisecond
    per frame, but if it is to be used as part of a visual effect for a motion picture,
    then the time resources might be measured in hours per frame.


    We want to start by saying the first idea that probably comes to mind is to represent
    each particle by a sphere, and use our favorite renderer to create an image. Figure
    4.3 shows a particle system rendered in this way. Although this can look all right,
    there are several reasons why this approach should usually be avoided. First,
    to make a sphere of reasonable resolution requires nearly 96 triangles." Thus,
    for every particle we will have to render nearly 100 triangles. Since most particles
    render to a very small screen area, we will be making a number of calculations
    far in excess of what is necessary for a good quality image. Second, for a typical
    particle system, we are making unnecessary calculations for every one of hundreds
    of thousands of particles, and will pay an enormous performance price, even with
    a powerful graphics card. And third, a display of thousands of tiny spheres is
    going to look pretty boring. We can do much better, at much less computational
    cost.


