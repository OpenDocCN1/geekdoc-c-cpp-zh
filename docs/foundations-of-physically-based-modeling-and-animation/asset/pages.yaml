    # 10.2 COLLISION DETECTION


    In a highly dynamic scene, there can be many different objects moving around,
    each with complex geometry. It is reasonable to have dozens, hundreds, or thousands
    of objects simultaneously in motion and colliding with each other, as in Figure
    10.3. It is also common that each of the objects may have complex geometry, making
    the problem even more difficult than handling the simple cubes in the figure.
    To determine whether there are any collisions occurring, performing an $O(N^2)$
    pairwise comparison between pairs of $N$ different geometric elements becomes
    slow as the number of objects becomes large. As a result, a variety of techniques
    have been developed to improve the performance of collision detection.


    ![](img/b434947f68660f7e26f8700ff77023a5_230_0.png)


    FIGURE 10.3 A large collection of falling, colliding blocks. (Courtesy of Jay
    Steele).'
