    PID controller are computed just as for a PD controller. To compute the integral
    term, that we need is to be compute e at each timestep. The integral of the error
    is simply sum of the values for e, scaled by the timestep. We can maintain a variable
    E to hold this. In the simplest implementation, using Euler integration, as we
    advance n from timestep n-1,


    ```

    E[n] = E[n-1] + e[n]h.

    ```


    A clear way to do integration is to include E in the state vector, and in the
    system dynamics function E = e(x). Then, the integral of the error will be automatically
    calculated by whatever integration scheme is used.


    Another implementation with PID controllers is that if the system is out of constraint,
    the integrator will rapidly accumulate a very high value, which can take a long
    time to dissipate as the system comes into constraint. A standard way of overcoming
    this problem with the integral term is to establish a maximum limit on the integrator''s
    magnitude. If the magnitude of the integrator''s output exceeds this value, the
    integrator output is clamped so that it cannot exceed this limit.


    The figure shows a path obtained with a PID controller. Initially, the motion
    is nearly identical to that with the PD controller, as the bead loops come very
    close to the constraint path, and in the final rest configuration exactly meets
    the constraint. This is because the integral term will exert a force that increases
    as long as the constraint is not met, it is able to provide a force that will
    eventually exactly compensate for the force due to gravity.


