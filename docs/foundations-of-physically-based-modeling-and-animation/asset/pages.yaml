  md: '# 4.5.1 Points and Streaks


    By the simplest approach to rendering a particle system is to render each particle
    directly into the image as this approach assumes that you are to compute the projection
    of each particle onto the virtual camera''s image plane. In a raytracing environment
    you can do this by constructing a ray from the camera viewpoint to the particle
    and noting where the ray crosses the image plane. In a 3D graphics API, like OpenGL
    or Direct3D, you can use the API''s for drawing a single point based on its 3D
    position. Since a particle has no surface and no surface normal, it is not straightforward
    to render the particle using the scene''s lighting, Instead, normally normally
    is to bypass the scene''s lighting, and to specify the rendered color of the particle
    directly. This approach is natural for self-illuminating particles, representing
    things like sparks, but can work well in any if careful attention is paid to coordinating
    particle color with the lit colors in the scene. If use of the scene''s lighting
    is required, then some way will have to be devised to create a direction vector
    to be a stand-in for the surface normal for each particle.


    One problem with rendering particles as points is that there are no inherent size.
    Particles near the camera and particles far away will render at the same size,
    losing perceptual depth due to foreshortening. One approach to dealing with this
    problem is to composite particles into the image based on an opacity that is a
    distance from the scene. If this is done, nearby particles will be rendered at
    full brightness and with high contrast to the background, while particles that
    are far away will have their colors shifted towards the background color, reducing
    their brightness and contrast. The overall effect will be that of atmospheric
    perspective, giving the illusion of distance even though the particle sizes remain
    the same. The illusion of distance can be further enhanced by splat particles
    into the image, with a splat radius that is a function of distance from the camera.
    A splat is made by rendering the point into the image as a circle, with a given
    radius, with the opacity of pixels in the circle decreasing with distance from
    the center [Zwicker et al., 2001]. Figure 4.4 takes advantage of splats to display
    a particle system representing a star field, whose stars range from near to far
    from the camera.


    Another problem with rendering particles is that moving particles will appear
    to make discrete jumps across the screen at each frame change, disturbing the
    illusion of smooth animation. The usual way of overcoming this problem in animation
    is the use of motion blur. Motion blur is expensive to compute in a raytracing
    renderer, and is complex to compute in a 3D graphics API. Frequently, in rendering
    particles, the illusion of motion blur is easy to achieve. Instead of rendering
    a particle directly into the image as a, it can be rendered as a line or streak.
    The simplest approach to doing this is to have each particle save its position
    at the previous timestep, and then draw a line from this previous position to
    the particle''s current position. This can be improved by determining'
