  md: '# Barycentric Coordinates


    FOR MANY CALCULATIONS OVER TRIANGLES AND TETRAHEDRA, a metric representation called
    barycentric coordinates is very convenient. Barycentric coordinates provide a
    measuring system that positions a point relative to the vertices of the triangle
    or tetrahedron, with a very simple scheme for converting regular 3D spatial coordinates
    to barycentric coordinates, and from barycentric to 3D spatial coordinates. This
    provides a convenient way of detecting whether or not a point is inside or outside
    of a triangle or tetrahedron. They also provide a set of weights that can be used
    to interpolate 3D position or other values, for example color, stored at a triangle
    or tetrahedron''s vertices.


    # F.1 TRIANGULAR BARYCENTRIC COORDINATES


    Considering the diagram to the right, the point **x** is internal to the triangle
    **p₀**, **p₁**, **p₂**, whose area is $A = A_u + A_v + A_w$. The barycentric coordinates
    of **x** are named $u$, $v$, $w$ and are defined as follows:


    ```

    $u = A_u/A

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_383_0.png)


    For example:


    +   * If **x = p₀**, $u = 1, v = 0, w = 0$;

    * If **x = p₁**, $u = 0, v = 1, w = 0$;

    * If **x = p₂**, $u = 0, v = 0, w = 1$;

    * If **x** is on the **p₁**, **p₂** edge, $u = 0$;

    * If **x** is on the **p₀**, **p₁** edge, $w = 0$.'
  merge: -1
  pgno: 383
- img_proc: true
  md: "# Foundations of Physically Based Modeling and Animation\n\nThe areas can be\
    \ found by the trigonometric relation:\n\n$A = 1/2ab\\sin\\theta$\n\nwhere $a$\
    \ and $b$ are two sides of a triangle and $\theta$ is the angle between them.\
    \ Note that $\\sin\\theta = h/b$, so $h = b\\sin\\theta$. Therefore, $A = 1/2ah=1/2ab\\\
    sin\\theta$. We know that the magnitude of the cross product $|\\mathbf{a} \\\
    times \\mathbf{b}|| = |\\mathbf{a}|||\\mathbf{b}||\\sin\\theta$, so we can use\
    \ the cross-product to determine areas.\n\nWe can even do better if we note that\n\
    \n$\\frac{\\|\\mathbf{a} \\times \\mathbf{b}\\|}{\\|\\mathbf{a}\\|\\mathbf{b}\\\
    |} = \\hat{\\mathbf{n}}\\|$\n\nwhere $\\hat{\\mathbf{n}}$ is the normal to the\
    \ plane defined by $\\mathbf{a}$, and $\\mathbf{b}$ a common vertex.\n\nNow, referring\
    \ to the diagram to the right,\n\n![](img/b434947f68660f7e26f8700ff77023a5_384_0.png)\n\
    \n$$\\mathbf{e}_{01} = \\mathbf{p}_1 \\times \\mathbf{p}_0$,$\n$\\mathbf{e}_{12}\
    \ = \\mathbf{p}_2 \\times \\mathbf{p}_1$,$\n$\\mathbf{e}_{20} = \\mathbf{p}_0\
    \ \\times \\mathbf{p}_2$,$\n$\\hat{\\mathbf{n}} = (\\mathbf{e}_{01} \\times \\\
    mathbf{e}_{12})/|\\mathbf{e}_{01} \\times \\mathbf{e}_{12}|$.\n\nWe see that\n\
    \n$A = \\frac{1}{2}(\\mathbf{e}_{01} \\times \\mathbf{e}_{12}) \\cdot \\hat{\\\
    mathbf{n}}$,$\n$A_u = \\frac{1}{2}(\\mathbf{e}_{12} \\times (\\mathbf{x} - \\\
    mathbf{p}_1)) \\cdot \\hat{\\mathbf{n}}$,$\n$A_v = \\frac{1}{2}(\\mathbf{e}_{20}\
    \ \\times (\\mathbf{x} - \\mathbf{p}_2)) \\cdot \\hat{\\mathbf{n}}$.\n\nAnd finally,\n\
    \n$u = A_u/A, v = A_v/A, w = 1-u/v$.\n\nNote that computation with dot product\
    \ instead vector magnitude gives us a signed *area*. This means that if $\\mathbf{x}$\
    \ is outside of a triangle, at least one of the $u, v, w$ coordinates will be\
    \ negative, as demonstrated in the following figures:\n\n![](img/b434947f68660f7e26f8700ff77023a5_384_1.png)\n\
    \nhere $[\\mathbf{e}_{12} \\times (\\mathbf{x} - \\mathbf{p}_1)] \\cdot \\hat{\\\
    mathbf{n}} < 0$ so $u < 0$,\n\n![](img/b434947f68660f7e26f8700ff77023a5_384_2.png)\n\
    \nhere $A_u + A_w > A$, so $u+w > 1$, thus $v < 0$."
  merge: -1
  pgno: 384
- img_proc: true
  md: '# Barycentric Coordinates ■ 363


    So, given triangle $\mathbf{p}_0, \mathbf{p}_1, \mathbf{p}_2$, a compact way to
    calculate the barycentric coordinates of 3D point with respect to this triangle
    consists of the steps:


    ```

    $\mathbf{v}_n = (\mathbf{p}_1 - \mathbf{p}_0) \times (\mathbf{p}_2 - \mathbf{p}_1)$,$

    2A = ||\mathbf{v}_n||$,$

    $\mathbf{\hat{n}} = ||\mathbf{v}_n||/(2A)$,$

    $u = [(\mathbf{p}_2 - \mathbf{p}_1) \times (\mathbf{x} - \mathbf{p}_1)] \cdot
    \mathbf{\hat{n}}/(2A)$,$

    $v = [(\mathbf{p}_0 - \mathbf{p}_2) \times (\mathbf{x} - \mathbf{p}_2)] \cdot
    \mathbf{\hat{n}}/(2A)$,$

    w = 1 - u - v$.

    ```


    # F.2 USES BARYCENTRIC COORDINATES


    Given barycentric coordinates $(u, v, w)$ defined over a triangle, passing the
    test


    ```

    $u \ge 0, v \ge 0, u + v \le 1$,

    ```


    assures that given point is inside the triangle, and the failing test means that
    it is outside.

    Given barycentric coordinates and vertices $\mathbf{p}_0, \mathbf{p}_1, \mathbf{p}_2$
    for a triangle, we can convert back to 3D coordinates


    ```

    $\mathbf{x} = \mathbf{p}_2 + u(\mathbf{p}_0 - \mathbf{p}_2) + v(\mathbf{p}_1 -
    \mathbf{p}_2)$.

    ```


    Another way to see this is that $u, v,$ and $w$ weight vertices to give the position
    of $\mathbf{x}$. By rearranging the equation, we have


    ```

    $\mathbf{x} = u\mathbf{p}_0 + v\mathbf{p}_1 + (1 - u - v)\mathbf{p}_2 = u\mathbf{p}_0
    + v\mathbf{p}_1 + w\mathbf{p}_2$.

    ```


    This follows directly if we use the $u$ and $v$ coordinates as measuring distance
    from an edge to a parallel line passing through the opposite vertex as shown in
    the diagram to the right. We see that $u$ measures the fraction of the full distance
    from $\mathbf{p}_1, \mathbf{p}_2$ to a parallel line through $\mathbf{p}_0$. Defined
    this way, $u$ is a unit measure, so $u=0$ on the line containing $\mathbf{p}_0$.
    $v$ coordinate is similar, measuring distance from the edge $\mathbf{p}_0, \mathbf{p}_2$
    to $\mathbf{p}_1$, and $w$ measures distance from $\mathbf{p}_0, \mathbf{p}_1$
    to $\mathbf{p}_2$.


    ![](img/b434947f68660f7e26f8700ff77023a5_385_0.png)


    Finally, we can interpolate any quantity defined on the vertices of the triangle,
    just like we interpolate the vertex positions to get the position in space from
    the barycentric coordinates. Let us say that we have a color $c_i$ defined at
    each vertex $i$. Then, the color $c(u, v, w)$ interpolated from the vertices to
    the position indicated by the barycentric coordinates will be


    ```

    $c(u, v, w) = uc_0 + vc_1 + wc_2$.

    ```'
