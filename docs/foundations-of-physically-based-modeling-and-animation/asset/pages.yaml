  md: '# Constraints


    MOST OF THIS BOOK has been dedicated to describing the dynamics of systems that
    are fundamentally unconstrained. By that, we mean that a particle, or rigid body
    free to move in any direction, subject only to internal and external forces acting
    on it. However, there have been some exceptions. Particles cannot penetrate the
    walls of objects or fall through a floor—so they are constrained to move only
    in the region free of solid boundaries. The same is true for rigid bodies—they
    can tumble and fall freely, but cannot penetrate another solid. These are examples
    of problems that are usually solved another way if there were no constraints,
    and then the constraints are handled as special cases, such as in the collision
    detection and response modules of a particle or rigid body simulation.


    In physically based animation, however, there are many important problems that
    inherently involve constraints. At the physical level, all constraints come from
    forces being exerted on objects that prevent violates the constraint. For example,
    a train rolling on tracks is constrained to follow the tracks by forces exerted
    by the steel rails on the wheels of the train. The rails exert a force upward
    to support the weight of the train, and they exert sideways forces to keep the
    wheels aligned with the tracks when the tracks go around a curve. In this chapter,
    we will examine methods of maintaining constraints that explicitly compute the
    forces needed to maintain the constraints, and we will also look at the constraints
    as reducing the number of degrees of freedom of an object''s motion.


    An unconstrained particle problem has three translational degrees of freedom—a
    particle can move in the x, y, and z directions. An unconstrained rigid body has
    six degrees of freedom, since besides the three translational degrees of freedom,
    it has three rotational degrees of freedom, about the x, y, and z axes.


    The figure to the right shows two constrained dynamics problems that can be understood
    in terms of the number of translational degrees of freedom. The block, sliding
    along


    ![](img/b434947f68660f7e26f8700ff77023a5_251_0.png)'
  merge: -1
