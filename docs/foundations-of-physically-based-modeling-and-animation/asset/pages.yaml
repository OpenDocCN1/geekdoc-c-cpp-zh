  md: '# 10.1.1 Frictionless Collision with a Static Object


    We first assume that we have a moving object that we designate with the subscript
    $a$, colliding with a static, moving object $b$. The moving object will have position
    $x_a$, linear velocity $v_a$ and angular velocity $\omega_a$. We assume that the
    collision is at the point


    ```

    $\mathbf{p} = \mathbf{p}_a = \mathbf{x}_a + \mathbf{r}_a.$$

    ```


    Thus, $r_a$ is defined as the vector from the center of mass $x_a$ to the collision
    point $\mathbf{p}$. $p_a$ denotes the point of collision on the moving object,
    while $p_b$$ denotes the point of collision on the static object.


    While it is obvious that $\mathbf{p}_a = \mathbf{p}_b$, the velocities of the
    points are different, with $\dot{\mathbf{p}}_b = 0$ and


    ```

    $\dot{\mathbf{p}}_a = \mathbf{v}_a + \omega_a \times \mathbf{r}_a.$$

    ```


    Just as in our collisions with springy meshes, we will assume that we have a normal
    $\hat{\mathbf{n}}$. For a vertex-face collision, $\hat{\mathbf{n}}$ is the face
    normal, for an edge-edge collision, $\hat{\mathbf{n}}$ is formed from the cross
    product of the two edge vectors.


    We will decompose the relative velocity along this collision normal, obtaining
    both a normal component to the velocity and a tangential component. The velocity
    in the normal direction prior to collision will be


    ```

    $v^- = \dot{\mathbf{p}}_a \cdot \hat{\mathbf{n}}.$

    ```


    The superscript $-$ indicates that this is the velocity at the time of collision
    but just before the collision response. A superscript $+$$ will indicate a value
    immediately after collision response. Assuming the moving object is on the positive
    side of the normal $\hat{\mathbf{n}}$, we must have $v^- < 0$ for there to be
    a collision response, since otherwise the objects are moving apart.


    We will consider here only collision response in the normal direction, ignoring
    the frictional component in the tangential direction.


    If we assume an elastic collision, similar to the one defined in Section 3.2.1,
    we should have a velocity in the


