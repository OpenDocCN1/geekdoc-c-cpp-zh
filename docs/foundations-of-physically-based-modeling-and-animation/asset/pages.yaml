    # Computing $\Phi$ values to determine pressure:


    Computing the Laplacian in each cell also parallels the approach used in the smoke
    simulation. In the central cell 4, central differencing would yield a Laplacian
    value


    $\nabla^2\Phi_4 = \frac{1}{\Delta x^2}(\Phi_1 + \Phi_3 - 4\Phi_4 + \Phi_5)$.


    Since boundary cells have identical pressure to an adjacent full cell, cell 3,
    adjacent to the boundary, would yield


    $\nabla^2\Phi_3 = \frac{1}{\Delta x^2}(\Phi_0 - 3\Phi_3 + \Phi_4 + \Phi_6)$.


    Similarly, cell 0, in the bottom left cell would yield


    $\nabla^2\Phi_2 = \frac{1}{\Delta x^2}(-2\Phi_0 + \Phi_1 + \Phi_3)$.


    A similar analysis can be done for the remaining cells.


    **Matrix representation of Poisson equation:** After numerically representing
    the divergence and Laplacian operations for each cell, Equation 15.9 can be expanded
    to its final computational form:


    $$\begin{array}{cccccc|cc} -2 & 1 & 0 & 1 & 0 & 0 & \Phi_0 & u_1 + v_3 \ 1 & -3
    & 1 & 0 & 0 & 0 & \Phi_1 & u_2 - u_1 + v_4 \ 0 & 1 & -2 & 0 & 1 & 0 & \Phi_2 &
    -u_2 + v_5 \ 1 & 0 & 1 & -3 & 0 & 1 & \Phi_3 & u_4 + v_6 - v_3 \ 0 & 0 & 1 & -4
    & 1 & 1 & \Phi_4 & u_5 - u_4 + v_7 \ 0 & 0 & 0 & 1 & -3 & 1 & \Phi_5 & -u_5 +
    v_8 - v_5 \ 0 & 0 & 0 & 0 & 0 & 1 & \ \Phi_6 & \frac{h}{\Delta x}p_a \end{array}$


    **Matrix representation for implicit integration of diffusion term:** The implicit
    integration of $w_2$ to determine $w_3$ using Equation 15.2 also follows a procedure
    similar to the smoke simulation. For each velocity component boundary independently.
    Because there cannot be any flow into a boundary, we know that $u_{30} = u_{33}
    = u_{36} = 0$, and $v_{30} = v_{33} = v_{36} = 0$.


    Because of friction, the rate of flow parallel to the boundary will be affected
    by the presence of the boundary. A typical way of accounting for this is to set
    *phantom* flow values to the boundary within each boundary cell, by interpolating
    the flow at the boundary. Consider the cell with index 1. Its horizontal velocity
    is $u_1$, and we can imagine a velocity $u''_1$ in the boundary cell below it.
    When horizontal velocity is interpolated exactly at the boundary, it will be $u_{1b}
    = \frac{u_1+u''_1}{2}$, if $u''_1 = u_1$, the horizontal velocity at the boundary
    will exactly match the velocity in cell 1.


