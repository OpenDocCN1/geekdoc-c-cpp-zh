  md: '![](img/b434947f68660f7e26f8700ff77023a5_339_0.png)


    FIGURE 15.4 Water sloshing around a box. (Courtesy of Ruoguan Huang.)


    from a set of particles results in a bumpy, overly noisy look. An improved, hybrid
    approach is described in the paper *Practical Animation of Liquids* by Foster
    and Fedkiw [2001]. Besides advecting a set of particles, they maintain a *signed
    distance field* $s(x)$ that is advected with the fluid. This is a scalar field
    that returns the shortest distance to the fluid surface at spatial position **x**.
    This distance is signed, with positive values being outside the fluid and negative
    values inside the fluid. In an algorithm, the signed distance field is stored
    in a spatial grid of higher resolution than the grid used for fluid simulation.
    At each timestep, the same time that the marker particles are advected by the
    fluid, the signed distance $s$ is updated via the update equation:


    ```

    $$\frac{\partial s}{\partial t}= -u \cdot \nabla s.$

    ```


    This approach of updating the surface by advecting the distance field is an *level
    set method*.


    A renderer can use a ray-marching approach to efficiently find the surface, where
    $s=0$, since at each step in the ray march, the field itself gives the minimum
    distance to the surface, and thus the distance that the ray can march ahead without
    missing the surface. When the surface is found, the normal to the surface is simply


    ```

    $$\mathbf{\hat{n}}=\nabla s/|\nabla s||.$

    ```


    While this surface could be rendered alone, it has the opposite problem from surfaces
    obtained using particles. It will suffer from being too smooth in regions of splashing
    or complex surface motion. To obtain a surface that is needed but preserves detail
    where it should, Foster and Fedkiw recommend'
