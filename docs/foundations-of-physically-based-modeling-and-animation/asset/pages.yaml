    We only have to worry about the sphere on a collision path with, and if the collision
    is scheduled to occur soon. To begin, we compute the particle''s closest predicted
    approach to the sphere''s center, assuming that the particle continues to travel
    at its current velocity. Normalizing the velocity, we create the direction vector
    $\hat{\mathbf{v}}_i = \mathbf{v}_i/\|\mathbf{v}_i\|$, and we let the vector defined
    by the sphere center and the particle''s position be


    ![](img/b434947f68660f7e26f8700ff77023a5_98_0.png)


    $\mathbf{x}_{is} = \mathbf{c}_s - \mathbf{x}_i$.


    We can treat particle position together with its velocity direction vector as
    a ray extending out from the particle along its current direction of travel. The
    distance along this ray, at the ray''s closest approach to the sphere center,
    is given by


    $s_{close} = \mathbf{x}_{is} \cdot \hat{\mathbf{v}}_i$.


    If $s_{close} < 0$ the sphere is behind the particle and we can ignore it. Also,
    if the sphere is far in front of the particle we can ignore until we get closer,
    so we compute a distance of concern


    $d_c = |\mathbf{V}_i\|t_c$.


    $t_c$ is a threshold time to collision that can be set by the animator. If $s_{close}
    > d_c$, we can ignore the sphere. If we are still concerned with the sphere, we
    compute the point of closest approach


    $\mathbf{x}_{close} = \mathbf{x}_i + s_{close}\hat{\mathbf{v}}_i$.


    The distance of this point to the sphere center is


    $d = |\mathbf{x}_{close} - \mathbf{c}_s\|$.


    If $d > R$ then the sphere comes to the sphere center is greater than the expanded
    sphere radius, so there is no predicted collision and we can ignore the sphere.
    Otherwise, we are scheduled for an imminent collision with the sphere, and we
    need to take corrective action.


    The corrective action will be to apply an acceleration that will adjust the particle''s
    path so that it curves around the sphere. In order to provide the required steering,
    we first find a spatial target to direct the particle toward. The vector from
    the sphere center to the closest point of approach is orthogonal to the velocity'
