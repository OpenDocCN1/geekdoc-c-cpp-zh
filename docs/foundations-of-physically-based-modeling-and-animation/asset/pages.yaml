    computational complexity. The first is to specify one or more spatial regions
    about each particle, ignoring the interaction effects of any particles outside
    of nearby regions. The second would be to always consider all particles, but to
    provide a way of approximating the net effect of particles, from a given particle,
    via a single calculation per cluster. Both of these strategies require the use
    of spatial data structures that provide the ability to quickly find particles
    in spatial neighborhood, and that support such operations as clustering within
    spatial regions. In this section, we look at three different approaches to organizing
    the space containing the particles: uniform spatial grids, and kd-trees. The left
    side of Figure 6.1 shows an octree data structure being used to support the colliding
    galaxy simulation shown on the right side.


    # 6.3.1 Uniform Spatial Grids


    A uniform grid is the simplest spatial data structure for organizing a set of
    particles. We have already described this data structure in Section 4.4.4, for
    speeding particle-polygon collision tests. For completeness, we will expand on
    and briefly describe the structure again, referring to the figure to the right.
    Starting with a bounding box of $W, H$, and depth $D$ around all of the particles,
    we construct a 3D grid of uniformly sized, axis-aligned voxels. If the grid has
    $L$ depth, $M$ rows and $N$ columns, the dimensions of a single voxel in the $x,
    y$, and $z$ directions are $\delta_x = W/N$, $\delta_y = H/M$, and $\delta_z =
    D/L$. Each voxel corresponds to an element of a 3D array, in which we maintain
    a list of particles remaining in that voxel, with any other information needed
    by the algorithm we are implementing. We define the location $x_0 = (x_0, y_0,
    z_0)$ to be the grid corner with


    ![](img/b434947f68660f7e26f8700ff77023a5_112_1.png)'
