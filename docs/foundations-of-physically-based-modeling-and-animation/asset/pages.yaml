  md: '# Foundations of Physically Based Modeling and Animation


    Sweep-and-prune: An alternative broad-phase approach is the Sweep-and-Prune algorithm
    [Baraff, 1992]. In this approach, each object is surrounded by an AABB*. Two objects
    pass the phase if their AABBs overlap. This means that the AABBs will overlap
    in extents along the x, y, and z axes.


    The idea of sweep-and-prune is to identify overlapping pairs along each axis quickly
    and in that overlapping pairs can be updated easily over time. We find overlapping
    pairs along one axis, then the others; pairs are reported as overlapping if they
    overlap along all three.


    To find overlapping pairs along one axis, we first sort the starting and ending
    point of the AABBs along the axis. For n objects there will be 2n points. The
    sweep operation will begin at the lowest point and to highest, maintaining a list
    of “active” AABBs. As a starting point is passed, the AABB is added to the active
    list, and an overlap is reported with every other AABB already in the list. As
    an endpoint is passed, the AABB is removed from the active list. The result is
    that all the non-overlapping pairs (along that axis) are pruned away from the
    list. For example, in the figure above, a, b, c, and d represent bounding volumes
    for four objects. Sweeping along the x axis will consecutively find the overlaps
    a-c, a-b, c-d, and b-d. Sweeping along the y axis, the overlaps will be c-d, a-d,
    a-b, leaving only a-b, c, and b-d that appear in lists. Starting from scratch,
    this whole process will take O(n log n + k) time where n is the number of objects
    and k is the number of overlapping pairs.


    ![](img/b434947f68660f7e26f8700ff77023a5_238_0.png)


    This algorithm can also exploit temporal coherence. As objects move, their position
    from one time step to the next does not change by a large amount. The new positions
    will be near the old positions, or stated in terms of the sweep-and-prune algorithm,
    the positions of the starting and ending points of the AABBs will not move much.
    Most intervals overlapping one timestep will still overlap in the next, and vica-versa.
    Each AABB interval needs to update its position, which might involve overlapping
    a new interval. On detection, this overlap is added to the list of overlapping
    pairs. Similarly, if an AABB is detected no longer overlapping one it was previously
    overlapping, it is removed from the list. In any case, “re-sorting” of the endpoints
    will involve only a small move up or down in the list of sorted endpoints, which
    can be done in nearly constant time per object. An insertion sort or bubble sort
    can be used to update the nearly sorted list from the last timestep quickly. Thus,
    the sweep-and-prune algorithm can be run in approximately O(n+k) time, the initial
    run of this algorithm.


    > *This is an AABB around a bounding sphere, so it does not need to be updated
    as orientation changes.'
