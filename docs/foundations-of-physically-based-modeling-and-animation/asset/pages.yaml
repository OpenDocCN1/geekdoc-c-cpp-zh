  md: '# Interacting Particle Systems 83


    We call the function $F_i$ particle $i$''s particle dynamics function, because
    it accounts for everything in the system acting to change the state of particle
    $i$.


    After accelerations, the next step is numerical integration. Using our notions
    of particle state, integration no longer needs to be separated from velocity and
    position updates. For example, Euler integration from timestep $n$ to timestep
    $n+1$ could be written


    ```

    $s_i^{[n+1]} = s_i^{[n]} + v_i^{[n]}h$.

    ```


    Using the particle dynamics function, Euler integration can be written


    ```

    $s_i^{[n-1]} = s_i^{[n]} + F_i(s_i, t)h$.

    ```


    This way of describing integration will provide important insights when developing
    improved numerical integration methods in Chapter 7.


    Having built a conceptual structure around the concept of state, with respect
    to a noninteracting particle system, let us see how this conceptual structure
    needs to be updated when developing an interacting particle system. The most significant
    changes will be on Equations 6.3 through 6.5. In an interacting particle system,
    the forces on an individual particle need to include the effects of all of the
    other particles. Thus, the forces and accelerations on a particle now need to
    be expressed as functions of the state of all of the particles in the system.
    If there are $m$ forces not coming from other particles, and there are $n$ particles,
    the total force on particle $i$ will have to be rewritten


    ```

    $f_i(s_0, \cdots, s_{n-1}, t) = \sum_{j=0}^{m-1} f_i^j(s_i, t) + \sum_{k=0}^{n-1}
    g_i^k(s_i, s_k, t)$.

    ```


    The terms $g_i^k$ are the new interparticle forces, giving the force on particle
    $i$ due to particle $k$''s state. Note that each of these, that the total force
    is now a function of the state of all of the particles. This results in a rather
    clumpy notation, which we can correct by making another notational and conceptual
    leap.


    Instead of an individual particle, we could construct a system state vector $(\mathbf{S})$
    that holds the state of the entire particle system:


    ```

    $S = \begin{bmatrix} s_0 \ s_1 \ \vdots \ s_{n-1} \end{bmatrix}$

    ```


    Although we could work with this description of system state, more commonly the
    position elements of the particle states are grouped together at the top of the


    > *We adopt that the system state vector is represented by a boldface capital
    letter.'
