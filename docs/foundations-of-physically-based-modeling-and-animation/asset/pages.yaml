  md: '# 240 Foundations of Physically Based Modeling and Animation


    tends to be quite sparse, so the solution to Equation 11.15 be attained with a
    solver designed to take advantage of that sparsity, with great savings in both
    time and space. The biconjugate gradient method described in Numerical Recipes
    [Press et al., 2007] is a commonly used approach. It has the advantage that it
    will arrive at a least-squared-error solution, even if the problem is overconstrained
    (i.e., maintaining all of the constraints simultaneously impossible).


    We can now complete the example that we began by providing the necessary derivatives
    and matrices. The partial derivatives that are the elements of the Jacobian matrix
    $J$


    ```

    $$\frac{\partial c_0}{\partial\mathbf{x}_0} = -(\mathbf{x}_1-\mathbf{x}_0)^T,
    \quad \frac{\partial c_0}{\partial\mathbf{x}_1} = (\mathbf{x}_1-\mathbf{x}_0)^T,
    \quad \frac{\partial c_0}{\partial\mathbf{x}_2} = \mathbf{0}^T$,$

    $\frac{\partial c_1}{\partial\mathbf{x}_0} = \mathbf{0}^T, \quad \frac{\partial
    c_1}{\partial\mathbf{x}_1} = -(\mathbf{x}_2-\mathbf{x}_1)^T, \quad \frac{\partial
    c_1}{\partial\mathbf{x}_2} = $(\mathbf{x}_2-\mathbf{x}_1)^T$

    ```


    Therefore, the Jacobian matrix is


    ```

    $J = \begin{bmatrix} $(\mathbf{x}_1-\mathbf{x}_0)^T & $(\mathbf{x}_1-\mathbf{x}_0)^T
    & \mathbf{0}^T \ \mathbf{0}^T & -(\mathbf{x}_2-\mathbf{x}_1)^T & $(\mathbf{x}_2-\mathbf{x}_1)^T
    \end{bmatrix}$

    ```


    and its first derivative is


    ```

    $$\mathbf{j} = \begin{bmatrix} $(\mathbf{x}_1-\mathbf{x}_0)^T & $(\mathbf{x}_1-\mathbf{x}_0)^T
    & \mathbf{0}^T \ \mathbf{0}^T & -(\mathbf{x}_2-\mathbf{x}_1)^T & $(\mathbf{x}_2-\mathbf{x}_1)^T
    \end{bmatrix}$

    ```


    If we let $I$ be the $3\times 3$ identity matrix, and $0$ be the $3\times 3$ zero
    matrix, then the matricized matrix is


    ```

    $M = \begin{bmatrix} m_0I & 0 & 0 \ 0 & m_1I & 0 \ 0 & 0 & m_2I \end{bmatrix}$

    ```


    and its inverse is


    ```

    $M^{-1} = \begin{bmatrix} \frac{1}{m_0}I & 0 & 0 \ 0 & \frac{1}{m_1}I & 0 \ 0
    & 0 & \frac{1}{m_2}I \end{bmatrix}$

    ```


    # 11.3 REDUCED COORDINATES


    The constrained dynamics method is one approach to achieving constraints. The
    problem is typically posed in the usual 3D Cartesian frame, and forces are computed
    that exactly counteract any tendency to violate constraints. Thus, the constrained
    dynamics simply adds another source of forces to the system. Once constraint forces
    are added, the simulation proceeds in the usual fashion, integrating accelerations
    to update velocities, and integrating velocities to update positions.'
