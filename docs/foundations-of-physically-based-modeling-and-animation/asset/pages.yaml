    ```

    $s(t+h) = \frac{1}{3}\left(s(t)+\frac{\dot{s}(t)+\dot{s}(t+h)}{2}\right)h+\frac{2}{3}(s(t)+\dot{s}(t+0.5h))h\n=
    s(t+h)=\frac{1}{6}\left(\dot{s}(t)+4\dot{s}(t+0.5h)+\dot{s}(t+h)\right)$

