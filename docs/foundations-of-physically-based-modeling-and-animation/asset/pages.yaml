    $$\mathbf{v}_n^+ = -c_r\mathbf{v}_n^- = -c_r(\mathbf{v}^- \cdot \hat{n})hat{n}.$.

    ```


    A $c_r$ of 1 represents a completely elastic collision where all the energy of
    the ball in the normal direction is returned by sending the ball at the identical
    speed in the opposite direction. A dropped ball in the absence of air resistance
