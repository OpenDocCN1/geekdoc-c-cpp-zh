    familiar with real life: dropping a ball under the force of gravity. Later, we
    will extend that example to include the effects of air resistance and wind.


    # 2.2 NEWTON''S LAWS OF MOTION


    We actually define our physically based model for this example, let us first look
    at some fundamental laws that are the foundation for physically based simulation:
    Newton''s Three Laws of Motion. Roughly stated, Newton''s laws are as follows:


    +   An object in motion will remain in motion, or an object at rest will remain
    at rest, acted upon by an outside force.


    +   The force on an object is equal to its mass times its acceleration. This is
    often written F = ma.


    +   When one object exerts a force on a second object, there is an equal and opposite
    force on the first object.


    These three laws are critical to understanding how physically based simulations
    behave in practice. We will deal with the first two of these laws in this chapter,
    and we will see the third law in action later in the book.


    The key concept embedded in the first law is that of inertia. Objects continue
    to move at a fixed rate, and in a fixed direction, unless an external force is
    applied. How difficult it is to overcome the inertia of the object is determined
    by the object''s mass and velocity. Related to inertia is momentum, which is the
    product of the object''s mass and velocity, P = mv.


    The second law gives us the exact relationship between force and the rate of change
    of momentum, which we call acceleration. We will usually define a physically based
    model by determining a set of forces. From these we define acceleration by Newton''s
    second law, written a = F/m. From acceleration and an initial state, we can determine
    velocity and position.


    Differentiation is the mathematical term defining the rate at which something
    is changing over time or space. In physically based animation, we are typically
    interested in the rate at which something is changing over time. Position x, velocity
    v, and acceleration a are related to each other through differentiation, because
    velocity is defined to be the rate of change of position, and acceleration is
    defined to be the rate of change of velocity. Expressed mathematically, velocity
    is the time rate of


    ```

    $$\frac{dx}{dt}$

    ```


    of position,

    acceleration is the time rate of change of velocity,


    ```

    $a = \frac{dv}{dt}$

    ```'
