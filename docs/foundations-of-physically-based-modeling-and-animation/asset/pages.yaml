    density is initially constant across the entire medium, and to assign uniform
    volume and mass to each particle.


    When field quantities, like pressure, are needed to compute the acceleration on
    a particular particle, they are estimated by considering all of the particles
    in the neighborhood of that particle. Thus, the entire method is dependent upon
    an initial sampling of the fluid field to generate a set of particles with their
    spatial positions and velocities, and then at every timestep to reconstruct all
    of the field quantities needed to compute accelerations.


    In order to reconstruct a field from a set of particles, SPH depends on radially
    symmetric *kernel functions*, sometimes known as *blending functions*, that are
    used to spread the effect of a particle over its surrounding space. If $x_i$ is
    the position of particle $i$, and $r = x - x_i$ is a vector from this position
    to point $x$ in space, kernel functions associated with particle $i$ will have
    the form


    $$w_i(r) = w(||r||)$


    i.e., they vary only with distance $||r||$ from their center. In order to localize
    the effect of a single particle on its neighboring particles, the kernel functions
    are usually chosen to be of *finite support*, meaning that if $r_{max}$ is the
    maximum support distance,


    $$w(r) = 0$, for all $r \ge r_{max}$.'
