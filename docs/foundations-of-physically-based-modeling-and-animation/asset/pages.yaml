  md: '# 6.5.3 Acceleration Prioritization


    In Reynolds'' original paper on flocking, he suggests that the limited ability
    of an animal to exert force could be represented by specifying a limit on the
    magnitude of the acceleration, prioritized by urgency. Of the three acceleration
    sources, collision avoidance obviously needs to receive highest priority, matching
    velocities aids in avoiding future collisions, so it should receive next priority,
    centering is of lowest urgency. One way to implement a prioritized acceleration
    limit is based on prioritized acceleration magnitudes. Each of the three accelerations
    is summed, in turn, but only up to an allowed acceleration limit. An algorithm
    for implementing this is as follows


    ```

    residual acceleration is the entire acceleration budget $a_{max}$

    $a_r = a_{max}$;ncollision avoidance gets top priority

    $a_i = \min(a_r, \|a_i\|)\hat{a}_i$;

    residual to the unused acceleration budget

    $a_r = a_{max} - \|a_i\|$;nvelocity matching gets next priority

    $a_i = a_i + \min(a_r, \|a_i\|)\hat{a}_i$;

    residual to the unused acceleration budget

    $a_r = a_{max} - \|a_i\|$;

    centering gets lowest priority

    $a_i = a_i + \min(a_r, \|a_i\|)\hat{a}_i$;

    ```


    # 6.5.4 Steering around Obstacles


    In Section 5.3.2 we outlined an algorithm for steering particles around environmental
    obstacles. This algorithm can be directly applied to the acceleration calculations
    for the boids in a flocking system, inserting the calculated steering acceleration
    into the acceleration prioritization algorithm. It should probably be given top
    priority, since it is more important for a boid to avoid flying into a wall to
    avoid bumping into its neighbor.


    # 6.5.5 Turning and Banking


    If a flocking algorithm is going to be used to choreograph birds or other flying
    creatures, it will be important to capture not only the position and velocity
    of each boid also the rotation for banking during turns. Consider an airplane.
    Were an airplane to attempt a turn without banking, there would be no significant
    force to counteract the centrifugal force induced by the turn, causing the plane
    to skid sideways. Because of this, the pilot banks the plane into a turn enough
    so that the radial component of the lift of the wings produces a centripetal force
    to balance the centrifugal force. Birds and all flying creatures utilize this'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Interacting Particle Systems ■ 109


    same mechanism. Therefore, for an animation to look realistic, the model being
    used to represent a boid must not only be oriented in the direction of the velocity
    vector, but also banked appropriately during each turn. To do this efficiently,
    we need an appropriate coordinate frame for the boid, and a mechanism for computing
    the banking angle.


    If the boid''s acceleration a is not exactly aligned with its velocity v the boid
    will not only change speed, but will also change its direction of flight. This
    change in direction will manifest itself in a rotation of the boid''s velocity
    vector about an axis perpendicular to both the velocity and the acceleration directions.
    Let us define an orientation coordinate frame using this fact. First, let the
    x direction be parallel to the current velocity, and let the y direction the turning
    axis, which is parallel to the cross-product of the velocity and acceleration.
    Finally, the z direction will be perpendicular to both the x and y directions.
    Summarizing, the three unit vectors forming the boid''s coordinate frame


    ![](img/b434947f68660f7e26f8700ff77023a5_131_0.png)


    ```

    $\mathbf{\hat{u}}_x = \mathbf{\hat{v}},$

    $\mathbf{\hat{u}}_y = \frac{\mathbf{v} \times \mathbf{a}}{\|\mathbf{v} \times
    \mathbf{a}\|},$

    $\mathbf{\hat{u}}_z = \mathbf{\hat{u}}_x \times \mathbf{\hat{u}}_y$.

    ```


    As described in Appendix D, the rotation matrix to align the boid with this coordinate
    frame is


    ```

    $R = [\mathbf{\hat{u}}_x \mathbfmathbf{\hat{u}}_y \mathbfmathbf{\hat{u}}_z].$

    ```


    The total acceleration a on a boid can be thought of having two components: a
    component a_n parallel to the boid''s current velocity vector, which simply changes
    the boid''s speed, and a component a_T orthogonal to the boid''s velocity, which
    induces turning. These vectors are given by


    ```

    $\mathbf{a}_n = (\mathbf{a} \cdot \mathbf{\hat{u}}_x)\mathbf{\hat{u}}_x,$$

    $\mathbf{a}_T = \mathbf{a} - \mathbf{a}_n$.

    ```


    We use an airplane analogy to determine how the banking angle should be computed.
    Assume that the airplane is in level flight, and begins to initiate a turn. In
    order to produce the turning acceleration a_T, the airplane must be able to produce
    a force orthogonal to its direction of flight. Banking the airplane, by lowering
    the wing on the inside of the turn, will achieve this


    ![](img/b434947f68660f7e26f8700ff77023a5_131_1.png)'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# 110 Foundations of Physically Based Modeling and Animation


    because the lift force produced by the wings will have a component in the direction
    of the turn. Let the total force of the wings be L, and the airplane banking angle
    be $\phi$. Since the airplane is in flight, its $x$ and $z$ axes will be parallel
    to the ground. Therefore, to maintain a constant altitude, the component of the
    lift opposing the gravitational force g must be $-mg\cdot\hat{u}$, while the component
    of the lift producing the turn acceleration is $L\cdot\hat{u}_t = ma_T\cdot\hat{u}_z$.
    We can take the ratio of these two expressions to obtain


    ```

    $$\phi = \frac{a_T\cdot\hat{u}_z}{g\cdot\hat{u}_y}$$

    ```


    or


    ```

    $$\phi = -tan^{-1}\frac{a_T\cdot\hat{u}_z}{g\cdot\hat{u}_y}$$

    ```


    The flocking algorithm ignores gravity, and boids can be oriented in any direction,
    making the level flight assumption a poor one. Nevertheless, this result can be
    generalized to handle nonempty flight by noting that the term $g\cdot\hat{u}_y$
    in the above expression will always be negative, and by replacing the denominator
    by a constant multiplier $k_{\phi}$, which can be tuned by the animator to obtain
    the desired banking effect. Making these substitutions, the banking angle will
    be given by


    ```

    $$\phi = tan^{-1}k_{\phi}a_T\cdot\hat{u}_z$

    ```


    A final note here is the resulting banking angle will change instantaneously with
    changes in the turning acceleration. If the turning acceleration changes, the
    boid''s banking behavior can appear to be erratic. Therefore, it may be useful
    to smooth the angle $\phi$ by maintaining a running average $\phi_{avg}^{[n]}$,
    updated at each timestep as follows:


    ```

    $$\phi_{avg}^{[n]} = (1-\alpha)\phi_{avg}^{[n-1]} + \alpha\phi$

    ```


    Here, $0 < \alpha \le 1$ is a smoothing constant determining what fraction of
    the new angle $\phi$ is added to the running average, and can be tuned by the
    animator to achieve the desired smoothness of banking action.


    Now, to rotate the boid into a banking turn, we need only first rotate the boid
    by $\phi^{[n]}$ about its own $x$ axis, before transforming the boid into world
    space via the metric R.


    # 6.6 SUMMARY


    Here are some of the main points to take away from this chapter:


    +   * The complexity of calculations involving interacting particles can grow
    far more quickly than when the particles are independent of each other. Thus,
    interacting particle systems need to be significantly smaller in scope than other
    particle systems.'
