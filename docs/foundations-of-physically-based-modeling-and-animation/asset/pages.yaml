  md: '# Foundations of Physically Based Modeling and Animation


    Triangles are especially handy for doing point-polygon collision tests, we can
    compute the barycentric coordinates (u, v, w) of any point in the plane of a triangle
    using the algorithm described in Appendix F. Given a triangle, and the position
    xhit in the plane of the triangle, we can use the barycentric coordinates u, v
    of xhit to make the simple inside-outside test


    ```

    $u \ge 0, \quad v \ge 0, \quad u + v \le 1$

    ```


    If all three of these conditions hold, then xhit is the triangle, otherwise it
    is outside.


    # 3.7 SUMMARY


    Here is a brief review of the main concepts to take away from this chapter:


    +   - The process of handling collisions in a physically based system involves
    collision detection (Does a collision occur?), determination (When and where does
    it occur?), and response (How is reality updated to account for the collision?)


    +   - The simulation loop must be modified to account for collisions. The loop
    still iterates in discrete timesteps, but each timestep may be interrupted by
    a collision, and then continued. This can happen repeatedly, so the collision
    logic must account for the possibility that multiple collisions might occur during
    one timestep.


    +   - The simplest collision detection task is checking for the collision of a
    moving point with an infinite plane, which requires checking which side of the
    plane is on the beginning and end of a timestep.


    +   - Collision determination between a moving point and an infinite plane is
    done by solving the implicit equation representing the plane, while representing
    the path of the moving point using time as a parameter.


    +   - Collision response considers both restitution and friction between the colliding
    object and the plane. Restitution affects what fraction of the normal component
    of velocity is reflected, and friction affects how much the tangential component
    of velocity is reduced.


    +   - The surfaces of geometric models are typically represented by finite polygons,
    and not infinite planes, so handling collisions with polygons is an important
    task.


    +   - Collision handling of a moving point with a polygon, rather than an infinite
    plane, requires first performing detection and determination on the infinite plane
    that the polygon lies in, and then testing whether or not any potential collision
    point is actually inside the polygon.'
