    # A.8 CROSS-PRODUCT


    The cross-product a × b between two vectors a and b is a new vector perpendicular
    to the plane defined by the original vectors. In other words, the cross product
    of two vectors is a vector that is perpendicular to both of the original vectors.
    The figure to the right illustrates the construction.


    This notion of cross-product does not make sense in 2D space, as it is not possible
    for a third 2D vector to be perpendicular to two (nonparallel) 2D vectors. Thus,
    the notion of cross-product is reserved for working in 3D space.


    ![](img/b434947f68660f7e26f8700ff77023a5_351_1.png)


    Since there are two directions perpendicular to the plane formed by two vectors,
    we must have a convention to determine which of these directions to use. In graphics,
    it is most common to use the right-hand rule, and we use this convention throughout
    this text. The right-hand hand rule works as follows. Hold your right hand flat,
    with the thumb out, aligning the fingers so they point in the direction of a.


    ![](img/b434947f68660f7e26f8700ff77023a5_351_2.png)'
