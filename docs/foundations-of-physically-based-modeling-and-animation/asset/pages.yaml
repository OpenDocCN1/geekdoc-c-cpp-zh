    # 3.1.2 Collision Determination


    If we have detected a collision occurs during a timestep, the next phase is to
    determine exactly when within the timestep and where in space collision occurred.
    If we are using Euler integration in our simulation, we can do this by examining
    the position of the object before and after timestep and linearly interpolating
    between those positions to find the collision.


    Recall that our calculation above gives us $d$, the distance from the surface.
    Let $d^{[n]}$ be the distance at the beginning of the timestep, and $d^{[n+1]}$
    be the distance at the end. If we assume a constant velocity during the timestep
    (which is true for Euler integration), then time is directly proportional to the
    distance traveled, and


    ![](img/b434947f68660f7e26f8700ff77023a5_46_0.png)


