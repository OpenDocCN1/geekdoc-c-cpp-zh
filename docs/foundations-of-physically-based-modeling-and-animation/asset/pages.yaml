  md: '# 10.4 SUMMARY


    Here are some key points to understand rigid body collisions and contacts:


    +   - Collisions of rigid bodies involve collision detection, determination, and
    response. We can model a collision response as an impulse.


    +   - Impulses introduce both linear motion (instantaneous force) applied to the
    center of mass, and angular motion (instantaneous torque) applied to the point
    of collision. The result of the impulse will change the velocity of the point
    of collision on the object.


    +   - The collision detection process is often the slowest part of the collision
    process, and different techniques can be used to speed it up. These are usually
    divided into a broad phase, where possible collisions between objects are identified,
    and a narrow phase, where specific collisions between polygons of the objects
    are identified.


    +   - Broad phase collision detection is usually accelerated by either a spatial
    subdivision approach (only objects in the same spatial region can collide) or
    the sweep-and-prune algorithm (identifying objects with overlapping boxes).


    +   - Narrow phase collision detection is usually accelerated through the use
    of bounding volume hierarchies, progressively giving a tighter and tighter fit
    of volumes around an object.


    +   - Several different bounding volumes can be used, with differing trade-offs
    in tightness of fit and speed of various computations.


    +   - Linear complementarity can be used to express the relationships between
    multiple bodies in contact at the same time, including objects at rest. Multiple
    bodies colliding and in contact can be solved for simultaneously by a linear complementarity
    system.


    +   - Linear complementarity can be used to model friction and sliding contacts
    in addition to collision responses and resting contacts.'
