    that a rotation matrix describes how we move from one coordinate frame to another.
    Now, we will take the point of view that we are using them to describe how the
    object being simulated is transformed from its original (or “base”) orientation
    to its current orientation.


    We assume that each object is described originally with its base orientation,
    and with its center of mass at the origin. This will be called the *body coordinate
    system*, since it is a coordinate system describing the rigid body by itself,
    ignoring all the rest of the world.


    The rigid body, and the other objects we are simulating, will exist within the
    world *coordinate system*. To specify how the rigid body is placed in the world,
    we specify its position $x$ and its orientation $R$, which defines a way of transforming
    between local and world coordinates. So, a point $p_0$ in local coordinates will
    correspond to a point


    ```

    $p = x + Rp_0$$

    ```


    in world coordinates. We want to see how this point in world coordinates will
    change over time, so we take its derivative with respect to time. The time derivative
    of Equation 9.1, denoted by $\dot{p}$ notation, is


    ```

    $$\dot{p} = \dot{x} + \dot{R}p_0 + R\dot{p}_0$$

    ```


    > *It is possible to work with an object whose center of mass in its local coordinate
    frame is not at the origin, but this complicates the mathematics significantly.'
