  md: '# 66 Foundations of Physically Based Modeling and Animation


    ![](img/b434947f68660f7e26f8700ff77023a5_88_0.png)


    obtained from numerical integration. These operators will typically take the velocity
    and after integration as parameters and return an updated velocity. An example
    of this type of operator is the velocity update after collision as described in
    Section 4.4.3. We will call these operators $\mathbf{A}^{op}()$, to indicate that
    they are functions. In the simulation, the effects of all active additive acceleration
    operators $\mathbf{a}_i^{op}$ on a particle $i$ are summed, and the net acceleration
    is applied in the integration step to update particle $i$''s velocity. Then, any
    functional acceleration operators are applied consecutively to the resulting velocity
    to yield a final modified velocity:


    ```

    $$\mathbf{a}_i^{net} = \sum_{k} \mathbf{a}_{ki}^{+op}$

    $$\$\mathbf{v}_{new} = \mathbf{v}_i^{[n]} + \mathbf{a}_{ki}^{+op}$

    $$\$\mathbf{v}_{new} = \mathbf{A}_1^{op}(\mathbf{v}_{new}, [n]), \mathbf{v}_{new}
    = \mathbf{A}_2^{op}(\mathbf{v}_{new}, [n]), \dots$$

    $$\$\mathbf{v}_i^{[n+1]} = \mathbf{v}_{new}$

    ```


    Below, we introduce several examples of acceleration operators. Readers are encouraged
    to be inventive, taking these examples as a starting point for their own designs.


    # 5.1.1 Gravitational Attractors


    We have already seen one type of gravitational attractor. That is the attraction
    of a very large small object over a very constrained range of separations of the
    two objects, like the gravitational acceleration of the earth on a ball. In this
    case, we have the simplest form of additive acceleration operator, a constant
    vector,


    ```

    $$\mathbf{a}^{+op} = \mathbf{g}$.

    ```'
