    \ Transforms\n\nTransformations between coordinate frames can be expressed in\
    \ the form of spatial matrices. Consider the rigid body in the right figure. It\
    \ contains two coordinate frames, $F$ and $G$ that are simply translates of each\
    \ other. Let $r$ be the vector from the origin of frame $F$ to frame $G$, expressed\
    \ in frame $G$. And, let $\\omega$ be the angular velocity of the body, which\
    \ will be identical in both frames. Now, if $v_F$ is a velocity expressed in frame\
    \ $F$, and $v_G$ is the same velocity expressed in frame $G$, it is clear that\n\
    \n```\n$v_G = v_F + \\omega \times r$$\n```\n\nLet us define $I$ to be the $3\
    \ \times 3$ identity matrix, $\\omega$ to be a $3 \times 3$ matrix of $0$'s, and\
    \ $r^*$ to be the $3 \times 3$ matrix equivalent of $r$ (as defined in Section\
    \ 9.1). Then the full spatial transformation of velocity between frames $F$ and\
    \ $G$ can be written\n\n```\n$$\\tilde{v}_G = \begin{bmatrix} \\omega \\ v_G \\\
    end{bmatrix} = \\begin{bmatrix} \\omega \\ v_F + \\omega \\times r \\end{bmatrix}\
    \ = \\begin{bmatrix} 1 & 0 \\ -r^* & 1 \\end{bmatrix} \\begin{bmatrix} \\omega\
    \ \\ v_F \\end{bmatrix}$$$\n```\n\nIf, as in the figure to the left, the two coordinate\
    \ frames are not only translated but rotated with respect to each other, the spatial\
    \ transformation would need to include rotation to align the frames, before the\
    \ translation. Because of this rotation, the body's angular velocity vector would\
    \ be oriented differently in the two frames, so we will use $\\omega_F$ and $\\\
