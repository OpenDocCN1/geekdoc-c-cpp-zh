  md: '# A.2 UNIT DIRECTION VECTORS


    The direction of a vector is most easily described by a unit vector, also called
    a direction vector. A unit vector, for a particular vector, is parallel to that
    vector but of unit length. Therefore, it retains the direction, but not the norm
    of the parent vector. Throughout this book the notation $\hat{v}$ will be used
    to indicate a unit vector in the direction of parent vector v. For example, the
    unit or direction vector corresponding with the 2D vector a


    ![](img/b434947f68660f7e26f8700ff77023a5_347_0.png)


    ```

    $$\tilde{\mathbf{a}} = \begin{bmatrix} a_x/\|\mathbf{a}\| \ a_y/\|\mathbf{a}\|
    \end{bmatrix} = \begin{bmatrix} \hat{a}_x \ \hat{a}_y \end{bmatrix}$

    ```


    # A.3 VECTOR ADDITION


    Addition of vectors can be expressed by a diagram. Placing the vectors to end,
    the vector from the start of the first vector to the end of the second vector
    is the sum of the vectors. One way to think of this is that we start at the beginning
    of the first vector, travel along that vector to its end, and then travel from
    the start of the second vector to its end. An arrow constructed between the starting
    and ending points defines a new vector, which is the sum of the original vectors.
    Algebraically, this is equivalent to adding corresponding terms of the two vectors:


    ```

    $$\mathbf{a} + \mathbf{b} = \begin{bmatrix} a_x + b_x \end_y} b_y{bmatrix} a_
    = +begin{x \ a_y + b_y \end{bmatrix}$

    ```


    We can think of this as making a trip from the start of the first vector to the
    end of the second vector, but this time traveling first horizontally the distance
    $a_x + b_x$, and then vertically the distance $a_y + b_y$.


    # A.4 VECTOR SUBTRACTION


    Subtraction of vectors can be shown in diagram form by placing the starting points
    of the two vectors, and then constructing an arrow from the head of the second
    vector in the subtraction to the head of the first vector. Algebraically, we subtract
    corresponding terms:


    ![](img/b434947f68660f7e26f8700ff77023a5_347_1.png)


    ```

    $$\mathbf{a} - \mathbf{b} = \begin{bmatrix} a_x - b_x \end_y} b_y{bmatrix} a =
    \begin{bmatrix} a_y - b_y \end{bmatrix}$

    ```'
