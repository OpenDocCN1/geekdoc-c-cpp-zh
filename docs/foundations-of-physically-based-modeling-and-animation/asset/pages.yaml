  md: '# 204 Foundations of Physically Based Modeling and Animation


    ![](img/b434947f68660f7e26f8700ff77023a5_226_0.png)


    FIGURE 10.1 A rigid ball crashes into a collection of rigid blocks. (Courtesy
    of Alex Beaty.)


    ![](img/b434947f68660f7e26f8700ff77023a5_226_1.png)


    FIGURE 10.2 The cue ball breaks the rack. (Courtesy of Christopher Thomas.)


    Moving surfaces, rotational motion, and higher-order integration all make the
    collision detection process more difficult. In particular, it can be possible
    for a simulation of an object that is spinning quickly “miss” a collision that
    occurs during a timestep, as a point on the object sweeps through some other object.
    If a collision is detected, it can be difficult to estimate the fraction of the
    timestep at which the collision occurred, since it is undergoing nonlinear motion,
    and often is integrated with a higher-order integrator.


    We will have more to say about to speed up collision detection in practical ways
    in Section 10.2. For now, assume that we can determine the point in time (with
    some tolerance) at which two objects collide.


    Collision determination involves finding the collision point p where there is
    a vertex-face or edge-edge collision. Typically this collision determination stage
    occurs during collision detection.


    Our choice, therefore, is in determining what the collision response be in the
    rigid body state. This will allow us to capture the interesting motion, like the
    pool ball break shown in Figure 10.2, that is the result of the response to rigid
    body collisions.'
