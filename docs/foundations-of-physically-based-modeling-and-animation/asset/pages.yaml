  md: 'The rotation of the vector r by a rotation quaternion q to produce the vector
    r'' is accomplished by the product


    $$(0,r'') = \mathbf{q} (0,r) \mathbf{q}^{-1}$$


    A proof that this provides a rotation of angle $\theta$ about the quaternion''s
    axis $\hat{\mathbf{u}}$ is given above. Note that the vector is converted to a
    quaternion whose real part is 0 in order to perform the quaternion multiplication,
    and the rotated vector must be extracted from the rotated quaternion, whose real
    part is also 0. Notice that the vector r could represent the position of a point
    relative to the origin. Thus, quaternion rotation can be applied to a point, and
    the rotation will be about the origin.


    As a notational convenience, quaternion rotation of a vector is usually simply


    $$$r'' = \mathbf{q} r \mathbf{q}^{-1}$$


    where the expansion of r to quaternion, and the extraction of r'' from the product
    quaternion are understood.


    It follows immediately from this representation of quaternion rotation that a
    series of rotations can be stored as a product of quaternions. Let us say that
    a rotation given by $\mathbf{q}_1$ is done first, followed by a second rotation
    given by $\mathbf{q}_2$. This can be written


    $$$r'' = \mathbf{q}_2 (\mathbf{q}_1 r \mathbf{q}_1^{-1}) \mathbf{q}_2^{-1}$$


    But, since quaternion multiplication is associative, this can be rewritten


    $$$r'' = (\mathbf{q}_2 \mathbf{q}_1) r (\mathbf{q}_1^{-1} \mathbf{q}_2^{-1})$$$


    demonstrating that the quaternion product $\mathbf{q}_2\mathbf{q}_1$ encodes consecutive
    rotations, first by rotation $\mathbf{q}_1$, followed by rotation $\mathbf{q}_2$.


    # E.4 QUaternIONS AND ROTATION MATRICES


    Rotation matrices and quaternions are equivalent, so it follows that there should
    be a conversion between the two forms.


    A rotation $\mathbf{q} = (s, u)$, where $s = \cos\theta/2$ and $u = \hat{\mathbf{u}}
    \sin\theta/2$, can be converted to a $3 \times 3$ rotation matrix via the formula


    $$R(\mathbf{q}) = \begin{pmatrix} 1-2u_y^2-2u_z^2 & 2u_xu_y-2u_uz_z & 2u_xu_z+2u_uy
    \ \hline 2u_xu_y+2u_uz_z & 1-2u_x^2-2u_z^2 & 2u_uy_z-2u_ux \ \hline 2u_xu_z-2u_uy
    & 2u_uy_z+2u_ux & 1-2u_x^2-2u_y^2 \end{pmatrix} \cdot .$$


    Converting from a rotation matrix to a unit quaternion must be done as a set of
    cases, based upon the diagonal elements of the rotation matrix. We show this in
    algorithmic form below.'
