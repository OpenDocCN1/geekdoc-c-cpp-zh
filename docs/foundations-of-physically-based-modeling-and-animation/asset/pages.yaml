    Whether the ball is slightly above, exactly on, or slightly below the surface
    may seem like a minor issue, and often it will cause no problems. However, if
    the ball is miscalculated below the surface, this can cause significant problems
    at the next timestep, since any motion that would have occurred from the collision
    response will seem to be causing the ball to collide with the plane from the “back”
    side. The result of this is that the ball passes through a wall of box.


    The above list illustrates how numerically error occurs and propagates in a very
    simple simulation. In a more complex simulation, the opportunities for and consequences
    of numerical precision only grow. Dealing with the various issues of numerical
    precision is a full topic of study in its own right, with many papers and books
    on topics related to numerical analysis, robust computation, etc. As one deals
    with more complex issues in physically based simulation, the importance of dealing
    with numerical error grows, but for now we describe a simple method for surviving
    most numerical errors: tolerances.


    Tolerances: Tolerances are used to represent a “buffer” region for a numerical
    calculation. Anything within the buffer region is assumed to be the thing it is
    around. A typical tolerance will be a very small number, with the intention that
    it is large enough to capture any numerical error, while being small enough that
    two things that are not the same will not be caught in the buffer region. Following
    convention, we will choose to represent tolerances with the designation $\epsilon$
    (delta is another common choice). Anywhere where we want to use tolerances, instead
    of checking for equality, we will say that two numbers are equal if they are within
    $\epsilon$ of each other.


