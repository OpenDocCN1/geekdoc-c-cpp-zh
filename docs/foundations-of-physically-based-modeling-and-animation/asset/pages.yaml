  md: '# Numerical Integration ■ 143


    Since $1+\frac{h}{2}$ must be greater than 1, the ratio of successive steps is
    always less than 1. Thus, the simulation will always converge to 0, and no matter
    what timestep size $h$ we choose the implicit Euler formulation will be stable.
    This is in contrast to the explicit Euler formulation, where obtaining stability
    requires $h < 2T$.


    Next, assume we are dealing with a sinusoidal oscillator $x = -\omega^2x^T$, with
    $s$


    ![](img/b434947f68660f7e26f8700ff77023a5_165_0.png)


    Therefore, $f(s) = [v, -\omega^2x^T]$. We can write the implicit Euler formulation
    as


    ```

    $$\begin{bmatrix} x^{[n+1]} \ v^{[n+1]} \end{bmatrix} = \begin{bmatrix} x^{[n]}
    \ v^{[n]} \end{bmatrix} + h\begin{bmatrix} v^{[n+1]} \ -\omega^2x^{[n+1]} \end{bmatrix},
    h, or$\n$\begin{bmatrix} x^{[n+1]} \ v^{[n+1]} \end{bmatrix} = \begin{bmatrix}
    x^{[n]} \ \end{bmatrix} + h\begin{bmatrix} 0 & 1 \ -\omega^2 & 0 \end{bmatrix}x^{[n+1]},
    h$

    ```


    so,


    ```

    $s^{[n+1]} = s^{[n]} + h\begin{bmatrix} 0 & h \ -\omega^2h & 0 \end{bmatrix}s^{[n+1]}$

    ```


    This can be rearranged to the form


    ```

    $Is^{[n+1]} - \begin{bmatrix} 0 & -h \ -\omega^2h & 0 \end{bmatrix}s^{[n+1]} =
    s^{[n]}$

    ```


    to yield the linear system


    ```

    $$\begin{bmatrix} 1 & -h \ 0 & 1 \end{bmatrix}s^{[n+1]} = s^{[n]}, or$\nM_s s^{[n+1]}
    = s^{[n]}$

    ```


    Thus, we have $s^{[n+1]} = M^{-1}s^{[n]}$. The determinant of $M$ is $1+\omega^2h^2$,
    and thus the determinant of $M^{-1}$ is $\frac{1}{1+\omega^2h^2} > 0$, will be
    less than 1 regardless of step size $h$, and the ratio of successive steps is
    always less than 1, and the implicit Euler integration is stable for all values
    of $h$. Again, this is in contrast to the explicit Euler formulation, which is
    never stable!


    So, as we can see, the implicit integration approaches significantly greater stability
    guarantees; implicit Euler integration is *unconditionally stable*, i.e., for
    any step size $h$, for oscillation and exponential decay. We can confidently take
    any step size we wish, and know that the solution will not "blow up." However,
    this comes at a cost: in addition to the more complicated solution, we encounter
    numerical dissipation.


    Whereas explicit methods have the tendency to cause magnitudes growing if the
    step size is too large, implicit methods will tend to decrease magnitudes with
    large step sizes. Over time, implicit methods tend to push solutions toward 0,
    rather than toward the true answer. This effect is called numerical dissipation.
    To understand this dissipation, we will consider fidelity of an oscillator, similar
    to our analysis for explicit methods in 7.5.'
