  md: '# Numerical Integration 119


    We assume we know the position x^{[i]} and velocity v^{[i]} at one time, and we
    want to find the position x^{[i+1]} and velocity v^{[i+1]} after a timestep h.
    If we imagine taking a standard Euler step to compute velocity, we get v^{[i+1]}
    = v^{[i]} + a^{[i]}h. We can use this in the trapezoidal method to compute x^{[i+1]}
    as follows:


    ```

    x^{[i+1]} = x^{[i]} + \frac{v^{[i]} + v^{[i+1]}}{2}h (7.6)

    x^{[i+1]} = x^{[i]} + \frac{v^{[i]} + a^{[i]}}{2}h (7.7)

    x^{[i+1]} = x^{[i]} + v^{[i]}h + \frac{a^{[i]}}{2}h^2 (7.8)

    ```


    This is the same as we saw from integrating with constant acceleration in Equation
    2.2.


    We can use this to get a higher-order estimate of position. Once we know position,
    we can compute the new acceleration at that point in the future, since we have
    an acceleration that is a function of just position. Finally, to find a higher-order
    estimate of velocity, we can use the trapezoidal method to take this new acceleration
    and compute the velocity. The method is summarized as follows:


    ```

    x^{[i+1]} = x^{[i]} + v^{[i]}h + \frac{1}{2}h^2

    a^{[i+1]} = f(x^{[i]})

    v^{[i+1]} = v^{[i]} + \frac{a^{[i]} + a^{[i+1]}}{2}h (7.9)

    ```


    We can see that the position is calculated using the second-order approach derived
    above, and the velocity is calculated using the trapezoidal method. Over-all,
    then, this Velocity Verlet integration is a second-order method. However, it is
    important to realize that the second-order nature of the approach depends on being
    able to compute the acceleration from just the position. As can be seen in Equation
    7.9, in order to compute v^{[i+1]} you must know a^{[i+1]}, which is computed
    based only on the position.


    # 7.2.3 Leapfrog Integration


    The leapfrog method is a slight variation of the Velocity Verlet method. With
    leapfrog integration, the idea is to compute values at a half-timestep difference
