  md: '# 8.2.4 Simulation of a Springy Mesh


    The calculation of accelerations on each particle of a springy mesh would proceed
    as follows:


    +   - Loop over all of the particles, setting each particle''s force to the accumulation
    of external forces acting directly on each particle, such as air drag, friction,
    or gravity.

    - Loop over all of the struts, adding each strut''s spring and damper forces to
    the forces acting on the two particles it is connected to.

    - Loop over all of the polygonal faces, distributing lift and drag forces acting
    on each of the faces of the face''s vertex particles.

    - Loop over all of the particles, dividing the particle''s total applied force
    by mass to obtain its acceleration.


    # 8.2.5 Structural Rigidity


    The goal of building springy objects is that the objects should roughly maintain
    their original shape but be able to deform moderately in response to forces. For
    example, the soft rolling ball in Figure 8.4 deforms under gravity and as it goes
    over the small beads on the floor, but still looks like a ball. Unfortunately,
    simply replacing polygon edges by struts will not always achieve the desired effect.


    The figure to the right shows how a cube might be envisioned if all of its edges
    were replaced by springy struts, and each vertex by a point mass. Each edge is
    now free to elongate or shorten, with the spring tending to keep the edges of
    their original lengths. The problem with this configuration is that the point
    masses will act like ball joints connected to the edges.


    ![](img/b434947f68660f7e26f8700ff77023a5_180_0.png)


    FIGURE 8.4 A very soft ball rolling over some beads. (Courtesy of Chaorin Li.)


    ![](img/b434947f68660f7e26f8700ff77023a5_180_1.png)'
