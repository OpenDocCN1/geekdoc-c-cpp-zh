  md: '# Rigid Body Collisions and Contacts ■ 213


    better to minimize overall volume of the OBB or the maximum dimension along an
    axis, or something else). However, three orthogonal axes can be obtained by performing
    a principal components analysis of the vertex positions of the object, to find
    the directions of greatest to least variance. These axes tend to produce a tight-fitting
    box.


    Alternatively, if the object is in a “good” orientation in its local (modeling)
    frame, as is often the case when modeling, one can form an OBB using the $x, y,$
    and $z$ axes from the local frame.


    Given the three axes, the maximum and minimum along each of those axes must be
    determined. This can be found by projecting the position of the vertices relative
    to the center of mass onto all three axes, and looking for the maximum and minimum
    of each.


    To check for collisions between two OBBs, we project them along an axis, called
    *separating axis*, and determine whether they overlap that axis. If the projections
    are not overlapping, the objects are not overlapping. The converse, however, is
    not true; if two volumes overlap projected onto an axis, it does not mean the
    volumes themselves overlap. The key is to find a small set of axes along which,
    if the objects overlap in all axes, the volumes overlap. Testing these axes is
    enough to guarantee that the objects are not overlapping.


    Note that when comparing AABBs or $k$-dops, we could rely on knowing a specific
    set of axes which we need to test for overlaps. We would like to have something
    for OBBs, but run into difficulty since each OBB is defined with its own set of
    axes. To resolve this problem and find collisions between two OBBs, we must rely
    on the *separating axis theorem*


    The separating axis theorem states that a complete set of separating axes can
    be found from the following:


    +   - The normals of the faces of the first object


    +   - The normals of the faces of the second object


    +   - The cross-products of an edge of one object with an edge of the other object


    For OBBs, this gives three axes for the faces from the first object, three more
    for the faces from the second object, and nine from the cross-products of the
    edges, for 15 total axes. In practice, however, one does not need to test all
    15 axes for OBBs, since the test for overlap is a conservative one: we just need
    to eliminate cases that are not overlapping, not cases where there is overlapping.
    Thus, it can be feasible to test only a limited set of axes that will catch most
    cases, such as the six face normals. Notice that for AABBs, because the face normals
    align with the edges for both objects, there are only three axes to test (the
    $x, y,$ and $z$ axes).'
