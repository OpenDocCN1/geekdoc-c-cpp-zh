  md: '# Interacting Particle Systems


    and managing the computational complexity of our simulations to achieve reasonable
    performance. Our primary examples will be astronomical simulation and flocking
    systems.


    # 6.1 STATE VECTORS


    The problem of maintaining a coherent notion of the entire system''s state can
    be conveniently addressed using the idea of a state vector. In the mathematical
    sense, a state vector is a vector whose elements record all information necessary
    to keep track of the state of a system. For a particle system, this will be the
    positions and velocities of all the particles in the system. On the software side,
    a state vector is typically maintained as an object containing an array of particle
    positions and velocities, together with a set of methods for doing mathematical
    and maintenance operations over this array. We will start by building up the conceptual
    basis for state vectors, and then describe how they can be integrated into the
    simulation loop to support efficient interacting particle simulations.


    # 6.1.1 State Vectors for Single Particles


    When computing the motion of a particle in a noninteracting particle system, the
    particle''s state consisted of its current position and velocity. We could abstract
    this using vector notation to describe the state of particle $i$ by the state
    vector:


    ```

    $$\mathbf{s}_i = \begin{bmatrix} \mathbf{X}_i \ \mathbf{V}_i \end{bmatrix} \quad
    (6.1)$

    ```


    This may appear to be a strange mathematical object, since we have been thinking
    of vectors as scalar components, but the algebra of vectors will support elements
    that are themselves vectors. The additive, scaling, and dot product vector operations
    still apply:


    ```

    $$\mathbf{s}_i + \mathbf{s}_j = \begin{bmatrix} \mathbf{X}_i + \mathbf{X}_j \
    \mathbf{V}_i + \mathbf{V}_j \end{bmatrix} \$

    ```


    ```

    $$\mathbf{s}_i - \mathbf{s}_j = \begin{bmatrix} \mathbf{X}_i - \mathbf{X}_j \
    \mathbf{V}_i - \mathbf{V}_j \end{bmatrix} \$

    ```


    ```

    $$\mathbf{aS}_i = \begin{bmatrix} \mathbf{aX}_i \ \mathbf{aV}_i \end{bmatrix}
    \$

    ```


    ```

    $$\mathbf{s}_i \cdot \mathbf{s}_j = \mathbf{X}_i \cdot \mathbf{X}_j + \mathbf{V}_i
    \cdot \mathbf{V}_j. \$

    ```


    Because of this, vector notation can be highly effective in simplifying the notation
    needed to describe operations data types and methods for operating on particles
    in a compact way. To see this, let us first examine the ramifications of this
    notation on how we might describe a noninteracting particle simulation.'
