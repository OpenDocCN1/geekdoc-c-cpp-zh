    provides spatial subdivisions simultaneously at a number of scales, so algorithms
    examining a region of space can work at whatever resolution is required, given
    the number of particles in the region and its spatial position.


    Construction of an octree begins as demonstrated in Figure 6.2. Just as for the
    uniform grid, we start with a bounding box around the entire space of the problem.
    This becomes the single root node of the octree, residing at tree Level 0. The
    children of this cell are constructed by subdividing the cell into equal sized
    nodes, via axis-aligned cutting planes passing through the cell center. These
    child cells are the eight nodes residing at Level 1 of the tree. This subdivision
    may continue for as many levels as desired, so for each level $L$, there are $8^L$
    nodes. The volume of the root cell is $V = DWH$, the volume represented by a cell
    at level $L$ and the dimensions of the cell will be $D/2^L, W/2^L$, and $H/2^L$.
    This octree has exactly eight children. However, subdivision of a node can be
    adaptive, leaving nodes farther up in the tree unsubdivided. One way that this
    might occur if a node is selected for subdivision only if the number of particles
    residing in the node''s cell is above some threshold.


    As did for the uniform spatial grid, we can make all spatial locations relative
    to the minimum $x, y$, and $z$ coordinate $x_0$ of the bounding box. We number
    the eight octants of cell $0\dots7$ as shown in Figure 6.2. Now if we know the
    spatial location $x$ of a particle within a cell at level $L$, whose minimum $x,
    y, z$ corner is $x_p$, we can quickly compute the octant that the particle resides
    in $i$, using the following logic. Compute the center of the parent cell $x_c
    = x_p + W/2^{L+1}, y_c = y_p + H/2^{L+1}, z_c = z_p + D/2^{L+1}$, and let $Dx
    = x_c - x_p$, whose components are $(\Delta x, \Delta y, \Delta z)$. Now, construct
    a 3-bit index such that if $\Delta x > 0$ is 1, if $\Delta y > 0$ is 1, and if
    $\Delta z > 0$ is 2. Converting this binary number to decimal gives the octant
    indices as shown in Figure 6.2.


    There are various ways to allocate the cells of an octree. For a full octree,
    the most efficient approach is to allocate the space for the full all at once,
    and then building an indexing structure into each of the nodes. For an octree
    that is not full, the usual approach is to allocate each tree node individually,
    and each node store pointers to its parent and child nodes.


    Here we summarize the indexing scheme for a full octree allocated as one array
    containing all the nodes for all of the levels. At level $L$, a full octree'
