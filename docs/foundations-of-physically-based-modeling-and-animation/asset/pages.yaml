    # 10.3.3 Friction as an LCP


    To obtain rigid body behavior when contacts are involved, it is necessary to model
    frictional as well support forces. The Coulomb model of friction limits its amount
    of frictional force at a contact to $\mu f_n$, where $\mu$ is the coefficient
    of friction at the contact, and $f_n$ is the normal force to the surface at the
    contact. The direction of the force will be in opposition to the tangential velocity
    of the contact, or in the absence of tangential velocity, in the direction of
    any applied force. In addition, frictional force is purely dissipative—it cannot
    cause the contact''s motion to reverse direction—the total force that can be realized
    in any timestep of a simulation must never be more than is needed to bring the
    tangential motion to a contact to stop. Therefore, the full force of friction
    is felt, where $f_t = \mu f_n$, or a force less than this is applied that brings
    the contact to stop. In reality, the full acceleration due to friction is felt
    until the object stops. We model this for a timestep by scaling the total acceleration
    to which is exactly required to stop the object at the end of the timestep. In
    other words, $a_i^+ = -v_t/h_t$.


    An LCP, proposed by Kokkeklis [2004] for a frictional sliding is summarized by
    the three complementarity conditions:


    +   1. $a_n^+ \ge 0$ complementary to $f_n \ge 0$

    2. $a_t^+ + v_t^+/h + \lambda \ge 0$ complementary to $f_t \ge 0$

    3. $\mu f_n - f_t \ge 0$ complementary to $\lambda \ge 0$


    Condition 1 handles the relationship between normal force and acceleration that
    we have already covered in the frictionless condition. Condition 2 handles the
    relationship between tangential force and acceleration, including the requirement
    that the tangential acceleration cannot exceed that is needed to stop a moving
    object.


