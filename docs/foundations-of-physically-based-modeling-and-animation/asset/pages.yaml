    This is the same result as in 2D, with the exception of the extra $w$ coordinate,
    which remains 1. All we have done is to place all of our 2D points on the plane
    $w=1$ in 3D space, and now we do all the operations on this plane. Really, the
    operations are simple 2D operations. But, the magic happens when we place the
    translation parameters $c$ and $f$ in the third column:


    ```

    $$\begin{bmatrix} a & b & c & x \ d & e & f & y \ 0 & 0 & 1 & 1 \end{bmatrix}
    = \begin{bmatrix} ax+by+c \ dx+ey+f \ 1 \end{bmatrix}$

