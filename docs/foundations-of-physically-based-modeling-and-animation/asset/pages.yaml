    # 3.3 IMPLEMENTING A BOUNCING BALL


    At this point, we have presented all the tools needed to implement a ball bouncing
    around inside a box. We would strongly encourage the reader to try implementing
    a simulation at this point. Once you have an implementation, it will quickly become
    apparent that the simulation behave slightly differently than you might expect.
    There are two aspects of this that we will discuss in more detail: numerical precision
    and resting conditions.


    # 3.3.1 Numerical Precision


    Most people are already familiar with the idea of floating-point round-off error.
    Round-off error comes from the fact that most numbers are represented in a binary
    floating point format, and thus cannot exactly represent most real numbers. Instead,
    the number we use is rounded to the nearest number that the computer can represent.
    This is usually a very small change in the number but can play havoc with tests
    requiring exact precision. Round-off errors are one example from a class of issues
    known as numerical-precision problems or simply *numerical error*.


    In simulations, numerical error arises from a wide variety of sources. Round-off
    error occurs when we represent positions, vectors, matrices, etc., and the results
    of mathematical operations between them. Besides round-off error, there is integration
    error: the error that arises during integration. Integration error arises from
    the use of discrete timesteps instead of continuous time, coupled with an imprecise
    method of representing the motion within the timestep (e.g., assuming velocity
    is constant over a timestep). Yet another source of error is discretization of
    geometry, where a surface that is intended to be smooth is approximated by individual
    polygons, or a solid is approximated by voxels. Regardless of the source, the
    end result is we should never assume that we have an “exact” numerical value within
    the simulation.


    Even in the basic simulation we have already seen, there are several places where
    we may encounter numerical errors and associated problems:


    +   • Calculating the distance from a point (Equation 3.1) will have round-off
    error.

    • This error can be further compounded when we calculate the fraction of a timestep
    $f$ (Equation 3.2).'
