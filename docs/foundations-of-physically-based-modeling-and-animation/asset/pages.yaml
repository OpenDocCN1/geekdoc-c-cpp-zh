  md: '# CHAPTER 2


    # Simulation Foundations


    # 2.1 MODELS AND SIMULATIONS


    WO KEY COMPONENTS ARE REQUIRED TO GENERATE a physically based animation: a model
    and a simulation. A model is a set of laws or rules governing how something behaves
    or operates, while a simulation is the encapsulation of the model in a framework
    allowing the prediction of this behavior over time.


    A physically based model is a model that defines the physics of how system behaves:
    the rules governing motion of objects, behavior of the environment, interactions
    between objects, etc. Commonly, a physically based model is based on real-world
    behavior, the laws that govern our world actually works. However, it is important
    to remember that even “real” models are almost simplified. Effects that are considered
    minor are often ignored, and the model might describe large-scale behavior without
    every detail. For example, a simulation does not need to track every atom, but
    instead will concentrate on describing the behavior of the large-scale components
    of the car.


    Furthermore, for animation purposes, it is often desirable to define physics that
    do not necessarily conform to the real world. For example, Wile Coyote is famous
    for running off a cliff, being suspended in the air for a moment until he realizes
    his situation, and then falling faster than the real physics dictate—he is catching
    up with “lost” falling time! To capture behavior such as this, the animator has
    the opportunity to reinvent physical laws, building a cartoon physics to the effect
    that is desired [Hinckley, 1998].


    A physically based simulation takes a physically based model and initial conditions
    (as a starting point and velocity), and tries to determine how the object modeled
    behaves over time. There are a variety of simulation techniques, and choosing
    one involves examining trade-offs in accuracy, speed, robustness, and appropriateness
    to the particular model.


    To illustrate the ideas of modeling and simulation, and the general simulation
    process, we will begin by walking through a simple example that everyone will'
  merge: -1
