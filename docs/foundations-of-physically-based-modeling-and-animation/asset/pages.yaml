  md: '# 11.1.1 P Control: Proportional


    The simplest control system that can be used for the penalty method is known as
    a proportional or P controller, which exerts a force that is directly proportional
    to the measured constraint deviation. The construction of the controller is as
    follows. Consider the case of a gray bead constrained to follow along a wire,
    as shown in the figure. The thin line indicates the constraint path or wire, while
    the actual path of the bead is shown as a bold line. The position of the center
    of the bead is x(t), the nearest point on the constraint path to the bead is c(x),
    and the vector measuring the error, or deviation from the constraint, is e(x)
    = x(t) - c(x). A P controller, whose strength constant is kp, would exert the
    correcting force


    ```

    $f_{p} = -k_{p}e$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_253_0.png)


    Note that this construction is identical to having a spring of length 0 connecting
    the constraint path to the bead, where one end of the spring is free to slide
    along the path.


    In an implementation, for each object using a P controller to enforce a constraint
    via the penalty method, the corresponding constraint force $f_{p}$ would have
    to be added into the sum of forces acting on the object. This assumes that an
    error function $e(x)$ is known for each object.


    The figure to the right shows what the gray bead''s motion might look like if
    were constrained to travel along a parabolic track using a P controller. The thin
    line denotes the track, and the darker line shows the path that the bead might
    follow under the influence of gravity, air resistance, and the controller. While
    the bead generally tries to follow the constraint path, there are large deviations
    and oscillations in the distance between the bead and the path. In addition, when
    the bead comes to rest, there is a constant offset from the path, where the force
    due to gravity exactly counteracts the force exerted by the controller.


    ![](img/b434947f68660f7e26f8700ff77023a5_253_1.png)


    # 11.1.2 PD Control: Proportional + Derivative


    The large swings in error exhibited by the proportional or P controller are due
    to the fact that it does not exert a force to hold a constraint until the constraint
    has already been violated. A P controller can be greatly improved by the addition
    of a derivative term, giving it the ability to anticipate future changes in the
    error.'
