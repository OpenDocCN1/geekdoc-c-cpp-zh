  md: '# 226 Foundations of Physically Based Modeling and Animation


    rotation, which results in a normal acceleration $k_{tnft}$. Since all of the
    geometric and inertial conditions are identical in both cases, $k_{mt}=k_{tn}$.


    These elements can be computed by a modified version of the BuildKMatrix test-impulse
    algorithm for frictionless contacts, described above. The algorithm must be extended
    by adding additional impulses in the tangential direction. The direction of the
    tangential impulse should be chosen on the current relative tangential velocity
    and acceleration at the contact point. If the relative tangential velocity is
    non-zero (with a tolerance), the impulse direction should oppose the tangential
    direction. If the tangential velocity is 0, the bodies are not moving to each
    other and the impulse direction should be opposite the tangential acceleration,
    thereby opposing movement. If both tangential velocity and acceleration are zero,
    an arbitrary impulse direction can be chosen—Kokvekis suggests using the last
    valid direction encountered in the simulation.


    Therefore, when friction is considered, the LCP map for multiple contacts will
    require a $3 \times 3$ submatrix for each contact, meaning that for $N$ contacts,
    the matrix will be $3N \times 3N$. There are many ways this can be organized,
    by a suggested organization is to group the layers together in submatrices, giving
    the structure


    ```

    $K = \begin{bmatrix} k_{n_0n_0} & \dots & k_{n_1n_0} & & \ \vdots & & \vdots &
    & \ k_{n_0n_{N-1}} & \dots & k_{n_1n_{N-1}} & & \ \ k_{n_0t_0} & \dots & k_{n_1t_0}
    & & \ \vdots & & \vdots & & \ k_{n_0t_{N-1}} & \dots & k_{n_1t_{N-1}} & & \ \end{bmatrix}
    \begin{bmatrix} & & 0 \ & \mu_0 & & -1 \ & \mu_{N-1} & & 0 \end{bmatrix}$

    ```


    where **0** is the $N \times N$ zero matrix, and **1** is the $N \times N$ identity
    matrix. This allows the $f_n, f_t, \lambda$, and other terms to be grouped into
    $N$ element vectors, e.g., $\mathbf{f}_n$, $\mathbf{f}_t$, and $\mathbf{\lambda}$,
    giving the final linear system their form


    ```

    $K \begin{bmatrix} f_n \ \lambda \end{bmatrix} + \begin{bmatrix} \mathbf{a}_n
    \ \mathbf{a}_t + \frac{1}{2}\mathbf{v}_t \end{bmatrix} = \begin{bmatrix} \mathbf{a}_n^+
    \ \mathbf{a}_t^+ \ \lambda^+ \end{bmatrix} \cdot 0$

    ```


    In this form, the known parameters can be handed to an LCP solver, which will
    return the resulting forces and $\lambda$ values.'
