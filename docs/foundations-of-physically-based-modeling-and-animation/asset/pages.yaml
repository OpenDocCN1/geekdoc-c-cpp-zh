    When implementing tolerances, it is often most efficient to compare two numbers
    by looking at the difference between them. Without tolerances, we might write
    a conditional check as $a = b$. Notice that this is equivalent to (and computer
    hardware opens it) as $a - b = 0$. If we have tolerances, then write $a > b$ AND
    $a < b+\epsilon$, we can just write $|a - b| < \epsilon$.


    We must be careful in our use of comparisons. For example, to check whether $a
    > b$, we must check whether $a - b < \epsilon$, and to check whether $a < b <
    -\epsilon$. The figure makes this visually apparent. Although this seems like
    a very simple idea, it is easy to make a sign error in tolerance comparisons,
    and we need to be careful about account equality whenever we compare two values.


    # Limitations with tolerances: Despite their usefulness, tolerances are not a
    universal solution, and it is difficult to overcome the numerical errors from
    the use of tolerances. There are two main ways that tolerances are limited.


    First, it can be very difficult to set a "good" tolerance. As tolerances grow
    larger, more numerical errors are caught, but there is also the chance of incorrectly
    classifying things that should be different as the same. It is impossible to find
    a tolerance value that catches all errors and causes no false equalities. Typically,
    when tolerances are implemented, there is used throughout the program to deal
    with all numerical errors. However, if it is even possible to get "good" tolerances,
    different tolerance values might be needed in different parts of the computation.
    While it is possible to do this, it can add significant complexity to the code
    that is developed.


    A second problem with tolerances is what is called * intransitivity*. Transitivity
    is the mathematical property of a relationship operator, demonstrated in the example
    that if $a=b$ and $b=c$, then $a=c$. It is easy to illustrate that tolerance does
    not exist when tolerances are being used. Imagine that we have three values, $A=1.5$,
    $B=1.7$, and $C=2.0$, and a tolerance value of $\epsilon=0.4$. As that $A$ and
    $B$ are $|1.5 - 1.7| < 0.4$, and likewise that $B=C$, but it is not true that
    $A=C$, since $|1.5 - 2.0| > 0.4$, i.e., transitivity is violated. Often, algorithms
    developed implicitly assuming transitivity, and as a result, tolerances can cause
    fundamental problems with algorithm behavior, leading to complete program failure.
    Avoiding this requires careful examination of all of the algorithms and assumptions
    in the program, to ensure that transitivity is not incorrectly assumed.


    When numerical error becomes a big enough problem that tolerances are insufficient,
    a more systematic approach is needed. The first step is to closely examine all
    of the areas where numerical error is created and propagated in the simulation,
