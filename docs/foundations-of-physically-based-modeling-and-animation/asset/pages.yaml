    Here we provide a relatively simple example of how to use the Jacobian in implicit
    integration. Assume we have the one-dimensional problem posed in the right. There
    are three points $p_0, p_1, and p_2$ connected to each other by springs. Position
    of point $i$ is $x_i$ and its velocity is $v_i$. The first point has position
    $x_0=0$, and therefore velocity $v_0=0$. The other points are free to move. The
    springs exert force on the two points they connect, with one component of force
    proportional to how far apart the points are (i.e., how much the springs are compressed
    or stretched), and the other proportional to the cube of their relative velocities.
    Newton''s third law applies, so the net force exerted by the spring on its end
    will be equal and opposite to the force it exerts on the right end.


    Therefore, if all springs are identical, the force acting on $p_i$ due to its
    spring connection to point $p_{i+1}$ be


    ```

    $f_{i,1} = k(x_{i+1}-x_i-l) - d(v_{i+1}-v_i)^3$,

    ```


    and there will be similar forces acting between all connected pairs. In this equation,
    $k, l,$ and $d$ are the spring constant, rest length, and damping coefficient,
    for the springs.


    Based on this, we have mass 1, the following state:


    $S = \begin{bmatrix} x_1 \ x_2 \ v_1 \ v_2 \end{bmatrix}$


    If all particles have mass 1, the derivative function is


    $F = \begin{bmatrix} v_1 \ v_2 \ f_{0,1}+f_{1,2} \end{bmatrix} = \begin{bmatrix}
    v_1 \ -k(x_1-x_0)-l-d(v_1-v_0)^3+k[x_2-x_1]-l_b]+d(v_2-v_1) \ -k(x_2-x_1)-l_b-d(v_2-v_1)^3
    \end{bmatrix}$


    The Jacobian matrix, is


    $J = \begin{bmatrix} 0 & 0 & 1 & 0 \ 0 & 0 & 0 & 1 \ -2k & -k & -3d(v_1-v_0)^2+(v_2-v_1)^2
    & 3d(v_2-v_1) \ k & -k & 3d(v_2-v_1)^2 & -3d(v_2-v_1)^2 \end{bmatrix}$


    Let us look at a specific case. Let the spring constant be $k=2$, the rest length
    $l=10$, and the damping coefficient $d=1$. Then, (remembering that $x_0=v_0=0$)
    we have


    $F = \begin{bmatrix} v_1 \ v_2 \ -2(x_1-10)-v_1^2+2(x_2-x_1)-10)+(v_2-v_1)^3 \
    -2(x_2-x_1)-10-(v_2-v_1)^3 \end{bmatrix}$


