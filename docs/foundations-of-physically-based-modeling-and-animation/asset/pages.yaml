    ```

    $$\dot{R} = [\omega \times \mathbf{\hat{u}}_x \quad \omega \times \mathbf{\hat{u}}_y
    \quad \omega \times \mathbf{\hat{u}}_z].$$

    ```


    This form is not very handy for computation, since we have to individually operate
    on each column of the matrix $R$ in order to determine its derivative. Fortunately,
    the cross-product can be written in the form of a matrix by the equivalence relation


    ```

    $$\mathbf{a} \times \mathbf{b} = \mathbf{a}^T\mathbf{b}.$$

    ```


    where the matrix


    ```

    $a^* = \begin{bmatrix} 0 & -a_z & a_y \ a_z & 0 & -a_x \ -a_y & a_x & 0 \end{bmatrix}.$$

    ```


    The reader is invited to carry out the cross-product and matrix-vector operations
    to verify that these are identical.


    Using this representation of the cross-product, we arrive at a convenient form
    for account for, *inertia*. In order for the derivative of the rotation matrix,


    ```

    $$\dot{R} = \omega^* R.$$$

    ```


    Finally, there is one more factor that we must account for, *inertia*. In order
    to understand inertia, we will first describe *momentum*. Here again, we have
    an analogous situation to linear momentum. Just as Newton''s first law implies
    that linear momentum is conserved, it also implies that angular momentum is conserved.


    We have seen momentum $\mathbf{P}$ in the linear case as the product of mass and
    velocity,


    ```

    $$\mathbf{P} = m\mathbf{v}.$$

    ```


    In the angular case, we have a close analog, where angular momentum $\mathbf{L}$
    is defined as the product of moment of inertia $I$ and angular velocity. So,


    ```

    $$\mathbf{L} = I\omega.$$$

    ```


    > It is an unfortunate accident of history that the convention of using $I$ for
    the moment of inertia tensor is to use the notation $I$ to represent the identity
    matrix. In situations there may be confusion, the notation $1$ may be used for
    the identity matrix.'
