  md: '# 364 Foundations of Physically Based Modeling and Animation


    # F.3 BARYCENTRIC COORDINATES OVER TETRAHEDRA


    Barycentric coordinates can also be defined over tetrahedra in 3D, and in fact
    over ''simplices'' in any dimensional space. Tetrahedra are of particular interest
    in graphics and animation, just as triangles are a preferred way of tiling a surface,
    tetrahedra are a preferred way of tiling a solid. Given vertices p_0, p_1, p_2,
    and p_3, we will have barycentric coordinates u, v, w, and 1 - u - v - w. The
    tetrahedron inside-outside test is


    ```

    u \ge 0, v \ge 0, w \ge 0, u+v+w \le 1,

    ```


    and the corresponding 3D projection for a point x


    ```

    x = u p_0 + v p_1 + w p_2 + (1 - u - v - w) p_3.

    ```


    Just as we could define barycentric coordinates in 2D by a ratio of triangle area
    to overall triangle area, we could compute the barycentric coordinates for a point
    in 3D by comparing ratios of tetrahedral volumes (e.g., for x, p_0, p_1, p_2,
    and p_3) to the volume of the overall tetrahedron (e.g., points p_0, p_1, and
    p_3). But, a different way of computing barycentric values is more general.


    Let us reexamine our derivation of barycentric coordinates for a triangle in 2D
    space. The problem could have been formulated as a linear system, in which we
    propose that any point lying inside a triangle is the weighted sum of its three
    vertices, with weights u, v, and w, subject to the convexity condition u+v+w =
    1. If the point position is x, and the triangle vertices p_0, p_1, and p_2, we
    have the linear relationship


    ```

    x = u p_0 + v p_1 + w p_2,

    ```


    or after applying the constraint w = 1 - u - v and rearranging,


    ```

    u(p_0 - p_2) + v(p_1 - p_2) = x - p_2.

    ```


    Rewriting this in matrix-vector form, we have


    ```

    Mu = x - p_2,

    ```


    where


    ```

    u = [u; v], and M = [x_0 - x_2, x_1 - x_2; y_0 - y_2, y_1 - y_2].

    ```


    *The 2D simplex is the triangle and the 3D simplex is the tetrahedron. Just like
    an object in object 2 space formed by connecting 2+1=3 non-collinear points, a
    simplex in an arbitrary D space is an object formed by connecting D+1 points by
    truncated D-1 dimensional surfaces, that the truncated surfaces form the convex
    hull containing all of the points. For example, the tetrahedron is defined by
    3+1=4 vertices, every of which define a triangular face embedded in a 3-1=2-dimensional
    space.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Barycentric Coordinates ■ 365


    The reader can confirm that inverting matrix $M$ and multiplying by the right-hand
    side of this equation yields the same barycentric coordinate calculation obtained
    using the area and cross-product approach outlined above.


    This linear-system approach to defining barycentric triangle coordinates can be
    applied to the problem of defining tetrahedral coordinates. We can let $u, v,$
    and $w$ be the coordinates to be determined, along with a fourth coordinate whose
    value is $1-u-v-w$, and let $\mathbf{p}_0, \mathbf{p}_1, \mathbf{p}_2,$ and $\mathbf{p}_3$
    be the four vertices of the tetrahedron. The barycentric coordinates are then
    determined by the equation


    ```

    $M\mathbf{u} = \mathbf{x} - \mathbf{p}_3$,

    ```


    where


    ```

    $$\mathbf{u} = \begin{bmatrix} u \ v \ w \end{bmatrix} \quad \text{and} \quad
    M = \begin{bmatrix} x_0-x_3 & x_1-x_3 & x_2-x_3 \ y_0-y_3 & y_1-y_3 & y_2-y_3
    \ z_0-z_3 & z_1-z_3 & z_2-z_3 \end{bmatrix}$,

    ```


    so that barycentric coordinates are obtained from 3D position $\mathbf{x}$ by


    ```

    $$\mathbf{u} = M^{-1}(\mathbf{x}-\mathbf{p}_3)$.

    ```'
