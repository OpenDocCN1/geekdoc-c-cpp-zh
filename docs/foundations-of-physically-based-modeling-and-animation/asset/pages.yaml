  md: '# Interacting Particle Systems


    BUILDING AND CHOREOGRAPHING PARTICLE SYSTEMS, consisting of noninteracting particles
    allowed us to produce many striking visual effects but there are many systems
    that can only be simulated realistically if the particles are treated as interacting
    with each other. The most obvious example is the universe itself. At astronomical
    distances, all of the asteroids, moons, planets, stars, and indeed the galaxies,
    can be thought of as particles. Their massive sizes are negligible compared with
    the scale of the universe. But, their behavior, like exhibited by the galaxy in
    the figure above, could never be modeled by a standard particle system. This is
    simply because the behaviors arise from the complex gravitational interactions
    that the heavenly bodies all exert on each other. Because of these attractions,
    moons orbit planets, planets orbit their suns, and suns group together to form
    spiral or galactic galaxies. In turn, the gravity of these galaxies affects all
    of the other galaxies. The resulting complex patterns of motion, across many orders
    of magnitude of scale, could not possibly arise without the forces of interaction.


    One of the first things to recognize when working with interacting particles is
    that it will be important to maintain a coherent notion and record of the entire
    system''s state, and to update that state only once per timestep. This is true
    since particles can no longer be treated as independent individuals. If we update
    the state of one particle, we are changing its position and velocity, which in
    turn will affect the forces acting on all of the other particles in the system.
    We need all of the particles'' positions and velocities to remain frozen in time
    while we compute all of the forces acting on all of the particles. Only after
    all of the forces


