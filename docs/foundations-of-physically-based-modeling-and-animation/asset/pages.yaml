  md: '# Coordinate Systems


    THE IDEA OF a *coordinate system*, or *coordinate frame* is pervasive in computer
    graphics. For example, it is usual to build a model in its own *modeling frame*,
    and later place this model into a scene in the *world coordinate frame*. We often
    refer to the modeling frame as the *object frame*, and the world coordinate frame
    as the *scene frame*. The figure below shows a cylinder that has been built in
    modeling frame **M**. To place the cylinder into the world frame **O**, the modeling
    frame has first been rotated about its own center, translated to the position
    **x** in the world frame. Such a transformation can be encoded in a transformation
    matrix from the model frame to world frame,


    $M_{mw} = T_{mw}R_{mw}$


    $T_{mw}$ encodes the translation and $R_{mw}$ encodes the rotation.


    ![](img/b434947f68660f7e26f8700ff77023a5_369_0.png)'
