    We use the following notation in fluid simulation equations to equate these space-time-varying
    fields. We represent the fluid velocity field as $\mathbf{u}(\mathbf{x}, t)$,
    the acceleration field $\frac{\partial\mathbf{u}}{\partial t}$ as $\dot{\mathbf{u}}(\mathbf{x},
    t)$, the density as $\rho(\mathbf{x}, t)$, and the pressure field as $p(\mathbf{x},
    t)$. We also need to define $\mathbf g(\mathbf{x}, t)$, to account for external
    accelerations acting on the body of the fluid, with gravity. As a convenience,
    these will be written as $\mathbf{u}, $\dot{\mathbf{u}}, $\rho, p$, and $\mathbf
    g$, but the reader is cautioned to remember that these are always space- and time-varying
    fields, not simple scalar or vector values.


    An assumption that is almost made in fluid simulation for animation is that the
    fluid is incompressible. For all practical purposes this is an excellent assumption
    for water simulation, and is also a good assumption for air flow to speeds approaching
    100 meters per second (200 miles per hour). Recall this implies that the fluid
    velocity field should be divergence free.


    Given the incompressibility assumption, and our chosen notational form, the Navier-Stokes
    momentum equation


    ```

    $$\frac{d\mathbf{u}}{dt} = -\nabla p + \eta\nabla^2\mathbf{u} + \rho\mathbf{g},

    ```


    subject to the constraint that


    ```

    $$\nabla\cdot\mathbf{u} = 0$.

    ```


    Note that $\dot{\mathbf{u}}$ is the **total derivative** with respect to time,
    not the partial derivative $\mathbf{u}$. Equation 13.1 relates the time rate change
    of the velocity field to the sum of three sources of acceleration, resulting from
    both internal and external forces. The constraint on the fluid velocity field
    given by Equation 13.2 enforces incompressibility by assuring that the fluid flows
    divergence free.


    The terms in Equation 13.1 all have SI units of N/$m^3$, and can be summarized
    as:


    $$\nabla p$ This term accounts for the force due to the local **pressure gradient**.
    If a point in a field has a lower pressure than the surrounding fluid, will tend
    to flow from the higher pressure region to the lower pressure region, following
    the negative of the gradient, to equilibrate the pressure. $p$ has SI units N/$m^2$


    $$\eta\nabla^2\mathbf{u}$ This term is known as the **viscosity** or **diffusion**
    term, and accounts for shear forces in the fluid created by velocity differences
    in neighboring regions of the fluid. The constant $\eta$ is known as the **dynamic
    viscosity** of the fluid, and can be thought of loosely as the “thickness” of
    the fluid, how much it tends to resist flow. For example, the dynamic viscosity,
    at room temperature, of water is roughly 0.002, and SAE 30 motor oil is 0.02,
    and of honey is 2. All of these are in SI units of N-s/$m^2$ [Research Equipment'
