  md: When a particle generator creates a new particle, assigning its initial position,
    velocity, and parameters, it is usually necessary to provide some randomness.
    Although there are situations where it is desirable that all particles have the
    same characteristics, typically each particle is given a unique signature by drawing
    its parameters from a random process. In generating random numbers to randomize
    particle parameters, one should resist the simple solution of calling the system’s
    rand() function, because it is designed to produce only uniformly distributed
    random numbers. A uniform distribution is one in which any value within the range
    of the distribution is equally likely. Instead, one should ask what random characteristics
    we want in a parameter? Consider the weight of a collection of apples. If we say
    that the average weight is 80 grams, with a range from 50 to 110 grams, is it
    reasonable to assume that there will be as many apples weighing 55 grams as weighing
    82 grams? Certainly not! It is much more likely that an apple will weigh the average
    than an unusually low or high weight.
