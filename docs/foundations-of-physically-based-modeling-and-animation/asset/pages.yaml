    # 8.5.3.2 Collisions between Moving Objects


    The method described allows us to adjust the velocity at a collision point. For
    static objects, the collision response, i.e., the new velocity of the point after
    collision, is computed as in Section 3.2. For two moving objects, though, the
    new velocity must be computed differently, and the change in velocity must affect
    both points. That is, we have two collision points, p on object A and q on object
    B, and we need to find the new velocity for each of those points.


    To account for collisions between objects, we will make use of Newton''s third
    law, which states that the collision forces for the two objects should be equal
    in opposite directions. Since the collision takes place in the same amount of
    time for both objects, this gives us a conservation of momentum. Momentum of an
    object, which is usually designated as P, is the product of the mass and the velocity:
    P = mv. Notice that for a constant mass object, force (ma) is the derivative of
    momentum, so if the two objects have an equal and opposite force applied during
    the very short period of collision, the result is that each has an equal and opposite
    change in momentum. Conservation of momentum states that the total momentum of
    the system must remain unchanged. The figure illustrates this. Two objects with
    masses m_p and m_q, and with velocities v_p, and v_q, before the collision, will
    have the sum of their momentum stays.


    For a spring object mass distributed at vertex particles, we need to compute the
    effective mass for the collision point so that, the collision point p on the first
    object will have an effective mass m_p and velocity v_p, and the collision point
    q on the second object will have an effective mass m_q and velocity v_q. Finding
    these m_p and m_q requires a barycentric combination of the masses. If the collision
    point has barycentric coordinates (u, v) where v = 1 - u for an edge, or (u, v,
    w) where w = 1 - u - v for a point on a triangular face, then we can compute the
    mass


    ![](img/b434947f68660f7e26f8700ff77023a5_196_0.png)


    ```

    m = \frac{um_1 + vm_2}{u^2 + v^2}, \quad \text{or} \quad m = \frac{um_1 + vm_2
    + wm_3}{u^2 + v^2 + w^2}

    ```


    where the m_i are the masses at the vertices. The denominator in these equations
    (which matches the denominator in the computation of \Delta v'', earlier) is needed
    to conserve momentum.'
