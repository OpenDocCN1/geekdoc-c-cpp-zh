    # 5.2.2 Vortices


    One of the most interesting velocity operators is the vortex operator. A physical
    vortex, like a tornado or the water draining in a sink, is a fluid phenomenon
    characterized by the fluid rotating around an axis, with angular velocity that
    is very high, at the physical limit, near the rotational axis but decreases with
    distance from the axis. The decrease with radial distance r from the axis is usually
    characterized by the scale factor 1/r^2. Figure 5.4 shows a vortex in action,
    with particles rendered in a flame-like style.'
