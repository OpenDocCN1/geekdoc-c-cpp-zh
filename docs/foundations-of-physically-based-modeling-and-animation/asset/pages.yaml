    The problem with these methods is that the derivatives are generally not known
    for times in the future. For our simple gravity example from Chapter 2, we always
    know the acceleration since it was constant. In general, though, the only thing
    we rely is the value of the derivative when given a specific state. For these
    reasons, we must look to other integration methods that provide ways of estimating
    these states in the future. We discuss some of the most common ones in the next
    sections.


    # VERLET AND LEAPROG INTEGRATION


    As mentioned above, for the problems we face, in order to calculate the acceleration
    at some future time we need to know the state at that time. However, many of the
    most straightforward integration techniques require us to know the acceleration
    at that time in compute the state at that time. This can lead to a chicken-and-egg
    situation, which we can only resolve by using different integration techniques.


    Verlet integration (and the similar leapfrog method) are one class of integration
    methods. These methods assume that the acceleration is determined by position
    (velocity). That is, we assume the forces are a function of position, ${\mathbf
    f}(x)$, and thus we can get the accelerations by dividing by the respective masses:
    $\mathbf{a}=\frac{1}{m}\mathbf{f}(x)$. Thus, a system of gravitational or spring
    forces works very well, incorporating aspects such as air resistance, damping,
    or velocity matching in flocking is problematic.


    The basic idea of Verlet integration is to try to compute the velocity separately
    from the position, and use the fact that accelerations are independent of velocity
    to be able to make accurate steps.


    # 2.2.1 Basic Verlet Integration


    For Verlet integration, we assume that position and velocity are treated differently
    in the computation, rather than treating the entire state as a whole. Basic Verlet
    integration describes only the position calculation. We will see below how we
    can also incorporate the velocity calculation.


    For Verlet integration, we assume that we know two values of the position, as
    well as the acceleration (we do not use velocity explicitly). That is, we assume
    we know $\mathbf{x}^{[i]}, \mathbf{x}^{[i+1]}$ and $\mathbf{a}^{[i+1]}$. Having
    two prior positions allows us to estimate the velocity $\mathbf{v} \approx \frac{\mathbf{x}^{[i+2]}-\mathbf{x}^{[i]}}{h}$.'
