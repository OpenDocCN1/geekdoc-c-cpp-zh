  md: '# Rigid Body Dynamics 193


    Voxelization: One method, which is a direct extension of the point-mass method,
    is to divide the object into small volumes (voxels), and then treat each of those
    volumes as a point mass. A typical way of doing this is to define a space encompassing
    the object, and place a regular 3D grid of points through that space. Each point
    can be classified as either inside or outside the object. In the 2D snowman example
    below, the gray cells are considered as inside since the center point of the cell
    is inside the snowman. The object is then approximated as a set of points, each
    with the same mass. This further simplifies the center of mass computation, so
    that if there are n points in the object


    ![](img/b434947f68660f7e26f8700ff77023a5_215_0.png)


    ```

    c = \sum_{n} x_i.

    ```


    There are a variety of ways of performing voxelization, and we will just describe
    one here. To classify points as inside or outside, a common approach that can
    be used is a ray-shooting test. shooting from a point, if the ray intersects the
    surface an odd number of times, while an even number of intersections implies
    that the starting point is outside. For voxelizing an object, though we can simplify
    our calculations considerably, since we know that all points lie on a regular
    grid. First, if we pick one plane, and shoot rays from outside the encompassing
    volume along each grid direction, we can classify points much more easily. First,
    by shooting in one of the primary directions, the process of intersecting with
    any polygon is simplified. Second, because several grid points lie along the ray
    we all points along the ray until the first surface is hit are outside, and at
    the same time, then all of the ray until the next surface is hit are inside, and
    so on. In the 2D snowman figure here, the four rays intersect the model several
    times, as marked with dots. By classifying the centers of the cells relative to
    these entry and exit points, we can classify all the voxels along one ray. These
    four rays are sufficient to classify all the voxels as inside or outside.


    ![](img/b434947f68660f7e26f8700ff77023a5_215_1.png)


    The voxelized approach is an approximation, but the smaller the voxels, the more
    accurate the approximation.


    Direct Calculation: There are other methods for calculating the center of mass
    more precisely. You can pick a point (any point will do, but typically the origin
    of the original coordinate system is used), and create tetrahedra where that point
    is, and the triangles on the surface are the bases. This construction is shown
    in the figure for a cylinder with hexagonal end caps. The bolded lines show how
    tetrahedra are defined for two of the faces and one of the top faces. To finish
    the construction, all of the


