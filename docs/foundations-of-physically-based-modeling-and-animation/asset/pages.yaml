  md: '# 118 Foundations of Physically Based Modeling and Animation


    We can understand how Verlet integration method is derived by considering how
    we represent acceleration if we only know positions. Assume for a moment that
    we know the positions x(t), and x(t+2h). We could estimate the velocity between
    the first two positions as v(t+0.5h), and between the two positions as v(t+1.5h).
    We could then estimate acceleration between those two values as


    This can be solved for the two timesteps:


    ```

    x(t+2h) = a(t)h^2+2x(t+h)-x(t).

    ```


    You might have already been familiar with this derivation, commonly called a second-order
    center. The key for Verlet integration is that it allows us to write the position
    at t+2h as a function of positions at t and t+h, and acceleration at t+h. This
    leads directly to the basic algorithm for Verlet integration:


    ```

    x^{[i+2]} = -x^{[i]}+2x^{[i+1]}+a^{[i+1]}h^2.

    ```


    This is derived from a second-order differentiation, and as a result, it is a
    second-order method.


    There are a few challenges in using this method of integration. First, like all
    Verlet methods, the acceleration is only calculated based on position. While we
    could use some velocity estimates in this acceleration calculation, doing so would
    only be approximate, and lose the theoretical higher-order guarantees that we
    otherwise have. Second, it is not sufficient to just starting conditions of x(0)
    and a(0). We have two positions to begin the process, so a variety of methods
    are used to estimate a second initial position, after which Verlet integration
    can run as normal. Another challenge is that velocity is not explicitly calculated
    in this method. We can estimate velocities using another, i.e. v(t+h)=(x(t+2h)-x(t))/2h.
    However, this causes the velocity at t+h to be computed only after the position
    at t+2h is computed. In many cases, it is too late to be useful. A better way
    of computing velocities is the Velocity Verlet method.


    # 7.2.2 Velocity Verlet Integration


    In most cases, we will want to know the velocity, also, so we will describe a
    version of Verlet Integration called Velocity Verlet. The Velocity Verlet method
    also has the advantage of incorporating velocity, we can simplify some of the
    equations.'
