  md: '# 232 ■ Foundations of Physically Based Modeling and Animation


    The derivative term adds a force proportional to the rate of change in the direction
    of the error vector, so that the controller''s total force is given by


    ```

    $$f_{pd} = -[k_p\mathbf{e} + k_d(\mathbf{e} \cdot \dot{\mathbf{e}})]$$

    ```


    Note, that $k_d$ is an adjustable gain (scale factor) on the error derivative.
    This formulation is identical to adding a damper to a spring of rest length 0,
    connecting the bead to the constraint path. Such a controller is called a proportional
    plus derivative or PD controller.


    In an implementation, for each object using a PD controller to enforce a constraint
    via the penalty method, the corresponding constraint force $f_{pd}$ would be added
    to the sum of forces acting on the object. This assumes that an error function
    $e(x)$ and its first derivative $\dot{\{e}}$ are known for each such object. If
    the function $\mathbf{e}$ is known analytically, it can be differentiated by the
    chain rule to obtain


    ```

    $$$\dot{\mathbf{e}} = \frac{\partial\mathbf{e}}{\partial x}\dot{x}$, or $\dot{\mathbf{e}}
    = \frac{\partial\mathbf{e}}{\partial x}v$$

    ```


    Often there is no analytic form for the error function. As long as we can compute
    $e$, we can use the error at the current timestep $n$, and the error at the previous
    timestep $n-1$ to approximate the rate of change at the current timestep:


    ```

    $$$\dot{e}^{[n]} \approx (e^{[n]} - e^{[n-1]})/h$$

    ```


    The figure shows the gray bead following a parabolic path, using a PD controller
    to maintain the constraint. The large swings and oscillations exhibited by the
    P controller have been eliminated. However, the constant offset from the path
    where the bead comes to rest is identical to the one obtained with a P controller,
    unless the derivative term can enforce the error is changing.


    ![](img/b434947f68660f7e26f8700ff77023a5_254_0.png)


    # 11.1.3 PID Control: Proportional + Integral + Derivative


    The rest state error problem with the P and PD controllers can be solved by adding
    an integral term, which exerts a force proportional to the integral of the error.
    Such a controller is called a proportional plus integral derivative or PID controller.
    The total force exerted by a PID controller is given by


    ```

    $$f_{pid} = -[k_p\mathbf{e} + k_d(\mathbf{e} \cdot \dot{\mathbf{e}}) + k_i \int_0^t
    \mathbf{e} dt]$$

    ```


    where $k_i$ is an adjustable gain on the error integral.


    In an implementation, for each object using a PID controller to enforce a constraint
    via the penalty method, the corresponding constraint force $f_{pid}$ would have'
