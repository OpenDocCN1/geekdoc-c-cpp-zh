    ```

    $$\begin{bmatrix} a & b & c \ d & e & f \ g & h & i \end{bmatrix}$

    ```


    Because $M$ has the same number of rows as columns, it is called a square matrix.
    Since the columns of a matrix, taken individually, are really vectors, they are
    called column vectors. Similarly, the rows of a matrix, taken individually, are
    called row vectors. The sequence of elements of a square matrix forming the diagonal
    from the upper left to the lower right corner is called the diagonal of the matrix.
    All other elements of the matrix are called the off diagonal elements. Our example
    $M$ has the diagonal $[a e i]$.


    The transpose of a matrix is constructed by exchanging its rows and columns. Thus,
    the transpose of an $m \times n$ matrix will be an $n \times m$ matrix. Returning
    to our example, the transpose of matrix $M$


    ```

    $M^T = \begin{bmatrix} a & d & g \ b & e & h \ c & f & i \end{bmatrix}$

    ```


    Note, that row vectors of the original matrix are now column vectors of the transpose.
    Likewise, the column vectors are now the row vectors of the transpose.


    We unify the notions of matrix if we consider a column vector of $n$ elements
    to be an $n \times n$ matrix. Similarly, a row vector of $n$ elements can be considered.
    If we think of a vector in this way, we can take its transpose, turning a column
    vector into a row vector. If $\mathbf{v} = \begin{bmatrix} v_x \ v_y \end{bmatrix}$
    then \n$\mathbf{v}^T = \begin{bmatrix} v_x & v_y \end{bmatrix}$.


    The determinant of a matrix is a scalar value, $|M|$. The determinant is defined
    for square matrices. For small matrices it is defined as follows:


    ```

    $2 \times 2: M = \begin{bmatrix} a & b \ c & d \end{bmatrix}, |M| = ad - bc$,

    ```


    ```

    $3 \times 3: M = \begin{bmatrix} a & b & c \ d & e & f \ g & h & i \end{bmatrix},
    |M| = aei + bfg - (ceg + bdi + afh)$.

    ```


    For larger matrices, the definition of the determinant becomes more complex, and
    the reader is referred to a more advanced text.


    Matrix multiplication is defined between matrices of compatible dimensions. An
    $a \times b$ matrix multiplied by a $b \times c$ matrix yields an $a \times c$
    matrix. For example, multiplying a $3 \times 3$ matrix by another $3 \times 3$
    matrix gives another $3 \times 3$ matrix, and multiplying a $2 \times 2$ matrix
    by a $2 \times 1$ vector yields another $2 \times 1$ vector.


    To understand matrix multiplication works, let us consider the multiplication
    of a matrix by a vector, $M\mathbf{v}$. One way to understand this operation is
    to'
