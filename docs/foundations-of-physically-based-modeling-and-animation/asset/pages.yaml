    with $k_p$ and $k_d$ are adjustable proportional and derivative constants. In
    practice, the amount of numerical drift will be quite small, so the solution will
    not be especially sensitive to the values of these constants.


    So, the system dynamics function for the pendulum first requires the computation
    of all external forces acting on the pendulum, in order to determine $\mathbf{f}_a$,
    then Equation 11.11 is used to compute the scale factor $\lambda$ to be applied
    in Equation 11.9 to compute the constraint force $\mathbf{f}_c$. Given $\mathbf{f}_a$
    and $\mathbf{f}_c$, Equation 11.5 is used to compute the total acceleration on
    the bob.


    # 11.2.2 Multiple Constraints


    Now that we have seen how dynamics works for a small problem, with only one constraint,
    we can generalize the approach to handle more complex systems with multiple constraints.
    We will use the figure to give us a concrete example, the equations we develop
    will be applicable to more general problems. Here we have three masses, attached
    together by two rods, with the joints at the middle mass free to rotate in all
    directions. This, the rod acts as distance constraints between the masses that
    they are connected.


    The three masses are at positions $\mathbf{x}_0$, $\mathbf{x}_1$, and $\mathbf{x}_2$,
    and the two distance constraints are $r_{01}$ and $r_{12}$. Now, we need to design
    two constraint functions. Following the pendulum example, this could be


    ```

    $c_0(\mathbf{x}_0, \mathbf{x}_1) = \frac{1}{2}[(\mathbfmathbf{x}_1-\mathbf{x}_0)^2
    - r_{01}^2]$\quad\text{and},

    ```


    ```

    $c_1(\mathbf{x}_1, \mathbf{x}_2) = \frac{1}{2}[(\mathbfmathbf{x}_2-\mathbf{x}_1)^2
    - r_{12}^2].

    ```


    In any problem like this, the constraints will be functions of the positions of
    the objects being constrained. We can then generalize by organizing the positions
    into a vector $\mathbf{X}$, and the constraints into a vector $\mathbf{C}(\mathbf{X})$.
    In this example,


    ```

    $$\mathbf{X} = \begin{bmatrix} \mathbf{x}_0 \ \mathbf{x}_1 \ \mathbf{x}_2 \end{bmatrix},

    ```


    ```

    $$\mathbf{C} = \begin{bmatrix} c_0(\mathbfmathbf{X}) \ c_1(\mathbfmathbf{X}) \end{bmatrix},$

    ```


    is


    ![](img/b434947f68660f7e26f8700ff77023a5_259_0.png)'
