  md: '# 84 Foundations of Physically Based Modeling and Animation


    state vector, and the velocity elements are grouped at the bottom. Thus, for n
    particles, the system state vector will have 2n elements, each of which is a 3D
    vector. This scheme has advantages for advanced applications, when it is desired
    to use different processing strategies for positions versus velocities. Written
    this way, the system state vector for n particles would be


    ```

    $$\mathbf{S} = \begin{bmatrix} X_0 \ X_1 \ \vdots \ X_{n-1} \mathbf{v}_0 \ \mathbf{v}_1
    \ \vdots \ \mathbf{v}_{n-1} \end{bmatrix}$.$. (6.6)$

