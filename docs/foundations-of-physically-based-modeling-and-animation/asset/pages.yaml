    = \frac{m}{d}$. So, to quickly bring the mass to a rest, either the mass $m$ must
    be decreased or the damping constant $d$ must be increased. Again, the time constant
    is a ratio, in this case dependent on both the mass and the damping strength of
    the strut.


    ![](img/b434947f68660f7e26f8700ff77023a5_173_0.png)


    # 8.1.1.3 Damperless Spring-Mass


    If we set the damping constant $d=0$, and arrange the equation to solve for the
    highest derivative, we have


    $$\ddot{x} = -\frac{k}{m}x.$


    ![](img/b434947f68660f7e26f8700ff77023a5_173_1.png)


    Note that this equation is of the same form as the equation for sinusoidal oscillation
    that we also saw in Section 7.5, with solution


    $x(t) = C\cos(\sqrt{k/m}t + \phi)$


    The amplitude $C$ and phase angle $\phi$ are determined by the initial position
    $x_0$ and velocity $v_0$ by the relationships


    $$\phi = -tan^{-1}(\frac{m\ v_0}{kx_0}),$ and


    $C = \sqrt{x_0^2 + \frac{m^2v_0^2}{k}}$


