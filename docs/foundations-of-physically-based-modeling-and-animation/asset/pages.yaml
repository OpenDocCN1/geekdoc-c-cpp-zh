    Now, let us define the spatial axis for a prismatic joint $i$


    ```

    $$\check{\mathbf{s}}_i = \left[ \begin{array}{c} \ 0 \ \tilde{\mathbf{u}}_i \end{array}
    \right]$

    ```


    and for a revolute joint as


    ```

    $$\check{\mathbf{s}}_i = \left[ \begin{array}{c} \ \tilde{\mathbf{u}}_i \ \ \tilde{\mathbf{d}}_i
    \end{array} \right]$

    ```


    We can also define what we will call the spatial Coriolis force^*$ for a prismatic
    joint $i$ as


    ```

    $$\check{\mathbf{c}}_i = \left[ \begin{array}{c} \ \boldsymbol{\omega}_{i-1} \times
    (\boldsymbol{\omega}_{i-1} \times \mathbf{r}_i) + 2\boldsymbol{\omega}_{i-1} \times
    \tilde{\mathbf{q}}_i \end{array} \right]$

    ```


    and for a revolute joint as


    ```

    $$\check{\mathbf{c}}_i = \left[ \begin{array}{c} \ \boldsymbol{\omega}_{i-1} \times
    \tilde{\mathbf{u}}_i + 2\boldsymbol{\omega}_{i-1} \times (\tilde{\mathbf{q}}_i
    \times \tilde{\mathbf{d}}_i) + \tilde{\mathbf{q}}_i \times (\tilde{\mathbf{q}}_i
    \times \tilde{\mathbf{d}}_i) \end{array} \right]$

    ```


    With these definitions, the reader can verify that using spatial notation, for
    either prismatic or revolute joints, the spatial Coriolis force can be written
    in the form


    ```

    $$\check{\mathbf{c}}_i = \tilde{\mathbf{v}}_i \times \tilde{\mathbf{q}}_i, (12.7)$

    ```


    > *Note that term includes both Coriolis and centripetal forces. The centripetal
    force is the constraint force required to keep the joint length constant. The
    Coriolis force is a virtual force that is required to correct motion in a rotating
    coordinate frame, due to the fact that points in the frame are moving faster away
    from the origin near the origin.'
