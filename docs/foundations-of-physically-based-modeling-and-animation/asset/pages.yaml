    Our collision determination process will have located the point of collision.
    We need to calculate the velocity for this point in order to compute the collision
    response. If the point is on an edge, we interpolate the velocity of the two vertices
    at the edge. A linear interpolation is sufficient, Likewise, if the collision
    point is on a face, we can use a weight based on the barycentric coordinates of
    the collision point relative to the vertices of the face. Either way we will compute
    the velocity of the nominal collision point and we can compute a response for
    this point in the same way we did for particles. Note that the collision response
    calculation requires a normal. For a face-vertex collision, the face normal can
    be used. For an edge-edge collision, the direction $\hat{n}$ is taken from the
    cross-product of the two edges, as demonstrated in the previous section.


    Once we know what the new velocity of the collision point should be, we need to
    adjust the velocities of the mesh vertices. One way is to set the velocities of
    all the vertices on the edge or to the new velocity. However, this will create
    unrealistic responses, points far away from the collision change velocity more
    than is reasonable. We want vertices closer to the collision point to receive
    more velocity change than those farther away. To do this we will use the barycentric
    weighting scheme. To illustrate, assume that the collision point $\mathbf{p}$
    is on an edge between points $\mathbf{p}_1$ and $\mathbf{p}_2$, so that $\mathbf{p}
    = u\mathbf{p}_1 + v\mathbf{p}_2$, with $v = 1 - u$. If the velocities of before
    and after collision are $\mathbf{v} = \mathbf{v}^-$, then we need to find a new
    velocity change $\Delta\mathbf{v}''$ that we can apply to $\mathbf{p}_1$ and $\mathbf{p}_2$,
    so that $\mathbf{v}_1^+ = \mathbf{v}_1^- + u\Delta\mathbf{v}''$ and $\mathbf{v}_2^+
    = \mathbf{v}_2^- + v\Delta\mathbf{v}''$. All of this must result in a change of
    $\Delta\mathbf{v}$ in point $\mathbf{p}$, is given by


    ```

    $\Delta\mathbf{v} = u\Delta\mathbf{v}_1 + v\Delta\mathbf{v}_2$,$

    $\Delta\mathbf{v} = u(u\Delta\mathbf{v}'') + v(v\Delta\mathbf{v}'')$

    ```


    so that


    ```

    $\Delta\mathbf{v}'' = \frac{\Delta\mathbf{v}}{u^2 + v^2}$

    ```


    Likewise, if the collision point was on a triangular face, where $\mathbf{p} =
    u\mathbf{p}_1 + v\mathbf{p}_2 + w\mathbf{p}_3$ and $w = 1 - u - v$, we would use
    a value


    ```

    $\Delta\mathbf{v}'' = \frac{\Delta\mathbf{v}}{u^2 + v^2 + w^2}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_195_0.png)


    and adjust the velocities by $u\Delta\mathbf{v}''$, and $w\Delta\mathbf{v}''$.'
