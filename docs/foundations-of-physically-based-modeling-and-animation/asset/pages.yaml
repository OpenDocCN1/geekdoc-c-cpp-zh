    and if it is zero, it lies directly on the barrier. For now, let us assume that
    $y > b$, so the sign is positive, and the rate of change of $y$ is negative, so
    that the ball is moving toward the barrier. As we take each timestep, we can examine
    the sign of $y-b$. As long as the sign remains positive, there is no collision.
    When the sign becomes negative it means that during the last timestep we moved
    from one side of the barrier to the other, and thus a collision occurred. In the
    figure showing the position of the ball at several timesteps, we see it collided
    with the barrier during the third timestep. In this case, we say that we have
    detected a collision, and the collision determination step will be used to determine
    exactly when and where the collision occurred.


    Let us extend to a 3D example, where we have an arbitrary plane serving as the
    barrier. Chances that you first learned the plane equation as something like $Ax+By+Cz+D=0$.
    When you plug a point $\mathbf{x}=(x, y, z)$ into the left side of this equation,
    if the value is 0 then the point lies on the plane. Otherwise, the sign of the
    value will determine which side of the plane it lies on. However, it is more useful
    in collision detection and representation to represent the plane another using
    a plane normal vector, and a point $\mathbf{p}=(p_x, p_y, p_z)$ that lies on the
    plane. The plane normal vector $\mathbf{\hat{n}}=(n_x, n_y, n_z)^T$ is a direction
    vector perpendicular to the plane and pointing away from the positive side of
    the plane. These can be used to construct a form of the plane equation as $n_xx+n_yy+n_zz-\mathbf{\hat{n}}\cdot\mathbf{p}=0$,
    or more compactly


    $(\mathbf{x}-\mathbf{p}) \cdot \mathbf{\hat{n}}=0$.


    ![](img/b434947f68660f7e26f8700ff77023a5_45_0.png)


    The figure illustrates this graphically. Here $\mathbf{x}$ represents an arbitrary
    position in space that is to be tested. The difference $(\mathbf{x}-\mathbf{p})$
    gives a vector from the given point on the plane to the test point. The dot product
    of this vector with the plane normal $\mathbf{\hat{n}}$ gives the length of its
    projection in the direction,


    $d=(\mathbf{x}-\mathbf{p}) \cdot \mathbf{\hat{n}}.$ $(3.1)$


    Thus, the magnitude of $d$ is the distance of the point $\mathbf{x}$ away from
    the plane, and the sign of $d$ is positive above the plane, zero on the plane,
    and negative below the plane. Our collision check for an arbitrary plane, then,
    becomes a matter of calculating $d$ at each timestep, and determining whether
    the sign of $d$ has changed since the previous timestep.


    Now that we want to detect the collision of the center of the ball with an arbitrary
    plane, we can extend our approach to handle a ball of non-zero radius $r$ and
    determine the collision of the surface of the ball with the plane. Notice that
