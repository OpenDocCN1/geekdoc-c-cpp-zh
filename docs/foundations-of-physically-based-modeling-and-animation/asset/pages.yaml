  md: '# Finite Difference Algorithms ■ 315


    This is called the full slip condition—corresponding to no friction between the
    wall and the fluid. On the other hand, if $u''_1 = -u_1$, the boundary''s horizontal
    velocity will be 0. This is called the no slip condition—corresponding to high
    friction. We can assign a parameter $0 \leq \mu \leq 1$, analogs to the coefficient
    of friction introduced in Section 3.2.2. If $\mu = 0$ corresponds to the full-slip
    condition, and $\mu = 1$ corresponds to the no-slip condition, the phantom horizontal
    or vertical velocity in the boundary adjacent to cell $i$ will be given by


    ```

    $u''_i = (1-2\mu)u_i, \text{ or } v''_i = (1-2\mu)v_i.$

    ```


    Unlike the pressure calculation, we will also need to compute the fluid velocity
    in each surface cell on left or bottom boundary shared with a full cell or another
    surface cell. Therefore, we will need to include equations to compute $u_7$, and
    $u_8$, also $v_6, v_7$, and $v_8$. So, the horizontal velocity vector will be
    of the form


    ```

    $$\mathbf{u} = [u_1 \ u_2 \ u_4 \ u_5 \ u_7 \ u_8]^T$,

    ```


    and the vertical velocity vector will be of the form


    ```

    $$\mathbf{v} = [v_3 \ v_4 \ v_5 \ v_6 \ v_7 \ v_8]^T$,

    ```


