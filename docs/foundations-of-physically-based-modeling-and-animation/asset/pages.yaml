- img_proc: true
  md: '# Foundations of Physically Based Modeling and Animation


    Our goal in integration is to go from the current time $t$ to some time in the
    future, $t+h$. In other words, we know $s(t)$, we need to find $s(t+h)$. What
    we would like to compute


    ```

    $$s(t+h) = s(t) + \int_{t}^{t+h} \dot{s}(\tau)d\tau$

    = s(t) + \int_{t}^{t+h} f(s, \tau)d\tau.$

    ```


    Although we know $s(t)$, unfortunately we do not have an analytic form for $f(s,
    \tau)$; rather we have just some way of evaluating it for a particular $s$. So,
    we are faced with having to approximate the integral. The numerical integration
    techniques we use are all ways of approximating this integral.


    To understand the nature of this approximation, we need to introduce the notion
    of Taylor series. A Taylor series is an expansion of a function $f(x)$ around
    a particular value $x=a$, written


    ```

    $$f(x) = \sum_{n=0}^{\infty} \frac{f^{(n)}(a)}{n!}(x-a)^n,$ or alternatively

    $f(x+\Delta) = \sum_{n=0}^{\infty} \frac{f^{(n)}(x)}{n!}\Delta x^n.$

    ```


    where $f^{(n)}$ refers to the $n$th derivative of $f$. Expanding the sum, we have


    ```

    $$f(x+\Delta) = f(x) + f''(x)\Delta x + \frac{1}{2}f''''(x)\Delta x^2 + \frac{1}{6}f''''''(x)\Delta
    x^3 + \dots.$

    ```


    This expansion holds if all of the infinite derivatives of $f$ exist in the neighborhood
    of the particular value of $x$ for which we are evaluating the series. This means
    it is required that the function be locally smooth, with no discontinuities in
    any derivative. If we let $f=s, x=t$, and $\Delta=h$, we can use a Taylor expansion
    to write


    ```

    $$s(t+h) = s(t) + \dot{s}(t)h + \frac{1}{2}\ddot{s}(t)h^2 + \dots,$ (7.2)$

    ```


    which gives how the state advances with one timestep $h$.


    For practical situation, we cannot use the infinite terms in the Taylor series,
    so our integration methods are essentially ways of approximating truncated forms
    of the series. The more robust integration methods are usually the ones approximating
    a larger number of terms. The Euler integration that we have used to this point
    takes just the first terms: $s(t+h) \approx s(t)+\dot{s}(t)h$. This means that
    all the later terms in the Taylor series are ignored, and thus that this method
    has some error.


    If we assume that $h$ is a very small number, then the later terms of this expansion
    will tend to get smaller and smaller as the factorial denominator will grow, the
    $h^n$ factor will get smaller and smaller, and in physical systems'
