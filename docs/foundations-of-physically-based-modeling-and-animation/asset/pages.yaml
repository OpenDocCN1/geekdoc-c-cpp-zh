  md: '# Particle Choreography


    IN BUILDING A PARTICLE SYSTEM simulation the primary intent is always to create
    an interesting visual effect, treating the system as a whole to achieve coordinated
    bulk motion. To do this, we will need to think like animators, as well as engineers,
    since our desired goal goes beyond the technical problems of creating, simulating,
    and rendering particles. We also need to be able to choreography the particles
    to create the motion we want. Figure 5.1 shows a frame from a highly choreographed
    sequence, where the particles are always under the control of the animator.


    In his seminal paper Particle Animation and Rendering Using Data Parallel Computation,
    Sims [1990] laid the foundations of high-performance particle simulation in a
    parallel computing environment, but the main emphasis of his paper is on the aesthetics
    of a particle simulation—he has a lot to say about choreography. A key idea that
    he introduced, informing work with particles to this day, is that we can think
    of the choreography of particles in terms of a set of operators affecting their
    motion. These fall into the categories of initialization operators, acceleration
    operators, and velocity operators. And, he adds to the theory of bounce, i.e.,
    particle collision resonance.


    In Chapter 4, we covered the mechanics of creating and running a particle system,
    including initialization and bounce. In this chapter, we focus on the aspects
    of the choreography of particles involving the use of acceleration and velocity
    operators. We also look at methods for steering particles around objects to avoid
    collisions, and for creating wind fields.


    # 5.1 ACCELERATION OPERATORS


    An acceleration operator implements a choreography method that causes a change
    in the particle''s velocity. Velocity changes can be created by summing forces,
    when divided by mass acceleration, together with directly applied accelerations
    to yield a net acceleration. We will call the additive acceleration operators
    a⁺. These include the gravitational acceleration and air-resistance forces we
    studied in Chapter 3. Another possibility is to apply an operator to modify the
    velocity'
