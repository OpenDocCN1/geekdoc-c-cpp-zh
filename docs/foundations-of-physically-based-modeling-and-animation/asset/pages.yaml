    $$\mathbf{r}_{ai} = \begin{cases} \mathbf{x}_{ai} - (\mathbf{x}_a + \mathbf{\hat{L}})
    & \text{if } l_{ai} > L, \ \mathbf{r}_{ai} & \text{if } 0 \le l_{ai} \le L, \
