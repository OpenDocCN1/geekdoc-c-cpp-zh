  md: '# Particle Choreography 73


    We can create a vortex effect in our particle system using a velocity operator.
    If we attempted to create a vortex effect using an acceleration operator, the
    moment caused by the high angular velocity near the axis would cause the particles
    to be flung out of the vortex, rather than captured by it. By using a velocity
    operator, we can avoid this problem.


    A vortex operator is specified by a cylindrical region with base center $x_i$,
    axis oriented along the direction $\hat{v}$, length $L$, and radius $R$, as indicated
    in the figure to the right. We can think of this as the vortex volume. A particle
    $i$, with position $x_i$, inside this volume is affected by the vortex, but if
    it is outside it is unaffected. The vector from the vortex base center to particle
    $i$ is


    ![](img/b434947f68660f7e26f8700ff77023a5_95_0.png)


    ```

    $x_{vi} = \mathbf{x}_i - \mathbf{x}_v$.

    ```


    The length of the projection of this vector onto the vortex'' direction is


    ```

    $l_i = \hat{\mathbf{v}} \cdot \mathbf{x}_{vi}$.

    ```


    $0 \leq l_i \leq L$ then particle $i$ lies within the vortex'' axial extent, otherwise
    it does not. The orthogonal vector from the axis to particle $i$ is


    ```

    $\mathbf{r}_i = \mathbf{x}_{vi} - l_i\hat{\mathbf{v}}$,

    ```


    so the distance from the particle to the axis is


    ```

    $r_i = ||\mathbf{r}_i||$.

    ```


    $r_i > R$ then particle $i$ lies outside of the vortex''s radial extent, otherwise
    it is inside the vortex. Now, let $f_R$ be the rotational frequency of the vortex
    at radius $R$, measured in cycles per second (Hz). The rotational frequency at
    the particle''s distance $r_i$ is then


    ```

    $f_i = (\frac{R}{r_i})\tau f_R$.

    ```


    The exponent $\tau$ be thought of as a ''tightness'' parameter that governs quickly
    the vortex decays from its axis. For a physical vortex $\tau = 2$. To avoid numerical
    problems near the axis, we can apply a frequency limit $f_{max}$, giving $f_i
    = \min(f_{max}, (\frac{R}{r_i})\tau f_R)$. Now we need to rotate the particle''s
    velocity vector through an angle that will achieve the rotational frequency $f_i$.
    If we set the particle''s angular velocity to


    ```

    $\omega = 2\pi f_i$,

    ```


    then the actual rotation achieved in one timestep will be $\omega h$, or exactly
    $2\pi f_i$ radians in 1 second of simulation time.'
