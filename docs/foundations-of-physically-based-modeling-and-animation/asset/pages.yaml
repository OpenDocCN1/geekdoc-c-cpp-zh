    # 4.4.5 Efficient Random Numbers


    A final efficiency issue is with the use of random numbers within a particle simulation.
    Random number generators utilize relatively slow numerical processes. In addition,
    the initialization step in the activation of every particle typically requires
    the generation of at least four random numbers to randomize position and velocity,
    and often requires many more to randomize particle parameters. Therefore, the
    time spent in generating random numbers is a real efficiency consideration when
    the particle generation rate is high.


    The simplest way to reduce the time cost of generating random numbers during a
    particle simulation, is to generate a large array of random numbers at the start
    of the simulation, and then time a random number is simply index into the array
    to get the next, incrementing the index at each fetch. When the end of the array
    is reached, the index is reset to 0. It may be convenient to create two such arrays,
    U and G, with the first generated with the uniform random number generator U(0,1),
    and the latter with the Gaussian random number generator G(0,1). Then, when a
    uniform random number u between $u_{min}$ and $u_{max}$ is required, the uniform
    array is indexed and the retrieved value is scaled and translated as follows:


    ```

    $u = (u_{max} - u_{min})U[i] + u_{min}-$.

    ```


    A normally distributed random number $g$ with mean $\mu$ and standard deviation
    $\sigma$ is required, the Gaussian array is indexed and the retrieved value is
    scaled and translated as follows:


    ```

    $g = \sigma G[j] + \mu$.

