    To account for high tensile strength of cloth, the tensile springs should have
    a high spring constant, and would typically be nonlinear. Instead of the spring’s
    force being proportional to the difference between its actual length and its rest
    length, it can be made proportional to a power of this length difference. Making
    the force cubic convenient, since it preserves the sign of the force. The bending
    springs should be at least two orders of magnitude weaker than the tensile springs,
    so that they have negligible effect when stretched in the tensile direction but
    will still provide some force to prevent bending when the three particles that
    it extend out of line with each other, as indicated in the diagram above. The
    shear springs should be of intermediate strength, at least one of magnitude weaker
    than the tensile springs.


    Since the tensile springs in a woven cloth model must be made stiff, and thus
    have very small time constants, an explicit integration scheme will need to keep
    the tensile springs stable. Since the bending and shearing times are orders of
    magnitude larger, this is especially inefficient. For this reason, it is widely
    recommended to use implicit integration for computing a cloth model, so that large
    timesteps can be taken without resulting in instability. Although this solves
    the instability problem, it also introduces a large amount of numerical damping,
    which may be undesirable for animators, because it tends to reduce the responsiveness
    of the cloth, giving it a heavy look. Other approaches to dealing with instability,
    due to high tensile spring strengths, have been to reduce the tensile spring stretching
    to a small percentage of the rest length [Prov, 1995; Ozgen et al., Kallmann,
    1996; Goldenthal et al., 2007], or to run the simulation using different timesteps
    for the tensile, shear, and bending components [Müller, 2008].


    # 8.8 SUMMARY


    The primary points to remember from this chapter were:


    +   - The spring-mass-damper system provides a flexible means to define behavior
    between pairs of points.


    +   - Spring-mass-damper systems act as a combination of an oscillating behavior
    and an exponential damping function.'
