    this solution is no longer valid, because the term within the square root, $1-\zeta^2$,
    is negative. The solution in this case is in the form of a damped exponential.
    This reflects the fact that when the damping factor becomes large, motion is damped
    out before any oscillation takes place. When $\zeta=0$ the system is called *undamped*,
    when $0<\zeta<1$ it is called *underdamped*, when $\zeta=1$ it is called *critically
    damped*, and when $\zeta>1$ it is called *overdamped*.


    # 8.2 SPRING MESHES


    We construct a spring mesh by replacing the edges of a polygonal model by a spring-mass-damper
    system that produces forces to keep the edges at their original lengths, allowing
    them to compress and elongate in response to outside forces. This is the basic
    idea of a spring-mesh model, but we will see that additional supports will be
    needed to maintain the stability of the model''s shape. We begin by modeling the
    edges and then progress to addressing the structural stability problem.'
