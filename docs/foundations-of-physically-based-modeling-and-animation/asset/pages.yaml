    Throughout this book, a dot notation is used as a shorthand to indicate time derivatives.
    One over a variable indicates the first time derivative, and two dots indicates
    the second time derivative. Consequently, we would commonly write the derivative
    expressions relating position, velocity, and acceleration as


    ```

    $\mathbf{v} = \dot{\mathbf{x}}, \mathbf{a} = \dot{\mathbf{v}}, \mathbf{a} = \ddot{\mathbf{x}}$

    ```


    Integration is the opposite of differentiation, in an integral describes small
    changes accumulate over time, resulting in a total change. Mathematically speaking,
    integration is the inverse of the differentiation operation. Looked at in this
    way, if we begin with acceleration, we can integrate to find the velocity, and
    then integrate velocity to find the position. This is one of the key ideas in
    numerical simulation of physical systems—we start with accelerations, integrate
    these to find velocities, and integrate these to find positions.


    Expressed mathematically, velocity is the time integral of acceleration,


    ```

    $\mathbf{v} = \int \mathbf{a} \ dt$

    ```


    and position is the time integral of velocity,


    ```

    $\mathbf{x} = \int \mathbf{v} \ dt$

    ```


    In a calculus course, you will have learned how to compute these integrals in
    a closed algebraic form if the expressions for **a** and **v** are simple. However,
    in the complex dynamic problems that we will encounter in simulation for animation,
    it will almost never be the case that we can solve these integrals using the principles
    of calculus. Instead, what we will do is to compute these integrals approximately,
    using numerical integration techniques. The approach we will be to begin with
    a known position and velocity at a certain point in time, use these to compute
    the acceleration, and then numerically to advance a short interval forward in
    time, giving a new position and velocity. This process is repeated in a loop,
    advancing from the start time to a desired ending time in a series of timesteps.


    To illustrate the process, let us look at the case when the acceleration **a**
    is constant. In this very simple case, we can actually find a closed algebraic
    solution to the problem, since the integration process is straightforward. We
    will assume that the initial position is $x_0$ and initial velocity is $v_0$.
    Then, integrating


    ```

    $\mathbf{v} = \int \mathbf{a} \ dt$

    ```'
