  md: '# 238 ■ Foundations of Physically Based Modeling and Animation


    In order to maintain a constraint that is already being met, we need to hold the
    first and second derivatives of the constraint vector to be **0**. The first second
    derivative is


    ```

    $$\dot{\mathbf{C}} = \frac{\partial\mathbf{C}}{\partial\mathbf{X}}\frac{d\mathbf{X}}{dt}$

    ```


    ```

    $$\dot{\mathbf{C}} = \mathbf{JX},$$

    ```


    where **J** is the Jacobian matrix of **C**, as defined in Section 7.7.2. In our
    three mass—two constraint example,


    ```

    $$\mathbf{J} = \begin{bmatrix} \frac{\partial c_0}{\partial x_0} & \frac{\partial
    c_0}{\partial x_1} & \frac{\partial c_0}{\partial x_2} \ \frac{\partial c_1}{\partial
    x_0} & \frac{\partial c_1}{\partial x_1} & \frac{\partial c_1}{\partial x_2} \
    \\frac{\partial c_2}{\partial x_0} & \frac{\partial c_2}{\partial x_1} & \frac{\partial
    c_2}{\partial x_2} \end{bmatrix},$$

    ```


    and


    ```

    $$\dot{\mathbf{X}} = \begin{bmatrix} \dot{x}_0 \ \dot{x}_1 \ \dot{x}_2 \end{bmatrix}.$$

    ```


    However, each of the terms in the Jacobian matrix is its row vector of three elements.
    For example,


    ```

    $$\frac{\partial c_0}{\partial \mathbf{x}_0} = \begin{bmatrix} \frac{\partial
    c_0}{\partial x_0} \ \frac{\partial c_0}{\partial y_0} \ \frac{\partial c_0}{\partial
    z_0} \end{bmatrix},$$

    ```


    and each of the elements of the vector $\dot{\mathbf{X}}$ is a three-element column
    vector. For example,


    ```

    $$\ddot{\mathbf{X}} = \begin{bmatrix} \ddot{x}_0 \ \ddot{y}_0 \ \ddot{z}_0 \end{bmatrix}.$$

    ```


    Therefore, if we think of **J** as a matrix of scalars and $\ddot{\mathbf{X}}$
    as a vector of scalars, **J** is $m \times 3$ and $\ddot{\mathbf{X}}$ is $3 \times
    1$. The vectors **C** and its time derivatives are $m \times 1$ vectors of scalars.


    Differentiating $\dot{\mathbf{C}}$ to obtain the second derivative of **\mathbf{C}**,
    gives us


    ```

    $$\ddot{\mathbf{C}} = \mathbf{J}\ddot{\mathbf{X}} + \dot{\mathbf{J}}\dot{\mathbf{X}}.$

    ```


    If we define a vector of $n$ applied forces **F$_a$** and a vector of constraint
    forces **F$_c$**, we can write Newton''s second law for the constrained dynamics
    problem


    ```

    $$\mathbf{M}\ddot{\mathbf{X}} = \mathbf{F}_a + \mathbf{F}_c,$$

    ```


    where **M** is a $3n \times 3n$ diagonal matrix, known as the **matricized mass**.
    This matrix is 0 except for its diagonal elements, which are each of the masses,
    repeated three times.'
