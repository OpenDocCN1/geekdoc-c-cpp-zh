  md: '+   * When creating a spring-mass-damper system, choosing good parameters is
    critical to getting the desired behavior. It is usually the *ratios* between the
    mass, spring constant, and damping coefficient that govern the behavior.


    +   * Springs can be assembled between point masses to form 3D structures, with
    springs representing both external and internal edges.


    +   * Sets of springs can be used to define the faces for a 3D object. Forces
    and collision response impulses can be applied to the edges or faces of the object,
    and these can be propagated to the point masses.


    +   * Torsional springs can be used to maintain the angle between faces of an
    object, applying a torque to each face to maintain a given angle.


    +   * Spring-mass-damper systems serve as the foundation for many different simulation-based
    computations. These include lattice deformers and simulations of cloth behavior.'
