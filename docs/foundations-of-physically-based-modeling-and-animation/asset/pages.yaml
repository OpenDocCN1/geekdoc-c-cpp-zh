    Matrix representation for implicit integration of diffusion term: Equation 15.2,
    which is the implicit integration of $w_2$ to determine $w_3$, also must be put
    into matrix form. This equation must actually be solved once for the 2D velocity
    components $u$ and $v$, three times for a 3D problem to determine the $w$ component.
    Looking only at the $u$ component of the $w_2$ and $w_3$ velocity fields, we form
    the vectors $u_2$ and $u_3$, and rewrite Equation 15.2 as


    ```

    $$(I - hv\nabla^2)u_3 = \mathbf{u}_2.$$

    ```


    We can use an analysis to compare the one used for computing the Laplacian of
    $\phi$ to rewrite the following equation for cell 4:


    ```

    $$u_{34}-\frac{hv}{\Delta x^2}(u_{31} + u_{33} - 4u_{34} + u_{35} + u_{37}) =
    u_{24}.$$

    ```


    This can be rearranged to simplify the matrix elements by multiplying through
    by $\frac{\Delta x^2}{hv}$ to obtain


    ```

    $$u_{31} - u_{33} + (4 + \frac{\Delta x^2}{hv})u_{34} - u_{35} - u_{37} = u_{24}.$$

    ```


    Following a similar system used to construct the matrix for the Poisson equation,
    and letting $K = 4 + \frac{\Delta x^2}{hv}$, we have the implicit integration
    for the diffusion step:


    $$\begin{array}{c|c|c|c|c|c|c|c|c|c} \hline K & -1 & -1 & 0 & 0 & -1 & 0 & 0 &
    0 & u_{20} \ \hline -1 & K & -1 & 0 & 0 & -1 & 0 & 0 & 0 & u_{21} \ \hline -1
    & -1 & K & -1 & 0 & -1 & 0 & 0 & 0 & u_{22} \ \hline -1 & 0 & -1 & K & -1 & -1
    & 0 & 0 & 0 & u_{23} \ \hline 0 & 0 & 0 & -1 & \frac{\Delta x^2}{hv} & -1 & 0
    & 0 & u_{24} \ \hline 0 & 0 & -1 & 0 & -1 & K & -1 & 0 & 0 & u_{25} \ \hline 0
    & -1 & 0 & 0 & 0 & -1 & K & -1 & 0 & u_{26} \ \hline 0 & 0 & 0 & 0 & -1 & 0 &
    -1 & K & -1 & u_{27} \ \hline \end{array}$


    A similar equation can be used to integrate the $v$ component of velocity.

    For this 2D problem, the equations are small enough to solve by matrix inversion,
    but for much larger 3D problems encountered in fluid simulation for animation
    it is useful to take advantage of the sparsity of the matrices and solve the problem
    using an iterative solution technique like the $\mathtt{biconjugate} \mathtt{gradient}$
    method. These methods are available in most numerical linear algebra systems like
    $\mathtt{Eigen}$ [Inria, 2015], and are explained fully in Numerical Recipes [Press
    et al., 2007].


    In order to produce an interesting smoke simulation it will be necessary to introduce
    some external forces to perturb the flow. This is usually done through the external
    force term in the Navier-Stokes equations, which can be used to provide forces
    for user interaction, or from a procedural generator.'
