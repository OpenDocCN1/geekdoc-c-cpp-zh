    # 2.2.3 Air Resistance and Wind


    Since a springy mesh will be considered to have a surface made of polygons, adding
    air resistance and wind forces is no longer simple as it was in the case of particles.
    Air resistance must now be considered to be acting across each polygonal face,
    rather than just on the particles making up the vertices of the polygons. Consider
    a flag made from a springy mesh. If wind forces act only on the vertex particles,
    the wind will push the particles in the direction of the wind, but will not cause
    the flapping behavior typical of flags. The flag will simply try to stretch to
    a little wing. The lift and drag on a polygon will vary with its orientation to
    the wind, producing forces that have a component orthogonal to the wind direction,
    causing the flag to exhibit the nice flapping motion that is illustrated in Figure
    8.3.


    If we assume that all polygons are triangles, the figure to the right shows how
    lift force $f_l$ and drag force $f_d$ are related to the relative velocity $v_r$
    of the center of the triangle through the air. If $w$ is the local wind velocity
    vector, and $v$ is the triangle''s velocity, $v_r = v - w$, i.e., the velocity
    with which the triangle is pushing through the local air mass. For nearly equilateral
    triangles, the triangle''s velocity at its center is well approximated by simply
    taking


