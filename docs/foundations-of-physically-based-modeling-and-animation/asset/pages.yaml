  md: '# 70 Foundations of Physically Based Modeling and Animation


    # 5.1.3 Drag and Undrag


    Additive acceleration operators do not have to be position based. In the bouncing
    ball problem of Chapter 3 we looked at the effect of air resistance and wind on
    the ball. The same sort of effect can be used as an acceleration operator for
    particles. We will call these operators "drag" operators. Letting $v_i$ be the
    velocity of particle $i$, $m_i$ its mass, and $\mathbf{w}$ a constant velocity
    vector, the simplest drag operator would be


    ```

    $a_{w i}^{op} = \frac{D}{m_i}(\mathbf{w} - v_i)$

    ```


    where $D$ is a drag "strength" constant that is adjustable by the animator to
    produce the desired effect.

    By changing the sign of $D$, we create "undrag”—that is, a force tending to increase
    the speed of the particle. As long as "undrag" is applied, the particle will increase
    in speed, so this acceleration operator is typically applied for a short period
    of time, or until the particle achieves a desired velocity. In this way, it is
    a good way to smoothly increase a particle''s speed.


    # 5.1.4 Velocity Limiters


    Often we want to assure that a particle maintains at least a minimum speed, or
    that it is limited to some minimum speed. Sims presents a method to ensure a particle''s
    speed rises to a minimum speed, $V_t$, and remains above that speed. This operator
    is applied after numerical integration, so it is not an additive acceleration,
    but operates on the new and previous velocities to produce an updated velocity:


    ```

    $A^{op}(v_i^{[n+1]}, v_i^{[n]}) = \max(v_i^{[n+1]}, \min(v_i^{[n]}, V_i^{[n]}))$;

    ```


    In this operator, the max and min functions select the vector with the larger
    or smallest magnitude from their two-vector arguments. As long as a particle''s
    new speed $\|v_i^{[n-1]}\|$ is below $V_t$, the new velocity will be selected
    unchanged, since the second parameter''s magnitude can never exceed $V_t$. Likewise,
    if the new speed is above the previous speed $\|v^{[n]}\||$, the new velocity
    will be selected. Otherwise, the speed will be set to $V_t$ with the same direction
    as the previous velocity if it is greater than the previous velocity or if it
    is less than $V_t$. A similar approach can be used to assure that a particle never
    exceeds a given maximum speed.


    # 5.2 VELOCITY OPERATORS


    In contrast to the acceleration operators, velocity operators work outside of
    physical law, providing velocity updates for a timestep, without changing the
    momentum of a particle. The effect is to reposition the particle, as if there
    were a velocity, but the velocity itself is not modified. In this way, both acceleration
    operators and velocity operators can act on the same particle without any interference.'
