    Although the final equation looks quite similar to that of the point attractor,
    the effect will be different. As long as the particle is within the line segment''s
    extent, there will be no acceleration parallel to the line, so any motion of the
    particle in the parallel direction will be unaffected by it. If the particle would
    normally go into an elliptical orbit about a point, it will go into an elliptical
    spiral around the line segment. If we ignore the effect of the line attractor
    for particles beyond the line''s extent, the particle will spiral around the line
    and then get thrown out when it moves beyond the end of the attractor.


    # 5.1.2 Random Accelerations


    A way to introduce motion to particles is to apply additive accelerations that
    act randomly, like snowflakes falling to subtle breezes, or atoms undergoing Brownian
    motion.


    To achieve this type of motion, the random vector generator $S()$ from Section
    4.2 can be scaled by a scale factor $S_i$ and used to produce a small perturbation
    in particle $i$''s velocity at each timestep. This has the problem that the magnitude
    of the perturbation will be scaled by the timestep during integration, and the
    rate at which perturbations occur will be governed by the timestep of simulation.
    To produce random perturbations that occur independently of the time step, $S_i$
    can be scaled by the timestep


    ```

    $$\mathbf{a}_{ai}^{op} = \frac{S_i}{h} \mathbf{S}(()$.$

    ```


    and random perturbations can be issued on a schedule independent of timestep.
    For example, we might want one random acceleration per frame of animation, so
    if the animation proceeds at 30 frames per second, we would only create a random
    acceleration when the time passes an integer multiple of 1/30 of a second.'
