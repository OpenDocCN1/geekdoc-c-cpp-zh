    # 3.2.1 Elasticity


    We use elasticity to refer to the "bounce" of an object when it collides with
    another object. There is a more precise and formal definition of elasticity that
    describes how an object responds to strain when force is removed, but we will
    use a simpler model that gives us the behavior we are looking for. Although we
    use the term *elasticity*, our definition will be based on the idea of restitution,
    or how much of the energy is returned after the collision.


    The elasticity calculation will assume that some fraction of this energy is returned
    as a part of the collision process, so that if the ball is moving towards the
    plane at some speed beforehand, it will move away from the plane with some fraction
    of speed afterward. That fraction will be given by what is called the *coefficient
