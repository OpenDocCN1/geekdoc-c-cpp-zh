  md: '# Foundations of Physically Based Modeling and Animation


    Note that the derivative of kinetic energy with respect to velocities **v** and
    **ω** is the system''s total momentum, $mv+\omega$. Potential energy is the energy
    stored in a system due to its position or spatial configuration. Potential energy
    can be turned into kinetic energy, under the right conditions. A typical example
    is


    $V=mgh,$


    which is the potential energy of a body with mass $m$, in a gravitational field
    with strength $g$, and is at a distance $h$ from the ground plane. Note that the
    derivative of $V$ with respect to height is $m_g$, which is the negative of the
    force due to gravity. Another example is the potential energy stored in a compressed
    spring. If the spring has stiffness $k$, rest length $l^0$, and current length
    $l$, its potential energy is


    $V=\frac{1}{2}k(l-l^0)^2.$


    Note that in this case the derivative of $V$ with respect to $l$ is $k(l-l^0)$,
    which is the negative of the force exerted by a compressed spring. In general,
    the negative of the $gradient^*$ of potential energy is the force that potentials
    exerts.


    # 11.3.2 Lagrangian Dynamics Formulation


    To support the Lagrangian dynamics formulation, we first define


    $T$ to be the kinetic energy of the system


    $V$ to be the potential energy of the system


    $L=T-V$ to be the *Lagrangian* of the system


    Inspection shows that the Lagrangian $L$ describes the balance of kinetic and
    potential energy in the system.


    In the Lagrangian formulation, motion is taken to be with respect to a *generalized
    coordinate frame* **q**, with one element of the vector **q** for each degree
    of freedom of the system. For example, **q** might be a set of allowable displacements
    and angles, or any convenient parameters positioning a curve, surface, or volume.
    Only motions satisfying the constraints on the system can be described in this
    coordinate frame, and so all solutions are guaranteed to satisfy the system constraints.


    > *The gradient of a scalar field is defined to be the first spatial derivative
    of the field, taken in each coordinate direction, and arranged as a vector. Look
    ahead to Section 13.2 for a more complete description of scalar fields and the
    gradient operator.'
