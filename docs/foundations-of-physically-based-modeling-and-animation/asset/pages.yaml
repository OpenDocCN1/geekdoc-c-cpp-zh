  md: '# 196 ■ Foundations of Physically Based Modeling and Animation


    There are similar formulas for other basic shapes, such as cylinders. If you know
    such a simple shape, you can write the moment of inertia directly.


    **Moment of Inertia in World Coordinates:** For a rigid object, the moment of
    inertia $I_0$ in the local coordinate frame will not change. However, the moment
    of inertia in world coordinates will change, depending on the current orientation
    of the object. Each row and column of the moment of inertia matrix corresponds
    to one of the coordinate directions, so depending on the current orientation of
    the object, the moment of inertia for that object will change.


    Fortunately, if we know the moment of inertia in the local coordinate frame, we
    can quickly compute it for a different orientation. If our orientation matrix
    $R$, and the moment of inertia in the local coordinate frame is $I_0$, then the
    moment of inertia for the object in the world coordinate frame is


    ```

    $$I = RI_0R^T$$

    ```


    You can verify this by examining how each of the elements in the moment of inertia
    matrix changes for a different orientation. A derivation can also be found in
    Witkin and Baraff [2001].


    As we will see shortly, we often want the inverse of the moment of inertia, $I^{-1}$.
    Fortunately, and remembering that rotation matrices $R^{-1} = R^T$, if we know
    the inverse of the moment of inertia in local coordinates, the computation is
    straightforward:


    ```

    $$I^{-1} = (RI_0R^T)^{-1}$, or $I^{-1} = (R^T)^{-1}I_0^{-1}(R)^{-1}.$$

    ```


    Therefore,


    ```

    $$I^{-1} = RI_0^{-1}R^T$$

    ```


    # 9.3 RIGID BODY MOTION


    Recall from Section 9.1 for a rigid body, we have both a linear and an angular
    state. As we simulate rigid bodies, we must update both of these states. This
    will allow us to capture both the rotational motion and the translational motion
    of rigid bodies, like the dominos in Figure 9.2, as they move in space.


    First, we recall the way that forces are used to update linear position, such
    as for particles. We have a position $\mathbf{x}$, a mass $m$, and a velocity
    $\mathbf{v}$, giving us a linear momentum $\mathbf{P} = m\mathbf{v}$. Notice that
    for a force $\mathbf{F}$ we have $\mathbf{F} = m\mathbf{a} = m\dot{\mathbf{v}}
    = \dot{\mathbf{P}}$. That is, the force is the time rate of change of linear momentum.


    We have an analogous process for changes in angular momentum, namely that the
    time rate of change of angular momentum is *torque.*'
