    # 14.2.3 External Acceleration Collisions


    The external acceleration $g_i$, in Equation 14.4 is normally used to represent
    gravity, which is constant across all particles. But in the SPH formulation, it
    provides a convenient place for the animator to produce unusual effects by applying
    accelerations in specific regions or on specific particles. Thus, if it is desired
    to apply a force to a particle $i$, rather than to directly apply an acceleration,
    the force should be divided by the local density of the particle $\rho_i$.


    Since SPH is an interacting particle method, all of the techniques that we have
    discussed earlier for particle collisions with external objects can be used without
    modification. This can include both particle bounce and friction. Therefore, it
    is easy to simulate constrained fluid flow, like pouring a liquid into a glass.


    # 14.3 KERNEL FUNCTION


    There is an infinite number of kernel functions that could be used for SPH, and
    the choice of a function is based largely on the animator desires. Important considerations
    are that it should be symmetric, have finite support, and have an integrated volume
    equal to 1. Generally, it should decrease monotonically from the center, so that
    the influence of particles falls off the farther they are. Another useful property
    is for the kernel and its derivatives to smoothly go to zero at the boundary of
    the region of support.'
