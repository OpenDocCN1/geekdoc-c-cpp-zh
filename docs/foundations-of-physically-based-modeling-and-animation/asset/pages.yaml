  md: '# Rigid Body Collisions and Contacts ■ 215


    Advantages: The primary advantage of the convex hull as a bounding volume is its
    tightness of fit. It minimizes wasted space. The convex hull can also be precomputed
    for an object, and the rotated as the object changes. The entire hull does not
    need to be recomputed from scratch as an object rotates, unlike AABBs and k-dops.


    Disadvantages: Detecting collisions between convex hulls is very slow, to the
    point that convex hulls are rarely used in practice for collision detection. However,
    there are cases where just one or two objects are checked for collisions, and
    in these cases relatively slow performance may be acceptable, especially if one
    wishes to minimize the chances of a false-positive intersection. The Lin-Canny
    algorithm [Lin and Canny, 1991] is an example of a collision detection algorithm
    relying on the convex hull. In that case, the closest point between two volumes
    is kept track of continuously, and in this case, since there are few objects,
    and a very tight fit is desired, the convex hull is an appropriate choice.


    # 10.2.2 Broad Phase Collision Detection


    The goal of broad phase collision detection is to eliminate pairs of objects that
    are clearly not colliding. Following the broad phase there should be a list of
    pairs of objects that are potentially colliding. Actual collisions are not determined
    during the broad phase.


    In the broad phase, we will typically use a sphere bounding volume, centered at
    the center of mass. Because the sphere is centered on the center of mass, this
    volume will enclose the object regardless of its orientation. As the object moves,
    we will need to update the position of the sphere, but not its radius.


    There are two major approaches to the broad phase of collision detection: spatial
    structures: the uniform grid, the octree, and the kd-tree. For broad phase collision
    detection, we use one of these spatial subdivisions, and place the object in all
    spatial regions that object (or the object''s bounding volume) overlaps.


    During the broad phase of collision detection, we need to check only between pairs
    of objects that lie in the same spatial subdivision region. Note that if objects
    span many regions (e.g., along a line covering many voxels), there may be times
    that a pair of objects is checked in many voxels. This is likely to be a common
    problem, an additional list or hash table of checked pairs can be maintained and
    to avoid unnecessary comparisons. However, for the broad phase, the comparison
    between any two object''s spheres is typically simple enough that this overhead
    does not pay unless there is a very large number of cases.


    Object whose bounding volumes are found to overlap are passed to the narrow phase
    for subsequent determination of whether or not a collision between the objects
    themselves has actually occurred.'
