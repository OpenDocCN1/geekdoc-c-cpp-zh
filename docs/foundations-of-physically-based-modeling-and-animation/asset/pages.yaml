  md: '# Foundations of Physically Based Modeling and Animation


    ![](img/b434947f68660f7e26f8700ff77023a5_84_0.png)


    FIGURE 4.7 Left—a particle system rendered as points. Right—rendered volumetrically
    together with additional elements. (Courtesy of Hugh Kinsey).


    # 4.5.4 Volume Rendering


    Volume rendering has become the primary way that particles are rendered in visual
    works for film. The idea here is that the 3D volume representing the space in
    which the particle system resides is divided into a 3D grid of voxels through
    which they pass. This density usually either fades or is dispersed in the volume
    with time, with the net effect being a streak of density in the volume that tends
    to be most dense in the current region of the particle, and less along its position
    history. The density trails can be further perturbed by various processes, like
    Perlin noise, or flow simulations creating interesting detail. Finally, a direct
    volume renderer is used to render the density pattern in the volume. This approach
    has been used to model a great variety of effects. Some examples are explosions,
    volcano eruptions, water spray, avalanches, vapor trails, rocket exhaust, and
    falling snow. A nice example, showing a mothership landing, is in Figure 4.7.


    # 4.6 SUMMARY


    Here is brief review of some of the main concepts to take away from this chapter:


    +   - Particle systems, consisting of large numbers of discrete point masses,
    can be used to simulate a wide variety of phenomena that do not exhibit a coherent
    organized structure.

    - The particles in a particle system interact with the scene but not with each
    other.

    - The particles in a particle system originate from particle generators. These
    particle generators are typically geometric objects that can be manipulated and
    moved about within a scene.

    - The characteristics of particles within a particle system and the initial locations
    and velocities of particles coming from particle generators are typically drawn
    from random distributions. Gaussian distributions are often the most realistic.'
