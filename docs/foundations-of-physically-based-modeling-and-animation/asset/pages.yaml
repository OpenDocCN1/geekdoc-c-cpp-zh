    \ j do\n        Add contribution of particle j to i's total force;\nforeach particle\
    \ i do\n    i's new-state = Integration of i's total force over timestep h;\n\
    ```\n\nAnother critical issue when working with interacting particles is that\
    \ the complexity of the computation of forces goes up with the square of the number\
    \ of particles. For a noninteracting particle system, the computational complexity\
    \ is $O(N)$ in the number of particles. Since each particle is treated separately,\
    \ all of the loops in the computation simply iterate over the number of particles.\
    \ On the other hand, in an interacting system, to compute the forces on each $N$\
    \ particles we must consider all of the $N-1$ other particles, the total number\
    \ of interactions is $N(N-1) = N^2-N$. We can invoke Newton's third law, that\
    \ every action has an equal and opposite reaction, to save all of calculations,\
    \ since the force of $i$ on particle $j$ must be equal and opposite to the force\
    \ of $j$ on particle $i$. This still leaves us with $\frac{1}{2}(N^2-N)$ interactions\
    \ to compute. Therefore, the computational complexity of the interacting particle\
    \ problem is $O(N^2)$. But, the nature of a particle system simulation is that\
    \ when we are dealing with big particle simulation we usually treat a very large\
    \ number of particles, so the cost can be very high.\n\n![](img/b434947f68660f7e26f8700ff77023a5_102_0.png)\n\
    \nIn Chapters 4 and 5, we explained how to create and choreograph simple non-interacting\
    \ particle systems. In this chapter, we will lay the foundations for dealing with\
    \ large systems of particles that interact with each other. The two main conceptual\
    \ and technical issues will be maintaining a coherent notion of the entire system's\
