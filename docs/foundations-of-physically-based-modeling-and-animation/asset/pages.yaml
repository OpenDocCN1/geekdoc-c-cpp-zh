    You can demonstrate yourself that this matrix works, since it rotates the three
    model frame axes into these vectors:


    ```

    $R_{mw} = \begin{bmatrix} 1 & 0 & 0 \end{bmatrix} = \hat{\mathbf{u}}_x, R_{mw}
    = \begin{bmatrix} 0 & 1 & 0 \end{bmatrix} = \hat{\mathbf{u}}_y, \text{ and } R_{mw}
    = \begin{bmatrix} 0 & 0 & 1 \end{bmatrix} = \hat{\mathbf{u}}_z.$

    ```


    We know this matrix can only do a pure rotation since it is an orthogonal matrix,
    i.e., its column vectors are mutually orthogonal unit vectors. This is exactly
    the condition that must hold for a matrix to describe a pure rotation, an orthogonal
    matrix is often called a rotation matrix. Note that unlike rotations around the
    three coordinate axes, this form of rotation matrix rotates around an arbitrary
    axis.


    To complete the description of the transform from the current frame to the new
