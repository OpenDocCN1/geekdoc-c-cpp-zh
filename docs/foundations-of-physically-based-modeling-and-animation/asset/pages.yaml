    \ False;\n  }\n  Overlapping in all dimensions, return True;\n}\n```\n\nInputs\
    \ are the AABB extents for objects 1 and 2.\n\nAdvantages: Most computations with\
    \ AABBs are very fast. Computing the AABB itself is straightforward, although\
    \ it takes time proportional to the number of vertices. Checking for collisions\
    \ is about as efficient as possible, with no computation required beyond a set\
    \ of at most six comparisons.\n\nDisadvantages: As objects change orientation,\
    \ the AABB needs to be recomputed. For objects in free motion, this can mean recomputing\
    \ the entire AABB at every timestep, and if the object contains many vertices,\
    \ this could be a slow process. While generally tighter-fitting than a bounding\
    \ sphere, there is typically a lot of \"empty\" volume enclosed, meaning that\
    \ intersections will often be unreported.\n\nk-dops: The k-dop bounding volume\
    \ style, short for k-discrete orientation polytopes, can be thought of as an extension\
    \ of AABBs. While AABBs define the bounding volume by finding a minimum and maximum\
    \ among three axes, k-dops define the bounding volume by finding a minimum and\
    \ maximum along additional axes. The k in a k-dop refers to the number of directions\
    \ in which an extent is measured. Since each axis has two extents (maximum and\
    \ minimum), a k-dop is defined by k/2 different axes.\n\n![](img/b434947f68660f7e26f8700ff77023a5_233_0.png)\n\
    \nStoring a k-dop involves storing a maximum and minimum for each k/2 axes. Like\
