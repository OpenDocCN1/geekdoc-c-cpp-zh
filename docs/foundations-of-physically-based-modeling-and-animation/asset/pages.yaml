  md: 'The kernels are also normalized so that


    ```

    $$\int w(\mathbf{r})d\mathbf{r} = 1,$$

    ```


    where the integral is taken over the entire support volume.

    When the set of particles is created, each particle must be assigned a value for
    each property it will be keeping track of. Normally, this will include only the
    particle''s velocity, as pressure and density will be computed on-the-fly at each
    timestep. But, it could include any other value that would be advected by the
    fluid, such as fluid temperature.

    In the discussion below, a field $\Phi$, written without a subscript, refers to
    the continuous field, but when written $\Phi_i$ it refers to the field value at
    the position of particle $i$.

    If it is necessary to know the field value of some field $\Phi$ at a position
    $\mathbf{x}$, the kernel weighted effects of all of the particles in the support
    neighborhood $N(\mathbf{x})$ of position $\mathbf{x}$ are summed, giving the reconstructed
    estimate


    ```

    $$\Phi(\mathbf{x}) = \sum_{j\in N(\mathbf{x})} m_j \frac{\Phi_i}{\rho_j} w(\mathbf{x}-\mathbf{x}_j).
    \quad (14.1)$

    ```


    Note $m_j/\rho_j = V_j$, so that the summation is weighted by both the kernel
    value and the particle''s volume—if particles are not nonuniform, bigger particles
    will have more effect. In the equations below, we will assume that the summations
    are over the points within the neighborhood of the position indicated on the left-hand
    side of the equation.

    While a particle''s mass will remain constant, its density will not, since particles
    are free to separate or cluster together. When density $\rho_i$ at the position
    of particle $i$ needs to be known it is computed from Equation 14.1, with $\Phi_j
    \equiv \rho_j$. Thus, it follows that the density at any given position in space
    will be


    ```

    $$\rho(\mathbf{x}) = \sum_{j} m_j w(\mathbf{x}-\mathbf{x}_j). \quad (14.2)$

    ```


    so that for particle $i$,


    ```

    $$\rho_i = \sum_{j} m_j w(\mathbf{x}_i-\mathbf{x}_j). \quad (14.3)$

    ```


