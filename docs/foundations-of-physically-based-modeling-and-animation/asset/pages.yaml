  md: 'The central equation of the Lagrangian dynamics formulation


    ```

    $$d\left(\frac{\partial L}{\partial q}\right)/dt = \frac{\partial L}{\partial
    q}=Q.$ (11.16)$

    ```


    This equation relates changes in the Lagrangian L to a set of applied or dissipative
    forces and torques Q. An applied force or torque is any one acting outside of
    the system modeled and is not accounted for in the computation of potential or
    kinetic energy. For example, an electric motor could be modeled as providing an
    applied torque to a fan rotor. A dissipative force is any force acting to remove
    energy from the system. Friction and air resistance are two canonical examples
    of dissipative forces—friction turns kinetic energy into heat and noise, while
    air resistance transfers some of the kinetic energy of a moving body into motion
    of the surrounding area.


    Note that only the kinetic energy is affected by the velocities represented in
    $\dot{q}$, $\frac{\partial L}{\partial q}$ is the momentum of the system, and
    $d(\\partial L/\partial q)/dt$ is the rate of change of momentum. In other words,
    this corresponds to the term $ma$ in Newton''s second law. Since the potential
    energy is only affected by the configuration $q$, the term $\frac{\partial L}{\partial
    q}$ governs how potential energy changes as the system moves spatially, and gives
    the force F acting internally on the system as it stores or releases potential
    energy. This, reduces to $ma-F=Q$ or


    ```

    $$ma=F+Q.$

    ```


    which is in the form already familiar to us. Also note that while the internal
    workings of the system are described in terms of energy in a generalized coordinate
    system, Q must be specified in terms of forces in this same coordinate system.


    # 11.3.3 Falling Ball Example


    To see how the Lagrangian dynamics formulation works, let us look at the simple
    example we started with Chapter 2, a ball falling under the influence of gravity.
    Assume that we have a ball of mass $m$, acting under a gravitational field $g=-g\hat{u}$,
    where $\hat{u}$ is the unit vector in the vertical direction, and the coordinate
    frame is the 3D Cartesian coordinate system. The ball''s position is $x=[x\ y\
    z]^T$, and its velocity is $v=[v_x\ v_y\ v_z]^T$, so that, $q=x$, and $\dot{q}=v$.
    We will assume that the ball is not rotating, and has no rotational inertia. Therefore,
    its kinetic energy is


    ```

    $$T=\frac{1}{2}mv^2.$

    ```


    The ball''s potential energy is


    ```

    $$V=\int_0^y mg\dy,\ \text{ or } V=mg\hat{u}_y\cdot\mathbf{x}.$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_265_0.png)'
