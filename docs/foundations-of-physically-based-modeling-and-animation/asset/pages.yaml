    # 15.2.5 Organization of a Smoke Simulation Calculation


    In order to understand how the equations above can be put into a useful computational
    form, let us first look at the simplest possible example. Consider the 2D problem
    represented by the $3 \times 3$ grid of cells pictured to the right, and imagine
    that we are doing a smoke simulation. This would work is that the space of the
    computation would be filled with massless particles, representing smoke particles.
    The fluid containing the smoke will be free to move in an unrestricted way around
    the grid. The smoke particles will be advected with the fluid at each timestep,
    with each particle assigned the velocity at the particle''s position, which would
    be integrated over the timestep to find the particle''s new position. To make
    the problem unbounded, we will apply what are known as *periodic boundary conditions*,
    where we consider fluid leaving the right side of the grid to entering back on
    the left, and fluid leaving the top of the grid getting back on the bottom. The
    same applies to pressure-e.g., pressure in the right-most cell will be felt on
    the left of the left-most cell on the same row. If you like topology, it is as
    if the fluid were on the surface of a torus. If you want a concrete example, think
    of the *Pac-Man* games—the ghosts do move just as we are imagining to do.


