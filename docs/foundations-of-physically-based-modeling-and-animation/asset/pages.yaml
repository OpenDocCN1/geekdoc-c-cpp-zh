  md: '# 9.3.3 Quaternion Representation


    Although the expression of orientation by a rotation matrix $R$ is the method
    we have followed up until now in this book, this method creates problems during
    integration. Imagine a simple Euler integration technique, considering only the
    update of orientation. Using rotation matrix we have


    ```

    $R^{(n+1)} = R^{(n)} + \omega^* R^{(n)},$

    ```


    which involves the addition of matrices. In most cases, the orientation matrix,
    $R^{(n+1)}$, will no longer be an orthonormal set of vectors, and thus the matrix
    is no longer a true rotation matrix! The consequence for your simulation would
    be that, over time, your objects may undergo shear or nonuniform scaling, changing
    their shapes. While we could continually modify $R$ to return it to the nearest
    rotation matrix, this is a cumbersome process that introduces more potential error.
    A better option is to use an alternative representation for orientation: quaternions.
    The mathematical background for quaternions is described in Appendix E.


    Just as $R$ expressed from the original state, we can use a quaternion $\mathbf{q}$
    to represent rotation from the original state. Quaternions have the advantage
    that they have only four elements that must be integrated, and they do not have
    a requirement for orthonormality. All that is required to maintain a true rotation
    is to keep them scaled to unit length. Thus, quaternions accumulate error more
    slowly than orientation matrices, and are easier to return to a valid orientation.


    The derivative of the quaternion orientation is given by


    ```

    $$\dot{q} = \frac{1}{2}\omega\mathbf{q}.$

    ```


    The proof of this is given below. Note that we must convert $\omega$ into a quaternion
    $(0, \omega)$ to perform the quaternion multiplication.


    Now, when integrating, we will use adding up quaternions (e.g., for Euler integration:
    $\mathbf{q}^{(n+1)} = \mathbf{q}^{(n)} + \dot{\mathbf{q}}^{(n)}$). Doing this
    will cause the quaternions to become nonunit quatern, meaning they are no longer
    valid representations of orientation. Fortunately, it is easy to check by renormalizing
    all quaternions after each integration—that divide each quaternion by its magnitude
    to scale it to length 1.


    Thus, the preferred representation of state and its derivative for rigid bodies
    incorporate quaternions and are given by


    $$\mathbf{S} = \begin{bmatrix} \mathbf{x} \ \mathbf{P} \ \mathbf{L} \end{bmatrix},
    \dot{\mathbf{S}} = \begin{bmatrix} \mathbf{v} \ \\omega\mathbf{q} \ \mathbf{F}
    \ \tau \end{bmatrix}$


    A note here is that although we no longer have the rotation matrix as part of
    the state, we still need to compute the moment of inertia tensor in the rotated'
