    a simple polygon. A simple polygon is an ordered set of vertices, all lying in
    a single plane, such that the edges connecting the vertices, in order, form a
    closed loop with no edges crossing. Some example simple polygons are shown to
    the right. These are all convex polygons, since the internal angles formed by
    connecting edges at each vertex are less than 180°.


