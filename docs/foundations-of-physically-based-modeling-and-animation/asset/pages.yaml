  md: '# A.5 POINTS AND VECTORS


    This leads us to the idea that points and vectors can be interchangeable—almost.
    While vectors have no position in space, points are always defined relative to
    the origin, $O$. Thus, we can say that a point, $p=(x, y)$, is defined by the
    origin, $O=(0, 0)$ and a vector, $p = \begin{bmatrix} x \ y \end{bmatrix}$ i.e.,


    $p = O + p$.


    Because the origin is assumed to be the point $(0,0)$, points and vectors can
    be represented the same way, e.g., the point $(2,3)$ can be represented as the
    vector $[2]$. This interchangeability can be very convenient in many cases, but
    can also lead to confusion. When storing data, you clearly indicate which values
    are points, and which are vectors. As we will see below, homogenous coordinates
    used to define transformations can help with this.


    Equivalent to the above, we can write $p=p-O$, a vector defines the measure from
    the origin to a particular point in space. More generally, a vector can always
    be defined by the difference between any two points, $p$ and $q$. The vector $\mathbf{v}=p-q$
    represents the direction and distance from point $q$ to point $p$. Conversely,
    the point $q$ and the vector $\mathbf{v}$ define the point, $p=q+\mathbf{v}$,
    which is translated from $q$ by the components of $\mathbf{v}$.


    ![](img/b434947f68660f7e26f8700ff77023a5_348_0.png)


    # A.6 PARAMETRIC DEFINITION OF LINES AND RAYS


    This leads us to a compact definition of a line in space, written in terms of
    a unit vector and a point. Let $\mathbf{p}$ be a known point (expressed in vector
    form) on the line being defined, and let $\mathbf{\hat{a}}$ be a unit vector whose
    direction is parallel to the desired line. Then, the locus of points on the line
    is the set of all points $\mathbf{x}$, satisfying


    $$\mathbf{x}(t)=\mathbf{p}+t\mathbf{\hat{a}}.$


    The variable $t$ is a real number, and is known as the line parameter. It measures
    the distance from the point $\mathbf{p}$ to the point $\mathbf{x}(t)$. If $t$
    is positive, the point $\mathbf{x}$ lies in the direction of the unit vector from
    point $\mathbf{p}$, and if $t$ is negative, the point lies in the direction opposite
    to the unit vector.


    The definition of a ray is identical to the definition of a line, except that
    the parameter $t$ of a ray is limited to the positive real numbers. Thus, a ray
    can be interpreted as starting from the point $\mathbf{p}$ and traveling in the
    direction of $\mathbf{\hat{a}}$ a distance corresponding to $t$, as $t$ goes from
    $0$ to increasingly large positive values. On a ray, the point $\mathbf{p}$ is
    called the ray origin, $\mathbf{\hat{a}}$ the ray direction, and $t$ the distance
    along the ray.


    ![](img/b434947f68660f7e26f8700ff77023a5_348_1.png)'
