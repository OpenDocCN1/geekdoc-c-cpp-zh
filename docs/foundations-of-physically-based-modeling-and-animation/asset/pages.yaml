    # 13.4 POTENTIAL FLOW FIELDS


    The Navier-Stokes equations provide a full description of fluid flow for domains
    typically used in computer graphics, but the solution methods for these equations
    are many and varied. In this section we examine how a set of simplifying assumptions'
