    # 14.6 SUMMARY


    Here are some of the main points to take away from this chapter:


    +   SPH is the most Lagrangian approach to fluid simulation. It treats the fluid
    as a large collection of "particles," and derives its motion from both external
    forces and internal interparticle forces governed by the Navier-Stokes equations.


    +   Field quantities, such as pressure and velocity, are derived from these quantities
    measured at the individual particles, and then spread through the fluid volume
    by kernel functions. The net field value at a spatial position is then the kernel
    weighted sum of the values in particles in the neighborhood of that position.


    +   Constructing a fluid surface for rendering in an SPH simulation can be done
    implicitly by constructing a color field, whose gradient magnitude allows detection
    of the surface, and whose direction provides a surface normal.


    +   SPH is fully mass preserving, since the total number of mass particles does
    not change.


    +   SPH does not have an explicit mechanism to enforce volume preservation, so
    the fluid can look "springy" unless measures are taken to reduce this effect.'
