    # 15.1 FINITE DIFFERENCES


    EULERIAN APPROACHES TO FLUID SIMULATION require sampling the space that the fluid
    is acting in, rather than sampling the fluid itself. Because Eulerian approaches
    begin by subdividing space, they typically require bounding the region over which
    a fluid simulation is done. This is in contrast to Lagrangian methods, where particles
    are free to move anywhere in space. In this section we present how this can be
    done using a uniform spatial grid, as described in Section 6.3.1. Assuming a gridded
    representation of space, we first lay the foundations for numerical computing
    over the grid, using finite difference representations of the differential operators
    appearing in the Navier-Stokes equations. We then describe two approaches for
    sampling fields onto the grid, and build on this to describe the most popular
    simulation schemes built on this structure, the semi-Lagrangian and FLIP methods.


    # 15.1.1 Numerical Differentiation


    Given that we will sample the fluid simulation fields over a regular spatial grid,
    we need a way to define the differential operators of the Navier-Stokes equations
    under this sampling. This will require an approach to estimating first and second
    partial derivatives.


    Forward differencing: One technique for spatial numerical differentiation is forward
    differencing. This approach is depicted in the figure to the right. Consider the
    one-dimensional derivative of a spatial quantity $\Phi(x)$, using the classical
    derivative of the derivative,


    ![](img/b434947f68660f7e26f8700ff77023a5_315_0.png)


    ```

    $$\frac{d\Phi}{dx} = \lim_{h\to 0} \frac{\Phi(x+h)-\Phi(x)}{h}$

    ```'
