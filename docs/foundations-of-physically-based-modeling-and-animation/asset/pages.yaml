  md: '+   - A prismatic joint provides for one translational degree of freedom along
    a single direction.


    +   - Multiple degree-of-freedom joints can be specified by placing multiple joints
    on top of each other.


    +   - The state of an articulated body is captured by a set of scalars giving
    joint angle and angular velocity for rotational joints, or joint translation and
    translational velocity for prismatic joints.


    +   - Computation of articulated motion is done in a three-step algorithm, with
    the first step computing link velocities, the second computing spatial articulated
    inertia zero acceleration force, and the third computing the link accelerations.


    +   - A spatial algebra, capturing both rotational and translational motion in
    a compact, unified form, provides the mathematical framework for expressing the
    algorithm.'
