  md: '# Articulated Bodies


    AIDE VARIETY OF ANIMATED OBJECTS, most especially humans and animals with a skeleton,
    can be modeled as an articulated body. The diagram shows abstractly how this could
    be done to model a puppet pulling wagon. Most segments of the body are composed
    of rigid links, connected together by rotating joints. The one exception is the
    wagon''s body, which does not rotate, but can move back and forth parallel to
    the floor.


    ![](img/b434947f68660f7e26f8700ff77023a5_271_0.png)


    Simulating the dynamics of an articulated body can be approached in several ways,
    but the approach that has proven to be most useful in computer animation is the
    algorithm due to Featherstone [1983], who developed it for use in robotics. This
    algorithm was elaborated for practical use in graphics by Mirthich [1996a], and
    here we will follow closely the approach elaborated by Mirthich, because it is
    probably the easiest to follow The reader wishing a fuller explanation of the
    method is directed to Chapter 4 of Mirthich''s thesis [Mirthich, 1996b].


    # 12.1 STRUCTURE OF ARTICULATED BODY


    In a multilink chain, we consider each chain to have a root that can be used to
    place the object in space. The figure to the right shows a four-linked structure,
    mounted on a pedestal base, which serves as the chain''s root. The symbol indicates
    the center of each link. A link''s inbound joint connects to its neighboring link
    closer to the root. There can be zero, one, or more outbound joints connecting
    to neighboring links further from the root. The structure would be placed in a
    3D scene by positioning and orienting its root link. The rest of the structure
    is defined relative to the position and orientation of the center of mass of the
    root. Although, in this example, the root serves as a base at the bottom of the
    chain,


    ![](img/b434947f68660f7e26f8700ff77023a5_271_1.png)'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# 250 ■ Foundations of Physically Based Modeling and Animation


    other articulated structures may have a root more centrally located. For example,
    in a model like the puppet, the link that would typically serve as the root would
    be the one representing the hips.


    The two kinds of joints that can be used to connect the links in an articulated
    body are known as revolute and prismatic. This diagram shows how each type of
    joint is modeled. With respect to the joint connecting to an inboard neighbor,
    a link with a revolute joint can only rotate, and a link with a prismatic joint
    can only translate. In the puppet-with-wagon example, all of the links are revolute,
    except the wagon''s body, which is prismatic.


    ![](img/b434947f68660f7e26f8700ff77023a5_272_0.png)


    To simplify modeling, we can consider each joint to have only one degree of freedom.
    The requirement is not a limitation on the structure of the model, because multiple
    joints can be placed at the same location. Thus, a joint like the knuckle on a
    finger, which has one degree of rotational freedom, can be modeled by a single
    revolute joint, but a joint like the hip, which has two degrees of rotational
    freedom, would be modeled by two joints with a 0 length link between them.


    We define joint $i$ to be the between link $i$ and its inboard neighbor. Since
    this joint has only one degree of freedom, we need only the direction of the joint
    axis, and a single scalar parameter to describe the orientation of the joint relative
    to its inboard neighbor. We will use the symbol $q_i$ to represent that parameter
    for joint $i$. If the joint connecting $i$ to its inboard neighbor is revolute,
    $q_i$ is an angle of rotation about the axis defining the direction of the joint''s
    rotational degree of freedom. If the joint is prismatic, $q_i$ is a displacement
    in the direction of the joint''s translational degree of freedom. Likewise, the
    first derivative $\dot{q}_i$ of this joint gives the angular speed of a revolute
    joint or the translational speed of a prismatic joint, and its second derivative
    $\ddot{q}_i$ gives the angular acceleration of a revolute joint or the translational
    acceleration of a prismatic joint.


    The entire collection of displacements for a multilink structure is known as its
    configuration space. The positional state of an entire configuration of $n$ links
    is represented by the vector


    ```

    \mathbf{q} = [q_1 \ q_2 \ \dots \ q_n]^T

    ```


    Note that there is no entry for $q_0$ since by definition, it is always true that
    $q_0 = 0$. It is said to lie in configuration space.


    Each model will be assembled from its individual links in a starting configuration
    that is called its pose configuration. The diagram to the right might be the pose
    configuration of a puppet. By definition, in configuration all joint angles or
    displacements are 0, thus $q_i = 0$ for all joints. In other words, the pose


    ![](img/b434947f68660f7e26f8700ff77023a5_272_1.png)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Articulated Bodies ■ 251


    configuration is the origin of the configuration space,


    ```

    $$\mathbf{q}_0 = [0 \ 0 \ \dots \ 0]^T.$

    ```


    # 12.2 DYNAMIC STATE OF AN ARTICULATED BODY


    The dynamic state of the multilink structure is compactly described by the configuration
    vector $\$\mathbf{q}$ and its first time derivative


    ```

    $$\dot{\mathbf{q}} = [\dot{\mathbf{q}}_1 \ \dot{\mathbf{q}}_2 \ \dots \ \dot{\mathbf{q}}_n]^T.$

    ```


    Likewise, the rate of change of dynamic state is described by $\$\dot{\mathbf{q}}$
    and its second time derivative


    ```

    $$\dot{\mathbf{q}} = [\dot{\mathbf{q}}_1 \ \dot{\mathbf{q}}_2 \ \dots \ \dot{\mathbf{q}}_n]^T.$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_273_0.png)


    We start by considering chains where each link is connected to at most one outboard
    link, and order the links such that the inbound neighbor of link $i$ is always
    link $i-1$. Later in this section we will generalize to handle trees of chains,
    where links may have more than one outboard link. The right figure is a vector
    diagram, set up for link $i$ and its inbound neighbor. The direction vector $\$\hat{\mathbf{u}}_i$
    indicates the direction of freedom of joint $i$, between links $i-1$ and $i$,
    and $\$\q_i$ is the joint''s scalar displacement parameter. The vector $\$\mathbf{d}_i$
    encodes the distance and direction from the position of link $i$, and vector $\$\mathbf{r}_i$
    encodes the difference between the center of mass of link $i$ and the center of
    mass of link $i-1$.


    As a convention, all of the vectors for link $i$ will be represented in the model
    space of link $i$. The center of mass of the link will be the origin $\$\0$ of
    the link''s model space, and its direction vector $\$\hat{\mathbf{u}}_i$ is fixed
    for this space. For a link with a revolute joint, $\$\mathbf{d}_i$ is also fixed.
    For a prismatic joint, $\$\mathbf{d}_i$ is always parallel to $\$\hat{\mathbf{u}}_i$,
    but varies in length. Because the joint between links $i-1$ and $i$ has only a
    single degree of freedom, the transformation from the model space of link $i-1$
    to that of link $i$ is straightforward, involving only a rotation and a translation.
    We will call this transformation $\$\T_{i-1}^i$, its inverse $\$\T_i^{i-1}$ transforms
    from the model space of link $i$ to that of link $i-1$. The representation of
    this transformation will be detailed below, after we develop the required mathematical
    framework.


    We can start by defining the angular velocity $\$\omega^i$ and the velocity $\$\mathbf{v}^i$
    of the center of mass of link $i$, relative to its inbound neighbor. These are
    the velocities it would have if the motions of its neighboring links are ignored,
    and only the rate of change $\$\dot{\mathbf{q}}_i$'
