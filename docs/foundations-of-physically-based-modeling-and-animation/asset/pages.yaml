    # 8.1 DAMPED SPRINGY CONNECTORS


    Before moving to springy meshes, we first need a good model for the connections
    of the mesh. These should produce forces that tend to keep the model in its deformed
    rest state, while also providing a mechanism for controlling the persistence of
    oscillatory spring behavior. For example, we might want a jelly cube to wiggle
    and bounce for a second or two, but a rubber ball should deform and bounce back
    into shape without any discernible oscillation. To give us this desired level
    of control we will use connectors modeled on a storm door closer.


    A storm door closer consists of a metal tube, containing a spring and a piston,
    that connects by a movable rod at one end to the door frame, and at the other
    end by a fixed rod to the door. The job of the door closer is to pull the door
    shut after the person opening the door lets go of the door handle. The force pulling
    the door shut is produced by the spring in the door closer. If that were all


    ![](img/b434947f68660f7e26f8700ff77023a5_170_1.png)'
