  md: '# Rigid Body Collisions and Contacts ■ 209


    These collision detection techniques tend to fall into two categories, labeled
    broad phase and narrow phase. The broad phase refers to trying to find out or
    not objects moving in space are clearly separated that a collision cannot occur.
    This is meant to be a conservative test, to eliminate pairs of objects that cannot
    possibly colliding. Following this, the narrow phase is designed to look at the
    geometric elements in two individual objects, and to identify whether and where,
    there is a collision. The figure shows three possible cases that can occur. The
    pair of stars on the left will not passed to the narrow phase detection algorithm
    because they are clearly separated, whereas the middle and right-hand stars will
    be tested by the narrow phase. Only the stars on the right will be detected as
    actually colliding.


    ![](img/b434947f68660f7e26f8700ff77023a5_231_0.png)


    # 10.2.1 Bounding Volumes


    Both the broad phase and the narrow phase rely on the notion of a bounding volume.
    A bounding volume is a region that encompasses all of the object or geometry that
    is being tested for collision. The bounding volume should have geometry that is
    much simpler than that of the object or geometry it surrounds.


    The key of bounding volumes is: if there is not a collision with the bounding
    volume, then there cannot be a collision with any of the geometry within the bounding
    volume. Thus, if we find that a bounding volume is not colliding with some region,
    we have eliminated all the objects and geometry within region from collision.


    There is a variety of bounding volume styles, with each style having its own positives
    and negatives. We will review the most common ones here, giving a brief description
    of each and highlighting some of the advantages and disadvantages relative to
    other bounding volumes.


    Spheres: A bounding sphere encloses the geometry of the object within a sphere.
    It stores a position of the center (x, y, z) and a radius r.


    Computing: For an entire object, it is common to fix the position of the center
    to be the center of mass. If the center is not given, finding the center for a
    minimal bounding sphere is surprisingly hard, and most practical algorithms are
    only approximate. If you need to compute this, Ritter''s algorithm [Ritter, 1990]
    is relatively straightforward and provides a reasonable approximation. Once the
    center is determined, the radius is determined by examining all vertices and finding
    the distance to the farthest vertex.


    ![](img/b434947f68660f7e26f8700ff77023a5_231_1.png)'
