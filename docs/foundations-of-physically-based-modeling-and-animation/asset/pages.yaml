    \  index = NumberLinks(L, p, index);\nend\nreturn index;\n```\n\n12.4 Recursive\
    \ scheme to number the links.\n\n# 12.9 GENERALIZATION TO TREE-LIKE ARTICULATIONS\n\
    \nThe algorithm can be generalized to handle tree-like articulated structures,\
    \ where each link has only one inbound joint but may have more than one outbound\
    \ joint. To provide a coherent set of link indices, they can be assigned using\
    \ a recursive numbering scheme, which guarantees each outbound link will have\
    \ an index greater than its parent link. Link information is stored in an array\
    \ of length n total links. To facilitate indexing using this scheme, each link\
    \ holds a list of the indices of its outbound child branches, as well as the index\
    \ of its parent link. In the initial call to this routine a parent index of -1\
    \ and a current index of 0 should be supplied as parameters.\n\nNow, in the inward\
    \ and outward loops, the branching structure needs to be taken into account. In\
    \ the outward loops, each link can be considered in turn, assigning its parent\
    \ index as the inbound link. In the inward loop, each link must iterate over its\
    \ children to sum their contributions to the link’s articulated inertia and articulated\
    \ acceleration force.\n\n# 12.10 SUMMARY\n\nHere is a brief review of some of\
    \ the main concepts to take away from this chapter:\n\n+   - Articulated bodies\
    \ are constructed from links, which are rigid bodies, and connected at joints,\
    \ which may be either rotational or prismatic.\n\n+   - A rotational joint provides\
    \ for one rotational degree of freedom about a single joint axis."
