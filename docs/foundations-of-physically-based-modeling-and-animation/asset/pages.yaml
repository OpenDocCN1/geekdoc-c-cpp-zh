- img_proc: true
  md: '# 290 ■ Foundations of Physically Based Modeling and Animation


    require denoting a surface, as it may be sufficient to imagine the fluid as having
    an infinite 3D extent, but when simulating liquids it is often desired to represent
    the fluid surface so that oceans, swimming pools, and glasses of water can all
    be simulated.


    The surface of the SPH fluid is found by creating what is known as a scalar field
    c, whose value is 1 at each particle position and goes to 0 beyond the region
    of support of all fluid particles. The smoothly varying field is computed


    ```

    c(x) = \sum_{i} m_i \frac{1}{\rho_i}w(x-x_i)

    ```


    using the template of Equation 14.1, and setting the value of $c_i = 1$.

    The gradient of the color field provides a vector valued surface field,


    ```

    s(x) = \nabla c = \sum_{i} m_i \frac{1}{\rho_i}w(x-x_i)

    ```


    whose magnitude is large near the fluid surface and nearly everywhere. Therefore,
    $||s||$ is a strong indicator of the interface between the region containing fluid
    particles. The surface field points in the direction away from the nonfluid region
    toward the fluid region. Therefore, a thresholding operation on $||s||$ will locate
    the fluid surface, and normalizing the negative of the gradient provides a surface
    normal field


    ```

    \hat{n} = -s/||s||

    ```


    can be used for rendering. A raytracing renderer can render the surface directly
    by finding the ray intersection with the thresholded surface [Hart, 1993]. A polygon-based
    renderer uses Marching Cubes to create a set of surface triangles [Lorensen and
    Cline, 1987].


    There have been various improvements for extracting a surface for rendering from
    a particle-based simulation, including by Zhu and Bridson [2005]. The best current
    method is probably that of Yu and Turk [2013].


    A final consideration regarding the surface of fluid is surface tension. The molecules
    in a fluid exert intermolecular forces on each other due to uneven distribution.
    Interior to the fluid, these forces balance each other, but at the surface the
    molecules are unbalanced. For example, at the interface between water and air,
    the air molecules exert a weak influence on the surface water molecules, compared
    to the strong forces exerted by the interior water molecules. The result is that
    there is a net force tending to pull the molecules at the surface down into the
    body of the water. This gives the water surface some of the characteristics of
    an elastic membrane, allowing, for example, water insects to be able to glide
    on the water surface without sinking. It is also the force tending to pull water
