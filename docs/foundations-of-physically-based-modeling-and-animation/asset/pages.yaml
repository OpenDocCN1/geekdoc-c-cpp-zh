  md: "# APPENDIX A\n\n# Vectors\n\nA MATHEMATICIAN, a vector is the fundamental element\
    \ of what is known as a vector space, supporting the operations of scaling, by\
    \ elements as scalars, and also supporting addition between vectors. When using\
    \ vectors to describe physical quantities, like velocity, acceleration, and force,\
    \ we can move away from this abstract definition, and stick with a more concrete\
    \ notion. We can view them as arrows in space, of a particular length and denoting\
    \ a particular direction, and we can think of the corresponding scalars as simply\
    \ the real numbers. Practically speaking, a vector is simply a way of simultaneously\
    \ storing and handling two pieces of information: a direction in space and a magnitude\
    \ or length.\n\nAn arrow is a convenient way to draw a vector; since both length\
    \ and direction are clearly indicated. A real number is a convenient way to represent\
    \ a scalar, which when multiplied by a vector changes its length. To the left\
    \ are three visual representations of the same length and the same direction,\
    \ i.e., they are parallel to each other. Their location within the space is irrelevant.\n\
