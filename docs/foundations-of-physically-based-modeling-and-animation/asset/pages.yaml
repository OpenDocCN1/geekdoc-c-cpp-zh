    # 2.5 A BASIC SIMULATION LOOP


    In a more general problem, we will have an expression for forces that does not
    allow us to integrate to closed-form solutions like those in Equations 2.1 and
    2.2. Instead, we must integrate to find velocity and position using numerical
    techniques. There are a variety of numerical integration techniques, several of
    which we will encounter later, but for now we will introduce the most basic technique—Euler
    integration.


    Numerical integration techniques all rely on the notion of a timestep. They work
    by starting with a state at a particular time, and then computing the state timestep
    into the future. Although the notation used in the physically based simulation
    literature can vary from publication to publication, the timestep is usually denoted
    by $h$, and we will follow that convention in this book.


    First, we must understand what we are wanting to simulate. The state of a simulation
    refers to the values of the changing simulation parameters at an instant in time.
    In our simple example the state is just the velocity $v$ and position $x$ of the
    body. We have an initial state $(v_0$ and $x_0)$ at time $t=0$, and we want to
    determine the state at the various time values $t = (1, 2, 3, 4)$.


    Using this notion of state, the simulation loop will take the following form:


    ```

    current-state = initial-state;

    t=0;

    while t < t_max do // : here current-state is the state at time t

    Determine forces at current-state;

    Determine accelerations by Newton''s second law: $a = \frac{F}{m}$;

    new-state = Integration of accelerations over timestep $h$;

    current-state = new-state;

    t=t+h;

    ```


    Notice that at the beginning of each loop iteration, the state and the current
    iteration are in-sync.


    For notation purposes we will use a superscript in square brackets on a variable
    to indicate the loop iteration we are on, and will use $n$ to denote the "current"
    iteration. The value of a variable at the initial time will use a superscript
    $[0]$, after one timestep will be $[1]$, Notice that the superscript refers to
    the number of iterations, not the actual time. If the iteration number is $n$,
    the actual time is $t=nh$.


    The simplest numerical integration technique is Euler integration. The basic assumption
    of Euler integration is that all values being integrated in the simulation stay
    constant during a timestep. If, we know the acceleration at the beginning we can
    assume that it is constant throughout the timestep. Referring back to Equation
    2.1, we can see that this means that the new velocity is just the old velocity
    increased by acceleration times. Likewise, we assume velocity is'
  merge: -1
  pgno: 34
- img_proc: true
