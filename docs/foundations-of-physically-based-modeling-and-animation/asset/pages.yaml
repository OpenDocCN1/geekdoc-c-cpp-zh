    # 3.6 SPECIAL CASE: TRIANGLE INTERSECTION


    We noted earlier that a triangle is always planar. Further, it is true that a
    triangle is always a polygon, since its three ordered vertices always lie in a
    single plane, no edges can cross, and there can be no holes. This is why graphics
    systems will triangulate surface primitives, wherever possible, before doing rendering
    or other calculations requiring polygons.'
