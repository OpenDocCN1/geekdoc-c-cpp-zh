  md: "# Quaternions 357\n\nThis result is much more complex than the result obtained\
    \ when showing that multiplication of complex numbers encodes a rotation. However,\
    \ this complexity goes away when $\\hat{u}_1$ and $\\hat{u}_2$ are parallel. In\
    \ this case, $\\hat{u}_1 = \\hat{u}_2$, $\\hat{u}_1 \\cdot \\hat{u}_2 = 0$, so\
    \ the quaternion product reduces to\n\n$\\mathbf{q}_1\\mathbf{q}_2 = r_1r_2(\\\
    cos\\theta_1\\cos\\theta_2 + \\sin\\theta_1\\sin\\theta_2), \\hat{u}_1(\\sin\\\
    theta_1\\cos\\theta_2 + \\cos\\theta_1\\sin\\theta_2)),$\n\nwhich by trigonometric\
    \ identities reduces to\n\n$\\mathbf{q}_1\\mathbf{q}_2 = r_1r_2(\\cos(\\theta_1\
    \ + \\theta_2), \\hat{u}_1(\\sin(\\theta_1 + \\theta_2)))$\n\nThis result is analogous\
    \ to the result obtained when multiplying two complex numbers in trigonometric\
    \ form, and proves that for this special case multiplication induces rotation\
    \ of the first quaternion by the angle of the second. Below, we will prove that\
    \ this is true in general.\n\nBy inspection, we see that the identity element\
    \ for multiplication is $(1,0)$, i.e., $r=1$ and $\theta=0$. So, we can implicitly\
    \ define the inverse of a quaternion by\n\n$\\mathbf{q}^{-1} = (1,0),$\n\nwhich\
    \ can be solved to yield\n\n$\\mathbf{q}^{-1} = \\frac{(\\cos\\theta, -\\hat{u}\\\
    sin\\theta)}{r}$.\n\nIf the quaternion is a unit quaternion (i.e., $r=1$), then\
    \ we have\n\n$\\mathbf{q} = (\\cos\\theta, \\hat{u}\\sin\\theta),$ and $\\mathbf{q}^{-1}\
    \ = (\\cos\\theta, -\\hat{u}\\sin\\theta)$.\n\nNote that the inverse of a unit\
    \ quaternion is identical to the quaternion, but with its direction vector reversed,\
    \ or when $-\\sin\\theta = -sin\\theta$, with identical direction vectors but\
    \ with its angle negated. Any quaternion can be scaled to produce a unit quaternion\
    \ by simply dividing the quaternion by its magnitude $r$.\n\n# E.3 ROTATION VIA\
    \ QUATERNIONS\n\nGiven the polar form of the quaternion, we can go directly to\
    \ the definition of a rotation quaternion. A quaternion that will rotate a vector\
    \ through angle $\theta$ about an axis $\\hat{u}$ is a unit quaternion defined\
    \ by\n\n$\\mathbf{q} = (\\cos\\theta/2, \\hat{u}\\sin\\theta/2)$.\n\nNote that\
    \ the cosine and sine of the half angle $\theta/2$, not the full angle, are used\
    \ to scale the real and vector parts of the quaternion. Also note that for any\
    \ angle $\\alpha$, $\\cos^2\\alpha + \\sin^2\\alpha = 1$, \\mathbf{q}$ defined\
    \ in this way will always be a unit quaternion."
