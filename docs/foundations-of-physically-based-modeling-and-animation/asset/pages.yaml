    Condition 3 assures that the Coulomb friction limit is not exceeded. It introduces
    a new non-negative variable $\lambda$, which is used to compute conditions 2 and
    3.


    Here is how coupling works. In condition 3, $f_t < \mu_n$, then $\lambda = 0$,
    and $a_t^+ = -v_t/h$, which is exactly enough acceleration to bring the contact
    to rest in one timestep. However, if condition 3 $f_t = \mu_n$, then $\lambda
    \geq 0$ and $a_t^+ = -v_t/h-\lambda$. Therefore, the full friction force limit
    is not reached and the contact is slowed to a stop in one timestep, or the limit
    is reached, the contact is slowed but no more than what would bring it to rest.


    Since there are three conditions, involving the three unknowns $f_n, f_t$, and
    $\lambda$, each frictional contact must be modeled as a $3 \times 3$ system of
    equations


    ```

    \begin{bmatrix} k_{nn} & k_{tn} & 0 \ k_{nt} & k_{tt} & 0 \ \\mu & & -1 \end{bmatrix}
    \begin{bmatrix} f_n \ f_t \ \lambda \end{bmatrix} = \begin{bmatrix} a_n^+ \ a_t^+
    + v_t/h \ \lambda^+ \end{bmatrix}

    ```


    The constant $k_{nn}$ scales normal force in normal direction into normal acceleration,
    $k_{tn}$, scales normal force in tangential direction into normal acceleration,
    $k_{nt}$, $k_{tt}$ scales tangential force into tangential acceleration. The new
    dummy variable $\lambda^+$ allows the inequality in condition 3 to be expressed
    as an equality. The non-negative $\lambda^+$ is allowed to vary as needed. The
    purpose of the LCP solution is to define $f_n, f_t$, and $\lambda$. As a by-product,
    the solver will compute $a_n^*, a_t^*$, and $\lambda^*$ but their values are unneeded.
    Also, since $\lambda^*$ is only purpose is coupling constraints 2 and 3, its value
    can be ignored.


    For a single particle contact, with no rotational inertia and the center of mass
    at the contact point, the equation will be $k_{nn}, k_{tt} = \frac{1}{m}$ and
    $k_{tn}, k_{nt} = 0$. Notice, in this case, the equation represented by the top
    row is


    $f_n = m(a_n^* - a_n)$


    which is simply Newton''s second law applied to the net normal acceleration, and
    corresponds with the first complementarity condition. The second and third rows
    correspond with the other two complementarity conditions.


    However, for contacts between rigid bodies, both the geometry of the objects and
    their rotational inertia must be considered in $k_{nn}$ and $k_{tt}$, and the
    coupling constants $k_{tn} = k_{nt}$ will be non-zero. The figure shows that when
    $a_n$ is downward the resulting constraint force $f_n$ not only supports the body
    but also a rotation, which induces in a tangential acceleration $k_{nt}f_n$. Likewise,
    a tangential friction force $f_t$ opposing $a_t$ induces a


    ![](img/b434947f68660f7e26f8700ff77023a5_247_0.png)'
