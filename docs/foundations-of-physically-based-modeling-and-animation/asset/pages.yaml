  md: '+   - Eulerian simulations divide space into cells and track the flow of mass
    through the space cells.


    +   - A fluid simulation is attempting to compute entire scalar and vector fields,
    in particular the pressure and velocity fields.


    +   - The differential operators used to do computation over these fields are
    gradient, divergence, curl, and the Laplacian.


    +   - The Navier-Stokes equations for incompressible flow are most commonly used
    for simulating the dynamics of a fluid for animation purposes.


    +   - One of these equations accounts for the forces acting to change fluid momentum,
    with forces expressed as pressures, i.e., force per unit area, and mass expressed
    as density, i.e., mass per unit volume.


    +   - The other equation for incompressible flow is a constraint, requiring that
    the divergence of the velocity field be 0 everywhere.


    +   - For the special case of steady, inviscid flow a fluid velocity field can
    be developed as a solution to Laplace’s equation. Such a solution provides flow
    primitives like sources, sinks, and vortices that can be manipulated in a modeler
    to choreograph the flow.'
