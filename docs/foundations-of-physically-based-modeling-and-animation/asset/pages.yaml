  md: '# Finite Difference Algorithms ■ 305


    This will be satisfactory for fluids with low viscosity, but for high-viscosity
    fluids it can easily lead to numerical instability due to excessive stiffness.
    To avoid instability, the integration can be set up in implicit form:


    ```

    $$\mathbf{w}_3 = \mathbf{w}_2 + h\nu\nabla^2\mathbf{w}_3.$

    ```


    Since all of the operations in this equation are linear, this can be put into
    the form


    ```

    $(I - h\nu\nabla^2)\mathbf{w}_3 = \mathbf{w}_2.(15.2)

    ```


    The term in parentheses is a linear operator that can be represented as a matrix
    in the finite difference representation. Finally, $\mathbf{w}_3$ can be determined
    by solving the linear system. Because the matrix is sparse with a nice structure,
    it can be stored and solved efficiently. Note that $\mathbf{w}_0$ and $\mathbf{w}_1$
    are vector valued fields, this single equation really represents three scalar
    equations, and needs to be solved for the $u$, $v$, and $w$ components of the
    velocity field.


    # 15.2.4 $\mathbf{w}_4$-Achieving a Divergence Free Velocity


    There is no reason to expect that the intermediate velocity field $\mathbf{w}_3$
    will be divergence-free. The solution to this problem is to compute a pressure
    field that will act on the velocity field to make it divergence free. In a real
    fluid, pressure will instantaneously change to prevent any change in local divergence.
    We can emulate this process numerically by computing a pressure field that will
    provide exactly the pressure gradient needed to adjust the velocity field so that
    it is divergence-free.


    **Relaxation:** One way of making the velocity field divergence free, and simultaneously
    refine the pressure and velocity fields is by a relaxation approach. Here, we
    iteratively refine the pressure and velocity fields to achieve a divergence free
    velocity field. Begin with the candidate velocity field, $\mathbf{w}_3$ in this
    case. Then, compute the divergence of the candidate field in each cell, adjust
    the pressure in each cell to reduce the magnitude of the divergence, and finally
    adjust the candidate velocity field based on the pressure updates. Any cell that
    has a positive divergence, meaning more fluid is flowing out than in, will have
    its pressure dropped, and any cell that has a negative divergence will have its
    pressure raised. This process can then be iterated until the candidate velocity
    field has an acceptably small divergence in every cell. Since pressure updates
    can be done independently in every cell, this approach distributes well over parallel
    processors, and therefore is easily implemented in a graphics processor.


    The constants needed to perform this algorithm are derived from the Navier-Stokes
    equations, looking only at the pressure and velocity terms. The fluid acceleration
    due to the pressure gradient is


    ```

    $$\dot{\mathbf{u}} =-\frac{1}{\rho}\nabla p.$

    ```'
