    # 10.3.1 Handling Multiple Contacting Rigid Bodies


    It is not unusual for multiple contacts to exist in a rigid body simulation at
    the same time point. Each contact may be either a colliding contact or a resting
    contact, depending upon the relative velocities and accelerations between the
    bodies at the contact point. Assume that we have advanced the simulation clock
    to the point where there are no interpenetrations but several contacts coexist.
    Now, consider the contact point of two objects $a$ and $b$ that we covered in
    Section 10.1.2. Their relative velocity $v_{rel}^{/-}$ which is the difference
    in their velocities in the direction of the collision surface normal given by
    Equation 10.5, will be negative if the bodies are colliding, zero (within a tolerance)
    if the bodies are resting on each other, or if the bodies are receding from each
    other. If the bodies are receding, no action need be taken. If the bodies are
    colliding, they can be prevented from interpenetrating by applying the correct
    impulse. If the bodies are resting on each other, we need to look at their relative
    acceleration


    ```

    $a_{rel} = \hat{n} \cdot (\ddot{\mathbf{p}}_a - \ddot{\mathbf{p}}_b)$

    ```


    If this is true, the objects are accelerating away from each other already, and
    no action need to be taken. Otherwise, they must be prevented from interpenetrating
    by applying the correct contact force. Both the collision and resting contact
    problems can be solved using LCP formulation.


    The figure shows a 2D configuration of a fixed floor A, in contact with four rigid
    bodies B, C, D and E. Eight vertex-face contacts are shown in this configuration,
    with the direction of the surface normal at each contact indicated by arrows.
    An impulse or force exerted at any one of these contacts will produce a corresponding
    impulse or force that will be one of the other contacts. Therefore, the problem
    will require a simultaneous solution. This can be set up as an LCP, if we can
    determine the elements of the matrix $K$ and the vector $\mathbf{a}$ in Equation
