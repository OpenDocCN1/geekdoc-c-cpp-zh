    The other way in which steering can fail to prevent collision can be seen by examining
    the figure above. The vector between $\mathbf{x}_s$ and $\mathbf{x}_i$ actually
    passes through the expanded sphere, so if the correction $a^{\text{op}}$ is applied
    just once, a collision may occur (depending on the steering factor $r_p$). In
    a simulation, this normally not be a problem, a corrective acceleration will be
    recomputed at each timestep, iteratively refining the solution. However, if the
    speed of the particle is so large that it can reach the sphere in one or two timesteps,
    a collision may occur. A more perfect solution is to compute a tangent to the
    sphere that passes through the particle''s position, lies in the plane defined
    by the particle''s velocity and the vector to the sphere''s center, and is nearest
    to the closest point of approach $\mathbf{x}_{close}$. We leave the details as
    an exercise for the student.


    # 5.4 SUMMARY


    Here is a brief review of some the main concepts to take away from this chapter:


    +   * While a lot can be done with a particle system by making particle generators,
    gaining control over interesting motion requires the ability to choreograph particles
    to achieve a desired look or effect.


    +   * One way to organize thinking about particle choreography is to think in
    terms of operators, operating on the position and velocity of the particles.


    +   * Acceleration operators affect a particle''s velocity by applying accelerations.
    These are equivalent to applying forces. These can be used to produce effects
    such as gravitational attraction, random perturbations, and drag.


    +   * Velocity operators affect a particle''s position by applying velocity increments.
    Unlike forces, these do not result in a change in particle momentum, but simply
    affect a particle''s position. These can be used to produce effects such as vortices
    and affine transformations of the particles.


    +   * Potential fields can be used to prevent particle collisions with an object
    by applying forces pushing away from the object.


    +   * A more sophisticated approach to collision avoidance involves computing
    steering forces that tend to steer particles around an object.'
