  md: '# Numerical Integration 121


    In first-order Runge-Kutta integration we assume we have an initial state $\mathbf{S}$
    and want to compute future states. We can perform iterations as follows:


    $\mathbf{K}_1 = \mathbf{F}(\mathbf{S}^{[i]}),$

    $\mathbf{S}^{[i+1]} = \mathbf{S}^{[i]} + h\mathbf{K}_1$.


    Note that $\mathbf{F}(\mathbf{S}) = \dot{S}$, so RK1 is equivalent to the Euler
    integration we have seen repeatedly. We will extend this now to get a second-order
    method.

    We already seen the midpoint method for integration (Equation 7.3), which relies
    on knowing the derivative halfway through the timestep. In this, we would need
    to know $\dot{S}(t+0.5h) = \mathbf{F}(\mathbf{S}(t+0.5h))$. Unfortunately, since
    we do not know the state halfway through the timestep, we cannot compute the derivative
    of the state at that point, either. However, we can get an estimate of the state
    at that point, by just performing a half-Euler step. Then, we assume


    $\mathbf{S}(t+0.5h) \approx \mathbf{S}(t) + 0.5h\dot{\mathbf{S}}(t)$.


    This is the fundamental idea behind the higher-order RK methods: that we can approximate
    higher-order derivatives using previously computed derivatives. Using the above
    approximation of the derivative at the midpoint, we can write an approach for
    RK2 as:


    $\mathbf{K}_1 = \mathbf{F}(\mathbf{S}^{[i]}),$

    $\mathbf{K}_2 = \mathbf{F}(\mathbf{S}^{[i]} + 0.5h\mathbf{K}_1),$

    $\mathbf{S}^{[i+1]} = \mathbf{S}^{[i]} + h\mathbf{K}_2$.


    In other words, $\mathbf{K}_1$ is just the original derivative, and we use that
    to get an estimate of the state at the halfway point of the timestep, $\mathbf{S}^{[i]}
