    # 7.6 ADAPTIVE TIMESTEPS


    For interesting problems, the functions that we integrating can vary over time.
    Although linear functions are smooth everywhere and easy to integrate, interesting
    nonlinear functions can vary over time. At some times they might be "nicely" behaved,
    and easy to integrate with low-order integrators and larger timesteps, but at
    other times they might be complex, requiring higher-order integration and small
    timesteps.


    When we discuss integration, we usually do assuming we have some fixed timestep
    $h$. However, there is nothing stopping us from taking different timesteps for
