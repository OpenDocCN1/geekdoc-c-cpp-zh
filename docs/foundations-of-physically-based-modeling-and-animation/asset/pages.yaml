    # E.2 QUATERNION STRUCTURE


    Following this discussion of complex numbers, a quaternion is defined as


    ```

    $q = a+ib+jc+kd$,

    ```


    consisting of a real scalar part $a$ and three mutually orthogonal imaginary parts
    $b$, $c$, and $d$. The three corresponding imaginary units $i$, $j$, and $k$ are
    defined implicitly by the relations


    ```

    $i^2=-1, j^2=-1, k^2=-1$,n$ij=k, jk=i, ki=j$,n$ji=-k, kj=-i, ik=-j$.

    ```


    Following this definition, the product of two quaternions $q_1$ and $q_2$ is


    ```

    $q_1q_2=a_1a_2-(b_1b_2+c_1c_2+d_1d_2)\n+(a_1b_2+b_1a_2+c_1d_2-d_1c_2)\n+j(a_1c_2+c_1a_2+b_1d_2-d_1b_2)\n+k(a_1d_2+d_1a_2+b_1c_2-c_1b_2)$.

    ```


    A compact alternate representation of the quaternion is


    ```

    $q=(s,\mathbf{u}),$.

    ```


    where $s=a$ is the real part of the quaternion, and the 3D vector $\mathbf{u}=[b,c,d]^T$
    encodes the two imaginary parts. With this representation, the product is defined
    as


    ```

    $q_1q_2=(s_1,\mathbf{u}_1)(s_2,\mathbf{u}_2)=(s_1s_2-\mathbf{u}_1\cdot\mathbf{u}_2,s_1\mathbf{u}_2+s_2\mathbf{u}_1+\mathbf{u}_1\times\mathbf{u}_2)$.

    ```


    The reader is invited to carry out the operations in this definition to verify
    that this product rule for the scalar-vector form of the quaternion produces a
    result that is identical to the product obtained in the real-imaginary form.


    By factoring out the magnitude of the quaternion we can arrive at a polar form,
    similar to the polar form of the complex numbers. This is


    ```

    $q=r(\cos\theta,\mathbf{u}\sin\theta)$,

    ```'
