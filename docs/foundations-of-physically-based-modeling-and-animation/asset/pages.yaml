  md: '# Finite Difference Algorithms 313


    normal to the boundary. Walls also exert, resisting the flow of fluid, so we will
    also have to establish conditions on the boundary cells affecting the rate of
    flow parallel to the boundary. We will assume that the pressure in each boundary
    cell will be identical to the pressure in the fluid cell adjacent to it, so boundary
    cells do not need to be calculated. The three white cells at the top are empty,
    containing no fluid to be simulated. For example, in a water simulation, these
    cells would contain only air. The light gray cells contain fluid, but are considered
    to be surface cells, since they have at least one face adjacent to an empty cell.
    An empty cell is given a vector index, because it is possible, when we advance
    a timestep, fluid begin flowing into them from the external space. Since surface
    cells are adjacent to the external space, their pressures will be the same as
    the ambient pressure with the ambient air $p_a$. Therefore, the pressures of surface
    cells do not need to be calculated. The remaining six dark gray cells are the
    full cells containing only the fluid we are simulating, and for which we will
    need to compute a pressure. The assumptions about empty, surface, and boundary
    cells will provide boundary conditions for the pressure computation.


    The cell numbering, shown in the diagram, is similar to the one used in the smoke
    simulation example. Given indexing scheme, Equation 15.6 would be rewritten


    ```

    $$\nabla^2 := \begin{array}{c|cc} \Phi_0 & & \nabla w_{3|0} \ \Phi_1 & & \nabla
    w_{3|1} \ \hline & & \vdots \ \Phi_5 & & \nabla w_{3|5} \ \Phi_6 & & \frac{l}{p_a}
    \end{array}$ $(15.9)$

    ```


    Note that all cells share the same pressure, and thus the same $\phi$ value, so
    we only include $\Phi_i$ in the vector of $\phi$ values. Because of this, the
    matrix will not be strictly a Laplacian matrix, but will be a $6\times6$ Laplacian
    matrix augmented by an extra row and column for the cell $\phi_6 = \frac{l}{p_a}$.


    # Computing divergences


    the divergence in each of the six cells will be computed in the smoke simulation,
    accounting for the fact that there can be no flow into or out of a boundary cell.
    For example, the divergence in the cell 4 would be


    ```

    $$\nabla \cdot w_{3|4} = \frac{u_5-u_4}{\Delta x} + \frac{v_7-v_4}{\Delta x}$

    ```


    but for cell 3, which is next to the wall,


    ```

    $$\nabla \cdot w_{3|3} = \frac{u_4-0}{\Delta x} + \frac{v_6-v_3}{\Delta x}$

    ```


