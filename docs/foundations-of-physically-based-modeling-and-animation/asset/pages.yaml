  md: "# 164 Foundations of Physically Based Modeling and Animation\n\nSince there\
    \ are no outside forces acting on the triangle-spring system, it must be true\
    \ that\n\n$\\mathbf{f}_0 + \\mathbf{f}_1 + \\mathbf{f}_2 + \\mathbf{f}_3 = 0.$\n\
    \nIf this were not true, the center of mass of the body would be able to accelerate\
    \ only due to forces being generated within the body. Thus, if we can find three\
    \ of the forces, the thrice is uniquely determined. We will use this fact in the\
    \ analysis, first finding $\\mathbf{f}_1$, $\\mathbf{f}_2$, and $\\mathbf{f}_3$,\
    \ so that\n\n$\\mathbf{f}_0 = -(\\mathbf{f}_1 + \\mathbf{f}_2 + \\mathbf{f}_3).$\n\
    \nSince the forces $\\mathbf{f}_2$ and $\\mathbf{f}_3$ at the two outside vertices\
    \ are produced by the torque, they must be parallel to the surface normals $\\\
    mathbf{\\hat{n}}_1$ and $\\mathbf{\\hat{n}}_2$. Looking at the force on the outside\
    \ vertex of the left triangle, the torque-force relationship 8.1 gives,\n\n$\\\
    tau = \\mathbf{r}_l \times \\mathbf{f}_2.$\n\nTaking the dot product of both sides\
    \ with the hinge vector, and factoring out the magnitude of the vector $\\mathbf{r}_l$\
    \ gives\n\n$\\frac{\\mathbf{t} \\cdot \\mathbf{\\hat{h}}}{\\|\\mathbf{r}_l\\}\
    \ = (\\mathbf{r}_l \\times \\mathbf{f}_2) \\cdot \\mathbf{\\hat{h}}.$\n\nNow,\
    \ $\\mathbf{\\hat{r}}_l$, $\\mathbf{f}_2$, and $\\mathbf{\\hat{h}}$ are all mutually\
    \ orthogonal, and the direction of $\\mathbf{f}_2$ is parallel to the surface\
    \ normal of the left triangle, we have\n\n$\\mathbf{f}_2 = \\frac{\\mathbf{t}\
    \ \\cdot \\mathbf{\\hat{n}}_2}{\\|\\mathbf{r}_l\\}}.$\n\nThe force $\\mathbf{f}_3$\
    \ on the outside vertex of the right triangle is found in similar fashion, beginning\
    \ with the relationship\n\n$\\tau = \\mathbf{r}_r \\times \\mathbf{f}_3.$\n\n\
    and yielding\n\n$\\mathbf{f}_3 = \\frac{\\mathbf{t} \\cdot \\mathbf{\\hat{h}}}{\\\
    |\\mathbf{r}_r\\}} \\mathbf{\\hat{n}}_r.$\n\nThis gives us two of the required\
    \ forces. To find a third, we will look at the balance of torques in the system.\n\
    \nAlthough we have not yet determined all of them, we have four forces acting\
    \ on the hinged pair of triangles, if considered with respect to any arbitrary\
    \ point in the system must result in four torques, $\\tau_0$, $\tau_1$, $\tau_2$,\
    \ and $\tau_3$. Just as the four forces must balance so that there is no net acceleration\
    \ on the system, the four resultant torques must balance, so that the system does\
    \ not experience a change in angular momentum coming from torques generated strictly\
    \ within the system. Therefore, we can write the torque balance equation\n\n$\\\
    tau_0 + \\tau_1 + \\tau_2 + \\tau_3 = 0.$"
