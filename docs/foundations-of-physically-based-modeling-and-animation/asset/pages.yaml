  md: '# Matrix Algebra


    ALTHOUGH IT IS THE INTENT OF THIS BOOK to be reasonably self-contained, the subject
    of matrices and matrix algebra is a complex topic, subsumed under the field of
    linear algebra. What we are attempting in this section is to give a simple, and
    practical overview of the basic principles of matrix algebra that will be essential
    to the introductory study of physically based animation. The student who wishes
    to go on in computer graphics is strongly encouraged to make a thorough study
    of linear algebra, since it furnishes many of the key mathematical tools necessary
    to understand advanced techniques and research papers in the field.


    # B.1 MATRIX DEFINITIONS


    A single real number is called a *scalar*. If we have a column of scalars, we
    have a *vector*. A set of vectors, each with the same number of entries and arranged
    in a rectangular array is called a *matrix*. This construction can be continued
    to higher dimensions, collecting a set of matrices together to form a *tensor*.
    Absolutely, all of these objects are considered to be tensors of various orders:
    a scalar is an order 0 tensor, a vector an order 1, and a matrix an order 2 tensor.


    The individual scalars making up a matrix are called its elements. An arrangement
    of $n$ horizontal rows, and $m$ vertical columns is called $n \times m$ matrix.
    An example would be the matrix


    ```

    $M = \begin{bmatrix} a & b & c \ d & e & f \ g & h & i \end{bmatrix}$.$

    ```


    $M$''s elements are the scalars $a$ through $i$, whose values are real numbers.
    $M$ is a $3 \times 3$ matrix, consisting of the rows:


    $[a b c], [d e f], [g h i]; $


    > *Please note the construction of the plural: one matrix, two matrices.'
