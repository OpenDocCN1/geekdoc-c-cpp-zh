  md: '# 22 Foundations of Physically Based Modeling and Animation


    object appears to hit and immediately “bounce” without deforming. For this reason,
    in physically based animation, collisions between rigid objects are usually treated
    as instantaneous events, resulting in velocities, rather than continuous processes
    involving deformation forces and accelerations.


    Different models have been used for handling collisions, and the process becomes
    more involved once we are dealing with objects that can rotate. For our ball simulation
    example, though, we will keep things simple. We assume the ball does not rotate,
    but it is effectively a point with a radius. A discussion of collisions involving
    rotation will be given in Section 10.1.


    In terms of handling collisions, there are three distinct phases that we must
    deal with. While these phases are sometimes handled together, it is useful to
    realize that they are really distinct. Depending on the situation, different methods
    might be used for each phase, and they can occur at different points in the simulation.
    The phases are


    +   1. Collision Detection: Did a collision occur or not?


    +   2. Collision Determination: Exactly where and when did this collision occur?


    +   3. Collision Response: What is the resulting effect of the collision?


    We will describe initially how the first two phases, collision detection and collision
    determination, are handled when the collision is between the ball and an infinite
    plane. We will then describe how the simulation loop is affected by the need to
    deal with collisions. Later, in Section 3.2 we examine collision response, and
    in Section 3.3 we discuss implementation. Finally, in Section 3.5 we discuss how
    the handling of collisions differs if the objects are finite polygons, rather
    than infinite planes.


    # 3.1.1 Collision Detection


    Collision detection is the process of determining whether or not a collision occurs.
    In some situations, the detection process is the only thing one cares about, such
    as in a game where you want to determine if a shot hit a target or not. However,
    in most animation it is just the first phase of the collision process. If there
    is no collision, the later phases are not necessary.


    We will begin with a simple 1D situation, and then extend it to an arbitrary infinite
    plane. Suppose that we have a moving ball whose center is at position $y$, and
    there is a barrier at position $b$. To begin, let us not concern ourselves with
    the ball’s radius, but just think of it as a point in space. During our simulation
    process, we can determine easily which side of the barrier center of the ball
    is on by examining the sign of $y - b$. If the sign is positive, then y$ is on
    one side; if it is negative it is on the other,


    ![](img/b434947f68660f7e26f8700ff77023a5_44_0.png)'
