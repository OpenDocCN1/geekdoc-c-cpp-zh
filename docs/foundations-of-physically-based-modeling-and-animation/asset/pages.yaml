- img_proc: true
  md: 'Since there is nothing in the system tending to keep the angles at the vertices
    at 90°, the cube can collapse, as depicted above. In fact, it can flatten completely,
    so that all of its faces lie in a single plane. This is clearly not the behavior
    that we would like from a springy object.


    Figure 8.5 shows one approach that can be used to provide some structural stability
    to a springy. The left column shows a diamond with its edges replaced by struts,
    and two ways that the diamond can be deformed. It can hinge within the plane of
    the diamond, shearing it in either direction until it collapses into a single
    line. It can also hinge out of the plane of the diamond by rotating about an axis
    formed by either of its diagonals. In the extreme, it can collapse into a single
    line by rotating through a full 180°. The in-plane shearing problem can be fixed
    by attaching an additional strut across one of the diagonals. However, this does
    not fix the out-of-plane problem. Both problems are solved by inserting struts
    across both diagonals.


    One way of guaranteeing structural stability is to connect pair of vertices with
    a strut. Considering the cube, cube could be given structural integrity by adding
    sixteen struts connected each of the 12 face diagonals, and four across the internal
    diagonals of the cube. The resulting connections create too much clutter to show
    in a diagram, but are easy to imagine. Often, however, structural integrity can
    be achieved with significantly fewer struts. For example, in the cube, integrity
    can be achieved by adding just the four internal diagonals, or


    ![](img/b434947f68660f7e26f8700ff77023a5_181_0.png)


    FIGURE 8.5 Adding reinforcing struts can solve the in-plane and out-of-plane rigidity
    problem with springy meshes.'
