    #  8.6 LATTICE DEFORMERS


    From the above discussion, it should be clear that building a structurally stable
    spring mesh, for a complex geometric model, will require thousands of struts and
    torsional springs. Even worse, a refined model, containing many very small triangles,
    will result in very short struts, whose spring constants are very large, and whose
    vertex masses are small. Since the vibration of these periods $(P = 2\pi\sqrt{m/k})$
    decreases with increasing spring constant $k$ and also decreases with decreasing
    mass $m$, tiny lattices will have very short periods of oscillation $P$. Since
    the simulation timestep $h$ must be a fraction of this period, we will only have
    to do computations for large numbers of elements, but we must use a very small
    timestep to avoid instability. For detailed models, these factors combine to make
    meshes very computationally expensive.


    A lattice deformer provides a mechanism for applying the spring-mesh ideas to
    highly complex models without incurring the cost of providing struts. The idea
    is to embed the model in a rectangular lattice, make the lattice into a spring
    object, simulate the lattice deformation, and move the model vertices so that
    they maintain a fixed position relative to the lattice. The above figure shows
    this idea in 2D. Using this approach, the simulation is only reducing the number
    of struts needed by orders of magnitude, and eliminating struts with very short
    lengths. The main idea behind lattice deformers was introduced to the graphics
    community by Sederberg and Parry [1986], who presented a modeling method that


    ![](img/b434947f68660f7e26f8700ff77023a5_198_0.png)'
