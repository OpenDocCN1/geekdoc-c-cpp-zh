    of the medium.


    # 13.2.2 Gradient


    Given a scalar field ϕ(x), we can use this to obtain a vector field ϕ(x), giving
    us a vector value at every position where the function is defined. The operator
    ∇ is known as the gradient operator and in 3D Cartesian space is defined


    ```

    \nabla = \frac{\frac{\partial}{\partial x}}{\frac{\partial}{\partial y}}{\frac{\partial}{\partial
    z}}

    ```


    From this definition it is apparent that the gradient operating on a scalar field
    forms a 3D vector from the spatial partial derivatives of that field, taken in
    the $x$, y, and z directions. For example, the gradient of a scalar field ϕ is


    ```

    \phi = \frac{\frac{\partial}{\partial x}}{\frac{\partial}{\partial y}}{\frac{\partial}{\partial
    z}}

    ```


    Since $\frac{\partial\phi}{\partial x}$, $\frac{\partial\phi}{\partial y}$, and
    indicate the local spatial rate of change in the scalar field if we move in the
    $x, y$, or $z$ direction, the gradient at a point determines how the scalar field
    is changing spatially.


    A way of understanding the gradient is to think of the scalar field as denoting
    height over a surface. Thought of in this way, the gradient of the scalar field
    is a vector that always points in the direction of steepest ascent from the point
    at which the gradient is taken. Conversely, the negative of the gradient points
    in the direction of steepest descent.


    Another way of thinking of the gradient, at a point in space, is as a velocity
    that determines the speed and direction at which a massless particle would begin
    to move if placed in the scalar field at that point. A simple example will help
    to explain this.'
