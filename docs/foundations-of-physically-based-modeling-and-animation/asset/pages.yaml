    # 6.4.1 Clustering


    All of the algorithms for speeding up gravitational interaction calculations capitalize
    on the fact that gravitational attraction falls off with the square of the distance
    between objects. Thus, if particles are far from each other the force of attraction
    becomes very weak. This might suggest that we simply discount the accelerations
    due to particles, by setting a maximum distance beyond which interactions are
    ignored. Although there are systems where this idea will work well, since it does
    not account for the bulk effect of a large number of far particles exerting a
    strong attraction over a large distance. For example, a galaxy with 10 billion
    stars that is 100,000 light years away, that is only a single light year away.
    However, we can exploit clustering far away particles together to achieve big
    computational savings.


