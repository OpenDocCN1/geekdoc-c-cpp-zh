    # 15.2 THE SEMI-LAGRANGIAN METHOD


    The semi-Lagrangian method for fluid simulation is fundamentally an Eulerian method,
    with a Lagrangian approach to computing advection in the fluid. Eulerian fluid
    simulation was first introduced to the graphics community by Foster and Metaxas
    [1996], in their paper Realistic Animation of Fluids. The semi-Lagrangian algorithm
    followed the main ideas of this but resolved several of its numerical problems.
    The technique was introduced to the graphics community in the seminal paper by
    Stam [1999], entitled Visual Simulation of Smoke. Stam, in another key, along
    with Fedkiw and Jensen [Fedkiw et al., 2001] extended the method to enhance vorticity
    accuracy, using an approach known as vorticity confinement. This adds interesting
    visual complexity to the flow, which tends to be damped out by the original method.
    Figure 15.1 shows two examples of a smoke simulation using a modified version
    of the algorithm proposed by Stam. The simulation on the left uses a low-resolution
    spatial grid. The simulation on the right uses a higher-resolution grid and captures
    more fine detail.


    The Navier-Stokes equations for incompressible flow are repeated here for convenience.
    They are the momentum Equation 13.4,


    ```

    $$\dot{\mathbf{u}} = -(\mathbf{u} \cdot \nabla)\mathbf{u} - \frac{1}{\rho}\nabla
    p + \nu\nabla^2\mathbf{u} + \mathbf{g},$$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_323_0.png)


    FIGURE 15.1 Semi-Lagrangian smoke simulations done at two spatial resolutions.
    (a) Low resolution, (b) high resolution. (Courtesy of Ruoguan Huang.)'
  merge: -1
  pgno: 323
- img_proc: true
