    \n# 12.5 SPATIAL ISOLATED QUANTITIES\n\nThe *spatial isolated quantities* of a\
    \ link incorporate its mechanical properties the link is considered on its own,\
    \ ignoring its inboard and outboard connections.\n\nWe define the *spatial isolated\
    \ inertia* of link $i$ with mass $m_i$ and moment of inertia tensor $\\mathbf{I}_i$\
    \ as\n\n```\n$$\\tilde{\\mathbf{I}}_i = \\begin{bmatrix} 0 & M_i \\ I_i & 0 \\\
    end{bmatrix},$$\n```\n\nwhere **1** is the $3 \\times 3$ identity matrix, **0**\
    \ is the $3 \\times 3$ matrix of 0's, and $M_i = m_i\\mathbf{1}$ is called the\
    \ matricized mass of the link.\n\nWe define the *spatial zero acceleration force*,\
    \ as the force that would have been applied at the inboard to keep the link from\
    \ accelerating. If $\\mathbf{f}_i$ is the sum of all forces acting externally\
    \ on the link, and $\boldsymbol{\tau}_i$ is the sum of all torques induced at\
    \ the link's center of mass due to forces, then the force needed to counter the\
    \ applied forces is $-\\mathbf{f}_i$, and the torque needed is $-\boldsymbol{\t\
    au}_i$. If the link is rotating with angular velocity $\\omega_i$, its instantaneous\
    \ rate of translational momentum due to this angular velocity will be $\\omega_i\
    \ \\times m_i\\mathbf{v}_i$, and its instantaneous rate of angular momentum will\
    \ be $\\omega_i \\times I_i\\omega_i$. Therefore, the spatial zero acceleration\
    \ force to oppose these forces would be\n\n```\n$$\\dot{\\mathbf{z}}_i = \\begin{bmatrix}\
    \ \\omega_i \\times m_i\\mathbf{v}_i - \\mathbf{f}_i \\ \\omega_i \\times I_i\\\
    omega_i - \\boldsymbol{\tau}_i \\end{bmatrix},$$\n```\n\nIf we define the spatial\
    \ force to be\n\n```\n$$\\tilde{\\mathbf{f}}_i = \\begin{bmatrix} \\mathbf{f}_i\
    \ \\ \\boldsymbol{\tau}_i \\end{bmatrix},$$\n```\n\nthen the spatial zero acceleration\
    \ force can be written as\n\n```\n$$\\dot{\\mathbf{z}}_i = \\tilde{\\mathbf{v}}_i\
    \ \\times \\tilde{\\mathbf{I}}_i\\tilde{\\mathbf{v}}_i - \\tilde{\\mathbf{f}}_i.$\n\
    ```\n\n# 12.6 FIRST OUTWARD LOOP\n\nThe algorithm to perform the first outward\
    \ loop is given in Figure 12.1. It follows closely the algorithm outlined by Kokkevis\
