  md: '# 252 ■ Foundations of Physically Based Modeling and Animation


    of the joint''s configuration parameter $q_i$ is considered. For a prismatic joint


    ```

    $\omega_i^0 = \mathbf{0}$, and

    $\mathbf{v}_i^0 = \dot{q}_i\mathbf{\hat{u}}_i$, \quad (12.1)

    ```


    and for a revolute joint


    ```

    $\omega_i^0 = \dot{q}_i\mathbf{\hat{u}}_i$, and

    $\mathbf{v}_i^0 = \dot{q}_i\mathbf{\hat{u}}_i \times \mathbf{d}_i$. \quad (12.2)

    ```


    To understand this last equation, recall from Section 9.1 that the derivative
    of a vector $\mathbf{a}$ undergoing pure rotation with angular velocity $\mathbf{\omega}$
    is given by $\dot{\mathbf{a}} = \mathbf{\omega} \times \mathbf{a}$, and note that
    $\dot{\hat{u}}_i$ is the angular velocity of joint $i$.


    The state of each link can be defined inductively, starting at the root and working
    out. To simplify the notation, we will assume that vectors have already been transformed
    into the model space of link $i$. The root link will have a specified position
    $\mathbf{x}_0$, and its velocities will


    ```

    $\mathbf{\omega}_0 = \mathbf{0}$, and $\mathbf{v}_0 = \mathbf{0}$.

    ```


    At each subsequent link,


    ```

    $\mathbf{X}_i = \mathbf{X}_{i-1} + \mathbf{r}_i$,

    $\mathbf{\omega}_i = \mathbf{\omega}_{i-1} + \mathbf{\omega}_i^0$, and

    $\mathbf{v}_i = \mathbf{v}_{i-1} + \mathbf{\omega}_{i-1} \times \mathbf{r}_i +
    \mathbf{v}_i^0$. \quad (12.3)

    ```


    We see that the state of the entire chain is uniquely determined from its configuration
    $\mathbf{q}$ and its rate of change $\dot{\mathbf{q}}$, using Equations 12.1,
    12.2, and 12.3.


    The acceleration of the configuration can be determined by differentiating the
    rotational and translational velocities to obtain the rotational acceleration
    $\alpha$ and translational acceleration $\mathbf{a}_i$. Since the vector $\mathbf{r}_i$
    in Equation 12.3 is both rotating and changing in length, its time derivative
    is $\dot{\mathbf{r}}_i = \mathbf{\omega}_{i-1} \times \mathbf{r}_i + \mathbf{v}_i^0$.
    Therefore, the link accelerations defined inductively are


    ```

    $\alpha_i = \alpha_{i-1} + \alpha_i^0$, and

    $\mathbf{a}_i = \mathbf{a}_{i-1} + \alpha_{i-1} \times \mathbf{r}_i + \mathbf{\omega}_{i-1}
    \times (\mathbf{\omega}_{i-1} \times \mathbf{r}_i) + \mathbf{\omega}_{i-1} \times
    \mathbf{v}_i^0 + \mathbf{a}_i^0$. \quad (12.4)

    ```


    In order to complete the computation of the accelerations for each joint $i$,
    we still need to determine the accelerations $\dot{\omega}_i^0$ and $\\mathbf{v}_i^0$.
    Differentiating Equation 12.1 for a prismatic joint we obtain


    ```

    $\mathbf{\omega}_i^0 = \mathbf{0}$, and

    $\mathbf{v}_i^0 = \dot{q}_i\mathbf{\hat{u}}_i + \mathbf{\omega}_{i-1} \times \dot{q}_i\mathbf{\hat{u}}_i$,
    \quad (12.5)

    ```'
