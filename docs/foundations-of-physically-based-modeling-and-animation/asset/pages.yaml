  md: '+   - Penalty methods approximate constrained dynamics by exerting forces in
    response to deviations from the desired constrained motion. These cannot provide
    hard constraints on the motion since they only act in response to an error that
    has already occurred.


    +   - The technique of Dynamic Constraints maintains hard constraints by introducing
    constraint forces canceling any applied forces that would tend to move the object
    out of constraint.


    +   - The technique of Reduced Coordinates guarantees that constraints are always
    met by posing the problem in a generalized coordinate frame in which disallowed
    degrees of freedom are removed from the problem. Any solution in this coordinate
    frame will be guaranteed to be in constraint.'
