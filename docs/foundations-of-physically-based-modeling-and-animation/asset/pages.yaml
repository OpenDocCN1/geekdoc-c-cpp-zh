    # 8.5 COLLISIONS


    Now that we are dealing with 3D objects with volume, and not just individual points,
    we need to reconsider how collisions work. There are two main differences from
    collisions of point objects (recall Section 3.1). First, the collisions will no
    longer be just a point hitting a surface, but rather involve more complicated
    geometric structures (vertices, edges, and faces); this will affect collision
    detection and determination. Second, the objects can now collide with each other,
    which is not the case for individual points moving around; this will affect collision
    response.'
