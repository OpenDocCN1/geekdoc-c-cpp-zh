- img_proc: true
  md: 'Looking at each of these accelerations in turn, we can make the following observations.
    The collision avoidance strength drops off as the inverse of distance, so the
    effect will be strong only when the boids are near to each other. This makes sense,
    since the objective is to keep the boids from crashing into each other, not to
    keep them far from each other. Since the effect is inversely proportional to distance,
    it becomes unbounded as the boids get near to each other. Therefore, in an implementation
    it will be a good idea to place a limit on the strength of this acceleration.
    It should be allowed to be quite large, but bounded to maintain the stability
    of the system. The velocity matching is not governed by distance, but goes to
    0 if the two velocities match exactly. Thus, the effect of this acceleration will
    be to cause the neighbors to turn and speed up or slow down until they are traveling
    in the same direction with the same speed. The centering acceleration increases
    with distance (note the use of $\hat{x}_{ij}$ not $\hat{x}_{ji}$), so the farther
    the neighbors are from each other, the more they will tend to move toward each
    other. The constants $k_a$, $k_v$, and $k_c$ should be adjusted to maintain flock
    coherence and not to pull all of the boids into a tight ball. Then, it is best
    to start by making $k_v$ and $k_c$ small and adjusting $k_a$ to keep the boids
    from colliding. Then, not so tightly coupled that the boids all seem to move identically.
    Finally, $k_c$ can be adjusted to keep the boids from drifting apart, but not
    so strongly pulled that they fly in too tight a group.


    Surprisingly, this simple algorithm can be used to support a variety of behaviors.
    Figure 6.5 shows two examples. Both the animation of schooling fish shown on the
    left and the runners shown on the right were coordinated by the same basic algorithm.
    The fish are following the algorithm in 3D, while, to manage the positions of
    the runners, the algorithm was constrained to operate on the 2D road surface.
    The animation of the runners'' body motions was produced by a commercial software
    package.


    ![](img/b434947f68660f7e26f8700ff77023a5_127_0.png)


    FIGURE 6.5 From left to right, fish schooling and runners racing. (Courtesy of
    Ashwin Bangalore, Sam Bryfczynski.)'
