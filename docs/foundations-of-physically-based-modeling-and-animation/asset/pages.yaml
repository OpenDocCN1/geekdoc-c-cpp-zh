  md: '# Foundations of Fluid Dynamics ■ 277


    can be made reduce the Navier-Stokes equations to a form that has straightforward
    solutions, but that, nevertheless, can be quite useful for describing complex
    wind fields in in animation applications.


    In Section 5.1, when we discussed the effect of wind on a particle, we assumed
    that there is a constant wind, blowing at a constant speed, in a constant direction.
    In this section, we expand this notion to wind fields, where the direction and
    speed of the wind are a function of position in space. In this way, the flow of
    particles can be shaped by the wind field. The idea for the approach presented
    here was first described by Weijchert and Haumann [1991].


    Potential flow is a mathematical abstraction, working from the Navier-Stokes equations,
    which makes the following assumptions:


    +   1. The flow is steady (meaning that the velocity field can vary spatially,
    it is not changing in time).


    +   2. The flow is inviscid (meaning that we ignore any effects due to fluid viscosity,
    i.e., v = 0).


    +   3. The flow is incompressible.


    +   4. The flow is irrotational.


    These assumptions have the following ramifications:


    +   1. Since the flow is steady, the velocity is a non-time-varying field u(**x**).


    +   2. Since the flow is inviscid, it will not become turbulent, so the flow can
    be modeled by a smooth function.


    +   3. Since the flow is incompressible, its divergence must be zero everywhere,
    i.e., ∇·u = 0.


    +   4. Since the flow is irrotational ∇ × u = 0, so the flow can be expressed
    as the gradient of a scalar field ϕ: u = ∇ϕ.


    Combining conditions 3 and 4, we have


    ```

    ∇·ϕ = 0, or

    ∇²ϕ = 0,

    ```


    which is known as Laplace''s equation. Any scalar field ϕ satisfying this equation,
    subject to any externally imposed boundary conditions, can be used for describing
    potential flow. Such solutions have been well studied and cataloged.'
