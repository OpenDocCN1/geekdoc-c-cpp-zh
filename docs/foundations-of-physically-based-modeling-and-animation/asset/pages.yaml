  md: '# 320 Foundations of Physically Based Modeling and Animation


    ParticleSystem FLIP(ParticleSystem P, Scene S, VectorField g, float rho, float
    h) begin


    ```

    ParticleSystem P_new;

    // Construct bounding region with dimensions W and origin x0 around

    // particles and to construct initial and final computational volumes

    // G0, and G1;

    (Vector3d W, Vector3d x0) = BoundingVolume(P);

    StaggeredGrid0(W, x0), G1(W, x0);


    // Average particle velocities onto the initial computational grid, and

    // classify cells as boundary, empty, surface, or full.

    G0 = AverageVelocitiesOntGrid(P, W. x0);

    G0 = ClassifyCells(G0, P, S);


    // Advance the velocity field one timestep using the external force,

    // diffusion, and pressure projection steps of the semi-Lagrangian

    // method, but omitting advection.

    G1 = VelocityUpdate(G0, g, h);


    // The difference between the initial and final grid velocities is used

    // to update the velocities (i.e., the momentum carried) by the particles.

    P_new = P;

    P_new.v += VelocityDifference(G1, G0);


    // Advect particles through the new velocity field by numerical integration.

    P_new.x = integrate(P_new, h);


    // Return updated fluid particle system.

    return P_new;

    ```


