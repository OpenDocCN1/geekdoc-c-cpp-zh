    method*. From looking at the figure above, it seems as the trapezoid can approximate
    the shape much closely (i.e., with less error), and this is in fact—it is a second-order
    method. The trapezoidal method also makes it possible to integrate functions that
    are linear (thus quadratic when integrated) exactly. From our examples in Chapter
    2, velocity was varying linearly. Thus, the trapezoidal method was able to integrate
    the velocity to find position perfectly.


    There are a variety of other integration techniques. Another second-order method
    is the Midpoint method, which can be written


    ```

    $s(t+h) = s(t) + \dot{s}(t+0.5h)h. \quad (7.3)$

    ```'
