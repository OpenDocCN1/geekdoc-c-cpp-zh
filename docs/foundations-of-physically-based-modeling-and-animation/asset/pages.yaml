  md: '# Numerical Integration 115


    the higher-order derivatives will not tend to grow in magnitude compensate. A
    typical way of expressing this error is $O(h^n)$, stating that as $h$ is changed,
    the error will change proportional to $h^n$. For a small $h$ value, the bigger
    $n$ is the better. Euler integration would grow O(h^2)$, for example, as the step
    size is halved, error goes down roughly by a factor of 4. This is actually not
    very good compared with some of the other methods we see.


    We can classify many integration schemes by order, which refers to how many levels
    of derivatives are represented in the Taylor series expansion. Euler integration
    is a first-order method, since it is correct up through the first derivative.
    In general, an n order method will have $O(h^{n+1})$


    ![](img/b434947f68660f7e26f8700ff77023a5_137_0.png)


    Another way of thinking about order is to understand the degree of the function
    that can be fit to the known data. A first-order function can reconstruct something
    that varies by a first-order (i.e., linear polynomial). The leftmost figure, above,
    is an example. If you recall the falling ball example in Chapter 2, you will notice
    that Euler integration perfectly reproduced the velocity, which was changing linearly.
    However, it could not reproduce the position, which was following a parabolic
    path. A second-order method (such as the one in Equation 2.5) was able to reproduce
    the position exactly. The middle figure, above, provides an example of the path
    a second-order method could reproduce. At right is an example of a third-order
    method, where we begin having points, i.e., the second derivative can change signs
    and thus the curve can "wiggle".


    Although we speak about them in different ways when using them in simulation,
    the integration techniques we have are similar to those you have learned when
    first integration in calculus. You may recall that one of estimating the area
    under a curve is to put a large number of rectangular boxes under the curve and
    add up the area of those boxes. If we imagine the $x$ axis is time, and the $y$
    axis is our function $f$, the process of simulating over time is equivalent to
    finding this area (and the "gaps" are the error we were discussing). The width
    of each box is our timestep, and as we decrease $h$, we get closer and closer
    to the actual area.


    If we form the rectangular boxes by setting the height to the value of $f$ at
