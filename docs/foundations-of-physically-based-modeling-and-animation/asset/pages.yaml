  md: '# Rigid Body Dynamics 195


    If we assume have a set of point masses, this matrix becomes


    ```

    I = \begin{bmatrix} \sum(y_i^2+z_i^2)m_i & -\sum(x_iy_i)m_i & -\sum(x_iz_i)m_i
    \ -\sum(x_iy_i)m_i & \sum(x_i^2+z_i^2)m_i &-\sum(y_iz_i)m_i \ -\sum(x_iz_i)m_i
    & -\sum(y_iz_i)m_i & \sum(x_i^2+y_i^2)m_i \end{bmatrix}

    ```


    where $x_i, y_i,$ and $z_i$ are the $x_i, y,$ and $z$ coordinates of the $i^{th}$
    point and $m_i$ is its mass.


    Again, there is more than one way to compute this matrix in practice.


    **Voxelization:** If we have a voxelized object, as described in the center of
    mass computation, we can use these voxels to compute the moment of inertia, using
    the point-mass formulation given above. We will visit each voxel and sum its contribution
    to each the elements of the moment of inertia matrix. As with the center of mass,
    this not a precise method, but the finer the grid of voxels, the more accurate
    it will be. Also, if the masses are all equal, we can factor out that, and just
    multiply the whole matrix by $m_i$.


    **Direct Calculation:** The direct calculation of the moment of inertia for a
    triangulated object is somewhat complex. The essential process is similar to that
    of computing center mass directly: forming tetrahedra and then summing up the
    contribution from each. However, the contribution for a moment of inertia for
    each tetrahedron is more than the center of mass. Each tetrahedron will have its
    own local moment of inertia, which must then be offset from the center of mass
    of the object, using the parallel axis theorem. Other approaches involve rewriting
    volume integrals and surface integrals, and computing more quickly using.


    Specific procedures for computing this moment of inertia matrix directly are more
    than we will delve into here, but some good references for how to compute these
    are papers by Mirlich [1996a] and Eberly [2003].


    For some shapes, the moment of inertia is computable as a formula. For instance,
    the moment of inertia tensor for a solid sphere is


    ```

    I = \begin{bmatrix} \frac{2}{5}mr^2 & 0 & 0 \ 0 & \frac{2}{5}mr^2 & 0 \ 0 & 0
    & \frac{2}{5}mr^2 \end{bmatrix},

    ```


    and for a solid box of length $l$ in $x, w$ in $z,$ and $h$ in $y$ is


    ```

    I = \begin{bmatrix} \frac{m}{12}(w^2+h^2) & 0 & 0 \ 0 & \frac{m}{12}(l^2+w^2)
    & 0 \ 0 & 0 & \frac{m}{12}(l^2+h^2) \end{bmatrix}

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_217_0.png)'
