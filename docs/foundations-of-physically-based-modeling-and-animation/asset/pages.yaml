    # 9.3.1 Torque


    Torque is the rotational analogy to force. Just as force induces a change in linear
    momentum, torque induces a change in angular momentum, so


    $$\tau = \dot{L}$


    In other words, torque is the basic measure for change in angular momentum. To
    understand the motion of rigid bodies, it is necessary to understand the relationship
    between torque and force.


    Given an object with center of mass **x**, imagine we are applying a force **f**
    at a point **p**. Any force applied to a rigid body at a position other than the
    center of mass will induce a torque. To determine this torque, we first form what
    is called the moment arm, **r = p - x**, i.e., the vector from the center to the
    point of application of the force. The resulting torque is given


    $$\tau = r \times f$.


    Notice a few things about torque. First, its magnitude is proportional to both
    the force and to the length of the moment arm. A longer moment arm will mean a
    greater torque, even with the same applied force. This is the familiar principle
    of the lever that goes back to Archimedes. Also, the more perpendicular the force
    is to the moment arm, the stronger the torque, since the cross-product scales
    the force with the sine of the angle between the moment arm and the force. Finally,
    notice that the torque is a vector quantity whose direction is perpendicular to
    both'
