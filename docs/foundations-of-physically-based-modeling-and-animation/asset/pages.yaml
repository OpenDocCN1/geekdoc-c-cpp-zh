  md: '# 160 Foundations of Physically Based Modeling and Animation


    by adding one diagonal strut on each of the six faces. The choice of which support
    struts to add and what parameters to use for each can play a major role in the
    overall behavior of the object.


    Note that these support struts might not have an associated face in the strut
    array. For example, internal diagonal struts associated with a cube do not have
    any associated face, and if both diagonals are used across each of the six cube
    faces, they cannot be associated with faces.


    Another approach to providing structural stability is to take advantage of the
    fact that a springy tetrahedron, built with a strut for each edge, will always
    tend to maintain its shape. It cannot collapse, because rotations at a vertex
    are inherently countered by the other edges. Therefore, if a geometric object
    can be represented by a set of tetrahedra it will form a spring object that will
    be able to maintain its shape, if the faces of the cube cut diagonally to form
    12 triangles, and the corners of these triangles are connected to a single vertex
    at the center of the cube, the cube will be formed from the resulting 12 tetrahedra,
    and will be able to maintain its shape.


    ![](img/b434947f68660f7e26f8700ff77023a5_182_0.png)


    # 8.3 TORSIONAL SPRINGS


    The problem with fixing the structural problems of a springy mesh by adding cross-diagonal
    struts, or building out of tetrahedra, is neither approach scales easily to objects
    much more complex than a cube. For example, building a stable mesh to model a
    bunny or a teapot would be extremely complex, and involve a huge number of extra
    struts. Using tetrahedra to fill the tile volume is a better idea, but still highly
    complex. In this section, we present a different approach that is relatively easy
    to implement.


    The structural stability of a springy object could be assured if, wherever polygons
    on the object''s surface share a common edge, the angle between these adjacent
    faces is maintained. A method for doing this, which is consistent with the use
    of springs to maintain edge lengths, is to introduce torsional springs across
    all adjacent faces. Since the analysis is simplified if the polygonal faces are
    all triangles, we will consider only this. This is generally sufficient, because
    most geometric models are constructed from triangles, or from polygons, like quadrilaterals,
    which are subdivided into triangles.


    The figure to the right shows conceptually how torsional spring works. Two triangles
    are connected along an edge that is like a hinge around the triangles can rotate.
    The torsional spring is attached on each end to a triangle face, so that when
    the triangles are rotated around the hinge, with respect to each other, a torque
    is exerted by the spring. This torque tends to rotate the triangles back to the
    position where the angle between the faces matches the rest


    ![](img/b434947f68660f7e26f8700ff77023a5_182_1.png)'
