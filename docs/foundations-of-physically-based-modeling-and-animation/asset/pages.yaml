  md: '# 8.5.1 Types of Collisions


    Our objects, both the ones undergoing simulation and those in the static environment,
    are represented as sets of vertices, edges, and faces. In order to find collisions,
    we need to be able to recognize them between each of the different types of geometric
    structures. Thus, we might need to check whether the faces, edges, and vertices
    of one object are colliding with the faces, edges, and vertices of another. So,
    there would be nine combinations of collision types to handle.


    Fortunately, this problem can be simplified considerably by understanding the
    concept of *genericity*. Genericity refers to objects being “general position,”
    which you can think of, roughly, as an object being in a position where any slight
    perturbation does not change the nature of its interaction with the stuff around.
    Objects in general position are said to be degenerate configurations. In the figure,
    objects A and B are in a general position with respect to each other, since either
    object can move with the plane in any direction, without changing the fact that
    a vertex of A is in contact with a face of B. Objects C and D are in a degenerate
    configuration, with a vertex of C in contact with an edge of D. Moving object
    C slightly to the left changes the contact from a vertex-edge to a vertex-face
    contact, moving it slightly to the right breaks the contact completely, moving
    it to the right and changes the contact to an edge-edge contact. Objects positioned
    in a truly random fashion will never be in degenerate configurations.


    ![](img/b434947f68660f7e26f8700ff77023a5_191_0.png)


    If you consider the ways that two objects can collide, it should quickly become
    apparent that there are only two generic types of collisions: between vertices
    and faces, and between pairs of edges. The other types of collisions are all degenerate,
    so that a very small perturbation will remove them as possibilities. We summarize
    the results in the following table, where V, E, and F refer to vertices, edges,
    and G and D refer to general position and degenerate.


    | Object A |

    | | V E F |

    | | Object B D D G |

    | | E G D |

    | | F G D |


    In a practical sense, this means that we can build our collision detection and
    collision determination code to consider only vertex-face and edge-edge collisions.
    We will describe below how we find these collisions.'
