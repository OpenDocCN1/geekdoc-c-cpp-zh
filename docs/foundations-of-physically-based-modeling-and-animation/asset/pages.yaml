    Now, the total force on an individual particle can be written


    ```

    $$\mathbf{f}_i(S, t) = \sum_{j=0}^{m-1} f_i^j(s_i, t) + \sum_{k=0}^{n-1} \mathbf{g}_i^k(s_i,
    s_k, t),$$

    ```


    so the acceleration can be written


    ```

    $$\mathbf{a}_i = \frac{1}{m_i}\mathbf{f}_i(S, t).$$

    ```


    Finally, the rate of change of the state of the system can be expressed as the
    vector


    ```

    $$\dot{\mathbf{S}} = \begin{bmatrix} \mathbf{v}_0 \ \mathbf{v}_1 \ \vdots \ \mathbf{v}_{n-1}
    \ \mathbf{a}_0 \ \mathbf{a}_1 \ \vdots \ \mathbf{a}_{n-1} \end{bmatrix}.$$

    ```


    With all of this notational structure, we can construct the system dynamics function


    ```

    $$\dot{\mathbf{S}} = \mathbf{F}(S, t).$$ (6.7)$

    ```


    The system dynamics function returns the sum of all of the forces acting on the
    particle system, from the environment and between particles. We will see below
    how this is integrated into the simulation code.'
