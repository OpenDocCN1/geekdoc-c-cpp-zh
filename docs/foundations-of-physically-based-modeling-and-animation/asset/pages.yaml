    the air resistance force on a single particle, in that it is opposite to the direction
    of the velocity. Lift force is forced to be orthogonal to drag force. In the example
    figure, the triangle is moving to the left, and is oriented so it is tipped down
    in the direction of motion, so the lift force will push the triangle down. If,
    instead, the triangle is tipped up, the lift force would push it up.


    The magnitude of the lift and drag forces will be proportional to the square of
    the relative velocity of the polygon through the air, and to the effective area
    $A_l$ of the triangle. The actual area $A$ of the triangle, as demonstrated in
    Appendix F, is half the magnitude of the cross-product of any two of its edges.
    If the triangle''s normal and relative velocity are exactly aligned, in the top
    figure, the full area of the triangle must push through the air. If the triangle
    normal and relative velocity are orthogonal, in the bottom figure, the triangle
    is sliding through the air edge-on, so the effective area is 0. In, as indicated
    in the middle figure, the triangle''s effective area is the actual area of the
    triangle, scaled by the cosine of the angle between the triangle''s surface normal
    and the relative velocity vector, i.e.,


    ![](img/b434947f68660f7e26f8700ff77023a5_179_0.png)


    ```

    $A_e = A(\mathbf{\hat{n}} \cdot \mathbf{\hat{v}}_r)$

    ```


    , after some algebraic simplification, the drag and lift forces are given by


    ```

    $$\mathbf{f}_d = -C_d A (\mathbf{\hat{n}} \cdot \mathbf{v}_r) \mathbf{v}_r$, and$\n$$$\mathbf{f}_l
    = -C_l A (\mathbf{\hat{n}} \cdot \mathbf{v}_r) \left(\frac{\mathbf{\hat{n}} \times
    \mathbf{v}_r}{\|\mathbf{\hat{n}} \times \mathbf{v}_r\|}\right)$

    ```


    where $C_d$ and $C_l$ are drag and lift coefficients that are tunable by the user
    to obtain the desired behavior.


    Once the force is calculated for a triangle, the force needs to be propagated
    to the vertices. One way to do this is to apply force to each vertex proportional
    to the triangle angle associated with that vertex. Since the angles of a triangle
    always $180^\circ$, the fraction of the triangle''s mass distributed to its vertex
    with angle $\theta$, measured in degrees, will be $\frac{\theta}{180}$. For example,
    an equilateral triangle with three angles of $60^\circ$ will have each vertex
    receive one third of the total force, with a $30^\circ \times 60^\circ \times
    90^\circ$ triangle will have one vertex receiving one sixth of the force, another
    receiving one third, and the last receiving half.'
