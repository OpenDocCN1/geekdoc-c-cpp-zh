    value for $\lambda$ by a penalty term, using a PD controller that takes $c$ and
    $\dot{c}$ as its error signals. Augmenting Equation 11.10 by this controller gives


    ```

    $$\lambda = \frac{m\dot{\mathbf{x}}^2 + (\mathbf{x}-\mathbf{x}_0)\cdot\dot{\mathbf{x}}}{(\mathbf{x}-\mathbf{x}_0)^2}
