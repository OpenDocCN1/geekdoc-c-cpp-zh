  md: '# Finite Difference Algorithms ■ 307


    calculus, known as the Helmholtz-Hodge Decomposition (Bhatia et al., 2012). Briefly,
    the theorem states that any sufficiently smooth vector field w can always be decomposed
    into sum of two vector fields u and v, such that u is divergence free, and v is
    curl. In algebraic form,


    $$\mathbf{w} = \mathbf{u} + \mathbf{v},$$


    where


    $$\nabla \cdot \mathbf{u} = 0 \text{ and } \nabla \times \mathbf{v} = \mathbf{0}.$$


    Recall that for any curl vector field v, there exists a scalar field $\phi$ such
    that


    $$\mathbf{v} = \nabla \phi.$$$$


    Applying this fact to Equation 15.4 allows us to rewrite the Helmholtz-Hodge Decomposition
    as


    $$\mathbf{w} = \mathbf{u} + \nabla \phi.$$$


    Since $\nabla \cdot \mathbf{u} = 0$, the divergence of both sides of this equation
    gives us


    $$\nabla^2 \phi = \nabla \cdot \mathbf{w},$$


    which is in the form of a famous equation, known as the Poisson Equation, and
    for which there are well-established techniques for solving for the unknown scalar
    field $\phi$.


    We can use this result to project any smooth vector field w onto a nearby divergence
    free field u. First, solve Equation 15.6 for $\phi$. Then, it follows from Equation
    15.5 that subtracting the gradient of $\phi$ from $\mathbf{w}$ yields its divergence
    free component,


    $$\mathbf{u} = \mathbf{w} - \nabla \phi.$$$


    Because, from Equation 13.4, the rate of change of fluid velocity with respect
    to the gradient of pressure is


    $$\dot{\mathbf{u}} = \frac{1}{\rho} \nabla p,$$$


    the discrete change of velocity in one timestep $h$, due to the pressure gradient,


    $$\frac{\Delta \mathbf{u}}{\Delta t} = \frac{1}{\rho} \nabla p, \text{ or } \Delta
    \mathbf{u} = --\nabla \left(\frac{h}{\rho}\right) p,$$$


    after substituting $h = \Delta t$. From this, we see that the relationship of
    pressure to the scalar field $\phi$, within a scalar constant,


    $$\phi = \left(\frac{h}{\rho}\right) p.$$$'
