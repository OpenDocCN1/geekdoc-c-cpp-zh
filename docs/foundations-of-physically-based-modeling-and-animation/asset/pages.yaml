  md: '# 218 Foundations of Physically Based Modeling and Animation


    friction forces at contact points. First, however, we must develop a mathematical
    framework for looking at these sorts of problems.


    Consider the resting contact problem shown to the right. A ball of mass m and
    radius r is positioned with its center at x, above a surface defined by the normal
    $\hat{n}$, and a point on the surface p. The ball''s velocity is x, and it is
    accelerating with acceleration $\dot{x}$. A potential resting contact is established,
    if within small tolerance,


    ![](img/b434947f68660f7e26f8700ff77023a5_240_0.png)


    ```

    $(\mathbf{x}-\mathbf{p})}{\cdot\hat{n} = r$\n$\dot{\mathbf{x}}\cdot\hat{n} = 0$.

    ```


    Consider the component of the acceleration normal to the contact, before any force
    from the floor is applied, as


    ```

    $a^- = \dot{\mathbf{x}}\cdot\hat{n}$,

    ```


    and the component of the acceleration after any force from the floor is applied
    as $a^+$. For example, a ball resting on a horizontal floor and acting under gravitational
    acceleration $g$, $a^- = -g$ and $a^+ = 0$.


    ![](img/b434947f68660f7e26f8700ff77023a5_240_1.png)


    As indicated in this picture, there are two cases to be considered. Either the
    ball''s acceleration is opposite to the direction of the surface normal, making
    $a^-$ negative, or the acceleration is in the direction of the surface normal,
    making $a^-$ positive. If $a^+$ is positive, the floor will be nonnegative and
    exert an opposing force $f = -ma^-$, so that $a^+ = 0$. But, if $a^-$ is positive,
    the ball is accelerating away from the floor, so the floor can exert no force
    on the ball, therefore $f = 0$ and $a^+ = a^-$.


    This is the simplest example of a configuration that can be posed as a Linear
    Complementarity Problem, or of LCP. As an LCP, this problem is summarized by the
    linear relationship


    ```

    $$\frac{1}{m}f + a^+ = a^+$,

    ```


    subject to the conditions


    ```

    $a^+ \ge 0, f \ge 0,$ and $fa^+ = 0$.

    ```


    The condition that $a^+$ and $f$ be nonnegative, and the complementarity condition
    that either one or the other of $a^+$ or $f$ must be 0, provides enough constraints
    for the single Equation 10.7 to have for its two unknowns. The solution of this
    equation depends on the sign of $a^-$. If $a^- > 0$, the problem requires $f =
    0$ and therefore $a^+ = a^-$. But, if $a^- < 0$, the problem requires $a^+ = 0$
    and so $f = -ma^-$.'
