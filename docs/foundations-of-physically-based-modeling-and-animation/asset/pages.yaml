    ![](img/b434947f68660f7e26f8700ff77023a5_337_1.png)


    Following the logic used in the smoke simulation, but considering boundaries,
    the horizontal velocity entering cell 4 from the left is represented in the numerical
    integration by the equation


    ```

    $-u_{31} + \left(4 + \frac{\Delta x^2}{\Delta h}\right)u_{34} - u_{35} - u_{37}
    = \frac{\Delta x^2}{\Delta h}u_{24}$.

    ```


    Cell 7 has a similar structure but has 0 horizontal velocities in the adjacent
    boundary and entry cells. The horizontal velocity entering cell 5 from the left
    is represented by


    ```

    $-u_{32} - u_{34} + \left(4 + \frac{\Delta x^2}{\Delta h}\right)u_{35} - u_{38}
    = \frac{\Delta x^2}{\Delta h}u_{25}$,

    ```


