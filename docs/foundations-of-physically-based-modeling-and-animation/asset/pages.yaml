  md: "# 38 Foundations of Physically Based Modeling and Animation\n\nNote that in\
    \ all cases, after the projection, we relabel the coordinates $(x, y)$, so that\
    \ in 2D we are always working in the standard 2D $(x, y)$ frame.\n\n*Here is an\
    \ algorithm for making the inside-outside test that will work for any convex polygon.*\
    \ The algorithm should be organized in a loop that can be exited as soon as a\
    \ sign change is detected:\n\n+   1. Make the problem 2D by projecting all points\
    \ into a 2D coordinate plane.\n\n+   2. Compute a 2D edge vector for each vertex,\
    \ by subtracting this vertex from the next consecutive vertex.\n\n+   3. Compute\
    \ another 2D vector for each vertex by subtracting the vertex from $\\mathbf{x}_{hit}$.\n\
    \n+   4. Form a $2 \times 2$ matrix for each vertex using its edge vector as the\
    \ top row, and its vector toward $\\mathbf{x}_{hit}$ as the bottom row.\n\n+ \
    \  5. Compute the determinant of the matrix for each vertex.\n\n+   6. If the\
    \ signs of all the determinants are identical, then $\\mathbf{x}_{hit}$ must lie\
    \ inside the polygon.\n\nThis algorithm can be understood if we recognize that\
    \ each of the determinants being calculated above are equivalent to the $z$ components\
    \ of the cross-product of the edge vectors (extended to 3D by setting $z = 0$)\
    \ and the vectors toward $\\mathbf{x}_{hit}$. For example, the edge from $\\mathbf{p}_0$\
    \ to $\\mathbf{p}_1$, with vector $\\mathbf{x}_{hit}$ gives the determinant\n\n\
    ![](img/b434947f68660f7e26f8700ff77023a5_60_0.png)\n\n```\n$$\\begin{bmatrix}\
    \ x_1 - x_0 \\ x_{hit} - x_0 \\end{bmatrix} \\begin{bmatrix} y_1 - y_0 \\ y_{hit}\
    \ - y_0 \\end{bmatrix} = (x_1 - x_0)(y_{hit} - y_0) - (y_1 - y_0)(x_{hit} - x_0)$\n\
    ```\n\nLikewise, the cross-product between the vectors from $\\mathbf{p}_0$ to\
    \ $\\mathbf{p}_1$, and from $\\mathbf{p}_0$ to $\\mathbf{x}_{hit}$, extended to\
    \ 3D, gives the result:\n\n```\n$$\\begin{bmatrix} x_1 - x_0 \\ y_1 - y_0 \\end{bmatrix}\
    \ \\times \\begin{bmatrix} x_{hit} - x_0 \\ y_{hit} - y_0 \\end{bmatrix} = \\\
    begin{bmatrix} 0 \\ 0 \\ (x_1 - x_0)(y_{hit} - y_0) - (y_1 - y_0)(x_{hit} - x_0)\
    \ \\end{bmatrix}$\n```\n\nAs long as $\\mathbf{x}_{hit}$ lies inside the triangle,\
    \ these cross-products must either point out of the plane, or all point down into\
    \ the plane.\n\n> *This algorithm will not work correctly for a concave polygon.\
    \ This is a rarely problem, because in 3D graphics, geometry is almost always\
    \ built from convex polygons.*"
