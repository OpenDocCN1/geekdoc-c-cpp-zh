    If not done already in the collision determination phase, we should check the
    relative velocity between the objects in the normal direction, to ensure that
    the objects are moving toward each other. Since object a is is on the positive
    side of the normal, the requirement is that


    ```

    $v_{rel}^- < 0.$

    ```


    We will apply an impulse $J_a = j\hat{n}$ to object $a$, and the equal and opposite
    impulse $J_b = -j\hat{n}$ to object $b$. In the collision with a static object,
    our goal is to find the magnitude $j$ of this impulse.


    By following the derivation used to obtain Equation 10.4, but now including both
    bodies, we find the required impulse magnitude


    ```

    $j = \frac{-(1 + c_r)v_{rel}^-}{\frac{1}{m_a} + \frac{1}{m_b} + \hat{n} \cdot
    (I_a^{-1}(r_a \times \hat{n}) \times r_a + I_b^{-1}(r_b \times \hat{n}) \times
    r_b)} \quad (10.6)$

