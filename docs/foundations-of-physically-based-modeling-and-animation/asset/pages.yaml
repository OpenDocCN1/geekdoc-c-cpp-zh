  md: '# Follow the Bouncing Ball


    IN CHAPTER 2 COVERED THE BASICS OF CREATING a model and a simulation based on
    that model. Specifically, we saw how a falling ball could be modeled and simulated,
    including the notions of gravity, 3D motion, and wind resistance. But, objects
    in the real world are not free to fall endlessly; at some point they up colliding
    with other objects. A falling ball will inevitably hit the ground, and bounce.
    Studying approaches to handling such collisions will bring us to the point where
    we are able to simulate a ball bouncing around in a box. We will then extend these
    ideas to handling the ball bouncing off other objects in space.


    # 3.1 COLLISIONS WITH PLANES


    In order to improve our simulation of a ball moving in a real 3D environment,
    we first look at how to handle its collision with an infinite ground plane. Such
    a collision creates "break" in the standard simulation process: when the ball
    collides with another object, it no longer follows a path governed by the general
    equations of motion as we described above. Rather, the simulation must account
    for the nearly instantaneous change in motion due to the collision.


    Real collisions involve very large forces that are applied over a very short period
    of time. Even when two "rigid" objects collide, they will deform slightly as they
    hit, before internal forces in the objects reverse this deformation to return
    them to their original shape. This restoration forces cause the objects to separate.
    The high-speed photo of a golf ball being hit is a good example of this. If we
    were to accurately model all of the internal forces involved and look at extremely
    small timesteps, we potentially simulate the collision process in detail. However,
    this process happens so quickly, relative to the time frame of the motion we are
    trying to capture in an animation, that the effect seems instantaneous:


    ![](img/b434947f68660f7e26f8700ff77023a5_43_0.png)


    Image used by permission of Acushnet Company, MA.'
