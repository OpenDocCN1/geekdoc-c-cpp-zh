    method, there are software engineering issues. The most important of these is
    a consideration of how an integration scheme fits into the computational framework
    of the particular problem being worked on.


    A classical example of a situation where software engineering concerns may outweigh
    others in problems involving collision detection. Euler integration has the very
    characteristic that it extrapolates state over each timestep. The figure to the
    right shows a particle at timestep $n$, with position $x^{[n]}$ and velocity $v^{[n]}$.
    Euler integration will move the particle along the velocity vector, leaving it
    at a position we call $x_E^{[n]}$ at the next timestep. Any of the higher-order
    integration methods, like RK4 for example, simulate the particle moving along
    a polynomial curve, leaving it at a position we will call $x_R^{[n]}$. In the
    example shown, the exact collision position and time using Euler are easily determined
    from a ray-plane intersection calculation. With RK4, there is no intersection,
    even though there is a higher-order integrator. there is RK4 collision but no
    Euler collision.


    There are several ways to get around the problem with collision detection using
    a higher-order integrator. The simplest is to recognize that the first step of
    all of the RK integrators is to compute the derivative used in Euler integration.
    Thus, with minimal extra cost, it is possible to take a tentative Euler step,
    to see if there would be a collision during that step, and if not, continue with
    the full integration calculation. However, if there would be a collision for a
    collision during the Euler step, it can be handled as if Euler integration were
    used for the entire timestep. In this way, only timesteps involving a collision
    are handled using Euler integration, while most timesteps are handled using the
    higher-order method. This gives the advantages of both approaches: simplicity
    in dealing with collisions, and improved accuracy between collisions.


