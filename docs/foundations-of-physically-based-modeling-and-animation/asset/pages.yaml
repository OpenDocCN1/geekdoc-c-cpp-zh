    # 4.5.2 Sprites


    If a more sophisticated look is required for rendering the particles, a common
    approach is the use of *sprites*. A sprite consists of a rectangle and an associated
    texture map. At each frame, the rectangle is centered on a particle and oriented
    so that its surface normal faces the camera''s viewpoint. To this de, the vector
    between the particle position and the camera viewpoint is used as the direction
    of the normal. The texture map typically includes opaque and transparent regions,
    so that the shape projected by the particle, with attached sprite, does not have
    to be rectangular. The sprite is then rendered as normal texture mapped geometry
    whatever renderer and lighting system is in use. Figure 4.6 demonstrates how the
    use of sprites can greatly enhance the look of even a simple particle system.
    Sprites have the advantage of providing a complex look at the very low computational
    expense of rendering only two triangles per particle.


    # 4.5.3 Geometry


    We said earlier that attaching a sphere to a particle is a poor idea, but there
    are situations where compute time is not a problem, and we would like to represent
    each particle by its use geometry. For example, we might want each particle to
    represent a falling leaf in an Autumn scene, or a cruiser in space armada. In
    this case, providing geometry for each particle can make sense, but more is needed
    than just the particle''s position. We will need to be able to orient the geometry
    as well as position it. A usual approach to building a rotation matrix to orient
    the geometry is to use the particle''s velocity vector to determine one direction
    in a local coordinate frame. If we pick a second direction to be the vertical
    axis, we can use cross-products to complete the particle''s coordinate frame,
    and a rotation matrix to rotate the geometry so it is aligned with this frame.
    Another option is to use the particle''s acceleration as a second vector to cross
    with the velocity vector.'
