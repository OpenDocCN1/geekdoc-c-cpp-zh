  md: "# D.3 A NOTATIONAL SCHEME FOR POINTS AND VECTORS\n\nThere is a convenient notational\
    \ trick that can be used to discriminate vectors and points represented in homogeneous\
    \ coordinates. We represent 3D vectors on the 4D hyperplane $w=0$ and 3D points\
    \ on the hyperplane $w=1$. For example\n\nple, a surface normal vector might be\
    \ written $\\mathbf{\\hat{n}} = \begin{bmatrix} \\hat{n}_x \\ \\hat{n}_y \\ 0\
    \ \\end{bmatrix}$, while a point might be $\\mathbf{p} = \begin{bmatrix} p_x \\\
    \ p_y \\ p_z \\ 1 \\end{bmatrix}$. If we are consistent with this notation, then\
    \ a rotation matrix\n\nwill affect points and vectors, and a translation matrix\
    \ will affect only points. For example,\n\n$\\begin{bmatrix} 1 & 0 & 0 & \\Delta\
    \ x \\ 0 & 1 & 0 & \\Delta y \\ 0 & 0 & 1 & \\Delta z \\ 0 & 0 & 0 & 1 \\end{bmatrix}\
    \ \\begin{bmatrix} \\hat{n}_x \\ \\hat{n}_y \\ \\hat{n}_z \\ 0 \\end{bmatrix}$\n\
    \nbut\n\n$\\begin{bmatrix} 1 & 0 & 0 & \\Delta x \\ 0 & 1 & 0 & \\Delta y \\ 0\
    \ & 0 & 1 & \\Delta z \\ 0 & 0 & 0 & 1 \\end{bmatrix} \\begin{bmatrix} p_x \\\
    \ p_y \\ p_z \\ 1 \\end{bmatrix} = \\begin{bmatrix} p_x + \\Delta x \\ p_y + \\\
    Delta y \\ p_z + \\Delta z \\ 1 \\end{bmatrix}$\n\nA transformation matrix that\
    \ first rotates and then translates will work perfectly for transforming both\
    \ vectors and points in one frame to another.\n\nA final note is to transform\
    \ geometry from one frame to another we have a choice. We can either transform\
    \ the coordinate frame, representing this transformation by a matrix, and leave\
    \ all of the points and normals in the original coordinate frame. Or, we can transform\
    \ all the points and normals from the original frame to the new frame. The latter\
    \ approach is referred to as *baking the transformation*. Baking is usually reserved\
    \ for cases in which we have applied a set of transformations and wish to preserve\
    \ the transformed shape as the new base geometry. This technique is frequently\
    \ used during the modeling process, but rarely used during animation. In an animation\
    \ it is preferable to keep the geometry in its original frame, and simply update\
    \ the transformation matrix as the animation proceeds. If, instead, we iteratively\
    \ bake the geometry, we stand the risk that over many iterations numerical errors\
    \ will build up causing our geometry to deform from its original shape."
  merge: -1
  pgno: 371
