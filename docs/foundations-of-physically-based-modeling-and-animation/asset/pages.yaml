    Since there are no applied or dissipative forces outside of gravity, $Q=0$, and
    Equation 11.16 yields


    $$\frac{d}(\frac{\partial L}{\dot{q}})}{dt}-\frac{\partial L}{\partial s}=0$,
    or


    $$\m(c^{2''}\dot{s}^2+2c''\cdot\mathbf{c}''''\dot{s}^2-c''\cdot\mathbf{c}''\dot{s}^2+g\
    \tilde{\mathbf{u}}_y\cdot\mathbf{c}'')=0$ and thus,\n$$$\dot{s}=-\frac{c''\dot{s}^2}{c^{2''}}$


    A nice extension of the bead on a wire problem would be the problem of a moving
    over a complex terrain. If the terrain is represented by NURBS patches, then there
    are two parameters $u$ and $v$ governing the motion on the surface, and the NURBS
    equations can be defined with respect to these parameters. In this case, $\mathbf{q}=[u
    \ v]^T$, and the derivatives of kinetic energy with respect to $\mathbf{q}$ and
    potential energy will determine accelerations with respect to $\dot{\mathbf{q}}$
    in both the $u$ and $v$ directions, with the clear benefit that all positions
    will remain strictly on the surface.


    Although Lagrangian dynamics, using generalized or reduced coordinates, is a powerful
    way of establishing and maintaining constraints, it is not used in animation,
    simply because it is quite difficult to build into a model and animation package.
    Each problem will have its own generalized coordinate system, and each will have
    a unique formulation for capturing the kinetic and potential energy of the system,
    there is no straightforward way to build this into a modeler.


    # 11.4 SUMMARY


    Here are some of the main points to take away from this chapter:


    +   The degrees of freedom of a dynamic simulation of an object are distinct directions
    in which the object can move. The degrees of freedom can be translational or rotational.


    +   A constrained dynamics problem is one in which motion may be restricted along
    one of the degrees of freedom, or motion along one or more degrees of freedom
    may be prevented.'
