  md: '# Particle Choreography 67


    The large object does not move, but the small object moves towards the large object
    in the direction of the vector **g** and with its speed growing at the rate ||g||.


    Gravity gets more interesting when the two objects are at a distance from each
    other, so that change of distance affects the gravitational attraction. This is
    the type of force that produces the choreography of the heavens. Planets orbit
    the sun, comets follow highly elliptical paths with orbits that take them very
    far from the sun, and interstellar objects follow parabolic paths as they sweep
    into our solar system and are then thrown back by the gravitational "slingshot"
    effect.


    In a particle system, one of the objects will be a geometric object in a fixed
    position, and the other will be a moving particle. Let us call the fixed object
    the attractor $a$, give it mass $m_a$, and label its position $x_a$. Now, consider
    this attractor''s effect on particle $i$ with position $x_i$. We will call the
    vector to the particle $x_{ai} = \mathbf{x}_i - \mathbf{x}_a$, with magnitude
    $r_{ai} = ||\mathbf{x}_{ai}||$ and direction $\hat{x}_{ai} = \mathbf{x}_{ai}/r_{ai}$.
    According to Newtonian physics, the force of attraction on particle $i$ to the
    attractor will


    ![](img/b434947f68660f7e26f8700ff77023a5_89_0.png)


    ```

    $$\mathbf{f}_{ai} = -G \frac{m_a m_i}{r_{ai}^2} \hat{x}_{ai}.$

    ```


    where $G$ is the universal gravitational constant. To accelerate, consider the
    force on particle $i$, we divide by the particle''s mass $m_i$. It is also convenient
    to multiply together $Gm_i$, to yield a single constant $G$. This gives us the
    final additive acceleration operator


    ```

    $$\mathbf{a}_{ai}^{op} = -Ga \frac{1}{r_{ai}^2} \hat{x}_{ai}.$

    ```


    The effect of this operator is to accelerate particle $i$ towards the position
    of the attractor $a$ with an acceleration that is independent of the particle''s
    mass and inversely proportional to the square of the distance between the particle
    and the attractor. The constant $G_a$ can be thought of as a "strength" constant
    that is freely tunable by the animator to adjust the gravitational effect.


    We can move away from Newtonian physics a bit and give even more control over
    the animator by replacing the power 2 with a constant $p$, yielding the additive
    acceleration operator


    ```

    $$\mathbf{a}_{ai}^{op} = -Ga \frac{1}{r_{ai}^p} \hat{x}_{ai}.$

    ```


    $p=2$ will give us the usual gravitational effect, resulting in particle $i$ taking
    a parabolic or elliptical orbital path around attractor $a$, depending on particle
    $i$''s velocity. Setting $p=-1$ will cause the operator to act like a spring,
    producing an acceleration on particle $i$ that is proportional to its distance
    from the attractor.'
