    \ be multidimensional.\n\nNotationally, a vector is usually denoted by a lower-case\
    \ letter, which has a line over it, $\\vec{v}$, or is printed in bold type, like\
    \ $\\mathbf{v}$. For hand written notes, the line is most convenient, but in printed\
