  md: '# 6.5.2 Distance and Field-of-View


    There are still two issues that need to be addressed to make the algorithm more
    true to the behavior of real animals. Remembering that the boids'' actions are
    not physically based, but actually part of a decision-making process, there must
    be some prioritization scheme that causes the boids to pay more attention to nearby
    neighbors and less to those far away. In addition, a boid is a physical creature,
    it can exert only a limited amount of force at any instant in, so it may have
    to prioritize the three types of acceleration to devote its strength to what is
    most important at the time. For example, it makes no sense for the boid to devote
    any of its energy centering with its neighbors when it is about to collide with
    another boid.


    One approach to prioritization is to apply an additional weighting factor to each
    of the individual accelerations that is a function of distance. The figure to
    the right shows one suggestion for how this might work. Choose two threshold distances
    $r1$ and $r2$, with $r_1 < r_2$. If $d$ is distance from the boid then we can
    define the weighting factor


    ```

    $k_d(d) = \begin{cases} 1.0 & \text{if } d < r_1 \ \frac{r_2-d}{r_2-r_1} & \text{if
    } r_1 \le d \le r_2 \ 0.0 & \text{if } d > r_2 \end{cases}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_128_0.png)


    With $k_d$, calculated with $d = d_{ij}$, is multiplied by each of the accelerations
    before it is applied, boid $i$ will pay full attention to all of the other boids
    within distance $r_1$, and pay attention that decreases with distance to boids
    between $r_1$ and $r_2$. This could be done with just a single threshold radius,
    but having the zone of gradually decreasing attention prevents the situation where
    a boid is entirely ignoring or paying attention to another boid distance is near
    the threshold. Such a situation can create jumpy behavior, unlike the smooth motion
    exhibited by real birds.


    All animals have a limited field of view.

    The Eastern Phoebe, shown to the near right, is a good example of a typical nonpredator
    bird. Note that its eyes are located on the side of its head, in front of which,
    the Phoebe a kind of "wrap-around" field of view. It is able to see above, below,
    and behind, and just what is needed to keep watch for predators. There will be
    a "blind" area directly behind the bird, and a region of binocular acuity in front
    of the bird, where both the left and right eyes have overlapping visual fields.
    On the other hand, a predator like one, shown to the far


    ![](img/b434947f68660f7e26f8700ff77023a5_128_1.png)'
