    # 8.2.1 Strut–A 3D Structural Element for a Springy Mesh


    In order to make the spring-mass-damper system useful for constructing a springy
    mesh, we first need to move from the 1D model that we used to analyze the behavior
    of a door closer to a full 3D model. The above figure shows the abstraction that
    we will use, which we call a *strut*. It can be thought of abstractly as a tube
    containing a spring and a damper, as shown at the top of the figure. This is connected
    on each end to points $m_i$ and $m_j$, and has three constants: $k_{ij}$ specifying
    its stiffness, $d_{ij}$ specifying its damping, and $l_{ij}$ specifying the length
    of the strut. At the bottom of the figure is a diagram showing the key computational
    elements of the strut. The two masses are at positions $\mathbf{x}_i$ and $\mathbf{x}_j$,
    and are moving with velocities $\mathbf{v}_i$ and $\mathbf{v}_j$. The vector from
    mass $i$ to mass $j$ is $\mathbf{x}_{ij}$, which has length $l = \|\mathbf{x}_{ij}\|$,
    and direction vector $\hat{\mathbf{x}}_{ij} = \mathbf{x}_{ij}/l$. All forces produced
    by the strut must be aligned with this direction. We can define these forces in
    terms of the positions and velocities of the two masses


    ![](img/b434947f68660f7e26f8700ff77023a5_176_0.png)


    The forces on the damper in the spring come from elongation or compression of
    the spring from its rest length, which is measured by the difference $l_{ij} -
    l_{ij}^0$. Therefore, the spring force on mass $i$ will will be


    > $$\mathbf{f}_i^s = k_{ij}(l_{ij} - l_{ij}^0)\hat{\mathbf{x}}_{ij},$


    and by Newton''s third law, the spring force on mass $j$ will be equal and opposite:


    > $$\mathbf{f}_j^s = -\mathbf{f}_i^s$


    The force on the damper in the strut come from a resistance to the rate of change
    in the length of the strut. This is measured by the component of the difference
    in the velocities of the two masses along the direction of the strut, therefore,
    the force on mass $i$ due to the damper will be


    > $$\mathbf{f}_i^d = d_{ij}(\mathbf{v}_j - \mathbf{v}_i) \cdot \hat{\mathbf{x}}_{ij},$


    and by Newton''s third law, the damping force on mass $j$ will be


    > $$\mathbf{f}_j^d = -\mathbf{f}_i^d$


