  md: "# D.4 CREATING COORDINATE FRAMES\n\nIf we have two nonparallel 3D vectors and\
    \ a 3D point we can use them to conveniently construct a unique 3D coordinate\
    \ frame (i.e., three orthogonal directions in space, together with an origin).\
    \ Let us say that we have the vectors a and b, and an origin point p. To describe\
    \ our new coordinate frame, we would like to create three mutually perpendicular\
    \ unit vectors $\\hat{\\mathbf{u}}_x$, $\\hat{\\mathbf{u}}_y$, and $\\hat{\\mathbf{u}}_z$,\
    \ aligned with the three coordinate axes of the space.\n\nWe can arbitrarily pick\
    \ the $x$ axis direction to be aligned with a, so\n\n$$\\hat{\\mathbf{u}}_x =\
    \ \\mathbf{a}/\\|\\mathbf{a}\\|$.\n\n![](img/b434947f68660f7e26f8700ff77023a5_372_0.png)\n\
    \nWe know that the cross-product between a and b will be perpendicular to both\
    \ vectors, so let us say that aligns with the $z$ axis, giving\n\n$$\\hat{\\mathbf{u}}_z\
    \ = (\\mathbf{a} \times \\mathbf{b})\\|\\mathbf{a} \times \\mathbf{b}\\|.$$\n\n\
    ![](img/b434947f68660f7e26f8700ff77023a5_372_1.png)\n\nThe, or $y$ axis must be\
