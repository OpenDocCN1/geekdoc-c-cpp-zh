    and the incompressibility constraint Equation 13.5,


    ```

    $\nabla \cdot \mathbf{u} = 0$.

    ```


    We might consider an Eulerian fluid simulation as follows. Assume that the values
    of the velocity field $\mathbf{u}$ and pressure field $p$, sampled into a uniform
    computational grid, are known at timestep $n$. We could imagine advancing a grid
    to the next timestep $n+1$ by computing and summing all of the terms on the right-hand
    side of Equation 13.4 at the next, giving the node''s rate of change of velocity.
    After doing this for all nodes, we could integrate the acceleration at each node
    to produce velocities.


    This naive approach has two fundamental problems. First, it does not update the
    pressure field, which will be needed to compute accelerations at the next timestep.
    Second, there is nothing inherent in this calculation enforcing the divergence
    freedom of Equation 13.5. These problems are highly interrelated, pressure and
    fluid compressibility are tightly coupled. If we attempt to force more fluid into
    a cell that is already full, we will increase its pressure, and if we have a cell
    that has a higher pressure than its surrounding cells the pressure difference
    will tend to push fluid out to the surrounding cells.


    The naive approach to solving the Navier-Stokes equations also has numerical problems.
    The convection term $(\mathbf{u} \cdot \nabla)\mathbf{u}$ has a tendency to cause
    instability in a numerical solver, because it involves any region of the flow
    with high velocity will behave like a stiff spring in a springy mesh simulation,
    requiring a very small timestep to maintain stability. For highly viscous fluids,
    the diffusion term $\nabla^2\mathbf{u}$ will also act like a stiff spring, again
    leading to instability.


    The following algorithm outlines how the semi-Lagrangian method advances the current
    velocity field. Inputs to the algorithm are the current velocity field $\mathbf{u}$,
    the pressure field $p$, and the external acceleration vector field $\mathbf{g}$.
    These fields are sampled on a regular spatial grid, using either a central or
    staggered grid organization. Additional inputs are the fluid density $\rho$, and
    the timestep $h$. The algorithm''s outputs are the updated velocity and pressure
    fields for the next timestep. The semi-Lagrangian method breaks the acceleration
    and integration processes into separate steps for each of the accelerations in
    Equation 13.4, using distinctly different approaches for handling each of them.


    We present the algorithm first, followed by a brief description of the steps.
    Pseudo code for the algorithm is shown in Figure 15.2. The subsections explain
    the steps in more detail.


    First, the input velocity is accelerated by the external acceleration field, using
    forward integration, resulting in intermediate velocity field $\mathbf{w}_1$.
    The convection term is not computed and integrated, due to its inherent instability.
    Instead it is handled by explicitly computing the velocity advection that would
    take place due to this term. This is done using a Lagrangian approach, hence the
    name "semi-Lagrangian." Each sampled velocity in $\mathbf{w}_1$ is treated as
    if it were a particle. A backtracking algorithm traces back into the flow one
    timestep, to see what'
