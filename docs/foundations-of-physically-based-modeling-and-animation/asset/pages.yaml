  md: '# 328 Foundations of Physically Based Modeling and Animation


    # A.7.2 Geometric Interpretation of Dot Product


    Another useful interpretation of the dot product is that it can be used to compute
    the component of one vector in the direction parallel to another vector. For example,
    let **a** be a unit vector in the direction of vector **a**. Then the length of
    the projection of another vector **b** in the direction of vector **a** is **a·b**.
    You can think of this as the length of the shadow of **b** on vector **a**. Therefore,
    the vector component of **b** in the direction of vector **a** is


    ![](img/b434947f68660f7e26f8700ff77023a5_350_0.png)


    $$\mathbf{b}_a = (\mathbf{a} \cdot \mathbf{b})\hat{a}$$


    So, **b_a** is parallel to **a** and has length equal to the projection of **b**
    onto **a**. Note that **b$_\perp$ = b - b$_a$** will be the component of **b**
    perpendicular to vector **a**. The dot product has many uses in graphics that
    these two examples will serve to illustrate.


    # A.7.3 Dot Product Example: The Distance from a Point to a Line


    Let us look at how dot product can be used to compute an important geometric quantity:
    the distance from a point to a line. We will use the parametric definition of
    a line, described above, specified by point **p** and a direction vector **a**.
    To compute the distance of an arbitrary point **x** from this line, first compute
    the vector **b = x - p**, from the point **p** on the line to the point **x**.
    The component of **b** in the direction of vector **a** is


    ![](img/b434947f68660f7e26f8700ff77023a5_350_1.png)


    $$\mathbf{b}_a = (\mathbf{a} \cdot \mathbf{b})\hat{a}$$


    The component of **b** perpendicular to **a** is


    $$\mathbf{b}_\perp = \mathbf{b} - \mathbf{b}_a$$


    and the distance of point **x** from the line is simply $||$\mathbf{b}_\perp||$.


    # A.7.4 Dot Product Example: Mirror Reflection


    Another useful example of the use of dot product in geometric calculations is
    the computation of the mirror reflection from a surface. Assume that we have a
    flat mirror surface, whose *surface normal* is the unit vector **n**. The surface
    normal is defined to be a direction vector perpendicular to the surface. Since
    there are two such vectors at


