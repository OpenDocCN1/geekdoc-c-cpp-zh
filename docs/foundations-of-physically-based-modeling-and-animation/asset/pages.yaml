- img_proc: true
  md: 'of the spring (i.e., the angle at which the spring is neither compressed nor
    stretched). If $\theta_0$ is the rest angle, and $\theta$ is the current angle
    between the triangles, then the magnitude of the torque $\tau$ will be proportional
    to the angular difference from the rest angle,


    ```

    $$\tau| = k_|\theta - \theta_0|$

    ```


    when $k_s$ represents the strength of the spring. The direction of the torque
    will tend to increase the angular difference when the spring is compressed, and
    decrease the angular difference when it is stretched.


    # 3.3.1 Torque


    Torque is to rotational motion as force is to translational motion. Torque produces
    an angular acceleration, changing the velocity at which a body is rotating about
    some center. Like force, torque is a vector quantity, unlike force, the direction
    of the torque vector is not in the direction of motion. If we think of a particle
    rotating around an axis, the particle will sweep out a circle in a plane perpendicular
    to the axis. The torque vector is aligned with the axis around which the rotation
    is taking place, and thus orthogonal to the plane of the rotation. The magnitude
    of the torque is equal to the rate of change of angular momentum of the particle,
    so an object rotating at a fixed angular velocity is experiencing no torque—just
    as an object translating at a fixed velocity is experiencing no force.


    ![](img/b434947f68660f7e26f8700ff77023a5_183_0.png)


    Torque is an artifact of constrained motion. Consider a torque arising from a
    force being applied to a body, rigidly attached at a distance, to some sort of
    rotational joint. The diagram shows the relationship between the force $\mathbf{f}$
    and the resultant torque $\tau$, when the force is being applied at position $\mathbf{r}$
    from the joint. Only the component of the force perpendicular to the rigid attachment
    will result in rotation, since the component parallel to the attachment is completely
    countered by the internal strength of the attachment. The resulting torque is
    perpendicular to both the force $\mathbf{f}$ and the vector $\mathbf{r}$ between
    the joint and the position on the object at which the force is being applied.
    If the force is applied to the rotational joint, little torque is generated, but
    if the same force is applied far from the joint, the torque will be large. These
    three concepts are encapsulated in the relation


    ```

    $$\tau = \mathbf{r} \times \mathbf{f},$ (8.1)$

    ```


    relating torque to a force being applied at a distance from a rotational joint.'
