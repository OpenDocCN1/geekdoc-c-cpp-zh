  md: '# Deformable Springy Meshes


    IN THIS CHAPTER, we examine the idea of meshes of particles connected together
    with spring-like connections, allowing the whole mesh structure to be flexible,
    deformable, and springy. In this way, we will be able to be able to model a variety
    of objects, like rubber sheets, cloth, jelly cubes, teddy bears, and virtually
    any other deformable object describable by a polygonal geometric model. The diagram
    to the right shows one variety that may be interconnected with springs, and Figure
    8.1 is a nice example of how this approach can be used to create interesting shapes
    and behaviors. The ideas in this chapter received their original impetus from
    the influential early paper The behavioral tested: obtaining complex behavior
    from simple rules, by Haumann and Parent [1988]. As a graduate student at Ohio
    State, Chris Wedge, went on to use Blue Sky Animation, made the innovative short
    Balloon Guy [Wedge, 1987] using Haumann and Parent’s software. Instead of groups
    of particles that interact by proximity, their idea was to use springy meshes
    of particles, whose connections remain fixed. Since the connections match the
    connectivity of the mesh, there is no problem with establishing the set of particles
    interacting with each other. As long as any one is independent of the total number
    of particles, the basic mesh problem has complexity $O(N)$ in the number of particles.


    ![](img/b434947f68660f7e26f8700ff77023a5_169_0.png)


    The issues that we will deal with in this chapter include the representation of
    the springy connections, how these can be combined to make a springy mesh, and
    how the structural stability of the resulting mesh can be assured. Then, we will
    look at how collision detection has been modified to handle objects that are changing
    in shape. We will see that highly complex geometry can result in too many tiny
    connections, making their deformations expensive to compute. In this case, we
    can build simplified deformers that allow us to compute approximate believable
    deformations of these complex objects. Finally, we look at the case of cloth simulation.'
