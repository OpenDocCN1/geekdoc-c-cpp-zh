  md: '# Affine Transformations ■ 341


    In summary, we have the four basic affine transformations shown in the figure
    below:


    +   * Translate moves a set of points a fixed distance in $x$ and $y$.


    +   * Scale scales a set of points up or down in the $x$ and $y$ directions.


    +   * Rotate rotates a set of points about the origin.


    +   * Shear offsets a set of points a distance proportional to their $x$ and $y$
    coordinates.


    Note that only shear and scale change the shape determined by a set of points.


    ![](img/b434947f68660f7e26f8700ff77023a5_363_0.png)


    # C.3 MATRIX REPRESENTATION OF THE LINEAR TRANSFORMATIONS


    The affine transforms scale, rotate, and shear are actually linear transforms
    and can be represented by a matrix multiplication of a point represented as a
    vector,


    ```

    $x'' = \begin{bmatrix} ax + by \ dx + ey \end{bmatrix} \begin{bmatrix} a & b \
    d & e \end{bmatrix} \begin{bmatrix} x \ y \end{bmatrix}$

    ```


    or $x'' = Mx$, where $M$ is the matrix.


    One nice feature of the matrix representation is that we can use it to factor
    a complex transform into a set of simpler transforms. For example, we want to
    scale an object up to a new size, shear the object to a new shape, and finally
    rotate the object. Let $S$ be the scale matrix, $H$ be the shear matrix and $R$
    be the rotation matrix. Then


    ```

    $x'' = R(H(Sx))$

    ```


    defines a sequence of three transforms: first-scale, second-shear, third-rotate.
    Because matrix multiplication is associative, we can remove the parentheses and'
