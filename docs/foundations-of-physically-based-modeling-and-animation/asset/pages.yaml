  md: "# A.7 DOT OR INNER PRODUCT\n\nVector-vector multiplication is not as easily\
    \ defined as addition, subtraction, and scalar multiplication. There are actually\
    \ several vector products that can be defined. First, we will look at the *dot\
    \ product* of two vectors, which is often called their *inner product.*\n\nDefined\
    \ algebraically, the dot product of two vectors is given by\n\n```\na \\cdot b\
    \ = \\left[ \\begin{matrix} a_x \\ a_y \\end{matrix}, \\begin{matrix} b_x \\ b_y\
    \ \\end{matrix} \\right] = a_xb_x + a_yb_y.$\n```\n\nWe multiply corresponding\
    \ terms and add the result. The result is *not* a *vector*, but is in fact a scalar.\
    \ This turns out to have many ramifications. The dot product is a *mighty* operation\
    \ and has many uses in graphics!\n\n# A.7.1 Trigonometric Interpretation of Dot\
    \ Product\n\nThe dot product can be written in trigonometric form as\n\n```\n\
    a \\cdot b = ||\\mathbf{a}|||\\mathbf{b}|| \\cos \\theta,$\n```\n\n![](img/b434947f68660f7e26f8700ff77023a5_349_0.png)\n\
    \n$\theta$ is the smallest angle between the two vectors. Note, that this definition\
    \ of $\theta$ applies in both 2D and 3D. Two nonparallel vectors always define\
    \ a plane, and the angle $\theta$ is the angle between $\\mathbf{a}$ and $\\mathbf{b}$\
    \ measured in that plane. Note that if both $\\mathbf{a}$ and $\\mathbf{b}$ are\
    \ unit vectors, then $||\\mathbf{a}|| = 1$, and $\\mathbf{a} \\cdot \\mathbf{b}\
    \ = \\cos \\theta$. So, in general if you want to find the cosine of the angle\
    \ between two vectors $\\mathbf{a}$ and $\\mathbf{b}$, first compute the unit\
    \ vectors $\\hat{\\mathbf{a}}$ and $\\hat{\\mathbf{b}}$ in the directions of\n\
    \n```\n\\cos \\theta = \\hat{\\mathbf{a}} \\cdot \\hat{\\mathbf{b}}.$\n```\n\n\
    Other things to note about the trigonometric representation of dot product follow\
    \ directly from the cosine relationship are that\n\n+   The dot product of *orthogonal*\
    \ (perpendicular) vectors is zero, so if $\\mathbf{a} \\cdot \\mathbf{b} = 0$,\
    \ for vectors $\\mathbf{a}$ and $\\mathbf{b}$ with non-zero norms, we know that\
    \ the vectors must be orthogonal.\n\n+   The dot product of two vectors is positive\
    \ if the magnitude of the smallest angle between the vectors is less than $90^{\\\
    circ}$, and negative if the magnitude of this angle exceeds $90^{\\circ}$."
