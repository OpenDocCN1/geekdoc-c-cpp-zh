  md: '# Numerical Integration


    WE SAW BACK IN SECTION 2.6 that the method we use for integrating can play a significant
    role in the accuracy of the simulations we produce. It will be useful to review
    section before proceeding forward. Up until this point, we have used the simplest
    integration scheme, Euler integration, to illustrate our simulations. However,
    we will quickly encounter a need for alternative integration techniques, either
    because we want something accurate, more stable, or more efficient. In this chapter,
    we discuss several important ideas in integration, and present in detail a few
    of the most common integration methods used in physically based animation.


    Numerical integration techniques have a long history, and we will give a summary
    of key ideas and useful techniques here, there are alternative sources that can
    provide a much more in-depth and rigorous treatment of the subject. A very practical
    reference source is the Numerical Recipes series [Press et al., 2007]. If the
    material in this chapter is intriguing, we would encourage the reader to pursue
    some of the more detailed discussion in those sources.


    # 7.1 SERIES EXPANSION AND INTEGRATION


    To understand the various methods of integration, it is very helpful to first
    understand what they are accomplishing. To do this, we must understand the functions
    we want to integrate.


    Many of the problems we face can be described as an ordinary differential equation
    in the form


    ```

    $$\dot{s}(t) = \frac{ds(t)}{dt} = \mathbf{f}(s, t). \quad (7.1)$

    ```


    That is, we have a function $\mathbf{f}$, describing how the state s is changing
    at a particular point in time. In the examples we have seen to this point, and
    as in Section 6.1, for a state consisting of only position and velocity, the function
    $\mathbf{f}$ gives the velocity and acceleration.'
