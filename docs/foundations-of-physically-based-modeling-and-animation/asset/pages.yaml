    were in the door closer, the door would be pulled back rapidly and slam shut.
    The figure shows how the closer is built to prevent this. The closer''s piston
    presses the spring when the rod connected to the door frame is pulled out to open
    the door. Also, as the piston slides inside the tube, it pulls into the tube as
    the rod is extended and pushes air back out of the tube as the rod is retracted.
    A valve at the end of the tube lets in rapidly as the rod is pulled out, but only
    lets out slowly as the rod moves. The spring force not only pulls on the door
    to close it, but must push against the air as it escapes the tube. The force of
    the spring is proportional to how much the spring is compressed, the force caused
    by the air is proportional to how fast the spring is moving in the tube.


    # 8.1.1 Mathematics of a Damped Spring


    The diagram on is a simplified one-dimensional model of the elements that produces
    forces within the door closer. A spring connects a mass m to an immovable wall.
    In parallel with the spring, a damper also connects the mass to the wall. The
    spring has a strength $k$, and the damper a constant $d$, which govern the strength
    of the forces they can exert. Let $x$ be the position of the mass, where $x=0$
    when the spring is in its relaxed position and exerting no force on the mass.
    We assume linear spring and damping models. The spring exerts a force back on
    the mass proportional to how far the spring is compressed or extended from its
    rest position. The damping force does not depend on position, rather the damper
    exerts a force opposing the velocity of the mass. Mathematically, the force exerted
    by the spring is


    ![](img/b434947f68660f7e26f8700ff77023a5_171_0.png)


    ```

    $f_k = -kx$$

    ```


    and the force exerted by the damper is


    ```

    $f_d = -dv$$

    ```


    If the mass is also being pushed or pulled with an external force $f_e$, by Newton''s
    second law,


    ```

    $$\ddot{x} = f_e + f_k + f_d,\ \text{ or}$

    $$\ddot{x} = f_e - kx - d\dot{x}$$

    ```


    This is a well-studied second-order linear differential equation, often written
    in the form


    ```

    $$\ddot{x} + d\dot{x} + kx = f_e.$

    ```


    The special case, where the externally applied force $f_e = 0$, is known as the
    homogeneous form of the equation


    ```

    $$\ddot{x} + d\dot{x} + kx = 0.$

    ```'
