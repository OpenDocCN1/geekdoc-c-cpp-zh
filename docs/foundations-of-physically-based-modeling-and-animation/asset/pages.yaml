    $\mathbf{r}$. The problem is to determine the rate of change of the $\mathbf{r}$.
    Since $p$ is rotating with angular velocity $\omega$, its instantaneous velocity
    must be perpendicular to the vectors $\mathbf{r}$ and $\mathbf{\omega}$, otherwise
    it would be changing its distance from $\mathbf{x}$ or its distance from the axis
    of rotation. Therefore, if we apply the right-hand rule for rotation


