    # A.8.3 Cross-Product Example: Computing the Area of a Triangle


    Another application of cross-product to triangles uses the trigonometric definition
    of the magnitude of the cross-product. Suppose we have a triangle, like the one
    shown to the right. If we know the lengths of sides $a$ and $b$, and we know the
    angle $\theta$ between these, the area computation is straightforward.


    Relative to side $a$, the area of the triangle is $A = 1/2ah$, so we have $A =
    b\sin\theta$. If we represent the sides of the triangle by the vectors $\mathbf{a}$
    and $\mathbf{b}$, $a = \|\mathbf{a}\|$ and $b = \|\mathbf{b}\|$. Since the magnitude
