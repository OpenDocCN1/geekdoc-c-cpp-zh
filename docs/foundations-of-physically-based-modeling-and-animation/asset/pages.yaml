  md: '# 340 Foundations of Physically Based Modeling and Animation


    requirements of a scene, it is first scaled to be longer and thinner than its
    original design, to a desired orientation in space, and then moved to a desired
    position (i.e., translated). The set of operations providing for all such transformations,
    are known as the affine transforms. The affines include translations and all linear
    transformations, such as scale, rotate, and shear.


    # C.2 2D AFFINE TRANSFORMATIONS


    Let us first examine the affine transforms in 2D space, where it is easy to illustrate
    them with diagrams, then later we will know the affines in 3D.


    Consider a point x = (x, y). Affine transformations of x are all transformations
    that can be written


    ```

    x'' = \begin{bmatrix} ax + by + c \ dx + ey + f \end{bmatrix}$

    ```


    where a through f are scalars.

    For example, if a, e = 1, and b, d = 0, then we have a pure translation


    ```

    x'' = \begin{bmatrix} x + c \ y + f \end{bmatrix}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_362_0.png)


    If b, d = 0 and c, f = 0 then we have a pure scale.


    ```

    x'' = \begin{bmatrix} ax \ cy \end{bmatrix}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_362_1.png)


    And, if a, e = cos θ, b = -sin θ, d = sin θ, and c, f = 0, then we have a pure
    rotation about the origin


    ```

    x'' = \begin{bmatrix} x cos θ - y sin θ \ x sin θ + y cos θ \end{bmatrix}$

    ```


    Finally if a, e = 1, and c, f = 0 we have the shear transforms


    ```

    x'' = \begin{bmatrix} x + by \ y + dx \end{bmatrix}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_362_2.png)'
