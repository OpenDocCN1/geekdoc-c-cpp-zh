  md: '# # Rigid Body Collisions and Contacts


    AS FIGURE 10.1 DEMONSTRATES, some of the most interesting rigid motion comes about
    when rigid bodies come into contact. Collisions create some of the most spectacular
    effects, but having objects come to rest in stacked and piled situations is also
    visually interesting.

    Also, collisions are one of the most common ways that objects change in angular
    momentum. While forces such as gravity act on the entire body (and do not produce
    torque) are common, it is less common for a model to include continuous forces
    at a point, which would induce rotation.

    In this chapter, we discuss how collisions between rigid bodies can be handled.


    # 10.1 COLLISIONS OF RIGID BODIES


    To illustrate the process for finding and resolving collisions, we first give
    a simple example of one moving object and one stationary object, and then expand
    to away moving objects.

    Recall that handling collisions involves three phases: collision detection, collision
    determination, and collision response. In Section 8.5 we already described the
    basic collision detection and determination process, and it would be worthwhile
    reviewing that section before proceeding. The three key points to take away are
    as follows:


    +   - Collision testing for polygon objects can be reduced to vertex-face and
    edge-edge collisions—all other interesting cases can be reduced to some combination
    of these.

    - Vertex-face collisions are done using point-polygon intersection methods.

    - Edge-edge collisions are done by finding the closest point between the two edges,
    and checking to see if it has moved from one side to the other of the plane defined
    by a point on one of the edges and the cross-product between the edges.'
  merge: -1
  pgno: 225
