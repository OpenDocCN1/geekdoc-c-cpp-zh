  md: '# 214 Foundations of Physically Based Modeling and Animation


    Unlike AABB or k-dops, the OBB does not need to be recalculated as the object
    rotates. The direction of the axes needs to be updated, but this is a much simpler
    operation than completely recomputing the volume. OBBs are relatively tight-fitting,
    and they are typically more tight-fitting than an AABB, and tighter than k-dops.
    Furthermore, if an object is divided into smaller and small parts, compared with
    AABB''s, OBBs converge more quickly to the underlying surface, as demonstrated
    in the diagram.


    ![](img/b434947f68660f7e26f8700ff77023a5_236_0.png)


    Disadvantages: The primary downside to using OBBs is that the collision computation
    is more complicated than for spheres, AABBs, or k-dops. Typically more axes must
    be checked, and the volume (i.e., the eight vertices) must be projected onto each
    axis. This involves several computations, in contrast to a small number of computations
    (for spheres) or just comparisons (for AABBs and k-dops). The initial cost of
    computing an OBB is relatively high, but this needs to be done once, as a precomputation
    rather than repeatedly during a simulation.


    Convex Hulls: The convex hull of a set of points is defined as the smallest set
    of points for which convex combinations of those points encompass every point.
    A convex combination of two points is basically the points on the line segment
    between the points; for three points it is the triangle formed by those points;
    for four points, it is the tetrahedron formed by those points. In 2D, the convex
    hull can be thought of as the shape formed by stretching rubber band around the
    object and letting it go, and in 3D the analogy is similar to shrink-wrapping
    the object. The convex hull is, by definition, the tight-fitting convex polyhedron
    possible for a set of points.


    ![](img/b434947f68660f7e26f8700ff77023a5_236_1.png)


    Storing the convex hull of an object means storing a set of vertices, edges, and
    faces that make up the hull. Unlike the other bounding volumes we have discussed,
    storing the convex hull information requires much more than a few values, and
    can be complex in some cases.


    Computing: Computing a convex hull is a long-standing problem in computational
    geometry, with many different implementations. We will not discuss the process
    here, but various algorithms can be found in almost any computational geometry
    text. The Handbook of Discrete and Computational Geometry is a standard reference
    [Goodman and O''Rourke, 2004].


    Detecting collisions between two convex hulls can be done using the separating
    axis theorem. However, since each convex hull can have numerous faces and edges,
    there could be a very large number of axes required, making the process slow.'
