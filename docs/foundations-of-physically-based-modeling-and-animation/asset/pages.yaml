  md: '# Introduction


    # 1.1 WHAT IS PHYSICALLY BASED ANIMATION?


    THE TERMS Physically Based Animation or Physically Based Modeling are used interchangeably.
    Both imply the use of the principles of physics, usually classical mechanics,
    to model dynamically evolving phenomena and to capture these models in the form
    of simulation algorithms run sequentially on a computer. The goal is to produce
    a sequence of states of the system as it evolves in time, and to capture this
    sequence as a set of images that are played sequentially to depict the motion.
    An example is shown in Figure 1.1, showing a ball being tossed into a net and
    bouncing away into a second net.


    The original meaning of the term animation is the "action of imparting life" [Harper,
    2016]. In this book, we are attempting to assist the reader to bring to life the
    objects and actors that make up the denizens of virtual worlds. The methods that
    we will be emphasizing are those of the computer simulation of phenomena described
    by the mechanical models of classical physics.


    In computer games, computer animation, and visual effects, the term animation
    usually refers to the artistic discipline engaged in by highly trained, skilled
    artists, known as animators. They are the actors of animated films, that provide
    the motion, emotion, and human subtlety to the characters that they are animating.
    An animator''s primary task is to generate what as primary animation; which is
    the body motion, facial expressions, and subtle gestures that make a character
    come alive and express its personality.


    On the other hand, physically based animation is used mainly to generate secondary
    animation; which typically includes non-character motion in a scene, driven by
    the primary animation. Examples of secondary animation include the response of
    a character''s hair and clothing to its motion, or non-character motion like flags
    blowing in the wind, water splashing in a pool, exploding fireworks, bouncing
    balls, or falling objects. In addition, secondary animation can include the animation
    of characters that are extras in a scene, like warriors in a battle scene, or
    schooling fish.'
