    ```

    $$\mathbf{F}(\mathbf{S}^{[n+1]}) = \mathbf{F}(\mathbf{S}^{[n]}) + \Delta\mathbf{S}
    \ \approx \mathbf{F}(\mathbf{S}^{[n]}) + \frac{d\mathbf{F}}{d\mathbf{S}}\Delta\mathbf{S}
    \ \approx \mathbf{F}(\mathbf{S}^{[n]}) + \mathbf{J}\Delta\mathbf{S}.}$

    ```


    where **J** is the Jacobian matrix. The Jacobian is the first-order, linear, approximation
    to the change in **F** at the particular state **S**, similar to the way the tangent
    gives the linear approximation to a curve at a particular point.


    The Jacobian, then, is a matrix that approximates how the function **F** varies
    as the elements of **S** vary.'
