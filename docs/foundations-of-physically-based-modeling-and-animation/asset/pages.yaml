    # 2.8 SUMMARY


    Here is a brief review of some of the main concepts to take away from this chapter:


    +   - The general process for simulation involves three stages: defining a model,
    establishing initial conditions, and simulating.


    +   - Typical simulation involves computing forces based on the current state
    of the system.


    +   - From these forces we obtain accelerations using Newton’s second law **$a
    = \frac{F}{m}$**


    +   - We use these accelerations to project forward in time to update velocities
    and positions. This projection process is numerical integration.


    +   - Euler integration (see Equation 2.3) provides a simple way to perform numerical
    integration.


    +   - We can improve our integration results by reducing the timestep at the cost
    of increased simulation time, or by using a better integration technique.


    +   - A gravitational model hides the effect of mass on acceleration, because
    the force due to gravity and the force needed to accelerate an object are both
    proportional to mass.


    +   - Adding air resistance to the gravitational model brings the effect of mass
    back into play, and provides a convenient mechanism to build wind effects into
    a simulation.'
