    \in k} m_i\mathbf{x}_i}{M_k}$.


    If the cell has no particles, the total mass $M_k$ is set to 0, and the center
    set to the center of the cell. The acceleration function of the cell is


    $$\mathbf{a}_k(\mathbf{x}) = GM_k \frac{\mathbf{x} - \mathbf{c}_k}{\}{\mathbf{x}
    - \mathbf{c}_k\|^3}$.


