    # 11.2 CONSTRAINED DYNAMICS


    While penalty methods provide an easy way to maintain constraints, they have the
    problem that they cannot exactly a hard constraint. This is because they require
    there to be some constraint violation error before they are able to generate forces
    to counteract it. In a classic set of SIGGRAPH Course Notes, Andrew Witkin [Witkin
    and Baraff, 2001] developed the mathematics of what he calls constrained dynamics.
    This is a way of guaranteeing maintenance of hard constraints by generating forces
    that counteract applied forces, to prevent any constraint violation from ever
    occurring. Here we summarize that, beginning with a single degree of freedom example,
    containing only one constraint, and then showing how the method can be generalized
    to handle problems with multiple constraints.


    # 11.2.1 One Constraint


    We will look first at the problem of simulating the constrained dynamics of a
    pendulum undergoing motion in 2D—i.e., the pendulum''s motion remains in a single
    plane. The figure to the right shows how this might be configured. The position
    x_0 is at the fulcrum of the pendulum, so all motion should be a rotation around
    this position. The pendulum has a spherical bob of mass $m$, mounted at the end
    of a solid shaft of length $r$, that is assumed to be negligible mass. We let
    the variable $x$ be the position of the center of the bob, and the force $f_a$
    is the sum of all external forces applied to the pendulum''s bob. What we seek
    to do is to always generate a constraint force $f_c$ that exactly counteracts
    any component of $f_a$ that will tend to cause the shaft''s length to change.
    Intuitively, for this problem we can ensure that the constraint force should along
    the direction of the shaft


