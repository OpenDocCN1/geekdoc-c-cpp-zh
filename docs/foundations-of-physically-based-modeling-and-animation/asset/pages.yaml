  md: "# 162 Foundations of Physically Based Modeling and Animation\n\n# 8.3.2 Computation\
    \ of Torque from a Torsional Spring\n\nThis figure attempts to represent the torsional\
    \ spring problem in the form of a vector diagram needed to convert the problem,\
    \ expressed in terms of torque, into a problem involving only forces. We number\
    \ each of the vertices of the two triangles as shown. We let the vector from vertex\
    \ $i$ to vertex $j$ be denoted $\\mathbf{x}_{ij} = \\mathbf{x}_i - \\mathbf{x}_j$,\
    \ the edge length be $l_{ij} = ||\\mathbf{x}_{ij}||$, and the edge direction be\
    \ $\\hat{\\mathbf{x}}_{ij} = \\mathbf{x}_{ij}/l_{ij}$. We note that the hinge\
    \ around which triangles are rotating corresponds with the hinge edge $\\mathbf{x}_{01}$,\
    \ so for convenience we define the hinge vector $\\hat{\\mathbf{h}} = \\hat{\\\
    mathbf{x}}_{01}$. We denote attributes of the left triangle with subscript $l$,\
    \ and the right triangle with subscript $r$. up-facing surface normal for the\
    \ left triangle is $\\hat{\\mathbf{n}}_l$, and for the right triangle is $\\hat{\\\
    mathbf{n}}_r$. We also define $\\mathbf{r}_l$ and $\\mathbf{r}_r$ to be the vectors\
    \ formed by lifting a perpendicular from the hinge edge $\\mathbf{x}_{02}$ and\
    \ $\\mathbf{x}_{03}$. They are given\n\n![](img/b434947f68660f7e26f8700ff77023a5_184_0.png)\n\
    \n```\n$\\mathbf{r}_l = \\mathbf{x}_{02} - (\\mathbf{x}_{02} \\cdot \\hat{\\mathbf{h}})\\\
    hat{\\mathbf{h}},$ and $\\mathbf{r}_r = \\mathbf{x}_{03} - (\\mathbf{x}_{03} \\\
    cdot \\hat{\\mathbf{h}})\\hat{\\mathbf{h}}.$\n```\n\nWe measure the rest angle\
    \ $\theta$ between the two triangles as the angle between their surface normals,\
    \ as shown in the above figure. Therefore, two coplanar triangles will be at $\t\
    heta = 0$, and two triangles on adjacent faces of a cube will be at $\theta =\
    \ 90^{\\circ}$. Using this convention, the cosine of the angle between the triangles\
    \ is $\\cos \theta = \\hat{\\mathbf{n}}_l \\cdot \\hat{\\mathbf{n}}_r$. However,\
    \ the cosine only determines the angle over two quadrants, since $\\cos \theta\
    \ = \\cos(-\theta)$. To establish the angle over a full $360^{\\circ}$ we also\
    \ need to determine the sign. For this we use the cross-product. Note $\\hat{\\\
    mathbf{n}}_l \times \\hat{\\mathbf{n}}_r$ is guaranteed to be parallel to the\
    \ hinge vector $\\hat{\\mathbf{h}}$, and oriented in the same direction as $\\\
    hat{\\mathbf{h}}$ if $\\hat{\\mathbf{h}}$ is positive, as it is in the diagram.\
    \ Therefore, $\\sin \theta = (\\hat{\\mathbf{n}}_l \times \\hat{\\mathbf{n}}_r)\
    \ \\cdot \\hat{\\mathbf{h}}.\n\n![](img/b434947f68660f7e26f8700ff77023a5_184_1.png)\n\
    \n```\n$\\theta = \tan^{-1} \\frac{(\\hat{\\mathbf{n}}_l \times \\hat{\\mathbf{n}}_r)\
    \ \\cdot \\hat{\\mathbf{h}}}{\\hat{\\mathbf{n}}_l \\cdot \\hat{\\mathbf{n}}_r}$\n\
    ```\n\nNote that knowing the signs of numerator and denominator in this relationship\
    \ is necessary to determine the correct quadrant for the angle. In coding it is\
    \ important to use a function like atan2()`, which takes the numerator and denominator\
    \ as separate arguments and returns a $360^{\\circ}$ angle, rather than `atan()`,\
    \ which takes the ratio of the numerator and denominator as one argument and returns\
    \ an angle resolved to within $180^{\\circ}$."
