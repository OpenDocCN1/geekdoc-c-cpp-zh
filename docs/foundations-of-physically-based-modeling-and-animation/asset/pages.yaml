    $S^{[n+1]} - S^{[n]} - F(S^{[n+1]})h = 0$ $\quad (2.11)$

    ```


    for $S^{[n]}$. More generally, implicit integration can be based determining some
    combination of current and future states, such as the trapezoidal method of'
