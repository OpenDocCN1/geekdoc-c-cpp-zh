  md: '# 1.3 MATHEMATICAL NOTATION CONVENTIONS


    The language of physics is mathematics, and physically based animation is no exception;
    the book uses mathematics as a primary language. Since we make extensive use of
    mathematical notation, we have adopted conventions that we have been careful to
    use throughout the book. These notational conventions are summarized by the examples
    here:


    +   - lower case: scalar variables and parameters

    - $\omega$ greek letters: scalar variables and parameters

    - $v$ bold lower case: vector variables

    - $\omega$ bold greek letters: vector variables

    - $\hat{v}$ bold lower case with hat: unit or direction vectors

    - $M$ upper case: matrices

    - $J$ bold upper case: Jacobian matrix

    - $I$ or $i$ upper case or $I$: identity matrix


    All vectors are assumed to be column vectors. When a vector is expanded to show
    its terms, if presented as part of an equation on a separate line, we use the
    notation


    ```

    $V = \begin{bmatrix} x \ y \ z \end{bmatrix}$

    ```


    When an expanded vector is shown inline with the text, it will be written in transform
    form as $v^T = [x \ y \ z]$.


    # 1.4 TOOLK AND COMMERCIAL SOFTWARE


    While the purpose of this book is to acquaint the reader with the underlying concepts
    of physical simulation as applied to animation, most production animation is done
    starting with software toolkits or commercial animation packages. The most popular
    APIs for use in computer games, at the writing of this book, *Bullet*, *Havok*,
    and *PhysX*. *The Dynamics Engine (ODE)* is a highly accessible open-source toolkit
    that is used extensively in research and individual projects.


    The animation package providing the most integrated and flexible support for physics
    simulation is *Houdini*, which has become the primary tool in the production of
    visual effects in animation and VFX houses. Beside this, the commercial packages
    *Maya* and *3D Studio Max*, as well as the popular open-source package *Blender*.
    Most of these also have available plug-ins to support all of the major physics
    APIs.'
