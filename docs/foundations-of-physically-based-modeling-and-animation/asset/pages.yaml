    # 3.2 COLLISION RESPONSE


    Collision response is calculated once we have determined the time and location
    of the collision and is treated as an instantaneous change in the state of the
    particle. Keep in mind that our current motivating problem is a simple situation.
    We have a ball that does not rotate, and the infinite plane that is colliding
    with is fixed. The only thing we need to determine in collision response is how
