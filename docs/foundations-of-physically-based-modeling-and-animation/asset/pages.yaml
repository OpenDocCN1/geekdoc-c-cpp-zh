  md: 'At each step of the simulation, we compute the rate of change of the particle''s
    position and velocity. To compute the rate of change of particle $i$''s velocity,
    we sum the $m$ individual forces on the particle, to obtain the total force


    ```

    $$\mathbf{f}_i = \sum_{j=0}^{m-1} \mathbf{f}_i^j,$$

    ```


    with the notation $f_i^j$ indicates the $j$th force acting on particle $i$. Dividing
    by the particle''s mass $m_i$ we obtain the particle''s acceleration,


    ```

    $$\mathbf{a}_i = \frac{1}{m_i}\mathbf{f}_i.$

    ```


    The rate of change of the particle''s position is simply its velocity, which we
    can use without any calculation. Thus, in our state notation, the rate of change
    of the state of the particle is


    ```

    $$\mathbf{s}_i = \begin{bmatrix} \mathbf{v}_i \ \mathbf{a}_i \end{bmatrix}. \quad
    (6.2)$

    ```


    An important point to note about the force calculation is that each of the individual
    forces $f_i^j$ acting on the particle can be thought as a function of the state
    of the particle and time. To see this, review the acceleration operators discussed
    in Section 5.1. You will find that each of them is affected by a set of parameters
    for the particle and the scene, and may have forces based on the particle''s current
    position, current velocity, or both. If all of the parameters are fixed, the forces
    vary only with the particle''s state. If any of the parameters is animated, that
    it varies with time, then the force will vary with time. Thus, each of the forces
    $f_i^j$ acting on particle $i$ can be expressed as a function $f_i^j(s_i, t)$;
    therefore, the acceleration on the particle is also a function of its state and
    time:


    ```

    $$\mathbf{a}_i = \mathbf{a}_i(s_i, t) = \frac{1}{m_i}\sum_{j} \mathbf{f}_i^j(s_i,
    t). \quad (6.3)$

    ```


    # 6.1.2 State Vectors for Interacting Particles


    Having established this, it can now be easily demonstrated that the entire rate
    of change of the particle''s state is a function of its current state and time.
    Examining Equation 6.2, we see that the first term in the derivative of the state
    vector is the particle''s velocity, which is an element of its state, and the
    second term is its acceleration, which by Equation 6.3 is a function of the particle''s
    state and time. We summarize this insight by adopting the notation


    ```

    $$\dot{\mathbf{s}}_i = \mathbf{F}_i(s_i, t,$

    ```


    where


    ```

    $$\mathbf{F}_i(s_i, t) = \begin{bmatrix} \mathbf{v}_i \ \mathbf{a}_i(s_i, t) \end{bmatrix}.
    \quad (6.5)$

    ```'
