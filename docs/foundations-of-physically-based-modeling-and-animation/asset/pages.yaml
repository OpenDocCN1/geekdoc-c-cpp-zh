  md: '# Smoothed Particle Hydrodynamics ■289


    A spline-based 3D kernel function with nice properties was presented in the early
    SPH paper by Monaghan [1992]. If $\|r\|$ is the distance from the kernel center,
    this is given by


    ![](img/b434947f68660f7e26f8700ff77023a5_311_0.png)


    ```

    w(r) = \frac{1}{\pi s^3} (1-\frac{3}{2}(\frac{r}{s})^2+\frac{3}{4}(\frac{r}{s})^3)
    \begin{cases} 1 & 0 \le \frac{r}{s} \le 1, \ 0 & 1 \le \frac{r}{s} \le 2, \ 0
    & \text{otherwise.} \end{cases}

    ```


    This kernel has finite support radius 2s, the kernel goes to exactly 2s distance
    from its center. Further, its first and second derivatives go to 0 at 2s, providing
    smooth interpolation to and beyond the support distance. As required, volume integral
    is 1.


    ![](img/b434947f68660f7e26f8700ff77023a5_311_1.png)


    Given an appropriate kernel function $w$, $\nabla w$ and $

    abla^2 w$ can also be computed in form, so that no numerical differentiation is
    needed. The kernel is radially symmetric, it is a function only of distance from
    its center, we need only compute its first and second derivatives with respect
    to $r$ to determine its gradient and Laplacian. For example, for the kernel described


    ```

    \frac{dw}{dr} = \frac{1}{\pi s^4} (-3-\frac{9}{2}(\frac{r}{s})^2) \begin{cases}
    0 & 0 \le \frac{r}{s} \le 1, \ 0 & 1 \le \frac{r}{s} \le 2, \ 0 & \text{otherwise.}
    \end{cases}

    ```


    and


    ```

    \frac{d^2w}{dr^2} = \frac{1}{\pi s^4} (-3-\frac{9}{2}(\frac{r}{s})) \begin{cases}
    0 & 0 \le \frac{r}{s} \le 1, \ 0 & 1 \le \frac{r}{s} \le 2, \ 0 & \text{otherwise.}
    \end{cases}

    ```


    Thought of this way, $w$, $\nabla w$, and $\nabla^2 w$ are simply different kernel
    functions. The fact that the gradient does not go smoothly to 0 at the center
    helps ensure that nearby particles receive an appropriate "push" in the pressure
    calculation.


    # 14.4 THE FLUID SURFACE AND SURFACE TENSION


    In our discussion of fluid simulation, so far, we have not addressed the issue
    of the fluid surface. Some fluid simulations, like gas-flow simulations, may not'
