- img_proc: true
  md: '# 210 Foundations of Physically Based Modeling and Animation


    To detect overlap between two spheres, the distance between their centers can
    be calculated, and compared to the sum of the radii. To avoid the square root
    operation when computing distance, often the square of the distance will be compared
    to the square of the sum of the radii, in the expression


    ```

    $$(x_1 - x_2)^2 + (y_1 - y_2)^2 + (z_1 - z_2)^2 < (r_1 + r_2)^2$$

    ```


    If the left-hand side is less than the right-hand side, the spheres are overlapping
    and the objects inside might be colliding.


    *Advantages: For a sphere centered at an object''s center of mass, the bounding
    sphere is independent of the orientation of the object. As an object moves, only
    the position of the center needs to be updated; the radius does not change. Detecting
    collisions between spheres is reasonably fast, though not as fast as other bounding
    volumes.


    *Disadvantages: Spheres tend be much larger in volume than the objects they enclose.
    This empty space tends to lead to "false-positive" intersections with the other
    bounding volume types. If the sphere is not centered on the object''s center of
    mass, the computation of the bounding sphere is somewhat complicated, though this
    needs to be done once.


    **AABBs:** An Axis-Aligned Bounding Box (AABB) is a box aligned to the world $x,
    y$, and $z$ axes. Storing an AABB consists of storing the minimum and maximum
    extents along each axis. Six numbers are stored either as minimum and maximum
    values $(x_{min}, x_{max}, y_{min}, y_{max}, z_{min}, z_{max})$, or as a center
    $(x, y, z)$ and half-extents in each direction $(x_{ext}, y_{ext}, z_{ext})$.
    Notice that $x_{min} = x - x_{ext}, x_{max} = x + x_{ext}$, etc.


    ![](img/b434947f68660f7e26f8700ff77023a5_232_0.png)


    *Computing:* Computing an AABB for geometry is straightforward. All vertices are
    examined, and the minimum and maximum extents along all axes are stored.


    Occasionally, AABBs will be computed from a bounding sphere. In this case, the
    center of the AABB is the center of the sphere, and $x_{ext} = y_{ext} = z_{ext}
    = r$. Notice that this formulation is over an AABB fit directly to the bounding
    sphere, but that the box is invariant with respect to object rotation.


    To find collisions between two AABBs, the extents along all three axes are checked
    for overlap. If the two extents overlap along all three axes, then the AABBs are
    colliding. If they do not overlap along one axis, then they are not colliding.'
