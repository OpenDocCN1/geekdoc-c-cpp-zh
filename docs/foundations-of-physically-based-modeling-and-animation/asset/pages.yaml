  md: "# Deformable Spring Meshes ■ 163\n\nIf we compute the angle $\theta$ using\
    \ the method described above, the torque exerted by the spring will be\n\n```\n\
    $\\tau_k = k_theta(\\theta - \\theta_0)\\mathbf{\\hat{n}}_h,$\n```\n\nproducing\
    \ a rotation that decreases the angular difference when the torque vector is in\
    \ the same direction as the hinge vector and increases the angular difference\
    \ when it is in the opposite direction.\n\nAnalogous to linear struts, a torsional\
    \ spring should also include a damping term, so that oscillation produced by the\
    \ spring is damped out. The components of the velocities of the outside vertices\
    \ in the direction of their respective normals, divided by the distance from the\
    \ hinge, will give the angular velocity of face around the hinge. The above figure\
    \ shows how this works. In the figure $\\mathbf{v}_2$ is the velocity of the outside\
    \ vertex on the left triangle. The speed of this vertex in the direction of the\
    \ face normal is $s_l = \\mathbf{v}_2 \\cdot \\mathbf{\\hat{n}}_l$. The corresponding\
    \ rotational speed in radians per second about the hinge axis\n\n![](img/b434947f68660f7e26f8700ff77023a5_185_0.png)\n\
    \n```\n$\\dot{\theta}_l = s_l/||\\mathbf{r}_l||.$\n```\n\nSimilarly, the speed\
    \ of $\\mathbf{v}_3$ on the right triangle in the direction of its face normal\
    \ is $s_r = \\mathbf{v}_3 \\cdot \\mathbf{\\hat{n}}_r$, and the rotational speed\
    \ of the right face is\n\n```\n$\\dot{\theta}_r = s_r/||\\mathbf{r}_r||.$\n```\n\
    \nThe sum of these two angular velocities is a measure of how rapidly the faces\
    \ are approaching each other, and how fast the spring is stretching or compressing,\
    \ and can be used to add a damping torque\n\n```\n$\\tau_d = -d_0(\\dot{\theta}_l\
    \ + \\dot{\theta}_r)\\mathbf{\\hat{n}}_h,$\n```\n\ntending to reduce the net angular\
    \ velocity at the hinge. The constant $d_0$ determines the damping strength of\
    \ the torsional spring. Finally, the total torque produced by the torsional spring\
    \ and damper will be\n\n```\n$\\tau = \\tau_k + \\tau_d = [k_theta(\\theta - \\\
    theta_0) - d_0(\\dot{\theta}_l + \\dot{\theta}_r)]\\mathbf{\\hat{n}}_h.$\n```\n\
    \n# 8.3.3 Computation of the Vertex Forces from a Torsional Spring\n\nOur goal\
    \ is to compute the forces acting on the four vertices accounting for the torque\
    \ exerted by the torsional spring. We associate a force $\\mathbf{f}_i$ with each\
    \ vertex $i$."
