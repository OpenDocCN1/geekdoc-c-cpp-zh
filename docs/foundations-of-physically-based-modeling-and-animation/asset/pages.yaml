    # 8.1.1.4 Spring-Mass-Damper


    From these three exercises, we can guess that the behavior of a strut must be
    some form of sinusoidal oscillation, decaying over time in an exponential fashion.
    Further, the period of oscillation should be dependent on the ratio of mass to
    spring stiffness, and the exponential decay should be dependent on the ratios
    of damping to spring constant, and to damping.


    In order to explore the solution to the full equation, the following substitutions
    have proven to be highly useful. First, divide the homogeneous equation by mass
    to yield


    $$\ddot{x} + d/m\dot{x} + k/m = 0$.


    Note that the final term on the left-hand side is the square of the frequency
    obtained when there is no damping, so we let define the undefamped natural frequency
    and the corresponding period to be


    $$\omega_n = \sqrt{k/m}$, and $P_n = 2\pi\sqrt{m/k}$.


    A second substitution is to define a damping factor


    $$\zeta = \frac{d}{2\sqrt{km}}$


    Applying these substitutions to the differential equation gives us


    $$\ddot{x} + 2\omega_n\dot{x} + \omega_n^2 = 0$,


    which has the solution


    $x(t) = Ce^{-\omega_n t} \cos(\omega_n\sqrt{1-\zeta^2} t + \phi)$, or\n$x(t) =
    Ce^{-2\pi t/P_n} \cos(2\pi\sqrt{1-\zeta^2} t/P_n + \phi)$,


    for $\zeta$ in the range [0, 1]. Most real materials have damping factors much
    less than 1, so this solution is generally applicable to most damped problems.
    For example, metals usually have damping factors less than 0.01, rubber around
    0.05, and auto shock absorbers around 0.3.'
