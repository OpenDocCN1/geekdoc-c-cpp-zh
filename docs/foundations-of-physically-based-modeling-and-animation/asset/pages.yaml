  pgno: 315
- img_proc: true
  md: '# Foundations of Physically Based Modeling and Animation


    This is the foundation of forward differencing. Moving from the left of the figure
    to the right shows that as we move closer to the limit, letting $h$ become smaller
    but still finite, we get a better estimate of the slope of the curve at $x$. Now,
    suppose we have a one-dimensional field $\Phi$ sampled on a regular interval $\Delta
    x$, at $(\dots, x_{i-1}, x_i, x_{i+1}, \dots)$. Using forward differencing, the
    first derivative of $\Phi$ at $x_i$ would be estimated as


    ```

    $\frac{d\Phi}{dx}|_{x_i} \approx \frac{\Phi_{i+1} - \Phi_i}{\Delta x}$

    ```


    **Backward differencing:** Backward differencing is similar, but uses the derivative
    definition


    ```

    $\frac{d\Phi}{dx} = \lim_{h\to0} \frac{\Phi(x) - \Phi(x-h)}{h}$

    ```


    Using backward differencing on a regular set of samples, the first derivative
    of $\Phi$ at $x_i$ would be estimated as


    ```

    $\frac{d\Phi}{dx}|_{x_i} \approx \frac{\Phi_i - \Phi_{i-1}}{\Delta x}$

    ```


    ![](img/b434947f68660f7e26f8700ff77023a5_316_0.png)


    **Central differencing:** On the other hand, we could start with an alternate
    definition of the derivative, which is the foundation of central differencing,


    ```

    $\frac{d\Phi}{dx} = \lim_{h\to0} \frac{\Phi(x+h/2) - \Phi(x-h/2)}{h}$

    ```


    Central differencing explicitly places the derivative halfway between the two
    samples it is derived from. With central differencing, the first derivative of
    $\Phi$ at $x_i + \Delta x/2$ would be estimated as


    ```

    $\frac{d\Phi}{dx}|_{x_i+\Delta x/2} \approx \frac{\Phi_{i+1} - \Phi_{i-1}}{\Delta
    x}$

    ```


    and at $x_i - \Delta x/2$ the central differencing estimate would be


    ```

    $\frac{d\Phi}{dx}|_{x_i-\\Delta x/2} \approx \frac{\Phi_i - \Phi_{i-1}}{\Delta
    x}$

    ```


    Although the three approaches are identical in the limit as $\Delta x$ becomes
    vanishingly small, for a finite $\Delta x$ central differencing explicitly places
    the estimate where


    ![](img/b434947f68660f7e26f8700ff77023a5_316_1.png)'
