  md: '# Rigid Body Dynamics 191


    Now, while mass $m$ is a scalar, the value of inertia $I$ is instead a tensor
    (i.e., expressed as a $3\times 3$ matrix) that describes how mass is distributed
    in an object. The matrix form of $I$ allows it to describe how inertia varies
    in each direction.


    To give an intuitive sense of why the moment of inertia is not just a scalar,
    consider the two cylinders shown in the figure. They are sized so that they have
    identical mass; however, the long, thin cylinder will have a different moment
    of inertia than the squat, cylinder. You can probably guess that it will take
    more effort to rotate the long cylinder about a horizontal axis than to rotate
    the squat cylinder. On the other hand, it will take less effort to rotate the
    long cylinder about its vertical axis than the squat cylinder. The moment of inertia
    captures how these differences in mass distribution affect rotational inertia
    around the three axes.


    ![](img/b434947f68660f7e26f8700ff77023a5_213_0.png)


    You have probably encountered descriptions of inertia and conservation of angular
    momentum in an introductory physics class. The typical example used to illustrate
    angular motion is an ice skater on the ice. When the skater''s arms are held out
    from the body, the moment of inertia is relatively large (for the direction of
    spin). When the skater''s arms are brought into the body, the moment of inertia
    increases. This means that the skater will spin faster, the overall angular momentum
    is conserved. You can verify this by sitting on a chair or stool that is spinning
    while holding your arms out, and seeing how you spin faster by bringing your arms
    in. The effect is even more pronounced if you hold weights in each hand.


    Notice, though, that this effect of inertia varies based on the direction of spin.
    If the skater, instead of staying upright, were to have fallen down and spinning
    while lying flat on the ice, the moment of inertia would be quite different! If
    you lie on back on the stool and try to spin, you will spin differently than sitting
    upright, if your body is in the same position. It should be intuitive, that the
    moment of inertia has a different effect depending on the direction of spin. That
    is, $\omega$ will be different in magnitude for one direction of $\omega$ than
    for another, so $I$ cannot be a single scalar value.


    Just to clarify terminology, often people will refer to the "moment of inertia"
    as the moment of inertia for rotation about some specific axis, and refer to the
    matrix as the moment of inertia tensor (or matrix). We will just use the term
    "moment of inertia" to refer to the tensor.


    A typical representation for $I$ is for a symmetric $3\times 3$ matrix. We will
    see below how to compute $I$. An entry of this matrix indicates how much the spin
    in one direction affects the momentum in another. Since $I$ is a matrix, the overall
    magnitude of $I\omega$ can vary considerably as $\omega$ changes direction.'
