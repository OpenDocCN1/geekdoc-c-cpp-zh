  md: '# 170 Foundations of Physically Based Modeling and Animation


    Now, unfortunately, we do not typically set up our simulation environments in
    truly random positions. As a result we often encounter degenerate, or nearly degenerate,
    configurations of objects. For this reason, some people will implement additional
    code to check for and handle degenerate collisions, but doing so is beyond the
    scope of this book. Note, that even degenerate collisions have generic collisions
    occurring as part of them. For example, an edge-face collision occurs when there
    are two vertex-face collisions (objects A and B) or edge-edge collisions (objects
    C and D) happening simultaneously. Thus, handling generic collisions is critical,
    even for degenerate cases.


    ![](img/b434947f68660f7e26f8700ff77023a5_192_0.png)


    8.5.2 The collision detection process, between even two objects, can involve many
    vertex-face and edge-edge tests. However, for any one object, the faces, and edges
    tend to be grouped nearby, if two objects are sufficiently far apart, there is
    no need to perform all the individual vertex-face and edge-edge tests between
    them. Based on this, there are a number of methods for speeding up the collision
    detection process, and it becomes more important to use of these we deal with
    more complex geometry. Rather than sidetacked here, we will discuss these methods
    in more detail in Chapter 9, when we study rigid body dynamics.


    # 8.5.2.1 Vertex-Face Tests


    The vertex-face collision process is equivalent to the point-polygon collisions
    we have previously seen (see Section 3.5). We must consider the collision of each
    vertex of one object (the point), with each face of the other (the polygon). Note
    that collision checks assume that the faces are planar polygons. For a springym
    mesh, a nonuniform face can bend out-of-plane (e.g., one vertex pulled out of
    a cube), handling the resulting surfaces in a collision test is very difficult.
    When determining collisions, the models should be represented as a set of triangular
    faces.


    A key difference from prior point-polygon checks is, in this case, the polygonal
    faces themselves are moving. There is no difference in the actual mechanism for
    detecting and determining collisions, i.e., making the face and determining whether
    the point is above or below, and then determining whether the point is inside
    or outside of the polygon. However, we must be to calculate the current vertices
    of the polygon at every fractional timestep. The estimates of the time and location
    at which a collision occurs will be off due to the relative motion.'
