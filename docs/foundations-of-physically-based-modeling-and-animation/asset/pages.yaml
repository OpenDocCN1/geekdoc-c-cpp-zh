    state of all objects (particles) at one point in time, the simulation can be described
    more simply.


    +   - Spatial data structures such as uniform spatial grids, octrees, and kd-trees
    can help limit the number of particles examined for interaction. As one example,
    we see the benefit of such an effect in an astronomical simulation.


    +   - By applying a few simple rules regarding particle-particle interactions,
