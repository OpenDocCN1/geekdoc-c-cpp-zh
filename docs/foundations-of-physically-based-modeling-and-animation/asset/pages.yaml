  md: '# Foundations of Physically Based Modeling and Animation


    +   - Spatial derivatives are calculated by taking differences in sample values
    across cells and dividing by a cell width. These differences are taken in all
    three spatial directions to approximate partial spatial derivatives in these directions.


    +   - Upwinding schemes choose the direction for a finite difference, along a
    row or column, corresponding to the direction of the flow component along that
    row or column.


    +   - All of the differential operators, including gradient, divergence, and the
    Laplacian have discrete approximations depending on the differencing scheme being
    used.


    +   - Either a central or staggered sampling method can be used in constructing
    the spatial grid.


    +   - In the central sampling method, all samples are taken at the center of the
    cell, and differences must be computed using an upwinding scheme.


    +   - In the staggered method, the pressure and any other scalar fields are sampled
    in the center of the cell, but velocity and any other vector fields are sampled
    per component, with each component sampled at the appropriate cell center.


    +   - In staggered sampling, central differences can be used in almost all cases,
    locating the resulting derivatives exactly where they are needed for computation
    of accelerations.


    +   - A CFL condition is one that relates the spatial resolution of a simulation
    grid to the maximum velocity expected in the simulation, and the simulation timestep.
    For stability and accuracy, cell sizes should be kept such that an imagined fluid
    particle will not move more than one cell in one simulation time step.


    +   - The Semi-Lagrangian Method is a technique for efficiently computing the
    incompressible Navier-Stokes equations within a finite difference simulation.
    It obtains speed and stability by computing advection of the fluid velocity field
    using a Lagrangian approach, solving for the velocity diffusion using an implicit
    integration scheme, and by enforcing the incompressibility constraint by solving
    a Poisson equation for the pressure correction term.


    +   - The FLIP Fluid is fundamentally a Lagrangian approach. The fluid is represented
    by particles, as in SPH, the method also uses a spatial grid, constructed at each
    timestep. The velocity field is sampled from the particles onto grid, an updated
    velocity field is calculated, and the difference between the old and new velocity
    fields is projected back onto each particle to update its velocity. The particles
    are then moved by integrating their velocity over the timestep.'
