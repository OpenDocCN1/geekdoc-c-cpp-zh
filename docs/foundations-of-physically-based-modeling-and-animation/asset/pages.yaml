    In going from the model frame to the world frame, the origin of the model frame
    must be moved to the new origin at point **p**. The translation matrix in homogeneous
    form


    ```

    $T_{mw} = \begin{bmatrix} 1 & 0 & 0 & p_x \ 0 & 1 & 0 & p_y \ 0 & 0 & 1 & p_z
    \ 0 & 0 & 0 & 1 \end{bmatrix},$

