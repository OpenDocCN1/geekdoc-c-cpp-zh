  md: 'This equation can be solved for the acceleration on the system


    $\ddot{\mathbf{X}} = M^{-1}(\mathbf{F}_a + \mathbf{F}_c)$.


    Now, setting $\ddot{\mathbf{C}} = \mathbf{0}$, substituting the equation for $\ddot{\mathbf{X}}$,
    and isolating $\mathbf{F}_c$ on the left-hand side gives us


    $$\mathbf{J}M^{-1}\mathbf{F}_c = -\mathbf{J}\ddot{\mathbf{X}} - \mathbf{J}M^{-1}\mathbf{F}_a.$
    \(11.12)


    This equation cannot be solved for the constraint forces, because the matrix $\mathbf{J}M^{-1}$
    is $m \times n$, which will typically be non-square, and has no inverse. We can
    resolve this using the principle of virtual work together with the condition that
    $\ddot{\mathbf{C}} = \mathbf{0}$.


    Since $\ddot{\mathbf{C}} = \mathbf{0}$,


    $\mathbf{J}\ddot{\mathbf{X}} = \mathbf{0}$.


    By the principle of virtual work, none of the constraint forces can have a component
    aligned with the velocity of the mass that it is applied to, so


    $\mathbf{F}_c \cdot \ddot{\mathbf{X}} = \mathbf{0}$.


    The first of these conditions requires that each row of $\mathbf{J}$ be orthogonal
    to $\ddot{\mathbf{X}}$. For the second condition to be true, it must be possible
    to represent the constraint forces as linear combinations of vectors orthogonal
    to $\ddot{\mathbf{X}}$. Combining these two conditions, mathematically $\mathbf{F}_c$
    must lie in the row space of $\mathbf{J}$. Therefore,


    $\mathbf{F}_c = \mathbf{J}^T\boldsymbol{\lambda},$ \(11.13)


    where $\boldsymbol{\lambda}$ is a $m \times 1$ vector of scalars, with one element
    for each of the constraints. Equation 11.13 is the key in the constrained dynamics
    method. It states that the constraint force vector $\mathbf{F}_c$ is a weighted
    sum of the rows of $\mathbf{J}$. The weight for each row is the element of the
    vector $\boldsymbol{\lambda}$ corresponding to that row. Therefore, instead of
    needing to solve for the vector elements of the constraint force vector $\mathbf{F}_c$,
    we need only solve for the scalar elements of $\boldsymbol{\lambda}$. Once we
    know $\boldsymbol{\lambda}$, Equation 11.13 gives us $\mathbf{F}_c$.


    Substituting Equation 11.13 for $\mathbf{F}_c$ in Equation 11.12 gives us


    $\mathbf{J}M^{-1}\mathbf{J}^T\boldsymbol{\lambda} = -\mathbf{J}\ddot{\mathbf{X}}
    - \mathbf{J}M^{-1}\mathbf{F}_a.$ \(11.14)


    The matrix $\mathbf{J}M^{-1}\mathbf{J}^T$ is $m \times m$, so a solution to this
    equation is possible.


    As with our single constraint example, implementations should add a PD controller
    to eliminate numerical drift in $\mathbf{C}$, so we would actually use


    $\mathbf{J}M^{-1}\mathbf{J}^T\boldsymbol{\lambda} = -\mathbf{J}\ddot{\mathbf{X}}
    - \mathbf{J}M^{-1}\mathbf{F}_a - k_p\mathbf{C} - k_d\ddot{\mathbf{C}}$. \(11.15)


    If we handle large systems of constraints, solving this equation can become a
    bottleneck in the system force calculations. Fortunately, the matrix $\mathbf{J}M^{-1}\mathbf{J}^T$'
