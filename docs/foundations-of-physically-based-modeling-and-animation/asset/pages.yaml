  md: '# CHAPTER 13


    # Foundations of Fluid Dynamics


    BEFORE EMBARKING ON A DISCUSSION OF FLUID SIMULATION it is important to establish
    the notion of what we mean by a fluid is not necessarily a liquid, but includes
    all liquid and gaseous materials. In most animation situations, the fluids we
    will be considering are either water or air. The key point is that when dealing
    with fluids we are no longer dealing with discrete particles, but with continuous
    media.


    Until now, the objects that we have been seeking to animate have either particles,
    systems of particles, or rigid bodies. In each case, we have been dealing with
    individual elements whose behavior is tracked over time. The problem of animating
    fluids is different. Instead of dealing with individual elements, we have a continuously
    deforming mass that has no distinct parts. On the left, the smoke is falling and
    interacting with a set of stairs. On the right, the smoke is rising in turbulent
    air, and being deflected by a ball requires us to develop a new set of mathematical
    tools, in particular the notion of a field and operators that act on fields. In
    addition, it suggests that we may need to look deeper at computational strategies
    for simulation.


    In this chapter we attempt to lay the foundations for the study of fluid simulation.
    The reader who wishes to go more deeply into the subject should first turn to
    the excellent book by Bridson [2008], Fluid Simulation for Computer Graphics.


    # 13.1 LAGRANGIAN VERSUS EULERIAN SIMULATION


    There are two primary approaches to simulation, known as the Lagrangian and Eulerian
    approaches. In Lagrangian methods, the mass of the material is divided into discrete
    elements, each of motion is individually tracked. Thus, each discrete element
    has a position in space, and carries with it the momentum of the mass represented
    by the element. Everything in the previous chapters of this book'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# 268 Foundations of Physically Based Modeling and Animation


    ![](img/b434947f68660f7e26f8700ff77023a5_290_0.png)


    FIGURE 13.1 Simulations of smoke interacting with solid obstacles. (Courtesy of
    Ruoguan Huang.)


    has been grounded in the Lagrangian approach, from particle systems to rigid body
    simulations. Eulerian methods use a very different approach. Instead of the material
    being represented by discrete elements, space itself is subdivided into discrete
    cells, with the simulated material being tracked by these cells as it moves through
    them. For example, in a fluid simulation space may be divided into a fixed spatial
    grid, with each cell cell recording the velocity and other properties of the fluid
    passing through it.


    On the surface, it would seem that any simulation handling elements that are discrete
    most naturally be done using a Lagrangian approach, and any simulation handling
    elements that are time-varying continuous media would most naturally be done using
    an Eulerian approach. For the most part this is true, but we would run into problems
    created by the nature of these methods. Since Eulerian methods discretize space,
    it is often difficult to represent fine detail—for example, it is hard to capture
    the complex detail of splashing in a fluid simulation. Since Lagrangian methods
    discretize space, for example, the material being simulated, bulk properties,
    and any other total mass, are difficult to maintain—it is difficult to maintain
    a constant volume or a constant density in a fluid simulation.


    In the rest of this chapter we first lay out the mathematical foundations for
    treating continuous fluids, describe the Navier-Stokes equations for fluid momentum
    update, and then go on to describe the most popular Lagrangian and Eulerian methods
    for simulating fluids for computer animation.


    # 13.2 MATHEMATICAL BACKGROUND FOR FLUID SIMULATION


    # 13.2.1 Scalar and Vector Fields


    The mathematical notion of a field is a quantity defined everywhere in space,
    and whose value is spatially determined. Consequently, a field can be thought
    of as a function, mapping spatial position x to a unique quantity. Fields can
    be either fixed (sometimes called steady), in which case the notation would be
