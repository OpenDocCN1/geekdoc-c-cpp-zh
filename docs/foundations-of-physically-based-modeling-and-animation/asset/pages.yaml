  md: "# Foundations of Physically Based Modeling and Animation\n\na torsional spring.\
    \ The calculation of accelerations on each particle of a springy mesh, augmented\
    \ with torsional springs, would also require the computation of hinge forces when\
    \ looping over each strut.\n\n# 8.4 CHOOSING GOOD PARAMETERS\n\nWhen setting up\
    \ a springy-mesh system, choosing a set of parameters that gives a desired behavior\
    \ can be confusing, since the parameter settings all interact to affect the important\
    \ behavioral characteristics of the mesh. The following is a cookbook to approach\
    \ the parameter setting that will allow the animator to quickly get to settings\
    \ that produce a desired effect.\n\nThe easiest parameter to set is mass. All\
    \ of us have a strong intuitive feel for what the approximate weight of an object\
    \ should be, so it makes to start with a good guess at what the real-world mass\
    \ would be for a particular model. A bowling ball would have a mass of 7 kg, a\
    \ tennis ball about 0.06 kg, and a ping-pong ball of 0.003 kg. These are approximate\
    \ numbers—the important thing is that the mass be in the right range.\n\nThe usual\
    \ beginner's mistake is to set the mass to 1, with unspecified units, with the\
    \ idea that it simplifies all of the equations. The problem with this is that\
    \ if we make a tennis ball's mass 1, then the mass of a bowling ball will have\
    \ to be 116, if they are to occupy the same world and behave consistently. If\
    \ all of them are given the mass of 1 then the world will strangely indeed! If\
    \ mass is chosen to physically realistic values, according to your favorite measuring\
    \ system, then the animated world will have a reasonable physical consistency,\
    \ which would be reflected in the observed behavior.\n\nOnce a mass for an object\
    \ is chosen, it must be distributed among the vertices of the model. If the object's\
    \ mass is $M$, and its model has $N$ vertices, then the mass of each vertex $i$,\
    \ could be $m_i = M/N$. An better approach would be to adjust each vertex's mass\
    \ according to the fraction of the total area of the surface represented by the\
    \ triangles to that vertex.\n\nConsider a cube, represented by triangular faces,\
    \ as shown in the figure. If the side of the cube is length $L$, then the total\
    \ surface area of the cube will be $A=L^2$, and the area of each triangular face\
    \ will be $L^2/2$. Thus, if $M$ is the total mass of the cube, each triangle would\
    \ account for mass $M/12$. As distributing lift forces, the trick is to distribute\
    \ this mass to the vertices of each triangle according to the angle of the triangle\
    \ at that vertex. Consider vertex 0. It has four adjacent triangles, two with\
    \ angle $45^\\circ$ and two with angle $90^\\circ$. So the total mass distributed\
    \ to vertex 0 would be $\\frac{1}{4}(M/12) \times 2 + \\frac{1}{2}(M/12) \times\
    \ 2 = M/8$. Vertex 1 has 5 adjacent triangles, for angle $45^\\circ$ and one with\
    \ angle $90^\\circ$, so its total mass would be $\\frac{1}{4}(M/12) \times 4 +\
