  md: '# # Preface


    THE IDEA FOR THIS BOOK WAS BORN BACK IN 1994, when Donald House began teaching
    a course in Physically Based Modeling within the Visualization MS Program at Texas
    University. He has taught a version of this course every year since then, after
    moving to Clemson University in 2008. When Don left A&M, John Keyser took over
    the course and has continued to this day. Although we have been teaching the course
    for 22 years, we have never had a textbook, suitable to support it. All of the
    illustrations in the book come from student projects undertaken in this course.
    The students are credited in the figure captions.


    The book covers the material that we teach in the course and much more. It is
    conceived as a broad introduction to the field of Physically Based Modeling and
    Animation, suitable as either a textbook or a reference for researchers entering
    the field. Our idea in choosing topics for the book was to provide a foundation
    from which it would be possible to support animation projects and dive into the
    expanding research literature in the field. For students planning to use existing
    physical simulation toolkits to implement their own code, or professional tools
    such as the major animation packages, it provides much of the background needed
    to understand what is going “under the hood”.


    Because we wanted the book to be relatively timeless, it is not written with any
    programming language or graphics API in mind. while the book uses pseudo-code
    to document algorithms, it does not include same code. In our courses, students
    work in C++ and use OpenGL as the graphics API. The choice of C++ with OpenGL
    is determined by performance considerations. But, with a performance hit, reasonable
    projects could be developed in Java, C#, or Python, combined with any reasonable
    graphics API, or Processing or D3, which have their own built-in graphics.


    The students who our class have a variety of motivations, from pursuing research
    in this or related fields, using animation for purposes. Many of our students
    are preparing for careers as VFX artists in the film, animation, and game industries,
    where hundreds of our former students are employed. A number of them have gone
    on to FX leads on major films, and VES award winners and nominees. Thus, our students
    come from backgrounds ranging across the spectrum, from engineering to fine art.
    What they do not share in training, they share interests and proclivity. Because
    of this expected audience, the course is not pinched solely at computer science
    and engineering students. It'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'assumed that students will have at least two semesters of calculus so that
    they are familiar with the concepts of differentiation and integration, and they
    must also be competent programmers and have mastered the basics of display graphics.


    To accommodate this diverse range of students, we weave the necessary mathematical
    principles into the curriculum, with an emphasis on linear algebra. For the book,
    we decided to separate this material out into a set of six appendices. We chose
    this organization, so that this background material does not interrupt the main
    flow of the book. Instructors can weave this material back into their courses
    as needed for their student population. Some review of basic concepts, and brief
    explanations of more advanced mathematical concepts, are included inline with
    the chapters.


    While the course that we teach is meant to be introductory, the book is also designed
    as an invitation to the field with a research orientation. To meet this need,
    we have chosen a number of more advanced topics for inclusion. This material is
    located throughout the book. Additional detail is provided on a number of topics
    including advanced numerical integration methods, methods for speeding up simulations,
    stability analysis, fluid simulation techniques, handling multiple contacts in
    rigid body simulations, constraint systems, and articulated dynamics. This material
    could form the base for a second course, or simply be used for additional study.


    Every book has its limitations, and ours too. Most notably, it does not cover
    several important topics in physically animation, including finite element modeling,
    signed distance fields, fluid surface simulation, and character animation. Finite
    elements are increasingly used in the simulation of deformable materials, fracture,
    and fluids. Signed distance fields have numerous uses, from capturing the evolving
    shape of a fluid surface, to providing an efficient mechanism for predicting collisions.
    It is often the case that only the fluid surface is of interest for a water scene.
    This is best handled with approaches such as height fields and waves, rather than
    the Navier-Stokes equations. And, bringing characters to life has always been
    the ultimate of animation. This continues to be true in both games and film, as
    physically based animation is increasingly integrated with motion capture to produce
    highly realistic motion. It is our hope that, if the book proves successful, these
    topics can be added in these areas in a second edition or as an additional volume.


    It is our plan to maintain a website providing online support for readers of the
    book. Initially, it will contain suggested exercises to go along with each chapter,
    demonstration software to augment explanations in the book, and support libraries
    such as matrix and vector routines. As we learn of errors or shortcomings in the
    book we will provide an errata list. The website is hosted at http://www.clemson.edu/savage/pba


    For instructors planning a course, we would like to suggest three sample curricula,
    depending on the target audience.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Curriculum for Undergraduate Mid-Level Computer Science Students


    This 15-week curriculum focuses on particle-based simulation. Possible projects
    could include a 3D bouncing ball, a particle system simulation, a flocking system,
    and spring-based deformable objects. If there is time, it is very motivating for
    the students to design their own project and execute it as a final assignment.
    We found that requiring a proposal that includes some visual reference is important
    for success. The visual reference can be anything that for example it be original
    sketches or photos, or images, or animation from the web. We formally review and
    approve the proposals, with any necessary modifications, and grade based on how
    successful the students were in achieving the goals of their proposals.


    | Day | Readings | Topics |

    |---|---||

    | 1 | Chapter 1 | Introduction to the course |

    | 2 | Chapter 2.1-6 | Foundations of physical simulation |

    | 3 | Appendix A | Vector mathematics |

    | 4 | Chapter 2.7-8 | 3D motion with air resistance |

    | 5 | Chapter 3.1-3 | Collisions with an infinite plane |

    | 6 | Appendix B | Matrices |

    | 7 | Appendix C | Affine transformations |

    | 8 | Chapter 3.4-5 | Collisions with polygons |

    | 9 | Appendix F, Chapter 3.6-7 | Barycentric coordinates and collisions with
    triangles |

    | 10-13 | Chapter 4 | Particle systems |

    | 14-17 | Chapter 5 | Particle system choreography |

    | 18 | Chapter 6.1-2 | State vector representation |

    | 19 | Appendix D | Coordinate system transforms |

    | 20-21 | Chapter 6.3 | Spatial data structures |

    | 22 | Chapter 6.4 | Astronomical simulation |

    | 23-24 | Chapter 6.5 | Flocking systems |

    | 25-26 | Chapter 7.1, 7.3-5 | Numerical integration |

    | 27-28 | Chapter 8.1-2 | Springy objects |

    | 29 | Chapter 8.5 | Springy collision detection and response |

    | 30 | Chapter 8.6-7 | Lattice deformers and cloth |


