  md: '# 10.2.3 Narrow Phase Collision Detection


    The narrow phase of collision detection is usually handled through bounding volume
    hierarchies. The idea is to form a tree of bounding volumes covering progressively
    fewer and fewer of the polygons making up the object''s boundary.


    At the base level, the top node of the tree, is a bounding volume covering the
    entire object. The children nodes represent a partitioning of the polygons in
    the parent node. Each child node has a bounding volume of its own, and it is further
    partitioned into smaller and smaller regions. Finally, the leaf nodes of the tree
    will represent a bounding volume for one or a few individuals. The bounding volume
    tree is often binary, but it is possible to have multiple children nodes. The
    figure illustrates how a single object might be hierarchically subdivided, with
    OBB volumes computed at each subdivision in the hierarchy.


    ![](img/b434947f68660f7e26f8700ff77023a5_239_0.png)


    To check for a collision between two objects, a recursive procedure is followed.
    First, the bounding volumes for the top levels are paired for overlap. If they
    do not intersect, then the polygons within the bounding regions cannot intersect.
    If they do intersect, then the pairs of child nodes are checked. This continues
    recursively until a pair of intersecting leaf nodes is detected. At this point,
    the individual polygons represented by that leaf node are checked for intersection.
    Typically, this means that two triangles are checked for intersection.


    The triangle intersection test is more complex than a bounding volume intersection
    test, and the whole point of the bounding volume hierarchy is to minimize the
    number of tests. The basic process for determining the intersection of one triangle
    with the plane containing the other triangle. This will form a line segment, the
    endpoints of which are determined by finding the intersection points of a triangle''s
    edges with the plane. Note that the two edges that intersect the plane can be
    identified by finding the edges whose vertices are on opposite sides of the plane.
    Then, the process is repeated for the other triangle, forming a second line segment.
    Finally, the two line segments, which must lie along the same line (the line of
    intersection between the two planes), are checked for overlap. If this line segment
    overlaps then the triangles are intersecting.


