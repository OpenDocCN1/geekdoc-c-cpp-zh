    We can summarize the linear (translational) and rotational components of rigid
    body motion in the following way:


    | Linear | Angular |

    |---|---|

    | Mass: m | Moment of Inertia: I |

    | Position: x | Orientation: R |

    | Velocity: v | Velocity: $\omega$ |

    | Momentum: P | Momentum: L |


    # 9.2 PROPERTIES OF RIGID BODIES


    In order to simulate rigid bodies, we must know their inherent properties, such
    as center of mass and moment of inertia. In earlier examples based on particles,
    we cared only about overall mass, which could be arbitrarily specified by an artist.
    For realistic rigid body motion, though properties such as center of mass and
    moment of inertia must be computed so that they match the geometry of the objects
    being simulated.


    # 9.2.1 Center of Mass


    In order to ensure that an object is centered at its center of mass in the local
    coordinate frame, we must first compute its center of mass.


    The general definition of the center of mass of an object is the point at which
    the mass is equally distributed in all directions. We can find this by integrating
    the density-weighted position, as follows:


    ```

    $c = \frac{\int_V \rho(\mathbf{x})\mathbf{x}dV}{\int_V \rho(\mathbf{x})dV}$$

    ```


    Note that we usually cannot compute the integral directly, since we rarely have
    a continuous definition. We, often assume the density is uniform, so that it factors
    out of the two integrals also removing it as a factor in the equation.


    If the object were made up of a set of discrete points with mass (as in the spring-mesh
    models we used before), we could just take a weighted average of the points to
    find the center of mass. That is, if the points have position $x_i$, and mass
    (or weight) $m_i$, then the center of mass is


    ```

    $c = \frac{\sum m_i\mathbf{x}_i}{\sum m_i}$

    ```


    In 3D computer graphics, most objects are typically specified by a triangular
    mesh of the surface. There are two main models that we can compute the center
    of mass from such an object.'
