    If gravity can pull a particle towards a point, we could also define an attractor
    that pulls a particle towards a line with force affected by distance from the
    line. This could be an infinite line or a line segment of finite length. Let would
    be done for a line segment. We specify the line segment by a starting point $\mathbf{x}_a$,
    a unit vector $\hat{a}$ in the direction of the line, and length $L$. Referring
    to the diagram to the right, consider this attractor’s effect on particle $i$
    with position $\mathbf{x}_i$. The vector from the starting point of the line segment
    to particle is $\mathbf{x}_{ai} = \mathbf{x}_i - \mathbf{x}_a$. The length of
    the projection of this vector onto the line segment’s direction is $l_{ai} = \mathbf{x}_{ai}
    \cdot \hat{a}$. At this point, we can test $l_{ai}$ to see if the particle lies
    within the extent of the line segment. If $0 \le l_{ai} \le L$ then particle lies
    within the line segment’s extent, otherwise it does not. If, instead of a line
    segment, we want to use an infinite line attractor, all that needs to be done
    is to test this, and its ramifications below. If the particle lies within the
    line segment’s extent then the vector orthogonal to the line segment point out
    to $\mathbf{x}_i$ is $\mathbf{r}_{ai} = \mathbf{x}_{ai} - l_{ai}\hat{a}$, and
    the distance from the particle to the line is $r_{ai} = ||\mathbf{r}_{ai}||$.
    If the particle lies outside of the line segment’s extent, we have two choices:
    we can ignore the line segment’s gravitational effect entirely,'
