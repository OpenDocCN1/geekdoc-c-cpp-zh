    time $t_0$ and have to know the value of the function $f(t_0)$ exactly. We also
    know the derivative function $\dot{x} = f(x)$. Now, we want to use RK2 integration
    to estimate the function at the next timestep $t_0+h$. The first step is to find
    the derivative of $x$ at the current time, $k_1 = f(x_0)$; (b) Using Euler integration,
    we would advance one timestep to $x(t_0)+k_1h$. Note, that this is a large deviation
    from the exact curve we are trying to approximate. (c) In RK2, a half timestep
    to $x(t_0)+k_1/2$, and using this state, we compute the derivative again, giving
    us $k_2=f(x_0+k_1h/2)$. (d) Finally, we start back at $t_0$, but use $k_2$ to
    advance the full timestep, resulting in a final estimate $x(t_0)+k_2h$ that is
    considerably better than the estimate we would obtained using only Euler integration.
    RK2 is a second-order method. Notice unlike Verlet integration, we are always
    computing derivatives of the entire state, so that the accelerations can be based
    on just position, but also velocity. However, note also that RK2 requires us compute
    that derivative F twice each timestep, whereas Verlet integration required only
    one calculation of the derivative per timestep.


    # 7.3.2 Fourth-Order Runge-Kutta


    The family of RK methods is very extensible. RK techniques are capable of integrating
    at any order, and there are multiple ways of computing an n-th order approximation.
    As obvious from the RK2 example, higher-order integration takes more time per
    step. In the RK2 algorithm, timestep required evaluating the derivative function
    F twice, and as we use higher-order RK methods, we have to compute F more often
    per timestep. Since computing F is typically the most expensive part of integration,
    there is thus a trade-off: we can get a more accurate estimate, but only if we
    spend more time per timestep.


    Recall that we can also get accurate estimates by taking smaller timesteps. That
    is, we could take two timesteps of half the length. As a result, we are faced
    with a challenge: if we need more accurate results, it is better to use a higher-order
    method, or to take smaller timesteps? This is discussed in more detail in Section
    7.4.


    There is actually an infinite number of variations on how RK4 can be computed,
    but there is one approach that is commonly used, and when we say RK4, we usually
    refer to this method. Some people do not even make that distinction: sometimes
    you will just see this approach called the Runge-Kutta approach. Commonly used
    RK4 approach is as follows:


    ```

    $K_1 = \mathbf{F}(\mathbf{S}^{[0]})$,

    $K_2 = \mathbf{F}(\mathbf{S}^{[0]} + 0.5hK_1)$,

    $K_3 = \mathbf{F}(\mathbf{S}^{[0]} + 0.5hK_2)$,

    $K_4 = \mathbf{F}(\mathbf{S}^{[0]} + hK_3)$,

    $\mathbf{S}^{[i+1]} = \mathbf{S}^{[i]} + \frac{h}{6}(K_1 + 2K_2 + 2K_3 + K_4)$.

    ```'
