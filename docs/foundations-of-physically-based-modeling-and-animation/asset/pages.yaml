    # 7.7 IMPLICIT INTEGRATION


    We have seen an analysis of how methods such as RK can run into stability problems.
    With an oscillator has a small period or a decay that has very short time constant,
    the methods we have seen run into serious stability problems. Often, the step
    size needs to ensure stability, if it exists, is so small that the simulation
    takes unacceptably long to run. It would be acceptable to spend more time on any
    one timestep if we could use larger step sizes and maintain stability. Implicit
    integration methods provide a way of doing exactly.


    All of the integration methods we are describing attempt to determine a new state
    $S^{[n+1]}$. When this is based on the knowledge of the current state $S^{[n]}$,
    we say this is an explicit integration approach. When we have a method where some
    knowledge of the next state is needed to determine that next state, we call that
    an implicit method.


    One of the most basic implicit integration methods is Implicit Euler or backward
    Euler integration, which we compare to "standard" explicit Euler integration:


    ```

    $S^{[n+1]} = S^{[n]} + F(S^{[n]})h$ (Explicit Euler)\nS^{[n+1]} = S^{[n]} + F(S^{[n+1]})h$
    (Implicit Euler)

    ```


