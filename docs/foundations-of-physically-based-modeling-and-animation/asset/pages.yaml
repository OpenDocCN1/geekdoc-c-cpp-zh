    If $0 \le t_{hit} < h$ then there is a collision at time $t_{hit}$ during the
    timestep; otherwise the particle is either traveling away from the plane or will
    not collide until a time beyond the current timestep. Note that $t_{hit}$ is exactly
    the same as $f$ in Equation 3.2, just written in a different form.


    If there is a collision during the timestep, it will occur at the position


    $\mathbf{x}_{hit} = \mathbf{p}_i + t_{hit}\mathbf{v}_i$.


    Determining if $\mathbf{x}_{hit}$ is inside or outside of the polygon will tell
    us if the collision is within the polygon.


    Although the inside-outside test looks like a 3D problem, it is really planar,
    because all of the vertices of the polygon and $\mathbf{x}_{hit}$ lie in the same
    plane. Further, note that a single orthographic projection onto one of the three
    2D coordinate planes will not change the inside-outside relationship of $\mathbf{x}_{hit}$
    to the polygon, unless the polygon is projected "edge on" into a single 2D line.


    To avoid projecting the polygon into a line, we should choose to project the polygon
    onto the coordinate plane having the largest orthographic projection (image) of
    the polygon. The best coordinate plane can be determined by examining the surface
    normal $\mathbf{\hat{n}}$. The direction of $\mathbf{\hat{n}}$ that has the largest
    magnitude determines the direction of the normal perpendicular to the plane. Therefore,
    the projection should be as follows:


    ![](img/b434947f68660f7e26f8700ff77023a5_59_0.png)


    +   |\hat{n}_x$| largest project to $y-z$ plane: $(x, y, z) \implies (y, z)$.\n|\hat{n}_y$|
    largest project to $z-x$ plane: $(x, y, z) \implies (z, x)$.\n|\hat{n}_z$| largest
    project to $x-y$ plane: $(x, y, z) \implies (x, y)$.'
