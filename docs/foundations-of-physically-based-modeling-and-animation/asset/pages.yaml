    # 6.5 FLOCKING SYSTEMS


    When viewing a large bird flock, like the simulated one shown in Figure 6.4, the
    impression is of a large many-bodied organism that has a mind of its own, exhibiting
    complex and intricate behaviors as it wheels and swirls through the sky. This
    fascinating group behavior is a wonderful example of what is known as an emergent
    phenomenon. Emergent phenomena occur when rules for interaction, followed at a
    small scale by many “actors,” aggregate to produce a group behavior at a larger
    scale. Galaxy formation from billions of individual stars is one example of such
    an emergent phenomenon. The behavior of flocks of birds or schools of fish is
    another, quite different, emergent phenomenon. The interaction rules are formed
    by mindless actors, all following identical interaction rules (i.e., gravitational
    attraction), while a flock of birds is made up of a collection of individuals,
    each with its own unique mind, physiology, and anatomy. We can think of the birds
    as individual decision makers, functioning within a system of guiding rules of
    behavior.


    In his classic paper Flocks, Herds, and Schools: A Distributed Behavioral Model,
    Reynolds [1987] put his research in agent-based programming together with studies


    ![](img/b434947f68660f7e26f8700ff77023a5_125_0.png)


    FIGURE 6.4 Flock of birds. (Courtesy of Liang Dong).'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Foundations of Physically Basedled Modeling and Animation


    in behavioral biology to describe the first computer graphics algorithm capturing
    animal behavior. Since his algorithm is general boid to apply across species,
    he calls the actors in his model "boids," short for "birdoid objects." His approach
    is completely agent based—there is no global control for the flock as a whole—the
    behavior of a flock is emergent. Each boid follows a set of three simple rules
    guiding how it accelerates in response to the positions and velocities of its
    neighbor boids.


    The algorithm works as follows. For each timestep, each boid compiles a list of
    other boids in its neighborhood. For each of these neighbors, it computes three
    accelerations: collision avoidance, velocity matching, and centering. Collision
    avoidance provides an acceleration that prevents the boid from colliding with
    its neighbor. If it is too near to its neighbor, it accelerates. Velocity matching
    makes the motion of the flock coherent. The boid will attempt to match its neighbor''s
    velocity by applying an acceleration to correct the speed and direction of its
    velocity. Centering attempts to pull the flock together by applying an acceleration
    that causes the boid to move toward its neighbor. The accelerations from all the
    boids in a boid''s neighbor list are then used to produce the total flocking acceleration
    on the boid. Other accelerations, as those due to gravity, wind, and the need
    to steer around environmental objects, can also be applied to fit the goals of
    the animation.


    # 6.5.1 Core Algorithm


    The figure right provides a vector diagram for computing the accelerations. We
    assume that we are dealing with boid i at position xᵢ, and flying with velocity
    vᵢ. It is near boid j whose position is xⱼ, and has velocity vⱼ. The vector from
    boid i to boid j is xij = xⱼ - xᵢ, the distance from i to j is dij = ||xij||,
    and the direction vector from i to j is xij/dij. The three accelerations on boid
    j due to the presence of boid j


    ![](img/b434947f68660f7e26f8700ff77023a5_126_0.png)


    **Collision avoidance:** aᵢⱼ = -kaᵢxij, pushes boid i away from boid j,


    **Velocity matching:** aᵢⱼ = kpᵢ(vⱼ - vᵢ), adjusts boid i’s velocity to match
    j’s,


    **Centering:** aᵢⱼ = kij pulls boid i toward boid j.


    In these equations, ka, kp, and kr are tunable scale factors governing the strength
    of each of the accelerations. Note that these accelerations are coming from the
    internal decision processes of boid i and not directly from boid j. Therefore,
    Newton’s third law does not necessarily hold—i.e., there is no requirement that
    boid j’s accelerations in response to boid i be equal and opposite.'
