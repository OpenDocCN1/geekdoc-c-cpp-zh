  md: 'minimum x-y-z coordinates, which corresponds to the outside corner of array
    cell [0, 0, 0]. If the array indices are arranged in depth-plane, row, column
    order, the index of the cell containing the point x = (x, y, z) is given by the
    spatial hash function


    ```

    $h(x) = |(z-z_0)/\delta_z|, |(y-y_0)/\delta_y|, |(x-x_0)/\delta_x|; \quad (6.8)$

    ```


    Any interacting particle algorithm using uniform grid data structure will perform
    an initialization at the beginning of each timestep. The initialization will begin
    by looping through each of the particles in the system, hashing each particle''s
    position to a grid cell, and placing that particle in the list for voxel. After
    this particle mapping process is complete, the next step will be to loop through
    each voxel to compute any auxiliary information that may be needed by the algorithm
    making use of the data structure. For a large interacting particle system this
    initialization will take negligible time compared to the time particle interactions.


    Neighbor finding in a uniform grid is as easy as computing offsets from a cell
    indices. If a particle is in cell p, row r, and column c its index is (p, r, c).
    Then, all "neighbor" particles, which are no more than two cell widths away from
    this particle, are contained in the 2-cell volume uniform


    ```

    $I = (p-1 \dots, p+1, r-1 \dots, r+1, c-1 \dots, c+1).$

    ```


    Any particle in a cell outside of interval I is guaranteed to be more than one
    cell width away.


    In some programming languages, allocation of a multidimensional array is not well
    supported. In this case, a uniform grid of L layers, M rows, and N columns can
    be allocated as a one-dimensional array of L x M x N cells. The uniform grid is
    allocated in this way, the index for cell (p, r, c) will be


    ```

    $i = (pM+r)N+c.$

    ```


    In this case, it will be useful for the programmer to create a function returning
    the index value so it can be conveniently retrieved whenever it is needed.


    # 6.3.2 Octrees


    An octree is a spatial data structure that provides the ability to adaptively
    sample space at whatever resolution is required for a particle distribution or
    a given algorithm. If all particles are distributed uniformly in the space of
    a problem, then a uniform grid will have the same number of particles in each
    voxel. However, if the particle distribution contains dense and sparse regions,
    some of the uniform grid will be heavily populated, while others may have no particles
    or a very small number of particles. Algorithms exploiting a uniform spatial subdivision
    to gain speed-ups will lose efficiency under these conditions, and in fact can
    become slower than directly computing all interactions. An octree'
