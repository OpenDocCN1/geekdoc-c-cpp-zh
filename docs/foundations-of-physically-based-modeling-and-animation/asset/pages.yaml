  md: '# 74 Foundations of Physically Based Modeling and Animation


    # 5.3 COLLISION AVOIDANCE


    In Chapter 3 we covered the handling of collisions between a ball and a geometric
    object, but often the effect that we desire is to avoid collisions, directing
    particles around environmental objects that they never collide. Imagine a stream
    of air blowing across a pole. Due to the pressure of the air, the flow will be
    directed around the pole, with very few air molecules actually colliding with
    the pole. Collision avoidance in a particle system is a way to have a stream of
    particles mimic this sort of behavior. We will see this topic again in Chapter
    6, when we look at the simulation of the flock of birds or school of fish.


    # 5.3.1 Potential Fields


    The simplest way to implement collision avoidance is to build a potential field
    around each environmental obstacle provides an acceleration away from the obstacle.
    The point or line gravity operators described in Section 5.1.1 will work very
    well for this purpose. By removing the minus sign from these operators, they will
    act to repel objects rather than attracting them, making anti-gravity operators.


    If the object to be avoided is regular in shape, similar to a sphere or a cube,
    placing a single anti-gravity point at its center may be sufficient. If it is
    elongated, like a pole or skyscraper, an anti-gravity line can be used. For complex
    shapes, a collection of points and lines might be needed.


    A useful idea here is to provide an extent for each of the operators, so that
    it exerts no acceleration beyond a maximum distance. In this way, we avoid the
    problem of having to compute and add the effect of multiple operators at every
    timestep. Only operators near to a particle affect it.


    Sometimes it is desired to constrain a particle system inside a geometric object.
    In this case, we can make the entire surface of the containing object the field
    generator, so that particles are pushed away from the surface of the object. A
    simple example would be a sphere with center $c_s$, and radius $r_s$ acting as
    a center. The acceleration operator would be computed as:


    ![](img/b434947f68660f7e26f8700ff77023a5_96_0.png)


    ```

    $$\mathbf{x}_{si} = \mathbf{x}_i - \mathbf{c}_s$,$

    d_{si} = ||\mathbf{x}_{si}||$,$

    $\mathbf{a}_{si}^{op} = -G_s \frac{1}{(r_s - d_{si})^{p_s}} \hat{\mathbf{x}}_{si}$.

    ```


    Here $G_s$ is a tunable strength constant, and $p_s$ governs how quickly the force
    of the anti-gravity falls off with distance from the sphere surface.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Particle Choreography 75


    Although potential fields are easy to implement and can be effective in preventing-collisions,
    they often produce effects that are not physically realistic. A particle headed
    directly towards an anti-gravity point will be slowed down and pushed backward
    but will not turn away. Another problem is that a particle near an anti-gravity
    point will be pushed away by whether or not there is any danger of a collision.
    The net effect will be that particles are prevented by the net field colliding
    with protected objects in a way that can look physically unrealistic. However,
    it can look remarkably like “Shields up Captain!”


    # 5.3.2 Steering


    A more complex but more interesting approach to collision avoidance is particle
    steering. We think of the particle as an intelligent actor, imagining that it
    has eyes looking ahead, and the ability to steer itself by planning a route around
    impending obstacles. The approach is to locate a viewing coordinate frame at the
    position of the particle, with its z aligned with the velocity vector. We associate
    with this angular field of view, which can be tuned by the animator to achieve
    the desired behavior. Finally, we set a maximum viewing distance, which should
    be determined by the particle''s speed and the estimated time required to take
    evasive action. The faster the particle is traveling, the farther this distance
    should be. Now, imagine imagine each object within the particle''s view cone can
    be seen by the particle, and its image used by the particle to plan any required
    evasive action. If the particle''s current velocity will bring it into collision
    with an object, the particle estimates the time to collision and checks the angular
    distance to the nearest silhouette edge of the obstacle. It then computes an acceleration
    that will cause it to turn enough to avoid the obstacle within the allotted time.
    An example will serve to illustrate the process.


    The simplest nontrivial example is of a single sphere obstacle. In practice, this
    example is actually very useful, as it is often expedient to represent geometry,
