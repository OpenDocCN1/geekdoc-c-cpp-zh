    # 13.3 THE NAVIER-STOKES EQUATIONS


    By now, we are using Newton''s second law $\mathbf{f} = \mathbf{ma}$ to govern
    physical simulation by very solving for the acceleration in the terms of the sum
    of all applied forces:


    ```

    $$\mathbf{a} = \frac{1}{m} \sum \mathbf{f}_i.$

    ```


    Another way to write this equation is in terms of the rate of change of momentum:


    ```

    $$\frac{d(mv)}{dt} = \sum \mathbf{f}_i.$

    ```


    For fluid simulation we will use an equation of exactly this form, except that
    we will have to account for the fact that we are no longer solving for the rate
    of change of the velocity of discrete elements, but instead solving for a vector
    field that accounts for the rate of change of the velocity field, i.e., we are
    solving for an acceleration field. In addition, elements that have distinct masses,
    we now have a material whose mass is distributed as a scalar field. Since there
    are no discrete elements to carry mass, we replace mass with a scalar density
    field whose units are mass per unit volume, and forces are replaced by force density,
    whose units are force per unit volume. Because fluid is a continuous medium, force
    applied anywhere in the medium is transmitted through the fluid pushing on itself.
    We account for this force transmission by another scalar field, known as the pressure
    field. Its units are force per unit area.


    At each timestep, in a typical fluid simulation for computer animation, the system
    state is completely accounted for by the density field, which tells us the distribution
    of fluid material in space; the velocity field, which tells us the speed and direction
    of flow; and the pressure field, which tells us how force is being transmitted
    through the fluid. If we assume that the fluid is incompressible, then wherever
    we have fluid the density field must be constant, which imposes a key'
