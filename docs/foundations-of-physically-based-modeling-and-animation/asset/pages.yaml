  md: "# Interacting Particle Systems 95\n\nA common use for kd-trees is to find particles\
    \ within a certain distance of a given point (which might be another particle\
    \ location). This can be treated as a range-search problem, where we want to find\
    \ all nodes that overlap a given range in $x, y,$ and $z$. We can do a range search\
    \ on kd-tree via a recursive process that checks whether the partition point is\
    \ within, above, or below the range axis. If it is within the range, then that\
    \ node is reported, and both children are checked. If it is above or below the\
    \ range, then the left or right child (respectively) is checked. By continuing\
    \ this process to the leaf nodes, we can report all points that overlap a given\
    \ interval.\n\nNote that there are variations on the default kd-tree. One approach\
    \ is to choose an axis at each level, rather than following a set pattern. This\
    \ potentially allows one to choose a better division (e.g., partitioning along\
    \ the longest), which requires extra data storage and checks at each level. Another\
    \ variation is to have a fixed number of levels in the tree. In this case leaf\
    \ nodes store several points, rather than just one. This can speed up computations\
    \ by limiting how many levels of the tree are traversed, at the cost of additional\
    \ work when more points are found to overlap. The kd-trees can be constructed\
    \ so that points are not evenly partitioned. Finally, the intervals having better\
    \ shapes, which can cause an unbalanced tree, and often trees be constructed such\
    \ that internal nodes partitioning based on a given value, rather than a particular\
    \ point, then are stored only at leaves. This requires extra storage, maintaining\
    \ separate internal (partitioning) and leaf (point-storing) nodes, and the tree\
    \ is generally one level deeper. However, it can potentially lead to better-shaped\
    \ intervals at any level.\n\n# 6.4 ASTRONOMICAL SIMULATION\n\nIn an astronomical\
    \ simulation, like that of the colliding galaxies in Figure 6.3, the goal is to\
    \ reproduce the behavior of a large collection of objects distributed in space,\
    \ given their initial configuration, and the gravitational attractions between\
    \ them. Therefore, this is a canonical example of an interacting particle system.\
    \ In such a system, the force of one particle on another is inversely proportional\
    \ to the square of the distance between them, and directly proportional to the\
    \ product of their masses. In the real world, the constant of proportionality\
