  md: "# Constraints 241\n\nIn this section, we look at an entirely different way\
    \ of handling constraints—that is to pose the problem in a coordinate frame in\
    \ which only motion in the allowed directions is possible. Let us use the 2D pendulum\
    \ problem shown in the figure to illustrate what we mean. The pendulum's bob with\
    \ mass m is constrained to be at a fixed distance r from the axis of the pendulum.\
    \ On the left, we see the problem posed in a 2D Cartesian coordinate frame. At\
    \ any point in time, the center of the pendulum's bob is at position $[x(t), y(t)]$,\
    \ always subject to the constraint\n\n![](img/b434947f68660f7e26f8700ff77023a5_263_0.png)\n\
    \n$x^2(t) + y^2(t) = r^2$.\n\nTo maintain this constraint, using the method of\
    \ constrained dynamics described in Section 11.2, we would compute a constraint\
    \ force exactly any component of the gravitational force in the direction of the\
    \ pendulum's shaft. On the right, the problem is posed in a polar coordinate frame.\
    \ Here, the only variable is the angle the pendulum's shaft makes from the vertical,\
    \ and the center of the pendulum's bob is at $[r, \theta(t)]$. Therefore, the\
    \ shaft-length constraint is always satisfied, and no additional forces need to\
    \ be calculated to maintain this constraint.\n\nNote that the polar coordinate\
    \ formulation will be different from the Cartesian formulation in that the dynamics\
    \ will be rotational, rather than translational. The gravitational force will\
    \ result in a torque, producing angular acceleration. To advance the simulation,\
    \ this angular acceleration would be integrated to yield angular velocity, which\
    \ in turn would be integrated to determine angle.\n\nThe pendulum example leads\
    \ to the fundamental idea of the reduced coordinates approach—we pose the problem\
    \ in a coordinate frame that has only the degrees of freedom allowed in the problem.\
    \ The primary mathematical tool in this approach is the Lagrangian dynamics formulation.\
    \ Instead of posing the problem in terms of forces and torques, this approach\
    \ looks at how kinetic and potential energy interact to govern the system's dynamics.\n\
    \n# 11.3.1 Kinetic and Potential Energy\n\nA system's energy is defined as its\
    \ capacity to work. Kinetic energy is the energy of a system contained in its\
    \ motion. In Newtonian mechanics, a rigid body of mass $m$ and moment of inertia\
    \ $I$ that is translating with velocity $\\mathbf{v}$ and rotating with angular\
    \ velocity $\\omega$ has kinetic energy\n\n$T = \\frac{1}{2}(mv^2 + \\omega^T\
    \ I \\omega)$."
