  pgno: 316
- img_proc: true
  md: '# Finite Difference Algorithms ■ 295


    it is most accurate. Therefore, in numerical calculations, it is best to use central
    differencing, whenever possible, to maintain the highest accuracy.


    In some cases, we need to calculate the derivative of $\phi$ directly at a position
    $x_i$. In this case, we can use an alternative differencing form


    ```

    $$\frac{d\phi}{dx}_i \approx \frac{\phi_{i+1} - \phi_{i-1}}{2\Delta x}$ $$

    ```


    That is, we take the difference from a distance $h$ on each side, instead of $h/2$.
    This has the potential advantage of making all the calculations of $\phi$ and
    its derivative occur at the same points, without any bias in one direction or
    the other, as forward and backward differencing have. However, because the difference
    is taken over a larger region, it tends to cause more smoothing in the derivative
    calculation than is ideal.


    **Upwind differencing:** There are situations where it is computationally inconvenient
    to place the derivative evaluate between samples, and undesirable to have the
    excessive smoothing caused by a $2\Delta x$ central differencing. In this case,
    if we have a choice between either forward or backward differencing, the suggested
    approach is to make choice using an *upwind differencing* scheme. In upwind differencing,
    if we are taking a derivative in the context of a vector field, such as a fluid
    flow field, we should choose the sample "upwind" (i.e., in the direction from
    which the flow is coming) of the current position when taking the difference.
    If the component of the flow field in the direction of the derivative is $u_x$,
    then the upwind scheme is coined as


    ```

    $$\frac{d\phi}{dx}_i = \begin{cases} \frac{\phi_{i-1}}{\Delta x} & \text{if }
    u_x \ge 0 \ \frac{\phi_{i+1} - \phi_i}{\Delta x} & \text{if } u_x < 0.\end{cases}$
    $$

    ```


    **Second difference:** To estimate the second derivative at $x_i$, we would subtract
    forward and backward to compute central differences located at $x_i + \Delta x/2$,
    and $x_i - \Delta x/2$, and then differ again, using these estimates. The rule
    for estimating our second derivative


    ```

    $$\frac{d^2\phi}{dx^2}_x_i \approx \frac{d(\phi)}{dx}_x_i = \frac{\frac{\phi_{i+1}
    - \phi_i}{\Delta x} - \frac{\phi_i - \phi_{i-1}}{\Delta x}}{\Delta x} = \frac{\phi_{i+1}
    - 2\phi_i + \phi_{i-1}}{\Delta x^2}. $$

    ```


    The location of the second derivative, computed in this way, is at the original
    location $x_i$.


