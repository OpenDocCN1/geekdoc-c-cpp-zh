    If $e$ is positive, then there is already some turning in the direction of steering
    and we can reduce the steering acceleration by this amount. In either case, this
    leaves us with the corrected acceleration


    ```

    $a^{\text{op}} = \max(a_s - e, 0)\hat{\nabla}_L$

