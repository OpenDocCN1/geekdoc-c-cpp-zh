  md: '# 144 Foundations of Physically Based Modeling and Animation


    As we just saw, for an oscillator, the matrix $M^{-1}$ had a determinant of $\frac{1}{1+\omega^2h^2}=\frac{1}{1+(\frac{P}{\pi})^2h^2}=\frac{P^2}{P^2+\pi^2h^2}$.
    Thus, integrating $n$ timesteps yields a loss of


    ```

    $g = \left(\frac{p^2}{p^2+\pi^2h^2}\right)^n$

    ```


    Therefore, the number of iterations before a 1% is


    ```

    $n = \left[\log 0.99/\log(\frac{P^2}{P^2+\pi^2h^2})\right]$

    ```


    These relations can be used to build the following table of the number of timesteps
    for the oscillation amplitude to decrease by 1%. For reference, we will include
    the number of steps needed for an explicit method to decrease by 1%:


    | | P/8 | P/16 | P/32 | P/64 | P/128 | P/256 |

    |---|---|---|---|---|---||}{

    | Explicit Euler | 1 | 1 | 1 | 2 | 5 | 17 |

    | Explicit RK2 | 1 | 2 | 27 | 429 | 6,856 | 109,683 |

    | Implicit Euler | 1 | 1 | 2 | 5 | | 67 |


    Notice that the implicit Euler approach has a fidelity similarity to that of the
    explicit Euler formulation, but significantly below RK2. That is, while implicit
    methods provide a more stable formulation, they do not provide a more accurate
    one.


    # 7.8 SUMMARY


    Here are the key ideas to take away regarding integration:


    +   - Order of integration methods refers to how closely the integration method
    can represent the function being integrated. This can be thought of as how many
    terms (i.e., how many derivatives) of a Taylor expansion are matched.

    - The Verlet and Leapfrog methods provide second-order integration techniques,
    but assume that acceleration is a function of position only (i.e., not of velocity).

    - Runge-Kutta methods can achieve much higher-order integration. They can also
    handle derivatives based on all of the state.

    - Choosing an integration scheme involves trade-offs in time, accuracy, and complexity
    of calculations. For most problems discussed in this book, RK4 is a good choice.

    - Collision detection is more complex with higher-order integration. Finding a
    precise point of collision can involve a binary search in time to find the position
    within a fixed distance from the surface.'
