    # 13.2.2 Divergence


    Given a vector field $\mathbf{u}(x)$, we can obtain the scalar field $

    abla \cdot \mathbf{u}$, providing a scalar value at every position for which the
    function is defined. The operator $\nabla$ is the divergence operator. In 3D Cartesian
    space, the divergence operator, operating on the vector field $\mathbf{u} = [u_x\
    u_y\ u_z]^T$, yields


    ```

    $\nabla \cdot \mathbf{u} = \begin{bmatrix} \frac{\partial}{\partial x} & \frac{\partial}{\partial
    y} \ \frac{\partial}{\partial z} \end{bmatrix} \begin{bmatrix} u_x \ u_y \ u_z
    \end{bmatrix} = \frac{\partial u_x}{\partial x} + \frac{\partial u_y}{\partial
    y} + \frac{\partial u_z}{\partial z}$

    ```


    Thus, the divergence operator is analogous to a dot product, where partial spatial
    differentiation by term replaces multiplication. If we think of infinitesimal
    about the point $x$, the differentiation at this point is a measure of how the
    vector field $\mathbf{u}$ is expanding locally.


    To make a physical analogy, picture the cube of space shown in the figure, with
    dimensions $\Delta x$, $\Delta y$, $\Delta z$. Imagine that the vector field $\mathbf{u}
    = [u_x\ u_y\ u_z]^T$ is a fluid velocity field that the cube is immersed in. Then,
    $u_x\Delta y\Delta z$ is the rate of fluid flowing into the cell from the left,
    and $u_y\Delta x\Delta z$ are the rates of flow into the cell from below and from
    behind. The instantaneous rate of change of flow in the $x$ direction is $\frac{\partial
    u}{\partial x}$. We can assume this will be the same across the cell, as $\Delta
    x$ shrinks to an infinitesimal. The rate of fluid flowing out of the cell on the
    right will be $(u_x + \frac{\partial u_x}{\partial x})\Delta y\Delta z$, with
    similar terms for out of the top and front of the cell. To obtain the net outflow
    from the cell, we subtract the inflow from the outflow


    ![](img/b434947f68660f7e26f8700ff77023a5_292_0.png)


    so that the outflow per unit volume $V = \Delta x\Delta y\Delta z$ is exactly
    the divergence. Thus, the divergence gives the net excess rate of outflow, compared
    to inflow, across the entire surface of the cube. If the divergence is positive,
    then more fluid is flowing out of the cube than flowing in, and if it is negative,
    more fluid is flowing in than flowing out. Only if the inflow matches the outflow
    then more fluid is flowing in than zero.'
