    # 7.4 IMPLEMENTATION OF HIGHER-ORDER INTEGRATORS


    The introduction of integrators that are of higher order than Euler serves general
    design issues for the programming of simulations. The two most immediate concerns
    are how to handle the need to compute the system dynamics multiple times in one
    timestep, and how to correctly handle collisions.


    # 7.4.1 State Vector Algorithm


    The implementation of the higher-order integrators, like RK2 and RK4, follows
    exactly the implementation described in Section 6.1.3, except that the NumInt()
    function needs to be given access to the current time t and the system dynamics
    function F() so that the system dynamics can be calculated multiple times during
    the timestep. For example, the NumInt function implementation for RK4 might be
    written:


    ```

    StateVector NumInt(StateVector S, StateVector \hat{S}, float h, float t,

    StateVector F())

    begin

    Vector K$_1$, K$_2$, K$_3$, K$_4$;

    StateVector S^{\new};


    K$_1 = \hat{S};

    K$_2 = F(S + \frac{h}{2}K$_1, t + \frac{h}{2});

    K$_3 = F(S + \frac{h}{2}K$_2, t + \frac{h}{2});

    K$_4 = F(S + hK$_3, t + h);


    S^{\new} = S + \frac{h}{6}(K$_1 + 2K$_2 + 2K$_3 + K$_4);

    return S^{\new}

    end

    ```


