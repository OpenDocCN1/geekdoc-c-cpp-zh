    # D.6 MATRIX-FREE TRANSFORMATIONS


    Sometimes we know the origin $\mathbf{p}$ of the new coordinate frame, along with
    an axis of rotation $\hat{\mathbf{u}}$ and a rotation angle $\theta$. In this
    case, it may be advantageous to be able to directly rotate points about this axis
    and then translate, rather than constructing a new coordinate frame and associated
    transformation matrix. To do this we can first rotate a point $\mathbf{r}$ using
    Rodrigues'' rotation formula [Murray et al., 1994], to obtain


    ```

    $$\mathbf{r}'' = \mathbf{r} \cos\theta + (\hat{\mathbf{u}} \times \mathbf{r})
    \sin\theta + (\hat{\mathbf{u}} \cdot \mathbf{r})(1 - \cos\theta)$$$

    ```


    and then translate by $\mathbf{p}$ to obtain the transformed point in the new
    coordinate frame


    ```

    $$\mathbf{r}'''' = \mathbf{r}'' + \mathbf{p}.$$

    ```'
