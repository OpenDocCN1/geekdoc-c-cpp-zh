    \ M)\nThe matrix M must be a rotation matrix, meaning that its rows and columns\
    \ must be\nually orthogonal unit vectors\n\n```\nbegin\n  Quaternion q;\n  float\
    \ r;\n\n  float t = M[0][0] + M[1][1] + M[2][2] // the trace of the matrix;\n\n\
    \  if t >= 0 then\n    r = sqrt(t + 1);\n    q.s = r/2;\n    q.x = (M[2][1] -\
    \ M[1][2])/(2r);\n    q.y = (M[0][2] - M[2][0])/(2r);\n    q.z = (M[1][0] - M[0][1])/(2r);\n\
    \  else if M[0][0] > M[1][1] and M[0][0] > M[2][2] then\n    r = sqrt(M[0][0]\
    \ - (M[1][1] + M[2][2]) + 1);\n    q.s = r/2;\n    q.x = (M[0][1] - M[1][0])/(2r);\n\
    \    q.y = (M[2][0] - M[0][2])/(2r);\n    q.z = (M[2][1] - M[1][2])/(2r);\n  else\
    \ if M[1][1] > M[0][0] and M[1][1] > M[2][2] then\n    r = sqrt(M[1][1] - (M[2][2]\
    \ + M[0][0]) + 1);\n    q.s = r/2;\n    q.x = (M[1][2] - M[2][1])/(2r);\n    q.y\
    \ = (M[0][2] - M[2][0])/(2r);\n    q.z = (M[1][0] - M[0][1])/(2r);\n  else\n \
    \   r = sqrt(M[2][2] - (M[0][0] + M[1][1]) + 1);\n    q.s = r/2;\n    q.x = (M[2][1]\
    \ - M[1][2])/(2r);\n    q.y = (M[0][2] - M[2][0])/(2r);\n    q.z = (M[1][0] -\
    \ M[0][1])/(2r);\nend\n\nreturn q;\n```"
