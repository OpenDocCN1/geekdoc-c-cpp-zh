  md: "# 348 Foundations of Physically Based Modeling and Animation\n\n# D.1 LEFT-\
    \ AND RIGHT-HANDED COORDINATE FRAMES\n\nLet us develop the idea of a coordinate\
    \ frame and how we can construct them for use in computer graphics. A 3D coordinate\
    \ frame might be drawn as shown in the below diagram. The three axes are understood\
    \ to be at right angles (orthogonal) to each other. In figure, $x$ denotes the\
    \ horizontal axis, $y$ the vertical axis, and $z$ the depth axis (coming out of\
    \ the page). This is the usual right-handed coordinate system seen in Computer\
    \ Graphics.\n\n![](img/b434947f68660f7e26f8700ff77023a5_370_0.png)\n\nThe coordinate\
    \ system shown above is called right handed, if you place your thumb, index finger\
    \ and the middle finger of the right at right angles to each other, as demonstrated\
    \ in the figure, they look like coordinate axes. The thumb represents the $x$\
    \ axis, the index finger represents the $y$ axis, and the middle finger represents\
    \ the $z$ axis. A left-handed coordinate system is shown in the figure to the\
    \ right. In a left-handed system, the $z$ axis is reversed, measuring depth into\
    \ the page, if we keep the $x$ axis going to the right. Some Computer Graphics\
    \ texts used this convention so it is good to be aware that it exists, and what\
    \ is the difference between the two conventions.\n\n![](img/b434947f68660f7e26f8700ff77023a5_370_1.png)\n\
    \n# D.2 COORDINATE FRAME EXPRESSED AS A POINT AND ORTHOGONAL UNIT VECTORS\n\n\
    In any coordinate system, the position where the coordinate axes cross is called\
    \ the origin, and by definition has the coordinates $\text{O} = (0, 0, 0)$ in\
    \ that coordinate system. In order to work with coordinate frames we will re-label\
    \ the axes of the coordinate system with unit vectors directed along the coordinate\
    \ directions, as shown in the diagram. We use the notation $\\hat{\\mathbf{u}}_x$\
    \ to represent a unit vector in the $x$ direction, $\\hat{\\mathbf{u}}_y$ in the\
    \ $y$ direction, and $\\hat{\\mathbf{u}}_z$ in the $z$ direction. With this notation,\
    \ a 3D point $\\mathbf{p} = (p_x, p_y, p_z)$ in the coordinate frame can be written\n\
    \n```\n$\\mathbf{p} = \\mathbf{O} + p_x\\hat{\\mathbf{u}}_x + p_y\\hat{\\mathbf{u}}_y\
    \ + p_z\\hat{\\mathbf{u}}_z.$\n```\n\nNow, if we wish to rotate our coordinate\
    \ frame we can apply a rotation matrix to the vectors $\\hat{\\mathbf{u}}_x, \\\
    hat{\\mathbf{u}}_y$, and $\\hat{\\mathbf{u}}_z$, and if we wish to translate the\
    \ frame we can apply a translation matrix to $\\mathbf{O}$."
