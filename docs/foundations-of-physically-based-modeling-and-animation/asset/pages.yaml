  md: 'We need to find the velocities after collision, $\mathbf{v}_p^+$ and $\mathbf{v}_q^+$.
    We can use the same basic approach used previously for collision with a static
    object, but apply it to the two moving objects. The overall process will be as
    follows:


    +   1. Compute the center of momentum $\mathbf{c}_m$.


    +   2. Compute the velocities of $\mathbf{p}$ and $\mathbf{q}$ relative to $\mathbf{c}_m$.


    +   3. Find the normal and tangential components of these velocities.


    +   4. Compute the collision response due to elasticity and friction.


    +   5. Add the $\mathbf{c}_m$ back to the resulting velocities to get back to
    the original frame of reference.


    For the two objects, or in this case the points of collision $\mathbf{p}$ and
    $\mathbf{q}$ from each, the overall momentum can be computed, and since we momentum
    is conserved, we have


    $m_p\mathbf{v}_p^- + m_q\mathbf{v}_q^- = m_p\mathbf{v}_p^+ + m_q\mathbf{v}_q^+$


    Each side of this equation gives a vector that describes the overall momentum
    of the system. Dividing this by the total mass gives the “center of momentum”


    $\mathbf{c}_m = \frac{m_p\mathbf{v}_p^- + m_q\mathbf{v}_q^-}{m_p + m_q}$


    We can then define the motion of the two objects relative to this point, i.e.,


    $\dot{\mathbf{v}}_p'' = \dot{\mathbf{v}}_p - \dot{\mathbf{c}}_m$, and $\dot{\mathbf{v}}_q''
    = \dot{\mathbf{v}}_q - \dot{\mathbf{c}}_m$,


    where the $''$ indicates that we are dealing with terms relative to the center
    of momentum.


    With these velocities relative to the center of momentum, we can compute the response
    for each object around the normal, in the same way we did before. We break the
    velocity into normal and tangential components, and apply the elasticity and friction
    responses to each component separately, using the simple friction model described
    in Section 3.2. The normal and tangential velocity components for object $p$ before
    collision


    $\dot{\mathbf{v}}_{p,n}'' = (\dot{\mathbf{v}}_p - \dot{\mathbf{c}}_m)\mathbf{\hat{n}}$,
    and $\dot{\mathbf{v}}_{p,t}'' = \dot{\mathbf{v}}_p - \dot{\mathbf{v}}_{p,n}''$,


    and after collision they are


    $\dot{\mathbf{v}}_{p,n}^+ = -c_r\dot{\mathbf{v}}_{p,n}''$, and $\dot{\mathbf{v}}_{p,t}^+
    = (1 - c_f)\dot{\mathbf{v}}_{p,t}''$.


    Therefore $\mathbf{p}$''s velocity after collision is


    $\mathbf{v}_p^+ = \mathbf{v}_{p,n}^+ + \mathbf{v}_{p,t}^+$'
