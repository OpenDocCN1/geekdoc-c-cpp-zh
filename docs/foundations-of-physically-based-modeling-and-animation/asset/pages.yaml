  md: '# Smoothed Particle Hydrodynamics


    IN THIS SECTION, WE LOOK AT THE MOST SUCCESSFUL LAGRANGIAN METHOD for doing incompressible
    fluid simulation, known as Smoothed Particle Hydrodynamics, or SPH for short.
    As the name implies, the fluid is represented by a large collection of individual
    fluid particles. These interact with each other following the laws of hydrodynamics—as
    captured by the Navier-Stokes equations. Figure 14.1 shows what a typical SPH
    water simulation might look like if the water particles were rendered as colored
    spheres. Note that the simulation is especially good at capturing detail in the
    splashing fluid motion SPH found its original applications in the astrophysics
    community, with its underlying mathematical and physical elaboration developed
    in a paper by Monaghan [1992]. The SPH method was first introduced to the graphics
    community by Stam and Fiume [1995] for simulating highly deformable objects, and
    soon after was used by Desbrun and Gascuel [1996] The paper that firmly established
    SPH as a method for fluid simulation was by Müller et al. [2003], entitled Particle-Based
    Fluid Simulation for Interactive Applications. As the title suggests, the original
    intent of SPH was to provide interactive fluid-like animation for applications
    like VR and video games.


    # 14.1 SPATIAL SAMPLING AND RECONSTRUCTION


    The basic idea of SPH is that the fluid is sampled onto a large system of interacting
    particles, so that each particle can be thought of as representing a small "chunk"
    or volume of the fluid. If the volume represented by particle $i$ is $V_i$, centered
    at position $x_i$, its mass will be


    ```

    $m_i = \rho(x_i)V_i$.

    ```


    In standard SPH, a particle''s mass remains constant throughout the simulation.
    The particle itself is free to move through space, so it does not remain in its
    initial position. It is typical, but not required, to make the assumption that
    the fluid'
