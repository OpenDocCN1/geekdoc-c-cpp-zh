  md: '# 230 Foundations of Physically Based Modeling and Animation


    the floor, is an example of a problem that we have already seen—that of resting
    contact. the box is being supported by the floor. It is free to bounce up, or
    continue on the floor, but cannot move down into the floor. This is an example
    of a constrained dynamics problem that does not reduce the number of degrees of
    freedom. The box can move in all directions, it is just that it cannot move below
    the floor height in the y direction. The problem of roller coaster cars on a track
    is fundamentally different. The track is a complex curve that can wind in any
    direction. But, since the cars are constrained to move only on the track, at any
    instant the cars have only one degree of freedom—they can only roll in the direction
    of the track. They cannot rise above, fall below the track, nor can turn against
    the track’s direction. When the cars are at a particular position on the track,
    the track provides a local coordinate frame, within which the cars can move backward
    or forward along one direction.


    The three-joint arm in this is an example of a constrained dynamics problem, where
    the constraints are rotational rather than translational. The segments of the
    arm are translated and rotated in space, but only in configurations permitted
    by the set of possible joint angles. The number of degrees of freedom of each
    individual joint is one, a rotation about the axis of the joint. The entire arm
    configuration has three degrees of freedom, for each joint.


    ![](img/b434947f68660f7e26f8700ff77023a5_252_0.png)


    # 11.1 PENALTY METHODS


    The simplest way to maintain a constraint is via the penalty method. In this approach,
    motion is computed based on external and internal forces, without considering
    any constraints, and those forces are applied to counteract any deviation from
    the desired constrained motion. A way to think about this approach is to think
    of there a control system that has a sensor measuring any deviation from the constraint,
    and a servo motor that exerts a correcting force based on this measured deviation.


    Since the penalty approach depends on the deviation from the constraint in order
    to generate a correcting force, no penalty method is able to maintain a hard constraint.
    A hard constraint is one that can never be violated, even to a small degree. If
    a hard constraint is needed, other methods must be used. But, in many cases a
    soft constraint, where small deviations from the constraint can be temporarily
    tolerated, it will work. In this case the penalty method’s simplicity and ease
    of implementation make it very handy to have in the tool set of an animator.'
