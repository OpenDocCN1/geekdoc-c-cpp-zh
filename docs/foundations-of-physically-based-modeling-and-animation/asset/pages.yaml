  md: '# 9.5 SUMMARY


    Here are some of the main concepts to understand about rigid body dynamics:


    +   - To represent rigid body state, we need to consider not only the position
    but also the orientation of the object. Likewise, we will have not only linear
    velocity that describes change in position, but also angular velocity, describing
    change in orientation.


    +   - Rigid body dynamics requires a representation of the moment of inertia for
    the object. The moment of inertia is, roughly, the angular motion equivalent to
    mass for linear motion.


    +   - The moment of inertia is typically expressed as a matrix in the world coordinate
    system. This matrix can be computed by transforming a matrix expressed in local
    coordinates.


    +   - Rigid objects can have forces applied, causing change in linear momentum,
    or torque applied, causing changes in angular momentum. Force applied at a single
    point on an object generates a corresponding torque.


    +   - Representing and computing the orientation of an object can be done in multiple
    ways, including rotation matrices and quaternions. However, quaternions provide
    a more compact form that is more robust to errors introduced by numerical computation.'
  merge: -1
