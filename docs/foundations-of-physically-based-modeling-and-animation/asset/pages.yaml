  md: '# Quaternions


    IN THIS APPENDIX, we explore an alternate representation of rotations, known as
    quaternions. Appendices C and D have described how rotation matrices are used
    for representing affine transformations of the geometry of objects and for transforming
    the coordinate frames of objects. Quaternions provide an equivalent representation
    of rotations, in that there is a bijective correspondence between the rotation
    matrices and the quaternions, i.e., any rotation matrix can be directly transformed
    into a unique equivalent quaternion and any rotation quaternion can be directly
    transformed into a unique equivalent rotation matrix. In addition, given a rotation
    matrix R and its equivalent rotation q there is a multiplication operation defined
    between quaternions and any 3D vector v such that Rv = vqᵀ¹¹. Therefore, quaternions
    provide a rotation mechanism that can be used as a substitute for rotation matrices
    or in conjunction with matrices.


    There are several benefits to the use of quaternions in place of rotation matrices
    in physically based animation. First, quaternions contain an explicit representation
    of the rotation axis and angle, and so can be easily used to specify a rotation
    around any axis. This is in contrast to rotation matrices, which only represent
    representations for around the three major coordinate axes. Second, a quaternion
    is a four-element object, in contrast to a rotation matrix, which contains nine
    elements. Finally, in any operations involving interpolation, quaternions are
    superior to rotation matrices, since interpolating the elements of a rotation
    matrix does not guarantee that the rows and columns of the matrix remain orthonormal.
    If the orthonormal property is lost, instead of providing a pure rotation, the
    matrix can start to shear or nonuniformly scale an object whose vertices are transformed
    by the matrix. This means that rotation matrices should not be part of any system
    element that is meant to be interpolated or numerically integrated. Quaternions,
    on the other hand, can be interpolated, and thus integrated without losing their
    inherent rotational property. We will see that any error induced by interpolation
    can result only in a uniform scale, which can be corrected by a simple rescaling
    operation on the quaternion.'
