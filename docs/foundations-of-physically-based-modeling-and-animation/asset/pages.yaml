    # 1.2 DYNAMIC VERSUS DISCRETE EVENT SIMULATION


    When we refer to dynamic simulation in this text, we are referring to the simulation
    of continuously evolving phenomena, as opposed to discrete event simulation. This
    latter form of simulation is often used in engineering or the business world to
    model events that happen in discrete units. Examples are physical inventories,
    the flow of work through an assembly line, or transactions in a financial system.
    In physically based animation, although we are capturing events in a scene in
    a set of discrete steps over time, we are always seeking to emulate the analog
    world, where these events actually evolve in a continuous fashion. An example
    might serve to delineate the differences. A simulation to arrival times and departures
    of an elevator at the floors of a building would be done as a discrete event simulation.
    There would be no need to incorporate any of the physical characteristics of the
    elevator, and to measure time between floors, door opening and closing times,
    and leveling time. On the other hand, if we wanted to follow the elevator in its
    travels, and monitor its motion and the movement of its parts this would be done
    as a physically based dynamic simulation. This is the type of simulation that
    we are aiming at in this book, and would require knowing the elevator''s mass,
    the torque produced by its motor, and many other physical characteristics governing
    its motion.'
  merge: -1
