  md: '# 138 Foundations of Physically Based Modeling and Animation


    Let us first describe this Jacobian matrix is structured in general, and then
    we will look at how it is used for this problem. Assume that S consists of $m$
    different variables $s_j$ (for $0 \le j \le m-1$). The function F produces $l$
    different values from these $m$ values of $s_j$. That is, we have $f_i(\mathbf{S})$
    defined (for $0 \le i \le l-1$).


    J will then be an $l \times m$ matrix, which is formed by taking partial derivatives
    of the function F, so each row of J gives the linear approximation to the change
    in one of the $f_i$. The entries $J_{i,j}$ of the Jacobian matrix are defined
    as


    ```

    $J_{i,j} = \frac{\partial f_i}{\partial s_j}. \(1.12)

    ```


    and this yields the Jacobian matrix:


    ```

    $J = \begin{pmatrix} \frac{\partial f_0}{\partial s_0} & \frac{\partial f_0}{\partial
    s_1} & \dots & \frac{\partial f_0}{\partial s_{m-1}} \ \frac{\partial f_1}{\partial
    s_0} & \frac{\partial f_1}{\partial s_1} & \dots & \frac{\partial f_1}{\partial
    s_{m-1}} \ \vdots & \vdots & \ddots & \vdots \ \frac{\partial f_{l-1}}{\partial
    s_0} & \frac{\partial f_{l-1}}{\partial s_1} & \dots & \frac{\partial f_{l-1}}{\partial
    s_{m-1}} \end{pmatrix} \(1.13)

    ```


    We will see other uses for the Jacobian in the future, but for our implicit integration
    case $f_i$ always gives the rate of change of an element of the state vector S.
    Each row of the (linear) change in one of the elements of S, at that point in
    time. Thus, $l = m$, and the Jacobian matrix is square. It is important to emphasize
    that the Jacobian J is a function of the state S, and must be recomputed at every
    timestep.


    The advantage of using the Jacobian is that we can formulate an implicit problem
    and solve it as was described in Section 7.7.1. That is, if we know J, we can
    solve the implicit Euler formulation for $\Delta S$ as follows:


    ```

    $\mathbf{S}^{[n+1]} = \mathbf{S}^{[n]} + h\mathbf{F}(\mathbf{S}^{[n]}) \\n\mathbf{S}^{[n]}
    + \Delta\mathbf{S} = \mathbf{S}^{[n]} + h(\mathbf{F}(\mathbf{S}^{[n]}) + \Delta\mathbf{S})
    \\n\Delta\mathbf{S} = h\mathbf{F}(\mathbf{S}^{[n]}) + h\mathbf{J}\Delta\mathbf{S}
    \\n(I - h\mathbf{J})\Delta\mathbf{S} = h\mathbf{F}(\mathbf{S}^{[n]})$

    ```


    Notice that $(I - h\mathbf{J})$ is a square matrix, $\Delta \mathbf{S}$ is an
    unknown vector, and $h\mathbf{F}(\mathbf{S}^{[n]})$ is a known vector. This so
    is a linear system of the form $A\mathbf{x} = \mathbf{b}$ which can be solved
    with a good linear system solver. Once we know $\Delta \mathbf{S}$, we just add
    it to $\mathbf{S}^{[n]}$ to get $\mathbf{S}^{[n+1]}$'
