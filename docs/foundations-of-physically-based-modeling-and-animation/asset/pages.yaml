    So, Euler integration to determine a velocity and position from the old velocity
    and position can be written


    ```

    $$\mathbf{v}^{[n+1]} = \mathbf{v}^{[n]} + \mathbf{a}^{[n]}h$,$

    $\mathbf{x}^{[n+1]} = \mathbf{x}^{[n]} + \mathbf{v}^{[n]}h$; (2.3)$

    ```


    The simulation loop for Euler integration for our basic ball example will as follows:


    +   $\mathbf{v}^{[0]} = 0; \mathbf{x}^{[0]} = 100$;$

    $t = 0; n = 0$;$

    $while t < t_{max} do$

    \t\mathbf{a}^{[n]} = -10$;$

