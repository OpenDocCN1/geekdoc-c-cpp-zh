  md: "# 354 Foundations of Physically Based Modeling and Animation\n\n# E.1 COMPLEX\
    \ NUMBER ANALOGY\n\nBefore introducing the mathematics of quaternions, it will\
    \ be helpful to take a quick look at the properties of complex numbers. A useful\
    \ analogy can be made between the algebra of complex numbers and that of quaternions.\
    \ In particular, provide a simple encoding of rotation. But, whereas complex numbers\
    \ describe rotations on a 2D plane, quaternions can describe full 3D rotations.\n\
    \n$c = a + ib$,\n\nconsists of real scalar part $a$, and imaginary scalar part\
    \ $b$, with the imaginary unit $i$ defined implicitly by\n\n$i^2 = -1$.\n\nSince\
    \ an imaginary number has two components, it can be plotted in a 2D coordinate\
    \ frame, where the $Re$ represents the real part of the number and the orthogonal\
    \ $Im$ axis, the imaginary part. The figure to the right shows this representation,\
    \ which is very similar to that of a 2D vector. Represented in this way, it can\
    \ be easily see that any imaginary number has an alternate representation in polar\
    \ coordinates\n\n![](img/b434947f68660f7e26f8700ff77023a5_376_0.png)\n\n$c = a\
    \ + ib = r(\\cos\theta + i\\sin\theta)$,\n\nwhere\n\n$r = \\sqrt{a^2 + b^2}$\n\
    \nis the magnitude of the complex number, and the angle is known as its *phase\
    \ angle*.\n\n$\theta = \\tan^{-1} b/a$\n\nThe product of two complex numbers $c_1$\
    \ and $c_2$ in Cartesian coordinates are\n\n$c_1c_2 = (a_1 + ib_1)(a_2 + ib_2)\
    \ = (a_1a_2 - b_1b_2) + i(a_1b_2 + a_2b_1)$,\n\nwhile in polar coordinates is\n\
    \n$c_1c_2 = r_1r_2(\\cos\\theta_1 + i\\sin\\theta_1)r_2(\\cos\\theta_2 + i\\sin\\\
    theta_2)$,\n\nwhere\n\n$c_1c_2 = r_1r_2[(\\cos\\theta_1\\cos\\theta_2 - \\sin\\\
    theta_1\\sin\\theta_2) + i(\\sin\\theta_1\\cos\\theta_2 + \\cos\\theta_1\\sin\\\
    theta_2)]$,\n\nwhich, by well-known trigonometric identities, can be simplified\
    \ to\n\n$c_1c_2 = r_1r_2[\\cos(\\theta_1 + \\theta_2) + i\\sin(\\theta_1 + \\\
    theta_2)]$.\n\nTherefore, we see that the product of complex number $c_1$ by complex\
    \ $c_2$ induces a rotation by $\theta_2$, as well as a scale by $r_2$. If we assume\
    \ that $c_2$ is a unit"
