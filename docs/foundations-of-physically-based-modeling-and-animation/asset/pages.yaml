  md: "# Finite Difference Algorithms 319\n\nInitializing the simulation: It can be\
    \ difficult to initialize a fluid simulation with the fluid already moving, the\
    \ typical procedure is to provide a quiescent state, and then perturb the fluid\
    \ as the simulation proceeds. In the swimming pool example, a quiescent state\
    \ is achieved if all the fluid velocities are 0, and the pressures are set to\
    \ account for gravity. The mass of fluid in a cubic cell is $\rho\\Delta x^3$.\
    \ If the gravitational acceleration constant $g$, a full cell will exert the pressure\
    \ $p = gp\\Delta x^2 = \rho gp\\Delta x$ on the cell below. The surface cells\
    \ have the ambient pressure $p_0$, the first cell below the surface will have\
    \ pressure $p_0 + gp\\Delta x$, and the ninth cell below the surface will have\
    \ pressure $p_0 + ng\\Delta x$. Note that, when the Poisson equation approach\
    \ to compute the pressure at the next timestep, it is not necessary to initialize\
    \ the particles, but they should be initialized by the iterative relaxation approach\
    \ is being used.\n\n![](img/b434947f68660f7e26f8700ff77023a5_341_0.png)\n\n# 15.3\
    \ FLIP\n\nThe Fluid-Implicit-Particle or FLIP method for fluid simulation is a\
    \ Lagrangian method, where a set of particles carries the momentum of the fluid,\
    \ as well as any other fluid properties required by the simulation. In this way,\
    \ the necessity for a backtracking advection scheme, such as that used in semi-Lagrangian\
    \ method, is eliminated. At each timestep, a regular grid is created and the particle\
    \ velocities are averaged onto the nodes of this grid. This serves as a computational\
    \ convenience, so external, diffusion, and pressure force effects can be accounted\
    \ for within a regular computational structure, creating a velocity field that\
    \ is used to update particle momenta, and for advecting the particles. In contrast\
    \ to SPH, which does all computations with respect to the nonuniformly distributed\
    \ set of particles. FLIP was first proposed in the fluid dynamics research community\
    \ by Brackbill and Ruppel [1986], and was introduced to the graphics community\
    \ as a fluid animation method in the paper Animating Sand as a Fluid by Zhu and\
    \ Bridson [2005].\n\nOne timestep of the FLIP method proceeds according to the\
    \ algorithm shown in Figure 15.5. It takes as its input the current particle system\
    \ $S$, providing the position and velocity of each of the fluid particles. The\
    \ system can also carry any other values that are to be advected by the fluid.\
    \ Additional inputs include a possible set of external accelerations $g$, the\
    \ fluid density $\rho$, and the timestep $h$. The output of the algorithm is the\
    \ updated particle system, with a new position and velocity for each particle.\n\
    \nFollowing the algorithm, FLIP builds a new staggered computational grid at each\
    \ timestep, sized and positioned to contain the axis-aligned bounding volume around\
    \ the particle system. Therefore, unlike Eulerian methods, FLIP simulations are\
    \ spatially unbound. Two grids are needed, $G_0$ and $G_1$, to hold the original\
    \ and"
