    Notice that $\dot{\mathbf{p}}_0 = 0$ since the local coordinates of the object
    do not change for a rigid body, this reduces to


    $$\dot{\mathbf{p}} = \mathbf{v} + \mathbf{R}\mathbf{p}_0. \quad (9.2)$


    This is a simple result, but leaves us needing to determine what the rate of change
    orientation is, i.e., what is the derivative of change rotation matrix $R$.


    To understand how the orientation is changing over time, we need to introduce
    the concept of *angular velocity*. Just as linear velocity describes the rate
    of change in position, angular velocity describes the rate of change of orientation.
    Typically, people think of this as "when an object is spinning." Both linear and
    angular velocity are typically represented as 3D vectors $s_v = ||\mathbf{v}||$,
    in the direction $\hat{\mathbf{v}} = \mathbf{v}/s_v$, or $\mathbf{v} = s_v\hat{\mathbf{v}}$.
    Angular velocity is usually represented by the Greek letter $\omega$, and consists
    of an angular sweep $s_\omega = ||\omega||$ and a direction $\hat{\omega} = \omega/s_\omega$,
    or $\omega = s_\omega\hat{\omega}$. The difference is that in the case of angular
    velocity, the $\hat{\omega}$ is not the direction of motion, but gives the axis
    around which the object is spinning, and the speed $s_\omega$ is the rate of rotation,
    typically measured in radians per second. The convention that we will follow in
    this book is that the positive direction of rotation follows the right-hand rule
    (see Appendix D).


    ![](img/b434947f68660f7e26f8700ff77023a5_211_0.png)


    Given an orientation matrix $R$ and an angular velocity $\omega$, we need to understand
    how $R$ changes with time. We know (Appendix D) that the columns of $R$ are the
    direction vectors of the rotated coordinate, i.e.,


    $$R = [\hat{\mathbf{u}}_x \ \hat{\mathbf{u}}_y \ \hat{\mathbf{u}}_z].$$


    Therefore, the first derivative of $\dot{R}$ is formed from the derivatives of
    the vectors


    $$\dot{R} = [\dot{\hat{\mathbf{u}}_x \ \dot{\hat{\mathbf{u}}_y \ \dot{\hat{\mathbf{u}}_z].$$


    Now, determining $\dot{R}$ is reduced to the problem of determining the derivative
    of the vector undergoing rigid rotation—i.e., a vector that is rotating but not
    changing length.


    To understand this, let first look at how a rotating point changes with time due
    to its angular velocity $\omega$. The point at position $p$ relative to a center
