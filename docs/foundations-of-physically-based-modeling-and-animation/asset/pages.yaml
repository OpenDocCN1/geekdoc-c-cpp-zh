    is determined within each cell. This function gives the approximate gravitational
    acceleration that is exerted by all the particles within the cell on a particle
    located far from the cell. It is parameterized by the sum of the masses of all
    the particles in the cell, and the cell''s center of mass. If $\mathbf{x}_i$ is
