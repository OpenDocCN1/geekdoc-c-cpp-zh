- img_proc: true
  md: '# Foundations of Physically Based Modeling and Animation


    Therefore, the Lagrangian is


    ```

    $L = \frac{1}{2}m\mathbf{v}^2 - mg\mathbf{\hat{u}}_y \cdot \mathbf{x},$$

    ```


    and we have the partial derivatives


    ```

    $\frac{\partial L}{\partial\mathbf{q}} \frac{\partial L}{\partial\mathbf{x}} =
    -mg\mathbf{\hat{u}}_y, \text{ and } \frac{\partial L}{\partial\mathbf{\dot{q}}}
    \frac{\partial L}{\partial\mathbf{v}} = m\mathbf{v},$

    ```


    so that


    ```

    $$\frac{d}(\frac{\partial L}{\partial\mathbf{q}})}{dt} = m\mathbf{\dot{v}} = m\mathbf{a},$

    ```


    where **a** is a acceleration vector. Since we have already accounted for gravitational
    force in the formulation of the potential energy, and there are no other forces
    acting, **Q = $\mathbf{0}$**. Therefore Equation 11.16 becomes


    ```

    $$\frac{\partial L}{\partial\mathbf{\dot{q}}} - \frac{\partial L}{\partial\mathbf{q}}
    = 0, \text{ or}$

    ma + $mg\mathbf{\hat{u}}_y = 0 \text{ and thus,}$

    $\mathbf{a} = -g\mathbf{\hat{u}}_y.$

    ```


    This result is entirely surprising, as we know the answer from the beginning,
    the example serves to demonstrate how the various energies and derivatives are
    formulated, and how the partial derivatives are taken. It is also a first indication
    that the general Lagrangian dynamics formulation is correct.


    If we considered air drag, then Q would be non-zero. If the drag were acting to
    oppose the ball''s velocity, proportional to its velocity with drag constant $d$,
    then the resulting dissipative force would be


    ```

    $$\mathbf{Q} = -d\mathbf{v},$$

    ```


    and Equation 11.16 would be


    ```

    $$\frac{d}(\frac{\partial L}{\partial\mathbf{q}})}{dt} - \frac{\partial L}{\partial\mathbf{\dot{q}}}
    = -d\mathbf{v}, \text{ or}$

    $\mathbf{a} = -g\mathbf{\hat{u}}_y - \frac{d\mathbf{v}}{m}..$

    ```


    Again, this matches the solution we obtained by simply applying Newton''s second
    law in Cartesian coordinates, in Section 2.7.2.'
