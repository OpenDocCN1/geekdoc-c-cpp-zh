    Now, rotate your hand so you can curl fingers in the direction from vector a to
    vector b. Your thumb will point in the direction of a × b. If you reverse a b
    first align your fingers with b and then curl them a you will see that you have
    to turn your hand upside down, reversing the direction in which your thumb is
    pointing. From this it should be apparent that b × a = -(a × b). In other words,
    the order of the operands in the cross-product changes the polarity of the resulting
    cross-product vector. The result is still perpendicular to both of the original
    vectors, but the direction is flipped.


    # A.8.1 Trigonometric Interpretation of Cross-Product


    The magnitude of the cross-product is given by


    ```

    ||a × b|| = ||a||||b|||sin θ|

    ```


    when θ is the small angle between vectors a and b. Thus, if a and b are unit vectors,
    the magnitude of the cross-product is the magnitude of sin θ.


    ![](img/b434947f68660f7e26f8700ff77023a5_352_0.png)


    Note, the cross-product of two parallel vectors is the zero vector 0. This is
    consistent with the geometric notion that the cross-product produces a vector
    orthogonal to the two vectors. If the original vectors are parallel, then there
    is no unique direction perpendicular to both vectors (i.e., there are infinitely
    many orthogonal vectors, all parallel to any plane perpendicular to either vector).


    Algebraically, the cross-product is defined as follows. If two vectors are


    ```

    a = [ax; ay; az], and b = [bx; by; bz]

    ```


    then


    ```

    a × b = [aybz - azby; azbx - axbz; axby - aybx]

    ```


    The cross-product has many uses in graphics, which the following two examples
    will serve to illustrate.


