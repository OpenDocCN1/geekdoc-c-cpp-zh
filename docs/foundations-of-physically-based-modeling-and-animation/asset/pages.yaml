  md: '# Rigid Body Dynamics


    WHILE THE SPRINGY-MESH MODELS we have seen previously offer some nice characteristics,
    they do not capture the true behavior of a 3D rigid object. In the real world,
    we do not have mass located at just a point, and we do not edges and faces with
    no mass of their own. Instead, real objects are made up of volumes with some density,
    and an accurate simulation treats them this way.


    Rigid body simulation allows us to simulate the tumbling behavior of solid 3D
    objects like the coins shown in Figure 9.1. The term rigid bodies refers to objects
    that do not deform as they go through motions and collisions. Because rigid bodies
    do not deform, we do not need to keep track of the state for each individual vertex,
    but rather just the state of the overall object. However, since we are no longer
    dealing with just points, the equations of motion become more complicated, as
    does the collision response.


    # 9.1 RIGID BODY STATE


    To represent a rigid object, we need to first keep track of the center of mass
    of the object. The center of mass will have a 3D position x and a velocity v,
    just like we have had for points. Coupled with the mass of the overall object,
    we can think of modeling the linear or translational part of the rigid body’s
    motion in the same way that we have kept track of particles.


    ![](img/b434947f68660f7e26f8700ff77023a5_209_0.png)'
