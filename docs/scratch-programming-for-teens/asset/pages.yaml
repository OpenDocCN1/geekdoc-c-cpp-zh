    # Creating New Sprites Using Scratch''s Paint Editor


    In addition to using the sprites supplied with Scratch and graphics that you acquire
    from the Internet, you can always create your own sprite using any graphic/paint
    program. Although it does not have all of the bells and whistles that applications
    like Corel Paint Shop or Adobe Photoshop, Scratch''s built-in Paint Editor, shown
    in Figure 2.20, offers everything needed to draw or modify graphics for use as
    sprites and backgrounds.


    As Figure 2.20 demonstrates, Scratch''s Paint Editor is divided into multiple
    components. To Scratch''s cross-platform design, the Paint Editor looks and operates
    identically on both Microsoft Windows and Mac OS X.


    # Examining the Drawing Canvas


    Links to the Paint Editor program are located just under the stage and within
    the Costumes and Backgrounds tabs located in the scripts area. The Paint Editor
    program can be used to create or modify new sprites, costumes, and backgrounds.
    Most of the space on the Paint Editor''s window is dedicated to a drawing canvas.
    To draw on the canvas, you select different drawing commands from the toolbar
    and then use the mouse to draw on the canvas. You can work with different colors
    and apply a range of special effects.


    If the size of the graphic being worked on exceeds the available area, scrollbars
    are enabled on the right-hand side and the bottom of the drawing canvas, allowing
    you to view all parts of the graphic. You can also use the Zoom In and Zoom Out
    buttons located at the bottom of the Paint Editor window to temporarily increase
    decrease the magnification of the drawing canvas.'
