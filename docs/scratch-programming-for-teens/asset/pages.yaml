    # Drawing with the Pen


    Within Scratch applications, drawing is performed using a virtual pen. This pen
    works very much like a real pen. When placed in a down position, it can be used
    to draw on the stage. When placed in an up position, drawing ceases. In order
    to draw or stop drawing, you must be able to programmatically control the pen''s
    up and down positions, which you can do using the code blocks shown in Figure
    12.2.


    Using the first code block, you can easily create a simple drawing application.
    To create this application, start a new Scratch project and delete the default
    cat sprite and replace it with a new sprite made up of a small black dot (easily
    using the Paint Editor program). Once you have created your new application as
    described above, select its sprite and add the following script to it:


    ![](img/1b656b54ace8795973817e2c2ac6a41b_253_2.png)


