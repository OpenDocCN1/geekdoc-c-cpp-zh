  md: '# Configuring Audio Volume


    Rather than playing audio files, drum beats, and musical notes at whatever volume
    the computer is set to, you use the code blocks shown in Figure 11.9 to change
    the volume at which audio files, drum beats, and musical notes are played.


    The first code block shown in Figure 11.9 is used to change the volume of sound
    playback for an individual sprite. Using this code block, you can change a sprite''s
    volume by a specified percentage, with 0 being no volume and 100 being the maximum
    volume. The second code block lets you assign a specific value to a sprite in
    the range of 0 to 100. Using the third code block, you can retrieve a sprite''s
    volume and optionally display this value in a monitor on the stage.


