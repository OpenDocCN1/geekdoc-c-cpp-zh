- img_proc: true
  md: 'The stage to start a new drawing is managed by the Clear sprite in conjunction
    with the stage. The process of clearing the stage is initiated whenever the user
    clicks on the Clear sprite. When this happens, the following script, which needs
    to be added to the Clear sprite, is executed.


    ```

    when Clear sprite clicked

    broadcast Clear

    ```


    As you can see, all that this script does is send a broadcast message of Clear,
    indicating that the user wants to clear the stage. This broadcast message serves
    as a trigger that initiates the execution of the following script, which must
    be added to the stage:


    ```

    when I receive Clear

    clear

    ```


    As you can see, this script is very straightforward. It executes a pen block that
    clears off the stage whenever the Clear broadcast message is received.


    # Step 4: Saving and Executing Your Scratch Project


    All right! You now have all of the information needed to create and execute the
    Doodle Drawing application. Assuming that you followed carefully with all of the
    instructions that were provided, you should be ready to test your new application.
    If you have not already done so, save your Scratch application project and then
    switch to Presentation mode and click on the green flag button.


    As you work with the Doodle Drawing application, be sure to click on every one
    of its buttons to make sure the pen switches on when drawing. Also, experiment
    with each of the application''s line sizes to ensure that they are working properly.


    # Summary


