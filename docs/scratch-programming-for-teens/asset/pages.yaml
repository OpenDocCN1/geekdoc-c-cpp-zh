    # Distributing Scratch Projects


    Scratch is an interpreted programming language. This means that unlike some programming
    languages, such as Visual Basic and C++, which compile their applications into
    an executable file that can then be run on other computers without requiring that
    the programming language be installed, Scratch applications can only execute when
    run within the Scratch IDE (or the Scratch website at http://scratch.mit.edu).
    Therefore, if you want to distribute Scratch applications and execute them on
    someone else''s computer, you must first see to it that Scratch is installed on
    the other computer, or you must create a special application distribution CD that
    includes system files required to run your application when Scratch has not been
    installed.


    # Note


    You can also share access to your Scratch application projects by posting them
    on the Scratch website and pointing your friends to that website, where they can
    view and run them using a Java-enabled web browser. You will learn all the steps
    involved in sharing your Scratch applications this way in Chapter 13, "Sharing
    Your Scratch Projects Over the Internet."'
