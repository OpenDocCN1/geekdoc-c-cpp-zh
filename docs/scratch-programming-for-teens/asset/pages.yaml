    By posting your questions to the appropriate forum, you can tap into the expertise
    and experience of other Scratch programmers. Often, you can find an answer to
    your problem without having to post a question at all. Answers often be found
    in threads already posted by other Scratch programmers. Figure 15.8 shows an example
    of types of discussions you will find when you visit the Scratch website’s forums.


    # Summary


    This chapter taught you about the different types of errors to which Scratch applications
    are susceptible and examined a number of different ways in which pesky application
    bugs can be tracked down and eliminated. This included learning how to run your
    application in stepping mode so that you can monitor the execution of the logical
    flow within your application while keeping a watchful eye on variable values.
    You also learned how to access help from different sources, including the forums
    sponsored by the Scratch website, where you can receive help from Scratch programmers
    around the world.'
