  md: "# Step 3: Creating Scripts Used to Control the Doodle Drawing Application\n\
    \nMost of the Drawing application’s programming logic resides within a single\
    \ script belonging to the Drawing Point sprite. This script is responsible for\
    \ all drawing operations, including determining what color and what size the user\
    \ wants to use. The remaining logic revolves around the clearing of the stage,\
    \ which is handled by two small scripts, one belonging to the Clear sprite and\
    \ the other to the stage.\n\n# Developing the Drawing Point Sprite’s Programming\
    \ Logic\n\nThe programming logic that controls the overall execution of all drawing\
    \ within the Doodle Drawing application belongs to a script that must be added\
    \ to the Drawing Point sprite. Do not let the length of the code deceive you;\
    \ the-programming logic is really very simple.\n\nTo help make things easy to\
    \ follow, the script will be developed in three parts. For the first part, create\
    \ and add the following script to the Drawing Point sprite:\n\n```\nwhen clicked\n\
    set pen size to [4]\nset pen color to [black]\nforever\n  if <mouse down?> then\n\
    \    go to mouse-pointer\n    pen down\n    show\n  else\n    pen up\n    hide\n\
    end\n```\n\nYou can see, the script executes when the green flag is pressed. It\
    \ starts by setting a default pen size of 4 and a default color of black. Next,\
    \ a loop is set up that will be used to manage the execution of all of the remaining\
    \ code blocks. The first set of code blocks to be embedded within the loop is\
    \ already present. It consists of a control block that checks if the left mouse\
    \ button is being pressed, and if it is, the Drawing Point sprite is moved to\
    \ the mouse-pointer, the pen is placed in a down position, and the Drawing Point\
    \ sprite is displayed."
  merge: -1
  pgno: 265
- img_proc: true
  md: "left mouse button is not being pressed, then the pen is placed in an up position\
