    # Getting Help from Other Scratch Programmers


    In addition to the documentation made available to you through Scratch''s help
    screens, the Scratch website also sponsors a collection of forums that bring together
    Scratch programmers from around the world. These forums facilitate the free exchange
    of ideas and provide you with the opportunity to seek help and advice from fellow
    Scratch programmers. As shown in Figure 15.7, you can access these forums by going
    to http://scratch.mit/forums.


    # Tip


    If all else fails and you simply cannot find an answer to a particular problem,
    you can try sending an email to the Scratch developers by going to http://scratch.mit.edu/contact/us
    and filling in the form that is provided. When doing so, provide as much information
