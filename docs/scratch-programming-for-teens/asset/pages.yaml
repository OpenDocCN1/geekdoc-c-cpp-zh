  md: '# Chapter 5 ■ Moving Things Around


    The first two motion blocks in the script move the sprite 400 steps. Since the
    cat, by default, is pointed 90 degrees to the left, this will move the sprite
    from the upper-left corner of the stage to the upper-right corner of the stage.
    The next pair of motion blocks moves the sprite down to the bottom-right corner
    of the stage. The third pair of motion blocks moves the sprite to the bottom-left
    corner of the stage, and the last pair of motion blocks moves it back to the upper-left
    corner of the stage.


    # Note


    All of the sprites supplied by Scratch have a predefined rotation axis. You can
    change the rotation axis for these sprites and set the rotation point for new
    sprites that you create or import into Scratch by editing the sprite using Scratch''s
    Paint Editor program and then specifying a new rotation axis using the program''s
    Set Rotation Point control.


    A sprite''s rotation is also affected by the selection of one of the three rotation
    buttons located on the left-hand side of the Sprite''s info area. If you look
    at the cat sprite''s rotation setting, you will see that the cat sprite is configured
