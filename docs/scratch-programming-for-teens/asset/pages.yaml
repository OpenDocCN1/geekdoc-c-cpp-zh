    # Assigning Variables to Sprites and the Stage


    Variables in Scratch applications belong to the sprites in which they are defined
    (or the stage). Therefore, it is important that when adding new variables to your
    application, you select the thumbnail for the sprite (or stage) where the variable
    belongs. For example, variables that need to be accessed by different'
