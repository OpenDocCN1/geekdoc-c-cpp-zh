  md: '# Removing Projects


    If you decide that you want to remove any of the applications you have uploaded
    to the Scratch website, you may do so by displaying your list of projects, selecting
    one or more using the application''s check box control (located just underneath
    it), and then clicking on the Delete Selected Project button, as shown in Figure
    13.18.


    # Updating Your Projects


    If after uploading one of your Scratch applications to the Scratch website you
    decide to share, decide to make changes to it that you would like to do, you may
    do so by simply uploading it again, using the exact same name that you used to
    upload the first time. If you want to keep the original copy of the application
    intact on the Scratch website, then you will need to assign a different name to
    the updated version of your application before you upload it.


    # Other Scratch Website Features


    The Scratch website supports many other features related to the sharing of Scratch
    application projects that have not been discussed in this chapter but


    ![](img/1b656b54ace8795973817e2c2ac6a41b_285_0.png)


    Figure 13.18

    Deleting an application that you have uploaded to the Scratch website.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'which you may want to investigate and learn more about. For example, you can
    change your personal profile information by uploading a picture to represent who
    you are. You can also change your password. As you browse the website, you can
    add applications that you really like to a favorites list, making them easy to
    return to and find again.


    You can delete your galleries by clicking on the Delete This Gallery button when
    viewing one of your. You can add projects that you have uploaded to galleries
    by opening the gallery that you want to place the application into and then clicking
    on the Add My Project button. This displays a list of projects, allowing you to
    select which ones you want to move into the current gallery. You can even upload
    a custom graphic from your desktop to be used to represent your gallery.


    # Downloading Other People''s Projects


    In addition allowing you to upload and share your Scratch application projects
    with Scratch programmers from around the world, the Scratch website also offers
    access to all of the application projects that other programmers have uploaded.
    As such, you have instant access to a virtually unlimited number of Scratch applications,
    all of which you can view, run, and if you want, download. Once it is downloaded,
    you can study the application and see how it works. If you have ideas for making
    it better, you can use it as the basis for creating your own version of the application.


    Downloading a Scratch application project is easy. First, locate and open the
    application that you want to download, and then look for its download link, located
    in the upper-right corner of the web page, as demonstrated in Figure 13.19.


    Once you click on a Scratch project''s Download link, a File Download window is
    displayed, asking what you want to do. Your choices are to open a copy of the
    application into Scratch on your local computer or to download the application
    as a file to your computer, allowing to you open and work with it later.


    # Note


    If you elect to open an application project using Scratch, you can save a copy
    of it on your computer using Scratch''s Save As button. If you elect to download
    the application project as a file, the file that is downloaded can then be easily
    identified by its name, the familiar Scratch cat icon, and its .sb extension.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 266 Chapter 13 ■ Sharing Your Scratch Projects over the Internet


    ![](img/1b656b54ace8795973817e2c2ac6a41b_287_0.png)


    Figure 13.19

    Downloading an application from the Scratch website.


    # Summary


    This chapter provided instruction on how to upload your Scratch applications to
    the Scratch website. Doing so allows you to share your work with other members
    of the Scratch global community. The Scratch website places thousands of applications
    at your fingertips, allowing you to not only run them but to download them and
    see how they work. Through the exchange of application projects, you can become
    a much more knowledgeable and effective programmer, leveraging not only your own
    work but also the work and ideas of others.'
