  md: 'AppleScript. The programming concepts that you can learn from Scratch include:


    +   - **Sequential Processing.** This involves the processing of application code
    blocks, in the order that they are laid out, starting at the beginning of a script
    file and continuing to the end of the script.


    +   - **Conditional Programming Logic.** This involves the conditional execution
    of code blocks based on data collected during application execution.


    +   - **Use of Variables.** This involves the storage, retrieval, and modification
    of data during application execution.


    +   - **Iterative Processing.** This involves the repeated execution of code blocks
    to process large amounts of information or to control the repeated execution of
    code blocks required to direct the execution of a game or application.


    +   - **Boolean Logic.** This involves the application of programming logic that
    executes based on the analysis of true/false data provided by Scratch during program
    execution.


    +   - **Interface Design.** This involves the development of user-friendly and
    intuitive application stage layout, making it easy for users to interact with
    applications.


    +   - **Program Synchronization.** This involves the passage and receipt of messages
    between application scripts for the purpose of coordinating the execution of different
    parts of an application.


    +   - **Event Handling.** This involves the initiation of script execution based
    on the occurrence of predefined events, such as the pressing of keyboard keys,
    the pressing of the green flag key, or the receipt of a synchronization message.


    +   - **Application and Game Development.** This involves the creation of different
    types of computer application projects.


    +   - **Sprite Programming.** This involves the use of sprites as the basis for
    developing graphical programs.


    +   - **Application Troubleshooting.** This involves the identification, location,
    and elimination of programming errors, or bugs, that prevent applications from
    executing as they are supposed to.'
