  md: '# INTRODUCTION


    Welcome to Scratch Programming for Teens! Scratch is a programming language developed
    by the MIT Media Lab for the purpose of teaching programming to teens and other
    first-time programmers. Scratch is a new programming language, initially released
    in May 2007. Scratch supports the development of computer games, interactive stories,
    graphic artwork and computer animation, and all sorts of other multimedia projects.


    Scratch allows new programmers to create programs by snapping together blocks.
    Scratch consists of a programming language made up of different blocks and an
    easy to learn graphical development environment that includes a paint application
    for creating graphics and built-in sound editing capabilities. Scratch also comes
    with huge collections of sample applications as well as graphics and sound files,
    all of which you can use to create your own Scratch projects.


    As demonstrated in Figure A.1, Scratch programs are made up of graphical blocks,
    which are snapped together. Scratch blocks resemble puzzle pieces in the way that
    they snap together. Scratch blocks can only be snapped together in ways that make
    sense, preventing new programmers from using them in invalid combinations. In
    this way, Scratch enforces proper programming syntax and ensures that new programmers
    learn the proper way to assemble and formulate programming logic.


    Scratch’s development was inspired by the method that hip-hop DJs use to mix and
