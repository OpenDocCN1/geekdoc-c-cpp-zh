  md: 'Chapter 2 ■ Getting Comfortable


    #  Specifying Color Settings


    The Paint Editor lets you specify current color settings for both foreground and
    background drawing using the current Color Settings control located on the left-hand
    side of the Paint Editor window, just under the options area. To set the current
    foreground color, click on the top square and select a color from one of the color
    palettes that are displayed beneath the control. Likewise, you can set the current
    background color by selecting the bottom square and then selecting a color from
    one of the color palettes.


    # Configuring a Sprite’s Rotation Center


    One final but very important Paint Editor feature that you definitely need to
    know how to use is the Set Rotation Center button located in the lower-left corner
    of the Paint Editor window. When clicked, this button displays a set of cross-hairs
    on the Paint Editor’s drawing canvas, as demonstrated in Figure 2.23. You can
    then use drag and drop to move the cross-hair over the portion of the sprite you
    want to set up as the sprite’s rotational center when the sprite is rotated on
    the stage.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_71_0.png)


    Figure 2.23

    Cross-hairs make it easy to set a sprite’s rotational center.'
