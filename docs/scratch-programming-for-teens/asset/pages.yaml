  md: '# CHAPTER 8


    # DOING A LITTLE MATH


    Scratch provides robust support for performing mathematical calculations. This
    gives you the ability to develop applications that can manipulate numeric data
    in a variety of ways. Scratch provides this support through numbers code blocks.
    Numbers code blocks are reporter blocks and therefore can only be used in conjunction
    with stack code blocks. This chapter will provide a thorough review of each of
    these code blocks and will also show you how to create a new Scratch application,
    the Number Guessing game.


    The major topics covered in this chapter include:


    +   - Learning how to add, subtract, multiply, and divide programmatically

    - Learning how to generate random numbers using any range you specify

    - Instruction on how to perform different types of numeric comparisons

    - Learning how to perform a number of built-in mathematical operations


    # Addition, Subtraction, Multiplication, and Division


    Like all modern programming languages, Scratch provides programmers with the ability
    to add, subtract, multiply, and divide numeric data. This capability is offered
    through the code blocks shown in Figure 8.1.'
  merge: -1
