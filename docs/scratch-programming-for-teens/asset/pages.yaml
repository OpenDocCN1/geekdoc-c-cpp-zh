  md: '# Chapter 1 ■ Introducing Scratch


    # Note


    Scratch is designed for teaching first-time programmers how to program. To make
    the learning experience as straightforward and understandable as possible, the
    developers of Scratch have sometimes sacrificed programming power and features
    in favor of simplicity and ease of learning. The goal of the Scratch development
    team is to promote learning and not to develop a programming language capable
    of delivering every advanced programming feature required by professional programmers.
    As a result, Scratch lacks some programming features currently supported in advanced
    programming languages. Instead, Scratch focuses on fundamental programming concepts
    to provide new programmers with a foundation upon which they can later build,
    and when if they decide to move on to other programming languages.


    # Introducing Scratch


    Before you can use Scratch, you need to install it on your computer. The installation
    process varies, depending on whether you use Microsoft Windows or Mac OS X. Instructions
    for installing Scratch on both of these operating systems are provided in the
    sections that follow. You will find the the installation files needed to install
    Scratch 1.2.1 on this book’s companion CD-ROM. Alternatively, you can download
    a copy of Scratch from the Scratch website by executing the following steps:


    +   1. Go to http://scratch.mit.edu and click on the Download Scratch Now!


    +   2. The Download Scratch page appears. Fill in the optional form to receive
    updates about Scratch.


    +   3. Click on the Continue to Scratch Download button. The web page shown in
    Figure 1.2 displays. Click on the appropriate link for your operating system.


    The Windows download file is provided as a self-extracting executable named ScratchInstaller.exe.
    The Mac OS X installation file is provided as a Mac OS X disk image file named
    MacScratch.dmg. Both of these installation files are approximately 30MB in size,
    so to download them you will want to use a broadband Internet connection.


    # Note


    There is no official Linux version of Scratch currently available. However, a
    user-adapted version of Scratch, along with instructions for installing it, is
    available at http://tcpcdpodcast.org/scratch.html.'
