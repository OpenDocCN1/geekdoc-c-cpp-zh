  md: 'necessary during application execution. A real number is a number that includes
    a decimal number.


    Scratch handles different types of data differently. For example, string data
    can only be displayed by embedding it within looks like code blocks. Integer and
    real data can also be embedded within code blocks and displayed in monitors. In
    addition, integer and real data can be added, subtracted, and manipulated in all
    the different ways that you would be able to manipulate numeric data. Scratch
    also allows you to use integers and real numbers interchangeably.


    # Note


    Industrial strength programming languages Microsoft C++ and Visual Basic support
    a much wider range of data types. However, they all support the same basic types
    of data that Scratch does.


    # Storing Data in Variables


    As has already been stated, you can embed numeric data inside different types
    of code blocks, using it to control the operation of scripts. You can also store
    numeric data collected when your applications execute using variables. In Scratch,
    variables allow you to store, retrieve, and modify numeric data.


    # Note


    Scratch cannot store string or Boolean data in variables.


    # Creating Scratch Variables


    In order to store, modify, and retrieve data in a Scratch application, you need
    to create variables. In order to work with variables within your Scratch applications,
    you must first define and add them to your application projects. This is done
    by clicking on the Variables button located at the top of the blocks palette and
    then clicking on the Make a Variable button, as shown in Figure 7.2.


    Once this button has been clicked, Scratch displays the window shown in Figure
    7.3, allowing you to assign a name to the variable.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_162_0.png)


    Figure 7.2

    Creating and deleting Scratch variables.'
