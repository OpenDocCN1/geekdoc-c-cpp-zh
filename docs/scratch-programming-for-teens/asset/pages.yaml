    For situations where you want to pause script execution to allow time for the
    entire audio file to finish playing, you have two choices. First, you can add
    a control block immediately following the sound block that pauses script execution
    for a specified number of seconds (the number of seconds needed to play the audio
    file). Better yet, you can use the second code block shown in Figure 11.1 as demonstrated
    in the following script:


