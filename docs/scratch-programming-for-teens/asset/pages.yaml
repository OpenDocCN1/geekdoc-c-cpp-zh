  pgno: 317
- img_proc: true
  md: '# APPENDIX B


    # WHAT NEXT?


    Learning how to become a good programmer takes time and effort. It means putting
    in the hours necessary to learn the fundamental techniques involved in developing
    computer application projects. Scratch provides an excellent platform for getting
    started. It provides a friendly and fun environment in which to learn. A good
    understanding of Scratch programming will prepare you to make the jump to other
    programming languages like Visual Basic, AppleScript, C++, and so on.


    Learning Scratch requires commitment. By making your way through to the end of
    this book, you have demonstrated this commitment. Although this book has taught
    you a lot about Scratch and programming in general, there is still much more to
    be learned.


    To become a world-class programmer, you need to continue your programming education.
    You need to continue to experiment and learn as much as you can about Scratch.
    Do not think of this book as the end of your programming education. Instead, think
    of it as the beginning. Over the coming weeks and months, you should continue
    developing new Scratch projects. You should also keep an eye on the different
    forums hosted on the Scratch website to learn from the experiences of others.
    Better yet, consider becoming an active member of the Scratch community.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'To help you further your understanding of Scratch and to become a better programmer,
    this appendix provides a list of websites and supplemental reading materials that
    you can turn to as you continue to develop and hone your programming skills.


    # Locating Scratch Resources Online


    As you would expect, there is an awful lot of helpful information on the Internet
    about Scratch. By frequenting the websites discussed in the sections that follow,
    you can keep abreast of the latest happenings in the Scratch community while keeping
    your Scratch programming knowledge and skills up to date.


    # The Scratch Website


    The most informative and helpful Scratch website is the Scratch.mit site developed
    and maintained by MIT located at http://scratch.mit.edu, as shown in Figure B.1.
    This site is packed with helpful information, including documentation, video tutorials,
    and forums where you can go to interact and learn from other Scratch programmers
    from around the world. Best of all, this site provides instant access to tons
    of Scratch projects, all of which you can download, experiment with, and learn
    from.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_319_0.png)


    Figure B.1

    The official home page of the Scratch programming language.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Locating Scratch Resources Online


    ![](img/1b656b54ace8795973817e2c2ac6a41b_320_0.png)


    Figure B.2

    Scratch is developed by the Lifelong Kindergarten Group at MIT.


    # The Lifelong Kindergarten Website


    Another website that is certainly worth visiting is the Lifelong Kindergarten
    Media Lab site located at http://llk.media.mit.edu/, as shown in Figure B.2.

    This site includes information about Scratch, including links to various papers
    about Scratch.


    # The Wikipedia Scratch Page


    Another excellent source of Scratch information is the Wikipedia Scratch page
    located at http://en.wikipedia.org/wiki/Scratch_%28programming_language%29%29,
    as shown in Figure B.3.


    Here you can find information on Scratch, its origins and creator, as well as
    its development environment and website. In addition, you will also find plenty
    of links to papers about Scratch.


    # The Programming Page at the Thornburg Center Website


    If your operating system of choice is Linux, you will be pleased to know that
    an official Linux version of Scratch is in the works. In the meantime, if you
    cannot wait, you can download a free user implementation of Scratch at http://tcppodpodcast.org/scratch.html,
    as shown in Figure B.4.'
  merge: -1
  pgno: 320
