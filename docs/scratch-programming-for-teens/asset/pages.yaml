    # Working with Built-in Mathematical Functions


    In addition to all of the mathematical operations that you can put together using
    the numbers code blocks previously discussed in this chapter, Scratch provides
    one additional multi purpose code block, as shown in Figure 8.8.


    This code block is designed to perform any of 12 different mathematical functions,
    which can be selected from the code block''s drop-down list. The functions that
    this code block can perform are outlined in the following list:


    +   - **abs.** Returns the absolute, non-negative value of a number.

    - **sqrt.** Returns the square root of a number.

    - **sin.** Returns a value representing the sine of an angle.

    - **cos.** Returns a value representing the cosine of an angle.

    - **tan.** Returns a value representing the tangent of an angle.

    - **asin.** Returns the arc sine for the specified numeric value.

    - **acos.** Returns the arc cosine for the specified numeric value.

    - **atan.** Returns the arc tangent for the natural exponent of a specified value
    (i.e., the opposite of e^).

    - **log.** Returns the natural log of a number.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_189_1.png)


    **Figure 8.8**

    This code block can assist you in setting up extremely complex calculations.'
