    # Note


    Scratch was developed using another programming language known as Squeak Squeak
    is a cross-platform programming language, meaning that it can be used to develop
    applications on many different computer operating systems. By selecting Squeak
    as the programming language used to create Scratch, Scratch’s development team
    ensured that they would be able to create and execute Scratch on different operating
    systems, including Microsoft Windows and Mac OS. X. If you are curious, you can
    learn more about Squeak by visiting http://www.squeak.org.


    Examples of other source programming languages include Ruby and Perl. However,
    unlike these programming languages developed by a community of programmers working
    together collectively, Scratch was developed as a closed development project.
    This means that all Scratch development is performed by the Lifelong Kindergarten
    Group at MIT Media Lab.


    # Scratch’s Building Block Approach to Programming


    Scratch is a new programming language, initially released in March 2006. Scratch
    is different from other programming languages like Visual Basic in that it does
    not support a text-based approach to programming, as demonstrated here:


    ```

    //Excerpt from a Visual Basic application

    If strCurrentAction = "FillCircle" Then

    Dim objCoordinates As Rectangle

    objRectangle(Math.Min(objEnd.X, objStart.X), =

    Math.Min(objEnd.Y, objStart.Y), =

    Math.Abs(objEnd.X - objStart.X), =

    Math.Abs(objEnd.Y - objStart.Y))

    Pick_Color_And_Draw("FillCircle", objCoordinates)

    End If

    ```'
