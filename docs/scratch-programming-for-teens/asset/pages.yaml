    flag button is clicked. Once started, two pen blocks are used to set the width
    of the pen and the color used by the pen when drawing. Next, a forever code block
    has been added to repeat the execution of all the code blocks embedded within.


    Within the loop, an if...else code block is used to conditionally control the
    execution of three additional statements. The if...else code block''s execution
    is controlled by examining the value returned by a sensing block that returns
    a value of true when the user presses the mouse''s left button and false if the
    mouse''s left button is not being pressed.


    When the user presses the mouse button, the two statements located at the top
    of the if...else code block are executed. The first statement moves the sprite
    to the same location as the pointer, and the second code block places Scratch''s
    virtual pen in a down position, allowing drawing to begin. As a result, a blue
    line is drawn anywhere on the stage where the mouse-pointer is moved when the
    mouse button is being pressed. The code block at the bottom of the if...else code
    block is executed whenever the user releases the left mouse button, lifting the
    virtual pen and halting any drawing.


