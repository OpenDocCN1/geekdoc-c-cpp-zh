    # Distributing Scratch Applications to Windows Computers


    The files you need to burn to your distribution CD-ROM vary, depending on whether
    you are working with Microsoft Windows or Mac OS X. When working with Microsoft
    Windows, you will need to burn the following files identified in Figure 4.25,
    as well as a copy of your Scratch application, to a CD-ROM.


    Each of the files listed can be found in the folder in which you installed Scratch,
    which on Microsoft Windows is C:\Program Files\Scratch by default.


    +   - Scratch.exe

    - Scratch.image

    - Scratch.ini

    - Scratch.Plugin.dll

    - MPEG3Plugin.dll

    - License.txt


    # Note


    The reason for including the License.txt file, which is Scratch’s license document,
    is to ensure that anyone you distribute your CD-ROM to know the terms of the license
    agreement. Including this file will also keep you out of legal trouble.'
