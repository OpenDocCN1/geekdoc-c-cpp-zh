    # Creating the Doodle Drawing Application


    At this point you have completed your review of all of Scratch’s code blocks and
    have learned how to put them all to work. Now it is time to work on the chapter’s
    application project, the Doodle Drawing application. This paint-like application
    expands on the examples you have been working on throughout this chapter, making
    extensive use of the pen code blocks and allowing you to draw by selecting from
    a range of predefined colors. The application allows you to draw using a range
    of different pen sizes. There is also a Clear feature that lets you start over
    any time you want so that you can begin working on a new drawing.


    In total, the Doodle Drawing application is made up of 12 sprites and 3 scripts.
    Figure 12.12 shows how the game looks when first started.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_261_1.png)


