  md: '# Watch Out when Removing Sounds and Sprites 287


    ![](img/1b656b54ace8795973817e2c2ac6a41b_308_0.png)


    Scratch continues to highlight code blocks one at a time for as long as the script
    executes, giving you the opportunity to validate that the script is executing
    exactly as you expect it and that variables are being modified as you want. While
    monitoring script activity you see something happen that you do not expect, you
    can halt application execution, knowing exactly where the problem lies.


    As your application executes in single stepping mode, you can also keep an eye
    on variable values, ensuring that they being properly set and modified as you
    expect them to. You can also switch between sprites and observe other scripts,
    which will also be executing in single stepping mode.


    # Hint


    Although single stepping is a very helpful debugging tool, it lacks many of the
    features that are usually included in debugging tools provided by most modern
    programming languages. For example, it lacks the ability to set breakpoints, which
    pause execution when code statements are reached, giving programmers the ability
    to access an application''s status before allowing the application to continue
    its execution. Still, single stepping serves its purpose well, and when combined
    with the debugging techniques covered in this chapter, it should be more than
    sufficient to help you track and fix any application bug.


    # Watch Out when Removing Sounds and Sprites


    Unlike many programming languages, Scratch is extremely forgiving when it comes
    to what in many programming languages would be considered a major error. For example,
    let''s say you created a script that played an audio file named'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Chapter 15 ■ Finding and Fixing Program Errors


    meow, as demonstrated below, and you later decided to remove the audio file from
    your application but forgot to remove the sound block in the script. It would
    certainly be logical to expect that when you ran your application, an error would
    occur. But this will not be the case.


    ```

    when clicked\play sound meow

    ```


    Rather than preventing application execution and highlighting the error, Scratch
    overlooks the problem and runs your application anyway. When it comes time to
    play the missing audio file, scratch just ignores the problem. This behavior can
    be a double-edged sword, because on the one hand application still runs. However,
    unless you carefully test the execution of your application after deleting the
    sound file, you may not discover the error, and the overall quality of your application
    will suffer.


    Scratch is just as forgiving when it comes to the management of sprite costumes.
    Suppose, for example, that you added a costume named bat1-a to a sprite and then
    used the following script to switch its costume:


    ```

    when clicked

    switch to costume bat1-

    ```


    If sometime down the road you decided to modify your application by removing the
    costume from the sprite, Scratch would not flag the oversight and would instead
    allow your application to run, ignoring the costume switch error when it comes
    after it. Again, this type of behavior is a double-edged sword and can only be
    overcome by careful modification and retesting of your applications any time you
    decide to change or remove a sound, costume, or background.


    # Getting Help


    The development of good debugging skills is an absolute requirement for any serious
    programmer. However, no matter how good you may be at debugging, there are going
    to be times when you may need additional help in finding the answer to a particular
    problem or challenge. Fortunately, there are a number of resources that you can
    turn to for assistance, both within Scratch and online, as discussed in the following
    sections.'
