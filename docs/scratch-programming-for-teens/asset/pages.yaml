    # Programming with Scratch


    As a beginner’s programming language, Scratch teaches you a number of critical
    programming concepts that you will be able to later rely on should you decide
    to make the jump to other more traditional and industrial-strength programming
    languages like Microsoft Visual Basic, C++, JavaScript, and'
