  md: '# ABOUT THE AUTHOR


    Jerry Lee Ford, Jr. is an author, educator, and an IT professional with over 18
    years'' experience in information technology, including roles as an automation
    analyst, technical manager, technical support analyst, automation engineer, and
    security analyst. He is the author of 24 other books and co-author of two additional
    books. His published works include AppleScript Studio Programming for the Absolute
    Beginner, Microsoft Windows PowerShell Programming for the Absolute Beginner,
    Microsoft Visual Basic 2005 Express Edition Programming for the Absolute Beginner,
    Microsoft VBScript Professional Projects, Microsoft Windows Shell Scripting and
    WSH Administrator''s Guide, Microsoft Windows Script Programming for the Absolute
    Beginner, Learn JavaScript in a Weekend, Second Edition, and Microsoft Windows
    XP Professional Administrator''s Guide. Jerry has a master''s degree in business
    administration from Virginia Commonwealth University in Richmond, Virginia, and
    he has five years'' experience as an adjunct instructor teaching networking courses
    in information technology.'
