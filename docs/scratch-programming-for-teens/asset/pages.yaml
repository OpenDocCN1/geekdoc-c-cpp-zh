  md: '# Creating a New Scratch Project


    Now that you are familiar with the basic components of sprites, let''s spend a
    few minutes learning how to create your first Scratch application project. All
    new Scratch projects automatically contain a single sprite, representing an image
    of a kitten. By default, the sprite, named Sprite1, does not have any sprites
    but does two costumes and two sounds associated with it. Using this sprite, let''s
    create a Scratch application project that makes the kitten meow and say "Hello
    World!" when clicked.


    The first step in creating a new Scratch application is to click on the New button
    located at the top of the Scratch IDE. In response, Scratch will create a new
    project, as shown in Figure 1.8.


    As Figure 1.8 shows, the Scratch IDE is organized into a number of separate components.
    For starters, the code block area contains code blocks, organized into eight different
    collections. You will use selected code blocks to create a script that makes the
    kitten talk.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_36_0.png)


    Figure 1.8

    Creating a new Scratch application project.'
