    # Switching Between Code Block Groups


    Like applications created by any programming language, Scratch applications code
    made up of collections of code blocks that manipulate sprites and interact with
    the user. Scratch''s program code is organized into scripts belonging to sprites.
    Every sprite in an application can be assigned one or more scripts. In addition,
    the stage can also execute its own scripts.


    As you have already seen, the first step in creating a script is to select the
    sprite (or the stage) to which the script will belong. This is done by clicking
    on the appropriate thumbnail in the sprites list. You can add code blocks by dragging
    the blocks from the blocks palette and dropping them into the scripts area (when
    the Script tab is selected). The blocks palette is organized into two sections.
    The top section contains eight control buttons, each of which represents a different
    category of code block. Each of the buttons is colored. The currently selected
    button is easily identified because it is filled in its assigned color. The left-hand
    edge of the unselected buttons shows the color of the code blocks belonging to
    its category. For example, Figure 2.12 shows how the blocks palette looks when
    the Motion button has been selected.


    # Trick


    You can right-click (Control-click on Mac OS X) on any code block and then select
    Help from the resulting popup menu to get help on any code block.


