    # Step 5: Developing the Application’s Programming Logic


    The programming logic that drives the execution of the Family Picture Movie is
    organized into 13 separate scripts, assigned to each of the application’s sprites
    and to its background. The overall execution of all of this application’s scripts
    is coordinated through the use of broadcast messages and through the use of control
    blocks that monitor the value assigned to the application’s variable, executing
    only when the variable reaches a predefined value.


    # Setting Up the Opening Animation Sequence


    The Family Picture Movie begins running when the player clicks on the green flag
    button. When this occurs, a number of the scripts within the application begin
    executing. One of these scripts is responsible for managing the animated sequence
    that plays when the application first begins executing. This script, shown next,
