  md: '# Chapter 1 ■ Introducing Scratch


    # Note


    The first time you start Scratch, Mac OS X may display a popup dialog prompting
    you for confirmation that you want to run Scratch, because it is an application
    downloaded from the Internet. Click on the Open button to allow Scratch to start.
    This popup dialog window will not display upon subsequent startups.


    # Creating Your First Scratch Application


    Scratch application projects are made up of objects called sprites. A sprite is
    a two-dimensional bitmap image drawn on a transparent background. Sprites can
    be moved around and made to interact with one another. Sprites consist of three
    primary components, as outlined here:


    +   - Scripts. Collections of code blocks that outline the programming logic that
    controls the operation of sprites.


    +   - Costumes. Images that are used to display the sprite on an area of the Scratch
    IDE, referred to as the stage. Sprites can consist of any number of costumes.


    +   - Sounds. Sound effects that are played during application execution when
    certain events occur or as background audio.


    A sprite''s appearance can be changed by assigning different costumes. To move
    a sprite and control its behavior, you snap together code blocks to create sprites.
    Sprites can have any number of scripts associated with them. Scripts can be run
    by double-clicking the code blocks that make them up, in which case each block
    in the script is executed in top-down order. You can also set things so that scripts
    automatically run when various events occur. For example, you can configure script
    execution to occur when a sprite is clicked or when it interacts with other sprites.


    Sprites are displayed and interact with one another on a stage. As such, sprites
    are often referred to as actors. Scratch''s stage is located in the upper-right
    corner of its graphical interface.


    # Note


    Sprites can be selected from a predefined collection of graphic objects supplied
    with Scratch. They can also be copied and pasted from your hard drive or the Internet
    or created using Scratch''s built-in Paint Editor.'
  merge: -1
