    Here, the script checks to see if the value assigned to a variable Counter is
    equal to 3, and if it is, an audio file is played. If Counter is not equal to
    3, then a different audio file is played, and the script''s execution is halted.
    Halting a script this way forces its immediate termination, even if the script
    contains additional code blocks that have not been executed.


    Using the second control block shown in Figure 9.7, you can not only halt the
