    many levels deep. However, the deeper you go, the more difficult your scripts
    will be to understand and maintain.


    # Preventing Endless Loops


    Loops are extremely powerful tools, providing the capability to perform repetitive
    tasks with ease. However, if you are not careful when setting them up, you can
    accidentally set up an endless loop. An endless loop is a loop that, because of
    a logical error on the programmer''s part, never ends. For example, you might
    want to set up a loop that plays an audio file five times. But suppose when setting
    up the loop you make a mistake that prevented the loop from ever terminating,
    as shown here.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_207_2.png)


    Here, the intention was to set up a loop that would execute five times. The loop
    has been set up to execute for as long as the value assigned to Counter is'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'less than 5. Counter is assigned an initial value of 1, and its value is supposed
    to be incremented by 1 each time the loop executes. However, instead of incrementing
    the value of Counter by 1 at the end of the loop, the value of Counter is decremented
    by a value of -1. As a result, the loop never terminates, forever repeating the
    playback of the audio file. To prevent endless loops from occurring, you need
    to take extra care when setting up loops and test your scripts thoroughly when
    developing your applications.


    # Terminating Script Execution


    The last two control blocks offered by Scratch are shown in Figure 9.7. These
    code blocks programmatically halt script execution within your Scratch applications.


    Using the first of these two control blocks, you can halt the execution of the
    scripts in which the code block is placed, as demonstrated in the following example:


