  md: '# Chapter 13 ■ Sharing Your Scratch Projects over the Internet


    Once you have created a new account, you can begin uploading your Scratch applications.
    At the time this book was written, the Scratch website placed a 10MB limit on
    the size of application projects that could be uploaded. The purpose of this restriction
    is to ensure that plenty of space is made available to all members of the Scratch
    community and to help ensure that upload and download times are kept to a reasonable
    level.


    Once they are uploaded, you can manage your uploaded Scratch applications by logging
    in to the Scratch website using your new account. There is one important point
    you need to know: Once uploaded to the Scratch website, there is no way to restrict
    or keep private any of your Scratch applications. Everything uploaded is made
    available to anyone who visits the website.


    # Uploading Your Scratch Applications


    The first step in sharing a Scratch application is to click on the Share! button
    located at the top of the Scratch IDE, displaying the window shown in Figure 13.4.
    Begin by keying in your account name and password and then provide a name for
    your project. Next, enter any notes that you other Scratch programmers visiting
    the Scratch website will need to know to work with your application.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_275_0.png)


    Figure 13.4

    You can provide detailed information about your applications when uploading them.'
  merge: -1
