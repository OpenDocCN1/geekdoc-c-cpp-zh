  md: '# Step 5: Playing the Dance Music


    It is time to begin putting together the program code logic required to make your
    new application work. In total you will need to create two scripts for this project:
    one for the stage and another for the sprite representing Mr. Wiggly. The script
    belonging to the stage will be made up of code blocks that are responsible for
    playing the application''s background music. The script belonging to the sprite
    will contain the programming logic required to make Mr. Wiggly dance.


    The first step in the development of the stage''s script is to click on the Control
    button in the blocks palette and then drag and drop an instance of the green flag
    clicked block onto the scripts area, as demonstrated in Figure 4.15. This hat
    code block will automatically execute the script to which it is attached whenever
    the green flag button is clicked.


    Since the application''s background music is supposed to be played over and over
    again for as long as the application runs, you need to set up a loop that will
    repeatedly play the sound file. To set this up, drag and drop an instance of the
    forever code block to the scripts area, attaching it to the bottom of the green
    flag clicked block, as shown in Figure 4.16.


    Now that you have the loop set up, click on the Sound button located at the top
    of the blocks palette and then drag and drop an instance of the play sound code
    block onto the scripts area, embedding it inside the forever code block. Next,
    click on the pull-down menu located on the right-hand side of the code block and
    select Eggs from the list that appears. At this point the script that you are
    developing should look like the example shown in Figure 4.17.


    # Note


    Scratch automatically populates the play sound code block with a list of all of
    the sound files you added previously to the stage, making it easy for you to access
    them when working with sound code blocks.


    At this so, click on the Control button located at the top of the blocks palette
    and add one last code block to the script to finish it. To do so, drag and drop
    an instance of the wait code block over the scripts area, inserting it inside
    the forever code block, immediately following the play sound block, as shown in
    Figure 4.18. This block is needed to pause the loop for 16 seconds, allowing for
    the complete playback of the sound file, before the loop repeats and begins playing
    it again.'
