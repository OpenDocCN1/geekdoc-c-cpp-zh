    \ text-based programming languages, code statements are formulated following a\
    \ complex set of syntax rules. Failure to precisely follow these rules when writing\
    \ statements leads to syntax errors that prevent applications from running. Scratch,\
    \ on the other hand, uses a different approach. Scratch projects are built by\
    \ selecting and snapping together graphical programming blocks, as demonstrated\
    \ in Figure 1.1.\n\nBy using code blocks in place of complex program text statements,\
    \ Scratch significantly amplifies development while making use of the same basic\
    \ programming logic and concepts implemented in other programming languages. As\
    \ Figure 1.1 demonstrates, each code block represents a different command or action.\
    \ Blocks fit together like pieces in a puzzle. You can only snap blocks in ways\
    \ that make syntactic sense, completely eliminating syntax errors that proliferate\
    \ in other programming languages.\n\nSome code blocks are configurable, allowing\
    \ you to specify things like the number of times an action should execute, text\
    \ that is to be displayed, or the color to be used when displaying something on\
    \ the screen. Despite its use of graphical code blocks, Scratch supports the same\
    \ basic set of programming techniques and constructs as do other traditional programming\
    \ languages. For example, Scratch supports variables, conditional and iterative\
    \ logic, and event-driven programming. Scratch also supports the manipulation\
    \ of graphics and the integration of sound into application projects."
