    # Working with Hat Blocks


    A hat block is a code block with a rounded or curved top and a bump at the bottom,
    visually indicating that it can be snapped on top of other stack blocks. Hat blocks
    provide the ability to create event-driven scripts. An event-driven script is
    one that automatically executes when a specified event occurs. An example of an
    event that can automatically trigger script execution when the user clicks on
    the green flag button. When this event occurs, any scripts that begin with the
    hat block in Figure 3.6 are automatically executed.


    Script execution can also be triggered when the user clicks on a sprite. This
    can be set up by adding the code block shown in Figure 3.7 to the beginning of
    the script.


    # Note


    Every sprite in an application can potentially have its own scripts. You can automate
    the execution of any or all of the scripts using hat blocks. In addition to sprites,
    the stage can also have scripts.


    # Working with Reporter Blocks


    A third type of Scratch code block is a reporter block. A reporter block is a
    code block that has either rounded or angled sides and is specifically designed
    as a mechanism for providing input for other code blocks to process. For example,
    the code block shown in Figure 3.8 is a typical reporter block.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_78_0.png)


