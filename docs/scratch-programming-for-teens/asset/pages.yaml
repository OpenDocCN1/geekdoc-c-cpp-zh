  md: 'scripts belonging to different sprites may best be added to the stage, whereas
    a variable needed only by a specific sprite should be added to that sprite.


    # Assigning Names to Your Variables


    Unlike many programming languages, Scratch is very flexible when it comes to naming
    variables. You can make variable names as long or as short as you want. Variable
    names can include:


    +   - Letters

    - Numbers

    - Special characters

    - Blank spaces


    Because Scratch creates an endless supply of code blocks for each new variable
    that you define, it eliminates any concerns about case-sensitivity, making things
    a lot easier to work with.


    # Tip


    > Make your variable names as descriptive as possible. This will help make your
    scripts self-documenting. Although Scratch variable names can be extremely long,
    it''s a good idea to limit their length to a maximum of 30 characters. This provides
    you with plenty of room to create descriptive, manageable variable names.


    # Understanding Variable Scope


    One very important concept that you need to understand when working with variables
    is variable scope. A variable''s scope identifies the location within an application
    where the variable''s value can be modified. Scratch supports two levels of variable
    scope, as outlined here:


    +   - Local. Variables that can be modified only by scripts belonging to the sprite
    in which the variable is defined.

    - Global. Variables that can be modified by any script in an application.


    # Note


    Although local variables can only be modified by scripts belonging to the sprite
    in which they are defined, their assigned values can be retrieved (not modified)
    by scripts belonging to other sprites using sensing code blocks, as demonstrated
    a little later in this chapter.'
