    value. Next, a check is made to see if the timer’s value has exceeded 30 seconds,
    and if it has, a broadcast message of You win is sent. Once processed by the other
    scripts in the application, the execution of all scripts in the application is
    halted. If, on the other hand, the timer’s value is less than 30 seconds, the
    loop simply executes again. Accordingly, if the cat does not manage to catch the
    ball within 30 seconds, thus ending the game, the fourth script will end the game
    and declare the player to be the winner.'
  merge: -1
