- img_proc: true
  md: '# Creating the Family Picture Movie 227


    As you can see, this script begins by setting the direction of the Line sprite
    and then makes it visible. Next, the Counter variable is assigned a starting value
    of 6, after which a loop is set up to execute five times. Within this loop, a
    second loop executes 36 times (for a total of 360 degrees), rotating the Line
    sprite by 10 degrees and pausing .005 second after each turn. The value assigned
    to Counter is then decremented by a value of -1.


    By the time the outer loop has executed five times, five other application scripts,
    monitoring the value assigned to Counter, are executed. Each of these five scripts
    is responsible for displaying a number on the stage. The end result is an animated
    sequence that emulates the countdown that is often displayed at the beginning
    of old movie reels. Once the countdown has been completed, a second loop executes,
    rotating the Line sprite one final time around the center of the stage. Once the
    last loop has finished, the value of Counter is reset to 6 and pointed back to
    its initial direction. A one-second pause then ensues, and the Line sprite is
    hidden. Lastly, a control block is used to send a broadcast message of Start Movie.
    This broadcast message will be used to trigger the execution of two scripts belonging
    to the Pics sprite, which is responsible for displaying the pictures that make
    up the application''s picture show.


    # Displaying the Numeric Countdown


    As the previous script executes, it modifies the value assigned to the Counter
    variable, changing its value from 6 to 1, one number at a time. Each of the five
    sprites representing the numbers displayed during the opening animation sequence
    is displayed by scripts belonging to those sprites. The scripts belonging to each
    sprite are nearly identical. The following script belongs to the Sprite5 sprite:


    ```

    when clicked

    hide

    repeat 5

    set Counter to [6]

    show

    wait 1 sec

    hide

    ```


    As you can see, it starts executing when the player clicks on the green flag button,
    which begins by making sure that the sprite is hidden from view. The script then
    goes into a loop that waits until the value of Counter is set to 5. Once this
    occurs,'
