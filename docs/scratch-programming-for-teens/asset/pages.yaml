    added to your Scratch application, pausing script execution until the audio file
    has finished playing. Once playback is complete, the rest of the script is permitted
    to finish its execution.


    # Tip


    If you want to add the repeated playback of background music or sound effects
    to an application, create a script specifically for this purpose. This keeps the
    programming logic needed to play the audio file separate from other scripts and
    eliminates the need to pause other scripts'' execution to support audio playback.


    Depending on what your applications are designed to do, there may be times when
    you want to stop the playback of audio files belonging to a sprite or the stage.
