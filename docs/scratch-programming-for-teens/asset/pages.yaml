- img_proc: true
  md: '# Recommended Reading


    ![](img/1b656b54ace8795973817e2c2ac6a41b_322_0.png)


    Figure B.5

    You can download free sprite and sound files from the Scratch Resources website.


    # The Scratch Resources Website


    Another useful website dedicated to Scratch is the Scratch Resources website located
    at http://resources.scratchr.org/pages/, as shown in Figure B.5.

    This sites provides free access to a growing collection of sprite and sound files,
    which you are invited to download for free, provided you reference the Scratch
    Resources website in your Scratch project''s credits. In addition to sprite and
    sound files, you will also find video tutorials designed to help you learn more
    about programming with Scratch.


    # Recommended Reading


    In addition to the websites previously discussed, you can learn a lot about Scratch
    by reviewing documentation available on the web. This documentation is available
    electronically. A brief description of some particularly useful documents, including
    their locations, is listed here.


    +   - Getting Started with Scratch. This 14-page PDF file provides a step-by-step
    guide to Scratch, demonstrating its basic operation and many of its capabilities.
    This document can be downloaded from the Support page at the Scratch website (http://scratch.wik.is/Support).'
  merge: -1
  pgno: 322
- img_proc: true
  md: '+   * **Scratch Reference Guide.** This 17-page PDF file provides detailed
    information about the Scratch graphical interface, its Paint Editor program, and
    a detailed overview of each Scratch blocks. This document can be downloaded from
    the Support page at the Scratch website (http://scratch.wik.is/Support).


    +   * **Getting Started with Scratch Boards.** This nine-page PDF file provides
    an overview of Scratch Boards and detailed explanations of how to work with its
    many different features. It also provides troubleshooting advice. This document
    can be downloaded from the Scratch Board page at the Scratch website (http://scratch.wik.is/Support/Scratch_Board).


    +   * **An Introduction to Scratch.** This online book is available as a Wikibook
    through www.wikipedia.org. At the time of writing, the Wikibook was still a work
    in progress. However, it was already well underway and contained a growing collection
    of programming information about Scratch. This document can be read online at
    Wikibooks by visiting http://en.wikibooks.org/wiki/Scratch/Lessons.'
  merge: -1
