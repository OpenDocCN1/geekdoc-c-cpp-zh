    # Note


    The sensing block shown in the preceding example operates much like the sensing
    code block shown here.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_295_0.png)


    Unlike this code block, which reports on the loudness of the computer''s microphone,
    the sensing code block used in the example retrieves its data directly from the
    Scratch Board''s microphone.


    Using sound as a trigger for script execution, you could, for example, create
    and execute an application that plays an alarm whenever it detects one in your
    room, warning him that his presence has been detected, creating your virtual watch
