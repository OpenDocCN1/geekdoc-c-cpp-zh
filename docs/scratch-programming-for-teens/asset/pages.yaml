- img_proc: true
  md: '# Chapter 8 ■ Doing a Little Math


    ![](img/1b656b54ace8795973817e2c2ac6a41b_181_0.png)


    **Figure 8.1**nThese code blocks provide Scratch programmers with the ability
    to perform arithmetic calculations.


    The use of these code blocks is quite intuitive, with each code block clearly
    identifying its usage. These code blocks can be embedded within any Scratch code
    block that accepts numeric input. For example, the following script demonstrates
    how to use these code blocks to modify the value assigned to a variable named
    Count.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_181_1.png)


    Here, the script begins by assigning an initial value of 10 to Count. Next, four
    sets of code blocks are executed. Each set contains one stack block and two reporter
    blocks. The first set of statements sets the value of Count equal to the value
    currently assigned to Count plus 5, making Count equal to 15. The second set of
    code blocks sets Count equal to the value currently assigned to Count minus 5,
    making Count equal to 10. The third set of code blocks sets Count equal to the
    current value of Count times 5, making Count equal to 10. Lastly, the last set
    of code blocks changes the value of Count to 10 by dividing its current value
    by 5.


    # Understanding the Mathematical Order of Precedence


    As is the case with all programming languages, Scratch allows you to string together
    different combinations of number code blocks in order to create more complicated
    numeric calculations. For example, take a look at the following script.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_181_2.png)


