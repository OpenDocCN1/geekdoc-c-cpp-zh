  md: '# Creating New Sprites Using Scratch''s Paint Editor


    # Working with Button Controls


    As shown in Figure 2.22, Scratch''s Paint Editor program includes a number of
    button controls that can initiate an assortment of different actions.


    The following list identifies each of these buttons and explains its purpose:


    +   - **Import.** Opens an image from a graphic file stored on your computer.


    +   - **Grow.** Increases the size of the drawing canvas, allowing you to focus
    in on a particular area.


    +   - **Shrink.** Decreases the size of the drawing canvas.


    +   - **Rotate counterclockwise.** Rotates the drawing canvas counterclockwise.


    +   - **Rotate clockwise.** Rotates the Drawing canvas clockwise.


    +   - **Flip horizontally.** Flips the drawing canvas horizontally.


    +   - **Flip vertically.** Flips the drawing canvas vertically.


    +   - **Clear.** Clears any graphics currently displayed on the drawing canvas.


    +   - **Undo.** Undoes the last action that you performed in the Paint Editor.


    +   - **Redo.** Redoes the last undone action.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_70_0.png)


    **Figure 2.22** The Paint Editor provides access to key functionality through
    button controls.'
