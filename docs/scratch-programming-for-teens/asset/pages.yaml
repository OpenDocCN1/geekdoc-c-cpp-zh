  md: '# Viewing and Organizing Your Applications Online


    # Viewing and Organizing Your Applications Online


    Any Scratch application projects that you upload to the Scratch website are stored
    on your home page on the website, as demonstrated in Figure 13.8.


    From here you can run your application, post comments for it, add additional tags,
    and create galleries into which to organize your applications. You can also delete
    any projects that you have uploaded and view comments posted by other members
    of the Scratch community.


    # Running Your Application


    Once they are uploaded, you can view and execute your applications online by clicking
    on them. This opens the application and makes it ready for execution, as demonstrated
    in Figure 13.9.


    Once it is opened, you can interact with and run your application in exactly the
    same manner as you did when running it on your local computer. For example, the
    green flag and red Stop Everything buttons are both clearly visible in the upper-right
    corner of the online stage. Once they are started, you can interact with Scratch
    applications using the mouse and keyboard as well.


    # Adding Comments


    You can share additional information about your Scratch application by posting
    comments. To do so, scroll down the screen as demonstrated in Figure 13.10 to
    expose the Add Comment entry field.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_278_0.png)


    Figure 13.8

    Once logged into the Scratch website, you can view, execute, and manage all your
    applications.'
