  md: 'Together, all of the components identified in Figure 2.1 provide a robust and
    powerful, yet initiative and fun, work environment, providing everything needed
    to develop Scratch applications. The rest of this chapter will offer a detailed
    overview of each of the major components that make up the Scratch IDE.


    # Getting Familiar with Menu Bar Commands


    Like most graphic applications, the Scratch IDE has a menu bar made up of a collection
    of buttons located at the top of the IDE, as shown in Figure 2.2.


    These buttons provide access to commands that allow you to create, open, and save
    Scratch projects as well as share them on the Internet, undo previous commands,
    change the language used by the IDE, and more. The following list provides an
    explanation of each of the buttons that make up the menu bar.


    +   * **New.** Creates a new Scratch application project.


    +   * **Open.** Opens an existing Scratch project.


    +   * **Save.** Saves the current Scratch project (with a file extension of .sb).


    +   * **Save As.** Saves the current Scratch project under a new name.


    +   * **Share.** Uploads a copy of the project to the Scratch website (http://scratch.mit.edu)
    where it can be made available for viewing and downloaded by other Scratch programmers.


    +   * **Undo.** Restores the last script, code block, or sprite deleted from the
    application project during the current working session.


    +   * **Language.** Lets you specify the language to be used by the Scratch IDE.


    +   * **Extras.** Displays a popup list from which you can select one of the following
    commands: Import Project, Start Single Stepping, Compress Sounds, or Compress
    Images.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_50_0.png)


    Figure 2.2

    The menu bar provides easy access to commands that you can use to create and save
    Scratch projects.'
