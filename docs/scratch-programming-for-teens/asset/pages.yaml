    # Conditional Programming Logic


    The next set of control code blocks provided by Scratch is shown in Figure 9.6.
    These code blocks allow you to apply conditional programming logic to your scripts.
    Using these code blocks, you can analyze data within your applications and make
    decisions based on this analysis, resulting in the conditional execution of code
    blocks. The key concept to understand when working with these types of code blocks
    is that conditional logic involves an evaluation as to whether a condition is
    true or not. If the condition is true, then the code blocks embedded within the
    control block are executed. However, if the condition analyzed proves false, the
    embedded code blocks are not executed.


    The following script demonstrates how to use the first code block shown in Figure
    9.6 to set up a loop in which execution is controlled by a conditional test. Each
    time the loop repeats, it checks the value assigned to a variable named Counter
    to see if it is equal to 0. If, the loop executes, plays an audio file, pauses
    for two seconds, and then checks to see if it should execute again.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_205_0.png)


