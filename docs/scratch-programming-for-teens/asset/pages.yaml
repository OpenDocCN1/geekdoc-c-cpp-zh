    # Creating Local Variables


    Local variables can be modified only within the sprite in which they are defined.
    The following procedure outlines the steps involved in creating a local variable.


    +   1. Select the sprite (or stage) to which the variable is to be added.

    2. Click on the Variables button located at the top of the blocks palette.

    3. Click on the Make a Variable button.

    4. Enter the name you want to assign to the variable and then select the For Sprite
    Only option, as demonstrated in Figure 7.6.


    Since a local variable can only be modified within the sprite to which it has
    been added, it cannot be modified by scripts belonging to other sprites. If you
    need a variable that can be accessed by any script within an application, create
    a global variable as discussed in the next section.


    # Creating Global Variables


    Unlike local variables, a global variable''s value can be modified by any script
    within the application where it has been defined. You use the exact same procedure
    to create a global variable as you do when creating a local variable, the only
    difference being that you need to leave the default For All Spr option selected
    when naming your variable, as demonstrated in Figure 7.7.


    Tip

    It is considered a good programming practice to restrict the scope of all variables
    to whenever possible. This helps to make your applications easier to maintain
    and eliminates the possibility that you might accidentally modify the variable''s
    value using scripts belonging to other sprites.'
