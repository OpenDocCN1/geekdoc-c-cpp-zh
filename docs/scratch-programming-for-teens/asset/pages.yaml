  md: "# Using the Sensor Block to Interact With Your Scratch Board\n\ncan use either\
    \ of Scratch's two sensing code blocks to interact with the light sensor. To get\
    \ a better feel of how to work with the light sensor, let's modify the previous\
    \ application so that it responds to a change in light in place of the Scratch\
    \ Board's button control. To do so, modify the application's script as shown here.\n\
    \n```\nwhen flag clicked\ngo to x:0 y:0\nforever\n  set sensor value to (light\
