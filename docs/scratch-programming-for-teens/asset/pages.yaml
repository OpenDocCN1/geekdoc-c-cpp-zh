  md: "# Using the Button Control to Initiate Action\n\nIn order to work with the\
    \ Scratch Board's button control, you must use the first sensing code block shown\
    \ in Figure 14.2. Using this code block, you can determine whether the Scratch\
    \ Board's button control is being pressed. As an example, let's create another\
    \ application. By removing the default Cat sprite and then click on the Choose\
    \ New Sprite from File button, drill down into the Things folder, select the basketball\
    \ sprite, and click on OK.\n\nOnce it is added, select the basketball sprite and\
    \ add the following script to it:\n\n```\nwhen green flag clicked\nif <button\
    \ pressed?> then\n  glide .5 secs to x: y:\n  glide .5 secs to x: y:\n```\n\n\
    As you can see, this script begins by positioning the sprite at the center of\
    \ the stage. It then starts a loop to repeatedly execute a conditional code block\
    \ that checks to see if the Scratch Board's button is being pressed. If this is\
    \ the case, the statements located inside the condition code block are executed.\
    \ As a result, the image of the basketball is made to bounce. Figure 14.4 depicts\
    \ how the basketball looks as it begins its upward bounce.\n\nThe basketball will\
    \ repeatedly bounce for as long as the Scratch Board's button is being pressed\
    \ and will stop bouncing as soon as the button is released. Using the previous\
    \ example as a starting point, you should be able to use a Scratch Board's button\
    \ control as an input device for all kinds of Scratch applications. For example,\
    \ you might use it in place of the mouse button as a means of controlling when\
    \ to shoot a missile in a Space Invaders-style game.\n\n# Reacting to Light\n\n\
    In addition to the slider and button control, you can retrieve input from the\
    \ light sensor located on your Scratch Board to provide input to your applications.\
    \ You\n\n![](img/1b656b54ace8795973817e2c2ac6a41b_293_0.png)\n\nFigure 14.4\n\
    Using the Scratch Board's button to control the bouncing of a virtual basketball."
