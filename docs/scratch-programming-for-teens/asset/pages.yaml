  md: '# Debugging Your Scratch Applications 281


    Scratch, Scratch has flagged the script as having a run-time error. The reason
    for the error resides in the Variable code block. As you can see, it includes
    an embedded Numbers block that attempts to divide 10 by 0. However, the division
    of 10 by 0 is an illegal action in all modern programming languages, including
    Scratch.


    The unfortunate thing about run-time errors is that if you do not identify and
    eliminate them during development, you can bet that your users will find them
    for you, which is the last thing any programmer wants to.


    # Debugging Your Scratch Applications


    No matter how carefully you plan out your Scratch scripts, somewhere along the
    line you are going to run into errors. As previously demonstrated, Scratch helps
    locate and identify scripts that contain run-time errors, and while your applications
    are not subject to syntax errors, logical errors can be particularly difficult
    to track down and identify. Fortunately, there are a number of debugging techniques
    that you can employ to help you track down and eliminate problems within your
    application''s scripts.


    # Basic Debugging Techniques


    One of the challenges in debugging a Scratch application is to identify when things
    are happening. Scratch helps simplify this challenge a bit by highlighting scripts
    when they execute. However, the exact activity occurring within a given script
    can be hard to identify. This makes it difficult to determine if things are occurring
    in the order and manner that you intend for them to.


    # Making a Little Noise


    Once way of figuring out what is happening within an application is to embed code
    blocks inside your scripts for the purpose of notifying you when things occur.
    For example, using a sound block you could play a note every time a particular
    variable is updated during the execution of your script. Using this sound as a
    means of keeping track of updates, you could verify that a variable''s value is
    being properly set when testing the application. In testing you do not hear the
    sound played, you know that something is wrong. If the variable you are watching
    is modified in more than one place within a script, or if it can be modified by
    different scripts, you might want to play different notes at each location where
    variable modifications occur. By simply keeping'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# Chapter 15 Finding and Fixing Program Errors


    your ears open when testing the execution of your application, you may be able
    to track down the script or area where the problem lies.


    # Display Informative Messages


    Of course, you do not have to work with sound blocks. If you prefer to, you can
    work with blocks instead. Looks blocks provide the added benefit of using display
    text, which you can use as marker within script execution to let you identify
    exactly when certain parts of a script are executing. For example, you might begin
    each script with a looks block that displays a text message announcing that the
    script is executing and end each script by displaying a closing message. You might
    embed additional blocks at key locations within your script to notify when specific
    things happen. If, for example, when testing an application, a particular text
    message is not displayed when you expect it to be, then you will know where to
    begin looking for the source of the problem.


    # Tip


    If you find that a variable is not being set correctly during script execution,
    you can enable the display of a monitor so that you can keep your eye on the variable''s
    assigned value when testing your application. However, if your application utilizes
    a larger number of variables, displaying lots of monitors can get in the way of
    things. As an alternative, you can keep an eye on the value of a variable by displaying
    it inside a looks blocks, as demonstrated in Figure 15.1.


    ```

    say Total for 2 secs

    ```


    Figure 15.1

    Using a looks block to report on a variable''s assigned value.


    Although not obvious because of the shape of some looks blocks'' input fields,
    you can use them as shown above to display a variable''s value.


    # Slowing Things Down


    Because of the speed at which things tend to happen in many applications, it can
    be difficult to keep track of what is going on. If you are using looks blocks
    to display helpful text messages, you can slow down by pausing script execution
    for a specified number of seconds. Alternatively, you can also slow down by using
    the control block shown in Figure 15.2 to pause script execution.


    By temporarily halting a script, you can give yourself time to check on variable
    values to see if they have been correctly set and poke around at the'
