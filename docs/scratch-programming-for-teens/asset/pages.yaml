  md: '# Referring to Scratch’s Online Help


    One source of help that you can turn to with the click of a button is the Scratch
    Help web page, which you can access by clicking on the Want Help? button located
    at the top of the Scratch IDE. When clicked, Scratch opens your default browser
    and loads the web page shown in Figure 15.4.


    On this web page you will find links to a number of helpful resources, including
    links that let you open Scratch’s Getting Started and Reference Guide manuals
    as well as its support page. The support page contains additional links to online
    videos, Scratch Cards, and other information. Also available on the web page is
    a link labeled Help Screens, which when clicked displays a listing of help screens,
    as shown in Figure 15.5, each of which is designed to teach you how to work with
    an individual Scratch code block.


    The help screens are organized by category. Using links provides at the top of
    the web page, you can jump to specific categories of help screens.


