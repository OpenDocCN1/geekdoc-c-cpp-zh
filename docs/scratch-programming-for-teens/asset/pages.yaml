- img_proc: true
  md: '# Playing Sounds


    To add the playback of music and sound effects to your applications, you need
    to learn how to use the sound code blocks shown in Figure 11.1. These code blocks
    provide everything you need to play or stop the playback of MP3 and wave files
    in your Scratch applications.


    Note


    +   A wave file is a type of file designed for storing an audio bit stream on
    personal computers. Wave files have a .wav file extension. An MP3 file is an audio
    file that utilizes advanced compression technology while retaining high audio
    quality.


    The first two code blocks shown in Figure 11.1 let you play any MP3 or wave file
    that you add to your Scratch project. The third code block stops you the playback
    of all of the audio files belonging to a sprite. In order to play an audio file,
    you must first add it to a sprite or to the stage, which you can do by selecting
