  md: '# CHAPTER 14


    # COLLECTING EXTERNAL INPUT USING A SCRATCH BOARD


    In addition to using Scratch to develop all kinds of games and applications and
    interacting with those games and applications using the mouse and keyboard, Scratch
    is also designed to interact with a special piece of hardware known as a Scratch
    Board. Using a Scratch Board, you can create applications that are capable of
    sensing and collecting real-world input. Scratch Boards come with a number of
    built-in controls, including a slider, a button, and four pairs of alligator clips,
    as well as two sensors that allow it to capture light and sound data. This chapter
    will teach you everything you need to know to work with a Scratch Board, including
    how to install and programmatically interact with it.


    The major topics covered in this chapter include:


    +   - Learning how to purchase a Scratch Board

    - Downloading and installing Scratch Board software

    - Using sensing code blocks to programmatically interact with a Scratch Board

    - Keeping an eye on Scratch Board data using different types of monitors'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Interacting with the Real World


    A Scratch Board is a specialized piece of hardware, shown in Figure 14.1, which
    you can purchase directly from the Scratch website and attach to your computer
    via a USB connection. Once a Scratch Board is connected to your computer, your
    Scratch applications can begin collecting, processing, and responding to different
    types of real-world data, collected by the Scratch Board''s built-in set of sensors
    and controls.


    Scratch Boards come equipped with a number of controls and sensors; their functions
    are outlined here:


    +   - Slider. Detects the current position of the Scratch Board''s slider control.


    +   - Light Sensor. Detects the amount of light that is currently visible through
    the Scratch Board''s light sensor.


    +   - Button. Returns a value of true or false, depending on whether the Scratch
    Board''s button is being pressed.


    +   - Sound Sensor. Detects the loudness of sounds through the Scratch Board''s
    sound sensor.


    +   - Alligator Clips. Provides a measurement of the electrical resistance in
    a circuit.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_289_0.png)


    Figure 14.1

    Scratch Boards allow your applications to incorporate external input into your
    applications.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Installing Your Scratch Board 269


    The rest of this chapter is dedicated to teaching you how to install and interact
    with a Scratch Board. In doing so, you will be able to incorporate a whole new
    range of input into your applications, using for example variations of light and
    sound to control the execution.


    # Tip


    In addition to the information provided in this chapter, you can learn more about
    Scratch Boards by visiting http://scratch.wik.is/Support/Scratch_Board. Among
    the items on this web page you will find a link to a small Getting Started with
    Scratch Boards PDF manual, which provides a number of excellent example scripts
    that demonstrate how to interact with and use input colors and reported by Scratch
    Boards.


    # Buying a Scratch Board


    Scratch Boards can only be purchased from the Scratch website. At the time this
    book was written, the price of a Scratch Board was $25, along with an additional
    $5 charge for shipping and handling. To verify the current price of a Scratch
    Board, visit http://scratch.wik.is/Support/Scratch_Board/Pricing_information.
    To order a Scratch Board, go to https://scratch.media.mit.edu/pages/scratchboard-purchase
    and fill out the required form.


    # Installing Your Scratch Board


    Installing a Scratch Board on your computer is a relatively quick and easy process
    and begins with downloading the software driver. Two different types of software
    driver are available, one for Microsoft Windows and for Mac OS X. To download
    the drivers for your computer, go to http://scratch.mit.edu/pages/scratchboardset
    and click on one of the following links (Windows Vista users can skip this step
    because your computer should automatically install the needed software driver):


    Once you have downloaded the appropriate software driver for your computer, you
    need to install it. On Microsoft Windows this means extracting the installation
    program from the Zip file, double-clicking on it, and then following the instructions
    that are provided.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Chapter 14 ■ Collecting External Input Using a Scratch Board


    For Mac OS users, installing Scratch’s software drivers involves opening the file
    that is downloaded and double-clicking on the .dmg file that is stored inside.
    This displays a .pkg program, which when double-clicked executes the driver installation
    process. Click on Continue to begin the installation process and then follow the
    instructions that are presented.


    Once you have installed the software driver on your computer, connect the USB
    portion of the cable that came with your Scratch Board to your computer''s USB
    port and then connect the serial portion of the cable to your Scratch Board. At
    this point your Scratch Board should be ready to use.


    # Using the Sensor Block to Interact with Your Scratch Board


    In order to programmatically interact with a Scratch Board, you need to work with
    the two sensing code blocks shown in Figure 14.2.


    The first code block shown in Figure 14.2 returns a range of data, from 1 to 100,
    for the selected Scratch Board sensor. In addition, you can select this code block''s
    check box to enable the display of a monitor on the stage, allowing you to keep
    track of the data that the sensor is returning. This code block works with the
    slider, light, sound, and all four of the resistance controls (alligator clips).


    The second code block shown in Figure 14.2 returns a value of true or false, depending
    on whether the Scratch Board''s button control has been pressed or one of the
    resistance controls has been used to establish an electrical connection (the alligator
    clips are connected to one another).


    Examples of how to work with both of these sensing code blocks to receive data
    collected by each of the Scratch Board’s sensors and controls are provided throughout
    the rest of this book.


    # Collecting Input Using the Slider Control


    In order to work with the Scratch Board’s slider control, you must use the first
    sensing code block shown in Figure 14.2. This means dragging and dropping an


    ![](img/1b656b54ace8795973817e2c2ac6a41b_291_0.png)


    Figure 14.2

    Access to a Scratch Board is provided through these two sensing code blocks.'
