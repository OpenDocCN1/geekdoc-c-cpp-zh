  md: '# CHAPTER 10


    # CHANGING THE WAY SPRITES

    LOOK AND BEHAVE


    By its very nature, Scratch lends itself to the development of graphical applications
    that involve the manipulation of sprites. This includes taking actions that affect
    the appearance and behavior of both sprites and the stage background. Sprite and
    background appearance and behavior can be controlled using code blocks. Looks
    code blocks can be used to affect sprite appearance through the application of
    special effects, to make sprites visible or invisible as applications execute,
    and even to change sprite costumes and stage backgrounds. This chapter offers
    an in-depth overview of all of Scratch’s stage code blocks and will guide you
    through the creation of your next Scratch project, the Crazy Eight Ball game.


    The major topics covered in this chapter include:


    +   - Learning how to programmatically change a sprite’s costume


    +   - Learning how to display text in speech and thought bubbles


    +   - Discovering how to apply a range of special graphical effects to sprites


    +   - Learning how to change a sprite’s size


    +   - Making sprites appear and disappear during application execution


    +   - Specifying how sprites that overlap one another should be displayed'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Changing Sprite Costumes and Backgrounds


    Depending on whether you have selected a sprite''s thumbnail list, several different
    code blocks are displayed when you look at Scratch''s looks blocks in the blocks
    palette. For starters, the first three code blocks are different, as shown in
    Figure 10.1.


    Both sets of code blocks have similar tasks, with one set focusing on working
    with sprite costumes while the other set is focused on working with the stage''s
    background.


    # Changing Sprite Costumes


    Every sprite that is added to a Scratch application is capable of changing its
    appearance by changing its costume. Sprites can be assigned any number of costumes
    and switch between them at any time. To add a costume to a sprite, all you have
    to do is select the sprite''s thumbnail, click on the Costumes tab located at
    the top of the scripts area, and then click on the Import button. This opens a
    window that allows you to locate and select a graphic file to be used as a new
    costume for the sprite.


    Every costume that is added to a sprite is automatically assigned a number and
    a name (based on the graphic''s filename). The first costume in the costume list
    represents the sprite when the application is started. However, using drag and
    drop, you can rearrange the order in which costumes are listed. In addition, using
    the first looks block shown in Figure 10.1, you can programmatically replace a
    sprite''s current costume by specifying the name of a different costume. For example,
    the following script demonstrates how to use this code in a loop to repeatedly
    change a sprite''s costume 10 times at half-second intervals. The result is the
    generation of animation that makes it look like the bat is flying.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_219_0.png)


    Figure 10.1 The code blocks on the left are displayed when you are working with
    a sprite, and the code blocks on the right are displayed when you are working
    with the stage.'
