    Most of the commands listed above are self-explanatory. However, the last three
    commands merit additional explanation. When clicked, the Language button displays
    a menu of programming languages from which you can select. Depending on the language
    selected, a complete translation may be available. In other cases, only scripts
    and code blocks may be translated.


    # Tip


    You can display a tool tip for any of the button controls shown on the Scratch
    IDE by moving the mouse pointer over the button.


    When clicked, the Extras button displays a menu that has the following options.


    +   - About. Displays a popup window that provides information about the version
    of Scratch being used.


    +   - Import Project. This command imports all of the sprites and backgrounds,
    along with any related scripts, from the specified project into the current project.
    As such, this command makes the sharing and movement of sprites and backgrounds
    between Scratch projects a snap.


    +   - Start Single Step. This command tells Scratch to execute an application
    step at a time, allowing you to observe the execution flow of code blocks. This
    command will be discussed more thoroughly in Chapter 15, “Finding and Fixing Program
    Errors.”


    +   - Compress Sounds. This command compresses any sound files used by the current
    application project to reduce the project’s size. This is important because the
    Scratch website imposes a 10MB limit on the size of Scratch applications.


    +   - Compress Images. Like the Compress Sounds command, this command compresses
    any graphic image files used by the current application project to reduce the
    project’s size. By compressing the size of your application, you can sometimes
    reduce large Scratch projects enough to allow them to upload.'
