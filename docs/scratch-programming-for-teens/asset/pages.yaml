  md: '# Working with Motion Code Blocks


    To move sprites around the stage when your Scratch applications execute, we need
    to learn how to work with motion code blocks. As previously stated, motion blocks
    control sprite placement, direction, rotation, and movement. In total, Scratch
    provides access to 16 different motion blocks, which you can work by clicking
    on the Motion button located at the top of the blocks palette and dragging and
    dropping motion blocks onto the scripts area, where you can configure and use
    them in creating scripts.


    If you look closely at the various motion code blocks, you will notice that Scratch
    organizes them into six subgroups, each of which is separated by a blank space
    in the blocks palette. These sub groupings include:


    +   - Motion blocks that move and rotate sprites


    +   - Motion blocks that point sprites in different directions or towards objects


    +   - Motion blocks that change a sprite''s location and control whether a sprite
    jumps to its new location or glides to it


    +   - Motion blocks that change a sprite location by setting or modifying the
    value of its X-axis and Y-axis coordinates


    +   - A motion block that controls a sprite''s movement when it touches the edges
    of the stage


    +   - Motion blocks that report on a sprite''s position and direction


    Examples of how to work with the motion code blocks in each of these subgroups
    are provided throughout the rest of this chapter.


    # Moving and Rotating Sprites


    Scratch provides access to three motion blocks that move sprites and rotate on
    their axis. These code blocks are shown in Figure 5.1.


    The first of these blocks allows you to specify the number of steps that a sprite
    should be moved on the stage (in whatever direction the sprite is currently pointing).
    By default, the code block specifies a value of 10. However, you may'
