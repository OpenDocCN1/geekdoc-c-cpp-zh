  md: '# Step 6: Saving and Executing Your Scratch Project


    Assuming you have followed along carefully with the instructions that have been
    provided, your copy of the Family Picture Movie should be ready for testing. If
    you have not already saved your new application, do so now. When you are ready,
    click on the green flag button to run the application and watch the movie. In
    the event that you run into any problems, go back and recheck your work against
    the instructions outlined in this chapter.


    # Summary


    The addition of sound playback is fundamental to the operation of many Scratch
    applications. In Scratch, sound effects and music playback are controlled through
    different sound code blocks. Using these code blocks, you can convey additional
    meaning and enhance excitement when your applications run. This chapter provided
    instruction on how to work with all of Scratch’s sound blocks and to use them
    to play audio files, drum notes, and musical notes. You also learned how to change
    the tempo at which drums and notes are played; control the volumes at which audio
    files, notes, and drum beats are played; and select different types of drums and
    instruments to be played.'
