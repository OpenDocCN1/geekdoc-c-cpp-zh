  md: '# CHAPTER 13


    # SHARING YOUR SCRATCH PROJECTS OVER THE INTERNET


    Scratch''s slogan is "Imagine, Program, Share." As the slogan implies, sharing
    is a big part of Scratch. The Scratch website is specifically designed to facilitate
    sharing and to promote the development of a large global community of Scratch
    programmers. By sharing ideas and projects with other Scratch programmers, you
    not only help others to learn but you increase your own knowledge and experience
    as well. This chapter will teach you everything you need to know about how to
    upload, manage, and share your Scratch applications on the Scratch website, helping
    you to become an active member of Scratch''s global community.


    The major topics covered in this chapter include learning how to:


    +   - Register a new account at the Scratch website

    - Upload your Scratch applications

    - Delete applications that you have uploaded

    - Post comments and add tags to your uploaded applications

    - Create galleries in which you can store and organize your applications


    # Running Scratch Applications on the Internet


    Scratch is all about learning and sharing. The Scratch website (http://scratch.mit.edu)
    is specifically designed to facilitate both of these objectives, making it easy
    for you to upload and run your Scratch applications online and'
