  md: '# Chapter 15 ■ Finding and Fixing Program Errors


    By breaking down a script like the one in Figure 15.3 into multiple parts, you
    can double-click on each part and examine its effects on your application. Should
    something unexpected occur, you will know exactly which part of your script to
    focus on to find the source of an application''s problem.


    # Making Liberal Use of Monitors


    Another important source of information at your disposal that you can use when
    debugging your application is code block monitors. By temporarily enabling the
    display of monitors when testing your applications, you can keep track of key
    data used by your applications. Once you are done testing, you can disable the
    display of any monitors that you do not need to display as part of the normal
    operation of the application.


    # Running Your Application in Single Stepping Mode


    In addition to all of the debugging techniques discussed above, Scratch provides
    one additional debugging tool, known as *single stepping*. When you run an application
    using single stepping mode, Scratch slows down the speed at which your application
    executes, making it easier for you to monitor execution flow.


    Normally the Scratch IDE highlights an entire script with a white outline when
    it executes. But when run in single stepping mode, Scratch also highlights individual
    code blocks as they execute. As your applications execute in single stepping mode,
    you can monitor their execution flow to determine if things are executing in the
    proper order.


    # Note


    You can control the speed at which your application executes by pressing the Shift
    key and left-clicking on the Extras button, then clicking on Set Single Stepping
    from the popup menu that appears. This displays a list of options to control single
    stepping execution speed. These choices include:


    +   * Turbo Speed

    * Normal

    * Flash blocks (fast)

    * Flash blocks (slow)'
