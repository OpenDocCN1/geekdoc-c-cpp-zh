  md: '# CHAPTER 15


    # FINDING AND FIXING PROGRAM ERRORS


    Compared to most programming languages, Scratch is less prone to many types of
    programming errors, often referred to as bugs. As a programmer, your job is to
    seek out and remove all of the programming bugs from your applications and to
    ensure that they operate as they are supposed to. That''s where this chapter comes
    in. By the time you are done reading it, you will have a solid understanding of
    the types of errors that Scratch is susceptible to and the basic steps involved
    in tracking down and fixing them. In addition, you will learn about different
    resources that you can turn to in order to get help.


    The major topics covered in this chapter include:


    +   - Understanding the differences between syntax, logical, and run-time errors


    +   - Learning how to run applications in single stepping mode


    +   - Accessing code block help


    +   - Getting help from the Scratch global community


    # Dealing with Application Errors


    Program errors, sometimes referred to as bugs, are a programmer''s number one
    problem. Errors can occur for a number of different reasons and can cause your
    applications to misbehave or prevent them from executing at all. As your projects
    inevitably get larger and more complex, the possibility and frequency of errors
    also increase. That''s just the way it is.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Chapter 15 ■ Finding and Fixing Program Errors


    The goal of this chapter is to help you gain an understanding of the different
    types of errors that you will run into and provide you with guidance on how to
    go about locating and eliminating them from your applications. Some errors are
    easy to find, especially in small scripts, while others can be quite challenging
    to locate and often can only be found through intense testing and debugging.


    Fortunately, there are steps that you can take to reduce the number of errors
    that occur in your applications. For starters, take a little extra time to plan
    out the design of your applications rather than making things up as you go. Another
    important step is to create your application scripts a few code blocks at a time,
    frequently testing as you go along, rather than waiting until your entire application
    has been built to see how things work. In addition, you should set aside a little
    extra time at the end of the development process just for testing your applications
    and making sure that they not only meet your expectations but do so without generating
    any errors.


    In addition to the programming practices discussed above, there are a number of
    other steps that you can take to make sure your Scratch applications work like
    you want them to. These steps include:


    +   - Taking a little extra time to carefully design and lay out your application’s
    interface


    +   - Ensuring that provide clear instructions on how to properly work with your
    application


    +   - Creating descriptive names for all application variables


    +   - Renaming all the sprites, sounds, and costumes used in your application
    to make them more intuitive to work with


    +   - Breaking down programming logic into a number of manageable small scripts
    as opposed to a few really large ones


    Unfortunately, no matter how much you try, you can never avoid all of the different
    types of errors that Scratch applications are susceptible to. Broadly speaking,
    most programming languages are susceptible to the following types of errors:


    +   - Syntax errors


    +   - Logical errors


    +   - Run-time errors


    Each of these three types of errors is discussed in the sections that follow.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Dealing with Application Errors


    # Understanding Syntax Errors


    One of the things that makes Scratch unique among programming languages is the
    way it prevents syntax errors. A syntax error is an error that occurs when a programmer
    fails to write code statements in a manner that follows the syntax rules specified
    by the programming language. Scratch code blocks are designed to fit together
    in logical ways like pieces in a puzzle. Scratch only allows you to snap blocks
    in ways that make syntactic sense. As a result, Scratch eliminates syntax errors
    that proliferate in other programming languages.


    # Keeping an Eye Out for Logical Errors


    One category of errors you need to worry about regardless of the programming language
    you are working with logical errors. A logical error is an error that occurs because
    of a mistake on your part in the implementation of the programming logic you applied
    to solving a problem or performing task. For example, suppose you had an application
    that needed to add two numbers together, but when you assembled the programming
    logic you accidentally subtracted one number from another. As a result, your application
    will not run correctly. From Scratch''s perspective, everything would be fine,
    since there technically no problem with the logic you implemented. As soon as
    you see that the results tallied by the application are not correct, you should
    immediately suspect that you have a logical error to debug.


    As another example of a logical error, consider the following pair of scripts,
    which belong to an application that uses the default sprite to display text messages
    that are supposed to count from 1 to 5.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_300_0.png)'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Chapter 15 ■ Finding and Fixing Program Errors


    Both scripts begin their execution when the green flag button is clicked. When
    this happens, the first script assigns a starting value of 0 to a variable named
    Counter and then goes into a loop that has been set up until the value of Counter
    is equal to 5. When this occurs, the sprite is made to display a message, and
    then all script activity within the sprite is halted.


    The second script is responsible for making the sprite count from 1 to 5, incrementing
    the value of Counter each time the sprite says a number. If you were to run this
    example, you would see that it is currently written, it has a logical error. Specifically,
    the second script loop was accidentally set up to run four times instead of five
    times. As a result, the sprite only counts from 1 to 4, and since the value of
    Counter never reaches 5, the first script gets stuck in its loop. Only by fixing
    the loop in the second script (so that it executes five times) can this logical
    error be fixed.


    The best way to identify logical errors is to take a little extra time to plan
    out the design of your applications and to test them extensively, ensuring that
    they run exactly as you expect them to. If, despite your best efforts, a logical
    error manages to make its way into your program logic, hope is not lost. Using
    the debugging techniques discussed later in this chapter, you should be able to
    track down and eliminate all of the errors from your Scratch applications.


    # Tracking Down Run-Time Errors


    A third category of errors that plagues all programming languages, including Scratch,
    is run-time errors. A run-time error is an error that occurs when a Scratch script
    attempts to perform an illegal action. Scratch automatically identifies run-time
    errors when they occur by surrounding the script where the error occurred with
    a red outline. Depending on how your applications are designed, it is entirely
    possible that you might be able to run them over and over again without ever executing
    the script in the application a run-time error lies. This is why it is so important
    that you thoroughly test the execution of every script in your applications. Failure
    to do so leaves you to run-time errors.


    As an example of what a run-time error looks like when reported by Scratch, take
    a look at the following script.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_301_0.png)'
