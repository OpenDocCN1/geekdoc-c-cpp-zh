- img_proc: true
  md: '# Getting to Know Scratch


    With traditional computer and Internet applications, users are limited to working
    with applications in the way the programmers who developed the applications designed.
    Scratch turns things around by letting users become programmers needs of young
    people between 8 and 16, helping to introduce them to computer technology and
    to improve their learning skills while at the same time facilitating creativity
    and personal expression.


    Many people regard computer programming as a mysterious and complex process that
    requires advanced technical training and education. This is a misconception. Programming
    languages like BASIC have been around for decades and were developed expressly
    for the purpose of teaching first-time programmers how to program. In recent years,
    a new crop of programming languages has appeared, specifically geared towards
    helping children and students learn to program. One of the best and newest of
    these languages is Scratch.


    Scratch is a visual programming language that is made up of a graphic interface
    that supports application development in which new projects are created by mixing
    images, sound, and video under the control of scripts, which specify the application’s
    programming logic. Scripts are created by snapping blocks together, much in the
    same way that Lego blocks are snapped together to create all sorts of unique creations.
    Each block represents a different command or action that tells the application
    how to execute. Scratch also provides programmers with access to all kinds of
    media, including graphics and sounds as well as tools that can be used to create
    new graphics and sound files.


    # Note


    Scratch is also being installed on all XO laptops, as part of the One Laptop Per
    Child Project, which is a program designed to produce and distribute inexpensive
    laptop computers to children in developing countries around the world to help
    their education and unlock their potential.


    Scratch is an interpreted programming language. This means that application projects
    are not precompiled (turned into executable code that can be run as a stand-alone
    application) before their execution. Instead, the code blocks that make Scratch
    application projects are interpreted and processed each time the application project
    is executed. Scratch is also a dynamic programming language.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Getting to Know Scratch


    It allows changes to be made to application projects even while the projects are
    executing. As such, Scratch lets programmers experiment by making application
    changes on the fly in order to see what effect of the changes may have on the
    application''s execution.


    # Imagine—Program—Share!


    Scratch''s slogan is Imagine—Program—Share! It is designed to encourage teens''
    creativity by providing them with an easy to learn yet powerful programming environment
    in which they can unleash the power of their imagination. Scratch encourages and
    facilitates the development of application projects using a mixture of media,
    graphics, sound, and video in order to create something new.


    Scratch provides new programmers with everything needed to create and execute
    new application projects. Its programming language is designed to make it as easy
    as possible for new programmers to jump in and get their feet wet and receive
    immediate feedback on their progress. Scratch promotes an understanding of programming
    concepts, including conditional and iterative logic, event programming, the use
    of variables, mathematics, and the use of graphics, and sound effects. By learning
    to program with Scratch, new programmers develop an understanding and appreciation
    of the design process, from idea generation to program development, then testing
    and debugging and the incorporation of user feedback.


    People, especially kids, love to share, as demonstrated through the amazing success
    of websites like YouTube, which allows people to share home video. Sharing is
    a fundamental part of the Scratch programming experience. Scratch application
    projects can not only run on the programmer''s desktop but can also be uploaded
    to the Scratch website, where they can be viewed, executed online, and commented
    on by other Scratch programmers from around the world. By posting their Scratch
    application projects on the Scratch website, kids share their experiences and
    learn from one another and gain gratification and confidence from the experience.


    # Hint


    To share an application project, Scratch programmers must provide the source code
    that makes the application work. There is no way to keep the source code hidden.'
  merge: -1
