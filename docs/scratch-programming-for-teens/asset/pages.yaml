    # Setting and Changing Tempo


    The last three looks provided by Scratch are shown in Figure 11.10. Using these
    blocks you can set, change, and report on the tempo at which drum beats and musical
    notes are played.


    The first code block shown in Figure 11.10 changes the tempo to play a drum or
    note. Tempo is a measurement of the speed, in beats per minute, which a drum or
    note is played. The larger the tempo value, the faster the drum or note is played.
    The second code block lets you set the tempo used to play a drum or note to a
    specific number of beats per second. Using the third code block, you can retrieve
    a sprite''s assigned tempo and optionally display this value in a monitor on the
    stage.


