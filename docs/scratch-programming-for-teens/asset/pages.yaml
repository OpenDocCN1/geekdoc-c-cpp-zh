  md: '# Three Basic Types of Scratch Blocks


    Scratch applications are made up of sprites that interact with one another and
    the user. Sprites are controlled and animated by scripts. Sprites can have any
    number of scripts, each of which is designed to perform a specific task or action.
    Scripts are made up of one of more Scratch code blocks. In total, there are more
    than 100 different Scratch blocks, each of which is designed to fulfill a specific
    purpose. These blocks can be broadly classified into three categories, as outlined
    here:


    +   - Stack blocks

    - Hat blocks

    - Reporter blocks


    # Working with Stack Blocks


    The majority of code blocks provided by Scratch are stack blocks. Stack blocks
    are code blocks with a notch at the top or a bump at the bottom. The notches and
    bumps serve as visual indicators that identify how the blocks can be snapped together
    to create programming logic. Figure 3.2 shows an example of a typical stack block.


    The notch on the top sides indicate that the code block can be attached to the
    underside of another code block. The bump at the bottom of the code block allows
    other code blocks to attach to its underside. Figure 3.3 shows an example of another
    stack block. This block will repeatedly execute any code blocks that you choose
    to embed inside it for as long as a tested condition evaluates as true.


    # Note


    > You will learn about the application of repetitive and conditional programming
    logic in Chapter 9.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_76_0.png)


    Figure 3.2

    An example of a code block that is used to halt the playback of an audio file.


    ```

    repeat until

    ```


    Figure 3.3

    This code block allows other stack blocks to be embedded within it.'
