    # Deleting Variables When They Are No Longer Needed


    Over time, you may find yourself making numerous changes to your Scratch projects.
    As you do, you may find that certain variables are no longer needed by your applications.
    If this is the case, you can clean up your applications by deleting these variables
    from your projects. Doing so is very easy: First, make sure that any references
    to the variable within your application''s scripts have been removed and then
    click on the Delete a Variable button, and select the variable that you want to
    delete. In response, Scratch Figure 7.8, and delete the variable from the sprite
    to which it was added.


    # Caution


    If you delete a variable from a sprite without removing references to the variable
    in the sprite''s scripts, Scratch will delete the variable but will leave in place
    any code blocks in the application''s scripts that reference that variable. As
    a result, things will not work properly.


    # Accessing Variables Belonging to Other Sprites


    Although data stored in local variables can only be changed by scripts belonging
    to the sprite to which the variables have been assigned, Scratch allows scripts
    belonging to other sprites to view data stored in variables belonging to other
    sprites. To view data stored in another sprite''s local variables, you need to
    use the sensing block shown in Figure 7.9.'
