    # Trick


    While Scratch only supplies you with three code blocks for performing conditional
    tests (equality, greater than, and less than), most programming languages support
    three additional types of conditional tests, allowing you to perform the following
    comparison operations:


    +   - Greater than or equal to


    +   - Less than or equal to


    +   - Not equal to


    Although Scratch does not provide equivalent code blocks, you can easily set up
    equivalent comparison tests by combining the three code blocks just discussed
    with Scratch''s logical comparison code blocks, as shown in Figure 8.5.


    The first combination of code blocks shown in Figure 8.5 creates a test that determines
    if the value assigned to a variable named Total is less than or equal to 10. This
    example is made up of five code blocks—two variable blocks, two number code blocks
    used to perform less than and equality comparisons, and another number block,
    which is used to tie everything together. The second combination of code blocks
    shown in Figure 8.5 is very similar and is designed to create a test that checks
    if the value assigned to Total is greater than or equal to 5. The last example
    is made up of three code blocks and is used to evaluate the values assigned to
    Total to determine if it is not equal to 3. You will learn more about code blocks
    that support logical comparisons in the next section.


