  md: '# Determining What Happens when Two Sprites Overlap


    The last Scratch looks code blocks, shown in Figure 10.11, specify what happens
    when all or part of a sprite is covered by another sprite.


    In Scratch, each sprite that you add to an application is assigned to a layer.
    For example, suppose you create an application with multiple sprites. When you
    add the first sprite to the application, it is placed at the topmost layer. When
    you add the application''s second sprite, it gets added to the top layer, and
    the previous sprite gets moved back one layer. Each additional sprite starts off
    on the top layer and stays there until you either add new sprite or until you
    click on one of the sprites that was previously added, which moves the selected
    sprite back to the topmost layer.


    By default, the first sprite would be placed on the top layer. The second sprite
    added to the application would be placed on the second layer, and the third sprite
    would be placed on the third layer.


    Understanding the layer on which a sprite has been placed is important because
    the sprite''s layer assignment determines whether it remains on top or is displayed
    underneath another when they overlap one another. Sprites at higher levels remain
    on top of sprites at lower levels.


    # Note


    To better understand the importance of layers, consider what happens when you
    place five pieces of paper on top of one another on a desk. The piece of paper
    sitting on top (at the top layer) is visible, and your of the other pieces of
    paper is obstructed. Now, reach into the middle of the stack of paper, pull out
    a sheet, and place it on top of all the other pages. By altering the page''s layer
    position, you have made it visible.


    In addition to controlling what happens to sprites by adding them to applications
    in a specific order, controlling their layer position, you can use the code blocks
    shown in Figure 10.12 to programmatically control a sprite layer location. For
    example, using the first code block, you can move a sprite to the top layer, ensuring
    that it remains visible at all times, even when other sprites come into contact
    with it.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_227_0.png)


    Figure 10.11

    With these code blocks, you can determine what happens when two sprites overlap.'
  merge: -1
  pgno: 227
