  md: '# CHAPTER 6


    # SENSING SPRITE POSITION AND CONTROLLING ENVIRONMENTAL SETTINGS


    To create many interactive computer applications, you need the ability to detect
    when certain things are happening. For example, in a car racing game, it would
    be important to be able to detect when two cars (sprites) bump into one another,
    and in a game that uses predefined keystrokes as input for controlling certain
    game functions, you need to be able to detect when those keys have been pressed.

    Scr provides the ability to detect or sense when things happening using sensing
    code blocks. This chapter will demonstrate how to work with various sensing blocks
    and will also guide you through the creation of a new Scratch application, the
    Family Scrapbook.


    The major topics covered in this chapter include learning how to


    +   - Detect mouse-pointer location and mouse button status

    - Detect when keyboard keys are pressed

    - Determine when a sprite collides with other objects on the stage

    - Keep track of a sprite’s distance from other objects and retrieve different
    sprite properties

    - Work with a timer and detect the loudness of microphone input'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Working with Sensing Code Blocks


    An important capability needed a graphical programming language that works with
    sprites is the ability to determine when certain things happen. For example, sprite-based
    applications typically need to know when sprites collide with one another or when
    the user presses certain keystrokes. This type of functionality is provided in
    Scratch by sensing blocks.


    Sensing blocks also provide the ability to determine the location of the mousepointer
    and the ability to determine a sprite''s distance from other sprites. Sensing
    blocks are colored sky blue. In total, Scratch provides access to 15 different
    sensing blocks, which you can work with by clicking on the Sensing Button located
    at the top of the blocks palette.


    Scratch organizes sensing blocks into eight sub-groupings, each of which is separated
    by a blank space in the blocks palette. These sub-groupings include:


    +   - Sensing blocks that retrieve and report on the left mouse button status
    and mouse-pointer coordinates.


    +   - A sensing block that determines when specified keyboard keys have been pressed.


    +   - Sensing blocks that determine if a sprite has made contact with the mouse-pointer,
    another sprite, or the edge of the stage.


    +   - A sensing block that reports on a sprite''s distance from the mousepointer
    or another sprite.


    +   - Sensing blocks that provide access to a built-in timer that can be used
    to control the timing of application activity.


    +   - A sensing block that retrieves a property value (X position, Y position,
    direction, costume number, size, or volume) for the stage or a specified sprite.


    +   - Sensing blocks that report on how loud audio input coming from the computer''s
    microphone is.


    +   - Sensing blocks that work with a Scratch Board, allowing you to create applications
    that can detect changes in light and sound and work with the Scratch Board''s
    buttons and slider control.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Retrieving Mouse Button and Coordinate Status


    Except for the reset timer code block, all sensing code blocks are reporter blocks,
    designed to be embedded inside stack blocks. Examples of how to work with each
    of the sensing code blocks listed above are provided throughout the rest of this
    chapter.


    # Retrieving Mouse Button and Coordinate Status


    In many types of applications, the mouse-pointer is used to control the movement
    of sprites and to affect the operation of the application in many other different
    ways. The sensing blocks shown in Figure 6.1 provide access to data about the
    operation of the mouse-pointer.


    The first of these three code blocks retrieves the location of the mouse-pointer
    as it moves along the X-axis. As was stated in Chapter 2, “Getting Comfortable
    with the Scratch Development Environment,” Scratch supports a total range of –240
    to 240. The second of these code blocks retrieves the location of the mouse-pointer
    as it moves along the Y-axis. Scratch supports a total range of 180 to –180 on
    its Y-axis. The third code block is used to retrieve a true/false value that identifies
    when the mouse’s button is being pressed. The following script, which is part
    of a drawing application, demonstrates how to work with all three of these sensing
    code blocks.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_142_0.png)


    ![](img/1b656b54ace8795973817e2c2ac6a41b_142_1.png)


    Figure 6.1 These sensing blocks report on the mouse-pointer’s coordinates and
    button status.'
