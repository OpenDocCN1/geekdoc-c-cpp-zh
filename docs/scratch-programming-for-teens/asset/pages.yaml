    interacts with the application using the keyboard or mouse. Data may be generated
    by your applications such as you create a Scratch project that generates and then
    uses random numbers (covered in Chapter 8). Data may also be hard-coded within
    your Scratch application projects. For example, the code block shown in Figure
    7.1 can be used to store and display a text string within a script.


    When executed, a script containing this looks block will display the hardcoded
    text string inside a voice bubble. Like most programming languages, Scratch lets
    you work with a number of different types of data. Each of these different types
    of data, listed next, is handled differently by Scratch.


    +   - String

    - Boolean

    - Integer

    - Real


    A string is a piece of text data that you hard code within Scratch applications
    using different types of looks code blocks, which you will learn to work with
    in Chapter 10, “Changing the Way Sprites Look and Behave.” Boolean data is automatically
    generated by Scratch when you work with different types of numbers code blocks
    (which you will learn about in Chapter 8). A Boolean value represents data that
    has an assigned value of either True or False. For example, any time you compare
    one numeric value against another to see if they are equal, Scratch returns a
    Boolean value. Based on the result of that analysis, you can alter the way your
    own execute using control blocks, which are covered in Chapter 9, “Conditional
    and Repetitive Logic.”


    An integer is a numeric value that does not include a decimal point (sometimes
    referred to as a whole number). Scratch lets you enter integers as input into
    numerous different types of code blocks. It also allows you to store numeric data
    inside variables, allowing you to store, retrieve, and manipulate the data as'
