  md: '# WHAT’S ON THE COMPANION CD?


    As you continue to learn more about Scratch and improve your programming skills,
    it helps to have access to a good collection of source code that you can reference.
    This book has provided you with numerous sample Scratch projects. By studying
    these projects, you can learn a lot about how to program. You can also use this
    book to find working examples of how to perform different types of tasks and use
    them as the basis for creating new Scratch application projects. This will not
    only save you time, but it will also keep you from having to re-invent the wheel
    and let you keep your focus on tackling new programming challenges.


    If you have been, faithfully re-creating all of the Scratch application projects
    presented in this book, you already have access to such a collection of sample
    projects. However, if you skipped around a bit, then you may have missed a few
    sample projects. You will be happy to know that all of the sample Scratch projects
    covered in this book are available at your fingertips on this book’s companion
    CD.


    # Scratch Project Source Code


    You will find copies of the source file for all of the Scratch projects developed
    in this book on the companion CD. You will also find copies of any custom graphics
    and audio files required to build projects. Table A.1 provides a complete list
    of each of the Scratch project source code files that you will find on the CD.'
