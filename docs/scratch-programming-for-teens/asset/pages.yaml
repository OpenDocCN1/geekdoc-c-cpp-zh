    # Running Applications in Presentation Mode


    As you saw in Chapter 1 when you created the Hello World project, Scratch runs
    your applications on the stage within the IDE by default. However, if you click
    on the Presentation Mode button, located just beneath the bottom-left corner of
    the stage, you can run your Scratch application project in Presentation mode.
    To see how this works, click on the Open button located at the top of the Scratch
    IDE and then locate and open the Hello World project. Next, click on the Presentation
    Mode button to switch to full-screen mode. Once in Presentation screen mode, single-click
    on the sprite representing the kitten and watch as your application executes,
