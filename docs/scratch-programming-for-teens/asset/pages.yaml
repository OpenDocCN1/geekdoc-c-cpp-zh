    # Creating the Family Picture Movie


    The rest of this chapter is dedicated to showing you how to develop your next
    application project, the Family Picture Movie. The development of this application
    provides the opportunity to work further with different sound blocks, controlling
    sound volume, playback, and playback termination. In total, the application will
    be made up of 8 sprites and 13 scripts. Figure 11.11 shows how the application
    looks when initially started.


    To run the application and view its picture show, all you have to do is click
    on the green flag button. Once clicked, the application begins an animation sequence
    that counts from five and then starts displaying a series of pictures representing
    the contents of the movie, as demonstrated in Figure 11.12.


    Background music is played to help set a friendly tone as the pictures are displayed.
    The Family Picture Movie is capable of displaying any number of pictures. The
    movie ends, credits are displayed, as shown in Figure 11.13.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_242_1.png)


    Figure 11.11

    The application begins by displaying a series of numbers, from 5 to 1, on an orange
    radar screen.'
