  md: '# Distributing Scratch to Mac OS X Computers


    If you are working with Mac OS X and want to create a distribution disc to share
    your creations with other Mac users who do not have Scratch installed on their
    computers, you may do so by burning a CD-ROM containing your Scratch application
    projects as well as the following Scratch system files, all of which are available
    in Scratch''s installation folder.


    +   - Scratch.app

    - Scratch.image

    - License.txt


    # Instructions for Executing Your Application from a CD-ROM


    Once you have burned a CD-ROM for your Scratch application, you need to tell your
    friends how to execute it, which can be done by double-clicking on Scratch.exe
    (Windows) or Scratch.app (Mac OS X), which will start the Scratch IDE, after which
    your application can be accessed by clicking on the IDE''s button.


    Alternatively, for Windows users, you might want to consider adding a batch file
    for each application that you added to the CD-ROM when executed will run one of
    your Scratch applications. You can do this by opening your preferred text editor
    (such as Notepad) and keying in a single statement using the following syntax.


    Scratch.exe Scratch.image ScratchProject.sb


    Here, Scratch.exe is the name of the Scratch executable that starts Scratch. Scratch.image
    is a required Scratch system file, and ScratchProject.sb represents the name of
    a Scratch application that you have added to the CD-ROM. Note that the .sb extension
    has been included. Once you have typed in this statement, save the text file with
    a filename with a .bat extension (MrWiggly.bat, HelloWorld.bat, etc.).


    When a batch file is added to the CD-ROM along with all the files already listed,
    your friends can start your Scratch application by double-clicking on it. Once
    double-clicked, the batch file will open and load your Scratch application project
    into it, making it ready for execution.'
