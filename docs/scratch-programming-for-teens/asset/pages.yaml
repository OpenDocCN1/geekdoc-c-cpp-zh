  md: '# Chapter 1 Introducing Scratch


    To the right of the code block area is the sprite area. Information about the
    currently selected sprite is displayed at the top of this area. Just beneath this
    information are three tabs, which are used to control access to the scripts, costumes,
    and sounds belonging to the sprite. To the right of the sprite area is the stage,
    which currently displays the default costume to Sprite1. Just beneath the stage
    is the sprite list, which displays a list of all the sprites that make up the
    application project.


    # Note


    Chapter 2, “Getting Comfortable with the Scratch Development Environment,” provides
    a detailed overview of all of the components that make up the Scratch IDE.


    # Changing Sprite Attributes


    The application project you are creating is designed to work with the default
    sprite. Rather than use the sprite''s default name Sprite1, let''s assign it a
    descriptive name. To do so, overtype the text displayed at the top of the sprite
    area with the word Cat. Once you change the name assigned to the sprite, the name
    change will be automatically reflected in the sprite list. If you look at the
    entry for the sprite in the sprite list, you should see a picture of the sprite,
    its new name, and the number of costumes currently assigned to the sprite (you
    can click on the Costumes tab at the top of the sprite area to view the sprite''s
    costumes).


