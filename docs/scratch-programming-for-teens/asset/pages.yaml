    automated photo album that displays pictures at three-second intervals. Each picture
    in the application is actually just a costume added to the application’s sprite.
    Figures 6.16 and 6.17 show how the application looks when displaying two of the
    photo book’s pictures.


    The development of this application project will be created by following a series
    of steps, as outlined here:


    +   1. Creating a new Scratch application project.


    +   2. Adding and removing sprites and costumes.


    +   3. Importing a sound file into the application.


