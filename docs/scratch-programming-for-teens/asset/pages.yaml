  md: '# # SCRATCH FOR TEENS


    Welcome to Scratch Programming for Teens! Scratch is a programming language intended
    to make programming easier to learn for novice programmers. It can be used to
    create computer games, interactive stories, graphic artwork and computer animation,
    and all sorts of multimedia projects. Scratch can also be used to play digital
    music and sound effects. If you aspire to one day become a professional programmer,
    Scratch provides everything you need to build a foundation. Scratch also packs
    all of the programming power and punch needed to satisfy the needs of most computer
    enthusiasts and hobbyists. Best of all, it''s actually fun to use!


    Scratch Programming for Teens provides all that a first-time programmer needs
    to get up and running with Scratch. Before you know it, you will be creating all
    kinds of projects that incorporate graphics, sound, and animation. As you learn
    to program with Scratch, you will learn programming principles and techniques
    that you can later apply to other programming languages such as Microsoft Visual
    Basic and AppScript.


    ![](img/1b656b54ace8795973817e2c2ac6a41b_339_0.png)


    +   * Jerry Lee Ford Jr. is an author, educator, and an IT professional with over
    18 years of experience in information technology, including roles as an automation
    analyst, technical manager, technical-support, automation engineer, and security
    analyst. He is the author of 24 books and co-author of two additional books. His
    published works include AppScript for the Absolute Beginner, Programming for the
    Absolute Beginner, and DarkBASIC Programming for the Absolute Beginner. Jerry
    has a master''s degree in business administration from Virginia Commonwealth University
    in Richmond, Virginia, and has five years of experience as an adjunct instructor
    teaching courses in information technology.


    # ### What''s on the Companion CD?


    A complete download of Scratch for Microsoft Windows and Mac OS X


    All the source files for all the Scratch projects developed in the book


    Additional custom graphics and audio files to build the book''s projects


    Scratch is a project of the Lifelong Kindergarten group at the MIT Media Lab,
    and the Scratch cat are trademarks Massachusetts Institute of Technology


