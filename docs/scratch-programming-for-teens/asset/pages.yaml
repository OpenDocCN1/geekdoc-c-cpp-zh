  md: '# X-axis


    ![](img/1b656b54ace8795973817e2c2ac6a41b_53_0.png)


    **Figure 2.4** Sprites are placed on the screen and moved around using a system
    of coordinates.


    The stage is 480 units wide and 360 units high. The stage is mapped out into a
    logical grid using a coordinate system made up of an X-axis and a Y-axis, as demonstrated
    in Figure 2.4.


    As you can see, the X-axis runs from coordinates 240 to -240, and the Y-axis coordinate
    runs from coordinates 180 to -180. The middle of the stage has a coordinate location
    of (0, 0). Scratch keeps you informed of the pointer''s location whenever it is
    moved over the stage displaying its (X, Y) coordinate position in the mouse x:
    and mouse y: fields beneath the bottom-right side of the stage.


    The stage can be assigned one or more backgrounds, allowing you to change its
    appearance during application execution. By default, all Scratch applications
    are assigned a blank background. You can add new backgrounds by clicking on the
    Stage thumbnail, located on the left-hand side of the sprite list, and then clicking
    on the Backgrounds tab located just above the scripts area. Like sprites, the
    stage can be assigned its own scripts and sound effects.


    # Tip


    +   If you right-click on an open area on the stage, a popup menu will appear,
    displaying the following items:


    +   - **Grab screen region for new sprite.** Makes a copy of a selected portion
    of the stage and uses it to create a new sprite.


    +   - **Save picture of stage.** Saves a copy of the stage as a .GIF file.'
