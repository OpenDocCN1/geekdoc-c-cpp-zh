- img_proc: true
  md: 'The sprite shown in Figure 2.23 is that of a rock that might be used in a space
    shooter game like Asteroids. In this type of game, the asteroid would move around
    the screen, threatening to destroy the player''s ship by colliding with it. To
    provide a realistic look and feel, you might want to tell Scratch to rotate the
    rock as its moves around the screen. By setting up the rock''s rotation point
    as the center of the sprite, it will appear to rotate or spin around its center.
    On the other hand, by setting its rotation point to be one of the edges of the
    rock, you can make it rotate in a more wobobbly manner.


    # Summary


    This chapter has introduced you to the Scratch IDE and provided a step-by-step
    overview of all of its major components and functionality. You learned how to
    work with its menu and toolbar buttons. You learned how to add and delete sprites
    as well as how to add scripts, costumes, and sounds to sprites. This chapter explained
    the coordinates system used to control the placement of sprites on the stage.
    On top of all this, this chapter also provided an overview of Scratch''s Paint
    Editor program and outlined all of its major features and functionality.'
