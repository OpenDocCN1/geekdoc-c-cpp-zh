    The rules within the coalitions at each level are different in that each level
    is somehow more than the sum of its separated individuals.


    For coalitions to develop between individual humans, linkages of various sorts
    are developed: agreements are reached and thus the sources of new information
    from each member are reduced. To maintain a dyadic coalition, interlock between
    the two human computers is developed. Each human to human interlock is unique;
    also each interlock is a function of other current and other past interlocks of
    each member and of learned traditional models.


    Coalitions between humans are immense in number and have great complexity in their
    operations. Each adult individual has linkages extending to literally thousands
    of other individuals.'
