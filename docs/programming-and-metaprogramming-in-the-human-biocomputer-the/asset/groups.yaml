    which is dynamic and growing; in this field the coalitions vary over a great range
    of apparent durations. Some coalitions are made to last beyond a single human
    lifetime; others to last a few minutes or hours or days or weeks.


    The freed bond energy from a broken coalition is used to form new coalitions,
    or to strengthen others. For example, a resignation is preferable to a firing;
    a new pair of necessary coalitions can take the place of the old one with overlap
    and without break in services; or the duties of the old coalition are distributed
