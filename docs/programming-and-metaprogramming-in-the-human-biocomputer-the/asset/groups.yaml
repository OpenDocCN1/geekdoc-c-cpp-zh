    programs (protohuman) may appear. These programs include expressions of strong
    sexuality, gluttony, panic, anger, overwhelming guilt, somatopsochistic actions
    and phantasies, and superstitions. These are of amazing strength and power over
    the self-metaprogram. Much of this material is wordless: Much of this material
    is wordless: Much of this material is wordless: ... The LSD-25 allows breakdown
    of the wordless systems, and the word-filled systems by means of channeled uninhibited
    feeling. (This is one way the unconscious is made conscious in sometimes too rapid
