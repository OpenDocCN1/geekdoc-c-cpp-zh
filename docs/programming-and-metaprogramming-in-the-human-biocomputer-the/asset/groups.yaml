    # Acknowledgments by Philip Hansen Bailey


    For the first time in over twenty five years, the manuscript for Dr. John C. Lilly''s
    masterwork Programming and Metaprogramming in the Human Biocomputer appears in
    a complete edition, with many thanks to Float On of Portland, Oregon, for bringing
