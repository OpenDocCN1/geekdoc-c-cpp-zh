    A single human organism can have at least the following coalitions to deal with:


    - (a) Parental till their death, and continuance as internal models.

    - (b) Male-female continuously, at all ages, especially in the marriage coalition.

    - (a) Financial individual (money) income and outgo is a multiple general purpose
    coalition sign. The amount of money whose flow is controlled by a given individual
    is, in general, a quantitative measure of coalition responsibility delegated to
    that individual by coalitions of many other individuals. An individual can be
    the controller of a coalition only with multiple consents, and hence control the
    flow of money into and out of that coalition.

    - (b) Children: exciting, demanding coalitions develop with one''s offspring.
    It is a challenge to renew and improve one''s coalition with each child as the
    child grows and expands his/her coalition powers.

    - (c) Unconscious coalitions below the levels of awareness, one expects certain
    kinds of conditions in one''s coalitions; some wishful thinking is expended in
