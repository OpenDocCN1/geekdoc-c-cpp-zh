    of voice, or gesture on the part of the attending person can be used by the person
    in the LSD-25 state in the processes of penetration, elicitation, or reprogramming.
    Mistakes by the attending person here can have a devastating power and must be
    scrupulously avoided. Only mature, experienced, previously exposed persons should
