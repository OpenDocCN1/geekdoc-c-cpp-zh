    # Afterword by Rick Doblin


    In early 1972, at the age of 18, a few years after the backlash against LSD had
    ended psychedelic research throughout the world, I read John Lilly''s Programming
    and Metaprogramming in the Human Biocomputer and also a manuscript copy of Grof''s
    Realms of the Human Unconscious. I was a college freshman at New College in Sarasota,
    Florida, and these were the two key books, both about LSD research, that changed
    my life.


    I appreciated their grounding in science, their explorations of the depths of
    the mind with the incredible tool of LSD, their intellectual courage, and their
    openness to rigorous evaluation of mysticism and spirituality. They helped inspire
    me to become a psychedelic researcher and therapist, to try to bring these psychedelic
    tools of insight, spirituality and healing back up from the underground where
    they had been criminalized and banished.


    Both of these books were challenging for me to understand and sometimes required
    hours on a single page, pondering the ideas expressed. Some of John''s ideas were
    profoundly liberating, especially his statement, "In the province of the mind,
    what is believed to be true or becomes true, within limits to be found experially
    and experimentally. These limits are further beliefs to be transcended. In the
    province of the mind, there are no limits.” I purchased a tape with that saying
    repeated over and over and listened to it at length.


    In 1984, I met John Lilly for the first time as a result of his effort to find
    a location for his two dolphins, Joe and Rosie, who wanted to release into the
    wild. John and his research director, Roberta Quist, came to Sarasota on my invitation.
    They found a community of support among my friends. More Marine Research Lab was
    willing to work with the Human/Dolphin Foundation towards the naturalization of
    the dolphins into Sarasota Bay. Rosie’s pregnancy stalled the effort to move the
    dolphins, resulting in postponement of the project.


    Now at age 60, in early 2014, having devoted my life to psychedelic research and
    still on the way to becoming a legal psychedelic therapist, I look back and feel
    fortunate to come across the work of this paradigm shifting minds at such a formative
    time in my life, and later to have met with and learned from both John Lilly and
    Stan Grof.


    Programming and Metaprogramming in the Human Biocomputer is an intellectual tour
    de force, a triumph of the rational mind in bringing order and sense to the flow
    of inner awareness emerging from the unconscious. The purpose of Programming and
    Metaprogramming in the Human Biocomputer is understanding. Realms of the Human
    Unconscious is also an intellectual tour de force, but whose purpose was psychotherapy
    and healing.


    Programming and Metaprogramming in the Human Biocomputer remains a pioneering
    classic that helps us all to realize how much of what we consider reality is filtered
    through our own perceptual filters that we are obligated to rigorously evaluate.
    Programming and Metaprogramming in the Human Biocomputer, viewed in combination
    with John’s life trajectory, is a meta-lesson that intellectual brilliance isn’t
    enough in and of itself, that head needs to be balanced by heart, that understanding
    needs to be balanced by healing. It’s a great gift that this profound and courageous
    book is being republished.


    Rick Doblin, Ph.D.


    February 18, 2014


    # Afterword by Glenn Perry


    Dr. John C. Lilly used the analogy of a computer to describe the workings of the
    mind and the behavior of the individual. He invented the concept that people’s
    behavior is determined by programs in their mind. At the time, it was unique,
    as in “one of a kind” as it had not been formulated before. The far ranging intellect
    and imaginative mind that was able to come up with such a formulation inspired
    many of us.


    Remember that, in the 50s and 60s, when John was investigating this area, individuals
    and small businesses didn’t have computers. Only very large companies had mainframe
    computers for batch processing payroll, billing, inventory, etc.


    In the 60s, I was working for Scientific Data Systems, a computer manufacturer,
    developing a new industry: real time processing. The computer would control processes
    happening in present time rather than dealing with transactions that were in the
    past or future.


    At the end of this time, I met Dr. Lilly. I was a systems computer programmer,
    one of a group of six people, creating the first time-sharing system for our mainframe
    computers. This system allowed 128 people, each on their own terminal, hooked
    up by phone lines to the computer, to interact with it as if they were the only
    one using it.


    Because of my work with computers, John’s formulations had a special ring for
    me. I had a “scientific” approach to life. It was only real if you could touch
    it, see it and observe it. I was familiar with the physical, the mental, and (to
    a small degree) the emotional universes. There is a whole other universe that
    I''ll call spiritual that has been investigated by Eastern minds. John''s investigation
    of spiritual matters provides the Westerner a special glimpse into an area most
    of us know little about.


    For those of us who are pursuing floating in the isolation tank that John invented
    for his research, this book can be a course of study.


    Glenn Perry, Samadhi Tank Co., Inc.


    April 19, 2014


    # Afterword by Craig A. Inglis


    > "The first thing that would impress a visitor from outer space would be the
    tremendous inexplicable gap between potential and performance in the human race."


    William S. Burroughs


    John John C. Lilly was a member of the human race who dedicated his life to “minding
    the gap”.


    A visionary who saw the possible destructive outcome of our current performance
    path then worked to give us the means to increase our potential. John was one
    of many in the domain of those willing, able, and not-at-all afraid to use all
    available tools for radical intro- and extro-pective exploration.


    Programming and Metaprogramming in the Human Biocomputer evolved from the combination
    of Johns rigorous scientific research and courageous courageous self-experimentation.
    To create a laboratory he brought three powerful tools together: the brain; the
    use of his own invention, the floatation tank, to eliminate the “out-sanity”;
    and the alchemical chemical LSD.


    This combination created a synergy of thorough mapping of self-examination and
    observation, of learning-to-learn and paying-attention-to-attention, that has
    left us with much “grist for the mill” and grokking for years to come.


    Of course, as John would often joke at the beginning of his talks, “This is all
    bovine excreta.” He recognised our internal realities, when we try to communicate,
    are projected on the screen of language, so that anything we say is not the experience
    but a descriptive mis-representation. Personally, I have found John’s mis-representations
    extremely useful in my life, especially the practice of taking on a belief system
    as true, holding on to anything of value in it, disregarding the rest, and moving
    on to another. All is flux,” said Heraclitus, and our problems seem to stem from
    times when we hold on doggedly to our entropic beliefs rather than paying attention
    to the syntropic ones.


    Having John in my life was the original impetus for my work with floatation tanks,
    and I am eternally grateful for having known him. I recognise, on an almost daily
    basis, his ongoing influence on me. I can’t count the number of fellow travellers
    that had introduced me to. I cannot even step into a tank without John’s booming
    voice echoing inside my head: “Avoid the void!”


    An avid Star Trek fan, John was always looking into the future, and I miss him
