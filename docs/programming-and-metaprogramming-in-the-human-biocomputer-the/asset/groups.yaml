    m, must obey the inequality:


    (k/m) >= k * ln 2


    I have the feeling that today, with our tremendous increase in experimental techniques,
    m is occasionally so large that the above inequality is not fulfilled, and we
    are left with more riddles than before.


    “To this frustration to reach perfect truth we, children of the second half of
    the twentieth century, have added another doubt. This is the suspicion that noise
    may enter the most effective coalition, flipping an established ''false'' into
    a deceptive ''true,’ or what might be even worse, flipping an irrelevant ''true''
    into an unwarranted ''false.''


    # GROWTH HYPOTHESIS


    - 1. One major biological effect of LSD-25 may be a selective effect on growth
    patterns in the CNS. Some parts of the CNS are thought to be specifically accelerated
    in their local growth patterns, i.e., the systems which are selectively active
    during the LSD-25 state.


    - 2. For these postulated growth effects there is an optimal concentration of
    the substance in the brain. With less concentration than the optimal there is
    merely an irritating stimulation of the CNS (below the levels of awareness). At
    optimal concentration (in the non-tolerant state) the phenomena of LSD-25 state
    occur. This is a phase of initiation of new growth in the CNS. This phase is analogous
    to that presumed to exist in the very young human (possibly beginning in the fetus
    or embryo).


    - 3. If additional material is administered, prolongation of this phase can be
    achieved. With the maintenance of optimal concentration, this phase is prolonged
    (hours) until tolerance develops.


    - 4. The phase of developed tolerance is thought to be (in addition to other things)
    the phase of the completion of the fast growth. Most of the new biochemical and
    neurological connections are completed.


    - 5. If continuous maintenance of optimal concentration for hours (and days) after
    this initial phase is then achieved, growth may continue slowly.


    - 6. The growth is not thought to be confined to the central nervous system. The
    autonomic nervous system may grow also.


    - 7. If the optimal concentration is exceeded, the substance excites a "stress
    syndrome" (i.e., adrenal-vascular, G.I. tract, etc.). (This syndrome is separate
    from the affective results of the LSD-25 state which in certain individuals can
    cause a stress syndrome. I am not speaking of such individuals. I am speaking
    of more sophisticated observers who have been through the necessary and sufficient
    experiences to be able avoid a stress syndrome in the LSD-25 state.)


    - 8. At concentrations above the optimal there can be a reversal of the beneficial
    effects in the induced stress syndrome. Anti-growth factors are stimulated. Homeostasis
    is thus assured in the organism. A similar phenomenon can be seen with negative
    programming during the LSD-25 experience. Reversal of growth may be programmed
    in by the selfprogrammer, unconscious metaprograms, or by the outside therapist
    or other people.


    - 9. At concentrations above optimal the resulting stress syndrome is programmed
    into the autonomic nervous system and continues (beyond the time of the presence
    of the substance) to repeat itself until reprogrammed out days or weeks later.


    - 10. At levels above optimal, the selfmetaprogram loses energy and circuitry
    to autonomous programs; the ego disappears at very high levels.

