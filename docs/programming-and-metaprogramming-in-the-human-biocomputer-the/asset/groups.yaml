    总之，一个人开始独立地开启更深层次的旅程，经过了适当的元编程，且相对安全，但没有逃避。在经历了自我的某些最深层处处后，结果是：那里只有你自己的信念，以及在内心深处产生的无数随机逻辑结果。外空无物，只有存储的经验。


    ## 使用 LSD25 进行自我元编程实验总结


    为了测试人类计算机的有效性，在“我们被设计”的理论隐含的一系列实验是在 LSD25 状态下、通过物理隔离和孤独进行的。在这些实验期间，首要关注点之一是弄清楚对一组假设的信念可以达到何种程度的强度。在这组实验中测试的假设并非当代科学的假设：它们不在这位科学家的意识工作储备中；他也没有在在意识上接受它们。


    在这个简短的描述中，并不打算提供所使用的自我元编程语言的所有细节，或所引发现象的细节。叙述特意保持精简、浓缩和压缩。


    从实验整体及其结果的复杂性中抽象出来的，只有那些正式描述，它们可以作为其他尝试复制这些或类似实验的人的指导性。本文并不打算通过元编程的个人方面、引发的现象或遇到的困难来使描述变得复杂。对于那些对自行复制这项工作的研究人员来说，这些假设（或类似的假设）以及这些结果可以转化为他们自己的元编程语言，这些工作者可以获得独特的结果。


    声称我之外细节的有效性并非我的目标。可能有些人已经准备得足够，尝试在自己身上复制这里所做的一切。给出描述是为了让专业人士能够获得人类计算机理论的来源。


    这一特定的存在定理被选中进行实验是有几个原因的。许多人（Blum, 1964）对 LSD25 状态进行过实验，他们写得好像他们隐含地相信，对于带有这些特定信念所经历的某些体验，外部的因果具有客观现实。


    我不认为对于这组基础的超自我元程序（图 1），支持其存在或不存在定理都是明智的。为了变得公正、冷静、通用、客观且开放，人们必须测试并调整对每一组信念的信任程度。如果人类注定要面对具有更大智慧、智力、比任何个体都更伟大的心灵的真实生物，那么我们必须保持开放、无偏见、敏感、通用且冷静。我们对幻象的需求必须经过分析，并看清它们是什么、不是什么，否则我们将面临比今天更严峻的麻烦。


    我们在内在现实中对人类进步的心理健康路径的探索，取决于该领域的进展。许多人在信念这一领域苦苦挣扎。我希望这项工作能够帮助在我们最最棘手的智力-情感区域之一找到出路。


    这些信念中的大部分在被称为“科学”的努力领域已被遗弃。此类信念继续在被称为“宗教”的领域被发现：其中一些信念在现代精神医学和人类学中被标记为迷信、精神病信念等。其他人在被称为“科幻小说”的作品中呈现这些信念。


    这组基础假设（或信念）被构思并用于对几次结合 LSD25 以及物理隔离孤独的环节进行编程。在所有这些待实验的元程序中，有一个对本主题有价值的元程序：他的整体策略是意在探索、观察、分析。因此，还有一个重要的额外基础元程序：分析自我，以更透彻地理解自己的思考和真实动机。这是意识上的动机策略。有时这个元程序主导局面，有时则是其他。然而，这种决心是存在的，使该指令在计算机层级中处于最高位置以产生整体效应。


    ## 基础元程序的实验


    在进行改变基础信念的实验之前，在几年时间里进行了许多深度物理隔离和孤独状态的实验。这些经历之后，在第二个几年里，将 LSD25 状态与物理隔离状态相结合。实验之间的最短时间为三十天，最长时间为几个月。[表
    1, 7 和 8]


    ## 基础信念 1


    基础信念 1 的实现得益于早期隔离的结果：假设主体的身体和大脑可以在隔离状态下舒适地运行，而无需其对其任何关注。这种信念表达了对自己在隔离情况下经验的信仰，即可以意识地忽略呼吸和其他身体功能的需求，并且它们会自动照顾好自己，不需要自我进行详细的关注。这一结果使得存在元程序能够在相对安全的情况下产生。


    在十六次实验中，成功地离开身体并将其停留在隔离状态二十分到两小时内是成功的。这种成功反过来允许了对其他信念进行实验。关于一个人可以离开身体并探索新宇宙的基础信念，在前八次实验中被成功编程，持续了五分钟到四十分钟；随后的八次实验是关于没有离体元程序的认知多维空间（认知空间现象见之前的“投影”章节）。


    ## 基础信念 2


    主体寻找自己之外的、非人类的生物，他存在于其中，且这些生物控制着他和人类。因此，主体发现了包含各种生物的新宇宙，有些比他伟大，有些与他同等，有些比他弱小。


    那些比他伟大的是一组，它们在时空上如此巨大，以至于主体感觉就像是阳光光中的一个微尘，在他们的时间尺度上的一个微闪能量，在他们的寿命中四十五年只是瞬间，在他们庞大计算机中的一个想法，在他们认知单元组合中的一个粒子。他感到自己处于这些生物的绝对无意识中。他经历了更多组，它们都比他伟大得多，以至于在复杂性、尺寸和时间上几乎是不可想象的。


    那些在复杂性-尺寸-时间上接近主体的生物被分为恶的和善的。恶的生物（主体说）忙于某些与他的目标完全不同的目标，以至于他在与他们接触时经历了许多惊险之福和几乎致命的事故；他们几乎完全没有意识到他的存在，因此在在不知情的情况下几乎消灭了他。


