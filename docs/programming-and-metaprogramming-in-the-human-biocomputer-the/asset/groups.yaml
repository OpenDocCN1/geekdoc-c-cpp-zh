    (1) of persons is best. This one person should, ideally, have been psychoanalyzed
    himself and have pursued his selfanalysis with LSD aid plus physical isolation
    and solitude. Short of this ideal, high quality professional psychoanalytic training
    is a minimum ideal requirement, or careful selection of attending supervisors
    by such professionals. An exclusion test must be done on any potential attendant
    or therapist; he or she should have been personally through several LSD-25 sessions
    with the selfanalysis metaprograms as the leading motivating instructions, and
    have penetrated to and beyond his own buried lethality and hostility. The professional
    selector should be thoroughly acquainted with such a potential aide, and evaluate
    the stages through which he or she has passed and achieved “permanently.”

