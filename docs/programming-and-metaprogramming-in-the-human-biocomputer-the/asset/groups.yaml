    are essential, the linkages myriad, and the cell is the well-fed and well-cared
    for slave of the state (the organism) and is killed if he breaks the orders for
    his type. Feedback is absolutely limiting here.


    At the organism-organism level, the coalitions depend, somewhat like the cellular
    level, on food, temperature, gravity, radiation, reproduction, one''s own structure,
    individuals of other species of life, individuals of one''s own species, communication
    intent and interspecies, use of one''s own computer (CNS plus), building and use
    of human artifacts (from tools to skyscrapers to rockets to nonliving computers),
    and the control of human relationships (money, credit, politics, science, books,
