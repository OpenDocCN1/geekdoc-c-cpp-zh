    possibly most of one''s sleeping hours).


    To clarify the discussion we must carefully distinguish between an interhuman
    coalition operating here and now versus one whose past occurrences in the external
    reality are modeled in the human biocomputer. The here and now operations of the
    model of a past dyadic coalition can operate in the absence of a current instance
