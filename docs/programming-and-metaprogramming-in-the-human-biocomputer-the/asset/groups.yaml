    在思考这种效应时，患者产生了一个关于投射的理论，仿佛那并不是一种投射。患者声称这些是来自另一个维度的生物，通过它们与我们宇宙之间的一个空洞渗透进来。（除非内心地地相信，否则这种对原因的归因毫无意义。）一旦对这一系统的信念强度降低，感知场扭曲的临界阈值就会显而易见，潜意识编程的投射过程也变得可检测。这些人工生物现在不再是那样，它们仅仅是因为神经系统某种特殊发育导致的视场扭曲。外部生物的戏剧性引入被证明有其自身的需求：对孤独和隔离的缓解。本质上的孤独导致了这个特定体内这些生物的产生。在随后的分析中发现，通过创造这些生物来投射自己的愤怒和恐惧是必要的。


    在这些经历之后，在孤独和隔离的情况下，不使用 LSD-25 而对这些现象进行研究表明，扭曲场可以通过放松警惕以及进入感知空间边缘的自由联想（并使用任何随机序列作为投射能量）被检测。在没有
    LSD-25 的情况下，生物或存在体不会出现。感知空间的奇异扭曲确实会出现。这些扭曲为投射生物提供了借口。受试通过信念程序，从感知扭曲的噪声中创造了外星存在。通过感知装置空间扭曲且修改的场进入的噪声复杂模式，允许对满足当前需求的形象进行创造性构建。


    这些场的扭曲不是静态的。这些效应（最大位于右侧）被视为随时间变化的函数。不仅有一个固定在身体坐标上的明显几何因子，还有一组变化的因子。正是后一组因子被一种潜意识的感知和感受程序所锁定的。为了在
    LSD-25 状态下唤起这些程序，当天的元程序（metaprogram）决定了结果。患者对自己说，看到的存在体来自我外部以及我的程序存储之外。这些元程序指令随后被用于他的计算机，构建并修改任何明显进入的内容以创造存在体，同时将存在体置于计算机本身之外。因此，这些指令本质上被使用了两次：(1)
    构建一个关于存在体外部现实的基本信念；(2) 用于展示使用该信念进行计算的结果。该信念被用于具有不确定或扭曲来源的输入信号。没有 LSD-25，该患者发现很难甚至不可能对这种投射进行编程。他无法利用这一基本信念来对抗强大的外部现实
    71 程序。他可能在没有 LSD-25 状态的情况下，在可能的其他极端未使用这种信念，例如在大量白噪声存在、入睡状态、睡眠中的梦境或催眠恍态期间。


    因此，患者可以对其关于他人的信念的真实性拥有可唤起的（假的）证明。这几乎就像一个人可以通过反馈将自己的脑机接口延伸到另一个人的大脑中，从而将对方作为一个演员，在（“那里”）表演由自己信念分配的角色。自然地，这种表演并非完美（参见后文互锁
    Interlock）。


    如果角色被对方接受并作为新的编程在潜意识中执行，那么人就无法轻易地看到这些过程。如果另一个人坚持自我并反对被分配的角色，人就有机会在自己身上检查这些过程。


    在孤独和 LSD-25 状态下，可以对上述信息来源做出以下自我假设：

    - (1) 在自己的头脑里；

    - (2) 来自其他非人类生物；

    - (3) 来自外太空智能；

    - (4) 来自与人类的超感应（ESP）。


    如果一个人假设一个超越程序，他的计算机将根据自己的超越规则生成它。编程可以被假设为来自自我、其他人类，和/或来自其他生物。现代科学家假设，在这些条件下，信息仅来自自我，即来自完全存储在人类计算机内部的存储。73


    ## 关于某些潜意识、原始人类生存程序具有潜在致命层面的说明


    实证发现，某些程序中的某些方面具有破坏个体生物计算机的能力，或者至少具有引导至潜在破坏性行动的能力。需要一个元程序来中和那些带有自毁倾向的程序。在自我分析中使用
    LSD-25 允许快速穿透到这种埋藏的致死性；在使用此类技术时应务必谨慎。在发现此类潜意识程序并对其进行彻底调查，并从元程序的角度对其进行理解之前，建议进行个人专业监督（特殊类型）。这种监督应涵盖整个调查阶段，并且（详细地）应该在每次疗程之前、期间和之后持续至少几天。在疗程过程中被激起的某些本能行为模式显然必须通过表现出来，以便在个人未来计划的元程序对其进行正确的测试、理解和填充。在这一阶段，会产生自我危险。


    植入深层程序揭示的状态可能涉及童时期阶段，加上那些被认为引导人类（作为一种进化的灵长类动物）走向文明本身的阶段，最后是引导人类超越目前成就的未来阶段。


    在 LSD-25 分析的初期（有时是较晚），可能会出现一些生存程序（原始人类）。这些程序包括强烈的性欲、贪婪、恐慌、愤怒、压倒性的负罪感、躯体自残行为和幻想，以及迷信。这些对于自我元程序具有惊人的强度和力量。很大部分材料是无语言的：很大部分材料是无语言的：很大部分材料是无语言的：……
    LSD-25 允许通过引导的、不受抑制的情感来分解这些无语言的系统和充满文字的系统。（这是让潜意识以有时过快的速度变为意识的一种方式）。如果足够强大，建模系统（自我编程器）可以完全接收这些强大的情感流，顺应它们，并最终构建出一个与所需的理想元程序一致，但也内置了情感力量的强有力模型。如果不够强大，自我编程器可能会暂时被原始人类生存程序淹没。在使用这些物质时还有额外的注意事项；自我编程器必须足够强大以体验这些现象，并且不在外部世界中产生难以逆转或难以纠正的错误。这是对于经验丰富且最强大的人格经过正确训练的人类活动领域。我不建议使用这些方法，除非在非常受控和经过研究的情况下，具有尽可能理想的物理和社会环境，并有来自经过充分训练的共情匹配人员的理想帮助。受试者的
    75 短期和长期福利必须控制在场每对人员之间潜意识和意识的所有行动、所有言语和交易。


    ## 用于自我分析的 LSD-25 状态下陪同人员的选择


    这一点被强调：陪同人员的任何动作、面部表情、词汇、句子、语调或手势都可以被 LSD-25 状态下的人用于穿透、诱发或重新编程的过程。陪同人员在此处的错误可能具有毁灭性的力量，必须严加避免。在这一关键时期，只允许成熟、经验丰富且受过接触的人进入诊室。人数越少（1人）越好。这一个人理想情况下应该已经自己接受过心理分析，并在
    LSD 辅助以及物理隔离和孤独的情况下进行自我分析。如果无法达到这一理想，高质量的专业心理分析训练是最低的理想要求，或者由此类专业人士对陪同人员进行仔细筛选。任何潜在的陪同者或治疗师必须进行排除测试；他应该亲自经历过几次以自我分析元程序为主要引导指令的
    LSD-25 会话，并穿透并超越他自己埋藏的致死性和敌意。专业筛选者应该非常熟悉这样一个潜在助手，并评估他所通过并实现“永久”的阶段。


