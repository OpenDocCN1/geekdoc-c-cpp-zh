    presences do not appear. Peculiar distortions of the perceptual space do appear.
    These distortions gave the excuse for the projection of the beings. The subject
    created alien presences out of perceptually distorted noises by means of a belief
    program. The complex patterns of the noise coming through the spatially distorted
    and modified fields of the perceptual apparatus allowed creative construction
    of figures which satisfied current needs.


