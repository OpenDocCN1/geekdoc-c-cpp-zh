    # Afterword by Craig A. Inglis


    > "The first thing that would impress a visitor from outer space would be the
    tremendous inexplicable gap between potential and performance in the human race."


    William S. Burroughs


    John John C. Lilly was a member of the human race who dedicated his life to “minding
    the gap”.


    A visionary who saw the possible destructive outcome of our current performance
    path then worked to give us the means to increase our potential. John was one
    of many in the domain of those willing, able, and not-at-all afraid to use all
    available tools for radical intro- and extro-pective exploration.


    Programming and Metaprogramming in the Human Biocomputer evolved from the combination
    of Johns rigorous scientific research and courageous courageous self-experimentation.
    To create a laboratory he brought three powerful tools together: the brain; the
    use of his own invention, the floatation tank, to eliminate the “out-sanity”;
    and the alchemical chemical LSD.


    This combination created a synergy of thorough mapping of self-examination and
    observation, of learning-to-learn and paying-'
  - '[PAGE 190]


    attention-to-attention, that has left us with much “grist for the mill” and grokking
    for years to come.


    Of course, as John would often joke at the beginning of his talks, “This is all
    bovine excreta.” He recognised our internal realities, when we try to communicate,
    are projected on the screen of language, so that anything we say is not the experience
    but a descriptive mis-representation. Personally, I have found John’s mis-representations
    extremely useful in my life, especially the practice of taking on a belief system
    as true, holding on to anything of value in it, disregarding the rest, and moving
    on to another.


    All is flux,” said Heraclitus, and our problems seem to stem from times when we
    hold on doggedly to our entropic beliefs rather than paying attention to the syntropic
    ones.


    Having John in my life was the original impetus for my work with floatation tanks,
    and I am eternally grateful for having known him. I recognise, on an almost daily
    basis, his ongoing influence on me. I can’t count the number of fellow travellers
    that had introduced me to. I cannot even step into a tank without John’s booming
    voice echoing inside my head: “Avoid the void!”


    An avid Star Trek fan, John was always looking into the future, and I miss him
    sometimes twice daily invitation to watch the series with him. The invites by
    phone were always three words, none more; as he was not one for small talk: “It’s
    on!”


    As with many of the greats, I have seen John being judged many times for his behaviour.
    I remember a visitor expressing disbelief that John was watching something on
    television. “What a waste of a'
- md: '

    great mind,” they said I told them I would be happy to discuss their observation
    when they too had published 11 books, 125 scientific papers, produced numerous
    inventions and influenced, if not created, several major scientific disciplines.


    I have a deep love of and admiration for John, and it gives me real pleasure to
    see new generations coming to his work. Graham Talley and Coincidence Control
    Publishing are to be warmly congratulated for reprinting this seminal work.


    The torch passed on by John and other intelligentsia to the wave of those “minding
    the gap” and applying their Metaprogramming seems to be blazing brighter. This
    body of work was funded originally by the U.S. government until they changed the
    laws and every supply of L.S.D. had to be returned to Sandoz. So I believe John
    would give his approval to the current work of M.A.P.S. and the Beckley Foundation
    amongst others who are pushing new frontiers.


    Our Technosphere is now facilitating global communication between cultures, thereby
    creating an Ethnosphere, allowing a new wave of some of the original reality mappers
    of human evolution the Huichol, Amazonian, and African shamans to travel around
    our Biosphere. This unfortunately is usually born out of necessity, when they
    see their own particular biome being mined.


    I see the flotation tank or as I call it; the sensory appreciation tank (as opposed
    to deprivation) as yet another tool at our disposal, just like the ones used by
    the shamans and modern day psychonauts, all mirrors to peer into our deep selves
    and hopefully put us back on our co-evolutionary paths.


    I am delighted to see a resurgence in the floatation world, as many new centres
    blossom around the biosphere, new designs, new integrations with other disciplines
    – in short, new possibilities.


    Ah, but where will the continuation and further development of this extraordinary
    body of work take place, I wonder? I can see John now, with that wry smile, and
    a twinkle in his eyes.


    Craig A. Inglis


    April 25, 2014


    ## Glossary


    Communication: the process of the exchange of information between two or more
    minds


    1a. Communication: the process of exchange of information between metaprogramming
    entities within two or more computers.


    Information: the calculated mental results of the reception of signals from another
    mind and the computed composed context of the next reply to be formed into transmissible
    signals.


    2a. Information: the data received, computed, and stored resulting from the reception
    of signals by a metaprogramming entity from another computer and the computed
    data in the ready state in the same entity for transmission to another computer
    through a similar set of signals.


    Mind: the entity comprising all of the (at least potentially) self-detectable
    processes in a brain which are at such a level of program complexity as to be
    detected and at least potentially describable in programming language; the selfmetaprograms
    within the brain.


    3a. Mind: a form of metaprogram in the software set of a very large bicomputer
    which organizes metaprograms for the purposes of selfprogramming and of communication.


    3b. Mind: the computer-brain-detectable portion of a supra-physical entity tied
    to the physical-biological apparatus the remainder of this entity is in the soul-spirit-God
    region and is detectable only under special conditions.


    Program: a set of internally consistent instructions for the computation of signals,
    the formation of information, the storage of both, the preparation of messages,
    the logical processes to be used, the selection processes, and the storage addresses
    all occurring within a bicomputer, a brain.


    Metaprogram: a set of instructions, descriptions, and means of control of sets
    of programs.


    Selfmetaprogram: a special metaprogram which involves the selfprogramming aspects
    of the computer, which creates new programs, revises old programs, and reorganizes
    programs and metaprograms. This entity works only directly on the metaprograms,
    not the programs themselves; metaprograms work on each program and the detailed
    instructions therein. Alternative names are set of selfmetaprograms, "selfmetaprogramming
    entity," or the selfmetaprogrammer.


    ## MAJOR METAPROGRAMS


    ### External Reality Metaprogram


    This metaprogram operates programs with interlock with the outside-body-systems.
    These systems include all of external reality; human beings are a defined part
    of the external reality.


    This metaprogram seems to be absent only in special states and even then possibly
    is only relatively attenuated, not completely absent. The states in which it is
    attenuated include sleep, coma, trance, anaesthesia, etc.


    The above states cause centrally conditioned reductions of the stimulation arriving
    from the external reality. It is also possible to attenuate the external reality
    stimuli themselves.


    In the profound physical isolation, external reality excitation of the CNS is
    attenuated to minimum possible levels in all modes. In profound physical isolation,
    one adds a metaprogrammatically active substance to the brain (such as LSD25),
    further attenuation of the external reality stimuli can be achieved and the ego
    (selfmetaprogram) is more fully activated. If in profound physical isolation one
    adds sleep, trance, or anaesthesia (light levels), these give external reality
    cutoff and cessation of e.r. (external reality) excitation of the central nervous
    system (and of the “mind”).


    The external reality metaprogram is increased in its intensity in high excitation
    states; interlock with the external reality can be increased by these means.


    ### Selfmetaprograms


    These metaprograms include all of those entities which are usually defined as
    ego, consciousness, self, and so forth.


    The interlock of the selfmetaprograms with the external reality metaprograms can
    be attenuated by special techniques including sleep, LSD25 plus isolation, anaesthesia,
    etc.


    The apparent strength of these metaprograms can be enhanced in certain classed
    by LSD25 plus dextroamphetamine, psychic energizers, etc.


    ### Storage Metaprograms


    These metaprograms have two aspects: there is the active storage process in which
    the inputs from e.r. and from self are connected to storage: there is the active
    output process in which the self is connected directly to storage. To achieve
    these connections there are the search metaprograms. The nature of these programs
    varies depending upon special conditions. It varies in free association states,
    hypnagogic states, dreaming states, etc. LSD25 and similar agents allow a special
    state in which the selfmetaprograms can consciously explore much of the storage
    itself. In this particular state the selfmetaprograms and the search-metaprograms
    operate coextensively in such a way as to reveal the innermost files of the storage
    directly to self.


    ### Autonomic (Nervous System) Programs


    The autonomic nervous system has built-in properties which are definitely programmatic
