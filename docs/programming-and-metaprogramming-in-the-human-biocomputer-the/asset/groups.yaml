    than as an integrated smoothly operating holistic computer.


    # Survival Metaprograms


    Survival Priorities are used in case of threat to structural and functional integrity
    of the entities named the order is that of relative importance in the sense that
    the one below in the list will be sacrificed, abandoned, penalized, or changed
    in order to save, maintain, integrate, or educate the one above in the series.


    A threat is defined as internal (mental) information (which when above threshold)
    anticipates and predicts immediate or delayed destruction, mutilation, confinement,
    abandonment, damnation, ostracism, solution (lysis) of continuity, compromised
    integrity, moral encroachment, severe ethical insult, voluntary seduction, unconscious
    entrenchment, slavery, etc.


    In nonthreatening educative processes the listing is more flexible any any entity
    may, for a time, be placed at the head of the new list. This survival priorities
    list may remain intact in this order in the depths below awareness. It is evoked
    in states of fatigue which begin to generate information above the threat threshold.


    The Soul-spirit this concept includes life after mortal death, reincarnation,
    the immortal entity, that which is God-given, none of which is in current Science.
    This is currently considered by some persons as the most valuable of all the available
    entities. Depending on the needs of the definer, this entity may be educable,
    may have higher ethical strivings than current ones, may store information of
    certain kinds, may develop skills in certain areas, may carry these capabilities
    within it to the next state after the current mortal physical reality is left,
    etc.


    - 1. Ego-mind Entity: one’s mind and mental self are valued above the body (and
    in those with the above religious belief, below the soul).

    - 2. Body: it is obvious that one values one’s body less than one’s mental self;
    however, at times one can be forced to act as if the list did not have this order
