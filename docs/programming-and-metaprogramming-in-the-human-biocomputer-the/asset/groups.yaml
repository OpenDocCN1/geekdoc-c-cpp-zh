    ## Plea for Further Research


    In summary, a plea is made for the development of a theory of the communicator,
    human type, faced with a nonhuman communicator with a brain and presumed mind
    of a high quality. The theory should include open-ended, non-species-specific,
    general purpose, self-programming, mutual respect, voluntary dedication, participant
    theorist kinds of basic assumptions. Beyond these assumptions are those of the
    proper selection of participants, support, interest in the scientific community,
    and cooperation on an operating contributing level by open-minded professionals.⁵


    ## Summary of Logic Used in this Paper: Truth, Falsity, Probability, Metaprograms
    and Their Bounds


    For the sake of clarity the following presentation of the logic employed in this
    paper is given.


    It is quite apparent that there is at least a four-value logic employed. There
    are the usual ''true'' and ''false'' values; in addition there is another pair
    which in a shorthand way can be called ''as if true'' and ''as if false.'' Each
    of these four values can be applied to the external reality and to the internal
    reality of the human biocomputer.


    The notation employed is as follows for the external reality applications, ''true''
    and ''false'' are rewritten without quotes. ''As if true'' and ''as if false''
    are written with an asterisk ahead of the true and ahead of the false (*true,
    *false). For the internal realities situation, i.e., the occurrence of these values
    in the software of the human biocomputer, double quotation marks are placed around
    ''true,'' ''false,'' ''as if true'' and ''as if false,'' ("*true" and "*false").


    In the internal reality case, for each of these values, there is a metaprogram
    which can be stated as follows: "define as true (or false) a given metaprogram."
    (In the main body of the paper this is a basic belief for survival, for example.)
    A less intense metaprogram is "defined as if true a given metaprogram or defined
    as if false a given metaprogram." In the experiments on basic beliefs, "if defined
    as "true" then the metaprogram is "true" within limits to be determined, and if
    defined "*true" then "true" within limits to be determined.


    This various values may be modified with a judgment of their probability and with
    the defining of the desired intensity. The probability scale is 1.0 for absolutely
    certain, a gradation of probability down to the value 0 which is improbable and
    to -1 for impossible. Such values are applied to each of the logic categories
    with regard to a specific metaprogram.


    Such a logic system can be seen operating in the external reality in coalitions
    of various sorts. A coalition can function ''as if an internal judgment'' in the
    sense that it defines certain things as "true" which are then true within limits
    to be determined. The usual structure of human law seems to share this property.
    The concept of consensus wisdom (Galbraith) includes this logic system.


    There are certain metaprograms and programs which have an imperative, externally-proven
    truth-falsity relationship which cannot be manipulated within the human biocomputer
    without danger to its existence. These metaprograms and programs can be considered
    as imperatives from some parts of the program level of the human biocomputer which
    must function as suprametrograms (i.e., there must be recognition of the “built-in,”
    “necessary for survival nature” of these programs).


    Some of these true programs are yet to be determined in biological science. The
    following have been determined: the necessity of obtaining food in response to
    hunger, the necessity of sexual activities and pleasure, adequate responses to
    pain and fear (such as free, flee, fight).


    Programs designed for survival of the body in a gravitational field take up a
    large fraction of the apparatus and of the time and energy of the human computer.
    The physiological limits of stimulation of the special senses must be closely
    maintained, i.e., not too high or too low levels of light, sound, and so far.
    External temperatures and internal temperatures must be regulated within certain
    limits. Illnesses introduce new programs, including those illnesses which are
    the result of selfmetaprogramming.


    Direct physical injury with physical trauma to the body have their own imperatives.
    The intake of certain gases into the respiratory system must be regulated very
    cautiously. Among these are oxygen, carbon dioxide, water vapor, carbon monoxide,
    nitrogen, xenon, krypton, nitrous oxide, and so forth. There are programs regulating
    the amount of liquid surrounding the body (for example, to avoid drowning), the
    amount of solids piled on top of the body (to avoid crushing), the total pressures
    of gases around the body (neither too much nor too little), the level of radiation,
    the level of elementary particles from outer space, or from artificial sources.

