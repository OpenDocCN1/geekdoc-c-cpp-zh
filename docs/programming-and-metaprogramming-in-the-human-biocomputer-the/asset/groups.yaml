    # 摘要


    对现代通用计算机理论的推演和重构的一些通用观点被用于解释和控制人类大脑运作的某些主观方面。通用计算机理论的一个补充（针对特殊的人类大脑）是了“自我元程序”（self-metaprogram）或内部程序员的概念，存在于被称为人类大脑的
    $10^{10}$ 个神经细胞之中。自我元程序运行在巨大的存储空间与巨大的外部现实之间。自编程属性（除存储程序属性外）对于理解心理操作以及由此产生的语音和语言等外部通用行为至关重要。存储程序和元程序是人类的特征。


    计算机编程和程序的自组织方面现在在概念上是合理的，并且在现代非生物计算机中是可实现的。人类大脑可以称是一台“超级生物计算机”，是一个并行处理器——具有这种结构的人造机器尚未被制造。某些物质对大脑的作用可以通过这一理论来解释：LSD25
    开启了对存储程序的检查和重新编程的可能（可能是通过引入少量的程序化随机性和噪声）。在儿童身上，自动的元程序植入（或外部强制元编程）以元程序的形式持续到成年人的意识水平以下，可以控制后期的成年程序、成年思维和成年行为。可以通过特殊的技术和化学诱发的特殊中心状态，从这些自动元程序中提取能量并转移到自我元程序。某些未被察觉的自动程序对于生物养育、生存等至关重要。文中给出了方法、调查以及在自我分析和自我元编程方面结果的示例。


    # 谢谢


    作者感谢国家心理健康研究所职业奖金（来自国家心理健康研究所，N.I.H.，马里兰州贝塞斯达，1962-1967），该奖为本工作的构思和写作提供了必要的时间和动力。国家心理健康研究所还为作者在美国公共卫生服务署军官任职期间（1953-1958）的某些实验提供了支持，当时他同时服务于国家心理健康研究所和位于马里兰州贝塞斯达的国家卫生研究院下国家神经疾病与盲症研究所。此外，在不同时期，本工作的部分内容得到了美国空军科学研究办公室、国家科学基金会、美国国家航空航天局（NASA）、国家神经疾病与盲症研究所（N.I.H.）以及
    G. Unger Vetlesen 基金和 Michael Tors 基金的部分资助。作者对这些支持表示谢意。


    作者希望对费城城心理分析协会学院和巴尔的摩学院表示感谢，感谢让他有机会进行心理分析研究准备和训练分析（1949–1956）。特别地，他对 Robert Waelder
