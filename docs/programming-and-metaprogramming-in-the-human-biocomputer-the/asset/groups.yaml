  mdcn: '

    在本世纪，我们已经开始欣赏某些强大且特殊的物质形式，这些形式就是我们至关重要的有机体。过去五年来，生物化学、遗传学以及生物物理学和分子生物学的进展，是人类重新控制体内部这些物质分布的开端。


    薛定谔²曾说，染色体（包含线性遗传密码）对于物理学家来说是一个线性的二维固体；沿着它的长度，它具有巨大的强度，并且是一条灵活的链条，可以移动，并在有丝分裂期间从中间裂开。这些作为我们作为完整成年人最终结构指令的载体，它们在从一个个体传递给下一个个体以创造出序列中的个体的过程中，具有本质上的不死性，在任何关于我们大脑运行的理论中都不应被忽视。可能，我们的基本信念，即我们每个人独有的信念，可以通过我们本质上独特的基因图谱与思维局限之间的仔细关联来发现。可能，我们每个人的思维类型和水平从本质上是由我们每个人所含的基因所决定的。可能，我们每个人的私有语言都是由基因决定的。即使这是真的，即我们的思维机器中存在基因决定论，我们尚未达到能够指明受基因控制的抽象层次以及认知和理论实体的程度。


    如果我们能让自己从外部世界物质存储对思维机器的影响中解脱出来，如果我们能从引导我们思维的元程序存储的影响（即由他人设计并在我们学习期间提供给我们的程序）中解脱出来，我们可能看到由基因决定的轮廓和基本变量。这是一个极其困难的研究领域。它需要许多才华横溢的个体投入并思考自身的思维过程，并结合对自身基因结构及其基因祖先的详细了解。


    当然，在这一讨论中，我们正在进入由表型-基因型差异带来的困难。这些必须被考虑进去，正如遗传学科学中费力推演和发现的所有其他机制一样。但这些遗传学规则在元理论中不应具有限制性；它们必须作为这些才华人士知识的一部分，并在正确的抽象层次进入，以寻找受基因控制的思维模式。


    这种思维的基因决定论可能只是一个海蜃泡影。可能在计算机后续的发展中，它已经变得如此通用，以至于原始的遗传因素和基因不再重要。即使人们可以建造由固态部件、真空管部件或生物部件组成的非常非常大的计算机，只要总尺寸、连接的卓越性以及连接的类型使得人们从特定机器中获得通用的网络结果，区别就微乎其微。因此，我们每个人都可以获得相同类型的学习和相同类型的思维，受基因差异的影响极很小。


    我不希望在这些问题上采取任何立场。我只想说，如果一个人要采取客观且冷静的观点，就无法在这些这些事情上深度拥护任何固定的思维模式。我更倾向于看到具有巨大心理能力的才华人士向极深处研究自己的大脑。我想帮助这些个体将结果传达给其他具有相似但不同才华的人。我相信，通过使用某些方法和手段（其中一些在本书中介绍），真正有才华且奉献的个体可以锻造、发现并设计观察我们大脑的新方法，这些方法是真正科学的、智力经济的且互动创造的。例如，考虑由尼古拉斯·布尔巴基博士（Dr.
    Nicholas Bourbaki）之名的数学家小组创造的虚构个体案例。


    这群数学家为了创造超越任何个人能力的数学或一系列数学体系，每年举行三次会议并交流思想，然后出去单独工作。产生的论文以笔名发表，因为这项工作的成果被认为是一个小组的结果，超越了任何个人的贡献。


    这个小组是否比一个在类似材料上孤立运行的人类大脑更大或更小，在一段时间内尚未知。可能这些数学家之间的人类计算机互锁产生了一个在思维模式、思维复杂性和创造性新想法方面比他们中任何一个都更伟大的新实体。人类必须完成的某些事情需要大量个体之间巨大的合作。此类成就超越了任何个人，是集体努力的产物。这是真实的，例如在建造帝国大大厦、地铁系统、铁路系统、航空公司、大型工业工厂等。在这些每种情况中，都存在外部现实的重新排列，许多人之间通信网络的建立，以及这些个体中的每一个人对他们所所属组织之目标的奉献。这可能是我们本世纪在工业、军事、教育和宗教努力中的最大成就。人类与其他人的有效互锁可以完成任何个人无法比及的事情。


    然而，在某些领域，天赋异禀、才华横溢、智慧的个体似乎几乎像孤独的计算机一样自主运行，产生新的发现。这在孤立环境中长大的数学天才案例中可见一斑。人们几乎害怕教育这样的人，担心他们会失去通用性以及做出原创创造性贡献的能力。以某种方式，他们逃脱了人类无处不在的社会组织及其需求。正如创造性物理学家莫塞莱（Moseley）的情况，他在第一次世界大战中被征兵牺牲，这种才华可能因为社会互锁的需要而被浪费。现代世界存在一种观点，知识分子之间存在的分歧正在浪费我们对才华的使用。存在对立的哲学导致了多样化的智力活动。

