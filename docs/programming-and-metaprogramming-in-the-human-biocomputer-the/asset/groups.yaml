    各种病毒、细菌、真菌、藻类、原生动物等必须通过适当的编程进行严格管理。


    人类计算机与其他哺乳动物以及超越哺乳动物物种的相互作用必须以预见性的方式进行编程。


    必须对信息进行管理，即来自任何地方、任何人的信息的类型和数量，以确保人类计算机的最佳运行。存在如“信息过载”和“信息匮乏”等现象。存在多项调节个体与其周围环境关系的程序，这些程序有自身的指令。


    总而言之，存在一些元程序（metaprograms），它们在外部现实和外部证明的意义上必须被假设为真。每一个元程序对真与假都有自己的定义。“假设为真”和“假设为假”的类别只能对这些元程序的内容进行临时假设性的考虑，而不能应用于它们在真实计算机和真实世界中的执行。在
    LSD25 状态下，某些这些程序必须被认为是真实的（外部真实且可证明的），以便在 LSD25 状态下生存。这些事项将在本书的其他部分进行更详细的探讨。


    ## 13 硬件、软件

    人类生物计算机的关系


    为了研究元程序、程序与中枢神经系统神经活动之间某些复杂的关系，做出以下简化假设：


    - 1 假设有一个由 $10^{10}$ 个神经元组成的数组，按照它们在中枢神经系统的特定方式连接。

    - 2 假设每个神经元中特定的关键事件是其轴突的脉冲发放。

    - 3 假设一种从中枢神经系统（CNS）外部控制这种点火的方法。

    - 4 假设一种获取释放脉冲的方法，该脉冲可以传输到中枢神经系统外部。

    - 5 假设 $10^{10}$ 阵列中每个神经元的每个脉冲都记录在中枢神经系统外部的高速计算机中。

    - 6 每个脉冲发生的时间被作为单独的数据存储。

    - 7 假设每秒从整个中枢神经系统存储了 $10^{14}$ 个这样的脉冲。

    - 8 假设这台外部计算机可以在随后的时间段内通过 $10^{10}$ 个通道，按照它们进入存储时的相同时间模式，复制存储的脉冲时间模式。

    - 9 通过行为技术测试这一假设。

    - 10 在包含双计算机的有机体进行某些复杂行为（如同时说话和写句子）期间，完全记录外部行为 [3D 动影像胶片、多通道磁带（麦克风等）]。

    - 11 存储说话和书写期间所有的神经活动信号。

    - 12 在随后的时间段内，回放或从存储中调用以相同顺序存储的模式，并从计算机通过 $10^{10}$ 个通道输出到中枢神经系统。

    - 13 记录随后的行为，并将此记录与产生句子时之前的外部行为记录进行比较。

    - 14 目前的理论认为，在模式复制期间有机体的行为将与原始行为的发生紧密一致。


    如果原始假设是正确的，那么通过摄像头、录音机等看到的两种行为模式将是相同的。如果计算机中运行的不是神经脉冲控制，而是其他东西，那么这两种行为之间将存在差异，取决于控制的程度。可能需要更长的时间模式来控制所有的反馈（例如，内分泌和生物化学系统），这些系统的时间常数比拟议的实验长。在两个行为序列变得相同之前，可能还需要被存储的预处理期。


    通过这个模型，我们可以提出许多基本问题：例如，是什么样的物理事件集合导致了音素领域、语义抽象层次领域、外部元编程领域以及使用语言编程的现象？


    通过这种技术，药物对中枢神经系统的影响评估可以在中枢神经系统内发生的关键物理事件方面产生有意义的结果。可以对大脑不同系统中的编程和元编程类型进行分析，例如新皮层、中皮层、古皮层和原始皮层，与皮层下系统（如丘脑、下丘脑、中脑等）的对比。然后，可以对边缘系统、正强化系统和负强化系统、垂体的控制以及通过中枢神经系统各部分血液成分的反馈控制进行系统分析。随后可以以定量的方式规定所有这些系统之间反馈关系的评估。


    这种表述以一种方式将主观性客观化，使得实验的设计不仅可以存储主观事件的客观方面，还可以从存储中重现主观事件。它允许对产生中枢神经系统之外的主观事件的物理方面进行定量分析。


    它还允许进行实验，即给定的中枢神经系统可以控制第二个中枢神经系统的大部分（如果不是全部）功能。可以找到第二个中枢神经系统与第一个对应的部分，并对阈值的差异、阈值的区域分布以及两个中枢神经系统之间的相似区域进行评估。


    更详细的提议见在第 14 章。


    ## 14 问题

    人类生物计算机：大脑活动的生物物理学分析与控制-程序层级（图 2-9 & 表 3-10）


    程序层级

    大脑活动层级


    - 1.0 假设对 $10^{10}$ 个神经元建立双重连接。

    - a. 第一个连接获取每个神经元的动作电位。

    - b. 第二个连接提供电冲（持续 $10^{-5}$ 秒）以触发每个神经元，无论阈值如何。

    - 2.0 假设一种在信号发生时将其存储在大型计算机中的方法，时间为半小时（1800 秒，$1.8 \times 10^9$ 微秒）。

    - 2.1 记录半小时内的有机体总行为。

    - 3.0 在之后的任何时间，按原始顺序输出所有存储的信号。

    - 3.1 记录产生的行为以便回放。

