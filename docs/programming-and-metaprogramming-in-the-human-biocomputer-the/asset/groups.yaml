    ## RETREATS FROM INTERLOCK


    Some human scientists faced with nonhuman species who have brain-computers equal
    to or larger than their own, retreat from responsibilities of interlock research
    into a set of beliefs peculiar to manual, manipulating, bipedal, featherless,
    recording, dry, airvocalizing, cooperating-intra-species, lethal-predatory-dangerous,
    virtuous-self-image, powerful-immature, own-species-worshipping primates, with
    1400 gram brains.


    Specifically, human scientists faced with dolphins (with 1800 gram brains) retreat
    into several safe cognitive areas, out of contact with the dolphins themselves.
    The commonest evasion of contact is the assumption of a human a priori knowledge
    of what constitutes “scientific research on dolphins,” i.e., a limited philosophical,
    species-specific, closed-concept system.


    Common causes of retreat are too great fear of the dolphin’s large size, of the
    sea, of going into water, of the Tropics, of cold water, etc. Another safe retreat
    is into the let’s see what happens if we do this or the experimental “mucking
    around” region. Years can be spent on this area with no interlock achieved; successful
    evasion is thus continued endlessly.


