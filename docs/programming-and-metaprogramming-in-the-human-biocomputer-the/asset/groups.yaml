  mdcn: '

    肌肉力量的增强，以及自我和外部治疗师对程序和元程序（metaprograms）的溶解与重建等。


    白噪声能量的增加允许对记忆进行快速且随机访问，并降低了潜意识记忆阈值（意识的扩张）。在这种噪声中，人们可以在几乎任何认知水平以几乎任何允许模式投影几乎任何事物：一个戏剧性的例子是某些主体在“出神”时坚信自己听、见、感到了上帝。将对上帝的期望投影到白噪声上，仿佛这些噪声是信号一样；人在噪声中听到了上帝的声音。在合适的条件下、适当的剂量和适当的时间，通过适当的编程，可以在自己的认知范围内向噪声中编写几乎任何程序；限制仅是个体自身的概念限制，包括由受压抑、抑制和禁忌的思想区域所设定的限制。后者可以使用白噪声的能量为自我服务进行分析和释放，例如，一个“分析你自己”的元程序可以作为
    LSD-25 状态下执行的指令的一部分。


    引入的噪声带来了一定程度的混乱，就像物理世界中的白噪声带来随机性一样。然而，这种不足以破坏所有秩序，仅足以在程序材料、元程序及其信号上叠加一种微小的创造性“抖动”。加到电路中通常信号的这种噪声成分，为意义增加了足够的不确定性，使得新的解释更有可能。如果噪声变得太剧烈，可能会预期它会抹除信息并导致无意识（在极高水平下则是死亡）。


    主要的运作原理似乎是人类计算机的操作方式能够从噪声中产生信号，从而在没有信号的随机能量中创造信息；这就是“投影原理”；噪声在非模型中被创造性地使用。从噪声中“创造”的信息可以通过仔细的分析证明其本存在于计算机的存储系统中，即投影的操作将信息从存储器移到感知装置，使其看起来像是源于所选的“外部受噪声激发的系统”。这一原理的演示是多方面的：在单一模式下，在深度的隔绝和孤独中听真实的声学物理白噪声，人们可以听到想听（或恐惧听到）的内容，听到别人谈论自己的声音，或自己的敌人讨论计划等。使用
    LSD-25 时可以使用两种模式：一种可以听白噪声（包括极低频率），并在闭上双眼的空白屏幕上看到投影的理想（或恐惧）幻象。人们可以在深度的隔绝（水悬、寂静、黑暗、恒温皮肤等，孤独状态）探测到大脑自身的噪声水平，并将其用于认知投影而非感官数据投影。人们不是看到或听到投影的数据，而是去感受和思考它。这是某些人犯下错误的依据之一，他们假设投影的思想来自自己大脑之外，即与宇宙合而为一、体内的上帝思想、外星生物向其传送思想等。由于缺乏感官刺激，且缺乏进入计算机的正常输入（现实程序缺乏能量），计算机中通常用于感官数据（以及外部世界）投影的空间，通常可以替代性地用于思维和感受的显示。


    正如 Von Foerster 所述（《BioLogic》， 1962）：


    > “这种自发错误的发生远非罕见事件。保守估计认为，单个人类大脑每秒进行约 $10^{14}$ 次基础操作。如果我们能相信 Hyden (1960) 和 Pauling
    (1961) 的最新工作，这些操作是在大约 $10^{21}$ 个分子上进行的。从稳定性的考虑来看（Von Foerster, 1948），我们可以估计每秒有
    $10^9$ 到 $10^{11}$ 个分子会由于隧道效应而自发改变其量子态。这表明，大脑中 $10^{-3}-10\%$ 的操作受到内在噪声系数的影响，必须以某种方式予以处理。”
    进一步指出（同一参考文献）：


    > ...“我们这个世纪的开始见证了先辈们信赖固定数量的 $m$ 个命题的谬误。这个数字随着新发现的不断增长，新发现为我们的知识体系增加了新的变量。联系此，可能会让你觉得有趣的是，为了不让我们智慧的逻辑强度流失，聚合速率
    $k$ 与发现速率 $m$ 的比率必须遵守以下不等式：


    (k/m) >= k * ln 2


    我感觉在今天，随着我们实验技术的巨大增长，$m$ 有时大到使得上述不等式无法实现，我们留下了比以前更多的谜题。


    “对于这种达到完美真理的挫败感，我们这些20 世纪下半叶的孩子增添了另一种怀疑。这种怀疑是噪声可能会进入最有效的联盟，将一个既定的‘假’翻变为具有欺骗性的‘真’，或者更糟，将一个无关的‘真’翻变为一个无根据的‘假’。”


    # 增长假设


    - 1. LSD-25 的一个主要生物效应可能是对中枢神经系统（CNS）生长模式的选择性影响。CNS 的某些部分被认为其局部生长模式被特别加速，即在 LSD-25
    状态下选择性活跃的系统。


    - 2. 对于这些假设的生长效应，大脑中该物质存在一个最佳浓度。低于最佳浓度只是对中枢神经系统产生刺激性影响（意识水平以下）。在最佳浓度下（非耐受状态下），会发生
    LSD-25 状态的现象。这是中枢神经系统新生长的阶段。这一阶段类似于认为存在于人类早期（可能是胎儿）的阶段。


    - 3. 如果给予额外的物质，可以实现该阶段的延长。通过维持最佳浓度，该阶段会持续（数小时），直到产生耐受性。


    - 4. 耐受产生阶段被认为（除其他外）是快速生长的完成阶段。大多数新的生物化学和神经连接得以完成。


    - 5. 如果在初始阶段后持续维持最佳浓度（数小时甚至数天），生长可以继续。


    - 6. 这种生长被认为不仅限于中枢神经系统。自主神经系统也可能生长。


    - 7. 如果超过最佳浓度，该物质会引起“压力综合征”（例如肾上腺-血管、胃肠道等）。（这种综合征与 LSD-25 状态的情感结果不同，后者在某些个体会导致压力综合征。我指的不是这类人。我说的是经过必要且充分经验、能够在
    LSD-25 状态下避免压力综合征的更复杂的观察者。）


    - 8. 在最佳浓度以上，诱导压力综合征的益处可能会发生反转。抗生长因子被激活，从而确保机体的稳态。类似的现象出现在 LSD-25 体验中的负面编程。生长的反转可能由自我编程者、无意识元程序或外部治疗师或其他人员编写。


    - 9. 在最佳浓度以上产生的压力综合征会被编写到自主神经系统中，并在（物质存在之外）持续重复，直到几天或几周后被重新编程消除。


    - 10. 在高于最佳水平时，自我元程序会将能量和电路让给自主程序；在极高水平下，自我消失。

