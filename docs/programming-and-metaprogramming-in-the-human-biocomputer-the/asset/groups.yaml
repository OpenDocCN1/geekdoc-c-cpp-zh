    # OBSERVATIONS WITH TURSIOPS-HUMAN INTERLOCK: MIMICRY AS EVIDENCE OF INTERLOCK


    It has been found [with one nonhuman species (Tursiops truncatus) with a brain
    known to be sufficiently large to motivate the human end adequately] that a large
    daily commitment of hours to interlock is necessary for the human end, the order
