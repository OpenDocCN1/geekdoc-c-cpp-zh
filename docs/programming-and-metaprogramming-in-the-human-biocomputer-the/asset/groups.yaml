    In this century we have begun to appreciate some of the powerful and special organizations
    of matter which are our essential organisms. The advances in the last fifty years
    in biochemistry, in genetics, and in biophysics and molecular biology are the
    beginnings of a new control of these distributions of matter within ourselves.


    Schrodinger² said that the chromosome (which contains the linear genetic code)
    to a physicist is a linear two dimensional solid; along its length it has a great
    strength and it is a flexible chain which can move and which can be split down
    the middle during mitosis. These carriers of the orders for our ultimate structure
    as an integral adult, their essential immortality in being passed from one individual
    to the next in creating the next individual in line, should not be neglected in
    any theory of the operation of our mind. It may be that our basic beliefs, the
    unique ones of each one of us, can be found by careful correlations between our
    essentially unique genic maps and our thinking limits. It may be that the kinds
    and levels of thinking of each of us is capable essentially determined by the
    genes which are contained in each of us. It may be that each of our private languages
    is genically determined. Even if this is true, that there is genic determinism
    in regard to our thinking machines, we are not yet at the point at which we can
    specify the levels of abstraction and the cognitional and theoretical entities
    which are genically controlled.


    If we can free ourselves from the effects on our thinking machine of storage of
    material from the external world, if we can free ourselves up from the effects
    of storage of metaprograms which direct our thinking, programs devised by others
    and fed to us during our learning years, we may be able to see the outline and
    the essential variables which are genically determined. This is an immensely difficult
    area for research. It will require the services of many talented individuals considering
    their own thinking processes, combined with a detailed knowledge of their genic
    structure and their genic predecessors.


    Of course in this discussion we are entering into difficulties brought about by
    the phenotype-genotype differences. These will have to be taken into account as
    all of the other mechanisms so laboriously worked out and discovered in the science
    of genetics. But these rules of genetics must not be limiting in the metatheory;
    they must enter as part of the knowledge of these talented individuals and at
    the correct level of abstraction for seeking the patterns of thinking which are
    genically controlled.


    This genic determinism of thinking can turn out to be a will-o''-the-wisp. It
    may be that in the subsequent development of the computer it has become so general
    purpose that the original genetic factors and the genes are no longer of importance.
    Even as one can construct a very very large computer of solid state parts or of
    vacuum tube parts or of biological parts, it makes little difference as long as
    the total size, the excellence of the connections and the kinds of connections
    are such that one can obtain a general purpose net result from the particular
    machine. So may we each one of us, as it were, attain the same kinds of learning
    and the same kind of thinking little modified by genic differences.


    I do not wish to take sides on these issues. I merely wish to say that if one
    is to take an impartial and dispassionate view, one cannot afford to espouse deeply
    any fixed pattern of thinking with regard to these matters. I would prefer to
    see talented individuals with large mental capabilities investigating their own
    minds to the very depths. I want to aid these individuals in their communication
    of the results to others, with similar yet different talents. I believe that by
    using certain methods and means, some of which are presented in this work, truly
    talented and dedicated individuals can forge, find, and devise new ways of looking
    at our minds, which are truly scientific, intellectually economical, and interactively
    creative. Consider, for example, the case of the fictitious individual created
    by the group of mathematicians masquerading under the name of Dr. Nicholas Bourbaki.


    This group of mathematicians, in order to create a mathematics or sets of mathematics
    beyond the capacity of any one individual, held meetings three times a year and
    exchanged ideas, then went out and worked separately. The resulting papers were
    published under a pseudonym because the products of this work were felt to be
    a group result beyond any one individual’s contribution.


    Whether or not this group was greater or less than a single human mind, operating
    in isolation on similar materials, will not be known for some time. It may be
    that the human computer interlock achieved among these mathematicians created
    a new entity greater than any one of them in regard to modes of thinking, complexity
    of thinking and creative new ideas. Certain kinds of things that Man does of necessity
    require tremendous amounts of cooperation over very large numbers of individuals.
    Such accomplishments are beyond any one individual and are a product only of the
    group effort. This is true, for example, in building the Empire State Building,
    a subway system, a railroad system, an airline, a large industrial factory, etc.
    In each of these cases there is rearrangement of external realities, a setting
    up of a communication network between many individuals and a dedication of each
    of these individuals to the purposes of the organization of which they are a part.
    This is probably the greatest accomplishment of our industrial, military, educational
    and religious efforts in this century. Man’s effective interlock with other men
    can accomplish certain kinds of things beyond any individual.


    However, in certain areas, gifted, talented, intelligent individuals seem to function
    almost autonomously as solitary computers giving rise to new findings. This is
    seen in the case of the mathematical geniuses raised in isolation. One is almost
    afraid to educate such people for fear that they will lose their general purpose
    nature and their ability to make original creative contributions. Somehow or other
    they have escaped interlock with Man’s ever pervasive social organizations and
    their demands. As in the case of the creative physicist Moseley, who was drafted
    and killed in World War I, such talent can be thrown away by the necessity of
    interlock in our society. There is a point of view in the modern world and there
    are divisions among intellectuals which are wasting our use of talent. There are
    antithetical philosophies which cause diverse intellectual activities. It may
    be that such conflict is necessary for the intellectual advancement of each individual.
    It may also be completely superfluous and nonsensical. C. P. Snow has pointed
    out in his writings (especially about the two cultures) that kind of social dichotomy
    about which I speak. The value systems of each intellectual reflect his prejudices,
    his biases, his blindnesses, as well as his areas of competence. It seems to be
    a very foolish maneuver to take that which one knows, in which one is excellent
    and raise it above the general intellectual level of all others by literally dig
    an intellectual moat around one''s field. To dig this moat one demeans and denigrates
    areas of knowledge and individuals in those fields. This kind of activity seems
    to be almost built-in in our structure as biological organisms.


    + 2 Schrodinger (1945)


    J. C. L. 1967

    St. Thomas, U.S. Virgin Islands


    xxvi


    ## Introduction


    > "The general purpose computer is... a machine in which the operator can prescribe,
    for any internal state of the machine and for any given condition affecting it,
    what state it shall go to... All behaviors are at the operator''s disposal. A
    program... with the machine forms a mechanism that will show any behavior. This
    generalization has largely solved the main problem of the brain so far as its
    objective behavior is concerned; the nature of its subjective aspects may be left
    to the next generation, if only to reassure them that there are still major scientific
    worlds left to conquer." (W. Ross Ashby, "What Is Mind?" in Theories of the Mind,
    Macmillan, New York, 1962)


    The relations of the activities of the brain to the subjective life in the mind
