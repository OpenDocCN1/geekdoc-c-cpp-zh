    以及人类心灵。例如，“受暗示性”（suggestibility）这一术语通常用于编程以及被外部人员编程的有限语境中。当给定的计算机允许被另一台计算机某种程度上完全地编程时，就会催眠现象。元编程（Metaprogramming）被认为比受暗示性更具包容性的术语。元编程考虑来源、输入、输出和中心过程，而不仅仅是过程的结果（见图1）。受暗示性仅命名了接收并执行指令的属性，而没有考虑来源、输入、输出和中心过程（参考
    H. Bernheim, Clark Hull）。


    - 16. 心灵（Mind）被定义为给定人类计算机所有程序和元程序的总和，无论这些程序对于自身或他人而言是否是立即触发、检测和可见运行的。（因此，在另一种术语中，心灵包含了无意识和本能程序。）这种定义和基本假设比旧的术语和概念具有各种启发性优势。有了这组新定义，心脑二元论就不再必要了。心灵是程序和元程序的总和，即人类计算机的软件。


    - 17. 大脑（Brain）被定义为包含在人类计算机中的可见、可触的活结构集合；计算机在体内的真实边界尚待完全描述（例如，来自目标器官的生物化学和内分泌反馈）。当然，大脑的边界可以被视为中枢神经系统向外延伸的极限。人们还将包括所谓的自主神经系统以及中枢神经系统（CNS）。


    - 18. 在人类思维和努力的某些领域，有必要引入第三种实体，这种实体有时包含、有时不需要大脑-心灵-计算机；通常这个实体由神学家和其他对宗教感兴趣的人定义为存在。在这一物质框架内，使用“精神”（spirit）或“灵魂”（soul）或其他术语并不重要。这些术语在讨论存在的终极意义、心脑计算机的起源、身体死亡后自我的终结或去向，以及心脑计算机内部或外部是否存在比我们更大的的心灵时，不可避免地会出现。这个额外的脑-心灵-计算机实体可以在需要时包含在这一理论中。（我同意，可能需要这样的假设来赋予整个人类整体意义。宗教是一个实验科学领域。该领域从伟大的心理学家威廉·詹姆斯（William
    James）的基本假设开始工作。该理论这一领域的定义在未来可能会扩展。届时可能会开发诸如“脑-心灵-精神-计算机”之类的复合术语）。关于这第三种实体，仍有待满足的存在性问题。有些人假设它存在；另一些人则假设它不存在。


    - 19. 某些化学物质具有程序化和/或元程序化的影响，即它们改变了计算机的运行，某些在程序层面，另一些在元程序层面。在元程序层面引起兴趣的某些物质是那些允许重新编程的物质，以及那些允许并促进元程序修改的物质。（这些物质的旧术语带有诊断、治疗、医学、道德、伦理和法律的内涵）。为了具有科学上的实用性，这些社会内涵被移除了。诸如“精神药学活性药物”、“精神病态模拟剂”、“镇静剂”、“麻醉剂/毒品”、“药物（drugs）”、“麻醉药”、“镇痛药”等术语在新理论中被使用，不再带有治疗、诊断、道德、伦理和法律内涵；这一整个领域都应该在以新理论为考量的基础上进行仔细的重新评估。将良好的理论应用于社会层面可能有助于揭开这一争议领域。


    例如，“编程物质”这一术语可能适用于赖造酸二乙酰胺（LSD）等化合物。对于酒精等物质，“元程序衰减物质”（metaprogram-attenuating substances）可能有用。同样，所提出的理论在精神药学、神经生理学、生物化学和心理学等经典领域的其他领域也可能有用。大脑本身的一些详细操作可以通过操作性组织，以展示程序是如何通过神经块和层之间以及内部的兴奋-抑制-去抑制模式来执行的（例如，网状激活-抑制系统、奖励-惩罚系统、大脑皮层条件系统等）。


    - 20. 本意并非希望我在这一版本的理论的新定义中表现得教条。


    记录想法的速度比概念的完美和推导出内在一致性的终极更为重要。随着理论的增长，其准确性和适用性也会随之增长。该理论旨在在不牺牲模糊概括性中特异性的情况下，保持尽可能的开放。所选的语言尽可能接近基础英语。


    随着理论的发展，可能会发展出适当的符号系统，简洁地总结要点，并允许通过逻辑操作来阐明各种情况下论证的详述。


    众所周知，哺乳动物大脑的通用“机器语言”尚未被发现。每个特定人类案例中基础原生语言的个体差异。在用于自我编程的自我元程序语言表示的所有层次和每个层次涵盖了计算机总操作的大部分区域，而不是其局部操作的细节。计算机操作的某些概念一旦有效引入给定的心灵-脑-计算机，就会迅速改变其元程序。语言现在在编程过程中具有了新的精确性和力量。


    - 21. 某些类型的主观经验向自身揭示了计算机运行某些方面。意识状态的变化有助于勾定这些操作边界和限制的某些方面。通过特殊技术，可以对通常无法获取的存储区域进行检查。存储程序的特殊方面和区域可以可视化、感知、听到、经历或重放，或者通过特殊技术和特殊指令从记忆存储中提取。提取可以限于一种感官模式，也可以同时进行运动播放。


    - 22. 在从存储中提取之后甚至期间，在某些范围内可以实现所需的衰减、修正、增加和具有特定衰期的新的创作。这些可以在意识中以（固定但尚未确定的）衰期进行，并随后可以在一定范围内被削弱、修改或替换。对于受到拮抗元程序影响的某些类型程序，会出现不可修改的衰期，即削弱、修改或替换程序的指令作为已有程序或元程序的拮抗元程序。


    - 23. 可以开发新的意识区域，超越目前对自我的意识理解。通过勇气、坚毅和坚持，可以跨越之前的边界，进入主观意识和经验的新领域。在最深层的探索中发现了新知识、新问题、新谜题。这些领域似乎超越了心脑计算机本身的操作。在这些领域可能需要元计算机映射；但必须首先发现、识别并重新编程计算机自身构建的逃避。新知识在成熟的沉思分析后通常被证明仅仅是隐藏的知识。


    - 24. 从存储中提取的某些材料似乎具有回溯到本开始时间之前的属性。

