    # Preface to First Edition


    This work is the result of several years of personal effort to try to understand
    the various paradoxes of the mind and the brain and their relationships. It is
    felt that the basic premises presented in this work may help resolve some of the
    philosophical and theoretical difficulties which arise when one uses other viewpoints
    and other basic beliefs.


    Some of the major philosophical puzzles are concerned with existence of self,
    with the relation of the self to the brain, the self to the mind, and self to
    other minds, the existence or nonexistence of an immortal part of the self, and
    the creation of and the belief in various powerful phantasies in these areas of
    thought.


    In Man there is a basic need for imagining wish-fulfillments. Man''s wishing thinking
    becomes interwoven among his best science and even his best philosophy. For the
    intellectual and the emotional advancement of each of us, we need certain kinds
    of ideals. We also need ways of thinking which look straight at the inner realities
    as at the physical-chemical-biological outer realities. We need truly objective
    philosophical analysis inside ourselves as well as outside ourselves. This work
    is a summary of a current position in progress to try to attain objectivity and
    impartiality with respect to the innermost realities.'
- md: '

    One might well ask where is such theory applicable? Once mastered, it may be directly
    applied in self-analysis. If one remembers that one''s self is a feedback-cause
    with other human beings, one can start at this personal end of the system and
    achieve beginnings of interhuman analysis by analyzing one''s self first. If successful,
    one may see one''s self operating in improved fashions with other people, and,
    as judged by one''s self and, much later, as judged by others. The reflections
    of one''s intellectual and emotional growth later may begin to be distributed
    and are then seen operating in one''s interhuman transactions with one''s wife,
    children, relatives, colleagues, and professional and business contacts.


    The persons who can understand and absorb this kind of theory need to understand
    over a broad intellectual and emotional front. Each one needs understanding and
    training in depth in multiple fields of human endeavor. Those persons who probably
    can understand it best are the general scientists.* Among those in this group
    to whom I have presented the theory, there was immediate understanding and an
    immediate grasping of the basic fundamentals and of the consequence of the theory.


    A second group who have no difficulty with the computer aspects but who may have
    difficulty with the subjective aspects is that large group of young people who
    are becoming immersed more and more in computers, their use and programming. A
    few of these may have the necessary biological and psychoanalytic background to
    understand this viewpoint. Additional training may be given to these few in self-analysis
    itself.


    Several members of a third group may find it useful to further study, the classically
    trained psychoanalytic scientists.


    The psychoanalytic group may have difficulties in that very few are trained in
    the general purpose types of thinking involved in general purpose computers.


    There are difficulties in the way of a multidisciplinary group, as a group, to
    use this theory. It seems necessary that each individual absorb the necessary
    kinds of thinking and kinds of motivations involved in each of the fields represented.
    Members of such groups can motivate one another to do individual learning in these
    various areas and can help one another learn in these various areas. It is up
    to each responsible individual to absorb enough to gain understanding on the levels
    presented.


    As with most insights into the innermost realities, it is felt that many of the
    advantages of this viewpoint cannot be seen directly until this way of thinking
    is absorbed into one''s mind. The thinking machinery itself is at stake here.
    Once absorbed and understood, I have found it possible to see that the properties
    and the operations of one''s mind in many different states can be accounted for
    somewhat more satisfactorily. With the resulting increased control over conscious
    thinking and preconscious computations, with the newly enhanced respect for one''s
    fixed unconscious (as if built-in) programs, the integration of one''s self with
    the deeper inner realities becomes more satisfactory.


    The theory is phrased in definite statements. However, it is not intended that
    the reader take this version as definitive, final, completed, or closed. Each
    of these definite statements is to be accepted only as a working hypothesis as
    currently presented by the author. My aim is not to make a new final philosophy,
    a new religion, or a new rigid way of approaching man''s intellectual life.


    My aim is to increase the flexibility, the power, and the objectivity of our currently
    limited mind and its knowledge of itself. We have come a long way from the lowly
    primate to our present level. (However, we have a long way to go to realize the
    best obtainable from ourselves.) One has only to look at the inadequacies of Man’s
    treatment of Man, and see how far we must go if we are to survive as a progressing
    superstitious species with better control of our battling animalistic levels.


    It is expected that this theory will be useful in understanding and in programming
    not only one''s self but other minds as well. Enhancement of the very human depths
    of communication with other minds may be approached. The current limits and the
    attainable limits for education, for reprogramming, for therapy and for cooperative
    efforts of all sorts between men, may be aided in the terms of here presented.
    This is at least a hope of the author. Only time and use of this kind of thinking
    can test out the further working hypothesis.


    One fact which must be appreciated for applying this theory is the essential individual
    uniqueness of each of our minds, each of our brains. It is no easy hard work to
    analyze either one''s self or someone else. This theory is not, cannot be, a miracle
    key to a given human mind. It is devilishly hard work digging up enough of the
    basic facts and enough of the basic programs and metaprograms controlling each
    mind from within to change its poor operations into better ones. This theory can
    help one to sort out and arrange stored information and facts into more effective
    patterns for change. But the basic investigation of self or other selves is not
    easy or fast. Our built-in prejudices, biases, repressions and denials fight against
    understanding. Our Unconscious automatically controls our behavior. Eventually
    we may be able to progress farther. It may take several generations of those willing
    to work on these problems.


    I have a question about the wisdom of publishing too much of me, myself. I hesitate
    to publish in this small work certain personal observations in depth and in detail.
    If the society in which we live were more ideal, I might so publish.(Possibly
    in such an ideal society there might be no need for such work.) I do not know
    the answer, nor do I espouse cause of those who feel they know either the yes
    or no answer. Frankly, I am an explorer in this area. My ambition is to be free
    to explore, not to exploit. I share what I experience because that is my profession
    to search, to find, to discuss, and to write within Science what I find. Let others
    use what I am privileged to find in their own professions, businesses, and/or
    pursuits. I have found that as soon as I go commercial, political, or any other
    motivational endeavor, I lose what I personally prize most: my objectivity, my
    dispassionate appraisal, my freedom to explore. To make money, cure someone, to
    rule, to be elected are all necessary and needing persons of high intellectual
    and dedicated maturity. I do not seem to be of those (maybe I did not choose).
    In the United States of America in 1966, insist on the explorer''s role in region
    of endeavor difficult to support. Grants for scientific research tend to be awarded
    by specialists to specialists; this is true in medical sciences as well as others.
    This current work cuts through too many specialties for that kind of. I hope someday
    that approaches as this one can be supported on their own merit. Respect for the
    Unknown is hard to come by. Support for a science devoted to the Innermost is
    needed.


    # Metatheoretical Considerations


    In general there are two opposing and different schools of thought on the basic
    origins of systems of thought or systems of mathematics. In a simplified way these
    two extreme positions can be summarized as follows:


    - 1. In the first position one makes the metatheoretical assumption that a given
    system of thinking is based upon irreducible postulates—the basic beliefs of the
    systems. All consequences and all manipulations of the thinking machine are then
    merely elaborations of, combinations of, these assumptions operating upon data
    derived from the mind and/or from the external world. This is called theistic
    school. This school assumes that one can, with sufficiently sophisticated methods,
    find these postulates which are motivating and directing a given mind in its operations.
    A further metatheoretical assumption is that once one finds this set of postulates
    then one can account for all of the operations of that mind. (Whitehead and Russell,
    1927; Carnap, 1942-46; Tarski, 1946.)


    - 2. The opposing school at the opposite end of a spectrum of schools, as it were,
    makes the metatheoretical assumption that thinking systems arise from intuitive,
    essentially unknowable, substrates of mental operations (Hilbert, 1950). This
    school states that new kinds of thinking are created from unknown sources. Further,
    one is not able to arrive at all of the basic assumptions.

    '
  mdcn: '

    人们可能会很好问，这种理论适用于何处？一旦掌握，它就可以直接应用于自我分析。如果一个人意识到自己是与他人互的反馈因果，那么就可以从这个系统的个人末端开始，通过首先分析自己，来实现人际分析的开端。如果成功了，你可能会看到自己在与他人相处时以更改进的方式运作，并经过自己的判断，以及在很久以后经过他人的判断。随后，对智力与情感成长的反思可能会开始扩散，并体现在你与妻子、孩子、亲属、同事以及专业和商务往来对象的人际交际中。


    能够理解并吸收这种理论的人，需要在广阔的智力和情感领域具备理解力。每一个人都需要在人类事业的多个领域接受深入的理解和训练。可能最能理解这种理论的人是**通用科学家**。在我向这组人员介绍该理论时，他们立即理解了它，并立即掌握了理论的基本原理及其后果。


    第二类在计算机方面没有困难、但在主观方面可能存在困难的人，是那大群日益沉浸在计算机及其使用和编程中的年轻人。其中少数人可能具有理解这一观点所需的生物学和心理分析背景。可以对这少数人提供关于自我分析本身的额外训练。


    第三组的几位成员，即受过古典训练的心理分析科学家，可能会发现进一步研究是有用的。


    心理分析小组可能会遇到困难，因为极少数人接受过通用计算机所涉及的通用型思维的训练。


    作为一个学科小组，使用这种理论存在困难。似乎每个人都需要吸收每个代表领域所涉及的必要思维类型和动机。这类小组的成员可以相互激励在这些各个领域进行个人学习，并帮助彼此在这些领域学习。这取决于每个负责的个体是否吸收了足够的内容以在提出的水平上获得理解。


    正如大多数对内在现实的洞察一样，人们觉得，这种观点的许多优势在这一思维方式被融入脑海之前，是无法直接看到的。这里的思维机制本身正处于关键。一旦被吸收和理解，我发现可以对许多不同状态下心灵的属性和运作得到某种更令人满意的解释。随着随之而来的对意识思维和预意识计算控制增强，以及对固定的无意识（如同内置的）程序的新新增强的尊重，自我与深层内在现实的整合变得更加令人满意。


    该理论以确定的陈述表述。然而，其目的并非让读者将这个版本视为定义的、最终的、完成的或封闭的。这些确定陈述中的每一个都应被视为作者目前提出的工作假设。我的目标不是建立一种新的终极哲学、一种新宗教，或一种接近人类智力生活的僵化方法。


    我的目标是增加我们目前有限的心脑及其自我认知的灵活性、力量和客观性。从低级灵长类动物到我们现在的水平，我们已经走了很远。（然而，要实现我们自己能获得的最好，我们还有很长的路要走。）人们只需要看看人类对待人类的不完善之处，看看如果我们作为一个进步的、迷信的物种，通过更好地控制我们斗争的动物性水平来生存的话，我们必须走多远。


    预计这种理论不仅对于理解和编写自我，对于理解其他心灵也有帮助。可能会增强与他人心灵这种极具人性的深层沟通。本文所提出的内容，对于教育、重编程、治疗以及人与各种合作努力的当前限制和可实现的限制，可能会有所帮助。这至少是作者的希望。只有通过时间和这种思维的使用才能测试进一步的工作假设。


    应用这一理论时必须意识的一个事实，是我们的每个心灵、每个大脑具有本质的个体独特性。分析自己或他人都不是一项容易的工作。这个理论不是、也无法成为特定人类心灵的奇迹钥匙。从内部挖掘足够的基础事实以及足够控制每个心灵的基本程序和元程序，以将其糟糕的运作转变为更好的，这是一项极其艰巨的苦差。这种理论可以帮助人们整理和安排存储的信息和事实，形成更有效的模式以进行改变。但对自我或其他者的基本调查并不容易或快速。我们内置的偏见、偏颇、压抑和否定在与理解作斗。我们的无意识自动控制我们的行为。最终我们可能进展得更远。这可能需要几代愿意致力于这些问题的人。


    对于发表过多关于我、自己的智慧，我有一个疑问。我犹豫是否在这部小书中发表某些深入且详细的个人观察。如果我们生活的社会更加理想，我可能会这样发表。（可能在这样一个理想的社会中，也许不需要这样的工作。）我不知道答案，也不支持那些认为自己知道是或否答案的观点。坦率地说，我是该领域的一个探险者。我的野心是自由地探索，而不是剥削。我分享我的经历，因为这是我的职业——在科学内搜索、发现、讨论并写下我发现的东西。让别人在自己的专业、业务和/或追求中使用我我有幸发现的东西。我发现，一旦我投身于商业、政治或其他任何动机行为，我就会失去我个人最珍重的东西：我的客观性、我冷静的评估，我探索的自由。为了赚钱、治愈某人、统治、当选都是必要的，且需要高智力和奉献的人才。我似乎不是那些（也许我没有选择）。在1966年的美国，坚持探险者的角色很难获得。科学研究经费通常由专家授予专家；这在医学科学也是如此。目前的这种跨越了太多的学科。我希望有一天，这类方法能根据自身的价值获得支持。对未知的尊重很难获得。需要对致力于内在的科学的支持。


    # 元理论考虑


    通常，对于思维系统或数学系统的起源，存在两种对立且不同的学派观点。简单来说，这两个极端立场可以总结如下：


    - 1. 在第一种立场中，人们做出元理论假设，给定的思维系统建立在不可还原的假设——系统的基本信念之上。思维机器的所有结果和所有操作，仅仅是这些假设对源自心灵和/或外部世界的数据进行的阐述和组合。这被称为神论学派。该学派假设，通过足够复杂的方法，可以发现激励和引导给定心灵进行运作的假设。进一步的元理论假设是，一旦发现了这组假设，就可以解释该心灵的所有运作。（Whitehead
    and Russell, 1927; Carnap, 1942-46; Tarski, 1946.）


    - 2. 在学派光谱另一端的对立学派做出了元理论假设，思维系统产生于直觉的、本质上不可知的心理运作基底（Hilbert, 1950）。该学派声称，新的思维类型是从未知来源创造的。此外，人们无法得出所有的假设。

