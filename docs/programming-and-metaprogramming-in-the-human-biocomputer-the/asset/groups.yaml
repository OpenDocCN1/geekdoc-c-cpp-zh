    使用了行李电路，人们可以看到人类突然获得了一种此前所缺乏的、深度和能量上的互锁（interlock）。当计算机清除了意识水平以下不合理的循环反馈程序时，一种参与所有所有层面的突然意愿便随之产生并被使用。这处于系统的人类端。


    在系统的另一端物种端，用于互锁的个体选择则更具随机性。我们在野外捕捕海豚；我们并不知道它们如何选择（如果它们确实选择的话）供我们捕的群体。似乎在进行某种选择：我们接触过的大多数个体中，它们的计算机里完全不具备我们那样的无意识的敌意、无意识的恐惧程序；至少在我们研究所的人员手中没有。*
    很少捕到非常老的个体。


    对于海豚而言，可能无法浪费无意识电路去运行诸如“对智能个体的敌意与恐惧”这类无用的程序。它们在野外生存的条件要求彼此之间进行极快速且明确的合作与互锁。呼吸、鲨鱼、风暴、细菌疾病、病毒性疾病、人类的破坏以及其他因素的紧迫性，要求每一个都表现出热情和全意的投入（物种内部）。由于恐惧、敌意或其他内在忧虑而未能互锁，会导致快速死亡以及该类型计算机的不繁殖。


    如果方法正确，海豚会寻求与那些足够安全、能够在海水中公开（在所有层面）寻找它们的人类互锁。


    对于海豚，人类存在可能及可能的互锁通道。解剖学差异限制了通道，人类的社会禁忌也是如此。对于一个抑制极少、具备必要的敏感性、水下技巧、勇气、正确的程序以及必要的环境和支持的人类来说，存在许多通道：声音产生-听觉；肌肉动作-触觉-压力感受；存在-动作-视觉；性通道；采集-进；以及诸如元通道问题，如使用中的主动性、跨通道关系与通道内信号控制的同时进行，这些在每一端都无法被解码为信息等。


    我们已经训练自己和海豚去追求一种空气声语音和听觉通道。* 在这一通道中，我们发现了通往其他通道进展的线索：如果在展示一个程序和想要交流的元程序（metaprogram）欲望方面具有说服力，一方模仿另一端毫无意义的信号，而另一方坚持要求自己的信号在相同的基础上也被模仿。这导致了海豚模仿我们的游泳模式，例如，当我们模仿了它们的模式时。


    模仿似乎是用于展示“在我们体内的海豚”以及“海豚中的我们”模型状态的一个程序。人类在人-豚互锁中功能的充分性，是通过模仿所代表的反馈来衡量的。这种机制与人类模仿成人使用词汇（无论沉默还是发声）的机制相似但不相同，这些词汇尚未进入儿童的“存储”和“使用”程序中。


    > 4 交流研究所，佛罗里达州迈阿密和美属维尔京群岛圣托马斯。110


    ## 进一步研究的呼吁


    总之，呼吁开发一种交流者理论，即面对具有高质量大脑和假设的思维的非人类交流者时。该理论应包括开放的、非物种特异的、通用的、自我编程的相互尊重、自愿奉献、参与者理论者等基本假设。在这些假设之外，还有关于参与者的恰当选择、科学界的支持、兴趣，以及开放的专业人士在操作贡献水平上的合作假设。⁵


    ## 本文使用的逻辑总结：真、假、概率、元程序及其边界


    为了清晰起见，此处给出本文采用的逻辑说明。


    显而易见，本文至少采用了四值逻辑。有通常的“真”（true）和“假”（false）值；此外还有另一对，可以简称为称为“假设为真”（as if true）和“假设为假”（as
    if false）。这四个值中的每一个都可以应用于外部现实，也可以应用于人类生物计算机的内部现实。


    外部现实应用的符号如下，“true”和“false”重写时不带引号。“as if true”和“as if false”写为在 *true* 和 *false*
    前加一个星号（*true, *false）。对于内部现实的情况，即这些值在人类生物计算机的软件中出现，在“true”、“false”、“as if true”和“as
    if false”周围加上双引号（“*true”和“*false”）。


    在内部现实的情况下，对于这些值中的每一个，都有一个元程序，可以表述为：“将给定的元程序定义为真（或假）”。（在论文正文中，这是一种生存的基本信念，例如。）强度较弱的元程序是“将给定的元程序定义为假设为真，或将给定的元程序定义为假设为假”。在基本信念的实验中，“如果定义为‘true’，则该元程序在待定的范围内是‘true’；如果定义为‘*true’，则在待定的范围内是‘true’。”


    这些不同的值可以根据对其概率的判断以及对所需强度的定义进行修改。概率尺度上，1.0 表示绝对确定，概率递减到值 0 表示极不可能，再到 -1 表示不可能。此类值根据特定的元程序应用于每个逻辑类别中。


    这种逻辑系统认为可以在外部现实中以各种形式的联盟形式运行。一个联盟可以以“类似于内部判断”的方式运作，即它将某些事物定义为“真”，而这些事物在待定的范围内是真实的。人类法律的通常结构似乎共享这一特性。共识智慧（Galbraith）包含了这一逻辑系统。


    存在某些元程序和程序，它们具有一种外部证明的真假关系，这种关系在不危及生存的情况下无法在人类生物计算机内部被操纵。这些元程序和程序可以被视为人类生物计算机程序层面的某些指令，它们必须作为超元程序运行（即，必须承认这些程序的“内置的”、“对生存是必需的”本质）。


    这些“真”程序中的一些在生物科学中尚待确定。已确定的：对饥饿获取食物的必要性，性活动和愉悦的必要性，对疼痛和恐惧的适当反应（如逃跑、战斗）。


    设计用于使身体在重力场中生存的程序占据了人类计算机的大部分设备以及时间和能量。感官刺激的生理极限必须被严格维持，即光、声音等目前感知的水平不能过高或过低。外部温度和内部温度必须在一定范围内进行调节。疾病引入了新的程序，包括由于自我元编程导致的疾病。

