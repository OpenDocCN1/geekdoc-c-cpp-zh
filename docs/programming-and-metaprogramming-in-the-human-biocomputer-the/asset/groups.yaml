    staff at Float On for this extraordinary effort: Graham Talley, Quinn Zepeda,
    Christopher Messer, Ashkahn Jahromi, Jake Marty, Ian McIntosh, and Jeanine Bocci.


    This work chronicles the inner workings of the human brain, and its capacity for
    information processing, using computer programming language as its model. Dr.
    Timothy Francis Leary considered it to be one of the greatest ideas of the 20th
    Century.


    The original report was dated February 1, 1967 with revisions as of February 1968.
    Programming and Metaprogramming in the Human Biocomputer was the Final Report
    for Research Grant #5-K6-MH-18, 700-05, culminating a 5 year career award from
    the National Institute of Mental Health, Bethesda, Maryland. The work herein is
