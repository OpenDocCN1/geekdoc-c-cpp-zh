    When I said we may be our programs, nothing more, nothing less, I meant the substrate,
    the basic substratum under all else, of our metaprograms is our programs. All
    we are as humans is what is built-in and what has been acquired, and what we make
    of both of these. So we are one more result of the program substrate, the self-metaprogrammer.


    As out of several hundreds of thousands of the substrate programs comes an adaptable,
    changing set of thousands of metaprograms, so out of the metaprograms as substrate
    comes something—the controller, the steersman, the programmer in the biocomputer,
    the self-metaprogrammer. In a well-organized biocomputer, there is at least one
    critical control metaprogram labeled I for acting on other metaprograms and labeled
    me when acted upon by other metaprograms. I say at least once advised. Most of
    us have several controllers, selves, self-metaprograms which divide control among
    them, either in time parallel or in time series in sequences of control. As I
    will give in detail later, one path for self-development is to centralize control
    of one’s biocomputer in one self-metaprogrammer, making the others into conscious
    executives subordinate to the single administrator, the single superconscious
    self-metaprogrammer. With appropriate methods, this centralizing control, the
    elementary unification operation, is a realizable state for many, if not all biocomputers.
    Beyond and above in the control hierarchy, the position of this single administrative
    self-metaprogrammer and his staff, there may be other controls and controllers,
    which, for convenience, I call supraself-metaprograms. These are many or one depending
    on current states of consciousness in the single self-metaprogrammer. These may
    be personified as if entities, treated as if a network for information transfer,
    or realized as if self traveling in the Universe to strange lands or dimensions
    or spaces.


    If one does a further unification operation on these supraself-metaprograms, one
    may arrive at a concept labeled God, the Creator, the Starmaker, or whatever.
    At times we are tempted to pull together apparently independent supraself sources
    as one. I am not sure that we are quite ready to do this supraself unification
    operation and have the result correspond fully to an objective reality.


    Certain states of consciousness result from and cause of this apparent unification
    phenomenon. We are still general-purpose computers who can program any conceivable
    model of the universe inside our own structure, reduce the single self-metaprogrammer
    to a micro size, and program him to travel through his own model as if real (level
    6, Satori +- Lilly, 1972). This property is useful when one steps outside it and
    sees it for what it is—an immensely satisfying realization of the programmatic
    power of one''s own biocomputer. To overvalue or to negate such experiences is
    not a necessary operation. To realize that one has this property is an important
    addition to one''s self-metaprogrammatic list of probables.


    Once one has control over modeling the universe inside one''s self, and is able
    to vary the parameters satisfactorily, one''s self may reflect this ability by
    changing appropriately to match the new property. The quality of one''s model
    of the universe is measured by how well it matches the real universe. There is
    no guarantee that one''s current model match the reality, no matter how certain
    one feels about the high quality of the match. Feelings of awe, reverence, sacredness
    and certainty are also adaptable metaprograms, attachable to any model, not just
    the best fitting one.


    Modern science knows this: we know that merely because a culture generated a cosmology
    of a certain kind and worshiped with it, was no guarantee of goodness of fit with
    the real universe. In so far as they are testable, we now proceed to test (rather
    than to worship) models of the universe. Feelings such as awe and reverence are
    recognized as biocomputer energy sources rather as determinants of truth, i.e.,
    of the goodness of fit of models vs. realities. A pervasive feeling of certainty
    is recognized as a property of a state of consciousness, a special space, which
    may be indicative or suggestive but is no longer considered as a final judgment
    of a true fitting. Even as one can travel inside one''s models inside one''s head,
    so as one can travel outside or be the outside of one''s model of the universe,
    still inside one''s head (see Lilly 1972 level or state +3, Satori +3).


    In this metaprogram it is as if one, the creator, unites with God. Here one can
    attenuate the self that it may disappear. One can conceive of other supraself-metaprograms
    farther out than these, as are given in Olaf Stapledon''s *The Starmaker* (Dover,
    New York, 1937). Here the self joins other selves, touring the reaches of past
    and future time and of space, everywhere. The planet-wide consciousness joins
    into solar systems into galaxy-wide consciousness. Intergalactic sharing of consciousness
    fused into the mind of the universe finally faces its creator, the Starmaker.
    The universe''s mind realizes that if its creator knows its imperfections and
    will tear it down to start over, creating a more perfect universe.


    Such uses of one''s own biocomputer as the above can teach one profound truths
    about one''s self, one''s capabilities. The resulting states of being, of consciousness,
    teach one the basic truth about one''s own equipment as follows:


    In the province of the mind, what one believes to be true is true or becomes true,
    within certain limits to be found experientially and experimentally. These limits
    are further beliefs to be transcended. In the mind, there are no limits (Lilly,
    1972).

