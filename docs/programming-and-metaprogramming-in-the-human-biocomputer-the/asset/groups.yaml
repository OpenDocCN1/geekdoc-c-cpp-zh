    are seen as time-varying functions. Not only is there an apparent geometrical
    factor fixed to the body coordinates but there is a varying set of factors. It
    is the latter set that are locked in by an unconscious program for perception
    and for feelings. For the evocation of these programs in the LSD-25 state the
    beliefs for the day metaprogram determines the outcome. The patient says to himself
    the presences seen come from outside me and my program storage. These metaprogrammatic
    orders then are used in his computer to construct and modify whatever apparently
    comes in to create presences and at the same time to place the presences outside
    the computer itself. Thus these orders are essentially used twice: (1) for constructing
    a basic belief about the external reality of the presences and (2) for a display
    that demonstrates the results of computations using that belief. The belief is
    used on incoming signals with uncertain or distorted origins. Without LSD-25 this
    patient finds it difficult if not impossible to program such projections. He cannot
    use this basic belief counter to the powerful external reality 71 program. It
    may be possible for him to use this belief without the LSD-25 state in possibly
    other extreme conditions, such as in the presence of white noise of large magnitude,
    the hypnagogogic state, the dreaming state in sleep, or during hypnotic trance.


