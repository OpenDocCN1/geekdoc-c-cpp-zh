    # 元程序规避行为的定义


    在用“规避”（evasion）一词时，其含义类似于防御性策略或心理分析文献中的防御性策略的概念。然而，除了这些概念的内容外，规避被定义为：为了避免、隐藏或扭曲一个更深层的程序或元程序而进入的程序或元程序，而这个程序对于当时的自我程序员来说，太具有诱惑性、太具有威胁性或太混乱。


    在深层孤立状态的初期，许多人经历的恐惧是一种几乎脱离肉体的恐惧，在外部现实中没有指涉物。通过经验，可以证明这种恐惧是对个人自身内在未知的恐惧。在对各种规避性元程序进行彻底探索后，可以证明，在这个领域唯一需要恐惧的是恐惧本身，即压倒性的恐惧。通过充分的训练，可以证明可以将经历的情感的动机信号从负面转为正面。至于是否必须经历某些负面情绪，以体验足够的惩罚性方面从而避免它们，这仍然是一个未解决的问题。在这种情况下，需要大量的自律来追求存储在记忆中的、带有负面色彩的程序和元程序。有时，人们可以察觉到一种对于进一步考虑不愉快事件和记忆的近乎享乐主义的撤退。这些向快乐的规避也是对进一步自我分析的规避。随着人们清理了越来越多不愉快程序和元程序的区域，日益增加的愉快编程和元编程及其控制，可能会成为对个人自我分析理想的一种极具诱惑力的规避。


    正是在这一点，必须避免过于频繁地暴露于这些情况下。必须进行长时间与外部现实的互动。有时这可能需要数月的外部工作，将个人的发现与他们选择所生活的真实世界相整合。


    LSD25状态下易被激发的快乐对某些人来说可能成为一个主要目标。为了确保不被这种诱导的快乐状态所吸引，明智的做法是避免进行几周或几个月的进一步实验，并重新在外部现实中获得快乐的能力。从环境中获取快乐的外部现实竞争有其自身的规则，必须现实地、智慧且平衡地满足。在这里显而易见，自我元程序员的自律至关重要。没有自律，自我分析无法取得进一步进展。


    带着这种谨慎，让我们回到深层孤立状态。在零级外部现实状态下，使用任何外部现实屏幕都可以被定义为一种防御策略，以避免视觉化或经历个人在计算机深层中（即无意识中）最恐惧的事物。屏幕的使用是进入过程中的必要且有用的步骤，也是日后返回以确认发现的有用步骤。在深层物理孤立状态下存在着一个看似矛盾的现象：一个人正在追求自我分析，并获取自身内部快乐的钥匙，以及减轻自身痛苦和恐惧的钥匙。


    然而，一旦一个人解锁了快乐并减轻了痛苦，就必须利用由此释放的能量，并将它们以某种方式附接到外部现实程序和他们所建立的理想（超自我元程序）上。人们不会在享乐主义和自恋的满足中耗尽所有这些快乐。LSD25经历的陷阱之一正是在于：人现在有能力扩张的快乐状态中停留几个小时。这可能变得非常有吸引力，人可能会变得非常懒惰，并在每个机会回到这种状态。然而，这不是自我分析，这种状态是那些为了宗教目的使用LSD25的宗教支持者所追求的狂喜、极乐或超越状态。


    这些发现与经典心理分析中的发现非常相似，甚至完全相同。在分析过程中，由于重复和否认，快乐活动的获取迅速增加。同样存在变成一个追求快乐生物的诱惑；然而，这种倾向也必须在经典情的情况下进行分析。


    当人们将经典分析状况与孤独的自我分析状况进行比较时，必须非常清楚每种情况下牺牲了什么。外部分析师在场倾听一个人产生素材的优势在于，人们避免了孤独中的某些陷阱，因为在人们过度卷入其中之前，可以快速指出上述某些规避行为。另一方面，分析师的解释可能会分散人们追求自身自我分析的深层层面的注意力。即使是使用LSD25的孤独自我分析，在发掘出大量强大作用的无意识程序时，有时也应该咨询外部分析师。某些程序在经历深度的孤独和孤立后往往会表现出来，正如它们在经典分析中一样。


    30


    这是这种技术的风险和赌博之一。这就是为什么警告人们使用那些对心理分析本身已经非常精通的对象。


    在经典心理分析过程中，人们开始将自己的计算机和自我程序员包含分析师所使用的计算方法的许多方面。人们就此积累了一个自我分析的元程序，其中包含了分析师提供的关于个人计算机的大量内容。在经典心理分析术语中，人们倾向于吸收分析师的许多方面。一旦人们有了一个功能良好的内部分析师（即一个用于自我元程序的分析元程序），就可以独立进行，不再像以前那样同样地需要外部分析师。一个人的分析已经从外部的分析师转向内部的分析师。


    在深层孤立和LSD25分析中可以看到类似的情况。上述对外部屏幕和外部投影方法的描述强调了计算机与外部现实之间的关系。它还强调了计算机正在使用某些部分将记忆中的数据转换并投影到受外部能量激发的系统中。指出，由于这些系统没有受到外部世界的能量激发，这种投影更容易。无法在空白屏幕上投影或使用未受外部能量激发的装置的主要原因是对孤独状态下意识水平以下事物的极大恐惧。一旦大量的此类恐惧被分析并证明是异常幼稚的，就可以进入下一阶段的LSD25结合隔离分析。


    # 内部认知空间


    当人们从外部投影分析转向内部投影分析时，将外部能量对投影系统的激发转变为这些系统缺乏这种激发。例如，在浮力室深邃的黑色黑暗中，没有视觉刺激进入眼睛或视觉系统。同样，在深度的寂静中，没有声音进入声学设备，同样其他系统受到外部世界的刺激水平非常低。


    人们可能因此认为这些系统看起来是绝对安静、黑暗和空空的。事实并非如此。这是大多数受者开始遇到问题的区域。这也是精神病和临床判断可能干扰现象自然发展的区域。在缺乏通过自然器官进入的外部激发的情况下，感知系统维持了这种活动。这种活动的激发来自计算机的其他部分，即来自程序存储和身体内部的激发源。自我程序员最初将这些感知空间的填充解释为这种激发来自外部的。换句话说，激发的来源被自我解释为来自真实世界。对于某些类型的人和人格来说，这在某个领域是一个非常令人困扰的经历；对他们来说，只有用心灵感应才能解释。'
