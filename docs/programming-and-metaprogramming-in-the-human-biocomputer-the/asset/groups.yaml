    # # Introduction


    > "The general (purpose) computer is... a machine in which the operator can prescribe,
    for any internal state of the machine and for any given condition affecting it,
    what state it shall go to next... All behaviors are at the operator''s disposal.
    A program... with the machine forms a mechanism that will show (any think) behavior.
    This generalization has largely solved the main problem of the brain so far as
    its objective behavior is concerned; the nature of its subjective aspects may
    be left to the next generation, if only to reassure them that there are still
    major scientific worlds left to conquer." (W. Ross Ashby, "What Is Mind?" in Theories
    of the Mind, Macmillan, New York, 1962)


    The relations of the activities of the brain to the subjective life in the mind
    have long been an arguable puzzle. In this century some advances in the reciprocal
    fields of study of each aspect of the question apparently can begin to clear up
    some of the dilemmas. This is a report of a theory and its use which is intended
    to attempt to link operationally, the:


    +   (a) mental subjective aspects,

    (b) neuronal circuit activities,

    (c) biochemistry, and'
- md: '

    (d) observable behavioral variables.


    The sources of information used by the author are mainly:


    - (1) the results and syntheses of his own experiments on the CNS* and the behavior
    of animals,


    - (2) the experiences and results of experiments in profound physical isolation
    on himself,


    - (3) his own psychoanalytic work on himself and others,


    - (4) his studies and experience with the design, construction, operation and
    programming of electronic solid state digital stored-program computers,


    - (5) studies of analogue computers for the analysis and conversion of voice frequency
    spectra for man and dolphin and the online computation of multiple continuous
    data sources


    - (6) studies and experiments in neuropsychopharmacology


    - (7) research on and with communication with humans, with dolphins, and with
    both


    - (8) study of certain literature in biology (B), logic (L), neuropsychopharmacology
    (N), brain and mind models (M), communication (T), psychoanalysis (P), computers
    (C), psychology (O), psychiatry (I), and hypnosis (H) (see References and Bibliography).


    The introduction of open-minded, multiple-level, continuously developing, online,
    operational, dynamic, economical, expanding, structural-functional, field-jumping,
    field-ignoring theory is needed. The applications of this theory extend from the
    atomic-molecular-membranes-cell levels, though cell aggregational levels, total
    behavior and mental-cognitive levels of the single organism of large brain size,
    and to dyadic and larger groups of such individuals.


    ## BASIC ASSUMPTIONS


    The basic assumptions are as follows:


    - 1. The human brain is assumed to be an immense bicomputer, several thousands
    of times larger than any constructed by Man from non-biological components by
    1965.


    The numbers of neurons in the human brain are variously estimated at 13 billions
    (1.3 times ten to the tenth) with approximately five times that many glial cells.
    This computer operates continuously throughout all of its parts and does literally
    millions of computations in parallel simultaneously. It has approximately two
    million visual inputs and one hundred thousand acoustic inputs. It is hard to
    compare the operations of such a magnificent computer to any artificial ones existing
    today because of its very advanced and sophisticated construction.


    - 2. Certain properties of this computer are known, others are yet to be found.
    One of these properties obviously is a very large memory storage. Another is control
    over hundreds of thousands of outputs in a coordinated and programmed fashion.
    Other examples are the storage and evocation of all those complex behaviors and
    perceptions known as speech, hearing and language. Some of the more unusual properties
    of this computer are given further along in this paper.


    - 3. Certain programs are built-in, within the difficult-to-modify parts of the
    (macro and micro) structure of the brain itself. At the lowest possible level
    such programs which are built-in are those of feeding, eating, sex, avoidance
    and approach programs, certain kinds of fears, pears, etc.


    - 4. Programs vary in their permanence, some are apparently evanescent and erasable,
    others operate without apparent change for tens of years. Among the evanescent
    and erasable programs one might categorize the ability to use visual projection
    in the service of one''s own thinking. One finds this ability with a very high
    incidence among children and a very low incidence among adults. An example of
    a program operating without change for tens of years one can show handwriting,
    over a long series of years, to maintain its own unique patterns.


    - 5. Programs are acquirable throughout life. Apparently no matter how old a person
    is, there is still a possibility of acquiring new habits. The difficulties of
    acquisition may increase with age, however, it is not too sure that this is correct.
    The problem may not be with acquiring programs so much as a decrease in the motivation
    for acquiring programs.


    - 6. The young newly growing computer acquires programs as its structure expands
    some of these on the appearance of built-in permanence. An example of such acquisition
    of programs in a child is in the pronunciation of words. Once it agrees with those
    of the parents the pronunciation is very difficult to change later, i.e., there
    is really no great motivation for the child to change a particular pronunciation
    when it is satisfactory to those who listen.


    - 7. Some of the programs of the young growing computer are in the inherited genetic
    code; how these become active and to what extent is known only in a few biochemical-behavioral
    cases, at variance with the expectable and usual patterns of development. The
    so-called Mongoloid phenomenon is inherited and develops at definite times in
    the individual’s life. There are several other interesting clinical entities which
    appear to be genetically determined. To elicit the full potential of the young
    growing computer requires special environments to avoid negative anti-growth kinds
    of programs being inserted in the young growing computer.


    - 8. The inherited genetic programs place the upper and the lower bounds on the
    total real performance and on the potential performance of the computer at each
    instant of its life span. Once again we are assuming that the best environment
    is presented to the young organism at each part of its life span. It is not meant
    to imply that such an environment currently is being achieved. This basic assumption
    seems highly probable but would be very difficult to test.


    - 9. The major problems of the research which are of interest to the author center
    on the eraser, modifiability, and creatability of programs. In other words, I
    am interested in the processes of finding metaprograms (and methods and substances)
    which control, change, and create the basic metaprograms of the human computer.
    It is not known whether one can really erase any program. Conflicting schools
    of thought go from the extremes that one stores everything within the computer
    and never erases it to only the important aspects and functions are stored in
    the computer and hence, there is no problem of erasing. Modifications of already
    existing programs can be done with more or less success. The creation of new programs
    is a difficult assignment. How can one recognize a new program once it is created?
    This new program may merely be a variation on already stored programs.


    - 10. To date some of the metaprograms are unsatisfactory (educational methods
    for the very young, for example). It is doubtful if any metaprogram is fully satisfactory
    to the inquiring mind. Some are assumed to be provisionally satisfactory for current
    heuristic reasons. To keep an open mind and at the same time a firm enough belief
    in certain essential metaprograms is not easy; in a sense we are all victims of
    the previous metaprograms which have been laid down by other humans long before
    us.


    - 11. The human computer has general purpose properties within its limits. The
    definition of general purpose implies the ability to attack problems that differ
    not only in quantitative degree of complexity but also differ qualitatively in
    the levels of abstraction in the content dealt with. One can shift rapidly one''s
    mind and its attention from one area of human activity to another with very little
    delay in the reprogramming of one''s self to the new activity. The broader the
    front of such reprogramming the more general purpose computer is. The ability
    to move from the interhuman business world to the laboratory world of the scientist
    would be an example of a fairly general purpose computer.


    - 12. The human computer has stored program properties. A stored program is a
    set of instructions which are placed in the memory storage system of the computer
    and which control the computer when orders are given for that program to be activated.
    The activator can either be another system within the same computer, or someone,
    or some situation outside the computer.


    - 13. The human computer, within limits yet to be defined, has “selfprogramming”
    properties, and other persons-programming properties. This assumption follows
    naturally from the previous one but brings in the systems within the mind which
    operate at one level of abstraction above that of programming. As is shown in
    Fig. 1, one literally has to talk about selfmetaprogramming as well as selfmetrogramming.
    This does not imply that the whole computer could be thought as the self. Only
    small portions of the systems operating at a given instant are taken up by the
    selfmetaprograms. In other words there has to be room for the huge store of programs
    themselves, of already built-in circuitry for instinctual processes, etc. All
    of these exist in addition to others leaving only a portion of the circuitry available
    for the selfmetaprograms. The next section emphasizes this aspect.


    - 14. This computer has selfmetaprogramming properties, with limits determinable
    and to be determined.


    (Note: selfmetaprogramming is done conscientiously in metacommand language. The
    resulting programming then starts and continues below the threshold of awareness).
    Similarly, each computer has a certain level of ability in metaprogramming others-notself.


    - 15. The older classifications of fields of human endeavor and of science are
    redefinable with this view of the human brain

