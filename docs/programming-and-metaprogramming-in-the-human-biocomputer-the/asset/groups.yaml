    # Summary


    Some general ideas from extrapolation and reworking of modern general purpose
    computer theory are used to explain and to control some of the subjective aspects
    of the operations of the human brain. An addition (for the peculiarly human brain)
    to the theory of the general-purpose computers is the concept of the self-metaprogram
    or the internal programmer present in the $10^{10}$ neurons assembly known as
    the human brain. The self-metaprograms operate between the huge storage and the
    huge external reality. Selfprogramming properties (in addition to stored program
    properties) are essential to understanding mental operations and resulting external
    general purpose behaviors such as speech and language. Stored programs and metaprograms
    are characteristic of the human.


    The self-organizing aspects of computer programming and programs are now conceptually
    reasonable and realizable in modern non-biological computers. The human brain,
    a super-bio-computer, as it were, is a parallel processor – a realizable artificial
    machine with this structure has not yet been built. The actions of certain substances
    on the brain are explicable by this theory: examination of stored programs and
    reprogramming are opened by LSD25 (possibly by the introduction of small amounts
    of programmatic randomness,noise). In the child, automatic metaprogram implantation
    (or externally'
  - '[PAGE 178]


    forced metaprogramming), persisting as metaprograms below the levels of awareness
    in the adult, can be controlling for the later adult programs, adult thinking,
    and adult behavior. Energy can be taken from some of these automatic metaprograms
    and transferred to the selfmetaprogram with special techniques and special central
    states, chemically evoked. Some automatic unperceived programs are essential to
    biological nurture, survival, etc. Examples of methods, of investigations and
    of results in self-analysis and selfmetaprogramming are given.'
  - '[PAGE 179]


