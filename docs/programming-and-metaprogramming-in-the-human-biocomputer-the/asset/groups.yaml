    # DEFINITION OF EVASION OF

    ANALYSIS OF METAPROGRAMS


    In using the term evasion it is meant to imply a similar concept to defensive
    maneuvers or defenses of the psychoanalytic literature. However, in addition to
    the content of these concepts, evasion is defined as any program or metaprogram
    entered upon to avoid, to hide, or to distort a deeper program or metaprogram
    which is too seductive or too threatening or too chaotic for the selfprogrammer
    at that particular time.


    At the beginning fear in the profound isolation situation many people experience
    a fear which is an almost disembodied fear with no referents in the external reality.
    With experience this fear can be shown to be a fear of one''s own inner unknowns.
    After a thorough exploration of the various evasive metaprograms, it can be shown
    that the only thing to fear in this area is fear itself, in overwhelming amounts.
    With sufficient training it can be shown that one can convert the motivational
    sign of the experienced emotion from negative to positive. As to whether or not
    one must go through some of the negative emot in order to experience enough of
    the punishing aspects to avoid them is a moot point. A great deal of selfdiscipline
    is required in this instance to pursue the negatively tinged programs and metaprograms
    stored in memory. At times one can detect an almost hedonistic withdrawal from
    further consideration of unpleasant events and memories. These evasions into pleasure
    are also evasions of further selfanalysis. As one clears up more and more areas
    of unpleasant programs and metaprograms, the increasing amounts of pleasurable
    programming and metaprogramming and their control can become a very seductive
    evasion of one''s ideal of selfanalysis.'
  - '[PAGE 64]


    It is at this point that too frequent exposure to these conditions must be avoided.
    Long periods of interlock with the external reality must then be done. Sometimes
    this may necessitate months of outside work to integrate one’s findings with the
    real world as one has chosen to live in it.


    The easily evoked pleasure of the LSD25 state may become for some persons a major
    goal. To make sure that one does not get seduced by this induced state of pleasure
    it is wise to avoid further experiments for several weeks or several months, and
    reassert the natural accesses to pleasure in one’s external reality. The external
    reality struggle to obtain pleasure from the environment has rules of its own
    which must be met realistically and with intelligence and balance. It is here
    obvious that the discipline in the selfmetaprogrammer is absolutely essential.
    Further progress in selfanalysis cannot be made without selfdiscipline.


    With this caution let us return to the profound isolation situation. In the zero
    level external reality situation the use of any external reality screen can be
    defined as a defensive maneuver to avoid visualizing or experiencing what one
    fears most in the deeper levels of one’s computer, i.e., in the unconscious. The
    uses of the screens are necessary and useful steps on the way in and are useful
    steps to return to for confirmation at later times of the findings. An apparently
    paradoxical situation that exists in the profound physical isolation situation.
    One is pursuing selfanalysis and accesses to the keys to pleasure within one’s
    self and keys to lessening the pain and fear in one’s self.


    However, once one has unlocked the pleasure and attenuated the pain one must use
    the resulting released energies and attach them'
  - '[PAGE 65]


    somehow to the external reality programs and the ideals (supraself-metaprograms)
    which one has set up. One does not dissipate all of this pleasure in hedonistic
    and narcissistic gratification. One of the pitfalls of LSD25 experiences is exactly
    this: one has the power now to stay in an expanded state of pleasure, as it were,
    for several hours. This can become quite seductive and one can become quite lazy
    and return to this state at every opportunity. However this is not selfanalysis,
    this state is the ecstasy, or bliss or transcendent state sought by the religious
    proponents of the use of LSD25 for religious purposes.


    These findings are very similar if not identical to those found in classical psychoanalysis.
    On repetitions and denials are released during the analysis, the access of pleasurable
    activity increases rapidly. The same temptations exist to become a pleasure-seeking
    organism; however, this tendency too must be analyzed in the classical situation.


    When one compares the classical analytical situation to the solitudinous selfanalysis
    situation one must be quite aware of what has been sacrificed in each case. The
    advantage of the external analyst being present listening to one producing the
    material is that one avoids some of the pitfalls of solitude in that some of the
    above evasions can be pointed out rapidly before one became too involved in them.
    On the other hand the interpretations of the analyst can be a distraction from
    pursuing in depth aspects of one’s own selfanalysis. Even solitudinous selfanalysis
    using LSD25 should be referred back to an external analyst at times when large
    amounts of powerfully acting unconscious programs have been unearthed. Some programs
    tend to be acted out after profound solitude and isolation experiences, as well
    as they do during classical analysis.


    30'
  - '[PAGE 66]


    This is one of the risks and the gambles of this technique. This is why one is
    cautioned to use subjects who have become sophisticated with regard to psychoanalysis
    itself.


    During one''s classical psychoanalysis one begins to one''s computer and the selfprogrammer
    to include many aspects of the methods of computation that one''s analyst uses.
    One accumulates as it were a metaprogram of selfanalysis which incorporates a
    good deal of what one''s analyst has to offer with regard to one''s own computer.
    In classical psychoanalytic terms one tends to incorporate many aspects of one''s
    an analyst. Once one has a satisfactorily functioning internal analyst, i.e.,
    an analytical metaprogram for the selfmetaprogram, one can be launched on one''s
    own and no longer needs the external analyst to the same degree that one did earlier.
    One''s analysis has proceeded from the analyst outside to the analyst inside.


    An analogous situation can be seen in the profound isolation and LSD25 analysis.
    The foregoing descriptions of the external screens and external projection methods
    emphasize the relationship between the computer and the external reality. It also
    emphasized that the computer was using certain parts of itself for transformations
    and projections of data from memory into systems stimulated by energies coming
    from the external world. It was pointed out that such projections were easier
    to do than these systems were not excited by energies coming from the outside
    world. The major reason for failure to be able to project on the blank screens
    or to use the apparatus unexcited by energies coming from the outside world is
    too great fear of what lies underneath below the levels of awareness in the solinous
    situation. Once a large number of these fears have been analyzed and shown to
    be peculiarly childlike'
  - '[PAGE 67]


    and childish, one can proceed to the next stage of LSD25 and isolation combined
    for analysis.


    # INNER COGNITION SPACE


    As one proceeds from outer or external projection analysis to internal projection
    analysis, one moves the excitation of projection systems by external energies
    to a lack of such excitation in these systems. For example, in the profound blackness
    and darkness of the floatation room there is no visual stimulus coming to the
    eyes or the visual systems. Similarly in the profound silence there are no sounds
    coming into the acoustic apparatus, and similarly the other systems are at a very
    low level of stimulation from the external world.


    One might expect then that these systems would appear to be absolutely quiet,
    dark and empty. This is not so. This is the area in which most subjects begin
    to get into trouble. It is also the area in which psychiatric and clinical judgments
    may interfere with the natural development of the phenomena. In the absence of
    external excitations coming through the natural end organs the perception systems
    maintain this activity. The excitation for this activity comes from other parts
    of the computer, i.e., from program storage and from internal body sources of
    excitation. The selfprogrammer interprets the resultant filling of these perceptual
    spaces at first as if this excitation were from outside. In other words, the sources
    of the excitation are interpreted by the self as if coming from the real world.
    For certain kinds of persons and personalities this is a very disturbing experience
    in one sphere or another; for them it is explicable only with telepathy.'
- md: '

    We have been taught from babyhood that this kind of phenomena in a totally conscious
    individual is somehow forbidden, antisocial and possibly even psychotic.


    One must analyze this metaprogram that has been implanted in one from childhood,
    examine its rationality or lack of same and proceed in spite of this kind of an
    interpretation of the phenomena that occur. Once one has analyzed this as an evasion
    or a defensive maneuver against seeing the true state of affairs one can allow
    oneself to go on and experience the deeper set of phenomena without interfering
    with the natural metaprograms. After achieving this level of freedom from anxiety,
    one can then go on the next stages. (The programming orders for these inner happenings
    to take place are worked out in advance of the session, at first written down
    or spoken into a recorder. Later such orders can be programmed without external
    aids.)


    The following phenomenological description has been experienced by one subject
    under these special conditions. One experiences an immediate internal reality
    which is postulated by the Self. It appears to me that one''s own assumptions
    about this experience generates the whole experience. The experienced affects,
    the apparent appearance of other persons, the appearance of other beings not human,
    one''s own past fantasies, one''s own self-analysis, each can be programmed to
    happen in interaction with those parts of one''s self beyond one conscious awareness.


    The content experienced under these conditions lacks strong reality clues. Externally
    real displays are not furnished; the excitation from the reality outside does
    not pattern the displays. Therefore the projections which do occur are from those
    systems at the next inward level from the operations of the perception apparatus
    devoted to external reality.


    The phenomena that ensue are described by one subject as follows: the visualization
    is immersed in darkness in three dimensions at times but when one evades the emerging
    “multidimensional cognitive and conative space.” One is aware of “the silence”
    in the hearing sphere; this too gives way to the new space which is developing.
    The body image fluctuates, appearing and disappearing, as fear or other need builds
    up. As with the “darkness and the silence” so with the presence or absence of
    the body image. Progress in using these projection spaces is measured by one’s
    ability to neither project external reality data from storage into these spaces
    nor to project into these spaces “the absence of external reality stimuli.”


    One can project in the visual space living images (external reality equivalents)
    or blackness (the absence of external reality images). One can project into the
    acoustic spaces definite sounds, voices, etc. (as if external reality) or one
    can project silence (the absence of sound) in the external reality. One can project
    the body image also, flexing one’s muscles, joints, etc. to reassure oneself the
    image is functioning with real feedback or one can have a primary perception of
    a lack of the body image which is the negative logical alternative to the body
    image itself.


    In each of these dichotomized situations one is really projecting external reality
    and its equivalents (positive or negative). In order to experience the next set
    of phenomena one must work through these dichotomous symbols of the external world
    and realize that they are evasions of further penetration to deeper levels.


    Once one abandons the use of projection of external reality equivalents from storage,
    new phenomena appear. Thought and feeling take over the spaces formerly occupied
    by external reality equivalents. (In the older terminology ego expands to fill
    the subjectively appreciated inner universe). “Infinity” similar to that in the
    usual real visual space is also involved and one has the feeling that one’s self
    extends infinitely in all directions. The self is still centered at one place
    but its boundaries have disappeared and it moves out in all directions and extends
    to fill the limits of the universe as far as one knows them. The explanation of
    this phenomenon is that one has merely taken over the perception spaces and filled
    them with programs, metaprograms, and self-metprograms which are now modified
    in the inner perception as if external reality equivalents. This transform, this
    special mental state, to be appreciated must be experienced directly.


    In one’s ordinary experience there are dreams which have something of this quality
    and which show this kind of a phenomenon.


    At this level various evasions of realization of what is happening can take place.
    One can “imagine” that one is traveling through the real universe past suns, galaxies,
    etc. One can “imagine” that one is communicating with other beings in these other
    universes. However, scientifically speaking, it is obvious that one is not doing
    any of these things and that one’s basic beliefs determine what one experiences
    here. Therefore we say that the ordinary perception spaces, the ordinary projection
    spaces, are now filled with cognition and conation processes. This seems to be
    a more reasonable point of view to take than the oceanic feeling, the at oneness
    with the universe as fusing with Universal Mind as reported in the literature
    by others for these phenomena. These states (or direct perceptions of reality
    as they have been called) are one’s thought and feeling expanding into the circuitry
    in one’s computer usually occupied by perception of external reality in each and
    every mode, including vision, audition, proprioception, etc.


    A small digression here for purposes of clarifying problems of experiencing these
    phenomena. In addition to the above discussed factors about fears preventing these
    phenomena from developing, one must also neutralize various clinical psychiatric
    explanations and judgments about these phenomena. If one assumes that going through
    these phenomena is a dangerous procedure in that one might become enamoured of
    them and hence get into an irreversible psychosis, one can also be kept from experiencing
    these phenomena directly. Since the real necessary and sufficient conditions for
    the induction of a psychosis are not yet understood, one should not jump to the
    conclusion that these phenomena themselves are or can cause a psychosis in the
    field. This has yet to be proven to the satisfaction of everyone in the field.
    It may be that professional fear is preventing our further analysis of these phenomena.
    The whole issue of insight into one’s own mental processes, the whole issue of
    self-discipline and inspecting and understanding these processes are at stake
    here. Those who believe that a psychosis impending in all normal people have definite
    troubles with these phenomena. Heuristically such beliefs are untenable; such
    beliefs tend to weaken one’s self-discipline and make one rather unfit for such
    experiences.


    A satisfactory analysis of the clinical psychiatric sphere must take place in
    all trained subjects before proceeding further.


    Unless one can move philosophically and scientifically enough to see the utility
    of going through these experiences there can be a rapid withdrawal, a faulting
    out of self from the whole project. One is not willing to undergo the “dangers”
    that one sets ahead of time before going through.


    Candidly considered one may ask not this substance under these conditions change
    my brain and mind structure irreversibly out of my control? The proper controls
    on whether or not there are permanent changes have been done on animals nor on
    humans’ brains. So there definitely is a risk in this area. One is willing to
    gamble on this particular risk? It is wise to face up to these questions candidly,
    honestly, and ruthlessly. The issue of brain and mind injury is a current and
    important issue which has not been faced by the enthusiasts for LSD25. It is an
    issue constantly raised by those who are opposed to the use of LSD25. The science
    of finding out whether or not there is any truth in either side (pro or con) is
    lacking. The pro LSD group tries to do spectacular things using it. The congrroup
    looks at the enthusiasm of the other group and claims that they have lost their
    insight and are hedonistically overvaluing the effects experienced subjectively.
    The contragroup tend to claim brain damage and/or mind damage; the progroup tends
    to claim basic understanding of the mind, a new understanding of mental diseases,
