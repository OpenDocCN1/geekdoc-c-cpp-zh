    相信它们是“客观的”有效（而不仅仅是“形式上的”有效），并带着这一观点进行实验并对其进行解释。如果沿着这条路线下去，人们很快就会触及解释结果的能力终点。人们会发现，自己无法在概念上把握随之产生的现象。通过这种元理论（metatheory），这种经验不仅仅计算机在孤立、禁闭和孤独中运行，从记忆中提取预设的材料，而是实际上在与其他实体进行交流，而且它们对个人自我的影响是真实的。


    因此，在这种情况下，人们假设了关于基本假设的存在性假设，即：这些假设在独立于自我以及做出假设的个人之外，具有客观有效性。这种认识论立场也可以通过这些方法进行研究。这在某种程度上是阿尔德斯·赫胥胥（Aldous
    Huxley）以及许多许多其他团体所采取的立场。例如，这些人产生了对某些非西方哲学作为“终极真理”的追求。


    人们无法在这两个广泛的认识论基础上选边。一方面，我们拥有现代科学家的基本假设；另一方面，我们拥有对存在的宗教方面感兴趣的人的基本假设。如果在这个领域保持哲学思考和客观，就必须冷静地审视这两种极端元理论立场。


    从这些实验中中学到的一个基本教训是：通常情况下，个人对各种元理论立场的偏好，是由其对公正、客观和冷静视角的理想之外的考虑所决定的。大多数科学家所持有的元理论立场，是为了定义真理的目的，是为了在其特定科学领域内理解的目的，是为了获得其他科学家的认可，以及为了每个人针对自身无意识程序的内部安全运作。。可以预料到的是，在实验框架中将上述假设视为真实（即使是暂时的），会引起某些科学家产生焦虑。当来自意识水平之下的自动存在程序入侵自我元程序（self-metaprograms）时，很容易感到恐慌；这些程序可能冲击自我的存在、自我的控制、自我的起源、自我的终点，以及自我与已知外部现实之间的关系。


    对于所有这些现象，可能最安全的立场之一是本文中给出的观点，即形式主义观点——在这种观点中，人们假设计算机本身生成了所经历到的所有现象。这是现代科学可以接受的假设。这是所谓的常识假设。这是科学界同事们可以接受的假设。


    当然，这些考虑并没有触及，也没有证明这些假设或实验结果的有效性或无效性。为了让这一理论保持开放并允许未知的存在，有必要采取本体论和认识论的立场，即由于这种孤独实验的结果，无法得知现象是只能通过非生物计算机的干预解释，还是通过计算机内部的事件解释，或两者兼有。


    我想强调，没有必要因为某种真理是安全的就去拥护它。因为害怕另一组假设及其后果而被驱使接受某一组假设，是最感性、最不客观的哲学。有太多的知识分子和科学家（几乎是在无意识的情况下）利用基本假设作为他们对其他假设及其后果恐惧的防御。在我们能够训练自己保持冷静，并在不带傲慢、不带自大的情况下接受假设以及产生假设的结果，在不带错位的热情、不带恐惧、不带恐慌、不带愤怒、因此不对结果或理论产生情感投入之前，我们就无法让人类的这种内在科学向前走多远。


    那些希望通过拥抱另一组假设的真理来逃避现代科学基本假设的人也同样是有错的。那些在这类实验中必须与其他实体建立交流的人，显然会找到这种交流。人们必须意识到，（孩子）内心存在发现某些特定现象并将其奉为终极真理的需求。这种儿童般的需求决定了它们自己的元程序。


    我不赞同任何极端团体对这些结果的解释。对我来说，目前假设这些现象都发生在生物计算机内部是比较方便的。我倾向于假设超感应（ESP）没有发挥过作用。目前，这是我从逻辑意义上找到的最能站得住脚的立场。我不想对此持教条主义。我想指出，这就是我在描述这项工作特定阶段时的写作立场。我正在等待对替代性存在假设有效性的证明。


    如果那些充分削弱了对特定信念的童真需求的人，为目前不被接受的假设提供了良好的、硬实的、常识性的、明确的证据，我希望自己准备好冷静且彻底地审查它。群体相互锁定（group
    interlock）的陷阱与个人幻想的陷阱同样阴险。


    群体对未经证明的存在性假设和诱惑性信念的接受，为这些假设和信念增加的有效性，并不比个人幻想所能增加的多。依恋型群体行为（Anaclit group behavior）并不比对真理的孤独幻想好在哪里。在最内在现实的科学中是否可以存在公认的真理，目前尚未也无法定论。许多人已经开始尝试，其中一个人提供了令人满意的证明。


    ## 个人元程序语言及其属性示例


    在自我拥有的所有语言中，某些用于控制图 1 所示的元程序层面。自我元程序者通过个人元程序语言行使控制。这种语言控制计算机本身、它如何运行以及它如何作为一个整体进行计算。每个人在其存储的程序、元程序和自我中拥有一种独特的私有语言。这种语言不是共有的。


