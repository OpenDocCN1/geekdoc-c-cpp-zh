    or of current problems can be realized through such instructions. [A “display”
    is any visual (or acoustic, or tactile, etc.) plotting of a set of discriminative
    variables in any number of dimensions of the currently available materials.] The
    motivational sign and intensity can be varied in any of these displays under special
    orders.


