    # METATHEORETICAL CONSIDERATIONS


    In general there are two opposing and different schools of thought on the basic
    origins of systems of thought or systems of mathematics. In a simplified way these
    two extreme positions can be summarized as follows:


    +   1. In the first position one makes the metatheoretical assumption that a given
    system of thinking is based upon irreducible postulates the basic beliefs of the
    systems. All consequences and all manipulations of the thinking machine are then
    merely elaborations of, combinations of, these assumptions operating upon data
    derived from the mind and/or from the external world. This is called theistic
    school. This school assumes that one can, with sufficiently sophisticated methods,
    find these postulates which are motivating and directing a given mind in its operations.
    A further metatheoretical assumption is that once one finds this set of postulates
    that then one can account for all of the operations of that mind. (Whitehead and
    Russell, 1927; Carnap, 1942-46; Tarski, 1946.)


    +   2. The opposing school at the opposite end of a spectrum of schools, as it
    were, makes the metatheoretical assumption that thinking systems arise from intuitive,
    essentially unknowable, substrates of mental operations (Hilbert, 1950). This
    school states that new kinds of thinking are created from unknown sources. Further,
    one is not able to arrive at all of the basic assumptions'
- md: '

    on which systems of thinking operate. Many of the assumptions from this point
    of view must be forever hidden from the thinker. Thus in this view the origins
    of thinking are wide open. With this metatheoretical assumption one can then conceive
    of the existence in the future of presently inconceivable systems of thought.


    3. There is an intermediate position between these two extremes in which one assumes
    the existence of both kinds and that each of these two extremes has something
    to offer. Thus one can select kinds of thinking which are subject to formalistic
    analysis and formalistic synthesis based upon basic beliefs. But this does not
    include all thinking. Some kinds continue to be based on unknown areas, sources,
    and methods. Metatheoretical selection is being done by selection of the formal
    kind of thinking from a large universe of other possibilities. This position does
    not state that the origins of the basic beliefs are completely speciable. However,
    once some related basic beliefs are found to exist, a limited system of rules
    of combination of the basic beliefs giving internally consistent logical results
    can be devised for limited use of that system. This organization into a limited
    integral system of thinking, and the selection of those basic beliefs which naturally
    fit into such systems of thinking, is a way of dividing off this territory.


    Among many other metatheoretical ways of looking at one’s own thinking machine
    and its activities is one which considers the unknown origins of basic beliefs
    and finding those origins are unknown. The whole problem of origin and the whole
    problem of how one constructs basic beliefs is at stake here.


    If one takes a naturally occurring, thinking mind and obtains a sufficiently large
    sample of its thinking, one can have a metatheoretical faith that one can then
    find the basic beliefs and their origins. I am not too sure that such metatheoretical
    faith in one’s ability to adequately observe, adequately record, and adequately
    analyze mental events and construct them into logical explanations is warranted.
    With certain areas of thinking one can do this, certain kinds of minds can do
    this, but are not these the minds which have been organized along the known metatheoretical
    pathways? Are not these minds which believe implicitly in metatheoretical terms
    in a basic set of beliefs and operate with them in an obvious direct logical fashion?


    May it not be better to conceive of minds and criteria of excellence in which
    one plugs in, as it were, metatheoretical positions which do not have only this
    area of applied formalism. In certain areas of thinking, of course, it is necessary
    to have a set of basic beliefs including those of the rules of various kinds of
    games that one must play in the external physical reality and in the social reality.*
    One can play these at different levels of abstraction with more or less excellence
    at playing, with without dedication, etc. Interlock with external reality has
    its own requirements, not just those of the mind itself. In this paper external
    reality is not the area of major emphasis as can be seen in other portions of
    the paper. The interest of the author is more in the thinking machine itself,
    unencumbered. During those times when it is unencumbered by the necessities of
    interlock with other computers and/or with an external reality, its non-interlock
    structure can be studied. A given mind seen in pure culture by itself in profound
    physical isolation and in solitude is the raw material for our investigation (Lilly,
    1956).


    Thus our major interests are in those metatheoretical positions which remain as
    as open as possible to reasonable explanation and reasonable models of the thinking
    processes of the origins of beliefs, of the origins of self, the organization
    of self with respect to the rest of the mind, and the kinds of permissible transformations
    of self which are reversible, flexible, and introduce new and more effective ways
    of thinking.


    Is one the sum and substance of one’s experience, of one’s genetics, genic inheritance,
    of one’s modeling of other humans and of other animals and of plants, or is one
    something in addition to this? As we chip away at this major question of existence
    of self, as men have chipped away at this question over the millennia, we find
    that this kind of question and the attempt to answer it have led us to new understandings,
    new mathematics, new sciences, new points of view and new human activities. If
    one attempts to conceive of one’s self as having gone through another kind of
    evolution other than that of the human, if one attempts to conceive himself having
    lived in an environment different from the social one that we have been exposed
    to, or if one attempts to imagine evolved as an organism with the same (or greater)
    degree of intelligence in the sea or on a planet nearer to the sun or farther
    from the sun, one realizes the essentially prejudiced nature of one’s self. Let
    one carefully consider, for example, the genic mutations leading to different
    human form, structure, function and mental set. One metatheoretical position is
    that all such mutations in their proper combination exposed to the proper environment
    (of which there must be millions of possibilities) can survive and progress. In
    other words, even those mutations which are lethal now, may have survival value
    under special new and different conditions.


    If there is any truth in this statement then we should be doing a whole set of
    experiments on the adaptability and the seeking of the proper environment, proper
    peculiar diets, proper relation of sleep-wakefulness, light to dark, amount of
    various kinds of radiation, amount of noise, amount of motion, and so forth for
    mutants at each stage in their life cycle. In other words, we should experiment
    with all of the vast parameters in which we have evolved and their variations
    in order to seek optimal survival values of these for the embryo, fetuses and
    children who do not survive under our peculiarly narrow range of values of these
    parameters. To change lethals to optimals seems possible and even probable with
    imaginative and thorough research.


    Our genetic code with all its possible variations is a general purpose construction
    hit for a vast set of organisms, only a few examples of which we see in the adult
    human population in all races around the world. This molecular construction for
    organisms (through the exigencies of matings, of early embryonic development and
    growth, of the conditions imposed by mother, her diet and physical and social
    surroundings) give rise to organisms which test experimentally the conditions
    imposed upon them and test how well the particular combination and particular
    values in their genic code are combined to form an integral complete organism
    for coping with that particular environment and those particular organisms found
    in that environment (including bacteria and viruses).


    One can conceive of an infinity of other environments populated with other viruses,
    bacteria, and complex organisms in whom Man as such could survive in his present
    form. One could also conceive of our genetic code (as given) generating organisms
    who could survive and progress under these new conditions.


    Until we have thoroughly explored this genetic code, until we can specify the
    organism and the conditions under which it can reach maturity, and become an integral
    individual, we will not have the data necessary for specifying all of the characteristics
    of the human computer which are brought to the adult from the sperm-egg combination.


    We have not tested our own range of adaptability (as integral adults) to all possible
    environments. Scientifically, we have little experience with the extreme; we know
    something of the extremes of temperature, of air and water in which we can survive.
    We know something of the radiation limits within which we can survive. We know
    something of the oxygen concentrations in the air that we breathe, we know something
    of the light levels within which we can function. We know a little of the sound
    levels in which we can function, and so forth.¹ We are beginning to see how the
    environment interlocks with our computer and changes its functioning. We are beginning
    to see how certain kinds of experiences with these conditions set up rules which
    we call physical science within our own minds.


    > ¹ Von Neumann & Morgenstern.

