    # 15 身体意象元编程


    一些根深蒂固且最早习得的元程序是人类生物计算机个人身体意象的程序。在这里，重要的程序包括姿态、行走步态、坐姿模式、卧姿模式以及睡眠时的身体姿态。这种元编程与各种习得的肌肉技能交织在一起，包括写作、跑步、滑雪，以及网球、游泳等运动。这些元程序还与高度情绪化状态下的身体使用交织，例如愤怒发火、性活动（无论是独自还是与伴侣一起）、恐惧和逃跑模式等。


    自我元程序通过镜子中看到的外部身体意象以及通过本体感受和姿态反馈对自身进行反馈。


    要研究身体意象的本体感受和肌肉张力方面，需要对程序进行深度探测，并尝试将身体的每个关节推向当前自我元编程设定的限制。在这些增加特定关节活动范围的动作中，人们会很快发现关节囊和肌肉本身已经假定了解剖学限制，缩小了这些关节可能的运动范围。这对于脊柱关节和骨盆关节（涉及脊柱和股骨）尤为如此。类似的考虑也适用于肋骨和胸椎、颈椎，以及肢体关节。通过每天重复的肌肉和关节重新编程方案，可以开始修改这些根深蒂固的程序。


    在 LSD* 的初级状态下，可以在此类练习中植入积极的系统活动。在这些条件下，拉伸和肌肉练习的净效果可以是系统的积极兴奋以及对新模式的强化。人们注意到，在
    LSD 状态下，负面系统的活动被削弱，从而允许比没有使用 LSD 时更大的运动范围和关节拉伸。人们还观察到，在这种状态下，可以比通常状态下更完全地收缩目标肌肉。然而，必须小心，因为现在可能将肌肉收缩到导致肌肉、关节囊、韧带和肌腱产生拉伤的程度，从而在
    LSD 初级状态结束后留下残留的、不的局部疼痛。


    在 LSD 状态下进行此类练习时，可以（通过在练习期间观察镜子中的身体意象）检测身体意象的高级元程序，包括积极和负面的。例如，可以看到负面元程序是一个衰老且残疾身体的投影，这种身体被认为太老了，无法改变身体意象。而积极的元程序，例如是一个运动型年轻形象。


    某些类型的负面衰减和归零元程序与骨盆运动有关。如果存在反对性交运动的高级元程序，这些将反映在身体姿态以及其他活动中骨盆的使用范围上。通过观察投影图像的姿态和骨盆的可编程功能性运动范围，可以在投影图像（放置在身体自身的镜像上）中检测到这些元程序。⁶
    对性交配的想象危险可以通过这组图像无法通过整个运动范围来看出来。重新编程此类反元程序需要真实身体通过“禁忌”动作以研究这些反元程序。通常，这需要多大程度上极端地夸大真实身体动作，以突破非愿元程序的抑制方面。每个人的基本细节上都会与他人不同，就像他们的元程序各异一样。为了实现新的编程，愿意体验最恐惧的事物作为一种基本元程序是至关重要的。


    在这里再次需要注意，以避免在该领域重新编程时出现自恋自我崇拜式的逃避。由于 LSD 状态下积极系统活动的增强，新开启的体验领域本身可能很有诱惑力。从自然发育停止时期进行回归和重生的必要性，可能会由于享乐主义理由导致元编程在更早的阶段停滞。


    + 使用 40-200 毫克的右丙胺进行的实验显示，对肌肉、关节、姿态改变等具有类似的积极强化性愉悦使用，并能抑制数小时的负面强化疼痛影响。


    这里还需要额外的高级元程序，坚持自我元程序向所需的理想元程序集进行自然演化，以确保进展。


    在性格健全的老年中，这些危险不像年轻受试者那样紧迫。然而，涉及身体意象的自我元程序在老年人身上也更加根深。老年人需要对任务投入更多的精力和。


    对于胖成为问题的人，在进行这些身体意象重新编程练习的同时，必须将体重减轻到更理想的水平。也就是说，有必要执行那些从身体健康角度带来更好身体的真实饮食和运动指令。这种方案可以降低老年典型疾病的概率，随着健康和活力的增加，重新编程将变得更有回报。


    一个已经详细制定出的可能对某些人有帮助的元程序是被称为“瑜伽”的一系列练习和饮食规则。这些练习确保了新的呼吸练习领域，可以增强肺部和肠道的生理功能，以及躯体肌肉、关节、骨骼和姿态。在许多方面，这些练习确保了对心脏和血管的充分按摩，使其沿着健康的路线增加活跃性。这可能会降低心脏病发作、心绞痛和类似的老年问题的概率。


    在肥胖中，脂肪层（网膜和系膜中的大型脂肪储备）严重限制了所有内脏器官的功能，并限制了可以给予的刺激量。如此巨大的脂肪储备还需要大量的循环，因此需要增加血压。因此，身体意象的外部变化会以自我强化的方式反映在全身的内部变化。


    # 16 大脑模型


    | 机体观点 | 模型 |

    | :--- | :--- |

    | 1 | 从物理化学到量子力学 |

    | 2 | 生理学（结构与功能） |

    | 3 | 现代心理学（行为） |

    | 4 | 经典心理学（心理） |

    | 5 | 进化论（生命和物种的起源） |

    | 6 | 社会、人类学（史前、历史、现状） |

    | 7 | 非人类智能 |

    | 8 | 宗教、神秘学（超人类实体） |


    | 机体观点 | 模型 |

    | :--- | :--- |

    | 1 | 物理化学：神经元活动的毫秒到微秒级冻结图像序列、生物化学储备、物理化学流、与外部源/汇的能量物质交换；重复性、可靠性、信号/噪声关系 |

    | 2 | 生理学：物理模式随时间部分整合的：跨越秒、天、年的净结果。机体与环境产生的动作、信号 |

    | 3 | 现代心理学：对物理生理数据和模型的筛选，显示出可修改性、中枢系统建模、模型比较、存储、学习、记忆、心理物理属性 |

    | 4 | 经典心理学：心理的、主观的、内在视角、精神分析的、唯我论、自我中心的个人模型 |

    | 5 | 进化论：基本物理化学单元逐渐形成有机颗粒、细胞、有机体；遗传密码和细胞质秩序的形成；细胞聚集体的增大；物种的形成；向新物种的演变；中枢系统的进化；人类从类人猿的进化；语言的起源
    |


