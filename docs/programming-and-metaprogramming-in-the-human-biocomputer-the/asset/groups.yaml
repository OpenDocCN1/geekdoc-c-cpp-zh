  mdcn: '

    使用 LSD25 的劣端再次在哲学上取决于这种认知-意向性投影空间现象的边缘：进入此处，人是否会失去自己的洞察力和主动性？这个问题应该通过科学和实验的方法来提出并回答。


    # 实际考虑因素


    从务实的角度考虑，在使用这种物质之前，人们应该在没有 LSD25 的、处于严重衰减的物理现实中进行若干次自我分析。人必须学会不仅要忍受，还要喜欢持续数小时的这种体验。在此期间，可以对未释放的潜意识编程的恐惧进行削弱和分析。


    在将 LSD25 与深度的物理隔离和孤独结合之前，必须与他人进行 LSD25 的训练课程。在此期间，可以通过外部屏幕和投影进行训练，剂量从最小 100 微克到该个体能耐受的最大剂量不等的
    LSD25 均可。在此期间，人必须面对 LSD25 本身的恐惧，以及上述对这种物质对大脑和精神造成损害的恐惧。人还必须面对 LSD25 可能诱导并维持的享乐主义的、自恋的快乐，并且必须就如何处理这些快乐与外部现实中带来的快乐之间的关系做出自己的决定。


    在深度的物理隔离状态下，人会获得、拥有或产生对身体能够完全自动运行并照顾自己的信心。供气、保持脸部在水面以上、呼吸和心脏跳动等所有问题都交给了原始人类生存程序来自我维持。主体试图控制或监控自身呼吸或心跳的任何倾向都应该受到抑制。对于胃肠道和生殖尿尿系统也是如此。在可以实现的范围内，应该鼓励这些系统的自动运行。它们将逐渐在个体主体的心理生活中呈现出其适当的低级表现。人可以对它们在无需自我关注（通过自我元程序）的情况下持续运行获得信心。当物理隔离和孤独开始发展时，这些考虑因素对于
    LSD25 显得尤为重要。


    在分析方面，人必须分析并处理自己的潜意识死亡愿望。在达到某个临界点之前，人知道并感觉到自己在自己可以控制的条件下的生存概率。我已经经历过内部机制可能试图接管并对我施加一种寻求死亡的致命一击。在进行此类实验之前，必须与外部分析师对这类材料进行彻底分析。自我和分析师必须确认，这种内部机制的控制水平使得其施加致命一击的概率低到足以承担暴露于新环境的风险。这一点再怎么强调也不为过。在经典精神分析中熟悉这些现象的人意识到，某些类型的人格和某些个体在分析过程中和可能会经历抑郁阶段，在该阶段此类愿望可能会被表现出来。自我毁灭的种子可能被埋在个人计算机更深层的元程序和程序中。某些类型的神经活动会破坏有机体。这些是人必须了解的活动，并且必须意识到在自身诱发这些系统的迹象和符号。


    此类负面现象通常在在使用 LSD25 的第一次或两次课程后出现。这些程序中残留的、未分析的部分通常会由于这种物质的释放而被投影并表现出来。因此，为了在这些实验中获得最大的安全性和最小风险，有必要与外部分析师进行多次分析课程。


    在最遥远、最深的隔离状态下，人的基本需求和对自我的假设变得显而易见。自我的存在以及对自我存在的信念变得显性。人赋予自身及对自我存在之价值的正向或负面符号开始显示其力量和强度。那些在外部现实世界的宗教背景下通常被讨论但未曾面对的问题，现在被面对并能够以一种自童年以来从未获得过的自由去经历。


    身体死亡导致意识自我的消融是可以研究的。人对这一问题的规避和面对它的回避可以投影到经验中可研究的领域。精神和心理实体的存在定理也是可测试的，对这些实体的信念强度也可以被分析。对自我分析的规避以及对接受某些信念的规避是可以被测试的。


