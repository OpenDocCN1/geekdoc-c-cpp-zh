  mdcn: '

    我们从婴儿时期就被教导，完全有意识的个体中出现的这种现象在某种程度上是被禁止的、反社会的，甚至可能是精神疾病的。


    人们必须分析这种从小就植入体内的元程序（metaprogram），检查其合理性或缺乏理性，并尽管对所发生的现象有这种解读也要继续进行。一旦人们将其分析为一种逃避或对看清真实状况的防御手段，就可以允许自己继续体验更深层次的现象，而不干扰自然的元程序。在获得这种免于焦虑的自由后，就可以进入下一个阶段。（为了让这些内部事件发生的程序指令在课程开始之前就已经制定好了，起初写下来或录制在录音机中。之后，这些指令可以在没有外部辅助的情况下进行编程。）


    以下现象学描述是由一个受试者在这些特殊条件下经历得的。一个人体验到一种由“自我”（Self）设定的即时内在现实。在我看来，个人对这种体验的假设生成了整个体验。体验到的情感、他人的表面显现、非人类生物的显现、自己过去的幻想、自己的自我分析，每一项都可以被设定为与个人意识范围之外的自我部分发生互动而产生。


    在这些条件下体验到的内容缺乏强烈的现实线索。外部真实的显示并不提供；来自外部现实的刺激并没有形成这些显示的模式。因此，确实发生的投射源于致力于外部现实的感知装置操作的下一层内在系统。


    随之产生的现象由一个受试者描述如下：视觉化有时沉浸在三维的黑暗中，但当一个人避开出现的“多维认知与意向空间”时，人们能感觉到听觉领域的“沉默”；这也让位了正在发展的新空间。身体像随着恐惧或其他需求的积聚而波动、出现和消失。正如“黑暗与沉默”一样，身体像的存在或缺失也是如此。使用这些投射空间的进展取决于一个人既不将存储的外部现实数据投射到这些空间中，也不向这些空间投射“外部现实刺激的缺失”。


    人们可以在视觉空间投射生动的图像（外部现实的等物）或黑色（外部现实图像的缺失）。人们可以在声学空间投射特定的声音、语音等（如同外部现实），或者可以在外部现实中投射沉默（声音的缺失）。人们还可以投射身体像，通过收缩肌肉、关节等来向自己保证图像是在真实的反馈下运行的，或者对身体像的缺失产生原始感知，这是身体像本身的负逻辑对立面。


    在这些二元对立的情况中，人们实际上都在投射外部现实及其等物（正面的或负面的）。为了体验下一组现象，必须处理这些外部世界的二元符号符号，并意识到它们是逃避向更深层次渗透的手段。


    一旦人们放弃了从存储中投射外部现实等物，新现象就会出现。思想和感觉接管了被外部现实等物占据的空间。（在旧的术语中，自我扩张以填充主观认同的内在宇宙）。类似于通常现实视觉空间中的“无限”也参与其中，人们感觉自我向所有方向无限延伸。自我仍然集中在一个地方，但它的边界消失了，它向所有方向移动并延伸，填满了人们所知的宇宙边界。这种现象的解释是，人们只是接管了感知空间，并用程序、元程序和自我元程序填充了它们，这些程序现在内在感知中被修改得如同外部现实等物一般。这种转化，这种特殊的精神状态，必须直接体验才能欣赏。


    在人们的普通体验中，存在一些具有这种品质并显示出这种现象的梦。


    在这个层面上，可能会发生各种对正在发生之事的逃避。人们可以“想象”自己正在穿越真实的宇宙，穿过恒星、星系等。人们可以“想象”自己正在与其他宇宙中的其他生物交流。然而，从科学角度来说，显而易见的是人们并没有做任何这些事情，而且人的基本决定了他们在这里体验到的东西。因此我们说普通的感知空间、普通的投射空间现在充满了认知和意向过程。与他人在文献中报道的关于这些现象的“海洋感觉”（即与宇宙合一、与“宇宙心灵”（Universal
    Mind）融合）相比，这似乎是一个更合理的观点。这些状态（或他们被称为现实的直接感知）是个人的思想和感觉扩张到了计算机中通常用于感知外部现实的电路中，包括视觉、听觉、本体感受等等每一种模式。


    为了澄清体验这些现象的问题，在此稍作番话。除了上述讨论的关于防止这些现象发展的恐惧因素外，还中和各种临床精神医学对这些现象的解释和判断。如果假设经历这些现象是一个危险程序，因为人们可能会迷于其中并因此陷入不可逆的精神疾病中，那么也可以阻止人们直接体验这些现象。由于诱发精神疾病的真实充充分条件尚未明确，因此不应该早早结论认为这些现象本身会导致或可能导致领域中的精神疾病。这尚未得到该领域所有人的满意证明。可能是职业性的恐惧阻碍了我们对这些现象的进一步分析。对自己心理过程的洞察的整个问题、自律以及检查和理解这些过程的整个问题都关乎此。那些相信所有正常人都即将面临精神疾病的人，对这些现象有明确的问题。从启发性角度来说，这种信念是站不住的；这种信念倾向于削弱人的自律，并使人不适应此类体验。


    在继续之前，必须对所有受训受试者的临床精神医学领域进行满意的分析。


    除非人们能够在哲学和科学上移动以看到经历这些体验的用，否则可能会出现快速退缩，导致整个项目出现故障。人们不愿意承受预设的“危险”。


