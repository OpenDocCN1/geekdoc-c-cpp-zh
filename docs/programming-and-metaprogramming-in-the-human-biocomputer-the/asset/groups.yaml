    # 15 Metaprogramming the Body Image


    Some of the most deeply entrenched and earliest acquired metaprograms are those
    of the personal body image of the human biocomputer. Among the programs of importance
    here are those of posture, walking stance, sitting patterns, lying down patterns
    and body posture during sleep. This metaprogramming interdigitates with that for
    acquired muscular skills of every sort, including writing, running, skiing, sports
    such as tennis, swimming, and so forth. These metaprograms also interdigitate
    with the use of the body during highly emotional states such as angry outbursts,
    sexual activities (both alone and with a partner), fright and flight patterns,
    and so forth.


    The self-metaprogram feeds back on itself through the external body image seen
    in a mirror and through proprioceptive and postural feedbacks.


    To investigate the proprioceptive and muscle tension aspects of the body image
    requires deep probing of programs combined with attempts to push every joint of
    the body beyond the limitations set by the current self-metaprogram. During such
    maneuvers to increase the range of motion at specific joints, one quickly discovers
    the joint capsules and muscles themselves have assumed anatomical limits which
    attenuate the range of possible motion at these joints. This is particularly true
    of the spinal joints and the pelvic joints (with the spine and with the femur).
    Similar considerations apply to the rib cage and the thoracic spine, the cervical
    spine, as well as, the limb joints. By daily repeated regimes of reprogramming
    of the muscles and the joints, it is possible to begin to modify these entrenched
    programs.


    During the primary state of LSD* it is possible to program in positive system
    activity during such exercises. Under these conditions the net effect of stretchings
    and muscle exercises can be a positive system excitation and reinforcement of
    the new patterns. During the LSD state it has been noticed that the activities
    of the negative systems are attenuated and thus allow a greater range of motion
    and joint stretching than without the LSD. It has also been noticed that it is
    possible to contract the desired muscles more fully in this state than during
    the usual state. Caution must be observed, however, because it is now possible
    to contract muscles to the point where muscles, joint capsules, ligaments, and
    tendons can be strained leaving residual, unpleasant local pains after the LSD
    primary state is ended.


    During such exercises in the LSD state, it is possible to detect (by looking at
    the body image in a mirror during such exercises) the supraself-metaprograms for
    the body image, both the positive and the negative ones. One can see the negative
    metaprogram, for example, as the projection of an aged and crippled body assumed
    to be too old to be capable of changing the body image. A positive metaprogram,
    for example is that of an athletic young figure.


    Certain kinds of negative attenuation and zeroing-metaprograms are connected with
    pelvic movements. If there is a supraself-metaprogram directed against the movements
    of sexual intercourse, these are reflected in body posture and in the range of
    use of the pelvis in other activities. Such metaprograms can be detected in the
    projected images (placed upon the mirror image of the body itself) by watching
    the posture of the projected image and the range of programmable functional movements
    of the pelvis.⁶ The imagined dangers of sexual mating can be seen by the failure
    of this set of images to go through the full ranges of motions. Reprogramming
    such anti-metaprograms requires the real body to go through the “forbidden” movements
    in order to investigate the anti-metaprograms. In general this requires more or
    less extreme exaggeration of the real body movements in order to break through
    the inhibitory aspects of the undesired metaprogram. Each individual will vary
    from others in the essential details, even as their metaprograms vary. A certain
    willingness to experience that which is feared most is absolutely essential as
    a basic metaprogram in order to achieve the new programming.


    Cautions, once again, are in order here to avoid the narcissistic-self-worshipping-evasion
    of reprogramming in this area. The new areas of experience opened up can be rather
    seductive of themselves, because of the enhanced positive system activity during
    the LSD state. The necessity for regression and regrowth from times at which the
    natural developments were stopped can lead to further sticking of the metaprogramming
    at an earlier age on hedonistic grounds.


    + 6 Experiments with dextroamphetamine in doses of 40-200 mgs show similar positively
    reinforcing pleasurable use of muscles, joints, posture-changes, etc., and inhibition
    of negatively reinforcing painful effects for several hours.


    Additional supraself-metaprograms insisting on a natural evolution of the self-metaprogram
    towards a desired set of ideal metaprograms is necessary here to assure progress.


    In older persons with well-developed characters these dangers are not as pressing
    as they are in younger subjects. However, the self-metaprograms involving the
    body image are also more entrenched in the older persons. More energy and dedication
    to the task at hand are needed in the older persons.


    In those in whom obesity has become a problem, it is necessary to reduce the body
    weight to a more ideal level while these exercises in remetrogramming of the body
    image are being carried out. In other words, it is necessary to carry out those
    real dietary and exercise instructions which lead to an externally better body
    in the sense of physical health. Such a regime can reduce the probability of the
    onset of the typical diseases of old age, and with increasing health and activity,
    the remetrogramming becomes more rewarding.


    One metaprogram which has been worked out in great detail which may be of help
    to some persons is the set of exercises and dietary rules commonly called Yoga.
    These exercises assure new areas of breathing exercises which can enhance the
    physiologic functions of lungs and gut tract, as well as somatic musculature,
    joints, bones, and posture. In many ways these exercises assure adequate massage
    of the heart and blood vessels in such a way as to increase their activity along
    healthy lines. It may be that one can reduce the probability of coronary attack,
    angina pectoris, and similar problems of the aged.


    In obesity the panniculus adiposus, the large fat store in the omentum and in
    the mesentery, severely limit functions of all viscera and limit the amount of
    stimulation that can be given. Such large fat reservoirs also require very amounts
    of circulation and hence require an increase in blood pressure. Thus the external
    changes in the body image are reflected in internal changes throughout the body,
    in a self-reinforcing manner.


