    are totally inapplicable, it merely assures a subtle pervasive anthropocentricity
    which may be inappropriate.


    Among many possible theoretical approaches is one which I call the “participant
    theorist” approach. The theorist establishes an interlock with a nonhuman computer
    by whatever modes are possible, programs himself with open-ended hypotheses of
    a type thought to encourage him and to encourage the other computer, each to communicate.


