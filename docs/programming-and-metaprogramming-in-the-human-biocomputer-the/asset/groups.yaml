    # Summary


    Some general ideas from extrapolation and reworking of modern general purpose
    computer theory are used to explain and to control some of the subjective aspects
    of the operations of the human brain. An addition (for the peculiarly human brain)
    to the theory of the general-purpose computers is the concept of the self-metaprogram
    or the internal programmer present in the $10^{10}$ neurons assembly known as
    the human brain. The self-metaprograms operate between the huge storage and the
    huge external reality. Selfprogramming properties (in addition to stored program
    properties) are essential to understanding mental operations and resulting external
    general purpose behaviors such as speech and language. Stored programs and metaprograms
    are characteristic of the human.


    The self-organizing aspects of computer programming and programs are now conceptually
    reasonable and realizable in modern non-biological computers. The human brain,
    a super-bio-computer, as it were, is a parallel processor – a realizable artificial
    machine with this structure has not yet been built. The actions of certain substances
    on the brain are explicable by this theory: examination of stored programs and
    reprogramming are opened by LSD25 (possibly by the introduction of small amounts
    of programmatic randomness, noise). In the child, automatic metaprogram implantation
    (or externally forced metaprogramming), persisting as metaprograms below the levels
    of awareness in the adult, can be controlling for the later adult programs, adult
    thinking, and adult behavior. Energy can be taken from some of these automatic
    metaprograms and transferred to the self-metaprogram with special techniques and
    special central states, chemically evoked. Some automatic unperceived programs
    are essential to biological nurture, survival, etc. Examples of methods, of investigations
    and of results in self-analysis and self-metaprogramming are given.


    # Acknowledgments


    The author is grateful for a National Institute of Mental Health Career Award
    (of the National Institute of Mental Health, N.I.H., Bethesda, Md. 1962-1967)
    which gave the time and impetus necessary for the conception and the writing of
    this work. The National Institute of Mental Health also furnished the therewith
    for some of the experiments during the term of the author’s service (1953-1958)
    in the U. S. Public Health Service Commissioned Officers Corps, jointly at the
    National Institute of Mental Health and at the National Institute of Neurological
    Diseases and Blindness at the National Institutes of Health, Bethesda, Md. In
    addition, at various times, portions of the work were supported in part by grants
    from the Air Force Office of Scientific Research, the National Science Foundation,
    the National Aeronautics and Space Agency, the National Institute of Neurological
    Diseases and Blindness, N.I.H., and G. Unger Vetlesen Foundation, and the Michael
    Tors Foundation. For this support the author expresses his gratitude.


    The author wishes to express his appreciation to the Institute of the Philadelphia
    Association of Psychoanalysis and the Baltimore Institute for the opportunity
    to take his psychoanalytic research preparation and training analysis (1949–1956).
    In particular, he is indebted to Dr. Robert Waelder and the faculties of that
    period, including Drs. Gerald Pierson (dean), Henry Katz, George Sprague, Eli
    Marcowitz, Amanda Stroughton, Jenny WaelderHall, Anderson and Lewis Hill. Dr.
    Lawrence Kubie has been most helpful with his metatheoretical reformulations of
    psychoanalytic theory. Dr. Douglas Bond''s insistence on the combined neurological
    and psychoanalytic training gave confidence when needed.


    Over the years the necessity and inspiration for the pursuit of the logic and
    languages of artificial computers as related to the brain were learned from Warren
    McCulloch. An opportunity to pursue this area of research in depth was arranged
    by Dr. Walter Rosenblith in 1962. To the LINC group at Massachusetts Institute
    of Technology (now at Washington University, St. Louis) the author wishes to express
    appreciation for coursework, patient teaching and help with a LINC computer during
    its development phases in particular Dr. Wesley Clark, Mary Allen Wilkes Clark,
    B. G. Farley, and Dr. Thomas T. Sandel contributed much needed time.


    In many ways discussions of the materials of this work Drs. Fred G. Worden, Charles
    Savage, Joel Elkes, Seymour Kety, Willis Harman, and Sidney Cohen aided in its
    formulation, and have indicated the desirability of its publication.


    I am grateful to my colleagues (past and present) in the Communication Research
    Institute for many invigorating discussions, including Gregory Bateson, Drs. Peter
    J. Morgane and Henry M. Truby.


    # Acknowledgments by Philip Hansen Bailey


    For the first time in over twenty five years, the manuscript for Dr. John C. Lilly''s
    masterwork Programming and Metaprogramming in the Human Biocomputer appears in
    a complete edition, with many thanks to Float On of Portland, Oregon, for bringing
    it forth to a new generation of readers. Heartfelt thanks go to the owners and
    staff at Float On for this extraordinary effort: Graham Talley, Quinn Zepeda,
    Christopher Messer, Ashkahn Jahromi, Jake Marty, Ian McIntosh, and Jeanine Bocci.


    This work chronicles the inner workings of the human brain, and its capacity for
    information processing, using computer programming language as its model. Dr.
    Timothy Francis Leary considered it to be one of the greatest ideas of the 20th
    Century.


    The original report was dated February 1, 1967 with revisions as of February 1968.
    Programming and Metaprogramming in the Human Biocomputer was the Final Report
    for Research Grant #5-K6-MH-18, 700-05, culminating a 5 year career award from
    the National Institute of Mental Health, Bethesda, Maryland. The work herein is
    based on a series of seminars given at the Department of Psychiatry, Schools of
    Medicine, Johns Hopkins University, University of California at Los Angeles, University
    of Minnesota; at the medical seminar, Edgewood Arsenal; and at the Conference
    on Science, Philosophy, and Religion, Jewish Theological Seminary, New York, in
    1966. Upon delivery of the manuscript to the National Institute of Mental Health,
    Dr. Lilly stated that the content of the material was not what they had expected.
    Surely, this manifesto was seen as heretical to established and institutionalized
    ways of thought.


    This work would not have existed without the support of the many institutions
    involved, particularly the Communication Research Institute, at Coconut Grove,
    Miami, Florida, and Nazareth Bay, St. Thomas, Virgin Islands, where Dr. Lilly
    was ably ably supported by Gregory Bateson, Margaret Howe, Scott McVay, Dr. Henry
    Truby, and Alice Miller.


    Dr. Lilly was greatly indebted to his esteemed colleague, Dr. Albert Hofmann,
    of Switzerland, for his input and development of the subject matter.


    Many continued expressions of gratitude go to Dr. Lilly’s extended family, including
    Mary Lilly, and his son’s John Lilly Jr., and Charles Richard Lilly; as well as
    Cynthia Cantwell, Barbara Clarke Lilly, Nina Casteulluccio, and Lisa Lyon.


    Dr. Lilly’s friends are also commended for their continuing support of his efforts
    and life’s work, including: Jeff Bridges, Ann and Jerry Moss, Michael Fitzpatrick
    of Earth’s Call, Tuning the Planet and the Millemon Festival, Dr. Joshua Trabulus,
    M.D., Patricia Sims, Roberta Goodman of Wild Dolphin Swims, Hawaii; Dr. Michael
    Hyson and Star Newland of Planet Puna, Hawaii; Jack Kassewitz SpeakDolphin, Napier
    Marten, Brian Wallace, Faustin Bray, Glenn and Lee Perry of Samadhi Tank Company,
    Grass Valley, California; James Chellis, Gerard A. Houghton, Deborah “Tango” Synder,
    John P. Allen, Craig Inglis, Omar Fayed, Chili Hawes of The October Gallery, London;
    Dr. Oscar Janiger, C. Scott Taylor, Lili Townsend, Burgess Meredith, Ric O’Barry,
    Char and Larry Raith, Patricia and Lucy Casado, In Lurie of Gateways Books, Edward
    James Norman III, Roberto Trujillo at Stanford University, Green Library, Archive
    of Dr. John C. Lilly, and D. Graham Burnett, Professor of The History of Science,
    Princeton University, and author of the groundbreaking and historically sweeping
    The Sounding of The Whale: Science and Cetaceans in The Twentieth Century.


    Finally, gratitude is extended to the British Broadcasting Corporation and the
    Smithsonian Channel for producing the film The Girl Who Talked To Dolphins Produced
    (with Mark Hedgecooe) and Directed by Chris Riley, appearing globally in 2014,
