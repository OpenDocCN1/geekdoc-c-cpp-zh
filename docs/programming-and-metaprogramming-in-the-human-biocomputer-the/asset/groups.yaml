    However, the nature of the linkages in coalitions depends upon the level of aggregations
    discussed. In a man the coalitions include those between special atoms in spatial
    arrangements with others (alpha helices, etc.), special cells in spatial patterns
    (liver, brain, etc.), and organism tissues such as circulatory, lymph, and autonomic
    nervous systems. The bones assure a maintenance of total form of the net coalition
