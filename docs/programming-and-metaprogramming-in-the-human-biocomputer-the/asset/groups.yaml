    ## Categorized Bibliography


    ## AUTHOR’S PAPERS


    Lilly, J. C.


    1966. “Communication with Extraterrestrial Intelligence.” (1965 IEEE Military
    Electronics Conf. Washington, D. C. Sept. 1965.) IEEE Spectrum 3 (3): 159-160.


    —


    1967. The Mind of the Dolphin: A Nonhuman Intelligence. Doubleday & Company, Inc.
    Garden City, New York, 331 p.


    Lilly, J. C.


    Alice M. Miller


    1968. “Reprogramming the Sonic Output of the Dolphin: Sonic Burst-Count Matching.”
    JASA 43: 1412-1424.


    ## Abstract


    # Programming and Metaprogramming in The Human Biocomputer (Effects of Psychedelic
    Substances)


    The basic assumptions on which we operate are as follows. Each mammalian brain
    functions as a computer, with properties, programs, and metaprograms partly to
    be defined and partly to be determined by observation. The human computer contains
    at least 13 billion active elements and is functionally and structurally larger
    than any artificially built computer of the present era. This human computer has
    the properties of modern artificial computers of large size, plus additional ones
    not yet achieved in the non-biological machines. This human computer has stored-program
    properties, and stored-metaprogram properties. Among other known properties are
    self-programming and self-metaprogramming. Programming codes and metaprogramming
    language are different for each human, depending upon the developmental, experimental,
    genetic, educational, accidental and self-chosen, variables, elements and values.
    Basically, the verbal forms are those of the native language of the individual,
    modulated by nonverbal language elements acquired in the same epochs of his development.


    Each such computer has scales of self-measurement and self-evaluation. Constant
    and continuous computations are being done, giving aim and goal distance estimates
    of external reality performances and internal reality achievements.


    Comparison scales are now set up between human computers for performance measures
    of each and of several in concert. Each computer models other computers of importance
    to itself, beginning immediately postpartum, with greater or lesser degrees of
    error.


    The phenomenon computer interlock facilities model instruction and operation.
    One computer interlocks with one or more other computers above and below the level
    of awareness any time the communicational distance is sufficiently small to bring
    the interlock functions above threshold level.


    In the complete physical absence of other external computers within the critical
    interlock distance, the self-directed and other-directed programs can be clearly
    detected, analyzed, recomputed, and reprogrammed, and new metaprograms initiated
    by the solitary computer itself. In this physical reality (which is as completely
    attenuated as possible environment with solitude), maximum intensity, maximum
    complexity, and maximum speed of reprogramming are achievable by the self.


    In the field of scientific research, such a computer can function in many different
    ways—from the pure, austere thought processes of theory and mathematics to the
    almost random data absorption of the naturalistic approach with newly-found systems,
    or to the coordinated interlock with other human computers of an engineering effort.


    At least two extreme major techniques of data-collection analysis exist for individual
    scientists: (1) artificially created, controlled-element, invented, devised-system
    methods; and (2) methods involving the participant-observer, who interacts intimately
    and experientially with naturally given elements, with nonhuman or human computers
    as parts of the system.


    The former is the current basis of individual physical-chemical research; the
    latter is one basis for individual explorative, first-discovery research of organisms
    having brains larger than those of humans.


    Sets of human motivational procedural postulates for the interlock research method
    on nonhuman beings, with computers as large as and larger than the human computers,
    are sought. Some of these methods involve the establishment of long periods—perhaps
    months or years—of human to other organism computer interlock. It is hoped that
    this interlock will be of a quality and value sufficiently high to permit interspecies
    communication efforts on both sides on an intense, highly structured level.


    The chemical agent Lysergic acid diethylamide (LSD25) has been shown by many investigators
    to cause large changes in the modes of functioning of the human biocomputer. The
    dosage to obtain various effects ranges from 25 to 1000 micrograms per subject
    session. The detectable primary effects have a time course, a latency of 20–40
    minutes, from time of administration and endure for 4 to 12 hours for single or
    divided doses, with a peak effect at 2 to 3 hours. At the same dose level, such
    effects cannot be repeated for 72 to 144 hours. Detectable secondary and tertiary
    effects have a longer time course. With sufficiently sensitive testing techniques,
    secondary effects with half-life of 1 week to 6 weeks have been described. Tertiary
    effects can be detected for 1 to 2 years.


    The descriptions in the literature of the primary effects vary considerably. The
    frameworks of these descriptions show a great variety of phenomenological, philosophical,
    medical, psychiatric, psychological, social and religious conceptualizations.
    Published mechanisms and models of the phenomena are found to be unsatisfactory.
    Published experiments resulting from the use of these models are also not satisfactory.


    As a result of this dissatisfaction with published materials, a new model was
    constructed: the human biocomputer. Interactive experiments were designed to test
    this model with LSD25 sessions. The subject was preprogrammed with the general
    concepts of the model over several months before the first session, and with specific
    programs to be tested 12 hours to one hour before each session. During separate
    sessions (100–400 micrograms dose range), programming was done (a) by self, (b)
    written instructions, (c) taped instructions, (d) environmental control and (e)
    one other person. This account gives the current state of this model of the human
    biocomputer, some of the properties found, the programming and metaprogramming
    done, the concepts evolved, the special isolation environment, and special metaprogramming
    techniques developed.


    Communication Research Institute Report No. CR10167

