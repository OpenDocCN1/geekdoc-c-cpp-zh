    表现与内在现实成就。在人类生物计算机之间建立了比较标尺，用于衡量各自的性能以及几台协同工作时的性能。每台生物计算机从出生后立即开始对自身具有重要其他生物计算机进行建模，并带有不同程度的误差。


    “计算机互锁（computer-interlock）”现象促进了彼此间模型的构建与运行。每当通信距离足够小，足以使互锁功能超过阈值水平时，任何一个生物计算机都会在意识上下与一个或多个其他生物计算机建立互锁。


    在关键互锁距离内完全没有其他生物计算机的情况下，孤独的生物计算机可以清晰地检测到自我指向和指向他的程序，并对其进行分析、重新计算、重新编程，并启动新的元程序（metaprograms）。在孤独的、尽可能衰减的物理现实环境中，自我可以实现最大强度、最大复杂性和最高速度的编程。


    在科学研究领域，这种计算机可以通过许多不同的方式运行：从理论和数学的纯粹抽象思维处理，到自然方法对新发现系统近乎随机的数据吸收，再到工程努力中与其他人类生物计算机的协调互锁。


    对于个体科学家来说，至少存在两种极端的数据收集与分析方法：人为创造的、受控元件的、设计的系统方法；以及参与观察者法，与自然元素及非人类（或人类）生物计算机（系统的组成部分）进行亲密的经验性互动。前者是目前个体物理化学研究的基础，后者是个体与大大脑（类人类尺寸）生物体进行探探索性首次发现研究的依据之一。人们正在寻求一套与生物计算机等大或大于人类生物计算机的生物进行互锁方法研究的人类动机和程序假设集。所寻求的一些方法包括：建立长期的（数月、数年）的人类与其他生物的生物计算机互锁，其质量和价值足够高，以值得双方在密集、投入且高度结构化的水平上投入跨物种交流努力。


    ## 逃避互锁


    面对大脑与自身等大或更大的非人类物种，一些人类科学家逃避了互锁研究的责任，退缩到一组特殊的信念中——即关于手动的、操纵的双足、无毛、记录、干燥、空气发声、物种内合作、致命捕食性/危险、具有美德自我形象、强大且不成熟、崇拜自身物种的灵长类，其大脑重量1400克。


    具体而言，面对海豚（大脑1800克）的人类科学家退入几个安全的认知区域，与海豚断绝接触。最常见的规避接触的方法假设人类对于什么是“对海豚的科学研究”拥有先验知识，即一个局限的、哲学、物种特有的、封闭的概念系统。


    逃避的常见原因是对海豚巨大体型、对海洋、对下水、对热带、对冷水的恐惧。另一个安全的避难港是躲进“看看我们这样做会发生什么”或实验性的“胡闹”区域。在这个领域可能会花费多年时间却无法实现任何互锁；因此，成功的规避将无休止。


    越来越多且频繁地，科学家试图假装成（对海豚而言）不存在的观察者，通过水下窗户窥视它们，这通常被称为“行为学方法”。这种活动也相当成功地规避了互锁研究。


    随着每种类型的科学家进入海豚领域，其他用于回避密切接触责任的认知交通控制设备也迅速出现：鱼类学家、动物学家、比较心理学家、人类学家、行为学家、天文学家，每个领域都至少有一位代表接触过海豚。每个人都想出了充分且合理的理由，认为不必继续互锁研究，不必将其个人资源及所属科学领域的资源投入这种遥远的、非应用的、长期的基础研究。非科学家类型的人也来接触；大多数人带着类似的诡辩离开。少数人留了下来。有些人眼中闪烁着剥削的光芒：金钱的光芒、军事应用的光芒、自我膨胀的光芒。有些人是因为惊奇、敬畏、崇敬、好奇以及对海豚自身的直觉感受而留下的。


    尊重（而非喜爱）海豚的人（无论是否是科学家）是所寻求的潜在互锁群体；致力于无规避的海豚-人类互锁是一项困难的新职业。截至1965年，我认识的这类人寥寥无几。少数他们需要帮助：设施、合适的援助、隐私、对其他方面的的需求、金钱、认知和智力支持、鼓励、开明的讨论，当然，还有海豚。这目前是一个必然孤独的职业。


    ## 跨物种互锁的元程序


    多位作者提过基于纯逻辑、语言和计算机基础的人类与非人类通信模型。（例如参见Freudenthal编写的用于宇宙交流的语言Lincos。）这类模型存在一个主要缺陷：提议者在与非人类物种的互锁研究方面缺乏必要的经验；理论者的存储库中只满了人类类型的互锁数据。当然，这并不意味着这些模型完全不可用，它仅仅确保了一种微妙的、无处不在的人类中心主义，这可能是不恰当的。


    在许多可能的理论方法中，有一种我称为“参与者理论者”的方法。理论者与非人类计算机建立互锁。理论者通过任何可能的模式与非人类计算机建立互锁，以鼓励对方。


    ## 海豚-人类互锁的观察：模仿作为互锁的证据


    已经发现，对于非人类物种（海豚/Tursiops），其大脑已知很大，这促使人类端认为每天投入大量时间是必要的，大约为16到20小时。每周至少五天，最好是六天或七天。


    在这些数周的投入后，互锁总时长约1000小时，通过非声学和声学通道实现的通信是非常复杂的，至少在人类端是这样。


    通过投入互锁，彼此在对方身上的意识-无意识互惠模型在各自的局限内变得可行。


    这种互锁参与和写实模型构建避免了纸上谈兵式的纯洁方法。它确保了大多数区域的互锁，包括在“文明人”禁止的区域进行某些互锁。每种表达模式的总需求不受禁忌、抑制、错误理论或任何物种障碍的影响。


    互锁初始阶段的意识-无意识方面是一个重要的考虑因素：如果潜意识中存在太多的敌意恐惧，互锁将变成仪式化和规避性的。如果人类端有太多的无意识能量涉及到母子或父子式的依赖循环中，恐惧-敌意可能会突然破坏互锁。如果有强大的手段来清除过剩的无意识


