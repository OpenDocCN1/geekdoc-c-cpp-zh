    - (a) 财务个体（金钱）收入和支出是一个多功能通用联盟的标志。由特定个体控制的资金金额，通常是许多其他个体组成的联盟委托给该个体的联盟责任的量化。个体只有在获得多方同意的情况下才能成为联盟的控制者，从而控制流入和流出该的资金。

    - (b) 儿童：与后代发展出令人兴奋且要求性的联盟。随着孩子的成长和其联盟能力的扩张，与每个孩子更新和改进彼此的联盟是一项挑战。

    - (c) 意识水平之下的无意识联盟，人们在自己的联盟中期待某些特定条件；某些愿望的思维被消耗在幻想的连接中。书面形式的合同通常没有、无法包含无意识承诺/愿望的显性陈述。然而，合同可能被误用以服务愿望思维——法院见过许多此类案例。


    打破人际联盟引起的问题可以平稳解决，可以采取某种活力，也可以产生大量的热量、烟雾和火焰。连接中留下的真实纽带能量通常可以以任何所需的速率耗散；这种混乱和骚动（外部能量耗散）似乎与纽带中的能量以及纽带溶解的速率直接正比，即与为了在人际连接双方达成一致而花费的时间和能量直接正比。但速率控制和打破联盟的协议必要性必须经过冷静且客观的评估。除非人们知道如何控制结果，否则他们希望避免在联盟的任何或双方在意识水平之下的激发原始人类生存程序；这些程序需要持续的关注和维护。


    任何及所有人际联盟的关键因素是循环反馈、距离规则、积极（吸引）和消极（排斥）动机、激发和抑制规则及界限，以及联盟场协议。每个人类联盟都形成在一个由其他个体和其他机构代理人包围的联盟场中。给定联盟与所有其他联盟的连接性是多重且复杂的。人出生并成长在一个动态且不断发展的联盟场中；在这个场中，联盟跨越了巨大的表面持续时间。有些联盟的设计是为了超过单一的人生；另一些则持续几分钟、几小时、几天几天。


    从破碎联盟中释放的纽带能量用于形成新联盟，或加强其他联盟。例如，辞职比解雇好；一组新的必要联盟可以取代旧联盟，且有重叠而服务不中断；或者旧联盟的职责被分配给其他成员。


    人类联盟中的纽带能量有两种类型：吸引和排斥；为了维持一个可行的联盟，每个成员必须在特定的时间、强度、速率等限制范围内对这些连接进行激发和抑制。有时，一个联盟表现出两个人用两根绳子互相拉近，同时用两根杆互相推开；这种联盟需要对涉及的两次推和两次拉进行调整和重新调整。（双重束缚，G.
    贝特森）


    我们对个人责任的概念建立在上述对人类每个发育阶段多层次联盟的映射之上。责任始于自我与自身体内极具要求的 10¹¹² 细胞之间建立满意的联盟。责任持续于人际联盟、跨种联盟（从免疫力细菌，到进食植物和动物，再到跨种交流）、自我概念（起源、维护、进展、目的地），以及自我与内心深处现实之间的强开放交流。


    在本文中，强调了责任的多个层次，以及为了进行这项研究而具备强大自主性人格的必要性。为了在人类社会中有效发挥作用，心灵深处必须在自我的引导下相对平稳地运行。开发这种程度的平稳功能可能需要强力措施；这些措施需要强大且受过教育的处理。


    ## 11 参与者锁定，与其他物种个体的联盟*


    在过去的大约九年里，作者一直在努力解决在相对高结构化认知水平上制定跨种交流问题工作模型的问题。发现总问题的大部分在于作者自身的物种，而非海豚物种。目前还没有关于通信网络中人类部分（海豚）的充分理论。这种理论的缺乏使得大多数科学家难以看到所提问题的现实。只要“人类大脑和心灵优于地球上所有大脑和心灵”的意识-无意识基本信念仍然存在，跨种交流存在的这一命题就很难获得认可。


    作者目前的努力旨在制定一项鼓励计划，以创建物种系统人类端的一些模型，这些模型将说明、阐明并详述在该领域产生兴趣和研究努力所需的各种假设。

