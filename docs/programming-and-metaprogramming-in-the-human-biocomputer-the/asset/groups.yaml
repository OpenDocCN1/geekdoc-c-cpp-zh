    The isolated solitinous individual does not have a present coalition to work on,
    in, or with. He projects past coalitions and makes new models by making new coalitions
    of the old ones. As such new relationships are established in his computer he
    settles logical discrepancies between old models and new ones, tends to abolish
    discontinuities of the logical consequences, and, if necessary, he changes the
