    of the functions of a second CNS. The corresponding parts of the second CNS as
    compared to the first can be found and an evaluation made of the differences in
    thresholds, in area distributions of thresholds and in analogous areas between
    the two CNS''s.


    A more detailed proposal is given in the following Chapter 14.'
