    房间。随着他的移动，他开始发现这些门是由他自己的计算机定义的门；锁被定义为锁；而钥匙被定义为打开锁的必要条件。


    在一种灵光一现的时刻，他看到这些定义的边界（门、墙壁、天花板、地板以及锁本身及其钥匙）是一种方便的元程序（metaprogram），将他的知识和控制机制以一种人工的人格化方式划分成若干个隔间。


    他探索了许多房间，房间里蕴含着许多不同类型的知识。墙壁开始缓慢溶解，其中一些融化流走了；另一些房间显现出来是实心的，且带有坚固锁具的门非常多；有些钥匙丢失了。


    然而，他脑海中假设的大部分建筑都变成了开放空间，信息可以自由获取，而不再在任意类别房间之间存在先前的墙壁。留下的那些房间、锁和钥匙，对于这个个体自我元程序的开发来说是非常基础的。


    这些房间中的一些是在童年为了应对自我元程序编写者无法控制的情况而创建的。这些房间容纳了思想和思维系统，当他意图打开门时，这些特定的主题会引发强烈的恐惧或强烈的愤怒。锁对正面攻击没有反应。事实证明，这些房间非常难以通过定义来消除，以便其内容能与元程序的其他层级进行交互。


    该主体经历了疯狂而恐惧的搜寻，寻找开启这些金库之锁的钥匙。他在恐惧和愤怒之间交替变化。他对这些封闭房间的墙壁、门、天花板和地板进行了几次攻击，但没有取得太大成效。


    他离开了这些房间，进入了其他的宇宙和其他空间，让计算机在自己的意识水平之下运作寻找解决方案。


    后来，带着更高的动机能量，主体回到了锁、门和房间的问题上，他在其他领域的经历中得到了某种程度的焕发。


    在处理上锁的房间时，接着尝试了数学变换。他放弃了“钥匙匹配锁”以及“寻找钥匙之必要”的概念，将房间视为拓扑谜来处理。在多维认知和视觉空间中，现在可以在不需要锁中插入钥匙的情况下操控房间。


    利用一种过渡概念——即锁是门上的一个洞，人们可以通过这个洞施力进行拓扑变换——可以将房间变成除闭合盒子以外的另一种拓扑形状。实际上，房间通过洞、通过锁被翻了过来，将内容留在外面，房间现在变成了一个塌陷的气球，放置在离自我元程序编写者更远的地方。房间接一个被定义为翻转，内容涌出供自我元程序编写者使用。一旦这个控制钥匙生效，它就会自动持续到它的极限。


    通过这种所谓的“智力拐杖”，进入了基础信念的全新领域。之前看起来像带有坚固有力的墙壁、门和锁的金库的大多数房间，现在都变成了空气球。在许多情况下，房间内受到严密保护的内容被证明是相对微不足道的程序和童年片段，这些片段被这个特定的人类计算机过度泛化和过度估值了。人类双向计算机通用属性的贬值就是其中一个房间。在童年时期，进入了许多导致自我元程序编写者不再通用，而是变得越来越局限和专门化的片段。童年时期留下的几层“超自我元程序”被打开了。


    在计算机中发生的数学操作，是能量和数据质量从超自我元程序向自我元程序层级及以下的移动。同时，已知程序材料已在程序层级从超自我位置移动到了受自我控制的位置。这些操作都记录在元程序存储中，标题为“钥匙并非钥匙”。人们注意到，现实世界中对锁和钥匙的必要性必须被处理。曾有一段时间，主体非常愿意扔掉所有的钥匙，并保持生活中所有的门处于未锁状态。这种尝试持续了很久，结果导致了盗窃。这立刻明白了一个显而易见的事：外部现实程序无法被自我元程序编写者控制。还有其他人类双向计算机和真实的外部现实，它们具有自我元程序编写者无法控制的预测属性。因此，在超自我元程序中必须保留某些应用于外部现实的人类计算机准则。


