    Bond 博士对结合神经学和心理分析训练的坚持在需要时给予了信心。


    多年来，作者从 Warren McCulloch 那里学习了追求与大脑相关的类造计算机逻辑和语言的必要性和灵感。Walter Rosenblith 博士在
