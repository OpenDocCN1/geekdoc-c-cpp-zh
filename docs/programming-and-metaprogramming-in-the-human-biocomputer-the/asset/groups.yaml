    Coalitions at all levels (from basic particles, atomic-molecular, to cellular-organismic,
    to human-human levels) have a polar, opposite, balancing set of forces, energies,
    drives, motivations. On the basic particle-atomic-molecular coalition level, this
    set can be called electric charges, with well-known coalitional rules (opposite
    attracts, like repels, quant energy jumps, tunneling effect, etc.). On the biological
    level of cells, the cell-cell coalitions have multiple possibilities (such as
    meiosis, mitosis, fission, fusion, positive and negative tropisms, ingestion,
    excretion, etc.). As long as a cell has its own structure, it maintains only structural
    relations between molecules in itself: it is said (Duvigneau) that each and every
    atom in a cell is eventually exchanged for another new atom. The coalitions of
    a cell''s atoms are temporary, and in the mass, last a most probable time characteristic
    of cell and atom types (lead in bone vs. sodium in brain, for example).


    At this cellular level electric charges, on the average, establish gradients;
    the gradients with internal reality and external reality states; the atoms move
    in and move out, more or less rapidly depending on cell parts (nucleus, mitochondria,
    ribosomes, etc.) and functional locus (intracellular fluids vs. genic structures,
    etc.).


    An intra-organismic cell (in the mammals, for example) has coalitions with other
    cells and with the organism. It has orders about its relations with neighbors,
    its origins, its meiotic or mitotic future (if any), its motility or sessility,
    its electrical activity, its chemical activity, where it stays or where it travels
    and on the average and when it dies. Each cell is brought under the mass orders
    of all (of the organism) by carefully regulated rules of feedback and interconnections
    through chemical, physical and cellular means. The high-speed inter-cellular neuronal
    system penetrates most


