    the external reality (the whole body or the face alone) it is possible to induce
    a special state of consciousness (or special program or metagram in the use of
    perception circuitry) in which remembered or unconsciously stored images of self
    or of others appear on or in place of the body image. Such stored images can be
    selected within certain limits, manipulated within other limits, or allowed to
    occur in a free association context, appearing as parallels of the current thought-stream.
