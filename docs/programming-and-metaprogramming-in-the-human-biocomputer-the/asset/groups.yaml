    # Forward to Second Edition


    This work has a curious history. It was written as a final summary report to a
    government agency (National Institute of Mental Health) concerning five years
    of my life work (the agency paid my salary for the five years).


    It was conceived from a space rarer these days than it was then: the laws suspending
    scientific interest, research, involvement and decisions about lysergic acid diethyl
    amide tartrate were passed just as this particular work was completed; the researchers
    were inadequately consulted (put down, in fact). The legislators composed laws
    in an atmosphere of desperation. The national negative program on LSD was launched;
    LSD was the big scare, on a par with War, Pestilence, and Famine as the destroyer
    of young brains, minds and fetuses.


    In this atmosphere (1966-1967) Programming and Metaprogramming in The Human Biocomputer
    was written. The work and its notes are dated from 1964 to 1966. The conception
    was formed in 1949, when I was first exposed to computer design ideas by Britton
    Chance. I coupled these ideas back to my own software through the atmosphere of
    my neurophysiological research on cerebral cortex. It was more fully elaborated
    in the tank isolation solitude and confinement work at NIMH from 1953 to 1958,
    run in parallel with the neurophysiological research on the rewarding and punishing
    systems in the brain. The dolphin research was similarly born in the tank, with
    brain electrode results as parents in the further conceptions.


    While I was writing this work, I was a bit too fearful to express candid in writing
    the direct experience, uninterpreted. I felt that a group of thirty persons’ salaries,
    a large research budget, a whole Institute''s life depended on me and what I wrote.
    If I wrote the data up straight, I would have rocked the boats of several lives
    (colleagues and family) beyond my own stabilizer effectiveness threshold, I hypothesized.


    Despite my precautionary attitude, the circulation in 1967 of this work contributed
    to the withdrawal of research funds in 1968 from the research program on dolphins
    by one government agency. I heard several negative stories regarding my brain
    and mind, altered by LSD. At this point I closed the Institute and went to the
    Maryland Psychiatric Research Center to resume LSD research under government auspices.
    I introduced the ideas in work to the MPRC researchers and I left for the Esalen
    Institute in 1969.


    At Esalen my involvement in direct human gut communication and lack of involvement
    in administrative responsibility brought my courage to the sticking place. Meanwhile,
    Stewart Brand of the Whole Earth Catalog (Menlo Park, Calif.) reviewed the work
    in the Whole Earth Catalog from a mimeographed copy I had given. W. W. Harmon
    of Stanford for his Sufic purposes. Stewart wrote me asking for copies to sell.
    I had 300 printed photo offset from the typed copy. He sold them.


    # Preface to Second Edition


    All human beings who reach adulthood are programmable biocomputer. (Wait, correcting
    based on context: All human beings who reach adulthood are programmable biocomputers
    No one of us can escape our own nature. Literally, each of us may be programs,
    nothing more nothing less.


    Despite the great varieties of programs available, most of us have a limited set
    of programs. Some of these are built-in. The structure of the nervous system reflects
    its origins in simpler forms from protozoans, sponges, corals through sea worms,
    reptiles and protomammals to primates to apes to anthropoids. In the basic forms,
    the programs were mostly built-in: from genetic codes to fully formed organisms,
    the patterns of function-action were determined by necessities of survival, of
    adaptation to slow environmental changes.


    As the size and complexity of the nervous system increased, new levels of programmability
    appeared, not tied to immediate survival and eventual reproduction. The cerebral
    cortex appeared as an expanding new high-level computer controlling the structurally
    built-in programs. For the first time learning and its faster adaptation to a
    rapidly changing environment began to appear. Further, as this new cortex expanded
    over several millions of years, a critical size of cortex was reached. At this
    new level of structure, a new capability emerged: learning to learn.


    When one learns to learn, one is making models, using symbols, analogizing, making
    metaphors, in short, inventing and using language, mathematics, art, politics,
    business, etc. At the critical brain size, languages and its consequences appear.


    To avoid the necessity of repeating to learn, symbols, metaphors, models each
    time, I symbolize the underlying idea in these operations as metaprogramming.
    Metaprogramming appears at a critical cortical size – the cerebral computer must
    have a large number of interconnected circuits of sufficient quality for the operations
    of metaprogramming to exist in that biocomputer.


    Essentially, metaprogramming is an operation in which a central control system
    controls hundreds of thousands of programs operating in parallel simultaneously.
    This operation in 1972 is not yet done in man-made computers – metaprogramming
    is done outside the big solid-state computers by the human programmers, or more
    properly, the human metaprogrammers. All choices and assignments of what the solid-state
    computers do, how they operate, what goes into them are still human biocomputer
    choices. Eventually, we may construct a metaprogramming computer and turn these
    choices over to it.


    J. C. L.

    February 7, 1972

    Los Angeles, California

