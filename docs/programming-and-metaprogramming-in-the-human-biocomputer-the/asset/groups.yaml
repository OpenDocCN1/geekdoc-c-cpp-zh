    must be carefully regulated by proper programming.


    Interactions of the human computer with other mammals and with supra-mammalian
    species must be programmed in an anticipatory way.


    There must be regulation of information, the kind of information and the amounts
    from anywhere and from anyone for the best functioning of the human computer.
    There are such phenomena as “information-overload” and “information-deprivation.”
    There are multiple programs for the regulation of the individual with respect
    to the society surrounding him, which have their own imperatives.


    In summary, there are metaprograms which must be assumed to be true in the sense
    of external reality and external proof. Each of these metaprograms has its own
    definition of that which is true or false. The ‘as if true’ and ‘as false’ categories
    can only be applied to these metaprograms in temporary hypothetical consideration
    of their content but not in their performance in the real computer and in the
    real world. During the LSD25 state certain of these programs must be considered
    as true (externally true and provable) in order to survive during the LSD25 state.
    These matters are examined in more detail in other parts of this work.'
