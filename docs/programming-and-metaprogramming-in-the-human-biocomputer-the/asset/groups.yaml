    higher ethical strivings than current ones, may store information of certain kinds,
    may develop skills in certain areas, may carry these capabilities within it to
    the next state after the current mortal physical reality is left, etc.


    +   1. Ego-mind Entity: one’s mind and mental self are valued above the body (and
    in those with the above religious belief, below the soul).


    +   2. Body it is obvious that one values one’s-body less than one’s mental self;
    however, at times one can be forced to act as if the list did not have this order
    but the opposite. Sometimes the mind shuts down, leaving the body to its survival
    battle alone.


    +   3. Lover starting with the prototypic father and mother models and moving
    to wife or husband models.


    +   4. Child: one’s own child.


    +   5. Siblings.


    +   6. Parents.


    +   7. Valued friends.


    +   8. Humans in general.'
