    Examples of Extremely Active Positive State: Subjective Report, Special Type of
    Epileptic Seizure. Dostoyevsky in a letter to Nikolai Strakhov.


    "For a few moments before the fit," he wrote to the critic Nikolai Strakhov, "I
    experience a feeling of happiness such as it is quite impossible to imagine in
    a normal state and which other people have no idea of. I feel entirely in harmony
    with myself and the whole world, and this feeling is so strong and so delightful
    that for a few seconds of such bliss would gladly give up ten years of one''s
    life, if not one''s whole life."


    Prince Leo Nikolayevich Myskin:


    "He was thinking, incidentally, that there was a moment or two in his epileptic
    condition almost before the fit itself (if it occurred during his waking hours)
    when suddenly amid the sadness, spiritual'
  - '[PAGE 175]


    darkness and depression, his brain seemed to catch fire at brief moments, and
    with an extraordinary momentum his vital forces were strained to the utmost all
    at once. His sensation of being alive and his awareness increased tenfold at those
    moments which flashed like lightning. His mind and heart were flooded by a dazzling
    light. All his agitation, all his doubts and worries, seemed composed in a twinkling,
    culminating in a great calm, full of serene and harmonious joy and hope, full
    of understanding and the knowledge of the final cause. But those moments, flashes
    of intuition, were merely the presentiment of the last second (never more than
    a second) which preceded the actual fit. This second was, of course, unendurable.
    Reflecting about that moment afterwards, when he was well again, he often said
    to himself that those gleams and flashes of the highest awareness, and hence,
    also of ‘the highest mode of existence,’ were nothing but a disease, a departure
    from the normal condition, and, if so, it was not at all the highest mode of existence,
    but, on the contrary, must be considered to be the lowest. And yet he arrived
    at last to the paradoxical conclusion: ‘What does it matter that it is an abnormal
    tension, if the result, if the moment of sensation, remembered and analyzed in
    a state of health, turns out to be harmony and beauty brought to their highest
    point of perfection, and gives a feeling, undivided, undreamt of till then, of
    completeness, proportion, reconciliation, and an ecstatic and prayer fusion in
    the highest synthesis of life?’ These vague expressions seemed to him very comprehensible,
    though rather weak. But that it was really ‘beauty and prayer,’ that it really
    was ‘the highest synthesis of life,’ he could not doubt, nor even admit the possibility
    of doubt. For it was not abnormal and fantastic visions he saw at that moment,
    under the influence of hashish, opium, or spirits, which debased the reason and
    distorted the mind. He could reason sanely about it when the attack was over


