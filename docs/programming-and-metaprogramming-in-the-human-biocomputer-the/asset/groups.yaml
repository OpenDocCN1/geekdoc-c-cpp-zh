    until a wishful phantasy constructed to avoid analyzing one''s ruthlessly and
    objectively is eliminated.


    - 25. Apparently not all programs are revisable. The reasons seem various; some
    are held by feedback established with other mind-brain-computers in the life involvement
    necessary for procreation, financial survival, and practice of business or profession.
    Other non-revisable programs are those written in emergencies in the early growth
    years of the computer. The programs dealing with survivals of the young self sometimes
    seem to have been written in a hurry in desperate attempts to survive; these most
    seem intransigent.


    - 26. Priority lists of programs can function as metaprograms. Certain programs
    have more value than others. By making such lists the individual can find desired
    revision points for rewriting important metaprograms. In other words it is important
    to determine what is important in one’s life.


    - 27. The basic bodily and mental function programs and their various forms dealt
    with in verbal-vocal modes (words, speech, etc.) have been described in great
    detail in the psychoanalytic literature. Evasion, denial, and repression are varieties
    of metaprograms dealing with the priority list of programs. Metaprograms to hide
    (repress) certain kinds of storage material are commonly found in certain persons.


    Such analyses are confined to the verbal-vocal-acoustic modes. Encounters with
    other persons in the real world are much more powerful in terms of modifications
    of programs than psychoanalysis or self-analysis. For example learning through
    sexual intercourse cannot be given through the verbal-vocal mode.


    - 28. The detailed view of certain kinds of non-speech, nonverbal learning programs,
    i.e., some of the methods of introducing such programs and parts thereof, are
    exemplified in the work of I. P. Pavlov and of B. F. Skinner. Some of these results
    are the teaching and the learning of a simple code or language, a code with nonverbal
    elements (non-vocalized and non-acoustic) with autonomic components (Gordon Pask,
    1966). Other motor outputs than the phonation apparatus are used.


    - 29. The reward-punishment dichotomy or spectrum is critically important within
    the human computer’s operations.


    The fact of various CNS circuits existing as reward and “punishment” systems when
    stimulated by natural inputs must be taken into account (Lilly, J. C., 1957, 1958,
    1959). The powerful emotional underpinnings of “movement toward” and “movement
    away” must be included, as well as the acquisition of code symbols for these processes.
    Such symbols tend to set up the priority hierarchies of basic operational programs
    in microformat (nonverbal) and in macroformat (verbal). Too often, “accidental”
    juxtaposition seems to key off improper hierarchical relations at the outset,
    with resulting priorities set by “first occurrence” spontaneous configurations,
    unplanned and unprepared. With a new view and a new approach, with planned "spontaneities"
    graded by order of occurrence, proper program priorities could be set at the beginning
    of the computer''s life history. The maintenance of general purpose properties
    from the early human years to adulthood is a worthwhile metaprogram.


    The positive (pleasure producing) and negative (pain or fear producing) aspects
    of the programs and metaprograms strike at the very roots of motivational energies
    for the computer. One aspect of Isergic acid diethylamide is that it can give
    an overall positive motivational aspect to the individual in the LSD25 state.
    This may facilitate program modifications, but it also can facilitate seeking
    pleasure as a goal of itself.


    - 30. Various special uses of the human computer entail a principle of the computing
    use of the limited amount of total available apparatus. To hold and to display
    the accepted view of reality in all its detail and at the same time to program
    another state of consciousness is difficult; just isn’t enough human brain circuitry
    to do both jobs in detail perfectly. Therefore special conditions give the best
    use of the whole computer for exploring, displaying, and fully experiencing new
    states of consciousness; physical isolation (only with special stimulation patterns,
    if any) (Lilly, 1956) gives the fullest and most complete experiences of the internal
    explorations. One such extreme condition is profound physical isolation (isothermicity,
    zerolevel visible quanta, sonic levels below threshold, minimum gravitational
    resisting unit area forces, minimum internal stimulation intensity, minimum respiration
    stimulus level, etc.). This condition can give some additional new states of consciousness
    the “necessary low-level evenness of context” in which to develop. These results
    are facilitated by minimizing the necessities for computing the present demands
    of the physical reality and its calculable present consequences (physical reality
    programs).


