    the powerful currents of emotion in full force, go along with them, and eventually
    construct a vigorous model consonant with the desired ideal metaprograms but also
    with emotional power built-in. If not strong enough, the selfprogrammer can be
    temporarily overwhelmed by protohuman survival programs. There is an additional
    caution in the use of these substances; the selfprogrammer must be strong enough
    to experience these phenomena and not make difficult to reverse errors or difficult
    to correct errors in the external world. This is an area of human activity for
    the most experienced and strongest personalities, with the right training. I do
    not recommend the use of these methods except under very controlled and studied
