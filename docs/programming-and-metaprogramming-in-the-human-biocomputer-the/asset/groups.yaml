    # Rick Doblin 的后记


    1972年初，我仅 18岁。在反对 LSD 的浪潮导致全球范围内幻药物研究结束几年后，我读了约翰·利利（John Lilly）的《人类生物计算机中的编程与元编程》（Programming
    and Metaprogramming in the Human Biocomputer），以及一份格罗夫（Grof）的《人类无意识领域》（Realms of
    the Human Unconscious）的手稿副本。当时我是佛罗里达州萨拉索塔新学院（New College）的大一学生，这两本关于 LSD 研究的关键书籍改变了我的人生。


    我欣赏它们对科学的立足、利用 LSD 这一奇妙工具对心灵深处的探索、智力上的勇气，以及对神秘主义和灵性进行严谨评估的开放态度。它们激励我成为一名幻药物研究人员和治疗师，试图将这些具有具洞察力、灵性和治愈功能的幻药物工具从被犯罪化和被放逐的地下世界带回来。


    这两本书对我来说都很难理解，有时在某页上需要花费几个小时来思考其中表达的观点。约翰的一些观点具有深刻的解放性，尤其是他的那句话：“在心灵领域，凡被认为是真或变为真的的事物，其限制可以通过经验和实验来找到。这些限制是进一步的需要被超越的信念。在心灵领域，没有限制。”我买了一张磁带，上面反复播放那段话，我听了很久。


    1984年，我第一次见到了约翰·利利，这是因为他努力为他的两只想要回到野外的海豚——Joe 和 Rosie 寻找一处栖息地。约翰和他的研究主管罗伯塔·奎斯特（Roberta
    Quist）应我的邀请来到萨拉索塔。他们在我的朋友中找到了一个支持群体。更多的海洋研究实验室（More Marine Research Lab）愿意与人类/海豚基金会合作，将海豚自然化到萨拉索塔湾。Rosie
    的怀孕阻碍了移动海豚的计划，导致项目推迟。


    现在我60岁了，2014年初，我将一生献给了幻药物研究，并正走在成为合法幻药物治疗师的道路上。回首过去，我感到庆幸在生命如此关键的阶段遇到了这些改变思想的大师，随后又与约翰·利利和斯坦·格罗夫（Stan
    Grof）见面并他们学习。


    《人类生物计算机中的编程与元编程》是一部智力的杰作，是理性思维为从无意识中涌出的内在意识流带来秩序和意义的胜利。《人类生物计算机中的编程与元编程》的目的是理解。《人类无意识领域》同样是一部智力的杰作，但其目的是心理治疗和治愈。


    《人类生物计算机中的编程与元编程》仍然是一部先驱经典，它帮助我们所有人意识到，我们所认为的现实在很大程度上是通过我们自己的感知过滤器过滤过的，而我们有义务对这些过滤器进行严谨评估。结合约翰的人生轨迹来看，《人类生物计算机中的编程与元编程》是一堂元课程：它告诉我们，仅仅有智力是不够的，头脑需要内心的平衡，理解需要治愈的平衡。这本深刻而勇敢的书能够重新出版，是一份巨大的礼物。


    里克·多布林（Rick Doblin, Ph.D.）


    2014年2月18日


    # Glenn Perry 的后记


    约翰·C·利利（Dr. John C. Lilly）利用计算机的类比来描述心灵的运作和个人的行为。他发明了一个概念：人的行为是由其大脑中的程序决定的。在当时，这是独特的，是“独一无二”的，因为以前从未这样表述过。那种能够产生这种表述的远见智慧和想象力启发了我们许多人。


    记得在 50 年代 60 年代，当约翰调查这一领域时，个人和小企业是没有电脑的。只有极大型公司拥有大型机计算机，用于工资发放、账单、库存等的批量处理。


    60 年代，我在一家计算机制造商科学数据系统（Scientific Data Systems）工作，开发一项新行业：实时处理。计算机将控制正在发生的过程，而不是处理过去或未来的交易。


    在那个时期结束，我见到了利利博士。我当时是一个系统计算机程序员，六人小组中的一员，为我们的的主机创建第一个分时系统。这个系统允许 128 个人通过各自的终端，通过电话线连接到计算机，并像他们是唯一的使用者那样样与之交互。


    由于我从事计算机工作，约翰的公式对我来说有一种特殊意义。我对生活有一种“科学”的方法。只有当你能触摸、看到并观察它时，它才是真实的。我熟悉物理的、心理的以及（在小程度上）情感的宇宙。还有一个我称之为灵性的整个宇宙，那是东方思想家研究过的。约翰对灵性事务的调查为西方人提供了一个特殊的视角，让我们了解了大多数人知之甚少的领域。


    对于我们这些追求在约翰为了研究而发明的隔离箱中漂浮的人来说，这本书可以作为一门课程。


    格伦·佩里（Glenn Perry, Samadhi Tank Co., Inc.）


    2014年4月


    # Craig A. Inglis 的后记


    > “让外太空的访问者印象最深刻的第一点，将是人类潜力与表现之间巨大且无法解释的鸿沟。”


    —— 威廉·S·巴鲁斯（William S. Burroughs）


    约翰·C·利利是人类的一一员，他一生致力于“弥补差距”。


    这位远见卓者预到了我们目前表现路径可能导致的毁灭性结果，随后他致力于为我们提供增加潜力的手段。约翰是许多愿意、能够且完全不害怕使用所有可用工具进行激进内在和外在探索的人之一。


    《人类生物计算机中的编程与元编程》源于约翰严谨科学研究与勇敢自我实验的结合。为了创建一个实验室，他将三种强大的工具结合在一起：大脑；他发明的隔离箱，用于消除“疯狂”；以及炼金般的化学品
    LSD。


    这种结合创造了自我检查、观察、学习以及关注关注的协同效应，这为我们未来多年留下了许多“磨刀石”和深刻的领悟（grokking）。


    当然，正如约翰在演讲开始时经常开玩笑说的，“这些都是牛粪。”他意识到我们的内在现实在尝试交流时，被投影在语言的屏幕上，因此我们所说的任何话都不是体验本身，而是描述性的误读。我个人发现，约翰的这些误读在我的生活中非常有用，特别是将一种信念体系视为真理，坚持其中任何有价值的部分，忽略其他的，并转向另一个。“万物皆流，”赫拉克利特曾这样说，而我们的问题似乎源于我们固执地坚持熵增信念，而不是关注负熵信念。


    约翰进入我的生活是我从事隔离箱工作的最初动力，我对他相识感到感激不尽。我几乎每天都能意识到他对我持续的影响。我无法数出他向我介绍过多少同路人。我甚至每进入隔离箱都会听到约翰洪亮的声音在脑海中回响：“避开虚空！”


    作为《星际迷航》的忠粉丝，约翰总是展望未来，我怀念他有时每天两次邀请我一起看这部剧。电话里的邀请总是三个词，不多不少也不少，因为他不擅长闲聊：“开播！”


    就像许多伟大人物一样，我曾多次看到约翰因其行为受到评价。我记得一位访问者对约翰在看电视表示不可置信。“简直是浪费……”


