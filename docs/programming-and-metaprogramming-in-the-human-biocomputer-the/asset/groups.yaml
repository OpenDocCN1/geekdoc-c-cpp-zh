    self-destruction in them is necessary. The use of LSD-25 in self-analysis allows
    quick penetration to such buried lethality; a definite caution is advised in such
    use of this technique. Until such unconscious programs are found and thoroughly
    investigated, and understood in terms of the metaprogrammatic future, personal
    professional supervision (of a special type) is recommended. Such supervision
    should be over the whole period of investigation and (in detail) should be before,
    during, and after a session for at least several days. Some of the instinctual
    patterns of behavior stirred up in the process of the session apparently must
    be acted out in order to be tested, understood and filled properly in the metaprograms
    for the future plans of the individual. In this phase, dangers to self arise.


    The states of the revelation of the implanted deeper programs may involve the
    stages of childhood plus those presumed to have led Man (as an evolving primate)
    to civilization itself, and finally those leading into Man''s own future beyond
    present accomplishments.


