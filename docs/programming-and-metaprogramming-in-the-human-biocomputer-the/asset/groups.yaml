    冲突可以通过几种方式投射：图像在两个相互冲突的类别（情感、命令、人物、理想或其他）之间快速来回切换；或者，内在争论的部分（迥异的部分）被并排投射，使显示呈现出奇特的、处于冲突中的立体深度感。深度的疲劳通过显示出老化的或病态的斑驳图像表现出来。


    通过使用通往“符合自我理想”的替代路径通往显示程序及其投射，可以证明那些阻止某些内容进入显示机制的负面操作是客观存在的。例如，某些无法投射到自自身镜像影像中的材料，有时可以投射到他人的彩色照片上。在某些情况下，照片中的另一个人必须是最合适且最可接受的异性（仅脸部、全身穿衣服的、或裸体），以充分利用对所需材料的显示。


    在适当的情况下，选择得当的真实人物也可以作为外部现实的三维屏幕，材料可以投射其上。后这种“屏幕”不是被动的，它可能会自己说一些话或做一些事，从而改变投射或引发一个新的程序（例如要求性的外部现实程序），这种程序可能会消除视觉显示本身的整个投射现象。当一个人看到另一个人的脸上投射出（例如）自己更深层的情感时，可能会意识到这种情况在意识水平之下一直在发生，这并非归功于这种物质的特殊能力；即：存在一个准备好的无意识“显示”（在这里由于特殊条件允许其进入视觉机制），它在外部现实程序中与他人以无意识或前意识的方式共同运作。这种初次发现对于随后对人际关系的自我分析可能具有治疗益处。


    ## 躯体面孔


    投射到自身整体（或投射到他人真实身体）的一种有趣的投射类型是躯体面孔自我创造的现象。在这种现象中，人们看到一个“怪物生物”的脸，其投射的特征由以下真实的身体部位组成：真实的肩膀变成“头顶”，乳晕变成“眼睛”（带有女性特征的突出的眼），肚脐变成“鼻孔”，耻骨变成“嘴巴”，对于男性来说，阴茎变成“舌头”。这张脸虽然本身非常空虚，但通过适当的程序可以使其变得令人恐惧、悲伤或快乐。一旦看到，即使在体位发生剧烈变化时也很产生。分析显示，在特定案例中，这张脸从非常幼的时期就开始储存，并是由关于身体（男性和女性、威胁/诱惑）的幻想产生/导致的。这种投射作为某些类型恐惧的追踪器是有用的。


    ## 空白屏幕


    在LSD状态下，用于投射显示程序的外部现实屏幕可以排列成一组具有各种维度且彼此相互相关的屏幕。其中包括：

    -   非自我的真实人物；

    -   这些人物在各种状态下的电影；

    -   这些人的静态照片；

    -   过去的自己的照片，动态和静态，三维和二维的；

    -   镜子中自己脸部和/或身体的此时三维彩色图像；

    -   最后，是睁开眼睛或闭上眼睛空白无光或发光投射屏幕。


    从内省的角度考虑，空白投射屏幕取决于眼睛是睁开还是闭上。在黑暗中，在绝对的黑暗中，可以检测到睁眼和闭眼空白屏幕之间的差异。睁眼的情况提供了眼睛之外的深度，一种区域视觉空间的感觉。对于受试者来说，闭眼会立即将转向另一个视觉空间，这个空间看起来更内在、更内省、更主观。在LSD25状态下，这些差异在深度的隔离条件下被缩小了。


    空白屏幕是最难处理的，但在这一组中“驱动力”最小。空白屏幕对人的创造性努力干扰最少；它需要更多的程序电路来创建那些其他屏幕本身可以提供的方面，即从感知机制直接进入投射程序本身。空白屏幕不会轻易显示出“禁忌的转换”，除非保持空白，即：在空白屏幕上投射需要更多的放松和自由来与这种视觉模式进行“自由联想”。


    有时，交叉模态（cross-model）跨模态联觉投射可能有助于空白屏幕；来自客观听觉机制的激发可以转换为视觉投射的激发。这里使用的最常见的激发是音乐；这种组织良好的模式输入倾向于“通过联驱动内容”。例如，宗教音乐可以唤起童年时期由真实的图片、教堂和幻想等构建的宗教幻象。其他输入是声音，自己的真实声音或录音的声音，他人的声音，这些来源可能会出现与图片类似的问题。我们称之为“外部现实程序”的高优先级程序可能倾向于夺取电路，并用已知且有价值的人的照片或声音接管投射程序。这种效应中断了投射及其自由联想。从长期来看，通过使用通常的精神分析技术进行持续的自我分析，可以证明外部现实的内容与其联系是相关的。


    这种中断取决于个体计算机及其在投射程序与外部现实程序之间的冲突。如果存在罪恶或恐惧，外部来源将把计算机的能量引回外部现实。或者，如果外部现实中人物的激发水平升到某个值，整个计算机将转向那个特定人物以及他/她的声音输出和行为。


    纯随机噪声可能会避免这些困难；它可以是一个适当的声学照明空白屏幕，用于视觉投射的交叉模态激发。在双耳中使用同步和非同步噪声的初步实验显示了一些新的编程可能性。然而，这里的陷阱是通过噪声本身的随机过程回避初始的编程问题。这会导致混乱的编程，即：随机性本身可以在元程序系统中积聚到巨大的强度。通过调整两个非相关噪声的强度，可以减轻这些效应，并将噪声照明视觉屏幕用于适当的投射目的。该领域目前只有初步实验。


    ## 零水平外部现实


    当各种类型的外部投射屏幕（视觉、听觉到视觉的联觉、身体意象等）取得足够进展后，消除或至少极大减少来自外部现实的所有刺激模式，允许对无意识进行更深层的直接渗透。这里的原理是，巨大的计算机中更多的电路从外部激发程序中释放出来，因此可以将更多的精力用于内在认知现实及其分析。投射“程序”仍然在使用，但方式有所不同。


    在极大衰减的环境中（92至95华氏度等温皮肤、盐水悬浮、零光、近零声音水平、无衣、无墙壁或地板接触、在远程隔离中孤独数小时），加入LSD25让人看到之前所有关于“外部屏幕”的经验都是对自我深度渗透的逃避（因此，它们在“阻挡后方”的意义上也是“接收投射影像”的屏幕）。


