    # But the Model Operates Differently in the Two Cases.


    With vigorous e.r. interlock, the human biocomputer is busy with information exchange
    at all levels [verbal and nonverbal, digital and analogic, etc. (G. Bateson)].
    The model projects expectations and predictions continuously as the interlock
    develops (as in McCulloch''s model of the eye, 1961). The real inputs are compared
