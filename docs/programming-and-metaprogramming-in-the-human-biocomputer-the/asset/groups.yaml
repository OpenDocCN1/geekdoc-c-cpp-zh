    beliefs about another person. It is almost as if one can extend one’s own brain-computer
    into that of another person by feedback and thus use the other as an actor, acting
    (“out there”) the part assigned by one’s own beliefs. Naturally, the performance
    is not perfect (see later Interlock).


    If the roles are accepted by the other and acted upon as new programming, unconsciously,
    one cannot see these processes easily. If the other person asserts himself and
    opposes the assigned roles, one has an opportunity to examine these processes
    in one’s self.


    One can make the following self-assumptions about the above sources of information,
    in solitude, in the LSD-25 state:

    - (1) inside one’s own head;

    - (2) from other beings, nonhuman;

    - (3) from outer space intelligences;

    - (4) from ESP with humans.


    If one assumes a transcendence program, one’s computer generates it according
    to one’s own rules for transcendence. Programming can be assumed as if it came
    from self, or other humans, and/or from other beings. Modern scientists assume
    that under these conditions information comes only from self, i.e., from storage
    wholly within the human computer. 73


