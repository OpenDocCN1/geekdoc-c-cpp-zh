    The problems attendant upon breaking human-human coalitions can be smoothly worked
    out, be somewhat energetic, or can generate much heat, smoke and fire. The real
    bond energy left in the linkages usually can be dissipated at any rate desired;
    the fuss and furor (external energy dissipation) seems to be directly proportional
    to the energy in the bond and to the rate of bond dissolution, i.e., directly
    proportioned to the time and energy spent to obtain agreement on both sides of
    the human-human linkage. But the rate control and the necessities of agreement
    to break the coalition must be dispassionately and objectively evaluated. Unless
    one knows how to control the results, one desires to avoid exciting protohuman
    survival programs below the levels of awareness in either or both parties in the
    coalition; these programs require continuous care and maintenance.


    Some essential factors of any and all human-human coalitions are circular feedback,
    distance rules, positive (attractive) and negative (repulsive) motives, excitation
    and inhibition rules and limits, and coalition field agreements. Each human coalition
    is formed in a coalition field surrounded by other coalitions with other individuals
