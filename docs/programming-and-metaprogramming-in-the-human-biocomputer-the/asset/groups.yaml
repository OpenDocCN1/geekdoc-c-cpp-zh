- md: "\nThis complex series of relations shows the delicate nature of the best state\
    \ for remetaprogramming and of remetaprogramming itself. Until sophisticated handling\
    \ (of these substances, the self-metaprogram, the person, the setting, the preparation,\
    \ etc.) can be achieved, careful voluntary education of professional personnel\
    \ should be done, and done carefully with insight. Selection of persons for training\
    \ must be diplomatic and tactful; it is a strategy to be carried out cooperatively\
    \ without publicity. Candor and honesty at deep levels is a prime requisite.\n\
    \n# 9 Summary of Basic Theory and Results for Metaprogramming the Positive States\
    \ with LSD25\n\n- 1. LSD25 facilitates the positive (reward, positive reinforcement)\
    \ systems in the CNS. (Tables 48, 10 and Figs. 39)\n- 2. LSD25 inhibits the negative\
    \ (punishment, negative reinforcement) systems in the CNS. (Tables 49 and Fig.\
    \ 9)\n- 3. LSD25 adds noise at all levels, decreasing many thresholds in the CNS.\
    \ (Table 2 and Fig. 9)\n- 4. The apparent strengths of programs below the usual\
    \ levels of awareness increase. (Figs. 35 and 9)\n- 5. Programmability of metaprograms\
    \ (suggestibility) increases, allowing more programming by the self-metaprogram\
    \ and external sources [hyphypersuggestibility of H. Bernheim (1888), Clark Hull\
    \ (1933.)] (Fig. 9)\n- 6. The continuous positive state (positive reinforcement,\
    \ reward, pleasure) plus inhibited negative system activity causes increased positive\
    \ reinforcement of the following:\n    - (a) self\n    - (b) one's own thinking\n\
    \    - (c) thinking introduced by others\n    - (d) other persons\n    - (e) the\
    \ given environment (r.r.)\n    - (f) any given patterned complex input (i.e.,\
    \ music, paintings, photos, etc.). (Tables 9 and 10 and Fig. 9)\n- 7. Subsequent\
    \ to exposure, the effects fall off slowly over a two to six week period, during\
    \ which period there is over-valuation of 6 (af). Residual effects can be detected\
    \ up to one year.\n- 8. Repeated exposures at weekly to biweekly periods for several\
    \ months (years) maintain the above reinforcements if the above conditions, inputs\
    \ and outputs can be reproduced. There is reinforcement of the positive reinforcements\
    \ until the usual state before LSD25 becomes negative.\n\n# 10 Coalitions Interlock\
    \ and Responsibility\n\nVon Foerster (“BioLogic,” in Biological Prototypes and\
    \ Synthetic Systems, Plenum Press, 1962) calls attention to the increasing survival\
    \ times of increasingly large aggregates of connected matter which he defines\
    \ as coalitions. Living systems are coalitions par excellence. A protozoan is\
    \ a coalition of atoms and molecules forming membranes and submicro and micro\
    \ structures which reproduce by collecting the same kinds of atoms and molecules\
    \ to form new identical individuals. A sponge is a primitive coalition of protozoa\
    \ with enhanced survival over any one protozoan. A man is a tightly organized\
    \ coalition of cells, including some mobile protozoa (lymphocytes, macrophages,\
    \ oligodendglia, etc.). Von Foerster says that mammalian cells of Homosapiens\
    \ may be the most numerous cells on earth, i.e., these cells with their multiple\
    \ level coalitions have the longest current survival time.\n\nThe nature of matter–matter\
    \ coalitions and cell–cell coalitions and organism–organism coalitions are explored\
    \ by Von Foerster. For a coalition to exist between any two entities, the dyad\
    \ is connected by a bond or bonds which reduce the sum of the negentropy of each\
    \ of the two entities separated (without a linkage). In this view the two entities\
    \ when in coalition reduce physical information available externally below the\
    \ levels of that available from the two entities each unlinked and separated.\
    \ The coalition as it exists thus appears to be something more than the mere sum\
    \ of isolated parts.\n\nHowever, the nature of the linkages in coalitions depends\
    \ upon the level of aggregations discussed. In a man the coalitions include those\
    \ between special atoms in spatial arrangements with others (alpha helices, etc.),\
    \ special cells in spatial patterns (liver, brain, etc.), and organism tissues\
    \ such as circulatory, lymph, and autonomic nervous systems. The bones assure\
    \ a maintenance of total form of the net coalition of a person under the one g\
    \ gravitational field. The continuance of important aspects of the individual\
    \ for inter-organism coalitions is based on shape maintenance despite g forces,\
    \ radiation, heat, etc.\n\nThe rules within the coalitions at each level are different\
    \ in that each level is somehow more than the sum of its separated individuals.\n\
    \nFor coalitions to develop between individual humans, linkages of various sorts\
    \ are developed: agreements are reached and thus the sources of new information\
    \ from each member are reduced. To maintain a dyadic coalition, interlock between\
    \ the two human computers is developed. Each human to human interlock is unique;\
    \ also each interlock is a function of other current and other past interlocks\
    \ of each member and of learned traditional models.\n\nCoalitions between humans\
    \ are immense in number and have great complexity in their operations. Each adult\
    \ individual has linkages extending to literally thousands of other individuals.\n\
    \nThe amount of time spent on maintenance of linkages is fantastic. The demands\
    \ on one's self by the various coalitions uses up most of one's awake hours (and\
    \ possibly most of one's sleeping hours).\n\nTo clarify the discussion we must\
    \ carefully distinguish between an interhuman coalition operating here and now\
    \ versus one whose past occurrences in the external reality are modeled in the\
    \ human biocomputer. The here and now operations of the model of a past dyadic\
    \ coalition can operate in the absence of a current instance of interhuman dyadic\
    \ coalition or in its presence.\n\n# But the Model Operates Differently in the\
    \ Two Cases\n\nWith vigorous interlock, the biocomputer is busy with information\
    \ exchange at all levels [verbal and nonverbal, digital and analogic, (G. Bateson)].\
    \ The model projects expectations and predictions continuously as the interlock\
    \ develops (as in McCulloch, 1961). The real inputs are compared with computed\
    \ outputs in all modes.\n\nThe isolated solitous individual does not have a present\
    \ coalition to work on, or with. He projects past coalitions and makes new models\
    \ by making new coalitions of the old ones. As such new relationships are established\
    \ in his computer he settles discrepancies between old models and new ones, tends\
    \ to abolish discontinuities between.\n\nCoalitions at all levels (from basic\
    \ particles, atomic-molecular, to cellular-organismic, to human-human levels)\
    \ have a polar, opposite, balancing set of forces, energies, motivations. On the\
    \ basic particle-atomic-molecular coalition level, this set can be called electric\
    \ charges, with well-known coalitional rules (opposite attracts, like repels,\
    \ quantum energy jumps, tunneling effect, etc.). On the biological level of cells,\
    \ the cell-cell coalitions have multiple possibilities (such as meiosis, mitosis,\
    \ fission, fusion, positive and negative tropisms, ingestion, excretion, etc.).\
    \ As long as a cell has its own structure, it maintains only structural relations\
    \ between molecules in itself: it is said (Duvigneau) that each and every atom\
    \ in a cell is eventually exchanged for another new atom.\n\nAt this cellular\
    \ level electric charges, on the average, establish gradients; the gradients with\
    \ internal reality and external reality states; the atoms move in and move out,\
    \ more or less rapidly depending on cell parts (nucleus, mitochondria, ribosomes,\
    \ etc.) and functional locus (intracellular fluids vs. genic structures, etc.).\n\
