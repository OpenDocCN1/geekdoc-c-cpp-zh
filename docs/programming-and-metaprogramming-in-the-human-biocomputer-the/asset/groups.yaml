    钥匙与锁的类比是该主题中“作为儿童的人类计算机”的一部分。现在锁被转化为一个n维选择点，在该点上，人们可以在正确的维度上以正确的方向施加适当的能量，并发现计算机该区域所有元程序（metaprograms）的根本性转变。在这些此类操作的三维几何模型中（其中通过减少维度数量，使其能够在视觉空间中可视化），人们可以想象成通过线、点和大量区域连接在一起的形状奇特的橡胶表面，这些表面被充气到不同的程度和压力，以填满一个巨大的房间。这些薄膜具有不同的颜色，各个区域的光照也不同，整个整体被认为在脉动并改变形状，但表面、线或点之间的接触并没有改变。人们可以想象自己正穿过这些复杂的表面。各种颜色的光从各个方向射来。人们在寻找这样一个区域，在该区域中，通过对点、线和表面接触区域能量的重新分配，可以产生最大的影响。人们还可以在每个表面闭合处空间内的压力差上产生最大的影响。


    在对该模型进行充分研究后，人们发现膜之间的接触点并不像最初看到时那样固定。最初看到的是一个跨越长时间的冻结瞬间，仿佛模型是静态的。突然间，人们意识到接触点是这些表面在给定时刻沿着适当线条的共享部分，而这些边界处于不断变化中。人们突然也发现，颜色正在表面上移动并穿过边界。这个特定的模型只是更大宇宙中的一个微小区域，宇宙中充满了此类表面以及它们之间的交叉空间。人们还发现，光源位于某些薄层内部并穿过它们射向其他薄层，且色调和强度根据某些局部规则而变化。


    人们离开模型，看到它正填满了整个宇宙；人们回到模型中，开始仔细观察其中一层薄的膜。随着膜结构的显现以及膜与膜之间交汇处结构的变得清晰可见，事实证明膜内部在分子和原子水平上存在着微电路。能量沿着预定的路径（有时是以嘈杂的方式）在膜内部的多个方向上移动。在交汇处，碰撞会发生碰撞（电子、介子、质子、中子、中微子等从两个方向从一个薄层移动到另一个薄层）。可以看到相邻的薄层正在以极快的速度进行局部计算。交汇处现在被视为微分子-原子的开关线、开关表面和开关点。


    因此，人们发现“钥匙不是钥匙”这一短语已演变为一种计算机的新概念。这台计算机在理想状态下不承认任何锁、任何禁忌转换、任何数据无法从一个区域自由移动到另一个区域的区域。然而，在计算机的边界处，仍然存在着所谓的定言律令。现在，问题不再是计算机内部的边界，而是其外部的边界。我所说的外部，不仅是指真实身体的皮肤边界。我指的是通过外部化学物理现实底层进入的其他影响源（图1）。为了象征对计算机边界以及除物理化学现实之外可能施加于其影响的怀疑和怀疑态度，在自我元程序（supraself-metaprograms）上方放置了一条线，并标记为“未知”（图1）。


    在该主体的大脑中，未知必须占据优先地位。它被放置在自我元程序之上，因为它包含了这个特定人类计算机的一些目标。对内在现实的这种探索假设了内在现实包含了值得探索的大量未知。然而，要探索它是必要的：（1）承认它们的存在；（2）为探索准备好计算机。如果一个人要探索未知，应该带上最少的行李，不要让那些无法灵活重新调整以接受和研究未知的概念机制成为自己的负担。那些有勇气和必要的内在装置来此此的人，其发展的下一阶段是对这一广阔内在未知区域的深度探索。对于这项任务，我们需要人类所能的最优思维。我们消解和/或重编程处理这些问题的教条主义和意识形态方法。


    即使对这种特定人类计算机处理该区域方法的正式化处理，保持怀疑态度也是理想的。人们不应高看这种特定方法；而是为了探索目的寻找替代方法。人们寻求摆脱自我元程序的暴政，但尚未达到其他人类计算机控制这台人类计算机的程度。这种探索需要选定的人类计算机之间进行深层且基础的互锁。负责这项任务的最尖头脑需要对思维机器本身进行概念化。在某种意义上，我们创造了这一领域的探索者。


