    ## 基础信念 3


    受试者假设存在某些人类存在其中并直接控制人类的生物。这是一个比上一个程序更严密的控制程序，并假设了全天候、每秒不间断的控制，仿佛每个人类都是一个更大有机体中的细胞。这些生物坚持要求每个人类中的活动必须完全受该人类所属的有机体的控制。在这种状态下，个体没有自由意志，也没有自由。这种“超自我元程序”受试者进入了两次；他每次都必须离开；因为对他来说，这太引起焦虑了。在第一情况下，他成为了一个庞大计算机的一部分，他是其中的一个元素。在第二种情况下，他是一个更庞大的思想中的一个念头：正在被快速、灵活且富有塑性地修改。


    上述所有实验都是通过图 1 向上观察，从“自我编程器”到“超自我元程序”完成的。进行了一组相反的实验，其中“自我元编程器”向下观察“元程序”、程序以及图 1
    中的较低层级。


    ## 基础信念 4


    一组基础信念可以归类在“寻找那些由我们控制并存在于我们内部的生物”这一方向。通过这个程序，受试者在自己身上发现了旧的模型（旧的程序、旧的元程序，由他人植入、自我植入、由父母、老师等注入的）。他发现这些是他体内的、性格迥异且自主的生物。他将他们描述为一个嘈杂的群体。他吸收的父母、兄弟姐妹、自己的后代、老师、妻子似乎是他体内的一个群无组织的人群，每个人都在他身上以及在他体内运行并争论一个程序。当他观察时，实验期间这些模型之间发生了战斗。他解决了这些生物之间相互独立且不整合的位点，并逐渐将更多这类成员整合到“自我元编程器”中。


    在实验环境之外经过许多周的自我分析（并得到他以前分析师的帮助）后，发现自我内部的这些生物也是其他实验中自我外部的那些生物。受试者将投影的、“仿佛在外部”的生物描述为认知性肉食动物，试图吃掉他的自我元程序并从他那里夺取控制权。随着受试者身上各个层级的元程序被理顺，他能够对实验期间呈现的各个层级进行分类并开始控制。随着他对比这些信念的显而无意识的需求通过分析性工作而减弱，他从一组基础信念移动到另一组信念的自由度增加了，与这种移动相关的焦虑也逐渐消失。


    最后产生了一个基础的整体元程序：为了他自己的智力满足，受试者发现他最好假设发生的所有现象只存在于自己的大脑和思想中。


    对于这个人来说，关于这些生物存在的其他假设已成为适合研究的主题，而不是盲目（无意识、意识的）信念的对象。


    ## 基础信念 5


    实验还针对自己在时空中的向前和向后移动进行。结果显示，当尝试向未来前进时，受试者开始意识到他对那个未来的目标，并对当前问题想象出符合愿望的解决方案。当他输入回到自己童年的元程序时，真实和幻想的记忆被唤起并整合。当他推向子宫状态时，他发现了一个早期的噩梦，该梦被重新唤起并解决。依靠他的科学知识，他将程序推回之前的世代、史前灵长类动物、肉食动物、鱼类和原生生物。在穿越这段对想象经验的追溯过程中，他经历了一次精卵结合爆炸。


    最后一组实验（参见“投影的使用”章节）由于前一组实验的结果而成为可能。控制投影元程序的进展源于其他宇宙的实验。最后，受试者理解并熟悉了对幻想中的其他宇宙的需求。分析性工作允许他绕过这种需求，渗透到认知多维投影空间。在这一最核心空间进行的编程实验显示，在很大程度上令人相信这种信念：该系列中的所有实验都显示了内在活动，而不需要外部案例的参与。发现持续使用外部原因的需求是一个向外投影的元程序，以避免对他自己思想中部分内容承担个人责任。他对自己某些类型的无意义程序的厌恶导致他将它们投影出去，从而避免承认它们的真实性。


    总之，实验的客观显性结果是理顺了该受试者计算机大量的“无意义物”。通过这些实验，他能够检查他一生中积聚的一些扭曲的信念和防御结构。最终结果是感到自我整合性增强，并对自己的现状产生了积极的情感，同时对自我内部对事件进行主观判断的其有效性的怀疑态度有所提高。


    通过与其他人的合作，已经开始对这些本质上是主观的判断进行一些客观测试。这种客观测试非常困难；该领域未来还需要大量的研究工作。我们需要更好的的调查技术，将主观技术与行为（言语）技术相结合。人们在经历这样的体验和实验后，主要的感受是自己计算机的流动性和塑性具有某些局限，而这些局限通过实验得到了某种程度的扩大。这种扩大持续多久以及达到何种程度，尚不清楚。对于探索这些领域的科学家来说，对自我元程序（及其感受到的变化）保持持续的批判性怀疑是非常必要的。


    ## 信念实验的元程序结果


    对这些实验及其结果的元理论考虑如下：关于这些实验的一个超元程序假设是关于数学和思维起源的形式主义观点。正如序言中所说，人类思维组织的一个极端是形式逻辑基础假设集。这些实验是在考虑这一观点的情况下进行的，并从这一观点进行了解释。


    显然，这种观点并不测试体验的“客观”有效性。它仅仅假设，如果将正确的信念接入计算机的元程序层级，计算机就会（从内存中的数百万元素中）构建符合这组特定规则的所有可能体验。运行相应的程序并做出相应的显示。


