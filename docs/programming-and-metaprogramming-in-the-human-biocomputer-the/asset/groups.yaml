    # Basic Belief No. 2


    The subject sought beings other than himself, not human, in whom he existed and
    who control him and other human beings. Thus the subject found whole new universes
    containing great varieties of beings, some greater than himself, some equal to
    himself, and some lesser than himself.


    Those greater than himself were a set which was so huge in space-time as to make
    the subject feel as a mere mote in their sunbeam, a single microflash of energy
    in their time scale, forty-five years are but an instant in their lifetime, a
    single thought in their vast computer, a mere particle in their assemblages of
    living cognitive units. He felt he in the absolute unconscious of these beings.
    He experienced many more sets all much greater than himself that they were almost
    inconceivable in their complexity, size and time scales.


    Those beings which were close to the subject in complexity-size-time were dichotomized
    into the evil ones and the good ones. The evil ones (subject said) were busy with
    purposes so foreign to his own that he had many near misses and almost fatal accidents
    in encounters with them; they were almost totally unaware of his existence and
    hence almost wiped him out, apparently without knowing it. The subject says that
    the good ones thought good thoughts to him, through him, and to one another. They
    were at least conceivably human and humane. He interpreted them as alien yet friendly.
    They were not so alien as to be completely removed from human beings in regard
    to their purposes and activities.'
