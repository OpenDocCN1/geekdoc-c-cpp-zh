    cannot be manipulated within the human biocomputer without danger to its existence.
    These metaprograms and programs can be considered as imperatives from some parts
    of the program level of the human biocomputer which must function as suprasa-metaprograms
    (i.e., there must be recognition of the “built-in,” “necessary for survival nature”
