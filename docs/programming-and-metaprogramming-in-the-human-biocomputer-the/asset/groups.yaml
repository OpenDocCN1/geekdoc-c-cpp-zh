    There can be special cases, less than the above ideal, but consonant with the
    principles enumerated. Some spouses or lovers (or both) have special understanding
    and interlocks which allow certain kinds of deep penetrations, elicitations and
    reprogrammings, but not other kinds. If one of the pair has been through LSD25
    self-analysis training, it is possible (in special cases) to help the other member
    through a session or sessions as a standby monitor and positive love-object in
    the external reality. However, there should be some form of professional psychoanalytic
    control over such sessions. Such controls can vary from being implicit and in
    the nature of tactical and strategic advisory sessions to being e.r. supervisory,
    depending on the ego-strength and on the current stage of development of each
    member of the pair. Expert and informed clinical judgment after thorough clinical
    study is the best (known) instrument for such decisions.


    ## 7 Behavioral, Non-Isolation Replay of Protohuman Programs:

    The Problem of Repetitive Unconscious Replay


    Certain kinds of programs in the human computer, usually below the ordinary levels
    of awareness, are circular. The circularity can be useful and needed, or misused
    (for example, in the maintenance of disparate and disturbing programs, L. Kubie
    1939). A program in a certain patient says, "Mother has abandoned baby, run to
    Daddy; Daddy beats me and leaves; Mommy comforts me and leaves; Daddy loves me
    and hurts me and leaves. Run to Mommy; Mommy has my sister, loves her, abandons
    me: run to Daddy; Daddy hurts. Daddy leaves. Run to Mommy. Mommy leaves... Mother
    has abandoned baby, etc." Again and again. When the patient was a baby this was
    the one important reality program; it became fixed, circular and carried into
    adulthood.


    Such a program operates slowly or rapidly, and continuously. In the adult the
    real situation in the e.r. (external reality) cannot halt the circular program.
    Usually modeling in the reality is preeminent over such circularity. In this circular
    case, the e.r. is used to facilitate playback and maintain the strength of this
    old model program. Any important man or woman in the e.r. must, somehow, be made
    to fit into this “ancient model” program. An external observer sees a person with
    such a program repeating an unhappy pattern again again over the years. The underlying
    perpetuated baby program is unavailable for inspection, replay and breaking of
    circularity by the owner as an adult.


    At high doses LSD25 reduces the relative strength of the e.r. program by enhancing
    the strength of other programs. (This occurs with 200 to 400 micrograms, and starts
    in the first hour and can continue for four or more hours). LSD25 can increase
