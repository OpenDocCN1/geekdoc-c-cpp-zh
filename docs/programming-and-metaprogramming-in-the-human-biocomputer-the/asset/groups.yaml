    acceptance of unknowables and of the unknown itself. A powerful wish to push into
    the unknown further than those ahead of one in calendar time is helpful in terms
    of one’s motivation at this point. Everyone has his say about the truth in this
    area. Many other persons would like very much to have one follow their metaprograms.
    In my own view I would prefer to be a de questing mind reporting on some interesting
    journeys. In so far as I fail to be this, I am guilty of attempting to metaprogram
    the reader.


    In summary then one starts on the deeper journeys, independently, metaprogrammed
    properly, and relatively safe but without evasions. After having been through
    some of the innermost depths of self, a result is that they are only one’s own
    beliefs and their multitudes of randomized logical consequences deep down inside
    one’s self. There is nothing else but stored experience.'
