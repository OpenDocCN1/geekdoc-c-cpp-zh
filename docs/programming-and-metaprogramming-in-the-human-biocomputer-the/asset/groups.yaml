    - I. 3.1 记录等于 2.1 记录？

    - II. 3.0 期间的主观生活等于 2.0 间隔？（见下文 IX。）

    - III. 3.0 期间是否存在 2.0 的记忆？

    - IV. 3.0 和 2.0 是否被认为是两个时间段和事件序列？

    - V. 3.0 期间的心理物理测试是否与 2.0 期间（使用相同过程）的测试具有理想的结果？（在磁带上编程的带有阶阶失真的单词测试）

    - VI. 除了 1b，还需要存储其他东西吗？例如a) 每个细胞的膜电位？(b) 树树的变化？(c) 血清素、甲肾上腺素等的局部浓度？(d) 半小时期之前的发放历史多久？(e)
    关键物质的血液水平？(f) 胶质细胞活动和物质浓度？

    - VII. 除了 1b，还需要控制其他东西吗？（见 VI 因素列表。）

    - VIII. 1a 和 1b 是否足以规定和控制，还是说分子信号存储引入了独立于神经元发放的控制措施？

