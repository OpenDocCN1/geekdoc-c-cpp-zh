  md: 'a larger universe filled with such surfaces and intersections spaces between.
    One also discovers that the light sources are within certain of these sheets shining
    through to others and that the hue and intensity are varying according to some
    local rules.


    One moves away from the model and sees that it is filling a universe; one moves
