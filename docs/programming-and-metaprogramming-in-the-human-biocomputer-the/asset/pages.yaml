    are not made.'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'The above all-too-condensed summary of these experiments and their results
    illustrates the linguistic symbolization of mathematical operations; this operation
    offers a certain kind of shorthand to the human computer. Linguistic symbols can
    be used for storing symbols which represent whole areas of operations in the computer.
    The key is no key is a version of the actual operations which it symbolizes. The
    statement is in the language of the child as the young computer originally stored.
    The actual operations taking place in the adult symbolized by the key is no key
    are a complex rendering of more advanced ideas, some of which are circuit like,
    some of which are topological transformations and some of which are in multidimensional
    matrices.


    A given human computer is limited in its operations by its own acquired mathematical
    conceptual machinery; this is part of its supraself-metaprograms. Maximum control
    over the metaprogrammatic level by the selfmetprogram is achieved not by direct
    “one to one” orders and instructions from the one level to the other. The control
    is based upon exploration of n-dimensional spaces and finding key points for transformations,
    first in decisive small local regions which can result in large-scale transformations.
    (This modeling reminds one of Ashby’s Design for a Brain, 1954, in which a large
    “homeostat” stimulated in one small region makes large adjustments throughout
    itself in order to compensate for the small change.)


    One key in the mind is to hunt for those discontinuities in the structure of the
    thinking which reveal a critical turnover point at which one can exert emotional
    energy so as to cause a transformation in all of that region.'
