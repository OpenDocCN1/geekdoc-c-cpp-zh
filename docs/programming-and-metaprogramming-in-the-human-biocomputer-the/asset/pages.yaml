  md: '# Afterword by Rick Doblin


    In early 1972, at the age of 18, a few years after the backlash against LSD had
    ended psychedelic research throughout the world, I read John Lilly''s Programming
    and Metaprogramming in the Human Biocomputer and also a manuscript copy of Grof''s
    Realms of the Human Unconscious. I was a college freshman at New College in Sarasota,
    Florida, and these were the two key books, both about LSD research, that changed
    my life.


    I appreciated their grounding in science, their explorations of the depths of
    the mind with the incredible tool of LSD, their intellectual courage, and their
    openness to rigorous evaluation of mysticism and spirituality. They helped inspire
    me to become a psychedelic researcher and therapist, to try to bring these psychedelic
    tools of insight, spirituality and healing back up from the underground where
    they had been criminalized and banished.


    Both of these books were challenging for me to understand and sometimes required
    hours on a single page, pondering the ideas expressed. Some of John''s ideas were
    profoundly liberating, especially his statement, "In the province of the mind,
    what is believed to be true or becomes true, within limits to be found experially
    and experimentally. These limits are further beliefs to be transcended. In the
    province of the mind, there are no'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'limits.” I purchased a tape with that saying repeated over and over and listened
    to it at length.


    In 1984, I met John Lilly for the first time as a result of his effort to find
    a location for his two dolphins, Joe and Rosie, who wanted to release into the
    wild. John and his research director, Roberta Quist, came to Sarasota on my invitation.
    They found a community of support among my friends. More Marine Research Lab was
    willing to work with the Human/Dolphin Foundation towards the naturalization of
    the dolphins into Sarasota Bay. Rosie’s pregnancy stalled the effort to move the
    dolphins, resulting in postponement of the project.


    Now at age 60, in early 2014, having devoted my life to psychedelic research and
    still on the way to becoming a legal psychedelic therapist, I look back and feel
    fortunate to come across the work of this paradigm shifting minds at such a formative
    time in my life, and later to have met with and learned from both John Lilly and
    Stan Grof.


    Programming and Metaprogramming in the Human Biocomputer is an intellectual tour
    de force, a triumph of the rational mind in bringing order and sense to the flow
    of inner awareness emerging from the unconscious. The purpose of Programming and
    Metaprogramming in the Human Biocomputer is understanding. Realms of the Human
    Unconscious is also an intellectual tour de force, but whose purpose was psychotherapy
    and healing.


    Programming and Metaprogramming in the Human Biocomputer remains a pioneering
    classic that helps us all to realize how much of what we consider reality is filtered
    through'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'our own perceptual filters that we are obligated to rigorously evaluate. Programming
    and Metaprogramming in the Human Biocomputer, viewed in combination with John’s
    life trajectory, is a meta-lesson that intellectual brilliance isn’t enough in
    and of itself, that head needs to be balanced by heart, that understanding needs
    to be balanced by healing. It’s a great gift that this profound and courageous
    book is being republished.


    Rick Doblin, Ph.D.


    February 18, 2014'
