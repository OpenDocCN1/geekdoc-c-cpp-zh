    became straightened out in the subject, he'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'was able to categorize and begin to control the various levels as they were
    presented during these experiments. As his apparently unconscious needs for credence
    in these beliefs were attenuated by analytic work, his freedom to move from one
    set of basic beliefs to another was increased and the anxiety associated with
