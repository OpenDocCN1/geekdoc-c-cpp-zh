  md: '# Personal Metaprogrammatic Language An Example of Its Properties


    Among all of the languages possessed by one''s self some are used to control the
    metaprogrammatic level in Fig. 1. The self-metaprogrammer exerts control through
    the personal metaprogrammatic language. This is the language which controls the
    computer itself, how it operates, and how it computes as an integral whole. Each
    human computer has a unique private control language in its unique stored programs,
    stored metaprograms, and stored self-metaprograms. This language is is not all
    shared in the usual public domain of the language acquired in childhood.


    In this particular instance one can visualize in Fig. 1 certain levels in and
    at which the experiments were done in detail. This control language and control
    of the biocomputer itself can be changed as new understanding of control allows
    new control. This language has aspects which are nonverbal, nonvocal and can be
    more emotional and/or mathematical than they are linguistic. Here we are expressing
    some "linguistic" aspects and some of the "mathematical" nonverbal experiences.
    We are limited in this public expression to the consensus non-private language.


    The experiments were designed along the lines of finding solutions to certain
    personal problems within the biocomputer.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'These problems are the basic ones of the presence of antithetical and contradictory
    metaprograms. In Fig. 1 some of these paradoxical and agnostic problems appear
    at the supraself-metaprogram level and some at the metaprogram level. One such
    experiment was on a spontaneous occurrence of a phrase (during the LSD25 state)
    which took on elements of humor and the aspect as if a great discovery. The private
    metaprogrammatic control instruction is the key is no key.


    In the external reality, stimulus for this statement was a number of keys which
    the subject had been carrying around for several years. He suddenly became aware
    that he had in his life many locks. Thus it was necessary for him to carry many
    keys. At times these keys were felt as a physical and a mental burden which slowed
    the efficient operation of his life. These were aspects of the phrase key which
    were real keys, real locks on real doors to real rooms, real houses, real offices,
    etc. At particular moment this seemed to be the epitome of modern civilization:
    to have doors, to have locks on those doors, and have privileged persons who possessed
    the keys to open those doors.


    The subject next moved from the meanings of the external reality metaprogram to
    another level in which he internalized this picture of the door, the room, the
    lock, the key. He visualized his own antithetical metaprograms as existing in
    rooms separated by doors which had locks on them. He was searching for the keys
    to open the doors.


    As these inner rooms (categories, problems, antitheses) became embodied in the
    locked door imagined-projected metaphor the subject began to walk through metaprogrammatic
    storage looking for a key to open the next door into the further recesses of the'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'rooms. As he moved he began to see that the doors were defined doors by his
    own computer; locks were defined as locks; and that keys were defined as necessary
    to open the locks.


    In a moment of insight, he saw that the defined boundaries (the doors, the walls,
    ceilings, the floors, and the locks themselves and their keys) were a convenient
    metaprogram dividing up his knowledge and his control mechanisms into compartments
    in an artificial personal fashion.


    He explored many rooms with many different kinds of knowledge in the rooms. The
    walls slowly began to dissolve, some of them melted and flowed away; other rooms
    were revealed as solid and the doors with secure locks rather numerous; some keys
    were missing.


    Most of the hypothesized building inside his own mind, however, became open spaces
    with information freely available without the former walls between arbitrary rooms
    of categories. Those rooms, locks, and keys that were left were quite basic to
    the development of this individual’s selfmetaprogram.


    Some of these rooms were created in childhood in response to situations over which
    the selfmetrogrammer had no control. These rooms housed ideas and systems of thinking
    which to this particular subject evoked intense fear or intense anger as he approached
    with the intent of opening the doors. The locks did not respond to frontal assaults.
    These rooms turned out to be very difficult to define out of existence in order
    to have their contents interact with the rest of the metaprogrammatic level.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'The subject underwent a frantic and frightened search for the keys to the locks
    of these strongrooms. He became alternately fearful and angry. He made several
    assaults on walls, doors, ceilings and floors of these closed rooms without much
    success.


    He went away from these rooms into other universes and other spaces and left the
    computer to work out solutions below his levels of awareness.


    Later with higher motivational energy the subject returned to the problem of the
    lock, the doors and the rooms somewhat refreshed by the experiences in the other
    realms.


    Mathematical transformations were next tried in the approach to the locked rooms.
    The concept of the key fitting into the lock and the necessity of finding the
    key were abandoned and the rooms were approached as topological puzzles. In the
    multi-dimensional cognizant and visual space the rooms were now manipulated without
    the necessity of the key in the lock.


    Using the transitional concept that the lock is a hole in the door through which
    one can exert an effort for a topological transformation, one could turn the room
    into another topological form other than a closed box. The room in effect was
    turned inside out through the hole, through the lock leaving the contents outside
    and the room now a collapsed balloon placed farther from the selfmetaprogrammer.
    Room after room was thus defined as turned inside out with the contents spewed
    forth for use by the selfmetaprogrammer. Once this control key worked, it continued
    automatically to its own limits.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'With this sort of “intellectual crutch,” as it were, entire new areas of basic
    beliefs were entered upon. Most of the rooms which before had appeared as strong
    rooms with big powerful walls, doors, and locks now ended up as empty balloons.
    The greatly defended contents of the rooms in many cases turned out to be relatively
    trivial programs and episodes from childhood which had been overgeneralized and
    overvalued by this particular human computer. The devaluation of the general purpose
    properties of the human bicomputer was one such room. In childhood the many episodes
    which led to the selfmetaprogrammer not remaining general purpose but becoming
    more and more limited and specialized were entered upon. Several layers of the
    supraself-metaprograms laid down in childhood were opened up.


    The mathematical operation which took place in the computer was the movement of
    energies and masses of data from the supraself-metaprogram down to the selfmetaprogrammatic
    level and below. At the same time there was the knowledge that programmatic materials
    had been moved from the supra-self-position to the under-self-controlled position
    at the programmatic level. These operations were all filed in metaprogram storage
    under the title “The key is no key.” It was noticed that the necessity for locks
    and for keys in the real world had to be dealt with. There was an interval of
    time in which the subject was quite willing to throw all of his keys away and
    keep all of the real doors of his life unlocked. That was tried briefly and resulted
    in a theft. This immediately brought home the obvious fact that the external reality
    programs cannot be controlled by the selfmetaprogrammer. There are other human
    bicomputers and a real external reality which has unpredictable properties not
    under the control of the selfmetaprogrammer. Therefore there must remain in the
    supraself-metaprogram certain rules for conduct of


    62'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'the human computer applied in the external reality. There must remain a certain
    modicum of real supraself control and respect for the external reality''s part
    of the supraself-metaprogram.


    As it was stated elsewhere (Lilly, 1956, Lilly and Shurley, 1960): the province
    of the mind is the only area of science in which what one believes to be true
    either or becomes true within limits to be determined experimentally. This particular
    subject saw that the key is no key is a private selfmetaprogramming language phrase
    and should not be applied to the external reality metaprogram nor should it be
    applied to other human biocomputers (at least without careful consideration of
    their capabilities and their own supraself-metaprograms). As it were similar topological
    transformations under control of the self-metaprogrammer may not yet have developed
    within the given other person. The kinds of phenomena expressed by this unique
    private human computer (The key is no key) may be totally inapplicable to others.


    Metatheoretically considered, however, the above operation can be re-expressed
    by a given individual and elaborated and differentiated along other coordinates.
    For those willing to try these experiments I wish to add a suggestion: It is necessary
    to explore all aspects of one''s body image, one''s childish emotional regions,
    one''s real body in various states and with special stimuli in addition to those
    from the body itself. With such explorative training one can do topological transformations
    which can result in changes in metaprogramming and in metaprograms themselves.
    Bias, prejudice, preconception and intransigence in explicit areas are seen as
    supraself-metaprograms which are inappropriate. Until there can be highly motivated
