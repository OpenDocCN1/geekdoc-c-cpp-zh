  md: '# Summary


    Some general ideas from extrapolation and reworking of modern general purpose
    computer theory are used to explain and to control some of the subjective aspects
    of the operations of the human brain. An addition (for the peculiarly human brain)
    to the theory of the general-purpose computers is the concept of the self-metaprogram
    or the internal programmer present in the $10^{10}$ neurons assembly known as
    the human brain. The self-metaprograms operate between the huge storage and the
    huge external reality. Selfprogramming properties (in addition to stored program
    properties) are essential to understanding mental operations and resulting external
    general purpose behaviors such as speech and language. Stored programs and metaprograms
    are characteristic of the human.


    The self-organizing aspects of computer programming and programs are now conceptually
