  merge: -1
  pgno: 86
- img_proc: true
  md: 'The last set of experiments (see Use of Projection section) was made possible
    by the results of the previous set. Progress in controlling the projection metaprogram
    resulted from the other universes experiments. Finally the subject understood
    and had become familiar with his need for fantasied other universes. Analytic
    work allowed him to bypass this need and penetrate the cognitive multidimensional
    projection spaces. Experiments in programming in this innermost space showed quite
    satisfying to a high degree of credence in the belief that all experiments in
    the series showed inner happenings without needing the participation of outer
    cases. The need for the constant use of outer causes was found to be a projected
    outward metaprogram to avoid taking personal responsibility for portions of the
    contents of his own mind. His dislike for certain kinds of his own nonsensical
    programs caused him to project them and thus avoid admitting they were.


    In summation, the objectively apparent results of the experiments were to straighten
    out a good deal of the “nonsense” in this subject’s computer. Through these experiments
    he was able to examine some warped off beliefs and defensive structures accumulated
    throughout his life. The net result was a feeling of greater integration of self
    and a feeling of positive affect for the current structure of himself, combined
    with an improved skepticism of the validity of subjective judging of events in
    self.


    Some objective testing of these essentially subjective judgments have been initiated
    through cooperation with other persons. Such objective testing is very difficult;
    this area needs a great deal of future research work. We need better investigative
    techniques, combining subjective and behavioral (verbal) techniques. The major
    feeling that one has after such experiences and experiments is that the'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'fluidity and plasticity of one''s computer has certain limits to it, and that
    those limits have been enlarged somewhat by the experiments. How long such enlargement
    lasts and to what extent are still not known of course. A certain amount of continued
    critical skepticism about and in the selfmetaprogram (and in its felt changes)
    is very necessary for a scientist exploring these areas.


    # METAPROGRAMMATIC RESULTS OF BELIEF EXPERIMENTS


    The metatheoretical consideration of these experiments and the results are as
    follows: One suprametaprogrammatic assumption about these experiments is the formalistic
    view of the origins of mathematics and of thinking. As was said in the preface,
    at one extreme of the organization of human thinking is the formal logical basic
    assumption set of metatheories. These experiments were done with this view in
    mind and the results were interpreted from this point of view.


    Obviously this point of view does not test the “objective” validity of the experiences.
    It merely assumes that, if one plugs the proper beliefs into the metaprogrammatic
    levels of the computer that the computer will then construct (from the myriads
    of elements in memory) those possible experiences that fit this particular set
    of rules. Those programs be run off and those displays made, which are appropriate
    to the basic assumptions and their stored programming.


    Another way of looking at the results and at the metaprogramming is that we start
    out with a basic set of beliefs,'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'believe them to be “objectively” valid (not just “formally” valid) and do the
    experiments and interpret them with this point of view. If one proceeds along
    these lines, one can quickly reach the end of one’s ability to interpret the results.
    One finds that one cannot grasp conceptually the phenomena ensue. With this metatheory,
    this type of experience is not just the computer operating in isolation, confinement
    and solitude on preprogrammed material being elicited from memory, but is really
    in communication with other beings, and the influence on one’s self by them is
    real.


    Thus in this case one is assuming the existence theorem in regard to the basic
    assumptions, i.e., there is objective validity to them quite outside of self and
    one’s making the assumptions. This epistemological position can also be investigated
    by these methods. This is somewhat the position that was taken by Aldous Huxley
    and by various other groups. For example, pursuit of certain non-Western philosophies
    as the Ultimate Truth was generated by these persons.


    One cannot take sides on these two widely epistemological bases. On the one hand
    we have the basic assumptions of the modern scientists and on the other hand the
    basic assumptions of those interested in the religious aspect of existence. If
    one is to remain philosophic and objective in this field, one must dispassionately
    survey both of these extreme metatheoretical positions.


    One basic lesson learned from these experiments is that, in general, one’s preferences
    for various kinds of metatheoretical positions are dictated by considerations
    other than one’s ideals of impartiality, objectivity, and a dispassionate view.
    The metatheoretical position held by scientists in general is espoused for purposes
    of


    54'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'defining the truth, for purposes of understanding in their particular compartment
    of science, for acceptance among other scientists and for each one''s own internal
    security operations with respect to his own unconscious programs. It is to be
    expected that anxiety is engender in some scientists by making the above assumptions
    as if true (even temporarily) in an experimental framework. One can easily be
    panicked by the invasion of the selfmetaprograms by automatic existence programs
    from below the level of one''s awareness, programs which may strike at the existence
    of self, at the control of self, at the origins of self, at the destinations of
    self, and of the relations of self to a known external reality.


    Possibly one of the safest positions to take with regard to all of these phenomena
    is that given in this paper, i.e., the formalistic view in which one makes the
    assumption that the computer itself generates all of the phenomena experienced.
    This is an acceptable assumption of modern science. This is the so-called common
    sense assumption. This is the assumption acceptable to one''s colleagues in science.


    Such considerations, of course, do not touch upon nor prove the validity or invalidity
    of the assumptions nor of the results of the experiments. In order to leave this
    theory open-ended and to allow for the presence of the unknown, it is necessary
    to take the ontological and epistemological position that one cannot know as a
    result of this kind of solitudinous experiment whether or not the phenomena are
    explicable only by non-biocomputer interventions or by happenings within the computer
    itself, or both.


    I wish to emphasize that there is a necessity not to espouse a truth because it
    is safe. Being driven to a set of assumptions'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'because one is afraid of another set and their consequences are the most passionate
    and nonobjective kind of philosophy. Too many intellectuals and scientists (almost
    unconsciously) use basic assumptions as defenses against their fears of other
    assumptions and their consequences. Until we can train ourselves to be disionate
    and accept both the assumptions and the results of making them without arrogance,
    without pride; without misplaced enthusiasm, without fear, without panic, without
    anger, hence without emotional involvement in the results or in the theories,
