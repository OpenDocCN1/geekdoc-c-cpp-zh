  md: '# 4 Metaprogramming in the Presence of a Fixed Neurological Program (Migraine):
    Example of Perception and Belief Interactions


    Specific example is given some experiments were done on reprogramming a specific
    biocomputer (migraine case) in the LSD25 state.


    Under certain special circumstances it has been found possible to program certain
    trends in perception and project them into the visual space for study. Among such
    processes are the apparent presence of other persons. One''s belief in the reality
    of these presences is not at stake here. Unless one purposely intensifies the
    belief in the reality of these presences, one can detect that they are not existing
    in the external reality. The safe metaprogram to use is that they exist only in
    the mind even though they appear to exist outside the body.


    One may ask the question do these programs exist continuously below the threshold
    of consciousness in the usual mental state,'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'or are they created de novo in or by the LSD25 state? Current psychoanalytic
    and psychiatric theories state that they exist in the "unconscious" below the
    levels of awareness and are evoked from that region of the computer by the LSD25
    state. All we can say here is that this looks like the more likely of the two
    alternatives; however, the other one should be kept in mind. Some of these below-threshold-programs
    once detected with the LSD25 state can (in solitude without LSD25) be just detected
    near threshold in a highly motivated state. Without LSD25 one can achieve the
    necessary excitation of these programs to force them above threshold.


    In one particular subject migraine was used as an advantageous tracer and a spur
    to the selfanalysis. In this case there were asymmetries of the spatial perception
    fields. The right side of the visual field was very different from the left side.
    (What was seen from the right eye was different from that with the left eye.)
    These differences reside in color, in the persistence of afterimages, in the occurrences
    of scotoma during a migraine attack, et. (As is well known in the clinical literature
    such conditions can exist easily forty years or more.) Among these asymmetries
    there are spatial distortions of the visual system. In this particular case the
    right eye is more sensitive, has a lower threshold for photophobia and pain in
    general. The sensations and skin perceptions on the right side of the head are
    less pleasant and stronger than those on the left. The migraine attack is confined
    to the right side of the head.


    At times correct programming can be achieved in the LSD25 state so that these
    cephalic differences can be enhanced, studied, and projected. Recall and living
