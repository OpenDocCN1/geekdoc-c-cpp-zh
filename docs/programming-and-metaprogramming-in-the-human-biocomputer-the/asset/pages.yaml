  md: '# Use of Projection Display Techniques in Deep Self Analysis with Lysergic
    Acid Diethylamine (LSD25)


    The use of the psychedelic agents (such as LSD25) in the human subject shows certain
    properties of these substances in changing the computer''s operations in certain
    ways. Some of these changes are mentioned above above in passing; a summary of
    those found in the LSD state empirically are as follows:


    The selfmetaprogram can make instructions to create special states of the computer;
    many of these special states have been described in the literature in hypnosis.


    These instructions are carried out with relatively short delays (minutes). The
    delays of course will vary with the complexity of the task which is being programmed
    into the computer. It also a previous history of this same kind of programming:
    the more often it has been done the easier it is to do again and the less time
    it takes.


    Only taboo or forbidden programs are not fully constructed: there are peculiar
    gaps which give away the fact that there are forbidden areas. Within realizable
    limits most other programs can be produced.


    When one first does enter into the storage systems the way the material is held
    in the dynamic storage is entirely strange to one''s conscious self.


    Production of displays of data patterns, of instructions, or storage contents,
    or of current problems can be realized through'
