  md: 'John Lilly is a gifted explorer, and the territory he is working contains the
    enormous riches of a greater understanding of ourselves and our relationship to
    the natural universe.


    > The New York Times


    John Lilly’s Programming and Metaprogramming in The Human Biocomputer is one of
    the three most important ideas of the 20th Century.


    > Timothy Leary


    John Lilly is a rare combination of scientist and mystic who helps the rest of
    us break out of the petty orthodoxies that obscure the riches of life from womb
    to tomb.


    > Psychology Today


    John Lilly has been one of the most original and fascinating scientists of our
    time.


    > The Washington Post


