    # DEFINITION OF A GENERAL PURPOSE SELF-METAPROGRAM


    The essential features and the goals sought in the selfanalysis are in the metaprogram:
    make the computer general purpose. In this sense we mean that in the general purpose
    nature of the computer there can be no display, no acting, nor an ideal is forbidden
    to a consciously willed metaprogram. Nor is any display, acting or ideal made
    without being consciously metaprogrammed. In each case of one is up against the
    limits of the unique computer which is one’s own. There are certain kinds of metaprograms,
    displays, acting, or ideals which are beyond the capacity of a particular computer.
    However, one’s imagined limits are sometimes smaller than those one can achieve
    with special work. The metaprogram of the specific beliefs about the limits of
    one’s self are at stake here. One’s ability to achieve certain special states
    of consciousness, for example, are generally preprogrammed by basic beliefs taken
    on in childhood. If the computer is to maintain its general purpose nature (which
    presumably was there in childhood), one must recapture a far range of phenomena
