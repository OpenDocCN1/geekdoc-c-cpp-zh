    # Basic Belief No. 4


    One set of basic beliefs can be subsumed under the directions seek those beings
    whom we control and who exist in us. With this program the subject found old models
    in himself (old programs, old metaprograms, implanted by others, implanted by
    self, injected by parents, by teachers, etc.). He found that these were disparate
