    the intersections collisions occur (electrons, mesons, protons, neutrons, neutrinos,
    etc. are moving from one sheet to the other in both directions). Sheets that are
    immediately adjacent are seen to be doing local computations at very high speed.
    The intersections are now seen as micro-molecular-atomic switch lines, switch
    surfaces, and switch points.


    Thus one finds that the phrase, "The key is no key" has grown into a new conception
    of a computer. This computer within itself ideally recognizes no locks, no forbidden
    transitions, no areas in which data cannot be freely moved from one zone to another.
    At the boundaries of the computer, however, there are still, as it were categorical
