  md: '# 10 Coalitions Interlock and Responsibility


    Von Foerster (“BioLogic,” in Biological Prototypes and Synthetic Systems, Plenum
    Press, 1962) calls attention to the increasing survival times of increasingly
    large aggregates of connected matter which he defines as coalitions. Living systems
    are coalitions par excellence. A protozoan is a coalition of atoms and molecules
    forming membranes and submicro and micro structures which reproduce by collecting
    the same kinds of atoms and molecules to form new identical individuals. A sponge
    is a primitive coalition of protozoa with enhanced survival over any one protozoan.
    A man is a tightly organized coalition of cells, including some mobile protozoa
    (lymphocytes, macrophages, oligodendglia, etc.). Von Foerster says that mammalian
    cells of Homosapiens may be the most numerous cells on earth, i.e., these cells
    with their multiple level coalitions have the longest current survival time.


    The nature of matter–matter coalitions and cell–cell coalitions and organism–organism
    coalitions are explored by Von Foerster. For a coalition to exist between any
    two entities, the dyad is connected by a bond or bonds which reduce the sum of
    the negentropy of each of the two entities separated (without a linkage). In this
    view the two entities when in coalition reduce'
