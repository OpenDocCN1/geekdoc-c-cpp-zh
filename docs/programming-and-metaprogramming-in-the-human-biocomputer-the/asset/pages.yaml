    He settled disparate and non-integrated points between these beings and gradually
    incorporated more of them into the selfmetaprogrammer.


    After many weeks of selfanalysis outside the experimental milieu (and some help
    with his former analyst), it was seen that these beings within the self were also
    those other beings outside self of the other experiments. The subject described
    the projected as-if outside beings to be cognitive carnivores attempting to eat
