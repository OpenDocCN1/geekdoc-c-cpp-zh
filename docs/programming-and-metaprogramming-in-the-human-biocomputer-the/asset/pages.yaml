  md: '# Summary of Experiments in SelfMetaprogramming with LSD25


    In order to test the validity of the human computer, a series of experiments implicit
    in the theory of the were designed and carried out in the LSD25 state, in physical
    isolation, and solitude. One point of primary interest during these experiments
    was to find out what level of intensity of belief in a set of assumptions could
    be achieved. The assumptions tested in this set of experiments are not those of
    current science: they are not in the conscious working repertory of this scientist;
    nor were they consciously acceptable to him.


    In this short account it is not intended to give all of the details of either
    the self-metaprogramming language that was used or the details of the elicited
    phenomena. The account is purposely sparse, condensed, and compressed.


    Abstracted from the complexity of the totality of the experiments and their results
    are only those formal descriptions which may serve as guide posts to others attempting
    to reproduce these or similar experiments. It is not intended to complicate this
    account with the personal aspects of the metaprogramming, the elicited phenomena
    or difficulties encountered. For those researchers'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'who are interested in this works reproduction in themselves, these assumptions
    (or similar ones) and these results can be translated into their own metaprogramming
    language and such workers can obtain their unique results.


    To claim validity of details beyond myself is not my aim. There probably are those
    men who are prepared well enough to attempt reproducing what has been done here
    in themselves. The descriptions are given so that the sources of the human computer
    theory are available to professionals.


    This particular set of existence theorems is selected for experiment for a number
    of reasons. There are a number of persons (Blum, 1964) who experimented with the
    LSD25 state write as if they believe implicitly in the objective reality of causes
    outside themselves for certain kinds of experiences undergone with these particular
    beliefs.


    I do not think it wise to espouse either the existence or the nonexistence theorem
    for this set of basic supraself-metaprograms (Fig. 1). To become impartial, dispassionate,
    and general purpose, objective, and open-ended, one must test and adjust the level
    of credence in each of his sets of beliefs. If ever Man is to be faced with real
    organisms with greater wisdom intellect, greater minds than any single man has,
    then we must be open, unbiased, sensitive, general purpose, and dispassionate.
    Our needs for phantasies must have been analyzed and see for what they are and
    are not or we will be in even graver troubles than we are today.


    Our search for mentally healthy paths to human progress in the innermost realities
    depends upon progress in this area. Many'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'men have floundered in this area of belief. I hope this work can help to find
    a way through one of our stickiest intellectual-emotional regions.


    Most of these beliefs are ones which have been abandoned in the fields of endeavor
    called science. Such beliefs continue to be found in the field known as religion:
    Some of these beliefs are labeled in modern psychiatric medicine and anthropology
    as superstitions, psychotic beliefs, etc. Other persons present these beliefs
    in the writings called science fiction.


    This set of basic postulates (or beliefs) is conceived and used to program several
    sessions with LSD25 plus physical isolation in solitude. Above all these metaprograms
    to be experimented upon is one metaprogram of value to this subject: his overall
    policy is the intent to explore, to observe, to analyze. Hence there is an important
    additional basic metaprogram: analyze self to understand one’s thinking and true
    motives more thoroughly. This is the conscious motivational strategy. At times
    this metaprogram dominates the scene, at times others do. The resolve exists,
    however, to generate a net effect with this instruction uppermost in the computer
    hierarchy.


    # EXPERIMENTS ON BASICnMETAPROGRAMS OF EXISTENCE


    Preliminary to the experiments in changing basic beliefs, many experiments with
    the profound physical isolation and solitude situation were carried out over a
    period of several years. These experiences were followed by combining the LSD25
    state'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'and the physical isolation state in a second period of several years. The minimum
    time time between experiments was thirty days, the maximum time several months.
    [Tables 1, 7 and 8]


    # Basic Belief No. 1


    Basic Belief No. 1 was made possible by the early isolation results: Assume that
    the subject''s body and brain can operate comfortably isolated without him paying
    any attention to it. This belief expresses the faith that one has in one''s experience
    in the isolation situation, that one can consciously ignore the necessities of
    breathing and other body functions, and that they will take care of themselves
    automatically without detailed attention on the part of one''s self. This result
    allowed existence metaprograms to be made in relative safety.


    Successful leaving of the body and parking it in isolation for periods of twenty
    minutes to two hours were successful in sixteen experiments. This success, in
    turn, allowed other basic beliefs to be experimented upon. The basic belief that
    one could leave the body and explore new universes was successfully programmed
    in the first eight different experiments lasting from five minutes to forty minutes;
    the later eight experiments were on the cognitional multidimensional space without
    the leaving the body metaprogram (see previous section on Projection for the cognition
    space phenomenon).'
