    # Basic Belief No. 5


    Experiments also were done upon movements of self forward and back in space-time.
    The results showed that when attempting to go forward into the future subject
    began to realize his own goals for that future, and imagine wishful thinking solutions
    to current problems. When he put in the metaprogram for going back into his own
    childhood, real and phantasy memories were evoked and integrated. When he pushed
