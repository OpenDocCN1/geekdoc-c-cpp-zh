    \ int signum )\n{\n    cout << \"Interrupt signal (\" << signum << \") received.\\\
    n\";\n\n    // cleanup and close up stuff here\n    // terminate program\n\n \
    \   exit(signum);\n}\n\nint main ()\n{\n    // register signal SIGINT and signal\
    \ handler\n    signal(SIGINT, signalHandler);\n\n    while(1){\n        cout <<\
