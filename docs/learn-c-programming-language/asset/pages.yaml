    \ by reference as a pointer cast of type void. NULL may be used if no argument\
    \ is to be passed. |\n|---|---|\n\nThe maximum number of threads that may be created\
    \ by a process is implementation dependent. Once created, threads are peers, and\
    \ may create other threads. There is no implied hierarchy or dependency between\
    \ threads.\n\n# Terminating Threads\n\nThere is following routine which we use\
    \ to terminate a POSIX thread:\n\n```\n```cpp\n#include <pthread.h>\n\npthread_exit\
    \ (status)\n```\n```\n\nHere **pthread_exit** is used to explicitly exit a thread.\
    \ Typically, the pthread_exit() routine is called after a thread has completed\
    \ its work and is no longer required to exist.\n\nIf main() finishes before the\
    \ threads it has created, and exits with pthread_exit(), the other threads will\
    \ continue to execute. Otherwise, they will be automatically terminated when main()\
    \ finishes.\n\n# Example:\n\nThis simple example code creates 5 threads with the\
    \ pthread_create() routine. Each thread prints a \"Hello World!\" message, and\
