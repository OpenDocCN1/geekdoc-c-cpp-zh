    \ operator * to implement \"smart pointers.\" These pointers are objects that\
    \ behave like normal pointers except they perform other tasks when you access\
    \ an object through them, such as automatic object deletion either when the pointer\
    \ is destroyed, or the pointer is used to point to another object.\n\nThe dereferencing\
