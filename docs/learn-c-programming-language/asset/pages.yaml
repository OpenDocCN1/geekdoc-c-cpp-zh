  md: "# 20. DATE AND TIME\n\nThe C++ standard library does not provide a proper date\
    \ type. C++ inherits the structs and functions for date and time manipulation\
    \ from C. To access date and time related functions and structures, you would\
    \ need to include `<ctime>` header file in your C++ program.\n\nThere are four\
    \ time-related types: **clock_t, time_t, size_t, and tm**. The types - clock_t,\
    \ size_t and time_t are capable of representing the system time and date as some\
    \ sort of integer.\n\nThe structure type **tm** holds the date and time in the\
    \ form of a C structure having the following elements:\n\n```\nstruct tm {\n \
    \ int tm_sec;   // seconds of minutes from 0 to 61\n  int tm_min;   // minutes\
    \ of hour from 0 to 59\n  int tm_hour;  // hours of day from 0 to 24\n  int tm_mday;\
    \  // day of month from 1 to 31\n  int tm_mon;   // month of year from 0 to 11\n\
    \  int tm_year;  // year since 1900\n  int tm_wday;  // days since sunday\n  int\
    \ tm_yday;  // days since January 1st\n  int tm_isdst; // hours of daylight savings\
    \ time\n}\n```\n\nFollowing are the important functions, which we use while working\
    \ with date and time in C or C++. All these functions are part of standard C and\
    \ C++ library and you can check their detail using reference to C++ standard library\
    \ given below.\n\n| SN | Function & Purpose |\n|---|---|\n| 1 | **time_t time(time_t\
    \ *time);**<br>This returns the current calendar time of the system in number\
    \ of seconds elapsed since January 1, 1970. If the system has no time, .1 is returned.\
    \ |\n| 2 | **char *ctime(const time_t *time);**<br>This returns a pointer to a\
    \ string of the form *day month year* |"
