  md: "# # 10. STORAGE CLASSES\n\nA storage class defines the scope (visibility) and\
    \ life-time of variables and/or functions within a C++ Program. These specifiers\
    \ precede the type that they modify. There are following storage classes, which\
    \ can be used in a C++ Program\n\n+   - auto\n+   - register\n+   - static\n+\
    \   - extern\n+   - mutable\n\n# The auto Storage Class\n\nThe **auto** storage\
    \ class is the default storage class for all local variables.\n\n```\n```\n{\n\
    \    int mount;\n    auto int month;\n}\n```\n```\n\nThe example above defines\
    \ two variables with the same storage class, auto can only be used within functions,\
    \ i.e., local variables.\n\n# The register Storage Class\n\nThe **register** storage\
    \ class is used to define local variables that should be stored in a register\
    \ instead of RAM. This means that the variable has a maximum size equal to the\
    \ register size (usually one word) and can't have the unary & operator applied\
    \ to it (as it does not have a memory location).\n\n```\n```\n{\n    register\
    \ int miles;\n}\n```\n```\n\nThe register should only be used for variables that\
    \ require quick access such as counters. It should also be noted that defining\
    \ 'register' does not mean that the variable will be stored in a register. It\
    \ means that it MIGHT be stored in a register depending on hardware and implementation\
    \ restrictions.\n\n# The static Storage Class"
