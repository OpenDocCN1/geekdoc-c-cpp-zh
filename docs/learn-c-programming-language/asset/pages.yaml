- pgno: 87
  md: "```\n```cpp\nswitch(expression){\n    case constant-expression  :\n       \
    \ statement(s);\n        break; //optional\n    case constant-expression :\n \
    \       statement(s);\n        break; //optional\n\n    // you can have any number\
    \ of case statements.\n    default : //Optional\n        statement(s);\n}\n```\n\
    ```\n\nThe following rules apply to a switch statement:\n\n+   - The **expression**\
    \ used in a **switch** statement must have an integral or enumerated type, or\
    \ be of a class type in which the class has a single conversion function to an\
    \ integral or enumerated type.\n+   - You can have any number of case statements\
    \ within a switch. Each case is followed by the value to be compared to and a\
    \ colon.\n+   - The **constant-expression** for a case must be the same data type\
    \ as the variable in the switch, and it must be a constant or a literal.\n+  \
    \ - When the variable being switched on is equal to a case, the statements following\
    \ that case will execute until a **break** statement is reached.\n+   - When a\
    \ break statement is reached, the switch terminates, and the flow of control jumps\
    \ to the next line following the switch statement.\n+   - Not every case needs\
    \ to contain a break. If no break appears, the flow of control will *fall through*\
    \ to subsequent cases until a break is reached.\n+   - A **switch** statement\
    \ can have an optional **default** case, which must appear at the end of the switch.\
    \ The default case can be used for performing a task when none of the cases is\
    \ true. No break is needed in the default case.\n\n# Flow Diagram"
