  md: "The pthread_join() subroutine blocks the calling thread until the specified\
    \ ‘threadid’ thread terminates. When a thread is created, one of its attributes\
    \ defines whether it is joinable or detached. Only threads that are created as\
    \ joinable can be joined. If a thread is created as detached, it can never be\
    \ joined.\n\nThis example demonstrates how to wait for thread completions by using\
    \ the Pthread join routine.\n\n```\n```cpp\n#include <iostream>\n#include <cstdlib>\n\
    #include <pthread.h>\n#include <unistd.h>\n\nusing namespace std;\n\n#define NUM_THREADS\
    \     5\n\nvoid *wait(void *t)\n{\n    int i;\n    long tid;\n\n    tid = (long)t;\n\
    \n    sleep(1);\n    cout << \"Sleeping in thread \" << endl;\n    cout << \"\
    Thread with id : \" << tid << \" ...exiting \" << endl;\n    pthread_exit(NULL);\n\
    }\n\nint main ()\n{\n    int rc;\n    int i;\n    pthread_t threads[NUM_THREADS];\n\
    \    pthread_attr_t attr;\n    void *status;\n```\n```"
