  md: "# Global Variables\n\nGlobal variables are defined outside of all the functions,\
    \ usually on top of the program. The global variables will hold their value throughout\
    \ the life-time of your program.\n\nA global variable can be accessed by any function.\
    \ That is, a global variable is available for use throughout your entire program\
    \ after its declaration. Following is the example using global and local variables:\n\
    \n```\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\n// Global variable\
    \ declaration:\nint g;\n\n\nint main ()\n{\n    // Local variable declaration:\n\
    \    int a, b;\n\n\n    // actual initialization\n    a = 10;\n\n    b = 20;\n\
    \n    g = a + b;\n\n\n    cout << g;\n\n\n    return 0;\n}\n```\n```\n\nA program\
    \ can have same name for local and global variables but value of local variable\
    \ inside a function will take preference. For example:\n\n```\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\n\n// Global variable declaration:\nint\
    \ g = 20;\n```\n```"
