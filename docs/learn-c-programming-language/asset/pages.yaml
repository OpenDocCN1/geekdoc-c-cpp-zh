  md: "# 7. VARIABLE SCOPE\n\nA scope is a region of the program and broadly speaking\
    \ there are three places, where variables can be declared:\n\n+   - Inside a function\
    \ or a block which is called local variables,\n+   - In the definition of function\
    \ parameters which is called formal parameters.\n+   - Outside of all functions\
    \ which is called global variables.\n\nWe will learn what a function is, and it's\
    \ parameter in subsequent chapters. Here let us explain what local and global\
    \ variables are.\n\nLocal Variables\n\nVariables that are declared inside a function\
    \ or block are local variables. They can be used only by statements that are inside\
    \ that function or block of code. Local variables are not known to functions outside\
    \ their own. Following is the example using local variables:\n\n```\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n   // Local variable\
    \ declaration:\n   int a, b;\n   int c;\n\n   // actual initialization\n   a =\
    \ 10;\n   b = 20;\n   c = a + b;\n\n   cout << c;\n\n   return 0;\n}\n```\n```"
