  md: "# 34. TEMPLATES\n\nTemplates are the foundation of generic programming, which\
    \ involves writing code in a way that is independent of any particular type.\n\
    \nA template is a blueprint or formula for creating a generic class or a function.\
    \ The library containers like iterators and algorithms are examples of generic\
    \ programming and have been developed using template concept.\n\nThere is a single\
    \ definition of each container, such as **vector**, but we can define many different\
    \ kinds of vectors for example, **vector <int>** or **vector <string>**.\n\nYou\
    \ can use templates to define functions as well as classes, let us see how they\
    \ work:\n\n# Function Template\n\nThe general form of a template function definition\
    \ is shown here:\n\n```\ntemplate <class type> ret-type func-name(parameter list)\n\
    {\n    // body of function\n}\n```\n\nHere, type is a placeholder name for a data\
    \ type used by the function. This name can be used within the function definition.\n\
    \nThe following is the example of a function template that returns the maximum\
    \ of two values:\n\n```\n#include <iostream>\n\n#include <string>\n\nusing namespace\
    \ std;\n\ntemplate <typename T>\ninline T const& Max (T const& a, T const& b)\n\
    {\n    return a < b ? b:a;\n}\nint main ()\n{\n```"
