  md: "# 3. BASIC SYNTAX\n\nWhen we consider a C++ program, it can be defined as a\
    \ collection of objects that communicate via invoking each other's methods. Let\
    \ us now briefly look into what a class, object, methods, and instant variables\
    \ mean.\n\n+   - **Object** - Objects have states and behaviors. Example: A dog\
    \ has states - color, name, breed as well as behaviors - wagging, barking, and\
    \ eating. An object is an instance of a class.\n+   - **Class** - A class can\
    \ be defined as a template/blueprint that describes the behaviors/states that\
    \ object of its type support.\n+   - **Methods** - A method is basically a behavior.\
    \ A class can contain many methods. It is in methods where the logics are written,\
    \ data is manipulated and all the actions are executed.\n+   - **Instant Variables**\
    \ - Each object has its unique set of instant variables. An object's state is\
    \ created by the values assigned to these instant variables.\n\nC++ Program Structure:\n\
    \nLet us look at a simple code that would print the words *Hello World*.\n\n```\n\
    ```cpp\n#include <iostream>\n\nusing namespace std;\n\n// main() is where program\
    \ execution begins.\n\nint main()\n{\n    cout << \"Hello World\"; // prints Hello\
    \ World\n    return 0;\n}\n```\n```\n\nLet us look at the various parts of the\
    \ above program:\n\n+   1. The C++ language defines several headers, which contain\
    \ information that is either necessary or useful to your program. For this program,\
    \ the header **<iostream>** is needed.\n+   2. The line **using namespace std;**\
    \ tells the compiler to use the std namespace. Namespaces are a relatively recent\
    \ addition to C++."
  merge: -1
  img_proc: true
