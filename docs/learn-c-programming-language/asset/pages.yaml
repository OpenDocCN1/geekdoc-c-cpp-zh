  md: '# 38. WEB PROGRAMMING


    # What is CGI?


    The Common Gateway Interface, or CGI, is a set of standards that define how information
    is exchanged between the web server and a custom script.


    The CGI specs are currently maintained by the NCSA and NCSA defines CGI is as
    follows:


    The Common Gateway Interface, or CGI, is a standard for external gateway programs
    to interface with information servers such as HTTP servers.


    The current version is CGI/1.1 and CGI/1.2 is under progress.


    # Web Browsing


    To understand the concept of CGI, let''s see what happens when we click a hyperlink
    to browse a particular web page or URL.


    +   - Your browser contacts the HTTP web server and demand for the URL i.e. filename.

    +   - Web Server will parse the URL and will look for the filename. If it finds
    the requested file then web server sends that file back to the browser otherwise
    sends an error message indicating that you have requested a wrong file.

    +   - Web browser takes response from web server and displays either the received
    file or error message based on the received response.


    However, it is possible to set up the HTTP server in such a way that whenever
    a file in a certain directory is requested, that file is not sent back; instead
    it is executed as a program, and produced output from the program is sent back
    to your browser to display.


    The Common Gateway Interface (CGI) is a standard protocol for enabling applications
    (called CGI programs or CGI scripts) to interact with Web servers and with clients.
    These CGI programs can be a written in Python, PERL, Shell, C or C++ etc.


    # CGI Architecture Diagram


    The following simple program shows a simple architecture of CGI:'
