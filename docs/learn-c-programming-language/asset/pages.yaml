    \ NUM_THREADS     5\n\nvoid *PrintHello(void *threadid)\n{\n    long tid;\n\n\
    \    tid = (long)threadid;\n\n    cout << \"Hello World! Thread ID, \" << tid\
    \ << endl;\n```\n```"
