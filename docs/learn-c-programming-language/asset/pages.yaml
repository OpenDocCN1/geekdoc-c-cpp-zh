  md: "# 2. ENVIRONMENT SETUP\n\n# Try it Option Online\n\nYou really do not need\
    \ to set up your own environment to start learning C++ programming language. Reason\
    \ is very simple, we have already set up C++ Programming environment online, so\
    \ that you can compile and execute all the available examples online at the same\
    \ time when you are doing your theory work. This gives you confidence in what\
    \ you are reading and to check the result with different options. Feel free to\
    \ modify any example and execute it online.\n\nTry the following example using\
    \ our online compiler option available at [http://www.compileonline.com/](http://www.compileonline.com/)\n\
    \n```\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n\
    \    cout << \"Hello World\";\n    return 0;\n}\n```\n```\n\nFor most of the examples\
    \ given in this tutorial, you will find **Try it** option in our website code\
    \ sections at the top right corner that will take you to the online compiler.\
    \ So just make use of it and enjoy your learning.\n\n# Local Environment Setup\n\
    \nIf you are still willing to set up your environment for C++, you need to have\
    \ the following two softwares on your computer.\n\n# Text Editor:\n\nThis will\
    \ be used to type your program. Examples of few editors include Windows Notepad,\
    \ OS Edit command, Brief, Epsilon, EMACS, and vim or vi.\n\nName and version of\
    \ text editor can vary on different operating systems. For example, Notepad will\
    \ be used on Windows and vim or vi can be used on windows as well as Linux, or\
    \ UNIX.\n\nThe files you create with your editor are called source files and for\
    \ C++ they typically are named with the extension .cpp, .cp, or .c.\n\nA text\
    \ editor should be in place to start your C++ programming."
