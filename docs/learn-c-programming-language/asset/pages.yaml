  md: '# # 5. DATA TYPES


    While writing program in any language, you need to use various variables to store
    various information. Variables are nothing but reserved memory locations to store
    values. This means that when you create a variable you reserve some space in memory.


    You may like to store information of various data types like character, wide character,
    integer, floating point, double floating point, boolean etc. Based on the data
    type of a variable, the operating system allocates memory and decides what can
    be stored in the reserved memory.


    # Primitive Built-in Types


    C++ offers the programmer a rich assortment of built-in as well as user defined
    data types. Following table lists down seven basic C++ data types:


    | Type | Keyword |

    |---|---|

    | Boolean | bool |

    | Character | char |

    | Integer | int |

    | Floating point | float |

    | Double floating point | double |

    | Valueless | void |

    | Wide character | wchar_t |


    Several of the basic types can be modified using one or more of these type modifiers:


    +   - signed

    +   - unsigned

    +   - short

    +   - long'
