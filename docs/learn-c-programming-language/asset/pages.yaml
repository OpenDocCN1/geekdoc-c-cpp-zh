- pgno: 236
  md: "When the above code is compiled and executed, it produces the following result:\n\
    \n```\nParent class area\nParent class area\n```\n\nThe reason for the incorrect\
    \ output is that the call of the function area() is being set once by the compiler\
    \ as the version defined in the base class. This is called **static resolution**\
    \ of the function call, or **static linkage** - the function call is fixed before\
    \ the program is executed. This is also sometimes called **early binding** because\
    \ the area() function is set during the compilation of the program.\n\nBut now,\
    \ let's make a slight modification in our program and precede the declaration\
    \ of area() in the Shape class with the keyword **virtual** so that it looks like\
    \ this:\n\n```\nclass Shape {\n\n    protected:\n\n        int width, height;\n\
    \n    public:\n\n        Shape( int a=0, int b=0)\n        {\n            width\
    \ = a;\n            height = b;\n        }\n\n        virtual int area()\n   \
    \     {\n            cout << \"Parent class area :\" <<endl;\n            return\
    \ 0;\n        }\n};\n```\n\nAfter this slight modification, when the previous\
    \ example code is compiled and executed, it produces the following result:\n\n\
    ```\nRectangle class area\nTriangle class area\n```\n\nThis time, the compiler\
    \ looks at the contents of the pointer instead of its type. Hence, since addresses\
    \ of objects of tri and rec classes are stored in *shape the respective area()\
    \ function is called."
