    }\n```\n```\n\nHere, **statement(s)** may be a single statement or a block of\
    \ statements. The **condition** may be any expression, and true is any non-zero\
    \ value. The loop iterates while the condition is true.\n\nWhen the condition\
    \ becomes false, program control passes to the line immediately following the\
    \ loop.\n\n# Flow Diagram"
