- pgno: 15
  md: '# C++ Compiler:


    This is an actual C++ compiler, which will be used to compile your source code
    into final executable program.


    Most C++ compilers don''t care what extension you give to your source code, but
    if you don''t specify otherwise, many will use .cpp by default.


    Most frequently used and free available compiler is GNU C/C++ compiler, otherwise
    you can have compilers either from HP or Solaris if you have the respective Operating
    Systems.


    Installing GNU C/C++ Compiler:


    # UNIX/Linux Installation:


    If you are using **Linux** or **UNIX** then check whether GCC is installed on
    your system by entering the following command from the command line:


    ```

    ```bash

    $ g++ -v

    ```

    ```


    If you have installed GCC, then it should print a message such as the following:


    ```

    ```

    Using built-in specs.


    Target: i386-redhat-linux


    Configured with: ../configure --prefix=/usr .......


    Thread model: posix


    gcc version 4.1.2 20080704 (Red Hat 4.1.2-46)

    ```

    ```


    If GCC is not installed, then you will have to install it yourself using the detailed
    instructions available at http://gcc.gnu.org/install/ .


    # Mac OS X Installation:


    If you use Mac OS X, the easiest way to obtain GCC is to download the Xcode development
    environment from Apple''s website and follow the simple installation instructions.


    Xcode is currently available at developer.apple.com/technologies/tools/.


    # Windows Installation:


    To install GCC at Windows you need to install MinGW. To install MinGW, go to the
    MinGW homepage, www.mingw.org, and follow the link to the MinGW download page.
    Download the latest version of the MinGW installation program which should be
    named MinGW-<version>.exe.


    While installing MinGW, at a minimum, you must install gcc-core, gcc-g++, binutils,
    and the MinGW runtime, but you may wish to install more.'
  merge: -1
  img_proc: true
