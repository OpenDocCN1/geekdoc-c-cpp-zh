  md: "# # 27. DATA ABSTRACTION\n\nData abstraction refers to providing only essential\
    \ information to the outside world and hiding their background details, i.e.,\
    \ to represent the needed information in program without presenting the details.\n\
    \nData abstraction is a programming (and design) technique that relies on the\
    \ separation of interface and implementation.\n\nLet's take one real life example\
    \ of a TV, which you can turn on and off, change the channel, adjust the volume,\
    \ and add external components such as speakers, VCRs, and DVD players, BUT you\
    \ do not know its internal details, that is, you do not know how it receives signals\
    \ over the air or through a cable, how it translates them, and finally displays\
    \ them on the screen.\n\nThus, we can say a television clearly separates its internal\
    \ implementation from its external interface and you can play with its interfaces\
    \ like the power button, channel changer, and volume control without having zero\
    \ knowledge of its internals.\n\nIn C++, classes provides great level of **data\
    \ abstraction**. They provide sufficient public methods to the outside world to\
    \ play with the functionality of the object and to manipulate object data, i.e.,\
    \ state without actually knowing how class has been implemented internally.\n\n\
    For example, your program can make a call to the **sort()** function without knowing\
    \ what algorithm the function actually uses to sort the given values. In fact,\
    \ the underlying implementation of the sorting functionality could change between\
    \ releases of the library, and as long as the interface stays the same, your function\
    \ call will still work.\n\nIn C++, we use **classes** to define our own abstract\
    \ data types (ADT). You can use the **cout** object of class **ostream** to stream\
    \ data to standard output like this:\n\n```\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\nint main( )\n{\n    cout << \"Hello C++\" <<endl;\n    return\
    \ 0;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "Here, you don't need to understand how **cout displays** the text on the user's\
    \ screen. You need to only know the public interface and the underlying implementation\
    \ of ‘cout’ is free to change.\n\n# Access Labels Enforce Abstraction\n\nIn C++,\
    \ we use access labels to define the abstract interface to the class. A class\
    \ may contain zero or more access labels:\n\n+   - Members defined with a public\
    \ label are accessible to all parts of the program. The data-abstraction view\
    \ of a type is defined by its public members.\n+   - Members defined with a private\
    \ label are not accessible to code that uses the class. The private sections hide\
    \ the implementation from code that uses the type.\n\nThere are no restrictions\
    \ on how often an access label may appear. Each access label specifies the access\
    \ level of the succeeding member definitions. The specified access level remains\
    \ in effect until the next access label is encountered or the closing right brace\
    \ of the class body is seen.\n\n# Benefits of Data Abstraction\n\nData abstraction\
    \ provides two important advantages:\n\n+   - Class internals are protected from\
    \ inadvertent user-level errors, which might corrupt the state of the object.\n\
    +   - The class implementation may evolve over time in response to changing requirements\
    \ or bug reports without requiring change in user-level code.\n\nBy defining data\
    \ members only in the private section of the class, the class author is free to\
    \ make changes in the data. If the implementation changes, only the class code\
    \ needs to be examined to see what affect the change may have. If data is public,\
    \ then any function that directly access the data members of the old representation\
    \ might be broken.\n\n# Data Abstraction Example\n\nAny C++ program where you\
    \ implement a class with public and private members is an example of data abstraction.\
    \ Consider the following example:\n\n```\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\nclass Adder{\n    public:\n        // constructor\n      \
    \  Adder(int i = 0)\n```\n```"
