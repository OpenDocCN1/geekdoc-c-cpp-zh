  md: '+   3. The next line `// main()` is where program execution begins.’ is a single-line
    comment available in C++. Single-line comments begin with `//` and stop at the
    end of the line.

    +   4. The line `int main()` is the main function where program execution begins.

    +   5. The next line `cout << "This is my first C++ program.";` causes the message
