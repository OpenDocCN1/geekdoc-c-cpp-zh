  md: '# 11. OPERATORS


    An operator is a symbol that tells the compiler to perform specific mathematical
    or logical manipulations. C++ is rich in built-in operators and provide the following
    types of operators:


    +   - Arithmetic Operators

    +   - Relational Operators

    +   - Logical Operators

    +   - Bitwise Operators

    +   - Assignment Operators

    +   - Misc Operators


    This chapter will examine the arithmetic, relational, logical, bitwise, assignment
    and other operators one by one.


    # Arithmetic Operators


    There are following arithmetic operators supported by C++ language:


    Assume variable A holds 10 and variable B holds 20, then:


    | Operator | Description | Example |

    |---|---|---|

    | + | Adds two operands | A + B will give 30 |

    | - | Subtracts second operand from the first | A - B will give -10 |

    | * | Multiples both operands | A * B will give 200 |

    | / | Divides numerator by denominator | B / A will give 2 |

    | % | Modulus Operator and remainder of after an integer division | B % A will
    give 0 |'
