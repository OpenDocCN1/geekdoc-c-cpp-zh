  md: '# 36. SIGNAL HANDLING


    Signals are the interrupts delivered to a process by the operating system which
    can terminate a program prematurely. You can generate interrupts by pressing Ctrl+C
    on a UNIX, LINUX, Mac OS X or Windows system.


    There are signals which cannot be caught by the program but there is a following
    list of signals which you can catch in your program and can take appropriate actions
    based on the signal. These signals are defined in C++ header file `<csignal>`.


    | Signal | Description |

    |---|---|

    | SIGABRT | Abnormal termination of the program, such as a call to **abort**.
    |

    | SIGFPE | An erroneous arithmetic operation, such as a divide by zero or an operation
    resulting in overflow. |

    | SIGILL | Detection of an illegal instruction. |

    | SIGINT | Receipt of an interactive attention signal. |

    | SIGSEGV | An invalid access to storage. |

    | SIGTERM | A termination request sent to the program. |


    # The signal() Function


    C++ signal-handling library provides function **signal** to trap unexpected events.
    Following is the syntax of the signal() function:


    ```

    void (*signal (int sig, void (*func)(int)))(int);

    ```


    Keeping it simple, this function receives two arguments: first argument as an
    integer, which represents signal number and second argument as a pointer to the
    signal-handling function.


    Let us write a simple C++ program where we will catch SIGINT signal using signal()
    function. Whatever signal you want to catch in your program, you must register
    that signal using **signal** function and associate it with a signal handler.
    Examine the following example:


    ```

    #include <iostream>

    ```


    ![](img/7976f323fd1a5c8774f95fbf029a106f_281_0.png)'
