  md: '# 19. REFERENCES


    A reference variable is an alias, that is, another name for an already existing
    variable. Once a reference is initialized with a variable, either the variable
    name or the reference name may be used to refer to the variable.


    # References vs Pointers


    References are often confused with pointers but three major differences between
    references and pointers are:


    +   - You cannot have NULL references. You must always be able to assume that
    a reference is connected to a legitimate piece of storage.

    +   - Once a reference is initialized to an object, it cannot be changed to refer
    to another object. Pointers can be pointed to another object at any time.

    +   - A reference must be initialized when it is created. Pointers can be initialized
    at any time.


    # Creating References in C++


    Think of a variable name as a label attached to the variable''s location in memory.
    You can then think of a reference as a second label attached to that memory location.
    Therefore, you can access the contents of the variable through either the original
    variable name or the reference. For example, suppose we have the following example:


    ```

    int   i = 17;

    ```


    We can declare reference variables for i as follows.


    ```

    int&   r = i;

    ```


    Read the & in these declarations as **reference**. Thus, read the first declaration
    as "r is an integer reference initialized to i" and read the second declaration
    as "s is a double reference initialized to d." Following example makes use of
    references on int and double:


    ```

    #include <iostream>


    using namespace std;


    int main ()

    {

    ```


    ![](img/7976f323fd1a5c8774f95fbf029a106f_146_0.png)'
