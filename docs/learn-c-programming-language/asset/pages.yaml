  md: '# 13. DECISION-MAKING STATEMENTS


    Decision making structures require that the programmer specify one or more conditions
    to be evaluated or tested by the program, along with a statement or statements
    to be executed if the condition is determined to be true, and optionally, other
    statements to be executed if the condition is determined to be false.


    Following is the general from of a typical decision making structure found in
    most of the programming languages:


    ![](img/7976f323fd1a5c8774f95fbf029a106f_80_0.png)


    C++ programming language provides following types of decision making statements.


    | Statement | Description |

    |---|---|

    | if statement | An ‘if’ statement consists of a boolean expression followed by
    one or more statements. |

    | if…else statement | An ‘if’ statement can be followed by an optional ‘else’
    statement, which executes when the boolean expression is false. |

    | switch statement | A ‘switch’ statement allows a variable to be tested |'
