  md: "# Passing Pointers to Functions\n\nC++ allows you to pass a pointer to a function.\
    \ To do so, simply declare the function parameter as a pointer type.\n\nFollowing\
    \ a simple example where we pass an unsigned long pointer to a function and change\
    \ the value inside the function which reflects back in the calling function:\n\
    \n```\n```cpp\n#include <iostream>\n#include <ctime>\n\nusing namespace std;\n\
    void getSeconds(unsigned long *par);\n\nint main ()\n{\n    unsigned long sec;\n\
    \n    getSeconds( &sec );\n\n    // print the actual value\n    cout << \"Number\
    \ of seconds :\" << sec << endl;\n\n    return 0;\n}\n\nvoid getSeconds(unsigned\
    \ long *par)\n{\n    // get the current number of seconds\n    *par = time( NULL\
