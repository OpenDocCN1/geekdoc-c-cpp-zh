- pgno: 93
  md: "# 14. FUNCTIONS\n\nA function is a group of statements that together perform\
    \ a task. Every C++ program has at least one function, which is **main()**, and\
    \ all the most trivial programs can define additional functions.\n\nYou can divide\
    \ up your code into separate functions. How you divide up your code among different\
    \ functions is up to you, but logically the division usually is such that each\
    \ function performs a specific task.\n\nA function **declaration** tells the compiler\
    \ about a function's name, return type, and parameters. A function **definition**\
    \ provides the actual body of the function.\n\nThe C++ standard library provides\
    \ numerous built-in functions that your program can call. For example, function\
    \ **strcat()** to concatenate two strings, function **memcpy()** to copy one memory\
    \ location to another location, and many more functions.\n\nA function is known\
    \ with various names like a method or a sub-routine or a procedure etc.\n\n# Defining\
    \ a Function\n\nThe general form of a C++ function definition is as follows:\n\
    \n```\nreturn_type function_name( parameter list )\n{\n    body of the function\n\
    }\n```\n\nA C++ function definition consists of a function header and a function\
    \ body. Here are all the parts of a function:\n\n+   - **Return Type**: A function\
    \ may return a value. The **return_type** is the data type of the value the function\
    \ returns. Some functions perform the desired operations without returning a value.\
    \ In this case, the return_type is the keyword **void**.\n+   - **Function Name**:\
    \ This is the actual name of the function. The function name and the parameter\
    \ list together constitute the function signature.\n+   - **Parameters**: A parameter\
    \ is like a placeholder. When a function is invoked, you pass a value to the parameter.\
    \ This value is referred to as actual parameter or argument. The parameter list\
    \ refers to the type, order, and number of the parameters of a function. Parameters\
    \ are optional; that is, a function may contain no parameters."
  merge: -1
  img_proc: true
- pgno: 94
  md: "+   - **Function Body:** The function body contains a collection of statements\
    \ that define what the function does.\n\n# **Example:**\n\nFollowing is the source\
    \ code for a function called **max()**. This function takes two parameters num1\
    \ and num2 and returns the maximum between the two:\n\n```\n```cpp\n// function\
    \ returning the max between two numbers\n\nint max(int num1, int num2)\n{\n  \
    \  // local variable declaration\n    int result;\n\n    if (num1 > num2)\n  \
    \      result = num1;\n    else\n        result = num2;\n\n    return result;\n\
    }\n```\n```\n\n# Function Declarations\n\nA function **declaration** tells the\
    \ compiler about a function name and how to call the function. The actual body\
    \ of the function can be defined separately.\n\nA function declaration has the\
    \ following parts:\n\n```\n```cpp\nreturn_type function_name( parameter list );\n\
    ```\n```\n\nFor the above defined function max(), following is the function declaration:\n\
    \n```\n```cpp\nint max(int num1, int num2);\n```\n```\n\nParameter names are not\
    \ important in function declaration only their type is required, so following\
    \ is also valid declaration:\n\n```\n```cpp\nint max(int, int);\n```\n```\n\n\
    Function declaration is required when you define a function in one source file\
    \ and you call that function in another file. In such case, you should declare\
    \ the function at the top of the file calling the function."
