  md: "# 9. MODIFIER TYPES\n\nC++ allows the **char, int, and double** data types\
    \ to have modifiers preceding them. A modifier is used to alter the meaning of\
    \ the base type so that it more precisely fits the needs of various situations.\n\
    \nThe data type modifiers are listed here:\n\n+   - signed\n+   - unsigned\n+\
    \   - long\n+   - short\n\nThe modifiers **signed, unsigned, long, and short**\
    \ can be applied to integer base types. In addition, **signed** and **unsigned**\
    \ can be applied to char, and **long** can be applied to double.\n\nThe modifiers\
    \ **signed** and **unsigned** can also be used as prefix to **long** or **short**\
    \ modifiers. For example, **unsigned long int**.\n\nC++ allows a shorthand notation\
    \ for declaring **unsigned, short,** or **long** integers. You can simply use\
    \ the word **unsigned, short,** or **long,** without **int**. It automatically\
    \ implies **int**. For example, the following two statements both declare unsigned\
    \ integer variables.\n\n```\nunsigned x;\n\nunsigned int y;\n```\n\nTo understand\
    \ the difference between the way signed and unsigned integer modifiers are interpreted\
    \ by C++, you should run the following short program:\n\n```\n#include <iostream>\n\
    \nusing namespace std;\n\n/* This program shows the difference between\n * signed\
    \ and unsigned integers.\n */\nint main()\n{\n    short int i;          // a signed\
    \ short integer\n    short unsigned int j;  // an unsigned short integer\n```"
