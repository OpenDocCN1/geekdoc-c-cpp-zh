  md: "# 29. INTERFACES\n\nAn interface describes the behavior or capabilities of\
    \ a C++ class without committing to a particular implementation of that class.\n\
    \nThe C++ interfaces are implemented using **abstract classes** and these abstract\
    \ classes should not be confused with data abstraction which is a concept of keeping\
    \ implementation details separate from associated data.\n\nA class is made abstract\
    \ by declaring at least one of its functions as **pure virtual** function. A pure\
    \ virtual function is specified by placing \"= 0\" in its declaration as follows:\n\
    \n```\n```cpp\nclass Box\n{\n    public:\n\n        // pure virtual function\n\
    \        virtual double getVolume() = 0;\n    private:\n\n        double length;\
    \      // Length of a box\n        double breadth;     // Breadth of a box\n \
    \       double height;      // Height of a box\n};\n```\n```\n\nThe purpose of\
    \ an **abstract class** (often referred to as an ABC) is to provide an appropriate\
    \ base class from which other classes can inherit. Abstract classes cannot be\
    \ used to instantiate objects and serves only as an **interface**. Attempting\
    \ to instantiate an object of an abstract class causes a compilation error.\n\n\
    Thus, if a subclass of an ABC needs to be instantiated, it has to implement each\
    \ of the virtual functions, which means that it supports the interface declared\
    \ by the ABC. Failure to override a pure virtual function in a derived class,\
    \ then attempting to instantiate objects of that class, is a compilation error.\n\
