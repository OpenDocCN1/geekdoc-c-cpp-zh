  md: "# # 26. POLYMORPHISM\n\nThe word **polymorphism** means having many forms.\
    \ Typically, polymorphism occurs when there is a hierarchy of classes and they\
    \ are related by inheritance.\n\nC++ polymorphism means that a call to a member\
    \ function will cause a different function to be executed depending on the type\
    \ of object that invokes the function.\n\nConsider the following example where\
    \ a base class has been derived by other two classes:\n\n```\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nclass Shape {\n\n    protected:\n\n  \
    \      int width, height;\n\n    public:\n\n        Shape( int a=0, int b=0)\n\
    \        {\n            width = a;\n            height = b;\n        }\n\n   \
    \     int area()\n        {\n            cout << \"Parent class area :\" <<endl;\n\
    \            return 0;\n        }\n};\nclass Rectangle: public Shape{\n    public:\n\
    \        Rectangle( int a=0, int b=0):Shape(a, b) { }\n        int area ()\n \
    \       {\n            cout << \"Rectangle class area :\" <<endl;\n```\n```"
