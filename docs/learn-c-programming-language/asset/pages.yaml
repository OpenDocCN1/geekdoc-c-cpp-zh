  md: '# # 6. VARIABLE TYPES


    A variable provides us with named storage that our programs can manipulate. Each
    variable in C++ has a specific type, which determines the size and layout of the
    variable''s memory; the range of values that can be stored within that memory;
    and the set of operations that can be applied to the variable.


    The name of a variable can be composed of letters, digits, and the underscore
    character. It must begin with either a letter or an underscore. Upper and lowercase
    letters are distinct because C++ is case-sensitive:


    There are following basic types of variable in C++ as explained in last chapter:


    | Type | Description |

    |---|---|

    | bool | Stores either value true or false. |

    | char | Typically a single octet (one byte). This is an integer type. |

    | int | The most natural size of integer for the machine. |

    | float | A single-precision floating point value. |

    | double | A double-precision floating point value. |

    | void | Represents the absence of type. |

    | wchar_t | A wide character type. |


    C++ also allows to define various other types of variables, which we will cover
    in subsequent chapters like **Enumeration**, **Pointer**, **Array**, **Reference**,
    **Data structures**, and **Classes**.


    Following section will cover how to define, declare and use various types of variables.


    # Variable Definition in C++


    A variable definition tells the compiler where and how much storage to create
    for the variable. A variable definition specifies a data type, and contains a
    list of one or more variables of that type as follows:'
