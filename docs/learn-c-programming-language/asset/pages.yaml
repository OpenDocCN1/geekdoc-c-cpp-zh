    \ two ways that arguments can be passed to a function:\n\n| Call Type | Description\
    \ |\n|---|---|\n| Call by value | This method copies the actual value of an argument\
    \ into the formal parameter of the function. In this case, changes made to the\
    \ parameter inside the function have no effect on the argument. |\n| Call by pointer\
    \ | This method copies the address of an argument into the formal parameter. Inside\
    \ the function, the address is used to access the actual argument used in the\
