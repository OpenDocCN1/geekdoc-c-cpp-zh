    # GET and POST Methods


    You must have come across many situations when you need to pass some information
    from your browser to web server and ultimately to your CGI Program. Most frequently
    browser uses two methods to pass this information to web server. These methods
    are GET Method and POST Method.


    # Passing Information Using GET Method


    The GET method sends the encoded user information appended to the page request.
    The page and the encoded information are separated by the ‘?’ character as follows:


    ```

    ```text

    http://www.test.com/cgi-bin/cpp.cgi?key1=value1&key2=value2

    ```

    ```


    The GET method is the default method to pass information from browser to web server
    and it produces a long string that appears in your browser''s Location:box. Never
    use the GET method if you have password or other sensitive information to pass
    to the server. The GET method has size limitation and you can pass up to 1024
    characters in a request string.


    When using GET method, information is passed using QUERY_STRING http header and
    will be accessible in your CGI Program through QUERY_STRING environment variable.'
