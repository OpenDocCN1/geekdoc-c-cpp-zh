- pgno: 43
  md: "The **static** storage class instructs the compiler to keep a local variable\
    \ in existence during the life-time of the program instead of creating and destroying\
    \ it each time it comes into and goes out of scope. Therefore, making local variables\
    \ static allows them to maintain their values between function calls.\n\nThe static\
    \ modifier may also be applied to global variables. When this is done, it causes\
    \ that variable's scope to be restricted to the file in which it is declared.\n\
    \nIn C++, when static is used on a class data member, it causes only one copy\
    \ of that member to be shared by all objects of its class.\n\n```\n```cpp\n#include\
    \ <iostream>\n\n// Function declaration\nvoid func(void);\n\nstatic int count\
    \ = 10; /* Global variable */\n\nmain()\n{\n    while(count--)\n    {\n      \
    \  func();\n    }\n    return 0;\n}\n// Function definition\nvoid func( void )\n\
    {\n    static int i = 5; // local static variable\n    i++;\n    std::cout <<\
    \ \"i is \" << i ;\n    std::cout << \" and count is \" << count << std::endl;\n\
    }\n```\n```\n\nWhen the above code is compiled and executed, it produces the following\
    \ result:\n\n```\n```text\ni is 6 and count is 9\n\ni is 7 and count is 8\n```\n\
    ```"
