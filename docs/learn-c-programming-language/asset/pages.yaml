  md: '| 选项 | 说明 |

    |---|---|

    | `ios::app` | Append mode. All output to that file to be appended to the end.
    |

    | `ios::ate` | Open a file for output and move the read/write control to the end
    of the file. |

    | `ios::in` | Open a file for reading. |

    | `ios::out` | Open a file for writing. |

    | `ios::trunc` | If the file already exists, its contents will be truncated before
    opening the file. |


    You can combine two or more of these values by **OR**ing them together. For example
    if you want to open a file in write mode and want to truncate it in case that
    already exists, following will be the syntax:


    ```

    ofstream outfile;

    outfile.open("file.dat", ios::out | ios::trunc );

    ```


    Similar way, you can open a file for reading and writing purpose as follows:


    ```

    fstream  afile;

    afile.open("file.dat", ios::out | ios::in );

    ```


    # Closing a File


    When a C++ program terminates it automatically flushes all the streams, release
    all the allocated memory and close all the opened files. But it is always a good
    practice that a programmer should close all the opened files before program termination.


    Following is the standard syntax for close() function, which is a member of fstream,
    ifstream, and ofstream objects.


    ```

    void close();

    ```


    # Writing to a File


    While doing C++ programming, you write information to a file from your program
    using the stream insertion operator (<<) just as you use that operator to output
    information to the screen. The only difference is that you use an **ofstream**
    or **fstream** object instead of the **cout** object.


    # Reading from a File'
