    The **continue** statement works somewhat like the break statement. Instead of
    forcing termination, however, continue forces the next iteration of the loop to
    take place, skipping any code in between.


    For the **for** loop, continue causes the conditional test and increment portions
    of the loop to execute. For the **while** and **do...while** loops, program control
    passes to the conditional tests.


    # Syntax


    The syntax of a continue statement in C++ is:


    ```

    ```cpp

    continue;

    ```

