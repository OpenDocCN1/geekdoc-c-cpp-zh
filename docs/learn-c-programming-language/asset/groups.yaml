  - "[PAGE 43]\n\nThe **static** storage class instructs the compiler to keep a local\
    \ variable in existence during the life-time of the program instead of creating\
    \ and destroying it each time it comes into and goes out of scope. Therefore,\
    \ making local variables static allows them to maintain their values between function\
    \ calls.\n\nThe static modifier may also be applied to global variables. When\
    \ this is done, it causes that variable's scope to be restricted to the file in\
    \ which it is declared.\n\nIn C++, when static is used on a class data member,\
    \ it causes only one copy of that member to be shared by all objects of its class.\n\
    \n```\n```cpp\n#include <iostream>\n\n// Function declaration\nvoid func(void);\n\
    \nstatic int count = 10; /* Global variable */\n\nmain()\n{\n    while(count--)\n\
    \    {\n        func();\n    }\n    return 0;\n}\n// Function definition\nvoid\
