    \ |\n\n### C++ CGI 库\n\n对于实际示例，你的 CGI 程序需要执行许多操作。有为 C++ 程序编写的 CGI 库，你可以从 ftp://ftp.gnu.org/gnu/cgicc/\
    \ 下载并按照步骤安装该库：\n\n```bash\n$tar xzf cgicc-X.X.X.tar.gz\n\n$cd cgicc-X.X.X/\n\n\
    $./configure --prefix=/usr\n\n$make\n\n$make install\n```\n\n你可以在‘C++ CGI Lib\
    \ Documentation’查看相关文档。\n\n### GET 和 POST 方法\n\n你一定遇到过许多需要将信息从浏览器传递到 Web 服务器并最终传递到你的\
    \ CGI 程序的情况。浏览器最频繁使用两种方法将此信息传递给 Web 服务器。这些方法为 GET 方法和 POST 方法。\n\n#### 使用 GET\
    \ 方法传递信息\n\nGET 方法将编码的用户信息附加到页面请求中。页面和编码信息由 ‘?’ 字符分隔，如下所示：\n\n```text\nhttp://www.test.com/cgi-bin/cpp.cgi?key1=value1&key2=value2\n\
    ```\n\nGET 方法是将信息从浏览器传递到 Web 服务器的默认方法，并且会产生一个长字符串出现在你的浏览器位置框中。切勿使用 GET 方法传递密码或其他敏感信息到服务器。GET\
    \ 方法有大小限制，你可以在请求字符串中传递最多 1024 个字符。\n\n使用 GET 方法时，信息通过 QUERY_STRING http 头部传递，并且可在你的\
    \ CGI 程序中通过 QUERY_STRING 环境变量访问。\n\n你可以通过简单地将键值对与任何 URL 拼接在一起传递信息，也可以使用 HTML <FORM>\
