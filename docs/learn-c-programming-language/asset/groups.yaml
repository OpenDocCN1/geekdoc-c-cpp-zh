    \n插入运算符 << 可以像上面那样在一条语句中使用多次，**endl** 用于在行末添加一个换行符。\n\n### 标准输入流（cin）\n\n预定义对象\
    \ **cin** 是 **istream** 类的一个实例。cin 对象据说连接到标准输入设备，通常是键盘。**cin** 与流提取运算符一起使用，该运算符写作\
