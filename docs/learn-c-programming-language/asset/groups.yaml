    \ situations.\n\nThe data type modifiers are listed here:\n\n+   - signed\n+ \
    \  - unsigned\n+   - long\n+   - short\n\nThe modifiers **signed, unsigned, long,\
    \ and short** can be applied to integer base types. In addition, **signed** and\
