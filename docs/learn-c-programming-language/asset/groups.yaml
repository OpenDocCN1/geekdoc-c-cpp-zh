    *(p + 7) : 1778906708\n*(p + 8) : 1820354158\n*(p + 9) : 667126415\n```\n\n##\
    \ 19. REFERENCES\n\nA reference variable is an alias, that is, another name for\
    \ an already existing variable. Once a reference is initialized with a variable,\
    \ either the variable name or the reference name may be used to refer to the variable.\n\
    \n### References vs Pointers\n\nReferences are often confused with pointers but\
    \ three major differences between references and pointers are:\n\n- You cannot\
    \ have NULL references. You must always be able to assume that a reference is\
    \ connected to a legitimate piece of storage.\n- Once a reference is initialized\
    \ to an object, it cannot be changed to refer to another object. Pointers can\
    \ be pointed to another object at any time.\n- A reference must be initialized\
    \ when it is created. Pointers can be initialized at any time.\n\n### Creating\
    \ References in C++\n\nThink of a variable name as a label attached to the variable's\
    \ location in memory. You can then think of a reference as a second label attached\
    \ to that memory location. Therefore, you can access the contents of the variable\
    \ through either the original variable name or the reference. For example, suppose\
    \ we have the following example:\n\n```\nint   i = 17;\n```\n\nWe can declare\
    \ reference variables for i as follows.\n\n```\nint&   r = i;\n```\n\nRead the\
    \ & in these declarations as **reference**. Thus, read the first declaration as\
    \ \"r is an integer reference initialized to i\" and read the second declaration\
    \ as \"s is a double reference initialized to d.\" Following example makes use\
    \ of references on int and double:\n\n```\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main ()\n{\n```\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_146_0.png)\n\
    \n```\n```cpp\n// declare simple variables\nint    i;\ndouble d;\n\n// declare\
    \ reference variables\nint&    r = i;\ndouble& s = d;\n\ni = 5;\ncout << \"Value\
    \ of i : \" << i << endl;\ncout << \"Value of i reference : \" << r  << endl;\n\
    \nd = 11.7;\ncout << \"Value of d : \" << d << endl;\ncout << \"Value of d reference\
    \ : \" << s  << endl;\n\nreturn 0;\n}\n```\n```\n\nWhen the above code is compiled\
    \ together and executed, it produces the following result:\n\n```\n```text\nValue\
    \ of i : 5\n\nValue of i reference : 5\n\nValue of d : 11.7\n\nValue of d reference\
    \ : 11.7\n```\n```\n\nReferences are usually used for function argument lists\
    \ and function return values. So following are two important subjects related\
    \ to C++ references which should be clear to a C++ programmer:\n\n| Concept |\
    \ Description |\n|---|---|\n| References as parameters | C++ supports passing\
    \ references as function parameter more safely than parameters. |\n| Reference\
    \ as return value | You can return reference from a C++ function |\n\n```\n```cpp\n\
    int temp;\n\ntemp = x; /* save the value at address x */\nx = y;    /* put y into\
    \ x */\ny = temp; /* put x into y */\n\nreturn;\n}\n```\n```\n\nWhen the above\
    \ code is compiled and executed, it produces the following result:\n\n```\n```\n\
    Before swap, value of a :100\nBefore swap, value of b :200\nAfter swap, value\
    \ of a :200\nAfter swap, value of b :100\n```\n```\n\n### Reference as Return\
    \ Value\n\nA C++ program can be made easier to read and maintain by using references\
    \ rather than pointers. A C++ function can return a reference in a similar way\
    \ as it returns a pointer.\n\nWhen a function returns a reference, it returns\
    \ an implicit pointer to its return value. This way, a function can be used on\
    \ the left side of an assignment statement. For example, consider this simple\
    \ program:\n\n```\n```cpp\n#include <iostream>\n\n#include <ctime>\n\nusing namespace\
    \ std;\n\ndouble vals[] = {10.1, 12.6, 33.1, 24.1, 50.0};\n\ndouble& setValues(\
    \ int i )\n{\n    return vals[i];   // return a reference to the ith element\n\
    }\n\n// main function to call above defined function.\nint main ()\n```\n\n```\n\
    ```cpp\n{\n    cout << \"Value before change\" << endl;\n    for ( int i = 0;\
    \ i < 5; i++ )\n    {\n        cout << \"vals[\" << i << \"] = \";\n        cout\
    \ << vals[i] << endl;\n    }\n\n    setValues(1) = 20.23;  // change 2nd element\n\
    \    setValues(3) = 70.8;   // change 4th element\n\n    cout << \"Value after\
    \ change\" << endl;\n    for ( int i = 0; i < 5; i++ )\n    {\n        cout <<\
    \ \"vals[\" << i << \"] = \";\n        cout << vals[i] << endl;\n    }\n    return\
    \ 0;\n}\n```\n```\n\nWhen the above code is compiled together and executed, it\
    \ produces the following result:\n\n```\n```\nValue before change\n\nvals[0] =\
    \ 10.1\n\nvals[1] = 12.6\n\nvals[2] = 33.1\n\nvals[3] = 24.1\n\nvals[4] = 50\n\
    \nValue after change\n\nvals[0] = 10.1\n\nvals[1] = 20.23\n\nvals[2] = 33.1\n\n\
    vals[3] = 70.8\n```\n```\n"
  mdcn: "\n\n## 向函数传递指针\n\nC++ 允许你向函数传递指针。为此，只需将函数参数声明为指针类型即可。\n\n以下是一个简单的示例，我们将一个无符号长整型指针传递给函数，并在函数内部更改其值，该更改会在调用函数中体现出来：\n\
