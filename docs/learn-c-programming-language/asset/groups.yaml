    # 32. DYNAMIC MEMORY


    A good understanding of how dynamic memory really works in C++ is essential to
    becoming a good C++ programmer. Memory in your C++ program is divided into two
    parts:


    +   - **The stack:** All variables declared inside the function will take up memory
    from the stack.

    +   - **The heap:** This is unused memory of the program and can be used to allocate
    the memory dynamically when program runs.


    Many times, you are not aware in advance how much memory you will need to store
    particular information in a defined variable and the size of required memory can
    be determined at run time.


    You can allocate memory at run time within the heap for the variable of a given
    type using a special operator in C++ which returns the address of the space allocated.
    This operator is called **new** operator.


    If you are not in need of dynamically allocated memory anymore, you can use **delete**
    operator, which de-allocates memory previously allocated by new operator.


    # The new and delete Operators


    There is following generic syntax to use **new** operator to allocate memory dynamically
    for any data-type.


    ```

    ```cpp

    new data-type;

    ```

    ```


    Here, **data-type** could be any built-in data type including an array or any
    user defined data types include class or structure. Let us start with built-in
    data types. For example we can define a pointer to type double and then request
    that the memory be allocated at execution time. We can do this using the **new**
    operator with the following statements:


    ```

    ```cpp

    double* pvalue  = NULL;  // Pointer initialized with null


    pvalue  = new double;    // Request memory for the variable

    ```

    ```


    The memory may not have been allocated successfully, if the free store had been
    used up. So it is good practice to check if new operator is returning NULL pointer
    and take appropriate action as below:'
