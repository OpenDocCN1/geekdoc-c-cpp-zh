    \n1. C++ 语言定义了一些头文件，其中包含对你的程序必要或有用的信息。对于这个程序，需要头文件 **&lt;iostream&gt;**。\n2. **using\
    \ namespace std;** 这一行告诉编译器使用 `std` 命名空间。命名空间是 C++ 中相对较新的新增特性。\n3. 下一行 `// main()\
    \ is where program execution begins.` 是 C++ 中可用的一种单行注释。单行注释以 `//` 开头，到行尾结束。\n\
    4. `int main()` 这一行是主函数，程序执行从它开始。\n5. 下一行 `cout << \"This is my first C++ program.\"\
    ;` 会使消息“这是我的第一个 C++ 程序”显示在屏幕上。\n6. 下一行 `return 0;` 会终止 `main()` 函数，并使它向调用进程返回数值\
    \ 0。\n\n### 编译并执行 C++ 程序\n\n让我们看看如何保存文件、编译并运行程序。请按照以下步骤操作：\n\n1. 打开文本编辑器，并添加上面的代码。\n\
