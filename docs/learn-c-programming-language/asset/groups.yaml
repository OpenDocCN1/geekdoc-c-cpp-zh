    # Passing Information Using POST Method


    A generally more reliable method of passing information to a CGI program is the
    POST method. This packages the information in exactly the same way as GET methods,
    but instead of sending it as a text string after a ‘?’ in the URL it sends it
    as a separate message. This message comes into the CGI script in the form of the
    standard input.


    The same cpp_get.cgi program will handle POST method as well. Let us take same
    example as above, which passes two values using HTML FORM and submit button but
    this time with POST method as follows:


    ```

    <form action="/cgi-bin/cpp_get.cgi" method="post">


    First Name: <input type="text" name="first_name"><br />


    Last Name: <input type="text" name="last_name" />



    <input type="submit" value="Submit" />

    </form>

    ```


