    \ If no break appears, the flow of control will *fall through* to subsequent cases\
    \ until a break is reached.\n- A **switch** statement can have an optional **default**\
    \ case, which must appear at the end of the switch. The default case can be used\
    \ for performing a task when none of the cases is true. No break is needed in\
    \ the default case.\n\n### Flow Diagram\n"
  mdcn: "\n\n## break 语句\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_73_0.png)\n\n\
    ### 示例\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n\
    \    // Local variable declaration:\n    int a = 10;\n\n    // do loop execution\n\
    \    do\n    {\n        cout << \"value of a: \" << a << endl;\n        a = a\
    \ + 1;\n        if(a > 15)\n        {\n            // terminate the loop\n   \
    \         break;\n        }\n    }while( a < 20 );\n\n    return 0;\n}\n```\n\n\
    当上述代码被编译并执行时，会产生以下结果：\n\n```text\nvalue of a: 10\nvalue of a: 11\nvalue of a:\
    \ 12\nvalue of a: 13\nvalue of a: 14\nvalue of a: 15\n```\n\n## continue 语句\n\n\
    **continue** 语句的工作方式与 break 语句 somewhat 相似。然而，与强制终止不同，continue 强制执行循环的下一轮迭代，跳过中间的任何代码。\n\
    \n对于 **for** 循环，continue 会导致循环的条件测试和增量部分执行。对于 **while** 和 **do...while** 循环，程序控制会传递到条件测试。\n\
    \n### 语法\n\ncontinue 语句在 C++ 中的语法是：\n\n```cpp\ncontinue;\n```\n\n### 流程图\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_75_0.png)\n\
    \n### 示例\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n\
    {\n    // Local variable declaration:\n    int a = 10;\n\n    // do loop execution\n\
    \    do\n    {\n        if( a == 15)\n        {\n            // skip the iteration.\n\
    \            a = a + 1;\n            continue;\n        }\n        cout << \"\
    value of a: \" << a << endl;\n        a = a + 1;\n    }while( a < 20 );\n\n  \
    \  return 0;\n}\n```\n\n## goto 语句\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_77_0.png)\n\
    \n### 示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n\
    {\n    // Local variable declaration:\n    int a = 10;\n\n    // do loop execution\n\
    \    LOOP: do\n    {\n        if( a == 15)\n        {\n            // skip the\
    \ iteration.\n            a = a + 1;\n            goto LOOP;\n        }\n    \
    \    cout << \"value of a: \" << a << endl;\n        a = a + 1;\n    }while( a\
    \ < 20 );\n\n    return 0;\n}\n```\n\n## 无限循环\n\n由于构成 ‘for’ 循环的三个表达式都不是必需的，你可以通过将条件表达式留空来创建一个无限循环。\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n\n  \
    \  for( ; ; )\n    {\n        printf(\"This loop will run forever.\\n\");\n  \
    \  }\n\n    return 0;\n}\n```\n\n当条件表达式缺失时，它被假定为 true。你可以有初始化和增量表达式，但 C++ 程序员更常用\
    \ ‘for (;;)’ 构造来表示无限循环。\n\n**NOTE:** 你可以通过按下 Ctrl + C 键来终止无限循环。\n\n## 13. 决策语句\n\
    \n决策结构要求程序员指定一个或多个要由程序评估或测试的条件，以及如果条件被确定为 true 时要执行的语句或语句，以及可选地，如果条件被确定为 false\
    \ 时要执行的其他语句。\n\n以下是大多数编程语言中常见的典型决策结构的一般形式：\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_80_0.png)\n\
    \nC++ 编程语言提供以下类型的决策语句。\n\n| 语句 | 描述 |\n|---|---|\n| if 语句 | ‘if’ 语句由布尔表达式后跟一个或多个语句组成。\
    \ |\n| if…else 语句 | ‘if’ 语句可以跟随一个可选的 ‘else’ 语句，当布尔表达式为 false 时执行。 |\n| switch\
    \ 语句 | ‘switch’ 语句允许一个变量与一系列值进行相等性测试。 |\n\n### if 语句\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_82_0.png)\n\
    \n### 示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n\
    {\n    // local variable declaration:\n    int a = 10;\n\n    // check the boolean\
    \ condition\n    if( a < 20 )\n    {\n        // if condition is true then print\
    \ the following\n        cout << \"a is less than 20;\" << endl;\n    }\n    cout\
    \ << \"value of a is : \" << a << endl;\n\n    return 0;\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果：\n\
    \n```text\na is less than 20;\nvalue of a is : 10\n```\n\n### if...else 语句\n\n\
    **if** 语句可以跟随一个可选的 **else** 语句，当布尔表达式为 false 时执行。\n\n### 语法\n\nif...else 语句在 C++\
    \ 中的语法是：\n\n```cpp\nif(boolean_expression)\n{\n    // statement(s) will execute\
    \ if the boolean expression is true\n}\nelse\n{\n    // statement(s) will execute\
    \ if the boolean expression is false\n}\n```\n\n如果布尔表达式求值为 **true**，则 **if 块**\
    \ 的代码将被执行，否则 **else 块** 的代码将被执行。\n\n### 流程图\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_83_0.png)\n\
    \n### 示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n\
    {\n    // local variable declaration:\n    int a = 100;\n\n    // check the boolean\
    \ condition\n    if( a < 20 )\n    {\n        // if condition is true then print\
    \ the following\n        cout << \"a is less than 20;\" << endl;\n    }\n    else\n\
    \    {\n        // if condition is false then print the following\n        cout\
    \ << \"a is not less than 20;\" << endl;\n    }\n    cout << \"value of a is :\
    \ \" << a << endl;\n\n    return 0;\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果：\n\n```text\n\
    a is not less than 20;\nvalue of a is : 100\n```\n\n### if...else if...else 语句\n\
    \n**if** 语句可以跟随一个可选的 **else if...else** 语句，这对于使用单个 if...else if 语句测试各种条件非常有用。\n\
    \n使用 if、else if、else 语句时需要注意以下几点。\n\n- 一个 if 可以有零个或一个 else，并且它必须出现在任何 else if\
    \ 之后。\n- 一个 if 可以有零到多个 else if，并且它们必须出现在 else 之前。\n- 一旦某个 else if 成功，后续的 else\
    \ if 或 else 将不会被测试。\n\n### 语法\n\nif...else if...else 语句在 C++ 中的语法是：\n\n```cpp\n\
    if(boolean_expression 1)\n{\n    // Executes when the boolean expression 1 is\
    \ true\n}\nelse if( boolean_expression 2)\n{\n    // Executes when the boolean\
    \ expression 2 is true\n}\nelse if( boolean_expression 3)\n{\n    // Executes\
    \ when the boolean expression 3 is true\n}\nelse\n{\n    // executes when none\
    \ of the above condition is true.\n}\n```\n\n### 示例\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\n\nint main ()\n{\n    // local variable declaration:\n\
    \    int a = 100;\n\n    // check the boolean condition\n    if( a == 10 )\n \
    \   {\n        // if condition is true then print the following\n        cout\
    \ << \"Value of a is 10\" << endl;\n    }\n    else if( a == 20 )\n    {\n   \
    \     // if else if condition is true\n        cout << \"Value of a is 20\" <<\
    \ endl;\n    }\n    else if( a == 30 )\n    {\n        // if else if condition\
    \ is true\n        cout << \"Value of a is 30\" << endl;\n    }\n    else\n  \
    \  {\n        // if none of the conditions is true\n        cout << \"Value of\
    \ a is not matching\" << endl;\n    }\n    cout << \"Exact value of a is : \"\
    \ << a << endl;\n\n    return 0;\n}\n```\n\n当上述代码被编译并执行时，会产生以下结果：\n\n```text\n\
    Value of a is not matching\nExact value of a is : 100\n```\n\n### Switch 语句\n\n\
    **switch** 语句允许一个变量与一系列值进行相等性测试。每个值称为一个 case，被切换的变量会针对每个 case 进行检查。\n\n### 语法\n\
    \n**switch** 语句在 C++ 中的语法如下：\n\n```cpp\nswitch(expression){\n    case constant-expression\
    \  :\n        statement(s);\n        break; //optional\n    case constant-expression\
    \ :\n        statement(s);\n        break; //optional\n\n    // you can have any\
    \ number of case statements.\n    default : //Optional\n        statement(s);\n\
    }\n```\n\n以下规则适用于 switch 语句：\n\n- 在 **switch** 语句中使用的 **expression** 必须具有整型或枚举类型，或是具有单个转换函数到整型或枚举类型的类类型。\n\
    - switch 中可以有任意数量的 case 语句。每个 case 后跟要比较的值和冒号。\n- case 的 **constant-expression**\
    \ 必须与 switch 中的变量具有相同的数据类型，并且必须是常量或字面量。\n- 当被切换的变量等于某个 case 时，将执行该 case 之后直到遇到\
    \ **break** 语句为止的语句。\n- 当遇到 break 语句时，switch 终止，控制流跳转到 switch 语句之后的下一行。\n- 并非每个\
    \ case 都需要包含 break。如果没有 break，控制流将 *fall through* 到后续的 case 直到遇到 break。\n- **switch**\
    \ 语句可以有一个可选的 **default** case，必须出现在 switch 的末尾。default case 可用于在没有任何 case 为真时执行任务。default\
    \ case 中不需要 break。\n\n### 流程图\n\n"
