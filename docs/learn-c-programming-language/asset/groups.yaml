    |---|---|

    | Boolean | bool |

    | Character | char |

    | Integer | int |

    | Floating point | float |

    | Double floating point | double |

    | Valueless | void |

    | Wide character | wchar_t |


    Several of the basic types can be modified using one or more of these type modifiers:


    +   - signed

    +   - unsigned

    +   - short

    +   - long'
