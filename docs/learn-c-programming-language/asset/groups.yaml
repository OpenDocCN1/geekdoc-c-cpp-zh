    \ **char** 类型变量中。\n\n字符字面量可以是普通字符（例如 'x'）、转义序列（例如 '\\t'）或通用字符（例如 '\\u02C0'）。\n\
    \n在 C++ 中，某些字符在前面加上反斜杠时会有特殊含义，用于表示换行（\\n）或制表符（\\t）等。这里列出了一些转义序列代码：\n\n| 转义序列 |\
