    \n```\n```cpp\nint * myFunction()\n{\n.\n.\n.\n}\n```\n```\n\n需要记住的第二点是，将局部变量的地址返回到函数外部并不是一个好主意，因此你必须将局部变量定义为\
    \ **静态变量**。\n\n现在，考虑以下函数，它将生成 10 个随机数并使用数组名返回它们，该数组名代表一个指针，即第一个数组元素的地址。\n\n```\n\
    ```cpp\n#include <iostream>\n\n#include <ctime>\n\nusing namespace std;\n\n//\
    \ function to generate and return random numbers.\nint * getRandom( )\n{\n   \
    \ static int  r[10];\n```\n\n```\n```cpp\n// set the seed\nsrand( (unsigned)time(\
    \ NULL ) );\nfor (int i = 0; i < 10; ++i)\n{\n    r[i] = rand();\n    cout <<\
