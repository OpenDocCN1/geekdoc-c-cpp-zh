  - "[PAGE 14]\n\n# 2. ENVIRONMENT SETUP\n\n# Try it Option Online\n\nYou really do\
    \ not need to set up your own environment to start learning C++ programming language.\
    \ Reason is very simple, we have already set up C++ Programming environment online,\
    \ so that you can compile and execute all the available examples online at the\
    \ same time when you are doing your theory work. This gives you confidence in\
    \ what you are reading and to check the result with different options. Feel free\
    \ to modify any example and execute it online.\n\nTry the following example using\
    \ our online compiler option available at [http://www.compileonline.com/](http://www.compileonline.com/)\n\
    \n```\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n\
    \    cout << \"Hello World\";\n    return 0;\n}\n```\n```\n\nFor most of the examples\
    \ given in this tutorial, you will find **Try it** option in our website code\
    \ sections at the top right corner that will take you to the online compiler.\
    \ So just make use of it and enjoy your learning.\n\n# Local Environment Setup\n\
    \nIf you are still willing to set up your environment for C++, you need to have\
    \ the following two softwares on your computer.\n\n# Text Editor:\n\nThis will\
    \ be used to type your program. Examples of few editors include Windows Notepad,\
    \ OS Edit command, Brief, Epsilon, EMACS, and vim or vi.\n\nName and version of\
    \ text editor can vary on different operating systems. For example, Notepad will\
    \ be used on Windows and vim or vi can be used on windows as well as Linux, or\
    \ UNIX.\n\nThe files you create with your editor are called source files and for\
    \ C++ they typically are named with the extension .cpp, .cp, or .c.\n\nA text\
    \ editor should be in place to start your C++ programming."
  - '[PAGE 15]


    # C++ Compiler:


    This is an actual C++ compiler, which will be used to compile your source code
    into final executable program.


    Most C++ compilers don''t care what extension you give to your source code, but
    if you don''t specify otherwise, many will use .cpp by default.


    Most frequently used and free available compiler is GNU C/C++ compiler, otherwise
    you can have compilers either from HP or Solaris if you have the respective Operating
    Systems.


    Installing GNU C/C++ Compiler:


    # UNIX/Linux Installation:


    If you are using **Linux** or **UNIX** then check whether GCC is installed on
    your system by entering the following command from the command line:


    ```

    ```bash

    $ g++ -v

    ```

    ```


    If you have installed GCC, then it should print a message such as the following:


    ```

    ```

    Using built-in specs.


    Target: i386-redhat-linux


    Configured with: ../configure --prefix=/usr .......


    Thread model: posix


    gcc version 4.1.2 20080704 (Red Hat 4.1.2-46)

    ```

    ```


    If GCC is not installed, then you will have to install it yourself using the detailed
    instructions available at http://gcc.gnu.org/install/ .


    # Mac OS X Installation:


    If you use Mac OS X, the easiest way to obtain GCC is to download the Xcode development
    environment from Apple''s website and follow the simple installation instructions.


    Xcode is currently available at developer.apple.com/technologies/tools/.


    # Windows Installation:


    To install GCC at Windows you need to install MinGW. To install MinGW, go to the
    MinGW homepage, www.mingw.org, and follow the link to the MinGW download page.
    Download the latest version of the MinGW installation program which should be
    named MinGW-<version>.exe.


    While installing MinGW, at a minimum, you must install gcc-core, gcc-g++, binutils,
    and the MinGW runtime, but you may wish to install more.'
