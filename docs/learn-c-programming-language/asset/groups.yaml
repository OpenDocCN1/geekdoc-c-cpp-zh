    \ to show a few escape sequence characters:\n\n```cpp\n#include <iostream>\n\n\
    using namespace std;\n\nint main()\n{\n    cout << \"Hello\\tWorld\\n\\n\";\n\
    \    return 0;\n}\n```\n\nWhen the above code is compiled and executed, it produces\
    \ the following result:\n\n```text\nHello   World\n```\n\n### String Literals\n\
    \nString literals are enclosed in double quotes. A string contains characters\
    \ that are similar to character literals: plain characters, escape sequences,\
    \ and universal characters.\n\nYou can break a long line into multiple lines using\
    \ string literals and separate them using whitespaces.\n\nHere are some examples\
    \ of string literals. All the three forms are identical strings.\n\n```cpp\n\"\
    hello, dear\"\n\n\"hello, \\\ndear\"\n\n\"hello, \" \"d\" \"ear\"\n```\n\n###\
    \ Defining Constants\n\nThere are two simple ways in C++ to define constants:\n\
    \n- Using **#define** preprocessor.\n- Using **const** keyword.\n\n### The #define\
    \ Preprocessor\n\nFollowing is the form to use #define preprocessor to define\
    \ a constant:\n\n```cpp\n#define identifier value\n```\n\nFollowing example explains\
    \ it in detail:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n#define\
    \ LENGTH 10\n#define WIDTH 5\n#define NEWLINE '\\n'\n\nint main()\n{\n    int\
    \ area;\n    area = LENGTH * WIDTH;\n```\n\n## 9. MODIFIER TYPES\n\nC++ allows\
    \ the **char, int, and double** data types to have modifiers preceding them. A\
    \ modifier is used to alter the meaning of the base type so that it more precisely\
    \ fits the needs of various situations.\n\nThe data type modifiers are listed\
    \ here:\n\n- signed\n- unsigned\n- long\n- short\n\nThe modifiers **signed, unsigned,\
    \ long, and short** can be applied to integer base types. In addition, **signed**\
    \ and **unsigned** can be applied to char, and **long** can be applied to double.\n\
    \nThe modifiers **signed** and **unsigned** can also be used as prefix to **long**\
    \ or **short** modifiers. For example, **unsigned long int**.\n\nC++ allows a\
    \ shorthand notation for declaring **unsigned, short,** or **long** integers.\
    \ You can simply use the word **unsigned, short,** or **long,** without **int**.\
    \ It automatically implies **int**. For example, the following two statements\
    \ both declare unsigned integer variables.\n\n```cpp\nunsigned x;\n\nunsigned\
    \ int y;\n```\n\nTo understand the difference between the way signed and unsigned\
    \ integer modifiers are interpreted by C++, you should run the following short\
    \ program:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n/* This program\
    \ shows the difference between\n * signed and unsigned integers.\n */\nint main()\n\
    {\n    short int i;          // a signed short integer\n    short unsigned int\
    \ j;  // an unsigned short integer\n\n    j = 50000;\n\n    i = j;\n    cout <<\
    \ i << \" \" << j;\n\n    return 0;\n}\n```\n\nWhen this program is run, following\
    \ is the output:\n\n```text\n-15536 50000\n```\n\nThe above result is because\
    \ the bit pattern that represents 50,000 as a short unsigned integer is interpreted\
    \ as -15,536 by a short.\n\n### Type Qualifiers in C++\n\nThe type qualifiers\
    \ provide additional information about the variables they precede.\n\n| Qualifier\
    \ | Meaning |\n|---|---|\n| const | Objects of type **const** cannot be changed\
    \ by your program during execution |\n| volatile | The modifier **volatile** tells\
    \ the compiler that a variable's value may be changed in ways not explicitly specified\
    \ by the program. |\n| restrict | A pointer qualified by **restrict** is initially\
    \ the only means by which the object it points to can be accessed. Only C99 adds\
    \ a new type qualifier called restrict. |\n"
