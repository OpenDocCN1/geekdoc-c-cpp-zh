    ```\n\nThe **malloc()** function from C, still exists in C++, but it is recommended\
    \ to avoid using malloc() function. The main advantage of new over malloc() is\
    \ that new doesn't just allocate memory, it constructs objects which is prime\
    \ purpose of C++.\n\nAt any point, when you feel a variable that has been dynamically\
    \ allocated is not anymore required, you can free up the memory that it occupies\
