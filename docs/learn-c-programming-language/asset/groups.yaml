    \ main( )\n{\n    char str[] = \"Unable to read....\";\n\n    cerr << \"Error\
    \ message : \" << str << endl;\n}\n```\n\n当上面的代码被编译并执行时，会产生以下结果：\n\n```text\n\
    Error message : Unable to read....\n```\n\n### 标准日志流（clog）\n\n预定义对象 **clog** 是\
    \ **ostream** 类的一个实例。clog 对象据说连接到标准错误设备，该设备也是显示屏，但 **clog** 对象是有缓冲的。这意味着每次向 clog\
    \ 插入流都可能导致其输出保存在缓冲区中，直到缓冲区填满或被刷新。\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main( )\n{\n    char str[] = \"Unable to read....\";\n\n    clog\
