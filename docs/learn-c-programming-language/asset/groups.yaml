    \ noted that defining 'register' does not mean that the variable will be stored\
    \ in a register. It means that it MIGHT be stored in a register depending on hardware\
    \ and implementation restrictions.\n\n### The static Storage Class\n\nThe **static**\
    \ storage class instructs the compiler to keep a local variable in existence during\
    \ the life-time of the program instead of creating and destroying it each time\
    \ it comes into and goes out of scope. Therefore, making local variables static\
    \ allows them to maintain their values between function calls.\n\nThe static modifier\
    \ may also be applied to global variables. When this is done, it causes that variable's\
