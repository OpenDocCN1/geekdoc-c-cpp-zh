    Address of var[0] = 0xbfa088b0\n\nValue of var[0] = 10\n\nAddress of var[1] =\
    \ 0xbfa088b4\n\nValue of var[1] = 100\n\nAddress of var[2] = 0xbfa088b8\n\nValue\
    \ of var[2] = 200\n```\n\n然而，指针和数组并不能完全互换。例如，请看下面的程序：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nconst int MAX = 3;\n\nint main ()\n{\n    int  var[MAX]\
    \ = {10, 100, 200};\n\n    for (int i = 0; i < MAX; i++)\n    {\n        *var\
    \ = i;   // This is a correct syntax\n\n        var++;      // This is incorrect.\n\
    \    }\n    return 0;\n}\n```\n\n对 `var` 应用指针运算符 `*` 是完全合法的，但修改 `var` 的值则是非法的。原因是\
    \ `var` 是一个指向数组首元素的常量，不能用作左值。\n\n由于数组名生成一个指针常量，只要不被修改，它就仍可用于指针风格的表达式。例如，下面这个为\
    \ `var[2]` 赋值为 500 的语句是有效的：\n\n```cpp\n*(var + 2) = 500;\n```\n\n上面的语句有效，并且会成功编译，因为\
    \ `var` 没有被修改。\n\n## 指针数组\n\n在理解指针数组的概念之前，先看下面的例子，它使用了一个包含 3 个整数的数组：\n\n```cpp\n\
