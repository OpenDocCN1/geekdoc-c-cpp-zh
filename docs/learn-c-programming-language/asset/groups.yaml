  - "[PAGE 207]\n\n# 25. OVERLOADING (OPERATOR & FUNCTION)\n\nC++ allows you to specify\
    \ more than one definition for a **function** name or an **operator** in the same\
    \ scope, which is called **function overloading** and **operator overloading**\
    \ respectively.\n\nAn overloaded declaration is a declaration that is declared\
    \ with the same name as a previously declared declaration in the same scope, except\
    \ that both declarations have different arguments and obviously different definition\
    \ (implementation).\n\nWhen you call an overloaded **function** or **operator**,\
    \ the compiler determines the most appropriate definition to use, by comparing\
    \ the argument types you have used to call the function or operator with the parameter\
    \ types specified in the definitions. The process of selecting the most appropriate\
    \ overloaded function or operator is called **overload resolution**.\n\n# Function\
    \ Overloading in C++\n\nYou can have multiple definitions for the same function\
    \ name in the same scope. The definition of the function must differ from each\
    \ other by the types and/or the number of arguments in the argument list. You\
    \ cannot overload function declarations that differ only by return type.\n\nFollowing\
    \ is the example where same function **print()** is being used to print different\
    \ data types:\n\n```\n#include <iostream>\n\nusing namespace std;\n\nclass printData\n\
    {\n    public:\n        void print(int i) {\n            cout << \"Printing int:\
    \ \" << i << endl;\n        }\n\n        void print(double f) {\n            cout\
    \ << \"Printing float: \" << f << endl;\n        }\n}\n```"
