    ```text\nError message : Unable to read....\n```\n\n在这些小例子中，你无法看到 cout、cerr 和\
    \ clog 之间的任何差异，但在编写和执行大型程序时，差异会变得明显。因此，好的做法是使用 cerr 流显示错误消息，而在显示其他日志消息时则应使用 clog。\n\
    \n"
