    \ to define the local variable as **static variable**.\n\nNow, consider the following\
    \ function, which will generate 10 random numbers and return them using an array\
    \ name which represents a pointer i.e., address of first array element.\n\n```\n\
    ```cpp\n#include <iostream>\n\n#include <ctime>\n\nusing namespace std;\n\n//\
