    ## Pointer to a Pointer\n\nA pointer to a pointer is a form of multiple indirection\
    \ or a chain of pointers. Normally, a pointer contains the address of a variable.\
    \ When we define a pointer to a pointer, the first pointer contains the address\
    \ of the second pointer, which points to the location that contains the actual\
    \ value as shown below.\n\n![](img/7976f323fd1a5c8774f95fbf029a106f_139_0.png)\n\
    \nA variable that is a pointer to a pointer must be declared as such. This is\
    \ done by placing an additional asterisk in front of its name. For example, following\
    \ is the declaration to declare a pointer to a pointer of type int:\n\n```cpp\n\
    int **var;\n```\n"
  mdcn: "\n\n按照惯例，如果指针包含空（零）值，则它被认为不指向任何内容。\n\n要检查空指针，可以使用如下所示的 `if` 语句：\n\n```cpp\n\
    if(ptr)    // succeeds if p is not null\n\nif(!ptr)   // succeeds if p is null\n\
    ```\n\n因此，如果所有未使用的指针都被赋予空值，并且你避免使用空指针，就可以避免意外误用未初始化的指针。很多时候，未初始化的变量会持有一些垃圾值，这会使程序调试变得困难。\n\
    \n## 指针算术\n\n正如你所了解的，指针是一个地址，而地址是数值；因此，你可以像对数值进行算术运算一样，对指针执行算术运算。有四个算术运算符可用于指针：`++`、`--`、`+`\
    \ 和 `-`。\n\n为了理解指针算术，假设 **ptr** 是一个整型指针，指向地址 1000。假设整数为 32 位，让我们对指针执行以下算术运算：\n\
    \n```cpp\nptr++\n```\n\n**ptr** 将指向位置 1004，因为每次 `ptr` 递增时，它都会指向下一个整数。此操作会将指针移动到下一个内存位置，而不会影响该内存位置上的实际值。如果\
    \ `ptr` 指向一个字符，其地址为 1000，那么上述操作将指向位置 1001，因为下一个字符将在 1001 处可用。\n\n## 递增指针\n\n在程序中，我们更倾向于使用指针而不是数组，因为变量指针可以递增，而数组名不能递增，因为它是一个常量指针。下面的程序通过递增变量指针来访问数组的每一个连续元素：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nconst int MAX = 3;\n\n\
    int main ()\n{\n    int var[MAX] = {10, 100, 200};\n    int *ptr;\n\n    // let\
    \ us have array address in pointer.\n    ptr = var;\n    for (int i = 0; i < MAX;\
    \ i++)\n    {\n        cout << \"Address of var[\" << i << \"] = \";\n       \
    \ cout << ptr << endl;\n\n        cout << \"Value of var[\" << i << \"] = \";\n\
    \        cout << *ptr << endl;\n\n        // point to the next location\n    \
    \    ptr++;\n    }\n    return 0;\n}\n```\n\n编译并执行上述代码后，会产生类似以下的结果：\n\n```text\n\
    Address of var[0] = 0xbfa088b0\nValue of var[0] = 10\nAddress of var[1] = 0xbfa088b4\n\
    Value of var[1] = 100\nAddress of var[2] = 0xbfa088b8\nValue of var[2] = 200\n\
    ```\n\n## 递减指针\n\n递减指针也适用同样的考虑，指针按其所指数据类型的字节数减少其值，如下所示：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nconst int MAX = 3;\n\nint main ()\n{\n    int var[MAX]\
    \ = {10, 100, 200};\n    int *ptr;\n\n    // let us have address of the last element\
    \ in pointer.\n    ptr = &var[MAX-1];\n    for (int i = MAX; i > 0; i--)\n   \
    \ {\n        cout << \"Address of var[\" << i << \"] = \";\n        cout << ptr\
    \ << endl;\n\n        cout << \"Value of var[\" << i << \"] = \";\n        cout\
    \ << *ptr << endl;\n\n        // point to the previous location\n        ptr--;\n\
    \    }\n    return 0;\n}\n```\n\n编译并执行上述代码后，会产生类似以下的结果：\n\n```text\nAddress of\
    \ var[3] = 0xbfdb70f8\nValue of var[3] = 200\nAddress of var[2] = 0xbfdb70f4\n\
    Value of var[2] = 100\nAddress of var[1] = 0xbfdb70f0\nValue of var[1] = 10\n\
    ```\n\n## 指针比较\n\n指针可以使用关系运算符（如 `==`、`<` 和 `>`）进行比较。如果 `p1` 和 `p2` 指向彼此相关的变量，例如同一数组中的元素，那么\
    \ `p1` 和 `p2` 的比较是有意义的。\n\n下面的程序修改了前面的示例，只要变量指针指向的地址小于或等于数组最后一个元素的地址（即 `&var[MAX\
    \ - 1]`），就继续递增该指针：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    const int MAX = 3;\n\nint main ()\n{\n    int  var[MAX] = {10, 100, 200};\n  \
    \  int *ptr;\n\n    // let us have address of the first element in pointer.\n\
    \    ptr = var;\n    int i = 0;\n    while ( ptr <= &var[MAX - 1] )\n    {\n \
    \       cout << \"Address of var[\" << i << \"] = \";\n        cout << ptr <<\
    \ endl;\n\n        cout << \"Value of var[\" << i << \"] = \";\n        cout <<\
    \ *ptr << endl;\n\n        // point to the next location\n        ptr++;\n   \
    \     i++;\n    }\n    return 0;\n}\n```\n\n编译并执行上述代码后，会产生类似以下的结果：\n\n```text\n\
    Address of var[0] = 0xbfce42d0\n\nValue of var[0] = 10\n\nAddress of var[1] =\
    \ 0xbfce42d4\n\nValue of var[1] = 100\n\nAddress of var[2] = 0xbfce42d8\n\nValue\
    \ of var[2] = 200\n```\n\n## 指针与数组\n\n指针和数组关系密切。实际上，在许多情况下，指针和数组是可以互换的。例如，指向数组首元素的指针既可以使用指针算术，也可以使用数组风格的下标来访问该数组。请看下面的程序：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nconst int MAX = 3;\n\n\
    int main ()\n{\n    int var[MAX] = {10, 100, 200};\n    int *ptr;\n\n    // let\
