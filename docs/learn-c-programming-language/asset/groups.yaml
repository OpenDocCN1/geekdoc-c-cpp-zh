    \n### 全局变量\n\n全局变量在所有函数之外定义，通常位于程序顶部。全局变量将在程序的整个生命周期内保持其值。\n\n任何函数都可以访问全局变量。也就是说，在其声明之后，全局变量可在整个程序中使用。以下是使用全局变量和局部变量的示例：\n\
