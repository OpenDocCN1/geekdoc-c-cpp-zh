    \ **tm** 结构的指针。 |\n| 4 | **clock_t clock(void);**<br><br>该函数返回一个近似表示调用程序已运行时间的值。如果时间不可用，则返回\
    \ -1。 |\n| 5 | **char * asctime ( const struct tm * time );**<br><br>该函数返回一个指向字符串的指针，该字符串包含\
