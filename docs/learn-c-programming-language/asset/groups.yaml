  - '[PAGE 296]


    Now you must have understood the basic concept of CGI and you can write many complicated
    CGI programs using Python. A C++ CGI program can interact with any other external
    system, such as RDBMS, to exchange information.


    # HTTP Header


    The line **Content-type:text/html\\r\\n\\r\\n** is a part of HTTP header, which
    is sent to the browser to understand the content. All the HTTP header will be
    in the following form:


    ```

    HTTP Field Name: Field Content


    For Example

    Content-type: text/html\\r\\n\\r\\n

    ```


    There are few other important HTTP headers, which you will use frequently in your
    CGI Programming.


    | Header | Description |

    |---|---|

    | Content-type: | A MIME string defining the format of the file being returned.
    Example is Content-type:text/html. |

    | Expires: Date | The date the information becomes invalid. This should be used
    by the browser to decide when a page needs to be refreshed. A valid date string
    should be in the format 01 Jan 1998 12:00:00 GMT. |

    | Location: URL | The URL that should be returned instead of the URL requested.
    You can use this field to redirect a request to any file. |

    | Last-modified: Date | The date of last modification of the resource. |

    | Content-length: N | The length, in bytes, of the data being returned. The browser
    uses this value to report the estimated download time for a file. |

    | Set-Cookie: String | Set the cookie passed through the *string*. |


    # CGI Environment Variables


    All the CGI program will have access to the following environment variables. These
    variables play an important role while writing any CGI program.'
