    \ `a.out` 可执行文件。\n5. 现在输入 `a.out` 来运行程序。\n6. 你将能够在窗口中看到打印出的“Hello World”。\n\n\
    ```text\n$ g++ hello.cpp\n$ ./a.out\n\nHello World\n```\n\n请确保 `g++` 在你的 PATH\
    \ 中，并且你正在包含文件 `hello.cpp` 的目录中运行它。\n\n你可以使用 makefile 编译 C/C++ 程序。更多详细信息，请查看我们的“Makefile\
    \ 教程”。\n\n### C++ 中的分号与代码块\n\n在 C++ 中，分号是语句终止符。也就是说，每条独立的语句都必须以分号结束。它表示一个逻辑实体的结束。\n\
    \n例如，下面是三条不同的语句：\n\n```cpp\nx = y;\ny = y+1;\nadd(x, y);\n```\n\n代码块是由左、右花括号包围的一组逻辑相关的语句。例如：\n\
    \n```cpp\n{\n    cout << \"Hello World\"; // prints Hello World\n    return 0;\n\
    }\n```\n\nC++ 不把行尾视为终止符。因此，语句在一行中的位置并不重要。例如：\n\n```cpp\nx = y;\ny = y+1;\nadd(x,\
    \ y);\n```\n\n与下面的写法是一样的：\n\n```cpp\nx = y; y = y+1; add(x, y);\n```\n\n### C++\
    \ 标识符\n\nC++ 标识符是用于标识变量、函数、类、模块或任何其他用户自定义项的名称。标识符以字母 A 到 Z、a 到 z 或下划线（`_`）开头，后面可以跟零个或多个字母、下划线和数字（0\
    \ 到 9）。\n\nC++ 不允许在标识符中使用 `@`、`$` 和 `%` 等标点字符。C++ 是一种区分大小写的编程语言。因此，**Manpower**\
    \ 和 **manpower** 在 C++ 中是两个不同的标识符。\n\n以下是一些可接受的标识符示例：\n\n| mohd | zara | abc |\
    \ move_name | a_123 |\n| --- | --- | --- | --- | --- |\n| myname50 | _temp | j\
    \ | a23b9 | retVal |\n\n### C++ 关键字\n\n以下列表显示了 C++ 中的保留字。这些保留字不能用作常量、变量或任何其他标识符名称。\n\
    \n| asm | else | new | this |\n| --- | --- | --- | --- |\n| auto | enum | operator\
    \ | throw |\n| bool | explicit | private | true |\n| break | export | protected\
    \ | try |\n| case | extern | public | typedef |\n| catch | false | register |\
    \ typeid |\n| char | float | reinterpret_cast | typename |\n| class | for | return\
    \ | union |\n| const | friend | short | unsigned |\n| const_cast | goto | signed\
    \ | using |\n| continue | if | sizeof | virtual |\n| default | inline | static\
    \ | void |\n| delete | int | static_cast | volatile |\n| do | long | struct |\
    \ wchar_t |\n| double | mutable | switch | while |\n| dynamic_cast | namespace\
    \ | template | |\n\n### 三字符组\n\n一些字符具有一种替代表示形式，称为三字符组序列。三字符组是由三个字符组成的序列，代表单个字符，且该序列总是以两个问号开头。\n\
    \n三字符组在它们出现的任何地方都会被展开，包括字符串字面量、字符字面量、注释以及预处理指令中。\n\n以下是最常用的三字符组序列：\n\n| 三字符组 |\
    \ 替换为 |\n| --- | --- |\n| `??=` | `#` |\n| `??/` | `\\` |\n| `??'` | `^` |\n|\
    \ `??(` | `[` |\n| `??)` | `]` |\n| `??!` | `\\|` |\n| `??<` | `{` |\n| `??>`\
    \ | `}` |\n| `??-` | `~` |\n\n并非所有编译器都支持三字符组，而且由于它们容易令人困惑，不建议使用它们。\n\n### C++\
    \ 中的空白\n\n只包含空白（可能还带有注释）的行称为空行，C++ 编译器会完全忽略它。\n\n在 C++ 中，空白是用于描述空格、制表符、换行符和注释的术语。空白将语句的一部分与另一部分分隔开，使编译器能够识别语句中的某个元素（例如\
    \ `int`）在哪里结束，下一个元素从哪里开始。\n\n语句 1：\n\n```cpp\nint age;\n```\n\n在上述语句中，`int` 和\
    \ `age` 之间必须至少有一个空白字符（通常是一个空格），编译器才能区分它们。\n\n语句 2：\n\n```cpp\nfruit = apples +\
    \ oranges;    // Get the total fruit\n```\n\n在上面语句 2 中，`fruit` 与 `=` 之间，或 `=`\
    \ 与 `apples` 之间，不需要空白字符；当然，如果你希望提高可读性，也可以随意添加一些。\n\n## 4. C++ 中的注释\n\n程序注释是你可以包含在\
    \ C++ 代码中的解释性语句。这些注释有助于阅读源代码的人。所有编程语言都允许某种形式的注释。\n\nC++ 支持单行注释和多行注释。任何注释中的所有字符都会被\
    \ C++ 编译器忽略。\n\nC++ 注释以 `/*` 开头，以 `*/` 结尾。例如：\n\n```cpp\n/* This is a comment\
    \ */\n\n/* C++ comments can also\n * span multiple lines\n */\n```\n\n注释也可以以 `//`\
    \ 开头，一直延伸到行尾。例如：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nmain()\n\
    {\n    cout << \"Hello World\"; // prints Hello World\n\n    return 0;\n}\n```\n\
    \n当上述代码被编译时，编译器会忽略 `// prints Hello World`，最终生成的可执行文件将产生以下结果：\n\n```text\nHello\
    \ World\n```\n\n在 `/*` 和 `*/` 注释中，`//` 字符没有特殊含义。在 `//` 注释中，`/*` 和 `*/` 也没有特殊含义。因此，你可以将一种注释“嵌套”在另一种注释中。例如：\n\
    \n```cpp\n/* Comment out printing of Hello World:\n```\n\n"
