    \n外部应用程序提供的功能（即公共函数）在抽象基类中作为纯虚函数提供。这些纯虚函数的实现则在对应于应用程序特定类型的派生类中提供。\n\n这种架构还允许在系统定义之后轻松地向系统添加新的应用程序。\n\
    \n| 选项 | 说明 |\n|---|---|\n| `ios::app` | 追加模式。所有对该文件的输出都将追加到文件末尾。 |\n| `ios::ate`\
    \ | 打开文件进行输出，并将读/写控制移到文件末尾。 |\n| `ios::in` | 打开文件用于读取。 |\n| `ios::out` | 打开文件用于写入。\
    \ |\n| `ios::trunc` | 如果文件已存在，则在打开文件前将其内容截断。 |\n\n你可以通过**OR**运算将两个或多个这些值组合在一起。例如，如果要以写入模式打开文件，并且希望在该文件已存在时将其截断，语法如下：\n\
    \n```\nofstream outfile;\noutfile.open(\"file.dat\", ios::out | ios::trunc );\n\
    ```\n\n类似地，你可以按如下方式打开一个文件用于读取和写入：\n\n```\nfstream  afile;\nafile.open(\"file.dat\"\
    , ios::out | ios::in );\n```\n\n## 关闭文件\n\n当 C++ 程序终止时，它会自动刷新所有流、释放所有已分配的内存并关闭所有已打开的文件。但程序员最好在程序终止前关闭所有已打开的文件，这始终是一个良好实践。\n\
    \n以下是 close() 函数的标准语法，它是 fstream、ifstream 和 ofstream 对象的成员。\n\n```\nvoid close();\n\
    ```\n\n## 写入文件\n\n在进行 C++ 编程时，你可以使用流插入运算符 (<<) 将信息从程序写入文件，就像使用该运算符将信息输出到屏幕一样。唯一的区别是你使用\
    \ **ofstream** 或 **fstream** 对象而不是 **cout** 对象。\n\n## 从文件读取\n\n```\n// close the\
    \ opened file.\noutfile.close();\n\n// open a file in read mode.\nifstream infile;\n\
    \ninfile.open(\"afile.dat\");\n\ncout << \"Reading from the file\" << endl;\n\
    infile >> data;\n\n// write the data at the screen.\ncout << data << endl;\n\n\
    // again read the data from the file and display it.\ninfile >> data;\ncout <<\
    \ data << endl;\n\n// close the opened file.\ninfile.close();\n\n    return 0;\n\
    }\n```\n\n当上述代码被编译并执行时，会产生以下示例输入和输出：\n\n```\n$./a.out\n\nWriting to the file\n\
    \nEnter your name: Zara\n\nEnter your age: 9\n\nReading from the file\n\nZara\n\
    \n9\n```\n\n以上示例使用了 cin 对象的一些附加函数，如 getline() 函数用于从外部读取一行，以及 ignore() 函数用于忽略先前读取语句留下的多余字符。\n\
    \n## 文件位置指针\n\n**istream** 和 **ostream** 都提供了用于重新定位文件位置指针的成员函数。这些成员函数分别是 istream\
    \ 的 **seekg**（“seek get”）和 ostream 的 **seekp**（“seek put”）。\n\nseekg 和 seekp 的参数通常是一个长整数。可以指定第二个参数来表示查找方向。查找方向可以是\
    \ **ios::beg**（默认值），用于相对于流的开头定位；**ios::cur** 用于相对于流中的当前位置定位；或者 **ios::end** 用于相对于流的末尾定位。\n\
    \n文件位置指针是一个整数值，用于指定文件中的位置，以距文件起始位置的字节数表示。以下是一些定位“get”文件位置指针的示例：\n\n```cpp\n//\
    \ position to the nth byte of fileObject (assumes ios::beg)\nfileObject.seekg(\
    \ n );\n\n// position n bytes forward in fileObject\nfileObject.seekg( n, ios::cur\
    \ );\n\n// position n bytes back from end of fileObject\nfileObject.seekg( n,\
    \ ios::end );\n\n// position at end of fileObject\nfileObject.seekg( 0, ios::end\
    \ );\n```\n\n```cpp\n{\n    // code to handle any exception\n}\n```\n\n下面是一个示例，它抛出一个除以零的异常，并在\
    \ catch 块中捕获它。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\ndouble\
    \ division(int a, int b)\n{\n    if( b == 0 )\n    {\n        throw \"Division\
    \ by zero condition!\";\n    }\n    return (a/b);\n}\n\nint main ()\n{\n    int\
    \ x = 50;\n    int y = 0;\n    double z = 0;\n\n    try {\n        z = division(x,\
    \ y);\n        cout << z << endl;\n    }catch (const char* msg) {\n        cerr\
    \ << msg << endl;\n    }\n\n    return 0;\n}\n```\n\n因为我们抛出的异常类型是 **const char***，所以在捕获此异常时，必须在\
    \ catch 块中使用 const char*。如果我们编译并运行上述代码，将产生以下结果：\n\n```\nDivision by zero condition!\n\
    ```\n\n## C++ 标准异常\n\nC++ 提供了定义在 **<exception>** 中的一系列标准异常，我们可以在程序中使用它们。这些异常按父子类层次结构排列，如下所示：\n\
    \n![](img/7976f323fd1a5c8774f95fbf029a106f_257_0.png)\n\n以下是上述层次结构中提到的每个异常的简要说明：\n\
    \n| 异常 | 描述 |\n|---|---|\n| std::exception | 异常，也是所有标准 C++ 异常的父类。 |\n\n| 异常 |\
    \ 描述 |\n|---|---|\n| `std::bad_alloc` | 这可以由 new 抛出。 |\n| `std::bad_cast` | 这可以由\
    \ dynamic_cast 抛出。 |\n| `std::bad_exception` | 这是一种在 C++ 程序中处理意外异常的有用机制。 |\n|\
    \ `std::bad_typeid` | 这可以由 typeid 抛出。 |\n| `std::logic_error` | 一种理论上可以通过阅读代码检测到的异常。\
    \ |\n| `std::domain_error` | 当使用数学上无效的定义域时，抛出此异常。 |\n| `std::invalid_argument`\
    \ | 由于无效参数而抛出。 |\n| `std::length_error` | 当创建过大的 std::string 时抛出此异常。 |\n| `std::out_of_range`\
    \ | 这可以由“at”方法抛出，例如 std::vector 和 std::bitset<> ::operator[]()。 |\n| `std::runtime_error`\
    \ | 一种理论上无法通过阅读代码检测到的异常。 |\n| `std::overflow_error` | 如果发生数学上溢，则抛出此异常。 |\n| `std::range_error`\
    \ | 当你尝试存储超出范围的值时，会发生此异常。 |\n| `std::underflow_error` | 如果发生数学下溢，则抛出此异常。 |\n\n\
    ## 定义新异常\n\n你可以通过继承和重写 **exception** 类的功能来定义自己的异常。以下示例演示了如何以标准方式使用 std::exception\
    \ 类来实现自己的异常：\n\n```cpp\n#include <iostream>\n\n#include <exception>\n\nusing namespace\
    \ std;\n```\n\n```cpp\nstruct MyException : public exception\n{\n    const char\
    \ * what () const throw ()\n    {\n        return \"C++ Exception\";\n    }\n\
    };\n\nint main()\n{\n    try\n    {\n        throw MyException();\n    }\n   \
    \ catch(MyException& e)\n    {\n        std::cout << \"MyException caught\" <<\
    \ std::endl;\n        std::cout << e.what() << std::endl;\n    }\n    catch(std::exception&\
    \ e)\n    {\n        //Other errors\n    }\n}\n```\n\n这将产生以下结果：\n\n```\nMyException\
    \ caught\n\nC++ Exception\n```\n\n这里，**what()** 是 exception 类提供的公共方法，并且已被所有子异常类重写。它返回异常的原因。\n\
    \n"
