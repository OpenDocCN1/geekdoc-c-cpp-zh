    \n变量定义告诉编译器在何处以及为变量创建多少存储空间。变量定义指定数据类型，并包含一个或多个该类型的变量列表，如下所示：\n\n```cpp\ntype\
    \ variable_list;\n```\n\n这里，**type** 必须是有效的 C++ 数据类型，包括 char、wchar_t、int、float、double、bool\
    \ 或任何用户定义对象等，而 **variable_list** 可能由一个或多个用逗号分隔的标识符名称组成。以下是一些有效的声明：\n\n```cpp\n\
    int   i, j, k;\n\nchar  c, ch;\n\nfloat f, salary;\n\ndouble d;\n```\n\n行 **int\
    \ i, j, k;** 同时声明并定义了变量 i、j 和 k；它指示编译器创建名为 i、j 和 k 的 int 类型变量。\n\n变量可以在其声明中初始化（赋予初始值）。初始化器由等号后跟常量表达式组成，如下所示：\n\
    \n```cpp\ntype variable_name = value;\n```\n\n一些示例是：\n\n```cpp\nextern int d =\
    \ 3, f = 5;    // declaration of d and f.\nint d = 3, f = 5;             // definition\
    \ and initializing d and f.\nbyte z = 22;                 // definition and initializes\
    \ z.\nchar x = 'x';                // the variable x has the value 'x'.\n```\n\
    \n对于没有初始化器的定义：具有静态存储期的变量隐式初始化为 NULL（所有字节的值为 0）；所有其他变量的初始值未定义。\n\n### C++ 中的变量声明\n\
    \n变量声明向编译器保证存在具有给定类型和名称的变量，以便编译器可以在不需要变量完整细节的情况下继续编译。变量声明仅在编译时有意义，编译器在程序链接时需要实际的变量声明。\n\
    \n当你使用多个文件并且在其中一个文件中定义变量，该变量将在程序链接时可用时，变量声明很有用。你将使用 **extern** 关键字在任何位置声明变量。你可以在\
    \ C++ 程序中多次声明变量，但在文件、函数或代码块中只能定义一次。\n\n**Example:**\n\n尝试以下示例，其中变量已在顶部声明，但在 main\
    \ 函数中定义：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// Variable\
    \ declaration:\nextern int a, b;\nextern int c;\nextern float f;\n\nint main ()\n\
