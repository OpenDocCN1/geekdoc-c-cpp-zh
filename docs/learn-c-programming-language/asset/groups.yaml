  - "[PAGE 311]\n\n+   - **Domain:** This is the domain name of your site.\n+   -\
    \ **Path:** This is the path to the directory or web page that sets the cookie.\
    \ This may be blank if you want to retrieve the cookie from any directory or page.\n\
    +   - **Secure:** If this field contains the word \"secure\" then the cookie may\
    \ only be retrieved with a secure server. If this field is blank, no such restriction\
    \ exists.\n+   - **Name=Value:** Cookies are set and retrieved in the form of\
    \ key and value pairs.\n\n# Setting up Cookies\n\nIt is very easy to send cookies\
    \ to browser. These cookies will be sent along with HTTP Header before the Content-type\
    \ filed. Assuming you want to set UserID and Password as cookies. So cookies setting\
    \ will be done as follows:\n\n```\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main ()\n{\n    cout << \"Set-Cookie:UserID=XYZ;\\r\\n\";\n    cout\
    \ << \"Set-Cookie:Password=XYZ123;\\r\\n\";\n    cout << \"Set-Cookie:Domain=www.tutorialspoint.com;\\\
    r\\n\";\n    cout << \"Set-Cookie:Path=/perl;\\n\";\n    cout << \"Content-type:text/html\\\
