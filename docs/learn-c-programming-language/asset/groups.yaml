    n\\n\";\n    return 0;\n}\n```\n\n当上述代码被编译和执行时，会产生以下结果：\n\n```text\nHello   World\n\
    ```\n\n### 字符串字面量\n\n字符串字面量用双引号括起来。字符串包含与字符字面量相似的字符：普通字符、转义序列和通用字符。\n\n你可以使用字符串字面量将长行拆分为多行，并用空白分隔。\n\
