    \    {\n        cout << \"Value of var[\" << i << \"] = \";\n        cout << var[i]\
    \ << endl;\n    }\n    return 0;\n}\n```\n\n编译并执行上述代码后，会产生以下结果：\n\n```text\nValue\
    \ of var[0] = 10\n\nValue of var[1] = 100\n\nValue of var[2] = 200\n```\n\n有时候，我们可能需要维护一个数组，该数组可以存储指向\
    \ `int`、`char` 或任何其他可用数据类型的指针。下面是一个指向整数的指针数组的声明：\n\n```cpp\nint *ptr[MAX];\n```\n\
    \n这条语句将 `ptr` 声明为包含 `MAX` 个整型指针的数组。因此，`ptr` 中的每个元素现在都持有一个指向 `int` 值的指针。下面的示例使用了三个整数，它们将按如下方式存储在一个指针数组中：\n\
    \n```cpp\n#include <iostream>\n```\n\n```cpp\nchar *names[MAX] = {\n         \
    \       \"Zara Ali\",\n                \"Hina Ali\",\n                \"Nuha Ali\"\
    ,\n                \"Sara Ali\",\n};\n\nfor (int i = 0; i < MAX; i++)\n{\n   \
    \ cout << \"Value of names[\" << i << \"] = \";\n    cout << names[i] << endl;\n\
    }\nreturn 0;\n}\n```\n\n编译并执行上述代码后，会产生以下结果：\n\n```text\nValue of names[0] = Zara\
    \ Ali\n\nValue of names[1] = Hina Ali\n\nValue of names[2] = Nuha Ali\n\nValue\
    \ of names[3] = Sara Ali\n```\n\n## 指向指针的指针\n\n指向指针的指针是一种多重间接引用形式，也就是一条指针链。通常，指针包含一个变量的地址。当我们定义一个指向指针的指针时，第一个指针包含第二个指针的地址，而第二个指针指向包含实际值的位置，如下图所示。\n\
    \n![](img/7976f323fd1a5c8774f95fbf029a106f_139_0.png)\n\n指向指针的指针变量必须这样声明：在其名称前多加一个星号。例如，下面是一个声明\
    \ `int` 型指针的指针的示例：\n\n```cpp\nint **var;\n```\n\n"
