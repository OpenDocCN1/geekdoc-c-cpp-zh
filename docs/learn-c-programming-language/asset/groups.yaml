    \n    cout << \"Content-type:text/html\\r\\n\\r\\n\";\n    cout << \"<html>\\\
    n\";\n    cout << \"<head>\\n\";\n    cout << \"<title>Using GET and POST Methods</title>\\\
    n\";\n    cout << \"</head>\\n\";\n    cout << \"<body>\\n\";\n```\n\n"
