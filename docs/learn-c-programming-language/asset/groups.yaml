    ```cpp

    type variable_list;

    ```

    ```


    Here, **type** must be a valid C++ data type including char, w_char, int, float,
    double, bool or any user-defined object, etc., and **variable_list** may consist
    of one or more identifier names separated by commas. Some valid declarations are
    shown here:


    ```

    ```cpp

    int   i, j, k;


    char  c, ch;


    float f, salary;


    double d;

    ```

    ```


    The line **int i, j, k;** both declares and defines the variables i, j and k;
    which instructs the compiler to create variables named i, j and k of type int.


    Variables can be initialized (assigned an initial value) in their declaration.
    The initializer consists of an equal sign followed by a constant expression as
    follows:


    ```

    ```cpp

    type variable_name = value;

    ```

    ```


    Some examples are:


    ```

    ```cpp

    extern int d = 3, f = 5;    // declaration of d and f.

    int d = 3, f = 5;             // definition and initializing d and f.

    byte z = 22;                 // definition and initializes z.

    char x = ''x'';                // the variable x has the value ''x''.

    ```

    ```


    For definition without an initializer: variables with static storage duration
    are implicitly initialized with NULL (all bytes have the value 0); the initial
    value of all other variables is undefined.


    # Variable Declaration in C++


    A variable declaration provides assurance to the compiler that there is one variable
    existing with the given type and name so that compiler proceed for further compilation
    without needing complete detail about the variable. A variable declaration has
    its meaning at the time of compilation only, compiler needs actual variable declaration
    at the time of linking of the program.


    A variable declaration is useful when you are using multiple files and you define
    your variable in one of the files which will be available at the time of linking
    of the program. You will use **extern** keyword to declare a variable at any place.
    Though you can declare a variable multiple times in your C++ program, but it can
    be defined only once in a file, a function or a block of code.


