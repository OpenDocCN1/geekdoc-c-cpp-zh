    \nC++ 允许 **char, int, 和 double** 数据类型在其前面有修饰符。一个修饰符用于改变基本类型的含义，使其更精确地满足各种情况的需求。\n\
    \n数据类型修饰符列在这里：\n\n- signed\n- unsigned\n- long\n- short\n\n修饰符 **signed, unsigned,\
    \ long, 和 short** 可以应用于整数基本类型。此外，**signed** 和 **unsigned** 可以应用于 char，**long**\
    \ 可以应用于 double。\n\n修饰符 **signed** 和 **unsigned** 也可以用作 **long** 或 **short** 修饰符的前缀。例如，**unsigned\
    \ long int**。\n\nC++ 允许声明 **unsigned, short,** 或 **long** 整数的简写符号。你可以简单地使用 **unsigned,\
    \ short,** 或 **long**，而无需 **int**。它自动隐含 **int**。例如，以下两个语句都声明了无符号整数变量。\n\n```cpp\n\
    unsigned x;\n\nunsigned int y;\n```\n\n要理解 C++ 如何解释有符号和无符号整数修饰符之间的差异，你应该运行以下简短程序：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\n/* This program shows\
    \ the difference between\n * signed and unsigned integers.\n */\nint main()\n\
