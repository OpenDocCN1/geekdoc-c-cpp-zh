    ```\n\n## 5. 数据类型\n\n在任何语言中编写程序时，你需要使用各种变量来存储各种信息。变量只不过是存储值的保留内存位置。这意味着当你创建一个变量时，你在内存中保留了一些空间。\n\
    \n你可能想要存储各种数据类型的信息，如字符、宽字符、整数、浮点数、双精度浮点数、布尔值等。根据变量的数据类型，操作系统会分配内存并决定保留内存中可以存储什么。\n\
    \n### 原始内置类型\n\nC++ 为程序员提供了丰富的内置以及用户定义的数据类型。以下表格列出了七种基本 C++ 数据类型：\n\n| Type |\
    \ Keyword |\n|---|---|\n| Boolean | bool |\n| Character | char |\n| Integer |\
    \ int |\n| Floating point | float |\n| Double floating point | double |\n| Valueless\
    \ | void |\n| Wide character | wchar_t |\n\n其中一些基本类型可以使用以下一种或多种类型修饰符进行修改：\n\n\
    - signed\n- unsigned\n- short\n- long\n\n以下是示例，它将在你的计算机上产生各种数据类型的正确大小。\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout << \"Size\
    \ of char : \" << sizeof(char) << endl;\n    cout << \"Size of int : \" << sizeof(int)\
    \ << endl;\n    cout << \"Size of short int : \" << sizeof(short int) << endl;\n\
    \    cout << \"Size of long int : \" << sizeof(long int) << endl;\n    cout <<\
    \ \"Size of float : \" << sizeof(float) << endl;\n    cout << \"Size of double\
    \ : \" << sizeof(double) << endl;\n    cout << \"Size of wchar_t : \" << sizeof(wchar_t)\
    \ << endl;\n    return 0;\n}\n```\n\n此示例使用了 **endl**，它在每行后插入换行字符，并且 << 运算符用于将多个值传递到屏幕。我们还使用\
    \ **sizeof()** 函数来获取各种数据类型的大小。\n\n当上述代码被编译和执行时，它会产生以下结果，结果会因机器而异：\n\n```\nSize\
    \ of char : 1\n\nSize of int : 4\n\nSize of short int : 2\n\nSize of long int\
    \ : 4\n\nSize of float : 4\n\nSize of double : 8\n\nSize of wchar_t : 4\n```\n\
    \n### typedef 声明\n\n你可以使用 **typedef** 为现有类型创建一个新名称。以下是使用 typedef 定义新类型的简单语法：\n\
    \n```cpp\ntypedef type newname;\n```\n\n例如，以下代码告诉编译器 feet 是 int 的另一个名称：\n\n```cpp\n\
    typedef int feet;\n```\n\n现在，以下声明是完全合法的，并创建了一个名为 distance 的整数变量：\n\n```cpp\nfeet\
    \ distance;\n```\n\n### 枚举类型\n\n枚举类型声明一个可选的类型名称和零个或多个可作为该类型值的标识符。每个枚举数都是一个常量，其类型是枚举。\n\
    \n创建枚举需要使用关键字 **enum**。枚举类型的一般形式为：\n\n```cpp\nenum enum-name { list of names }\
    \ var-list;\n```\n\n这里，enum-name 是枚举的类型名称。名称列表以逗号分隔。\n\n例如，以下代码定义了一个名为 colors\
    \ 的颜色枚举和类型为 color 的变量 c。最后，c 被赋值为 \"blue\"。\n\n```cpp\nenum color { red, green,\
    \ blue } c;\n\nc = blue;\n```\n\n默认情况下，第一个名称的值为 0，第二个名称的值为 1，第三个名称的值为 2，以此类推。但你可以通过添加初始化器为名称赋予特定值。例如，在以下枚举中，**green**\
    \ 将具有值 5。\n\n```cpp\nenum color { red, green=5, blue };\n```\n\n这里，**blue** 将具有值\
    \ 6，因为每个名称的值都比前一个名称大一。\n\n## 6. 变量类型\n\n变量为我们的程序提供了命名的存储，我们的程序可以操作它。C++ 中的每个变量都有特定的类型，这决定了变量内存的大小和布局；可以存储在该内存中的值的范围；以及可以应用于变量的操作集。\n\
    \n变量名可以由字母、数字和下划线字符组成。它必须以字母或下划线开头。大写和小写字母是不同的，因为 C++ 是区分大小写的。\n\nC++ 中有以下基本变量类型，如上一章所述：\n\
    \n| Type | Description |\n|---|---|\n| bool | Stores either value true or false.\
