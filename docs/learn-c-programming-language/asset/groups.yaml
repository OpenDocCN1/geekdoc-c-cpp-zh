    ```\n\nNames introduced in a **using** directive obey normal scope rules. The\
    \ name is visible from the point of the **using** directive to the end of the\
    \ scope in which the directive is found. Entities with the same name defined in\
    \ an outer scope are hidden.\n\n### Discontiguous Namespaces\n\nA namespace can\
    \ be defined in several parts and so a namespace is made up of the sum of its\
    \ separately defined parts. The separate parts of a namespace can be spread over\
    \ multiple files.\n\nSo, if one part of the namespace requires a name defined\
    \ in another file, that name must still be declared. Writing a following namespace\
    \ definition either defines a new namespace or adds new elements to an existing\
    \ one:\n\n```cpp\nnamespace namespace_name {\n\n    // code declarations\n\n}\n\
    ```\n\n### Nested Namespaces\n\nNamespaces can be nested where you can define\
    \ one namespace inside another namespace as follows:\n\n```cpp\nnamespace namespace_name1\
    \ {\n\n    // code declarations\n\n    namespace namespace_name2 {\n\n       \
    \ // code declarations\n\n    }\n}\n```\n\nYou can access members of nested namespace\
    \ by using resolution operators as follows:\n\n```cpp\n// to access members of\
    \ namespace_name2\nusing namespace namespace_name1::namespace_name2;\n```\n\n\
    ```cpp\n// to access members of namespace_name1\nusing namespace namespace_name1;\n\
    ```\n\nIn the above statements if you are using namespace_name1, then it will\
    \ make elements of namespace_name2 available in the scope as follows:\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\n// first name space\nnamespace\
    \ first_space{\n    void func(){\n        cout << \"Inside first_space\" << endl;\n\
    \    }\n\n    // second name space\n    namespace second_space{\n        void\
    \ func(){\n            cout << \"Inside second_space\" << endl;\n        }\n \
    \   }\n}\n\nusing namespace first_space::second_space;\nint main ()\n{\n    //\
    \ This calls function from second name space.\n    func();\n\n    return 0;\n\
    }\n```\n\nIf we compile and run above code, this would produce the following result:\n\
    \n```text\nInside second_space\n```\n"
  mdcn: "\n\n## 32. 动态内存\n\n充分理解C++中动态内存的实际工作原理，是成为一名优秀C++程序员的关键。你的C++程序中的内存分为两部分：\n\
    \n- **栈：** 函数内声明的所有变量都将占用栈中的内存。\n- **堆：** 这是程序中未使用的内存，可以在程序运行时动态地分配内存。\n\n很多时候，你事先并不知道需要在定义的变量中存储特定信息所需的内存量，所需内存的大小可以在运行时确定。\n\
    \n你可以使用C++中的一个特殊运算符，在运行时为给定类型的变量在堆中分配内存，该运算符会返回所分配空间的地址。这个运算符称为 **new** 运算符。\n\
    \n如果你不再需要动态分配的内存，可以使用 **delete** 运算符，它会释放之前由new运算符分配的内存。\n\n### new 和 delete 运算符\n\
    \n下面是为任意数据类型动态分配内存时，使用 **new** 运算符的通用语法。\n\n```cpp\nnew data-type;\n```\n\n这里，**data-type**\
    \ 可以是任何内置数据类型，包括数组，也可以是任何用户定义的数据类型，包括类或结构体。让我们从内置数据类型开始。例如，我们可以定义一个指向double类型的指针，然后请求在执行时分配内存。我们可以使用\
    \ **new** 运算符通过以下语句实现：\n\n```cpp\ndouble* pvalue  = NULL;  // 指针初始化为 null\n\n\
    pvalue  = new double;    // 为变量请求内存\n```\n\n如果空闲存储区已被用完，内存可能分配失败。因此，检查new运算符是否返回NULL指针并采取适当措施是一个好习惯，如下所示：\n\
    \n```cpp\ndouble* pvalue = NULL;\n\nif( !(pvalue = new double ))\n{\n    cout\
    \ << \"Error: out of memory.\" <<endl;\n    exit(1);\n}\n```\n\nC语言中的**malloc()**\
    \ 函数在C++中仍然存在，但建议避免使用malloc()函数。new相对于malloc()的主要优势在于，new不仅仅分配内存，它还会构造对象，而这正是C++的首要目的。\n\
    \n在任何时候，当你觉得一个已动态分配的变量不再需要时，可以使用delete运算符释放它在空闲存储区中占用的内存，如下所示：\n\n```cpp\ndelete\
    \ pvalue;        // 释放 pvalue 指向的内存\n```\n\n让我们将上述概念整合起来，形成以下示例，以展示new和delete是如何工作的：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n    double*\
    \ pvalue = NULL;  // 指针初始化为 null\n    pvalue = new double;    // 为变量请求内存\n\n \
    \   *pvalue = 29494.99;     // 在分配的地址处存储值\n    cout << \"Value of pvalue : \"\
    \ << *pvalue << endl;\n\n    delete pvalue;          // 释放内存。\n\n    return 0;\n\
    }\n```\n\n如果我们编译并运行上述代码，将产生以下结果：\n\n```text\nValue of pvalue : 29495\n```\n\n\
    ### 数组的动态内存分配\n\n假设你想为一个字符数组分配内存，即一个包含20个字符的字符串。使用我们上面用过的相同语法，我们可以如下所示动态分配内存。\n\
    \n```cpp\nchar* pvalue  = NULL;   // 指针初始化为 null\n\npvalue = new char[20]; //\
    \ 为变量请求内存\n```\n\n要删除我们刚刚创建的数组，语句应如下所示：\n\n```cpp\ndelete [] pvalue;        //\
    \ 删除 pvalue 指向的数组\n```\n\n以下是new运算符用于多维数组的语法：\n\n```cpp\nint ROW = 2;\n\nint COL\
    \ = 3;\n\ndouble **pvalue  = new double* [ROW]; // 为行分配内存\n\n// 现在为列分配内存\nfor(int\
    \ i = 0; i < COL; i++) {\n    pvalue[i] = new double[COL];\n}\n```\n\n释放多维数组内存的语法如下：\n\
    \n```cpp\nfor(int i = 0; i < COL; i++) {\n    delete[] pvalue[i];\n}\ndelete []\
    \ pvalue;\n```\n\n### 对象的动态内存分配\n\n对象与简单数据类型并无不同。例如，考虑以下代码，我们将使用一个对象数组来阐明这一概念：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass Box\n{\n    public:\n\
    \        Box() {\n            cout << \"Constructor called!\" <<endl;\n      \
    \  }\n        ~Box() {\n            cout << \"Destructor called!\" <<endl;\n \
    \       }\n};\n\nint main( )\n{\n    Box* myBoxArray = new Box[4];\n\n    delete\
    \ [] myBoxArray; // 删除数组\n\n    return 0;\n}\n```\n\n如果你要分配一个包含四个Box对象的数组，简单的构造函数会被调用四次；同样地，在删除这些对象时，析构函数也会被调用相同的次数。\n\
    \n如果我们编译并运行上述代码，将产生以下结果：\n\n```text\nConstructor called!\nConstructor called!\n\
    Constructor called!\nConstructor called!\nDestructor called!\nDestructor called!\n\
    Destructor called!\nDestructor called!\n```\n\n```cpp\n}\n// 第二个命名空间\nnamespace\
    \ second_space{\n    void func(){\n        cout << \"Inside second_space\" <<\
    \ endl;\n    }\n}\nusing namespace first_space;\nint main ()\n{\n    // 这里调用来自第一个命名空间的函数。\n\
    \    func();\n    return 0;\n}\n```\n\n如果我们编译并运行上述代码，将产生以下结果：\n\n```text\nInside\
    \ first_space\n```\n\n`using` 指令也可以用于引用命名空间中的特定项。例如，如果你只打算使用std命名空间中的cout，你可以如下引用它：\n\
    \n```cpp\nusing std::cout;\n```\n\n后续代码可以在不添加命名空间前缀的情况下引用cout，但std命名空间中的其他项仍然需要显式指定，如下所示：\n\
    \n```cpp\n#include <iostream>\n\nusing std::cout;\n\nint main ()\n{\n    cout\
    \ << \"std::endl is used with std!\" << std::endl;\n    return 0;\n}\n```\n\n\
    如果我们编译并运行上述代码，将产生以下结果：\n\n```text\nstd::endl is used with std!\n```\n\n通过**using**指令引入的名称遵循正常的作用域规则。该名称从**using**指令所在位置到该指令所在作用域的末尾都是可见的。在外层作用域中定义的相同名称的实体将被隐藏。\n\
    \n### 不连续的命名空间\n\n一个命名空间可以被定义在多个部分，因此命名空间由其分别定义的各部分的总和组成。命名空间的各个部分可以分布在多个文件中。\n\
    \n因此，如果命名空间的一个部分需要另一个文件中定义的名称，该名称仍然必须被声明。编写如下的命名空间定义，要么定义一个新的命名空间，要么向现有命名空间添加新的元素：\n\
    \n```cpp\nnamespace namespace_name {\n\n    // 代码声明\n\n}\n```\n\n### 嵌套的命名空间\n\
    \n命名空间可以嵌套，你可以在一个命名空间内部定义另一个命名空间，如下所示：\n\n```cpp\nnamespace namespace_name1 {\n\
    \n    // 代码声明\n\n    namespace namespace_name2 {\n\n        // 代码声明\n\n    }\n\
    }\n```\n\n你可以通过使用解析运算符访问嵌套命名空间的成员，如下所示：\n\n```cpp\n// 访问 namespace_name2 的成员\n\
    using namespace namespace_name1::namespace_name2;\n```\n\n```cpp\n// 访问 namespace_name1\
    \ 的成员\nusing namespace namespace_name1;\n```\n\n在上述语句中，如果你使用了namespace_name1，那么它将使namespace_name2的元素在作用域中可用，如下所示：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// 第一个命名空间\nnamespace\
    \ first_space{\n    void func(){\n        cout << \"Inside first_space\" << endl;\n\
    \    }\n\n    // 第二个命名空间\n    namespace second_space{\n        void func(){\n\
    \            cout << \"Inside second_space\" << endl;\n        }\n    }\n}\n\n\
    using namespace first_space::second_space;\nint main ()\n{\n    // 这里调用来自第二个命名空间的函数。\n\
    \    func();\n\n    return 0;\n}\n```\n\n如果我们编译并运行上述代码，将产生以下结果：\n\n```text\nInside\
    \ second_space\n```\n\n"
