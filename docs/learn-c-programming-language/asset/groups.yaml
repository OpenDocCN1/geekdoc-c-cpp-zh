    \ i++)\n    {\n        cout << \"Address of var[\" << i << \"] = \";\n       \
    \ cout << ptr << endl;\n\n        cout << \"Value of var[\" << i << \"] = \";\n\
    \        cout << *ptr << endl;\n\n        // point to the next location\n    \
