    \ to outside world\n      void addNum(int number)\n      {\n         total +=\
    \ number;\n      }\n\n      // interface to outside world\n      int getTotal()\n\
    \      {\n         return total;\n      };\n   private:\n\n      // hidden data\
    \ from outside world\n      int total;\n};\nint main( )\n{\n```\n```\n\n## 29.\
    \ 接口\n\n接口描述了 C++ 类的行为或功能，而不承诺该类的特定实现。\n\nC++ 接口使用 **抽象类** 实现，这些抽象类不应与数据抽象混淆，数据抽象是将实现细节与相关数据分离的概念。\n\
    \n通过将类的至少一个函数声明为 **纯虚函数**，使类变为抽象类。纯虚函数通过在其声明中放置 \"= 0\" 来指定，如下所示：\n\n```\n```cpp\n\
