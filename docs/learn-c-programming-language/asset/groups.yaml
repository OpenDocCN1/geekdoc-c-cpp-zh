    当前版本为 CGI/1.1，CGI/1.2 正在进行中。\n\n### Web Browsing\n\n为了理解 CGI 的概念，让我们看看当我们点击超链接浏览特定网页或\
    \ URL 时会发生什么。\n\n- 你的浏览器联系 HTTP Web 服务器并请求 URL，即文件名。\n- Web 服务器会解析 URL 并查找文件名。如果找到请求的文件，则\
    \ Web 服务器会将该文件发送回浏览器，否则发送错误消息，表明你请求了错误的文件。\n- Web 浏览器从 Web 服务器接收响应，并根据接收到的响应显示接收到的文件或错误消息。\n\
    \n然而，可以设置 HTTP 服务器，使得每当请求某个目录中的文件时，该文件不会被发送回去；相反，它作为程序执行，并将程序的输出发送回浏览器显示。\n\n\
    通用网关接口（CGI）是使应用程序（称为 CGI 程序或 CGI 脚本）与 Web 服务器和客户端交互的标准协议。这些 CGI 程序可以用 Python、PERL、Shell、C\
    \ 或 C++ 等编写。\n\n### CGI Architecture Diagram\n\n以下简单程序展示了 CGI 的简单架构：\n\n"
