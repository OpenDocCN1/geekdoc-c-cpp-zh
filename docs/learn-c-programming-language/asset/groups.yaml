    int main ()\n{\n    // a pointer to an int.\n    int *p;\n\n    p = getRandom();\n\
    \    for ( int i = 0; i < 10; i++ )\n    {\n        cout << \"*(p + \" << i <<\
    \ \") : \";\n        cout << *(p + i) << endl;\n    }\n\n    return 0;\n}\n```\n\
