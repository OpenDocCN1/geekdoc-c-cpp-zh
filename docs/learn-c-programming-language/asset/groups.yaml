    \ name: cplusplus\nYour name is: cplusplus\n```\n\nC++ 编译器还会确定输入值的数据类型，并选择合适的流提取运算符来提取该值并将其存储到给定的变量中。\n\
    \n流提取运算符 >> 可以在一条语句中使用多次。要请求多个数据，你可以使用以下方式：\n\n```cpp\ncin >> name >> age;\n```\n\
    \n这等价于以下两条语句：\n\n```cpp\ncin >> name;\ncin >> age;\n```\n\n### 标准错误流（cerr）\n\n\
    预定义对象 cerr 是 ostream 类的一个实例。cerr 对象据说连接到标准错误设备，该设备也是显示屏，但 cerr 对象是无缓冲的，每次向 cerr\
