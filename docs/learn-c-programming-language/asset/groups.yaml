    ## 37. MULTITHREADING\n\nMultithreading is a specialized form of multitasking\
    \ and a multitasking is the feature that allows your computer to run two or more\
    \ programs concurrently. In general, there are two types of multitasking: process-based\
    \ and thread-based.\n\nProcess-based multitasking handles the concurrent execution\
    \ of programs. Thread-based multitasking deals with the concurrent execution of\
    \ pieces of the same program.\n\nA multithreaded program contains two or more\
    \ parts that can run concurrently. Each part of such a program is called a thread,\
    \ and each thread defines a separate path of execution.\n\nC++ does not contain\
    \ any built-in support for multithreaded applications. Instead, it relies entirely\
    \ upon the operating system to provide this feature.\n\nThis tutorial assumes\
    \ that you are working on Linux OS and we are going to write multi-threaded C++\
    \ program using POSIX. POSIX Threads, or Pthreads provides API which are available\
    \ on many Unix-like POSIX systems such as FreeBSD, NetBSD, GNU/Linux, Mac OS X\
    \ and Solaris.\n\n### Creating Threads\n\nThe following routine is used to create\
    \ a POSIX thread:\n\n```cpp\n#include <pthread.h>\n\npthread_create (thread, attr,\
    \ start_routine, arg)\n```\n\nHere, pthread_create creates a new thread and makes\
    \ it executable. This routine can be called any number of times from anywhere\
    \ within your code. Here is the description of the parameters:\n\n| Parameter\
    \ | Description |\n| --- | --- |\n| thread | An opaque, unique identifier for\
    \ the new thread returned by the subroutine. |\n| attr | An opaque attribute object\
    \ that may be used to set thread attributes. You can specify a thread attributes\
    \ object, or NULL for the default values. |\n| start_routine | The C++ routine\
    \ that the thread will execute once it is created. |\n| arg | A single argument\
    \ that may be passed to start_routine. It must be passed by reference as a pointer\
    \ cast of type void. NULL may be used if no argument is to be passed. |\n\nThe\
    \ maximum number of threads that may be created by a process is implementation\
    \ dependent. Once created, threads are peers, and may create other threads. There\
    \ is no implied hierarchy or dependency between threads.\n\n### Terminating Threads\n\
    \nThere is following routine which we use to terminate a POSIX thread:\n\n```cpp\n\
    #include <pthread.h>\n\npthread_exit (status)\n```\n\nHere **pthread_exit** is\
    \ used to explicitly exit a thread. Typically, the pthread_exit() routine is called\
    \ after a thread has completed its work and is no longer required to exist.\n\n\
    If main() finishes before the threads it has created, and exits with pthread_exit(),\
    \ the other threads will continue to execute. Otherwise, they will be automatically\
    \ terminated when main() finishes.\n\n### Example:\n\nThis simple example code\
    \ creates 5 threads with the pthread_create() routine. Each thread prints a \"\
    Hello World!\" message, and then terminates with a call to pthread_exit().\n\n\
    ```cpp\n#include <iostream>\n\n#include <cstdlib>\n\n#include <pthread.h>\n\n\
    using namespace std;\n\n#define NUM_THREADS     5\n\nvoid *PrintHello(void *threadid)\n\
    {\n    long tid;\n\n    tid = (long)threadid;\n\n    cout << \"Hello World! Thread\
    \ ID, \" << tid << endl;\n    pthread_exit(NULL);\n}\n\nint main ()\n{\n    pthread_t\
    \ threads[NUM_THREADS];\n    int rc;\n    int i;\n\n    for( i=0; i < NUM_THREADS;\
    \ i++ ){\n        cout << \"main() : creating thread, \" << i << endl;\n     \
    \   rc = pthread_create(&threads[i], NULL,\n                            PrintHello,\
    \ (void *)i);\n        if (rc){\n            cout << \"Error:unable to create\
    \ thread,\" << rc << endl;\n            exit(-1);\n        }\n    }\n    pthread_exit(NULL);\n\
    }\n```\n\nCompile the following program using -lpthread library as follows:\n\n\
    ```bash\n$gcc test.cpp -lpthread\n```\n\nNow, execute your program which gives\
    \ the following output:\n\n```text\nmain() : creating thread, 0\nmain() : creating\
    \ thread, 1\nmain() : creating thread, 2\nmain() : creating thread, 3\nmain()\
    \ : creating thread, 4\nHello World! Thread ID, 0\nHello World! Thread ID, 1\n\
    Hello World! Thread ID, 2\nHello World! Thread ID, 3\nHello World! Thread ID,\
    \ 4\n```\n\nThe pthread_join() subroutine blocks the calling thread until the\
    \ specified 'threadid' thread terminates. When a thread is created, one of its\
    \ attributes defines whether it is joinable or detached. Only threads that are\
    \ created as joinable can be joined. If a thread is created as detached, it can\
    \ never be joined.\n\nThis example demonstrates how to wait for thread completions\
    \ by using the Pthread join routine.\n\n```cpp\n#include <iostream>\n#include\
    \ <cstdlib>\n#include <pthread.h>\n#include <unistd.h>\n\nusing namespace std;\n\
    \n#define NUM_THREADS     5\n\nvoid *wait(void *t)\n{\n    int i;\n    long tid;\n\
    \n    tid = (long)t;\n\n    sleep(1);\n    cout << \"Sleeping in thread \" <<\
    \ endl;\n    cout << \"Thread with id : \" << tid << \" ...exiting \" << endl;\n\
    \    pthread_exit(NULL);\n}\n\nint main ()\n{\n    int rc;\n    int i;\n    pthread_t\
    \ threads[NUM_THREADS];\n    pthread_attr_t attr;\n    void *status;\n\n    //\
    \ Initialize and set thread joinable\n    pthread_attr_init(&attr);\n    pthread_attr_setdetachstate(&attr,\
    \ PTHREAD_CREATE_JOINABLE);\n\n    for( i=0; i < NUM_THREADS; i++ ){\n       \
    \ cout << \"main() : creating thread, \" << i << endl;\n        rc = pthread_create(&threads[i],\
    \ NULL, wait, (void *)i );\n        if (rc){\n            cout << \"Error:unable\
    \ to create thread,\" << rc << endl;\n            exit(-1);\n        }\n    }\n\
    \n    // free attribute and wait for the other threads\n    pthread_attr_destroy(&attr);\n\
    \    for( i=0; i < NUM_THREADS; i++ ){\n        rc = pthread_join(threads[i],\
    \ &status);\n        if (rc){\n            cout << \"Error:unable to join,\" <<\
    \ rc << endl;\n            exit(-1);\n        }\n        cout << \"Main: completed\
    \ thread id :\" << i ;\n        cout << \"  exiting with status :\" << status\
    \ << endl;\n    }\n\n    cout << \"Main: program exiting.\" << endl;\n    pthread_exit(NULL);\n\
    }\n```\n\nWhen the above code is compiled and executed, it produces the following\
