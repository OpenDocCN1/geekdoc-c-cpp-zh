    It may come as a surprise that class NonEmpty is not an empty class. After all,
    it does have members and no base classes. However, the base classes Empty and
    EmptyToo of NonEmpty cannot be allocated to the same address because this would
    cause the base class EmptyToo to end at the same address as the base class Empty
    of NonEmpty. In other words, two objects of the same type end up at the same offset,
    which is not permitted by the object layout of C++. It may be conceivable to decide
    that one of the Empty subclasses is placed at offset "0 bytes" and the other at
    offset "1 byte," but the complete NonEmpty object still cannot have a size of
    one byte because in an array of two NonEmpty objects, an Empty subobject of the
    first element cannot end at the same address as an Empty subobject of the second
    element (see Figure 16.4).


    ![](img/9f394dcf9397c1747f3da913f27a6f5b_310_0.png)


    The rationale for the constraint on empty base optimization stems from the fact
    that it is desirable to be able to compare whether two pointers point to the same
    object. Because pointers are nearly always represented as addresses, we must ensure
    that two different addresses (that is, pointer values) correspond to two different
    objects.


    The constraint may not seem very significant. However, in practice, it is often
    encountered because many classes tend to inherit from a small set of empty classes
    that define some common types. When two subobjects of such classes are used in
    the same complete object, the optimization is inhibited.'
