  md: "# Chapter 3: Class Templates\n\n```\ntemplate <typename T>\nvoid Stack<T>::push\
    \ (T const& elem)\n{\n    elems.push_back(elem); // append copy of passed elem\n\
    }\n```\n\n```\ntemplate<typename T>\nvoid Stack<T>::pop ()\n{\n    if (elems.empty())\
    \ {\n        throw std::out_of_range(\"Stack<>::pop(): empty stack\");\n    }\n\
