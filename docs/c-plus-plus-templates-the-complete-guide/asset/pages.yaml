  md: "# 8.3 Template Arguments\n\nWe can check at compile time (in other words, as\
    \ a so-called constant-expression) whether a given T has a member type X:\n\n\
    ```\n#define type_has_member_type_X(T)\nsizeof(test<T>(0)) == 1\n```\n\nTo understand\
    \ in this macro, it is convenient to analyze from the outside to the inside. First,\
    \ the sizeof expression will equal one if the first template (which returns a\
    \ char of size) is selected. The other templates return a size that is at least\
    \ two (because it contains an array of size). In others, this is a device to determine\
    \ as a constant-expression whether the first or second template is selected for\
    \ the call test<>(0). Clearly, the first template cannot be selected if the given\
    \ T has no type X. However, if the given T has a type X, then the first template\
    \ is preferred over overload resolution (see Appendix B) prefers the conversion\
    \ from zero to a null pointer constant over binding an argument to an ellipsis\
    \ parameter (ellipsis parameters are the kind kind of binding from overload resolution\
    \ perspective). Similar techniques are explored in Chapter 15.\n\nThe SFINAE principle\
    \ protects only against attempts to create invalid types but not against attempts\
    \ to evaluate invalid expressions. The following example is invalid C++:\n\n```\n\
    template<int> void f(int (&)[24/(4-I)]);\ntemplateplate<int> void f(int (&)[24/(4+I)]);\n\
    ```\n\n```\nint main()\n{\n    &f<4>; // ERROR: division by zero (SFINAE doesn't\
    \ apply)\n}\n```\n\nThis example is an error even though the second template supports\
    \ the substitution without leading to a division by zero. This sort of error must\
    \ occur in the expression itself and not in binding of an expression to a template\
    \ parameter. Indeed, the following example is valid:\n\n```\ntemplate<int N> int\
    \ g() { return N; }\ntemplate<int>* P> int g() { return P; }\n```\n\n```\nint\
    \ main()\n{\n    return g<1>(); // // cannot be bound to int* parameter,\n   \
    \ // but SFINAE principle applies\n}\n```\n\nSee Section 15.2.2 on page 266 and\
    \ Section 19.3 on page 353 for further applications of the SFINAE principle."
