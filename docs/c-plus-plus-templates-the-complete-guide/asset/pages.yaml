    Templates raise two classes of challenges when it comes to debugging them. One
    of challenges is definitely a problem for writers of templates: How can we ensure
    that the templates we will function for any template arguments that satisfy the
    conditions we document? The other class of problems is almost exactly the opposite:
    How can a user of template find out which of the parameter requirements it violated
    when the template does not behave as documented?


