  md: "# 16.1 Named Template Arguments\n\nNote the use of an intermediate Discriminator\
    \ template. It is needed to allow the various Setter types to be identical. (You\
    \ cannot have multiple direct base classes of the same type. Indirect base classes,\
    \ on the other hand, can have types that are identical to those of others.)\n\n\
    As announced earlier, we're collecting the defaults in a base class:\n\n```\n\
    // name default policies as P1, P2, P3, P4\nclass DefaultPolicies {\npublic:\n\
    \    typedef DefaultPolicy1 P1;\n    typedef DefaultPolicy2 P2;\n    typedef DefaultPolicy3\
    \ P3;\n    typedef DefaultPolicy4 P4;\n};\n```\n\nHowever, we must be careful\
    \ to avoid ambiguities if we end inheriting multiple times from the base class.\
    \ Therefore, we ensure that the base class is inherited virtually:\n\n```\n//\
    \ class to define a use of the default policy values\n// avoids ambiguities if\
    \ we derive from DefaultPolicies more than once\nclass DefaultPolicyArgs : virtual\
    \ public DefaultPolicies {\n};\n```\n\nFinally, we also need templates to override\
    \ the default policy values:\n\n```\ntemplate <typename Policy>\nclass Policy1_is\
    \ : virtual public DefaultPolicies {\npublic:\n    typedef Policy P1; // overriding\
    \ typedef\n};\n```\n\n```\ntemplate <typename Policy>\nclass Policy2_is : virtual\
    \ public DefaultPolicies {\npublic:\n    typedef Policy P2; // overriding typedef\n\
    };\n```\n\n```\ntemplate <typename Policy>\nclass Policy3_is : virtual public\
    \ DefaultPolicies {\npublic:\n    typedef Policy P3; // overriding typedef\n};\n\
    ```"
