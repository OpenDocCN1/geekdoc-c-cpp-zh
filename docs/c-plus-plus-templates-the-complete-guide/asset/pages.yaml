  md: "# 13.14 Layout Control\n\nA fairly common programming challenge is to declare\
    \ an array of bytes that will be sufficiently large (but not excessively) to hold\
    \ an object of as yet unknown type T—in other words, a template parameter. One\
    \ application of this is the so-called discriminated unions (also called variant\
    \ types or tagged unions):\n\n```\ntemplate <... list>\nclass D_Union {\npublic:\n\
    \    enum { n_bytes }; // will eventually hold one of various types\n    char\
    \ bytes[n_bytes]; // described by the template arguments\n\n};\n```\n\nThe constant\
    \ n_bytes cannot be set to sizeof(T) because T may have more strict alignment\
    \ requirements than the bytes buffer. Various heuristics exist to take this alignment\
    \ into account, but they are often complicated or somewhat arbitrary assumptions.\n\
    \nFor such an application, what is really desired is the ability to set the alignment\
    \ requirement of a type as a constant expression and, conversely, the ability\
    \ to impose an alignment on a type, a field, or variable. Many C and C++ compilers\
    \ already support an _alignof_ operator, which returns the alignment of a given\
    \ type or expression. This is almost identical to the sizeof operator except that\
    \ the alignment is returned instead of the size of the given type. Many compilers\
    \ also provide #pragma directives or similar devices to set the alignment of an\
    \ entity. A possible approach may be to introduce a alignof keyword that can be\
    \ used both in expressions (to obtain the alignment) and in declarations (to set\
    \ the alignment).\n\n```\ntemplate <typename T>\nclass Alignment {\npublic:\n\
    \    enum { max = alignof(T) };\n};\n```\n\n```\ntemplate <... list>\nclass Alignment\
