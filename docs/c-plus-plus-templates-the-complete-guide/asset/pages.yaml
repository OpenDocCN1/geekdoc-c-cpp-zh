  md: '# Chapter 1: About This Book


    # 1.1 What You Should Know Before Reading This Book


    To get the most from this book you should already know C++. We describe the details
    of a particular language feature, not the fundamentals of the language itself.
    You should be familiar with the concepts of classes and inheritance, and you should
    be able to write C++ programs using components such as Iostre and containers from
    the C++ standard library. In addition, we review subtle issues as the need arises,
    even when issues aren''t directly related to templates. This ensures that the
    text is accessible to experts and intermediate programmers alike.


    We deal mostly with the C++ language as standardized in 1998 (see [Standard98],
    the clarifications provided by the C++ Standardization Committee in its first
    technical corrigendum). If you feel your understanding of the basics of C++ is
    rusty or out-of-date, we recommend [StroustrupC++], [JosuttisOOP], and [JosuttisStdLib]
    to refresh your knowledge. These books are excellent introductions to the modern
    language and its standard library. Additional publications are listed in Appendix
    B.3.5.


    # 1.2 Overall Structure of the Book


    Our goal is to provide the information necessary for starting to use templates
    and benefit from their power, as well as provide information that will enable
    experienced programmers to push the limits of the state-of-the-art. To achieve
    this, we decided to organize our text in parts:


    +   * Part I introduces the basic concepts underlying templates. It is written
    in a tutorial style.


    +   * Part II presents the language details and is a handy reference to template-related
    constructs.


    +   * Part III explains fundamental design techniques supported by C++ templates.
    They range from near-trivial ideas to sophisticated idioms that may not have been
    published elsewhere.


    +   * Part IV builds on the previous two parts and adds a discussion of popular
    applications for templates.


    Each of these parts consists of several chapters. In addition, we provide a few
    appendices that cover material not necessarily related to templates (for example,
    an overview of overload resolution in C++).


    The chapters of Part I are meant to be in sequence. For example, Chapter 3 builds
    on the material covered in Chapter 2. In the other parts, however, the connection
    between chapters is considerably looser. For example, it would be entirely natural
    to read the chapter about functors (Chapter 22) before the chapter about smart
    pointers (Chapter 20).


    Last, we provide a rather complete index that encourages additional ways to read
    this book out sequence.'
