  md: "# 9.2 Looking Up Names\n\n```\nusing BigMath::BigNumber;\n\nvoid g (BigNumber\
    \ const& a, BigNumber const& b)\n{\n  ...\n  BigNumber x = max(a,b);\n  ...\n\
    }\n```\n\nThe problem here is that the max() template is unaware of the BigMath\
    \ namespace, but ordinary lookup would not find the operator applicable to values\
    \ of type BigNumber. Without some special rules, this greatly reduces the applicability\
    \ of templates in the context of C++ namespaces. ADL is the C++ answer to those\
    \ \"special rules.\"\n\n# 9.2.1 Argument-Dependent Lookup\n\nADL applies only\
    \ to unqualified names that look like a nonmember function in a function call.\
    \ If ordinary lookup finds the name of a member function or the name of a type,\
    \ ADL does not happen. ADL is also inhibited if the name of the function to be\
    \ called is enclosed in parentheses.\n\nOtherwise, if the name is followed by\
    \ a list of argument expressions enclosed in parentheses, ADL proceeds by looking\
    \ up the name in namespaces and classes \"associated with\" the types of the call\
    \ arguments. The precise definition of these associated namespaces and associated\
    \ classes is given later, but intuitively it can be thought as all the namespaces\
    \ and classes that are fairly directly connected to a given type. For example,\
    \ if the type is a pointer to a class X, then the associated classes and namespace\
    \ would include X as well as any namespaces or classes to which X belongs.\n\n\
    The precise definition of the set of associated namespaces and associated classes\
    \ for a given type is determined by the following rules:\n\n+   - For built-in\
    \ types, this is the empty set.\n- For pointer and array types, the set of associated\
    \ namespaces and classes is that of the underlying type.\n- For enumeration types,\
    \ the associated namespace is the namespace in which the enumeration is declared.\n\
    - For class members, the enclosing class is the associated class.\n- For class\
    \ types (including union types) the set of associated classes is the type itself,\
    \ the closing class, and any direct and indirect base classes. The set of associated\
    \ namespaces is the namespaces in which the associated classes are declared. If\
    \ the class is a template instantiation, then the types of the template arguments\
    \ and the classes and namespaces in which the template arguments are declared\
    \ are also included.\n- For function types, the sets of associated namespaces\
    \ and classes comprise the namespaces and classes associated with all the parameter\
    \ types and those associated with the return type."
