  md: "# 22.3 Pointer-to-Member Functions\n\nConsider now the following elementary\
    \ member function calls:\n\n```\nint main()\n{\n  D obj;\n  obj.mf1();\n  obj.mf2();\n\
    }\n```\n\nThe call obj.mf2(2) requires the address of the subobject of type B2\
    \ in obj to be passed to mf2(). Assuming the typical implementation described,\
    \ this is the address of obj plus 4 bytes. It is not at all hard for a C++ compiler\
    \ to generate code to perform this adjustment. Note that for the call to mf1(),\
    \ this adjustment should not be done because the address of obj is also the address\
    \ of the subobject of type B1 within obj.\n\nHowever, with pointer-to-member functions\
    \ the compiler does not know what adjustment is needed. To see this, replace the\
    \ previous main() routine with the following:\n\n```\nvoid call_memfun (D obj,\
    \ void (D::*pmf()))\n{\n  (obj.*pmf());\n}\n```\n\n```\nint main()\n{\n  D obj;\n\
    \  call_memfun(obj, &D::mf1);\n  call_memfun(obj, &D::mf2);\n}\n```\n\nTo make\
    \ the solution even more opaque to a C++ compiler, the call_memfun() and main()\
    \ may be placed in different translation units.\n\nThe conclusion is that in addition\
    \ to the address of the function, a pointer to a member function also needs to\
    \ track this pointer adjustment needed for a particular member function. This\
    \ adjustment may change when a pointer-to-member function is cast. With our example:\n\
    \n```\nvoid (D::*pmf_a()) = &D::mf2;                     // adjustment of +4 recorded\n\
    void (B2::*pmf_b()) = (void (B2::*))())pmf_a; // adjustment changed to 0\n```\n\
    \nThe main purpose of this discussion is to illustrate the intrinsic difference\
    \ between a pointer to a member function and a pointer to a function. However,\
    \ the outline is not sufficient when it comes to virtual functions, and in practice\
    \ many implementations use a three-word structure for pointers to member functions:\n\
    \n+   1. The address of the member function, or NULL if it is a virtual function\n\
    2. The required this adjustment\n3. A virtual function index"
