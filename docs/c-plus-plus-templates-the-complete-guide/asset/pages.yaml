  md: "# 13.10 Static Properties\n\nIn 15 and Chapter 19 discuss various ways to categorize\
    \ types “at compile time.” Such traits are useful in selecting specializations\
    \ of templates based on the static properties of the type (See, for our example,\
    \ CTraits class in 15.3.2 on page 279, which attempts to select optimal or near-optimal\
    \ policies to copy, swap, or move elements of the argument.)\n\nSome language\
    \ designers have observed that if such “specialization selections” are common-place,\
    \ they shouldn't require elaborate user-defined code if all that is a property\
    \ that the implementation knows internally anyway. The language could instead\
    \ provide a number of built-in type traits. The following could be a valid complete\
    \ C++ program with such an extension:\n\n```\n#include <iostream>\n\nint main()\
    \ {\n    std::cout << std::type<int>::is_bit_copyable << '\\\\n';\n    std::cout\
    \ << std::type<int>::is_union << '\\\\n';\n}\n```\n\nAlthough a separate syntax\
    \ could be developed for such a construct, fitting it in a user-definable syntax\
    \ may allow for a smoother transition from the current language to a language\
    \ that would include features. However, some of the static properties that a C++\
    \ compiler can easily provide not be obtainable using traditional traits techniques\
    \ (for example, determining whether a type is a union), which is an argument in\
    \ favor of making this language element. Another argument is that it can significantly\
    \ reduce the amount of memory and machine cycles required by a compiler to translate\
    \ programs that rely on such properties.\n\n# 13.11 Custom Instantiation Diagnostics\n\
    \nMany templates put implicit requirements on their parameters. When the arguments\
    \ of an instantiation of such a template do not fulfill the requirements, either\
    \ a generic error is issued or the generated instantiation does not function correctly.\
    \ In early C++ compilers, the generic errors produced during template instantiations\
    \ were exceedingly opaque (see page 75 for an example). In more recent compilers,\
    \ the error messages are sufficiently clear for an experienced programmer to track\
    \ down a problem quickly, but there is still a desire to improve the situation.\
    \ Consider the following artificial example (meant to illustrate what happens\
    \ in real template libraries):\n\n```\ntemplate <typename T>\nvoid clear (T const\
    \ p) {\n    *p = 0; // assumes T is a pointerlike type\n}\n```"
