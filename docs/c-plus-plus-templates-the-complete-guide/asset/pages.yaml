    \ feel comfortable with.\n\n# 20.1.2 Holders\n\nFortunately, it is not very hard\
    \ to write a small template that essentially encapsulates the policy in the second\
    \ example. The idea is to write a class that behaves most like a pointer, but\
    \ which destroys the object to which it is itself destroyed or if another pointer\
    \ is assigned to it. Such a class could be called a holder because it is meant\
    \ to hold an object while we perform various computations. Here is how we would\
    \ do this:\n\n```\n// pointers/holder.hpp\ntemplate <typename T>\nclass Holder\
    \ {\nprivate:\n    T* ptr;      // refers to the object it holds (if any)\n\n\
