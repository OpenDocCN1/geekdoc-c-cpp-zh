  md: '# 7.2 Instantiation and Specialization


    The process of creating a regular class, function, or member function from a template
    by substituting actual values for its arguments is called template instantiation.
    This resulting entity (class, function, or member function) is generically called
    a specialization.


    However, in C++ the instantiation process is not the only way to produce a specialization.
    Alternative mechanisms allow the programmer to explicitly specify a declaration
    that is tied to a special substitution of template parameters. As we introduced
    in Section 3.3 on page 27, such a specialization is introduced by <template>:


    ```

    template <typename T1, typename T2> // primary class template

    class MyClass {


    };

    ```


    ```

    template<>

    class MyClass<std::string,float> { // explicit specialization


    };

    ```


    Strictly speaking, this is called a so-called explicit specialization (as opposed
    to an instantiated or generated specialization).


    As introduced in Section 3.4 on page 29, specializations that still have template
    parameters are called partial specializations:


    ```

    template <typename T>

    class MyClass<T,T> { // partial specialization

    ...

    };

    ```


    ```

    template <typename T>

    class MyClass<bool,T> { // partial specialization

    ...

    };

    ```


    When talking about (explicit or partial) specializations, the general template
    is also called the primary template.'
