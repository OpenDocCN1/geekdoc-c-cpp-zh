  md: '# 6.3 The Separation Model


    Both approaches advocated in the previous sections work and conform entirely to
    the C++ standard. However, this same standard also provides the alternative mechanism
    of exporting templates. This approach is sometimes called the C++ template separation
    model.


    # 6.3.1 The Keyword export


    In principle, it is quite simple to make use of the export facility: Define the
    template in just one file, and mark that definition and all its nondefining declarations
    with the keyword export. For the example in the previous section, this results
    in the following function template declaration:


    ```

    // basics/myfirst3.hpp

    #ifndef MYFIRST_HPP

    #define MYFIRST_HPP


    // declaration of template

    export template <typename T>

    void print_typeof(const T&);


    #endif //MYFIRST_HPP

    ```


    Exported templates can be used without their definition visible. In other words,
    the point where a template is being used and the point where it is defined can
    be in two different translation units. In our example, the file myfirst.hpp contains
    only the declaration of the member functions of the class template, and this is
    sufficient to use those members. Comparing with the original code that was triggering
    linker errors, we had to add only one export keyword in our code and things now
    work just.


    Within a preprocessed file (that is, within a translation unit), it is sufficient
    to mark the first declaration of a template with export. Redeclarations, including
    definitions, implicitly keep that attribute. This is why myfirst.cpp does not
    need to be modified in our example. The definitions in this file are implicitly
    exported because they were so declared in the #included header file. On the other
    hand, it is perfectly acceptable to redundant export keywords on template definitions,
    and doing so may improve the readability of the code.


    The keyword export really applies to function templates, member functions of class
    templates, member function templates, and static data members of class templates.
    Export can also be applied to a class template declaration. It implies that every
    one of its exportable members is exported, but class templates themselves are
    not actually exported (hence, their definitions still appear in header files).
    You can still have implicitly or explicitly defined inline member functions. However
    inline functions are not exported:'
