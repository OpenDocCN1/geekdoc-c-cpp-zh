  md: "As this example shows, a nontemplate function can coexist with a function template\
    \ that has the same name and can be instantiated with the same type. All other\
    \ factors being equal, the overload resolution normally prefers this nontemplate\
    \ over one generated from the template. The fourth call falls under this rule:\n\
    \n```\n:max(7, 42) // both int values match the nontemplate function perfectly\n\
    ```\n\nIf the template can generate a function with a better match, however, then\
    \ the template is selected. This is demonstrated by the second and third call\
    \ of max():\n\n```\n:max(7.0, 42.0) // calls the max<double> (by argument deduction)\n\
    :max('a', 'b') // calls the max<char> (by argument deduction)\n```\n\nIt is also\
    \ possible to specify explicitly an empty template list. This syntax indicates\
    \ that only templates may resolve a call, but all the template parameters should\
    \ be deduced from the call arguments:\n\n```\n:max<>(7, 42) // calls max<int>\
    \ (by argument deduction)\n```\n\nBecause automatic type conversion is not considered\
    \ for templates but is considered for ordinary functions, the last call uses the\
    \ nontemplate function while 'a' and 42.7 are converted to int:\n\n```\n:max('a',\
    \ 42.7) // only the nontemplate function allows different argument types\n```\n\
    \nA more useful example would be to overload the maximum template for pointers\
    \ and ordinary strings:\n\n```\n// basics/max3.cpp\n#include <iostream>\n#include\
    \ <cstring>\n#include <string>\n\n// maximum of two values of any type\ntemplate\
    \ <typename T>\ninline T const max(T const& a, T const& b)\n{\n    return a <\
    \ b ? b : a;\n}\n\n// maximum of two pointers\ntemplate <typename T>\ninline T*\
    \ const max(T* const& a, T* const& b)\n{\n    return *a < *b ? b : a;\n}\n```"
