    \ but we must then be careful not to create a so-called *digraph* token <, which\
    \ is interpreted as a left bracket. Although relatively rare, such errors result\
    \ in perplexing diagnostics.\n\n# 9.3 Parsing Templates\n\nTwo fundamental activities\
    \ of compilers for most programming languages are *tokenization*—also called *scanning*—and\
    \ parsing. The tokenization process reads the source code as a sequence of characters\
    \ and generates a sequence of tokens from it. For example, on seeing the sequence\
    \ of characters int* p=0; the tokenizer will generate token descriptions for a\
    \ keyword int, an identifier p, a symbol/operator =, an integer literal 0, and\
    \ a symbol/operator ;\n\nA parser will find known patterns in the token sequence\
    \ by reducing tokens or previously found patterns into higher level constructs.\
    \ For example, the token < is a valid expression, the combination * followed by\
    \ an identifier p is a valid declarator, and that declarator followed by “=” followed\
    \ by the expression “0” is also a valid declarator. Finally, the keyword int is\
    \ a type name, and when followed by the declarator *p=0, it gets the initializing\
    \ declaration of p.\n\n# 9.3.1 Context Sensitivity in Nontemplates\n\nAs you may\
    \ know or not, tokenizing is easier than parsing. Fortunately, parsing is a subject\
    \ for which a solid theory has been developed, and many useful languages are not\
    \ hard to parse using this theory. However, the theory works best for so-called\
    \ *context-free languages*, and we have already noted that C++ is context sensitive.\
    \ This means a C++ compiler will couple a symbol table to the tokenizer and parser:\
    \ When a declaration is parsed, it is entered into the symbol table. When the\
    \ tokenizer finds an identifier, it looks up and annotates the resulting token\
    \ if it finds a type."
