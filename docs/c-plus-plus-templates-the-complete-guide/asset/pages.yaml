  md: "# B.3 Overloading Details\n\n(because it requires a user-defined conversion),\
    \ but it has a better match for the last parameter; hence the two candidates cannot\
    \ be ordered. The call is therefore ambiguous.\nSurrogate functions are in the\
    \ most obscure corners of C++ and rarely occur in practice (fortunately).\n\n\
    # B.3.5 Other Overloading Contexts\n\nSo far we have discussed overloading in\
    \ the context of determining which function should be called in a call expression.\
    \ However, there are a few other contexts in which a similar selection must be\
    \ made.\nThe first context occurs when the address of a function is needed. Consider\
    \ the following example-ple:\n\n```\nint n_elements(Matrix const&); // (1)\nint\
    \ n_elements(Vector const&); // (2)\nvoid compute()\n{\n    int (*funcPtr)(Vector\
    \ const&) = n_elements; // selects (2)\n}\n```\n\nHere, the name n_elements refers\
    \ to an overload set, but only the address of one function in that set is desired.\
    \ Overload resolution attempts to match the required function type (the type of\
    \ funcPtr in this example) to the available candidates.\nThe other context that\
    \ requires overload resolution is initialization. Unfortunately, this is a topic\
    \ fraught with subtleties that can be covered in an appendix. However, a simple\
    \ example at large illustrates this additional aspect of overload resolution:\n\
    \n\n```\n#include <string>\n```\n\n```\nclass BigNum {\npublic:\n    BigNum(long\
    \ n);\n    BigNum(double n);\n    BigNum(std::string const);\n    ...\n    operator\
    \ double();\n    operator long();\n    ...\n};\n```"
