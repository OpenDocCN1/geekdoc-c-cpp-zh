  md: "# 19.2 Determining Compound Types\n\nCompound types are types constructed from\
    \ other types. Simple compound types include plain types, pointer types, reference\
    \ types, and array types. They are constructed from a single base type. Class\
    \ types and function types are compound types, but their composition can involve\
    \ multiple types (for parameters or members). Simple compound types can be classified\
    \ using partial specialization. We start with a generic definition of a traits\
    \ describing compound types other than class types and enumeration types (the\
    \ latter are treated separately):\n\n```\n// types/type2.hpp\ntemplate<typename\
    \ T>\nclass CompoundT {\npublic:\n    enum { IsPtrT = 0, IsRefT = 0, IsArrayT\
    \ = 0,\n          IsFuncT = 0, IsPtrMemT = 0 };\n    typedef T BaseT;\n    typedef\
    \ T BottomT;\n    typedef CompoundT<void> ClassT;\n};\n```\n\nThe member BaseT\
    \ is a synonym for the immediate type T builds. BottomT, on the other hand, refers\
    \ to the ultimate nonpointer, nonreference, and nonarray type on which T is built.\
    \ For example, if T is int**, then BaseT would be int*, and BottomT would be int.\
    \ For pointer-to-member types, BaseT is the type of the member, and ClassT is\
    \ the class to which the member belongs. For example, if T is a pointer-to-member\
    \ function of type(X :*)(), then BaseT is the function type int(), and ClassT\
    \ is X. If T is not a pointer-to-member type, the ClassT is CompoundT<void> (an\
    \ arbitrary choice; you might prefer a nonclass).\n\nPartial specializations for\
    \ pointers and references are fairly straightforward:\n\n```\n// types/type3.hpp\n\
    template<typename T>\nclass CompoundT<T&> {\npublic:\n    enum { IsPtrT = 0, IsRefT\
    \ = 1, IsArrayT = 0,\n          IsFuncT = 0, IsPtrMemT = 0 };\n    typedef T BaseT;\n\
    \    typedef typename CompoundT<T>::BottomT BottomT;\n    typedef CompoundT<void>\
    \ ClassT;\n};\n```"
