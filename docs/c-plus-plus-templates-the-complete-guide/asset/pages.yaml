  md: "Because function templates can be overloaded, explicitly providing all the\
    \ arguments for a function template may not be sufficient to identify a single\
    \ function: In some cases, it identifies a set of functions. The following example\
    \ illustrates a consequence of this observation:\n\n```\ntemplate <typename Func,\
    \ typename T>\nvoid apply(Func func_ptr, T x)\n{\n    func_ptr(x);\n}\n```\n\n\
    ```\ntemplate <typename T> void single(T);\n\ntemplate <typename T> void multi(T);\n\
    template <typename T> void multi(T*);\n```\n\n```\nint main()\n{\n    apply(&single<int>,\
    \ 3); // OK\n    apply(&multi<int>, 7); // ERROR: no multi<int>\n}\n```\n\nIn\
    \ this example, the first call to apply() works because the type of the expression\
    \ &single<int> is unambiguous. As a result, the template argument for the Func\
    \ parameter is easily deduced. In the second call, however, &multi<int> could\
    \ be one of two different types and therefore Func cannot be deduced in this case.\n\
    \nFurthermore, it is possible that explicitly specifying the template arguments\
    \ for a function template results in an attempt to construct an invalid C++ type.\
    \ Consider the following overloaded function template (RT1 and RT2 are unspecified:\n\
    \n```\ntemplate<typename T> RT1 test(typename T::const*);\ntemplate<typename T>\
    \ RT2 test(...);\n```\n\nThe expression <int> makes no sense for the first of\
    \ the two function templates because type has no member X. However, the second\
    \ template has no such problem. Therefore, the expression &test<int> identifies\
    \ the address of a single function. The fact that the substitution of int into\
    \ the first template fails does not make the expression invalid.\n\nThis \"substitution-failure-is-not-an-error\"\
    \ (SFINAE) principle is clearly an important ingredient to make the overloading\
    \ of function templates practical. It also enables remarkable compile-time techniques.\
    \ For example, assuming that RT1 and RT2 are defined as follows:\n\n```\ntypedef\
    \ char RT1;\nttypedef struct { char a[2]; } RT2;\n```"
