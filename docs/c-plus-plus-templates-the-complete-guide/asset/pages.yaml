  md: "# 12.2 Overloading Function Templates\n\nin the partial ordering. Note that\
    \ the default argument of the first template is not used; hence the corresponding\
    \ parameter participates in the ordering.\n\nThe synthesized lists of argument\
    \ types are (A1*, A1 const*) and (A2 const*, A2*). Template argument deduction\
    \ of (A1*, A1 const*) versus the second template actually succeeds with the substitution\
    \ of T with A1 const, but the matching is not exact because a qualification adjustment\
    \ is needed to call t<A1 const>(A1 const*, A1 const*, A1 const = 0) with arguments\
    \ of types (A1*, A1 const*). Similarly, no exact match can be found by deducting\
    \ template arguments for the first template from the argument type list (A2 const*,\
    \ A2*). Therefore, there is no ordering relationship between the two templates,\
    \ and the call is ambiguous.\n\nThe formal rules generally result in the intuitive\
    \ selection of function templates. In a while, however, an example comes up for\
    \ which the rules do not select the intuitive choice. It is therefore possible\
    \ the rules will be revisited to accommodate such examples in the future.\n\n\
    # 12.2.4 Templates and Nontemplates\n\nFunction templates can be overloaded with\
