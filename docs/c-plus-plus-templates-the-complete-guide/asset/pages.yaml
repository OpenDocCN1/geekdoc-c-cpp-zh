  md: 'The two cases are easily distinguished because the first is followed by a simple
    identifier, whereas the second is followed by a qualified name (in other words,
    a name containing a double colon, ::). Section 5.1 on page 43 and Section 9.3.2
    on page 130 explain the need for the keyword typename in the template parameter.


    Function and array types can be specified, but they are implicitly adjusted to
    the pointer type to which they decay: Nonype template parameters are declared
    like variables, but they cannot have nontype qualifiers they can have const and
    volatile qualifiers, but if such a qualifier appears at the outermost level of
    the type parameter, it is simply ignored:


    ```

    template<int buf[5]> class Lexer; // buf is really an int*

    template<int buf*> class Lexer; // OK: this is a redeclaration

    template<int const length> class Buffer; // const is useless here

    template<int length> class Buffer; // same as previous declaration

    ```


    Finally, nontype parameters are always values: Their address cannot be taken,
    and they cannot be assigned to.


    # 8.2.3 Template Parameters


    Template template parameters are placeholders for class templates. They are declared
    like class templates, but keywords struct and union cannot be used:


    ```

    template<typename X> class C // OK

    void f(C<int>* p);

    ```


    ```

    template<typename X> struct C // ERROR: struct not valid here

    void f(C<int>* p);

    ```


    ```

    template<typename X> union C // ERROR: union not valid here

    void f(C<int>* p);

    ```


    In the scope of their declaration, template template parameters can have default
    template arguments. These default arguments apply when the corresponding parameters
    are not specified in uses of the template parameter:


    ```

    template<typename T, typename A = MyAllocator> class Container {

    class Adaptation {

    Container<int> storage; // implicitly equivalent to

    //Container<int, MyAllocator>

    ...

    };

    ```'
