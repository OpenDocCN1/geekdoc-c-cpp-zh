    \ illustrates what is in practice perhaps the most important advantage of class\
    \ type functors over pointers to functions: the ability to associate some state\
    \ (data) with the function. This is a fundamental improvement in capabilities\
    \ for callback mechanisms. We can have multiple \"instances\" of a function with\
    \ behavior that is (in a sense) parameterized."
