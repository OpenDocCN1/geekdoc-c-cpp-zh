  md: "# 8.2 Template Parameters\n\n# 8.2.1 Type Parameters\n\nType parameters are\
    \ introduced with either the keyword typename or the keyword class: The two are\
    \ entirely equivalent.² The keyword must be followed by a simple identifier and\
    \ that identifier must be followed by a comma to denote the start of the next\
    \ parameter declaration, a angle bracket (>) to denote the end of the parameterization\
    \ clause, or an equal sign (=) to denote the beginning of a default argument.\n\
    \nWithin a template declaration, a type parameter acts much like a typedef name.\
    \ For example, it is not possible to use an elaborated name of the form class\
    \ T when T is a template parameter, even if T were to be substituted by a class\
    \ type:\n\n```\ntemplate <typename Allocator>\nclass List {\n    class Allocator\
    \ allocator; // ERROR\n    friend class Allocator; // ERROR\n};\n```\n\nIt is\
    \ possible that a mechanism to enable such a friend declaration will be added\
    \ in the future.\n\n# 8.2.2 Nontype Parameters\n\nNontype template parameters\
    \ stand for constant values that can be determined at compile or link time.³ The\
    \ type of such a parameter (in other words, the type of the value for which it\
    \ stands) must be one of the following:\n\n+   - An integer type or an enumeration\
    \ type\n- A pointer type (including regular pointer types, function pointer types,\
    \ and pointer-to-member types)\n- A reference type (both references to objects\
    \ and references to functions are acceptable)\n\nAll other types are currently\
    \ excluded (although floating-point types may be added in the future, Section\
    \ 13.4 on page 210).\n\nPerhaps surprisingly, the declaration of a nontype template\
    \ parameter can in some cases also start with the keyword typename:\n\n```\ntemplate<typename\
    \ T, // a type parameter\ntype T::Allocator* Alloc> // a nontype parameter\nclass\
    \ List;\n```\n\n> ² The class keyword does not imply that the substituting argument\
    \ should be a class. It could be any accessible type. However, class types that\
    \ are defined in a function (local classes) cannot be used as template arguments\
    \ (independent of whether the parameter was declared with typename or class).\n\
    \n> ³ Template parameters do not denote types either; however, they are not considered\
    \ when talking about nontype parameters."
