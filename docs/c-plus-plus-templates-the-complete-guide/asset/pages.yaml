  md: '# Chapter 9: Names in Templates


    STL¹⁰ broke the rule in many hundreds—sometimes thousands—of places. To ease the
    transition process for their customers, HP softened the diagnostic associated
    with code that assumed that non-dependent names could be found in dependent base
    classes as follows. When a nondependent name was used in the scope of a class
    template is not found using the standard rules, aC++ peaks inside the dependent
    bases. If the name is not found in a dependent base, a warning is issued, and
    the name is marked to be treated as if it were dependent, so lookup will be reattempted
    at instantiation time.


    The lookup rule that causes a name in nondependent bases to hide an identically
    named template parameter (Section 9.4.1 on page 135) is an oversight, and it is
    not impossible that this will be changed in a revision of the standard. In any
    case, it is probably wise to avoid code with template parameter names that are
    also used in nondependent base classes.


    Andrew Koenig first proposed ADL for operator functions only (which is why ADL
    is sometimes called _Koenig lookup). The motivation was primarily aesthetic: explicitly
    qualifying operator names with their enclosing namespace looks awkward at best
    (for example, instead of a+b we need to write N::operator+(a, b)) and having to
    write declarations for every operator can lead to unwieldy code. Hence, it decided
    that operators would be looked up in the namespaces associated with arguments.
    ADL was later extended to ordinary function names to accommodate a limited kind
    of friend name injection and to support a two-phase lookup model for templates
    and their instantiations (Chapter 10). The generalized ADL rules are also called
    _extended Koenig lookup_.


    > ¹⁰ Ironically, the first of these implementations had been developed by HP as
    well.'
