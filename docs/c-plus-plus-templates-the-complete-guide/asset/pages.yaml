  md: '# Chapter 10


    # Instantiation


    Template instantiation is the process that generates types and functions from
    generic template definitions.¹ The concept of instantiation of C++ templates is
    fundamental but also somewhat intricate. One of the underlying reasons for this
    intricacy is that the definitions of entities generated by a template are no longer
    limited to a single location in the source code. The location where the template
    is used, and the locations where the template arguments are defined all play a
    role in the meaning of the entity.


    In this chapter we explain how we can organize our source code to enable proper
    template use. In addition, we survey the various methods that are used by the
    most popular C++ compilers to handle template instantiation. Although all these
    methods should be semantically equivalent, it is useful to understand basic principles
    of your compiler''s instantiation strategy. Each mechanism comes with its set
    of little quirks when building real-life software and, conversely, each influenced
    the final standards of standard C++.


    # 10.1 On-Demand Instantiation


    When a C++ compiler encounters the use of a template specialization, it will create
    specialization by substituting the required arguments for the template parameters.²
    This is done automatically and requires no direction from the client code (or
    from the template definition for matter). This on-demand instantiation sets C++
    templates apart from similar facilities in other compiled languages. It is sometimes
    called *implicit* or *automatic* instantiation.


    > ¹ The term *instantiation* is sometimes also used to refer to the creation of
    objects from types. In this book


    > ² The term *specialization* is used in the general sense of an entity that is
    a specific instance of a template (see Chapter 7). It does not refer to the *explicit
    specialization* mechanism described in Chapter 12.'
