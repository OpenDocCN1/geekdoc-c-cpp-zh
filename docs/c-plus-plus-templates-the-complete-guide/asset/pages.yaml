    # 8.3.5 Equivalence


    Two sets of template arguments are equivalent when values of the arguments are
    identical-for-one. For type arguments, typedef name does not matter: It is the
    type underlying the typedef that is compared. For non-integer arguments, the value
    of the argument is compared; how that value is expressed doesn''t matter. The
    following example illustrates this concept:


    ```

    template <typename T, int I>

    class Mix;


    typef int3* p1;


    Mix<int, 3*5*> p1;

    Mix<Int, 4+5*> p2; // p2 has the same type as p1

    ```


    A function generated from a function template is never equivalent to an ordinary
    function though they may have the same type and the same name. This has two important
    consequences for class members:


    +   1. A function generated from a member template never overrides a virtual function.

    2. A constructor generated from a constructor template is never a default copy
    constructor. Similarly, an assignment generated from an assignment template is
    never a copy-assignment operator. However, this is less prone to problems because
    implicit calls of copy-assignment operators are less common.)


    # 8.4 Friends


    The basic idea of friend declarations is a simple one: Identify classes or functions
    that have a privileged connection with the class in which the friend declaration
    appears. Matters are somewhat complicated, however, by two facts:


    +   1. A friend declaration may be the only declaration of an entity.

    2. A friend function declaration can be a definition.'
