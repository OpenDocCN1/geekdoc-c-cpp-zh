    \ that certain entities must be defined in certain circumstances. This can be\
    \ the case for class types, inline functions, and non-export templates. In the\
    \ following paragraphs we review the detailed rules:\n\nA type X (including structs\
    \ and units) must be defined in a translation unit prior to any of the following\
    \ kinds of uses in that translation unit:\n\n+   - The creation of an object of\
    \ type X (for example, as a variable declaration or through a new expression).\
    \ The creation could be indirect, for example, when an object itself contains\
    \ an object of type X being created.\n- The declaration of a data member of type\
    \ X.\n- Applying the sizeof or typeid operator to an object of type X.\n- Explicitly\
    \ or implicitly accessing members of type X.\n- Converting an expression to or\
    \ from type X using any kind of conversion, or converting an expression from a\
    \ pointer or reference to X (except void*) using an implicit cast, static_cast,\
    \ or dynamic_cast.\n- Defining a value to an object of type X.\n- Defining or\
    \ calling a function with an argument or return type of type X. Just declaring\
    \ such a function doesn't need the type to be defined.\n\nThe rules for types\
    \ also apply to types generated from class templates, which means that the corresponding\
    \ templates must be defined in those situations in which a type X must be defined.\
