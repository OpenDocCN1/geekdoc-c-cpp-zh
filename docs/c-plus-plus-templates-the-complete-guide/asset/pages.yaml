  md: "# 7.4 The One-definition Rule\n\nplaces some constraints on the redeclaration\
    \ of various entities. The totality of these constraints is known as the one-definition\
    \ rule or ODR. The details of this rule are quite complex and span a large variety\
    \ of situations. Later chapters illustrate the various resulting facets in each\
    \ applicable context, and you can find a complete description of the ODR in Appendix\
    \ A. For now, it suffices to remember the following ODR basics:\n\n+   - Noniline\
    \ functions and member functions, as well as global variables and static data\
    \ members should be defined only once across the program.\n- Class types (including\
    \ structs and unions) and inline functions should be defined at most once per\
    \ translation unit, and all these definitions should be identical.\n\nA translation\
    \ unit is what results from preprocessing a source file; that is, it includes\
    \ the contents named by #include directives.\nIn the remainder of this book, linkable\
    \ entity means one of the following: a noninline function or member function,\
    \ a global variable or a static data member, including any things generated from\
    \ a template.\n\n# 7.5 Template Arguments versus Template Parameters\n\nCompare\
    \ the following class\n\n```\ntemplate <typename T, int N>\nclass ArrayInClass\
    \ {\n  public:\n    T array[N];\n};\n```\n\nwith a similar plain class:\nclass\
    \ DoubleArrayClass {\n  public:\n    double array[10];\n};\n\nThe latter becomes\
    \ essentially equivalent to the former if we replace the parameters T and N by\
    \ double and 10 respectively. In C++, the name of this replacement is denoted\
    \ as ArrayInClass<double, 10>\n\nNote how the name of the template is followed\
    \ by so-called template arguments in angle brackets. Regardless of whether arguments\
    \ are themselves dependent on template parameters, the combination of the template\
    \ name, followed by the arguments in angle brackets, is called a template-id."
