  md: "# 17.3 A Second Example: Computing the Square Root\n\n# 17.3 A Second Example:\
    \ Computing the Square Root\n\nLet's look at a slightly more complicated example:\
    \ a metaprogram that computes the square root of a given value N. The metaprogram\
    \ looks as follows (explanation of the technique follows):\n\n```\n// meta/sqrt1.hpp\n\
    #ifndef SQRT_HPP\n#define SQRT_HPP\n\n// primary template to compute sqrt(N)\n\
    template <int N, int LO=1, int HI=N>\nclass Sqrt {\npublic:\n    // compute the\
    \ midpoint, rounded up\n    enum { mid = (LO+HI+1)/2 };\n\n    // search a not\
    \ too large value in a halved interval\n    enum { result = (N*mid*mid) ? Sqrt<N,LO,mid-1>::result\n\
    \           : Sqrt<N,mid,HI>::result };\n};\n\n// partial specialization for the\
    \ case when LO equals HI\ntemplate<int N, int M>\nclass Sqrt<N,M,M> {\npublic:\n\
    \    enum { result = M };\n};\n\n#endif SQRT_HPP\n```\n\nThe first example is\
    \ the generic recursive computation that is invoked with the template parameter\
    \ N (the value for which compute the square root) and two other optional parameters.\
    \ These optional parameters represent the minimum and maximum values the result\
    \ can have. If the template is called with only one argument, we know that the\
    \ square root is at least one and at most the value itself.\n\nOur recursion then\
    \ proceeds using a binary search technique (often called bisection in this context).\
    \ Inside the template, we compute whether result is in the first or second half\
    \ of the range between LO and HI. This differentiation is done using the conditional\
    \ operator ?: If mid² is greater than N, we continue the search in the first half.\
    \ If mid² is less than or equal to N, we use the same template for the first half\
    \ again.\n\nThe specialization that ends the recursive process is invoked when\
    \ LO and HI have the same value M, which is our final result."
