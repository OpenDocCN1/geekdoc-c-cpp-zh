  md: 'Glossary


    515


    # template argument deduction


    See deduction.


    # template-id


    The combination of a template name followed by *template arguments in angle brackets*
    (for example, std::list<int>).


    # template parameter


    A generic placeholder in a template. The most common kind of template parameter
    are *type parameters*, which represent types. *Nontype parameters* represent constant
    values of a certain type, and *template parameters* represent class classes.


    # traits template


    A template the members of which describe characteristics (traits) of the template
    arguments. Usually the purpose of traits templates is to avoid an excessive number
    of template parameters. See also-policy class.


    # translation unit


    A *dot-C* file with all the header files and standard library headers it includes
    using #include directives, minus the program text that is excluded by conditional
    compilation directives such as #if. For simplicity, it can also be thought of
    as the result of preprocessing a *dot-C* file. See *dot-C file* and header file.


    # true constant


    See constant-expression.


    # tuple


    A generalization of the C struct concept such that members can be accessed by
    number.


    # two-phase lookup


    The lookup mechanism used for names in template. The “two phases” are (1) the
    phase during a template definition is first encountered by a compiler, and (2)
    the instantiation of a template. *Nondependent base classes* are looked up only
    in the first phase, but during this phase *nondependent* are not considered. *Dependent
    names* with a scope qualifier (::) are looked up only in the second phase. Dependent
    names without a scope qualifier may be looked up in both phases, but in the second
    phase only argument-dependent lookup is performed.


    # user-defined conversion


    A type conversion defined by the programmer. It can be a *constructor* that can
    be called with one argument or a *conversion operator*. Unless it is a constructor
    declared with the keyword *explicit*, the type conversion can occur implicitly.'
  merge: -1
