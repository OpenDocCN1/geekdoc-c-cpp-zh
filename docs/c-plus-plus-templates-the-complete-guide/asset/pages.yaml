  md: "# 14.3 Dynamic versus Static Polymorphism\n\nLet's categorize and compare both\
    \ forms of polymorphism.\n\n# Terminology\n\nDynamic and static polymorphism provide\
    \ support for different C++ programming idioms³:\n\n+   * Polymorphism implemented\
    \ via inheritance is bounded and dynamic:\n    - Bounded means that the interfaces\
    \ of the types participating in the polymorphic behavior are predetermined by\
    \ the design of the common base class (other terms for this concept are invasive\
    \ or intrusive);\n    - Dynamic means that the binding of the interfaces is done\
    \ at run time (dynamically).\n* Polymorphism implemented via templates is unbounded\
    \ and static:\n    - Unbounded means that the interfaces of the types participating\
    \ in the polymorphic behavior are not predetermined (other terms for this concept\
    \ are noninvasive or non-intrusive);\n    - Static means that the binding of the\
    \ interfaces is done at compile time (statically).\n\nSo, strictly speaking, in\
    \ C+, dynamic polymorphism and static polymorphism are shortcuts for bounded dynamic\
    \ polymorphism and unbounded static polymorphism. In other languages combinations\
    \ (for example, Smalltalk provides unbounded dynamic polymorphism). However, in\
    \ the context of C++, the more concise terms dynamic polymorphism and static polymorphism\
    \ do not cause confusion.\n\n# Strengths and Weaknesses\n\nDynamic polymorphism\
    \ in C++ exhibits the following strengths:\n\n+   * Heterogeneous collections\
    \ are handled elegantly.\n* The executable code size is potentially smaller (because\
    \ only one polymorphic function is needed, whereas distinct template instances\
    \ must be generated to handle different types).\n* Code can be efficiently compiled;\
    \ hence no implementation source must be published (distributing template libraries\
    \ usually requires distribution of the source code of the template implementations).\n\
    \nIn contrast, the following can be said about static polymorphism in C++:\n\n\
    +   * Collections of built-in types are easily implemented. More generally, the\
    \ interface commonality need not be expressed through a common base class.\n*\
    \ Generated code is potentially faster (because no indirection through pointers\
    \ is needed a priori and nonvirtual functions can be inlined much more often).\n\
    * Concrete types that provide only partial interfaces can still be used if only\
    \ that part ends being exercised by the application.\n\n> ³ For a detailed discussion\
    \ of polymorphism terminology, also see Sections 6.5 to 6.7 of [Czarneckiisenecker-GenProg]."
