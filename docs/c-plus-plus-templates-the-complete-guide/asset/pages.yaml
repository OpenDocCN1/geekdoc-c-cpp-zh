  md: '# 1.3 How to Read This Book


    If you are a C++ programmer who wants to learn or review the concepts of templates,
    carefully read Part I, The Basics. If you''re quite familiar with templates already,
    it may help to skim through this part to familiarize yourself with the style and
    terminology that we use. This part also covers some of the logistical aspects
    of organizing your source code when it contains templates.


    Depending on your preferred learning method, you may decide to absorb the many
    details of templates in Part II, or instead you could read about practical coding
    techniques in Part III (and refer back to Part II for the more subtle language
    issues). The latter approach is particularly useful if you bought this book with
    concrete day-to-day challenges in mind. Part IV is similar to Part III, but the
    emphasis is on how templates can contribute to specific applications rather than
    design techniques. It is therefore best to familiarize yourself with the topics
    of Part III before delving into Part IV.


    The appendices contain much useful information that is often referred to in the
    main text. We have also tried to make them interesting in their own right.


    In our experience, the best way to learn something new is to look at examples.
    Therefore, you''ll find a lot of examples in the book. Some are a few lines of
    code illustration of an abstract concept, whereas others are complete programs
    that provide a concrete application of the material. The later kind of examples
    will be described by a C++ comment describing the file containing the program
    code. You can find these files at the Web site of this book at http://www.joussitt.com/tmplbook/


    # 1.4 Some Remarks About Programming Style


    C++ programmers use different programming styles, and so do we: The usual questions
    about where to use whitespace, delimiters (braces, parentheses), and so forth
    come. We tried to be consistent in general, although we occasionally make concessions
    to the topic at hand. For example, in tutorial sections we may prefer more of
    whitespace and concrete names to visualize code, whereas in more advanced discussions
    a more compact style would be more appropriate.


    We want to draw your attention to one slightly uncommon decision regarding the
    declaration of types, parameters, and variables. Clearly, several styles are possible:


    ```

    void foo (const int&);

    void foo (const int& x);

    void foo (const int&);

    void foo (const int&);

    ```


    Although it is a bit less common, we decided to use the order const rather than
    const for "constant integer." We have two reasons for this. First, it provides
    for an easier answer to the question,"What is constant?" It''s always what is
    in front of the const qualifier. Indeed, although


    ```

    const int N = 100;

    ```


    is equivalent to


    ```

    const int N = 100;

    ```'
