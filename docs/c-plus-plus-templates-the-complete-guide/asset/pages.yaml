  md: "# Chapter 5\n\n# Tricky Basics\n\nThis chapter covers some further basic aspects\
    \ of templates that are relevant to the practical use of templates: an additional\
    \ use of the typename keyword, defining member functions and nested classes as\
    \ templates, template template parameters, zero initialization, and some details\
    \ about using string literals as arguments for function templates. These aspects\
    \ can be tricky at times, but every day-to-day programmer should have heard of\
    \ them.\n\n# 5.1 Keyword typename\n\nThe keyword typename was introduced during\
    \ the standardization of C++ to clarify that an identifier inside a template is\
    \ a type. Consider the following example:\n\n```\ntemplate <typename>\nclass MyClass\
    \ {\n    typename T::SubType *;\n    ...\n};\n```\n\nHere, the second typename\
    \ is used to clarify that SubType is a type defined within class T. Thus, ptr\
    \ is a pointer to the type T ::SubType.\n\nWithout typename, SubType would be\
    \ considered a static member. Thus, it would be a concrete variable or object.\
    \ As a result, the expression\n\n```\nT::SubType * ptr\n```\n\nwould be a multiplication\
    \ of the static SubType member of class T with ptr.\n\nIn general, typename has\
    \ to be used when a name that depends on a template parameter is a type. This\
    \ is discussed in detail in Section 9.3.2 on page 130.\n\nA typical application\
    \ of typename is the access to iterators of STL containers in template code:"
