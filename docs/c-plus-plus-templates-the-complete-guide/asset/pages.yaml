  md: "# 21.3 Tuple Construction\n\nNote the shifting pattern when passing the parameters\
    \ to the recursive step. Because we derive from a base type that defines members\
    \ T1 and T2, we use template parameter names of the form Pn instead of the usual\
    \ Tn.\n\nWe need a partial specialization to end this recursion with the derivation\
    \ from a nonrecursive duo:\n\n```\n// specialization to end deriving recursion\n\
    template <typename P1, typename P2>\nclass Tuple<P1,P2,NullT,NullT> : public Duo<P1,P2>\
    \ {\npublic:\n    typedef Duo<P1,P2> BaseT;\n    Tuple() {}\n    Tuple(TypeOp<P1>::RefConstT\
    \ a1,\n         TypeOp<P2>::RefConstT a2,\n         TypeOp<NullT>::RefConstT =\
    \ NullT(),\n         TypeOp<NullT>::RefConstT = NullT(),\n         TypeOp<NullT>::RefConstT\
    \ = NullT())\n    : BaseT(a1, a2) {\n}\n;\n```\n\nA declaration such as\n\n```\n\
    Tuple<bool,int,float,double> t4(true,42,13,1.95583);\n```\n\nends up in the hierarchy\
    \ shown in Figure 21.1.\n\nThe other specialization takes care of the case when\
    \ the tuple is really a singleton:\n\n```\n// specialization for <typename P1>\n\
    template class Tuple<P1,NullT,NullT,NullT> : public Duo<P1,void> {\npublic:\n\
    \    typedef Duo<P1,void> BaseT;\n    Tuple() {}\n    Tuple(TypeOp<P1>::RefConstT\
    \ a1,\n         TypeOp<NullT>::RefConstT = NullT(),\n         TypeOp<NullT>::RefConstT\
    \ = NullT())};\n```\n\n> A very curious lookup in C++ prefers names inherited\
    \ from nondependent base classes over template parameter names. This should not\
    \ be a problem in this case because the base class is dependent, but some compilers\
    \ still get this at the wrong time of this writing."
