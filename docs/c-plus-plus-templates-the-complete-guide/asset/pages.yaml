  md: '# 6.3.2 Limitations of the Separation Model


    At this point it is reasonable to wonder why we''re still advocating the inclusion
    approach when exported templates seem to offer just the right magic to make things
    work. There are a few different aspects to this choice.


    First, even four years after the standard came out, one company has actually implemented
    support for the export keyword. Therefore, experience with this feature is not
    as widespread as other C++ features. Clearly, this also means that at this point
    experience with exported templates is fairly limited, and all our observations
    will inevitably have to be taken with a grain of salt.


    Second, although export may seem quasi-magic, it is not actually magical. Ultimately,
    the instantiation process needs to deal with the place where the template is instantiated
    and the place where its definition appears. Hence, although these two seem decoupled
    in the source code, there is an invisible coupling that the system establishes
    between the scenes. This may mean, for example, if the file containing the definition
    changes, both that file and all the files that instantiate the templates in that
    file need to be recompiled. This is not substantially different from the inclusion
    approach, but it is no longer obvious in the source code. As a consequence, dependency
    management tools (such as the popular make and cmake programs) that use traditional
    source-based techniques no longer work. It also means a few bits of extra processing
    by the compiler are needed to keep all the bookkeeping straight; and in the end,
    the build times may be better than those of the inclusion approach.


    Finally, exported templates may lead to surprising consequences, the details of
    which are explained in Chapter 10.


    A common misconception is that the export mechanism has the potential of being
    able to ship libraries of templates without revealing the source code for their
    definitions (like libraries of nontemplate entities). This is a misconception
    in the sense that hiding code is not a language issue: it would be possible to
    provide a mechanism to hide included template definitions. Although this may be
    feasible (the current implementations do not support this model), it unfortunately
    creates new challenges in dealing with template compilation errors that need to
    refer to the hidden source code.


    # 6.3.3 Preparing for the Separation Model


    One workable idea is to prepare our sources in such a way that we can easily switch
    between the inclusion and export models using a harmless dose of preprocessor
    directives. Here is how it can be done for our simple example:


    ¹ As as we know, Edison Design Group, Inc. (EDG) is still that company (see [EDG]).
    Their technology is available through other vendors, however.


    ² Not everybody considers this closed-source approach as plus.'
