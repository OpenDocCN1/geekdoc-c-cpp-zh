  md: "```\ntemplate<typename T, typename A1, typename A2>\nclass A_mult {\npublic:\n\
    \    operator Copier<T, A_Mult<T, A1, A2> ();\n    ...\n};\n```\n\nThis adds another\
    \ level of complexity and some additional run-time cost to expression templates,\
    \ but even so the performance benefits were impressive at the time.\n\nThe C++\
    \ standard library contains a class template valarray that was meant to be used\
    \ for applications that would justify the techniques used for the Array template\
    \ developed in this chapter. A precursor of valarray was designed with the intention\
    \ that compilers at the market for scientific computation would recognize the\
    \ array type and use highly optimized internal code for their operations. These\
    \ compilers would be “understood” in the types some sense. However, this never\
    \ happened (in part because the market is relatively small and in part the problem\
    \ grew in complexity as valarray became a template). Some after the expression\
    \ template technique was discovered, one (Vandeouver submitted to the C++ committee\
    \ a proposal that turned valarray essentially into the Array template we developed\
    \ (with bells and whistles inspired by the existing valarray functionality). The\
    \ proposal was the first time the concept of the Rep parameter was documented.\
    \ Prior to this, the arrays with actual storage and the expression template pseudo-arrays\
    \ were different templates. When client code introduced a function foo() accepting\
    \ an array—for example,\n\n```\ndouble foo(Array<double> const&);\n```\n\ncalling\
    \ foo(1.2*x) forced the conversion for the expression template to an array with\
    \ actual storage, even when the operations applied to argument did not require\
    \ a temporary. With expression templates embedded in the Rep argument it is possible\
    \ to declare\n\n```\ntemplate<typename Rep, Rep>\ndouble foo(Array<double> const&);\n\
    ```\n\nand no conversion helps unless one is actually needed.\n\nThe valarray\
    \ proposal came late in the C++ standardization process and practically wrote\
    \ all the text regarding valarray in the standard. It was rejected as a result,\
    \ and instead, a few tweaks were added to the existing text to allow implementations\
    \ based on expression templates. However, the exploitation of this allowance remains\
    \ much more cumbersome than what was discussed here. At the time of this writing,\
    \ no such implementation is known, and standard valarrays are, generally speaking,\
    \ quite inefficient at performing the operations for which they were designed."
