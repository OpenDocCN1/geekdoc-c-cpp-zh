  md: "# # Appendix B\n\n# # Overload Resolution\n\nOverload resolution is the process\
    \ that selects the function to call for a given call expression. Consider the\
    \ following simple example:\n\n```\n```cpp\nvoid display_num(int);    // (1)\n\
    void display_num(double); // (2)\n\nint main() {\n    display_num(399);      //\
    \ matches (1) better than (2)\n    display_num(3.9);      // matches (2) better\
    \ than (1)\n}\n```\n```\n\nIn this example, the function name display_num() is\
    \ said to be overloaded. When this name is used in a call, a C++ compiler must\
    \ therefore distinguish between the various candidates using additional information;\
    \ most, this information is the types of the call arguments. In our example it\
    \ makes intuitive sense to call the int version when the function is called with\
    \ an integer argument and the double version when a floating-point argument is\
    \ provided. The formal process that attempts to model this intuition is the overload\
    \ resolution process.\n\nThe general idea behind the truth that overload resolution\
    \ are simple enough, but the details have become quite complex during the C++\
    \ standardization process. This complexity is driven mostly by the desire to support\
    \ various real-world examples that intuitively (to a human) seem to have an “obvious\
    \ best match,” but when trying to formalize this intuition, various subtleties\
    \ arose.\n\nIn this appendix we provide a reasonably detailed survey of overload\
    \ resolution rules. However, the complexity of this process is such that we do\
    \ not claim to cover every part of the topic."
