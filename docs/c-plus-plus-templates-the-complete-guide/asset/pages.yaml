  md: '# Chapter 22: Function Objects and Callbacks


    The details are beyond the scope of this book. If you are curious about this topic,
    a good introduction can be found in Stan Lippmann Inside the C++ Object Model
    (see [LippmanObjMod]). You will also find that pointers to data members are typically
    not pointers at all, but the offsets needed to get from this to a given field
    (a single word of storage is sufficient for their representation).


    Finally, note how "getting a member function through a pointer-to-member function"
    is a binary operation involving not only the pointer but also the object to which
    the pointer is applied. Special, pointer-to-member dereferencing operators * and
    ->* were introduced into the language:


    ```

    (obj.*pmf) (...) // call member function, which pmf refers, for obj

    (ptr->*pmf) (...) // call member function, to which pmf refers, for object,

    // to which ptr refers

    ```


    In contrast, "getting an ordinary function through a pointer" is a unary operation:

    (*ptr)


    The dereferencing operator can be left out because it is implicit in the function
    call operator. The previous expression is therefore usually written as

    ptr()


    There is no such implicit form for pointers to member functions.⁴


    # 22.4 Class Type Functors


    Although pointers to functions are directly available in the language, there are
    many situations in which it is advantageous to use a class type object with an
    overloaded function call operator. Doing so can lead to added flexibility, added
    performance, or both.


    # 22.4.1 A First Example of Class Type Functors


    Here is a very simple example of a class type functor:


    ```

    // functors/functor1.cpp

    #include <iostream>


    // class for function objects that return constant value

    class ConstantIntFunctor {

    private:

    ```


    > ⁴ There is also no implicit decay of a member function name as MyType::print
    to a pointer to that member. The ampersand is always required (for example, &MyType::print).
    For ordinary functions, the implicit decay of f to &f is well known.'
