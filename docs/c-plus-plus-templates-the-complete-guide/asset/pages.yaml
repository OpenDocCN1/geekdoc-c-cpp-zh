    \ that the implementation of a specialization might look very different from the\
    \ implementation of the primary template.\n\n# 3.4 Partial Specialization\n\n\
    Class templates can be partially specialized. You can specify special implementations\
    \ for particular circumstances, but some template parameters must still be defined\
    \ by the user. For example, the following class template\n\n```\ntemplate <typename\
    \ T1, typename T2>\nclass MyClass {\n  ...\n};\n```\n\nthe following partial specializations\
    \ are possible:\n\n```\n// partial specialization: both template parameters have\
    \ same type\ntemplate <typename T>\nclass MyClass<T,T> {\n  ...\n};\n```\n\n```\n\
    // partial specialization: second type is int\ntemplate <typename T>\nclass MyClass<T,int>\
    \ {\n  ...\n};\n```\n\n```\n// partial specialization: both template parameters\
    \ are pointer type\ntemplate <typename T1, typename T2>\nclass MyClass<T1*,T2*>\
    \ {\n  ...\n};\n```\n\n> 2 In fact, there is a benefit for using a deque instead\
    \ of a vector to implement a stack: A deque frees memory when elements are removed,\
    \ and it can't happen that elements have to be moved as a result of reallocation.\
    \ However, this is no particular benefit for strings. For this reason it is probably\
    \ a good idea to use a deque in the primary class template (as is the case in\
    \ class std::stack<> of the C++ standard library)."
