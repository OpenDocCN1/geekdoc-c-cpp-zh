    switch (this->param_num) {\ncase 1:\n    return F::operator()(v, p1, p2);\ncase\
    \ 2:\n    return F::operator()(p1, v, p2);\ncase 3:\n    return F::operator()(p1,\
    \ p2, v);\ndefault:\n    return F::operator()(p1, p2); // or an error?\n}\n```\n\
    \nOf the three binding aspects, this is probably the one that needs to become\
    \ dynamic the least. In what follows, we keep this as a template parameter so\
    \ that it is a static selection.\n\nTo make the selection of the functor dynamic,\
    \ it is sufficient to add a constructor that accepts a functor to our binder.\
    \ Similarly, we can also pass the bound value to the constructor, but this requires\
    \ us to provide storage in the binder to hold the bound value. The two helper\
    \ templates are used to hold bound values at compile time and run time respectively:\n\
    \n```\ntemplate <typename T>\nclass BoundVal {\nprivate:\n    T value;\npublic:\n\
