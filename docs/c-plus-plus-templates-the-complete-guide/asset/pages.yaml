  md: "# # Chapter 16\n\n# # Templates and Inheritance\n\nA priori, there might be\
    \ no reason to think that templates and inheritance interact in interesting ways.\
    \ If anything, we know from Chapter 9 that deriving from dependent base classes\
    \ forces us to deal carefully with unqualified names. However, it turns out that\
    \ some interesting techniques make use of so-called parameterized inheritance.\
    \ In this chapter we describe a few of these techniques.\n\n#  16.1 Named Template\
    \ Arguments\n\nVarious template techniques sometimes cause a class template to\
    \ end up with many different template type parameters. However, many of these\
    \ parameters often have reasonable default values. A natural way to define such\
    \ a class template may look as follows:\n\n```\ntemplate<typename Policy1 = DefaultPolicy1,\n\
    \    typename Policy2 = DefaultPolicy2,\n    typename Policy3 = DefaultPolicy3,\n\
    \    typename Policy4 = DefaultPolicy4>\nclass BreadSlicer {\n\n};\n```\n\nPresumably,\
    \ such a template can often be used with the default template argument values\
    \ using the syntax BreadSlicer<>. However, if a nondefault argument must be specified,\
    \ all preceding arguments must be specified too (even though they may have the\
    \ default value)."
