  md: '# 9.3 Parsing Templates


    invalid and your C++ compiler should complain at instantiation time. Note that
    this use of typename is different from the use to denote template type parameters.
    Unlike type parameters, you cannot equivalently replace typename with class. The
    typename prefix to a name is *required* when the name


    +   1. Appears in a template


    +   2. Is qualified


    +   3. Is not used as a list of base specifications or in a list of member initializers
    introducing a constructor definition


    +   4. Is dependent on a template parameter


    Furthermore, the typename prefix is *not allowed* at least the first three previous
    conditions hold. To illustrate this, consider the following erroneous example:


    ```

    template<typename1 T>

    struct S: typename2 XT>:::Base {

    S(): typename3 XT>:::Base(typename4 XT>::Base(0)) {}

    type5 X<T> f() {

    type6 X<T>::C * p; // declaration of pointer p

    XT::D * q; // multiplication!

    type7 X<int>::C * s;

    };

    ```


    ```

    struct U {

    type8 X<int>::C * pc;

    };

    ```


    Each occurrence of typename—correct or not—is numbered with a subscript for easy
    reference. The first, typename_1, indicates a template parameter. The previous
    rules do not apply to this first use. The second and third typename are disabled
    by the third item in the previous rules. Names of base classes in these contexts
    cannot be preceded by typename. However, typename_4 is required. The name of the
    base class is not used to denote what is being initialized or derived from. Instead,
    the name is part of an expression to construct a temporary X<T>::Base from its
    argument 0. The fifth typename is prohibited because the name that follows it,
    X<T>, is not a qualified name. The sixth occurrence is required if this statement
    is to declare a pointer. The next line omits the typename keyword and therefore,
    interpreted by the compiler as a multiplication. The seventh typename is optional
    because it satisfies all the previous rules except the last. Finally, typename_8
    is prohibited because it is not used inside a template.


