    \ typename CompoundT<T>:::BottomT BottomT;\n    typedef CompoundT<void> ClassT;\n\
    };\n```\n\n```\ntemplate<typename T, typename C>\nclass CompoundT<T C*> { // partial\
    \ specialization for pointer-to-members\n```"
