  md: "# The C++ Instantiation Model\n\nTemplate instantiation is the process of obtaining\
    \ a regular class or function from a corresponding template entity by appropriately\
    \ substituting the template parameters. This may sound fairly straightforward-forward,\
    \ but in practice many details need to be formally established.\n\n# Two-Phase\
    \ Lookup\n\nIn Chapter 9 we saw that dependent names cannot be resolved when parsing\
    \ templates. Instead, they are looked up again at the point of instantiation.\
    \ Nondependent names, are looked up early so that many errors can be diagnosed\
    \ when the template is first seen. This leads to the concept of *two-phase lookup*:\
    \ The first phase is the parsing of a template, and the second phase is its instantiation.\n\
    \nDuring the first phase, nondependent names are looked up while the template\
    \ is being parsed using both the *ordinary lookup* rules and, if applicable, the\
    \ rules for argument-dependent lookup (ADL). Unqualified dependent names (which\
    \ are dependent because they look like the name of a function in a call with dependent\
    \ arguments) are also looked up, but the result of a lookup is not considered\
    \ complete until an additional lookup is performed when the template is instantiated.\n\
    \nDuring the second phase, occurs when templates are instantiated at a point called\
    \ the *point of instantiation (POI)*, dependent qualified names are looked up\
    \ (with the template parameters replaced with the template arguments for that\
    \ specific instantiation), and an additional ADL is performed for the dependent\
    \ names.\n\n# Points of Instantiation\n\nWe have already illustrated that there\
    \ are points in the source of template clients where a C++ programmer must have\
    \ access to the declaration or the definition of a template entity. A *point of\
    \ instantiation (POI)* is created when a code construct refers to a template specialization\
    \ in such a way that the definition of the corresponding template needs to be\
    \ instantiated to create specialization. The POI is a point in the source where\
    \ the substituted template could be inserted. For example:\n\n```\nclass MyInt\
    \ {\npublic:\n    MyInt(int i);\n};\n```\n\n```\nMyInt operator - (MyInt const&);\n\
    bool operator > (MyInt const&, MyInt const&);\n```\n\n⁵ Beside *two-phase lookup*,\
    \ terms such as *two-stage lookup* or *two-phase name lookup* are also used."
