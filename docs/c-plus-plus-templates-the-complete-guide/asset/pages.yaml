    Indeed, the space between the two angle brackets is not optional. Without whitespace,
    the > characters combine into a right shift >> and hence are never treated as
    two tokens. This is a consequence of the so-called maximum tokenization principle:
    a C++ implementation must collect as many consecutive characters as possible into
    a token.


    This particular issue is a very common stumbling block for generic templates.
    Several C++ compilers therefore have been modified to recognize this situation
    and treat the >> as separate as in this particular situation, with a warning that
    it is not valid C++. The C++ committee is also considering mandating this behavior
    in a revision of the standard (see Section 13.1 on page 205).


