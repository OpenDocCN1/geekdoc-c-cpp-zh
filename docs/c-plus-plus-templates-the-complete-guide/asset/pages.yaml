  md: "# 3.1 Implementation of Class Stack\n\nHere again, the keyword class can be\
    \ used instead of typename:\n\n```\ntemplate <class>\nclass Stack {\n  ...\n};\n\
    \n```\n\nInside the class template, T can be used just like any other type to\
    \ declare members and member functions. In this example, T is used to declare\
    \ the type of the elements as vector of Ts, to declare push() as a member function\
    \ that gets a constant T as an argument, and to declare pop() as a function that\
    \ returns a T:\n\n```\ntemplate <typename T>\nclass Stack {\n  private:\n    std::vector<T>\
    \ elems; // elements\n\n  public:\n    Stack(); // constructor\n    void push(const\
    \ T&); // push element\n    void pop(); // pop element\n    T top() const; //\
    \ return top element\n}\n```\n\nThe type of this class is Stack<T>, with T being\
    \ template parameter. Thus, you have to use Stack<T> whenever you use the type\
    \ of this class in a declaration. If, for example, you have to declare your own\
    \ copy constructor and assignment operator, it looks like this¹:\n\n```\ntemplate\
    \ <typename T>\nclass Stack {\n  ...\n    Stack(Stack<T> const&); // copy constructor\n\
    \    Stack<T>& operator=(Stack<T> const&); // assignment operator\n  ...\n}\n\
    ```\n\nHowever, when the name and not the type of the class is required, only\
    \ Stack has to be used. This is the case when you specify the name of the class,\
    \ the constructors, and the destructor.\n\n> ¹ According to the standard, there\
    \ are some exceptions to this rule (see Section 9.2.3 on page 126). However, to\
    \ be sure, you should always write the full type when the type is required."
