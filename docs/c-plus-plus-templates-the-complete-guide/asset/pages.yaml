  md: "2.3 Template Parameters\n\n# 2.3 Template Parameters\n\nFunction templates\
    \ have two kinds of parameters:\n\n+   1. Template parameters, which are declared\
    \ in angle brackets before the function template name:\ntemplate <typename T>\
    \ //T is template parameter\n\n+   2. Call parameters, which are declared in parentheses\
    \ after the function template name:\nmax (T const& a, T const& b) // a and b are\
    \ call parameters\n\nYou may have as many template parameters as you like. However,\
    \ in function templates (unlike class templates) no default template parameters\
    \ can be specified.³ For example, you could define the max() template for call\
    \ parameters of two different types:\n\n```\ntemplate <typename T1, typename T2>\n\
    inline T1 max(T1 const& a, T2 const& b)\n{\n    return a < b ? b : a;\n}\n```\n\
    \n```\nmax(4,4.2) // OK, but type of first argument defines return type\n```\n\
    \nThis may appear to be a good method to enable two call parameters of different\
    \ types to the max() template, but in this it has its drawbacks. The problem is\
    \ that the return type must be declared. If you use one of the parameter types,\
    \ the argument for the other parameter might get converted to this type, regardless\
    \ of the caller's intention. C++ does not provide a means to specify choosing\
    \ “the more powerful type” (however, you can provide this feature by some tricky\
    \ template programming, Section 15.2.4 on page 271). Thus, depending on the argument\
    \ order the maximum of 42 and 66.66 might be the double 66.66 or the int 66. Another\
    \ drawback is converting the type of the second parameter into the return type\
    \ creates a new, local temporary object. As a consequence, you cannot return the\
    \ result by reference⁴ In our example, the return type has to be T1 instead of\
    \ T const.\n\nBecause the types of the call parameters are constructed from the\
    \ template parameters, template and call parameters are usually related. We call\
    \ this function template argument deduction. It allows you to call a function\
    \ template as you would an ordinary function.\n\nHowever, as mentioned earlier,\
    \ you can instantiate a template explicitly for certain types:\n\n> ³This restriction\
    \ is mainly the result of a historical glitch in the development of function templates.\
    \ There are probably no technical hindrances to implementing such a feature in\
    \ modern C++ compilers, and in the future it will probably be available (see Section\
    \ 13.3 on page 207).\n\n> ⁴You are not allowed to return values by reference if\
    \ they are local to a function because you would return something that doesn't\
    \ exist when the program leaves the scope of function."
