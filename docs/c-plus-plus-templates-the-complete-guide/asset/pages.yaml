    \ because data members are added. By using a private nested class we avoid potential\
    \ conflicts with client code.\n\n# 20.2.9 Comparisons\n\nWe conclude our discussion\
    \ of counting pointers with the development of various operators for pointers.\
    \ Built-in pointers support both equality operators (== and !=) and ordering operators\
    \ (<, <=, and so forth)\n\nFor built-in pointers, ordering operators are guaranteed\
    \ to work only on two pointers that point to the same object, but this is not\
    \ a useful scenario for counting pointers. Counting pointers always point to a\
    \ single object or to the head of an array. Thus, we don't discuss these operators\
    \ in the text that follows. (However, the operators could be implemented for CountingPtr\
    \ along the same lines as the equality operators if an ordering was needed among\
    \ CountingPtrs.)\n\nHere are the details of operator == (operator != is similar):\n\
    \n```\ntemplate T, typename CounterPolicy = SimpleReferenceCount, typename ObjectPolicy\
    \ = StandardObjectPolicy>\nCountingPtr : private CountingPolicy, {\n\npublic:\n\
    \    friend bool operator==(CountingPtr<T,CP,OP> const& cp,\n        T const*\
    \ p) {\n        return cp.operator->() == p;\n    }\n    friend bool operator==(T\
    \ const* p,\n        CountingPtr<T,CP,OP> const& cp) {\n        return p == cp.operator->();\n\
    \    }\n;\n```\n\n```\ntemplate <typename T1, T2, typename CP, typename OP>\n\
