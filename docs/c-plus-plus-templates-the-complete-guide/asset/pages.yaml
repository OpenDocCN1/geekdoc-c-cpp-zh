    \n```\ntemplate<typename T>\nMyString<T> truncate(MyString<T> const&, int);\n\
    ```\n\n```\nint main()\n{\n  MyString<char> str1, str2;\n  str1 = truncate<char>(\"\
    Hello World\", 5); // OK\n  str2 = truncate(\"Hello World\", 5); // ERROR\n}\n\
    ```\n\nThe implicit conversion provided when the converting constructor is not\
    \ considered during template argument deduction. The assignment to str2 finds\
    \ no viable function truncate(); hence overload resolution is not performed at\
    \ all.\nThe previous principles are only a first approximation, but they cover\
    \ many cases. There are yet quite a few common situations that are not adequately\
    \ explained by these rules. We proceed with a brief discussion of the most important\
    \ refinements of these rules.\n\n# B.2.1 The Implied Argument for Member Functions\n\
    \nCalls to nonstatic member functions have a hidden parameter that is accessible\
    \ in the definition of the member function as *this. For a member function of\
    \ a class MyClass, the hidden parameter is usually of type MyClass& (for non-const\
    \ member functions) or MyClass const& (for const member functions). This is what\
    \ surprising, but this was part of an early version of C++ before reference types\
    \ were part of the language, and by the time reference types were added, too much\
    \ code already depended on this being a pointer.\nThe hidden *this parameter participates\
    \ in overload resolution just like the explicit parameters. Most of the time is\
    \ quite natural, but occasionally it comes unexpectedly. This example shows a\
    \ string-like class that does not work as intended (yet we have seen such code\
    \ in the real world):\n\n> It could also be of type MyClass volatile& or MyClass\
    \ const volatile& if the member function was volatile, but this is extremely rare."
