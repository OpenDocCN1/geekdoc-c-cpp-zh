  md: "# # Chapter 4\n\n# ## Nontype Template Parameters\n\nFor function and class\
    \ templates, template parameters don't have to be types. They can also be ordinary\
    \ values. As with templates using type parameters, you define code for which a\
    \ certain detail remains open until the code is used. However, the detail that\
    \ is open is a value instead of a type. When using such a template, you have to\
    \ specify this value explicitly. The resulting code then gets instantiated. This\
    \ chapter illustrates this feature for a new version of the stack template. In\
    \ addition, we show an example of nontype function template parameters and discuss\
    \ some restrictions to this technique.\n\n# ### 4.1 Nontype Class Template Parameters\n\
    \nIn contrast to the sample implementations in previous chapters, you can also\
    \ implement a stack by using a fixed-size array for the elements. An advantage\
    \ of this is that the method memory management overhead, whether performed by\
    \ you or by a standard container, is avoided. However, determining the best size\
    \ for such a stack can be challenging. The smaller the size you specify, the more\
    \ likely it is that the stack will get full. The larger the size you specify,\
    \ the more likely it is that memory will be reserved unnecessarily. A good solution\
    \ is to let the user of the stack specify the size of the array as the maximum\
    \ size needed for stack elements.\n\nTo do this, define the size as a template\
    \ parameter:\n\n```\n// basics/stack4.hpp\n#include <stdexcept>\ntemplate <typename\
    \ T, int MAXSIZE>\nclass Stack {\nprivate:\n    T elems[MAXSIZE]; // elements\n\
    \    int numElems; // current number of elements\n```"
