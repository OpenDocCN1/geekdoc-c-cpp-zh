  md: "# 5.2 Using this->\n\nThe strange construct in this example is .template. Without\
    \ extra use of template, the compiler does not know that the less-than token (<)\
    \ that follows is not really \"less than\" but the beginning of a template argument\
    \ list. Note that this is a problem only if the construct before the period depends\
    \ on a template parameter. In our example, the parameter bs depends on the template\
    \ N.\n\nIn conclusion, the .template notation (and similar notations such as ->template)\
    \ should be used only inside templates and only if they follow something that\
    \ depends on a template parameter. See Section 9.3.3 on page 132 for details.\n\
    \n# 5.2 Using this->\n\nFor class templates with base classes, using a name x\
    \ by itself is not always equivalent to this->xx, even though a x is inherited.\
    \ For example:\n\n```\ntemplate <typename T>\nclass Base {\n    public:\n    void\
    \ bar();\n};\n\ntemplate <typename T>\nclass Derived : Base<T> {\n    public:\n\
