    of constraints that may be imposed on template parameters. In this section we
    deal mostly with the constraints that lead to compilation errors when violated,
    and we call these syntactic constraints. Syntactic constraints can include the
    need for a certain kind of constructor to exist, for a particular function call
    to be unambiguous, and so forth. The other kind of constraint we call semantic
    constraints.


