  md: "# 22.4.2 Type of Class Functors\n\nThere is more to class type functors than\
    \ the addition of state information, however. In fact, if class functor does not\
    \ encapsulate any state, its behavior is entirely subsumed by its type, and it\
    \ is sufficient to pass the type as a template argument to customize a library\
    \ component's behavior.\n\nA classic illustration of this special case includes\
    \ containers that maintain their elements in some sorted order. The sorting criterion\
    \ becomes a template argument, and because it is part of the container's type,\
    \ accidental mixing of containers with different sorting criteria (for example,\
    \ if an assignment) is caught by the type system.\n\nThe set and map containers\
    \ of the C++ standard library are parameterized this way. For example, if we define\
    \ two different sets using the same element type, Person, but different sorting\
    \ criteria, a comparison of the sets results in a compile-time error:\n\n```\n\
    #include <set>\n\nclass Person {\n  ...\n}\n\nclass PersonSortCriterion {\npublic:\n\
    \    bool operator()(Person const& p1, Person const& p2) const {\n        // returns\
    \ whether p1 is “less than” p2\n        ...\n    }\n};\n\nvoid foo() {\n    std::set<Person,\
    \ std::less<Person>> c0, c1; // sort with operator <\n    std::set<Person, std::greater<Person>>\
    \ c2; // sort with operator >\n    std::set<Person, PersonSortCriterion> c3; //\
    \ sort with user-\n\n    c0 = c1; // OK: identical types\n    c1 = c2; // ERROR:\
    \ different types\n    ...\n    if (c1 == c3) { // ERROR: different types\n  \
    \      ...\n    }\n}\n```"
