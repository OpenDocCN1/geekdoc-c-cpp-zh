  md: "fast registers and preventing many optimizations that involve the movement\
    \ of machine code (the function call often forms a barrier for code motion).\n\
    \nAdvanced C++ compilation systems exist that are capable of tracking many instances\
    \ of such potential aliasing (in the scope of foo(), the expression r is an alias\
    \ for the object named in the scope of foo()). However, this ability comes at\
    \ a price: compilation speed, resource usage, and code reliability. Projects that\
    \ build in minutes take hours or even days to be compiled (provided the necessary\
    \ gigabytes of memory are available to the compiler). Furthermore, such compilation\
    \ systems are much more complex and are therefore more prone to generating wrong\
    \ code. Even when a superoptimizing compiler generates correct code, source code\
    \ may contain unintended violations of subset C and C++ aliases.² Some of these\
    \ violations are fairly harmless with ordinary optimizers, but superoptimizers\
    \ may turn them into true bugs.\n\nHowever, ordinary optimizers can be helped\
    \ tremendously by the process of inlining. Suppose f1(), f2(), and f3() are declared\
    \ inline. The compiler can then transform the code of foo() to something equivalent\
    \ to\n\n```\nint foo()\n{\n    int param = 0;\n    int answer = 0;\n    answer\
    \ = ++(int&param);\n    return answer + param;\n}\n```\n\nwhich a very ordinary\
    \ optimizer can turn into\n\n```\nint foo()\n{\n    return 2;\n}\n```\n\nThis\
    \ illustrates the benefit of inlining lies not only in the avoidance of executing\
    \ machine code for a calling sequence but also (often more important) in making\
    \ visible to an optimizer what happens to the variables passed to the function.\n\
    \nWhat does this have to do with templates? Well, as we see later, it is sometimes\
    \ using template-based callbacks to generate code that involves direct or even\
    \ inline calls when more traditional callbacks would result in indirect calls.\
    \ The savings in running time can be considerable.\n\n> ²For example, accessing\
    \ an unsigned int through a pointer to a regular (signed) int is such an error."
