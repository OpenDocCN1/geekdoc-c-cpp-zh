  md: "# 12.2.3 Formal Ordering Rules\n\nIn our example it may seem very intuitive\
    \ that the second template is “more special” than the first because the first\
    \ can accommodate just about any argument type where the second only pointer types.\
    \ However, other examples are not necessarily intuitive. In what follows, we describe\
    \ the exact procedure to determine whether one function participating in an overload\
    \ set is more specialized than the other. However, note that these are partial\
    \ ordering rules: It is possible that given two templates neither be considered\
    \ more specialized than the other. If overload resolution must select between\
    \ two such templates, no decision can be made, and the program contains an ambiguity\
    \ error.\n\nLet’s assume we are identifying two named function templates ft1 and\
    \ ft2 that seem viable for a generic function call. Call parameters that are covered\
    \ by a default argument and ellipsis parameters that are not used are ignored\
    \ in follows. We then synthesize artificial lists of argument type (or for conversion\
    \ templates, a return type) by substituting each template parameter as follows:\n\
    \n+   1. Replace each template parameter with a unique “made up” type.\n2. Replace\
    \ each template parameter with a unique “made up” class template.\n3. Replace\
    \ each nontype template parameter with a unique “made up” value of the appropriate\
    \ type. If argument deduction of the second template against the first synthesized\
    \ list of argument types succeeds with an exact match, but not vice versa, then\
    \ the first template is said to be more specialized than the second. Conversely,\
    \ if template deduction of the first template against the second synthesized list\
    \ of argument types succeeds with an exact match, but not vice versa, then the\
    \ second template is said to be more specialized than the first. Otherwise (either\
    \ no deduction succeeds or both succeed), there is no ordering between the two\
    \ templates.\n\nLet’s make this concrete by applying it to the two templates in\
    \ our last example. From these two templates we synthesize lists of argument types\
    \ by replacing the template parameters as described earlier: (A1) and (A*) (where\
    \ A1 and A2 are made up types). Clearly, of the first template against the second\
    \ list of argument types succeeds by substituting A2* for T. However, there is\
    \ no way to make T* of the second template match the nonpointer type A1 in the\
    \ first list. Here, we formally conclude that the second template is more specialized\
    \ than the first.\n\nFinally, consider a more intricate example involving multiple\
    \ function parameters:\n\n```\ntemplate<typename T>\nvoid t(T*, T const* = 0,\
    \ ...);\n```\n\n```\ntemplate<typename T>\nvoid t(T const*, T*, T* = 0);\n```\n\
    \n```\nvoid example(int* p)\n{\n  t(p, p);\n}\n```\n\nFirst, because the actual\
    \ call does not use the ellipsis parameter for the first template and the last\
    \ parameter of the second template is covered by its default argument, parameters\
    \ are ignored"
