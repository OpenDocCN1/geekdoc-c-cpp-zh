    operators, static member functions, constructors and destructors, and explicit
    specializations of template versions of such things (that is, any class-like and
    function-like entity).


    +   - Enumerations: The declaration is a definition if and only if it includes
    the brace-enclosed list of enumerators.


    +   - Local variables and nonstatic data members: These entities can always be
    treated as definitions, although the distinction rarely matters.


    +   - Global variables: If the declaration is not directly preceded by a keyword
    extern or if it has an initializer, the declaration of a global variable is also
    a definition of variable. Otherwise, it is not a definition.


    +   - Static data members: The declaration is a definition if and only if it appears
    outside the class or class template of which it is a member.


    +   - Typedefs, using-declarations, and using-directives: These are never definitions,
    although typedefs can be combined with class or union definitions.


    +   - Explicit instantiation directives: We can consider them to be definitions.


    # A.3 The One-Definition Rule in Detail


    As implied in the introduction to this appendix, there are many details to the
    actual rule. We organize the rule''s constraints by their scope.


    # A.3.1 One-per-Program Constraints


    There can be at most one definition of the following items per program:


    +   - Noninline functions and noninline member functions


    +   - Variables with external linkage (essentially, variables declared in a namespace
    scope or in the global scope, and without the static specifier)


    +   - Noninline functions, noninline member function templates, and noninline
    members of class templates when they are declared with export


    +   - Static data members of class templates when they are declared with export


    For example, a C++ program consisting of the following translation units is invalid:


    ```

    // Translation unit 1:

    int counter;

    ```


    ```

    // Translation unit 2:

    int counter;          // ERROR: defined twice! (ODR violation)

    ```


    > Interestingly, it is valid C because C has a concept of tentative definition,
    which is a variable without an initializer and can appear more than once in a
    program.'
