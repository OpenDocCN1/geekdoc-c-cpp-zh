    # 15.1 Traits and Policies: What’s the Difference?


    A reasonable case can be made in support of the fact that policies are just a
    special case of traits. Conversely, it could be claimed that traits encode a policy.


    +   The New Shorter Oxford English Dictionary [see [NewShorterODE]] has this to
    say:

    * trait n. ... distinctive feature characterizing a thing

    * policy n. ... any course of action adopted as advantageous or expedient


    Based on this, we limit the use of the term policy classes to classes that encode
    an action of some sort that is largely orthogonal with respect to any other template
    argument which is combined. This is in agreement with Andrei Alexandrescu''s statement
    in his book Modern C++ (see page 8 of [AlexandrescuDesign]);


    > Policies have much in common with traits but differ in they put less emphasis
    on type and more on behavior.


    Nathan Myers, who introduced the traits technique, proposed the following open-ended
    definition ([MyersTraits]);


    > Traits class: A class used in place of template parameters. As a class, it aggregates
    useful types and constants; as a template, it provides an avenue for “extra level
    of indirection” that solves all software problems.


    In general, we therefore tend to use the following (slightly fuzzy) definitions:


    +   * Traits represent natural additional properties of a template parameter.

    * Policies represent configurable behavior for generic functions and types (often
    with some used defaults).


    To elaborate further on the possible distinctions between the two concepts, we
    list the observations about traits:


    +   * Traits can be useful as fixed traits (that is, without being passed through
    template parameters).'
