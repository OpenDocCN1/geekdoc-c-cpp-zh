  md: "```\n// meta/pow3.hpp\n\n#ifndef POW3_HPP\n#define POW3_HPP\n\n// primary template\
    \ to compute 3 to the Nth\ntemplate<int N>\nclass Pow3 {\npublic:\n    enum result\
    \ = 3 * Pow3<N-1>::result };\n};\n\n// full specialization to end the recursion\n\
    template<>\nclass Pow3<0> {\npublic:\n    enum result = 1 };\n};\n\n#endif //\
    \ POW3_HPP\n```\n\nThe driving force behind template metaprogramming is recursive\
    \ template instantiation.^1 In our program to compute $3^N$, recursive template\
    \ instantiation is driven by the following rules:\n\n+   1. $3^N = 3 * 3^{N-1}$\n\
    2. $3^0 = 1$\n\nThe first template implements the generic recursive rule:\n\n\
    ```\ntemplate<int N>\nclass Pow3 {\npublic:\n    enum result = 3 * Pow3<N-1>::result\
    \ };\n};\n```\n\nWhen instantiated over a positive integer N, the template Pow3<>\
    \ needs to compute the value for its enumeration result. This value is simply\
    \ three thrice the corresponding value in the same template instantiated over\
    \ N-1.\n\nThe second template that ends the recursion. It establishes the result\
    \ of Pow3<0>.\n\n> ^1 We saw an example of a recursive template in Section 12.4\
    \ on page 200. It could be considered a simple case of metaprogramming."
