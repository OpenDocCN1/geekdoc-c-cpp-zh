  md: '# Chapter 13: Future Directions


    definition (in other words, its *body*) is instantiated instead of the definition
    of the primary template. (Full template specializations work exactly the same
    way.)


    In contrast, overloaded function templates are separate templates that are completely
    independent of one another. When selecting which template to instantiate, all
    overloaded templates are considered together, and overload resolution attempts
    to choose the best fit. At first this might seem an adequate alternative, but
    in practice there are a number of limitations:


    +   * It is possible to specialize member templates of a class without changing
    the definition of the definition of that class. In many cases this is not an option
    because we may not have the rights to do so. Furthermore, the C++ standard does
    not currently allow us to add new templates to that namespace.


    +   * To overload function templates, their function parameters must differ in
    some way. Consider a function template R convert(T const&) where R and T are template
    parameters. We may very well want to specialize this template for R = void, but
    this cannot be done using overloading.


    +   * Code is valid for a nonloaded function may no longer be valid when the function
    is overloaded. Specifically, given two functions f(T) and g(T) (where T is a template
    parameter), the expression g(&<int>) is only valid if f is not overloaded (otherwise,
    there is no way to decide which f is.)


    +   * Friend declarations refer to a specific function template or an instantiation
    of a specific function template. An overloaded version of a function template
    would not automatically have the privileges granted to the original template.


    Together, this list forms a compelling argument in support of a partial specialization
    construct for function templates.


    A natural syntax for partially specializing function templates is the generalization
    of the class template notation:


    ```

    template <typename>

    T const& max(T const&, T const&); // primary template

    ```


    ```

    template <typename>

    T* const& <T*>(T* const& T const&); // partial specialization

    ```


    Some designers worry about the interaction of this partial specialization approach
    with function template overloading. For example:


    ```

    template <typename>

    void add (T& x, int i); // a primary template

    ```


    ```

    template <typename T1, typename T2>

    void add (T1 a, T2 b); // another (overloaded) primary template

    ```


    ```

    template <typename>

    void add<T*>(T&, int); // which primary template does this specialize?

    ```'
