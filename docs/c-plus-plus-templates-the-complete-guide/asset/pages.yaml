    \ the C++ language designers was for this to be a valid implementation technique,\
    \ but the standard does not make this clear.\n\n# 10.3.3 The Inclusion and Separation\
    \ Models\n\nWhenever a POI is encountered, the definition of the corresponding\
    \ template somehow be accessible. For class specializations this means that the\
