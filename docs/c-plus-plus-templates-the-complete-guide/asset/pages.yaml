  md: '# Glossary


    # include file


    See header file.


    # indirect call


    A function call for which the called function is not known until the call actually
    occurs (at run time).


    # initializer


    A construct that specifies how to initialize a named object. For example, in


    ```

    std::complex<float> z1 = 1.0, z2(0.0, 1.0);

    ```


    the initializers are = 1.0 and (0.0, 1.0).


    # initializer list


    A comma-separated list of expressions enclosed in braces used to initialize objects
    (or arrays). In constructors it can be used to define values to initialize members
    and base classes.


    # injected class name


    The name of a class as it is visible in its own scope. For class templates, the
    name of the template is treated within the scope of the template as a class name
    if the name is not followed by a template argument list.


    # instance


    The term instance has two meanings in C++ programming: The meaning that is taken
    from the object-oriented terminology is an *instance of a class*: An object that
    is the realization of a class. For example, in C++, `std::cout` is an instance
    of the class `std::ostream`. The other meaning (and the one that is almost always
    intended in this book) is a *template instance*: A class, function, or a member
    function obtained by substituting all the template parameters by specific values.
    In this sense, an *instance* is also called a *specialization*, although the latter
    term is often mistaken for *explicit specialization*.


    # instantiation


    The process of creating a regular class, function, or member function from a template
    by substituting template parameters with actual values. The alternative sense
    of creating an *instance* (object) of a class is not used in this book (see *instance*).


    # ISO


    World-wide acronym for International Organization for Standardization. An ISO
    workgroup called WG21 is a driving force behind the efforts to standardize and
    develop C++.


    # iterator


    An object that knows how to traverse a sequence of elements. Often, these elements
    belong to a collection (see *collection class*).'
  merge: -1
