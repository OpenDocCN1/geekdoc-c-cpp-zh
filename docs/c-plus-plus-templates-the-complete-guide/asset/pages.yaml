  md: "10\n\nChapter 2: Function Templates\n\nIn our example, the list of parameters\
    \ typename T Note the less-than and the greater-than symbols are used as brackets;\
    \ we refer to these angle brackets. The keyword typename introduces a so-called\
    \ type parameter. This is by far the most common kind of template parameter in\
    \ C++ programs, but others are possible, and we will discuss them later (Chapter\
    \ 4).\n\nHere, the type parameter is T. You can use any identifier as a parameter\
    \ name, but using T is the convention. The type parameter represents an arbitrary\
    \ type that is specified by the caller when the caller functions. You can use\
    \ any type (fundamental type, class, and so on) as long as it provides the operations\
    \ that the template uses. In this case, T has to support operator < before a and\
    \ b are compared using operator.\n\nFor historical reasons, you can also use class\
    \ instead of typename to define a type parameter. The keyword typename came relatively\
    \ late in the evolution of the C++ language. Prior to that, the keyword class\
    \ was the only way to introduce a type parameter, and this remains a valid way\
    \ to do so. Hence, the template max() could be defined equivalently as follows:\n\
    \n```\ntemplate <class T>\n{\n    inline T& max (T const& a, T const& b)\n   \
    \ if a < b then b else a\n    return a < b ? b : a;\n}\n```\n\nSemantically there\
    \ is no difference in this context, even if you use class here, any type may be\
    \ used for type arguments. However, this use of class can be misleading (not only\
    \ class types can be substituted for T), you should prefer the use of typename\
    \ in this context. Note also that unlike class declarations, the keyword struct\
    \ cannot be used in place of typename when declaring type parameters.\n\n# 2.1.2\
    \ Using the Template\n\nThe following program shows how to use the max() function\
    \ template:\n\n```\n// basics/max.cpp\n#include <iostream>\n#include <string>\n\
    #include \"max.hpp\"\n\nint main()\n{\n    int i = 42;\n    std::cout << \"max(7,i):\"\
    \ << << max(7,i) << std::endl;\n\n    double f1 = 3.4;\n```"
