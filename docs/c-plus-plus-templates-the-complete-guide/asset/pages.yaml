  md: '# Explicit Instantiation


    The inclusion model ensures that all the needed templates are instantiated. This
    happens because the C++ compilation system automatically generates instantiations
    as they are needed. The C++ standard also offers a construct to instantiate templates
    manually: the *explicit instantiation directive*.


    # 2.2.1 Example of Explicit Instantiation


    To illustrate manual instantiation, let''s revisit our original example that leads
    to a linker error (see page 62). To avoid this error we add the following file
    to our program:


    ```

    // basics/myfirstinst.cpp

    #include "myfirst.cpp"


    // explicitly instantiate print_typeof() for type double

    template void print_typeof<double>(double const&);

    ```


    The explicit instantiation directive consists of the keyword template followed
    by the fully substituted declaration of the entity we want to instantiate. In
    our example, we do this with an ordinary function, but it could be a member function
    or a static data member. For example:


    ```

    // explicitly instantiate a constructor of MyClass<> for int

    template MyClass<int>::MyClass();

    ```


    ```

    // explicitly instantiate a function template max() for int

    template int const& max (int const&, int const&);

    ```


    You can explicitly instantiate a class, which is short for requesting the instantiation
    of all its instantiated members. This excludes members that were previously specialized
    as well as those that were already instantiated:


    ```

    // explicitly instantiate class Stack<> for int:

    template class Stack<int>();

    ```


    ```

    // explicitly instantiate some member functions of Stack<> for strings

    template Stack<std::string>::Stack();

    template void Stack<std::string>::push(std::string const&);

    template std::string Stack<std::string>::top() const;

    ```


    ```

    // ERROR: can''t explicitly instantiate a member function of a

    // class that was itself explicitly instantiated:

    template Stack<int>::Stack();

    ```'
