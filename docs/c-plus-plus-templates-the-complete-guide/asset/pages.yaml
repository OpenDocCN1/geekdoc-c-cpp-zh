  md: "# 78 Chapter 6: Using Templates in Practice\n\nThis example illustrates the\
    \ typical layering of software development: High-level function templates shell()\
    \ rely on components like middle(), which themselves make use of basic facilities\
    \ like core(). When we instantiate shell(), all the layers below it also need\
    \ to be instantiated. In this example, a problem is revealed in the deeper layer:\
    \ core() is instantiated with type int* (from the use of Client::Index in middle())\
    \ and attempts to dereference a value of that, which is an error. A good generic\
    \ diagnostic indicates a trace of all the layers that led to the problems, but\
    \ we observe that such information can appear poorly.\n\nAn excellent discussion\
    \ of the core ideas surrounding this problem can be found in [Stroustrup-dupDNE];\
    \ where Bjarne Stroustrup explains two classes of approaches to determine earlier\
    \ whether template satisfies a set of constraints: through a language extension\
    \ or earlier parameter use. We cover the former to some extent in Section 13.11\
    \ on page 218. The latter alternative consists of forcing errors in shallow instantiations.\
    \ This is achieved by inserting unused code with no other purpose than to trigger\
    \ an error if code is instantiated with template arguments that do not meet the\
    \ requirements of deeper layers.\n\nIn our example we could add code in shell()\
    \ that attempts to dereference a value of type T::Index. For example:\n\n```\n\
    template <typename T>\nvoid ignore(T const&)\n{}\n```\n\n```\ntemplate <typename\
    \ T>\nvoid shell(T const& env)\n{\n  class ShallowChecks {\n    void deref(T::Index\
    \ ptr) {\n      ignore(*ptr);\n    }\n  };\n  typename T::Index i;\n  middle(i);\n\
    }\n```\n\nIf T is a type that T::Index cannot be dereferenced, an error is now\
    \ diagnosed on the local class ShallowChecks. Note that because the local class\
    \ is not actually used, the added code does not impact the runtime time of the\
    \ shell(). Unfortunately, many compilers will warn about the fact that ShallowChecks\
