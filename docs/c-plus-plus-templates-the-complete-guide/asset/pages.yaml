  md: "# # Chapter 8\nFundamentals in Depth\n\nIn this chapter we review some of the\
    \ fundamentals introduced in the first part of this book in depth: the declaration\
    \ of templates, the restrictions on template parameters, the constraints on template\
    \ arguments, and so forth.\n\n# ## 8.1 Parameterized Declarations\n\nC++ currently\
    \ supports two fundamental kinds of templates: class templates and function templates\
    \ (see Section 13.6 on page 212 for a possible future change in this area). This\
    \ classification includes member templates. Such templates are declared like ordinary\
    \ classes and functions, except for being introduced by a parameterization clause\
    \ of the form\n\n```\ntemplate<... parameters here... >\n```\n\nor perhaps\n\n\
    ```\nexport template<... parameters here... >\n```\n\n(see Section 6.3 on page\
    \ 68 and Section 10.3.3 on page 149 for a detailed explanation of the keyword\
    \ export).\n\nWe'll come back to the actual template parameter declarations in\
    \ a later section. An example illustrates the two kinds of templates, both as\
    \ class members and as ordinary namespace scope declarations:\n\n```\ntemplate\
    \ <typename T>\nclass List {\npublic:\n    template <typename T2>\n    List(List<T2>\
    \ const);\n    ...\n};\n```"
