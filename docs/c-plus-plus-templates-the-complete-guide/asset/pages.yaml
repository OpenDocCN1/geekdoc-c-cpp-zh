    \ operations. To be entirely perfect, an optimizer must also be able to hide the\
    \ storage used by the cmp functor object. In practice, however, only a few compilers\
    \ are capable of such features.\n\n# 22.5.2 Functors as Function Call Arguments\n\
    \nAnother way to pass functors is to pass them as function call arguments. This\
    \ allows the caller to construct the functor object (possibly using a nontrivial\
