  md: "# Chapter 3\n\n# Class Templates\n\nSimilar to functions, classes can also\
    \ be parameterized with one or more types. Container classes, which are used to\
    \ manage elements of a certain type, are a typical example of this feature. By\
    \ using class templates, you can implement such container classes while the element\
    \ type is still open. In this chapter we use a stack as an example of a class\
    \ template.\n\n# 3.1 Implementation of Class Template Stack\n\nAs we did with\
    \ function templates, we declare and define class Stack<> in a header file as\
    \ follows (we discuss the separation of declaration and definition in different\
    \ files in Chapter 6):\n\n```\n// basics/stack1.hpp\n\n#include <vector>\n#include\
    \ <stdexcept>\n\ntemplate <typename T>\nclass Stack {\nprivate:\n    std::vector<T>\
    \ elems;      // elements\n\npublic:\n    void push(T const&);        // push\
    \ element\n    void pop();                // pop element\n    T top() const; \
    \            // return top element\n    bool empty() const {       // return whether\
    \ the stack is empty\n        return elems.empty();\n    }\n};\n```"
