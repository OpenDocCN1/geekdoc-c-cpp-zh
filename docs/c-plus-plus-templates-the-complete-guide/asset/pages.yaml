    # 13.8 The typeof Operator


    When writing templates, it is often useful to be able to express the type of a
    template-dependent expression. Perhaps the poster child of this situation is the
    declaration of an arithmetic operator for a numeric array template where the elements
    of the operands are mixed. The following example should make this clear:


    ```

    template <typename T1, T2>

    Array<?+>(Array<T1> const& x, Array<T2> const& y);

    ```


    Presumably, this operator is to produce an array of elements that are the result
    of corresponding elements in the arrays x and y. The type of a resulting element
    is the type of x[0]+y[0]. Unfortunately, C++ does not offer a reliable way to
    express this type in terms of T1 and T2.


    Some compilers provide the typeof as an extension that addresses this issue. It
    is reminiscent of the sizeof operator in it can take an expression and produce
    a compile-time entity, but in this the compile-time entity can act as the name
    of a type. Our previous example allows us to use:


    ```

    template <typename T1, typename T2>

    Array<typeof(T1)+T2(0)>>operator+(Array<T1> const& x,

    Array<T2> const& y);

    ```


    This is nice, but not ideal. It deems this assumption that the given types can
    be default-initialized. We can work around this assumption by introducing a helper
    template as:


    ```

    template <typename T>

    T makeT(); // no definition needed

    ```


    ```

    template <typename T1, typename T2>

    Array<typeof(makeT<T1>+makeT<T2>())>

    operator+(Array<T1> const& x,

    Array<T2> const& y);

    ```


    We would prefer to use x and y in the typeof argument, but because they have not
    been declared at the point of the typeof construct. A radical solution to this
    problem is to introduce an alternative function declaration syntax that places
    the return type *after* the parameter types:'
