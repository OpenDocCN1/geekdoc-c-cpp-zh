  md: 'linkable entity function member function, a global variable, or a static data
    member, including any such things generated from a template.


    # lvalue


    In the original C language, an expression was called an *lvalue* if it could appear
    on the left of an assignment operator. Conversely, an expression that could appear
    only on the right of an assignment operator was called an *rvalue*. This definition
    is no longer appropriate in modern C and C++. Instead an *lvalue* can be thought
    of as a *locator value*. An expression that designates an object by name or address
    (pointer, reference, or array access) rather than by pure computation. Lvalues
    need not be modifiable (for example, the name of a constant object is a *nonmodifiable
    lvalue*). All expressions that are not lvalues are *rvalues*. In particular, temporary
    objects created explicitly (T()) or as the result of function calls are rvalues.


    # member class template


    A construct that represents a family of member classes. It is a class template
    declared inside another class or class template. It has its own set of template
    parameters (unlike a member class of a class template).


    # member function template


    A construct that represents a family of member functions. It has its own set of
    template parameters (unlike a member function of a class template). It is very
    similar to a function template, but when all the template parameters are substituted,
    the result is a member function (instead of an ordinary function). Member function
    templates cannot be virtual.


    # member template


    A member class template or a member function template.


    # nondependent name


    A name that is not dependent on a template parameter. See *dependent name* and
    *two-phase lookup*.


    # ODR


    An acronym for *one-definition rule*. This rule places some restrictions on the
    *definitions* that appear in a C++ program. See Section 7.4 on page 90 and Appendix
    A for details.


    # one-definition rule


    See ODR.


    # overload resolution


    The process that selects which function to call when several candidates (usually
    all having the same name) exist.'
