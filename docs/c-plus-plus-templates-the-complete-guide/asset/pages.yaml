  md: "# 7.5 Template Arguments versus Template Parameters\n\nThis name can be used\
    \ much like a corresponding nontemplate entity would be used. For example:\n\n\
    ```\nint main()\n{\n    ArrayInClass<double,10> ad;\n    ad.array[0] = 1.0;\n\
    }\n```\n\nIt is essential to distinguish between template parameters and template\
    \ arguments. In short, you can say that “pass arguments to become parameters.”²\
    \ Or more precisely:\n\n+   - Template parameters are those names that are listed\
    \ after the keyword template in the template declaration or definition (T and\
    \ N in our example).\n- Template arguments are the items that are substituted\
    \ for template parameters (double and 10 in our example). Unlike template parameters,\
    \ template arguments can be more than just \"names\".\n\nThe substitution of template\
    \ parameters by template arguments is explicit when indicated with a template-id.\
    \ As becomes clearer later, the substitution is implicit (for example, if template\
    \ parameters are substituted by their default arguments).\n\nA fundamental principle\
    \ is that any template argument must be a quantity or value that can be determined\
    \ at compile time; this requirement translates into dramatic benefits for the\
    \ run-time costs of template instances. Because template parameters are eventually\
    \ substituted by compile-time values, they themselves can be used to form compile-time\
    \ expressions. This was exploited in the ArrayInClass template to size the member\
    \ array array. The size of an array must be so-called constant-expression, and\
    \ the template parameter N qualifies as such.\n\nWe can push this reasoning a\
    \ little further: Because template parameters are compile-time entities, they\
    \ can also be used to create valid template arguments. Here is an example:\n\n\
    ```\ntemplate <typename T>\nclass Dozen {\npublic:\n    ArrayInClass<T,12> contents;\n\
    };\n```\n\nNote how the name T is both a template parameter and a template argument.\
    \ Thus, a mechanism is available to enable the construction of more complex templates\
    \ from simpler ones. Of course, this is not fundamentally different from the mechanisms\
    \ that allow us to assemble types and functions.\n\n> ² In the academic world,\
    \ arguments are sometimes called actual parameters whereas parameters are called\
    \ formal parameters."
