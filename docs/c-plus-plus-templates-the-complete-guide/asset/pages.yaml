  md: "# Performance and Limitations of Expression Templates\n\nTo justify the complexity\
    \ of the expression idea, we have already invoked greatly enhanced performance\
    \ on arraywise operations. As you trace what happens with the expression templates,\
    \ you'll find that many small inline functions call each other and that many small\
    \ expression template objects are allocated on the stack call. The optimizer must\
    \ perform complete inlining and elimination of the small objects to produce code\
    \ that performs as well as manually coded loops. The feat is still rare among\
    \ C++ compilers at the time of writing.\n\nThe expression templates technique\
    \ does not resolve all the problematic situations involving numeric operations\
    \ on arrays. For example, it does not work for matrix-vector multiplications of\
    \ the form\n\n```\nx = A*x;\n```\n\nwhere x is a column vector of size n and A\
    \ is an n-by-n matrix. The problem is that a temporary must be used because each\
    \ element of the result can depend on each element of the original x. Unfortunately,\
    \ the expression template updates the first element of x right away and uses newly\
    \ computed element to compute the second element, which is wrong. The slightly\
    \ different expression\n\n```\nx = A*y;\n```\n\non the other hand, does not need\
    \ a temporary for x and y aren't allies for each other, which implies that a solution\
    \ would have to know the relationship of the operands at run time. In this turns\
    \ creating a runtime structure that represents the expression tree instead of\
    \ coding the tree in type of the expression template. This approach was pioneered\
    \ by the NewMat library of Robert Davies (see [NewMat]). It was known long before\
    \ expression templates were developed.\n\nExpression templates are not limited\
    \ to numerical computations. An intriguing application, for example, is Jaako\
    \ Jarvi and Gary Powell's Lambda Library (see [LambdaLib]). This library uses\
    \ standard library function objects as expression objects. For example, it allows\
    \ us to write the following:\n\n```\nvoid lambda_demo (std::vector<long>& ones)\
    \ {\n    std::sort(ones.begin(), ones.end(), _1 > _2);\n}\n```\n\nThis short code\
    \ sorts arrays in an increasing order of the value of what its elements refer\
    \ to. Without the Lambda library, we'd have to define a simple (but cumbersome)\
    \ special-purpose functor type. Instead, we can now use inline syntax to express\
    \ the operations we want to apply. In our example, _1 and _2 are placeholders\
    \ provided by the Lambda library. They correspond to elementary expression objects\
    \ that are also functors. They can be used to construct more complex expressions\
    \ using the techniques developed in this chapter."
