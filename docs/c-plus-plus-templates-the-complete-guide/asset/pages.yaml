  md: '# 14.4 New Forms of Design Patterns


    Static polymorphism is often regarded as more type safe than dynamic polymorphism
    because all the bindings are checked at compile time. For example, there is little
    danger of inserting an object of the wrong type in a container instantiated from
    a template. However, in a container containing pointers to a common base class,
    there is a possibility that these pointers unintentionally end pointing to complete
    objects of different types.


    In practice, template instantiations can also cause grief when semantic assumptions
    hide identical-looking interfaces. For example, surprises can occur when a template
    that assumes an associative operator + is instantiated for a type that is not
    associative with respect to that operator. In practice, this semantic mismatch
    occurs less often with inheritance-based hierarchies, presumably because the interface
    specification is more explicitly specified.


    # Combining Both Forms


    Of course, you could combine both forms of polymorphism. For example, you could
    derive different kinds of geometric objects from a common base class to be able
    to handle heterogeneous collections of geometric objects. However, you can use
    templates to write code for a certain kind of geometric object.


    The combination of inheritance and templates is further described in Chapter 16.
    We will see (among other things) how the virtualization of a member function can
    be parameterized and how an additional amount of flexibility is afforded to static
    polymorphism using the inheritance-based recurring template pattern (or CRTP).


    # 14.4 New Forms of Design Patterns


    The new form of static polymorphism leads to new ways of implementing design patterns.
    Take, for example, the bridge pattern, which plays a major role in C++ programs.
    One goal of using


    | Interface | body | Implementation |

    | --- | --- | --- |

    | Implementation* body; | | virtual operationA() = 0;

    virtual operationB() = 0;

    virtual operationC() = 0; |

    | operationA() { body->operationA(); } | | |

    | operationB() { body->operationB(); body->operationC(); } | | |

    | | Implementation A | Implementation B |

    | | virtual operationA(); | virtual operationA();

    | | virtual operationB(); | virtual operationB();

    | | virtual operationC(); | virtual operationC(); |


    Figure 14.3. Bridge pattern implemented using inheritance'
