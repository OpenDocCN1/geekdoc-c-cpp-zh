  md: '# Glossary


    This glossary is a compilation of the most important technical terms that are
    topic in this book. See [StroustrupGlossary] for a very complete, general glossary
    of terms used by C++ programmers.


    # abstract class


    A class for which the creation of concrete objects (*instances*) is impossible.
    Abstract classes can be used to collect common properties of different classes
    in some way associated with the polymorphic interface. Because abstract classes
    are used as base classes, the acronym ABC is sometimes used for abstract base
    class.


    # ADL


    An acronym for argument-dependent lookup. ADL is a process that looks for a name
    of a function (or operator) in namespaces and classes that are in some way associated
    with the arguments of the function call in that function (or operator name) appears.
    For historical reasons, it sometimes called *extended Koenig lookup* or just *Koenig
    lookup* (the latter is also used for ADL applied to operators only).


    # angle bracket hack


    A nonstandard feature that allows a compiler to accept two > characters as two
    closing angle brackets (even though they require intervening whitespace). For
    example, the expression vector<list<int>` is not valid C++ but is treated identically
    to `vector<list<int>>` by the angle bracket hack.


    # angle brackets


    The characters < and > when they are used to delimit a list of template arguments
    or template parameters.


    # ANSI


    An acronym for *American National Standard Institute*. A private, nonprofit organization
    that coordinates efforts to produce standard specifications of all kinds. A subcommittee
    called J16 is a driving force behind the standardization of C++. It cooperates
    closely with the international standards organization (ISO).'
  merge: -1
  pgno: 525
- img_proc: true
  md: '# argument


    A value (in a broad sense) substitutes a parameter of a programmatic entity. For
    example, in a function call abs (-3) the argument is -3. In some programming communities
    arguments are called actual parameters (whereas parameters are called formal parameters).


    # argument-dependent lookup


    See ADL.


    # class


    The description of a category of objects. The class defines a set of characteristics
    for any object. This include its data (attributes, data members) as well as its
    operations (methods, member functions). In C++, classes are structures with members
    that can also be functions and are subject to access limits. They are declared
    using the keywords class or struct.


    # class template


    A construct that represents a family of classes. It specifies a pattern from which
    actual classes can be generated by substituting the template parameters by specific
    entities. Class templates are sometimes called “parameterized” classes, although
    this term is more general.


    # class type


    A C++ type declared with class, struct, or union.


    # collection class


    A class that is used to manage a group of objects. In C++, collection classes
    are also called containers.


    # constant-expression


    An expression whose value is computed at compile time by the compiler. We sometimes
    call this true constant to avoid confusion with constant expression (without hyphen).
    The latter includes expressions that are constant but cannot be computed at compile
    time by the compiler.


    # const member function


    A member function that can be called for constant and temporary objects because
    it does not modify members of the *this object.


    # container


    See collection class.


    # conversion operator


    A special member function that defines how an object can implicitly (or explicitly)
    be converted to an object of another type. It is declared using the form operator
    type().


    # CRTP


    An acronym for curiously recurring template pattern. This refers to a code pattern
    where a class X derives from a base class that has X as a template argument.'
  merge: -1
  pgno: 526
- img_proc: true
  md: '# dot-File


    A file in which definitions of variables and noninline functions are located.
    Most of the executable (as opposed to declarative) code of a program is normally
    placed in dot-C files. They are named dot-C files because they are usually named
    with a suffix such as .cpp, .C, .cc, or .cxx. See header file and translation
    unit.'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# EBCO


    An acronym for empty base class optimization. An optimization performed by most
    modern compilers whereby an "empty" base class subobject does not occupy any storage.


    # empty base class optimization


    See EBCO.


    # explicit instantiation directive


    A C++ construct the sole purpose of which is to create a POI.


    # explicit specialization


    A construct declares or defines an alternative definition for a substituted template.
    The original (generic) template is called the *primary template*. If the alternative
    definition depends on one or more template parameters, it is called a *partial
    specialization*. Otherwise, it is a *full specialization*.


    # expression template


    A class template to represent a part of an expression. The template itself represents
    a particular kind of operation. The template parameters stand for the kinds of
    operands to the operation applies.


    # friend name injection


    The process that makes a function name visible when it is declared only friend.


    # full specialization


    See explicit specialization.


    # function object


    See functor.


    # function template


    A construct represents a family of functions. It specifies a pattern from which
    actual functions can be generated by substituting the template parameters by specific
    entities. Note that a function template is a template and not a function. Function
    templates are sometimes "parameterized functions", although the latter term is
    more general.


    # functor


    An object (also called a *function object*) that can be used using the *function
    call* syntax. In C++, these are pointers or references to functions and classes
    with a member operator ().


    # header file


    A file to become part of a translation unit through a #include directive. Such
    files often contain *declarations* of variables and functions that are referred
    to from more than one translation unit, as well as *definitions* of types, inline
    functions, templates, constants, and macros. They are usually named with a suffix
    like .hpp, .h, .H, .hh, or .hxx. They are also called include files. See dot-C
    file and translation unit.'
  merge: -1
