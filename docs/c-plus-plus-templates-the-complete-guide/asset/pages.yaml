    # 10.4.3 Iterated Instantiation


    The first compiler to support C++ templates was Cfront 3.0—a recent descendant
    of the compiler that Bjarne Stroustrup wrote to develop the language.¹¹ An inflexible
    constraint on Cfront was that it had to be very portable from platform to platform,
    and this meant that it (1) used the C language as a common representation across
    all platforms and (b) used the local linker. In particular, this implied that
    the linker was not aware of templates. Cfront emitted template as ordinary C functions,
    and therefore had to avoid duplicate instantiations. Although the Cfront source
    model was different from the standard inclusion and separation models, its instantiation
    strategy can be adapted to the inclusion model. As such, it merits recognition
    as the first incarnation of iterated instantiation. The Cfront iteration can be
    described as follows:


    +   1. Compile the sources without instantiating any required linkable specializations.


    +   2. Link the object files using a prelinker.


    +   The prelinker invokes the linker and parses its error messages to determine
    whether any are the result of missing instantiations. If so, the prelinker invokes
    the compiler on sources that contain the needed template definitions, with options
    to generate the missing instantiations.


    +   3. Repeat step 3 if any definitions are generated.


    > ¹¹ Do not let this phrase mislead you into thinking that Cfront was an abstract
    prototype: it was used in industrial contexts, and formed the basis of many commercial
    C++ compiler offerings. Release 3.0 appeared in 1991 but was plagued with bugs.
    Version 3.0.1 followed shortly thereafter and made templates usable.'
