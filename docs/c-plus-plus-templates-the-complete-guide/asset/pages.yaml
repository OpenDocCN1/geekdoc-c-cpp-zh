  md: "# Chapter 2\n\n# Function Templates\n\nThis chapter introduces function templates.\
    \ Function templates are functions that are parameterized so that they represent\
    \ a family of functions.\n\n# 2.1 A First Look at Function Templates\n\nFunction\
    \ templates provide a functional behavior that can be called for different types.\
    \ In other words, a function template represents a family of functions. The representation\
    \ looks a lot like an ordinary function, except that some elements of the function\
    \ are left undetermined: These elements are parameterized. To illustrate, let's\
    \ look at a simple example.\n\n# 2.1.1 Defining the Template\n\nThe following\
    \ is a function template that returns the maximum of two values:\n\n```\n// basics/max.hpp\n\
    template <typename T>\ninline T const max(T const& a, T const& b)\n{\n    // if\
    \ a < b then use b else a\n    return a < b ? b : a;\n}\n```\n\nThis template\
    \ definition specifies a family of functions that returns the maximum of two values,\
    \ which are passed as function parameters a and b. The type of these parameters\
    \ is left open as template parameter T. As seen in this example, template parameters\
    \ must be announced with syntax of the following form:\n\n```\ntemplate < comma-separated-list-of-parameters\
    \ >\n```"
