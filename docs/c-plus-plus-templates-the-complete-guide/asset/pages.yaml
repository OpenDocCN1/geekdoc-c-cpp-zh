  md: "# B.2 Simplified Overload Resolution\n\n```\n#include <stddef.h>\n\nclass BadString\
    \ {\npublic:\n    BadString(char const*);\n    ...\n    // character access through\
    \ subscripting:\n    char& operator[] (size_t); // (1)\n    char const operator[](size_t)\
    \ const;\n\n    // implicit conversion to non-terminated byte string:\n    operator\
    \ char* (); // (2)\n    operator char const* ();\n};\n\nint main() {\n    BadString\
    \ str(\"correkt\");\n    str[5] = 'c'; // possibly an overload resolution ambiguity!\n\
    }\n```\n\nAt first, noting seems ambiguous about the expression str[5]. The subscript\
    \ operator at (1) seems like a perfect match, however it is not perfect because\
    \ the argument 5 has type int, and the operator expects an unsigned integer size_t\
    \ and std::size_t usually have unsigned int or unsigned long, but never type int.\
    \ A simple integer conversion makes (1) easily viable. however, there is another\
    \ viable candidate: the built-in subscript operator. Indeed, if we apply the implicit\
    \ conversion to str (which is the implicit member function argument), we obtain\
    \ a pointer, then the built-in subscript operator applies. This built-operator\
    \ takes an argument of type ptrdiff_t, which on many platforms is equivalent to\
    \ int and is therefore a perfect match for the argument 5. So even the built-in\
    \ operator is a poor match (user-defined conversion) for the implicit argument,\
    \ it is a better operator than defined (1) for the actual subscript! To solve\
    \ this kind of problem probably, you can declare operator with a ptrdiff_t parameter,\
    \ or you can replace the implicit type conversion to char* by an explicit conversion\
    \ (which is usually recommended anyway).\n\nIt is possible for a set of viable\
    \ candidates to contain both static and nonstatic members. When comparing a static\
    \ member with a nonstatic member, the quality of the implicit argument is ignored\
    \ (the nonstatic member has an implicit *this argument).\n\n> Note that the ambiguity\
    \ exists only on platforms for which size_t is a synonym for unsigned int. On\
    \ platforms for which it is a synonym for unsigned long, the ptrdiff_t is a typedef\
    \ of long, and no ambiguity exists because the built-in subscript operator also\
    \ requires a conversion of the subscript expression."
  merge: -1
  pgno: 509
