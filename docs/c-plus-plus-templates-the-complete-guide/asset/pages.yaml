    \    List<void*> C::*> impl;\n\npublic:\n    // partial specialization for any\
    \ pointer-to-member-pointer type\n    // except pointer-to-void* which is handled\
    \ earlier;\n    // note that this partial specialization has two template parameters,\n\
    \    // whereas the primary template has only one parameter\n    typedef T* C::ElementType;\n\
    \    ...\n    void append(ElementType pm) {\n        impl.append(void* C::*)pm);\n\
