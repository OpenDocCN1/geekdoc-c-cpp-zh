    \ {\n#if defined(DYNAMIC)\n    virtual ~Decider() {}\n}\n#endif\n};\n\nextern\
    \ Decoder d;\n\nint main()\n{\n    const char* name = typeid(d).name();\n    return\
    \ (int)sizeof(d);\n}\n```\n\nThis is valid program if and only if the preprocessor\
