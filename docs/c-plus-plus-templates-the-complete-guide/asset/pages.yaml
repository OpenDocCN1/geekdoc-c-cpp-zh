  md: "# A.3 The-Definition Rule in Detail\n\nAlthough this is valid C++, some compilers\
    \ do not actually “inline” the call to a function with a body that has not been\
    \ seen yet; hence the desired effect may not be achieved.\n\nJust as class templates,\
    \ the use of a function generated from a parameterized template declaration (a\
    \ function or member function template, or a member function of a class template)\
    \ creates a point of instantiation. Unlike class templates, however, the corresponding\
    \ definition can appear after the point of instantiation (or not at all if it\
    \ is exported).\n\nThe facets of the ODR explained in this subsection are easily\
    \ verified by C++ compilers; hence the C++ standard requires some sort of diagnostic\
    \ when any one of these rules is violated. An exception is the lack of definition\
    \ of a nonexported parameterized function. Such situations are typically not diagnosed\n\
    \n# A.3.3 Cross-Translation Unit Equivalence Constraints\n\nThe ability to define\
    \ kind of entities in more than one translation unit brings with it the potential\
    \ for a new kind of error: multiple definitions that don't match. Unfortunately,\
    \ such errors are hard to detect by traditional compiler technology in which translation\
    \ units are processed one at a time. Consequently, the C++ standard doesn't mandate\
    \ that differences in multiple definitions be detected or diagnosed (it does allow\
    \ it, of). If this cross-translation unit constraint is violated, the C++ standard\
    \ qualifies jokingly as undefined behavior, which means that anything reasonable\
    \ or unreasonable may happen. Typically, such undiagnosed errors may lead to program\
    \ crashes or wrong results, but in principle they can also lead to other, more\
    \ direct, kinds of damage (for example, file corruption).\n\nThe cross-translation\
    \ unit constraints specify that when an entity is defined in two different places,\
    \ the two places must consist of exactly the same sequence of tokens (the keywords,\
    \ operators, identifiers, and so forth remaining after preprocessing). Furthermore,\
    \ these tokens must mean the same thing in their respective context (for example,\
    \ the identifiers may need to refer to the same variable). Consider the following\
    \ example:\n\n```\n// Translation unit 1:\nstatic int counter = 0;\ninline void\
    \ increase_counter()\n{\n    ++counter;\n}\n\nint main()\n{\n}\n```\n\n> Version\
    \ 1 of the gcc compiler actually joked doing this by starting the name of Rogue\
    \ in situations like this."
