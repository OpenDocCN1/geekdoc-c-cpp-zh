    \ parameters, note that the common implementation defined at (4) to which all\
    \ others are forwarded (by the declaration at point (5)) is itself a partial specialization\
    \ (for the simple pointer case it is full specialization). However, it is clear\
    \ that the specialization at point (4) is more specialized than that at point\
    \ (5); thus no ambiguity should occur.\n\n# 12.5 Afternotes\n\nFull template specialization\
    \ was part of the C++ template mechanism from the start. Function template overloading\
    \ and class template specialization, on the other hand, came much later. The HP\
    \ AC++ compiler was the first to implement function template overloading, and\
    \ EDG's C++ front end was the first to implement class template partial specialization.\
    \ The partial ordering principles described in this chapter were originally invented\
    \ by Steve Adamczyk and John Spicer (who are both part of EDG).\n\nThe ability\
    \ of template specialization to terminate an infinitely recursive template definition\
    \ (such as the List<T*> example presented in Section 12.4 on page 200) was known\
    \ for a long time. However, Erwin Unruh was perhaps the first to note that this\
    \ could lead to the interesting notion of template metaprogramming: Using the\
    \ template instantiation mechanism to perform nontrivial computations at compile\
    \ time. We devote Chapter 17 to this topic."
