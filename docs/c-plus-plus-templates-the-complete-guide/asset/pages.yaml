  md: "# B.3.2 Conversion Sequences\n\nAn implicit conversion can, in general, be\
    \ a sequence of elementary conversions. Consider the following code example:\n\
    \n```\nclass Base {\n  public:\n    operator short() const;\n};\n\nclass Derived\
    \ : public Base {\n};\n\nvoid count(int);\n\nvoid process(Derived const& object)\
    \ {\n    count(object); // matches with user-defined conversion\n}\n```\n\nThe\
    \ call count(object) works because object can be implicitly converted to int.\
    \ However, the conversion requires several steps:\n\n+   1. A conversion of object\
    \ from Derived const to Base const\n2. A user-defined conversion of the resulting\
    \ Base const object to type short\n3. A promotion of short to int\n\nThis is the\
    \ most general kind of conversion sequence: a standard conversion (a derived-to-base\
    \ conversion, in this case), followed by a user-defined conversion, followed by\
    \ another standard conversion. Although there can be at most one user-defined\
    \ conversion in a conversion sequence, it is also possible to have only standard\
    \ conversions.\n\nAn important principle of overload resolution is that a conversion\
    \ sequence that is a subsequence of another conversion sequence is preferable\
    \ over the latter sequence. If there were an additional candidate function\n\n\
    ```\nvoid count(short);\n```\n\nin the example, it would be preferred for the\
    \ call count(object) because it doesn't require the last step (promotion) in the\
    \ conversion sequence.\n\n# B.3.3 Pointer Conversions\n\nPointers and pointers\
    \ to members undergo various special standard conversions, including\n\n+   -\
    \ Conversions to type bool\n- Conversions from an arbitrary pointer type to void*"
