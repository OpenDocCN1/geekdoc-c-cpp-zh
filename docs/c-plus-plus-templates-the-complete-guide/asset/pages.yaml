  md: '# 18.2 Encoding Expressions in Template Arguments


    The key to resolving our problem is not to attempt to evaluate part of an expression
    until the whole expression has been seen (in our example, until the assignment
    operator is invoked). Thus, before the evaluation we must record which operations
    are being applied to which objects. The operations are determined at compile time
    and can be encoded in template arguments.


    For our example expression


    +   1.2* + x*


    this means that the 1.2*x is not a new array but an object that represents each
    value of x multiplied by 1.2. Similarly, x*y must yield each element of x multiplied
    by each corresponding element of y. Finally, when we need the values of the resulting
    array, we do the computation that stored for later evaluation.


    Let''s look at a concrete implementation. With this implementation we transform
    the written expression


    1.2* + x*


    into an object with the following type:


    ```

    A_Add<A_Scalar<double>,Array<double>,

    A_Mult<Array<double>,Array<double>> >>

    ```


    We combine a new fundamental Array class with class templates A_Scalar, A_Add,
    and A_Mult. You may recognize a prefix definition for the syntax corresponding
    to this expression (see Figure 18.1). This nested template-id represents the operations
    invoked and the types of the objects to which the operations should be applied.
    A_Scalar is presented later but is essentially a placeholder for a scalar in an
    array expression.


    ![](img/9f394dcf9397c1747f3da913f27a6f5b_346_0.png)


    # 18.2.1 Operands of the Expression Templates


    To complete the representation of the expression, we must store references to
    the arguments in each of the A_Add and A_Mult objects and record the value of
    the scalar in the A_Scalar object (or a reference there). There are possible definitions
    for the corresponding operands:


    ```

    // exprmpl/exprops1.hpp

    #include <stddef.h>

    ```


    *'
