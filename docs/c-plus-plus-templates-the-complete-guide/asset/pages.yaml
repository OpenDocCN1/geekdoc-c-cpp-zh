  md: "# 5.5 Zero Initialization\n\nFor fundamental types such as int, double, pointer\
    \ types, there is no default constructor that initializes them with a useful default\
    \ value. Instead, any noninitialized local variable has an undefined value:\n\n\
    ```\nvoid foo() {\n    int x;      // x has undefined value\n    int* ptr; //\
    \ ptr points to somewhere (instead of nowhere)\n}\n```\n\nNow you write templates\
    \ and want to have variables of template type initialized by a default value,\
    \ you have the problem that a simple definition doesn't do for built-in types:\n\
    \n```\ntemplate <typename T>\nvoid foo() {\n    T x; // x has undefined value\
    \ if T is built-in type\n}\n```\n\nFor this reason, it is possible to explicitly\
    \ define a default constructor for built-in types that initializes them with zero\
    \ (or false for bool). That is, int() yields zero. As a consequence you can ensure\
    \ proper default initialization even for built-in types by writing the following:\n\
    \n```\ntemplate <typename T>\nvoid foo() {\n    T x = T(); // x is zero (or false)\
    \ if T is a built-in type\n}\n```\n\nTo make sure a member of a class template,\
    \ for which the type is parameterized, gets initialized, you have to define a\
    \ default constructor that uses an initializer list to initialize the member:\n\
    \n```\ntemplate <typename T>\nclass MyClass {\nprivate:\n    T x;\npublic:\n \
    \   MyClass() : x() {} // ensures that x is initialized even for built-in types\n\
    \    ...\n};\n```"
