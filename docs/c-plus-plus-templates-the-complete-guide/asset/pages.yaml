  md: "# 7.3 Declarations versus Definitions\n\nSo far, the words declaration and\
    \ definition have been used only a few times in this book. However, these words\
    \ carry with them a rarer precise meaning in standard C++, and that is the meaning\
    \ that we use.\n\nA declaration is a C++ construct that introduces or reintrodu\
    \ a name into a C++ scope. This introduction always includes a partial classification\
    \ of that name, but the details are not required to make a valid declaration.\
    \ For example:\n\n```\nclass C;                           // declaration of C\
    \ as a class\nvoid f(int p);                   // declaration of f() as a function\
    \ and p as a named parameter\nextern int v;                  // declaration of\
    \ v as a variable\n```\n\nNot even when you have a \"name\", macro definitions\
    \ of goto labels are not considered declarations in C++.\n\nDeclarations become\
    \ when the details of their structure are made known or, in the case a brace-enclosed\
    \ body must be provided. For variables, initializations as well as a missing extern\
    \ lead to definitions. Here are examples that complement the preceding nondefinition\
    \ declarations:\n\n```\nclass C {};           // definition (and declaration)\
    \ of class C\n```\n\n```\nvoid f(int p) {      // definition (and declaration)\
    \ of function f()\n    std::cout << p << std::endl;\n}\n```\n\n```\nextern int\
    \ v = 1;     // an initializer makes this a definition for v\n```\n\n```\nint\
    \ w;               // global variable declarations not preceded by\n         \
    \                    // extern are also definitions\n```\n\nBy extension, the\
    \ declaration of a class template or function template is called a definition\
    \ if it has a body. Hence,\n\n```\ntemplate <typename T>\nvoid func (int T);\n\
    ```\n\nis a declaration that is not a definition, whereas\n\n```\ntemplate <typename\
    \ T>\nclass S {};\n```\n\nis in fact a definition."
