  md: "# # B.1 When Does Overload Resolution Kick?\n\nOverload resolution is just\
    \ one part of the complete processing of a function call. In fact, it is not part\
    \ of every function call. First, calls through function pointers and calls pointers\
    \ to member functions are not subject to overload resolution because the function\
    \ to call is entirely determined (at runtime) by the pointers. Second, function-like\
    \ macros cannot be overloaded and are therefore not subject to overload resolution.\n\
    \nAt a very high level, a call to a named function can be processed in the following\
    \ way:\n\n+   * The name is looked up to form an initial overload set.\n* If necessary,\
    \ this is twisted in various ways (for example, template deduction occurs).\n\
    * Any candidate that doesn't match the call at all (even after considering implicit\
    \ conversions and default arguments) is eliminated from the overload set. This\
    \ results in a set of so-called viable candidates.\n* Overload resolution is performed\
    \ to find a best candidate. If there is one, it is selected; otherwise, the call\
    \ is ambiguous.\n* The selected candidate is checked. For example, if it is an\
    \ inaccessible private member, a diagnostic message is issued.\n\nEach of these\
    \ steps has its own subtleties, but overload resolution is arguably the most complex.\
    \ Fortunately, a few simple principles clarify the majority of situations. We\
    \ examine these principles next.\n\n# # B.2 Simplified Overload Resolution\n\n\
    Overload resolution ranks the viable candidates by comparing how each argument\
    \ of the call matches the corresponding parameter of the candidates. For one candidate\
    \ to be considered better than another, the better candidate cannot have any of\
    \ its parameters be a worse match than the corresponding parameter in the other\
    \ candidate. The following example illustrates this:\n\n```\nvoid combine(int,\
    \ double);\nvoid combine(long, int);\n```\n\n```\nint main()\n{\n  combine(1,\
    \ 2); // ambiguous!\n}\n```\n\nIn this example, the call to combine() is ambiguous\
    \ because the first candidate matches the first argument (the literal 1 of type\
    \ int) *best*, whereas the second candidate matches the second argument best.\
    \ We could argue that int is in some sense closer to long than double (which supports\
    \ choosing the second candidate), but C++ does not attempt to define a measure\
    \ of closeness that involves multiple arguments."
  merge: -1
  pgno: 506
