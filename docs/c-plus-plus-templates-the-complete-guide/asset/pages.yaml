  md: '# 20.2.7 Constness


    In C++ the types X const* and X* const are distinct. The former indicates that
    the element pointed to should not be modified, whereas the latter indicates that
    the pointer itself cannot be modified. The same duality exists with reference
    counting: X const* corresponds to CountingPtr<X> const* whereas X* const corresponds
    to CountingPtr<X> const. In other words, the constness of the object pointed to
    is a property of the template. Let''s look at some of the public member functions
    of CountingPtr to see how they are affected by this observation.


    The dereferencing operators do not modify the pointer, which is why they are const
    member functions. However, they do provide access to the object pointed to. Because
    the constness of the object is captured by the template parameter, T can be used
    without added qualification in the return type of these operators.


    An int* cannot be initialized by int const because this would create a way to
    modify an object through an entity that wasn''t meant to provide that kind of
    access. In the same vein, we must ensure that a CountingPtr<int> cannot be initialized
    by a CountingPtr<int> const or even by an const*. Again, using the plain (not-qualified)
    template parameter T achieves the desired effect. This may seem straightforward,
    but some smart pointers declare that a constructor or assignment operator accepting
    T const* are common (and presumably erroneous).


    The assignment operators are subject to the same observations as the constructors.
    Naturally, such operators are never const themselves.


    # 20.2.8 Implicit Conversions


    Built-in pointers are subject to several implicit conversions:


    +   * Conversion to void*

    * Conversion to a pointer to a base subobject of the object pointed to

    * Conversion to bool (false if the pointer is null, true otherwise)


    We want to emulate these conversions in our CountingPtr template, but doing so
    is not trivial, as we will see. In addition, some programmers like their smart
    pointers to be convertible to a corresponding built-in pointer type (for example,
    like CountingPtr<int> const> to be convertible to int*).


    Unfortunately, enabling implicit conversions to built-in pointer types creates
    a loophole in the assumption that all pointers to a reference-counted object are
    CountingPtrs. We therefore choose not to provide such a conversion. Therefore,
    a CountingPtr<X> cannot implicitly be converted to void* or X*.


    Other drawbacks to implicit conversions to built-in pointer types include (assume
    cp is a counting pointer):


    +   * delete cp; and ::delete cp; become valid

    * All sorts of meaningless pointer arithmetic goes undiagnosed (for example, cp[n],
    cp2 - cp1, and so forth)'
