  md: "# 15.3 Policy Traits\n\ntraits, we always assume that the sources and destinations\
    \ do not overlap. In an industrial-strength library, a shift operation should\
    \ probably be added to express the policy for shifting objects within a contiguous\
    \ area of memory (the operation enabled by memmove()). We omit it for the sake\
    \ of simplicity.\n\nThe member functions of our policy traits template are all\
    \ static. This is almost always the case, because the member functions are meant\
    \ to apply to objects of the parameter type rather than objects of the traits\
    \ type.\n\nThe other partial specialization implements the traits for bitwise\
    \ types that can be copied:\n\n```\n// traits/csm2.hpp\n#include <string>\n#include\
    \ <cassassert>\n#include <stddef.h>\n#include \"csm1.hpp\"\n\n// partial specialization\
    \ for fast bitwise copying of objects\ntemplate <typename T>\nclass BitOrClassCSM<T,true>\
    \ : public BitOrClassCSM<T,false> {\npublic:\n    static void copy_n(T const*\
    \ src, T* dst, size_t n) {\n        // copy n items onto n others\n        std::memcpy((void*)dst,\
    \ (void*)src, n*sizeof(T));\n    }\n\n    static void copy_init_n(T const* src,\
    \ void* dst, size_t n) {\n        // copy n items onto uninitialized storage\n\
    \        std::memcpy(dst, (void*)src, n*sizeof(T));\n    }\n\n    static void\
    \ move_n(T* src, T* dst, size_t n) {\n        // move n items onto n others\n\
    \        assert(src != dst);\n        std::memcpy((void*)dst, (void*)src, n*sizeof(T));\n\
    \    }\n\n    static void move_init_n(T const* src, void* dst, size_t n) {\n \
    \       // move n items onto uninitialized storage\n        assert(src != dst);\n\
    \        std::memcpy(dst, (void*)src, n*sizeof(T));\n    }\n};\n```"
