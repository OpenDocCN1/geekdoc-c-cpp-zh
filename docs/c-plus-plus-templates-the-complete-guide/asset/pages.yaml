  md: '# # Part I


    # # The Basics


    This part introduces the general concept and language features of C++ templates.
    It starts with a discussion of the general goals and concepts by showing examples
    of function templates and class templates. It continues with some additional fundamental
    template techniques such as nontype template parameters, the keyword `typename`,
    and member templates. It ends with some general hints regarding the use and application
    of templates in practice.


    This introduction to templates is also partially used in Nicolai M. Josuttis''s
    book *Object-Oriented Programming in C++*, published by John Wiley and Sons Ltd,
    ISBN 0-470-84399-3. This book teaches all language features of C++ and the C++
    standard library and explains their practical usage in a step-by-step tutorial.


    # # Why Templates?


    C++ requires us to declare variables, functions, and most other kinds of entities
    using specific types. However, a lot of code looks the same for different types.
    Especially if you implement algorithms, such as `qusort`, or you implement the
    behavior of data structures, such as a linked list or a binary tree for different
    types, the code looks like the same type used.


    If your programming language doesn''t support a special language feature for this,
    you only have alternatives:


    +   1. You can implement the same behavior again and again for each type that
    needs this behavior.

    2. You can write general code for a common base type such as `Object` or `void*`.

    3. You can use special preprocessors.


    If you come from C, Java, or similar languages, you probably have done some or
    all of this before. However, each of these approaches has its drawbacks:


    +   1. If you implement a behavior again and again, you reinvent the wheel. You
    make the same mistakes and you to avoid complicated but better algorithms because
    they lead to even more mistakes.'
  merge: -1
