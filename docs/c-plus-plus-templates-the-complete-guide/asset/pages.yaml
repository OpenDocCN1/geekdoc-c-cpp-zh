  md: "# 4.4 Summary\n\nHowever, the following is possible:\n\n```\ntemplate <char\
    \ const* name>\nclass MyClass {\n  ...\n};\n\nextern char const s[] = \"hello\"\
    ;\n\nMyClass<s> x; //OK\n```\n\nThe global character array s is initialized by\
    \ \"hello\" so that s is an object with external linkage. See Section 8.3.3 on\
