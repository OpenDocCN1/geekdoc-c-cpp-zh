  md: "# Chapter 7\n\n# Basic Template Terminology\n\nSo far we have introduced the\
    \ basic concept of templates in C++. Before we go into details, let's look at\
    \ the terms of the concepts we use. This is necessary because, inside the C++\
    \ community (and even in the standard), there is a lack of precision regarding\
    \ concepts and terminology.\n\n# 7.1 “Class Template” or “Template Class”?\n\n\
    In C++, structs, and unions are collectively called class types. Without additional\
    \ qualification, the word “class” in plain text type is meant to include class\
    \ types with either the keyword class or the keyword struct.¹ Note specifically\
    \ that “class type” includes unions, but “class” does not.\n\nThere is some confusion\
    \ about how a class that is a template is called:\n\n+   - The term template class\
    \ states that the class is a template. That is, it is a parameterized description\
    \ of a family of classes.\n- The term template class on the other hand has been\
    \ used\n  - as a synonym for classes generated from templates.\n  - to refer to\
    \ classes with a name that is a template-id.\n\nThe difference between the second\
    \ and third meaning is somewhat subtle and unimportant for the remainder of the\
    \ text.\n\nBecause of this imprecision, we avoid the term template class in this\
    \ book.\n\nSimilarly, we use function template and member function template, but\
    \ avoid template function and template member function.\n\n> In C++, the only\
    \ difference between class and struct is that the default access for class is\
    \ private whereas the default access for struct is public. However, we prefer\
    \ to use class for types that use new C++ features, and we use struct for ordinary\
    \ C data structure that can be used as “plain old data” (POD)."
