  md: "# 10.3 The C++ Instantiation Model\n\nOur preceding discussion already established\
    \ the POI for fdouble is at point (2). The function template f () refers to the\
    \ class specialization S<char> with a POI that is therefore at point (1). It references\
    \ S<T> too, but because this is still dependent, we cannot really instantiate\
    \ it at this point. If we want to instantiate fdouble at point (2), we notice\
    \ that we also need to instantiate the definition of Sdouble. Such secondary or\
    \ tertiary POIs are defined slightly differently. For nonlocal entities, the secondary\
    \ POI is exactly the same as the primary POI. For classes, the secondary POI immediately\
    \ precedes (the nearest enclosing namespace scope) the primary POI. In our example,\
    \ this means that the POI of f<double> can be placed at point (2), and just before—at\
    \ point (2a)—is the secondary POI for S<double>. Note how this differs from the\
    \ POI for S<char>.\n\nA translation unit contains multiple POIs for the same instance.\
    \ For class instances, the first POI in each translation unit is retained, and\
    \ the subsequent ones are ignored (they are not considered POIs). For nonlocal\
    \ instances, all POIs are retained. In either case, the ODR requires that the\
    \ instantiations occurring at any the POIs be equivalent, but a C++ compiler does\
    \ not need to verify and diagnose violations of this rule. This allows a C++ compiler\
    \ to pick just one POI to perform the actual instantiation without worrying that\
    \ another POI might result in a different instantiation.\n\nIn practice, most\
    \ compilers delay the actual instantiation of nonfunction templates to the end\
    \ of the translation unit. This effectively moves the POIs of the corresponding\
