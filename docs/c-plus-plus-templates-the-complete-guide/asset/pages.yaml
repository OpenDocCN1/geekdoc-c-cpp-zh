  md: '# 6.6.6 Archetypes


    We mentioned earlier that tracers often provide an interface that is the minimal
    requirement of the template they trace. When a minimal tracer does not generate
    run-time output, it is sometimes called an archetype. An archetype allows us to
    verify that a template implementation does not require more syntactic constraints
    intended. Typically, a template implementer will want to develop an archetype
    for every concept identified in the template library.


    # 6.7 Afternotes


    The organization of source code in header files and dot-C files is a practical
    consequence of various incarnations of the so-called *one-definition rule* or
    ODR. An extensive discussion of this rule is presented in Appendix A.


    The inclusion version separation debate has been a controversial one. The inclusion
    model is a pragmatic answer dictated largely by practice in C++ compiler implementations.
    However, the first C++ implementation was: The inclusion of template definitions
    was implicit, which created a certain illusion of *separation* (see Chapter 10
    for details on this original model).


    [StroustrupNe] contains a good presentation of Stroustrup''s vision for template
    code organization and the associated implementation challenges. Clearly wasn''t
    the inclusion model. Yet, at some point in the standardization process, it seemed
    as if the inclusion model was the only viable approach after all. After some intense
    debates, however, envisioning a more decoupled model garnered sufficient support
    for what eventually became the separation model. Unlike the inclusion model, this
    was a theoretical model not based on any existing implementation. It took more
    than five years to see its first implementation published (May 2002).


    It is sometimes imagining ways of extending the concept of precompiled headers
    that more than one header could be loaded for a single compilation. This would
    principle allow for a finer approach to precompilation. The obstacle here is the
    preprocessor: Macros in one header file entirely change the meaning of subsequent
    header files. However, once a file has been precompiled, macro processing is completed,
    and it is highly practically to attempt to patch a precompiled header for the
    preprocessor effects induced by other headers.


    A fairly systematic attempt to improve C++ compiler diagnostics by adding dummy
    code in high-level templates can be found in Jeriek''s *Concept Check Library*
    (see [BCCL]). It is part of the Boost library (see [Boost]).


    # 6.8 Summary


    +   * Templates challenge the classic compiler-plus-linker model. Therefore there
    are different approaches to organize template code: the inclusion model, explicit
    instantiation, and the separation model.

    * Usually, you should use the inclusion model (that is, put template code in header
    files).'
