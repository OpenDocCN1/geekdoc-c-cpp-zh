  md: "```\nint main()\n{\n    std::cout << \"sizeof(EmptyClass): \" << sizeof(EmptyClass)\
    \ << '\\n';\n\n}\n```\n\nFor many platforms, this program will print 1 as size\
    \ of EmptyClass. A few systems presumably impose strict alignment requirements\
    \ on class types and may print another small integer (typically, 4).\n\n# 16.2.1\
    \ Layout Principles\n\nThe designers of C++ had various reasons to avoid zero-size\
    \ classes. For example, an array of zero-size classes would presumably size zero\
    \ too, but the usual properties of pointer arithmetic would not apply. For example,\
    \ let's assume ZeroSizedT is a zero-size type:\n\n```\nZeroSizedT z[10];\n\n&z[i]\
    \ - &z[j] // compute distance between pointers/addresses\n```\n\nNormally, the\
    \ difference in the previous example is obtained by dividing the number of bytes\
    \ between the two addresses by the size of the type to which it is pointing, but\
    \ when size is zero this is clearly unsatisfactory.\n\nHowever, even there are\
    \ no zero-size types in C++, the C++ standard does specify that when an empty\
    \ class is used as a base class, no space needs to be allocated for it provided\
    \ that it does not cause it to be allocated to the same address as another object\
    \ or subobject of the same type. Let's look at some examples to clarify what this-called\
    \ empty base class optimization (EBCO) means in practice. Consider the following\
    \ program:\n\n```\n// inherit/ebco.cpp\n#include <iostream>\n\nclass Empty {\n\
    \    typedef int Int; // typedef members don't make a class nonempty\n};\n\nclass\
    \ EmptyToo : public Empty {\n};\n\nclass EmptyThree : public EmptyToo {\n};\n\
    ```"
