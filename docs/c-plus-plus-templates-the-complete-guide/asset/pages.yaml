  md: '# Chapter 22


    # Function Objects and Callbacks


    A function object (also called a functor) is any object that can be used using
    the function call syntax. In the C programming language, three kinds of entities
    can lead to syntax that looks like a function call: functions, function-like macros,
    and pointers to functions. Because functions and macros are not objects, this
    implies that only pointers to functions are available as functors in C. In C++,
    additional possibilities are added: The function call operator is overloaded for
    class types, a concept of references to functions exists, and member functions-member
    functions have a call syntax of their own. Not all of these are equally useful,
    but the combination of the concept of a functor with the compile-time parameterization
    offered by templates leads to powerful programming techniques.


    Besides developing function types, this chapter also delves into some usage idioms
    for functors. Nearly all uses end up being a form of callback: The client of a
    library wants to call back some function of the client code. The classic example
    is a sorting routine that needs a function to compare two elements in the set
    being sorted. The comparison routine is passed as a function in this case. Traditionally,
    the term callback has been reserved for functions that are passed as function
    call arguments (also opposed to, for example, template arguments), and we maintain
    this tradition.


    The terms function object and functor are unfortunately a fuzzy line in the sense
    that members of the C++ programming community may give different meanings to these
    terms. A common variation of the definition we have given is to include only objects
    of class types in the function or functor object concept; function pointers are
    excluded. Addition, it is not uncommon to read or hear discussions referring to
    the class type of a function object as a "function object." In other words, the
    phrase "class of function objects so and so" is shortened to "function objects
    so and so Although we sometimes handle this terminology somewhat sloppily in our
    daily work, we have made a point to stick to our initial definitions in this chapter.


    Before digging into the use of templates to implement useful functors, we discuss
    some properties of function calls that motivate some of the advantages of template-based
    functors.'
