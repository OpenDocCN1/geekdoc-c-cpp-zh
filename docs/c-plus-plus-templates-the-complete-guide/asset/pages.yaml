    \ Because of this, some C++ implementations should be able to convert what at\
    \ first may look like an indirect call to a direct call. Indeed, if the function\
    \ were inlined at the point of the functor invocation, it would be reasonable\
    \ to expect the call to be inline.\n\n# 22.6 Introspection\n\nIn the context of\
    \ programming, the term introspection refers to the ability of a program to inspect\
    \ itself. For example, in Chapter 15 we designed templates that can inspect a\
    \ type and determine what kind of type it is. For functors, it is often useful\
    \ to be able to tell, for example, how many arguments the functor accepts, the\
    \ return type of the functor, or the nth type of the functor.\n\nIntrospection\
    \ is not easily achieved for an arbitrary functor. For example, how would we write\
    \ a class SuperFunctor {\\public:\n  void operator()(int, char**);\n};\n\nSome\
    \ C++ compilers provide a special type function known as typeof. It evaluates\
    \ to the argument expression (but doesn't actually evaluate the expression, like\
    \ the sizeof operator). With such an operator, the previous problem can be solved\
    \ to a large extent, albeit not easily. The typeof concept is discussed in Section\
    \ 13.8 on page 215.\n\nAlternatively, we can develop a functor framework that\
    \ requires participating functors to provide some extra information to enable\
    \ some level of introspection. This is the approach we use in the remainder of\
    \ this chapter.\n\n# 22.6.1 Analyzing a Functor Type\n\nIn our framework, we handle\
    \ only class functors⁷ and require them to provide the following information:\n\
    \n+   - The number of parameters of the functor (as a member enumerator constant\
    \ NumParams)\n- The type of each parameter (through member typedefs Param1T, Param2T,\
    \ Param3T, ...)\n- The return type of the functor (through a member typedef ReturnT)\n\
    \nFor example, we could rewrite our PersonSortCriterion as follows to fit this\
    \ framework:\n\n> ⁷ To reduce the strength of this constraint, we also develop\
    \ a tool to encapsulate function pointers in the framework."
