  md: '# Chapter 14


    # The Polymorphic Power of Templates


    Polymorphism is the ability to associate different specific behaviors with a single
    generic notation. Polymorphism is a cornerstone of the object-oriented programming
    paradigm, which in C++ is supported mainly through class inheritance and virtual
    functions. Because these mechanisms are (at least in part) handled at run time,
    we talk about dynamic polymorphism. This is usually what thought of when talking
    about plain polymorphism in C++. However, templates also allow us to associate
    different specific behaviors with a single generic notation, but this association
    is generally handled at compile time, which we refer to as static polymorphism.
    In this chapter we review the two forms of polymorphism and discuss which is appropriate
    in situations.


    # 14.1 Dynamic Polymorphism


    Historically, C++ started supporting polymorphism only through the use of inheritance
    combination with virtual functions. The art of polymorphic design in this context
    consists of identifying a common set of capabilities among related object types
    and declaring them as virtual function interfaces in a common base class.


    The poster child for this design approach is an application that manages geometric
    shapes and allows them to be rendered in some way (for example, on a screen).
    In such an application we might identify a so-called abstract base class (ABC)
    Geo0bj, which declares the common operations and properties applicable to geometric
    objects. Each concrete class for specific geometric objects then derives from
    Geo0bj (see Figure 14.1):


    >  Polymorphism literally refers to the condition of having many forms or shapes
    (from the Greek polymorphos).


    >  Strictly speaking, macros can also be thought of as an early form of static
    polymorphism. However, they are left out of consideration because they are mostly
    orthogonal to the other language mechanisms.'
