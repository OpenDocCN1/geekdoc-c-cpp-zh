  md: "# 22.5 Specifying Functors\n\nFor all three declarations of a set, the element\
    \ type and the sorting criterion are passed as template arguments. The standard\
    \ function object type template std::less is defined to return the result of operator\
    \ < as a result of a \"function call.\\ The following simplified implementation\
    \ of std::less clarifies the idea:\n\n```\nnamespace std {\n    template <typename\
    \ T>\n    class less {\n    public:\n        bool operator()(T const& x, T const&\
    \ y) const {\n            return x < y;\n        }\n    }\n}\n```\n\nThe std::greater\
    \ template is similar.\nBecause all sorting criteria have different types, the\
    \ resulting sets also have different types. Therefore, any attempt to assign to\
    \ or compare two of these sets fails at compile time (comparison operator returns\
    \ the same type). This may seem straightforward, but prior to templates, the sorting\
    \ criterion might have been maintained as a function pointer field of the container.\
    \ Any mismatch would likely not have been detected until run time (and perhaps\
    \ not without much frustrating work)\n\n# 22.5 Specifying Functors\n\nOur previous\
    \ example of the standard set class shows only one way to handle the selection\
    \ of functors. A number of different approaches are discussed in this section.\n\
    \n# 22.5.1 Functors as Template Type Arguments\n\nOne way to pass a functor is\
    \ to make it a template argument. A type by itself is not a functor, however,\
    \ the client function or class must create a function object with the given type.\
    \ This, of course, is only possible for class functors, and rules out function\
    \ pointers. A function pointer type does not by itself specify any behavior. Along\
    \ the same lines of thought, this is not an appropriate mechanism to pass a class\
    \ type that encapsulates some state information (because no particular state is\
    \ encapsulated by the type alone; a specific object of that type is needed).\n\
    \nHere is an outline of a function template that takes a functor class as a sorting\
    \ criterion:\n\n> The exact implementation differs because it is derived from\
    \ a class std::binary_function. See Section 8.2.4 of [JossustisStdLib] for details."
