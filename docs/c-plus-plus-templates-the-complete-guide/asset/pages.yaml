    # 10.4.2 Queried Instantiation


    The most popular implementation in this category is provided by a company called
    Sun Microsystems, with release 4.0 of their C++ compiler. Queried instantiation
    is conceptually simple and elegant yet it is chronologically the most recent class
    of instantiation schemes that we review here. In this scheme, a database shared
    by the compilations of all translation units participating in a program is maintained.
    This database keeps track of which specializations have been instantiated and
    on what source they depend. The generated specializations themselves are typically
    stored with this information in the database. Whenever a point of instantiation
    for a linkable entity is encountered, one of three things happen:


    +   1. No specialization is available: In this case, instantiation occurs, and
    the resulting specialization is entered in the database.

    2. A specialization is available but out of date because source changes have occurred
    since it was generated. Here, instantiation occurs, but the resulting specialization
    replaces the one previously stored in the database.

    3. An up-to-date specialization is available in the database. Nothing needs to
    be done. Although conceptually simple, this design presents a few challenges:


    +   - It is not trivial to maintain the dependencies of the database contents
    with respect to the state of the source code. It is not incorrect to mistake the
    third case for the second, so increasing the amount of work by the compiler (and
    overall build time).

    - It is common to compile multiple source files concurrently. Hence, an industrial-strength
    implementation needs to provide the appropriate amount of concurrency control
    in the database. Despite these challenges, the scheme can be implemented efficiently.
    Furthermore, there are no obvious pathological cases that would make this solution
    poor, in contrast, for example with greedy instantiation, which may lead to a
    lot of wasted work.


