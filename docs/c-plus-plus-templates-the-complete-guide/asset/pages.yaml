  md: "# Chapter 13: Future Directions\n\nAn alternative has often been proposed to\
    \ insert a device in the highest level template to inhibit deeper instantiation\
    \ if known requirements from lower levels are not satisfied. Various attempts\
    \ have been made to implement such devices in terms of existing C++ constructs\
    \ (for example, see [BCCL]), they are not always effective. Hence, it is not surprising\
    \ that language extensions have been proposed to address the issue. Such an extension\
    \ could clearly build on of the static properties discussed earlier. For example,\
    \ we can envision modifying shell() template as follows:\n\n```\ntemplate <typename\
    \ T>\nvoid shell (T const& env)\n{\n  std::instantiation_error(\n    !std::type<T>::has_member_type<\"\
    Index\">,\n    \"T must have an Index type\");\n  std::instantiation_error(\n\
    \    !std::type<typename T::>::dereferable,\n    \"T::Index must be a pointer-like\
    \ type\");\n  typename T::Index i;\n  middle(i);\n}\n```\n\nThe instantiation_error()\
    \ pseudo-function would presumably cause the implementation to abort the instantiation\
    \ (thereby avoiding the diagnostics triggered by the instantiation of middle())\
    \ and cause the compiler to issue the given message.\n\nAlthough this is feasible,\
    \ there are some drawbacks to this approach. For example, it can quickly become\
    \ cumbersome to describe all the properties of a type in this manner. Some have\
    \ proposed to allow \"dummy code\" constructs to serve the condition to abort\
    \ instantiation. Here is one of the many proposed forms (this introduces no new\
    \ keywords):\n\n```\ntemplate <typename T>\nvoid shell (T const& env)\n{\n  template\
    \ try {\n    typename T::Index p;\n    *p = 0;\n  } catch \"T::Index must be a\
    \ pointer-like type\";\n  typename T::Index i;\n  middle(i);\n}\n```\n\nThe idea\
    \ here is that the body of a template try clause is tentatively instantiated without\
    \ actually generating object code, and, if an error occurs, the diagnostic that\
    \ follows is issued. Unfortunately, such a mechanism is hard to implement because\
    \ even though the generation of code could be inhib."
