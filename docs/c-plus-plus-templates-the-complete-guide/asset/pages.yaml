  md: "# 21.3 Tuple Construction\n\nThe nested structure of recursive duos makes it\
    \ convenient to apply template metaprogramming techniques to them. However, for\
    \ a human programmer it is more pleasing to have a flat interface to this structure.\
    \ To obtain this, we can define a recursive Tuple template with many parameters\
    \ and have it a derivation from a recursive duo of appropriate size. We show the\
    \ code for tuples up to five fields, but it is not significantly harder to provide\
    \ for a dozen fields or so. You can find the code in tuples/tuple1.hpp.\n\nTo\
    \ allow for tuples of varying sizes, we have unused type parameters that default\
    \ to a null type, NullT, which we define as a placeholder for that purpose. We\
    \ use NullT rather than void because we will create parameters of that type (void\
    \ cannot be a parameter type):\n\n```\n// type that represents unused type parameters\n\
    class NullT {\n};\nTuple is defined as a template that derives from a Duo having\
    \ one more type parameter with NullT defined:\n// in general, Tuple<> is built\
    \ from Tuple<> with one more NullT\ntemplate<typename P1,\n    typename P2 = NullT,\n\
    \    typename P3 = NullT,\n    typename P4 = NullT,\n    typename P5 = NullT>\n\
    class Tuple\n    : public Duo, typename Tuple<P2,P3,P4,P5,NullT>:::BaseT {\npublic:\n\
    \    typedef Duo<P1, typename Tuple<P2,P3,P4,P5,NullT>>:::BaseT;\n\n    // constructors:\n\
    \    Tuple() {}\n    Tuple(TypeOp<P1>:::RefConstT a1,\n        TypeOp<P2>:::RefConstT\
    \ a2,\n        TypeOp<P3>:::RefConstT a3 = NullT(),\n        TypeOp<P4>:::RefConstT\
    \ a4 = NullT(),\n        TypeOp<P5>:::RefConstT a5 = NullT())\n        : BaseT(a1,\
    \ Tuple<P2,P3,P4,P5,NullT>(a2,a3,a4,a5)) {\n};\n```"
