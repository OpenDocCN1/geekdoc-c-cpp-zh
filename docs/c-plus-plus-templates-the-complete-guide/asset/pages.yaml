  md: "# B.3 Overloading Details\n\n```\nint main()\n{\n    for (int k = 0; k<10;\
    \ ++k) {\n        report(k); // ambiguous: (1) and (2) match well\n    }\n   \
    \ report(42); // ambiguous: (1) and (3) match well\n}\n```\n\nTo summarize:\n\n\
    +   - T and const& both match equally well for an rvalue of type T\n- T and T&\
    \ both match equally well for an lvalue of type T\n\n# B.3 Overloading Details\n\
    \nThe previous section covers most of the overloading situations encountered in\
    \ everyday C++ programming. There are, unfortunately, many rules and exceptions\
    \ to these rules—more than is reasonable to present in a book that is not really\
    \ about function overloading in C++. Nonetheless, we discuss some of them in part\
    \ because they apply somewhat more often than other rules and in part to provide\
    \ a sense for how deep the details go.\n\n# B.3.1 Prefer Nontemplates\n\nWhen\
    \ all aspects of overload resolution are equal, a nontemplate function is preferred\
    \ over an instance of a template (it doesn't matter whether that instance is generated\
    \ from the generic template definition or whether it is provided as an explicit\
    \ specialization). For example:\n\n```\ntemplate<typename T> int f(T); // (1)\n\
    void f(int); // (2)\n```\n\n```\nint main()\n{\n    return f(7); // ERROR: selects\
    \ (2), which doesn't return a value\n}\n```\n\nThis example also clearly illustrates\
    \ that overload resolution normally does not involve the return type of the selected\
    \ function.\n\nIf the choice is between two templates, the most specialized of\
    \ the templates is preferred (provided one is actually more specialized than the\
    \ other). See Section 12.2.2 on page 186 for a thorough explanation of this concept."
  merge: -1
