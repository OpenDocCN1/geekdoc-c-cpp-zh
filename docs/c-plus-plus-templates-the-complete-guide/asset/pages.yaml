  md: "# 4.3 Restrictions for Nontype Template Parameters\n\nNote nontype template\
    \ parameters carry some restrictions. In general, they may be constant integral\
    \ values (including enumerations) or pointers to objects with external linkage.\n\
    \nFloating-point numbers and class-type objects are not allowed as nontype template\
    \ parameters:\n\n```\ntemplate <double VAT> // ERROR: floating-point values are\
    \ not\ndouble process (double v) // allowed as template parameters\n{\n  return\
    \ v * VAT;\n}\n```\n\n```\ntemplate <std::string name> // ERROR: class-type objects\
    \ are not\nclass MyClass { // allowed as template parameters\n...\n};\n```\n\n\
    Not being able to use floating-point literals (and simple constant floating-expression)\
    \ as arguments has historical reasons. Because there are no serious technical\
    \ challenges, this may be supported in future versions of C++ (see Section 13.4\
    \ on page 210).\n\nBecause string literals are objects with internal linkage (two\
    \ string literals with the same value but in different modules are different objects),\
    \ you can't use them as template arguments either:\n\n```\ntemplate <char const*\
    \ name>\nclass MyClass {\n...\n};\n```\n\nMyClass<\"hello\"> x; // ERROR: string\
    \ literal \"hello\" not allowed\n\nYou cannot use a global pointer either:\n\n\
    ```\ntemplate <char const* name>\nclass MyClass {\n...\n};\n```\n\nchar const*\
    \ s = \"hello\";\n\nMyClass<s> x; // ERROR: s is pointer to object with internal\
    \ linkage"
