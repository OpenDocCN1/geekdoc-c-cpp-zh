  md: "# 22.5 Specifying Functors\n\nWithin the my_sort() function, we are dealing\
    \ with a copy cmp of the value passed in. When this value is an empty class object,\
    \ there is no state to distinguish a locally constructed functor object from a\
    \ copy passed in. Therefore, instead of actually passing the \"empty functor\"\
    \ as a function call argument, the compiler could use it for overload resolution\
    \ and then hide the parameter/argument altogether. Inside the instantiated function,\
    \ a dummy local object can then serve as the functor.\n\nThis almost works, except\
    \ that the constructor of the \"empty functor\" must be free of side effects.\
    \ In practice this means any function with a user-defined copy constructor should\
    \ not be optimized this way.\n\nAs written, the advantage of this functor specification\
    \ technique is that it is also possible to pass an ordinary functor pointer as\
    \ an argument. For example:\n\n```\nbool my_criterion () (T const& x, T const&\
    \ y);\n```\n\n```\n// call function with function object\nmy_sort(..., my_criterion);\n\
    ```\n\nMany programmers also prefer the function call syntax over the syntax involving\
    \ a template argument.\n\n# 22.5.3 Combining Function Call Parameters and Template\
    \ Type Parameters\n\nIt is possible to combine the two previous forms of passing\
    \ functors to functions and classes by defining default function call arguments:\n\
    \n```\ntemplate <typename F>\nvoid my_sort(... , F cmp = F())\n{\n    if (cmp(x,y))\
