  md: '# 12.3 Explicit Specialization


    The ability to overload function templates, combined with the partial ordering
    rules to select the “best” matching function, allows us to add more specialized
    templates to a generic implementation to tune code for greater efficiency. However,
    class templates cannot be overloaded. Instead, another mechanism was to enable
    transparent customization of class templates: explicit specialization. The term
    explicit specialization refers to a language feature that we call full specialization.
    It provides an implementation for a template with template parameters that are
    fully substituted: No template parameters remain. Class templates and function
    templates can be fully specialized. So members of class templates may be defined
    outside the body of a class definition (i.e., member functions, nested classes,
    and static data members).


    In a later section, we will describe partial specialization. This is similar to
    full specialization, but instead of fully substituting, some parameter is left
    in the alternative implementation of a template. Full specializations and partial
    specializations are both “explicit” in our source code, which is why we use the
    term explicit specialization in our discussion. Neither partial specialization
    introduces a totally new template or instance. Instead, these constructs provide
    alternative definitions for instances that are already implicitly declared in
    the generic (or unspecized) template. This is a relatively important conceptual
    observation, and it is a key difference with overloaded templates.


    # 12.3.1 Full Class Template Specialization


    A full specialization is introduced with a sequence of three tokens: template,
    <, and >.³ In addition, the class name declarator is followed by the template
    arguments for which the specialization is declared. The following example illustrates
    this:


    > ³ The same prefix is also needed to declare full function template specializations.
    Earlier designs of the C++ language did not include this prefix, but the addition
    of member templates required additional syntax to disambiguate complex specialization
    cases.'
