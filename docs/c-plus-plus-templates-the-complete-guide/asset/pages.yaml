  md: "# 22.1 Direct, Indirect, and Inline Calls\n\nTypically, when a C or C++ compiler\
    \ encounters the definition of a nonlin own function, it generates and stores\
    \ machine code for that function in an object file. In C, this name is typically\
    \ the function name itself, but in C++ this name is usually extended with an encoding\
    \ of the parameter types to allow for unique names even when a function is overloaded\
    \ (the resulting name is usually called a *mangled* name, although the term decorated\
    \ name is also used). Similarly, when the compiler encounters a call site like\n\
    \n```\nf();\n```\n\nit generates machine code for a call to a function of that\
    \ type. For most languages, the call instruction itself necessitates the starting\
    \ address of the routine. This address can be part of the instruction (in which\
    \ the case the instruction is a direct call), or it may reside somewhere in a\
    \ machine register (indirect call). Almost all modern architectures provide both\
    \ types of calling instructions, (for reasons that are beyond the scope of this\
    \ book) direct calls are executed more efficiently than indirect calls. In fact,\
    \ as computers get more sophisticated, it appears that the performance gap between\
    \ direct and indirect calls increases. Hence, compilers generally attempt to generate\
    \ a direct call when possible\n\nIn general, a compiler may not know at which\
    \ a function is located (the function could, for example, in another translation\
    \ unit). However, if the compiler knows the name of the function, it generates\
    \ a direct call instruction with a dummy address. In addition, it generates an\
    \ entry in the generated object file directing the linker to update that instruction\
    \ to the address of a function with the given name. Because the linker sees the\
    \ object files created from all the translation units, it knows the call sites\
    \ as well as the definition sites and hence is able to patch up all the call sites.\n\
    \nUnfortunately, when the name of the function is not available, an indirect call\
    \ must be used. It is usually the case for calls through pointers to functions:\n\
    \n```\nvoid foo (void (*pf)())\n{\n    pf(); // indirect call through pointer\
    \ to function pf\n}\n```\n\nIn this example it is, in general, not possible for\
    \ a compiler to know which function parameter pf points (after all, it is most\
    \ likely for a different invocation of foo()). The technique of having the linker\
    \ patch names does not work. The call destination is not known until the call\
    \ is actually executed.\n\nAlthough a modern computer can execute a direct call\
    \ instruction about as quickly as common instructions (for example, an instruction\
    \ to add two integers), function calls can still be a serious performance impediment.\
    \ The following example shows this:"
