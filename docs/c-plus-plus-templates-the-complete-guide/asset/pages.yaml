  md: "# 21.2.2 Type of Fields\n\nA recursive duo is not really handy compared with,\
    \ say, a Trio or Quartet class that we could write. For example, to access the\
    \ third value of the q4 object in the previous code, we'd have to use an expression\
    \ line\n\n```\nq4.v2().v2().v1()\n```\n\nThis is hardly compact or intuitive.\
    \ Fortunately, it is possible to write recursive templates that efficiently retrieve\
    \ the values and types of fields in a recursive duo.\n\nLet's first look at the\
    \ code for a function DuoT to retrieve the nth type of a recursive duo (you can\
    \ find the code in tuples/duo3.hpp). The generic definition\n\n```\n// primary\
    \ template for type of N field of (duo) T\ntemplate <int N, typename T>\nclass\
    \ DuoT {\npublic:\n    typedef void ResultT; // in general, the result type is\
    \ void\n};\n```\n\nensures that the result is void for non-Duos. Fairly simple\
    \ partial specializations take care of retrieving the types from noncommutative\
    \ Duo:\n\n```\n// specialization for 1st field of a plain duo\ntemplate <typename\
    \ A, typename B>\nclass DuoT <1, Duo<A,B> > {\npublic:\n    typedef A ResultT;\n\
    };\n```\n\n```\n// specialization for 2nd field of a plain duo\ntemplate <typename\
    \ A, typename B>\nclass DuoT<2, Duo<A,B> > {\npublic:\n    typedef B ResultT;\n\
    };\n```\n\nWith in this place, the nth type of a recursive duo, in general, is\
    \ the (n-1)th type of the second field:\n\n```\n// specialization for Nth field\
    \ of a recursive duo\ntemplate <int N, typename A, typename B, typename C>\nclass\
    \ DuoT<N, Duo<A, Duo<B,C>> > {\npublic:\n    typedef typename Duo<N-1, Duo<B,C>>::ResultT\
    \ ResultT;\n};\n```"
