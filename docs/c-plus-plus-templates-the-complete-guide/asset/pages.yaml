  md: "# 22.5 Specifying Functors\n\n```\nvirtual bool operator()(SomeType const,\n\
    SomeType const&) const;\n};\n```\n\n```\ntemplate<MyCriterion& F>\nvoid sort (...);\n\
    \nLessThan order;\n\nsort<order> (...);\nsort<MyCriterion&>(order) (...); // ERROR:\
    \ requires derived-to-base\n// conversion\n// ERROR: reference nontype argument\n\
    // must be simple name\n// (without a case)\n```\n\nOur idea in the previous example\
    \ is to capture the instance of the sorting criteria for the template parameter.\
    \ In an ideal world, we could then just pass in base class type and derived classes\
    \ (such as LessThan) to request a specific implementation of the base class interface\
    \ (MyCriterion). Unfortunately, C++ does not permit such an approach: Notype arguments\
    \ with reference or pointer types must match the parameter type exactly. An implicit\
    \ derived-to-base conversion is not considered, and making the conversion explicit\
    \ also invalidates the argument.\n\nIn light of our previous examples, we conclude\
    \ that class functors are not passed as nontype template arguments. In contrast,\
    \ pointers (or references) to functions can be valid nontype template arguments.\
    \ The following section explores some of the possibilities offered by this concept.\n\
    \n# 22.5.5 Pointer Encapsulation\n\nSuppose we have a framework that expects functors\
    \ for the sorting criteria of the examples in the previous sections. Furthermore,\
    \ we may have some functions from an older (nontemplate) library that we'd like\
    \ to act as a functor.\n\nTo solve this problem, we can simply wrap the function\
    \ call. For example:\n\n```\nclass CriterionWrapper {\npublic:\n  bool operator()\
    \ (...) {\n    return wrapped_function(...);\n  }\n};\n```\n\nHere, wrapped_function()\
    \ is a legacy function that we like to fit in our more general functor framework\
    \ work."
