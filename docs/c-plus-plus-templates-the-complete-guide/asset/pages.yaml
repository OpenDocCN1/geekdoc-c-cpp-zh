  md: "# Chapter 12: Specialization and Overloading\n\nAn example illustrates these\
    \ limitations:\n\n```\ntemplate<typename T, int I = 3>\nclass S; // primary template\n\
    \ntemplate<typename T>\nclass S<int, T>; // ERROR: parameter kind mismatch\n\n\
    template<typename T = int>\nclass S<T, 10>; // ERROR: no default arguments\n\n\
    template<int I>\nclass S<int, I*>; // ERROR: no nontype expressions\n\ntemplate<typename\
    \ U, int K>\nclass S<U, K>; // ERROR: no significant difference\nfrom primary\
    \ template\n```\n\nEvery partial specialization—like every specialization—is associated\
    \ with the primary template. When a template is used, the primary template is\
    \ always the one that is looked up, but the arguments are also matched against\
    \ the associated specializations to determine which template implementation is\
    \ picked. If multiple matching specializations are found, the “most specialized”\
    \ (one in the sense defined for overloaded function templates) is selected; if\
    \ none can be called “most specialized,” the program contains an ambiguity error.\n\
    \nFinally, we should point out that it is entirely possible for a class template\
    \ partial specialization to have more or fewer parameters than the primary template.\
    \ Consider our generic template List (declared at point (1)) again. We have already\
    \ discussed how to optimize the list-of-pointers case, but we may want to do the\
    \ same with generic pointer-to-member types. The following code achieves this\
    \ for pointer-to-member-pointers:\n\n```\ntemplate<typename C>\nclass List<void*\
    \ C::*> { // (4)\npublic:\n    // partial specialization for any pointer-to-void*\
    \ member\n    // every other pointer-to-member type will use this\n    typedef\
    \ void* C::*ElementType;\n    ...\n    void append(ElementType pm);\n    inline\
    \ size_t length() const;\n    ...\n```\n\n};"
