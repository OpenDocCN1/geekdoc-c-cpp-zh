  md: '# 14.6 Afternotes


    By parameterizing its operations in terms of these iterators, the STL avoids an
    explosion in the number of operation definitions. Instead of implementing each
    operation for every container, we implement the algorithm once so that it can
    be used for every container. The generic glue the iterators that are provided
    by the containers and are used by the algorithms. This works because iterators
    have a certain interface that is provided by the containers and used by the algorithms.
    This interface is usually a concept, which defines a set of constraints that a
    template has to fit into this framework.


    In principle, functionality as an STL-like approach could be implemented with
    dynamic polymorphism. In practice, however, it would be of limited use because
    iterator concept is too lightweight compared with the virtual call mechanism.
    Adding an interface layer based on virtual functions would most likely slow down
    our operations by an order of magnitude (or more).


    Generic programming is practical exactly because it relies on static polymorphism,
    which interfaces at compile time. On the other hand, the requirement that the
    interfaces be resolved at compile time also calls for new design principles that
    defined in many ways by object-oriented design principles. Many of the most important
    of these generic design principles are described in the remainder of this chapter.


    # 14.6 Afternotes


    Container types were a primary motivation for the introduction of templates in
    the C++ programming language. Prior to templates, polymorphic hierarchies were
    a popular approach to containers. A popular example was the National Institutes
    of Health Class Library (NIHCL), which to a large extent translated the container
    hierarchy of Smalltalk (see Figure 14.5).


    Like the C++ standard library, the NIHCL supported a variety of containers as
    well as iterators. However, the implementation followed the Smalltalk style of
    dynamic polymorphism: Iterators used the base class Collection to operate on different
    types of collections:


    ```

    Bag c1;

    Set c2;


    Iterator i1(c1);

    Iterator i2(c2);

    ```


    Unfortunately, the price of this approach was high in terms of running time and
    memory usage. Running time was typically orders of magnitude worse than equivalent
    code using the C++ standard library because most operations ended up requiring
    a virtual call (whereas in the C++ standard library many operations are inlined,
    and no virtual functions are involved in iterator and container interfaces). Furthermore,
    because (unlike Smalltalk) the interfaces were bounded, built-in types had to
    be wrapped in larger polymorphic classes (which wrappers were provided by the
    NIHCL), which could lead to dramatic increases in storage requirements.


    Some solace in macros, but in today''s age of templates many projects still make
    suboptimal choices in their approach to polymorphism. Clearly there are many situations
    when'
