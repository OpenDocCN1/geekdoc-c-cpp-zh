    \nThe conversion to bool is mostly useful to support constructs of the form\n\n\
    ```\nif (cp) ...\n```\n\nor\n\n```\nwhile (!cp) ...\n```\n\nTherefore, this problem\
    \ has traditionally been worked around by providing a conversion to void* (in\
    \ which is implicitly converted to bool in just the right places).^4 This approach\
    \ has its own drawbacks in general, but it has them especially for a smart pointer\
    \ for which we already decided not to provide an implicit conversion to void*.\n\
    \nA simple (but often overlooked) solution to this problem is to define a conversion\
    \ to a pointer-to-member type instead of a built-in type. Indeed, pointer-to-member\
    \ types also support implicit conversion to bool, but unlike regular pointers\
    \ they're not valid types for operator delete or for pointer arithmetic. The following\
    \ addition to our CountingPtr template illustrates how to apply this technique:\n\
