  md: "# 15.3.1 Read-only Parameter Types\n\nIn C and C++, function call arguments\
    \ are passed \"by value\" by default. This means that the values computed by the\
    \ caller are copied to locations controlled by the caller. Most programmers know\
    \ that this can be costly for large structures and for structures it is appropriate\
    \ to pass the arguments \"reference-to-const\" (or \"by-pointer-to-const\" in\
    \ C). For smaller structures, the performance is not always clear, and the best\
    \ mechanism from a performance point of view depends on the exact architecture\
    \ for which the code is being written. This is not as critical in most cases,\
    \ but even the smallest structures must be handled with care.\n\nWith templates,\
    \ of course, things get a little more delicate: We don't know a priori the type\
    \ substituted by the template parameter will be. Furthermore, the decision doesn't\
    \ depend on size: A small structure with an expensive constructor that would still\
    \ justify passing read-only parameters \"reference-to-const\".\n\nAs hinted earlier,\
    \ this problem is conveniently handled using a policy traits template that is\
    \ a type function: The function maps the intended argument T onto the optimal\
    \ parameter type T or const&. As a first approximation, the template can use \"\
    by value\" passing for types no larger than two pointers and \"by reference-to-const\"\
    \ for everything else:\n\n```\ntemplate<typename T>\nclass RParam {\npublic:\n\
    \    typedef typename IfThenElse<sizeof(T)<=2*sizeof(void),\nT,\\T const&>::ResultT\
    \ Type;\n};\n```\n\nOn the other hand, container types for which sizeof returns\
    \ a small value may involve expensive copy constructors. We may need many specializations\
    \ and partial specializations, such as the following:\n\n```\ntemplate<typename\
    \ T>\nclass RParam<Array<T>> > {\npublic:\n    typedef Array<T> const Type;\n\
    };\n```\n\nBecause such types are common in C++, it may be safer to mark nonclass\
    \ types \"by value\" in the primary template and then selectively add the class\
    \ when performance considerations dictate it (the primary template uses IsClassT<T>\
    \ from page 266 to identify class types):\n\n```\n// traits/rparam.hpp\n#ifndef\
    \ RPARAM_HPP\n#define RPARAM_HPP\n```"
