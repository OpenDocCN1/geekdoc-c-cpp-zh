    \ = SimpleReferenceCount,\n   typename ObjectPolicy = StandardObjectPolicy>\n\
    class CountingPtr : private counterPolicy, private ObjectPolicy {\n   ...\n  \
    \ public:\n      operator bool() const {\n        return this->object_pointed_to\
    \ != (T*)0;\n   }\n};\n```\n\nThis works, but it also allows surprising and unintentional\
    \ operations on CountingPtrs. For example, with this in place, we can add two\
