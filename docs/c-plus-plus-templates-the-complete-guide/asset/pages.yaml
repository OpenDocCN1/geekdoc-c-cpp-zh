    representation of efficient algorithms. The book summarizes:


    > Generic programming is a subdiscipline of computer science that deals with abstract
    representations of efficient algorithms, data structures, and other software concepts,
    and with their systematic organization... Generic programming focuses on representing
    families of domain concepts (pages 169 and 170)


