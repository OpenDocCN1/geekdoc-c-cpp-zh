    template parameters is sometimes called higher-order genericity. They were originally
    introduced to support a certain allocator model in the C++ standard library, but
    that allocator model was later replaced by one that does not rely on template
    template parameters. Later, template template parameters came close to being removed
    from the language because their specification had remained incomplete until very
    late in the standardization process. Eventually a majority of committee members
