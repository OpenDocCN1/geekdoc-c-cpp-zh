  md: "# 12.4 Partial Class Template Specialization\n\n```\nsize_t length() const\
    \ {\n    return impl.length();\n}\n...;\n```\n\nIn this context, the original\
    \ template at point (1) is called the primary template, and the later definition\
    \ is called a partial specialization (the template arguments for which this template\
    \ definition must have been used only partially specified). The syntax that characterizes\
    \ a partial specialization is the combination of a template parameter list declaration\
    \ (template...) and a set of explicitly specified template arguments on the name\
    \ of the class template (<T> in our example).\n\nOur code contains a problem because\
    \ List<void*>* recursively contains a member of that same List<void*> type. To\
    \ break the cycle, we can precede the previous partial specialization with a full\
    \ specialization:\n\n```\ntemplate<\nclass List<void*> { // (3)\n    void append(void*\
    \ p);\n    inline size_t length() const;\n...};\n```\n\nThis works matching full\
    \ specializations are preferred over partial specializations. As a result, all\
    \ member functions of Lists of pointers are forwarded (through easily inline functions)\
    \ to the implementation of List<void*>. This is an effective way to combat so-called\
    \ \"code bloat\" of which C++ templates are often accused.\n\nThere exists a number\
    \ of limitations on the parameter and argument lists of partial specialization\
    \ declarations. Some of them are as follows:\n\n+   1. The arguments of the partial\
    \ specialization must match in kind (type, nontype, or template) the corresponding\
    \ parameters of the primary template.\n\n+   2. The parameter list of the partial\
    \ specialization cannot have default arguments; the default arguments of the primary\
    \ class template are used instead.\n\n+   3. The nontype arguments of the partial\
    \ specialization should be either nondependent values or plain nont template parameters.\
    \ They cannot be more complex dependent expressions like 2*N (where N is a template\
    \ parameter).\n\n+   4. The list of template arguments of the partial specialization\
    \ should not be identical (ignoring renaming) to the list of parameters of the\
    \ primary template."
