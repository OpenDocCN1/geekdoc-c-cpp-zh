    Templates enable us to parameterize classes and functions for various types. It
    could be tempting to introduce as many template parameters as possible to enable
    the customization of every aspect of a type or algorithm. In this way, our “templated”
    components could be instantiated to meet the exact needs of client code. However,
    from a practical point of view it is rarely desirable to introduce dozens of template
    parameters for maximal parameterization. Having to specify all the corresponding
    arguments in the client code is overly tedious.


    Fortunately, it turns out that most of the extra parameters we would introduce
    have reasonable default values. In some cases the extra parameters are entirely
    determined by a few main parameters, and we''ll see that such extra parameters
    can be omitted altogether. Other parameters can be given default values that must
    depend on the main parameters and meet the needs of most situations, but the default
    values must occasionally be overridden (for special applications). Yet other parameters
    are unrelated to the main parameters. In a sense they are themselves main parameters,
    except for the fact that there exist default values that almost fix the bill.


    Policy classes and traits (or traits templates) are C++ programming devices that
    greatly facilitate the management of the sort of extra parameters that come up
    in the design of industrial-strength templates. In this chapter we show a number
    of situations in which they prove useful and demonstrate various techniques that
    will enable you to write robust and powerful devices of your own.


    # 15.1 An Example: Accumulating a Sequence


    Computing the sum of a sequence of values is a fairly common computational task.
    However, seemingly simple problem provides us with an excellent example to introduce
    various levels at which policy classes and traits can help.'
