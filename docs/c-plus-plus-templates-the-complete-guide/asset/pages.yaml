    Oracles allow us, in some cases, to verify template algorithms dynamically without
    fully spec-

    ifying the substituting templates (the oracles are the arguments) or the input
    data (the

    inference engine may receive some sort of input assumption when it gets stuck).
    The complexity of the algorithms that can be analyzed in this way is still modest
