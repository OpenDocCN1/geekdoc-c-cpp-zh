    \ Both algorithms and containers are templates. However, the key is that the algorithms\
    \ are not member functions of the containers. Instead, the algorithms are written\
    \ in a generic way so that they can be used by any container (linear collection\
    \ of elements). To do this, designers of STL identified an abstract concept of\
    \ iterators that can be provided for any kind of linear collection. Essentially,\
    \ the collection-specific aspects of container operations have been factored into\
