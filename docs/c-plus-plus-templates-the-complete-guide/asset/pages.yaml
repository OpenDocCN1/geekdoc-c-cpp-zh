  md: "# 20.1.1 Protecting Against Exceptions\n\nExceptions were introduced in C++\
    \ to improve the reliability of C++ programs. They allow regular and exceptional\
    \ execution paths to be more clearly separated. Yet shortly after exceptions were\
    \ introduced, various C++ programming authors and commentators started observing\
    \ that a naive use of exceptions leads to trouble, and particularly to memory\
    \ leaks. The following example shows but one of the troublesome situations that\
    \ could arise:\n\n```\nvoid do_something() {\n    Something* ptr = new Something;\n\
    \n    // perform some computation with *ptr\n    ptr->perform();\n\n    delete\
    \ ptr;\n}\n```\n\nThis function creates an object with new, performs some operations\
    \ with this object, and destroys the object at the end of the function with delete.\
    \ Unfortunately, if something goes wrong after the creation before the deletion\
    \ of the object and an exception gets thrown, the object is not deallocated and\
    \ the program leaks memory. Other problems may arise because the destructor is\
    \ not called (for example, buffers may not be written out to disk, network connections\
    \ may not be released, on-screen windows may not be closed, and so forth). This\
    \ particular case can be handled fairly easily using an explicit exception handler:\n\
    \n```\nvoid do_something() {\n    Something* ptr = 0;\n    try {\n        ptr\
    \ = new Something;\n\n        // perform some computation with *ptr\n        ptr->perform();\n\
    \        ...\n    } catch (...) {\n        delete ptr;\n        throw; // rethrow\
    \ the exception that was caught\n    }\n    delete ptr;\n}\n```"
