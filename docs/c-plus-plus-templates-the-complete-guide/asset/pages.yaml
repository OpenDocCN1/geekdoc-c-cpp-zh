  md: "# B.2.2 Refining the Perfect Match\n\nFor an argument of type int, there are\
    \ three common parameter types that constitute a perfect match: int, int&, and\
    \ const&. However, it is rather common to overload a function on both kinds of\
    \ references:\n\n```\nvoid report(int&);           // (1)\nvoid report(int const&);\
    \ // (2)\n\nint main()\n{\n    for (int k = 0; k<10; ++k) {\n        report(k);\
    \           // calls (1)\n    }\n    report(42);               // calls (2)\n\
    }\n```\n\nIn such cases the version without the extra const is preferred for lvalues,\
    \ whereas the version with const is preferred for rvalues.\nNote that this also\
    \ applies to the implicit argument of member function call:\n\n```\nclass Wonder\
    \ {\npublic:\n    void tick();           // (1)\n    void tick() const;    //\
    \ (2)\n    void tack() const;    // (3)\n};\n```\n\n```\nvoid run(Wonder& device)\n\
    {\n    device.tick();          // calls (1)\n    device.tack();          // calls\
    \ (3) because there is no non-const version\n                             // of\
    \ Wonder::tack()\n}\n```\n\nFinally, the following modification of our earlier\
    \ example illustrates that two perfect matches can also create an ambiguity if\
    \ you overload with and without references:\n\n```\nvoid report(int);        //\
    \ (1)\nvoid report(int&);      // (2)\nvoid report(int const&); // (3)\n```"
  merge: -1
