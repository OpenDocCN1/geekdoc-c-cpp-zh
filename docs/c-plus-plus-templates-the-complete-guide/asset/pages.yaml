    Some programmers decide that it is better to #include some extra unnecessary headers
    than to pass on an opportunity to accelerate the translation of a file using a
    precompiled header. This decision can considerably ease the management of the
    inclusion policy. For example, it is relatively straightforward to create a header
    file named .hpp that includes all the standard headers⁴:


    ```

    #include <iostream>

