    \ forytwo(42);\n    client(seven);\n    client(fortytwo);\n}\n```\n\nConstantIntFunctor\
    \ is a class type from which functors can be generated. That is, if you create\
    \ an object with\n\nConstantIntFunctor seven(7); // create function object\n\n\
