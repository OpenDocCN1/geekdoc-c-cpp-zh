  md: "286\n\nChapter 16: Templates and Inheritance\n\nClearly, it would be attractive\
    \ to be able to use a construct akin to BreadSlicerPolicy3 = Custom> BreadSlicerDefaultPolicy1,\
    \ DefaultPolicy2, Custom> as the case right now. In what follows we develop a\
    \ technique to enable almost exactly that.¹\n\nOur technique consists of placing\
    \ the default type values in a base class and overriding of them through derivation.\
    \ Instead of directly specifying the type arguments, we could write BreadSlicer<Policy3_is<Custom>\
    \ . Because each template can describe any of the policies, the defaults cannot\
    \ be different. In other, at a high level every template parameter is equivalent:\n\
    \n```\ntemplate <typename Policy1 = DefaultPolicyArgs,\ntypenam Policy2 = DefaultPolicyArgs,\n\
    typenam Policy3 = DefaultPolicyArgs,\ntypenam Policy4 = DefaultPolicyArgs>\nclass\
    \ BreadSlicer {\n    typedef PolicySelector<Policy1, Policy2,\n              \
    \             Policy3, Policy4> Policies;\n    Policies;\n    // uses Policies::P1,\
    \ Policies::P2, ... to refer to the various policies\n\n};\n```\n\nThe remaining\
    \ challenge is to write the PolicySelector template. It has to merge the different\
    \ template arguments into a single type that overrides typedef members with whichever\
    \ non-defaults were specified. This merging can be achieved using inheritance:\n\
    \n```\n//PolicySelector<A,B,C,D> creates A,B,C,D as base classes\n//Discriminator<>\
    \ allows even the same base class more once\n```\n\n```\ntemplate <typename Base,\
    \ int D>\nclass Discriminator : public Base {\n};\n\ntemplate <typename Setter1,\
    \ typename Setter2,\n          typename Setter3, typename Setter4>\nclass PolicySelector\
    \ : public Discriminator<Setter1,1,\n                               public Discriminator<Setter2,2,\n\
    \                               public Discriminator<Setter3,3,\n            \
    \                   public Discriminator<Setter4,4> {\n\n};\n```\n\n> ¹ Note that\
    \ a similar language extension for function call arguments was proposed (and rejected)\
    \ earlier in the C++ standardization process (see Section 13.9 on page 216 for\
    \ details)."
