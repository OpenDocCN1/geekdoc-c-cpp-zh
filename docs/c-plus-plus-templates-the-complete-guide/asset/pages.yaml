  md: "```\nclass PersonSortCriterion {\npublic:\n    enum { NumParams = 2 };\n  \
    \  typedef bool ReturnT;\n    typedef Person const& Param1T;\n    typedef Person\
    \ const& Param2T;\n    bool operator()(Person const& p1, Person const& p2) const\
    \ {\n        // whether p1 is “less than” p2\n    }\n};\n```\n\nThese conventions\
    \ are sufficient for our purposes. They allow us to write templates to create\
    \ new functors from existing ones (for example, through composition).\n\nThere\
    \ are other properties of a functor that can be worth representing in this. For\
    \ example, we could decide to encode the fact that a functor has no side effects\
    \ and use this information to optimize certain generic templates. Such functors\
    \ are sometimes called *pure functors*. It would also be useful to enable introspection\
    \ of this property to enforce the rule for a pure functor at compile time. For\
    \ example, using a sorting criterion should be pure^8; otherwise, the results\
    \ of the sorting operation could be meaningless.\n\n# 22.6 Accessing Parameter\
    \ Types\n\nA functor can have an arbitrary number of parameters. With our conventions\
    \ it is relatively straightforward to access, say, the eighth parameter type:\
    \ Param8T. However, when dealing with templates it is always useful to plan for\
    \ maximum flexibility. In this case, how do we write a type function that produces\
    \ the Nth parameter type given the functor and a constant N? We can do this by\
    \ writing partial specializations of the following class template:\n\n```\ntemplate<typename\
    \ FunctorType, int N>\nclass FunctorParam;\n```\n\nWe can provide partial specializations\
    \ of N from one to reasonably large number (say, 20); functors rarely more than\
