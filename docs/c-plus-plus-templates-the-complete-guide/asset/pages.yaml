    \ declared with the static specifier in the global scope or in a namespace scope)\
    \ even when two entities have the same name, they are considered distinct. In\
    \ the same vein, entities declared in unnamed namespaces are considered distinct\
    \ if they appear in different translation units. For example, the following two\
    \ translation units can be combined into a valid C++ program:\n\n```\n//Translation\
    \ unit 1:\n```\n\n```\nstatic int counter = 2; // unrelated to other translation\
    \ units\n\nnamespace {\n    void unique() // unrelated to other translation units\n\
    \    {\n    }\n}\n```\n\n```\n//Translation unit 2:\n```\n\n```\nstatic int counter\
    \ = 0; // unrelated to other translation units\n\nnamespace {\n    void unique()\
    \ // unrelated to other translation units\n    {\n        ++counter;\n    }\n\
    }\n```\n\n```\nint main() {\n    unique();\n}\n```\n\nFurthermore, there must\
    \ be exactly one of the previously mentioned items in the program if they are\
    \ used. The term *used* in this context has a precise meaning. It indicates that\
    \ there is some sort of reference to the entity somewhere in the program. This\
    \ reference can be an access to the value of a variable, a call to a function,\
    \ or the address of such entity. This reference can be explicit in the source,\
    \ or it can be implicit. For example, a new expression may make an implicit call\
    \ to the associated delete operator to handle situations when a constructor throws\
    \ an exception requiring the unused (but allocated) memory to be cleaned up. Another\
    \ example consists of copy constructors, which must be defined even if they end\
    \ up being optimized. Virtual functions are implicitly used (by the internal structures\
    \ that enable virtual function calls), unless they are pure virtual functions.\
    \ Several other kinds of implicit uses exist, but we omit them for the sake of\
    \ conciseness."
