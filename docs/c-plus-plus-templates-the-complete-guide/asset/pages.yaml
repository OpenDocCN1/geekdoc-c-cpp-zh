  md: '# Chapter 17


    # Metaprograms


    Metaprogramming consists of “programming a program.” In other words, we lay out
    code that the programming system executes to generate new code that implements
    the functionality we really want. Usually the term metaprogramming implies a reflexive
    attribute: The metaprogramming component is part of the program for which it generates
    a bit of code/program.


    Why would metaprogramming be desirable? As with most programming techniques, the
    goal is to achieve more functionality with less effort, where effort can be measured
    as code size, maintenance cost, and so forth. What characterizes metaprogramming
    is that some user-defined computation happens at translation time. The underlying
    motivation is often performance (things computed at translation time can frequently
    be optimized away) or interface simplicity (a metaprogram is generally shorter
    than what it expands to) or both.


    Metaprogramming often relies on the concepts of traits and type functions as developed
    in Chapter 15. We recommend getting familiar with the chapter prior to delving
    into this.


    # 17.1 A First Example of a Metaprogram


    In 1994 during a meeting of the C++ standardization committee, Erwin Unruh discovered
    that templates can be used to compute something at compile time. He wrote a program
    that produced prime numbers. The intriguing part of this exercise, was that the
    production of the prime numbers was performed by the compiler during the compilation
    process and not at runtime. Specifically, the compiler produced a sequence of
    error messages with all prime numbers from up to a certain 불구하고. Although this
    program wasn''t strictly portable (error messages aren''t standardized), the program
    did show that the template instantiation mechanism is a primitive recursive language
    that can perform nontrivial computations at compile time. Such sort of compile-time
    computation occurs through template instantiation is commonly called template
    metaprogramming.


    As an introduction to the details of metaprogramming we start with a simple exercise
    (we will show Erwin''s prime number program later on page 318). The following
    program shows how to compute at compile time the power of three for a given value:'
