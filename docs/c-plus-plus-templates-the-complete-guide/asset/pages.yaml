  md: "# 18.4 Afternotes\n\nExpression templates were developed independently by Todd\
    \ Veldhuizen and David Vandevoorde (Todd coined the term) at a time when member\
    \ templates were not yet added to the C++ programming language (and it seemed\
    \ at the time they never would be to C++). This caused some problems in implementing\
    \ the assignment operator: It could not be parameterized for the expression template.\
    \ One technique to work around was introducing in the expression templates a conversion\
    \ operator to a Copier class parameterized with the expression template but inheriting\
    \ from a base class that was parameterized only in the element type. This base\
    \ class then provided a (virtual) copy_to interface to which the assignment operator\
    \ could call refer. Here is a sketch of the\n\n```\ntemplate<typename T>\nclass\
    \ CopierInterface {\npublic:\n    virtual void copy_to(Array<T, SArray<T> >) const;\n\
    };\n```\n\n```\ntemplate<typename T, typename X>\nclass Copier : public CopierInterface<T>\
    \ {\npublic:\n    Copier(X const &expr) : expr(x) {}\n    virtual void copy_to(Array<T,\
    \ SArray<T> >) const {\n    // implementation of assignment loop\n    ...\nprivate:\n\
    \    X const &expr;\n};\n```\n\n```\ntemplate<typename T, typename Rep = SArray<T>>nclass\
    \ Array {\npublic:\n    // delegated assignment operator\n    Array<T, Rep>& &operator=(CopierInterface<T>\
    \ const &b) {\n    b.copy_to(rep);\n    ...\n};\n```"
