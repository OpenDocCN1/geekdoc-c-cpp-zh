  md: "# 2.4 Overloading Function Templates\n\nLike ordinary functions, function templates\
    \ can be overloaded. That is, you can have different function definitions with\
    \ the same name so that when name is used in a function call, a C++ compiler must\
    \ decide which of the various candidates to call. The rules for this decision\
    \ may become rather complicated, even without templates. In this section we discuss\
    \ overloading when templates are involved. If you are not familiar with the basic\
    \ rules of overloading without templates, please look at Appendix B, where we\
    \ provide a reasonably detailed survey of the overload resolution rules.\n\nThe\
    \ following short program illustrates overloading a function template:\n\n```\n\
    // basics/max2.cpp\n// maximum of two int values\ninline int const max(int const&\
    \ a, int const& b)\n{\n    return a < b ? b : a;\n}\n```\n\n```\n// maximum of\
    \ two values of any type\ntemplate <typename T>\ninline T const max(T const& a,\
    \ T const& b)\n{\n    return a < b ? b : a;\n}\n```\n\n```\n// maximum of three\
    \ values of any type\ntemplate <typename T>\ninline T const max(T const& a\n```\n\
    \n```\nint main()\n{\n    :max(7, 42, 68); // calls the template for three arguments\n\
    \    :max(7.0, 42.0); // calls max<double> (by argument deduction)\n    :max('a',\
    \ 'b'); // calls max<char> (by argument deduction)\n    :max(7, 42); // calls\
    \ the nontemplate for two ints\n    :max<>(7, 42); // calls max<int> (by argument\
    \ deduction)\n    :max<double>(7, 42); // calls max<double> (no argument deduction)\n\
    \    :max('a', 42.7); // calls the nontemplate for two ints\n}\n```"
