  md: '# Chapter 13


    # Future Directions


    C++ templates evolved considerably from their initial design in 1988 until the
    standardization of C++ in 1998 (the technical work was completed in November 1997).
    After that, the language definition was stable for several years, but during that
    time new needs have arisen in the area of C++ templates. Some of these needs are
    simply a consequence of a desire for more consistency or orthogonality in the
    language. For example, why wouldn''t default template arguments be allowed on
    function templates when they are allowed class templates? Other extensions are
    prompted by increasingly sophisticated template programming idioms that often
    stretch the abilities of existing compilers.


    In what we describe some extensions that have come up more than among C++ language
    and compiler designers. Often extensions were prompted by the designers of various
    advanced C++ libraries (including the C++ standard library). There is no guarantee
    that any of these will ever be part of standard C++. On the other hand, some of
    these are already provided by extensions by center C++ implementations.


    # 13.1 The Angle Bracket Hack


    Among the most common surprises for beginning template programmers is the necessity
    to add some space between consecutive closing angle brackets. For example:


    ```

    #include <list>

    #include <vector>

    typef std::vector<std::list<int>> LineTable; // OK

    typef std::vector<std::int>> OtherTable; // SYNTAX ERROR

    ```'
