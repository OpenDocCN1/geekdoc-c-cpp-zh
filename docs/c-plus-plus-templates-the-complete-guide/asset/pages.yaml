  md: "# Chapter 19: Type Classification\n\n```\ntemplate<typename T>\nclass IsEnum\
    \ {\npublic:\n    enum { Yes = IsFoundA<T>::::No &&\n           !CompoundT<T>::IsRefT\
    \ &&\n           !CompoundT<T>::IsPtrT &&\n           !CompoundT<T>::IsPtrMemT\
    \ &&\n           sizeof(enum_check(ConsumeUDC<T>()))==1 };\n    enum { No = !Yes\
    \ };\n};\n```\n\nAt the heart of our device is a sizeof expression applied to\
    \ a function call. Hence, overload selection rules are applied to resolve the\
    \ call to enum_check(), but no definition of the function is needed because the\
    \ function is not actually called. In this case, enum_check() returns a char,\
    \ which has size 1 if the argument is convertible to an integral. All other types\
    \ are covered by an ellipsis, passing an argument \"ellipsis\" is the least desirable\
    \ from an overload resolution point of view. The return type of the ellipsis version\
    \ of enum_check() was specially created to ensure it has a larger size than one.\n\
    \nThe argument for the call to enum_check() must be created carefully. First,\
    \ that we don't actually know how a T can be constructed. Perhaps a special constructor\
    \ must be resolved? To solve this problem, we can declare a function that returns\
    \ a T and create an argument by calling that function instead. Perhaps more subtle\
    \ is the fact that overload resolution could select an enum_check declaration\
    \ for an integral type if the argument has a class type T, but that class type\
    \ defines a user-defined conversion (sometimes called UDC) function to an integral\
