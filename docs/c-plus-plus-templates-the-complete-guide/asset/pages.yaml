  md: '# Chapter 15: Traits and Policy Classes


    We used another level of inheritance to simplify the implementation of the traits
    for bitwise types that can be copied. This is certainly not the only possible
    implementation. In fact, for particular platforms it may be desirable to introduce
    some inline assembly (for example, to take advantage of hardware swap operations).


    # 15.4 Afternotes


    Nathan Myers was the first to formulate the idea of traits parameters. He originally
    presented them to the C++ standardization committee as a vehicle to define how
    character types should be treated in standard library components (for example,
    input and output streams). At that time they called them baggage templates and
    they noted that they contained traits. However, some C++ members did not like
    the *baggage*, and the name *traits* was preferred instead. The latter term has
    widely used since then.


    Client code does not deal with traits at all: The default traits satisfy most
    common needs, and because they are default template arguments, they need not appear
    in the client source. All this is for the default templates. When client code
    does adapt the behavior by providing a custom traits argument, it is good practice
    to typedef the resulting specializations to a name that is appropriate for the
    custom behavior. In this case the traits can be given a long descriptive name
    without sacrificing much to source estate.


    Our discussion has presented traits templates as being class templates exclusively.
    Strictly speaking, this does not have to be the case. If only a single policy
    trait needs to be provided, it could be passed as an ordinary function template.
    For example:


    ```

    template <typename T, void <Policy>(T const&, T const&) class X;

    ```


    However, the original goal of traits was to reduce the baggage of secondary template
    arguments, which is not achieved if only a single trait is encapsulated in a template
    parameter. This justifies Myers''s preference for the *term baggage* as a collection
    of traits. We revisit the problem of providing an ordering in Chapter 22.


    The standard library defines a class template std::char_traits, which is used
    as a policy traits parameter. To adapt algorithms easily to the kind of STL iterators
    for which they are used, a simple std::iterator_traits policy template is provided
    (and used in standard library interfaces). The template std::numeric_limits can
    also be used as a policy traits template, but it is not used in the standard library
    proper. The class std::unary_function and std::binary_function in the same category
    and are very simple function types: they only typedef their arguments to member
    names that make sense for functors (also known as function objects, see Chapter
    22). Lastly, memory allocation for the standard container types is handled by
    policy traits class. The template std::allocator is provided as the standard item
    for this purpose.


    Policy classes have apparently been developed by many programmers and a few authors.
    Andrei Alexandrescu made book Modern C++ Design covers them in more detail than
    our brief section (see [AlexandrescuDesign]).'
