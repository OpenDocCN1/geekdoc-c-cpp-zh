  md: '```

    template <typename T>

    inline T const& max (T const& a, T const& b);

    ...

    max<double>(4, 4.2)    // instantiate T as double

    ```


    In cases when there is no connection between template and call parameters and
    when template parameters cannot be determined, you must specify the template argument
    explicitly with the call. For example, you can introduce a third template argument
    type to define the return type of a function:


    ```

    template <typename T1, typename T2, typename RT>

    inline RT max (T1 const& a, T2 const& b);

    ```


    However, template argument deduction does not match return types, and RT does
    not appear in the types of the function call parameters. Therefore, RT cannot
    be deduced. As a consequence, you have to specify the template argument explicitly.
    For example:


    ```

    template <typename T1, typename T2, typename RT>

    inline RT max (T1 const& a, T2 const& b);

    ```


    ```

    max<int,double>(4,4,2)    // OK, but tedious

    ```


    So far, we have looked at cases in which either all or none of the function template
    arguments were mentioned explicitly. Another approach is to specify only the first
    arguments explicitly and to allow the deduction process to derive the rest. In
    general, you must specify all the argument types up to the last argument type
    that cannot be determined implicitly. Thus, if you change the order of the template
    parameters in our example, the caller needs to specify only the return type:


    ```

    template <typename RT, typename T1, typename T2>

    inline RT max (T1 const& a, T2 const& b);

    ```


    ```

    ...

    max<double>(4,4,2) // OK: return type is double

    ```


    Note that all these modified versions of max() don''t lead to any advantages.
    For the one-parameter version you can already specify the parameter (and return)
    type if two arguments of a different type are passed. Thus, it''s a good idea
    to keep it simple and use the one-parameter version of max() (as we do in the
    following sections when discussing other template issues).


    See Chapter 11 for details of the deduction process.


    > Deduction can be seen as part of overload resolution—a process that is not based
    on selection of return types either. The sole exception is the return type of
    conversion operator members.'
