  md: '# # Chapter 9


    # # Names in Templates


    Names are a fundamental concept in most programming languages. They are the means
    by which a programmer can refer to previously constructed entities. When a C++
    compiler encounters a name, it must "look it up" to identify the entity being
    referred. From an implementer''s point of view, C++ is a hard language in this
    respect. Consider the C++ statement xy=; If x and y are the names of variables,
    then the statement associated with the template is instantiated, and (3) multiplication,
    but if x is the name of a type, then the statement declares y as a pointer to
    an entity of type x.


    This small example demonstrates that C++ (like C) is a so-called context-sensitive
    language: A construct cannot be understood without knowing its wider context.
    How does this relate to templates? Well, templates are constructs that must deal
    with multiple wider contexts: (1) the context in which the template appears, (2)
    the context in which the template is instantiated, and (3) the contexts associated
    with the template arguments for which the template is instantiated. Hence it should
    not be totally surprising that "names" must be dealt with carefully in C++.


    # 9.1 Name Taxonomy


    C++ classifies names in a variety of ways—a large variety of ways in fact. To
    help cope with this abundance of terminology, we provide Table 9.1 and Table 9.2,
    which describe these classifications. Fortunately, you can gain good insight into
    most C++ template issues by familiarizing yourself with two major concepts:


    +   1. A name is a *qualified name* if the scope to which it belongs is explicitly
    denoted using a scope-resolution operator (::) or a member access operator (.
    or ->). For example, this->count is a qualified name, but count is not (even though
    the plain count might actually refer to a qualified member).


    +   2. A name is a *dependent name* if it depends on some way on a template parameter.
    For example, std::vector<T>::iterator is a dependent name if T is a template parameter,
    but it is a nondependent name if T is a known typedef (for example, of int).'
