  md: "# 4.2 Nontype Function Template Parameters\n\nYou can also define nontype parameters\
    \ for function templates. For example, the following template defines a group\
    \ of functions for which a certain value can be added:\n\n```\n// basics/addval.hpp\n\
    template <typename T, int VAL>\nT addValue(T const& x)\n{\n    return x + VAL;\n\
    }\n```\n\nThese kinds of functions are useful if functions or operations in general\
    \ are used as parameters. For example, if you use the Standard Template Library\
    \ (STL) you can pass an instantiation of this function template to add a value\
    \ to each element of a collection:\n\n```\nstd::transform(source.begin(), source.end(),\
    \ // start and end of source\n               dest.begin(), // start of destination\n\
    \               addValue<int,5>); // operation\n```\n\nThe last argument instantiates\
    \ the function template addValue() to add 5 to an int value. The resulting function\
    \ is called for each element in the source collection source, while it is translated\
    \ into the destination collection dest.\n\nNote that there is a problem with this\
    \ example: addValue<int,5> is a function instance, and function template instances\
    \ are considered to name a set of overloaded functions (even if the set has only\
    \ one member). However, according to the current standard, sets of overloaded\
    \ functions cannot be used for template parameter deduction. Thus, you have to\
    \ cast to the exact type of the function template argument:\n\n```\nstd::transform(source.begin(),\
    \ source.end(), // start and end of source\n                   dest.begin(), //\
    \ start of destination\n                   (int*)(int const&)) addValue<int,5>);\
    \ // operation\n```\n\nThere is a proposal for the standard to fix this behavior\
    \ so that the cast isn't necessary in this context (see [CoreIssue115] for details),\
    \ but until then the cast may be necessary to be portable."
