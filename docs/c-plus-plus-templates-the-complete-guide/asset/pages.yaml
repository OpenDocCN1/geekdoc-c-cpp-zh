  md: "# B.3 Overloading Details\n\n+   - Derived-to-base conversions for pointers\n\
    - Base-to-derived conversions for pointers to members\n\nAlthough all of these\
    \ can cause a \"match with standard conversions only,\" they are not ranked equally.\n\
    \nFirst, conversions to type bool (both from a regular pointer and a pointer to\
    \ a member) are considered worse than any other kind of standard conversion. For\
    \ example:\n\n```\nvoid check(void*); // (1)\nvoid check(bool);   // (2)\n```\n\
    \n```\nvoid rearrange(Matrix* m)\n{\n    check(m);    // calls (1)\n    ...\n\
    }\n```\n\nWithin the category of regular pointer conversions, a conversion to\
    \ type void* is considered worse than a conversion from a derived class pointer\
    \ to a base class pointer. Furthermore, if conversions to different classes related\
    \ by inheritance exist, a conversion to the most derived class is preferred. Here\
    \ is another short example:\n\n```\nclass Interface {\n...\n};\n```\n\n```\nclass\
    \ CommonProcesses : public Interface {\n...\n};\n```\n\n```\nclass Machine : public\
    \ CommonProcesses {\n...\n};\n```\n\n```\nchar* serialize(Interface*); // (1)\n\
    char* serialize(CommonProcesses*); // (2)\n```\n\n```\nvoid dump(Machine* machine)\n\
    {\n    char* buffer = serialize(machine); // calls (2)\n    ...\n}\n```"
  merge: -1
  pgno: 513
- img_proc: true
  md: "The conversion from Machine* to CommonProcesses* is preferred over the conversion\
    \ to Interface*, which is fairly intuitive.\n\nA very similar rule applies to\
    \ pointers to members: Between two conversions of related pointer-to-member types,\
    \ the “closest base” in the inheritance graph (that is, the least derived) is\
    \ preferred.\n\n# B.3.4 Functors and Surrogate Functions\n\nWe mentioned earlier\
    \ that the name of a function has been looked up to create an initial overload,\
    \ the set is tweaked in various ways. An interesting situation arises when a class\
    \ expression refers to a class object instead of a function. In this case there\
    \ are two potential additions to the overload set.\n\n+   * The first addition\
    \ is straightforward: Any member operator (the function call operator) is added\
    \ to the set. Objects with such operators are usually called functors (see Chapter\
    \ 22).\n* less obvious addition occurs when a class object contains an implicit\
    \ conversion to a pointer to a function type (or a reference to a function type).\
    \ In such situations, a dummy (so-called surrogate) is added to the overload set.\
    \ This surrogate candidate is considered to have an implied parameter of the type\
    \ designated by the conversion function, in addition to parameters with types\
    \ corresponding to the destination type of that conversion function. An example\
    \ makes this much clearer:\n\n```\ntypedef void FuncType(double, int);\n```\n\n\
    ```\nclass IndirectFunctor {\npublic:\n    ...\n    void operator()(double, double)\
    \ const;\n    operator FuncType*() const;\n};\n```\n\n```\nvoid activate(IndirectFunctor\
    \ const& funcObj)\n{\n    funcObj(3, 5); // ERROR: ambiguous;\n}\n```\n\nThe call\
    \ funcObj(3, 5) is treated as a call with three arguments: funcObj, 3, and 5.\
    \ The viable function candidates include the member operator () (which is treated\
    \ as having parameter types IndirectFunctor&, double, and double) and a surrogate\
    \ function with parameters of type FuncType*, double, and int. The surrogate has\
    \ a worse match for the first parameter\n\n> ³ conversion operator must also be\
    \ applicable in the sense that, for example, a non-const operator is not considered\
    \ for const objects."
