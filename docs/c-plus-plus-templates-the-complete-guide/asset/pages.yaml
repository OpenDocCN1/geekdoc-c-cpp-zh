  md: '# Chapter 12: Specialization and Overloading


    To clarify this, let''s analyze the call f<int>((int*)0) in detail.¹ The syntax
    fint*> indicates that we want to substitute the first template parameter of the
    template fint* without relying on template deduction. In this case there is more
    than one template f, and therefore an overload set is containing two functions
    generated from templates: f<int*>(int*) (generated from the first template) and
    f<int>(**) (generated from the second template). The argument to the call (int*)0
    has type int*. This matches only the function generated from the first template,
    and hence that it is the function that ends up being called.


    A similar analysis can be written for the second call.


    # 12.2.1 Signatures


    Two functions can coexist in a program if they have distinct signatures. We define
    the signature of a function as the following information²:


    +   1. The unqualified name of the function (or the name of the template from
    from which it was generated)

    2. The class or namespace scope of that name, and if name has internal linkage,
    the translation unit in which the name is declared

    3. The const, volatile, or const volatile qualification of the function (if it
    is a member function with such a qualifier)

    4. The types of the function parameters (before template parameters are substituted
    if the is generated from a function template)

    5. Its return type, if the function is generated from a function template

    6. The template parameters and the template arguments, if the function is generated
    from a function template


    This means that the following templates and their instantiations, could, in principle,
    coexist in the same program:


    ```

    template<typename T1, typename T2>

    void f1(T1, T2);

    ```


    ```

    template<typename T1, typename T2>

    void f1(T2, T1);

    ```


    ```

    template<typename T>

    long f2(T);

    ```


    ```

    template<typename T>

    char f2(T);

    ```


    > ¹ Note that the expression 0 is an integer and not a null pointer constant.
    It becomes a null pointer constant after a special implicit conversion, but this
    conversion is not considered during template argument deduction.

    ² This definition is different from that given in the C++ standard, but its consequences
    are equivalent.'
