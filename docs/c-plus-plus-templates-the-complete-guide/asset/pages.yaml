  md: "# 8.1 Parameterized Declarations\n\nFunction templates can have default class\
    \ arguments just like ordinary function declarations:\n\n```\ntemplate <typename\
    \ T>\nvoid report_top (Stack<T>& const, int number = 10);\n```\n\n```\ntemplate\
    \ <typename T>\nvoid fill (Array<T>*, T const& = T()); // T() is zero for built-in\
    \ types\n```\n\nThe latter declaration shows that a default class argument could\
    \ depend on a template parameter. When the fill() function is called, the default\
    \ argument is not instantiated if a second function argument is supplied. This\
    \ ensures that no error is issued if the default class argument cannot be instantiated\
    \ for a particular T. For example:\n\n```\nclass Value {\npublic:\n    Value(int);\
    \ // no default constructor\n};\n```\n\n```\nvoid init (Array<Value>* array)\n\
    {\n    Value zero(0);\n\n    fill(array, zero); // OK: T() is not used\n    fill(array);\
    \ // ERROR: T() is used, but not valid for T = Value\n}\n```\n\nIn addition to\
    \ the two fundamental kinds of templates, three other kinds of declarations can\
    \ be parameterized using a similar notation. All three correspond to definitions\
    \ of members of class templates:\n\n+   1. Definitions of member functions of\
    \ class templates\n2. Definitions of nested class members of class templates\n\
    3. Definitions of static data members of class templates\n\nAlthough they can\
    \ be parameterized, such definitions aren't quite first-class templates. Their\
    \ parameters are entirely determined by the template of which they are members.\
    \ Here is an example of such:\n\n```\ntemplate <int I>\nclass CupBoard {\n   \
    \ void open();\n    class Shelf {\n        static double total_weight;\n    ...\n\
    };\n```\n\n> They are much like ordinary class members, but they are occasionally\
    \ (erroneously) referred to as member templates."
