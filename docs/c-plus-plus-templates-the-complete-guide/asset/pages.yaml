  md: "# 434 Chapter 22: Function Objects and Callbacks\n\nOften, the need to integrate\
    \ legacy functions in a framework of class type functors is not an isolated event.\
    \ Therefore, it can be convenient to define a template that concisely integrates\
    \ all such functions:\n\n```\ntemplate<int (*FP)()>\nclass FunctionReturningIntWrapper\
    \ {\npublic:\n    int operator()() {\n    return FP();\n};\n```\n\nHere is a complete\
    \ example:\n\n```\n// functors/funcwrap.cpp\n#include <vector>\n#include <iostream>\n\
    #include <cstdlib>\n\n// wrapper for function pointers to function objects\ntemplate<int\
    \ (*FP)()>\nclass FunctionReturningIntWrapper {\npublic:\n    int operator()()\
    \ {\n    return FP();\n};\n\n// example function to wrap\nint random_int()\n{\n\
