  md: "Similarly, the other calls of max() instantiate the max template for double\
    \ and std::string as if they were declared and implemented individually:\n\n```\n\
    const double& max (double const&, double const);\nstd::string& max (std::string\
    \ const, std::string const&);\n```\n\nAn attempt to instantiate a template for\
    \ a type that doesn't support all the operations used will result in a compile-time\
    \ error. For example:\n\n```\nstd::complex<float> c1, c2;\n...\nmax(c1,c2); //\
    \ does not provide operator < // ERROR at compile time\n```\n\nThus, templates\
    \ compiled twice:\n\n+   1. Without instantiation, the template code itself is\
    \ checked for correct syntax. Syntax errors are discovered, such missing semicolons.\n\
    2. At the time of instantiation, the template code is checked to ensure that all\
    \ calls are valid. Invalid calls are discovered, such as unsupported function\
    \ calls.\n3. This leads to an important problem in the handling of templates in\
    \ practice: When a function template is used in a way that triggers its instantiation,\
    \ a compiler will need to see (at some point) not the template's definition. This\
    \ breaks the usual compile and link distinction for ordinary functions, where\
    \ the declaration of a function is sufficient to compile it. Methods of handling\
    \ this problem are discussed in Chapter 6. For the moment, let's take the simplest\
    \ approach: Each template is implemented inside a header file using inline functions.\n\
    \n# 2.2 Argument Deduction\n\nWhen we call a function template as max() for some\
    \ arguments, the template parameters are determined by the arguments we pass.\
    \ If we pass two into the parameter types T&, the C++ compiler must conclude that\
    \ T must be int. Note that no automatic type conversion is allowed. Each T must\
    \ match exactly. For example:\n\n```\ntemplate <typename T>\ninline T& max (T\
    \ const& a, T const& b);\n```\n\n```\nmax(4,7) // OK: T is int for both arguments\n\
    max(4,4.2) // ERROR: first T is int, second T is double\n```\n\nThere are three\
    \ ways to handle such an error:\n\n+   1. Cast the arguments so that they match:\n\
    \   max(static_cast<double>(4), 4.2) // OK\n2. Specify (or qualify) explicitly\
    \ the type of T:\n   max<double>(4,4.2) // OK\n3. Specify that the parameters\
    \ may have different types.\nFor a detailed discussion of these topics, see the\
    \ next section."
