  md: "# 8.3.1 Function Template Arguments\n\nTemplate arguments for a function template\
    \ can be specified explicitly or deduced from the way the template is used. For\
    \ example:\n\n```\n// details/max.cpp\ntemplate <typename T>\ninline T const&\
    \ max (T const& a, T const& b)\n{\n    return a < b ? b : a;\n}\n\nint main()\n\
    {\n    max<double>(1.0, -3.0); // explicitly specify template argument\n    max(1.0,\
    \ -3.0);        // template argument is implicitly deduced\n                 \
    \            // to be double\n    max<int>(1.0, 3.0);    // the explicit <int>\
    \ inhibits the deduction\n                             // hence the result has\
    \ type int\n}\n```\n\nSome template arguments can never be deduced (see Chapter\
    \ 11). The corresponding parameters are best placed at the beginning of the list\
    \ of template parameters so they can be specified explicitly while allowing the\
    \ other arguments to be deduced. For example:\n\n```\n// details/implicit.cpp\n\
    template <typename Dst, typename SrcT>\ninline Dst implicit_cast (SrcT const&\
    \ x) // SrcT can be deduced,\n{\n    return x;\n}\n\nint main()\n{\n    double\
    \ value = implicit_cast<double>(-1);\n} // but Dst cannot\n```\n\nIf we reversed\
    \ the order of the template parameters in this example (in other words, if we\
    \ had written template<typename SrcT, typename DstT>), a call of implicit_cast\
    \ would have to specify both template arguments explicitly."
