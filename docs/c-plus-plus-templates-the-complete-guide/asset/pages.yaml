  md: "# # Bibliography\n\nThis appendix lists the resources that were mentioned,\
    \ adopted, or cited in this book. These days many of the advancements in programming\
    \ happen in electronic forums. It is therefore not surprising to find, in addition\
    \ to the more traditional books and articles, quite a few Web sites. We certainly\
    \ do not claim that our list is close to being comprehensive. However, we find\
    \ that they are relevant contributions to the topic of C++ templates.\n\nWeb sites\
    \ are typically considerably more volatile than books and articles. The Internet\
    \ links listed here may not be valid in the future. Therefore, we provide the\
    \ actual list of links for this at the following site (and we expect this to be\
    \ stable):\n\n```\nhttp://www.josuttis.com/tmplbook\n```\n\nBefore listing books,\
    \ articles, and Web sites, we introduce the more interactive kind of resources\
    \ that are provided by so-called *newsgroups*.\n\n# # Newsgroups\n\n*Usenet* is\
    \ a large and diverse collection of electronic forums often called *newsgroups*.\
    \ Some of these newsgroups are *moderated*, which means that every submission\
    \ is examined in some way for its appropriateness.\n\nA few Usenet newsgroups\
    \ are dedicated to the discussion of the C++ language. In fact, many of the most\
    \ advanced techniques presented in this book were first published in some of these\
    \ groups. In some cases, techniques were developed through collaborative discussion\
    \ in these groups.\n\nThe following Usenet newsgroups discuss C++, the standard,\
    \ and the C++ standard library:\n\n+   - Tutorial level C++ (unmoderated)\n  `alt.comp.learn.c-c++`\n\
    - General aspects of C++ (unmoderated)\n  `comp.lang.c++`\n- General aspects of\
    \ C++ (moderated)\n  `comp.lang.c++.moderated`\n- Aspects of the C++ standard\
    \ (moderated)\n  `comp.std.c++`"
