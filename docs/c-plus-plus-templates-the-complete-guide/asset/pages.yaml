    \ our Pow3 metaprogram may also look like follows:\n\n```\n// meta/pow3b.hpp\n\
    \n#ifndef POW3_HPP\n#define POW3_HPP\n\n// primary template to compute 3 to the\
    \ Nth\ntemplate<int N>\nclass Pow3 {\npublic:\n    static int const result = 3\
    \ * Pow3<N-1>::result;\n};\n\n// full specialization to end the recursion\ntemplate<\n\
    class Pow3<0> {\npublic:\n    static int const result = 1;\n};\n\n#endif POW3_HPP\n\
    ```\n\nThe only difference is the use of static constant members instead of enumeration\
    \ values. However, there is a drawback with this version: Static constant members\
    \ are lvalues. So, if you have a declaration such as\n\n```\nvoid foo(int const&);\n\
    ```\n\nand you pass it the result of a metaprogram\n\n```\nfoo(Pow3<7>::result);\n\
    ```\n\na compiler must pass the address of Pow3<7>::result, which forces the compiler\
    \ to instantiate and allocate the definition for the static member. As a result,\
    \ the computation is no longer limited to a pure “compile-time” effect.\n\nEnumeration\
    \ values are lvalues (that is, they don’t have an address). So, when you pass\
    \ them “by reference,” no static memory is used. It’s almost exactly as if you\
    \ passed the computed value as a literal. These considerations motivate us to\
    \ use enumeration values in all metaprograms throughout this book."
