  md: '# Chapter 6


    # Using Templates in Practice


    Template code is a little different from ordinary code. In some ways templates
    lie somewhere between macros and ordinary (nontemplate) declarations. Although
    this may be an oversimplification, it has consequences not only for the code we
    write algorithms and data structures using templates, but also for the day-to-day
    logistics of expressing and analyzing programs involving templates.


    In this chapter we address some of these practicalities without necessarily delving
    into the technical details that underlie them. Many of these details are explored
    in Chapter 10. To keep the discussion simple, we assume that our C++ compilation
    systems consist of fairly traditional compilers and linkers (C++ systems that
    don''t fall in this category are quite rare).


    There are several ways to organize template source code. This section presents
    the most popular approach as of the time of this writing: the inclusion model.


    # 6.1 The Inclusion Model


    # 6.1.1 Linker Errors


    Most C and C++ programmers organize their nontemplate code largely as follows:


    +   - Classes and other types are entirely placed in header files. Typically,
    this is a file with a .hpp (or .H, .hh, .hxx) filename extension.


    +   - For global variables and (noninline) functions, only a declaration is put
    in a header file, and the definition goes into a so-called dot-C file. Typically,
    this is a file with a .cpp (or .C, .c, .cc, or .cxx) filename extension.


    This works well: It makes the needed type definition easily available throughout
    the program and avoids duplicate definition errors on variables and functions
    from the linker.'
