    # 9.5 Afternotes


    The first compiler relied to parse template definitions was developed by a company
    called Taligent in the mid-1990s. Before that—and even after that—most compilers
    treated templates as a sequence of tokens to be passed through back at instantiation
    time. Hence no parsing was done, except for a minimal amount sufficient to find
    the end of a template definition. Bill Gibbons was Taligent''s representative
    to the C++ committee and the principal advocate for making templates unambiguous.
    The Taligent effort was not released until the compiler was acquired and completed
    by Hewlett-Packard (HP), to become the a++ compiler. Among its advantages, the
    a++ compiler was recognized for its high quality diagnostics. The fact that template
    diagnostics were not always delayed until instantiation undoubtedly contributed
    to this perception.


    Really early during the development of templates, Tom Pennello—a widely recognized
    expert working for Metaware—noted some of the problems with angle brackets. Stroustrup
    also comments on that topic in [StstrupDn] and argues that humans need to read
    angle brackets rather than parentheses. However, other possibilities exist, and
    Pennello specifically proposed braces (for example, List<::X>) at a C++ standards
    meeting in 1991 (held in Dallas).8 At the time of the project was more limited
    because templates nested inside other templates—so-called member templates—were
    not valid and thus the discussion of Section 9.3.3 on page 132 was largely irrelevant.
    As a result, the committee declined the proposal to use angle brackets.


    The lookup name for nondependent names and dependent base classes that is described
    in Section 9.4.2 on page 136 was introduced in the C++ standard in 1993. It was
    called the “general public” by James Bstrup [strupDn] in early 1994. The first
    generally available implementation of this rule did not appear until early 1997
    when HP incorporated it into their ac++ compiler, and by large amounts of code
    derived class templates from dependent bases. Indeed, when the HP engineers started
    testing their implementation, found that most of the templates used in nontrivial
    ways were no longer complied.9 In particular, all implementations of the


    > 8 Braces are not entirely without problems either. Specifically, the syntax
    to specialize class templates would require nontrivial adaptation.


    > 9 Fortunately, they found out before they released the new functionality.'
