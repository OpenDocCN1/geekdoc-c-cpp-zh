- img_proc: true
  md: '2. If you write general code for a common base class you lose the benefit of
    type checking. In addition, classes may be required to be derived from special
    base classes, which makes it more difficult to maintain your code.


    3. If you use a special preprocessor such as the C/C++ preprocessor, you lose
    the advantage of formatted source code. Code is replaced by some “stupid text
    replacement mechanism” that has no idea of scope and types.


    Templates are a solution to this problem without these drawbacks. They are functions
    or classes that are written for one or more types not yet specified. When you
    use a template, you pass the types as arguments, explicitly or implicitly. Because
    templates are language features, you have full support of type checking and scope.


    In today’s programs, templates are used a lot. For example, inside the C++ standard
    library almost all code is template code. The library provides sort algorithms
    to sort objects and values of a specified type, data structures (so-called container
    classes) to manage elements of a specified type, strings for which the type of
    a character is parameterized, and so on. The beginning. Templates also allow us
    to parameterize behavior, to optimize code, and to parameterize information. This
    is covered in later chapters. Let’s first start with some simple templates.'
