  md: '# Glossary


    # 513


    # parameter


    A placeholder entity that is meant to be substituted with an actual “value” (an
    argument) at some point. For macro parameters and template parameters, the substitution
    occurs at compile time. For function call parameters it happens at run time. In
    some programming communities parameters are called formal parameters (whereas
    arguments are called actual parameters). See also argument.


    # parameterized class


    A class template or a class nested in a class template. Both are parameterized
    because they do not correspond to a unique class until the template arguments
    have been specified.


    # parameterized function


    A function or member template function or a member function of a class template.
    All are parameterized because they do not correspond to a unique function (or
    member function) until the template arguments have been specified.


    # partial specialization


    A construct that defines or defines an alternative definition for certain substitutions
    of a template. The original (generic) template is called the primary template.
    The alternative definition still depends on template parameters. Currently, this
    construct exists only for class templates. See explicit specialization.


    # POD


    An acronym for “plain old data (type).” POD types are types that can be defined
    without certain C++ features (like virtual member functions, access keywords,
    and so forth). For example, every ordinary C struct is a POD.


    # POI


    An acronym for point of instantiation. A POI is a location in the source code
    where (or a member of a template) is conceptually expanded by substituting template
    parameters with template arguments. In practice, this expansion does not need
    to occur at every POI. See explicit instantiation directive.


    # point of instantiation


    See POI.


    # policy class


    A class or class template the members of which describe configurable behavior
    for a generic component. Policies are normally passed as template arguments. For
    example, a sorting template may have an ordering policy. Policy classes are also
    called policy templates or just policies. See also traits template.'
  merge: -1
  pgno: 531
- img_proc: true
  md: '# polymorphism


    The ability of an operation (which is identified by its name) to apply to objects
    of different kinds. In C++, the traditional object-oriented concept of polymorphism
    (also called run-time or dynamic-polymorphism) is achieved through virtual functions
    that are overridden in derived classes. In addition, C++ templates enable so-called
    static polymorphism.


    # precompiled header


    A processed form of source code that can be quickly loaded by the compiler. The
    source code underlying a precompiled header must be the first part of a translation
    unit (in other words, it cannot start somewhere in the middle of a translation
    unit. Often, a precompiled header corresponds to a number of header files. Using
    precompiled headers can substantially improve the time needed to build a large
    application written in C++.


    # primary template


    A template that is not a partial specialization.


    # qualified name


    A name containing a scope qualifier ( :: ).


    # reference counting


    A resource management strategy that keeps count of how many entities are referring
    to a particular resource. When the count drops to zero, the resource can be disposed
    of.


    # rvalue


    See lvalue.


    # source file


    A header file or a dot-C file.


    # specialization


    The result of substituting template parameters by actual values. A specialization
    may be created by an instantiation or by an explicit specialization. This term
    is sometimes mistakenly equated with explicit specialization. See also instance.


    # template


    A construct that represents a family of classes or functions. It specifies a pattern
    from which actual classes or functions can be generated by substituting the template
    parameters by specific entities. In this book, the term does not include functions,
    classes, and static data members that are parameterized only by virtue of being
    members of a class template. See class template, parameterized template, and parameterized
    function.


    # template argument


    The "value" substituted for a template parameter. This "value" is usually a type,
    although certain constant values and templates can be valid template arguments
    too.'
  merge: -1
