  md: '# 1.5 The standard versus Reality


    The C++ standard has been available since late 1998. However, it was not until
    2002 that a publicly available compiler compiler could make the claim to “conform
    fully to the standard.” Thus, compilers will differ in their support of the language.
    Several will compile most of the code in this book, but a few popular compilers
    may not be able to handle many of our examples. We often present alternative techniques
    that may cobble together a full or partial solution for these substand C++ implementations,
    but some techniques are currently beyond their reach. Still, we expect that this
    problem will likely be resolved as programmers demand standard support from their
    vendors.


    Even so, the C++ programming language is likely to evolve as time passes. Already
    the experts of the C++ community (regardless of whether they participate in the
    C++ Standardization Committee) are discussing various ways to improve the language,
    and several candidate improvements affect templates. Chapter 13 presents some
    trends in this area.


    # 1.6 Example Code and Additional Informations


    You can access all programs and find more information about this book from its
    Web site, which has the following URL:


    ```

    http://www.josuttis.com/tmplbook

    ```


    Also, you can find a lot of additional information about this topic at David Vandevoorde’s
    Web site at http://www.vandevoorde.com/Templates and on the Web in general. See
    the Bibliography on page 499 for suggestions on where to start.


    # 1.7 Feedback


    We value your constructive input—both the negative and the positive. We worked
    very hard to bring what we hope you’ll find to be an excellent book. However,
    at some point we had to stop writing, reviewing and tweaking so we could “release
    the product.” You may find errors, inconsistencies, and presentations that could
    be improved, or topics that are missing altogether. Your feedback gives us a chance
    to inform all readers through the book’s Web site and to improve subsequent editions.


    The best way to reach us is by e-mail:


    ```

    tmplbook@josuttis.com

    ```


    Be sure to check the book’s Web site for the currently known errata before submitting
    reports.

    Many thanks.'
