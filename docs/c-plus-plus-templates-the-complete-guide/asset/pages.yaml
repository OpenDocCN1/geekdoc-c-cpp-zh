  md: "# 20.2 Reference Counting\n\nOn the other hand, implicit conversions to other\
    \ CountingPtr specializations can make perfect sense. For example, we can imagine\
    \ an implicit conversion to CountingPtr<void> (the latter can be a useful opaque\
    \ pointer type, just like void*). There is a limitation, however: an invasive\
    \ counter cannot accommodate such a conversion as the void type doesn't contain\
    \ a counter. Similarly, a base class may not be compatible with an invasive counter\
    \ either.\n\nNonetheless, we can add implicit conversions to our CountingPtr template.\
    \ Instantiation errors occur when attempting conversions that are not compatible\
    \ with a given counter policy. The implicit conversions might look as follows:\n\
    \n```\ntemplate<typename T,\n    typename CountingPolicy = SimpleReferenceCount,\n\
    \    typename ObjectPolicy = StandardObjectPolicy>\nclass CountingPtr : private\
    \ CounterPolicy, private ObjectPolicy {\nprivate:\n    // Shortcuts:\n    typedef\
    \ CounterPolicy CP;\n    typedef ObjectPolicy OP;\n\n    ...\npublic:\n    //\
    \ add a converting constructor and make sure it can access\n    // the private\
    \ components of other instantiations:\n    template<typename T2, typename CP2,\
    \ typename OP2>\n    friend class CountingPtr;\n\n    template<typename S> //\
    \ S could be void or a base of T\nCountingPtr(CountingPtr<S, OP, CP> const& cp)\n\
    \    : OP((OP const& cp)),\n      CP((CP const& cp)),\n      object_pointed_to(cp.object_pointed_to)\
    \ {\n      if (cp.object_pointed_to != NULL) {\n        CP::increment(cp.object_pointed_to);\n\
    \      }\n    };\n```\n\nNote that in this case a converting constructor more\
    \ easily enabled the desired implicit conversions than a conversion operator.\
    \ In particular, we must make sure that the reference count is correctly copied.\n\
    \nThe conversion to bool may seem straightforward. We can just add a user-defined\
    \ conversion operator to CountingPtr:"
