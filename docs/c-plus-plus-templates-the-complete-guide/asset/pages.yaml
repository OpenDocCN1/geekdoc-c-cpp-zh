  md: '# 8.1.2 Linkage of Templates


    Every template must have a name and that name must be unique within its scope,
    except that functions can be overloaded (see Chapter 12). Note especially that,
    unlike class types, class templates cannot share a name with a different kind
    of entity:


    ```

    int C;

    ```


    ```

    class C; // OK: class names and nonclass names are in a different “space"

    ```


    ```

    int X;

    ```


    ```

    template <typename T>

    class X; // ERROR: conflict with variable X

    ```


    ```

    struct S;

    ```


    ```

    template <typename T>

    class S; // ERROR: conflict with struct S

    ```


    Templates have linkage, but they cannot have C linkage. Nonstandard linkage may
    have an implementation-dependent meaning (however, we don''t know of an implementation
    that supports nonstandard name linkages for templates):


    ```

    extern "C++" template <typename T>

    void normal();

    // this is the default: the linkage specification could be left out

    ```


    ```

    extern "C" template <typename T>

    void invalid();

    // ERROR: templates cannot have C linkage

    ```


    ```

    extern "Xroma" template <typename T>

    void xroma_link();

    //nonstandard, but maybe some compiler will support linkage compatible with the
    Xroma language

    ```


    Templates usually have external linkage. The only exceptions are namespace scope
    function templates with the static specifier:


    ```

    template <typename T>

    void external(); // refers to the same entity as a declaration of

    // the same name (and scope) in another file

    ```'
