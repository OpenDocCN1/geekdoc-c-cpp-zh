    Note that templates cannot be declared in a function.


    # 8.1.3 Primary Templates


    Normal declarations of templates declare so-called primary templates. Such template
    declarations are declared without adding template arguments in brackets after
    the template name:


    ```

    template<typename T> class Box; // OK: primary template

    ```


    ```

    template<typename T> class Box<T>; // ERROR

    ```


    ```

    template<typename T> void translate(T*); // OK: primary template

    ```


    ```

    template<typename T> void translate<T>(T*); // ERROR

    ```


    Nonprimary classes occur when declaring so-called partial specializations which
    are discussed in Chapter 12. Function templates must always be primary templates
    (but see Section 13.7 on page 213 for a potential future language change).


    # 8.2 Template Parameters


    There are three kinds of template parameters:


    +   1. Type parameters (these are by far the most common)

    2. Nontype parameters

    3. Template parameters


    Template declarations are declared in the introductory parameterization clause
    of a template declaration. Such declarations do not necessarily need to be named:


    ```

    template <typename, int>

    class X;

    ```


    A parameter name is, of course, required if the parameter is referred to later
    in the template. Also that a template parameter name can be referred to in a subsequent
    parameter declaration (but not before):


    ```

    template <typename T,\ // the first parameter is used in the

    T* Root,\ // declaration of the second one and

    template<T*> class Buf> // the third one

    class Structure;

    ```'
