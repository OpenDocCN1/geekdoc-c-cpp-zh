    \ : ptr(0) {\n}\n\n    // constructor for a pointer: let the holder refer to where\
    \ the pointer refers\n    explicit Holder (T* p) : ptr(p) {\n}\n\n    // destructor:\
    \ releases the object to which it refers (if any)\n    ~Holder() {\n        delete\
    \ ptr;\n    }\n\n    // assignment of new pointer\n    Holder<T>& operator=( (T*\
    \ p) {\n```\n\n> ¹ This is a reasonable assumption. Destructors that throw exceptions\
    \ should generally be avoided because destructors are automatically called when\
    \ an exception is thrown, and throwing another exception while this happens results\
