  md: "# B.2 Simplified Overload Resolution\n\nGiven this first principle, we are\
    \ left with specifying how well a given argument matches the corresponding parameter\
    \ of a viable candidate. As a first approximation we can rank the possible matches\
    \ as follows (from best to worst):\n\n+   * Perfect match. The parameter has the\
    \ type of the expression, or it has a type that is a reference to the type of\
    \ the expression (possibly with added const and/or volatile qualifiers).\n* With\
    \ minor adjustments. This includes, for example, the decay of an array variable\
    \ to a pointer to its first element, and the addition of const to match an argument\
    \ of type int** to a parameter of type int const*.\n* With promotion. Promotion\
    \ is a kind of implicit conversion that includes the conversion of small integers\
    \ (such as bool, char, short, and sometimes enumerations) to, unsigned int, long\
    \ or long, and the conversion of float to double.\n* With standard conversions\
    \ only. This includes any sort of standard conversion (such as to float) but excludes\
    \ the implicit call to a conversion operator or a converting constructor.\n* With\
    \ user-defined conversions. This allows any kind of implicit conversion.\n* Match\
    \ with ellipsis. An ellipsis parameter can match any type (but non-POD class types\
    \ result in undefined behavior).\n\nThe following example illustrates some of\
    \ these matches:\n\n```\nint f1(int);\nint f1(double);\nf1(4);\n// (1)\n// (2)\n\
    // calls (1): perfect match\n// ((2) requires a standard conversion\nint f2(int);\n\
    int f2(char);\nf2(true);\n// (3)\n// (4)\n// calls (3): match with promotion\n\
    // ((4) requires stronger standard conversion\n\nclass X {\npublic:\n    X(int);\n\
    };\nint f3(X);\nint f3(...);\nf3(7);\n// (5)\n// (6)\n// calls (5): match with\
    \ user-defined conversion\n// ((6) requires a match with ellipsis)\n```\n\nNote\
    \ that overload resolution occurs after template deduction, and this deduction\
    \ does not consider all these sorts of conversions. The following example illustrates\
    \ this:\n\n```\ntemplate <typename T>\nclass MyString {\n```"
