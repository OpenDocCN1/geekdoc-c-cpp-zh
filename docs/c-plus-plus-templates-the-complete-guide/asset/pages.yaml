  md: '# # Appendix A


    # # The One-Definition Rule


    Affectionately known as the ODR, the **one-definition rule** is a cornerstone
    for the well-formed structuring of C++ programs. The most common consequences
    of the ODR are simple enough to remember and apply: Define noninline functions
    exactly once across all files, and define classes and inline functions at most
    once per translation unit, making sure that all definitions for the same entity
    are identical.


    However, the devil is in the details, and when combined with template instantiation,
    these details can be daunting. This appendix meant to provide a comprehensive
    overview of the ODR for the interested reader. We also indicate when specific
    issues are expounded on the main text.


    # ## A.1 Translation Units


    In practice we write C++ programs by filling files with “code.". However, the
    boundary set by a file is not terribly important in the context of the ODR. What
    matters are so-called *translation units*. Essentially, a translation unit is
    the result of applying the preprocessor to a file you feed to your compiler. The
    preprocessor drops sections of code not selected by conditional compilation directives
    (#if, #ifdef, and friends), drops comments, inserts #included files (recursively),
    and expands macros.


    Hence far as the ODR is concerned, having the following two files


    ```

    // File header.hpp:

    #ifndef DO_DEBUG

    #define debug(x) std::cout << x << ''\n''

    #else

    #define debug(x)

    #endif


    void debug_init();

    ```'
