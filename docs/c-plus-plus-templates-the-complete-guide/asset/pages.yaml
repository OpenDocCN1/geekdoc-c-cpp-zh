  md: "# Chapter 19\n\n# Type Classification\n\nIt is sometimes useful to be able\
    \ to know whether a template parameter is a built-in type, a pointer type, or\
    \ a class type, and so forth. In the following sections we develop a general-purpose\
    \ type template that allows us to determine various properties of a given type.\
    \ As a result we will be able to write code like the following:\n\n```\nif (TypeT<T>::IsPtrT)\
    \ {\n    ...\n} else if (TypeT<T>::IsClassT) {\n    ...\n}\n```\n\nFurthermore,\
    \ expressions such as TypeT<T>::IsPtrT will be Boolean constants that are valid\
    \ non-template arguments. In turn, this allows the construction of more sophisticated\
    \ and more powerful templates that specialize their behavior on the properties\
    \ of their type arguments.\n\n# 19.1 Determining Fundamental Types\n\nTo start,\
    \ let's develop a template to determine whether a type is a fundamental type.\
    \ By default, we assume a type is not fundamental, and we specialize the template\
    \ for the fundamental cases:\n\n```\n// types/type1.hpp\n// primary template:\
    \ in general T is no fundamental type\ntemplate <typename T>\nclass IsFundAT {\n\
    \    public:\n        enum { Yes = 0, No = 1};\n};\n```"
