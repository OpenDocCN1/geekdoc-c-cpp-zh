  md: "# 3.1.2 Implementation of Member Functions\n\nTo define a member function of\
    \ a class template, you have to specify that it is a function template, and you\
    \ have to use the full type qualification of the class template. Thus, the implementation\
    \ of the member function push()<Stack<T> looks like this:\n\n```\ntemplate <typename\
    \ T>\nvoid Stack<T>::push(T const& elem)\n{\n    elems.push_back(elem); // append\
    \ copy of passed elem\n}\n```\n\nIn this case, push_back() of the element vector\
    \ is called, which appends the element at the end of the vector.\nThe reason for\
    \ this behavior is exception safety. It is impossible to implement a complete\
    \ exception-safe version of pop() that returns the removed element (this topic\
    \ was first discussed by Tom Cargill in [CargillExceptionSafety] and is discussed\
    \ as Item 10 in [SutterExceptional]). However, ignoring this danger, we could\
    \ simply use T to declare a local variable pop() that returns the removed element\
    \ of the type:\n\n```\ntemplate <typename T>\nStack<T>::pop()\n{\n    if (elems.empty())\
    \ {\n        throw std::out_of_range(\"Stack<T>::pop(): empty stack\");\n    }\n\
    \    T elem = elems.back(); // save copy of last element\n    elems.pop_back();\
    \ // remove last element\n    return elem; // return copy of saved element\n}\n\
    ```\n\nBecause back() (which returns the last element) and pop_back() (which removes\
    \ the last element) have undefined behavior when there is no element in the vector,\
    \ we have to check whether the stack is empty. If it is empty, we throw an exception\
    \ of std::out_of_range. This is also done in top(), which returns does not remove\
    \ the element:\n\n```\ntemplate <typename T>\nStack<T>::top() const\n{\n    if\
    \ (elems.empty()) {\n        throw std::out_of_range(\"Stack<T>::top(): empty\
    \ stack\");\n    }\n    return elems.back(); // return copy of last element\n\
    }\n```"
