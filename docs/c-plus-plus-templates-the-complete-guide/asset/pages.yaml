  md: '# 3.3 Specializations of Class Templates


    Note that in C++ type definition defines a "type alias" rather than a new type.
    Thus, after the type definition


    ```

    typedef Stack<int> IntStack;

    ```


    IntStack and Stack<int> are the same type and can be used for and assigned to
    each other. Template arguments may be any type, such as pointers to floats or
    even stacks of ints:


    ```

    Stack<float*>               floatPtrStack; // stack of float pointers

    Stack<int> > intStack;         // stack of ints

    ```


    The only requirement is that any operation that is called is possible according
    to this type. Note that you have to put whitespace between the two closing template
    brackets. If you don''t, you are using operator >>, which results in a syntax
    error:


    ```

    Stack<int>> intStack;       // ERROR: >> is not allowed

    ```


    # 3.3 Specializations of Class Templates


    You can specialize a class template for certain template arguments. Similar to
    the overloading of function templates (page 15), specializing class templates
    allows you to optimize implementations for certain types or fix a misbehavior
    of certain types for an instantiation of the class template. However if you specialize
    a class template, you must also specialize all member functions. Although it is
    possible to specialize a single member function, once you have done so, you can
    no longer specialize the whole class.


    To specialize a class template, you have to declare the class with the leading
    template<> and a specification of the types for which the class template is specialized.
    The types used as a template argument must be specified directly following the
    name of the class:


    ```

    template<

    class Stack<std::string> {

    ...

    };

    ```


    For these specializations, any definition of a member function must be defined
    as an "ordinary" member function, with each occurrence of T being replaced by
    the specialized type:


    ```

    void Stack<std::string>::push(std::string const& elem)

    {

    elems.push_back(elem);       // append copy of passed elem

    };

    ```


    Here is a complete example of a specialization of Stack<> for type std::string:


    ```

    // basics/stack2.hpp

    #include <deque>

    ```'
