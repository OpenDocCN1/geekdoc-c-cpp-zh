  md: "# 2.1 A First Look at Function Templates\n\n```\ndouble f2 = -6.7;\nstd::cout\
    \ << \"max(f1,f2)\" << ::max(f1,f2) << std::endl;\n```\n\n```\nstd::string s1\
    \ = \"mathematics\";\nstd::string s2 = \"math\";\nstd::cout << \"max(s1,s2)\"\
    \ << ::max(s1,s2) << std::endl;\n}\n```\n\nIn the program, max() is called three\
    \ times: once for ints, once for two doubles, and once for two std::strings. Each\
    \ time, the maximum is computed. As a result, the program has the following output:\n\
    \n```\nmax(7,i): 42\nmax(f1,f2): 3.4\nmax(s1,s2): mathematics\n```\n\nNote that\
    \ each call of the max() template is qualified with ::. This is to make sure our\
    \ max() template is found in the global namespace. There is also an std::max()\
    \ template in the standard library, which under some circumstances it may be called\
    \ or lead to ambiguity.\n\nNormally, templates are not compiled into single entities\
    \ that can handle any type. Instead, different entities are generated from the\
    \ template for every type that the template is used. Thus, max() is compiled for\
    \ each of these three types. For example, the first call of max()\n\n```\nint\
    \ i = 42;\nmax(7,i) ...\n```\n\nuses the function template with int as template\
    \ parameter T. Thus, it has the semantics of calling the following code:\n\n```\n\
    inline int max(const int& a, const int& b)\n{\n    // if a<b then use b else use\
    \ a\n    return a < b ? b : a;\n}\n```\n\nThe process of replacing templates with\
    \ concrete types is instantiation. It results in an instance of the template.\
    \ Unfortunately, the instance and instantiate are used in a different context\
    \ in object-oriented programming—namely, for a concrete object of a class. However,\
    \ because this book is about templates, we use this term for the \"use\" of templates\
    \ unless otherwise specified.\n\nNote that the use of a function template can\
    \ trigger such an instantiation process. There is no need for the programmer to\
    \ request instantiation separately.\n\n> ¹ For example, if one type is found in\
    \ namespace std (such as strings), according to the lookup rules of C++, both\
    \ the global and the std max() template are found.\n\n> ² The \"one-size-fits-all\"\
    \ is conceivable but rare in practice. All language rules are based on the concept\
    \ that different entities are generated."
