  md: "# 22.2 Pointers and References to Functions\n\nConsider the following trivial\
    \ definition of a function foo():\n\n```\nextern \"C++\" void foo()\n{\\}\n```\n\
    \nThe type of this function might be “function with C++ linkage that takes no\
    \ arguments, returns no value, and does not throw any exceptions.” For historical\
    \ reasons, the formal definition of the C++ language does not actually make the\
    \ exception specification part of a function type.³ However, that may change in\
    \ the future. It is a good idea to make sure that you create code in which function\
    \ types must match, the exception specifications also. Name linkage (usually for\
    \ “C” and “C++”) is properly a part of the type system, but C++ implementations\
    \ are a little like in enforcing it. Specifically, they allow a pointer to a function\
    \ with C++ linkage to be assigned to a pointer to a function with C linkage and\
    \ vice versa. This is a consequence of the fact, that on platforms, calling conventions\
    \ for C and C++ functions are identical as far as the common subset of parameter\
    \ and types is concerned.\n\nIn contexts, the expression foo undergoes an implicit\
    \ conversion to a pointer to the function foo(). Note that foo does not denote\
    \ the pointer, as is the expression ia after declaration\n\n```\nint ia[10];\n\
    ```\n\ndoes not denote a pointer to the array (or to the first element of the\
    \ array). The implicit conversion from a function (or array) to a pointer is often\
    \ called decay. To illustrate this, we can write the following complete C++ program:\n\
    \n```\n// functors/funcptr.cpp\n\n#include <iostream>\n#include <typeinfo>\n\n\
    void foo()\n{\n    std::cout << \"foo() called\" << std::endl;\n}\n\ntypedef void\
    \ FooT;\n// FooT is a function type,\n// the same type as that of function foo\n\
    ```\n\n> The historical origin of this is not clear, and the C++ standard is somewhat\
    \ inconsistent in this area."
