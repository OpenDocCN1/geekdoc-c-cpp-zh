  md: "# Chapter 21\n\n# Tuples\n\nThroughout this book we use homogeneous containers\
    \ and array-like types to illustrate the power of templates. Such homogeneous\
    \ structures extend the concept of a C/C++ array and are pervasive in most applications.\
    \ C++ (and C) also has a nonhomogeneous containment facility: the class (or struct).\
    \ Tuples are class templates that similarly allow us to aggregate objects of differing\
    \ types. We start with the duo—entity analogous to the standard std::pair template—but\
    \ we also show how it can be nested to assemble an arbitrary number of members,\
    \ forming trios, quartets, and so forth.¹\n\n# 21.1 Duos\n\nA duo is the assembly\
    \ of two objects into a single type. This is similar to the std::pair class template\
    \ in the standard library, but because we will add slightly different functionality\
    \ to this very utility, we opted for a name other than pair to avoid confusion\
    \ with the standard item. At its very simplest, we can define Duo as:\n\n```\n\
    template <typename T1, typename T2>\nstruct Duo {\n    T1 v1;      // value of\
    \ first field\n    T2 v2;      // value of second field\n};\n```\n\nThis can,\
    \ for example, be useful as a return type for a function that may return an invalid\
    \ result:\n\n> ¹ The number is not entirely arbitrary because there exists an\
    \ implementation-dependent limit on the depth of template nesting."
