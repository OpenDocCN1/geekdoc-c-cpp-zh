  md: 'You may legitimately wonder why only class templates can be partially specialized.
    The reasons are mostly historical. It is probably possible to define the same
    mechanism for function templates (see Chapter 13). In some ways the effect of
    overloading function templates is similar, but there are also some subtle differences.
    These differences are mostly related to the fact that only the primary template
    needs to be looked up when a use is encountered. The specializations are considered
    only afterward, to determine which implementation should be used. In contrast,
    all overloaded function templates must be brought into an overload set by looking
    them up, and they may come from different namespaces or classes. This increases
    the likelihood of unintentionally overloading a template name somewhat.


    Conversely, it is also imaginable to allow a form of overloading of class templates.
    Here is an example:


    ```

    // invalid overloading of class templates

    template<typename T1, typename T2> class Pair;

    template<int N1, int N2> class Pair;

    ```


    However, there doesn''t seem to be a pressing need for such a mechanism.'
