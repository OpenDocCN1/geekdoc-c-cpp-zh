  md: '# Chapter 9: Names in Templates


    | Classification | Explanation and Notes |

    | Identifier | A name that consists solely of an uninterrupted sequences of letters,
    underscores (_) and digits. It cannot start with a digit, and some identifiers
    are reserved for the implementation: You should not introduce them in your programs
    (as a rule of thumb, avoid leading underscores and double underscores). The concept
    of "letter" be taken broadly and includes universal character names (UCNs) that
    encode glyphs from nonalphabetic languages. |

    | Operator-function-id | The keyword followed by the symbol for an operator—for
    example, operator new and operator []. Many operators have alternative representations.
    For example, operator & can equivalently written as operator bitand when it denotes
    the unary address of operator. |

    | Conversion-function-id | Used to denote a user-defined implicit conversion operator—for
    example operator int<, which could also be obfuscated as operator int bitand.
    |

    | Template-id | The name of a template followed by template angle brackets; for
    example, List<T, O>. (Strictly speaking, the C++ standard allows only simple identifiers
    for the template of a template-id. However, this is probably an oversight and
    an operator-function-id should be allowed too; e.g. operator+<int>. |

    | Unqualified-id | The generalization of an identifier. It can be any of the above
    (identifier, operator-function-id, conversion-function-id or template) or a "destructor
    name" (for example, "Data or "List<C, T, N>). |

    | Qualified-id | An unqualified-id that is qualified with the name of a class
    or namespace, with the global scope resolution identifier. Note that such a name
    itself can be qualified. Examples are ::X, S::x, Array<T>::y; and ::N<T>::z. |

    | Qualified name | This term is not defined in the standard, but we use it to
    refer to names that undergo so-called lookup. Specifically, this is a unqualified-id
    or an unqualified-id that is used after an explicit member operator (. or ->).
    Examples are S::x, this->f, and p->A::m; however, class_mem in a context that
    is implicitly equivalent to this->class_mem is not a qualified name: The member
    access must be explicit. |

    | Unqualified name | An unqualified-id that is not a qualified name. This is not
    a standard term but corresponds to names that undergo the standard calls unqualified
    lookup.


    Table 9.1. Name Taxonomy (part one)'
