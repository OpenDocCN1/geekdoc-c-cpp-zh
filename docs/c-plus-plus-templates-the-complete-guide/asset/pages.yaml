    };\n\ncould declare a member function X::m() if X::m(this is no longer true in\
    \ standard C++). On all implementations, X<T> would not be larger than the following\
    \ X0 when T was a function type (because nonvirtual member functions don't increase\
    \ the size of a class in practice):\n\n```\nstruct X0 {\n  long aligner;\n};\n\
    ```\n\nOn the other hand, X<T> would be larger than X0 if T were an object type\
    \ (the member aligner was required, for example, empty class has the same size\
    \ as a class with just a char member).\n\nWith all this in place, we can now classify\
    \ all types, except class types and enumeration types. If a type is not a fundamental\
