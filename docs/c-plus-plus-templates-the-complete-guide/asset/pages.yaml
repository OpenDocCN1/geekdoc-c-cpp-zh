  md: "# 15.1 An Example: Accumulating a Sequence\n\n+   - Traits parameters usually\
    \ have very natural default values (which are rarely overridden, or simply cannot\
    \ be overridden).\n- Traits parameters tend to depend tightly on one or more main\
    \ parameters.\n- Traits mostly combine types and constants rather than member\
    \ functions.\n- Traits tend to be collected in traits templates.\n\nFor policy\
    \ classes, we make the following observations:\n\n+   - Policy classes don't contribute\
    \ much if they're passed as template parameters.\n- Policy parameters need not\
    \ have default values and are often specified explicitly (although many generic\
    \ components are configured with commonly used default policies).\n- Policy classes\
    \ are mostly orthogonal to other parameters of a template.\n- Policies can be\
    \ collected in plain classes or in template classes.\n\nHowever, there is certain\
    \ indistinct line between both terms. For example, the character traits of the\
    \ C++ standard library also define functional behavior as comparing, and finding\
    \ characters. By replacing these traits we can define string classes that behave\
    \ in a case-insensitive manner (see Section 11.2.14 in [JosutisStdLib]) while\
    \ keeping the same character type. Thus, although they are traits, they have properties\
    \ associated with policies.\n\n# 15.1.6 Member Templates versus Template Parameters\n\
    \nTo implement an accumulation policy we choose to express SumPolicy and MultPolicy\
