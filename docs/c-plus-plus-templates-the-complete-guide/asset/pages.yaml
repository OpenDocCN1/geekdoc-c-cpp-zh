    # 19.3 Identifying Function Types


    The problem with function types is that because the arbitrary number of parameters,
    there isn''t a finite syntactic construct using template parameters that describe
    them all. One approach to resolve this problem is to provide partial specializations
    for functions with a template argument list that is shorter than a chosen limit.
    The first few such partial specializations can be defined as follows:


    ```

    // types/type5.hpp


    template<typename R>

    class CompoundT<R>() {

    public:

    enum { IsPtrT = 0, IsRefT = 0, IsArrayT = 0,

    IsFunct = 1, IsPtrMemT = 0 };

    typeef R BaseT();

    typeef R BottomT();

    typeef CompoundT<void> ClassT;

    };

    ```


