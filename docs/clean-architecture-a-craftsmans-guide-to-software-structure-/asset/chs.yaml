  \ https://www.chenjin5.com](https://www.chenjin5.com)**\n*   电子书下载\n*   打包资源分享\n\
  *   学习资源分享\n\n## 30 数据库是一个细节\n\n![Image](img/00111.jpeg)\n\n从架构的角度来看，数据库并不是一个实体——它是一个未达到架构元素级别的细节。它与软件架构的关系就像门把手与你房屋的关系。\n\
  \n我意识到这些是激进的话。相信我，我经历过这种争论。所以让我明确一下：我说的不是数据模型。你在应用程序内部为数据赋予的结构对架构具有重要意义。但数据库不是数据模型。数据库是一个软件。数据库是一个提供访问数据的工具。从架构的角度来看，该工具是无关的，因为它是一个低级细节——一种机制。优秀的架构师不会允许低级机制污染系统架构。\n\
  \n### 关系型数据库\n\n\n\n\n为什么软件系统和软件企业会被数据库系统主导？为什么 `Oracle`、`MySQL` 和 `SQL Server`\
  \ 如此显赫？简而言之：是因为磁盘。\n\n五十年来，旋转磁磁盘一直是数据存储的主力。好几代程序员从未接触过其他形式的数据存储方式。磁盘技术已经从直径 48 英寸、重量数千磅、容量\
  \ 20 MB 的巨型盘片堆，发展到了直径仅 3 英寸、重量仅几克、容量达 1TB 或以上的单层圆盘。这是一段疯狂的历程。在整个历程中，程序员一直被磁盘技术的一个致命缺点所困扰：磁盘太慢了。\n\
  \n在磁盘上，数据存储在圆形轨道内。这些轨道被分为扇区，每个扇区包含固定数量的字节数，通常为 `4K`。每个盘片可能有数百条轨道，并且有十几个盘片。如果你想从磁盘上读取某个特定字节，你必须将磁头移动到正确的轨道，等待磁盘旋转到正确的扇区，将该扇区的所有\
  \ `4K` 数据读入 `RAM`，然后对该 `RAM` 缓冲区进行索引以获取你需要的字节。这一切都需要时间——毫秒级的时间。\n\n毫秒可能看起来并不多，但一毫秒是大多数处理器时周期的百万万倍。如果这些数据不在磁盘上，它们可以在纳秒内被访问，而不是毫秒。\n\
  \n为了缓解磁盘带来的时间延迟，你需要索引、缓存和优化的查询方案；你还需要某种定期的方法来表示数据，以便这些索引、缓存和查询方案知道它们正在处理什么。简而言之，你需要一个数据访问和管理系统。多年来，这些系统分成了两种类型：文件系统和关系型数据库管理系统\
  \ (`RDBMS`）。\n\n文件系统是基于文档的。它们提供了一种自然且方便的方式来存储整个文档。当你需要通过名称保存和检索一组文档时，它们运行良好，但当你需要搜索文档内容时，它们无法提供太大帮助。找到一个名为\
  \ `login.c` 的文件很容易，但要找到每一个包含名为 `x` 变量的 `.c` 文件却困难且缓慢。\n\n数据库系统是基于内容的。它们提供了一种自然且方便的方式，根据内容查找记录。它们非常擅长根据多个记录共享的某些内容将它们关联。不幸的是，它们在存储和检索不透明文档方面相当较差。\n\
  \n这两种系统都组织了磁盘上的数据，以便根据其特定的访问需求，以最高效的方式进行存储和检索。每种系统都有自己的索引和数据排列方案。此外，每种系统最终都会将相关数据引入\
  \ `RAM`，在那里可以进行快速处理。\n\n## 如果没有磁盘会怎样？\n\n尽管磁盘曾经如此流行，但它们现在是一个正在消失的物种。很快它们就会像磁带、软碟和\
  \ CD 一样消失。它们正在被 `RAM` 取代。\n\n问自己一个问题：当所有磁盘都消失，所有数据都存储在 `RAM` 中，你将如何组织这些数据？你会将其组织成表并使用\
  \ `SQL` 访问吗？你会将其组织成文件并通过目录访问吗？\n\n当然不。你会将其组织成链表、树、哈希表、栈、队列或任何其他数无数的数据结构，并使用指针或引用来访问它们——因为程序员正是这么做的。\n\
  \n事实上，如果你仔细考虑这个问题，你会发现这正是你已经在做的事情。尽管数据保存在数据库或文件系统中，你也会将其读入 `RAM`，然后为了自己的方便，将其重新组织为列表、集合、栈、队列、树或任何符合你喜好的数据结构。你不太可能以文件或表格的形式留下数据。\n\
  \n## 细节\n\n这种现实就是为什么我说数据库只是一个细节。它只是我们用来在磁盘表面和 `RAM` 之间来移动数据的一种机制。数据库实际上只是一个大位桶（bucket\
  \ of bits），我们在其中长期存储数据。但我们很少以这种形式使用数据。\n\n因此，从架构的角度来看，我们不应该关心数据在旋转磁磁盘表面时所呈现的形态。事实上，我们甚至不应该承认磁盘的存在。\n\
  \n## 但性能呢？\n\n性能不是一个架构关关注的问题吗？当然是——但涉及到数据存储时，它是一个可以完全封装并与业务规则分离的关注。是的，我们需要快速地将数据存入和取出，但这是一个低级问题。我们可以通过低级数据访问机制来解决该问题。这与我们系统的整体架构没有任何关系。\n\
  \n## 轶事\n\n20 世纪 80 年代后期，我在一家初创公司领导一个软件工程师团队，试图构建并销售一种测量 T1 电信线路通信完整性的网络管理系统。该系统从这些线路终端的设备中检索数据，然后运行一系列预测算法来检测并报告问题。\n\
  \n我们使用 `UNIX` 平台，并将数据存储在简单的随机访问文件中。我们不需要关系型数据库，因为我们的数据很少基于内容的关系。将它们保存在这些随机访问文件的树和链表中会更好。简而言之，我们将数据保持为最便于加载到\
  \ `RAM` 中的形式，以便在其中进行处理。\n\n我们为这家初创公司聘请了一个营销经理——一个很友善且博学的人。但他立即告诉我，我们的系统中必须有一个关系型数据库。这不是一个选项，也不是工程问题——这是一个营销问题。\n\
  \n这对我来说完全毫无意义。老天，我为什么要想把我的链表和树重新排列成一堆通过 `SQL` 访问的行和表呢？当一个简单的随机访问文件已经足够时，我为什么要引入巨型\
  \ `RDBMS` 的所有开销和费用呢？所以我与他斗争得不可开交。\n\n我们公司有一位硬件工程师，他也开始高喊 `RDBMS` 的口号。他坚信我们的软件系统由于技术原因需要一个\
  \ `RDBMS`。他在我背后与公司高管开会，在白板上画了一个平衡在杆子上的房屋的火笔画，并问高管们：“你们会在杆子上盖房子吗？”他的隐含意思是，一个将表存储在随机访问文件中的\
  \ `RDBMS` 比比我们使用的随机访问文件要可靠得多。\n\n我与他斗争。我与那个营销家伙斗争。在不可置信的无知面前，我坚持我的工程原则。我斗争，斗争，再斗争。\n\
  \n最后，那位硬件开发人员跳过我的头升为了软件经理。最后，他们在那个糟糕的系统里引入了一个 `RDBMS`。而且，最后，他们是完全正确的，而我是错的。\n\n\
  请注意，不是出于工程原因：在这一点上我是正确的。我反对将 `RDBMS` 引入系统的架构核心是正确的。我之所以错，是因为我们的客户期望我们有一个关系型数据库。他们并不知道用它来做什么。他们没有任何现实的方法来使用我们系统中的关系型数据。但这并不重要：我们的客户完全期望一个\
  \ `RDBMS`。它已经变成了所有软件购买者清单上的一个勾选项目。这没有工程上的理由——理性与此无关。这是一种非理性的、外部的且完全毫无根据的需求，但它是真实存在的。\n\
  \n\n\n这种需求从何而来？它源于当时数据库供应商所采用的高效营销活动。他们成功地说服了高层执行官，让他们公司的“数据资产”需要保护，而他们提供的数据库系统是提供这种保护的理想手段。\n\
  \n我们今天仍然看到类似的营销活动。“企业”这个词和“面向服务的架构”的概念，与其说是与事实有关，不如说是与营销有关。\n\n在那个远过去的场景中，我*应该*做些什么？我应该在系统侧边挂载一个\
  \ `RDBMS`，并为其提供一些狭窄且安全的数据访问通道，同时在系统核心保持随机访问文件。而我*实际上*做了什么？我辞职当了一名顾问。\n\n## 结论\n\n\
  数据的组织结构（即数据模型）在架构上是重要的。而那些在旋转磁表面上移动数据的技术和系统则不然。强制将数据组织成表格并使用 `SQL` 进行访问的关系型数据库系统，其与后者的关系远大于与前者。数据是重要的，数据库只是一个细节。\n\
  \n## 31：Web 只是一个细节\n\n![Image](img/00112.jpeg)\n\n你是 20 世纪 90 年代的开发者吗？你还记得 Web 如何改变一切的吗？你记得我们在面对\
  \ Web 这项闪眼的新技术时，是如何鄙视我们那些旧的客户端-服务器架构的吗？\n\n实际上，Web 并没有改变什么。或者说，它不应该改变。Web 只是我们行业自\
  \ 20 世纪 60 年代以来的一系列波动中的最新一种。这些波动在将所有计算能力集中在中央服务器和将所有计算能力分散到终端之间来回移动。\n\n在 Web 兴起的过去十年里，我们已经看到了几次波动。起初，我们认为所有的计算能力都将在服务器集群中，而浏览器是愚蠢的。然后我们开始在浏览器中放入\
  \ `applets`。但我们不喜欢那样，于是把动态内容移回服务器。但随后我们又不喜欢了，于是发明了 `Web 2.0`，并通过 `Ajax` 和 `JavaScript`\
  \ 将大量处理过程移回浏览器。我们甚至创建了完全编写并在浏览器中执行的巨型应用程序。而现在，我们都在兴奋于通过 `Node` 将那些 `JavaScript`\
  \ 带回服务器。\n\n（唉。）\n\n### 无休止的摆钟\n\n当然，认为这些波动是从 Web 开始的是错误的。在 Web 之前，有客户端-服务器架构。在此之前，有带有哑终端阵列的中央小型计算机。在此之前，有带有智能绿屏终端的主机（那与现代浏览器非常相似）。在此之前，有计算机机房和打卡片……\n\
  \n故事就是这样。我们似乎无法确定自己想把计算能力放在哪里。我们在集中和分布之间来回移动。而且，我想，这些波动在未来很一段时间内仍将持续。\n\n当你从 `IT`\
  \ 历史的整体来看时，Web 一什么都没有改变。Web 仅仅是许多波动中的一种，这场斗争在我们大多数人出生之前就已经开始了，并将在我们大多数人退休后持续很很久。\n\
  \n然而，作为架构师，我们必须考虑长期问题。这些波动只是我们想要推离业务规则核心区域之外的短期问题。\n\n我给你们讲讲 Q 公司的故事。Q 公司建立了一个非常受欢迎的个人财务系统。它是一个带有非常用的\
  \ `GUI` 的桌面应用。我非常喜欢用它。\n\n然后 Web 来了。在它的下一个版本中，Q 公司更改了 `GUI`，使其看起来和操作起来都像一个浏览器。我简直震惊震惊了！哪位营销天才决定运行在桌面上的个人财务软件应该具有\
  \ Web 浏览器的外观和感受？\n\n当然，我讨厌那个新界面。显然其他人也一样——因为在发布几个版本后，Q 公司逐渐移除了那种类浏览器的感觉，将其个人财务系统变回了普通的桌面\
  \ `GUI`。\n\n现在想象你是 Q 公司的软件架构师。想象某个营销天才说服了高层，认为整个 `UI` 必须改变以看起来更像 Web。你会怎么做？或者说，在此点之前，你本应该做些什么来保护你的应用程序免受那个营销天才的侵害？\n\
  \n你应该将业务规则与你的 `UI` 解耦。我不知道 Q 公司的架构师是否做到了这一点。有一天我很想听听他们的故事。如果我当时在那场，我一定会极力游说将业务规则与\
  \ `GUI` 隔离，因为你永远不知道那些营销天才接下来会做什么。\n\n现在考虑 A 公司，他们制造了一款漂亮的智能手机。最近它发布了其“操作系统”的升级版本（我们能讨论手机内部的操作系统真是太奇怪了）。除其他因素外，那个“操作系统”升级完全改变了所有应用程序的外观和感受。为什么？我想，是某个营销天才这么说的。\n\
  \n我不是那个设备内部软件的专家，所以我不知道这种变化是否给在 A 公司手机上运行的应用程序程序员带来了任何重大困难。我确实希望 A 公司的架构师以及应用程序的架构师保持他们的\
  \ `UI` 和业务规则相互隔离，因为总有营销天才在外面等着，准备扑向你创造的下一点点耦合。\n\n## 结论\n\n结果简单来说：`GUI` 是一个细节。Web\
  \ 是一个 `GUI`。所以 Web 是一个细节。而且，作为架构师，你希望将这样的细节放在边界之后，使它们与你的核心业务逻辑分离。\n\n\n\n框架已经变得非常流行。通常来说，这是一件好事。世界上有很多免费、强大且实用的框架。\n\
  \n然而，框架并不是架构——尽管有些框架试图成为架构。\n\n## 框架作者\n\n大多数框架作者免费提供他们的工作，是因为他们希望为社区做贡献。他们想要回馈。这是值得赞扬的。然而，无论他们的动机有多么高尚，这些作者并没有考虑`你`的最佳利益。他们做不到，因为他们并不了解你，也不了解你的问题。\n\
  \n框架作者了解他们自己的问题，以及他们的同事和朋友的问题。他们编写框架是为了解决`那些`问题——而不是你的问题。\n\n当然，你的问题可能与那些其他问题有很大重叠。如果不是这样，框架就不会如此流行了。在存在这种重叠的范围内，框架确实非常有用。\n\
  \n## 不对称婚姻\n\n你与框架作者之间的关系是极度不对称的。你必须对框架做出巨大的承诺，但框架作者对你完全没有做出任何承诺。\n\n仔细考虑这一点。当你使用一个框架时，你会阅读由该框架作者提供的全部文档。在这些文档中，作者以及该框架的其他用户会建议你如何将软件与框架集成。通常，这意味着将你的架构封装在那个框架之上。作者建议你继承框架的基类，并将框架的设施导入你的业务对象中。作者敦促你将应用程序尽可能紧地`耦合`到框架上。\n\
  \n对于框架作者来说，耦合到他自己的框架并不是风险。作者`想要`耦合到那个框架，因为作者对那个框架有绝对的控制权。\n\n而且，作者希望`你`耦合到框架上，因为一旦以这种方式耦合，就很难脱离。对于框架作者来说，没有什么比一群用户愿意不可分割地继承作者的基类更让他们感到有成就感的了。\n\
  \n事实上，作者是在要求你与框架“结婚”——对那个框架做出一个巨大的、长期的承诺。然而，在任何情况下，作者都不会对你做出相应的承诺。这是一场单向的婚姻。你承担了所有的风险和负担；而框架作者则什么都不承担。\n\
  \n## 风险\n\n风险是什么？这里有几点供你考虑。\n\n- 框架的架构通常并不干净。框架倾向于违反依赖规则（Dependency Rule）。他们要求你将他们的代码继承到你的业务对象中——即你的`Entities`！他们希望将他们的框架耦合到最内层的圈中。一旦进入，那个框架就再也不会离开了。结婚戒指戴在了你的手指上；它将一直留在那那里。\n\
  - 框架可能会帮助你实现应用程序的一些早期功能。然而，随着你的产品的成熟，它可能会超出框架设施的能力。如果你已经戴上了那枚结婚戒指，你会发现随着时间的推移，框架对你的阻碍会越来越大。\n\
  - 框架可能会朝着你认为没有帮助的方向演进。你可能会受困于升级到那些对你没有帮助的新版本。你甚至可能会发现你使用过的旧功能消失了，或者以你难以跟上的方式发生了变化。\n\
  - 可能会出现一个全新的、更好的框架，而你希望自己能够切换到它。\n\n## 解决方案\n\n解决方案是什么？\n\n*不要与框架结婚！*\n\n哦，你可以`use`\
  \ 框架——只是不要与它耦合。保持距离。将框架视为属于架构外层圈之一的细节。不要让它进入内层圈。\n\n如果框架希望你从它的基类中派生业务对象，请说不！相反，请派生代理（proxies），并将这些代理保持在作为你业务规则`插件`（plugins）的组件中。\n\
  \n不要让框架进入你的核心代码。相反，遵循依赖规则，将它们集成到插件你核心代码的组件中。\n\n例如，也许你喜欢`Spring`。`Spring`是一个很好的依赖注入框架。也许你使用\
  \ `Spring` 来自动连接你的依赖。这很好，但不应该在业务对象中到处洒 `@autowired` 注解。你的业务对象不应该知道 `Spring`。\n\n\
  相反，你可以使用 `Spring` 将依赖注入到 `Main` 组件中。`Main` 知道 `Spring`是可以的，因为 `Main` 是架构中最脏、最底层的组件。\n\
  \n## 我现在宣布你 ……\n\n有些框架是你单纯必须结婚的。例如，如果你在使用 `C++`，你很可能不得不与 `STL` 结婚——这是很难避免的。如果你在使用\
  \ `Java`，你几乎认为必须与标准库结婚。\n\n这是正常的——但它应该仍然是一个决策`。你必须理解，当你将一个框架与你的应用程序结婚时，在该程序的剩余生命周期内，你将与该框架系在一起。无论好坏，无论疾病健康，无论贫富，抛弃他人，你`将`一直使用那个框架。这不是一个可以轻率的承诺。\n\
  \n## 结论\n\n面对框架时，尝试不要立即与它结婚。在采取行动之前，看看是否有方法先“约会”一段时间。如果可能的话，尽可能地将框架保持在架构边界之外。也许你可以找到一种“不买牛就能得到奶”的方法。\n\
  \n## 33\n\n## 案例研究：视频销售\n\n![Image](img/00114.jpeg)\n\n现在是把这些规则和想法整合到一个案例研究中了。这个案例研究将是短而简单的，但将描绘架构师使用的过程以及此类架构师所做的决策。\n\
  \n### 产品\n\n对于这个案例研究，我选择了一个我非常熟悉的产品：一个销售视频的网站软件。当然，它让人想起了 cleancoders.com，这是我出售软件教程视频的网站。\n\
  \n基本想法显而易见。我们有一组想要出售的视频。我们在网络上将它们卖给个人和企业。个人可以支付一个价格流媒体视频，支付另一个更高的价格下载这些视频并永久拥有它们。企业许可仅限流媒体，并按批量购买以获得数量折扣。\n\
  \n个人通常既是观众又是购买者。相比之下，企业通常有专门购买视频供其他人观看的人。\n\n视频作者需要提供他们的视频文件、书面描述以及辅助文件，包括考试、问题、解决方案、源代码和其他材料。\n\
  \n管理员需要添加新的视频系列，向系列添加和删除视频，并为各种许可建立价格。\n\n我们确定系统初始架构的第一步是识别参与者和用例。\n\n### 用例分析\n\
  \n图 33.1 显示了一个典型的用例分析。\n\n![Image](img/00115.jpeg)\n\n**图 33.1** 典型的用例分析\n\n四个参与者显而易见。根据单一职责原则，这四个参与者将是系统主要的变更来源。每当添加新功能或更改现有功能时，都会为了服务这些参与者之一而采取步骤。因此，我们希望划分系统，使得对一个参与者的更改不会影响任何其他参与者。\n\
  \n\n\n\n图 33.1 中所示的用例并不是完整的列表。例如，你不会找到登录或注出的用例。之所以省略这些内容，仅仅是为了控制本书中的问题规模。如果我包含所有不同的用例，那么这一章将不得不自成一本书。\n\
  \n请注意图 33.1 中间的虚线用例。它们是`abstract`（抽象）^(1)用例。抽象用例是一种设定通用策略的用例，由另一个用例来具体实现。如你所见，`作为查看者查看目录`和`作为购买者查看目录`用例都继承自`查看目录`抽象用例。\n\
  \n一方面，对我来说，创建这种抽象并不是严格必要的。我本可以从图中删掉这个抽象用例，而不会影响整个产品的任何功能。另一方面，这两个用例`如此相似`，以我认为在分析早期识别这种相似性并找到一种统一它们的方法是明智的。\n\
  \n## 组件架构\n\n现在我们已经知道了参与者和用例，可以创建一个初步的组件架构（图 33.2）。\n\n图中的双线如常一样表示架构边界。你可以看到视图（views）、演示器（presenters）、交互器（interactors）和控制器（controllers）的典型分层。你还可以看到我根据相应的参与者将这些类别每一个进行了拆分。\n\
  \n图 33.2 中的每个组件都代表一个潜在的 `.jar` 文件或 `.dll` 文件。每个此类组件都将包含分配给它的视图、演示器、交互器和控制器。\n\n\
  注意为`目录视图`和`目录演示器`设置的特殊组件。这就是我处理抽象的`查看目录`用例的方法。我假设那些视图和演示器将被编码为这些组件内部的抽象类，而继承这些组件将包含继承自这些抽象类的视图和演示器类。\n\
  \n![Image](img/00116.jpeg)\n\n**图 33.2** 初步的组件架构\n\n我真的会将系统拆分成所有这些组件，并将它们作为 `.jar`\
  \ 或 `.dll` 文件交付吗？既是又不是。我确实会以此方式拆分编译和构建环境，以便我`能够`构建出这样的独立交付物。我还会保留在必要时将所有这些交付物合并为较少数量交付物的权利。例如，考虑到图\
  \ 33.2 中的分层，很容易将它们合并为五个 `.jar` 文件——分别用于视图、演示器、交互器、控制器和工具类。然后，我可以独立地部署那些最有可能相互独立独立变化的组件。\n\
  \n另一种可能的分组方式是将视图和演示器放在同一个 `.jar` 文件中，而将交互器、控制器和工具类放在它们自己的 `.jar` 文件中。还有一种更原始的分组方式是创建两个\
  \ `.jar` 文件，将视图和演示器放在一个文件中，将其他所有放在另一个文件中。\n\n保持这些选项开放将允许我们根据系统随时间推移的变化调整部署系统的方式。\n\
  \n## 依赖管理\n\n图 33.2 中的控制流从右向左进行。输入发生在控制器处，该输入由交互器处理成结果。然后演示器格式化结果，视图显示这些呈现内容。\n\n\
  注意，箭头并不是全部从右向左流。事实上，大多数箭头是从左向右指向的。这是因为架构遵循了`依赖规则`（Dependency Rule）。所有的依赖都以一个方向跨越边界线，并且始终指向包含高层策略的组件。\n\
  \n此外，注意`using`关系（空心箭头）顺着控制流的方向指向，而`inheritance`关系（实心箭头）则反向控制流的方向指向。这描述了我们如何使用开闭原则（Open–Closed\
  \ Principle）来确保依赖流向正确的方向，并确保低级细节的更改不会向上波动并影响高层策略。\n\n## 结论\n\n图 33.2 中的架构图包含了两个维度的分离。第一个是基于单一职责原则的参与者分离；第二个是依赖规则。两者的目标都是分离由于不同原因、以不同速率变化的组件。不同的原因对应于参与者；不同的速率对应于不同的策略级别。\n\
  \n一旦你这样构建了代码，你就可以根据喜好混合组合实际部署系统的方式。你可以以任何合逻辑的方式将组件分组为可部署的交付物，并在条件变化时轻松地更改该分组。\n\n\
  1。这是我对“抽象”用例的自定义符号。使用诸如`<<abstract>>` 这样的 UML 刻型标记会更符合标准，但我发现现在坚持遵循此类标准并没有什么用。\n\
  \n## 34 缺失的章节\n\n![Image](img/00117.jpeg)\n\n*作者：Simon Brown*\n\n到目前为止你所读到的所有建议都无疑能帮助你设计出更好的软件，由具有定义边界、清晰职责和受控依赖的类和组件组成。但事实证明，细节隐藏在实现中，如果你不考虑这一点，很容易在最后关头掉链子。\n\
  \n让我们假设我们正在构建一个在线书店，我们要求实现的一个用例是客户能够查看他们的订单状态。虽然这是一个 Java 示例，但这些原则同样适用于其他编程语言。\n\
  \n### 按包分区 (PACKAGE BY LAYER)\n\n第一种可能也是最简单的设计方法是传统的水平分层架构，我们根据从技术角度的功能来分离代码。这通常被称为“按包分区”。图\
  \ 34.1 展示了这作为 UML 类图可能的样子。\n\n在这种典型的分层架构中，我们有一层 Web 代码、一层“业务逻辑”和一层持久化。换句话说，代码被水平切割成层，并用作分组相似类型的方法。在“严格分层架构”中，层应该只依赖于相邻的下层。在\
  \ Java 中，层通常由包来实现的。如图 34.1 所示，层之间的所有依赖都向下。在这个示例中，我们有以下 Java 类型：\n\n• `OrdersController`:\
  \ Web 控制器，类似于 Spring MVC 控制器，处理来自 Web 的请求。\n\n• `OrdersService`: 定义与订单相关的业务逻辑的接口。\n\
  \n• `OrdersServiceImpl`:订单服务的实现.^(1)\n\n• `OrdersRepository`: 定义如何访问持久化订单信息的接口。\n\
  \n• `JdbcOrdersRepository`: 仓库接口的实现。\n\n![Image](img/00118.jpeg)\n\n**图 34.1** 按包分区\n\
  \n\n\n\n\n在“表现层数据分层”中，马丁·福勒（Martin Fowler）提到，采用这种分层架构是一个很好的入门方法。他并非孤单。你发现的许多书籍、教程、培训课程和示例代码也会引导你走创建分层架构之路。这是一种让东西运行起来非常快的方法，而不会引入巨大的复杂性。正如马丁指出的，问题在于，一旦你的软件规模和复杂性增加，你很快就会发现仅仅有三个大桶代码是不够的，你将需要进一步的模块化。\n\
  \n另一个问题是，正如鲍鲍叔（Uncle Bob）已经说过的那样，分层架构并没有体现任何关于业务领域的特征。将来自两个完全不同业务领域的分层架构代码放在一起，它们看起来可能惊人地相似：Web\
  \ 层、服务层（services）和仓库层（repositories）。分层架构还有另一个巨大问题，但我们稍后讨论。\n\n## 按功能分包 (PACKAGE\
  \ BY FEATURE)\n\n组织代码的另一种选择是采用“按功能分包”风格。这是一种基于相关功能、领域概念或聚合根（使用领域驱动设计的术语）的垂直切分。在我见过的典型实现中，所有类型都被放置在单个\
  \ Java 包中，该包的命名反映了所归组的概念。\n\n通过这种方法，如图 34.2\n\n**图 34.2** 按功能分包\n\n## 端口与适配器 (PORTS\
  \ AND ADAPTERS)\n\n正如鲍鲍叔所说，如“端口与适配器”、“六边形架构”、“边界、控制器、实体”等方法，旨在创建一种架构，其中专注于业务/领域的代码是独立的，并且分离于技术实现细节（如框架和数据库）。总而言之，你经常会看到此类代码库由一个“内部”（领域）和一个“外部”（基础设施）组成，正如图\
  \ 34.3\n\n**图 34.3** 具有内部和外部的代码库\n\n“内部”区域包含所有的领域概念，而“外部”区域包含与外部世界的交互（例如，UI、数据库、第三方集成）。这里的主要规则是“外部”依赖于“内部”——绝不反反亦之。图\
  \ 34.4\n\n**图 34.4** 查看订单用例\n\n同样值得指出，这是 UML 类图可能样子的简化版本，因为缺少了交互器（interactors）以及跨越依赖边界进行数据序列化的对象。\n\
  \n## 按组件分包 (PACKAGE BY COMPONENT)\n\n尽管我完全赞同关于 SOLID、REP、CCP 和 CRP 的讨论以及书中的大部分建议，但关于如何组织代码，我得出了略有不同的结论。因此，我在这里介绍另一种选择，我称之为“按组件分包”。为了给你提供一些背景，我的职业生涯大部分时间都在构建企业级软件，主要使用\
  \ Java，跨越了多个不同的业务领域。这些软件系统也差异巨大。许多是基于 Web 的，但另一些是客户端-服务器、分布式、基于消息的或其他。尽管技术不同，但共同主题是，大多数此类软件系统的架构都是基于传统的分层架构的。\n\
  \n我已经提到了为什么分层架构应该被认为是糟糕的几个原因，但这并不是全部。分层架构的目的是分离具有相同功能的代码。 Web 内容与业务逻辑分离，而业务逻辑又与数据访问分离。正如我们在\
  \ UML 类图中看到的，从实现的角度来看，一个层通常等同于一个 Java 包。从代码访问性的角度来看，为了让 `OrdersController` 能够对 `OrdersService`\
  \ 有依赖，`OrdersService` 接口需要被标记为 `public`。同样，`OrdersRepository` 接口需要被标记为 `public`，以便在仓库包之外被\
  \ `OrdersServiceImpl` 类看到。\n\n在严格的分层架构中，依赖箭头应该始终向下，层仅依赖于相邻的下层。这回到了创建一个良好的、整洁的无循环依赖图，通过引入关于代码库中元素如何相互依赖的规则来实现。这里的大问题是，我们可以通过引入不理想的依赖来作弊，但仍然创建一个良好的无循环依赖图。\n\
  \n假设你聘佣了一位新加入团队的人员，并给这位新人另一个与订单相关的用例去实现。由于这个人是新人，他想留下深刻印象并尽可能快实现这个用例。在喝着咖啡坐了几分钟后，新人发现了一个现有的\
  \ `OrdersController` 类，因此他认为新的订单相关网页的代码应该放在那里。但它需要来自数据库的某些 `orders` 数据。新人产生了一个灵感：“噢，那里也已经构建了一个\
  \ `OrdersRepository` 接口。我只需将实现类注入到我的控制器中即可。完美！”在又捣捣了几分钟后，网页运行了。但结果生成的 UML 图如图 34.5\
  \ 所示。\n\n依赖箭头仍然指向下方，但 `OrdersController` 现在对于某些用例还额外跳过了 `OrdersService`。这种组织通常被称为*松散分层架构*（relaxed\
  \ layered architecture），因为允许层跳过其相邻的层。在某些情况下，这是预期的结果——例如，如果你正在尝试遵循 CQRS 模式。在许多其他情况下，跳过业务逻辑层是不理想的，特别是当该业务逻辑负责确保对单个记录的授权访问时，例如。\n\
  \n\n\n\n虽然新的用例行得通，但它的实现方式可能并不是我们预期的那样。当我作为顾问访问各个团队时，我经常看到这种情况，这通常在团队开始可视化其代码库真实面貌时表现出来（往往是第一次）。\n\
  \n![Image](img/00122.jpeg)\n\n**图 34.5** 松散的分层架构\n\n在这里我们需要一个准则——一种架构原则——规定类似于“Web\
  \ 控制器绝不应直接访问仓库”之类的内容。当然，问题在于执行。我遇到的很多团队简单地说：“我们通过良好的自律和代码审查来执行这一原则，因为我们信任我们的开发者。”这种信心听起来很棒，但我们都清楚，当预算和截止日期开始紧紧逼近时会发生什么。\n\
  \n只有极少数的团队告诉我，他们使用静态分析工具（例如 `NDepend`、`Structure101`、`Checkstyle`）在构建时检查并自动强制执行架构违规。你可能自己见过此类规则；它们通常表现为正则表达式或通配符字符串，声明“包\
  \ `**/web` 中的类型不应访问 `**/data` 中的类型”；并且它们在编译步骤之后执行。\n\n这种方法有点粗糙，但可以奏效，能够报告团队定义的违反架构原则的违规行为，并（希望）让构建失败。这两种方法的问题在于它们都是可能出错的，而且反馈循环比应该的要长。如果不加检查，这种做法会将代码库变成一个“大泥球”。^(6)\
  \ 如果可能的话，我个人想使用编译器来强制执行我的架构。\n\n这引入了“按组件划分”（package by component）的选项。这是对我们目前所看到的所有方法的混合处理，其目标是将与单个粗粒度组件相关的所有封装到单个\
  \ Java 包中。它是关于从以服务为中心的视角来看待软件系统，这也是我们在微服务架构中看到的。。正如端口和适配器（ports and adapters）将 Web\
  \ 视为仅仅一种交付机制一样，“按组件划分”将用户界面与这些粗粒度组件隔离开来。图 34.6 显示了“查看订单”用例可能看起来的样子。\n\n本质上，这种方法将“业务逻辑”和持久化代码封装成一个整体，我称之为“组件”。鲍叔在书早早部分介绍了他对“组件”的定义，说：\n\
  \n*组件是部署的单元。它们是可以作为系统的一部分部署的最小实体。在 Java 中，组件就是 jar 文件。*\n\n![Image](img/00123.jpeg)\n\
  \n**图 34.6** 查看订单用例\n\n我对组件的定义略有不同：“位于整洁接口背后的相关功能分组，它存在于应用程序等执行环境内部。”这个定义源于我的“C4\
  \ 软件架构模型”，^(7)，这是一种简单的层次化方法，通过容器、组件和类（或代码）来思考软件系统的静态结构。它指出一个软件系统由一个或多个容器（例如 Web\
  \ 应用程序、移动端应用、独立应用程序、数据库、文件系统）组成，每个容器包含一个或多个组件，而这些组件反过来由一个或多个类（或代码）实现。每个组件是否位于单独的\
  \ jar 文件是一个正交的问题。\n\n“按组件划分”方法的一个关键优势是，如果你正在编写需要处理 `orders` 的代码，那么只有一个地方可以去——`OrdersComponent`。在组件内部仍然保持着关注点分离，因此业务逻辑与数据持久化是的，但那是消费者不需要知道的组件实现细节。这类似于如果你采用微服务或面向服务的架构（SOA）后可能得到的结果——一个独立的\
  \ `OrdersService`，它封装了与处理订单相关的所有内容。关键区别在于解耦模式。你可以将单体应用程序中定义良好的组件视为通向微服务架构的垫脚石。\n\
  \n### 细节隐藏在实现中\n\n从表面上看，这四种方法看起来都是组织代码的不同方式，因此可以被视为不同的架构风格。尽管如此，如果你的实现细节出错了，这种感知会迅速瓦解。\n\
  \n我经常看到的一种现象是在 Java 等语言中过度使用 `public`。这几乎就像我们这些开发者本能地不经思考就使用 `public` 一样。这种倾向是显而易见的，无论代码库旨在实现何种架构风格——水平层、垂直层、端口和适配器或其他。将你所有的类型都标记为\
  \ `public` 意味着你没有利用编程语言在封装方面提供的功能。\n\n### 组织与封装\n\n从另一个角度看这个问题，如果你将应用程序中的所有类型都设为\
  \ `public`，那么包就仅仅是一种组织机制（一种分组，类似于文件夹），而不是用于封装。由于 `public` 类型可以从任何地方使用，你实际上可以忽略包，因为它们没有提供什么真正的价值。最终结果是，如果你忽略了包（因为它们没有提供任何封装和隐藏的手段），那么你想创建何种风格其实并不重要了。\n\
  \n如果我们回看示例 UML 图，如果所有类型都是 `public`，那么 Java 包就成了一个无关紧要的细节。本质上，本章之前介绍的所有四种架构方法在类型都是\
  \ `public` 时是完全相同的（图 34.7）。\n\n仔细观察图 34.7 中每个类型之间的箭头：无论你尝试采用哪种架构方法，它们都是相同的。在概念上，这些方法大不同，但在语法上它们是相同的。此外，你可以认为，当你把所有类型都设为\
  \ `public` 时，你拥有的只是四种描述传统水平分层架构的方法。这是一个很巧妙的技巧，而且当然没有人会把所有的 Java 类型都设为 `public`。除非他们真的做了。而我见过。\n\
  \nJava 的访问修饰符并不完美，^(8)，但忽略它们无异于自找。Java 类型放置包的方式可以在恰当应用 Java 访问修饰符时，极大影响这些类型的可访问性（或不可访问性）。如果我把包还原，并标记（通过视觉淡化）那些可以被更严格限制的类型，图景就会变得非常有趣（图\
  \ 34.8）。\n\n![Image](img/00124.jpeg)\n\n**图 34.7** 四种架构方法都是相同的\n\n\n\n\n\n从左到右，在“按层划分”（package\
  \ by layer）的方法中，`OrdersService` 和 `OrdersRepository` 接口需要是 `public` 的，因为它们拥有定义包之外类的入站依赖。相比之下，实现类（`OrdersServiceImpl`\
  \ 和 `JdbcOrdersRepository`）可以设置为更严格的权限（包保护 package protected）。没有人需要了解它们；它们是实现细节。\n\
  \n在“按功能划分”（package by feature）的方法中，`OrdersController` 提供了进入该包的唯一入口，因此其他所有内容都可以设置为包受保护。这里的巨大缺陷是，除非通过控制器，否则代码库中该包之外的任何其他都无法访问与订单相关的信息。这可能是理想的，也可能不理想。\n\
  \n在端口和适配器（ports and adapters）方法中，`OrdersService` 和 `Orders` 接口拥有其他包的入站依赖，因此它们需要被设置为\
  \ `public`。同样，实现类可以设置为包受保护，并在运行时进行依赖注入。\n\n![Image](img/00125.jpeg)\n\n**图 34.8**\
  \ 灰色显示的类型是可以采用更严格的访问修符类型的地方\n\n最后，在“按组件划分”（package by component）的方法中，`OrdersComponent`\
  \ 接口拥有来自控制器的入站依赖，但其他所有内容都可以设置为包受保护。`public` 类型越少，潜在的依赖就越少。现在，该包之外的代码没有办法直接使用 `OrdersRepository`\
  \ 接口或实现，因此我们可以依赖编译器来强制这一架构原则。你可以在 .NET 中通过 `internal` 关键字执行相同的操作，尽管你需要为每个组件创建一个单独的程序集。\n\
  \n为了绝对起见，我在这里描述的与单体应用程序有关，其中所有代码都存在于单一源代码树中。如果你正在构建这样的应用程序（许多人确实是），我绝对鼓励你依靠编译器来强制执行你的架构原则，而不是依赖自律和编译后工具。\n\
  \n### 其它解耦模式\n\n除了你正在使用的编程语言外，通常还有其他方法可以解耦你的源代码依赖。对于 Java，你拥有像 OSGi 这样的模块框架，以及新的\
  \ Java 9 模块系统。使用模块系统时，如果使用得当，你可以区分 `public` 类型和已发布（published）的类型。例如，你可以创建一个 `Orders`\
  \ 模块，其中所有的类型都标记为 `public`，但只发布其中一小部分类型供外部使用。这已期待已，但我热情 Java 9 模块系统将为我们提供另一个构建更好软件的工具，并再次激发人们对设计思维的兴趣。\n\
  \n另一个选项是在源代码级别解耦依赖，通过将代码拆分为不同的源代码树中。如果以端口和适配器为例，我们可以有三个源代码树：\n\n- 业务和域的源代码（即独立于技术和框架选择的所有内容）：`OrdersService`、`OrdersServiceImpl`\
  \ 和 `Orders`\n- Web 端的源代码：`OrdersController`\n- 数据持久化的源代码：`JdbcOrdersRepository`\n\
  \n后两个源代码树对业务和领域代码有编译时依赖，而领域代码本身对 Web 或数据持久化代码一无所知。从实现的角度来看，你可以通过在构建工具（例如 Maven、Gradle、MSBuild）中配置单独的模块或项目来实现这一点。理想情况下，你会重复这种模式，为应用程序中的每一个组件拥有一个单独的源代码树。尽管如此，这是一个非常理想化的解决方案，因为以这种方式拆分源代码会带来现实世界的性能、复杂性和维护问题。\n\
  \n一些人在处理端口和适配器代码时遵循的更简单的方法是仅使用两个源代码树：\n\n- 域代码（“内部”）\n- 基础设施代码（“外部”）\n\n这可以很好地映射到许多人用来总结端口和适配器架构的图表（图\
  \ 34.9），并且从基础设施到域之间存在一个编译时依赖。\n\n![Image](img/00126.jpeg)\n\n**图 34.9** 域和基础设施代码\n\
  \n这种组织源代码的方法也有效，但请注意潜在的权衡。这就是我所说的“端口和适配器的外围环路反模式”。法国巴黎有一条名为 Boulevard Périphérique\
  \ 的环城公路，它允许你绕过巴黎而无需进入城市复杂的区域。将所有的基础设施代码放在单一的源代码树中，意味着应用程序中一个区域（例如 Web 控制器）的基础设施代码极有可能直接调用应用程序另一个区域（例如数据库存储库）的代码，而无需经过域层。如果你忘记对该代码应用适当的访问修符，情况会是如此。\n\
  \n### 结论：缺失的建议\n\n这一章的重点在于强调，如果不考虑实现策略的复杂性，你最理想的设计意图也可能瞬间化毁。思考如何将你理想的设计映射到代码结构上，如何组织这些代码，以及在运行时和编译时应用哪些解耦模式。在适用情况下保留选项，但要务实，并考虑到你的团队规模、他们的技能水平、解决方案的复杂性以及你的时间和预算限制。还要考虑使用编译器来帮助你强制执行所选的架构风格，并注意其他领域（如数据模型）中的耦合。细节在实现之中。\n\
  \n\n\n\n\n为了揭示优秀架构的原理，让我们回顾自 1970 年以来我参与过的一些项目，开启 45 年的历程。其中一些项目从架构角度来看非常有趣；另一些项目则因为从中汲取的教训，以及它们如何影响后续项目而变得有趣。\n\
  \n这个附录带有某种自传色彩。我试图保持讨论内容与架构主题相关；但正如任何自传内容一样，其他因素有时也会闯入。`;-)`\n\n## 工会会计系统\n\n20\
  \  世纪 60 年代后期，一家名为 ASC Tabulating 的公司与卡车司机工会 705 分会签署了一份合同，提供一套会计系统。ASC 选择用于实现该系统的计算机是一台\
  \ `GE Datanet 30`，如图 A.1 所示。\n\n![Image](img/00128.jpeg)\n\n**图 A.1** GE Datanet\
  \ 30\n\n*由 Ed Thelen 提供，ed-thelen.org*\n\n从图片中可以看出，这是一台巨大的机器。它占据了整个房间，而且这个房间需要严格的环境控制。\n\
  \n这台计算机制造于集成电路出现之前的时代。它是由离散晶体管构成的。甚至还有一些真空管（尽管仅用于磁带驱动器的感应放大器中）。\n\n按照今天的标准，这台机器是巨大、缓慢、狭小且原始的。它拥有\
  \ `16K × 18 bits` 的磁芯，周期时间约为 `7 microseconds`。它占据了一个巨大的、受控的房间。它配有 7 磁磁道磁带驱动器和一个容量约为\
  \ 20 兆字节的磁盘驱动器。\n\n那块硬盘是个怪物。你可以在图 A.2 的图片中看到它——但这并不能让你完全感受到这头猛兽的规模。机柜的顶部超过了我的头顶。盘片直径为\
  \ 36 英寸，厚度为 3/8 英寸。其中一张盘片在图 A.3](#part0051.html_chAfig3)中所示。\n\n现在数一数第一张照片中的盘片。有十多个。每块盘片都有自己独立的寻道臂，由气动执行器驱动。你可以看着那些寻道头在盘片上移动。寻道时间可能大约半秒到一秒。\n\
  \n当这头猛兽启动时，它的声音就像喷气式发动机。地板会轰隆震抖，直到它加速运转。\n\n![Image](img/00129.jpeg)\n\n**图 A.2**\
  \ 带有盘片的数据存储单元\n\n*由 Ed Thelen 提供，ed-thelen.org*\n\nDatanet 30 最著名的声名在于它能够以相对较高的速度驱动大量的异步终端。这正是\
  \ ASC 所需要的。\n\nASC 位于伊利诺伊州的湖布鲁夫（Lake Bluff），位于芝加哥北 30 英里。705 分会处位于芝加哥市中心。工会希望十左右的数据录入员使用\
  \ `CRT` 终端（图 A.4）向系统输入数据。他们会使用 `ASR35` 电打字（图 A.5）打印报告。\n\n![Image](img/00130.jpeg)\n\
  \n**图 A.3** 该磁盘的一块盘片：3/8 英寸厚，36 英寸直径\n\n*由 Ed Thelen 提供，ed-thelen.org*\n\n`CRT`\
  \ 终端的运行速度为每秒 30 个字符。对于 20 世纪 60 年代后期来说这是一个很不错的速率了，因为当时的调制调器并不先进。\n\nASC 从电话公司租赁了十多条专用电话线和两倍数量的\
  \ 300 波调制调器，以将 Datanet 30 连接到这些终端。\n\n这些计算机并没有自带操作系统。它们甚至没有文件系统。你得到的是一个汇编器。\n\n\
  如果你需要在磁盘上存储数据，你就直接存储在磁盘上。不是在文件里。不在目录里。你需要弄清楚要把数据放在哪个磁道、盘片和扇区，然后操作磁盘将数据存入那里。是的，这意味着我们自己写了\
  \ `disk driver`。\n\n![Image](img/00131.jpeg)\n\n**图 A.4** Datapoint CRT 终端\n\n*由\
  \ Bill Degnan 提供，vintagecomputer.net*\n\n工会会计系统有三类记录：代理（Agents）、雇主（Employers）和成员（Members）。该系统是针对这些记录的\
  \ CRUD 系统，但也包含了过账会费、计算总账变化等操作。\n\n原始系统是由一位顾问用汇编语言编写的，他以某种方式成功地将整个程序挤进了 16K 空间。\n\
  \n正如你所想象的那样，那台巨大的 Datanet 30 是一台运行和维护成本极其昂贵的机器。负责软件运行的软件顾问也很贵。此外，小型计算机正在变得流行，而且价格便宜得多。\n\
  \n![Image](img/00132.jpeg)\n\n**图 A.5** ASR35 电打字机\n\n*经 Joe Mabel 许可*\n\n1971 年，我才\
  \ 18 岁时，ASC 雇佣了我以及两个极客范儿的朋友，用将整个工会会计系统替换为一套基于 `Varian 620/f` 小型型计算机的系统（图 A.6）。\n\
  \nVarian 机器拥有 16 位总线和 `32K` 磁芯内存。周期时间约为 1 微秒。它比 Datanet 30 强大得多。它使用了 IBM 非常成功的 `2314`\
  \ 磁盘技术，允许我们在直径仅 14 英寸的盘片上存储 30 兆。\n\n当然，我们仍然没有操作系统。没有文件系统。没有高级语言。我们只有汇编器。但我们应付过去了。\n\
  \n![Image](img/00133.jpeg)\n\n**图 A.6** Varian 620/f 小型计算机\n\n*小型计算机孤儿*\n\n我们没有尝试将整个系统挤进\
  \ 32K，而是创建了一套覆盖系统。应用程序从磁盘加载到专门的内存块中。它们在这些内存中执行，并抢占式地换回磁盘，并带有本地 RAM。\n\n当然，当你的 UI\
  \ 以每秒 30 个字符的速度运行时，你的程序会花费大量时间等待。我们有充足的时间在磁盘上进行程序交换，以保持所有终端以最快速度运行。没有人抱怨过响应时间。\n\
  \n我们编写了一个管理中断和 I/O 的抢占式内核（supervisor）。我们编写了应用程序；我们编写了磁盘驱动程序、终端驱动程序、磁带驱动程序以及系统中的其他所有内容。系统中没有一个比特不是我们编写的。尽管这是一个经历了过多的\
  \ 80 小时工作周的挣，但我们在 8 到 9 个月内让这头猛兽运转了起来。该系统的架构非常简单（图 A.7）。当一个应用程序启动时，它会产生输出直到其特定的终端缓冲区满。然后内核会将应用程序换出，并换入一个新的应用程序。内核会继续以每秒\
  \ 30 个字符滴出终端缓冲区的内容，直到它几乎为空。然后它会把应用程序换回以再次填充缓冲区。\n\n![Image](img/00134.jpeg)\n\n\
  **图 A.7** 系统架构\n\n\n\n\n这种边界是依赖正常的——也就是说，依赖*顺着*控制流方向。应用程序对管理器有编译时依赖，且控制流从应用程序传递到管理器。这种边界防止了应用程序知道输出将流向哪种设备。\n\
  \n第二种边界是依赖反转的。管理器可以启动应用程序，但对它们没有编译时依赖。控制流从管理器传递到应用程序。这种反转依赖的多态接口简单来说：每个应用程序的启动都是通过跳转到覆盖区域内完全相同的内存地址来实现的。这种边界防止了管理器获取除启动点以外的关于应用程序的任何信息。\n\
  \n# 激光修测\n\n1973 年，我加入了芝加哥的一家名为 Teradyne Applied Systems (TAS) 的公司。这是 Teradyne Inc.\
  \ 的一个部门，总部位于波士顿。我们的产品是一种系统，使用功率相对较高的激光将电子元件修测到非常精细的公差。\n\n在那个时代，制造商会将电子元件丝印在陶瓷基板上。这些基板的大小大约为\
  \ 1 英寸见方。元件通常是电阻——即阻电流流的器件。\n\n电阻的阻值取决于许多因素，包括其成分和几何形状。电阻越宽，电阻就越小。\n\n我们的系统会将陶瓷基板放置在一个带有探头的测试治架中，探头与电阻接触。系统会测量电阻的阻值，然后使用激光烧掉电阻的部分，使其变得越来越薄，直到其达到正百分之一左右的预期电阻值。\n\
  \n我们将这些系统卖给制造商。我们还使用一些内部系统为小型制造商修测规模较小批次的元件。\n\n计算机是一台 `M365`。在那个许多公司自己构建计算机的年代：Teradyne\
  \ 制造了 `M365` 并将其供应给所有部门。`M365` 是 `PDP-8` 的增强版本——那是当时一种流行的小型微型计算机。\n\n`M365` 控制定位台，定位台将陶瓷基板移动到探头下方。它控制测量系统和激光。激光通过可以在程序控制下旋转的\
  \ `X`-`Y` 镜子进行定位。计算机还可以控制激光的功率设置。\n\n`M365` 的开发环境相对原始。没有磁盘。海量存储在磁带盒上，看起来像旧式的 8 轨道音频磁带。磁带和驱动器是由\
  \ `Tri-Data` 制造的。\n\n与当时的 8 轨道音频磁带一样，磁带是环形排列的。驱动器只向一个方向移动磁带——没有倒带！如果你想将磁带定位在开头，必须将其向前发送到它的“加载点”。\n\
  \n磁带的移动速度约为每秒 1 英尺。因此，如果磁带环长 25 英尺，发送到加载点可能需要 25 秒。由于这个原因，Tridata 制造了多种长度的磁带盒，从\
  \ 10 英尺到 100 英尺不等。\n\n`M365` 前有一个按钮，可以加载一个小自引导程序到内存并执行它。该程序会从磁带读取第一块数据并执行它。通常这块数据包含一个加载器，用于加载位于磁带其余部分的操作系统。\n\
  \n操作系统会提示用户输入要运行的程序名称。这些程序存储在磁带上，紧接操作系统之后。我们会输入程序名称——例如，`ED-402 Editor`——操作系统会在磁带上搜索该程序、加载它并执行它。\n\
  \n控制台是一个带有绿色荧光字的 ASCII CRT 显示器，宽 72 个字符，高 24 行。字符全大写。\n\n要编辑程序，你需要加载 `ED-402 Editor`，然后插入存放源码的磁带。你会将该源码的一个磁带块读入内存，它会显示在屏幕上。磁带块可能包含\
  \ 50 行代码。你通过在屏幕上移动光标并以类似于 `vi` 的方式进行编辑。完成后，你会将该块写入另一盘磁带，并从源磁带上读取下一块。你持续这样做直到完成。\n\
  \n它没有回溯到之前数据块的功能。你是从头到尾按直线方式编辑程序的。回到开头会迫使你完成将源码复制到输出磁带，然后在该磁带上开始一个新的编辑会话。鉴于这些限制，这并不意外，我们将程序打印在纸上，用红色的墨水手工标记所有编辑处，然后通过参考列表上的标记来逐块地编辑我们的程序。\n\
  \n程序一旦编辑完成，我们就回到操作系统并调用汇编器。汇编器读取源码磁带并写入二进制磁带，同时在我们的数据产品线阵打印机上产生一份列表。\n\n磁带并非 100%\
  \ 可靠，所以我们总是同时写入两盘磁带。这样一来，至少有一盘有高概率没有错误。\n\n我们的程序大约有 20,000 行代码，需要近 30 分钟才能编译。在此期间遇到磁带读取错误的概率大约为\
  \ 1/10。如果汇编器遇到磁带错误，它会摇响控制台上的铃，然后在打印机上打印出一系列错误信息。你可以在整个实验室里听到这令人疯狂的铃声。你还能听到那位可怜程序员的咒骂声，因为他刚刚发现那\
  \ 30 分钟的编译必须重新开始。\n\n\n\n\n那是 20 世纪 70 年代初软件的典型。\n\n### 铝压铸监控\n\n20 世纪 70 年代中期，当欧佩（OPEC）实施石油禁运、汽油短缺导致愤怒的司机在加油站发生冲突时，我开始在奥岸海洋公司（OMC）工作。这是\
  \ Johnson 马和 Lawnboy 割草机的母公司。\n\nOMC 在伊利诺伊州的沃基根（Waukegan）拥有一个巨大的设施，为公司所有的电机和产品制造压铸铝零件。铝在巨大的熔炉中熔化，然后用大桶运送到几十台独立运行的铝压铸机上。每台机器都有一个人工操作员，负责设置模具、循环机器并提取新铸出的零件。这些操作员的工资是根据产量支付的。\n\
  \n我被聘来负责一个车间自动化项目。OMC 购买了一台 `IBM System/7`——这是 IBM 对小型机的回应。我们将这台计算机连接到车间内所有的压铸机上，这样我们就可以计数并记录每台机器的循环时间。我们的工作是收集所有信息并在\
  \ 3270 绿屏显示器上展示。\n\n使用的语言是汇编语言。而且，在这台计算机上执行的每一行代码都是我们编写的。这里没有操作系统，没有子程序库，也没有框架。它只是原始代码。\n\
  \n这还是中断驱动的实时代码。每当一台压铸机完成一次循环时，我们必须更新一批统计数据，并将消息发送到天空中的大型 `IBM 370`，它运行着一个 `CICS-COBOL`\
  \ 程序，在绿屏上显示这些统计数据。\n\n我讨厌这份工作。噢，老天，我简直太讨厌了。噢，那*工作*可真*有趣*啊！但那种文化……简单来说，我被*要求*系领带。\n\
  \n噢，我试过了。我真的尝试过。但我在那里工作显然并不愉快，我的同事也心知肚明。他们知道是因为我记不住关键日期，或者无法早早起床参加重要的会议。这是我唯一一次被开除的编程工作——而且这是我应得的。\n\
  \n从架构的角度来看，这里没什么好学的，除了一点以外。`System/7` 有一个非常有趣的指令叫做“设置程序中断”（`SPI`）。它允许你触发处理器的中断，使其能够处理任何其他队列中的低优先级中断。如今，在\
  \ Java 中，我们将其称为 `Thread.yield()`。\n\n### 4-TEL\n\n1976 年 10 月，在被 OMC 开除后，我回到了 Teradyne\
  \ 的另一个部门——我在那里呆了 12 年。我负责的产品名为 `4-TEL`。它的目的是每晚测试电话服务区内的每一条电话线，并生成一份包含所有需要维修线路的报告。它还允许电话测试人员详细测试特定的电话线路。\n\
  \n该系统起初的架构与 Laser Trim 系统相似。它是一个用汇编语言编写的单体应用，没有任何显著的边界。但在我加入公司时，情况即将发生变化。\n\n该系统由位于服务中心（SC）的测试人员使用。一个服务中心覆盖许多交换局（CO），每个交换局可以处理多达\
  \ 10,000 条线路。拨号和测量硬件必须位于交换局内部。因此，`M365` 计算机被放在了那里。我们将这些计算机称为交换局线路测试仪（COLT）。另一台 `M365`\
  \ 放在服务中心；它被称为服务区域计算机（SAC）。SAC 拥有几个调制解调器，可以拨入 COLT 并以 300 波特（30 cps）的速度通信。\n\n最初，COLT\
  \ 计算机负责一切，包括所有的控制台通信、菜单和报告。SAC 只是一个简单的复用器，接收 COLT 的输出并显示在屏幕上。\n\n这种设置的问题在于 300 cps\
  \ 真的非常慢。测试人员不喜欢看着字符在屏幕上滴滴地移动，特别是当他们只对少数关键数据位感兴趣时。而且在那个时代，`M365` 的内存非常昂贵，而程序很大。\n\
  \n解决方案是将负责拨号和测量线路的软件部分与分析结果和打印报告的部分分开。后者将移动到 SAC 中，而前者保留在 COLT 中。这将使得 COLT 变成一台更小的机器，内存也少得多，并会大大加快终端的响应速度，因为报告将在\
  \ SAC 中生成。\n\n结果非常成功。屏幕更新非常快（一旦拨通了相应的 COLT），COLT 的内存占用缩小了许多。\n\n边界非常清晰且高度解耦。SAC\
  \ 和 COLT 之间交换极短的数据包。这些数据包是极简单的 DSL 形式，代表如“拨号 XXXX”或“测量”之类的原始命令。\n\n`M365` 是从磁带加载的。那些磁带驱动器非常昂贵且不太可靠——特别是在电话交换局的工业环境中。此外，相对于\
  \ COLT 内部的其他电子设备，`M365` 是一台昂贵的机器。因此，我们启动了一个项目，用基于 `8085` 微处理器的微型计算机替换 `M365`。\n\n\
  新计算机由三个部分组成：一个带有 `8085` 的处理器板、一个带有 32K RAM 的 RAM 板，以及三块带有 12K ROM 的 ROM 板。这些 ROM\
  \ 板放入与 `M365` 相同的外壳，每块包含 12K 的只读存储。\n\n`M365` 相对于 COLT 内部的电子设备是一台昂贵的机器。这些板板带有 Intel\
  \ 2708 EPROM（可擦编程只读存储器）芯片。图 A.8 显示了这样的一个芯片。我们通过暴露紫外线来擦这些芯片。\n\n我的伙伴 CK 和将 COLT 的\
  \ `M365` 汇编程序翻译成 `8085` 汇编语言。这种翻译是手工完成的，花了大约六个月。最终结果是 30K 的 `8085` 代码。\n\n我们的开发环境有\
  \ 64K RAM 而没有 ROM，因此我们可以将编译后的二进制文件下载到 RAM 中进行测试。一旦程序运行，我们就切换到 EPROM。我们烧录 30 块芯片并将其插入\
  \ ROM 板对应的槽中。每个芯片都贴有标签，以便哪个芯片进入哪个槽。\n\n30K 程序是一个单一的 30K 长二进制文件。为了烧录芯片，我们只需将该二进制镜像分成\
  \ 30 个 1K 的段，并将每个段烧录到相应的标签芯片上。\n\n这种方法效果非常好，我们开始批量生产硬件并在现场部署系统。\n\n但软件是脆弱的。需要添加功能。需要修复错误。随着安装数量的增加，通过每次安装烧录\
  \ 30 块芯片来更新软件，以及现场服务人员在每个站点更换所有 30 块芯片，变成了一场噩梦。\n\n各种问题接踵而至。有时芯片标签贴错，或者标签掉落。有时现场服务工程师会误换错误的芯片。有时现场服务工程师会不小心弄断新芯片的引脚。因此，现场工程师随身携带所有\
  \ 30 块芯片的备用。\n\n为什么我们必须更改所有 30 块芯片？每当我们从 30K 可执行文件中添加或删除代码时，每个指令的加载地址都会改变。它还改变了我们调用的子程序和函数的地址。因此，无论变化多么微小，每一块芯片都会受到影响。\n\
  \n\n\n\n有一天，我的老板来找我，让我解决那个问题。他说我们需要一种方法，可以在不需要每次更换所有 30 块芯片的情况下修改固件。我们针对这个问题脑风暴了一段时间，然后启动了“向量化”（Vectorization）项目。这花了我三个月的时间。\n\
  \n这个想法非常简单且优雅。我们将一个 30K 的程序分成了 32 个可以独立编译的源文件，每个文件都小于 1K。在每个源文件的开头，我们告诉编译器在哪个地址加载生成的程序（例如，对于要插入到\
  \ `C4` 位置的芯片，使用 `ORG C400`）。\n\n同样，在每个源文件的开头，我们创建了一个简单的固定大小的数据结构，其中包含了该芯片上所有子程序的地址。这个数据结构长度为\
  \ 40 字节，因此最多能容纳 20 个地址。这意味着任何芯片的子程序都不能超过 20 个。\n\n接下来，我们在 RAM 中创建了一个特殊区域，称为 `vectors`。它包含\
  \ 32 个每表 40 字节的表格——这些 RAM 空间恰好足够存放每个芯片开头的指针。\n\n最后，我们将每个芯片上对每个子程序的调用更改为通过适当的 RAM\
  \ 向量进行的间接调用。\n\n当我们的处理器启动时，它会扫描每块芯片，并将每个芯片开头的向量表加载到 RAM 的 `vectors` 中。然后它会跳转到主程序。\n\
  \n这种方法效果非常好。现在，当我们修复一个 bug 或添加一个功能时，只需重新编译一两块芯片，并将这些芯片发送给现场服务工程师即可。\n\n我们让芯片实现了**独立可部署性**。我们发明了多态分发。我们发明了对象。\n\
  \n这完全是实实在在的插件架构。我们将这些芯片插进去。我们最终通过工程设计，使得通过将带有特定功能的芯片插入一个空闲插槽，就可以将该功能安装到我们的产品中。菜单控制会自动出现，与主应用程序的绑定也会自动完成。\n\
  \n当然，我们当时并不了解面向对象的原则，对如何分离用户界面与业务规则一无所知。但基础在那里，而且它们非常强大。\n\n这种方法一个意想不到的副作用是，我们可以通过拨号连接修补固件。如果我们在固件中发现\
  \ bug，可以拨通设备，并使用板载监视程序修改故障子程序的 RAM 向量，将其指向一段空 RAM。然后我们通过输入十六进制机器码，将修复后的子程序输入到该 RAM\
  \ 区域。\n\n这对我们的现场服务运营和客户来说是一个巨大的福音。如果他们遇到问题，就不需要我们寄送新芯片并安排紧急现场服务电话了。系统可以被修补，可以在下次定期的维护访问时再安装新芯片。\n\
  \n## 服务区域电脑\n\n4-TEL 服务区域电脑 (SAC) 基于一台 M365 最小型计算机。该系统通过专用调制器或拨号调制器与外外所有的 COLT 通信。它会命令这些\
  \ COLT 测量电话线路，接收原始结果，然后对这些结果进行复杂的分析，以识别并定位任何故障。\n\n### 派遣裁定\n\n该系统的经济基础之一是基于维修人员的正确分配。根据工会规定，维修人员分为三类：市交换局（central\
  \ office）、电缆（cable）和入户（drop）。交换局工人维修市交换局内部的问题。电缆工人维修连接交换局与客户的电缆机房中的问题。入户工人维修客户场所内部以及连接外部电缆到该场所的线路（即“入户线”）的问题。\n\
  \n当客户投诉问题时，我们的系统可以诊断该问题并裁定派遣哪种类型的工人。这为电话公司节省了大量资金，因为错误的派遣意味着客户的等待以及维修人员的徒劳奔波。\n\n\
  负责这种派遣裁定的代码由一个非常聪明但沟通能力极差的人设计并编写的。编写代码的过程被描述为：“三周时间在盯着天花板，两天时间的代码从他身体的每一个孔隙中涌出来——之后他就辞职了。”\n\
  \n没有人能读懂这段代码。每当我们尝试添加新功能或修复缺陷时，都会以某种方式将其搞坏。由于我们系统主要的经济效益之一就建立在这些代码之上，每个新缺陷对公司来说都是极大的尴尬。\n\
  \n最后，我们的管理层直接告诉我们把那段代码锁定，永远不要修改它。这段代码变成了**官方僵化**（officially rigid）。\n\n这段经历让我明白了良好的、整洁代码的价值。\n\
  \n#### 架构\n\n该系统是 1976 年用 M365 汇编语言编写的。这是一个大约 60,000 行的单体巨型程序。操作系统是一个基于轮询的自研非抢占式任务调度器。我们称其为\
  \ `MPS`（多处理系统）。M365 计算机没有内置栈，因此特定任务的变量存储在内存的特殊区域，并在每次上下文切换时进行交换。共享变量通过锁和信号量管理。重入性问题和竞态条件是常存在的问题。\n\
  \n设备控制逻辑或 UI 逻辑与系统的业务规则之间没有任何隔离。例如，调制器控制代码可能散布在大部分业务规则和 UI 代码中。我们没有尝试将其收集到一个模块中或抽象接口。调制器的控制是在位级别上由散布在系统各处的代码完成的。\n\
  \n终端 UI 也是如此。消息和格式控制代码没有被隔离。它们广泛分布在整个 60,000 行代码库中。\n\n我们使用的调制器模块设计为安装在 PC 板板上。我们从第三方处购买这些单元，并将它们与其他电路集成在一块可以插入我们自定义背板板的板卡上。这些单元非常昂贵。因此，在几年后，我们决定设计自己的调制器。我们在软件组里，恳求硬件设计师在控制新调制器时使用相同的位格式。我们解释说调制器控制代码已经散落在各处，我们的系统未来必须处理两种调制器。所以，我们哀求并利诱道：“请让新调制器从软件控制的角度看起来和旧调制器完全一样。”\n\
  \n但当我们拿到新调制器时，控制结构完全不同。它不仅仅有一点点不同。它是完全的、彻底的不同。\n\n感谢，硬件工程师。\n\n我们该怎么办？我们并不是简单地用新调制器替换所有旧调制器。相反，我们在系统中混合使用了新旧调制器。软件需要能够同时处理这两种调制器。难道我们注定要在代码中所有操作调制器的地方都加上标志位和特殊情况吗？那里有数百个这样的地方！\n\
  \n最后，我们选择了一个更糟糕的解决方案。\n\n特定的子程序向串口通信总线写入数据，该总线用于控制我们所有的设备，包括调制器。我们修改了该子程序，以识别旧调制器的特定位模式，并将其转换为新调制器所需的位模式。\n\
  \n这并不简单。到调制器的命令由对串口总线上段不同 IO 地址的写入序列组成。我们的“黑操作”（hack）必须按顺序解释这些命令，并使用不同的 IO 地址、时序和位位置将它们翻译成不同的序列。\n\
  \n我们让它运行了，但那是所能想象的最糟糕的黑操作。正是因为这次失败，我学会了将硬件与业务规则隔离、以及抽象接口的价值。\n\n\n\n\n## 天空中的宏大重设计\n\
  \n到了 20 世纪 80 年代，生产自己的微型计算机和计算机架构的想法开始变得过时。市场上出现了许多微型计算机，让它们运行起来比继续依赖 20 世纪 60 年代末的专用计算机架构更便宜、也更标准。这一点，加上\
  \ SAC 软件糟糕的架构，促使我们的技术管理层开始对 SAC 系统进行全面的重构。\n\n新系统将使用 `C` 语言编写，并在磁盘上使用 `UNIX` 操作系统，运行在\
  \ `Intel 8086` 微型计算机上。我们的硬件人员开始研发新的计算机硬件，一组精选的软件开发人员——“虎队小组”（The Tiger Team）被委托负责重写工作。\n\
  \n我就不会用最初那次失败的细节来让你们无聊了。可以说，第一支虎队小组在投入了两个到三年的时间在一个从未产出任何成果的软件项目后，彻底失败了。\n\n一两年后，大概是\
  \ 1982 年，流程再次启动。目标是在 `C` 语言和 `UNIX` 环境下，在我们设计的设计的性能惊人的 `80286` 硬件上，对 SAC 进行彻底且完全的重新。我们将那台计算机命名为“深思”（Deep\
  \ Thought）。\n\n这花费了好几年，接着又是几年，然后是更多年。我不知道第一个基于 `UNIX` 的 SAC 究竟何时部署的；我相信那时我已经离开了公司（1988\
  \ 年）。事实上，我完全不确定它是否真的部署过。\n\n为什么会延误？简而言之，一个重设计团队很难跟上大群活跃维护旧系统的程序员的节奏。这里只是他们遇到的困难的其中一个例子。\n\
  \n## 欧洲\n\n在 SAC 使用 `C` 语言进行重新设计的同时，公司开始向欧洲扩张业务。他们无法等待重新设计的软件完成，所以理当然，他们将旧的 `M365`\
  \ 系统部署到了欧洲。\n\n问题在于，欧洲的电话系统与美国的电话系统非常不同。工艺组织和官僚机构的也不同。因此，我们最好的程序员之一被派往英国，带领一支英国开发人员团队修改\
  \ SAC 软件，以处理所有这些欧洲问题。\n\n当然，当时没有认真尝试将这些更改整合到位于美国的软件中。这在网络技术实现跨洋传输大型代码库之前很久以前。这些英国开发人员简单地分叉了美国的代码，并根据需要对其进行修改。\n\
  \n这无疑导致了困难。大西洋两岸都发现了需要在另一侧进行修复的 漏洞。但由于模块已经发生了巨大变化，因此很难判断在美国完成的修复在英国是否有效。\n\n在经历了几年的心如火煎之后，并在安装了一条连接美国和英国办公室的高吞吐量线路后，他们进行了一次严肃的尝试，将这两个分支重新整合在一起，使差异成为一个配置问题。这次努力在第一次、第二次和第三次尝试时都失败了。这两个代码库尽管极其相似，但仍然太不同了，无法重新整合——特别是在当时瞬息万变的市场环境中。\n\
  \n与此同时，试图用 `C` 和 `UNIX` 重写一切的“虎队小组”意识到，他们也必须处理这种欧洲/美国的二元对立。当然，这对于加速他们的进度毫无帮助。\n\n\
  ## SAC 结\n\n关于这个系统，我还有很多故事可以讲给你们听，但对我来说继续说下去太令人沮丧了。可以说，我软件生涯中许多惨痛的教训是在沉浸在 SAC 糟糕的汇编代码中中学到的。\n\
  \n### C 语言\n\n我们在 `4-Tel Micro` 项目中使用的 `8085` 计算机硬件为我们提供了一个廉价的计算平台，可以用于许多嵌入到工业环境中的不同项目。我们可以为它加载\
  \ `32K` 的 `RAM` 和另一个 `32K` 的 `ROM`，并且有一套极其灵活且强大的外设控制方案。我们缺少的是一种灵活方便的语言来为这台机器编程。`8085`\
  \ 汇编语言编写代码简直一点都不有趣。\n\n此外，我们使用的汇编器是由自己的程序员编写的。它运行在我们的 `M365` 计算机上，使用“激光修边”部分描述的卡带操作系统。\n\
  \n由于命运使然，我们的首席`硬件` 工程师说服了我们的首席执行官，我们需要一台`真正的`计算机。他实际上并不知道要用它做什么，但他有很大的影响力。于是我们购买了一台\
  \ `PDP-11/60`。\n\n当时作为一名低微的软件开发人员的我喜若狂狂。我`确切地`知道用那台计算机做什么。我下定决心，这将会是`我的`机器。\n\n\
  当手册在机器交付几个月前到达时，我把它们带回家并狼吞虎咽。等计算机交付时，我已经知道如何在极其亲密的层上操作硬件和软件——至少，达到了自学所能达到的亲密程度。\n\
  \n我帮助编写了采购单。特别是，我指定了新计算机将拥有的磁盘存储。我决定我们购买两个可以容纳每个 `25 megabytes` 可移动式磁盘包的磁盘驱动器。\n\
  \n五十兆字节！这个数字似乎是无限的！我记得在深夜走在办公室的走廊里，像西方的坏巫一样咯咯大笑着：“五十兆字节！哈哈哈哈哈哈哈哈！”\n\n\n\n\n\nBOSS\
  \ 调用来阻塞任务的形式如下：\n\n```\nblock(eventCheckFunction);\n```\n\n此调用挂起了了当前任务，将 `eventCheckFunction`\
  \ 放入轮询列表，并将其与新阻塞的任务关联。随后，它在轮询循环中等待，调用轮询列表中的每个函数，直到其中一个返回 `true`。然后，与该函数关联的任务便被允许运行。\n\
  \n换句话说，正如我之前提到的，这是一个简单的非抢占式任务调度器。\n\n这款软件在之后的几年里成为了大量项目的基础。但最早的项目之一就是 pCCU。\n\n\
  ## pCCU\n\n20 世纪 70 年代后期和 80 年代初是电信公司极其动荡时期。这种动荡的来源之一就是数字化革命。\n\n在之前的一个世纪里，中央交换局与用户电话之间的连接是一对铜线。这些线被束成电缆，在整个乡村地区形成巨大的网络。它们有时被挂在电线杆上，有时则埋在地下。\n\
  \n铜是一种贵金属，电话公司拥有数吨（字面意义上的吨）铜线覆盖全国。资本投资是巨大的。通过数字连接传输电话通话，很大一部分资本可以收回。单对铜线就可以以数字形式承载数百路通话。\n\
  \n作为回应，电话公司着手将他们旧的模拟中央交换设备更换为现代数字交换机。\n\n我们的 `4-Tel` 产品测试的是铜线，而不是数字连接。尽管在数字环境中，仍然有大量的铜线，但它们比以前短得多，并且局限在用户电话附近。信号以数字形式从中央交换局传输到本地分发点，在那里，它会被转换回模拟信号，并通过标准的铜线分发给用户。这意味着我们的测量设备需要放置在铜线开始的地方，但我们的拨号设备需要留在中央交换局。问题在于，我们所有的\
  \ `COLTs` 都将拨号和测量集成在同一个设备中。（如果我们能早早几年就意识到这个显而易见的架构边界，就能省下一大笔钱！）\n\n于是，我们构思了一种新的产品架构：`CCU/CMU`（`COLT`\
  \ 控制单元和 `COLT` 测量单元）。`CCU` 位于中央交换局，处理待测电话线路的拨号。`CMU` 位于本地分发点，测量通往用户电话的铜线。\n\n问题在于，对于每个\
  \ `CCU`，都有许多 `CMUs`。关于每个号码应使用哪个 `CMU` 的信息由数字交换机本身持有。因此，`CCU` 必须询问数字交换机以确定与哪个 `CMU`\
  \ 进行通信和控制。\n\n我们向电话公司承诺，会在他们转型之前完成这种新架构的工作。我们知道他们距离转型还有几个月，甚至几年，所以我们并不感到匆。我们还知道，开发这套新的\
  \ `CCU/CMU` 硬件和软件需要几个人年的时间。\n\n### 时间表陷阱\n\n随着时间的推移，我们发现总有紧急事务要求我们推迟 `CCU/CMU` 架构的开发。我们对这个决定感到很安全，因为电话公司一直在推迟数字交换机的部署。当我们看着他们的时间表时，我们深信时间充足，于是一再再地推迟了我们的开发工作。\n\
  \n直到有一天，我老板把我叫进他的办公室说：“其中一个客户下个月要部署一台数字交换机。我们必须在那之前准备出一套可工作的 `CCU/CMU`。”\n\n我大惊失色！我们怎么可能在一个月内完成几个人年的开发工作？但我老板有一个计划……\n\
  \n事实上，我们并不需要完整的 `CCU/CMU` 架构。部署数字交换机的那家电话公司非常小。他们只有一个中央交换局，只有两个本地分发点。更重要的是，那些“本地”分发点并不特别本地。它们内部实际上装有普通的旧式模拟交换机，连接到数百个用户。更好的是，那些交换机是那种可以用普通的\
  \ `COLT` 拨号的类型。更好的是，用户的电话号码包含了决定使用哪个本地分发点的所有必要信息。如果电话号码的某个位置有 5、6 或 7，它就去分发点 1；否则，它就去分发点\
  \ 2。\n\n所以，正如我老板向我解释的那样，我们实际上不需要 `CCU/CMU`。我们需要的是在中央交换局有一简单的计算机，通过调制解调器连接到分发点的两个标准\
  \ `COLTs`。`SAC` 将与中央交换局的电脑通信，该电脑将解码号码，然后将拨号和测量指令转发到相应分发点的 `COLT`。\n\npCCU 就此诞生。\n\
  \n这是第一个用 `C` 编写并使用 `BOSS` 部署给客户的产品。我花了大约一周时间完成开发。这个故事并没有深奥的架构意义，但它为下一个项目提供了一个很好的序言。\n\
  \n## DLU/DRU\n\n20 世纪 80 年代初，我们的客户之一是德克萨斯州的一家电话公司。他们需要覆盖巨大的地理区域。事实上，这些区域大到一个服务区域就需要几个不同的办公室来派遣工人。这些办公室拥有测试技术人员，他们需要连接到我们\
  \ `SAC` 的终端。\n\n你可能认为这是一个很容易解决的问题——但记住，这个故事发生在 20 世纪 80 年代初。远程终端并不常见。糟糕的是，`SAC`\
  \ 的硬件假设所有终端都是本地的。我们的终端实际上位于一条专用的高速总线上。\n\n我们有远程终端功能，但它是基于调制解调器的，而在 80 年代初，调制解调器的速度通常限制为每秒\
  \ 300 位。客户对这种速度并不满意。\n\n高速调制解调器是有的，但它们非常昂贵，而且需要在“调过的”线路连接上运行。拨号上网质量显然不够。\n\n我们的客户要求解决方案。我们的回答是\
  \ `DLU/DRU`。\n\n`DLU/DRU` 代表“本地显示单元”（Display Local Unit）和“远程显示单元”（Display Remote\
  \ Unit）。`DLU` 是一个插入 `SAC` 机箱的计算机板卡，伪装成终端管理板。然而，它并不控制本地终端的总线，而是将字符流通过单路 9600 bps\
  \ 的调制解调器链路进行复用。\n\n`DRU` 是放置在客户远程位置的盒子。它连接到 9600 bps 链路的另一端，并具有控制我们串口总线上终端的硬件。它将来自\
  \ 9600 bps 链路的字符解复用，并发送到相应的本地终端。\n\n奇怪，不是吗？我们工程了一种如今无处不在、我们完全不会考虑的解决方案。但在那时……\n\n\
  #### 架构\n\n该系统的架构非常简单，但有一些有趣的特点我想强调一下。首先，两个单元都使用了我们的 8085 技术，且都是用 `C` 编写并使用 `BOSS`。但相似性到此为止结束。\n\
  \n这个项目我们只有两个人。我是项目负责人，Mike Carew 是我的亲密助手。我负责 `DLU` 的设计和编码；Mike 负责 `DRU`。\n\n\n\n\
  \n\n#### 架构\n\nDLU 的架构基于数据流模型。每个任务执行一个微小且专注的工作，然后通过队列将其输出传递给队列中的下一个任务。你可以将其想象成 UNIX\
  \ 中的管道与过滤器模型。该架构非常复杂：一个任务可能会填充一个由许多其他任务维护的队列；其他任务则可能填充一个仅由单个任务维护的队列。\n\n想象一下流水线。流水线上的每个位置都有一个单一、简单且高度专注的任务要执行。然后产品移动到流水线上的下一个位置。有时流水线会分成许多条线，有时这些线又会重新合并成单条线。这就是\
  \ DLU。\n\nMike 的 DRU 采用了一种截然不同的方案。他为每个终端创建一个任务，简单地在该任务中完成该终端的所有工作。没有队列，没有数据流。只有许多相同的大任务，每个任务都管理自己的终端。\n\
  \n这与流水线是相反的。在这种情况下，类比是许多专家级建筑师，每个人都建造一整个产品。\n\n在当时，我认为我的架构更优越。当然，Mike 认为他的更好。我们就此进行过许多有趣的讨论。最后，当然，两者运行得都非常出色。我由此认识到，软件架构可以完全迥异，却同样有效。\n\
  \n## VRS\n\n随着 20 世纪 80 年代的发展，新的技术不断出现。其中一项技术就是对`voice` 的计算机控制。\n\n4-Tel 系统的功能之一是技术人员能够定位电缆故障。操作步骤如下：\n\
  \n* 局端的测试员使用我们的系统来确定故障的大致距离（单位为英尺）。精度大约在 20% 以内。测试员将派遣一名电缆维修人员前往该位置附近合适的接入点。\n*\
  \ 电缆维修人员到达后，会拨打测试员电话并请求开始故障定位流程。测试员将调用 4-Tel 系统的故障定位功能。系统将开始测量该故障线路的电特性，并在屏幕上打印信息，要求执行某些操作，例如剥开电缆或短接电缆。\n\
  * 测试员告诉技术人员系统想要哪些操作，技术人员在操作完成后告诉测试员。测试员随后告诉系统操作已完成，系统继续测试。\n* 在经过两次或三次这样的交互后，系统会计算出新的故障距离。电缆维修人员随后开车前往该位置并重新开始流程。\n\
  \n想象一下，如果电缆维修人员在电线杆上或站在底座旁可以自己操作系统，会有好多少。这正是新的语音技术允许我们做的。电缆维修人员可以直接拨入我们的系统，通过拨号音调指导系统，并听用悦耳的声音读给他们听的结果。\n\
  \n### 命名\n\n公司举办了一个小比赛来为新系统命名。建议的名称中最具创意的之一是 `SAM CARP`。它代表“抑制无产阶级的资本贪婪另一种表现”（Still\
  \ Another Manifestation of Capitalist Avarice Repressing the Proletariat）。不用说，这没有被选中。\n\
  \n另一个是 Teradyne Interactive Test System。那个也未被选中。\n\n另一个是 Service Area Test Access\
  \ Network。那个也没有被选中。\n\n最终的胜者是 `VRS`：语音响应系统（Voice Response System）。\n\n#### 架构\n\n\
  我没有参与这个系统的开发，但我听说了发生的事情。我要告诉你们的故事是道道而来的，但在大多数情况下，我认为它是正确的。\n\n那是微型计算机、UNIX 操作系统、C\
  \ 语言和 SQL 数据库狂热时代。我们下心要使用所有的它们。\n\n在众多的数据库供应商中，我们最终选择了 `UNIFY`。`UNIFY` 是一个与 `UNIX`\
  \ 兼容的数据库系统，对我们来说完美。\n\n`UNIFY` 还支持一种名为“嵌入 SQL”（Embedded SQL）的新技术。这项技术允许我们将 `SQL`\
  \ 命令作为字符串直接嵌入到 `C` 代码中。我们确实这么做了——无处不在。\n\n我的意思是，可以在任何想要的地方把 `SQL` 直接放入代码，这简直太酷了。我们想放在哪里？到处！于是，`SQL`\
  \ 遍布在代码的整个主体中。\n\n当然，在那个年代，`SQL` 并不是一个稳固的标准。有很多特定供应商的特殊怪癖。因此，特殊的 `SQL` 和特殊的 `UNIFY`\
  \ API 调用也遍布在代码中。\n\n这运行效果非常棒！系统成功了。技术人员使用了它，电信公司也喜欢它。生活充满了欢笑。\n\n然后，我们使用的 `UNIFY`\
  \ 产品被取消了。\n\n噢。噢。\n\n于是我们决定切换到 `SyBase`。还是 `Ingress`？我不记得了。简单来说，我们必须搜索所有的 `C` 代码，找到所有的嵌入\
  \ `SQL` 和特殊的 API 调用，并将它们替换为对应新供应商的操作。\n\n在努力了大约三个月后，我们放弃了。我们无法让它运行。我们与 `UNIFY` 的耦合太紧密了，以至于在不付出实际成本的情况下，重构代码都没有真正的希望。\n\
  \n于是，我们聘请了一家第三方根据维护合同为我们维护 `UNIFY`。当然，维护费用一年比一年上涨。\n\n### VRS 结论\n\n这是我学到的一种方法，即数据库是细节，应该从系统的整体业务目标中隔离出来。这也是我不喜欢与第三方软件系统进行强耦合的原因之一。\n\
  \n## 电子接待员\n\n1983 年，我们的公司处于计算机系统、电信系统、语音系统的交汇点。我们的首席执行官认为，这可能是一个开发新产品的肥沃位置。为了实现这一目标，他委托一个三人的团队（包括我）来构思、设计并实现一个新产品。\n\
  \n我们没有花很长时间就想出了 `The Receptionist`（接待员）。\n\n这个想法很简单。当你拨打公司电话时，ER 会接听并询问你想找谁。你使用拨号音拼出那个人的名字，ER\
  \ 就会为你接通。当你拨打 ER 并输入 `RMART` 时，ER 会拨打我列表上的第一个号码。如果我没接听并确认身份，它会拨打下一个，以此类推。如果仍然无法联系上我，ER\
  \ 会记录拨打者的信息。\n\n然后，ER 会定期尝试找到我并传递那条信息，以及任何其他人留给我的其他信息。\n\n这是世界上第一个语音信箱系统，我们拥有它的专利。\n\
  \n我们构建了该系统所有的硬件——计算机板、内存板、语音/电信板，一切硬件。主板是我之前提到的 `Deep Thought`，Intel 80286 处理器。\n\
  \n每个语音板支持一条电话线。它们由电话接口、语音编解码器、一些内存和一个 Intel 80186 微机组成。\n\n主板的软件是用 `C` 语言编写的。操作系统是\
  \ `MP/M-86`，一种早期的命令行驱动、多处理磁盘操作系统。`MP/M` 是穷人版的 `UNIX`。\n\n语音板的软件是用汇编语言编写的，没有操作系统。`Deep\
  \ Thought` 与语音板之间的通信通过共享内存进行。\n\n\n\n\n该系统的架构在今天会被称为`面向服务`。每一条电话线都由一个运行在 `MP/M`\
  \ 下的监听进程进行监控。当来电时，会启动一个初始处理进程并将通话传递给它。随着通话从一个状态转移到另一个状态，相应的处理进程会被启动并接管控制权。\n\n消息通过磁盘文件在这些服务之间传递。当前运行的服务将决定下一个服务应该是什么；将必要的状态信息写入磁盘文件；发布启动该服务的命令行；然后退出。\n\
  \n这是我第一次构建这样一个系统。事实上，这是我第一次担任整个产品的首席架构师。所有与软件有关的事务都由我负责——而且它运行得像极了。\n\n我不会说这个系统的架构在本书所指的意义上是“整洁”的；它不是一种“插件”架构。然而，它确实显示了真实边界的迹象。服务是可以独立部署的，并存在各自的责任领域内。既有高层进程也有低层进程，许多依赖关系的方向都是正确的。\n\
  \n#### ER 的终结\n\n遗憾的是，这个产品的营销并不成功。Teradyne 是一家销售测试设备的公司。我们并不懂如何进入办公设备市场。\n\n在两年的反复尝试后，我们的\
  \ CEO 放弃了，并且不幸的是——撤回了专利申请。专利被一家在我们提交三个月后提交申请的公司拿走了；因此，我们放弃了整个语音信箱和电子转接市场。\n\n哎哟！\n\
  \n另一方面，你不能怪我那些现在困扰我们生活的烦人机器。\n\n#### CRAFT 分发系统\n\nER 作为产品已经失败了，但我们仍然拥有所有的硬件和软件，可以用来增强现有的产品线。此外，我们在\
  \ `VRS` 上的营销成功说服了我们，应该提供一种语音响应系统，与电话技师进行交互，且不依赖于我们的测试系统。\n\n于是 `CDS`——Craft Dispatch\
  \ System 诞生了。`CDS` 本质上是 ER，但专门专注于管理现场电话维修人员部署这一非常狭窄的领域。\n\n当电话线发现问题时，服务中心会创建一个工单。工单被维护在一个自动化系统中。当现场的维修人员完成一项工作后，他会拨打服务中心获取下一个任务。服务中心操作员会调出下一个工单并读给维修人员听。\n\
  \n我们着自动化这一过程。我们的目标是让现场的维修人员拨入 `CDS` 请求下一个任务。`CDS` 会查询工单系统并读出结果。`CDS` 会跟踪哪个维修人员被分配到哪个工单，并向工单系统告知维修状态。\n\
  \n该系统在与工单系统、工厂管理系统以及任何自动化测试系统交互方面有许多有趣的功能。\n\n在 ER 面向服务架构的经验让我想要更激进地尝试同样的想法。工单的状态机比处理\
  \ ER 通话的状态机要复杂得多。我开始创建现在被称为`微服务架构`的东西。\n\n任何通话的任何状态转换，无论多么微不足道，都会导致系统启动一个新的服务。事实上，状态机被外部化到了一个系统读取的文本文件中。从电话线进入系统的每个事件都会转变为该有限状态机中的一次转换。现有进程将根据状态机的指示启动新进程来处理该事件；然后现有进程将退出或在队列上等待。\n\
  \n这种外部化的状态机允许我们在不更改任何代码的情况下更改应用程序的流（开闭原则）。我们可以轻松地添加新服务，而不依赖于其他任何服务，并通过修改包含状态机的文本文件将其接入流程中。我们甚至可以在系统运行期间此操作。换句话说，我们拥有`热插拔`和有效的\
  \ `BPEL`（业务过程执行语言）。\n\n旧 ER 使用磁盘文件在服务之间通信的方法对于这种更快速的服务切换来说太慢了，因此我们发明了一种称为 `3DBB`\
  \ 的共享内存机制。`3DBB` 允许通过名称访问数据；我们使用的名称是分配给每个状态机实例的名称。\n\n`3DBB` 非常适合存储字符串和常量，但不能用于持有复杂的数据结构。其原因是技术性的但容易理解。`MP/M`\
  \ 中的每个进程都运行在自己的内存分区中。指向一个内存分区数据的指针在另一个内存分区没有意义。因此，`3DBB` 中的数据不能包含指针。字符串没问题，但树、链表或任何带有指针的数据结构都不行。\n\
  \n工单系统中的工单来自许多不同的来源。有些是自动的，有些是手动的。手动条目是由与客户交流问题的操作员创建的。当客户描述问题时，操作员会在结构化文本流中输入他们的投诉和观察。看起来像这样：\n\
  \n```\n/pno 8475551212 /noise /dropped-calls\n```\n\n你明白意思了。`/` 字符启动了一个新主题。斜杠后面是代码，代码后面是参数。有数千个代码，单个工单的描述中可能有几十个。更糟糕的是，由于它们是手动输入的，它们经常拼写错误或格式不正确。它们是为了人类解释而设计的，而不是为了让机器处理。\n\
  \n我们的问题是解码这些半自由字符串，解释并修复任何错误，然后将其转换为语音输出，以便我们可以读给在电线杆上的维修人员听。这需要非常灵活的解析和数据表示技术。\n\
  \n#### CLEAR COMMUNICATIONS\n\n1988 年，一群 Teradyne 员工离开公司成立名为 Clear Communications\
  \ 的初创公司。我在几个月后加入了他们。我们的任务是为一套系统开发软件，监控 T1 线的通信质量——这些线路是跨国长途通信的数字线路。愿景是一个巨大的显示器，上面有美国地图，交叉分布的\
  \ T1 线，如果线路恶化则会闪烁红色。\n\n记住，在 1988 年图形用户界面是全新的。Apple Macintosh 才出生五年。Windows 在那时是个笑话。但\
  \ Sun Microsystems 正在构建具有可靠 X-Windows GUI 的 Sparcstations。所以我们选择了 Sun——因此选择了 C 和\
  \ UNIX。\n\n\n\n\n这是一家初创公司。我们每周工作 70 到 80 小时。我们有愿景。我们有动力。我们有意志。我们有能量。我们有专业知识。我们有股权。我们有百万翁梦。我们满口胡言。\n\
  \nC 代码从我们身体的每一个孔隙涌出。我们把它塞到这里，推到那里。我们在空中构筑了巨大的城堡。我们有流程、有消息队列，还有宏大且极佳的架构。我们从零开始编写了一个完整的七层\
  \ ISO 通信栈——一直到数据链路层。\n\n我们写了 GUI 代码。粘糊糊的代码（GOOEY CODE）！天哪！我们写了超级粘糊糊的代码。\n\n我个人写了一个名为\
  \ `gi()` 的 3000 行 C 函数；它的名字代表图形解释器（Graphic Interpreter）。那是胶质代码的一件杰作。这不是我在 Clear\
  \ 公司写的唯一垃圾代码，但它是我最臭名昭著的一个。\n\n## 架构？你在开玩笑吗？这是一家初创公司。我们没时间搞架构。写代码吧，该死的！为了你们的命写代码！\n\
  \n于是我们写代码。一直在写。一直写。但是，在三年后，我们失败的是卖掉公司。噢，我们确实有一两个安装用户。但市场对我们宏大的愿景并不特别感兴趣，我们的风险投资人也变得非常厌烦。\n\
  \n那时我痛恨了自己的生活。我眼睁睁看着我所有的努力和梦想崩塌。我在工作中冲突，因为工作在家里产生冲突，还与自己冲突。\n\n然后，我接了一个改变一切的电话。\n\
  \n## 铺垫\n\n在那个电话之前的两年前，发生了两件意义意义。\n\n首先，我成功地与一家附近的公司建立了 `uucp` 连接，那家公司通过 `uucp`\
  \ 连接到另一个接入了互联网的设施。当然，这些连接都是拨号上网。我们的主 Sparcstation（我办公桌上的那台）使用一个 1200-bps 的调制调器每天拨打两次我们的\
  \ `uucp` 主。这让我们有了电子邮件和 Netnews（一个人们讨论有趣话题的早期社交网络）。\n\n其次，Sun 发布了 C++ 编译器。我从 1983\
  \ 年起就对 C++ 和面向对象（OO）感兴趣，但编译器很难获得。所以当机会出现时，我立刻切换了语言。我抛下了那 3000 行的 C 函数，在 Clear 开始编写\
  \ C++ 代码。我学习了……\n\n我读了书。当然，我读了 Bjarne Stroustrup 写的《C++ 编程语言》（*The C++ Programming\
  \ Language*）和《C++ 参考手册》（*The Annotated C++ Reference Manual*，*The ARM*）。我读了 Rebecca\
  \ Wirfs-Brock 那本关于责任驱动设计的优秀书籍：《面向对象软件设计》（*Designing Object Oriented Software*）。我读了\
  \ Peter Coad 写的 *OOA*、*OOD* 和 *OOP*。我读了 Adele Goldberg 写的《*Smalltalk-80*》。我读了 James\
  \ O. Coplien 写的《高级 C++ 编程风格与惯用法》（*Advanced C++ Programming Styles and Idioms*）。但也许最重要的，是我读了\
  \ Grady Booch 写的《面向应用的面向对象设计》（*Object Oriented Design with Applications*）。\n\n多么伟的名字！Grady\
  \ Booch。谁能忘记这样的名字呢。而且，他还是一家叫 Rational 的公司的首席科学家！我多么想成为首席科学家啊！于是我读了他的书。我学习了，学习了，学习了……\n\
  \n随着我的学习，我也开始在 Netnews 上辩论，就像现在人们在 Facebook 上辩论一样。我的辩论是关于 C++ 和面向对象的。两年里，我通过在 Usenet\
  \ 上与数百人辩论最佳语言特性和最佳设计原则，缓解了工作中积压的挫败感。一段时间后，我甚至开始说一些有些道理的话。\n\n就在在那些辩论中的，SOLID 原则的基础被奠定了。\n\
  \n而所有这些辩论，也许还有其中的一些道理，引起了我的关注……\n\n## 鲍伯叔\n\nClear 的工程师中有一个叫 Billy Vogel 的年轻人。Billy\
  \ 给每个人都起起了外号。他叫我“鲍伯叔”（Uncle Bob）。我怀疑，尽管我的名字确实叫 Bob，但他是在随口提到了 J. R. “Bob” Dobbs（参见\
  \ [`en.wikipedia.org/wiki/File:Bobdobbs.png`](https://en.wikipedia.org/wiki/File:Bobdobbs.png)）。\n\
  \n起初我忍了。但随着时间的推移，在初创公司的压力和失望背景下，他没完没了的“鲍伯叔……鲍伯叔”开始消磨我的耐心。\n\n然后，某一天，电话响了。\n\n##\
  \ 电话\n\n是一个猎头。他听说了我的名字，说我是一个懂 C++ 和面向对象设计的人。我不确定是怎么知道的，但我怀疑与我在 Netnews 上的活跃有关。\n\
  \n他说他在硅谷的一家叫 Rational 的公司有一个机会。他们正在寻找帮助来构建一个 CASE 工具。\n\n我的脸色变了。我知道这是怎么了。我不知道为什么知道的，但我知道。这是\
  \ Grady Booch 的公司。我从眼前看到了与 Grady Booch 合作的机会！\n\n## ROSE\n\n我于 1990 年以合同程序员的身份加入了\
  \ Rational。我当时正在开发 ROSE 产品。这是一个允许程序员绘制 Booch 图（Buch diagrams）的工具——Grady 在《面向应用的面向对象分析与设计》（*Object-Oriented\
  \ Analysis and Design with Applications*）中写过这些图（图 A.9 显示了一个示例）。\n\n![Image](img/0013.jpeg)\n\
  **图 A.9** Booch 图\n\nBooch 记法非常强大。它预示了 UML。\n\nROSE 是一个巨大的 C++ 应用程序。它由层组成，并有严格执行的依赖规则。那个规则并不是我在书中描述的那个规则。我们没有将依赖指向高层策略。相反，我们将依赖指向了更传统的流控制方向。GUI\
  \ 指向表示层，表示层指向操作规则，操作指向数据库。最终，正是这种没有将依赖指向策略的失败，导致了该产品最终的终结。\n\n## 辩论持续\n\n当然，我没有停止在\
  \ Netnews 上辩论。事实上，我大幅增加了我在网络上的活跃度。我开始为《C++ Report》写文章。而且，在 Grady 的帮助下，我开始写我的第一本书：《使用\
  \ Booch 方法设计面向对象的 C++ 应用程序》（*Designing Object-Oriented C++ Applications Using the\
  \ Booch Method*）。\n\n有一件事困扰着我。这看起来很反常，但却是事实。没有人叫我“鲍伯叔”。我发现我很怀念它。于是我犯了一个错误，在我的电子邮件和\
  \ Netnews 签名中加入了“鲍伯叔”。这个名字就留了下来。最终我意识到这是一个非常好的品牌。\n\nROSE 的架构\n\nROSE 的架构类似于一个优秀编译器的架构。图形记法被“解析”为内部表示；该表示随后通过规则进行处理并存储在面向对象的数据库中。\n\
  \n面向对象数据库是一个相对较新的概念，面向对象的世界对其影响议论扬扬。每个面向对象的程序员都想在自己的系统中拥有面向对象的数据库。这个想法相对简单，且充满理想主义。数据库存储的是对象而不是表格。数据库应该看起来像内存。当你访问一个对象时，它就会出现在内存中。如果该对象指向另一个对象，那么当你访问该对象时，另一个对象也会出现在内存中。这就像魔法一样。\n\
  \n那个数据库可能是我们最大的实践错误。我们想要魔法，但得到的却巨大的、缓慢的、具有侵入性的且昂贵的第三方框架，它通过在几乎每一个层面上阻碍我们的进展，让我们的生活变得像地狱一样。\n\
  \n\n\n\n那个数据库并不是我们犯下的唯一错误。事实上，最大的错误是过度架构。它的层级比我在这里描述的要多得多，而且每一层都有自己的通信开销。这显著降低了团队的生产力。\n\
  \n事实上，在经历了多年的工作、艰艰的斗争以及两次冷平平的发布后，整个工具被废弃了，并被一个由威斯康星州的一个小团队编写的可爱小应用程序所取代。\n\n因此我学到，伟架构有时会导致巨大的失败。架构必须足够灵活，以适应问题的大小。当你真正只需要一个可爱的小桌面工具时，却为企业级进行架构设计，那是失败的方程式。\n\
  \n## 建筑师注册考试\n\n在 20 世纪 90 年代初，我成为了一名真正的顾问。我环游世界，教人们什么是这种新的面向对象（OO）事物。我的咨询重点主要是面向对象系统的设计和架构。\n\
  \n我的首批咨询客户之一是教育测试服务（`ETS`）。它与美国建筑师注册委员会（`NCARB`）签约，负责为新建筑师候选进行注册考试。\n\n任何想在美国或加拿大成为注册建筑师（即设计建筑的人）的人都必须通过注册考试。这项考试涉及让候选人解决若干涉及建筑设计的建筑问题。候选人可能会被给一组关于公共图书馆、餐厅或教堂的需求，然后被要求画出相应的建筑图纸。\n\
  \n考试结果将被收集并保存，直到一组资深建筑师聚在一起担任评审对提交的作品进行评分。这些聚会是规模大且昂贵的活动，也是许多模糊性和延迟的根源。\n\n`NCARB`\
  \ 希望通过让候选人使用计算机考试来自动化这一过程，然后让另一台计算机进行评估和评分。`NCARB` 要求 `ETS` 开发该软件，而 `ETS` 雇佣了我组建一个开发团队来生产该产品。\n\
  \n`ETS` 将问题拆分为 18 个独立的测试场景（vignettes）。每个场景都需要一个类似 CAD 的 GUI 应用程序，候选人用它来表达自己的解决方案。一个独立的评分程序将接收解决方案并产生分数。\n\
  \n我的伙伴 Jim Newkirk 和我意识到，这 36 个应用程序具有巨大的相似性。18 个 GUI 应用程序都使用了相似的手势和机制。18 个评分程序都使用了相同的数学技术。鉴于这些共同的元素，Jim\
  \ 和我决定为所有 36 个应用程序开发一个可重用的框架。事实上，我们通过这种方式向 `ETS` 推销了这一想法：我们会花很长时间开发第一个应用程序，但剩下的部分每隔几周就会“蹦”出来。\n\
  \n到这里，你应该在拍额头或者用头撞这这书了。你们中年龄足够大的话可能还记得面向对象所谓的“重用”承诺。在当时，我们都深信，只要你写出良好的、整洁的面向对象 `C++`\
  \ 代码，你自然就会产生大量的大量的可重用代码。\n\n于是，我们开始编写第一个应用程序——它是这组中最复杂的一个。它被称为 `Vignette Grande`。\n\
  \n我们两个全职工作于 `Vignette Grande`，目标是创建一个可重用的框架。我们花了一年的时间。在那年年底，我们有了 45,000 行框架代码和 6,000\
  \ 行应用程序代码。我们将该产品交付给 `ETS`，他们与我们签约，尽快编写剩下的 17 个应用程序。\n\n于是 Jim 和我招募了一个由另外三名开发人员组成的团队，开始处理接几个场景。\n\
  \n但出问题了。我们发现我们创建的可重用框架并不特别可重用。它无法很好地融入正在编写的新应用程序。存在一些微妙的摩擦，导致运行不畅。\n\n这非常令人沮丧，但我们认为知道该怎么办。我们去\
  \ `ETS` 告诉他们会有延迟——那 45,000 行的框架需要重写，或者至少需要重新调整。我们告诉他们还需要一段时间才能完成。\n\n我不用告诉你们 `ETS`\
  \ 对这个消息并不特别高兴。\n\n于是我们重新开始。我们把旧的框架放在一边，开始同时编写四个新场景。我们会从旧框架中借用想法和代码，但会对它们进行重新加工，以便它们在不作修改的情况下适配所有四个程序。这项工作又花了一年时间。它产生了另一个\
  \ 45,000 行的框架，加上四个每个大约 3,000 到 6,000 行的场景程序。\n\n不用说，GUI 应用程序与框架之间的关系遵循 `Dependency\
  \ Rule`（依赖规则）。场景是框架的插件。所有的高层 GUI 策略都在框架中。场景代码只是胶水。\n\n评分程序与框架之间的关系稍微复杂一点。高层评分策略在场景中。评分框架插件到评分场景中。\n\
  \n当然，这两个应用程序都是静态链接的 `C++` 应用程序，所以我们的脑海中完全没有“插件”的概念。然而，依赖关系的运行方式与 `Dependency Rule`\
  \ 是一致的。\n\n在交付那四个应用程序后，我们开始接下来的四个。这一次，它们确实如我们预测的那样，每隔几周就从后端出一个。延迟导致我们的进度损失了近一年的时间，因此我们又雇佣了一个程序员来加速过程。\n\
  \n我们履行了日期和承诺。我们的客户很满意。我们也很开心。生活很美好。\n\n但我们学到了一个教训：在你先制作出一个可用的框架之前，你无法创建一个可重用的框架。可重用的框架要求你与*几个*可重用的应用程序共同构建它们。\n\
  \n## 结\n\n正如我在开头所说的，这个附录在某种程度上是自传性的。我列出了认为对架构有影响的项目亮点。当然，我也提到了一些与本书技术内容无关但很有意义的事件。\n\
  \n当然，这只是部分历史。在几十年里，我参与了许多其他项目。我也特意将这段历史停在 20 世纪 90 年代初——因为我还有本关于 90 年代后期的书要写。\n\n\
  我希望你们喜欢这段怀旧之旅；并希望你们能在此途中学到一些东西。\n\n关于 `ASC` 那台特定机器的传闻之一是，它是在一个大型半挂式卡车上和家具一起运输的。在途中，卡车以高速撞击了一座桥。电脑本身没坏，但它向前滑动并将家具撞成了碎片。\n\
  \n今天，我们会说它的时钟频率是 `142 kHz`。\n\n想象一下那个磁盘的质量。想象一下它的动能！有一天，我们看到金属屑从机柜按钮处掉。我们联系了维护人员。他建议我们关闭设备。当他来修理时，他说一个轴承磨损了。然后他告诉我们一些故事，这些磁盘如果不修理，可能会脱离固定，撞过混凝土墙，并嵌入停车场的汽车里。\n\
