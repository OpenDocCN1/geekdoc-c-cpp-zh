  \n`Main` 组件是终极细节——最底层的策略。它是系统的初始入口点。除了操作系统之外，没有任何东西依赖于它。它的工作是创建所有的 `Factories`、`Strategies`\
  \ 以及其他全局设施，然后将控制权交给系统的高抽象部分。\n\n正是在这个 `Main` 组件中，应该由依赖注入框架注入依赖。一旦这些依赖被注入到 `Main`\
  \ 中，`Main` 应该正常地分发这些依赖，而不使用该框架。\n\n将 `Main` 视为所有肮脏组件中最脏的一个。\n\n考虑下面这个来自最新版本《捕逐恶兽》（Hunt\
