  \ 中，`Main` 应该正常地分发这些依赖，而不使用该框架。\n\n将 `Main` 视为所有肮脏组件中最脏的一个。\n\n考虑下面这个来自最新版本《捕逐恶兽》（Hunt\
  \ the Wumpus）的 `Main` 组件。注意它是如何加载所有我们不希望代码主体知道的字符串的。\n\n点击此处查看代码图像\n\n```java\n\
  public class Main implements HtwMessageReceiver {\n\n  private static HuntTheWumpus\
  \ game;\n\n  private static int hitPoints = 10;\n\n  private static final List<String>\
  \ caverns = new ArrayList<>();\n\n  private static final String[] environments =\
  \ new String[]{\n    \"bright\",\n    \"humid\",\n    \"dry\",\n    \"creepy\",\n\
  \    \"ugly\",\n    \"foggy\",\n    \"hot\",\n    \"cold\",\n    \"drafty\",\n \
  \   \"dreadful\"\n  };\n\n  private static final String[] shapes = new String[]\
  \ {\n    \"round\",\n    \"square\",\n    \"oval\",\n    \"irregular\",\n    \"\
  long\",\n    \"craggy\",\n    \"rough\",\n    \"tall\",\n    \"narrow\"\n  };\n\n\
  \  private static final String[] cavernTypes = new String[] {\n    \"cavern\",\n\
  \    \"room\",\n    \"chamber\",\n    \"catacomb\",\n    \"crevasse\",\n    \"cell\"\
  ,\n    \"tunnel\",\n    \"passageway\",\n    \"hall\",\n    \"expanse\"\n  };\n\n\
  \  private static final String[] adornments = new String[] {\n  \"smelling of sulfur\"\
  ,\n  \"with engravings on the walls\",\n  \"with a bumpy floor\",\n  \"\",\n  \"\
  littered with garbage\",\n  \"spattered with guano\",\n  \"with piles of Wumpus\
  \ droppings\",\n  \"with bones scattered around\",\n  \"with a corpse on the floor\"\
  ,\n  \"that seems to vibrate\",\n  \"that feels stuffy\",\n  \"that fills you with\
  \ dread\"\n  };\n```\n\n27\n\nSERVICES: GREAT AND SMALL\n\n![Image](img/00098.jpeg)\n\
  \nService-oriented “architectures” and micro-service “architectures” have become\
  \ very popular of late. The reasons for their current popularity include the following:\n\
  \n- Services seem to be strongly decoupled from each other. As we shall see, this\
  \ is only partially true.\n- Services appear to support independence of development\
  \ and deployment. Again, as we shall see, this is only partially true.\n\n### SERVICE\
  \ ARCHITECTURE?\n\nFirst, let’s consider the notion that using services, by their\
  \ nature, is an architecture. This is patently untrue. The architecture of a system\
  \ is defined by boundaries that separate high-level policy from low-level detail\
  \ and follow the Dependency Rule. Services that simply separate application behaviors\
  \ are little more than expensive function calls, and are not architecturally significant.\n\
  \nThis is not to say that all services *should* be architecturally significant.\
  \ There are often substantial benefits to creating services that separate functionality\
  \ across processes and platforms—whether they obey the Dependency Rule or not.\n\
  \nA helpful analogy is the organization of functions. The architecture of a monolithic\
  \ or component-based system is defined by certain function calls that cross architectural\
  \ boundaries and follow the Dependency Rule. Many other functions in those systems,\
  \ however, simply separate one behavior from another and are not architecturally\
  \ significant.\n\nSo it is with services. Services are, after all, just function\
  \ calls across process and/or platform boundaries. Some of those services are architecturally\
  \ significant, and some aren’t. Our interest, in this chapter, is with the former.\n\
  \n### SERVICE BENEFITS?\n\n\n\n\n\n前一个标题中的问号表示，本节将挑战当前服务架构的流行正统观点。让我们逐一探讨这些优点。\n\
  \n## 解耦的谬误\n\n将系统拆分为多个服务，其所谓的巨大优点之一是服务之间是强解耦的。毕竟，每个服务都运行在不同的进程中，甚至在不同的处理器上；因此，这些服务无法访问彼此的变量。此外，每个服务的接口都必须良好定义。\n\
  \n这确实有一定道理——但事实并不完全如此。是的，服务在单个变量层面上是解耦的。然而，它们仍然可能通过处理器内部或网络上的共享资源而耦合在一起。此外，它们通过所共享的数据是强耦合的。\n\
  \n例如，如果一个在服务间传递的数据记录中添加了新字段，那么每个操作该新字段的服务都必须进行更改。这些服务还对该字段中数据的解释达成强共识。因此，这些服务与数据记录是强耦合的，从而间接地与彼此耦合在一起。\n\
  \n至于接口必须良好定义，这确实是真的——但对于函数来说同样如此。服务的接口并不比函数接口更正式、更严谨，或定义得更好。显然，这种优点在某种程度上是一种幻觉。\n\
  \n## 独立开发与部署的谬误\n\n服务的另一个所谓优点是它们可以由专门的团队拥有和运营。该团队可以作为 devOps 策略的一部分，负责服务的编写、维护和运行。这种开发和部署的独立性被认为是`可扩展的`。人们认为，大型企业系统可以由几十、数百甚至数千个可以独立开发和部署的服务构建。系统的开发、维护和运行可以分配给相应数量的独立团队。\n\
  \n这种信念有其事实性依据——但仅是部分。首先，历史证明，大型企业系统既可以通过单体架构和基于组件的系统构建，也可以通过基于服务的系统构建。因此，服务并不是构建可扩展系统的唯一选择。\n\
  \n其次，解耦的谬误意味着服务并不能总是独立地进行开发、部署和运行。在它们由于数据或行为而耦合的范围内，开发、部署和运行必须进行协调。\n\n## 小猫问题\n\
  \n为了给这两个谬误提供例说明，让我们再次看看我们的出租车聚合系统。记住，这个系统了解特定城市内的许多出租车供应商，并允许客户订车。假设客户根据多项标准选择出租车，例如接送时间、成本、豪华程度和司机经验。\n\
  \n我们希望系统具有可扩展性，因此我们选择由许多小型微服务构建它。我们将开发人员细分为许多小小组，每个小组负责开发、维护和运行相应数量的服务。\n\n`图 27.1`\
  \ 中的图显示了我们的虚构架构师如何安排服务来实现此应用程序。`TaxiUI` 服务处理客户，他们使用移动设备订购车。`TaxiFinder` 服务检查各种 `TaxiSuppliers`\
  \ 的库存，并确定哪些出租车是用户的可能候选。它将这些候选者存入附加到该用户的短期数据记录中。`TaxiSelector` 服务根据用户的成本、时间、豪华程度等标准，从候选者中选择出合适的出租车。它将该出租车移给\
  \ `TaxiDispatcher` 服务，由后者来订购合适的出租车。\n\n![Image](img/00099.jpeg)\n\n**图 27.1** 为实现出租车聚合系统的服务安排\n\
  \n现在，假设该系统已经运行了一年多。我们的开发者团队在维护和运行所有这些服务的同时，愉快地开发着新功能。\n\n在一个明朗欢快的日子里，营销部门与开发团队举行了会议。在会议上，他们宣布了向该城市提供小猫送货服务的计划。用户可以订购小猫送到家中或办公场所。\n\
  \n公司将在市内设置几个小猫收集点。当小猫订单产生时，将选择一辆附近的出租车从其中一个收集点接走小猫，然后将其送到相应的地址。\n\n其中一个出租车供应商已同意参加此计划。其他可能会效仿。另一些可能会拒绝。\n\
  \n当然，某些司机可能对猫过敏，因此这些司机绝不被选择用于这项服务。此外，某些客户无疑也有类似的过敏反应，因此在过去 3 天内用于送过小猫的车辆不应被分配给声明此类过敏的客户。\n\
  \n看看那个服务图。为了实现这个功能，有多少个服务需要更改？全部都要。显然，小猫功能的开发和部署必须经过仔细的协调。\n\n换句话说，所有服务都是耦合的，无法独立地进行开发、部署和维护。\n\
  \n这就是交叉关注点的问题。每个软件系统（无论是否面向服务）都必须面对这个问题。像 `图 27.1` 服务图中所示的功能分解，非常容易受到跨越所有这些功能行为的新功能的影响。\n\
  \n## 对象的救星\n\n在基于组件的架构中，我们将如何解决这个问题？对 SOLID 设计原则的仔细考虑将促使我们创建一组类，这些类可以通过多态扩展来处理新功能。\n\
  \n`图 27.2` 显示了该策略。此图中的类大致对应于 `图 27.1` 中的服务。然而，请注意边界。还要注意依赖关系遵循依赖规则（Dependency Rule）。\n\
  \n原始服务的大部分逻辑保留在对象模型的基类中。然而，特定于租车的逻辑部分已提取到 `Rides` 组件中。小猫的新功能被放置在 `Kittens` 组件中。这两个组件使用模板方法或策略等模式重写了原始组件中的抽象基类。\n\
  \n再次注意，这两个新组件 `Rides` 和 `Kittens` 遵循依赖规则。还要注意实现这些功能的类是由 UI 控制的工厂创建的。\n\n显然，在这种方案，当实现小猫功能时，`TaxiUI`\
  \ 必须更改。但其他地方不需要更改。相反，系统中添加了一个新的 jar 文件、Gem 或 DLL，并在运行时动态加载。\n\n因此，小猫功能是解耦的，并且可以独立开发和部署。\n\
  \n![Image](img/00100.jpeg)\n\n**图 27.2** 使用面向对象的方法处理交叉关注点\n\n### 组件化服务\n\n明显的问题是：我们能对服务也这样做吗？答案自然是：可以！服务不需要是微型单体。相反，服务可以使用\
  \ SOLID 原则进行设计，并赋予组件结构，以便在不更改服务内现有组件的情况下向其添加新组件。\n\n\n\n\n将 Java 中的服务想象成一个或多个 jar\
  \ 文件中的一组抽象类。将每个新功能或功能扩展想象成另一个 jar 文件，它包含了扩展第一个 jar 文件中抽象类的类。这样一来，部署新功能就不再是重新部署服务的问题，而是简单地将新的\
  \ jar 文件添加到这些服务的类加载路径（load paths）中即可。换句话说，添加新功能符合开闭原则。\n\n图 27.3 中的服务图展示了这种结构。服务仍然像一样存在，但每个服务都有自己的内部组件设计，允许将新功能作为新的派生类添加。这些派生类存在于自己的组件中。\n\
  \n![Image](img/00101.jpeg)\n\n**图 27.3** 每个服务都有自己的内部组件设计，能够将新功能作为新的派生类进行添加\n\n##\
  \ 横切关注点\n\n我们学到的是，架构边界并不存在于服务之间。相反，这些边界穿过服务，将它们分为组件。\n\n为了处理所有重要系统都会面临的横切关注点，服务必须具有遵循依赖规则（Dependency\
  \ Rule）的内部组件架构，如图 27.4 中的图所示。这些服务并没有定义系统的架构边界；相反，服务内部的组件定义了边界。\n\n![Image](img/00102.jpeg)\n\
  \n**图 27.4** 服务必须设计遵循依赖规则的内部组件架构\n\n## 结论\n\n尽管服务对系统的可扩展性和开发性非常有用，但它们本身并不是架构上具有意义的元素。系统的架构是由该系统内部划分的边界以及跨越这些边界的依赖关系定义的。这种架构并不是由元素通信和执行的物理机制定义的。\n\
  \n一个服务可能是一个组件，完全被架构边界包围。或者，一个服务可能由几个被架构边界隔离的组件组成。在少数^(2)情况下，客户端和服务的耦合程度可能高到完全没有任何架构意义。\n\
  \n1。因此，微服务的数量大致等于程序员的数量。\n\n2。我们希望这种情况是罕见的。不幸的是，经验表明事实并非如此。\n\n## 28 测试边界\n\n![Image](img/00103.jpeg)\n\
  \n是的，没错：*测试是系统的一部分*，它们像系统的其他任何部分一样参与到架构中。在某些方面，这种参与是非常正的；在另一些方面，它可能非常独特。\n\n###\
  \ 作为系统组件的测试\n\n对于测试存在很多困惑。它们是系统的一部分吗？它们是系统分离的吗？有哪些种测试？单元测试和集成测试是不同的东西吗？验收测试、功能测试、Cucumber\
  \ 测试、TDD 测试、BDD 测试、组件测试等等又是怎样的？\n\n本书的角色不是卷入于这些特定的争论，幸运的是，这也没有必要。从架构的角度来看，所有的测试都是相同的。无论是\
  \ TDD 创建的微小测试，还是大型的 FitNesse、Cucumber、SpecFlow 或 JBehave 测试，它们在架构上是等价的。\n\n测试根据其本质遵循依赖规则；它们非常详细且具体；并且它们总是向内依赖被测试的代码。事实上，你可以将测试看作架构中最外层的一圈。系统内部没有任何东西依赖于测试，而测试总是向内依赖于系统的组件。\n\
  \n测试也是可以独立部署的。事实上，大多数时候它们被部署在测试系统中，而不是生产系统中。因此，即使在那些其他方面并不需要独立部署的系统中，测试仍然会被独立部署。\n\
  \n测试是最孤立的系统组件。它们对于系统运行并不是必须的。没有用户依赖它们。它们的作用是支持开发，而不是运行。然而，它们作为系统组件并不亚于任何其他。事实上，在许多方面，它们代表了所有其他系统组件应该遵循的模型。\n\
  \n### 可测试性设计\n\n测试的极端孤立，加上它们通常不被部署的事实，经常导致开发者认为测试处于系统设计之外。这是一个是灾难性的观点。没有良好集成到系统设计中的测试往往是脆弱的，它们会使系统变得僵硬且难以更改。\n\
  \n当然，问题在于耦合。与系统强耦合的测试必须随系统一起改变。即使是对系统组件进行最微小的更改，也可能导致许多耦合的测试崩溃或需要更改。\n\n这种情况可能会变得严峻。对常用系统组件的更改会导致数百甚至数千个测试失败。这被称为*脆弱测试问题*（Fragile\
  \ Tests Problem）。\n\n并不难理解这种情况是如何发生的。想象例如，有一组使用 GUI 来验证业务规则的测试套件。此类测试可能从登录界面开始，然后通过页面结构导航，直到能够检查特定的业务规则。登录页面或导航结构的任何更改都可能导致大量的测试失败。\n\
  \n脆弱的测试往往会产生适得其反的效果，使系统变得僵硬。当开发者意识到对系统的简单更改会导致大规模的测试失败时，他们可能会抵抗进行这些更改。例如，想象开发团队与营销团队之间的对话，后者请求对页面导航进行简单更改，结果会导致\
  \ 1000 个测试失败。\n\n解决方案是为了可测试性设计。软件设计的第一个规则——无论是为了测试性还是其他原因——始终相同：*不要依赖易变物*。GUI 是易变的。通过\
  \ GUI 操作系统的测试套件*一定是脆弱的*。\n\n### 测试 API\n\n实现这一目标的方法是创建一个特定的 API 来验证业务规则。该 API 应该具有特殊能力，允许测试避免安全限制、跳过昂贵的资源（如数据库），并强制系统进入特定的测试状态。该\
  \ API 将是用户界面所使用的交互器（interactors）和接口适配器（interface adapters）套集的超集。\n\n测试 API 的目的是使测试与应用程序解耦。这种解耦不仅仅是与\
  \ UI 分离：目标是使测试的*结构*与应用程序的*结构*解耦。\n\n#### 结构耦合\n\n\n\n这种演进的分离是必要的，因为随着时间的推移，测试往往会变得越来越具体和特殊。相比之下，生产代码往往倾向于变得越来越抽象和通用。强结构耦合阻止了——或至少阻碍了——这种必要的演进，并防止生产代码达到其应有的通用性和灵活性。\n\
  \n## 安全\n\n如果将测试 API 的强大功能部署在生产系统中，它们可能是危险的。如果你对此有担忧，那么测试 API 及其实现中危险的部分应该保留在一个独立的、可部署的组件中。\n\
  \n## 结论\n\n测试并非位于系统之外；相反，它们是系统的一部分，如果它们想要提供稳定性和回归等预期的收益，就必须经过良好的设计。没有作为系统的一部分进行设计的测试往往是脆弱且难以维护的。这类测试通常会掉落在维护室的地板上——因为太难以维护而被丢弃。\n\
  \n## 第 29 章 清洁的嵌入式架构\n\n![图像](img/00104.jpeg)\n\n*作者：James Grenning*\n\n不多以前，我在\
  \ Doug Schmidt 的博客上读了一篇题为《维护国防部软件重要性日益增长》的文章。Doug 提出了以下观点：\n\n*“尽管软件不会磨损，但固件和硬件会过时，从而需要对软件进行修改。”*\n\
  \n对我来说这是一个启发性的时刻。Doug 提到的两个我本认为显而易见的术语——但也许并非如此。*软件*可以使用很长一段时间的东西，但*固件*会随着硬件的演进而过时。如果你在嵌入式系统开发中工作过，你就知道硬件正在不断演进和改进。与此同时，新的“软件”不断增加功能，复杂性也不断增长。\n\
  \n我想补充 Doug 的陈述：\n\n*“尽管软件不会磨损，但它可能会因为对固件和硬件不受管理的依赖而从内部被破坏。”*\n\n嵌入式软件由于硬件依赖的影响而被剥夺了可能很长的寿命，并不罕见。\n\
  \n我喜欢 Doug 对固件的定义，但让我们看看还有哪些定义。我发现了这些替代方案：\n\n• “固件存储在非易失性存储设备中，如 `ROM`、`EPROM`\
  \ 或 `flash memory`。”（[固件](https://en.wikipedia.org/wiki/Firmware)）\n\n• “固件是程序在硬件设备上的软件程序或指令集。”（[固件定义](https://techterms.com/definition/firmware)）\n\
  \n• “固件是嵌入硬件设备中的软件。”（[固件是什么](https://www.lifewire.com/what-is-firmware-2625881)）\n\
  \n• 固件是“写在只读存储器（ROM）上的软件（程序或数据）”。（[固件解释](http://www.webopedia.com/TERM/F/firmware.html)）\n\
  \nDoug 的陈述让我意识到，这些认可的固件定义是错误的，或者至少是过时的。固件并不意味着代码住在 `ROM` 中。它不是因为存储的位置而成为固件；相反，它是固件是因为它依赖什么，以及随着硬件演进改变它变得有多困难。硬件确实在演进（停下来看看你的手机就能找到证据），所以我们应该考虑到这一现实来构建我们的嵌入式代码。\n\
  \n我不反对固件，也不反对固件工程师（我本人也写过一些固件）。但我们真正需要的是更少的固件和更多的软件。实际上，我对固件工程师写了这么多固件感到失望！\n\n\
  非嵌入式工程师也写固件！你们这些非嵌入式开发人员每当代码中埋入 `SQL` 或将平台依赖分散在整个代码中，本质上就是在写固件。Android 应用开发者在没有将业务逻辑与\
  \ Android API 分离时，他们就在写固件。\n\n我参与过很多工作，在这些工作中，产品代码（软件）与与硬件交互的代码（固件）之间的界限模糊到几乎不存在。例如，在\
  \ 20 世纪 90 年代后期，我有幸帮助重新设计了一个通信子系统，该系统正在从时分复用（TDM）过渡到 IP 语音（VOIP）。`VOIP` 是现在的做法，但\
  \ `TDM` 曾认为是 20 世纪 50 年代和 60 年代的尖端技术，并在 80 年代和 90 年代被广泛部署。\n\n每当我们向系统工程师提出关于通话如何对特定情况做出反应的问题时，他就会消失，稍后就会带着非常详尽的答案出现。“他从哪里得到那个答案的？”我们问。他回答：“来自当前产品的代码。”那错复杂的遗留代码就是新产品的规范！现有的实现在\
  \ `TDM` 和拨号业务逻辑之间没有分离。整个产品从上到下都依赖于硬件/技术，无法理顺。整个产品本质上已经变成了固件。\n\n考虑另一个例子：命令消息通过串口到达此系统。意不意外的是，这里有一个消息处理器/分发器。消息处理器知道消息的格式，能够解析它们，然后将消息分发到可以处理请求的代码中。这些都不意外，异常的是消息处理器/分发器与与\
  \ `UART` 交互的代码位于同一个文件中。消息处理器被 `UART` 细节污染了。消息处理器本可以是具有可能长寿的软件，但它现在是固件。\n\n\n\n\n\
  作为通过 App-titude 测试期间产生的代码示例，请查看这些位于小型嵌入式系统文件中的函数：\n\n点击此处查看代码图像\n\n```\nISR(TIMER1_vect)\
  \ { ... }\nISR(INT2_vect) { ... }\nvoid btn_Handler(void) { ... }\nfloat calc_RPM(void)\
  \ { ... }\nstatic char Read_RawData(void) { ... }\nvoid Do_Average(void) { ... }\n\
  void Get_Next_Measurement(void) { ... }\nvoid Zero_Sensor_1(void) { ... }\nvoid\
  \ Zero_Sensor_2(void) { ... }\nvoid Dev_Control(char Activation) { ... }\nchar Load_FLASH_Setup(void)\
  \ { ... }\nvoid Save_FLASH_Setup(void) { ... }\nvoid Store_DataSet(void) { ... }\n\
  float bytes2float(char bytes[4]) { ... }\nvoid Recall_DataSet(void) { ... }\nvoid\
  \ Sensor_init(void) { ... }\nvoid uC_Sleep(void) { ... }\n```\n\n上述函数列表是我在源文件中发现它们的顺序。现在，我将它们分开并按关注点进行归类：\n\
  \n### 包含领域逻辑的函数\n\n点击此处查看代码图像\n\n```\nfloat calc_RPM(void) { ... }\nvoid Do_Average(void)\
  \ { ... }\nvoid Get_Next_Measurement(void) { ... }\nvoid Zero_Sensor_1(void) { ...\
  \ }\nvoid Zero_Sensor_2(void) { ... }\n```\n\n### 硬件平台的设置函数\n\n点击此处查看代码图像\n\n```\n\
  ISR(TIMER1_vect) { ... }\nISR(INT2_vect) { ... }\nvoid uC_Sleep(void) { ... }\n\
  ```\n\n#### 响应开关按钮按下事件的函数\n\n```\nvoid btn_Handler(void) { ... }\nvoid Dev_Control(char\
  \ Activation) { ... }\n```\n\n#### 可以从硬件获取 A/D 输入读取值的函数\n\n```\nstatic char Read_RawData(void)\
  \ { ... }\n```\n\n### 将值存储到持久性存储器的函数\n\n点击此处查看代码图像\n\n```\nchar Load_FLASH_Setup(void)\
  \ { ... }\nvoid Save_FLASH_Setup(void) { ... }\nvoid Store_DataSet(void) { ... }\n\
  float bytes2float(char bytes[4]) { ... }\nvoid Recall_DataSet(void) { ... }\n```\n\
  \n### 函数名与其实不符的函数\n\n点击此处查看代码图像\n\n```\nvoid Sensor_init(void) { ... }\n```\n\n\
  查看该应用程序中的其他一些文件，我发现了许多理解代码的障碍。我还发现了一种文件结构，它暗示测试这些代码的唯一方法是在嵌入式目标机中进行。这段代码的每一个位都知道自己处于一种特殊的微处理器架构中，使用了“扩展”C\
  \ 语言构造结构^(3)，这些结构将代码与特定的工具链和微处理器绑定。除非产品永远不需要迁移到不同的硬件环境，否则这段代码没有长久的寿命。\n\n这个应用程序可以运行：工程师通过了\
  \ App-titude 测试。但不能说该应用程序具有整洁的嵌入式架构。\n\n### 目标硬件的瓶颈\n\n嵌入式开发者必须处理许多特殊问题，而非嵌入式开发者则不需要——例如，有限的内存空间、实时性限制和截止日期、有限的\
  \ I/O、不常规的用户界面，以及与真实世界的传感器和连接。大多数时候，硬件与软件和固件同步开发。作为此类此类系统开发代码的工程师，你可能没有地方可以运行代码。如果这还不够糟糕，一旦你拿到硬件，硬件很可能会有缺陷，从而拖慢你的进度。\n\
  \n### 清洁的嵌入式架构是可测试的\n\n让我们如何如何一些嵌入式原则来消除目标硬件瓶颈。\n\n#### 层\n\n分层有许多形式。让我们从三层开始，如图\
  \ 29.1 所示。在底部是硬件。随着技术的进步，部件会过时、功耗更低或提供更好的性能。作为一名嵌入式工程师，你必须处理不可避免的硬件变化。\n\n![Image](img/00105.jpeg)\n\
  **图 29.1** 三层\n\n硬件与系统其余部分的分离是肯定的，如图 29.2 所示。当你试图通过 App-titude 测试时，问题往往从这里开始。如果你不小心放置内容的位置，以及一个模块被允许知道的范围，代码将非常难以更改。我指的不仅仅是硬件变化时，还包括用户请求更改时，或者需要修复\
  \ bug 时。\n\n![Image](img/00106.jpeg)\n**图 29.2** 硬件必须与系统部分分离\n\n软件与固件的混合是一种反模式。表现出这种反模式的代码会抵抗变化。此外，更改是危险的，往往会导致意想不到的后果。微小的更改也需要对整个系统进行全面的回归测试。如果你没有创建仪器化测试，做好准备忍受手动测试的无——然后你就可以收到错误报告了。\n\
  \n#### 硬件是一个细节\n\n软件与固件之间的边界通常没有代码与硬件之间的边界那样清晰，如图 29.3 所示。作为嵌入式软件开发人员，你的工作之一就是巩固这条线。软件与固件之间边界的名称是硬件抽象层（HAL）（图\
  \ 29.4）。这不是一个新主意：在 Windows 时代之前就有。\n\n![Image](img/00107.jpeg)\n**图 29.3** 软件与固件之间的边界比代码与硬件之间的边界要模糊\n\
  \n`HAL` 的存在是为了在其之上的软件，其 API 应该根据该软件的需求进行定制。例如，固件可以将字节和字节数组存储在闪存中。相反，应用程序需要在某些持久化机制中存储和读取键值对。软件不应该关心键值对是存储在闪存、旋转磁盘、云端还是核心内存中。`HAL`\
  \ 提供服务，它不会向软件暴露它是如何实现的。闪存实现是一个应该对软件隐藏的细节。\n\n\n\n\n作为另一个例子，LED 被绑定到一个 GPIO 位。固件可以提供对\
  \ GPIO 位的访问，其中 HAL（硬件抽象层）可能会提供 `Led_TurnOn(5)`。这是一个相当底层的硬件抽象层。让我们考虑从硬件视角切换到软件/产品视角来提高抽象层次。LED\
  \ 指示的是什么？假设它指示的是电量低。在某个层级上，固件（或板级支持包）可以提供 `Led_TurnOn(5)`，而 HAL 提供 `Indicate_LowBattery()`。你可以看到\
  \ HAL 表达了应用程序所需的服务。你也可以看到层与层之间可以相互包含。这更像是一种重复的分形模式，而不是一组有限的预定义层。GPIO 分配是应该对软件隐藏的细节。\n\
  \n### 不要向 HAL 用户泄露硬件细节\n\n一个清晰的嵌入式架构的软件可以在离目标硬件的情况下进行测试。一个成功的 HAL 提供了那种接缝或一组替换点，方便了离目标硬件测试。\n\
  \n### 处理器是一个细节\n\n当你的嵌入式应用程序使用专门的工具链时，它通常会提供头文件来帮助你。这些编译器经常对 C 语言进行自由发挥，添加新的关键字来访问其处理器功能。代码看起来像\
  \ C，但它不再是 C 了。\n\n有时供应商提供的 C 编译器会提供类似于全局变量的内容，以便直接访问处理器寄存器、IO 端口、时钟定时器、IO 位、中断控制器和其他处理器功能。轻松访问这些内容是有帮助的，但要意识到，你的代码中使用任何这些方便设施的部分都不是\
  \ C 了。它无法在另一个处理器上编译，甚至即使在同一个处理器上使用不同的编译器也无法编译。\n\n我不希望认为芯片和工具供应商是在愤世嫉俗，将你的产品与编译器绑定。让我们给予提供者疑疑的空间，假设它真的在试图提供帮助。但现在取决于你如何以不对未来产生伤害的方式来使用这种帮助。你必须限制哪些文件允许了解\
  \ C 扩展。\n\n让我们来看这个为 ACME 系列 DSP 设计的头文件——你知道的，就是 Wile E. Coyote 使用的那些：\n\n点击此处查看代码图像\n\
  \n```c\n#ifndef _ACME_STD_TYPES\n\n#define _ACME_STD_TYPES\n\n#if defined(_ACME_X42)\n\
  \n    typedef unsigned int        Uint_32;\n    typedef unsigned short      Uint_16;\n\
  \    typedef unsigned char      Uint_8;\n    typedef int                Int_32;\n\
  \    typedef short              Int_16;\n    typedef char               Int_8;\n\
  #elif defined(_ACME_A42)\n\n    typedef unsigned long      Uint_32;\n    typedef\
  \ unsigned int        Uint_16;\n    typedef unsigned char      Uint_8;\n    typedef\
  \ long               Int_32;\n    typedef int                Int_16;\n    typedef\
  \ char               Int_8;\n#else\n\n    #error <acmetypes.h> is not supported\
  \ for this environment\n#endif\n\n#endif\n```\n\n`acmetypes.h` 头文件不应直接使用。如果你这样做，你的代码就会被绑定到\
  \ ACME DSP 之一。你说，我正在使用 ACME DSP，那又有什么害呢？除非包含此头文件，否则你无法编译代码。如果你使用了头文件并定义了 `_ACME_X42`\
  \ 或 `_ACME_A42`，当你尝试离目标测试代码时，你的整数大小将是错误的。如果这还不够糟糕，某一天你想将应用程序迁移到另一个处理器，而由于你之前没有这样做，你会让那个任务变得困难得多。\n\
  \n与其使用 `acmetypes.h`，你应该尝试使用 `stdint.h`。这有助于保持代码的可移植性。但如果 `stdint.h` 不存在呢？你可以为目标编写\
  \ `stdint.h`，如下所示：\n\n点击此处查看代码图像\n\n```c\n#ifndef _STD_H\n#define _STD_H\n\ntypedef\
  \ unsigned int        Uint_32;\ntypedef unsigned short      Uint_16;\ntypedef unsigned\
  \ char      Uint_8;\ntypedef int                Int_32;\ntypedef short         \
  \     Int_16;\ntypedef char               Int_8;\n\n#endif\n```\n\n（注：原文后续部分存在大量重复段落，根据指令“一定不要重复输出原文”的要求，此处译文已剔除重复内容。）\n\
  \n一个清晰的嵌入式架构的软件可以在离目标硬件的情况下进行测试。一个成功的 HAL 提供了那种接缝或一组替换点，方便了离目标硬件测试。\n\n### 操作系统是一个细节\n\
  \n为了让你的嵌入式代码有长期长期生存，你必须将操作系统视为一个细节，并防止 OS 依赖。\n\n软件通过 OS 访问操作环境的服务。OS 是分离软件与固件的层（图\
  \ 29.5）。直接使用 OS 会导致问题。例如，如果你的 RTOS 供应商被另一公司收购，版税增加了或质量下降了怎么办？如果你的需求发生了变化，而你的 RTOS\
  \ 不具备你现在需要的功能怎么办？你不得不修改大量的代码。\n\n\n\n\n清晰的嵌入式架构通过`操作系统抽象层` (OSAL) (图 29.6) 将软件与操作系统隔离离开。在某些情况下，实现这一层可能只需要更改函数的名称。在其他情况下，它可能涉及将几个函数封装在一起。\n\
  \n![Image](img/00110.jpeg)\n\n**图 29.6** 操作系统抽象层\n\n如果你曾经将软件从一个 RTOS 迁移到另一个 RTOS，你就知道那是多么痛苦痛苦。如果你的软件依赖于\
  \ `OSAL` 而不是直接依赖操作系统，你很大程度上是在编写一个与旧 `OSAL` 兼容的新 `OSAL`。你更愿意做哪一个：修改大量复杂的现有代码，还是针对定义的接口和行为编写新代码？这不是一个陷阱题。我选择后者。\n\
  \n你现在可能已经开始担心代码膨胀了。但实际上，这一层成为了隔离许多在使用操作系统时产生的重复代码的地方。这种重复并不一定会带来巨大的开销。如果你定义了一个 `OSAL`，你还可以鼓励应用程序具有通用的结构。你可以提供消息传递机制，而不是让每个线程都手工构建自己的并发模型。\n\
  \nOSAL 可以帮助提供测试点，使得软件层中价值贵的应用代码可以在离目标、离操作系统的情况下进行测试。清晰的嵌入式架构的软件是可以离目标操作系统测试的。一个成功的\
  \ `OSAL` 提供了那种接缝或一组替换点，便于进行离目标测试。\n\n#### 面向接口编程与可替换性\n\n除了在每个主要层（软件、操作系统、固件和硬件）内部添加\
  \ HAL 和可能需要的 OSAL 之外，你还可以——并且应该——应用书中处描述的原则。这些原则鼓励关注点分离、面向接口编程和可替换性。\n\n分层架构的想法是建立在面向接口编程的基础上的。当一个模块通过接口与另一个模块交互时，你可以用一个服务提供者替换另一个。许多读者可能已经为目标机编写了自己的小版本的\
  \ `printf` 以部署在目标上。只要你的 `printf` 接口与标准版本的 `printf` 相同，你就可以用一个来覆盖另一个。\n\n一个基本的经验法则是使用头文件作为接口定义。然而，当你这样做时，必须非常小心头文件中的内容。将头文件的内容限制为函数声明，以及函数所需的常量和结构体名称。\n\
  \n不要用仅供实现所需的数据结构、常量和 typedef 弄乱接口头文件。这不仅仅是杂乱的问题：这些杂乱会导致意外的依赖关系。限制实现细节的可见性。预见到实现细节会发生变化。代码了解细节的地方越少，代码需要追踪和修改的地方就越少。\n\
  \n清晰的嵌入式架构在层内部是可测试的，因为模块通过接口交互。每个接口都提供了那种便于离目标测试的接缝或替换点。\n\n#### DRY 的条件编译指令\n\n\
  可替换性的一种经常被忽视的用途与嵌入式 C 和 C++ 程序如何处理不同的目标或操作系统有关。人们往往倾向于使用条件编译来开启或关闭某些代码段。我记得有一个特别棘手的案例，在一个电信应用中，`#ifdef\
  \ BOARD_V2` 语句被提到了数千次。\n\n这种代码的重复违反了“不要重复”（DRY）原则⁵。如果我只看到一次 `#ifdef BOARD_V2`，它真的不是什么问题。*六千次*就是一个极端的问题。识别目标硬件类型的条件编译在嵌入式系统中经常重复。但我们还能做什么？\n\
  \n如果有硬件抽象层（HAL）呢？硬件类型将成为隐藏在 HAL 下的细节。如果 HAL 提供了一组接口，而不是使用条件编译，我们可以使用链接器或某种形式的运行时绑定将软件连接到硬件。\n\
  \n## 结论\n\n开发嵌入式软件的人可以从嵌入式软件之外的经验中学很多。如果你是一个拿起这本书的嵌入式开发者，你将在这些文字和思想中发现丰富的软件开发智慧。\n\
  \n让所有代码变成固件对你产品的长期健康没有好处。只能在目标硬件上进行测试对你产品的长期健康没有好处。清晰的嵌入式架构对你产品的长期健康有利。\n\n¹. [`insights.sei.cmu.edu/sei_blog/2011/08/the-growing-importance-of-sustaining-software-for-thedod.html`](https://insights.sei.cmu.edu/sei_blog/2011/08/the-growing-importance-of-sustaining-software-for-thedod.html)\n\
  \n². 控制串口的硬件设备。\n\n³. 某些硅供应商为 C 语言添加了关键字，以便从 C 简单访问寄存器和 IO 端口。不幸的是，一旦这样做，代码就不再是\
  \ C 了。\n\n⁴. 这条语句特意使用了 HTML。\n\n⁵. Hunt and Thomas, 《实战程序员》(The Pragmatic Programmer)。\n\
