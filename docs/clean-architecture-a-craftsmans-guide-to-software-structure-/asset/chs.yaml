  ## 索引\n\n\n当我们谈论软件架构时，软件在本质上是递归和分形的，它们被刻画和勾勒在代码之中。一切都是细节。相互锁的细节层次也对建筑的架构做出了贡献，但在软件中讨论物理规模是没有意义的。软件具有结构——许多种结构和许多类型的结构——但其多样性超过了在建筑中发现的物理结构范围。你甚至可以非常有说服力地论证，软件中的设计活动和关注比建筑架构更多——从这个意义上说，认为软件架构比建筑架构更具“架构性”也是合理的！\n\
  这本书的标题是 `Clean Architecture`（整洁架构）。这是一个大胆的名字。有些人甚至会认为它傲慢。那么，我为什么选择这个标题，我又为什么要写这本书呢？\n\
  *架构规则是通用的！*\n\n\n\nKent Beck\nBill Degnan\n\n\n\n\n\n\n## 22\n\n### 洁洁架构\n\n![Image](img/00082.jpeg)\n\
  \n在过去的几十年里，我们看到了关于系统架构的一系列观点。这些包括：\n\n* 六边形架构（也称为端口和适配器），由 Alistair Cockburn 开发，并被\
  \ Steve Freeman 和 Nat Pryce 在他们出色的著作 *Growing Object Oriented Software with Tests*\
  \ 中采用。\n* 来自 James Coplien 和 Trygve Reenskaug 的 DCI\n* BCE，由 Ivar Jacobson 从他的书籍\
  \ *Object Oriented Software Engineering: A Use-Case Driven Approach* 中引入。\n\n尽管这些架构在细节上各有不同，但它们非常相似。它们都有相同的目标，即关注点分离。它们都通过将软件划分为层来实现这种分离。每种架构都至少有一层用于业务规则，以及另一层用于用户和系统界面的。\n\
  \n这些架构中的每一种所产的系统都具有以下特征：\n\n* `独立于框架。` 架构不依赖于某些功能丰富的软件库的存在。这允许你将此类框架作为工具，而不是强迫将你的系统塞进它们有限的限制中。\n\
  * `可测试。` 可以在没有 UI、数据库、Web 服务器或任何其他外部元素的情况下测试业务规则。\n* `独立于 UI。` UI 可以轻松更改，而无需更改系统的其他部分。例如，可以用控制台\
  \ UI 替换 Web UI，而无需更改业务规则。\n* `独立于数据库。` 你可以将 `Oracle` 或 `SQL Server` 交换为 `Mongo`、`BigTable`、`CouchDB`\
  \ 或其他。你的业务规则不受数据库限制。\n* `独立于任何外部机构。` 事实上，你的业务规则完全不知道外部世界的接口。\n\n图 22.1 中的图表试图将所有这些架构整合到一个单一的可操作想法中。\n\
  \n![Image](img/00083.jpeg)\n\n**图 22.1** 洁洁架构\n\n## 依赖规则\n\n图 22.1 中的同心圆代表软件的不同区域。通常情况下，越往内，层次越高。外层圆是机制。内层圆是策略。\n\
  \n这种架构运行的核心规则是 `依赖规则`：\n\n`源代码依赖仅指向内部，指向高级策略。`\n\n内层圆中的任何东西都无法知道外层的任何信息。特别是，在外层中声明的任何名称不能在内层圆的代码中提到。\n\
  \n同样，在外层中声明的数据格式不应被内层圆使用，特别是当这些格式是由外层的框架生成的。我们不希望外层的任何东西影响内层圆。\n\n#### 实体 (Entities)\n\
  \n实体封装了企业的关键业务规则。实体可以是带有方法的对象，也可以是一组数据结构和函数。只要实体可以被企业中的许多应用程序使用，这并不重要。\n\n如果你没有企业，只是编写单个应用程序，那么这些实体就是应用程序的业务对象。它们封装了最通用、最高级的规则。当外部发生变化时，它们最不容易改变。例如，你不会预期这些对象受到页面导航或安全性的影响。任何特定应用程序的操作更改都不应影响实体层。\n\
  \n#### 用例 (Use Cases)\n\n用例层的软件包含了特定的业务规则。它封装并实现了系统所有的用例。这些用例协调数据在实体之间的流动，并指导这些实体使用它们各自的关键业务规则来实现用例的目标。\n\
  \n我们不期望这一层的更改会影响实体。我们也不期望该层受到外部因素（如数据库、UI 或任何常用框架）更改的影响。用例层与这些关注点隔离开。\n\n\n\n\n\
  然而，我们预料应用程序运行的更改将影响用例，因此也会影响该层中的软件。如果用例的细节发生变化，那么该层中的某些代码肯定会受到影响。\n\n### 接口适配器 (INTERFACE\
  \ ADAPTERS)\n\n接口适配器层中的软件是一组适配器，它们将数据从最便于用例和实体处理的格式转换为最便于某些外部代理（如数据库或 Web）处理的格式。例如，正是这一层将完整地包含\
  \ GUI 的 MVC 架构。演示者（presenters）、视图（views）和控制器（controllers）都属于接口适配器层。模型（models）可能只是从控制器传递到用例，然后从用例传回演示者和视图的数据结构。\n\
  \n同样，在这一层中，数据也从最便于实体和用例处理的形式，转换为最便于任何正在使用的持久化框架（即数据库）处理的格式。该圆圈内部的任何代码都不应该知道关于数据库的任何信息。如果数据库是\
  \ SQL 数据库，那么所有的 SQL 都应该限制在此层中——特别是该层中与数据库相关的部分。\n\n该层还包含了任何其他必要的适配器，用于将数据从某些外部形式（如外部服务）转换为用例和实体使用的内部形式。\n\
  \n### 框架和驱动程序 (FRAMEWORKS AND DRIVERS)\n\n图 22.1 中模型的最外层通常由框架和工具组成，例如数据库和 Web 框架。通常情况下你不会在这一层中编写大量代码，除了与内部下一个圆圈通信的胶水代码外。\n\
  \n框架和驱动程序层是存放所有细节的地方。Web 是一个细节。数据库也是一个细节。我们将这些东西放在外面，这样它们造成的伤害就很小。\n\n### 只有四个圆圈吗？\n\
  \n图 22.1 中的圆圈是示意性的：你可能会发现自己需要的不仅仅是这四个。没有规则规定你必须始终只有这四个。然而，依赖规则（Dependency Rule）始终适用。源代码的依赖始终指向内部。随着你向内部移动，抽象级别和策略增加。最外层的圆圈由低级的具体细节组成。随着你向内部移动，软件变得更加抽象，并封装了高级别的策略。最内层的圆圈是最通用且层次最高级。\n\
  \n### 跨越边界 (CROSSING BOUNDARIES)\n\n图 22.1 图右下角是一个我们如何跨越圆圈边界的示例。它展示了控制器和演示者与下一层的用例进行通信。注意控制流：它始于控制器，经过用例，最后在演示者中执行。同样注意源代码依赖：每一个都指向内部的用例。\n\
  \n我们通常通过使用依赖倒置原则（Dependency Inversion Principle）来解决这种表面上的矛盾。例如，在 `Java` 等语言中，我们会安排接口和继承关系，使得源代码依赖在跨越边界的恰当点与控制流相反。\n\
  \n例如，假设用例需要调用演示者。这种调用不能是直接的，因为这将违反依赖规则：外层圆圈中的任何名称不能被内层圆圈引用。因此，我们让用例调用内层圆圈中的接口（在图\
  \ 22.1 中显示“用例输出端口”），并让外层圆圈中的演示者实现它。\n\n同样的技术被用于跨越架构中的所有边界。我们利用动态多态来创建与控制流相反的源代码依赖，以便无论控制流向哪个方向传输，都能符合依赖规则。\n\
  \n### 哪些数据跨越了边界\n\n通常，跨越边界的数据由简单的数据结构组成。如果你喜欢，可以使用基础结构体（struct）或简单的数据传输对象（DTO）。或者数据也可以是函数调用中的参数。或者你可以将其封装进\
  \ `hashmap` 中，或者构造成一个对象。重要的是，跨越边界的是隔离的简单数据结构。我们不希望作弊传递 `Entity` 对象或数据库行。我们不希望数据结构具有任何违反依赖规则的依赖。\n\
  \n例如，许多数据库框架在响应查询时返回一种方便的数据格式。我们可能称之为“行结构”。我们不希望将该行结构跨越边界传递内部。这样做将违反依赖规则，因为它强制内层圆圈知道关于外层圆圈的某些信息。\n\
  \n因此，当我们跨越边界传递数据时，它总是以便于内层圆圈的形式存在。\n\n### 典型场景 (A TYPICAL SCENARIO)\n\n图 22.2 图显示了一个使用数据库的基于\
  \ Web 的 `Java` 系统的典型场景。Web 服务器从用户处收集输入数据并交给左上角的 `Controller`。`Controller` 将这些数据封装成一个普通的\
  \ Java 对象（POJO），并通过 `InputBoundary` 将此对象传递给 `UseCaseInteractor`。`UseCaseInteractor`\
  \ 解析这些数据并使用它们来控制 `Entities` 的运行。它还使用 `DataAccessInterface` 从 `Database` 将这些 `Entities`\
  \ 使用的数据调入内存。完成后，`UseCaseInteractor` 从 `Entities` 收集数据并构造出另一个普通的 Java 对象作为 `OutputData`。然后，`OutputData`\
  \ 通过 `OutputBoundary` 接口传递给 `Presenter`。\n\n![Image](img/0084.jpeg)\n\n**图 22.2**\
  \ 使用数据库的基于 Web 的 Java 系统典型场景\n\n`Presenter` 的工作是将 `OutputData` 重新封装为可视的形式，即 `ViewModel`。`ViewModel`\
  \ 主要包含 `View` 用于展示的字符串和标志位。虽然 `OutputData` 可能包含 `Date` 对象，但 `Presenter` 会为 `ViewModel`\
  \ 加载已格式化好的面向用户的字符串。`Currency` 对象或任何其他业务数据也是如此。`Button` 和 `MenuItem` 的名称被放置在 `ViewModel`\
  \ 中，还有告诉 `View` 这些 `Button` 和 `MenuItem` 是否应该置灰的标志。\n\n这使得 `View` 几乎只需做的仅仅是将数据从\
  \ `ViewModel` 移动到 `HTML` 页面。\n\n注意依赖的方向。所有依赖都跨越边界并指向内部，遵循依赖规则。\n\n### 总结\n\n遵循这些简单的规则并不困难，它们将为未来的开发避免很多烦恼。通过将软件分层并遵循依赖规则，你将创建一个从本质上可测试的系统，以及随之带来的所有好处。当系统的任何外部部分过时时（例如数据库或\
  \ Web 框架），你可以以最小的代价替换这些过时的元素。\n\n\n\n\n`Humble Object`（谦卑对象）模式是一种设计模式，最初被识别为一种帮助单元测试人员将难以测试的行为与易测试的行为分离开的方法。其思想非常简单：将行为分为两个模块或类。其中一个模块是“谦卑的（humble）”，它包含了所有被精简到最本质的、难以测试的行为。另一个模块则包含了从该谦卑对象中提取出的所有可测试行为。\n\
  \n例如，GUI 很难进行单元测试，因为很难编写能够查看屏幕并检查相应元素是否显示在上面的测试。然而，GUI 的大部分行为实际上是易测试的。使用 `Humble\
  \ Object` 模式，我们可以将这两种行为分离到两个不同的类中，称为 `Presenter`（演示器）和 `View`（视图）。\n\n### 演示器与视图\n\
  \n`View` 是难以测试的谦卑对象。该对象中的代码保持尽可能简单。它将数据移动到 GUI 中，但不对这些数据进行处理。\n\n`Presenter` 是可测试的对象。它的工作是接收应用程序的数据并对其进行格式化以便展示，以便\
  \ `View` 可以简单地将其移动到屏幕上。例如，如果应用程序想要在字段中显示日期，它会向 `Presenter` 传递一个 `Date` 对象。`Presenter`\
  \ 然后会将该数据格式化为适当的字符串，并将其放在名为 `View Model` 的简单数据结构中，`View` 可以那里找到它。\n\n如果应用程序想要在屏幕上显示金额，它可能会向\
  \ `Presenter` 传递一个 `Currency` 对象。`Presenter` 将根据适当的小位数和货币标记对该对象进行格式化，创建一个可以放在 `View\
  \ Model` 中的字符串。如果该货币值为应变为红色，则会相应设置 `View model` 中一个简单的布尔标记。\n\n屏幕上的每个按钮都有一个名称。该名称是\
  \ `View Model` 中的一个字符串，由 `Presenter` 放置。如果这些按钮应该是灰色，`Presenter` 将在 `View model`\
  \ 中设置适当的布尔标记。每个菜单项名称都是 `View model` 中的一个字符串，由 `Presenter` 加载。每个单选按钮、复选框和文本字段的名称都由\
  \ `Presenter` 加载到 `View model` 中相应的字符串和布尔值中。应该显示在屏幕上的数字表格由 `Presenter` 加载到 `View\
  \ model` 中格式化良好的字符串表格中。\n\n屏幕上出现的任何内容以及应用程序具有某种控制权的内容，在 `View Model` 中都以字符串、布尔值或枚举的形式表示。`View`\
  \ 除了从 `View Model` 加载数据到屏幕上外，没有别的事情可做。因此，`View` 是谦卑的。\n\n### 测试与架构\n\n众所周知，可测试性是优秀架构的属性。`Humble\
  \ Object` 模式就是一个很好的例子，因为将行为分离为可测试部分和不可测试部分通常定义了一个架构边界。`Presenter/View` 边界是这些边界之一，但还有许多其他边界。\n\
  \n### 数据库网关\n\n在用例交互器（use case interactors）和数据库之间是数据库网关（database gateways）。这些网关是多态接口，包含了应用程序在数据库上执行的每个创建、读取、更新或删除操作的方法。例如，如果应用程序需要知道昨天登录的所有用户的姓氏，那么\
  \ `UserGateway` 接口将有一个名为 `getLastNamesOfUsersWhoLoggedInAfter` 的方法，它接受一个 `Date`\
  \ 作为参数并返回姓氏列表。\n\n请记住，我们不允许在用例层中使用 SQL；相反，我们使用具有适当方法的网关接口。这些网关由数据库层中的类实现。该实现就是谦卑对象。它只是使用\
  \ SQL（或任何数据库接口）来访问每个方法所需的数据。相比之下，交互器是不谦卑的，因为它们封装了特定特定的业务规则。尽管它们不谦卑，但这些交互器是可测试的，因为网关可以用适当的存根（stubs）和测试双胞（test-doubles）替换。\n\
  \n### 数据映射器\n\n回到数据库的话，你认为像 `Hibernate` 这样的 ORM 属于哪层？\n\n首先，让我们明确一点：并没有所谓的“对象关系映射（ORM）”。原因很简单：对象不是数据结构。至少，从用户的角度来看，它们不是数据结构。对象的用户无法看到数据，因为所有数据都是私有的。这些用户只能看到该对象的公共方法。因此，从用户的角度来看，一个对象仅仅是一组操作。\n\
  \n相比之下，数据结构是一组没有隐含行为的公共数据变量。ORM 应该命名为“数据映射器（data mappers）”，因为它们是从关系型数据库表中将数据加载到数据结构中。\n\
  \n此类 ORM 系统应该位于何处？当然是在数据库层。事实上，ORM 在网关接口和数据库之间形成了另一种类型的 `Humble Object` 边界。\n\n\
  ### 服务监听器\n\n服务又如何？如果你的应用程序必须与其他服务通信，或者如果你的应用程序提供一组服务，我们会发现 `Humble Object` 模式创建一个服务边界吗？\n\
  \n当然会！应用程序将数据加载到简单的数据结构中，然后将这些结构跨边界传递给能够正确格式化数据并发送到外部服务的模块。在输入端，服务监听器将从服务接口接收数据并将其格式化为应用程序可以使用简单数据结构。然后该数据结构被跨越服务边界。\n\
  \n## 结论\n\n在每个架构边界处，我们可能都会发现附近存在 `Humble Object` 模式。跨越边界的通信几乎总是涉及某些简单的数据结构，边界经常会将难以测试的部分与易测试的部分隔离开。\n\
  \n---\n\n### 部分边界\n\n![Image](img/00086.jpeg)\n\n完整的架构边界是非常贵的。它们需要相互的多态 `Boundary`\
  \ 接口、`Input` 和 `Output` 数据结构，以及为了将双方隔离为独立编译和部署的组件而所需的所有依赖管理。这需要大量工作。维护起来也需要大量工作。\n\
  \n在许多情况下，一位优秀的架构师可能会判断此类边界的成本太高——但可能仍想为这种边界留一个位置，以备以后需要。\n\n### 跳过最后一步\n\n构建部分边界的方法是完成独立编译和部署组件所需的所有工作，然后只需将它们保持在同一个组件中。相互的接口在那里，输入/输出数据结构在那里，一切都准备就绪——但我们将它们作为一个单一组件进行编译和部署。\n\
  \n\n\n\n显然，这种部分边界所需的代码量和准备设计工作与完整边界是相同的。然而，它不需要管理多个组件。它没有版本号跟踪或发布管理的负担。这种差异不应被轻视。\n\
  \n这是 `FitNesse` 早期的设计策略。`FitNesse` 的 web 服务器组件被设计为可以与 `FitNesse` 的 wiki 和测试部分分离。这种想法是，我们可能希望使用该\
  \ web 组件来创建其他基于 web 的应用程序。同时，我们也不希望用户不得不下载两个组件。记住，我们的设计目标之一是“下载即用”。我们的意图是让用户下载一个\
  \ jar 文件并执行它，而无需去寻找其他 jar 文件、解决版本兼容性问题等等。\n\n`FitNesse` 的故事也指出了这种方法的危险之处。随着时间的推移，当人们明显发现永远不需要独立的\
  \ web 组件时，web 组件与 wiki 组件之间的分离开始变弱。依赖关系开始以错误的方向跨越边界。如今，要重新将它们分离将是一项苦力差事。\n\n###\
  \ 一维边界\n\n完整的架构边界使用互惠的边界接口来维持两个方向的隔离。在两个方向上保持分离在初始设置和持续维护上都是昂贵的。\n\n一种为以后扩展为完整边界提供位置的简单结构如图图\
  \ 24.1\n\n**图 24.1** 策略模式\n\n很清楚，这为未来的架构边界铺平了道路。必要的依赖倒置已经到位，试图将 `Client` 与 `ServiceImpl`\
  \ 隔离开。同样很清楚的是，这种分离可能会迅速退化，如图中那个难看的虚箭头所示。如果没有互惠接口，除了开发者和架构师的勤勉和自律外，没有任何能阻止这种后道的产生。\n\
  \n### 外观模式\n\n更简单的边界是外观模式（Facade pattern），如图图 24.2\n\n**图 24.2** 外观模式\n\n然而，注意 `Client`\
  \ 对所有这些服务类都有间接依赖。在静态语言中，其中一个 `Service` 类源代码的更改将强制 `Client` 重新编译。此外，你可以想象使用这种结构创建后道是多么容易。\n\
  \n## 结论\n\n我们看到了部分实现架构边界的三种简单方法。当然，还有许多其他方法。这三种策略仅作为示例提供。\n\n这每种方法都有自己的成本和收益。在某些语境下，每种方法都可以作为最终完整边界的占位符。如果边界从未实现，每种方法也可以退化。\n\
  \n架构师职责之一就是决定架构边界某日可能存在的地方，以及是完全还是部分地实现该边界。\n\n## 25：层与边界\n\n![Image](img/00089.jpeg)\n\
  \n人们很容易将系统想象成由三个组件组成：UI、业务规则和数据库。对于某些简单系统，这足够了。但对于大多数系统来说，组件的数量要大于此。\n\n例如，考虑一个简单的电脑游戏。很容易想象这三个组件。UI\
  \ 处理从玩家到游戏规则的所有消息。游戏规则在某种持久化数据结构中存储游戏状态。但这些就是全部了吗？\n\n### 猎杀雾兽 (HUNT THE WUMPUS)\n\
  \n让我们给这些骨架增加血肉。假设这个游戏是 1972 年著名的《Hunt the Wumpus》冒险游戏。这个基于文本的游戏使用了简单的命令，如 GO EAST（向东）和\
  \ SHOOT WEST（向西射）。玩家输入命令，计算机响应玩家看到、闻到、听到和体验的内容。玩家在一个洞穴系统中搜猎一只 Wumpus，必须避开伏击的陷阱、深坑和其他危险。如果你感兴趣，在网络上很容易找到该游戏的规则。\n\
  \n假设我们将保留基于文本的 UI，但将其与游戏规则解耦，以便我们的版本可以在不同的市场使用不同的语言。游戏规则将使用与语言的 API 与 UI 组件通信，而\
  \ UI 将将该 API 翻译成相应的人类语言。\n\n如果源代码依赖关系管理得当，如图图 25.1 所示，那么任意数量的 UI 组件都可以重用相同的游戏规则。游戏规则不知道也不在乎使用的是哪种人类语言。\n\
  \n![Image](img/00090.jpeg)\n\n**图 25.1** 任意数量的 UI 组件都可以重用游戏规则\n\n让我们假设游戏状态维护在某些持久化存储中——可能在闪存中，可能在云端，或者可能只是在\
  \ RAM 中。在任何情况下，我们都不希望游戏规则知道细节。因此，我们再次创建一个游戏规则可以使用与数据存储通信的 API。\n\n我们不希望游戏规则知道任何关于不同类型数据存储的信息，因此依赖关系必须按照依赖规则（Dependency\
  \ Rule）正确引导，如图图 25.2 所示。\n\n![Image](img/00091.jpeg)\n\n**图 25.2** 遵循依赖规则\n\n###\
  \ 洁洁架构？\n\n很清楚，在这种所有用例、边界、实体和相应数据结构的情况下，我们可以轻松应用洁洁架构方法。但我们真的找到所有的架构边界了吗？\n\n例如，语言并不是\
  \ UI 变化的唯一轴。我们可能还想改变我们传输文本的机制。例如，我们可能想使用 shell 窗口、短信或聊天应用程序。有许多不同的可能性。\n\n这意味着存在一个由这个变化轴定义的潜在架构边界。也许我们应该构建一个跨越该边界的\
  \ API，将语言与通信机制隔离；那个想法如图图 25.3 所示。\n\n![Image](img/00092.jpeg)\n\n**图 25.3** 修改后的图表\n\
  \n图 25.3 中的图表变得有点复杂，但不应该包含任何意外。虚线轮廓表示抽象组件，它们定义了由上方或下方组件实现的 API。例如，`Language` API\
  \ 由 `English` 和 `Spanish` 实现。\n\n\n\n\n如果我们观察 `Language` 内部，会发现同样的情况：由 `TextDelivery`\
  \ 内部代码实现的多态 `Boundary` 接口，以及由 `TextDelivery` 使用并由 `Language` 实现的多态 `Boundary` 接口。\n\
  \n在每种，由这些 `Boundary` 接口定义的 API 都归上游组件所有。\n\n变体（如 `English`、`SMS` 和 `CloudData`）是由抽象\
  \ API 组件中定义的多态接口提供的，并由服务它们的具体组件实现。例如，我们期望在 `Language` 中定义的多态接口由 `English` 和 `Spanish`\
  \ 实现。\n\n我们可以通过消除所有变体并仅关注 API 组件来简化这张图。图 25.4 显示了这幅图表。\n\n![Image](img/00093.jpeg)\n\
  \n**图 25.4** 简化后的图\n\n注意，图 25.4 中的图表取向是，使得所有的箭头都指向上方。这使得 `GameRules` 位于顶部。这种取向是有意义的，因为\
  \ `GameRules` 是包含最高策略的组件。\n\n考虑信息流的方向。所有输入都通过左下角的 `TextDelivery` 组件来自用户。这些信息流经 `Language`\
  \ 组件上升，被翻译成发送给 `GameRules` 的命令。`GameRules` 处理用户输入并将适当的数据发送到右下角的 `DataStorage`。\n\
  \n`GameRules` 然后输出传回给 `Language`，`Language` 将 API 翻译回相应的语言，然后通过 `TextDelivery` 将该语言传递给用户。\n\
  \n这种组织有效地将数据流分为两个流^(2)。左侧的流关注与用户的通信，右侧的流关注数据持久化。两个流在顶部^(3) 汇合于 `GameRules`，它是处理通过这两个流的数据的最终处理器。\n\
  \n### 流的交汇\n\n是否总是像像这个例子一样，有两个数据流？不，完全不是。想象一下我们想在网络上和多个玩家玩“捉迷幻兽”（Hunt the Wumpus）。在这种情况下，我们需要一个网络组件，如图\
  \ 25.5 所示。这种组织将数据流划分为三个流，都由 `GameRules` 控制。\n\n![Image](img/00094.jpeg)\n\n**图 25.5**\
  \ 增加网络组件\n\n因此，随着系统变得越来越复杂，组件结构可能会分裂成许多这样的流。\n\n### 流的划分\n\n此时，你可能在想所有的流最终都会汇合在顶部的单个组件中。如果生活真那么简单就好了！现实要复杂得多。\n\
  \n考虑用于“捉迷幻兽”的 `GameRules` 组件。部分游戏规则涉及地图的机制。它们知道洞穴是如何连接的，以及每个洞穴位于哪些对象。它们知道如何让玩家从一个洞穴移动到另一个洞穴，以及如何确定玩家必须处理的事件。\n\
  \n还有另一组更高级别的策略——知道玩家健康状况以及特定事件成本或收益的策略。这些策略可能会导致玩家逐渐失去健康值，或通过发现食物获得健康值。低级机制策略会向这种高级策略声明事件，例如\
  \ `FoundFood` 或 `FellInPit`。高级策略随后会管理玩家的状态（如图 25.6 所示）。最终，该策略将决定玩家的胜负。\n\n![Image](img/00095.jpeg)\n\
  \n**图 25.6** 高级策略管理玩家\n\n这是一个架构边界吗？我们是否需要一个将 `MoveManagement` 与 `PlayerManagement`\
  \ 隔离开的 API？嗯，让我们这变得更有趣一点，加入微服务吧。\n\n假设我们有一个大型多人版本的“捉迷幻兽”。`MoveManagement` 在玩家的计算机上进行本地处理，但\
  \ `PlayerManagement` 由服务器处理。`PlayerManagement` 为所有连接的 `MoveManagement` 组件提供微服务 API。\n\
  \n图 25.7 中的图表以某种简略的方式描绘了这种场景。`Network` 元素比描述的复杂一点——但你可能仍然能理解这一点。在这种情况下，`MoveManagement`\
  \ 和 `PlayerManagement` 之间存在一个完整的架构边界。\n\n![Image](img/00096.jpeg)\n\n**图 25.7**\
  \ 增加微服务 API\n\n## 结论\n\n这一切意味着什么？为什么我要这样一个荒谬简单的程序（它用 200 行 Kornshell 代码就能实现），并用所有这些疯狂的架构边界对其进行推演？\n\
  \n这个例子旨在说明架构边界无处不在。我们作为架构师，必须谨慎地识别何时需要它们。我们还必须意识到，这种边界在完全实现时是昂昂的。同时，我们必须承认，当这种边界被忽视时，以后添加它们将非常昂贵——即使在有完善测试套件和重构纪律的情况下也是如此。\n\
  \n那么我们架构师该怎么办？答案令人遗憾的。一方面，多年来一些非常聪明的人告诉我们，我们不应该预判抽象的需求。这是 YAGNI 哲学：“你不会需要它的。”这条信息中蕴含智慧，因为过度工程通常比工程不足要糟糕得多。另一方面，当你发现自己确实需要一个本不存在的架构边界时，添加这样一个边界的成本和风险可能非常高。\n\
  \n所以，情况就是这样。噢，软件架构师，你必须预见未来。你必须——明智地——猜测。你必须权衡成本并确定架构边界在哪里，哪些应该完全实现，哪些应该部分实现，哪些应该被忽略。\n\
  \n但这不是一次性决定。你不是仅仅在项目开始时就决定实现哪些边界、忽略哪些。相反，你必须*观察*。在系统演进时保持关注。你记录哪里可能需要边界，然后仔细观察第一次摩擦的迹象，因为那些边界原本并不存在。\n\
  \n在这一点上，你权衡实现这些边界的成本与忽视它们的成本——并频繁地审查该决定。你的目标是在实现成本低于忽视成本的转折点实施边界。\n\n这需要敏锐的观察。\n\
  \n1. 应该很清楚，我们不会对像这种简易的游戏应用清洁架构方法。毕竟，整个程序可能只需要 200 行代码或更少的代码。在这种情况下，我们使用一个简单的程序作为具有显著架构边界的大型系统的代理。\n\
  \n2. 如果你对箭头的方向感到困惑，请记住它们指向源代码依赖的方向，而不是数据流的方向。\n\n3. 在很久以前，我们会把那个顶部组件称为中心变换。参见 *Practical\
  \ Guide to Structured Systems Design*, 第 2 版，Meilir Page-Jones, 1988。\n\n## 26 主组件\n\
  \n![Image](img/00097.jpeg)\n\n在每个系统中，至少有一个组件负责创建、协调和监督其他组件。我将这个组件称为 `Main`。\n\n\
  ### 最终细节\n\n\n\n`Main` 组件是终极细节——最底层的策略。它是系统的初始入口点。除了操作系统之外，没有任何东西依赖于它。它的工作是创建所有的\
  \ `Factories`（工厂）、`Strategies`（策略）以及其他全局设施，然后将控制权交给系统的高抽象部分。\n\n正是在这个 `Main` 组件中，应该由依赖注入框架注入依赖。一旦这些依赖被注入到\
  \ `Main` 中，`Main` 应该正常地分发这些依赖，而不使用该框架。\n\n将 `Main` 视为所有肮脏组件中最脏的一个。\n\n考虑下面这个来自最新版本《捕逐恶兽》（Hunt\
  \ the Wumpus）的 `Main` 组件。注意它是如何加载所有我们不希望代码主体知道的字符串的。\n\n点击此处查看代码图像\n\n```java\n\
