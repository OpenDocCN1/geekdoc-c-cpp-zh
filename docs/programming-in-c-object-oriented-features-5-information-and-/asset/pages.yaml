  md: "template<class T>\n\nThe general form of a template function definition is\
    \ shown as follows:\n\n```\ntemplate <class type> return-type function-name(parameter\
    \ list)\n{\n    // body of function\n}\n```\n\nHere, \"type\" is a placeholder\
    \ name for a data type used by the function. The \"type\" parameter T may be used\
    \ in place of ordinary types within the function definition. The word \"class\"\
    \ is used to mean a class or primitive type. Program 18.2 shows an example of\
    \ a function template. Template functions are addressed like ordinary functions.\
    \ A template may have several parameters as follows:\n\n```\nTemplate<class T,\
    \ class X, class Y, class Z>\n```\n\nTemplate functions provide a generic solution\
    \ for overloaded functions. Instead of writing many functions that share the same\
    \ task, we can write one generic function by using templates. Program 18.3 shows\
    \ another example of function template, where template functions are used to swap\
    \ two integers, floating-point numbers, and two strings. As shown in Program 18.2,\
