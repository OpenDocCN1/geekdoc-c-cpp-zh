    A subclass inherits variables and methods from its **superclass** and all of its
    ancestors, as Program 16.5 shows. Subclasses inherit those base members declared
    as public or protected. (We will see protected keyword in next section.)


    # 16.5 The protected keyword


    As we studied in earlier sections, the private data or method cannot be inherited
    to subclasses, as it is accessible in the same class. But, if we make the data
    or methods public, then they can be accessed everywhere. This is a typical problem
    when we deal with inheritance. In practice, a base class may want to inherit only
    some of its data and methods to subclasses, and not to other classes. In such
    cases, we make use of protected keyword. This keyword is an access specifier for
    data and members of a class. If we make a data or method protected, then it is
    visible only inside the same class, and in any subclass. In summary, we derive
    from a protected class, public and protected members of the base class become
    protected members of the derived class.


    The example to understand protected data members is presented in Program 16.6.
    The subclass is derived from baseclass. The baseclass has three data and one method().
    The subclass is derived from baseclass and only data member a (int a), b (int
    b), and method() can be derived to subclass. Remember that cannot make use of
    c (int c) outside of subclass because it has private access. In the main() method,
    we can access only a (int a) because it is declared public.'
