    \ programming, where one can write the code that is independent of any particular\
    \ data type. In general, templates are a blueprint for creating a generic class\
    \ or a function. In other words, we can use templates to define functions as well\
    \ as classes. Basically there are two types of templates: class templates and\
    \ function templates. Templates can be parameterized by types, compile-time constants,\
    \ and other templates. In C++, the templates are implemented by instantiation\
    \ at compile time.\n\nTo describe the use of templates, let us consider a situation\
