  md: "# 64 3 Programming Basics\n\nvariable can have: **automatic, static, and dynamic**.\
    \ The other property is called **scope**. The lifetime and scope of a variable\
    \ are two different things. The **lifetime** is the period during execution from\
    \ the time the variable was first created to the time when it was destroyed and\
    \ the memory it occupies was freed for. The scope of a variable is the region\
    \ of a program code over which it can be declared and may be accessed. The scope\
    \ of a variable defines the validity of a variable within a part of a program,\
    \ that is, if the variable is outside the scope, it is not possible to use it.\
    \ The variables we have defined so far are called automatic variables, and they\
    \ have automatic storage duration.\n\nThe scope can be broadly classified into\
    \ three categories: (a) inside function or a block, **local variables**, (b) in\
    \ the definition of function parameters, as **formal parameters**, and (c) out\
    \ of all functions, as **global variables**. We will learn about function its\
    \ parameters in Chapter 10.\n\n# Automatic storage duration and local variables\n\
    \nVariables that are declared inside a function or block are called local variables\
    \ or **automatic variables**. They can be used only by statements that are inside\
    \ function or block of code. Local variables are not known to functions outside\
    \ of their own function. These variables are usually declared within a block and\
    \ with pair of braces. They have local scope or **block scope**. The automatic\
    \ variables are created when they are defined. They are automatically destroyed\
    \ at the end of the block. In automatic storage duration, objects exist only at\
    \ certain points during execution. The objects are created and initialized (in\
