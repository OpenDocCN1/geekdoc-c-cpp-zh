  md: '# Bitwise Inclusive OR (or Bitwise OR)


    Bitwise OR is represented by a | (pipe) symbol. The binary representation of the
    two operands involved in bitwise OR is compared by bit. The bitwise inclusive
    OR operation is used when we want to set some bits of a number to 1. Each bit
    that is a 1 in the first operand or a 1 in the second operand will produce a 1
    in the corresponding bit of the result as shown below.


    | 0 | 0 |

    | 0 | 1 |

    | 1 | 0 |

    | 1 | 1 |


    For example:


    ```

    int a = 2, b = 4;

    ```


    Here, 010 represents variable a (in bitwise or binary) and 100 represents 4. So,
    a | b is equal to 6

    010 (bitwise OR) 100 =110 (all in binary)


    # Bitwise Exclusive OR (or Bitwise XOR)


    The bitwise exclusive OR or XOR, which is represented by ^ (caret) symbol gives
    1 if either bit is 1, but not for both. One important point to remember is that
    any value that is XORed with itself results in 0, as shown below. This is used
    by assembly language programmers to test the two values for equality.


    | 0 | 0 |

    | 0 | 1 |

    | 1 | 0 |

    | 1 | 1 |


    It is possible to exchange two numbers without using a temporary location using
    bitwise XOR operator. This seems an interesting use of bitwise XOR operator. Program
    4.3 shows one such example.


    ```

