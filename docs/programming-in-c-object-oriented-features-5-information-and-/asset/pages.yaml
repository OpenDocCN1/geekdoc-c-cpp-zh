    \ identifier value\n```\n\nFor example, we can define an identifier PI with value\
    \ 3.14 as follows:\n\n```\n#define PI 3.14\n```\n\nHowever, while using const\
    \ keyword, the general form for defining constants is as follows:\n\n```\nconst\
