  md: "# 11.2 Defining structures\n\nA structure can be considered as a template used\
    \ for defining a collection of variables under a single name. Structures help\
    \ a programmer in grouping elements of different data types into a single logical\
    \ unit. Unlike structures, arrays permit a programmer to group elements of the\
    \ same data type only. To define a structure, we must use the struct keyword.\
    \ The struct keyword defines a new data type that has more than one member. The\
    \ format to define a structure is as follows:\n\n```\nstruct [structure-tag]\n\
    {\n  member definition;\n  member definition;\n  ..\n  member definition;\n} [one\
    \ or more structure variables];\n```\n\nThe structure tag is optional, and each\
    \ member is defined as a normal variable is defined, such as int; or float; or\
    \ any other valid variable. At the end of the structure's definition before the\
    \ final semicolon, we can specify one or more structure variables; but it is optional.\
    \ Considering the previous example of an item, we can define a structure called\
    \ item with four elements item_name, price, manufacturer, and item_no, as shown\
    \ below:\n\n```\nstruct item\n{\n  char item_name[10];\n  float price;\n  char\
    \ manufacturer[40];\n  int item_no;\n};\n```\n\nThe previous statement does not\
    \ define any variables, but it does define a new type, and the name of the type\
    \ is item. This means when we first define a structure in a file, the statement\
    \ simply tells the C++ compiler that a structure exists, but it does not allocate\
    \ any memory to it. Memory allocation takes place only when a variable is declared.\
    \ The struct keyword defines item as a structure, and the elements making up an\
    \ object of this type are defined within the braces. Note that each line defining\
    \ an element is terminated by a semicolon, and that semicolon also appears after\
    \ the closing brace. The elements of a struct can be of any type, except the same\
    \ type as the struct being defined. A structure type is usually defined at the\
    \ beginning of a program, usually just after the main()"
