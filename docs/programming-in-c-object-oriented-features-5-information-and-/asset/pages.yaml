  md: '# 236 — Exception Handling


    C++ standard library belong to this exception class. The exceptions logic_error
    and runtime_error are standard exception classes. We can use the base classes
    from which we can derive our types of exceptions. The exception classes derived
    from logic_error are: domain_error, invalid_argument, length_error, out_of_range,
    bad_cast, and bad_type, whereas those derived from runtime_error are: ran_error,
    overflow_error, and bad_alloc.


    Table 12.1 lists some of the C++ standard exceptions and their brief descriptions.


    # Table 12.1: Standard C++ exceptions and their descriptions


    +   * exception: It is the parent class of all the Standard C++ exceptions. This
    is the base class for all the exceptions thrown by the C++ standard library. Function
    what() can be used to retrieve the option string with which the exception was
    initialized

    * bad_alloc: Reports a failure to allocate storage.

    * bad_cast: This can be thrown by dynamic_cast for executing an invalid dynamic_cast
    expression in runtime type identification.

    * bad_exception: This is useful device to handle unexpected exceptions in a C++
    program. This can be thrown by type. It reports a null pointer p in an expression
    type(rp).

    * logic_error: It is an exception that can theoretically be detected by reading
    a code. It is derived from exception, and reports program logic errors that could
    presumably detected by inspection.

    * domain_error: This exception is thrown when a mathematically invalid domain
    is used. It reports violations of precondition.

    * invalid_argument: This exception is thrown due to invalid arguments, and indicates
    an invalid argument to the function from which it is thrown.

    * length_error: This is thrown when a too big string is created, and indicates
    an attempt to produce an object whose length is greater than equal to noss (the
    largest representable value of content''s size, type size_t).

    * out_of_range: This can be thrown by the method, for example, a std:: and std::bitset::operator[].
    It reports an out-of-range argument.

    * runtime_error: It is an exception that theoretically cannot be detected by reading
    the code. It reports runtime errors that are presumably detected only when the
    program executes.

    * overflow_error: This exception is thrown if a mathematical overflow occurs.
    It reports an arithmetic overflow.

    * range_error: This exception occurs when one tries to store a value which is
    out of range.

    * underflow_error: This exception is thrown if a mathematical underflow occurs.


    One of advantages of having the knowledge of standard C++ exceptions is that we
    can define our own by inheriting and overriding exception class functionality.
    Program 12.8 uses an exception class to implement the programmer''s own exception.
    In this program, what() is a public method provided by exception class, which
    has been overridden by all the child exception classes.'
