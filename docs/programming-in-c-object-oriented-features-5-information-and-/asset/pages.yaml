  md: "The result of Program 15.1 is shown below:\n\n```\nDate is :1\nMonth is :1\n\
    Year is :2018\n```\n\nIn Program 15.1, the call to setValues() method is explicitly\
    \ made with TODAY. setValues() statement. the setValues() method is used here\
    \ to initialize or set some values of the data members of the class. There may\
    \ be cases where we need to create many instances of class day, such as,\n\n```\n\
    day TODAY;\nday TOMM;\nday YESTERDAY;\nday SUNDAY;\n```\n\nIn such situations,\
    \ we also need to call setValues() method along with the associated objects.\n\
    \n```\nTODAY.setValues();\nTOMM.setValues();\nYESTERDAY.setValues();\nSUNDAY.setValues();\n\
    ```\n\nThis seems to be a time-consuming and repetitive process. We use constructors\
    \ to avoid these problems. A constructor will initialize the objects when they\
    \ are created. Hence, an explicit call to the initializing method (here setValues())\
    \ is avoided. The initial settings of all objects are easily done along with their\
    \ creation without calling any other methods. The main purpose of a constructor\
    \ is to initialize the objects of a particular class with supplied initial values.\
    \ Sometimes, this is called automatic initialization of objects. The general syntax\
    \ of a constructor is as follows:\n\n```\n<class-name> (<parameters)>\n{\n  <statements>\n\
    }\n```\n\nIn the previous example, class-name is the name of the class to which\
    \ this constructor belongs. The constructors are declared in the public section,\
    \ and are invoked automatically when the object is created. They do not have return\
    \ types including void. Moreover, they cannot be inherited; however, a derived-class\
    \ constructor can call the base class constructor. Program 15.1 is rewritten as\
    \ Program 15.2 to illustrate the use of constructors."
