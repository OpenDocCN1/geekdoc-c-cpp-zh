    \ This is called **decision-making**. Decision-making is important in our everyday\
    \ life. For example, if you have more money in your bank account, you may either\
    \ buy a car or for a motorcycle. These kinds of situations are quite common in\
    \ all programming problems. In such cases, we will make use of **selection statements**.\
