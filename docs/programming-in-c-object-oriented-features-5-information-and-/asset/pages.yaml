    # 2.12 Comprehensive understanding of object-oriented concepts in C++


    Here, we will describe a program that features most of the OOP concepts. In the
    subsequent chapters, we will understand most of the object-oriented concepts in
    depth. Program 2.2 includes most of the prominent features of OOP, such as classes,
    objects, access modifiers, constructors, information hiding, inheritance, and
    polymorphism. An **object** is an instance of a **class**. An object has data
    and methods or behavior. A class is used to define data and methods. For example,
    Liu, Fang, and Yan are all students who share many characteristics; these characteristics
    are expressed as data and defined in the class. So, a class is used to define
    data and methods, which are common to all of its objects. In Program 2.2, there
    are three classes: (1) Student, (2) Freshman, and (3) Sophomore. Based on these
    classes, several objects can be created. For example, Fang, Yan, and Liu are objects
    created from the class Student, Freshman, and Sophomore, respectively. As described,
    each class may have many methods and variables. For example, collegename, student_number,
    name, and marks are variables in this program. The get_college_name(), get_name_(),
    get_marks(), and class_grade() are methods within classes.


    The constructors are one of the most powerful features of the object-oriented
    languages. Constructors are used for initializing objects during their creation.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 42 2 Introduction to Object-Oriented Programming and C++


    Initialization of data members is necessary when we deal with multiple objects
    of the same class. A constructor is a special method that is executed when the
    object of that class is created. The name of the constructor must be the same
    as that of the class. For example, in the Program 2.2, the public: Student() is
    a constructor and it has the same name as its class. Constructors are useful to
    initialize the values automatically when the object of that class is created.


    In an object-oriented programming, **inheritance** plays a major role in writing
    large programs. Inheritance property is highly required when we deal with similar
    classes with minor changes. Inheritance enables us to define a new class based
    on an existing class definition. For example, in Program 2.2, Student is a **base
    class** while Freshmen and Sophomore are **derived classes**. This implies that
    many characteristics of Freshmen and Sophomore are derived from the class Student.
    In this case, we call the class of Student as **parent class** or (**super class**
    or **base class**) and the class of Freshmen and Sophomore as **child class**
    or (**subclass** or **derived class**).


    In inheritance, we create or derive a new class similar to the existing class
    but will have some new characteristics. This is very useful when we are making
    modifications to the existing program. For example, a program A needs modifications
    to make a new program B. Instead of developing program B from the scratch, we
    derive the existing features from program A. This makes the programming task easier.
    Thus, the main advantage of inheritance is code reuse.


    Polymorphism is another most essential feature of an object-oriented programming.
    The polymorphism increases the ability of writing programs simpler and reusability.
    The **polymorphism** means many forms (such as many faces). For example, a person
    may be a father at home, an officer at office, or a customer in a restaurant.
    Here, a father, an officer, and a customer all refer to the same person. For example,
    in the Program 2.2, Freshmen is a **subclass** derived from Student class. It
    is also clear that, in general, freshmen or sophomore students are also students.
    So in C++, it is possible to make an instance of **subclass** object as a type
    of **base class**. Here, Sophomore object is a type of Student; it is possible
    Sophomore class is derived from Student. An object can be used either as or type
    or as of its base type. This is possible by a property of C++ called **dynamic
    binding**. As in the program, method can call get_college_name() will automatically
    invoke the method of Sophomore rather than the method of Student (Fig. 2.10).


