    # 3.4 Data types


    The variables in programming languages are used to store information such as integer,
    character, floating point numbers, etc. The variables are reserved memory locations
    that store values. The data types help to store information of different types
    such as integer, character, etc. The representation of data type is machine specific.
    On the basis of the data type of a variable, the operating system allocates memory
    and decides what can be stored in the reserved memory. The basic data types in
    C++ are int, long, char, float, and double. Some of the basic data types can be
    modified by using one or more of these modifiers such as signed, unsigned, short,
    and long. Table 3.1 shows the variable type, number of bytes required to store
    the value in memory, and the maximum and minimum value that can be stored in such
    type of variables.


    Table 3.1: Size and range of C++ basic data types.


    | Data Type | Byte(s) | Range |

    | char | 1 | -128 to 127 |

    | unsigned char | 1 | 0 to 255 |

    | signed char | 1 | -128 to 127 |

    | int | 4 | -2,147,483,648 to 2,147,483,647 |

    | unsigned int | 4 | 0 to 4,294,967,295 |

    | signed int | 4 | -2,147,483,648 to 2,147,483,647 |

    | short int | 2 | -32,768 to 32,767 |

    | unsigned short int | 2 | 0 to 65,535 |

    | signed short int | 2 | -32,768 to 32,767 |

    | long int | 4 | -2,147,483,648 to 2,147,483,647 |

    | signed long int | 4 | -2,147,483,648 to 2,147,483,647 |

    | unsigned long int | 4 | 0 to 4,294,967,295 |

    | float | 4 | ±3.4×10³ with approximately 7-digit accuracy |

    | double | 8 | ±1.7×10³⁸ with approximately 15-digit accuracy |

    | long double | 8 | ±1.7×10³⁸ with approximately 15-digit accuracy |'
