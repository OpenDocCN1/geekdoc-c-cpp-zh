    \ instead, both keywords carry the same meaning. Originally, the developers used\
    \ class to specify types in templates to avoid introducing a new keyword. So worried\
    \ that this overload could lead to confusion, a new keyword typename to resolve\
    \ syntactic ambiguity is introduced later, and decided to let it also be used\
