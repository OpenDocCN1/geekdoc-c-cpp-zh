    \ become zeros. This is a unary operator that operates on an integer constant\
    \ or expression, for example,~12.\n\n# Shift operators\n\nLeft shift and right\
    \ shift operations are analogous to multiplication and division by 10. When we\
    \ divide a number by ten we shift the digits to the right by retaining the decimal\
    \ point. When we multiply by ten we shift the number left and add 0 on the right.\
    \ When a left shift operation (<<) is performed on an operand, the bits of the\
    \ operand are shifted. Bits that are shifted out of the high-order bit of the\
    \ data item are lost and 0s are added through the low-order bit of the operand.\
    \ If a is a variable with the value of 2, a left shifting twice results in value\
    \ 8 as shown in Table 4.4. Here, the number 2 represented using 8 bits. It is\
    \ worth noting that bits “fall off” from either end of the variable are lost.\n\
    \nTable 4.4: Example of left shift (<<) operation.\n\n| Operation | Bitwise Representation\
    \ | Result |\n| --- | --- | --- |\n| Initial bit position of number 2 | 00000010\
    \ | a = 2 |\n| Shifting to once, bit 1 is moved to left | 00000100 | a = 4 |\n\
    | Shifting to twice, bit 1 is moved to left | 00001000 | a = 8 |"
