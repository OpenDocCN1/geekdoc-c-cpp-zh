  md: "# 12.2 Handling exceptions\n\nThe objective of exception handling mechanism\
    \ is to provide ways to detect and report an \"exceptional circumstance,\" so\
    \ that appropriate action can be taken at the right time. In general, the exception\
    \ handling mechanism handles these tasks: (a) find the problem with a possibility\
    \ of exception, (b) inform that an error has occurred or throw an exception, (c)\
    \ receive the error information or catch the exception, and finally (d) take the\
    \ corrective actions or handle the exceptions. When an exceptional circumstance\
    \ arises within a block, an exception is thrown that transfers control to the\
    \ exception handler. If no exception is thrown, the code continues normally and\
    \ all handlers are ignored. An exception is thrown by using the throw keyword\
    \ from the inside of the try block. Exception handlers are declared with the catch\
    \ keyword that must be placed immediately after the try block. Hence, in C++,\
    \ the exception handling mechanism is handled by using three keywords, namely\
    \ try, catch, and throw. The brief details of these three are described below.\n\
    \n+   **try:** In the block, the part of program or code that may generate exceptions\
    \ is included, and it is followed by catch block. The block is enclosed by braces\
    \ {}. When an exception is generated within this block, it is thrown, and the\
    \ control is transferred to an exception handler. If no exception is thrown, the\
    \ program continues its execution normally and all handlers are ignored.\n**catch:**\
    \ The purpose of catch keyword is to catch an exception where the data type of\
    \ the catch argument matches with exception type. The catch block must be placed\
    \ immediately after the try block. When an exception is caught, the code in the\
    \ catch block is executed. The catch block catches the exception \"thrown\" by\
    \ the throw statement in the try block.\n**throw:** As mentioned earlier, a program\
    \ throws an exception during exceptional circumstances. The exceptions are thrown\
    \ by using the throw keyword, and they can be thrown anywhere within a code. The\
    \ type of the exception is also determined by the throw statement. The general\
    \ format of handling exceptions in C++ is shown as follows:\n\n```\ntry {\n  \
    \  //Statements that may throw an exception\n}\n```\n\n```\ncatch (type argument)\
    \ {\n    //Statements to handle exception type\n}\n```\n\nExample 12.4 shows a\
    \ simple example to use the try-catch block, where an integer number is thrown\
    \ and processed by the catch block."
  merge: -1
  img_proc: true
