  md: '# 3.7 Input and output manipulators


    A manipulator modifies the way in which data output (or input from) a stream is
    handled. In other words, they are helper functions that make it possible to control
    input/output streams using operator << or operator >>. Manipulators are defined
    in the standard library header file iomanip, so we need #include directive for
    it. Let us consider a statement that is shown below:


    ```

    cout << "Hello, world!" << endl;

    ```


    This statement contains a manipulator endl. This is an object, which when supplied
    to operator <<, causes a newline character to be put into the output stream, by
    a call of cout''s flush function that causes the internal buffer to be immediately
    emptied. This means that all of the output is displayed before the program goes
    on the next statement. So manipulators are objects that cause the output stream
    object to do something, either to its output, or to its member variables. Manipulators
    with no arguments, such as endl, are included in <iostream>. The commonly used
    manipulators are listed in Table 3.3.


    Table 3.3: Commonly used manipulators in C++.


    | Manipulator | Description |

    | --- | --- |

    | dec, hex, oct | Changes the base used for integer I/O |

    | endl | Outputs \n" and flushes the output stream |

    | fixed, scientific | Changes formatting for floating-point I/O |

    | set | Changes the field character |

    | setflags | Sets the ios_base flags |

    | setprecision | Changes floating-point precision |

    | setw | Changes the width of the next input/output field |


    Program 3.11 shows an example that summarizes the application of manipulators.
    The setw(n) causes the output value that follows to be right-justified in a field
    that n spaces wide, so setw(6) causes the next output value to be presented in
    a field with a width of six spaces. The setw() manipulator works only for the
    single-output value, and follows its insertion into the stream immediately. So,
    we have to insert the manipulator into the stream immediately preceding each value
    that we want to output within a given field width.


    ```

    // Program 3.11

    // Input and output manipulators

    #include <iostream>

    #include <iomanip>

    ```'
