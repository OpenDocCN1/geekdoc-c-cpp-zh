    \ function \" << endl;\n}\n\nint main ()\n{\n    cout << \" This is main() function\"\
    \ << endl;\n    print_message();\n    cout << \" Statement after function execution\
    \ \" << endl;\n    return 0;\n}\n```\n\nThe result of Program 10.1 is as follows:\n\
