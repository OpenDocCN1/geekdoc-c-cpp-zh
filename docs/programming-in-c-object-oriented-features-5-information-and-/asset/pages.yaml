  md: '# 3 Programming Basics


    The scholar who cherishes the love of comfort is not fit to be deemed a scholar.

    Confucius


    # 3.1 Introduction


    It is important to understand simple C++ programs to study the basics of programming.
    Almost all C++ programs are wrapped around identifiers, variables, keywords, literals,
    data types, and methods. In this chapter, we will explain all of these fundamental
    programming concepts that are significant to understand the nuts and bolts of
    a programming language such as C++.


    # 3.2 Variables and identifiers


    Suppose, we want to perform an operation, that is, calculate the sum of two numbers
    a and b and store the result in c, then it is represented as:


    ```

    c = a + b

    ```


    To perform this operation in a program, we must decide the kind of data types
    the numbers are. Let us say that all of them are integers, we first declare a,
    b, and c as integers. Integers are natural and whole numbers that do not include
    decimals or fractions. Then, the statements in a program must include the following:


    ```

    int a,b,c;

    c = a + b;

    ```


    The previous two statements are responsible for allocating memory locations to
    store data values a, b, and c where a, b, and c are the names associated with
    respective memory allocations. These names are called variables.

    The general syntax for variable declaration is as follows:


    ```

    <data type><variables>;nExample: int a,b,c;

    ```


    Here a, b, and c are variables and int is the data type. The above declaration
    can also be written as follows:


    ```

    int a;

    int b;

    int c;

    ```'
