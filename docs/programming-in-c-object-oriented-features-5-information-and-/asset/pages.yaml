  md: '# Procedural Programming Languages


    Procedural programming specifies a list of operations that the program must complete
    to reach the desired state. Each program has a starting state, a list of operations
    to complete, and an ending point. This approach is also known as imperative programming.
    Integral to the idea of procedural programming is the procedure call.


    Procedures, also known as functions, subroutines, or methods, are small sections
    of code that perform a particular function. A procedure is a list of computations
    to be carried out effectively. Procedural programming can be compared to unstructured
    programming, where the entire code resides in a single large block. By splitting
    the programmatic tasks into small pieces, procedural programming allows a section
    of code to be re-used in the program without making multiple copies. It also makes
    easier for programmers to understand and maintain program structure. Two of the
    most popular procedural programming languages are FORTRAN and BASIC.


    # Structured Programming Languages


    Structured programming is a special type of procedural programming. It provides
    additional tools to manage the problems created by larger programs. Structured
    programming requires that programmers break structure into small pieces of code
    that are easily understood. It also opposes the use of global variables and instead
    uses variables local to each subroutine. One of the well-known features of structural
    programming is that it does not allow the use of the GOTO statement. The top-down
    approach begins with an initial overview of the system that contains minimal details
    about the different parts. Subsequent design iterations then add detail to the
    components until the design is complete. The most popular structured programming
    languages include C, Ada, and Pascal.


    # Object-Oriented Programming Languages


    Object-oriented programming is one of the newest and most powerful paradigms.
    In object-oriented programs, the designer specifies both the data structures and
    the types of operations that can be applied to those data structures. This pairing
    of a piece of data with the operations that can be performed on it is known as
    an object. A program becomes a collection of cooperating objects, rather than
    a list of instructions. Objects can store information and interact with other
    objects, but generally each object has a distinct and limited role.


    There are several key concepts in object-oriented programming. A class is a template
    or prototype from which objects are created, so it describes a collection of'
