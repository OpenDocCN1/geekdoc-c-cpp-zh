  md: "# 10.4 Scope of function variables\n\nIn this section, we will consider some\
    \ complex examples related to functions. One of the main benefits of function\
    \ is that they can be called number of times, if necessary, and also a function\
    \ in turn call another function, and so on. If there is more than one function,\
    \ sometimes, it may be necessary to use the same variable throughout the functions.\
    \ So, we have to consider the scope of local and global variables.\n\nThe variables\
    \ related to the function can be declared in different regions of the program.\
    \ The scope in general is a region where variable holds its value. In C++, a variable\
    \ can be declared in three places: (a) inside a function or a block, which is\
    \ called local variables; (b) in the definition of function parameters, and (c)\
    \ outside of all functions, which is called global variables. In this section,\
    \ we will describe the importance of local and global variables.\n\n# Local variables\n\
    \nLocal variables are local to a function, which are declared inside a function\
    \ block. They are created every time a function is called and destroyed on returning\
    \ from that function. These variables cannot be accessed outside a function or\
    \ block of code. Program 10.5 demonstrates the application of local variables.\n\
    \n```\n// Program 10.5\n// Demonstration of local variables\n#include <iostream>\n\
    using namespace std;\n\nvoid fun(int t1, int t2)\n{\n    int a, b; //local variables\
    \ within function\n    a = t1;\n    b = t2;\n    cout << \" Inside function :\
    \ a = \" << a \n         << \" , b = \" << b << endl;\n}\n\nint main()\n{\n  \
    \  int a, b;//local variables within main()\n    a = 2;\n    b = 3;\n    fun(a,\
    \ b);\n    cout << \" Inside main : a = \" << a << \", b = \" << b << endl;\n\
    \    a = 4;\n}\n0\n```"
