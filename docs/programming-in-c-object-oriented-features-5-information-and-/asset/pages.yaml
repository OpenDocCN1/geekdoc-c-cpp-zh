    # 10.1 Introduction


    In this chapter, we will study about importance of functions in C++. The general
    advantage of using functions is to make the program modular and to avoid repetition
    of code. Any piece of code that is used repeatedly in a program is likely to be
    a candidate for being a function. It is a common practice to divide the program
    into manageable pieces of code by function when the program size grows. This is
    also one of the major principles behind top-down and structured programming concepts.
    The functions allow structuring programs of code to perform individual tasks.
    As we have seen in previous chapters, every C++ program has at least one function,
    which is main(). In C++, a function is a group of statements that gives a name,
    which can be called from some point of the program. A programmer has the flexibility
    to divide his code into separate functions. While using function, we have to consider
    function declaration, function definition, and function call. The function is
    called when necessary, and the control returns after the execution of function
    to main(). A function declaration tells the compiler about a function''s name,
    return type, and parameters. A function definition provides the actual body of
    the function. The term function is interpreted in different languages, for example,
    the terms subroutine and procedure also carry the same meaning as functions.

    Functions are the small modules of the program that perform operations, and they
    are executed when they are called. There are several benefits of using functions.
    First, they are easier to code and understand. Second, the debugging of a large
    program is easier, and this makes maintenance simple. Third, they support readability
    of code. Finally, by using functions a programmer can write a program for complex
    programs by structuring them into different submodules. There are two types of
    functions: user-defined functions and built-in functions (Fig.10.1). Built-in
    functions are also known as library functions. The user-defined functions are
    designed by the user, and user have the flexibility to name and use them as the
    program requirement. However, built-in functions are already defined in C++ language,
    and provide flexibility to use them without understanding the code beneath. So,
    we need not to declare and define these functions as they are already written
    in the C++ libraries such as cmath. To use built-in functions, we must include
    the appropriate header file within the program. Majority of sections in this chapter
    discuss the user-defined functions, whereas Section 10.10 provides an overview
    of built-in functions in C++.'
