    # ## 9.1 Introduction


    In this chapter, we will study different sorting and searching methods. The sorting
    and searching methods are very useful in today''s computing environment and are
    used in almost all kinds of applications such as students'' database, telephone-directory,
    employee database information, and travel database applications. Sorting is useful
    to arrange the different kinds of data, for example, numbers, names, and pictures,
    in a definite order, where searching is used to search an item in the given list.


    # ## 9.2 Searching


    There are different kinds of searching methods but we will be focusing on the
    most common methods. In searching, the objective is to search an item from the
    set of items in a given list. The list may be of numbers, values, or strings.
    Searching is very useful in retrieving information from a large database. The
    database may have huge amount of data and to retrieve the necessary data from
    such a database may take time. To solve such problems, we use most commonly used
    searching algorithms such as linear search and binary search methods.


    # ## 9.3 Linear search


    The linear searching is the simplest and easiest searching method. It is also
    called sequential. It has a precondition (i.e., condition necessary before searching)
    that there should not be any multiple or duplicate entries of the same data. To
    understand this, let us consider the following list of numbers:


    +   - 23, 45, 67, 89, 45, 34, 99


    In the above list there are seven numbers, but the number 45 is repeated twice.
    So, linear search method will not apply to this list as there are multiple entries
    of same data item. Let us consider following list of numbers:


    +   - 1, 34, 67, 18, 11, 11, 78'
