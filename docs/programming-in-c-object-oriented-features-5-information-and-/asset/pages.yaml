    # 14.1 Introduction


    In this chapter, we will study the most important part of object-oriented programming,
    that is, classes and objects. The most common object-oriented programming (OOP)
    languages are C++ and Java. Languages such as C, PASCAL, FORTRAN, and so forth
    are usually called procedure-oriented or structured programming languages. In
    recent years, many programmers have found OOP to be a better approach than procedure-oriented
    programming.


    Software is basically a collection of many interrelated programs that in turn
    consist of data and methods. In traditional programming languages, data and methods
    are loosely tied together. Hence, it is difficult to find which data belongs to
    which function? In addition, traditional procedure-oriented languages are not
    able to represent real-time entities or situations. A few examples of real-time
    entities are bank, customer, university, and student. OOP solves all these problems
    by providing an effective way to represent real-time entities through objects
    and classes, two most important concepts in object-oriented programming. Every
    reader or programmer must be aware of these concepts.


    # 14.2 Object definition


    What is an object?


    Object is the key feature of OOP. If we see around us, we may notice many real-world
    objects such as dog, bag, computer, pen, telephone, and so forth. These objects
    may be both tangible and intangible. If we analyze all these objects, we notice
    that they share two common characteristics as data and behavior. Let us take an
    example of a dog object. The data related to this object are name, age, height,
    and weight. Other than this data, a dog may exhibit some behaviors, such as walking,
    barking, biting (sometimes)!, eating, and so forth.


    In general, every object has two fundamental features called data and behavior.
    The data of an object is basically represented by data type, and related behavior
    is represented by a method in OOP. The object is a software entity with both data
    and methods.'
