    with each stream object as follows:


    ```

    inFile.open("input.data");

    outFile.open("output.data");

    ```


    This sets up the file to read data from a file called "input.data" and write output
    to a file called "output.data." For an input stream, if the specified file does
    not exist, it will not be created by the operating system, and the stream variable
    will contain an error flag. This can be checked by using the member function fail().
    For an output stream, if the specified file does not exist, it will be created
    by the operating system. We may also connect a stream variable to a file when
    the stream variable is declared as follows:


    ```

    ifstream inFile("input.data");

    ofstream outFile("output.data");

    ```


    This also sets the file streams to read data from a file called "input.data" and
    write output to a file called "output.data." The only difference between this
    approach and using the open() function is compactness. If we are to use a string
    constant (or variable) to store the file name, we must add a special conversion
    when connecting the stream:


