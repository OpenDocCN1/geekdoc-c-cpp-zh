  md: '# # Introduction to Computers and Programming


    Opportunities multiply as they are seized.

    —Sun Tzu


    # ## 1.1 History of computers


    Computers are used everywhere in the world these days. History of computers goes
    back to Abacus, a simple calculating device, invented in China around second century
    BC. We can see this device in China and other countries till date. Many scientists
    agree that Abacus is the first computer of its kind. Later in 1614, John Napier
    from Scotland invented the log method that reduces multiplication and division
    to addition and subtraction, respectively. In 1642, Blaise Pascal built a mechanical
    calculator that had the capacity for eight digits. Later, Joseph-Marie Jacquard
    of France invented an automatic loom controlled by punched cards.


    In 1820s, Charles Babbage, the famous English mathematician, invented Difference
    Engine, but he stopped his work and developed Analytical Engine later. The Analytical
    Engine is a mechanical computer that could solve problems by using cards. This
    revolutionary invention of Babbage led to the development of more advanced computers
    at that. For his great contribution, Charles Babbage is widely known as the Father
    of Computers. Many years later, Konrad Zuse, a German engineer, developed the
    first general-purpose programmable calculator in 1945. University of Pennsylvania''s
    Moore School of Engineering completed the work of Electronic Numerical Integrator
    Analyzer and Computer (ENIAC). Later in 1947, Bell Telephone Laboratories developed
    the transistor. This facilitated a rapid development of computers with greater
    capability.


    After the evolution of digital computing, the computer technology changed rapidly.
    Many improvements were made in internal organization of computers and computer
    programming languages. Later, many programming languages were developed to support
    various applications of computers.


    # ## 1.2 Introduction to computer and computer science


    Computer is a machine that is used to perform calculations. Computer can be programmed
    to perform many tasks. It can do repetitive tasks quickly and efficiently. It
    has a large capacity to store, retrieve, and manipulate data. The physical components
    of a computer are known as hardware. The main components of a computer are: Central
    Processing Unit (CPU), Input, Output, and Memory. The CPU acts as brain of the
    computer and executes a program (or software) that instructs the computer'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 1 Introduction to Computers and Programming


    about what is to be done. Input and output (I/O) devices allow the computer to
    communicate with the user and the outside world. Input device is used to receive
    data and output device is used to display or produce the information. Memory is
    used to store the data and information.


    Sometimes, computer science is viewed as the study of algorithms. This encompasses
    four distinct areas:


    +   1. Machines for executing algorithms

    2. Languages for describing algorithms

    3. Foundations of algorithms

    4. Analysis of algorithms


    An algorithm is a finite set of instructions that, if followed, accomplish a particular
    task. Moreover, studying algorithms is fundamental to understand computing principles.
    If you study computing for many years, you will study algorithms of frequently
    used processes. A number of books have been written about algorithms for common
    activities, such as storing and ordering data. Although it is easy to find standard
    algorithms for those parts of programs that do common activities, one may develop
    algorithms for unique problems. Two commonly used tools to help document program
    logic (the algorithm): flowcharts and pseudocode. Generally, flowcharts work for
    small problems, but pseudocode is for larger problems. Algorithms are written
    in pseudocode that resembles programming languages as C or Pascal. Every algorithm
    must satisfy the following criteria:


    +   1. Input: zero or externally supplied quantities should be there;

    2. Output: at least one quantity should be produced;

    3. Definiteness: each instruction must be clear and unambiguous;

    4. Feasibility: if we trace out the instructions of an algorithm, then for all
    cases the algorithm will terminate after a finite number of steps;

    5. Effectiveness: every instruction must be sufficiently basic, so that it can,
    in principle, be carried out by a person using only pencil and paper. It is not
    necessary that each definite operation also be feasible.


    The term algorithm was originally derived from the pronunciation of the name Abu
    Ja''far Mohammed Musa al-Kwarizmi, who was an Arabic mathematician and had invented
    a set of rules for performing the basic arithmetic operations (addition, subtraction,
    multiplication, and division) on decimal numbers. An algorithm is the representation
    of a solution to a problem. The obstacles to overcome in using a computer to solve
    our problems is by translating the idea of the algorithm to computer code (or
    program). Usually people cannot understand the actual machine code that the computer
    needs to run a program, so programs written in a programming language such as
    C or Pascal, which is then converted into machine code for the computer to run.
    In the problem-solving phase of programming, programmers usually spend much of
    their time on designing'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.3 Introduction to software


    algorithms. This means that students will have to be conscious of the strategies
    to solve problems in order to apply them to programming problems. These algorithms
    can be designed by the use of flowcharts or pseudocode.


    A flowchart is a diagram made up of boxes, diamonds, and other shapes, connected
    by arrows, where each shape represents a step in the process, and the arrows show
    the order in which they occur. Flowchart combines symbols and flowlines, to show
    figuratively the operation of an algorithm. From this common understanding, a
    use of interesting things may happen. For example, process-improvement ideas will
    arise spontaneously during a flowchart session. Moreover, after flowcharting,
    one may write a detailed procedure to solve a problem, which is a good way of
    documenting a process. Process improvement starts with an understanding of the
    process, and flowcharting is the first step toward understanding. Flowchart uses
    symbols that have been in use for a number of years to represent the type of operations
    and/or processes being performed. The standardized format provides a common method
    for people to visualize problems in the same manner. The use of standardized symbols
    makes flowcharts easier to interpret; the sequence of activities that make up
    the process is more important. The pseudocode also describes the essential steps
    to be taken, without graphical enhancements. In the recent years, a general-purpose,
    developmental modeling language like Unified Modeling Language (UML) has popularly
    used to visualize the design of a system.


    A program is a set of quite a number of commands. It goes through many steps during
    its development. A typical program development may have the following steps:


    +   1. Requirement Analysis: In this step, a programmer tries to understand what
    the program is proposed to do?


    +   2. Program Design: After understanding the requirements, the programmer draws
    conclusions about how to do it. In this step, the programmer creates a strategy
    to achieve the goal. One of the techniques used during the design phase is drawing
    a flowchart of the program. In the flowchart, different shapes represent different
    kinds of steps, such as input and output, decisions, or calculations.


    +   3. Coding: In this step, the programmer writes the program in a chosen language.


    +   4. Testing: The programmer tests the program against the requirements of Step
    1.


    +   5. Documentation: An important part of any program development is documentation.
    It is a good practice to have documents for every program we write. The documents
    explain other readers what we did, why we did it, and how we did it.


    # 1.3 Introduction to software


    The computer hardware includes physical devices as keyboard, mouse, monitor, etc.
    The software includes a set of programs. Software allows us to perform'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1 Introduction to Computers and Programming


    various tasks by using computer. These tasks include word processing, database
    computations, programming, etc. Two common software types are system software
    and application software. System software is responsible for controlling, integration,
    and managing the individual hardware components of a computer system. The operating
    system is the most important system software that generally interacts with the
    computer hardware. The application software is used to perform specific applications
    such as drawing software, imaging software, etc.


    Software is developed by using programming languages. There are many types of
    programming languages such as, interpreter or compiler-based languages. Software
    can be developed by using any of these types of languages depending on the application.
    General software is a collection of programs and routines that work together to
    perform a specific operation. A program is a set of instructions written in a
    particular language.


    Over the years, the development of software is becoming increasingly complex.
    To develop the software development process, a number of software-based tools
    are developed. In general, there are five main steps during the development of
    software, which become major part of Software Development Life Cycle (SDLC). The
    main goals of SDLC are to reduce and minimize the risks involved in development.
    The software project planning, organizing, and maintenance are based on SDLC models.
    Some of the important and popular SDLC models are waterfall model, iterative model,
    spiral model, fountain model, V-model, and big bang model.


    The simplest, most straightforward, and oldest SDLC model is the waterfall model.
    In this model, a number of activities are organized in a sequential manner. As
    shown in Fig. 1.1, each activity is followed after completion of the previous
    activity:


    +   1. Requirements gathering (or analysis)

    2. Design

    3. Coding (or implementation)

    4. Testing

    5. Delivery or maintenance


    ![](img/7f9692ccbdc64225fae08eb0ce84bee5_18_0.png)


    Fig. 1.1: Waterfall Model.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.3 Introduction to software


    In software testing, verification and validation (V&V) is the process of checking
    that a software system meets the requirement specifications. The validation tests
    answer the question: *Are we building the right software?* On the other hand,
    the verification tests answer the following question: *Are we building the software
    right?*


    Although waterfall model is simple, and easy to understand, it has a few disadvantages.
    For example:


    +   1. Delays are highly probable in this model, because there is a little scope
    for revision once a phase is completed.


    +   2. Moreover, any problems in the intermediate phases cannot be fixed until
    we reach the maintenance stage.


    Logical improvement to the waterfall model resulted in the fountain model. In
    a fountain, water rises up to the middle and then falls back, to the pool below
    or re-rained at an intermediate level. The same activities as in the software
    development of the waterfall model are used in fountain model in the same sequence.
    However, there is an overlap and iteration in the fountain model is a graphical
    representation to remind us that although some life cycle activities cannot start
    before, there is a considerable overlap and merging of activities across the full
    cycle.


    Another flexible model in SDLC is the spiral model that emphasizes the needs to
    revisit the early stages as many times as the project progresses. This allows
    multiple rounds of refinement. This takes the cues from iterative model and repetition
    of activities in the same. This model can also be viewed as a series of short
    waterfall cycles, where each cycle is producing an early prototype representing
    a part of the entire project. Main advantage of this model is that the customers
    are able to grasp the idea of project in the early part of the cycle.


    In recent years, software prototyping concept has also been very popular. In general,
    a **prototype** is a working model of software with some limited functionality.
    The software prototyping facilitates an understanding of the customer requirements
    at an early stage of development. With prototyping, the users have the chance
    to evaluate the software and it before final implementation. This helps get valuable
    feedback from the customers. It also helps software designers and developers understand
    about what exactly is expected from the software development.


    Percentage of costs incurred during the different phases of SDLC is quite different
    from what software engineers imagine. It can be observed that the maintenance
    of software is 60%, whereas all the other costs are only 40%. Hence, maintenance
    is an important factor to be considered in the software development process. Also,
    earlier programming languages did not support reusability. An existing program
    cannot be reused because of the dependence of the program on its environment.
    Thus, these two major problems demanded a new programming approach, **software
    maintenance** and **software reuse**.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 6 1 Introduction to Computers and Programming


    # 1.4 Programming languages


    A program is a means of instructing computer what to do. As we know, computers
    can understand only 0 and 1, that is, binary code, so there should be a means
    of translating the program code into 1s and 0s. A program is usually written in
    high-level language similar to English, instead of binary codes. A compiler is
    a program that translates the language''s statements into 0s and 1s for the computer
