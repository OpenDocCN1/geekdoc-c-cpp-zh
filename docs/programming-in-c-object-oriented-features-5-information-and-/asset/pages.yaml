  md: "# 3.6 Type casting\n\nHere, the value of a is promoted from short to without\
    \ the need of any explicit operator. This is known as a standard conversion. Standard\
    \ conversions affect fundamental data types and allow the conversions between\
    \ numerical types such as short to int, in to float, double to int, etc. These\
    \ types of conversions also happen in bool and some pointer conversions. However,\
    \ converting to int from smaller integer type, or to double from float is known\
    \ as promotion, and is guaranteed to produce the exact same value in the destination.\
    \ Other conversions between arithmetic types may not always be able to represent\
    \ the same value exactly.\n\nIn some special cases, there is need for explicit\
    \ conversion, which is widely known as typecasting. Type casting involves casting\
    \ one type of data to another implicitly or explicitly. There are two types of\
    \ type casting, explicit casting and implicit casting. Explicit casting occurs\
    \ when we deliberately change the data type of value. Implicit conversions occur\
    \ when two unequal types are represented in an equation, and they are adjusted\
    \ to be of the same type. This happens internally without our knowledge. In Program\
    \ 3.10, it is evident that by assigning a double to integer, the decimal portion\
    \ is lost, however, this is not the case if we use b = a; instead of a = b;\n\n\
    ```\n// Program 3.10\n// Program to understand Type Casting in C++\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    int a=100;\n    double b=3.145;\n \
    \   cout << \"Value of a = :\" << a << endl;\n    cout << \"Value of b = :\" <<\
    \ b << endl;\n    return 0;\n}\n```\n\nThe result of Program 3.10 is shown below:\n\
    \n```\nValue of a = :3\nValue of b = :3.145\n```\n\nIf we change the statement\
    \ a=b; to statement b=a; then we will obtain the following results. This will\
    \ be so because float, being the higher data type, can easily accommodate the\
    \ value stored in an int.\n\n```\nValue of a = :100\nValue of b = :100\n```"
