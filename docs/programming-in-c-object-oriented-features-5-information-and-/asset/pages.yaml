    # 9.4 Binary search


    In Section 9.3, we studied linear search. In this section, we study about an improved
    method of linear search called binary search. This is also used to search an item
    from a given list. The binary search is faster than the linear search, but the
    precondition for this method is that the list must be in sorted order. This means
    that the members of the list must be arranged in ascending order (from smaller
    data item to larger) or descending order (from larger data to smaller).


    In binary search method, we first compare the item to be searched with the middle
    position of the list. In this case the result may be of the following type:


    +   1. The item to be searched is same as the item in the middle location of the
    array. This means that the item is found and the location is added to the middle
    location.

    2. The item to be searched is smaller than the item in the middle location of
    the array. This means that the item must be in the first half of the array.

    3. The item to be searched is greater than the item in the middle location of
    the array. This means that the item must be in the second half of the array.


    We assume that there are no duplicate items in the given list. We consider the
    following list of numbers:


    ```

    1,11,18,34,67,78,11,18,121

    ```


    This can be declared as array list[8]


    ```

    int list[8]={1,11,18,34,67,78,11,18,121};

    ```


