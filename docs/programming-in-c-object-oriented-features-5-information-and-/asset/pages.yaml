  md: "# 10.2 Defining a function — 175\n\nA function declaration informs the compiler\
    \ a function's name, return type, and parameters. A function definition provides\
    \ the actual body of the function. As mentioned earlier, a function may return\
    \ a value. The return-type is the data type of the value function returns. Some\
    \ functions perform the desired operations without returning a value. In this\
    \ case, the return type is the void. The function-name is the actual name of the\
    \ function or the identifier by which the function can be called. The function\
    \ name and the parameter-list together constitute the function signature. A parameter\
    \ is similar to a placeholder. When a function is invoked, we pass a value to\
    \ the parameter. The value is referred to as actual parameter or argument. The\
    \ parameter list refers to the type, order, and number of the parameters of a\
    \ function. Parameters are optional, that is, a function may contain no parameters.\
    \ The function body contains a collection of statements that define the activity\
    \ of the function.\n\nAs shown above, the return statement is optional. If there\
    \ is no return type, we declare the return type as void. The void function indicates\
    \ that the function does something, but returns nothing to main(). We will understand\
    \ the significance of return statement with the help of few examples. First, let\
    \ us consider Program 10.1 with void function. This is a simple program, where\
    \ the main() calls a user-defined function print_message(), and after printing\
    \ the statements on the screen, the control automatically returns to main(). Moreover,\
