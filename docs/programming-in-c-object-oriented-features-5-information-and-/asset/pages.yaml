    \ Standard template library\n\nIn C++, standard template library or STL provides\
    \ a set of well-structured generic C++ components that work together in seamless\
    \ ways. They contain a collection of classes and function templates. This includes\
    \ helper class and function templates, container and iterator class templates,\
    \ generic algorithms that operate over iterators, function objects, and adaptors.\
    \ The C++ STL is a powerful subset of C++ templates that implement many popular\
    \ and commonly used algorithms and data structures, such as vectors, lists, queues,\
    \ and stacks. The C++ STL includes three well-structured core components: containers,\
    \ algorithms, and iterators. Containers are used to manage collections of objects\
    \ of a certain kind. There are different types of containers, such as deque, list,\
    \ vector, map, and so forth. Algorithms act on containers by providing by which\
    \ initialization, sorting, searching, and transforming of contents are performed.\
    \ Iterators are used to step through the elements of collections of objects. These\
    \ collections may be containers or subsets of containers. Some of the standard\
    \ templates in C++ are shown in Table 18.1.\n\nIn this chapter, we will elaborate\
    \ on vector STL. Vectors are useful when we have an unknown sequence of items\
