    \ to pointer\n\nSo far, we have studied the pointers are special variable that\
    \ stores the address of another variable. Here, a question might arise: Is it\
    \ possible to store the address of the pointer itself? The answer is Yes. In C\
    \ and C++, it is perfectly legal for a pointer to point to another pointer. Let\
    \ us consider an interesting scenario\n\nOne day, while locating a street in Beijing,\
    \ you discover a person A, who agrees to guide you. Unfortunately, the person\
    \ A is unable to locate the street you are looking for; he calls his friend B\
