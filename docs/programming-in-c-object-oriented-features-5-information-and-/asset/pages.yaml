  md: "52 3 Programming Basics\n\n# 3.5 C++ Literals and constants\n\nThe literals\
    \ are used to define constants. In programs, the literals directly refer to fixed\
    \ values that the program may not alter are called literals. For example, \"Hello\"\
    \ is a literal constant. The commonly used literals are characters, strings, and\
    \ numbers. So, constants can be of any data type, and they are divided into integer\
    \ numerals, floating-point numerals, characters, and Boolean values.\n\n# Integer\
    \ literals\n\nIn general, we use the decimal numbers, however, an integer literal\
    \ in C++ can also be octal or hexadecimal. For representing a hexadecimal number,\
    \ the prefix 0x or 0X is used. For representing an octal number, 0 is used as\
    \ prefix. Nothing is used as prefix for representing a decimal number. An integer\
    \ literal can also have a suffix that is a combination of U and L, for unsigned\
    \ and long, respectively. The suffix can be uppercase or lowercase and can be\
    \ in any order. Here are some examples of integer literals.\n\n```\n42      //\
    \ decimal literal\n015     // octal literal\n0xFF    // hexadecimal literal\n\
    02ef   // hexadecimal literal\n18u    // unsigned integer literal\n78l    // long\
    \ literal\n56ul   // unsigned long literal\n6555LU // unsigned long literal\n\
    ```\n\nProgram 3.3 demonstrates the use of integer literals in C++. Also note\
    \ that the results are displayed in decimals equivalents of octal and hexadecimal\
    \ numbers, however, C++ also provides ways of displaying them in their original\
    \ form.\n\n```\n// Program 3.3\n// Integer Literals\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    int num1 = 42;      // decimal literal\n\
    \    int num2 = 015;     // octal literal\n    int num3 = 0xFF;    // hexadecimal\
    \ literal\n    int num4 = 02ef;   // hexadecimal literal\n    int num5 = 18u;\
    \     // unsigned integer literal\n```"
