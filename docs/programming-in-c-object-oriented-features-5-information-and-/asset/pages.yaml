    # The standard output stream (cout)


    The basic data type for I/O in C++ is streams. There are several stream types
    in C++, and most common stream types are the standard I/O streams. The cin is
    a built-in input variable that is by default connected to keyboard. Similarly,
    cout is another built-in output stream variable that is by default connected to
    console. In addition, C++ supports all the I/O mechanisms that were included in
    C language. In addition, C++ streams provide all the I/O capabilities of C, with
    substantial improvements.


    To get information out of a file or a program, we need to explicitly instruct
    the computer to output the desired information. One of accomplishing this in C++
    is by using an output stream. In order to use the standard I/O streams, we must
    have the pre-compiler directive #include<iostream> in our program. In order to
    output on the screen, we merely use a statement, as as:


    ```

    cout << " Value = " << << value;

    ```


    where, value is the name of a variable or constant that we want to write to the
    screen. The << is called insertion operator that points in the direction of the
    data flow. The predefined object cout is an instance of o class. The cout object
    is said to be "connected" to the standard output device that usually displays
    the screen. The cout is used in conjunction with the stream insertion operator
    that is written as << (two less signs). The C++ compiler also determines the data
    type of the variable to be and selects the appropriate stream insertion operator
    to display the value. The << operator is overloaded to output data items of built-in
    types like float, double, string, and pointer values. The insertion operator <<
    may be used more than once in a single statement as shown previously, and endl
    is used to add a new line at the end of a line.'
