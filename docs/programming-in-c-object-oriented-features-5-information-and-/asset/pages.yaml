    # ## 13.1 Introduction


    This chapter describes basic input and output along with I/O streams in C++. It
    also focuses on dealing with file handling operations and some stream classes.
    The input is data going into a program and the output is data out of a program
    as shown in Fig. 13.1. A **stream** is a sequence of data moving from a source
    to a destination. As input stream is a source and output stream is a destination.
    These streams handle the data moving from the source or to the destination. **Buffer**
    is a block of memory that is used along with streams. The idea is that data flows
    from one part of the computer to another and one program to another. As shown
    in Fig 13.1, an input from keyboard is read by a program, and the results will
    be displayed on computer screen.


    The input and output streams, `cin` and `cout` are actually C++ objects. For example,A
    is actually a type name for a class, and `cin` is the name of a variable of type
    `istream`. Hence, we can say that it is an instance or object of the class `istream`.
    A stream provides a connection between the process that initializes it and an
    object, such as a file, which may be viewed as a sequence of data. In the simplest
    view, a stream is simply a sequenced view of that object. We think of data as
    flowing in the stream to the process, which can remove data from the stream as
    desired. The data in the stream cannot be lost by "flowing past" before the program
    has a chance to remove it. It provides the process with an "interface" to the
    data.


    The C++ standard libraries provide an extensive set of I/O capabilities, and in
    this chapter we will discuss basic and most common I/O operations required for
    C++ programming. As mentioned, C++ I/O occurs in streams that are sequences of
    bytes. If bytes flow from a device such as a keyboard, a disk drive, a network
    connection, or so forth to main memory, this process is called input operation
    and if bytes flow from main memory to a device such as a display screen, a printer,
    a disk drive, a network connection, or so forth, this process is called output
    operation.


