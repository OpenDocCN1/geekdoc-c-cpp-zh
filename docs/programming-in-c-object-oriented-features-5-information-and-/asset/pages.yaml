  md: "# 17.4 Pure virtual function and abstract classes\n\nIn Section 17.3, we have\
    \ studied the role of virtual functions in polymorphism. As shown in Program 17.8,\
    \ a virtual function Display() is defined in base class, but it is not actually\
    \ used. This means that it is possible to include a virtual function in a base\
    \ class, and redefine it in derived class to suit the objects of that class. Also\
    \ means that we can make the virtual function has no body or no meaningful definition\
    \ in the base class. Such a virtual function is called pure virtual function.\n\
    \nA function can be made virtual by replacing the definition by =0 (an equal sign\
    \ and a zero). For example, the following code shows a virtual function.\n\n```\n\
    virtual void Display()\n{\n    cout << \"Serial Number = \" << Serial_No << endl;\n\
    }}\n```\n\nThe previous virtual function can be pure by replacing its definition\
    \ by =0, as shown below:\n\n```\nvirtual void Display() = 0;\n```\n\nThe =0 tells\
    \ the compiler that the function has no body and the virtual function will be\
    \ called pure virtual. A class that contains at least one pure virtual is considered\
    \ an abstract class. Classes derived from an abstract class must implement the\
    \ pure virtual function and shows an example of implementation of a pure virtual\
    \ function and abstract class.\n\n```\n// Program 17.9\n// A Program with Pure\
    \ Virtual Function\n#include<iostream>\nusing namespace std;\n\nclass book\n{\n\
    protected:\n    int Serial_No;\npublic:\n    virtual void Display() = 0;\n};\n\
    \nclass textbook : public book\n{\nprotected:\n    int Year;\npublic:\n    textbook(int\
    \ Serial_No, int Year\n```"
