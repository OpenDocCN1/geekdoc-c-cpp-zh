    such as:


    ```

    cin >> value;

    ```


    where, value is the name of a variable of which will be read from the keyboard.
    The >> operator is called extraction operator; it points in the direction of data
    flow.


    The predefined object cin is an instance of istream class. The cin object is said
    to be attached to the standard input device, which is usually the keyboard. The
    cin is used in conjunction with the stream extraction operator, which is written
    as >> (two greater than signs), as shown in the following example. The C++ compiler
    also determines the data type of the entered value and selects the appropriate
    stream extraction operator to extract the value and store it in the given variables.
    The stream extraction operator >> may be used more than once in a single statement.


    # The standard error stream (cerr)


    The predefined object cerr is an instance of ostream class. It is said to be attached
    to the standard error device, which is also a display screen, however the cerr
    object is unbuffered, and each stream insertion to cerr causes its output to appear
    immediately. It is also used in conjunction with the stream insertion operator.


    # The standard log stream (clog)


    The predefined object clog is an instance of ostream class. It is said to be attached
    to the standard error device, which is also a display screen, however the clog
    object is buffered. This means that each insertion to clog can cause its output
    to be held in a buffer until the buffer is filled or flushed. The clog is also
    used in conjunction with the stream insertion operator. In general, it is a good
    practice to display error messages by using cerr, and to display other log messages
    using clog. Program 13.1 shows an example with cout, cin, err, and clog.


