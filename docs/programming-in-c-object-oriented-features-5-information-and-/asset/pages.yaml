    # 8.4 Introduction to pointers


    A pointer is a variable in C++ (or C) that points to a memory location. It does
    not directly contain a value such as int or float. One can access this value indirectly
    through the pointer variable. A pointer is declared as follows:


    ```

    int *ptr;

    int i;

    ptr = &i;

    ```


    Here, we have to understand the role played by characters ''*'' and ''&'' in front
    of variables. The character ''*'' in front of the variable is used to declare
    a pointer variable and it is also used in front of a pointer variable to access
    and retrieve the value contained by a pointer variable, not the address. However,
    the character ''&'' is used to access the address of an integer variable pointed
    by the pointer. In the above example, we declare an integer pointer "ptr1" and
    an integer variable i. Then we make the pointer ptr1 point to the address of the
    variable i. Consider Program 8.8 to understand the concept of pointers.


    ```

    // Program 8.8

    // Program to understand pointers

    #include <iostream>

    using namespace std;


    int main ()

    {

    int *ptr;

    int i = 18;

    ptr = &i;

    out << " The value of i is " << i << endl;

    out << " The pointer ptr (*ptr) contains the value ";

    n}

    ```'
