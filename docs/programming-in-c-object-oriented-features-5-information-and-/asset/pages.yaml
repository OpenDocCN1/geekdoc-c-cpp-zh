- pgno: 23
  md: '# 1.6 Review questions


    variables and methods (methods are also called as functions). These methods can
    either be accessible to all other classes (public methods) or have restricted
    access (private methods). New classes can be derived from a parent class. These
    derived classes inherit the attributes and behavior of the parent (inheritance),
    but they can be extended with new data structures and methods. The list of available
    methods of an object represents all the possible interactions it can have with
    external objects, which means it is a concise specification of what the object
    does. This makes OOP a flexible system, because an object can be modified or extended
    without changes to its external interface. New classes can be added to a system
    that uses the interfaces of the existing classes. Objects typically communicate
    with each other by passing message. A message can send data to an object or request
    that it invoke a method. The objects can both send and receive messages. Another
    key characteristic of OOP is encapsulation, which refers to the implementation
    details of a particular class are hidden from all objects outside the class. Programmers
    specify what information in an object can be shared with other objects.


    A final attribute of object-oriented programming languages is polymorphism, which
    means objects of different types can receive the same message and respond in different
    ways. The different objects need to have only the same interface (i.e., method
    definition). The calling object (client) does not need to know exactly what type
    of object it is calling, only that has a method of a specific name with defined
    arguments. Polymorphism is often applied to derived classes, which replace the
    methods of the parent class with different behaviors. Polymorphism and inheritance
    make OOP flexible and easy to extend.


    Object-oriented programming proponents claim modular code that is simple to develop
    and maintain. OOP is popular in larger software projects, because objects or groups
    of objects can be divided among teams and can be developed parallel. It encourages
    upfront design that facilitates a disciplined development process. Object-oriented
    programming seems to provide a more manageable foundation for larger software
    projects. The most popular object-oriented programming languages include Java,
    Visual Basic, C++, and Python.


