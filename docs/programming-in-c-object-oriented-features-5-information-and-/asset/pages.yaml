    Different from normal variables that can store values, pointers are special variables
    that can hold the address of a variable. Since they store memory address of a
    variable, the pointers are very commonly to "point to variables." As shown in
    Program 8.8, a normal variable might have an address, for example, 5060, and holds
    the value 18. However, the pointer variable ptr1 has its own address too, but
    stores 5060, which is address of variable i. Fig. 8.2 shows this illustration.


    | Value of i = 18 |

    | Address of i (or & i)=5060 |

    | *ptr = 18 |

    | ptr | Value of ptr = 5060 |


    Fig. 8.2: Understanding pointers.


    A pointer can be declared as:


    ```

    < pointer-type > * pointer-name >; or

    < pointer-type *> < pointer-name >;

    ```


    The pointer-type specifies the type of pointer. It can be int, char, float, etc.
    This type specifies the type of variable whose address this pointer can store.
    The name can be any variable name specified by the user. It is a common practice
    that most of the pointer variables start with lowercase letter ''p'', or with
    ''ptr''. In Program 8.8, the int *ptr; is the pointer declaration. The int data
    type specifies the pointer type and the *ptr is the name of the pointer. In other
    words, the ptr is a variable that can store the address of an integer, and *ptr
    returns the value stored in that address. Now, let us modify Program 8.8 to display
    the address of the pointer and confirm our understanding.'
