    # 17.3 Dynamic polymorphism


    As we mentioned earlier, another type of polymorphism is called dynamic polymorphism
    or run-time polymorphism. As the name suggests, the dynamic aspect of resolution
    makes it different from static polymorphism. For example, in dynamic polymorphism,
    a function that exists in multiple forms is executed dynamically by calling appropriate
    calls during runtime. This means, the resolution which function call is to execute
    a particular instance is decided during program execution. This is why dynamic
    polymorphism is called late-binding polymorphism, because function resolution
    happens at runtime, rather than in static polymorphism. This interesting feature
    provides a flexibility of executing a function depending on the context. Dynamic
    polymorphism is implemented using virtual functions.


