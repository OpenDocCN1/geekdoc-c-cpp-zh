    \ of another post. Finally, no bigger disk can be placed on top of a smaller disk.\n\
    \nIf we have three disks, the puzzle can be solved in seven moves. The minimal\
    \ number of moves required to solve a Tower of Hanoi puzzle is 2ⁿ⁻¹, where n is\
    \ the number of disks. This puzzle dates back to an ancient story about an Indian\
