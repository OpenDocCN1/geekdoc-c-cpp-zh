  md: "# 10 Functions\n\nthen assigned a value. The name of the function can be treated\
    \ as starting address of the function so we can assign the address of function\
    \ to function pointer using function's name. So from the output we can see that\
    \ calling the function through function pointer produces the same output as calling\
    \ the function from its name.\n\n# 10.8 Recursive functions\n\nAs already mentioned,\
    \ a main() function can call a function and in turn that function can call another\
    \ function. This seems surprising as one might think is it possible to make a\
    \ function which can call to itself? In C++, a recursive function is such function\
    \ that can call itself. We can demonstrate the applications of recursive functions,\
    \ especially in carrying out operations, which follow the similar procedures in\
    \ their subsequent steps. Means, a recursive call can substitute iteration statements\
    \ (such as for, while, and do-while). Generally speaking, recursive solutions\
    \ are simpler than the iterative ones.\n\nRecursive functions are functions calling\
    \ themselves repeatedly until a certain condition is met. Recursion involves two\
    \ conditions. First, the problem must be written in a recursive form and second,\
    \ the problem should have a terminating statement. If the terminating statement\
    \ is missing, then the function goes into an endless loop. The most common example\
    \ of a program demonstrating recursion is calculation of factorial of an integer\
    \ number. The definition for finding the factorial of a number n is as follows:\n\
    \n```\nn! = n(n-1)(n-2)×...3×2×1\n```\n\nFirst, let us understand a program for\
    \ finding a factorial of an integer number without using recursion, using the\
    \ above definition.\n\n```\n// Program 0.15\n// Factorial of a number using iteration\n\
