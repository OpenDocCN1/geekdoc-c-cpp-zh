  md: '# 8 Pointers and arrays


    In C and C++, pointers and arrays are closely related. Pointers are very useful
    in array manipulation. Declaration of a pointer to an array is just like integer
    pointer or a float pointer.


    ```

    int *ptr;

    int arr [5];

    ptr = &arr[0];

    ```


    Here, the pointer contains the address of the first element of the array. The
    other alternative for pointing to the first element of an array is ptr = arr.
    It is important to remember that the name of an array not followed by a subscript,
    is a pointer to the first element in the array.


    Once a pointer has been set to an element of an array, it is possible to use the
    increment ++ and decrement -- operator to point to subsequent or previous elements
    of the array, respectively. By incrementing or decrementing the pointer to point
    beyond an array''s boundary becomes a runtime error, and program may crash or
    overwrite other data or code sections of our program. So, it is the responsibility
    of the programmer to use the pointer wisely. One more factor to consider is the
    size of the type that pointer points. Suppose an integer pointer is pointing to
    an integer array, when we increment the pointer, the pointer points to the next
    element of the array. But in reality the pointer will contain an address that
    is typically 4 bytes greater than the address of the first element of the array.


    Another aspect to consider is the array transformation rule. If arr is an array,
    then the expression arr+1 is the address of the second element of the array, regardless
    of arr''s data type. We can now use the indirection operator * in front of the
    variable to retrieve the value stored at that location. Thus, *(arr+1)gives the
    value stored in the array''s second element. Parentheses are required because
    the indirection operator * has a higher precedence over the addition operator.
    So we


