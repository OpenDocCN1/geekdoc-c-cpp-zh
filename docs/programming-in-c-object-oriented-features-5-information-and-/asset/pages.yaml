  md: "# 11.11 Unions\n\nUnions and structures are very similar, with an exception\
    \ that a union uses a single memory location to hold more than one variable. A\
    \ union is a user-defined variable that may hold members of different sizes and\
    \ types. Let us consider some cases where unions may be preferable over structures.\n\
    \n+   1. A program with two variables, for example, var1 and var2 of two different\
    \ types, may use var1 for some time, and when its purpose is, the same memory\
    \ location of var1 can be allocated to var2.\n2. Sometimes, it is not possible\
    \ to find what type of data should be passed to a function. In such cases, we\
    \ can pass union that contains all possible data types.\n\nSo, a union is a defined\
    \ type in which all members share the same memory location, and at any time a\
    \ union can contain no more than one object from its list of members. It also\
    \ means that no matter many members a union has, it always uses enough memory\
    \ to store the largest member. Unions can be useful for conserving memory when\
    \ we have a lot of objects and/or limited memory. However, it requires an extra\
    \ care to ensure that we always access the last written member. The syntax for\
    \ declaring a union is similar to that of a structure; the only exception is that\
    \ the keyword union is used instead of struct. Union-tag is the name given to\
    \ a union and its member definitions, collectively. The general format of union\
    \ declaration is as:\n\n```\nunion [union-tag]\n{\n  member definition;\n  member\
    \ definition;\n  ...\n  member definition;\n} [one or more union variables];\n\
    ```\n\nThe following example defines a union tempNum and a variable called intDouble.\
    \ Here, tempNum is the name of the variable, and it acts in the same way as a\
    \ tag for the structure. Members of a union can be accessed in same way as members\
    \ of a structure are accessed.\n\n```\nunion tempNum\n{\n  int number;\n  double\
    \ floatnumber;\n} intDouble;\n```"
