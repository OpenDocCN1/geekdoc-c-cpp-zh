    # ## 8.1 Introduction


    In this chapter, we will study strings and pointers. Although the strings and
    pointers are not closely related they are discussed together because in many instances,
    we use pointers along with arrays, and strings are set of character arrays. The
    C++ provides two types of string representations. The first one is C-style character
    string, which originated from the Clang and continues to be supported in C++.
    The other type is string supported from string class in C++. We will cover these
    aspects in this chapter.


    A string is a one-dimensional array of characters. The last element in a string
    is the NULL terminator (`\0`). So, a string is an array with one more element
    than the maximum of actual characters. Thus, a null-terminated string contains
    the characters that comprise the string followed by a null. We do not have to
    place the null character at the end of a string. The C++ compiler automatically
    places the `\0` at the end of the string when it initializes the array. In C++,
    a character is always represented within single quotes. For example, c = ''a'';
    however, strings are represented using double quotes, as in "Hello". Even if a
    single string is enclosed within double quotes, it is still considered as string,
    instead of character. The following declaration and initialization creates a string
    of the word "Hello".


    ```

    char examplestr[6] = {''H'',''e'',''l'',''l'',''o'',''\0''};

    ```


    Lets understand a simple example of character array, as already shown. In this
    statement, we declared the size of the string as 6. However, the actual size of
    the string is 5, because there are 5 characters excluding the null character.
    One should remember that the array index starts from 0 and not 1. The size of
    the array or the string cannot be changed or redefined by a programmer. In the
    aforementioned statement, the characters of the string will be numbered from 0
    to 5. Fig 8.1 shows memory presentation of the already defined string in C/C++.


