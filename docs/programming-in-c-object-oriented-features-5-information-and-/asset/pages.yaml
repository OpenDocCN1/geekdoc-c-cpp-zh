    \ sort, the objective is to find the largest or the smallest element and move\
    \ it to the end of the array. In ascending order sorting, the method finds the\
    \ smallest item and moves it to the first index of the list. After smallest element\
    \ being moved to the first index of the array, the procedure is repeated to find\
    \ the next smallest (bigger than the earlier one) in the array leaving the first\
    \ element, as we move further, we will notice that the sorting continues with\
    \ less number of elements in the array. At the end of the sorting method, all\
    \ elements are sorted in ascending order.\n\nIn the case of descending order sorting,\
    \ the method finds the largest item and moves it to the last index of the list.\
    \ After the largest element is moved to the last index of the array, the procedure\
    \ is repeated to find the next largest (smaller than the earlier one) in the array\
    \ leaving the last element. Swapping elements from one index to another to the\
    \ last or first does the movement of elements. This method is called selection\
    \ sort because it selects the smallest or largest elements and places at its correct\
    \ position. This is same for rest of the elements in the array too. The following\
    \ code illustrates the selection algorithm to sort in ascending order.\n\n```\n\
    for(start = 0; start <= length-2; start++)\n{\n  min = start;\n  for(i = start\
    \ + 1; i <= length-1; i++)\n  {\n    if(list[i] < list[min]\n      //Select the\
    \ location of the smallest element in the list\n      min = i;\n  }\n  //Swap\
    \ the smallest element to its location\n  temp = list[start];\n  list[start] =\
    \ list[min];\n  list[min] = temp;\n}\n```"
