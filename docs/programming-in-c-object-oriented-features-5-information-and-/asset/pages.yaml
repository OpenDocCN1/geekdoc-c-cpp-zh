  md: '# About the Author


    ![](img/7f9692ccbdc64225fae08eb0ce84bee5_13_0.png)


    Laxmisha Rai received a bachelor’s degree in computer engineering at Mangalore
    University and a master’s degree in computer science and engineering at Manipal
    Institute of Technology of India. He received a PhD in electronics from Kyungpook
    National University, South Korea. He was also a postdoctoral researcher at Soongsil
    University, South Korea.


    Since 2010, he has been working as a professor at Shandong University of Science
    and Technology, China. Dr. Rai has lectured at several conferences in the United
    States, the United Kingdom, and several countries of Asia. His research interests
    are software engineering, knowledge-based systems, real-time systems, embedded
    systems, mobile robots, wireless sensor networks, and massive open online courses.
    He is the author of two books including Programming in Java with Object-Oriented
    Features, two patents, and over 50 research papers in international journals and
    conferences. He is a senior member of IEEE. He is also a member of ACM.


    In his spare time, he enjoys studying Chinese, and solving Rubik’s cubes. He can
    be reached at 1229521415@qq.com.'
