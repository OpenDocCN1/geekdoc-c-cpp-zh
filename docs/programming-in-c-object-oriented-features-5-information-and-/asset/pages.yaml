    \ in sequence, starting with 0 by default. Each successive enumerator is one larger\
    \ than the value of the previous one, but if we would prefer the implicit numbering\
    \ to start at a different value, we can just write the following:\n\nenum Weekdays\
    \ (Mon = 1, Tues, Wed, Thurs, Fri, Sat, Sun) today;\n\nNow, the enumeration constants\
    \ will be equivalent to 1 through 7. The enumerators do not need to have unique\
