  md: "A template function may be preceded by any of the normal modifiers such as\
    \ inline, extern, static, and so forth.\n\n# 18.3 Class template\n\nClass templates\
    \ work in the same way as function templates, except that they generate classes\
    \ instead of functions. They provide the users a good way to define a generic\
    \ pattern for class definitions. A class template must contain at least one generic\
    \ type field. The general form of a generic class declaration is shown here:\n\
    \n```\ntemplate <class type> class class-name\n{\n...\n}\n```\n\nHere, type is\
    \ the placeholder type name that must be specified when a class is instantiated.\
    \ We can define more than one generic data types by using a comma-separated list.\
    \ A class template, like a function template, may have several template parameters.\
    \ Moreover, some of them can be of primitive types of parameters:\n\n```\ntemplate\
    \ <class T, int x, class Y> class A\n{\n...\n}\n```\n\nSometimes, class templates\
    \ are also called parameterized types. The parameters of the primitive types must\
    \ be constant. Program 18.4 shows an example of a class template.\n\n```\n// Program\
    \ 18.4\n// Example for Class Template\n#include <iostream>\nusing namespace std;\n\
    \ntemplate <class T>\n\nclass addTwo\n{\n  T x, y;\npublic:\n  addTwo(T a, T b)\n\
    {\n    x = a; y = b;\n}\n```"
