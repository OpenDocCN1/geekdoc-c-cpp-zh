  md: '# Appendix B


    # List of non-OOP C++ programming exercises


    +   1. Input two numbers and work out their sum; average and sum of the squares
    of the numbers.

    2. Write a program to read a number of degrees Celsius of "float" type, and print
    the equivalent temperature in degrees Fahrenheit as a "float." Print your results
    in the following form:

    100.0 degrees Celsius converts to 212.0 degrees Fahrenheit.

    3. If an input is an integer number of seconds, print the equivalent time in hours,
    minutes, and seconds as output. Recommended output format should be as:

    7322 seconds is equivalent to 2 hours 2 minutes 2 seconds.

    4. Write a program to print several lines (e.g., your name and address). You may
    use several cout instructions, each with a newline character in it, or one cout
    with several newlines in the string.

    5. Write a program to find a maximum of three numbers using ternary operator.

    6. Declare (globally) an enumerated-type rainbow that consists of the hues of
    red, blue, green, and purple. In the main function, declare a variable "color"
    to be enumerated-type rainbow. Initialize the variable to constant blue. Then,
    assign the color variable the constant purple.

    7. Design, develop, and execute a program in C++ to find and output the roots
    of a given quadratic equation, for non-zero coefficients.

    8. Write a C++ program to generate n Fibonacci numbers by using for loop.

    9. Write a program that outputs a right-side triangle of height n and width 2n-1;
    the output for n = 6 would be:


    ```

    *

    ***

    *****

    *******

    ********

    ***********

    ```


    +   10. Design, develop, and execute a program in C++ to find the GCD and LCM
    of two integers and output the results along with the given integers.

    11. Design, develop, and execute a program in C++ to reverse a given four-digit
    integer number and check whether it is a palindrome or not. Output the given with
    a suitable message.

    12. Design, develop, and execute a program in C++ to evaluate the given polynomial
    $f(x) = a_4x^4 + a_3x^3 + a_2x^2 + a_1x + a_0$ for a given value of x and the
    coefficients by using Horner''s method.'
