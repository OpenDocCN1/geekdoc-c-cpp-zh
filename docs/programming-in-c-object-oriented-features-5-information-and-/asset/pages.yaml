    \ members of a class, (b) virtual functions must be created in public section\
    \ so that objects can access them, (c) when a virtual function is defined outside\
    \ the class, virtual keyword is required only in the function declaration, and\
    \ not necessarily in the function definition, (d) virtual functions cannot be\
    \ static members, (e) virtual functions must be accessed using a pointer to the\
    \ object, (f) a virtual function cannot be declared as a friend of another class,\
    \ (g) virtual functions must be defined in the base class even if they do not\
    \ have any significance, (h) the signature of virtual function in base class and\
    \ derived class must be the same, and (i) if a function is declared as virtual\
    \ in the base class, it will be virtual in all its derived classes."
