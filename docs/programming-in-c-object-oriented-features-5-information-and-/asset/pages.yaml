  md: 'The initializing values appear in an initializer list in the same way as for
    elements of an array. However, the sequence of initial values in an array needs
    to be the same as the sequence of the members of the struct in its definition.
    Each member of the Biscuit structure has a corresponding initial value assigned
    to it, as indicated in the comments. The syntax for initializing structure variables
    is different from that of standard variables. Since item_name and manufacturer
    members are arrays or strings, simply using assignment will not work. The structure
    elements are accessed using the dot notation. The individual elements, such as
    item_no, are initialized as follows:


    ```

    Biscuit.price = 7.5;

    Biscuit.item_no = 9341;

    ```


    One can initialize a structure either by initializing the individual elements
    as shown previously or by simply listing the element''s value inside curly braces,
    with each value separated by a comma in a single line as shown below.


    ```

    struct item Biscuit = {"SweetBest",7.5,"Qingdao Biscuits Ltd",9341;

    ```


    Similar to initialization of arrays, partial initialization of a structure can
    be done as follows:


