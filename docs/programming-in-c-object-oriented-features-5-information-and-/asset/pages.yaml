    \ The various selection statements are: if, if-else, and switch statements.\n\n\
    # ## 5.2 The if statement\n\nThe if statement is used to alter the sequential\
    \ flow of execution of statements. This is very useful when we want to execute\
    \ some statements only after a particular condition is met or satisfied. The general\
    \ form of if statement is as follows:\n\n```\nif(Boolean-expression)\n    statement;\n\
    ```\n\nHere, Boolean-expression is an expression that returns the result as **true**\
