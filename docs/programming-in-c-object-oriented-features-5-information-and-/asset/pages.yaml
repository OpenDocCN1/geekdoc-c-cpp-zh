    # 11.1 Introduction


    A structure is a user-defined data type that defines a list of variables under
    one name in a block of memory, allowing different variables to be accessed through
    a single variable. A structure can be defined by using struct keyword in C++.
    So far, we have understood how the variables are used to store information of
    different data types. However, all these variables store a single type of information,
    such as an integer, a floating-point number, or a character. On the other hand,
    the arrays store more than one elements of same data type. However, in reality,
    we deal with different types, and hence cannot use same data type for everything.
    For example, let us consider contact details of a person, which includes:a her
    name is an array of characters or string; (b) the address that is also an array
    of characters; (c) the phone number that is of integer type than characters. Hence,
    to store the contact details of a person, we have to consider the use of multiple
    data types under a single name, such as address. We can consider another example
    of an item in a grocery store. Each item in the store comprises different types
    of information such as name, price, manufacturer, and item number. The number
    is usually a unique number used for billing information. All the information about
    an item does not belong to some data type. The item name is an array of characters;
    the price is a floating-point number; the item number is also an integer. The
    following statements show how we can individually declare these details in C++
    by using different data types.


    ```

    char item_name[10];      // for example biscuit named "SweetBest"

    float price; // for example 7.5 RMB

    char manufacturer[40];    // for example Qingdao Biscuits Ltd.

    int item_no;               // for example 9341

    ```


    Even though this information is related to one item, we have still declared the
    information in different statements. However, if we use structures, all these
    statements can be declared under a single name. In C++, the arrays allow us to
    define variables that combine several data items of the same kind, but structure
    is another user-defined data type that allows us to combine data items of different
    kinds. In the next section, we will understand the ways of defining structures
    in C++.


