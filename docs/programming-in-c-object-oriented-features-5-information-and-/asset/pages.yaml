  md: "# 7 Arrays\n\nFlow with whatever may happen and let your mind be free. Stay\
    \ centered by accepting whatever you are doing. This is the ultimate.\n  - Zhuangzi\n\
    \n# 7.1 Introduction\n\nIn this chapter we explore the concept of arrays. Before\
    \ proceeding to understand this concept, let us first look at an example – list\
    \ of marks scored by 10 students in a class. What should we do to find the average\
    \ score of students in a class? How do we write a program to find average score\
    \ of all the 10 students? One way to solve this problem is by assigning all the\
    \ 10 to distinct variables. Let the example marks scored by 10 students are as\
    \ shown below.\n\n67,90,68,78,91,87,56,57,76,66\n\nSo, average marks = (67+89+90+68+78+91+87+56+77+66)/10.0\n\
    \nThis can be converted to a C++ code as shown below:\n\n```\nint m1=67,m2=89,m3=90,m4=68,m5=78,m6=91,m7=87,m8=56,m9=77,m10=66;\n\
    float Average = (m1+m2+m3+m4+m5+m6+m7+m8+m9+m10)/10.0;\n```\n\nAs we can see from\
    \ the above code, we have used 10 different variables to denote different marks\
    \ of students. It is the case where there are only 10 students. What if there\
    \ are 200 students in a class? How can we declare distinct variables for all 200\
    \ students? This is a really problem and a waste of time. By using arrays we can\
    \ solve these problems. An array is a set of values of same data type. It is used\
    \ to store collection of data, where series of elements of the same type placed\
    \ in contiguous memory locations can be individually referenced by an index to\
    \ a unique identifier. In the discussed example, all 10 variables m1–m10 are integers.\
    \ Here, all 10 variables share same data type. The arrays in C++ can be declared\
    \ as:\n\n```\ndata type <variable name>[arraySize];\n```\n\nFor example: int marks[10];\n\
    This statement allocates memory for 10 values of data type integer. We initialize\
    \ the array with predefined values as shown below:\n\n```\nint marks[10] = {67,90,68,78,91,87,56,57,76,66};\n\
    ```"
