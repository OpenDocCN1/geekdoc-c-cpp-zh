    # 17.1 Introduction


    Polymorphism is one of the most essential features of an object-oriented programming.
    It makes writing programs simpler and reusable. **Polymorphism** means many forms
    (or many faces). For example, a person may be a father at home, an officer in
    the office, or a customer in a restaurant. Here, father, officer, and customer
    all refer to the same person. **compile-time** polymorphism (or **static** polymorphism)
    and **run-time** polymorphism (or **dynamic** polymorphism). Typically, polymorphism
    occurs when there is a hierarchy of classes and they are related by inheritance.
    C++ polymorphism means that a call to a member function will cause a different
    function to be executed depending on the type of object that invokes the function.
    Fig. 17.1 shows the types of polymorphism. In this chapter, we cover all these
    types with at least one example each.


    # 17.2 Static polymorphism


    Static polymorphism is also called compile-time polymorphism. There are two categories
    of static polymorphism: function overloading and operator overloading, as shown
    in Fig. 17.1. It is an **early binding** polymorphism, where memory will be allocated
    during compile time. The binding is based on the number of arguments, data type,
    and sequence of arguments. During the program execution, the calls are already
    fixed to suitable functions. For example, let us consider these two statements.


    ```

    void add(float, float);

    void add(int, float);

    ```


    When the add() function is invoked, the types of parameters already decide during
    compile time which version of the function code will be executed.


    # Function overloading


    In C++, an overloaded function is a function with same function name, but with
    different signature in the same scope. A function signature includes the number
    of arguments,'
