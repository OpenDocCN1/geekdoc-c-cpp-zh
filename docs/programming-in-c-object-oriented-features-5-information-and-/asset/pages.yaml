  md: "# 7.4 Applications of two-dimensional arrays 131\n\n```\n{\nC[i][j] = A[i][j]\
    \ - B[i][j];\n}\n```\n\nMatrix multiplication is little complex method as compared\
    \ with matrix addition and subtraction. It is possible to multiply matrices, if\
    \ and only if the columns of matrix A are equal to rows of matrix B. The following\
    \ piece of code illustrates matrix multiplication.\n\n```\n//Matrix Multiplication\n\
    for(i = 0; i < r_A; i++)\n{\n  for(j = 0; j < c_B; j++)\n  {\n    C[i][j] = 0;\n\
    \    for(k = 0; k < c_A; k++)\n    {\n      C[i][j] = C[i][j] + A[i][k] * B[k][j];\n\
    \    }\n  }\n}\n```\n\nTwo-dimensional arrays can be used to solve n linear equations\
    \ with n unknowns. Look at the following list of linear equations.\n\n+   2x +\
    \ 3y + 6z = 26\n4x + 6y - 2z = 10\n8x - 3y + 6z = 20\n\nThese equations can be\
    \ represented as i.e. A×X = R\n\n2 3 6 x = 26\n4 6 -2 y = 10\n8 -3 6 z = 20\n\n\
