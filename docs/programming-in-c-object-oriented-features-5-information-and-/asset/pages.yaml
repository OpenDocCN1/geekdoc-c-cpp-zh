  md: '# Preface


    Today, use of computers and application of software can be seen everywhere. The
    rapid progress in information technology (IT) has changed our conventional ways
    of thinking. It is hard to imagine life without computers and software these days.
    Programming is an essential part of computing. Many programming languages were
    developed over the years, however, very few of them survived the IT market. C++
    is one such programming language that can rightly be called as a successor to
    C language. C++ is a general-purpose programming language with a rich set of object-oriented
    programming (OOP) and generic programming features. This language was created
    by Bjarne Stroustrup, a Danish computer scientist, in 1980s. Today, C++ is one
    of the most prominent and useful OOP languages. It is studied widely by students
    and programmers alike. C++ supports a number of features, such as classes, objects,
    constructors, and polymorphism that make it useful. This book covers all of these
    concepts along with the basics of programming, including selection techniques,
    looping, arrays, strings, function sorting, and searching algorithms.


    The book is written by focusing programmers, both experienced and inexperienced,
    who would like to learn C++ with or without prior experience. The main objective
    of the book is to present an overview of C++ programming language with OOP concepts.
    The book is presented in simple English and easy examples. It can be used as a
    textbook for undergraduate or graduate programs. The book will provide every reader
    an idea to write and practice C++ programs as well as understanding various computers
    and programming terms in English. There are many features that will make this
    book unique among C++ textbooks. A large number of example programs and illustrations
    will be presented throughout the book. All of the programs are written with maximum
    care and attention. Many programming exercises are also provided, wherever necessary.
    We are sure that every reader will enjoy C++ programming while reading this book.


    This book covers all of the necessary features of object-oriented programming
    with C++. There are a total of 18 chapters in the book. Each chapter starts with
    a brief introduction about its contents and scope. Each chapter has a set of questions
    for the reader to answer and think about possible answers as well. The book presents
    over 180 programs with their respective input and output details. We suggest every
    reader to go through all of the chapters starting from 1 to 18 in order to master
    C++ programming. This book can be divided into two parts. The first part is from
    Chapters 1 to 13, which covers the basics of C++ programming, or concepts which
    are not directly related OOP. Even though these chapters use the terms classes
    and objects here and there, there is no need of exclusive OOP concepts. So, teachers
    who are willing to train their students in the basics of C++ may choose these
    chapters as introductory lessons on C++ programming. The second part is from Chapters
    14 to 18. This part is about topics that are directly related to OOP. These chapters
    provide the exclusive features of OOP in C++. So, the learners'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# VI Preface


    who are familiar with the basics of C++ may start from Chapter 14 to understand
    the OOP concepts directly. However, the book is written in such a way that the
    reader can jump to any chapter to acquire exact information without following
    the sequence of chapters.


    In addition to all these chapters, the book presents five appendices for supporting
    the materials presented in this book. Appendix A provides a list of C++ header
    files and library functions. It is provided as a quick reference for learners
    to learn several library functions provided by C++. The brief description of these
    header files and respective library functions are provided in multiple tables.
    Appendices B and C provide a list of non-OOP and OOP experiences of C++, respectively.
    The book provides two sections, so that the instructors are able to divide the
    exercises on the basis of the students'' ability and course requirements. In some
    universities or colleges, instructors prefer their students to learn object-oriented
    concepts of C++ only. In such cases, it is better to refer to the exercises in
    Appendix C. However, if the instructor is more focused on teaching fundamentals
    of programming concepts through C++, then programming exercises listed in Appendix
    B are preferred. In addition to these programming exercises, there are also some
    programming exercises presented at the end of each chapter section “Review Questions.”


    Appendix D lists the Decimal-Binary-Octal-Hex ASCII (American Standard Code for
    Information Interchange) conversion chart. It is very useful while writing programs
    of especially related character data type. In addition, it is necessary for learners
    to understand how the numbers are represented in different formats. Appendix E
    provides Bibliography information.


    The book uses different fonts as **bold**, and Inconsolata , to identify the various
    concepts. For example, the bold reminds the reader that these words are important
    and commonly used terms in understanding concepts of C++ and OOP. All programs
    shown in the book are in Inconsolata, so that the readers can easily identify
    them. Moreover, we have also used this font within the text for describing the
    concepts, to show the readers that these words may form part of a program, or
    closely related to a program. The outputs of example programs are also provided
    so that readers can easily guess the results obtained after the execution of program.


    We hope that you find this book interesting, enjoyable, and informative. We wish
    all the readers every success in C++ programming.


    Happy Programming!


    Laxmisha Rai'
