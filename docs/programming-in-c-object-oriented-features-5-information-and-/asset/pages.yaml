  md: '# Defining synonyms for data types


    We can create a new name for an existing type by using keyword typedef. The syntax
    to define a new type using typedef is as follows:


    ```

    typedef type newname;

    ```


    The typedef keyword enables us to define our own type name for an existing type.
    For example, we can define a type name int_wholenum as the standard int type with
    the declaration:


    ```

    typedef int_wholenum; // Defining int_wholenum as a type name

    ```


    Now, the following declaration is perfectly legal and creates an integer variable
    called with initial value as 23.


    ```

    int_wholenum width=23; // Defining a int variable

    ```


    The previous declaration is the same as follows:


    ```

    int width=23; // Defining a int variable

    ```


    Defining our own type name as int_wholenum enables us to use both type specifiers
    within the same program for declaring different variables that will end having
    the same type.


    # Variables with specific set of values


    Sometimes, there is need for variables that have a limited set of possible values
    that can be referred referred by labels, such as the days of the week, colors
    in a rainbow, months of the year, or the suits in the card deck. There is a specific
    facility in C++ to handle this situation, it is called enumeration. Using enumerated
    data type is also another way of using constants. The enumerated data type is
    initiated by the keyword enum. An enumerated type declares an optional type name
    and a set of zero or more identifiers that can be used as values of the type.
    Each enumerator is a constant whose type is the enumeration. The general form
    of an enumeration declaration is shown below.


    ```

    enum enum-name ( list of names ) variable-list;

    ```


    The enum-name is the enumeration''s type name. The list of names is separated
    by commas, and enclosed within flower brackets. For example, the following code
    defines an enumeration of week days called Weekdays and the variable today of
    type Weekdays.'
