    # ## 16.1 Introduction


    Inheritance is a very important feature in object-oriented programming. It plays
    a major role in writing large programs. Inheritance property is highly required
    when we deal with many classes with minor changes. It enables us to define a new
    class based on an existing class definition, for example, if book is a class,
    textbook of notebook is a subclass. This means that many characteristics of notebook
    are derived from book, with size, pages, and so forth. For example, notebook is
    a book, textbook is a book, and with inheritance we can implement an is-relationship.
    Here, we call the class as parent class (or super class or base class) and the
    class notebook as child class (or subclass or derived class).


    Fig. 1 shows the concept of inheritance. Here, we create or derive a new class
    similar to that of the existing class, but it will have new characteristics. This
    is very useful when we are making modifications to an existing program. For example,
    Program A needs some modifications to change to Program B, a new program. In such
    cases, instead of developing Program B from scratch, we can derive the existing
    features from Program A. This makes the programming task very easy. The main advantage
    of inheritance is In this chapter, we will study the use of inheritance and its
    importance in programming.


    # ## 16.2 Single inheritance


    As discussed in the Section 16.1, the class that is used to create a new class
    is called a parent class (or super class or base class), and the class that is
    derived from a base class is called child class (or subclass or derived class).
    In single inheritance, a derived class is inherited from a single base class,
    as shown in 16.1. C++ also allows a subclass to inherit from multiple base classes.
    This is called multiple inheritance. This means that a derived class can inherit
    data and functions from multiple classes. However, Java, another OOP language,
    does not support multiple inheritance.


    A child class is almost like a parent class with added features. To create a child
    class, we should first create a parent class. Remember that the inheritance is
    between classes and not objects. It is not possible to inherit features from one
    object to another. Here, we apply all the inheritance principles only to classes,'
