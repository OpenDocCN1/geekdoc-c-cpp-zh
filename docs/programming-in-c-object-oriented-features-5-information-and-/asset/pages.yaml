- pgno: 62
  md: '# 48 — 3 Programming Basics


    The names given to the variables are called identifiers that are also the names
    given to methods or functions and classes. To declare a variable as an identifier,
    it must satisfy the following conditions:


    +   1. It must be composed of letters, numbers, and underscore (_).

    2. It cannot contain blank spaces.

    3. It can only begin with a letter or an underscore.

    4. It cannot begin with a number.

    5. All variable names are case-sensitive, for example, SMALL variable is not the
    same as small variable.

    6. There should be no limit to the length of a C++ variable name.

    7. C++ does not allow punctuation characters such as @, $, and % within identifiers.


    Following are a few examples of valid variable names:


    ```

    OneVariable

    onevariable

    ONEVARIABLE

    One_Variable

    n

    _one

    One_18

    One18

    _18One

    ```


    Following are a few examples of invalid variable names:


    ```

    One Variable // Contains a blank space

    90One // Begins with a digit

    One+Two // Plus sign is not an alphanumeric character

    One-Variable // Hyphen (-) is not an alphanumeric character

    ```


    # 3.3 C++ Keywords


    The keywords are special words that can neither be used as identifiers nor the
    names of program variables. All the C++ keywords are in lower-case instead of
    upper-case (or capitals). The following list shows some of the commonly used keywords
    in C++. Many of these keywords are also common to both C and C++. Please note
    that keywords are either added or deleted from time to time.


    ```

    asm         else      new       this

    auto        enum      operator  throw

    bool        explicit  private  true

    ```'
