  \n### 关于我\n\n\n\n\n\n自 1999 年以来，我一直担任软件架构师、团队负责人和讲师。2002 年，我创建了公司内部会议以进行进修教育。自 2002\
  \ 年以来，我一直在提供培训课程。我的第一个教程是关于专利管理软件的，但很快就开始开始教授 Python 和 C++。我喜欢在空余时间编写关于 C++、Python\
  \ 和 Haskell 的文章。我也喜欢在会议上演讲。我在我的英文博客 [Modernes Cpp](https://www.modernescpp.com/)\
  \ 上每周更新，以及由 Heise Developer 托管的[德语博客](https://www.grimm-jaud.de/index.php/blog)。\n\
  \n自 2016 年以来，我担任一名独立讲师，举办关于现代 C++ 和 Python 的研讨会。我用多种语言出版了多本关于现代 C++ 特别关于并发的书。由于职业原因，我总是寻找教授现代\
  \ C++ 的最佳方法。\n\n![Rainer Grimm](img/privat----RainerGrimm.jpg)\n\nRainer Grimm\n\
  \n# 1. 标准库\n\nC++ 标准库由许多组件组成。本章有两个目的：它应该让你对这些特性有一个快速的概述，并对如何使用它们有一个初步的想法。\n\n##\
  \ 历史\n\nC++ 及其标准库有着悠久的历史。C++ 始于上世纪的 20 世纪 80 年代，一直持续到现在的 2023 年。任何了解软件开发的人都知道我们的领域演进得有多快。因此，40\
  \ 年是一个非常长的时期。你可能不会很惊讶，C++ 的第一个组件（如 I/O 流）的设计理念与现代标准模板库（STL）不同。C++ 起初是一门面向对象的语言，通过\
  \ STL 引入了泛型编程，并且现在采纳了许多函数式编程思想。过去 40 年里软件开发的这种演变（你可以在 C++ 标准库中观察到它），也是解决软件问题方式的演变。\n\
  \n![C++ 时间轴](img/privat----timeline.png)\n\nC++ 时间轴\n\n1998 年的第一个 `C++98` 标准库包含三个组件。它们是之前提到的\
  \ I/O 流（主要用于文件处理）、字符串库和标准模板库。标准模板库促进了算法在容器上的透明化应用。\n\n历史在 2005 年随着技术报告 1 (TR1) 继续。C++\
  \ 库扩展 ISO/IEC TR 19768 不是正式标准，但几乎所有的组件都成为了 `C++11` 的一部分。这些是基于 boost 库 (http://www.boost.org/)\
  \ 的正则表达式库、智能指针、哈希表、随机数和时间库。\n\n除了 TR1 的标准化外，C++11 还获得了一个新组件：多线程库。\n\n`C++14` 仅仅是对\
  \ C++11 标准的微调。因此，C++14 仅对智能指针、元组、类型特征（type traits）和多线程的现有库增加了少量改进。\n\n`C++17` 包含了文件系统库以及两个新数据类型\
  \ `std::any` 和 `std::optional`。\n\n`C++20` 有四个突出的特性：概念（concepts）、范围（ranges）、协程（coroutines）和模块（modules）。除了这四大特性之外，C++20\
  \ 还有更多珍珠：三路比较运算符、格式化库以及与并发相关的数据类型信号量（semaphores）、锁（latches）和屏障（barriers）。\n\n`C++23`\
  \ 改进了 C++20 的四大特性：扩展的范围功能、协程生成器 `std::generator` 以及模块化的 C++ 标准库。\n\n#### 概述\n\n\
  由于 C++ 拥有许多库，为每个用例找到方便的库通常很困难。\n\n### 工具类\n\n工具类 是关注通用任务的库，因此可以应用于许多语境。\n\n工具类的示例包括计算值的最小或最大值的函数、两个值的中点函数，或者用于交换或移动值的函数。得益于保存整数的比较，整数提升不会发生。\n\
  \n其他工具类包括 `std::function`、`std::bind` 或 `std:bind_front`。通过 `std::bind` 或 `std::bind_front`，你可以从现有函数轻松创建新函数。为了将它们绑定到变量并在稍后调用，你需要\
  \ `std::function`。\n\n通过 `std::pair` 和泛化的 `std::tuple`，你可以创建任意长度的异构对和元组。\n\n引用包装器\
  \ `std::ref` 和 `std::cref` 非常实用。人们可以使用它们为变量创建引用包装器，对于 `std::cref` 来说，它是常量的。\n\n\
  当然，工具类中的亮点是智能指针。它们允许显式的自动内存管理。你可以通过 `unique_ptr` 建模显式所有权，通过 `shared_ptr` 建模共享所有权。第三种\
  \ `weak_ptr` 有助于解决 `shared_ptr` 之间的循环引用问题。\n\n类型特征库可以在编译时检查、比较和处理类型信息。\n\n时间库是 C++\
  \ 新多线程能力的补充。它对于性能测量也非常方便，并包含了对日历和时区的支持。\n\n通过 `std::any`、`std::optional` 和 `std::variant`，我们在\
  \ C++17 中获得了处理任意、可选或变体值的特殊数据类型。\n\n### 标准模板库\n\n![STL 的三个组件](img/privat----stl.png)\n\
  \nSTL 的三个组件\n\n标准模板库 (STL) 从视角来看由三个组件组成。它们是容器、运行在容器上的算法以及连接两者的迭代器。容器对元素仅有极少的要求。这种泛型编程的抽象让你能够独特组合算法和容器。\n\
  \nC++ 标准库拥有丰富的容器。我们有序列容器和关联容器。关联容器可以分为有序关联容器和无序关联容器。\n\n每个序列容器都有独特的领域。尽管如此，在 95%的用例中，`std::vector`\
  \ 是正确的选择。`std::vector` 可以动态调整大小，自动管理内存并提供卓越的性能。相比之下，`std::array` 是唯一无法运行时调整大小的序列容器。它针对内存和性能开销进行了优化。虽然\
  \ `std::vector` 擅长在末尾添加新元素，但你应该使用 `std::deque` 在开头也添加元素。由于 `std::list` 是双链表而 `std::forward_list`\
  \ 是单链表，我们还有两个针对容器内任意位置操作进行了优化的额外容器。\n\n\n\n\n\n`关联容器` 是键值对的容器。它们通过各自的键来提供其值。关联容器的一个典型用场景是电话簿，你使用`family\
  \ name` 作为键来检索`phone number` 这个值。C++ 有八种不同的关联容器。一边是具有有序键的关联容器：`std::set`、`std::map`、`std::multiset`\
  \ 和 `std::multimap`。另一边是无序关联容器：`std::unordered_set`、`std::unordered_map`、`std::unordered_multiset`\
  \ 和 `std::unordered_multimap`。\n\n首先，看看[有序关联容器]。`std::set` 和 `std::map` 的区别在于前者没有关联的值。`std::map`\
  \ 和 `std::multimap` 的区别在于后者可以有多个相同的键。这些命名约定也适用于[无序关联容器]，它们与有序容器有许多共同点。关键区别在于性能。有序关联容器具有对数访问时间，而无序关联容器允许常数级访问时间。因此，无序关联容器的访问时间与其大小无关。这一规则同样适用于\
  \ `std::unordered_map` 和 `std::vector`。在 95% 的用例中，如果你不需要排序键，`std::unordered_map`\
  \ 应该是你的首选。\n\n`容器适配器`为序列容器提供了简化的接口。C++ 有 `std::stack`、`std::queue` 和 `std::priority_queue`。\n\
  \nC 数组、`std::array`、`std::vector` 或 `std::string` 支持视图。`std::span` 是一个[连续元素序列]的视图。视图永远不是所有者。\n\
  \n`迭代器`是连接容器和算法的胶水。它们由容器创建。作为泛化指针，你可以使用它们来正向或反向迭代，或者跳转到容器中的任意位置。你获得的迭代器类型取决于容器。如果你使用迭代器适配器，可以直接访问流。\n\
  \nSTL 为你提供了超过 100 种[算法]。通过指定[执行策略]，你可以以顺序、并行或并行且向量化的方式运行大多数算法。算法在元素或元素范围上进行操作。两个迭代器定义了一个范围。第一个定义起始，第二个（称为结束迭代器）定义范围的结束。需要知道的一点是，结束迭代器指向*范围末尾之后的一个元素*。\n\
  \n算法可以用于广泛的应用。你可以查找元素、计数元素、查找范围，并对它们进行比较或转换。有算法可以生成、替换或从容器删除元素。当然，你可以对容器进行排序、排列或分区，或者确定它的最小或最大元素。许多算法可以通过`callables`（可调用对象）如函数、函数对象或\
  \ lambda 函数进行进一步自定义。`callables`为元素的搜索或转换提供了特殊标准。它们极大地增强了算法的功能。\n\n[范围库]的算法是惰性的，可以直接作用在容器上，并且可以很方便地组合。它们用函数式思想扩展了\
  \ C++。此外，大多数经典的 STL 算法都有范围后缀（ranges pendants），它们支持投影并提供额外的安全保障。\n\n### 数值\n\nC++\
  \ 中有两个用于数值计算的库：随机数库和数学函数，后者是 C++ 继承自 C。\n\n[随机数库]由两部分组成。一部分是随机数生成器；另一部分是生成的随机数分布。随机数生成器生成最小值和最小值之间的数字流，由随机数分布将这些流映射到具体的分布上。\n\
  \n由于 C 的，C++ 有许多[数学标准函数]。例如，有对数、指数函数和三角函数。\n\nC++ 支持基础和高级的[数学常量]，如 ![e](img/leanpub_equation_0.png)、![\\\
  pi](img/leanpub_equation_1.png) 或 ![\\phi](img/leanpub_equation_2.png)。\n\n### 文本处理\n\
  \n通过字符串和正则表达式，C++ 有两个强大的库来处理文本。\n\n`std::string` 拥有丰富的成员函数集合，用于分析和修改其文本。因为它与字符的\
  \ `std::vector` 有许多共同点，你可以将 STL 算法应用于 `std::string`。`std::string` 是 C 字符串的继承者，但使用起来容易且安全得多。C++\
  \ 字符串管理自己的内存。\n\n与 `std::string` 不同，`std::string_view` 的拷贝开销很小。`std::string_view`\
  \ 是 `std::string` 的非所有引用。\n\n[正则表达式]是一种描述文本的语言。你可以使用正则表达式来确定文本模式是否在文中出现一次或多次。但不仅如此，正则表达式还允许将匹配到的模式替换为文本。\n\
  \n## 输入与输出\n\n[I/O 流库]是一个从 C++ 初期就存在的库，允许与外部世界进行通信。\n\n在这种具体情况下，通信意味着提取运算符 `>>`\
  \ 允许它从输入流读取格式化或非格式化的数据，而插入运算符 `<<` 允许它将数据写入输出流。\n\n流类具有复杂的层次结构。有两个流类非常重要：首先，字符串流（string\
  \ streams）允许你与字符串和流交互；其次，文件流（file streams）允许你读写文件。流的状态在标志中，你可以读取并操作这些标志。\n\n通过重载输入运算符和输出运算符，你的类可以像基本数据类型一样与外部世界交互。\n\
  \n[格式化库]提供了 `printf` 家族安全且可扩展的替代方案，并扩展了 I/O 流库。\n\n[文件系统库]是在 C++17 中引入的。该库基于三个概念：文件、文件名和路径。文件可以是目录、硬链接、符号链接或普通文件。路径可以是绝对或相对的。\n\
  \n文件系统库提供了读取和操作文件系统的强大接口。\n\n### 多线程\n\nC++ 在 2011 年发布的 C++ 标准中获得了多线程库。该库拥有原子变量、线程、锁和条件变量等基础构建块。这是未来\
  \ C++ 标准构建更高抽象的基础。但 C++11 已经拥有了任务（tasks），它们提供了比上述基础构建块更高层次的抽象。\n\n在底层，C++11 首次提供了[内存模型]和原子变量。这两个组件都是多线程编程中实现*良定义*行为的基础。\n\
  \n\n\n\n\n一个新的 C++ 线程会立即开始其工作。它可以在前台或后台运行，并通过拷贝或引用获取数据。得益于停止令牌 (stop token)，你可以中断改进后的线程\
  \ `std::jthread`。\n\n线程之间共享变量的访问必须经过协调。这种协调可以通过互斥锁或锁以不同的方式完成。但很多情况下，保护数据的初始化就足够了，因为在它的生命周期内它是不可变的。\n\
  \n将变量声明为线程局部 (thread-local)可以确保线程获取的是自己的拷贝，因此不存在冲突。\n\n条件变量是实现发送者-接收者工作流的经典解决方案。核心思想是发送者在完成工作后通知接收者，以便接收者开始工作。\n\
  \n信号量是一种用于控制对共享资源并发访问的同步机制。信号量有一个大于零的计数器。获取信号量会减少计数器，释放信号量会增加计数器。只有当计数器大于零时，线程才能获取资源。\n\
  \n与信号量类似，`std::latch` 和 `std::barrier` 是协调类型，允许某些线程阻塞直到计数器变为零。与 `std::barrier` 不同，你可以重用\
  \ `std::latch` 用于新的迭代，并为该新迭代调整其计数器。\n\n任务与线程有许多共同点。但程序员显式地创建线程，但任务将由 C++ 运行时隐式创建。任务类似于数据通道。数据可以是值、异常或仅是通知。承诺(promise)将数据放入数据通道；未来(future)则从中取出值。\n\
  \n协程可以在挂起和恢复执行的同时保持其状态的函数。协程是编写[事件驱动应用](https://en.wikipedia.org/wiki/Event-driven_programming)的常用方法。事件驱动应用可以是模拟、游戏、服务器、用户界面甚至甚至是算法。协程实现了[协作多任务](https://de.wikipedia.org/wiki/Multitasking)。协作多任务的关键是每个任务根据其需要花费时间。\n\
  \n## 库的使用\n\n在程序中使用库你必须执行三个步骤。首先，你必须使用 `#include` 语句包含头文件，以便编译器知道库的名称。或者，你可以使用 C++23\
  \ 的 `import std;` 导入标准库。由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。第三步也是最后一步，是为链接器指定库以获得可执行文件。第三步通常是可选的。以下行解释了这三个步骤。\n\
  \n### 包含头文件\n\n预处理器遵循 `#include` 语句包含文件。也就是说，大部分的。\n\n### 导入标准库\n\n或者，你可以使用 C++23\
  \ 的 `import std;` 导入标准库。由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。第三步也是最后一步，是为链接器指定库以获得可执行文件。第三步通常是可选的。\n\
  \n### 命名空间的使用\n\n由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。\n\
  \n### 名字的未限定使用\n\n由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。\n\
  \n### 使用声明\n\n由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。\n\
  \n### 使用指令\n\n由于 C++ 标准库名称位于 `std` 命名空间，你可以在第二步中使用完全限定的形式使用它们，或者必须将它们导入到全局命名空间。\n\
  \n### 命名空间别名\n\n命名空间别名定义了命名空间的同义词。对于长命名空间或嵌套命名空间，使用别名通常非常方便。\n\n### 构建可执行文件\n\n\
  只有在极少数需要显式地链接某个库。这句话取决于平台。例如，使用当前的 *g++* 或 *clang++* 编译器时，你应该链接 `pthread` 库以获得多线程功能。\n\
  \n# 2. 工具\n\n工具是你可以在不同语文中使用的宝贵工具。它们不局限于特定领域。这句话适用于本章的函数和库。我展示了你可以应用于任意值的函数，或者你可以用来创建新函数并将其绑定到变量的函数。你可以在对和元组中存储任意类型的任何值，或者构建任何值的引用。智能指针是你在\
  \ C++ 中实现自动内存管理的工具。要获取类型信息，请使用 type-traits 库。\n\n\n\n\n你可以将 `min`、`max` 和 `minmax`\
  \ 函数的许多变应用于值和初始化列表。这些函数需要 `<algorithm>` 头文件。相反，`std::move`、`std::forward`、`std::to_underlying`\
  \ 和 `std::swap` 函数定义在 `<utility>` 头文件中。你可以将它们应用于任意值。\n\n### `std::min`, `std::max`,\
  \ 和 `std::minmax`\n\n函数 [`std::min`](http://en.cppreference.com/w/cpp/algorithm/min)、[`std::max`](http://en.cppreference.com/w/cpp/algorithm/max)\
  \ 和 [`std::minmax`](http://en.cppreference.com/w/cpp/algorithm/minmax) 定义在 `<algorithm>`\
  \ 头文件中，它们作用于值和初始化列表，并将请求的值作为结果返回。在 `std::minmax` 的情况下，你会得到一个 `std::pair`。对的第一个元素是最小值；第二个元素是值的最大值。默认使用小于运算符（`<`），但你可以应用自己的比较运算符。此函数需要两个参数并返回一个布尔值。返回\
  \ `true` 或 `false` 的函数被称为谓词。\n\n```\n// minMax.cpp\n...\n#include <algorithm>\n\
  ...\nusing std::cout;\n...\ncout << std::min(2011, 2014);                      \
  \     // 2011\ncout << std::min({3, 1, 2011, 2014, -5});               // -5\ncout\
  \ << std::min(-10, -5, [](int a, int b)\n                { return std::abs(a) <\
  \ std::abs(b); }); // -5\n\nauto pairInt= std::minmax(2011, 2014);\nauto pairSeq=\
  \ std::minmax({3, 1, 2011, 2014, -5});\nauto pairAbs= std::minmax({3, 1, 2011, 2014,\
  \ -5}, [](int a, int b)\n                      { return std::abs(a) < std::abs(b);\
  \ });\n\ncout << pairInt.first << \",\" << pairInt.second;  // 2011,2014\ncout <<\
  \ pairSeq.first << \",\" << pairSeq.second;  // -5,2014\ncout << pairAbs.first <<\
  \ \",\" << pairAbs.second;  // 1,2014\n```\n\n函数 `std::min`、`std::max` 和 `std::minmax`\n\
  \n表格提供了 `std::min`、`std::max` 和 `std::minmax` 函数的概述\n\n`std::min`、`std::max` 和 `std::minmax`\
  \ 的变体\n\n| 函数 | 描述 |\n| --- | --- |\n| | |\n| `min(a, b)` | 返回 `a` 和 `b` 的较小值。 |\n\
  | | |\n| `min(a, b, comp)` | 根据谓词 `comp` 返回 `a` 和 `b` 较小值。 |\n| | |\n| `min(initialiser\
  \ list)` | 返回初始化列表中的最小值。 |\n| | |\n| `min(initialiser list, comp)` | 根据谓词 `comp`\
  \ 返回初始化列表中的最小值。 |\n| | |\n| `max(a, b)` | 返回 `a` 和 `b` 的较大值。 |\n| | |\n| `max(a,\
  \ b, comp)` | 根据谓词 `comp` 返回 `a` 和 `b` 的较大值。 |\n| | |\n| `max(initialiser list)`\
  \ | 返回初始化列表中的最大值。 |\n| | |\n| `max(initialiser list, comp)` | 根据谓词 `comp` 返回初始化列表中的最大值。\
  \ |\n| | |\n| `minmax(a, b)` | 返回 `a` 和 `b` 的较小值和较大值。 |\n| | |\n| `minmax(a, b,\
  \ comp)` | 根据谓词 `comp` 返回 `a` 和 `b` 的较小值和较大值。 |\n| | |\n| `minmax(initialiser list)`\
  \ | 返回初始化列表中的最小值和最大值。 |\n| | |\n| `minmax(initialiser list, comp)` | 根据谓词 `comp`\
  \ 返回初始化列表中的最小值和最大值。 |\n\n### `std::midpoint` 和 `std::lerp`\n\n函数 `std::midpoint(a,\
  \ b)` 计算 `a` 和 `b` 之间的中间点。`a` 和 `b` 可以是整数、浮点数或指针。如果 `a` 和 `b` 是指针，它们必须指向同一个数组对象。函数\
  \ `std::midpoint` 需要 `<numeric>` 头文件。\n\n函数 `std::lerp(a, b, t)` 计算两个数字的线性插值。它需要\
  \ `<cmath>` 头文件。返回值为 `a + t(b - a)`。\n\n```\n// midpointLerp.cpp\n\n#include <cmath>\n\
  #include <numeric>\n\n...\n\nstd::midpoint(a, b)\nstd::lerp(a, b, t)\n```\n\n\n\n\
  \n`std::bind`、`std::bind_front`、`std::bind_back` 和 `std::function` 这三个函数非常契合使用。虽然\
  \ `std::bind`、`std::bind_front` 或 `std::bind_back` 允许你动态创建新的函数对象，但 `std::function`\
  \ 会接收这些临时函数对象并将它们绑定到变量。\n\n## `std::bind`\n\n`std::bind` 函数比 `std::bind_front` 或\
  \ `std::bind_back` 更强大，因为 `std::bind` 允许将参数绑定到任意位置。虽然 `std::bind`、`std::bind_front`\
  \ 和 `std::bind_back` 允许你动态创建新的函数对象，但 `std::function` 会接收这些临时函数对象并将它们绑定到变量。这些函数是函数式编程中的强大工具，需要包含头文件\
  \ `<functional>`。\n\n```\n// bindAndFunction.cpp \n...\n#include <functional>\n\
  ...\n// 用于占位符 _1 和 _2\nusing namespace std::placeholders; \n\nusing std::bind;\n\
  using std::bind_front;\nusing std::bind_back;\nusing std::function\n...\ndouble\
  \ divMe(double a, double b){ return a/b; };\n\nfunction<double(double, double)>\
  \ myDiv1 = bind(divMe, _1, _2);  // 200\nfunction<double(double)> myDiv2 = bind(divMe,\
  \ 2000, _1);        // 200\nfunction<double(double>> myDiv3 = bind_front(divMe,\
  \ 2000);      // 200\nfunction<double(double)> myDiv4 = bind_back(divMe, 10);  \
  \       // 200\n```\n\n### 创建并绑定函数对象\n\n由于 [`std::bind`](http://en.cppreference.com/w/cpp/utility/functional/bind)，你可以以多种方式创建函数对象：\n\
  \n* 将参数绑定到任意位置，\n* 更改参数的顺序，\n* 为参数引入占位符，\n* 对函数进行部分求值，\n* 调用新创建的函数对象，在 STL 算法中使用它们，或将其存储在\
  \ `std::function` 中。\n\n## `std::bind_front` (C++20)\n\n[`std::bind_front`](https://en.cppreference.com/w/cpp/utility/functional/bind_front)\
  \ 从可调用对象创建一个可调用包装器。调用 `std::bind_front(func, arg ...)` 将所有参数 `arg` 绑定到 `func` 的头部并返回一个可调用包装器。\n\
  \n## `std::bind_back` (C++23)\n\n[`std::bind_back`](https://en.cppreference.com/w/cpp/utility/functional/bind_front)\
  \ 从可调用对象创建一个可调用包装器。调用 `std::bind_back(func, arg ...)` 将所有参数 `arg` 绑定到 `func` 的尾部并返回一个可调用包装器。\n\
  \n## `std::function`\n\n[`std::function`](http://en.cppreference.com/w/cpp/utility/functional/function)\
  \ 可以在变量中存储任意的可调用对象。它是一个多态函数包装器。可调用对象可以是 Lambda 函数、函数对象或函数。如果你必须显式指定可调用对象的类型，那么 `std::function`\
  \ 是必不可少的且不能被 `auto` 替换。\n\n```\n// dispatchTable.cpp \n...\n#include <functional>\n\
  ...\nusing std::make_pair;\nusing std::map;\n\nmap<const char, std::function<double(double,\
  \ double)>> tab;\ntab.insert(make_pair('+', [](double a, double b){ return a + b;\
  \ }));\ntab.insert(make_pair('-', [](double a, double b){ return a - b; }));\ntab.insert(make_pair('*',\
  \ [](double a, double b){ return a * b; }));\ntab.insert(make_pair('/', [](double\
  \ a, double b){ return a / b; }));\n\nstd::cout << tab'+';  // 8\nstd::cout << tab'-';\
  \  // -1\nstd::cout << tab'*';  // 15.75\nstd::cout << tab'/';  // 0.777778\n```\n\
  \n使用 `std::function` 的分发表\n\n`std::function` 的类型参数定义了 `std::function` 将接受的可调用对象类型。\n\
  \n### 返回类型和参数类型\n\n| 函数类型 | 返回类型 | 参数类型 |\n| --- | --- | --- |\n| `double(double,\
  \ double)` | `double` | `double` |\n| `int()` | `int` | |\n| `double(int, double)`\
  \ | `double` | `int, double` |\n| `void()` | | |\n\n### 数值对 (Pairs)\n\n你可以使用 [`std::pair`](http://en.cppreference.com/w/cpp/utility/pair)\
  \ 构建任意类型的对。类模板 `std::pair` 需要头文件 `<utility>`。`std::pair` 默认构造函数、拷贝构造函数和移动构造函数。你可以交换对。\n\
  \n函数 [`std::minmax`](http://en.cppreference.com/w/cpp/algorithm/minmax) 返回一个 `std::pair`。例如，`std::minmax`\
  \ 在 C++ 中常用于查找范围内的 `min` 和 `max` 元素。`std::minmax` 可以配合 `std::algorithm` 使用。\n\n\
  `std::minmax` 函数返回一个包含最小最大元素的 `std::pair`。`std::minmax` 可以配合 `std::algorithm` 使用。\n\
  \n### `std::make_pair`\n\n[`std::make_pair`](http://en.cppreference.com/w/cpp/utility/make_pair)\
  \ 函数可以在不需要指定类型的情况下创建 `std::pair`。\n\n```cpp\n// make_pair.cpp\n...\n#include <utility>\n\
  ...\nauto p = std::make_pair(10, \"hello\");\n```\n\n### 元组 (Tuples)\n\n你可以创建任意长度的元组。辅助函数\
  \ [`std::make_tuple`](http://en.cppreference.com/w/cpp/utility/tuple/make_tuple\
  \ 提供了一种创建元组的方便方法。你不需要指定类型，编译器会自动推导它们。\n\n### `std::tuple`\n\n```cpp\nauto pair=\
  \ std::make_pair(1, true);\nstd::tuple<int, bool> tup= pair;\n```\n\n### `std::tie`\
  \ 和 `std::ignore`\n\n[`std::tie`](http://en.cppreference.com/w/cpp/utility/tuple/tie)\
  \ 允许你创建引用变量的元组。你可以使用 [`std::ignore`](http://en.cppreference.com/w/cpp/utility/tuple/ignore)\
  \ 显式忽略元组元素。\n\n\n\n\n\n```cpp\n// tupleTie.cpp \n...\n#include <tuple>\n...\nusing\
  \ namespace std;\n\nint first= 1;\nint second= 2;\nint third= 3;\nint fourth= 4;\n\
  cout << first << \" \" << second << \" \"\n     << third << \" \" << fourth << endl;\
  \          // 1 2 3 4\n\nauto tup= tie(first, second, third, fourth)      // 绑定元\n\
  \        = std::make_tuple(101, 102, 103, 104);   // 创建元组\n                    \
  \                             // 并赋值它\ncout << get<0>(tup) << \" \" << get<1>(tup)\
  \ << \" \" << get<2>(tup)\n     << \" \" << get<3>(tup) << endl;              //\
  \ 101 102 103 104\ncout << first << \" \" << second << \" \" << third << \" \"\n\
  \     << fourth << endl;                          // 101 102 103 104\n\nfirst= 201;\n\
  get<1>(tup)= 202;\ncout << get<0>(tup) << \" \" << get<1>(tup) << \" \" << get<2>(tup)\n\
  \     << \" \" << get<3>(tup) << endl;              // 201 202 103 104\ncout <<\
  \ first << \" \" << second << \" \" << third << \" \"\n     << fourth << endl; \
  \                         // 201 202 103 104\n\nint a, b;\ntie(std::ignore, a, std::ignore,\
  \ b)= tup;\ncout << a << \" \" << b << endl;                   // 202 104\n```\n\
  \n辅助函数 `std::tie` 和 `std::ignore`\n\n## 引用包装器 (Reference Wrappers)\n\n引用包装器是一个用于\
  \ `&` 类型对象的[可拷贝构造](http://en.cppreference.com/w/cpp/concept/CopyConstructible)且[可拷贝赋值](http://en.cppreference.com/w/cpp/concept/CopyAssignable)的包装器，定义在头文件\
  \ `<functional>` 中。你拥有一个行为像引用但可以拷贝的对象。与经典引用相反，[`std::reference_wrapper`](http://en.cppreference.com/w/cpp/utility/functional/reference_wrapper)\
  \ 对象支持两个额外的用例：\n\n* 你可以在标准模板库（STL）的容器中使用它们。`std::vector<std::reference_wrapper<int>>\
  \ myIntRefVector`\n* 你可以复制包含 `std::reference_wrapper` 对象的类实例。这在通常情况下通过引用是不可能的。\n\
  \n`get` 成员函数允许访问引用：`myInt.get()`。你可以使用引用包装器来封装并调用可调用对象。\n\n```cpp\n// referenceWrapperCallable.cpp\
  \ \n...\n#include <functional>\n...\nvoid foo(){ \n  std::cout << \"Invoked\" <<\
  \ '\\n'; \n}\n\ntypedef void callableUnit();\nstd::reference_wrapper<callableUnit>\
  \ refWrap(foo);\n\nrefWrap();                           // Invoked\n```\n\n### std::ref\
  \ 和 std::cref\n\n通过辅助函数 [`std::ref`](http://en.cppreference.com/w/cpp/utility/functional/ref)\
  \ 和 [`std::cref`](http://en.cppreference.com/w/cpp/utility/functional/ref)，你可以轻松地为变量创建引用包装器。`std::ref`\
  \ 会创建一个非常量引用包装器，`std::cref` 则创建一个常量引用包装器：\n\n```cpp\n// referenceWrapperRefCref.cpp\
  \ \n...\n#include <functional>\n...\nvoid invokeMe(const std::string& s){\n  std::cout\
  \ << s << \": const \" << '\\n';\n}\n\ntemplate <typename T>\n  void doubleMe(T\
  \ t){ \n  t*= 2; \n}\n\nstd::string s{\"string\"};\n\ninvokeMe(std::cref(s));  \
  \      // string\n\nint i= 1;\nstd::cout << i << '\\n';   // 1\n\ndoubleMe(i);\n\
  std::cout << i << '\\n';   // 1S\n\ndoubleMe(std::ref(i));\nstd::cout << i << '\\\
  n';   // 2\n```\n\n辅助函数 `std::ref` 和 `std::cref`\n\n可以通过对 `std::string` 传递常量引用来调用函数\
  \ `invokeMe`，使用封装在 `std::cref(s)` 中的非常量 `s`。当我将变量 `i` 封装在辅助函数 `std::ref` 中时，函数模板\
  \ `doubleMe` 会通过引用调用。因此，变量 `i` 的值翻倍了。\n\n## 智能指针 (Smart Pointers)\n\n智能指针对 C++ 至关重要，因为它们让你能够在\
  \ C++ 中实现显式的内存管理。除了弃用的 `std::auto_ptr`，C++ 还提供了三种智能指针。它们定义在头文件 `<memory>` 中。\n\n\
  首先，`std::unique_ptr` 建模了独占所有权的概念。其次，`std::shared_ptr` 建模了共享所有权的概念。最后是 `std::weak_ptr`。`std::weak_ptr`\
  \ 不智能是因为它的接口有限。它的作用是打破 `std::shared_ptr` 的循环。它建模了临时所有权的概念。智能指针根据 RAII 范式管理资源。因此，如果智能指针超出作用域，资源将自动释放。\n\
  \n### 智能指针概述\n\n| 名称 | 标准 | 描述 |\n| :--- | :--- | :--- |\n| `std::auto_ptr` | C++98\
  \ | 独占所有资源。拷贝时移动（已弃用）。 |\n| `std::unique_ptr` | C++11 | 独占所有资源。不可拷贝。 |\n| `std::shared_ptr`\
  \ | C++11 | 为变量拥有引用计数器。自动管理引用计数器。 |\n| `std::weak_ptr` | C++11 | 帮助打破 `std::shared_ptr`\
