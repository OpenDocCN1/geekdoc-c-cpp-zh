  \ `reverse_view`, `reverse`。\n- **基础**: `basic_istream_view`, `istream_view`, `elements_view`,\
  \ `keys_view`, `values_view`。\n\n### 迭代器与原子操作\n- **迭代器分类**: `Iterators categories`。\n\
