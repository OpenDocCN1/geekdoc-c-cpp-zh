  \ FwdIt last1, \n              FwdIt1 first2, FwdIt1 last2, BinPre pre)\n```\n\n\
  ### 将第一个范围中不在第二个范围内的元素拷贝到 `result`：\n\n```\nOutIt set_difference(InpIt first1, InpIt\
