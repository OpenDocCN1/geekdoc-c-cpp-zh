  \ last1, \n             FwdpIt2 first2, FwdIt2 last2, FwdIt3 result, BiPre pre)\n\
  \nbool includes(InpIt first1, InpIt last1, InpIt1 first2, InpIt1 last2)\nbool includes(ExePol\
  \ pol, FwdIt first1, FwdIt last1, FwdIt1 first2, FwdIt1 last2)\n\nbool includes(InpIt\
  \ first1, InpIt last1, InpIt first2, InpIt last2, BinPre pre)\nbool includes(ExePol\
  \ pol, FwdIt first1, FwdIt last1, \n              FwdIt1 first2, FwdIt1 last2, BinPre\
  \ pre)\n\nOutIt set_difference(InpIt first1, InpIt last1, InpIt1 first2, InpIt2\
  \ last2, \n                     OutIt result)\nFwdIt2 set_difference(ExePol pol,\
  \ FwdIt first1, FwdIt last1, \n                     FWdIt1 first2, FwdIt1 last2,\
  \ FwdIt2 result)\n\nOutIt set_difference(InpIt first1, InpIt last1, InpIt1 first2,\
  \ InpIt2 last2, \n                     OutIt result, BiPre pre)\nFwdIt2 set_difference(ExePol\
  \ pol, FwdIt first1, FwdIt last1, \n                      FwdIt1 first2, FwdIt1\
  \ last2, FwdIt2 result, BiPre pre)\n\nOutIt set_intersection(InpIt first1, InpIt\
  \ last1, InpIt1 first2, InpIt2 last2, \n                       OutIt result)\nFwdIt2\
  \ set_intersection(ExePol pol, FwdIt first1, FwdIt last1, \n                   \
  \     FWdIt1 first2, FwdIt1 last2, FwdIt2 result)\n\nOutIt set_intersection(InpIt\
  \ first1, InpIt last1, InpIt1 first2, InpIt2 last2, \n                       OutIt\
  \ result, BiPre pre)\nFwdIt2 set_intersection(ExePol pol, FwdIt first1, FwdIt last1,\
  \ \n                        FwdIt1 first2, FwdIt1 last2, FwdIt2 result, BiPre pre)\n\
  \nOutIt set_symmetric_difference(InpIt first1, InpIt last1, \n                 \
  \              InpIt1 first2, InpIt2 last2, OutIt result)\nFwdIt2 set_symmetric_difference(ExePol\
  \ pol, FwdIt first1, FwdIt last1, \n                                FWdIt1 first2,\
  \ FwdIt1 last2, FwdIt2 result)\n\nOutIt set_symmetric_difference(InpIt first1, InpIt\
  \ last1, \n                               InpIt1 first2, InpIt2 last2, OutIt result,\
  \ \n                               BiPre pre)\nFwdIt2 set_symmetric_difference(ExePol\
  \ pol, FwdIt first1, FwdIt last1, \n                                FwdIt1 first2,\
  \ FwdIt1 last2, FwdIt2 result, \n                                BiPre pre)\n\n\
  OutIt set_union(InpIt first1, InpIt last1, \n                InpIt1 first2, InpIt2\
  \ last2, OutIt result)\nFwdIt2 set_union(ExePol pol, FwdIt first1, FwdIt last1,\
  \ \n                 FWdIt1 first2, FwdIt1 last2, FwdIt2 result)\n\nOutIt set_union(InpIt\
  \ first1, InpIt last1, \n               InpIt1 first2, InpIt2 last2, OutIt result,\
  \ BiPre pre)\nFwdIt2 set_union(ExePol pol, FwdIt first1, FwdIt last1, \n       \
