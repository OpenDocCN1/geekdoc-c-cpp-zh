  \ pre)\nFwdIt2 set_difference(ExePol pol, FwdIt first1, FwdIt last1, \n        \
  \              FwdIt1 first2, FwdIt1 last2, FwdIt2 result, BiPre pre)\n```\n\n###\
  \ 求第一个范围与第二个范围的交集并将结果拷贝到 `result`：\n\n```\nOutIt set_intersection(InpIt first1,\
  \ InpIt last1, InpIt1 first2, InpIt2 last2, \n                       OutIt result)\n\
  FwdIt2 set_intersection(ExePol pol, FwdIt first1, FwdIt last1, \n              \
  \          FWdIt1 first2, FwdIt1 last2, FwdIt2 result)\n\nOutIt set_intersection(InpIt\
  \ first1, InpIt last1, InpIt1 first2, InpIt2 last2, \n                       OutIt\
  \ result, BiPre pre)\nFwdIt2 set_intersection(ExePol pol, FwdIt first1, FwdIt last1,\
  \ \n                        FwdIt1 first2, FwdIt1 last2, FwdIt2 result, BiPre pre)\n\
  ```\n\n### 求第一个范围与第二个范围的对称差并将结果拷贝到 `result`：\n\n```\nOutIt set_symmetric_difference(InpIt\
  \ first1, InpIt last1, \n                               InpIt1 first2, InpIt2 last2,\
  \ OutIt result)\nFwdIt2 set_symmetric_difference(ExePol pol, FwdIt first1, FwdIt\
  \ last1, \n                                FWdIt1 first2, FwdIt1 last2, FwdIt2 result)\n\
  \nOutIt set_symmetric_difference(InpIt first1, InpIt last1, \n                 \
  \              InpIt1 first2, InpIt2 last2, OutIt result, \n                   \
  \            BiPre pre)\nFwdIt2 set_symmetric_difference(ExePol pol, FwdIt first1,\
  \ FwdIt last1, \n                                FwdIt1 first2, FwdIt1 last2, FwdIt2\
  \ result, \n                                BiPre pre)\n```\n\n### 求第一个范围与第二个范围的并集并将拷贝到\
  \ `result`：\n\n```cpp\nOutIt set_union(InpIt first1, InpIt last1, \n           \
  \     InpIt1 first2, InpIt2 last2, OutIt result)\nFwdIt2 set_union(ExePol pol, FwdIt\
  \ first1, FwdIt last1, \n                 FWdIt1 first2, FwdIt1 last2, FwdIt2 result)\n\
  \nOutIt set_union(InpIt first1, InpIt last1, \n               InpIt1 first2, InpIt2\
  \ last2, OutIt result, BiPre pre)\nFwdIt2 set_union(ExePol pol, FwdIt first1, FwdIt\
  \ last1, \n                 FwdIt1 first2, FwdIt1 last2, FwdIt2 result, BiPre pre)\n\
  ```返回的迭代器是目标范围的结束迭代器。`std::set_difference` 的目标范围包含第一个范围中但不在第二个范围中的元素。相反，`std::symmetric_difference`\
  \ 的目标范围只包含一个范围中但不在另一个范围中的元素。`std::union` 求并集。\n\n```cpp\nOutIt merge(InpIt first1,\
  \ InpIt last1, InpIt first2, InpIt last2, OutIt result)\nFwdIt3 merge(ExePol pol,\
  \ FwdIt1 first1, FwdIt1 last1, \n             FwdIt2 first2, FwdIt2 last2, FwdIt3\
  \ result)\n\nOutIt merge(InpIt first1, InpIt last1, InpIt first2, InpIt last2, OutIt\
