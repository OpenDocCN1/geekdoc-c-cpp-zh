  \ 离开作用域，引用计数将减一。如果引用计数器变为 0 且不再有 `std::shared_ptr` 引用该资源，C++ 运行时将自动释放该资源。资源的释放正好发生在最后一个\
  \ `std::shared_ptr` 离开作用域时。C++ 运行时保证引用计数器的调用是原子操作。由于这种管理开销，`std::shared_ptr` 比原始指针或\
