  \ 版本更加方便携带。\" \n```\n\n## 引言\n\n### 本书的目的\n\nC++ 标准库是当前 C++23 标准 [ISO/IEC 14882:2023](https://www.iso.org/standards.html)\
  \ 标准库的快速参考。C++23 有超过 2100 页，并遵循重大的 C++20 标准。相比之下，C++23 和 C++17 既不是大标准也不是小标准。C++14\
  \ 是对 C++11 的小幅补充。C++11 有超过 1,300 页，并于 2011 年出版。那是自第一个也是唯一的 C++ 标准 C++98 发布后的 13\
  \ 年。当然，还有 2003 年出版的 C++03。但 C++03 被认为是一个错误修复版本。\n\n本快速参考书旨在为 C++ 标准库提供一个简洁的参考。本书假设你已经熟悉\
  \ C++。如果是这样，你将从书中获得最大的益处。如果 C++ 对你来说是新的，你应该从一本关于 C++ 核心的教科书开始。一旦掌握了关于核心语言的书，你就可以通过阅读这本书迈出下一个大步。为了让你的工作更容易，我提供了许多短代码片段来连接理论与实践。\n\
  \n## 索引\n\n本书应该是 C++ 的参考书，因此应该有一个索引。Leanpub 不支持创建索引。因此，我根据正则表达式、命名约定、大量的 Python\
  \ 魔法以及一张我必须为每一页拆分的表格创建了索引。问题在于：索引仅在书的 PDF 格式中完全可用。\n\n## 约定\n\n我承诺只会有几种约定。\n\n####\
