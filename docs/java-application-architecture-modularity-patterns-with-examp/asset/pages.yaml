  md: 'avoid modules with a lot of abstract classes that have no incoming dependencies.
    First, if all classes are abstract, there is no behavior. Second, having no incoming
    dependencies implies nothing uses the module. Abstract Modules and Separate Abstractions
    clearly illustrate the value of a dependency on only the abstract elements of
    a package.


    # CONSEQUENCES


    Heavily depended upon may have many incoming dependencies. In other words, you
    may have many modules that all depend on a single module. On one hand, this is
    a good thing because you''ve managed to maximize reuse of the module with many
    incoming dependencies. But reuse has its challenges. If the modules you''re reusing
    heavily require a change, the ramifications of that change can ripple throughout
    all dependent modules. Changing a heavily reused module can be a maintenance headache.


    If you have to change a stable module, you''ll experience a ripple effect throughout
    much of the application. Unless it''s a simple change, the ripple is almost certain
    to cause a problem elsewhere. You''ll probably have a gut feeling telling you
    what to expect of your change, and you should listen. The more you have to change
    stable modules, the less maintainable you will find the application.


    A module can undergo two types of changes: to its interface or to its implementation.
    If you change the interface of the module, it impacts other modules that rely
    on that interface. Changing an implementation that is encapsulated within the
    module should be less risky, because change is isolated to the individual module.
    A Test Module helps you verify that your changes did not unexpectedly break.


    Some modules within an application are very widely used. A module that can be
    used by any other module is a low-level module. An example of a low-level module
    is one containing utility classes that provide helpful methods to manipulate strings
    and format dates. You have to be cautious when changing low-level modules, even
    if your change is confined to the implementation details. A small problem can
    cause widespread failure.


