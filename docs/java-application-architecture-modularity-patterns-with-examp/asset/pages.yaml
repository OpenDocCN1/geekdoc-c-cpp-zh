  md: '# INTRODUCTION


    which deployable units is also a physical design issue. Managing the relationships
    between the deployable entities is also a physical design issue. Physical design
    is equally as as, if not more important than, logical design.


    For example, defining an interface to decouple clients from all classes implementing
    the interface is a logical design issue. Decoupling in this fashion certainly
    allows you to create new implementations of the interface without impacting clients.
    However, the allocation of the interface and its implementing classes to their
    physical entities is a physical design issue. If the interface has several different
    implementations and each of those implementation classes has underlying dependencies,
    the placement of the interface and implementation has a tremendous impact on the
    overall quality of the system''s software architecture. Placing the interface
    and implementation in the same module introduces the risk of undesirable deployment
    dependencies. If one of the implementations is dependent upon a complex underlying
    structure, then you''ll be forced to include this dependent structure in all deployments,
    regardless of which you choose to use. Regardless of the quality of the logical
    design, the dependencies between the physical entities will inhibit reusability,
    maintainability, and many other benefits you hope to achieve with your design.


    Unfortunately, although many teams spend a good share of time on logical design,
    few teams devote effort to their physical design. Physical design is about how
    we partition the software system into a system of modules. Physical design is
    about software modularity.


    # MODULARITY


    Large systems are inherently more complex to develop and maintain than smaller
    systems. Modularity involves breaking a large system into separate physical entities
    that ultimately makes the system easier to understand. By understanding the behaviors
    contained within a module and the dependencies that exist between modules, it''s
    easier to identify and assess the ramification of change.


    For instance, software modules with few incoming dependencies are easier to change
    than software modules with many incoming dependencies. Likewise, software modules
    with few outgoing dependencies are much easier to reuse than software modules
    with many outgoing dependencies. Reuse and maintainability are important factors
    to consider when designing software modules, and dependencies play an important
    factor. But dependencies aren''t the only factor.'
  merge: -1
