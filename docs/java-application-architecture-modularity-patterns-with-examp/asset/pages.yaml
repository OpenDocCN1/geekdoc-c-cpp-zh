  md: '# COLOCATE EXCEPTIONS


    # STATEMENT


    Exceptions should be close to the class or interface that throws them.


    # DESCRIPTION


    Sadly, dealing with exceptions in enterprise software systems is often an afterthought.
    But, the allocation of exceptions to modules has significant implications for
    the modularity and, more specifically, the dependencies between modules within
    our software system. Placing the exception close to a class that catches it often
    causes a cyclic dependency between the module containing the class that throws
    the exception and the module containing the class that catches the exception.
    Exceptions should always be placed in a module closer to the class that throws
    the exception than a module closer to the class that catches the exception. This
    helps maintain your desired module dependency structure. Figure 12.1 illustrates
    this scenario.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_275_0.png)'
