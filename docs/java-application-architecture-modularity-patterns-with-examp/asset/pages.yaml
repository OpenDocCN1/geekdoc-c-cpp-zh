  md: '# FUTURE OF OSGI


    OSGi is not new. It has been around since the late 1990s. Unfortunately, although
    OSGI is the only dynamic module system for the Java platform, adoption is not
    widespread. However, traction within the industry is building-slow. Many products
    continue to emerge that leverage OSGi internally, and more are beginning to expose
    the virtues of OSGI to the developer community. But, there is a concern that OSGI
    will not have the disruptive impact of which it''s capable. I assert that if OSGI
    does succeed, it won''t be based on the technical merits of OSGI. It''ll be because
    of something else. Something trendy. Fashionable.


    Now, I could be wrong. OSGi adoption is certainly increasing, albeit slowly. And
    as case studies begin to emerge that the cost reduction, improved responsiveness,
    and time-to-market advantages of OSGi, adoption will likely continue to rise.


    But, adoption is one thing, another, and I still have a hesitation. What if something
    trendier, more fashionable surfaces, and OSGi is pushed into the backwaters? Will
    it really have the impact it''s capable of? You know... an “iPhone-esque” impact
    that raises the bar and redefines an industry. Something not just evolutionary
    but truly disruptive.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 17.1 OSGI AS AN ENABLER


    OSGi to cross the chasm, must enable something big that a business wants to buy.
    Maybe cost reduction, improved responsiveness, and time-to-market benefits will
    be enough. But, that''s easily perceived by many as a rather evolutionary impact.
    It''s not really disruptive.


    Possibly, OSGi will flourish in the data center, as organizations seek more adaptable
    platforms that lend them these benefits. But this doesn''t necessarily guarantee
    that development teams will leverage OSGi to build systems with a modular architecture.
    Leveraging a platform built atop modular software systems, even though OSGi enables
    both.


    Without something trendy that promises real benefits, it''ll get brushed under
    the carpet like what has happened to many technologically superior solutions.
    Perhaps it''s already happening, with all the hype surrounding the cloud. Or maybe
    it''ll be the cloud that helps OSGi cross the chasm. OSGi doesn''t obviously enable
    the cloud, but OSGi can enable the dynamic and adaptive runtime benefits of the
    cloud.


    But again, this doesn''t mean teams will begin leveraging OSGi to design modular
    software. It only means that the platform itself is adapt-able. Of course, there
    is benefit in that. But, if that''s the route that is taken, teams will still
    continue to develop monolithic applications that lack architecturally resiliency,
    and the full benefit of OSGi (and modularity) will not be realized.


    # 17.2 The Disruption


    OSGi has the potential to have a much broader impact, affecting everyone from
    the developer to those working in the data center. So, what might this trend be
    propel OSGi to stardom?


    OSGi enables ecosystems!


    Now, you''re thinking that I''ve gone off the deep end, perhaps? But, give me
    a chance to explain.'
  merge: -1
  pgno: 341
