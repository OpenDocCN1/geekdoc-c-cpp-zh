  md: '# CHAPTER 17 FUTURE OF OSGI


    # 17.4 THE ECOSYSTEM


    It''s easy to find holes in this idea. To explain why it cannot work. Yet, it''s
    happening everywhere, so why not on the server... in the enterprise? Certainly,
    there are a variety of different ways such an ecosystem could manifest itself.
    Possibly multiple ecosystems emerge like what we see in the mobile market today.


    But for a moment, imagine the world where you have the ability to easily assemble
    a platform from prebuilt infrastructure modules that exactly meet the demands
    of your application. You might purchase these modules, you might choose to use
    open source modules, or you might build them yourself. Those you don''t build
    you obtain from a module marketplace, possibly deploying them to your (cloud)
    environment.


    When you choose to use a module, it''s dynamically deployed to your environment.
    The modules depends upon? You''re given the option to purchase and deploy them.
    You develop software modules using the sound principles and patterns of modular
    design to ensure loose coupling and high cohesion. As you roll out your business
    solution modules, you simultaneously deploy the additional infrastructure modules
    that are needed.


    In this marketplace, modules are sourced from multiple vendors. Some large. Some
    small. Neither the stack nor your applications are monolithic beasts. Instead,
    they are a composition of collaborating software modules. Your infrastructure
    isnt'' necessarily tied to a specific vendor solution. The option always exists
    for organizations to purchase modules from different providers, easily swapping
    provider module out with another.


    The ecosystem flourishes. Developers flock to sell their latest creation. Organizations
    seek to add amazing capabilities to their right-sized environment at a fraction
    of the cost compared to what they are accustomed to today. The business benefits
    are real. The technical advantages are real. And the resulting ecosystem is sustainable.


    A successful ecosystem demands both the runtime model and the development model.
    Today, OSGI is the only standard technology that will allow this type of successful
    ecosystem to form on the Java platform. But, will it happen? We may have a long
    way to go, but it sure would be cool! And it would be a shame if we lost this
    opportunity.'
