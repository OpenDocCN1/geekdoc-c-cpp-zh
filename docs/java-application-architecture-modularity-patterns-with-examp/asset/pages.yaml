    module and context dependencies, while creating further modules decreases dependencies
    but also decreases reuse. Modules that are too lightweight provide minimal value
    and may require other modules to be useful. Modules that are too heavyweight are
    difficult to reuse because they do more than what the client needs. Of course,
    there are other challenges beyond reuse, such as the ability to understand and
    maintain the system.


    Coarse-grained and heavyweight modules may do a good job of encapsulating change
