    we make the statement about where the factory class must reside:


    The factory class must not be in the same module as the class instances it creates
    or in the same module as the class into which it''s injecting those instances.


    So, where does it live? If the factory is a class, it should live in a separate
    module. But typically, we don''t create our own factory classes. More likely we''ll
    use a dependency injection framework. And many dependency injection frameworks
    wire together instances based on an XML configuration. In these cases, we have
    a bit more flexibility since the class isn''t directly referenced as a class data
    type but inferred dynamically based on its fully qualified class name. This avoids
    the tight coupling we are trying to avoid, the configuration can live within one
    of the modules. As new modules are introduced that must use different implementations,
    they can include their own configuration files. Alternatively, we can include
    the configurations in separate modules and replace only those modules with new
    configurations as necessary.


    # CONSEQUENCES


    An Implementation Factory contributes to a more complex system structure. Either
    more classes are necessary or a dependency injection framework where configuration
    files define the wiring must be used. Additionally, an Implementation Factory
    implies that classes are coupled abstractly. Certainly, if classes weren''t coupled
    abstractly, there would be no need for an Implementation Factory. Classes could
    easily create other instances.


    Abstract coupling offers significant flexibility. To realize the flexibility offered
    by other patterns such as Abstract Modules and Separate Abstractions, Implementation
    Factory is not only desirable but required. Ensuring that the factory, and corresponding
    modules, are designed correctly'
