  md: '# CHAPTER 3 ARCHITECTURE AND MODULARITY


    In the Open Group Architecture Framework (TOGAF), architecture has two meanings
    depending on context (the Open Group):


    +   1) A formal description of a system, or a detailed plan of the system at component
    level to guide its implementation

    2) The structure of components, their inter-relationships, and the principles
    and guidelines governing their design and evolution over time


    Examining these definitions reveals many common keywords, which I have made bold
    the various definitions. Important underlying currents are embodied by these keywords.
    But, these keywords lead to some important questions that must be answered to
    fully understand architecture. What makes a decision architecturally significant?
    What are the elements of composition? How do we accommodate evolution of architecture?
    What does this have to do with modularity? As we delve into these questions, I
    want to start with a story on software architecture.


    # 3.2 A Software ARCHITECTURE STORY


    The story of software architecture reminds me of the following story (Hawking
    1998):


    A well-known scientist (some say it was Bertrand Russell) once gave a public lecture
    on astronomy. He described how the earth orbits around the sun and the sun, in
    turn, orbits around the center of a vast collection of stars called our galaxy.
    At the end of the lecture, a little old lady at the back of the room got up and
    said: "What you have told us is rubbish. The world is a really flat plate situated
    on the back of a giant tortoise." The scientist gave a superior smile before replying,
    "What is the tortoise standing on? ''You’re very clever, young man, very clever,''
    said the old lady.\nBut it’s turtles all the way down!"


    > —Brief History of Time by Stephen Hawking


    Software architecture is "turtles all the way down." How? This section discusses
    these ideas.


    # 3.2.1 THE IVORY TOWER


    Many of us relate to the ivory tower. In dysfunctional organizations, architects
    and developers fail to communicate effectively. The result is a'
