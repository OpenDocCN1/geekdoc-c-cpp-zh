  md: 'In this part, we present the Patterns of Modular Architecture (POMA). Here''s
    a synopsis of each category of patterns.


    # CHAPTER 8: BASE PATTERNS


    The base patterns are the fundamental elements upon which many of the other patterns
    exist. They establish the conscientious thought process that go into designing
    systems with a modular architecture. They focus on modules as the unit of reuse,
    dependency management, and cohesion. Each is an important element of well-designed
    modular software systems. The base patterns include the following:


    +   * Manage Relationships: Design module relationships.

    * Module Reuse: Emphasize reusability at the module level.

    * Cohesive Modules: Module behavior should serve a singular purpose.


    # CHAPTER 9: DEPENDENCY PATTERNS


    I find it fascinating that development teams spend so much time designing class
    relationships but so little time creating a supporting physical structure. Here,
    you''ll find some guidance that will help you create a physical'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'structure that emphasizes low coupling between modules. You''ll also find some
    discussion exploring how module design impacts deployment. The dependency patterns
    include the following:


    +   - Acyclic Relationships: Module relationships must be acyclic.

    - Levelize Modules: Module relationships should be leveled.

    - Physical Layers: Module relationships should not violate the conceptual layers.

    - Container Independence: Modules should be independent of the runtime container.

    - Independent Deployment: Modules should be independently deployable units.


    # CHAPTER 10: USABILITY PATTERNS


    Although coupling is an important measurement, cohesion is equally important.
    It''s easy to create and manage module dependencies if I throw all of my classes
    in a couple of JAR files. But in doing so, I''ve introduced a maintenance nightmare.
    In this chapter, we''ll see patterns that help ensure our modules are cohesive
    units. It''s interesting that you''ll find some contention between the dependency
    patterns and usability patterns. I''m going to talk about this contention, what
    you can do to manage it, and when you want to do it. The usability patterns include
    the following:


    +   - Published Interface: Make a module''s published interface well

    - External Configuration: Modules should be externally configurable.

    - Default Implementation: Provide modules with a default implementation.

    - Module Facade: Create a facade serving as a coarse-grained entry point to another
    fine-grained module''s underlying implementation.


    # CHAPTER II: EXTENSIBILITY PATTERNS


    A goal in designing software systems is the ability to extend the system without
    modifying the existing codebase. Abstraction plays a central role'
  merge: -1
