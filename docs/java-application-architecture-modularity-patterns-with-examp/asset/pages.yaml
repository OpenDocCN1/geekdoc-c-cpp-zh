  md: '# COHESIVE MODULES


    # COHESIVE MODULES


    # STATEMENT


    Module behavior should serve a singular purpose.


    # DESCRIPTION


    Cohesion is a measure of how closely related and focused the various responsibilities
    of a module are. In the worst-case scenario, little emphasis is placed on the
    allocation of classes to modules. Instead, behavior is allocated randomly, and
    the likelihood that modules suffer from lack of functional cohesion. In the best-case
    scenario, modules exhibit high degrees of functional cohesion, and the entities
    composing the module each in conjunction to fulfill module behavior.


    In general, cohesion is a qualitative measurement that is difficult to measure
    objectively. Instead, we typically refer to a software module as possessing either
    high cohesion or low cohesion. Modules with higher degrees of cohesion are preferred.


    # IMPLEMENTATION VARIATIONS


    Two key elements affect module cohesion:


    +   - The rate at which the behavior among the classes within a module change

    - The likelihood that the classes within a module are reused together


    Based on these statements, it''s easy to draw the following conclusion:


    +   - Classes that change at different rates belong in separate modules.

    - Classes that change at the same rate belong in the same module.

    - Classes not reused together belong in separate modules.

    - Classes reused together belong in the same module.


    Unfortunately, this simple logic is flawed because it doesn''t consider the intricate
    relation between the rate of change, reuse, and the natural shifts that occur
    throughout the development life cycle. It''s possible, even likely, that classes
    change at different rates but are reused together or that classes change at the
    same rate but are rarely reused. Indeed,


