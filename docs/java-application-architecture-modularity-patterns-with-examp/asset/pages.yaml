    #  7.11.2 A NOTE ON MANAGING MODULE DEPENDENCIES


    module 48 Modularizing a system on a platform that supports modularity is challenging.
    Modularizing a system on a platform that doesn''t support modularity is even more
    challenging. One of the greatest challenges is in managing module dependencies.
    Tracking the dependencies between modules is quite difficult.


    This is where module systems like OSGI help tremendously by enforcing the module
    dependencies. In Java today, and platforms used in the enterprise today, there
    is no module system available, so there is nothing to enforce modularity. The
    first unwanted dependency that creeps into our system compromises architectural
    integrity. This is where a tool JarAnalyzer can be helpful. By incorporating JarAnalyzer
    into the build script, we''re able to easily manage the dependencies between modules.


    JarAnalyzer has two outputs. The first is a GraphViz dot file that can be easily
    converted to an image showing module relationships. The image shown in Figure
