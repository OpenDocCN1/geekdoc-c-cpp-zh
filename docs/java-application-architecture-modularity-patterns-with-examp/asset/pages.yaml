  md: '# CHAPTER 12 UTILITY PATTERNS


    A logical way to break up the script is to define a separate build script for
    each module. These module-specific build scripts can also build the test module
    and even run the tests. A simplified main build script can be set up to call each
    of the module build scripts. Additionally, you also have the ability to independently
    build each module, as well as include the module in other application build scripts.


    other tools for modular design, 106


    Another option worth considering is using a tool, such as JarAnalyzer, to enforce
    levelization of modules. JarAnalyzer offers you the ability to create cases that
    can verify module dependencies. Although you aren''t actually performing the build
    with JarAnalyzer, you still verify levelization of modules by defining test cases
    that verify the module relationships that span module boundaries. The basic idea
    is that within your test case, you specify the module dependency constraints,
    and if any relationships exist violate the constraints in the test case, the test
    will fail. If a new relationship is introduced between module boundaries that
    isn''t allowed, the test case, and ultimately the build, will fail. With this
    approach, you can actually perform a full classpath build and allow JarAnalyzer
    to enforce the levelization for you.


    > Note

    I favor a Levelize Build because managing module relationships by defining module
    dependency constraints can become tedious, especially early in the life cycle
    when the application structure is subject to refactorings that can significantly
    affect the structure.


    Levelize Build also allows you to break builds down into a set of smaller builds.
    Ultimately, if build performance is a concern, this separation will allow you
    to build modules at the same level in parallel with each other. When doing this,
    lower-level modules are built first, followed by upper-level modules.


