  md: '# LOGICAL VERSUS PHYSICAL DESIGN


    systems because they address a different problem. They help address problems related
    to logical design but do not help address the challenges of physical design.


    # LOGICAL VERSUS PHYSICAL DESIGN


    Almost all principles and patterns that aid in software design and architecture
    address logical design. Logical design pertains to language constructs such as
    classes, operators, methods, and packages. Identifying the methods of a class,
    relationships between classes, and a system package structure are all logical
    design issues.


    It''s no surprise that most principles and patterns emphasize logical design,
    the majority of developers spend their time dealing with logical design issues.
    When designing classes and their methods, you are defining the system''s logical
    design. Deciding whether a class should be a Singleton is a logical design issue.
    So is determining whether an operation should be abstract or whether you should
    inherit from a class versus contain it. Developers live in the code and are constantly
    dealing with logical design issues.


    Making good use of object-oriented design principles and patterns is important.
    Accommodating the complex behaviors required by most business applications is
    a challenging task, and failing to create a flexible class structure can have
    a negative impact on future growth and flexibility. But logical design is not
    the focus of this book. Numerous other books and articles provide the guiding
    wisdom necessary to create good logical designs. Logical design is just one piece
    of the software design and architecture challenge. The other piece of the challenge
    is physical design. If you don''t consider the physical design of your system,
    then your logical design, no matter how beautiful, may provide you with the benefits
    you believe it does. In other words, logical design without physical design may
    not really matter all that much.


    Physical design represents the physical entities of your software system. Determining
    how a software system is packed into deployment units is a physical design issue.
    Determining which classes belong in


