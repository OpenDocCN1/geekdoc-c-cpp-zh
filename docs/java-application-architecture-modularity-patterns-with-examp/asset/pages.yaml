  md: '# OSGI AND SCALA


    Suppose that we want to refactor our modules to implement the loan calculation
    so that it can execute in a highly concurrent environment. Scala is a functional
    language that excels in helping you create programs that run in a high concurrent
    environment. Let''s see how to do this.


    The goal at this point is to replace the Java implementation of calc-impl.jar
    with a Scala implementation.


    # 15.1 GETTING MODULES


    Just as refactoring our modules to OSGI didn''t require any coding changes, replacing
    calc-impl.jar will not require modifying our existing system. We did a good job
    creating Cohesive Modules with a Default Implementation. Independent Deployment
    was also a strength of our design. So, now that we want to create the Scala''
    module, we only need to write the Scala code to perform the loan calculation,
    define our bean configurations, and then define the µService. Because Scala is
    highly interoperable with Java code, it''s fairly easy to ensure that everything
    plays together nicely.


    +   1. Scala is a functional programming language for the Java platform. For more
    information on Scala, see www.scala-lang.org.'
