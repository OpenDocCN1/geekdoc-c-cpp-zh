  md: 'isn''t realistic for all modules. Modules with both incoming and outgoing dependencies
    demand the most flexibility. The dependency patterns will help you manage this
    flexibility.


    A module with a large number of incoming dependencies should be stable, implying
    that it is less likely to change. Modules with a lot of incoming dependencies
    are reused, and changing them requires more ceremony. They must be tested thoroughly
    and pushed out to all applications that use them. Changing modules with many incoming
    dependencies is primarily a maintenance and deployment issue. The best way to
    ensure a module''s stability is by making it an Abstract Module.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_147_0.png)


    Modules with a lot of outgoing dependencies can be changed easily but not tested
    easily. It''s difficult to independently verify modules with many outgoing dependencies,
    since they cannot be tested in isolation. Your goal should be to minimize outgoing
    dependencies, and where outgoing dependencies are necessary, the outgoing dependency
    should be on Abstract Modules. By minimizing a module''s dependencies, you increase
    the testability of the module since you can mock out the dependent abstractions.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_147_1.png)


    Use any time you import a new class where a module''s relationship doesn''t already
    exist between the modules because the coupling of the modules increases. A new
    module dependency is an important design decision and should be part of your conscientious
    thought when designing modules. Do you really want to create the new dependency,
    or is the decoupling of modules important enough to warrant additional design
    flexibility? This additional flexibility can often be achieved by using interfaces
    to enable classes to communicate with other classes in nondependent modules. In
    fact, this is one example of how patterns emerge within your system, and Separate
    Abstractions shows how interfaces can be used to avoid module coupling.


