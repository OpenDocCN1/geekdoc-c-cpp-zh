  md: '# TEST MODULE


    # STATEMENT


    Each module should have a corresponding test module.


    # DESCRIPTION


    Unit testing is one of the most important activities you should perform as a developer.
    A Test Module is a way to organize your unit tests into a module that corresponds
    to the module containing the classes under test. Figure 12.6 illustrates a Test
    Module. The client.jar module is responsible for testing the behavior of the client.jar
    module.


    # IMPLEMENTATION VARIATIONS


    It is tempting for a Test Module to define dependencies on other modules that
    contain implementations for classes within the module under test. Resisting this
    temptation is important. Defining additional dependencies on other modules within
    a Test Module will save you a bit of time in creating the test cases, but it will
    also compromise the integrity of your test. By using classes in other modules
    as your stubs, you cannot be certain that a failing test case is the result of
    a flaw in the module under test or a bug in the classes you are using as your
    stubs.


