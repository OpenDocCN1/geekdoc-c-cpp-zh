  md: '# UTILITY PATTERNS


    The utility patterns aid modular development. Unlike the other patterns, they
    don''t emphasize reuse, extensibility, or usability. Instead, the utility patterns
    support the other patterns and discuss ways that modularity can be enforced and
    help address quality-related issues. The utility patterns include the following:


    +   - **Colocate Exceptions**: Exceptions should be close to the class or interface
    that throws them.

    - **Levelize Build**: Execute the build in accordance with module levelization.

    - **Test Module**: Each module should have a corresponding test module.'
