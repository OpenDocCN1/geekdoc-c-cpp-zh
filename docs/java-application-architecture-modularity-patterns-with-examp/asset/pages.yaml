  md: '# 14.4 INSTALLATION AND EXECUTION


    It is now time to run the system. To do this, we need to start our OSGi container
    and install the application bundles. We use the Equinox framework for this example.
    If you''re following along, navigate to the Colocate-Exceptions project and then
    the OSGI subdirectory. navigate to the Equinox directory and issue this command:


    ```

    java -jar org.eclipse.osgi_3.6.0.v20100517.jar -console

    ```


    At this point, you see yourself within the OSGi console. The Spring DM/Blueprint
    bundles are installed for us at start-up. To see how this is done, be sure to
    check out the config.ini file in the configuration directory. Now, it''s time
    to install your bundles. To do so, issue the commands shown in Listing 14.12.


    # Listing 14.12 Install the Bundles


    ```

    install file:.../bin/loggerconfig.jar

    install file:.../bin/loan-intfrc-1.0.jar

    install file:.../bin/loan-impl-1.0.jar

    install file:.../bin/calc-impl-1.0.jar

    install file:.../bin/loanfacade-1.0.jar

    install file:.../bin/dclient-1.0.jar

    ```


    Now, start each bundle by using the bundle-id command (start the dclient-1.0.jar
    bundle last):


    Start <bundle-id>


    To get the bundle-id, use the following command:


    ```

    ss

    ```


    Note that upon starting the final bundle, dclient-1.0.jar, it printed out at the
    OSGi console the loan amount. In this sample, we don''t prompt the user for input
    to determine whether they''d like to know the payment or see the full payment
    schedule. We''ll leave that as an exercise for you. To do this, you can create
    your own client bundle and install it and start it. You''ll be able to use all
    the existing bundles as they currently stand.'
