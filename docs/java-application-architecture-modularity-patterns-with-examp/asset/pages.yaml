    # 3.3.2 ELIMINATING ARCHITECTURE


    As the Johnson quote clearly points out, it''s not feasible to design an infinitely
    flexible system. Therefore, it is imperative that we recognize flexibility is
    necessary to reduce the impact and cost of change. The challenge is that we don''t
