  md: '# MODULE REUSE


    # MODULE REUSE


    # STATEMENT


    Emphasize reusability at the module level.


    # DESCRIPTION


    One of the oft-cited benefits of object-oriented development is reuse. reuse,
    61 Mostly, we failed miserably in achieving any degree of reuse that is directly
    attributable to objects. The heart of the problem is identifiable.


    The object paradigm introduced many new ideas to the development object orientation,
    23 community, but none was so revolutionary as polymorphism and inheritance. Giving
    developers these two powerful language constructs created a new way of thinking
    about, and designing, software applications. Given that the advantage of object-oriented
    development was a natural tendency to higher degrees of reuse, there was these
    two new constructs that would enable, and virtually guarantee, reuse. However,
    these two powerful constructs have little to do with facilitating reuse directly.


    In the last few years, we''ve actually found that implementation inheritance often
    hinders reuse more than facilitating reuse by locking a developer into a rigid
    design with little ability to meet the changing needs of most complex software
    systems. In fact, structured programming techniques, which have been around for
    more than 30 years, can be used to achieve reasonable degrees of reuse. I''ve
    witnessed many situations where legacy COBOL code that was well-written could
    easily be reused.


    We need to break away from the thinking that objects help us create reuse versus
    more reusable software. Instead, objects help create more extensible software.
    Using inheritance and polymorphism allow us to create designs that are more flexible.
    It''s this flexibility, and the ability to plug different implementations into
    a class referencing an abstraction, that allows us to create generic software
    that can be figured to meet our needs. The ability to slightly modify the behavior
    of a chunk of code typically results in more reusable code. As a guideline, the
    less something does, the more reusable it will be. The trick, of course, is to
    make something general and configurable enough so that it''s reusable in a variety
    of contexts, also making it enough so that it''s useful. Given that extensibility
    and configurability are indirect enablers of reuse, it''s much more common to
    reuse a set of collaborating classes over an individual class.


    125'
