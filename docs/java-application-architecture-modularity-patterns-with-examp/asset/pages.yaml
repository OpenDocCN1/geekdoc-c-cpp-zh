  md: '# ARCHITECTURE AND MODULARITY


    Modularity plays an important role in software architecture. It fills a gap that
    has existed since we began developing enterprise software systems in Java. This
    chapter discusses that gap and explores how modularity is an important intermediary
    technology that fills that gap.


    # 3.1 DEFINING ARCHITECTURE


    There are numerous definitions of architecture. But within each lies a common
    theme and some key phrases. Here are a few of the definitions. From Booch, Rumbaugh,
    and Jacobson (1999):


    > An architecture is the set of significant decisions about the organization of
    a software system, the selection of the structural elements and their interfaces
    by which the system is composed, together with their behavior as specified in
    the collaborations among those elements, the composition of these structural elements
    and behavioral elements into progressively larger subsystems, and the architecture
    style that guides this organization — these elements and their interfaces, their
    collaborations, and composition.


    Now, from the ANSI/IEEE Std 1471-2000 (the Open Group):


    The fundamental organization of a system, embodied in its components, their relationships
    to each other and the environment, and the principles governing its design and
    evolution.'
