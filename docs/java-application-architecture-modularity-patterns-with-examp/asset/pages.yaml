- img_proc: true
  md: '# 13.7 OSGI AND THE PATTERNS


    # 13.7.2 DYNAMISM


    OSGi allows you to hot deploy modules without restarting the system. This brings
    great dynamism to the environment. Here are just a few ways this dynamism can
    help when using the patterns.


    # 13.7.2.1 The Module Reuse Pattern


    If we emphasize reusability at the module level, the dynamism of OSGi allows us
    to easily deploy the reusable modules to an existing system.


    # 13.7.2.2 The Abstract Modules Pattern


    By depending upon the abstract elements of a module, we can define new implementations
    of the abstraction in new modules and deploy those new modules to a running system
    without disruption.


    # 13.7.2.3 The Separate Abstraction Pattern


    An extension of Abstract Modules, if we separate our abstractions from the modules
    containing the implementation, not only can we deploy new implementations, but
    we can also undeploy existing modules containing implementations that are no longer
    used.


    # 13.7.2.4 The Independent Deployment Pattern


    If we have independently deployable modules, we can easily deploy them to a running
    system without disruption.


    # 13.7.3 BLUEPRINT SPECIFICATION


    OSGi Blueprint allows us to use OSGi without worrying about the OSGi programming
    model. In other words, the Blueprint allows us to keep our code independent of
    the OSGi API. Here are just a few ways the OSGi Blueprint Specification can help
    when using the patterns.


    # 13.7.3.1 The Container Independence Pattern


    This is what the Blueprint Specification is all about: remaining independent of
    the OSGi API.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# ### 13.7.3.2 The External Configuration Pattern


    The Blueprint specification allows us to define a module''s OSGi services without
    coupling the module itself, or the class acting as a service, to the OSGi API.
    Blueprint Blueprint Services allow us to define the module configuration.


    # ### 13.7.3.3 The Implementation Factory Pattern


    OSGi Blueprint or Declarative Services serves as a factory for OSGi µServices
    and allows us to wire these services together at runtime. The result is a model
    that is familiar to experienced developers who already use the Spring framework.'
