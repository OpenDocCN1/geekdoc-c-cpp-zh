  md: '# # FOREWORD BY PETER KRIENS


    About two years ago (January 2010) I got an e-mail from Kirk Knoerns-child, soliciting
    feedback for his almost-ready book. Looking back at the heated discussion that
    ensued—50 or more lengthy mails—I cannot but wonder that some resentment have
    formed on his side. I am pretty sure that our conversations caused heavy delays
    in his initial schedule. I was therefore pleasantly surprised when Kirk asked
    me to write a foreword for this book; it takes a strong man to let an opponent
    write a foreword for the book he put so much effort into.


    Now, I do agree with most of what Kirk says in this book. We are both intrigued
    by the magic of modularity, and we see eye to eye on most of the fundamental concepts.
    However, as is so often the case, the most heated debates are between people who
    agree on the principles but differ on the details. It was not until the OSGi Community
    Event in Darmstadt, Germany (two days before the deadline of this foreword), that
    I suddenly understood Kirk''s resistance.


    At this event Graham Charters (IBM) presented the “Modularity Maturity Model,”
    which he derived from IBM''s SOA Maturity Model, which of course came from the
    original SEI Capability Maturity Model (CMM). This was an insightful presentation
    that made me understand that my perspective of system design is very much tainted
    by more than 13 years of living modularity.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'One of the key lessons of the CMM was that it was impossible to skip a step.
    If your company is on level 1 of CMM (chaotic), then it is not a good idea to
    make plans to move to level 4 (managed) in one giant step. Companies have tried
    and failed spectacularly. Transitions through each of the intermediate stages
    are required to help organizations understand the intricacies of the different
    levels. Every level has its own set of problems that are solved by the next level.


    After Graham''s presentation, it became clear to me that I basically look down
    from level 5, and Kirk is trying to make people look up from level 1. The particular
    issues that we were disagreeing on are about the challenges you will encounter
    when designing modular software. These challenges seem perfectly sensible after
    you''ve reached level 2 or 3 but tend not to make a lot of sense on level 1. Our
    brains are wired in such a way that we can understand a solution only once we
    experience the corresponding problem. I was trying to beat Kirk into discussing
    those solutions before his readers had experienced and understood the problems
    of the prior levels.


    In my Modularity Maturity Model (Graham''s was a bit different), I see the following:


    +   1. Unmanaged/chaos

    2. Managing dependencies

    3. Proper isolation

    4. Modifying the code base to minimize coupling

    5. Service-oriented architectures


    In the first level, applications are based on the class path, a linear list of
    JARS. Applications consist of a set of JARS or directories with classes that form
    the classpath. In this level there is no modularity whatsoever. Problems on this
    level are missing classes or mixing versions.


    The second level is when you get module identity and specify dependencies on other
    modules. Modules get a name and can be versioned. They are still linearly searched,
    and many of the problems from level 1 exist, but the system is more maintainable
    and the results more repeatable. Problems on this level mainly circulate around
    “downloading the Internet” because of excessive transitive dependencies. This
    is the level currently at.


