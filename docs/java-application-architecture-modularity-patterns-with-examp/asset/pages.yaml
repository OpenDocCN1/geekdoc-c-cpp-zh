  md: '# DEPENDENCY PATTERNS


    The dependency patterns help manage the relationships between modules, something
    that few development teams seriously consider. In fact, I''ve found it personally
    fascinating that development teams spend so much time designing class relationships
    but yet spend so little time creating a supporting physical structure. Here, you''ll
    find some guidance that will help you create a module structure that emphasizes
    low coupling between modules. You''ll also find some discussion exploring how
    module design impacts deployment. The dependency patterns include the following:


    +   - Acyclic Relationships: Module relationships must be acyclic.

    - Levelize Modules: Module relationships should be leveled.

    - Physical Layers: Module relationships should not violate the conceptual layers.

    - Container Independence: Modules should be independent of the runtime container.

    - Independent Deployment: Modules should be independently deployable units.'
