    # Demotion


    Another way to resolve a cyclic dependency is to use demotion. With demotion,
    we push the cause of the dependency to a lower-level module. Demotion is exactly
    the opposite of escalation. We do this by introducing a DiscountCalculator class
    that will be passed into the Bill class. The Customer class will serve as the
