  md: 'by the other module. The service.jar module should be as stable, or resistant
    to change, as possible.


    # IMPLEMENTATION VARIATIONS


    Depending on only the abstract elements of a module carries a price. Creating
    the implementing class can no longer be done by using the `new`-word to create
    an instance of the implementing class. Instead, you have to consider some of the
    following options:


    +   * **Object factory**: To avoid dependencies on the concrete elements of a
    module, an object factory can be used to create the appropriate instances. This
    offers a few advantages. First, the factory is the only area of the application
    referencing the concrete class. Adding new concrete classes that extend the abstraction
    is much easier. Second, if there are rules associated with creating the instances,
    these rules are well encapsulated within the factory. If the rules change, you''ll
    have a single maintenance point.


    +   **Dynamic creation**: In some situations, you will find that the `Class` class
    is more appropriate than an object factory. I found this approach to work best
    in a couple of cases. In a Web application, if I need to create certain classes
    at server start-up, I use the `Class` class and specify the concrete class to
    instantiate in a start-up properties file. This allows me to create new classes
    that can be plugged into my application when the server starts up by simply defining
    the new class and specifying its fully qualified name in the appropriate properties
    file. The second scenario is when I''m using an Abstract Factory (GoF). Specifying
    how the appropriate concrete factories get created is also useful to specify in
    a properties file. In other cases, I use the object factory approach. Many dependency
    injection frameworks, like Spring, rely on dynamic creation.


    +   **OSGI µServices**: If you''re using a framework such as OSGI, `µServices`
    provide the ability to dynamically instantiate the appropriate classes registered
    as `µServices` when an OSGI bundle is activated.


    Abstract classes or interfaces absorb most incoming dependencies, whereas outgoing
    dependencies should originate from concrete classes. Although simpler, you''ll
    want to avoid a heavily depended-upon module with a lot of concrete classes because
    a single change can have a significant ripple effect across all dependent modules.
    You''ll also want to'
