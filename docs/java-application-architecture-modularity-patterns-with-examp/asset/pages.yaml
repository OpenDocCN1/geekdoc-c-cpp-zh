  md: '# # TAMING THE BEAST NAMED COMPLEXITY


    Modularity is not a new concept. In his 1972 paper "On the Criteria to Be Used
    in Decomposing Systems into Modules," David Parnas cited the work of Gouthier
    and Pont as the first lucid statement of modular programming (1972):


    A well-defined segmentation of the project effort ensures system modularity. Each
    task forms a separate, distinct program module. At implementation time each module
    and its inputs and outputs are well-defined, there is no confusion in the intended
    interface with other system modules. At checkout time the integrity of the module
    is tested independently; there are few scheduling problems in synchronizing the
    completion of several tasks before checkout can begin. Finally, the system is
    maintained in modular fashion; system errors and deficiencies can be traced to
    specific system modules, limiting the scope of detailed error searching.


    Parnas went on discuss the important decisions developers must make when modularizing
    their software systems. Encapsulating design decisions within autonomous modules
    allowed for modules to evolve independently and reveal little about their inner
    workings. The designs were encapsulated, shielding other developers from this
    unnecessary complexity, and helping them to more easily understand the software
    system.


    Although much has changed since the Parnas paper was first published, one constant
    remains: Software is still incredibly difficult to design and develop. Unfortunately,
    in the decades since modular programming'
