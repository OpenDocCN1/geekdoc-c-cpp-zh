  md: '# I.1.3 TESTABLE


    A module is a unit of testability. Like a class can be independently tested using
    test-driven development, a module can also be independently tested. Examples of
    software entities that comply with this segment of the definition include classes,
    packages, and JAR files.


    # I.1.4 NATIVELY REUSABLE


    Modules are a unit of intraprocess reuse. Unlike applications or services, modules
    are not a distributed computing technology, although serviceoriented architecture
    (SOA) principles can be used to design software modules. Instead, modularity is
    a way to organize units of deployment in a way that they can be reused across
    applications, but a module is always invoked natively. That is, the operations
    exposed by a module are invoked by calling the method directly.


    The way we reuse modules is also different from how we reuse services. Typically,
    a service is deployed only a single time and invoked by multiple consumers. Because
    modules are used intraprocess, a module is deployed with each process that intends
    to reuse its functionality. Examples of software entities that comply with this
    segment of the definition include classes, packages, and JAR files.


    # I.1.5 COMPOSABLE


    Modules are a unit of composition. Modules can be composed of other modules. Typically,
    this involves coarse-grained modules being a composition of finer-grained modules.


    # I.1.6 STATELESS


    Modules are stateless. There exists only a single instance of a specific version
    of a module. We don''t instantiate software modules, although we do instantiate
    instances of the classes within software modules, and these classes may maintain
    state. However, the module itself does not. Examples of software entities that
    adhere to this segment of the definition include JAR files.'
  merge: -1
