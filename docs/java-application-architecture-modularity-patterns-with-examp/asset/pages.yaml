    “In writing this book, Kirk has done the software community a great service: He’s
    captured much of the received wisdom about modularity in a form that can be understood
    by newcomers, taught in computer science courses, and I hope this book finds the
    wide audience deserves.”


    —Glyn Normington, Eclipse Virgo Project Lead


