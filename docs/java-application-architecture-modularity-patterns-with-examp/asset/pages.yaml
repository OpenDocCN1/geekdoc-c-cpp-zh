  md: '# 17.2 A BIT OF (RECENT) PLATFORM HISTORY


    To start, let''s take a brief walk down memory lane—not too far back but far enough
    that we can see how important the ecosystem is in today''s most successful platforms.
    And these platforms span a range of markets, from mobile to social media. But,
    each is successful in large part because of a thriving ecosystem.


    # 17.2.1.1 Apple


    In 2007, Apple released its first-generation iPhone. Without the device revolutionized
    the mobile phone industry. Although the device offers a great user experience
    that has certainly played a role in its surging popularity, people flock to the
    iPhone today because of the wealth of applications available. Yeah, "there''s
    an app for that."


    Apple, recognizing the power of this ecosystem, now delivers the iPad. With fewer
    preinstalled apps than the iPhone, Apple is counting on the ecosystem to drive
    adoption. The more consumers who flock to the device, the more developers flock
    to the platform to deliver applications. As more applications become available,
    consumers will buy more iPads. The ecosystem fuels itself. Apple has provided
    the environment for the ecosystem to thrive.


    # 17.2.1.2 Eclipse


    In 2003, the Eclipse team was thinking of ways to make Eclipse more dynamic. Its
    decision to use OSGi to create a rich client platform that supports plug-in architecture
    was the first step toward the resulting ecosystem we know today. One of the reasons
    developers use Eclipse is because there are an abundance of plug-ins that allow
    them to do their jobs more effectively. Other developers create Eclipse plug-ins
    because Eclipse is a popular IDE used by many developers. Again, the ecosystem
    fuels itself. The Eclipse team provided the environment that allows today''s ecosystem
    to thrive.


    If you''re interested, you can read more about the history of Eclipse and OSGi
    at this website: www.eclipse.org/equinox/documents/transition.html.


    # 17.2.1.3 Hudson


    Arguably, Hudson is today''s most popular continuous integration server. But it
    hasn''t always been. Before Hudson was CruiseControl. And'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# CHAPTER 17 FUTURE OF OSGI


    although CruiseControl did help development teams get started on their path toward
    continuous integration, it was also unwieldy to use in many ways. With Hudson''s
    plug-in architecture, developers have the ability to extend the tool in ways the
    original creator couldn''t imagine or find the time to do it himself. Kohshuke
    created Hudson and gave the development community a new platform for continuous
    integration. With its plug-in architecture, though, he also provided an environment
    that allows the ecosystem to thrive.


    # 17.2.1.4 Social Media


    Facebook. MySpace. Twitter. These are examples of social media tools with a strong
    developer community that creates extensions to the platform that users can leverage
    to enhance the experience. Facebook developers. MySpace developer platform. Twitter
    API. Each allows the ecosystem to thrive.


    # 17.2.1.5 And Others


    It''s easy to find other platforms with similar ecosystems. The ease with which
    WordPress themes and plug-ins can be developed and used to enhance a WordPress
    website is another example. In fact, many content management systems provide similar
    capabilities. A large reason why the Firefox and Chrome Web browsers are the preferred
    Web browsers is the ease with which add-ons and plug-ins can be installed that
    extend the capabilities of the browsers. The Atlassian Plugin Framework is another
    example that uses OSGi, and platforms such as Force.com and SharePoint have built
    (or are trying to build) similar ecosystems.


    # 17.3 THE POWER OF ECOSYSTEMS


    Aside from Eclipse (and Atlassian), none of these other platforms leverage OSGi.
    Yet, each is wildly successful because of two reasons:


    +   - An environment was created that allowed an ecosystem to flourish. This environment
    includes a platform and a marketplace.


    +   - A group of customers and developers converged on the marketplace and fueled
    growth of the platform. The result is a self-sustaining ecosystem.'
