    Note

    If you''re wondering about all these metrics, look at the Martin Metrics. In general,
    without a utility like JarAnalyzer (or a module framework like OSGi), it would
    have incredibly difficult to manage the modules composing this system.


    # 7.11.3 A NOTE ON MODULE REUSE


    The Reuse Equivalency Principles states that the unit of reuse is the unit of
    release (Martin 2000). Modules are a unit of release and therefore are a unit
    of reuse. Naturally, the devil is in the details, and we''re going to discuss
    a few of these details here.


    Chapter 5 described the tension between reuse and use. That is evident at play
    here. Earlier versions of the system had coarser-grained modules that were easier
    to use but more difficult to reuse. As we progressed, we broke these coarser-grained
    modules into finer-grained modules, increasing their reusability by decreasing
    their ease of use. A perfect example of this is the bill.jar module. In the final
    version, it was reusable, because it was dependent only on the auditspec.jar module.
    However, this came at the price of usability.


    Let''s elaborate. In the sixth refactoring in Section 7.9, we decoupled the bill.jar
    and financial.jar modules so the two could be deployed independently (that is,
    increase reuse). But the runtime structure has some dependencies. To reuse bill.jar,
    we need a BillPayer type. While an alternative BillPayer implementation could
    be created, the existing implementation is the BillPayerAdapter in the mediator
    .jar module, which also has a relationship to the financial.jar module.'
