  md: '# CHAPTER 10 USABILITY PATTERNS


    # CONSEQUENCES


    The greatest advantage of defining a module''s Published Interface is that you''re
    making the module easier to use by other developers. Even though a module may
    be well-designed and offer valuable behavior, a cluttered API will undoubtedly
    scare developers away. Unquestionably, a thinner and lighter module interface
    will allow developers to more quickly understand how to integrate the module.
    Keep in mind that with standard Java, there is no way to hide public methods within
    a module unless the class containing those public methods is defined at package
    scope, which is not always reasonable. Quite simply, Java has no language construct
    to accommodate this. However, efforts to define a module''s Published Interface
    are undoubtedly still valuable.


    reuse versus use, 62


    Each of the previous implementation variations has a different set of consequences.
    While defining package scopes strictly enforces internal usage of the class, package
    scope may be too limiting. If classes in other packages within the module need
    to use the class, package scope will not work.


    External Configuration pattern, 200


    Exposing only interfaces, on the other hand, will allow you to expose the methods
    you want. However, you can never prevent another developer from using the implementation
    class directly, since the implementation class is public. Using interfaces has
    another limitation, to it. For classes within the module to invoke methods on
    the implementation, it requires that the module''s internal classes work with
    a concrete type, preventing the module from working with alternative implementations
    of the interface, which can make External Configuration difficult.


    Ultimately, you''re giving up internal flexibility for external module usability.
    The consequences of this decision must be given careful consideration. Additionally,
    if the implementation class within the module is in a separate package from the
    classes that need to use it, the implementation class must be declared public,
    and you can never really prevent other developers from using it directly, assuming
    they learn of the implementation class. However, the implementation class is still
    pretty well insulated, and it''s likely you can prevent most honest developers
    from referencing it directly.


    Expecting to enforce your Published Interface via JavaDoc is difficult at best.
    While undoubtedly the easiest approach, there is no way to ensure developers follow
    this recommendation. Use caution when adopting an approach relying solely on any
