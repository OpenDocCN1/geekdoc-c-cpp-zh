  md: '# CONTAINER INDEPENDENCE


    # STATEMENT


    Modules should be independent of the runtime container.


    # DESCRIPTION


    Modules with excessive runtime container dependencies are heavy-weight modules
    that cannot execute outside the confines of the runtime container. A good example
    of a heavyweight technology is Enterprise JavaBeans (EJB), and the meteoric rise
    in popularity of lighter-weight frameworks, as Spring, are the direct result of
    the shortcomings of heavyweight technologies. While lightweight modules are not
    container dependent, they are still able to leverage the infrastructure capabilities
    (e.g., security, transactions) of the container. Lightweight modules with no container
    dependencies have two significant advantages.


    +   * They are portable across runtime environments: For instance, a lightweight
    module can be deployed in a Java EE environment, but it can also run directly
    the IVM. Or, a module might be designed to work in a runtime supporting OSGi,
    but it can also function if an OSGi framework isn''t available.

    * They are testable: Because they lack environmental dependencies, they can be
    tested in isolation, outside the confines of the environment to which they''ll
    ultimately be deployed.


    Additionally, it''s easy to argue that lighter-weight modules are also easier
    to maintain, since their contents are not polluted with excessive dependencies
    on infrastructure capabilities. Developing lightweight modules demands that container
    dependencies be abstracted away. Figure 9.11 illustrates how the client.jar module
    is made independent of the runtime.jar module through the use of the abstraction.jar-module,
    which encapsulates the container dependencies and coordinates the interaction
    of client.jar module in the runtime environment. As a result, the Client class
    will have no dependencies on the runtime.jar or the abstraction.jar modules''
    APIs.'
