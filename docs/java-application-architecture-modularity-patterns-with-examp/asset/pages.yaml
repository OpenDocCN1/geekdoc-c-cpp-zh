    Defining the manifests for the remaining modules are each

    done in the same fashion, so we''ll skip this trivial exercise and move on. If

    you''re interested, you can refer the remaining manifests by reviewing

    the sample code on GitHub.


    # 14.3 SERVICES


    Defining the bundle manifests is only the first step in setting up our mod-

    ules to run in an environment that supports OSGI. Defining our OSGI

    uServices is the next step. Services bring dynamism to the environment.

    It''s possible to wire together instances using dependency injection the

    same we do in Java without OSGI. However, the benefit of services is

    the dynamism they bring to the environment and the resulting encapsa-

    tion implementation details. We''ll see an example of this later.


    # 14.3.1 BLUEPRINT SERVICES


    We can expose our bundle’s API as services in two ways. First, we can

    implement interfaces from the OSGi API, providing an implementation

    that will register the service and make it available within the container.'
