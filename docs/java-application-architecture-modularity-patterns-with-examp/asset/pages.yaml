- img_proc: true
  md: '# 17.3 THE POWER OF ECOSYSTEMS


    If you look at many of the more popular platforms that have emerged over the past
    decade, they tend to possess a similar characteristic—a community of individuals
    dedicated to providing great solutions leveraging the foundation of the platform.
    OSGi and modularity enable ecosystems on the Java platform.


    # 17.3.1 ECOSYSTEMS AND THE TWO FACETS OF MODULARITY


    Chapter 2 talked about the two facets of OSGi: the runtime model and the development
    model. I also explained how one could possibly see widespread adoption while the
    other has little impact. A strong ecosystem surrounding OSGi and modularity must
    leverage both. Developers would we create reusable modules, implying they are
    designing modular software. For development teams to leverage these modules, they
    must be using a platform that supports the runtime model.


    # 17.3.2 CBD HAS ALREADY HAD ITS DAY, YOU SAY?


    Now some of you might argue that this sounds a lot like the component-based development
    (CBD) fad of the 1990s. True... to an extent. Certainly, these ideas are not new.
    But, there are also striking differences between which OSGi enables and the CBD
    fad that has come and largely gone, or whose promise was never fully realized.


    Foremost, the CBD fad focused almost exclusively on visual components, such as
    ActiveX. Although some attempted to create components for the Java platform, the
    movement largely failed to go mainstream. Instead, Java EE grew in popularity
    and, for a number of years, garnered everyone''s attention. Why did this happen?


    In my opinion, the answer is fairly simple. Even though numerous marketplaces
    emerged that allowed the consumer and producer to come together to buy and sell
    components, there was never a suitable component execution environment, that is,
    an environment that would support dynamic deployment, support for multiple versions,
    dependency management, and, in general, complete control over all components currently
    executing within the environment. ActiveX components did have an execution environment
    (though did not support each of these capabilities), but Java did not. Today,
    in OSGi, Java has the requisite execution environment!


    315'
