- img_proc: true
  md: 'You''re certainly free to jump ahead right now. But if you want to learn a
    bit more about the patterns in connection with OSGi, then read on.


    As illustrated throughout this book, many of the patterns can be applied using
    all of the tools at your disposal today. You don''t need a runtime module system
    to develop modular software applications. But a runtime module system, such as
    OSGi, certainly can help. To explore how OSGi can help, let''s look at some of
    the features of OSGi and how they aid in the use of the patterns.


    Not all the modularity patterns are discussed in this section, because the topic
    of patterns and OSGi can fill its own book! Regardless, after reading the following
    sections, you''ll have a better understanding of how the patterns can be used
    with OSGi.


    # 13.7.1 MANAGING DEPENDENCIES


    In OSGi, you are required to export packages that you want to make visible outside
    of a bundle. These package exports are declared in the bundle manifest. Likewise,
    when a bundle wants to use some other bundle, you are required to import any packages
    that you''ll be dependent upon. Again, this import package information belongs
    in the bundle manifest. Here are just a few of the ways package exports and imports
    can help when using the patterns.


    # 13.7.1.1 The Manage Relationships Pattern


    When you deploy the bundle, the OSGi framework enforces type visibility of a module''s
    classes using the manifest and its exported packages. Exporting and importing
    packages offers a way for you to Manage Relationships because the OSGi framework
    won''t allow you to use a bundle if you haven''t imported any of its packages.


    # 13.7.1.2 The Published Interface Pattern


    Relying solely on Java, it is not possible to hide types within a module. With
    OSGi, you can hide a type within a module simply by not exporting the package
    containing the type.


    # 13.7.1.3 The Physical Layers Pattern


    Because we must import all the packages that a bundle uses, we can verify via
    the manifest that we haven''t imported any presentation classes.'
