  md: 'with implementations that implement or extend an abstraction defined by the
    module. Another way is to externalize the wiring using External Configuration.


    Acyclic Relationships introduces escalation, demotion, and callback, which are
    three different ways to break cyclic relationships among modules. Escalation and
    callback can also be used to break a dependency altogether. Since demotion pushes
    the dependency to a lower-level module, it cannot be used to break a dependency,
    though it can be used to reduce the weight of a module.


    A driving force behind the need to make a module independently deployable is how
    frequently a module is reused. Modules not intended for reuse don''t need their
    dependencies managed as carefully. It''s important to balance techniques that
    manage dependencies with techniques to maintain simplicity. Favoring simplicity
    initially will make a module easier to use, while a more flexible design will
    increase reuse.


    This isn''t to say that dependency management is less important for these modules.
    But if you''re not planning to reuse the module, the driving force behind management
    becomes maintainability. And when you want higher degrees of maintainability,
    your best option is to usually focus on testability.


    The problem we''ll quickly encounter with developing reusable modules is that
    it''s very difficult to create a reusable module until it has been used a number
    of times in a variety of different contexts. Do you attempt to develop a module
    so that it''s reusable right away, or do you design the module only for its initial
    use and then refactor that module as additional reuse is necessary? The challenge
    in designing a reusable module initially is that you are forced to predict how
    others are going to use that module. You''ll find that either paralyzing your
    development by attempting to fight through problems to which you cannot yet know
    the answer or, worse yet, you''re solving the wrong problems altogether.


    Instead of attempting to predict reuse, develop the module for its specific initial
    need, and as other uses are identified and known, modify the module to accommodate
    these needs by applying various patterns. While not perfect, you''ll find it easier
    to take something simple that and make it work better than it is to take something
    that is insanely complex and difficult to understand and try to reuse it. It''s
    likely you''re going to find that you have to modify the module anyway, resulting
