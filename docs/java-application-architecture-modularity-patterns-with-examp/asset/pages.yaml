  md: '# THE CASE FOR MODULARITY


    There is no shortage of books on software design. Numerous books are available
    that will teach you fundamental and advanced concepts of object-oriented design.
    You can find a similar number that will teach you basic and advanced concepts
    of service-oriented architecture. However, there is a missing ingredient: modularity.
    Rarely do you see thoughtful discussions that tie together architecture at the
    highest levels of the system with the code that lives in the bowels of the system.


    In this first part of the book, we begin by establishing a common understanding
    of the term module. We quickly move on to discuss the different facets of modularity—the
    runtime model and the development model. From there, we examine how modularity
    helps us “architect the way down” by allowing us to tie together important high-level
    architectural constructs with more detailed implementations. We also explore the
    role of modularity in helping us tame the beast we call complexity and achieve
    the panacea we can reuse. Finally, before we move on to the modularity patterns,
    we walk through a sample exercise that illustrates the benefits of modularity.
    Throughout, we make a strong case for modularity.'
