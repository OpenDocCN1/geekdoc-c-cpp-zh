    The next module we focus on is the loan-impl.jar module. Recall

    that the classes in the loan-impl module implement the interfaces

    in the loan-intrfc.jar bundle, and we''ll explicitly state this depen-\gency in
    the bundle manifest for loan-impl.jar. Referencing Figure

    14.1, we clearly see that the loan-impl.jar module has no incoming\dependencies.
    In other words, we do not need to export any packages. List-

