  md: '# CHAPTER II EXTENSIBILITY PATTERNS


    # ABSTRACT MODULES


    # STATEMENT


    Depend upon the abstract elements of a module.


    # DESCRIPTION


    When you design the dependencies between modules, depending on only the abstract
    elements increases flexibility. It gives you the ability to easily extend and
    maintain areas of your application by defining new modules with classes that implement
    or extend the abstraction. Most importantly, clients of the modules now have the
    freedom to receive different implementations because they are no longer coupled
    to an implementation but instead are coupled to an abstraction (such as an abstract
    class or interface).


    In Figure 11.1, you see the client.jar module is dependent on the service.jar
    module. Examining the contents of client1, notice that the dependency of the Client
    class is on the Service interface. This is supported by the associated code. Therefore,
    the client.jar module is dependent upon only the abstract elements in service.jar
    module. As much as possible using standard Java, this relationship is enforced
    and cannot be violated because the ServiceImpl class is given only package scope.


    The stability of a module is a metric used to help determine the likelihood that
    a module will experience change (Martin 2000). Stable modules resist change and
    are desirably the most heavily depended-upon modules in the system. In Figure
    11.1, you see the service.jar module used


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_251_0.png)


    Figure 11.1 Depending on the abstract elements of a module'
