  md: '# 2.2.2 THE DESIGN PARADIGM


    There are other challenges in developing modular software that extend beyond the
    runtime model and programming model. The design paradigm must also be addressed.
    How does an organization create a more modular architecture? What is the right
    granularity for a module? How heavily dependent modules should be on each other?
    How do we minimize module dependencies? How do we break apart larger modules into
    a smaller set of cohesive modules? How do we modularize an existing monolithic
    software system? When do we do this? These questions—and others—are the important
    architectural and design questions that surround modular in enterprise software
    development. The patterns in this book emphasize the design paradigm.


    To understand the importance of the design paradigm, we can learn important lessons
    by examining the history of a few other technologies. Let''s look at two different
    examples of technologies that prove the relevance of the module design paradigm:
    object-oriented (OO) programming and Enterprise JavaBeans (EJB).


    # 2.2.2.1 Object Orientation


    In the early 1990s, the object-oriented paradigm was touted as the savior. Development
    teams would be able to build systems by composing reusable objects. The object-oriented
    paradigm promised significantly reduced time-to-market and higher-quality software.
    The promises were not met, and the benefits of the object-oriented paradigm were
    never fully realized. There are few reasons why development teams failed to realize
    the benefits. Classes are too granular to serve as the foundation of reuse. Development
    teams also had difficulty grasping and applying object-oriented concepts correctly.
    Deep inheritance hierarchies laden with base classes rich in functionality contributed
    to poorly designed and brittle software systems. In general, object-oriented development
    was an early failure.


    The runtime capabilities of object-oriented programming languages provided features
    such as polymorphism and dynamic binding, and developers were able to easily understand
    many aspects of the programming model. Using dot notation to invoke methods and
    defining private member variables were trivial concepts. But it took long time
    for us to understand how to design good programs using object-oriented design
    techniques. In other words, we struggled with the design paradigm. What'
