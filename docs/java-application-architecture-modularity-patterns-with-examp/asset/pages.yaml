    Acyclic Relationships pattern, 146


    The Levelize Modules pattern sits squarely between Physical Layers and Acyclic
    Relationships. Levelize Modules demands that the module structure be acyclic.
    If it weren’t, the cycle would make it impossible to clearly identify the levels.
    And just discussed, levels tend to be more granular than layers.


    weight and granularity, 63


    Coarse-grained modules at lower levels of the system have a significant impact
    on the ability to easily reuse these modules. In general, lower-level modules
    should have fewer outgoing dependencies and more incoming dependencies. In other
    words, modules in lower-level layers should be lower-level modules, and these
    modules should be finer grained than higher-level modules. Likewise, modules in
    higher-level layers will likely be higher-level modules, though it’s perfectly
    acceptable for a level 1 module to exist in a higher-level layer. For instance,
    a UI Utility module may have no outgoing dependencies and therefore be a level
    1 module but exist in the UI layer because of its behavior.


