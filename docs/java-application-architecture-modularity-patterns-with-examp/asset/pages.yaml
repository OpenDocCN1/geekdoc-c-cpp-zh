- img_proc: true
  md: 'Module cohesion also plays an important role in designing high-quality software
    modules. A module with too little behavior doesn''t do enough to be useful to
    other modules using it and therefore provides minimal value. Contrarily, a module
    that does too much is difficult to reuse because it provides more behavior than
    other modules desire. When designing modules, identifying the right level of granularity
    is important. Modules that are too fine-grained provide minimal value and may
    also require other modules to be useful. Modules that are too coarse-grained are
    difficult to reuse.


    The principles in this book provide guidance on designing modular software. They
    examine ways to minimize dependencies between modules while maximizing a module''s
    reuse potential. Many of these principles would not be possible without the principles
    and patterns of object-oriented design. As you''ll discover, the physical design
    decisions you make to modularize the system will often dictate the logical design
    decisions.


    # UNIT OF MODULARITY: THE JAR FILE


    Physical design on the Java platform is done by carefully designing the module
    relationships and behavior of Java JAR files. On the Java platform, the unit of
    modularity is the JAR file. Although these principles can be applied to any other
    unit, such as packages, they shine when using them to design JAR files.


    # OSGI


    The OSGI Service Platform is the dynamic module system for Java. In OSGI parlance,
    a module is known as a bundle. OSGI provides a framework for managing bundles
    that are packaged as regular JAR files with an accompanying manifest. The manifest
    contains important metadata that describes the bundles and its dependencies to
    the OSGI framework.


    You''ll find examples leveraging OSGI throughout this book. However, OSGI is not
    a prerequisite for using the modularity patterns. OSGI simply provides a runtime
    environment that enables and enforces modularity on the Java platform. OSGI offers
    the following capabilities:


    +   **Modularity**: Enables and enforces a modular approach to architecture on
    the Java platform.


    +   **Versioning**: Supports multiple versions of the same software module deployed
    within the same Java Virtual Machine (JVM) instance.'
