  md: '# 7.4 FIRST REFACTORING


    Packaging everything into a single WAR file for deployment certainly isn''t modular.
    In most systems we develop, we try to design layers that encapsulate specific
    behaviors and isolate certain types of change. Typical layers include a UI layer,
    a business or domain object layer, and a data access layer. In this system, we
    have these three layers. The Struts and Form classes, along with the JSP, represent
    part of the UI layer. The UI layer is represented by the upper-portion classes
    in Figure 7.1. The Customer, Bill, Name, AuditFacade, and Payment layer form the
    business object layer, and the Loader classes form the data access layer. These
    classes are shown in the lower portion of Figure 7.1. Now, here''s a key statement
    that you need to take with:


    > If I truly have a layered system, then I should be able to break out each layer
    into a separate module where modules in the upper layers depend on modules in
    lower layers, but not vice versa.


    If you try for one of your systems, it''s likely you''ll find it''s not easy.
    Most development teams feel they have a layered architecture, but in reality,
    they don''t somewhere deep within the bowels of the system lies any import or
    reference to a class in a higher-level layer that we aren''t aware of.


    In fact, if I really do have a layered system, then I shouldn''t have to change
    anything other than my build script to break the layers into separate JAR files.
    If I do have to change more than a build script, then I didn''t have a layered
    system to begin with, and I should perform some architectural refactoring to clean
    things up. Anyway, the end result is simple to understand. No code changes. Only
    a build script change so that certain classes are allocated to specific modules.
    Figure 7.2 shows the structure. This refactoring was an example of applying the
    Physical Layers pattern.


    Listing 7.1 illustrates a portion of the initial build script where all of classes
    were bundled into the WAR file. Listing 7.2 shows the changes we''ve made to the
    build script to create modules for the various layers. Here, we show only the
    business object layer. We created a new build target where we create the module
    and then added a new line to the target where that module is now included in the
    WAR file.'
