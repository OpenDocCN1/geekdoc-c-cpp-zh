  md: '# CHAPTER 8 BASE PATTERNS


    Separate Abstractions pattern, 237


    There are two main impediments you''ll encounter when trying to reuse modules.
    First, the module doesn''t offer the right level of functionality that you need,
    and you cannot customize the modules to fit your context. This is typically a
    problem when the module is not addressed at the correct level of granularity.
    The module does more than what you need. When developing modules, it''s important
    to offer only the functionality you know is appropriate. If you question whether
    the module should do something extra, you should either avoid putting the behavior
    in the module or offer the ability to configure the module so that the behavior
    can be turned off. Second, you may find that a module has too many heavyweight
    dependencies on something else, thus preventing you from reusing it because you
    do not want those heavyweight dependencies. If you separate abstractions and provide
    external configuration, you''re likely able to remove some of the undesirable
    dependencies and allow the module to be more easily configured.


    External Configuration pattern, 200


    weight and granularity, 63


    flexibility of services and modules, 70


    Services differ from modules in that services typically span boundaries, whereas
    modules are invoked-in. For years, industry luminaries have predicted that services
    will revolutionize reuse. I''m not convinced that this is true. Services alone
    will not provide the revolutionary boost to software architecture that''s necessary.
    It will be as easy to create heavyweight and unusable services as it is to create
    heavyweight and unusable modules. Chapter 3 discussed the concept of architecture
    all the way down. Applications with a truly great architecture require a solid
    design from the class structure, to the module structure, and finally up to the
    service level. If you create a robust suite of modules that are loosely coupled
    and wired together at runtime, these modules can be used to compose your services.


    architecture all the way down, 30


    # Module Management


    Module management can be difficult. A large number of modules with multiple versions
    of each make it difficult for others to ensure they are using the correct version
    of a module. A repository in your version control software is a great place to
    store the binaries of your modules. An application''s build process can be configured
    to pull the correct version of the module from the repository during each build.


