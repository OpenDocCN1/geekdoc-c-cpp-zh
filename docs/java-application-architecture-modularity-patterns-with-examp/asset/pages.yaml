  md: '# CHAPTER 9 DEPENDENCY PATTERNS


    # CONSEQUENCES


    Physical Layers pattern, 162


    Separating your physical layers helps ease some kinds of maintenance. For instance,
    changes to the presentation layer are isolated to a single level. Behavioral changes
    to your business logic are also isolated. However, some types of changes are difficult
    to isolate. Adding new columns to a database table that must be displayed on the
    user interface is typically going to require changes across all of the layers.
    But the value in separating your Physical Layers is still useful because managing
    these changes is much easier. Test Module can be used to independently test the
    changes made in a specific layer, allowing you to ensure that your modification
    functions as expected before changing the other levels.


    Test Module pattern, 263


    If you are lucky enough to have isolated change to a single layer, instead of
    deploying the entire application, you have the option of deploying only the physical
    module that has changed. This type of deploy can be especially useful if there
    are multiple applications that use the module that has changed. Instead of deploying
    each application in its entirety, you can deploy only the module that has changed.


    Levelize Build pattern, 253


    It''s much easier to enforce physical separation than it is logical separation.
    You may have a wonderful initial class structure that appears to be functionally
    separated. But how do you enforce and maintain this logical separation as the
    system grows? If even a single violation of your logical layers creeps into your
    structure, the entire logical layer structure is compromised. While tools such
    as JDepend can help enforce logical separation it is still cumbersome to enforce.
    On the other hand, the separation between physical layers can be strictly enforced
    by performing a levelized build.


    other tools for modular design, 106


    reuse versus use, 62


    In logical separation, separation of classes into layers helps ease maintenance.
    But, physical separation helps you increase reusability, because a module is a
    deployable entity that can be reused.


    # SAMPLE


    It''s common when developing business applications to separate your application
    into three layers. The presentation layer is responsible for structuring and rendering
    the user interface. A business logic, or domain, layer is responsible for containing
    the business objects, and a data access layer is responsible for encapsulating
    access to the persistent data store and external systems.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_193_0.png)'
