  md: '# USABILITY PATTERNS


    Although coupling is an important measurement, cohesion is equally important.
    It''s easy to create and manage module dependencies if I throw all of my classes
    in a couple of JAR files. But in doing so, I''ve introduced a maintenance nightmare.
    In this chapter, we''ll see patterns that help ensure our modules are cohesive
    units that balance reuse with use. It''s interesting that you''ll find some contention
    between the dependency patterns and usability patterns. I talk about this contention,
    what you can do to manage it, and when you want to do it. The usability patterns
    include the following:


    +   - Published Interface: Makes a module''s published interface well known.

    - External Configuration: Modules should be externally configurable.

    - Default Implementation: Provide modules with a default implementation.

    - Module Facade: Create a facade serving as a coarse-grained entry point to another
    fine-grained module''s underlying implementation.'
