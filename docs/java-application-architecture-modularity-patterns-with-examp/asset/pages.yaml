  md: '# THE TWO FACETS OF MODULARITY


    Modularity consists of two aspects: the runtime model and the development model.
    Today, emphasis is on the runtime model, with frameworks emerging that provide
    runtime support for modularity. But eventually, the runtime model gains adoption,
    the importance of the development model will take center stage. The patterns in
    this book focus on an aspect of the development model referred to as the design
    paradigm.


    # 2.1 THE RUNTIME MODEL


    The runtime model focuses on how to manage modular software systems at runtime.
    The facto standard module system on the Java platform is OSGI, and many application
    platforms leverage OSGI to take advantage of the runtime capabilities resulting
    from increased modularity. To an extent, this allows the enterprise to realize
    the advantages of OSGI without knowing much about it. Faster application start-up
    times and platform adaptability are two advantages organizations will realize
    as vendors bake OSGI into their products.


    Until recently, many of the most widely used platforms encapsulated OSGI and chose
    to keep it hidden from enterprise developers. Because of this, developers were
    unable to build applications that took advantage of the modular runtime. However,
    this is changing as the'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'platforms are exposing the virtues of OSGi and allowing developers to tap into
    its powerful runtime capabilities. No longer will we be subject to classpath hell
    and the monolithic applications that plague us today. Instead, modules will be
    able to discover other modules at runtime, and the artificial walls that separate
    applications will no longer exist.


    Eventually, as support for modularity, enterprise developers will be able to leverage
    the frameworks and technologies that aid them in developing more modular software
    systems. When this happens, the development model will become very relevant.


    # 2.2 THE DEVELOPMENT MODEL


    The development model deals with how developers use the framework to build their
    software applications. The development model can be further broken down into two
    categories: the programming model and the design paradigm. Each is important in
    helping developers build more modular software applications.


    # 2.2.1 THE PROGRAMMING MODEL


    Taking advantage of the runtime module system demands that programmers have the
    ability to interact with the module system''s application programming interface
    (API). However, dependencies on the API result in heavyweight modules that are
    difficult to test and execute outside of the runtime system. To reduce the dependency
    on the module system API, frameworks and technologies must provide levels of abstraction
    so that our code doesn''t depend directly upon the framework''s API. Examples
    of these frameworks and technologies include OSGi Blueprint Services, Declarative
    Services, Spring Dynamic Modules, and iPoJo.


    Developers can leverage these frameworks and tools to tap into the capabilities
    of the runtime module system without worrying about the programming model. These
    frameworks encapsulate dependencies on the API so your code doesn''t have to talk
    directly to the API. The separation of concerns achieved through these frameworks
    ensures Java classes remain plain old Java objects (POJOs) that aren''t dependent
    on the module system''s framework. This makes programming and testing much easier.'
  merge: -1
