  md: '# EXTERNAL CONFIGURATION


    # STATEMENT


    Modules should be externally configurable.


    # DESCRIPTION


    When a module is deployed to its runtime environment, it must often be initialized
    before it can be used. For instance, initializing a module with the necessary
    user ID and password might be necessary before the module can access data from
    a database. But we also want to tightly couple the configuration information to
    the module. Doing so will tightly couple the module to a single environmental
    context and limit the likelihood that the module can be reused in alternative
    contexts.


    External configuration allows a module to be configured across environmental contexts.
    Figure 10.4 illustrates External Configuration, where an XML configuration file
    is used by the Client class to configure the client.jar module. Note that the
    configuration responsibility for initializing the client.jar module is separate
    from the Client class representing the behavior of the module. The ability to
    configure a module to its environmental context increases our ability to reuse
    the module across contexts. New consumers of the client.jar module will now have
    the ability to configure the module so that it can be used in different environments.


    # IMPLEMENTATION VARIATIONS


    There are different ways to configure a module for its environmental context.
    Foremost, we may want separate configuration files that can be used for different
    contexts. The configuration file can be included in the


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_229_0.png)


    Figure 10.4 External Configuration'
  merge: -1
