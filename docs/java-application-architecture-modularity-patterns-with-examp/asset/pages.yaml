  md: Figure 14.1 illustrates the classes and modules in the final structure of our
    loan system from the Colocate Exceptions "Sample" section. The immediate goal
    is to refactor these modules so that they'll execute in an OSGi environment. To
    do this, we need to do a few things. First, we need to include within each module
    a bundle manifest file that contains the metadata used by the OSGi runtime. This
    metadata informs the runtime of the module dependencies, visibility of its internal
    types, and the runtime. Second, we need to register each module's services with
    the OSGi service registry. We use Spring DM to do this, which is the reference
    implementation for the OSGi Blueprint Services.
