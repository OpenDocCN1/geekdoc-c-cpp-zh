  md: '# 2.4 CONCLUSION


    +   - **Versioning**: In standard Java, it''s not possible to deploy multiple
    versions of a class. A module system allows for multiple versions to be deployed.


    +   - **Dependency management**: In standard Java, there is no way to enforce
    the dependency structure of the modules. Build tools such as Maven attempt to
    solve this problem through repositories of JAR files that describe their dependencies.
    A runtime module system enforces runtime dependency management.


    # 2.4 CONCLUSION


    There are two facets to modularity: the runtime model and the development model.
    The development model is comprised of the programming model and the design paradigm.
    All facets are important, but failing to understand how to design modular software
    will detract from the benefits of using a modular runtime framework. The discussions
    throughout this book primarily address the design paradigm.'
