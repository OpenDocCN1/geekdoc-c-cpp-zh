  md: '# 13.4.2 OSGI µServices


    +   - Stopping: A bundle is stopping. Its services are no longer available.

    - Uninstalled: A bundle has been uninstalled.


    The OSGI Service Platform defines a service registry that contains references
    to Java objects that have been registered as OSGI services. As not to confuse
    OSGI services with Web services, we typically refer to OSGI services as µServices,
    since they are services that run within a single instance of the Java Virtual
    Machine (JVM).


    OSGI creates and manages the full service life cycle by registering all µServices
    with the OSGI service registry. Once a µService is registered with the service
    registry, classes contained with OSGI bundles are able to use the µService. A
    µService has two important aspects: the interface and the service implementation.


    The service interface is a Java interface or abstract class that exposes few implementation
    details about the µService by requesting a reference to the µService from the
    service registry using a keyword under which the µService has been registered.
    Often, the name of the interface is used to register the µService. The µService
    is defined in the service implementation and is encapsulated within the OSGI bundle.


    Many different µService implementations can be registered with the OSGI service
    registry using the same service interface name. The µService instances implementing
    the interface can be registered and unregistered without restarting the JVM. If
    the interface and each implementation reside in different OSGI bundles, the bundles
    can be uninstalled, and new bundles can be installed that extend the behavior
    of the application dynamically. In fact, this separation of interface and implementation
    is the intent behind Separate Abstractions. There are a few different ways to
    use µServices with OSGI. The first is to code directly to the OSGI API, which
    is flexible because it results in heavyweight modules. The others are to use Blueprint
    Services or Declarative Services:


    +   - Blueprint Services: As much as possible, developers want to avoid dependencies
    on the OSGI framework within their code. Based on the Spring framework, Blueprint
    Services allows the developer to achieve this goal. Interaction with the framework
    itself is confined to configuration, allowing a developer to focus less on the
    writing'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'plumbing code surrounding OSGI services and more on writing

    application business logic.


    +   - Declarative Services: Declarative Services is a component model

    makes it easier to publish and consume OSGI µServices. Like

    Blueprint Services, Declarative Services allow you to leverage OSGI

    while minimizing dependencies on the OSGI framework API.


    # 13.5 OSGI Runtime Management


    The OSGI framework provides an API that allows developers to manage

    OSGI bundles. In fact, these management capabilities are implemented by

    The OSGI framework using OSGI µServices.


    Managing the OSGI framework can be done once or the framework is

    available within the application or platform. Many OSGI frameworks,

    such as Equinox and Felix, provide command-line controls that facilitate

    starting, stopping, installing, and uninstalling OSGI bundles. Addition-

    ally, application developers can use the OSGI API to perform these man-

    agement tasks programmatically.


    # 13.6 THE TWO FACETS OF MODULARITY,

    REVISITED


    Chapter 2 discussed the two facets of modularity: the development model

    and the runtime model. The development model is comprised of the pro-

    gming model and the design paradigm. Although the patterns in this

    book help address the design paradigm surrounding modularity, the OSGI

    framework addresses the runtime model, while the OSGI framework API,

    Blueprint Services, and Declarative Services address the programming

    model.


    # 13.7 OSGI AND THE PATTERNS


    When runtime support for modularity is provided by the target platform,

    the benefits of modular software are even more pronounced. Today, the

    de facto standard platform for modularity is OSGI, with most major appli-

    cation platform vendors supporting OSGI. Soon, we''ll walk through some

    sample code that illustrates how the patterns can be applied using OSGI.'
  merge: -1
