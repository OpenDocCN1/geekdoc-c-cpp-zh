  md: '# INTRODUCTION


    In 1995, design patterns were all the rage. Today, I find the exact opposite.
    Patterns have become commonplace, and most developers use patterns on a daily
    basis without giving it much thought. New patterns rarely emerge today that have
    the same impact of the Gang of Four (GOF) patterns. In fact, the industry has
    largely moved past the patterns movement. Patterns are no longer fashionable.
    They are simply part of a developer''s arsenal of tools that help them design
    software systems.


    But, the role design patterns have played over the past decade should not be diminished.
    They were a catalyst that propelled object-oriented development into the mainstream.
    They helped legions of developers understand the real value of inheritance and
    how to use it effectively. Patterns provided insight into how to construct flexible
    and resilient software systems. With nuggets of wisdom, such as "Favor object
    composition over class inheritance" and "Program to an interface, not an implementation"
    (Gamma 1995), patterns helped a generation of software developers adopt a new
    programming paradigm.


    Patterns are still widely used today, but for many developers, they are instinctive.
    No longer do developers debate the merits of using the Strategy pattern. Now must
    they constantly reference the GOF book to identify


    +   1. The patterns in the book Design Patterns: Elements of Reusable Object-Oriented
    Software are affectionately referred to as the GOF patterns. GOF stands for the
    Gang of Four, in reference to the four authors.'
