- img_proc: true
  md: 'module, included in a separate module, or both. The option we choose depends
    upon the flexibility desired.


    In Figure 10.4, we saw that the configuration information was included within
    the module. The advantage of including the configuration file within the module
    is that it''s easy to use the module within its default context. In other words,
    you won''t need to specify the configuration information. The module knows how
    to initialize itself in that context. Unfortunately, the disadvantage is that
    this default configuration will likely not work in alternative contexts.


    Figure 10.5 illustrates a configuration file that is not deployed within the module
    but is provided to the module separately upon initialization. The advantage with
    this second approach is that the module is no longer coupled to its environment
    and can be reused across context. However, each time the module is used in a new
    environment, the configuration information must be provided. There is no default.


    A flexible alternative is to provide a default configuration file within the module
    but allow for the module to be configured with an alternative configuration file.
    In some cases, though, including a default configuration is not possible since
    there is no default environmental context. For instance, many popular logging
    frameworks, such as Log4j, require developers to define the logging framework
    parameters before the framework is configured properly to work within the system.
    However, there is generally no default configuration provided because there is
    no default environmental context that is known to the developers of the module.


    Including a default configuration file within the module is one aspect of providing
    a module''s Default Implementation. In some cases, you may choose to break configuration
    out into multiple configuration files. Some


