  md: '# CHAPTER 7 REFERENCE IMPLEMENTATION


    the beginning of Section 7.6, these modules containing the bill and audit behavior
    had a cyclic relationship.


    Although this example doesn''t leverage OSGi, it is important to point out the
    benefit that OSGi can provide. Because we don''t have a runtime module system,
    we still need to deploy these modules within a WAR file. Changing any of the modules
    still requires that we redeploy the entire WAR, even though it''s possible to
    rebuild the modules that have changed. The presence of OSGi, however, brings the
    same degree of flexibility to the runtime that we have at development time. With
    OSGi, we would be able to install and uninstall the audit1.jar and audit2.jar
    modules without redeploying the entire system.


    Additionally, we are unable to encapsulate the implementations details within
    any specific module. Classes still have access to all other classes and can reach
    inside a module to gain access to the classes to provide implementation details.
    With OSGi, we can ensure implementations details remain hidden and expose only
    the behaviors we want through OSGi µServices.


