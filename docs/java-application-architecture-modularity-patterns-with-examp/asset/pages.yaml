  md: '# PUBLISHED INTERFACE


    # STATEMENT


    Make a module''s published interface well known.


    # DESCRIPTION


    A module should encapsulate implementation details so that other modules do not
    need to understand how a module is implemented in order to leverage the capabilities
    of the module. Ideally, a module will expose an application programming interface
    (API) that other modules are able to interact with the module. The API that a
    module exposes should also be easy to understand. A module''s API is its published
    interface. More formally, a module''s published interface is defined as the following:


    > A Published Interface consists of the public methods within the public classes
    within the exported packages that other modules are able to invoke.


    Unfortunately, Java doesn''t allow you to define a module''s exported packages,
    so enforcing a published interface using standard Java is not possible. Because
    of this shortcoming of the Java language, a module''s published interface is polluted
    by public methods on public classes within a module.


    In Figure 10.1, the operations defined on the Service interface in the service.jar
    module represents the module''s published interface. The ServiceImpl class provides
    the implementation. The Client class within the client.jar module receives a reference
    to an instance of the Service interface type and therefore cannot invoke public
    methods on ServiceImpl that aren''t defined on Service. Of course, downcasting
    to ServiceImpl would allow the Client class to invoke the method3 operation. It''s
    easy to see why enforcing a published interface using standard Java is not possible.'
