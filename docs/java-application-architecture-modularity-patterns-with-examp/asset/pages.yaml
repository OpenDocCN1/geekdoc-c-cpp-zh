  md: 'dependency structure among any of those modules, then there is no way to get
    the binary form of one module without also having the binary form of all dependent
    modules. Because of the cycle between the modules, you''ll be required to build
    all as as part of the same target. Figure 12.4 illustrates Levelize Build.


    # IMPLEMENTATION VARIATIONS


    Levelize Build can be more complex than performing a full classpath build. If
    you''re using a build tool like like Ant, you''ll find that you have many more
    build targets—effectively, one for each module. Most like complex development
    issues, breaking down the problem can help simplify it significantly. Modularizing
    your build scripts by breaking a single complex script into multiple simpler scripts
    is beneficial.


