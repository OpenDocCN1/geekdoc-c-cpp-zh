- img_proc: true
  md: 'The most compelling evidence suggesting that we should emphasize reuse at the
    module level is through examination of the open source community and many of its
    frameworks. The most widely adopted and successful open source products are JAR
    files that can be easily incorporated into your application. The most flexible
    of these offerings provide hooks into the framework that allow you to customize
    it to your need. But all emphasize the module as the unit of reuse.


    # IMPLEMENTATION VARIATIONS


    There are several important items to consider when designing modules for reuse.


    # Horizontal and Vertical Behavior


    Horizontal modules span business domains and do not contain functionality that
    is specific to your domain. It''s much easier to develop horizontal modules for
    reuse because their usage pattern is consistent and well-known. Most open source
    software, such as Struts, Hibernate, and Spring, fall into this category. Vertical
    modules, on the other hand, are specific to a business domain. They offer behavior
    rich with functionality specific to your organization. Many of the modules developed
    for business software fall into this category.


    Horizontal modules are much easier to develop than vertical modules. The challenge
    with vertical modules is that you are forced to predict the requirements of future
    usage scenarios, which is an impossible task. For instance, Hibernate, a widely
    used persistence framework, allows you to bridge the object and relational worlds
    regardless of which backend database you are using. Attempting to develop an Employee
    class that is reused across the enterprise is virtually impossible since different
    applications within your organization will require different behaviors of the
    Employee.


    Since vertical modules are so much more difficult to reuse, it is important to
    create them with the least amount of functionality that will use it. Therefore,
    you have to be cautious in adding any degree of rich behavior. A good starting
    point is a module that serves as a facade for a backend datasource and returns
    raw business objects with little functionality. These business objects, while
    offering little functionality, contain the data and other methods that allow the
    object to be configured to its context.'
