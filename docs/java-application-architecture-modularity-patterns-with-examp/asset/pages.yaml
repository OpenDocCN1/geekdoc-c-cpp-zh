- img_proc: true
  md: '# CHAPTER 8 BASE PATTERNS


    Herein lays one of the greatest challenges with achieving reusability using object-oriented
    development. The class, a combination of attributes and behaviors, which is commonly
    the focal point of most object-oriented designers, is not an adequate reuse construct.
    Reuse is a matter of scale, and attempting reuse at the class level is too small
    to realistically expect that high degrees of reuse can be achieved.


    Of course, other factors contribute to our inability to achieve higher degrees
    of reuse. Many highly touted design techniques, such as the Unified Modeling Language
    (UML) and patterns, tend to draw our attention toward class design. Attempts to
    use the design techniques to create robust designs before coding only exacerbates
    the problem, and for large systems with many classes and many developers, the
    problem grows even worse. Instead of attempting to reuse at the class level, we
    should turn our attention to using object-oriented concepts to design more flexible
    class relationships.


    Of course, most of us have experienced some degree of success with class-level
    reuse, especially within an application. Utility classes are common in most applications
    and are generally reusable. But, even these classes can be difficult to reuse
    across applications. To reuse within an application, all classes can be bundled
    together. But to reuse across applications, classes need to be bundled separately
    into cohesive modules. With dependencies between the modules are not managed carefully,
    reuse will not follow. Failure to modularize your code correctly is one of the
    leading causes for the most common form of reuse: copy and paste.


    To effectively achieve higher degrees of reuse, we need a higher-level unit of
    modularity around which code can be organized, bundled, and deployed. This higher-level
    unit of modularity is the module, or in Java, the JAR file. The Reuse Release
    Equivalence Principles states this more succinctly:


    The unit of reuse is the unit of release.


    Instead of emphasizing reuse at the class level, we should emphasize reuse at
    the module level. Then, using object-oriented design concepts, we create flexible
    class designs that are extensible, configurable, and exhibit low degrees of coupling.
    We bundle these classes into cohesive and independently deployable modules that
    can then be reused. A flexible class design allows you to refactor modules by
    moving classes to different modules based on need.


    126'
