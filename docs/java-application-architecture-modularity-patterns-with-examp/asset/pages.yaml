  md: '# CHAPTER 9 DEPENDENCY PATTERNS


    that uses Spring DM, the framework provides dependency injection capabilities
    but also provides critical functionality surrounding OSGI service management.


    # CONSEQUENCES


    Container Independence ensures a module is portable across runtime environment
    because the infrastructure behavior is separate from module behavior. The Spring
    framework is an example of a framework that helps you create lightweight modules.
    Because the infrastructure code is encapsulated by the framework, there is less
    likelihood that errors will arise related to infrastructure. In general, application
    code is easier to write, maintain, and port across runtime environments, and the
    amount of infrastructure code a developer needs to write is much less.


    Test Module

    pattern, 263


    Container Independence also increases the ease of testing module because there
    are no container dependencies to contend with. A Test Module can verify module
    behavior without testing the infrastructure code.


    While Container Independence provides significant benefits enabling testing and
    increases portability across a variety of different runtime environments, it can
    also result in complex infrastructure code that is challenging to write and manage.
    When a dependency injection framework is used, XML configuration files tend to
    proliferate. Fortunately, the trade-off is often worth the benefit.


