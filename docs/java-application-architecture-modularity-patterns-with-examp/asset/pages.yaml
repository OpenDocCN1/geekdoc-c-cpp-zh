- img_proc: true
  md: '# PART II THE PATTERNS


    in accomplishing this goal, but simply adding new functionality to an existing
    system is only part of the battle. We also want to be able to deploy those new
    additions without redeploying the entire application. The extensibility patterns
    focus on helping us achieve this goal. The extensibility patterns include the
    following:


    +   - **Abstract Module:** Depend upon the abstract elements of a module.

    - **Implementation Factory:** Use factories to create a module''s implementation
    classes.

    - **Separate Abstractions:** Place abstractions and the classes that implement
    them in separate modules.


    # CHAPTER 12: UTILITY PATTERNS


    The utility patterns aid modular development. Unlike the other patterns, they
    don''t emphasize reuse, extensibility, or usability. Instead, they discuss ways
    that modularity can be enforced and that help address qualityrelated issues. The
    utility patterns include the following:


    +   - **Colocate Exceptions:** Exceptions should be close to the class or interface
    that throws them.

    - **Levelize Build:** Execute the build in accordance with module levelization.

    - **Test Module:** Each module should have a corresponding test module.'
