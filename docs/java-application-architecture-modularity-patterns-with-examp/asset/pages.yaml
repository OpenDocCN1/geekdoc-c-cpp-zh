    # SEPARATE ABSTRACTIONS


    # STATEMENT


    Place abstractions and the classes that implement them in separate modules.


    # DESCRIPTION


    Providing new implementations of the abstractions within a module allow you to
    create new modules with implementations that extend the behavior of the system.
    Abstract Modules accommodates this scenario. However, in certain situations, you
    may want to replace an existing behavior of the system with new behavior altogether.
    Unfortunately, with Abstract Modules, the abstractions and implementations live
    within the same module, preventing you from replacing the default behavior.


