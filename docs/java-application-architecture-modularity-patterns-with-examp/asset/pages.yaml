  md: '# LEVELIZE MODULES


    An especially important piece of criteria to consider when levelizing modules
    is whether you''ll allow module relationships to span levels. With strict levelization,
    modules can reference other modules only in the level directly beneath it. With
    relaxed levelization, modules can reference other modules in any level beneath
    it. The decision to enforce a strict levelization scheme over allowing a relaxed
    scheme will have a significant architectural impact. In theory, a strict scheme
    might seem better, but in practice a relaxed scheme is easier. A mixture of the
    two is likely most pragmatic, and it must be a conscious decision each time you
    decide to allow a module to reference another modules more than one level beneath.


    # CONSEQUENCES


    Levelization can provide insight to the complexity of dependencies. For instance,
    a level 5 module found in the data access layer indicates a complex set of dependencies
    for a module that is likely heavily used throughout the system. Excessive dependencies
    in lower-level modules have the greatest capacity to increase overall cost of
    maintaining a system. A good candidate for refactoring, perhaps!


    Levelize Modules also offer the opportunity to perform a levelized build. If a
    team cannot easily identify the levels within the system, the only opportunity
    to perform a levelized build exists across the physical layers, which may not
    offer the flexibility needed. For very large and complex systems, a levelized
    build might be necessary to keep build time fast, which is especially important
    for teams practicing continuous integration.


    Levelization also helps improve module testability. Test Modules can be used to
    create a test module for each module, and the levelization will provide guidance
    on the module test strategy. Lower-level modules are inherently easier to test
    than higher-level modules because they lack the complexity dependency structure.
    For instance, modules in the UI layer can be perceived as more difficult to test
    independently because we have to create mocks and stubs for all of their dependencies.
    But a level 1 module in the UI layer indicates no outgoing dependencies and provides
    insight to how easy the module will be to bring under test.


    Levelization improves ability to understand the system structure. The team has
    the ability to extract and understand the module relationships in a large software
    system, allowing us to efficiently and accurately verify throughout the development
    life cycle that these dependencies are


