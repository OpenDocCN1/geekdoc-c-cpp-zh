  md: '# IMPLEMENTATION VARIATIONS


    Whereas Separate Abstractions says that interfaces should be close to the classes
    that use them, exceptions should be close to the class that throws them. If multiple
    classes from separate modules throw the same exception, then demotion should be
    used to manage the dependencies between the two modules. In other words, the exception
    should be demoted to a module upon which the other modules that throw, and catch,
    the exception depend upon.


    Separate Abstractions pattern, 237


    # CONSEQUENCES


    Neglecting to place an exception in the appropriate module will result in undesired
    dependencies between modules. For instance, if the exception is placed in the
    same module as the class that catches that exception, then the module where the
    exception is caught will depend upon it. It''s likely that this will result in
    a cyclic dependency between two or more modules. For instance, in Figure 12.1,
    had the ServiceException placed in the client.jar module, both the service-impl.jar
    and service.jar modules would be dependent on the client.jar. Figure 12.2 shows
    the


    cyclic dependencies, 50


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_276_0.png)


    Figure 12.2 Incorrect placement of exceptions'
