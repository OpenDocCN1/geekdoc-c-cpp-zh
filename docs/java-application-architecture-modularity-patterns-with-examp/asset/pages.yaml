  md: '# PHYSICAL LAYERS


    # STATEMENT


    Module relationships should not violate the conceptual layers.


    # DESCRIPTION


    When designing a software system of moderate to high complexity, it''s common
    for developers to separate the presentation, business logic, and data access into
    distinct layers. Each layer should be responsible for a functional aspect of the
    application. The most common layering scheme is a three-layer approach consisting
    of presentation, business logic, and data access. The presentation layer is responsible
    for rendering the user interface. A business logic, or domain, layer is responsible
    for containing the business objects, and a data access layer is responsible for
    encapsulating access to the persistent data store and external systems. Typically,
    you''ll apply certain patterns to each layer, such as MVC in the presentation
    layer and DAO in the data access layer, contributing to a well-defined set of
    functionality within each layer. Such logical separation of functionality can
    help ease maintenance of the application.


    Functionally separating your application into logical layers is not enough, though.
    One of the off-cited advantages of separating the application into various layers
    is to allow you to reuse the functionality exposed by lower layers. For instance,
    if you''re developing a Web application, you may find a need to reuse the business
    logic within another Web application, or possibly even a batch style application.
    To achieve this, you can not logically divide your layers based only on behavior,
    but you can also physically separate the layers structurally. Structural relationships
    between the physical layers. Figure 9.8 shows the allowable structural relationships.
    Note that it''s important that Cyclic Relationships exist between the modules.


    # IMPLEMENTATION VARIATIONS


    To effectively divide your application into Physical Layers, your modules must
    exhibit Cyclic Relationships. Because you cannot reuse any module without all
    dependent modules, cycles in the relationships between the modules in the physical
    layers prevents you from achieving the structural separation you want. This holds
    true regardless of how well you''ve logically separated the behavioral aspects
    of your application.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# PHYSICAL LAYERS


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_192_0.png)


    **Figure 9.8** Allowable relationship between physical layers


    An important consideration when defining your physical structure is whether you
    will use a strict or relaxed layering scheme. With a strict-layering scheme, upper-level
    layers communicate only with the layer directly beneath them. With a relaxed scheme,
    upper-level layers can use directly any layer underneath them. A strict layering
    scheme brings greater clarity to the structure of the application but can also
    result in inefficiencies since code may not be duplicated or pass through methods
    used for upper-level layers to leverage the desired behavior.


    Don''t try to exactly define your physical structure based upon what you think
    you might want to reuse. This predictive form of reuse does not work very well,
    and you will end up with a bunch of modules where not one can be independent of
    others. Instead, start with fewer modules, carefully managing the relationships
    between them, and break apart the modules as you need reuse. It''s okay to start
    with a single module that represents each layer. As the application grows, maintain
    the physical layers and break apart the coarse-grained modules representing each
    layer to multiple finer-grained modules that compose each layer. Levelizing modules
    can help maintain an understanding of system structure. Don''t be afraid to refactor
    to more flexible module relationships when you find the need.'
