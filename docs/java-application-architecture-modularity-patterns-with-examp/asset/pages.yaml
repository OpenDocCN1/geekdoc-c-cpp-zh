  md: '# SOLID PRINCIPLES OF CLASS DESIGN


    The SOLID principles lie at the heart of the object-oriented paradigm. Many of
    the principles presented here first appeared in Robert Martin''s Agile Software
    Development: Principles, Patterns, and Practices (2002), which serves as an excellent
    companion to this discussion. These principles help you manage dependencies between
    classes and encourage class cohesion. They are also critical to effective module
    design using object-oriented techniques.


    # Note


    For a discussion on how the SOLID principle of class design aids the development
    of modular software applications, see Chapter 4, "Taming the Beast Named Complexity."


    The SOLID principles are the following:


    +   * Single Responsible Principle: Classes should change for only a single reason.

    * Open Closed Principle: Classes should be open for extension but closed to modification.

    * Liskov Substitution Principle: Subclasses should be substitutable for their
    classes.

    * Dependency Inversion Principle: Depend upon abstractions. Do not depend upon
    concretions.'
