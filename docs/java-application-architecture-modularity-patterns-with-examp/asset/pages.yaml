  md: '# 3.4 MODULARITY: THE MISSING INGREDIENT


    # 3.4.1 Is It REALLY ENCAPULATED?


    In standard Java, there is no way to enforce encapsulation of design details modularizing
    to a module because Java provides no way to define packages or classes without
    a runtime module scope. As a result, classes in one module will always have access
    to the implementation details of another module. This is where a module framework
    framework, such as OSGI, shines because it allows you to forcefully encapsulate
    implementation details within a module through its explicit import package and
    export package manifest headers. Even public classes within a package cannot be
    accessed by another module unless the package is explicitly exported. The difference
    is subtle, although profound. We see several examples of this in the patterns
    throughout this book, and I point it out here. For now, let''s explore a simple
    example.


