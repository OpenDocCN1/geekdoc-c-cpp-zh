  md: '# CHAPTER 10 USABILITY PATTERNS


    logic that is performed only in specific situations can be encapsulated in a Module
    Facade to ensure that the modules for which it serves as the facade maintain their
    high degree of reusability. A Module Facade can alter or augment the API of its
    underlying modules, possibly decorating those modules with additional behavior
    based on the context. A Module Facade can also act as a mediator to help break
    the dependencies between a set of modules. This is quite similar to the concept
    of escalation that was discussed in Cyclic Relationships.


    It''s likely we''ll use a Module Facade in conjunction with other patterns. For
    instance, the classes inside the Module Facade may have a Published Interface.
    We might choose to create a Facade abstraction so that new facades can be easily
    created.


    # CONSEQUENCES


    While a Module Facade is useful to augment the functionality of a group of underlying
    modules, it''s likely that the Module Facade will have many outgoing dependencies
    on these modules. In other words, the Module Facade is generally tightly coupled
    to other modules. In addition to higher coupling, the Module Facade also encapsulates
    contextual behavior and configuration. Each diminishes the likelihood that the
    Module Facade is reusable across a variety of contexts. Instead, it''s used to
    configure a group of modules in a particular context.


    In general, a Module Facade makes a group of underlying modules easier to use,
    but the modules themselves are typically not highly reusable. Instead, a facade
    maintains the reuse of the group of modules for which it serves as a facade.


    Because a Module Facade has many outgoing dependencies, finegrained modules that
    the Module Facade depends upon must be deployed whenever the coarse-grained module
    facade is deployed. A Module Facade can help increase the ease of use while maintaining
    the usability surrounding its underlying modules, but the increase of dependencies
    that accompany a Module Facade can also increase the complexity surrounding deployment.
    In other words, when deploying the Module Facade, you''ll have to manage all of
    its dependent modules.


    Testing a module facade in isolation is also difficult, since the purpose of the
    module facade is to treat an underlying group of modules as a cohesive unit. Regardless,
    a module facade is an excellent way to make it much easier to use a group of underlying
    fine-grained and lightweight modules.


    214'
