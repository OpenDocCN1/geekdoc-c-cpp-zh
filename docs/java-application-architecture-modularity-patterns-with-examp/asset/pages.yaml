  md: '# CHAPTER 10 USABILITY PATTERNS


    # DEFAULT IMPLEMENTATION STATEMENT


    Provide modules with a default implementation.


    # DESCRIPTION


    To maximize reuse, a module must be flexible enough so that it can function in
    a variety of different operating environments. Yet, for a module to be usable,
    it must be independently deployable. To address this tension, a module can be
    given a Default Implementation with well-defined extension points so that the
    module can be extended when necessary. This balances the desire for use with the
    desire for reuse.


    Figure 10.7 shows Default Implementation. The default.jar module contains the
    DefaultImpl class, which is the default implementation for the DefaultInterface.
    The default.jar module contains the appropriate configuration to use this default
    implementation. The betterimpl.jar module also uses the default.jar module but
    provides its own implementation of DefaultInterface, as well as the appropriate
    configuration to configure the default.jar module.


    # IMPLEMENTATION VARIATIONS


    Sometimes the default implementation may reside within the module. Other times,
    it may reside in a separate module. If the default implementation resides in the
    same module, consider the Abstract Modules pattern. If the implementation resides
    in a separate module, consider the Separate Abstractions pattern.


    In addition to the behavior of the module (that is, the default implementation),
    we must also account for module configuration. Ideally, a module is externally
    configurable so that it can be used in a variety of contexts. When defining the
    implementation for a module, a default configuration should also be provided.


    As a result of providing external configuration and a default implementation,
    the module can be simply dropped into the environmental context for which it was
    designed, helping to maximize module usability. In situations where the module
    behavior is desired in an environment context for which the module was not originally
    designed, developers'
