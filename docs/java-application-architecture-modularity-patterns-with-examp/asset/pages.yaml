  md: '# 14.3 μSERVICES


    Unfortunately, this will couple the bundles to the OSGi framework, which is something
    we want to avoid.


    Our other option is to use Blueprint Services. In this example, we''ll use Spring
    DM, which is the reference implementation for the Blueprint. Using Spring DM allows
    us to maintain our Container Independence, allowing us to test and execute our
    system outside the confines of the OSGi framework.


    When using Spring DM, we specify two main configuration criteria. First, we need
    to specify the bean wiring configuration, just as we do with Spring if we weren''t
    using OSGi. Second, we use Spring to declare our OSGi Services. We''ll place these
    two different configurations in separate files that we ensure ourselves our system
    will execute outside the context of the OSGi framework.


    # 14.3.2 THE LOAN Bean CONFIGURATION


    Again, let''s start by defining the bean configurations for our bundles, and we
    will begin with the loan-impl.jar bundle. We note that we do not need to provide
    any Spring configuration for the loan-intrfc.jar bundle because it doesn''t expose
    any services. The loan-intrfc.jar bundle is strictly the contract through which
    all other bundles communicate.


    To ensure that each module is capable of standing on its own, we want to avoid
    defining a single configuration file for the entire system. To accomplish this,
    we''ll place each bean configuration in the same module as the beans we are. Configuring
    this will help us ensure Independent Deployment by providing a Default Implementation.


    Before we see the bean configuration, let''s briefly review the wiring that will
    be necessary. The PaymentFactoryImpl class is responsible for creating the Loan
    classes in the loan-impl.jar bundle. The PaymentFactory is passed to the MinimumPaymentScheduleCalculator,
    which uses the factory to instantiate the appropriate implementation classes.
    The MinimumPaymentScheduleCalculator, which implements LoanCalculator, is passed
    to the LoanFacade. The LoanFacade class is used by the LoanClient to perform the
    actual calculations and obtain a reference to the Loan.


    We need to wire the following:


    +   - PaymentFactoryImpl to the MinimumPaymentScheduleCalculator'
