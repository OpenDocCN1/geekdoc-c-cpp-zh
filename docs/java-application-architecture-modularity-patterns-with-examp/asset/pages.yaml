  md: '# SOLID PRINCIPLES OF CLASS DESIGN


    +   - Interface Segregation Principle: Many specific interfaces are better than
    a single, general interface.


    +   - Composite Reuse Principle: Favor polymorphic composition of objects over
    inheritance.


    I also believe an additional principle is equally important. Sadly, it breaks
    the acronym. I call this principle the Composite Reuse Principle, which is to
    favor polymorphic composition of objects over inheritance (Knoernschild 2001).


    # SINGLE RESPONSIBILITY PRINCIPLE (SRP)


    Classes should change for only a single reason.


    The basis for this principle is cohesion. Cohesion represents the measure to which
    a class performs a single function. Classes that are highly cohesive are easier
    to understand. But they are also easier to maintain. This is the motivating force
    behind SRP. If a class has more than one reason to change, then it stands to the
    responsibilities of that class that are the cause of change should be separated
    into multiple classes.


    Cohesion is not a concept new to objects. In fact, the concept is taught in most
    introductory programming courses. Ironically, I found that although most developers
    can easily define cohesion and explain its benefits, few developers actually apply
    it. Cohesion measures the degree to which an entity is responsible for performing
    only a single thing, most of our entities should be fairly small. Yet, I come
    across methods that run over 100 lines of code and classes that run orders of
    magnitudes larger than that. I struggle to convince myself that either is cohesive.
    When you''re designing a highly cohesive system, you have to think small.


    # OPEN CLOSED PRINCIPLE (OCP)


    Classes should be open for extension, but closed for modification.


    The Open Closed Principle (OCP) is undoubtedly the most important of all the SOLID
    principles. In fact, each of the remaining class principles are derived from OCP.
    It originated from the work of Bertrand Meyer, who is recognized as an authority
    on the object-oriented paradigm. OCP states'
