    instinctively design object-oriented software systems.


    Many patterns are also timeless. That is, they are not tied to a specific platform,
    programming language, nor era of programming. With some slight modification and
    attention to detail, a pattern is molded to a form appropriate given the context.
    Many things dictate context, including platform, language, and the intricacies
    of the problem you''re trying to solve. As we learn more about patterns, we offer
    samples that show how to use patterns in a specific language. We call these idioms.


    I''d like to think the modular patterns in this book are also timeless. They are
    not tied to a specific platform or language. Whether you''re using Java or .NET,
    OSGi, or Jigsaw or you want to build more modular software, the patterns in this
    book help you do that. I''d also like to think that over time, we''ll see idioms
    emerge that illustrate how to apply these patterns on platforms that support modularity
