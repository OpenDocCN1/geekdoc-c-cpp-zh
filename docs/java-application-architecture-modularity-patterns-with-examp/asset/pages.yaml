  md: '# INDEPENDENT DEPLOYMENT


    # STATEMENT


    Modules should be independently deployable units.


    # DESCRIPTION


    For a module to be independently deployable, it cannot have any outgoing dependencies
    on any other module. Some modules are naturally more independent than others.
    For instance, it would be relatively easy to create an independent module to perform
    various mathematical and statistical functions, mainly because there are few external
    forces that impact how the module needs to behave. However, you cannot always
    expect to eliminate all outgoing dependencies. In most interesting systems, cohesive
    modules collaborate and work together to provide the complex behavior exhibited
    by business applications, and there are many more forces that can affect how an
    object behaves. Although we strive to reduce coupling as much as possible, some
    coupling must exist in order for a network of objects to work together. Without
    some coupling, your system would not be interesting.


    Given that some degree of coupling is necessary, it''s also likely that collaborating
    modules are spread throughout and across different modules. To obtain high degrees
    of maintainability, and a glimmer of hope for reusability, it''s important to
    minimize the coupling between modules.


    # IMPLEMENTATION VARIATIONS


    Modules need to interact because it''s the sum of these interactions that result
    in a system with a desired behavior. If it''s required that two modules must interact,
    you can create an interface or abstract class within a module that defines the
    dependent module''s extension points. Implementations can be plugged into the
    module at runtime. This will eliminate compile-time dependencies and offer significant
    flexibility at runtime, since a module can work with many different implementations.


    There are two ways to wire together modules at runtime when the modules have no
    compile-time dependencies. First, you can use a factory to programmatically wire
    them by configuring the classes of a module'
