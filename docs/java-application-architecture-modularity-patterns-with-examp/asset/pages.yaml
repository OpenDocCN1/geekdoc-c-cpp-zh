  md: '# CHAPTER 2 THE TWO FACETS OF MODULARITY


    In some cases, we include a sample that leverages OSGi to illustrate its advantages.
    Even when OSGi hits your platform, it is pertinent to remember that the intent
    of modularizing our applications is not only to develop applications that leverage
    OSGi. The real value is the modular architecture that results.


    # 2.3.1 BEWARE


    It’s critical to keep in mind that modularizing a software system without runtime
    module support will be challenging. In the absence of a runtime system, the tools
    you use are critical. Visualization tools that help you understand your structure,
    build tools that enforce the structure, and dependency management tools that help
    you manage dependencies are a necessity. For many of the examples throughout this
    book, we use Analyzer to help us manage the dependencies between modules.


    Additionally, the patterns in this book help you modularize a system. For instance,
    the Utilize Build pattern helps you enforce your module relationships at compile
    time. With good tools and strong discipline, modular architecture is something
    you can achieve. Furthermore, after your modular architecture is in place, you
    can take advantage of runtime support once it’s available. However, without runtime
    support, you are simply unable to accomplish some things. A runtime module system
    often provides support for the following:


    +   **Encapsulation**: In standard Java, any public class in a package found on
    the classpath is available to anything else on the classpath. In other words,
    there is no way to hide implementation details. Everything is global, which imped
    modular design. A runtime module system provides the ability to hide implementation
    details. For instance, OSGi uses uServices to expose an interface to the underlying
    implementation details.


    +   **Dynamic deployment**: In standard Java, updating the software typically
    involves restarting the JVM. A runtime module system supports hot deploys.


    Encapsulation and uServices are a powerful combination whose value cannot be stressed
    enough. They enable you to enforce your modular design. In standard Java, you
    cannot enforce modularity. We will revisit this idea in several sections throughout
    this book.'
