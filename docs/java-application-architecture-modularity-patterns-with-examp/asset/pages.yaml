    # IMPLEMENTATION VARIATIONS


    The two key ingredients when using Separate Abstractions is deciding when you
    should place the abstraction and where you should place the implementation. Because
    there could be many different implementations, the key to making this decision
    is figuring out the module dependencies, keeping in mind that the modules containing
    the implementation will be dependent on the module containing the abstraction.
    In general, use the following principle:


    Keep the abstraction closer to the classes that depend upon it and further from
    the classes that extend or implement it.


    Here are some general guidelines to help you accommodate this goal:


    +   - If all the classes that depend upon the abstraction live in a single module,
    then place the classes and the abstraction in the same module.

    - If all the classes that depend upon the abstractions live in multiple modules,
    then place the abstraction in a module separate from the classes that depend upon
    it.


    The module depending on the abstraction needs to be injected with an implementation
    of the abstraction or have some way to look up the implementation at runtime.
    In other words, creating the appropriate implementation is an important consideration.
    Otherwise, the module that is dependent on the abstraction will also be dependent
    on the implementation, which compromises the integrity. For instance, in Figure
    11.5, if the PaymentTest class creates the Service class, the client.jar module
    would depend upon the serviceimpl.jar module. New implementations of the service
    would then necessitate modifying the client.jar module to create a new instance
    of the new implementation. The implementation mechanism you choose must avoid
    coupling modules unnecessarily.


