  md: "# 7.6 THIRD REFACTORING\n\nBecause cyclic dependencies are bad, we need to\
    \ remove the cyclic Acyclic Relationships dependency between the bill.jar and\
    \ audit.jar modules. To do this, we'll apply the Acyclic Relationships pattern,\
    \ which states that module relationships are acyclic. We introduce an additional\
    \ abstraction, called Auditable, that our Bill class implements. Upon applying\
    \ this little trick, we can see that we have removed the bidirectional relationship\
    \ between Bill and the AuditFacade interface, as shown in Figure 7.5.\n\nWhereas\
    \ previously the AuditFacade accepted a Bill to the audit method, it now accepts\
    \ an Auditable type. The new AuditFacade interface can be seen in the code snippet\
    \ in Listing 7.6.\n\n# Listing 7.6 AuditFacade Interface\n\n```\npackage com.extensible.java.audit;\n\
    import java.math.*;\npublic interface AuditFacade {\n    public BigDecimal audit(Auditable\
    \ auditable);\n}\n```\n\nThe Bill will pass itself to the AuditFacade interface\
    \ as an Auditable type. The key element at this point is how we allocate these\
    \ to their respective modules. Here's a simple rule to abide by when determining\
    \ how to allocate classes and interfaces to modules:\n\nInterfaces should be close\
    \ to the classes that use them and further from the classes that implement them.\n\
    \n![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_122_0.png)\n\nFigure 7.5 Acyclic relationships\
    \ between classes"
