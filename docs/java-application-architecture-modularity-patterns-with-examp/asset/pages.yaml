    \ and Listing 15.2 shows the MinimumPaymentScheduleCalculator.\n\nListing 15.1\
    \ The MonthlyPaymentCalculator in Scala\n\n```\npackage com.extensiblejava.calculator.scala\n\
    \nimport scala.math_\n\nclass MonthlyPaymentCalculator {\n  def calculatePayment(presentValue:BigDecimal,\n\
    \      rate:BigDecimal,\n      term:Int): BigDecimal = {\n    val dValue = currentValue.toDouble\n\
    \    val dRate = rate.toDouble / 1200\n\n    val revisedRate = dRate + 1;\n  \
    \  val dTerm = term.toDouble\n\n    val powRate = pow(revisedRate, dTerm)\n  \
    \  val left = powRate * dPresentValue\n    val middle = dRate / (powRate - 1)\n\
    \    val right = 1/(1);\n\n    val payment = BigDecimal(left * middle * right)\n\
