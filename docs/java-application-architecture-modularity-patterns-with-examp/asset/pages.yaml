  md: 'After we convert our modules to OSGi bundles, we''ll deploy them to an OSGi
    environment to see firsthand the benefits of a runtime environment that supports
    modularity. Throughout the following exercises, we''ll be sure to point out the
    relevant modularity patterns we''ve used and how they''ve helped us. As you''ll
    see, not only the modularity patterns provide guidance that help us create more
    modular software, but they also provide a vocabulary that allow us to communicate
    the design decisions we made.


    # 14.2 THE MANIFESTS


    The first thing we need to do is create the manifest files for each of our bundles.
    Let''s start with the loan-itrfc.jar module. Because loan-itrfc.jar has only incoming
    dependencies but no outgoing dependencies, it is a Level 0 module. The Levelize
    pattern informs us of this information.

    Because OSGi bundles interact only with the visible types of other OSGi bundles,
    we are required to export the packages that we want to make available to other
    OSGi bundle and import the packages that encapsulate the behaviors of other OSGi
    bundles. In this case, loan-itrfc.jar doesn''t depend on anything, we only have
    to define its exports. Listing 14.1 shows the bundle manifest for the loan-itrfc.jar
    bundle.


    +   Listing 14.1 Manifest.mf for loan-itrfc.jar Bundle


    ```

    Manifest-Version: 1.0

    Bundle-ManifestVersion: 2

    Bundle-Name: Loan Interface

    Bundle-SymbolicName: loaninterface

    Bundle-Version: 1.0.0

    Export-Package: com.extensiblejava.loan

    Spring-Context: *:timeout=-30

    ```


    The metadata contained in the Manifest.mf file in Listing 14.1 represents only
    a small subset of all the OSGi header information that you are able to express.
    For more information on all headers, see the OSGi specifications. Most important
    to us for this example is that we export'
