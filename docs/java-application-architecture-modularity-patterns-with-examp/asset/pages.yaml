    # 7.11.4 A Note on The Build


    The build was a key element in enforcing modularity. Even a framework such as
    OSGi is going to manage module relationships only at runtime. We talked about
    the design paradigm in Chapter 2, and it''s why we need really good tools that
    help us design more modular software. It''s responsibility to craft the modules,
    and the build is one to help put in a system of checks and balances that helps
    enforce modularity by discovering at runtime that one module has a relationship
    to another. As part of the third refactoring in Section 7.6, we could have easily
    refactored our build script to a Levelize build. If you look at the code in the
    Google code repository, you''ll notice how the build changes after we applied
    the Acyclic Relationships pattern.


    This means as we build each module, we include only the required modules in the
    build classpath. We speak about this this when discussing the Levelize Build pattern.
    To elaborate on this bit, we build the modules with fewer owing dependencies first,
    followed by those that are dependent on the modules previously built. For example,
    when we build the auditspec.jar module, we include nothing in the build classpath
    because the auditspec.jar module does not require anything. When we build the
    audit1.jar module, we''ll include only the auditspec.jar module in its build classpath.
    This pattern recurs throughout the remainder of the build scripts. Introducing
    a module dependency that violates the dependency structure enforced by the build
    results in a failed build.


