  md: '# 4.2 TECHNICAL DEBT


    Such phenomenal growth is not only expected but desired. We can only hope that
    the systems we create are in such high demand that we have the opportunity to
    grow them with new features and functionality over time. A software system that
    does not change dies. In fact, studies (Koskkinen 2010) suggest that the cost
    to maintain software and manage its evolution exceeds 90 percent of the total
    cost of a system. Evolution is a big deal!


    Not only is evolution expected, but it''s desirable. We''re in our best interests
    to encourage change in software systems. But, as we''ve seen, change breeds complexity.
    What is the cause of all this complexity, and what can we do to manage it?


    # 4.2 TECHNICAL DEBT


    Software tends to rot over time. When you establish your initial vision for the
    software''s design and architecture, you imagine a system that is easy to modify,
    extend, and maintain. Unfortunately, as time passes, changes trickle in that exercise
    you design in unexpected ways. Each change begins to resemble nothing more than
    another hack, until finally the system becomes a tangled web of code that few
    developers care to venture into. Sadly, design rot is self-licted, and technical
    debt describes the effect of rotting design.


    Technical debt is a metaphor developed by Ward Cunningham to describe the design
    trade-offs made in order to meet schedules and customer expectations. Martin Fowler
    offers the following analogy comparing technical debt to financial debt (2009):


    > Like a financial debt, the technical debt incurs interest payments, which come
    in the form of the extra effort that we have to do in future development because
    of the quick and dirty design choice. We can choose to continue paying the interest,
    or we can pay down the principal by refactoring the quick and dirty design into
    the better design. Although it costs to pay down the principal, we gain by reduced
    interest interest payments in the future.


    There are situations where leveraging suboptimal designs, thereby incurring technical
    debt, is warranted to meet short-term demands. For instance, the schedule may
    not allow longer-term designs to be used. However, if we ignore this debt, it
    continues to build over time, and incurring too much debt leads to significant
    inefficiencies surrounding our ability to effectively change the software system.
    Lehman''s Law in action, for sure.


    At some point, we hit a wall where we are no longer able to afford the interest
    payments. It''s imperative that we manage technical debt to ensure'
