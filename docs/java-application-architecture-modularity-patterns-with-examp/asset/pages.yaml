    # # IMPLEMENTATION VARIATIONS


    There are two ways to use standard Java to enforce restricting access to methods
    within a module:


    +   - Define a method as private within a class by using the private visibility
    modifier on the method definition.

    - Define a class as private within a package by using no visibility modifier on
    the class declaration.


    Each of these approaches has limitations if our desire is to allow all other classes
    within a module to invoke a method but prohibit access to the method from outside
    the module. Let''s see an example.


    In Figure 10.1, there is no way to enforce access to the public methods on the
    ServiceImpl class if we want to provide access to'
