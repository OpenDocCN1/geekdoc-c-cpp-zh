  md: '# LEVELIZE BUILD


    # LEVELIZE BUILD


    # STATEMENT


    Execute the build in accordance with module levelization.


    # DESCRIPTION


    An automated and repeatable build is a critical aspect to most successful development
    projects. First and foremost, an automated and repeatable build forces you to
    integrate early and integrate often, so you''re guaranteed to always have a system
    that works. Of course, you must follow a couple of rules:


    +   - Any compile error that ever creeps in must be immediately resolved. Because
    you should be using a version control system, the projects comprising your application
    should be free of any compilation errors.

    - Any unit test that fails must be immediately fixed. Unit and acceptance tests
    should be run after each change you make, and if you find that a test fails, you
    should treat this failure with the same urgency you give a compile error.


    Although pretty simple, these two rules are key elements because they are part
    of what defines an automated and repeatable build. So here, in order, are the
    characteristics of defining an automated and repeatable build:


    +   - It must be a clean build, meaning that no compiler-generated syntactical
    errors occur. While it''s acceptable to encounter certain warnings, such as those
    generated by deprecated method usage, you should strive to remove these warnings
    before future builds.

    - The build should be done using the most current version of all source files.
    There are occasions where you''ll want to compile older versions to revert to
    a previous version. Typically, when compiling these older versions, you''ll use
    the source files consistent with the version of the application you''re building.


    > Martin Fowler describes the five steps to a successful build in his seminal
    article on the topic, which can be found at http://martinfowler.com/articles/originalContinuousIntegration.html#WhatIsSuccessfulBuild.
    This list is a slight variation of the five steps.


    253'
