  md: '![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_200_0.png)


    **Figure 9.11** Container Independence


    # # IMPLEMENTATION VARIATIONS


    External Configuration can be used to configure a module so that it operates correctly
    in a specific runtime environment. In these situations, External Configuration
    is a pattern that is used to achieve Container Independence since the configuration
    dependencies are moved to an external configuration file. However, there are subtle
    differences between External Configuration and Container Independence. External
    Configuration is used to configure a module so that it can be used across contexts.
    Container Independence is leveraged to ensure a module is portable across containers.


    For instance, configuring a module with a user ID and password combination so
    that it can be used to access different database instances is an example of External
    Configuration, not Container Independence. Although it''s poor practice, hard-coding
    the user ID and password combination would not create dependencies on any runtime
    container, though obviously would limit the context in which the module could
    be reused.


    In many cases, developers do not need to roll their own code to abstract away
    the dependencies. Instead, a framework such as Spring is used. The most common
    mechanism to achieve Container Independence through dependency injection, where
    a module''s dependencies are injected at runtime. Many dependency injection frameworks
    also provide important infrastructure capabilities that help ensure the module
    remains container independent. For instance, in the following example'
