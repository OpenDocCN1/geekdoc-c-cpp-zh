    # 4.1 Enterprise Complexity


    Most software systems don''t begin their life as complex entities but grow complex
    over time. Lehman’s 2nd Law summarizes this phenomenon (1980):


    As a system evolves, its complexity increases unless work is done to maintain
    or reduce it.


    Lehman chose to use the evolution of IBM’s OS/360 for his work examining the growth
    of the system over a series of releases. His findings revealed that for each release,
    the size of the software system increased. The logical conclusion? As software
    system size increases, so does the complexity.


    Many of us have experienced this phenomenon. In almost every way, larger software
    systems are inherently more difficult to design, build, and manage than smaller
    software systems. Examining more modern evidence of Lehman’s Law, we turn to the
    evolution of the Spring framework. Figure 4.1 illustrates this evolution between
    release 0.9.1 and release 2.5. Since the earliest releases of the framework dating
    back to 2003, we’ve seen almost a sixfold increase in the size of the code. Examining
    other projects such as Linux, Tomcat, and Firefox reveals similar growth.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_75_0.png)


    **Figure 4.1** Evolutionary growth of Spring framework in lines of code'
