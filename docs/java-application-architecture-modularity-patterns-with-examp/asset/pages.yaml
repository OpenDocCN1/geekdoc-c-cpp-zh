    long-term survivability of our software system. Too much debt will cause the system
    to crumble. At some point, we must deal with the technical debt we''ve incurred.
    If we don''t, our design will continue to rot!


    # 4.3 DESIGN ROT


    The most common cause of rotting software is tightly coupled code with excessive
    dependencies. Of course, any interesting software system must have dependencies
    for it to do anything. Yet, for large teams and large applications, managing dependencies
    is especially important. Excessive dependencies increase technical debt and cause
    numerous problems. As Lehman''s Law suggests, the problems will persist and continue
    to increase unless work is done to maintain it. What exactly are the problems
    with excessive dependencies?


    # 4.3.1 HINDER MAINTENANCE


    Dependencies hinder the maintenance effort. When you''re working on a system with
    heavy dependencies, you typically find that changes in one area of the application
    trickle to many other areas of the application. In some cases, this cannot be
    avoided. For instance, when you add a column to a database table that must be
    displayed on the user interface, you''re forced to modify at least the data access
    and user interface layers. Such a scenario is mostly inevitable. However, applications
    with a well-thought dependency structure make change easier since developers have
    a more complete understanding of the impact of change.


    # 4.3.2 PREVENT EXTSIBILITY


    Dependencies prevent extensibility. The goal of flexible software architecture
    is to remain open for extension but closed to modification. The desire is to add
    new functionality to the system by extending existing abstractions and plugging
    these extensions into the existing system without making rampant modifications.
    One reason for heavy dependencies is the improper use of abstraction, and where
    abstractions are not present are areas that are difficult to extend. Abstraction
    aids teams by exposing well-defined extension points, as well as encapsulating
    implementation complexity.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 4.3.3 INHIBIT REUSABILITY


    Dependencies inhibit reusability. Reuse is often touted as a fundamental advantage
    of well-designed object-oriented software. Unfortunately, few applications realize
    this benefit. Too often, we emphasize class-level reuse. To achieve higher levels
    of reuse, careful consideration must also be given to the package structure and
    module structure. Software with complex package and module dependencies minimize
    the likelihood of achieving higher degrees of reuse.


    # 4.3.4 RESTRICT TESTABILITY


    Dependencies restrict testability. Tight coupling between classes eliminates the
    ability to test classes independently. Unit testing is a fundamental principle
    that should be employed by all developers. Tests provide you with the courage
    to improve your designs, knowing flaws will be caught by unit tests. They also
    help you design proactively and discourage undesirable dependencies. Heavy dependencies
    do not allow you to test software modules independently. Teams with few tests
    cannot respond to change easily because of the inability to access the impact
    of change.


    # 4.3.5 HAMPER INTEGRATION


    Dependencies hamper integration. It''s easy for separate teams to plow forward,
    usually under tremendous pressure from looming deadlines. They operate under the
    false assumption that if they can simply reach the final feature design, they
    can quickly pull things together toward the end of a project. This Big Bang approach
    to integration does not work. As individual modules are pulled together, common
    issues include degradation of overall system performance, incorrect levels of
    behavioral granularity provided by system modules, and transactional incompatibilities.
    More frequent integration brings many of these issues to the forefront earlier
    in the project.


