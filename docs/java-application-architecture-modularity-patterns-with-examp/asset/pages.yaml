  md: '# Praise for Java Application Architecture


    “The fundamentals never go out of style, and in this book Kirk returns us to the
    fundamentals of architecting economically interesting software-intensive systems
    of quality. You''ll find this work to be well-written, timely, and full of pragmatic
    ideas.”


    —Grady Booch, IBM Fellow


    “Along with GOF''s Design Patterns, Kirk Knoernschid''s Java Application Architecture
    is a must-own for every enterprise developer and architect and on the required
    reading list for all Paremus engineers.”


