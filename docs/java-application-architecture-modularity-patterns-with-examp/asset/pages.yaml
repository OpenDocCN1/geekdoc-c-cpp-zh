  md: '# CHAPTER 8    BASE PATTERNS


    In addition to deploying the same class in multiple modules, you want to avoid
    splitting packages² across modules. With split packages, the fully qualified package
    name spans modules, but the classes in the modules are different. Split packages
    are also difficult to manage and result in runtime issues with some module systems,
    such as OSGI.


    A good way to manage and enforce module dependencies is to use a Levelize Build.
    If you''re performing a Levelize Build, indirect dependencies not be included
    in a module''s build-time classpath, but they should still be included in the
    runtime classpath. Tooling can also help manage relationships between modules.
    Today, many IDEs help avoid cyclic relationships. Tools such as JarAnalyzer can
    help identify module relationships in an automated fashion.


    # CONSEQUENCES


    Excessive dependencies make modules difficult to maintain, reuse, and test. Modules
    with a lot of incoming dependencies are more difficult to change because they
    are used by multiple client modules. Because of this, it''s imperative that they
    undergo more thorough and rigid testing, and steps should be taken to minimize
    changes to these modules. Modules with a lot of outgoing dependencies are easier
    to change because they are used by fewer modules. Unfortunately, these modules
    are more difficult to test in isolation because of their dependencies on other
    modules.


    There are significant advantages to designing module relationships. They allow
    you to view the system from a perspective that is much different from what can
    be seen by browsing the class structure. A medium-sized application might consist
    of thousands of classes but may be composed of only a few dozen modules. Browsing
    these module relationships allows you to easily see how the system is structured.
    It''s an especially helpful way to see how changes impact other areas of the system.
    Knowing the module dependencies enables you to identify those classes that may
    be affected by changing a class in a dependent module.


    Understanding the relationships between modules makes it easier to isolate the
    impact of a change to specific modules, which is not something easily done at
    the class level. In Figure 8.1, changes to the client.jar module clearly indicate
    that the impact of change is isolated to the client.jar module. Likewise, changes
    to the service.jar module indicate the impact


