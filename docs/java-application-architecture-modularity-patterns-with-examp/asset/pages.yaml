  md: '# MODULE REUSE


    Module frameworks provide runtime support for managing different versions of a
    module. For instance, OSGi, each Java package can be assigned a version. You can
    deploy multiple versions of the same packages in separate modules, and other dependent
    modules can specify which version they require. There is no other way to effectively
    achieve this without a module framework that supports versioning.


    # CONSEQUENCES


    Emphasizing reuse at the module level offers a much greater probability that you
    will succeed in your reuse efforts. However, the dream of assembling complete
    applications from prebuilt modules is still difficult to achieve. Organizational
    change will always dictate that software is customized, and it''s unlikely that
    organizations within an industry will highly standardize their business processes
    since this standardization can eliminate a company''s competitive advantage. As
    the business processes change, so too must the modules that support them. All
    software systems are in a constant state of evolution. However, a use of robust
    modules will help an organization deliver software more quickly. The ability to
    assemble these modules, add to them, and build custom software on top of them
    will help an organization achieve and sustain their competitive advantage.


    Maximizing the reuse of a module usually means creating smaller modules that do
    less. This can make module management a difficult task. Contrarily, larger modules
    that do more will be easier to manage but may not be reusable. It can be very
    difficult to balance these two competing agendas. I have found that early in the
    development life cycle, the software is still in a dynamic state, larger modules
    tend to be easier to manage. As distinct areas of reuse are identified, these
    larger modules can be broken into smaller, more reusable modules. Attempting to
    define smaller fine-grained modules earlier in the life cycle is difficult since
    you are forced to guess the functionality of a module. This is usually a lost
    cause.


