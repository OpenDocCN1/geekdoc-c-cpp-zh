  md: '# FOREWORD BY PETER KRIENS


    can now be expressed on packages, reducing the need to “download the Internet.”
    This isolation provides an internal namespace for a module that is truly local
    to the module, and it allows multiple namespaces so that different versions of
    a package can be supported in the same system. The problems at this level are
    usually caused by popular Java patterns based on dynamic class loading that are
    rarely compatible with module boundaries and multiple namespaces.


    The fourth level starts when the code base is modified only for the purpose of
    maximizing cohesion and minimizing coupling. There is increased awareness that
    a single line in the code can actually cause an excessive amount of dependencies.
    Combining or separating functions can have a significant influence on how the
    system behaves during deployment. At this level the existing Java patterns become
    painful to use because they often require central configuration, while the solutions
    seem to indicate a more equal peer-to-peer model. In OSGi, uServices become very
    attractive since they solve many problems.


    At level 5, the last level, the modules become less important than the uServices
    they provide. Design and dependency resolution is now completely by uServices;
    modules are just containers that consume and provide u.


    In the past 13 years I’ve lived and breathed level 5 as it is implemented in OSGi.
    This sometimes makes it hard to empathize with people who have used only the classpath
    and simple JARs. Looking at Graham Charter’s presentation, I realized that Kirk’s
    ambition is to help people understand the importance of modular design principles
    and move them from level 1 to level 2, ultimately giving them a solid foundation
    to achieve even greater maturity with OSGi. I realize that I often tried to drag
