  md: 'Look at the auditspec.jar module. Note that it has eight incoming dependencies
    (afferent coupling) and zero outgoing dependencies (efferent coupling). Its abstractness
    is 0.67, and its instability is 0.00. This is a good sign. Why? Its instability
