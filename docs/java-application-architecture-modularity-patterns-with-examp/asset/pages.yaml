  md: '# CHAPTER 9 DEPENDENCY PATTERNS


    impact these dependencies have on maintainability and reusability. Finally, the
    coupling caused by a cyclic dependency has severe implications.


    Whenever a dependency exists between two modules, the impact of change is increased.
    If the two modules have a cyclic dependency, the ripple effect of change is dramatically
    increased. Changing one module may cause changes to all dependent modules, which
    in turn can cause a dramatic ripple effect throughout the application, and potentially
    across, applications. Because of this, modules with a cyclic dependency come with
    the same maintenance and reuse attributes of a single module. One can never be
    reused, built, deployed, or maintained without the other module.


    Any set of modules with a direct or indirect cyclic relationship inevitably be
    less reusable. To use the contents of one module, you also require the behavior
    of all modules it is dependent upon. Finally, cyclic relationships inhibit stability
    since modules involved in a cyclic dependency cannot be testing independently.


    Breaking the dependency cycles in your module structure allows you to leverage
    a number of other patterns. You can levelize your modules. Any cycles in the dependency
    structure prevents you from leveling your application. Levelization allows you
    to perform a leveled build and enforce your module relationships. Levelization
    also facilitates testing by allowing you to create a Test Module that can verify
    your modules in isolation.


