  md: '# DEPENDENCY INVERSION PRINCIPLE (DIP)


    overridden subclass method that is at a lower level of abstraction than the exception
    thrown in the ancestor. While this does not correspond directly to the concept
    of preconditions and postconditions, it does capture the essence. Therefore, we
    can state that any precondition stipulated by a subclass method cannot be stronger
    than the base class method. Therefore, any postcondition stipulated by a subclass
    method cannot be weaker than the base class method.


    To adhere to LSP in Java, we must make sure that developers define preconditions
    and postconditions for each of the methods on an abstract class. When defining
    our subclasses, we must adhere to these precepts and postconditions. If we do
    not define preconditions and postconditions for our methods, it becomes virtually
    impossible to find violations of LSP. Suffice it to say, in the majority of cases,
    OCP will be our guiding principle.


    # DEPENDENCY INVERSION PRINCIPLE (DIP)


    Depend not depend upon concretions.


    The Dependency Inversion Principle (DIP) formalizes the concept of abstract coupling
    and clearly states that we should couple at the abstract level, not at the concrete
    level. Abstract coupling is the notion that a class is not coupled to another
    concrete class, or class that can be instantiated. Instead, the class is coupled
    to other base, or abstract, classes. In Java, this abstract class can be either
    a class with the abstract modifier or a Java interface data type. Regardless,
    this concept is actually the means through which LSP achieves its flexibility,
    the mechanism required for DIP, and the heart of OCP.


    In our own designs, attempting to couple at the abstract level can at times seem
    overkill. Pragmatically, we should apply this principle in any situation where
    we are unsure whether the implementation of a class may change in the future.
    We have encountered situations during development where we know exactly what needs
    to be done. Requirements state this very clearly, and the probability of change
    or extension is quite low. In these situations, adherence to DIP may be more work
    than the benefit realized.


