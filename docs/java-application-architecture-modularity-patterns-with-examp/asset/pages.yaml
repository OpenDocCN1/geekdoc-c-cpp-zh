    # CONSEQUENCES


    Test modules increase instability by allowing you to test modules independent
    of each other. Once a module functions correctly as an independent unit, any error
    is the result of integration with other modules. A Test Module allows you to ensure
    that a module works correctly as a standalone entity. Application-level integration
    tests can be helpful in the situation where you test module integration.


    Creating a robust suite of tests has other significant advantages. A Test Module
    helps you design your system. Because modules should be independently testable,
    a natural byproduct of a Test Module is that you''ll emphasize managing module
    dependencies. When refactoring your code or adding new functionality to an existing
    code base, a suite of tests can be repeatedly run to guarantee that your changes
    haven''t broken anything once worked. A Test Module also helps you understand
    the Published Interface of a module, since it''s the interface Test Module verifies.


    Because you will always run the risk that changes can break the system cases.
    A Test Module allows you to guarantee that if a change breaks an individual module,
    it will be caught quickly because it''s easy to execute the Test Module as a regression
    test.


    Other types of Test Module can also be useful. A design test allows you to make
    assertions about the design metrics of the system. Tools as JarAnalyzer can be
    used to create tests that check for dependencies between modules. Performance
    tests allow you to verify the response time of a test. Structuring your test cases
    into test modules may allow you to effectively organize the different suites of
    test cases that you want to run.


