    Using standard Java, the easiest way to prevent external classes from accessing
    a class or method you do not want is to use interfaces. The interface defines
    methods you want to expose, while the implementation within the module can define
    additional public methods. Users of the module should interact with the interface,
    not the implementation. Without casting, the module''s user will not be able to
    invoke these methods on the implementing class. This allows you to, to a certain
    extent, hide public methods that you do not want invoked outside of the module
    since users will not know the concrete type of the class they are working with.
    Of, with some investigative digging, they can always find out the name of the
    implementing class, and there isn''t much you can do to enforce access restriction.


    The strongest way to enforce access restriction is to define implementation classes
    at package scope. These implementation classes then implement an interface that
    is referenced by external module users. Unfortunately, this strongest form of
    enforcement is not always feasible, given that other packages within the module
    may need to reference the implementing class to invoke its methods or create instances.
    However, it''s a good idea to begin with this approach and then loosen it access
    as the needs demand.


