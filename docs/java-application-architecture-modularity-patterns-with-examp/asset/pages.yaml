  md: '# 7.7 FOURTH REFACTORING


    # 7.6.1 WRAPPING UP AND GETTING READY FOR THE FOURTH REFACTORING


    Since our last recap in Section 7.4.1, we applied two separate refactorings. The
    first was to separate the bill and audit functionality into separate modules.
    The second was to remove the cyclic dependency between the bill and audit modules.
    This offers us such decent flexibility. We can introduce a new AuditFacade implementation,
    knowing that we''d need to rebuild only the audit.jar module. We can test the
    audit.jar module independent of any other module because it doesn''t have any
    outgoing dependencies. And if we wanted, we could deploy the audit functionality
    separately (in other words, we can reuse it elsewhere). So, overall we''ve made
    some decent progress.


    reuse, 61

    Test Module

    pattern, 263


    However, some problems remain. If we really want the ability to swap audit systems,
    bundling the AuditFacade interface and AuditFacade into the same module doesn''t
    give us the flexibility we need. Although we can easily create a new AuditFacade
    implementation and allocate it to the audit.jar module, this requires us to redeploy
    audit.jar unnecessarily. In the next refactoring, we explore how we can change
    the module structure to allow a new AuditFacade implementation while also allowing
    the existing AuditFacade implementation to be removed from the system and allowing
    a new module to be deployed. To recap, thus we''ve applied the following patterns:


    +   - Physical Layers

    - Abstract Modules

    - Acyclic Relationships


    Although we haven''t specifically mentioned it, we could easily apply the following
    patterns:


    +   - Levelize Modules

