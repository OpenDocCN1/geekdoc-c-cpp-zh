    benefits. But, the greatest benefit of modularity-is that it helps us tame the
    complexity of a software system as it evolves. By taming complexity, it’s much
    easier to understand the impact of change within large software systems. Because
    90 percent of the total cost of a system involves making change to an existing
    system, this is a substantial benefit. Modularity is the work we do to help manage
    the complexity of a system as it evolves. It’s time for an example that illustrates
    this benefit.


