  md: '# 6.2.5 A Service Example


    Let''s re-visit the simple example we began discussing in Chapter 5, Section 5.2.1.
    Say that I have a business function called Pay Bill for which I develop a Web
    service that can be invoked by many different consumers. That service happens
    to be relatively coarse-grained and performs all the steps involved in paying
    the bill. These happen to include the following:


    +   - Audit bill: Apply a discount to the bill based on payee.

    - Check for duplicate: Ensure the bill hasn''t already been paid.

    - Remit payment: Cut the check.

    - Reconcile payment: Reconcile with accounts payable financials.


    This seems reasonable. We have a nice little service that we can reuse any time
    we want to pay a bill. Unfortunately, the real often gets in the way of our idealistic
    solutions. In fact, two problems will eventually surface, and modularity benefits
    both scenarios. Let''s start looking at the first scenario:


    > What should I do when a different scenario arises that demands I follow a slightly
    modified Pay Bill workflow?


    As part of the remit step, I have a new payee that demands electronic payment.
    This is pretty easy, actually. I simply modify the service to support electronic
    payments and then configure the service to context for that specific payee. So,
    how does modularity help here?


    If the service is composed of modules, it''s going to be much easier for me to
    understand the structure of the service, assess the impact of what it''s going
    to cost to change the service, and then introduce a new module (or modify the
    existing module) to provide that capability. Without modules, I''m simply wading
    through the code trying to figure out all of these things. Now, here''s the second
    scenario:


