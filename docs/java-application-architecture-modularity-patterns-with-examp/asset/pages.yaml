    # 1.1.2 MANAGEABLE


    Modules are a unit of management. In the presence of a runtime module system,
    software modules can be installed, uninstalled, and refreshed. During development,
    partitioning a system into modules help ease a number of otherwise complicated
    activities. This includes improving build efficiency, allowing developers to independently
    develop autonomous modules, and planning the development effort along module boundaries.
    Examples of software entities that comply with this segment of the definition
    include EAR, WAR, and JAR files.'
