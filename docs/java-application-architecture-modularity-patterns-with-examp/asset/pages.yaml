  md: '# CHAPTER 3 ARCHITECTURE AND MODULARITY


    All architecture is design but not all design is architecture. Architecture represents
    the significant design decisions that shape a system, where significant is measured
    by cost of change.


    Based on these statements, it''s fair to conclude that the goal of software architecture
    must be to eliminate the impact and cost of change, eliminating architectural
    significance. We attempt to make something architecturally insignificant by creating
    flexible solutions that can be changed easily, as illustrated in Figure 3.3. But
    herein lies a paradox.


    # 3.3.1 THE PARADOX


    The idea behind eliminating architecture isn''t new. In fact, Fowler mentions
    “getting rid of software architecture” in his article “Who Needs an Architect?”
    (2003). The way to eliminate architecture by minimizing the impact of cost and
    change is through flexibility. The more flexible the system, the more that the
    system can adapt and evolve as necessary. But herein lies the paradox, and a statement
    by Ralph Johnson presents and supports the idea (Fowler 2003):


    > ... making everything easy to change makes the entire system very complex...


    As flexibility increases, so does the complexity. And complexity is the beast
    we are trying to tame because complex things are more difficult to deal with than
    simple things. It''s a battle for which there is no clear path to victory, for
    sure. But, what if we were able to tame complexity while increasing flexibility,
    as illustrated in Figure 3.4? Let''s explore the possibility of designing flexible
    software without increasing complexity. Is it even possible? In other words, how
    do we eliminate architecture?


