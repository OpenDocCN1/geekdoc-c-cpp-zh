  md: '# Wrapping Up


    Developing systems with a modular architecture is tenuous. On one hand, developers
    strive to create fine-grained and lightweight modules that are highly reusable.
    On the other hand, developers want to ensure that modules are easy to use across
    a wide variety of contexts. A Module Facade allows developers to create a coarse-grained
    and heavyweight module that configures and coordinates the activities of a group
    of lightweight and fine-grained modules, allowing developers to strike the right
    balance between reuse and use.'
