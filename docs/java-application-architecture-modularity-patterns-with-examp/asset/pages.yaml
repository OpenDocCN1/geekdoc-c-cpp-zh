    Levelization can serve as the foundation for an enterprise reuse strategy. Look
    at it this way: If modules are leveled, lower-level modules are inherently easier
    to reuse because they have no outgoing dependencies. Because they have no outgoing
    dependencies, we can build modules independent of the rest of the system. This
    separate build means that the module can evolve independently. Development of
    the module can exist outside the context of the application, in parallel with
    other modules. Each time the module is built, it can be included as part of the
    application.


    reuse versus 62


    # SAMPLE


    As mentioned, levelizing modules is slightly different than physical layers. Figure
    9.7 illustrates this difference. As shown, the levels do not necessarily coincide
    with layers. At least, a single layer isn''t necessarily confined to contain a
    specific set of levels. The billpayutils.jar module is in the control layer based
    on the set of responsibilities it provides. However, it lacks dependency on any
    level 3 or level 4 modules in the domain layer. Even though the billpayutils.jar
    module is in the control layer and it''s a level 2 module, its only dependency
    is on the level 1 dbutils.jar module.


    Because the modules are leveled, we now have the opportunity to perform a levelized
    build, and we can more understand build order. The level 1 dbutils.jar module
    must be built first. Finished, possibly as part of a completely separate build,
    the builddata.jar and findata.jar modules can be built. Yet, so too, can the billutils.jar
    module, even though it''s in the Control Layer. Unless we understand module levelization,
    the opportunity to maximize the efficiency of the build may be lost.


    # WRAPPING UP


    Levelize Modules squarely between Acyclic Relationships and Physical Layers. If
    the module structure is acyclic, then module relationships can be leveled. Levelization
    helps you understand the dependency structure of the application, and its benefits
    include build optimization, reuse, ease of testing, and a clear understanding
    of system structure.


    160'
