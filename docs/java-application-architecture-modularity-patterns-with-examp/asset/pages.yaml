  md: '# MANAGE RELATIONSHIPS


    # STATEMENT


    Design module relationships.


    # DESCRIPTION


    A relationship between two modules exists when a class within one module imports
    at least one class within another module. In other words:


    If changing the contents of a module, M2, may impact the contents of another module,
    M1, we can say that M1 has a Physical Dependency on M2 (Knoerschild, 2001).


    Figure 8.1 shows a diagram and the accompanying code that illustrates the different
    types of module dependencies.


    In general, a module having incoming dependencies, outgoing dependencies, or a
    combination of each. Incoming dependencies are present when a module has other
    modules dependent on the classes it contains. Outgoing dependencies are present
    when a module is dependent on classes in one or more other modules. As shown in
    Figure 8.1, the client.jar module has only outgoing dependencies, the subsystem.jar
    module has only incoming dependencies, and the service.jar module on the right
    portion of the diagram has both.


    A module''s dependencies can also be direct or indirect. Indirect dependencies
    are also known as transitive dependencies. Direct dependencies, where a client
    module depends directly on a service module, are most straightforward. The left
    portion of Figure 8.1 illustrates a direct dependency.


    Indirect, or transitive, dependencies involve at least three modules, where a
    service module is also a client module that is dependent on some other module.
    The module diagram shown on the right side of Figure 8.1 illustrates an indirect
    dependency, where the service module is a client module of the subsystem module
    and a service module to the client module. Here, the client module has an indirect
    relationship to the subsystem module, and if something changes in the subsystem
    module, it may ripple through the other two modules.'
