  md: '# FOREWORD BYnROBERT C. MARTIN


    I''m dancing! By God I''m dancing on the walls. I''m dancing on the ceiling. I''m
    ecstatic! I''m overjoyed. I''m really, really pleased.


    “Why?” you ask. Well, I''ll tell you why—since you asked. I''m happy because somebody
    finally read John Lakos''s book!


    Way back in the 1990s, John Lakos wrote a book entitled Large-Scale

    ++ Software Design. The book was brilliant. The book was groundbreaking.

    The book made the case for large-scale application architecture and

    made it.


    There was just one problem with John''s book. The book had “C++” in

    title and was published just as the software community was leaping to

    Java. And so the people who really needed to read that book didn''t read it.


    Ah, but then the people doing Java back then weren''t reading any books

    on software design, because they were all 22 years old, sitting in Herman-

    Miller office chairs, hacking Java, day trading, and dreaming of being bil-ionaires
    by the time they were 23. Oh, God, they were such hot stuff!


    So, here we are, more than a decade later. We''ve matured a bit. And

    we''ve failed a bit. And our failures have winnow and seasoned us. We

    now look back at the wasteland of Java architectures we created and grim. Could
    we have been so naive? How could we have lost sight of

    the principles of Jacobson, Booch, Fowler, and Lakos? Where

    did we go wrong?


    I''ll tell you where we went wrong. The Web bamboozled us. We all

    got Twitterated. We thought the Web was revolutionary. We thought the'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# FOREWORD BY ROBERT C. MARTIN


    Web changed everything. We thought the Web made all the old rules irrelevant.
    We thought the Web was so new, revolutionary, and so game-changing that we ignored
    the rules of the past.


    And we paid. Oh, God, how we paid. We paid with huge, unmanageable designs. We
    paid with tangled, messy code. We paid with misguided directionless architectures.
    We paid with failed projects, bankrupt companies, and broken dreams. We paid,
    and we paid, and we paid.


    It took 15 years, and we''ve just begun to realize why. We''ve just begun to see
    that the Web is just another delivery mechanism, no different from all the others—reincarnation
    of the old IBM green-screen request/response technology. It was just plain old
    software after all, and we should have never abandoned the rules of the game.


    Now we can see that we should have stuck to the wisdom of Parnas, Weinberg, Page-Jones,
    and DeMarco all along. We should never have walked away from the teachings of
    Jacobson and Booch. And we should have read that damn book by Lakos!


    Well, somebody did read that book. And he must have read a few, too, because he''s
    written a book that states the rules of the Java architecture better than I''ve
    seen them stated before. You''re holding that book in your hands right now. The
    man who wrote it is Kirk Knoernchild.


    In this book Kirk has gone beyond Lakos, beyond Jacobson, beyond Booch. He has
    taken the principles of those past masters and created a brilliant synthesis of
    principles, rules, guidelines, and patterns. This is how you build a Java application,
    people.


    Go ahead and flip through the pages. Notice something? Yeah, no fluff! It''s all
    hard-core. It''s all right to the point. It''s all pragmatic, useful, necessary!
    It''s all about the nuts and bolts of Java applications—the way it should be:
    modular, decoupled, levelized, independently deployable, and smart.


    If you are a Java programmer, if you are a tech lead or a team lead, if you are
    an architect, if you are someone who wants and needs to make a difference in your
    software development team, read this book. If you want to avoid repeating the
    tragedy of the last 15 years, read this book. If you want to learn what software
    architecture is really all about, read this book!


    —Uncle Bob.


    35,000 feet over the Atlantic

    October 1, 2011'
  merge: -1
  pgno: 21
