- img_proc: true
  md: '# CHAPTER 12 UTILITY PATTERNS


    +   - A clean build implies that all application source files are compiled. Conditional
    compiles or partial builds do not prove the syntactical correctness of the entire
    application. You do not need to compile existing binary modules.


    +   - The build should generate all files representing the units of deployment.
    For Java applications, this means all .jar, .war, and .ear files should be created.


    +   - The build should verify that the application is functionally correct, meaning
    all unit tests for the application should be run. If all unit tests pass successfully,
    the build is successful.


    A rather significant aspect of an automated and repeatable build is that it be
    separated and performed outside the confines of your favorite integrated development
    environment (IDE). Most IDEs allow you to perform conditional compiles, as well
    as compiles within the environment. Performing the build within an IDE leaves
    too many loopholes for individual developers to produce inconsistent results.
    In fact, without a repeatable build script, it would be very difficult to enforce
    the module relationships that compose your application.


    The most common manifestation of an automated and repeatable build is a full classpath
    build, where all source files are compiled as part of the same target. Since all
    source is included within a single build step, you are also required to include
    all dependent modules in the classpath of that target. In doing so, you lose your
    ability to enforce module dependencies as part of the build process, and the module
    dependencies that you expect may not be entirely accurate. There is no way to
    enforce your module dependency structure.


    When you leverage your build, however, it allows you to build module independently
    as part of a module specific target, where each target has its own build classpath.
    Because each target specifies its own classpath, you are required only to include
    dependent modules for the source being instead of all modules for the complete
    application. Any developing a dependency on a module not in the target''s classpath
    will cause a compilation error to occur when the build process executes, essentially
    enforcing your desired module dependencies.


    Levelize Modules pattern, 157

    Acyclic Relationships pattern, 146


    Levelize Build can be performed only if modules themselves have been levelized
    and all relationships between modules are acyclic. Cycles existing between any
    two modules will require that each module be built at the same time. Given any
    two or more modules, if a cycle exists in the'
