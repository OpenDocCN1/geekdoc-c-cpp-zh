  md: '# LEVELIZE MODULES


    # LEVELIZE MODULES


    # STATEMENT


    Module relationships should be levelized.


    # DESCRIPTION


    Levelizing modules² demands that module relationships be acyclic. Any cycles in
    module relationships prevent levelization. There is a close relationship between
    levelized modules and Physical Layers, though the two are not the same. Physical
    Layers aims to create one or more modules that are functionally equivalent to
    the typical layers composing an application. Levelized modules are more fine-grained
    than physical layers. Although a typical software system may have only three or
    four layers, within each layer there might be multiple levels.


    To levelize modules, follow these guidelines:


    +   - External modules are assigned level 0.

    - Modules dependent only on level 0 modules are assigned level 1.

    - Modules dependent on level 1 are assigned level 2.

    - Modules dependent on level n are assigned level n + 1.


    Figure 9.6 shows levelized modules. Even though the topclient.jar depends on client.jar,
    a level 1 module, topclient.jar also depends on the midlevel.jar module, which
    is a level 2 module. Because of this, the topclient.jar module is a level 3 module.
    More generally, if a module is dependent on an n-1 level module, the module is
    an n level module, even if it''s also dependent on modules lower in the hierarchy.


    # IMPLEMENTATION VARIATIONS


    Levels and layers, what''s the difference? Layers have much more to do with responsibility,
    whereas levels have much more to do with understanding the system structure, especially
    the dependencies. Levels are more granular than layers. Within a single layer,
    there might be multiple levels, but multiple layers can never exist at a single
    level.


    > 2. Levelization is a term introduced in John Lakos''s Large-Scale C++ Software
    Design (1996).


    157'
