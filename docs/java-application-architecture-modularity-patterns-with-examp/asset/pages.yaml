  md: '# CHAPTER 10 USABILITY PATTERNS


    # MODULE FACADE


    # STATEMENT


    Create a facade serving as a coarse-grained entry point to another fine-grained
    module''s underlying implementation.


    # DESCRIPTION


    We create fine-grained and lightweight modules to increase module reuse. Unfortunately,
    fine-grained modules can also be difficult to use because the user must understand
    the API of several different modules and use them in conjunction with each other
    to accomplish a particular task. Additionally, lightweight modules must also be
    configured to an environmental context. Because of this, fine-grained and lightweight
    modules are generally more difficult to use.


    A Module Facade is useful to provide a higher-level API that coordinates the work
    of a set of fine-grained modules. The Module Facade emphasizes usability, whereas
    the underlying fine-grained modules emphasize reusability. Figure 10.9 illustrates
    a Module Facade.


    # IMPLEMENTATION VARIATIONS


    Oentimes, configuring fine-grained modules can be a burden, especially when multiple
    fine-grained modules are used in conjunction but forces prevent module designers
    from combining the fine-grained module into a single coarse-grained entity. In
    these situations, a Module Facade can be used to expose a subset of the functionality
    contained within a group of fine-grained modules. A Module Facade allows a group
    of fine-grained modules to operate as a coarse-grained module.


    A Module Facade is useful to encapsulate the configuration for a group of fine-grained
    and lightweight modules. With a Module Facade, we are able to maintain the balance
    between creating fine-grained and lightweight modules that are highly reusable
    while also providing an easy way for developers to use a group of modules. By
    encapsulating configuration information in a Module Facade, developers don''t
    need to worry about knowing how to configure a module.


    Multiple facades might exist for a group of lightweight and fine-grained modules.
    In many ways, this is similar to the separation we try'
