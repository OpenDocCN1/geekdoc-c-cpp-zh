    a module is a software component. Developing a system with an adaptive, flexible,
    and maintainable architecture requires modularity because we must be able to make
    temporal decisions based on shifts that occur throughout development. Modularity
    has been a missing piece that allows us to more easily accommodate these shifts,
    as well as focus on specific areas of the system that demand the most flexibility,
