    # CONSEQUENCES


    Separate Abstractions pattern, 237


    Most modules will have a default implementation. Without any implementation, a
    module is essentially only a specification and requires us to provide our implementation
    any time we want to use the module. Certainly this is useful in some cases, especially
    when Separate Abstractions is desirable.


    Abstract Modules pattern, 222


    Default Implementation is one way to develop a plug-in architecture. The module
    containing the default has extension points that are pluggable. In Figure 10.7,
    it is possible to plug alternative behaviors into the default.jar module and then
    configure the module appropriately based on the new implementation. In other words,
    the default implementation is the implementation of the interfaces within a module.
    If this is an Abstract Module with no other modules dependent upon the implementation
    classes, we can provide new implementations of the abstractions that are plugged
    into the module at runtime.


    Failure to accommodate both behavior and configuration when creating a default
    implementation will compromise the integrity of the system. It''s relatively easy
    to create the extension points by implementing the necessary interfaces, but a
    way to configure the module is also very important.


