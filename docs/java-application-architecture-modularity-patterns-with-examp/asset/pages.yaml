  md: '# 3.5 ANSWERING OUR QUESTIONS


    The design could have also been made even more flexible by packaging the Impl
    class and Inter interface in separate modules. By separating the interface from
    the implementation, we bring a great deal of flexibility to the system, especially
    with OSGI managing our modules.


    At first glance, it might also appear to contradict the External Configuration
    pattern. However, we still want to ensure implementation details are encapsulated.
    External configuration is more about allowing clients to configure a module to
    its environmental context and not about exposing implementation details of the
    module.


    The takeaway from this simple demonstration is that the classes in the provider.jar
    module are tightly encapsulated because the OSGI framework enforces type visibility.
    We expose only the public classes in the packages that a module exports, and the
    uService is the mechanism that allows modules to communicate in a very flexible
    manner. The uService spans the joints of the system, and because OSGI is dynamic,
    so are the dependencies on uServices. Implementations of the uService come and
    go at runtime, and the system can bind to new instances as they appear.


    Again, we''ll see several more examples of this throughout the remainder of the
    discussion. Even though you can''t enforce encapsulation of module implementation
    using standard Java, it''s still imperative to begin designing more modular software
    systems. As we''ll see, by applying several of the techniques we discuss in this
    book, we put ourselves in an excellent position to take advantage of a runtime
    module system.


    # 3.5 ANSWERING OUR QUESTIONS


    Earlier, this chapter posed the following questions after introducing the three
    definitions of software architecture. Through explanation, we answered each question.
    To be clear, let''s offer concise answers:


    +   What makes a decision architecturally significant? A decision is architecturally
    significant if the impact and cost of change is significant.


    +   What are the elements of composition? The elements of composition include
    classes, modules, and services.


    +   How do we accommodate evolution of architecture? Evolution is realized by
    designing flexible solutions that can adapt to change.'
