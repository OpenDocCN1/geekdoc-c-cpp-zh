  md: 'effectively as possible because modules with incoming and outgoing dependencies
    present testing, maintenance, and deployment challenges. Cyclic relationships
    should be avoided at all costs. Abstract Modules and Separate Abstractions can
    help you manage module dependencies.


    Separate Abstractions Pattern, 237


    # Packaging and Build


    With Java, a service module must be included in the classpath of the client module.
    Failing to do so will result in a compile error. If the client module references
    a class in the service module at runtime, then the service module must also be
    included in the runtime classpath. There are some situations in Java where the
    required build and runtime dependencies differ at compile time. A client module
    may reference a class in a service module at runtime, but if the code isn''t executed
    at runtime, the Class-Loader won''t require the service module at runtime. It''s
    a dangerous practice to ignore runtime dependencies that are required build-time
    dependencies because ClassNotFoundException might arise if a class is referenced
    in a module not found on the runtime classpath.


    Levelize Build pattern, 253


    A Test Module can be created for each module that allows you to test a module
    in isolation, helping to ensure the module''s correctness. Including the Test
    Module as part of an automated build process will allow you to verify the functionality
    of the module immediately after compilation to help you identify any runtime issues.


    Test Module pattern, 263


    Java does not enforce that a fully qualified class be in a single module. In fact,
    there are some situations where this is violated. For instance, the javax.servlet.http.HttpServletRequest
    class can be found in both the j2ee-jar and servlet-api.jar files. You should
    exercise caution before placing the same fully qualified class in two different
    modules. First, if you are compiling with one JAR file and deploying with another,
    you run the risk of inconsistent versions. Your application may compile with the
    correct version, but experience runtime problems if the deployed JAR file contains
    classes from a different version. Second, only one version of a class can be deployed
    if the two different versions are loaded by the same ClassLoader. If you deploy
    multiple versions of a class, you''ll risk a ClassCastException at runtime if
    the same ClassLoader attempts to load both classes. This can be an especially
    tricky problem to debug. So, while it is possible to bundle a class in multiple
    modules, I''d recommend against the practice.'
