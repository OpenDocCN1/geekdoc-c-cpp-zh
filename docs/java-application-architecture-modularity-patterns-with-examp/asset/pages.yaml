  md: 'there is a tension between rate of change and reuse, and we must consider the
    following combinations:


    +   - Classes within a module that change at the same rate and are reused together


    +   - Classes within a module that change at a different rate and are reused together


    +   - Classes within a module that change at the same rate and are not reused
    together


    +   - Classes within a module that change at a different rate and are not reused
    together


    The first and fourth scenarios are the easiest to accommodate. When classes change
    at the same rate and are reused together, it is logical that they belong to the
    same module. Likewise, classes that change at different rates and are not reused
    together belong in separate modules. The final two scenarios, which tend to be
    most common, are also the most challenging.


    Fortunately, the natural shifts that occur throughout the development life cycle
    provide insight to dealing with the second and third scenarios and encourage us
    to emphasize one of these aspects more than the other. Early in the development
    life cycle, when the system is volatile and change is rampant, packaging the classes
    based on rate of change should supersede packaging based on reuse. As the system
    stabilizes, we should focus on packaging the classes based on reuse since the
    rate of change is much less.


    # CONSEQUENCES


    Some key difficulties arise when modules suffer from low cohesion including the
    inability to understand the software system and difficulty maintaining the software
    system. Reusing modules that lack cohesion is also difficult. Module consumers
    rarely need all of the random behaviors provided by modules lacking cohesion,
    and the random behaviors often increase dependencies on other modules. In general,
    modules that lack cohesion degrade the overall quality of a software system''s
    architecture.


    Early in the development life cycle, when change is rampant, we are encouraged
    to package classes into more coarse-grained modules. This is logical. Because
    change is rampant and widespread, packaging into coarse-grained modules means
    less module management as'
