  md: '# # MODULE

    DEFINED


    First, we need to answer a simple question:


    What is a software module on the Java platform?


    # ## I.I DEFINING A MODULE


    A module is simply a "chunk of software." Unfortunately, that’s not concise enough
    to differentiate a module from other software chunks, such as classes, packages,
    components, services, or even applications. So, we need to focus on this definition:


    > A software module is a deployable, manageable, natively reusable, composable,
    stateless unit of software that provides a concise interface to consumers.


    That’s a mouthful, and I feel bad about dumping this on your first chapter. But
    after some explanation, you’re sure to grasp what a module is. Figure 1.1 illustrates
    this definition. Next, you explore the individual elements of a module.


    # ### I.I.1 DEPLOYABLE


    Modules are a unit of deployment. Unlike other software entities, such as classes
    and packages, a module is a discrete unit of deployment that can go'
