  md: '# INTRODUCING OSGI


    OSGI is the dynamic module system for the Java platform. It is a standard specification
    that is developed by a consortium of industry vendors and managed by the OSGI
    Alliance. OSGI is a mature and stable specification. In fact, most application
    platforms now allow enterprise developers to leverage OSGI in building their own
    enterprise applications. This chapter introduces the fundamentals of OSGI, discusses
    its advantages, and briefly explores the patterns in the context of OSGI.


    For years, OSGI technology has flourished in the embedded systems and networked
    devices market. Until recently, it remained a relatively obscure technology for
    the enterprise developer. Today, OSGI is emerging as a viable and valuable technology
    in the enterprise.


    # 13.1 Some History


    In 2003, the Eclipse team began looking for ways to make Eclipse a more rich client
    platform and increase the platform’s modularity. Eventually, the team settled
    on the OSGI framework as the runtime module system (code-named the project Equinox)
    and, in June 2004, released Eclipse 3.0. This newest version of Eclipse supported
    a runtime model based on OSGI. OSGI was no longer a technology isolated to use
    in embedded software and networked devices but had now become the foundation upon
    which all Eclipse plug-ins would be developed, as well as the platform'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# CHAPTER 13 INTRODUCING OSGI


    upon which thousands of software developers would use the Eclipse IDE to develop
    software.

    Eclipse adoption OSGI marked a significant milestone for the OSGI Alliance, as
    adoption by a major product and brand such as Eclipse thrust it into the spotlight
    for many commercial software companies. Today, almost all major vendors build
    their application platforms atop OSGI, and most application servers used within
    the enterprise currently support it.


    # 13.2 BENEFITS OF OSGI


    OSGI is a dynamic module system for Java. The Java platform enables the development
    of modular applications on the Java platform and provides several benefits.


    # 13.2.1 MODULAR DEVELOPMENT


    The OSGI framework defines a unit of modularization called a bundle. A bundle
    is nothing more, and less, than a Java JAR file. A JAR file is a valid OSGI bundle
    if it contains resources that provide functionality and a Manifest file containing
    metadata about the bundle. The resources can be Java classes, HTML, images, servlets,
    and ever JSP. The metadata is defined using required and optional key-value pairs.
    Since all developers are familiar with JAR files, creating a valid OSGI bundle
    is relatively straightforward. OSGI changes the deployment model for enterprise
    applications. Traditional thinking is centered around Web application development,
    and teams devote valuable resources to identifying functionality contained within
    Web applications, and inter-Web-app communication. With OSGI, you won''t develop
    traditional Web applications. Instead, you''ll develop bundles that are assembled
    into an application, so your development philosophy turns from application-centric
    to modulecentric. While we''ve been attempting to design modular software for
    a long time, OSGI enforces the design of modular software through these bundles
    and managed dependencies.


    # 13.2.2 MANAGED DEPENDENCIES


    OSGI accepts reality that the JAR file is the predominant method of reuse and
    deployment with Java. OSGI treats a JAR as a first-class module. The'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'Manifest within an OSGI bundle defines export packages that other bundles can
    use, as well as import packages used by the bundle. Think of this as public and
    private access to the packages within a JAR file. With OSGI, you can now truly
    establish a module''s published interface simply through how classes are allocated
    to packages and the packages made visible through export by a bundle. OSGI offers
    local transparency for its bundles, because you don''t need to include JAR files
    on the runtime classpath. Instead, exported packages within an OSGI bundle can
    be used by other bundles running on the OSGI platform. Optionally, some OSGI implementations
    may provide a Security layer that allows access to a bundle if permission has
    been granted.


    # 13.2.3 MODULE PLATFORM


    OSGI is a service platform because it reduces coupling between bundles. Yet, viewing
    OSGI as only a service platform tends to lump it in with all other service (as
    in SOA) solutions. OSGI is also a true module platform that hits a sweet spot
    not properly accounted for in enterprise Java development or SOA. is not a distributed
    service technology. Instead, OSGI bundles are deployed and communicate within
    a single JVM, making interbundle communication in-process and lightweight. OSGI
    bundles are true software modules. The OSGI platform contains a framework specification,
    making it similar to any other specification you''ve worked with in Java, like
    the Servlet API, JDBC, and so on. There will be numerous implementations of the
    OSGI specification, but your code should only ever refer to the OSGI package structure
    (org.osgi.*). Additionally, when you compile, you''ll want to compile against
    the specification, not the specific implementation you choose to use.


    # 13.2.4 VERSIONED BUNDLES


    When exporting and importing packages from other bundles, you can specify a version
    number. Because bundles are versioned, you can deploy multiple versions of the
    same bundle on the OSGi platform without experiencing fatal errors, such as a
    ClassCastException commonly when the same class is deployed multiple times within
    the same JVM.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 13.2.5 DYNAMIC (RE)DEPLOYMENT


    OSGi allows you to deploy bundles individually, without performing a restart.
    When functionality within a bundle changes, you simply redeploy that bundle to
    the appropriate OSGi platform, and clients of that bundle automatically discover
    it through the packages it exports and its version. There''s no need to redeploy
    any others. This offers tremendous flexibility if you separate implementation
    from specification in your application bundles, allowing you to completely swap
    implementation without any interruption to other deployed bundles.


    Separate Abstractions, 237


    # 13.2.6 ENVIRONMENTAL CONTROL


    Because OSGi is a managed container environment, you have the ability to install,
    start, stop, update, and uninstall individual bundles.


    # 13.3 DIGESTING OSGI


    Let''s take a moment to digest exactly what OSGi entails and examine what it means
    for the enterprise developer in the trenches. We no longer need to emphasize development
    and deployment of individual Web applications. Instead, we develop enterprise
    software systems as a composition of software modules that can be assembled dynamically
    to form a complete system. The challenge of interapplication communication is
    a nonissue, because individual modules can expose resources that serve content
    to the user and consume behavior exposed by other modules. We no longer need to
    redeploy an entire suite of enterprise software systems because of a behavioral
    change in a single JAR file. Instead, update the JAR file on the OSGi platform.


    Extending the software system to support new processes is as simple as deploying
    or redeploying only the necessary modules, without any interruption to critical
    processes. An SOA built on Web services is also assembled from the same software
    modules by building a service protocol layer on top of the appropriate modules.
    It''s possible to assemble a rich client application from the same software modules.
    Additionally, it''s possible to allow separate modules within an OSGi container
    to utilize the behavior of different versions of the same module.


    Because module dependencies are explicitly stated, the module structure of the
    application is well understood. At the very least, this minimizes'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'the risk of change as the ramification of change can be more accurately assessed.
    Because OSGi bundle collaboration is in-process, granularity of modules can be
    established to allow teams to maximize module reuse without incurring performance
    degradation because of excessive inter-module collaboration. Overall, OSGI has
    eliminated many architectural challenges with enterprise software development
    and has established more refined techniques for deploying and managing enterprise
    software.


    When you add it all up, OSGI fills an important technology gap between SOA and
    object-oriented design on the Java platform. For some time, we''ve been able to
    build flexible and extensible class structures in Java. With technologies such
    as enterprise java beans (EJB) (primarily session and message beans) and Web services,
    we have had a service deployment model. But we''ve lacked a robust module model.
    Chapter 3 talked us down about architecture and modularity. OSGI helps us architect
    all the way down. OSGI is a key technology filling an important void in enterprise
    software development.


    # 13.4 OSGI BUNDLE


    An OSGi bundle is a standard Java JAR file that is packaged with a manifest file.
    The manifest file contains descriptive metadata that the OSGi framework uses to
    initialize the bundle. If a JAR file doesn''t contain a manifest, it isn''t recognized
    as a valid OSGi bundle.


    # 13.4.1 BUNDLE STATE


    All bundles managed by the OSGi framework have a corresponding life cycle. At
    any point in time, an OSGi bundle exists in one of the following states:


    +   - Installed: The OSGi bundle is successfully installed, but dependencies have
    not been resolved.

    - Resolve: All required OSGi bundle dependencies have been resolved. However,
    its services have not been started and are not yet available.

    - Starting: A bundle is starting, and its services will soon be available.

    - Active: A bundle has successfully started, and its services are now available
    for use.'
