  md: '# CHAPTER 3 ARCHITECTURE AND MODULARITY


    Let''s revisit the definition of software architecture by exploring another definition.
    My favorite definition of software architecture was offered by Ralph Johnson in
    an article by Martin Fowler (2003). He states:


    In most successful software projects, the expert developers working on that project
    have a shared understanding of the system design. This shared understanding is
    called "architecture." This understanding includes how the system is divided into
    components and how the components interact through interfaces. These components
    are usually composed of smaller components, but the architecture only includes
    the components and interfaces that are understood by all the developers... Architecture
    is about the important stuff. Whatever that is.


    The key aspect of this definition that differentiates from the earlier definitions
    in this chapter is that of "shared understanding," which implies that there is
    a social aspect to software architecture. We must have a shared understanding
    of how the system is divided into components and how they interact. Architecture
    isn''t just some technical concept; it''s a social construct. Through this social
    aspect of architecture, we can break down the divide between architects and developers.


    To ensure shared understanding, we have to architect "all the way down." Architects
    can''t worry only about services, and developers can''t worry only about code.
    Each group must also focus on a huge middle ground, as illustrated in Figure 3.2.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_61_0.png)


    Focusing exclusively on top-level abstractions is not enough. We must bridge the
    gap through other means, including module and package design. Often, when I speak
    at various conferences, I ask the audience to raise their hands if they devote
    effort to service design. Many hands raise. I also ask them to raise their hands
    if they spend time on class design and code quality. Again, many hands go up.
    When I ask if they they devote effort to package and module design, only a small
    percentage leaves their hands.


    This is unfortunate, because module and package design are equally important as
    service and class design. Somewhere along the way, with our emphasis on services
    and code quality, we''ve lost sight of what lies in between. Within each application
    or service awaits a rotting design, and atop even the most flexible code sits
    a suite of applications or services riddled with duplication and lack of understanding.
    A resilient package structure and corresponding software modules help bridge the
    divide between services and code. Modularity is an important intermediate'
