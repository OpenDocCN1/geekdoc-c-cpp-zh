  md: '# Java Application Architecture


    > "I''m dancing! By God I''m dancing on the walls. I''m dancing on the ceiling.
    I''m ecstatic. I''m overjoyedjoyed. I''m really, pleased."

    —From the Foreword by Robert C Martin (a.k.a. Uncle Bob)


    This isn''t the first book on Java application architecture. Doubt won''t it be
    the last. But rest assured, this title is different. The way we develop Java applications
    is about to change, and this title explores the new way of Java application architecture.


    Over the past several years, module frameworks have been gaining traction on the
    Java platform, and upcoming versions of Java will include a module system that
    allows you to leverage the power of modularity to build more resilient and flexible
    software systems. Modularity isn''t a new concept. But modularity will change
    the way we develop Java applications, and you''ll only be able to realize the
    benefits if you understand how to design more modular software systems.


    Java Application Architecture will help you


    +   * Design modular software that is extensible, reusable, maintainable, and
    adaptable

    * Design modular software today, in anticipation of future platform support for
    modularity

    * Break large software systems into a flexible composite of collaborating modules

    * Understand where to place your architectural focus

    * Migrate large-scale monolithic applications to applications with a modular architecture

    * Articulate the advantages of modular software to your team


    Java Application Architecture lays the foundation you''ll need to incorporate
    modular design thinking through your development initiatives. Before it walks
    you through eighteen patterns that will help you architect modular software, it
    lays a solid foundation that shows you how modularity is a critical weapon in
    your arsenal of design tools. Throughout, you''ll find examples that illustrate
    the concepts. By designing modular applications today, you are positioning yourself
    for the platform and architecture of tomorrow. That''s why Uncle Bob is dancing.


    Kirk Noerschchild is a software developer who has filled most roles on the software
    development team. Kirk is the author of *Java Design: Objects, UML, and Process
    (Addison-Wesley, 2002)* and has contributed to No Fluff Just Stuff 2006 Anthology
    (Pragmatic Bookshelf, 2006). Kirk is an open source contributor, has written numerous
    articles, and is a frequent speaker. He has trained and mentored dozens of software
    professionals on topics including Java/JEE, modeling, software architecture and
    design, component-based development, service-oriented architecture, and software
    process. You can visit his website at techdestrict.kirkk.com.


    ![](img/86bafcb9eab6f88e4ed52f7a7c76cbdb_387_0.png)'
