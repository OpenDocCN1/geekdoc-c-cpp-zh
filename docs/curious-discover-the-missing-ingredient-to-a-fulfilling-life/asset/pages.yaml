    # The Intersection of Interest and Meaning


    To understand what intervenes between triggering and enduring interest, we can
    turn to a study of more than 1,000 college students. Before the students began
    an introductory psychology course, they were asked about their general interest
    in the subject. Subsequently, these same students were asked at regular intervals
    about their grades and what they thought about the field of psychology. These
    check-ins continued for two years and the students'' academic records were reviewed
    to see which courses they took and how well they performed in college.


    The scientists leading the study found that students with an initial interest
    in psychology were inspired during the semester, enjoyed coming to class, and
    because they were interested and attentive, more likely to apply the knowledge
    to their own lives. With a stronger personal connection to the material, the more-interested
    students received better grades, enrolled in more psychology courses, were more
    likely to major in psychology, and had higher grades in these courses.


    One reason that interested students performed so well is that their goal was to
    master as much about psychology as possible. In contrast, less-interested students
    tried to get by with little effort as possible to avoid bad grades. Different
    approaches to what very first psychology course led to dramatically different
    college careers.


    The same patterns are found outside the classroom. In another study, researchers
    observed nearly 200 athletes at a summer football camp. Athletes entering camp
    with the greatest interest in football found the greatest enjoyment and value
    in their daily training. When you are interested in something, the little things
    matter—practices, scrimmages, and waking up in the middle of the night to run
    or lift weights. This open, receptive mindset is visible and attractive to others.
    Athletes rated as the most'
