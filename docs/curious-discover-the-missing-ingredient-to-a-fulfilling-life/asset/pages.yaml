  md: '![](img/09e0af2980ad95fcb654c638a66d3ef0_358_0.png)


    TODD KASHDAN, PH.D., is a clinical psychologist and professor of psychology at
    George Mason University. He received his B.S. from Cornell University and his
    Ph.D. from University at Buffalo, the State University of New York. He has been
    the recipient of many awards for his research on curiosity, happiness, meaning
    in life, social relationships, trauma, depression, and social anxiety. His work
    has been featured in the New York Times, the Street Journal, and the Washington
    Post on NPR and PBS, among others. He lives with his wife and twin daughters in
    Fairfax, Virginia.


