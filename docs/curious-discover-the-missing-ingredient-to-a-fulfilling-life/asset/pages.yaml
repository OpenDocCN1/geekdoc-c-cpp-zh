  md: '# 8 The Dark Side of Curiosity

    Obsessions, Sensational Thrills,

    Sex, Death, and Detrimental Gossip


    A strange contradiction exists when we closely scrutinize curiosity. Despite all
    of the benefits of being a curious explorer, there is a tipping point. Extreme
    curiosity at the wrong time or in the wrong people introduces a dark, destructive
    side. Just like Russian nested dolls that can be pulled apart to reveal yet another,
    smaller version inside, the dark side of curiosity intrigues us. To some degree,
    this is normal and relatively harmless—think of rubbernecking at the scene of
    a fatal accident, reading newspaper articles about teenage arsonists, and following
    the exploits of celebrities who are living train wrecks. The more extreme or weirder
    it gets, the more curious we become.


    To date, positive psychology writers and researchers have had little to say about
    the yin and yang of the positive and negative. Most of the discussion focuses
    on optimism, gratitude, love, positive emotions, bravery, and happiness, as if
    more is always better. But a fair and balanced story about curiosity is to acknowledge
    that too much of any positive experience or "strength" can become a liability.
    Depending on how it''s expressed, curiosity can be perverted, annoying, meddles,
    impairing, and even deadly. Too much can lead to obsessive behavior, dangerous
    thrill-seeking, and detrimental nosiness.


    A fuzzy boundary exists between healthy and unhealthy interests.'
