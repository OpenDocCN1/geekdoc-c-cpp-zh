  md: '# Curious?


    I would answer “no” to all of these questions and here''s why: We have been

    sold on the idea that being happy is the only or most important goal in life.


    While acknowledging the importance of happiness to creating a ful-\filling life,
    when we focus on it, we lose out on the complexity of being

    human. We ignore the other important pieces of the puzzle, such as mean-

    ing in life, maturity, wisdom, and compassion.


    Happiness involves feelings or judgments about life. It is a gauge we

    use to measure if life is going well. But if we do things solely to be

    happy, what happens after this goal is met? We can find ourselves on an

    endless, fruitless, treadmill of “happiness seeking,” never actually feeling

    all happy! I believe that all the time and energy spent looking at

    trying to move the happiness gauge a notch higher can be used

    more effectively. Instead of constantly trying to be happy, we should fo-\cus
    on building a rich, meaningful life, guided by our core values and

    interests.


    This is what the Dalai Lama means when he says that “the very pur-

    pose of life is to seek happiness.” How is he defining happiness here? He

    isn’t talking about feeling good or satisfied. He is talking about living

    a life infused with meaning while embracing the full range of human

    experiences—the positive and the negative.


    This is not a happiness book. This is a book about alive, explor-\ing, discovering
    insights, and living a life that matters. This is a book

    about the science behind creating a fulfilling life, broadly defined.


    You might be feeling as if you want all. I want to be happy, I want

    meaning and purpose in my life, I want greater flexibility and acceptance,

    i want to be wiser and more mature, I want to be successful and

    creative, I want to be able to tolerate the distress and uncertainty of being

    human, and so on.


    When we recognize that there is more to a fulfilling life than being

    happy, then we are left with an important question that this entire book

    hinges on. Namely, what is the central ingredient to creating a fulfilling

    life?


    The answer is curiosity.'
