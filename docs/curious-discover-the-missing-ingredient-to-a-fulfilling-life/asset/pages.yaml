    exactly the same distance from the next one, and every tower is the same width.
    I just rubbed against one of the towers, and it scratches my skin. No flesh wounds,
    it feels like the backside of a sponge. When I look at my feet, I notice that
    the ground is exactly the same as the towers. The ground is fuzzy and blue just
    like the towers. If I jump up and down, my feet bounce a bit. Where am I?


