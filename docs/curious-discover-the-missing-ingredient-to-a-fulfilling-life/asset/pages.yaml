  md: '# 262 Curious?


    strengths we are tightly woven into our identities. Maybe we think we should add
    more strengths to our toolbox than work with the ones we already have. Let me
    be candid and tell you that this is flat-out wrong. Our strengths are exactly
    what we should be playing with. These are the behaviors we are most comfortable
    with; these are the behaviors that are the most energizing; these are the behaviors
    that feel effortless to use.


    When we take curiosity for granted, we don''t use it in the service of anything,
    much less “something larger than the self.” Instead of using our curiosity to
    guide us toward what is intriguing and valuable, we get trapped in well-worn habits
    and routines. We become passive and wait for new things to happen to us. When
    we are passive, we limit the amount of meaning that we find and create in our
