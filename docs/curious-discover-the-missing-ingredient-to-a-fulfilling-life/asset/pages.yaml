    # Purposeful Living and Self-Doubt


    There is an important barrier to being proactive to find purpose and that''s self-doubt.
    It doesn''t matter if you are thinking about changing your career, ending an important
    relationship, or training to become a triathlete, inside your head is mental chatter
    about how your goal is ridiculous, selfish, risky, and possibly dangerous. Worry
    and the need for control are often lurking in the background.


    It''s hard to turn the chatter off, and when we try to, we only think more about
    why we should stick with the status quo. It''s wrong to assume'
