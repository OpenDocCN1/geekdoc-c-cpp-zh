- img_proc: true
  md: '# 4 Curious?


    reality. Mental photographs (past) and dreams (future). Real events happened,
    but once the action is over, they are a figment of reality. These representations
    aren''t stable; they change. You look at pictures in your photo albums and re-create
    memories. We create stories around the narratives we want to weave about ourselves
    and other people. Was Theodore Roosevelt the lest of a dying breed of candid,
    authentic presidents who could swim naked in the pond behind the White House in
    broad daylight, kill hundreds of animals with his shotgun, fight police corruption,
    and be the brave champion of the environment who created the national park system?
    Or was he a sociopath with a grandiose vision of his own importance, driven by
    uncontrollable impulsive urges, who found a good outlet to hide it? History is
    rewritten constantly and the past changes.


    Our moods change constantly and our ideas about the past change with them. As
    for the future, it remains unwritten. Anything can happen, and often we are wrong.
    The best we can do with the future is prepare and savor the possibilities of what
    can be done in the present.


    Only in the present can we be liberated to do whatever it we want. It''s a razor-thin
    moment when we are truly free. When we are curious, we exploit these moments by
    being there, sensitive to what is happening regardless of how it diverges from
    what it looked like before (past) or what we expect it to be (future). We are
    engaged and alive to what is occurring. We are energized. We are open and receptive
    to finding opportunities, making discoveries, and adding to the meaning in our
    life. To reiterate, it''s not about being attentive; it''s about the quality of
    our attention.


    By being open and curious in our moments, we can improve even the most mundane
    aspects of our daily routine. How is it that we walk down a supermarket aisle
    and remain oblivious to the hundreds of items on the shelves? One reason is that
    they don''t interest us. We''ve been in the same store million times, we''re hurried,
    and we might hate grocery shopping in general. If we''re on a mission to make
    a Caesar salad with the aid of a written shopping list, our attention is laser-focused
    on locating the items we need. The owners of the supermarket try to outwit us
    with colorful product displays that force their way into our consciousness. Without
    help to navigate through the flood of objects in our inner and outer worlds, chaos
    would reign. This is where curiosity steps in, if we let it.'
