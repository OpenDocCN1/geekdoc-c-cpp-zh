  md: '# Notes and References 291


    potential of human nature as much as intrinsic motivation, to extend inherent
    tendency to seek out novelty and challenges, to extend and exercise one''s capacities,
    to explore, and to learn.” Quoted from Ryan and Deci (2000), op. cit.


    +   Novelty seeking is one impetus for our curiosity. Absolute novelty is about
    engaging in pure newness that has never been experienced before. This is quite
    rare. More common is relative novelty or the uniqueness of objects, people, or
    situations because of a change in context or perspective. Even though I might
    know every beat and lyric to “Hey Joe” by Jimi Hendrix, the tempo feel faster
    or slower depending on my mood (on the beach porch drinking tequila; racing through
    traffic to get home in time to tuck my kids into bed) and what version is being
    sung at Woodstock; a rendition by a wedding singer). In segments of this book,
    I will be discussing novelty as one of the most relevant sources in becoming curious.


    +   Openness to experience is a broad personality trait that captures the breadth,
    depth, and complexity of a person''s inner world. Five basic, universal personality
    traits discovered by psychologists together can describe a person from almost
    any culture and one of them is openness (among the others who are conscientious,
    extraversion, agreeableness, and neuroticism—an easy way to remember them is the
    acronym OCEAN). A person open to experiences is intellectually curious, willing
    to try new activities, aware and receptive of their felt emotions. They are also
    imaginative, appreciative of music and other forms of creative expression, and
    skeptical of traditional social, religious, and political values. Thus, openness
    can be considered a hedge of ingredients, and curiosity happens to be a major
    theme but not only. After all, you can be highly curious without showing a strong
    appreciation of the arts or any interest in policies. That being, people who open
    extract great pleasure from variety and novelty, show a strong desire to explore
    and seek stimulation, and tend to be independent-minded or psychologically flexible.
    Our knowledge about curiosity can be gained from work on this particular personality
    trait. See John, O. P., & Srivastava, S. (1999). The Big Five trait taxonomy:
    History, measurement, and theoretical perspectives. In L. A. Perrin (Eds.), Handbook
    of personality: Theory and research (pp. 102-138). New York: Guilford.; McCrae,
    R. R., & Costa, P. T. (1997).'
