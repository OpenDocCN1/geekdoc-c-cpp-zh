    # Strategy 3: Choosing a Direction for Your Life with a Well-calibrated Compass


    You are not your thoughts. Your thoughts are not an accurate reflection of what
    you can do. Your thoughts are not an accurate reflection of the risks and rewards
    out there. But if you are not going to trust thoughts and feelings, then what
