    # Part 3: My Valued Action Plan


    So far you have decided what values are most important to you, how close or how
    far you are from living a life infused with your values, and identified any obstacles
    that exist that might keep you from achieving a life lived according to your values.
    Now, think about any actions that you can take that move you closer to living
    fully with your values. These actions can be large or small and will be very personal.
    They might be small movements towards a goal or actions that reflect who you want
    to be as a person. Use the anxiety that comes with facing an obstacle and deciding
    to overcome it, or some small part of it, to move closer to living'
