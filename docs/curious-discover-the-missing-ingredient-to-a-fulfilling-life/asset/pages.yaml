    No matter what path you end up on—and it could be an odd combination of learning
    from others, being reactive, and being proactive—always questioning, investigating,
    and wondering will serve you well. I am reminded of the story of a father who
    tried to drill this mentality into his son, who was still a naive, inquisitive
    sponge.


    Richard’s dad played a game with his son called “Where am I?” Richard closed his
    eyes and his dad would ask him to guess his where-abouts: “Whatever direction
    I turn, all I can see are these huge fuzzy blue towers. They’re enormous. They
