  md: 'USA $25.99


    **Dead cats.** That''s the image many people conjure up when you mention curiosity.
    An image perpetuated by a dusty proverb that has long represented the extent of
    our understanding of the term. This book might not put the proverb to rest, but
    it will flip it upside down: far from killing anything, curiosity breathes new
    life into almost everything it touches.


    In *Curious?* Dr. Todd Kashdan offers a profound new message missing from so many
    books on happiness: the greatest opportunities for joy, purpose, and personal
    growth don''t, in fact, happen when we''re searching for happiness. They happen
    when we are mindful, when we explore what''s novel, and when we live in the moment
    and embrace uncertainty. Positive events last longer and we can extract more pleasure
    and meaning from them when we are open to open to new experiences and relish the
    unknown.


    Dr. Kashdan uses science, story, and practical exercises to show you how to become
    what he calls a curious explorer—a person who''s comfortable with risk and challenge
    and who functions optimally in an unstable, unpredictable world. Here''s a blueprint
    for building lasting, meaningful relationships, improving health, increasing creativity,
    and boosting productivity. Aren''t you curious to know more?


