  md: '# 290 Notes and References


    Curiosity is not only a child; it is part of a family of terms used by writers,
    scientists, and everyday people making conversation to capture the essence of
    recognizing, seeking out, and showing a preference for the new. Isolated islands
    of knowledge have proliferated over the last century, and with a few exceptions,
    researchers and experts neglected to join them together. Just as all the continents
    of the world were interconnected as a single supercontinent Pangea, before they
    drifted apart to be separated by vast oceans, so curiosity can be seen as a Pangea
    of concepts that are all interconnected but are separated in our minds by our
    fields of study and personal experiences. It''s important to clarify concepts
    that are part of the curiosity family; what makes each of these unique aspects
    is as important as their shared features. If we grasp the totality of this big,
    happy family, then for the first time we can begin to understand the depth of
    scientific discoveries on the benefits of being curious. The curiosity family
    includes the following siblings:


    +   a. Interest is the emotion we feel when we are curious. Interest is one of
    the secret universal emotions that we can find in almost any human anywhere in
    the world (and plenty of animals as well). After only a few months, infants show
    a preference for certain sights and sounds in their environments. Describing something
    as “interesting” is no different than saying “it makes us curious.”


    +   b. Flow is a term defined by psychologist Mihaly Csikszentmihalyi as “being
    completely involved in an activity for its own sake. The ego falls away. Time
    flies. Every action, movement, and thought follows inevitably from the previous
    one, like playing jazz. Your whole being is involved, and you''re using your skills
    to the utmost.” As a state of deep concentration and commitment, flow occurs when
    we are interested and challenged in an activity such that nothing else seems to
    matter. Although flow usually occurs when we are working toward a clear goal,
    the reward comes from the activity itself and not any achievement or accomplishment.
    Flow can be considered an extreme variant of being curious, Csikszentmihalyi,
    M. (1990). Flow: The psychology of optimal experience. New York: Harper & Row.


    +   c. Intrinsic motivation reflects one of the underlying reasons for doing an
    activity, and curiosity happens to be the centerpiece. In the words of the distinguished
    psychologists Richard Ryan and Ed Deci, “Perhaps no single phenomenon reflects
    the positive'
