    were sitting. They placed this game regularly. His goal was to get his son out
    of the habit of seeing the world from a single perspective. The world was different
    depending on your starting point and he wanted Richard to learn that there were
    always different angles and perspectives when looking at a person, place, or problem.
    If you stuck to one perspective, you were blinded from learning anything new.
    This game was just one that Richard''s dad worked to develop his son''s curiosity,
    flexibility, and creativity.


    Years later, Richard thinks about how his dad influenced him. He credits him for
    turning him to science. Richard was quite successful, graduating from a top college,
    getting a doctorate in physics, serving as the youngest member of the Manhattan
    Project (the team that built the first atomic bomb), and eventually winning the
    Nobel Prize. Richard Feynman''s life is a testimonial to the value of being curious.
    His father taught him this at an early age, and it became the fundamental, core
    ingredient of his life. He describes the influence of his parents that he didn''t
    fully appreciate at the time in aptly titled autobiography, The Pleasure of Finding
    Things Out.


    In dozens of countries, curiosity is one of the most commonly endorsed strengths.
    Unfortunately, stating that you are curious is not enough to access the profound
    benefits discussed in this book. It''s easy to take your strengths for granted.
    It''s easy to forget about strengths that appear regularly. You don''t need to
    act on or attend to them they just seem to be there.


