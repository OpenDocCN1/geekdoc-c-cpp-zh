    a way to finally express those elusive values and interests.


    Going back to 2007 Pew Religious Landscape Survey, we find a sizeable number of
    people who, in their search for meaning, found that they outgrew their beliefs.
    Of adults who were not raised to be religious as a child, 4% later identified
    with a religion. That is, they found a good fit for what they believe in and what
    they want their lives to be about. From what we know people who are religious,
    we can be sure that some of them stumbled upon a purpose in life. In course, it
