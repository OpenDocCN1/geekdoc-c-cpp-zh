  md: '# # Seeking a Fulfilling Life

    Why There Is More to It Than Happiness


    What do you want most in life? For the vast majority of us, the answer is “to
    be happy.” We want to be happy, and we want our children and loved ones to be
    happy too. In a survey of more than 10,000 people from 48 countries, happiness
    was viewed as more important than success, intelligence, knowledge, maturity,
    relationships, wealth, and meaning in life.


    Not surprisingly, we spend a lot of time, effort, and money trying to achieve
    these sometimes elusive happiness. Our desire to “be happy” has resulted in a
    multibillion-dollar self-improvement industry with a staggering number of books,
    tapes, motivational speakers, therapists, and gurus. Infomercials plead with us
    to purchase the latest top-secret happiness strategy—appearing when we’re most
    vulnerable, teetering on the edge of sleep at 2 A.M. In recent years, houses of
    worship have become empires, megachructures where members can pray, eat, shop,
    and work out in one-stop happiness enterprise. It is simply exhausting to think
    about the myriad of choices available to create happiness.


    Despite the commercialization of its pursuit, happiness is a good thing. And though
    some deny this fact, it is hard to take them seriously. Yet is happiness itself
    truly the thing, the goal, that we should constantly be seeking? Does the pursuit
    of happiness even work? Are we becoming happier?'
  merge: -1
