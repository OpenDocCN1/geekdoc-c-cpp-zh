    # The BULLS-eye Instrument aboutnValued Life (BULLI)


    The BULLI is a tool designed to help people clarify their own values. It is not
    meant to measure goals, which are things that can be crossed off a list. Goals
    are things like “I want to get married,” “I want a better job,” “I want to buy
    a house,” “I want to graduate.” Instead, values are always unfinished business
    and require ongoing action. Values are things like “I want to be the best parent
    I can be,” “I want to be loving, caring, and supportive of my partner,” “I want
    to always give my best at work.” Values define for each of us how we want to live,
    how we choose to interact with other people, and how we behave. Values reflect
    what we want to do, when we want to do it, and how we want to do it. Understanding
    our values helps each of us understand how we want to behave in every aspect of
    life.


    There are three parts to the BULLI. The first part will help you clarify your
    values. The second part is meant to help you identify any obstacles that are keeping
    you from acting in accordance with your personal values. The third part is to
    help you create an action plan for bringing the way you live closer to the values
    you expose.


    # Part 1: The Bull''s Eye


    Part 1 of the BULLI has two exercises. The first exercise asks you to consider
    four areas, or domains, of your life: work/education, relationships, personal
    growth/health, and leisure. Read the descriptions following each domain header
    and write down your values for the area. In terms of general life directions and
    remember that there are no right or wrong answers. Writ- down your personal values
    is what is important about this exercise.


    Work/Education: Refers to your workplace and career, education and knowledge,
    and skills development. (This may include volunteering and other forms of unpaid
    work.) How do you want to act toward your clients,'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 280 Appendix


    customers, colleagues, employees, fellow workers? What personal qualities do you
    want to bring to your work? What skills do you want to develop?


    Relationships: Refers to intimacy, closeness, friendship, and bonding in your
    life. It includes relationships with your partner, children, parents, relatives,
    friends, coworkers, and other social contacts. What sort of relationships do you
    want to build? How do you want to be in these relationships? What personal qualities
    do you want to develop?


    Personal Growth/Health: Refers to your ongoing development as a human being. This
    may include organized religion, personal expressions of spirituality, creativity,
    developing life skills, meditation, yoga, getting out into nature, exercise, nutrition,
    and addressing health-risk factors like smoking.


    Leisure: Refers to how you play, relax, stimulate, enjoy yourself, and engage
    in hobbies or other activities for rest, recreation, fun, and creativity.'
