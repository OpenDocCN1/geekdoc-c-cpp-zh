    */\n//declare the function\nint factorial(int n);\nint main(){\n  int n = factorial(5);//calling\
    \ the function\n  //you can assign the output to a variable or since we know the\
    \ return type of factorial is an int, we can do with anything we can do with an\
    \ int: pass it into functions, perform operations on it, assign it, etc\n  printf(\"\
    5!: %d\\n\",n);\n  printf(\"6!: %d\\n\", factorial(6));\n  return 0;\n}\n/*\n\
    Calculates the factorial of n. Factorial equals n*n-1*n-2*n-3…*1\n*/\nint factorial(int\
    \ n){\n  //base case\n  if (n == 0)\n    return 1;\n  //recursive step\n  else\n\
    \  return n * factorial(n-1);\n}\n```\n\n### Output:\n```\n5!: 120\n6!: 720\n\
