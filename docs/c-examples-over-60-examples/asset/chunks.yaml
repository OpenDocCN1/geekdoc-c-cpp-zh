    \n`LogicalOps.cpp`\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n/*\n\
    作者 | 邮箱 | 日期\n\n逻辑运算符：逻辑运算符允许你在 if 语句中测试多个布尔值。它们包括逻辑与运算符 (&&)、非运算符 (!), 和逻辑或运算符\
    \ (||)\n*/\nint main(){\n  int test = 222;\n  bool condition = true;\n  bool bang\
    \ = !true; // 这意味着：bang = false\n\n  if(test<200 && condition){\n    // 如果 test<200\
    \ 为真 且 condition 为真\n    cout<<\"If code executed, 其余跳过...\\n\";\n  }\n  else\
    \ if(bang || condition){\n    // 如果 bang 为真或 condition 为真\n    cout<<\"Else If\
    \ code executed, 其余跳过...\\n\";\n  } else {\n    cout<<\"Else code executed, 当所有都不通过时...\\\
    n\";\n  }\n  return 0;\n}\n```\n\n输出：\n```\nElse If code executed, 其余跳过...\n```\n\
    \n# switch 语句\n\n`Switch.cpp`\n\n```cpp\n#include <iostream>\n\n/*\n作者 | 邮箱 |\
