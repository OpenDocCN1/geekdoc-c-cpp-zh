    }\n```\n\n**输出：**\n```\nint: 100\nfloat: DoEasy\n```\n\n### Polymorphism.cpp\n\
    \n```cpp\n#include <iostream>\n#include <string.h>\nusing namespace std;\n\n/*\n\
    作者 | 邮箱 | 日期\n多态：多态是指对象具有多种形式。\n多态发生在继承之后，不同的对象根据其\n数据类型调用不同的函数。\n*/\nclass SpaceBody{\n\
    public:\n  void setMass(double m){\n    mass = m;\n  }\n  double getMass(){\n\
    \    return mass;\n  }\n  void setRadius(double r){\n    radius = r;\n  }\n  double\
    \ getRadius(){\n    return radius;\n  }\n  SpaceBody();\n  void test(){\n    cout<<\"\
    Printed from SpaceBody.\\n\";\n  }\n  void print(){\n    cout<<\"\\n\\tMass: \"\
    <<getMass()<<\"\\tRadius: \"<<getRadius<<endl;\n  }\nprotected:\n  double mass;\n\
    \  double radius;\n};\n\nclass Planet: public SpaceBody{\npublic:\n  void setName(string\
    \ n){\n    name = n;\n  }\n  string getName(){\n    return name;\n  }\n  Planet(string\
    \ name, double m, double r);\n  void test(){\n    cout<<\"Printed from Planet.\\\
    n\";\n  }\n  void print(){\n    cout<<\"Name: \"<<getName();\n    SpaceBody::print();\n\
    \  }\nprivate :\n  string name;\n};\n\nPlanet::Planet(string n, double m, double\
    \ r){\n  setName(n);\n  setMass(m);\n  setRadius(r);\n}\n\nint main(){\n  SpaceBody\
    \ mars;\n  mars.test();\n  Planet earth(\"Earth\", 33, 1);\n  earth.test();\n\
    \  return 0;\n}\n```\n\n**输出：**\n```\nPrinted from SpaceBody.\nPrinted from Planet.\n\
    ```\n\n### Pointer.cpp\n\n```cpp\n#include <stdio.h>\n/*\n作者 | 邮箱 | 日期\n指针：指针是一个存储数据类型地址的特殊变量。\n\
