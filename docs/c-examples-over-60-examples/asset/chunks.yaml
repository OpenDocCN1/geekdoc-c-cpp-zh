    \n```cpp\n#include<stdio.h>\n/*\nRecursion: A recursive function is a function\
    \ that calls itself. Infinite recursion is possible so beware of this.\nAlso,\
    \ you must have a proper base case in order to avoid this.\nRecursive functions\
    \ are somewhat easier to read and write however they take up more space on the\
