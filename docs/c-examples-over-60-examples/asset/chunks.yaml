    ```\n\n# 三元运算符\n\n`TernaryOperator.cpp`\n\n```cpp\n/*\n作者 | 邮箱 | 日期\n\n三元运算符：三元运算符基本上是\
    \ if 块的简写表示。\n它们也被称为条件运算符。它们是一个行语句，根据真/假语句为变量赋值两个值中的一个。\n*/\nint main(){\n  int\
    \ number = 99;//这个数字可以是任何值\n  int outcome;\n  // 下面是以下简写表示：\n  // 如果 99%2 等于 0\
    \ outcome = 1\n  // 否则 outcome = 0\n  outcome = (99%2 == 0) ? 1 : 0;\n  printf(\"\
