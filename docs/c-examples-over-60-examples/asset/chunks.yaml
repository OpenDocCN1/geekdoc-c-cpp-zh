    ;\n\n  return 0;\n}\n```\n\n输出：\n```\n1+1: 2\n1++: 2\n5%3: 2\n```\n\n# 关系运算符\n\
    \n`RelationalOps.cpp`\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    /*\n作者 | 邮箱 | 日期\n\n什么是关系运算符：它们执行比较测试。\n\n它们包括： `>`, `>=`, `<`, `<=`, `==`, `!=`\n\
