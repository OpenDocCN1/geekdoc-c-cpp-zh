    /*


    fibonacci: Returns the the nth fibonacci number.


    fib[n] = fib[n-1]+fib[n-2]


    */


    int fibonacci(int n){


      //base case


      if (n == 0)


        return 0;


      else if (n == 1)


        return 1;


      else


        return fibonacci(n-1) + fibonacci(n-2);


    }


