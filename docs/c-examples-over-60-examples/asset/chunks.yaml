    */\nint main(){\n  int number = 1;\n  int two;\n  //使用 & 符号访问内存地址\n  printf(\"\
    Address of number: %p\\n\", &number);\n  printf(\"Address of two: %p\\n\", &two);//这两个两个地址之间相隔\
    \ 4 字节，或者 32 位\n  // 声明指针使用数据类型（例如 int），然后\n  int *pointerToInt = &number; //声明一个指针\n\
    \  //指向 number 的地址\n  //直接使用指针将返回地址\n  printf(\"Address of where int is stored:\
    \ %p\\n\", pointerToInt);\n  //使用指针上的 * 访问指向的内容\n  //这被称为解引用\n  printf(\"What\
    \ The Pointer is Pointing to: %d\\n\", *pointerToInt);\n  return 0;\n}\n```\n\n\
    **输出：**\n```\nAddress of number: 0x7fff5f31be8\nAddress of two: 0x7fff5f31be4\n\
    Address of where int is stored: 0x7fff5f31be8\nWhat The Pointer is Pointing to:\
    \ 1\n```\n\n### PointerToNull.cpp\n\n```cpp\n#include <stdio.h>\n/*\n作者 | 邮箱 |\
