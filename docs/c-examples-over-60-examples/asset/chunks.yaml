    */\nint main(){\n  // 尝试这个数字\n  int number = 7;//这是我们 switch 的对象\n  char letter\
    \ = 'a';//对一个 char 进行切换\n  switch(number){\n    case 0:'a' // 如果 number == 0，运行此代码，跳过其余\n\
    \      printf(\"Number == 0\\n\");\n      break;// 可选\n    case 1:'b'\n      printf(\"\
    Number == 1\\n\");\n      break;// 可选\n    case 2:'c'\n      printf(\"Number ==\
