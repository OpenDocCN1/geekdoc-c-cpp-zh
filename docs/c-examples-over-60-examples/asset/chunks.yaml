    \n```cpp\n#include <iostream>\n#include <string.h>\nusing namespace std;\n\n/*\n\
    作者 | 邮箱 | 日期\n三种访问修饰符：public、private 和 protected\n-Public：可以在类外部任何地方访问\n-Private：只能由类内部或友函数访问\n\
    -Protected：与 private 类似，但多了一个特性，\n这些修饰符可以被子类（派生类）访问\n*/\n\nclass SpaceBody{\n\
    public:\n  void setMass(double m){\n    mass = m;\n  }\n  double getMass(){\n\
    \    return mass;\n  }\n  void setRadius(double r){\n    radius = r;\n  }\n  double\
    \ getRadius(){\n    return radius;\n  }\n  void print(){\n    cout<<\"\\n\\tMass:\
    \ \"<<getMass()<<\"\\tRadius: \"<<getRadius<<endl;\n  }\nprotected//可以将其改为 private，由于多态性\n\
    \          //它仍然可以工作...\n  double mass;\n  double radius;\n};\n\nclass Planet:\
    \ public SpaceBody{\npublic:\n  void setName(string n){\n    name = n;\n  }\n\
    \  string getName(){\n    return name;\n  }\n  Planet(string name, double m, double\
    \ r);\n  void print(){\n    cout<<\"Name: \"<<getName();\n    SpaceBody::print();\n\
    }\n//将访问修饰符设置为私有\nprivate :\n  string name;\n};\n\nPlanet::Planet(string n, double\
    \ m, double r){\n  setName(n);\n  setMass(m);\n  setRadius(r);\n}\n\nint main(){\n\
    \  Planet earth (\"Earth\", 45555.9, 890.99);\n  earth.print();\n  //earth.name\
    \ = \"DoEasy\";//这行不起作用，尝试取消注释\n  //name 是私有的，所以它只能通过 Planet 类内的公共函数访问\n  //这就是为什么我们创建了\
    \ getName() 等函数\n  earth.setName(\"MARS\");\n  //你需要来自 “Planet 类”内部的函数来更改它\n \
    \ earth.print();\n}\n```\n\n**输出：**\n```\nName: Earth\nMass: 45555.9Radius: 890.99\n\
    Name: MARS\nMass: 45555.9Radius: 890.99\n```\n\n### FunctionOverloading.cpp\n\n\
    ```cpp\n#include <iostream>\n#include <string.h>\nusing namespace std;\n\n/*\n\
    作者 | 邮箱 | 日期\n你可以在 C++ 中重载函数，重载函数意味着：\n创建一个相同名称和返回类型的函数，但具有不同的\n参数列表。\n*/\n\n\
    class OutPut{\npublic:\n  void print(int x){\n    cout<<\"int: \"<<x<<endl;\n\
