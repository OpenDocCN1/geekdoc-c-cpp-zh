    \ 79\n\n## Author’s Note\nThank you very much for your purchase, and your interest\
    \ in learning a wonderful programming language. “C++ Examples” contains over 50\
    \ examples that are fully functional, easy to use, and unique. Previous programming\
    \ knowledge is not required, however previous knowledge can do nothing but help.\
    \ The only requirement is patience, dedication, and a passion for learning. However,\
    \ as to not deter you from learning C++ I am going to explain how to create, compile,\
    \ and run a `.cpp` source file.\n\nIn order to create an editable `.cpp` source\
    \ file you first need to choose a text editor, I am going to use `emacs`. So to\
    \ create a `.cpp` source file type the following command into your command line:\n\
    \n```\nemacs SourceFile.cpp\n```\n\nThen to compile, use the following command:\n\
    \n```bash\ng++ SourceFile.c -o SourceFile\n```\n\nThen to run your file, use:\n\
    \n```bash\n./SourceFile\n```\n\nNew topics are presented in this book in an easy\
    \ to understand way, then programs are made using the new topic as well as previously\
    \ discussed topics in order to review and learn new material simultaneously. This\
    \ helps you maximize learning a new language. There is much to learn and practice\
    \ makes perfect. So let us begin.\n\n## Thank You\n\n### HelloWorld.cpp\n```cpp\n\
    #include <iostream>//instead of <stdio.h> although that would work\n\nusing namespace\
    \ std;//tells compiler to use std namespace\n\n/*\nAuthor | Email | Date\nBasic\
    \ syntax, and environment set up of a C++ program.\nWe will be using the g++ compiler,\
    \ so if you do not have\ninstalled now is the time to install it.\nAny legal C\
    \ program is a legal c++ program\nApple and PC use C++ to write their interfaces\n\
    C++ was originally named “C with classes”... Yay classes\nWe are inside a block\
    \ comment right now, comments are not ran\nwhen you run a program\n*/\n\n//this\
    \ is a single line comment\n//code inside main() will execute when compiled and\
    \ ran\nint main(){\n  //huge difference than the printf() function\n  cout <<\
    \ \"Hello World!\\n\";\n//can use the newline character,\\n, or endl\n//we can\
    \ see our c knowledge can be applied here\n  printf(\"--Hello World--\\n\");\n\
    \  return 0;\n}\n```\n**OutPut:**\n```\nHello World!\n--Hello World—\n```\n\n\
    ### DataTypes.cpp\n```cpp\n#include <iostream>\n#include <limits.h>//since we\
    \ are basically writing c we can do this\nusing namespace std; //this is new\n\
    \n/*\nAuthor | Email | Date\nPrimitive Types: bool, char, int, float, double,\
    \ void\nType modifiers: signed, unsigned, short, long\nso you can add these modifiers\
    \ to data types based on what you need.\n*/\nint main(){\n/*\nbool: is a true/false\
    \ statement\nchar: a single character\nint/long: are whole numbers\nfloat/double:\
    \ are floating point values(decimal numbers)\nvoid: a none type\n*/\n  cout <<\
    \ sizeof(char) << \" bytes in a char\\n\";\n  cout << \"Unsigned Data Types range\
    \ from 0 - MAXSIZE\\n\";\n  cout << \"Signed data takes into account negative\
    \ range.\\n\";\n  cout << \"Short shortens the bytes, while long lengthens the\
    \ bytes\\n\";\n  cout << \"There are 8 bits in a byte\\n\";\n  cout << \"A char\
    \ is 1 byte(8 bits), so the max value is (2^8)-1\\n\";\n  //unsigned char 0 to\
    \ 255, signed char -128 to +127\n  //this can be done with all the data types.\n\
    \  return 0;\n}\n```\n**OutPut:**\n```\n1 bytes in a char\nUnsigned Data Types\
    \ range from 0 - MAXSIZE\nSigned data takes into account negative range.\nShort\
    \ shortens the bytes, while long lengthens the bytes\nThere are 8 bits in a byte\n\
    A char is 1 byte(8 bits), so the max value is (2^8)-1\n```\n\n### Variables.cpp\n\
    ```cpp\n#include <iostream>\n#include <math.h>//a header file with useful math\
    \ functions\nusing namespace std;\n\n/*\nAuthor | Email | Date\nHow to declare\
    \ and initialize a variable.\nYou can initialize a variable with a function call.\n\
    */\nint main(){\n  //type name = value;\n  bool b;//declaration\n  b = true;//initialization\n\
    \  cout << \"b: \" << true<< \"\\n\";\n  cout << \"range of unsigned bool: 0 to\
    \ \" \n                                 \n  pow(2,sizeof(bool))-1\\n\";\n  int\
    \ x = 1000;\n  int y = x;\n  int z = x+y;\n  cout<<\"x: \"<<x<<\" y: \"<<y<<\"\
    \ z: \"<<z<<\"\\n\";\n  //note: multiple declarations of the same line is ok\n\
    \  return 0;\n}\n```\n**OutPut:**\n```\nb: 1\nrange of unsigned bool: 0 to 255\n\
    x: 1000 y: 1000 z: 2000\n```\n\n### Constant.cpp\n```cpp\n#include <iostream>\n\
    using namespace std;\n\n/*\nAuthor | Email | Date\nConstant: How to declare a\
    \ variable constant.\nOnce a constant is initialized, it can not\nbe changed.\
    \ Different yet similar to #DEFINE\n*/\nint main(){\n  //common practice is to\
    \ capitalize all\n  //letters of a constant\n  const int MAX = 100;\n  cout<<\
    \ \"MAX: \"<<MAX<<\"\\n\";\n  //below is an illegal move\n  //comment back in\
    \ to find out what error throws\n  //MAX = 150;//illegal\nreturn 0;\n}\n```\n\
    **Output:**\n```\nMAX: 100\n```\n\n### TypeCast.cpp\n```cpp\n#include <iostream>\n\
    #include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nusing namespace\
    \ std;\n\n/*\nAuthor | Email | Date\nHow to cast a data type to a different data\
    \ type, watch out for loss of data. When you type cast you temporarily assign\
    \ a data type to the data type you are casting to. Not all of the above header\
    \ files are used, I just want to illustrate some useful ones, and all the “.h”\
    \ files from C are available in C++.\n*/\nint main(){\n  float decimal = 3.14159;\n\
    \  float e = 2.71828;//Euler’s Number\n  cout << \"decimal before: \" << decimal\
    \ << “\\n”;\n  //we are casting a float to an int, temporarily\n  cout << \"decimal\
    \ after: \" << (int)decimal << \"\\n\";\n  cout<<\"e before: \"<<e<<\"\\n\";\n\
    \  cout<<\"e after: \"<<(int)e<<\"\\n\";\n  //useful for quick conversions,\n\
    \  //passing arguments into functions\n  //can cast one class to another\n  return\
    \ 0;\n}\n```\n**Output:**\n```\ndecimal before: 3.14159\ndecimal after: 3\ne before:\
    \ 2.71828\ne after: 2\n```\n\n### ArithmeticOps.cpp\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n"
