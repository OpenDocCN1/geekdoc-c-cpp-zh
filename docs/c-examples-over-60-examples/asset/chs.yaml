  - `Game.cpp` —————————————> p. 79\n\n## 作者的话\n非常感谢你的购买，以及你对学习奇妙编程语言的兴趣。“C++ 示例”包含了\
  \ 50 多个功能完全、易于使用且独特的示例。不需要先前的编程知识，不过，之前的知识大有帮助。唯一的要求是耐心、奉献和对学习的热情。不过，为了不让你对学习 C++望而，我将解释如何创建、编译和运行一个\
  \ `.cpp` 源文件。\n\n为了创建一个可编辑的 `.cpp` 源文件，你首先需要选择一个文本编辑器，我将使用 `emacs`。因此，要创建一个 `.cpp`\
  \ 源文件，请在命令行中输入以下命令：\n\n```\nemacs SourceFile.cpp\n```\n\n然后要编译，使用以下命令：\n\n```bash\n\
  g++ SourceFile.c -o SourceFile\n```\n\n然后运行你的文件，使用：\n\n```bash\n./SourceFile\n```\n\
  \n本书以易于理解的方式介绍了新主题，然后使用这些新主题以及之前讨论过的主题来编写程序，以便在学习新材料的同时进行回顾。这有助于你最大化地学习一门新语言。有很多东西需要学习，熟能生巧。所以，让我们开始吧。\n\
