  \n`TernaryOperator.cpp`\n\n```cpp\n/*\n作者 | 邮箱 | 日期\n\n三元运算符：三元运算符基本上是 if 块的简写表示。\n\
  它们也被称为条件运算符。它们是一个行语句，根据真/假语句为变量赋值两个值中的一个。\n*/\nint main(){\n  int number = 99;//这个数字可以是任何值\n\
  \  int outcome;\n  // 下面是以下简写表示：\n  // 如果 99%2 等于 0 outcome = 1\n  // 否则 outcome\
  \ = 0\n  outcome = (99%2 == 0) ? 1 : 0;\n  printf(\"outcome: %d\\n\",outcome);\n\
  \n  // 这是一个测试，判断 number 是\n  // 奇数还是偶数，如果 number 能被二\n  // 整除（余数为 0）那么它就是\n  //\
  \ 偶数\n}\n```\n\n输出：\n```\noutcome: 0\n```\n\n## 逻辑运算符\n\n`LogicalOps.cpp`\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\n\n/*\n作者 | 邮箱 | 日期\n\n逻辑运算符：逻辑运算符允许你在\
  \ if 语句中测试多个布尔值。它们包括逻辑与运算符 (&&)、非运算符 (!), 和逻辑或运算符 (||)\n*/\nint main(){\n  int test\
  \ = 222;\n  bool condition = true;\n  bool bang = !true; // 这意味着：bang = false\n\n\
  \  if(test<200 && condition){\n    // 如果 test<200 为真 且 condition 为真\n    cout<<\"\
  If code executed, 其余跳过...\\n\";\n  }\n  else if(bang || condition){\n    // 如果 bang\
  \ 为真或 condition 为真\n    cout<<\"Else If code executed, 其余跳过...\\n\";\n  } else {\n\
  \    cout<<\"Else code executed, 当所有都不通过时...\\n\";\n  }\n  return 0;\n}\n```\n\n\
  输出：\n```\nElse If code executed, 其余跳过...\n```\n\n## switch 语句\n\n`Switch.cpp`\n\n\
  ```cpp\n#include <iostream>\n\n/*\n作者 | 邮箱 | 日期\n\nswitch：如何使用 switch 语句。switch\
