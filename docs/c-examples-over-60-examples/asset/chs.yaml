  ```cpp\n#include<stdio.h>\n#include<stdlib.h>\n#include<time.h>\n\n/*\nAuthor |\
  \ Email | Date\n\nArrayAnalysis: 计算随机数组的平均值、最大值和最小值。我们将讨论如何从函数返回数组，并将其作为参数传递。\n\
  */\nint* initArray(int size, int range);\ndouble average(int* numbers, int size);\n\
  int biggest(int* numbers, int size);\nint smallest(int* numbers, int size);\n\n\
  int main(){\n  int* pi = initArray(10, 100);\n  double ave = average(pi, 10);\n\
  \  int big = biggest(pi, 10);\n  int small = smallest(pi, 10);\n  printf(\"Analyzing\
  \ Array:\\n\");\n  printf(\"\\tAverage %.2f\\n\",ave);\n  printf(\"\\tBiggest %d\\\
  n\",big);\n  printf(\"\\tSmallest %d\\n\", small);\n  return 0;\n}\n\n/*\n创建一个长度为\
  \ size 的数组，包含 [0, range] 之间的随机数。\n当你返回数组时，必须返回一个指针，稍后可以遍历。\n*/\nint* initArray(int\
  \ size, int range){\n  srand(time(0));\n  int* num = (int*)malloc(sizeof(int));\n\
  \  for(int i = 0; i < size; i++){\n    num = realloc(num, sizeof(int)*(i+1));\n\
  \    *(num+i) = rand()%range;\n  }\n  //返回 numbers 的第一个地址\n  return num;\n}\n\n\
  /*\naverage 计算数组的平均值。\n我们是将数组传递到函数中。\n具体来说，我们向函数传递一个指针，然后我们可以对成员使用指针算术。\n这样做时，传入大小也是比较好的。\n\
  */\ndouble average(int* numbers, int size){\n  double total = 0;\n  for(int i =\
  \ 0; i < size; i++)\n    total += *(numbers+i);\n  return total/(double)size;\n\
  }\n\n/*\nbiggest: 找到数组中的最大数。\n我们将使用上述相同的技术。\n*/\nint biggest(int* numbers, int size){\n\
  \  int biggest = *numbers;\n  //初始化第一个 为第一个元素\n  for(int i = 1; i < size; i++){\n\
  \    if(*(numbers+i) > biggest)\n      biggest = *(numbers+i);\n  }\n  return biggest;\n\
  }\n\n/*\nsmallest: 找到数组中的最小数。\n我们将使用上述相同的技术。\n*/\nint smallest(int* numbers, int\
  \ size){\n  int smallest = *numbers;\n  //初始化 smallest 为第一个元素\n  for(int i = 1;\
  \ i < size; i++){\n    if(*(numbers+i) <smallest)\n      smallest = *(numbers+i);\n\
  \  }\n  return smallest;\n}\n```\n\nOutput:\n```\nAnalyzing Array:\nAverage 60.30\n\
