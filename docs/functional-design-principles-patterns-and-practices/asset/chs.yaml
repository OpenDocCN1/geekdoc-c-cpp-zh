  \ (let [neighbors (world/neighbors world loc)\n          birth-places (filter #(water/is?\
  \ (world/get-cell world %))\n                               neighbors)]\n      (if\
  \ (empty? birth-places)\n        nil\n        [loc (set-age animal 0)\n        \
  \ (rand-nth birth-places) (make-child animal)]))\n    nil))\n\n————\n\n(ns wator.fish\n\
  \  (:require [clojure.spec.alpha :as s]\n            [wator\n             [cell\
  \ :as cell]\n             [animal :as animal]]))\n\n(s/def ::fish (s/and #(= ::fish\
  \ (::cell/type %))\n                     ::animal/animal))\n(defn is? [cell]\n \
  \ (= ::fish (::cell/type cell)))\n\n(defn make []\n  {:post [(s/valid? ::fish %)]}\n\
  \  (merge {::cell/type ::fish}\n         (animal/make)))\n\n(defmethod animal/make-child\
  \ ::fish [fish]\n  (make))\n\n————\n\n(ns wator.fish-imp\n  (:require [wator\n \
  \            [cell :as cell]\n             [animal :as animal]\n             [fish\
  \ :as fish]]))\n\n;. . .\n\n(defmethod animal/reproduce ::fish/fish [fish loc]\n\
  \  (animal/do-reproduce fish loc)) 再次，注意我将 `fish/reproduce` 延迟委托到了 `animal/do-reproduce`。这允许我在\
  \ `animal` 中指定 `reproduce` 的通用行为，同时允许 `fish` 覆盖或增强它。我不知道这是否有必要（14），但添加它的代价很低，而且消除了\
  \ `shark` 和 `fish` 中的重复代码。是的，我知道有 YAGNI（你并不需要它）之类的。但规则是用来打破的。\n\n### 抓挠\n\n我心里有一种痒痒的感觉，觉得我应该先实现\
  \ `world/tick`。我根据 `move` 和 `reproduce` 的返回值做了很多决定，这些都是基于我认为 `world/tick` 将需要什么。让我们转换一下思路，在继续向\
  \ `animal` 添加更多内容之前，关注 `world/tick`。\n\n这里是第一个测试：\n\n```\n(it \"moves a fish around\"\
  \n  (let [fish (fish/make)\n        small-world (-> (make 2)\n                 \
  \       (set-cell [0 0] fish)\n                        (world/tick))\n        vacated-cell\
  \ (world/get-cell small-world [0])\n        occupied-cell (world/get-cell small-world\
  \ [1])]\n    (should (water/is? vacated-cell))\n    (should (fish/is? occupied-cell))\n\
  \    (should= 1 (animal/age occupied-cell))))\n```\n\n非常简单。我们创建一个带有两个单元的 `small-world`，其中一个是\
  \ `fish`。我们对该世界调用 `tick`，然后确保 `fish` 移动了。点击此处查看代码图片\n\n```\n(defn tick [world]\n\
  \  (-> world\n        (make 1))))\n```\n\n看吧，这无法编译，因为 `world` 依赖于 `fish`，而 `fish`\
  \ 又依赖于 `world`。唉。循环依赖是设计糟糕代码结构的噩梦。\n\n但我们知道如何解决这个问题。通过将 `world-imp` 从 `world` 中拆分出来来反转依赖（DIP）。UML\
  \ 所示如图 17.5。\n\n![](img/c1705.jpg)\n\n**图 17.5.** 打破循环\n\n`World` 类旁边的 `=` 是我指示它是一个抽象方法的方法。这里是代码：\n\
  \n点击此处查看代码图片\n\n```\n(ns wator.world\n  (:require [clojure.spec.alpha :as s]\n \
  \           [wator\n             [cell :as cell]\n             [water :as water]]))\n\
  \n(s/def ::location (s/tuple int? int?))\n(s/def ::cell #(contains? % ::cell/type))\n\
  (s/def ::cells (s/map-of ::location ::cell))\n(s/def ::bounds ::location)\n(s/def\
  \ ::world (s/and (s/keys :req [::cells ::bounds])\n                      #(= (type\
  \ %) ::world)))\n\n(defmulti tick ::type)\n\n(defn make [w h]\n  {:post [(s/valid?\
  \ ::world %)]}\n  (let [locs (for [x (range w) y (range h)] [x y])\n        loc-water\
  \ (interleave locs (repeat (water/make)))\n        cells (apply hash-map loc-water)]\n\
  \    {::type ::world\n     ::cells cells\n     ::bounds [w h]}))\n\n; . .\n————\n\
  (ns wator.world-imp\n  (:require [wator\n             [world :as world :refer :all]\n\
  \             [animal :as animal]\n             [fish :as fish]\n             [water\
  \ :as water]]))\n(defmethod world/tick ::world/world [world]\n  (-> (make 2 1)\n\
  \        (set-cell [0 0] (water/make))\n        (set-cell [0 1] (animal/set-age\
  \ (fish/make) 1))))\n```\n\n一旦我在测试的 `:require` 列表中添加了 `[world-imp]`，它就通过了测试。注意，`tick`\
  \ 现在是一个只有一个实现的多态方法。这正是我们需要的依赖反转。\n\n\n\n\n但现在我被 `world` 中那个 `water` 依赖关系困扰了。有一个技术术语可以描述我的这种感受。那个词是*恶心*\
  \ (icky)。那条依赖关系在某种程度上是*错误*的。\n\n我需要洗个澡。我在洗澡时能解决很多问题。\n\n### 淋浴能解决问题\n\n好了，我洗完澡回来了，这是我在喷淋头下和自己进行的对话。\n\
  \n“在 `world` 中创建 `water` 感觉很恶心。我的意思是，我只是把 `world` 分成了两部分，因为创建一个 `fish` 导致了循环。所以创建\
  \ `water` 也可能导致循环。但等一下，这都是关于创建的。也许我需要一个工厂！是的，一个名为 `cell-factory` 的抽象工厂，它将接受像 `:fish`\
  \ 和 `:water` 这样的不透明令牌，然后……（噢！…………，还有 `:default-cell`。是的，然后……等一下，为什么我需要一个全新的工厂？为什么\
  \ `world` 不能本身就是工厂？是的！这就是`工厂方法`（Factory Method）模式。这对了！”\n\n此设计的 UML（见图 17.6）非常有揭示性。\n\
  \n一个架构边界刚刚出现。所有的依赖都向高层跨越，遵循依赖规则。我可能不会在实际架构中使用这个边界边界，但如果我需要，它就在那里。\n\n![](img/c17f006.jpg)\n\
  \n**图 17.6.** 使用工厂方法模式的 WaTor\n\n现在代码看起来是这样的\n\n点击此处查看代码图片\n\n```\n(ns wator.world\n\
  \  (:require [clojure.spec.alpha :as s]\n            [wator\n             [cell\
  \ :as cell]\n             [water :as water]]))\n\n(s/def ::location (s/tuple int?\
  \ int?))\n(s/def ::cell #(contains? % ::cell/type))\n(s/def ::cells (s/map-of ::location\
  \ ::cell))\n(s/def ::bounds ::location)\n(s/def ::world (s/and (s/keys :req [::cells\
  \ ::bounds])\n                      #(= (::type %) ::world)))\n\n(defmulti tick\
  \ ::type)\n(defmulti make-cell (fn [factory-type cell-type] factory-type))\n(defn\
  \ make [w h]\n  {:post [(s/valid? ::world %)]}\n  (let [locs (for [x (range w) y\
  \ (range h)] [x y])\n        default-cell (make-cell ::world :default-cell)\n  \
  \      loc-water (interleave locs (repeat default-cell))\n        cells (apply hash-map\
  \ loc-water)]\n    {::type ::world\n     ::cells cells\n     ::bounds [w h]}))\n\
