  \n(defmethod world/tick ::world/world [world]\n  (-> (make 2 1)\n        (set-cell\
  \ [0 0] (water/make))\n        (set-cell [0 1] (animal/set-age (fish/make) 1))))\n\
  \n(defmethod world/make-cell ::world/world [world cell-type]\n  (condp = cell-type\n\
  \    :default-cell (water/make)\n    :water (water/make)\n    :fish (fish/make)\n\
  \    :shark (shark/make)))\n```\n\n`make-cell` 中的 `factory-type` 仅仅作为 `::world`\
  \ 传入。这允许 `defmethod ::world/world` 解析它。\n\n我对这个改变寄予很大期望。请注意，这整个改变是由一个测试驱动的，我为了通过在\
