  ```\n\n好的。最后一件事。父鲨鱼的健康值会被分配到两个母鲨鱼之间：\n\n点击此处查看图片\n\n```\n(it \"shares health with\
  \ both daughters after reproduction\"\n  (let [initial-health (inc config/shark-reproduction-health)\n\
  \        pregnant-shark (-> (shark/make)\n                           (animal/set-age\n\
  \                             (inc config/shark-reproduction-age))\n           \
