  \ (world/get-cell competitive-world [1 0])]\n    (should (fish/is? end-10))\n  \
  \  (should (or (fish/is? start-00)\n                (fish/is? start-20)))\n    (should\
  \ (or (water/is? start-00)\n                (water/is? start-20)))))\n```\n\n一个简单的\
  \ 3x1 `world`，在两端各有一条 `fish`。只有其中一个可以移动到中间槽。另一个将不得不留在原处。这个测试失败是因为 `animal/move`\
  \ 函数并不知道 `fish` 已经移动到了目标槽。\n\n解决这个问题意味着要某种方式将 `moved-into` 列表发送到 `animal/move`。我不喜欢给\
  \ `animal/move` 再增加一个参数的主意，所以也许我们可以将这些信息藏在传递给 `animal/move` 的 `world` 中：\n\n```\n\
  (ns wator.world-imp . . .)\n\n(defmethod world/tick ::world/world [world]\n  (let\
  \ [cells (::world/cells world)]\n    (loop [locs (keys cells)\n           new-cells\
  \ {}\n           moved-into #{}]\n      (cond\n        (empty? locs)\n        (assoc\
  \ world ::world/cells new-cells)\n\n        (contains? moved-into (first locs))\n\
  \        (recur (rest locs) new-cells moved-into)\n\n        :else\n        (let\
  \ [loc (first locs)\n              cell (get cells loc)\n              [from to]\
  \ (cell/tick\n                          cell loc\n                          (assoc\
  \ world :moved-into moved-into))\n              new-cells (-> new-cells (merge from)\
  \ (merge to))\n              to-loc (first (keys to))\n              to-cell (get\
  \ to to-loc)\n              moved-into (if (water/is? to-cell)\n               \
  \             moved-into\n                            (conj moved-into to-loc))]\n\
  \          (recur (rest locs) new-cells moved-into))))))\n```\n\n———————\n\n```\n\
  (ns wator.animal . . .)\n\n; . . .\n\n(defn do-move [animal loc world]\n  (let [neighbors\
  \ (world/neighbors world loc)\n        moved-into (get world :moved-into #{})\n\
  \        available-neighbors (remove moved-into neighbors)\n        destinations\
  \ (filter #(water/is?\n                               (water/is %))\n          \
  \                   neighbors)\n        new-location (if (empty? destinations)\n\
  \                       nil\n                       (rand-nth destinations))]\n\
  \    (if new-location\n      (set-cell world new-location animal)\n      nil)))\n\
  ```\n\n\n\n这要求我完善 `shark` 模块，并进行了一处微小的设计调整。我使用了**模板方法（Template Method）模式来获取动物的繁殖年龄。测试代码提示了这一变化：\n\
  \n点击此处查看代码图片\n\n```\n(context \"animal\"\n  (it \"moves\"\n    (doseq [scenario\
  \ \n             [{:constructor fish/make :tester fish/is?}\n              {:constructor\
  \ shark/make :tester shark/is?}]]\n      (let [animal ((:constructor scenario))\n\
  \            world (-> (world/make 3 3)\n                      (world/set-cell [1\
  \ 1] animal))\n            [from to] (animal/move animal [1 1] world)\n        \
  \    loc (first (keys to))]\n        (should (water/is? (get from [1 1])))\n   \
  \     (should ((:tester scenario) (get to loc)))\n        (should (#{[0 0] [0 1]\
  \ [0 2]\n                   [1 0] [1 2]\n                   [2 0] [2 1] [2 2]}\n\
  \                 loc)))))\n\n  (it \"doesn't move if there are no spaces\"\n  \
  \  (doseq [scenario \n             [{:constructor fish/make :tester fish/is?}\n\
  \              {:constructor shark/make :tester shark/is?}]]\n      (let [animal\
  \ ((:constructor scenario))\n            world (-> (world/make 1 1)\n          \
  \            (world/set-cell [0 0] animal))\n            [from to] (animal/move\
  \ animal [0 0] world)]\n        (should ((:tester scenario) (get to [0 0])))\n \
  \       (should (nil? from)))))\n  (it \"reproduces\"\n    (doseq [scenario \n \
  \            [{:constructor fish/make :tester fish/is?}\n              {:constructor\
  \ shark/make :tester shark/is?}]]\n      (let [animal ((:constructor scenario))\n\
  \            reproduction-age (animal/get-reproduction-age animal)\n           \
  \ animal (animal/set-age animal reproduction-age)\n            world (-> (world/make\
  \ 3 3)\n                      (world/set-cell [1 1] animal))\n            [from\
  \ to] (animal/reproduce animal [1 1] world)\n            from-loc (-> from keys\
  \ first)\n            from-cell (-> from vals first)\n            to-loc (-> to\
  \ keys first)\n            to-cell (-> to vals first)]\n        (should= from-loc\
  \ [1 1])\n        (should ((:tester scenario) from-cell))\n        (should= 0 (animal/age\
  \ from-cell))\n        (should (#{[0 0] [0 1] [0 2]\n                   [1 0] [1\
  \ 2]\n                   [2 0] [2 1] [2 2]}\n                 to-loc))\n       \
  \ (should ((:tester scenario) to-cell))\n        (should= 0 (animal/age to-cell)))))\n\
  \n  (it \"doesn't reproduce if there is no room\"\n    (doseq [scenario \n     \
  \        [{:constructor fish/make :tester fish/is?}\n              {:constructor\
  \ shark/make :tester shark/is?}]]\n      (let [animal ((:constructor scenario))\n\
  \            reproduction-age (animal/get-reproduction-age animal)\n           \
  \ animal (animal/set-age animal reproduction-age)\n            world (-> (world/make\
  \ 1 1)\n                      (world/set-cell [0 0] animal))\n            failed\
  \ (animal/reproduce animal [0 0] world)]\n        (should-be-nil failed))))\n\n\
  \  (it \"doesn't reproduce if too young\"\n    (doseq [scenario \n             [{:constructor\
  \ fish/make :tester fish/is?}\n              {:constructor shark/make :tester shark/is?}]]\n\
  \      (let [animal ((:constructor scenario))\n            reproduction-age (animal/get-reproduction-age\
  \ animal)\n            animal (animal/set-age animal (dec reproduction-age))\n \
  \           world (-> (world/make 3 3)\n                      (world/set-cell [1\
  \ 1] animal))\n            failed (animal/reproduce animal [1 1] world)]\n     \
  \   (should-be-nil failed)))))\n\n————————\n\n(ns wator.animal …)\n\n(defmulti move\
  \ (fn [animal & args] (::cell/type animal)))\n(defmulti reproduce (fn [animal &\
  \ args] (::cell/type animal)))\n(defmulti make-child ::cell/type)\n(defmulti get-reproduction-age\
  \ ::cell/type)\n\n; . . .\n\n————————\n\n(ns wator.fish . ....)\n\n(defmethod animal/get-reproduction-age\
  \ ::fish [fish]\n  config/fish-reproduction-age)\n\n; . . .\n\n——————\n\n(ns wator.shark\n\
  \  (:require [clojure.spec.alpha :as s]\n            [wator\n             [config\
  \ :as config]\n             [cell :as cell]\n             [animal :as animal]]))\n\
  (s/def ::shark (s/and #(= ::shark (::cell/type %))\n                      ::animal/animal))\n\
  (defn is? [cell]\n  (= ::shark (::cell/type cell)))\n\n(defn make []\n  {:post [(s/valid?\
  \ ::shark %)]}\n  (merge {::cell/type ::shark}\n         (animal)))\n\n(defmethod\
  \ animal/make-child ::shark [shark]\n  (shark/make))\n\n(defmethod animal/get-reproduction-age\
  \ ::shark [shark]\n  (animal/get-reproduction-age shark))\n\n(defmethod cell/tick\
  \ ::shark [shark loc]\n  (animal/tick loc))\n\n(defmethod cell/reproduce ::shark\
  \ [shark loc]\n  (animal/reproduce shark loc))\n\n; . .\n```\n\n\n\n我们创建了一个 2x1\
  \ 的 `world`（世界），其中一条 `shark`（鲨鱼）旁边有一条 `fish`（鱼）。经过一个 `tick`，`shark`应该出现在 `fish`\
  \ 之前的位置，`water`出现在 `shark` 之前的位置，并且 `shark` 的 `::health` 应该增加。\n\n为了让这段代码通过，我被迫放弃将逻辑委托给\
  \ `animal/tick`，因为 `shark` 应该先尝试 `reproduce`（繁殖），然后尝试 `eat`（进食），最后才尝试 `move`（移动）：\n\
  \n点击此处查看图片\n\n```\n(ns wator.shark . . .)\n\n(defn eat [shark loc world]\n  (let\
  \ [neighbors (world/neighbors world loc)\n        fishy-neighbors (filter #(fish/is?\n\
  \                                  (world/get-cell world %))\n                 \
  \               neighbors)]\n    (if (empty? fishy-neighbors)\n      nil\n     \
  \ [{loc (water/make)}\n       {(rand-nth fishy-neighbors) (feed shark)}]))\n  )\n\
  \n(defmethod cell/tick ::shark [shark loc world]\n  (if (= 1 (health shark))\n \
  \   [nil {loc (water/make)}]\n    (let [aged-shark (-> shark\n                 \
  \        (animal/increment-age)\n                         (decrement-health))]\n\
  \      (if-let [reproduction (animal/reproduce\n                              aged-shark\
  \ loc world)]\n        reproduction\n        (if-let [eaten (eat aged-shark loc\
  \ world)]\n          eaten\n          (animal/move aged-shark loc world))))))\n\
  ```\n\n这一切都很顺利地完成了。我们已经渡过了设计上的瓶颈，现在正在收获成果。\n\n建模师告诉我们，鲨鱼只有在健康值高于阈值时才会进行繁殖。让我们测试一下。事实上，让我们先做这个改动^(18)\
  \ 看看哪些测试会失败：\n\n18. TDD 违反！警告！警报！\n\n点击此处查看图片\n\n```\n(ns wator.shark . . .)\n\n\
  (defmethod animal/reproduce ::shark [shark loc world]\n  (if (>= (health shark)\
  \ config/shark-reproduction-health)\n    (animal/do-reproduce shark loc world)\n\
  \    nil))\n```\n\n正如所料，鲨鱼场景下的动物繁殖测试失败了。我们可以通过在那个测试中加入一个小黑科技（hack）来解决这个问题：\n\n点击此处查看图片\n\
  \n```\n(it \"reproduces\"\n  (doseq [scenario [{:constructor fish/make :tester fish/is?}\n\
  \                    {:constructor\n                       #(-> (shark/make)\n \
  \                           (shark/set-health\n                              (inc\
  \ config/shark-reproduction-\n                                   health)))\n   \
  \                  :tester shark/is?}]]\n\n; . . .\n```\n\n是的，这有点丑，但它起作用了。我想我应该添加一个测试来检查该阈值的另一侧情况：\n\
  \n点击此处查看图片\n\n```\n(it \"doesn't reproduce if not healthy enough\"\n  (let [shark\
  \ (-> (shark/make)\n                  (shark/set-health\n                    (dec\
