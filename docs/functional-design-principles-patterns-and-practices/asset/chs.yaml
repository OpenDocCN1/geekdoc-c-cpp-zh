  \ Bob。\n\n9。如果你使用固定电话，这现在可能仍然存在。\n\n![](img/c15f004.jpg)\n\n**图 15.4.** 电话系统中的竞态条件。\n\
  \n你看到哪里出错了了吗？那些交叉的线路就是问题所在。那就是竞态条件。电信公司尝试响起 Alice 的电话；但在声音产生之前，Alice 为了拨打 Bob 拿起听筒。从电信公司的角度来看，一切都是正常的。它响了电话，Alice\
  \ 接听了。于是，电信公司高兴地连接了 Bob 和 Alice。但 Alice 坐在那里等待拨号音；而 Bob 则很困惑，因为没有人打招呼，而且回铃音也停止了。\n\
  \n最可能的结果是双方在没有交流的情况下挂了电话。或者，Alice 可能会说些什么而 Bob 可能会回应，他们会陷入是谁打给谁的这种喜剧性循环。\n\n我们可以让我们的状态机模拟这种故障吗？这里是设置，再次以测试的形式提出：\n\
