  \n点击此处查看图片\n\n```\n(ns wator.shark . . .)\n\n(defmethod animal/reproduce ::shark\
  \ [shark loc world]\n  (if (< (health shark) config/shark-reproduction-health)\n\
  \    nil\n    (if-let [reproduction (animal/do-reproduce shark loc world)]\n   \
