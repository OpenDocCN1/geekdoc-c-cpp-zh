  \ new-1))\n      (should= :s2 (-> new-1 first))\n      (should= :s3 (-> new-1 second))))\n\
  ```\n\n### 快速浏览这段代码会让你相信，它是以传统的面向对象风格编写的，对象相对较地封装了它们的状态。在编写 Clojure 时，我并没有从草图开始。相反，我依赖\
  \ TDD 测试来帮助设计。测试如下：点击此处查看代码图片\n\n（注：此处 Clojure 代码块已按要求保留且不翻译）\n\n\n\n\n\n```clojure\n\
  (ns gossiping-bus-drivers-clojure.core\n  (:require [clojure.set :as set]))\n\n\
  (defn make-driver [name route rumors]\n  (assoc5 {} :name name :route (cycle6 route)\
  \ :rumors rumors))\n\n(defn move-driver [driver]\n  (update7 driver :route rest))\n\
  \n(defn move-drivers [world]\n  (map move-driver world))\n\n(defn get-stops [world]\n\
  \  (loop [world world\n         stops {}]\n    (if (empty? world)\n      stops\n\
  \      (let [driver (first world)\n            stop (first (:route driver))\n  \
  \          stops (update stops stop conj driver)]\n        (recur (rest world) stops)))))\n\
  \n(defn merge-rumors [drivers]\n  (let [rumors (map :rumors drivers)\n        all-rumors\
  \ (apply set/union8 rumors)]\n      (map #(assoc % :rumors all-rumors) drivers)))\n\
  \n(defn spread-rumors [world]\n  (let [stops-with-drivers (get-stops world)\n  \
  \      drivers-by-stop (vals9 stops-with-drivers)]\n    (flatten10 (map merge-rumors\
  \ drivers-by-stop))))\n\n(defn drive [world]\n  (-> world move-drivers spread-rumors))\n\
  \n(defn drive-till-all-rumors-spread [world]\n  (loop [world (drive world)\n   \
  \      time 1]\n    (cond\n      (> time 480) :never\n      (apply = (map :rumors\
  \ world)) time\n      :else (recur (drive world) (inc time)))))\n```\n\n5. `assoc`\
  \ 向 map 中添加元素。`(assoc {} :a 1)` 返回 `{:a 1}`。\n\n6. `cycle` 返回一个惰性的（且“无限的”）列表，它只是无休止地重复输入列表。因此，`(cycle\
  \ [1 2 3])` 返回 `[1 2 3 1 2 3 1 2 3 …]`。\n\n7. `update` 函数返回一个元素已改变的新 map。`(update\
  \ m k f a)` 通过应用函数 `(f e a)` 来改变 `m` 的 `k` 元素，其中 `e` 是元素 `k` 的旧值。因此，`(update {:x\
  \ 1} :x inc)` 返回 `{:x 2}`。\n\n8. `union` 函数来自 `set` 命名空间。注意顶部的 `ns` 将 `clojure.set`\
  \ 命名空间别名为 `set`。\n\n9. `vals` 返回 map 中所有值的列表。`keys` 返回 map 中所有键的列表。\n\n10. `flatten`\
  \ 函数将列表的列表转换为包含所有元素的列表。因此，`(flatten [[1 2][3 4]])` 返回 `[1 2 3 4]`。\n\n这个解决方案有 42\
  \ 行，而 Java 解决方案在五个文件中分布了 145 行。\n\n两种解决方案都具有 `Driver` 的概念，但我并没有尝试将 `Route`、`Stop`\
  \ 和 `Rumor` 的概念封装到独立的对象中。它们都快乐地存在于 `Driver` 之中。\n\n糟糕的是，`Driver` “对象”并不是传统 OO 意义上的对象。它没有方法。系统中只有一个方法\
  \ `move-driver`，它作用于单个 `Driver`，但它只是为更有趣的 `move-drivers` 函数提供的一个小辅助函数。\n\n八个函数中有六个只接受\
  \ `world` 作为参数。因此，我们可以说，这个系统中唯一的真对象是 `world`，它有五个方法。但即使这样也有些牵强。\n\n即使我们认为 `Driver`\
  \ 是一种对象，它也是不可变的。模拟的 `world` 仅仅是一个不可变 `Drivers` 列表。`drive` 函数接收 `world` 并产生一个新的 `world`，在那个新的\
  \ `world` 中，所有的 `Drivers` 都已移动了一步，并且在任何超过一个 `Driver` 到达的站点，Rumors 均已完成传播。\n\n那个\
  \ `drive` 函数是一个重要概念的示例。注意 `world` 如何通过一个函数流水线。在这种情况下，只有两个函数，`move-drivers` 和 `spread-rumors`，但在较大的系统中，流水线可能很长。在沿流水线的每个阶段，`world`\
  \ 都会被修改成略微新的形式。\n\n这告诉我们，这个系统的划分不是关于对象的，而是关于函数的。这种不怎么分块的数据从一个独立函数传递到下一个独立函数。\n\n\
  你可能会说 Java 代码相对直观，而 Clojure 代码太晦密且晦涩。请相信我，适应这种晦密程度并不需要长时间，而且感知到的晦涩感只是基于不陌生的错觉。\n\
  \nClojure 版本缺乏划分是一个问题吗？对于它目前的规模来说不是；但如果这个程序像大多数系统那样增长，那个问题就会以凶猛的姿态显现出来。划分 OO 程序比划分函数式程序要自然一点，因为分界线要明显得多且突出。\n\
  \n另一方面，我们为 Java 版本选择的分界线并不保证是有效的划分。\n\n## 结论\n\n我们看到了 `Prime Factors` 和 `Bowling\
  \ Game` kata 的差异，但差异相对较小。`Gossiping Bus Drivers` kata 的差异大得多。这可能是因为最后一个 kata 的规模大了一点（我说是两倍），而且它是真正的有限状态机。\n\
  \n*有限状态机*从状态移动到状态，取决于输入事件和当前状态。当此类系统以 OO 风格编写时，状态往往存储在具有方法的变变对象中。但在函数风格中，状态外部化在不可变数据结构中。\n\
  \n我们从中可以推断，简单计算的程序（如 `Prime Factors`）不受 OO 或函数式风格的影响。毕竟在状态改变限制在微小问题（如数组索引）的情况下，影响微乎其微。\n\
  \n## 9. 对象面向编程\n\ngraphics/09_unnum_objectoriented.jpg\n\n在前章中，我们看到 OO 编程风格与数据类型和数据内聚密切相关。但这些并不是面向对象的全部。事实上，数据内聚可能次于面向对象的另一个属性：多态。\n\
  \n在《整洁架构》中，(1) 我指出 OO 风格有三个属性：封装、继承和多态。然后我引导你通过推理得出，在这三者中，多态是最有益的。另外两个最好的也只是辅助性的。\n\
  \n\n\n\n\n-   佣金制员工每隔周五发放一次工资。他们的工资由基本工资加佣金组成。基本工资和佣金率是员工记录中的字段。佣金的计算方法是佣金率乘以该员工销售收据的总和。\n\
  \n-   时薪制员工每周五发放一次工资。他们的时薪是其员工记录中的一个字段。他们的工资计算方法是时薪乘以该周时间卡上的工时总和。如果总和大于 40 小时，剩余的小时将按时薪的\
  \ 1.5 倍支付。\n\n-   员工可以选择将工资单邮寄到家庭地址、留存在薪资管理员办公室或直接存入其银行账户。地址、薪资管理员和银行信息都是其员工记录中的字段。\n\
  \n该问题的典型对象（OO）解决方案在统一建模语言（UML）图图 9.1 中所示。\n\n![](img/c09f001.jpg)\n\n**图 9.1.**\
  \ 工资问题的对象模型\n\n也许最好的起点是 `Payroll` 类。在 Java 中，它有一个如下所示的 `run` 方法：\n\n点击此处查看图片\n\n\
  ```\nvoid run() {\n  for (Employee e : db.getEmployees()) {\n    if (e.isPayDay())\
  \ {\n      Pay pay = e.calcPay();\n      e.sendPay(pay);\n    }\n  }\n}\n```\n\n\
  我已经在很多次、许多地方（包括上述书籍）强调过，这段小代码段就是*纯粹的真理*。对于每个员工，如果今天是他们应该领取工资的日子，就计算他们的工资并发送给他们。\n\
  \n从这段小代码段中，其余的实现部分应该非常清晰。这里使用了三次 *Strategy*^(3)：一个用于实现 `calcPay`，另一个用于实现 `isPayDay`，最后一个用于实现\
  \ `sendPay`。\n\n3. Erich Gamma, Richard Helm, Ralph Johnson, and John Vlissides,\
  \ *Design Patterns：可重用面向对象软件元素* (Addison-Wesley, 1995), 315.\n\n同样清晰的是，这种对象结构必须由\
  \ `getEmployees` 函数构建，该函数从数据库中读取员工并对其进行妥善安排。数据库中的数据不太可能像这里看到的对象结构。\n\n还有一个非常清晰的架构边界（虚线）横越了所有继承关系，将高层抽象与低层细节隔离开。\n\
  \n### 函数式工资管理\n\n图 9.2 展示了这作为一个函数程序可能是什么样子。\n\n![](img/c09f002.jpg)\n\n**图 9.2.**\
  \ 工资问题的数据流图\n\n我选择数据流图（DFD）来表示函数式解决方案不是很有趣吗？DFD 在描述过程与数据元素之间的关系非常有帮助，但在描述架构决策时，它们远没有\
  \ UML 类图那么有用。\n\n尽管如此，DFD 仍然帮助我们提出了*纯粹真理*的函数式版本：\n\n点击此处查看图片\n\n```\n(defn payroll\
  \ [today db]\n  (let [employees (get-employees db)\n        employees-to-pay (get-employees-to-be-paid-today\n\
  \                            today employees)\n        amounts (get-paycheck-amounts\
  \ employees-to-pay)\n        ids (get-ids employees-to-pay)\n        dispositions\
  \ (get-dispositions employees-to-pay)]\n    (send-paychecks ids amounts dispositions)))\n\
  ```\n\n注意，这与 Java 版本的不同之处在于它不是一种迭代方法。相反，员工列表流经程序，根据数据流图在每个阶段被修改。这是函数式程序构思和编写的典型方式。函数式程序往往更像*管道*而不是分步骤的程序。它们调节并修改数据流，而不是逐步迭代数据。\n\
  \n那么，架构呢？在 OO 版本的 UML 图中有一个漂亮的架构边界。函数式版本中的架构边界在哪里？\n\n让我们深入观察一下。测试可能会给我们一些线索：\n\n\
  点击此处查看图片\n\n```\n(it \"pays one salaried employee at end of month by mail\"\n  (let\
  \ [employees [{:id \"emp1\"\n                    :schedule :monthly\n          \
  \          :pay-class [:salaried 5000]\n                    :disposition [:mail\
  \ \"name\" \"home\"]}]\n        db {:employees employees}\n        today (parse-date\
  \ \"Nov 30 2021\")]\n    (should= [{:type :mail\n               :id \"emp1\"\n \
  \              :name \"name\"\n               :address \"home\"\n              \
  \ :amount 5000}]\n             (payroll today db))))\n```\n\n在这个测试中，数据库包含一个 `employee`\
  \ 列表，每个 `employee` 是一个具有特定字段的哈希映射。这和对象没有太大，对吧？`payroll` 函数返回一个工资单指令列表，每个指令都是一个哈希映射——另一个对象。点击此处查看图片\n\
  \n```\n(it \"pays one employee on Friday\"\n  (let [employees [{:id \"empid\"\n\
  \                    :schedule :weekly\n                    :pay-class [:hourly\
  \ 15]\n                    :disposition [:deposit \"routing\" \"account\"]}]\n \
  \       time-cards {\"empid\" [[\"Nov 12 2022\" 80/10]]}\n        db {:employees\
  \ employees :time-cards time-cards}\n        friday (parse-date \"Nov 18 2022\"\
  )]\n    (should= [{:type :deposit\n               :id \"empid\"\n              \
  \ :routing \"routing\"\n               :account \"account\"\n               :amount\
  \ 120}]\n             (payroll friday db))))\n```\n\n4. 这不是 80 除以 10。相反，它是理数 `80/10`。这确保了后续数学计算不会将其视为整数。\n\
  \n这个测试展示了 `employee` 和 `paycheck-directive` 对象如何根据 `:schedule`、`:pay-class` 和 `:disposition`\
  \ 变化。它还显示数据库包含与 `id` 相关的 `time-card`。从此，第三个测试应该是可以预期的：点击此处查看图片\n\n```\n(it \"pays\
  \ one commissioned employee on an even Friday\"\n  (let [employees [{:id \"empid\"\
  \n                    :schedule :biweekly\n                    :pay-class [:commissioned\
  \ 100 5/100]\n                    :disposition [:paymaster \"paymaster\"]}]\n  \
  \      sales-receipts {\"empid\" [[\"Nov 12 2022\" 15000]]}\n        db {:employees\
  \ employees :sales-receipts sales-receipts}\n        friday (parse-date \"Nov 18\
  \ 2022\")]\n    (should= [{:type :paymaster\n               :id \"empid\"\n    \
  \           :paymaster \"paymaster\"\n               :amount 850}]\n           \
  \  (payroll friday db))))\n```\n\n\n\n\n```clojure\n(defn get-pay-class [employee]\n\
  \  (first (:pay-class employee)))\n\n(defn get-disposition [paycheck-directive]\n\
  \  (first (:disposition paycheck-directive)))\n\n(defmulti is-today-payday :schedule)\n\
  (defmulti calc-pay get-pay-class)\n(defmulti dispose get-disposition)\n\n(defn get-employees-to-be-paid-today\
  \ [today employees]\n  (filter5 #(is-today-payday % today) employees))\n\n(defn-\
  \ build-employee [db employee]\n  (assoc employee :db db))\n\n(defn get-employees\
  \ [db]\n  (map (partial6 build-employee db) (:employees db)))\n\n(defn create-paycheck-directives\
  \ [ids payments dispositions]\n  (map #(assoc {} :id %1 :amount %2 :disposition\
  \ %3)\n       ids payments dispositions))\n\n(defn send-paychecks [ids payments\
  \ dispositions]\n  (for7 [paycheck-directive\n        (create-paycheck-directives\
  \ ids payments dispositions)]\n    (dispose paycheck-directive)))\n\n(defn get-paycheck-amounts\
  \ [employees]\n  (map calc-pay employees))\n\n(defn get-dispositions [employees]\n\
  \  (map :disposition employees))\n\n(defn get-ids [employees]\n  (map :id employees))\n\
  ```\n\n- 5. `(filter predicate list)` 对 `list` 中的每个成员调用 `predicate`，并返回所有 `predicate`\
  \ 结果非 *falsey* 的成员序列。\n\n- 6. `partial` 函数接收一个函数和一些参数，并返回一个新函数，其中所有参数都已经被初始化。因此，`((partial\
  \ f 1) 2)` 等于 `(f 1 2)`。\n\n- 7. 在这种情况下，`for` 函数会对 `create-paycheck-directives`\
  \ 返回的列表中的每个 `paycheck-directive` 调用 `dispose`。\n\n你看到那些 `defmulti` 语句（**加粗**）了吗？它们与\
  \ Java 接口类似，尽管并不完全相同。每个 `defmulti` 都定义了一个多态函数。然而，该函数并不是根据内在类型进行分发（不像 Java、C# 甚至\
  \ Ruby 和 Python 那样）。相反，它们根据名称后紧指定的函数的结果进行分发。\n\n因此，`get-pay-class` 函数返回 `calc-pay`\
  \ 函数将进行多态分发的值。`get-pay-class` 返回什么？它返回 `employee` `pay-class` 字段的第一个元素。根据我们的测试，这些值是\
  \ `:salaried`、`:hourly` 和 `:commissioned`。\n\n那么 `calc-pay` 函数的实现在哪里？它们在程序的*靠后*：\n\
  \n点击此处查看代码图像\n\n```clojure\n(defn-8 get-salary [employee]\n  (second (:pay-class\
  \ employee)))\n\n(defmethod calc-pay :salaried [employee]\n  (get-salary employee))\n\
  \n(defmethod calc-pay :hourly [employee]\n  (let [db (:db employee)\n        time-cards\
  \ (:time-cards db)\n        my-time-cards (get9 time-cards (:id employee))\n   \
  \     [_ hourly-rate]10 (:pay-class employee)\n        hours (map second my-time-cards)\n\
  \        total-hours (reduce + hours)]\n    (* total-hours hourly-rate)))\n\n(defmethod\
  \ calc-pay :commissioned [employee]\n  (let [db (:db employee)\n        sales-receipts\
  \ (:sales-receipts db)\n        my-sales-receipts (get sales-receipts (:id employee))\n\
  \        [_ base-pay commission-rate] (:pay-class employee)\n        sales (map\
  \ second my-sales-receipts)\n        total-sales (reduce + sales)]\n    (+ (* total-sales\
  \ commission-rate) base-pay)))\n```\n\n- 8. 结尾的 `-` 这是一个私有函数，因此只有该文件中的函数可以访问它。\n\
  \n- 9. `(get m k)` 返回映射 `m` 中 `k` 的值。\n\n- 10. *解构* `employee` 的 `pay-class` 并忽略第一个元素。\n\
  \n我将 *further down* 一词使用了斜体，是因为这在 Clojure 程序中非常重要。Clojure 程序不能调用在调用点之后声明的函数。但这些函数*确实*是在调用点之后声明的。这意味着存在源码依赖倒置。`calc-pay`\
  \ 的实现被 `payroll` 函数调用；但 `payroll` 函数又位于 `calc-pay` 实现之上。\n\n事实上，我可以将 `defmulti`\
  \ 函数的所有实现移动到另一个源文件中，而 `payroll` 源文件并不 `require` 该文件。\n\n如果我们画出这些源文件之间的关系，就会得到图 9.3\
  \ 中的图。\n\n![](img/c09f003.jpg)\n\n**图 9.3.** 依赖倒置\n\n箭头描述了源文件之间的 `requires` 关系。`payroll`\
  \ 中这些 `requires` 的源码如下：\n\n```clojure\n(ns payroll\n  (:require [payroll-interface\
  \ :refer [is-today-payday calc-pay]]))\n```\n\n\n\n\n特别是在 Clojure 中，命名空间（namespaces）和源文件是紧密相关的。每个命名空间必须包含在自己的源文件中，且该文件名必须与命名空间的名称对应。这与\
  \ Java 强制将公共类放入以类命名的源文件中非常相似。这与 `C++` 和 `C#` 程序员使用的文件/类约定也非常相似。这可能会让你通过一个简单的翻译算法，认为每个\
  \ Clojure 命名空间都是类似于“类”的东西。\n\n当然，这种对应关系并非完美。Clojure 命名空间的内容完全不需要像类。但总的来说，这个概念并不是坏主意。\n\
  \n在像 Clojure 这样的函数式语言中，巨大的诱惑之一是以某种随意的、凭感觉的方式将函数分组到命名空间。由于没有面向对象（OO）结构来强制我们将函数划分为存在独立源文件的类，我们往往得到的源文件结构比应该有的更松散、更脆弱。\n\
  \n因此，在编写函数式程序时，考虑面向对象的划分原则并继续应用它们并不是一个坏主意。在我们之后研究原则、模式和架构时，将会看到更多内容。\n\n## 结论\n\n\
  首先，函数式程序和面向对象程序是不同的。函数式程序倾向于是调节数据流转换的管道构造，而可变的面向对象程序则倾向于对对象进行逐步迭代。然而，从架构的角度来看，这两种风格是非常兼容的。事实证明，我们可以将函数式程序的函数划分为与\
  \ OO 程序相同的具有架构意义的元素。从架构的角度来看，它们之间几乎没有区别。\n\n函数式程序可能不是由语法强制的封装方法并定义对象的类组成的。然而，对象在函数式程序中仍然存在。这些对象与操作它们的函数绑定程度没有在面向对象语言中那么紧密。这是优势还是劣势，我们将在后续章节中继续探讨。\n\
  \n我们将看到，随着这些页面越来越转向设计和架构，函数式程序与不可变对象的面向对象之间的差异将变得越来越不相关。\n\n# 10 种类\n\n![](img/10_unnum_types.jpg)\n\
  \n上一章可能让你感到有些困惑。我称之为对象的那些其实只是哈希映射（hash maps），并且完全没有类型。任何人都可以向它们放入任何东西，而没有任何任何限制。`:pay-class`\
  \ 中的薪水可以是一个字符串而不是数字。`:schedule` 字段可以是一个整数而不是适当的关键字。\n\n简之，这些对象不是静态类型的。编译器不检查它们。因此，一切都会陷入混乱！\n\
  \n许多函数式语言以及许多面向对象语言都是静态类型的，以防止这种混乱。其他语言如 `Clojure`、`Python` 和 `Ruby` 则依赖于其他机制来防止这种混乱。\n\
  \n我们这些实践 TDD（测试驱动开发）的人通常并不担心这种混乱。我们的测试通常能确保我们传递的对象是正确构造的。尽管如此，在复杂系统中，所有对象的整体可能会变得非常复杂，我们需要一种更正式、更完整的方式来确保类型完整性，而不是动态类型语言（甚至是大多数静态类型语言）所能提供的。\n\
  \n在 Clojure 中，我使用 `clojure.spec` 库来实现类型完整性的目标。我们工资示例的类型规范如下：\n\n```\n(s/def ::id\
  \ string?)\n(s/def ::schedule #{:monthly :weekly :biweekly})\n(s/def ::salaried-pay-class\
  \ (s/tuple #(= % :salaried) pos1?))\n(s/def ::hourly-pay-class (s/tuple #(= % :hourly)\
  \ pos?))\n(s/def ::commissioned-pay-class (s/tuple #(= % :commissioned)\n      \
  \                                   pos? pos?))\n(s/def ::pay-class (s/or :salaried\
  \ ::salaried-pay-class\n                         :Hourly ::hourly-pay-class\n  \
  \                       :Commissioned ::commissioned-pay-class))\n(s/def ::mail-disposition\
  \ (s/tuple #(= % :mail) string? string?))\n(s/def ::deposit-disposition (s/tuple\
  \ #(= % :deposit)\n                                      string? string?))\n(s/def\
  \ ::paymaster-disposition (s/tuple #(= % :paymaster)\n                         \
  \               string?))\n(s/def ::disposition (s/or :mail ::mail-disposition\n\
  \                           :deposit ::deposit-disposition\n                   \
  \        :paymaster ::paymaster-disposition))\n(s/def ::employee (s/keys :req-un\
  \ [::id ::schedule\n                                   ::pay-class ::disposition]))\n\
  (s/def ::employees (s/coll-of ::employee))\n\n(s/def ::date string?)\n(s/def ::time-card\
  \ (s/tuple ::date pos?))\n(s/def ::time-cards (s/map-of ::id (s/coll-of ::time-card)))\n\
  \n(s/def ::sales-receipt (s/tuple ::date pos?))\n(s/def ::sales-receipts (s/map-of\n\
  \                           ::id (s/coll-of ::sales-receipt)))\n\n(s/def ::db (s/keys\
  \ :req-un [::employees]\n                    :opt-un [::time-cards ::sales-receipts]))\n\
  \n(s/def ::amount pos?)\n(s/def ::name string?)\n(s/def ::address string?)\n(s/def\
  \ ::mail-directive (s/and #(= (: %) :mail)\n                               (s/keys\
  \ :req-un [::id\n                                                ::name\n      \
  \                                          ::address\n                         \
  \                       ::amount])))\n\n(s/def ::routing string?)\n(s/def ::account\
  \ string?)\n(s/def ::deposit-directive (s/and #(= (: %) :deposit)\n            \
  \                      (s/keys :req-un [::id\n                                 \
  \                  ::routing\n                                                 \
  \  ::account\n                                                   ::amount])))\n\
  (s/def ::paymaster string?)\n(s/def ::paymaster-directive (s/and #(= (: %) :paymaster)\n\
  \                                    (s/keys :req-un [::id\n                   \
  \                                  ::paymaster\n                               \
  \                      ::amount])))\n\n(s/def ::paycheck-directive (s/or\n     \
  \                         :mail ::mail-directive\n                             \
  \ :deposit ::deposit-directive\n                              :paymaster ::paymaster-directive))\n\
  \n(s/def ::paycheck-directives (s/coll-of ::paycheck-directive))\n```\n\n`(pos?\
  \ x)` 如果 `x` 是一个大于零的数字，则返回 true。\n\n\n\n\n随着我们不断深入，我们看到 `::employee` 是一个哈希映射，要求包含键\
  \ `:id`、`:schedule`、`:pay-class` 和 `:disposition`。继续探索你会发现 `:id` 必须是字符串；`:schedule`\
  \ 必须是 `:monthly`、`:weekly` 或 `:biweekly` 之一；而 `:salaried-pay-class` 是一个元组，包含 `:salaried`\
  \ 以及随后的一个正数。\n\n`s/or` 语句可能会让你有些困惑。参数是成对出现的，每对中的第一个只是该备选方案的名称。因此，在 `::disposition`\
  \ 定义中，`:mail` 只是 `::mail-disposition` 备选方案的名称。不用担心，如果你某天决定阅读 `clojure.spec` 的文档，一切都会变得清晰。\n\
  \n那么，既然有了如此详尽的类型规范，我们如何使用它呢？我有时会在测试中如下使用：\n\n点击此处查看代码图像\n\n```\n(it \"pays one salaried\
  \ employee at end of month by mail\"\n  (let [employees [{:id \"emp1\"\n       \
  \             :schedule :monthly\n                    :pay-class [:salaried 5000]\n\
  \                    :disposition [:mail \"name\" \"home\"]}]\n        db {:employees\
  \ employees}\n        today (parse-date \"Nov 30 2021\")]\n    (should (s/valid?\
  \ ::db db))\n    (let [paycheck-directives (payroll today db)]\n      (should (s/valid?\
  \ ::paycheck-directives \n                     paycheck-directives))\n      (should=\
  \ [{:type :mail\n                 :id \"emp1\"\n                 :name \"name\"\n\
  \                 :address \"home\"\n                 :amount 5000}]\n         \
  \      paycheck-directives))))\n```\n\n寻找对 `s/valid?` 的调用，该函数在数据匹配规范时返回 true。仔细看，你会发现我进输入时检查了\
  \ `::db` 规范，在输出时检查了 `::paycheck-directives` 规范。这非常安全。如果我的测试覆盖率很高，并且它们都检查了所调用函数的输入和输出规范，那么类型违规的情况将极其罕见。\n\
  \n偶尔，我还会使用 Clojure 的 `:pre` 和 `:post` 功能，在应用程序的主处理函数执行前后对关键数据运行规范。\n\n例如，这里是我几年前写的一个\
  \ `spacewar`^(2) 游戏的主处理步骤：\n\n2. [`github.com/unclebob/spacewar`](https://github.com/unclebob/spacewar)\n\
  \n点击此处查看代码图像\n\n```\n(defn update-world [ms world]\n  ;{:pre [(valid-world? world)]\n\
  \  ; :post [(valid-world? %)]}\n  (->> world\n       (game-won ms)\n       (game-over\
  \ ms)\n       (ship/update-ship ms)\n       (shots/update-shots ms)\n       (explosions/update-explosions\
  \ ms)\n       (clouds/update-clouds ms)\n       (klingons/update-klingons ms)\n\
  \       (bases/update-bases ms)\n       (romulans/update-romulans ms)\n       (view-frame/update-messages\
  \ ms)\n       (add-messages)))\n```\n\n`:pre` 和 `:post` 语句被注释掉了，^(3)，但如果我怀疑某种糟糕的类型损坏，它们随时准备好重新断言。\n\
  \n3. 我不太喜欢注释掉的代码。随着项目的成熟，我会删除这些行。\n\n## 结论\n\n关于静态类型与动态类型之争，存在许多哀嚎和切齿。双方都在向对方大吼，而不听听对方在说什么。我认为双方都有道理。动态类型让代码更容易编写。静态类型让代码更安全、更容易理解，并且在内部一致性上高得多。在我看来，像\
  \ `clojure.spec` 这样的库达成了极佳的平衡。它让你拥有根据需要进行尽可能多或尽可能少类型检查的能力。它允许你指定何时*检查*类型，何时*不检查*。此外，它还允许你指定任何静态类型系统都*无法*检查的动态约束。因此，对我来说，这样的库带给你比两者兼得更好的体验。\n\
  \n# III\n\n# 函数式设计\n\n## 11\n\n## 数据流\n\n![](img/11_unnum_dataflow.jpg)\n\n在第 9\
  \ 章面向对象编程中，我建议函数式程序的设计更像管道而不是过程。它有明确的数据流偏向。这是因为我们倾向于使用 `map`、`filter` 和 `reduce`\
  \ 将列表内容转换为其他列表，而不是逐个元素迭代问题以产生结果。\n\n我们在之前的许多例子中都能看到这种偏向，包括第二部分 比较分析中的保龄球游戏、八卦的巴士司机和薪资发放应用程序。\n\
  \n另一个例子，考虑来自 2022 年 Advent of Code 第十天的这个有趣问题^(1)。目标是在 6x40 的屏幕上渲染像素。像素根据时钟电路从左到右一个一个地绘制。时钟周期从\
  \ 0 开始计数。如果某个寄存器 `x` 匹配时钟周期数，则相应屏幕位置的像素打开；否则，关闭。\n\n1. [`adventofcode.com/2022/day/10`](https://adventofcode.com/2022/day/10)\n\
  \n这实际上是旧 CRT^(2) 显示器工作的一种典型方式。你必须在电子束扫描屏幕的恰好时刻对其励电。因此，你将位图中的位与驱动该束的时钟匹配。如果根据时钟，位是\
  \ 934，则相应屏幕位置的像素被打开；否则关闭。\n\n2. 阴极射线。*阴极射线*是电子。CRT 拥有电子枪，产生电子束，通过周期变化的磁场在屏幕上扫描。电子束击中屏幕上的荧光粉使其发光，从而创建栅格图像。\n\
  \nAdvent of Code 问题更有趣一点。它要求我们模拟一个简单的处理器，它有两个指令。第一个指令是 `noop`，占用一个时钟周期但没有其他影响。另一个指令是\
  \ `addx`，它接受一个整数参数 `n` 并将其加入处理器的 `x` 寄存器。该指令消耗两个时钟周期，并在两个周期完成后才修改 `x` 寄存器。如果在该周期开始时\
  \ `x` 寄存器匹配时钟周期，屏幕上的像素在该周期内可见。\n\n所以如果根据时钟，电子束位于位置 23，且在周期 23 开始时 `x` 寄存器为 23，则在该周期内激发电子束。\n\
  \n为了让情况稍微复杂一点，`x` 寄存器与时钟周期的匹配被放宽，使得 22、23 和 24 匹配时钟周期 23。也就是说，`x` 寄存器指定了一个三像素宽的窗口。只要时钟周期落在窗口内，电子束就会被激发。\n\
  \n由于屏幕宽 40 像素，高 6 像素，时钟周期与 `x` 的匹配是模 40。\n\n任务是执行一组指令并产生六个每个 40 个字符的字符串，其中 `#\"\
  ` 表示可见的像素，`.\"` 表示不可见的像素。\n\n如果你用 Java、C、Go、C++、C# 或任何其他过程/面向对象的语言编写此程序，可能会创建一个循环，每次迭代一次周期，积累每个周期的相应像素。循环会消耗指令并按照指示修改\
  \ `x` 寄存器。\n\n这是一个典型的 Java 示例：\n\n点击此处查看代码图像\n\n\n\n\n\n```\npackage crt;\n\npublic\
  \ class Crt {\n  private int x;\n  private String pixels = \"\";\n  private int\
  \ extraCycles = 0;\n  private int cycle = 0;\n  private int ic;\n  private String[]\
  \ instructions;\n  public Crt(int x) {\n    this.x = x;\n  }\n\n  public void doCycles(int\
  \ n, String instructionsLines) {\n    instructions = instructionsLines.split(\"\\\
  n\");\n    ic = 0;\n    for (cycle = 0; cycle < n; cycle++) {\n      setPixel();\n\
  \      execute();\n    }\n  }\n\n  private void execute() {\n    if (instructions[ic].equals(\"\
  noop\"))\n      ic++;\n    else if (instructions[ic].startsWith(\"addx \")\n   \
  \          && extraCycles == 0) {\n      extraCycles = 1;\n    }\n    else if (instructions[ic].startsWith(\"\
  addx \")\n             && extraCycles == 1) {\n      extraCycles = 0;\n      x +=\
  \ Integer.parseInt(instructions[ic].substring(5));\n      ic++;\n    } else\n  \
  \    System.out.println(\"TILT\");\n  }\n\n  private void setPixel() {\n    int\
  \ pos = cycle % 40;\n    int offset = pos - x;\n    if (offset >= -1 && 1 >= offset)\n\
  \      pixels += \"#\";\n    else\n      pixels += \".\";\n  }\n\n  public String\
  \ getPixels() {\n    return pixels;\n  }\n\n  public int getX() {\n    return x;\n\
  \  }\n}\n```\n\n注意所有的可变状态。注意它是如何一个周期一个周期地填充 `pixels` 的。还要注意 `extraCycles` 的奇妙处理，它是为了考虑到\
  \ `addx` 需要两个周期才能执行这一事实。\n\n最后，请注意尽管程序很好地划分成了几个较小的函数，但这些函数都是通过可变状态变量耦合在一起的。当然，这正是可变类中方法的常态。\n\
  \n我今天用 Clojure 解决了这个问题。我得出的解决方案与上面的 Java 代码非常不同。在阅读这里时请记住从底部开始看。Clojure 程序总是从自底向上编写的。\n\
  \n点击此处查看代码图片\n\n```\n(ns day10-cathode-ray-tube.core\n  (:require [clojure.string\
  \ :as string]))\n\n(defn noop [state]\n  (update state :cycles conj (:x state)))\n\
  \n(defn addx [n state]\n  (let [{:keys [x cycles]} state]\n    (assoc state :x (+\
  \ x n)\n                 :cycles (vec (concat cycles [x x])))))\n\n(defn execute\
  \ [state lines]\n  (if (empty? lines)\n    state\n    (let [line (first lines)\n\
  \          state (if (re-matches #\"noop\" line)\n                  (noop state)\n\
  \                  (if-let [[_ n] (re-matches\n                                \
  \   #\"addx (-?\\d+)\" line)]\n                    (addx (Integer/parseInt n) state)\n\
  \                    \"TILT\"))]\n      (recur state (rest lines)))))\n\n(defn execute-file\
  \ [file-name]\n  (let [lines (string/split-lines (slurp file-name))\n        starting-state\
  \ {:x 1 :cycles []}\n        ending-state (execute starting-state lines)]\n    (:cycles\
  \ ending-state)))\n\n(defn render-cycles [cycles]\n  (loop [cycles cycles\n    \
  \     screen \"\"\n         t 0]\n    (if (empty? cycles)\n      (map #(apply str\
  \ %) (partition 40 40 \"\" screen))\n      (let [x (first cycles)\n            offset\
  \ (- t x)\n            pixel? (<= -1 offset 1)\n            screen (str screen (if\
  \ pixel? \"#\" \".\"))\n            t (mod (inc t) 40)]\n        (recur (rest cycles)\
  \ screen t)))))\n\n(defn print-screen [lines]\n  (doseq [line lines]\n    (println\
  \ line))\n  true)\n\n(defn -main []\n  (-> \"input\"\n      execute-file\n     \
  \ render-cycles\n      print-screen))\n```\n\n3。`TILT` 是我最喜欢的错误信息。很久以前，弹珠机如果你从物理上倾斜机器来操纵球，它就会显示这条信息并取消你的游戏。\n\
  \n`execute-file` 函数将命名文件中的指令列表转换为结果 `x` 值的列表。然后 `render-cycles` 函数将 `x` 值的列表转换为像素列表，最后它将其\
  \ `partition` 分成 40 个字符的字符串。\n\n注意，当然，这里没有可变变量。相反的，`state` 值像流过管道一样，流经了每个函数。\n\n\
  `state` 值从 `execute-file` 开始，然后流向 `execute`，然后反复流向 `noop` 或 `addx`，然后回到 `execute`，最后回到\
  \ `execute-file`。在流流的每个阶段，都会从旧值中创建一个新的 `state` 值，而不改变旧值。\n\n如果你觉得这听起来异常地熟悉，那它确实如此。这非常像我们在命令行\
  \ Shell 中已经习惯的管道（pipes）和过滤器（filters）。数据从管道流入一个命令，经过该命令转换，然后流出。\n\n\n\n\n\n这些人员可以分为被称为\
  \ `roles`（角色）或 `actors`（参与者）的组。一个参与者是指一个人或一组人，他们对系统有相同的需求。他们所请求的变化类型将是一致的。相反，不同的参与者有不同的需求。一个参与者请求的变化对系统的影响与其他参与者所请求的变化的影响截不相同。这些迥异的变化甚至可能是背道而驰的。\n\
  \n当一个模块负责多个参与者时，这些相互竞争的参与者所请求的变化可能会相互干扰。这种干扰通常会导致 `fragility`（脆弱性）这一设计气味，导致系统在进行简单更改时以意想不到的方式崩溃。\n\
  \n对于经理和客户来说，没有什么比系统在进行简单功能更改后突然以惊人的方式出错更令他们恐惧的。如果这种情况频繁发生，他们得出的唯一结论就是开发人员已经失去了对系统的控制，并且不知道自己在做什么。\n\
  \n违反 `SRP` 可能仅仅是如在同一个模块中混合 GUI 格式化代码和业务规则代码。也可能复杂如在数据库中使用存储过程来实现业务规则。\n\n这里有一个用\
  \ Clojure 编写的糟糕 SRP 违反的简单示例。首先，让我们看看测试，因为它们讲述了故事：\n\n点击此处查看代码图像\n\n```\n(describe\
  \ \"Order Entry System\"\n  (context \"Parsing Customers\"\n    (it \"parses a valid\
  \ customer\"\n      (should=\n        {:id \"1234567\"\n         :name \"customer\
  \ name\"\n         :address \"customer address\"\n         :credit-limit 50000}\n\
  \        (parse-customer\n          [\"Customer-id: 1234567\"\n           \"Name:\
  \ customer name\"\n           \"Address: customer address\"\n           \"Credit\
  \ Limit: 50000\"])))\n\n    (it \"parses invalid customer\"\n      (should= :invalid\n\
  \               (parse-customer\n                 [\"Customer-id: X\"\n        \
  \          \"Name: customer name\"\n                  \"Address: customer address\"\
  \n                  \"Credit Limit: 50000\"]))\n      (should= :invalid\n      \
  \         (parse-customer\n                 [\"Customer-id: 1234567\"\n        \
  \          \"Name: \"\n                  \"Address: customer address\"\n       \
  \           \"Credit Limit: 50000\"]))\n      (should= :invalid\n              \
  \ (parse-customer\n                 [\"Customer-id: 1234567\"\n                \
  \  \"Name: customer name\"\n                  \"Address: \"\n                  \"\
  Credit Limit: 50000\"]))\n      (should= :invalid\n               (parse-customer\n\
  \                 [\"Customer-id: 1234567\"\n                  \"Name: customer\
  \ name\"\n                  \"Address: customer address\"\n                  \"\
  Credit Limit: invalid\"])))\n    (it \"makes sure credit limit is <= 50000\"\n \
  \     (should= :invalid\n               (parse-customer\n                 [\"Customer-id:\
  \ 1234567\"\n                  \"Name: customer name\"\n                  \"Address:\
  \ customer address\"\n                  \"Credit Limit: 50001\"])))))\n```\n\n第一个测试告诉我们，正在将某些文本输入解析为客户记录。该记录有四个字段：`id`、`name`、`address`\
  \ 和 `credit-limit`。接下来的四个测试告诉我们关于语法错误的信息，如输入缺失或格式不正确。\n\n最后一个测试是有意思的。它测试了一个业务规则。在解析输入时中测试业务规则是明显的\
  \ SRP 违反。解析代码可以安全地验证语法错误，但它应该避免所有的 `semantic`（语义）检查，因为这些检查属于另一个参与者的范畴。指定输入格式的参与者与指定最大允许信用限额的参与者不是同一个人。(3)\n\
  \n3。即使这两个参与者是同一个人，事实也是成立的。在这种情况下，这个人扮演了两个不同的角色。\n\n通过这些测试的代码加剧了问题：\n\n点击此处查看代码图像\n\
  \n```\n(defn validate-customer\n  [{:keys [id name address credit-limit] :as customer}]\n\
  \  (if (or (nil? id)\n          (nil? name)\n          (nil? address)\n        \
  \  (nil? credit-limit))\n    :invalid\n    (let [credit-limit (Integer/parseInt\
  \ credit-limit)]\n      (if (> credit-limit 50000)\n        :invalid\n        (assoc\
  \ customer :credit-limit credit-limit)))))\n\n(defn parse-customer [lines]\n\n \
  \ (let [[_ id] (re-matches #\"^Customer-id: (\\d{7})$\"\n                      \
  \     (nth lines 0))\n        [_ name] (re-matches #\"^Name: (.+)$\" (nth lines\
  \ 1))\n        [_ address] (re-matches #\"^Address: (.+)$\" (nth lines 2))\n   \
  \     [_ credit-limit] (re-matches #\"^Credit Limit: (\\d+)$\"\n               \
  \                      (nth lines 3))]\n    (validate-customer\n      {:id id\n\
  \       :name name\n       :address address\n       :credit-limit credit-limit})))\n\
  ```\n\n看 `validate-customer` 函数是如何将语法检查与限制信用限额的语义业务规则混合在一起的。\n\n更糟糕的是，考虑一个诚实使用 `clojure/spec`\
  \ 来定义 `customer` 类型的程序员：\n\n点击此处查看代码图像\n\n```\n(s/def ::customer (s/keys\n     \
  \               :id s/string?\n                    :name s/string?\n           \
  \         :address s/string?\n                    :credit-limit (s/and int?\n  \
  \                                     #(<= % 50000))))\n```\n\n该规范正确地约束了数据在语法上是正确的；但它也施加了信用限额不能超过\
  \ 50000 的语义规则。\n\n为什么要担心将限额限制与数据的语法混合在一起？是因为我预计数据的语法和限额限制是由不同的参与者指定的。而且预计这些参与者会在不同的时间请求更改。我不希望语法的更改意外破坏业务规则。\n\
  \n当然，这引出了一个问题：语义验证应该在哪里？答案是，语义验证应该位于可能更改它们的模块中。例如，如果有一个规定信用限额不能超过 50000 的业务规则，那么执行代码应该放在处理所有信用限额的模块中。\n\
  \n### 开闭原则 (OCP)\n\n![](img/13_unnum_ocp.jpg)\n\n`OCP` 由 Bertrand Meyer 在其 1988\
  \ 年的经典著作《面向对象的软件构造》中首次提出。(4) 转述一下，这意味着软件模块应该是扩展开放的，对修改关闭的。这意味着你希望设计你的模块，使得扩展或更改其行为不需要修改其代码。\n\
  \n这听起来可能自矛盾，但实际上是我们一直在做的事情。例如，考虑 C 语言中的 `copy` 程序：\n\n点击此处查看代码图像\n\n```c\nvoid copy()\
  \ {\n  int c;\n  while ((c = getchar()) != EOF)\n    putchar(c);\n}\n```\n\n该程序从\
  \ `stdin` 复制字符到 `stdout`。我随时可以向操作系统添加新设备。例如，我可以向系统添加光学字符识别 (OCR) 和文本语音合成器。这个程序仍然会正常运行而不会报错，并乐意地将字符从\
  \ OCR 复制到语音合成器，而无需进行任何修改或重新编译。\n\n\n\n\n这是一个非常强大的想法，允许我们将高层策略与低层细节分离，并保持高层策略不受低层细节变化的影响。然而，这意味着高层策略通过抽象层来访问低层细节。\n\
  \n在面向对象（OO）程序中，我们通常通过多态接口来创建该抽象层。在 Java、C# 和 C++ 等静态类型语言中，这些接口是带有抽象方法的类^(5)。高层策略通过这些接口访问实现或继承了这些接口的低层细节。\n\
  \n5。Java 和 C# 中的 `interface` 关键字定义了每个方法都为抽象的类。\n\n在 Python 和 Ruby 等动态类型面向对象语言中，这些接口是鸭子类型（duck\
  \ types）。`鸭子类型`在语言中没有特定的语法。它们仅仅是由高层策略调用并由低层细节实现的函数签名集合。动态类型系统通过匹配这些签名在运行时确定多态分发。\n\
  \n某些函数式语言（如 F# 和 Scala）构建在面向对象的基础上，因此可以利用该基础的多态接口。但函数式语言长期以来一直另一种创建 OCP 抽象层的机制：函数。\n\
  \n## 函数\n\n考虑这个简单的 Clojure 程序：\n\n点击此处查看代码图片\n\n```\n(defn copy [read write]\n \
  \ (let [c (read)]\n    (if (= c :eof)\n      nil\n      (recur read (write c)))))\n\
  ```\n\n这在本质上与 C 语言编写的 `copy` 程序相同，只是读和写函数被作为参数传递了^(6)。尽管如此，OCP 的抽象层仍然保持完整。\n\n6.\
  \ 作为参数传递的函数或作为函数返回值的函数有时被称为`高阶函数`。\n\n顺便说一下，我使用以下测试了这个程序。我觉得你会发现这很有趣。\n\n点击此处查看代码图片\n\
  \n```\n(def str-in (atom nil))\n(def str-out (atom nil))\n\n(defn str-read []\n\
  \  (let [c (first @str-in)]\n    (if (nil? c)\n      :eof\n      (do\n        (swap!\
  \ str-in rest)\n        c))))\n\n(defn str-write [c]\n  (swap! str-out str c)\n\
  \  str-write)\n\n(describe \"copy\"\n  (it \"can read and write using str-read and\
  \ str-write\"\n    (reset! str-in \"abcedf\")\n    (reset! str-out \"\")\n    (copy\
  \ str-read str-write)\n    (should= \"abcdef\" @str-out)))\n```\n\n我使用 `atom` 是因为\
  \ I/O 是一种副作用，不是纯函数。毕竟，当你从输入读取或向输出写入时，你正在改变它们的状态。因此，低层 I/O 函数不是纯函数，并使用软件事务内存（Software\
  \ Transactional Memory）来管理状态的变更。\n\n### 带有虚函数表（Vtables）的对象\n\n对于那些渴望面向对象编程同学，可以使用以下技术向\
  \ `copy` 传递一个“对象”：\n\n点击此处查看代码图片\n\n```\n(defn copy [device]\n  (let [c ((:getchar\
  \ device))]\n    (if (= c :eof)\n      nil\n      (do\n        ((:putchar device)\
  \ c)\n        (recur device)))))\n```\n\n测试简单地加载了带有函数的设备映射：\n\n点击此处查看代码图片\n\n```\n\
  (it \"can read and write using str-read and str-write\"\n    (reset! str-in \"abcedf\"\
  )\n    (reset! str-out \"\")\n    (copy {:getchar str-read :putchar str-write})\n\
  \    (should= \"abcdef\" @str-out))\n```\n\nC++ 程序员会识别出 `device` 参数仅仅是一个虚函数表（vtable）——这是\
  \ C++ 中的多态机制。无论如何，显而易见的是你可以为 `copy` 程序定义许多不同的设备。你可以在不修改它的情况下扩展 `copy` 的行为。\n\n###\
  \ 多方法（Multi-methods）\n\n该主题的另一个变体是使用多方法。许多语言（无论是函数式的还是其他的）都以某种方式支持多方法。`多方法`是鸭子类型的另一种形式，因为它们创建了一组松散的方法，根据它们的函数签名和参数的“类型”^(7)进行动态分发。\n\
  \n7.我在这里使用引号是因为参数的“类型”并不一定与其特定的数据类型相关。事实上，那个“类型”可以是一个完全不同的概念。\n\n在 Clojure 中，我们使用传统的`分发函数`（dispatching\
  \ function）方法来指定该“类型”：\n\n点击此处查看代码图片\n\n```\n(defmulti getchar (fn [device] (:device]))\n\
  ```\n\n\n\n该协议将成为一个 Java `interface`，可以独立编译成 `jar` 文件以进行动态加载。该协议的实现（如下所示）同样可以独立编译和加载：\n\
  \n点击此处查看代码图片\n\n```\n(defrecord str-device [in-atom out-atom]\n  device\n  (getchar\
  \ [_]\n    (let [c (first @in-atom)])\n      (if (nil? c)\n        :eof\n      \
  \  (do\n          (swap! in-atom rest)\n          c))))\n\n  (putchar [_ c]\n  \
  \  (swap! out-atom str c)))\n\n(describe \"copy\"\n  (it \"使用 str-read 和 str-write\
  \ 进行读写\"\n    (let [device (->str-device (atom \"abcdef\") (atom nil))]\n      (copy\
  \ device)\n      (should= \"abcdef\" @(:out-atom device)))))\n```\n\n注意测试中的 `->str-device`\
  \ 函数。它本质上是实现 `device` 协议的 `str-device` 类的 Java 构造函数。同样注意，我像上一个示例一样将 `atom` 加载到了设备中。\n\
  \n事实上，我并没有为了让这个示例运行而修改 `copy` 程序。`copy` 程序与多方法（multi-method）示例中的完全一致。这就是 OCP 的用处！\n\
  \n如果觉得 Clojure 的协议/记录机制看起来像面向对象（OO），那是因为它确实是 OO。JVM 是一个 OO 基础，而 Clojure 非常完美地构建在该基础之上。\n\
  \n### 李里夫替换原则 (LSP)\n\n![](img/14_unnum_lsp.jpg)\n\n任何支持 OCP 的语言也必须支持 LSP。这两个原则是关联的，因为对\
  \ LSP 的每一次违反都是对 OCP 的潜在违反。\n\n`LSP` 最初由 Barbara Liskov 在 1988 年提出，^(9)，她对子类型提供了一个或或正式的定义。从本质上说，她说在任何使用基类型的程序中，子类型都必须能够替换基类型。\n\
  \n9。巧合的是，那是 Bertrand Meyer 发布 OCP 的同一年。\n\n为了澄清这一点，假设我们有一个使用 `employee` 类型的程序 `pay`：\n\
  \n点击此处查看代码图片\n\n```\n(defn pay [employee pay-date]\n  (let [is-payday? (:is-payday\
  \ employee)\n        calc-pay (:calc-pay employee)\n        send-paycheck (:send-paycheck\
  \ employee)]\n    (when (is-payday? pay-date)\n      (let [paycheck (calc-pay)]\n\
  \        (send-paycheck paycheck)))))\n```\n\n注意我正在使用 `vtable` 方法来创建类型。同样注意，类型内部的数据对\
  \ `pay` 函数是完全隐藏的。`pay` 函数能看到的只有 `employee` 类型中的方法。你还能得到什么程度的 OO？\n\n这里是使用该类型的测试代码。注意\
  \ `make-test-employee` 函数创建了一个使用**鸭子类型**（duck typing）来符合 `employee` 类型的对象：\n\n点击此处查看代码图片\n\
  \n```\n(defn test-is-payday [employee-data pay-date]\n  true)\n\n(defn test-calc-pay\
  \ [employee-data]\n  (:pay employee-data))\n\n(defn test-send-paycheck [employee-data\
  \ paycheck]\n  (format \"Send %d to: %s at: %s\"\n          paycheck\n         \
  \ (:name employee-data)\n          (:address employee-data)))\n(defn make-test-employee\
  \ [name address pay]\n  (let [employee-data {:name name\n                      \
  \ :address address\n                       :pay pay}\n\n        employee {:employee-data\
  \ employee-data\n                  :is-payday (partial test-is-payday\n        \
  \                              employee-data)\n                  :calc-pay (partial\
  \ test-calc-pay employee-data)\n                  :send-paycheck (partial test-send-paycheck\n\
  \                                          employee-data)}]\n\n    employee))\n\n\
  (describe \"Payroll\"\n  (it \"支付薪资员工\"\n    (should= \"Send 100 to: name at: address\"\
  \n             (pay (make-test-employee \"name\" \"address\" 100)\n            \
  \      :now))))\n```\n\n注意 `make-test-employee` 使用了指向实现的（PIMPL)^(10) 模式来隐藏 `:employee-data`\
  \ 字段中的数据并仅暴露方法。最后，注意所有多态方法都将 `employee-data` 作为第一个参数。噢，太 OO 了！然而完全是函数式的。\n\n10。将所有数据保留在单个字段后面以保持其私有性。访问\
  \ [`cpppatterns.com/patterns/pimpl.html`](https://cpppatterns.com/patterns/pimpl.html)。\n\
  \n很显然，我可以创建许多不同类型的员工对象并将它们传递给 `pay` 函数，而无需修改 `pay` 函数。这就是 OCP。\n\n然而，为了实现这一点，我必须确保我创建的每个员工对象都符合\
  \ `pay` 函数的预期。如果这些方法中的一个执行了 `pay` 不预期的操作，`pay` 就会出问题。例如，这个测试失败了：\n\n[content]\n\
  (由于原文文本包含大量重复和碎片化内容，此处提供基于核心逻辑的清晰翻译版本)\n- 我可以创建许多不同类型的员工对象并将它们传递给 `pay` 函数，而无需修改\
  \ `pay` 函数。这就是 OCP。\n- 然而，为了实现这一点，我必须非常确保我创建的每个员工对象都符合 `pay` 函数的预期。如果这些方法中的一个执行了\
  \ `pay` 不预期的操作，`pay` 就会出问题。\n- 例如，这个测试失败了：\n\n点击此处查看代码图片\n\n```\n (it \"不支付一个发放日今天的员工\"\
  \n        (should-be-nil\n          (pay (make-later-employee \"name\" \"address\"\
  \ 100)\n               :now)))\n```\n\n因为它 `make-later-employee` 不符合 `pay` 函数对 `:is-payday`\
  \ 方法的预期。如下所示，它返回了 `:tomorrow` 而不是 `false`：\n\n点击此处查看代码图片\n\n```\n(defn make-later-employee\
  \ [name address pay]\n  (let [employee (make-test-employee name address pay)\n \
  \       is-payday (partial (fn _] :tomorrow)\n                            (:employee-data))\n\
  \    (employee)))\n```\n（注：原文提供的最后代码块有些碎片化/不完整，我已根据上下文进行了逻辑重构）。\n\n\n\n为了让这些正常工作，我们需要如下定义\
  \ `set-h`、`set-w` 和 `area` 函数：\n\n```\n(defn set-h [rect h]\n  (assoc rect :h h))\n\
  \n(defn set-w [rect w]\n  (assoc rect :w w))\n\n(defn area [rect]\n  (* (:h rect)\
  \ (:w rect)))\n```\n\n这里没有任何地方是意外的。矩形对象是不可变的。`set-h` 和 `set-w` 函数仅仅是创建了带有更改参数的新矩形。\n\
  \n所以，让我们充实一下内容，创建一个使用我们矩形的小系统。这里是测试用例：\n\n点击此处查看图片\n\n```\n(describe \"Rectangle\"\
  \n  (it \"calculates proper area and perimeter\"\n    (should= 25 (area (make-rect\
  \ 5 5)))\n    (should= 18 (perimeter (make-rect 4 5)))\n    (should= 12 (-> (make-rect\
  \ 1 1) (set-h 3) (set-w 4) area)))\n\n  (it \"minimally increases area\"\n    (should=\
  \ 15 (-> (make-rect 3 4) minimally-increase-area area))\n    (should= 24 (-> (make-rect\
  \ 5 4) minimally-increase-area area))\n    (should= 20 (-> (make-rect 4 4) minimally-increase-area\
  \ area))))\n```\n\n这里是通过这些测试的函数：\n\n点击此处查看图片\n\n```\n(defn perimeter [rect]\n  (let\
  \ [{:keys [h w]}13 rect]\n    (* 2 (+ h w))))\n\n(defn minimally-increase-area [rect]\n\
  \  (let [{:keys [h w]} rect]\n    (cond\n      (>= h w) (make-rect (inc h) w)\n\
  \      (> w h) (make-rect h (inc w))\n      :else :tilt)))\n```\n\n13。这会将 map 解构为命名的组件。在这种情况下，它等同于\
  \ `(let [h (:h rect) w (:w rect)]`……\n\n再次，这并没有什么意外的。也许你对 `minimally-increase-area`\
  \ 函数感到困惑。这个函数只是以可能的最小整数增量增加矩形的面积。^(14)\n\n14。假设所有的长度和宽度都是整数。\n\n现在，让我们想象这个系统已经运行了多年并且非常成功。但最近，系统的客户一直在要求正方形。我们如何向系统中添加正方形呢？\n\
  \n如果我们应用 ISA（是一个...）规则，我们可能会认为正方形是一个矩形，因此我们应该让接受矩形的函数也接受正方形。在 Java 中，我们可能通过从 `Rectangle`\
  \ 类派生出 `Square` 类来实现。在 Clojure 中，我们可以通过简单创建边相等的矩形来实现：\n\n```\n(defn make-square\
  \ [side]\n  (make-rect side side))\n```\n\n这应该让我们稍微感到困扰，因为 `square` 对象的大小与 `rectangle`\
  \ 对象的大小相同。`square` 类型的对象应该更小，因为它们不需要同时高度和宽度。但内存是廉价的，而且我们想要保持简单，对吧？\n\n问题是，我们所有的测试仍然能通过吗？它们理应能通过，因为我们的正方形实际上只是矩形（啊，那正是\
  \ ISA 规则！）。\n\n这些测试通过良好：\n\n点击此处查看图片\n\n```\n(should= 36 (area (make-square 6)))\n\
  (should= 20 (perimeter (make-square 5)))\n```\n\n这个通过了，但它很令人困扰，因为在其中的某处，“正方形性”丢失了：\n\
  \n点击此处查看图片\n\n```\n(should= 12 (-> (make-square 1) (set-h 3) (set-w 4) area))\n\
  ```\n\n函数 `set-h` 和 `set-w` 在接收到 `square` 时并没有返回一个 `square`。这有点奇怪；但在某种诡异的情况下，它实际上是有道理的。我的意思是，如果你在不改变宽度的情况下设置\
  \ `square` 的高度，它就不再是一个 `square` 了，对吗？\n\n如果你现在感到脑后勺有点发痒，你可能应该关注一下。\n\n不管，我们的 `minimally-increase-area`\
  \ 测试呢？它通过了吗？\n\n点击此处查看图片\n\n```\n(should= 30 (-> (make-square 5) minimally-increase-area\
  \ area))\n```\n\n是的，它也通过了。当然，它应该通过，因为该函数只是根据需要增加高度或宽度。\n\n看起来我们已经完成了，而且这运行得非常棒！\n\
  \n#### 不！\n\n几天后，我们的客户给我们打了电话，他不高兴。他一直尝试使用正方形，并发现 `set-h` 和 `set-w` 函数在接收到 `square`\
  \ 时并没有返回一个 `square`。\n\n“当你在现实世界中看到两个显然通过‘是一个’连接起来的对象时，你可能想在代码中创建子类关系。小心这一点。你可能会触犯代表规则并违反\
  \ LSP（里替换原则）。仅仅因为几何学上的正方形是矩形，并不意味着代码中的 `square` 对象是代码中的 `rectangle` 对象。`square`\
  \ 类型对象的行为与 `rectangle` 对象的行为不同。”\n\n#### 代表规则 (Representative Rule)\n\n我倾向于最后这种选择。因为我不喜欢\
  \ ISA 规则。事物的代表并不共享它们所代表的东西。仅仅因为几何学上的正方形是矩形，它们并不共享这些关系。\n\n## 接口隔离原则 (ISP)\n\n该原则的名称源于它在静态类型对象语言中的起源。我用来描述\
  \ ISP 的示例对于 Java、C# 和 C++ 等语言非常有效，因为这些语言依赖于声明接口。在 Ruby、Python、JavaScript 和 Clojure\
  \ 等动态类型语言中，这些示例并不特别适用，因为在这些语言中，接口是未声明的，并且通过鸭子类型已经隔离了。\n\n例如，考虑以下 Java 接口：\n\n```\n\
  interface AtmInteractor {\n  void requestAccount();\n  void requestAmount();\n \
  \ void requestPin();\n}\n```\n\n在这里我们看到三个方法绑定在 `AtmInteractor` 接口中。因此，该接口的任何用户都依赖于所有三个方法，即使该用户只调用其中一个。因此，该用户依赖了多于它需要的。如果其中一个方法的签名发生变化，或者在该接口中添加了另一个方法，那么该用户将不得不重新编译和部署，使得设计变得不必要的脆弱。\n\
  \n我们通过如下隔离接口来解决静态类型对象语言中的这种缺陷：\n\n```\ninterface AccountInteractor {\n  void requestAccount();\n\
  }\n\ninterface AmountInteractor {\n  void requestAmount();\n}\n\ninterface PinInteractor\
  \ {\n  void requestPin();\n}\n```\n\n然后，每个用户都可以仅依赖它们需要调用的方法，而实现可以多重实现这些接口：\n\n\n\
  \n\n点击此处查看代码图片\n\n```\npublic class AtmInteractor implements AccountInteractor,\n\
  \                                      AmountInteractor,\n                     \
  \                 PinInteractor {\n  void requestAccount() {…};\n  void requestAmount()\
  \ {…};\n  void requestPin() {…};\n}\n```\n\n或许图 12.1 中的 UML 图会使这一切更清晰。通过分离接口，三个用户只依赖于他们需要的方法；然而这些方法可以由单个类来实现。\n\
  \n![](img/c12f001.jpg)\n\n**图 12.1.** 接口分离的接口\n\n在 Clojure 中，我们可以使用鸭子类型技术之一来解决这个问题：\n\
  \n点击此处查看代码图片\n\n```\n(defmulti request-account :interactor)\n(defmulti request-amount\
  \ :interactor)\n(defmulti request-pin :interactor)\n```\n\n这三个多变方法（multi-methods）并没有绑定在同一个声明下。事实上，它们甚至不需要保持在同一个源文件中。相反，它们可以在特定于其功能的模块中声明。因此，如果其中一个方法的签名发生了变化，或者添加了新的多变方法，不会对未发生变化的多变方法的用户产生影响。如果它们被预编译了，^(15)它们将不需要重新编译。\n\
  \n15。Clojure 允许模块进行预编译以加快加载。\n\n这意味着在像 Clojure 这样的动态类型语言中，它更容易避免依赖你并不需要的东西。但这并不意味着该原则不适用。\n\
  \n## 不要依赖你不需要的东西\n\n回到名称上。`接口分离原则`中的“接口（Interface）”一词并不仅仅局限于 Java、C# 和 C++ 中的接口类。相反，它适用于该词的通用含义。一个模块的“接口”就是该模块内部所有访问点的列表。\n\
  \nJava 和 C#（根据强惯例，也包括 C++）是基于类的语言，类与源文件之间存在强耦合。Java 特别要求每个源文件的命名必须与该源文件中声明的唯一公共类相同。这自动设定了\
  \ ISP 试图避免的条件。方法组被耦合到一个单一模块中，用户将依赖该模块，即使他们并不依赖于这些方法中的每一个。因此，除非设计者非常小心，否则这些用户将依赖于他们不需要的东西。\n\
  \nRuby、Python 和 Clojure 等动态类型语言没有这种从类到模块的限制。你可以在任何喜欢的源文件中声明任何你想要的内容。如果你愿意，甚至可以将整个应用程序写在一个单一源文件中！^(16)因此，在这些语言中，设置导致模块用户依赖于他们不需要的东西会变得更容易。\n\
  \n16。不推荐。 ;-)\n\n这不是函数式语言特有的情况。函数式语言也无法受此影响。设计者可以很容易地用大多数用户都不需要的各种访问点来污染他们模块的接口。\n\
  \n## 为什么？\n\n我们为什么要关心依赖于包含比我们需求更多的模块？如果我们的模块只使用了另一个模块中的十个函数之一，这为什么应该困扰我们呢？\n\n在静态类型语言中，代价可能是严重的，因为对我们不使用的函数之一的更改可能会迫使我们的模块重新编译并部署。如果我们的模块只是二进制组件中许多模块之一（例如一个\
  \ `jar` 文件），那么整个组件都需要重新部署。这些是每个严肃的设计者都应该小心的耦合。\n\n在动态类型语言中，代价降低了但并非零。例如，在 Clojure\
  \ 中，有严格要求^(17) 模块之间的源代码依赖必须是无环的。模块包含的函数越多，影响该模块的输出和输入源代码依赖就越多，因此它参与循环的概率也越大。\n\n\
  17。我们将在第 17 章 Wa-Tor 中遇到这种情况。\n\n但关心这些依赖关系最好的理由可能是，限制冗余依赖的模块结构是**有服力的（cogent）**。这表明智能的人类足够关注并分离关注点并降低耦合。你代码的读者将感谢你的细心。\n\
  \n## 结论\n\nISP 的真正含义是：\n\n* 将一起使用的东西聚集在一起。\n* 分离那些分开使用的东西。\n* 不要依赖你不需要的东西。\n\n##\
  \ 依赖倒转原则 (DIP)\n\n![](img/16_unnum_dip.jpg)\n\n在 SOLID 原则中，可以说 OCP 是道德核心，SRP 是组织力量，而\
  \ LSP 和 ISP 是环绕在由于疏忽造成的坑洼周围的警告标志。这留下了 DIP，它是所有其他原则背后的底层机制。在几乎每种我们发现违反的情况下，都涉及一个或多个关键依赖的倒转。\n\
  \n在过去的几十年里，软件是以受限依赖结构构建的。虚线箭头是运行时依赖。显示高层模块调用中间模块，再调用底层模块。实线箭头是源代码依赖。显示每个源代码依赖于它所调用的模块。在古代，这两种类型的依赖总是^(18)\
  \ 平行的。如果模块 X 对模块 Y 有运行时依赖，它也对模块 Y 有源代码依赖。\n\n18。嗯，并不总是这样。在 50 年代末 60 年代初，操作系统工程师付出了艰巨努力倒转某些战略依赖，以创建设备无关的抽象。除了显式指针外，他们没有其他工具，所以非常小心。\n\
  \n这意味着高层策略不可分割地依赖于底层细节。深思这句话的含义。\n\n但在 60 年代末，Ole-Johan Dahl 和 Kristen Nygaard 将\
  \ ALGOL 编译器中的一种数据结构^(19) 从栈移动到堆，并发现了对象对象^(20)。随着这一发现，程序员获得了轻松安全地倒转依赖的能力。\n\n19。数据结构是函数调用的栈帧。他们创建的语言是\
  \ Simula 67。\n\n20。Simula 的发明历史非常迷人。在 Edsger W. Dijkstra、Ole-Johan Dahl 和 C. A.\
  \ R. Hoare 写的 1972 年书籍《结构化编程》中有简要描述，并在 Dahl 和 Nygaard 的论文《Simula 语言的发展》中有更详细的描述（[`hannemyr.com/cache/knojd_acm78.pdf`](https://hannemyr.com/cache/knojd_acm78.pdf)）。\n\
  \n又过了 25 年，对象语言才开始进入主流。但从那时起，几乎程序员都能轻松地打破那种并行依赖。他们这样做的方式如图 12.3 所示。\n\n![](img/c12f003.jpg)\n\
  \n\n\n\n\n## 图 12.3. 通过插入接口反转依赖\n\n`HL1` 对 `ML1` 中的 `F()` 有运行时依赖；但 `HL1` 对 `ML1`\
  \ 没有产生任何直接或间接的源代码依赖。相反，它们都依赖于接口 `I`。\n\n[21]。在动态类型语言中，接口 `I` 不会以源代码模块的形式存在。相反，它将是一个\
  \ `HL1` 和 `ML1` 都遵循的鸭类型（duck type）。\n\n这种获取任何源代码依赖并将其反转的能力赋予了我们巨大的力量。我们可以轻松且安全地安排软件的源代码依赖，以确保高层模块*不*依赖于低层模块。\n\
  \n这允许我们创建如 [图 12.4] 所示的结构。\n\n![](img/c12f004.jpg)\n\n### 图 12.4. 插件结构\n\n在这里我们看到高层业务规则对用户界面\
  \ (UI) 和数据库有运行时依赖，但对这些模块没有源代码依赖。DIP 的应用意味着 UI 和数据库是业务规则的*插件*，可以很容易地替换为不同的实现，而不影响业务规则，从而符合\
  \ OCP（开闭原则）。\n\n当然，实际情况是 UI 和数据库正在实现包含在业务规则中的接口。业务规则在这些接口上运行，允许控制流向外指向 UI 和数据库，同时将源代码依赖反向指向业务规则（参见\
  \ [图 12.5]）。\n\n![](img/c12f005.jpg)\n\n### 图 12.5. 业务规则内部的接口允许插件的存在。\n\n注意，所有的依赖都指向抽象。这引导我们用一种描述\
  \ DIP 的方法：\n\n*在可能的情况下，将所有的源代码依赖指向抽象。*\n\n### 怀旧的经典\n\n理论够够了。让我们来看看它的运行情况。我将从我的朋友兼导师\
  \ Martin Fowler 那里借用一个怀旧的示例。他在著名的著作《重构》第一版中介绍了这个*视频录带店*的例子。当然，我将使用 Clojure 代替 Java。\n\
  \n[22]。视频杀杀了收音机店，互联网杀杀了视频录带店。是的，男孩女孩们，曾经有一个我们去视频录带店租赁录像带和 DVD 的时代。\n\n[23]。Addison-Wesley,\
  \ 1999。\n\n以下是测试代码：\n\n点击此处查看代码图片\n\n```\n(describe \"Video Store\"\n  (with customer\
  \ (make-customer \"Fred\"))\n\n  (it \"makes statement for a single new release\"\
  \n    (should= (str \"Rental Record for Fred\\n\"\n                  \"\\tThe Cell\\\
  t9.0\\n\"\n                  \"You owed 9.0\\n\"\n                  \"You earned\
  \ 2 frequent renter points\\n\")\n             (make-statement\n               (make-rental-order\n\
  \                 @customer\n                 [(make-rental\n                  \
  \  (make-movie \"The Cell\" :new-release)\n                    3)]))))\n\n  (it\
  \ \"makes statement for two new releases\"\n    (should= (str \"Rental Record for\
  \ Fred\\n\"\n                  \"\\tThe Cell\\t9.0\\n\"\n                  \"\\\
  tThe Tigger Movie\\t9.0\\n\"\n                  \"You owed 18.0\\n\"\n         \
  \         \"You earned 4 frequent renter points\\n\")\n             (make-statement\n\
  \               (make-rental-order\n                 @customer\n               \
  \  [(make-rental\n                    (make-movie \"The Cell\" :new-release)\n \
  \                   3)\n                  (make-rental\n                    (make-movie\
  \ \"The Tigger Movie\" :new-release)\n                    3)]))))\n\n  (it \"makes\
  \ statement for one childrens movie\"\n    (should= (str \"Rental Record for Fred\\\
  n\"\n                  \"\\tThe Tigger Movie\\t1.5\\n\"\n                  \"You\
  \ owed 1.5\\n\"\n                  \"You earned 1 frequent renter points\\n\")\n\
  \             (make-statement\n               (make-rental-order\n             \
  \    @customer\n                 [(make-rental\n                    (make-movie\
  \ \"The Tigger Movie\" :childrens)\n                    3)]))))\n```\n*(等等，提供的文本在代码块末尾有大量的重复/混乱部分。我将根据所提供文本的结构重新对齐逻辑流。）*\n\
  \n实际上，查看输入，末尾有一块巨大的重复/损坏代码。我将按照提供的格式格式化代码块，确保在变量/函数出现时应用反引号，但在这里它们是在代码块内部。\n\n等等，仔细查看提供的输入，从\
  \ `(describe \"Video Store\"` 到结束的文本似乎是代码和注释的重复混乱物。我将清理格式，但按要求保留内容。\n\n*自我纠正：*提示要求“保留核心内容”并“优化段落格式”。输入中的代码块高度冗余。我将清晰地对其进行格式化。\n\
  \n``````\n(describe \"Video Store\"\n  (with customer (make-customer \"Fred\"))\n\
  \n  (it \"makes statement for a single new release\"\n    (should= (str \"Rental\
  \ Record for Fred\\n\"\n                  \"\\tThe Cell\\t9.0\\n\"\n           \
  \       \"You owed 9.0\\n\"\n                  \"You earned 2 frequent renter points\\\
  n\")\n             (make-statement\n               (make-rental-order\n        \
  \         @customer\n                 [(make-rental\n                    (make-movie\
  \ \"The Cell\" :new-release)\n                    3)]))))\n\n  (it \"makes statement\
  \ for two new releases\"\n    (should= (str \"Rental Record for Fred\\n\"\n    \
  \              \"\\tThe Cell\\t9.0\\n\"\n                  \"\\tThe Tigger Movie\\\
  t9.0\\n\"\n                  \"You owed 18.0\\n\"\n                  \"You earned\
  \ 4 frequent renter points\\n\")\n             (make-statement\n               (make-rental-order\n\
  \                 @customer\n                 [(make-rental\n                  \
  \  (make-movie \"The Cell\" :new-release)\n                    3)\n            \
  \      (make-rental\n                    (make-movie \"The Tigger Movie\" :new-release)\n\
  \                    3)]))))\n\n  (it \"makes statement for one childrens movie\"\
  \n    (should= (str \"Rental Record for Fred\\n\"\n                  \"\\tThe Tigger\
  \ Movie\\t1.5\\n\"\n                  \"You owed 1.5\\n\"\n                  \"\
  You earned 1 frequent renter points\\n\")\n             (make-statement\n      \
  \         (make-rental-order\n                 @customer\n                 [(make-rental\n\
  \                    (make-movie \"The Tigger Movie\" :childrens)\n            \
  \        3)]))))\n```\n*(注：输入文本在末尾有大量的重复代码逻辑。我已经在上面提供了代码块的主要功能部分。）*\n\n如果你读过《重构》的第一版，这应该看起来非常熟悉。本质上，我们有一个简单的报告生成器，用于计算和格式化租赁订单的语句。\n\
  \n你应该首先注意到的就是测试中严重的 SRP 违反行为。这些测试将业务规则与语句的构建和格式化耦合在一起。这种 SRP 违反使得测试非常脆弱。为了修复这个问题，我们需要将指定报告格式的测试与指定业务规则的测试分开。\n\
  \n为了做到这一点，我将测试拆分为三个不同的模块：一个用于测试计算，另一个用于格式化，最后一个用于集成。\n\n\n\n\n\n这里是 `statement-calculator`\
  \ 测试。从现在起，我将包含所有的 `ns` 语句，这样你就可以看到模块名称及其源代码依赖了。\n\n`ns` 代表命名空间（namespace）。这些语句通常每个\
  \ Clojure 模块的开头，定义了模块的名称及其依赖。点击此处查看代码\n\n```clojure\n(ns video-store.statement-calculator-spec\n\
  \  (:require [speclj.core :refer :all]\n            [video-store.statement-calculator\
  \ :refer :all]))\n(declare customer)\n\n(describe \"Rental Calculation\"\n  (with\
  \ customer (make-customer \"Fred\"))\n\n  (it \"makes statement for single new release\"\
  \n    (should= {:customer-name \"Fred\"\n              :movies [{:title \"The Cell\"\
  \n                        :price 9.0}]\n              :owed 9.0\n              :points\
  \ 2}\n             (make-statement-data\n               (make-rental-order\n   \
  \              @customer\n                 [(make-rental\n                    (make-movie\
  \ \"The Cell\" :new-release)\n                    3)]))))\n\n  (it \"makes statement\
  \ for two new releases\"\n    (should= {:customer-name \"Fred\",\n             \
  \ :movies [{:title \"The Cell\",\n                        :price 9.0}\n        \
  \       {:title \"Tigger Movie\",\n                :price 9.0}],\n             \
  \ :owed 18.0,\n              :points 4}\n             (make-statement-data\n   \
  \            (make-rental-order\n                 @customer\n                 [(make-rental\n\
  \                    (make-movie \"The Cell\" :new-release)\n                  \
  \  3)\n                  (make-rental\n                    (make-movie \"Tigger\
  \ Movie\" :new-release)\n                    3)]))))\n\n  (it \"makes statement\
  \ for one childrens movie\"\n    (should= {:customer-name \"Fred\",\n          \
  \    :movies [{:title \"Tigger Movie\",\n                        :price 1.5}],\n\
  \              :owed 1.5,\n              :points 1}\n             (make-statement-data\n\
  \               (make-rental-order\n                 @customer\n               \
  \  [(make-rental\n                    (make-movie \"Tigger Movie\" :childrens)\n\
  \                    3)]))))\n\n  (it \"makes statement for several regular movies\"\
  \n    (should= {:customer-name \"Fred\",\n              :movies [{:title \"Plan\
  \ 9 from Outer Space\",\n                        :price 2.0}\n               {:title\
  \ \"8 1/2\",\n                :price 2.0}\n               {:title \"Eraserhead\"\
  ,\n                :price 3.5}],\n              :owed 7.5,\n              :points\
  \ 3}\n             (make-statement-data\n               (make-rental-order\n   \
  \              @customer\n                 [(make-rental\n                    (make-movie\
  \ \"Plan 9 from Outer Space\"\n                                :regular)\n     \
  \               1)\n                  (make-rental\n                    (make-movie\
  \ \"8 1/2\", :regular)\n                    2)\n                  (make-rental\n\
  \                    (make-movie \"Eraserhead\" :regular)\n                    3)]))))))\n\
  ```\n\n我们在这里做的是将格式化的语句替换为包含所有数据的数据的结构。这允许我们将格式化与计算分离，如 `statement-calculator` 的实现所示：点击此处查看代码\n\
  \n```clojure\n(ns video-store.statement-calculator)\n\n(defn make-customer [name]\n\
  \  {:name name})\n\n(defn make-movie [title type]\n  {:title title\n   :type type})\n\
  \n(defn make-rental [movie days]\n  {:movie movie\n   :days days})\n\n(defn make-rental-order\
  \ [customer rentals]\n  {:customer customer\n   :rentals rentals})\n\n(defn determine-amount\
  \ [rental]\n  (let [{:keys [movie days]} rental\n        type (:type movie)]\n \
  \   (condp = type\n      :regular\n      (if (> days 2)\n        (+ 2.0 (* days\
  \ 2) 1.5))\n        2.0)\n\n      :new-release\n      (* 3.0 days)\n\n      :childrens\n\
  \      (if (> days 3)\n        (+ 1.5 (* days 3) 1.5))\n        1.5))))\n\n(defn\
  \ determine-points [rental]\n  (let [{:keys [movie days]} rental\n        type (:type\
  \ movie)]\n    (if (and (= type :new-release)\n             (> days 1))\n      2\n\
  \      1)))\n\n(defn make-statement-data [rental-order]\n  (let [{:keys [name]}\
  \ (:customer rental-order)\n        {:keys [rentals]} rental-order]\n    {:customer-name\
  \ name\n     :movies (for [rental rentals]\n               {:title (:title (:movie\
  \ rental))\n                :price (determine-amount rental)})\n     :owed (reduce\
  \ + (map determine-amount rentals))\n     :points (reduce + (map determine-points\
  \ rentals))}))\n```\n\n这比之前简单一点并且封装良好。注意 `ns` 语句显示该模块没有源代码依赖。模块中的所有内容都暗示了格式化。实现也很简单：点击此处查看代码\n\
  \n```clojure\n(ns video-store.formatter)\n\n(defn format-rental-statement [statement-data]\n\
  \  (let [customer-name (:customer-name statement-data)\n        movies (:movies\
  \ statement-data)\n        owed (:owed statement-data)\n        points (:points\
  \ statement-data)]\n    (str\n      (format \"Rental Record for %s\\n\" customer-name)\n\
  \      (apply str\n             (for [movie movies]\n               (format \"\\\
  t%s\\t%.1f\\n\"\n                       (:title movie)\n                       (:price\
  \ movie))))\n      (format \"You owed %.1f\\n\" owed)\n      (format \"You earned\
  \ %d frequent renter points\\n\" points))))\n```\n\n再次，我们拥有一个没有依赖的封装良好的模块。为了确保这两个模块按照预期协同工作，我添加了一个简单的集成测试：点击此处查看代码\n\
  \n```clojure\n(ns video-store.integration-specs\n  (:require [speclj.core :refer\
  \ :all]\n            [video-store.formatter :refer :all]\n            [video-store.statement-calculator\
  \ :refer :all]))\n\n(describe \"Integration Tests\"\n  (it \"formats a statement\
  \ for several regular movies\"\n    (should= (str \"Rental Record for Fred\\n\"\n\
  \                  \"\\tPlan 9 from Outer Space\\t2.0\\n\"\n                  \"\
  \\t8 1/2\\t2.0\\n\"\n                  \"\\tEraserhead\\t3.5\\n\"\n            \
  \      \"You owed 7.5\\n\"\n                  \"You earned 3 frequent renter points\\\
  n\")\n             (format-rental-statement\n               (make-statement-data\n\
  \                 (make-rental-order\n                   (make-customer \"Fred\"\
  )\n                   [(make-rental\n                    (make-movie\n         \
  \             \"Plan 9 from Outer Space\"\n                                :regular)\n\
  \                    1)\n                    (make-rental\n                    (make-movie\
  \ \"8 1/2\", :regular)\n                    2)\n                    (make-rental\n\
  \                    (make-movie \"Eraserhead\" :regular)\n                    3)]))))))\n\
  ```\n\n\n\n\n从 SRP（单一职责原则）的角度来看，这要好得多。如果营销人员对报告格式进行细微调整，只有格式测试和集成测试会失败。所有的计算测试都不会受到影响。在像这样的小玩具示例中，这看起来可能不是什么巨大的胜利。但在测试用例以千计的真实应用中，这确实是一个巨大的胜利。\n\
  \n我们还免受了业务规则变化的影响。如果财务人员决定改变价格计算方式，格式测试将不受影响，只有计算测试和集成测试会受到影响。\n\n## 一个 DIP 违背\n\
  \n在取得这些优势的同时，你是否注意到了 DIP（依赖倒置原则）的违背？你可能错过了它，因为它不在生产环境代码中，而是在集成测试中。\n\n看看 `ns` 语句。你看到那两行提到\
  \ `statement-formatter` 和 `statement-calculator` 的代码了吗？这些行对这些模块的具体实现创建了源代码级依赖。这是一个高层策略依赖于具体的低层细节。这是定义意义上的\
  \ DIP 违背。\n\n也许这让你感到困惑。测试怎么能成为高层策略呢？测试难道不是尽可能低层的吗？它们难道不是终极细节吗？\n\n是的，确实如此。但集成测试实际上是高层策略的代品。再次看看那个集成测试。它精确地执行了应用程序高层策略必须做的事情。它调用\
  \ `make-statement-data` 并将结果传递给 `format-rental-statement`。由于这两个函数都是具体实现，我们的高层生产代码将面临与集成测试完全相同的\
  \ DIP 违背。\n\n我们在测试中总是关注 DIP 吗？时刻保持这种意识总是明智的。但强制合规并不总是是明智的。某些测试最好保持与低层实现的耦合。然而，如果你希望你的测试套件既健壮又灵活，而且你不希望在更改生产代码中的一个微小变动时导致几百个测试失败，那么关注测试与生产代码之间的耦合是一个好主意^(25)\n\
  \n25。我在我的书籍《整洁手艺》（*Clean Craftsmanship*, Addison-Wesley, 2021）中对这个主题花费了大量时间。\n\n\
  但也许你仍然不服。那么让我们添加一个新功能。有时我们希望账单显示在文本终端上，有时我们希望它显示在浏览器上。因此，我们需要 `format-rental-statement`\
  \ 的文本和 HTML 版本。\n\n让我们再增加一个新功能。我们的一些商店提供“买二送一”策略。所以，如果你租了三部视频，你只需要支付最贵的两部的费用。\n\n\
  如果我们用面向对象的语言来实现这一这一点，我们可能会尝试创建两个新的抽象类或接口。`StatementFormatter` 抽象类将有一个 `format-rental-statement`\
  \ 方法，该方法将在 `TextFormatter` 和 `HTMLFormatter` 实现中实现。同样，`StatementPolicy` 抽象将在 `NormalPolicy`\
  \ 和 `BuyTwoGetOneFreePolicy` 中实现 `make-statement-data` 函数。\n\n我们可以轻松地通过我们在 OCP 章节中讨论的三种方法中的一种来模拟这种设计。我们可以为这两个抽象类构建虚表（vtables）。或者我们可以使用\
  \ `defprotocol` 和 `defrecord` 来构建真实的 Java 接口和实现。最后，我们也可以使用多方法（multi-methods）。\n\n\
  让我们看看多方法方法是什么样子的。记住，这是一个伪装成成人问题的初级问题。你看到我在这里所做的，是为了展示更大的问题可以如何进行设计和划分。\n\n最后，如图\
  \ 12.6 所示，我将整个系统分为十一个模块，其中三个是测试。\n\n![](img/c12f006.jpg)\n\n**图 12.6.** 将视频租赁店应用拆分为模块\n\
  \n图 12.6 看起来像是一个面向对象解决方案的 UML 图。依赖倒置应该是显而易见的。`order-processing` 模块是最高层策略。它依赖于两个抽象。`statement-formatter`\
  \ 是接口，而 `statement-policy` 是一个有一个实现方法的抽象类。\n\n如果你对我使用面向对象的术语来描述 Clojure 函数式程序感到困惑，你不应该困惑。我使用的面向对象词汇在函数式世界中有非常直接的类比。\n\
  \n`statement-formatter` 接口由 `text-formatter` 和 `HTML-formatter` 实现。`statement-policy`\
  \ 抽象类由 `normal-statement-policy` 实现。`buy-two-get-one-free-policy` 实现继承自 `normal-statement-policy`\
  \ 但重写了它的一个方法。所有这些“继承”背后的机制很快就会变得清晰。\n\n测试出现在底部。它们被标记为 `<T>`。它们使用一个名为 `constructors`\
  \ 的小型工具模块，该模块知道如何构建基础数据结构。然后每个测试都使用其特定的生产代码部分来测试它需要的内容。\n\n现在来看源代码。特别注意 `ns` 语句，并注意它们与\
  \ UML 图上的箭头对应。\n\n让我们从 `constructors` 开始。它们非常自而易见：\n\n点击此处查看图像\n\n```\n(ns video-store.constructors)\n\
  \n(defn make-customer [name]\n  {:name name})\n\n(defn make-movie [title type]\n\
  \  {:title title\n   :type type})\n\n(defn make-rental [movie days]\n  {:movie movie\n\
  \   :days days})\n\n(defn make-rental-order [customer rentals]\n  {:customer customer\n\
  \   :rentals rentals})\n```\n\n`constructors` 在 `ns` 语句中没有外部依赖，只需构建 Clojure 数据结构。\n\
  \n集成测试位于 `integration-specs` 模块中：\n\n点击此处查看图像\n\n```\n(ns video-store.integration-specs\n\
  \  (:require [speclj.core :refer :all]\n            [video-store.constructors :refer\
  \ :all]\n            [video-store.text-statement-formatter :refer :all]\n      \
  \      [video-store.normal-statement-policy :refer :all]\n            [video-store.order-processing\
  \ :refer :all]))\n\n(declare rental-order)\n\n(describe \"Integration Tests\"\n\
  \  (with rental-order (make-rental-order\n                       (make-customer\
  \ \"Fred\")\n                       [(make-rental\n                          (make-movie\n\
  \                            \"Plan 9 from Outer Space\"\n                     \
  \       :regular)\n                          1)\n                        (make-rental\n\
  \                          (make-movie \"8/1/2\", :regular)\n                  \
  \        2)\n                        (make-rental\n                          (make-movie\
  \ \"Eraserhead\" :regular)\n                          3)])\n  (it \"formats a text\
  \ statement\"\n    (should= (str \"Rental Record for Fred\\n\"\n               \
  \   \"\\tPlan 9 from Outer Space\\t2.0\\n\"\n                  \"\\t8/1/2\\t2.0\\\
  n\"\n                  \"\\tEraserhead\\t3.5\\n\"\n                  \"You owed\
  \ 7.5\\n\"\n                  \"You earned 3 frequent renter points\\n\")\n    \
  \         (process-order\n               (make-normal-policy)\n               (make-text-formatter)\n\
  \               @rental-order))))\n```\n\n\n\n另外两个测试更加具体。请特别注意，它们的源代码依赖仅引入它们所需的内容：\n\
  \n点击此处查看代码图片\n\n```\n(ns video-store.statement-formatter-spec\n  (:require [speclj.core\
  \ :refer :all]\n            [video-store.statement-formatter :refer :all]\n    \
  \        [video-store.text-statement-formatter :refer :all]\n            [video-store.html-statement-formatter\
  \ :refer :all]))\n\n(declare statement-data)\n(describe \"Rental Statement Format\"\
  \n  (with statement-data {:customer-name \"CUSTOMER\"\n                        :movies\
  \ [{:title \"MOVIE\"\n                                  :price 9.9}]\n         \
  \               :owed 100.0\n                        :points 99})\n  (it \"Formats\
  \ a text rental statement\"\n    (should= (str \"Rental Record for CUSTOMER\\n\"\
  \n                  \"\\tMOVIE\\t9.9\\n\"\n                  \"You owed 100.0\\\
  n\"\n                  \"You earned 99 frequent renter points\\n\")\n          \
  \   (format-rental-statement\n               (make-text-formatter)\n           \
  \    @statement-data\n               )))\n\n  (it \"Formats an html rental statement\"\
  \n      (should= (str\n                 \"<h1>Rental Record for CUSTOMER</h1>\"\n\
  \                 \"<table>\"\n                 \"<tr><td>MOVIE</td><td>9.9</td></tr>\"\
  \n                 \"</table>\"\n                 \"You owed 100.0<br>\"\n     \
  \            \"You earned <b>99</b> frequent renter points\")\n               (format-rental-statement\n\
  \                 (make-html-formatter)\n                 @statement-data))))\n\
  ```\n\n`statement-formatter-spec` 测试了两种不同的格式。格式由 `format-rental-statement` 函数的第一个参数指定。该参数由\
  \ `make-text-formatter` 和 `make-html-formatter` 函数创建，正如你将看到的，这些函数实现在相应的模块中。\n\n\
  最后一个测试是 `statement-policy-spec`：\n\n点击此处查看代码图片\n\n```\n(ns video-store.statement-policy-spec\n\
  \  (:require\n    [speclj.core :refer :all]\n    [video-store.constructors :refer\
  \ :all]\n    [video-store.statement-policy :refer :all]\n    [video-store.normal-statement-policy\
  \ :refer :all]\n    [video-store.buy-two-get-one-free-policy :refer :all]))\n\n\
  (declare customer normal-policy formatter)\n(declare new-release-1 new-release-2\
  \ childrens)\n(declare regular-1 regular-2 regular-3)\n\n(describe \"Rental Statement\
  \ Calculation\"\n  (with customer (make-customer \"CUSTOMER\"))\n  (with normal-policy\
  \ (make-normal-policy))\n  (with new-release-1 (make-movie \"new release 1\" :new-release))\n\
  \  (with new-release-2 (make-movie \"new release 2\" :new-release))\n  (with childrens\
  \ (make-movie \"childrens\" :childrens))\n  (with regular-1 (make-movie \"regular\
  \ 1\" :regular))\n  (with regular-2 (make-movie \"regular 2\" :regular))\n  (with\
  \ regular-3 (make-movie \"regular 3\" :regular))\n  (context \"normal policy\"\n\
  \    (it \"makes statement for a single new release\"\n      (should= {:customer-name\
  \ \"CUSTOMER\"\n                :movies [{:title \"new release 1\"\n           \
  \               :price 9.0}]\n                :owed 9.0\n                :points\
  \ 2}\n               (make-statement-data\n                 @normal-policy\n   \
  \              (make-rental-order\n                   @customer\n              \
  \     [(make-rental @new-release-1 3)]))))\n\n    (it \"makes statement for two\
  \ new releases\"\n      (should= {:customer-name \"CUSTOMER\",\n               \
  \ :movies [{:title \"new release 1\", :price 9.0}\n                         {:title\
  \ \"new release 2\", :price 9.0}],\n                :owed 18.0,\n              \
  \  :points 4}\n               (make-statement-data\n                 @normal-policy\n\
  \                 (make-rental-order\n                   @customer\n           \
  \        [(make-rental @new-release-1 3)\n                    (make-rental @new-release-2\
  \ 3)]))))\n\n    (it \"makes statement for one childrens movie\"\n      (should=\
  \ {:customer-name \"CUSTOMER\",\n                :movies [{:title \"childrens\"\
  , :price 1.5}],\n                :owed 1.5,\n                :points 1}\n      \
  \         (make-statement-data\n                 @normal-policy\n              \
  \   (make-rental-order\n                   @customer\n                   [(make-rental\
  \ @childrens 3)]))))\n\n    (it \"makes statement for several regular movies\"\n\
  \      (should= {:customer-name \"CUSTOMER\",\n                :movies [{:title\
  \ \"regular 1\", :price 2.0}\n                         {:title\": \"regular 2\"\
  , :price 2.0}\n                         {:title\": \"regular 3\", :price 3.5}],\n\
  \                :owed 7.5,\n                :points 3}\n               (make-statement-data\n\
  \                 @normal-policy\n                 (make-rental-order\n        \
  \           @customer\n                   [(make-rental @regular-1)\n          \
  \         (make-rental @regular-2)\n                   (make-rental @regular-3)]))))\n\
  \n  (context \"buy two get free policy\"\n    (it \"makes statement for regular\
  \ movies\"\n      (should= {:customer-name \"CUSTOMER\",\n                :movies\
  \ [{:title \"regular 1\", :price 2.0}\n                         {:title\": \"regular\
  \ 2\", :price 2.0}\n                         {:title\": \"new release 1\", :price\
  \ 3.0}],\n                :owed 5.0,\n                :points 3}\n             \
  \  (make-statement-data\n                 (make-buy-two-get-one-free-policy)\n \
  \                (make-rental-order\n                   @customer\n            \
  \       [(make-rental @regular-1)\n                    (make-rental @regular-2)\n\
  \                    (make-rental @new-release-1)]))))\n```\n\n`statement-policy-spec`\
  \ 测试了各种定价规则。你已经看到了第一部分。最后一个测试检查了某些商店使用的“买二送一”策略。该策略被传递给 `make-statement-data` 函数，并由\
  \ `make-normal-policy` 和 `make-buy-two-get-one-free-policy` 函数创建。\n\n现在，来看生产代码。我们从\
  \ `order-processing` 模块开始：\n\n点击此处查看代码图片\n\n```\n(ns video-store.order-processing\n\
  \  (:require [video-store.statement-formatter :refer :all]\n            [video-store.statement-policy\
  \ :refer :all]))\n\n(defn process-order [policy formatter]\n  (-> order\n      \
  \ (make-statement-data policy)\n       (format-rental-statement formatter)))\n```\n\
  \n这里没什么。注意源代码依赖只引用了 `statement-formatter` 接口和 `statement-policy` 抽象。\n\n`statement-formatter`\
  \ 接口非常简单：\n\n点击此处查看代码图片\n\n```\n(ns video-store.statement-formatter)\n\n(defmulti\
  \ format-rental-statement\n            (fn [formatter statement-data]\n        \
  \      (:type formatter)))\n```\n\n`defmulti` 语句大致等同于 Java 或 C# 中创建抽象方法。由于该模块只有一个抽象方法，它大致等同于接口。分发函数是平庸的；它只是返回格式器的\
  \ `:type`。\n\n`statement-policy` 抽象更有趣：\n\n点击此处查看代码图片\n\n```\n(ns video-store.statement-policy)\n\
  \n(defn- policy-movie-dispatch [policy rental]\n  [(:type policy) (-> rental :movie\
  \ :type)])\n\n(defmulti determine-amount policy-movie-dispatch)\n(defmulti determine-points\
  \ policy-movie-dispatch)\n(defmulti total-amount (fn [policy _rentals] (:type policy)))\n\
  (defmulti total-points (fn [policy _rentals] (:type policy)))\n\n(defn make-statement-data\
  \ [policy rental-order]\n  (let [{:keys [name]} (:customer rental-order)\n     \
  \   {:keys [rentals]} rental-order]\n    {:customer-name name\n     :movies (for\
  \ [rental rentals]\n               {:title (:title (:movie rental))\n          \
  \      :price (determine-amount policy rental)})\n     :owed (total-amount policy\
  \ rentals)\n     :points (total-points policy rentals)}))\n```\n\n\n\n`statement-policy`\
  \ 模块包含四个抽象方法和一个实现方法。请注意它是如何使用模板方法^(27)模式的。同样请注意，`determine-amount` 和 `determine-points`\
  \ 函数使用一个元组作为分发代码。这非常有意思。这意味着我们可以根据两个自由度而不是一个来分发这些函数。这在大多数面向对象（OO）语言中很难实现的。我们很快就会看到它的用法。\n\
  \n27. 参见第 17 章，“Wa-Tor”。\n\n但首先，让我们来看 `text-statement-formatter` 的实现：\n\n点击此处查看代码图片\n\
  \n```clojure\n(ns video-store.text-statement-formatter\n  (:require [video-store.statement-formatter\
  \ :refer :all]))\n(defn make-text-formatter [] {:type ::text})\n\n(defmethod format-rental-statement\n\
  \           ::text\n           [_formatter statement-data]\n  (let [customer-name\
  \ (:customer-name statement-data)\n        movies (:movies statement-data)\n   \
  \     owed (:owed statement-data)\n        points (:points statement-data)]\n  \
  \  (str\n      (format \"Rental Record for %s\\n\" customer-name)\n      (apply\
  \ str\n             (for [movie movies]\n               (format \"\\t%s\\t%.1f\\\
  n\"\n                 (:title movie)\n                 (:price movie))))\n     \
  \ (format \"You owed %.1f\\n\" owed)\n      (format \"You earned %d frequent renter\
  \ points\\n\" points))))\n```\n\n这应该并不意外。我只是在没有太大改动的情况下将代码移到了这里。注意顶部的 `make-text-formatter`\
  \ 函数。\n\n`html-statement-formatter` 应该也不算意外：\n\n点击此处查看代码图片\n\n```clojure\n(ns video-store.html-statement-formatter\n\
  \  (:require [video-store.statement-formatter :refer :all]))\n\n(defn make-html-formatter\
  \ [] {:type ::html})\n\n(defmethod format-rental-statement ::html\n  [formatter\
  \ statement-data]\n  (let [customer-name (:customer-name statement-data)\n     \
  \   movies (:movies statement-data)\n        owed (:owed statement-data)\n     \
  \   points (:points statement-data)]\n    (str\n      (format \"<h1>Rental Record\
  \ for %s</h1>\" customer-name)\n      \"<table>\"\n      (apply str\n          \
  \   (for [movie movies]\n               (format \"<tr><td>%s</td><td>%.1f</td></tr>\"\
  \n                       (:title movie) (:price movie))))\n      \"</table>\"\n\
  \      (format \"You owed %.1f<br>\" owed)\n      (format \"You earned <b>%d</b>\
  \ frequent renter points\"\n              points))))\n```\n\n更有趣的是那两个策略模块。让我们从 `normal-statement-policy`\
  \ 开始：\n\n点击此处查看代码图片\n\n```clojure\n(ns video-store.normal-statement-policy\n  (:require\
  \ [video-store.statement-policy :refer :all]))\n\n(defn make-normal-policy [] {:type\
  \ ::normal})\n\n(defmethod determine-amount [::normal :regular] [_policy rental]\n\
  \  (let [days (:days rental)]\n    (if (> days 2)\n      (+ 2.0 (* (- days 2) 1.5))\n\
  \      2.0)))\n\n(defmethod determine-amount\n           [::normal :childrens]\n\
  \           [_policy rental]\n  (let [days (:days rental)]\n    (if (> days 3)\n\
  \      (+ 1.5 (* (- days 3) 1.5))\n      1.5)))\n\n(defmethod determine-amount\n\
  \           [::normal :new-release]\n           [_policy rental]\n  (* 3.0 (:days\
  \ rental)))\n\n(defmethod determine-points [::normal :regular] [_policy _rental]\n\
  \  1)\n\n(defmethod determine-points\n           [::normal :new-release]\n     \
  \      [_policy rental]\n  (if (> (:days rental) 1) 2 1))\n\n(defmethod determine-points\n\
  \           [::normal :childrens]\n           [_policy _rental]\n  1)\n\n(defmethod\
  \ total-amount ::normal [policy rentals]\n  (reduce + (map #(determine-amount policy\
  \ %) rentals)))\n\n(defmethod total-points ::normal [policy rentals]\n  (reduce\
  \ + (map #(determine-points policy %) rentals)))\n```\n\n这很不同，不是吗？仔细看那些 `defmethod`\
  \ 语句。我们同时根据策略类型和电影类型进行了分发。这很好地隔离了业务规则。\n\n你可能担心两个自由度会产生 N*M 问题，导致“确定”函数的泛滥。稍后你就会看到我是如何处理它的。\n\
  \n注意顶顶部供我们的测试使用的 `make-normal-policy` 构造函数。\n\n现在，让我们来看 `buy-two-get-one-free-policy`\
  \ 模块：\n\n点击此处查看代码图片\n\n```clojure\n(ns video-store.buy-two-get-one-free-policy\n\
  \  (:require [video-store.statement-policy :refer :all]\n            video-store.statement-policy\
  \ :as normal))\n\n(defn make-buy-two-get-one-free-policy [] {:type ::buy-two-get-one-free})\n\
  \n(defmethod total-amount :buy-two-get-one-free-policy [policy rentals]\n  (reduce\
  \ + (map (derive normal) rentals)))\n```\n\n惊喜！看那个 `derive`。它告诉编译器使用 `:normal` 来解析对应的\
  \ `defmethod`。\n\n好了，就是这些。我们将整个系统拆分成了 11 个模块。每个模块都封装良好。我们反转了最重要的依赖，使得高层策略不依赖于低层细节。整体结构看起来像一个面向对象的程序，但它完全是函数的。\n\
  \n## 结论\n\n整体结构看起来像一个面向对象的程序，但它是函数的。\n\n# IV\n\n# 函数实用主义\n\n## 13\n\n## 测试\n\n![](img/17_unnum_tests.jpg)\n\
  \n在本书中，你看到了我写的单元测试。在几乎每种情况下，我都使用了 TDD^(1) 准则，在编写测试和代码时进行快速循环，让测试领先于代码。\n\n大部分情况下，这些测试是用一个名为\
  \ `speclj`^(2)（读作“spekle”）的框架写的，由 Micah Martin 等编写。它与 Ruby 中流行的 RSpec 框架非常相似。\n\n\
  2. [`github.com/slagyr/speclj`](https://github.com/slagyr/speclj)\n\n我实践 TDD 已经超过\
  \ 20 年。我在 Java、C#、C、C++、Ruby、Python、Lua、Clojure 以及各种语言中使用过它。这些年来我学到的是语言对于准则并不重要。无论使用什么语言，准则都是相同的。\n\
  \nClojure 是一种函数式语言这一事实并没有改变我的测试策略，也不会影响我对 TDD 准则的使用。我编写 Clojure 程序的方式和编写 Java 程序一样，都是测试先行。范式并不重要。准则是通用的。\n\
  \n### 但 REPL 怎么呢？\n\n\n\n\n\n许多函数式程序员经常说他们不需要 TDD（测试驱动开发），因为他们在 `REPL` 中测试了一切。我也在\
  \ `REPL` 中进行大量的实验；但在大多数情况下，我会将学到的内容编码为测试。测试就像钻石，是永恒的。而 `REPL` 中的实验在第二天早上就不复存在了。\n\
  \n## 关于 Mock（模拟）？\n\n`Mocking` 是 TDD 实践者使用的一种技术，用于将测试与系统的大部分隔离开。实际上，他们创建了被称为 `mocks`，^(3)\
  \ 的对象来代表这些部分，并使用 `LSP`（可替换原则）用 mock 代替它们。\n\n3。它们更正式地被称为 `test-doubles`（测试双胞），但在本文背景下，我将继续使用这种口语表达。\n\
  \n由于 `LSP` 被视为一种面向对象（OO）原则，而且面向对象语言中的 mocks 是基于多态接口的，函数式语言不支持 mocks 似乎已经变成了一个都市传说。\n\
  \n但正如我们所看到的，`LSP` 在函数式语言中的效果与在面向对象语言中一样，而且多态接口通常非常容易创建。因此，在函数式语言中编写各种形式的 mocks 的能力完全没有受到阻碍。\n\
  \n例如，这里来自我的 `more-speech`^(4) 应用程序的测试，它使用了两个 mock：\n\n4。 [`github.com/unclebob/more-speech`](https://github.com/unclebob/more-speech)\n\
  \n点击查看代码图片\n\n```\n(it \"adds an unrooted article id to a tab\"\n  (let [message-id\
  \ 1\n        messages {message-id {:tags []}}\n        event-context (atom {:text-event-map\
  \ messages})]\n    (reset! ui-context {:event-context event-context})\n    (with-redefs\
  \ [swing-util/add-id-to-tab (stub :add-id-to-tab)\n                  swing-util/relaunch\
  \ (stub :relaunch)]\n      (add-article-to-tab 1 \"tab\" nil)\n      (should-have-invoked\
  \ :relaunch)\n      (should-have-invoked :add-id-to-tab\n                      \
  \     {:with [\"tab\" :selected 1]}))))\n```\n\n不要太担心这个测试做了什么。只需看底部的 `with-redefs`\
  \ 语句。这个测试 mock 了 `swing-util/add-id-to-tab` 和 `swing-util/relaunch` 函数，使用命名的 stubs（存根）。这些\
  \ stubs 是完美的空操作。它们接受任意数量的参数并且不返回任何值。^(5) 但它们记得作用身上发生了什么。^(6) 所以，在底部，我们看到 `:relaunch`\
  \ stub 应该被调用，且 `:add-id-to-tab` stub 应该带有三个参数被调用：`\"tab\"`、`:selected` 和 `1`。\n\n\
  5。有方法让它们返回值，但这超出了本文的范围。如果你感兴趣，请查看 `speclj` 文档 ([`github.com/slagyr/speclj`](https://github.com/slagyr/speclj))。\n\
  \n6。从技术上说，它们是 spies（间谍）。\n\n## 基于属性的测试（Property-Based Testing）\n\n与函数式程序员打交道，你最终会听到\
  \ `QuickCheck` 和属性测试。遗憾的是，这个话题经常作为 TDD 的反论出现。我并不打算尝试支持或反驳这一观点。相反，我想向你展示属性测试在 TDD\
  \ 范式内是多么强大。\n\n首先，什么是属性测试？`属性测试` 是一种利用随机生成输入和非常强大的缺陷隔离策略的验证和诊断技术。\n\n假设我刚刚写了一个计算给定整数质因数数的函数：\n\
  \n点击查看代码图片\n\n```\n(defn factors-of [n]\n  (loop [factors [] n divisor 2]\n    (if\
  \ (> n 1)\n      (cond\n        (> divisor (Math/sqrt n))\n        (conj factors\
  \ n)\n        (= 0 (mod n divisor))\n        (recur (conj factors divisor)\n   \
  \            (quot n divisor)\n               divisor)\n        :else\n        (recur\
  \ factors n (inc divisor)))\n      factors)))\n```\n\n假设我也是用 TDD 写了这个函数。这里是我的测试：\n\
  \n点击查看代码图片\n\n```\n(defn power2 [n]\n  (apply * (repeat n 2N)))\n\n(describe \"\
  factor primes\"\n  (it \"factors 1 -> []\"\n    (should= [] (factors-of 1)))\n \
  \ (it \"factors 2 -> [2]\"\n    (should= [2] (factors-of 2)))\n  (it \"factors 3\
  \ -> [3]\"\n    (should= [3] (factors-of 3)))\n```\n\n\n\n\n这很棒。我可以随机生成大量的输入，然后对输出进行属性检查。\n\
  \n### 一种诊断技术\n\n但我把基于属性的测试称为一种诊断技术，不是吗？让我们来看一个更有趣的例子，我会向你展示我的意思。\n\n还记得我们上一章中的 `Video\
  \ Store` 例子吗？让我们对它进行一些基于属性的测试。\n\n首先，回想我们写了一个名为 `make-statement-data` 的函数，它接受一个\
  \ `policy` 和一个 `rental-order` 并生成 `statement-data`，然后将其输入到一个格式化器中。这里是使用 `clojure.spec`\
  \ 对 `rental-order` 的类型规范：\n\n点击此处查看代码图片\n\n```\n(s/def ::name string?)\n(s/def ::customer\
  \ (s/keys :req-un [name]))\n(s/def ::title string?)\n(s/def ::type #{:regular :childrens\
  \ :new-release})\n(s/def ::movie (s/keys :req-un [::title ::type]))\n(s/def ::days\
  \ pos-int?)\n(s/def ::rental (s/keys :req-un [::days ::movie]))\n(s/def ::rentals\
  \ (s/coll-of ::rental))\n(s/def ::rental-order (s/keys :req-un [::customer ::rentals]))\n\
  ```\n\n这并不难读。从下往上：\n\n* 一个 `:rental-order` 是一个包含两个元素的 map：`:customer` 和 `:rentals`。\n\
  * `:rentals` 元素是 `:rental` 项目的集合。\n* 一个 `:rental` 是一个包含 `:days` 和 `:movie` 元素的 map。\n\
  * `:days` 元素是一个正整数。\n* `:movie` 元素是一个包含 `:title` 和 `:type` 的 map。\n* `:type` 是 `:regular`、`:childrens`\
  \ 或 `:new-release` 之一。\n* `:title` 是一个字符串。\n* `:customer` 是一个包含单个 `:name` 元素的 map。\n\
  * `:name` 是一个字符串。\n\n有了这个类型规范，我们就可以编写一个生成器来产生符合该类型的租赁订单。首先，这些是生成器：\n\n点击此处查看代码图片\n\
  \n```\n(def gen-customer-name\n  (gen/such-that not-empty gen/string-alphanumeric))\n\
  \n(def gen-customer\n  (gen/fmap (fn [name] {:name name}) gen-customer-name))\n\n\
  (def gen-days (gen/elements (range 1 100)))\n\n(def gen-movie-type\n  (gen/elements\
  \ [:regular :childrens :new-release]))\n\n(def gen-movie\n  (gen/fmap (fn [[title\
  \ type]] {:title title :type type})\n            (gen/tuple gen/string-alphanumeric\
  \ gen-movie-type)))\n\n(def gen-rental\n  (gen/fmap (fn [[movie days]] {:movie movie\
  \ :days days})\n            (gen/tuple gen-movie gen-days)))\n\n(def gen-rentals\n\
  \  (gen/such-that not-empty (gen/vector gen-rental)))\n\n(def gen-rental-order\n\
  \  (gen/fmap (fn [[customer rentals]]\n              {:customer customer :rentals\
  \ rentals})\n            (gen/tuple gen-customer gen-rentals)))\n\n(def gen-policy\
  \ (gen/elements\n                  [(make-normal-policy)\n                   (make-buy-two-get-one-free-policy)]))\n\
  ```\n\n我在这里不会解释 `clojure.check` 的内部细节，但我将阐述这些生成器的作用：\n\n* `gen-policy` 随机选择两个策略中的一个。\n\
  * `gen-rental-order` 从 `gen-customer` 和 `gen-rentals` 创建一个 map。\n* `gen-rentals`\
  \ 从 `gen-rentals` 创建一个 vector 并确保它不空。\n* `gen-rental` 从 `gen-movie` 和 `gen-days`\
  \ 创建一个 map。\n* `gen-movie` 从 `gen/string-alphanumeric` 和 `gen-movie-type` 创建一个 map。\n\
  * `gen-movie-type` 从这三种类型中选择。\n* `gen-days` 在 1 到 100 之间的整数中选择。\n* `gen-customer`\
  \ 创建一个带有来自 `gen-customer-name` 名称的 map。\n* `gen-customer-name` 生成一个非空字母数字字符串。\n\n\
  你注意到类型规范和生成器之间存在一种奇异的相似性吗？我一样。以下是生成器的几个示例输出：\n\n点击此处查看代码图片\n\n```\n[\n {:customer\
  \ {:name \"5Q\"},\n  :rentals [{:movie {:title \"\", :type :new-release}, :days\
  \ 52}]}\n\n {:customer {:name \"3\"},\n  :rentals [{:movie {:title \"\", :type :new-release},\
  \ :days 51}]}\n\n {:customer {:name \"XA\"},\n  :rentals [{:movie {:title \"r\"\
  , :type :regular}, :days 82}\n            {:movie {:title \"\", :type :childrens},\
  \ :days 60}]}\n\n {:customer {:name \"4v\"},\n  :rentals [{:movie {:title \"3\"\
  , :type :childrens}, :days 29}]}\n\n {:customer {:name \"0rT\"},\n  :rentals [{:movie\
  \ {:title \"\", :type :regular}, :days 42}\n            {:movie {:title \"94Y\"\
  , :type :regular}, :days 34}\n            {:movie {:title \"D5\", :type :new-release},\n\
  \                     :days 58}]}\n\n {:customer {:name \"ZFAK\"},\n  :rentals [{:movie\
  \ {:title \"H8\", :type :regular}, :days 92}\n            {:movie {:title \"d6WS8\"\
  , :type :regular}, :days 59}\n            {:movie {:title \"d\", :type :regular},\
  \ :days 53}\n            {:movie {:title \"Yj8b7\", :type :regular}, :days 58}\n\
  \            {:movie {:title \"Z2q70\", :type :childrens},\n                   \
  \  :days 9}]}\n\n {:customer {:name \"njak\"},\n  :rentals [{:movie {:title \"H8\"\
  , :type :regular}, :days 92}]\n            {:movie {:title \"d6WS8\", :type :regular},\
  \ :days 59}\n            {:movie {:title \"d\", :type :regular}, :days 53}\n   \
  \         {:movie {:title \"Yj8b7\", :type :regular}, :days 58}\n            {:movie\
  \ {:title \"Z2q70\", :type :childrens},\n                     :days 9}]}\n```\n\n\
  \n\n在这里我们看到了 `statement-data` 的 `clojure.spec`，以及确保 `make-statement-data` 的输出符合该定义的\
  \ `quick-check`。很棒。\n\n在这些测试都通过后，我们可以非常确定生成器生成了有效的租赁订单。现在让我们进行属性检查（property checks）。\n\
  \n我们可以检查的一个属性是：确保当 `make-statement-data` 将一个 `rental-order` 转换为 `statement-data`\
  \ 时，`statement-data` 对象的 `:owed` 成员是该对象中列出的所有电影项目的总和。\n\n该属性的 `quick-check` 可能如下所示：\n\
  \n点击此处查看代码图片\n\n```\n(it \"statement data totals are consistent under all policies\"\
  \n  (should-be\n    :result\n    (tc/quick-check\n      100\n      (prop/for-all\n\
  \        [rental-order gen-rental-order\n         policy gen-policy]\n        (let\
  \ [statement-data (make-statement-data\n                               policy rental-order)\n\
  \              prices (map :price (:movies statement-data))\n              owed\
  \ (:owed statement-data)]\n          (= owed (reduce + prices)))))))\n```\n\n这个\
  \ `quick-check` 中有一个 Bug。你能发现它吗？\n\n这是我运行它时的输出：\n\n点击此处查看代码图片\n\n```\n{:shrunk\n\
  \ {:total-nodes-visited 45,\n  :depth 14,\n  :pass? false,\n  :result false,\n \
  \ :result-data nil,\n  :time-shrinking-ms 3,\n  :smallest\n    [{:customer {:name\
  \ \"0\"},\n      :rentals [{:movie {:title \"\", :type :regular}, :days 1}\n   \
  \             {:movie {:title \"\", :type :regular}, :days 1}\n                {:movie\
  \ {:title \"\", :type :regular}, :days 1}]}\n     {:type\n      :video-store.\n\
  \        buy-two-get-one-free-policy/buy-two-get-one-free}]},\n  :failed-after-ms\
  \ 0,\n  :num-tests 7,\n  :seed 1672092997135,\n  :fail\n   [{:customer {:name \"\
  4s7u\"},\n     :rentals\n     [{:movie {:title \"i7jiVAd\", :type :childrens}, :days\
  \ 85}\n      {:movie {:title \"7MQM\", :type :new-release}, :days 26}\n      {:movie\
  \ {:title \"qlS4S\", :type :new-release}, :days 99}\n      {:movie {:title \"X\"\
  , :type :regular}, :days 87}\n      {:movie {:title \"w1cRbM\", :type :regular},\
  \ :days 11}\n      {:movie {:title \"7Hb41O5\", :type :regular}, :days 63}\n   \
  \   {:movie {:title \"xWc\", :type :childrens}, :days 41}]}\n    {:type\n     :video-store.\n\
  \       buy-two-get-one-free-policy/buy-two-get-one-free}],\n  :result false,\n\
  \  :result-data nil,\n  :failing-size 6,\n  :pass? false}\n```\n\n是的，我知道这看起来很糟糕；但这正是\
  \ `quick-check` 真正的魔力所在，所以请耐心听。\n\n首先，你看到顶部那个名为 `:shrunk` 的元素了吗？那是这里发生什么的一个大线索。当\
  \ `quick-check` 找到错误时，它开始寻找最小的随机生成输入，该输入仍然产生该错误。\n\n看 `:fail` 元素。那是导致初始失败的 `rental-order`。现在看\
  \ `:shrunk` 元素中的 `:smallest` 元素。`quick-check` 函数成功地在保持失败的情况下缩小了 `rental-order`。这是它能找到的失败的最小\
  \ `rental-order`。\n\n它为什么会失败呢？注意这里有三部电影。同时也注意策略是 `buy-two-get-one-free`（买二送一）。啊，当然，在那种策略下，电影的总和*并不等于*\
  \ `:owed` 元素。\n\n正是这种收缩（shrinking）行为使得基于属性测试（property-based testing）成为了一种诊断技术。\n\
  \n## 函数式\n\n那么为什么像 `quick-check` 这样的工具在面向对象的语言中不更流行呢？也许是因为它们与纯函数配合得最好。我设在可变系统中设置生成器和测试属性是可能的，但可能比在不可变系统中要复杂得多。\n\
  \n## 14\n\n## GUI\n\n![](img/18_unnum_gui.jpg)\n\n多年来，我在函数式程序中使用过两个不同的 GUI 框架。第一个名为\
  \ Quil，(1)，它基于流行的 Java 框架 Processing.^(2)。第二个是 SeeSaw，(3)，它基于旧的 Java Swing^(4) 框架。\n\
  \n1\n2\n3\n4\n\nQuil 是“函数式的”，这使其易于使用。SeeSaw 不是函数的。它依赖于可变状态。\n\n最初的想法是通过让乌龟绘制有趣的形状来向孩子们介绍编程。我不知道这对孩子们效果如何，但对于想要绘制复杂设计的程序员来说，事实证明非常有用。\n\
  \n总之，一段时间以前，我想在 Clojure 中有一个龟图系统会很有趣，这样我可以轻松研究一些数学和几何问题。\n\n我的目标不是创建一个输入命令的龟图控制台。相反，我想要一个图形\
  \ API，让我可以在 Clojure 中编写图形函数。\n\n### Quil 中的龟图\n\n20 世纪 60 年代发明的的一类简单指令控制了一个被称为“龟”的机器人。它坐在纸上，拥有一支可以抬起落下的笔。它可以被命令向前或向后移动距离，或者向左向右旋转度数。\n\
  \n图 14.1 是发明者 Seymour Papert 和他的龟之一。\n\n![](img/c14f001.jpg)\n\n**图 14.1 Seymour\
  \ Papert 和他的龟**\n\n所以，例如，如果你想画一个正方形，你可以发出这些命令：\n\n```\n笔下\n前进 10\n右 90\n前进 10\n\
  右 90\n前进 10\n右 90\n前进 10\n笔起\n```\n\n龟图是为 Logo 发明的的一套简单指令。机器人可以被命令向前或向后移动距离，或者向左向右旋转度数。\n\
  \n遍历 `spacar` 的源码超出了本书的范围。然而，有一个更简单的 Quil 程序可以在你的浏览器中运行。\n\n我在书中提到过几次 `spacar`。它实际上在我的浏览器中可以运行\
  \ Clojure。\n\n我用了一天时间移植过来。\n\n```cl\n(defn polygon [theta, len, n]\n  (pen-down)\n\
  \  (speed 1000)\n  (dotimes [_ n]\n    (forward len)\n    (right theta)))\n\n(defn\
  \ turtle-script []\n  (polygon 144 400 5))\n```\n\n该程序绘制了图 14.2 中的图片。（注意位于星形左顶点的小龟。）\n\
  \n![](img/c14f002.jpg)\n\n**图 14.2 使用龟图绘制的星**\n\n`turtle-script` 函数是 `turtle-graphics`\
  \ 系统的入口。你把绘图命令放在这里。在这种情况下，我把一个对 `polygon` 函数的调用放在这里。\n\n\n\n你可能已经注意到，`polygon` 函数似乎并不是函数式的，因为它没有从输入产生返回值。相反，它具有在屏幕上绘图的副作用。此外，每条命令都会改变乌龟（turtle）的状态。因此`turtle-graphics`\
  \ 程序不是函数式的。\n\n然而，`turtle-graphics` 框架是“函数式”的。或者准确地说，它已经是 GUI 程序能达到的函数式程度了。毕竟，GUI\
  \ 程序的目的就是改变屏幕的状态。\n\n尽管你可能觉得这个很有趣：[`fsharpforfunandprofit.com/posts/13-ways-of-looking-at-a-turtle/`](https://fsharpforfunandprofit.com/posts/13-ways-of-looking-at-a-turtle/)。\n\
  \n`turtle-graphics` 框架从配置和调用 Quil 开始：\n\n点击此处查看代码图片\n\n```\n(defn ^:export -main\
  \ [& args]\n  (q/defsketch turtle-graphics\n               :title \"Turtle Graphics\"\
  \n               :size [1000 1000]\n               :setup setup\n              \
  \ :update update-state\n               :draw draw-state\n               :features\
  \ [:keep-on-top]\n               :middleware [m/fun-mode])\n  args)\n```\n\n我在这里不会对\
  \ Quil 进行进行完整的教程，但有几点我应该指出来。注意 `:setup`、`:update` 和 `:draw` 元素。每一个元素都指向一个函数。\n\n\
  `setup` 函数会在程序开始时调用一次。\n\n`draw-state` 函数每秒会被调用 60 次，以刷新屏幕。所有应该出现在屏幕上的内容都必须由 `draw`\
  \ 函数绘制。屏幕不会记住任何东西。\n\n`update-state` 函数会在 `draw-state` 函数调用之前被调用。这个函数用于更改正在绘图的状态。把它想象成将屏幕元素移动到未来\
  \ 1/60 秒的函数。\n\n把它想象成一个非常简单的循环：\n\n点击此处查看代码图片\n\n```\n(loop [state (setup)]\n  (draw-state\
  \ state)\n  (recur (update-state state)))\n```\n\n如果你把这看作一个尾递归循环，那么屏幕的内容就是尾递归的值。所以尽管我们正在改变屏幕的内容，但我们是在递归的尾部执行的，这种改变是无害的。因此，虽然不是纯函数式的，但它已经是任何\
  \ TCO 系统所能达到的“函数式”程度了。\n\n这是我的 `setup` 函数：\n\n点击此处查看代码图片\n\n```\n(defn setup []\n\
  \  (q/frame-rate 60)\n  (q/color-mode :rgb)\n  (let [state {:turtle (turtle/make)\n\
  \               :channel channel}]\n    (async/go\n      (turtle-script)\n     \
  \ (prn \"Turtle script complete\"))\n    state))\n```\n\n这部分开始非常简单。它将帧率设置为 60fps，颜色模式设置为\
  \ RGB，并创建了传递给 `update-state` 和 `draw-state` 的 `state` 对象。\n\n`async/go` 函数启动了一个新的轻量级线程，我们的\
  \ `turtle-script` 将在其中执行。\n\n`state` 对象由 `channel` 和 `turtle` 组成。我们稍后会讨论 `channel`。现在，让我们关注\
  \ `turtle`：\n\n点击此处查看代码图片\n\n```\n(s/def ::position (s/tuple number? number?))\n\
  (s/def ::heading (s/and number? #(<= 0 % 360)))\n(s/def ::velocity number?)\n(s/def\
  \ ::distance number?)\n(s/def ::omega number?)\n(s/def ::angle number?)\n(s/def\
  \ ::weight (s/and pos? number?))\n(s/def ::state #{:idle :busy})\n(s/def ::pen #{:up\
  \ :down})\n(s/def ::pen-start (s/or :nil nil?\n                         :pos (s/tuple\
  \ number? number?)))\n(s/def ::line-start (s/tuple number? number?))\n(s/def ::line-end\
  \ (s/tuple number? number?))\n(s/def ::line (s/keys :req-un [::line-start ::line-end]))\n\
  (s/def ::lines (s/coll-of ::line))\n(s/def ::visible boolean?)\n(s/def ::speed (s/and\
  \ pos? number?))\n```\n\n### 绘制乌龟\n\n`draw-state` 函数被 Quil 每秒调用 60 次，它将屏幕背景颜色设置为浅灰色，将绘图置于\
  \ (500, 500)，然后调用 `turtle/draw`，它会绘制当前正在进行的线条，以及之前绘制的所有其他线条。最后，它会绘制乌龟本身。注意 Quil\
  \ 如何帮助处理平移和旋转。\n\n### 乌龟模块\n\n点击此处查看代码图片\n\n```\n(defn draw-state [state]\n  (q/background\
  \ 240)\n  (q/with-translation\n    [500 500]\n    (let [{keys [turtle]} state]\n\
  \      (turtle/draw turtle))))\n\n——Turtle——\n\n(defn draw [turtle]\n  (when (=\
  \ :down (:pen turtle))\n    (q/stroke 0)\n    (q/stroke-weight (:weight turtle)))\n\
  \    (q/line (:pen-start turtle) (:position turtle)))\n\n  (doseq [line (:lines\
  \ turtle)]\n    (q/stroke-weight (:line-weight line))\n    (q/line (:line-start\
  \ line) (:line-end line)))\n\n  (when (:visible turtle)\n    (q/stroke-weight 1)\n\
  \    (let [[x y] (:position turtle)\n          heading (q/radians (:heading turtle))\n\
  \          base-left (- WIDTH 2))\n          base-right (/ WIDTH 2)\n          tip\
  \ HEIGHT]\n      (q/stroke 0)\n      (q/with-translation\n        [x y]\n      \
  \  (q/with-rotation\n          [heading]\n          (q/line 0 base-left 0 base-right)\n\
  \          (q/line 0 base-left tip 0)\n          (q/line 0 base-right tip 0))))\n\
  ```\n\n### 更新乌龟状态\n\n我们如何更新乌龟的状态？\n\n```fsharp\n(defn update-state [{keys [channel]\
  \ :as state}]\n  (let [turtle (:turtle state)\n        turtle (turtle/update-turtle\
  \ turtle)]\n    (assoc state :turtle (handle-commands channel turtle))))\n```\n\n\
  `update-state` 函数调用 `turtle/update-turtle`。然后它调用 `handle-commands`，那里又有那个 `channel`。我们先看\
  \ `update-turtle`：\n\n\n\n\n\n```clojure\n(defn update-position\n  [{:keys [position\
  \ velocity heading distance] :as turtle}]\n  (let [step (min (q/abs velocity) distance)\n\
  \        distance (- distance step)\n        step (if (neg? velocity) (- step) step)\n\
  \        radians (q/radians heading)\n        [x y] position\n        vx (* step\
  \ (Math/cos radians))\n        vy (* step (Math/sin radians))\n        position\
  \ [(+ x vx) (+ y vy)]]\n    (assoc turtle :position position\n                 \
  \ :distance distance\n                  :velocity (if (zero? distance) 0.0 velocity))))\n\
  \n(defn update-heading [{:keys [heading omega angle] :as turtle}]\n  (let [angle-step\
  \ (min (q/abs omega) angle)\n        angle (- angle angle-step)\n        angle-step\
  \ (if (neg? omega) (- angle-step) angle-step)\n        heading (mod (+ heading angle-step)\
  \ 360)]\n    (assoc turtle :heading heading\n                  :angle angle\n  \
  \                :omega (if (zero? angle) 0.0 omega))))\n\n(defn make-line [{:keys\
  \ [pen-start position weight]}]\n  {:line-start pen-start\n   :line-end position\n\
  \   :line-weight weight})\n\n(defn update-turtle [turtle]\n  {:post [(s/assert ::turtle\
  \ %)]}\n  (if (= :idle (:state turtle))\n    turtle\n    (let [{:keys [distance\n\
  \                  state\n                  angle\n                  lines\n   \
  \               position\n                  pen\n                  pen-start] :as\
  \ turtle}\n          (-> turtle\n              (update-position)\n             \
  \ (update-heading))\n          done? (and (zero? distance)\n                   \
  \  (zero? angle))\n          state (if done? :idle state)\n          lines (if (and\
  \ done? (= pen :down))\n                  (conj lines (make-line turtle))\n    \
  \              lines)\n          pen-start (if (and done? (= pen :down))\n     \
  \                 position\n                      pen-start)]\n      (assoc turtle\n\
  \             :state state\n             :lines lines\n             :pen-start pen-start))))\n\
  ```\n\n注意 `update-turtle` 有一个 `:post` 条件，用于在更新后检查乌龟的类型。当你更新一个大型结构时，知道自己没有破坏其中的某个小部分，这种感觉很棒。\n\
  \n如果 `turtle` 的 `:state` 为 `:idle`（即意味着它既没有在移动也没有旋转），那么我们就不进行任何更改。否则，我们会更新 `turtle`\
  \ 的位置和方向，然后对其内部结构进行解构。当当前动画运动中剩余的距离和角度为零时，我们就完成了操作。如果任务完成，我们将 `:state` 设置为 `:idle`。\n\
  \n如果任务完成且画笔处于按下状态（:down），我们将正在绘制的线条添加到之前的线条列表中，并更新 `pen-start` 为当前位置，为下一条线条做准备。\n\
  \n更新位置和方向是简单的函数，它们执行必要的三角计算，将乌龟放置在适当的位置和方向上。它们都使用乌龟的 `:velocity` 来调整每次更新时步长的大小。\n\
  \n现在来处理命令：\n\n点击此处查看代码图片\n\n```clojure\n(defn handle-commands [channel turtle]\n\
  \  (loop [turtle turtle]\n    (let [command (if (= :idle (:state turtle))\n    \
  \                (async/poll! channel)\n                    nil)]\n      (if (nil?\
  \ command)\n        turtle\n        (recur (turtle/handle-command turtle command))))))\n\
  ```\n\n如果乌龟处于 `:idle` 状态，我们就准备好接收命令了。因此，我们轮询 `channel`。如果 `channel` 上有命令，通过调用 `turtle/handle-command`\
  \ 处理它，然后重复此过程，直到 `channel` 上没有命令为止。\n\n处理每个命令非常直观：\n\n点击此处查看代码图片\n\n```clojure\n\
  (defn pen-down [{:keys [pen position pen-start] :as turtle}]\n  (assoc turtle :pen\
  \ :down\n                :pen-start (if (= :up pen) position pen-start)))\n\n(defn\
  \ pen-up [{:keys [pen lines] :as turtle}]\n  (if (= :up pen)\n    turtle\n    (let\
  \ [new-line (make-line turtle)\n          lines (conj lines new-line)]\n      (assoc\
  \ turtle :pen :up\n                    :pen-start nil\n                    :lines\
  \ lines))))\n\n(defn forward [turtle [distance]]\n  (assoc turtle :velocity (:speed\
  \ turtle)\n                :distance distance\n                :state :busy))\n\n\
  (defn back [turtle [distance]]\n  (assoc turtle :velocity (- (:speed turtle))\n\
  \                :distance distance\n                :state :busy))\n\n(defn right\
  \ [turtle [angle]]\n  (assoc turtle :omega (* 2 (:speed turtle))\n             \
  \   :angle angle\n                :state :busy))\n\n(defn left [turtle [angle]]\n\
  \  (assoc turtle :omega (* -2 (:speed turtle))\n                :angle angle\n \
  \               :state :busy))\n\n(defn hide [turtle]\n  (assoc turtle :visible\
  \ false))\n\n(defn show [turtle]\n  (assoc turtle :visible true))\n\n(defn weight\
  \ [turtle [weight]]\n  (assoc turtle :weight weight))\n\n(defn speed [turtle [speed]]\n\
  \  (assoc turtle :speed speed))\n\n(defn handle-command [turtle [cmd]]\n  (cond\
  \ cmd\n    :forward (forward turtle)\n    :back (back turtle)\n    :right (right\
  \ turtle)\n    :left (left turtle)\n    :pen-down (pen-down turtle)\n    :pen-up\
  \ (pen-up turtle)\n    :hide (hide turtle)\n    :show (show turtle)\n    :weight\
  \ (weight turtle)\n    :speed (speed turtle))))\n```\n\n\n\n\n\n你可能并不熟悉我在这里使用的电话术语。事实上，如果你是在\
  \ 2000 年之后出生，你可能对电话本身都不熟悉。所以，出于历史和怀旧的考虑，让我带你走一遍这个过程。\n\nBob 想给 Alice 打电话。Bob 拿起听筒^(1)\
  \ 并将其放在耳边。电话公司（telco）向听筒发送拨号音^(2)。听到该音后，Bob 拨号^(3) Alice 的号码。随后，电话公司向 Alice 的电话发送铃响电压^(4)，并向\
  \ Bob 的听筒发送回铃音^(5)。Alice 听到手机响铃并拿起听筒。电话公司接通了 Bob 和 Alice 的通话，Alice 对 Bob 说“你好”。\n\
  \n- 1. 20 世纪初的电话有一个挂钩听筒的钩。到 20 世纪 60 年代，钩被放置听筒的底座取代；但仍然被称为钩。\n- 2. 这是一个非常容易识别的声音，意味着电话系统已准备好让你拨打想要通话的号码。\n\
  - 3. 动词 `dial` 的意思是输入电话号码。在 20 世纪 60 年代，这是通过使用电话上的旋转拨盘实现的。\n- 4. 美国为 90 伏。\n- 5.\
  \ 另一个非常独特的声音，旨在等待被叫电话接听期间让呼叫者娱乐。\n\n在这个场景中运行着三个有限状态机：Bob、telco 和 Alice。Bob 和 Alice\
  \ 分别运行 图 15.2 所示的用户状态机^(6)。\n\n![](img/c15f002.jpg)\n\n**图 15.2.** 用户状态机\n\n- 6.\
  \ 这些状态机经过缩写以保持简单。在实际上，所有状态都有返回空闲（Idle）的转换。\n\nTelco 状态机如 图 15.3 所示。\n\n![](img/c15f003.jpg)\n\
  \n**图 15.3.** Telco 状态机\n\n在这些图中，`->` 符号意味着向另一个状态机发送相应的事件。\n\n所以，当 Bob 决定打电话（来自\
  \ Idle 状态的 call 事件）时，用户状态机向 Telco 发送摘机（off-hook）事件。当 Telco 处于等待拨号（Waiting for Dial）状态并接收到来自用户的拨号（Dial）事件时，它向相应的的用户状态机发送铃响（Ring）和回铃（Ringback）事件。\n\
  \n如果你仔细研究这些图，你应该能够看到状态机和消息是如何相互作用以允许 Bob 给 Alice 的的。\n\n我们可以用 Clojure 非常简单地编写这些状态机：\n\
  \n点击此处查看代码图像\n\n```\n(def user-sm\n  {:idle {:call [:calling caller-off-hook]\n\
  \          :ring [:waiting-for-connection callee-off-hook]\n          :disconnect\
  \ [:idle nil]}\n   :calling {:dialtone [:dialing dial]}\n   :dialing {:ringback\
  \ [:waiting-for-connection nil]}\n   :waiting-for-connection {:connected [:talking\
  \ talk]}\n   :talking {:disconnect [:idle nil]}})\n\n(def telco-sm\n  {:idle {:caller-off-hook\
  \ [:waiting-for-dial dialtone]\n          :hangup [:idle nil]}\n   :waiting-for-dial\
  \ {:dial [:waiting-for-answer ring]}\n   :waiting-for-answer {:callee-off-hook\n\
  \                        [:waiting-for-hangup connect]}\n   :waiting-for-hangup\
  \ {:hangup [:idle disconnect]}})\n```\n\n每个状态机都是状态的哈希映射（hash map），每个状态包含一个事件的哈希映射，指定了新状态和要执行的操作。\n\
  \n所以，当 `user-sm` 处于 `:idle` 状态并收到 `:call` 事件时，它转换到 `:calling` 状态并调用 `caller-off-hook`\
  \ 函数。\n\n这些状态机可以通过以下 `transition` 函数执行：\n\n点击此处查看代码图像\n\n```\n(defn transition [machine-agent\
  \ event event-data]\n  (swap! log conj (str (:name machine-agent) \"<-\" event))\n\
  \  (let [state (:state machine-agent)\n        sm (:machine machine-agent)\n   \
  \     result (get-in7 sm [state event])]\n    (if (nil? result)\n      (do\n   \
  \     (swap! log conj \"TILT!\")\n        machine-agent)\n      (do\n\n        (when\
  \ (second result)\n          ((second result))\n        machine-agent))\n```\n\n\
  \n\n\n\n## 8. 简而言，解构是一种将复杂数据元素拆分为具名组件的方便方法。更多详情请参阅 Clojure 文档。\n\n给定此实现，我们应该能够通过执行以下代码在\
  \ Bob 和 Alice 之间建立通话。我已以测试的形式编写了它：\n\n点击此处查看代码图片\n\n```\n(it \"should make and receive\
  \ call\"\n  (let [caller (make-user \"Bob\")\n        callee (make-user \"Alice\"\
  )\n        telco (make-telco \"telco\")]\n    (reset! log [])\n    (send caller\
  \ transition :call [telco caller callee])\n    (Thread/sleep 100)\n    (prn @log)\n\
  \    (should= :idle (:state @caller))\n    (should= :idle (:state @callee))\n  \
  \  (should= :idle (:state @telco))))\n```\n\n该测试通过了，这意味着在 100 毫秒之后，所有的状态机都已返回空闲状态。日志输出如下：\n\
  \n点击此处查看代码图片\n\n```\n\"Bob<-:call\" \"Bob goes off hook\"\n\"telco<-:caller-off-hook\"\
  \ \"dialtone to Bob\"\n\"Bob<-:dialtone\" \"Bob dials\"\n\"telco<-:dial\" \"telco\
  \ rings Alice\"\n\"Alice<-:ring\" \"Alice goes off hook\"\n\"Bob<-:ringback\"\n\"\
  telco<-:callee-off-hook\" \"telco connects\"\n\"Bob<-:connected\" \"Bob talks\"\n\
  \"Alice<-:connected\" \"Alice talks\"\n\"Bob hangs up\"\n\"Alice hangs up\"\n\"\
  telco<-:hangup\" \"disconnect\"\n\"Alice<-:disconnect\"\n\"Bob<-:disconnect\"\n\"\
  telco<-:hangup\"\n```\n\n你可以看到线程是如何相互交错执行的，而三个有限状态机共同工作，驱动通话圆满完成。\n\n这三个代理具有可变状态；但不会出现并发更新问题，因为代理会序列化它们的操作。所以没有竞态条件，对吧？\n\
