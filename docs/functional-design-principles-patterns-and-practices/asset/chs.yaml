  ## 淋浴解决问题\n## 是时候疯狂繁殖了\n## 鲨鱼怎么办？\n## 结论\n## 结语\n## 索引\n\n## 前言\nBob 叔叔（Uncle Bob）不需要自我介绍。作为软件开发领域的杰军人物，Bob\
  \ 编写了多本关于软件设计和交付的书籍。他的一些著作在世界各地的计算机科学课堂上教授。\n\n我在大学期间开始学习函数式编程。我没有就读教授 `Scheme`\
  \ 和 `C` 的精英计算机科学专业，但我对所有计算事物都充满渴求。那时还没有谈论函数式编程。我看到未来将有一股编程浪潮；在未来，开发者将花费更多时间思考他们正在解决的问题，而不是如何管理它。在读完《函数式设计》后，我希望那时以及现在，在我从学生到专业人士的职业每个阶段都能拥有这本书。\n\
  \n《函数式设计》散发着一种“诞生即经典”的气质。它就像是一本专为专业软件开发者编写的书。Bob 触及软件工程的基础并对其进行扩展，用简洁的语言描述了我多年来的经验。他优雅地揭开帷纱，展示了函数式编程元素如何让软件设计变得简单而务实。他这样做并没有让来自\
  \ `C#`、`C++` 或 `Java` 等语言的经验面向对象程序员感到疏远。\n\n通过引入 `Java` 的比较分析，《函数式设计》介绍了基于 Lisp\
  \ 方言 `Clojure` 的函数式系统设计。`Clojure` 不像 `Haskell` 那样必须使用纯函数式编程概念。相反，`Clojure` 强烈鼓励这种做法，使其成为极好的入门函数式编程语言。《函数式设计》仔细指出了\
  \ `Clojure` 开发者偶尔会遇到的少数陷阱。作为一名 `Clojure` 顾问，我可以证明这一点。这本书教会你如何让语言（和开发者）不成为障碍，而不是寻找那些能避开障碍的东西。\n\
  \n\n\n\n\nClojure 的批评者会说，Clojure 不适用于任何足够大的代码库。正如你将在接下来的章节中学到的，设计原则和模式适用于 Clojure\
  \ 就像适用于 Java、C# 或 C++ 一样。SOLID 设计原则将帮助你通过函数式编程构建更好的软件。函数式程序员长期以来对设计模式嗤之以鼻，但《Functional\
  \ Design》解构了这种批评，并准确地展示了开发者为什么需要它们，以及开发者如何自己实现它们。\n\n我曾在网上撰写过大量关于 Clojure Classic\
  \ 设计模式的文章，因此发现这本书在向读者展示代码之前，先通过周全的图表探讨设计模式用法，当你读到那些章节时，你已经能够根据图表构海出 Clojure 代码了。然后，代码随之而来。最后，《Functional\
  \ Design》将通过带你实现一个使用设计原则和模式的“企业”应用，将这一切串联在一起。\n\n—Janet A. Carr，独立 Clojure 顾问\n\n\
  ## 前言\n\n这本书是为那些身处一线的程序员准备的，他们想要学习如何使用函数式编程语言来完成实际工作。因此，我不会花费大量时间在函数式编程的理论方面上，例如\
  \ `Monads`、`Monoids`、`Functors`、`Categories` 等。并不是说这些想法无效、没有价值或不相关；而是它们往往并不影响程序员的日常世界。这是因为它们已经“烘焙”在了常用语言、库和框架的“蛋糕”中。如果你对函数式理论感兴趣，我推荐\
  \ Mark Seemann 的著作。\n\n本书关于如何以及以及为什么在为真实客户构建真实系统的日常工作中使用函数式编程。在接下来的页面中，我们将比较并对比如\
  \ `Java` 等面向对象的语言中常见的编码结构，与如 `Clojure` 等函数式语言中常见的编码结构。\n\n我特别选择了这两种语言，是因为 `Java`\
  \ 被广为人知和使用，而 `Clojure` 极其容易学习。\n\n### 函数式与过程化编程的简史\n\n1936 年，两位数学家艾兰·图灵（Alan Turing）和阿隆佐·丘奇（Alonzo\
  \ Church）独立解决了大卫·希尔伯特（David Hilbert）著名的挑战之一：`The Decidability Problem`（可判定性问题）。详细描述这个问题超出了本介绍的范围，只能说它与找到整数公式的通用解有关。这与我们有关，因为数字计算机中的每个程序都是一个整数公式。\n\
  \n另一种说法是，这两个人独立地证明了不存在这样的解。图灵和丘奇后来证明了他们的方法是等价的。\n\n### 关于 Clojure\n\nClojure 在语义上非常丰富，但在语法上极其简单。这意味着语言本身拥有一套非常简单的语法。库和惯用法需要大量的努力；而语言本身几乎不需要任何努力。\n\
  \n话虽如此，这本书并不是一本 Clojure 教程。我将在早期章节解释一些基础知识，并在全文中加入一些解释性脚注，但我也将依靠你，亲爱的读者，去完成功课并查阅资料。有几个网站可以提供帮助。我最喜欢的之一是\
  \ `https://clojure.org/api/cheatsheet`。\n\n### 关于架构与设计\n\n本书的一个主要重点是描述为函数式风格构建的系统提供设计和架构原则。为此，我将使用统一建模语言（UML）图表，并引用软件设计的\
  \ `SOLID` 原则、`Design Patterns`（设计模式）以及 `Clean Architecture`（整洁架构）的概念。不要担心，我将在进展过程中进行解释，并在你需要查阅资料时将引用许多外部参考文献。\n\
  \n### 关于面向对象\n\n\n\n\n许多人认为面向对象程序编程和函数式编程是不兼容的。这些页面将证明事实并非如此。你在这里看到的程序、设计和架构将是函数式和面向对象概念的混合体。根据我的经验，也是我坚有的观点，这两种风格是完全兼容的，优秀的程序员可以并且应该将它们结合起来。\n\
  \n# 关于“函数式”\n\n在本文，我将使用 `functional`（函数式）这一术语。我会对其进行定义并阐述。随着章节的推进，我也会对其进行一些灵活处理。有些示例虽然是用函数式语言并按照函数式风格编写的，但它们并不是\
  \ `purely`（纯粹）函数式的。在大多数此类情况下，我会在 `functional` 一词上加上引号，并使用脚注指出我所做的灵活处理。\n\n为什么要采取这种灵活处理呢？因为这是一本关于实用的书，而不是理论。我更感兴趣的是从函数式\
  \ `style` 中提取益处，而不是严格遵循某种理想。例如，正如我们在第一章中看到的，从用户处获取输入的“函数”并不是纯函数式的。然而，我会在适当的情况下此类“函数”。\n\
  \n所有章节中示例的源代码都在一个名为 GitHub 仓库中，地址为 `https://github.com/unclebob/FunctionalDesign`。\n\
