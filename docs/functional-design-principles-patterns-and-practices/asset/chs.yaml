  \nISBN-13: 978-0-13-817639-6\n\nISBN-10: 0-13-817639-6\n\n## 献辞\n\n献我的家人，我对他们的爱解释了我所做的一切。\n\
  \n首先，献给我结婚 50 年的妻子，那位美丽的 16 岁少女，有着闪烁的棕色眼睛和长长的黑发，她捕捉了我的心并守护了它半个多世纪。她依然像我遇见她的第一天一样美丽。那双闪烁的棕色眼睛和流动的发丝每天都令我着迷。孩子的母亲。我生活的锚石。我唯一的爱。\n\
  \n献给 Angela，我美丽的长女，忠诚的女儿，她那极具感染力的微笑会融化你的心，并让你深信世界一切如好。我曾问过她想成为什么。她的答案是“有趣！”她随后实现了并远超了这一目标。她对生活无限的热情感染了她遇到的每一个人。她嫁给了\
  \ Matt，那是一个优秀、勤奋且诚实（且有趣）的男人。他们两人将分享的乐趣变成了一场充满成就感的山地车狂热。他们住在一个林木环绕的山丘，并生了三个美丽、聪明且有才的女儿让我宠爱。\n\
  \n献给 Micah，我的二子，充满激情的儿子。他继承了母亲那双闪烁的棕色眼睛。我曾问过他想成为什么。他说：“富有！”我很高兴地报告，他做得非常出色。他花了十年的大部分时间与我共，然后创立了自己的软件公司，并在几年后将其卖掉。接着他花了一年时间在车库里造了一架飞机。现在他正经营着另一家软件公司。他的成功很大归功于\
  \ Angelique，他娶的那个美丽、勤奋且深智的女性。他们培养了两个出色的年轻男性。\n\n献给 Gina，我的三女，不断惊喜的女儿。如果一个女人可以比我的妻子更漂亮，那么\
  \ Gina 就是那个人。她成为了一名成就化学工程师，处理铀、氟和浓氢氧化钠等物质。她戴上安全帽，攀爬反应器，并管理着化学工厂操作员团队。她嫁给了 Keith，一位优秀、勤奋且诚实的机械工程师。他们交换着在大型复杂工厂工作的冒险故事。他们育有两个漂亮的孩子——一个男孩和一个女孩，这是我的孩子中第一个享受到这一特权的家庭。\n\
  \n拥有装满箭的箭袋（指子孙辈）的男人是幸福的。\n\n\n\n\n\n## 关于作弊\n## 拷贝\n## 结构共享\n\n# 第 3 章 递归与迭代\n###\
