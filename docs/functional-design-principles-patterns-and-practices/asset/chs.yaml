  ```\n\n注意，如果 `fish` 繁殖了，返回值包含了两个后代。但如果发生了错误，我们返回 `nil`。这是因为我认为 `fish` 的高层策略包含了类似这样的内容：\n\
  \n点击此处查看代码图片\n\n```\n(if-let [result (animal/reproduce …)]\n  result\n  (animal/move\
  \ …))\n```\n\n无论如何，这里是通过该测试的简略代码：\n\n点击此处查看代码图片\n\n```\n(ns wator.animal\n  (:require\
