  public class Route {\n  private Stop[] stops;\n\n  public Route(Stop... stops) {\n\
  \    this.stops = stops;\n  }\n\n  public Stop get(int stopNumber) {\n    return\
  \ stops[stopNumber];\n  }\n\n  public int getNextStop(int stopNumber) {\n    return\
  \ (stopNumber + 1) % stops.length;\n  }\n\n  public void stopAt(Driver driver, int\
  \ stopNumber) {\n    stops[stopNumber].addDriver(driver);\n  }\n\n  public void\
  \ leave(Driver driver, int stopNumber) {\n    stops[stopNumber].removeDriver(driver);\n\
  \  }\n}\n```\n\n## 站点\n\n点击此处查看代码图片\n\n```java\npackage gossipingBusDrivers;\n\n\
  import java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\n\
  import java.util.Set;\n\npublic class Stop {\n  private String name;\n  private\
  \ List<Driver> drivers = new ArrayList<>();\n\n  public Stop(String name) {\n  \
  \  this.name = name;\n  }\n\n  public String toString() {\n    return name;\n  }\n\
  \n  public List<Driver> getDrivers() {\n    return drivers;\n  }\n\n  public void\
  \ addDriver(Driver driver) {\n    drivers.add(driver);\n  }\n\n  public void removeDriver(Driver\
  \ driver) {\n    drivers.remove(driver);\n  }\n\n  public void gossip() {\n    Set<Rumor>\
  \ rumorsAtStop = new HashSet<>();\n    for (Driver d : drivers)\n      rumorsAtStop.addAll(d.getRumors());\n\
  \    for (Driver d : drivers)\n      d.addRumors(rumorsAtStop);\n  }\n}\n```\n\n\
  ## 谣言\n\n```java\npackage gossipingBusDrivers;\n\npublic class Rumor {\n  private\
  \ String name;\n  public Rumor(String name) {\n    this.name = name;\n  }\n\n  public\
