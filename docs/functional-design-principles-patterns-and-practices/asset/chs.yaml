  \ 对象。我们创建了 `JsonVisitor`。通过 `accept` 方法将 `JsonVisitor` 传递给我们的 `Shape`。`accept` 方法会多态地分发到\
  \ `Shape` 的适当子类——假设它是一个 `Square`。`Square` 的 `accept` 方法会调用 `JsonVisitor` 的 `visit(this)`。由于\
  \ `this` 的类型是 `Square`，因此调用了 `JsonVisitor` 的 `visit(Square s)` 函数。该函数为 `Square`\
  \ 生成 JSON 字符串并将其保存在 `JsonVisitor` 的成员变量中。`getJson()` 函数返回该成员变量的内容。\n\n你可能需要读几遍才能理解。这种技术被称为**双重分发**（`double-dispatch`）。第一次分发部署到\
  \ `Shape` 的子类，因此我们现在知道了该子类的类型。第二次分发部署到访问者的适当子类，并传递了该子类的真实类型。\n\n如果你跟上了所有的步骤，就会发现\
  \ `ShapeVisitor` 的每个派生类都是 `Shape` 类型模型的一个新“方法”，但我们唯一向 `Shape` 添加的只是 `accept` 方法。因此（符合开闭原则\
  \ OCP）。你现在也应该理解为什么我们不能使用装饰器（Decorator）。新函数强依赖于子类。如果你不知道它是一个 `Square`，你就无法为 `Square`\
  \ 生成 JSON 字符串。\n\n现在，我告诉你这些是为了引出：所有这些糟糕的复杂性都是因为语言限制。是的，是的……在这里，设计模式的反对者确实有一定的道理。访问者模式之所以如此复杂，是因为特定的语言特性。\n\
  \n那个特性是什么呢？**封闭类**（`Closed classes`）。\n\n### 是关闭，还是 Clojure？\n\n在 C++ 和 Java 等语言中，我们创建的类是封闭的。这意味着我们无法通过在新的源文件中放入新方法的声明来向类添加新方法。在封闭型语言中，如果我们想向类添加新方法，必须打开该类的源文件，并在类定义内部添加该方法。\n\
  \nClojure 没有这种限制。C# 在某种程度上也是如此。事实上，许多语言允许你在不更改包含类声明的源文件的情况下向类添加方法。\n\nClojure 没有这种限制的原因是类并不是该语言的特性。我们通过约定创建类，而不是通过语法。\n\
  \n所以，等等，这意味着在 Clojure 中我们不需要装饰器模式或访问者模式了吗？不，完全不是这个意思。事实上，正如我们看到的，我们仍然需要 GOF 形式的装饰器。否则你该如何实现\
  \ `journaled-shape` 呢？\n\n然而，在拥有开放类的语言中，GOF 形式的访问者并不是必须的。或者说，GOF 形式的某些细节并不是必要的。\n\
  \n让我给你看这个在 Clojure 中实现的特定访问者。首先是测试：\n\n点击此处查看代码图片\n\n```\n(ns visitor-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [visitor-example\n         \
  \    [square :as square]\n             [json-shape-visitor :as jv]\n           \
  \  [circle :as circle]]))\n\n(describe \"shape-visitor\"\n  (it \"makes json square\"\
  \n    (should= \"{\\\"top-left\\\": [0,0], \\\"side\\\": 1}\"\n             (jv/to-json\
  \ (square/make [0 0] 1))))\n\n  (it \"makes json circle\"\n    (should= \"{\\\"\
  center\\\": [3,4], \\\"radius\\\": 1}\"\n             (jv/to-json (circle/make [3\
  \ 4] 1)))))\n```\n\n这并不太意外；尽管你应该特别注意源代码的依赖。这个测试几乎需要所有东西。\n\n现在让我们回一下 `shape` 类型模型是什么样的。为了简单起见，我移除了所有的\
  \ `clojure.spec` 类型规范：\n\n点击此处查看代码图片\n\n```\n(ns visitor-example.shape)\n\n(defmulti\
  \ translate (fn [shape dx dy] (::type shape)))\n(defmulti scale (fn [shape factor]\
  \ (::type shape)))\n\n———————\n\n(ns visitor-example.square\n  (:require\n    [visitor-example.shape\
  \ :as shape]))\n\n(defn make [top-left side]\n  {::shape/type ::square\n   ::top-left\
  \ top-left\n   ::side side})\n\n(defmethod shape/translate ::square [square dx dy]\n\
  \  (let [[x y] (::top-left square)]\n    (assoc square ::top-left [(+ x dx) (+ y\
  \ dy)])))\n\n(defmethod shape/scale ::square [square factor]\n  (let [side (::side\
  \ square)]\n    (assoc square ::side (* side factor))))\n\n————————\n\n(ns visitor-example.circle\n\
  \  (:require\n    [visitor-example.shape :as shape]))\n\n(defn make [center radius]\n\
  \  {::shape/type ::circle\n   ::center center\n   ::radius radius})\n\n(defmethod\
  \ shape/translate ::circle [circle dx dy]\n  (let [[x y] (::top-left circle)]\n\
  \    (assoc circle ::top-left [(+ x dx) (+ y dy)])))\n\n(defmethod shape/scale ::circle\
  \ [circle factor]\n  (let [side (::side circle)]\n    (assoc circle ::side (* side\
  \ factor))))\n```\n\n\n\n\n在 Java、C# 和 C++ 中，我们可以通过使用 `abstract factory` 来解决这个问题，`App`\
  \ 可以使用它来实例化 `visitor` 对象，而不需要直接依赖它。\n\n在 Clojure 中，我们有另一个且更好的选择。我们可以如下所示将 `json-shape-visitor`\
  \ 的接口与其实现分离开：\n\n点击此处查看代码图片\n\n```clojure\n(ns visitor-example.json-shape-visitor\n\
  \  (:require [visitor-example\n             [shape :as shape]]))\n(defmulti to-json\
  \ ::shape/type)\n\n(ns visitor-example.json-shape-visitor-implementation\n  (:require\
  \ [visitor-example\n             [json-shape-visitor :as v]\n             [circle\
  \ :as circle]\n             [square :as square]]))\n\n(defmethod v/to-json ::square/square\
  \ [square]\n  (let [{:keys [::square/top-left ::square/side]} square\n        [x\
  \ y] top-left]\n    (format \"{\\\"top-left\\\": [%s,%s], \\\"side\\\": %s}\" x\
  \ y side)))\n\n(defmethod v/to-json ::circle/circle [circle]\n  (let [{:keys [::circle/center\
  \ ::circle/radius]} circle\n        [x y] center]\n    (format \"{\\\"center\\\"\
  : [%s,%s], \\\"radius\\\": %s}\" x y radius)))\n```\n\n这里的诀窍在于确保 `json-shape-visitor-implementation`\
  \ 模块被 `main` `require`，这样 `defmethod`s 就能正确注册到 `defmulti` 中：\n\n点击此处查看代码图片\n\n```clojure\n\
  (ns visitor-example.main\n  (:require [visitor-example\n             [json-shape-visitor-implementation]]))\n\
  ```\n\n通常，`main` 在应用程序的任何部分之前被调用，因此应用程序对 `main` 没有源码级依赖。遗憾的是，我的测试无法访问真正的 `main`，因此必须包含该依赖：\n\
  \n15 . Martin, *Clean Architecture*, p. 231.\n\n点击此处查看代码图片\n\n```clojure\n(ns visitor-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [visitor-example\n         \
  \    [square :as square]\n             [json-shape-visitor :as jv]\n           \
  \  [circle :as circle]\n             [main]]))\n\n(describe \"shape-visitor\"\n\
  \  (it \"makes json square\"\n    (should= \"{\\\"top-left\\\": [0,0], \\\"side\\\
  \": 1}\"\n             (jv/to-json (square/make [0 0] 1))))\n\n  (it \"makes json\
  \ circle\"\n    (should= \"{\\\"center\\\": [3,4], \\\"radius\\\": 1}\"\n      \
  \       (jv/to-json (circle/make [3 4] 1)))))\n```\n\n所以，这就是一个在 Clojure 中功能性且架构合格的\
  \ Visitor。正如图 16.10 中的 UML 所示，所有依赖都跨越了架构边界，指向该边界的更高层（抽象）侧。赞美上帝！\n\n![](img/c16f010.jpg)\n\
  \n**图 16.10.** 功能性且架构合格的 Visitor\n\n因此，Visitor 模式是一个 GOF 形式被当时的语言限制所污染的案例。在 1995\
  \ 年 GOF 书籍出版时，关闭类被认为是静态类型语言的必要属性，因此几乎无处不在。\n\n## 抽象工厂\n\n![](img/26_unnum_abstractfactory.jpg)\n\
  \nDIP（依赖倒置原则）建议我们避免对既易变又具体的事产生源码依赖。因此，我们创建抽象结构并尝试将依赖路由到它们。然而，当我们创建对象实例时，往往必须违反这一建议；这会导致架构上的困难，如图\
  \ 16.11 中的 UML 所示。\n\n![](img/c16f011.jpg)\n\n**图 16.11.** 创建导致的 DIP 违反\n\n图 16.11\
  \ 中的 `App` 使用 `Shape` 接口。它需要做的一切都可以通过该接口完成，但例外。`App` 必须创建 `Circle` 和 `Square` 衍生类的实例；这迫使\
  \ `App` 对相应的模块挂了源码依赖。\n\n我们实际上在之前的示例中已经见过这种情况。例如，考虑本章前面 `visitor-example` 测试中的代码。注意，测试对\
  \ `square` 和 `circle` 的源码依赖仅仅是为了调用那些 `make` 函数：\n\n点击此处查看代码图片\n\n```clojure\n(ns\
  \ visitor-example.core-spec\n  (:require [speclj.core :refer :all]\n           \
  \ [visitor-example\n             [square :as square]\n             [json-shape-visitor\
  \ :as jv]\n             [circle :as circle]\n             [main]]))\n\n(describe\
  \ \"shape-visitor\"\n  (it \"makes json square\"\n    (should= \"{\\\"top-left\\\
  \": [0,0], \\\"side\\\": 1}\"\n             (jv/to-json (square/make [0 0] 1))))\n\
  \n  (it \"makes json circle\"\n    (should= \"{\\\"center\\\": [3,4], \\\"radius\\\
  \": 1}\"\n             (jv/to-json (circle/make [3 4] 1)))))\n```\n\n\n\n\n# 引言\n\
  \n关于这个测试需要注意的第一点是，它对 `circle` 或 `square` 没有源文件依赖。它只依赖于两个接口：`shape` 和 `shape-factory`。这是我们的架构目标。\n\
  \n但这个 `main` 依赖是什么？你看到测试开始的 `(before-all (main/init))` 这一了吗？它告诉测试运行器在执行任何测试之前调用\
  \ `(main/init)`。这模拟了 `main` 模块在启动 `App` 之前初始化一切的过程。\n\n这里是 `main` 代码：\n\n点击此处查看代码图片\n\
  \n```kotlin\n(ns abstract-factory-example.main\n  (:require [abstract-factory-example\n\
  \            [shape-factory-implementation :as imp]]))\n\n(def shape-factory (atom\
  \ nil))\n\n(defn init[]\n  (reset! shape-factory (imp/make)))\n```\n\n噢，天！我们有一个名为\
  \ `shape-factory` 的全局 `atom`！那个 `atom` 正在被 `init` 函数初始化为 `shape-factory-implementation`。\n\
  \n回过来看测试，我们看到 `make-circle` 和 `make-square` 方法传递的是解引用后的 `atom`。\n\n像这样设置全局变量是处理工厂的一种非常常见的策略。主程序创建具体的工厂实现，然后将其加载到所有人都可以访问的全局变量中。在静态类型语言中，该全局变量的类型是接口\
  \ `ShapeFactory`。在动态类型语言中，不需要这种类型声明。\n\n## 再次 90 度\n\n再次查看图 16.13 中的那张 UML 图。你看到\
  \ `ShapeFactory` 中的 90 度旋转了吗？你在 `shape-factory` 代码中也能看到它。`ShapeFactory`（以及 `shape-factory`）拥有与\
  \ `Shape` 的子类型对应的方法。\n\n这给 Visitor 模式带来的问题在这里也存在，尽管形式略有不同。每当添加一个新的 `shape` 的子类型时，都必须修改\
  \ `shape-factory`。这违反了 OCP（开闭原则），因为我们必须修改架构边界高层侧的模块。如果 OCP 重要，那么它在跨越此类边界时就尤为重要。仔细研究那张\
  \ UML 图，直到你明白我的意思。\n\n我们可以通过将 90 度旋转替换为接受一个不透明令牌（opaque token）的方法来解决这个问题。类似于这样的：\n\
  \n点击此处查看代码图片\n\n```kotlin\n(ns abstract-factory-example.shape-factory)\n\n(defmulti\
  \ make (fn [factory type & args] (::type factory)))\n\n——————————\n\n(ns abstract-factory-example.shape-factory-implementation\n\
  \  (:require [abstract-factory-example\n             [shape-factory :as factory]\n\
  \             [square :as square]\n             [circle :as circle]]))\n\n(defn\
  \ make []\n  {::factory/type ::implementation})\n\n(defmethod factory/make ::implementation\n\
  \  [factory type & args]\n  (condp = type\n    :square (apply square/make args)\n\
  \    :circle (apply circle/make args)))\n\n————————————————\n\n(ns abstract-factory-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [abstract-factory-example\n\
  \             [shape :as shape]\n             [shape-factory :as factory]\n    \
  \         [main :as main]]))\n\n(describe \"Shape Factory\"\n  (before-all (main/init))\n\
  \  (it \"creates a square\"\n    (let [square (factory/make\n                  \
  \ @main/shape-factory\n                   :square\n                   [100 100]\
  \ 10)]\n      (should= \"Square top-left: [100,100] side: 10\"\n               (shape/to-string\
  \ square))))\n\n  (it \"creates a circle\"\n      (let [circle (factory/make\n \
  \                    @main/shape-factory\n                     :circle\n       \
  \              [100 100] 10)]\n        (should= \"Circle center: [100,100] radius:\
  \ 10\"\n                 (shape/to-string circle)))))\n```\n\n注意传递给 `shape-factory/make`\
  \ 的参数是不透明的。也就是说，它没有由任何其他模块定义，包括特别是 `square` 和 `circle` 模块。`:square` 和 `:circle`\
  \ 关键字没有命名空间，也没有在任何地方声明。它们只是恰好有名字的不透明值。我完全可以用 `1` 代表 `square`，用 `2` 代表 `circle`，或者使用\
  \ `\"square\"` 和 `\"circle\"` 字符串。\n\n这种不透明性是该解决方案的关键。如果我们以后需要添加 `triangle` 子类型，边界线之上的任何内容都不需要更改（符合\
  \ OCP）。\n\n## 类型安全？\n\n在静态类型语言（如 Java）中，这种技术放弃了类型安全。不透明值无法类型安全的。例如，在 Java 中无法使用\
  \ `enum` 来解决这个问题。\n\n在 Clojure 中，我们不关心静态类型安全，但动态类型规范呢？在这方面我们也没办法。使用 `clojure.spec`\
  \ 无法获得优势，因为无论是否使用 `clojure.spec`，所有的错误都将在运行时产生。\n\n例如，没有什么能阻止我用 `shape-factory/make`\
  \ 使用 `sqare`（故意拼写错误）或 `circle`（故意拼写错误），它仍然会抛出异常。\n\n## 总结\n\n我认为在这里回顾一下我在引言中的希望和目标是明智的。我相信你已经理解了函数式编程和\
  \ OOP 是兼容且互益的风格。\n\n## 后记：OO 毒？\n\n![](img/27_unnum_opoison.jpg)\n\n我到目前为止展示的设计模式示例并不罕见。Clojure\
  \ 程序员经常使用 `defmulti` 和 `defmethod` 来表示多态。他们通常使用 map 来表示封装的数据结构（即对象）。他们甚至经常为这些对象构建构造函数。他们可能没有意识到，但他们正在编写\
  \ OO 程序。\n\n至于 *Singleton*（单例模式）：直接创建一个即可。\n\n\n\n\n\n因此，Clojure 是一种面向对象/函数式语言。在某种程度上，像\
  \ Scala、Elixir 和 F# 等语言也是如此。而且，既然事实如此，面向对象的思维仍然是这些语言中进行应用程序建模的完全有效的方法。\n\nOOFL？FOOL？嗯，也许我们应该避免这些缩写。\n\
  \n我们仍然可以使用接口和类、类型和子类型来描述我们的函数式程序。我们仍然可以划分源文件并管理它们的依赖关系，以创建健壮、独立部署且独立开发的架构。在这方面，没有任何改变。\n\
  \n*发生变化*的是函数式编程对我们施加的额外约束，即消除副作用，或者至少对副作用进行强力隔离。我们的类和模块将强烈倾向于不可变对象，而不是可变对象。但它们仍然是对象，并且仍然作为实现接口的类来表示和组织。\n\
  \n这意味着，我们在面向对象语言中发现非常有用的大部分设计原则和设计模式，在 Clojure 等其他函数式语言中仍然适用且依然有用。\n\n# VI\n\n#\
  \ 案例研究\n\n## 17\n\n## Wa-Tor\n\n![](img/28_unnum_wator.jpg)\n\n在本书的最后一章，你和我将玩一个关于小游戏的游戏。我们的小游戏的主题叫做\
  \ `Wa-Tor`；这是一个由 A. K. Dewdney 在 1984 年 12 月份的《科学美国》杂志描述的简单细胞自动机。你和我要玩的是*假装* `Wa-Tor`\
  \ 是一个在架构和设计上需要大量努力的企业级应用。\n\n唉，*SciAm*，我很熟悉它……\n\n我的意思是，诚实地说，我可以在几小时内凑出一个 `Wa-Tor`\
  \ 并开快地离开。但对于这一章，我希望我们能像对待一个 500 万行代码（LOC）巨兽一样真正思考这些问题。\n\n那么 `Wa-Tor` 是什么？脚注中引用的\
  \ Wikipedia 文章应该提供你理解它所需深度的所有信息（其实不多）。但本质上，`Wa-Tor` 是一个使用鱼和鲨的典型捕食者/猎物模拟。鱼随机移动并偶尔繁殖。鲨也随机移动，但如果旁边有鱼，它们就会吃鱼。如果鲨吃了足够的鱼，它们偶尔繁殖。如果鲨在饿死之前没有吃到鱼，它们就会死。\n\
  \n[`en.wikipedia.org/wiki/Wa-Tor`](https://en.wikipedia.org/wiki/Wa-Tor)\n\n鱼和鲨生存的世界没有陆地；全是水。此外，顶部连接底部，左侧连接右侧，所以这个世界在拓扑上是一个环面（torus）。因此，`Wa-Tor`\
  \ 代表 WAter TORus（水环面）。\n\n稍后我们会讨论程序的特性。目前，架构和设计考虑因素有哪些？\n\n让我们从基础开始。`SRP`。哪些是参与者——我们想要把谁保持分开？\n\
  \n在大多数大型企业系统中，有很多不同的参与者。但在这个小应用中，只有两个需要担心。是用户体验（UX）设计师，他们在真正喜欢屏幕上显示的内容之前，无疑会改变十次左右。然后是建模者，他们也可能调整内部鲨鱼/鱼的行为，并可能向其中加入更多动物。\n\
  \n所以我们从[图 17.1] 开始，这是一个非常明显且非常传统的划分。\n\n![](img/c17f001.jpg)\n\n**图 17.1.** Wa-Tor\
  \ 显而易见且传统的划分\n\n`WatorUI` 组件的层级低于 `WatorModel` 组件。根据依赖规则，这意味着源代码的依赖必须跨越指向 `WatorModel`\
  \ 的架构边界。因为如此，`WatorUI` 将是 `WatorModel` 的插件。\n\n到目前为止，这种划分只有两个组件和一个边界。在更大的系统中，我们将看到更多的边界以及每个边界内更多的组件。\n\
  \n让我们先关注模型。我们需要种类的类？\n\n是的，我说了类。我们可能正在使用函数式语言。所以，起，模型看起来像[图 17.2]。\n\n![](img/c17f002.jpg)\n\
  \n**图 17.2.** Wa-Tor 的初始模型\n\n鱼和鲨生存的世界没有陆地；全是水。此外，顶部连接底部，左侧连接右侧，所以这个世界在拓扑上是一个环面。因此，`Wa-Tor`\
  \ 代表 WAter TORus（水环面）。\n\n`WatorUI` 组件的层级低于 `WatorModel` 组件。根据依赖规则，这意味着源代码的依赖必须跨越指向\
  \ `WatorModel` 的架构边界。因为如此，`WatorUI` 将是 `WatorModel` 的插件。\n\n`world` 包含 `fish`。\n\
  \n```\n(ns wator.cell)\n\n(defmulti type)\n```\n\n```\n(ns wator.water\n  (:require\
  \ [cell as cell]))\n\n(defn make {::type})\n\n(defmethod type [water])\n```\n\n\
  ```\n(ns wator.animal)\n\n(defmulti move)\n(defmulti reproduce)\n\n(defn tick [animal])\n\
  ```\n\n```\n(ns wator.fish\n  (:require [cell as cell]\n             [animal as\
  \ animal]))\n\n(defn make {::type})\n\n(defmethod type [fish])\n\n(defmethod move\
  \ [fish])\n\n(defmethod reproduce [fish])\n```\n\n```\n(ns wator.shark\n  (:require\
  \ [cell as cell]\n             [animal as animal]))\n\n(defmethod type [shark])\n\
  \n(defmethod move [shark])\n\n(defmethod reproduce [shark])\n\n(defn eat [shark])\n\
  ```\n\n\n\n\n但让我们暂时把这些都放在一边吧。前期设计就够了。让我们看看能否通过代码实现一些行为。\n\n`water` 的行为是什么？我们询问我们的建模师，他们告诉我们，如果给予足够的时间，一个\
  \ `water` 细胞会随机演变成一个 `fish` 细胞。这里是我对该规则的实现：\n\n点击此处查看代码图片\n\n```ns\n(ns wator.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [wator\n             [cell :as\
  \ cell]\n             [water :as water]\n             [fish :as fish]]))\n\n(describe\
  \ \"Wator\"\n  (with-stubs)\n  (context \"Water\"\n    (it \"usually remains water\"\
  \n          (with-redefs [rand (stub :rand {:return 0.0})]\n            (let [water\
  \ (water/make)\n                  evolved (cell/tick water)]\n              (should=\
  \ ::water/water (::cell/type evolved)))))\n\n    (it \"occasionally evolves into\
  \ a fish\"\n      (with-redefs [rand (stub :rand {:return 1.0})]\n        (let [water\
  \ (water/make)\n              evolved (cell/tick water)]\n          (should= ::fish/fish\
  \ (::cell/type evolved)))))))\n\n———\n\n(ns wator.water\n  (:require [wator\n  \
  \           [cell :as cell]\n             [fish :as fish]\n             [config\
  \ :as config]]))\n\n(defn make [] {::cell/type ::water})\n\n(defmethod cell/tick\
  \ ::water [water]\n  (if (> (rand) config/water-evolution-rate)\n    (fish/make)\n\
  \    water))\n\n——————\n\n(ns wator.config)\n\n(def water-evolution-rate 0.99999)\n\
  ```\n\n所以，我们立刻看到了这个程序的“函数式”本质。8。`tick` 的返回值一个新的 `cell`。我不知道那个 `water-evolution-rate`\
  \ 是否正确。建模师还没有告诉我们速率应该是多少。所以我只是猜猜的。我预计他们会等到看到模型的行为后，再告诉我们修改它。\n\n8。几乎如此。`(rand)`\
  \ 的调用是不纯的。\n\n到目前为止，我还没有指定任何动态类型。现在考虑这些有点早。但我确定它会来的。\n\n总之，让我们看看能否让 `fish` 移动。\n\
  \n等一下。如何移动一个 `fish`？`fish` 在哪里？`fish` 知道自己的位置吗，还是由 `world` 知道？\n\n`cell` 排在一个二维矩形笛卡尔网格中，从左到右、从上下循环。因此，`cell`\
  \ 的位置是元组 `[x y]`。`world` 可以用二维数组存储 `cell`，也可以用以位置元组为键的 map。\n\n我喜欢用 map 来处理这类事情，所以让我们创建一个充满\
  \ `water` 细胞的 `world`：\n\n点击此处查看代码图片\n\n```ns\n(context \"world\"\n  (it \"creates\
  \ a world full of water cells\"\n    (let [world (world/make 2 2)\n          cells\
  \ (:cells world)\n          positions (set (keys cells))]\n      (should= #{[0 0]\
  \ [0 1]\n                 [1 0] [1 1]} positions)\n      (should (every? #(= ::water/water\
  \ (::cell/type %))\n                      (vals cells))))))\n\n————\n\n(ns wator.world\n\
  \  (:require [wator\n             [water :as water]]))\n\n(defn make [w h]\n  (let\
  \ [locs (for [x (range w) y (range h)] [x y])\n        loc-water (interleave locs\
  \ (repeat (water/make)))\n        cells (apply hash-map loc-water)]\n    {:cells\
  \ cells}))\n```\n\n你注意到传递到 `interleave` 的 `water` 细胞惰性列表了吗？现在我们应该能够把一个 `fish` 放入世界并让它移动了。这是我的第一次测试尝试：\n\
  \n点击此处查看代码图片\n\n```ns\n(context \"animal\"\n  (it \"moves\"\n    (let [fish (fish/make)\n\
