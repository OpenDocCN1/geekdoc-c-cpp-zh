  ```java\npackage gossipingBusDrivers;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\
  \npublic class Simulation {\n  public static int driveTillEqual(Driver... drivers)\
  \ {\n    int time;\n    for (time = 0; notAllRumors(drivers) && time < 480; time++)\n\
  \      driveAndGossip(drivers);\n    return time;\n  }\n\n  private static void\
  \ driveAndGossip(Driver[] drivers) {\n    Set<Stop> stops = new HashSet<>();\n \
  \   for (Driver d : drivers) {\n      d.drive();\n      stops.add(d.getStop());\n\
  \    }\n    for (Stop stop : stops)\n      stop.gossip();\n  }\n\n  private static\
  \ boolean notAllRumors(Driver[] drivers) {\n    Set<Rumor> rumors = new HashSet<>();\n\
  \    for (Driver d : drivers)\n      rumors.addAll(d.getRumors());\n    for (Driver\
  \ d : drivers) {\n      if (!d.getRumors().equals(rumors))\n        return true;\n\
  \    }\n    return false;\n  }\n}\n```\n\n## Clojure\n\n快速浏览这段代码会让你相信，它是以传统的面向对象风格编写的，对象相对较地封装了它们的状态。在编写\
  \ Clojure 时，我并没有从草图开始。相反，我依赖 TDD 测试来帮助设计。测试如下：点击此处查看代码图片\n\n```clojure\n(ns gossiping-bus-drivers\n\
