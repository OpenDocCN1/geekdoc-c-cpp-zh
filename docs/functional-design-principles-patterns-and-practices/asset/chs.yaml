  \n当然，我使用 TDD（测试驱动开发）编写了 Java 代码。这里是测试用例。如你所见，它们非常冗长；但至少它们都符合一个单一测试类。如果你读过我的书《精益手艺》（Addison-Wesley,\
  \ 2021），你就会理解为什么这是一件好事了。\n\n[点击此处查看代码图片]\n\n```\npackage gossipingBusDrivers;\n\n\
