  解决方案代码被分为几个小文件。\n\n\n\n\n\n## 程序\n\n点击此处查看代码图片\n\n```java\npackage gossipingBusDrivers;\n\
  \nimport java.util.Arrays;\nimport java.util.HashSet;\nimport java.util.Set;\n\n\
  public class Driver {\n  private String name;\n  private Route route;\n  private\
  \ int stopNumber = 0;\n  private Set<Rumor> rumors;\n\n  public Driver(String name,\
  \ Route theRoute,\n                Rumor... theRumors) {\n    this.name = name;\n\
  \    route = theRoute;\n    rumors = new HashSet<>(Arrays.asList(theRumors));\n\
  \    route.stopAt(this, stopNumber);\n  }\n\n  public Stop getStop() {\n    return\
  \ route.get(stopNumber);\n  }\n\n  public void drive() {\n    route.leave(this,\
  \ stopNumber);\n    stopNumber = route.getNextStop(stopNumber);\n    route.stopAt(this,\
  \ stopNumber);\n  }\n\n  public Set<Rumor> getRumors() {\n    return rumors;\n \
  \ }\n\n  public void addRumors(Set<Rumor> newRumors) {\n    rumors.addAll(newRumors);\n\
