  \ 方法。\n\n3。记住，这是一个面向对象（OO）论坛。不要纠结于*class*（类）这个词。\n\n对这点的反对是，`Switch` 类可以被用来开启其他东西，如\
  \ `Fan`（风扇）或 `Television`（电视）。因此，`Switch` 类不应该感知 `Light` 类。在两者之间应该实施一种抽象，如图图 16.2\
  \ 所示。\n\n![](img/c16f002.jpg)\n\n## 图 16.2. 服务器（Abstract Server）\n\n现在 `Switch`\
  \ 类使用一个名为 `Switchable` 的接口。`Light` 类实现了 `Switchable`。\n\n这解决了问题。现在我们可以有由 `Switch`\
  \ 控制的任意数量设备。该解决方案是 DIP、OCP 和 LSP 最简单的表达之一。它也有一个名字，被称为*Abstract Server*（抽象服务器）。^(4)\n\
  \n4。Robert C. Martin, *Agile Software Development: Principles, Patterns, and Practices*\
  \ (Pearson, 2002), 318。\n\n如果我们所在的团队正在讨论如何保护我们的 `Switch` 类不被显式地耦合到 `Light` 类，团队中的某人可能会跳出来说：“我们可以使用\
  \ Abstract Server。”如果所有团队成员都认识这个名字及其包含的含义，他们就能快速决定该解决方案是否合适。\n\n这是一种设计模式，是对特定语境下问题的命名解决方案。设计模式的价值在于，这些名称和解决方案是标准的（canonical），因此，熟悉这些规范的人只需通过使用名称就能理解彼此。你说“Abstract\
  \ Server”，我立刻就能理解你的意思是“在客户端和服务器之间实施一个接口”。\n\n但设计模式中的“语境”部分呢？好吧，让我们回到团队。有人刚刚提议使用\
  \ Abstract Server 模式。另一个团队成员说：“不，你不明白，我们并不拥有 `Light` 类；它是第三方库的一部分，所以我们无法修改它来实现一个接口。”\n\
  \n所以，问题的语境是我们想要将 `Switch` 与 `Light` 解耦，但我们无法修改 `Light`。于是团队中的另一个人说：“嗯，我们可以使用一个*Adapter*（适配器）。”\n\
  \n如果你在团队中且不知道 Adapter 模式是什么，你就无法理解他们的建议。但如果你熟悉设计模式的规范，你就能快速评估该建议。再次，设计模式的益处在于了解名称和标准形式，以便你快速应用它们。\n\
  \nAdapter 模式看起来如图图 16.3 所示。\n\n![](img/c16f003.jpg)\n\n## 图 16.3. Adapter 模式的对象形式\n\
  \n`LightAdapter` 实现了 `Switchable` 接口，并将 `TurnOn` 调用转发给 `Light`。即使在还没被画在白板上之前，团队中的每个人都能在脑海中看到它，因为他们熟悉设计模式规范。所以他们都点头赞同这个主意。\n\
  \n正当他们准备谈论下一个问题时，团队中的某人说：“等一下，我们应该使用哪种形式的 Adapter？”\n\n事实证明，设计模式的标准名称并不一定描述单一的解决方案。某些模式有多种形式。Adapter\
  \ 就是其中一种模式。它可能看起来像图 16.3，也可能看起来像图 16.4。\n\n![](img/c16f004.jpg)\n\n## 图 16.4. Adapter\
  \ 模式的类形式\n\n前者被称为 Adapter 的*对象*（object）形式，因为 `LightAdapter` 本身是一个对象。后者是 Adapter\
  \ 的*类*形式形式，因为 `LightAdapter` 是 `Light` 的子类。\n\n团队成员对这两种形式辩论了一会儿，决定目前 Adapter 的类形式是足够的，并且可以减轻他们构建独立\
  \ `LightAdapter` 对象的复杂性。\n\n## 函数式编程中的模式\n\n在多年来我们听到的奇怪传闻中，设计模式是绕过面向对象语言产生问题的黑科技（hacks），而在函数式语言中它们是不必要的。\n\
  \n正如你将在后续章节中看到的，某些设计模式确实某些方面似乎是针对面向对象语言某些局限性的变通方案；但这并不适用于所有的设计模式。而且，即使是那些特定的设计模式也有更通用的形式，使其适用于函数式语言。\n\
  \n### Abstract Server\n\n![](img/20_unnum_abstractserver.jpg)\n\n那么，Abstract Server\
  \ 在函数式语言中长什么样？\n\n再次考虑 `Switch/Light` 问题。这是我们如何在 Clojure 中可能表达它的：\n\n```clojure\n\
  (defn turn-on-light []\n  ;打开那该死的灯！\n  )\n\n(defn engage-switch []\n  ;一些其他事情...\n\
  \  )\n```\n\n\n\n这两个存根（stubs）模拟了目标函数。我们使用参数 `{:type :light}` 调用了 `engage-switch`\
  \ 函数。然后，我们测试这两个目标函数是否真的被调用了。\n\n我将抽象服务器模式（Abstract Server pattern）的 `protocol/record`\
  \ 形式留作练习。到此时，应该清楚该模式在函数式语言中既适用又有用。\n\n### 适配器 (Adapter)\n\n![](img/21_unnum_adapter.jpg)\n\
  \n当你有一个想要服务器的客户端，但客户端期望的接口与服务器提供的接口不兼容时，就可以使用适配器模式。\n\n例如，假设我们有前面讨论过的 `engage-switch`\
  \ 函数，但我们想向它传递一个第三方的 `:variable-light`。`:variable-light` 的 `turn-on-light` 函数接受一个表示光强度的参数：`0`\
  \ 表示关闭，`100` 表示全亮。\n\n`:variable-light` 的接口与 `engage-switch` 函数的预期不匹配。因此我们需要一个适配器。\n\
  \n适配器最简单的形式可能如下：\n\n点击此处查看代码图像\n\n```\n(defn turn-on-light [intensity]\n  ;Turn\
  \ it on with intensity.\n  )\n\n(defmulti turn-on :type)\n(defmulti turn-off :type)\n\
  \n(defmethod turn-on :variable-light [switchable]\n  (turn-on-light 100))\n\n(defmethod\
  \ turn-off :variable-light [switchable]\n  (turn-on-light 0))\n\n(defn engage-switch\
  \ [switchable]\n  ;Some other stuff...\n  (turn-on switchable)\n  ;Some more other\
  \ stuff...\n  (turn-off switchable))\n```\n\n我用以下测试对其进行了测试：\n\n点击此处查看代码图像\n\n```\n\
  (describe \"Adapter\"\n  (with-stubs)\n  (it \"turns light on and off\"\n    (with-redefs\
  \ [turn-on-light (stub :turn-on-light)]\n      (engage-switch {:type :variable-light})\n\
  \      (should-have-invoked :turn-on-light {:times 1 :with [100]})\n      (should-have-invoked\
  \ :turn-on-light {:times 1 :with [0]}))))\n```\n\n如果我要在 UML 中画这个结构，我可能会画类似图 16.5\
  \ 的内容。\n\n![](img/c16f005.jpg)\n\n**图 16.5.** 适配器模式的对象形式\n\n`defmulti` 函数对应于 `Switchable`\
  \ 接口。`{:type :variable-light}` 对象结合两个 `defmethod` 函数对应于 `VariableLightAdapter`。`EngageSwitch`\
  \ 和 `VariableLight` “类”对应于我们正尝试适配的两个函数。\n\n也许你觉得这没有说服力。毕竟，这只是一个带有几个 `defmulti` 函数的简单小程序。它没有\
  \ UML 中所示的那明显的面向对象结构。因此，让我们通过拆分源文件来强制实现这种结构。\n\n我们从 `switchable` 接口开始。在 `ns` 语句中，我使用了约定，即\
  \ `turn-on-light` 是包含 `switchable` 命名项目的整体命名空间：\n\n```\n(ns turn-on-light.switchable)\n\
  \n(defmulti turn-on :type)\n(defmulti turn-off :type)\n```\n\n这是一个多态接口。注意它没有源代码依赖。此外，请记住，Clojure\
  \ 中的 `ns` 语句对源文件的要求与 Java 对类的相同。源文件和命名空间必须具有相应的名称。因此，当我们将代码元素移动到不同的命名空间时，我们也将把它们移动到不同的源文件中。\n\
  \n特别是，`turn-on-light.switchable` 命名空间必须位于名为 `turn_on_light` 的目录下的 `switchable.clj`\
  \ 文件中。\n\n接下来，看看 `engage-switch` 和 `variable-light` 命名空间：\n\n点击此处查看代码图像\n\n```\n\
  (ns turn-on-light.engage-switch\n  (:require [turn-on-light.switchable :as s]))\n\
  \n(defn engage-switch [switchable]\n  ;Some other stuff...\n  (s/turn-on switchable)\n\
  \  ;Some more other stuff...\n  (s/turn-off switchable))\n\n————————————————\n\n\
  (ns turn-on-light.variable-light)\n\n(defn turn-on-light [intensity]\n  ;Turn it\
  \ on with intensity.\n  )\n```\n\n这里没有意外。`engage-switch` 命名空间依赖于 `switchable` 接口。`variable-light`\
  \ 命名空间没有向外的源代码依赖。\n\n`variable-light-adapter` 命名空间将 `switchable` 接口连接到 `variable-light`。注意\
  \ `make-adapter` 构造函数。测试将将使用它：\n\n点击此处查看代码图像\n\n```\n(ns turn-on-light.variable-light-adapter\n\
  \  (:require [turn-on-light.switchable :as s]\n            [turn-on-light.variable-light\
  \ :as v-l]))\n\n(defn make-adapter [min-intensity max-intensity]\n  {:type :variable-light\n\
  \   :min-intensity min-intensity\n   :max-intensity max-intensity})\n\n(defmethod\
  \ s/turn-on :variable-light [switchable]\n  (v-l/turn-on-light (:max-intensity switchable)))\n\
  \n(defmethod s/turn-off :variable-light [switchable]\n  (v-l/turn-on-light (:min-intensity\
  \ switchable)))\n```\n\n最后，测试通过依赖具体的命名空间将所有内容整合成一个整洁的整体：\n\n点击此处查看代码图像\n\n```\n\
  (ns turn-on-light.turn-on-spec\n  (:require [speclj.core :refer :all]\n        \
  \    [turn-on-light.engage-switch :refer :all]\n            [turn-on-light.variable-light\
  \ :as v-l]\n            [turn-on-light.variable-light-adapter\n              :as\
  \ v-l-adapter]))\n\n(describe \"Adapter\"\n  (with-stubs)\n  (it \"turns light on\
  \ and off\"\n    (with-redefs [v-l/turn-on-light (stub :turn-on-light)]\n      (engage-switch\
  \ (v-l-adapter/make-adapter 5 90))\n      (should-have-invoked :turn-on-light\n\
  \                           {:times 1 :with [90]})\n      (should-have-invoked :turn-on-light\n\
  \                           {:times 1 :with [5]}))))\n```\n\n\n\n\n# 适配器模式\n\n到这里，你应该已经确定这就是\
  \ `GOF` 书中的适配器模式了，对吧？你可能还会预期许多其他的 GOF 模式可以用 `Clojure` 这样的函数式语言来表达。也许更重要的是，你应该将命名空间/源文件结构视为函数式程序设计和架构的一部分。\n\
  \n`GOF` 是我们在 90 年代对《设计模式》（Design Patterns）一书的亲切称呼。它代表“四人帮”（Gang of Four），因为这本书有四位作者：Erich\
  \ Gamma、John Vlissides、Ralph Johnson 和 Richard Helm。\n\n## 命令模式 (Command)\n\n![](img/22_unnum_command.jpg)\n\
  \n在 GOF 书中所有的设计模式里，`Command` 最令我感兴趣的。这并不是因为它复杂，而是因为它非常`simple`。非常，非常简单。\n\n顺带提一下，这也是我对\
  \ Clojure 感兴趣的地方。正如我在本书引言中所说的，Clojure 在语义上非常丰富，但在语法上极其简单。没错，命令模式也具有同样的属性。它的丰富性在于其不可置信的简单。\n\
  \n在 `C++` 中，我们可能会这样写命令模式：\n\n```cpp\nclass Command {\n  public:\n    virtual void\
  \ execute() = 0;\n};\n```\n\n就这些了。只有一个抽象类（接口），包含一个单一的纯虚（抽象）函数。如此简单。但使用这种模式可以做很多有趣的事情。若想深入研究这种丰富性，请参考《敏捷软件开发：原则、模式与实践》（Agile\
  \ Software Development: Principles, Patterns, and Practices）中的相应章节。\n\n在像 `Clojure`\
  \ 这样的函数式语言中，你可能会认为这种模式消失了。毕竟，如果你想把命令传递给其他函数，只需要传递 `command` 函数即可。你不需要把它封装成对象，因为在函数式语言中，函数就是对象：\n\
  \n```clojure\n(ns command.core)\n\n(defn execute []\n  )\n\n(defn some-app [command]\n\
  \  ;一些其他内容 . .\n  (command)\n  ;更多其他内容 . .\n  )\n```\n\n## 撤销 (Undo)\n\n命令模式更有用的变体之一可以在下面的\
  \ C++ 代码中看到：\n\n```cpp\nclass UndoableCommand : public Command {\n  public:\n  \
  \  virtual void undo() = 0;\n};\n```\n\n那个 `undo()` 函数开启了许多有趣的可能性。\n\n\n\n\n我们使用\
  \ `defmulti` 函数创建了 `undoable-command` 接口。我们在 `add-room-command` 命名空间实现了该接口，并在 `command.core`\
  \ 命名空间的 `gui-app` 函数中模拟了 GUI。\n\n测试部分存根了 `add-room-command` 的底层函数并确保它们被正确调用。它带有一个\
  \ `palette-actions` 列表调用了 `gui-app`。\n\n`add-room-command` 的两个方法是通过多态分派的。对于 `execute`\
  \ 情况，这似乎并不是必要的，因为 `gui-app` 刚刚创建了 `add-room-command` 对象。但如果我们向该系统添加更多命令，`execute`\
  \ 的多态分发将变得更加必要。\n\n`undo` 的多态分发即使在这个小示例中显然也是必要的，因为当调面板接收到 `:undo-action` 时，我们并不知道正在撤销的是哪个命令。\n\
  \n在这里，我们再次看到，随着应用程序复杂性的增加，GOF 模式的标准形式开始显现出来。对于单方法命令，我们可以使用普通的函数（实际上是函数对象）来解决。但当应用程序需要更丰富的命令类型时，我们又回到了\
  \ GOF 风格。\n\n### 组合模式 (Composite)\n\n![](img/23_unnum_composite.jpg)\n\n`Composite`\
  \ 延续了语义丰富性和语法简单的主题。它是旧句柄/实现（handle/body）方法的极佳示例，这种方法我在 Jim Coplien 的其中一书中首次读到^(9)。组合模式的结构在图\
  \ 16.6 的 UML 中所示。\n\n9. James O. Coplien, *Advanced C++ Programming Styles and Idioms*\
  \ (Addison-Wesley, 1991).\n\n![](img/c16f006.jpg)\n\n**图 16.6.** 组合模式\n\n我们的老朋友\
  \ `Switchable` 接口由其他老朋友 `Light` 和 `VariableLight` 实现。`CompositeSwitchable` 也实现了\
  \ `Switchable` 并包含一个其他 `Switchable` 实例列表。\n\n`CompositeSwitchable` 中的 `TurnOn` 和\
  \ `TurnOff` 实现简单是将相同函数的调用传播到列表中的所有实例。因此，当对 `CompositeSwitchable` 实例调用 `TurnOn` 时，它将调用其所包含的所有\
  \ `Switchable` 实例的 `TurnOn`。\n\n在 Java 中，我们可以如下实现 `CompositeSwitchable`：\n\n点击此处查看代码图片\n\
  \n```java\npublic class CompositeSwitchable implements Switchable {\n  private List<Switchable>\
  \ switchables = new ArrayList<>();\n\n  public void addSwitchable(Switchable s)\
  \ {\n    switchables.add(s):\n  }\n\n  public void turnOn() {\n    for (var s :\
  \ switchables)\n      s.turnOn();\n  }\n\n  public void turnOff() {\n    for (var\
  \ s : switchables)\n      s.turnOff();\n  }\n}\n```\n\n在函数式语言（如 Clojure）中，人们倾向于避免组合模式，简单地使用\
  \ `map` 或 `doseq` 函数，如下方的测试所示：\n\n点击此处查看代码图片\n\n```clojure\n(ns composite-example.switchable)\n\
  \n(defmulti turn-on :type)\n(defmulti turn-off :type)\n\n—————\n\n(ns composite-example.light\n\
  \  (:require [composite-example.switchable :as s]))\n\n(defn make-light [] {:type\
  \ :light})\n\n(defn turn-on-light [])\n(defn turn-off-light [])\n\n(defmethod s/turn-on\
  \ :light [switchable]\n  (turn-on-light))\n\n(defmethod s/turn-off :light [switchable]\n\
  \  (turn-off-light))\n\n———————\n\n(ns composite-example.variable-light\n  (:require\
  \ [composite-example.switchable :as s]))\n\n(defn make-variable-light [] {:type\
  \ :variable-light})\n\n(defn set-light-intensity [intensity])\n\n(defmethod s/turn-on\
  \ :variable-light [switchable]\n  (set-light-intensity 100))\n\n(defmethod s/turn-off\
  \ :variable-light [switchable]\n  (set-light-intensity 0))\n\n———————————\n\n(ns\
  \ composite-example.core-spec\n  (:require [speclj.core :refer :all]\n         \
  \   [composite-example\n             [light :as l]\n             [variable-light\
  \ :as v]\n             [switchable :as s]]))\n\n(describe \"composite-switchable\"\
  \n  (with-stubs)\n  (it \"turns all on\"\n    (with-redefs\n      [l/turn-on-light\
  \ (stub :turn-on-light)\n       v/set-light-intensity (stub :set-light-intensity)]\n\
  \      (let [switchables [(l/make-light) (v/make-variable-light)]]\n        (doseq\
  \ [s-able switchables] (s/turn-on s-able))\n        (should-have-invoked :turn-on-light)\n\
  ```\n\n\n\n\n```clojure\n(ns composite-example.circle\n  (:require [clojure.spec.alpha\
  \ :as s]\n            [composite-example.shape :as shape]))\n\n(s/def ::center (s/tuple\
  \ number? number?))\n(s/def ::radius number?)\n(s/def ::circle (s/keys :req [::shape/type\n\
  \                              ::radius\n                              ::center]))\n\
  \n(defn make-circle [center radius]\n  {:post [(s/valid? ::circle %)]}\n  {::shape/type\
  \ ::circle\n   ::center center\n   ::radius radius})\n\n(defmethod shape/translate\
  \ ::circle [circle dx dy]\n  {:pre [(s/valid? ::circle circle)\n         (number?\
  \ dx) (number? dy)]\n   :post [(s/valid? ::circle %)]}\n  (let [[x y] (::center\
  \ circle)]\n    (assoc circle ::center [(+ x dx) (+ y dy)]))\n\n(defmethod shape/scale\
  \ ::circle [circle factor]\n  {:pre [(s/valid? ::circle circle)\n         (number?\
  \ factor)]\n   :post [(s/valid? ::circle %)]}\n  (let [radius (::radius circle)]\n\
  \    (assoc circle ::radius (* radius factor))))\n```\n\n———————\n\n(ns composite-example.square\n\
  \  (:require [clojure.spec.alpha :as s]\n            [composite-example.shape :as\
  \ shape]))\n\n(s/def ::top-left (s/tuple number? number?))\n(s/def ::side number?)\n\
  (s/def ::square (s/keys :req [::shape/type\n                              ::side\n\
  \                              ::top-left]))\n\n(defn make-square [top-left side]\n\
  \  {:post [(s/valid? ::square %)]}\n  {::shape/type ::square\n   ::top-left top-left\n\
  \   ::side side})\n\n(defmethod shape/translate ::square [square dx dy]\n  {:pre\
  \ [(s/valid? ::square square)\n         (number? dx) (number? dy)]\n   :post [(s/assert\
  \ ::square %)]}\n  (let [[x y] (::top-left square)]\n    (assoc square ::top-left\
  \ [(+ x dx) (+ y dy)]))\n\n(defmethod shape/scale ::square [square factor]\n  {:pre\
  \ [(s/valid? ::square square)\n         (number? factor)]\n   :post [(s/valid? ::square\
  \ %)]}\n  (let [side (::side square)]\n    (assoc square ::side (* side factor))))\n\
  ```\n\n```clojure\n(ns composite-example.composite-shape\n  (:require [clojure.spec.alpha\
  \ :as s]\n            [composite-example.shape :as shape]))\n\n(s/def ::shapes (s/coll-of\
  \ ::shape/shape-type))\n(s/def ::composite-shape (s/keys :req [::shape/type\n  \
  \                                     ::shapes]))\n\n(defn make []\n  {:post [(s/assert\
  \ ::composite-shape %)]}\n  {::shape/type ::composite-shape\n   ::shapes []})\n\n\
  (defn add [cs shape]\n  {:pre [(s/valid? ::composite-shape cs)\n         (s/valid?\
  \ ::shape/shape-type shape)]\n   :post [(s/valid? ::composite-shape %)]}\n  (update\
  \ cs ::shapes conj shape))\n\n(defmethod shape/translate ::composite-shape [cs dx\
  \ dy]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? dx) (number?\
  \ dy)]\n   :post [(s/valid? ::composite-shape %)]}\n  (let [translated-shapes (map\
  \ #(shape/translate % dx dy)\n                               (::shapes cs))]\n \
  \   (assoc cs ::shapes translated-shapes)))\n\n(defmethod shape/scale ::composite-shape\
  \ [cs factor]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? factor)]\n\
  \   :post [(s/valid? ::composite-shape %)]}\n  (let [scaled-shapes (map #(shape/scale\
  \ % factor)\n                           (::shapes cs))]\n    (assoc cs ::shapes\
  \ scaled-shapes)))\n```\n\n```clojure\n(ns composite-example.composite-shape\n \
  \ (:require [clojure.spec.alpha :as s]\n            [composite-example.shape :as\
  \ shape]))\n\n(s/def ::shapes (s/coll-of ::shape/shape-type))\n(s/def ::composite-shape\
  \ (s/keys :req [::shape/type\n                                       ::shapes]))\n\
  \n(defn make []\n  {:post [(s/assert ::composite-shape %)]}\n  {::shape/type ::composite-shape\n\
  \   ::shapes []})\n\n(defn add [cs shape]\n  {:pre [(s/valid? ::composite-shape\
  \ cs)\n         (s/valid? ::shape/shape-type shape)]\n   :post [(s/valid? ::composite-shape\
  \ %)]}\n  (update cs ::shapes conj shape))\n\n(defmethod shape/translate ::composite-shape\
  \ [cs dx dy]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? dx) (number?\
  \ dy)]\n   :post [(s/valid? ::composite-shape %)]}\n  (let [translated-shapes (map\
  \ #(shape/translate % dx dy)\n                               (::shapes cs))]\n \
  \   (assoc cs ::shapes translated-shapes)))\n\n(defmethod shape/scale ::composite-shape\
  \ [cs factor]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? factor)]\n\
  \   :post [(s/valid? ::composite-shape %)]}\n  (let [scaled-shapes (map #(shape/scale\
  \ % factor)\n                           (::shapes cs))]\n    (assoc cs ::shapes\
  \ scaled-shapes)))\n```\n\n注意方法上的 `:pre` 和 `:post` 条件。我正在使用这些来检查进入和离开函数的类型。你可能会合理地担心这些检查带来的运行时开销。我会全局禁用它们，或者在确认类型管理得当后，有选择性地注释掉它们。\n\
  \n有一个编译时开关可以禁用所有的断言，包括 `:pre` 和 `:post`。\n\n注意 `translate` 和 `scale` 函数返回了新的 `shape`\
  \ 实例。它们在行为上是完全函数式的。\n\n所以，现在让我们来看看 `composite-shape`：\n\n我们之前在 `light`/`variable-light`\
  \ 示例中见过这种模式。这次不同的是，`composite-shape` 返回的是一个带有新 `shape` 实例的新 `composite-shape`。因此，它是函数式的。\n\
  \n对于那些好奇的人，这里是我使用的测试用例：\n\n\n\n\n现在，当然，我们可以通过向 `shape` 抽象类添加一个 `:journaled?` 标记，然后在\
  \ `circle` 和 `square` 的实现中放入一个 `if` 语句来实现。但这太乱了。我们真正想要的是一种方法，可以在不改变 `shape` 抽象类或其任何子类（包括\
  \ `circle`、`square` 和 `composite-shape`，即符合 OCP）。\n\n引入装饰器模式（Decorator pattern）。UML\
  \ 所示图 16.7。\n\n![](img/c16f007.jpg)\n\n**图 16.7.** 装饰器模式\n\n我包含了 `composite-shape`，因为它目前是\
  \ `shape` 类型模型的一部分。`journaled-shape` 是装饰器。`journaled-shape` 派自 `shape` 并持有一个 `shape`\
  \ 的引用。当在 `journaled-shape` 上调用 `translate` 或 `scale` 时，它会在日志中创建一个条目，然后将调用委托给包含的\
  \ `shape`。\n\n这里是 Clojure 的实现：\n\n点击此处查看代码图像\n\n```\n(ns decorator-example.journaled-shape\n\
  \  (:require [decorator-example.shape :as shape]\n            [clojure.spec.alpha\
  \ :as s]))\n\n(s/def ::journal-entry\n       (s/or :translate (s/tuple #{:translate}1\
  \ number? number?)\n             :scale (s/tuple #{:scale} number?)))\n(s/def ::journal\
  \ (s/coll-of ::journal-entry))\n(s/def ::shape ::shape/shape-type)\n(s/def ::journaled-shape\
  \ (s/and\n                           (s/keys :req [::shape/type\n              \
  \                           ::journal\n                                        \
  \ ::shape])\n                           #(= ::journaled-shape\n                \
  \               (::shape/type %))))\n\n(defn make [shape]\n  {:post [(s/valid? ::journaled-shape\
  \ %)]}\n  {::shape/type ::journaled-shape\n   ::journal []\n   ::shape shape})\n\
  \n(defmethod shape/translate ::journaled-shape [js dx dy]\n  {:pre [(s/valid? ::journaled-shape\
  \ js)\n         (number? dx) (number? dy)]\n   :post [(s/valid? ::journaled-shape\
  \ %)]}\n  (-> js (update ::journal conj [:translate dx dy])\n      (assoc ::shape\
  \ (shape/translate (::shape js) dx dy))))\n\n(defmethod shape/scale ::journaled-shape\
  \ [js factor]\n  {:pre [(s/valid? ::journaled-shape js)\n         (number? factor)]\n\
  \   :post [(s/valid? ::journaled-shape %)]}\n  (-> js (update ::journal conj [:scale\
  \ factor])\n      (assoc ::shape (shape/scale (::shape js) factor))))\n```\n\n11。集合可以用作测试成员关系的函数。\n\
  \n`::journaled-shape` 对象拥有 `::shape` 和 `::journal` 字段。`::journal` 字段是 `::journal-entry`\
