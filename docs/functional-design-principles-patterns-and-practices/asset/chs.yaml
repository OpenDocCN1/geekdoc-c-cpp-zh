  \ dy)]))]\n    (remove #(= loc %) neighbors))\n```\n\n你准备好面对那些不漂亮的内容了吗？上面的代码拒绝编译，因为（你准备好了吗？）`water`\
  \ 依赖于 `fish`（为了进化），`fish` 依赖于 `animal`（为了 `do-move`），而 `animal` 又依赖于 `water`。这是一个依赖循环，而\
  \ Clojure *极其讨厌*依赖循环。参见图 17.3。\n\n![](img/c17f003.jpg)\n\n**图 17.3.** 依赖循环\n\n好了，深呼吸。记住，我们现在是在玩一个游戏。在像\
  \ Wa-Tor 这样简单的应用程序中，我并不会如此无情地划分这些文件。事实上，我很有可能直接把整个程序写在一个文件里，让魔鬼随心所欲。但我们假装这是一个数百万行的企业级应用，所以我们要对所有的源码依赖关系都格外小心。对吧？\n\
  \n因此，我们解决这个问题的方法是回到类似于旧 C 语言的声明和实现的机制。参见图 17.4。\n\n![](img/c17f004.jpg)\n\n**图 17.4.**\
  \ 破解依赖循环\n\n通过拆分 `water` 使其对 `fish` 的依赖位于 `water-imp` 中，并确保 `water-imp` 依赖于 `water`\
  \ 而不是相反（即 DIP），循环被打破了。为了一致性，我也拆分了 `fish` 和 `shark`^(12)。我很快也需要拆分 `animal`^(13)。\n\
