  md: '# GRAPHICS INTEROPERABILITY


    So, how do we draw the CUDA-generated buffer using OpenGL? Well, if you recall
    the setup we performed for main(), you''ll remember the following:


    ```

    glBindBuffer( GL_PIXEL_UNPACK_ BUFFER_ ARB, bufferObj );

    ```


    This call bound the shared buffer as a pixel source for the OpenGL driver to use
    in all subsequent calls to glDrawPixels(). Essentially, this means that a call
    to glDrawPixelsIs() is all that we need in order to render the image data our
    CUDA C kernel generated. Consequently, the following is all that our draw_func()
    needs to:


    ```

    static void draw_func( void ) {

    glDrawPixels( DIM, DIM, GL_RGBA, GL_UNSIGNED_BYTE, 0 );

    glutSwapBuffers();

    }

    ```


    It''s possible you''ve used glDrawPixels() with a buffer pointer as the last argument.
    The OpenGL driver will copy from this buffer if no buffer is bound as a GL_PIXEL_UNPACK_BUFFER_ARB
    source. However, since our data is already on the GPU and we have bound our shared
    buffer as the GL_PIXEL_UNPACK_BUFFER source, this last parameter becomes instead
    of an offset into the buffer. Because we want to render the entire buffer, this
    offset is zero for our application.


    The last component to this example seems somewhat anticactic, but we''ve decided
    to give our users a method to exit the application. In this vein, our key_func()
    callback responds only to the Esc key and uses this as a signal to clean up and
    exit:


    ```

    static void key_func( unsigned char key, int x, int y ) {

    witch (key) {

    case 27:

    // clean up OpenGL and CUDA

    HANDLE_ERROR( cudaGraphicsUnregisterResource( resource ) );

    glBindBuffer( GL_PIXEL_UNPACK_BUFFER_ARB, 0 );

    glDeleteBuffers( 1, &bufferObj );

    exit(0);

    }

    }

    ```'
