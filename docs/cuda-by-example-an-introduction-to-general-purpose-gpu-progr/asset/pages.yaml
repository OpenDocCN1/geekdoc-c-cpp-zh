  md: '# TEXTURE MEMORY


    ![](img/bfb67561d51829571288a8e3f69aa290_138_0.png)


    Figure 7.3 Heat dissipating from warm cells into cold cells


    Given a rectangular grid and configuration of heaters, we are looking to simulate
    what happens to the temperature in every grid cell as time progresses. For simplicity,
    cells with heaters in them always remain a constant temperature. At every step
    in time, we will assume that heat “flows” between a cell and its neighbors. If
    a cell''s neighbor is warmer than it is, the warmer neighbor will tend to warm
    it up. Conversely, if a cell has a neighbor cooler than it, it will cool off.
    Qualitatively, Figure 7.3 represents this flow of heat.


    In our heat transfer model, we will compute the new temperature in a grid cell
    as a sum of the differences between its temperature and the temperatures of its
    neighbor, or, essentially, an update equation as shown in Equation 7.1.


    # Equation 7.1


    ```

    $T_{NEW} = T_{OLD} + \sum_{NEIGHBORS} k \cdot (T_{NEIGHBOR} - T_{OLD})$

    ```


    In the equation for updating a cell''s temperature, the constant k represents
    the rate at which heat flows through the simulation. A large value of k will drive
    the system to a constant temperature quickly, while a small value will allow the
    solution to retain large temperature gradients longer. Since we consider only
    four neighbors (top, bottom, left, right) and $T_{OLD}$ remain constant in the
    equation, this update becomes like the one shown in Equation 7.2.


    # Equation 7.2


    ```

    $T_{NEW} = T_{OLD} + k \cdot (T_{TOP} + T_{BOTTOM} + T_{LEFT} + T_{RIGHT} - 4
    \cdot T_{OLD})$

    ```


    Like the ray tracing example in the previous chapter, this model is not intended
    to be what might be used in industry (in fact, it is not really an approximation
    of something physically accurate). We have simplified this model immensely to
    draw attention to the techniques at hand. In this mind, let''s take a look at
    how the update given by Equation 7.2 can be computed on the GPU.'
