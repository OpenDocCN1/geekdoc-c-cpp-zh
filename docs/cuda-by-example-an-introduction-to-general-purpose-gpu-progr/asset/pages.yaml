  md: "Having seen the hash table structures and the hash function, we’re ready to\
    \ look at the process of adding a key/value pair to the table. The process involves\
    \ three basic steps:\n\n+   1. Compute the hash function on the input key to determine\
    \ the new entry’s bucket.\n\n+   2. Take a preallocated Entry from the pool and\
    \ initialize its key and value fields.\n\n+   3. Insert the entry at the front\
    \ of the proper bucket’s list.\n\nWe translate these steps to code in a fairly\
    \ straightforward way.\n\n```\nvoid add_to_table( Table &table, unsigned int key,\
    \ void* value ) {\n    // Step 1\n    size_t hashValue = hash(key, table.count);\n\
    \n    // Step 2\n    Entry *location = table.firstFree++;\n    location->key =\
    \ key;\n    location->value = value;\n\n    // Step 3\n    location->next = table.entries[hashValue];\n\
    \    table.entries[hashValue] = location;\n}\n```\n\nIf you have never seen linked\
    \ lists (or it’s been a while), step 3 may be tricky to understand at first. The\
    \ existing list has its first node stored at the table.entries[hashValue]. With\
    \ this in mind, we can insert a new node at the head of the list in two steps:\
    \ First, we set our new entry’s next pointer to point to the first node in the\
    \ existing list. Then, we store the new entry in the bucket array so it becomes\
    \ the first node of the new list."
