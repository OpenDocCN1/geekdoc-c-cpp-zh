    Now let''s take a look at the actual application. The first thing we do is select
    a CUDA device on to run our application. On many systems, this is not a complicated
    process, so they will contain only a single CUDA-enabled GPU. However, an increasing
    number of systems contain more than one CUDA-enabled GPU, so we need a method
    to choose one. Fortunately, the CUDA runtime provides such a facility to us.


    ```

    int main(int argc, char **argv) {

    cudaDeviceProp prop;

    int dev;


    memset(&prop, 0, sizeof(cudaDeviceProp));

    prop.major = 1;

    prop.minor = 0;

    HAND_ERROR cudaChooseDevice(&dev, &prop));

    ```


    You may recall that we use cudaChooseDevice() in Chapter 3, but since this was
    something of an ancillary part, we''ll review it again now. Essentially, this
    code tells the runtime to select any GPU that has a compute capability of version
    1.0 or better. It accomplishes this by first creating initializing a cudaDeviceProp
    structure and then setting its major version to 1 and minor version to 0. It passes
    this information to cudaChooseDevice(), which instructs the runtime to select
    a GPU in the system that satisfies the constraints specified by the cudaDeviceProp.
    In the next chapter, we will look more at what is meant by the GPU''s compute
    capability, but for now it suffices to say that it roughly indicates the features
    a GPU supports. All CUDA-capable GPUs have at least compute capability 1.0, so
    the net effect of this call is that the runtime will select any CUDA-capable device
    and return an identifier for this device in the variable dev. There is no guarantee'
