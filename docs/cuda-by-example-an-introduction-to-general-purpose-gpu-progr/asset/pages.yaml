  md: '# A.2.5 HASH TABLE PERFORMANCE


    Using Intel Core Duo, the CPU hash table example in Section A.2.2: A CPU Hash
    Table takes 360ms to build a hash table from 100MB of data. The code was built
    with the option -O3 to ensure maximally optimized CPU code. The multithreaded
    GPU hash table in Section A.2.4: A GPU Hash Table takes 375ms to complete the
    same task. Differing by less than 5 percent, these are roughly comparable execution
    times, which raises an excellent question: Why would a massively parallel machine
    such as a GPU get beaten by a single-threaded CPU version of the application?
    Frankly, this is because GPUs were not designed to excel at multithreaded access
    to complex data structures such as a hash table. For this reason, there are very
    few performance motivations to build a data structure such as a hash table on
    the GPU. So if your application needs to be build a hash table or similar data
    structure, you would likely be better off doing this on your CPU.


    On the other hand, you will sometimes find yourself in a situation where a long
    computation pipeline involves one or two stages that the GPU does not have a performance
    advantage over comparable CPU implementations. In these situations, you have three
    (somewhat obvious) options:


    +   * Perform every step of the pipeline on the GPU

    * Perform every step of the pipeline on the CPU

    * Perform some pipeline steps on the GPU and some on the CPU


    The last option sounds like the best of both worlds; however, it implies that
    you will need to synchronize your CPU and GPU at any point in your application
    where you want to move computation from the GPU to CPU or back. This synchronization
    and subsequent data transfer between host and GPU can often kill any performance
    advantage you might have derived from employing a hybrid approach in the first
    place.


    In such a situation, it may be worth your time to perform every phase of computation
    on the GPU, even if it is not ideally suited for some of the algorithm. In this
    vein, the GPU hash table can potentially prevent a CPU/GPU synchronization point,
    minimize data transfer between the host and GPU and free the CPU to perform other
    computations. In such scenario, it''s possible that the overall performance of
    a GPU implementation would exceed a CPU/GPU hybrid approach, despite the GPU being
    no faster than the CPU on certain steps (or potentially even getting troun by
    the CPU in some cases).'
