  md: '# 3.3 QUERING DEVICES


    We''ve seen how to use the host to allocate and free memory on the device, but
    we''ve also made it painfully clear that you cannot modify this memory from the
    host. The remaining two lines of the sample program illustrate two of the most
    common methods for accessing device memory—using device pointers within device
    code and by calls to `cudaMemcpy()`.


    We use pointers from within device code exactly the way we use them in standard
    C that runs on the host code. The statement `c = a + b` is as simple as it looks.
    It adds the parameters a and b together and stores the result in the memory pointed
    to c. We hope this is almost too easy to be interesting.


    We listed the ways in which we can use device pointers from within device and
    host code. These caveats translate exactly as one might imagine when considering
    host pointers. Although we around device code, we run into trouble when we attempt
    to use a host pointer to access memory from within device code. To summarize,
    host pointers can access memory from host code, and device pointers can access
    memory from device code.


    As promised, we can also access memory on a device through calls to `cudaMemcpy()`
    from host code. These behave exactly like standard C `memcpy()` with an additional
    parameter to specify which of the source and destination pointers point to device
    memory. In the example, the last parameter to `cudaMemcpy()` is `cudaMemcpyDeviceToHost`,
    instructing the runtime that the source pointer is a device pointer and the destination
    pointer is a host pointer.


    Unsurprisingly, `cudaMemcpyHostToDevice` would indicate the opposite situation,
    where the source data is on the host and the destination is an address on the
    device. Finally, we can specify that both pointers are on the device by passing
    `cudaMemcpyDeviceToDevice`. If the source and destination pointers are both on
    the host, we would simply use standard C''s `memcpy()` routine to copy between
    them.


