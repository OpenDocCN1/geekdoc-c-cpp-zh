    linear algebra routines that implements the well-known package of Basic Algebra
    Subprograms (BLAS). This library, named CUBLAS, is freely available and supports
    a large subset of the full BLAS package. This includes versions of each routine
    that accept both single- and double-precision inputs as real- and complex-valued
    data. Because BLAS was originally a FORTRAN-implemented library of linear algebra
    routines, NVIDIA attempts to maximize compatibility with the requirements and
    expectations of these implementations. Specifically, the CUBLAS library uses a
    column-major storage layout for arrays, rather than the row-major layout natively
    used by C and C++. In practice, this is
