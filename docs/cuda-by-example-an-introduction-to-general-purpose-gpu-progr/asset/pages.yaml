    \n```\n__global__ void add(int *a, int *b, int *c) {\n    int tid = blockIdx.x;\
    \ // handle the data at this index\n    if (tid < N)\n        c[tid] = a[tid]\
    \ + b[tid];\n}\n```\n\nAgain we see a common pattern with the function add():\n\
