  md: '# A.1 Dot Product Revisited


    In Chapter 5, we looked at the implementation of a dot product product using CUDA
    C. This algorithm was one of a large family of algorithms known as *reductions*.
    If you recall, the algorithm computed the dot product of two input vectors by
    doing the following:


    +   1. Each thread in each block multiplies two corresponding elements of the
    input vectors and stores the products in shared memory.


    +   2. Although a block has more than one product, a thread adds two of the products
    and stores the result back to shared memory. Each step results in half as many
    values as it started with (this is where the term *reduction comes from)


    +   3. When every block has a final sum, one writes its value to global memory
    and exits.


    +   4. If the kernel runs with N parallel blocks, the CPU sums these remaining
    values to generate the final dot product.


    This high-level look at the dot product algorithm is intended to review, if it''s
    a while or you''ve had a couple glasses of Chardonnay, it may be worth the time
    to review Chapter 5. If you feel comfortable enough with the dot product to continue,
    draw your attention to step 4 in the algorithm. Although it doesn''t involve copying
    much data to the host or performing many calculations on the CPU, moving the computation
    back to the CPU to finish is indeed as awkward as it sounds.


    But it''s more than an issue of an awkward step to the algorithm or the inelegance
    of the solution. Consider a scenario where a dot product computation is just one
    step in a long sequence of operations. If you want to perform *every operation
    on the GPU because your CPU is busy with other tasks or computations*, you''re
    out of luck. As it stands, you''ll be forced to stop computing on the GPU, copy
    intermediate results back to the host, finish the computation with the CPU, and
    finally upload that result back to the GPU and resume computing with your next
    kernel.


    Since this is an appendix on atoms and we have gone to such lengths to explain
    what pain our original dot product algorithm is, you should see where we''re heading.
    We intend to fix our dot product using using atoms so the entire computation can
    stay on the GPU, leaving your CPU free to perform other tasks. Ideally,'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'instead of exiting the kernel in step 3 and returning to the CPU in step 4,
    we want each block to add its final result to a total in global memory. If each
    value were added atomically, we would not have to worry about potential collisions
    or terminate results. Since we have already used an atomicAdd() operation in the
    histogram operation, this seems like an obvious choice.


    Unfortunately, prior to compute capability 2.0, atomicAdd operated only on integers.
    Although this might be fine if you can compute products of vectors with integer
    components, it is significantly more common to use floating-point components.
    However, the majority of NVIDIA hardware does not support atomic arithmetic on
    floating-point numbers! There''s a reasonable explanation for this, so don''t
    throw your GPU in the garbage just yet.


    Atomic operations on a value in memory guarantee only that each thread''s read-modify-write
    sequence will complete without other threads reading or writing the target value
    in process. There is no stipulation about the order in which the threads will
    perform their operations, in the case of three threads performing addition, sometimes
    the hardware will perform (A+B)+C and sometimes it will compute A+(B+C). This
    is acceptable because integer math is associative, so (A+B)+C = A+(B+C). Floating-point
    arithmetic is not associative because of the rounding of intermediate results,
    so (A+B)+C != A+(B+C). As dubious utility because it gives rise to nondeterministic
    results in a highly multi-threaded environment such as the GPU. There are many
    applications where it is unacceptable to get two different results from two runs
    of an application, the support of floating-point atomic arithmetic was not a priority
    for earlier hardware.


    However, if we are willing to tolerate some nondeterminism in the results, we
    can still accomplish the reduction entirely on the GPU. We''ll first need to develop
    a way to work around the lack of atomic floating-point arithmetic. The solution
    will still use atomic operations, but not for the arithmetic itself.


    # A.1.1 ATOMIC LOCKS


    The atomicAdd() function we used to build GPU histograms performed a read-modify-write
    operation without interruption from other threads. At a low level, you can imagine
    the hardware locking the target memory location while this operation is underway,
    and while locked, no other threads can read or write the value at the location.
    If we had a way of emulating this lock in CUDA kernels, we could perform arbitrary
    operations on an associated memory location'
