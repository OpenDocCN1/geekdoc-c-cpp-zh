    # 10.3 CUDA Streams


    In Chapter 6, we introduced the concept of CUDA events. In doing so, we postponed
    an in-depth discussion of the second argument to cudaEventRecord(), instead meaning
    that it specified the stream into which we were inserting the event.


    ```

    cudaEvent_t start;

    cudaEventCreate(&start);

    cudaEventRecord(start, 0 );

    ```


    CUDA streams can play an important role in accelerating your applications. A CUDA
    stream represents a queue of GPU operations that get executed in a specific order.
    We can add operations such as kernel launches, memory copies, and event starts
    and stops into the stream. The order specifies the order in which operations will
    be executed. You can think of each stream as a task on the GPU, and there are
    opportunities for these tasks to execute in parallel. We''ll first see how streams
    are used, and then we''ll look at how you can use streams to accelerate your applications.


