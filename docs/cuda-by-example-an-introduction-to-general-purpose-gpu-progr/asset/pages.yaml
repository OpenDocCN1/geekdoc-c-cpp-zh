  md: '# Chapter 12


    # # The Final Countdown


    Congratulations! We hope you''ve enjoyed learning about CUDA C and experiencing
    with GPU computing. It''s been a long trip, so let''s take a moment to review
    where we started and how much ground we''ve covered. Starting with a background
    in C or C++ programming, we''ve learned how to use the CUDA runtime''s angle bracket
    syntax to easily launch multiple copies of kernels across any number of multiprocessors.
    We expanded these concepts to collections of threads and blocks, operating on
    arbitrarily large inputs. These more complex launches exploited interthread communication
    using the GPU''s special, on-chip shared memory, and they employed dedicated synchronization
    primitives to ensure correct operation in an environment that supports [and encourages]
    thousands upon thousands of parallel threads.


    Armed with basic concepts about parallel programming using CUDA C on NVIDIA''s
    CUDA Architecture, we explored some of the more advanced concepts and APIs NVIDIA
    provides. The GPU''s dedicated graphics hardware proves useful for GPU computing,
    so we learned how to exploit texture memory to accelerate some common patterns
    of memory access. Because many users add GPU computing to their interactive graphics
    applications, we explored the interoperability of CUDA C kernels with industry-standard
    graphics APIs such as OpenGL and DirectX. Atomic operations on both global and
    shared memory allowed safe,'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'THE FINAL COUNTDOWN


    multithreaded access to common memory locations. Moving steadily into more and
    advanced topics, streams enabled us to keep our entire system as busy as possible,
    allowing kernels to execute simultaneously with memory copies between the host
    and GPU. Finally, we looked at the ways in which we could allocate and use zero-copy
    memory applications on integrated GPUs. Moreover, we learned to initialize multiple
    devices and allocate pinned memory in order to write CUDA C that fully utilizes
    increasingly common, multi-GPU environments.


    # 12.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   * You will learn about some of the tools available to aid your CUDA development.

    * You will learn about additional written and code resources to take your CUDA
    development to the next level.


    # 12.2 CUDA Tools


    Through the course of this book, we have relied upon several components of the
    CUDA software system. The applications we wrote made heavy use of the CUDA compiler
    in order to convert our CUDA kernels into code that could be executed on NVIDIA
    GPUs. We also used the CUDA runtime in order to perform much of the setup and
    dirty work behind launching kernels and communicating with the GPU. The CUDA runtime,
    in turn, uses the CUDA driver to talk directly to the hardware in your system.
    In addition to those components that we have already used at length, NVIDIA makes
    available a host of other software in order to ease the development of CUDA applications.
    This section does not serve well as a user''s manual to these products, but rather,
    it aims solely to inform you of the existence and utility of these packages.


    # 12.2.1 CUDA TOOLKIT


    You almost certainly already have the CUDA Toolkit collection of software on your
    development machine. We can be sure of this because the set of CUDA C compiler
    tools comprises one of the principal components of this package. If'
  merge: -1
  pgno: 258
