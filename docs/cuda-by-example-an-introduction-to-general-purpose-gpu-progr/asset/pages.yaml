    or write the value of x until we have completed our operation. Because the execution
    of these operations cannot be broken into smaller parts by other threads, we call
    operations that satisfy this constraint as atomic. CUDA C supports several atomic
    operations that allow you to operate safely on memory, even when thousands of
    threads are potentially competing for access.


