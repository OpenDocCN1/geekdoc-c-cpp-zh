    \ our application, we create 100MB of random data.\n\n```\n#include \"../book.h\"\
    \n\n#define SIZE (100*1024*1024)\n\nint main(void ) {\n    unsigned char *buffer\
    \ = (unsigned char*)big_random_block( SIZE );\n```\n\nSince each random 8-bit\
    \ byte can be any of 256 different values (from 0x00 to 0xFF), our histogram needs\
    \ to contain 256 bins in order to keep track of the number of times each value\
    \ has been seen in the data. We create a 256-bin array and initialize all the\
    \ bin counts to zero.\n\n```\nunsigned int histo[256];\nfor (int i=0; i<256; i++)\n\
    histo[i] = 0;\n```\n\nOnce our histogram has been created and all the bins are\
    \ initialized to zero, we need to tabulate the frequency with which each value\
    \ appears in the data contained in buffer[]. The idea here is that whenever we\
    \ see some value z in the array buffer[], we want to increment the value in bin\
    \ z of our histogram. This way, we’re counting the number of times we have seen\
    \ an occurrence of the value z."
