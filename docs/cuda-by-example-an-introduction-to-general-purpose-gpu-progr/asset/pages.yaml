    \ ));\nprop.major = 1;\nprop.minor = 3;\n```\n\nAfter filling a cudaDeviceProp\
    \ structure, we pass it to cudaChooseDevice() to have the CUDA runtime find a\
    \ device that satisfies this constraint. The call to cudaChooseDevice() returns\
    \ a device ID that we can then pass to cudaSetDevice(). From this point, all operations\
    \ will take place on the device we found in cudaChooseDevice().\n\n```\n#include\
    \ \"common/book.h\"\n\nint main( void ) {\n    cudaDeviceProp prop;\n    int dev;\n\
    \n    HANDLE_ERROR(cudaGetDevice(&dev ) &dev );\n    printf(\"ID of current CUDA\
