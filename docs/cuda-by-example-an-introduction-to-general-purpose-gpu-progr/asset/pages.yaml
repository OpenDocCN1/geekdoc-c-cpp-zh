  md: "# 5.3 SHARED MEMORY AND SYNCHRONIZATION\n\ninstruction on any thread. This\
    \ is exactly what we need! We now know that when the first thread executes the\
    \ first instruction after our __synctreads(), every other thread in the block\
    \ has also finished executing up to the __syncthreads().\n\nNow we have guaranteed\
    \ that our temporary cache has been filled, we can sum the values in it. We call\
    \ the general process of taking an input array and performing some computations\
    \ that produce a smaller array of results a reduction. Reductions arise often\
    \ in parallel computing, which leads to the desire to give them a name.\n\nThe\
    \ naive way to accomplish this reduction would be having one thread iterate over\
    \ the shared memory and calculate a running sum. This will take us proportional\
    \ to the length of the array. However, since we have hundreds of threads available\
    \ to our work, we can do this reduction in parallel and time that is proportional\
    \ to the logarithm of the length of the array. At first, the following code will\
    \ look convoluted; we'll break it down in a moment.\n\nThe general idea is that\
    \ each thread will add two of the values in cache[] and store the result back\
    \ to cache[]. Since each thread combines two entries into one, we complete this\
    \ step with half as many entries as we started with. In the next step, we do the\
    \ same thing on the remaining half. We continue in this fashion for log2(threadsPerBlock)\
    \ steps until we have the sum of every entry in cache[]. For our example, we're\
    \ using 256 threads per block, so it takes 8 iterations of this process to reduce\
    \ the 256 entries in cache[] to a single sum.\n\nThe code for this follows:\n\n\
