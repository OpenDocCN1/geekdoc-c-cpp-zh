    # # 7.3 Simulating Heat Transfer


    Physical simulations can be among the most computationally challenging problems
    to solve. Fundamentally, there is often a trade-off between accuracy and computational
    complexity. As a result, computer simulations have become more and important in
    recent years, thanks in large part to the increased accuracy possible as a consequence
    of the parallel computing revolution. Since many physical simulations can be parallelized
    quite easily, we will look at a very simple simulation model in this example.


    # ## 7.3.1 SIMPLE HEATING MODEL


    To demonstrate a situation where you can effectively employ texture memory, we
    will construct a simple two-dimensional heat transfer simulation. We start by
    assuming that we have some rectangular room that we divide into a grid. Inside
    the grid, we will randomly scatter a handful of “heaters” with various fixed temperatures.
    Figure 7.2 shows an example of what this room might look like.


    ![](img/bfb67561d51829571288a8e3f69aa290_137_0.png)


    Figure 7.2 A room with “heaters” of various temperature'
