    # A.2.3 MULTITHREADED HASH TABLE


    There are some assumptions built into our CPU hash table that will no longer be
    valid when we move to the GPU. First, we have assumed that only one node can be
    added to the table at a time in order to make the addition of a node simpler.
    If more than one thread were trying to add a node to the table at once, we could
    end up with problems similar to the multithreaded addition problems from Chapter
    9.


    For example, we revisit our "avocado and aardvark" example and imagine that threads
    A and B are trying to add these entries to the list. Thread A computes a hash
    function on avocado, and thread B computes the function on aardvark. They both
    decide their keys belong in the same bucket. To add the new entry to the list,
    thread A and B start by setting their entrys next pointer to the first node of
    the existing list as in Figure A.4.


    Then, both threads try to replace the entry in the bucket array with their new
    entry. However, the thread that finishes second is the only thread that has its
    update preserved because it overwrites the work of the previous thread. So consider
    the scenario where thread A replaces the altitude with its entry for avocado.
    Immediately after finishing, thread B replaces what it believe to be the entry
    for altitude with its entry for aardvark. Unfortunately, it''s replacing avocado
    instead of altitude, resulting in the situation illustrated in Figure A.5.


    ![](img/bfb67561d51829571288a8e3f69aa290_287_0.png)


    Figure A.4 Multiple threads attempting to add a node to the same bucket'
