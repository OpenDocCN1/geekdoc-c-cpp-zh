  md: "# 5.3.1 DOT PRODUCT\n\nCongratulations! We have graduated from vector addition\
    \ and will now take a look at dot products (sometimes called an inner product).\
    \ We will quickly review what a dot product is, just in case you are unfamiliar\
    \ with vector mathematics for it has been a few years). The computation consists\
    \ of two steps. We multiply corresponding elements of the two input vectors. This\
    \ is very similar to vector addition but utilizes multiplication instead of addition.\
    \ However, instead of storing these values to a third output, we sum them to produce\
    \ a single scalar output.\n\nFor example, if we take the dot product of two four-element\
    \ vectors, we would get Equation 5.1.\n\n# Equation 5.1\n\n$(x_1, x_2, x_3, x_4)\
    \ \\cdot (y_1, y_2, y_3, y_4) = x_1y_1 + x_2y_2 + x_3y_3 + x_4y_4$\n\nPerhaps\
    \ the algorithm we intend to use is becoming obvious. We can do the first step\
    \ exactly how we did vector addition. Each thread multiplies a pair of corresponding\
    \ entries, and then every thread moves on to its next pair. Because the result\
    \ needs to be the sum of all these pairwise products, each thread keeps a running\
    \ sum of the pairs it has added. Just like in the addition threads, like in the\
    \ example, the threads increment their indices by the total number of threads\
    \ to ensure we don't miss any elements and don't multiply a pair twice. Here is\
    \ the first step of the dot routine:\n\n```\n#include \"../common/book.h\"\n\n\
    #define imin(a,b) (a<b)\n\nconst int N = 33 * 1024;\nconst int threadsBlock =\
    \ 256;\n\n__global__ void dot(float *a, float *b, float *c ) {\n    __shared__\
    \ float cache[threadsPerBlock];\n    int tid = threadIdx.x + blockIdx.x * blockDim.x;\n\
    \    int cacheIndex = threadIdx.x;\n```"
