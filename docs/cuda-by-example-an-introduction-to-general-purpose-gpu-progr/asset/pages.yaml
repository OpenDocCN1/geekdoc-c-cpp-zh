    \n# BLOCK 4\n\n```\nglobal void\nadd(int *a, int *b, int *c) {\n  int× tid = 2;\n\
    \  if (tid < N)\n    c[tid] = a[tid] + b[tid];\n}\n```\n\n```\nglobal void\nadd(int\
    \ *a, int *b, int *c) {\n  int× tid = 3;\n  if (tid < N)\n    c[tid] = a[tid]\
    \ + b[tid];\n}\n```\n\nIf we recall the CPU-based example with which we began,\
    \ you will recall that we needed to walk through indices from 0 to N-1 in order\
    \ to sum the vectors. Since the runtime system is already launching a kernel where\
    \ each block will have one of these indices, nearly all of this work has already\
