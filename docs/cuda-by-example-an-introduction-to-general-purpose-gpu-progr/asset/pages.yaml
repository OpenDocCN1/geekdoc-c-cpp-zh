  md: "# A.2 IMPLEMENTING A HASH TABLE\n\nSince it's a good idea to have some idea\
    \ whether the code you've written works, we've implemented a routine to perform\
    \ a sanity check on a hash table. The check involves first walking through the\
    \ table and examining every node. We compute the hash function on the node's key\
    \ and confirm that the node is stored in the correct bucket. After checking every\
    \ node, we verify that the number of nodes actually in the table is indeed equal\
    \ to the number of elements we intended to add to the table. If these numbers\
    \ do not agree, then we've added a node accidentally to multiple buckets or we\
    \ haven't inserted it correctly.\n\n```\n#define SIZE (100*1024*1024)\n#define\
    \ ELEMENTS (SIZE / sizeof(unsigned int))\n\nvoid verify_table(const Table &table\
    \ ) {\n    int count = 0;\n    for (size_t i=0; i<table.count; i++) {\n      \
    \  Entry *current = table.entries[i];\n        while (current != NULL) {\n   \
    \         count++;\n            if (hash( current->value, table.count ) != i)\
    \ {\n                printf(\"%d hashed to %ld, but was located \\n\"at %ld\\\
    n\", current->value, i);\n                hash( current->value, table.count ),\
    \ i );\n            }\n            current = current->next;\n        }\n    }\n\
    \    if (count != ELEMENTS)\n        printf(\"%d elements found in hash table.\
    \ Should be %ld\\n\",\n            count, ELEMENTS );\n    }\n    else\n     \
    \   printf(\"All %d elements found in hash table.\\n\", count);\n}\n```"
