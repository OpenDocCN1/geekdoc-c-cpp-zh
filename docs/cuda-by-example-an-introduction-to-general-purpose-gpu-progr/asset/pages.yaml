  md: '# 8.2 GRAPHICS INTEROPERATION


    If you have never used a pixel buffer object (PBO) in OpenGL, you will typically
    create one with these three steps: First, we generate a buffer handle glGenBuffers().
    Then, we bind the handle to a pixel buffer with glBindBuffer(). Finally, we request
    the OpenGL driver to allocate a buffer for us with glBufferData(). In this example,
    we request a buffer to hold DIM x DIM 32-bit values and use the enumerator GL_DYNAMIC_DRAW
    to indicate that the buffer will be modified repeatedly by the application. Since
    we have no data to preload the buffer, we pass NULL as the penultimate argument
    to glBufferData().


    All that remains in our quest to set up graphics interoperability is notifying
    the CUDA runtime that we intend to share the OpenGL buffer bufferObj with CUDA.
    We do this by registering bufferObj with the CUDA runtime as a graphics resource.


    ```

    HANDLE_ERROR(

    cudaGraphicsGLRegisterBuffer(&resource,

    bufferObj,

    cudaGraphicsMapFlagsNone)

    )

    ```


    We specify to the CUDA runtime that we intend to use the OpenGL PBO with both
    OpenGL and CUDA by calling cudaGraphicsGLRegisterBuffer(). The CUDA runtime returns
    a CUDA-friendly handle to the buffer in the variable resource. This handle will
    be used to refer to bufferObj in subsequent calls to the CUDA runtime.


    The flag cudaGraphicsMapFlagsNone specifies that there is no particular behavior
    of this buffer that we want to specify, although we have the option to specify
    with cudaGraphicsMapFlagsReadOnly that the buffer will be readonly. We could also
    use cudaGraphicsMapFlagsWriteDiscard to specify that the previous contents will
    be discarded, which essentially write-only. These flags allow the CUDA and OpenGL
    drivers to optimize the hardware settings for restricted patterns, although they
    are not required to be set.


    Effectively, the call to glBufferData() requests the OpenGL driver to allocate
    a buffer large enough to hold DIM x DIM 32-bit values. In subsequent OpenGL calls,
    we''ll refer to this buffer with the handle bufferObj, while in CUDA runtime,
    we''ll refer to this buffer with the pointer resource. Since we would like to
    read from write to this buffer from our CUDA kernels, we will need more than just
    a handle to the object. We will need an actual address in device memory that can
    be


    ![](img/bfb67561d51829571288a8e3f69aa290_163_0.png)'
