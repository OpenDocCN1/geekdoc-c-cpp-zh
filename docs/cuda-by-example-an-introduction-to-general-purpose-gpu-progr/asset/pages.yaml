  md: '# 12.4.1 CUDA DATA PARALLEL PRIMITIVES


    NVIDIA, with the help of researchers at the University of California Davis, has
    released a library known as the CUDA Data Parallel Primitives Library (CUDPP).
    CUDPP, as the name indicates, is a library of data-parallel algorithm primitives.
    Some of these primitives include parallel prefix-sum (scan), parallel sort, and
    parallel reduction. Primitives such as these form the foundation of a wide variety
    of data-parallel algorithms, including sorting, stream compaction, building data
    structures, and many others. If you''re looking to write an even moderately complex
    algorithms, chances are that either CUDPP already has what you need or it can
    get significantly closer to where you want to be. Download it at http://code.google.com/p/cudpp.


    # 12.4.2 CULATOOLS


    As mentioned in Section 12.1.3: CUBLAS, NVIDIA provides an implementation of the
    BLAS packaged along with the CUDA Toolkit. For readers who need a better solution
    for linear algebra, take a look at EM Photonics'' CUDA implementation of the industry-standard
    Linear Algebra Package (LAPACK). Its LAPACK implementation is known as CULAtools
    and offers more complex linear algebra routines that are built on NVIDIA''s CUDA
    technology. The freely Basic package offers LU decomposition, QR factorization,
    linear system solver, and singular value decomposition, as well as linear squares
    and constrained least squares solvers. You can obtain the Basic download at www.culatools.com/versions/basic.
    You will also notice that EM Photonics offers Premium and Commercial licenses,
    which contain a greater fraction of the LAPACK routines, as well as licensing
    terms that will allow you to distribute your own commercial applications based
    on CULAtools.


    # 12.4.3 LANGUAGE WRAPPERS


    This book has primarily been concerned with C and C++, but clearly hundreds of
    projects that exist do not employ these languages. Fortunately, third parties
    have written wrappers to access CUDA technology from languages not officially
    supported by NVIDIA. NVIDIA itself provides FORTRAN bindings for its CUBLAS library,
    but you can also find Java bindings for several of the CUDA libraries at www.jcuda.org.
    Likewise, Python wrappers allow the use of CUDA kernels from Python applications
    are available from the PyCUDA project at'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'http://mathema.tician.de/software/cuda. Finally, there are bindings for the
    Microsoft .NET environment available from the CUDA.NET project at www.hoopoe-cloud.com/Solutions/CUDA.NET.


    Although these projects are not officially supported by NVIDIA, they have been
    around for several versions of CUDA, are all freely available, and has many successful
    customers. The moral of this story is, if your language of choice (or your boss’s
    choice) is not C or C++, you should not rule out GPU computing until you''ve first
    looked to see whether the bindings are available.


    # 12.5 Chapter Review


    And there you have it. Even after 11 chapters of CUDA C, there are still loads
    of resources to download, read, watch, and compile. This is a remarkably interesting
