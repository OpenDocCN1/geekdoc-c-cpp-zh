  md: "# INTRODUCTION TO CUDA\n\npeople to have more than one CUDA-capable device\
    \ per computer. In situations like this, we will definitely want a way to determine\
    \ which processor is which.\n\nFor example, many motherboards ship with integrated\
    \ NVIDIA graphics processors. When a manufacturer or user adds a discrete graphics\
    \ processor to this computer, it possesses two CUDA-capable processors. Some NVIDIA\
    \ products, like the GeForce GTX 295, with two GPUs on a single card. Computers\
    \ that contain products such as this will also show two CUDA-capable processors.\n\
    \nBefore we get too deep into writing code, we would love to have a mechanism\
    \ for determining which devices (if any) are present and what capabilities each\
    \ device supports. Fortunately, there is a very easy interface to determine this\
    \ information. First, we will want to know how many devices in the system were\
    \ built on the CUDA Architecture. These devices will be capable of executing kernels\
    \ written in CUDA C. To get the count of CUDA devices, we call cudaDeviceCount().\
    \ Needless to say, we anticipate receiving an award for Most Creative Function\
    \ Name.\n\n```\nint count;\nHANDLE_ERROR cudaGetDeviceCount(&count);\n```\n\n\
    After calling cudaDeviceCount(), we can then iterate through the devices and query\
    \ relevant information about each. The CUDA runtime returns us properties in a\
    \ structure of type cudaDeviceProp. What kind of properties can we retrieve? As\
    \ of CUDA 3.0, the cudaDeviceProp structure contains the following:\n\n```\nstruct\
    \ cudaDeviceProp {\n  char name[256];\n  size_t totalGlobalMem;\n  size_t sharedMemPerBlock;\n\
    \  int regsPerBlock;\n  int warpSize;\n  size_t memPitch;\n  int maxThreadsPerBlock;\n\
    \  int maxThreadsDim[3];\n  size_t totalConstMem;\n  int major;\n}\n```"
