    \ array and the pool of free entries:\n\n```\nvoid free_table( Table &table )\
    \ {\n    free(table.entries);\n    free(table.pool);\n}\n```\n\nIn our introduction,\
    \ we spoke a bit about the hash function. Specifically, we discussed how a good\
    \ hash function can make the difference between an excellent hash table implementation\
    \ and poor one. In this example, we're using unsigned integers as keys, and we\
    \ need to map these to the indices of our bucket array. The simplest way to do\
    \ this is to select the bucket with an equal index to the key. That is, we could\
    \ store the entry in `table.entries[key]`. However, we have no way of guaranteeing\
    \ that every key will be less than the length of the array of buckets. Fortunately,\
    \ this problem can be solved relatively:\n\n```\nsize_t hash( unsigned int key,\
