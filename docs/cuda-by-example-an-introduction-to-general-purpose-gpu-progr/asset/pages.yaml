    # 2.2.2 NVIDIA DEVICE DRIVER


    NVIDIA provides system software that allows your programs to communicate with
    the CUDA-enabled hardware. If you have installed NVIDIA GPU properly, you likely
    already have this software installed on your machine. It never hurts to ensure
    you have the most recent drivers, so we recommend you visit www.nvidia.com/cuda
    and click the Download Drivers link. Select the options that match the graphics
    card and operating system on which you plan to develop. After following the installation
    instructions for the platform of your choice, your system will be up-to-date with
    the latest NVIDIA software.


    # 2.2.3 CUDA DEVELOPMENT TOOLKIT


    If you have a CUDA-enabled GPU and NVIDIA''s device driver, you are ready to run
    compiled CUDA code. This means that will be able to successfully execute your
    code on your graphics processor. However, we assume that you want to do more than
    just run code because, this book isn''t really necessary. If you want to develop
    code for NVIDIA GPUs using CUDA C, you will need additional software. As promised
    earlier, one of it will cost you a penalty.


    You will learn these details in the next chapter, but since your CUDA C applications
    are going to compile on two different processors, you are consequently to need
    two compilers. One compiler will compile code for your GPU, and one will compile
    code for your CPU. NVIDIA provides the compiler for your GPU code. As with the
    NVIDIA device driver, you can download the CUDA Toolkit at http://developer.nvidia.com/object/gpucomputing.html.
    Click the CUDA Toolkit link to reach the download page shown in Figure 2.1.'
