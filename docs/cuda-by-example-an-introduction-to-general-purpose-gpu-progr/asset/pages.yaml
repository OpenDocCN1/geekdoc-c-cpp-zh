  md: '# 5.3 Shared Memory and Synchronization


    So far, the motivation for splitting blocks into threads was simply one of working
    around here hardware limitations to the number of blocks we can have in flight.
    This is fairly weak motivation, because this could easily be done behind the scenes
    by the CUDA runtime. Fortunately, there are other reasons one might want to split
    a block into threads.


    CUDA makes available a region of memory that we call shared memory. This region
    of memory brings along with it another extension to the C language like `__device__`
    and `__global__`. As a programmer, you can modify variable declarations with the
    CUDA keyword `__shared__` to make this variable resident in shared memory. But
    what''s the point?


    We''re glad you asked. The CUDA compiler treats variables in shared memory differently
    than typical variables. It creates a copy of the variable for each block that
    you launch on the GPU. Every thread in that block shares the memory, but threads
    cannot see or modify the copy of this variable that is seen within other blocks.
    This provides an excellent means by which threads within a block can communicate
    and collaborate on computations. Furthermore, shared memory buffers reside physically
    on the GPU as opposed to residing in off-chip DRAM. Because of this, the latency
    to access shared memory tends to be far lower than typical blocks, making shared
    memory effective as a per-block, software-managed cache or scratchpad.


    The prospect of communication between threads should excite you. It excites us,
    too. Nothing in life is free, and interthread communication is no exception. If
    we expect to communicate between threads, we also need a mechanism for synchronizing
    between threads. For example, if thread A writes a value to shared memory and
    we need thread B to do something with this value, we can''t have thread B start
    its work until we know the write from thread A is complete. Without synchronization,
    we have created a race condition where the correctness of the execution results
    depends on the nondeterministic details of the hardware.


    Let''s take a look at an example that uses these features.'
