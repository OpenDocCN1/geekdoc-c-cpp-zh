  md: "# A.2 IMPLEMENTING A HASH TABLE\n\nTable initialization consists primarily\
    \ of allocating memory and clearing memory for the bucket array **entries**. We\
    \ also allocate storage for a pool of entries and initialize the `firstFree` pointer\
    \ to be the first entry in the pool array.\n\nAt the end of the application, we'll\
