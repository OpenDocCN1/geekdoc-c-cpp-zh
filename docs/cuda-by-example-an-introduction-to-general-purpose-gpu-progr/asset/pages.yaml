  md: '# 10.8 Chapter Review


    In this chapter, we looked at a method for achieving a kind of task-level parallelism
    in CUDA C applications. By using two (or more) CUDA streams, we can allow the
    GPU to simultaneously execute a kernel while performing a copy between the host
    and GPU. We need to be careful about two things when we endeavor to do this. First,
    the host memory involved needs to be allocated using `cudaHostAlloc()` or `cudaMemcpyAsync()`,
    and asynchronous copies need to be performed with pinned buffers. Second, we need
    to be aware that the order in which we add operations to our streams will affect
    our capacity to achieve overlapping of copies and kernel executions. The general
    guideline involves a breadth-first, or round-robin, assignment of work to the
    streams you intend to use. This can be counterintuitive if you don''t understand
    how the hardware queuing works, so it''s a good thing to remember when you go
    about writing your own applications.'
