  md: '# 12.2.7 CUDA VISUAL PROFILER


    We often tout the CUDA Architecture as a wonderful foundation for high-performance
    computing applications. Unfortunately, the reality is that after ferreting out
    all the bugs from your applications, even the most well-meaning "high-performance
    computing" applications are more accurately referred to as simply "computing"
    applications. We have often been in the position where we wonder "Why in the San
    Hill is my code performing so poorly?" In situations like this, it helps to be
    able to enable the kernels in question under the watchful gaze of a profiling
    tool. NVIDIA provides such a tool, available as a separate download on the CUDA
    Zone website. Figure 12.1 shows the Visual Profiler being used to compare two
    implementations of matrix transpose operation. Despite not looking at a line of
    code, it becomes quite easy to determine that memory instruction throughput of
    the `transpose()` kernel outstrip that of the `transpose_naive()` kernel.(But
    again, it would be unfair to expect much more from a function with `naive`.)


    ![](img/bfb67561d51829571288a8e3f69aa290_263_0.png)


    Figure 12.1 The CUDA Visual Profiler being used to profile a matrix transpose
    application'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'The CUDA Visual Profiler will execute your application, examining special counters
    built into the GPU. After execution, the profiler can compile data based on these
    counters and present you with reports based on what it observed. It can verify
    how long your application spends executing each kernel as well as determine the
    number of blocks launched, whether your kernel''s memory accesses are coalesced,
    the number of divergent warps in your code execute, and so on. We encourage you
    to look into the CUDA Visual Profiler if you have some subtle performance problems
    in need resolution.


    # 12.3 Written Resources


    If you haven''t already grown queasy from all the prose in this book, then it''s
    possible you might actually be interested in reading more. We know that some of
    you are more likely to want to play with cuda in order to continue your learning,
    but for the rest of you, there are additional written resources to maintain your
    growth as a CUDA coder.


    # 12.3.1 PROGRAMMING MASSIVELY PARALLEL PROCESSORS: A HANDS-ON APPROACH


    If you read Chapter 1, we assured you that this book was most decided not a textbook
    on parallel architectures. Sure, we wanried about terms such as multi-processor
    and warp, this book strives to teach the softer side of programming with CUDA
    C and its attendant APIs. We learned the CUDA language within the programming
    model set forth in the NVIDIA CUDA Programming Guide, largely ignoring the NVIDIA''s
    hardware architecture actually completes the tasks we give.


    But to truly become advanced, well-rounded CUDA C programmer will need a more
    intimate familiarity with the CUDA Architecture and some of the nuances of NVIDIA
    GPUs work the scenes. To accomplish this, we recommend going your way through
    Massively Parallel Processors: A Hands-on Approach. To write it, David Kirk, formerly
    NVIDIA''s chief scientist, collaborated with Wen-mei W. Hwu, the W.J. Sanders
    III chairman in electrical and computer engineering at University of Illinois.
    You''ll encounter a number of terms and concepts, but you will learn about the
    gritty details of NVIDIA''s CUDA Architecture, including thread scheduling and
    latency tolerance, memory bandwidth usage and efficiency, specifics on floating-point'
  merge: -1
