  md: 'system memory with the CPU. Many recent systems built with NVIDIA''s nForce
    media and communications processors (MCPs) contain CUDA-capable GPUs. In addition
    to nForce MCPs, all the notebook, notebook, and desktop computers based on NVIDIA''s
    new ION platform contain integrated, CUDA-capable GPUs. For integrated GPUs, the
    use of zero-copy memory is always a performance win because the memory is physically
    shared with the host anyway. Declaring a buffer as zero-copy has the effect of
    preventing unnecessary copies of data. But remember that nothing is free and that
    zero-copy buffers are still constrained in the same way that all pinned memory
    allocations are constrained: Each pinned allocation carries into the system''s
    available physical memory, which will eventually degrade system performance.


    In cases where inputs and outputs are used exactly once, we will even see a performance
    enhancement when using zero-copy memory with a discrete GPU. Since GPUs are designed
    to excel at hiding the latencies associated with memory access, performing reads
    and writes over the PCI bus can be mitigated to some degree by this mechanism,
    yielding a noticeable performance advantage. But since the zero-copy memory is
    not cached on the GPU, in situations where the memory gets read multiple times,
    we will end up paying a large penalty that could be avoided by copying data to
    the GPU first.


    How do you determine whether a GPU is integrated or discrete? Well, you can open
    up your computer and look, but this solution is finally unfavorable for you. CUDA
    code can check this property of a GPU by, not surprisingly, looking at the structure
    returned by cudaDeviceProperties(). This structure has a field named integrated,
    which will be true if the device is an integrated GPU and false if it''s not.


    Since our dot product application satisfies the "read and write exactly once"
    constraint, it is possible that it will enjoy a performance boost when run with
    zero-copy memory. And in fact, it does enjoy a slight boost in performance. On
    a GeForce GTX 285, the execution time improves by more than 45 percent, dropping
    from 98.1ms when migrated to zero-copy memory. A GeForce GTX 280 enjoys a similar
    improvement, speeding up by 34 percent from 143.9 ms to 94.7ms. Of course, different
    GPUs will exhibit different performance characteristics because of varying ratios
    of computation to bandwidth, as well as because of variations in effective PCI
    Express bandwidth across chipsets.'
