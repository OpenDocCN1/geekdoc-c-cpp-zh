  md: 'GPU Computing SDK. These code samples should not be treated as production-worthy
    library code but as educational illustrations of functioning CUDA programs, unlike
    the examples in this book.


    # 12.2.5 NVIDIA PERFORMANCE PRIMITIVES


    In addition to the routines offered in the CUFF and CUBLAS libraries, NVIDIA also
    maintains a library of functions for performing CUDA-accelerated data processing
    known as the NVIDIA Performance Primitives (NPP). Currently, NPP''s initial set
    of functionality focuses specifically on imaging and video processing and is widely
    applicable for developers in these areas. NVIDIA intends NPP to evolve over time
    to address a greater number of computing tasks in a wider range of domains. If
    you have interest in high-performance imaging or video applications, you should
    make it a priority to look into NPP, available as a free download at www.nvidia.com/object/npp.html
    (or accessible from your favorite web search engine).


    # 12.2.6 DEBUGGING CUDA


    We have heard from a variety of sources that, in rare instances, computer software
    does not work as intended when first executed. Some code computes incorrect values,
    some fails to terminate execution, and some code puts the computer into a state
    that only a flip of the power switch can remedy. Although having never written
    code like this personally, the authors of this book recognize that some engineers
    may desire resources to debug their CUDA kernels. Fortunately, NVIDIA provides
    tools to make this painful process significantly less troublesome.


    # CUDA-GDB


    A tool known as CUDA-GDB is one of the most useful CUDA downloads for CUDA programmers
    who develop their code on Linux-based systems. NVIDIA extended the open source
    GNU debugger (gdb) to transparently debug device code in real time while maintaining
    the familiar interface of gdb. Prior to CUDA-GDB, there existed no good way to
    debug device code outside of using the CPU to simulate the way in which it was
    expected to run. This method yielded extremely slow debugging, and, in fact, it
    was a very poor approximation of the exact GPU execution of the kernel. NVIDIA''s
    CUDA-GDB enables programmers to debug their kernels directly on the GPU, affording
    them all of'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'the control that they''ve grown accustomed to with CPU debuggers. Some of the
    highlights of CUDA-GDB include the following:


    +   - Viewing CUDA state, such as information regarding installed GPUs and their
    capabilities


    +   - Setting breakpoints in CUDA C source code


    +   - Inspecting GPU memory, including all global and shared memory


    +   - Inspecting the blocks and threads currently resident on the GPU


    +   - Breaking into currently running applications, including hung or deadlocked
    applications


    Along with the debugger, NVIDIA provides the CUDA Memory Checker whose functionality
    can be accessed through CUDA-GDB or the stand-alone tool, `cuda-memcheck`. Because
    the CUDA Architecture is a sophisticated memory management unit built directly
    into the hardware, all illegal memory accesses will be detected and prevented
    by the hardware. As a result of a memory violation, your program will cease functioning
    as expected, so you will certainly want visibility into these types of errors.
    When enabled, the CUDA Memory Checker will detect any global memory violations
    or misaligned memory accesses that your kernel attempts to make, reporting them
    to you in a far more helpful and verbose manner than previously possible.


    # NVIDIA PARALLEL NSIGHT


    Although CUDA-GDB is a mature and fantastic tool for debugging CUDA kernels on
    real time, NVIDIA recognizes that not every developer is over the moon about Linux.
    So, unless Windows are hedging their bets by opening up their own pet stores,
    they need a way to debug their applications, toward the end of 2009, NVIDIA introduced
    NVIDIA Parallel Nsight (code-named Nexus), the first integrated GPU/CPU debugger
    for Microsoft Visual Studio. Like CUDA-GDB, Parallel Nsight supports debugging
    CUDA applications with thousands of threads. Users can place breakpoints anywhere
    in their CUDA source code, including breakpoints that trigger on writes to arbitrary
    memory locations. They can inspect GPU memory directly from the Visual Studio
    memory window and check for out-of-bounds memory accesses. This tool has been
    made publicly available in a beta program as of press time, and the final version
    should be released shortly.'
  merge: -1
