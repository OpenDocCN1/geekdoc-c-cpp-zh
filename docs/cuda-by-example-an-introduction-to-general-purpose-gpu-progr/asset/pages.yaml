  md: '# 3.5 CHAPTER REVIEW


    Systems with multiple GPUs are becoming more and more common. For example, many
    of NVIDIA''s motherboard chipsets contain integrated, CUDAable GPUs. When a discrete
    GPU is added to one of these systems, suddenly have a multi-GPU platform. Moreover,
    NVIDIA''s SLI technology allows multiple discrete GPUs to be installed side by
    side. In either of these cases, your application may have a preference of one
    GPU over another. If your application depends on certain features of the GPU or
    depends on having the fastest GPU in the system, you should familiarize yourself
    with this API because there is no guarantee that the CUDA runtime will choose
    the best or most appropriate GPU for your application.


    # 3.5 Chapter Review


    We''ve finally gotten our hands dirty writing CUDA C, and ideally it has been
    less painful than you might have suspected. Fundamentally, CUDA C is standard
    C with some ornamentation to allow us to specify which code should run on the
    device and which should run on the host. By adding the keyword `__global__` before
    a function, we indicated to the compiler that we intend to run the function on
    the GPU. To use the GPU''s dedicated memory, we also learned CUDA API similar
    to C''s `malloc()`, `memcpy()`, and `free()` APIs. The CUDA versions of these
    functions, `cudaMalloc()`, `cudacpy()`, and `cudaFree()`, allow us to allocate
    device memory, copy data between the device and host, and free the device memory
    when we finished with it.


    As we progress through this book, we will see more interesting examples of how
    we can effectively use the device as a massively parallel coprocessor. For now,
    you should know how easy it is to get started with CUDA C, and in the next chapter
    we will see how easy it is to execute parallel code on the GPU.'
