    FORTRAN applications to CUDA libraries.


    # 12.2.4 NVIDIA GPU COMPUTING SDK


    Available separately from the NVIDIA drivers and CUDA Toolkit, the optional Computing
    SDK download contains a package of dozens of sample GPU computing applications.
    We mentioned this SDK earlier in the book because its samples serve as an excellent
