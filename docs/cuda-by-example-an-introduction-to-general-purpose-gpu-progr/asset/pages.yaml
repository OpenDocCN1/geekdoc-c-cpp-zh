  md: "# 4.2 CUDA PARALLEL PROGRAMMING\n\nparameters, this boundary forms a fractal,\
    \ one of the most interesting and beautiful curiosities of mathematics.\n\nThe\
    \ calculations involved in generating such a set are quite simple. At its heart,\
    \ the Julia Set evaluates a simple iterative equation for points in the complex\
    \ plane. A point is not in the set if the process of iterating the equation diverges\
    \ for that point. That is, if the sequence of values produced by iterating the\
    \ equation grows towards infinity, a point is considered *outside* the set. Conversely,\
    \ if the values taken by the equation remain bounded, the *point is in* the set.\n\
    \nComputationally, the iterative equation in question is remarkably simple, as\
    \ shown in Equation 4.1.\n\nEquation 4.1\n$Z_{n+1} = Z_n^2 + C$\n\nComputing an\
    \ iteration of Equation 4.1 would therefore involve squaring the current value\
    \ and adding a constant to the next value of the equation.\n\nCPU JULIA SET\n\
    We will examine a source listing now that will compute and visualize the Julia\
    \ Set. Since this is a more complicated program than we have studied so far, we\
    \ will split it into two pieces here. Later in the chapter, you will see the entire\
