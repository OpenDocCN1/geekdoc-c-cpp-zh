    | 4. Thread B reads the value in x. | B reads 8 from x. |

    | 5. Thread B adds 1 to the value it read. | B computes 9. |

    | 6. Thread B writes the result back to x. | x <- 9. |


    Since x starts with the value 7 and gets incremented by two threads, we would
    expect it to hold the value 9 after they''ve completed. In the previous sequence
    of operations, this is indeed the result we obtain. Unfortunately, there are many
    other ordering of these steps that produce the wrong value. For example, consider
    the ordering shown in Table 9.3 where thread A and thread B''s operations become
    interleaved with each other.


