    GPU Gems, GPU Gems 2, and GPU Gems 3 are compilations of contributed chapters
    covering practical real-time graphics techniques arising from the research and
    practice of cutting-edge developers. They focus on the programmable graphics pipeline
    available in their GPUs and highlight quick-and-dirty visual tricks used by leading
    developers, as well as fundamental, performance-conscious techniques for creating
    advanced visual effects. GPU Gems, GPU Gems 2, and GPU Gems 3 provide a comprehensive
    guide to taking advantage of the power of the new generation of GPUs.


