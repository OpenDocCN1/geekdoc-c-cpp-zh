    the fact that only one thread can safely make modifications to a bucket at a time.
    This is similar to our dot product example where only one thread at a time could
    safely add its value to the final result. If each bucket had an atomic lock associated
    with it, we could ensure that only a single thread was making changes to a given
    bucket at a time.


