    we make in CUDA C are actually asynchronous. For example, when we launched the
    kernel in our ray tracer, the GPU begins executing our code, but the CPU continues
    executing the next line of our program before the GPU finishes. This is excellent
    from a performance standpoint because it means we are computing something on the
    GPU and calls to at the same time, but conceptually it makes timing tricky.


    You should imagine calls to cudaEventRecord() as an instruction to record the
    current time being placed into the pending queue of work. As a result, our event
    won''t actually be recorded until the GPU finishes everything prior to the call
    to cudaEventRecord(). In terms of having our stop event measure the correct time,
    this is precisely what we want. But we cannot safely read the value of the stop
    event until the GPU has completed its prior work and recorded the stop event.
    Fortunately, we have a way to instruct the CPU to synchronize on an event, the
    API function cudaEventSynchronize():


    ```

    cudaEvent_t start;

    cudaEventCreate(&start);

    cudaEventCreate(&stop);

    cudaEventRecord(start, 0);


    // do some work on the GPU


    cudaEventRecord(stop, 0);

    cudaEventSynchronize( stop );

    ```


    We have instructed the runtime to block further instruction until the GPU has
    reached the stop event. When the call to cudaEventSynchronize() returns'
