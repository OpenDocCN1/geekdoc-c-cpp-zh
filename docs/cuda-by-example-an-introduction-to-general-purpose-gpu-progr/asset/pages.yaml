  md: "The highlighted line represents the way we use atomic operations in CUDA C.\n\
    The call atomicAdd(addr, y); generates an atomic sequence of operations that read\
    \ the value at address addr, adds y to that value, and stores the result back\
    \ to the memory address. The hardware guarantees that no other thread can read\
    \ or write the value at address addr while we perform these operations, ensuring\
    \ predictable results. In our example, the answer in question is the location\
    \ of the histogram bin that corresponds to the current byte. If the current byte\
    \ is buffer[i], just like we we saw in the CPU version, the corresponding histogram\
    \ bin is histo[buffer[i]]. The atomic operation needs the address of this bin,\
    \ so the first argument is therefore &histo[buffer[i]].\\Since we simply want\
    \ to increment the value in that bin by one, the second argument is 1.\n\nSo after\
    \ that hullabalao, our GPU histogram computation is fairly similar to the corresponding\
    \ CPU version.\n\n```\n#include \"../common/book.h\"\n\n#define SIZE (100*1024*1024)\n\
    \n__global void histogram_kernel(unsigned char *buffer,\n    long size,\n    unsigned\
    \ int *histo ) {\n    int i = threadIdx.x + blockIdx.x * blockDim.x;\n    int\
    \ stride = blockDim.x * gridDim.x;\n    while (i < size) {\n        atomicAdd(&histo[buffer[i]],\
    \ 1);\n        i += stride;\n    }\n}\n```\n\nHowever, we need to save the celebrations\
    \ for later. After running this example, we discover that a GeForce GTX 285 can\
    \ construct a histogram from 100MB input data in 1.752 seconds. If you read the\
    \ section on CPU-based histograms, you will realize that this performance is terrible.\
    \ In fact, this is more than four times slower than the CPU version! But this\
    \ is why we always measure our baseline performance. It would be a shame to settle\
    \ for such a low-performance implementation simply because it runs on the GPU."
