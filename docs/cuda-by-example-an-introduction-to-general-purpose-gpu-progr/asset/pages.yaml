  md: "# TEXTURE MEMORY\n\nThe first three lines should look familiar. The first two\
    \ lines convert a thread's threadIdx and blockIdx into an x- and a y-coordinate.\
    \ The third line computes a linear offset into our constant and input buffers.\
    \ The highlighted line performs the copy of the heater temperature in cptr[] to\
    \ the input grid iptr[]. Notice that the copy is performed only if the cell in\
    \ the grid is nonzero. We do this to preserve any values that were computed in\
    \ the previous time step within cells that do not contain heaters. Cells with\
    \ heaters will have nonzero entries in cptr[] and will therefore have their temperatures\
    \ preserved from step to step thanks to this kernel.\n\nStep 2 of the algorithm\
    \ is the most computationally involved. To perform the updates, we can have each\
    \ thread responsibility for a single cell in our simulation. Each thread will\
    \ read each cell's temperature and the temperatures of its neighboring cells,\
    \ perform the previous update computation, and update its temperature with the\
    \ new value. Much of this kernel resembles techniques you've used before.\n\n\
    ```\n__global_ void blend_kernel( float *outSrc, \n    const float *inSrc ) {\n\
    \    // map from threadIdx/blockIdx to pixel position\n    int x = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n    int y = threadIdx.y + blockIdx.y * blockDim.y;\n\
    \    int offset = x + y * blockDim.x * gridDim.x;\n\n    int left = offset - 1;\n\
    \    int right = offset + 1;\n    if (x == 0) left++;\n    if (x == DIM-1) right--;\n\
    \n    int top = offset - DIM;\n    int bottom = offset + DIM;\n    if (y == 0)\
    \ top += DIM;\n    if (y == DIM-1) bottom -= DIM;\n\n    outSrc[offset] = inSrc[offset]\
    \ + SPEED * ( inSrc[top] + \n        inSrc[bottom] + inSrc[left] + inSrc[right]\
    \ - \n        inSrc[offset]*4);\n}\n```"
