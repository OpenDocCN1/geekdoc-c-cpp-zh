    textures on a case-by-basis.


    # Chapter Review


    As we saw in the previous chapter with constant memory, some of the benefit of
    texture memory comes as the result of on-chip caching. This is especially noticeable
    in applications such as our heat transfer simulation: applications that have some
    coherence to their data access patterns. We saw how one- or two-dimensional textures
    can be used, both having similar performance characteristics. With a block or
    grid shape, the choice of one- or two-dimensional is largely one of convenience.
    Since the code became somewhat cleaner when we switched to two-dimensional textures
    and the borders are handled automatically, we would proudly advocate the use of
    a 2D texture in our heat transfer application. But as you saw, it will work fine
    here ever.


    Texture memory can provide additional speedups if we utilize some of the textures
    that texture samplers can perform automatically, such as unpacking data into separate
    variables or converting 8- and 16-bit integers to normalized floating-point numbers.
    We didn''t explore either of these capabilities in the heat transfer application,
    but they might be useful to you!'
