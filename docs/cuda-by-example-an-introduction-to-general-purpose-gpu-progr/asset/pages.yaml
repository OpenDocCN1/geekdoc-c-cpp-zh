  md: 'Likewise, cudaD3D10SetDirect3DDevice() enables a device for Direct3D 10 interoperation
    and cudaD3D11SetDirect3DDevice() for Direct3D 11.


    The details of DirectX interoperability probably will not surprise you if you
    worked through this chapter''s OpenGL examples. But if you want to use DirectX
    interoperation and want a small project to get started, we suggest that you migrate
    this chapter''s examples to use DirectX. To get started, we recommend using the
    NVIDIA CUDA Programming Guide for a reference on the API and taking a look at
    the GPU Computing SDK code samples on DirectX interoperability.


    # 8.6 Chapter Review


    Although much of this book has been devoted to the GPU for parallel, general-purpose
    computing, we can''t forget the GPU''s successful day job as a rendering engine.
    Many applications require or benefit from the use of standard computer graphics
    rendering. Since the GPU is master of the rendering domain, all that stood between
    us and the exploitation of these resources was a lack of understanding of the
    mechanics in convincing the CUDA runtime and graphics drivers to operate. Now
    that we have seen how this is done, we no longer need the host to intervene in
    displaying the graphical results of our computations. This simultaneously accelerates
    the application''s rendering loop and frees the host to perform other computations
    in the meantime. Otherwise, if there are no other computations to be performed,
    it leaves our system responsive to other events or applications.


    There are many other ways to use graphics interoperability we left unexplored.
    We looked primarily at using a CUDA C kernel to write a pixel buffer object for
    display in a window. This image data can also be used as a texture that can be
    applied to any surface in the scene. In addition to modifying pixel buffer objects,
    you can also use vertex buffer objects between CUDA and the graphics engine. Among
    other things, this allows you to write CUDA kernels that perform collision detection
    between objects or compute vertex displacement maps to be used to render objects
    or surfaces that interact with the user or their surroundings. If you''re interested
    in computer graphics, CUDA C''s graphics interoperability API enables a slew of
    new possibilities for your applications!'
