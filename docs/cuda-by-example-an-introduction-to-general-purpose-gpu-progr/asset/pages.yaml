  md: '# Chapter 6


    # Constant Memory and Events


    We hope you have learned much about writing code that executes on the GPU. You
    should know how to spawn parallel blocks to execute your kernels, and you should
    know how to further split these blocks into parallel threads. You have also seen
    ways to enable communication and synchronization between these threads. But since
    the book is not over yet, you may have guessed that CUDA C has even more features
    that might be useful to you.


    This chapter will introduce you to a couple of these more advanced features. Specifically,
    there exist ways in which you can exploit special regions of memory on your GPU
    in order to accelerate your applications. In this chapter, we will discuss one
    of these regions of memory: constant memory. In addition, because we are looking
    at our first method for enhancing the performance of your CUDA C applications,
    you will also learn how to measure the performance of your applications using
    CUDA events. From these measurements, you will be able to quantify the gain (or
    loss!) from any enhancements you make.'
