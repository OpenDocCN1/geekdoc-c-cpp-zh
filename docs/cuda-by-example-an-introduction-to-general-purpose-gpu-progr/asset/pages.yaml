  md: 'Given what we know about the distribution of words in the English language,
    this hash function leaves much to be desired because it will not map words uniformly
    across the 26 buckets. Some of the buckets will contain very few key/value pairs,
    and some of the buckets will contain a large number of pairs. Accordingly, it
    will take much longer to find the value associated with a word that begins with
    a common letter as S than it would to find the value associated with a word that
    begins with the letter X. Since we are looking for hash functions that will give
    us constant-time retrieval of any value, this consequence is fairly undesirable.
    An amount of research has gone into the study of hash functions, but even a brief
    survey of these techniques is beyond the scope of this book.


    The last component of our hash table data structure involves the buckets. If we
    had a perfect hash function, every key would map to a different bucket. In this
    case, we can simply store the key/value pairs in an array where each entry in
    the array is what we''ve been calling a bucket. However, even with an excellent
    hash function, in most situations we have to deal with collisions. A collision
    occurs when more than one key maps to a bucket, such as when we add both the words
    *avocado* aardvard* to our dictionary hash table. The simplest way to store all
    of the values that map to a given bucket is to maintain a list of values in the
    bucket. When we encounter a collision, such as adding *aardvard* to a dictionary
    that already contains *avocado*, we put the value associated with *aardvard* at
    the end of the list we''re maintaining in the “A” bucket, as shown in Figure A.2.


    After adding the word *avocado* in Figure A.2, the first bucket has a single key/value
    pair in its list. Later in this imaginary application we add the word *aardvard*,
    a word that collides with *avocado* because they both start with the letter A.
    You will notice in Figure A.3 that it simply gets placed at the end of the list
    in the first bucket:


