  md: 'The opposite of a synchronous function is an asynchronous function, which inspired
    the name cudaMemcpyAsync(). The call to cudaMemcpyAsync() simply places a request
    to perform a memory copy into the stream specified by the argument stream. When
    the call returns, there is no guarantee that the copy has even started yet, much
    less that it has finished. The guarantee that we have is that the copy will definitely
    be performed before the next operation placed into the same stream. It is required
    that any host memory passed to cudaMemcpyAsync() be allocated by cudaHostAlloc().
    That is, you are only allowed to schedule asynchronous copies to or from paglocked
    memory.


    Notice the angle-bracketed kernel launch also takes an optional stream argument.
    This kernel launch is asynchronous, just like the preceding two memory copies
    to the GPU and the trailing memory copy from the GPU. Technically, we can end
    an iteration of this loop without having actually started any of the memory copies
    or kernel execution. As we mentioned, all we are guaranteed is that the first
