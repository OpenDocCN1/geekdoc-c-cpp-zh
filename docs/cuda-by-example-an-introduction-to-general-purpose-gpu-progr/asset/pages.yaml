- img_proc: true
  md: '# STREAMS


    invocations. However, the hardware has no notion of streams. Rather, it has one
    or more engines to perform memory copies and an engine to execute kernels. These
    engines queue commands independently from each other, resulting in a task-scheduling
    scenario like the one shown in Figure 10.2. The arrows in the figure illustrate
    how operations that have been queued into streams get scheduled on the hardware
    engines that actually execute them.


    So, the user and the hardware have somewhat orthogonal notions of how to queue
    GPU work, and the burden of keeping both the user and the hardware sides of this
    equation falls upon the CUDA driver. First and foremost, there are important dependencies
    specified by the order in which operations are added to streams. For example,
    in Figure 10.2, stream 0''s memory copy of A needs to be completed before its
    memory copy of B, which in turn needs to be completed before kernel A is launched.
    But once these operations are placed into the hardware-s copy engine and engine
    queues, these dependencies are lost, so the CUDA driver needs to keep everyone
    happy by ensuring that the intrastream dependencies remain satisfied by the hardware''s
    execution units.


    | Stream 0 | Copy Engine |

    |---|---|

    | memcpy A | memcpy A |

    | memcpy B | memcpy B |

    | kernel A | memcpy C |

    | memcpy C | memcpy B |

    | Stream 1 | Kernel Engine |

    | memcpy A | kernel A |

    | memcpy B | |

    | kernel A | |

    | memcpy C | kernel A |


    Figure 10.2 Mapping of CUDA streams onto GPU engines'
