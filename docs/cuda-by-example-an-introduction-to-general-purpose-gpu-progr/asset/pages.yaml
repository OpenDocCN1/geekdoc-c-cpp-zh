  md: '# Chapter 11


    # CUDA C on nMultiple GPUs


    There is an old saying that goes something like this: "The only thing better than
    computing on a GPU is computing on two GPUs." Systems containing multiple graphics
    processors have become more and more common in recent years. Of course, in some
    ways multi-GPU systems are similar to multi-CPU systems in that they are still
    far from the common system configuration, but it has gotten quite easy to end
    up with more than one GPU in your system. Products such as the GeForce GTX 295
    contains two GPUs on a single card. NVIDIA''s Tesla S1070 contains a whopping
    four CUDA-capable graphics processors in it. Systems built around a NVIDIA chipset
    will have an integrated, CUDA-capable GPU on the motherboard. Adding a discrete
    NVIDIA GPU in one of the PCI Express slots will make this system multi-GPU. Neither
    of these scenarios is very farfetched, so we would be best served by learning
    to exploit the resources of a system with multiple GPUs in it.'
