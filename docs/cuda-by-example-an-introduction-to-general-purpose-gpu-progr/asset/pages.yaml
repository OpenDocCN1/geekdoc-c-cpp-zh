  md: "# 7.3.2 COMPUTING TEMPERATURE UPDATES\n\nWe will cover the specifics of each\
    \ step in a moment, but at a high level, our update process proceeds as follows:\n\
    \n+   1. Given some grid of input temperatures, copy the temperature of cells\
    \ with heaters to this grid. This will overwrite any previously computed temperatures\
    \ in these cells, thereby enforcing our restriction that \"heating cells\" remain\
    \ at a constant temperature. This copy gets performed in copy_const_kernel().n2.\
    \ Given the input temperature grid, compute the output temperatures based on the\
    \ update in Equation 7.2. This update gets performed in blend_kernel().n3. Swap\
    \ the input and output buffers in preparation of the next time step. The output\
    \ temperature grid computed in step 2 will become the input temperature grid that\
    \ we start with in step 1 when simulating the next time step.\n\nBefore beginning\
    \ the simulation, we assume we have generated a grid of constants. Most of the\
    \ entries in this grid are zero, but some contain nonzero temperatures that represent\
    \ heaters at fixed temperatures. This buffer of constants will not change over\
    \ the course of the simulation and gets read at each time step.\n\nBecause of\
    \ the way we are modeling our heat transfer, we start with the output grid from\
    \ the previous time step. Then, according to step 1, we copy the temperatures\
    \ of the cells with heaters into this output grid, overwriting any previously\
    \ computed temperatures. We do this because we have assumed that the temperatures\
    \ of these heater cells remain constant. We perform this copy of the constant\
    \ grid onto the input grid with the following kernel:\n\n```\n__global void copy_const_kernel(float\
    \ *iptr, const float *cptr) {\n    // map_from threadIdx/blockIdx to pixel position\n\
    \    int x = threadIdx.x + blockIdx.x * blockDim.x;\n    int y = threadIdx.y +\
    \ blockIdx.y * blockDim.y;\n    int offset = x + y * blockDim.x * gridDim.x;\n\
    \n    if (cptr[offset] !== 0) iptr[offset] = cptr[offset];\n}\n```"
