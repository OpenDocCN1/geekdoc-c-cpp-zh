  md: '# 11.4 Portable Pinned Memory


    The last important piece of using multiple GPUs involves the use of pinned memory.
    We learned in Chapter 10 that pinned memory is actually host memory that has its
    pages locked in physical memory to prevent it from being paged out or relocated.
    However, it turns out that pages can appear pinned to a single CPU thread only.
    That is, they will remain-locked if any thread has allocated them as pinned memory,
    but they will only appear page-locked to the thread that allocated them. If the
    pointer to this memory is shared between threads, the other threads will see the
    buffer as standard, pageable data.


    As a side effect of this behavior, when a thread that did not allocate a pinned
    buffer attempts to perform a `cudacpy()` using it, the copy will be performed
    at standard pageable memory speeds. As we saw in Chapter 10, this can be roughly
    50 percent of the maximum attainable transfer speed. What''s worse, if the thread
    attempts to enqueue a `cudacpyAsync()` call into a CUDA stream, this operation
    will fail because it requires a pinned buffer to proceed. Since the buffer appears
    pageable from the thread that did not allocate it, the call dies a deathly error.
    In the future months


    But there is a remedy to this problem. We can allocate pinned memory as `portable`,
    meaning that we will be allowed to migrate it between host threads and allow any
    thread to view it as a pinned buffer. To do so, we use our trusty `cudaHostAlloc()`
    to allocate the memory, and we call it with a new flag: `cudaHostAllocPortable`.
    This flag can be used in concert with other flags such as `cudaHostAllocWriteCombined`
    and `cudaHostAllocMapped`. This means that you can allocate your host buffers
    as any combination of portable, zero-copy and write-combined.


    To demonstrate portable pinned memory, we will enhance our multi-GPU dot application.
    We''ll adapt our original zero-copy version of the dot product, as this version
    begins as something of a mash-up of the zero-copy and multi-GPU versions. As we
    have noted throughout this chapter, we need to verify that there are at least
    two CUDA-capable GPUs and that both can handle zero-copy buffers.'
