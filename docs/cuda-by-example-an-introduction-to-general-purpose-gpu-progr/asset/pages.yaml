    that this device is the best or fastest GPU, nor is there a guarantee that the
    device will be the same GPU from version to version of the CUDA runtime.


    If the result of device selection is so seemingly underwhelming, why do we bother
    with this effort to fill a cudaDeviceProp structure and cudaChooseDevice() to
    get a valid device ID? Furthermore, we have never bothered with this foolery,
    so why now? These are good questions. It turns out that we need to know the CUDA
    device ID so that we can tell the CUDA runtime that we intend to use the device
    for CUDA and OpenGL. We achieve this with a call to cudaGetSetGLDevice(), passing
    the device ID we obtained from cudaChooseDevice().


    ```

    HANDLE ERROR = cudaSetGLDevice( dev );

    ```


    After the CUDA runtime initialization, we can proceed to initialize the OpenGL
    driver by calling our GL Utility Toolkit (GLUT) setup functions. This sequence
    of calls should look relatively familiar if you''ve used GLUT before:


    ```

    // GLUT calls need to be before the other GL calls

    glutInit(&argc, argv);

    glutInitDisplayMode(GLUT_DOUBLE | GLUT_RGBA);

    glutInitWindowSize(DIM, DIM);

    glutCreateWindow("bitmap");

    ```


    At this point we have prepared our CUDA runtime to play nicely with the OpenGL
    driver by calling cudaSetGLDevice(). Then we initialized GLUT and created a window
    named "bitmap" to draw our surfaces. We can now get to the actual OpenGL interoperation!


    Shared data buffers are the key component to interoperation between CUDA kernels
    and OpenGL rendering. To pass data between OpenGL and CUDA, we will first need
    to create a buffer that can be used with both APIs. We start this process by creating
    a pixel buffer object in OpenGL and storing the handle in our global variable
    int bufferObj;


    ```

    glGenBuffers(1, &bufferObj);

    glBindBuffer(GL_PIXEL_UNPACK_BUFFER, bufferObj);

    glBufferData(GL_PIXEL_UNPACK_BUFFER, DIM * DIM * 4, NULL, GL_DYNAMIC_DRAW);

    ```'
