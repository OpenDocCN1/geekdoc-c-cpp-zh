  md: "Since we do very little work in the kernel, it is quite like that the atomic\
    \ operation is causing the problem. Essentially, when thousands of threads are\
    \ trying to access a handful of memory locations, a great deal of contention for\
    \ our 256 histogram bins can occur. To ensure atomicity of the increment operations,\
    \ the hardware needs to serialize operations to the same memory location. This\
    \ can result in a long queue of pending operations, and any performance gain we\
    \ might have had will vanish. We will need to improve the algorithm itself in\
    \ order to recover this performance.\n\n# HISTOGRAM KERNEL USING SHARED AND GLOBAL\
    \ MEMORY ATOMICS\n\nIronically, despite the atomic operations cause this performance\
    \ degradation, alleviating the slowdown actually involves using *more* atomics,\
    \ not fewer. The core problem was not the use of atomics so much as the fact that\
    \ threads were competing for access to a relatively small number of memory addresses.\
    \ To address this issue, we will split our histogram computation into two phases.\n\
    \nIn phase one, each parallel block will compute a separate histogram of the data\
