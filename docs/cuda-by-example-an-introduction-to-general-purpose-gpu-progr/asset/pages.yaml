  md: "# 5.3 SHARED MEMORY AND SYNCHRONIZATION\n\nis inside a conditional block like\
    \ an if(). Obviously not every thread should execute that instruction, right?\
    \ For example, consider a kernel that contains the following fragment of code\
    \ that intends for odd-indexed threads to update the value of some variable:\n\
    \n```\nint myVar = 0;\nif( threadIdx.x % 2 )\n    myVar = threadIdx.x;\n```\n\n\
    But in the case of __synctreads(), the result is somewhat tragic. The CUDA Architecture\
    \ guarantees that no thread will advance to an instruction beyond the __synctreads()\
    \ until every thread in the block has executed the __synctreads(). Unluckily,\
    \ if the __synctreads() sits in a divergent branch, some of the threads will never\
    \ reach the __synctreads(). Therefore, because of the guarantee that no instruction\
    \ after a __synctreads() can be executed before every thread has executed it,\
    \ the hardware simply continues to wait for these threads. And and waits. Forever.\n\
    \nThis is the situation in the dot product example when we move the __synctreads()\
    \ call inside the if(). Any thread with cacheIndex greater than equal to i will\
    \ never execute the __synctreads(). This effectively hangs the processor because\
    \ it results in the GPU waiting for something that will never happen.\n\n```\n\
    if (cacheIndex < i) {\n    cache[cacheIndex] += cache[cacheIndex + i];\n    __synctreads();\n\
    }\n```"
