  md: '# A.2.1 HASH TABLE OVERVIEW


    A hash table is essentially a structure that is designed to store pairs of keys
    and values. For example, you could think of a dictionary as a hash table. Every
    word in the dictionary is a key, and each word has a definition associated with
    it. The defi-n is the value associated with the word, and thus every word and
    definition in the dictionary form a key/value pair. For this data structure to
    be useful, though, it is important that we minimize the time it takes to find
    a particular value if we''re given a key. In general, this should be a constant
    amount of time. That is, the time to look up a value given a key should be the
    same, regardless of how many key/value pairs are in the hash table.


    At an abstract level, our hash table will place values in “buckets” based on the
    value’s corresponding key. The method by which we map keys to buckets is often
    called the hash function. A good hash function will map the set of possible keys
    uniformly across all the buckets because this will help satisfy our requirement
    that it take constant time to find any value, regardless of the number of values
    we''ve added to the hash table.


    For example, consider our dictionary hash table. One obvious hash function would
    involve using 26 buckets, for each letter of the alphabet. This simple hash function
    might simply look at the first letter of the key and put the value in one of the
    26 buckets based on this letter. Figure A.1 shows how this hash function would
    assign few sample words.


    # Hash Buckets


    | | A |

    |---|---|

    | Camera | B |

    | Avocado | C |

    | Baseball | D |

    | Grasshopper | E |

    | Electrical | F |

    G | |

    H |


    Figure A.1 Hashing of words into buckets'
