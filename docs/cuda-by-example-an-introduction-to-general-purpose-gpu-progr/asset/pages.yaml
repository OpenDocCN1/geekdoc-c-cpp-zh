    \ contains the sum produced by one of the parallel blocks. The last step of the\
    \ dot product is to sum the entries of c[]. Even the dot product is not fully\
    \ computed, we exit the kernel and return control to the host at this point. But\
    \ why do we return to the host before the computation is complete?\n\nPreviously,\
    \ we referred to an operation like a dot product as a reduction. Roughly speaking,\
    \ this is because we produce fewer output data elements than input. In the case\
    \ of a dot product, we always produce exactly one output, regardless of the size\
    \ of our input. It turns out that a massively parallel machine like a GPU tends\
