  md: '# 10.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   * You will learn about allocating page-locked host memory.

    * You will learn what CUDA streams are.

    * You will learn how to use CUDA streams to accelerate your applications.


    # 10.2 Page-Locked Host Memory


    In every example over the course of nine chapters, you have seen allocate memory
    on the GPU with `malloc()`. On the other, we have always allocated memory with
    the vanilla, C library `malloc()`. However, the CUDA runtime offers its mechanism
    for allocating host memory: `cudaHostAlloc()`. Why would you bother using this
    when `malloc()` has served you well since day one of your life as a C programmer?


    In fact, there is a significant difference between the memory that `malloc()`
    will allocate and the memory that `cudaHostAlloc()` allocates. The C library function
    `malloc()` allocates standard, pageable host memory, while `cudaHostAlloc()` allocates
    a buffer of page-locked host memory. Sometimes pinned memory, page-locked buffers
    guarantees that it will never page this memory out to disk, which ensures its
    residency in physical memory. The corollary to this is that it becomes safer for
    the OS to allow an access to the physical address of the memory, since the buffer
    will not be evicted or relocated.


    Knowing the physical address of a buffer, the GPU can use direct memory access
    [DMA] Since DMA copies proceed without intervention from the CPU, it also means
    that the CPU could be simultaneously paging these buffers out to disk or relocating
    their physical address by updating the operating system''s pagables. The possibility
    of the CPU moving pageable data means that using pinned memory for a DMA copy
    is essential. In fact, even when you attempt to perform a memory copy with pageable
    memory, the CUDA driver still uses DMA to transfer the buffer to the GPU. Therefore,
    your copy'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'happens twice, first from a pageable system buffer to a page-locked “staging”
    buffer and then from the page-locked system buffer to the GPU.


    As a result, whenever you perform memory copies from pageable memory, you guarantee
    that the copy speed is bounded by the lower of the PCIE transfer speed and the
    system front-side bus speeds. A large disparity in bandwidth between these buses
    in some systems ensures that page-locked host memory enjoys roughly a twofold
    performance advantage over pageable memory when used for copying data between
    the GPU and the host. But even in a world where PCI Express and front-side bus
    speeds were identical, pageable buffers would still incur the overhead of an additional
    CPU-managed copy.


    However, you should resist the temptation to simply search a-and-replace malloc
    to convert every one of your calls cudaHostAlloc(). Using pinned memory is a double-edged
    sword. By doing so, you have effectively opted out of all the nice features of
    virtual memory. Specifically, the computer running the application needs to have
    available physical memory for every page-locked buffer, since these buffers means
    your system will run out of memory much faster than if you wanted to use standard
    cudaAlloc(). Only does this mean that your application might start to fail on
    machines with smaller amounts of physical memory, but it means that your application
    can affect the performance of other applications running on the system.


    These warnings are not meant to scare you out of using cudaHostAlloc(), by you
    should remain aware of the implications of page-locking buffers. We suggest trying
    to restrict their use to memory that will be used as a source or destination in
    calls cudaMemcpy() and freeing them when they are longer needed rather than waiting
    until application shutdown to release the memory. The use of cudaAlloc() should
    be no more difficult than anything you''ve studied so far, but let''s take a look
    at an example that will illustrate how pinned memory is allocated and its performance
    advantage over standard pageable memory.


