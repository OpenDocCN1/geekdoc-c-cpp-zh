    zero threads. In fact, we will launch too few threads whenever N is not an exact
    multiple of 128. This is bad. We actually want this division to round up.


    There is a common trick to accomplish this in integer division without calling
    ceil(N). We actually compute (N+127)/128 instead of N/128. Either you can take
    our word that will compute the smallest multiple of 128 greater than or equal
    to N or you can take a moment now to convince yourself of this fact.


    We have chosen 128 threads per block and therefore use the following kernel launch:


    ```

    add<<< (N+127)/128, 128 >>>( dev_a, dev_b, dev_c );

    ```


    Because of our change to the division that ensures we launch enough threads, we
    will now launch too many threads when N is not an exact multiple of 128. But there
    is a simple remedy to this problem, and our kernel already takes care of it. We
    have to check whether a thread''s offset is actually between 0 and N before we
    use it to access input and output arrays:


    ```

    if (tid < N)

    c[tid] = a[tid] + b[tid];

    ```


    Thus, when our index overshoots the end of our array, as will always happen when
    we launch a nonmultiple of 128, we automatically refrain from performing the calculation.
    More important, we refrain from reading and writing memory off the end of our
    array.


    # GPU SUMS OF ARBITRARILY LONG VECTORS


    We were not completely forthcoming when we first launching parallel blocks on
    a GPU. In addition to the limitation on thread count, there is also a hardware
    limitation on the number of blocks (albeit greater than the thread limitation).
    As we''ve mentioned previously, neither dimension of a grid of blocks may exceed
    65,535.


    So, this raises a problem with our current vector addition implementation. If
    we launch N/128 blocks to add our vectors, we will hit failures when our vectors
    exceed 65,535 * 128 = 8,338,480 elements. This seems like a large number, but
    with current memory capacities between 1GB and 4GB, the high-end graphics processors
    can hold orders of magnitude more data than vectors with 8 million elements.'
