  md: '# INTRODUCTION TO CUDA


    The more interesting addition is the allocation of memory using cudaMalloc().
    This call behaves very similarly to the standard C malloc(), but it tells the
    CUDA runtime to allocate the memory on the device. The first argument is a pointer
    to what you hold the address of the newly allocated memory, and the second parameter
    is the size of the allocation you want to make. Besides that your allocated memory
    pointer is not the function''s return value, this is identical behavior to malloc(),
    down to the void* return type. The HANDLE_ERROR() that surrounds these calls is
    a utility macro that we have provided as part of this book''s support code. It
    simply detects that the call has returned an error, prints the associated error
    message, and exits the application with EXIT_FAILURE error. Although you are free
    to use this code in your own applications, it is highly likely that this error-handling
    code will be insufficient in production code.


    This raises a subtle but important point. Much of the simplicity and power of
    CUDA derives from the ability to blur the line between host and device code. However,
    it is the responsibility of the programmer not to dereference the pointer returned
    by cudaMalloc() from code that executes on the host. Host code may pass this pointer
    around, perform arithmetic on it, or even cast it to a different type. You cannot
    use it to read or write from


    Unfortunately, the compiler cannot protect you from this mistake, either. It will
    be perfectly happy to allow dereferences of device pointers in your host code
    because it likes any other pointer in the application. We can summarize the restrictions
    on the usage of device pointer as follows:


    +   You can pass pointers allocated with cudaMalloc() to functions that execute
    on the device.


    +   You can use pointers allocated with cudaMalloc() to read or write memory from
    code that executes on the device.


    +   You can pass pointers allocated with cudaMalloc() to functions that execute
    on the host.


    +   You cannot use pointers allocated with cudaMalloc() to read or write memory
    from code that executes on the host.


    If you''ve been reading carefully, you might have anticipated the next lesson:
    We can''t use standard C''s free() function to release memory we''ve allocated
    with cudaMalloc(). To free memory we''ve allocated with cudaMalloc(), we need
    to use a call to cudaFree(), which behaves exactly like free() does.'
