  md: 'on Linux operating systems, while Microsoft Visual C compiles it to run on
    Windows systems. The NVIDIA tools simply feed this host compiler your code, and
    everything behaves as it would in a world without CUDA.


    Now we see that CUDA C adds the `global` qualifier to standard C. This mechanism
    alerts the compiler that a function should be compiled on a device instead of
    the host. In this simple example, nvcc gives the function `kernelI()` to the compiler
    that handles device code, and it feeds `main()` to the host compiler as it did
    in the previous example.


    So, what is the mysterious call to `kernelI()`, and why we vandalize our standard
    C with angle brackets and a numeric tuple? Brace yourself, because this is where
    the magic happens.


    We have seen that CUDA C needed a linguistic method for marking function device
    code. There is nothing special about this; is shorthand to send host code to one
    compiler and device code to another compiler. The trick is actually in calling
    the device code from the host. One of the benefits of CUDA C is that it provides
    this language integration so that device function calls look very like host function
    calls. Later we will discuss what actually happens behind the scenes, but suffice
    to say that the CUDA compiler and runtime take care of the messy business of invoking
    device code from the host.


    So, the mysterious-looking call invokes device code, but why the angle brackets
    and numbers? The angle brackets denote arguments we plan to pass to the runtime
    system. These are not arguments to the device code but are parameters that will
    influence the runtime launch our device code. We will learn about these parameters
    to the runtime in the next chapter. Arguments to the device code itself get passed
    within the parentheses, just like any other function invocation.


