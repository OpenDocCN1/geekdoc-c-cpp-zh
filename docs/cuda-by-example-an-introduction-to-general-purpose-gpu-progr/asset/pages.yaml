  md: '# 11.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn how to allocate and use zero-copy memory.

    - You will learn how to use multiple GPUs within the same application.

    - You will learn how to allocate and use portable pinned memory.


    # 11.2 Zero-Copy Host Memory


    In Chapter 10, we examined pinned or page-locked memory, a new type of host memory
    that came with the guarantee that the buffer would never be swapped out of physical
    memory. If you recall, we allocated this memory by making a call to cudaHostAlloc()
    and passing cudaHostAllocDefault to get default, pinned promised that in the next
    chapter, you would see more exciting means by which you can allocate pinned memory.
    Assuming that this is the only reason you''ve continued reading, you will be glad
    to know the wait is over. The flag cudaHostMapped can be passed instead of cudaHostAllocDefault.
    The host memory allocated using cudaHostMapped is pinned in the same sense that
    memory allocated with cudaHostAllocDefault is pinned, specifically that it cannot
    be paged out or relocated within physical memory. In addition to using this memory
    from the host for memory copies and from the GPU, this new kind of host memory
    allows us to violate one of the first rules we presented in Chapter 3 concerning
    host memory: We can access this host memory directly from within CUDA kernels.
    This memory does not require copies to and from the GPU, refer to it as zero-copy
    memory.


    # 11.2.1 ZERO-COPY DOT PRODUCT


    Typically, our GPU accesses only GPU memory, and our CPU accesses only host memory.
    But in some circumstances, it''s better to break these rules. To see an instance
    where it''s better to have the GPU manipulate host memory, we will revisit our
    favorite reduction: the vector dot product. If you''ve managed to read this entire
    book, you may recall our first attempt at the dot product. We copied the input
    vectors to the GPU, performed the computation, copied the intermediate results
    back to the host, and completed the computation on the CPU.'
