  md: '# Chapter 2


    # Getting Started


    We hope that Chapter 1 has gotten you excited to get started learning CUDA C.
    Since this book intends to teach you the language through a series of coding examples,
    you''ll need a functioning development environment. Sure, you could stand on the
    sideline and watch, but we think you''ll have more fun and stay interested longer
    if you jump in and get some practical experience hacking CUDA C code as soon as
    possible. In this vein, this chapter will walk you through some of the hardware
    and software components you''ll need in order to get started. The good news is
    that you can obtain all of the software you''ll need for free, leaving you more
    money for whatever tickles your fancy.'
