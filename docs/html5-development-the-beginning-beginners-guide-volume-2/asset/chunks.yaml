    many different pages covering a wide variety of information. The convenience of
    being able to link to other pages provides you many benefits as a site creator.
    There are many reasons why you might want to add links to your page. We will cover
    a few of them here.  However, I encourage you to use your imagination and think
    of the numerous ways that you can incorporate links into your web designs. Adding
    links can support your content and provide a rich, unique and tailored experience
    to your visitors.


    To add a link, you will use an <a> tag with a special attribute. <a>  is an abbreviation
    for anchor. Often, as you will see in the following example, your link tags will
    live inside of other tags like <h1>, or <p>, or <ul>.


    The typical anchor element starts with an opening <a> tag and will have a href
    attribute. The attribute href is short for hypertext reference.  It will have
    a universal resource locator, or url. This is the website or link address. The
    second part of the element will have the text that will be rendered to the webpage
    and contain the link. This means the link text is clickable and houses the url
    that will take the visitor where they intended to go by clicking on the link.


    Here is an example of what a link in HTML looks like:


    Code Sample: Basic link structure


    <a href="url">link text</a>


    If, for example, I wanted to link to Yahoo.com, I could build the  element below.


    Code Sample: Basic link structure


    <a href="http://www.yahoo.com">Click here to go to Yahoo.com</a>


    Let’s look at the process of building a link element. Refer to the preceding code
    sample, as I outline the steps below.


    1.  Open the element with an <a tag


    2.  Add the href= attribute, and then, in quotes, add the url or address for the
    site you want to link to, exactly as we have done above.


    3.  Close the link portion with a >


    4.  Add the text the user will click to activate the link


    5.  Add a closing </a> tag


    While there seems to be more going on in a link element than we have seen in the
    other elements we have covered thus far,  you will always follow the same structure.
    With a little practice, you will have this new skill mastered and be able to take
    advantage of the full power of the web by linking to other HTML documents across
    the world.


    Now, let’s get more practice by adding a few links to our personal profile. In
    this section, I will also show you one or two unique functions that can improve
    the sophistication and functionality of your website.


    First, assume that we want to be able to share more information about where we
    grew up. It would be impractical to add a great deal of information about this
    since the purpose of this page is to share information about us. However, some
    visitors might be curious, and might want additional information. By providing
    them with a link, you can offer them the chance to learn more, while not taking
    up precious space on your page for those with less interest.


    For the purpose of this example, we will say that we grew up in Dallas, Texas
    and want to add a link to a site providing more information about Dallas.


    First, let’s start a new biography section to add some of this biographical information.
    I will start with a new <h3> and then add a brief introduction to the section
    in a <p> tag. I have highlighted the addition to our full code sample below.


    Code Sample: Adding a new header and link


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages. Here
    are some things I like to do in my free time:</p>


    <ul>


    <li>basketball</li>


    <li> soccer</li>


    <li> table tennis</li>


    </ul>


    <h3> Below are some my career accomplishments</h3>


    <ol>


    <li>Teacher of the year in 2011</li>


    <li>Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    <h3> A brief Biography</h3>


    <p> I am originally from Dallas, Tx.  I have many fond memories of Dallas. Click
    <a href="http://http://dallascityhall.com/Pages/default.aspx">here</a> if you
    want to learn more about Dallas. </p>


    </body>


    </html>


    Notice how we have embedded the link inside of the <p> tag. With links to remember
    that we not only need to add an address or link, but we also must indicate what
    text we want to display that will be linked. In this case, the word ‘here’ in
    the previous code will house the link and by clicking on that word, the visitor
    will be taken to that site. The other text will not be linked and will simply
    be placed around the linked text.


    Now that we know how to add a link, let’s explore a fun and useful way to add
    functionality for our visitors and make it easy for them to contact us. Let’s
    add our email address as a link that visitors can click on to reach out to us
    in a convenient way. We will add this as the last element in our <head> section,
    right under the <h2> tag.


    To add this functionality, you will build an element that looks very similar to
    a normal link element.  However, you will add a command called “mailto:” that
    opens the visitor’s email and generates a new email that is addressed to you.
    Here is an example of how it looks:


    <a href="mailto:youremailaddress">Email Me</a>


    You will notice the normal <a> tag for a link, for the href, we have added mailto:
    which is followed by an email address, and the link text at the end of the element
    before the closing tag. I will add the code below to my profile below the <h2>
    element at the bottom of the <head> section. Feel free to use your own email address
    where I have added the [contact@learntoprogram.tv](mailto:contact@learntoprogram.tv)
    address.'
