    which indicates that they are JPEG files. Exploring image file types will not
    be discussed here. However, JPEG is a standard and widely used format that serves
    our purposes well.   I recommend that you add some images and save them to the
    folder as JPEG files.


    I have named my project folder My_Page and I am keeping my images in a folder
    titled images. To access that folder in an <img> tag, you can use a line of code
    like the code sample below. I have highlighted the src attribute pointing to the
    .jpeg file in our images folder.


    Code Sample: Adding sizes to our image


    <head>


                  <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <img src="images/headshot.jpg" alt="headshot" height="250" width="200">


    <p align="center"><a href="mailto:contact@learntoprogram.tv">


    Email Me</a></p>


    After adding the image, my site looks like this:


    ![](images/00023.jpeg)


    Figure 5-2—Current version of code after adding  <img>


    Don’t worry if your image isn’t centered above the email address!  We will cover
    that soon.


    We will now discuss how to add an image from another website. Please find an image
    online that you would like to use. To be able to use an image that is already
    online, you will need to locate that image address or url, and place that in your
    code. This a very simple process that is outlined below.  First, put a blank image
    tag at the bottom of your code below the last <p> tag and right above the last
    </body> tag.


    1.  Navigate to the image you like


    2.  Right click your mouse button while hovering over the image


    ![](images/00024.jpeg)


    Figure 5-3—copying image address


    3.  Select “copy image address” from the menu that appears


    4.  Return to your code, and put your cursor between the quotes after src=


    5.  Right click on your mouse, and press paste. 


    You should now see the address in your <img> tag as part of the source attribute
    and you should mirror the following code sample.


    Code Sample: Adding image from a url


    <h3> A brief Biography</h3>


    <p> I am originally from Dallas, Tx.  I have many fond memories of Dallas. Click
    <a href="http://http://dallascityhall.com/Pages/default.aspx">here</a> if you
    want to learn more about Dallas.</p>


    <img src="http://images.freeimages.com/images/previews/67e/office-1238353.jpg"
    alt="" width="" height="">


    </body>


    </html>


    After adding the image, our site should resemble the following screen shot. Don’t
    worry if yours is a different size. We will work on sizes soon. Here is how my
    page looks with the image.


    ![](images/00025.jpeg)


    Figure 5-4—with image from url added


    Save your file and test your code in the browser.


    This looks great! Adding images is a fun and creative way to layer in content
    and add depth to your ability to communicate with your visitors.


    There are still a few elements that we need to add to our image tag. First, we
    have total control over the size of the image as it renders on our page, so let’s
    work with our height and width. As you noticed when you rendered the latest version
    of your code, you do not need to enter a height and width. However, it is a best
    practice and something that you will want to have a good grasp of. Images will
    come in at different sizes due to their original properties. You will want to
    maintain control over the image, and make sure that you have prescribed a height
    and width that aligns with what you need for your page.'
