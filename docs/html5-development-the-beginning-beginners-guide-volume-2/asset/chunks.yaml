    这是一个标签的示例。我在示例中高亮显示了它们：


    <p>这是将显示在网页上的文本</p>


    我们将在书的后半部分介绍许多类型的标签以及它们的的含义。在这种情况下，`<p>` 是 paragraph（段落）的缩写，括号标签之间的文本将显示在浏览器中。目前不需要担心这些标签的具体作用。更重要的是关注整体结构。


    ![](img/00001.jpeg)


    图 1-1—HTML 元素和标签


    标签始终由角括号括起来。括号内部的字母表示它是什么种类型的标签。标签的内容代表了该标签为浏览器结构化的内容。大多数标签都有闭合标签，其特征是在普通角括号内的标签名称前加一个正斜杠
    `/`。


    可能需要使用标签来添加额外的内容或结构。我们使用属性（attribute）来实现这一点。


    这是我们之前使用的示例标签。不过，现在我们添加了一个属性。我高亮显示了该属性。


    <p align="center">这是将显示在网页上的文本</p>


    正如你可能猜到的那样，在这种情况下，属性将使我们的文本居中。


    属性被放置在起始标签内，一个 HTML 标签可以有一个或多个属性。属性始终包含在起始标签中。它们的前面有一个空格，并包含属性名称、一个等号和引号内的值。


    ![](img/00002.jpeg)


    图 1-2—属性的位置


    在有了这些理解的基础上，我相信你已经准备好编写你的第一行 HTML5 代码了！我们只需要另一个额外的工具。


    构建网页最基础的工具之一是文本编辑器。文本编辑器不仅可以存放你的代码，还能帮助你保持网页项目的井井有序。当你为网站编写代码时，一个良好的文本编辑器是你最好的朋友。


    有很多非常棒的文本编辑器供选择。对于这个项目，我们将使用 Adobe 的 `Brackets`。`Brackets` 是一个非常好的编辑器，安装简单且用起来方便。然而，不要被它的简单误骗了。它还具有非常强大的功能，并且许多专业人士每天都在构建和维护未来的网站。


    第一步是下载并安装你的文本编辑器。


    ### 如何安装和运行 Brackets：


    ![](img/00003.jpeg)


    图 1-2.5—`Brackets.io` 的下载界面


    1. 在浏览器中导航到 `Brackets.io`，点击屏幕中间写着“Download Brackets”的蓝色下载按钮。

    2. 点击 `Open` 打开 `Installer`。

    3. 按照安装程序的说明操作并点击 `finish` 或 `install`。

    4. 安装完成后，打开 `Brackets`。

    5. 默认情况下，`Brackets` 会打开一个包含一些“Getting Started”（入门指南）内容的文件夹。阅读一遍，以熟悉 `Brackets`
    以及其中用到的一些术语。如果你不理解它涵盖的部分或全部内容，不要担心。


    ### 你的第一个程序


    现在你已经可以使用 `Brackets` 了，是时候构建你的第一个 HTML5 脚本了！先让我来做第一个祝贺你的人。在接下来的几分钟里，你将拥有你的第一个页面。


    你的第一步是创建一个新文件夹，你你想保存文件并存储网页的地方。


    1. 在你想创建文件夹的位置（例如桌面或普通文件夹目录）上点击右键

    2. 点击 `New`（新建）

    3. 点击 `Folder`（文件夹）

    4. 将你的文件夹命名为 `My Page`。


    现在你已经创建了项目文件夹，是时候在文本编辑器中开始一个文件了。在 `Brackets` 中，点击 `File`（文件）然后点击 `New`（新建）。


    此时，你在文本编辑器中有一个空白文本文件。这正是每一个优秀网页的起点。


    让我们为网站在 `Brackets` 中输入第一行文本。我会这样开始：


    感谢访问我的页面并了解更多关于我的信息！


    输入这些后，按照此简单流程开始保存你的文件。


    1. 点击 `File`（文件）

    2. 点击 `Save as`（另存为）

    3. 将你的第一个页面命名为 `index.html`


    使用 `.html` 扩展名至关重要，这样你的文本编辑器和浏览器就知道将此文件作为 HTML 文件读取。`index` 是网站主页或首页的习惯命名。出于本次练习的目的，我将把我们的第一个页面保存为：


    `index.html`


    现在点击 `Save`（保存）。此时，你应该拥有了第一个可以渲染到浏览器的页面。在 `Brackets` 中，你将点击屏幕右上角的小闪电图标在浏览器中测试你的代码。这被称为
    `Live Preview`（实时预览）功能。


    ![](img/00004.jpeg)


    图 1-3—`Brackets` 中的实时预览功能


    如果你现在这样做，你应该能看到这个：


    ![](img/00005.jpeg)


    图 1-4—首次渲染到浏览器


    恭喜你！这是一个微小而谦逊的起点，在不远的将来，它将成为一个精彩的网页。所有的网页都从空白画布开始。


    从这一步开始，我们可以看到在不需要额外的 `HTML5` 的情况下就能将内容渲染到浏览器。这在你之后所有的脚本中都将有效。你的文本和内容的其他部分将保持其原生结构。你放置在内容周围的
    HTML 标签和属性将帮助你构建。


    ### HTML 模板 (Boilerplate)


    从这一步开始，我们可以看到在不需要额外的 `HTML5` 的情况下就能将内容渲染。这在你之后所有的脚本中都将有效。你的文本和内容的其他部分将保持其原生结构。你放置在内容周围的
    HTML 标签和属性将帮助你构建。


    让我们删除我们测试的第一行。现在我们来添加基础标签。


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title></title>

    </head>

    <body>


    </body>

    </html>

    ```


    `<!DOCTYPE` 声明向浏览器指示文档编写使用的 HTML 版本。你写的每个 HTML 文件都具有相同的起点。它必须在那里，并且始终位于顶部。


    第一个标签 `<html>` 简单地告诉浏览器正在交付一个 HTML 文件。`<head>` 标签作为容器或位置，用于标题和元数据，这些内容通常位于文档的“头部”或顶部。


    `<html>` 标签指示 HTML 文档的开始和结束。`<title>` 标签后的内容将在页面打开时显示在浏览器标签页上。标题内容也会被搜索引擎（如 Google）在网站上线后对其进行索引。`</title>`
    关闭文档的该部分，`</head>` 关闭头部部分。


    `<body>` 标签将作为容器，用于通常出现在网页正文中的段落和图像。`</body>` 标签关闭该部分，而 `</html>` 标志着文档的结束。


    在输入完上面的模板后，你在文本编辑器中的代码应该看起来所示：


    ![](img/00006.jpeg)


    图 1-5—`Brackets` 中的 HTML 模板


    作为一条通用规则，所有包含内容的标签都有起始和闭合标签。有些标签不包含内容也不需要闭合标签，但它们超出了我们目前的范围。


    现在我们已经有了模板，我们需要确定页面的目标，收集一些主意，然后是时候开始构建了！


    对于我们的项目，我们将构建一个作为个人简介的网站。它将为页面提供一个基础布局，该页面将包含个人详情、图像、收藏网站的链接、工作历史信息以及访问者反馈的地方。


    我将虚构一个人物的个人详情，并提供个人简介类型网站的基本结构。在处理文本部分时你可以随时添加自己的细节，但请确保你完全遵循代码。


