    \n图 6-3—表格格式化数据示例\n\n到此时，我们表格的基本结构已经初具规模。我们将为表格添加一些基础样式。一个良好的表格应该具有简单且组织良好的布局。不要过度设计，这一点非常重要。然而，通过添加一些边框并强调某些文本和行，我们可以从视觉上帮助访问者理解表格中的数据，并确保信息逻辑通畅。\n\
    \n为了更好地区分数据，我们将添加一个边框。边框是可选的，但我们在这里添加一个是为了帮助你练习其功能。我们还将添加一个属性来控制表格的宽度。\n\n###\
    \ 代码示例：为表格添加边框和宽度\n\n```html\n<table border=\"1\" style=\"width:100%\">\n  <thead>\n\
    \    <tr>\n      <th>标题</th>\n      <th>地点</th>\n      <th>年份</th>\n    </tr>\n\
    \  </thead>\n```\n\n你会发现宽度被设置为 `100%`。在 `HTML5` 中，尺寸的两种常用选项是像素或百分比。保存你的文件，测试你的代码并查看表格在\
    \ `100%` 宽度下的外观。\n\n我将最终版本设置为 `50%`。我已经在下方显示的代码示例中高亮显示了它。我们将在起始 `<table>` 标签中使用另一个属性来使表格居中。我们将添加一个属性为\
    \ `center` 的 `align` 属性。\n\n最后一步是为表格添加一个总标题。在 `HTML5` 中，这被称为标题说明（caption）。我们将添加一个起始\
    \ `<caption>` 标签和一个结束 `</<caption>` 标签，并将我们想要作为表格标题的文本放在标签之间。你可以从下面的示例中看到应该放置的位置。我们要添加的代码已高亮显示。\n\
    \n### 代码示例：为表格添加边框、宽度和对齐方式\n\n```html\n<table border=\"1\" style=\"width:50%\"\
    \ align=\"center\">\n  <caption>我的工作经历</caption>\n  <thead>\n```\n\n我还想把我们添加的办公室图片移动到最后一页。它位于我们索引页\
    \ `<h2>` 标签的下方。\n\n要剪切并粘贴你的代码：\n\n1. 高亮显示你想要的代码。在这种情况下，是整个 `<img>` 标签。\n2. 在高亮状态下右键点击。\n\
    3. 点击`剪切`（Cut）。\n4. 返回你的 `work.html` 文件。\n5. 将光标放在 `<caption>` 标签下方的一个新行上。\n6.\
    \ 右键点击。\n7. 点击`粘贴`（paste）。\n\n这是来自表格头部部分的代码，添加了边框、宽度、标题和居中对齐，并包含了刚刚从另一个文件剪切并粘贴的\
    \ `img` 标签。在这一步中，我们还想要添加一个 `<h1>`，你可以在高亮部分看到它。\n\n### 代码示例：为表格添加边框、宽度和对齐方式\n\n\
    ```html\n<table border=\"1\" style=\"width:50%\" align=\"center\">\n  <caption>我的工作经历</caption>\n\
    \  <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"My office\" width=\"400\" height=\"200\">\n  <thead>\n    <tr>\n     \
    \ <th>标题</th>\n      <th>地点</th>\n      <th>年份</th>\n    </tr>\n  </thead>\n```\n\
    \n当我们在浏览器中测试代码时，它看起来应该是这样的：\n\n![](img/00031.jpeg)\n\n图 6-4—我们带有表格、标题说明和图片的页面\n\
    \n我们还想为页面添加一个居中的页眉。\n\n### 代码示例：为表格添加边框、宽度和对齐方式\n\n```html\n<table border=\"1\"\
    \ style=\"width:50%\" align=\"center\">\n  <caption>我的工作经历</caption>\n  <img src=\"\
    http://images.freeimages.com/images/previews/67e/office-1238353.jpg\" alt=\"My\
