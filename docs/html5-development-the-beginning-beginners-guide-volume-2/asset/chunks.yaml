- fmt: "\nSave your file and test your code. It should render in the upper left and\
    \ the link to the Main Page should be live. We will create the Blog page in the\
    \ next section. As you study the code, you can see that what we are doing is adding\
    \ links to our own pages inside of `<nav>` tags. Here is a screen shot:\n\n![](images/00034.jpeg)\n\
    \nFigure 7-2—`work.html` page with navigation links added\n\nGreat work! Allowing\
    \ for easy and functional navigation is the key to a positive user experience.\
    \ You should now see how to begin to use a fundamental understanding of different\
    \ elements to speed your learning in other areas. In this case, a knowledge of\
    \ how to format tags and links assisted us in quickly learning navigation. A key\
    \ to good programming is to constantly “borrow” what you know in one area, and\
    \ to apply it as often as it makes sense in other areas.\n\nNow that we are adding\
    \ multiple ways for visitors to experience our content, it is time to add some\
    \ important interactive elements and allow our visitors to provide us data and\
    \ feedback through the use of forms.\n\n# Forms: Add Additional Interactivity\n\
    \nForms are a great addition to your site. They offer another layer of communication\
    \ with your visitors. Good forms allow you to accept feedback and data from your\
    \ visitors. As a result, your website becomes an effective two way street between\
    \ you and your guests. To properly store and use this data on the backend, you\
    \ will need to add some additional code and programming (not covered here). We\
    \ will show you how to add a basic form on the front end of a website. This will\
    \ help you to understand the fundamentals of presenting forms in a browser and\
    \ begin to think about all of the fantastic ways you can add this interactive\
    \ feature to your site.\n\nFor this example, we are going to create a new blog\
    \ on our site, but we want to ask for some information from our visitors about\
