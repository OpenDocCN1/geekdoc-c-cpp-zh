    第一步是为我们的页面命名。在 `<title>` 开始和结束标签之间，我将放入“My page”，这将作为我们的标题。


    在 `<body>` 部分，我将放入一段欢迎访问者的文本。


    现在你的代码应该像下面所示：


    代码示例：添加初始内容


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    Thanks for visiting my page and learning more about me!

    </body>

    </html>

    ```


    # 添加用于格式化和样式的基础标签


    现在我们已经有了一些基础文本和模板代码，现在是时候添加几个标签了，以帮助你结构化文本元素并构建页面上的大部分内容。


    其中的秘诀在于，许多网页只需要少数标签就能完成其大部分内容。理解基础标签的目的、功能和最佳用法，将加速你构建有趣且富有创意的网页的能力，这些网页将充满完全按照你意愿进行结构化的有趣且相关的内容。


    你将使用的两个最常用的标签是标题（header）和段落（paragraph）标签。标题选项有 1 到 6 级，其中 1 通常是主标题，随后的标题随着数字增大而重要性降低。主标题的开始标签是
    `<h1>`，结束标签是 `</h1>`。二级标题的开始标签看起来像 `<h2>`，带有惯常的结束语法 `</h2>`。你对随后的标题遵循相同的模式，尽管大多数页面很少用到的
    `<h5>` 或 `<h6>`。


    让我们创建标题标签。这些标签对你的访问者非常重要，并将帮助他们进行导航。优秀的网页是直观且易于导航的，因为它们是使用强烈的视觉提示和如标题之类的元素构建的。我将在我现有的文本周围添加
    `<h1>` 标签，使其具有更多强调。我在下方突出显示了要添加到我们模板代码中的新代码：


    代码示例：添加标题


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    <h1>Thanks for visiting my page and learning more about me!</h1>

    </body>

    </html>

    ```


    保存你的代码，并点击文本编辑器中的“实时预览”（Live Preview）以在浏览器中进行测试。注意看在添加添加 `<h1>` 标签前后的区别。


    当在浏览器中查看时，你的页面现在应该像这张图片一样：


    ![](img/00007.jpeg)


    图 1-6—添加标题标签


    恭喜你走到了这里！通过理解基础标签的位置和重要性，你正在学习构建网页的常规流程。如果花费了多次尝试，没关系！你会发现大量的编码工作都是尝试与错误，即使是最丰富、最熟练的程序员也是这样工作的。关键是不断向前发展，学习尽可能多的知识，寻找解决问题的创意方法，并尽快应用新学到的。


    你经常使用的另一个常用标签是段落，或 `<p>` 标签。你网站上大部分基于文本的内容将位于 `<p>` 开始标签和 `</p>` 结束标签之间。


    考虑到我们正在构建一个个人简介网页，我在 `<body>` 部分的 `<p>` 标签之间添加了一些简短的个人背景信息，我们可以在后面的课程中对其进行扩展。


    我在下面的示例中突出显示了我添加的代码和文本。


    代码示例：添加段落标签


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    <h1> Thanks for visiting my page and learning more about me! </h1>

    <p>I graduated from the University of Texas in 2010 with a degree in English.
    I am an English teacher and soccer coach and learning to build web pages.</p>

    </body>

    </html>

    ```


    输入 `<p>` 标签后，保存并在浏览器中测试你的代码。下面的截图展示了我的页面是如何渲染的。


    ![](img/00008.jpeg)


    图 1-7—添加标题和 `<p>` 标签后。


    让我们添加一个二级标题，为访问者提供视觉和导航提示，让他们知道页面上可以期待什么。我将添加一个 `<h2>` 标签和一些文本，这些内容在下面的代码示例中复制并突出显示。


    代码示例：添加二级标题标签


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>

    <h1>Thanks for visiting my page and learning more about me! </h1>

    <h2>This site is designed as a personal profile</h2>

    <p>I graduated from the University of Texas in 2010 with a degree in English.
    I am an English teacher and soccer coach and learning to build web pages.</p>

    </body>

    </html>

    ```


    我们现在应该有了一个页面标题、两个标题以及段落标签中的一些内容。我们应该确保保存了文件。当我们在 Brackets 中点击实时预览图标时，我们应该在浏览器中看到以下渲染结果：


    ![](img/00009.jpeg)


    图 1-8—添加二级标题后。


    进展非常顺利！我相信，现在我们已经有了一些基础性部分来构建我们的网站，你觉得有动力继续了。


    # 你 HTML 的辅助配角


    回想我们迄为止取得的进展真是令人兴奋。我们正在用坚实的代码和优秀的内容构建一个优秀网站的基石。正如我们之前提到的，优秀的内容是任何有意义网站的核心，而良好的
    HTML 代码为你的内容提供了结构、组织和布局。


    然而，交付一个高质量的网站还需要投入更多努力，现在我们将讨论三个重要的辅助部分：浏览器、文本编辑器和用于引入样式的层叠样式表（CSS）。


    网络浏览器是访问者用来访问和查看你网站的软件应用程序。浏览器访问、导航并呈现构成世界维网的信息和内容。当你开始在网络上构建并放置内容以供大众消费时，记住浏览器所起的关键作用将非常重要。我们想要正确使用标签并保持代码整洁的主要原因之一是为了让浏览器能够轻松导航和理解我们的页面，并正确显示它们。


    正如你可能意识到的，今天有几种主要的浏览器选择。Chrome、Safari、Firefox 和 Internet Explorer 是最常用的浏览器。组织良好且标签准确的代码将在浏览器中表现良好，并为你的内容呈现预期的结构和格式。


    我们用来保持代码整洁、结构化和运行良好的主要工具是文本编辑器。我们在这里选择的文本编辑器是 `Brackets.io`，它是由 Adobe 赞助的开源项目。


    就像你的访问者有多种浏览器选择来访问你的页面一样，在文本编辑器方面你也有许多选择。常见的选项包括 `Notepad++`、`TextMate` 和 `Sublime
    Text`。不同的编辑器具有不同的功能和界面，但通常，网页设计师和开发者根据个人偏好选择文本编辑器。他们通常会坚持使用他们喜欢的编辑器。


    使用文本编辑器来保持代码整洁的一种非常有用且常见的方法是使用注释（comments）。在编码语境下，注释是你写给自己或阅读你代码的人的有用笔记。这些注释嵌入在代码中，但它们使用特定的语法编写，防止它们与你的其他
    HTML 一起被读取。此外，它们不会干扰页面在浏览器中的渲染。你可以将注释想象为拥有自己的标签，下例提供了提供了。


    代码示例：注释标签和添加注释


    ```html

    <!--这是一个注释. 注释不会在浏览器中显示-->


    <p>这是一个段落。这将在浏览器中显示。</p>

    ```

