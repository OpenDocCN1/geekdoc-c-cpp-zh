    have an opening <ul> and closing </ul> tag format that should now be familiar
    to you.


    When we build a list, we will also add tags to each item in the list. The list
    tags will open <li> and close</li> around each listed item. An easy way to think
    about this is to consider the <ul> tag as declaring that a list will be built,
    and each <li> tag is nested within the larger list. Here is a sample of a blank
    list showing the tags we would use for a three item unordered list:


    Code Sample: Adding unordered lists


    <ul>


      <li></li>


      <li></li>


      <li></li>


    </ul>


    Adding ordered lists, which is a list where items need to have a certain sequence
    reflected, follows a similar pattern.


    However, with an ordered list, we will declare a list with an opening <ol> tag
    to represent the fact we now want an ordered list. We will close it with a </ol>
    tag in typical fashion.


    We will nest the list items with an ordered list the same way we do with an unordered
    list. Here is a code sample of a blank ordered list:


    Code Sample: Adding an ordered list


    <ol>


      <li></li>


      <li></li>


      <li></li>


    </ol>


    Now, let’s return to our profile page and add some lists! We will head back to
    where we left off after we added the code to link our style sheet. Your code should
    look like the below sample:


    Code Sample: Current status of code for personal profile project


    <html>


    <head>


                  <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>


    </html>


    Let’s add some fun details including our interests and hobbies so that visitors
    to our page get a sense of our personality. Below our paragraph element, I am
    going to add an unordered list with three things that I like to do in my spare
    time.  I will also add a sentence to my paragraph element to introduce the list
    below it. I have highlighted the code that is new in this step. After adding a
    sentence to my paragraph element and an unordered list, my code will now look
    like this:


    Code Sample: Adding an unordered list


    <html>


    <head>


    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p> I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages. Here
    are some things I like to do in my free time:</p>


    <ul>


    <li>basketball</li>


    <li>soccer </li>


    <li>table tennis </li>


    </ul>


    </body>


    </html>


    At this point, you will be able to save your file and test your code in the browser.
    After doing so, here is what mine looks like:


    ![](images/00016.jpeg)


    Figure 4-1—Adding lists


    Fantastic work! It looks so good we should add another!


    Let’s add some professional accomplishments. Due to the nature of the list, and
    the fact we want to prioritize what we are most proud of in our career, we want
    to list these next elements in order. As we now know, that calls for an ordered
    list.


    To introduce this list, instead of adding text in a paragraph tag, we will add
    a new header. Let’s add an <h3> to introduce our list, and then nest our list
    <li> elements inside of our ordered list opening <ol> and closing </ol> tags.


    First, I’ll add a header indicating to our visitors that we are going to list
    career accomplishments. We will add this tag right under the unordered list that
    we just added.


    Code Sample: Adding an additional header


    <h3>Below are some of my career accomplishments</h3>


    Now we will build our ordered list. These items will be placed in sequence on
    our page.  It should be identical in basic format to our unordered list except
    for the <ol> tags in place of the <ul> tags. Here is the code that we will place
    right below the heading tag we just added.


    Code Sample: Adding an ordered list


    <ol>


    <li>Teacher of the year in 2011</li>


    <li> Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    This is excellent progress! We now have headers, a basic style sheet added, some
    content and two different lists (unordered and ordered). We have a lot to be proud
    of!  At this point, the code in our text editor on Brackets.io should look like
    this:


    Code Sample: Adding an ordered list


    <html>


    <head>


    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages. Here
    are some things I like to do in my free time:</p>


    <ul>


    <li>basketball</li>


    <li> soccer</li>


    <li> table tennis</li>


    </ul>


    <h3> Below are some of my career accomplishments</h3>


    <ol>


    <li>Teacher of the year in 2011</li>


    <li> Coached the Boy''s soccer team to the conference title in 201 </li>


    <li> Three former students received prestigious scholarships in 2015</li>


    </ol>


    </body>


    </html>


    Feel free to check your code against the preceding sample and make any necessary
    adjustments. You might want to take some time at this point to reflect on other
    ways you can add lists, paragraphs, headers or basic styling with your text in
    future projects. You should be starting to get a grasp of the functionality available
    to you as you build your page. This is great! The greatest tool that you have
    as you build in HTML for the web is your own imagination. 


    After checking your code against the image above, save it, and then test it in
    your browser. It should appear like the page below.


    ![](images/00017.jpeg)


    Figure 4-3—Image of current rendered version of our page


    As you can see, ordered lists add an additional layer of structure to the ways
    we can display content on our page.  However, this structure is not limiting.
    As with any HTML element, we have a variety of options for how we want to display
    lists. Let’s look at a few examples!


    We may want to start by reversing the order of our items so that the list starts
    with the highest number and counts down. To structure our list this way, we will
    add an attribute.  Adding attributes is very simple way to provide you with even
    greater control over how you want to display your content.


    If we recall from the first section, an HTML tag can consist of not only the tag
    name, but also an attribute. Thus far, we have only used tag names, but now it
    is time to add an attribute. Below is a graphic showing the placement of an attribute.


    ![](images/00018.jpeg)


    Figure 4-4—Placement of an attribute


    In this case, we want to reverse the order of our ordered list. To accomplish
    this, we will add the attribute “reversed” to our <ol> tag.  Here is a code sample
    demonstrating how we do this. I have highlighted where I have placed the reverse
    attribute.


    Code Sample: Adding an attribute


    <ol reversed>


    <li>Teacher of the year in 2011</li>we


    <li>Coached the Boy''s soccer team to the conference title in 2012</li>


    <li>Three former students received prestigious scholarships in 2015</li>


    </ol>


    After adding the code, save your file and test it in the browser. It should render
    like this:


    ![](images/00019.jpeg)


    Figure 4-5—Screenshot with our ordered list with reversed attribute'
