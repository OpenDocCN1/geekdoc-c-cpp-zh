    The secret is that many web pages require only a handful of tags for the majority
    of their content. Understanding the purpose, functionality and best uses of the
    basic tags will accelerate your ability to build fun and creative web pages that
    are filled with interesting and relevant content structured exactly the way you
    want it.


    Two of the most common tags that you will use are header and paragraph tags. 
    Header options number 1 through 6 with one typically being the primary header
    and subsequent headers decreasing in importance as the numbers get larger. The
    primary header opening tag is <h1> and the closing tag is </h1>. The secondary
    header opening tag will look like <h2> with the customary closing syntax of </h2>.
    You will follow the same pattern with subsequent headers, although most pages
    rarely go as far as <h5> or <h6>.


    Let’s create our header tag. These tags are important to your visitors and will
    help them with navigation. Great web pages are intuitive and easy to navigate
    because they were built with strong visual cues and elements like headers. I will
    add <h1> tags around my existing text so that it has more emphasis. I have highlighted
    the new code below to add to our boilerplate:


    Code Sample: Adding a header


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me!</h1>


    </body>


    </html>


    Save your code and click on Live Preview in your text editor to test it in the
    browser.  Notice the difference before and after you added the <h1> tags.


    When viewed in the browser, your page should now resemble this image:


    ![](images/00007.jpeg)


    Figure 1-6—The addition of header tags


    Congratulations on making it so far! By understanding the placement and importance
    of basic tags, you are learning the routine that it takes to build web pages.
    If it takes you a few tries, no worries! You will find that a great deal of coding
    is trial and error and even the most experienced and skilled programmers work
    this way. The key is to keep progressing forward, learn as much as you can, look
    for creative ways to solve problems and apply new lessons as quickly as possible.


    Another very common tag that you will often use is the paragraph, or <p> tag.
    Most of the text based content on your site will live between opening <p> and
    closing </p> tags.


    Knowing we are building a personal profile web page, I have added some brief biographical
    information between the <p> tags in our <body> section that we can build on in
    later lessons.


    I have highlighted the code and text I added in the following example.


    Code Sample: Adding a paragraph tag


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    </head>


    <body>


    <h1> Thanks for visiting my page and learning more about me! </h1>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>


    </html>


    After entering the <p> tags, save and test your code in a browser. The following
    screen shot demonstrates how my page is rendering.


    ![](images/00008.jpeg)


    Figure 1-7—With the addition of a header and <p> tags


    Let’s add a secondary header to provide a visual and navigational cue to visitors
    as to what to expect with the page. I am going to add an <h2> tag and some text
    which is replicated and highlighted in the code sample below.


    Code Sample: Adding a secondary header tag


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>


    </html>


    We should now have a page title, two headers, and some content in a paragraph
    tag. We should make sure that we save our file. When we click on the live preview
    icon in Brackets, we should see the following render in a browser:


    ![](images/00009.jpeg)


    Figure 1-8—With the addition of a secondary header


    Fantastic progress! I trust you feel empowered to continue now that we have some
    basic foundational pieces in place to build our site around.


    The Supporting Cast for Your HTML


    It is exciting to reflect on the progress that we have made thus far. We are building
    the foundation of a great website with solid code and great content. As we mentioned
    earlier, great content is the heart of any meaningful website, and good HTML code
    provides the structure, organization, and layout for your content.


    However, a lot more goes into delivering a quality website, and now we are going
    to discuss three important supporting pieces; the browser, text editor, and cascading
    style sheets (CSS) for introducing styling.


    The web browser is the software application that your visitors will use to access
    and view your site. Browsers access, navigate and present the information and
    content that makes up the World Wide Web. As you begin to build and place content
    on the web for popular consumption, it will be important to stay mindful of the
    critical role that browsers play. A major part of why we want to properly use
    tags and keep our code organized is so that browsers can easily navigate and understand
    our pages, and properly display them.


    As you are probably aware, there are several main choices for browsers today. 
    Chrome, Safari, Firefox, and Internet Explorer are the most commonly used browsers.
    Well organized code with accurate tags will perform well in browsers and render
    the intended structure and format for your content.


    The main tool we use to keep our code organized, structured and functioning well
    is a text editor. The text editor that we have chosen here is Brackets.io, which
    is an open source project sponsored by Adobe.


    Just like your visitors have several choices of browsers to use to visit your
    page, you ultimately have many choices when it comes to text editors.  Several
    common options include Notepad++, TextMate, and Sublime Text. Different editors
    will have different functionalities and interfaces, but most often, web designers
    and developers choose a text editor based on personal preferences.  They usually
    stick with an editor that they enjoy using.


    One very helpful and common way of using a text editor to ensure that you keep
    your code organized is through the use of comments.  In the context of coding,
    comments are helpful notes that you write to yourself or others who will read
    your code. These notes are embedded within the code, but they are written with
    a certain syntax that will prevent them from being read with the rest of your
    HTML. In addition, they will not interfere with how your page is rendered in the
    browser. You can think of comments as having their own tag, which is provided
    in the example below.


    Code Sample: The comment tag and adding comments


    <!--This is a comment. Comments are not displayed in the browser-->


    <p>This is a paragraph. This will be displayed in the browser.</p>'
