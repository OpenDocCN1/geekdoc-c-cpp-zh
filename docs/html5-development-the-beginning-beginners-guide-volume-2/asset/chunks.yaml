    Code Sample: Example image tag


    <img src="image url" alt="brief title of image" width="in pixels" height="in pixels">


    Let’s explain the parts of this tag in more detail. 


    *   <img will open your tag and element for adding images.


    *   src is short for source and directs the browser to where it will find an image.


    *   alt is what appears if there is an issue with displaying the image.  It is
    also what will be read by a screen reader.


    *   Width will contain a number which will specify the width of the image (in
    pixels) that will be displayed.


    Height will contain a number which specify the height of the image (in pixels)
    that will be displayed.


    *   There are many options that can be used for images. However, you will want
    to always include these basic attributes in every <img> tag. You want to tell
    the browser where to get the image, what text to place if it has an issue as well
    as the height and width.


    There are two ways to source images for your site. Relative addressing  tells
    your browser: “Look in our project folder for the file specified. Or, if a folder
