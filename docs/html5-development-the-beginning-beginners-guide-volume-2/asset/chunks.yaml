  trans: "\n保存你的文件并测试你的代码。它应该渲染在左上角，且指向主页（Main Page）的链接应该是有效的。我们将在下一节创建博客（Blog）页面。在学习代码时，你可以看到我们正在向\
    \ `<nav>` 标签内部为我们自己的页面添加链接。这里是截图：\n\n![](img/00034.jpeg)\n\n图 7-2—添加了导航链接的 `work.html`\
    \ \n\n干得好！提供方便且功能强大的导航是良好用户体验的关键。你现在应该看到如何开始利用对不同元素的基础性理解来加速你在其他领域的学习。在这个例子中，对如何格式化标签和链接的知识帮助我们快速学会了导航。良好编程的关键在于不断地从一个领域“借用”你所知道的知识，并在其他领域尽可能频繁地应用它。\n\
    \n现在既然我们正在为访问者提供多种体验我们内容的方式，是时候添加一些重要的交互元素，并允许访问者通过表单向我们提供数据和反馈了。\n\n# 表单：添加额外的交互性\n\
    \n表单是你网站的极佳补充。它们提供了与访问者交流的另一个层级。良好的表单允许你接受访问者的反馈和数据。结果是，你的网站变成了你与客人之间的一条有效的双行道。为了在后端正确地存储和使用这些数据，你需要添加一些额外的代码和编程（此处未涵盖）。我们将向你展示如何在网站的前端添加一个基础表单。这将帮助你理解在浏览器中展示表单的基础知识，并开始考虑你可以为你的网站添加这种交互功能的各种奇妙方式。\n\
    \n对于这个示例，我们将在我们的网站上创建一个新博客，但我们想向访问者询问一些关于他们想看什么类型博客的信息。我们将构建一个表单来从访问者那里收集这些信息。为了实现学习最大化，我们将构建三种不同类型的小表单。\n\
    \n第一步是在你的文本编辑器中创建一个新文件并将其命名为 `blog.html`。将其保存到我们项目正在使用的 `My_Page` 文件夹中。这与你在上一节创建\
    \ `work.html` 文件时遵循的流程相同。\n\n将以下代码添加到空文件的顶部，以便你的 HTML 文件拥有 `<head>` 部分、你的导航元素以及我们将用于解释此页面目的的内容。然后你将链接你的\
    \ CSS 文件。花几分钟研究这段代码中的元素。它们应该对你来说都很熟悉。你也可以回顾书籍之前章节中涵盖的内容。\n\n## 代码示例：开始构建我们的表单页面\n\
    \n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <title>My Blog</title>\n    <link\
    \ rel=\"stylesheet\" type=\"text/css\" href=\"css/styling.css\">\n</head>\n<body>\
    \   \n<nav>\n  <a href=\"mypage.html\">Main Page</a> |\n  <a href=\"work.html\"\
    >Work History</a> |\n</nav>\n<h1 align=\"center\">My Blog Is Coming Soon! </h1>\n\
    <h2>Help me start my blog!!</h2>\n<p>我计划很快就开始写博客。我计划关于我最喜欢的话题，包括教育、教学和网页设计。你能帮助我吗？随时告诉我你更倾向于哪些主题，并向我发送你的个人信息，以便将你加入我的邮件列表并在文章开始时通知你。再次感谢你的帮助，期待你的回音！</p>\n\
    </body>\n</html>\n```\n\n在 HTML 和 CSS 中有许多设计和样式化表单的选项。我选择了一个简单的框架，它会将不同的元素组合在一起，并自动添加一些边框以保持我们的表单整洁有序。\n\
    \n我们将引入几个新标签，它们将在下面的代码示例中使用。 \n\n*   `<form>` 标签充当我们所有表单元素的容器。\n*   `<br>` 标签是\
    \ break 的缩写。它将帮助我们将元素分分到不同的行。\n*   `<fieldset>` 标签将对元素分组。这并不是表单的必要部分，但它将帮助我们从设计角度分离和分组元素。当你尝试在代码中尝试不同的方法时，可以随意注释掉这些标签，并查看表单在没有\
    \ `fieldset` 标签的情况下是如何渲染的。如果你不指定大小，此标签的默认宽度为 100%。我们可以使用 `%` 或像素。\n*   `<legend>`\
    \ 标签为表单的特定部分提供标题。\n*   `<input>` 标签用于通过 `type` 属性声明表单的此部分将接受何种类型的输入。在第一次实例中，它是\
    \ `type=\"radio\"`，用于单选按钮。在表单的后面，我们还将使用文本。\n\n下面的代码示例提供了我们表单的第一部分。我们将创建三个单选按钮，允许访问者为他们想在我们的博客上阅读的主题“投票”：教育、网页设计或两者都要。\n\
    \n## 代码示例：我们表单的第一段代码\n\n```html\n<form>\n  <h3>I would love to hear from you!</h3>\n\
    \  <br>\n  <fieldset style=\"width:50%\">\n      <legend>What topics would you\
    \ like to see?</legend>\n      <input type=\"radio\" name=\"blogtype\" value=\"\
    education\"> Education\n      <br>\n      <input type=\"radio\" name=\"blogtype\"\
    \ value=\"web design\"> Web Design\n      <br>\n      <input type=\"radio\" name=\"\
    blogtype\" value=\"both\"> Both!\n  </fieldset>\n</form>\n```\n\n`value` 属性关联输入给定的值。`name`\
    \ 属性用于以后引用元素。`name` 属性是表单提交后的数据。\n\n你还会注意到我们在文本和输入字段之间放置了换行符。这是一个可选的设计选择。你可以在任何需要放置\
    \ `<br>` 标签。\n\n下一个代码示例将提供另一组表单元素。然而，这些将是文本输入而不是单选按钮。\n\n```html\n<fieldset style=\"\
    width:50%\">\n  <legend>Your Information</legend>\n  First name:<br>\n  <input\
    \ type=\"text\" name=\"firstname\">\n  <br>\n  Last name:<br>\n  <input type=\"\
    text\" name=\"lastname\">\n  <br>\n  Email:<br>\n  <input type=\"email\" name=\"\
    email\">\n  <br>\n  Zip Code:<br>\n  <input type=\"number\" name=\"number\">\n\
    </fieldset>\n```\n\n在开始处理这段代码之前，你应该花几分钟比较这两个示例，以确定相似点和差异。标签基本上是相同的。主要的区别在于属性中的值。记住，我们现在正在添加一个接受文本输入的表单，而之前的表单是一系列单选按钮。\n\
    \n我们的最后一段代码将为我们的访问者提供一个开放式的输入文本框，让他们向我们发送他们的评论、想法和创意。\n\n"
