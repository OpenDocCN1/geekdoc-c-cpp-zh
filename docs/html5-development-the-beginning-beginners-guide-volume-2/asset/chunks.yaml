    在 Brackets（以及其他几个文本编辑器）中，有一个简单的键盘快捷键可以处理注释。只需选中你想要注释的区域，并同时按下 `Ctrl` 和 `/`（Mac
    上为 `Command` 和 `/`）即可。你会看到注释标记出现，该区域的文本将变为灰色。在反复调整页面设计时，会有某些时候你想要将代码“注释掉”。假设在添加了二级标题标签（header）之后，你想查看带有标题和不带标题的页面效果。以下是我们的页面目前的渲染情况：


    ![](img/00010.jpeg)


    图 2-1—页面的当前版本


    现在，让我们“注释掉”我们的 `<h2>` 标签。我将用光标高亮该 `<h2>` 标签，然后按下 `Ctrl` + `/`。


    我用黄色高亮了下方代码示例中我们要注释掉的那行代码。


    代码示例：注释掉一行代码


    ```html

    <h1>Thanks for visiting my page and learning more about me!</h1>


    <!--<h2>This site is designed as a personal profile<h2>-->


    </head>


    <body>


    <p>I graduated from the University of Texas in 2010 with a degree in English.
    I am an English teacher and soccer coach and learning to build web pages.</p>

    ```


    现在我们把页面渲染到浏览器时，你会发现它简单地从浏览器的渲染结果中删除了那行代码：


    ![](img/00011.jpeg)


    图 2-2—注释掉一行代码的结果


    现在我们已经看了不带标题的页面，我们想将其恢复到访问者在浏览器中看到的内容。我们需要从代码中移除注释。要做到这一点，我们只需高亮想要移除注释标签的代码（在本例中为我们的
    `<h2>` 标签），然后再次按下 `Ctrl` + `/`。执行此操作后，我们的代码应该看起来像下面的示例。


    代码示例：取消注释一行代码


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    </head>

    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p> I graduated from the University of Texas in 2010 with a degree in English.
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>

    </html>

    ```


    恭喜你！你现在正在学习专业开发人员每天都会使用的技能。使用注释的能力以及理解浏览器和文本编辑器的作用，将让你在这个项目及未来的开发中受益浅，帮助你构建有趣、精彩且创意的网页。


    # CSS：为你的页面添加样式


    构建网页最好的部分之一是，它既提供了一个任何人都能学习的标准格式来开展工作机会。同时，它还提供了大量的灵活性和选项来构建设计元素，让每个人都有机会以自己的方式传递内容，这种方式不仅有效，而且具有创意和吸引力。


    今天你在网上看到的许多设计功能和样式都源于级联样式表，即 `CSS`。正如书中前面提到的，HTML 结构化并格式化你想要传递的内容，而 `CSS` 则帮助你进行样式设计和呈现。


    对 `CSS` 的深度解释和探索超出了本书的范围，但我确实想介绍一下它，以便你熟悉 `CSS` 规则的结构，以及你将如何将 `CSS` 样式表添加到 HTML
    文档中。


    你将在单独文件中构建 `CSS`，并将其链接到 HTML 文件中。这个过程非常简单，只需要在文本编辑器中打开一个新文件，并在 HTML 文件的顶部添加一行代码。以下是前三步：


    1. 在你的 `My_Page` 文件夹中，创建一个新的子文件夹并命名为 `CSS`。

    2. 在你的文本编辑器中打开一个新文件，并将其保存为文件名 `style.css`。

    3. 将该文件保存到 `My_Page` 项目内部的新 `CSS` 文件夹中。


    以 `.css` 扩展名保存文件，并将其保存到位于主 `My_Page` 项目文件夹内的名为 `CSS` 的子文件夹中是非常重要的。


    ![](img/00012.jpeg)


    图 3-1—创建一个新的 CSS 文件


    为了添加我们的样式表，我们现在需要将 `CSS` 链接到 HTML 文件。我将我的样式表命名为“style.css”，因此我将在代码中使用它来链接两者。


    在 HTML 文件的 `<head>` 元素中，你将添加一行简单的代码来链接这两个文件。以下是位于 `CSS` 文件夹中的 `style.css` 文件的示例代码：


    代码示例：将 CSS 链接到 HTML 文档


    ```html

    <link rel="stylesheet" type="text/css" href="css/style.css">

    ```


    链接 `CSS` 文件和 HTML 文件的代码应该放在 HTML 文件的顶部，如下：


    代码示例：添加 CSS 规则


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>My Page</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">

    </head>

    <body>


    <h1> Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p> I graduated from the University of Texas in 2010 with a degree in English.
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>

    </html>

    ```

    *(注：由于提供的原文中存在大量完全重复的段落，译文已根据“不要重复输出原文”的原则，仅翻译了核心内容部分。)*

