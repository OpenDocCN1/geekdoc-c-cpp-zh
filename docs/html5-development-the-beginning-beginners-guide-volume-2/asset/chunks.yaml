  trans: "\n\n如果你更喜欢字母和字母顺序显示，或者更倾向于使用罗马数字，你还有额外的选项。有序列表默认使用传统的十进制数字。但如果你偏好不同的符号，可以通过指定你想要的符号类型来将其声明为属性。\n\
    \n### 有序列表\n\n要使用大写字母按字母排序，你将使用下面的代码。我标亮了添加类型的地方：\n\n代码示例：为有序列表添加类型\n```html\n\
    <ol type = \"A\">\n  <li>2011 年度年度教师</li>\n  <li>2012 年带领男足球队获得了赛会冠军（赛区锦标赛冠军）</li>\n\
    \  <li>2015 年有三位往届学生获得了享有盛誉的奖学金</li>\n</ol>\n```\n\n当你测试你的代码时，你现在应该能看到列表按大写字母排列了。这里是一个例子：\n\
    \n![](img/00020.jpeg)\n\n图 4-6—带有 type = “A”的有序列表截图\n\n要使用罗马数字，你只需要在类型声明中添加大写的“I”。这里是一个示例：\n\
    \n代码示例：为有序列表添加类型\n```html\n<ol type = \"I\">\n  <li>2011 年度年度教师</li>\n  <li>2012\
    \ 年带领男足球队获得了赛会冠军（赛区锦标赛冠军）</li>\n  <li>2015 年有三位往届学生获得了享有盛誉的奖学金</li>\n</ol>\n```\n\
    \n要使用小写字母或罗马数字，你只需添加小写版本而不是大写版本。配合我们的反转属性，这提供了六种显示有序列表的方式。这为你提供了极佳的灵活性，并让你学习结构化列表信息的多种方法。通过未来的书籍或课程对\
    \ CSS 的深入理解，将为你的列表提供许多样式选项。因此，你的内容不仅组织良好，而且富有创意且引人入胜。\n\n### 链接：连接到万维网上的其他页面\n\
    \n万维网最好的功能之一就是能够轻松地链接到许多涵盖各种信息的页面。作为网站创建者，能够链接到其他页面的便利性为你带来了许多益处。有很多原因导致你可能想在页面上添加链接。我们在这里介绍其中几个。然而，我鼓励你发挥想象力，思考将链接整合到网页设计中的众多方法。添加链接可以支持你的内容，并为访问者提供丰富、独特且定制的体验。\n\
    \n要添加链接，你将使用带有特殊属性的 `<a>` 标签。`<a>` 是 anchor（锚点）的缩写。正如你在下面的示例中看到的，链接标签通常位于其他标签内部，如\
    \ `<h1>`、`<p>` 或 `<ul>`。\n\n典型的锚点元素以打开标签 `<a>` 开始，并有一个 `href` 属性。`href` 是 hypertext\
    \ reference（超文本引用）的缩写。它将包含一个通用资源定位符，或 `url`。这就是网站或链接地址。元素的第二部分将是渲染到网页上的文本，并包含链接。这意味着链接文本是可以点击的，并包含了\
    \ `url`，访问者通过点击链接将将带到他们想要去的地方。\n\n这里是 HTML 链接的示例：\n\n代码示例：基础链接结构\n```html\n<a\
    \ href=\"url\">链接文本</a>\n```\n\n例如，如果我想链接到 Yahoo.com，我可以构建下面的元素。\n\n代码示例：基础链接结构\n\
    ```html\n<a href=\"http://www.yahoo.com\">点击此处访问 Yahoo.com</a>\n```\n\n让我们来看看构建链接元素的过程。参考上一个代码示例，我在下面列出了具体步骤：\n\
    \n1. 使用 `<a>` 标签打开元素。\n2. 添加 `href=` 属性，然后在引号中添加你想要链接的网站的 `url` 或地址，正如我们上面所做的那样。\n\
    3. 使用 `>` 关闭链接部分。\n4. 添加用户将点击以激活链接的文本。\n5. 添加结束标签 `</a>`。\n\n虽然链接元素中的操作似乎比我们目前为止涵盖的其他元素要多，但你将始终遵循相同的结构。通过稍微练习，你将掌握这项新技能，并通过链接到全球其他\
    \ HTML 文档来充分利用网络的力量。\n\n### 实践练习\n\n现在，让我们通过在我们的个人简介中添加几个链接来增加练习。在这一部分中，我还将向你展示一或两个可以提高你网站复杂性和功能的独特功能。\n\
    \n首先，假设我们想要分享更多关于我们成长地的信息。关于这一点添加大量信息是不现实的，因为这个页面的目的是分享关于我们自己的信息。然而，某些访问者可能会好奇，并想要更多信息。通过为他们提供链接，你可以为他们提供了解更多的机会，同时又不会为那些兴趣不大的人占用页面上宝贵的空间。\n\
    \n为了这个示例，我们假设我们在德克萨斯州的达拉斯长大，并想添加指向提供更多关于达拉斯信息的网站链接。\n\n首先，让我们开始一个新的传记部分来添加这些传记信息。我将从一个新的\
    \ `<h3>` 开始，然后在一个 `<p>` 标签中为该部分添加简短介绍。我已经在下面的完整代码示例中标亮了添加的内容。\n\n代码示例：添加新标题\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>我的页面</title>\n  <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n  <h1>感谢访问我的页面！</h1>\n\
    \  <h2>这个网站是设计为个人简介的。</h2>\n  <p>我有一些空闲要做的事情：</p>\n  <ul>\n    <li>篮球</li>\n \
    \   <li>足球</li>\n    <li>乒乓球</li>\n  </ul>\n  <h3>以下是一些成就</h3>\n  <ol>\n    <li>2011\
    \ 年度年度教师</li>\n    <li>2012 年带领男足球队获得了赛会冠军（赛区锦标赛冠军）</li>\n    <li>2015 年有三位往届学生获得了享有盛誉的奖学金</li>\n\
    \  </ol>\n  <h3>简要传记</h3>\n  <p>我来自达拉斯，Tx。点击<a href=\"http://allascityhall.com/Pages/default.aspx\"\
    >这里</a>了解更多关于达拉斯的信息。</p>\n</body>\n</html>\n```\n\n注意我们是如何将链接嵌入 `<p>` 标签的。通过链接要记住，我们不仅需要添加地址或链接，还必须指定想要显示的链接文本。在这种情况下，之前代码中的“这里”包含了链接，通过点击该词，访问者将被带到该网站。其他文本不是链接的，只是放置在链接文本周围。\n\
    \n"
- fmt: "\nWe will place the `<a>` tags inside of `<p>` tags so that we can control\
    \ their placement. In our opening `<p>` tag, we will add a `center` attribute\
    \ to place it in the middle of the page.\n\n### Code Sample: Adding a new header\
    \ and link\n\n```html\n<p align=\"center\"><a href=\"mailto:contact@learntoprogram.tv\"\
    >\nEmail Me</a></p>\n```\n\nAfter adding that code, please save your code and\
    \ then test it in the browser. The result should resemble this screenshot:\n\n\
    ![](images/00021.jpeg)\n\nFigure 4-7—Screenshot of the current version of our\
    \ site\n\n### Conclusion\n\nGreat work! Don’t worry if it takes you a few tries.\
    \ Learning to code takes considerable trial and error. However, it is the way\
    \ that everyone learns. You can now add links and even allow your visitors to\
    \ email you with one click of their mouse! That is certainly worth the effort\
    \ it took.\n\n## Images: How to Make Your Site Picture Perfect!\n\nAlong with\
    \ links, another cornerstone of every good site is images. The web is a highly\
    \ visual medium. One of the best ways to add an engaging visual flair to your\
    \ site is through the effective use of images. Good images help you to communicate\
    \ messages, evoke emotion, and add additional layers of content to engage your\
    \ audience.\n\nWhen you’d like to add images to your site, you will use the `<img>`\
    \ tag with a `src` attribute. The `src` stands for “Source” and works just like\
    \ the `<a>` tag’s `href` attribute. It tells the image tag where to find the image\
    \ you’d want to include on your page.\n\nBelow is an example of a `<img>` tag.\
    \ You will notice that it does not have a closing tag.\n\n### Code Sample: Example\
    \ image tag\n\n```html\n<img src=\"image url\" alt=\"brief title of image\" width=\"\
    in pixels\" height=\"in pixels\">\n```\n\nLet’s explain the parts of this tag\
    \ in more detail:\n\n- `<img>` will open your tag and element for adding images.\n\
    - `src` is short for source and directs the browser to where it will find an image.\n\
    - `alt` is what appears if there is an issue with displaying the image. It is\
    \ also what will be read by a screen reader.\n- `Width` will contain a number\
    \ which will specify the width of the image (in pixels) that will be displayed.\n\
    - `Height` will contain a number which specify the height of the image (in pixels)\
    \ that will be displayed.\n\nThere are many options that can be used for images.\
    \ However, you will want to always include these basic attributes in every `<img>`\
    \ tag. You want to tell the browser where to get the image, what text to place\
    \ if it has an issue as well as the height and width.\n\n### Sourcing Images\n\
    \nThere are two ways to source images for your site. **Relative addressing** tells\
    \ your browser: “Look in our project folder for the file specified. Or, if a folder\
    \ is specified, look within that folder for the file specified.”\n\nOn the other\
    \ hand, when we link to a source outside of our project, usually another website,\
    \ it is referred to as an **absolute address**.\n\nWe will want to add a profile\
    \ picture to the top of our site. Let’s start with an example of a relative address\
    \ and use an image that we already have.\n\nAt the top of our code, in the `head`\
    \ section right below the `<h2>` tag and above the email address we just added,\
    \ we will build our `<img>` tag so that we have a nice image at the top of our\
    \ page. Go ahead and insert a blank `<img>` tag that looks just like the code\
    \ sample below and we will add to it as we go.\n\n### Code Sample: Blank image\
    \ tag\n\n```html\n<img src=\"\" alt=\"\" width=\"\" height=\"\">\n```\n\nFirst,\
    \ create a new subfolder on your computer inside of the folder you are saving\
    \ your HTML to. This will be the folder we use to place our images.\n\nTo create\
    \ a new folder, go to the folder where you are saving your HTML and CSS and right-click\
    \ any blank area (or press `CTRL` + click). This will create a pop-up menu from\
    \ which you can select new folder.\n\n![](images/00022.jpeg)\n\nFigure 5-1—Creating\
    \ a new folder\n\nName your new folder `images`.\n\nIn your folder, you should\
    \ have an HTML file, a subfolder housing your CSS, and a subfolder with your images.\n\
    \nYou now have a place to save any images that you want to display on your site.\
    \ You can save a few images that you might want to add to your web project to\
    \ this folder. For the purpose of this project, I will save images with a `.jpg`\
    \ extension which indicates that they are JPEG files. Exploring image file types\
    \ will not be discussed here. However, JPEG is a standard and widely used format\
    \ that serves our purposes well. I recommend that you add some images and save\
    \ them to the folder as JPEG files.\n\nI have named my project folder `My_Page`\
    \ and I am keeping my images in a folder titled `images`. To access that folder\
    \ in an `<img>` tag, you can use a line of code like the code sample below. I\
    \ have highlighted the `src` attribute pointing to the `.jpeg` file in our images\
    \ folder.\n\n### Code Sample: Adding sizes to our image\n\n```html\n<head>\n \
    \   <title>My Page</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    css/style.css\">\n</head>\n<body>\n    <h1>Thanks for visiting my page and learning\
    \ more about me! </h1>\n    <h2>This site is designed as a personal profile.</h2>\n\
    \    <img src=\"images/headshot.jpg\" alt=\"headshot\" height=\"250\" width=\"\
    200\">\n    <p align=\"center\"><a href=\"mailto:contact@learntoprogram.tv\">\n\
    Email Me</a></p>\n</body>\n```\n\nAfter adding the image, my site looks like this:\n\
    \n![](images/00023.jpeg)\n\nFigure 5-2—Current version of code after adding `<img>`\n\
    \nDon’t worry if your image isn’t centered above the email address! We will cover\
    \ that soon.\n\nWe will now discuss how to add an image from another website.\
    \ Please find an image online that you would like to use. To be able to use an\
    \ image that is already online, you will need to locate that image address or\
    \ `url`, and place that in your code. This a a very simple process that is outlined\
    \ below. First, put a blank image tag at the bottom of your code below the last\
    \ `<p>` tag and right above the last `</body>` tag.\n\n1. Navigate to the image\
    \ you like\n2. Right click your mouse button while hovering over the image\n\n\
    ![](images/00024.jpeg)\n\nFigure 5-3—copying image address\n\n3. Select “copy\
    \ image address” from the menu that appears\n4. Return to your code, and put your\
    \ cursor between the quotes after `src=`\n5. Right click on your mouse, and press\
    \ paste.\n\nYou should now see the address in your `<img>` tag as part of the\
    \ source.\n\n### Code Sample: Adding image from a url\n\n```html\n<h3> A brief\
    \ Biography</h3>\n<p> I am originally from Dallas, Tx. I have many memories of\
    \ Dallas. Click <a href=\"http://dascityhall.com/Pages/default.aspx\">here</a>\
    \ if you want to learn more about Dallas.</p>\n<img src=\"http://images.freeimages.com/images/previews/67e/1238353.jpg\"\
    \ alt=\"\" width=\"\" height=\"\">\n</body>\n</html>\n```\n\nAfter adding the\
    \ image, our site should resemble the following screen shot.\n\n![](images/00025.jpeg)\n\
    \nFigure 5-4—with image from url added\n"
