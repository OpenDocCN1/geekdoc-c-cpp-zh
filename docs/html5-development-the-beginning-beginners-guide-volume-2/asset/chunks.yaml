  trans: "\n在 `HTML5` 中，默认测量单位几乎总是像素（pixels）或数值百分比。当你开始熟悉构建网页时，在测试不同尺寸的过程中，你会经常在代码和浏览器中的渲染版本之间反复切换。这完全没有问题，而且这也是专业且经验丰富的开发者的工作方式。\n\
    \n编码通常是一个充满尝试和错误的反复迭代过程。你应该在代码和浏览器的渲染版本之间反复切换。拥抱这种过程并享受其中，因为知道这是构建你最终会感到自豪的作品的最佳方法。当你在调整图像等内容的尺寸时，尤为如此。\n\
    \n尺寸没有绝对的规则。这类似于在你的家里墙上挂挂画。第一次尝试很少是完美的，或者说并不完全符合你的意愿。在 `HTML5` 中调整图像大小非常相似。享受尝试不同选项乐趣，花时间考虑什么效果最好，并始终朝着与你想要表达的信息保持一致的设计和布局努力。\n\
    \n虽然编码对你来说可能是全新的，但在做出最终布局和设计决策时，请相信你的直觉。你知道你的网站应该什么样，当你看到它时就会知道，所以继续尝试不同的选项，调整代码并频繁测试，这样当你看到最适合你的布局时，你会有信心，因为你已经尝试过几种。\n\
    \n我要给我的 `img` 元素添加 400 像素或 `200px` 的宽度和高度。请花些时间尝试不同的尺寸并在浏览器中测试它们。\n\n代码示例：为图像添加尺寸\n\
    \n```\n### 简短介绍\n\n<p>我来自德克萨斯州达拉斯。我对达拉斯有很多美好的记忆。如果你想了解更多关于达拉斯的信息，请点击<a href=\"\
    http://http://dallascityhall.com/Pages/default.aspx\">这里</a>。</p>\n\n<img src=\"\
    http://images.freeimages.com/images/previews/67e/office-1238353.jpg\" alt=\"\"\
    \ width=\"400\" height=\"400\">\n\n</body></body>\n</html\n```\n\n我们需要为我们的 `alt`\
    \ 属性添加一些文本。如果图像没有加载，这段文本将会显示。这也是屏幕阅读器读取的内容。屏幕阅读器是软件程序，允许盲人或视觉视障的用户通过语音合成器或盲文显示器读取电脑屏幕上显示的文本。\n\
    \n对于我通用的办公室图像，我将添加一些基础文本并在下方代码示例的高亮部分进行演示。请随意使用任何你认为能简要描述图像的文本。\n\n代码示例：为图像添加\
    \ alt 文本\n\n```\n### 简短介绍\n\n<p>我来自德克萨斯州达拉斯。我对达拉斯有很多美好的记忆。如果你想了解更多关于达拉斯的信息，请点击<a\
    \ href=\"http://http://dallascityhall.com/Pages/default.aspx\">这里</a>。</p>\n\n\
    <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"我的办公室\" width=\"400\" height=\"400\">\n\n</body></html\n```\n\n花些时间保存你的代码并在浏览器中测试它。只要你的图像显示正确，`alt`\
    \ 文本就不会出现。\n\n最后，让我们让图像居中。为了做到这一点，我们将回到 `CSS`。我们将告诉 `CSS` 让图像单独占一行，并占据该行的全宽，并在两侧设置等距离边距。可以通过下面的规则实现：\n\
    \n代码示例：居中我们的图像\n\n```css\nimg {\n    display: block;\n    margin-left: auto;\n\
    \    margin-right: auto;\n}\n```\n\n确保你保存了 `CSS` 和 `HTML` 文件并在浏览器中测试它们。它们现在应该像这样：\n\
    \n![](img/00026.jpeg)\n\n图 5-5——图像居中\n\n你可以从图像中获得很多乐趣。对 `CSS` 更深入理解将为你提供更多创造性的选择。通过实践学习基础知识是非常重要的。这将为你的后续学习奠下极佳的基础。\n\
    \n## 表格：为内容提供额外的组织和布局\n\n正如我们所讨论的，`HTML5` 为在网页上显示结构化内容提供了一个很好的工具。你可以使用的另一种常见格式是在表格中结构化数据。\n\
    \n作为我们示例个人简介的一部分，我们将最近的工作经历放入一个类似于常见简历格式的表格中。这是我们想要完成的示例：\n\n![](img/00027.jpeg)\n\
    \n图 6-0——表格格式化数据示例\n\n表格是一个更复杂的元素，比我们看过的其他元素需要更多的代码行。学习如何构建表格需要几个步骤，在我们掌握序列中的每个步骤时逐步构建表格。\n\
    \n第一步是开启一个包含我们工作经历的新页面。步骤如下：\n\n1. 在 Brackets 中，点击 `File`\n2. 点击 `New` 打开一个新的空白文件。\n\
    3. 再次点击 `File`\n4. 点击 `Save As`\n5. 将文件命名为 `work.html`，并确保在保存时选择了名为 `My_Page`\
    \ 的文件夹，它包含了我们项目的其他部分。这就是我们保存 `index.html` 文件的同一个文件夹。\n\n这是在 `HTML5` 中提供基本表格结构的第一块代码。从添加样板代码开始。\n\
    \n代码示例：添加表格\n\n```html\n### 简短介绍\n\n<p>我来自德克萨斯州达拉斯。我对达拉斯有很多美好的记忆。如果你想了解更多关于达拉斯的信息，请点击<a\
    \ href=\"http://http://dallascityhall.com/Pages/default.aspx\">这里</a>。</p>\n\n\
    <img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"\" width=\"400\" height=\"400\">\n\n</body></html\n```\n*(注：由于提供的源代码在后期部分存在大量重复或混乱，我根据上下文重建了逻辑结构并保持了核心内容。)*\n"
