  trans: '


    在最后一个代码示例中，你还会看到一个 `<textarea>` 标签。你将像往常打开并关闭这个标签。这将创建一个文本框。你需要通过选择行数（rows）和列数（columns）来指定大小。


    在结束 `</form>` 标签之前，你还会看到一个带有 `type="submit"` 属性的 `<input>` 标签。这为我们的用户创建一个通用的提交按钮，用于向我们发送信息，它位于表单底部。在此块中，我们还将关闭表单、`body`
    和 `html` 标签。


    ### 代码示例：我们表单的第一块代码


    ```html

    <fieldset style="width:35%">

    <legend>欢迎添加你对未来博客文章的观点：</legend>

    <textarea rows="5" columns="500"></textarea>

    </fieldset>

    <br><br>

    <input type="submit" value="Submit">

    </form>

    </body>

    ```


    保存你的代码并在浏览器中测试它。它应该像这样：


    ![](img/00036.jpeg)


    图 1-10—添加了文本框


    你现在对表单有了非常良好的基础理解。我们构建了三种不同类型的表单，并将它们整齐地布局在一个带有提交按钮的表单中。干得好！这将让你在未来学习其他技术时乐在其中。它将使你能够在
    `CSS` 中创建额外的样式，并在 `Javascript` 中实现交互，以处理你从访问者那里收到的数据并进一步丰富他们的体验。


    ### 下一步工作


    完成这本书以及我们涵盖的所有练习，你绝对有很多值得骄傲。我深信，在编程方面，通过做来学习是唯一有意义的学习方式。我们确实进行了大量的练习。祝贺你！


    除此之外，我认为构建网页应该是很有趣的。我还将提高你与更广泛观众连接和交流的能力。我鼓励你在这里学到的基础上继续进步，并将其作为继续学习的跳板。


    你现在已经知道了如何在万维网上添加内容的基础知识。你还理解了允许你处理这些内容的标签、元素和属性。你现在可以学习如何使用 `CSS` 对这些内容进行样式设计，这将使你的网页设计充满色彩和创意。你还可以学习
    `Javascript`，这是一种允许网页实现更深层次交互的语言。它能够实现用户与浏览器之间更大的通信，让你的网页元素更加动态。


    想想你学了多少东西——你才刚刚开始！在未来，你的限制将是你自己的奉献精神和想象力。


    前进吧！


