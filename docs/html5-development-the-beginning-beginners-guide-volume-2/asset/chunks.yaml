  trans: "\n我们将 `<a>` 标签放置在 `<p>` 标签内部，这样我们就可以控制它们的位置。在起始的 `<p>` 标签中，我们将添加一个 `center`\
    \ 属性，将其放置在页面的中间。\n\n### 代码示例：添加新的标题和链接\n\n```html\n<p align=\"center\"><a href=\"\
    mailto:contact@learntoprogram.tv\">\n给我发邮件</a></a>></p>\n```\n\n添加该代码后，请保存你的代码并在浏览器中进行测试。结果应该类似于这张截图：\n\
    \n![](img/00021.jpeg)\n\n图 4-7—我们网站当前版本的截图\n\n### 结语\n\n干得好！如果你尝试了好几次，请不要担心。学习编程需要大量的尝试和错误。然而，这是每个人学习的途径。你现在可以添加链接，甚至让你的访问者只需点击鼠标即可向你发送电子邮件！这绝对值得你付出的努力。\n\
    \n## 图片：如何让你的网站图片完美！\n\n除了链接，图片是每个优秀网站的另一个基石。网页是一种高度视觉化的媒介。为你的网站增添迷人视觉效果的最佳方法之一就是有效使用图片。良好的图片可以帮助你传递信息、唤起情感，并增加额外的内容层次来吸引你的观众。\n\
    \n当你想要为网站添加图片时，将使用带有 `src` 属性的 `<img>` 标签。`src` 代表“Source”（源），作用与 `<a>` 标签的 `href`\
    \ 属性相同。它告诉图片标签去哪里寻找你想包含在页面上的图片。\n\n下面是一个 <img> 标签的示例。你会发现它没有闭合标签。\n\n### 代码示例：示例图片标签\n\
    \n```html\n<img src=\"image url\" alt=\"brief title of image\" width=\"in pixels\"\
    \ height=\"in pixels\">\n```\n\n让我们详细解释此标签的各个部分：\n\n- `<img>` 将打开添加图片的标签和元素。\n\
    - `src` 是 source 的缩写，引导浏览器去寻找图片的地方。\n- `alt` 是当图片显示出现问题时显示的文字。它也是屏幕阅读器读取的内容。\n\
    - `Width` 将包含一个数字，指定将显示的图片宽度（像素为单位）。\n- `Height` 将包含一个数字，指定将显示的图片高度（像素为单位）。\n\n\
    图片有很多可选选项。然而，你总是希望在每个 <img> 标签中包含这些基础属性。你想要告诉浏览器从哪里获取图片，如果出现问题时放置什么文字，以及高度和宽度。\n\
    \n### 获取图片来源\n\n获取网站图片来源有两种方法。**相对路径**（Relative addressing）告诉你的浏览器：“在我们项目文件夹中查找指定的文件。或者，如果指定了文件夹，在该文件夹内查找指定的文件。”\n\
    \n另一方面，当我们链接到项目外部来源（通常是另一个网站）时，它被称为**绝对地址**（absolute address）。\n\n我们想在网站顶部添加一张头像。让我们从一个相对地址的示例开始，使用我们已经拥有的图片。\n\
    \n在代码的顶部，在 `<head>` 部分，紧挨在 `<h2>` 标签下方、我们刚刚添加的电子邮件地址上方，我们将构建 `<img>` 标签，这样我们的页面顶部就有一张漂亮的图片。请插入一个类似于下面代码示例的空白\
    \ <img> 标签，我们将边做边添加。\n\n### 代码示例：空白图片标签\n\n```html\n<img src=\"\" alt=\"\" width=\"\
    \" height=\"\">\n```\n\n首先，在保存保存 HTML 的文件夹内部创建一个新的子文件夹。这将是我们用来放置图片的文件夹。\n\n要创建一个新文件夹，转到保存\
    \ HTML 和 CSS 的文件夹，在任何空白区域点击右键（或按 `CTRL` + 点击）。这将弹出一个菜单，你可以在其中选择新建文件夹。\n\n![](img/00022.jpeg)\n\
    \n图 5-1—创建一个新文件夹\n\n将你的新文件夹命名为 `images`。\n\n在你的文件夹中，应该有一个 HTML 文件、一个存放 CSS 的子文件夹和一个存放图片的子文件夹。\n\
    \n你现在有一个地方存放任何你想在网站上显示的图片。你可以将几张可能想要添加到 Web 项目的图片保存到此文件夹。为了本项目，我将保存扩展名为 `.jpg`\
    \ 的图片，这表示它们是 JPEG 文件。这里不会讨论图片文件类型。然而，JPEG 是一种标准且广泛使用的格式，能够很好地满足我们的需求。我建议你添加一些图片并将它们保存为\
    \ JPEG 文件。\n\n我将我的项目文件夹命名为 `My_Page`，并将图片保存在名为 `images` 的文件夹中。要在 <img> 标签中访问该文件夹，你可以使用像代码示例所示的代码。我高亮了指向\
    \ images 文件夹中 .jpeg 文件的 `src` 属性。\n\n### 代码示例：为我们的图片添加尺寸\n\n```html\n<head>\n\
    \    <title>My Page</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    css/style.css\">\n</head>\n<body>\n    <h1>感谢访问我的页面并了解更多关于我的信息！ </h1>\n    <h2>此网站被设计为一个个人简介页。</h2>\n\
    \    <img src=\"images/headshot.jpg\" alt=\"headshot\" height=\"250\" width=\"\
    200\">\n    <p align=\"center\"><a href=\"mailto:contact@learntoprogram.tv\">\n\
    给我发邮件</a></a>></p>\n</body>\n```\n\n在了图片后，我的网站看起来像这样：\n\n![](img/00023.jpeg)\n\
    \n图 5-2—添加 `<img>` 后代码当前版本\n\n如果你的图片没有在电子邮件地址上方居中，请不要担心！我们很快就会涵盖这一点。\n\n我们现在来讨论如何从另一个网站添加图片。请在网上找到一张你想要使用的图片。为了能够使用已经在在线上的图片，你需要找到该图片的地址或\
    \ `url`，并将其放入你的代码中。这是一个非常简单的过程，下文所示。首先，在代码底部的最后一个 `<p>` 标签下方、最后一个 `</body>` 标签上方放置一个空白的图片标签。\n\
    \n1. 导航到你喜欢的图片\n2. 悬停在图片上时点击鼠标右键\n\n![](img/00024.jpeg)\n\n图 5-3—复制图片地址\n\n3.\
    \ 从出现的菜单中选择“复制图像地址”\n4. 回到你的代码，将光标放在 `src=` 后的引号之间\n5. 点击鼠标右键并按粘贴\n\n你现在应该能在你的\
    \ <img> 标签中看到来源的地址。\n\n### 代码示例：从 url 添加图片\n\n```html\n<h3> 简短传</h3>\n<p> 我出生在德州达拉斯。我有许多关于达拉斯的回忆。如果你想了解更多关于达拉斯的信息，请点击<a\
    \ href=\"http://dascityhall.com/Pages/default.aspx\">这里</a>。</p>\n<img src=\"\
    http://images.freeimages.com/images/previews/67e/1238353.jpg\" alt=\"\" width=\"\
    \" height=\"\">\n</body>\n</html>\n```\n\n添加图片后，我们的网站应该类似于下面的截图。\n\n![](img/00025.jpeg)\n\
    \n图 5-4—添加 url 图片后\n\n"
- fmt: "\nDefault measurements are almost always in pixels or in numerical percentages\
    \ in `HTML5`. As you get a feel for building web pages, you will frequently bounce\
    \ back and forth between your code and the rendered version in your browser as\
    \ you test different sizes. Not only is this OK, but it is also how professional\
    \ and experienced developers work.\n\nCoding is often a very iterative process\
    \ filled with trial and error. You should be bouncing back and forth between your\
    \ code and your rendered version in your browser. Embrace it and have fun knowing\
    \ that is the best way to build something that you will ultimately be proud of.\
    \ This is especially true when you are sizing things like images.\n\nThere are\
    \ no absolute rules for sizes. It is similar to hanging pictures on the wall in\
    \ your house. The first attempt is rarely perfect or exactly how you want it.\
    \ Sizing images in `HTML5` is very similar. Have fun trying out different options,\
    \ take time to consider what works best, and always work towards a design and\
    \ layout that is consistent with what you want to communicate.\n\nWhile coding\
    \ might be new for you, trust your instincts when it comes to final layout and\
    \ design decisions. You know what your site should look like, and you will know\
    \ it when you see it, so keep trying different options, tweak the code and test\
    \ it often so that when you see the layout that is perfect for you, you are confident\
    \ because you have tried several.\n\nI am going to add a width and height of 400\
    \ pixels or `200px` to my `img` element. Please take some time to experiment with\
    \ different sizes and test them in your browser.\n\nCode Sample: Adding sizes\
    \ to our image\n\n```\n### A brief Biography\n\n<p>I am originally from Dallas,\
    \ Tx. I have many fond memories of Dallas. Click <a href=\"http://http://dallascityhall.com/Pages/default.aspx\"\
    >here</a> if you want to learn more about Dallas.</p>\n\n<img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"\" width=\"400\" height=\"400\">\n\n</body></body>\n</html>\n```\n\nIt\
    \ is also necessary to add some text for our `alt` attribute. This text will appear\
    \ if our image doesn’t load. It is also what is read by a screen reader. Screen\
    \ readers are software programs that allow blind or visually impaired users to\
    \ read the text that is displayed on the computer screen with a speech synthesizer\
    \ or braille display.\n\nFor my generic office image, I will add some basic text\
    \ and will demonstrate it in the highlighted portion of the code sample below.\
    \ Feel free to use whatever text that you feel briefly describes your image.\n\
    \nCode Sample: Adding alt text to an image\n\n```\n### A brief Biography\n\n<p>I\
    \ am originally from Dallas, Tx. I have many fond memories of Dallas. Click <a\
    \ href=\"http://http://dallascityhall.com/Pages/default.aspx\">here</a> if you\
    \ want to learn more about Dallas. </p>\n\n<img src=\"http://images.freeimages.com/images/previews/67e/office-1238353.jpg\"\
    \ alt=\"My Office\" width=\"400\" height=\"400\">\n\n</body></html>\n```\n\nTake\
    \ a moment to save your code and test it in the browser. As long as your image\
    \ displays correctly, your `alt` text will not appear.\n\nFinally, let’s center\
    \ our images. To do this, we will return to `CSS`. We will tell `CSS` to put the\
    \ image on its own line and to take the full width of that line with an equal\
    \ margin on either side. This can be accomplished with the rule below:\n\nCode\
    \ Sample: Centering our images\n\n```css\nimg {\n    display: block;\n    margin-left:\
    \ auto;\n    margin-right: auto;\n}\n```\n\nMake sure that you save the `CSS`\
    \ and `HTML` files and test them in the browser. They should now appear like this:\n\
    \n![](images/00026.jpeg)\n\nFigure 5-5—With images centered\n\nYou can have a\
    \ lot of fun with images. A deeper understanding of `CSS` will provide you with\
    \ even more creative options. It is important that you are learning the fundamentals\
    \ through practice. This will give you a fantastic foundation for moving forward\
    \ in your learning.\n\n## Tables: Additional organization and layout for your\
    \ content\n\nAs we have discussed, `HTML5` provides a great vehicle for structuring\
    \ content for display on the web. Another common format you have access to is\
    \ structuring data in tables.\n\nAs a part of our sample personal profile, we\
    \ will put our most recent work history into a table similar to a common resume\
    \ format. Here is an example of what we would like to finish with:\n\n![](images/00027.jpeg)\n\
    \nFigure 6-0—Example of data formatted in a table\n\nTables are a more complex\
    \ element that require more lines of code than the other elements we have looked\
    \ at. To learn how to build tables, will require several steps to build the table\
    \ up as we master each step in the sequence.\n\nThe first step is to start a new\
    \ page which will contain our work history. Here are the steps:\n\n1. In Brackets,\
    \ click on `File`\n2. Click on `New` to open a new blank file.\n3. Click on `File`\
    \ again\n4. Click on `Save As`\n5. Name your file `work.html` and make sure when\
    \ you save it that you have selected the folder called `My_Page` that contains\
    \ the rest of our project. This is the same folder where we have saved our `index.html`\
    \ file.\n\nHere is the first block of code which will provide the basic table\
    \ structure in `HTML5`. Start by adding the boilerplate.\n\n Code Sample: Adding\
    \ a table\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Work History</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"style.css\">\n</head>\n<body>\n\
    <table>\n<tr>\n<td>English Teacher</td>\n<td>Lincoln High School</td>\n<td>2015-2016</td>\n\
    </tr>\n</table>\n</body>\n</html>\n```\n*(Wait, the source text had some garbled/repeated\
