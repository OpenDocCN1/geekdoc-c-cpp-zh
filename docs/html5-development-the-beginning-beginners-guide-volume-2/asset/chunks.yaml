    \ to to to is that it is that it is that it is that it is\n\nCSS : Adding a sense\
    \ of style to your page.\n\nMany of the design features and styling that you see\
    \ on the web today comes from Cascading Style Sheets, or `CSS`. As mentioned earlier\
    \ in the book, HTML structures and formats what you want to communicate and `CSS`\
    \ helps you style and present it.\n\nA deep explanation and exploration of `CSS`\
    \ is beyond the scope of this book, but I did want to introduce it so you are\
    \ familiar with how `CSS` rules are structured, and how you will add `CSS` style\
    \ sheets to your HTML documents.\n\nYou will build your `CSS` in a separate file\
    \ that you will link to your HTML file. This process is very simple, and only\
    \ requires you to open a new file in your text editor and to add one line of code\
    \ to the top of your HTML file. Here are the first three steps.\n\n1. In your\
    \ `My_Page` folder, create a new sub-folder and call it `CSS`.\n2. Open a new\
    \ file in your text editor and save it with the filename `style.css`.\n3. Save\
    \ that file to your new `CSS` folder inside of your `My_Page` project.\n\nIt is\
    \ important that you save your file with a `.css` extension and that you save\
    \ it to a sub-folder named `CSS` that is located within your main `My_Page` project\
    \ folder.\n\n![](images/00012.jpeg)\n\nFigure 3-1—Creating a new CSS file\n\n\
    To add our style sheet, we now need to link our `CSS` to our HTML file. I have\
    \ titled my style sheet “style.css”, so I will use that in my code to link the\
    \ two.\n\nIn the `<head>` element of your HTML file, you will add a simple line\
    \ of code to link the two files. Here is sample code for a file named `style.css`\
    \ that is housed in a folder named `CSS`:\n\nCode Sample: Linking CSS to an HTML\
    \ doc\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\"\
    >\n```\n\nThe code to link the `CSS` file and the HTML file should be placed towards\
    \ the top of your HTML file like this:\n\nCode Sample: Adding a CSS rule\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n\n<h1> Thanks for\
    \ visiting my page and learning more about me! </h1>\n\n<h2>This site is designed\
    \ as a personal profile</h2>\n\n<p>I graduated from the University of Texas in\
    \ 2010 with a degree in English. I am an English teacher and soccer coach and\
    \ learning to build web pages.</p>\n\n</body>\n</html>\n```\n\nNow that we have\
    \ looked at our page without the header, we want to return it to the content visitors\
    \ will see in the browser. We need to remove the comment from our code. To do\
    \ this, we will simply highlight the code we want to remove the comment tags from,\
    \ in this case our `<h2>` tags, and press `Ctrl` + `/` again. After doing this,\
    \ our code should look like the following sample.\n\nCode Sample: Uncommenting\
    \ out a line of code\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n\
    </head>\n<body>\n\n<h1>Thanks for visiting my page and learning more about me!\
    \ </h1>\n\n<h2>This site is designed as a personal profile.</h2>\n\n<p> I graduated\
    \ from the University of Texas in 2010 with a degree in English. I am an English\
    \ teacher and soccer coach and learning to build web pages.</p>\n\n</body>\n</html>\n\
    ```\n\nCongratulations! You are now developing skills used every day by professional\
    \ developers. The ability to use comments and understand the role of browsers\
    \ and text editors will serve you well on this project and beyond as you build\
    \ fun, exciting and creative web pages.\n\n# CSS: Adding a sense of style to your\
