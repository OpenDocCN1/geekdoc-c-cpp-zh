  raw: 'In Brackets. (and several other text editors) there is a simple keyboard shortcut
    to work with comments. Simply highlight the area you want to comment and press
    Ctrl and / (Command and / on a Mac) at the same time.  You should see the comment
    tags appear and your text in that section should turn gray. There will be times
    where you want to “comment out” code as you are working back and forth with page
    designs. Let’s say that after adding our secondary header tag, you want to look
    at the page with and without the header. Here is how our page currently renders:


    ![](images/00010.jpeg)


    Figure 2-1—Current version of page


    Now, let’s “comment out” our <h2> tag. I will highlight that <h2> tag with my
    cursor, and press Ctrl + /


    I have highlighted in yellow, the line we are commenting out in the code sample
    below.


    Code Sample: Commenting out a line of code


    <h1>Thanks for visiting my page and learning more about me!</h1>


    <!--<h2>This site is designed as a personal profile<h2>-->


    </head>


    <body>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    When we now render our page to the browser, you will notice it simply removed
    that line of code from what it renders to the browser:


    ![](images/00011.jpeg)


    Figure 2-2—Results from commenting out a line of code


    Now that we have looked at our page without the header, we want to return it to
    the content visitors will see in the browser. We need to remove the comment from
    our code. To do this, we will simply highlight the code we want to remove the
    comment tags from, in this case our <h2> tags, and press Ctrl + / again. After
    doing this, our code should look like the following sample.


    Code Sample: Uncommenting out a line of code


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    </head>


    <body>


    <h1>Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile.</h2>


    <p> I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>


    </html>


    Congratulations! You are now developing skills used every day by professional
    developers. The ability to use comments and understand the role of browsers and
    text editors will serve you well on this project and beyond as you build fun,
    exciting and creative web pages.


    CSS : Adding a sense of style to your page


    One of the best parts of building web pages is that it offers both an opportunity
    to work in a standard format which anyone can learn. At the same time, it offers
    a great deal of flexibility and options to build design elements which give everyone
    a chance to reflect their own content communicated in a way that is not only effective,
    but also creative and engaging.


    Many of the design features and styling that you see on the web today comes from
    Cascading Style Sheets, or CSS. As mentioned earlier in the book, HTML structures
    and formats what you want to communicate and CSS helps you style and present it.


    A deep explanation and exploration of CSS is beyond the scope of this book, but
    I did want to introduce it so you are familiar with how CSS rules are structured,
    and how you will add CSS style sheets to your HTML documents.


    You will build your CSS in a separate file that you will link to your HTML file.
    This process is very simple, and only requires you to open a new file in your
    text editor and to add one line of code to the top of your HTML file. Here are
    the first three steps.


    1.  In your My_Page folder, create a new sub-folder and call it CSS.


    2.  Open a new file in your text editor and save it with the filename style.css.


    3.  Save that file to your new CSS folder inside of your My_Page project.


    It is important that you save your file with a .css extension and that you save
    it to a sub-folder named CSS that is located within your main My_Page project
    folder.


    ![](images/00012.jpeg)


    Figure 3-1—Creating a new CSS file


    To add our style sheet, we now need to link our CSS to our HTML file. I have titled
    my style sheet “style.css”, so I will use that in my code to link the two. 


    In the <head> element of your HTML file, you will add a simple line of code to
    link the two files. Here is sample code for a file named style.css that is housed
    in a folder named CSS:


    Code Sample: Linking CSS to an HTML doc


    <link rel="stylesheet" type="text/css" href="css/style.css">


    The code to link the CSS file and the HTML file should be placed towards the top
    of your HTML file like this:


    Code Sample: Adding a CSS rule


    <!DOCTYPE html>


    <html>


    <head>


    <title>My Page</title>


    <link rel="stylesheet" type="text/css" href="css/style.css">


    </head>


    <body>


    <h1> Thanks for visiting my page and learning more about me! </h1>


    <h2>This site is designed as a personal profile</h2>


    <p>I graduated from the University of Texas in 2010 with a degree in English. 
    I am an English teacher and soccer coach and learning to build web pages.</p>


    </body>


    </html>


    When you add this code and click save on both files, the two files will be linked.
    Make sure that both the CSS and HTML files are saved inside of the same project.


    CSS will describe to the browser how your HTML elements should be presented. Most
    commonly, CSS is used to control color, fonts and layout. 


    While HTML is mostly added through tags, CSS uses what is known as rules. CSS
    rules generally follow a very simple and standard format which will help you in
    your ability to begin using them right away.


    ![](images/00013.jpeg)


    Figure 3-2—Structure of CSS rules


    As you can see in the image, CSS rules primarily consist of three basic elements:
    a selector, property, and value.


    The selector is the HTML element that you are styling. For example, if you were
    styling your primary header, your selector would simply be h1.


    The property is the type of style you want to add to it. If you wanted to add
    text, your property would be color.


    The value is the specific nature of that styling that will be applied. This would
    represent the type or shade of color in our example.


    Go ahead and add the code sample shown below to the top of your CSS file.


    Code Sample: Adding a CSS rule


    h1 {


        color: blue;


    }


    At this point, save both your HTML file and CSS sheet and test your code in the
    browser. It should now have a blue header, just like this!


    ![](images/00014.jpeg)


    Figure 3-3—Styling text color with our new CSS rule


    I hope that you are excited and feel a genuine sense of accomplishment. Adding
    CSS to your page is fun and helps you add your own unique style. There  are many
    options with fonts and colors and the ways you can use your CSS and HTML together.
    CSS is a course on its own and I encourage you to continue to pursue learning
    CSS so that you can get the most out of your web designs.


    Let’s add one more rule to help us with changing a font, a common use of CSS.


    Below your h1 rule, we will add a rule for body indicating the font we want on
    your CSS sheet.


    Code Sample: Adding a CSS rule  for font styling


    body {


        font-family:  Arial, Helvetica, sans-serif


    }


    It is possible to change the font faces with the font-family property. CSS provides
    several options that make it possible to adjust typography. The font of all the
    elements in the body will be changed to Arial., We will use Helvetica as a back-up.Our
    page should now appear like this:


    ![](images/00015.jpeg)


    Figure 3-4—Styling font with our new CSS rule


    How to present lists of information In its simplest form, a webpage is a vehicle
    for communicating information. When communicating, it is often helpful to organize
    certain pieces of information or data into lists. Fortunately, HTML5 provides
    a very convenient way to accomplish this with the ordered and unordered list elements.'
