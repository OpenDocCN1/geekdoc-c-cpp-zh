    In this last sample of code, you will also see a `<textarea>` tag. You will open
    and close this tag as normal. This creates the text box. You will need to indicate
    a size by selecting a number of rows and columns.


    Before the closing `</form>` tag you will also see an `<input>` tag with an attribute
    of `type="submit"`. This creates a generic submit button for our users to send
    us their information which will live at the bottom of our form. In this block,
    we will also close our form, `body` and `html` tags.


    ### Code Sample: First block of code for our forms


    ```html

    <fieldset style="width:35%">

    <legend>Feel free to add your ideas about future blog posts:</legend>

    <textarea rows="5" columns="500"></textarea>

    </fieldset>

    <br><br>

    <input type="submit" value="Submit">

    </form>

    </body>

    ```


    Save your code and test it on the browser. It should appear like this:


    ![](images/00036.jpeg)


    Figure 1-10—With text box added


    You now have an excellent foundational understanding of forms. We have built three
    different types of forms, and cleanly laid them out inside of one form with a
    submit button. Great work! This will allow you to have fun as you learn other
    technologies in the future. It will enable you to create additional styling in
    `CSS` and interactivity in `Javascript` to work with the data you receive from
    visitors and to further enrich their experience.


    ### Next Steps


    You certainly have much to be proud of in completing this book and all of the
    exercises we covered. I truly believe that when it comes to coding, learning by
    doing is the only meaningful way to learn. We have certainly gotten a lot of practice.
    Congratulations!


    Beyond that, I think building web pages should be fun. I will also improve your
    ability to connect and to communicate with wider audiences. I encourage you to
    build on what you have learned here and to use it as a springboard to continue
    your learning.


    You now know the basics of how to add content on the World Wide Web. You also
    understand the tags, elements and attributes that will allow you to work with
    that content. You can now learn how to style that content with `CSS` which will
    make your web designs come to life with color and creativity. You can also learn
    `Javascript` which is the language that allows for deeper levels of interactivity
    on the web. It enables greater communication with the user and browser to make
    your web elements more dynamic.


    Just think about how much you have learned—You have only just started! In the
    future, you will only be limited by your own dedication and imagination.


    Onward!


