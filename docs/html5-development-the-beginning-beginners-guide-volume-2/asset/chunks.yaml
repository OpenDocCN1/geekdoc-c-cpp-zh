- fmt: "\nIf you are simply bulleting information, and the sequence of the items is\
    \ not important, you will list items in an unordered list. Unordered lists will\
    \ have an opening `<ul>` and closing `</ul>` tag format that should now be familiar\
    \ to you.\n\nWhen we build a list, we will also add tags to each item in the list.\
    \ The list tags will open `<li>` and close `</li>` around each listed item. An\
    \ easy way to think about this is to consider the `<ul>` tag as declaring that\
    \ a list will be built, and each `<li>` tag is nested within the larger list.\
    \ Here is a sample of a blank list showing the tags we would use for a three item\
    \ unordered list:\n\n### Code Sample: Adding unordered lists\n\n```html\n<ul>\n\
    \  <li></li>\n  <li></li>\n  <li></li>\n</ul>\n```\n\nAdding ordered lists, which\
    \ is a list where items need to have a certain sequence reflected, follows a similar\
    \ pattern. However, with an ordered list, we will declare a list with an opening\
    \ `<ol>` tag to represent the fact we now want an ordered list. We will close\
    \ it with a `</ol>` tag in typical fashion.\n\nWe will nest the list items with\
    \ an ordered list the same way we do with an unordered list. Here is a code sample\
    \ of a blank ordered list:\n\n### Code Sample: Adding an ordered list\n\n```html\n\
    <ol>\n  <li></li>\n  <li></li>\n  <li></li>\n</ol>\n```\n\nNow, let’s return to\
    \ our profile page and add some lists! We will head back to where we left off\
    \ after we added the code to link our style sheet. Your code should look like\
    \ the below sample:\n\n### Code Sample: Current status of code for personal profile\
    \ project\n\n```html\n<html>\n<head>\n  <title>My Page</title>\n  <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n  <h1>Thanks\
    \ for visiting my page and learning more about me! </h1>\n  <h2>This site is designed\
    \ as a personal profile.</h2>\n  <p>I graduated from the University of Texas in\
    \ 2010 with a degree in English. I am an English teacher and soccer coach and\
    \ learning to build web pages.</p>\n</body>\n</html>\n```\n\nLet’s add some fun\
    \ details including our interests and hobbies so that visitors to our page get\
    \ a sense of our personality. Below our paragraph element, I am going to add an\
    \ unordered list with three things that I like to do in my spare time. I will\
    \ also add a sentence to my paragraph element to introduce the list below it.\
    \ I have highlighted the code that is new in this step. After adding a sentence\
    \ to my paragraph element and an unordered list, my code will now look like this:\n\
    \n### Code Sample: Adding an unordered list\n\n```html\n<html>\n<head>\n  <title>My\
    \ Page</title>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\"\
    >\n</head>\n<body>\n  <h1>Thanks for visiting my page and learning more about\
    \ me! </h1>\n  <h2>This site is designed as a personal profile.</h2>\n  <p> I\
    \ graduated from the University of Texas in 2010 with a degree in English. I am\
    \ an English teacher and soccer coach and learning to build web pages. Here are\
    \ some things I like to do in my free time:</p>\n  <ul>\n    <li>basketball</li>\n\
    \    <li>soccer </li>\n    <li>table tennis </li>\n  </ul>\n</body>\n</html>\n\
    ```\n\nAt this point, you will be able to save your file and test your code in\
    \ the browser. After doing so, here is what mine looks like:\n\n![](images/00016.jpeg)\n\
    Figure 4-1—Adding lists\n\nFantastic work! It looks so good we should add another!\n\
    \nLet’s add some professional accomplishments. Due to the nature of the list,\
    \ and the fact we want to prioritize what we are most proud of in our career,\
    \ we want to list these next elements in order. As we now know, that calls for\
    \ an ordered list.\n\nTo introduce this list, instead of adding text in a paragraph\
    \ tag, we will add a new header. Let’s add an `<h3>` to introduce our list, and\
    \ then nest our list `<li>` elements inside of our ordered list opening `<ol>`\
    \ and closing `</ol>` tags.\n\nFirst, I’ll add a header indicating to our visitors\
    \ that we are going to list career accomplishments. We will add this tag right\
    \ under the unordered list that we just added.\n\n### Code Sample: Adding an additional\
    \ header\n\n```html\n<h3>Below are some of my career accomplishments</h3>\n```\n\
    \nNow we will build our ordered list. These items will be placed in sequence on\
    \ our page. It should be identical in basic format to our unordered list except\
    \ for the `<ol>` tags in place of the `<ul>` tags. Here is the code that we will\
    \ place right below the heading tag we just added.\n\n### Code Sample: Adding\
    \ an ordered list\n\n```html\n<ol>\n  <li>Teacher of the year in 2011</li>\n \
    \ <li> Coached the Boy's soccer team to the conference title in 2012</li>\n  <li>Three\
    \ former students received prestigious scholarships in 2015</li>\n</ol>\n```\n\
    \nThis is excellent progress! We now have headers, a basic style sheet added,\
    \ some content and two different lists (unordered and ordered). We have headers.\
    \ \n\n### Code Sample: Current status of code for personal profile project\n\n\
    ```html\n<html>\n<head>\n  <title>My Page</title>\n  <link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"css/style.css\">\n</head>\n<body>\n  <h1>Thanks for\
    \ visiting my page and learning more about me! </h1>\n  <h2>This site is designed\
    \ as a personal profile.</h2>\n  <p> I graduated from the University of Texas\
    \ in 2010 with a degree in English. I am an English teacher and soccer coach and\
    \ learning to build web pages. Here are some things I like to do in my free time:</p>\n\
    \  <ul>\n    <li>basketball</li>\n    <li>soccer </li>\n    <li>table tennis </li>\n\
    \  </ul>\n  <h3>Below are some of my career accomplishments</h3>\n  <ol>\n   \
    \ <li>Teacher of the year in 2011</li>\n    <li> Coached the Boy's soccer team\
    \ to the conference title in 2012</li>\n    <li>Three former students received\
    \ prestigious scholarships in 2015</li>\n  </ol>\n</body>\n</html>\n```\n"
