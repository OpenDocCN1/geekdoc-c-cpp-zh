- fmt: "\nIn Brackets. (and several other text editors) there is a simple keyboard\
    \ shortcut to work with comments. Simply highlight the area you want to comment\
    \ and press `Ctrl` and `/` (`Command` and `/` on a Mac) at the same time. You\
    \ should see the comment tags appear and your text in that section should turn\
    \ gray. There will be times where you want to “comment out” code as you are working\
    \ back and forth with page designs. Let’s say that after adding our secondary\
    \ header tag, you want to look at the page with and without the header. Here is\
    \ how our page currently renders:\n\n![](images/00010.jpeg)\n\nFigure 2-1—Current\
    \ version of page\n\nNow, let’s “comment out” our `<h2>` tag. I will highlight\
    \ that `<h2>` tag with my cursor, and press `Ctrl` + `/`.\n\nI have highlighted\
    \ in yellow, the line we are commenting out in the code sample below.\n\nCode\
    \ Sample: Commenting out a line of code\n\n```html\n<h1>Thanks for visiting my\
    \ page and learning more about me!</h1>\n\n<!--<h2>This site is designed as a\
    \ personal profile<h2>-->\n\n</head>\n\n<body>\n\n<p>I graduated from the University\
    \ of Texas in 2010 with a degree in English. I am an English teacher and soccer\
    \ coach and learning to build web pages.</p>\n```\n\nWhen we now render our page\
    \ to the browser, you will notice it simply removed that line of code from what\
    \ it renders to the browser:\n\n![](images/00011.jpeg)\n\nFigure 2-2—Results from\
    \ commenting out a line of code\n\nNow that we have looked at our page without\
    \ the header, we want to return it to the content visitors will see in the browser.\
    \ We need to remove the comment from our code. To do this, we will simply highlight\
    \ the code we want to remove the comment tags from, in this case our `<h2>` tags,\
    \ and press `Ctrl` + `/` again. After doing this, our code should look like the\
    \ following sample.\n\nCode Sample: Uncommenting out a line of code\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n</head>\n<body>\n\n<h1>Thanks\
    \ for visiting my page and learning more about me! </h1>\n\n<h2>This site is designed\
    \ as a personal profile.</h2>\n\n<p> I graduated from the University of Texas\
    \ in 2010 with a degree in English. I am an English teacher and soccer coach and\
    \ learning to build web pages.</p>\n\n</body>\n</html>\n```\n\nCongratulations!\
    \ You are now developing skills used every day by professional developers. The\
    \ ability to use comments and understand the role of browsers and text editors\
    \ will serve you well on this project and beyond as you build fun, exciting and\
    \ creative web pages.\n\n# CSS: Adding a sense of style to your page\n\nOne of\
    \ the best parts of building web pages is that it offers both opportunity to work\
    \ in a standard format which anyone can learn. At the same time, it offers a great\
    \ deal of flexibility and options to build design elements which give everyone\
    \ a chance to reflect their own content communicated in a way that is not only\
    \ effective, but also creative and engaging.\n\nMany of the design features and\
    \ styling that you see on the web today comes from Cascading Style Sheets, or\
    \ `CSS`. As mentioned earlier in the book, HTML structures and formats what you\
    \ want to communicate and `CSS` helps you style and present it.\n\nA deep explanation\
    \ and exploration of `CSS` is beyond the scope of this book, but I did want to\
    \ introduce it so you are familiar with how `CSS` rules are structured, and how\
    \ you will add `CSS` style sheets to your HTML documents.\n\nYou will build your\
    \ `CSS` in a separate file that you will link to your HTML file. This process\
    \ is very simple, and only requires you to open a new file in your text editor\
    \ and to add one line of code to the top of your HTML file. Here are the first\
    \ three steps:\n\n1. In your `My_Page` folder, create a new sub-folder and call\
    \ it `CSS`.\n2. Open a new file in your text editor and save it with the filename\
    \ `style.css`.\n3. Save that file to your new `CSS` folder inside of your `My_Page`\
    \ project.\n\nIt is important that you save your file with a `.css` extension\
    \ and that you save it to a sub-folder named `CSS` that is located within your\
    \ main `My_Page` project folder.\n\n![](images/00012.jpeg)\n\nFigure 3-1—Creating\
    \ a new CSS file\n\nTo add our style sheet, we now need to link our `CSS` to our\
    \ HTML file. I have titled my style sheet “style.css”, so I will use that in my\
    \ code to link the two.\n\nIn the `<head>` element of your HTML file, you will\
    \ add a simple line of code to link the two files. Here is sample code for a file\
    \ named `style.css` that is housed in a folder named `CSS`:\n\nCode Sample: Linking\
    \ CSS to an HTML doc\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"\
    css/style.css\">\n```\n\nThe code to link the `CSS` file and the HTML file should\
    \ be placed towards the top of your HTML file like this:\n\nCode Sample: Adding\
    \ a CSS rule\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"css/style.css\">\n</head>\n\
    <body>\n\n<h1> Thanks for visiting my page and learning more about me! </h1>\n\
    \n<h2>This site is designed as a personal profile</h2>\n\n<p>I graduated from\
    \ the University of Texas in 2010 with a degree in English. I am an English teacher\
    \ and soccer coach and learning to build web pages.</p>\n\n</body>\n</html>\n\
    ```\n\nAt this point, save both your HTML file and CSS sheet and test the code\
    \ in the browser. It should now have a blue header, just like this!\n\n![](images/00014.jpeg)\n\
    \nFigure 3-4—Styling font with our new CSS\n\nThe code to link the `CSS` file\
    \ and the HTML file should be placed towards the top of your HTML file like this:\n\
    \nWhen you add both your HTML file and CSS sheet, the will will be.... is is,\
    \ to,,,,,,,,,,,, to to to to to.. to to to to to to.....\n\n\n\n\n\n\n\n000000001--3--—\
    \ of ofCSS`\n\nAs you can see in the image, `CSS` rules primarily consist of three\
    \ basic elements: selector, property, and value.\n\nThe selector is the HTML element\
    \ you are are. For example,, you were were ` ``,`, selector ` ` ``.`.\n\n\n\n\
    \ property property property property property you to you....... the the the value\
    \ value is the the the the the the the the the the\n\n\n\n\n\n\n\n\n\n\n\nThe\
    \ value is the specific nature of styling that will be applied. This would represent\
    \ the type of color in our example. Go ahead and add the code sample shown below\
    \ to the top of your `CSS` file.\n\nCode Sample: Adding a CSS rule\n\n```css\n\
    h1 {\n  color: blue;\n}\n```\n\nAt this point, save both your HTML file and CSS\
