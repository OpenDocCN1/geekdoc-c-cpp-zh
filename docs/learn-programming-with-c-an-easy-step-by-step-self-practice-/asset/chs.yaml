  ```\n\n\n\n\n\n# 问题-10\n\n达卡大学电子与电气工程系（EEE）的期末考试试卷已由两位考官独立进行阅卷。任何课程的最终得分将为两位评分分数的平均值。但如果他们对某份特定试卷的分数差异达到\
  \ 20% 或以上，则该试卷将由另一个独立的第三位考官进行评估。该课程的最终得分将分数接近的两位考官分数的平均值。编写一个程序读取以下数据并确定：**\n\n\
  1. 特特定试卷是否需要进行第三次考试。\n2. 如果需要，该课程每位学生在第三次考试后的最终得分（满分 70 分）。\n\n| 学号. | 第一位考官 | 第二位考官\
  \ | 学号. | 第一位考官 | 第二位考官 |\n| --- | --- | --- | --- | --- | --- |\n| 1001 | 65 |\
  \ 58 | 1004 | 68 | 48 |\n| 1002 | 55 | 54 | 1005 | 50 | 52 |\n| 1003 | 40 | 30 |\
  \ 1006 | 15 | 32 |\n\n## 解决方案的流程图：\n\n图 5.4 显示了解决此问题遵循的流程图。\n\n![](img/fig5_4.jpg)\
  \ ![](img/fig5_4a.jpg) ![](img/fig5_4b.jpg)\n\n图 5.4 解决该问题遵循的流程图。\n\n## 解决方案的算法：\n\
  \n* 步骤-1: 开始\n* 步骤-2: 定义结构体 `marks`，成员为 `roll`、`marks1`、`marks2`、`marks3`、`third`\
  \ 和 `marksfinal`\n* 步骤-3: 初始化 `ind←0`\n* 步骤-4: 读取 `numstd` 和 `markstot` 的值\n* 步骤-5:\
  \ 初始化 `i←0`\n* 步骤-6: 如果 `i<numstd`\n    * 6.1: 读取 `stud[i].roll`、`stud[i].marks1`\
  \ 和 `stud[i].marks2` 的值\n    * 6.2: 如果 `|stud[i].marks1−stud[i].marks2|×100/markstot>=20.0`\n\
  \        * 6.2.1: `stud[i].third←1`\n        * 6.2.2: `ind←1`\n        * 6.2.3:\
  \ 转到步骤-6.4\n    * 6.3: `stud[i].third←0`\n    * 6.4: `i←i+1`\n    * 6.5: 转到步骤-6\n\
  * 步骤-7: 初始化 `i←0`\n* 步骤-8: 如果 `i<numstd`\n    * 8.1: 如果 `stud[i].third=0`\n    \
  \    * 8.1.1: `stud[i].marksfinal←(stud[i].marks1+stud[i].marks2)/2`\n        *\
  \ 8.1.2: 显示 `stud[i].roll`、`stud[i].marks1`、`stud[i].marks2` 和 `stud[i].marksfinal`\
  \ 的值\n        * 8.1.3: 转到步骤-8.3\n    * 8.2: 显示 `stud[i].roll`、`stud[i].marks1` 和\
  \ `stud[i].marks2` 的值，以及“Required”\n    * 8.3: `i←i+1`\n    * 8.4: 转到步骤-8\n* 步骤-9:\
  \ 如果 `ind!=1`\n    * 9.1: 显示“no third examination”\n    * 9.2: 转到步骤-14\n* 步骤-10:\
  \ 初始化 `i←0`\n* 步骤-11: 如果 `i<numstd`\n    * 11.1: 如果 `stud[i].third=1`\n        *\
  \ 11.1.1: 读取 `stud[i].marks3` 的值\n        * 11.1.2: `diff12←|stud[i].marks1−stud[i].marks2|`\n\
  \        * 11.1.3: `diff23←|stud[i].marks2−stud[i].marks3|`\n        * 11.1.4: `diff31←|stud[i].marks1−stud[i].marks3|`\n\
  \        * 11.1.5: 如果 `diff23=diff31`\n            * 11.1.5.1: `stud[i].marksfinal←stud[i].marks3`\n\
  \            * 11.1.5.2: 转到步骤-11.2\n        * 11.1.6: `min←minfn(diff12, diff23,\
  \ diff31)`\n            * 11.1.6.1: 如果 `min=diff12`\n                * 11.1.6.1.1:\
  \ `stud[i].marksfinal←(stud[i].marks1+ stud[i].marks2)/2`\n                * 11.1.6.1.1:\
  \ 转到步骤-11.2\n            * 11.1.6.2: 如果 `min=diff23`\n                * 11.1.6.2.1:\
  \ `stud[i].marksfinal←(stud[i].marks2+ stud[i].marks3)/2`\n                * 11.1.6.2.2:\
  \ 转到步骤-11.2\n            * 11.1.6.3: `stud[i].marksfinal←(stud[i].marks3+ stud[i].marks1)/2`\n\
  \    * 11.2: `i←i+1`\n    * 11.3: 转到步骤-11\n* 步骤-12: 初始化 `i←0`\n* 步骤-13: 如果 `i<numstd`\n\
  \    * 13.1: 如果 `stud[i].third=1`\n        * 13.1.1: 显示 `stud[i].roll`、`stud[i].marks1`、`stud[i].marks2`、`stud[i].marks3`\
  \ 和 `stud[i].marksfinal` 的值\n        * 13.1.2: 转到步骤-14.3\n    * 13.2: 显示 `stud[i].roll`、`stud[i].marks1`、`stud[i].marks2`\
  \ 和 `stud[i].marksfinal` 的值\n    * 13.3: `i←i+1`\n    * 13.4: 转到步骤-13\n* 步骤-14:\
  \ \n\n######## `minfn(x, y, z)` 的算法：\n\n* 步骤-1: 定义并初始化 `min1←x`\n* 步骤-2: 如果 `y<min1`\n\
  \    * 2.1: `min1←y`\n* 步骤-3: 如果 `z<min1`\n    * 3.1: `min1←z`\n* 步骤-4: 返回 `min1`\
  \ 的值\n\n#### 解决方案的代码：\n\n![](img/fig238.jpg) ![](img/fig239.jpg) ![](img/fig240.jpg)\
