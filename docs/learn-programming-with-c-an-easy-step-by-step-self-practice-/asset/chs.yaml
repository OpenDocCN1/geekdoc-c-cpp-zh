  \ 的值替换了第四个 `%d`，换行符替换了 `\\n`，制表符替换了 `\\t`*/\n\t\t}\n\t\telse\n\t\t/*如果上述 `if` 条件为假，执行后续语句*/\n\
  \t\t\tprintf(“%d\\t\\t%d\\t\\t%d\\t\\t%s\\n”, stud[i].roll, stud[i].marks1, stud[i].marks2,\
  \ “Required”);\n\t\t\t/*输出函数 `printf()` 将 `stud[i].roll` 的值显示在屏幕上以替换第一个格式说明符 `%d`，`stud[i].marks1`\
  \ 的值替换第二个 `%d`，`stud[i].marks2` 的值替换第三个 `%d`，`Required` 替换 `%s`；此外，换行符替换了 `\\n`，制表符替换了\
