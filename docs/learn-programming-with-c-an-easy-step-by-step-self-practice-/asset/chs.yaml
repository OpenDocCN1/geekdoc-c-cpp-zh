  /*此处使用 `struct` 关键字定义了结构化数据类型 subject；其成员在花括号内声明*/\n\tint mark;\n\t/*声明整数型变量 `mark`\
  \ 为数据类型 `struct subject` 的成员*/\n\tfloat point;\n\t/*声明浮点型变量 `point` 为数据类型 `struct\
