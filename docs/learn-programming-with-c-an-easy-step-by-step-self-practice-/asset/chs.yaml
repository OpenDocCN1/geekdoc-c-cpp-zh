  \t\t\tstr[k]=ch;\n\t\t\t/*输入的字符 `ch` 存储在数组 `str[]` 中；在第一次迭代中，ch 保存在 `str[0]` 中，第二次迭代在\
  \ `str[1]` 中，以此此类推*/\n\t\t\tch=getchar();\n\t\t\t/*函数 `getchar()` 从输入终端读取单个字符并赋值给\
  \ `ch`；`getchar()` 函数会立即在输出屏幕上回显输入的字符并等待读取另一个字符*/\n\t\t}\n\t\t/*这个右大括号指定了 for 循环的结束*/\n\
  \t\tstr[k]='\\0';\n\t\t/*数组的最后一个字符设置为 NULL 以定义为字符串*/\n\t\tif (str[0]=='\\0')\n\t\
  \t/*如果在任何行的开头按了回车键，则此条件为真并执行后续语句*/\n\t\t\tbreak;\n\t\t\t/*程序控制流立即退出 ‘while’ 循环*/\n\
  \t\telse {\n\t\t\t/*如果一行的第一个字符不是换行符，则 ‘if’ 条件为假，并执行 else 体内的后续语句*/\n\t\t\tword++;\n\
  \t\t\t/*该语句计算一行的第一个单词；如果一行的第一个字符不是 ‘\\0’，则该行至少有一个单词，单词数加 1*/\n\t\t\tfor (i=0; str[i]!='\\\
  0'; i++) {\n\t\t\t/*这个 for 循环用于顺序计算文本中每行除第一个单词以外的每个单词；`i=0` 是初始化，`str[i]!='\\0'`\
  \ 是条件，`i++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果我们还没有到达行尾，则条件为真并执行体内的语句；现在，在重新检查条件之前 `i`\
  \ 的值加 1；这些步骤一直持续直到条件变为假，此时程序流退出循环*/\n\t\t\t\tif (str[i]==' '||str[i]=='\\t')\n\t\
  \t\t\t/*如果在行的任何地方遇到空格或制表符，则上述条件为真并执行后续语句*/\n\t\t\t\t\tword++;\n\t\t\t\t\t/*单词数加\
  \ 1*/\n\t\t\t}\n\t\t\t/*这是 ‘for (i=0; str[i]!='\\0'; i++)’ 循环的结束*/\n\t\t}\n\t\t\
  /*这是 else 条件的结束*/\n\t\tline=line+1;\n\t\t/*在任何字符后遇到回车键即为一行；程序流退出第一个 ‘for’ 循环并跳过\
  \ ‘if’ 中的 break 语句；这里的行数加 1*/\n\t\tchnm+=strlen(str);\n\t\t/*函数 `strlen()` 返回行 `str`\
  \ 中的字符数，该数字加到 `chnm` 中并将总和存储在 `chnm` 中*/\n\t}\n\tprintf(\"Number of lines: %d\\\
  n\", line);\n\tprintf(\"Number of words: %d\\n\", word);\n\tprintf(\"Number of characters:\
  \ %d\\n\", chnm);\n\treturn 0;\n}\n```\n\n## 练习\n\n1. 数组索引从什么开始\n\t1. -1\n\t2. 0\n\
