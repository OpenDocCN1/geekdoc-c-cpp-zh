  图 2.5 显示了解决此问题遵循的流程图。\n\n![](img/fig2_5.jpg)\n\n图 2.5 解决问题的流程图。\n\n#### 解决方案的算法：\n\
  \n- 步骤-1：开始\n- 步骤-2：初始化 `ch←‘y’`\n- 步骤-3：如果 `ch≠‘n’`\n    - 3.1：读取 `num1`、`num2`\
