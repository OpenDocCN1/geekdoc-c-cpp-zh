  \tscanf(“%d”, &markstot);\n\t/*函数 `scanf()` 从输入终端读取一个整数并将其存储在为变量 `markstot` 分配的内存空间*/\n\
  \tfor (i=0; i<numstd; i++){\n\t/*此处 `i=0` 是初始化，`i<numstd` 是条件，`i++` 是递增；初始化在循环开始执行一次；然后检查条件，如果为真则执行花括号内的语句，并在重新检查条件之前将\
  \ `i` 的值加 1；这些步骤一直持续直到条件变为假，此时程序控制流退出循环*/\n\t\tprintf(“\\nEnter roll no. of student\
  \ #%d: ”, i+1);\n\t\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上，但 `i+1` 的值替换了格式说明符 `%d`，换行符替换了\
  \ `\\n`*/\n\t\tscanf(“%d”, &stud[i].roll);/*此 `scanf()` 函数从输入终端读取一个整数并将其存储在 `struct\
  \ marks` 类型数组 `stud[]` 的成员 `roll` 中*/\n\t\tprintf(“Enter marks of 1st examiner:\
  \ ”);\n\t\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上*/\n\t\tscanf(“%d”, &stud[i].marks1);\n\
  \t\t/*此 `scanf()` 函数从输入终端读取一个整数并将其存储在 `struct marks` 类型数组 `stud[]` 的成员 `marks1`\
  \ 中*/\n\t\tprintf(“Enter marks of 2nd examiner: ”);\n\t\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上*/\n\
  \t\tscanf(“%d”, &stud[i].marks2);\n\t\t/*此 `scanf()` 函数从输入终端读取一个整数并将其存储在 `struct\
  \ marks` 类型数组 `stud[]` 的成员 `marks2` 中*/\n\t\tif(abs(stud[i].marks1−stud[i].marks2)*100/(float)\
  \ markstot>=20.0){\n\t\t/*此处 `markstot` 的类型被转换为 `float` 以便操作得到小数结果；如果结果大于等于 20，则条件为真并执行后续语句；`abs()`\
  \ 函数给出参数的绝对值*/\n\t\t\tstud[i].third=1;\n\t\t\t/*将特定学生 `stud[i]` 的成员 `third` 设置为\
  \ 1；使用点运算符 (`.`) 访问*/\n\t\t\tind=1;\n\t\t\t/*将 `ind` 的值设置为 1；如果没有三次考试，则上述条件为真，`ind`\
  \ 的值保持为 0*/\n\t\t/*此闭合花括号指定 `if` 的结束*/\n\t\telse\n\t\t/*如果上述条件为假，则执行后续语句*/\n\t\t\
  \tstud[i].third=0;\n\t\t\t/*将特定学生 `stud[i]` 的成员 `third` 设置为 0；使用点运算符 (`.`) 访问*/\n\
  \t}\n\tprintf(“\\nRoll No.\\t1st Examiner\\t2nd Examiner\\t3rd Examiner\\tFinal\
  \ Marks\\n”);\n\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上，换行符替换了 `\\n`，制表符替换了 `\\t`；此处长字符串使用双引号分成多行*/\n\
  \tprintf(“-----------------\\n”);\n\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上*/\n\tfor\
  \ (i=0; i<numstd; i++)\n\t/*此处 `i=0` 是初始化，`i<numstd` 是条件，`i++` 是递增；初始化在循环开始执行一次；然后检查条件，如果为真则执行体内的语句，并在重新检查条件之前将\
  \ `i` 的值加 1；这些步骤一直持续直到条件变为假，此时程序流退出循环*/\n\t\tif (stud[i].third==0){\n\t\t/*如果条件为真，执行花括号内的语句*/\n\
  \t\t\tstud[i].marksfinal=ceil((stud[i].marks1+(float) stud[i].marks2)/2);\n\t\t\t\
  /*因为不需要三次考试，特定学生的最终成绩是 `marks1` 和 `marks2` 的平均值；`ceil()` 函数计算其参数最接近的整数*/\n\t\t\t\
  printf(“%d\\t\\t%d\\t\\t%d\\t\\t%c\\t\\t%d\\n”,stud[i].roll, stud[i].marks1, stud[i].marks2,\
  \ stud[i].marksfinal);\n\t\t\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上，但 `stud[i].roll`\
