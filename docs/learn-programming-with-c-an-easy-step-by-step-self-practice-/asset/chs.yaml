  \ 是最后一个节点且 num 的值不是 key，链表中未找到该项，执行后续语句*/\n\t\treturn 0;\n\t\t/*该语句将 0 返回到函数调用处*/\n\
  \telse if (pt->next->num==key)\n\t/*如果 pt 不是最后一个节点或在当前节点中未找到 key，则检查下一个节点的 num 值；如果下一个节点的\
  \ num 等于 key，执行后续语句*/\n\t\treturn pt;\n\t\t/*将指针 pt 返回到函数调用处*/\n\telse if (pt->next->next==0)\n\
  \t/*如果 pt 不是最后一个节点且在当前节点或下一个节点中未找到 key，且下一个节点是最后一个节点，执行后续语句*/\n\t\treturn 0;\n\t\
  \t/*该语句将 0 返回到函数调用处*/\n\telse\n\t/*如果当前节点或下一个节点不是最后一个节点，执行后续语句*/\n\t\tfind(pt->next,\
  \ key);\n\t\t/*再次调用 find() 在后续节点中搜索 key；程序控制流跳转到函数的定义处*/\n}\n/*右花括号指定了 find() 函数的结束*/\n\
