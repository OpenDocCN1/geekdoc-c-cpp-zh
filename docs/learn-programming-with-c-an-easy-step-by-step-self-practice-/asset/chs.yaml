  /*将 `str1[]` 的单个字符复制到 `str2[]`。例如，第一次迭代-str2[0]=str1[0]，第二次迭代-str2[1]=str1[1]，等等*/\n\
  \tstr2[i] = ‘\\0’;\n\t/*字符串必须以空字符结束，因此在复制完 `str1[]` 的字符后，在 `str2[]` 末尾添加 ‘\\0’*/\n\
  \tstrcpy(str3, str1);\n\t/*调用 `strcpy()` 函数将字符串 `str1[]` 原样复制到 `str3[]`*/\n\tprintf(“Copied\
  \ string without library function:\\n”);\n\t/*这会在屏幕上显示引号内的文本并换行*/\n\tputs(str2);\n\
  \t/*调用 `puts()` 函数在屏幕上输出字符串 `str2[]`*/\n\tprintf(“Copied string using library function:\\\
  n%s”, str3);\n\t/*`printf()` 函数在屏幕上显示引号内的文本并换行，`str3[]` 替换了格式说明符 `%s`*/\n\treturn\
  \ 0;\n\t/*返回 0，因为它是程序成功执行的标准*/\n}\n```\n\n### 题目-08 编写一个程序，找出整数数组中的最大值和最小值。\n\n\
  解决方案的流程图：\n\n图 3.1 显示了解决此问题的流程图。\n\n![](img/fig3_1.jpg)\n\n#### 解决方案的算法：\n\n*  \
  \ 步骤 1：开始\n*   步骤 2：初始化 `SIZE←10`\n*   步骤 3：读取 `value[0]` 的值\n*   步骤 4：初始化 `large←value[0]`，`small←value[0]`\
  \ 和 `i←1`\n*   步骤 5：如果 `i<SIZE`\n    *   5.1：读取 `value[i]` 的值\n    *   5.2：如果 `value[i]>large`\n\
  \        *   7.2.1：`large←value[i]`\n    *   5.3：如果 `value[i]<small`\n        *\
  \   7.3.1：`small←value[i]`\n    *   5.4：`i←i+1`\n    *   5.5：回到步骤 5\n*   步骤 6：显示\
  \ `large` 和 `small` 的值\n*   步骤 7：停止\n\n\n\n\n\n```c\n#include <stdio.h>\n/*头文件 stdio.h\
  \ 包含了函数 printf() 和 scanf() 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含该文件*/\n#define\
  \ SIZE 10\n/*#define 是一个预处理器指令，用于定义常量变量；在这里将 10 赋值给常量变量 SIZE；程序中任何使用 SIZE 的地方都会被替换为\
  \ 10*/\nint main(){\n/*所有 C 程序都必须有一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数，它返回一个整数；左大括号指定\
  \ main() 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\tint value[SIZE], large, small, i;\n\t\
  /*声明了一个大小为 SIZE 的整型类型数组 value[] 以及其他三个变量*/\n\tprintf(“Please enter any %d integers\
  \ (separated by space):” “\\n”, SIZE);\n\t/*输出函数 printf() 将双引号内的文本原样显示在屏幕上，但 SIZE\
  \ 的值会替换格式说明符 %d，换行符会替换 \\n*/\n\tscanf(“%d”, &value[0]);\n\t/*输入函数 scanf() 从输入终端读取一个整数并将其赋值给数组的第一个元素*/\n\
  \tlarge=value[0];\n\t/*第一个数组元素 value[0] 的值赋值给变量 large，该变量用于存储最大的数*/\n\tsmall=value[0];\n\
  \t/*第一个数组元素 value[0] 的值赋值给变量 small，该变量用于存储最小的数*/\n\tfor (i=1; i<SIZE; i++){\n\t\
  /*i=1 是初始化，i<SIZE 是条件，i++ 是增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行循环体中的语句，并在重新检查条件之前将 i\
  \ 的值加 1；这些步骤一直持续，直到条件变为假，此时程序流退出循环*/\n\t\tscanf(“%d”, &value[i]);\n\t\t/*此 scanf()\
  \ 函数从输入终端读取一个整数并将该值存储在数组 value[i] 中；由于该语句在每次迭代中都会执行，因此第一次迭代输入 value[1]，第二次迭代输入 value[2]，依此类推*/\n\
  \t\tif (value[i]>large)\n\t\t/*每次迭代中将输入值与 large 的值进行比较；如果输入值大于 large，则条件为真并执行后续语句*/\n\
  \t\t\tlarge=value[i];\n\t\t\t/*如果输入值大于 large，将 large 的值更新为输入值，确保 large 始终包含最大值*/\n\
  \t\tif (value[i]<small)\n\t\t/*每次迭代中将输入值与 small 的值进行比较；如果输入值小于 small，则条件为真并执行后续语句*/\n\
  \t\t\tsmall=value[i];\n\t\t\t/*如果输入值小于 small，将 small 的值更新为输入值，确保 small 始终包含最小值*/\n\
  \t}\n\t/*for 循环随着右大括号结束*/\n\tprintf(“Largest value of the array is: %d\\n”, large);\n\
  \t/*输出函数 printf() 将双引号内的文本原样显示在屏幕上，但 large 的值会替换格式说明符 %d，换行符会替换 \\n*/\n\tprintf(“Smallest\
  \ value of the array is: %d\\n”, small);\n\t/*输出函数 printf() 将双引号内的文本原样显示在屏幕上，但 small\
  \ 的值会替换格式说明符 %d，换行符会替换 \\n*/\n\treturn 0;\n\t/*返回 0，因为它是程序成功执行的标准*/\n}\n/*右大括号指定了\
  \ main() 函数体的结束，以及程序的结束；在该大括号之后，不再执行任何语句*/\n```\n\n### 题目-09 编写一个程序来生成斐波那契数列的前 n\
  \ 项。同时，检查给定的整数是否为斐波那契数。\n\n#### 解决方案的流程图：\n\n图 3.2 显示了解决此问题遵循的流程图。\n\n![](img/fig3_2.jpg)\n\
  \n图 3.2 解决该问题遵循的流程图。\n\n#### 解决方案的算法：\n\n*   步骤 1：开始\n*   步骤 2：初始化 `dm←1`\n*   步骤\
  \ 3：读取 3 到 25 之间的 `n` 的值\n*   步骤 4：初始化 `fn[0]←0`、`fn[1]←1` 且 `i←2`\n*   步骤 5：如果\
  \ `i<n`\n    *   5.1：`fn[i]←fn[i-1]+fn[i-2]`\n    *   5.2：`i←i+1`\n    *   5.3：跳转到步骤\
  \ 5\n*   步骤 6：初始化 `i←0`\n*   步骤 7：如果 `i<n-1`\n    *   7.1：显示 `fn[i]` 的值\n    * \
  \  7.2：`i←i+1`\n    *   7.3：跳转到步骤 7\n*   步骤 8：显示 `fn[i]` 的值\n*   步骤 9：读取 `ck` 的值\n\
  *   步骤 10：如果 `ck=0`\n    *   10.1：跳转到步骤 11\n*   步骤 11：如果 `ck=1`\n    *   11.1：`dm←0`\n\
  \    *   11.2：显示“斐波那契数”\n    *   11.3：跳转到步骤 14\n*   步骤 12：初始化 `fnck[0]←0`、`fnck[1]←1`\
  \ 且 `i←2`\n*   步骤 13：如果 `fnck[i-1]<ck`\n    *   13.1：`fnck[i]←fnck[i-1]+fnck[i-2]`\n\
  \    *   13.2：如果 `fnck[i]=ck`\n        *   13.2.1：显示“斐波那契数”\n        *   13.2.2：`dm←0`\n\
  \        *   13.2.3：跳转到步骤 14\n    *   13.3：`i←i+1`\n    *   13.4：跳转到步骤 13\n*   步骤\
  \ 14：如果 `dm=1`\n    *   14.1：显示“不是斐波那契数”\n*   步骤 15：停止\n\n\n\n\n\n```c\n#include<stdio.h>\n\
  /*头文件 stdio.h 包含了库函数 printf() 和 scanf() 的声明；在程序调用函数之前，必须使用预处理器指令 #include 包含该头文件*/\n\
  int main(){\n/*所有 C 程序都必须有一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数，它返回一个整数；左大括号指定了\
  \ main() 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\tint fn[25], fnck[25], n, i, ck, dm=1;\n\
  \t/*声明了两个大小为 25 的整数型数组 fn[] 和 fnck[]；还声明了四个整数型变量 n, i, ck, 和 dm，并将 dm 初始化为 1*/\n\
  \tprintf(“Please enter an integer (3–25): ”);\n\t/*输出函数 printf() 将双引号内的文本显示在屏幕上*/\n\
  \tscanf(“%d”, &n);\n\t/*输入函数 scanf() 从键盘读取一个整数并将其存储在为 n 分配的内存空间中*/\n\tfn[0]=0;\n\
  \t/*第一个斐波那契数是 0，存储在数组 fn[0] 的第一个元素中*/\n\tfn[1]=1;\n\t/*第二个斐波那契数是 1，存储在数组 fn[1] 的第二个元素中*/\n\
  \tfor (i=2; i<n; i++)\n\t/*这个 for 循环用于计算序列中的其他斐波那契数；i=2 是初始化，i<n 是条件，i++ 是增量；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体中的语句；在重新检查条件之前，i\
  \ 的值加 1；这些步骤一直持续到条件变为假*/\n\t\tfn[i]=fn[i−1]+fn[i−2];\n\t\t/*每个斐波那契数都是通过相加序列中的前两个数字来计算的；每次循环迭代中计算一个数字并将其放在数组\
  \ fn[] 中；对于 n=5，fn[0]=0, fn[1]=1\n\t\t第一次迭代后- fn[2]=fn[1]+fn[0]=1+0=1\n\t\t第二次迭代后-\
  \ fn[3]=fn[2]+fn[1]=1+1=2\n\t\t第三次迭代后- fn[4]=fn[3]+fn[2]=2+1=3\n\t\t第四次迭代后- fn[5]=fn[4]+fn[3]=3+2=5*/\n\
  \tprintf(“First %d Fibonacci sequence:\\n”, n);\n\t/*printf() 函数将双引号内的文本显示在屏幕上，例外是\
  \ n 的值替换了格式说明符 %d，换行符替换了 \\n*/\n\tfor (i=0; i<n−1; i++)\n\t/*这个 for 循环用于显示存储在数组中的斐波那契序列；i=0\
  \ 是初始化，i<n−1 是条件，i++ 是增量；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体中的语句；在重新检查条件之前，i 的值加 1；这些步骤一直持续到条件变为假，此时程序流退出循环*/\n\
  \t\tprintf(“%d, ”, fn[i]);\n\t\t/*printf() 函数在循环的每次迭代中，将单个数组元素 fn[0], fn[1], fn[2],\
  \ … 的值替换格式说明符 %d，后面跟随逗号和空格*/\n\tprintf(“%d\\n”, fn[i]);\n\t/*这个 printf() 函数将最后一个数组元素\
  \ fn[n−1] 的值替换格式说明符 %d，并用换行符替换 \\n*/\n\t/*程序的接下来的部分将检查给定的数字是否为斐波那契数*/\n\tprintf(“Enter\
  \ an integer to check: ”);\n\t/*printf() 函数将双引号内的文本显示在屏幕上*/\n\tscanf(“%d”, &ck);\n\
  \t/*scanf() 函数从输入终端读取一个整数并将其存储在为 ck 分配的内存位置；我们要检查 ck 是否是斐波那契数*/\n\tif (ck==0 ||\
  \ ck==1){\n\t/*如果输入的数字 ck 是 0 或 1，则条件为真，并执行 if 体中大括号包裹的语句*/\n\t\tprintf(“%d is a\
  \ Fibonacci number.\\n”, ck);\n\t\t/*这个 printf() 函数将双引号内的文本显示在屏幕上，例外是 ck 的值替换了格式说明符\
  \ %d，换行符替换了 \\n*/\n\t\tdm=0;\n\t\t/*如果赋值给 dm，则值为 0*/\n\t}\n\t/*这是条件 ck==0||ck==1\
  \ 的 if 结束*/\n\telse{\n\t/*如果 ck 既不是 0 也不是 1，即上述 if 中的两个条件均为假，则执行此 else 体中的语句*/\n\
  \t\tfnck[0]=0;\n\t\t/*第一个斐波那契数 0 被保存在数组 fnck[0] 的第一个元素中*/\n\t\tfnck[1]=1;\n\t\t\
  /*第二个斐波那契数 1 被保存在数组 fnck[1] 的第二个元素中*/\n\t\tfor (i=2; fnck[i−1]<ck; i++){\n\t\t/*这个\
  \ for 循环计算第 3、第 4、第 5、… 个斐波那契数；i=2 是初始化，fnck[i−1]<ck 是条件，i++ 是增量；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体中的语句；在重新检查条件之前，i\
  \ 的值加 1；这些步骤一直持续到条件变为假*/\n\t\tfn[i]=fn[i−1]+fn[i−2];\n\t}\n}\n```\n\n\n\n\n```c\n\
  #include<stdio.h>\n/*头文件 stdio.h 包含库函数 `printf()` 和 `scanf()` 的声明；在程序调用这些函数之前，必须使用预处理器指令\
  \ `#include` 包含该头文件*/\n#include<string.h>\n/*头文件 string.h 包含库函数 `strlen()` 的声明；在程序调用该函数之前，必须使用预处理器指令\
  \ `#include` 包含该头文件*/\n#include<stdlib.h>\n/*头文件 stdlib.h 包含库函数 `exit()`、`abs()`、`div()`\
