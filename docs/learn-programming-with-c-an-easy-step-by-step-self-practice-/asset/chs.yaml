  \ 程序必须有一个类型为 `void` 或 `int` 的 `main()` 函数；这里 `main()` 函数没有参数且它返回一个整数；左大括号指定 `main()`\
  \ 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\tchar a[20];\n\t/*声明了一个大小为 `20` 的字符类型数组 `a[]`；编译器为该数组在内存中分配所需的连续空间；数组的每个元素通过从\
  \ `0` 到 `19` 的索引访问*/\n\tint i, j, k, len;\n\t/*声明了四个整数类型变量；编译器为这些变量在内存中分配所需的空间*/\n\
  \tprintf(“Enter any binary string: ”);\n\t/*输出库函数 `printf()` 将双引号内的文本原样显示在标准输出终端上*/\n\
  \tgets(a);\n\t/*库函数 `gets()` 从输入终端读取字符串（包括空白符）并将字符串赋值给数组 `a[]`；在程序程序中，二进制数的每一位都被视为字符‘1’\
  \ 或‘0’*/\n\tlen=strlen(a);\n\t/*库函数 `strlen()` 计算并返回字符串 `a` 的长度，并赋值给变量 `len`*/\n\
  \tfor (k=0; a[k]!=‘\\0’; k++)\n\t/*此循环用于检查二进制数的每一位是否为 0 或 1 以外的任何值；`k=0` 是初始化，`a[k]!=‘\\\
  0’` 是条件，`k++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句；现在，在重新检查条件之前，`k` 的值加 1；这些步骤持续直到遇到字符串中的空字符\
  \ 字符*/\n\t\tif (a[k]!=‘0’ && a[k]!=‘1’){\n\t\t/*如果二进制数的任何位既不是 0 也不是 1，则条件为真并执行大括号括的后续语句*/\n\
  \t\t\tprintf：“Incorrect binary number\\nExiting … \\n”);\n\t\t\t/*此 `printf()` 函数将双引号内的文本原样显示在屏幕上，但\
