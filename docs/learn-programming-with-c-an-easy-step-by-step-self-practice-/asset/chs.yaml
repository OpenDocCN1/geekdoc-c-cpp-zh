  ```\n\n## PROBLEM-03: 编写一个程序来检查一个字符是否为字母。\n\n### 解决方案的编程代码：\n\n![](img/fig0063.jpg)\n\
  \n### 执行程序的输入和输出：\n\n![](img/fig0065.jpg)![](img/fig0064.jpg)\n\n### 编程代码说明：\n\n\
  ```c\n#include <stdio.h>\n/*头文件 stdio.h 包含了库函数 printf() 和 scanf() 的原型；在程序调用函数之前，必须使用预处理器指令\
  \ #include 包含该头文件*/\nint main(){\n/*所有 C 程序必须有一个返回类型为 void 或 int 的 main() 函数；这里\
  \ main() 函数没有参数且它返回一个整数；左大括号指定 main() 函数的开始，编译器不会执行该大括号之前的任何语句*/\n\tchar ch;\n\t\
  /*声明了字符类型变量 ch，用于存储要检查的字符*/\n\tprintf(“Enter a character: ”);\n\t/*输出函数 printf()\
