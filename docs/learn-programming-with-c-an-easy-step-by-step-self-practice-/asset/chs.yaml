  \n![](img/fig0348.jpg)\n\n## 8.2 TURBO C\n\nTurbo C 是 Borland 公司开发的 C 语言编译器。它包含一个源代码编辑器、快速编译器和一个链接器。尽管它现在已经停止更新，但许多人仍在使用此编译器来编辑和运行\
  \ C 程序。因此，下面提供了使用 Turbo C 编译器运行 程序的步骤。\n\n### 第 1 步：下载并安装适用于 Windows 的 Turbo C/C++。可以从\
  \ [`techdecodetutorials.com/download/`](https://techdecodetutorials.com) 下载。\n\n\
  ![](img/fig0349.jpg)\n\n### 第 2 步：打开程序并点击 `File -> New`，会出现一个空白的蓝色窗口。在文件中编写你的 C\
  \ 程序代码并点击 `File -> Save as …`，输入你喜欢的带有 `.cpp` 扩展的文件（例如：`Example1.cpp`），然后点击 `OK`。\n\
  \n![](img/fig0350.jpg)![](img/fig0351.jpg)\n\n### 第 3 步：在 Turbo C 平台上运行程序需要额外添加三行代码。例如，我们在\
  \ 第 1 章 中的第一个 C 程序如下：\n\n![](img/fig0352.jpg)\n\n要使用 Turbo C 编译器运行此程序，应对程序进行如下修改：\n\
  \n![](img/fig0353.jpg)\n\n添加的头文件和代码的解释如下：\n\n```c\n#include <stdio.h>\n#include\
  \ <conio.h>\n/*conio.h 是包含 clrscr() 和 getch() 函数声明的头文件*/\nint main(){\n\tint age;\n\
  \tint clrscr();\n\t/*此函数用于清除控制屏幕。clrscr() 在第一个 printf() 或输出函数之前使用，以清除上一次程序运行的任何残留输出，否则当我们执行此程序时，将先看到残留输出，然后才是当前输出*/\n\
  \tprintf(“Enter your age: ”);scanf(“%d”, &age);if (age<18)printf(“Sorry, you are\
  \ not eligible for vaccination.”);elseprintf(“Congratulation, you are eligible for\
  \ vaccination.”);\n\tgetch();\n\t/*这是一个输入函数，从标准输入终端接收任何字符。在这里使用此输入函数是为了保持控制屏幕活跃以便查看程序输出。此处控制屏幕将等待直到我们按下任意键；否则，程序输出将只显示一秒，控制屏幕会立即关闭*/\n\
  \treturn 0;\n}\n```\n\n因此，如果我们想使用 Turbo C 编译器运行程序，我们需要在每个 C 程序中添加三行额外代码：\n\n1. 在使用任何输出函数之前调用函数\
  \ `clrscr()`。\n2. 在程序的最后一行（即 `return 0;`）之前调用 `getch()` 函数。\n3. 包含头文件 `conio.h`，它包含了\
  \ `clrscr()` 和 `getch()` 函数的声明。\n\n### 第 4 步：按下 `Alt+F9` 编译程序。修正代码中的任何错误或警告。必须修正错误，虽然修正警告是可选的。重新编译程序直到获得\
  \ 0 个错误和 0 个警告。\n\n![](img/fig0354.jpg)\n\n### 第 5 步：按下 `Ctrl+F9` 执行程序。输出可能如下：\n\
  \n![](img/fig0355.jpg)\n\n## 8.3 VISUAL STUDIO CODE\n\nVisual studio code，也称为 VS\
  \ code，是微软为 Windows、Linux 和 macOS 开发的源代码编辑器。该源码编辑器可用于各种编程语言，包括 Java、JavaScript、Python\
  \ 和 C/C++，并根据不同语言具有不同的功能。Visual studio code 的一个显著特性是它能够创建支持新语言的扩展。下面提供了使用 visual\
  \ studio code 运行 C 程序的逐步步骤：\n\n### 第 1 步：下载 C 编译器 `MinGW w64`。MinGW 是 Minimalist\
  \ GNU for Windows 的缩写。可以从链接 [`bit.ly/mingw10`](https://bit.ly/mingw10) 下载。\n\n![](img/fig0356.jpg)\n\
  \n现在将 `mingw-18.0` 解压到任何位置，例如桌面。\n\n![](img/fig0357.jpg)\n\n### 第 2 步：在环境变量添加路径以便在\
  \ visual studio code 中访问 `gcc`。操作如下：\n\n- 添加 `bin` 目录的路径以便在 visual studio code 中访问\
  \ `gcc`。\n\n\n\n\n![](img/fig0368.jpg)\n\n要安装 Visual Studio，点击 `VisualStudioSetup`，然后取消勾选“使用\
  \ C++ 的桌面开发”之外的所有工作负载。现在点击“下载时安装”。\n\n![](img/fig0369.jpg)\n\n### 步骤-2：启动 Visual\
  \ Studio 程序\n并点击“创建新项目”。选择“空项目”并点击“下一步”。\n\n![](img/fig0370.jpg)\n\n输入合适的项目名称（例如\
  \ `Project1`），选择一个合适的位置（例如 `C:\\Users\\SazzadImran\\Desktop\\`），并点击“创建”。该位置将添加一个以项目命名的文件夹。\n\
  \n![](img/fig0371.jpg)\n\n### 步骤-3：添加源文件\n在“解决方案管理器”窗口中，右键点击“源文件”，选择“添加”和“新建项”。现在给文件指定你喜欢的名称并带有\
  \ `.c` 扩展（例如 `example1.c`），然后点击添加。项目中将创建一个空白文件。\n\n![](img/fig0372.jpg)\n\n### 步骤-4：编写代码\n\
  在编辑器窗口中编写你的 C 语言代码并保存文件。\n\n![](img/fig0373.jpg)\n\n我们可能需要使用更安全的版本 `scanf_s()` 代替\
  \ `scanf()` 作为输入函数。因为 Visual Studio 将 `scanf()` 视为不安全函数，并在编译程序时返回错误代码 `C4996`。`scanf_s()`\
  \ 和 `scanf()` 函数的格式和结构是相同的。\n\n### 步骤-5：生成解决方案\n现在点击“生成→“生成解决方案”来创建可执行文件。如果程序中有任何语法错误，错误信息将显示在输出窗口中。在源代码中进行必要的修正，再次保存，然后点击“生成→“生成解决方案”。继续修正源代码，直到不再有错误。\n\
  \n### 步骤-6：运行程序\n现在按 `ctrl+F5` 运行并执行程序。输出将相应地显示在输出窗口中。\n\n![](img/fig0374.jpg)\n\
  \n## 8.5 命令行\n\n如果你想在计算机上运行 C 程序，你需要安装 C 工具集。我们将使用 MinGW 来编译和执行 C 程序。以下是使用命令行创建和运行\
  \ C 程序的逐步步骤。\n\n### 步骤-1：安装 IDE\n从 [www.codeblocks.org/downloads/binaries/](http://www.codeblocks.org)\
  \ 妥善安装 CodeBlocks IDE 以及 MinGW。\n\n![](img/fig0375.jpg)\n\n或者，从 [`tdm-gcc.tdragon.net/download`](http://tdm-gcc.tdragon.net)\
  \ 下载并安装适用于系统的 GCC 编译器。\n\n![](img/fig0376.jpg)\n\n### 步骤-2：设置路径\n妥善设置 `Path` 环境变量以便从任何其他位置访问程序。操作如下：\n\
  \n*   复制 MinGW 或 `TDM-GCC-64` 的 `bin` 目录路径（例如 `C:\\Program Files (x86)\\CodeBlocks\\\
  MinGW\\bin` 或 `C:\\TDM-GCC-64\\bin`）。\n*   进入`控制面板\\系统和安全\\系统`并点击“高级系统设置”。或者，右键点击“此电脑”，点击“属性”，然后点击右侧列的“高级系统设置”。\n\
  *   点击“环境变量……”，在“系统变量”下点击`Path→编辑→新建`，在空白字段粘贴 `bin` 路径，然后连续三次点击确定按钮。(Images/fig0377.jpg)\n\
  *   进入命令提示符（按 `Win+R`，输入 `cmd` 并按回车），输入 `gcc – version` 并按回车。如果屏幕上显示版本号，说明 GCC 安装成功。(Images/fig0378.jpg)\n\
  \n### 步骤-3：编写代码\n使用任何文本编辑器（例如记事本）编写 C 语言代码，并将文件保存到任何位置（例如桌面），使用带有 `.c` 扩展的合适名称（例如\
  \ `example1.c`）。\n\n![](img/fig0379.jpg)\n\n### 步骤-4：打开命令提示符\n在保存文件 `example1.c`\
  \ 的位置打开命令提示符。操作方法：进入该位置，在地址栏中输入 `cmd` 并按回车。或者，我们可以使用 `cd` 命令来实现。\n\n### 步骤-5：编译目标文件\n\
  输入 `gcc -c example1.c` 并按回车。如果程序没有语法错误，将创建一个名为 `example1.o` 的目标文件。\n\n### 步骤-6：创建可执行文件\n\
  输入 `gcc example1.o -o example1.exe` 并按回车。将创建一个名为 `example1` 的 exe 文件。\n\n![](img/fig0380.jpg)\n\
  \n### 步骤-7：单命令编译\n我们也可以通过单个命令创建 exe 文件。只需 `gcc example1.c` 并按回车。将生成一个名为 a.exe 的可执行文件。如果我们想为可执行文件指定自定义名称，则输入\
  \ `gcc -o example1 example1.c` 并按回车。\n\n![](img/fig0381.jpg)\n\n### 步骤-8：运行程序\n\
  要运行程序，输入 `a` 或 `example1` 并按回车。输出将相应显示在命令提示符上。(Images/fig0382.jpg)\n\n## 8.6 命令行参数\n\
  \n任何 C 程序中最重要的函数是 `main()` 函数，它通常定义时不参数。但我们可以在运行时通过 `main()` 函数的参数从命令行向 C 程序传递某些值。要传递命令行参数，需要遵循以下步骤：\n\
  \n1.  **`main()` 函数定义如下：**\n    ```c\n    int main(int argc, char *argv[])\n   \
  \ ```\n    *   `argc` 是参数个数。\n    *   `argv` 是字符串数组。\n\n\n\n\n如果程序不在 Home 文件夹中，我们需要在命令中指定相应的路径。例如，如果文件保存在桌面上，在\
  \ Terminal 中输入 `cd Desktop/` 并按回车以切换目录。\n\n### 步骤 5：要运行编译后的程序，在 Terminal 中输入以下命令并按回车。\n\
  \n```\n./example1 or ./a.out\n```\n\n程序的输出将相应显示在 Terminal 中：\n\n![](img/fig0396.jpg)![](img/fig0397.jpg)\n\
  \n## 8.8 在 MATLAB 中嵌入 C 代码^®\n\n我们可以使用 MinGW-w64 编译器直接从 MATLAB 编译并运行 C 程序。或者，我们可以通过\
  \ C Function 块或 C Caller 块将外部 C 代码调用到 Simulink 模型。C Function 块和 C Caller 块将 C 算法引入\
  \ Simulink，而 S-Function Builder 则用于对动态系统建模。\n\n### 使用 MinGW-W64 编译器\n\n[`stackoverflow.com/questions/27383807/mex-file-compiled-without-errors-but-not-working-in-matlab`](https://stackoverflow.com)\n\
  \n以下是从 MATLAB 命令窗口直接编译和运行 C 程序的逐步步骤。\n\n*   **步骤 1**：访问 [www.mathworks.com/matlabcentral/fileexchange/52848-matlab-support-for-mingw-w64-c-c-compiler](http://www.mathworks.com)。\n\
  \n    ![](img/fig0398.jpg)\n\n    下载“MATLAB Support for MinGW-w64 C/C++ Compiler”。现在打开\
  \ MATLAB 并使用当前文件夹浏览器浏览到此下载的文件。双击此文件以为 MATLAB 安装 MinGW-w64 C/C++ 编译器。\n\n*   **步骤\
  \ 2**：从 [`jmeubank.github.io/tdm-gcc/`](https://jmeubank.github.io) 下载 MinGW-w64\
  \ 编译器。\n\n    ![](img/fig0399.jpg)\n\n    将 tdm-gcc 安装在一个位置（路径名不能包含任何空格），例如 `C:\\\
  TDM-GCC-64`。\n\n*   **步骤 3**：在 MATLAB 命令窗口中，运行命令：\n\n    `setenv('MW_MINGW_64_LOC',\
  \ 'path')`\n\n    `for example, setenv('MW_MINGW_64_LOC', 'C:\\TDM-GCC-64')`\n\n\
  *   **步骤 4**：在命令窗口中，运行命令：\n\n    `mex -setup`\n\n    ![](img/fig0400.jpg)\n\n* \
  \  **步骤 5**：点击 New→Script 并在文件中编写您的 C 代码。现在将其保存为当前工作文件夹中的 `.c` 文件（例如 `C:\\Users\\\
  SazzadImran\\Desktop` 中的 `example1.c`）。使用 `mexFunction()` 代替 `main()`，因为 `mexFunction()`\
