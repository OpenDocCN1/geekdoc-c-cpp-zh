  //false\n}\n```\n\n嵌套 if..else 语句的流程图如下：\n\n![](img/fig0036.jpg)\n\n## 2.4 条件运算符\n\
  \nC 语言中的条件运算符与 `if..else` 语句相似。`if..else` 语句需要多条语句来完成一个任务；而条件运算符可以在单条语句中完成相同的操作。它也被称为三目运算符，因为它在三个操作数上操作。它有助于以快速度编写\
  \ `if..else` 语句。\n\n条件运算符的语法如下：\n\n> `variable = expression1? expression2: expression3`\n\
  \n使用 `if..else` 语句，三目运算符 `?:` 可视化如下：\n\n```\n if (expression1)\n\t\tvariable = expression2;\n\
  \telse\n\t\tvariable = expression3;\n```\n\n三目运算符的流程图如下：\n\n![](img/fig0037.jpg)![](img/fig0038.jpg)\n\
  \n示例：\n\n![](img/fig0039.jpg)\n\n## 2.5 FOR 循环\n\n在 C 语言中，`for` 循环用于重复执行语句块，直到某些条件变为假或返回零。`for`\
  \ 循环的语法如下：\n\n```c\n for (initialization; conditions; increment or decrement){\n\
  \t\t//blocks of valid C statements\n\t\t//statements are executed repeatedly as\
  \ long as //the conditions are true\n}\n```\n\n`for` 循环的流程图如下：\n\n![](img/fig0040.jpg)\n\
  \n示例：\n\n![](img/fig0041.jpg)\n\n变体-1：初始化部分可以跳过，并在 `for` 循环开始之前声明。示例：\n\n![](img/fig0042.jpg)\n\
  \n变体-2：循环的递增或递减部分可以跳过并在 `for` 循环体内完成。示例：\n\n![](img/fig0043.jpg)\n\n变体-3：在 `for`\
  \ 循环中，允许使用多个初始化、条件和/或递增或递减。示例：\n\n![](img/fig0044.jpg)\n\n嵌套 for 循环：允许在 `for` 循环内部使用另一个有效的\
  \ `for` 循环。示例：\n\n![](img/fig0045.jpg)\n\n*注意：* 如果 `for` 循环中的条件永远不会为假或始终返回 0，则它是一个无限循环，使用这样的条件是一个逻辑错误。示例：\n\
  \n![](img/fig0046.jpg)\n\n## 2.6 WHILE 循环\n\n在 C 语言中，`while` 循环用于重复执行语句块，直到某些条件变为假或返回零。`while`\
  \ 循环的语法如下：\n\n```c\n initialization;\nwhile (conditions){\n\t //blocks of valid\
  \ C statements\n\t //statements are executed repeatedly as long as\n\t //the conditions\
  \ are true\n\t increment or decrement;\n}\n```\n\n`while` 循环的流程图如下：\n\n![](img/fig0047.jpg)\n\
  \n示例：\n\n![](img/fig0048.jpg)\n\n## 2.7 DO..WHILE 循环\n\n在 C 语言中，`do..while` 循环用于执行语句块，直到某些条件变为假或返回\
  \ 0。`do..while` 循环的语法如下：\n\n```c\n initialization;\ndo{\n\t//blocks of valid C statements\n\
  \t//statements are executed repeatedly as long as\n\t//the conditions are true\n\
  \tincrement or decrement;\n}while (conditions);\n```\n\n`do..while` 循环的流程图如下：\n\n\
  ![](img/fig0049.jpg)\n\n示例：\n\n![](img/fig0050.jpg)\n\n与 `while` 循环的差异：\n\n1. 在\
  \ `while` 循环中，执行体体语句之前首先检查条件。而在 `do..while` 循环中，条件在循环体执行后才检查。\n2. 即使条件为假，`do..while`\
  \ 循环体中的语句也会至少执行一次。相比之下，如果条件为假，`while` 循环体中的语句永远不会执行。\n3. `do..while` 循环中 `while\
  \ (condition)` 之后要使用分号，而 `while` 循环中 `while (condition)` 之后不需要分号。\n\n## 2.8 CONTINUE\
  \ 语句\n\n当循环中出现 `continue` 语句时，程序控制回到循环开头，跳过 `continue` 之后的语句。`continue` 语句的流程图如下：\n\
  \n![](img/fig0051.jpg)\n\n## 2.9 BREAK 语句\n\n找到 `break` 语句时，程序控制立即退出循环或 switch-case。对于稍后讨论的\
  \ switch-case 实际程序，应该始终使用 `break` 语句。`break` 语句的流程图如下：\n\n![](img/fig0052.jpg)\n\
  \n## 2.10 SWITCH..CASE 语句\n\n当有多个选项需要执行且每个选项必须执行不同的任务时，使用 switch-case 语句。switch-case\
  \ 语句的语法如下：\n\n```c\n switch (variable or integer expression){\n\tcase constant1:\n\
  \t\t//blocks of valid C statements\n\t\t//statements are executed only if constant1\
  \ = //variable or integer expression\n\t\tbreak;\n\tcase constant2:\n\t\t//blocks\
  \ of valid C statements\n\t\t//statements are executed only if constant2 = //variable\
  \ or integer expression\n\t\tbreak;\n\tdefault:\n\t\t//blocks of valid C statements\n\
  \t\t/*statements are executed in case none of the above case is true*/\n}\n```\n\
  \nswitch-case 语句的流程图如下：\n\n![](img/fig0053.jpg)\n\nswitch-case 语句的示例如下：\n\n![](img/fig0054.jpg)![](img/fig0055.jpg)\n\
  \n该程序的输出是 case 2。\n\n如果没有使用 `break` 语句，输出则是 case 1 case 2 default。\n\n`break` 语句导致程序控制退出\
  \ switch 体。在 `default` 之后使用 `break` 语句是可选的，不会影响程序流或输出。\n\n## GOTO 语句\n\n当遇到 `goto`\
  \ 语句时，程序控制立即跳转到 `goto` 语句指定的标签。`goto` 语句的语法如下：\n\n```c\n goto label_name;\n\t//block-1\
  \ of valid C statements\nlabel_name:\n //block-2 of valid C statements\n /*statements\
  \ are executed as soon as the above goto is encountered, skipping the block-1 statements*/\n\
  ```\n\n`goto` 语句的流程图如下：\n\n![](img/fig0056.jpg)\n\n## 2.12 示例\n\n### **问题-01：编写一个程序检查给定的数字是正还是负。**\n\
