  /*输出函数 `printf()` 在屏幕上显示引号内的文本*/\n\t\tscanf(“%d”, &(ptr+i)->roll);\n\t\t/*函数 `scanf()`\
  \ 从输入终端读取一个整数并将其存储在 struct course 类型指针 `ptr` 的成员 `roll` 中；在每次迭代中都会读取每个学生的学号*/\n\t\
  \tgetchar();\n\t\t/*当我们输入学生的学号并按下回车时，整数后的 `\\n` 会留在缓冲区中并在后续 `gets()` 语句中被接受；因此我们在输入学号后使用此\
  \ `getchar()` 来解决这个问题*/\n\t\tprintf(“Enter name: ”);\n\t\t/*输出函数 `printf()` 在屏幕上显示引号内的文本*/\n\
  \t\tgets((ptr+i)->name);\n\t\t/*`gets()` 函数获取一个包括空格、制表符等的以 NULL 字符 ‘\\0’ 结尾的字符串，并将该字符串存储在\
  \ struct course 类型指针变量 `ptr` 的成员 `name` 中，该成员通过箭头运算符 (`->`) 访问*/\n\t\tprintf(“Enter\
  \ total marks: ”);\n\t\t/*输出函数 `printf()` 在屏幕上显示引号内的文本*/\n\t\tscanf(“%d”, &(ptr+i)->marks);\n\
  \t\t/*函数 `scanf()` 从输入终端读取一个整数并将其存储在 struct course 类型指针 `ptr` 的成员 `marks` 中；在每次迭代中都会读取每个学生的成绩*/\n\
  \t}\n\t/*这个右大括号指定了 ‘for’ 循环的结束*/\n\tprintf(“\\nDisplaying Information … ”);\n\t\
  /*输出函数 `printf()` 在屏幕上显示引号内的文本，但换行符替换了 `\\n`*/\n\tfor (i=0; i<num; ++i){\n\t/*这里\
  \ `i=0` 是初始化，`i<num` 是条件，`++i` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，执行大括号括起来体内的语句，并在重新检查条件之前将\
  \ `i` 的值加 1；这些步骤持续进行，直到条件变为假，此时程序控制流将退出循环*/\n\t\tprintf(“\\nInformation of student\
  \ #%d … \\n”, i+1);\n\t\t/*输出函数 `printf()` 在屏幕上显示引号内的文本，但 `i+1` 的值替换了格式说明符 `%d`，且换行符替换了\
  \ `\\n`*/\n\t\tprintf(“Roll: %d\\nName: %s\\nMarks: %d\\n”, (ptr+i)->roll, (ptr+i)->name,\
  \ (ptr+i)->marks);\n\t\t/*输出函数 `printf()` 在屏幕上显示引号内的文本，但 `(ptr+i)->roll` 的值替换了第一个格式说明符\
  \ `%d`，`(ptr+i)->name` 的字符串值替换了 `%s`，`(ptr+i)->marks` 的值替换了第二个 `%d`，且换行符替换了 `\\\
  n`*/\n\t}\n\tfree(ptr);\n\t/*释放为 struct course 类型变量分配的内存空间*/\n\treturn 0;\n\t/*返回\
  \ 0，因为它是程序成功执行的标准*/\n}\n/*该大括号指定了 main() 函数体的体的结束，也是程序的结束；在该大括号之后，没有语句会被执行*/\n```\n\
  \n### **问题-03** **写一个使用结构体相加两个复数的程序。**\n\n解决方案的编程代码：\n\n![](img/fig0211.jpg)\n\n\
