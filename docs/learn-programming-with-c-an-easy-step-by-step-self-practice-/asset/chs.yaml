  \ 现在变成了 `stud[j]`*/\n\t\t\t}/*此右花括号指定 `if` 的结束*/\n\t\t\telse if (stud[j-1].gpa==stud[j].gpa)\n\
  \t\t\t/*如果上述 `if` 条件为假，则检查 `else if` 条件；如果相邻学生的 GPA 相等，则执行 `if` 条件以按总分升序对学生进行排序*/\n\
  \t\t\t\tif (stud[j-1].total<stud[j].total){\n\t\t\t\t/*如果条件为真，则执行花括号内的语句；此处比较相邻学生的总分，如果后者的总分更高，则进行交换*/\n\
  \t\t\t\ttemp=stud[j-1];\n\t\t\t\t/*数组元素 `stud[j-1]` 存储在变量 `temp` 中*/\n\t\t\t\tstud[j-1]=stud[j];\n\
  \t\t\t\t/*数组元素 `stud[j]` 存储在数组元素 `stud[j-1]` 中*/\n\t\t\t\tstud[j]=temp;\n\t\t\t\t\
  /*`temp` 的值存储在数组元素 `stud[j]` 中，即 `stud[j-1]` 现在变成了 `stud[j]`*/\n\t\t\t}/*此右花括号指定\
  \ `if` 的结束*/\n\tfor (i=0; i<numstd; i++)\n\t/*此 `for` 循环用于根据排序后的 GPA 设置每个学生的排名；`i=0`\
  \ 是初始化，`i<numstd` 是条件，`i++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体语句，并在重新检查条件之前将 `i`\
  \ 的值加 1；这些步骤持续进行直到条件变为假，此时程序流退出循环*/\n\t\tstud[i].pos=i+1;\n\t\t/*struct exam 数组\
  \ `stud[]` 的成员 `pos` 设置为 `i+1`；在第一次迭代中，第一个学生的排名设置为 `stud[0].pos=1`，在第二次迭代中，第二个学生的排名设置为\
  \ `stud[1].pos=2`，以此此类推*/\n\tprintf(\"\\nResult to merit position:\\n\");\n\t/*输出函数\
  \ `printf()` 将双引号内的文本原样显示在屏幕上，换行符替换 `\\n`*/\n\tfor (i=0; i<numstd; i++){\n\t/*此\
  \ `for` 循环用于根据排序后的 GPA 显示每个学生的信息；`i=0` 是初始化，`i<numstd` 是条件，`i++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真则执行体语句，并在重新检查条件之前将\
  \ `i` 的值加 1；这些步骤持续进行直到条件变为假，此时程序流退出循环*/\n\t\tprintf(\"Roll No.: %d\\n\", stud[i].roll);\n\
  \t\t/*输出函数 `printf()` 将引号内的文本原样显示在屏幕上，但 `stud[i].roll` 的值替换了格式说明符 `%d`，换行符替换 `\\\
  n`*/\n\t\tfor (j=0; j<numsub; j++)\n\t\t/*此 `for` 循环用于根据排序后的 GPA 显示每个学生所有课程的信息；`j=0`\
  \ 是初始化，`j<numsub` 是条件，`j++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真执行体语句，并在重新检查条件之前将 `i` 的值加\
  \ 1（注：原文此处为 i，逻辑上应为 j）...*/\n\t\t\tprintf(\"EEE-110%d: %s (%0.2f)\\n\", j+1, stud[i].sub[j].letter,\
  \ stud[i].sub[j].point);\n\t\t\t/*输出函数 `printf()` 将引号内的文本原样显示在屏幕上，但 `j+1` 的值替换了格式说明符\
