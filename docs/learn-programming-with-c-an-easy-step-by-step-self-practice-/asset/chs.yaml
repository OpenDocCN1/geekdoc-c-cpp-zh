  \ 的值\n    - 5.2：`stud[i].classper←(stud[i].classno)/classtot)×100`\n    - 5.3：如果\
  \ `stud[i].classper>=90.0`\n        - 5.3.1：`stud[i].mark←5.0`\n        - 5.3.2：跳转到步骤-6.11\n\
