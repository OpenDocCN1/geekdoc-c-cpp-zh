  \ `struct atten` 的变量*/\nint main(){\n/*所有 C 程序都必须有一个返回类型为 `void` 或 `int` 的 `main()`\
  \ 函数；这里 `main()` 函数没有参数，且它返回一个整数；左大括号指定了 `main()` 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\
  \tstruct atten stud[100];\n\t/*声明了一个大小为 100 的 `atten` 类型数组；数组每个元素都有两个整数类型成员 `roll`\
