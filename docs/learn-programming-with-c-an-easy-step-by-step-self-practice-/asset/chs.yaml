  \ <stdio.h>\n/*头文件 stdio.h 包含了库函数 printf() 和 scanf() 的原型；在程序调用这些函数之前，必须使用预处理器指令\
  \ #include 包含头文件*/\nstruct complex{\n/*struct 是用于创建结构体的关键字；complex 是结构的名称，大括号内紧跟了两个相同数据类型的成员*/\n\
