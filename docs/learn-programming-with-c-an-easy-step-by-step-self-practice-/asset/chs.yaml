  \ strlen() 的原型或声明；在程序调用该函数之前，必须包含该头文件*/\nint main(){\n/*所有 C 程序必须有一个返回类型为 void 或\
  \ int 的 main() 函数；这里 main() 函数没有参数且它返回一个整数；左大括号指定 main() 函数的开始，编译器不会执行该大括号之前的任何语句*/\n\
  \tint i;\n\t/*声明了一个整数类型变量 i*/\n\tchar str[40];\n\t/*声明了一个大小为 40 的字符类型数组。数组的每个元素通过从\
