  \      * 3.3.2：读取 `ch` 的值\n        * 3.3.3：`k←k+1`\n        * 3.3.4：回到步骤-3.3\n \
  \   * 3.4：`str[k]←‘\\0’`\n    * 3.5：如果 `str[0]=‘\\0’`\n        * 3.5.1：回到步骤-4\n\
  \    * 3.6：`word←word+1`\n    * 3.7：初始化 `i←0`\n    * 3.8：如果 `str[i]≠‘\\0’`\n   \
  \     * 3.8.1：如果 `str[i]=‘ ’`\n            * 3.8.1.1：回到步骤-3.8.2.1\n        * 3.8.2：如果\
  \ `str[i]=‘\\t’`\n            * 3.8.2.1：`word←word+1`\n        * 3.8.3：`i←i+1`\n\
  \        * 3.8.4：回到步骤-3.8\n    * 3.9：`line←line+1`\n    * 3.10：`chnm←chnm+strlen(str)`\n\
  * 步骤-4：显示 `line`、`word` 和 `chnm` 的值\n* 步骤-5：停止\n\n#### 解决方案的代码：\n\n![](img/fig0153.jpg)\n\
