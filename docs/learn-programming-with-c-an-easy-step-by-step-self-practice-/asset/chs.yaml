  \ 接收节点指针作为参数，执行某些预定义的操作且无返回值*/\nnode *find(node *pt, int key);\n/*这是用户定义函数 find()\
  \ 的原型（或声明），它必须以分号结束；find() 接收一个节点指针和一个整数作为参数，执行某些预定义的操作并返回一个 node 类型指针*/\nnode *delet(node\
  \ *pt);\n/*这是用户定义函数 delet() 的原型（或声明），它必须以分号结束；delet() 接收节点指针作为参数，执行某些预定义的操作并返回一个\
  \ node 类型指针*/\nint main(){\n/*所有 C 程序必须有一个返回类型为 void 或 int 的 main() 函数；这里 main()\
  \ 函数没有参数且它返回一个整数；左花括号指定了 main() 函数的开始，该花括号之前的任何语句都不会被编译器执行*/\n\tnode *head;\n\t\
  /*声明了节点类型指针 head；head 是 struct list 类型变量的地址，该变量有两个成员——用于存储整数的 num 和用于存储另一个节点类型变量地址的\
  \ next*/\n\thead=(node *)malloc(sizeof(node));\n\t/*sizeof() 函数计算 node 类型数据的大小，存储一个整数和一个另一个地址所需的空间；所需的内存空间通过\
  \ malloc() 动态分配；内存空间的地址被分配给节点类型指针变量 head*/\n\tcreate(head);\n\t/*使用实际参数 head 调用用户定义函数\
  \ create()，head 指向链表的第一个节点；程序控制流跳转到函数的定义处*/\n\tprintf(“List of items before deletion:\\\
  n”);\n\t/*printf() 函数将引号内的文本显示在屏幕上，但 \\n 会替换为换行*/\n\tprint(head);\n\t/*使用实际参数 head\
  \ 调用用户定义函数 print()，head 指向链表的第一个节点；程序控制流跳转到函数的定义处*/\n\tif (head->num!=−99){\n\t\
  /*使用指针运算符访问结构数据类型变量的成员；指针 head 指向链表的第一个节点；如果第一个节点 head 的成员 num 的值为 −99 以外的任何整数，则链表不为空，并执行花括号内的后续语句*/\n\
  \t\thead=delet(head);\n\t/*使用实际参数 head 调用用户定义函数 delet()，head 指向链表的第一个节点；程序控制流跳转到函数的定义处，该函数执行某些预定义操作并返回一个\
  \ node 类型指针赋值给 head*/\n\tprintf(“List of items after deletion:\\n”);\n\t/*printf()\
  \ 函数将双引号内的文本显示在屏幕上，但 \\n 会替换为换行*/\n\tprint(head);\n\t/*使用实际参数 head 调用用户定义函数 print()，head\
  \ 指向链表的第一个节点；程序控制流跳转到函数的定义处*/\n\t}\n\t/*此右花括号指定了 ‘if’ 的结束*/\n\tprintf(“\\n”);\n\t\
  /*此 printf() 在屏幕上显示一个换行符*/\n\treturn 0;\n\t/*返回 0，因为它是程序成功执行的标准*/\n}\n/*右花括号指定了\
  \ main() 函数体的结束，以及程序的结束；在该花括号之后，不再有语句被执行*/\nvoid create(node *pt){\n/*create() 函数的定义在此开始，包含函数头和函数体；函数头与没有分号的函数原型相同；函数体在花括号内；函数调用期间传递的实际参数替换了虚拟参数\
  \ pt*/\n\tint key;\n\t/*声明了整型变量 key；为该变量分配了所需的内存空间；该变量是 create() 函数的局部变量，在函数外部不可见*/\n\
  \tstatic int count=0;\n\t/*声明了整型变量 count 并初始化为 0；变量被声明为静态，意味着 count 的值在函数调用之间会被保留，直到程序执行结束*/\n\
  \tstatic node *head1;\n\t/*声明了节点类型指针 head1；指针被声明为静态，意味着该指针在程序执行结束前一直有效，这样创建的节点地址在调用之间得以保留*/\n\
  \tprintf(“Input a number (−99 to end): ”);\n\t/*printf() 函数将引号内的文本显示在屏幕上*/\n\tscanf(“%d”,\
  \ &key);\n\t/*scanf() 从终端读取一个整数存储在 key 中*/\n\tif (key==−99){\n\t/*如果 key 为 −99，我们不想在链表中添加更多节点，并执行\
  \ ‘if’ 体中的语句*/\n\t\tif (count==0){\n\t\t/*如果 count 等于 0，链表为空，执行后续语句*/\n\t\t\tpt->num=−99;\n\
  \t\t\t/*第一个节点成员 num 的值设置为 −99*/\n\t\t\tpt->next=0;\n\t\t\t/*第一个节点的 next 指针设置为 0；链表中没有更多节点*/\n\
