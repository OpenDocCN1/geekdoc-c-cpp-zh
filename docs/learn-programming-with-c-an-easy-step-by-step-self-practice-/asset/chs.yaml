  \ ptr 的下一个节点*/\n\t\t\ttemp=ptr->next->next;\n\t\t\t/*将 ptr->next 的下一个节点（第 5 个节点）保存到节点指针\
  \ temp 中；temp 现在指向链表的第 5 个节点*/\n\t\t\tfree(ptr->next);\n\t\t\t/*调用库函数 free(ptr->next)\
  \ 删除 ptr 的下一个节点，即找到 key 所在的链表第 4 个节点*/\n\t\t\tptr->next=temp;\n\t\t\t/*将第 5 个节点与第\
  \ 3 个节点连接；之前 ptr->next 指向第四个，现在指向第五个*/\n\t\t}\n\t\t/*‘else’ 的结束*/\n\t}\n\treturn\
  \ pt;\n\t/*将链表的第一个节点指针 pt 返回到函数调用处*/\n}\n}\n```\n\n\n\n\n\n# 问题-13 编写一个程序以交互方式创建一个线性链表，并在指定的指定节点之前和之后插入给定的项。程序将显示插入前后的所有项。\n\
  \n## 解决方案的流程图：\n\n图 5.7 显示了解决此问题的流程图。\n\n![](img/fig5_7.jpg)\n\n图 5.7 解决该问题的流程图。\n\
