  \n答：数组使用单个变量来存储多个值。因此，它只需要声明一次，代码就可以多次重复。使用独立变量来存储多个值在编码效率、重用性和可读性方面都是低效的。\n\n###\
  \ 15. 在比较字符串时可以使用“if”条件吗？\n\n答：在 C 语言中，不允许使用可能返回真（true/false）的逻辑运算符来比较两个字符串，因此 `if`\
  \ 条件不能用于比较字符串。\n\n### 16. 我们如何确定存储在变量中的字符串值的长度？\n\n答：通过调用 `strlen()` 函数并将变量名作为参数，可以确定该变量中字符串的长度。\n\
  \n### 17. 什么是多维数组？\n\n答：多维数组是数组的数组，数据以表格的形式存储。多维数组中的元素总数是所有维度尺寸的乘积。例如，`array[5][6]`、`array[3][4][6]`\
  \ 和 `array[10][4][5][8]` 分别是 2D、3D 和 4D 数组。\n\n### 18. `gets()` 函数是什么？它与 `scanf()`\
  \ 函数有什么区别？\n\n答：`gets()` 和 `scanf()` 都是从输入终端读取字符串的输入库函数。`scanf()` 会一直读取输入直到遇到空格、制表符、换行符或\
  \ `EOF` 为止，而 `gets()` 会一直读取输入直到遇到换行符或 `EOF` 为止，它在遇到空格或制表符时不会停止。\n\n## 练习题\n\n1.\
