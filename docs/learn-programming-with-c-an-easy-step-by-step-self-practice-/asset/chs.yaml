  \ 的结束*/\n\t\t\telse if (stud[i].sub[j].mark>=80){\n\t\t\t\t/*如果条件为真，意味着特定科目的成绩在\
  \ 80 到 90 之间，执行以下两条语句*/\n\t\t\t\tstud[i].sub[j].point=3.50;\n\t\t\t\t/*`point` 是\
  \ struct subject 类型数组 `sub[]` 的成员，通过点运算符 (.) 访问并赋值为 3.50*/\n\t\t\t\tstud[i].sub[j].letter=\"\
