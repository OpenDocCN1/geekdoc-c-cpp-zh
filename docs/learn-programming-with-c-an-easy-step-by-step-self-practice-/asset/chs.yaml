  \ `complex`，包含成员 `real` 和 `imag`\n- 步骤-3：`op1←read()`（调用 `read()`）\n- 步骤-4：`op2←read()`（调用\
  \ `read()`）\n- 步骤-5：读取 `ch` 的值\n- 步骤-6：如果 `ch='+'`\n    - 6.1：`op3←add(op1, op2)`（调用\
  \ `add()`）\n    - 6.2：调用函数 `write(op3)`\n    - 6.3：跳转到步骤-10\n- 步骤-7：如果 `ch='*'`\n\
  \    - 7.1：`op3←mul(op1, op2)`（调用 `mul()`）\n    - 7.2：调用函数 `write(op3)`\n    - 7.3：跳转到步骤-10\n\
  - 步骤-8：显示‘wrong choice’\n- 步骤-9：停止\n\n### 函数 read() 的算法：\n\n- 步骤-1：读取 `num.real`、`op`、`sym`\
  \ 和 `num2` 的值\n- 步骤-2：如果 `op='-'`\n    - 2.1：`num.imag←-num2`\n    - 2.2：跳转到步骤-4\n\
  - 步骤-3：`num.imag←num2`\n- 步骤-4：返回 `num`\n\n### 函数 add(num1, num2) 的算法：\n\n- 步骤-1：`num3.real←num1.real\
  \ + num2.real`\n- 步骤-2：`num3.imag←num1.imag + num2.imag`\n- 步骤-3：返回 `num3`\n\n###\
  \ 函数 mul(num1, num2) 的算法：\n\n- 步骤-1：`num3.real←num1.real×num2.real – num1.imag×num2.imag`\n\
  - 步骤-2：`num3.imag←num1.real×num2.imag + num1.imag×num2.real`\n- 步骤-3：返回 `num3`\n\
