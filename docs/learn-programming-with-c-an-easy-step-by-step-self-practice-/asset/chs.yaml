  \ B, C, C, B, B]\n\n## 简答题\n\n1. 定义结构体。\n    答。结构体是一种用户定义的数据类型，允许将不同的数据类型分组。它是变量的集合。\n\
  \n2. 结构体变量可以在声明时初始化吗？\n    答。可以，可以在声明时初始化。例如，看以下语句：\n\n    ```\n    struct num{int\
  \ real=10; int imag=15};\n    ```\n\n3. 结构体的成员可以在声明时初始化吗？\n    答。不可以，以下代码报错；原因很简单：\n\
  \n    ```\n    struct num{\n        int real;\n        int imag;\n    };\n    ```\n\
  \n4. 比较结构变量的方法？\n    答。在 C 中，不允许直接比较结构变量。我们需要对结构的每个元素进行比较。\n\n5. 什么是栈？栈存储数据的方法？\n\
  \    答。栈是一种线性数据结构。使用后进先出（FILO）技术存储数据。在任何给定时刻，只能访问栈顶。`PUSH` 是存储机制，`POP` 是检索机制。\n\n\
  6. 描述 C 语言中的动态数据结构？\n    答。动态数据结构是根据需要扩展或收缩的。它们从堆中分配内存块，并使用指针将其连接到某些数据结构中。当数据结构不再需要内存块时，会将其返回以重用。\n\
  \n7. 什么是嵌套结构体？\n    答。在 C 中，嵌套结构是指结构内部的结构。当我们在结构内部定义结构成员时，可以将一个结构声明在另一个结构内部。例如，在以下结构声明中，学院结构声明在学生结构内部：\n\
  \n    ```\n    struct college{\n        int colid;\n        char colname[50];\n\
  \    };\n    struct student{\n        int stid;\n        char stname[20];\n    \
  \    float cgpa;\n        struct college;\n    } stdata;\n    ```\n\n8. 什么是自引用结构？\n\
  \    答。自引用结构是指其成员可以指向相同类型结构变量的结构。它们可以通过一个或多个指针指向相同类型的结构。在树、链表等动态数据结构中，自引用结构被广泛使用。相同\
  \ `struct` 类型的链表将用于指向节点的节点。在下面的示例中，`next` 指针引用 `node` 类型结构。\n\n    ```\n    struct\
  \ node {\n        int data;\n        struct node* next;\n    };\n    ```\n\n\n\n\
  \n\n```c\nstruct node{\n    int data;\n    struct node *next;\n};\n```\n\n### 9.\
  \ 什么是枚举？\n\n答。枚举（`enum`）是一种表示一组常数的特殊数据类型。它用于为整数常量分配名称，使程序更于易读和维护。使用 `enum` 关键字来创建\
  \ `enum`。内部声明的常量用逗号分隔。枚举类型允许程序员使用更有意义的单词作为变量值。默认情况下，列表中的第一个项被赋值为 0，第二个项被赋值为 1，依此类推。在接下面的示例中，`red=0`、`green=1`\
  \ 且 `blue=2`。\n\n```c\nenum color{\n\tred;\n\tgreen;\n\tblue;\n};\n```\n\nC 语言还允许为枚举元素分配自定义值。在下面的示例中——`red=12`、`green=13`\
  \ 且 `blue=15`。\n\n```c\nenum color{\nred=12;\ngreen;\nblue=15;\n};\n```\n\n### 10.\
  \ 什么是链表？\n\n答。链表是一种动态数据结构，其中每个元素（称为 `node`）由两个部分组成：数据和指向另一个节点的引用（或指针）。链表是节点的集合，每个节点都通过指针连接到另一个节点。除了数组之外，链表是最常用的数据结构。使用链表存储数据是使用内存的一种高效方式。\n\
  \n### 11. 什么是 FIFO？\n\n答。C 编程中存在一种名为 `queue`（队列）的数据结构。`FIFO` 格式用于在此结构中存储和访问数据。先入先出（First\
  \ In, First Out）缩写为 `FIFO`。它是一种数据结构处理方法，其中先处理旧的元素，最后处理最新的元素。\n\n### 12. 什么是二叉树？\n\
  \n答。二叉树是链表概念的扩展。二叉树是一种树形非线性数据结构，每个父节点最多有两个孩子。除了数据元素外，二叉树中的每个节点都有左引用和右引用。根节点是树层次结构最顶端的节点。父节点是包含额外子节点的节点。左孩子和右孩子是父节点的两个子节点。\n\
  \n![](img/fig0276.jpg)\n\n### 13. 什么是堆？堆的优缺点是什么？\n\n答。堆是一种自定义的基于树的数据结构，本质上是一个几乎完全的树，满足堆属性：在最大堆中，对于任何给定的节点\
  \ `C`，父节点 `P` 的键大于或等于子节点 `C` 的键。在最小堆中，`P` 的键小于或等于 `C` 的键。\n\n在堆上存储数据的时间比在栈上要长。然而，使用堆的主要优点是它的自适应性。这是因为该结构中的内存可以按照任何顺序进行分配和释放。如果算法设计和实现良好，可以补偿堆运行速度慢的问题。\n\
