  }\n/*此右大括号指定 `create()` 函数定义的结束；程序控制流返回到调用处*/\n\nvoid print(node *pt) {\n    /*`print()`\
  \ 函数定义在此开始，包含函数头和体；函数头与没有分号的函数原型相同；函数体在大括号内；函数调用期间传递的实际参数替换虚拟参数 `pt*/\n    if (pt->num\
