  \ (i=0; i<numstd; i++){\n\t\t/*此处 `i=0` 是初始化，`i<numstd` 是条件，`i++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行花括号内的体体语句，并在重新检查条件之前将\
