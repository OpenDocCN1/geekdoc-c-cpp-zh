  /*此右大括号指定‘if’ 条件的结束*/\n\tfor (i=len−1; a[i]!=‘1’; i−−);\n\t/*此 `for` 循环找到二进制数中包含\
  \ 1 的最后位的索引；`i=len−1` 是初始化，`a[i]!=‘1’` 是条件，`i –` 是递减；这个‘for’ 循环以分号结束，表示它没有循环体；索引在循环开始时被设置为字符串的最后一个字符；然后检查条件，如果为真，在重新检查条件之前，索引值\
  \ `i` 减 1；此过程一直持续到条件变为假，此时找到了二进制数中的最后一个 1，程序流退出循环*/\n\tfor (j=i−1; j>=0; j−−)\n\t\
  /*此‘for’ 循环将二进制整数的每一位从 1 翻转为 0，从 0 翻转为 1，范围从第一位到最后一个‘1’ 之前的一位；包含 1 的最后一位保持为 1 不变；`j=i−1`\
  \ 是初始化，`j>=0` 是条件，`j –` 是递减；在循环开始时执行一次初始化，将索引设置为字符串中最后一个‘1’ 之前的一个字符；然后检查条件，如果为真，则执行体内的语句；在重新检查条件之前，索引值\
  \ `j` 减一；重复这些步骤直到到达字符串的第一个字符，此时条件变为假，程序流退出循环*/\n\t\tif (a[j]==‘1’)\n\t\t/*此‘if’检查位\
  \ `a[j]` 是否为 1，如果为真，则执行后续语句*/\n\t\t\ta[j]=‘0’;\n\t\t\t/*此语句将位 `a[j]` 从 1 翻转为 0*/\n\
  \t\telse\n\t\t/*如果检查的位不是‘1’，则上方‘if’的条件为假并执行后续语句*/\n\t\t\ta[j]=‘1’;\n\t\t\t/*此语句将位\
  \ `a[j]` 从 0 翻转为 1*/\n\tprintf (“2’s complement: %s\\n”, a);\n\t/*此 `printf()` 函数将双引号内的文本原样显示在屏幕上，字符串\
  \ `a` 替换格式说明符 `%s`，`\\n` 换行*/\n\treturn 0;\n\t/*返回 0 是因为它是程序成功执行的标准*/\n}\n/*此右大括号指定\
  \ main() 的结束*/\n```\n\n\n\n\n\n```c\n#include<stdio.h>\n/*头文件 stdio.h 包含了库函数 printf\
  \ 和 scanf() 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含头文件*/\n#define ROW 4\n/*预处理器指令\
  \ #define 定义了一个常量变量 ROW，其值为 4；从现在起，程序中所有出现 ROW 的地方都会被替换为 4*/\n#define COL 4\n/*预处理器指令\
  \ #define 定义了一个常量变量 COL，其值为 4；从现在起，程序中所有出现 COL 的地方都会被替换为 4*/\nint main(){\n/*所有\
  \ C 程序必须包含一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数且返回一个整数；左大括号指定 main() 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\
  \tint mat1[ROW][COL], mat2[ROW][COL], i, j, m, n;\n\t/*声明了四个整数类型变量 i, j, m 和 n，以及两个大小为\
