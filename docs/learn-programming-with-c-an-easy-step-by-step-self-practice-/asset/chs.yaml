  \ %0.2f 被替换为 nisab 的值并保留两位小数精度， \\n 被替换为换行符*/\n\tasset=gold*gdprice+silver*srprice+bank+cash+item+owe−debt;\n\
  \t/*计算相关人员的总资产*/\n\tprintf“你的资产是 %0.2f taka。\\n”, asset);\n\t/*printf() 函数将引号内的文本原样显示在屏幕上，格式说明符\
