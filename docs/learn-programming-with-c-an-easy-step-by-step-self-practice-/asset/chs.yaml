  \ ”);\n\t/*输出函数 printf() 将双引号内的文本原样显示在屏幕上*/\n\tscanf：“%f”, &cash);\n\t/*scanf()\
  \ 函数从输入终端读取一个小数，并将其存储在分配给 cash 的内存空间中*/\n\tprintf(“输入你生意物品的总市场价格，如果有” “任何\\n”);\n\
