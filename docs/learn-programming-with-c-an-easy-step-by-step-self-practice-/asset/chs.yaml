  \ 显示 num 的值*/\n\t}\n\treturn 0;\n}\n```\n\n# 问题-14 写一个程序使用蒙特卡洛法计算 PI 的值。\n\n## 解决方案的流程图\n\
  \n图 2.8 显示了解决此问题遵循的流程图。\n\n![](img/fig2_9.jpg)\n\n图 2.9 解决问题的流程图。\n\n## 解决方案的算法：\n\
