  \n![](img/fig0338.jpg)\n\n### 8.1.2 创建动态库\n\n像静态库一样，动态库也是包含 C 函数定义的对象文件 `*.o` 的集合。但与静态库不同，动态库在运行时加载到主程序模块中（而不是在编译时）。因此，与其生成包含主程序模块和库的单一可执行文件，这里的\
  \ `exe` 文件仅包含动态库中函数的引用。为了执行程序，需要动态库和 `exe` 文件。创建用户自定义 C 动态库 `SimpleLib.dll` 的步骤如下：\n\
  \n步骤 1：打开 CodeBlocks C 编译器。现在，点击 File→New→Project …，选择“Dynamic Library”并点击 Go。\n\
  \n![](img/fig0339.jpg)\n\n现在点击 Next> 并在“Project title”上输入 `SimpleLib`，并选择一个创建项目的文件夹（例如\
  \ `C:\\Users\\SazzadImran\\Desktop\\`）。\n\n![](img/fig0340.jpg)\n\n现在点击 Next>，选择你的编译器（在这种情况下为\
  \ `GNU GCC Compiler`），然后点击 Finish。将创建一个名为 `SimpleLib.cbp` 的项目。\n\n步骤 2：点击 File→New→File\
  \ …，选择“C/C++ source”，点击 Go 然后点击 Next>。现在选择 C 然后再点击 Next>。在“Filename with full path:”上进入\
  \ `C:\\Users\\SazzadImran\\Desktop\\SimpleLib` 并在“File name”上输入 `SimpleLib1`（C 源文件的用户自定义名称）。现在点击\
  \ Save，然后在点击 Finish 之前勾选 In build target(s): 下的 Debug 和 Release。\n\n![](img/fig0341.jpg)\n\
  \n步骤 3：在 `SimpleLib1.c` 中定义任意函数。我们定义一个名为 `add()` 的函数作为示例，它接受两个整数作为参数并返回值的之和。在函数定义中使用双引号包含用户自定义的头文件，该函数的原型将在该文件中可用。\n\
  \n![](img/fig0342.jpg)\n\n在名为 `SimpleLib3.c` 的另一个源文件中以类似的方式定义另一个函数 `subtract()`，就像我们在\
  \ `SimpleLib1.c` 中定义函数 `add()` 一样。\n\n![](img/fig0343.jpg)\n\n步骤 4：点击 File→New→File\
  \ …，选择“C/C++ header”，点击 Go 然后点击 Next>。在“Filename with full path:”上进入 `C:\\Users\\\
  SazzadImran\\Desktop\\SimpleLib` 并在“File name”上输入 `SimpleLib2` 作为 C 头文件的用户自定义名称（也可以与源文件相同），然后点击\
  \ Save。现在勾选 In build target(s): 下的 Debug 和 Release，然后点击 Finish。\n\n在第 2 条语句（`#define\
  \ …`）之后，包含编译和运行用户自定义函数 `add()` 和 `subtract()` 需要的所有标准头文件。包含头文件后，编写函数 `add()` 和 `subtract()`\
  \ 的原型并保存文件。\n\n![](img/fig0344.jpg)\n\n步骤 5：打开另一个名为 `example1.c` 的源文件，在文件中写入代码并点击\
  \ Save。\n\n![](img/fig0345.jpg)\n\n\n\n\n\n### 第 6 步：从项目中删除 `main.cpp` 和 `main.h`\
  \ 文件。现在点击 `Build→`Build`。所有带有 `.o` 扩展的对象文件都创建在我们的目标文件夹 `obj\\Debug` 中，一个名为 `SimpleLib`\
