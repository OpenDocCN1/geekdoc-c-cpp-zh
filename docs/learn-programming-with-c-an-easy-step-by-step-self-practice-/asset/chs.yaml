  \n## 1.6 关键字\n\n在 C 编程中，32 个保留字对编译器有特殊含义，并作为语法的一部分使用。这些术语不能用作变量的名称或标识符。C 保留关键字列表如下：\n\
  \nauto, break, case, char, const, continue, default, do, int, long, register, return,\
  \ short, signed, sizeof, static, struct, switch, typedef, union, unsigned, void,\
  \ volatile, while, double, else, enum, extern, float, for, goto, if.\n\n## 1.7 标识符\n\
  \n程序中的变量、函数、结构和其他对象被赋予了被称为标识符的唯一名称。例如，在前面的演示程序语句中\n\n```\nint age;\n```\n\n`int`\
  \ 是关键字，`age` 是编译器分配给变量的标识符，用于唯一标识该实体。在命名标识符时，应遵循以下指南。\n\n1.  有效的标识符可以包含大小写字母、数字和下划线。\n\
  2.  标识符不能以数字开头。\n3.  关键字不能用作标识符。\n4.  标识符的长度是限制的。\n\n\n\n\n\n在某些情况下，使用特殊的序列来表示在\
  \ C 程序中无法输入的字符。反斜杠字符是这些序列的另一个称呼。在 C 程序中，使用了以下转义序列：\n\n* `\\b`（退格）\n* `\\f`（分页）\n\
  * `\\n`（换行）\n* `\\r`（回车）\n* `\\t`（水平制表符）\n* `\\v`（垂直制表符）\n* `\\\\`（反斜杠）\n* `\\’`（单引号）\n\
  * `\\”`（双引号）\n* `\\?`（问号）和\n* `\\0`（空字符）\n\n## 1.13 数据类型\n\n在 C 程序中，数据类型用于定义变量，它们决定了变量的类型和大小。特定数据类型的大小取决于编译器。可以使用\
  \ `sizeof(variable name)` 运算符来确定任何数据类型的大小。格式说明符指定了输出或输入函数显示或接收的数据类型。在 C 编程中，以下是数据类型及其相关格式说明符的列表：\n\
  \n* `int` `[%d, %i]`\n* `char` `[%c]`\n* `float` `[%f]`\n* `double` `[%lf]`\n* `short\
  \ int` `[%hd]`\n* `unsigned int` `[%u]`\n* `long int` `[%ld, %li]`\n* `long long\
  \ int` `[%lld, %lli]`\n* `unsigned long int` `[%lu]`\n* `unsigned long long int`\
  \ `[%llu]`\n* `signed char` `[%c]`\n* `unsigned char` `[%c]`\n* `long double` `[%Lf]`\n\
  \n`int`, `float`, `double`, `char` 和 `void` 是基本数据类型，`short` 和 `long` 可以作为类型限定符，`signed`\
  \ 和 `unsigned` 作为类型修饰符。\n\n`void` 在函数不返回任何内容时用作返回类型；尽管它不会创建变量。\n\n## 1.14 类型转换\n\
  \n将一种数据类型转换为另一种类型被称为类型强制转换或类型转换。类型转换有两种形式：\n\n1. **隐式**：在这种情况下，编译器将表达式中不同数据类型的值转换为共同类型，即优先级最高的类型。\n\
  \n   `int → unsigned int → long → unsigned long → long long → unsigned long long\
  \ → float → double → long double`\n\n   示例：\n\n   ![](img/fig0012.jpg)\n\n   在这里，因为\
  \ `float` 数据类型在 `float` 和 `int` 之间优先级更高，算术表达式 `total/count` 给 `float` 值。\n\n2. **显式**：在这种情况下，程序员使用强制转换符显式地将一种类型的值转换为另一种类型。语法如下：\n\
  \n   `(type_name) expression`\n\n   示例：\n\n   ![](img/fig0013.jpg)\n\n   首先将 `total`\
  \ 从 `int` 转换为 `float`，然后执行除法。由于 `total` 已经转换为 `float` 且 `count` 已变更为 `int`，由于 `float`\
  \ 的优先级高于 `int` 数据类型，结果是一个小数值。\n\n## 1.15 示例\n\n### 问题-01：编写一个程序在屏幕上打印“Hello! Atiqur\
