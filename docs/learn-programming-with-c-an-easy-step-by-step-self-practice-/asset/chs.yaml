- "# C 语言编程：C 语言学习阶梯式自学实践指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\nC 是一种每位软件开发者都应该熟悉的编程语言。尽管关于\
  \ C 编程语言的书有很多，但这些书中大多数示例程序在编写时并没有包含算法或任何流程图。因此，学生很难通过自学方法理解编程语言的核心。我们在教学 C 语言的经验强调了通过流程图解决方案呈现\
  \ C 程序，然后是伪代码解决方案，最后是带有逐行解释的实际 C 代码的重要性。\n\n本书是为本科和研究生阶段的 C 语言课程/模块编写的——主要面向初学者。然而，如果某人有编程基础知识，可以跳过前几章。通过阅读本书，任何学生或初学者都可以在从导师那里获得少量或不需要帮助的情况下学习并理解\
  \ C 编程。对于教师来说，这本书是一份易操作的指南。只需通过这本书就足够他们教授 C 编程了——包括理论讲座和实践实验。我们避免了宽泛或过度冗长的陈述或信息过载，本书为\
  \ C 呈现了一个简洁且肯定的视角。\n\n本书被编写作为学习编程的自练习书，通过所有详细的问题解决方案并完成伪代码、流程图和实际代码。此外，读者可以观察到代码中各个步骤与流程图本身更清晰的关联。\n\
  \n本书的特点之一是介绍介绍了一个介绍了如何在不同操作系统和平台上编写和运行 C 代码的新章节。还介绍了如何将 C 代码嵌入其他应用程序。每个章节都包含了许多相关问题和相应的答案。书中还有良好的练习。本书的另一个特色是最后一章，其中介绍了许多项目供学生探索\
  \ C 编程语言的全面性。\n\n书中所有程序的源代码将提供给购买本书的人。尽管我们努力确保本书的完美，但它可能存在需要修改的问题。因此，请随时通过 sazzadmsi@du.bd\
  \ 和 mahad@uel.uk 与我们联系。\n\n总之，这本书对于希望通过详细的教程型问题解决来学习 C 的人来说是一份引导自学书籍。我们认为它非常适合作为\
  \ C 编程语言的教材。\n\n**Prof. Sazzad M.S. Imran, Ph.D.** **Prof. Md Atiqur Rahman Ahad,\
  \ Ph.D.**\n\n`MATLAB`® 是 MathWorks, Inc. 的注册商标。有关产品信息，请联系：\nThe MathWorks, Inc.\n\
  3 Apple Hill Drive\nNatick, MA 01760-2098\n电话：508-647-7000\n传真：508-647-7001\n电子邮箱：info@mathworks.com\n\
  网址：[`www.mathworks.com`](http://www.mathworks.com)\n\n# 第 1 章 引言\n\n\n\n\nC 是一种与机器无关、高效且易用的结构化编程语言，用于创建各种应用程序、操作系统和复杂的程序。C\
  \ 语言被广泛认为是编程语言的基础，这意味着任何理解 C 的人都能快速获取或掌握其他结构化编程语言。丹尼斯·里奇（Dennis Ritchie）是美国贝尔实验室的计算机科学家，他于\
  \ 1972 年设计了 C 编程语言。\n\n## 1. 编程语言的历史\n\n埃达·洛芙拉斯（Ada Lovelace）在 1843 年为早期计算系统创建了第一种编程语言。她为查尔斯·巴贝奇（Charles\
  \ Babbage）的差分机创建了第一个机器算法。然而，康拉德·泽（Konrad Zuse）在 1944 年至 1945 年间创建了第一种真正的编程语言 `Plankalkul`（通常称为计划计算）。此后，在\
  \ 1947 年，凯琳·布斯（Kathleen Booth）发明了汇编语言，这是一种简化机器编码的低级编程语言。约翰·麦考利（John McCauley）于 1949\
  \ 年提出了第一种高级语言 `Shortcode` 或 `Short-order-code`。阿利克·格伦尼（Alick Glennie）于 1952 年为 Mark\
  \ 1 计算机创建了第一种编译语言 `Autocode`。\n\n约翰·巴克斯斯（John Backus）于 1957 年发明了 `FORmula TRANslation`，即\
  \ `FORTRAN`。它是为了复杂的科学、数学和统计计算设计的，并且至今仍在使用。一组美国和欧洲的计算机科学家于 1958 年合作创建了 `ALGOL`（或算法语言）。同年，麻省理工学院（MIT）的约翰·马卡锡（John\
  \ McCarthy）提出了用于人工智能的 `LISP`（列表处理）编程语言。格蕾丝·墨瑞 1·霍珀（Grace Murray Hopper）博士于 1959\
  \ 年监督了 `COBOL`（常用面向业务语言）的开发，该语言为信用卡处理器、ATM、电话和移动手机通话、医院信号、交通信号系统和银行系统而创建。\n\n初级通用符号指令代码，或\
  \ `BASIC`，由达特茅学院的学生于 1964 年创建，随后由微软创始人比尔·盖茨（Bill Gates）和保罗·艾伦（Paul Allen）改进。`PASCAL`\
  \ 是由尼克劳斯·维尔（Niklaus Wirth）于 1970 年创建，以纪念法国数学家布莱斯·帕斯卡（Blaise Pascal）。由于其使用简单且强大，它是苹果公司的首选。施乐克斯帕洛阿尔托研究中心的阿兰·凯（Alan\
  \ Kay）、阿德尔·高德堡（Adele Goldberg）和丹·英格尔斯（Dan Ingalls）于 1972 年创建了 `Smalltalk`。Leafly、Logitech\
  \ 和 CrowdStrike 是使用它的公司之一。同年，丹尼斯·里奇在贝尔电话实验室创建了 `C` 语言用于 Unix 操作系统。`C` 是许多现代语言的基础，包括\
  \ `C#`、`Java`、`JavaScript`、`Perl`、`PHP` 和 `Python`。1972 年，IBM 的研究员雷蒙德·博伊斯（Raymond\
  \ Boyce）和唐纳德·钱钱伯林（Donald Chamberlain）创建了 `SQL`，全称为结构化查询语言。它是一个让你探索和编辑存储在数据库中的数据的程序。\n\
  \n在数学家埃达·洛芙拉斯之后，`Ada` 于 1980–1981 年由 CUU 霍尼韦尔牛的让·伊比亚（Jean Ichbiah）领导的团队创建。`Ada`\
  \ 是一种组织化的、静态类型的、命令式的、宽谱的面向对象的高级编程语言，用于空中交通控制系统。比雅·斯特斯特斯特普（Bjarne Stroustrup）在 1983\
  \ 年修改贝尔实验室的 `C` 语言后创建了 `C++`。`C++` 是一种高性能编程语言，用于 Microsoft Office、Adobe Photoshop、游戏引擎和其他高性能软件。布拉德·考克斯（Brad\
  \ Cox）和汤姆·洛夫（Tom Love）于 1983 年创建了 `Objective-C` 编程语言，用于构建 macOS 和 iOS 的软件。拉里·沃尔（Larry\
  \ Wall）于 1987 年设计了 `Perl`，作为一种用于文本编辑的通用高级编程语言。\n\n`Haskell` 是一种通用编程语言，创建于 1990 年，用于处理复杂的计算、记录和数字处理。吉多·范·罗斯姆（Guido\
  \ Van Rossum）于 1991 年创建了通用高级语言 `Python`，它被 Google、Yahoo 和 Spotify 使用。`Visual Basic`\
  \ 是微软于 1991 年创建的一种编程语言，允许程序师使用图形用户界面，并用于 Word、Excel 和 Access 等各种应用程序。松本裕弘（Yukihiro\
  \ Matsumoto）于 1993 年设计了 `Ruby`，作为一种用于 Web 开发的解释型高级语言。詹姆斯·高斯林（James Gosling）于 1995\
  \ 年设计了 `Java`，作为一种具有跨平台能力的通用高级语言。拉穆斯·莱尔多夫（Rasmus Lerdorf）于 1995 年创建了超文本处理器 `PHP`，用于创建和维护动态网页和服务器端应用程序。布伦丹·艾奇（Brendan\
  \ Eich）于 1995 年编写了 `JavaScript`，用于桌面组件、动态 Web 开发和 PDF 文档。\n\n微软于 2000 年通过结合 `C++`\
  \ 的计算能力和 `Visual Basic` 的简单性创建了 `C#`。目前几乎每个微软产品都使用 `C#`。2003 年，马丁·奥德斯（Martin Odersky）创建了\
  \ `Scala`，它结合了函数数学和面向对象编程。`Scala` 是一种兼容 `Java` 的编程语言，在 Android 开发中有用。2003 年，詹姆斯·斯特拉尚（James\
  \ Strachan）和鲍勃·麦惠特（Bob McWhirter）创建了 `Groovy`，这是一种源自 `Java` 的简洁易学的语言。Google 于 2009\
  \ 年创建了 `Go`，从那以后在 Uber、Twitch 和 Dropbox 中广受欢迎。苹果于 2014 年创建了 `Swift`，用于取代桌面、移动端和云应用程序的\
  \ `C`、`C++` 和 `Objective-C`。\n\n## 2. 不同编程语言\n\n为了与计算机通信，程序员利用编程语言。计算机语言分为三大类：\n\
  \n1. `机器语言`\n   被称为机器码或对象代码，一组二进制数字 0 和 1。计算机可以轻松理解，但用户不能。\n\n2. `汇编语言`\n   被认为是低级语言，用于实现机器码的符号表示。计算机可以理解，但用户不能。\n\
  \n3. `高级语言`\n   用户容易理解。计算机无法理解，因此需要转换为机器码。不同类型的高语言如下：\n\n   1. 算法语言——`FORTRAN`、`ALGOL`、`C`\n\
  \   2. 面向业务语言——`COBOL`、`SQL`\n   3. 面向教育语言——`BASIC`、`Pascal`、`Logo`、`Hypertalk`\n\
  \   4. 面向对象语言——`C++`、`C#`、`Ada`、`Java`、`Visual Basic`、`Python`\n   5. 声明式语言——`PROLOG`、`LISP`\n\
  \   6. 脚本语言——`Perl`\n   7. 文档格式语言——`TeX`、`PostScript`、`SGML`\n   8. 世界维网显示语言——`HTML`、`XML`\n\
  \   9. Web 脚本语言——`JavaScript`、`VB Script`\n\n## 3. 编程的重要性\n\n近年来，编程已成为最受欢迎的技能。从智能电视到厨房电器，技术颠覆几乎随处可见。结果是许多就业机会被创造，许多现有工作被重新定义。编程技能在各种职业领域提供了竞争优势。编程帮助我们进行更有逻辑分析性的思考。尽早学习编程语言的学生未来将有很多职业选择。学习编程不再是一种选择，而是必须掌握的技能。除了软件和应用开发，业务分析师、图形艺术家和数据科学家也是需要编程知识的职业。\n\
  \n## 4. C 程序结构\n\n任何 C 程序的源代码都是根据计算机语言的语法编写的。C 源代码可以在任何文本编辑器中编写并以 `.c` 扩展名保存，例如\
  \ `filename.c`。文件名可以使用字母数字（包括下划线），但不能使用任何关键字作为文件名。之后，可以使用任何标准 C 编译器（如 `Turbo C`\
  \ 或 `CodeBlocks`）编译并运行源文件。让我们从第一个 C 程序开始。\n\n输入和输出：\n\n程序说明：\n\n\n\n注释：C 程序中的任何注释都以\
  \ `/*` 开始并以 `*/` 结束。// 也可以被用于编写单行注释。虽然不是强制要求写注释，但这样做是一个良好的习惯，可以提高程序的可读性。程序中的任何地方都可以放置任意数量的注释，因为注释不会被执行。\n\
  \n包含：任何 C 程序都可能需要许多关键字和库函数，例如 `printf()` 和 `scanf()`。`stdio.h`、`conio.h` 以及其他头文件包含了程序必须包含的库函数的原型或声明。本程序包含了头文件\
  \ `stdio.h`。它 了函数 `printf()` 的声明，该函数在标准输出终端上显示数据；以及 `scanf()`，从标准输入终端读取数据。\n\n显示：内置库函数\
  \ `printf()` 在输出控制台上显示双双引号内的任何内容。也可以使用格式占位符显示变量的值。\n\n用户输入：C 库函数 `scanf()` 从输入终端获取输入。程序执行后，输入控制台会等待输入，一旦输入年龄，剩余语句将根据输入的年龄进行执行。\n\
  \nmain() 函数：`main()` 函数用于开始执行任何 C 程序源代码；因此，每个 C 程序都必须有一个。`main()` 函数具有以下结构。函数名后面是返回类型，可以是\
  \ `int` 或 `void`。返回类型用于编译器判断程序是否成功编译。我们在 `main()` 函数的末尾处返回 `0`，因为 `0` 是“程序成功执行”的标准。此外，ANSI\
  \ 标准不允许使用 `void main()`；因此，优于 `void main()` 的的是使用 `int main()`。如果函数名后有任何参数或参数，它们被括在括号中；否则，留为空。`main()`\
  \ 函数的体由位于左右大括号之间的所有语句组成。\n\n## 1.5 运行 C 程序的分步教程\n\n我们在 Windows 操作系统上使用 `Code::Blocks`\
