  \t\t第 3 次迭代后 abc[2].c=abc[2].c=i%2=2%2=0 依此类推*/\n\t\tabc[i].b=(i/2)%2;\n\t\t/*在每次迭代中根据对应的十进制数\
  \ 0, 1, 2, … 计算中间位，并将其存储在每个数组元素 abc[] 的成员 b 中，因此\n\t\t第 1 次迭代后- abc[0].b=abc[0].b=(i/2)%2=(0/2)%2=0%2=0\n\
  \t\t第 2 次迭代后- abc[1].b=abc[1].b=(i/2)%2=(1/2)%2=0%2=0\n\t\t第 3 次迭代后- abc[2].b=abc[2].b=(i/2)%2=(2/2)%2=1%2=1\
  \ 依此类推*/\n\t\tabc[i].a=(i/2)/2;\n\t\t/*在每次迭代中根据对应的十进制数 0, 1, 2, … 计算最高位 (MSB)，并将其存储在每个数组元素\
