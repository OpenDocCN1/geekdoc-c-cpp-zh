  \tscanf：“%f”, &gdprice);\n\t/*函数 scanf() 从输入终端读取一个小数，并将其存储在分配给 gdprice 的内存空间中*/\n\
  \tprintf(“输入今天每 vori 的白银价格是多少？ ”);\n\t/*printf() 函数将引号内的文本原样显示在屏幕上*/\n\tscanf：“%f”,\
