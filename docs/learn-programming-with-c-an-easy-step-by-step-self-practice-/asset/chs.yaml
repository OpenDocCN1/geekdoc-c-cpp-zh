  \ ENTER at end.\\n\");\n\t/*输出函数 `printf()` 将引号内的文本原样显示在屏幕上，但 `\\n` 会被换行*/\n\twhile\
  \ (end==0) {\n\t\t/*如果条件为真，则执行大括号括的后续语句，并重新检查条件；这个过程一直持续直到条件变为假，此时程序流退出循环*/\n\t\t\
  k=0;\n\t\t/*变量 `k` 初始化为 0*/\n\t\tfor (ch=getchar(); ch!='\\n'; k++) {\n\t\t/*这个\
  \ for 循环用于输入文本，每次迭代一个字符；`ch=getchar()` 是初始化，`ch!='\\n'` 是条件，`k++` 是递增；初始化在循环开始时执行一次；`getchar()`\
