  \t\t\thead1->next=0;\n\t\t\t/*最后一个节点的 next 指针设置为 0，链表中没有更多节点*/\n\t\t\tfree(pt);\n\
  \t\t\t/*释放 pt 分配的内存空间*/\n\t\t}\n\t\t/*‘else’ 结束*/\n\t}\n\t/*(key==−99) 的 ‘if’ 结束*/\n\
  \telse{\n\t/*如果 key≠99，我们向链表中添加更多节点，执行花括号内的语句*/\n\t\tcount++;\n\t\t/*‘count’的值加\
  \ 1，以计数链表的节点数量*/\n\t\thead1=pt;\n\t\t/*函数调用中的指针 pt 被赋值给 head1；head1 始终指向链表的最后一个节点*/\n\
  \t\tpt->num=key;\n\t\t/*用户输入的 key 值被赋值给最后一个节点的成员 num*/\n\t\tpt->next=(node *)malloc(sizeof(node));\n\
  \t\t/*创建了一个新节点，其地址赋值给最后一个节点的成员 next；sizeof() 函数计算 node 类型的大小（存储一个整数和一个另一个地址所需的）；malloc()\
  \ 动态分配所需的内存空间*/\n\t\tcreate(pt->next);\n\t\t/*再次调用 create() 定义新创建的节点；程序控制流跳转到函数的定义处*/\n\
  \t}\n\t/*(key==−99) 的 ‘else’ 结束*/\n}\n/*右花括号指定了 create() 函数定义的结束；控制流返回到函数调用处*/\n\
  void print(node *pt){\n/*print() 函数的定义在此开始，包含函数头和函数体；函数头与没有分号的原型相同；函数体在花括号内；函数调用期间传递的实际参数替换了虚拟参数\
  \ pt*/\n\tif (pt->num==−99)\n\t/*如果第一个节点成员 num 的值为 −99，链表为空，执行后续语句*/\n\t\tprintf(“The\
