  \n图 4.9 解决问题时遵循的流程图。\n\n#### 解决方案算法：\n\n* 步骤-1: 开始。\n* 步骤-2: 读取 `deg` 的值。\n* 步骤-3:\
  \ 初始化 `i←0`\n* 步骤-4: 如果 `i<=deg`\n    * 4.1: 读取 `coef[i]` 的值\n    * 4.2: `i←i+1`\n\
  \    * 4.3: 跳转到步骤-4\n* 步骤-5: 读取 `x` 的值\n* 步骤-6: `y←poly(coef, deg, x)` [调用函数 `poly()`]\n\
  * 步骤-7: `dy←deriv(coef, deg, x)` [调用函数 `deriv()`]\n* 步骤-8: 显示 `x`, `y` 和 `dy` 的值\n\
  * 步骤-9: 停止。\n\n## 函数 `poly(float coef1[], int deg1, float x1)` 的算法：\n\n* 步骤-1: `res←coef1[deg1]`\n\
  * 步骤-2: 初始化 `j←deg1`\n* 步骤-3: 如果 `j>=1`\n    * 3.1: `res←(coef1[j−1]+x1*res)`\n\
  \    * 3.2: `j←j−1`\n    * 3.3: 跳转到步骤-3\n* 步骤-4: 返回 `res` 的值。\n\n## 函数 `deriv(float\
  \ coef1[], int deg1, float x1)` 的算法：\n\n* 步骤-1: 初始化 `sum←0` 和 `k←0`\n* 步骤-2: 如果\
  \ `k<deg1`\n    * 2.1: `ps←pow(x1, deg1−(k+1))` [调用函数 `pow()`]\n    * 2.2: `dp←(deg1−k)×coef1[deg1−k]×ps;`\n\
  \    * 2.3: `sum←sum+dp`\n    * 2.4: `k←k+1`\n    * 2.5: 跳转到步骤-2\n* 步骤-3: 返回 `sum`\
  \ 的值\n\n## 解决方案的编程代码：\n\n![](img/fig0191.jpg)![](img/fig0192.jpg)![](img/fig0193.jpg)\n\
