  \ (.) 运算符 std1.name 访问*/\n\tprintf(“Enter roll number of the student: ”);\n\t/*这会将双引号内的文本原样显示在屏幕上*/\n\
  \tscanf(“%d”, &std1.roll);\n\t/*scanf() 函数从输入终端读取一个整数并存储在 std1 结构的第二个成员中，通过点 (.)\
