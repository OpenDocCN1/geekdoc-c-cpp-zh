  \ 使用的随机数生成算法的种子由 srand() 函数设置；我们不断修改 srand() 函数的种子以确保 rand() 返回的数字是真随机的；库函数 time()\
  \ 返回当前的计算机时间（秒），该时间在每次程序运行时各不相同*/\n\tfor (cnt=0; cnt<num1; cnt++){\n\t/*此 for 循环用于生成\
  \ num1 个随机数，每次迭代生成一个；cnt=0 是初始化；cnt<num1 是条件；cnt++ 是递增；初始化在循环开始时执行一次；如果 cnt 小于 num1，则执行循环体；在重新检查条件之前，cnt\
  \ 的值加 1；这些步骤持续进行直到条件变为假，此时程序流退出循环*/\n\t\tnum=min+((rand()%10)/9.0)*(max−min);\n\t\
  \t/*rand() 函数在每次迭代中生成一个随机数；rand()%10 返回 0 到 9 之间的随机值，因此 (rand()%10)/9.0 返回 0 到 1\
