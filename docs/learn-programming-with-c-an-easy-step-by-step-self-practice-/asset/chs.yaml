  ### 问题-14 写一个程序来统计给定文本的行数、单词和字符数。\n\n#### 解决方案的流程图：\n\n图 3.7 显示了解决此问题所遵循的流程图。\n\n\
  ![](img/fig3_7.jpg)\n\n图 3.7 解决此问题所遵循的流程图。\n\n#### 解决方案的算法：\n\n* 步骤-1：开始\n* 步骤-2：初始化\
  \ `end←0`，`chnm←0`，`word←0` 和 `line←0`\n* 步骤-3：如果 `end=0`\n    * 3.1：初始化 `k←0`\n\
