  38. 编写一个程序从循环链表的任意位置删除一个节点。\n\n# 第 6 章 文件管理\n\nDOI: [10.1201/9781003302629-6](https://doi.org/10.1201/9781003302629-6)\n\
  \n文件是一个存储某些数据的内存空间。C 语言提供了各种函数来处理文件。本章提供了如何操作文件的机制/方法，即文件管理。\n\n## 6.1 文件类型\n\n\
  在 C 语言中需要文件主要有以下三个原因：\n\n1. 在程序终止后保留数据。\n2. 通过访问可能存储数据的文件来输入大量数据。\n3. 将数据从一台计算机移动到另一台计算机。\n\
  \nC 程序中允许使用两种类型的文件：\n\n1. 文本文件：任何文本编辑器或 `.txt` 文件。所有内容均为纯文本，可以容易地编辑或删除。\n2. 二进制文件：任何\
  \ `.bin` 文件。所有内容均为二进制形式（0 和 1），无法被容易地编辑，因此提供了更好的安全性。\n\n## 6.2 文件操作\n\nC 语言中对文件进行的一些主要操作如下：\n\
  \n1. **打开文件：** 使用 `fopen()` 打开文件。当 `fopen()` 成功打开文件时，它将返回文件第一个字符的地址；否则，返回 `NULL`。语法如下：\n\
  \n> `FILE *ptr_name fopen(“file_name”, “mode”);`\n\n`FILE` 是在 `stdio.h` 头文件中定义的结构化数据类型，用于引用不同的文件操作。\n\
  `ptr_name` 是你选择的任意指针名。\n`file_name` 是你想要打开的文件名，带有完整路径。\n`mode` 决定了允许对文件执行的各种操作。\n\
  \n各种文件打开模式如下：\n\n* `r`, `rb` – 只读模式，返回第一个字符的地址。\n* `w`, `wb` – 只写模式，返回第一个字符的地址。\n\
  * `a`, `ab` – 用于在文件末尾追加内容，返回最后一个字符的地址。\n* `r+`, `rb+` 或 `w+`, `wb+` – 读取、写入或修改内容，返回第一个字符的地址。\n\
  * `a+`, `ab+` – 读取或追加内容，但不允许修改。\n\n示例：\n![](img/fig0277.jpg)\n\n在使用文件或执行任何文件操作之前，我们应该始终检查文件是否成功打开。以下代码将完成这项工作：\n\
  \n![](img/fig0278.jpg)\n\n2. **读取文件：** 文件首先需要以读取模式打开。之后，`fgetc()` 函数按顺序逐个读取字符，直到达到\
  \ `EOF`（文件结束）。示例：\n\n![](img/fig0279.jpg)\n\n要从文件中读取字符串，会使用 `fgets()` 函数。示例：\n>\
  \ `fgets(str, 10, fpr);`\n\n`str` 是 `char` 数组，读取后字符串将存储其中，`10` 是要读取的字符数。\n\n3. **写入文件：**\
  \ 文件首先需要以写入或追加模式打开。之后，使用 `fprintf()` 或 `fputc()` 函数向文件写入数据。示例：![](img/fig0280.jpg)``fputs()`\
  \ 函数用于向文件写入字符串。示例：`fputs(str, fpw);`\n\n4. **关闭文件：** 使用 `fclose()` 函数关闭已打开的文件。语法：`fclose(fpw);`\n\
  \n调用 `fclose()` 函数可以确保文件描述符被正确释放，输出缓冲区被刷新，这样写入文件的数据将保存在文件中。如果有人忘记这样做，操作系统会在程序终止前正常关闭文件。\n\
  \n若要以二进制格式读取或写入，我们需要更改文件名和操作模式，如下所示：\n\n![](img/fig0281.jpg)\n\n## 6.3 预处理器\n\n\
  预处理器允许定义宏并在编译前转换源代码。指令指示预处理器执行某些操作。预处理指令的一些常见用途如下：\n\n1. 包含头文件：`#include <stdio.h>`，这将在转换时替换头文件\
  \ `stdio.h` 的内容。\n2. 使用 `#define` 定义宏：`#define PI 3.14`，这将在转换期间替换 `3.14`。\n3. 函数形式的宏：`#define\
  \ CIRCLE(rad) 3.14*rad`，每当程序遇到 `CIRCLE(rad)` 时，都会将其替换为 `3.14*rad`。\n\n## 6.4 条件编译\n\
  \n条件指令用于指示预处理器根据某些条件包含数据块或语句。通过条件指令，同一个源文件可以用于不同的程序。一些重要的条件指令如下：\n\n```\n 1)#ifdef\
  \ MAC\n\t\t//如果定义了 MAC，则包含这些代码\n\t #endif\n2)#if expression\n\t\t\t//如果表达式的值不为零，则包含这些代码\n\
  \t #endif\n3)#if expression\n\t\t\t//如果表达式的值不为零，则包含这些代码\n\t #else\n\t\t\t//如果表达式的值为零，则包含这些代码\n\
  \t #endif\n4)#if expression\n\t\t\t//如果表达式的值不为零，则包含这些代码\n\t #elif expression1\n\t\
  \t\t//如果表达式 1 的值不为零，则包含这些代码\n\t #elif expression2\n\t\t\t//如果表达式 2 的值不为零，则包含这些代码\n\
  \t #else\n\t\t\t//如果以上所有表达式的值为零，则包含这些代码\n\t #endif\n```\n\n## 6.5 示例\n\n### **问题-01**\
  \ **编写一个程序读取学生的姓名和分数，并将它们存储在文件中。**\n\n解决方案的编程代码：\n\n![](img/fig0283.jpg)![](img/fig0282.jpg)\n\
  \n执行程序的输入和输出：\n\n![](img/fig0284.jpg)\n\n#### **对编程代码的解释：**\n\n\n\n\n```c\n#include\
  \ <stdio.h>\n/*stdio.h 头文件包含库函数 `printf()`、`scanf()`、`gets()`、`fopen()`、`fprintf()`\
  \ 和 `fclose()` 的原型声明，因此需要使用 #include 预处理指令包含它*/\n#include <stdlib.h>\n/*stdlib.h\
  \ 头文件包含库函数 `exit()` 的原型声明，因此需要使用 #include 预处理指令包含它*/\nint main(){\n/*C 程序从 main()\
  \ 函数开始，该函数返回一个整数且该函数没有参数；左大括号表示 main() 函数体的开始，程序执行从紧挨着大括号的第一条语句开始*/\n\tchar name[50];\n\
  \t/*声明了一个 char 类型数组，它只能接收字符。数组的大小为 50，意味着它可以最多容纳 50 个字符。每个数组元素可以使用从 0 到 49 的索引进行访问，即字体\
  \ `name[0]`、`name[1]`、……`name[49]`*/\n\tfloat mark;\n\t/*声明了一个 float 类型变量，它可以接收并存储任何小数值*/\n\
  \tFILE *fptr;\n\t/*FILE 是在 stdio.h 头文件中定义的结构化数据类型。在这里声明了一个 FILE 类型指针来引用任何文件*/\n\t\
  fptr = fopen(“C:\\\\Intel\\\\student.txt”, “w”);\n\t/*fopen() 函数在 C:\\\\Intel\\\\\
  \ 地址打开一个名为 student.txt 的文本文件，使用写入模式（由“w”表示），并返回一个 FILE 类型指针*/\n\tif (fptr == NULL){\n\
  \t/*在 C 中打开文件后，我们必须始终检查文件是否成功打开。为了做到这一点，我们检查 `fopen()` 函数返回的指针。如果它为 NULL，则文件无法打开。因此，这里如果文件打开失败条件为真，将执行后续两条语句*/\n\
  \t\tprintf(“Error in opening the file, exiting …”);\n\t\t/*输出函数 `printf()` 将在屏幕上显示双引号内的消息*/\n\
  \t\texit(1);\n\t\t/*exit(1) 函数导致程序异常终止。在终止之前，所有缓冲区、临时文件、流都会被删除或清除*/\n\t}\n\t/*此右大括号表示\
  \ if 体的结束*/\n\tprintf(“Enter name of the student:”);\n\t/*输出函数 `printf()` 将在屏幕上显示双引号内的消息*/\n\
  \tgets(name);\n\t/*gets() 是一个输入函数，可以接收任何字符串或字符数组（包括空格、制表符等），以 NULL 字符 \\0 结尾并将字符串存储到参数名中*/\n\
  \tprintf(“Enter marks of the student:”);\n\t/*输出函数 `printf()` 将在屏幕上显示双引号内的消息*/\n\
  \tscanf(“%f”, &mark);\n\t/*scanf() 函数从标准输入终端获取一个小数，并将浮点值存储到变量 `mark` 中*/\n\tfprintf(fptr,\
  \ “\\nName: %s\\nMarks: %0.2f\\n”, name, mark);\n\t/*fprintf() 函数将双引号内的信息写入指针 `fptr`\
  \ 所引的文件。在这里用换行符替换换行字符，用字符串 `name` 替换 %s 格式说明符，用小数值 `mark` 替换 %0.2f 格式说明符（保留 2 位小数）*/\n\
  \tfclose(fptr);\n\t/*一旦在 C 中打开文件，在程序结束前关闭文件是一个良好习惯，以便正确冲刷输出缓冲区。这里通过 `fclose()` 函数实现，该函数关闭由参数\
  \ `fptr` 所引的文件*/\n\treturn 0;\n\t/*返回 0 是因为它是程序成功执行的标准*/\n}/*该右大括号表示 main() 函数体的结束以及程序的结束。在该大括号之后将不再有语句执行*/\n\
  ```\n\n\n\n\n```c\n#include <stdio.h>\n/*stdio.h 头文件包含库函数 printf(), fgetc(), fopen()\
  \ 和 fclose() 的原型声明，因此需要使用 #include 预处理器指令包含*/\n#include <stdlib.h>\n/*stdlib.h 头文件包含库函数\
  \ exit() 的原型声明，因此需要使用 #include 预处理器指令包含*/\nint main(){\n/*C 程序从 main() 函数开始，该函数返回一个整数且没有参数；左大括号表示\
  \ main() 函数主体的开始，程序执行从该大括号后的第一条语句开始*/\n\tchar ch;\n\t/*声明了一个 char 类型的变量，它只能接收和存储字符*/\n\
  \tFILE *fptr;\n\t/*FILE 是在 stdio.h 头文件中定义的结构数据类型。在这里声明了一个 FILE 类型指针来引用任何文件*/\n\t\
  fptr = fopen(“C:\\\\Intel\\\\student.txt”, “r”);\n\t/*fopen() 函数在地址 C:\\\\Intel\\\
  \\ 处打开一个名为 student.txt 的文本文件，使用读取模式（由“r”指示），并返回一个 FILE 类型指针*/\n\tif (fptr == NULL){\n\
  \t/*在 C 中打开文件后，我们必须始终检查文件是否成功打开。为了这样做，我们检查 fopen() 函数返回的指针。如果它是 NULL，则文件可能没有打开。因此，这里如果文件打开失败条件为真，将执行后续两条语句*/\n\
  \t\tprintf(“Error in opening the file, exiting …”);\n\t\t/*输出函数 printf() 将在屏幕上显示双引号内的消息*/\n\
  \t\texit(1);/*exit(1) 函数导致程序异常终止。在终止之前，所有的缓冲区、临时文件、流都会被删除或清除*/\n\t}\n\t/*此右大括号表示\
  \ if 块体的结束*/\n\tprintf (“Contents of the file are:\\n”);\n\t/*输出函数 printf() 将在屏幕上显示双引号内的消息*/\n\
  \tch = fgetc(fptr);\n\t/*fgetc() 函数从指针 fptr 所指的文件读取一个字符。开始时，它读取第 1 字符，指针会自动指向下一个字符。这里\
  \ ch=第 1 字符，指针指向第 2 字符*/\n\twhile (ch!= EOF){\n\t/*将 ch 与 EOF 比较，意味着是否到达文件末尾。如果没有，则执行\
  \ while 循环体内的语句*/\n\t\tprintf (“%c”, ch);\n\t\t/*输出函数 printf() 将根据格式指定符 %c 在屏幕上显示与\
  \ ch 对应的字符*/\n\t\tch = fgetc(fptr);\n\t\t/*现在 fgetc() 函数在第一次迭代中读取文件的第 2 个字符，指针指向第\
  \ 3 字符。此 ch=第 2 字符与 EOF 比较，如果还没有到达文件末尾，printf() 函数打印 ch=第 2 字符，fgetc() 函数读取第 3 字符。此过程一直持续到我们到达\
  \ EOF，在这种情况下条件变为假，程序跳出 while 循环*/\n\t}\n\t/*此右大括号表示 while 循环的结束*/\n\tfclose(fptr);\n\
  \t/*在 C 中打开文件后，在程序结束前关闭文件是一个良好的习惯，可以正确刷新输出缓冲区。这里通过 fclose() 函数实现，该函数关闭由其参数 fptr\
  \ 引用的文件*/\n\treturn 0;\n\t/*返回 0 是因为它是程序成功执行的标准*/\n}\n/*右大括号表示 main() 函数主体的结束以及程序的结束。在该大括号之后将不再有语句执行*/\n\
  ```\n\n### 问题-04：n 名学生的年终考试结果如下表所示：\n\n| 学号. | EEE-1101 | EEE-1102 | EEE-1103 |\n\
  | --- | --- | --- | --- |\n| 101 | 69 | 56 | 89 |\n| 102 | 80 | 65 | 91 |\n| 103\
  \ | 45 | 36 | 68 |\n\n编写一个程序读取数据并确定以下内容：\n\n1. 每个学生在每门科目中的等级。\n\n| 分数 | 字母等级 | 学分点\
  \ |\n| --- | --- | --- |\n| 90% 及以上 | A+ | 4.00 |\n| 80% 到 <90% | A | 3.50 |\n|\
  \ 70% 到 <60%（注：此处原文应为 70%~<80%） | B | 3.00 |\n| 60% 到 <70% | C | 2.50 |\n| 50% 到\
  \ <60% | D | 2.00 |\n| 低于 50% | F | 0.00 |\n\n2. 每个学生的总分和 GPA。\n3. 每个学生根据 GPA 的排名（如果\
  \ GPA 相同，则考虑总分较高者）。\n4. 结果应该根据学号和排名显示。\n5. 将结果保存到文本文件中，并从文本文件中检索并打印结果。\n\n#### 解决方案的流程图：\n\
  \n图 6.1 显示了解决此问题遵循的流程图。\n\n![](img/fig6_1.jpg)\n\n图 6.1 解决问题的流程图。\n\n#### 解决方案的算法：\n\
  \n* **步骤-1**: 开始\n* **步骤-2**: 定义结构体 `subject`，包含 `mark`、`point` 和 `letter`\n* **步骤-3**:\
  \ 定义结构体 `exam`，包含 `roll`、`sub[100]`、`total`、`gpa` 和 `pos`\n* **步骤-4**: 读取 `numstd`\
  \ 和 `numsub`\n* **步骤-5**: 初始化 `i <- 0`\n* **步骤-6**: 如果 `i < numstd`\n    * **6.1**:\
  \ 读取 `stud[i]`\n    * **6.2**: 初始化 `stud[i].total <- 0`，`totgrd <- 0` 和 `j <- 0`\n\
  \    * **6.3**: 如果 `j < numsub`\n        * **6.3.1**: 读取 `stud[i].sub[j]`\n    \
  \    * **6.3.2**: 如果 `stud[i].sub[j].mark >= 90`\n            * **6.3.2.1**: `stud[i].sub[j].point\
  \ <- 4.00`\n            * **6.3.2.2**: `stud[i].sub[j].letter <- \"A+\"`\n     \
  \       * **6.3.2.3**: 跳到步骤 6.3.9\n        * **6.3.3**: 如果 `stud[i].sub[j].mark\
  \ >= 80`\n            * **6.3.3.1**: `stud[i].sub[j].point <- 3.50`\n          \
  \  * **6.3.3.2**: `stud[i].sub[j].letter <- \"A\"`\n            * **6.3.3.3**: 跳到步骤\
  \ 6.3.9\n        * **6.3.4**: 如果 `stud[i].sub[j].mark >= 70`\n            * **6.3.4.1**:\
  \ `stud[i].sub[j].point <- 3.00`\n            * **6.3.4.2**: `stud[i].sub[j].letter\
  \ <- \"B\"`\n            * **6.3.4.3**: 跳到步骤 6.3.9\n        * **6.3.5**: 如果 `stud[i].sub[j].mark\
  \ >= 60`\n            * **6.3.5.1**: `stud[i].sub[j].point <- 2.50`\n          \
  \  * **6.3.5.2**: `stud[i].sub[j].letter <- \"C\"`\n            * **6.3.5.3**: 跳到步骤\
  \ 6.3.9\n        * **6.3.6**: 如果 `stud[i].sub[j].mark >= 50`\n            * **6.3.6.1**:\
  \ `stud[i].sub[j].point <- 2.00`\n            * **6.3.6.2**: `stud[i].sub[j].letter\
  \ <- \"D\"`\n            * **6.3.6.3**: 跳到步骤 6.3.9\n        * **6.3.7**: `stud[i].sub[j].point\
  \ <- 0.00`\n        * **6.3.8**: `stud[i].sub[j].letter <- \"F\"`\n        * **6.3.9**:\
  \ `stud[i].total <- stud[i].total + stud[i].sub[j].mark`\n        * **6.3.10**:\
  \ `totgrd <- totgrd + stud[i].sub[j].point`\n        * **6.3.11**: `j <- j + 1`\n\
  \        * **6.3.12**: 跳到步骤 6.3\n    * **6.4**: `stud[i].gpa <- totgrd / numsub`\n\
  \    * **6.5**: `i <- i + 1`\n    * **6.6**: 跳到步骤 6\n* **步骤-7**: 初始化 `i <- 1`\n\
  * **步骤-8**: 如果 `i <= numstd - 1`\n    * **8.1**: 初始化 `j <- 1`\n    * **8.2**: 如果\
  \ `j <= numstd - i`\n        * **8.2.1**: 如果 `stud[j-1].gpa < stud[j].gpa`\n   \
  \         * **8.2.1.1**: `temp <- stud[j-1]`\n            * **8.2.1.2**: `stud[j-1]\
  \ <- stud[j]`\n            * **8.2.1.3**: `stud[j] <- temp`\n            * **8.2.1.4**:\
  \ 跳到步骤 8.2.3\n        * **8.2.2**: 如果 `stud[j-1].gpa == stud[j].gpa`\n         \
  \   * **8.2.2.1**: 如果 `stud[j-1].total < stud[j].total`\n                * **8.2.2.1.1**:\
  \ `temp <- stud[j-1]`\n                * **8.2.2.1.2**: `stud[j-1] <- stud[j]`\n\
  \                * **8.2.2.1.3**: `stud[j] <- temp`\n        * **8.2.3**: `j <-\
  \ j + 1`\n        * **8.2.4**: 跳到步骤 8.2\n    * **8.3**: `i <- i + 1`\n    * **8.4**:\
  \ 跳到步骤 8\n* **步骤-9**: 初始化 `i <- 0`\n* **步骤-10**: 如果 `i < numstd`\n    * **10.1**:\
  \ `stud[i].pos <- i + 1`\n    * **10.2**: `i <- i + 1`\n    * **10.3**: 跳到步骤 10\n\
  * **步骤-11**: `fp <- fopen()`\n* **步骤-12**: 如果 `fp == NULL`\n    * **12.1**: 显示 “无法打开”\n\
  \    * **12.2**: 跳到步骤 24\n* **步骤-13**: 初始化 `i <- 0`\n* **步骤-14**: 如果 `i < numstd`\n\
  \    * **14.1**: 保存 `stud[i].roll` 到文件\n    * **14.2**: 初始化 `j <- 0`\n    * **14.3**:\
  \ 如果 `j < numsub`\n        * **14.3.1**: 将 `stud[i].sub[j].letter`、`stud[i].sub[j].point`、`stud[i].gpa`\
  \ 和 `stud[i].pos` 保存到 `fp`\n        * **14.3.2**: `j <- j + 1`\n        * **14.3.3**:\
  \ 跳到步骤 14.3\n    * **14.4**: `i <- i + 1`\n    * **14.5**: 跳到步骤 14\n\n\n\n\n\n###\
  \ 16.2.1: 如果 `stud[j−1].roll>stud[j].roll`\n* 16.2.1.1: `temp←stud[j−1]`\n* 16.2.1.2:\
