  \ sub[10];\n\t/*声明一个大小为 10 的 `subject`结构类型数组 `sub[]` 为结构化数据类型 `exam` 的成员，用于存储特定学生最多\
  \ 10 门课程的信息*/\n\tfloat gpa;\n\t/*声明浮点型变量 `gpa` 为结构化数据类型 `exam` 的成员，用于存储为特定学生计算的\
  \ GPA*/\n};\n/*结构化数据类型的定义必须以分号结束；此处没有声明定义的数据类型 `marks` 的变量*/\nint main(){\n\t/*所有\
  \ C 程序必须有一个返回类型为 `void` 或 `int` 的 `main()` 函数；此处 `main()` 函数没有参数且返回一个整数；左花括号指定 `main()`\
  \ 函数的开始，该花括号之前的任何语句都不会被编译器执行*/\n\tstruct exam stud[100], temp;\n\t/*声明 struct exam\
  \ 类型变量 `temp` 和一个大小为 100 的数组 `stud[]`；变量的成员和数组元素通过点运算符 (`.`) 进行访问*/\n\tint numstd,\
  \ numsub, i, j;/*声明了四个整数型变量；为每个变量分配了所需的内存空间*/\n\tfloat totgrd;\n\t/*声明了一个浮点型变量；为该变量分配了所需的内存空间*/\n\
  \tprintf(\"Enter the number of students: \");\n\t/*输出函数 `printf()` 将引号内的文本原样显示在屏幕上*/\n\
  \tscanf(\"%d\", &numstd);\n\t/*`scanf()` 函数从输入终端读取一个整数，并将其存储在变量 `numstd` 分配的内存空间中*/\n\
