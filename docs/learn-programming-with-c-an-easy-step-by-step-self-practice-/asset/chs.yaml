  4. 编写一个程序删除并替换文本中的特定行。\n5. 编写一个程序复制文件并将其写入新文件。\n6. 编写一个程序合并两个文件并将其写入新文件。\n7. 编写一个程序从文件中读取字符串并显示给用户。\n\
