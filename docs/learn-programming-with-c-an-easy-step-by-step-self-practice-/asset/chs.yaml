  #include <stdlib.h>\n/*头文件 stdlib.h 包含库函数 `abs()` 的原型声明；在程序调用该函数之前，必须使用预处理器指令 `#include`\
  \ 包含该头文件*/\n#include <math.h>\n/*头文件 math.h 包含库函数 `ceil()` 的原型声明；在程序调用该函数之前，必须使用预处理器指令\
  \ `#include` 包含该头文件*/\nstruct marks{/*结构化数据类型 marks 使用关键字 `struct` 定义；其成员在花括号内声明*/\n\
  \tint roll;\n\t/*整数型变量 `roll` 被声明为数据类型 `struct marks` 的第一个成员*/\n\tint marks1, marks2,\
  \ marks3;\n\t/*声明了三个整数型变量，这些是数据类型 `struct marks` 的成员*/\n\tint third, marksfinal;\n\
  \t/*声明了两个整数型变量，这些是数据类型 `struct marks` 的成员*/\n};\n/*结构化数据类型的定义必须以分号结束；此处没有声明定义的数据类型\
  \ `struct marks` 的变量*/\nint minfn(int x, int y, int z){\n/*在此定义了用户自定义函数 `minfn()`；定义从函数头和函数体开始；`x`、`y`\
  \ 和 `z` 是虚拟参数，它们在函数调用期间由实际参数替换；此函数计算三个整数的最小值并返回该值*/\n\tint min1=x;\n\t/*声明整数 `min1`\
  \ 并初始化为 `x`；`min1` 是函数 `minfn()` 的局部变量，在函数外部不可见*/\n\tif (y<min1)\n\t/*如果条件 `y<min1`\
  \ 为真，则执行后续语句*/\n\tmin1=y;\n\t/*将 `y` 的值赋值给 `min1`*/\n\tif (z<min1)\n\t/*如果条件 `z<min1`\
  \ 为真，则执行后续语句*/\n\tmin1=z;\n\t/*将 `z` 的值赋值给 `min1`*/\n\treturn min1;\n\t/*将 `min1`\
  \ 的值返回到调用函数的地方*/\n}\n/*此闭合花括号指定 `minfn()` 函数定义的结束*/\nint main(){\n/*所有 C 程序都必须有一个返回类型为\
  \ `void` 或 `int` 的 `main()` 函数；此处 `main()` 函数没有参数且它返回一个整数；左花括号指定了 main() 函数的开始，编译器不执行该花括号之前的任何语句*/\n\
  \tstruct marks stud[100];\n\t/*声明了一个大小为 100 的 `struct marks` 类型数组；数组每个元素都有六个整数型成员，可以使用点运算符\
  \ (`.`) 访问*/\n\tint numstd, markstot, ind=0, i;\n\t/*声明了整数型变量 `numstd`、`markstot`\
  \ 和 `i`；声明了另一个整数型变量 `ind` 并初始化为 0*/\n\tint diff12, diff23, diff31, min;\n\t/*声明了四个整数型变量并为这些变量分配了内存空间以存储数据*/\n\
  \tprintf(“Enter number of students: ”);\n\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上*/\n\
  \tscanf(“%d”, &numstd);\n\t/*函数 `scanf()` 从输入终端读取一个整数并将其存储在为变量 `numstd` 分配的内存空间*/\n\
