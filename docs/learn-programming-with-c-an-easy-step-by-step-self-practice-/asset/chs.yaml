  \tscanf(“%d”, &num[i][j]);\n```\n\n二维数组 `num[3][4]` 的概念内存组织如下：\n\n![](img/fig0117.jpg)\n\
  \n## 3.3 多维数组\n\nC 语言中使用的多维数组的最简单版本是之前讨论的二维数组。与二维数组类似，三维数组的声明如下：\n\n```\n int multi[2][3][4];\n\
  ```\n\n其中 `multi` 是一个包含 24 个元素的三维数组。三维数组的初始化如下：\n\n```\n int multi[2][3][4] = {\n\
  \t{{1, 2, 3, 4}, {5, 7, 9, 11}, {−3, 13, 23, 31}},\n\t{{2, 4, 6, 8}, {6, 7, −8,\
  \ 9}, {4, 12, 23, −3}}};\n```\n\n可以通过标准标准终端按如下方式输入三维数组的 24 个元素：\n\n```\n int i,\
  \ j, k;\n\tfor (i=0; i<2; i++)\n\t\tfor (j=0; j<3; j++)\n\t\t\tfor (k=0; k<4; k++)\n\
  \t\t\t\tscanf(“%d”, &multi[i][j][k]);\n```\n\n三维数组的 24 个元素可以如下所示显示在屏幕上：\n\n```\n\
  \ int i, j, k;\n\tfor (i=0; i<2; i++)\n\t\tfor (j=0; j<3; j++)\n\t\t\tfor (k=0;\
  \ k<4; k++)\n\t\t\t\tprintf(“multi[%d][%d][%d]=%d\\n”, i, j, k, multi[i][j][k]);\n\
  ```\n\n## 3.4 字符串\n\n字符串是以空终止符 ‘\\0’ 结尾的字符序列。例如，字符串的声明如下：\n\n- `char exam[] = {‘A’,\
  \ ‘t’, ‘i’, ‘q’, ‘\\0’};`\n- 或者\n- `char exam[] = “Atiq”;`\n- // 在这种情况下，空字符 ‘\\\
  0’ 会自动放置在末尾\n\n## 3.5 字符串函数\n\n头文件 `string.h` 包含了各种预定义的字符串相关库函数的原型或声明。以下是一些较的预定义字符串函数：\n\
  \n- `gets()` – 用于从输入终端读取字符串；例如：`gets(name)` 读取任何单词作为字符串并将其存储在 `char` 类型变量 `name`\
  \ 中\n- `puts()` – 用于在输出控制台显示字符串；例如：`puts(name)` 显示存储在 `char` 类型变量 `name` 中的字符串字符\n\
  - `strlen()` – 返回字符串的长度；例如：`strlen(exam)` → 4\n- `strlwr()` – 将字符串的每个字符转换为小写；例如：`strlwr(exam)`\
  \ → atiq\n- `strupr()` – 将字符串的每个字符转换为大写；例如：`strupr(exam)` → ATIQ\n- `strcat()` –\
  \ 将一个字符串附加到另一个字符串的末尾；例如：`strcat(exam, “Ahad”)` → Atiq Ahad\n- `strncat()` – 将一个字符串的前\
  \ n 个字符附加到另一个中；例如：`strncat(exam, “Ahad Samad”, 5)` → Atiq Ahad\n- `strcpy()` – 将一个字符串复制到另一个；例如：`strcpy(exam,\
  \ “Ahad”)` → `exam = Ahad`\n- `strncpy()` – 将字符串的前 n 个字符复制到另一个；例如：`strncpy(exam,\
  \ “Atiq Ahad”, 4)` → `exam = Atiq`\n- `strcmp()` – 如果两个字符串相同则返回 0，否则返回正或负数；例如：`strcmp(exam,\
  \ “Atiq”)` 将返回 0\n- `strncmp()` – 比较两个字符串的前 n 个字符；例如：`strcmp(exam, “Atiqur”, 4)`\
  \ 将返回 0\n- `strcmpi()/stricmp()` – 在忽略字符大小写的情况下比较两个字符串；例如：`strcmp(exam, “atiQ”)`\
  \ 将返回 0\n- `strnicmp()` – 在忽略字符大小写的情况下比较两个字符串的前 n 个字符；例如：`strnicmp(exam, “atiQahaD\"\
  , 4)` 将返回 0\n- `strchr()` – 查找字符串中给定字符的首次出现位置；例如：`strchr(“atiqahad”, ‘a’` 将返回 atiqahad\n\
  - `strrchr()` – 查找字符串中给定字符的最后出现位置；例如：`strrchr(“atiqahad”, ‘a’` 将返回 ad\n- `strstr()`\
  \ – 在另一个字符串中查找子字符串的首次出现位置；例如：`strstr(“atiqahad”, “qah”)` 将返回 qahad\n- `strrev()`\
  \ – 用于反转字符串；例如：`strrev(exam)` 将返回 qitA\n\n## 3.6 指针\n\n在 C 语言中，当声明一个变量时，它会被立即分配一个内存地址。另一个被称为指针的变量持有该变量的地址。指针的数据类型必须与指针所持变量的数据类型匹配。例如，整型指针。\n\
  \n\n\n\n\n```c\n#include <stdio.h>\n/*头文件 stdio.h 包含库函数 `printf()` 和 `scanf()` 的原型；在程序调用函数之前，必须使用预处理器指令\
  \ #include 包含头文件*/\nint main(){\n/*所有 C 程序都必须有一个返回类型为 void 或 int 的 `main()` 函数；这里\
  \ `main()` 函数没有参数且它返回一个整数；左大括号指定 `main()` 函数的开始，编译器不会执行该大括号之前的任何语句*/\n\tint num[10],\
  \ i;\n\t/*声明了一个大小为 10 的整数类型数组 `num[]` 用于存储输入值，并声明了一个整数类型变量 `i` 用作访问数组每个元素的索引*/\n\
  \tprintf(“输入任意 5 个整数：”);\n\t/*这行代码会在屏幕上原样地显示双引号内的文本*/\n\tfor (i=0; i<5; i++)\n\t\
  /*这个 for 循环用于顺序输入所有数据；`i=0` 是初始化，`i<5` 是条件，`i++` → `i=i+1` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句；现在，在重新检查条件之前，计数器\
  \ `i` 的值加 1；这种迭代持续直到条件变为为假，此时程序退出循环*/\n\t\tscanf(“%d”, num+i);\n\t\t/*输入函数 `scanf()`\
  \ 的每次迭代读取一个整数并将其作为数组元素放入数组 `num[]` 中；这里 `num = &num[0]`，`num+1 = &num[1]`，`num+2\
  \ = &num[2]`，以此此类推*/\n\tprintf(“你输入的是：”);\n\t/*这行代码会在屏幕上原样地显示双引号内的文本*/\n\tfor (i=0;\
  \ i<5; i++)\n\t/*这个 for 循环用于逐个显示所有数据；`i=0` 是初始化，`i<5` 是条件，`i++` → `i=i+1` 是递增；在循环开始时检查一次条件，如果为真，则执行体语句；之后，在重新检查条件之前，计数器\
  \ `i` 的值加 1；这种迭代持续直到条件变为为假，此时程序退出循环*/\n\t\tprintf(“%d ”, *(num+i));\n\t\t/*函数 `printf()`\
  \ 的每次重复在屏幕上显示单个数组元素的值；可以使用指针访问数组元素 `num[0] = *num`，`num[1] = *(num+1)`，`num[2] =\
  \ *(num+2)`，以此此类推*/\n\treturn 0;\n\t/*返回 `0` 是因为程序成功执行的标准*/\n}\n/*右大括号指定 `main()`\
  \ 函数体的结束，以及程序的结束；在该大括号之后，不再执行任何语句*/\n```\n\n### **问题-02** 编写一个程序来找到数组中元素的数量。\n\n\
