  ```\n#include <stdio.h>\n/*头文件 stdio.h 包含了库函数 printf()`、`scanf()` 和 `gets()` 的原型；在程序中调用函数之前，必须使用预处理器指令\
  \ #include 包含头文件*/\nstruct student{\n/*struct 是用于创建结构体的关键字；student 是结构体的名称，大括号内部是三个成员*/\n\
  \tchar name[50];\n\t/*声明了一个大小为 50 的字符类型数组，它是 student 结构体的第一个成员*/\n\tint roll;\n\t\
