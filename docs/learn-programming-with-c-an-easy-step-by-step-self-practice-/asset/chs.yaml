  \ #include 包含该头文件*/\nfloat poly(float coef1[], int deg1, float x1);\n/*这是用户定义函数\
  \ `poly()` 的原型（或声明），它必须以分号结束；`poly()` 接受一个数组、一个整数和一个小数作为参数，执行某些预定义的操作，并返回一个小数*/\n\
  float deriv(float coef1[], int deg1, float x1);\n/*这是用户定义函数 `deriv()` 的原型，它必须以分号结束；`deriv()`\
  \ 接受一个数组、一个整数和一个小数作为参数，执行某些预定义的操作，并返回一个小数*/\nint main(){\n/*所有 C 程序都必须有一个返回类型为 `void`\
  \ 或 `int` 的 `main()` 函数；这里 `main()` 函数没有参数且它返回一个整数；左大括号指定 `main()` 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\
  \tfloat coef[10], x, y, dy;\n\t/*声明了一个大小为 10 的 float 类型数组 `coef[]` 以及三个 float 类型变量\
  \ `x`、`y` 和 `dy`；为数组和变量分配了必要的内存空间*/\n\tint deg, i;\n\t/*声明了两个整数类型变量；为变量分配了必要的内存空间*/\n\
  \tprintf(“Enter the degree of polynomial equation: ”);\n\t/*输出函数 `printf()` 将引号中的文本原文显示在屏幕上*/\n\
  \tscanf(“%d”, &deg);\n\t/*函数 `scanf()` 从输入终端读取一个整数并将其存储在为 `deg` 分配的内存空间中*/\n\tfor\
  \ (i=0; i<=deg; i++){\n\t/*`i=0` 是初始化，`i<=deg` 是条件，`i++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句，并在重新检查条件之前将\
  \ `i` 的值加 1；这些步骤一直持续，直到条件变为假，此时程序流退出*/\n\t\tprintf(“Enter coefficient of x to the\
  \ power %d: ”, i);\n\t\t/*输出函数 `printf()` 将引号中的文本按原样显示在屏幕上，但用 `i` 的值替换格式占位符 `%d`*/\n\
  \t\tscanf(“%f”, &coef[i]);\n\t\t/*函数 `scanf()` 从输入终端读取一个小数，并将值存储在数组 `coef[]` 中，用于函数\
  \ 2x3+3−1：\n\t\t在第 1 次迭代中，它读取 −1 并保存到 `coef[0]`\n\t\t在第 2 次迭代中，它读取 0 并保存到 `coef[1]`\n\
  \t\t在第 3 次迭代中，它读取 3 并保存到 `coef[2]`\n\t\t在第 4 次迭代中，它读取 2 并保存到 `coef[3]`*/\n\t}printf(“Enter\
  \ value of x for which the equation is to” “solved: ”);\n\t/*输出函数 `printf()` 将引号中的文本按原样显示在屏幕上*/\n\
  \tscanf(“%f”, &x);\n\t/*函数 `scanf()` 从输入终端读取一个小数并将其存储在为 `x` 分配的内存中*/\n\ty = poly(coef,\
  \ deg, x);\n\t/*调用用户定义函数 `poly()` 并传入三个实数参数 `coef`、`deg` 和 `x`；程序控制流转移到函数定义；`poly()`\
  \ 对参数执行某些预定义操作并返回一个小数赋值给 `y`*/\n\tdy = deriv(coef, deg, x);\n\t/*调用用户定义函数 `deriv()`\
  \ 并传入三个实数参数 `coef`、`deg` 和 `x`；程序控制流转移到函数定义；`deriv()` 对参数执行某些预定义操作并返回一个小数赋值给 `dy`*/\n\
  \tprintf(“Solution of polynomial equation at x=%.2f is: %.2f”, x, y);\n\t/*函数 `printf()`\
  \ 将引号中的文本显示在屏幕上，但 `x` 的值替换了第一个格式占位符 `%.2f`（保留小数点精度），`y` 的值替换了第二个 `%.2f`*/\n\tprintf(“\\\
  nSolution of derivative of the polynomial equation” “at x=%.2f is: %.2f”, x, dy);\n\
  \t/*函数 `printf()` 将引号中的文本显示在屏幕上，但 `x` 的值替换了第一个格式占位符 `%.2f`（保留小数点精度），`dy` 的值替换了第二个\
  \ `f`；这里长字符串使用双引号被分成了多行*/\n\treturn 0;\n\t/*返回 0 作为程序成功执行的标准*/\n}\n/*右大括号指定了 `main()`\
  \ 函数体的结束，以及程序的终点；在该大括号之后，不再有语句被执行*/\nfloat poly(float coef1[], int deg1, float x1){\n\
  /*这是用户定义函数 `poly()` 的头部，它必须与函数原型完全一致，除了没有使用分号；函数在大括号内定义*/\n\tfloat res;\n\t/*声明了\
  \ float 类型变量 `res`；为变量分配了必要的内存空间*/\n\tint j;\n\t/*声明了整数类型变量 `j`；为变量分配了必要的内存空间*/\n\
  \tres = coef1[deg1];\n\t/*`res` 赋值为最高次方 `coef1[deg1]`*/\n\tfor (j=deg1; j>=1; j--)\n\
  \t/*`j=deg1` 是初始化，`j>=1` 是条件，`j--` 是递减；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句，并在重新检查条件之前将\
  \ `j` 的值减 1；这些步骤一直持续，直到条件变为假，此时程序流退出*/\n\t\tres = (coef1[j]*x1);/*对于 2x3+3−1：\n\t\
  \t在第 1 次迭代中，`res=coef1[2]*x1`\n\t\t在第 2 次迭代中，`res=coef1[1]*x1`\n\t\t在第 3 次迭代中，`res=coef1[0]*x1`*/\n\
  \treturn res;\n\t/*返回 `res` 到调用该函数的地方*/\n}\nfloat deriv(float coef1[], int deg1,\
  \ float x1){\n/*这是用户定义函数 `deriv()` 的头部，它必须与函数原型完全一致，除了没有使用分号；函数在大括号内定义*/\n\tfloat\
  \ dp, sum=0;\n\t/*声明了 float 类型变量 `dp` 和 `sum`，并将 `sum` 初始化为 0*/\n\tint k;\n\t/*声明了整数类型变量\
  \ `k`；为变量分配了必要的内存空间*/\n\tfor (k=0; k<deg1; k++){\n\t/*`k=0` 是初始化，`k<deg1` 是条件，`k++`\
  \ 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句，并在重新检查条件之前将 `k` 的值加 1；这些步骤一直持续，直到条件变为假，此时程序流退出*/\n\
  \t\tps = pow(x1, deg1-(k+1));/*库函数 `pow()` 返回 `x1`deg1-(k+1)` 次方；对于 2x3+3−1：\n\t\
  \t在第 1 次迭代中，`ps=x13-(0+1)=x12`\n\t\t在第 2 次迭代中，`ps=x13-(1+1)=x11`\n\t\t在第 3 次迭代中，`ps=x13-(2+1)=x10`*/\n\
  \t\tdp = (deg1-k)*coef1[deg1-k]*ps;/*对于 2x3+3−1：\n\t\t在第 1 次迭代中，`dp=(3-0)×coef1[3-0]×ps=3×2×x12=6x12`\n\
  \t\t在第 2 次迭代中，`dp=(3-1)×coef1[3-1]×ps=2×0×x1=0`\n\t\t在第 3 次迭代中，`dp=(3-2)×coef1[3-2]×ps=1×3×x10=3`*/\n\
  \t\tsum = sum+dp;/*对于 2x3+3−1：\n\t\t在第 1 次迭代中，`sum=0+6x12=6x12`\n\t\t在第 2 次迭代中，`sum=6x12+0=6x12`\n\
  \t\t在第 3 次迭代中，`sum=6x12+3` 即 2x3+3−1 在 `x1` 处的导数*/\n\t}return sum;\n\t/*返回 `sum`\
  \ 到调用该函数的地方*/\n}\n```\n\n\n\n\n\n## 练习题\n\n### 单选题（带答案）\n\n1. 下行的含义是：\n```c\nvoid\
