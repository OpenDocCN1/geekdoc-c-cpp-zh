  \nDOI: [10.1201/9781003302629-8](https://doi.org/10.1201/9781003302629-8)\n\nC 语言是跨平台的，因为它可以在多种类型的平台或操作系统环境中运行。我们并不直接在机器上运行\
  \ C 代码；首先，源代码被编译为特定平台的汇编代码。因此，我们可以使用相同的 C 源代码通过不同的编译器来生成所需的特定汇编代码。本章介绍了如何在不同的平台和操作系统上编译和运行\
  \ C 源代码。\n\n## 8.1 创建自己的库\n\nC 语言中内置了一些函数，被称为标准库函数。函数的原型和数据定义在相应的头文件中可用。在使用这些标准函数之前，我们需要在\
  \ C 程序中包含这些头文件。同样，我们可以定义自己的函数并创建自己的库，以便重用已定义的代码或函数。C 语言中的库有两种类型：静态库 `*.a` 和动态库 `*.dll`。\n\
  \n### 8.1.1 创建静态库\n\n静态库是包含 C 函数定义的对象文件 `*.o` 的集合。创建静态库无非是生成一个或多个对象文件的归文件 `*.a`。静态库的对象文件在编译的链接阶段被链接到主程序模块。成功链接后，编译器会生成一个单一的可执行文件\
  \ `.exe`，该文件包含了主程序模块和库。以下流程图说明了如何从三个不同的 C 源文件生成 C 静态库。\n\n![](img/fig0328.jpg)\n\
  \n创建用户自定义 C 静态库 `libSimpleLib.a` 的步骤如下。\n\n步骤 1：打开 CodeBlocks C 编译器。现在，点击 File→New→Project\
  \ …，选择“Static library”，并点击 Go。\n\n![](img/fig0329.jpg)\n\n现在点击 Next> 并在“Project\
  \ title”上输入 `SimpleLib`，并选择一个创建项目的文件夹（例如 `C:\\Users\\SazzadImran\\Desktop\\`）。\n\
  \n![](img/fig0330.jpg)\n\n现在点击 Next>，选择你的编译器（在这种情况下为 `GNU GCC Compiler`），然后点击 Finish。将创建一个名为\
  \ `SimpleLib.cbp` 的静态库项目。\n\n步骤 2：点击 File→New→File …，选择“C/C++ source”，点击 Go 然后点击\
  \ Next>。现在选择 C 然后再点击 Next>。在“Filename with full path:”上进入 `C:\\Users\\SazzadImran\\\
  Desktop\\SimpleLib` 并在“File name”上输入 `SimpleLib1`（C 源文件的用户自定义名称）。现在点击 Save，然后在点击\
  \ Finish 之前勾选 In build target(s): 下的 Debug 和 Release。\n\n![](img/fig0331.jpg)\n\n\
  步骤 3：在 `SimpleLib1.c` 中定义任意函数。我们定义一个名为 `add()` 的函数作为示例，它接受两个整数作为参数并返回值的之和。在函数定义中使用双引号包含用户自定义的头文件，该函数的原型将在该文件中可用。\n\
