  \ 函数体的结束，以及程序的结束；在该括号之后，不再有语句被执行*/\n```\n\n### 问题-15: 编写一个程序使用牛顿-拉夫逊法寻找非线性方程的根。\n\
  \n#### 解决方案流程图：\n\n图 2.10 显示了解决此问题遵循的流程图。\n\n![](img/fig2_10.jpg)\n\n图 2.10 解决该问题的流程图。\n\
  \n#### 解决方案算法：\n\n* 步骤-1：开始。\n* 步骤-2：定义 `f(x)←5x+2sin(x)−cos(x)`\n* 步骤-3：定义 `g(x)←5+2cos(x)+sin(x)`\n\
  * 步骤-4：初始化 `step←1`\n* 步骤-5：读取 `x0`、`err` 和 `iter` 的值\n* 步骤-6：`g0←g(x0)`\n* 步骤-7：`f0←f(x0)`\n\
  * 步骤-8：如果 `(g0=0.0)`\n    * 8.1：显示“error”\n    * 8.2：跳转到步骤-17\n* 步骤-9：`x1←x0-f0/g0`\n\
  * 步骤-10：显示 `step`、`x0`、`f0`、`x1` 和 `f1` 的值\n* 步骤-11：`x0←x1`\n* 步骤-12：`step←step+1`\n\
  * 步骤-13：如果 `(step>iter)`\n    * 13.1：显示“not convergent”（不收敛）\n    * 13.2：跳转到步骤-17\n\
  * 步骤-14：`f1←f(x1)`\n* 步骤-15：如果 `(fabs(f1)>err)`\n    * 15.1：跳转到步骤-6\n* 步骤-16：显示\
  \ `x1` 的值\n* 步骤-17：停止。\n\n\n\n\n\n```c\n#include <stdio.h>\n/*头文件 stdio.h 包含库函数\
  \ `printf()` 和 `scanf()` 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含头文件*/\n#include <math.h>\n\
  /*头文件 math.h 包含库函数 `fabs()`、`sin()` 和 `cos()` 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include\
  \ 包含头文件*/\n#include<stdlib.h>\n/*头文件 stdlib.h 包含库函数 `exit()` 的原型；在程序调用该函数之前，必须使用预处理器指令\
  \ #include 包含头文件*/\n#define f(x) 5*x+2*sin(x)−cos(x)\n/*#define 是一个定义常量变量的预处理器指令；在这种情况下，`f(x)`\
  \ 是一个常量变量，它存储了当 `x=x1` 时表达式 `5x+2sinx−cosx` 的值*/\n#define g(x) 5+2*cos(x)+sin(x)\n\
  /*#define 预处理器指令用于定义另一个常量变量 `g(x)`，它取值为当 `x=x1` 时表达式 `f/(x)=5+2cosx+sinx` 的值*/\n\
  int main(){\n/*这里 `main()` 函数返回一个整数，且 `main()` 函数的参数/参数也为 void（空）；程序的执行从 `main()`\
  \ 函数开始；编译器不会执行 `main()` 函数大括号之前的任何语句*/\n\tfloat x0, x1, f0, f1, g0, err;\n\t/*声明了六个\
  \ float 类型变量；为每个变量分配了所需的内存空间*/\n\tint step=1, iter;\n\t/*声明了整数类型变量 `step` 和 `iter`；为每个变量分配了所需的内存空间；变量\
  \ `step` 初始化为 1*/\n\tprintf(“Enter initial guess: ”);\n\t/*输出函数 `printf()` 将双引号内的文本显示在屏幕上*/\n\
  \tscanf(“%f”, &x0);\n\t/*输入函数 `scanf()` 从键盘读取一个小数并将其存储在分配给 `x0` 的内存空间中*/\n\tprintf(“Enter\
  \ tolerable error: ”);\n\t/*输出函数 `printf()` 将双引号内的文本显示在屏幕上*/\n\tscanf(“%f”, &err);\n\
  \t/*函数 `scanf()` 从键盘读取一个小数并将其赋值给 `err`*/\n\tprintf(“Enter maximum iteration: ”);\n\
  \t/*函数 `printf()` 将双引号内的文本显示在屏幕上*/\n\tscanf(“%d”, &iter);\n\t/*输入函数 `scanf()` 从键盘读取一个整数并将值存储在分配给\
  \ `iter` 的内存空间中*/\n\tprintf(“\\nStep\\tx0\\t\\tf(x0)\\t\\tx1\\t\\tf(x1)\\n”);\n\t\
  /*`printf()` 函数将双引号内的文本显示在屏幕上，其中 `\\n` 替换为换行，`\\t` 替换为制表符*/\n\tdo{\n\t/*大括号内的后续语句只要后面的\
  \ while 条件为真，就会重复执行*/\n\t\tg0 = g(x0);\n\t\t/*计算方程在 `x=x0` 处的导数值并赋值给 `g0`*/\n\t\t\
  f0 = f(x0);\n\t\t/*计算方程在 `x=x0` 处的值并赋值给 `f0`*/\n\t\tif (g0==0.0){\n\t\t/*如果函数在 `x=x0`\
