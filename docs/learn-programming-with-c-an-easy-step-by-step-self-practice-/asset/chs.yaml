  /*库函数 rand() 返回一个 0 到 RAND_MAX 之间的随机整数；通过类型转换将值转换为 double 类型，以便除法操作 rand()/RAND_MAX\
  \ 返回一个 0 到 1 之间的小数随机数；将该值赋给变量 x；这里我们生成随机数的 x 坐标*/\n\t\ty = (double)rand()/RAND_MAX;\n\
