  \n## 解决方案的算法：\n\n- 步骤 1: 开始\n- 步骤 2: 定义结构 `struct list node`，成员为 `num` 和 `next`\n\
  - 步骤 3: 调用函数 `create(head)`\n- 步骤 4: 调用函数 `print(head)`\n- 步骤 5: 如果 `head->num≠−99`\n\
  \    - 5.1: `head←insert(head)` [调用函数 `insert()`]\n    - 5.2: 调用函数 `print(head)`\n\
  - 步骤 6: 显示输入\n- 步骤 7: 停止\n\n## 函数 create(pt) 的算法：\n\n- 步骤 1: 初始化 `count←0`\n- 步骤\
  \ 2: 读取 `key` 的值\n- 步骤 3: 如果 `key=−99`\n    - 3.1: 如果 `count=0`\n        - 3.1.1:\
  \ `pt->num←−99`\n        - 3.1.2: `pt->next←0`\n        - 3.1.3: 跳到步骤 8\n    - 3.2:\
  \ `head1->next←0`\n    - 3.3: `free(pt)`\n    - 3.4: 跳到步骤 8\n- 步骤 4: `count←count+1`\n\
  - 步骤 5: `head1←pt`\n- 步骤 6: `pt->num←key`\n- 步骤 7: 调用函数 `create(pt->next)`\n- 步骤\
  \ 8: 返回。\n\n## 函数 print(pt) 的算法：\n\n- 步骤 1: 如果 `pt->num=−99`\n    - 1.1: 显示“空列表”\n\
  \    - 1.2: 跳到步骤 4\n- 步骤 2: 如果 `pt->next=0`\n    - 2.1: 显示 `pt->num` 的值\n    - 2.2:\
  \ 跳到步骤 4\n- 步骤 3: 显示 `pt->num` 的值\n- 步骤 4: 返回。\n\n## 函数 find(pt, key) 的算法：\n\n-\
  \ 步骤 1: 如果 `pt->next=0`\n    - 1.1: 如果 `pt->num≠key`\n        - 1.1.1: 跳到步骤 3.1\n\
  - 步骤 2: 如果 `pt->next->num=key`\n    - 2.1: 返回 `pt` 的值\n- 步骤 3: 如果 `pt->next->next=0`\n\
  \    - 3.1: 返回 0\n- 步骤 4: 调用函数 `find(pt->next, key)`\n\n- 函数 insert(pt) 的算法：\n\n\
  - 步骤 1: 读取 `nmb` 和 `key` 的值\n- 步骤 2: 如果 `pt->num=key`\n    - 2.1: `temp->num←nmb`\n\
  \    - 2.2: `temp->next←pt`\n    - 2.3: `pt←temp`\n    - 2.4: 跳到步骤 8\n- 步骤 3: `ptr←find(pt,\
  \ key)` [调用函数 `find()`]\n- 步骤 4: 如果 `ptr=0`\n    - 4.1: 显示“未找到 key”\n    - 4.1:\
  \ 跳到步骤 8\n- 步骤 5: `temp->num←nmb`\n- 步骤 6: `temp->next←ptr->next`\n- 步骤 7: `ptr->next←temp`\n\
  - 步骤 8: 返回 `pt` 的值\n\n## 解决方案的代码：\n\n![](img/fig0269.jpg)![](img/fig0270.jpg)![](img/fig0271.jpg)![](img/fig0272.jpg)![](img/fig0273.jpg)![](img/fig0274.jpg)\n\
