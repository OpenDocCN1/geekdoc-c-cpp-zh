  /*此 for 循环用于将字符串 `str1[]` 的每个字符顺序复制到 `str2[]`。i=0 是初始化；`str1[i]!=‘\\0’` 是条件 `i++`\
  \ 是递增；i=0 在循环开始时初始化一次；然后检查字符串 `str[]` 的字符是否为 NULL，如果不是字符串的末尾，则执行循环体中的语句；之后 `i` 的值加\
