  \    - 4.5: `i←i+1`\n    - 4.6：跳转到步骤-5\n- 步骤-5：初始化 `j←0`\n- 步骤-6：如果 `j<8`\n    -\
  \ 6.1：显示 `a[j]`、`b[j]`、`c[j]`、`res[j]` 的值\n    - 6.2：`j←j+1`\n    - 6.3：跳转到步骤-6\n\
