  \n图形是一个强大的功能，使计算机应用程序更有吸引力。本章介绍了 C 图形编程的基础知识，适用于没有任何图形编程基础的人。\n\n## 7.1 引言\n\nC\
  \ 程序通常运行在被称为 CUI（字符用户界面）的控制窗口中。C 包含头文件 `graphics.h`，其中包含许多用于在 C 应用中实现 GUI（图形用户界面）的定义函数。为了实现\
  \ GUI 编程，我们需要将输出屏幕从 CUI（字符模式）转换为 GUI（像素模式）。\n\n## 7.2 函数\n\n实现图形编程所需的所有相关函数都在头文件\
  \ `graphics.h` 中。打开 `graphics.h` 头文件可以查看头文件中可用的所有函数。一些常用的函数如下：\n\n\n\n\n\n## 图形函数\n\
  \n| `initgraph()` | 用于将 CUI 模式转换为 GUI 模式（初始化图形模式）。它接受三个参数：图形驱动程序、图形模式和文件路径。 |\n\
  | `closegraph()` | 用于释放图形系统分配的所有内存并关闭图形系统。 |\n| `outtextxy()` | 在 (x, y) 坐标处显示消息。它接受三个参数：x\
  \ 和 y 参数，以及作为字符串类型或字符指针类型的消息。 |\n| `getmaxx()` | 返回当前图形模式和驱动程序下的最大 x 坐标。 |\n| `getmaxy()`\
  \ | 返回当前图形模式和驱动程序下的最大 y 坐标。 |\n| `setcolor()` | 设置绘制颜色。它接受一个整数参数，其值（0 到 15）决定特定颜色。也可以作为字符串参数传递颜色名称（BLACK,\
  \ CYAN, RED, WHITE 等）。 |\n| `setbkcolor()` | 设置背景颜色。它接受一个整数参数，其值（0 到 15）决定特定颜色。也可以作为字符串参数传递颜色名称（BLACK,\
  \ CYAN, RED, WHITE 等）。 |\n| `settextstyle()` | 设置当前文本字符（字体、方向和大小）。它接受三个参数：第一个参数根据整数常量（0,\
  \ 1, 2, 3 或 4）设置字体；第二个参数设置字体方向（HORIZ_DIR=0 为从左到右的水平，VERT_DIR=1 为从下到上的垂直）；第三个参数设置字体大小。\
  \ |\n| `kbhit()` | 检查是否有按键输入。 |\n| `setfill()` | 设置填充模式和颜色。返回整数，用于在 (x, y) 坐标处填充区域。\
  \ |\n| `floodfill()` | 填充区域。第一个参数是填充模式，第二个参数是填充颜色，第三个参数是用于填充的区域的整数值。EMPTY_FILL=0,\
  \ SOLID_FILL=1, ..., USER_FILL=12 _FILL=15。 |\n| `delay()` | 暂停执行若干毫秒。`delay()`\
  \ 函数在 CUI 模式下清除屏幕。 |\n| `cleardscr()` | 利用 `clr()` 函数自动清除屏幕。 |\n| `DETECT` | 自动检测驱动程序。\
  \ |\n\n## 7.3 颜色表\n\n图形中，每个颜色被分配一个整数。下表显示了支持的颜色及其整数值：\n\n| 颜色 | 整数值 |\n| :--- |\
  \ :--- |\n| BLACK | 0 |\n| BLUE | 1 |\n| GREEN | 2 |\n| CYAN | 3 |\n| RED | 4 |\n\
  | MAGENTA | 5 |\n| BROWN | 6 |\n| LIGHTGRAY | 7 |\n| DARKGRAY | 8 |\n| LIGHTBLUE\
  \ | 9 |\n| LIGHTGREEN | 10 |\n| LIGHTCYAN | 11 |\n| LIGHTRED | 12 |\n| LIGHTMAGENTA\
  \ | 13 |\n| YELLOW | 14 |\n| WHITE | 15 |\n\n不同的字体被分配了不同的数字。下表显示了字体及其整数值：\n\n| 字体\
  \ | 整数值 |\n| :--- | :--- |\n| DEFAULT_FONT | 0 |\n| TRIPLEX_FONT | 1 |\n| SMALL_FONT\
  \ | 2 |\n| SANS_SERIF_FONT | 3 |\n| GOTHIC_FONT | 4 |\n| SCRIPT_FONT | 5 |\n| SIMPLEX_FONT\
  \ | 6 |\n| TRIPLEX_SCR_FONT | 7 |\n| COMPLEX_FONT | 8 |\n| EUROPEAN_FONT | 9 |\n\
  | BOLD_FONT | 10 |\n\n## 7.5 填充模式\n\n不同的整数值代表用于填充区域的模式。下表显示了填充模式及其整数值：\n\n| 模式 |\
  \ 整数值 |\n| :--- | :--- |\n| EMPTY_FILL | 0 |\n| SOLID_FILL | 1 |\n| LINE_FILL |\
  \ 2 |\n| LTSASH_FILL | 3 |\n| SLASH_FILL | 4 |\n| BKSLASH_FILL | 5 |\n| LTBSLASH_FILL\
  \ | 6 |\n| HATCH_FILL | 7 |\n| XHATCH_FILL | 8 |\n| INTERLEAVE_FILL | 9 |\n| WIDE_DOT_FILL\
  \ | 10 |\n| CLOSE_DOT_FILL | 11 |\n| USER_FILL | 12 |\n\n## 7.6 在 CODEBLOCKS 中包含\
  \ GRAPHICS.H\n\n按照以下步骤在 CodeBlocks 中成功编译和执行图形代码。这里假设你安装了 32 位的 CodeBlocks 以及 mingw\
  \ 包。\n\n- 步骤 1：从 `http://winbgim.codecutter.org/` 下载 WinBGIm 并解压下载的文件。会有三个文件：`graphics.h`、`winbgim.h`\
  \ 和 `libbgi.a`。\n- 步骤 2：使用 Notepad++ 打开 `graphics.h`。跳转到第 302 行，将其替换为 `int left=0,\
  \ int top=0, int right=INT_MAX, int bottom=INT_MAX` 并保存文件。\n- 步骤 3：将 `graphics.h`\
  \ 和 `winbgim.h` 文件复制并粘贴到编译器目录 `[此电脑 > C 盘 > 程序文件 (x86) > CodeBlocks > MinGW > include]`。\n\
  - 步骤 4：将 `libbgi.a` 复制并粘贴到编译器目录 `[此电脑 > C 盘 > 程序文件 (x86) > CodeBlocks > MinGW >\
  \ lib]`。\n- 步骤 5：打开 CodeBlocks。进入 `Settings→Compiler`。\n- 步骤 6：以 `.cpp` 扩展保存源码，然后构建并运行。\n\
  \n## 7.7 示例\n\n### 题目-01\n编写一个程序绘制一个大小为 100×300 的矩形和一个半径为 50 的圆。\n\n#### 解决方案的代码：\n\
  (Images/fig001.jpg)\n\n#### 代码解释：\n\n```cpp\n#include <graphics.h>\n#include <conio.h>\n\
  int main(){\n\tint gd=DETECT, gm;\n\tinitgraph(&gd, &gm, (char*)\");\n\tbar(100,\
  \ 100, 200, 400);\n\tcircle(400, 250, 50);\n\tgetch();\n\tclosegraph();\n\treturn\
  \ 0;\n}\n```\n\n#### 执行的程序的输入和输出：\n(Images/fig002.jpg)\n\n\n\n\n在 Turbo C 中运行上述程序，我们需要按照如下方式在程序中定义\
  \ `initgraph()` 函数\n\n> `initgraph(&gd, &gm, “C:\\TC\\BGI”);`\n\n也就是说，在第三个参数中不需要写空字符串，而是需要写入\
  \ TC 中 BGI 文件夹的完整路径地址，并使用双反斜杠。所有其他图形程序要在 Turbo C 中运行，都需要进行此修改。\n\n#### 问题-02：编写一个以不同颜色打印消息的程序。\n\
  \n#### 解决方案的编程代码：\n\n![](img/fig0303.jpg)\n\n#### 执行程序的输入和输出：\n\n![](img/fig0304.jpg)\n\
  \n#### 编程代码说明：\n\n```c\n#include <graphics.h>\n/*头文件 graphics.h 包含了库函数 initgraph(),\
  \ setcolor(), outtextxy() 和 closegraph() 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含该头文件*/\n\
  #include <conio.h>\n/*头文件 conio.h 包含了库函数 getch() 的原型，因此在程序中使用该函数之前需要包含它*/\nint main(){\n\
  /*所有 C 程序都必须有一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数并返回一个整数；左大括号指定了 main()\
  \ 函数的开始，在该大括号之前的任何语句都不会被编译器执行*/\n\tint gd=DETECT, gm;\n\t/*声明了两个整型变量 gd 和 gm。变量\
  \ gd 初始化为 DETECT，这是一个自动检测适用于硬件的图形驱动程序的器的定义*/\n\tint i, x=100, y=50;\n\t/*声明了三个整型变量\
  \ i, x 和 y；编译器为这三个变量分配了所需的内存；x 初始化为 100，y 初始化为 50，将用于选择屏幕上的坐标*/\n\tinitgraph(&gd,\
  \ &gm, (char *)“”);\n\t/*在此调用库函数 initgraph() 来初始化图形模式。图形模式 gm 代表屏幕分辨率，并将根据图形驱动 gd\
  \ 进行隐式选择；由于第三个参数中提到的路径不是强制性的，我们将其写为空字符串*/\n\tfor (i=1; i<16; i=i+2){\n\t/*i=1 是初始化，i<16\
  \ 是条件，i=i+2 是增量；初始化在循环开始时执行一次；接着检查条件，如果为真，则执行体内的语句；在重新检查条件之前，i 的值加 2；这个过程一直持续到条件变为假，此时程序流跳出循环*/\n\
  \t\tsetcolor(i);\n\t\t/*此函数设置绘图颜色；由于整数 0 代表黑色且在黑色背景上不可见，我们从代表蓝色的 1 开始；之后随着 i 在每次迭代中发生变化，它将设置不同的绘图颜色*/\n\
  \t\touttextxy(x, y, “欢迎来到 C 语言编程之旅…”);\n\t\t/*此函数在 (x, y) 坐标处显示双引号包含的消息*/\n\t\t\
  y = y+30;\n\t\t/*在每次迭代中保持 y 的值不变并增加 30，以便在不同的位置显示消息*/\n\t/*该大括号指定了循环的结束*/\n\tgetch();\n\
  \t/*在此调用 getch() 以保持控制台状态，直到输入任何字符*/\n\tclosegraph();\n\t/*在此调用 closegraph() 以释放所有内存并关闭图形系统*/\n\
  \treturn 0;\n\t/*返回 0 是程序成功执行的标准*/\n}\n/*该大括号指定了 main 函数的结束*/\n```\n\n### 问题-03：编写一个以不同颜色显示消息的程序。\n\
