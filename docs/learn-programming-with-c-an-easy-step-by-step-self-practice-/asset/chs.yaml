  \t/*函数 `scanf()` 从输入终端读取一个整数，并将值存储为变量 `numstd` 分配的内存空间中*/\n\tprintf(“Enter total\
  \ number of classes taken: ”);\n\t/*输出函数 `printf()` 将引号内的文本原样显示在屏幕上*/\n\tscanf(“%d”,\
  \ &classtot);\n\t/*函数 `scanf()` 从输入终端读取一个整数，并将其存储为变量 `classtot` 分配的内存空间中*/\n\tfor\
  \ (i=0; i<numstd; i++){\n\t/*这里 i=0 是初始化，i<numstd 是条件，i++ 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行大括号括起来的语句，并在重新检查条件之前将\
