  \    if (head->num != -99) {\n        /*使用指针运算符访问结构化数据类型变量的成员；指针 `head` 指向链表的第一个节点；如果第一个节点\
  \ `head` 的成员 `num` 的值为除 −99 外任意整数，则链表为空，执行大括号内的后续语句*/\n        head = insert(head);\n\
  \        /*带实际参数 `head` 调用用户定义函数 `insert()`，它指向链表的第一个节点；程序控制流转移到函数的定义，该函数执行某些预定义的操作并返回一个节点类型指针赋值给\
  \ `head*/\n        printf(\"List of items after deletion:\\n\");\n        /*`printf()`\
  \ 函数将双引号中的文本原样显示在屏幕上，换行符替换*/\n        print(head);\n        /*带实际参数 `head` 调用用户定义函数\
  \ `print()`，它指向链表的第一个节点；程序控制流转移到函数的定义*/\n    }\n    /*此右大括号指定 ‘if’ 的结束*/\n    printf(\"\
  \\n\");\n    /*此 `printf()` 在屏幕上显示一个换行符*/\n    return 0;\n    /*返回 0，因为它是程序成功执行的标准*/\n\
  }\n/*此右大括号指定了 `main()` 函数体的结束，以及程序的结束；在该大括号之后，没有语句被执行*/\n\nvoid create(node *pt)\
  \ {\n    /*`create()` 函数定义在此开始，包含函数头和体；函数头与没有分号的函数原型相同；函数体在大括号内；函数调用期间传递的实际参数替换虚拟参数\
