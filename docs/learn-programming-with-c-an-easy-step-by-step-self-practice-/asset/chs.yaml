  \tscanf：“%f”, &silver);\n\t/*scanf() 函数从输入终端读取一个小数，并将其存储在分配给 silver 的内存空间中*/\n\t\
  printf(“你今天的银行余额（单位：taka）是多少？ ”);\n\t/*输出函数 printf() 将双引号内的文本原样显示在屏幕上*/\n\tscanf：“%f”,\
