  \ is no third examination and the above result is final.\\n”);\n\t/*输出函数 `printf()`\
  \ 将引号中的文本原样显示在屏幕上，换行符替换了 `\\n`；此处长字符串使用双引号分成多行*/\n\telse\n\t/*如果上述 `if` 条件为假，意味着至少有一个学生需要三次考试，则执行后续\
  \ for 循环*/\n\tfor (i=0; i<numstd; i++){\n\t/*此处 `i=0` 是初始化，`i<numstd` 是条件，`i++`\
  \ 是递增；初始化在循环开始执行一次；然后检查条件，如果为真则执行体内的语句，并在重新检查条件之前将 `i` 的值加 1；这些步骤一直持续直到条件变为假，此时程序流退出循环*/\n\
  \t\tif (stud[i].third==1){\n\t\t/*如果条件为真，执行花括号内的语句*/\n\t\t\tprintf(“\\nEnter 3rd\
  \ examiner marks of roll %d: ”, stud[i].roll);\n\t\t\t/*输出函数 `printf()` 将引号中的文本原样显示在屏幕上，但\
  \ `stud[i].roll` 的值替换了第一个格式说明符 `%d`，换行符替换了 `\\n`*/\n\t\t\tscanf(“%d”, &stud[i].marks3);\n\
  \t\t\t/*函数 `scanf()` 从输入终端读取一个整数并存储在 `struct` 类型数组元素 `stud[]` 的成员 `marks3` 中*/\n\
  \t\t\tdiff12=abs(stud[i].marks1−stud[i].marks2);\n\t\t\t/*此算术操作计算第一次和第二次考试成绩差的绝对值*/\n\
  \t\t\tdiff23=abs(stud[i].marks2−stud[i].marks3);\n\t\t\t/*此算术操作计算第二次和第三次考试成绩差的绝对值*/\n\
  \t\t\tdiff31=abs(stud[i].marks1−stud[i].marks3);\n\t\t\t/*此算术操作计算第一次和第三次考试成绩差的绝对值*/\n\
  \t\t\tif (diff23==diff31)\n\t\t\t/*如果此条件为真，意味着三次考试成绩处于第一次和第二次考试成绩的中间，执行后续语句*/\n\t\
