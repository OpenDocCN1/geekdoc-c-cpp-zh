  \    printf(\"What is the item before which item inserted? \");\n    /*`printf()`\
  \ 函数将引号中的文本原样显示在屏幕上*/\n    scanf(\"%d\", &key);\n    /*`scanf()` 从终端读取一个整数存储在为 `key`\
  \ 分配的内存空间*/\n    if (pt->num == key) {\n        /*如果在第一个节点 `pt` 中找到了 `key`，则 `if`\
  \ 条件为真并执行大括号内的语句，在 `pt` 之前插入一个新节点使其成为第一个节点*/\n        temp = (node *)malloc(sizeof(node));\n\
  \        /*创建一个新节点 `temp`；`sizeof()` 函数计算 `node` 类型数据的大小，用于存储一个整数和另一个节点的地址；所需的内存空间通过\
  \ `malloc()` 动态分配；内存空间的地址赋值给节点指针 `temp*/\n        temp->num = nmb;\n        /*`nmb`\
  \ 的值赋值给节点 `temp` 的 `num*/\n        temp->next = pt;\n        /*新创建的节点 `temp` 与第一个节点\
  \ `pt` 链接；节点 `temp` 的成员 `next` 现在指向链表的第一个节点 `pt`*/\n        pt = temp;\n       \
  \ /*新创建的节点 `temp` 现在赋值给 `pt`，使 `pt` 成为链表的第一个节点*/\n    } else {\n        /*如果在第一个节点中没有找到\
  \ `key`，执行 `else` 体内的语句*/\n        ptr = find(pt, key);\n        /*带参数 `pt` 和 `key`\
  \ 调用用户定义函数 `find()`；程序控制流转移到函数的定义；`find()` 在链表中搜索 key，如果未找到 key 则返回 0 赋值给 `ptr`；如果在\
  \ `pt` 的下一个节点中找到了 key，则返回指针 `pt` 赋值给 `ptr*/\n        if (ptr == 0) {\n         \
  \   /*如果在链表中没有找到 `key`，上述条件为真并执行后续语句*/\n            printf(\"Key not found. Item\
  \ cannot be inserted.\\n\");\n            /*`printf()` 函数将引号中的文本原样显示在屏幕上，换行符替换 `\\\
  n`*/\n        } else {\n            /*如果在 `ptr` 的下一个节点中找到了 `key`，则执行后续语句在 `ptr`\
  \ 之后插入新节点；如果我们认为 `ptr` 是第 3 个节点，而 `ptr->next` 指向第 4 个节点，这种操作更易理解；这里我们需要在第 4 个节点之前插入新节点*/\n\
  \            temp = (node *)malloc(sizeof(node));\n            /*创建一个新节点 `temp`；`sizeof()`\
  \ 函数计算 `node` 类型数据的大小，用于存储一个整数和另一个节点的地址；所需的内存空间通过 `malloc()` 动态分配；内存空间的地址赋值给节点指针\
  \ `temp*/\n            temp->num = nmb;\n            /*`nmb` 的值赋值给节点 `temp` 的 `num*/\n\
  \            temp->next = ptr->next;\n            /*新创建的节点 `temp` 与第 4 个节点链接，节点\
  \ `temp` 的成员 `next` 现在指向第 4 个节点*/\n            ptr->next = temp;\n            /*新创建的节点\
  \ `temp` 现在赋值给 `ptr` 的成员 `next`，使 `temp` 成为第 4 个节点而旧的第 4 个节点成为链表的第 5 个节点*/\n   \
  \     }\n        /*此为 `else (ptr==0)` 的结束*/\n    }\n}\n```\n\n\n\n\n\n## 练习题\n\n\
