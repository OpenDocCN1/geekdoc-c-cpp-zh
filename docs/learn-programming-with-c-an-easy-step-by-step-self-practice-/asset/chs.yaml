  \ 将双引号内的文本显示在屏幕上*/\n\t\t\texit(0);\n\t\t\t/*如果 `g0=0`，我们无法在下一个语句中将值 `f0` 除以 `g0`，而这是使用牛顿-拉夫逊法计算新近似根所需的，因此使用\
