  \ struct student 类型变量的成员，通过点 (.) 运算符访问；随后紧跟一个换行符替换 \\n；第二个格式说明符 %d 被 std1.roll 的值替换，随后是一个换行符；第三个格式说明符\
  \ %.2f 被 std1.grade 的值替换，并保留两位小数精度*/\n\treturn 0;\n\t/*返回 0 是因为它是程序成功执行的标准*/\n}\n\
  /*右大括号指定了 main() 函数体的结束，以及程序的结束；在该大括号之后，没有语句会被执行*/\n```\n\n### 问题-02 写一个程序，使用结构体和动态内存分配读取并显示\
