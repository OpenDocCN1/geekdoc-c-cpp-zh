  \t\tprintf(“%d, ”, pt->num);\n\t\t/*printf() 函数根据格式说明符 %d 在屏幕上显示最后一个节点 pt 的 num\
  \ 值*/\n\telse{\n\t/*如果 pt->num≠99，链表不为空且 pt->next≠0，pt 不是最后一个节点，情况下执行后续语句*/\n\t\t\
  printf(“%d, ”, pt->num);\n\t\t/*printf() 函数根据格式说明符 %d 在屏幕上显示当前节点 pt 的 num 值*/\n\t\
  \tprint(pt->next);\n\t\t/*使用实际参数 pt->next 调用 print()，pt->next 指向链表的下一个节点；程序控制流跳转到函数的定义处*/\n\
  \t}\n\t/*右花括号指定了 ‘else’ 的结束*/\n}\n/*右花括号指定了 print() 函数定义的结束；控制流返回到函数调用处*/\nnode\
  \ *find(node *pt, int key){/*用户定义函数 find() 的定义包含函数头和函数体；函数头与原型完全相同，除了没有使用分号，函数体在花括号内；这里\
