  \n![](img/fig0237.jpg)\n\n#### 编程代码说明：\n\n\n\n\n\n```c\n#include <stdio.h>\n/*头文件\
  \ `stdio.h` 包含了库函数 `printf()` 和 `scanf()` 的原型；在程序调用这些函数之前，必须使用预处理器指令 `#include`\
  \ 包含该头文件*/\nstruct atten{\n/*使用关键字 `struct` 创建了结构化数据类型 `atten`；其成员变量在大括号内声明*/\n\t\
  int roll, classno;\n\t/*声明了两个 int 类型变量，这些是数据类型 `struct atten` 的成员*/\n\tfloat classper,\
