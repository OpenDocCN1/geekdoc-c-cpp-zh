  \ 函数的开始，该大括号之前的任何语句都不会被编译器执行*/\n\tstruct complex num1, num2, sum;\n\t/*声明了三个 struct\
  \ student 类型变量，每个变量都有三个成员*/\n\tprintf(“Enter 1st complex number:\\nreal: ”);\n\t\
  /*这会将双引号内的文本原样显示在屏幕上，用换行符替换 \\n*/\n\tscanf：“%f”, &num1.real);\n\t/*scanf() 函数从输入终端读取一个小数并将其存储在\
  \ num1 结构体的第 1 个成员中，通过点 (.) 运算符 num1.real 访问*/\n\tprintf：“imaginary: ”);\n\t/*这会将双引号内的文本原样显示在屏幕上*/\n\
  \tscanf：“%f”, &num1.imag);\n\t/*scanf() 函数从输入终端读取一个小数并将其存储在 num1 结构体的第 2 个成员中，通过点\
  \ (.) 运算符 num1.imag 访问*/\n\tprintf(“Enter 2nd complex number:\\nreal: ”);\n\t/*这会将双引号内的文本原样显示在屏幕上，用换行符替换\
  \ \\n*/\n\tscanf：“%f”, &num2.real);\n\t/*函数 scanf() 从输入终端读取一个小数并将其存储在 num2 结构体的第\
  \ 1 个成员中，通过点 (.) 运算符 num2.real 访问*/\n\tprintf：“imaginary: ”);\n\t/*这会将双引号内的文本原样显示在屏幕上*/\n\
  \tscanf：“%f”, &num2.imag);\n\t/*scanf() 函数从输入终端读取一个小数并将其存储在 num2 结构体的第 2 个成员中，通过点\
  \ (.) 运算符 num2.imag 访问*/\n\tsum.real = num1.real + num2.real;\n\t/*使用点 (.) 运算符访问\
  \ struct complex 类型变量的成员；将 num1 和 num2 的实部相加，结果存储在 struct complex 类型变量 sum 的成员 real\
  \ 中*/\n\tsum.imag = num1.imag + num2.imag;\n\t/*将 num1 和 num2 的虚部相加，结果存储在 struct\
  \ complex 类型变量 sum 的成员 imag 中*/\n\tprintf：“%.2f+j%.2f + %.2f+j%.2f = %.2f+j%.2f”,\
  \ num1.real,num1.imag, num2.real, num2.imag, sum.real, sum.imag);\n\t/*输出函数 printf()\
  \ 将文本显示在屏幕上，但 num1.real 的值替换了第一个格式说明符 %.2f（保留两位小数精度），num1.imag 的值替换了第二个 %.2f，num2.real\
  \ 的值替换了第三个 %.2f，num2.imag 的值替换了第四个 %.2f，sum.real 的值替换了第五个 %.2f，sum.imag 的值替换了第六个\
  \ %.2f；所有变量都是 struct complex 类型变量的成员，并使用点 (.) 运算符访问*/\n\treturn 0;\n\t/*返回 0 是因为它是程序成功执行的标准*/\n\
  }\n/*右大括号指定了 main() 函数体的结束，以及程序的结束；在那个大括号之后，不再执行任何语句*/\n```\n\n### 题目-04：编写一个程序来创建并显示一个包含\
  \ n 个节点的单链表。\n\n#### 解决方案的编程代码：\n\n![](img/fig0213.jpg)![](img/fig0214.jpg)![](img/fig0215.jpg)\n\
  \n#### 运行程序的输入和输出：\n\n![](img/fig0216.jpg)\n\n#### 编程代码说明：\n\n\n\n\n\n```c\n#include\
  \ <stdio.h>\n/*头文件 stdio.h 包含库函数 `printf()`、`scanf()` 和 `sizeof()` 的原型；在程序调用这些函数之前，必须使用预处理器指令\
  \ #include 包含头文件*/\n#include <stdlib.h>\n/*头文件 stdio.h 包含库函数 `malloc()` 的原型；在程序调用该函数之前，必须使用预处理器指令\
  \ #include 包含该头文件*/\nstruct node{\n/*使用关键字 `struct` 创建了新数据类型 `struct node`；`struct\
  \ node` 的成员在大花括号中声明*/\n\tint num;\n\t/*声明了整数类型变量 `num`，它是数据类型 `struct node` 的一个成员*/\n\
  \tstruct node *next;/*声明了 `struct node` 类型的指针 `next` 作为数据类型 `struct node` 的第二个成员；`next`\
  \ 包含另一个节点的地址*/\n} *stnode;\n/*结构化数据类型的定义必须以分号结束；在这里声明了已定义数据类型 `struct node` 的指针\
  \ `stnode`*/\nvoid create(int n);\n/*这是用户定义函数 `create()` 的原型（或声明），必须以分号结束；`create()`\
  \ 接受一个整数作为参数，执行某些预定义的操作且没有返回值*/\nvoid display();\n/*这是用户定义函数 `display()` 的原型（或声明），必须以分号结束；`display()`\
  \ 不接受参数，执行某些预定义的操作且没有返回值*/\nint main(){\n/*所有 C 程序必须有一个返回类型为 `void` 或 `int` 的 `main()`\
  \ 函数；这里 `main()` 函数没有参数且它返回一个整数；左大括号指定了 `main()` 函数的开始，在该左大括号之前的任何语句都不会被编译器执行*/\n\
  \tint nm;\n\t/*声明了一个整数类型变量的变量 `nm`；为该变量分配了所需的内存空间*/\n\tprintf(“输入节点数量: ”);\n\t/*`printf()`\
  \ 函数将引号中的文本原样显示在屏幕上*/\n\tscanf(“%d”, &nm);\n\t/*`scanf()` 函数从输入终端读取一个整数并将值存储在为 `nm`\
  \ 分配的内存空间中*/\n\tcreate(nm);\n\t/*使用实际参数 `nm` 调用用户定义函数 `create()`，该参数指向链表中的节点数；程序控制流转移到函数的定义处*/\n\
  \tprintf(“\\n 链表中输入的数据:\\n”);\n\t/*`printf()` 函数将引号中的文本原样显示在屏幕上，除了 `\\n` 会被换行*/\n\
  \tdisplay();\n\t/*调用用户定义函数 `display()`；程序控制流转移到函数的定义处*/\n\treturn 0;\n\t/*返回 0 是它是程序成功执行的标准*/\n\
  }/*右大括号指定了 `main()` 函数体的结束，以及程序的结束；在该右大括号之后，不再有语句被执行*/\nvoid create(int n){\n/*`create()`\
  \ 函数的定义在此开始，包含函数头和函数体；函数头与没有分号的函数原型相同；函数体在大花括号内；函数调用期间传递的实际参数替换了虚拟参数 `n`*/\n\tstruct\
