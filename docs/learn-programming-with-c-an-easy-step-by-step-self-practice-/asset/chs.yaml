  \ (i=0; i<8; i++){\n\t/*这个 for 循环用于从等效十进制（0–7）生成所有 8 种三位二进制数的组合以及每种组合的异或结果；i=0 是初始化，i<8\
  \ 是条件，i++ 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行体内的语句并在重新检查条件之前将 i 的值加 1；这些步骤一直持续，直到条件变为假，此时程序流退出循环*/\n\
  \t\tabc[i].c=i%2;\n\t\t/*在每次迭代中根据对应的十进制数 0, 1, 2, … 计算最低位 (LSB)，并将其存储在每个数组元素 abc[]\
