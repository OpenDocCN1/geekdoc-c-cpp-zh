  \t\tfor (j=0; j<numsub; j++){\n\t\t\t/*此处 `j=0` 是初始化，`j<numsub` 是条件，`j++` 是递增；初始化在循环开始时执行一次；然后检查条件，如果为真，则执行花括号内的体语句，并在重新检查条件之前将\
