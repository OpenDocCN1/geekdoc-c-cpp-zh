  \ 显示 `ch` 的值\n* 23.4: 跳转到步骤-23\n\n### 步骤-24: 停止\n\n#### 解决方案的程序代码：\n\n![](img/fig0291.jpg)![](img/fig0292.jpg)![](img/fig0293.jpg)![](img/fig0294.jpg)![](img/fig0295.jpg)![](img/fig0296.jpg)\n\
