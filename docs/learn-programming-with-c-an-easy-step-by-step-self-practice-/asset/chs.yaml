  }\n/*右大括号指定 main() 函数体的结束以及程序的结束；在该大括号之后，不再执行任何语句*/\n```\n\n### **问题-11**某人拥有 10\
  \ vori 黄金、25 vori 银和 10,000.00 塔现金。他还有 5,000.00 塔的债务，并欠他的表弟 7,500.00 塔。计算他今年需要缴纳虔税（Piety\
  \ tax）的金额。虔税是支付给穷人的，如果一个人在一个太历年后的总财富（黄金、银、现金或任何业务物品）超过 7.5 vori 黄金或 52.5 vori 银，则需缴纳总财富的\
  \ 2.5%。\n\n#### 解决方案的流程图：\n\n图 2.6 显示了解决此问题的流程图。\n\n#### 解决方案的算法：\n\n*   步骤-1：开始\n\
  *   步骤-2：读取 `gold`、`silver`、`bank`、`cash`、`item`、`debt`、`gdprice` 和 `srprice` 的值\n\
  *   步骤-3：`nisab`=`gdprice`×7.5\n*   步骤-4：如果 `silver`≠0\n    *   4.1：跳转到步骤-8.1\n\
  *   步骤-5：如果 `bank`≠0\n    *   5.1：跳转到步骤-8.1\n*   步骤-6：如果 `cash`≠0\n    *   6.1：跳转到步骤-8.1\n\
  *   步骤-7：如果 `item`≠0\n    *   7.1：跳转到步骤-8.1\n*   步骤-8：如果 `owe`≠0\n    *   8.1：如果\
  \ `nisab`>`srprice`×52.5\n           8.1.1：`nisab`=`srprice`×52.5\n*   步骤-9：显示 `nisab`\
  \ 的值\n*   步骤-10：`asset`=`gold`×`gdprice`+`silver`×`srprice`+`bank`+`cash`+`item`+`owe`−`debt`\n\
  *   步骤-11：显示 `asset` 的值\n*   步骤-12：如果 `asset`<`nisab`\n    *   12.1：显示“无虔税’\n  \
  \  *   12.2：跳转到步骤-15\n*   步骤-13：`zakat`=`asset`×2.5/100\n*   步骤-14：显示 `zakat` 的值\n\
  *   步骤-15：停止\n\n#### 解决方案的编程代码：\n\n\n\n\n\n```c\n#include <stdio.h>\n/*头文件 stdio.h\
  \ 包含了库函数 printf() 和 scanf() 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含该头文件*/\nint main(){\n\
  /*所有 C 程序都必须有一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数，它返回一个整数；左大括号指定了 main()\
  \ 函数的开始，在该左大括号之前的任何语句都不会被编译器执行*/\n\tfloat gold, silver, bank, cash, item;\n\t/*声明了五个\
  \ float 类型的变量；为每个变量分配了所需的内存空间*/\n\tfloat debt, owe, gdprice, srprice;\n\t/*声明了四个\
  \ float 类型的变量；为每个变量分配了所需的内存空间*/\n\tfloat nisab, asset, pttax, zakat;\n\t/*声明了四个\
  \ float 类型的变量；为每个变量分配了所需的内存空间*/\n\tprintf(“这是一个简单的天课税计算器 …… \\n\\n”);\n\t/*printf()\
  \ 函数将引号内的文本原样显示在屏幕上， \\n 被替换为换行符*/\n\tprintf(“你有多少黄金（单位：vori）？ ”);\n\t/*输出函数 printf()\
