  - `addition(num, 4);`\n\n## 4.5 指针与函数\n\n当我们把指针作为参数传递给函数时，我们传递的是变量的地址而不是变量本身。因此，函数对变量的任何更改都会影响该地址上实际变量的值。这被称为按引用调用函数。例如：\n\
  \n![](img/fig0157.jpg)\n\n## 4.6 存储类\n\n任何 C 变量都有两个属性：\n\n1. `Type`（类型）：它定义了变量的数据类型。\n\
  2. `Storage class`（存储类）：它决定了变量的生存和可见性。C 中有四种存储类。\n\n    1. `Local variable`（局部变量）：在块或函数内部声明的局部变量仅在该块或函数内部可见。\n\
  \    2. `Global variable`（全局变量）：在所有函数外部声明，可以从任何函数访问。\n    3. `Register variable`（寄存器变量）：使用\
  \ `register` 关键字声明，在访问速度上比局部变量更快。\n    4. `Static variable`（静态变量）：使用 `static` 关键字声明静态变量，其值在程序结束之前不会改变。\n\
  \n示例：\n\n![](img/fig0158.jpg)\n\n## 4.7 示例\n\n#### 问题-01 编写一个程序使用指针和函数交换两个数字。\n\n\
  解决方案程序代码：\n\n![](img/fig0159.jpg)![](img/fig0160.jpg)\n\n执行程序的输入和输出：\n\n![](img/fig0161.jpg)\n\
  \n#### 编程代码解释：\n\n```c\n#include <stdio.h>\n/*头文件 stdio.h 包含了库函数 printf() 和 scanf()\
  \ 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含头文件*/\nvoid swap(int *x, int *y);\n/*这是用户定义函数\
  \ swap() 的原型（或声明），必须以分号结束；swap() 接收两个数字作为参数，执行某些预定义操作且没有返回值*/\nint main(){\n/*所有\
  \ C 程序必须有一个返回类型为 void 或 int 的 main() 函数；这里 main() 函数没有参数且它返回一个整数；左大括号指定了 main()\
  \ 函数的开始，在该大括号之前的没有语句会被编译器执行*/\n\tint num1, num2;\n\t/*声明了两个整型变量；为变量分配了所需的内存空间*/\n\
  \tprintf(“Enter any two integers: ”);\n\t/*这会在屏幕上原样显示双引号内的文本*/\n\tscanf(“%d %d”,\
  \ &num1, &num2);\n\t/*函数 scanf() 从输入终端读取两个整数并将值存储在为 num1 和 num2 分配的内存空间中；第一个格式说明符\
  \ %d 对应 num1，第二个 %d 对应 num2*/\n\tswap(&num1, &num2);\n\t/*按引用调用用户定义函数 swap()；&num1\
  \ 和 &num2 是实参；程序控制流切换到函数定义*/\n\tprintf(“After swapping: %d %d”, num1, num2);\n\t\
  /*输出函数 printf() 在屏幕上原样显示引号内的文本，但 num1 的值替换了第一个格式说明符 %d，num2 的值替换了第二个 %d*/\n\treturn\
  \ 0;\n\t/*返回 0，因为它是程序成功执行的标准*/\n}\n/*右大括号指定了 main() 函数体的结束，以及程序的结束；在该大括号之后，没有语句被执行*/\n\
  void swap(int *x, int *y){\n/*这是用户定义函数 swap() 的头部，它必须与函数原型相同，除了没有使用分号；函数定义在大括号内*/\n\
  \tint temp;\n\t/*声明了整型变量 temp，它是 swap() 函数的局部变量*/\n\ttemp = *x;\n\t/*x=&num1 且 *x=num1，因此\
  \ temp=*x=num1*/\n\t*x = *y;\n\t/*x=&num1 且 y=&num2, *x=num1 且 *y=num2，因此 *x=*y→\
  \ num1=num2*/\n\t*y = temp;\n\t/*y=&num2, *y=num2 且 temp=num1，因此 *y=temp → num2=num1*/\n\
  }\n/*右大括号指定了 swap() 函数体的结束；在此点，程序控制流返回到调用函数的地方*/\n```\n\n#### 问题-02 编写一个程序使用函数计算数字的幂。\n\
