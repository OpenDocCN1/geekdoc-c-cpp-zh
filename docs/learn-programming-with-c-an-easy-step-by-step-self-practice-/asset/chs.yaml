  \ \\frac{1}{3} + \\cdots + \\frac{1}{\\text{n}}$$\n\n`n` 的值应通过终端交互式给出。\n\n解决方案的流程图：\n\
  \n图 2.1 显示了解决此问题的流程图。\n\n![](img/fig2_1.jpg)\n\n#### 解决方案算法：\n\n*   第一步：开始\n*  \
  \ 第二步：初始化 `sum←0`\n*   第三步：读取 `n` 的值\n*   第四步：初始化 `i←1`\n*   第五步：如果 `i<=n`\n   \
  \ *   5.1：`sum←sum+1/i`\n    *   5.2：`i←i+1`\n    *   5.3：回到第五步\n*   第六步：如果 `n>5`\n\
  \    *   6.1：显示 `1+1/2+1/3+`\n    *   6.2：回到第十步\n*   第七步：显示 `1`\n*   第八步：初始化 `j←2`\n\
  *   第九步：如果 `j<n`\n    *   9.1：显示 `+1/j`\n    *   9.2：`j←j+1`\n    *   9.3：回到第九步\n\
  *   第十步：显示 `+1/n=sum`\n*   第十一步：停止\n\n\n\n\n\n```c\n#include <stdio.h>\n/*header\
  \ file stdio.h contains prototypes of the library functions printf(), and scanf();\
  \ the header file must be included using preprocessor directive #include before\
  \ the functions are called in the program*/\nint main(){\n/*all C program must have\
  \ a main() function with return type void or int; here there is no parameter of\
  \ the main() function and it returns an integer; opening curly brace specifies start\
  \ of the main() function and no statement before that curly brace is executed by\
  \ the compiler*/\n\tint n, i, j;\n\t/*three int type variables are declared; compiler\
  \ assigns required spaces in memory for these three variables*/\n\tfloat sum=0;\n\
  \t/*the float type variable sum is declared and initialized to 0; this variable\
  \ is used in the summation operation; thus, it must be initialized to 0; otherwise,\
  \ some garbage value is added in the first addition, and we get the wrong answer;\
  \ because when a variable is declared, memory space is allocated for that variable,\
  \ and the assigned memory space may contain some garbage value*/\n\tprintf(“Please\
  \ enter an integer: ”);\n\t/*output library function printf() displays the text\
  \ inside the double quotes as it is on the standard output terminal*/\n\tscanf(“%d”,\
  \ &n);\n\t/*input library function scanf() reads an integer from input terminal\
  \ and stores the value in the memory location assigned for n*/\n\tfor (i=1; i<=n;\
  \ i++)\n\t/*i=1 is initialization, i<=n is condition and i++ is increment; initialization\
  \ is done once at the beginning of the loop; next the condition is checked, and\
  \ if it is true, the statement in the body is executed; the value of i is incremented\
  \ by 1 before the condition is re-checked; this process continues until the condition\
  \ becomes false at which point the program flow exits the loop*/\n\t\tsum=sum+(1/(float)i);\n\
  \t\t/*in each iteration of the loop, the type of i is converted to float from int,\
  \ so that 1/i gives a decimal value; this action sequentially adds 1/1, 1/2, 1/3,\
  \ … to the sum*/\n\tif (n>5)\n\t/*if n>5 then the condition is true and following\
  \ statement is executed*/\n\t\tprintf(“1 + 1/2 + 1/3 + … ”);\n\t\t/*this printf()\
  \ function displays the text inside the double quotations as it is on the screen*/\n\
  \telse{\n\t/*statements in the body of else, enclosed by curly braces, are executed\
  \ if the condition of ‘if’ is false, that is, n<=5*/\n\t\tprintf(“1”);\n\t\t/*output\
  \ function printf() displayes 1 on the screen*/\n\t\tfor (j=2; j<n; j++)\n\t\t/*j=2\
  \ is initialization, i<=n is condition and i++ is increment; initialization is done\
  \ once at the beginning of the loop; then the condition is checked, and if it is\
  \ true, the statement in the body is executed; the value of j is incremented by\
  \ 1 before the condition is re-checked; these procedures are repeated until the\
  \ condition is no longer true at which point the program flow exits the loop*/\n\
  \t\t\tprintf(“ + 1/%d”, j);\n\t\t\t/*printf() function displays the text inside\
  \ the double quores as it is on the screen except for the value of j replaces the\
  \ format specifier %d*/\n\t}\n\t/*this closing curly brace specifies the end of\
  \ else*/\n\tprintf(“ + 1/%d = %0.2f\\n”, n, sum);\n\t/*the printf() function displays\
  \ the text in the double-quotes as it is on the screen, with the exception that\
  \ the value of n replaces the format specifier %d, the value of sum replaces the\
  \ format specifier %0.2f with two decimal points precision, and a newline replaces\
  \ \\n*/\n\treturn 0;\n\t/*0 is returned as it is the standard for the successful\
  \ execution of the program*/\n}\n/*the closing curly brace specifies the end of\
  \ the main() function’s body, as well as the program’s end; after that curly brace,\
  \ no statement is executed*/\n```\n\n### **问题-07: 编写一个程序，找到大于 100 且小于 200 的所有被 7\
