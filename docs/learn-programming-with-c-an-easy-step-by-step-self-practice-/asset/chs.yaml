  \ exor，其成员在在大括号内声明*/\n\tint a, b, c, res;\n\t/*声明了四个整型变量，这些是结构化数据类型 exor 的成员*/\n\
  };\n/*结构化数据类型的定义以分号结束，不声明任何定义数据类型 exor 的变量*/\nint main(){\n/*所有 C 程序必须有一个返回类型为 void\
