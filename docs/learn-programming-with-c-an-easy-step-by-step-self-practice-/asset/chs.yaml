  \    - 1.2：跳转到步骤-2\n- 步骤-2：显示 `num1.real-*i*num1.imag`\n- 步骤-3：返回\n\n\n\n\n\n![](img/fig0232.jpg)!(Images/fig0233.jpg)\n\
