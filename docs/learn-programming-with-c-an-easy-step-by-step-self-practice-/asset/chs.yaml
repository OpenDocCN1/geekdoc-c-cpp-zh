  \ n 个字符。\n\n## 解决方案的流程图：\n\n图 4.7 显示了解决此问题遵循的流程图。\n\n![](img/fig4_7.jpg) ![](img/fig4_7a.jpg)\
  \ ![](img/fig4_7b.jpg)\n\n图 4.7 解决该问题遵循的流程图。\n\n### 解决方案的算法：\n\n* 步骤-1: 开始\n* 步骤-2:\
  \ 读取 `mnstr`、`sbstr` 和 `psn` 的值\n* 步骤-3: 调用函数 `insert(mnstr, sbstr, restr, psn)`\n\
  * 步骤-4: 显示字符串 `restr`\n* 步骤-5: 读取 `psn` 和 `numch` 的值\n* 步骤-6: 调用函数 `delet(restr,\
  \ psn, numch)`\n* 步骤-7: 显示字符串 `restr`\n* 步骤-8: \n\n### 函数 `insert(str1, str2, str3,\
  \ pos)` 的算法：\n\n* 步骤-1: 初始化 `j←0`、`len1←strlen(str1)`、`len2←strlen(str2)` 和 `i←0`\n\
  * 步骤-2: 如果 `i<pos−1`\n    * 2.1: `str3[i]←str1[i]`\n    * 2.2: `i←i+1`\n    * 2.3:\
  \ 转到步骤-2\n* 步骤-3: 初始化 `k←i` 和 `i←pos−1`\n* 步骤-4: 如果 `i<pos+len2–1`\n    * 4.1: `str3[i]←str2[j]`\n\
  \    * 4.2: `j←j+1`\n    * 4.3: `i←i+1`\n    * 4.5: 转到步骤-4\n* 步骤-5: 初始化 `i←pos+len2–1`\n\
  * 步骤-6: 如果 `i<len1+len2`\n    * 6.1: `str3[i]←str1[k]`\n    * 6.2: `k←k+1`\n   \
  \ * 6.3: `i←i+1`\n    * 6.4: 转到步骤-6\n* 步骤-7: `str3[i]←‘\\0’`\n* 步骤-8: 返回。\n\n###\
  \ 函数 `delet(str1, pos, num)` 的算法：\n\n* 步骤-1: `len←strlen(str1)`\n* 步骤-2: 初始化 `b←pos+num−1`\
