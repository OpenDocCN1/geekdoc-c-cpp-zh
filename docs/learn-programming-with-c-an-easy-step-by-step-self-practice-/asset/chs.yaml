  n`*/\n\t}\n}\n```\n\n\n\n\n\n# 问题-12 编写一个程序，交互地创建一个线性链表，并从列表中删除指定的节点。程序将显示删除前后的所有项。\n\
  \n## 解决方案的流程图：\n\n图 5.6 显示了解决此问题遵循的流程图。\n\n![](img/fig5_6.jpg)\n\n图 5.6 解决问题所需的流程图。\n\
  \n![](img/fig0256.jpg)![](img/fig0257.jpg)![](img/fig0258.jpg)![](img/fig0259.jpg)\n\
  \n## 解决方案的算法：\n\n- 步骤-1: 开始\n- 步骤-2: 定义成员 `num` 和 `next` 的 `struct list node`\n\
  - 步骤-3: 调用函数 `create(head)`\n- 步骤-4: 调用函数 `print(head)`\n- 步骤-5: 如果 `head->num≠−99`\n\
  \    - 5.1: `head←delet(head)` [调用函数 `delet()`]\n    - 5.2: 调用函数 `print(head)`\n\
  - 步骤-6: 显示输入\n- 步骤-7: 停止\n\n## 函数 create(pt) 的算法：\n\n- 步骤-1: 初始化 `count←0`\n- 步骤-2:\
  \ 读取 `key` 的值\n- 步骤-3: 如果 `key=−99`\n    - 3.1: 如果 `count=0`\n        - 3.1.1: `pt->num←−99`\n\
  \        - 3.1.2: `pt->next←0`\n        - 3.1.3: 跳到步骤-8\n    - 3.2: `head1->next←0`\n\
  \    - 3.3: `free(pt)`\n    - 3.4: 跳到步骤-8\n- 步骤-4: `count←count+1`\n- 步骤-5: `head1←pt`\n\
  - 步骤-6: `pt->num←key`\n- 步骤-7: 调用函数 `create(pt->next)`\n- 步骤-8: 返回。\n\n## 函数 print(pt)\
  \ 的算法：\n\n- 步骤-1: 如果 `pt->num=−99`\n    - 1.1: 显示“空列表”\n    - 1.2: 跳到步骤-4\n- 步骤-2:\
  \ 如果 `pt->next=0`\n    - 2.1: 显示 `pt->num` 的值\n    - 2.2: 跳到步骤-4\n- 步骤-3: 显示 `pt->num`\
  \ 的值\n- 步骤-4: 返回。\n\n## 函数 find(pt, key) 的算法：\n\n- 步骤-1: 如果 `pt->next=0`\n    -\
  \ 1.1: 如果 `pt->num≠key`\n        - 1.1.1: 跳到步骤-3.1\n- 步骤-2: 如果 `pt->next->num=key`\n\
  \    - 2.1: 返回 `pt` 的值\n- 步骤-3: 如果 `pt->next->next=0`\n    - 3.1: 返回 0\n- 步骤-4:\
  \ 调用函数 `find(pt->next, key)`\n\n## 函数 delet(pt) 的算法：\n\n- 步骤-1: 读取 `key` 的值\n- 步骤-2:\
  \ 如果 `pt->num=key`\n    - 2.1: 如果 `pt->next=0`\n        - 2.1.1: `pt->num←−99`\n\
  \        - 2.1.2: 跳到步骤-9\n    - 2.2: `temp←pt->next`\n    - 2.3: `free(pt)`\n  \
  \  - 2.4: `pt←temp`\n    - 2.5: 跳到步骤-9\n- 步骤-3: `ptr←find(pt, key)` [调用函数 `find()`]\n\
  - 步骤-4: 如果 `ptr=0`\n    - 4.1: 显示“未找到 key”\n    - 4.1: 跳到步骤-9\n- 步骤-5: 如果 `ptr->next->next=0`\n\
  \    - 5.1: `free(ptr->next)`\n    - 5.2: `ptr->next←0`\n    - 5.3: 跳到步骤-9\n- 步骤-6:\
  \ `temp←ptr->next->next`\n- 步骤-7: `free(ptr->next)`\n- 步骤-8: `ptr->next→temp`\n\
  - 步骤-9: 返回 `pt` 的值\n\n## 解决方案的编程代码：\n\n![](img/fig0260.jpg)![](img/fig0261.jpg)![](img/fig0262.jpg)![](img/fig0263.jpg)\n\
  \n## 执行程序的输入与输出：\n\n![](img/fig0264.jpg)\n\n## 编程代码说明：\n\n\n\n\n\n```c\n#include\
  \ <stdio.h>\n/*头文件 stdio.h 包含了库函数 printf()`, `scanf()`, 和 `sizeof()` 的原型；在程序调用这些函数之前，必须使用预处理器指令\
  \ #include 包含该头文件*/\n#include <stdlib.h>\n/*头文件 stdio.h 包含了库函数 free() 和 `malloc()`\
  \ 的原型；在程序调用这些函数之前，必须使用预处理器指令 #include 包含该头文件*/\ntypedef struct list{\n/*使用关键字 struct\
  \ 创建了新数据类型 struct list；struct list 的成员在花括号中声明*/\n\tint num;\n\t/*声明了整型类型变量 num，它是数据类型\
  \ struct list 的成员*/\n\tstruct list *next;\n\t/*声明了 struct list 类型指针 next 作为数据类型\
  \ struct list 的第二个成员；next 包含另一个 struct list 的地址*/\n} node;\n/*关键字 typedef 给 struct\
  \ list 分配了一个新名称 node，在此定义之后，标识符 node 可以用作数据类型 struct list 的缩写；结构化数据类型的定义必须以分号结束；这里没有声明已定义的\
  \ struct list 类型的变量*/\nvoid create(node *pt);\n/*这是用户定义函数 create() 的原型（或声明），它必须以分号结束；create()\
