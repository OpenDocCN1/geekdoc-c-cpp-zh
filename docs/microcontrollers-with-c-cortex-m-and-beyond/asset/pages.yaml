  md: '# # Chapter 3


    # # An Embedded System


    # ## 3.1 Introduction


    Before digging into the embedded software, we will discuss the hardware in a generic
    embedded system. I will introduce a number of keywords and concepts. We will dig
    deeper into most of these along the way, but in order to understand some concepts,
    we need an idea about the others. Thus, it all becomes a bit iterative, and we
    use things that we later get more insight into.


    Back in the eighties I was part of a project developing medical equipment for
    measuring Evoked Potentials. This is small electric signals in muscles and nerves
    - provoked by injecting currents through needles - and yes - it was a bit painful.
    The *Evomatic 8000* used Intel 8086 - immortalized by the first IBM PC - for general
    control. However, we needed something much faster for Digital Signal Processing.
    For this we used *Bit-Slice* on the 29xx-series from AMD. The core of this was
    a 4-wide ALU - *Arithmetic Logical Unit* - that could input 4-bit operands, and
    add/subtract, and/or/xor, and rotate/shift these to produce a 4-bit result. Several
    ALUs could be chained together to support the arithmetic operations as well as
    shifting or rotating the full chain. Using *Carry-Look-Ahead and AND* of Zero
    flags etc., it was possible to put the 4-bit ALUs together like LEGO bricks. Hence,
    the “Bit-Slice” we accumulated data in 20-bits and thus needed five 4-bit ALUs.
    There was also a *Sequencer* which would decide the next instruction address from
    the current address, the chosen - e.g., *Branch to address XX if Less Than* -
    and the flags from the ALUs. We created our own instruction set where we dedicated
    e.g., two four bits to select two register operands among 16 registers. Another
    field in the instruction-set spelled out the operation for the ALU.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 3. AN EMBEDDED SYSTEM


    More fields were dedicated to addresses in RAM-memory and so on. Basically we
    allocated fixed parts of the instruction-word to specific purposes like e.g.,
    selecting registers. We had a very long instruction word from all these fields,
    and we created our own assembly language for this.


    Very importantly, we had a hardware multiplier that could multiply two 8-bit operands
    and produce a 16-bit result which was accumulated in the 20-bit width accumulator
    - giving headroom for adding a lot of data before dividing with e.g., number of
    samples to obtain an average. This Multiply-Accumulate is a very common DSP-pattern
    that we will recognize again and again.


    We did not have the advanced pipeline concepts that modern CPUs have, but I clearly
    remember how important it was to keep the multiplier busy all the time when I
    wrote a Radix-4 FET, in parallel moving data and out of the registers. Using the
    fields of the wide instruction felt very much like opening doors to let the bits
    back and forth like mice in an organized manner. The DSP-parts of the system filled
    two Double Eurocards (6U rack-size - 233 mm * 160 mm).


    I learned a lot about how a CPU is created, as we basically built our huge CPU
    - proper. Modern CPUs and MCUs are built around similar concepts, but are much
    faster, use less energy, and particularly much less space. On top of this, the
    MCUs come stacked with peripherals. Nevertheless, many of the underlying principles
    are the same.


    # 3.2 A Generic Embedded System


    Figure 3.1 shows a generic programmers block-diagram of an MCU - Controller. You
    will recognize several blocks from the Introduction. Please note that only selected
    data- and control-paths are shown. In the figure we have the following components:


    +   Clock


