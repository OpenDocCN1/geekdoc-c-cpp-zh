    the queue. It might block, but when it unblocks it copies the data. Thus, the
    main reason to use a pointer in the put function is that this keeps the function
    prototype general. Today we use a simple variable - tomorrow a complex structure.
    Such change would not require us to reopen STM32CubeMX - we could simply update
    the queue size argument in line 42 in Listing 13.2. It is still possible to use
    references to shared memory, that requires us to actively use a pointer to a pointer.


    # 13.4 Interrupt with Semaphore


    We discussed message-passing in Chapter 12, and then tried this with FreeRTOS
    semaphores - which is often confused with Mutexes. Now, let''s using a semaphore
    with FreeRTOS - together with an interrupt and a callback. The idea is when I
    press the Blue Button on the STM32F33R8X board, which generates an interrupt.
    The interrupt will release a semaphore that unblocks a Task. According to the
    board-manual the pin connected to the Blue Button is “PC13”. Looking back at the
    pinout graphic in Figure 13.4 we can see that pin 2 on the chip in the upper corner
    is PC13 and is already configured with a label for “B1 [Blue PushButton]


    Once again, I opened STM32CubeMX. In the System-Core GPIO-menu I found PC13 and
    selected it - which even made the blink on the pin. I set “GPIO mode” to “External
    interrupt Mode with Falling edge trigger detection” and “GPIO Pull Up/Down” to
    “No Pull up/down”. In the same window I clicked “NVIC” tab. This showed a single
    line EXTI line[15:10] interrupts with a checkbox which I checked. I also went
    into the FreeRTOS Middleware and created yet a Task - Task3. Under “Timers and
    Semaphores” I added a semaphore and named it “BluePressed”. Saved the config and
    let it generate code. I could now see the changes in main.c:


