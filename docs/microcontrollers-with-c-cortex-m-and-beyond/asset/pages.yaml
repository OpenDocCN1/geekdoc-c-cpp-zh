  md: '# 10.1. STACK GUARD


    bare-metal system basically always runs in privileged mode.


    A system with the MPU disabled acts like a system without an MPU. A program can
    configure the MPU statically at initialization, helping you to e.g., avoiding
    executing code from data-space and ensure code writing to registers in the Device
    region obeys the rules for accessing devices.


    If you have an RTOS may dynamically set up the MPU so that any task has only access
    to its own stack. This is e.g. supported by FreeRTOS in a specific MPU-version.
    The FreeRTOS homepage suggests that you use the MPU to create a pseudo thread
    and thread model - where groups of threads are allowed to share a memory space.


    Note that you can also use the MPU during debugging. If you see unstable behavior,
    you can debug a suspected memory overwrite by creating an access function for
    the data that is overwritten. The access function will program the MPU to allow
    access to the memory before accessing it, and disallow access afterwards. Only
    code that the access function avoids triggering an exception. When the exception
    occurs, the stack will show the offending code.


    # 10.1 Stack Guard


    Using the MPU can seem complex, and I am sure that many MPUs are never used. Sometimes
    it is best to start with a simple success. This can prove the value of investing
    more energy in a given concept, and thereby motivate us developers. In Chapter
    4 we saw an example of a stack-guard, that was checked at regular intervals. It
    is however, much better to catch the villain red-handed. As complex as the MPU
    may seem, it is not difficult to set up a stack-guard, that when the memory is
    violated, leads to an exception.


    Listing 10.1 shows the last part of the usual linker-script. Here the symbol __MPstack_chk_guard
    is created at the border between the heap and the stack. In this case we add 32
    to the location pointer before the stack part.


    Before this is done, we align to a 32-byte border. This is dictated by the MPU.
    The smallest area the MPU can protect is 32 bytes - and as stated - any protected
    area must be aligned corresponding to its own size. So now we have a “no-mans
    land” of 32 bytes where there should never be any access.


    Listing 10.2 shows a very simple setup of the MPU. First we read the TYPE register
    to make sure that the current device has an MPU. The STM32F334R8TX does NOT have
    an MPU and will fail already here. This'
