- img_proc: true
  md: '# CHAPTER 3. AN EMBEDDED SYSTEM


    +   CAN Controller Area Network is known from cars and factory floors. CAN is
    a well-known standard for cheap communication with sensors and actuators. These
    are mounted as multi-drop on a simple twisted pair of wires. The CAN-protocol
    has a built-in priority scheme and is relatively robust. This implementation offers
    small receive FIFOs (hardware queues) with interrupts and the ability to set filters
    for message types.


    +   GPIO The General-Purpose Input/Output is a swarm (STM32F334R8 has 51) of 1-bit
    ports that can be configured for input or output, or without pull-up/down. About
    half of these can handle 5V, which is more than the Core-Voltage of the CPU-core.
    most of these ports can alternatively be configured as something else. This means
    that you cannot have all 51 GPIOs while also having ADC or DAC or Timers. This
    is the pin-multiplexing mentioned earlier.


    +   Timers Up to 12 timers of varying resolution. Some can be used to count external
    pulses, generate PWM - Pulse Width Modulation - and others can be used as Watchdogs.
    The SysTick timer is meant to be used with an Operating System and is integrated
    with the NVIC.


    +   USARTs Three Universal Synchronous/Asynchronous Receiver/Transmitters - of
    which one may serve as a classic RS-232 serial port with CTS and RTS hardware-handshake
    signals. With speeds up to 9 Mb/s these ports can be used as a general interface
    to other CPUs.'
