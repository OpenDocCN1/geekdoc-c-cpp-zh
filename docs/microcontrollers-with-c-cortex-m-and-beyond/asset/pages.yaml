  md: '# 11.4 Executing the Context Switch


    From the previous section we know that the OS-code doing the context-switch can
    be called within SVC, SysTick - and possibly other inter-rups. This is what happens
    on some architectures. This concept can cause challenges if e.g., the SysTick-interrupt,
    interrupts an ongoing interrupt, that we actually would like to complete first
    - to keep latency down. The Arm remedy for this is PendSV - Pendable Service.
    This is an interrupt that you give the the lowest priority. When - in a SysTick-Handler
    or a SVC-Handler - the OS needs a context Switch, the OS sets the PENDSVSET bit
    in the Interrupt Control and State Register - ICSR. At some point the handler
    exits. If the SysTick handler had interrupted another interrupt - this are also
    handled. Finally, when there are no more interrupts and normal code is about to
    resume - then the PendSV interrupts. We can call it a deferred handler. Inside
    the PendSV-Handler the context switch happens as previously described.'
