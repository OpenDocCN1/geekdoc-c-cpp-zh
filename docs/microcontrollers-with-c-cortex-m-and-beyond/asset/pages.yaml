    # 12.5.3 SIMD


    The second type of work that also intuitively lends itself to parallelization
    is when the same algorithm is performed on similar datasets. This is called SIMD
    - Single Instruction, Multiple data. This could be processing stereo sound or
    lines of an image. Such processing is parallel, but if we can apply the SIMD-instructions,
    we don’t even need to think in terms of multiple tasks. The important thing is
    to make sure that data is lined up in a way that allows the instructions to run
    smoothly. The SIMD term is one of four types in Flynn’s Taxonomy:


    +   * SISD = Single Instruction, Single Data. Classic programming.


    +   * SIMD = Single Instruction, Multiple Data. Stereo, graphics processing or
    multichannel measurements and generators.'
