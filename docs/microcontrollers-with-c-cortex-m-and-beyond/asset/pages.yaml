    # 3.3 CPU and MCU


    CPU stands for Central Processing Unit. A Micro-Controller Unit - MCU or μC- always
    contains a CPU-core. An MCU however, additionally contains enough on-board memory
    to make meaningful programs without external memory. You may also expect an MCU
    to contain some relevant peripherals.


    All the above means MCUs are typically used for very specific purposes in a confined
    space. This is basically the definition of an embedded system.


    The reason we still have CPUs is that they typically are more flexible. They often
    support modern operating systems by having an MMU Memory-Management-Unit - that
    allows the CPU to have a full-blown operating system with virtual memory and paging
    ech. Like Linux or Windows. The cost is that we need to supply the CPU with external
    memory. A CPU might, however, have some on-board peripherals and maybe a bit of
    memory as well, so the border between the definitions becomes blurred. For me,
    the MMU is the main difference between a modern CPU and a modern MCU. Onwards
    I will use the term “Core” for the inner part of a CPU or MCU - basically the
    stuff to the right of the memories in Figure 3.2.


