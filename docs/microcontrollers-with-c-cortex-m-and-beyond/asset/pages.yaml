  md: '# 3.7 STM32F334R8 Architecture


    It is time to show a concrete example of an MCU architecture. Let''s take a look
    at the STM32F334R8 MCU that we saw briefly in action in Chapter 2. We will focus
    mostly on "generic" stuff and not delve into specific peripherals. There is always
    the datasheet...


    The overall block diagram is shown in Figure 3.4. The small box in the top left
    corner is the Cortex-M4 CPU-Core from Figure 3.3. The Cortex core is the main
    Arm from^4, and ST has chosen to explicitly show the following blocks:


    +   * SW/JTAG

    The Serial-Wire/JTAG is an interface for basic debugging - like updating, single-stepping
    and using breakpoints. We have already seen it in action. It is very common.


    +   * TPU

    The Trace-Port Interface Unit is a bridge to the internal debug-hardware that
    supports low-cost debug-tracing. The chip-vendor can also select other alternatives
    to it - e.g. something supporting their specific hardware and software. Tracing
    is a functionality that allows you to set a normal breakpoint, but when the hardware
    breaks you can see a "recording" of the instructions leading up to the breakpoint.
    Typically, there is not much memory for this, but then you may be able to apply
    a "filter" and only record specific instructions - like e.g. branches or reads
    and writes to a particular variable. The TPU can run in a mode where it outputs
    data on a Serial-Wire Output - SWO to a Serial-Wire Viewer - SVM - from the Instrumentation
    Trace Macrocell - ITM. In plain English this allows you to do efficient console
    output from your program to a debugger at a relatively high speed. We try this
    in Chapter 13.


    +   * FPU

    While Cortex-M0 through Cortex-M3 cannot support FPU and Cortex-M7 always has
    an FPU - with double-precision as an option - the Cortex-M4 offers the silicon
    vendor the choice between nothing and a single-precision FPU. In the case of STM32F334,
    ST has included the latter. For the C-programmer this is a "float". We will get
    back to this in Chapter 9.


    > ^The buses outside the Core also comes from Arm'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 3.7. STM32F334R8 ARCHITECTURE


    +   * The basic Cortex-M4 Core

    This can also to a degree be specified by the silicon vendor (here ST). As an
    example, little-endian was chosen by ST in this MCU (as is the common choice in
    Arm-based designs). We see ST''s view in Figure 3.3.


    +   * NVIC

    You will not be surprised to hear that the Nested Vector Interrupt Controller
    allows the CPU to handle interrupts that interrupt lower priority interrupts -
    thus nesting interrupt service routines in each other.


    The fact that the Cortex-M4 takes little space in the diagram is not a reflection
    of its contribution to the total - neither in complexity nor in silicon space.
    It just means that the Cortex-M4 used here is pretty standard and well documented
    by Arm, so “let’s not waste too much space in the diagram”. Some parts from the
    rest of the diagram:


    # 3.7.1 Buses


    Figure 3.4 shows several buses. We will focus on the buses out of the Cortex-M4
    core, and refer to the instructions. Instead of Harvard buses to two separate
    spaces, we see three buses to the shared space:


    +   * Ibus

    The Ibus is used to fetch instructions (code). This bus can read from the range
    0x0000 0000 - 0x2000 0000. Figure 4.1 shows the memory map of the STM32F334R8.
    We see that the Ibus address range starts with the area “CODE”, Using a pin on
    the chip - “Boot0” - and a configuration bit - “nBoot1” - the designer can choose
    to “alias” either onboard Flash, SRAM or “System Memory” into this space. “Alias”
    means that it will be accessible at both the original address range and starting
    from 0.


    +   - When Boot0 is 0 we will see the 64k of Flash from address 0x0800 0000 aliased
    to address 0 and onwards. This is the normal scenario.


    +   - When Boot0 is 1 and nBoot1 is 0, we will see SRAM from address 0x2000 0000
    aliased to address 0 and onwards.


    +   - When both are 1, we will see “System Memory” mapped from address 0x1FFF
    D800 aliased to address 0 and onwards.'
