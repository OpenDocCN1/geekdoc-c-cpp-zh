  md: '# 3.5. PHYSICAL MEMORY TYPES


    Table 3.2: Physical Memory


    | Acronym | Technology | Usage |

    | - | - | - |

    | RAM | Random Access Memory | Volatile Memory |

    | SRAM | Static RAM | RAM that only needs power |

    | DRAM | Dynamic RAM | RAM that needs refreshing |

    | SDRAM | Synchronous DRAM | DRAM in synch with CPU clock |

    | DDRn | Double Data Rate | SDRAM running faster |

    | ROM | Read Only Memory Programmable ROM | “Masked” at IC-factory. Programmed
    before mounting |

    | OTP | One-Time Programmable | Programmed in-circuit once |

    | EPROM | Erasable Program | Erase with UV-light in R&D |

    | EEPROM | Electrically Erasable ROM | Typically used for settings. 1 Million+
    erasures |

    | Flash | Modern large erasable memory | Very popular for code. 10-100 k Erasures
    |


    read-errors can be handled by marking bad sectors. If the program is copied to
    RAM during boot - aka Code-Shadowing - you have a flexible system. The complex
    boot - reading a lot of Flash - slows down these types of systems. Another problem
    is that you need a lot of DRAM - which is not cheap and takes up board-space.
    The above description fits with our expectations for a large CPU-system running
    e.g., Linux.


    As in many other cases, we see new products that tend to lessen the gap between
    technologies. For this reason, you should probably focus on the basic features
    like read/write/erase time and density for the given Flash and less on the technology
    used. Still, the above can explain why a given system executes in-place or is
    using code-shadowing.'
