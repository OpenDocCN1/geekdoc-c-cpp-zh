  md: '# CHAPTER 11. OPERATING SYSTEMS


    +   - Parallel.


    Some years ago, Moore''s law has stated that performance of cores doubled every
    18 months. This was mainly done by constantly shrinking the width of the lanes
    in the ICs - meaning less current was needed to change state and thus clock-speeds
    could be raised without using more power. Unfortunately, we hit some physical
    boundaries here and clock-speeds stopped growing. The solution was multiple cores.
    We will undoubtedly see multiple cores in more systems in the future. There are
    several Cortex-A CPUs that support multiple cores. Since these CPUs include MMU
    and can run Linux, developers can leave the complex control of systems to Linux
    with its SMP - Symmetric Multi-Processing. Not so easy on Cortex-M. Perhaps this
    is why we have only seen few Heterogeneous multi-cores on Cortex-M. An example
    is the combination of a Cortex-M4 and a Cortex-M7. Such a system is very handy
    if you e.g. want to integrate an existing system running on a Cortex-M4 into a
    larger system. The IC contains multiple cores and actual parallel execution takes
    place. The control of this system is, however, manual and much as the two cores
    were running on separate chips.


    Most of this chapter is very general, but there are Arm-specific terms and concepts.
    To make it easier for vendors to support ARM MCUs, ARM has created CMSIS-RTOS
    (v2) - for Common Microcontroller Software Interface for Real-Time Operating Systems.
    This creates a common API across RTOS''es.


    Threads are used in all software domains and are by no means an Arm invention.
    Threads even have some pretty standardized states - but these states are not always
    called exactly the same. In this book I will use the state-names from CMSIS-RTOS:


    +   - Inactive

    The thread is created but it is not in use yet. Another name for this state is
    Dormant.


    +   - Ready

    The thread is ready to run - just waiting for a core to run.


    +   - Running

    The thread is running. On a single core system, only one thread can be running.
    Another name for this state is Active.'
