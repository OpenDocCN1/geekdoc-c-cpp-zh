  md: '# CHAPTER 3. AN EMBEDDED SYSTEM


    interrupt the current program-flow and take care of urgent business. Some devices
    will allow Nested Interrupts while others may not. We have nested interrupts when
    the normal flow of execution has been interrupted by an external event, and then
    another event occurs, which have higher priority, so we interrupt it. This may
    continue for several levels. As a software-developer you need to take this into
    account. Without nesting, you may experience a high Interrupt-Latency for the
    most important interrupt. Typically, we define interrupt-latency as the time it
    takes from the external event happens, until the MCU is chewing on the first instruction
    in the ISR - Interrupt Service Routine. You also need to be aware that each nested
    interrupt will cause the stack to grow further. Re-entrant interrupts would make
    the above even worse and is normally not enabled.


