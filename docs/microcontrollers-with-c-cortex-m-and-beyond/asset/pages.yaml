  md: '# CHAPTER 3. AN EMBEDDED SYSTEM


    The Arithmetic Logic Unit is the heart of the MCU. This is where normal integer
    calculations like adding and subtraction is done, but also logic operations -
    OR, AND, XOR etc. Integer multiplications and divisions are typically also performed
    here. The ALU creates the flags used for branching. This is discussed in Chapter
    7. E.g., the Zero-flag is set when the result of an operation is 0.


    +   - Control

    This contains the “sequencer” from the introduction, that handles branching in
    loops and function-calls. It is also a lot more. Modern cores have a lot of Microcode.
    This is proprietary secret low-level code. It handles internal protocols and executes
    the many built-in state-machines that decide what can and what cannot be done
    - and in which sequence.


    +   - Registers

    CPUs and MCUs always have several registers. In the old 8086 CPUs in the original
    PC, each register had specific relation to specific assembly instructions. As
    an example, the CX register had to be used as loop-counter, to facilitate a Decrement-Branch-Until
    Zero instruction. Today, instructions are typically more orthogonal. This means
    that many instructions will work with any register. Still these registers also
    have special meaning - like PC - Program Counter - and SP - Stack Pointer. As
    we will see when we look at assembly code, the Arm architectures - many others
    - are of the type Load-Store. This means that all ALU operations - like add -
    work on registers. To work on data from memory or peripherals, such data must
    first be loaded into a register. The result of an ALU operation also ends in a
    register. A new instruction is needed to store the register into memory. This
    means that a simple increment of a value in memory requires a read instruction,
    then an add instruction, and finally a write instruction. On the general level
    we call this a Read-Modify-Write operation. This is important in multithreaded
    programs, as we will discuss later. When doing function calls with a limited number
    of operands, most CPUs and MCUs will use registers for these, as this is faster
    than using the stack. In all all, this means that registers are incredibly central
    to Arm and many other CPUs and MCUs. The Cortex-M Registers are discussed in Chapter
    7.


    +   - DMA

