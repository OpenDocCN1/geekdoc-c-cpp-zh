    4.11. The variable is initialized with a recognizable pattern - e.g., 0xdeadbeef
    or 0xdeadface.

    - In a function that is executed - e.g., in an idle-loop, a schedulercore or similar
    - the variable is tested for changes. This is also shown in Listing 4.11.


