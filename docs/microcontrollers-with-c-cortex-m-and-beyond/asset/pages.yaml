    # 7.4 Exceptions


    Table 7.5 recaps the exception types. Historically, when an exception happens,
    the stack is used to save not only the old PC, but also the Program Status Register
    - PSR containing the ALU-flags (as discussed in Chapter 3). This is necessary
    as a flag might have been set for the next instruction to test. The flags are
    likely to be affected by the code in the exceptionhandler, so pushing them onto
    the stack on entry to the exception, and popping them on exit is a good solution.
    When exiting the exception it is also necessary to adjust which priority is allowed
    for new exceptions.


    The above used to mean that returning from a function call required one assembly
    instruction - RET and returning from an exception required another instruction
    - pushing the status register and adjusting the interrupt logic. The latter instruction
    was often called RETI - Return From Interrupt - IRET. In this mean that exception
    handlers had to be written in assembly code. You could wrap a C-function in an
    assembly prologue and epilog - and many have done so - but it introduces an extra
    overhead where you really don''t want.


    Arm decided that programmers should be allowed to write exceptionhandlers in C.
    This means doing some clever things in hardware - affecting the Stack-Frame as
    the stack for an exception is called.


    An interrupt (and fault exceptions) is basically an unexpected function call without
    parameters - and a bit of wrapping. In order to abide to the calling convention
