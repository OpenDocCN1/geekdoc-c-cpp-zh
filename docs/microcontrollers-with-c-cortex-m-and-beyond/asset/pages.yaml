    # 3.4 Harvard and Von Neumann


    In the previous section we touched upon the subject of buses - the address and
    data-lines that connect the memory to the CPU. This is relevant for classic CPUs
    as described above, as well as for the Core inside the MCU. Essentially, the Core
    will apply an address to the address bus. As soon as the zeros and ones on the
    address-wires are stable enough, the Core will either write or read data on the
    data bus. There is help from signals that control Read/Write as Chip Select. Chip
    Select uses the higher bits to enable only the right memory chip(s), while the
    rest of the address lines goes to the selected chip(s). This concept allows us
    to use memory chips that covers a fraction of the total address-space. Many buses
    have many signals, but they are not relevant here.


    A classic CPU like 8086 only had one set of data-lines (16-bit) and address-lines
    (20-bit). In fact, the cheaper - software compatible - 8088 multiplex the lower-byte
    address and data-lines so that the same wires first would be used for addressing,
    and then for data. This was slower, but cheaper.


    However, both 8086 and 8088 would need a lot of clock cycles to fetch an instruction,
    and then later one or even two operands from the


