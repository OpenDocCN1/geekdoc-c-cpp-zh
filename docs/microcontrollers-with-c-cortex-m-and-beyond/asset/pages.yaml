  md: '# CHAPTER 10. MEMORY PROTECTION UNIT


    embedded programming-A since day one.


    Just as the Cortex-A CPU can run Linux, Cortex-M - or other MCUs can run a small
    RTOS - Real-Time Operating System. You can use drivers in such a system to shield
    your application code from the code that is allowed to write directly to hardware.
    This is absolutely recommendable, but it is nevertheless still possible for a
    programmer to dereference the wrong pointer - in the driver well as in the application
    - and have havoc without rule, pretty much as in the bare-metal solution. This
    is why we sometimes consider RTOS-based systems as well bare-metal systems.


    One solution to this danger is to use a language without pointers - like Rust.
    However, C and C++ is still dominating the embedded world we live in. So wouldn''t
    it be nice to have some piece of hardware to help us? This is where the MPU comes
    in. ST has a description in their application note AN4838. Of the smaller Cortex-Ms
    do not contain an MPU, in the mid-range they are optional, with the bigger Cortex-Ms
    always come with MPUs. Please see Tables 7.1 and 7.2.


    With an MPU you can define a small number of Regions. Cortex-M4 optionally has
    an MPU, which can allow for eight regions - plus a background region. Cortex-M7
    has the same MPU - with 8 or 16 regions. A region defines a memory range and which
    type of accesses are legal for the given range. We can define the Memory Type
    as Normal, Device or Strongly Ordered. We, or No-Access also access as RO - Read-Only,
    RW - Read-Write, and we can set the XN - Execute Never flag for a region. These
    definitions can be set for respectively Privileged and Non-Privileged mode - see
    Chapter 7. We saw these attributes when we discussed the Memory Map in Chapter
    4. Finally, we can set the cache policy for MCUs that have cache-support, and
    we can select whether the MPU is active during a Hard Fault. It might not be practical
    to trigger an MPU-exception, unless you are already in a hard fault. The base
    address of a region must match its length - e.g. a 32 KB region must start on
    an address that modulo 32k is zero.


    The small number of regions can be “stretched” by the use of subregions. By definition
    each region larger than 256 bytes is created with eight equally-sized, sub-regions.
    These subregions may individually be disabled using the SRD-file - Subregion-Disable.


    Regions can overlap. When that happens, it is the region with the highest number
    that “wins”. In the number-scheme, the background region has number -1, and thus
    yields to all other regions. The background region is configured as the default
