- img_proc: true
  md: 'I hope to certain this will give you a deeper understanding that you can take
    with you as new generations of boards and microcontrollers appear on the market.
    Thus, I consider this book to be more of an informal text-book, rather than a
    manual to any specific board.


    An important aim of this book is to use free tools - just like in another earlier
    book "SQL-Server with C# This means using the open-source GNU toolchain - compiler,
    linker and debugger - as well as various helper-tools. It is also possible to
    find free IDEs - Integrated Development Environments and libraries from some silicon
    vendors. Other vendors do not offer completely free tools. Instead, they offer
    limited versions that e.g. only handle memory to a certain size - or time-limited
    versions. Finally, we have the very popular Visual Studio Code, working on all
    platforms (Windows-, Linux and Mac) - also free. The hardware boards are typically
    very inexpensive. I even found one freely at various trade-fairs before Covid
    changed the basement-collection that I was the world for a time. I saw the SW-tools
    from ST are free and unlimited, I decided to use these in most examples. As can
    be seen in Chapter 2, this led me to buy a low-cost Nucleo-64 board - also from
    ST. The Nucleo boards share many features as well as pinpoint, and if you would
    like to code-along, any Nucleo-64 board will do.


    After covering the basic embedded system, we will look into Parallel Design Patterns,
    and how they are supported in the modern SoCs, that we are investigating. We will
    also look at the support in C - either built-in, or added via intrinsic functions.


    You will find that much of the content of this book is generic to almost any microcontroller
    - sometimes even to all programming. However, as stated we will be looking mostly
    at Cortex-M. Many examples are formed on a Cortex M4 - simply because this is
    big enough to contain architectural building blocks like Floating-Point Unit,
    Memory Protection Unit and DSP. It is also used in countless designs. I will,
    however, discuss similarities to - and differences from - other Cortex-M microcontrollers.


    Along the way I take advantage of my many years in the embedded universe. I will
    draw parallels to older CPUs and MCUs. From my teaching days I know that anecdotes
    from "real life" makes it easier to remember the theory. Understanding a bit of
    the history also makes it easier to understand how things work today.'
