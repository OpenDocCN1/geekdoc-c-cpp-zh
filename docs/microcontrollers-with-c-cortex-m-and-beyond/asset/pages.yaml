  md: '84


    # CHAPTER 6. TOOLCHAINS AND IDES


    +   * sp

    This means Single Precision - what C-programmers know as "float". Where Cortex-M4
    offers the choice between nothing and single precision, Cortex-M7 offers the choice
    between single and double precision. Cortex-M0, M0+ and M3 does not offer FPU
    at all.


    +   * d16

    This means 16 64-bit (double precision) FPU-registers. This makes little sense
    when you have only single precision, but they also serve as 32 32-bit (single
    precision) registers.


    That was the hardware. Now we need to specify the software. What we need to specify
    is the calling convention. This is part of the ABI Application Binary Interface.
    We need to assure that caller andlee agree on the use of registers - also when
    calling libraries. In the Blinky sample we had "-float-abi=hard". The -float-abi
    option can have one of three values. Here I have quoted Segger (vendor of debuggers
    etc.):


    +   * soft

    Full software floating-point. The compiler will not generate any FPU instructions
    and the -mfpu= option is ignored. Function calls are generated by passing floating-point
    arguments in integer registers,


    +   * softfp

    Hardware floating-point using the soft floating-point ABI. The compiler will generate
    FPU instructions according to the -mfpu= option. Function calls are generated
    by passing floating-point arguments in integer registers. This means soft and
    softfp may be intermixed.


    +   * hard

    Full hardware floating-point. The compiler will generate FPU instructions according
    to the -mfpu= option. Function calls are generated by passing floating-point arguments
    in FPU registers. This means hard and softfp cannot be intermixed; neither can
    hard and soft.


    If you select "hard" you need to assure that all libraries and libraries are compiled
    with this "softfp" sounds alluring. Many libraries come in a hard and a soft version.
    However, these calls will clear the pipeline, and then you will lose some momentum
    here.


    Finally, if you want to take advantage of the single-precision FPU, you need to
    take care. Normal math functions work with double-precision. Instead of sin()
    and sqrt() you will need to use sinf() and sqrtf() in your code. You append "f"
    for "float" to all the usual names. Also remember'
