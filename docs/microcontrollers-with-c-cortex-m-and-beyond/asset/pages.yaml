  md: '# CHAPTER 2. THE TIP OF THE ICEBERG


    to employ. The embedded platform choices are larger in numbers well as in consequences.
    There are numerous CPU-cores, in countless boards. A given Cortex-M in many derives,
    with and without specific building blocks. The silicon vendor has added peripherals
    inside the chip (yes - we still call them peripherals), that you may need to support,
    and the hardware team may have added more outside the chip. You probably want
    this support to continue to work - also if you later upgrade the microcontroller.


    On this top, at least someone in an embedded project needs to think about what
    happens before the first line in main(). How do we build? How is the memory organized?
    - and how do we guard against memory-overwrites and similar failures? How do we
    get debug printout? - and what about floating-point support? I don''t think many
    PC programmers have studied linker maps or compiler options, but in an embedded
    project this is crucial. In this chapter we are starting with the tip of the iceberg
    - Hello World - and we will spend the next couple of chapters looking under the
    surface of this iceberg.


    It turns out that the Hello-World program of embedded boards is "Blinky". This
    is a simple main-program with an endless loop that toggles an LED. Some timer
    interrupt is involved - sometimes not.


    I bought one ST''s smallest Nucle-64 boards - STM32F334R8. The board is not new,
    and only costs $10. It is very small, but it does contain a Cortex-M4 which has
    (almost) all the “grow-up” features we need to get started. Some important features
    for this book are the DSP-commands and the Single-Precision FPU - Floating-Point
    Unit. We will get back to these. For the first chapters the actual board is not
    so important - we just need to build for it. However, just to show how to get
    started I also flash the sample and start the debugger.


    Like other development-boards, STM32F334R8 has the on-board circuits that allow
    us to connect directly to the USB of a PC - without an extra debugger-box on the
    wire. We would normally not have this in “real-life”, because we want to save
    the cost and the board-space when the device goes into mass-production. It is
    however, really nice in our situation. See Figure 2.1.


    I installed the fully-functional STM32CubeIDE free of charge (you do need to register)
    from ST''s website and fired it up. The initial configuration editor - STM32CubeMX
    - allowed me to select my STM32F334R8 board. I simply accepted the default configuration
    of pins, clocks, enabled peripherals etc. In Chapter 13 we dig deeper into STM32CubeMX'
