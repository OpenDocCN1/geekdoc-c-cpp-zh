  md: '8.4. CMSIS-DRIVER HIGH-LEVEL


    # 8.4 CMSIS-Driver High-Level


    Vendors tend to call their upper parts of CMSIS-Driver for “HAL”. Here we have
    the longer functions that are generically structured according to user-needs -
    rather than building blocks. I have chosen to show only a part of a single function
    - the HAL_GPIO_Init in Listing 8.6. It was necessary to skip parts of the function
    and print in small font to fit it into a single page. This is very representative
    for the HAL functions - in length as well as functionality. We will meet this
    particular function in Chapter 13. It is used to set up a GPIO-pin - no matter
    whether it is analog, output or input - used for external interrupts. I skipped
    the parts that are not relevant for interrupts, as that is what we use.

    When a GPIO is to be used, we need to do several things. Just like we have an
    SCB-struct with many related registers, we also have EXT-block for external interrupts.
    This has several registers that we need to manipulate. In our MCU, GPIO-lines
    go via “multiplexers”. In the first layer, bit 0 from all Ports, and we can select
    one of these. Likewise, all Ports’ bit 1 to go another multiplexer and so on.
    Bits 10-15 however, all go to the same multiplexer. To enable interrupts from
    Port-C, bit 13 - aka “PC13”, which is connected to the Blue Button on the STM32F334RTX
    box, we need to do the following:


    +   - Turn on the peripheral clock.


    +   - Set the three lowest bits in SYCFG->EXTICR[3] to the bit pattern 010 to
    activate the right multiplexer.


    +   - Set bit 13 in the Interrupt Mode register.


    +   - Set not anything in EXT->EMR - Event Mask Register - because interrupt is
    not the same as an event.


    +   - Configure interrupts to happen on the falling flank by setting bit 13 in
    EXTI->FTSR1.


    +   - Alternatively configure interrupts to happen on the rising flank by setting
    bit 13 in EXTI->RTSR1.


    All the above can be read in “RM0364” - the reference manual for STM32F334xx boards.
    On the other hand - you can simply use the function partly shown in Listing 8.6.'
