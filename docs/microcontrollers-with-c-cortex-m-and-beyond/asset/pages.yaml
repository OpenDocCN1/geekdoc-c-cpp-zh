    # 12.8 Dynamic Memory


    If you can base your embedded system solely on pre-allocated - aka static memory,
    as discussed in Chapter 4, then you have a great start on a very deterministic
    system. In the embedded world we use the word “deterministic” which we interpret
    as predictable. There are many scenarios where devices are transferring data,
    and all you may need at the lower level is buffers taking turns on being filled
    and emptied. This is called Buffer-Switching and is normal on statically allocated
    buffers. Extending this concept from 2 to N buffers gives us the Ring-Buffer,
    which we see in Section 12.7. In Section 12.6 we met the message-based system.
    In FreeRTOS, messages are copied into the pre-allocated queue memory. This is
    great for small messages, and by allowing data to pointers to be shared memory
    it also supports the use of dynamic memory. Other message-based systems only support
    pointers. You may also be using libraries that are written for systems with dynamic
    memory - expecting to be able to allocate or release data. It may not be possible
    to statically allocate memory for these cases.


    The classic embedded solution is to use Pooled Allocation. A set of pools are
    created. Each pool is a memory area that holds a number of buffers of a given
    size. There could e.g., 13 buffers of size 8, 8 buffers of size 16, 5 buffers
    of size 32 etc. There is a bit of administration also - typically each buffer
    has a small admin port. In the admin area system registers which task or mailbox
    currently owns the buffer - or the admin area is used


    > ⁵This could happen at some platforms and a Mutex may be needed'
