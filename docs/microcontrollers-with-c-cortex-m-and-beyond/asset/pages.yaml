- img_proc: true
  md: '# 3.7. STM32F334R8 ARCHITECTURE


    +   - Temp Sensor

    Note the gray "Temperature Sensor" area behind the ADCs as well as the opamp.
    This is the area where the built-in temperature sensor is mounted. During production
    a calibration-curve is measured and stored in the chip. Application programs may
    read the temperature and lookup in these tables to get more exact conversions.


    +   - DACs

    We have two 12-bit Digit-To-Analog Converters - DACs. These can also be run in
    stereo.


    +   - Comparators

    These can sense when an analog voltage passes a preprogrammed threshold and generate
    an interrupt. With the help of a Bandgap reference voltage - shared with the ADCs
    - the comparators are very accurate.


    Both ADCs and DACs can be interfaced via DMA - Direct Memory Access. This means
    that the CPU will not need to read/write each sample and saves a lot of CPU-time.
    It also means that we have looser real-time requirements, we don''t need to service
    an interrupt for every sample. Instead, we have hardware buffers for the A/D and
    D/A that are serviced by DMA - giving us only a fraction of the interrupts we
    otherwise would have had.


    # 3.7.3 Digital Interfaces


    We have a nice arsenal of digital interfaces:


    +   - SPI

    The Serial Peripheral Interface is a classic digital interface for relatively
    fast on-board communication with external peripherals. Typically, the Core is
    master and several slaves, although it is very common to use one SPI-bus for peer-to-peer
    communication. Almost any modern MCU will have SPI-support. In this case it supports
    many modes, speeds and data-widths as well as DMA. An SPI-bus e.g., could be used
    for a Wi-Fi module.


    +   - I2C

    The Inter-Integrated Circuit bus is like SPI used for on-board communication.
    It is not as fast as SPI, but it is more common to have multiple slaves. Typical
    peripherals are: Serial EEPROM (for configuration-data), keyboard, small text
    LCD-display etc.'
