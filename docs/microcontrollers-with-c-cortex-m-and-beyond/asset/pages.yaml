    Recursive functions are sometimes popular in data-processing on e.g, PCs, but
    embedded software-developers rarely use the concept, since each recursion adds
    a new function to the stack. We typically want better control of the stack, and
    therefore tend to write code using loops instead. Nevertheless, a single-threaded,
