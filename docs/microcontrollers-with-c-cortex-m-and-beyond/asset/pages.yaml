  md: '# CHAPTER 7. CORTEX-M PROGRAMMERS MODEL


    +   2. Use e.g. SCB->CCR &= ~SCB_CCR_UNALIGN_TRP_Msk to disable the unaligned
    interrupt. The use of the SCB struct is explained in Chapter 8.


    +   3. Enable the user-fault exception, catch the unaligned trap and fix in software.
    I don''t consider this a very viable option though.


    I tested the first two alternatives and they worked nicely. In the end I realized
    that the trap for unaligned access is normally disabled, but had been enabled
    by a simple checkbox in the "Startup" tab of the "Debug Configurations" dialog.
    You may want to enable this trap if you generate code that is also used on e.g
    Cortex-M0. The listing below shows how to enable/disable the unaligned trap -
    and a test that generates an exception when the trap is enabled.


    ```

    // SCB->CCR &= ~SCB_CCR_UNALIGN_TRP_Msk; // Disable unaligned trap

    SCB->CCR |= SCB_CCR_UNALIGN_TRF_Msk; // Enable unaligned trap


    uint32_t *myArray[2] = (0);

    uint32_t *myPtr = myArray;


    myPtr = (uint32_t*) (char*)myPtr+2);

    *myPtr = 0x12345678; // Trap!

    ```


    Note that even I thought that Cortex-M3 and upwards do handle unaligned accesses,
    this is only correct for the simple cases of single word or half-word accesses.
    You will still get an exception for multi-word accesses or load-and-store-exclusive
    on unaligned addresses. Similarly, accesses to strongly ordered peripherals must
    be properly aligned. The compiler will not generate any such things - with or
    without the option stated above.'
