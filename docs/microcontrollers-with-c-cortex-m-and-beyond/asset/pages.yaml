    # 11.3 Storing and Retrieving State


    We saw in Section 7.4 how the Cortex-M stack-frame - the stack content at an exception
    - is created. From the top of the stack we have R0-R3, R12, old LR (R14), PC (R15)
    and xPSR. When the OS needs to perform a Context-switch it can extend this stack-frame.
    A context-switch is not a function call - we need to assure that the remaining
    registers are saved on the stack. This means R4-R11 and LR (it is the threads''s
    old version we already have on the stack). The SP is R13 and is stored in the
    TCB. Before the above, the OS however needs to use the right stack - and this
    knowledge must also be saved in the TCB. Note that the stackframe is stored on
    the stack used before the exception occurred. If we are in Handler mode - thus
