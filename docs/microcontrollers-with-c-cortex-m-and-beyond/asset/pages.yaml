  md: '# CHAPTER 9. FLOATING-POINT UNIT & DSP


    # 9.3 Fixed-Point


    In the beginning of this chapter I talked about CMSIS-DSP having algorithms based
    on integers as well as floating-point. People working within signal processing
    are used to getting more for their money if they work with integers. These are
    the main reasons:


    +   * Cost

    A DSP without floating-point support is cheaper than one with. We just saw how
    the software version of floating-point is. A DSP cannot live with that. Integers
    are the alternative.


    +   * Battery lifetime

    Circuits for integer math are simpler than for floating-point. This means less
    power - longer battery lifetime if batteries are used.


    +   * Accuracy

    A 32-bit integer allows higher precision than a float which also takes up 32 bits.
    A float has a larger dynamic range due to the 8-exponent - yes - but 8 bits less
    for the precision.


    Floating-point is “emulated” in integers by having an implicit decimal point -
    or - binary point. We just have to agree where the binary point is. Typically,
    it is just right to the sign bit - we basically always use signed numbers in DSP.
    A decimal number like xy.z is defined as $x*10^{1}+y*+z*10^{-1}$ in our Base-10
    system. In the same way the binary signed (positive) 0101 is $1*2^{2}+0*2^{1}+1*2^{0}$
    in the Base-2 system. If we choose to have an implicit point after the sign bit,
    we will interpret 0101 as 1*2^{-1}+0*2^{-2}+1*2^{-3}$. In other words, the binary
    0.10100000 with the implicit point explicitly after the sign bit, is the same
    as 1/2 + 0/4 + 1/8 + 0/16 + 0/32 ... 0.625. It is often easier to convert integer
    first, and then divide by $2^{2}$ in a byte (and $2^{31}$ for a word). In this
    case (16/64) = 0.625.


    Since the leftmost bit is the sign bit, we can say that there are 0 integer bits
    and 7 fraction. Texas Instruments invented a notation that is called q7. Similarly,
    we have q15 in 16 bits (half-word) and q31 in 32 bits (word). Alternatively, we
    also include the integer-part - including the sign in the notation. This notation
    is often used by Arm, and I think it makes more sense. Here above would be called
    1.7 (byte), 1.15 (half-word) and 1.31 (word).'
