  md: "# 7.6. ALIGNMENT\n\n# 7.6.2 Structs\n\nC-structs are used everywhere and deserve\
    \ some attention. Take the following simple struct:\n\n```\nstruct MyStruct\n\
    {\n  char enable;\n  int offset;\n  char mode;\n  short vers;\n  char flag;\n\
    \  instMyStruct;\n```\n\nOn a 32-bit system like a Cortex-M, this struct seems\
    \ to occupy 9 bytes (1+4+1+2). There is however, a good deal of padding involved.\
    \ The struct in reality looks like this - with address offsets included:\n\n```\n\
    struct MyRealStruct\n{\n0: char enable;\n1: byte pad1;\n2: byte pad2;\n3: byte\
    \ pad3;\n4: int offset;\n8: char mode;\n9: byte pad4;\n10: short vers;\n12: char\
    \ flag;\n13: byte pad5;\n14: byte pad6;\n15: byte pad7;\n16:} instMyRealStruct;\n\
    ```\n\nThe first three paddings are needed to assure that the int \"offset\" lands\
    \ on a 4-byte boundary. Pad4 is needed to assure that the short \"vers\" ends\
    \ on a 2-byte boundary. Finally, the next three paddings are there to assure that\
    \ the struct is used in an array, the next element will land on a 4-byte boundary\
    \ - as the first element will. Thus, in reality the simple struct does not occupy\
    \ 9, but 16 bytes.\n\nWe can arrange for data to be packed - like in the following:\n\
    \n```\n#pragma pack(push,1)\nstruct MyPackedStruct\n{\n0: char enable;\n1: int\
    \ offset;\n5: char mode;\n6: short vers;\n8: char flag;\n9:) instMyPackedStruct;\n\
    #pragma pack(pop)\n```"
