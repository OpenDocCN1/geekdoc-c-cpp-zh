  md: 'programmers use all the new facilities and instructions, new h-files were created.
    These may support “Neon” or “Helium” or SIMD-instructions. More importantly, CMSIS-DSP
    also includes math-libraries that utilize floating-point and basic integer algorithms.
    We will meet these in Chapter 9.


    +   - CMSIS-NN

    This is support for Neural Networks, which is out of the scope for this book.


    +   - CMSIS-RTOS v1 and CMSIS-RTOS v2

    This is the interface to third party real-time operating systems. As can be expected,
    v2 is simply a newer version of CMSIS-RTOS v1. We deal with this in Chapter 13.


    +   - CMSIS-SVD

    This category contains the System Descriptions that are used by debuggers to present
    information. As a developer you typically not bother with this - as long as the
    names and values presented in the debugger UI match the documentation.


    +   - CMSIS-DAP

    This relates to the Coresight Debug Access Port. It controls JTAG and Serial-Wire
    Viewer. We see a subset of this in Chapter 13.


    +   - CMSIS-Zone

    This is definitions related to the Zone-concept introduced with Cortex-M33. This
    is out of the scope for this book.


    +   - CMSIS-Toolbox

    This is about building projects from the command-line. The toolbox can be found
    on GitHub.


    +   - CMSIS-Pack

    This is vendor tools for building the packs that we use as developers.


    Another way to show the various parts of CMSIS, is to map them to the hardware
    block-diagram - see Figure 8.1. This mapping may not be 100 % precise, but it
    may help you get an overview. Table 8.1 shows a few named files as well as the
    CMSIS-category they belong to, and their content. In the following I will present
    snippets of code from some of the files named in Table 8.1. This will give a better
    understanding of what goes where. It might also serve as general inspiration.'
