    # 12.6 Message-Based System


    In a multitask it is typically necessary to communicate more than simple flags
    between tasks. It is possible to communicate through shared memory, but message-based
    communication is becoming more and more common. One task creates a message and
    puts the message in a queue belonging to another task.


    In a virtual-memory system with real processes, this is complex, but easy to use.
    A buffer is allocated by the OS on request from the sending task. The sending
    task fills the buffer and hands back to the OS as a message to be sent to another
    task. The OS may now copy the content to memory belonging to the other task. This
    assures secure walls between the processes. Each can only read data belonging
    to itself - even the original empty buffer cannot contain traces of earlier communication
    from another task. The OS is also responsible for unblocking the receiving process,
    if it is blocked, waiting for instructions for the mailbox. Copying data is


