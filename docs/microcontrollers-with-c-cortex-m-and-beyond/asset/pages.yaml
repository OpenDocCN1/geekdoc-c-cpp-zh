  md: '# 9.1. WORKING IN FLOATING-POINT


    The project must be set up in “Properties-C/C++ Build Settings-MCU Settings” to
    use the Single-Precision FPU available with the Hardware implementation of the
    Floating-Point ABI. See Figure 9.1. It is we later change from “FP4-SP-D16” to
    “None” - and to the Software ABI. Note the small checkmark, lending us support
    for float in printf. We also need to optimize for speed. This is done in “Properties-C/C++
    Build Settings-Optimization” - also visible in the tree in Figure 9.1.


    +   - Timing

    We can measure time in microseconds - or in cycles. If chose cycles because this
    is independent of the core-frequency - and thus more relevant in comparisons.
    Measuring cycles only requires-declarations from core_cm4.h - described in Chapter
    8.


    Apart trying trying ways to do calculations, I also wanted to use the CCMRAM that
    the small Nucleo-64 board has. CCMRAM may be used for data - or for code. It was
    clear that setting the CCMRAM up to hold data would be the simplest task, so I
    decided to start with that. My question: “How does performance improve if CCMRAM
    is used to hold the sine?” On one hand I expected access to this RAM to be faster
    than the normal RAM - while the other hand I knew that the CCMRAM is placed in
    the code region. This might create a bottleneck when fetching data and code from
    the same region. To allocate mysignal in the section that ends up in CCMRAM, gcc
    requires an attribute - this may vary with the compiler used. The declaration.
    Looking at the “Build Analyzer” under “Memory Details” I found mysignal in both
    CCMRAM and Flash. I remembered the linker-script that Listing 9.2 shows script
    that by default elects CCMRAM to be used for code, and in the script I changed
    CCMRAM > FLASH to CCMRAM.


    It turned out that using CCMRAM instead of normal RAM changed absolutely nothing
    in this scenario. I kept this setting as it perfectly consumed my CCMRAM area
    - leaving more RAM for the rest. When I ran the program in Listing 9.2, I got
    the following output:


    | Sine Generation took 323158 Cycles |

    | Measured Power (f32): 0.416187, True Power:0.416187 Took 9239 Cycles |'
