    privileged. The SVC can now do the things that the program could not. This is
    what in older Arm - and many other - CPUs is called a Software Interrupt. In other
    systems a supervisor call may be called a Software Trap. I clearly remember one
    of the first systems I programmed professionally - a Digital PDP11 - having Trap
    instructions, the concept is old and proven. The term "Trap" is commonly used
    for fault-exceptions (see below).


    As stated, the SVC handles the change from unprivileged mode to the OS. The SVC
    however, also ensures a very nice Loose Coupling to the OS. As OS and application
    do not necessarily need to be linked-gether. Thus, the bare minimum shared knowledge
    between OS and application is an enum declaration for the SVC parameter. The SVC
    handler can choose to read this integer-parameter from the stack - thus perform
    different services. The simplest service is as described above - and hinted in
    Figure 7.1 - where a driver executes the privileged work and returns to where
    it came from. Basically a function call with improved privileges is however also
    possible to do more advanced stuff. We discuss this in Chapter 11.


    Since the SVC-exception is triggered by a call, we say that it is synchronous.
    It happens in the thread of execution where we want it to happen. There are other
    exceptions like the SVC are synchronous although not always as welcome as the
    SVC. An example is MemManage Fault that, e.g., may occur if the program attempts
    to execute of an address-space marked as "XN" - "Execute Never". If you divide
    by zero you will run into a Usage Fault. There are more examples of synchronous
    exceptions. We will discuss SVCs more in Chapter 11.


    Contrary to the above, an Interrupt is an asynchronous exception generated by
    a peripheral - internal or external. It is asynchronous because it'
