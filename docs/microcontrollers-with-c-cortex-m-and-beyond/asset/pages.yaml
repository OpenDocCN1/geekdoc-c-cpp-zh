  md: '# CHAPTER 3. AN EMBEDDED SYSTEM


    When we talk about internal peripherals and GPIO connecting to the outer world,
    it is extremely important to be aware of the microcontrollers pin-multiplexing.
    There always seem to be an abundance of pins in the datasheet that you can use
    from the various peripherals. However, when you look closer, you see that all
    “logic” pins share a much smaller number of “physical” pins. A part of the initialization
    is to select which functionality to connect to the outer world. This is multiplexing
    and it obviously limits your choices. Note that the microcontroller you are interested
    in may come in different packages. This can limit the pin-count and thereby make
    your choices even harder. Multiplexing is a fact with all microcontrollers - although
    some give you more flexibility than others.


