  md: '# Chapter 8


    # CMSIS & HAL


    # 8.1 Overview of CMSIS


    CMSIS stands for “Common Microcontroller Software Interface Standard”. It is an
    Arm concept and therefore only common for Arm products.


    Based on origin and usage, CMSIS is grouped into sub-categories. The structure
    can sometimes be a bit unclear - partly because it targets users as well as silicon
    vendors - partly because the term HAL - Hardware Abstraction Layer is overused.
    “HAL” originates in the domain of bigger CPUs with paged virtual memory. In these
    CPUs there is no way - ever - a user program can access hardware directly. All
    hardware is accessed via OS drivers. In our microcontroller HAL is vaguely related
    to the above. I see the following abstraction levels in the hardware support:


    +   * Register Definitions

    At the very bottom - just above the hardware - we have h-files defining the addresses
    of hardware-registers, as well as macros with masks for setting and clearing various
    bit-positions. Performance- and architecture-wise using this is not different
    from using absolute addresses and hex-values when accessing registers. It is much
    easier, less error-prone and more maintainable. The h-files typically contain
    C-structs for accessing register-groups that belong to specific internal peripherals.
    The C-structs may include bit-fields (which can affect performance) and enums
    when this makes sense. The fact that modern editors have intellisense is a big
    help here. Clearly these basic files are structured one-to-one as the hardware
    is. We saw a few samples of register accesses based on C-structs in Listing 7.1
    in Chapter 7.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '120


    CHAPTER 8. CMSIS & HAL


    +   * Access Functions

    Using a mixture of c- and h-files, a small layer of access functions are defined.
    These are often defined as macros - and therefore found in h-files - because they
    may be used from interrupts and other critical places where a function call with
    lower performance is unacceptable. These functions are typically very short, and
    they too follow the structure of the hardware. There is no RTOS-awareness at this
    level. These files are often prefixed with "LL" for "Low-Level".


    +   * Drivers

    On top of the access layer we see something most vendors call "Drivers". Where
    the lower layers are structured according to the peripherals and their registers,
    these drivers are structured according to the functionality an application developer
    is expected to need. By using the lower-level access-functions it is possible
    for a device-family driver to work on specific devices. These drivers can cooperate
    with an RTOS - e.g., using callbacks and you can choose whether you want to poll,
    use interrupts or even DMA. The downside of generic drivers is that they may use
    more codespace and CPU-cycles than a simpler implementation - less flexibility.
    In many cases you can save a lot of development time using these drivers in critical
    places, and use your energy where it matters most. You might e.g., write your
    own interrupt services, but subscribe to a vendor''s initialization functions.


    +   * Middleware

    On top of the drivers we see hardware-independent software like USB- or TCP/IP-stack,
    zero-copy message system or SQLite database. In larger CPU-systems, middleware
    tends to be swallowed by the OS.


    +   * Application

    Here we have our software. It can work through drivers - with or without an RTOS
    - or may be a "bare-metal" implementation that only use the two bottom layers
    - or maybe even the low-level access-functions. You can also use the vendor supplied
    drivers as inspiration.


    In different contexts I have seen everything below the middleware termed "HAL".
    Armed with a bit of terminology we can now take a look at CMSIS.'
