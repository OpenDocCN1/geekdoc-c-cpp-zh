  md: '# CHAPTER 4. MEMORY AND THE LINKER


    Listing 4.1: Bit-band Macro


    | 1 | #define BB_OFFSET (0x02000000) |

    | 2 | #define BITBAND_ADDR(addr, bit) (( (addr & 0xFF000000) + BB_OFFSET + ((addr
    & 0xFFFFFF) << 5) + (bit << 2) )) |


    address is 0 256 MB. Given these assumptions, line 2 does three things:


    +   1. (addr & 0XF000000) + BB_OFFSET

    This part finds the base of the alias region.


    +   2. ((addr & 0xFF) << 5)

    This part finds the offset to add for the word contribution - basically multiplying
    the offset from the base with 32 because each word in the alias covers 32 words
    in the target.


    +   3. (bit << 2)

    This multiply by 4 gives us the address offset caused by the bit position we want
    to set or clear. It might seem a bit counter-intuitive that we only multiply by
    four - not 32. This comes from the fact that we address by bytes - with each word
    containing four bytes. Thus the macro works no matter whether you address the
    target as whole words - with bits from 0 to 31 - or bytes with bits from 0 to
    7. In the end it will write to a nicely-aligned word in the alias region.


    It straightforward to see how bit-banding can help write to the right register-bit
    without affecting a parallel thread or interrupt routine that works on another
    thread in the same byte or word. But how bit-banding help you create a Mutex³


    The concept here that each thread has resource, including interrupt routines),
    wanting to access a given resource, has its own bit in a shared word in memory.
    When a thread wants to access the resource, it first reads the shared word if
    another thread has already taken the Mutex. If it is not the case, it sets its
    own bit - via the bit-banding hardware-locked read-modify-write. Now the thread
    reads the full word again. If another clears our bit and backs out. It will retry
    again after some time. The beauty here is that the above procedure can be done
    in perfectly normal C.


    > ³We will go deeper into the subject of Mutex’es in Chapter 12'
