  md: '# Chapter 7


    # Cortex-M Programmers Model


    The “programmers model” deals with processor modes, exceptions, registers and
    instructions. These subjects have an impact when it comes to how you write your
    software - and to which degree it can be reused on other MCUs. We have already
    seen several related architectural concepts and patterns in operation, and there
    are a few more to come. When reading this chapter, you might want to go back to
    recap a subject or jump ahead to learn more about FPU or MPU. The following is
    a quick list of them related subjects - there is also the book’s Contents and
    Index.


    +   - Chapter 3: Overall Embedded System Architecture - Von Neumann and Harvard
    busses, Physical memory types and interfaces. First glance at the Cortex A-RM
    profiles. Load and Store architecture.


    +   - Chapter 4: Memory Model - Regions and access rights. Bit-Banding and relations
    to the linker.


    +   - Chapter 5: Reset Vector and Startup concept - with a bit of assembly code
    and registers.


    +   - Chapter 6: Compiler and linker flags.


    +   - Chapter 9: Floating-Point Unit.


    +   - Chapter 10: Memory Protection Unit.


    # 7.1 History of Cortex-M


    For many years Arm have a growing - but backwards compatible - instruction set.
    This was also called Arm. All instructions in the Arm instruction-set were 32-bit
    wide. Especially for the cost-sensitive microcontrollers,'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# CHAPTER 7. CORTEX-M PROGRAMMERS MODEL


    there was a wish to use less memory on code. This led to the birth of the very
    condensed, 16-bit Thumb instruction set. Note that this 16-bit instruction set
    is used in the 32-bit architectures, which may seem a bit odd. There is however
    no law of nature stating that a 32-bit processor must have a 32-bit instruction
    word. When fetching code from the Code region, the hardware will in any case prefetches
    from Flash, and some Cortex-Ms - have caches. This means that the core will need
    a buffer of instructions that are likely to be used in the near future. Smaller
    instruction-width simply means more instructions in the buffer - or less space
    needed for the buffer.


    The Thumb-instructions were not always flexible and powerful, and backward compatibility
    was still required. CPUs and MCUs were created with the ability to switch between
    the condensed - like Thumb Mode and the more advanced Arm Mode. Compilers were
    to go back and forth between these modes, while programmers preferred the Arm
    instruction set when coding in assembly-language. Cortex A-R-M profiles were introduced
    in the generation called Armv7. Arm Cortex R and A still have the ability to go
    back and forth between Arm and Thumb instruction sets. However, to keep the complexity
    and price down on Cortex-M, created the Thumb2 instruction set as the only one
    for Cortex-M. Maybe Arm also has information stating that Cortex-A will always
    be programmed in C/C++ and Cortex-R tends to be Model-Driven with auto-generated
    code, while Cortex-M will still to some degree be hard-coded in assembly-language.
    Assembly-programmers probably do not enjoy shifting back and forth between instruction-sets.


    Thumb2 is in a way “middle-of-the-road” between the Arm and original Thumb instruction
    sets. With Thumb2, Cortex-M can have a mix of 16 and 32 bit wide instructions
    without the above mode switches. Instructions are not necessarily aligned on a
    32-bit boundary (but always on a 16-bit boundary). We saw features of Thumb2 in
    Chapter 5. Having instructions of different length is far from a new invention.
    Classic CISC - Complex Instruction Set Computer - always have instructions of
    one, two or maybe three word-widths interleaved.


    Although Cortex-M MCUs support Thumb2, few support the full set of instructions.
    The bigger variants support the same instructions as the smaller ones - and more.
    e.g. multiplying thirty-bit numbers to obtain a 64-bit number is not supported
    in hardware on all variants. The optional DSP and FPU components also bring many
    new instructions into the game. Finally, we have the Trustzone instructions that
    are only possible with the double-digit Cortex-M versions (Armv8 based). Note
    that instructions'
