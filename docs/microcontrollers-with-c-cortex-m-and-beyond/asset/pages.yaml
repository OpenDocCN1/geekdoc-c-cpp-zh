  md: '# 96 CHAPTER 7. CORTEX-M PROGRAMMERS MODEL


    can occur at any time - related to the software. We do have some control

    - we might have started a timer that will interrupt when it counts down

    to 0 - but we don''t know which instruction we will be executing when

    the interrupt occurs. In the same way we may have started a DMA that

    tfers data from an A/D-converter to a buffer in the core, but we do not

    know when we will get an interrupt, due to this buffer being e.g. half full.


    When any exception occurs, the core will change to Handler-Mode and

    execute the relevant handler. The address of this handler is found in the

    vector-table starting at address 0. See Figure 7.2. You may remember

    from Chapter 5, the first entry is the Stack pointer for the reader. After this

    from address 4 - we have only handler addresses. On address 4 we have

    the reset handler, and on address 0x2C we have the SVCCall.


    The vector table contains addresses for a lot of exception handlers.

    Those handle interrupts are also known as ISRs - Interrupt Service

    Routines. Sometimes we forget to talk about "exceptions" and "exception-

    handlers", and simply talk about "interrupts" and "interrupt-handlers"

    - even interrupts strictly speaking are a subset of exceptions. To

    get from the exception number to the handler address you only have to

    multiply by 4. In some scenarios Use IRQ-numbers - they are offset

    to 16 from the Exception numbers as also be seen in Figure 7.2. Some

    exceptions have priorities, while others can be configured. The

    negative IRQ numbers are defined by Arm for all Cortex-M4s while the

    rest are defined by the silicon-vendor.


    So what are the privileges of privileged mode? We have seen the Stack-

    Pointer in action in Chapter 5. If fact - this was the Main Stack-pointer

    M - which is always used in privileged mode. There is also a Process

    Stack-pointer - PSP. An OS will use the MSP for itself, but give its tasks

    to the PSP - after letting it point to the stack-area designated by the

    OS for the given task. To the code it is always SP or R13, a privileged

    program can choose to alias SP to the MSP or the PSP.


    In privileged mode the program has access to a system of many

    registers that are not available in unprivileged mode. This is e.g. the

    registers controlling the interrupt controller, the MPU and the Program

    Status Register.


    There are also few instructions that are limited or non-accessible in

    unprivileged mode. Finally, the MPU can set different access rights

    for instructions running privileged versus unprivileged. A bare-metal

    program will stay in privileged mode and thus have full access to all

    memory, all registers and only use the Main Stack.'
