  md: '# CHAPTER 13. FREERTOS AND STM32CUBEMX


    # 13.3 Messages Between Tasks


    In the next experiment I used the same tasks as before. Again, using STM32CubeMX,
    I added a queue for communicating from Task2 to Task1. Only difference from the
    defaults is that I turned down the number of messages in the queue to 8. Each
    message has the size of an uint16_t. Listing 13.2 shows a shaved-down start of
    main.c with all the STM32CubeMX auto-generated code. Listing 13.3 shows the two
    tasks - also in main.c. Task2 increments a counter in a 16-bit integer and puts
    it in the queue. Then it yields the thread and loops around. It has a “forever”
    timeout which means when the queue is full, it blocks. Similarly, Task1 waits
    forever at the queue there is data - and then prints the data received. After
    this, Task1 takes a nap for a second. All this works without callbacks - the code
    is very readable.


    Table 13.1 shows the print from the tasks. The first column is the output from
    the queue in Listing 13.3. The second column is the output from the same code
    - without the yield in Task2. I notice the following:


    +   - In the left column, Task2 sends a single message which is immediately printed
    by Task1. This is because Task2 yields after sending each message.


    +   - In the right column, Task2 manages to send three messages before Task1 reads
    and prints the first. The default FreeRTOS timeslice is 1 ms. As., Task2 can do
    three print’s and put three messages on the queue in 1 ms.


    +   - Long before the first second is gone, Task2 fills up the queue and then
    blocks because the queue is full.


    +   - After this point, Task1 will read a single message and then wait a second.
    During this second Task2 only gets to send a single message because the queue
    is immediately full and then blocks. And so it goes from here.


    It is not strange that the data from the osMessageQueueGet is read via a pointer,
    but the data to osMessageQueuePut is also handled via a pointer. If a reference
    was used throughout the queue, we would have issues. Our count variable is allocated
    on the stack - then what if the function that we call exits? However, we reuse
    the count variable and queue different values from it - all reaching osMessageQueueGet
    unharmed. That would not be the case if we had'
