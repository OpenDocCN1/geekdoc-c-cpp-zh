    smaller registers in one:


    +   - Bits 0-8: The ISR-Number of the current Exception. The stacked version -
    Table 7.8 - of the xPSR has 0 in these bits, while the register in Table 7.7 has
    the value 6. This is "UsageFault". The core stacked the xPSR with the status before
    the exception, then set the ISR-Number to the correct exception.

    - Bit 9: If 8-bit stack-alignment is enforced (CCR.STKALIGN=1), then this bit
    is 1 if the stack was padded with an extra word. In our case it is 0 and there
    is no added alignment-word.


    +   - Execution Status Register.

    - Bits 10-15: Overloaded ICI - multi-register load/store interrupted - or IT -
    Conditional sequence interrupted. None of these are happening, and the bits are
    all 0.

    - Bit 24: Thumb-Mode. Always 1 on Cortex-M.


    +   - Application Status Register.

    - Bits 27-31: ALU-flags - from left (bit 31): NZCVQ. The bits set correspond to
    the Zero-flag and the Carry Flag. We got the exception in an sdiv instruction
