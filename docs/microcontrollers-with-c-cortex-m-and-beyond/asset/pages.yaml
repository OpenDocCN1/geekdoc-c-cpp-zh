  md: '# 7.6 Alignment


    # 7.6.1 Single Words and Half-words


    We say that a read or write access is aligned if it is performed on an address
    which has a modulo corresponding to the size of the access.

    Some cores - Cortex-M0 and Cortex-M1 - can only handle aligned accesses, and a
    "Trap" occurs on unaligned accesses. This gives the core a chance to handle the
    access in software. A compiler for such systems should only generate aligned accesses.


    The Arm Cortex-M3 and upwards, however, do not support unaligned accesses. Each
    access is split in multiple aligned accesses, and bits are shifted to fit the
    bill. This is not as very fast - but not having to always handle corner-cases
    can be beneficial. Another issue is that the resulting unaligned access is not
    atomic. We know that a read-modify-write needs a bit of handling, but with an
    unaligned access, there is the risk that a word - even a half-word - is read (or
    written) with intermediate access from another thread or interrupt. The compiler
    and linker ensure that e.g. a word-array is wordaligned. I recently experienced
    the following scenario on Cortex-M7:


    +   1. In the C-source there was a memcpy to a char array. The memcpy would copy
    a fixed byte-sequence - 7 bytes long - into this byte array.

    2. When executed, this code provoked a Hard Fault.

    3. When I examined the generated assembly code, there was no call to memcpy. The
    gcc compiler optimized the memcpy call away at optimize level "Og" which is "optimize
    for debug". Instead of a memcpy copying 7 bytes, the compiler had in-line inserted
    a word-copy, a half-word-copy and a byte-copy. The first two were unaligned, and
    thus the exception occurred on the first.

    4. The Armv7 was configured to cause an exception - Unaligned Trap - on unaligned
    access. This generates a Usage Fault - but only if such exception is enabled.
    If not it is promoted to a Hard Fault.


    Note that the code that provoked this scenario was completely compiler generated.
    To avoid getting into this situation you have three alternatives:


    +   1. Use the compiler option "-mno-unaligned-access" (in gcc) to assure that
    there will be no unaligned accesses.'
