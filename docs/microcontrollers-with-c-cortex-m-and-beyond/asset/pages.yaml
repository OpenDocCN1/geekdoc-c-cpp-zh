    As usual, the use of LR is Arm-specific, but the principles discussed are also
    valid for other cores. If you want to dig further into how all this is done, I
    suggest that you look at FreeRTOS or other available RTOS code. There is one interesting
    instruction I would like to show, that is commonly used in context switches on
    Arm:


    ```

    stmdb r0!, {r4-r11, r14}

    ```


    In this code R0 was previously loaded with the contents of PSP - the process SP.
    The stmdb instruction means “Store Multiple Registers - Decrement Before”. The
    exclamation mark means that the pointer-register (here R0) is updated along the
    way. In other words, we have here R0 doubling as a stack-pointer, pushing multiple
    registers - the ones missing as described above. It also respects the rule that
    highest numbered register is stored at highest address. Quite a luxury to have
    an instruction like that.'
