  md: 'c: Operating System

    This might e.g. be linux. In our “bare-metal” case it is none. It is also “none”
    when we use a small embedded RTOS like FreeRTOS, because this is linked together
    with our code in a monolith - like a bare-metal system.


    d: Format

    Typically always eabi. This stands for “Embedded Application Binary Interface”.


    e: Tool name

    We use tools like gcc, size, readelf. On Windows the tool has extension "EXE"
    as usual. On Linux there is no extension.


    In the “bare metal” scenario, the gcc compiler on a Windows machine is called
    arm-none-eabi-gcc.exe. On a Linux host it will be arm-none-eabi-gcc. On both hosts
    you get the C++ compiler by changing “gcc” with “++”. In these cases, the none
    relates to no target operating system, and we have skipped the vendor field.


    The many compilers are grouped in three groups - based on their business model:


    +   1. Open-Source compilers - notably gcc and Clang. Clang was created to be
    a “drop-in” replacement for gcc - built on more modern technology. It is very
    popular at Apple due to its Objective-C capabilities, whereas most embedded developers
    stick to gcc.


    +   2. Silicon vendors like Texas Instruments (TI) “ARM CGT” (derived from Clang)


    +   3. Independent compilers - like IAR and Greenhills. The very popular Keil
    compiler used to be independent, but is now owned by Arm. However, as Arm does
    not produce silicon, and Keil target many silicon vendors’products, we can keep
    Keil in this group.


    So how to choose which compiler to use? If you prefer one source, it will be more
    performance - be compile-time or the running program’s use of time and memory
    - you might look to EEMBC’s “CoreMark” for an answer. EEMBC is an independent
    organization that benchmarks CPUs and CPU-boards - they also note the compiler
    used in the test. If you search for “CoreMark Scores” you will find their tests
    - with the latest on top.'
