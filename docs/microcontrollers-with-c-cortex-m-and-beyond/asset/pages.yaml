    # 12.9 Synchronization Patterns


    Earlier we saw how to divide work into tasks. The different ways presented can
    be termed Desynchronization Patterns. We also saw patterns like the ring-buffer
    and the message-based system. These help the architect do work, while assuring
    that things are done in proper sequence. We can call these synchronization patterns.


    There are other synchronization patterns, that don’t the actual work,'
