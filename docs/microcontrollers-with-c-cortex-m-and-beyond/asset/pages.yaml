  md: '# 5.2 Literal Pool


    Listing 5.1 shows source code with interleaved assembly code - copied from a debugger
    window. This is a bit odd - as the source is also assemblycode. We will walk through
    the “normal” assembly-source in a moment, but there is more to learn - standing
    at the very first instruction. The first line in Listing 5.1 is line 62 in the
    source file. It instructs the core to load the 32-bit stack-pointer register with
    _stack end-of-stack. Just a moment ago we realized that the reset microcode already
    has initialized the stack-pointer to the value at address 0. The answer is that
    we could have some fancy swap of memory-blocks - placing our stack somewhere else.
    Until such a swap is in place, the microcode has assured that we have a normal
    stack - in case of an early interrupt. Such a swap is however not needed, and
    we happily load the stack-pointer with the same value again.


    The instruction-set in Cortex-M is very condensed. As hinted earlier, there is
    no room for a 32-bit constant like an address. We have to make a small excursion
    to get a 32-bit constant. Thus, the realassemblyinstruction is what we have in
    the next line that starts with the address of the instruction - still 0x0800 04f0.
    This instruction tells the core to load the stack-pointer register with what the
    content of the “[]” points to. The square-brackets give us a level of indication.
    We are to take the value of the program-counter - after this instruction - add
    52 decimal. The PC after this instruction is 0x0800 04f4. 52 decimal is 0x34.
    The sum is 0x0800 0528. We don''t need to calculate this in the future - a comment
    is generated with this info. At the memory window - see Figure 5.3 - the first
    line after the header starts at address 0x0800 0520 (first column is address of
    the following data). As 32-bit words are made of 4 bytes, we add 4 per word -
    also seen in the header. The word at 0x0800 0528 is 0x2000 3000. This is indeed
    the first word after the stack - _stack.


    The next assembly is a call to SystemIn, and after this we load _sdata, _edata,
    and _sidata in the same manner as the stack-pointer was loaded. From Chapter 4
    we remember that these signify respectively the start of the .data output section,
    the end of it, and the initialization values for the .data section in Flash -
    _sidata. When we discussed the linker script, we saw in Listing 4.5 how the linker
