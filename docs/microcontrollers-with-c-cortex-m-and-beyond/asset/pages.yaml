  md: '# 12.6. MESSAGE-BASED SYSTEM


    historically known as a performance-threat. However, as multiple cores become
    more and more common, designers have realized that shared-memory can be a bottleneck
    as one core may lock out other cores when accessing shared-memory. The result
    is that high-end CPUs are getting faster and faster when it comes to copying data.
    As usual, the small MCUs copy concepts and ideas from the bigger CPUs and adapt
    them to the embedded world. From a software point-of-view message-based communication
    has many advantages over shared memory:


    +   - Simpler code with low-level synchronization.

    - When one tasks puts a message in a queue, it is also a statement that the task
    is done messing with the data. The tasks retrieving the data can use it without
    locks, mutexes etc. This is normally even true if the message contains pointers
    to shared data.

    - Tests can mix desktop and target environments. You may send test-data from a
    PC to an embedded task that interacts with hardware and sends messages back to
    the PC. This allows you to e.g., develop algorithms on the PC, while the real
    hardware supplies data. The PC runs a regression-test by sending exactly the same
    data to the hardware - testing if it behaves as.


    +   - Debug can take place at a higher level.

    Debug software can e.g., dump specific fields from each message with a timestamp
    - allowing you to follow which task communicates when, to which task - about what,
    and in which queue.


    +   - Portability

    It is easy to port software to a new platform when task-communication is message-based.
    You may choose to move one task from your Cortex-M7 to a Cortex-M4, which is part
    of another SoC - communicating with the M over SPI or Ethernet.


    My first experiences with a message-based concept were based on a system containing
    two 8051-derivatives from Siemens - SAB80535 - many years ago. This system had
    a small fraction of the MIPS offered by any system today, but we still found that
    the debug abilities outweighed the small performance-hit. By keeping the number
