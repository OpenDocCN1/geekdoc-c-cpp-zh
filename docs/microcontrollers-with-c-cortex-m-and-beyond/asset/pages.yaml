  md: '# Chapter 10


    # Memory Protection Unit


    An MPU - Memory Protection Unit - is not the same as an MMU - Memory Management
    Unit.


    A Memory Management Unit is a part of CPUs with e.g., a Cortex-A profile. It allows
    processes under e.g., Linux to access the common physical memory using a virtual
    address space for each process. The MMU ensures that one process cannot access
    the memory space of other processes - unless a shared memory object is specifically
    set up. In such a system the linker will link functions and libraries together
    into a program, but it is not until this program is loaded by the operating system,
    that it is assigned a physical address. Even at this time the physical addresses
    are not “known” by the program, as addresses are translated on-the-fly by the
    MMU. The operating system can load many programs that work in parallel. They can
    work independently of each other - although they will be competing for resources
    like disc-access, network etc. Just like your desktop PC.


    Systems like your Cortex-M MCUs run a Monolith program that already at link time
    is assigned physical addresses in the common physical memory. We saw in Chapter
    4 how the memory input-sections from the compiler - or assembler are bundled together
    in output-sections and assigned to memory regions in physical memory by the linker.
    In many ways this is a simple system. However, a “wild” pointer in one part of
    the program can easily read or write to variables in a completely different part
    of the program. Possibly even overwrite program-code. C will allow you to load
    a constant into a pointer - then dereference it. This is how we access hardware
    registers when hardware - normally is the case - is memory mapped. One small mistake
    - missing a 0 in a hex-address and you are writing in the wrong place. This has
    been the condition of'
