  md: '# CHAPTER 2. THE TIP OF THE ICEBERG


    of the board that allows us to talk to it. A bit nervous I accepted - and it went
    well. I started the debugger again and now my newly built program flashed into
    the Cortex-M4, and the built-in debugger paused at a breakpoint at the first instruction
    of my program. This is default behavior. I was now able to run or single step
    the program and watch the LED blink slowly. When I power-cycled the board (turned
    off the power and turned it on again by unplugging the cable and inserting it
    again), I could see that the downloaded firmware was still present and working.
    This proved that it indeed flashed.


    Let us briefly enumerate all the components that together give us debugging, but
    also - a bit confusing - individually sometimes called a "debugger":


    +   * The user-client program on your PC that allows you to set breakpoints, single-stepping,
    seeing registers etc. This can be Eclipse-based Visual Studio Code with an extension.
    It can even be of many narrow tools like Ozone.


    +   * A hidden GDB-Server - GNU Debugger Server on the PC - takes orders from
    our user-client via a local TCP-connection and translates these commands over
    the USB.


    +   * The hardware-device that we typically insert between the PC and the hardware
    debugger. In this case we use ST-Link - built into our board (looking like you
    could break it off). See Figure 2.1. ST-Link converts from data over USB to a
    simple Serial-Wire Debugger - SWD interface - on the board. This is connected
    to our Cortex-M - but you can use a serial cable to another board, if you move
    a jumper


    +   * The integrated hardware inside the Arm Cortex CPU that takes commands from
    the above software.


    Figure 2.3 shows the program at a breakpoint with the following windows manipulated
    to fit the paper:


    +   * Stack - Top Left

    When the debugging starts, the Eclipse-based IDE suggests a shift to the Debug-Perspective
    which among other means that the left window changes from a File-Explorer to show
    the Stack. "Perspectives" are an Eclipse invention. Each perspective defines a
