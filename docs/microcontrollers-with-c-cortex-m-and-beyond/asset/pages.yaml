  md: '# 3.2. A GENERIC EMBEDDED SYSTEM


    through registers. There is however one exception - DMA - Direct Memory Access.
    In modern systems many data-flows routinely run all the time. One example starts
    with an A/D-converter aka ADC. This device will deliver samples at a constant
    rate - e.g., 48 kHz. In very primitive systems each sample generates an interrupt,
    which triggers an exception-handler which reads the sample into a buffer in RAM.
    We don''t want our advanced microcontroller interrupted for such mundane tasks
    all the time. Instead, we set up a DMA-transfer to silently move every sample
    into a RAM-buffer - until the RAMbuffer is half full (if we use an ADC). This
    will finally generate an interrupt, and we can use this to move the buffered data
    further along in our processing chain - while the other half of the buffer is
    filled by a new DMA-operation. There may also be interrupts from D/A-converters,
    as well as from UARTs, CAN-buses etc. In these scenarios, the peripheral end of
    the DMA will typically work on a single address, while the memory address is incremented
    by a fixed constant between each sample. DMA can also be from one memory location
    to another memory location (not shown in the figure). In this case the two ends
    of the DMA will use address-increments that are not necessarily the same. Note
    even though DMA might save CPU-time, it may still occasionally block relevant
    buses. This will temporarily pause the CPU.


