  md: '# Preface


    Joining an embedded software project for the first time can be intimidating. As
    an embedded developer, you often have to start programming without hardware, and
    when the hardware finally arrives you cannot assume that it is working as it should.
    Typically, hardware is developed in parallel with your software. Your requirements
    to on-board resources - e.g. Flash and RAM - may be vague at the beginning. Other
    resources - such as display-type - might change as you go. Such changes may happen
    if a component becomes obsolete, and/or was replaced by something cheaper and
    “almost identical“ - at least from the hardware designers point-of-view. Embedded
    programmers are faced with numerous CPU-types, board types and peripherals. These
    may have been selected in an earlier project - but you may be requested to offer
    your recommendations. This can also be a bit scary. On top of this we have the
    application domain. Embedded systems are typically dedicated for very specific
    purposes. This means that there may be many users out there, already trained by
    previous systems - maybe from competitors - with very special needs, that you
    may not yet understand. Why should you choose to go the embedded way? Because
    it is so satisfying to see an LED blink - or a step-motor step - experience the
    sound from a phone in a prototype of a hearing aid. Embedded systems bridge the
    gap between the physical world and the art of programming. It is simply fascinating.'
