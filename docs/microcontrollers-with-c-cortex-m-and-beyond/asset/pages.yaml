  md: '# Chapter 9


    # Floating-Point Unit & DSP


    # 9.1 Working In Floating-Point


    In Section 6.3 we discussed how to build for the FPU - Floating-Point Unit. Floating-point
    is an integrated part of the C-language, with `float` - aka Single Precision -
    `double` - aka Double Precision - in the floatingpoint standard (IEEE-754). As
    long as I can remember there was always the question, whenever a CPU was considered:
    “Does it have hardware support for floating-point?” The meaning with this question
    is: “Does it have hardware support for floating-point?” The first PCs used the
    intel 8086 CPU (or the cheaper 8088 incarnation). If you had money enough, you
    could also buy a PC with a 8087 “Coprocessor.” Several generations of intel CPUs
    had a coprocessor, until 80486 where it was integrated in the main IC.


    Cortex-M4 is the first Cortex-M to offer support for floating-point - sometimes.
    The silicon valley can choose between no support and support for single precision
    (sign, 23-bit mantissa, 8-bit exponent). You often see a Cortex-M4 with FPU called
    a *Cortex-M4F*. With Cortex M7 you can choose between single- and double-precision.
    The newer MCUs also support hardwareprecision which is practical when you have
    programs with SIMD - Single Instruction - Multiple Data. See Tables 7.1 and 7.2
    for support over all Cortex-Ms.


    So how does it work? As discussed in Chapter 6, it is important to compile the
    code with the right switches and call the right libraries. However, when it comes
    to writing C-programs you typically don''t have to worry how to write the program.
    You do not necessarily need CMSIS-DSP. This may sound obvious - one might think
    that CMSIS-DSP is all about using the DSP-instructions built into Cortex-M4 and
    others for e.g., SIMD, or multiplying two 32-bit integers and accumulating results
    in 64-bits.'
