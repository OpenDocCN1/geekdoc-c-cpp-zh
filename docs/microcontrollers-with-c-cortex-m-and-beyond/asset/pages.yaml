  md: '# 7.5. INSTRUCTIONS


    Listing 7.4: Conditional Instructions


    ```

    | CMP R1, R2 ; Set the flags for R1-R2

    | LT ; Three instr for IF Less-Than and one for ELSE

    | MOVLT R3,#0 ; LT match 1''st T

    | MOVLT R4,#1 ; LT match 2''nd T

    | ADDL R5,R4 ; LT match 3''rd T

    | ADGE R3,R4 ; GE match E

    ```


    You may come across instructions like TBB [Rn, Rm]. This is the Table Branch instruction
    that is great for switch-statements. In this case Rn is a pointer to and Rm is
    an index into the table. Rn can be the PC, where the value used is the PC right
    after the instruction. I suggest that PC-based tables are better to compilers.
    As can be expected TBB works on a table of bytes. There is a similar TBH that
    works with half-word-tables for longer distances. Since Thumb-addresses are always
    even, the value in the table is multiplied by two. Thus, the table-values should
    be the half offset.


    # 7.5.3 Conditional Instructions


    For a RISC-Cortex M cores certainly has many instructions. So far, we have seen
    many ways of controlling the program flow, but there is more. A very compact way
    of doing conditional actions is by not jumping at all - thus disrupting the pipeline.
    Arm has boiled the down to a concept where you can have one to four instructions
    after each other - being an “If” or “Else” of a common initial condition. Listing
    7.4 shows the concept with the maximum number of statements in the IT-block. In
    line 1 the condition is evaluated - setting the flags. It tells us that there
    will be three “THEN” instructions, followed by an “ELSE” instruction - using the
    “Less-Than” condition. Note that the “THEN” instructions all postfix the “LT”,
    while the “ELSE” postfix a “GE” - where “Greater-or-Even” is the opposite of “Less-Than”.
    If an instruction in the IT-block changes the flags, the new flags are used in
    subsequent instructions.


    # 7.5.4 Exclusive Instructions


    In Chapter 4 we saw Bit-Banding, which can be used to access single-bits in selected
    parts of memory and peripherals. I also mentioned that Bit-Banding can be used
    for Mutex. A Mutex is used to protect or'
