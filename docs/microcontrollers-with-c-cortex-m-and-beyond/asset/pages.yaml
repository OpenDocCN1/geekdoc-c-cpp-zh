    The linker “knows” about everything in the text, bss and data sections generate
    specific addresses for everything that goes into them. This is all known at link-time,
    and we therefore call it Staticially Allocated Memory. This can be a bit confusing
    - we just talked about Static RAM - But when the physical memory does not need
    refreshing like DRAM, "Statically Allocated Memory" is related to the concept
