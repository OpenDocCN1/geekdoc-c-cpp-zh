  md: '# Chapter 5


    # C Startup


    # 5.1 Reset Vector


    Now is the time to see many of the things we have discussed so far in action.
    We will do this by studying a reset. One might expect that we should set a breakpoint
    at the reset vector located at address 0. In older CPU systems the reset vector
    was executable code, a “Jump” instruction to the handler address. In that scenario
    we could set a breakpoint here. The same goes for the other vectors that follow
    the reset vector. However, in the Arm Cortex-M MCUs this is different. Each vector
    is simply the address of the relevant handler - except the reset-vector, which
    first contains the stack-pointer - and then the handler-address. The vectors are
    in reality data - not code - read by the Cortex-M microcode. This utilizes the
    memory better, as we save the space for all the jump-instructions. The concept
    also works around the fact that the instruction-set cannot directly hold 32-bit
    addresses. The first instruction to be executed “normally” will therefore be the
    first instruction in the reset-handler - the entry-point as defined in the linker
    script.


    Debuggers are typically by default set to “break” (reaching a preset breakpoint)
    at the first line in main. You can reconfigure this, but we don''t need to. The
    chip-designers are aware that debugging straight from reset is often interesting
    normally - and in other scenarios really important. The debugger therefore does
    not reset just because the rest of the CPU does. When the system is running, you
    can set a breakpoint in the Reset_Handler, and then press the Reset-button on
    the board. This will reset everything - except the debugger - and you will be
    at the breakpoint in the Reset_Handler. Nice.


    Be aware that if you open a memory window in Eclipse, you might not'
