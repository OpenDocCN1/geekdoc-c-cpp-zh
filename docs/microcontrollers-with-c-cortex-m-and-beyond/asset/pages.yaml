    also that the “RAM” range does not have the “X” marker (see next bullet), and
    therefore can contain code. The FMC Cortex-M7 also has a built-in NAND-Flash controller.
    This is a good example of how you could design a system based on a Cortex-M7 -
    executing code from external DRAM - like a classic CPU. In such a case you might
    use the built-in NOR-Flash to host a bootloader, that loads the main program from
    external NAND-flash - with high density - into external SDRAM, and then executes
    from this. Much like a classic CPU.


    +   * XN=execute Never

    When a row has the XN assigned, it means Execute Never. This marking is used for
    the reserved ranges for internal as well as external peripherals. Should a program
    attempt to execute code from here, an exception is normally generated (depending
    on MPU setup).


    +   * T=Access Type

    The hardware is allowed to make optimizations when it comes to executing your
    C-code maybe doing things in a slightly different order. It might sound crazy,
    but it is one of the many trade-offs we accept to get better performance. You
    do, however, not peripheral register accesses affected by hardware optimizations.
    A component might require the low-byte of a 16-bit value written to an address,
    followed by the high byte - the same address. If the order of these writes is
    swapped, strange things will happen. Even if the bytes are not written to the
    same address, it can still cause problems, if e.g., writing the high-byte is assumed
    to come last and triggers an action. The chip-designers have helped us here with
    the Access-Type field.


    +   * When a block is marked “N” for “Normal” it means: The processor can re-order
    transactions for efficiency or perform speculative reads.

    * When a block is marked “D” for “Device” it means: The processor preserves transaction
    order relative to other transactions to Device or Strongly-ordered memory. This
    covers the example above.

    * When a block is marked “S” for “Strongly-Ordered” it means: The processor preserves
    transaction order relative to all other transactions. Strongly-Ordered is adamant
