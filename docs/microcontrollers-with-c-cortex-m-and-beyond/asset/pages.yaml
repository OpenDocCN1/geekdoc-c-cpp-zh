    +   - Terminated

    The thread was killed, but its resources are not released yet.


    # 11.1 Multiple Thread Solutions


    Figure 11.1 shows a concurrent system with multiple threads. At the left side
    of the figure, we see some of the memory constructs we have dealt with: Heap,
    global memory, static memory (module-only access) and of the code. These are all
    shared among the threads.


    Whenever there is a Context-Switch from one thread to another, the currently invisible
    - OS saves the Context of the thread in what is often called a Task-Control-Block
    - TCB. The OS keep an array of TCBs - indexed by the thread-number. Into the TCB
    gets the content of all registers. When a thread is initialized, a memory area
    is set aside for the stack for the specific thread. When all the registers for
    the next thread are switched in by the OS, it will point to the stack of the new
    thread.


    Figure 11.1 also shows Thread-Local Storage - TLS. Imagine that several threads
    run the same code. They have their stack, there is an issue with static variables.
    Some of these may be const initialization values and can be shared, but others
    should be specific for the thread. So just like a thread is initialized with a
    stack, it can also be initialized with TLS. This concept was introduced with C11
    and is supported by gcc. You can e.g., declare a static __thread int myMachineID
    and you will have an instance of this stat per thread.


    Figure 11.2 shows the same system as Figure 11.1 - but this time with heavy use
    of the MPU. The idea is that the context-switch now includes a reconfiguration
    of the MPU. Thread 1 and 2 have their specific configuration, while Threads 3
    and 4 share a configuration. Most importantly the thread-stacks are protected.
    This protects the non-active stacks from being overwritten by the active stack.
    Secondly the code is protected in the same way, which helps us against e.g., bad
    function-pointers. We also see that global and static variables are protected.
    This is probably a bit optimistic, as this can be hard to configure - and the
    MPU only offers 8 regions on a Cortex-M4 (8 or 16 on Cortex-M7). Finally, the
    peripherals have their own pattern, signifying that they can only be accessed
    from privileged mode. This could be via a Supervisor Call - SVC - as we saw in
    Figure 7.1.'
