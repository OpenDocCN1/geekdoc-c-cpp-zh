  md: '+   Lock Register

    By sending a sequence of words, a program can lock the configuration of a given
    port - providing extra security.


    +   Alternate Function Registers

    These registers are used when a pin can be configured for other purposes. The
    possible values depend on the specific pin.


    +   Bit-Reset Register

    This register can clear from 0 to 16 bits. It is redundant when we have the BSRR.


    Only very few access-functions from stm2f3xx_ll_gpio.h are shown in Listing 8.4.
    There are functions for all reading and writing to almost all registers. Except
    for LL_GPIO_TogglePin they all appear to either read or write in a single line.
    The MODIFY_REG does however perform Read-Modify-Writes. We meet this in the next
    section.


    Listing 8.5 shows selected parts of stm2f3xx.h. This file is used for a whole
    family of boards and contains the MODIFY_REG used in previous section. The interesting
    part here is, however, the atomic macros that are used for Read-Modify-Write.
    We have seen that e.g., GPIO has built-in ways to change single bits, but that
    is not always possible. We see here again - the exclusive load and store in action.
    This time to create atomic bit-set and bit-clear. Also note the use of the do
    while {} 0 in the macros. This is the only way to create a macro that can be used
    in any C construct.'
