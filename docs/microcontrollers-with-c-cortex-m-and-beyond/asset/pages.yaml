  md: '# 8.2 CMSIS-Core


    Listing 8.1 shows a small part of core_cm4.h, with condensed comments and small
    font. The first part is the struct for the SCB - System Control Block - Registers.
    When you read the documentation, these registers are described "on their own".
    In other words - you may not realize that the register "ETM" - Embedded Trace
    Macrocell - registers are part of the TPIU - Trace Port Interface Unit. In the
    same way you may not realize that the register is part of the SCB. It makes sense
    when you know it, but it can be difficult to catch when you are browsing tens
    of documentation.


    Below the SCB we find a lot of "defines" for positions and masks - I only show
    the ones for the PendSV bit. Next, we see the base address definitions with pointer
    declarations. Further down I included an access function for enabling a specific
    core-interrupt. At the very bottom we see ITM_SendChar - used in Chapter 13.


    As stated, CMSIS-Core also contains what we might call language-extensions. Listing
    8.2 shows a bit of cmsis_gcc which provides a lot of intrinsic functions. At first,
    we see the generic macro for inline functions. Arm the __STATIC_FORCEINLINE everywhere
    and has defined compiler specific implementations of it. This allows most of the
    code to be the same. We use the intrinsic function for enabling interrupts from
    C and for setting the Base Priority. This allows you to disable interrupts with
    a lower priority than a given threshold. You can use this task-switching, while
    still allowing interrupts.


    Next we have the two exclusive load and store instructions that are discussed
    in Chapter 7 and used in Section 12.9 to create a lock. They also come in byte
    and half-word versions.'
