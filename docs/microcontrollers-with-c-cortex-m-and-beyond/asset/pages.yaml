    via “settings”. Both the compiler and the linker options contain the following:
    -mfpu=fpv4-sp-d16 -mfloat-abi=hard. The first option tells gcc that we have an
    FPU unit v4 of the spec. supports single-precision (sp), and has 16 double-registers
    - corresponding to 32 single-registers. The second option tells gcc how to use
    the FPU calling convention. Just goes to show that directives and options from
    many places end up in the linker, and it can sometimes be difficult to find out
    what originates where. We will see more compiler and linker options in Chapter
    6.


    +   Line 17: Section Headers. We recognize the various output sections - like
    .text and .data etc. The Addr column is the physical address in memory, the section
    goes to, while the Off column tells the offset in the ELF-file where it is found.
    In Bytes, and the Flags are W for Write, X for Execute and A for Allocate. “Write”
    and “Execute” makes sense - but “Allocate?” The “allocate” flag is set when the
