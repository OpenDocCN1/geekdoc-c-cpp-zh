    r15 using then order relative to e.g. `blx rm` is convenient with function pointers
    - e.g. in function-tables or initializing callbacks.


    The conditional branches use the condition codes. This sounds like a given thing,
    but actually is only correct for the branch instructions starting with "b". The
    `cbz` - "Conditional Branch Zero" and `cbnz` are immediate instructions. They
    test the content of the given register and immediately branches (or not) without
    affecting the flags. This is faster than setting the flags and then branching
