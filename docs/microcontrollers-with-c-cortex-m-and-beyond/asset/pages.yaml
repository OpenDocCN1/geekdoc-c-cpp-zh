  md: '# 8.1. OVERVIEW OF CMSIS


    +   - CMSIS-Core


    We have talked about the “Core” as the part of a Cortex-M device that is completely
    defined by Arm - the “inner CPU” - like we saw back in Figure 3.3. It makes a
    lot of sense that Arm delivers files for their part of the hardware. This is CMSIS-Core.
    Thus, the term “Core” here is not just central and important - it literally targets
    the MCU. CMSIS-Core thus contains the register-abstractions and access-functions
    for the core and it''s peripherals.


    Since many years MCUs also include intrinsic functions. These are basically assembly
    language functions for special use from C. A programmer can see them as C language-extensions
    - hence the term “intrinsic”. This is mode-changes like enabling or disabling
    interrupts, atomic access constructs and low-level things like rotate (C has shift,
    but not rotate). Since intrinsic functions invariably involve assembly language,
    there may be variations for different compilers. Thus, it’s safe to say that the
    difference between an intrinsic function and an access-function is that what you
    simply cannot do in normal C. An access function may use an intrinsic-function,
    plus more, like masking values, ORing with other values, and writing to a register
    etc. In some Cortex-Ms we also have the SIMD-instructions - leaving full DSP algorithms
    to CMSIS-DSP. Finally, the “Startup” file is included. We saw this in Chapter
    5. The Startup calls some initialization-functions that must supply.


    +   - CMSIS-Driver


    Silicon vendors integrate the Core in their design and add a bunch of internal
    peripherals. We saw an example of this in Figure 3.4. These peripherals also register-definitions
    with access-functions in similar files as the CMSIS-Core. On top of these they
    supply their larger drivers. The CMSIS-Driver files typically in their file-path
    contain the name of the board in question. There are files for a suite of products
    and other files with additions for board-families or specific boards. A family-file
    may define a set of registers for access, while the specific board-file defines
    the base addresses of the registers. If you make your own board you can start
    with the “nearest” vendor-board using the same MCU.


    +   - CMSIS-DSP


    We have seen that Cortex-M4 and upwards include DSPs. To help C'
