  md: '# CHAPTER 9. FLOATING-POINT UNIT & DSP


    The sine generation is using the FPU in a gcc library sinf function, while the
    power calculation is done in main.c. The disassembled code for the relevant part
    of main.c is shown in Listing 9.3. This listing is not easy to read - partly because
    of the speed optimization. Table 9.1 is an attempt to explain the main loop. Note
    that in Unified Assembly Language, floating-point instructions start with "w".


    vldmia is Load Multiple - Increment add. The "multiple" tells us that it can load
    several registers. Due to the exclamation mark, the register used for addressing
    is incremented by 4 bytes per register loaded. This instruction costs 1 cycle
    plus 1 cycle per register - with only one register we get at 2 cycles.


    vfma is Fused Multiply-Add - which is basically the well-known MAC-Multiply-Accumulate
    - where intermediate results are not rounded. The ALU-flags are set in the cmp
    statement and by bne.n which is Branch Not Equal with a narrow address. If an
    address designated as "narrow" cannot fit into a 16-bit instruction, the assembler
    will flag an error or we must jump to near - as normally the case in a loop. This
    instruction takes one cycle - plus a pipeline refill. According to my measurements,
    the branch takes 3 cycles in a Cortex-M4. In other words, of the 9 cycles per
    sample, the loop-maintenance takes 4 cycles, and the actual floating-point arithmetic
    takes 5 cycles.


    vmul and vadd take each instruction, and it seems that we could use these and
    save an instruction. There is however a problem when they are used back-to-back
    - in which case they end up costing 3 cycles. On top of these we would have rounding
    after every multiplication.


    It is interesting that the final division by the number of samples is done by
    a multiplication (line 18). This proves that gcc is clever enough to divide by
    a constant by multiplying with the reciprocal value. Another interesting thing
    is the call to _extendsfdf2 (line 23). This library converts a float to a double
    and is proved by printf, which only deals with doubles. Since the M4 Core only
    supports single-precision floating-point it throws in the tore here and calls
    the software library.


    Listing 9.4 shows the loop "unrolled" - that it loops once per four multiplications-Accumulations.
    This brings the total cycles for the loop to 6463 - corresponding to 6.3 cycles
    per sample. Note that this gives a compiler warning because the order of dereferencing
    and incrementing the pointer is not completely clear, but works for now. If instead
    each line becomes power += (*psignal) * (*psignal); psignal++; we get no warnings
    and the cycle-count is the'
