  md: '# About the Author


    Klaus Elk graduated as Master of Science in electronics from the Danish Technical
    University in Copenhagen in 1984, with a thesis in digital signal processing.
    Since then, he has worked in the electronic industry within the domains of telecommunication,
    medical electronics and sound and vibration. He also holds a bachelor''s degree
    in marketing. In a period of 10 years Klaus - besides his R&D job - taught at
    the Danish Technical University. The subjects were originally object-oriented
    programming (C++ and Java), later the Internet Protocol Stack. Today he is Senior
