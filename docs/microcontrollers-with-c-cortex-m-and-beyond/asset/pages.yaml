  md: '# 9.5. SUMMING IT UP


    Please note that moving the code to CCMRAM is not the only change. To make room
    for the code, the signal is no longer stored in CCMRAM. This did not change anything
    earlier, when the standard Sinf functions was used. It did not change anything
    for the for-loop with floating-point multiply-accumates. It does however, mean
    something for the specific CMSIS version - arm_sin_f32. This has gone from 94252
    to app. 110662 cycles. Repeating the experiment gives the same results. This result
    is also the same with and without the barrier.


    # 9.5 Summing it all up


    With the help of the small sample we have scratched the surface of floating- and
    fixed-point arithmetic. CMSIS-DSP offers algorithms for both - although in this
    the floating-point version was so simple that we did the calculations directly
    in. You can use the floating-point CMSIS-DSP algorithms - independently of your
    Cortex-M has a built-in FPU or not. If not, it will use the software library.
    In any case, the algorithms can be a great.


    Table 9.2 is a summary of the measurements done in this chapter. We saw that although
    fixed-point arithmetic has a reputation for being faster than the corresponding
    floating-point version, this is by no means of law nature.


    Floating-point is basically always faster and simpler to implement, mainly because
    we rarely need to worry about overflow or underflow. When doing integer-arithmetic
    you need to understand and control the implicit binary. Floating-point executed
    faster than fixed-point in the sample - even though the library is using Cortex-M''s
    built-in DSP functions. We did, however, that without the FPU, floating-point
    becomes painfully slow. Don''t forget that the FPU is of absolutely no use if
    we need to work with doubles - at least on MCUs like Cortex-M4 and Cortex-M33.


    Note that even this outperformed the “naive” implementation of the floatingpoint
    algorithm the fixed-point library version, you get even better performance by
    unrolling the loop a bit - removing most of the overhead related to branches in
    the loops.


    In this chapter we also spent time testing the CCMRAM. It is relevant because
    this is just one of the RAM-types that can be used to speed-up important inner-loops
    - as those typical of signal processing. We saw that the slow sine-calculation
    did not change when the signal was stored in CCMRAM, while the fast sine improved
    slightly. When CCM-'
