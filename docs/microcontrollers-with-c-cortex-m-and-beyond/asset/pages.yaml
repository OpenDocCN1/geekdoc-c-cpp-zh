  md: '# 3.7. STM32F334R8 ARCHITECTURE


    System Memory is a Flash Area that is programmed with a bootloader from the factory.
    This bootloader does not take up much space, but is capable of loading firmware
    through many interfaces, like SPI, USART, CAN and so on. Please note that although
    this on-chip can assist in downloading new firmware - like a debugger can - it
    is not your debugger. As a designer you may choose to embrace the bootloader and
    allow it to be used in-field by end-users or service-technicians - typically after
    a special button-combination. You will however normally try to disable the use
    of the debugger in the field, as it can easily be used to extract your IP - the
    code. The clearer reader will realize that a bad-guy might upload code through
    the bootloader that basically "prints out" the existing binary code - or alters
    the functionality. For this reason you might want to disable the use of the standard
    bootloader in field - or reconfigure so it only works on signed code.


    If you want to play around with the Boot-bits you can check UM1724 is the User
    Manual for the Nucleo-64 boards. Here you will find Boot0 is normal pin 7 on the
    Morpho connector (leftmost in top view). There is a dot for pin 1, and you have
    even numbers along the edge of the board. On pin 5 - just above pin 7 - you have
    Vdd (supply voltage). Connect pin5 and pin7 with a jumper and Boot0 changes from
    0 to 1. There is an unused jumper at CN12 (top corner). Since nBoot1 is a programmable
    option easiest way to change is to download the STM32CubeProgrammer - if you haven''t
    done that already. This is a very neat and simple tool that is great for inspecting
    SFRs - Special Function Registers - and updating firmware, but it has access to
    the option bytes where nBoot1 resides. By default, nBoot1 is checked.


    +   D

    Dbus is basically a way to handle the limitations of the very compressed instruction-set
    in Cortex-M4. Many assembly instructions need to load a 32-bit constant - aka
    literal - into a register. To avoid having wide fields in the instruction set,
    the Arm designers have decided that instead of allowing for 32-bit constants in
    the instruction-set, such an instruction will use an 8-bit Program-Counter relative-address
    to refer to the constant - still in code-space. These constants are bundled in
    so-called literal pools.


    > 5Like the Bit-Slice fields described in Section 3.1'
