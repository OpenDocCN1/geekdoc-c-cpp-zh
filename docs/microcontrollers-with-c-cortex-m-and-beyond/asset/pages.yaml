  md: "# # Chapter 11\n\n# # Operating Systems\n\nA program can execute in one of\
    \ the following ways:\n\n+   * Sequential.\n  A classic C or assembly program\
    \ on a single core. You can follow the Thread of Execution through simple code,\
    \ loops and explicit function calls. Even a C++ program with its implicit instantiations\
    \ of classes and operator-overloads is a sequential program - although it is not\
    \ always so easy to follow the thread of execution. The same thing can be said\
    \ about an event-driven program without Worker-Threads.\n\n+   * Concurrent.\n\
    \  Still a single core. The simplest concurrent system is a single main-program\
    \ with one or more interrupts. However, we normally think of a concurrent system\
    \ as one with multiple Tasks or Threads that seem to run in parallel. I will use\
    \ the term thread here as task is more \"overloaded\" and therefore vague. Although\
    \ threads seem to be parallel, there is always maximally one thread executing\
    \ in a concurrent system. Concurrency is typically implemented by a Scheduler\
    \ in a kernel, which might be part of an Operating System. All the smaller Cortex-Ms\
    \ are tailored to run an RTOS - Real-Time Operating System - on a single core.\
    \ Such an RTOS will often offer more than just the scheduling. Examples are signals,\
    \ queues or message-boxes and semaphores// mutexes. We will see this in Chapter\
    \ 13. To qualify as a full-blown operating system, there is typically also support\
    \ for GUI, network, file-system etc. Such systems are typically found on Cortex-A\
    \ CPUs. As stated earlier, a concurrent program can have issues with e.g., Read-Modify-Write\
    \ cycles that are interrupted."
