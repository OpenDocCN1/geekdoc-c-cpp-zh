  md: '# 9.4 Executing in CCMRAM


    Earlier I tried to keep mysignal in CCMRAM - and it changed nothing. The CCMRAM
    is however placed in the code-region and is mainly there to speed up code.


    I decided to test the unrolled for-loop running in CCMRAM, because it was already
    the fastest. As expected, it is a lot more work to get this running, than simply
    keeping the signal in CCMRAM. We have discussed how the linker and Startup works,
    but nevertheless it is nice that the process is described in ST''s Application
    note AN4296 - for several compilers. For gcc these are the:


    +   - The linker script needs a .ccmram output section, very similar to the .data
    section. This section must be placed before the .text section - but can come after
    the vectors. Please note that this differs from the default setup from STM32CubeMX.


    +   - The unrolled for-loop is moved to a function called CalcPower() - returning
    the power.


    +   - The new function must have the following attribute before the function declaration:
    __attribute__ ((section(".ccmram")))


    +   - The Startup assembly-code that copies the new section from Flash to CCMRAM.
    This is very much like the data-section - but you can copy directly from the application
    note.


    +   - The above did not work. Checking, I did not find any .ccmram section in
    the MAP-file. I realized that the function CalcPower() is so short that it is
    inlined by gcc - and thereby executed in the .text section. The function also
    needs the following attribute: __attribute__((noinline))


    This was the new output:


    | | |

    | 1 | Sine Generation took 110662 Cycles |

    | 2 | Measured Power (f32): 0.041687, True Power:0.041687 Took 5687 Cycles |

    | 3 | Measured Power (q31): 0.041687, True Power:0.041687 Took 22385 Cycles |


    Now we count 5687 cycles for the function call. This corresponds to 5.55 cycles/sample
    - bringing us very close to the “datasheet version” of 5 cycles/sample - 2 vldmia
    and 3 for vfma - as can be seen in Table 9.1.'
