  md: '# 7.3 Registers and Call Stack


    We know Cortex-Ms are RISC-processors of the load-and-store architecture. This
    means that the ALU cannot work directly on data in RAM - it needs data via registers.
    Since all data passes through registers (except for DMA) the registers need to
    be very fast, and they are central in the architecture - and thereby the instruction
    set. Even if you program in C, it is good to understand the basics of registers
    as it will improve your debugging skills.


    For now, we will look at the Armv7-M core - known from Cortex-M3, M4 and M7 -
    but the other Cortex-Ms are pretty similar. We have 16 basic registers - R0 to
    R15 and some Special Registers. Figure 7.3 shows the 16 registers along with some
    important registers.


    In assembly-instructions, the basic registers can be referenced by their register
    number - e.g. "R0" or "r0" - but some also have alternative names and may be referenced
    by. The code becomes more understandable if you refer to "SP" or "sp" rather than
    "r13". Smaller 16-bit instructions can only use the "low registers" - R0-R7 -
    at the cost of three bits each, others - together with the 32-bit instructions
    - also have access to the "high registers" - R8-R15. Table 7.4 shows the 16 registers
    and their use. Before we dig into this, we need to take a look at a stack.


    A stack is a simple concept. You push on top of the stack that you pop like a
    pile of books, the first book you can take from the top - pop - is the last one
    placed at the top - pushed. The pop-action reveals the next book - now at the
    top. You often see the term TOS - Top Of Stack. A stack is also sometimes called
    a LIFO - for Last-In-First-Out¹. It doesn''t really matter the stack typically
    grows towards addresses - although it can be confusing. The Arm stack is "Full
    Descending" when you push, the stack pointer is initially decremented - then used
    as address for what is pushed. The memory cell that stores the values on the stack
    from registers and to registers. In a load-and-store architecture the values on
    the stack from registers go to registers. A stack/LIFO is very handy when subroutines
    or functions are called (we will use the term "function\”). The stack allows function
    to call function function etc. - and then unwind back to the start. In the old
    days you could see code where all parameters were set “manually" first, then by
    the call - the Program-counter, so that this could be popped when returning. You
    might also see code where all registers were pushed to save their state and later
    popped - as the call function


    > ¹As opposed to a queue which is a FIFO.'
