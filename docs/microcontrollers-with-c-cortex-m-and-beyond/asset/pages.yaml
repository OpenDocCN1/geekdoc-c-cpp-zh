    The Memory Map (more correctly: Address Map) is one of the most important characteristics
    of an embedded system. If you understand what the memory map tells you, and why
    it is structured as IT is, you already know a lot about the system. Thus, the
    memory map is often a good place to start when you want to understand what MCU
    offers.


    Figure 4.1 shows a view of the memory map for the STM32F334 - with a zoom-in the
    “Code” region. There is another view in Figure 4.2 showing region-sizes in GB
    which can be helpful. This is how ST structures memory. As we will see, it closely
    follows the way Arm structures memory. The ability to switch-in Flash, System
    Memory or SRAM is building on Arm Cortex-features - although the content of the
    System Memory - the ROM bootloader - is an ST invention. The buses from Chapter
    3 - IBUS, DBUS'
