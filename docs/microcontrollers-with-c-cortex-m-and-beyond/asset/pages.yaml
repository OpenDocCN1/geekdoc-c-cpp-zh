    # 7.2 Cortex-M Modes


    The programmers is simpler for Cortex-M than it is for e.g. Cortex-A. We do not
    need to worry about switching back and forth between Thumb and Arm mode - we already
    know that on Cortex-M we only have Thumbmode. There is however still some mode-changes
    and it''s all related to when a program can do this and access that. On reset
    a program always privileged. This means the program can access all hardware and
    all memory. Like we saw in Chapter 5. In many bare-metal programs this simply
    continues, and all operation is privileged. It is however possible to switch to
    non-privileged operation. This can be in a bare-metal system, but is more common
    when an operating system - OS is used.


    A program runs in either Thread-Mode or Handler-Mode. When executing an Exception
    the program is in Handler-Mode. Handler-mode always runs privileged. Normal execution
    is Thread-Mode. Thread-mode can be both privileged and unprivileged. See Figure
    7.1. When an operating system is utilized, it will typically execute privileged,
    while the application runs unprivileged. A program can choose to go from Privileged
    Thread Mode to Unprivileged Thread Mode. This is what happens when an OS starts
    a normal application thread (in other systems this is termed “User Thread”).


    Many-peripherals are only accessible from privileged mode. If an MPU is present
    it can be set up to only access to peripherals and certain memory from privileged
    mode. An application running in unprivileged Thread-Mode cannot switch to privileged.
    Instead, the application relies on the services of OS drivers. The application
    can execute the assembly instruction SVC. This is a Supervisor Call that generates
    an SVC-exception. This will change handler-mode - running'
