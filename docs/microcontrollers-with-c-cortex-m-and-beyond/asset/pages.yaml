  md: '# 7.3. REGISTERS AND CALL STACK


    skip the details here - after all we are not writing a compiler.


    If caller needs the unchanged content of the registers R0 to R3 after the call
    has returned, it is up to the caller to push these on the stack - before any parameters.
    Thus, caller can freely use registers R0-R3 (after using any parameters here).
    If caller starts registers R4 to R11, then caller must first push these on the
    stack, and after using - but before returning - caller must pop these registers
    in the reverse order. In the “old days” the return address was put on the stack,
    but in the Arm-world the return address is kept in LR - the Link Register. This
    means that when a function calls a new function, it needs to push the LR first.
    “So what’s the gain of having LR if it ends on the stack anyway?” you might ask.
    Apart from the faster process when calling functions after another, one level
    down, we get a much nicer benefit when it comes to exceptions. We will see this
    shortly.


    In Table 7.4 I have nicknamed R7 as “Base Pointer”. This is not an official Arm
    name, but a name I picked up from my Intel 80x86 days. 80x86 has a Base Register.
    When a function is called, you will often see that the stack-pointer is decremented
    by a number and then copied to R7. Since the stack grows downwards this inserts
    a temporary empty space in the stack that is “abandoned” when the function returns.
    This empty space is used for local variables - in C often called “auto-vars”.
    This concept helps functions becoming reentrant. A function can call itself -
    or call another function that calls the original function, and will be independent
    instances of the local variables. R7 is typically used to point to the “base”
    of the local variables - the one with the lowest address on the stack. This means
    that these local variables are easily referenced by R7 plus a specific offset
    per variable. The naturally concept requires R7 to be pushed on the stack before
    it is used.


    Note that the assembler allows you to push or pop multiple registers by one instruction
    curly braces. `push {r6, r0-r3, r5}` push r6, r5, r3, r2, r1, r0 - in that order.
    The concept is that registers are pushed with the highest numbered register at
    the highest stack address. This means that you can actually copy and paste the
    push instruction to the bottom of the function and replace push with pop. This
    makes life easier and avoids stupid mistakes like pushing registers in the wrong
    order². The concept also saves code-space, and the fewer instruction-reads gain
    a bit of performance. You can still push and pop “manually” with one instruction
    per line if you prefer.


    > ²Don’t forget to change push to pop!'
