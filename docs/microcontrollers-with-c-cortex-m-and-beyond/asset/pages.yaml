    # 11.2 Context Switching Between Threads


    Context switching is the concept of switching from executing one thread

    ton the core, to executing another. In Section 11.1 I briefly introduced the

    TCB - Task Control Block. We saw in Figures 11.1 and 11.2 that

    of the memory-structures are not thread-related and therefore remain

    unchanged over a thread-based context-switch. We (almost) only need to

    switch the registers. One of these is the Stack-Pointer - SP. If the system is

    initialized correctly, the SP we switch to, will point to the correct stack, and

    the PC where we should execute code. If we use Thread-Local Storage,

    the compiler will allocate R9 for it. If not, the OS will keep an index.

    There are three main triggers behind a Context-Switch:


    +   1. The current thread yields.

    This typically happens when we perform an OS-function call (SVC)

    cannot be completed right now. We might be reading from a

    TCP-socket or mailbox where there are currently no data, or we are

    waiting for a MUX or semaphore. The OS can see that the resource

    cancel, and our thread changes state from Running to Blocked.

    Another thread that Ready is now Running.


    +   2. The time-slice runs out.

    Many OS''s use Preemption as this is called. Typically, the OS

    maintains a SysTick timer. The SysTick counts down to 0 it

    generates an interrupt. The timer either automatically reloads (it)

    in Cortex-M) and restarts its countdown, or it is restarted in the

    ISR - Interrupt Service Routine. If there is another thread at the

    same priority as the current, it now becomes Running, and the old

    thread becomes Ready.


    +   3. A higher priority thread becomes Ready. An interrupt may have told

    t OS that at least one byte is waiting in the TCP-socket, or the

    OS may have received an SVC from another thread that released a

    mutex or put a mail in a mailbox.


    As we can see from the above, all relevant state-changes that should

    with a new Running thread, occur via interrupts or SVC-calls - and

    are thus handled in an exception handler. A thread is therefore always

    in Handler-Mode when it changes state. The relevant handlers will call

    specific OS-code. The OS stores the state of the thread that was Running.

    The thread to become Running was earlier paused as Ready or Blocked - also

    in a Handler. The OS now restores the state of the thread to be Running'
