  md: '82


    CHAPTER 6. TOOLCHAINS AND IDEs


    # 6.2 Libraries


    Imagine that a company releases a library for cryptography in a binary-only version
    - thus protecting their IP, the source. Another company releases a binary-only
    DSP-library for electrical-engine control. If these two libraries are compiled
    with incompatible compilers you will not be able to use them both from your application.
    You would only be able to compile your application with a compatible compiler.
    Alternatively, the library vendors would have to compile - and test their libraries
    with all relevant compilers.


    Incompatibilities might be related to calling conventions; what clears the stack
    - caller or callee? Do we even use a stack for parameters, or do we use registers?
    If so - registers in which order etc.


    This unbearable situation could happen years ago - until the vendors agreed on
    a standard proposed by Arm - the "Embedded Binary Interface" - the one we see
    in names like "arm-linux-eabi-gcc". Thanks to this, a program compiled with one
    compiler can utilize a library that is compiled with another. A part of the problem
    persists however, as the choice of instruction-set, operating system, and the
    use of an FPU will affect the binary output - and therefore can trigger a library
    variant. This is the reason why we will still have several versions of libraries,
    but at least the makers can use their favorite compiler.


    With the original C-compiler we use libc the Standard C library. It has some problems
    - mainly in the relatively large amount of Flash and RAM it consumes. A newlib
    was created to avoid these problems, but it too was bloated. This led to the introduction
    of newlib-nano, which consumes much less space. If we turn our eyes, once again,
    to the Nucleo-64 board from Chapter 2, this only has 12 KB RAM. To avoid using
    it all in the library, the newlib-nano is used in the sample-code. This is selected
    by the MCU-Settings in the IDE and is reflected in the linker-options as specs=nano.specs.
    The specs-option refers to actual files with this extension - like nano.specs.
    A specs-file can tell gcc to replace one with another. These files are kept in
    the same folders as the libraries. We will not go into the syntax of specs-files
    as they are typically not edited - only included from the right folder.


    So how to find the libraries? In the Eclipse-based tools there is a plethora of
    folders under the "plugins" folder. At first glance it can be quite discouraging.
    However, there is a system in the way these long paths'
