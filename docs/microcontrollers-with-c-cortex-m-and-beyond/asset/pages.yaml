    # Listing 8.6: stm32fxx_hal_gpio.c


    | void HAL_GPIO_Init(GPIO_TypeDef *GPIOx, GPIO_InitDef *GPIO_Init) |

    | uint32_t position = 0x00; uint32_t iocurrent; uint32_t temp; |

    | /* Check the parameters */ |

    | assert_param(IS_GPIO_ALL_INSTANCE(GPIOx)); |

    | assert_param(IS_GPIO_PIN(GPIO_Init->Pin)); |

    | assert_param(IS_GPIO_MODE(GPIO_Init->Mode)); |

    |

    | /* Configure the port pins */ |

    | while ((GPIO_Init->Pin) >> position) != 0x00u |

    | /* Get current position */ |

    | iocurrent = (GPIO_Init->Pin) & (1 << position); |

    | if (iocurrent != 0x00) |

    | // OBS! Skipping analog, alternative and normal GPIO modes // |

    | EXTI Mode Configuration |

    | /* Configure the Interrupt event for the current event */ |

    | if((GPIO_Init->Mode & SYSCFG_EXTI_MODES) != 0x00u) |

    | /* Enable SYSCFG CLK_ENABLE */ |

    | HAL_SYSCFG_CLK_ENABLE(); |

    | temp = SYSCFG->EXTI(position >> 2); |

    | temp &= ~(0x0FU << ((position & 0x3) * 4 + (0 & 0x03))); |

    | SYSCFG->EXTI(position >> 2) |= temp; |

    |

    | /* Clear Falling edge configuration */ / |

    | EXTI->RSR; |

    | temp = (iocurrent); |

    | if(GPIO_Init->Mode & TRIGGER_RISING) != 0x00u) |

    | { |

    | temp = iocurrent; |

    | EXTI->RSR = temp; |

    | EXTI->FTSR; |

    | temp = (iocurrent); |

    | if(GPIO_Init->Mode & TRIGGER_FALLING) != 0x00u) |

    | { |

    | temp = iocurrent; |

    | EXTI->FSR = temp; |

    | temp &= ~(iocurrent); |

    | if (GPIO_Init->Mode & EXTI_EVT) != 0x00u) |

    | { |

    | temp = iocurrent; |

    | EXTI->IMR = temp; |

    | /* Clear EXTI line configuration */ / |

    | temp = EXTI->IMR; |

    | temp &= ~(iocurrent); |

    | if (GPIO_Init->Mode & EXTI_IT) != 0x00u) |

    | { |

    | temp |= iocurrent; |

    | EXTI->IMR = temp; |

    | } |

    | position++; |'
