  md: '# CHAPTER 7. CORTEX-M PROGRAMMERS MODEL


    # Table 7.11: Barrier Instructions


    | As | C | Usage |

    | --- | __DMB () | All explicit memory accesses before the DMB instruction are
    observed before any explicit memory accesses after the DMB instruction |

    | DSB | __DSB () | As DMB - but also synchronizes instructions |

    | ISB | __ISB () | Flushes instruction pipeline and re-reads cache


    more variables so that one Task can perform a Read-Modify-Write without another
    task interfering. As if we e.g. want to increment a counter in memory, we need
    to load it into a register, increment it and store it back where it came. Cortex-M
    is of the type Load-And-Store - meaning that in a preemptive system where tasks
    run the risk of being taken off the CPU to manage other tasks, as well as interrupts
    in general - there is always the risk that task A does the read part of the Read-Modify-Write
    and then gets interrupted by task B or an interrupt, which does its own Read-Modify-Write.
    When task A gets the CPU again it might modify its and then overwrite the counter
    (or whatever variable). This problem is as old as embedded systems. The “safe”
    solution has always been to disable interrupts (if they are enabled) and after
    the Read-Modify-Write re-enable interrupts again. With unprivileged mode this
    does not work. Some CPUs - like the Motorola 6805 - solved the problem by allowing
    memory-based variables to be incremented or decremented directly. Many CPUs have
    a Test-And-Set instruction for creating a Mutex - Cortex-M goes a bit further
    with Exclusive Load and Store instructions.


    The Exclusive instructions are used in Subsection 12.9.2 to implement a “Lock.”


    # 7.5.5 Barriers


    Modern cores are sequential pipelines, and things going on in parallel, in order
    to give us the high speed we use to. This unfortunately means that as programmers
    sometimes need to help the core. There are instructions that need to be completed
    before the next instruction is read or executed. This could e.g. related to changing
    the setup of the MPU.

    Table 7.11 is a short version of the barriers, with columns for assembly-version
    of the instruction, C intrinsic, and a brief description. This is a good place
    to consult the datasheet for your specific Cortex-M.'
