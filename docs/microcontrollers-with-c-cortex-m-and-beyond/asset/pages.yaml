  md: '# 3.5. PHYSICAL MEMORY TYPES


    drawback: If data and instructions are completely separate, then how do you update
    the firmware? When a new program is loaded it is seen as data by the old program
    - so how do we get it into the instruction storage? A solution often requires
    additional external hardware.


    In general, most designers prefer the flexibility of Von Neumann and the speed
    of Harvard. The most common solution in microcontrollers today is to have one
    unified address space - with at least two (sets of) busses. This is often called
    "Modified Harvard", but it might be more to call it Von Neumann on the architectural
    level and Harvard at the implementation level.


    The early CPUs had special "In" and "Out" instructions for manipulating external
    hardware - peripherals. This is basically abandoned, and peripherals are now mapped
    into the addressing space - still often called the memory space. This means that
    when you map the 4 GB of address space for a 32-bit MCU, you will find blocks
    for respectively RAM, Flash and peripherals. We will look at this in Section 4.1,
    where we will see that the overall unified memory map in the various Cortex-Ms
    is more or less a standard.


