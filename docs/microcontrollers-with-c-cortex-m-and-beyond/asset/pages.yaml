  md: 'CHAPTER 3. AN EMBEDDED SYSTEM


    # 3.6 The Cortex Families


    After having discussed several generic concepts we will look at the Arm Cortex
    profiles.


    There are three main Cortex profiles - together spelling A-R-M:


    +   - Cortex-A

    The A stands for Application. These are more classic CPUs than the other Cortex''s.
    Cortex-A sports an MMU - Memory Management Unit. This opens up for fully separated
    processes with virtual memory. In a project we used an NXP i.MX7 with two Cortex-A7
    cores. We took advantage of Linux'' SMP - Symmetric Multiprocessing. We did plan
    to decide which processes would go onto which core but we ended up leaving it
    to Linux. It was quite a feat to convince the organization that indeed could use
    Linux - a non-real-time OS for a job which required very accurate time-stamping
    of samples. We ended up some faith on the fact that the device also contained
    a Cortex-M4, which could run a real-time OS if needed a bit like having money
    in the bank. In the end we never used the Cortex-M4. The combination of HW-buffering
    in the device, together with DMA and a fast Linux, meant that the non-real-time
    Linux had no problems.


    +   - Cortex-R

    The R stands for real-time. These devices offer high performance and the lowest
    latency. However, it''s not real-time but also the safety features that define
    Cortex-R. A good example is the Hercules family from Texas Instruments. The high-end
    Hercules devices come with Cortex-R dual cores that run in Lockstep 2- meaning
    that they run the same program and an exception is raised if the cores disagree.
    An important application area for Hercules and the likes is automotive and other
    transport where people''s life may depend on correct execution. Arm-R requires
    that the built-in MPU - Memory Protection Unit is used. Where FreeRTOS would be
    a good RTOS on Cortex-M, you would typically choose its sibling SafeRTOS on a
    Cortex-R device.


    +   - Cortex-M

    The M stands for Microcontroller, and this family is the one we will talk about
    most in this book. One thing that separates Cortex-M


    > Some high-end Cortex-Ms are now also available with dual-core lockstep'
