    The exception-handler can now be normal C. An exception-handler should not expect
    any parameters, but the code can mess around with R0-R3 - usual. If more registers
    are to be used they must be pushed first and popped after returning - usual. The
    really clever thing is that the return can be executed as usual. When the exception
    happened, the hardware put a special code in the LR - see Table 7.6 We see this
    value in the debugger''s view of the call-stack - see Figure 7.5 where it is 0xfffffff9.
    When the normal return statement is executed, the hardware recognizes this because
    it is an invalid address - as can be seen in the memory map back to Figure 4.1.
    From code in LR, the hardware can see that this is a return from an Exception.
    The hardware will unwind the stack frame, picking out the PC to return. The code
    in LR also tells the hardware whether to move on with the PSP or the MSP, and
    whether we go back to Thread-mode or stay in Handler-mode (if we were in a nested
    exception). The stack-frame is shown on the right side of Figure 7.4.


    The more complicated left is what happens when the FPU and its registers are in
    play. Here Arm has introduced “Lazy Stacking”- in the Floating-Point Context Control
    Register - FPCCR - you can configure whether you want to enable the use of FPU
    in interrupts, by setting the ASPEN flag. This is by default. When ASPEN is set,
    the following happen. When in thread-mode - an FPU-operation is started, the Core
    sets another flag in the same register. At the time of the exception, if the FPU
    was used in the application, the Core makes room on the stack for all the FPU-registers
    - but does not yet copy them onto the stack. It just decrements the SP (much)
    more than normally. If - now in handler-mode the Core “meets” an FPU-operation,
    it checks whether the interrupted application was using the FPU. If so, it copies
    the FPU-registers from the application to the allocated stack positions - just
    in time before using them in the handler.'
