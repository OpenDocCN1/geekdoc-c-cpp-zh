    # 7.5.2 Branches


    Even if you do not write assembly code but only debug with C and assembly mixed,
    it is beneficial to recognize the different changes in flow branching - as well
    as conditional instructions. In my experience many assembly languages have one
    name for calling a subroutine/function and a completely different name for the
    simpler jumps used in loops. As an example 80x86 use call for functions - and
    jump for unconditional jumps, with e.g. jnz for a conditional “jump-zero”. I have
    also seen languages using the term “branch” for one of the above changes in the
    program flow, but I started working with Arm I had not seen “branch” used for
    both. As explained in Chapter 7, Arm even uses “branch” for function return. Every
    change of flow is a branch in the Arm-world. When you are used to C-programs where
    there is a very clear distinction between calls and loops, the first meeting with
    Arm’s assembly languages is confusing. You cannot see the difference between a
    function call, a loop and a function return. Table 7.10 shows the types of branches
    and their main use. Note that “Rm” here is any register R0-R15.'
