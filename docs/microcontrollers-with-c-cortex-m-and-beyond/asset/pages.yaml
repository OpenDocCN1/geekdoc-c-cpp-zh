  md: '# Chapter 1


    # Introduction


    The aim of this book is to give you - the reader - a better understanding of what
    goes on in an embedded system. Using a mix of theory and examples, we will work
    our way through complex subjects from different perspectives. Following software
    from C-source through the compiler and linker - into the memory - we will get
    a taste of assembly code. Studying how different types of memories are used in
    embedded systems, we will see how they are accessed and controlled by the CPU-core.
    Looking at the modern microcontroller, we will see if it perform floating-point
    operations. Armed with the above knowledge we will see how operating systems work,
    and we will discuss important patterns for parallel processing.


    You can find DIY books and videos for many development boards that will show you
    how to get to a point where you can run the samples. It is however, also necessary
    to get a wider understanding of why we do what we do - and could we get it better
    or faster?


    A development is a PCB - Printed Circuit Board - from chipvendor. Originally these
    were created for use by professional developers for prototyping and verification
    of key performance - before an important component like a CPU was selected. However
    concepts like Arduino, Raspberry Pi and Beaglebone have been huge successes -
    reaching far beyond professional developers. I have no doubt that these concepts
    meant an increased interest in the specific CPUs used in these designs - as well
    as a general interest in embedded systems. This has motivated other vendors of
    CPUs to create more accessible development boards - and even target some of these
    schools and hobby-programmers. Hobbyprogrammer today - job-creator and customer
    tomorrow. This means that the last many years of hobby programming for PCs, Macs
    and phones have now worthy competition in the embedded world.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# CHAPTER 1. INTRODUCTION


    A development board contains an embedded chip - in our case a microcontroller
    (MCU) - from the silicon vendor, but also glue-logic and peripherals that allow
    you to easily try out the MCU in this investigation. There will also be some accessible
    software to help you in this investigation, and with the surge of hobbyists, interesting
    samples for some fun peripherals. We will also start with a sample and development-board,
    but I hope that reading this book will give you a deeper understanding - not just
    of the “how” - also of the “why”.


    My first book on embedded programming was “Embedded Software for the IoT”. The
    3rd edition was published by De Gruyter in 2019. So why this new book? The IoT
    book mainly outwards - at connectivity, with focus on TCP/IP, Ethernet and Wi-Fi,
    in transmissions and “Industry 4.0” subjects like process-control. The IoT book
    also looks at development processes and general software tools like it.


    In contrast, the book you have in how looks inwards - at the CPU architecture,
    interrupt frames, memory-spaces, floating-point, instruction sets etc.- all from
    C-programmers point-of-view. This inward looking is indeed a huge subject. I narrow
    it down by mainly using examples from the Arm Cortex-M range of Microcontrollers’.
    This focus makes sense because the Arm-Based System-on-Chip (SoC) is everywhere.
    The SoCs are marketed by silicon vendors like NXP, Renesas, Texas Instruments,
    Nordic and many others. Arm never makes a single chip - they sell IP - Intellectual
    Property. The silicon vendors add various peripherals and memory to the design,
    and then market this as “IC combo”. They compete in the speed, flexibility, robustness,
    space-requirements, temperature-interval and power usage of the solution - as
    well as development tools and price.


    The IoT-book started with Operating Systems - in the Arm world this leads to Cortex-M
    CPUs. In this book I am focusing on the Arm Cortex-M core - most related to bare-metal
    systems (without an Operating System) because we can learn a lot way. We will
    also discuss real-time operating systems, as well as parallel programming and
    other more general subjects.


    The aim of these investigations is not so much to show how to utilize various
    peripherals. Instead, we will dig into how code is generated, loaded and executed
    in C and a bit of assembly language. While doing this we will examine central
    concepts and components, and discuss important patterns in e.g., parallel programming.


    > We will get back to the difference between CPUs and Microcontrollers'
