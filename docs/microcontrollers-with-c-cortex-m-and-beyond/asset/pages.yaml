    from basic flip-flops, we need clocks to drive signals through the gates. In this
    sense, clocks are connected everywhere. The MCU will typically have several clocks
    - often derived from the same "Clock-Base". This base can be accurately set with
    an external crystal. If the crystal is faulty or not present, the clock-base is
    normally derived from an RC-circuit. You may programmatically decide which clock
    goes to which peripheral - even if at times you want a given clock to pause. In
    modern electronics the power-consumption is almost a linear function of the clock.
    This means'
