  md: '# 4.3. FAST MEMORY ACCESS


    Bit-banding is an optional feature for the silicon designers using Cortex M0/M0+/M3/M4.
    It is almost always included in Cortex-M3 and Cortex-M4 designs.


    The bit-banding concept shows one of the advantages of having a 32-bit addressable
    memory space in a minor embedded product. There is no way we will take advantage
    of the full 4 GB memory/peripheral addressing, so "wasting" 64 MB on this aliasing
    is not a problem.


    Bit-banding is not included in Cortex-M7 - probably because M7 ports caching in
    the relevant regions. Likewise, bit-banding is not supported in the Armv8-M architecture
    - used e.g., in Cortex-M23 and M33.


    # 4.3 Fast Memory Access


    Earlier we discussed the use and purpose of the three internal buses - IBus, DBus
    and System-bus. It was stated that the Ius works on the Code Region from 0x0000
    0 to 0xffff ffff, but we now know that code may be executed from external RAM.
    So how are instructions fetched? The answer is in the Cortex M4 Processor Technical
    Reference - see Table 4.4.


    Most instructions are executed in one clock-cycle. At the max clock speed of our
    STM32F334RTX - 72 MHz - an instruction is done in 14 ns. At this speed Flash access
    requires the core to insert two Wait States. This is necessary even when the Flashprefetch
    hardware helps us. When accessing CCMRAM - Core-Coupled RAM - we do not need any
    wait states. This RAM is fast. Core-Coupled simply means "coupled closely" to
    the core - no bus-transitions. The Cortex-M7 we can have clock-speeds up to 480
    MHz. The M7 has Instruction-Cache and Data-Cache, but when these caches miss (they
    do not contain copy of the requested memory), M7 also needs to wait in order to
    access Flash at this speed. The Cortex-M7 has I- and D-TCM. These are Instruction
    and Data Tightly Coupled Memory - like the CCMRAM. The idea is in both the M4
    and the M7 that special "inner-loop functions" can be moved to these memory-types.'
