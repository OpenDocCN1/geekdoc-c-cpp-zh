  md: '8.3. CMSIS-DRIVER - LOW-LEVEL


    # 8.3 CMSIS-Driver - Low-Level


    Now we turn to the vendor-supplied things in CMSIS-Driver. Let us take

    a look at how GPIO is defined at the low level in the sample-board - the

    STM32F34R8. GPIO is short for General Purpose Input/Output. GPIO

    is one of the most basic peripherals in an MCU. This will benefit us in

    Chapter 13 where we use GPIO for an interrupt. A selected part of the

    LL - Low-level - GPIO functions is shown in Listing 8.4 This is also

    shortened a bit - e.g., by moving curves after the final “z” in functions.

    While we look at the low-level functions, we need to keep an eye on

    the base addresses and the typedef for GPIO. These are found in

    t file stm32f34x8.h - from which selected lines are shown in Listing

    8.3. It is also in this that we see the base-addresses for Flash, RAM and

    ipherals - as well as the Bit-Band addresses for the latter. Two

    should be recognizable from the Memory-Map back in Figure 4.2. Stepping

    through the registers in the typedef in Listing 8.3 we have the basic Port:


    +   * MODE Register

    GPIO is typically used as single-pin I/O but often gotten in Ports

    here with 16 bits. This allows us to use e.g., port as a16-bit wide

    data-port. In modern MCs the limiting factor is not so much the

    internal functionality the pins available - we will therefore often

    strive to use serial I/O instead of parallel. We do make what we can to

    utilize every pin to the utmost. This is the pin-multiplexing

    described in Chapter 3. That is why we have the Mode-register -

    allowing to configure ports as Input/Output/Alternate/Analog.

    The choices are found in stm32f3x_ll_gpio.h in Listing 8.4. With

    choices we need two bits per pin - fitting nicely with 32-bits to

    configure 16-pins. LL_GPIO_SetPinMode does the job.


    +   * Output TYPE Register

    The output-type gives us two choices per pin (when it is used as

    output). We see in Listing 8.4 that the choices are Push-Pull and

    Open-Drain. “Push-Pull” simply means that we will drive (push

    and pull) the outgoing line on the PCB low or high for respectively

    0 or 1. “Open-Drain” means that the output can be connected to

    other outputs which is normally a bad idea. With open drain and

    pull-up, a 0-bit will connect the output. A 1-bit will however

    keep the output floating. In the system there is a pull-up resistor

    uring the high level - when all outputs are set to binary 1. The

    resistance is low enough to tie the lane to when all outputs are'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'floating, also high enough to assure that when a single output is set to low,
    this output will pull down the lane, without pulling too much current through
    the pull-up resistor. We basically now have an AND function of the outputs. You
    can also have pull-down, in which case 0 or low is the passive state, and a single
    1 or high will cause the lane to go high. Like OR-function. This concept can e.g.,
    when used several slaves are sharing an SPI-bus. The active slave drives the line,
    if all slaves are configured to open-drain and only one output is active. LL_GPIO_SetPinOutputType
    does the job.


    +   * Pull-Up-Down Register

    With the above circuitry, we can select between Pull-Up, Pull-Down and nothing.
    LL_GPIO_SetPinPull is helpful here.


    +   * Output SPEEDR

    You can set the output speed - the slew-rate of the digital transitions on the
    output. You normally want this, as fast flanks generate EMC noise in the system.
    LL_GPIO_GetPinSpeed shows how to read the speed configuration. All the other settings
    also have “get” functions.


    +   * Input Data Register

    LL_GPIO_ReadInputPort reads the entire 16-bits from the port into the low half-word.


    +   * Output Data Register

    LL_GPIO_WriteOutputPort writes all 16 bits from the low half-word.


    +   * Bit-Set/Reset Register

    To set a single output bit, you might expect that we would need to read the current
    output, OR with a bit at the right position, and write it. This can however, cause
    problems as we know that Read-Modify-Writes can be interrupted. Read-Modify-Write
    also take time. The BSRR comes to assistance. A bit set (1) in one or more of
    the lower 16 bits will reset (clear) the corresponding pin. A bit set (1) in one
    or more of the upper 16 bits will set the corresponding pin (subtract 16 from
    bit-no to get pin). Bits that are not set (0) will change nothing. LL_GPIO_SetOutputPin
    is used here.'
