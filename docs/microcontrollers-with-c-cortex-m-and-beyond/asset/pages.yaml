    FreeRTOS is a good example of an RTOS for MCUs without virtual memory and processes.
    FreeRTOS allows a task to block when reading from an empty queue - when writing
    to a full queue. Data - C-structs - copied to the queue. We will see this in Chapter
    13. The argument is that for small structures this is efficient, as the sending
    task is immediately free to overwrite or discard its own copy. This makes the
    control sampler. A task may prefer not to include large data-sets - only a pointer
    to shared memory. With the sender writing to such a structure and the receiver
    "knows" when it gets a pointer, it can read safely from it - the sender is done
    writing. The queues can be used from interrupts and support both streamed and
    message-based communication. Streamed communication can be data from a hardware
    interrupt, while messages can be used for various thread-to-thread Structs, where
    you want to keep boundaries of messages as they are sent. This is much like TCP
    (streamed with no boundaries) and UDP (message-based keeping boundaries). The
    FreeRTOS concept is very elegant, but unfortunately is basically made for one
    writer and one reader of every queue. As with "normal" mailboxes in an embedded
    system is not terribly limited by having one reader of a mailbox, but only allowing
    one writer can be a problem. There are ways around - but not so elegant.


    # 12.7 Ring Buffers


    If you have a system of tasks that together realize the Pipeline-concept outlined
    in Section 12.5, you will have a data-flow from task to task. You may queue data
    as messages between task, but you might prefer a shared-memory Ring-Buffer. Ring-buffers
    are often used with simple datastreams with constant flow - e.g., samples from
    an A/D-Converter, SPDIF or similar. A ring buffer is shown in Figure 12.8.


    The concept is simple: We simulate a circular memory buffer. One task always writes
    and the other always reads. The reader may be, woken by a timer-tick, or from
    an interrupt, and reads until it reaches the write-pointer and then blocks. If
    the reader overwrites the writer it will re-read old samples. The writer may also
    monitor whether it passes the read-pointer. In this case it''s about blocking,
    but rather logging an error, because this means loss of data. There are a few
    things to observe:'
