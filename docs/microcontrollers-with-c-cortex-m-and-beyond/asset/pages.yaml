  md: '# Chapter 12


    # Common Patterns


    Chapter 11 described the absolute basics of an Operating System - or rather a
    Real-Time Operating System. In this chapter we will look into the various concepts
    and constructs - patterns that we need, in order to deal with concurrent or parallel
    work. If an OS or RTOS is available, it will help us in many ways - if not, we
    need to do more work. Several patterns are not specific to parallel systems, but
    I have chosen to include them, because they become even more important here.


    # 12.1 Layering


    There is an old rule or guideline that I would like to mention when it comes to
    writing software: Strong Cohesion - Low Coupling. This rule can be applied to
    functions as well as classes and modules. According to Oxford Languages “cohesion”
    mean the action or forming of a united whole”. I interpret “coupling” to mean
    “dependency” in the above context. The idea is that a function should basically
    do one thing - without side effects - e.g. `sin()`. A module or a class should
    contain functions and data that belong together - it trigonometry. Thus, you will
    find `cos()` in another function - but in the same module or class, and you will
    not find `LED_ON()` in the trigonometry module or class. It''s all very clear
    and pure with math, in real life it''s not so easy. But it is worth trying.


    In real life we have dependencies - but we can try to be aware of them, and only
    have way. Whenever I am introduced to a new embedded system I always look for
    the layers. This is an important pattern - not only in concurrent or parallel
    code, but always. The simple rule of a layered system is that each layer only
    “knows” about layers below it.'
  merge: -1
  pgno: 174
