    The upside of DRAM is the much higher density - and therefore MB per Dollar as
    well per square-inch. SDRAM is essentially DRAM running at a speed that is synchronized
    with the CPU frequency. When you get Double Data Rate RAM that can be accessed
    on both flanks of the clock - DDAM. These come in faster and faster generations
    - like DDR5.


    When you buy a PC, you can basically buy the DRAM-type that you can afford, but
    you never see PCs advertised with SRAM. PCs need the high density for many Gigabytes
    of RAM, and the DRAM-controller normally handles the refresh.


    So why do we use SRAM in MCUs? The thing is, if you leave SRAM with the voltage
    applied, but don''t use it, it uses no current. Since P = U *, the power consumption
    of an idle SRAM is close to zero. If the MCU sleeps the RAM power goes down -
    without any factory


    Many CPUs and MCUs come with some ROM from the factory. This is typically some
    kind of bootloader - e.g., BOOTP - allowing you to boot from an Ethernet connection.
    It can also be code related to security, as well as guaranteed unique MAC-addresses
    and serial numbers. OTP - One Time Programmable - is also used for serial numbers.
    - but this is not the chipvendors serial number but that of the board.


    Even though Flash can act as EEPROM, you still see EEPROM being used. It can (still)
    survive more rewrites than Flash. EEPROM is also easy to read and write to.


    Flash is a complex subject. We have two kinds:


    +   NOR-Flash

    This is relatively fast to read, but slow to erase and, you rarely see read-errors.
    This makes it ideal for reading with directaddressing - and thus for in-place
    execution of code - directly from boot. The downside is the low density - it costs
    more per MB. The upside is a fast boot, a less-complex system and less need for
    RAM. If you think the above sounds like a typical microcontroller, you are right.


    +   NAND-Flash

    This is relatively slow when reading, and read errors occur regularly. The good
    thing is that it has a high density and thus can deliver many MB of program-space.
    If you use it as an SSD disk,'
