  md: '# 3.2. A GENERIC EMBEDDED SYSTEM


    speeds are so high today, that you cannot send internal CPU-signals through a
    flat-cable without getting numerous bit-errors. Instead, most CPUs and Microcontrollers
    have internal logic for debugging and use the JTAG or a Serial-Wire Debugger (SWD)
