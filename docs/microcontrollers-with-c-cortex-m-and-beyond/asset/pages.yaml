    window allows us to see memory in 1, 4 or 8 bytes - and we can also select between
    big- and little-endian. Figure 5.1 shows a very small part of the screen - with
    VS Code in a more paper-friendly mode than the usual bank.


    We know that the stack-pointer must be set to point to the end of the RAM section.
    The stack-type is known as Full Descending. We already know that it grows downwards
    - the same as descending. "Full" means that when not in the midst of an operation,
    the stack-pointer - SP - points to a full memory - something stated earlier. Thus,
    at the next Push operation, the stack-pointer will count down first and then store
    data. This means that we can safely let the stack-pointer at the first address
    after the RAM. Our RAM starts at 0x2000 0000. This MCU has only 12 kB of RAM -
    corresponding to 0x3000. From all the above, we will expect the SP to be loaded
    with 0x2000 3000. This also fits with the linker-map back in Listing 4.7. In Figure
    5.1 the memory area at the bottom, we will recognize the expected SP - 0x2000
    3000 at address 0.'
