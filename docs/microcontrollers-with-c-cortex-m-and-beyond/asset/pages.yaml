    \ = ALIGN(32); /* Align MPU to 32 Bytes */\n = _MPUstack_chk_guard = ; /* MPU\
    \ guard symbol declared */\n = + 32;\n /* Allocate minimal MPU Area */\n = + _Min_Stack_Size;\
    \ /* Allocate Stack */\n = ALIGN(8);\n} >RAM\n```\n\nsample is run on a Cortex-M7.\n\
    \nBefore we start writing to the MPU we call the Data-Memory-Barrier to ensure\
    \ that data in the pipeline is delivered. Then the MPU is disabled to avoid any\
    \ exceptions during configuration. The number of regions are read and compared\
    \ to our expectations. On a Cortex-M4 we expect 8 if an MPU is present, while\
    \ on a Cortex-m7 we expect 8 (F7 version) or (H7 version). Now, the privileged\
    \ default layer is enabled. This means privileged code has access as defined by\
