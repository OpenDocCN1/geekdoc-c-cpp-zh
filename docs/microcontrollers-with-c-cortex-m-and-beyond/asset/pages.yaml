- img_proc: true
  md: 'in an overflow inside the function. To avoid such an overflow, each 64-bit
    multiplication-result is right-shifted 14 bits before being accumulated in 64-bits.
    So now we accumulate 16.48 bit numbers - 14 bits more in the integer part and
    14 in the fraction. The library function returns this to our program.


    +   - After having done all all the intermediate accumulations in 64 bits it is
    OK to round the result into 32 bits. In C simply right-shift 32 bits and cast
    the result to a 32-bit value. Right-shifting can be tricky. "logical" right shift
    always inserts zeros into the most significant bits. What we want is an "arithmetic"
    shift which always copies the sign when shifting bits from the left. In this special
    case we work with squares which are always positive, but we want it neat and tidy.
    The good thing is that gcc for Arm do use arithmetic shifts for signed data. We
    take our 16.48 bit number and throw away the bottom 32-bits - and then we have
    a 16.16.


    +   - The above number is now cast - converted - to a float.

    - The cast works on integers - it does not "know" about invisible binary point.
    We need to manually "shift" the 16 bits. This is done by dividing by 0x10000.
    Had we done this operation on the integer, we would have thrown away 16 bits and
    created an underflow. Performing the division on the float simply adjusts the
    mantissa, and we keep the float''s 23-bit accuracy.


    +   - Finally, we divide the result by the number of samples - just as before.
    This is part of the equation for calculating power - not a number format trick.


    In the end we get exactly the same result as in the float (f32) version. Unfortunately,
    we spend more than twice as cycles as the integer dot-product as we do on the
    simple-loop with floating-point. This can be seen from the printout that includes
    the previous exercise with unrolled power-loop and library-version of sine-generation:


