  md: '# 12.9.4 Semaphore


    Semaphore is the marine concept of signalling by using two flags in differ- positions.
    In the programming world semaphores are often a service from the OS. There are
    similarities with Mutex - but also differences.


    Where a Mutex always only allows one task to access the shared re- source - it
    is said to be binary - semaphores may also be binary, but alternatively they can
    be counting. This means that a semaphore can be configured to allow e.g., five
    active tasks - using the same semaphore - but will block the sixth that asks for
    a pass. Where the Mutex concept is completely symmetric, the Semaphore concept
    is not. One party always posts - or signals - while the other party listens. Signalling
    a semaphore never causes a thread to block, and is therefore allowed from an interrupt.
    Since both “ends” are not blocked, priority inversion does not come into play
    with semaphores. In CMSIS-RTOS a different terminology is used; one task or interrupt
    Releases a Semaphore and another task Acquires it. We will see an example of this
    in Chapter 13.'
