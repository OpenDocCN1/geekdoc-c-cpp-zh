    # 4.2 Bit-Banding


    In many cases we have things going on in parallel that the same memory location
    or peripheral register. It can be DMA while executing normally, it can be multithreading,
    multiple cores, or another CPU on the board. Even in a simple single-core, bare-metal
    system we can have an interrupt routine that works on a resource that is shared
    with the main program. When we set or clear bits that control hardware or software
    switches, we need to take care.


    Normally, you cannot simply set a single bit in a register or in memory. You need
    to perform a Read-Modify-Write. If the interrupt happens after the main program''s
    read, but before the write, the interrupt routine might do its read-modify-write,
    which the main program would wrongly overwrites when it gets access to the CPU
    again. We will look closer at this in Chapters 11 and 12.


    Since we are now decoding the Cortex-M memory map, I will focus on one specific
    solution to the problem, introduced by Arm: Bit-Banding. The bit-banding concept
    involves two special regions of memory - one is mapped to an important part of
    the peripherals, whereas the other is mapped to a memory area. See Figure 4.2.


    The mapping is not a "normal" alias - like the one we have for the code starting
    in 0, where memory areas are mapped one-to-one. In the bit-banding concept Arm
    has mapped a full 32-bit word to the alias memory region to a single bit in a
    lower-addressed region. It is only bit 0 in the alias that is used - the remaining
    bits are ignored² We can write 0xffff fff or 0x0000 0001 - it doesn''t matter
    which - to address 0x0200 0004, and it will set bit 4 in 0x2000 0000. The design
    assures that this is done with a hardware-based - atomic - read-modify-write.
    The concept is also shown in Table 4.3.


    Listing 4.1 is a C-macro from Texas Instruments - implementing the bit address
    formula given by Arm. The first line assumes that the offset between the alias
    and its target is the same for memory and peripheral bit-banding. Line 2 further
    assumes that the base-address ends with 7 zeros in both cases - the same as saying
    that the target base


    > ²This of course means you cannot use the "alias" regions as normal RAM'
