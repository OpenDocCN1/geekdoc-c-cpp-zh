    Not shown in the figure - but also important:


    +   * External Memory

    External Flash and RAM serve the same purpose as the internal versions. They just
    give us more of the same - and they may be shared with other intelligent ICs.
    There may however be differences in access time - which translates to speed. Sometimes
    it is possible to go into a sleep-condition where external memory is powered down,
    while the internal keeps working. This can be problematic with RAM as it requires
    reloading if completely powered.


    +   * External Peripherals

    Again this can be more of the same. There is however, functionality that you prefer
    entirely. This can be e.g., by components that consume a lot of power - like load-balancing
    of Lithium batteries, or voltage regulators. Power equals heat. It is also my
    experience that the best A/D-converters are “standalone” devices. There is so
    much digital stuff going on in a core that it is more or less impossible to avoid
    EMC-related noise in internal ADCs.


    +   * Buses

    Figure 3.1 shows arrows leading to the internal memory and peripheral components.
    These are called “Buses” because they represent a lot of Data and Address lines
    that travel the same path. In older literature you often see a data-bus and an
    address-bus - counting as two buses. However, all the buses we use in the Arm
    documentation contain both address and data lines, typically also numerous control
    signals. Today such a set of address- and data-bus with control-signals are often
    just termed a bus.


    An external bus is typically 16 or 32-bit wide, while internal buses may be up
    to 64-bit wide. There may be separate buses for various types of memory, or everybody
    may be on the same bus. The technology applied to these buses is a key performance
    parameter.'
