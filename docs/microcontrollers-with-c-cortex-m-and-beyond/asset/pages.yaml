    # 7.5 Instructions


    The instruction set for the Armv7-M is described in detail in DDI0403E - Armv7-M
    Architecture Reference Manual - over several hundred pages. To this we can add
    the DSP instructions. A leaner version is found in DUI0555 - Generic User Guide.
    This only takes 120 pages and is worth browsing. I can also recommend STM''s PM214
    - Programming Manual for Cortex-M4 - for which most parts also cover Cortex-M3
    and Cortex-M7, as they are based on the same Armv7 Core (Armv7E with FPU for M4
    and M7). We have already touched on the following:


    +   - push and pop of registers as well as multiple registers - using curly braces.


    +   - mov for copy of registers or constants - mov r3, #0


    +   - add and sub for adding and subtracting.


    +   - Append "s" on e.g. the above mov, add, sub to set the flags.


    +   - Use of three operands - adds r4, r0, r3 is effectively "r4 = r0 + r3" (and
    sets the flags).


    +   - Load register from memory and store register to memory using "literal pool"
    for constants in: ldr.w sp, [pc, #52].


    +   - Use of square-brackets to signify indication, The following loads r4 with
    what the sum of r2 and r3 points to: ldr r4, [r2, r3].


    +   - cmp - like sub, but not storing the results - only setting the flags - e.g.
    cmp r4, r1.


    +   - Assembler Directives


