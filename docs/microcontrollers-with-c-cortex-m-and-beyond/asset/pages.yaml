  md: '# Chapter 6


    # Toolchains and IDEs


    # 6.1 Arm Compilers


    We use the term “toolchain” mainly to refer to the C or C++ compiler and the libraries.
    This is a huge topic - especially in the embedded world. Compatibility is a keyword.
    Contrary to your desktop compiler, Embedded compilers are cross-compilers - they
    run on a desktop host platform (Windows, Linux or Mac), and they generate output
    for an embedded target platform. In this case a “platform” is the combination
    of hardware and operating system. This means that we face a multitude of combinations
    of host and target platforms. Not all of these combinations exist - e.g. I cannot
    find a compiler that runs on Mac and builds code for a Linux target. You can however
    get far with virtualization. I used to run Linux as a “guest” OS on a Windows
    system. This means my Linux system a guest in the Virtual-Machine world and a
    host in the embedded development world. I must admit that I got a bit tired of
    this in the end and installed a “real” Linux PC.


    When it comes to cross-compilers there is a naming concept with four (sometimes
    five) fields separated by dashes: a-[b]-c-d-e. Note that the host-platform is
    not included in the naming concept. This is mainly because there are fewer misunderstandings.


    +   * a: Target  Architecture. arm in our case.


    +   * b: Vendor  This field is optional. Typically, none - also from vendors like
    Keil.


    > I have an embedded compiler running on a Raspberry PI - building code for the
    PI itself, but this concept seems to be discontinued'
