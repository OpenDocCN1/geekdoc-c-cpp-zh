  md: '```

    .section .text.Reset_Handler

    .weak Reset_Handler

    .type Reset_Handler, %function

    Reset_Handler:

    ldr sp, =estack / Atomic update: set stack pointer /

    /* Call the clock system segment initialization function.*/nbl SystemInit

    /* Copy the data segment initializers from flash to SRAM */

    ldr r0, =sdata

    ldr r1, =edata

    ldr r2, =sidata

    mvs r3, #0

    b LoopCopyDataInit

    CopyDataInit:

    ldr r4, [r2, r3]

    str r4, [r0], r3

    adds r3, r3, #4

    LoopCopyDataInit:

    adds r4, r0, r3

    cmp r4, r1

    bcc CopyDataInit

    /* Zero fill the bss segment. */

    ldr r2, =ebss

    ldr r4, =ebss

    mvs r3, #0

    b LoopFillZerobess

    FillZerobess:

    str r3, [r2]

    adds r4, r2, #4

    LoopFillZerobess:

    cmp r2, r4

    bcc FillZerobess

    /* Call static constructors */

    bl __libc_init_array

    /* Call the application''s entry point.*/

    bl main

    LoopForever:

    b LoopForever

    ```'
