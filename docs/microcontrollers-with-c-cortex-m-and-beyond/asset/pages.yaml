  md: '# 12.9. SYNCHRONIZATION PATTERNS


    Listing 12.4: Load and Store Exclusively to get a Lock


    ```

    TestLock

    LDREX R3, [R2]      ; Read lock val

    CMP R3, #0           ; Set flags on the value

    STREXQ R3, R0, [R2]  ; If clear - then write

    CMPQ R3, #0           ; Check return val

    BNE Test #0           ; Try again if failed

    ```


    Older MCUs have a Swap instruction that could be used for Test-And-Set. As we
    have seen in Chapter 4, Bit-Banding in Memory can be used for this purpose. However,
    not all Cortex-Ms have Bit-Banding, so this is not possible.


    Cortex-M3 and others have the Load-Exclusive and Store-Exclusive instructions.
    The LDREX instruction starts a HW-monitor that ends by the STREX (or a CLREX).
    There are also Byte and Half-word variants - ending with respectively "B" or "H".
    When the store is, it returns a zero if no other threads or processes have anything
    in the meantime. The concept even works on multicore CPUs due to the hardware-based
    state-machine.


    These instructions can be used to perform Read-Modify-Write operations. A lock
    can be realized by doing a busy-wait - implementing a spin-lock as shown in Listing
    12.4.


    # 12.9.3 Mutex


    The term Mutex comes from "Mutual Exclusion". Like a lock, it is about only allowing
    access to one of several parties. If the waiting time gets long that we do not
    want to do a busy-wait, we could build a task-yield into the loop in Listing 12.4
    - if we have an RTOS. Taking it step further could let us wait for a specific
    time in the loop - and then try again. Now that we have involved the RTOS - why
    not let it hold the key and simply wake us up when we are good to go? This is
    essentially a Mutex.


    Most operating systems - real-time or not implement Priority Inheritance for Mutexes.
    This means that if a high-priority task is waiting for a low-priority task, then
    the low-priority task will inherit the priority of the high-priority task. All
    tasks using a Mutex are using it in the same way, and they may get blocked. Thus,
    you cannot use a Mutex from an interrupt.'
