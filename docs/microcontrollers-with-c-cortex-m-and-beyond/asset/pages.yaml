  md: '# 13.5. CMSIS-RTOS


    ![](img/69d98ec09091a2e578a01890f5577862_216_0.png)


    Figure 13.8: Build Analyzer


    # 13.5 CMSIS-RTOS


    The code in this chapter used CMSIS-RTOS v2 as an intermediate layer between my
    code and FreeRTOS. STM32CubeMX generated the configuration of the tasks, queue
    and semaphore, and I could focus on using the RTOS objects from the tasks and
    callback. The code could not have been simpler. I can use the same code for operations
    in an Interrupt Service Routine, whereas if I use the FreeRTOS interface directly,
    I need to use different functions for getting data queued by a task versus queued
    by an interrupt. In either case I am not allowed to have any timeout inside an
    interrupt. A queue-reader in an ISR must first test the queue for content and
    simply bail out if the queue is empty. Similarly, a writer in an ISR must test
    whether the queue is full and bail out. Looking back, the hardest work in this
    chapter was related to getting printf output in the debugger, and that was not
    related to the RTOS coding. Thus, in many ways I will say that using an RTOS via
    STM32CubeMX was a good experience.


    If you browse the FreeRTOS documentation, you will see that while CMSIS-RTOS allows
    you to relatively easy swap to another RTOS later, CMSIS-RTOS also limits your
    “Maneuvering Space”. Using FreeRTOS directly from the code will give you more
    choices. In other words, you get a long-term flexibility using CMSIS-RTOS – along
    with good startup support from STM32CubeMX - but at the expense of some flexibility
    in the current solution.'
