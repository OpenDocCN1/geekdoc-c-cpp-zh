  md: "# # Chapter 2\n\n# # The Tip of the Iceberg\n\nEvery C-programmer knows the\
    \ classic “Hello World” program that you see in Listing 2.1. In this case it was\
    \ written in, compiled by, and run from Visual Studio on Windows - in a project\
    \ created seconds before. It looks very innocent, but, if you have worked with\
    \ C programs on the Desktop, you know that the project has tons of settings, and\
    \ that the `include` statement pulls in selected parts of the standard C-library.\
    \ You may also know that you can build Debug and Release versions from this code,\
    \ and that you may compile to either 32-bit or 64-bit, and these days even to\
    \ Linux.\n\nThe PC-tool, however, provides a fast-track to the common solution\
    \ allowing you to experience the feeling of success very fast. You now have something\
    \ that you can incrementally extend. If you use version control, you may be able\
    \ to go back to a working solution - should you run into trouble.\n\nThe same\
    \ concept exists in the embedded domain. We get fast up and running on a specific\
    \ development-board, and we can grow from there. PC-programmers might at one time\
    \ or be forced to think about Debug versus Release builds, and which optimizations\
    \ they need\n\nListing 2.1: Hello World on PC\n\n```\n#include <stdio.h>\nint\
    \ main() {\n    printf(\"Hello_World!\\n\");\n}\n```"
