- img_proc: true
  md: 'We will see this concept in action in Chapter 5. You can say that the

    Dbus is an Ibus assistant. In some documentation it is called the

    Code-bus, which is probably a better name. The Dbus is also used

    for debug access.


    +   - System-bus - aka Sbus

    The System-Bus can access peripherals and the SRAM area. Bigger

    Cortex-Ms like M7 also use the System-bus for external Memory -

    code and as data.


    To sum it up, we can say that in the Harvard-concept, the I-bus together

    with the D-bus is our Code-bus, where the System-bus is our Data-bus.

    This is however only completely correct as long as we retrieve code from

    The Code region (we will get back to regions shortly).


    The three buses go directly into a Bus Matrix. This is also called an Interconnect
    Matrix. Through this matrix, Cortex-M4 buses are connected

    to numerous buses with various performance and widths. The names of

    these buses are shown on the right side of Figure 4.1 from 0x4000 0000

    and onwards.


    Note that the three main bus are in no form connected to the outside

    world. This means that this particular MCU cannot connect to any external

    memory - RAM or Flash. We have a “true” MCU.


    Also note that the software developer does not need to think about

    using one bus for something, and another bus for something else. As long

    as HW-designers respect the Arm guidelines for memory layout - and

    t system is correctly initialized, the software developer can write

    standard C-code. Typically, the code will be fetched faster from the Code

    region, but it can also be fetched from RAM.


    # 3.7.2 Analog Interfaces


    Our STM32F334R has surprisingly many analog interfaces for a digital

    component - making it a Mixed-Signal MCU:


    +   - ADCs

    Very typical for MCUs, the STM32F334R has two 12-bit Analog-To-

    Digital converters - ADCs. Each of these can multiplex between 14+

    channels - of some are internal - like junction temperature. It

    is possible to run dual synchronized conversions - stereo.


    +   - OPAMP

    There is a built-in Operational Amplifier with multiplexed inputs. It

    can be used as programmable gain-amplifier for some ADC inputs.'
