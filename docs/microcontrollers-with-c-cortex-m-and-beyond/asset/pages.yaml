  md: '# 6.1. ARM COMPILERS


    the overview page we have “Execution Memory”. This relates to Section 3.5. Some
    tests may be performed on the same CPU - but in different CPU clock-speed variants.
    For this reason CoreMark/MHz is calculated for easier comparison. This is not
    completely fair as a fast CPU may need to insert wait-states when reading from
    memory - then performs relatively over the slower version in CoreMark/MHz. So
    not fair if you want to compare compilers. Still you can try to filter on a relevant
    CPU and if you are lucky you may be able to compare compilers. But then you need
    to assure that the compilers compared are using the same optimization. Finally,
    some measurements are certified by EEMBC, while others are uploaded by members
    - but not certified.


    If you want to compare compilers, the safest solution is to download a relevant
    CoreMark test, and try out the compilers on your own hardware. If you do not yet
    have your own hardware, you can go with a relevant development board.


    In general, it seems that on a small CPU system, gcc is a good choice - in execution
    speed as well as benchmarks of the running code. This is partly confirmed by the
    fact that the MCU silicon-vendors IDEs are based on gcc. It also seems that Clang
    may perform slightly better than gcc on systems with many cores, running vectorized
    code. Clang may be a worthy try - if not for general compiling, then for static
    analysis. In this book we stick to gcc.


    If you have downloaded the developer tools for Linux, you have also received make
    - the basic GNU tool for running builds. If on Windows you have downloaded an
    IDE, there will also be a somewhere in there. However, if you want to build on
    the command-line on Windows you also need to get make. As it is not a cross-compilation
    tool it does not come with e.g., the arm-none-eabi tools. Search for GNU make,
    and you will easily find it. If you are tired of adding tools to your “PATH”,
    no harm is done if you copy the folder to the arm tools. Alternatively, you may
    want to go for CMake, which is a more modern tool. Beware that it is easy to find
    classic “makefiles” for various samples, but not always the CMake equivalent.
    On the other hand, the classic make is very complex, with its many built-in rules
    and strange patterns - and it needs a better shell than the “DOS”-shell.'
