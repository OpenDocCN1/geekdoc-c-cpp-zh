    # 4.10 Stack & unaligned with monitors


    On the outset of heap and stack, I want to show how to set up a software-based
    stack "guard". We know that the stack grows downwards. It is not uncommon that
    we underestimate how much data is stacked. If the stack is too small in the linker-script,
    it will grow downwards into the heap area and create havoc.


    A stack guard consists of the following:


    +   - At the end of the linker-script a variable is declared between the heap
    and stack. See Listing 4.10 where the symbol _stack_chk_guard is set to point
    to the end of the heap, and allocate the four bytes.

