  md: '# 9.3. FIXED-POINT


    In any case, we are still working in two''s-complement, and we can add and subtract
    completely as usual - but multiplications are a bit different. If we multiply
    two bytes of type q7 - aka 1.7 format - we will get a number in 2.14 format. However,
    the leftmost two bits are not both the sign, and we can safely shift one bit left
    to shift 1.15 - or q15. This shift is often done silently in DSPs.


    In some cases we want to keep the binary point at a different place to represent
    integers and fractions in the same number. We could e.g., have a 16.48-bit fraction
    part, and a 16-bit integer part containing the sign.


    The concept of moving the point is often used with long series of Multiply-Accumulates
    to give headroom for the additions - avoiding an overflow. In our case we calculate
    power this is especially important. Since the multiplications are squares, we
    always calculate positive numbers, and we need headroom. If we somehow - in other
    algorithms that know the end-result is within the range, two complement wraps
    in a way that allows temporary overflow along the way in an accumulator.


    Listing 9.6 shows our power-calculation once again. Now the barrier instruction
    __ISB() is introduced after the cycle-counter is started, and before it is stopped,
    to ensure that these instructions do not move. Flushing the instruction pipeline
    cycles takes a bit of time, and thus results in a slightly higher number of cycles,
    but it is necessary to get consistent and correct results. The previous assembly
    listings show that the cycle-counts were read at the right time before, but now
    that function calls are introduced this changed.


    Initially a CMSIS-DSP library function is called that converts the already float
    array into a q3 array. The next DSP-function is where we calculate the product.
    The name refers to the product-of of two vectors which is a single number. It
    is also called the scalar product. By using the same both vectors, we calculate
    its power. The function accumulates in 64 bits and therefore claims to return
    a q63 number. This is confusing because the documentation states that it is actually
    a 16.48 number. Looking at the source-code the latter is confirmed. This is what
    happens - in the library function and our program - also shown in Figure 9:2.


    +   - Our sample is in 1.31 format. This means that the value lies in the interval
    [-1,1]. This number is multiplied with itself in the library product-product function
    results in a 2.62 number.


    +   - Accumulating a lot of these numbers in 64 bits could easily result'
