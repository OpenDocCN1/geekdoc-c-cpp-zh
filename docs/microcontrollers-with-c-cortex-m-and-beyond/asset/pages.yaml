    memory - all in sequence. The concept of sharing memory and busses for instructions
    as well as for data is called Von Neumann.


    The Von Neumann concept is especially annoying when doing Digital Signal Processing,
    where you often need to keep the central Multiply-Accumulate as busy as possible
    - typically with each multiplication taking in a pre-defined constant and a data-value.
    This led to the Harvard architecture where you have one set of address and data
    buses for instructions, and another for data. See Figure 3.2. This allows for
    parallel access to data and code.


    DSPs favor the Harvard. If the DSP is running the code of a filter, it will typically
    have the filter-constants stored together with the instructions - sometimes even
    as part of the instructions. The first DSP I experienced - Texas Instruments TMS20C10
    - was based and had a 16-bit instruction word. A Multiply-Accumulate instruction
    dedicated 13 bits of the 16 to a filter-constant. Thus, a FIR-filter would contain
    21 consecutive Multiply-Accumulate instructions in the assembly-source, with each
    16-bit instruction containing a 13-bit constant. Data was fetched in parallel
    with the help of an auto-incrementing data-pointer. I used this DSP in my university
    graduation project in 1983. Later I worked with the famous 8051 microcontroller,
    which also uses the Harvard architecture.


