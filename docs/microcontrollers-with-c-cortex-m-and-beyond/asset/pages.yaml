    # 6.3 Building for FPU


    Back in Section 4.6 where we discussed the Linker, we briefly touched on

    the compiler and linker options for the FPU - Floating-Point Unit. Since

    we use gcc for both functions we use the same options in both places. That

    is where the easy part ends. It becomes quite complex due to history - but

    also because we have two things to configure.


    The first is the “architecture” of the hardware FPU - if there is. We

    must ensure that we declare our specific MCU supports. In the linker

    section for STM32F334R8 this is “mfpu=fpv4-sp-d16”. Tokenizing the

