  md: '# CHAPTER 12. COMMON PATTERNS


    but are needed to assure that things don''t get too parallel. This is often about
    assuring a shared resource is used correctly.


    # 12.9.1 Critical Section


    A Critical Section is a piece of code that you only want one thread to run at
    a time. Once a thread starts on this piece of code, it should continue to the
    end of the critical section. We do not want a context switch to another thread.
    We might not even want a hardware interrupt. The critical section may be used
    to assure that changes to data are coherent before another thread starts using
    the data, or the critical section may perform something that needs to be completed
    in real-time.


    A classic way to implement a critical section is to start by disabling interrupts
    and then enable them when done (only if they were enabled before). This assures
    against both context-switches and interrupts. In FreeRTOS, taskENTER_CRITICAL()
    and taskEXIT_CRITICAL() disables and enables all interrupts or - if so to a certain
    priority.


    The downside is a higher interrupt latency. It is therefore crucial that the critical
    section is quickly executed. The concept can be good for small systems where you
    understand the dynamics of the system - e.g., you can say that in the given scenario
    you can live with a longer interrupt latency. The alternative is to acquire a
    lock or a mutex before executing the critical section.


    # 12.9.2 Lock


    A lock is a well-known concept. If you visit a room where you want to be alone,
    you lock the door from the inside with the only key. When you (finally) leave,
    someone else can get in. You, will lock the door to get a bit of privacy.


    For this purpose we need a way to obtain the key without another thread also believing
    that it got the key. For the years the simple solution was a Test-and-Set operation.
    When you want to obtain a key to a specific lock, you test-and-set the variable
    to one. The instruction returns the value of the cell before you did the write.
    Thus, if you read binary one, you have to try again because someone else beat
    you to it. When you are done with the job you clear the memory cell with a plain
    write.


    If things are very fast, and the wait will be very short, you may test in a simple
    while-loop. This is a Spin-Lock and may even be used within an interrupt function.'
