- "# 编程：Python 编程 - Windows 10 软件与数据库 (Java, Html, C++, C语言编程、初学者编程指南、PHP、网站设计)\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 引言\n\n知道如何开始计算机编程是一个真正的挑战。大多数人对于如何编写计算机代码或编写计算机程序从从何开始几乎无所知。Python\
  \ 是一种容易学习的语言，它的功能远超简单的编程。\n\n它是一种通用语言，最早出现于 20 世纪 80 代，信你不信，它是以蒙提派森剧（Monty Python）命名的。它被广泛用于，从测试微芯片到为世界上一些最大的网站提供支持，再到构建视频游戏。Python\
  \ 是一门小型的语言，接近英语，并包含了数百个第三方库。\n\n由于 Python 与英语相似，因此很容易阅读。它在标点符号方面也遵循非常严格的规则，这意味着不像某些计算机语言，你的代码不会充斥着烦人的大括号\
  \ `{ }`，这些大括号会阻碍阅读。Python 还包含 `PEP 8`，这是一套告诉每个 Python 开发者如何格式化代码的规则，这意味着你总是知道该做什么、在哪里应该换行，并帮助你阅读其他\
  \ Python 脚本，无论它们是谁写的。\n\nPython 已经存在了 20 多年，关于它的代码多。它也是一种开源语言，意味着任何人都可以获取、读取并修改它供自己使用。有很多\
  \ Python 社区小组，用户可以去那里寻求帮助或只是加入通用的 Python 聊天。\n\n在书中，我想谈谈 Python 可以做什么，以及如何在你的 Windows\
  \ 10 PC 上让它运行起来，以及如何使用它。这适用于初学者或更高级的用户，我希望每个人都能从书中获益。\n\n## 为 Python 配置你的 Windows\
  \ 10 环境\n\n所以，你想学习如何在 Windows 10 电脑上使用 Python。你需要做的第一件事是配置你的 Windows 环境，即你的电脑，并为使用该编程语言做好准备。\n\
  \n### 你需要什么\n\n- 一台 Windows 10 台式电脑或笔记本电脑\n- Python\n- Cygwin\n- 一个文本编辑器\n\n让我们一步来看：\n\
  \n### 在 Windows 上安装 Python\n\n为了让 Python 环境在你的 Windows 电脑上运行，你需要完成几件事：\n\n- 下载并安装\
  \ Python\n- 使用 Windows Python 安装\n- 安装包管理器\n\n### 下载并安装 Python\n\n- 首先，你需要下载正确的安装包，请访问\
  \ `http://www.python.org/download/windows/`\n- 点击 Individual Releases（独立发布）\n- 你现在将进入一个版本列表，选择最新的一个\n\
  - 确保你下载的版本与你运行的 Windows 版本对应，以及是 32 位还是 64 位。\n- 如果你运行的是 Mozilla 浏览器，点击“另另文件为”。如果你使用的是\
  \ Internet Explorer，点击“运行”。\n- Python 安装程序将打开，选择谁可以在你的系统上访问 Python——是你或系统上的任何人。点击“下一步”。\n\
  - 现在你需要选择安装 Python 的目录——保持默认选择并点击“下一步”。\n- 勾选接受安装选项并点击“下一步”。\n- Python 现在将开始在你的系统上安装。等待其完成，然后点击“完成”。\n\
  \n### 使用 Windows Python 安装\n\n- 点击开始菜单并寻找 Python v.* ——取决于你安装的版本\n- 你将看到安装了几个项目：\n\
  \    - IDLE – Python GUI – 类似于命令行 Python 提示符，但它有一个图形界面\n    - Module Docs – 一个关于已安装模块的帮助文件\n\
  \    - Python (命令行) – 类似于服务器提示符\n    - Python Manuals – 手册，以备不时\n    - Uninstall\
  \ Python – 希望你永远不需要使用\n\n在可以通过命令行提示符直接访问 Python 之前，我们需要设置 Windows PATH 变量，我们下一步完成。\n\
  \n### 安装包管理器\n\n你很快就会发现你需要安装未包含在 Python 标准发行版中的模块。为了实现这一点，我们需要安装一个包管理器来安装新包。在这一部分，我们使用\
  \ EasyInstall，但之后我还会教你如何安装 Cygwin，以便你可以选择。\n\n- 访问 `http://peak.telecommunity.com/DevCenterEasyInstall`\n\
  - 点击 安装 “Easy Install”\n- 右键点击链接的 `setup.py` 并选择“链接另存为”或“保存目标为”\n- 完成后，在 PC 上找到该\
  \ `.py` 文件并双击运行它。它将在 Python 内部运行并完成安装\n\n\n\n\n为了设置 `PATH` 变量，让 Windows 10 知道去哪里查找\
  \ Python：\n\n*   右键点击`我的电脑`\n*   选择`属性`\n*   在下一个界面中，点击`高级系统`\n*   在下一个界面中，点击`环境变量`\n\
  *   我假设你在安装 Python 时，选择了仅为你当前用户安装，而不是为系统中的所有人安装——点击“用户变量”框下的 `Path`\n*   点击`编辑`\n\
  *   在下一个界面中，找到变量值框，并将光标置于表示最后一条条目的分号（`;`）之后\n*   在框中输入以下内容作为最后一条条目，并**不要**忘记在末尾包含分号（`;`）——\
  \ `C:\\Python25\\Scripts;`\n*   连续点击三次`确定`以退出`系统属性`\n*   现在通过点击`开始`、`运行` 并输入 `cmd`\
  \ 来打开命令提示符。点击`确定`\n*   在下一个框中输入 `easy_install BeautifulSoup` –这将安装 `BeautifulSoup`\
  \ 模块 – 对你想要使用的任何其他模块重复此操作，它们将会被安装\n*   当你回到命令提示符时，输入 `Python` 然后按回车。\n*   输入 `import\
  \ BeautifulSoup`（或任何其他模块的名称）\n*   将出现另一个提示，且不会显示任何错误信息。我们现在知道已经正确设置了 `PATH` 变量，并且\
  \ `EasyInstall` 已正确安装。\n*   你现在也知道如何安装新包了！\n\n在你的电脑上安装 Python 和 `EasyInstall` 的就到此了。接下来是\
  \ Cygwin。\n\n## 安装 Cygwin\n\n这并不那么简单\n\n*   访问 `http://cygwin.com/http://cygwin.com/`\n\
  *   点击左侧菜单上的`Install Cygwin`\n*   点击 `setup-x86.exe` 然后运行它\n\n`Cygwin` 是一个非常有用的程序，因为它可以从互联网下载其他程序并为你安装。你需要提供有关你的互联网连接的信息，尽管在在整个设置过程中，你大多数情况下都可以接受默认设置。\n\
  \n一旦完成，你将看到一个下载站点列表。它们都是完全相同的，所以只需从列表中任选一个并点击`下一步`即可。\n\n现在你会收到一个`升级`警告——这仅适用于那些从旧版本\
  \ `Cygwin` 升级的用户。如果你是第一次安装它，请忽略此消息。\n\n现在你将看到要下载的软件列表。你需要三个包——`openssh`、`git` 和\
  \ `curl`。在网站的搜索中输入每个包的名称，当包出现时，点击`Skip`（跳过）。这将确保安装的是最新版本——对每个包执行此操作。\n\n一旦这三个包准备好安装，`Cygwin`\
  \ 会通知你你需要安装其他包作为依赖项。这意味着，如果你想使用某个特定的包（例如 `A`），而 `A` 需要另一个名为 `B` 的包才能正常运行，`Cygwin`\
  \ 将知道并询问是否可以同时安装包 `B` 和 `A`。\n\n当此消息出现时，只需点击`下一步`，`Cygwin` 将开始下载并安装你请求的三个包以及它们所有的依赖项。这可能需要一段时间，尽管取决于你互联网连接的速度。在你的屏幕上，你将看到三个独立的进度条——当中间名为\
  \ `TOTAL` 的进度条满满时，`Cygwin` 就完成了。\n\n如果你请求 `Cygwin` 在桌面上创建一个图标，它将执行该操作，你会看到一个名为 `Cygwin\
  \ Terminal` 的快捷方式。这是你运行 Python 代码以及通过 `Cygwin` 下载包时将使用的图标。\n\n点击它，一个终端窗口将会出现，我们就可以开始使用它了。首先，我们需要找出实际上安装了哪些包，因此在命令提示符下输入单词\
  \ `which`。\n\n将一个包列表，并且很可能向你显示你安装的所有 `Cygwin` 包，但它可能不会显示 Python 本身。这没关系，因为你没有使用\
  \ `Cygwin` 安装 Python。现在你需要告诉 `Cygwin` 寻找 `Python`，你通过输入以下命令来实现：\n\n```bash\n$ echo\
  \ \"PATH=$PATH:/cygdrive/c/Python32\" >> .bash_profile\n```\n\n确保你输入的是你正在使用的 Python\
  \ 版本——如果你安装了不同版本，请将 `Python32` 替换为正确的名称。你只需要执行这一步；在此之后，终端将始终找到 Python。\n\n`Cygwin`\
  \ 已安装并设置完毕，最后一步是设置你的文本编辑器。我为你提供 `Sublime Text` 的说明——如果你使用不同的编辑器，请确保遵循其附带的安装说明。请注意，`Microsoft\
  \ Word` **不是**文本编辑器；它是一个文字处理程序，因此不能用于此。\n\n## 安装 Sublime Text\n\n`lime text` 是一个非常强大的文本编辑器，它非常有用，而且还有一个永不过期的免费试用版。\n\
  \n*   访问 `http://www.sublimetext.com/` 并下载安装程序\n*   运行它\n\n虽然 `Sublime Text` 不是免费的，但你可以根据需要一直进行试用。不过，我建议，如果你喜欢它并用它来编写许多程序，请购买完整版的许可——对你使用的任何软件都如此。\n\
  \n## 检查一切工作正常\n\n现在一切都安装好了，是时候检查它们是否工作正常了。任何程序员编写的第一个程序都是现在著名的“Hello World!”程序。这个程序的作用是在终端上输出文本，是检查一切是否按预期运行的好方法。在你的终端中输入：\n\
  \n```bash\n$ python -c 'print(\"Hello World!\")'\n```\n\n如果这有效，打开 `Sublime Text`，我们将写一个程序。在文本编辑器中输入以下内容：\n\
  \n```python\n#!/usr/bin/env python\nprint(\"Hello, World!\")\n```\n\n将其保存到你的主目录，确保它进入\
  \ `C:\\win` 并命名为 `hello.py`。打开你的终端并输入：\n\n```bash\n$ chmod+x hello.py\n$ ./hello.py\n\
  ```\n\n你应该会在屏幕上看到“Hello, World!”。如果是，你就准备好学习如何在 Windows 10 上使用 Python 了。\n\n## 熟悉\
  \ Python\n\n在你的 Windows 桌面上，你应该看到一个 Python 图标。双击它，这将打开交互式解释器。你将在这里输入单个命令并查看结果。它是实验命令作用的好方法，它也是一个非常有用的工具。输入：\n\
  \n```python\n>>> x = 3\n>>> print x\n3\n>>>\n```\n\n\n\n\n# 变量\n\n还记得我们在在本章开始创建的那个简单程序吗？`x`\
  \ 是一个变量，我们在将其打印到屏幕之前，将它与一个数字（在本例中为 3）相关联。变量是任何编程语言中最基础的概念，是我们在处理数据时用于存储值的工具。\n\n\
  我们写的代码 `x = 3` —— 是一个语句——语句执行特定的任务，而在这种情况下，任务是将值 (3) 赋值给变量 (`x`)。在 Python 中，这被称为“绑定”（binding），是一个非常重要的概念。\n\
  \nPython 中的变量名几乎可以可以是任何内容，只要你遵循以下简单规则：\n\n* 它必须只包含 ASCII 字符、下划线和数字——你不能使用任何其他符号或空格\n\
  * 它不能以数字开头\n* 它不能是保留关键字列表中的任何单词。\n\n## 保留关键字\n\n* `and`\n* ` as`\n* `assert`\n*\
  \ `break`\n* `class`\n* `continue`\n* `def`\n* `del`\n* `elif`\n* `else`\n* `except`\n\
  * `exec`\n* `finally`\n* `for`\n* `from`\n* `global`\n* `if`\n* `import`\n* `in`\n\
  * `is`\n* `lambda`\n* `not`\n* `or`\n* `pass`\n* `print`\n* `raise`\n* `return`\n\
  * `try`\n* `while`\n* `with`\n* `yield`\n\n这些关键字都不能用于任何文件名或程序名，因为它们被 Python 保留了。由于\
  \ Python 是一种动态语言，这些关键字未来可能会发生，因此为了保持更新，你可以通过在终端输入以下内容定期检查当前的关键字列表：\n\n```python\n\
  #!/usr/bin/python\n## keywords.py\nimport sys\nimport keyword\nprint \"Python version:\
  \ \", sys.version_info\nprint \"Python keywords: \", keyword.kwlist\n```\n\n[基础变量类型](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n我们现在知道变量是 Python 的基本概念，变量拥有的所有值类型也是。这些被称为数据类型（data-types），表示存储数据的所有方式。“类型”一词在计算机编程中有其特殊含义，指的是对不同类型的对象进行特定分类的方法。每个对象都有类型，最基本的数据类型是：\n\
  \n[数字](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\n\
  ### 整数\n\n整数是整数，理论上，它们是从正无穷到负无穷范围内的任何整数。范围受计算机的限制，但在 Python 中，绝对最大大小仅限于一个因素——你计算机的内存大小。\n\
  \nPython 使用两种整数类型——整数（integer）和长整数（long integers），后者是超过特定长度的整数。\n\n### 浮点数\n\n计算机在处理整数或整数方面非常擅长。浮点数是指小数点后带有数字的数字，例如\
  \ 5.2 或 -8.1。\n\n整数可以存储为浮点数——你只需要在写它时添加一个小数点即可，例如 1.0 或 9.0。浮点数的处理速度要慢得多，因为计算机认为它们稍微复杂一些。\n\
  \n在较新版本的 Python 中，如果你尝试用一个整数除以另一个整数，你将得到一个意料之外的结果，例如：\n\n```python\n>>> 7/2\n3\n\
  ```\n\n为了得到正确的结果，必须将其中一个整数转换为浮点数：\n\n```python\n>>> 7.0/2\n3.5\n```\n\n[字符串](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n字符串仅仅是一段文本，Python 不会区分包含单个字符还是包含整块字符或文本的字符串。Python 包含两种不同的字符串类型——基础字符串（basic）和\
  \ Unicode 字符串。\n\n基础字符串类型用于在数字序列或字节序列中存储文本，每个字符仅占用一个字节。只有当你确定文本中包含 ASCII 值时，才应该使用它们。它们还用于存储二进制数据，通常被称为字节字符串（byte-strings）。\n\
  \nUnicode 字符串使用 Unicode 标准在内部存储文本。这些使用起来稍微复杂一点，因为当你读取或保存它时，必须知道存储代码时使用的编码。下面是关于如何使用每种类型的概述：\n\
  \n**基础字符串** – 你通过单引号或双引号括起相关文本向程序中添加字符串，例如：\n\n```python\nx = 'This is a string'\n\
  y = \"And so is this.\"\n```\n\n你还可以使用三引号包含带有换行符或跨越几行的字符串，如下：\n\n```python\nx =\
  \ \"\"\"This string\ngoes over multiple lines.\nSo it includes line breaks.\"\"\"\
  \n\ny = '''This string uses single quotes.\nBut it is still multi-line.\nAs you\
  \ might have guessed.'''\n```\n\n你还可以通过转义字符包含特殊字符，如引号字符或换行符。Python 使用 UNIX 惯例使用反斜杠键作为转义字符。例如：\n\
  \n```python\n## 变量 x 是一个字符串，包含\n### 单行换行符\nx = '\\n'\n### 变量 y 包含一个转义引号\n### 而不是\n\
  ### 终止字符串的引号\ny = 'Don\\'t worry about quotes'\n```\n\n**原始字符串** – 如果你不想使用转义键，可以使用原始字符串（raw\
  \ strings）。为了表示这一点，你可以在字符串前加 `r`。由于原始字符串用于某些表达式，例如 Windows 路径，它们不能以反斜杠结尾。\n\n```python\n\
  z = r'\n```\n\n**Unicode 字符串** – 这些字符串包含内部表示，允许将文本存储为文本。实际上，计算机通过文本知道哪些字符。\n\nUnicode\
  \ 字面量可以通过在字符串前面加 `u` 包含在程序中。如果你不在开头指定编码，你只能使用 ASCII 字符，但 Python 将你的数据存储为 Unicode\
  \ 而非字节字符串。\n\nUnicode 的引号和转义规则与字节字符串相同：\n\n```python\nx = u'A unicode string'\n\
  y = u'''A multi-line\nstring.'''\n\ny = ru\"\"\"This is a\nraw, multi-line\nunicode\
  \ string !!!\n```\n\n你可以通过指定编码来强制解释器在 Unicode 和字节字符串之间进行相互转换，但你可能会遇到以下错误之一：\n\n\
  * `UnicodeEncodeError`\n* `UnicodeDecodeError`\n\n其中任何一个错误都会导致你的程序崩溃。当这种情况发生时，通常是因为你尝试“隐式”转换的字符串包含默认编码（通常是\
  \ ASCII）无法表示的字符。\n\n[其他有用值](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n还有一些非常有用的值：\n\n* `None` - 在其他编程语言中通常视为 Null，它代表“无”。\n* `True` - 真的布尔值。\n* `False`\
  \ - 假的布尔值。\n\n你会在编程生涯中经常看到这些值，通过编写以下内容可以将它们包含在你编写的任何程序中：\n\n```python\nx = None\n\
  y = True\nz = False\n```\n\n[更复杂的数据类型](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n\n\n\n当你在处理更复杂的信息时，你可能想要将某些数据分组。Python 有许多概念可以让你实现这一点，包括列表推导式、生成器和迭代器等。对这些数据进行分组的基本方法是使用所谓的“数据结构”。这些对象会将所有值存储在一起，在\
  \ Python 中，你可以创建自定义的数据结构。不过，它也有四种内置的数据结构。用于存储数据的对象被称为容器。\n\n以下数据类型可以对它们执行执行许多不同的操作，其中许多操作已经内置在数据类型中（称为方法）。\n\
  \n### [列表 List](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n这用于按顺序存储一组项目。你可以随时向其添加或删除项目，对它们进行排序，或在列表中搜索特定值。你甚至可以从一个空列表开始，随着过程不断添加，或者使用一个已经预填充好的列表。你列表中包含的项目可以是任何其他对象，也包括其他列表。这意味着你可以拥有许多不同的列表以及嵌套列表，并使用它们创建一个复杂的结构——这些列表作为构建块非常有用。\n\
  \n当你写一个列表时，它应该带有方括号，每个项目之间用逗号隔开：\n\n● # `w` 是一个空列表\n● `w = []`\n● # `x` 只有一个成员\n\
  ● `x = [3.0]`\n● # `y` 是一个数字列表\n● `y = [1, 2, 3, 4, 5]`\n● # `z` 是一个字符串列表\n### 以及其他列表\n\
  ● `z = ['first', [], 'second', [1, 2, 3, 4], 'third']`\n\n你可以通过“索引”访问列表上的任何内容。该索引必须是一个表示项目在列表中位置的整数。第一个位置是零。可以通过在变量后放置包含索引的方括号对变量进行索引。\n\
  \n如果你尝试访问尚未创建的位置，将在屏幕上收到一个 `IndexError`。如果你想从列表末尾访问，可以使用负索引。`-1` 是你列表上的最后一个位置，接着是\
  \ `-2`、`-3` 等：\n\n```python\n>>> x = [1, 2, 3, 4, 5]\n>>> print x[0]\n1\n>>> print\
  \ x[4]\n5\n>>> print x[-1]\n5\n>>> print x[-5]\n1\n>>> print x[10]\nTraceback (most\
  \ recent call last):\n  File \"<stdin>\", line 1, in ?\nIndexError: list index out\
  \ of range\n```\n\n### [元组 Tuples](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n元组与列表相似，它们都存储顺序信息。然而，与列表不同，元组在创建后无法更改。解释器确切地知道元组成员的类型和长度，因此，处理元组时比处理列表更高效。元组可以被切片或索引，但不能被更改，你会在\
  \ Python 中到处“隐式地”遇到它们。一个例子是返回多个值的函数将把这些值作为元组返回。\n\n要创建一个元组，你使用圆括号而不是方括号：\n\n```python\n\
  >>> x = (1, 2, 3,4)\n>>> x\n(1, 2, 3, 4)\n>>> x[0]\n1\n>>> x = (1,)\n>>> x\n(1,)\n\
  >>> x[0]\n1\n>>> x = ()\n>>> x\n()\n>>> x[0]\nTraceback (most recent call last):\n\
  \  File \"<stdin>\", line 1, in ?\nIndexError: tuple index out of range\n```\n\n\
  即使元组中只有一个成员，你仍然需要添加逗号。例如，如果你只放一个 `1`，那么 `t` 不会被归类为元组，而 `1,` 则是。如果你需要创建一个空元组，可以使用以下内容之一：\n\
  \n● `()`\n● `tuple ()`\n\n### [字典 Dictionaries](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n字典是最实用且灵活的数据类型之一，Python 是基于它们构建的。字典会存储数据，但它们使用“键”。这意味着你可以使用该键查找特定的数据片段。与其他数据类型一样，Python\
  \ 内置了语法允许你创建字典：\n\n```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>>\
  \ print x\n{'key2': 'value2', 'key1': 'value1'}\n```\n\n可以通过索引检索值，就像你处理列表一样并使用相同的语法。然而，你使用的不是位置，而是键：\n\
  \n```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>> print x['key1']\n\
  value1\n```\n\n字符串不必用作键，相反，任何对象都可以被用，只要它是不可变的（即它不会改变）。这是元组派上用场的另一个好例子：\n\n```python\n\
  >>> attemptedKey = {}\n... Traceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in ?\nTypeError: unhashable type\n```\n\n### [集合 Sets](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
  \n集合是最实用且灵活的数据类型之一，Python 是基于它们构建的。字典会存储数据但它们使用键。这意味着你可以使用该键查找特定的数据片段。与其他数据类型一样，Python\
  \ 内置了语法允许你创建字典：\n\n```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>>\
  \ print x\n{'key2': 'value2', 'key1': 'value1'}\n```\n\n值可以通过索引检索，就像你处理列表一样并使用相同的语法。然而，你使用的不是位置，而是键：\n\
  \n```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>> print x['key1']\n\
  value1\n```\n\n字符串不必用作键，相反任何对象都可以被用，只要它是不可变的（即它不会改变）。这是元组派上用场的另一个好例子：\n\n```python\n\
  >>> attemptedKey = {}\n... Traceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in ?\nTypeError: unhashable type\n```\n\n（注：提供的文本包含重复章节和碎片化句子。）\n\n###\
  \ 条件 Conditions\n当你在处理更复杂的信息时，你可能想要将某些数据分组。Python 有许多概念可以让你实现这一点，包括列表推导式、生成器和迭代器等。对这些数据进行分组的基本方法是使用所谓的“数据结构”。这些对象会将所有值存储在一起，在\
  \ Python 中，你可以创建自定义的数据结构。不过，它也有四种内置的数据结构。用于存储数据的对象被称为容器。\n\n### 布尔运算符 Boolean operators\n\
  你可以使用 `and` 和 `or` 来构建复杂的表达式。例如：\n\n● `name = \"John\"`\n● `age = 23`\n● `if name\
  \ == \"John\" and age == 23:`\n● `print \"Your name is John, and you are also 23\
  \ years old.\"`\n\n● `if name == \"John\" or name == \"Rick\":`\n● `print \"Your\
  \ name is either John or.\"`\n\n### \"in\" 运算符\n这可以用于检查特定对象是否存在于容器中，例如列表：\n\n```python\n\
  if name in [\"John\", \"Rick\"]:\n    print \"Your name is either John or Rick.\"\
  \n```\n\n### 'is' 运算符\n`is` 运算符不匹配变量值；相反，它匹配实例本身。一个例子：\n\n```python\nx = [1,2,3]\n\
  y = [1,2,3]\nprint x == y # 输出 True\nprint x is y # 输出 False\n```\n\n### \"not\"\
  \ 运算符\n如果你在布尔运算符前面使用 `not`，它将反转它：\n\n\n\n\n● `print not False` # 输出 True\n\n● `print\
  \ (not False) == (False)` # 输出 False\n\n# 循环\n\nPython 有两种不同类型的循环——`For` 和 `While`。“for”\
  \ 循环会遍历特定的序列，例如：\n\n● `primes = [2, 3, 5, 7]`\n● `for prime in primes:`\n● `print\
  \ prime`\n\n它们能够遍历使用 `range` 和 `xrange` 函数的数字序列。这两者的区别在于，前者会返回一个包含特定范围数字的新列表，而后者返回一个迭代器，后者的效率高得多。\n\
  \n● ` # 输出数字 0,1,2,3,4\n● `for x in xrange(5):` # 或 `range(5)`\n● `print x`\n\n\
  ● ` # 输出 3,4,5`\n● `for x in xrange(3, 6):` # 或 `range(3, 6)`\n● `print x`\n\n●\
  \ ` # 输出 3,5,7`\n● `for x in xrange(3, 8, 2):` # 或 `range(3, 8, 2)`\n● `print x`\n\
  \n“while” 循环在特定布尔条件满足时会重复，例如：\n\n● ` # 输出 0,1,2,3,4`\n● `count = 0`\n● `while count\
  \ < 5:`\n● `print count`\n● `count += 1` # 这等于 `count = count + 1`\n\n## \"break\"\
  \ 和 \"continue\" 语句\n\n这两者的区别在于，“break” 用于退出 “for” 循环，而 “continue” 会跳过当前的文本块并返回到\
  \ “for” 或 “while” 语句。几个例子：\n\n● ` # 输出 0,1,2,3,4`\n● `count = 0`\n● `while True:`\n\
  ● `    print count`\n● `    count += 1`\n● `    if count >= 5:`\n● `        break`\n\
  \n● ` # 只输出奇数 - 1,3,5,7,9`\n● `for x in xrange(10):`\n● `    # 检查 x 是否为偶数`\n● `\
  \    if x % 2 == 0:`\n● `        continue`\n● `    print x`\n\n# 函数\n\n函数是将代码划分为有用块的一种极非常有用的方法。这允许你组织代码，使其更具可读性，以便重复使用，并在此过程中节省时间。函数也是定义接口的一种方式，以便程序员能够共享他们的代码。\n\
  \n我们知道 Python 将使用块，它是一段编写如下形式的代码：\n\n● `block_head:`\n● `    第一行块内容`\n● `    第 2\
  \ 行块内容`\n● `    ...`\n\n在块行是某些 Python 代码或另一个块的情况下，块头以以下格式书写——`block_keyword block_name(argument1,\
  \ argument2...)`。你已经知道一些块关键字——`if`、`for`、`while` 等。我们使用关键字 `def` 在 Python 中定义一个函数，后面紧跟的是函数名：\n\
  \n```python\ndef my_function():\n    print \"Hello From My Function!\"\n```\n\n\
  函数还可以接收参数——这些是从调用者传递给函数的变量。例如：\n\n```python\ndef my_function_with_args(username,\
  \ greeting):\n    print \"Hello, %s , From My Function!, I wish you %s\"%(username,\
  \ greeting)\n```\n\n## 执行代码\n\n函数还可以通过关键字 `return` 返回一个值，例如：\n\n```python\ndef sum_two_numbers(a,\
  \ b):\n    return a + b\n```\n\n## 如何在 Python 中调用函数\n\n你只需要编写函数名，后面跟着 `()`。在括号内放入任何所需的参数。例如：\n\
  \n```python\n## 打印一个简单的问候\nmy_function()\n# # 输出 - \"Hello, John Doe, From My Function!,\
  \ I wish you a great year!\"\nmy_function_with_args(\"John Doe\", \"a great year!\"\
  )\n### 在此行之后 x 将持有值 3!\nx = sum_two_numbers(1,2)\n```\n\n# 类和对象\n\n对象仅仅是将变量和函数封装进单个实体中。每个对象都从类中获取它的函数和变量，而类仅仅是用于创建对象的模板。一个基础类看起来如下：\n\
  \n```python\nclass MyClass:\n    variable = \"blah\"\n\n    def function(self):\n\
  \        print \"This is a message inside the class.\"\n```\n\n为了将此类分配给特定对象，你需要这样做：\n\
  \n```python\nmyobjectx = MyClass()\n```\n\n现在，名为 `MyObjectx` 的变量持有一个来自 `MyClass`\
  \ 的类对象。它包含了在 `MyClass` 类内部定义的变量和函数。\n\n## 访问对象变量\n\n为了访问名为 `MyObject` 的新对象内部的变量，你需要这样做：\n\
  \n```python\nmyobjectx.variable\n```\n\n因此，以下将产生字符串“blah”：\n\n```python\nprint myobjectx.variable\n\
  ```\n\n可以创建许多相同的对象，即它们具有相同的函数和变量。然而，每个对象都是独立的副本。例如，如果你使用 `MyClass` 定义了一个不同的对象，可以使用如下代码：\n\
  \n```python\nmyobjecty = MyClass()\nmyobjecty.variable = \"yack\"\n```\n\n然后打印两个值：\n\
  \n```python\nprint myobjectx.variable  # 输出 \"blah\"\nprint myobjecty.variable \
  \ # 输出 \"yack\"\n```\n\n## 访问对象函数\n\n如果你想访问对象函数，将使用与访问变量类似的符号：\n\n```python\nmyobjectx.function()\n\
  ```\n\n打印该消息将得到“This is a message inside the class.”\n\n# 模块和包\n\n所有的 Python 模块都是具有\
  \ .py 扩展名的文件，实现了一组函数。通过 `import` 命令从另一个模块导入模块。\n\n第一次加载模块时，它会被初始化。下次导入它时，不会再次加载。\n\
  \n如果你想从 URL 读取数据，你会这样做：\n\n```python\n## import urllib\nurllib.urlopen(...)\n```\n\
  \n## 内置模块\n\n有两个函数在探索模块时非常有用——`dir` 和 `help`。你可以使用 `dir` 函数查看每个模块中实现的函数：\n\n```python\n\
  >>> import urllib\n>>> dir(urllib)\n['ContentTooShortError', 'FancyURLopener', 'MAXFTPCACHE',\
  \ 'URLopener', '__all__', '__builtins__', '__doc__', '__file__', '__name__', '__package__',\
  \ '__version__', '_ftperrors', '_get_proxies', '_get_proxy_settings', '_have_ssl',\
  \ '_hexdig', '_hextochr', '_hostprog', '_is_unicode', '_localhost', '_noheaders',\
  \ '_nportprog', '_passwdprog', '_portprog', '_queryprog', '_safe_map', '_safe_quoters',\
  \ '_tagprog', '_thishost', '_typeprog', '_urlopener', '_userprog', '_valueprog']\n\
  ```\n\n当你定位到模块中想要使用的函数时，可以在解释器中使用 `help` 函数来获取关于它的更多信息：\n\n```python\nhelp(urllib.urlopen)\n\
  ```\n\n## 编写模块\n\n编写 Python 模块是一个非常简单的任务。你所需要创建一个与模块名同名的 .py 文件，然后使用 Python 名称（不使用\
  \ .py 扩展名）通过 `import` 命令来导入它。\n\n## 编写包\n\n\n\n\n包（package）是一个命名空间，包含许多模块和包。它们是带有特殊之处的目录。每个\
  \ Python 包都是一个必须包含名为 `__init__.py` 的特殊文件的目录。该文件本身可以是空的，仅表示该目录是一个 Python 包 —— 这样你就可以像导入模块一样来导入它了。\n\
  \n如果你创建一个名为 `foo` 的目录（这将作为包名），你可以在该包中创建一个名为 `bar` 的内内模块。不要忘记你还需要向 `foo` 目录中添加 `__init__.py`\
  \ 文件。为了使用名为 `bar` 的模块，你可以通过两种方式之一导入它：\n\n- `import foo.bar`，或者\n- `from foo import\
  \ bar`\n\n### `__init__.py` 和 `__all__` 变量\n\n如果你使用第一种方法，每当你访问 `bar` 时都必须使用前缀 `foo`。但在第二种方法中，你不需要这样做，因为你正在将模块本身导入到命名空间中。\n\
  \n你还可以使用 `__init__.py` 文件来决定包将将哪些模块导出为 API，同时通过重写 `__all__` 变量来保持其他模块为内部模块 —— 示例：\n\
  \n`__init__.py`:\n- `__all__ = [\"bar\"]`\n\n# MySQL Python 教程\n\n在最后一章节中，我想和你们讨论如何使用\
  \ Python 为 MySQL 数据库编程。我将介绍使用 `MySQLdb` 模块的 Python 编程基础。\n\n## 关于 MySQL 数据库\n\n\
  MySQL 是世界上最好的数据库管理系统之一。作为一个多用户系统，它在互联网上非常流行，并可以在大多数最大的操作系统平台上使用。除了 Windows 之外，它运行在\
  \ Linux、BSD UNIX 和 Mac OS 上。像 YouTube 和 Wikipedia 这样的大型知名网站都在 MySQL，这些网站每天可以处理数百万次查询。\n\
  \n## 在开始之前\n\n为了在你的计算机上运行这些示例，你需要安装许多包，首先是 MySQL（如果你还没有安装它的话）。\n\n从命令行提示符中输入以下内容：\n\
  \n```bash\n$ sudo apt-get install mysql-server\n```\n\n这将安装 MySQL 服务器以及许多其他包。在安装期间，系统会提示你输入\
  \ MySQL root 账户的密码：\n\n```bash\n$ apt-cache search MySQLdb\n- `python-mysqldb` -\
  \ MySQL 的 Python 接口\n- `python-mysqldb-dbg` - MySQL 的 Python 接口（调试扩展）\n- `bibus`\
  \ - 文献数据库\n- `eikazo` - 专为大量扫描设计的 SANE 图形前端\n```\n\n在现阶段，我们不知道 `MySQLdb` 模块包的名称是什么，因此可以使用以下命令来查找：\n\
  \n```bash\n$ sudo apt-get install python-mysqldb\n```\n\n现在是时候创建一个新的数据库用户以及新数据库了：\n\
  \n```bash\n$ mysql -u root -p\n- Enter password:\n- Welcome to the MySQL monitor.\
  \ 命令以 ; 或 \\g 结束。\n- Your MySQL connection id is 30\n- Server version: 5.0.67-0ubuntu6\
  \ (Ubuntu)\n```\n\n输入 'help;' 或 '\\h' 获取帮助。\n输入 '\\c' 清除缓冲区。\n\n```sql\nmysql> SHOW\
  \ DATABASES;\n- Database\n- information_schema\n- mysql\n- 2 rows in set (0.00 sec)\n\
  ```\n\n使用 root 账户我们可以连接到数据库。要显示所有可用数据库，只需在命令行提示符处输入 `Show Databases`。\n\n```sql\n\
  mysql> CREATE DATABASE testdb;\n- Query OK, 1 row affected (0.02 sec)\n```\n\n我们现在可以创建一个\
  \ `testdb` 数据库，这就是你在整个章节中将使用的：\n\n```sql\nmysql> CREATE USER 'testuser'@'localhost'\
  \ IDENTIFIED BY 'test623';\n- Query OK, 0 rows affected (0.00 sec)\nmysql> USE testdb;\n\
  - Database changed\nmysql> GRANT ALL ON testdb.* TO 'testuser'@'localhost';\n- Query\
  \ OK, 0 rows affected (0.00 sec)\nmysql> quit;\n- Bye\n```\n\n接下来，你需要创建一个新用户，并将赋予该用户对\
  \ `testdb` 数据库中所有表的所有权限。我们创建一个新的数据库用户。授予该用户对 `testdb` 数据库中所有表的所有权限。\n\n## `MySQL`\
  \ 模块\n\n这将用于实现 MySQL 的 C API，并且它与 Python 中的 DB API 接口完全不兼容。大多数程序员倾向于使用 `MySQL` 模块，因为它是面向对象的，所以我们将在这里使用它。以下是一个使用\
  \ `_mysql` 模块的示例：\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\n\nimport\
  \ _mysql\nimport sys\n\ntry:\n    con = _mysql.connect('localhost', 'testuser',\
  \ 'test623', 'testdb')\n    con.query(\"SELECT VERSION()\")\n    result = con.use_result()\n\
  \    print \"MySQL version: %s\" % \\\n        result.fetch_row()[0]\nexcept _mysql.Error,\
  \ e:\n    print \"MySQL version: %s\" % \\\n        result.fetch_row()[0] # 注意：原文此处有一个逻辑错误，但保留了内容\n\
  ```\n\n## `MySQLdb` 模块\n\n`MySQLdb` 是 Python 的包装器，与 DB API 兼容，使得代码更具可移植性。在第一个示例中，我们使用\
  \ `MySQLdb`：\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\n\nimport\
  \ MySQLdb\nimport sys\n\ntry:\n    con = MySQLdb.connect('localhost', 'testuser',\
  \ 'test623', 'testdb')\n    cur = con.cursor()\n    cur.execute(\"SELECT VERSION()\"\
  )\n    ver = cur.fetchone()\n    print \"MySQL version: %s\" % ver\nexcept MySQLdb.Error,\
  \ e:\n    print \"MySQL version: %s\" % (e.args[0], e.args[1])\n    sys.exit(1)\n\
  finally:\n    if con:\n        con.close()\n```\n\n## 创建并填充表\n\n现在我们将创建一个表并向其中放入一些数据，或者填充它，如大家周知：\n\
  \n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\n\nimport MySQLdb\n\ncon\
  \ = MySQLdb.connect('localhost', 'testuser', 'test623', 'testdb')\n\nwith con:\n\
  \    cur = con.cursor()\n    cur.execute(\"DROP TABLE IF EXISTS Writers\")\n   \
  \ cur.execute(\"CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25))\"\
  )\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Jack London')\")\n    cur.execute(\"\
  INSERT INTO Writers(Name) VALUES('Honore de Balzac')\")\n    cur.execute(\"INSERT\
  \ INTO Writers(Name) VALUES('Lion Feuchtwanger')\")\n    cur.execute(\"INSERT INTO\
  \ Writers(Name) VALUES('Emile Zola')\")\n    cur.execute(\"INSERT INTO Writers(Name)\
  \ VALUES('Truman Capote')\")\n```\n\n\n\n使用 `with` 关键字，解释器会自动释放这些资源，并执行错误处理。\n\n\
  ```python\ncur.execute(\"CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT,\
  \ Name VARCHAR(25))\")\n```\n\n上面的 SQL 语句将创建一个名为 `writers` 的新数据库表。该表有两个列：`ID` 和\
  \ `Name`。\n\n```python\ncur.execute(\"INSERT INTO Writers(Name) VALUES('Jack London')\"\
  )\ncur.execute(\"INSERT INTO Writers(Name) VALUES('Honore de Balzac')\")\n# ...\n\
  ```\n\n要向表中插入新作者，我们使用 `INSERT` 语句并添加另外两行：\n\n```text\nmysql> SELECT * FROM Writers;\n\
  +----+-------------------+\n| Id | Name              |\n+----+-------------------+\n\
  |  1 | Jack London       |\n|  2 | Honore de Balzac  |\n|  3 | Lion Feuchtwanger\
  \ |\n|  4 | Emile Zola         |\n|  5 | Truman Capote      |\n+----+-------------------+\n\
  5 rows in set (0.00 sec)\n```\n\n脚本执行后，我们可以使用 `mysql` 客户端工具查询该表中的所有数据。\n\n## 获取数据\n\
  \n现在我们已经在数据库中存了一些数据，是时候检索它们了：\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8\
  \ -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623',\
  \ 'testdb');\nwith con:\n    cur = con.cursor()\n    cur.execute(\"SELECT * FROM\
  \ Writers\")\n    rows = cur.fetchall()\n    for row in rows:\n        print row\n\
  ```\n\n上面的示例展示了你如何从名为 `Writers` 的表中检索所有数据。\n\n```python\ncur.execute(\"SELECT *\
  \ FROM Writers\")\n```\n\n该语句选择了该表中的所有数据。\n\n```python\nrows = cur.fetchall()\n\
  ```\n\n我们使用 `fetchall()` 方法检索所有记录，这些记录以结果集的形式返回。\n\n```python\nfor row in rows:\n\
  \    print row\n```\n\n现在我们可以逐行将所有数据打印到窗口中。\n\n```text\n$ ./retrieve.py\n(1L, 'Jack\
  \ London')\n(2L, 'Honore de Balzac')\n(3L, 'Lion Feuchtwanger')\n(4L, 'Emile Zola')\n\
  (5L, 'Truman Capote')\n```\n\n并不是总是能够同时检索所有数据，因此，我们将改为一次地获取每一行。\n\n```python\n#!/usr/bin/python\n\
  # -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser',\
  \ 'test623', 'testdb');\nwith con:\n    cur = con.cursor()\n    cur.execute(\"SELECT\
  \ * FROM Writers\")\n    for i in range(cur.rowcount):\n        row = cur.fetchone()\n\
  \        print row[0], row[1]\n```\n\n再次，我们可以打印表中的数据并一次地获取每一行。\n\n```python\nfor\
  \ i in range(cur.rowcount):\n    row = cur.fetchone()\n    print row[0], row[1]\n\
  ```\n\n我们使用 `fetchone()` 方法获取每一行，而 `rowcount` 属性将显示 SQL 语句返回的总行数。\n\n```text\n$\
  \ ./retrieve2.py\n1 Jack London\n2 Honore de Balzac\n3 Lion Feuchtwanger\n4 Emile\
  \ Zola\n5 Truman Capote\n```\n\n上面是示例的输出。\n\n## 字典游标\n\n在 `MySQLdb` 模块中，有许多类型的游标。默认游标以元组的元组的形式返回数据。字典游标以字典的格式发送数据，允许我们通过列名来引用数据：\n\
  \n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\n\
  con = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\nwith con:\n   \
  \ cur = con.cursor(mdb.cursors.DictCursor)\n    cur.execute(\"SELECT * FROM Writers\
  \ LIMIT 4\")\n    rows = cur.fetchall()\n    for row in rows:\n        print row[\"\
  Id\"], row[\"Name\"]\n```\n\n在上面的示例中，你可以看到我们使用字典游标从名为 `Writers` 的表中检索了前四行。分解来看，该示例看起来如下：\n\
  \n```python\ncur = con.cursor(mdb.cursors.DictCursor)\ncur.execute(\"SELECT * FROM\
  \ Writers LIMIT 4\")\nfor row in rows:\n    print row[\"Id\"], row[\"Name\"]\n```\n\
  \n`DictCursor` 用于从表中引入四行数据。数据通过列名引用。\n\n```text\n$ ./dict.py\n1 Jack London\n2 Honore\
  \ de Balzac\n3 Lion Feuchtwanger\n4 Emile Zola\n```\n\n上面是输出的一个示例。\n\n## 列标题\n\n\
  接下来，我们将查看如何打印数据库表中带有数据的列标题：\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8\
  \ -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623',\
  \ 'testdb')\nwith con:\n    cur = con.cursor()\n    cur.execute(\"SELECT * FROM\
  \ Writers LIMIT 5\")\n    rows = cur.fetchall()\n    desc = cur.description\n  \
  \  print \"%s %s\" % (desc[0][0], desc[1][0])\n    for row in rows:\n        print\
  \ \"%s %s\" % (row[0], row[1])\n```\n\n我们通过 `description` 对象从表中获取列元数据，并逐行打印所有数据。\n\
  \n```text\n$ ./columnheaders.py\nId Name\n1 Jack London\n2 Honore de Balzac\n3 Lion\
  \ Feuchtwanger\n4 Emile Zola\n5 Truman Capote\n```\n\n## 预处理语句\n\n现在让我们看看预处理语句。当我们编写这些时，使用占位符而不是直接写入值。预处理语句可以提高性能和安全性，Python\
  \ DB 支持这种 ANSI 格式。\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport\
  \ MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\n\
  with con:\n    cur = con.cursor()\n    cur.execute(\"UPDATE Writers SET Name = %s\
  \ WHERE Id = %s\", (\"Guy Mauasant\", \"4\"))\n    print \"Number of rows updated:\"\
  , cur.rowcount\n```\n\n让我们更改第 4 行作者的名字：\n\n```python\ncur.execute(\"UPDATE Writers\
  \ SET Name = %s WHERE Id = %s\", (\"Guy Mauasant\", \"4\"))\n```\n\n在此处，我们使用了由 `%s`\
  \ 标识的占位符。值在 SQL 语句执行之前绑定到占位符。\n\n```text\n$ ./prepared.py\nNumber of rows updated:\
  \ 1\nOne row has been updated\nmysql> SELECT Name FROM Writers WHERE Id=4;\n+------------------+\n\
  | Name           |\n+------------------+\n| Guy Mauasant |\n+------------------+\n\
  1 row in set (0.00 sec)\n```\n\n我们更改了第 4 行作者的名字。\n\n## 插入图片\n\n有时你可能将图片放入数据库。并不是所有人推荐这样做，因为图片被称为二进制数据；然而，MySQL\
  \ 数据库有一种专门用于存储二进制的数据类型 `BLOB`（二进制大对象）。其他变体有 `TINYBLOB`、`LONGBLOB` 和 `MEDIUMBLOB`。\n\
  \n```text\nmysql> CREATE TABLE Images(Id INT PRIMARY KEY, Data MEDIUMBLOB);\nQuery\
  \ OK, 0 rows affected (0.08 sec)\n```\n\n我们创建了一个名为 `Images` 的新表。\n\n```python\n\
  #!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ndef read_image():\n\
  \    fin = open(\"woman.jpg\")\n    img = fin.read()\n    return img\ncon = mdb.connect('localhost',\
  \ 'testuser', 'test623', 'testdb')\nwith con:\n    cur = con.cursor()\n    data\
  \ = read_image()\n    cur.execute(\"INSERT INTO Images VALUES(1, %s)\", (data, ))\n\
  ```\n\n在上面的脚本中，我们从磁盘读取了一个 .JPG 文件并将其放入名为 `Images` 的表中。\n\n\n\n\n我们现在知道如何将图像插入到表中，但我们如何读取这些图像呢？\n\
  \n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\n\
  def writeImage(data):\n    fout = open('woman2.jpg', 'wb')\n    with fout:\n   \
  \     fout.write(data)\ncon = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\n\
  \nwith con:\n    cur = con.cursor()\n    cur.execute(\"SELECT Data FROM Images WHERE\
  \ Id=1\")\n    data = cur.fetchone()[0]\n    writeImage(data)\n```\n\n上面的脚本显示了我们如何从\
  \ `images` 表中读取文件。\n\n`cur.execute(\"SELECT Data FROM Images WHERE Id=1\")`\n我们从表中选取了一条记录。\n\
  \n`fout = open('woman2.jpg', 'wb')`\n现在我们打开了一个可写的二进制文件。\n\n`fout.write(data)`\n\
  然后我们将该数据写入磁盘。\n\n你现在应该在当前目录下看到一个名为 `woman2.jpg` 的图像，我们可以查看它是否是正确的，即你在上一个示例中插入的那个。\n\
  \n## 事务支持\n\n事务是针对一个或多个不同数据库中的数据进行的数据库操作原子单元。每个事务中 SQL 语句的影响可以对该数据库进行回滚（rollback）或提交（commit）。\n\
  \n如果数据库支持事务，Python 将在游标创建时自动——静默地启动一个事务。我们使用 `commit()` 方法来提交使用该游标进行的更新，并使用 `rollback()`\
  \ 方法来回滚或丢弃它们。这些方法中的每一个都将启动一个新的事务。\n\nMySQL 数据库包含几种不同的存储引擎类型，最常见的是 `MyISAM` 和 `InnoDB`。InnoDB\
  \ 现在是默认引擎，尽管在速度和安全性之间存在权衡。`MyISAM` 表的处理速度快得多，但不支持事务。`rollback()` 和 `commit()` 方法没有实现，因此不起任何作用。然而，`InnoDB`\
  \ 表在防止数据丢失方面安全得多，而且它们支持事务，尽管处理速度较慢。\n\n```python\n#!/usr/bin/python\n# -*- coding:\
  \ utf-8 -*-\nimport MySQLdb as mdb\nimport sys\ntry:\n    con = mdb.connect('localhost',\
  \ 'testuser', 'test623', 'testdb')\n    cur = con.cursor()\n    cur.execute(\"DROP\
  \ TABLE IF EXISTS Writers\")\n    cur.execute(\"CREATE TABLE Writers(Id INT PRIMARY\
  \ KEY AUTO_INCREMENT, Name VARCHAR(25)) ENGINE=INNODB\")\n    cur.execute(\"INSERT\
  \ INTO Writers(Name) VALUES('Jack London')\")\n    cur.execute(\"INSERT INTO Writers(Name)\
  \ VALUES('Honore de Balzac')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Lion\
  \ Feuchtwanger')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Emile Zola')\"\
  )\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Truman Capote')\")\n    cur.execute(\"\
  INSERT INTO Writers(Name) VALUES('Terry Pratchett')\")\n    con.commit()\nexcept\
  \ mdb.Error, e:\n    if con:\n        con.rollback()\n    print \"Error %d: %s\"\
  \ % (e.args[0],e.args[1])\n    sys.exit(1)\nfinally:\n    if con:\n        con.close()\n\
  ```\n\n`writers` 表已重新创建，我们现在将显式地处理事务。\n\n`cur = con.cursor()`\n在 Python DB API 中，并没有调用\
  \ `BEGIN` 语句来启动事务。相反，事务在游标创建时就已经启动了。\n\n`cur.execute(\"CREATE TABLE Writers(Id INT\
  \ PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25)) ENGINE=INNODB\")`\n在这个例子中，我们查看的是\
  \ `InnoDB` 表类型——如果你使用的是旧版本的 MySQL，则需要指定引擎类型。\n\n`con.commit()`\n事务必须通过两种方法之一结束——`commit()`\
  \ 或 `rollback()` 方法。如果你在这一行加上以井号（`#`）开头的注释，表仍然会被创建，但数据不会被写入其中。\n\n到目前为止，我们一直在使用事务，但还没有显式地使用。相反，我们使用了上下文管理器（context\
  \ managers），它们在代码块执行时处理运行时的进入和退出。你可以在 `Mysdb` 中将连接对象作为上下文管理器。它们会自动回滚或提交事务，并通过消除\
  \ `try` 和 `finally` 语句来清理代码。\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8\
  \ -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623',\
  \ 'testdb')\nwith con:\n    cur = con.cursor()\n    cur.execute(\"DROP TABLE IF\
  \ EXISTS Writers\")\n    cur.execute(\"CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT,\
  \ Name VARCHAR(25))\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Jack\
  \ London')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Honore de Balzac')\"\
  )\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Lion Feuchtwanger')\")\n\
  \    cur.execute(\"INSERT INTO Writers(Name) VALUES('Emile Zola')\")\n    cur.execute(\"\
  INSERT INTO Writers(Name) VALUES('Truman Capote')\")\n    cur.execute(\"INSERT INTO\
  \ Writers(Name) VALUES('Terry Pratchett')\")\n```\n\n在上面的示例中，上下文管理器处理了错误处理的所有工作，并自动提交或回滚了事务。\n\
