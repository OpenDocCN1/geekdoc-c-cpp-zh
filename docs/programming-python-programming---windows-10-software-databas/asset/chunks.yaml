- fmt: "\nA package is a namespace, which includes a number of modules and packages.\
    \ They are directories with a twist. Each Python package is a directory that has\
    \ to contain a special file, named `__init__.py`. The file itself can be empty,\
    \ merely indicating that the directory in it is a Python package – that way it\
    \ can be imported in the way you would import a module.\n\nIf you were to create\
    \ a directory that is named `foo`, which would mark the name of the package, you\
    \ can create a module-in within that package that you could call `bar`. Don’t\
    \ forget that you need to add the `__init__.py` file to the `foo` directory as\
    \ well. In order to use the module called `bar`, you can import it on one of two\
    \ ways:\n\n- `import foo.bar`, OR\n- `from foo import bar`\n\n### The `__init__.py`\
    \ and `__all__` Variable\n\nIf you use the first way, you have to use the prefix\
    \ `foo` whenever you access `bar`. But, in the second method, you don’t need to\
    \ do this because you are importing the module itself to the namespace.\n\nYou\
    \ can also use the `__init__.py` file to determine which modules the package is\
    \ going to export as the API, while you keep the other modules internal by overriding\
    \ the variable `__all__` – an example:\n\n`__init__.py`:\n- `__all__ = [\"bar\"\
    ]`\n\n# MySQL Python Tutorial\n\nFor the final chapter, I want to talk to you\
    \ about how to program, using Python, for the MySQL database. I will cover the\
