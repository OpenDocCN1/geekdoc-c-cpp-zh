    \ 命令以 ; 或 \\g 结束。\n- Your MySQL connection id is 30\n- Server version: 5.0.67-0ubuntu6\
    \ (Ubuntu)\n```\n\n输入 'help;' 或 '\\h' 获取帮助。\n输入 '\\c' 清除缓冲区。\n\n```sql\nmysql>\
