    Transaction Support


    Transactions are atomic units of database operations against the data in either
    one or several different databases. The effect of the SQL statements in each transaction
    and these can be rolled back or committed to that database.


    If a database supports a transaction, Python will automatically – and silently
    – start a transaction as soon as the cursor is created. We use the commit () method
    for committing the updates that are made with that cursor and we use the rollback
    () method to roll them back, or discard them. Each of these methods will start
    a new transaction.


    MySQL database includes several different storage engine types, the most common
    of which are MyISAM and InnoDB. InnoDB is now the default engine although there
    is some tradeoff between speed and security. The MyISAM tables process much faster
    and offer no support for transactions. The rollback () and commit () methods are
    not implemented and do not do anything. However, the InnoDB table are infinitely
    more secure against the loss of data, and they support transactions, although
    they are slower to process.


    ● #!/usr/bin/python


    ● # -*- coding: utf-8 -*-


    ● import MySQLdb as mdb


    ● import sys


    ● try:


    ●     con = mdb.connect(''localhost'', ''testuser'', ''test623'', ''testdb'')


    ●     cur = con.cursor()


    ●     cur.execute("DROP TABLE IF EXISTS Writers")


    ●     cur.execute("CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, \


    ●                  Name VARCHAR(25)) ENGINE=INNODB")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Jack London'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Honore de Balzac'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Lion Feuchtwanger'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Emile Zola'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Truman Capote'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Terry Pratchett'')")


    ●     con.commit()


    ● except mdb.Error, e:


    ●     if con:


    ●         con.rollback()


    ●     print "Error %d: %s" % (e.args[0],e.args[1])


    ●     sys.exit(1)


    ● finally:   


    ●     if con:   


    ●         con.close()


    The writers table has been recreated and we are now going to work explicitly with
    transactions.


    ● cur = con.cursor()


    The BEGIN statement is not called to start a transaction in the Python DB API.
    Instead, the transaction is started as soon as the cursor is created.


    ● cur.execute("CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, \


    ●                 Name VARCHAR(25)) ENGINE=INNODB")


    In this one, we are looking at an InnoDB table type – if you are using an older
    version of MySQL, you will need to specify the engine type.


    ● con.commit ()


    The transaction must be ended with one of two things – a commit () or a rollback
    () method. If you place a comment on this line, dented by the hash (#) symbol,
    the table will still be created but the data will not be written to it.


    So far, we have been working with transactions but have not explicitly stated
    it. Instead we used context managers, which handle both the entry and exit from
    the runtime context, when the code block is executed. The context manager is usually
    invoked with the use of the with statement.


    You can use connection objects as context managers in MySqldb. These will automatically
    rollback or commit the transactions and will also clean the code by eliminating
    the try, finally and except statements.


    ● #!/usr/bin/python


    ● # -*- coding: utf-8 -*-


    ● import MySQLdb as mdb


    ● con = mdb.connect(''localhost'', ''testuser'', ''test623'', ''testdb'')


