  trans: "\n使用 `with` 关键字，解释器会自动释放这些资源，并执行错误处理。\n\n```python\ncur.execute(\"CREATE\
    \ TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25))\")\n```\n\
    \n上面的 SQL 语句将创建一个名为 `writers` 的新数据库表。该表有两个列：`ID` 和 `Name`。\n\n```python\ncur.execute(\"\
    INSERT INTO Writers(Name) VALUES('Jack London')\")\ncur.execute(\"INSERT INTO\
    \ Writers(Name) VALUES('Honore de Balzac')\")\n# ...\n```\n\n要向表中插入新作者，我们使用 `INSERT`\
    \ 语句并添加另外两行：\n\n```text\nmysql> SELECT * FROM Writers;\n+----+-------------------+\n\
    | Id | Name              |\n+----+-------------------+\n|  1 | Jack London   \
    \    |\n|  2 | Honore de Balzac  |\n|  3 | Lion Feuchtwanger |\n|  4 | Emile Zola\
    \         |\n|  5 | Truman Capote      |\n+----+-------------------+\n5 rows in\
    \ set (0.00 sec)\n```\n\n脚本执行后，我们可以使用 `mysql` 客户端工具查询该表中的所有数据。\n\n## 获取数据\n\n\
    现在我们已经在数据库中存了一些数据，是时候检索它们了：\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8\
    \ -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623',\
    \ 'testdb');\nwith con:\n    cur = con.cursor()\n    cur.execute(\"SELECT * FROM\
    \ Writers\")\n    rows = cur.fetchall()\n    for row in rows:\n        print row\n\
    ```\n\n上面的示例展示了你如何从名为 `Writers` 的表中检索所有数据。\n\n```python\ncur.execute(\"SELECT\
    \ * FROM Writers\")\n```\n\n该语句选择了该表中的所有数据。\n\n```python\nrows = cur.fetchall()\n\
    ```\n\n我们使用 `fetchall()` 方法检索所有记录，这些记录以结果集的形式返回。\n\n```python\nfor row in rows:\n\
    \    print row\n```\n\n现在我们可以逐行将所有数据打印到窗口中。\n\n```text\n$ ./retrieve.py\n(1L,\
    \ 'Jack London')\n(2L, 'Honore de Balzac')\n(3L, 'Lion Feuchtwanger')\n(4L, 'Emile\
    \ Zola')\n(5L, 'Truman Capote')\n```\n\n并不是总是能够同时检索所有数据，因此，我们将改为一次地获取每一行。\n\n\
    ```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\n\
    con = mdb.connect('localhost', 'testuser', 'test623', 'testdb');\nwith con:\n\
    \    cur = con.cursor()\n    cur.execute(\"SELECT * FROM Writers\")\n    for i\
    \ in range(cur.rowcount):\n        row = cur.fetchone()\n        print row[0],\
    \ row[1]\n```\n\n再次，我们可以打印表中的数据并一次地获取每一行。\n\n```python\nfor i in range(cur.rowcount):\n\
    \    row = cur.fetchone()\n    print row[0], row[1]\n```\n\n我们使用 `fetchone()`\
    \ 方法获取每一行，而 `rowcount` 属性将显示 SQL 语句返回的总行数。\n\n```text\n$ ./retrieve2.py\n1 Jack\
    \ London\n2 Honore de Balzac\n3 Lion Feuchtwanger\n4 Emile Zola\n5 Truman Capote\n\
    ```\n\n上面是示例的输出。\n\n## 字典游标\n\n在 `MySQLdb` 模块中，有许多类型的游标。默认游标以元组的元组的形式返回数据。字典游标以字典的格式发送数据，允许我们通过列名来引用数据：\n\
    \n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\n\
    con = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\nwith con:\n \
    \   cur = con.cursor(mdb.cursors.DictCursor)\n    cur.execute(\"SELECT * FROM\
    \ Writers LIMIT 4\")\n    rows = cur.fetchall()\n    for row in rows:\n      \
    \  print row[\"Id\"], row[\"Name\"]\n```\n\n在上面的示例中，你可以看到我们使用字典游标从名为 `Writers`\
    \ 的表中检索了前四行。分解来看，该示例看起来如下：\n\n```python\ncur = con.cursor(mdb.cursors.DictCursor)\n\
    cur.execute(\"SELECT * FROM Writers LIMIT 4\")\nfor row in rows:\n    print row[\"\
    Id\"], row[\"Name\"]\n```\n\n`DictCursor` 用于从表中引入四行数据。数据通过列名引用。\n\n```text\n$\
    \ ./dict.py\n1 Jack London\n2 Honore de Balzac\n3 Lion Feuchtwanger\n4 Emile Zola\n\
    ```\n\n上面是输出的一个示例。\n\n## 列标题\n\n接下来，我们将查看如何打印数据库表中带有数据的列标题：\n\n```python\n#!/usr/bin/python\n\
    # -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost',\
    \ 'testuser', 'test623', 'testdb')\nwith con:\n    cur = con.cursor()\n    cur.execute(\"\
    SELECT * FROM Writers LIMIT 5\")\n    rows = cur.fetchall()\n    desc = cur.description\n\
    \    print \"%s %s\" % (desc[0][0], desc[1][0])\n    for row in rows:\n      \
    \  print \"%s %s\" % (row[0], row[1])\n```\n\n我们通过 `description` 对象从表中获取列元数据，并逐行打印所有数据。\n\
    \n```text\n$ ./columnheaders.py\nId Name\n1 Jack London\n2 Honore de Balzac\n\
    3 Lion Feuchtwanger\n4 Emile Zola\n5 Truman Capote\n```\n\n## 预处理语句\n\n现在让我们看看预处理语句。当我们编写这些时，使用占位符而不是直接写入值。预处理语句可以提高性能和安全性，Python\
    \ DB 支持这种 ANSI 格式。\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\n\
    import MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\n\
    with con:\n    cur = con.cursor()\n    cur.execute(\"UPDATE Writers SET Name =\
    \ %s WHERE Id = %s\", (\"Guy Mauasant\", \"4\"))\n    print \"Number of rows updated:\"\
    , cur.rowcount\n```\n\n让我们更改第 4 行作者的名字：\n\n```python\ncur.execute(\"UPDATE Writers\
    \ SET Name = %s WHERE Id = %s\", (\"Guy Mauasant\", \"4\"))\n```\n\n在此处，我们使用了由\
    \ `%s` 标识的占位符。值在 SQL 语句执行之前绑定到占位符。\n\n```text\n$ ./prepared.py\nNumber of rows\
    \ updated: 1\nOne row has been updated\nmysql> SELECT Name FROM Writers WHERE\
    \ Id=4;\n+------------------+\n| Name           |\n+------------------+\n| Guy\
    \ Mauasant |\n+------------------+\n1 row in set (0.00 sec)\n```\n\n我们更改了第 4 行作者的名字。\n\
    \n## 插入图片\n\n有时你可能将图片放入数据库。并不是所有人推荐这样做，因为图片被称为二进制数据；然而，MySQL 数据库有一种专门用于存储二进制的数据类型\
    \ `BLOB`（二进制大对象）。其他变体有 `TINYBLOB`、`LONGBLOB` 和 `MEDIUMBLOB`。\n\n```text\nmysql>\
    \ CREATE TABLE Images(Id INT PRIMARY KEY, Data MEDIUMBLOB);\nQuery OK, 0 rows\
    \ affected (0.08 sec)\n```\n\n我们创建了一个名为 `Images` 的新表。\n\n```python\n#!/usr/bin/python\n\
    # -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ndef read_image():\n    fin = open(\"\
    woman.jpg\")\n    img = fin.read()\n    return img\ncon = mdb.connect('localhost',\
    \ 'testuser', 'test623', 'testdb')\nwith con:\n    cur = con.cursor()\n    data\
    \ = read_image()\n    cur.execute(\"INSERT INTO Images VALUES(1, %s)\", (data,\
    \ ))\n```\n\n在上面的脚本中，我们从磁盘读取了一个 .JPG 文件并将其放入名为 `Images` 的表中。\n\n"
- fmt: "\nWe now know how to insert an image into a table but how do we read that\
    \ image back?\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport\
    \ MySQLdb as mdb\ndef writeImage(data):\n    fout = open('woman2.jpg', 'wb')\n\
    \    with fout:\n        fout.write(data)\ncon = mdb.connect('localhost', 'testuser',\
    \ 'test623', 'testdb')\n\nwith con:\n    cur = con.cursor()\n    cur.execute(\"\
    SELECT Data FROM Images WHERE Id=1\")\n    data = cur.fetchone()[0]\n    writeImage(data)\n\
    ```\n\nThe above script shows that we read a file from the images table.\n\n`cur.execute(\"\
    SELECT Data FROM Images WHERE Id=1\")`\nWe have selected one record from the table.\n\
    \n`fout = open('woman2.jpg', 'wb')`\nNow we open a writable binary file.\n\n`fout.write(data)`\n\
    And we write that data to the disk.\n\nYou should now have an image titled `woman2.jpg`\
    \ in the current directory and we can look to see if it is the right one, the\
    \ one you inserted in the last example.\n\n## Transaction Support\n\nTransactions\
    \ are atomic units of database operations against the data in either one or several\
    \ different databases. The effect of the SQL statements in each transaction and\
    \ these can be rolled back or committed to that database.\n\nIf a database supports\
    \ a transaction, Python will automatically – and silently – start a transaction\
    \ as soon as the cursor is created. We use the `commit()` method for committing\
    \ the updates that are made with that cursor and we use the `rollback()` method\
    \ to roll them back, or discard them. Each of these methods will start a new transaction.\n\
    \nMySQL database includes several different storage engine types, the most common\
    \ of which are `MyISAM` and `InnoDB`. InnoDB is now the default engine although\
    \ there is some tradeoff between speed and security. The `MyISAM` tables process\
    \ much faster and offer no support for transactions. The `rollback()` and `commit()`\
    \ methods are not implemented and do not do anything. However, the `InnoDB` table\
    \ are infinitely more secure against the loss of data, and they support transactions,\
    \ although they are slower to process.\n\n```python\n#!/usr/bin/python\n# -*-\
    \ coding: utf-8 -*-\nimport MySQLdb as mdb\nimport sys\ntry:\n    con = mdb.connect('localhost',\
    \ 'testuser', 'test623', 'testdb')\n    cur = con.cursor()\n    cur.execute(\"\
    DROP TABLE IF EXISTS Writers\")\n    cur.execute(\"CREATE TABLE Writers(Id INT\
    \ PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25)) ENGINE=INNODB\")\n    cur.execute(\"\
    INSERT INTO Writers(Name) VALUES('Jack London')\")\n    cur.execute(\"INSERT INTO\
    \ Writers(Name) VALUES('Honore de Balzac')\")\n    cur.execute(\"INSERT INTO Writers(Name)\
    \ VALUES('Lion Feuchtwanger')\")\n    cur.execute(\"INSERT INTO Writers(Name)\
    \ VALUES('Emile Zola')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Truman\
    \ Capote')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Terry Pratchett')\"\
    )\n    con.commit()\nexcept mdb.Error, e:\n    if con:\n        con.rollback()\n\
    \    print \"Error %d: %s\" % (e.args[0],e.args[1])\n    sys.exit(1)\nfinally:\n\
    \    if con:\n        con.close()\n```\n\nThe writers table has been recreated\
    \ and we are now going to work explicitly with transactions.\n\n`cur = con.cursor()`\n\
    The `BEGIN` statement is not called to start a transaction in the Python DB API.\
    \ Instead, the transaction is started as soon as the cursor is created.\n\n`cur.execute(\"\
    CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25)) ENGINE=INNODB\"\
    )`\nIn this one, we are looking at an `InnoDB` table type – if you are using an\
    \ older version of MySQL, you will need to specify the engine type.\n\n`con.commit()`\n\
    The transaction must be ended with one of two things – a `commit()` or a `rollback()`\
    \ method. If you place a comment on this line, dented by the hash (`#`) symbol,\
    \ the table will still be created but the data will not be written to it.\n\n\
    So far, we have been working with transactions but have not explicitly it. Instead\
    \ we used context managers, which handle both the entry and exit from the runtime,\
    \ when the code block is executed. You can use connection objects as context managers\
    \ in `Mysldb`. These will automatically rollback or commit the transactions and\
    \ also clean the code by eliminating `try`, `finally` statements.\n\n```python\n\
    #!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ncon = mdb.connect('localhost',\
    \ 'testuser', 'test623', 'testdb')\nwith con:\n    cur = con.cursor()\n    cur.execute(\"\
    DROP TABLE IF EXISTS Writers\")\n    cur.execute(\"CREATE TABLE Writers(Id INT\
    \ PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(25))\")\n    cur.execute(\"INSERT INTO\
    \ Writers(Name) VALUES('Jack London')\")\n    cur.execute(\"INSERT INTO Writers(Name)\
    \ VALUES('Honore de Balzac')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Lion\
    \ Feuchtwanger')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Emile\
    \ Zola')\")\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Truman Capote')\"\
    )\n    cur.execute(\"INSERT INTO Writers(Name) VALUES('Terry Pratchett')\")\n\
    ```\n\nIn the above example, the context manager has dealt with all of the world\
    \ that is needed for error handling and has automatically committed or rolled\
    \ back a transaction.\n\n## Conclusion\n\nPython is a nice language to use, very\
    \ easy to read and to understand, While it may look complicated, it isn’t and,\
    \ once you get the hang of it, you can spend hours creating simple programs, before\
    \ you move on to the more complex ones.\n\nWhen you are ready to move on to more\
    \ advanced programming with Python, you will find plenty of information on the\
    \ internet to help you. In the meantime, take some time to get to grips with using\
    \ Python on Windows 10 and, above all, enjoy it!\n\nThanks you for downloading\
    \ my book. If you found it helpful, please consider leaving me a review at Amazon.com\n"
