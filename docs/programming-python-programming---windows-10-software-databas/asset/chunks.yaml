  raw: 'Variables


    Remember that very simple program we created at the beginning of this chapter?
    The x is a variable and we associated that with a number, in this case 3, before
    we printed it to the screen. Variables are the most basic concept of any programming
    language and are what we use to store values in while we work with them.


    The code we wrote – x = 3 – is a statement – statements on a particular job and
    in this case, the job is to assign the value (3) to the variable (x). In Python,
    this is known as binding and it is an important concept.


    The name of a variable in Python can be pretty much anything, provided you follow
    simple rules:


    ● It must only contain asci characters, underscores and digits – you cannot use
    any other symbol or a space


    ● It must not begin with a digit


    ● It cannot be any of the words that are on a reserved keyword list.


    Reserved Keywords


    ● and


    ● as


    ● assert


    ● break


    ● class


    ● continue


    ● def


    ● del


    ● elif


    ● else


    ● except


    ● exec


    ● finally


    ● for


    ● from


    ● global


    ● if


    ● import


    ● in


    ● is


    ● lambda


    ● not


    ● or


    ● pass


    ● print


    ● raise


    ● return


    ● try


    ● while


    ● with


    ● yield


    None of these keywords can be used in any file or program name as they are reserved
    by Python. As Python is a dynamic language, these keywords can change in the future
    so, to stay up to date, you can periodically check the current list of keywords
    by typing in the following in the terminal:


    ● #!/usr/bin/python


    ●  


    ● # keywords.py


    ●  


    ● import sys


    ● import keyword


    ●  


    ●  


    ● print "Python version: ", sys.version_info


    ● print "Python keywords: ", keyword.kwlist


    [Basic Variable Types](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    We now know that variables are a basic Python concept and so are all the different
    value types that variables can have. These are called data-types, denoting all
    the ways of storing the data. The word “type” has a particular meaning in computer
    programming, in that it means a specific way of categorizing different types of
    objects. Each object has a type and the most basic data types are:


    [Numbers](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    Integers


    Integers are whole numbers and, in theory, they are any whole number in between
    a range of plus infinity down to minus infinity. The range is limited by the computer
    but in Python, the absolute maximum size is limited by just one thing – how much
    memory your computer has got.


    Python uses two integer types – integers and long integers, which are integers
    that are longer than a specific amount.


    Floating Point Numbers


    Computers are very good when it comes to dealing with integers, or whole numbers.
    A floating point number is one that has a number after a decimal point, e.g. 5.2,
    or -8.1.


    Whole numbers can be stored as floating point numbers – all you do is add a decimal
    point in when you write it down, for example, 1.0, or 9.0\. Floating point numbers
    are quite a bit slower to work with because computers find them somewhat more
    complicated.


    In the newer versions of Python, if you try to divide an integer by an integer,
    you will get a result you don’t expect, for example:


    ●  


    ● >>> 7/2


    ● 3


    In order to get the right result, one of the integers must be converted to a floating
    point number:


    ● >>> 7.0/2


    ● 3.5


    [Strings](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    A string is simply a piece of text and Python will not make any distinction between
    a string that contains one character or an entire block of characters or text.
    Python contains two different string types – basic and Unicode.


    Basic string types are used to store text in a sequence of numbers, or bytes,
    with just one byte for each character. You should only use these if you know for
    certain that your text has ASCII values in it. They are also used for storing
    binary data and are often called byte-strings.


    Unicode strings use the Unicode standard to store text internally. These are a
    little more complicated to use because you have to know the encoding that you
    have stored the code in, whenever you read it or save it out. An overview of how
    to use each one is below:


    Basic String – you add a string to your program by surrounding the relevant text
    with single or double quote marks, for example:


    ● x = ''This is a string''


    ● y = "And so is this."


    You can also include a string that has a break in it, or runs over several lines,
    using triple quotes, like this:


    ● x = """This string


    ● goes over multiple lines.


    ● So it includes line breaks."""


    ●  


    ● y = ''''''This string uses single quotes.


    ● But it is still multi-line.


    ● As you might have guessed.''''''


    You can also include special characters, like a quote character or line breaks,
    by using escaped characters. Python uses the UNIX convention of making use of
    the backslash key as an escape character. For example:


    ● # The variable x is a string which contains


    ● # a single line break


    ● x = ''\n''


    ● # The variable y has an escaped quote character


    ● # To include the quote in the string (instead of


    ● # it terminating the string)


    ● y = ''Don\''t worry about quotes''


    ● # z is a single character - a backslash which has to be escaped


    ● # with another backslash


    ● z = ''\\''


    If you don’t want to use the escape key to enter a backslash in your test sting,
    you can use what is known as a raw string. To denote this, you would precede the
    string with r.


    Because raw strings are meant to be used for useful expressions and not, for example,
    Windows paths, they cannot have a backslash at the end. The backslash is interpreted
    by Python as an escape from the quote that comes after.


    Python strings are stored using numbers and are not encoded in any way. The interpreter
    will take what you give it and store it as a byte sequence. Because they hold
    bytes, these strings must only have ASCII characters in them, unless you add an
    encoding at the start – then you can include characters that are not ASCII. However,
    you should only do this if you really know what you are doing. 


    Unicode Strings – These contain an internal representation that allows text to
    be stored as text. In effect, your computer knows which characters are being compared
    by the text. However, you will still need to select an encoding for when you write
    or read that data.


    Unicode literals can be included in your program by putting a u at the front of
    the string. If you do not specify the encoding at the beginning, you will only
    be able to use ASCI characters but Python will store your data as Unicode and
    not a byte string.


    Quoting and escae rules are the same for Unicode strings as they are for byte
    strings:


    ● x = u''A unicode string''


    ●  


    ● y = u''''''A multi-line unicode


    ● string.''''''


    ●  


    ● y = ru"""This is a


    ● raw, multi-line


    ● unicode string !!!


    ● """


    You can force the interpreter to convert Unicode to byte strings and vice versa
    with specifying explicit encoding but you are likely to get one of the following
    errors:


    ● UnicodeEncodeError


    ● UnicodeDecodeError


    One of those will just bring your program crashing to a halt. When this happens,
    it is usually because one of the strings that you are trying to “implicitly” convert
    contains characters that cannot be represented in the default encoding (usually
    ASCII).


    [Other Useful Values](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    There are some other values that are extremely useful:


    ● None - Sometimes seen as Null in other programming languages, this represents
    “nothing”.


    ● True - The ''Boolean'' value of true.


    ● False - The Boolean value of false.


    You will see these values quite a lot throughout your programming life and they
    can be included in any program you write simply by writing:


    ● x = None


    ● y = True


    ● z = False


    [More Complex Data Types](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)'
