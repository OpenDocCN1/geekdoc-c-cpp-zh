    \n### `__init__.py` 和 `__all__` 变量\n\n如果你使用第一种方法，每当你访问 `bar` 时都必须使用前缀 `foo`。但在第二种方法中，你不需要这样做，因为你正在将模块本身导入到命名空间中。\n\
    \n你还可以使用 `__init__.py` 文件来决定包将将哪些模块导出为 API，同时通过重写 `__all__` 变量来保持其他模块为内部模块 ——\
    \ 示例：\n\n`__init__.py`:\n- `__all__ = [\"bar\"]`\n\n# MySQL Python 教程\n\n在最后一章节中，我想和你们讨论如何使用\
