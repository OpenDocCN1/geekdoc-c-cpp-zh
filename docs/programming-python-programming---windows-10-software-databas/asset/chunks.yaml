  raw: 'When you work with more complicated information, you might want to group certain
    data together. Python has a lot of concepts that allow you to do this, including
    things like list comprehensions, generators and iterators. The fundamental way
    of grouping this data is to use something called data-structures. These objects
    will store all of the values together and, in Python, you can create custom data-structures.
    However, it does have four built in ones. Object that are used to store data are
    known as containers.


    The following data types can have many different operations performed on them
    and many are built in to the data type already (called Methods).


    [The List](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    This is used to store groups of items in order. You can add to them or remove
    them at any time, sort them or search through the list for specific values. You
    can even start with a list that is empty, adding to it as you go along, or you
    can use one that is already pre-populated. Items that are included in your list
    can be any other object, and that includes other lists as well. This means that
    you can have many different lists, and lists of lists, using them to create a
    complex structure – these are useful as building blocks.


    When you write a list, it should have square brackets, with each item separated
    by a comma:


    ● # w is an empty list


    ● w = []


    ●  


    ● # x has only one member


    ● x = [3.0]


    ●  


    ● # y is a list of numbers


    ● y = [1, 2, 3, 4, 5]


    ●  


    ● # z is a list of strings


    ● # and other lists


    ● z = [''first'', [], ''second'', [1, 2, 3, 4], ''third'']


    You can access anything on a list by “indexing”. That index has to be an integer
    that represents the position of the item in the list. The first position is zero.
    Variables can be indexed by placing square brackets, containing the index, after
    the variable.


    If you attempt to get access to a position that has not yet been created, you
    will receive an IndexError on screen. If you want to access from the end of the
    list, you use negative indexes. -1 is the last position on your list, followed
    by -2, -3, etc.:


    ● >>> x = [1, 2, 3, 4, 5]


    ● >>> print x[0]


    ● 1


    ● >>> print x[4]


    ● 5


    ● >>> print x[-1]


    ● 5


    ● >>> print x[-5]


    ● 1


    ● >>> print x[10]


    ● Traceback (most recent call last):


    ●   File "<stdin>", line 1, in ?


    ● IndexError: list index out of range


    [Tuples](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    Tuples are similar to lists in that they store sequential information. However,
    they cannot be changed after they have been created, unlike a list, which can
    be. The interpreter knows exactly the types and the lengths of the members of
    a tuple and, as such, they are more efficient to work with than a list is. Tuples
    can be sliced or indexed but not changed and you will come across them “implicitly”
    throughout Python. An example of that would functions that return multiple values
    would return those values as a tuple.


    To create a tuple, you use parentheses, not square brackets:


    ● >>> x = (1, 2, 3,4)


    ● >>> x


    ● (1, 2, 3, 4)


    ● >>> x[0]


    ● 1


    ● >>> x = (1,)


    ● >>> x


    ● (1,)


    ● >>> x[0]


    ● 1


    ● >>> x = ()


    ● >>> x


    ● ()


    ● >>> x[0]


    ● Traceback (most recent call last):


    ●   File "<stdin>", line 1, in ?


    ● IndexError: tuple index out of range


    Even if you only have one member in the tuple, you still need to add the comma.
    If you just put a 1, for example, t would not be classed as a tuple, whereas 1,
    would be. If you need to create an empty tuple, you would use one of the following


    :


    ● ()


    ● tuple ()


    [Dictionaries](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    Dictionaries are one of the most useful and flexible types of data and Python
    is built on them. Dictionaries will store data but they use keys. This means you
    can look up particular pieces of data using that key. As with the other data types,
    there is a syntax built in to Python to allow you to create a dictionary:


    ● >>> x = {''key1'': ''value1'', ''key2'': ''value2''}


    ● >>> print x


    ● {''key2'': ''value2'', ''key1'': ''value1''}


    ●  


    The values can be retrieved though indexing, in the same way as you do with lists
    and using the same syntax. However, instead of the position you would use the
    key:


    ● >>> x = {''key1'': ''value1'', ''key2'': ''value2''}


    ● >>> print x[''key1'']


    ● value1


    Strings don’t have to be used as keys, instead any object can be used, provided
    it is immutable, i.e. it doesn’t change. This is another good example of where
    tuples come in handy:


    ● >>> attemptedKey = {}


    ● >>> x = {attemptedKey: ''some value to store''}


    ● Traceback (most recent call last):


    ●   File "<stdin>", line 1, in ?


    ● TypeError: dict objects are unhashable


    ● >>> anotherTry = (None, 2)


    ● >>> x = {anotherTry: ''some value to store''}


    ● >>> print x


    ● {(None, 2): ''some value to store''}


    [Sets](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)


    The set is, without a doubt, one of the most useful of all the data types; so
    useful that it is now a built in feature of Python. Sets have unique members and
    are extremely efficient for testing if a value is contained in the set. It is
    a good deal faster than using the list data type but, unlike all the other data
    types, there isn’t any syntax. In order to create a set you need to use the set
    constructor:


    ● >>> x = set()


    ● >>> x


    ● set([])


    ● >>> x.add(1)


    ● >>> x


    ● set([1])


    ● >>> x.add(1)


    ● >>> x


    ● set([1])


    ● >>> x.add(2)


    ● >>> 1 in x


    ● True


    ● >>> 2 in x


    ● True


    ● >>> 3 in x


    ● False


    ● >>>


    Conditions


    In order to evaluate conditions, Python uses Boolean variables. You already know
    that True and False are the Boolean variables that are returned when an expression
    is evaluated or compared, for example:


    ●  


    ● x = 2


    ● print x == 2 # prints out True


    ● print x == 3 # prints out False


    ● print x < 3  # prints out True


    If you notice, the variable assignment uses on Equals operator whereas a double
    Equals operator is used when a comparison between two variables is done. Not Equals
    is shown as “I=”


    Boolean operators


    You can build up complex Boolean expressions by using two Boolean operators –
    “and” and “or”. For example:


    ● name = "John"


    ● age = 23


    ● if name == "John" and age == 23:


    ● print "Your name is John, and you are also 23 years old."


    ●  


    ● if name == "John" or name == "Rick":


    ● print "Your name is either John or Rick."


    The "in" operator


    This can be used as a way of checking if a specific object actually exists inside
    an object container, like a list:


    ● if name in ["John", "Rick"]:


    ● print "Your name is either John or Rick."


    Python does not use brackets to define code blocks instead it uses indentation.
    Standard indentation is 4 spaces although you can use any other space amount or
    the tab button if you wish. Code blocks do not require any termination. The following
    example is the use of the “if” statement with code blocks:


    ● if <statement is true>:


    ●     <do something>


    ●     ....


    ●     ....


    ● elif <another statement is true>: # else if


    ●     <do something else>


    ●     ....


    ●     ....


    ● else:


    ●     <do another thing>


    ●     ....


    ●     ....


    For example:


    ● x = 2


    ● if x == 2:


    ●     print "x equals two!"


    ● else:


    ●     print "x does not equal to two."


    A statement can only be evaluated as True if any one of the following is right:


    ● The True Boolean variable is used or is calculated by using an expression, or


    ● An object that is not considered as “empty” is passed.


    Examples of objects that are considered as empty include:


    1.  An empty string – denoted by “”


    2.  An empty list – denoted by []


    3.  The number zero is used – 0


    4.  Use of the false Boolean value – False


    The ''is'' Operator


    The “is” operator does not match variable values; instead, it matches instances
    themselves. An example:


    ● x = [1,2,3]


    ● y = [1,2,3]


    ● print x == y # Prints out True


    ● print x is y # Prints out False


    ●  


    The "not" Operator


    If you use “not” in front of a Boolean operator, it will invert it:'
