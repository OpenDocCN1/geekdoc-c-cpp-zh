    The above shows the output from the example.\n\n## The Dictionary Cursor\n\nIn\
    \ the `MySQLdb` module, there are a number of cursor types. The default one returns\
    \ data in a tuple of tuples. The dictionary cursor sends the data in the format\
    \ of a dictionary, allowing us to refer to the data by the name of the columns:\n\
    \n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb as mdb\n\
    con = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\nwith con:\n \
    \   cur = con.cursor(mdb.cursors.DictCursor)\n    cur.execute(\"SELECT * FROM\
    \ Writers LIMIT 4\")\n    rows = cur.fetchall()\n    for row in rows:\n      \
    \  print row[\"Id\"], row[\"Name\"]\n```\n\nIn the above example, you can see\
    \ that we use the dictionary cursor to retrieve the first four rows from the table\
    \ called `Writers`. Broken down, the example looks like:\n\n```python\ncur = con.cursor(mdb.cursors.DictCursor)\n\
    cur.execute(\"SELECT * FROM Writers LIMIT 4\")\nfor row in rows:\n    print row[\"\
    Id\"], row[\"Name\"]\n```\n\nThe `DictCursor` is used to bring in four rows from\
    \ the table. The data is referred to by the names of the columns.\n\n```text\n\
    $ ./dict.py\n1 Jack London\n2 Honore de Balzac\n3 Lion Feuchtwanger\n4 Emile Zola\n\
    ```\n\nThe above is an example of the output.\n\n## Column Headers\n\nNext, we\
    \ will look at how to print the column headers, with the data, from the table\
    \ in the database:\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\n\
    import MySQLdb as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\n\
    with con:\n    cur = con.cursor()\n    cur.execute(\"SELECT * FROM Writers LIMIT\
    \ 5\")\n    rows = cur.fetchall()\n    desc = cur.description\n    print \"%s\
    \ %3s\" % (desc[0][0], desc[1][0])\n    for row in rows:\n        print \"%2s\
    \ %3s\" % row\n```\n\nOnce again, we can print the contents of the table to the\
    \ window and, this time, we are including the column names. These are called “metadata”\
    \ and are obtained from the `cursor` object. We use the `description` attribute\
    \ to return the information from each column and then we print and format the\
    \ names of the columns.\n\n```text\n$ ./columnheaders.py\nId Name\n1 Jack London\n\
    2 Honore de Balzac\n3 Lion Feuchtwanger\n4 Emile Zola\n5 Truman Capote\n```\n\n\
    The above is the output from the script.\n\n## Prepared Statements\n\nNow let’s\
    \ look at prepared statements. When we write one of these, we use a placeholder\
    \ instead of writing the values. Prepared statements increase both performance\
    \ and security and Python DB gives you five different ways to build a prepared\
    \ statement. One of those ways, the ANSI format code, is supported by the `MySQLdb`\
    \ module.\n\n```python\n#!/usr/bin/python\n# -*- coding: utf-8 -*-\nimport MySQLdb\
    \ as mdb\ncon = mdb.connect('localhost', 'testuser', 'test623', 'testdb')\nwith\
    \ con:\n    cur = con.cursor()\n    cur.execute(\"UPDATE Writers SET Name = %s\
    \ WHERE Id = %s\", (\"Guy de Mauasant\", \"4\"))\n    print \"Number of rows updated:\"\
    , cur.rowcount\n```\n\nLet’s change an author name, the one on row 4:\n\n```python\n\
    cur.execute(\"UPDATE Writers SET Name = %s WHERE Id = %s\", (\"Guy de Mauasant\"\
    , \"4\"))\n```\n\nIn this, we have used placeholders, identified by the `%s` markers.\
    \ The values are bound to the placeholder before the SQL statement is executed.\n\
    \n```text\n$ ./prepared.py\nNumber of rows updated: 1\nOne row has been updated\n\
    mysql> SELECT Name FROM Writers WHERE Id=4;\n+------------------+\n| Name    \
    \       |\n+------------------+\n| Guy de Mauasant |\n+------------------+\n1\
    \ row in set (0.00 sec)\n```\n\nWe have changed the name of the author on row\
    \ 4.\n\n## Inserting Images\n\nSometimes you might want to put an image into your\
