- fmt: "\n# Variables\n\nRemember that very simple program we created at the beginning\
    \ of this chapter? The `x` is a variable and we associated that with a number,\
    \ in this case 3, before we printed it to the screen. Variables are the most basic\
    \ concept of any programming language and are what we use to store values in while\
    \ we work with them.\n\nThe code we wrote `x = 3` – is a statement – statements\
    \ on a particular job and in this case, the job is to assign the value (3) to\
    \ the variable (`x`). In Python, this is known as binding and it is an important\
    \ concept.\n\nThe name of a variable in Python can be pretty much anything, provided\
    \ you follow simple rules:\n\n* It must only contain asci characters, underscores\
    \ and digits – you cannot use any other symbol or a space\n* It must not begin\
    \ with a digit\n* It cannot be any of the words that are on a reserved keyword\
    \ list.\n\n## Reserved Keywords\n\n* `and`\n* ` as`\n* `assert`\n* `break`\n*\
    \ `class`\n* `continue`\n* `def`\n* `del`\n* `elif`\n* `else`\n* `except`\n* `exec`\n\
    * `finally`\n* `for`\n* `from`\n* `global`\n* `if`\n* `import`\n* `in`\n* `is`\n\
    * `lambda`\n* `not`\n* `or`\n* `pass`\n* `print`\n* `raise`\n* `return`\n* `try`\n\
    * `while`\n* `with`\n* `yield`\n\nNone of these keywords can be used in any file\
    \ or program name as they are reserved by Python. As Python is a dynamic language,\
    \ these keywords can change in the future so, to stay up to date, you can periodically\
    \ check the current list of keywords by typing in the following in the terminal:\n\
    \n```python\n#!/usr/bin/python\n# keywords.py\nimport sys\nimport keyword\nprint\
    \ \"Python version: \", sys.version_info\nprint \"Python keywords: \", keyword.kwlist\n\
    ```\n\n[Basic Variable Types](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nWe now know that variables are a basic Python concept and so are all the different\
    \ value types that variables can have. These are called data-types, denoting all\
    \ the ways of storing the data. The word “type” has a particular meaning in computer\
    \ programming, in that it means a specific way of categorizing different types\
    \ of objects. Each object has a type and the most basic data types are:\n\n[Numbers](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \n#### Integers\n\nIntegers are whole numbers and, in theory, they are any whole\
    \ number in between a range of plus infinity down to minus infinity. The range\
    \ is limited by the computer but in Python, the absolute maximum size is limited\
    \ by just one thing – how much memory your computer has got.\n\nPython uses two\
    \ integer types – integers and long integers, which are integers that are longer\
    \ than a specific amount.\n\n#### Floating Point Numbers\n\nComputers are very\
    \ good when it comes to dealing with integers, or whole numbers. A floating point\
    \ number is one that has a number after a decimal point, e.g. 5.2, or -8.1.\n\n\
    Whole numbers can be stored as floating point numbers – all you do is add a decimal\
    \ point in when you write it down, for example, 1.0, or 9.0. Floating point numbers\
    \ are quite a bit slower to work with because computers find them somewhat more\
    \ complicated.\n\nIn the newer versions of Python, if you try to divide an integer\
    \ by an integer, you will get a result you don’t expect, for example:\n\n```python\n\
    >>> 7/2\n3\n```\n\nIn order to get the right result, one of the integers must\
    \ be converted to a floating point number:\n\n```python\n>>> 7.0/2\n3.5\n```\n\
    \n[Strings](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nA string is simply a piece of text and Python will not make any distinction\
    \ between a string that contains one character or an entire block of characters\
    \ or text. Python contains two different string types – basic and Unicode.\n\n\
    Basic string types are used to store text in a sequence of numbers, or bytes,\
    \ with just one byte for each character. You should only use these if you know\
    \ for certain that your text has ASCII values in it. They are also used for storing\
    \ binary data and are often called byte-strings.\n\nUnicode strings use the Unicode\
    \ standard to store text internally. These are a little more complicated to use\
    \ because you have to know the encoding that you have stored the code in, whenever\
    \ you read it or save it out. An overview of how to use each one is below:\n\n\
    **Basic String** – you add a string to your program by surrounding the relevant\
    \ text with single or double quote marks, for example:\n\n```python\nx = 'This\
    \ is a string'\ny = \"And so is this.\"\n```\n\nYou can also include a string\
    \ that has a break in it, or runs over several lines, using triple quotes, like\
    \ this:\n\n```python\nx = \"\"\"This string\ngoes over multiple lines.\nSo it\
    \ includes line breaks.\"\"\"\n\ny = '''This string uses single quotes.\nBut it\
