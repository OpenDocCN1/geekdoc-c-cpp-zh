    To set up the `PATH` variable, so that Windows 10 knows where to look for Python:


    * Right click `My Computer`

    * Select `Properties`

    * On the next screen, click on `Advanced`

    * On the next screen, click on `Environment Variables`

    * I am going to assume that, when you installed Python, you chose to install it
    just for you and not for everyone else on the system – click on `Path` – located
    in the box under `User Variables`

    * Click on `Edit`

    * On the next screen, look of the variable value box and place your cursor after
    the (`;`) which denotes the last entry

    * Enter the following as the final entry in the box and do NOT forget to include
    the (`;`) semicolon at the end – `C:\Python25\Scripts;`

    * Click on `OK` another three times to get out of `System Properties`

    * Now open up a command prompt by clicking on `Start`, `Run` and typing in `cmd`.
    Click on `OK`

    * In the next box type in `easy_install BeautifulSoup` – this will install the
    module `BeautifulSoup` – repeat this for any other module that you want to use
    and they will be installed

    * When you get back to the command prompt, type in `Python` and then press Enter.

    * Type in `import BeautifulSoup` (or the name of any other module)

    * Another prompt will appear without showing any error messages. We now know that
    we have set the `PATH` variable properly and that `EasyInstall` was installed
    correctly.

    * You also now know how to install new packages!


    That is all there is to installing Python and `EasyInstall` on your computer.
    Next, Cygwin.


    ## Installing Cygwin


    This isn’t quite so easy


    * Go to `http://cygwin.com/http://cygwin.com/`

    * Click on `Install Cygwin` from the menu on the left

    * Click on `setup-x86.exe` and then run it


    `Cygwin` is a useful program as it will download other programs from the internet
    and install them for you. You will need to provide information about your internet
    connection, although, as you go through the set up process, you will mostly be
    able to accept the default settings.


    Once that has completed, you will be presented with a list of download sites.
    They are all identical so just pick any one from the list and click on `Next`.


    Now you will get an `Upgrade` warning – this will only be applicable to those
    who are upgrading from an older version of `Cygwin`. If this is the first time
    you have installed it, ignore this message.


    Now you will be presented with a list of software to download. You want three
    packages – `openssh`, `git` and `curl`. Type the name of each one into the search
    on the site and, when the package comes up, click on `Skip`. This will ensure
    that the latest version is installed – do this for each package.


    Once those three are ready for installation, `Cygwin` will inform you that you
    need to install other packages as dependencies. What this means is, if you wat
    to use a specific package, called `A` for example, and `A` needs another package
    called `B` to run properly, `Cygwin` will know this and will ask if it can install
    package `B` as well as `A`.


    When this message appear, just click on `Next`, `Cygwin` will begin to download
    and install the three packages you asked for as well as all of their dependencies.
    This can take a while, although that will depend on how fast your internet connection
    is. On your screen, you will see three separate progress bars – when the middle
    one, called `TOTAL`, is full, `Cygwin` has finished.


    If you have requested that `Cygwin` put an icon on your desktop, it will proceed
    to do so and you will see a shortcut called `Cygwin Terminal`. This is the icon
    you will use when you run your Python code as well as for accessing the packages
    you downloaded through `Cygwin`.


    Click on it and a terminal window will appear and we can begin to use it. First
    of all, we need to find out which packages have actually been installed so, at
    the command prompt, type the word `which`.


    A list of packages will appear and will most likely show you all the `Cygwin`
    packages you installed but it may not show Python itself. That’s OK, because you
    did not install Python using `Cygwin`. Now you need to tell `Cygwin` to find `Python`
    and you do that by typing the following command:


    ```bash

    $ echo "PATH=$PATH:/cygdrive/c/Python32" >> .bash_profile

    ```


    Make sure that you type in the version of Python that you are using – if you installed
    a different version replace `Python32` with the correct one. You will only need
    to do this step once; after this, the terminal will find Python all the time.


    That’s `Cygwin` installed and set up, the final step is to set up your text editor.
    I am giving you the instructions for `Sublime Text` – if you use a different one
    make sure you follow the installation instructions that come with it. Be aware
    that `Microsoft Word` is NOT a text editor; it is a word processing program and,
    as such, cannot be used for this.


    ## Installing Sublime Text


    `lime text` is a very powerful text editor, it is very useful and it also has
    a free trial that does not expire.


    * Go to `http://www.sublimetext.com/` and download the installer

    * Run it


    While `Sublime Text` is not free, you can use it on a trial for as long as you
    like. I would suggest though, if you get on with it and use it to write a lot
    of programs, that you purchase a license for the full software – do this with
    any that you use.


    ## Check it All Works


    Now that everything is installed, it’s time to see if it all works OK. The very
    first program that any programmer writes is the now famous “Hello World!” program.
    All this does is turn out text on the terminal and is a good way of checking that
    everything works as it should. Type the following in your terminal:


    ```bash

    $ python -c ''print("Hello World!")''

    ```


    If that works, open up `Sublime Text` and we will write a program. Type the following
    into the text editor:


    ```python

    #!/usr/bin/env python

    print("Hello, World!")

    ```


    Save it to your Home Directory, making sure it goes in `C:\win` as `hello.py`.
    Open your terminal and type:


    ```bash

    $ chmod+x hello.py

    $ ./hello.py

    ```


    You should see “Hello, World!” on your screen. If it does, you are ready to start
    learning how to use Python on your Windows 10.


    ## Getting To Grips With Python


    On your windows desktop, you should see a Python icon. Double click on it and
    this will open up the Interactive Interpreter. This is where you are going to
    type in individual commands and see what results are. It’s a really good way of
    experimenting to see what commands do and it is also a highly useful tool. Type
    in:


    ```python

    >>> x = 3

    >>> print x

    3

    >>>

    ```

