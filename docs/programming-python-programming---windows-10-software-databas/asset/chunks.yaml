    Introduction


    Knowing where to begin with computer programming can be a real challenge. Most
    people have little to no knowledge of how to write computer code or where to even
    begin when it comes to writing a computer program. Python is an easy language
    to learn, and is capable of so much more than just simple programming.


    It is a general purpose language that first appeared in the 1980’s and was, believe
    it or not, named after Monty Python. It’s used for a wide range of purposes, from
    testing microchips, to powering some of the biggest websites in the world and
    to building video games. Python is a small language, is close to the English language
    and contains hundreds of third party libraries.


    Because Python is similar to the English language, it is easy to read. It also
    follows very strict rules on punctuation, which means that, unlike some computer
    languages, your code is not littered with annoying curly braces ({ }), that get
    in the way and make it difficult to read. Python also contains PEP 8, a set of
    rules that tells each Python developer how their code should be formatted, meaning
    you always know what to do, where a new line should be and helps you to read other
    Python scripts, no matter who wrote them. 


    Python has been in existence for more than 20 years and there is an awful lot
    of Python code about. It is also an open source language, which means that anyone
    can take it, read it and modify it for their own uses.  There are plenty of Python
    community groups where users can go to get help or just join in general Python
    chitchat.


    In this book, I want to talk about what Python can do and how to get it up and
    running on your Windows 10 PC, as well as how to use it. This is suitable for
    complete beginners or for more advanced users and I hope that everyone will gain
    something from this book.


    Configuring Your Windows 10 Environment For Python


    So, you want to learn how to use Python on your Windows 10 computer. The first
    thing you need to do is configure your Windows environment, i.e. your computer,
    and prepare it for use with the programming language.


    What You Need:


    ●  


    ● A Windows 10 PC or laptop


    ● Python


    ● Cygwin


    ● A text editor


    Let’s look at this one step at a time:


    Installing Python on Windows


    There are a couple of things you need to do to get the Python environment running
    on your Windows computer:


    ● Download and install Python


    ● Use the Windows Python Installation


    ● Install a Package Manager


    Download and Install Python


    ● First of all, you need to download the correct installation package, so go to
    [http://www.python.org/download/windows/http://www.python.org/download/windows/](http:///h)


    ● Click on Individual Releases


    ● You will now be taken to a list of releases, choose the latest one


    ● Make sure that you download the version that corresponds with the version of
    Windows that you are running and whether it is 32 or 64-bit.


    ● If you are running the Mozilla Firefox browser, click on Save File. If you are
    using Internet Explorer, click on Run


    ● The Python installer will open so select who is going to be able to access Python
    on your system – ether just you, or anyone on the system. Click on Next


    ● Now you need to pick a directory to install Python to – leave it as the default
    selected and click on Next


    ● Click the box to accept the installation options and click on Next


    ● Python will now start to install on your system. Leave it until it has finished
    and then click on Finish


    Using the Windows Python Installation


    ● Click the Start menu and look for Python v*.*.* - whichever version you installed


    ● You will see that several things have been installed.


    o IDLE – Python GUI – similar to the command line Python prompt but it has an
    interface which is graphical


    o Module Docs – a help file that tells you about the installed modules


    o Python (Command line) – looks like the server prompt


    o Python Manuals – there for hl if and when you need it


    o Uninstall Python – which you will hopefully never have to use.


    Before you can access Python just by typing it at the command prompt, we need
    to set the Windows PATH variable, which we will do next.


    Installing a Package Manager


    You will very quickly determine that you need to install a module that is not
    included in the standard distribution of Python. To do this, we need to install
    a Package Manager that will let us install the new packages. For this bit, we
    are using EasyInstall but, later on, I will tell you how to install and use Cygwin
    as well, so you have the choice.


    ● Go to [http://peak.telecommunity.com/DevCenterEasyInstall](http:///h) 


    ● Click on Installing “Easy Install”


    ● Right click on the ez setup.py linked and select Save Link as or Save Target
    as


    ● When it has finished, find the .py file on your PC and double click on it so
    it runs. It will open and run within Python and will be installed'
