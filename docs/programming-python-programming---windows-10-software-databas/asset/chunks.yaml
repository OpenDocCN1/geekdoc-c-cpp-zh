- fmt: "\nWhen you work with more complicated information, you might want to group\
    \ certain data together. Python has a lot of concepts that allow you to do this,\
    \ including things like list comprehensions, generators and iterators. The fundamental\
    \ way of grouping this data is to use something called data-structures. These\
    \ objects will store all of the values together and, in Python, you can create\
    \ custom data-structures. However, it does have four built in ones. Object that\
    \ are used to store data are known as containers.\n\nThe following data types\
    \ can have many different operations performed on them and many are built in to\
    \ the data type already (called Methods).\n\n### [The List](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nThis is used to store groups of items in order. You can add to them or remove\
    \ them at any time, sort them or search through the list for specific values.\
    \ You can even start with a list that is empty, adding to it as you go along,\
    \ or you can use one that is already pre-populated. Items that are included in\
    \ your list can be any other object, and that includes other lists as well. This\
    \ means that you can have many different lists, and lists of lists, using them\
    \ to create a complex structure – these are useful as building blocks.\n\nWhen\
    \ you write a list, it should have square brackets, with each item separated by\
    \ a comma:\n\n● # `w` is an empty list\n● `w = []`\n● # `x` has only one member\n\
    ● `x = [3.0]`\n● # `y` is a list of numbers\n● `y = [1, 2, 3, 4, 5]`\n● # `z`\
    \ is a list of strings\n# and other lists\n● `z = ['first', [], 'second', [1,\
    \ 2, 3, 4], 'third']`\n\nYou can access anything on a list by “indexing”. That\
    \ index has to be an integer that represents the position of the item in the list.\
    \ The first position is zero. Variables can be indexed by placing square brackets,\
    \ containing the index, after the variable.\n\nIf you attempt to get access to\
    \ a position that has not yet been created, you will receive an `IndexError` on\
    \ screen. If you want to access from the end of the list, you use negative indexes.\
    \ `-1` is the last position on your list, followed by `-2`, `-3`, etc.:\n\n```python\n\
    >>> x = [1, 2, 3, 4, 5]\n>>> print x[0]\n1\n>>> print x[4]\n5\n>>> print x[-1]\n\
    5\n>>> print x[-5]\n1\n>>> print x[10]\nTraceback (most recent call last):\n \
    \ File \"<stdin>\", line 1, in ?\nIndexError: list index out of range\n```\n\n\
    ### [Tuples](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nTuples are similar to lists in that they store sequential information. However,\
    \ they cannot be changed after they have been created, unlike a list, which can\
    \ be. The interpreter knows exactly the types and the lengths of the members of\
    \ a tuple and, as such, they are more efficient to work with than a list is. Tuples\
    \ can be sliced or indexed but not changed and you will come across them “implicitly”\
    \ throughout Python. An example of that would be functions that return multiple\
    \ values would return those values as a tuple.\n\nTo create a tuple, you use parentheses,\
    \ not square brackets:\n\n```python\n>>> x = (1, 2, 3,4)\n>>> x\n(1, 2, 3, 4)\n\
    >>> x[0]\n1\n>>> x = (1,)\n>>> x\n(1,)\n>>> x[0]\n1\n>>> x = ()\n>>> x\n()\n>>>\
    \ x[0]\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in ?\n\
    IndexError: tuple index out of range\n```\n\nEven if you only have one member\
    \ in the tuple, you still need to add the comma. If you just put a `1`, for example,\
    \ `t` would not be classed as a tuple, whereas `1,` would be. If you need to create\
    \ an empty tuple, you would use one of the following:\n\n● `()`\n● `tuple ()`\n\
    \n### [Dictionaries](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nDictionaries are one of the most useful and flexible types of data and Python\
    \ is built on them. Dictionaries will store data but they use keys. This means\
    \ you can look up particular pieces of data using that key. As with the other\
    \ data types, there is a syntax built in to Python to allow you to create a dictionary:\n\
    \n```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>> print x\n{'key2':\
    \ 'value2', 'key1': 'value1'}\n```\n\nThe values can be retrieved though indexing,\
    \ in the same way as you do with lists and using the same syntax. However, instead\
    \ of the position you would use the key:\n\n```python\n>>> x = {'key1': 'value1',\
    \ 'key2': 'value2'}\n>>> print x['key1']\nvalue1\n```\n\nStrings don’t have to\
    \ be used as keys, instead any object can be used, provided it is immutable, i.e.\
    \ it doesn’t change. This is another good example of where tuples come in handy:\n\
    \n```python\n>>> attemptedKey = {}\n... Traceback (most recent call last):\n \
    \ File \"<stdin>\", line 1, in ?\nTypeError: unhashable type\n```\n\n### [Sets](http://www.voidspace.org.uk/python/articles/python_datatypes.shtml#/h)\n\
    \nSets are one of the most useful and flexible types of data and Python is built\
    \ on them. Dictionaries will store data but they use keys. This means you can\
    \ look up particular pieces of data using that key. As with the other data types,\
    \ there is a syntax built in to Python to allow you to create a dictionary:\n\n\
    ```python\n>>> x = {'key1': 'value1', 'key2': 'value2'}\n>>> print x\n{'key2':\
    \ 'value2', 'k1': 'value1'}\n```\n\nThe values can be retrieved though indexing,\
    \ in the same way as you do with lists and using the same syntax. However, instead\
    \ of the position you would use the key:\n\n```python\n>>> x = {'key1': 'value1',\
    \ 'key2': 'value2'}\n>>> print x['key1']\nvalue1\n```\n\nStrings don’t have to\
    \ be used as keys, instead any object can be used, provided it is immutable, i.e.\
    \ it doesn’t change. This is another good example of where tuples come in handy:\n\
