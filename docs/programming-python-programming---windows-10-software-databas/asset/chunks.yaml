    \ Mozilla 浏览器，点击“另另文件为”。如果你使用的是 Internet Explorer，点击“运行”。\n- Python 安装程序将打开，选择谁可以在你的系统上访问\
    \ Python——是你或系统上的任何人。点击“下一步”。\n- 现在你需要选择安装 Python 的目录——保持默认选择并点击“下一步”。\n- 勾选接受安装选项并点击“下一步”。\n\
    - Python 现在将开始在你的系统上安装。等待其完成，然后点击“完成”。\n\n### 使用 Windows Python 安装\n\n- 点击开始菜单并寻找\
    \ Python v.* ——取决于你安装的版本\n- 你将看到安装了几个项目：\n    - IDLE – Python GUI – 类似于命令行 Python\
    \ 提示符，但它有一个图形界面\n    - Module Docs – 一个关于已安装模块的帮助文件\n    - Python (命令行) – 类似于服务器提示符\n\
    \    - Python Manuals – 手册，以备不时\n    - Uninstall Python – 希望你永远不需要使用\n\n在可以通过命令行提示符直接访问\
    \ Python 之前，我们需要设置 Windows PATH 变量，我们下一步完成。\n\n### 安装包管理器\n\n你很快就会发现你需要安装未包含在\
    \ Python 标准发行版中的模块。为了实现这一点，我们需要安装一个包管理器来安装新包。在这一部分，我们使用 EasyInstall，但之后我还会教你如何安装\
    \ Cygwin，以便你可以选择。\n\n- 访问 `http://peak.telecommunity.com/DevCenterEasyInstall`\n\
    - 点击 安装 “Easy Install”\n- 右键点击链接的 `setup.py` 并选择“链接另存为”或“保存目标为”\n- 完成后，在 PC 上找到该\
    \ `.py` 文件并双击运行它。它将在 Python 内部运行并完成安装\n\n"
