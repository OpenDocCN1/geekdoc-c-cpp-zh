- fmt: "\n● `print not False` # Prints out True\n\n● `print (not False) == (False)`\
    \ # Prints out False\n\n# Loops\n\nPython has two different types of loop – `For`\
    \ and `While`. The “for” loop will iterate over a specific sequence, for example:\n\
    \n● `primes = [2, 3, 5, 7]`\n● `for prime in primes:`\n● `print prime`\n\nThey\
    \ are able to iterate over number sequences that use the `range` and the `xrange`\
    \ functions. The difference between these two is that the first will return a\
    \ new list containing numbers of a specific range while the second will return\
    \ an iterator, which is far more efficient.\n\n● ` # Prints out the numbers 0,1,2,3,4\n\
    ● `for x in xrange(5):` # or `range(5)`\n● `print x`\n\n● ` # Prints out 3,4,5`\n\
    ● `for x in xrange(3, 6):` # or `range(3, 6)`\n● `print x`\n\n● ` # Prints out\
