    ●     cur = con.cursor()


    ●     cur.execute("DROP TABLE IF EXISTS Writers")


    ●     cur.execute("CREATE TABLE Writers(Id INT PRIMARY KEY AUTO_INCREMENT, \


    ●                  Name VARCHAR(25))")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Jack London'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Honore de Balzac'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Lion Feuchtwanger'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Emile Zola'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Truman Capote'')")


    ●     cur.execute("INSERT INTO Writers(Name) VALUES(''Terry Pratchett'')")


    In the above example, the context manager has dealt with all of the world that
    is needed for error handling and has automatically committed or rolled back a
    transaction.


    Conclusion


    Python is a nice language to use, very easy to read and to understand, While it
    may look complicated, it isn’t and, once you get the hang of it, you can spend
    hours creating simple programs, before you move on to the more complex ones.


    When you are ready to move on to more advanced programming with Python, you will
