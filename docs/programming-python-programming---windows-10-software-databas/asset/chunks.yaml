    \ created a new table that we have called `Images`.\n\n```python\n#!/usr/bin/python\n\
    # -*- coding: utf-8 -*-\nimport MySQLdb as mdb\ndef read_image():\n    fin = open(\"\
    woman.jpg\")\n    img = fin.read()\n    return img\ncon = mdb.connect('localhost',\
    \ 'testuser', 'test623', 'testdb')\nwith con:\n    cur = con.cursor()\n    data\
    \ = read_image()\n    cur.execute(\"INSERT INTO Images VALUES(1, %s)\", (data,\
    \ ))\n```\n\nIn the script above, we have read a .JPG file from a disk and put\
    \ it into the table called `Images`.\n"
