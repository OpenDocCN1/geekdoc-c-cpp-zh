  md: "# The declaration\n\n```\ndouble sqrt (d)\n    double d;\n    |------|\n```\n\
    \ndeclares sqrt to be a function returning double when called with a single argument\
    \ of type double. A more complicated example follows:\n\n```\nchar * p (ac,c)\n\
    \    char ac [] ;\n    char c;\n    { body }\n```\n\nwhich declares p to be a\
    \ function returning a pointer to char, called with the name of an array of chars\
    \ (corresponding to ac), and a char (corresponding to c).\n\nNote that, for a\
    \ variety of reasons, both of these argument declarations are misleading because\
    \ of the way c evaluates expressions in general and actual parameters to function\
    \ calls in particular. Thus, ac is actually a pointer to char, while c is most\
    \ likely an int. These mysteries will be explored in [3.6].\n\n# 1.7 Composite\
    \ types\n\nUp to this point, we have considered very simple forms of declarator,\
    \ mostly identifiers standing alone or with some simple qualification. The full\
    \ syntax rule for declarator is\n\n```\ndeclarator =\n    identifier\n  | * declarator\
    \                % pointer\n  | declarator ( )              % function\n  | declarator\
    \ [ constant-expr ] % array\n  | ( declarator )              % association control\n\
    ```\n\nThe form of this rule shows that a declarator is built from a unique identifier\
    \ by a succession of qualifications (pointer to, function returning, or array\
    \ of) and occasional parentheses to override the default associations in declarators.\
    \ The syntax of a declarator matches the syntax of valid expressions involving\
    \ the imbedded identifier; hence, the meaning of a compound declara-"
