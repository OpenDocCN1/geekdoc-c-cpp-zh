  md: 'By special dispensation, formal arguments to a function may be given the storage
    class register. This does not imply that the corresponding argument necessarily
    is passed in a fast register, but that it is copied to one, if available, upon
    entry to the function for subsequent use. As with all uses of the register storage
    class, this should be considered as an advice to the compiler to help it better
    optimize code. It can never cause a diagnostic if there are insufficient (or no)
    registers available for allocation.


    Register variables behave much as any automatic variable, except that it is not
    permissible to take the address of a register; this means that they cannot be
    used with the unary & or binary . operators, and that they cannot hold composite
    items (arrays, structures, unions, functions).


    # 4.1 Local integer variables


    Integer variables may be locally declared with any of the storage classes auto,
    register, static, or extern. The first two may be initialized with any expression
    that is defined on entry to the compound statement and that may be assigned to
    an integer variable. The static locals follow the same rules as for external declarations
    [2.1]; externs may not be initialized.


    # 4.2 Local floating point variables


    Floating variables may be locally declared with any of the storage classes auto,
    register, static, or extern. The first two may be initialized with any expression
    that is defined on entry to the compound statement and that may be assigned to
    a floating variable. The static locals follow the same rules as for external declarations
    [2.2]; externs may not be initialized.


    # 4.3 Local pointer variables


    Pointer variables may be locally declared with any of the storage classes auto,
    register, static, or extern. The first two may be initialized with any expression
    that is defined on entry to the compound statement and that may be assigned to
    an integer'
