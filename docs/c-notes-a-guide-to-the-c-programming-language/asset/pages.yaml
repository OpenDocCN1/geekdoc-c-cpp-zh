  md: 'The C language has sequence expressions that consist of a sequence of expressions
    separated by commas, that is, an expr list. It is recommended to package a sequence-expr
    in enclosing parentheses since sometimes they may occur in a context in which
    commas have other meanings as well, as in an argument list. The meaning of


    ```

    (t = x, s = y - f(t), s*7.3)

    ```


    is much the same as if we wrote the compound statement


    ```

    {t = x, s = y - f(t); s*7.3}

    ```


    in the place of an expression. The three subexpressions are evaluated in order
    from left to right as would be implied by the semicolons in the analogous compound
    statement; the value delivered is the value of the last (right-most) expr of the
    list.


    # 3.1 Integer expressions


    The basic integer expressions are the so-called integer primaries, which include
    integer constants, integer and character variable names, integer function calls
    (see [3.6]), and parenthesized integer expressions. The following are integer
    primaries:


    +   - 25

    +   - k

    +   - count(p,3)

    +   - (i - 2 * k)


    More complicated name expressions like p -> qlk1.n will be treated in subsequent
    sections.


    Integer primaries can be combined with other integer expressions using the unary
    operators + and -, or one of the binary operators +, -, *, /, %. The integer quotient
    (/) and remainder (%) operators produce the expected quotient and remainder (truncated
    toward zero) when both operands are positive. The result is otherwise somewhat
    machine-dependent. The other three operators are those of normal integer arithmetic.
    For example, 3+6 is 9, 3-5 is -2, 3*12 is 36, 17/5 is 3 and 17%5 is 2.'
