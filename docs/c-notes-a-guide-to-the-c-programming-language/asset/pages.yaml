- pgno: 42
  md: "# 2: INITIALIZERS\n\n> *Beginnings are such perilous times.*\n> \n> — Frank\
    \ Herbert, Dune\n\n# 2.0 Introduction\n\n*Initializers* are a convenient way to\
    \ ensure that certain variables have meaningful values at the beginning of a program\
    \ execution, or to construct tables of constants to aid run-time computation.\
    \ Function declarations, which form the core of most C programs, also can be looked\
    \ on as having initializers for objects of type function.\n\nThe syntax governing\
    \ data initializers is\n\n```\ninitializable-declarator =\n  declarator initializer_opt\n\
    \ninitializer =\n  =_opt { expr | { initializer-list } , }_opt\n```\n\nNote that\
    \ a trailing comma is explicitly permitted, to simplify writing long lists. A\
    \ very simple *initializable-declarator* is\n\n```\ndouble x = -0.2E3;\n```\n\n\
    while in the following declaration:\n\n```\nCOMPLEX vector[3] =\n  {{0, 1}, {-3.14,\
    \ 2.718}, {0.3, 4.1E-13}};\n```\n\nthere is a complex initializer consisting of\
    \ a list of three initializers, one for each element of the array of three COMPLEX.\
    \ Each of the three initializers in the list is itself a list of initializers"
  merge: -1
  img_proc: true
