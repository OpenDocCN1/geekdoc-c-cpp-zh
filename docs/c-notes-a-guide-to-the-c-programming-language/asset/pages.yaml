- pgno: 12
  md: 'turns out that these other functions are available on the run-time library
    (see [6.01]); there is nothing otherwise magical about them.


    Clearly, a lot more explanation is in order, but that must be spread over several
    chapters. For now, the focus must remain on the building blocks of a C program,
    how it is expressed, and the basic data with which it deals. At the lowest level,
    it consists of various identifiers, or names, interspersed with literals, punctuation,
    and whitespace, e.g. blanks and tabs.


    C programs are written using the full set (see [7.1]) of 94 printable ASCII characters.
    Contiguous strings of printable characters are lumped into tokens according to
    various lexical rules. All nonprinting characters, including newline, are whitespace,
    which is used to separate adjacent tokens that might otherwise be lumped together.
    There are also comments, arbitrary strings of characters that begin with /* and
    end with */, which behave much like whitespace. Although the language imposes
    few constraints on the use of whitespace or comments, it is imperative that both
    be employed judiciously and uniformly to make source code as readable as possible.


    Identifiers are arbitrary-length strings of letters, digits, and the underscore
    character _, beginning with a letter or the underscore character. The C program
    shown on the previous page contains the identifiers main, int, c, getchar, while,
    and putchar. Names that are used by the loader (see [7.0]) all must differ in
    the first five or so characters (depending on the particular loader) to be distinguishable;
    internally used names must differ in the first eight characters. Some loaders
    refuse to distinguish between uppercase and lowercase letters. Identifiers generally
    are created by the user to name data items and functions.


    Certain identifiers are predefined keywords, each having special meaning in the
    language; they may not be redefined. In the example above, int and while are keywords.
    A complete list of keywords may be found in [0.7]. Since lowercase and uppercase
    letters are distinct in full ASCII, INT is not a keyword, nor is Int. Installations
    that support uppercase-only devices must translate to lowercase on input to the
    compiler, and possibly back to uppercase on output.'
  merge: -1
  img_proc: true
