  md: '# 3.3 Pointer expressions


    There are no pointer constants, strictly speaking, so the primaries of type pointer
    are pointer variable names, pointer function calls, and parenthesized pointer
    expressions. The basic pointer expression is of the form


    ```

    &variable-name-expr

    ```


    examples of which are


    ```

    &k

    &c[2].f

    &(p -> name)

    ```


    the first two of which are constant pointer expressions if k and c are static
    or extern variables.


    The only other pointer-exprs are of the form


    ```

    pointer-expr [ + | - ] integer-expr

    ```


    which has a value given by the current address value of the pointer-expr plus
    or minus the integer-expr value scaled by the size of the type to which the pointer
    points. For example, if a is an array of int and if ints are of size 2, then &a[0]+2
    will be 4 more than the machine address at the beginning of array a. Hence, &a[0]+2
    ≡ &a[2], which is the motivation for such a definition of pointer arithmetic.


    The augmentation assignments ( ++ and -- ) can be applied to pointer variable
    names, in which case the above meaning of plus and minus are in effect. For example,


    ```

    p = &a[0]; ++p;  /* p points at a[1] */

    p += 2; --p;     /* now at a[2] */

    ```


    If an integer is assigned to a pointer variable, however, no scaling is performed.
    This is a hole left intentionally in the language type-checking to facilitate
    systems programming. Pointer expressions figure in other types of expressions
    because of the "dereferencing" operator * which, as a prefix to a pointer-expr,
    delivers the name of the variable pointed at by the value of the pointer-expr.'
