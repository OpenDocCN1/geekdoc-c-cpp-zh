  md: 'Keywords of C and other literal tokens are in boldface while phrase names are
    italicized with imbedded hyphens. Any phrase name of the form anything-list is
    an abbreviation for a comma-separated sequence of one or more phrases of the anything
    variety. The formal meaning could be given by the following schema:


    ```

    anything-list = anything [, anything]opt % this is a comment

    ```


    As shown above, syntax comments may be inserted into the formal syntax rules after
    a percent sign and before the next new-line.


    Occasionally, one of the alternatives in an optional choice will have the subscript
    def to indicate that, if the phrase is missing, the interpretation will be just
    as if that choice had been explicitly given. Such implicit choices are known as
    defaults. A typical example in C is


    ```

    /auto_def | static | extern | register/opt

    ```


    The following rules specify the lexical format of the tokens of C programs:


    ```

    identifier =

    [ letter | _ ] [ letter | _ | digit ]opt


    keyword =

    /auto | break | case | char | continue

    | default | do | double | else | extern

    | float | for | goto | if | int | long

    | register | return | short | sizeof | static

    | struct | switch | typedef | union

    | unsigned | while /


    comment =

    /* character-sequence-not-containing-asterisk-slash */


    integer-constant =

    [ decimal-constant | octal-constant

    | hexadecimal-constant | character-constant ]

    ```'
