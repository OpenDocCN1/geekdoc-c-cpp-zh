    and so are equivalent to getc and putc with defaults for the file descriptors.


    # 6.2 Floating functions


    The function sqrt has virtual declaration:


    ```

    double sqrt(double x);

    ```


    and delivers a suitably precise approximation to the square root of a nonnegative
    floating value x. The result is undefined for negative x.


    # 6.3 Pointers


    To provide for dynamic storage allocation needed to implement linked data structures,
    the functions calloc and cfree are supplied with virtual declarations:


    ```

    char *calloc(int number, size_in_bytes);

    cfree(char *p);

    ```


    The function calloc returns a pointer value that refers to an untyped object in
    the memory, of size (number * size_in_bytes), which can be manipulated by the
    program owning the pointer value until the object is freed by a call to cfree
    with the same pointer value as argument. It is expected that calloc and cfree
    will be used to obtain and free rather large hunks of object-space, which will
    be chopped up and storage-managed by a user program.'
