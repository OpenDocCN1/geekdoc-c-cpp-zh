- pgno: 49
  md: 'The syntax of a function definition is


    ```

    function-definition ::= { extern | static }opt

    type-specifier opt declarator ( argument-list opt )

    argument-declaration-list opt

    compound-statement

    ```


    The simplest form of compound statement is a brace-enclosed sequence of statements
    (imperative commands). Here is a complete function definition:


    ```

    double length(x,y:)

    double x,y;

    {

    return sqrt(x * x + y * y);

    }

    ```


    The names x and y are formal arguments for the function length and they behave
    like special variables, which are initialized to different values each time the
    function is called. It, therefore, is not permissible to have explicit initializers
    in an argument specification. An appearance of length(0.0, p[2]) is equivalent
    to sqrt(0.0 * 0.0 + p[2] * p[2])


    Complex function declarators like (*fpa( ))[] can be avoided via type definitions
    as presented in [1.7], so their explanation will be postponed until Chapter 4.


    Before examining compound statement in detail, it is instructive to distinguish
    pointer arguments from other arguments. The only way that a function can alter
    the value of some variable x in the environment from which the function is called
    is to be passed the location &x of x, where the corresponding formal argument
    is of pointer type. Also, aggregate types (struct, union, or array) cannot be
    passed as arguments directly, but pointers to them may. The function shown on
    the following page is intended to replace index by the first subscript position
    where value x is equal to an element of array table:'
