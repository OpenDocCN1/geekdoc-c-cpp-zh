- pgno: 53
  md: "The repetition statements of C are given by\n\n```\nrepetition-statement =\n\
    | while ( logical-expr ) statement\n| do statement while ( logical-expr );\n|\
    \ for ( expr_opt ; logical-expr ; expr_opt ) statement\n|\n```\n\nA while statement\
    \ repeatedly performs its substatement until the logical-expr is no longer “true,”\
    \ never embarking on an execution of the substatement if logical-expr is “false.”\
    \ It may be a repetition of multiplicity 0 if logical-expr is initially “false.”\n\
    \nThe do statement is similar except that the test is performed and the repetition\
    \ potentially terminated after each performance of the substatement. It therefore\
    \ performs its substatement at least once.\n\nThe for statement is a shorthand\
    \ for\n\n```\nexpr1;\nwhile ( logical-expr )\n{ statement ; expr2 }\n```\n\nso\
    \ the first expression is usually an initialization; the second a logical pretest;\
    \ and the third some form of post-augmentation. Examples are\n\n```\nwhile (c[i]\
    \ == ' ' && i < SIZE)\n    ++i;\ndo\n{\n    swap (c, i, j);\n    ++i;\n    --j;\n\
    }\nwhile (i < j);\n/* array c now reversed */\nfor (i = 0; i < SIZE; ++i)\n{\n\
    \    a[i] = b[i];\n    c[i] = -1.0;\n}\n/* array b copied to a and c set to -1.0\
    \ */\n```\n\nIf the logical-expr in a for statement is missing, a constant “true”\
    \ value (1) is assumed."
  merge: -1
  img_proc: true
- pgno: 54
  md: "It occasionally is convenient to interrupt the normal sequence of statements\
    \ by one of the following:\n\n```\ninterruption-statement =\n/break ;\n| continue\
    \ ;\n| return expr ;\n| goto identifier ;\n/\n```\n\nThe break statement causes\
    \ termination of the smallest enclosing repetition or switch statement.\n\nThe\
    \ continue statement causes termination of the repeatable substatement of the\
    \ smallest enclosing repetition statement. Execution resumes with the augmentation\
    \ part of a for or with the test part of a do or while.\n\nA return statement\
    \ terminates execution of the enclosing function. If an expr is specified, it\
    \ becomes the returned value of the function after conversion to the declared\
    \ type of the function; if there is no expression, the value returned by the function\
    \ is garbage. At the end of every function body, there is an implicit return with\
    \ no expression.\n\nA goto statement specifies that execution should resume at\
    \ the statement labeled by the identifier. Finally, a labeled statement has the\
    \ syntax\n\n```\nlabeled-statement =\n    identifier : statement\n```\n\nand serves\
    \ as a target for goto statements. Only one such definition of a given label may\
    \ occur within the same function. Since labeled statement is a legal form of statement,\
    \ it follows that any number of labels may occur in sequence. In practice, break\
    \ is needed rarely, continue never, and goto even less often than that. It follows\
    \ that labels need never be used if goto is avoided. It also is good style to\
    \ minimize the number of return statements; exactly one at the end of the function\
    \ is best of all for readability."
  merge: -1
  img_proc: true
