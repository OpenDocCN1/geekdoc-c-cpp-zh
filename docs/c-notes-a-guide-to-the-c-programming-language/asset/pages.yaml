- pgno: 23
  md: "Each C program must always contain a function named main, whose single performance\
    \ defines the execution of the program. Such a program has been described in [0.0].\n\
    \nJust as pointers always are declared as pointing to some known type, functions\
    \ are always declared as returning some type, even if no type is explicitly mentioned\
    \ (see [1.6]), no value is explicitly returned [2.6], or no returned value is\
    \ ever used [3.6]. Functions may only return scalar types, i.e., integers, floats,\
    \ or pointers.\n\nArguments to functions are passed by value, i.e., a fresh copy\
    \ of each argument is made for each invocation of the function, and the function\
    \ is at liberty to alter these private copies. As with returned values, only scalar\
    \ types may be passed as arguments (but see [3.4, 3.5, 3.6] for implicit coercion\
    \ of non-scalars to scalars).\n\nAlthough a valid C program can consist of the\
    \ main function alone, it is usual to delegate a number of the activities required\
    \ by main to other functions and to continue this process until the functions\
    \ are all of a manageable size. The communication between main and its subordinate\
    \ functions is accomplished normally by a list of arguments and possibly by a\
    \ result returned. In other cases, functions can communicate implicitly by common\
    \ access to globally known variables, although this leads to less readable programs.\n\
    \nThe following three functions, named main, newnum, and printd, illustrate the\
    \ major possibilities:\n\n```\n```c\nint c; /* globally known current input character\
    \ */\nmain() /* read, convert, and print number */\n{\n    int number;\n    c\
    \ = getchar();\n    number = 0;\n    while (isdigit(c))\n    {\n        number\
    \ = newnum(number);\n        c = getchar();\n    }\n    printd(number);\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
