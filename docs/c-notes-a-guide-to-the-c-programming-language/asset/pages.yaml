  md: 'Argument types of a function, the compiler will assume int or double for an
    actual argument of type integer or floating respectively. Better control is attained
    when the programmer declares all known information about the argument and return
    types of external functions.


    In particular, the 11/40 or LSI-11 floating point instructions can be used to
    maximum advantage only by declaring explicitly all floating quantities to be float.
    Otherwise, the compiler will call on run-time code to do many conversions to double
    in order to satisfy the default typing rules.


    Actual argument expressions are calculated in reverse order to that specified
    in the call so that the run-time stack looks like argₙ, argₙ₋₁, ..., arg₁, return-link
    just before transfer to the function.


    A typical use of the eight integer and four fully addressable double floating
    registers of the PDP-11 is as follows:


    # Integer Register


    | PDP-11 Value | Mnemonic | Meaning |

    |---|---|---|

    | 0 | R0 | Integer return values |

    | 1 | R1 | or volatile values |

    | 2 | R2 | Integer free registers |

    | 3 | R3 | commandeerable |

    | 4 | R4 | by user |

    | 5 | FP | Frame pointer for functions (R5) |

    | 6 | SP | Stack pointer |

    | 7 | PC | Program counter |


    # Floating Register


    | PDP-11 Value | Mnemonic | Meaning |

    |---|---|---|

    | 0 | FR0 | Floating return values |

    | 1 | FR1 | or volatile values |

    | 2 | FR2 | Floating free (!) |

    | 3 | FR3 | and commandeerable |


    In this register usage scheme, it would be the responsibility of each C function
    (whether compiler or user built!) to return to its caller with registers R2, R3,
    R4, FP, SP, FR2, and FR3 in the'
