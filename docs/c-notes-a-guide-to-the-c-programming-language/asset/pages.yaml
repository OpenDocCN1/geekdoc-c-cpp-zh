  md: 'The equality operators (equal == and not equal !=) as well as relational operators
    (less <, greater >, less or equal <=, greater or equal >=) yield 1 if the inequality
    is "true," and 0 otherwise. If one operand is narrower than the other, it is widened
    appropriately before the comparison.


    A cast expression of the form


    (int) arithmetic-expr


    gives the same integer value as would be obtained by assigning the arithmetic-expr
    to an int variable.


    # 3.2 Floating expressions


    The basic floating expressions are the floating primaries, which include floating
    constants, floating variable names, floating function calls, and parenthesized
    floating expressions, like


    3.14159E-5 xlk - l1 length(x, y) (2.0 * z + y)


    More complicated floating expressions are built from floating primaries and from
    other floating expressions by the unary operators + and - and by the familiar
    binary arithmetic operators +, -, *, and /. For example,


    3.14 * (xlk - l1 - length(x, y)) + z/1.1


    The augmentation operators ++ and -- call for adding 1.0 or -1.0 to the floating
    variable specified. As with integers, both prefix and postfix forms apply. The
    precision of a floating calculation will be at least as precise as the wider (more
    precise) of the two operands. Some implementations may use extra precision during
    the calculation.


    A cast expression of the form


    (float) arithmetic-expr


    widens the arithmetic-expr to float, if necessary.


    Integers may be intermixed freely with floating operands, and are widened as needed.'
