- pgno: 14
  md: 'The types can be classified as *fundamental* (integer and floating) versus
    *derived* (pointer, array, structure, union, function), or as *scalar* (fundamental
    plus pointer) versus *composite* (array, structure, union, function).


    A summary of the types will be given in [0.7].


    # 0.1 Integers


    *Integers* are the workhorses of a C program. They are used for counting, for
    selecting elements of an array, for representing characters of text, logical values,
    and bit sequences, and for any arithmetic where the magnitude range is known to
    be limited and fractional results are not needed. It is no surprise that integers
    are implemented in a wide variety of ways.


    The basic integer can be represented as a binary datum, although there is no presumption
    in the language about whether arithmetic is performed in one’s complement, two’s
    complement, signed magnitude, or some more exotic encoding. Integers in C always
    will be at least as big as are addresses on the target machine; they can be used
    unreservedly as subscripts or pointer modifiers.


    Short integers can be used, in the hope of achieving storage economy, for counting
    things in the thousands. There is no guarantee, however, that a short integer
    actually will be any shorter than a basic integer. Similarly, long integers are
    used for counting things in the hundreds of millions; they also may be no longer
    than basic integers.


    Unsigned integers are typically the same size as basic integers and behave much
    the same in arithmetic, except that their values are always taken as zero or positive.
    On two’s complement computers, this has the net effect of treating the sign bit
    as just another magnitude bit. Their primary use is not so much to double the
    range of counting with positive numbers as to permit arithmetic that is compatible
    with the treatment of addresses on machines where an address fills up an integer-sized
    word.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Finally, C provides a *character* type that is guaranteed to be large enough
    to hold any element of the machine''s character set. Characters behave like very
    small integers when used in arithmetic expressions, but there is no guarantee
    that negative numbers will survive conversion to character and back to integer,
    no matter how small they are. It can be safely assumed that the printing characters
    behave like small positive numbers.


    This discussion so far has been evasive about actual data sizes, and intentionally
    so. C does know about *bytes*, in the usual machine sense, and even about *bits*
    to a much lesser extent. The point is, considerable variation is permitted in
    implementation sizes, so that C can be made to perform efficiently on an Intel
    8080 or an IBM 370. All that is really promised has been summarized in the paragraphs
    above.


    Most modern computers have eight-bit *bytes*, support data types that are multiples
    of *bytes*, and perform integer arithmetic in two''s complement. On such machines,
    one can reliably expect characters to fit in one byte and integers in two to four.
    Thus, a character may hold numbers in the range −128 to +127, or perhaps 0 to
    255; two-byte integers are −32,768 to +32,767 signed, or 0 to 65,535 unsigned;
    and four-byte integers are −2,147,483,648 to +2,147,483,647 signed or 0 to 4,294,967,295
    unsigned. The size of addresses, in *bytes*, will give a good indication of whether
    basic integers are on the short or long side of that range. It is perfectly legal,
    of course, for *all* integers, to be four bytes long.


    A good program will be written with the fewest wired-in assumptions about the
    nature of the target machine, so as to maximize portability and to minimize mysterious
    constants. To aid in portability, C provides a mechanism for determining the size
    of any data type, expressed in *bytes*, so that the code can be properly parameterized.
    The sizeof operator is described in [3.1].


    Integer literals may be expressed several different ways. Each implies by its
    form and value some minimum length, in *bytes*, which may affect how it is used
    in expressions, although an implementation may use a longer version than is required.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Any literal beginning with a nonzero digit and consisting only of digits is
    taken as a *decimal* integer. Its length is the minimum implemented type large
    enough to let it be represented as a *positive* number of the correct value.


    A literal beginning with the digit zero, 0, and consisting only of digits is taken
    as an *octal* integer. The digit eight, 8, is taken as octal 10, and nine, 9,
    is taken as octal 11. The length of the literal is the minimum implemented type
    large enough to let it be represented as an *unsigned* number of the correct value.


    A literal beginning with the digit zero followed by x or X is taken as a *hexadecimal*
    integer. The characters a through f, or equally A through F, are taken as hexadecimal
    digits with values ten through fifteen, respectively. The length of the literal
    is the minimum type large enough to let it be represented as an *unsigned* number
    of the correct value.


    A literal beginning with a single quote, '', is taken as a *character* integer.
    All characters, including whitespace, up to the next single quote are taken as
    literal characters that define the value of the integer. A single character is
    the length of a character datum and has a value equal to the internal representation
    of that character on the target machine. Additional characters are concatenated
    in unspecified order, giving a length that is the appropriate multiple of a single
    character.


    Certain nonprinting or difficult-to-obtain characters may be represented by an
    *escape sequence*, such as \n for newline or \'' for single quote, since neither
    of these may otherwise occur within a string. Arbitrary codes may be specified
    with \nnn, where nnn is one to three octal digits. Note that all of these escape
    sequences reduce to single characters in the constant. A complete list of escape
    sequences for characters may be found in [0.7]. If it is necessary to continue
    a character literal on a subsequent line, the escape \ may be used right before
    a newline to nullify its effect.


    Despite all this freedom, it is wise to restrict character literals severely.
    Literals with more than one character are extremely machine-dependent, and literals
    with nonprinting characters are difficult to check. Escape sequences should be
    used to'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'make all codes visible, and line continuation should be avoided.


    And, while character literals are truly integers and can be used freely in integer
    expressions, it is best not to presume any specific numeric values or ranges,
    since both may vary from one machine to another. Character literals should be
    used primarily for output or for exact comparisons with character data.


    Any integer literal may have the modifier I or, far preferably, L appended to
    it. This forces the length to be that of a long integer, regardless of its numeric
    value. If any integer literal is too long to be properly represented even as a
    long integer, it is taken as long and is truncated on the left. What happens to
    the sign is machine-dependent.


    # 0.2 Floating numbers


    A floating number has two elements: an exponent and a fractional part. Its value
    is interpreted as the product of the fractional part and some predefined base
    raised to the exponent power. At least one coding of exponent and fractional part
    is used to represent the value zero. Floating numbers can be considered as approximations
    to the real number set over a range that is large compared to the range of integers.


    Floating point arithmetic can maintain a fixed amount of precision over this large
    range, at the expense of representing very large integers or continued fractions
    inexactly. Numbers too large to be represented properly as floating are said to
    overflow; numbers too small underflow, and are usually amplified by zero. Subtracting
    two numbers with nearly equal magnitudes can cause significance loss, so that
    only a coarse approximation to the desired result is obtained.


    Despite these drawbacks, floating arithmetic is so popular for numeric calculations
    that most modern computers support some version of it with hardware instructions.
    Whether results are rounded, truncated, or approximated more haphazardly varies
    wildly among machines. As a consequence, C has little to say about the detailed
    properties of floating arithmetic.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The language does, however, provide the data types *floating* and *double*.
    Despite the name, there is no guarantee that a double-precision floating number
    has a fractional part twice as long as a basic floating datum. It is often more
    than twice as long, but it also may be no longer than a float. Nor is there any
    guarantee that any particular length integer can be widened to float and then
    converted back to an integer having the same value, even though the double representation
    is presumed to retain the most information of all arithmetic types.


    On most machines, floating data are represented in four to eight bytes, a fixed
    part of which is used to represent the exponent. The implied base in binary computers
    is usually either two or sixteen; magnitudes typically range up to ten to the
    38th power, at least; and fractional parts retain from six to sixteen decimal
    digits of precision.


    Floating literals are tokens that begin with either a decimal number or a decimal
    point. They may contain a decimal point, a fractional part, and an exponent part,
    where the exponent part consists of the character e or E, an optional plus or
    minus sign, and a decimal power of ten by which the rest of the number is multiplied.
    Either the integer part or the fractional part may be omitted, but not both; either
    the decimal point or the exponent may be omitted, but not both. No whitespace
    may occur between any of the parts of a floating literal.


    There is no special notation for a double literal, but sufficient precision is
    retained to generate a double constant should the context call for one. A literal
    of sufficient specified precision always will be taken as double. Default typing
    of floating literals is discussed in [3.2].


    # 0.3 Pointers


    *Pointers* are data items that are used to locate other data items. In the simplest
    implementation, a pointer simply holds the machine address of the datum pointed
    to; but it could, in principle, hold a more elaborate construct, such as a word
    address plus a byte offset, or a reference count to facilitate validity'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'checking and garbage collection. A pointer must at least be big enough to hold
    the largest machine address usable in a program.


    What is important is that pointers are characterized by the sort of thing they
    point to; there is no such thing in C as a pointer to unspecified type. Pointers
    to different types of things may well have different formats; almost certainly
    there are different constraints on the values they may take on. For all pointers,
    however, there is defined a null value, distinguishable from the address of any
    object in C, which the pointer may take on when it points to no current instance
    of the appropriate type.


    It is permissible to have pointers to any type of object in C, including to other
    pointers, recursively ad nauseam. They arise naturally in many aspects of programming,
    but are most particularly useful in contexts in which the object itself should
    not or cannot be conveyed directly. It is much easier, for instance, to deliver
    to some function a copy of a pointer than to copy an entire array or data structure.
    And, it is not possible to represent some list structures unless pointers can
    be used to stand for sublists: Consider a circular list, for instance, in which
    each element is in its own sublist.


    It is also possible to abuse pointers, since they introduce a level of indirection
    that obscures readability, and since they provide a degree of programming freedom
    that is almost impossible to check thoroughly at compile-time or efficiently at
    run-time. C allows considerable latitude in the use of pointers, at the expense
    of even some checking that is easy to perform. Consequently, they should be used
    with particular care.


    There are no pointer literals, per se, in the language. It is promised, however,
    that all valid pointers have nonzero values, so that an integer zero can serve
    as a literal null. Moreover, integers can be used in a variety of contexts to
    initialize pointers, although this practice is extremely machine-dependent.


    # 0.4 Arrays


    Any object of known size in C also can occur in multiples, known as arrays. Like
    a pointer to something, an array is always of some other type, although that type
    also can be an array of still other types. There is no explicit limit to the dimensionality
    of'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'an array, just as there is no limit to the length of a chain of pointers. An
    array of arrays of pointers to arrays of integers is quite acceptable.


    An array also is characterized by its starting address and by the number of elements
    it contains, that is, its multiplicity. The former is determined by its storage
    class, and must have a value that is legal for pointers to objects of the same
    type as the elements of the array. In this sense, an array starting address can
    be considered a literal pointer.


    C has no provision for variable-length arrays, although a program is of course
    at liberty to use less than the full multiplicity of elements in an array. This
    means that in many contexts the number of elements must be determined before an
    array can be referred to, and that there is no information stored with an array
    other than the current values of all its elements. Some latitude is permitted
    in determining the multiplicity, so that the compiler often can be made to count
    up things itself instead of burdening the programmer. It is illegal for an array
    to have a multiplicity of zero.


    An array with undetermined multiplicity is not “an object of known size” and hence
    may not be composed into other arrays or used in one or two other contexts. It
    also is not permissible to form an array of functions, or of structures whose
    contents are not determined.


    There are one kind of literal array. A literal that begins with a double quote,
    ", is taken as a character string, or array of characters. All characters following
    the double quote, including whitespace, up to the next double quote are taken
    as character integers that define succeeding elements of an array of characters.
    A null character, \0, is appended to every string, so that a character string
    always has a multiplicity of at least one, as in "", which is the null string.


    The same escape sequences defined for character integers in [0..1] and [0..7]
    are usable inside strings. In particular, \" is a literal double quote, \\ is
    a literal backslash, and \ newline continues the string on the next line. The
    style rules pertaining to character integers also should be applied.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 0.5 Structures and unions


    Often, data items of differing types want to be grouped together because the items
    are strongly related. Input-output records are a typical example of aggregates,
    as are complex numbers. The former are an array of characters, but that disguises
    the relationship among characters of a particular subfield. Similarly, the latter
    can be considered a two-element array of floats, if one ignores the asymmetry
    in processing the two fields. It is far more general, however, to provide for
    aggregates of arbitrary types; this is the purpose of data structures in C.


    Any objects of known size can be collected into a structure, including pointers,
    arrays, or other structures. A structure is defined by the order and types of
    its elements; two structures match only if their corresponding elements have the
    same types collected in the same order. No information regarding the composition
    of a structure is stored with it, just the values of each of its elements.


    There can be regions of program text in which a given structure can be referred
    to before its contents are defined. In this region, the structure is not an object
    of known size, and hence cannot be composed into arrays or other structures.


    It is tempting to think that the size of a structure is the sum of the size of
    each of its elements, but this is naive. Many modern computers have some restrictions
    on the placement of certain data types in storage. A four-byte floating datum
    may, for instance, be required to have a machine address that is exactly divisible
    by four. Thus, each data type is characterized not only by its size in bytes but
    also by the severity of its storage boundary restrictions.


    The obvious consideration inside a structure is that an element might not be placeable
    immediately after the previous element — holes may occur, the size and location
    of which are machine-dependent. It is equally clear that a structure itself must
    be aligned on a storage boundary at least as restrictive as that needed for its
    most restricted element. Thus, if a four-byte float were to follow a character,
    for instance, it is conceivable'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 0. SYNTAX 13


    that a three-byte hole would have to be introduced. If floats were required to
    begin on even addresses, as in the PDP-11, then a one-byte hole would occur.


    A more subtle requirement is that a structure must end on a boundary at least
    as restricted as that on which it begins. This is to ensure that an array of structures
    will meet all boundary requirements for elements after the first. So a structure
    may even have a hole on the end, as it were.


    There are no structure literals.


    A close relative of the data structure is the union of types. Unions occur frequently
    in programs where more than one type of data must be placed in the same storage
    location. Often the overlap takes advantage of known similarities in sizes of
    the different types to be used, and possibly in how they are moved about; this
    is extremely machine-dependent. Like using an array to represent a structure,
    it can be misleading as well.


    Any objects of known size can be collected into a union, whose size is then large
    enough to hold the largest of its elements or whose boundary restriction is as
    severe as the severest of its elements. Like a structure, a union also may be
    padded so that it ends on the same boundary as that on which it must begin. Unlike
    a structure, only one of the choice of elements may reside inside a union at any
    given moment. No information regarding the composition of a union, or the type
    of its current contents, is stored with it — just the value of one of its elements.


    Thus, unions are used primarily to inform the implementation of a practice that
    is very likely to be machine-dependent, so that the compiler can meet the minimum
    requirements of whatever target machine is chosen.


    There are no union literals.


    # 0.6 Functions


    Functions are the executable entities of C. They may represent compound actions
    to be performed, or call for the calculation of mathematical functions of one
    or more arguments.'
