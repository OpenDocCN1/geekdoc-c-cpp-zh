  md: 'They are used to avoid repeating most of an expression in an if else when only
    part depends on some condition. For example,


    x = (y < 3.0) ? -1.0 : 1.0 ;


    assigns to x the value -1.0 if y is less than 3.0; otherwise, the value 1.0 is
    assigned. The rules of the language stipulate that one or the other but not both
    exprs are evaluated. The result is always the wider of the types of the two exprs
    so that the integer 1 above is widened to 1.0 before assignment to x.


    ```

    assignment-expr = |

    | variable-name-expr binop = expr

    | ++ | -- | scalar-variable-expr ++ | -- |

    % scalar means arithmetic or pointer


    binop = + | - | * | / | % | & | | | '' | < < | >> |

    ```


    Assignments like x += y replace x by the value of x + y, but x is not calculated
    twice. To double x, l, j, one simply can write


    x l, j *= 2


    Assignments like ++x, --x are equivalent respectively to (x += 1), (x -= 1). All
    assignment-exprs return a value that is the value of the variable before or after
    the assignment takes place. Of the three forms of assignment-expr, only the postfix
    augmentation operators (++ , --) deliver the value before assignment.


    ```

    k = 0; /* k is 0 */

    n = k++; /* n is 0, k is 1 */

    m = (k * 2); /* m and k are 2 */

    k = --n; /* k and n are 1 */

    k += (n++) - n /* ouch! no promises */

    ```


    It should be kept in mind that the language does not specify an order of evaluation
    of the two operands of an assignment, so that


    i = 2; alil = x + (i == 3) /* alil is al2 or al3 ? */


    is not deterministic.'
