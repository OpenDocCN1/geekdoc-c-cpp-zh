- pgno: 30
  md: 'specify which objects are to be manipulated, while each object consists of
    a location (usually a computer address and size), a type, and a particular value
    of that type stored at the location.


    The reason for being so careful with the terminology is that when pointers and
    composite types are encountered later, there will emerge variables with more complicated
    name expressions, and the syntax and meaning of the well-known assignment will
    require careful consideration. There also is an operator in the language that
    delivers the location of a variable, thereby making the computer address a manipulatable
    value. A correct understanding of pointers also must be based on a clear understanding
    of variables.


    The external declarations announce certain names as having attributes desired
    by the programmer. For example,


    ```

    int i;

    long float x;

    ```


    gives the name i the attribute of variable-with-integer-type (the implementation
    takes care of the actual location), and x becomes a variable of type double-precision
    floating.


    In addition to types, a declaration can also specify a storage class attribute
    and an initializer. Initializers will be introduced in Chapter 2. The storage
    class, if present, must be written first:


    ```

    static int i;

    extern long float x;

    ```


    Storage classes are specified by the keywords extern, static, auto, and register;
    the typedef specifier behaves syntactically like a storage class, but does not
    associate a name with an object.


    Every externally declared name in a C program file has either the external or
    static attribute, denoted by the keywords extern and static, external being the
    default. An external name is visible in all program files, and this facility allows
    communication between separately compiled program files. A static name is visible
    throughout the remainder of the enclosing program file but not more widely. The
    use of separate program files and restricted use of the external attribute can
    provide modularity and protection not provided by some languages.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "Globally declared variables have a lifetime that endures for as long as the\
    \ main program executes regardless of their visibility attribute (external or\
    \ static).\n\nSections [1.1] through [1.5] deal with the various kinds of data-declarations,\
    \ so it is appropriate to introduce the formal syntax rules here:\n\n```\ndata-declaration\
    \ =\n  /extern_def/ | static /opt\n  type-specifier_opt initializable-declarator-list_opt\
    \ ;\n\ntype-specifier =\n  [ integer-type | floating-type\n  | type-name | structure-or-union-type\
    \ ]\n\ninitializable-declarator =\n  declarator initializer_opt\n```\n\nFunction-declarations\
    \ will be covered in [1.6], and type-definitions at the end of the chapter, in\
    \ [1.7].\n\n# 1.1 Integer declarations\n\nAn external integer declaration is a\
    \ data declaration with a type specifier of the flavor integer type:\n\n```\n\
    integer-type =\n  { char | unsigned | short | long }_opt int_def\n```\n\nand declarators\
    \ that are identifiers. The declaration\n\n```\nint number, smallest, largest;\n\
    ```\n\nmakes number, smallest, and largest the names of three integer variables,\
    \ which are externally visible by default. Any subsequent reference to one of\
    \ these names will deliver its current value or cause replacement of its current\
    \ value by a new value, depending on the context in which the name occurs.\n\n\
    These integer variables can participate as operands of integer operators, as described\
    \ in [3.1]. The various flavors of integer type were explained in [0.1].\n\nIf\
    \ any of the adjectives short, unsigned, or long is present, int is assumed and\
    \ may be omitted. In any context calling for an optional type specifier, the default\
    \ type is taken as int. It is good practice, however, to explicitly type all declarations."
  merge: -1
  img_proc: true
- pgno: 32
  md: '# # 1.2 Floating declarations


    An external floating declaration is a data declaration with a type specifier of
    the flavor floating type:


    +   floating-type = / short | double | long | float /


    and declarations which are identifiers. For example,


    ```

    ```

    static long float x;

    float y;

    ```

    ```


    makes x the name of a floating variable of long precision, visible only in the
    enclosing program file, and y an externally visible single-precision floating
    variable. They may participate in expressions much as integers do, but with slightly
    different meaning attached to the operators. The operators relevant to floating
    variables are described in [3.2].


    # # 1.3 Pointer declarations


    An external pointer declaration is a data declaration with any flavor of type
    specifier and a declaration of the form


    ```

    *declarator

    ```


    For example,


    ```

    ```

    int *ptr_to_int;

    struct item **ptr_to_item;

    ```

    ```


    declares ptr_to_int as the name of a variable of type pointer to integer and ptr_to_item
    as a variable of type pointer to a struct item. The structured type struct item
    is a composite type whose definition presumably occurs elsewhere, but note that
    the content of the structure need not be known to declare a pointer to it.


    Recalling the earlier definition of variable, the unique aspect of a pointer variable
    is that its class of admissible values ranges over the locations (machine addresses)
    of other values of the type to which the pointer variable is specified to point.


    The use of these variables will be described subsequently in several chapters.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.4 Array declarations


    An external *array declaration* is a data declaration with any type specifier
    and a declaration of the form


    `identifier [ constant-expr_opt ]`


    The *constant-expr* must be a positive integer constant, calculable at compile-time,
    and defines the multiplicity N of the array. The valid subscripts range from 0
    to N−1. For example,


    `float point_3d[3];`


    declares *point_3d* as an array variable consisting of three subvariables *point_3d[0]*,
    *point_3d[1]*, and *point_3d[2]* each of type *float*. The expressions *point_3d[2]*,
    *point_3d[1]*, and *point_3d[1]-2]* are *variable-name-exprs*, each of which refers
    to one of the three floating variables making up the composite floating array
    variable *point_3d*.


    The *constant-expr* specifying array size may be omitted when an initializer is
    present and the size is implied by the number of values supplied. Initializers
    for arrays are discussed in [2.4]. It also is permissible to omit the size when
    declaring the existence of an array that is defined elsewhere, perhaps in another
    program file. It is possible to declare variables that are arrays of arrays, and
    so on, as in


    `char page[50][80];`


    which makes *page* the name of an array variable composed of 50 like variables
    of size 80 characters. Then *page[0][0]* and *page[49][79]* denote the northwest
    and southeast corners, respectively. When a declaration contains array of array,
    and so forth, only the first size specification may be omitted, for otherwise
    the contained arrays would not be objects of known size.


    The character strings described in [0.4] are literal arrays of characters and
    behave like *char* array names, except when used as initializers of named *char*
    arrays. For example, the string "C-compiler" really acts like the secret declaration
    `"string1` where `"string1` has been predeclared by


    `static char "string1"[] = "C-compiler";`'
