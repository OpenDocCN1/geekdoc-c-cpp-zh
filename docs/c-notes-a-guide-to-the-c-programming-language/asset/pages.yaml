    \ /* print n as decimal */\n    int n;\n    {\n    int quot, rem;\n    quot =\
    \ n / 10;\n    rem = n % 10;\n    if (quot != 0)\n        printd(quot);    /*\
    \ recursive call */\n    putchar(rem + '0');\n    }\n```\n```\n\nIn the example,\
