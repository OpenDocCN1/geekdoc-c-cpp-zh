  md: "There are no literal function values, although the formal arguments and the\
    \ function body are tantamount to that. These topics are discussed in greater\
    \ detail in [2.6], which deals with function initializers.\n\n# 0.7 Syntax summary\n\
    \nA properly formed C program consists of a sequence of tokens grouped into phrases\
    \ in a very precise way. The rules prescribing the set of properly formed C programs\
    \ are known as the syntax. Each rule defines the meaning of a particular phrase\
    \ name by specifying all possible ways of building such a phrase from primitive\
    \ tokens and other phrases. The first rule defines the phrase “C program” as a\
    \ sequence of one or more program files and is written:\n\n```\nC-program = {\
    \ program-file }\n```\n\nThe braces imply one or more occurrences.\n\nAnother\
    \ rule defines a type definition as the keyword typedef, followed by a type specifier\
    \ followed by a declarator list, followed by the token ; .\n\nThis rule is written:\n\
    \n```\ntype-definition =\n    typedef type-specifier declarator-list ;\n```\n\n\
    The phrase type specifier is defined by\n\n```\ntype-specifier =\n    [ integer-type\
    \ | floating-type\n    | type-name | structure-or-union-type ]\n```\n\nwhich means\
    \ a choice of one of the four alternatives. A subscript opt indicates optional\
    \ occurrence so that\n\n```\nfloating-type =\n    [ short_opt double | long_opt\
    \ float ]\n```\n\nmeans the keyword double, possibly preceded by short, or else\
    \ float, possibly preceded by long. Occasionally, parentheses are used to group\
    \ a sequence of phrases that is optional as in\n\n```\n( else statement )_opt\n\
    ```"
  merge: -1
  img_proc: true
