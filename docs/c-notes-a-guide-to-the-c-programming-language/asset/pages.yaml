- pgno: 96
  md: 'Plain and short integers are 16-bit or two-byte two''s complement binary integers
    (refer to PDP-11 hardware manual), and long int is a 32-bit or four-byte two''s
    complement binary integer. Unsigned integers are 16-bit simple unsigned positive
    binary integers module 2^16. The following table gives the ranges of values for
    the integer types:


    | Type | Min | Max |

    |---|---|---|

    | char | -128 ... | +127 |

    | int (short) | -32,768 ... | +32,767 |

    | unsigned int | 0 ... | +65,535 |

    | long int | -2,147,483,648 ... | +2,147,483,647 |


    The integer arithmetic operators are those expected on a two''s complement machine
    and the bitwise operators are standard except that >> fills the emptied bits on
    the left with the original left bit, which is the sign.


    The rules for widening preserve the true integer value except that widening an
    int to an unsigned int causes no conversion of the binary representation and,
    hence, the negative ints will become effectively positive ints in the range 32,768
    ... 65,535 (e.g., -1 becomes 65,535).


    Whenever a wider integer value is assigned to an integer variable or argument
    that is narrower, the prefix is truncated; this rule preserves the integer value
    when the value is actually in the valid range for the narrower variable or argument,
    except for narrowing from unsigned int to int that is opposite to widening as
    described above.


    Narrowing conversions from float or double to integer will preserve the sign and
    the whole part (truncating the fraction) if the integer target has adequate range.
    Note that float is considered to be wider than long even though it preserves fewer
    bits to the left of the radix. This normally should cause trouble only in 11/40
    or LSI-11 floating points.


    No overflow or underflow checking takes place in integer arithmetic; bits are
    set but no hardware interrupts are generated and no compiled code tests these
    exception bits.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'All non-character values occupy at least two bytes and, so, begin on a word
    (two-byte) boundary. This simply means the address of the first byte of the variable
    is an even integer location. The chars may begin at any byte address.


    # 7.2 Binary floating point numbers


    Values of type float or short double require 32-bits or four-bytes subdivided
    into a one-bit sign, an unsigned eight-bit exponent, and an unsigned 23-bit fraction
    with a suppressed leading one-bit. The exponent is encoded in excess 128-notation,
    which means that 128 corresponds to a base 2 power of 0, 129 to 1, 127 to -1,
    and so on. This gives a range of exponents from 10^-38 to 10^+38 approximately
    and somewhat over six decimal digits of precision. Values of type double or long
    float have an unsigned 55-bit fraction with approximately 16 decimal digits of
    precision and the same form and range of exponent.


    Arithmetic on floating values is the standard normalized floating point arithmetic
    supported by PDP-11 hardware. Runtime routines are careful to preserve this form;
    for example, if the mantissa is zero, the entire number is set to zero.


    Widening from float to double preserves values, as does int or char to float or
    double. Widening from long int to float may lose significant numerical information
    if the value of the long int exceeds 24 bits. The conversion from long int to
    double always preserves the correct value.


    Narrowing from double to float loses the least significant digits of fractional
    precision. Depending on the instruction set option, rounding may or may not occur.
    As in the case of integer arithmetic, no overflow or underflow checking is performed.
    Floating values require a two-byte boundary.


    It is assumed that, on entry to any C function, the arithmetic mode of the FPP
    is double (versus float) and int (versus long). These mode settings are preserved
    on exit from a C function. On 11/40s and LSI-11s with the floating option, float
    arithmetic is performed by the hardware instructions (see [7.6]). Any arithmetic
    options that are about are supported by in-line calls to run-time routines.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 7.3 Pointer values


    Valid byte addresses on the PDP-11 may range from one to 65,535 or 0x1 to 0xFFFF
    hexadecimal; zero has been reserved as the null pointer value. Hence, unsigned
    int is similar to the representation for pointers or location values.


    Since all addresses are to byte-level, there is no checking of assignments between
    pointer types. This can cause trouble if a pointer to char is used as a pointer
    to int, since a bus error may result. The following assignments or implied assignments
    (actual to formal arguments) are allowed without any conversion of binary representation:


    +   - T₁*pointer → T₂*pointer

    +   - pointer → int

    +   - int → pointer


    The construction int*expr → part-name also is allowed. Such deviations from normal
    type restrictions should be used judiciously. Pointer values are aligned on two-byte
    boundaries.


    # 7.4 Arrays


    Arrays are not assignable (as a unit) and may not appear as arguments or returned
    value of a function or with the register attribute.


    Initialized array variables may have more than one unspecified range of valid
    subscripts if the first initializer row size gives the size required. For example,


    ```

    int k[1] = {[2,3], [4], [5,6]};

    ```


    is tantamount to


    ```

    int k[3][3] = {{1,2,3}, {4,0}, {5,6}};

    ```


    There is no promise that this will be portable, or always so for PDP-11s.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Arrays have the same boundary requirement as the element type from which the
    array is constructed. The sizeof an array is the sizeof its element type multiplied
    by the number of elements. For example,


    ```

    double dbl[3][2];

    ```


    has 48 bytes = (3 * 2 * 8).


    String constants may be no longer than 127 characters.


    # 7.5 Structures and unions


    Like arrays, structures and unions are not assignable as units, may not appear
    as arguments or returned value of functions, and may not have the register attribute.


    The mapping of structure parts into relative locations is done from left to right
    through the parts list with each part aligned as closely next to the end of the
    previous one as possible. This means there may be an occasional one-byte hole
    (i.e., an unused byte-location). For example, the declaration


    ```

    struct {char ch; int k; char str[3];}

    ```


    has the following layout:


    | ch | hole | k | str | hole |


    an initial boundary alignment of two-bytes and a sizeof = 8.


    The structure inherits the alignment of its most restricted part (here it is k),
    and sizeof is made to conform to the alignment so that structures of the same
    type will pack back-to-back with no holes — hence, the extra hole at the end of
    the above structure.


    A union inherits the alignment of its most restrictive alternative part and a
    size equal to the maximum size among its parts adjusted so that unions pack back-to-back
    also.


    # 7.6 Functions and run-time environment


    Functions may not have arrays, structures, unions, or other functions as arguments
    or returned value, but pointers to same are allowed. In the absence of declarative
    information about ar-'
