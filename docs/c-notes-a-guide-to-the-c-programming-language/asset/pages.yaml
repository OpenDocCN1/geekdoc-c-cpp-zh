- pgno: 11
  md: "that is, a program written in C that reads programs written in C and writes\
    \ out assembly language statements to implement the intent of the source code.\
    \ The assembler translates these statements into an object module, a collection\
    \ of instructions to a loader, which actually constructs the executable program.\
    \ The loader may combine the object module with other separately compiled and/or\
    \ assembled modules, and it may draw upon a library of run-time support routines\
    \ to complete the program. Many of the high-handed limitations imposed by C compilers\
    \ are simply a reflection of the inadequacies common to most assemblers and/or\
    \ loaders.\n\nA C program is a set of one or more text files — each of which can\
    \ be, say, a paper tape or a deck of cards or an on-line file prepared with a\
    \ text editor. It consists of lines of arbitrary length, each of which is terminated\
    \ by a special character code called newline (ASCII linefeed). The run-time environment\
    \ translates standard text files into this internal format for the compiler, if\
    \ need be, so that the concept of line can be implemented in a uniform fashion\
    \ across different operating systems and machines. A card image, for example,\
    \ might become an 81-character line, counting the terminating newline.\n\nHere\
    \ is a not-unreasonable C program:\n\n```\n/* copy input to output\n*/\nmain()\n\
    {\n    int c;\n    c = getchar();\n    while (c != -1)\n    {\n        putchar(c);\n\
    \        c = getchar();\n    }\n}\n```\n\nThis declares main to be a function,\
    \ called with no arguments, whose body is the text inside braces. The body declares\
    \ c to be an integer variable known only to the function, and contains several\
    \ executable statements which call on other functions getchar and putchar repeatedly\
    \ until c is given the value -1. It"
