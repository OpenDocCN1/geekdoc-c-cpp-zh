  md: "# 4: LOCAL DECLARATIONS\n\n> If anyone anything lacks\n> He'll find it all\
    \ ready in stacks.\n> \n> — W.S. Gilbert, The Sorcerer\n\n# 4.0 Introduction\n\
    \nEach compound statement in a C program may begin with a sequence of local declarations\
    \ or type definitions that serve to introduce names of objects or types whose\
    \ declared properties are not known or relevant outside the enclosing compound\
    \ statement. The local type definitions have the same syntax as the external ones,\
    \ whereas the local declarations have the syntax\n\n```\nlocal-declaration =\n\
    \  / auto_opt/ static | extern | register /\n  type-specifier_opt initializable-declarator-list_opt\
    \ ;\n```\n\nwhich is similar to the analogous external name declaration, except\
    \ that there are four possible attributes controlling the visibility, lifetime,\
    \ and storage class of variables. The automatic attribute, which is the default,\
    \ indicates that a variable is only visible within the compound statement most\
    \ immediately enclosing its declaration and that on each separate execution of\
    \ the compound statement, previous values of the variable will have been forgotten.\
    \ The register attribute has the same meaning as automatic and additionally has\
    \ a request to keep the variable in high-speed registers normally available on\
    \ general-purpose computers. Any initialization of automatic or register variables\
    \ is performed at each normal entry to the compound statement. Transfer of control\
    \ (via goto or switch) into the middle of a compound statement bypasses this initialization."
