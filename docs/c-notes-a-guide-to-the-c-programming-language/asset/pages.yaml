- pgno: 29
  md: "# 1: EXTERNAL DECLARATIONS\n\n> \"When I use a word,\" Humpty Dumpty said,\
    \ in rather a scornful tone, \"it means just what I choose it to mean — neither\
    \ more nor less.\"\n> \n> — Lewis Carroll, Through the Looking-glass\n\n\n\nA\
    \ C program consists of a sequence of one or more separately compiled files. A\
    \ program file is a sequence of function declarations, type definitions, and data\
    \ declarations. This is specified more formally by the rules:\n\n```\nC program\
    \ = { program-file }\n\nprogram-file = { | function-declaration | type-definition\
    \ | data-declaration }\n```\n\nIt is important to recognize that a C program is\
    \ nothing but declarations at the outermost or external level, and that all expressions\
    \ in the language serve merely as initializers for some item being declared.\n\
    \nThe further description of the syntax and meaning of these forms of external,\
    \ or global, declaration is the task of this chapter. In simplest terms, a declaration\
    \ introduces some variable and associates various attributes with it.\n\nA program\
    \ dealing with constants is usually not of great usefulness; so the concept of\
    \ variable has taken on great significance for most programming languages, and\
    \ C is no exception.\n\nA simple variable is a pair consisting of a name and an\
    \ object; the name is an identifier required by the programmer to"
