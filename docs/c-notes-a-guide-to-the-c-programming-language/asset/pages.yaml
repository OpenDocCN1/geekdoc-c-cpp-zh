- pgno: 44
  md: "# ### 2.1 Integer initializers\n\nAn *integer initializer* has one of the simple\
    \ forms\n\n```\n    =opt { expr }\n```\n\nwhere *expr* is of type integer or character\
    \ and is constant for a static or external initializer. For example,\n\n```\n\
    \    static int number = 2 + 3, k = 'A'\n```\n\ncauses **number** to have the\
    \ initial value 5 and *k* the initial value of the result of lengthening the character\
    \ constant 'A' to integer type (see [3.1]).\n\nIf the value of the expression\
    \ is too large to be properly represented, it is truncated on the left — with\
    \ no warning. It generally is not permissible to use floating literals as integer\
    \ initializers.\n\n# ### 2.2 Floating initializers\n\nA *floating initializer*\
    \ has one of the forms\n\n```\n    =opt { expr }\n```\n\nwhere *expr* is of type\
    \ floating or else can be widened to floating. An initializer for a static or\
    \ external declaration must evaluate to a constant, just as for integers; but\
    \ the compiler will perform only integer arithmetic, so 2 × 3.142 is not allowed.\
    \ The only operator permitted with floating literal initializers is unary minus.\n\
    \nExamples of valid floating initializers are\n\n```\n    float x = 0.23E-5, y\
    \ = 2 * 3, z = '0';\n```\n\nNote that *z* will be initialized to the floating\
    \ representation of the integer that is the internal character code (machine-dependent)\
    \ of character zero. If excessive precision is specified in a floating literal,\
    \ or if the value cannot be properly represented in the target machine, the compiler\
    \ will not, in general, complain."
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 2.3 Pointer initializers


    A pointer initializer has one of the forms


    = { expr }


    where expr is an expression of type pointer and is calculable at compile-time
    in the case of a static or external declaration. In general, this means that the
    expression must reduce to an integer or to the address of a previously declared
    variable, plus or minus an integer. Some examples are


    ```

    COMPLEX vector[4];

    float *fptr = &vector[2].imag;

    ```


    The expression &vector[2].imag is an expression of type pointer to floating because
    vector[2].imag is a name-expr denoting the imag part of the third element of array
    vector and the & operator delivers the location of the named variable. Since 2
    is a constant and imag is located at a fixed offset within vector[2], the pointer
    value is known at compile-time. The following pointer expressions are also allowed:


    ```

    int k[5];

    int *iptr = &k[1] + 2, *jptr = &k[4] - 1;

    ```


    The expressions &k[1] and &k[4] are of type pointer to int, and ptr ± is allowed
    as a pointer expression (see [3.3]) so these initializers are constant pointers
    to integer.


    Whenever unsubscripted array names, function names, string constants, structure
    names, union names, or function names without parameters appear, they are interpreted
    as pointers. Hence the following also valid initializers:


    ```

    int (*p)() = distance;

    char *pch = "what?";

    float vector[10], *fptr = vector;

    ```


    It is permissible to initialize a pointer to point at an undeclared identifier,
    but the practice is not recommended. Similarly, pointers may be initialized to
    integer values, but this practice is'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'extremely machine-dependent for all values but zero and should be reserved
    for writing system code.


    # 2.4 Array initializers


    An array initializer has the form


    ```

    = expr | { initializer-list , opt }

    ```


    where expr initializes only the first element, or where each initializer in initializer-list
    is a proper initializer for an element of the array. For example,


    ```

    float x[4] = {0.0, 1.0, 3E-6, -1};

    ```


    is correct because 0.0 is a floating constant and x[0] is a floating variable
    in array x, etc. When elements of the array are themselves arrays, the initializers
    must be bracketed initializer-lists, as in the following:


    ```

    char page[3][5] = { "xxxx", {''y'', '':'', '':'', ''y'', ''\0''} }

    ```


    Here the string "xxxx" is shorthand for the initializer-list {''x'', ''x'', ''x'',
    ''x'', ''\0''}. The first row of page (i.e., page[0]) is initialized to "xxxx",
    the second row to "y..y" and the third row is initialized to zero (i.e., a row
    of ''\0'') by default since the outer initializer-list ends early. Note that a
    row size of 5 is needed for strings of size 4, to include the terminating ''\0''.


    The initializer


    ```

    int matrix[3][3] = {{1}, {2,3}, {4}};

    ```


    initializes matrix[0][0] to 1 as specified and the remainder of row 0 to 0 by
    default; matrix[1][0] is set to 2, matrix[1][1] to 3, and matrix[1][2] to 0; finally,
    matrix[2][0] is set to 4 and the rest of the row to 0.


    Inside braces may be omitted, provided that all initializers are present and provided
    that all array sizes have been specified. The following initializer, although
    not recommended, has the same effect as the one above:


    ```

    int matrix[3][3] = {1, 0, 0, 2, 3, 0, 4, 0, 0};

    ```'
