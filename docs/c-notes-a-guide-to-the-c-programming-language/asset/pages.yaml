  md: 'variable. The static locals follow the same rules as for external declarations
    [2.3]; externs may not be initialized.


    Note that there are many opportunities to assign the address of an automatic variable
    to a pointer in such a way that the pointer outlives the thing to which it points.
    There is no check for this situation, and only sporadic hardware protection against
    subsequent use of invalid pointers. Caveat emptor.


    # 4.4 Local arrays


    Array variables may be locally declared with any of the storage classes auto,
    static, or extern. The register requests will not be honored. Nor can an auto
    array be initialized in the local declaration; an explicit loop or series of assignments
    must be coded. The size of a local array must be known at compile-time.


    The static arrays are initialized following the same rules as in those presented
    [2.4].


    # 4.5 Local structures and unions


    Structure or union variables may be locally declared with any of the storage classes
    auto, static, or extern. The register requests will not be honored. Nor can an
    auto structure or union be initialized in the local declaration; explicit assignments
    must be coded.


    The static structures and unions are initialized following the same rules as in
    [2.5].


    # 4.6 Local function declarations


    Functions may be locally declared with no storage class or with the storage class
    extern or static; any other declaration is illegal. The absence of a storage class
    is taken as extern, not auto as for all other local declarations. If a function
    is not declared, it is taken as a function returning integer. If any of its arguments
    is not declared, the corresponding actual parameter follows the default coercion
    rules given in [3.6].'
