    # 0.5 Structures and unions


    Often, data items of differing types want to be grouped together because the items
    are strongly related. Input-output records are a typical example of aggregates,
    as are complex numbers. The former are an array of characters, but that disguises
    the relationship among characters of a particular subfield. Similarly, the latter
    can be considered a two-element array of floats, if one ignores the asymmetry
    in processing the two fields. It is far more general, however, to provide for
    aggregates of arbitrary types; this is the purpose of data structures in C.


    Any objects of known size can be collected into a structure, including pointers,
    arrays, or other structures. A structure is defined by the order and types of
    its elements; two structures match only if their corresponding elements have the
    same types collected in the same order. No information regarding the composition
    of a structure is stored with it, just the values of each of its elements.


    There can be regions of program text in which a given structure can be referred
    to before its contents are defined. In this region, the structure is not an object
    of known size, and hence cannot be composed into arrays or other structures.


    It is tempting to think that the size of a structure is the sum of the size of
    each of its elements, but this is naive. Many modern computers have some restrictions
    on the placement of certain data types in storage. A four-byte floating datum
    may, for instance, be required to have a machine address that is exactly divisible
    by four. Thus, each data type is characterized not only by its size in bytes but
    also by the severity of its storage boundary restrictions.


    The obvious consideration inside a structure is that an element might not be placeable
    immediately after the previous element — holes may occur, the size and location
    of which are machine-dependent. It is equally clear that a structure itself must
    be aligned on a storage boundary at least as restrictive as that needed for its
    most restricted element. Thus, if a four-byte float were to follow a character,
    for instance, it is conceivable'
  - '[PAGE 22]


    # 0. SYNTAX 13


    that a three-byte hole would have to be introduced. If floats were required to
    begin on even addresses, as in the PDP-11, then a one-byte hole would occur.


    A more subtle requirement is that a structure must end on a boundary at least
    as restricted as that on which it begins. This is to ensure that an array of structures
    will meet all boundary requirements for elements after the first. So a structure
    may even have a hole on the end, as it were.


    There are no structure literals.


    A close relative of the data structure is the union of types. Unions occur frequently
    in programs where more than one type of data must be placed in the same storage
    location. Often the overlap takes advantage of known similarities in sizes of
    the different types to be used, and possibly in how they are moved about; this
    is extremely machine-dependent. Like using an array to represent a structure,
    it can be misleading as well.


    Any objects of known size can be collected into a union, whose size is then large
    enough to hold the largest of its elements or whose boundary restriction is as
    severe as the severest of its elements. Like a structure, a union also may be
    padded so that it ends on the same boundary as that on which it must begin. Unlike
    a structure, only one of the choice of elements may reside inside a union at any
    given moment. No information regarding the composition of a union, or the type
    of its current contents, is stored with it — just the value of one of its elements.


    Thus, unions are used primarily to inform the implementation of a practice that
    is very likely to be machine-dependent, so that the compiler can meet the minimum
    requirements of whatever target machine is chosen.


    There are no union literals.


    # 0.6 Functions


    Functions are the executable entities of C. They may represent compound actions
    to be performed, or call for the calculation of mathematical functions of one
    or more arguments.'
