- raw:
  - '[PAGE 16]


    Any literal beginning with a nonzero digit and consisting only of digits is taken
    as a *decimal* integer. Its length is the minimum implemented type large enough
    to let it be represented as a *positive* number of the correct value.


    A literal beginning with the digit zero, 0, and consisting only of digits is taken
    as an *octal* integer. The digit eight, 8, is taken as octal 10, and nine, 9,
    is taken as octal 11. The length of the literal is the minimum implemented type
    large enough to let it be represented as an *unsigned* number of the correct value.


    A literal beginning with the digit zero followed by x or X is taken as a *hexadecimal*
    integer. The characters a through f, or equally A through F, are taken as hexadecimal
    digits with values ten through fifteen, respectively. The length of the literal
    is the minimum type large enough to let it be represented as an *unsigned* number
    of the correct value.


    A literal beginning with a single quote, '', is taken as a *character* integer.
    All characters, including whitespace, up to the next single quote are taken as
    literal characters that define the value of the integer. A single character is
    the length of a character datum and has a value equal to the internal representation
    of that character on the target machine. Additional characters are concatenated
    in unspecified order, giving a length that is the appropriate multiple of a single
    character.


    Certain nonprinting or difficult-to-obtain characters may be represented by an
    *escape sequence*, such as \n for newline or \'' for single quote, since neither
    of these may otherwise occur within a string. Arbitrary codes may be specified
    with \nnn, where nnn is one to three octal digits. Note that all of these escape
    sequences reduce to single characters in the constant. A complete list of escape
    sequences for characters may be found in [0.7]. If it is necessary to continue
    a character literal on a subsequent line, the escape \ may be used right before
    a newline to nullify its effect.


    Despite all this freedom, it is wise to restrict character literals severely.
    Literals with more than one character are extremely machine-dependent, and literals
    with nonprinting characters are difficult to check. Escape sequences should be
    used to'
  - '[PAGE 17]


    make all codes visible, and line continuation should be avoided.


    And, while character literals are truly integers and can be used freely in integer
    expressions, it is best not to presume any specific numeric values or ranges,
    since both may vary from one machine to another. Character literals should be
    used primarily for output or for exact comparisons with character data.


    Any integer literal may have the modifier I or, far preferably, L appended to
    it. This forces the length to be that of a long integer, regardless of its numeric
    value. If any integer literal is too long to be properly represented even as a
    long integer, it is taken as long and is truncated on the left. What happens to
    the sign is machine-dependent.


    # 0.2 Floating numbers


