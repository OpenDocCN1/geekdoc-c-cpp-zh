    \ 由一个名为 x 的两个浮点值数组和一个名为 next 的指向 struct point 的指针组成。变量 first_point 由两个子变量组成，分别表示为\
    \ first_point.x 和 first_point.next。变量名表达式 first_point.x 命名一个数组变量，因此 first_point.x[1]\
    \ 命名结构化变量 first_point 的 x 部分内的一个 float 变量。关于 variable-name-exprs 的完整说明必须等待第 3\
    \ 章。\n\nThe above declaration could have been written in the form\n\n上述声明也可以写成以下形式\n\
    \n```\nstruct point {float x[2]; struct point *next;} ;\nstruct point first_point,\
    \ last_point;\n```\n\nThe first line serves to define the content of the new type\
    \ struct point but does not declare any names as variables of this type. The second\
    \ line declares two variables of the new type. The structure tag point serves\
    \ as an abbreviation for the content described, as well as allowing self-referential\
    \ pointers within a structure. The parts-specification is only optional if the\
    \ structure tag already has been defined by a parts-specification in an earlier\
    \ declaration. The structure tag is optional only if a parts-specification is\
    \ present.\n\n第一行用于定义新类型 struct point 的内容，但不声明该类型的任何变量名称。第二行声明了两种新类型的变量。结构标签 point\
    \ 作为所描述内容的缩写，同时允许结构内部的自引用指针。parts-specification 只有在结构标签已由早期声明中的 parts-specification\
    \ 定义时才是可选的。结构标签只有在存在 parts-specification 时才是可选的。\n\nWhen the keyword union is\
    \ used instead of struct, the parts are made to overlay each other so that variables\
    \ of such a union type at any point in time are holding a value corresponding\
    \ to just one of the parts. For example,\n\n当使用 keyword union 代替 struct 时，各部分被重叠放置，使得此类联合类型变量在任何时刻都只保存对应于其中一个部分的值。例如，\n\
    \n```\nunion { double d; float f[2]; } u;\n```\n\ndeclares u to be a variable\
    \ whose value is at any instant either double or an array of two floats. Sometimes,\
    \ it is meaningful to say u.d and sometimes u.f[1].\n\n声明 u 为一个变量，其值在任何瞬间要么是 double\
    \ 要么是两个 float 的数组。有时说 u.d 有意义，有时说 u.f[1] 有意义。\n\nIt is necessary to define some\
    \ predicate, independent of the union, to determine its current contents. Unions\
    \ can be safely used as part of a structure, one of whose parts is a small variable\
    \ (char or short int), identifying which variant is actually present. Each value\
    \ of the union type then is associated with a datum that tells which part names\
    \ are appropriate to use. An example is\n\n有必要定义一个与联合无关的谓词，以确定其当前内容。联合可以安全地用作结构的一部分，其中一个部分是小型变量（char\
    \ 或 short int），用于标识实际存在的变体。然后联合类型的每个值都与一个数据相关联，该数据指示应使用哪些部分名称。示例为\n\n```\nstruct\
    \ {\n  char vtag;\n  union {\n    double d;\n    float f[2];\n    char str[4];\n\
    \  }\n  var;\n}\nu,v;\n```\n\nNow the program can test if u.vtag is 1, say, before\
    \ allowing any references to u.var.d, and similarly check u.vtag against 3 before\
    \ using u.var.str. Note, however, that the language does not require such a tag\
    \ variable to be associated with a union; any form of predicate is acceptable.\n\
    \n现在程序可以在允许任何对 u.var.d 的引用之前测试 u.vtag 是否为 1，例如，并在使用 u.var.str 之前类似地检查 u.vtag 是否为\
    \ 3。然而请注意，语言并不要求此类标签变量与联合相关联；任何形式的谓词都是可接受的。\n"
