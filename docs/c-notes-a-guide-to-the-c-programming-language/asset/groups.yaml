    \ arrays of arrays, and so on, as in\n\n指定数组大小的 *constant-expr* 在存在初始化器且大小由提供的数值数量隐含时可以省略。数组的初始化器在\
    \ [2.4] 中讨论。当声明在其他地方定义的数组的存在时，例如在另一个程序文件中，省略大小也是允许的。可以声明数组的数组等变量，如\n\n`char page[50][80];`\n\
