    ## 7.3 指针值


    PDP-11 上的有效字节地址范围可以是 1 到 65,535，或十六进制的 0x1 到 0xFFFF；零被保留为空指针值。因此，unsigned int
    类似于指针或位置值的表示。


    由于所有地址都是字节级的，因此不检查指针类型之间的赋值。如果将一个指向 char 的指针用作指向 int 的指针，这可能引起问题，因为可能导致总线错误。以下赋值或隐含赋值（实参到形参）允许在不转换二进制表示的情况下进行：


    - T₁*指针 → T₂*指针

    - 指针 → int

    - int → 指针


    构造 int*expr → 部件名也是允许的。此类偏离正常类型限制的做法应当审慎使用。指针值按两字节边界对齐。


    ## 7.4 数组


    数组不能（作为一个单元）赋值，也不能作为函数的实参或返回值出现，或带有 register 属性。


    如果第一个初始化行的大小给出了所需大小，已初始化的数组变量可以有不止一个未指定的有效下标范围。例如，


    ```

    int k[1] = {[2,3], [4], [5,6]};

    ```


    等同于


    ```

    int k[3][3] = {{1,2,3}, {4,0}, {5,6}};

    ```


    不保证这具有可移植性，也不保证对 PDP-11 总是如此。


    数组具有与其构造所用元素类型相同的边界要求。数组的 sizeof 是其元素类型的 sizeof 乘以元素个数。例如，


    ```

    double dbl[3][2];

    ```


    有 48 字节 = (3 * 2 * 8)。


    字符串常量长度不得超过 127 个字符。


    ## 7.5 结构和联合


    与数组一样，结构和联合不能作为单元赋值，不能作为函数的实参或返回值出现，也不能具有 register 属性。


    结构部件到相对位置的映射是通过部件列表从左到右完成的，每个部件尽可能紧密地紧邻前一个部件的末尾对齐。这意味着偶尔可能有一个单字节空洞（即未使用的字节位置）。例如，声明


    ```

    struct {char ch; int k; char str[3];}

    ```


    具有以下布局：


    | ch | 空洞 | k | str | 空洞 |


    初始边界对齐为两字节，sizeof = 8。


    结构继承其限制最严的部件的对齐方式（这里是 k），并且 sizeof 会调整为符合该对齐方式，以便同类型的结构能够无空洞地背靠背排列——因此上述结构末尾有额外的空洞。


    联合继承其限制最严的备选部件的对齐方式，其大小等于各部件中的最大大小，并经过调整，以便联合也能背靠背排列。


    ## 7.6 函数和运行时环境


    函数不能将数组、结构、联合或其他函数作为实参或返回值，但允许指向这些对象的指针。在缺少关于函数实参类型的声明信息时，编译器会分别将整数类型或浮点类型的实参假定为
    int 或 double。当程序员声明外部函数的实参和返回类型的所有已知信息时，可以获得更好的控制。


    特别是，只有通过显式声明所有浮点量为 float，才能最大限度地利用 11/40 或 LSI-11 浮点指令。否则，编译器将调用运行时代码进行许多到 double
    的转换，以满足默认类型规则。


    实际实参表达式按与调用中指定顺序相反的顺序计算，使得在转移到函数之前，运行时栈看起来像 argₙ、argₙ₋₁、...、arg₁、返回链接。


    PDP-11 的八个整数寄存器和四个完全可寻址的双浮点寄存器的典型用法如下：


    ### 整数寄存器


    | PDP-11 值 | 助记符 | 含义 |

    |---|---|---|

    | 0 | R0 | 整型返回值 |

    | 1 | R1 | 或易失值 |

    | 2 | R2 | 整型空闲寄存器 |

    | 3 | R3 | 可征用 |

    | 4 | R4 | 由用户使用 |

    | 5 | FP | 函数的帧指针（R5） |

    | 6 | SP | 栈指针 |

    | 7 | PC | 程序计数器 |


    ### 浮点寄存器


    | PDP-11 值 | 助记符 | 含义 |

    |---|---|---|

    | 0 | FR0 | 浮点返回值 |

    | 1 | FR1 | 或易失值 |

    | 2 | FR2 | 浮点空闲（!） |

    | 3 | FR3 | 以及可征用 |


    在这种寄存器使用方案中，每个 C 函数（无论是编译器构建的还是用户构建的！）都有责任在返回其调用者时，使寄存器 R2、R3、R4、FP、SP、FR2 和 FR3
    保持与进入函数时相同的状态。此外，FPP 的模式位必须如 [7.0] 所述为 double 和 int。根据类型，返回值预期如下：


    | 类型 | 寄存器 |

    |---|---|

    | char、int、short int、unsigned int、指针 | R0 |

    | long int | R0/R1 |

    | floating、double | FR0 |


    在没有 FPP 的机器中，float 可以在 R0/R1 中返回，double 结果可以在全局声明的累加器 c.fe 中返回。c.fe 的行为将与 FR0
    完全一样；也就是说，在函数调用中它被假定为易失的，并且必须与其他寄存器一起保存，以使代码可重入。还会有一个类似于 FR1 的 c.fe，但可能没有任何可分配且对应于
    FR2 和 FR3 的 c.fe。


    不假定任何 C 函数返回时条件码有意义。


    在大多数实现中，编译器会细致地维护一个栈帧链，使得在任何时候


    - 1) FP 是当前帧指针

    - 2) 2(FP) 是最近一次调用的返回地址

    - 3) 0(FP) 是前一帧指针


    对此的例外是为 11/40、LSI-11 浮点选项编译的任何函数。在这种情况下，一种可能的实现如下：


    - 1) FP 是当前帧指针

    - 2) 6(FP) 是最近一次调用的返回地址

    - 3) 4(FP) 是前一帧指针

    - 4) 0(FP) 是一个浮点累加器

    - 5) -4(FP) 是另一个浮点累加器


    ## 总结


    任何编程语言都是各种装置的集合——字面量、名称、运算符、表达式、声明、数组和结构构造器、函数、顺序控制特性等。但这是一种极其有限的观点。作为构造良好程序的工具，语言应当支持、甚至鼓励现在与良好软件工程实践相关联的各种方法。最重要的是模块化、结构化控制以及数据的系统化组织。


    真正的模块化意味着大型程序的各个部分相对独立，并且依赖关系被精确记录。每个部分内部的某些细节（程序逻辑或数据表示）因此对其他部分隐藏。这种封装细节的做法应用于程序逻辑已有一段时间（即子程序），而较近又应用于数据表示（即数据抽象模块）。C
    的函数及其形参和局部声明的数据支持程序逻辑的封装；单独编译的程序文件以最少使用外部属性来支持数据表示的封装。


    结构化控制意味着一种以顺序、选择和重复为主的程序逻辑规范。为了正确支持这种规范，语言需要一种通用设施，将一组语句组合成一个单元。C 的复合语句提供分组，而
    if 和 switch 语句进行选择；重复的系统化控制由 while、do 和 for 语句完成。偶尔需要提前终止重复时，由 break 来满足。


    数据的系统化组织包括同类元素的多个副本、由不同类元素构成的复合体、在任何时候可能是若干选择之一的项目，以及创建

