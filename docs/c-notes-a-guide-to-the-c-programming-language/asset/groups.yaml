    \ 等具有 k == 1、k == 2、k == 5 等形式，其中 == 是 C 中的相等比较运算符。switch 语句可处理此类情况，例如\n\n```c\n\
    switch(k - 2)\n{\ncase 3: j = k*k; break;\ncase 5: case 2: ++k; do_something(k);\
    \ break;\ndefault: error(\"bad k\");\n}\n```\n\n由于 case 前缀只允许常量表达式，switch 语句可以非常高效地实现。break\
    \ 语句对于在每个可选择部分之后终止 switch 语句是必要的；否则，控制会以最不令人满意的方式从一个 case 流向下一个 case。case 标签可能出现在复合语句中嵌入。只有嵌入的\
    \ switch 语句限制了这种有问题的功能。\n\nC 的重复语句由以下给出\n\n```c\nrepetition-statement =\n| while\
    \ ( logical-expr ) statement\n| do statement while ( logical-expr );\n| for (\
    \ expr_opt ; logical-expr ; expr_opt ) statement\n```\n\nwhile 语句重复执行其子语句，直到 logical-expr\
    \ 不再为“真”，如果 logical-expr 为“假”，则永远不会开始执行子语句。如果 logical-expr 最初为“假”，它可能是一个重数为 0\
    \ 的重复。\n\ndo 语句类似，只是测试是在每次执行子语句之后进行，并且重复可能在此时终止。因此它至少执行一次其子语句。\n\nfor 语句是以下内容的简写\n\
    \n```c\nexpr1;\nwhile ( logical-expr )\n{ statement ; expr2 }\n```\n\n因此第一个表达式通常是初始化；第二个是逻辑预测试；第三个是某种形式的后增量。示例是\n\
    \n```c\nwhile (c[i] == ' ' && i < SIZE)\n    ++i;\ndo\n{\n    swap (c, i, j);\n\
