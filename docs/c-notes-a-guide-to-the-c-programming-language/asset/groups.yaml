    \nFor example,\n\n例如，\n\n```\nint *ptr_to_int;\nstruct item **ptr_to_item;\n```\n\
    \ndeclares ptr_to_int as the name of a variable of type pointer to integer and\
    \ ptr_to_item as a variable of type pointer to a struct item. The structured type\
