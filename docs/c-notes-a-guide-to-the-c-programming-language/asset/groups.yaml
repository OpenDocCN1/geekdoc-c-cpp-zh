    \ | static | extern | register]_opt type-specifier_opt initializable-declarator-list_opt\
    \ ;\n```\n\n其中存储类和类型说明符必须各自至少出现一个。只有标量项可以被初始化。未初始化的项包含垃圾值。\n\n## 5：参数\n\n> *仅仅是为了提供佐证性的细节，意在给原本平淡无奇、缺乏说服力的叙述增添艺术上的逼真感。*\n\
    >\n> — W.S. 吉尔伯特，*《日本天皇》*\n\n### 5.0 预处理器\n\n在编译之前，C 程序会被送入预处理器；预处理器在文本中作为控制行提供的显式指令影响下进行文本替换。每个控制行都以\
    \ # 开头，位于源代码文本某一行的第 1 列。\n\n最简单的控制行形式是如下形式的简单定义\n\n```\n#define identifier {token}\n\
    ```\n\n或\n\n```\n#include file-name\n```\n\n例如，\n\n```\n#define SIZE_LIMIT 10\n\
    ```\n\n会使随后出现的标识符 SIZE_LIMIT 被替换为常量 10，而 `#include my_macros` 本身也会被替换，依此类推。例如，如果文件\
    \ `lib1` 包含以下行\n\n```\n#include defs\n#include mylib\n```\n\n而文件 `defs` 为\n\n\
    ```\n#define NMAX    10\n#define NEXTCH  getchar( )\n#define NMAX2   2*NMAX\n\
    ```\n\n文件 `mylib` 为\n\n```\nchar chai[NMAX], matrix[NMAX][NMAX2];\nfor (i = 0\
    \ ; i < NMAX ; ++i)\n    chai[i] = NEXTCH;\n```\n\n那么以下行\n\n```\n#include lib1\n\
    ```\n\n最终将被替换为\n\n```\nchar chai[10], matrix[10][2 * 10];\nfor (i = 0 ; i < 10\
    \ ; ++i)\n    chai[i] = getchar( );\n```\n\n现在可以通过将文件 `defs` 中的前两行改为以下内容来重新定义\
    \ `NMAX` 和 `NEXTCH`\n\n```\n#define NMAX    5\n#define NEXTCH  upper_case(getchar(\
    \ ))\n```\n\n于是，无需改动 `mylib`，这种修改会在重新编译时通过 `mylib` 的文本传播。如果函数 `upper_case` 原先不存在于任何被包含的库中，那么必须以某种方式将其包含进来，但\
    \ `mylib`（它可能相当大）不必直接修改。\n\n即使存在 `#include` 语句，编译器诊断信息仍以原始源代码行号为准。事实上，某个被包含文件特有的所有诊断信息都会使用该\
    \ `#include` 语句所在的行号。\n\n### 5.1 整数参数\n\n在 C 程序中，通常的约定是使用大写字母命名*参数*，使用全小写字母命名变量。良好的做法是对源代码中除偶尔出现的\
    \ 0 或 1 之外的所有数字都用 `#define` 定义。应当指出，许多 0 和 1 实际上是神秘值“否”和“是”，因此应相应地标注。\n\n每个程序文件都必须\
    \ `#include` 一个标准参数文件，以便即使在中等规模的项目中也能实现充分的源代码控制。\n\n### 5.2 浮点参数\n\n像 e 和 π 这样的值非常适合用于\
    \ `#define` 语句，以下这些也是如此：float 和 double 值得保留的位数；可安全求倒数的最大数；以及加到 1.0 上能使其变大的最小数。虽然在编写真正可移植的浮点运算时有许多需要注意的地方，但这些参数朝着这个目标大有帮助。\n\
    \n### 5.3 指针参数\n\n表达式 `&a[MAX-1]` 虽然冗长但很有用。通常值得按如下方式进行参数化：\n\n```\n#define MAX\
    \ 100\n#define MAXP &a[MAX-1]\nint a[MAX], *p;\nfor (p = a; p <= MAXP; ++p)\n\
    \    < do p-th element >\n```\n\n用作指针的机器地址，例如在依赖机器的设备驱动程序中，也能受益于恰当的助记符：\n\n```\n\
    #define CONSOLE 0177560\nif (CONSOLE->status == DONE)\n    resume();\n```\n\n\
    ### 5.4 数组参数\n\n所有数组大小都应使用 `#define` 进行参数化，哪怕只是为了给所选定的上限赋予助记含义。\n\n```\n#define\
    \ MAXLINE 256\nchar line[MAXLINE];\n    for (i = 0; i < MAXLINE; ++i)\n      \
    \  putchar(line[i]);\n```\n\n或者，可以巧妙地利用 sizeof 运算符，如下所示\n\n```\n#define MAX  (sizeof\
    \ a / sizeof a[0])\nchar a[10];\n    for (i = 0; i < MAX; ++i)\n        a[i] =\
    \ '\\0';\n```\n\n注意 `#define` 中使用了圆括号，这样 `MAX` 就可以像表达式中的任何其他项一样使用。除以 `sizeof a[0]`\
    \ 是从字节数转换为元素个数所必需的。（参见 [3.1]。）\n\n### 5.5 结构体和联合体参数\n\n在多个程序文件中使用的复杂结构体声明，最好保存在一个参数文件中，并按需通过\
    \ `#include` 引入。事实上，联合体几乎专门被用作一种以与机器无关的方式参数化多用途结构体的手段。（参见 [0.5.1]。）\n\nsizeof\
    \ 运算符可用于以高度可移植的方式读写结构体和联合体：\n\n```\nwrite (BINOUT, structure_a, sizeof structure_a);\n\
    ```\n\n### 5.6 条件编译和参数\n\n控制行也可用于条件编译：\n\n```\n#ifdef PDP\n    n++;\n#else\n \
    \   n--;\n#endif\n```\n\n当前有效的定义可以通过如下形式的控制行取消\n\n```\n#undef identifier\n```\n\
    \n此后，该标识符将不会被替换，直到该标识符随后再次出现定义。经过这样的取消定义后，就 `#ifdef` 或 `#ifndef` 控制行而言，该标识符被视为未定义。例如，\n\
    \n```\n#define N 2\nint a[N];\n#undef N\n{float N; ... N = 1.3; ...}\n#define\
    \ N 4\nint k = 2 * N;\n```\n\n最终会变成\n\n```\nint a[2];\n{float N; ... N = 1.3;\
    \ ...}\nint k = 2 * 4;\n```\n\n请注意，定义会层叠，因此一个参数可以在一个短区间内被 `#define`，然后被 `#undef`，而不会影响该参数在这个区间之前或之后的使用。\n\
    \n`#define` 还可以指定在展开定义时使用的参数。因此，\n\n```\n#define swap(x,y) {int t; t = x; x =\
    \ y; y = t}\n```\n\n在每次调用时，其行为就如同\n\n```\nswap (a,b)\n```\n\n被写成\n\n```\n#define\
    \ x a\n#define y b\n{int t; t = x; x = y; y = t;}\n#undef x\n#undef y\n```\n\n\
    注意，在定义中，分隔参数列表的左圆括号必须紧邻被定义的标识符，否则该列表将被视为无参数定义的一部分。\n\n"
