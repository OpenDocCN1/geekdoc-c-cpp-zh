    \n回顾变量的早期定义，指针变量的独特之处在于其可接受值类涵盖了指针变量指定指向的类型值的其他值的存储位置（机器地址）。\n\nThe use of these\
    \ variables will be described subsequently in several chapters.\n\n这些变量的使用将在后续几章中描述。\n\
    \n## 1.4 Array declarations\n\n## 1.4 数组声明\n\nAn external *array declaration*\
