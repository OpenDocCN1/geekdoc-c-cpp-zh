    plementation to rearrange expressions with like commutative operators:


    ```

    a + b + c is (a + c) + b or (a + b) + c. etc.

    ```


    The arithmetic types (integer and floating) fall into a natural hierarchy from
    char to double, which is called the widening hierarchy:


    ```

    char → short → int → unsigned → long → float → double

    ```


    which determines the type of value returned by many of the operators when the
    two operands have different arithmetic type. For example, in


    ```

    (i + ''0'') - x  /* i is int, x float */

    ```


    the char value ''0'' is widened to integer which then can be added to i; then
    this integer result is widened to floating so that the floating x can be subtracted
    to produce a final floating result. The language also has cast operators, which
    explicitly request such widenings, so the above is equivalent to


    ```

    (float)(i + (int)''0'') - x

    ```


    The normal rule for binary arithmetic operators calls for widening the narrower
    operand to the wider one. The language reserves the right to perform arithmetic
    by widening operands more than necessary just to satisfy this rule. Thus, char
    and short operands are frequently widened to int, while float arithmetic often
    is performed in double. The distinction usually is not highly visible to the programmer.


    When the type of a variable-name-expr is wider than the type of the expression
    assigned to it, the normal widening will occur; when it is narrower, the conversion
    is machine-dependent and prone to information-loss, so that narrowing assignments
    should be used sparingly.


    C programs may contain conditional-exprs whose syntax is


    ```

    conditional-expr =

    logical-expr ? expr : expr

    ```'
  - '[PAGE 59]


    They are used to avoid repeating most of an expression in an if else when only
    part depends on some condition. For example,


    x = (y < 3.0) ? -1.0 : 1.0 ;


    assigns to x the value -1.0 if y is less than 3.0; otherwise, the value 1.0 is
    assigned. The rules of the language stipulate that one or the other but not both
    exprs are evaluated. The result is always the wider of the types of the two exprs
    so that the integer 1 above is widened to 1.0 before assignment to x.


    ```

    assignment-expr = |

    | variable-name-expr binop = expr

    | ++ | -- | scalar-variable-expr ++ | -- |

    % scalar means arithmetic or pointer


    binop = + | - | * | / | % | & | | | '' | < < | >> |

    ```


    Assignments like x += y replace x by the value of x + y, but x is not calculated
    twice. To double x, l, j, one simply can write


    x l, j *= 2


    Assignments like ++x, --x are equivalent respectively to (x += 1), (x -= 1). All
    assignment-exprs return a value that is the value of the variable before or after
    the assignment takes place. Of the three forms of assignment-expr, only the postfix
    augmentation operators (++ , --) deliver the value before assignment.


    ```

    k = 0; /* k is 0 */

    n = k++; /* n is 0, k is 1 */

    m = (k * 2); /* m and k are 2 */

    k = --n; /* k and n are 1 */

    k += (n++) - n /* ouch! no promises */

    ```


    It should be kept in mind that the language does not specify an order of evaluation
    of the two operands of an assignment, so that


    i = 2; alil = x + (i == 3) /* alil is al2 or al3 ? */


    is not deterministic.'
