  mdcn: "\n\n在 C 语言中，指针较为重要的用途之一是使用指针增量赋值来高效地遍历数组。下面的代码将在字符数组中查找第一个 x。\n\n```\np =\
    \ &str[0];\nwhile (*p != 'x')\n    ++p;\n/* now p points at first str[k] == x\
    \ */\n```\n\n### 3.4 涉及数组的表达式\n\nC 语言所允许的复杂变量名表达式（variable-name-expr）由以下部分构建而成：对指针表达式（pointer-expr）应用解引用运算符\
    \ *（参见[3.3]）、对结构和结构指针应用部件选择运算符 . 和 ->（参见[3.5]），以及本节将要讨论的数组元素选择表达式。以下形式的表达式\n\n\
    ```\narray-variable-name-expr [ integer-expr-list ]\n```\n\n表示由 integer-expr-list\
    \ 的值所选择的元素变量。与数组声明的情况相同，a[5][j, x+3] 完全等价于 a[5][j][x+3]。每个值显然都应为非负数，并且小于数组中相应声明的最大元素数量。例如，\n\
    \n```\nint a[5], k;\nk = 3;\na[4] = a[k] + a[k+1];   /* okay */\na[k+2] = 9; \
    \            /* no good, a[4] is last */\n```\n\n一个具有多个维度的声明，例如\n\n```\nfloat\
    \ x[5][3][2][2];\n```\n\n将 x 声明为类型为“float 的数组的数组的数组”的变量，因此 x[3] 本身就是一个合法的数组变量名表达式（array-variable-name-expr），x[3][2]\
    \ 也是如此。最后，x[3][2][1][0] 是一个 float 变量名表达式（float-variable-name-expr），可以在计算中使用，也可以被赋予新值。\n\
    \n虽然通常不会引起程序员的兴趣，但下标表示法满足等价关系\n\n```\na[e] ≡ *((a) + (e))\n```\n\n其中不带下标的数组名 a\
    \ 被视为等价于 &a[0]，即指向 a 的第一个元素的指针，而 + 表示指针运算。\n\n当数组名和字符串作为未加下标的表达式出现、且不作为数组初始化器时，它们会被转换为指向第一个元素的指针表达式（pointer-expr）。例如，下面的函数调用\n\
    \n```\nprintf(\"Here is a string %s\", ch_array);\n```\n\n传递两个指针参数：第一个是指向字符 'H'\
    \ 的 char 指针；第二个是指向（假定为）char 数组 ch_array 的第一个元素的指针。\n\n### 3.5 结构和联合表达式\n\n以下形式的表达式\
    \ structure-or-union-variable-name . part-name 表示指定结构或联合变量中由 part-name 标识的子变量。类似地，以下形式的表达式\
    \ structure-or-union-pointer-expr -> part-name 表示由指针表达式当前值所指向的结构或联合中的部件变量。例如，\n\
    \n```\nstruct point {float x[2]; struct point *next;}\nfirst_point, last_point,\
    \ *top;\ntop = &first_point;\nfirst_point.x[0] = 3.2; /* same as top -> x[0] =\
    \ 3.2; */\nfirst_point.next = &last_point;\nfirst_point.next -> x[0] = -1.0;\n\
    last_point.next = 0; /* null pointer */\ntop -> x[1] = 3.9;\ntop = &first_point;\
    \ /* changes nothing */\n```\n\n使得指针 top 指向结构 first_point，然后将 first_point 的部件\
    \ x 的第 0 个元素改为 3.2，将 first_point 的 next 部件指向 last_point，将 first_point 的 next 部件所指向结构的部件\
    \ x 的第 0 个元素设为 -1.0，将 last_point 的 next 部件设为不指向任何地方，并将 top 所指向结构的部件 x 的第 1 个元素设为\
    \ 3.9。最后的赋值除了浪费时间外什么都没做，因为 top 已经指向 first_point。\n\n当表达式需要标量值的位置出现结构和联合引用时，它们不会像数组和函数引用那样被转换为指针。因此，对于结构或联合，你几乎只能选择它的某个部件或取其地址。下面的示例展示了如何安全地使用联合：\n\
    \n```\nstruct card_variant {char vtag; char rank, suit;};\nstruct joker_variant\
    \ {char vtag; int num;};\nunion {struct card_variant card;\nstruct joker_variant\
    \ joker;} deck[54];\n/* initialize the deck of 52 cards & 2 jokers */\nif (deck[k].card.vtag\
    \ == 'C')\n{if (deck[k].card.suit == 'H') ...etc.}\nelse if (deck[k].card.vtag\
    \ == 'J')\n{if (deck[k].joker.num < 3) ...etc.}\nelse\n{error (\"bad card\");}\n\
    ```\n\n### 3.6 函数调用\n\nC 语言的函数通过以下形式的函数调用进行调用：\n\n```\nfunction-name-expr ( expr-list\
    \ )_opt\n```\n\n其中 function-name-expr 的语法规则为\n\n```\nfunction-name-expr =\n{ function-name\n\
    | (* function-pointer-expr )\n}\n```\n\nfunction-name-expr 的复杂度范围从像 sqrt 这样的简单名称，到像\
    \ (*p->c[k-2].pfch) 这样复杂的表达式，后者表示由指针变量 p 所指向的结构中数组部件 c 里第 (k - 2) 个元素的指针部件 pfch\
    \ 所指向的函数。部件选择运算符 -> 和 . 具有最高的优先级（与 [] 和 () 一样），因此解引用运算符 * 是上述表达式中最后应用的。运算符优先级和结合性的完整说明请参见[3.7]。\n\
    \n允许 function-name-expr 是未声明的标识符，在这种情况下，它被视为返回整数类型的外部函数。没有返回语句的函数（称为“void”函数）绝不应在返回值会产生影响的表达式中使用；换句话说，它只能作为表达式语句出现，或作为序列表达式（sequence-expr）中除最后一个表达式以外的任意表达式，或作为\
    \ for 循环中除测试部分以外的任意部分。\n\n函数名表达式后面括号列表中的表达式称为函数调用的实际参数，它们在数量和类型上应与函数定义中指定的形式参数列表相对应。例如，如果\
    \ lookup 被声明（参见[2.6]）为具有以下参数规范的函数\n\n```\n(float *t, val; int *i;)\n```\n\n那么每次调用\
    \ lookup 的形式应为\n\n```\nlookup(e₁, e₂, e₃)\n```\n\n其中 eᵢ 分别是类型为指向浮点数的指针、浮点数和指向整数的指针的表达式。\n\
    \n在没有任何参数声明的情况下，例如对于未声明的 function-name-expr、声明为无参数的函数，或超出参数列表中已声明部分的参数，会应用某些默认的类型转换。char\
    \ 和 short 类型会加宽为 int，float 类型会加宽为 double。如果函数期望接收 char、short 或 float 类型，那么调用函数必须知道参数声明。只要调用方和被调用方都知道预期结果，就允许实现根据其认为合适的方式加宽参数。\n\
    \n作为实际参数，未加下标的数组变量名表达式（array-variable-name-expr）或字符串会被解释为指向数组第一个元素的指针值；同样，没有括号参数列表的函数名表达式（function-name-expr）也会被视为指向该命名函数的指针值。\n\
    \n在函数定义中，形式数组参数被解释为指向数组元素类型的指针；因此，所有数组参数本质上都是可变参数（即其元素可以被修改）：在函数定义内部，形如 a[k] =\
    \ e; 的赋值会改变作为实际参数 a 出现的数组中第 k 个元素的值。例如，\n\n```\nclear_array(float a1[]; int n;)\n\
    {\n\tint i;\n\tfor (i=0; i<n; ++i)\n\t\ta1[i] = 0.0;\n}\nfloat x[5][5];\nmain()\n\
    {\n\tclear_array(x[2], 5); /* clear 2nd row */\n}\n```\n\n将矩阵 x[5][5] 的表达式 x[2]\
    \ 清零为浮点零。表达式 x[2] 是一个合法的数组变量名表达式，包含 5 个 float 类型的元素，与形式参数 a1（类型为 float 数组）相匹配。在调用\
    \ clear_array(x[2], 5); 执行 clear_array 期间，clear_array 中的每个赋值 a1[i] = 0.0; 实际上都意味着\
    \ x[2][i] = 0.0;。\n\nC 语言中的所有函数都可以递归地调用自身，也可以调用其他最终会调用回它们的函数。作为递归的一个示例，以下函数返回前\
    \ n 个整数的和：\n\n```\nint sum (int n;)\n{\n\treturn (n <= 1 ? 1 : n + sum(n - 1));\n\
    }\n```\n\n### 3.7 表达式语法\n\n以下总结了 C 语言中表达式的语法：\n\n```\nexpr = | conditional-expr\
    \ | assignment-expr | sequence-expr | arithmetic-expr | pointer-expr | cast-expr\
    \ |\n```\n\n"
