    在大多数机器上，浮点数据以四到八个字节表示，其中固定部分用于表示指数。 二进制计算机中的隐含基数通常是二或十六； 量级通常至少达到十的 38 次方； 分数部分保留六到十六位十进制精度的数字。


    浮点字面量是以十进制数字或小数点开头的标记。 它们可能包含小数点、分数部分和指数部分，其中指数部分由字符 e 或 E、可选的加号或减号以及将剩余数字相乘的十进制十的幂组成。
    整数部分或分数部分可以省略，但不能同时省略； 小数点或指数可以省略，但不能同时省略。 浮点字面量的任何部分之间不得出现空白。


    双精度字面量没有特殊表示法，但会保留足够的精度以在上下文需要时生成双精度常量。 精度足够指定的字面量始终会被视为双精度。 浮点字面量的默认类型在 [3.2]
    中讨论。


    ## 0.3 指针


    *指针* 是用于定位其他数据项的数据项。 在最简单的实现中，指针仅保存指向的数据项的机器地址； 但原则上它可以保存更复杂的结构，例如字地址加上字节偏移，或引用计数以便于有效性检查和垃圾回收。
    指针至少必须足够大以容纳程序中可用的最大机器地址。


    重要的是，指针的特征在于它们指向的事物类型； C 中没有指向未指定类型的指针。 指向不同类型事物的指针可能具有不同的格式； 几乎肯定它们可能取值的约束不同。
    然而，对于所有指针，都定义了一个空值，可与 C 中任何对象的地址区分，指针在不指向适当类型的当前实例时可以取该值。


    在 C 中允许有指向任何类型对象的指针，包括指向其他指针，递归地无穷无尽。 它们在编程的许多方面自然出现，但在对象本身不应或不能直接传递的上下文中特别有用。
    例如，将指针的副本传递给某个函数比复制整个数组或数据结构要容易得多。 而且，除非指针可用于代表子列表，否则无法表示某些列表结构： 例如，考虑一个循环列表，其中每个元素都在其自己的子列表中。


    指针也可能被滥用，因为它们引入了一层间接性，使可读性变差，并且它们提供了在编译时彻底检查或在运行时高效检查几乎不可能的编程自由度。 C 在使用指针方面允许相当大的自由度，以牺牲甚至一些容易执行的检查为代价。
    因此，应特别谨慎地使用它们。


    语言本身没有指针字面量。 然而，有保证所有有效指针都有非零值，因此整数零可以作为字面空值。 此外，整数可以在多种上下文中用于初始化指针，尽管这种做法极度依赖机器。


