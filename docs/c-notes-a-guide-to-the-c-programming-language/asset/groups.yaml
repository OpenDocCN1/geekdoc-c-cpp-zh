  - '[PAGE 83]


    Currently active definitions can be cancelled by control lines of the form


    ```

    #undef identifier

    ```


    after which this identifier will not be replaced until a subsequent definition
    occurs for this identifier. After such an undefinition, the identifier is considered
    undefined for purposes of the #ifdef or #ifndef control lines. For example,


    ```

    #define N 2

    int a[N];

    #undef N

    {float N; ... N = 1.3; ...}

    #define N 4

    int k = 2 * N;

    ```


    would finally become


    ```

    int a[2];

    {float N; ... N = 1.3; ...}

    int k = 2 * 4;

    ```


    Note that definitions stack, so that a parameter may be #define over a short interval,
    then #undef, without affecting the usage of that parameter either before or after
    this interval.


    A #define also may specify arguments for use when the definition is expanded.
    Thus,


    ```

    #define swap(x,y) {int t; t = x; x = y; y = t}

    ```


    behaves, for each invocation, as if


    ```

    swap (a,b)

    ```


    were written as


    ```

    #define x a

    #define y b

    {int t; t = x; x = y; y = t;}

    #undef a

    #undef b

    ```


    Note that in the definition the left parenthesis delimiting the argument list
    must be immediately adjacent to the defined identifier, or the list will be treated
    as part of a definition having no arguments.'
