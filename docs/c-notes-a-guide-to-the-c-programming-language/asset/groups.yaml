    \ 字符串输入输出 79\n  - 6.5 格式化输入输出 80\n  - 6.6 退出 83\n- **7：机器相关性** 84\n  - 7.0 机器与系统相关性\
    \ 84\n  - 7.1 二进制整数 85\n  - 7.2 二进制浮点数 88\n  - 7.3 指针值 89\n  - 7.4 数组 89\n  -\
    \ 7.5 结构体和联合体 90\n  - 7.6 函数与运行时环境 90\n- 小结 95\n- 索引 97\n\n## 前言\n\nC 是一门正在迅速流行的语言。从贝尔实验室默里山分部阁楼中的悄然起步，它已经传播到全世界数百种机器上；而这一切几乎没有依靠任何销售努力。\n\
    \nC 可以被描述为一种可实现的 Algol 68，一种不怕弄脏双手的 Pascal，或者干脆是一门满足系统级程序员需求的优雅小巧的语言。这些说法都没有完整刻画出它在纯粹性和实用性、可移植性和效率之间精心达成的平衡的全部要义。\n\
    \nC 语言的设计目标是以最少的形式提供最大的功能。本书旨在为这门语言提供一份指南，一份形式上精确、同时也不回避阐明实现依赖和语义特殊性中那些晦暗角落的指南。它不是教程——没有人能与\
    \ Kernighan 和 Ritchie 的《C 程序设计语言》相比——也不是正式定义：他们那本书的附录 A 已经足以承担这一任务。相反，它填补了两者之间的中间地带，提供一种与贝尔实验室视角不同的\
    \ C 语言视角。随着实现不断增多，这种更广阔的视角将变得越来越重要。\n\n这是一本按二维结构组织的书。各章节覆盖语言的主要方面：\n\n- 0. 语法\n\
    - 1. 外部声明\n- 2. 初始化器与语句\n- 3. 表达式\n- 4. 局部声明\n- 5. 参数化\n- 6. 库例程\n- 7. 机器相关性\n\
    \n每一章由八个节组成，逐一考察各种数据类型：\n\n- .0 引言\n- .1 整数\n- .2 浮点数\n- .3 指针\n- .4 数组\n- .5\
    \ 结构体与联合体\n- .6 函数\n- .7 小结\n\n想快速了解这门语言，可以阅读各章的 .0 节；想获得精确的总结，则阅读 .7 节。任何与某一主题相关的特殊内容，例如指针，都能在\
    \ .3 节找到；指针表达式也一定会在第 3 章 .3 节讨论，简称 [3.3]。\n\n本书所述语言与丹尼斯·里奇在上述附录 A 中公布的技术规范高度一致。不过需要强调的是，尽管\
    \ C 仍然相当纯粹，现有编译器却没有一款能完全精确地符合该规范。\n\n## 0：语法\n\n> > 您在读什么，大人？\n>\n> > 词，词，词。\n\
    >\n> > ——莎士比亚，《哈姆雷特》\n\nC 编程语言由语言定义、实现和运行时环境组成。语言定义所描述的是与任何特定机器特性无关的 C；实现则努力在某种真实计算机上落实该定义；相应的运行时环境则弥补实现或机器上的任何不足，从而以足够保真度模拟一台\
    \ C 机器，以满足语言定义的要求。\n\nC 是一门与机器无关的语言，它试图对大多数现代计算机的基本运算符和操作数进行建模。正因如此，C 能够被翻译成在各种机器上高效且紧凑的代码，但这要以语言定义中一定程度的非确定性为代价。因此，有必要偶尔强调\
    \ C 程序中那些可能因不同实现而有所差异的方面；而且，了解哪些行为仅通过修改运行时支持包就能加以控制，也往往很有用。\n\n本书将主要关注 C 语言与机器无关的定义，因为那是它最具可移植性的方面。但务必记住，C\
    \ 是通过编译器实现的，\n\n"
