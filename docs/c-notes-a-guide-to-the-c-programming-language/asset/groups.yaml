    first_point.next -> x[0] = -1.0;\nlast_point.next = 0; /* null pointer */\ntop\
    \ -> x[1] = 3.9;\ntop = &first_point; /* changes nothing */\n```\n\nmakes the\
    \ pointer top at the structure first_point, then the 0-th element of part x of\
    \ first_point is changed to 3.2, the next element of first_point is made to point\
    \ at last_point, the 0-th element of part x of structure pointed at by next part\
