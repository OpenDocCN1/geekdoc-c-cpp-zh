    \n这些整数变量可以作为整数运算符的操作数参与运算，如 [3.1] 中所述。各种整数类型的变体已在 [0.1] 中解释。\n\nIf any of the\
    \ adjectives short, unsigned, or long is present, int is assumed and may be omitted.\
    \ In any context calling for an optional type specifier, the default type is taken\
    \ as int. It is good practice, however, to explicitly type all declarations.\n\
    \n如果存在 short、unsigned 或 long 等形容词，则假定为 int 并且可以省略。在任何需要可选类型说明符的上下文中，默认类型被视为 int。然而，显式为所有声明指定类型是良好的实践。\n\
    \n## 1.2 Floating declarations\n\n## 1.2 浮点声明\n\nAn external floating declaration\
    \ is a data declaration with a type specifier of the flavor floating type:\n\n\
    外部浮点声明是一种数据声明，其类型说明符为浮点类型：\n\n```\nfloating-type = / short | double | long | float\
    \ /\n```\n\nand declarators which are identifiers. For example,\n\n并且声明符为标识符。例如，\n\
