    ## C NOTES：C 程序设计语言指南


    作者：C.T. Zahn


    C NOTES 是一本关于高级编程语言 C 的参考手册和教程。正如本书所阐明的那样，C 语言支持结构化程序设计，允许模块分别编译，并包含便于程序维护的重要特性。C
    语言与机器无关，却模拟了大多数现代计算机的基本运算符和操作数。因此，C 可以转换为在各种机器上高效且紧凑的代码。


    本书主要关注 C 的可移植性方面，并详尽描述了该语言的语法、外部声明和局部声明以及宏预处理设施等主题。


    在加入 YOURDON 担任高级顾问之前，C.T. ZAHN 曾就职于斯坦福直线加速器中心的计算研究组，并在那里开发了 SKOL 编程语言。


    ## YOURDON Press 专著丛书还包括……


    ### 结构化走查


    作者：Edward Yourdon。


    《结构化走查》深入探讨了这种新的、非常成功的同行小组评审方法，用于评审功能规格说明、系统设计和代码。在本书的十三章中，你将了解开展走查的流程，以及避免走查使用中常伴随的各种心理问题的方法。走查被认为大幅减少了
    DP 系统中的错误数量，并显著提升了系统的整体质量。主题包括：走查类型；编程团队；角色；说服管理层；评估绩效；建设团队；评审练习；参考文献；索引。


    152 页，第二版，平装本，1978 年

    ISBN: 0-917072-09-X


