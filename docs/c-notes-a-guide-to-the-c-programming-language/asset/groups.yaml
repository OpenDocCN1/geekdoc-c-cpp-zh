    # SUMMARY


    Any programming language is an assemblage of various gadgets – literals, names,
    operators, expressions, declarations, array and structure constructors, functions,
    sequence control features, and so on. But this is an extremely limited point of
    view. As a tool for the construction of good programs, the language should support,
    and even encourage, the various methods now associated with good software engineering
    practices. Of primary importance are modularity, structured control, and systematic
    structuring of data.


    True modularity means that the parts of a large program are relatively independent
    and that the dependencies are precisely documented. Certain details inside each
    part (program logic or data representation) are thereby hidden from the other
    parts. This practice of encapsulating details has been applied to program logic
    for some time now (i.e., subroutines) and more recently to data representations
    (i.e., data abstraction modules). The functions of C, with their formal arguments
    and locally declared data, support the encapsulation of program logic; separately
    compiled program files with minimum use of the external attribute support the
    encapsulation of data representation.


    Structured control means a discipline of program logic dominated by sequence selection
    and repetition. To properly support this discipline, a language needs a general
    facility for grouping a sequence of statements into a unit. The compound statements
    of C provide for grouping, while the if and switch statements make selections;
    systematic control of repetitions is accomplished by the while, do, and for statements.
    Occasional needs for early termination of repetitions are catered for by break.


    Systematic structuring of data includes multiples of like elements, composites
    formed from unlike elements, items that at any time may be one of several choices,
    and the ability to create'
