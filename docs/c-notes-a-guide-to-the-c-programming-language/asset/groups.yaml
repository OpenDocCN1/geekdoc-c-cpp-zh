    size equal to the maximum size among its parts adjusted so that unions pack back-to-back
    also.


    ## 7.6 Functions and run-time environment


    Functions may not have arrays, structures, unions, or other functions as arguments
    or returned value, but pointers to same are allowed. In the absence of declarative
    information about argument types of a function, the compiler will assume int or
    double for an actual argument of type integer or floating respectively. Better
    control is attained when the programmer declares all known information about the
    argument and return types of external functions.


    In particular, the 11/40 or LSI-11 floating point instructions can be used to
    maximum advantage only by declaring explicitly all floating quantities to be float.
    Otherwise, the compiler will call on run-time code to do many conversions to double
    in order to satisfy the default typing rules.


    Actual argument expressions are calculated in reverse order to that specified
    in the call so that the run-time stack looks like argₙ, argₙ₋₁, ..., arg₁, return-link
    just before transfer to the function.


    A typical use of the eight integer and four fully addressable double floating
    registers of the PDP-11 is as follows:


    ### Integer Register


    | PDP-11 Value | Mnemonic | Meaning |

    |---|---|---|

    | 0 | R0 | Integer return values |

    | 1 | R1 | or volatile values |

    | 2 | R2 | Integer free registers |

    | 3 | R3 | commandeerable |

    | 4 | R4 | by user |

    | 5 | FP | Frame pointer for functions (R5) |

    | 6 | SP | Stack pointer |

    | 7 | PC | Program counter |


    ### Floating Register


    | PDP-11 Value | Mnemonic | Meaning |

    |---|---|---|

    | 0 | FR0 | Floating return values |

    | 1 | FR1 | or volatile values |

    | 2 | FR2 | Floating free (!) |

    | 3 | FR3 | and commandeerable |


    In this register usage scheme, it would be the responsibility of each C function
    (whether compiler or user built!) to return to its caller with registers R2, R3,
    R4, FP, SP, FR2, and FR3 in the same state as obtained at entry to the function.
    Moreover, the mode bits of the FPP must be double and int as described in [7.0].
    Returned values are expected as follows, depending on the type:


    | Type | Register |

    |---|---|

    | char, int, short int, unsigned int, pointer | R0 |

    | long int | R0/R1 |

    | floating, double | FR0 |


    In machines that do not have a FPP, floats could be returned in R0/R1, and double
    results in a globally declared accumulator c.fe. The c.fe would behave exactly
    as FR0; i.e., it is assumed to be volatile in function calls and must be saved,
    along with other registers, to make code reentrant. There also would be a c.fe
    analogous to FR1, but there might not be any that is allocatable and that corresponds
    to FR2 and FR3.


    The condition codes are not assumed to be meaningful on return from any C function.


    In most implementations, the compiler meticulously maintains a chain of stack
    frames, so that at any time


    - 1) FP is the current frame pointer

    - 2) 2(FP) is the return address from the most recent call

    - 3) 0(FP) is the previous frame pointer


    An exception to this would be any function compiled for the 11/40, LSI-11 floating
    point option. In this case, a possible implementation would be as follows:


    - 1) FP is the current frame pointer

    - 2) 6(FP) is the return address from the most recent call

    - 3) 4(FP) is the previous frame pointer

    - 4) 0(FP) is one floating accumulator

    - 5) -4(FP) is the other floating accumulator


    ## SUMMARY


    Any programming language is an assemblage of various gadgets – literals, names,
    operators, expressions, declarations, array and structure constructors, functions,
    sequence control features, and so on. But this is an extremely limited point of
    view. As a tool for the construction of good programs, the language should support,
    and even encourage, the various methods now associated with good software engineering
    practices. Of primary importance are modularity, structured control, and systematic
    structuring of data.


    True modularity means that the parts of a large program are relatively independent
    and that the dependencies are precisely documented. Certain details inside each
    part (program logic or data representation) are thereby hidden from the other
    parts. This practice of encapsulating details has been applied to program logic
    for some time now (i.e., subroutines) and more recently to data representations
    (i.e., data abstraction modules). The functions of C, with their formal arguments
    and locally declared data, support the encapsulation of program logic; separately
    compiled program files with minimum use of the external attribute support the
    encapsulation of data representation.


    Structured control means a discipline of program logic dominated by sequence selection
    and repetition. To properly support this discipline, a language needs a general
    facility for grouping a sequence of statements into a unit. The compound statements
    of C provide for grouping, while the if and switch statements make selections;
    systematic control of repetitions is accomplished by the while, do, and for statements.
    Occasional needs for early termination of repetitions are catered for by break.


    Systematic structuring of data includes multiples of like elements, composites
    formed from unlike elements, items that at any time may be one of several choices,
    and the ability to create

