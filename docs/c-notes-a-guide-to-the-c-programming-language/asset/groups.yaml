  - '[PAGE 51]


    The detailed discussion of these local declarations and type definitions, which
    are largely the same as the external declarations, is in Chapter 4. For now, we
    will concentrate on the statements, or imperative commands, of the C language.


    ```

    statement =

    | expr ;     % assignments and function calls

    | compound-statement % for grouping

    | selection-statement

    | repetition-statement

    | interruption-statement

    | labeled-statement % null statement

    ;

    ```


    Although detailed discussion of expressions (i.e., exprs) must await Chapter 3,
    we will introduce simple assignment expressions (statements in most languages)
    and function calls (procedure or subroutine calls elsewhere), since they are the
    active workhorses of most C programs. Some expression statements already encountered
    are:


    ```

    k = 0;

    /* same as k = k + 1; */

    lookup(table, x, &index);

    ```


    Programs unable to make choices are weak indeed, so C has two flavors of selection
    statement:


    ```

    selection-statement =

    | if ( logical-expr ) statement

    | else statement

    | switch ( expr ) switch-statement-group


    switch-statement-group =

    | { { local-declaration | type-definition } }

    | case-prefixed-statement


    case-prefixed-statement =

    | case constant-expr default : statement

    ```


    An if statement calls for execution of the first substament precisely when the
    logical-expr is “true” (nonzero); otherwise, it calls for the execution of the
    second substament after else.'
  - "[PAGE 52]\n\nWhen the else phrase is omitted, it is just as if else /* null */;\
    \ were explicitly specified. For example,\n\n```\nif (k < 2)\n p = f(k);\nelse\n\
    \ p = g(2 - k);\n```\n\nwill perform exactly one of the two assignments depending\
    \ on the magnitude of k relative to 2. Relational operators deliver a value of\
    \ 1 for “true” and 0 for “false” as more fully discussed in Chapter 3. A common\
    \ form is\n\n```\nif (p)\n...\nelse if (q)\n...\nelse if (r)\n...\nelse\n/* none\
    \ of the above */\n...\n```\n\nand this style of indentation is Recommended.\n\
    \nFrequently enough, the logical exprs p, q, r, and so forth, are of the form\
    \ k == 1, k == 2, k == 5, etc., where == is the equality comparison operator in\
    \ C. Such cases are catered for by the switch statement as exemplified by\n\n\
    ```\nswitch(k - 2)\n{\ncase 3: j = k*k; break;\ncase 5, 2: ++k; do_something(k);\
    \ break;\ndefault: error (\"bad k\");\n}\n```\n\nSince the case prefix allows\
    \ only constant expressions, the switch statement can be implemented very efficiently.\
    \ The break statements are necessary to terminate the switch statement after each\
    \ selectable portion; otherwise, control flows from one case to the next in a\
    \ most unsatisfactory manner. Case labels may occur embedded within a compound\
    \ statement. Only an embedded switch statement limits this questionable facility."
  - "[PAGE 53]\n\nThe repetition statements of C are given by\n\n```\nrepetition-statement\
    \ =\n| while ( logical-expr ) statement\n| do statement while ( logical-expr );\n\
    | for ( expr_opt ; logical-expr ; expr_opt ) statement\n|\n```\n\nA while statement\
    \ repeatedly performs its substatement until the logical-expr is no longer “true,”\
    \ never embarking on an execution of the substatement if logical-expr is “false.”\
    \ It may be a repetition of multiplicity 0 if logical-expr is initially “false.”\n\
    \nThe do statement is similar except that the test is performed and the repetition\
    \ potentially terminated after each performance of the substatement. It therefore\
    \ performs its substatement at least once.\n\nThe for statement is a shorthand\
    \ for\n\n```\nexpr1;\nwhile ( logical-expr )\n{ statement ; expr2 }\n```\n\nso\
    \ the first expression is usually an initialization; the second a logical pretest;\
    \ and the third some form of post-augmentation. Examples are\n\n```\nwhile (c[i]\
    \ == ' ' && i < SIZE)\n    ++i;\ndo\n{\n    swap (c, i, j);\n    ++i;\n    --j;\n\
    }\nwhile (i < j);\n/* array c now reversed */\nfor (i = 0; i < SIZE; ++i)\n{\n\
    \    a[i] = b[i];\n    c[i] = -1.0;\n}\n/* array b copied to a and c set to -1.0\
    \ */\n```\n\nIf the logical-expr in a for statement is missing, a constant “true”\
    \ value (1) is assumed."
