  md: "\nAn array, just as there is no limit to the length of a chain of pointers.\
    \ An array of arrays of pointers to arrays of integers is quite acceptable.\n\n\
    An array also is characterized by its starting address and by the number of elements\
    \ it contains, that is, its multiplicity. The former is determined by its storage\
    \ class, and must have a value that is legal for pointers to objects of the same\
    \ type as the elements of the array. In this sense, an array starting address\
    \ can be considered a literal pointer.\n\nC has no provision for variable-length\
    \ arrays, although a program is of course at liberty to use less than the full\
    \ multiplicity of elements in an array. This means that in many contexts the number\
    \ of elements must be determined before an array can be referred to, and that\
    \ there is no information stored with an array other than the current values of\
    \ all its elements. Some latitude is permitted in determining the multiplicity,\
    \ so that the compiler often can be made to count up things itself instead of\
    \ burdening the programmer. It is illegal for an array to have a multiplicity\
    \ of zero.\n\nAn array with undetermined multiplicity is not “an object of known\
    \ size” and hence may not be composed into other arrays or used in one or two\
    \ other contexts. It also is not permissible to form an array of functions, or\
    \ of structures whose contents are not determined.\n\nThere is one kind of literal\
    \ array. A literal that begins with a double quote, \", is taken as a character\
    \ string, or array of characters. All characters following the double quote, including\
    \ whitespace, up to the next double quote are taken as character integers that\
    \ define succeeding elements of an array of characters. A null character, \\0,\
    \ is appended to every string, so that a character string always has a multiplicity\
    \ of at least one, as in \"\", which is the null string.\n\nThe same escape sequences\
    \ defined for character integers in [0.1] and [0.7] are usable inside strings.\
    \ In particular, \\\" is a literal double quote, \\\\ is a literal backslash,\
    \ and \\ newline continues the string on the next line. The style rules pertaining\
    \ to character integers also should be applied.\n\n## 0.5 Structures and unions\n\
    \nOften, data items of differing types want to be grouped together because the\
    \ items are strongly related. Input-output records are a typical example of aggregates,\
    \ as are complex numbers. The former are an array of characters, but that disguises\
    \ the relationship among characters of a particular subfield. Similarly, the latter\
    \ can be considered a two-element array of floats, if one ignores the asymmetry\
    \ in processing the two fields. It is far more general, however, to provide for\
    \ aggregates of arbitrary types; this is the purpose of data structures in C.\n\
    \nAny objects of known size can be collected into a structure, including pointers,\
    \ arrays, or other structures. A structure is defined by the order and types of\
    \ its elements; two structures match only if their corresponding elements have\
    \ the same types collected in the same order. No information regarding the composition\
    \ of a structure is stored with it, just the values of each of its elements.\n\
    \nThere can be regions of program text in which a given structure can be referred\
    \ to before its contents are defined. In this region, the structure is not an\
    \ object of known size, and hence cannot be composed into arrays or other structures.\n\
    \nIt is tempting to think that the size of a structure is the sum of the size\
    \ of each of its elements, but this is naive. Many modern computers have some\
    \ restrictions on the placement of certain data types in storage. A four-byte\
    \ floating datum may, for instance, be required to have a machine address that\
    \ is exactly divisible by four. Thus, each data type is characterized not only\
    \ by its size in bytes but also by the severity of its storage boundary restrictions.\n\
    \nThe obvious consideration inside a structure is that an element might not be\
    \ placeable immediately after the previous element — holes may occur, the size\
    \ and location of which are machine-dependent. It is equally clear that a structure\
    \ itself must be aligned on a storage boundary at least as restrictive as that\
    \ needed for its most restricted element. Thus, if a four-byte float were to follow\
    \ a character, for instance, it is conceivable that a three-byte hole would have\
    \ to be introduced. If floats were required to begin on even addresses, as in\
    \ the PDP-11, then a one-byte hole would occur.\n\n## 0. SYNTAX 13\n\nA more subtle\
    \ requirement is that a structure must end on a boundary at least as restricted\
    \ as that on which it begins. This is to ensure that an array of structures will\
    \ meet all boundary requirements for elements after the first. So a structure\
    \ may even have a hole on the end, as it were.\n\nThere are no structure literals.\n\
    \nA close relative of the data structure is the union of types. Unions occur frequently\
    \ in programs where more than one type of data must be placed in the same storage\
    \ location. Often the overlap takes advantage of known similarities in sizes of\
    \ the different types to be used, and possibly in how they are moved about; this\
    \ is extremely machine-dependent. Like using an array to represent a structure,\
    \ it can be misleading as well.\n\nAny objects of known size can be collected\
    \ into a union, whose size is then large enough to hold the largest of its elements\
    \ or whose boundary restriction is as severe as the severest of its elements.\
    \ Like a structure, a union also may be padded so that it ends on the same boundary\
    \ as that on which it must begin. Unlike a structure, only one of the choice of\
    \ elements may reside inside a union at any given moment. No information regarding\
    \ the composition of a union, or the type of its current contents, is stored with\
    \ it — just the value of one of its elements.\n\nThus, unions are used primarily\
    \ to inform the implementation of a practice that is very likely to be machine-dependent,\
    \ so that the compiler can meet the minimum requirements of whatever target machine\
    \ is chosen.\n\nThere are no union literals.\n\n## 0.6 Functions\n\nFunctions\
    \ are the executable entities of C. They may represent compound actions to be\
    \ performed, or call for the calculation of mathematical functions of one or more\
    \ arguments.\n\nEach C program must always contain a function named main, whose\
    \ single performance defines the execution of the program. Such a program has\
    \ been described in [0.0].\n\nJust as pointers always are declared as pointing\
    \ to some known type, functions are always declared as returning some type, even\
    \ if no type is explicitly mentioned (see [1.6]), no value is explicitly returned\
    \ [2.6], or no returned value is ever used [3.6]. Functions may only return scalar\
    \ types, i.e., integers, floats, or pointers.\n\nArguments to functions are passed\
    \ by value, i.e., a fresh copy of each argument is made for each invocation of\
    \ the function, and the function is at liberty to alter these private copies.\
    \ As with returned values, only scalar types may be passed as arguments (but see\
    \ [3.4, 3.5, 3.6] for implicit coercion of non-scalars to scalars).\n\nAlthough\
    \ a valid C program can consist of the main function alone, it is usual to delegate\
    \ a number of the activities required by main to other functions and to continue\
    \ this process until the functions are all of a manageable size. The communication\
    \ between main and its subordinate functions is accomplished normally by a list\
    \ of arguments and possibly by a result returned. In other cases, functions can\
    \ communicate implicitly by common access to globally known variables, although\
    \ this leads to less readable programs.\n\nThe following three functions, named\
    \ main, newnum, and printd, illustrate the major possibilities:\n\n```c\nint c;\
    \ /* globally known current input character */\nmain() /* read, convert, and print\
    \ number */\n{\n    int number;\n    c = getchar();\n    number = 0;\n    while\
    \ (isdigit(c))\n    {\n        number = newnum(number);\n        c = getchar();\n\
    \    }\n    printd(number);\n}\n```\n"
  mdcn: "\n数组就像指针链一样，其长度没有限制。指向整数数组的指针的数组的数组是完全可以接受的。\n\n数组还由其起始地址和包含的元素数量（即其重数）来表征。前者由其存储类别决定，并且必须具有对与数组元素类型相同对象的指针合法的值。在此意义上，数组的起始地址可以被视为一个字面指针。\n\
    \nC 没有提供变长数组的支持，尽管程序当然可以自由使用数组中少于全部重数的元素。这意味着在许多上下文中，必须在引用数组之前确定元素数量，并且数组中存储的信息仅限于其所有元素的当前值。在确定重数时允许一定的灵活性，因此编译器通常可以自行计数，而不是让程序员负担。数组的重数为零是非法的。\n\
    \n重数未确定的数组不是“已知大小的对象”，因此不能构成其他数组或在另外一两个上下文中使用。也不允许形成函数数组，或内容未确定的结构数组。\n\n存在一种字面数组。以双引号\
    \ \" 开始的字面量被视为字符字符串，或字符数组。双引号之后的所有字符，包括空白，直到下一个双引号，都被视为字符整数，定义字符数组的后续元素。每个字符串都会附加一个空字符\
    \ \\0，因此字符字符串的重数至少为一个，如 \"\"，它是空字符串。\n\n在 [0.1] 和 [0.7] 中为字符整数定义的相同转义序列在字符串内部也可使用。特别是，\\\
    \" 是一个字面双引号，\\\\ 是一个字面反斜杠，而 \\ 换行会将字符串继续到下一行。有关字符整数的风格规则也应适用。\n\n## 0.5 结构体和联合体\n\
    经常需要将不同类型的数据项组合在一起，因为这些项密切相关。输入输出记录是聚合的一个典型例子，复数也是如此。前者是字符数组，但这掩盖了特定子字段中字符之间的关系。同样，后者如果忽略两个字段处理的非对称性，可以被视为一个双元素浮点数组。然而，更为通用的是提供任意类型的聚合；这就是\
    \ C 中数据结构的用途。\n\n任何已知大小的对象都可以收集到一个结构体中，包括指针、数组或其他结构体。结构体由其元素的顺序和类型定义；两个结构体只有在其对应元素具有相同类型且按相同顺序排列时才匹配。关于结构体的组成信息不会与其一起存储，只有每个元素的数值。\n\
    \n程序文本中可能存在某个结构体在内容定义之前就可以被引用的区域。在此区域中，该结构体不是已知大小的对象，因此不能构成数组或其他结构体。\n\n人们很容易认为结构体的大小是其每个元素大小的总和，但这是天真的。许多现代计算机对某些数据类型在存储中的放置有一些限制。例如，四字节浮点数据可能要求其机器地址能被四整除。因此，每个数据类型不仅以字节大小为特征，还以其存储边界限制的严格程度为特征。\n\
    \n结构体内部明显的考虑是，一个元素可能无法紧跟在前一个元素之后放置——可能会出现空洞，其大小和位置取决于机器。同样明显的是，结构体本身必须对齐到至少与其中最受限制元素所需一样严格的存储边界上。因此，例如，如果一个四字节浮点数跟在一个字符之后，就可能需要引入一个三字节的空洞。如果浮点数要求从偶地址开始，如\
    \ PDP-11 中那样，则会出现一个一字节的空洞。\n\n## 0. 语法 13\n更微妙的要求是，结构体必须结束于至少与开始时一样受限制的边界上。这是为了确保结构体数组的后续元素也能满足所有边界要求。因此，结构体甚至可能在末尾有一个空洞，姑且这么说。\n\
    \n没有结构体字面量。\n\n数据结构的一个近亲是类型的联合体。联合体经常出现在程序中需要在同一存储位置放置多种类型数据的地方。经常重叠利用了所用不同类型大小的已知相似性，以及可能在如何移动它们方面的相似性；这极度依赖机器。像使用数组来表示结构体一样，这也可能具有误导性。\n\
    \n任何已知大小的对象都可以收集到一个联合体中，其大小足以容纳其最大元素，或其边界限制与最严格元素的边界限制一样严格。像结构体一样，联合体也可能被填充以使其结束于必须开始的同一边界上。与结构体不同，在任何给定时刻，联合体内部只能存在所选元素之一。关于联合体的组成或其当前内容的类型的任何信息都不会与其一起存储——只有其中一个元素的值。\n\
    \n因此，联合体主要用于告知实现一种很可能依赖机器的做法，以便编译器能够满足所选目标机器的最低要求。\n\n没有联合体字面量。\n\n## 0.6 函数\n\
    函数是 C 的可执行实体。它们可能代表要执行的复合操作，或调用一个或多个参数的数学函数计算。\n\n每个 C 程序必须始终包含一个名为 main 的函数，其单次执行定义了程序的执行。这样的程序已在\
    \ [0.0] 中描述。\n\n正如指针总是被声明为指向某个已知类型，函数总是被声明为返回某个类型，即使没有明确提及类型（参见 [1.6]），没有显式返回值\
    \ [2.6]，或从未使用返回值 [3.6]。函数只能返回标量类型，即整数、浮点数或指针。\n\n函数参数按值传递，即每次调用函数时都会为每个参数制作一份新副本，函数可以随意更改这些私有副本。与返回值一样，只能传递标量类型作为参数（但参见\
    \ [3.4, 3.5, 3.6] 中非标量到标量的隐式强制转换）。\n\n尽管一个有效的 C 程序可以仅由 main 函数组成，通常会将 main 所需的许多活动委托给其他函数，并继续这一过程直到所有函数都达到可管理的大小。main\
    \ 及其从属函数之间的通信通常通过参数列表以及可能返回的结果来完成。在其他情况下，函数可以通过对全局已知变量的共同访问隐式通信，尽管这会导致程序可读性降低。\n\
    \n以下三个名为 main、newnum 和 printd 的函数说明了主要可能性：\n\n```c\nint c; /* globally known current\
    \ input character */\nmain() /* read, convert, and print number */\n{\n    int\
    \ number;\n    c = getchar();\n    number = 0;\n    while (isdigit(c))\n    {\n\
    \        number = newnum(number);\n        c = getchar();\n    }\n    printd(number);\n\
    }\n```\n"
