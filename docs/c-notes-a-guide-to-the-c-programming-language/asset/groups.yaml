    }\n```\n\n```c\nlookup(t, val, i)\nfloat *t;\nfloat val;\nint *i;\n{\n    int\
    \ k;\n    for (k = 0; k < 6; ++k)\n        if (*(t + k) == val)\n        {\n \
    \           *i = k;\n            return;\n        }\n    *i = -1;\n}\n```\n\n\
    其中一些内容在完全理解指针表达式和 variable-name-exprs 之前不会很清楚；请特别参见 [3.1] 和 [3.3]。重要的是要认识到，在 &index\
    \ 之后，对应于形式指针参数 i 的实际参数被给出；然后，像 *i = k; 这样的赋值实际上意味着对 index 的赋值，因为前缀指针操作 * 使表达式\
    \ *i 成为内存中可更改对象的有效 name-expr。\n\n上面的程序可以重写，将 &table[0] 改为 table，将 float *t 改为\
    \ float t[]，将 *(t + k) 改为 t[k]，而不会改变含义。这是因为未下标的数组名被视为指向第 0 个元素的指针的值，因为形式数组参数被解释为指向数组元素类型的指针，并且因为\
    \ t[k]  anyway 被实现为表达式 *(t + k)（参见 [3.4]）。\n\n现在是时候描述一些语句了。函数定义的基本单位是复合语句，其语法如下所示：\n\
    \n```c\ncompound-statement =\n{ { local-declaration | type-definition }\n  { statement\
    \ } }\n```\n\n这些局部声明和类型定义的详细讨论——它们在很大程度上与外部声明相同——在第 4 章中。对于现在，我们将集中于 C 语言的语句，或命令式命令。\n\
