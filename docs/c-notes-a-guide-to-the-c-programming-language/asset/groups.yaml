    The C language has sequence expressions that consist of a sequence of expressions
    separated by commas, that is, an expr list. It is recommended to package a sequence-expr
    in enclosing parentheses since sometimes they may occur in a context in which
    commas have other meanings as well, as in an argument list. The meaning of


    ```

    (t = x, s = y - f(t), s*7.3)

    ```


    is much the same as if we wrote the compound statement


    ```

    {t = x, s = y - f(t); s*7.3}

    ```


    in the place of an expression. The three subexpressions are evaluated in order
    from left to right as would be implied by the semicolons in the analogous compound
    statement; the value delivered is the value of the last (right-most) expr of the
    list.


    ### 3.1 Integer expressions


    The basic integer expressions are the so-called integer primaries, which include
    integer constants, integer and character variable names, integer function calls
    (see [3.6]), and parenthesized integer expressions. The following are integer
    primaries:


    - 25

    - k

    - count(p,3)

    - (i - 2 * k)


    More complicated name expressions like p->qlk1.n will be treated in subsequent
    sections.


    Integer primaries can be combined with other integer expressions using the unary
    operators + and -, or one of the binary operators +, -, *, /, %. The integer quotient
    (/) and remainder (%) operators produce the expected quotient and remainder (truncated
    toward zero) when both operands are positive. The result is otherwise somewhat
    machine-dependent. The other three operators are those of normal integer arithmetic.
    For example, 3+6 is 9, 3-5 is -2, 3*12 is 36, 17/5 is 3 and 17%5 is 2.


    The following is an integer arithmetic expression:


    ```

    25 + k % count(p,3) - 7 / (i - 2 * k)

    ```


    It also is possible to combine integer expressions using bitwise binary operators
    &, |, ^, <<, >>, and the unary bitwise operator ~. They are known respectively
    as "and," "or," "exclusive or," "left shift," "right shift," and "complement."
    "Complement" considers its operand as a sequence of binary digits and flips the
    state of each such "bit." The "and," "or," and "exclusive or" consider both operands
    as sequences of binary digits and perform the well-known bitwise operations. The
    shifts consider the first operand as a sequence of binary digits to be left- or
    right-shifted the number of bit positions given by the second operand, which should
    be positive for maximum portability. Left shifts introduce zero bits from the
    right, but right shifts in general are not promised to do so for negative values
    of the first operand. For example,


    - (000101) & (010110) is (000100)

    - (000111) | (110100) is (110111)

    - (000111) ^ (110100) is (110011)

    - (000101) << 2 is (010100)

    - (001100) >> 3 is (000001)

    - ~(001100) is (110011)


    The following statement extracts the low-order eight-bit byte from k and inserts
    it into the high-order eight-bit byte of p, assuming 16-bit integer variables:


    ```

    p = (p&0377) | (k&0xFF)<<8

    ```


    The expression p&0377 saves the low byte of p and has a zero-high byte. The expression
    (k&0xFF)<<8 has as high byte the low byte of k and a zero-low byte. Hence, the
    bitwise "or" has a high byte equal to the low byte of k and a low byte equal to
    the low byte of p. The following two expressions are also the same (on a 16-bit
    computer):


    ```

    p ^ 0xFFFF is ~p

    ```


    An integer expression also results from taking the difference of two pointer-exprs
    to the same type. For example, if a is an array of int, then


    ```

    &a[3] - &a[1]

    ```


    is the difference between two pointers divided by the size of int. Hence, the
    value is 2. If the two pointers do not point into the same array, bizarre results
    may occur. See [3.3] for details of pointer-exprs.


    There also are integer constants of the form


    ```

    sizeof ( expr )

    sizeof ( type-expr )

    ```


    which deliver the size in bytes of the operand expr or of the type designated
    by the cast ( type-expr ). The function sizeof applied to an array-variable-name
    or string yields the size of the entire array, as one would expect.


    Finally, among the integer expressions are to be found the very important logical-exprs,
    whose syntax is


    ```

    logical-expr =

    { logical-expr && logical-expr

    | logical-expr || logical-expr

    | ! logical-expr

    | expr { == | != } expr

    | expr { < | > | <= | >= } expr

    | expr interpreted as (expr != 0)

    | ( logical-expr )

    }

    ```


    The logical AND &&, logical OR ||, and logical NOT ! operators are defined as
    equivalent to certain conditional-exprs, as follows:


    ```

    a && b ≡ a ? ( b ? 1 : 0 ) : 0

    a || b ≡ a ? 1 : ( b ? 1 : 0 )

    ! a ≡ a ? 0 : 1

    ```


    The result of these operators is always 0 or 1; therefore, an integer variable
    holding values generated by these operators can act as a boolean or logical variable.
    This is so because an integer expression encountered in the context of a test
    is interpreted as "true" when nonzero, and "false" otherwise. Notice that the
    && and || determine an order of evaluation inherited from the meaning of the conditional-expr.
    Basically, they guarantee left to right evaluation with termination occurring
    as soon as the value is determined.


    The equality operators (equal == and not equal !=) as well as relational operators
    (less <, greater >, less or equal <=, greater or equal >=) yield 1 if the inequality
    is "true," and 0 otherwise. If one operand is narrower than the other, it is widened
    appropriately before the comparison.


    A cast expression of the form


    ```

    (int) arithmetic-expr

    ```


    gives the same integer value as would be obtained by assigning the arithmetic-expr
    to an int variable.


    ### 3.2 Floating expressions


    The basic floating expressions are the floating primaries, which include floating
    constants, floating variable names, floating function calls, and parenthesized
    floating expressions, like 3.14159E-5, xlk, -l1, length(x, y), (2.0 * z + y)


    More complicated floating expressions are built from floating primaries and from
    other floating expressions by the unary operators + and - and by the familiar
    binary arithmetic operators +, -, *, and /. For example,


    ```

    3.14 * (xlk - l1 - length(x, y)) + z/1.1

    ```


    The augmentation operators ++ and -- call for adding 1.0 or -1.0 to the floating
    variable specified. As with integers, both prefix and postfix forms apply. The
    precision of a floating calculation will be at least as precise as the wider (more
    precise) of the two operands. Some implementations may use extra precision during
    the calculation.


    A cast expression of the form


    ```

    (float) arithmetic-expr

    ```


    widens the arithmetic-expr to float, if necessary.


    Integers may be intermixed freely with floating operands, and are widened as needed.


    ### 3.3 Pointer expressions


    There are no pointer constants, strictly speaking, so the primaries of type pointer
    are pointer variable names, pointer function calls, and parenthesized pointer
    expressions. The basic pointer expression is of the form


    ```

    &variable-name-expr

    ```


