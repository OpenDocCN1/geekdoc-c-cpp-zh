    \ 有两种选择语句：\n\n```c\nselection-statement =\n| if ( logical-expr ) statement\n|\
    \ if ( logical-expr ) statement else statement\n| switch ( expr ) switch-statement-group\n\
    \nswitch-statement-group =\n| { { local-declaration | type-definition } }\n| case-prefixed-statement\n\
    \ncase-prefixed-statement =\n| case constant-expr : statement\n| default : statement\n\
    ```\n\nif 语句要求在 logical-expr 为“真”（非零）时精确执行第一个子语句；否则，它要求在 else 之后执行第二个子语句。当省略 else\
    \ 短语时，就好像显式指定了 else /* null */; 一样。例如，\n\n```c\nif (k < 2)\n    p = f(k);\nelse\n\
    \    p = g(2 - k);\n```\n\n将根据 k 相对于 2 的大小执行两个赋值中的恰好一个。关系运算符提供 1 表示“真”，0 表示“假”，将在第\
    \ 3 章中更详细地讨论。常见形式是\n\n```c\nif (p)\n...\nelse if (q)\n...\nelse if (r)\n...\n\
