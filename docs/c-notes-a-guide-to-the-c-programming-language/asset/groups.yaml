    \ in which the name occurs.\n\n使 number、smallest 和 largest 成为三个整数变量的名称，默认情况下它们是外部可见的。对这些名称中任何一个的后续引用将返回其当前值，或根据名称出现的上下文用新值替换其当前值。\n\
    \nThese integer variables can participate as operands of integer operators, as\
