    \ this section. An expression of the form\n\n```\narray-variable-name-expr [ integer-expr-list\
    \ ]\n```\n\ndenotes the element variable selected by the value of the integer-expr-list.\
    \ As in the case of array declarations, a[5][j, x+3] is entirely equivalent to\
    \ a[5][j][x+3]. Each value should clearly be nonnegative and less than the corresponding\
    \ declared maximum number of elements in the array. For example,\n\n```\nint a[5],\
    \ k;\nk = 3;\na[4] = a[k] + a[k+1];   /* okay */\na[k+2] = 9;             /* no\
    \ good, a[4] is last */\n```\n\nA declaration with more than one dimension like\n\
