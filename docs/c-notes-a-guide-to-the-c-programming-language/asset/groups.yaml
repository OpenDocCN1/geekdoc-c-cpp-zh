    # 7.0 Machine and system dependencies


    This chapter is intended to cover those aspects of the current implementation
    of C (PDP-11 under RSX-11M or UNIX†) that are not defined in the portable part
    of the language but are defined or made more precise by the hardware of the PDP-11,
    or the operating system. These dependencies will be discussed in appropriate sections
    whenever possible, but the following list presents a general overview of topics,
    indicating where details can be found:


    +   (1) hardware representation of basic types [7.1, 7.2, 7.3]

    +   (2) hardware implementation of operators on basic types [7.1, 7.2]

    +   (3) ASCII seven-bit characters in eight-bit bytes [7.1]

    +   (4) restrictions on identifier length [7.0]

    +   (5) treatment of external or global names and library conventions [7.0]

    +   (6) widening, narrowing, and confrontations [7.1, 7.2, 7.3, 7.6]

    +   (7) memory mapping of structures and unions [7.5]


    † UNIX is a registered trademark of Bell Laboratories.'
