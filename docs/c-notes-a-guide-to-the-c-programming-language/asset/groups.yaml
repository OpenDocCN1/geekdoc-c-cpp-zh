    # PREFACE


    C is a language that is rapidly growing in popularity. From quiet beginnings in
    the attic of Bell Labs, Murray Hill, it has spread to hundreds of machines all
    over the world; and it has done so with little or no sales effort.


    C can be described as an implementable Algol 68, or as a Pascal that''s not afraid
    to get its hands dirty, or simply as an elegant little language that meets the
    needs of system-level programmers. None of these views captures the full import
    of the balance that has been so carefully struck between purity and practicality,
    between portability and efficiency.


    The language C has been designed to provide maximum function with minimum form.
    The purpose of this book is to provide a guide to the language, a guide that is
    formally precise yet that does not hesitate to elucidate the darker corners of
    implementation dependencies and semantic peculiarities. It is not a tutorial —
    one cannot compete with Kernighan and Ritchie''s The C Programming Language —
    nor is it a formal definition: Appendix A of their book serves well enough for
    that. Rather, it fills in the middle ground and provides a perspective on C that
    differs from the Bell Labs view. As implementations proliferate, that broader
    perspective will become progressively more important.


    This is a two-dimensional book. The chapters cover the gross aspects of the language:


    +   0. Syntax

    +   1. External declarations

    +   2. Initializers and statements'
  - '[PAGE 9]


    +   3. Expressions

    +   4. Local declarations

    +   5. Parameterization

    +   6. Library routines

    +   7. Machine dependencies


    Each chapter consists of eight sections visiting the various data types:


    +   .0 Introduction

    +   .1 Integers

    +   .2 Floating numbers

    +   .3 Pointers

    +   .4 Arrays

    +   .5 Structures and unions

    +   .6 Functions

    +   .7 Summary


    To get a quick overview of the language, read the .0 sections of each of the chapters;
    to get a precise summary, read the .7 sections. Everything peculiar to, say, pointers
    can be found in the .3 sections, and pointer expressions are surely discussed
    in Chapter 3, .3 section, or [3.3] for short.


    The language described here adheres closely to the specifications promulgated
    by Dennis Ritchie in the aforementioned Appendix A. It should be emphasized, however,
    that none of the existing compilers match that specification precisely, although
    C is still rather pure.'
  - "[PAGE 10]\n\n# 0: SYNTAX\n\n> > What do you read, my Lord?\n> \n> > Words, words,\
    \ words.\n> \n> > — Shakespeare, Hamlet\n\n\n\nThe C programming language consists\
    \ of a language definition, an implementation, and a run-time environment. The\
    \ language definition describes C independent of any particular machine characteristics;\
    \ the implementation strives to enforce that definition in terms of some real\
    \ computer; and the corresponding run-time environment makes up for any inadequacies\
    \ in the implementation or in the machine, in order to emulate a C machine with\
    \ sufficient fidelity to satisfy the language definition.\n\nC is a machine-independent\
    \ language that attempts to model the basic operators and operands of most modern\
    \ computers. As such, C is capable of being translated into efficient and compact\
    \ code on a variety of machines, but only at the cost of a certain amount of indeterminacy\
    \ in the language definition. It is necessary, therefore, to occasionally stress\
    \ those aspects of a C program that may vary among different implementations;\
    \ and it is often useful to know what can be controlled by mere changes in the\
    \ run-time support package.\n\nThis book will focus primarily on the machine-independent\
    \ definition of C, since that is its most portable aspect. But it is important\
    \ to keep in mind that C is implemented as a compiler,"
