    \ float *t to float t[] and *(t + k) to t[k] with no alteration of meaning. It\
    \ is because unsubscripted array names are taken to mean the value of a pointer\
    \ to the 0-th element, because formal array arguments are interpreted as pointers\
    \ to the array element type, and because t[k] is implemented as the expression\
    \ *(t + k) anyway (see [3.4]).\n\nIt is finally time to describe some statements.\
    \ The basic unit of function definition is compound statement, whose syntax is\
    \ presented as follows:\n\n```c\ncompound-statement =\n{ { local-declaration |\
    \ type-definition }\n  { statement } }\n```\n\nThe detailed discussion of these\
    \ local declarations and type definitions, which are largely the same as the external\
    \ declarations, is in Chapter 4. For now, we will concentrate on the statements,\
    \ or imperative commands, of the C language.\n\n```c\nstatement =\n| expr ;  \
    \   % assignments and function calls\n| compound-statement % for grouping\n| selection-statement\n\
    | repetition-statement\n| interruption-statement\n| labeled-statement % null statement\n\
    ;\n```\n\nAlthough detailed discussion of expressions (i.e., exprs) must await\
    \ Chapter 3, we will introduce simple assignment expressions (statements in most\
    \ languages) and function calls (procedure or subroutine calls elsewhere), since\
    \ they are the active workhorses of most C programs. Some expression statements\
    \ already encountered are:\n\n```c\nk = 0;\n/* same as k = k + 1; */\nlookup(table,\
    \ x, &index);\n```\n\nPrograms unable to make choices are weak indeed, so C has\
    \ two flavors of selection statement:\n\n```c\nselection-statement =\n| if ( logical-expr\
    \ ) statement\n| if ( logical-expr ) statement else statement\n| switch ( expr\
    \ ) switch-statement-group\n\nswitch-statement-group =\n| { { local-declaration\
    \ | type-definition } }\n| case-prefixed-statement\n\ncase-prefixed-statement\
    \ =\n| case constant-expr : statement\n| default : statement\n```\n\nAn if statement\
    \ calls for execution of the first substatement precisely when the logical-expr\
    \ is “true” (nonzero); otherwise, it calls for the execution of the second substatement\
    \ after else. When the else phrase is omitted, it is just as if else /* null */;\
    \ were explicitly specified. For example,\n\n```c\nif (k < 2)\n    p = f(k);\n\
    else\n    p = g(2 - k);\n```\n\nwill perform exactly one of the two assignments\
    \ depending on the magnitude of k relative to 2. Relational operators deliver\
    \ a value of 1 for “true” and 0 for “false” as more fully discussed in Chapter\
    \ 3. A common form is\n\n```c\nif (p)\n...\nelse if (q)\n...\nelse if (r)\n...\n\
    else\n/* none of the above */\n...\n```\n\nand this style of indentation is recommended.\n\
    \nFrequently enough, the logical exprs p, q, r, and so forth, are of the form\
    \ k == 1, k == 2, k == 5, etc., where == is the equality comparison operator in\
    \ C. Such cases are catered for by the switch statement as exemplified by\n\n\
    ```c\nswitch(k - 2)\n{\ncase 3: j = k*k; break;\ncase 5: case 2: ++k; do_something(k);\
    \ break;\ndefault: error(\"bad k\");\n}\n```\n\nSince the case prefix allows only\
    \ constant expressions, the switch statement can be implemented very efficiently.\
    \ The break statements are necessary to terminate the switch statement after each\
    \ selectable portion; otherwise, control flows from one case to the next in a\
    \ most unsatisfactory manner. Case labels may occur embedded within a compound\
    \ statement. Only an embedded switch statement limits this questionable facility.\n\
    \nThe repetition statements of C are given by\n\n```c\nrepetition-statement =\n\
    | while ( logical-expr ) statement\n| do statement while ( logical-expr );\n|\
    \ for ( expr_opt ; logical-expr ; expr_opt ) statement\n```\n\nA while statement\
    \ repeatedly performs its substatement until the logical-expr is no longer “true,”\
    \ never embarking on an execution of the substatement if logical-expr is “false.”\
    \ It may be a repetition of multiplicity 0 if logical-expr is initially “false.”\n\
    \nThe do statement is similar except that the test is performed and the repetition\
    \ potentially terminated after each performance of the substatement. It therefore\
    \ performs its substatement at least once.\n\nThe for statement is a shorthand\
    \ for\n\n```c\nexpr1;\nwhile ( logical-expr )\n{ statement ; expr2 }\n```\n\n\
    so the first expression is usually an initialization; the second a logical pretest;\
    \ and the third some form of post-augmentation. Examples are\n\n```c\nwhile (c[i]\
    \ == ' ' && i < SIZE)\n    ++i;\ndo\n{\n    swap (c, i, j);\n    ++i;\n    --j;\n\
    }\nwhile (i < j);\n/* array c now reversed */\nfor (i = 0; i < SIZE; ++i)\n{\n\
    \    a[i] = b[i];\n    c[i] = -1.0;\n}\n/* array b copied to a and c set to -1.0\
    \ */\n```\n\nIf the logical-expr in a for statement is missing, a constant “true”\
    \ value (1) is assumed.\n"
  mdcn: "\n## 2. 初始化器\n\n这里 cmat 已被声明为具有 parts matrix 和 tag 的结构类型变量。因此，其初始化器的一般形式为\n\
    \n```c\n{ initializer-for-matrix, char-constant }\n```\n\n由于 matrix 是 COMPLEX\
    \ 类型的数组，其初始化器的形式为\n\n```c\n{ initializer-for-row-0,\n  initializer-for-row-1\n\
    }\n```\n\n等等。最后，每个 COMPLEX 结构的初始化器形式为\n\n```c\n{ initializer-for-real-part, initializer-for-imag-part\
    \ }\n```\n\n等等，cmat 的完整初始化器由一系列逐步细化得出。注意 cmat.matrix 的第一行的第一个元素并未显式初始化。在外部声明的情况下，默认情况下它将为\
    \ {0.0, 0.0}。\n\n如果为联合指定了初始化器，它必须对应于声明的第一个部分。联合和结构都不能在自动声明中初始化。\n\n### 2.6 函数定义\n\
    \n函数定义看起来有点像被初始化的数据声明——因此在本节中讨论它。事实上，参数和函数体构成了与函数名关联的值，因此它们确实起着类似于初始化器的作用，只是函数名代表常量（不可更改）值，而不是变量。函数指针类型的变量可能会改变其归属，但函数不会！\n\
    \n函数定义的语法是\n\n```c\nfunction-definition ::= { extern | static }opt\ntype-specifier\
    \ opt declarator ( argument-list opt )\nargument-declaration-list opt\ncompound-statement\n\
    ```\n\n复合语句最简单的形式是被大括号括起来的语句序列（命令式命令）。下面是一个完整的函数定义：\n\n```c\ndouble length(x,\
    \ y)\ndouble x, y;\n{\n    return sqrt(x * x + y * y);\n}\n```\n\n名称 x 和 y 是函数\
    \ length 的形式参数，它们表现得像特殊变量，每次调用函数时都会初始化为不同的值。因此，在参数规范中不允许有显式初始化器。length(0.0, p[2])\
    \ 的出现等价于 sqrt(0.0 * 0.0 + p[2] * p[2])。\n\n像 (*fpa())[] 这样的复杂函数声明符可以通过类型定义来避免，如\
    \ [1.7] 中所述，因此其解释将推迟到第 4 章。\n\n在详细检查复合语句之前，区分指针参数和其他参数是有启发性的。一个函数改变调用该函数的环境中某个变量\
    \ x 的值的唯一方法是将 x 的位置 &x 传递给它，其中相应的形式参数是指针类型。此外，聚合类型（struct、union 或 array）不能直接作为参数传递，但指向它们的指针可以。下一页所示的函数旨在用\
    \ value x 等于数组 table 的元素的第一个下标位置替换 index：\n\n```c\nfloat table[6] = {0, 0, 1,\
