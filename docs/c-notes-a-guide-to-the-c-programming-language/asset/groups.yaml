    以数字零 0 开头且仅由数字组成的字面量被视为 *八进制* 整数。数字八 8 被视为八进制 10，数字九 9 被视为八进制 11。字面量的长度为能够将其表示为正确值的
    *无符号* 数的最小实现类型。


    以数字零后跟 x 或 X 开头的字面量被视为 *十六进制* 整数。字符 a 到 f，或同样地 A 到 F，被视为十六进制数字，其值分别为十到十五。字面量的长度为能够将其表示为正确值的
    *无符号* 数的最小类型。


    以单引号 '' 开头的字面量被视为 *字符* 整数。所有字符，包括空白，直到下一个单引号都被视为字面字符，用来定义整数的值。单个字符的长度为字符数据项的长度，其值等于目标机器上该字符的内部表示。附加字符按未指定的顺序连接，得到的长度是单个字符的适当倍数。


