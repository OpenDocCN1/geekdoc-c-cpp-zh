    \n函数可以在局部声明为无存储类，或声明为存储类 extern 或 static；任何其他声明都是非法的。缺少存储类时被视为 extern，而不是像所有其他局部声明那样视为\
    \ auto。如果函数未声明，则被视为返回整数的函数。如果它的任何参数未声明，则相应的实参遵循 [3.6] 中给出的默认强制转换规则。\n\n局部函数声明只是向编译器表明，局部上下文中的该名称意图（通过调用）指代一个同名的外部定义函数。\n\
