    \ [1.7].\n\n函数声明将在 [1.6] 中介绍，类型定义则在该章末尾的 [1.7] 中介绍。\n\n## 1.1 Integer declarations\n\
    \n## 1.1 整数声明\n\nAn external integer declaration is a data declaration with a\
    \ type specifier of the flavor integer type:\n\n外部整数声明是一种数据声明，其类型说明符为整数类型：\n\n\
    ```\ninteger-type =\n  { char | unsigned | short | long }_opt int_def\n```\n\n\
