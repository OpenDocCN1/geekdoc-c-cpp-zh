    \ is\n\n```\nstruct {COMPLEX matrix[2][2]; char tag;}\ncmat =\n{/* first the matrix\
    \ */\n{\n{[-1, 0], [0, 1]}, /* row 0 */\n{[-3.2, 5.]}, /* row 1 */\n},\n/* then\
