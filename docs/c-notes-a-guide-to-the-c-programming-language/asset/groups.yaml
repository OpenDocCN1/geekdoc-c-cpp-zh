    - (1) 基本类型的硬件表示 [7.1, 7.2, 7.3]

    - (2) 基本类型上运算符的硬件实现 [7.1, 7.2]

    - (3) 八位字节中的 ASCII 七位字符 [7.1]

    - (4) 标识符长度的限制 [7.0]

    - (5) 外部或全局名称的处理及库约定 [7.0]

    - (6) 加宽、收窄和转换 [7.1, 7.2, 7.3, 7.6]

    - (7) 结构体和联合体的内存映射 [7.5]


