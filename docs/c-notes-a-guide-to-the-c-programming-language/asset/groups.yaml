  mdcn: "\n## 2：初始化器\n\n> *开头是如此危险的时期。*\n> \n> — 弗兰克·赫伯特，《沙丘》\n\n### 2.0 引言\n\n*初始化器*\
    \ 是一种方便的方式，可确保某些变量在程序执行开始时具有有意义的值，或构造常量表以辅助运行时计算。函数声明构成了大多数 C 程序的核心，也可以看作是对类型为函数的对象的初始化器。\n\
    \n数据初始化器的语法是\n\n```\ninitializable-declarator =\n  declarator initializer_opt\n\
    \ninitializer =\n  =_opt { expr | { initializer-list } , }_opt\n```\n\n注意尾随逗号被明确允许，以简化长列表的书写。一个非常简单的\
    \ *initializable-declarator* 是\n\n```\ndouble x = -0.2E3;\n```\n\n而在下面的声明中：\n\n\
    ```\nCOMPLEX vector[3] =\n  {{0, 1}, {-3.14, 2.718}, {0.3, 4.1E-13}};\n```\n\n\
    存在一个复杂的初始化器，它由三个初始化器的列表组成，每个初始化器对应于三个 COMPLEX 数组的一个元素。列表中的这三个初始化器本身又是 **COMPLEX**\
    \ 结构体的两个部分初始化器的列表。参见 [1.7] 中对名为 **COMPLEX** 的类型的定义。\n\n在外部声明中出现的任何初始化器都必须是常量表达式，但这可能包括像这样的指针表达式\n\
    \n```c\n&c[2].real\n```\n\n其中 c 已被声明为 **COMPLEX** 的静态数组。& 运算符给出变量 c[2].real 的位置，该位置可在编译时计算。此表达式的类型为指向\
    \ float 的指针，可能出现在声明中\n\n```c\nstatic float *fptr = &c[2].real;\n```\n\n局部声明中的初始化器（参见第\
    \ 4 章）必须只涉及可在包含声明的复合语句入口处计算的表达式。外部变量不得在局部声明中初始化。\n\n初始化器中的常量有效地赋给相应的变量，尽管并非所有在赋值中允许的类型转换都会执行（参见\
    \ [3.1]）。例如，在 vector 的上述初始化器中，变量 vector[0].real 和 vector[0].imag 由指定的整数常量 0 和\
    \ 1 的浮点等价物 0.0 和 1.0 初始化。另一方面，用浮点字面量初始化整数通常不受支持。\n\n外部名称不得被初始化多次，尽管在程序文件之间允许甚至需要多次声明，以便提供程序文件间的通信。\n\
    \n某些实现要求每个外部声明必须恰好初始化一次，以确定对象的定义实例；其他实现至少要求其中一个声明使用 extern 关键字，而另一些实现通常会接受缺少任何初始化器的情况。最安全的做法似乎是挑选一个被多次声明的变量的一个实例作为定义实例；显式地赋予它\
    \ extern 属性，并赋予它一个初始化器，即使它只是 0。\n\n### 2.1 整数初始化器\n\n*整数初始化器* 有以下简单形式之一\n\n```\n\
    \    =opt { expr }\n```\n\n其中 *expr* 的类型为整数或字符，并且对于静态或外部初始化器是常量。例如，\n\n```\n \
    \   static int number = 2 + 3, k = 'A'\n```\n\n使得 **number** 的初始值为 5，而 *k* 的初始值为字符常量\
    \ 'A' 扩展为整数类型后的结果（参见 [3.1]）。\n\n如果表达式的值太大而无法正确表示，则会在左侧截断——不会发出警告。一般不允许使用浮点字面量作为整数初始化器。\n\
    \n### 2.2 浮点初始化器\n\n*浮点初始化器* 有以下形式之一\n\n```\n    =opt { expr }\n```\n\n其中 *expr*\
    \ 的类型为浮点，或可以扩展为浮点。静态或外部声明的初始化器必须求值为常量，就像整数一样；但编译器只执行整数运算，因此 2 × 3.142 是不允许的。浮点字面量初始化器中唯一允许的运算符是单目减号。\n\
    \n有效的浮点初始化器的示例是\n\n```\n    float x = 0.23E-5, y = 2 * 3, z = '0';\n```\n\n请注意，*z*\
    \ 将被初始化为字符零的内部字符代码（机器相关）的整数的浮点表示。如果在浮点字面量中指定了过多的精度，或该值无法在目标机器中正确表示，编译器通常不会抱怨。\n\
    \n### 2.3 指针初始化器\n\n指针初始化器有以下形式之一\n\n= { expr }\n\n其中 expr 是指针类型的表达式，并且在静态或外部声明的情况下可在编译时计算。一般来说，这意味着表达式必须简化为整数或先前声明变量的地址，再加上或减去一个整数。一些示例是\n\
    \n```\nCOMPLEX vector[4];\nfloat *fptr = &vector[2].imag;\n```\n\n表达式 &vector[2].imag\
    \ 是指向浮点的指针表达式，因为 vector[2].imag 是一个名称表达式，表示数组 vector 的第三个元素的 imag 部分，而 & 运算符给出命名变量的位置。由于\
    \ 2 是常量且 imag 在 vector[2] 内的偏移是固定的，因此指针值在编译时已知。以下指针表达式也允许：\n\n```\nint k[5];\n\
    int *iptr = &k[1] + 2, *jptr = &k[4] - 1;\n```\n\n表达式 &k[1] 和 &k[4] 的类型为指向 int\
    \ 的指针，且 ptr ± 被允许作为指针表达式（参见 [3.3]），因此这些初始化器是常量指向整数的指针。\n\n每当出现未下标的数组名、函数名、字符串常量、结构名、联合名或无参数的函数名时，它们都被解释为指针。因此以下也是有效的初始化器：\n\
    \n```\nint (*p)() = distance;\nchar *pch = \"what?\";\nfloat vector[10], *fptr\
    \ = vector;\n```\n\n允许将指针初始化为指向未声明的标识符，但这种做法不推荐。同样，指针可以初始化为整数值，但这种做法对于零以外的所有值都极度依赖机器，应保留用于编写系统代码。\n\
    \n### 2.4 数组初始化器\n\n数组初始化器的形式为\n\n```\n= expr | { initializer-list , opt }\n```\n\
    \n其中 expr 仅初始化第一个元素，或其中 initializer-list 中的每个初始化器都是数组元素的适当初始化器。例如，\n\n```\nfloat\
    \ x[4] = {0.0, 1.0, 3E-6, -1};\n```\n\n是正确的，因为 0.0 是浮点常量且 x[0] 是数组 x 中的浮点变量，等等。当数组的元素本身是数组时，初始化器必须用括号括起的初始化器列表，如下所示：\n\
    \n```\nchar page[3][5] = { \"xxxx\", {'y', ':', ':', 'y', '\\0'} }\n```\n\n这里字符串\
    \ \"xxxx\" 是初始化器列表 {'x', 'x', 'x', 'x', '\\0'} 的简写。page 的第一行（即 page[0]）被初始化为 \"\
    xxxx\"，第二行被初始化为 \"y..y\"，第三行默认被初始化为零（即 '\\0' 的一行），因为外部初始化器列表过早结束。请注意，大小为 4 的字符串需要\
    \ 5 的行大小，以包含终止的 '\\0'。\n\n初始化器\n\n```\nint matrix[3][3] = {{1}, {2,3}, {4}};\n\
    ```\n\n按指定将 matrix[0][0] 初始化为 1，行 0 的其余部分默认初始化为 0；matrix[1][0] 设为 2，matrix[1][1]\
    \ 设为 3，matrix[1][2] 设为 0；最后，matrix[2][0] 设为 4，行的其余部分设为 0。\n\n在满足所有初始化器都存在且所有数组大小都已指定的前提下，可以省略内部大括号。以下初始化器虽然不推荐，但与上面具有相同的效果：\n\
    \n```\nint matrix[3][3] = {1, 0, 0, 2, 3, 0, 4, 0, 0};\n```\n\n此外，外层数组的大小可以由初始化器列表的大小隐式给出，如\n\
    \n```\nfloat vector[] = {0.1, 0.2, 0.3, 0.4};\n```\n\n这与 vector[4] 的相同声明相同。应仅使最左边的数组大小规范为空，如\n\
    \n```\nint matrix[][3] = {{1}, {2, 3}, {4}};\n```\n\n这再次等同于上述内容。自动数组不得初始化；必须在函数体中进行单独的标量赋值。\n\
    \n### 2.5 结构初始化器\n\n结构初始化器与数组初始化器类似，具有以下形式：\n\n```\n= _opt_ expr | { initializer-list\
    \ , _opt_ }\n```\n\n其中 expr 仅初始化第一个元素，或其中列表中的每个初始化器按顺序必须是结构对应部分的<|message|> 有效初始化器；各部分按结构声明给出的顺序排列。例如，\n\
    \n```\nstruct node {int degree; char name[5];\nfloat weight; struct node *next;};\n\
    \nstruct node first_node =\n{2, \"Node\", 3.7E4, &other_node};\n```\n\n这些声明使 first_node\
    \ 成为 struct node 类型的变量并初始化各部分，如下所示：\n\n| first_node.degree | 是 | 2 |\n|---|---|---|\n\
    | first_node.name | 是 | \"Node\" or {'N','o','d','e','\\0'} |\n| first_node.weight\
    \ | 是 | 3.7E4 |\n| first_node.next | 指向 | other_node |\n\n一个更复杂的示例是\n\n```\nstruct\
    \ {COMPLEX matrix[2][2]; char tag;}\ncmat =\n{/* first the matrix */\n{\n{[-1,\
    \ 0], [0, 1]}, /* row 0 */\n{[-3.2, 5.]}, /* row 1 */\n},\n/* then the tag */\n\
    'M'\n};\n```\n"
