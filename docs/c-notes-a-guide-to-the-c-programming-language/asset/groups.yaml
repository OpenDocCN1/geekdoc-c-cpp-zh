  - '[PAGE 14]


    The types can be classified as *fundamental* (integer and floating) versus *derived*
    (pointer, array, structure, union, function), or as *scalar* (fundamental plus
    pointer) versus *composite* (array, structure, union, function).


    A summary of the types will be given in [0.7].


    # 0.1 Integers


    *Integers* are the workhorses of a C program. They are used for counting, for
    selecting elements of an array, for representing characters of text, logical values,
    and bit sequences, and for any arithmetic where the magnitude range is known to
    be limited and fractional results are not needed. It is no surprise that integers
    are implemented in a wide variety of ways.


    The basic integer can be represented as a binary datum, although there is no presumption
    in the language about whether arithmetic is performed in one’s complement, two’s
    complement, signed magnitude, or some more exotic encoding. Integers in C always
    will be at least as big as are addresses on the target machine; they can be used
    unreservedly as subscripts or pointer modifiers.


    Short integers can be used, in the hope of achieving storage economy, for counting
    things in the thousands. There is no guarantee, however, that a short integer
    actually will be any shorter than a basic integer. Similarly, long integers are
    used for counting things in the hundreds of millions; they also may be no longer
    than basic integers.


    Unsigned integers are typically the same size as basic integers and behave much
    the same in arithmetic, except that their values are always taken as zero or positive.
    On two’s complement computers, this has the net effect of treating the sign bit
    as just another magnitude bit. Their primary use is not so much to double the
    range of counting with positive numbers as to permit arithmetic that is compatible
    with the treatment of addresses on machines where an address fills up an integer-sized
    word.'
  - '[PAGE 15]


    Finally, C provides a *character* type that is guaranteed to be large enough to
    hold any element of the machine''s character set. Characters behave like very
    small integers when used in arithmetic expressions, but there is no guarantee
    that negative numbers will survive conversion to character and back to integer,
    no matter how small they are. It can be safely assumed that the printing characters
    behave like small positive numbers.


    This discussion so far has been evasive about actual data sizes, and intentionally
    so. C does know about *bytes*, in the usual machine sense, and even about *bits*
    to a much lesser extent. The point is, considerable variation is permitted in
    implementation sizes, so that C can be made to perform efficiently on an Intel
    8080 or an IBM 370. All that is really promised has been summarized in the paragraphs
    above.


    Most modern computers have eight-bit *bytes*, support data types that are multiples
    of *bytes*, and perform integer arithmetic in two''s complement. On such machines,
    one can reliably expect characters to fit in one byte and integers in two to four.
    Thus, a character may hold numbers in the range −128 to +127, or perhaps 0 to
    255; two-byte integers are −32,768 to +32,767 signed, or 0 to 65,535 unsigned;
    and four-byte integers are −2,147,483,648 to +2,147,483,647 signed or 0 to 4,294,967,295
    unsigned. The size of addresses, in *bytes*, will give a good indication of whether
    basic integers are on the short or long side of that range. It is perfectly legal,
    of course, for *all* integers, to be four bytes long.


    A good program will be written with the fewest wired-in assumptions about the
    nature of the target machine, so as to maximize portability and to minimize mysterious
    constants. To aid in portability, C provides a mechanism for determining the size
    of any data type, expressed in *bytes*, so that the code can be properly parameterized.
    The sizeof operator is described in [3.1].


    Integer literals may be expressed several different ways. Each implies by its
    form and value some minimum length, in *bytes*, which may affect how it is used
    in expressions, although an implementation may use a longer version than is required.'
