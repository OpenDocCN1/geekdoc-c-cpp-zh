    # 3.0 Introduction


    The expressions of C actually carry out the work (change of state of variables)
    of the program. In particular, a simple assignment replaces the current value
    of some variable by a newly calculated value and has the syntax


    ```

    variable-name-expr = expr

    ```


    The variable-name-exprs range in degree of complexity from simple identifiers
    of integer variables to complicated name expressions like


    ```

    pcm -> matrix[1][k].imag

    ```


    which identifies the imag part of the complex member at row 1 and column k of
    the matrix part of the structure pointed at by pointer variable pcm. The remainder
    of this chapter will explain such expressions.


    The expressions themselves are a wider class allowing many different operators
    to be combined with variable-name-exprs and constants and so provide the computational
    power of the'
  - '[PAGE 57]


    language. These expressions range in complexity from simple integer constants
    up to things like

    (mlk +2) > >3) | (p -> f * (*pfune)(2,j))

    which defies simple verbal description.


    Before embarking on our extended voyage through operator-space, there are several
    topics of general interest that should be discussed at least briefly. The first
    is precedence and association of operators.


    Whenever the sequence

    operand1 binop1 operand2 binop2 operand3

    occurs (e.g., a + b * c), there is a potential ambiguity in the interpretation
    of the expression [e.g., (a + b) * c or a + (b * c)]. Each operator in C has a
    precedence-level, relative to other operators, which determines the association
    unambiguously if the two operators are at different levels. Since the multiply
    operator * has a higher level than the add operator +, the expression a + b *
    c means a + (b * c). By use of parentheses the programmer can override these rules
    [e.g., by writing (a + b) * c].


    Within the same precedence-level, most binary operators will associate "left to
    right." For example,

    a + b - c + d means ((a + b) - c) + d


    The assignment operator, however, does just the opposite:

    x = a[2] = j = 0 means x = (a[2] = (j = 0))


    The unary operators are all at the same level and higher than all binary operators.
    They associate from right to left as one would expect since they are mostly in
    prefix position. For example,

    -*pi

    means the negative of the integer pointed to by pi. In most cases, the language
    does not prescribe the order of evaluation of subexpressions, so that a * b +
    c * d may be calculated by doing (a * b) first, then (c * d), or vice versa. This
    has definite significance for expressions like

    (t = f(a)) + g(t)

    whose value is not guaranteed to be computed reproducibly. The programmer is warned
    to be careful in the use of assignment expressions within calculations. The language
    also allows the im-'
