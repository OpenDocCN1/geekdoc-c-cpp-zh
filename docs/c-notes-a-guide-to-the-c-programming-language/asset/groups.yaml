    an array, just as there is no limit to the length of a chain of pointers. An array
    of arrays of pointers to arrays of integers is quite acceptable.


    An array also is characterized by its starting address and by the number of elements
    it contains, that is, its multiplicity. The former is determined by its storage
    class, and must have a value that is legal for pointers to objects of the same
    type as the elements of the array. In this sense, an array starting address can
    be considered a literal pointer.


    C has no provision for variable-length arrays, although a program is of course
    at liberty to use less than the full multiplicity of elements in an array. This
    means that in many contexts the number of elements must be determined before an
    array can be referred to, and that there is no information stored with an array
    other than the current values of all its elements. Some latitude is permitted
    in determining the multiplicity, so that the compiler often can be made to count
    up things itself instead of burdening the programmer. It is illegal for an array
    to have a multiplicity of zero.


    An array with undetermined multiplicity is not “an object of known size” and hence
    may not be composed into other arrays or used in one or two other contexts. It
    also is not permissible to form an array of functions, or of structures whose
    contents are not determined.


    There are one kind of literal array. A literal that begins with a double quote,
    ", is taken as a character string, or array of characters. All characters following
    the double quote, including whitespace, up to the next double quote are taken
    as character integers that define succeeding elements of an array of characters.
    A null character, \0, is appended to every string, so that a character string
    always has a multiplicity of at least one, as in "", which is the null string.


    The same escape sequences defined for character integers in [0..1] and [0..7]
    are usable inside strings. In particular, \" is a literal double quote, \\ is
    a literal backslash, and \ newline continues the string on the next line. The
    style rules pertaining to character integers also should be applied.'
