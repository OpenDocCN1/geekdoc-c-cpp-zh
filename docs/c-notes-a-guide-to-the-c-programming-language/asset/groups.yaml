    \ lives on */\n    ...\n}\n```\n\n具有 automatic 或 register 属性且未初始化的变量在复合语句执行开始时将具有未定义值（即垃圾值）。这与\
    \ static 或外部声明的变量形成对比，后者的默认初始化为零。\n\n重新声明一个名称是合法的，该名称在复合语句中是局部的，而该名称已因外部声明符（在封闭复合语句中的声明）而具有声明的含义。在整个内部上下文（复合语句）中，该名称将具有更局部的声明含义，而在此内部上下文之后，其含义将恢复为更全局的含义。以下示例展示了其工作原理：\n\
    \n```\nint n;\nfloat x;\nmain ()\n{\n    if (n > 0)          /* global n */\n\
    \    {\n        char x = 'A';\n        printf(\"%c\", x);   /* local x char */\n\
    \    }\n    x = -1.0 / 2.5;      /* global x float */\n}\nff(int n;)         \
    \   /* argument is implicit local */\n{\n    printf(\"%d\", n);   /* not the global\
    \ n */\n}\n```\n\n请注意，形式参数名称构成隐式局部声明。\n\n用于局部声明的 automatic 或 register 变量初始化器的表达式应仅包括当前已声明并具有值的变量。在定义函数体的复合语句内，参数可被视为具有已定义的值，因此可用于初始化函数体的局部变量。例如，\n\
    \n```\nfloat z = 1.0;\nwhat(int a; char b;)\n{\n    float x = a/z;\n    int q\
    \ = b&0377;\n    float *fptr = &z;\n    ...\n}\n```\n\n经特别许可，函数的形参可以赋予 register\
    \ 存储类。这并不意味着相应的参数必然以快速寄存器传递，而是在进入函数时，如果有可用寄存器，则将其复制到其中以供后续使用。与 register 存储类的所有使用一样，这应被视为对编译器的建议，以帮助其更好地优化代码。如果没有足够的（或没有）寄存器可供分配，它永远不会导致诊断信息。\n\
    \nRegister 变量的行为与任何 automatic 变量类似，只是不能取寄存器的地址；这意味着它们不能与一元 & 或二元 . 运算符一起使用，并且不能保存复合项（数组、结构体、联合体、函数）。\n\
    \n### 4.1 局部整数变量\n\n整数变量可以用 auto、register、static 或 extern 中的任何一种存储类进行局部声明。前两种可以用在进入复合语句时已定义并且可以赋给整数变量的任何表达式进行初始化。static\
    \ 局部变量遵循与外部声明相同的规则 [2.1]；extern 不能被初始化。\n\n### 4.2 局部浮点变量\n\n浮点变量可以用 auto、register、static\
    \ 或 extern 中的任何一种存储类进行局部声明。前两种可以用在进入复合语句时已定义并且可以赋给浮点变量的任何表达式进行初始化。static 局部变量遵循与外部声明相同的规则\
    \ [2.2]；extern 不能被初始化。\n\n### 4.3 局部指针变量\n\n指针变量可以用 auto、register、static 或 extern\
    \ 中的任何一种存储类进行局部声明。前两种可以用在进入复合语句时已定义并且可以赋给整数\n"
