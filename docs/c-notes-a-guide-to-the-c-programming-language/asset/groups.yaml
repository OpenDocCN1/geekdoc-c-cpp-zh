    +   (8) order of evaluation [7.0, 7.6]

    +   (9) arithmetic overflow and underflow [7.1, 7.2]

    +   (10) defaults [7.1, 7.6]

    +   (11) run-time environment; use of stack and frames; machine register usage;
    arguments and returns [7.1]

    +   (12) treatment of the register attribute [7.0, 7.6]


    One of the dependencies that users should be aware of from the start deals with
    external names: External names will be truncated to their first six characters
    (seven under UNIX), so they should differ one from another in the truncated form.
    Under RSX-11M, external names are presented to the loader with the underscore
    ''_'' replaced by '':''. Internal names are significant to 127 characters. Run-time
    support routines typically have a "c." prefix so that they cannot be called explicitly.


    The compiler does exploit its freedom to chose the evaluation order of subexpressions
    except where the language defines the order. See [7.6] for the order of evaluation
    of arguments.


    Within each function, up to three 16-bit registers are available to store integer
    values (long int needs two) and two 64-bit floating registers to store floating
    values. These registers can be commandeered by the register attribute in local
    declarations.


    # 7.1 Binary integers


    Characters are eight-bit two''s complement binary integers, but the normal character
    set is the ASCII set of unsigned seven-bit values. The ASCII character set with
    hexadecimal equivalents and escape characters for often-used non-graphics is given
    by Table 7A. The collating sequence for ASCII corresponds to reading the columns
    left to right, and downward in each column. Each column identifier represents
    the first hexadecimal digit, while each row identifier represents the second.
    Boldface characters represent graphic (i.e., printable) characters which, in C
    programs, are enclosed between single-quote symbols. For example, the capital
    letter zee is written ''Z'' and represented as the eight-bit integer whose hex
    form is 0x5A.'
