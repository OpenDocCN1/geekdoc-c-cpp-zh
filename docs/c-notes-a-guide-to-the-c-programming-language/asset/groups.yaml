    is the difference between two pointers divided by the size of int. Hence, the
    value is 2. If the two pointers do not point into the same array, bizarre results
    may occur. See [3.3] for details of pointer-exprs.


    There also are integer constants of the form


    ```

    sizeof ( expr ) ( type-expr )

    ```


    which deliver the size in bytes of the operand expr or of the type designated
    by the cast ( type-expr ). The function sizeof applied to an array-variable-name
    or string yields the size of the entire array, as one would expect.


    Finally, among the integer expressions are to be found the very important logical-exprs,
    whose syntax is


    ```

    logical-expr =

    { logical-expr && logical-expr

    | logical-expr || logical-expr

    | ! logical-expr

    | expr { == | != } expr

    expr { < | > | <= | >= } expr

    | expr interpreted as (expr != 0)

    | ( logical-expr )

    }

    ```


    The logical AND &&, logical OR ||, and logical NOT ! operators are defined as
    equivalent to certain conditional-exprs, as follows:


    a && b ≡ a ? ( b ? 1 : 0 ) : 0

    a || b ≡ a ? 1 : ( b ? 1 : 0 )

    ! a ≡ a ? 0 : 1


    The result of these operators is always 0 or 1; therefore, an integer variable
    holding values generated by these operators can act as a boolean or logical variable.
    This is so because an integer expression encountered in the context of a test
    is interpreted as "true" when nonzero, and "false" otherwise. Notice that the
    && and || determine an order of evaluation inherited from the meaning of the conditional-expr.
    Basically, they guarantee left to right evaluation with termination occurring
    as soon as the value is determined.'
  - '[PAGE 63]


    The equality operators (equal == and not equal !=) as well as relational operators
    (less <, greater >, less or equal <=, greater or equal >=) yield 1 if the inequality
    is "true," and 0 otherwise. If one operand is narrower than the other, it is widened
    appropriately before the comparison.


    A cast expression of the form


    (int) arithmetic-expr


    gives the same integer value as would be obtained by assigning the arithmetic-expr
