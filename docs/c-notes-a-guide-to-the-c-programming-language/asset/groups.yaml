    \ and may be used in calculations or may be assigned a new value.\n\nAlthough\
    \ usually not of interest to the programmer, the subscript notation obeys the\
    \ equivalence\n\n```\na[e] ≡ *((a) + (e))\n```\n\nwhere the array name a without\
    \ subscript is taken to be equivalent to &a[0], a pointer to the first element\
