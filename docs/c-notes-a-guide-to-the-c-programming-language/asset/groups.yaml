  mdcn: "\n也就是说，一个用 C 语言编写的程序，它读取用 C 语言编写的程序并输出汇编语言语句来实现源代码的意图。汇编器将这些语句翻译成目标模块，即一组指令提供给装载器，装载器实际构造可执行程序。装载器可能会将目标模块与其他单独编译和/或汇编的模块组合起来，并且它可以利用运行时支持例程库来完成程序。C\
    \ 编译器施加的许多武断限制，仅仅反映了大多数汇编器和/或装载器的共同不足。\n\nC 程序是一组一个或多个文本文件——每个文件可以是，例如，纸带或卡片组或用文本编辑器准备的在线文件。它由任意长度的行组成，每行都以一个特殊字符代码结尾，称为换行符（ASCII\
    \ linefeed）。如果需要，运行时环境会将标准文本文件翻译成编译器的这种内部格式，以便在不同的操作系统和机器上以统一的方式实现行的概念。例如，一张卡片映像可能会变成\
    \ 81 个字符的行，其中包括终止的换行符。\n\n这里有一个不无道理的 C 程序：\n\n```\n/* copy input to output\n*/\n\
    main()\n{\n    int c;\n    c = getchar();\n    while (c != -1)\n    {\n      \
    \  putchar(c);\n        c = getchar();\n    }\n}\n```\n\n这声明 main 为一个函数，无参数调用，其主体是花括号内的文本。主体声明\
    \ c 为仅函数内部已知的整型变量，并包含若干可执行语句，这些语句反复调用其他函数 getchar 和 putchar，直到 c 被赋值为 -1。事实证明，这些其他函数在运行时库中可用（参见\
    \ [6.01]）；除此之外它们并没有什么神奇之处。\n\n显然，需要更多的解释，但这必须分散在几章中。目前，重点必须放在 C 程序的构建块上，它是如何表达的，以及它处理的基本数据。在最低层，它由各种标识符或名称组成，穿插着字面量、标点符号和空白字符，例如空格和制表符。\n\
    \nC 程序使用完整的 94 个可打印 ASCII 字符集编写（参见 [7.1]）。可打印字符的连续字符串根据各种词法规则被归并为标记。所有不可打印字符，包括换行符，都是空白字符，用于分隔可能否则会被合并在一起的相邻标记。还有注释，即以\
    \ /* 开始并以 */ 结束的任意字符字符串，其行为与空白字符非常相似。尽管语言对空白字符或注释的使用施加了很少的限制，但必须谨慎且统一地使用两者，以使源代码尽可能易读。\n\
    \n标识符是字母、数字和下划线字符 _ 的任意长度字符串，以字母或下划线字符开头。前一页所示的 C 程序包含标识符 main、int、c、getchar、while\
    \ 和 putchar。由装载器使用的名称（参见 [7.0]）必须在前五个左右字符上有所不同（取决于特定的装载器）才能区分；内部使用的名称必须在前八个字符上有所不同。有些装载器拒绝区分大写和小写字母。标识符通常由用户创建来命名数据项和函数。\n\
    \n某些标识符是预定义的关键字，每个关键字在语言中都有特殊含义；它们不得被重新定义。在上面的示例中，int 和 while 是关键字。关键字的完整列表可在\
    \ [0.7] 中找到。由于在完整 ASCII 中小写字母和大写字母是不同的，因此 INT 不是关键字，Int 也不是。支持仅大写设备的安装必须在输入到编译器时转换为小写，并在输出时可能转换回大写。\n\
    \n类型可以分为 *基本*（整数和浮点）与 *派生*（指针、数组、结构体、联合、函数），或 *标量*（基本类型加指针）与 *复合*（数组、结构体、联合、函数）。\n\
    \n类型摘要将在 [0.7] 中给出。\n\n## 0.1 整数\n\n*整数* 是 C 程序的主力。它们用于计数，用于选择数组元素，用于表示文本字符、逻辑值和位序列，以及任何在幅度范围已知有限且不需要分数结果的算术运算。整数以多种方式实现也就不足为奇了。\n\
    \n基本整数可以表示为二进制数据，尽管语言中并没有关于算术是采用一的补码、两的补码、符号幅度还是某种更奇特的编码的假设。C 中的整数始终至少与目标机器上的地址一样大；它们可以无限制地用作下标或指针修饰符。\n\
    \n短整数可以用于计数数千的事物，以期实现存储经济性。然而，并不能保证短整数实际上会比基本整数更短。同样，长整数用于计数数亿的事物；它们也可能不比基本整数更长。\n\
    \n无符号整数通常与基本整数大小相同，在算术上行为也基本相同，只是它们的值始终被视为零或正数。在两的补码计算机上，这相当于将符号位视为另一个幅度位。它们的主要用途与其说是为了用正数加倍计数范围，不如说是为了允许与地址处理兼容的算术运算，在这些机器上地址占据一个整数大小的字。\n\
    \n最后，C 提供了一个 *字符* 类型，保证足够大以容纳机器字符集中的任何元素。字符在算术表达式中使用时表现得像非常小的整数，但不能保证负数在转换为字符再转换回整数时能够存活，无论它们有多小。可以安全地假设可打印字符表现得像小的正数。\n\
    \n到目前为止的讨论对实际数据大小避而不谈，而且是有意为之。C 确实知道 *字节*，按通常的机器意义，甚至在较小程度上知道 *位*。关键在于，允许实现大小有相当大的变化，以便\
    \ C 可以在 Intel 8080 或 IBM 370 上高效运行。所有真正承诺的内容都已在上面的段落中总结。\n\n大多数现代计算机具有八位 *字节*，支持\
    \ *字节* 的倍数数据类型，并在两的补码中执行整数算术。在这样的机器上，可以可靠地期望字符适合一个字节，整数适合两个到四个字节。因此，字符可能容纳范围为\
    \ −128 到 +127 的数字，或许 0 到 255；双字节整数为 −32,768 到 +32,767 有符号，或 0 到 65,535 无符号；四字节整数为\
    \ −2,147,483,648 到 +2,147,483,647 有符号，或 0 到 4,294,967,295 无符号。地址的大小，以 *字节* 计，将很好地表明基本整数是在该范围的短侧还是长侧。当然，*所有*\
    \ 整数都是四字节长是完全合法的。\n\n一个好的程序将尽可能少地对目标机器的性质做出硬性假设，以最大化可移植性并最小化神秘常量。为了帮助可移植性，C 提供了一种确定任何数据类型的大小的机制，以\
    \ *字节* 表示，以便代码能够正确参数化。sizeof 运算符在 [3.1] 中描述。\n\n整数字面量可以用几种不同的方式表示。每种形式和值都暗示了某种最小长度，以\
    \ *字节* 计，这可能会影响它在表达式中的使用方式，尽管实现可能使用比所需更长的版本。\n"
