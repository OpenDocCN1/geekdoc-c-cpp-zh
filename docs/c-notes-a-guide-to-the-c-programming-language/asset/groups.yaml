    所有非字符值至少占用两个字节，因此从字（两字节）边界开始。这仅意味着变量第一个字节的地址是偶数整数位置。字符可以从任何字节地址开始。


    ### 7.2 二进制浮点数


    类型为 float 或 short double 的值需要 32 位或四字节，分为一位符号、一个无符号八位指数和一个被抑制前导一位的无符号 23 位小数。指数以
    128 余码表示，这意味着 128 对应 2 的 0 次幂，129 对应 1，127 对应 -1，依此类推。这让指数的范围约为 10^-38 到 10^+38，精度约为六位十进制数字以上。类型为
    double 或 long float 的值具有无符号 55 位小数，精度约为 16 位十进制数字，指数形式和范围相同。


    浮点值的算术运算是 PDP-11 硬件支持的标准规范化浮点运算。运行时例程会小心地保持这种形式；例如，如果尾数为零，则整个数为零。


    从 float 加宽为 double 会保留值，int 或 char 加宽为 float 或 double 也是如此。如果 long int 的值超过 24
    位，从 long int 加宽为 float 可能会丢失重要的数值信息。从 long int 转换为 double 始终保留正确的值。


    从 double 收窄为 float 会丢失小数部分的最低有效位。根据指令集选项的不同，可能会或不会进行舍入。与整数算术的情况一样，不执行溢出或下溢检查。浮点值需要两字节边界。


    假定在进入任何 C 函数时，FPP 的算术模式是 double（而非 float）和 int（而非 long）。这些模式设置会在从 C 函数退出时保留。在带有浮点选项的
    11/40 和 LSI-11 上，浮点算术由硬件指令执行（参见 [7.6]）。所有涉及的算术选项均由对运行时例程的内联调用支持。


