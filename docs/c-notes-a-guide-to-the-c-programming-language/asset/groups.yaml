  mdcn: "\n访问数据项之间的链接。C 语言的数组、结构体、联合体和指针正是这样做的。\n\n除了前面讨论的主要问题外，程序通过具有可维护性、可移植性和高效性而获益良多。C\
    \ 语言中的程序可以通过使用定义的参数代替字面量、使用宏 [例如，swap (a,b)] 代替重复代码，以及通过定义常用数据类型（通过 typedef）来提高可维护性。由于\
    \ C 语言的大部分内容独立于机器和操作系统，C 程序可以具有很强的可移植性。最后，C 的基本数据类型和运算符在大多数机器上可以直接使用，从而能够生成相当高效的代码。\n\
    \n读者被鼓励将此摘要用作重新阅读 C Notes 的介绍——这次，将语言视为良好程序设计的工具并练习如何以这种方式使用它。\n\n## 索引\n\n- \
