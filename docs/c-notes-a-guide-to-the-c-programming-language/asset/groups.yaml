  md: "\nGlobally declared variables have a lifetime that endures for as long as the\
    \ main program executes regardless of their visibility attribute (external or\
    \ static).\n\nSections [1.1] through [1.5] deal with the various kinds of data-declarations,\
    \ so it is appropriate to introduce the formal syntax rules here:\n\n```\ndata-declaration\
    \ =\n  /extern_def/ | static_opt\n  type-specifier_opt initializable-declarator-list_opt\
    \ ;\n\ntype-specifier =\n  [ integer-type | floating-type\n  | type-name | structure-or-union-type\
    \ ]\n\ninitializable-declarator =\n  declarator initializer_opt\n```\n\nFunction-declarations\
    \ will be covered in [1.6], and type-definitions at the end of the chapter, in\
    \ [1.7].\n\n## 1.1 Integer declarations\n\nAn external integer declaration is\
    \ a data declaration with a type specifier of the flavor integer type:\n\n```\n\
    integer-type =\n  { char | unsigned | short | long }_opt int_def\n```\n\nand declarators\
    \ that are identifiers. The declaration\n\n```\nint number, smallest, largest;\n\
    ```\n\nmakes number, smallest, and largest the names of three integer variables,\
    \ which are externally visible by default. Any subsequent reference to one of\
    \ these names will deliver its current value or cause replacement of its current\
    \ value by a new value, depending on the context in which the name occurs.\n\n\
    These integer variables can participate as operands of integer operators, as described\
    \ in [3.1]. The various flavors of integer type were explained in [0.1].\n\nIf\
    \ any of the adjectives short, unsigned, or long is present, int is assumed and\
    \ may be omitted. In any context calling for an optional type specifier, the default\
    \ type is taken as int. It is good practice, however, to explicitly type all declarations.\n\
    \n## 1.2 Floating declarations\n\nAn external floating declaration is a data declaration\
    \ with a type specifier of the flavor floating type:\n\n```\nfloating-type = /\
    \ short | double | long | float /\n```\n\nand declarators which are identifiers.\
    \ For example,\n\n```\nstatic long float x;\nfloat y;\n```\n\nmakes x the name\
    \ of a floating variable of long precision, visible only in the enclosing program\
    \ file, and y an externally visible single-precision floating variable. They may\
    \ participate in expressions much as integers do, but with slightly different\
    \ meaning attached to the operators. The operators relevant to floating variables\
    \ are described in [3.2].\n\n## 1.3 Pointer declarations\n\nAn external pointer\
    \ declaration is a data declaration with any flavor of type specifier and a declarator\
    \ of the form\n\n```\n*declarator\n```\n\nFor example,\n\n```\nint *ptr_to_int;\n\
    struct item **ptr_to_item;\n```\n\ndeclares ptr_to_int as the name of a variable\
    \ of type pointer to integer and ptr_to_item as a variable of type pointer to\
    \ a struct item. The structured type struct item is a composite type whose definition\
    \ presumably occurs elsewhere, but note that the content of the structure need\
    \ not be known to declare a pointer to it.\n\nRecalling the earlier definition\
    \ of variable, the unique aspect of a pointer variable is that its class of admissible\
    \ values ranges over the locations (machine addresses) of other values of the\
    \ type to which the pointer variable is specified to point.\n\nThe use of these\
    \ variables will be described subsequently in several chapters.\n\n## 1.4 Array\
    \ declarations\n\nAn external *array declaration* is a data declaration with any\
    \ type specifier and a declarator of the form\n\n`identifier [ constant-expr_opt\
    \ ]`\n\nThe *constant-expr* must be a positive integer constant, calculable at\
    \ compile-time, and defines the multiplicity N of the array. The valid subscripts\
    \ range from 0 to N−1. For example,\n\n`float point_3d[3];`\n\ndeclares *point_3d*\
    \ as an array variable consisting of three subvariables *point_3d[0]*, *point_3d[1]*,\
    \ and *point_3d[2]* each of type *float*. The expressions *point_3d[2]*, *point_3d[1]*,\
    \ and *point_3d[0]* are *variable-name-exprs*, each of which refers to one of\
    \ the three floating variables making up the composite floating array variable\
    \ *point_3d*.\n\nThe *constant-expr* specifying array size may be omitted when\
    \ an initializer is present and the size is implied by the number of values supplied.\
    \ Initializers for arrays are discussed in [2.4]. It also is permissible to omit\
    \ the size when declaring the existence of an array that is defined elsewhere,\
    \ perhaps in another program file. It is possible to declare variables that are\
    \ arrays of arrays, and so on, as in\n\n`char page[50][80];`\n\nwhich makes *page*\
    \ the name of an array variable composed of 50 like variables of size 80 characters.\
    \ Then *page[0][0]* and *page[49][79]* denote the northwest and southeast corners,\
    \ respectively. When a declaration contains array of array, and so forth, only\
    \ the first size specification may be omitted, for otherwise the contained arrays\
    \ would not be objects of known size.\n\nThe character strings described in [0.4]\
    \ are literal arrays of characters and behave like *char* array names, except\
    \ when used as initializers of named *char* arrays. For example, the string \"\
    C-compiler\" really acts like the secret declaration `_string1` where `_string1`\
    \ has been predeclared by\n\n`static char _string1[] = \"C-compiler\";`\n\nThe\
    \ `_string1` implies that the name generated for the string is not specifiable\
    \ by the programmer, so there can be no conflicts with string names secretly created\
    \ by the compiler. See [2.4] for more on this.\n\n## 1.5 Structure or union declarations\n\
    \nAn external structure declaration is a data declaration with a type specifier\
    \ of the flavor structure or union type, which is given by the syntax\n\n```\n\
    structure-or-union-type =\n    / struct | union / tag_opt\n    parts-specification_opt\n\
    \nparts-specification =\n    { type-specifier\n      declarator-list ; }\n```\n\
    \nand a declarator that is a simple identifier. An example is\n\n```\nstruct point\
    \ { float x[2]; struct point *next; } first_point, last_point;\n```\n\nwhich declares\
    \ first_point and last_point to be variables of a structured type identified by\
    \ the tag point. The parts-specification enclosed in curly brackets defines a\
    \ struct point to consist of an array of two floating values named x and a pointer\
    \ to struct point named next. The variable first_point consists of two sub-variables\
    \ that are denoted first_point.x and first_point.next. The variable-name-expr\
    \ first_point.x names an array variable so first_point.x[1] names a float variable\
    \ within the x part of the structured variable first_point. The complete story\
    \ on variable-name-exprs must await Chapter 3.\n\nThe above declaration could\
    \ have been written in the form\n\n```\nstruct point {float x[2]; struct point\
    \ *next;} ;\nstruct point first_point, last_point;\n```\n\nThe first line serves\
    \ to define the content of the new type struct point but does not declare any\
    \ names as variables of this type. The second line declares two variables of the\
    \ new type. The structure tag point serves as an abbreviation for the content\
    \ described, as well as allowing self-referential pointers within a structure.\
    \ The parts-specification is only optional if the structure tag already has been\
    \ defined by a parts-specification in an earlier declaration. The structure tag\
    \ is optional only if a parts-specification is present.\n\nWhen the keyword union\
    \ is used instead of struct, the parts are made to overlay each other so that\
    \ variables of such a union type at any point in time are holding a value corresponding\
    \ to just one of the parts. For example,\n\n```\nunion { double d; float f[2];\
    \ } u;\n```\n\ndeclares u to be a variable whose value is at any instant either\
    \ double or an array of two floats. Sometimes, it is meaningful to say u.d and\
    \ sometimes u.f[1].\n\nIt is necessary to define some predicate, independent of\
    \ the union, to determine its current contents. Unions can be safely used as part\
    \ of a structure, one of whose parts is a small variable (char or short int),\
    \ identifying which variant is actually present. Each value of the union type\
    \ then is associated with a datum that tells which part names are appropriate\
    \ to use. An example is\n\n```\nstruct {\n  char vtag;\n  union {\n    double\
    \ d;\n    float f[2];\n    char str[4];\n  }\n  var;\n}\nu,v;\n```\n\nNow the\
    \ program can test if u.vtag is 1, say, before allowing any references to u.var.d,\
    \ and similarly check u.vtag against 3 before using u.var.str. Note, however,\
    \ that the language does not require such a tag variable to be associated with\
    \ a union; any form of predicate is acceptable.\n"
