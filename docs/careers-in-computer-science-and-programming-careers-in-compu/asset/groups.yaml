    ![](img/404b2534e7205427db1a74abc74a36b7_67_0.png)


    When working on-site, it is important to maintain a professional demeanor with
    clients, even when problems are hard to diagnose and people are difficult to deal
    with.'
  - '[PAGE 68]


    companies are more likely to respect—and promote—nememployees who look and act
    professional. What constitutes

    appropriate dress varies among computer professionals,

    depending on the nature of the company, the industry, and

    the position held.


    Those working for large companies and in positions

    where they come in contact with customers will most likely be

    expected to wear dress slacks with a shirt and tie if they are

    male, or an appropriate dress, skirt and jacket, or pants suit

    if they are female. For programmers who work strictly behind

    the, a decent pair of slacks and shirt or sweater is likely

    to be acceptable. However, if a person''s job involves contact

    with managers, especially senior managers, it''s crucial that he\or she be well-dressed.
    If management admires an employ-

    ee''s technical skill and thinks the employee is presentable,

    or or she is more likely to be considered for a more respon-

    sible position. Small companies, especially with only a

    few employees, are often more flexible in how they expect

    employees to dress. If an employee dresses casually on the job

    in such a firm, however, he or she needs to be aware of when

    customers, representatives from larger companies interested

    in working jointly with theirs, or even potential investors may

    visiting in order to dress appropriately and make a profess-

    sional impression.


    What''s not open to debate is the need to treat everyone

    around one professionally and with respect: managers, cus-

    tomers, coworkers, subordinates—whomever comes in

    contact with. Employees should behave honestly and respon-

    sibly on the job, and show up on time and get their part of

    the work done on schedule. They should demonstrate that'
  - '[PAGE 69]


    they can manage themselves and their work. If management sees an employee as reliable,
    they are more likely to advance that person to a position where he or she has
    greater responsibility.


    Above all, computer professionals should do the best work they are capable of
    doing. No matter what the job, employees should do the work they were hired to
    do. If a person feels that he or she can''t perform appropriately, the proper
    approach is to find another position. Behaving like a professional is the key
    to succeeding in any field.'
  - '[PAGE 70]


    # Glossary


    algorithm A set of steps for accomplishing a task.

    application A computer program that performs a single function, such as a word
    processing program.


    artificial intelligence The branch of computer science concerned with developing
    computer systems that can learn and make decisions.


    biometric identification system An electronic system that uses physical attributes
    for identification, such as palm prints or scans of the eye.


    curriculum A list of courses covered in an academic program.


    database A collection of computerized records or data.


    data mining Analyzing large volumes of data to find significant trends.


    drone An unmanned military vehicle used for scouting.


    e-commerce Business that is conducted over the Internet, such as the online sale
    of products and services.


    enterprise resource management The integration of all the computing resources
    of an organization in order to make information available to the entire company.


    facial recognition software A computer program that analyzes the shape of a person''s
    face and compares it to a database of photos for identification.


    innovation Coming up with new ideas or advances.


    integrated system A combination of devices connected to each other to form a system
    used for a particular purpose, such as security.'
  - '[PAGE 71]


    mobile device A computerized device designed to be carried in a purse or pocket
    that connects to electronic applications wirelessly.


    module A stand-alone part of a larger system or program.


    multimedia Content that combines different kinds of media, such as visual images
    and audio.


    network A group of interconnected computers.


    peripheral A device that attaches to a computer, such as a printer.


    photovoltaic panel A device containing solar cells, which convert sunlight into
    electricity.


    prototype A sample version of a product that is produced for testing and evaluation
    purposes.


    robotics The science of automating machines.


    server A powerful computer that provides data and services to networked computers.


    social networking site A Web site designed to allow people to interact with one
    another on a personal (as opposed to business) basis.


    streaming video Video that is continuously sent over the Internet to a computerized
    device.


    wireless communication Technology that connects electronic applications such as
    phone services, e-mail, and the Internet by signals sent through the air, rather
    than over electric wires.'
  - '[PAGE 72]


