    - Computer Science: This is a broad category in which a student learns about computer
    hardware technology and programming. Some programs of study focus on the theoretical
    side of computer science, while others focus more on programming. Students learning
    about computer science will study a wide range of computer hardware and software
    subjects. People with computer science degrees are often qualified to work in
