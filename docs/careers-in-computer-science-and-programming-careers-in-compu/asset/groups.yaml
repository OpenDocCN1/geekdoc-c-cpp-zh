    games, and more. Many of the major open source programs such as Ubuntu (an open
    source alternative to the Windows operating system) and the Firefox Web browser
    maintain links on'
  - '[PAGE 42]


    their sites to developers'' forums for those interested in participating in development
    and support.


    Individuals belonging to the open source community work on open source software
    projects alone or in groups, communicating with other members of the community
    via online forums devoted to a particular type of software. Online forums allow
    users to exchange ideas and help each other with questions and problems. Individual
    utilities and applications that can be used with the existing version of a program
    are often offered, free of charge, to the open source community by the person
    who created them.


    Another way to participate in the software community at large is through problem-solving
    forums. Almost every major manufacturer of software hosts community forums where
    users help each other resolve problems with commercial software, such as Windows
    or Adobe Flash. The same is true of some major online sites, such as YouTube,
    which host community help forums. In these forums, participants can use their
    knowledge to help others resolve problems.


    Participating in the larger community of programmers can provide a person with
    the opportunity to practice his or her software skills by working on real-world
    applications. Being part of a community also allows a person to know other professionals
    working in the areas he or she is interested in and gain recognition as someone
    who contributes to the community. Some organizations and companies even recognize
    individuals who make a significant contribution to helping others with their software.
    For example, Microsoft grants the Microsoft Most Valuable Player award to those
    who make a significant contribution to supporting their Microsoft software through
    technical forums.'
  - '[PAGE 43]


    # PARTICIPATING IN PROFESSIONAL ASSOCIATIONS


    Organizations such as the ACM and IEEE offer student memberships. Joining and
    participating in the activities of such an organization is a great way to demonstrate
    an interest in the field. Through its partnership with major software manufacturers,
    such as Microsoft Corporation and Sun Microsystems, the ACM can offer its student
    members access to more than one hundred software programs. These programs provide
    an enormous variety of tools for learning and building sample computer applications.
    The ACM even has a special newsletter for students.


    In addition, being a student member of an organization like the ACM or IEEE provides
    the opportunity to learn about various subdisciplines of the field. If a student
    wishes to work on a computer science or programming project, he or she will have
    expert contacts who can give advice. Further, students will be making contacts
    with professionals in the field who may be able to help them when it comes time
    to look for internships or employment. The IEEE maintains a student Web site that
    provides information on opportunities of interest to students.


    The ACM offers twenty stipends of $500 each to allow students to attend research
    conferences in computer science. Although these stipends are mostly aimed at college
    students, high school students are eligible to apply. If they can demonstrate
    sufficient interest in research and study in the field, they can qualify.'
  - '[PAGE 44]


    # CHAPTER 5

    Finding a Job


    At one time, people checked the newspaper want ads when they wanted to look for
    a job. Today, most companies in the software and computer industries rely on online,
    rather than print, advertising. Generally, only a small portion of available jobs
    are listed in newspaper ads. Simply looking through print ads is often the least
    effective way to find a job; the job seeker should look through other employment
    resources as well.


    Larger companies often use recruitment agencies, sometimes called “head hunters,”
    to locate employees. This is especially true for technical and managerial positions.
    One can look up recruitment agencies in the phone book or do a Yellow Pages search
    on a search engine such as Yahoo! or Google. However, the chances of getting a
    job through a recruitment agency are greater once a person has experience in the
    field.


    # JOB SEARCH STRATEGIES


    Many colleges and technical schools have a placement office that assists students
    with finding a job. In addition to helping students contact companies, the placement
    office often provides resources for writing résum and other job hunting tools.
    Many professional organizations have job hunting resources for their members,
    including online resources and newsletters that list job opportunities.'
  - '[PAGE 45]


    # CAREERS IN COMPUTER SCIENCE AND PROGRAMMING


    The first step to finding a good job is setting a concrete goal to aim for. It''s
    one thing to want to have a career in computer science or programming, but another
    to have a specific career path in mind. When beginning the process of job searching,
    identify companies that seem interesting or look like good places to work. These
    can be found by looking through an online industry directory, printed directories
    provided by industry associations, or general business directories such as Standard
    & Poor''s or the Dow Jones directories, which are available at many libraries.


    # PREPARING A RÉSUMÉ


    The most important tool for job hunting is a résumé. A résumé is a document that
    lists the applicant''s educational background, work experience, and other pertinent
    information. For instance, a job applicant might list the internships he or she
    completed on a résumé. The purpose of a résumé is to get an interview with prospective
    employers. Therefore, it should include information that shows that the applicant
    has skills not only in computer science and programming, but also in other areas
    that will make him or her a valuable candidate for the job.


    When crafting a résumé, it''s best to steer clear of trendy or unusual formats
    that might affect the résumé''s readability. Complicated designs can make it more
    difficult for an employer to locate information such as what jobs an applicant
    has held. Faced with going through enormous numbers of résumés in response to
    a job posting, employers are not likely to spend time hunting through a résumé
    for the information they want to know.'
- md: '

    # FINDING A JOB


    Applicants shouldn’t limit themselves to simply listing technical skills. They
    should think about the company’s industry and the job they are applying for. What
    nontechnical skills might a potential employer be looking for? Applicants should
    list skills or experience in areas such as sales, negotiating, running meetings,
    preparing multimedia presentations, and budget creation on their résumés.


    Applicants should be sure to not list their job responsibilities and duties when
    creating a résumé, but also detail their accomplishments. a résumé might include
    information such as: “Built pilot system to help train university staff and demonstrate
    feasibility of using the AVID product to fulfill the university’s needs,” or “Upgraded
    Big Brother/Big Sister computer system so that students would have access to streaming
    video to enhance effectiveness of after-school learning program.” When writing
    a résumé, the sentences describing the applicant’s accomplishments should be simple
    and direct, without excess words that might detract from the main point. Potential
    employers should understand that the applicant not only has technical skills,
    but also has a history of using these skills to accomplish projects.


    Applicants shouldn’t include irrelevant personal information on their résumés,
    but including relevant personal information can help an employer get a better
    idea of the applicant. For example, if a job applicant has previously volunteered
    with an environmental organization such as Greenpeace or the Sierra Club, he or
    she should mention that when applying for a job with a company working in alternative
    energy technology. Applicants who have honed their skills by donating their time
    and expertise to charitable organizations should mention that on their résumés.
    Many companies are increasingly interested in playing a meaningful role in their
    communities, and volunteering shows that an applicant is the kind of person who
    is willing to help others.


    Résumés should always be focused on specific jobs. We live in an age when the
    Internet provides easy access to information, so there is no excuse for applicants
    to not research the company they are applying to. Likewise, it''s easy to customize
    a résumé on the computer so that it states one is applying for the specific job
    a company is trying to fill and highlights the skills being advertised for, such
    as knowledge of particular programming languages or technologies.


    Above all else, applicants should make sure that their résumé is neat, professional
    looking, and thoroughly proof-read so that it does not contain mistakes. No company
    wants to hire a sloppy programmer.


    # NETWORKING


    The most successful way to find a job is often through networking with other people,
    rather than simply looking online or in print ads. When networking, a person can
    contact people he she knows in the field and ask them for assistance in locating
    a job. The majority of jobs are filled before they ever get listed in the newspaper
    or online. This is where developing contacts through interning, participating
    in the open source community and in problem-solving forums, and joining industry
    organizations can help get the word out that a person is looking for a job. When
    networking, be sure to get people''s contact information. This includes their
    name, e-mail address, and (if meeting someone in person) their business card.
    This way, they can be contacted during the job hunting process.


    ![](img/404b2534e7205427db1a74abc74a36b7_48_0.png)


    The MacWorld convention, seen here in 2009, is held annually by Apple to showcase
    the company’s latest products, as well as applications and products by other vendors.
    Even if they don''t know of a job opening, they may be able to provide the names
    of people who can help.


    # PRESENTING A PORTFOLIO


    Regardless of how an applicant locates job leads, experts agree that, in today''s
    competitive job market, having a portfolio of work to show potential employers
    is key to getting a job interview. As students work on projects in school or during
    summer jobs and internships, they should be sure to assemble examples of the work
    they have done.


    The latest trend in job hunting is the construction of electronic portfolios.
    Many people are now maintaining electronic portfolios online to assist potential
    employers in evaluating them. An electronic portfolio contains examples of a person''s
    work, which prospective employers can view, along with a sample of Web pages or
    applications on a CD or DVD in his or her portfolio. A résumé, along with a top-notch
    demo of a person''s work, can help an applicant land a job. Remember that any
    work presented in a portfolio must be of the best quality one is capable of producing.


    # WHERE TO LOOK FOR WORK


    A vast number of computer science and programming jobs exist in a wide range of
    industries. All these industries need computer scientists and programmers to build
    and maintain computer systems.


    # BUSINESS AND MANUFACTURING


    Computers and software are found everywhere in businesses. Accounting is done
    on computer systems for large and small businesses. Businesses use databases to
    maintain records, and keep track of sales and marketing information, such as data
    on clients. Databases are also used to analyze data about potential customers,
    target those most likely to buy the company''s products, and analyze the results
    of advertising campaigns.


    Many manufacturing businesses rely on database systems for inventory management.
    They track the receipt of goods and keep track of stock levels so that items can
    be reordered before supplies run out. Purchasing systems keep track of orders
    and match received goods to purchase orders. Sales systems are used to keep track
    of orders for finished products and shipping information.


    Programmers are often required to write custom database programs for businesses.
    These custom databases are designed to record the particular types of information
    a company needs to keep track of and analyze. In addition, programmers often have
    to write custom software that will integrate various types of software used by
    a company. For example, a company may need to exchange information between its
    order entry, finance, and sales and marketing departments. In this case, it would
    be necessary for a programmer to write software that converts each system''s data
    into a form that can be understood by the other systems. A programmer might come
    up with a way to have the inventory and purchasing systems “talk” to each other
    so that parts can be be reordered when the inventory level drops to a predefined
    point.


    # CAREERS IN COMPUTER SCIENCE AND PROGRAMMING


    Computer systems are used to control many manufacturing processes. Nearly all
    of today’s factory production lines are automated, or run by computers that control
    the machines creating the final product. Programmers are needed to write machine
    automation software for companies that manufactured equipment. They are also needed
    to write, alter, and maintain custom software that runs particular processes in
    a given manufacturing facility. There are a variety of computer science-related
    jobs on both the business and manufacturing sides of industry.


    # TRANSPORTATION


    Computers are used in every phase of transportation today. They are used by air
    traffic controllers to manage air flights and in aircraft to control the flight
    systems themselves. Programmers write the code used in trucks and trains to relay
    information about the location of vehicles and their cargo, allowing companies
    to track the progress of shipments and drivers. Programmers write code used by
    governments to monitor traffic patterns and assess issues related to traffic control.
    They also write code to model future transportation systems. For example, these
    programs model traffic patterns to establish what the best design for proposed
    highway systems would be. In addition, vehicle manufacturers employ computer science
    experts to develop the electronic components and code that control vehicles.


    Beyond earthbound transportation, programmers write the code used in aerospace
    applications to control spacecraft, such as space shuttles and operate satellites,
    and provide data-gathering and analysis functions at NASA.

    '
