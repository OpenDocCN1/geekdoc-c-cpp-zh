    A scientist at NASA who works on the Mars Rover team explains how images and data
    collected by NASA’s Spirit rover are used to create a virtual model of the red
    planet’s landscape.


    ![](img/404b2534e7205427db1a74abc74a36b7_52_0.png)


    ## SECURITY


    One of the fastest-growing areas of employment today is in security systems. Concerns
    about crime and terrorism have fueled an ever-increasing demand for integrated
    security systems. Integrated systems connect various devices to create a single
    system that performs a complex function, as providing security. An integrated
    security system might combine security elements such as video cameras and alarms
    with sophisticated computers that control the overall security system, store data,
    and then analyze it. These systems often include elements such as card locks record
    data on who enters specific areas and when. Programmers are required to write
    the programs that run and integrate these systems. They write special computer
    security programs, including biometric programs as facial recognition software.
    They also help create large databases that store information on dangerous people,
    such as known terrorists or criminals. Three types of security companies provide
    employment to programmers: the companies that manufacture the systems, the companies
    that maintain the systems and staff them, and the agencies that use such systems.


    ## ENERGY


    Computers control the flow of electrical energy that keeps modern society operating.
    Vast computer systems control the operation of power plants and the distribution
    of power throughout electrical grids. All those systems must be networked and
    programmed. Programmers also create software that operates advanced alternative
    energy systems, such as arrays of photovoltaic panels that convert sunlight into
    electrical energy.


    ![](img/404b2534e7205427db1a74abc74a36b7_54_0.png)


    This computer model of a thunderstorm with a tornado brewing was constructed from
    Doppler radar data.


    ## MEDICINE


    Computers have become a central part of medical technology. For a long time, they
    have been used to keep track of patient records. But soon there will be centralized
    medical databases that will keep track of patients’ medical information, such
    as tests, prescriptions, diseases, and the like. This system will enable doctors,
    nurses, and other medical professionals to easily access a patient’s medical information.
    Keeping all patient information in one place could streamline medical treatment
    and reduce the cost of repeated tests. The need to create and maintain these medical
    systems will create many programming jobs in the coming years, both in hospitals
    and with companies that will provide the software for this purpose.


    Systems are also being developed that assist medical personnel in identifying
    and diagnosing medical problems. These systems work by analyzing symptoms entered
    into a computer. The system then suggests possible medical problems indicated
    by the symptoms and recommends appropriate tests. Such systems rely on “knowledge
    bases.” These are large collections of data that consist of information obtained
    from experts in a particular field. The building of knowledge bases is, in itself,
    another type of programming job.


    ## SCIENCE


    Today, every type of science relies heavily on computers. Two major applications
    of computer systems in such areas


