    and edit existing entries. Open source software is much the same—programmers can
    modify the source code to improve or otherwise change the software.


    The most well-known example of open source software is Linux. A version of Unix
    operating system software that was originally developed by Linus Torvalds, Linux
    is one of the most widely used operating systems in business and industry today.
    Individuals all over the world work on enhancing source software


    # KEEPING UP WITH THE FIELD


    Innovations in the world of computer hardware and software happen constantly.
    Brand-new cutting-edge technologies, devices, and programming languages are continually
    being developed. New versions of existing products with different applications
    and features come out every year. For this reason, it is critical that computer
    scientists and programmers keep up with the field. They need to stay up-to-date
    with the most current books, trade magazines, and online articles. Being active
    in professional organizations such as the IEEE, ASEE, or ACM is an excellent way
    for them to not only stay up to date with the new technologies being developed,
    but sometimes play a role in their development.


    It is important to understand that computer science and programming is not a field
    where a person can get a degree, put his or her books away, and proceed to have
    a lifelong career. If computer professionals do not continually update their knowledge,
    they will inevitably become obsolete, just like the programming languages and
    computer technology they learned at the start of their career. A career in computer
    science means a lifelong commitment to learning.


    new versions and applications for use with it are continually emerging. Open source
    software exists for audio and video applications, business productivity, databases,
    math and science applications, software development, security, video games, and
    more. Many of the major open source programs such as Ubuntu (an open source alternative
    to the Windows operating system) and the Firefox Web browser maintain links on
    their sites to developers'' forums for those interested in participating in development
    and support.


    Individuals belonging to the open source community work on open source software
    projects alone or in groups, communicating with other members of the community
    via online forums devoted to a particular type of software. Online forums allow
    users to exchange ideas and help each other with questions and problems. Individual
    utilities and applications that can be used with the existing version of a program
    are often offered, free of charge, to the open source community by the person
    who created them.


    Another way to participate in the software community at large is through problem-solving
    forums. Almost every major manufacturer of software hosts community forums where
    users help each other resolve problems with commercial software, such as Windows
    or Adobe Flash. The same is true of some major online sites, such as YouTube,
    which host community help forums. In these forums, participants can use their
    knowledge to help others resolve problems.


    Participating in the larger community of programmers can provide a person with
    the opportunity to practice his or her software skills by working on real-world
    applications. Being part of a community also allows a person to know other professionals
    working in the areas he or she is interested in and gain recognition as someone
    who contributes to the community. Some organizations and companies even recognize
    individuals who make a significant contribution to helping others with their software.
    For example, Microsoft grants the Microsoft Most Valuable Player award to those
    who make a significant contribution to supporting their Microsoft software through
    technical forums.


    # PARTICIPATING IN PROFESSIONAL ASSOCIATIONS


    Organizations such as the ACM and IEEE offer student memberships. Joining and
    participating in the activities of such an organization is a great way to demonstrate
    an interest in the field. Through its partnership with major software manufacturers,
    such as Microsoft Corporation and Sun Microsystems, the ACM can offer its student
    members access to more than one hundred software programs. These programs provide
    an enormous variety of tools for learning and building sample computer applications.
    The ACM even has a special newsletter for students.


    In addition, being a student member of an organization like the ACM or IEEE provides
    the opportunity to learn about various subdisciplines of the field. If a student
    wishes to work on a computer science or programming project, he or she will have
    expert contacts who can give advice. Further, students will be making contacts
    with professionals in the field who may be able to help them when it comes time
    to look for internships or employment. The IEEE maintains a student Web site that
    provides information on opportunities of interest to students.


    The ACM offers twenty stipends of $500 each to allow students to attend research
    conferences in computer science. Although these stipends are mostly aimed at college
    students, high school students are eligible to apply. If they can demonstrate
    sufficient interest in research and study in the field, they can qualify.


    # CHAPTER 5

    Finding a Job


    At one time, people checked the newspaper want ads when they wanted to look for
    a job. Today, most companies in the software and computer industries rely on online,
    rather than print, advertising. Generally, only a small portion of available jobs
    are listed in newspaper ads. Simply looking through print ads is often the least
    effective way to find a job; the job seeker should look through other employment
    resources as well.


    Larger companies often use recruitment agencies, sometimes called “head hunters,”
    to locate employees. This is especially true for technical and managerial positions.
    One can look up recruitment agencies in the phone book or do a Yellow Pages search
    on a search engine such as Yahoo! or Google. However, the chances of getting a
    job through a recruitment agency are greater once a person has experience in the
    field.


    # JOB SEARCH STRATEGIES


    Many colleges and technical schools have a placement office that assists students
    with finding a job. In addition to helping students contact companies, the placement
    office often provides resources for writing résumé and other job hunting tools.
    Many professional organizations have job hunting resources for their members,
    including online resources and newsletters that list job opportunities.


    # CAREERS IN COMPUTER SCIENCE AND PROGRAMMING


    The first step to finding a good job is setting a concrete goal to aim for. It''s
    one thing to want to have a career in computer science or programming, but another
    to have a specific career path in mind. When beginning the process of job searching,
    identify companies that seem interesting or look like good places to work. These
    can be found by looking through an online industry directory, printed directories
    provided by industry associations, or general business directories such as Standard
    & Poor''s or the Dow Jones directories, which are available at many libraries.


    # PREPARING A RÉSUM


    The most important tool for job hunting is a résumé. A résumé is a document that
    lists the applicant''s educational background, work experience, and other pertinent
    information. For instance, a job applicant might list the internships he or she
    completed on a résumé. The purpose of a résumé is to get an interview with prospective
    employers. Therefore, it should include information that shows that the applicant
    has skills not only in computer science and programming, but also in other areas
    that will make him or her a valuable candidate for the job.


    When crafting a résumé, it''s best to steer clear of trendy or unusual formats
    that might affect the résumé''s readability. Complicated designs can make it more
    difficult for an employer to locate information such as what jobs an applicant
    has held. Faced with going through enormous numbers of résumés in response to
    a job posting, employers are not likely to spend time hunting through a résumé
    for the information they want to know.

