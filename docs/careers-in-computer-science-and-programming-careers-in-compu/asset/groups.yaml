    automation software for companies that manufactured equipment. They are also needed
    to write, alter, and maintain custom software that runs particular processes in
    a given manufacturing facility. There are a variety of computer science-related
    jobs on both the business and manufacturing sides of industry.


    # TRANSPORTATION


    Computers are used in every phase of transportation today. They are used by air
    traffic controllers to manage air flights and in aircraft to control the flight
    systems themselves. Programmers write the code used in trucks and trains to relay
    information about the location of vehicles and their cargo, allowing companies
    to track the progress of shipments and drivers. Programmers write code code used
    by governments to monitor traffic patterns and assess issues related to traffic
    control. They also write code to model future transportation systems. For example,
    these programs model traffic patterns to establish what the best design for proposed
    highway systems would be. In addition, vehicle manufacturers employ computer science
    experts to develop the electronic components and code that control vehicles.


    Beyond earthbound transportation, programmers write the code used in aerospace
    applications to control spacecraft, such as space shuttles and operate satellites,
    and provide data-gathering and analysis functions at NASA.'
