    ## 职业前景


    根据美国劳工部 2010–2011 年版手册显示，尽管 2008 年和 2009 年经济出现低迷，但信息技术领域的工作预计在未来十年内将继续增长。提供数据处理服务和托管服务的公司将迎来增长。


    托管涉及为那些不想自己维护内部服务器的公司提供并运行服务器。移动计算（或使用无线技术以及智能手机、平板电脑等易于携带的小型设备）可能会产生大量应用程序的需求。移动设备，如
    iPod、上网笔记本以及 iPhone 和黑莓（BlackBerry）等智能手机都使用由程序员创建的应用程序。公司在未来一段时间内可能还会继续尝试开发新的移动设备。对新应用程序以及从桌面版适配而来的应用程序的需求，将为未来的程序员提供大量工作。计算机网络的普及创造了许多新的编程和计算机科学职业。


    很少有行业比计算机科学和编程提供的职业机会更多，而且这些机会在许多不同的行业中不断增加。一个扩张领域是互联网出版和广播。报纸和杂志的在线版本正在取代纸质版。随着出版者想出对其产品收费的方法，他们可能会更多地关注出版物的在线版本。


    医疗保健行业一直在持续增长。政府将所有医疗记录电子化的计划，以及医院对提高医疗服务效率日益的兴趣，可能会导致对计算机科学和编程专业人才的需求增加。


    各层面的安全在未来十年内也可能是一个增长行业。设计、编程和操作电子安全系统将为人们提供充足的就业机会。这些可能包括筛选恐怖分子的大型数据库、生物识别系统（使用物理属性进行识别的电子系统，如掌纹或眼球扫描）或入侵检测系统。


    这些只是增长行业中的几个，它们将为计算机专业人士提供就业——特别是那些具有计算机科学和编程背景的人。几乎每个行业都在将计算机技术整合到其流程中。很有可能，如果一个人对在某个行业工作感兴趣，他可以在该领域找到计算机科学或编程工作。


    ## 第二章


    ## 计算机科学与编程领域的职业


    有许多不同类型的计算机科学和编程工作。拥有计算机科学和编程背景可以使一个人胜任各种工作。有些人选择寻求学术型职业路径，学习计算机理论。另一些则侧重于将他们的计算机科学和编程知识应用于在各种行业中追求有丰报的职业。


    ## 程序员


    告诉计算机该做什么的软件是由程序员编写的。程序员使用各种编程语言编写软件，这些语言旨在将程序员的指令翻译成计算机可以理解的形式。程序员可能为生产商业软件的公司工作，也可能在编写软件以运行公司内部计算机系统的公司工作。有些程序员在公司工作，由他们编写运行公司产品的软件。例如，他们可能会编写一个控制工厂自动化机器的程序，或者编写用于汽车的自诊断软件。每种计算机语言都最适用于特定的应用程序，例如创建业务


    ![](img/404b2534e7205427db1a74abc74a36b7_16_0.png)


    在 Google 等开发不同类型应用程序的公司工作的软件工程师，通常有机会参与各种项目、程序、数据库、视频游戏、专门的科学应用等。程序员学习某些编程语言在程度上取决于他们想要编写什么类型的应用程序。


    在大学学习计算机编程的人学习了许多编程语言。然而，具有额外功能的新语言正在不断开发中。因此，为了在职场中保持竞争力，程序员必须通过学习最新的编程语言来不断更新自己的技能。程序员通过参加课程或使用说明书籍和
    CD 自学来实现这一目标。


    ![](img/404b2534e7205427db1a74abc74a36b7_17_0.png)


    科技巨头微软（Microsoft）是年度消费电子展览会（CES）上的主要参与者，科技公司在那里向公众展示他们的全新产品。


    ## 信息技术工作


    许多具有计算机科学和编程背景的人在信息技术领域找到了工作。“信息技术”指的是使用计算机硬件和软件来传输、存储和分析信息。今天，大多数公司都有一或多名信息技术（IT）员工，许多公司还设有
    IT 部门。以下是信息技术工作的示例。


    ## 系统或网络管理员


    许多公司将他们的计算机配置成网络。通常，网络中的计算机还连接到中央服务器，并与其交换数据。服务器上安装了特殊的网络软件来控制网络。


    网络管理员负责构建、监控、维护和保护公司的计算机网络以及运行在上面的上的软件。网络管理员需要了解各种软件程序并必须能够定制软件。系统和网络管理员使用的软件语言和编程工具包括
    Active Server Pages、Cognos、Java Server Pages、Microsoft Exchange、Microsoft .NET
    语言、Oracle、SQL Server 和 VMware。


    系统和网络管理员使用软件监控网络的物理和容量问题、控制网络资源的访问、安装安全系统进行保护、更新网络软件并备份服务器以防灾难发生时数据丢失。系统管理员还使用软件控制公司数据库、电子记录、服务器和其他数字资源的访问。


    除了正式教育外，网络管理员通常从制造网络硬件和软件的公司（如微软）获得专业认证。为了获得专业认证，人员必须学习公司提供的材料并通过证明其了解如何使用该产品的测试。这类专业认证在找工作时通常会有帮助，因为它们证明了对维护网络运行所需程序的精通。


    ## IT 经理


    雇用许多人的 IT 部门通常由 IT 经理主管。IT 经理有批准下级员工决策的权限。然而，经理通常不参与公司计算机系统的日常实际操作。相反，经理的工作是监督其员工的工作、做出招聘和解雇决定、与高级层交流以确定公司的计算需求、制定并监控部门预算、向高级层申请必要的采购批准，并执行其他管理任务。

