    ## 为成功积累技能


    初中生和高中生不应只关注学习如何成为计算机专家。在这个阶段，学习对成功至关重要的基础技能非常重要。例如，对于成为计算机专业人士的人来说，参加一门打字课程是有益的。无论是处理硬件还是软件，计算机科学家和程序员都会花费大量时间在键盘上打字。掌握盲打将极大地提高工作效率。最重要的是，学习良好的书面和口头交流能力是必要的。如今计算机科学和编程领域的每个主要职位，无论是在
    IT、数据分析还是软件设计，都涉及到与经理和员工的互动。相反，这项工作是由团队完成的。因此，有能力通过书面和口头向同事和上级交流想法。良好的沟通技能可以确保个人的想法以清晰的方式传达。


    ## 在大学学习计算机科学


    进入大学学习计算机科学的学生可能会追求一门包含多种课程的学习课程。这些课程可能包括数学和自然科学课程。他们还将学习计算机科学的通用课程，包括计算机系统导论、数据结构导论、C
    和 Unix 等特定语言的编程课程以及计算数学。


    ## 为职业做准备


    学生还可以参加他们感兴趣的计算机科学特定领域的课程，例如多媒体、计算机图形和人工智能。学生很可能会学习数学，如高等微积分代数，以及统计学和概率，这些被用于分析事件发生的可能性。（img/404b2534e205427db1a74abc36b7_28.png）数学和逻辑是计算机编程的基础。理解这些学科是创建管理程序运行算法的关键。掌握实验设计知识是能够设计项目的关键。学生还可能参加有关伦理以及如何维护数据机密隐私的课程。学生可能会在实验室工作，在那里执行计算机相关的任务。除了技术课程外，学生可能被要求参加各种人文和艺术类的选修课。一些大学提供的商业课程可能被证明是极其用的。要在现实世界中成功，需要理解不仅仅是技术如何运作。有志计算机科学家和程序员需要扎实的沟通、项目管理和人员管理技能。一个理解如何管理人员和项目的人比只懂技术的人对公司更有价值。事实上，大多数计算机科学和编程工作都需要基础技能，例如证明支出合理性的能力。由于这些原因，学生可能想要学习商业、项目管理和财务课程。最后，大学生能做的最有用的事情之一是养成良好的工作习惯。以彻底和及时的方式完成工作将养成一种习惯，一旦进入职场，将促进学生的职业发展。


    ## 广博教育的优势


    在当今的商业和工业世界，来自不同背景的人共同工作。计算机科学家和程序员发现自己为在多个国家设有分公司的公司工作，服务全球客户并不罕见。计算机专业人士完全可能发现自己与其他国家的人一起工作并出国旅行。（img/404b2534e205427db1a74abc36b7_30.png）计算机科学领域的许多人发现自己在从事国际工作。在这里，计算机专业人士在技术领域的一家大型计算机公司负责项目。在大学学习历史、哲学和心理学课程对于理解整个世界以及人们如何相互互动非常有益。这种背景可以增强一个人对其在职业身份上可能遇到的各种文化和信仰的认知和包容度。


    将计算机科学和编程的学习与其他领域的研究结合也是可能的。在当今的几乎每个领域，对精通计算机和软件使用的员工都有巨大需求。因此，即使学生并不希望成为一名专业的计算机科学家，他们也可能希望学习计算机硬件或编程的某些方面。在这些领域拥有技能可以使人在就业市场上更具竞争力，作为员工也更有价值。最有价值的员工是那些不仅理解技术，还理解他们所在公司业务的人，并且能够向管理层、客户、供应商和合作伙伴良好代表公司的人。拥有这种复合知识可以让求职者将自己表现为非常有竞争力的候选人。


    ## 学校类型和课程


    在大学获得计算机科学学位是为该领域的长期职业准备的最有效方法。正式教育使人们掌握广泛的技术和技巧，更好地适应工作场所的需求。通过提供计算机理论知识，它让人们能够理解新技术是如何工作的。大学课程可以训练人们如何有效地处理项目和一般的问题解决。这种培训让有志人士在现实世界中解决问题和处理事务更加成功。获得学位向雇主证明了人能够成功完成目标。高位的
    IT 职位更容易获得。


    技术学校通常提供四年的学士学位课程和两年的副学学位课程。副学学位课程侧重于特定的技能，例如计算机网络管理和软件开发。它们旨在为学生从事计算机硬件相关的初级职位做准备。


