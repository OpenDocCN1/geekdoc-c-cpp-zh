    # CHAPTER 4


    # Getting Involved and Gaining Exposure


    In today''s competitive job market, it''s beneficial to gain experience and exposure
    before starting to look for a job. There are many different ways to meet other
    people in the field and develop a portfolio of work while still in college or
    even in high school. Being involved in the larger community of computer professionals
    and software developers provides several benefits. It offers a chance to learn
    about the field by talking with experienced professionals. In addition, it provides
    the chance to apply the skills learned in the classroom to real-life projects
    and the chance to learn proper professional behavior from those who already work
    in the field.


