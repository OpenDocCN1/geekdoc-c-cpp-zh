    # 计算机科学与编程领域的职业


    ![](img/404b2534e7205427db1a74abc74a36b7_20_0.png)


    对于任何追求计算机科学和编程领域职业的人来说，跟上最新技术至关重要。许多计算机组件的主要制造商都提供关于如何使用新技术的实战培训。


    管理职位通过参加管理课程来增强他们的业务知识。


    # 数据库管理员


    公司和组织使用数据库来存储和组织数据。这些数据可能包括会计记录、人力资源记录、产品测试结果和质量保证结果、客户和潜在客户列表、接收和完成的订单、库存信息、采购记录——清单几乎无止尽。


    # 探索职业要求


    了解各种类型计算机科学和编程工作职责和要求的极好方法是查看招聘广告。最好在还在校期间就开始这样做，在正式开始准备职业生涯之前。探索这些广告可以让你洞察哪些类型的工作可能具有吸引力。此外，它还能让你了解哪些课程是必修的，或者获得特定类型的工作需要哪些技能。有很多网站都提供计算机相关工作的列表，例如
    Monster.com。要查看未来预测哪些工作会有需求并了解薪资范围，请查阅美国劳工部的《职业展望手册》(http://www.bls.gov/oco)。


    负责组织和维护所有这些信息的人是数据库管理员。数据库管理员的主要职责之一是设计数据库结构。这包括确定哪些信息应该存储在数据库中以及以什么形式存储。数据库管理员必须对数据库创建软件（如
    SQL 或 Oracle）有扎实的知识，并能够与组织的员工互动，以了解他们执行工作需要什么数据。


    数据库管理员的其他职责还包括实施适当的安全程序以确保数据安全、备份数据库以防发生灾难时信息安全、控制谁有访问数据库的权限、使用软件监控数据库性能以确保用户在尝试访问数据时不会经历长时间等待，以及解决数据库访问中的问题。


    # 计算机服务领域的职业


    在 IT 领域工作的另一种选择是为向企业提供计算机相关服务的公司工作。此类公司从全国性连锁店到单人运营不等。有些计算机服务公司专注于为企业销售计算机网络并进行安装。这些公司可能提供计算机和外围设备，或使用客户提供的设备。他们负责布线、设置网络并安装公司使用的软件。


    计算机服务公司还可能提供网络持续支持合同。在这种情况下，当计算机网络出现问题时，计算机专业人员会响应客户的召唤，前往客户所在地修复问题。其他计算机服务公司则编写定制软件或修改商业软件以满足公司的特定需求。


    在计算机服务公司工作需要优秀的人际技巧以及广泛的技术知识。你可能需要向几乎或完全没有技术知识的人解释复杂的技术话题。在处理因计算机系统出现问题而压力巨大的客户时，需要耐心和技巧。


    # 第3章

    ## 为职业做准备


    如今许多学院和大学都提供计算机科学和编程专业。大学提供四年制学士学位课程或适合入门级工作的两年制副学学位课程。一些学院还提供全日制和兼读的高级课程。技术学校与其他学院非常相似，区别在于它们提供培训学生从事该领域特定工作的课程。例如，技术学校的课程可能会培训学生如何修理计算机，以便为成为计算机技术员的职业做准备，或者教他们如何设计和构建
    Web 网页。一个人希望从事的计算机科学方面将影响他或她所修的学术课程。


    ## 选择重点


    在决定追求计算机科学的哪个方面时，有必要决定哪种职业看起来很有趣。计算机科学毕业生最常见的身份是程序员或在 IT 领域担任系统或网络管理员。许多人最终也从事计算机硬件工作。决定在哪些行业工作可能会有回报的同样重要。有些人可能对计算机理论以及与他人合作创建尖端软件程序更感兴趣。另一些人可能对编程工业机器人和工业自动化过程更感兴趣。还有人可能最感兴趣的是利用他们的计算机科学和编程知识最终获得
    IT 管理工作。对于有志向成为的计算机科学家、程序员和其他计算机专业人士来说，通常必要在计算机硬件和软件方面都有基础性的知识。计算机科学家和程序员在决定自己最喜欢哪一个行业之前，可以在多个不同的行业中工作。


    计算机器协会 (ACM) 是一个大型计算机行业组织，它定义了


    ![](img/404b2534e7205427db1a74abc74a36b7_24_0.png)


    这些高中生正在学校的计算机实验室学习编程。计算机课可以帮助学生在学习如何编码方面抢占先。


    ACM 定义了计算机科学和编程的若干通用学术领域。以下是提供学位的的一些主要学术领域列表。学位的确切名称会因机构而异。


    - 计算机科学：这是一个广泛的类别，学生在其中学习计算机硬件技术和编程。某些学习计划侧重于计算机科学的理论方面，而另一些更侧重于编程。学习计算机科学的学生将学习各种计算机硬件和软件科目。拥有计算机科学学位的人通常可以在许多领域工作。


    - 计算机工程：这一研究领域将计算机科学的研究与电气工程相结合。它为学生提供了设计计算机系统和设备的技能。ACM 列出的某些领域包括消费电子产品、医疗设备开发、军事技术、安全系统和电信。


    - 编程：编程或软件工程强调运行应用程序的程序的创建。这是通过使用各种编程语言来实现的。ACM 的示例包括航空电子、医疗保健应用、加密、交通控制、气象系统等。


    # 职业准备


    为计算机科学或编程职业做准备，越早越好。如果可以在学校里上计算机课，那么请务必参加。这些课程不仅可以提供实用的技能，还可以为学生提供一个机会，让他们发现自己与计算机工作是否有趣且有成就感。


