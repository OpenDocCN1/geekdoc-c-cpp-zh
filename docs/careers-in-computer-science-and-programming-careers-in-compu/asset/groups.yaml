    a poll in which people vote on a particular topic. Smartphones such as the Apple
    iPhone feature thousands of downloadable apps, many of which were designed and
    built by users.


    A person interested in a programming career can showcase his or her abilities
    by creating apps. Apple provides an interface that individuals can use to develop
    apps for the iPhone, a highly popular activity for both amateur and professional
    programmers. (In fact, designing iPhone apps is so popular that Stanford University
