    The best way for a job applicant to demonstrate to a prospective employer that
    he or she is qualified for the job is to create a portfolio. A portfolio is a
    collection of work samples. For instance, a programmer''s portfolio would contain
    examples of his or her programming work.


    Even if a person hasn''t done any professional work yet, it''s still possible
    to create work for a portfolio. One way to do this is to build apps. Popular social
    media sites such as Facebook and Twitter support apps, and people can practice'
