    # 引言


    计算机技术是现代生活各个方面不可或缺的一部分。人们依赖计算机技术进行娱乐、获取信息以及与朋友、同事和家人保持联系。电脑游戏、网站、流媒体、可下载音乐、短信以及
    Facebook 和 Twitter 等社交网站已成为许多人生活的标准组成。


    很少有行业对人们生活的影响像计算机行业这样大，也很少行业在未来能提供同样的创新前景。计算机技术这个迷人且快速变化的世界激发了许多人对该领域职业的兴趣。本书提供了评估不同类型的计算机科学和编程职业所需的信息。它研究了各种类型的计算机科学和编程工作，并探讨了胜任这些工作所需的教育和培训。此外，它还提供了关于获得每类工作的实用建议。学习过计算机科学和编程的人通常发现，他们的技能适用于许多广泛领域的工作。最后，它还展示了计算机科学和编程工作的日常生活可能是怎样的。


    在计算机科学和编程领域工作可能是令人兴奋的，计算机专业人士往往处于新技术突破的前沿。在该领域工作在经济上也是很有回报的，因为这类工作通常薪水很高。同时，计算机科学和编程职业通常要求很高，需要长时间的细致工作和对细节的坚定关注。


    市场对具有计算机科学和编程背景的人有持续的需求，这个领域提供的比许多其他职业路径更具工作安全感。大量行业都需要计算机程序员的技能。事实上，对计算机科学和编程专业人才的需求从未如此之大。然而，在该领域工作的人需要不断更新自己的技能。否则，他们面临着由于硬件软件技术不断进步的风险。


    # 第一章

    # 计算机世界


    计算机科学和编程领域涵盖软件和系统的创建、修改和维护。该领域的专业人士可能直接从事编程，或依赖计算机语言和计算机工程知识的相关计算机技术领域。计算机科学和编程的根源追溯到第二次世界大战（1939–1945）。在此期间，第一批现代计算机诞生。这些早期计算机主要供军事使用，不供普通使用。计算机在20世纪50年代开始进入商业领域，主要供大型机构使用。这些计算机体型巨大，与今天使用的计算机相比，处理能力非常有限。它们与今天的台式计算机的不同之处在于它们是主机（或非常大的计算机），用户通过终端与其交互，终端是显示器和键盘单元，自身不具备处理能力。


    # 计算机语言


    如果没有指令告诉计算机做什么，计算机就是毫无用处的。早期的程序员通过在称为打卡卡的纸板条上打孔来为计算机编制编码指令。随着时间的推移，日益复杂的计算机语言被开发出来，主机也从使用打卡卡升级为使用记录在大型磁带卷上的程序。


    ![](img/404b2534e7205427db1a_10_0.png)


    喜欢独立工作和解决问题的人通常会被计算机科学和编程职业所吸引。


    计算机语言由标准命令组成，这些命令可以组合成告诉计算机如何处理数据的指令。在计算机早期，程序员使用简单的编程语言（如汇编语言），直接在非常基础的层面告诉计算机如何处理数据。早期的编程语言由数字和符号组成，人类很难理解。


    在随后的几十年里，计算机变得越来越小，功能越来越强大。Pascal、COBOL 和 Fortran 等编程语言是为了商业和科学应用而开发的。软盘、Zip 驱动器、硬盘、拷贝盘和
    DVD 提供了更方便的数据存储。最常用的计算机是台式个人电脑（PC），数据通常存储在硬盘或 USB 驱动器上。现在，复杂的计算机语言允许程序员只需告诉计算机他们想做什么。编程语言将这些信息翻译成低级指令，简化了软件的创建。


    在当今的商业中，将多台 PC 连接在一起以允许用户相互交互并访问中央数据源是常见的。这种安排被称为计算机网络。计算机网络通常将网络中的所有 PC 连接到中央服务器。服务器是一台强大的计算机，提供比典型台式
    PC 更多的存储容量和处理能力。计算机网络需要组织机构以及控制系统访问的特殊安全硬件和软件。


    # 编程语言


    针对特定应用已经开发了各种特殊编程语言。网站通常使用超文本标记语言（HTML）、可扩展标记语言（XML）、层叠样式表（CSS）、Active Server
    Pages.NET（ASP.NET）、Java 和 JavaScript 构建。HTML 包含告诉计算机网页元素在屏幕上如何显示的命令。XML 允许程序员通过识别网页中不同类型的内容为网页提供增强的功能。CSS
    提供了格式化网页的命令。ASP.NET、Java 和 JavaScript 允许程序员为网页添加功能，使用户能够与之交互。数据库（即组织成数字记录和文件的数据集合）经常使用结构化查询语言（SQL）或
    Oracle 软件。这些语言不仅允许创建记录，允许用户查询数据库获取信息。查询是指对信息的询问或请求。执行特定功能的完整软件程序称为应用程序。常用应用程序示例包括
    Microsoft Word、Adobe Reader 和 Google Maps。


