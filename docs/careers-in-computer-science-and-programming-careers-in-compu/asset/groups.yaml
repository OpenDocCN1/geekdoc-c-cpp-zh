    Each type of computer language is generally used for a specific purpose. Languages
    commonly used in writing computer applications include C+, C++, and Visual Basic.
    These are object-oriented languages, which place low-level instructions inside
    of units of code called objects. Today, most programmers use object-oriented programming
    languages when developing applications. These languages enable programmers to
    use objects when writing programs to tell computers how to perform tasks, without
    requiring the programmer to detail every basic activity.


    ## CAREER OUTLOOK


    According to the 2010–2011 edition of the U.S. Department of Labor’s handbook,
    jobs in information technology are expected to continue to grow throughout the
    next decade, despite the downturn in the economy in 2008 and 2009. Companies offering
    data-processing services and hosting services are projected to experience growth.


    Hosting involves providing and running servers for companies that don’t want to
    maintain their own in-house servers. Mobile computing (or the use of wireless
    technology and small devices such as smartphones and tablet computers that can
    easily be carried around) is likely to create a demand for a vast number of applications.
    Mobile devices, such as iPods, netbook computers, and smartphones like the iPhone
    and BlackBerry, all use applications that are created by programmers. Companies
    are likely to continue trying to develop new mobile devices for some time to come.
    The demand for both new applications and those adapted from desktop editions will
    provide a great deal of work for programmers in the future. The spread of computer
    networking has created a variety of new programming and computer science careers.


    Few industries offer more career opportunities than computer science and programming,
    and these opportunities are increasing in a number of different industries. One
    area of expansion is Internet publishing and broadcasting. Online versions of
    newspapers and magazines are replacing their print cousins. As publishers figure
    out ways to charge for their products, they are likely to focus more on online
    versions of their publications.


    The health care industry has been experiencing continual growth. Government initiatives
    to computerized all medical records, as well as increasing interest on the part
    of hospitals in improving the efficiency of health care delivery, are likely to
    result in an increased demand for computer science and programming professionals.


    Security at all levels is also likely to be a growth industry over the next decade.
    Designing, programming, and operating electronic security systems will provide
    ample employment opportunities for people. These might include giant databases
    that screen for terrorists, biometric identification systems (electronic systems
    that use physical attributes for identification, such as palm prints or scans
    of the eye), or intrusion detection systems.


    These are just a few of the growing industries that will provide employment for
    computer professionals—especially those with a background in computer science
    and programming. Almost every industry is incorporating computer technology into
    its processes. Chances are, if a person is interested in working in a particular
    industry, he or she can find computer science or programming jobs in that field.


    ## CHAPTER 2


    ## Careers in Computer Science and Programming


    There are many different types of computer science and programming jobs. Having
    a background in computer science and programming can qualify a person for a wide
    variety of jobs. Some people choose to seek out a career path that is academic,
    studying computer theory. Others focus on applying their knowledge of computer
    science and programming to pursuing rewarding careers in an assortment of industries.


    ## PROGRAMMER


    The software that tells a computer what to do is written by programmers. Programmers
    write software using a variety of programming languages, which are designed to
    translate instructions from a programmer into a form that the computer can understand.
    A programmer may work for a company that produces commercial software or a company
    where he she writes software to run the company''s internal computer systems.
    Some programmers work for companies where they write the software that runs the
    company''s products. For instance, they might write a program that controls automated
    machinery at a factory or self-diagnostic software for automobiles. Each kind
    of computer language is best suited to specific applications, such as creating
    business


    ![](img/404b2534e7205427db1a74abc74a36b7_16_0.png)


    Software engineers employed by companies like Google, which develops different
    types of applications, often have the opportunity to work on a variety of projects
    programs, databases, video games, specialized scientific applications, and so
    on. Programmers learn certain programming languages depending in part on what
    type of applications they wish to write.


    People who study computer programming in college learn many programming languages.
    However, new languages with additional capabilities are constantly being developed.
    Therefore, to remain desirable in the job market, a programmer must constantly
    update his or her skills by learning the latest programming languages. Programmers
    accomplish this by taking courses or using instructional books and CDs to teach
    themselves.


    ![](img/404b2534e7205427db1a74abc74a36b7_17_0.png)


    Technology giant Microsoft is a major presence at the annual Consumer Electronics
    Show, where technology companies unveil their brand-new products to the public.


    ## INFORMATION TECHNOLOGY JOBS


    Many people with a background in computer science and programming find a job in
    the field of information technology. “Information technology” refers to the use
    of computer hardware and software to transmit, store, and analyze information.
    Today, most companies have one or more information technology (IT) employees,
    and many companies have IT departments. The following are examples of information
    technology jobs.


    ## SYSTEM OR NETWORK ADMINISTRATOR


    Many companies configure their computers into networks. Often, computers in a
    network are also connected to a central server with which they exchange data.
    Special networking software is installed on the server to control the network.


    Network administrators are responsible for constructing, monitoring, maintaining,
    and securing the company’s network of computers and the software that runs on
    them. The network administrator needs to know a variety of software programs and
    must be able to customize software. Examples of software languages and programming
    tools used by systems and network administrators include Active Server Pages,
    Cognos, Java Server Pages, Microsoft Exchange, Microsoft .NET languages, Oracle,
    SQL Server, and VMware.


    System and network administrators use software to monitor the network for physical
    and capacity-related problems, control access to network resources, install security
    systems to protect it, keep the network software up-to-date, and back up the server
    so that data is not lost in the event of disaster. The systems administrator also
    uses software to control access to the company''s databases, computerized records,
    servers, and other digital resources.


    In addition to a formal education, network administrators often acquire professional
    certifications from companies that make networking hardware and software, such
    as Microsoft. To acquire a professional certification, the person must study material
    supplied by the company and pass a test that demonstrates that he or she understands
    how to use the product. These kinds of professional certifications often help
    a person when job hunting, since they demonstrate mastery of procedures necessary
    to keep the network running.


    ## IT MANAGER


    IT departments that employ a number of people are generally overseen by an IT
    manager. The IT manager has the authority to approve the decisions of lower-level
    employees. However, the manager is usually not involved in the day-to-day, hands-on
    operations of the company''s computer systems. Rather, the manager''s job is to
    oversee the work of his or her employees, make hiring and firing decisions, interact
    with senior management to ascertain the company''s computing needs, create and
    monitor the departmental budget, obtain approval for necessary purchases from
    senior management, and perform other managerial tasks.

