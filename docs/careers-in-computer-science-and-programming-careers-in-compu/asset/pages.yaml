    information system managers, who run departments that analyze large amounts of
    data and generate reports with information required by management to run the company;
    or project managers.


    # WORKING AS A SYSTEMS OR NETWORK ADMINISTRATOR


    The systems or network administrator''s most important job is to keep the company''s
    computer systems running so that users can do their jobs. This involves both short-term
    and long-term tasks, both of which the administrator will deal with in the course
    of a typical day.


    Long-term tasks can include backing up the system''s data so that it is safe in
    case of computer failure or disaster, upgrading the software programs that run
    on the company''s computers so that they stay current, and continually upgrading
    security software to protect the system. Administrators must also monitor the
    servers that run services for users and store database information to ensure that
    they are performing at a fast enough speed for users to work efficiently.


    In order to keep track of when different tasks need to be accomplished, the administrator
    needs to be highly organized and keep detailed records of all the software and
    hardware in use in the company. To monitor how the computer systems are functioning,
    administrators use software that shows statistics on the utilization of system
    components.


    Systems or network administrators also have to constantly deal with short-term
    demands and problems. The'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# THE WORLD OF FREELANCING


    Many people who study computer science in college go on to pursue rewarding careers
    as freelancers, providing services directly to clients. They may repair computers,
    create computer networks, or work on teams writing custom software programs for
    a particular project. Freelancers can schedule their time as they wish, act as
    their own boss, and earn an income based on their ability to attract clients.
    Having this kind of freedom is very attractive to people who pursue careers as
    freelancers; however, with this freedom comes great responsibility. Freelancers
    must also control their expenses to ensure they make a profit, they generally
    work alone and lack the sustained professional and social contact of a workplace,
    they must do a significant amount of marketing of their services to obtain clients,
    they must pay for their own benefits (such as health and dental insurance), and
    they must have enough money to live until they build up a client base. It is also
    important that freelancers stick to project schedules and finish work in a timely
    manner. Building a reputation as a dependable worker can allow freelancers to
    get work through word-of-mouth recommendations. People who are interested in pursuing
    a career in computer science and programming as a freelancer can benefit greatly
    from taking college courses in business and finance in addition to computer courses.


    administrator is in charge of assigning security permissions to users to allow
    them to access certain computers, software, or databases. For example, only human
    resources personnel might be allowed to access employee records, and only the
    finance department staff and senior management might be'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'allowed to access the company’s financial records. In a typical day, a systems
    or network administrator may be asked to create an account in the system for a
    new employee, block access for an employee who’s left the company, fix a problem
    for a manager who is having trouble accessing the system, and set up a new smartphone
    for a salesperson.


    Administrators also have the usual managerial responsibilities for managing and
    tracking budgets, getting approval from senior management for new equipment and
    software, and then evaluating, ordering, and installing it. In medium and large
    companies, system and network administrators may also have employees working for
    them, whom they need to supervise. It is not unusual for system and network administrators
    to be “on call” when away from work. Being on call means they can be called to
    come in to the company at any time to deal with an emergency, such as the company’s
    Web server ceasing to work. Pay for systems and network administrators is generally
    high, but the job can be very demanding. The career path for systems and network
    administrators often leads to becoming an information technology manager and could
    ultimately lead to becoming a vice president of IT or even chief information officer,
    a senior management position responsible for overseeing all of a corporation’s
    information technology functions worldwide.


