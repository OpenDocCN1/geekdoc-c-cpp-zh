  md: '# Glossary


    algorithm A set of steps for accomplishing a task.

    application A computer program that performs a single function, such as a word
    processing program.


    artificial intelligence The branch of computer science concerned with developing
    computer systems that can learn and make decisions.


    biometric identification system An electronic system that uses physical attributes
    for identification, such as palm prints or scans of the eye.


    curriculum A list of courses covered in an academic program.


    database A collection of computerized records or data.


    data mining Analyzing large volumes of data to find significant trends.


    drone An unmanned military vehicle used for scouting.


    e-commerce Business that is conducted over the Internet, such as the online sale
    of products and services.


    enterprise resource management The integration of all the computing resources
    of an organization in order to make information available to the entire company.


    facial recognition software A computer program that analyzes the shape of a person''s
    face and compares it to a database of photos for identification.


    innovation Coming up with new ideas or advances.


    integrated system A combination of devices connected to each other to form a system
    used for a particular purpose, such as security.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'mobile device A computerized device designed to be carried in a purse or pocket
    that connects to electronic applications wirelessly.


    module A stand-alone part of a larger system or program.


    multimedia Content that combines different kinds of media, such as visual images
    and audio.


    network A group of interconnected computers.


    peripheral A device that attaches to a computer, such as a printer.


    photovoltaic panel A device containing solar cells, which convert sunlight into
    electricity.


    prototype A sample version of a product that is produced for testing and evaluation
    purposes.


    robotics The science of automating machines.


    server A powerful computer that provides data and services to networked computers.


    social networking site A Web site designed to allow people to interact with one
    another on a personal (as opposed to business) basis.


    streaming video Video that is continuously sent over the Internet to a computerized
    device.


    wireless communication Technology that connects electronic applications such as
    phone services, e-mail, and the Internet by signals sent through the air, rather
    than over electric wires.'
