  md: '# INTRODUCTION


    Computer technology is an integral part of every aspect of modern life. People
    rely on computer technology for entertainment, information, and staying in touch
    with friends, colleagues, and family. Computer games, Web sites, streaming video,
    downloadable music, texting, and social networking sites such as Facebook and
    Twitter have become a standard part of many people''s lives.


    Few industries have affected people''s lives as much as the computer industry,
    and few offer the same prospect of innovation in the future. The fascinating,
    rapidly changing world of computer technology has fueled many people''s interest
    in a career in this field. This book provides the information necessary to evaluate
    the different types of computer science and programming careers available. It
    looks at the variety of different kinds of computer science and programming jobs,
    and examines the education and training necessary to qualify for them. In addition,
    it provides practical advice on steps a person can take to obtain each kind of
    job. People who have studied computer science and programming often find that
    their skills apply to jobs in a wide variety of fields. Finally, it provides a
    look at what working in computer science and programming might be like on a day-to-day
    basis.


    Working in computer science and programming can be exciting, and computer professionals
    are often on the cutting edge of new technological breakthroughs. Working in this
    field can also be financially rewarding, since such jobs often pay high salaries.
    At the same time, careers in computer science and programming are often'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'demanding and require long hours of meticulous work and unwavering attention
    to detail.


    There is a steady demand for people with backgrounds in computer science and programming,
    and this field can provide more job security than many other career paths. A vast
    number of industries require the skills of computer programmers. In fact, there
    has never been a time when the demand for those with expertise in computer science
    and programming has been greater. However, the people who work in this field need
    to update their skills constantly. Otherwise, they run the risk of falling behind
    the continual changes in hardware and software technology.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# CHAPTER 1

    The World of Computing


    The field of computer science and programming encompasses creation, modification,
    and maintenance of software and systems. Professionals in this field may work
    directly in programming or in related areas of computer technology that rely on
    a knowledge of computer languages and computer engineering. The roots of computer
    science and programming date back to World War II (1939–1945). During this time,
    the first modern computers were created. These initial computers were used primarily
    by the military and were not available for general use. Computers first became
    commercially available in the 1950s and were used primarily by large organizations.
    These computers were enormous and had very little processing power compared to
    those in use today. They were different from today''s desktop computers in the
    sense that they were mainframes, or very large computers that users interfaced
    with through terminals, which are monitor and keyboard units with no processing
    capability of their own.


    # COMPUTER LANGUAGES


    Computers are useless without instructions to tell them to do something. Early
    programmers encoded instructions for computers by punching holes in cardboard
    strips called punch cards. Over time, increasingly sophisticated computer languages
    were'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/404b2534e7205427db1a74abc74a36b7_10_0.png)


    People who enjoy working independently and solving problems are often drawn to
    computer science and programming careers.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'developed, and mainframes graduated from using punch cards to use programs
    recorded on large spools of magnetic tape.


    Computer languages consist of standardized commands that can be combined to create
    instructions telling a computer how to process data. In the early days of computers,
    programmers used simple programming languages, such as assembly language, that
    directly told the computer how to process data at a very basic level. Early programming
    languages were composed of numbers and symbols that were very hard for people
    to understand.


    Over the succeeding decades, computers became progressively smaller and more powerful.
    Programming languages such as Pascal, COBOL, and Fortran were developed for business
    and scientific applications. Floppy disks, zip drives, hard drives, copy disks,
    and DVDs provided more convenient data storage. The most commonly used computers
    are desktop personal computers (PCs), and data is generally stored on hard drives
    or USB drives. Sophisticated computer languages now allow programmers to simply
    tell a computer what they want it to do. The programming language translates this
    information into lower-level instructions, simplifying the creation of computer
    software.


    In businesses today, it is common to connect a number of PCs together to allow
    users to interact with each other and access a central source of data. This arrangement
    is called a computer network. Computer networks generally connect all the PCs
    in the network to a central server. A server is a powerful computer that provides
    more storage capacity and processing power than a typical desktop PC. Computer
    networks require organization and special security hardware and software that
    control access to the system.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# PROGRAMMING LANGUAGES


    A wide variety of special programming languages have been developed for particular
    applications. Web sites are often built with hypertext markup language (HTML),
    extensible markup language (XML), cascading style sheets (CSS), Active Server
    Pages.NET (ASP.NET), Java, and JavaScript. HTML contains commands that tell a
    computer how the elements of a Web page should appear on-screen. XML allows programmers
    to provide increased functionality in Web pages by identifying different types
    of content in the Web page. CSS provides commands that format Web pages. ASP.NET,
    Java, and JavaScript allow programmers to add functionality to Web pages so that
    users can interact with them. Databases, or collections of data organized into
    digital records and files, frequently used structured query language (SQL) or
    Oracle software. These languages not only allow the creation of records, but they
    also allow users to query the database for information. A query is a question
    or request for information. Computer programmers will encounter many programming
    languages over the course of their careers.


    Complete software programs that perform a specific function are called applications.
    Examples of commonly used applications are Microsoft Word, Adobe Reader, and Google
    Maps. The world of programming offers a vast variety of careers, from writing
    programs to run cars, manufacturing robots, or entire production lines, to creating
    business and scientific tools that analyze massive amounts of data, or programming
    video games or the software that creates a special effect in a feature film.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Each type of computer language is generally used for a specific purpose. Languages
    commonly used in writing computer applications include C+, C++, and Visual Basic.
    These are object-oriented languages, which place low-level instructions inside
    of units of code called objects. Today, most programmers use object-oriented programming
    languages when developing applications. These languages enable programmers to
    use objects when writing programs to tell computers how to perform tasks, without
    requiring the programmer to detail every basic activity.


    # # CAREER OUTLOOK


    According to the 2010–2011 edition of the U.S. Department of Labor’s handbook,
    jobs in information technology are expected to continue to grow throughout the
    next decade, despite the downturn in the economy in 2008 and 2009. Companies offering
    data-processing services and hosting services are projected to experience growth.


    Hosting involves providing and running servers for companies that don’t want to
    maintain their own in-house servers. Mobile computing (or the use of wireless
    technology and small devices such as smartphones and tablet computers that can
    easily be carried around) is likely to create a demand for a vast number of applications.
    Mobile devices, such as iPods, netbook computers, and smartphones like the iPhone
    and BlackBerry, all use applications that are created by programmers. Companies
    are likely to continue trying to develop new mobile devices for some time to come.
    The demand for both new applications and those adapted from desktop editions will
    provide a great deal of work for programmers in'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'the future. The spread of computer networking has created a variety of new
    programming and computer science careers.


    Few industries offer more career opportunities than computer science and programming,
    and these opportunities are increasing in a number of different industries. One
    area of expansion is Internet publishing and broadcasting. Online versions of
    newspapers and magazines are replacing their print cousins. As publishers figure
    out ways to charge for their products, they are likely to focus more on online
    versions of their publications.


    The health care industry has been experiencing continual growth. Government initiatives
    to computerized all medical records, as well as increasing interest on the part
    of hospitals in improving the efficiency of health care delivery, are likely to
    result in an increased demand for computer science and programming professionals.


    Security at all levels is also likely to be a growth industry over the next decade.
    Designing, programming, and operating electronic security systems will provide
    ample employment opportunities for people. These might include giant databases
    that screen for terrorists, biometric identification systems (electronic systems
    that use physical attributes for identification, such as palm prints or scans
    of the eye), or intrusion detection systems.


    These are just a few of the growing industries that will provide employment for
    computer professionals—especially those with a background in computer science
    and programming. Almost every industry is incorporating computer technology into
    its processes. Chances are, if a person is interested in working in a particular
    industry, he or she can find computer science or programming jobs in that field.'
  merge: -1
  pgno: 14
