  md: '# 54 CAREERS IN COMPUTER SCIENCE AND PROGRAMMING


    are mapping and modeling, both of which require programming. Mapping involves
    taking data from sensors on vehicles, such as planes or ships, downloading it
    to computers, and then creating maps. For instance, video cameras mounted on aircraft
    might take pictures of terrain, and these images could be downloaded to land-based
    computers, which would create a map of how much forest exists in a certain area.
    Pictures from satellites orbiting Earth could be analyzed to determine the health
    of Earth’s ozone layer. Maps can be created to show the distribution of different
    types of terrain or the location of oil deposits.


    Modeling uses computers and software to predict what might happen under certain
    conditions. Modeling is used to predict weather events such as hurricanes and
    tornadoes, as well as predict the effects of human activities on global warming.
    It is used in designing industrial products by creating “virtual” objects, such
    as the components of an engine, to see how the final product might run before
    investing money in building a prototype, or trial version. It is used by biotechnology
    and pharmaceutical companies to evaluate how new drugs might work before testing
    them in the real world. Programmers are often hired to create commercial mapping
    and modeling software and to customize programs for specific projects being undertaken
    by research organizations.


    # THE MILITARY


    Programmers are needed to write programs for a wide range of military applications.
    The military uses computers'
