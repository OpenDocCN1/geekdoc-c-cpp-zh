  md: '# EXPLORING JOB REQUIREMENTS


    A good way to get an idea of both duties and requirements for various types of
    computer science and programming jobs is to check job ads. It''s best to do this
    while still in school, before it''s time to prepare for a career in earnest. Exploring
    these ads will provide insight into what kinds of jobs might be appealing. Beyond
    this, it will provide an idea of what courses are necessary to take or what skills
    are required to obtain a specific type of job. There are a number of Web sites
    that provide listings of computer-related jobs, such as Monster.com. To see what
    jobs are projected to be in demand in the future, and to get an idea of salary
    ranges, check out the U.S. Department of Labor’s Occupational Outlook Handbook
    (http://www.bls.gov/oco).


    The person in charge of organizing and maintaining all this information is the
    database administrator. One of the key responsibilities of a database administrator
    is designing the structure of the database. This includes figuring out what information
    should be kept in the database, and in what form. Database administrators must
    have a solid knowledge of database creation software, such as SQL or Oracle, and
    the ability to interact with the employees of the organization to find out what
    data they need to perform their jobs.


    Other duties of database administrators include implementing proper security procedures
    to keep data secure, backing up the database so that the information is safe in
    case of disaster, controlling who has access to the database, using'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'software to monitor the performance of the database so that users do not experience
    long wait times when trying to access data, and troubleshooting problems with
    database access.


    # CAREERS IN COMPUTER SERVICES


    An alternative to working in IT is to work for a company that provides computer-related
    services to businesses. Such companies range from nationwide chains to one-person
    operations. Some computer services companies focus on selling businesses computer
    networks and installing them. These companies may provide the computers and peripherals,
    or use the equipment provided by the customer. They run the cabling, set up the
    network, and install the software used by the company.


    Computer services companies may also offer contracts for ongoing support of the
    network. In such cases, computer professionals respond to calls from the client
    when there is a problem with the computer network, and they travel to the client''s
    location to fix the problem. Other computer services companies write custom software
    or modify commercial software to meet a company''s specific needs.


    Working for a computer services company, requires excellent people skills as well
    as extensive technical knowledge. One may have to explain complex technological
    topics to people with little or no technical knowledge. Patience and tact are
    required to deal with customers who are stressed out because their computer system
    is having a problem.'
  merge: -1
  pgno: 22
