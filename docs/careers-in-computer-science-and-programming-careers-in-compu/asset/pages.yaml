    # DATABASE ADMINISTRATOR


    Companies and organizations use databases to store and organize data. This data
    may consist of accounting records, human resources records, the outcomes of product
    tests and quality assurance results, customer and prospect lists, orders received
    and filled, inventory information, purchasing records—the list is almost endless.'
