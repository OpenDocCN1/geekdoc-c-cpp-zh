  md: '# CHAPTER 2


    # Careers in Computer Science and Programming


    There are many different types of computer science and programming jobs. Having
    a background in computer science and programming can qualify a person for a wide
    variety of jobs. Some people choose to seek out a career path that is academic,
    studying computer theory. Others focus on applying their knowledge of computer
    science and programming to pursuing rewarding careers in an assortment of industries.


    # PROGRAMMER


    The software that tells a computer what to do is written by programmers. Programmers
    write software using a variety of programming languages, which are designed to
    translate instructions from a programmer into a form that the computer can understand.
    A programmer may work for a company that produces commercial software or a company
    where he she writes software to run the company''s internal computer systems.
    Some programmers work for companies where they write the software that runs the
    company''s products. For instance, they might write a program that controls automated
    machinery at a factory or self-diagnostic software for automobiles. Each kind
    of computer language is best suited to specific applications, such as creating
    business'
