    to computer systems, introduction to data structures, programming courses in specific
    languages such as C and Unix, and computational mathematics. General computer
    science courses can be applied to any career in computer technology.


    Students can also take courses in specific areas of computer science that interest
    them, such as multimedia, robotics, computer graphics, and artificial intelligence
    (developing computer systems that can learn and make decisions). Students will
    most likely take mathematics courses such as advanced calculus and algebra, as
    well as statistics and probability, which are used to analyze the likelihood of
    various events occurring. They can also expect to take courses in the


