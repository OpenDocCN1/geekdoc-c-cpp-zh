  md: '# INFORMATION TECHNOLOGY JOBS


    Many people with a background in computer science and programming find a job in
    the field of information technology. “Information technology” refers to the use
    of computer hardware and software to transmit, store, and analyze information.
    Today, most companies have one or more information technology (IT) employees,
    and many companies have IT departments. The following are examples of information
    technology jobs.


    # SYSTEM OR NETWORK ADMINISTRATOR


    Many companies configure their computers into networks. Often, computers in a
    network are also connected to a central server with which they exchange data.
    Special networking software is installed on the server to control the network.


    Network administrators are responsible for constructing, monitoring, maintaining,
    and securing the company’s network of computers and the software that runs on
    them. The network administrator needs to know a variety of software programs and
    must be able to customize software. Examples of software languages and programming
    tools used by systems and network administrators include Active Server Pages,
    Cognos, Java Server Pages, Microsoft Exchange, Microsoft .NET languages, Oracle,
    SQL Server, and VMware.


    System and network administrators use software to monitor the network for physical
    and capacity-related problems, control access to network resources, install security
    systems to'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'protect it, keep the network software up-to-date, and back up the server so
    that data is not lost in the event of disaster. The systems administrator also
    uses software to control access to the company''s databases, computerized records,
    servers, and other digital resources.


    In addition to a formal education, network administrators often acquire professional
    certifications from companies that make networking hardware and software, such
    as Microsoft. To acquire a professional certification, the person must study material
    supplied by the company and pass a test that demonstrates that he or she understands
    how to use the product. These kinds of professional certifications often help
    a person when job hunting, since they demonstrate mastery of procedures necessary
    to keep the network running.


    # IT MANAGER


    IT departments that employ a number of people are generally overseen by an IT
    manager. The IT manager has the authority to approve the decisions of lower-level
    employees. However, the manager is usually not involved in the day-to-day, hands-on
    operations of the company''s computer systems. Rather, the manager''s job is to
    oversee the work of his or her employees, make hiring and firing decisions, interact
    with senior management to ascertain the company''s computing needs, create and
    monitor the departmental budget, obtain approval for necessary purchases from
    senior management, and perform other managerial tasks.


    To be successful, an IT manager should have an education in both computer technology
    and business and management skills. Many people who rise up through the ranks
    to attain'
