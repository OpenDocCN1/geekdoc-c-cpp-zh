    # CAREER PREPARATION


    It’s never too soon to begin preparing for a career in computer science or programming.
    If it is possible to take a computer class at school, then by all means take it.
    Not only can these classes provide useful skills, but they can also provide students
    with an opportunity to learn whether they find working with computers to be interesting
    and fulfilling.


    It is easy to look at cool applications on a computer or an iPhone and want to
    create some. It’s another thing to understand the math and science that are used
    behind the scenes to create an application. College-level computer science and
    programming curricula will contain a great number of math and science courses.
    Therefore, it’s important to get as thorough a grounding as possible in math and
    science while still in high school. It is necessary to take courses in algebra
    and precalculus, as well as calculus if it is offered. Calculus forms the basis
    of computer algorithms, which are a set of steps used to accomplish a task or
    solve a problem.


    People pursuing a career in computer science or programming will need to take
    courses in statistics, which are used in data analysis, in high school or college.
    Physics courses can help students understand the principles that underlie electronics.
    In addition to academic courses, students should join their high school’s computer
    club and work on learning computer skills. Volunteering in the school’s computer
    lab is another way to gain some hands-on computer knowledge.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# BUILDING SKILLS FOR SUCCESS


    Junior high and high school students should not only be focused on learning how
    to be computer experts. At this time, it''s important to learn the basic skills
    that are crucial to being successful. For instance, it''s good for aspiring computer
    professionals to take a typing course. Whether working with hardware or software,
    computer scientists and programmers spend a lot of time typing at the keyboard.
    Knowing how to touch-type speeds up work immensely. Above all, it is necessary
    to learn good written and spoken communication skills. Every major position in
    computer science and programming today, whether it is in IT, data analysis, or
    software design, involves interacting with both rank-and-file employees and managers.
    In addition, it''s rare for computer systems and software to be developed by a
    single individual. Instead, this work is done by a team. Therefore, it is necessary
    to be able to communicate ideas both in writing and verbally to coworkers and
    superiors. Having good communication skills can ensure that one''s ideas are conveyed
    in a clear and direct manner.


    # STUDY COMPUTER SCIENCE IN COLLEGE


    Students who go to college for computer science and programming will likely pursue
    a course of study incorporating a diverse selection of classes. These can include
    courses in mathematics and the natural sciences. They will also take general courses
    in computer science, which can include introduction'
  merge: -1
  pgno: 27
- img_proc: true
