  md: '# CHAPTER 6

    What to Expect on the Job


    What a computer professional''s work experience will depend on both the industry
    and the size of the company where he or she chooses to work. Some people prefer
    to work for large corporations, which often provide higher-paying jobs and more
    benefits, such as health insurance and tuition reimbursement, than smaller companies.
    However, it can be noticed at a large company, and one''s responsibilities may
    be more limited than they might be at a small company. Rules and procedures are
    also likely to be formally defined at large companies.


    Many people are more comfortable working for small companies, which often provide
    more flexible working hours and have a less formal work environment. In addition,
    the camaraderie among the members of a small staff working together to create
    new projects is often much greater than at a workplace with a large staff. However,
    salaries are likely to be lower than they would be at a larger company, and smaller
    companies may provide their employees with fewer benefits. On the other hand,
    small companies sometimes provide stock to employees. This stock may be provided
    in lieu of some of one''s salary or offered when the company starts to sell stock
    to the public. Large companies such as eBay, Microsoft, and Apple all started
    out as small companies with few employees. For those who like structure, the work
    environment at'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# WHAT TO EXPECT ON THE JOB


    small company may seem chaotic or unstable. Although large companies are less
    likely than small companies to go out of business in bad economic times, an employee
    could still be laid off if the company''s business takes a turn for the worse.


    Some people prefer to work for themselves, freelancing. This approach lacks the
    security of a regular paycheck, but it offers freelancers the opportunity to work
    on a variety of projects with many different types of companies. Freelancing can
    also provide a larger income, since a freelancer or consultant is not limited
    to a set salary.


    A person''s choice of industry also influences his or her working environment.
    There will obviously be a difference in the atmosphere of the workplace if one
    works for the military, a power plant, or an intelligence agency, compared to
    an alternative energy company, a charity, or a company developing a video game.
    It''s important for aspiring computer professionals to consider what type of environment
    they would be happy working in.


    Also, it''s important to consider personal interests. Because the use of computer
    technology is so widespread and the variety of positions is so large, it is not
    difficult to combine an interest in another area, such as art, medicine, science,
    or entertainment, with a computer science or programming career. For instance,
    if a person loves art, he or she can look for a job programming software applications
    that create computer graphics or animation. Those interested in music or film
    can look for companies that offer positions in these areas or are involved in
    broadcasting. If one is interested in a science such as geology or ecology, one
    can look for firms doing analysis in these areas. The possibilities are endless.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Although a huge variety of different jobs exist in the field of computer science
    and programming, these examples will provide some idea of what it''s like working
    in both the hardware and software sides of the field.


    # WORKING AS A PROGRAMMER


    Programmers may work alone or with others. A single programmer might create a
    small program or modify an existing one. It is more common, however, for programmers
    to work together. Large applications are created by a team of programmers. When
    programmers work together as a team, they divide the work amongst themselves.
    For instance, each programmer in the team might work on a specific part, or module,
    of the overall program.


    Before any program can be written, it is necessary to find out what the program''s
    users will need it to do. This is called requirements gathering. At this stage,
    programmers meet with management and potential users of the product to find out
    what functionality they want the program to have. They figure out how users are
    going to interact with the program. Good observation skills and good listening
    skills are required.


    It''s not enough to write a program that performs a task. The program must perform
    the task in a way that is natural and comfortable for users. Therefore, before
    any code is written, the programmer draws up a design for what the program will
    do and how it will work. Often, he or she makes mockups of screens and reviews
    them with users and managers. The programmer must get management''s approval of
    the design, as well as the budget for the project, before beginning work.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# WHAT TO EXPECT ON THE JOB


    Programmers often present several different ideas for the program management,
    which selects one.


    Programming projects are sometimes run by a project manager—an individual whose
    job it is to keep track of the progress of the project. Project managers also
    keep track of the project''s costs as they are incurred. This is done in order
    to ensure that the project stays on budget and on schedule. Programmers and project
    managers often use special project management software to track these aspects
    of the project.


    Once a project is approved, the programmer will spend most of his or her time
    writing code. This is a cyclical process. The programmer writes code, then runs
    it on test computers to see if it works the way it''s supposed to. New software
    often contains errors, later called bugs. Running the software reveals the bugs,
    which can be corrected by the programmer. Bugs are generally recorded in a log,
    along with information on how they were corrected. This way, if the same bug occurs
    in the future, the programmers will know how to fix it. Once the bug is fixed,
    the program is run again. This process is repeated until the program runs without
    generating errors. The program is then installed on company computers, where it
    can be accessed by users. The programmer may be involved in teaching users how
    to use the program.


    In addition to writing new programs, programmers may be asked to write small programs
    that can expand the capabilities of existing systems or enable them to exchange
    data with new systems acquired by the company. They may also be asked to write
    "patches" to fix problems discovered after the software is installed.


    Programmers can apply their programming skills to other areas of employment as
    well. For instance, they can go on to'
