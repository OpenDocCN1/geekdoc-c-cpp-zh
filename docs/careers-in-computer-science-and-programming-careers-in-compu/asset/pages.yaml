    to track the progress of shipments and drivers. Programmers write code code used
    by governments to monitor traffic patterns and assess issues related to traffic
    control. They also write code to model future transportation systems. For example,
    these programs model traffic patterns to establish what the best design for proposed
    highway systems would be. In addition, vehicle manufacturers employ computer science
    experts to develop the electronic components and code that control vehicles.


