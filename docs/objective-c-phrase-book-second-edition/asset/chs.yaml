  \n\nDavid Chisnall 是一位自由职业作家兼顾问。在读博士学位期间，他共同创立了 Étoilé 项目，该项目旨在 GNUstep 之上构建一个开源桌面环境，GNUstep\
  \ 是 OpenStep 和 Cocoa API 的开源实现。他是 GNUstep 的活跃贡献者，也是 GNUstep Objective-C 2 运行时库以及\
  \ Clang 编译器中相关编译器支持的原始作者和维护者。\n\n在完成博士学位后，David 在学术界“隐居”了一段时间，研究编程语言的历史。当他意识到校园外也有地方可以欣赏同样优的海景，而且不需要完成大量的文书工作时，他终于“逃离”了那里。他偶尔会回来参与涉及动态语言语义建模的项目合作。\n\
  \n\n在不写作或编程时，David 喜欢跳阿根廷探戈和古巴萨尔舞、打羽毛球和极限飞盘，以及烹饪。\n\n## 致谢\n\n\n下一个要感谢的人是 Fred Kiefer。Fred\
  \ 是 GNUstep 中 AppKit 框架实现的维护者。他对这本书进行了极其详尽（读作：吹牛毛疵的）的技术审查，发现了几处地方解释得不够理想的地方。如果你喜欢读这本书，那么\
  \ Fred 应该享有大部分功劳。\n\n最后，我需要感谢所有其他帮助这本书从我的文本编辑器送到你手中的的人，特别是最初向我提出这个想法的 Mark Taber。\n\
  \n\n作为本书的读者，你对我们是最重要的。我们重视你的意见，并想知道你喜欢什么、想看到什么以及我们在哪些方面可以改进。如果你在书中发现任何错误，请直接给我发邮件\
  \ `mark.taber@pearson.com`。\n\n当你对书有任何问题，请随时给我邮件 `mark.taber@pearson.com`。\n\n\n\
  访问我们的网站并注册这本书 [`www.informit.com/title/032174328`](http://www.informit.com/title/032174328)\
  \ 以获取错误列表。\n\n## 引言\n\n\n这本书并不是语言参考书。Apple 在 [`developer.apple.com`](http://developer.apple.com)\
  \ 网站上提供了熟练的 Objective-C 语言参考。这不是一本详细的教程；与我的另一本书《Cocoa Programming Developer’s Handbook》不同，你不会在这里找到完整的程序示例。\n\
  \n生活中最令人沮丧的事情之一就是发现书中的代码示例无法运行。书中了两类代码列表。白色背景的代码旨在说明一个简单的点。这些代码可能取决于某些隐含的上下文，不应被视为运行的、可示例。\n\
  书中的大部分代码都在灰色背景上。在每个示例的底部，你会找到该列表所属的文件名。你可以从 InformIT 网站上的书籍页面下载这些文件 [`www.informit.com/title/032174328`](http://www.informit.com/title/032174328)。\n\
  \n### 关于排版的说明\n\n\n\n\n\n第三版本是 XHTML，用于 ePub 版本。它是使用 `EtoileText` 框架创建的，该框架首先将 LaTeX\
  \ 风格标记解析为树结构，然后执行某些转换以处理交叉引用和索引，最后生成 XHTML。实现此过程的代码全部用 Objective-C 编写。\n如果你同时能够访问这两个版本，你可能会发现\
  \ ePub 版本中的代码列表看起来稍微好看一点。这是因为 `EtoileText` 使用了另一个 Étoilé 框架 `SourceCodeKit` 进行语法高亮。该工具使用了\
  \ Clang（一种现代的 Objective-C 编译器）的一部分来对代码列表进行标记。这意味着代码范围被标注的语义类型与编译器看到的语义类型完全相同。例如，它可以区分函数调用和宏实例化。\n\
  \n你可以在 Étoilé 的 subversion 仓库中找到此功能的所有代码：[`svn.gna.org/viewcvs/etoile/trunk/Etoile/`](http://svn.gna.org/viewcvs/etoile/trunk/Etoile/)\n\
  \n\n要理解 Objective-C，你需要理解其创建背后的哲学。与设计为新型类 C 语言的 C++、D 或 Java 不同，Objective-C 是一种混合语言。它是\
  \ C 的纯超集，这意味着每个有效的 C 程序也是一个有效的 Objective-C 程序，但它允许允许类似于 Smalltalk 的语法和语义。\n\nObjective-C\
  \ 的设计者之一 Tom Love 将方括号语法描述为一个路标，提醒你正在离开 C 语言并进入“对象世界（object land）”。Objective-C 的原始想法是提供封装\
  \ C 库的方法，以鼓励组件之间的松耦合。\n\n\n在较旧的运行时库中，Objective-C 类由具有公共定义的 C 结构体表示。你可以直接修改它们，甚至可以创建新的结构体并将它们注册到运行时系统中。在较新的库中，这些结构体是私有的，并有一组公共函数作为不透明类型对对其进行操作。\n\
  \n\nObjective-C 拥有类似于 Smalltalk 的对象模型。如果你来自 Java 语言，你会发现这很容易理解。如果你来自 Simula 家族语言（如\
  \ C++），你可能会觉得稍微困难一点。\n\nAlan Kay 将对象的概念描述为一种简单的归约练习。在解决问题时，你希望将其分解为简单的部分。能够运行程序某部分的简单东西与能够运行整个程序的东西是同一个东西：计算机。在\
  \ Alan Kay 的愿景中，对象是计算机的简单模型，通过交换消息进行通信。\n\n\n消息比函数调用具有更高层次的抽象。函数调用非常简单。在许多架构上，它只是单条指令。在更类\
  \ RISC 的架构上，你将返回地址推入栈中然后进行跳转。在所有情况下，目标地址都是固定的。\n\n当你发送消息时，如何处理它完全取决于接收者。最典型的方法是调用与消息同名的方法，但也有其他替代方案。代理对象可能会将消息转发给另一个对象，并在执行之前对消息参数进行某些替换。\n\
  \n\nSimula 风格的对象包含一个指向其 `vtable` 的指针（如果有父类，则指向 `vtables`）。当你调用虚函数时，编译器会创建 `vtable`\
  \ 中创建一个偏移量，然后调用该偏移量处的函数。\n\n这种差异的副作用之一是，Objective-C 和 C++ 中的指针转换具有非常不同的语义。在 Objective-C\
  \ 中，当你将指针从一个对象类型转换为另一种类型时，不会生成任何代码。转换只是对编译器类型检查器的提示。然而，在 C++ 中，指针转换会执行一些指针运算，使得传递转换后指针的代码能够在正确的位置找到\
  \ `vtable`。这意味着在 Objective-C 中，你可以将任何对象类型转换为任何其他对象类型，而在 C++ 中你需要使用一种特殊的转换。\n\n\n\
  ## 两个类型系统的故事\n\n让接触 Objective-C 的人感到困惑之一是它有两套类型系统。如果你将原始实现视为一个预处理器，这就有意义了。Objective-C\
  \ 预处理器会执行类似于 Strongtalk 的(1) 的类型检查，然后由 C 编译器执行 C 类型检查。\nC 拥有一种结构化类型系统。基本类型的类型等效性基于两个类型是否具有相同的表示。复杂类型从不被认为是等的。\n\
  \nObjective-C 增加了代数类型系统。对象的类型由它的签名定义：它声称响应的消息。你可以隐式地将 Objective-C 对象转换为其父类，因为它保证响应父类理解的所有消息。\n\
  \n你可以显式地将对象转换为其他类型。例如，你可以将字典对象转换为数组对象。只要你向它发送两者都理解的消息，这样做就可以运行。\n## C 就是 Objective-C\n\
  \nObjective-C 最重要的特性之一是它是 C 的纯超集。你可以将 C 视为一种嵌入在 Objective-C 中用于底层任务的领域语言，并将 Smalltalk\
  \ 的子集视为嵌入在 Objective-C 中用于高级任务的领域语言。\n\n使用纯 C 解决问题并没有错误。许多人在学习 Objective-C 时犯的错误之一是假设他们必须停止使用\
  \ C。对于很多事情，C 的解决方案是正确的。\n> * * *\n\n> \n\n\n> \n\n> > Objective-C 还有一个姐妹语言 Objective-C++，它与\
  \ C++ 的关系就像 Objective-C 与 C 的关系。Objective-C++ 是 C++ 的纯超集，允许你在 Objective-C 对象中调用\
  \ C++ 代码，反之亦然。由于对象模型完全不同，你不能用 C++ 子类 Objective-C 类，反之亦然；但你可以将 Objective-C 对象的指针作为\
  \ C++ 对象的字段，并将 C++ 对象的指针作为 Objective-C 对象的实例变量。\n\n\n> * * *\n\n你可以在 Cocoa 框架中看到这一点。并不是一切都是对象。如果你请求字符串中的一段字符范围，你将使用\
  \ `NSRange` 结构体。这是一个 C 结构体——不是 Objective-C 对象——包含一个位置和一个长度。点、矩形以及许多其他事物以类似的方式表示。如果这些是对象，那么将消耗更多内存，让操作它们变慢，并且不会带来任何灵活性。\n\
  \n\n\n\nIngalls 的对象导向测试指出，你应该能够创建一个新类型的整数，并将其用于在屏幕上为窗口定位。Objective-C 没有通过这项测试，但在现实世界中，这并不是一个非常有用的例子，因为在大多数情况下，设计新类型的整数会破坏许多期望整数具有标准行为程序。\n\
  在 Objective-C 中，在不需要动态行为的情况下，你并不需要使用动态行为（例如晚绑定和多态）。\n\n## 语言与库\n\n\nObjective-C\
  \ 继承了来自 `C` 的流控制，但所有的动态行为都由运行时库提供。这与 `C` 或 `C++` 不同。你可以编译一个不调用 `libc` 或 `libstdc++`\
  \ 中任何函数的独立 `C` 或 `C++` 二进制文件。然而，每一个不是纯 `C` 程序的 Objective-C 程序都必须链接 `libobjc` 才能运行。\n\
  \n该库传统上提供三个类：一个简单的根类、一个用于常量字符串的类和一个用于协议的类。其中第一个提供了对象分配的功能，这在 `C++`、`Java` 以及类似的环境中是语言的一部分。另外两个是可以由编译器生成的类。\n\
  \n\n`OpenStep` 定义了两个框架：`Foundation Kit` 和 `Application Kit`，通常缩短为 `Foundation` 和\
  \ `AppKit`。`Foundation Kit` 提供了开发者所有应用程序所需的核心功能，如集合类、运行循环、通知传递、OS 抽象等。`Application\
  \ Kit` 构建在其之上，并为构建图形化应用程序提供额外支持。\n\n`Sun` 的实现在初始发布后没有进行太多开发。`Apple` 在几年后收购了 `NeXT`，并将\
  \ `OpenStep` 环境重命名为 `Yellow Box`，将其作为开发者环境同时发布在 `Rhapsody` 和 `Windows` 上。随着 `OS\
  \ X` 的发布，它再次被重命名，这次更名为 `Cocoa`。\n`GNUstep` 项目仍在活跃开发，但现在追踪的是 `Apple` 对 `OpenStep`\
  \ 规范的增强，以及核心规范的更新。这意味着 `Foundation` 框架几乎可以在任何地方使用，尽管 `GNUstep` 的实现缺少了一些最新的类和方法。\n\
  \n你可以将 `Foundation` 框架看作 Objective-C 的标准库。它提供了许多非平凡程序所需的特性。Objective-C 2 的几个功能是专门设计为与\
  \ `Foundation` 配合工作的。你可以在没有 `Foundation` 的情况下使用它们，但前提是你实现了一个某种等效的内容。\n\n## Objective-C\
  \ 的历史\n“面向对象”一词由 `Alan Kay` 在 20 世纪 60 年代创造，`Smalltalk` 是他和等人为了演示这种编程风格而创建的语言。`Smalltalk`\
  \ 开发于 70 代，最广泛的版本发布于 1980 年。\n\n然而，`Smalltalk` 非常慢。要正确运行它，你需要一台强大的计算机，例如 `Xerox\
  \ Alto`，配备 512KB 内存，理想情况下至少有一个 2MHz 的处理器。\n\n`Brad Cox` 喜欢 `Smalltalk` 的想法，但他想要一种可以在人们负担得起的计算机上语言。他的想法是将\
  \ `Smalltalk`（一种鼓励封装、松耦合和代码复用的高级语言）与 `C` 结合。`C` 处于光谱的另一端，几乎没有封装，没有动态分发，但有一个巨大的优势：它很快。\n\
  `C` 深度依赖 `PDP-11` 指令集。一个非常天素的 `C` 编译器就能产生相当快的代码。这在今天也是如此。像 `LLVM`、`XLC` 和 `ICC`\
  \ 等编译器在优化上投入了大量精力，但几乎不做优化的 `PCC` 仍然能产生相当快的代码。\n\n`Brad Cox` 和 `Tom Love` 在 1986\
  \ 年创立了 `StepStone`，销售一种基于 `Brad` 早期面向对象预编译器的产物。该产品——`Objective-C`——是一个预处理器和一个小的\
  \ `Objective-C 运行时库`。预处理器生成 `C` 代码，你可以用你平台的 `C` 编译器对其进行编译。直到 2010 年，我还遇到一家在商业产品中使用\
  \ `StepStone` 编译器的公司。\n\n\n`GNU` 项目编写了运行时库的替代品，但进行了一些更改。其中之一是 `GNU` 运行时中的选择器关联了类型。在\
  \ `NeXT`（以及 `Apple`）平台上，选择器只是字符串。这意味着 `GNU` 运行时可以在运行时捕获由程序员错误引起的堆栈损坏。\n\n另一个更改是消息发送机制。当你使用\
  \ `NeXT` 运行时发送消息时，编译器会将消息发送转换为对 `objcSend` 函数的调用。该函数查找方法并调用它。遗憾的是，无法在 `C` 中实现这个函数。它必须为每个平台的每种调用约定用汇编编写。`GNU`\
  \ 的解决方案是用 `objc_msg_lookup()` 函数替换它，它返回一个函数指针。这稍微慢一点，但意味着相同的代码可以在所有平台上运行。\n\n\n\n\
  \n随着 iOS 5 和 Mac OS X 10.7 的发布，Apple 放弃了版本号，开始使用编译器版本来描述特性。在发布之前，这组新特性被称为 `Objective-C`\
  \ 2.1，但 Apple 的营销部门决定不在公开场合使用这个名称。这些新特性包含了对数据隐藏的更好支持，使得更容易将实现细节从公共头文件中移出），以及自动引用计数（ARC），它结合了大部分（但并非全部）垃圾回收和手动引用计数的优点，同时避免了这后者的大多数缺点。\n\
  \n\n迫使 NeXT 将 `GCC` 的 Objective-C 前端作为自由软件发布，对于自由软件基金会来说算是一次公关上的胜利。遗憾的是，从长期跨平台支持的角度来看，这种做法并不理想。NeXT\
  \ 发布的代码非常糟糕，而且在过去的十年里，它在很大程度上被 `GCC` 团队忽略了。这在 `GCC 4.6` 之后有所改善，但仍然落后于当前的 Objective-C\
  \ 版本大约五年。\n\n`GCC` 对 NeXT 时代的 Objective-C 有中等程度的支持，同时也支持新的异常处理关键字。`GNUstep` 项目提供了\
  \ `Foundation` 和 `AppKit` 框架的实现，这些是 NeXT 和 Mac 开发的核心。\n\n\n只是 Objective-C 实现的一半。另一半是运行时库。`GNU\
  \ runtime` 是配合 `GCC` 开发的，并没有实现运行 Objective-C 2 所需的功能。为了解决这个问题，我在 `Étoilé` 的一部分中写了一个框架，它实现了大部分缺失的功能，并实现了\
  \ Apple 在 OS X 10.5 中引入的公共运行时 API。\n\n该框架现在是 `GNUstep` 的一部分，用于与旧版本的 `GCC` 运行时配合。我还写了一个新的运行时，支持旧的\
  \ `GCC ABI` 和一种新的非脆弱性 ABI，它现在的功能上与 OS X 平等。它是作为 `GNUstep` 项目的一部分开发的，被称为 `GNUstep\
  \ runtime` 或 `libobjc2`。\n\n\n如果你使用 `GCC` 版本的运行时，配合 `GNUstep` 中的 Objective-C 2 框架，那么你可以获得一些功能，例如快速枚举和声明属性，但你无法获得新\
  \ ABI 的任何用处。`GCC 4.6` 及更高版本还附带了更新的运行时，提供了相同级别的兼容性，但不需要 Objective-C 2 兼容框架。\n\n##\
  \ 编译 Objective-C 程序\n![Image](img/00010.jpg)\n\n`Clang` 前端旨在作为 `GCC` 的无缝替代品，因此在某些指令中看到\
  \ `gcc` 的地方，都可以将其替换为 `clang`。在 OS X 上，`GCC` 安装在 `/usr/bin/gcc`，因此它在你的路径中。在稍旧版本的\
  \ XCode 工具中，`Clang` 安装在 `/Developer/usr/bin/clang`，因此你可能需要指定完整路径或将此位置添加到路径中。在其他平台上，如果安装了它们，你通常可以在路径中同时找到它们。\n\
  \n如果你熟悉使用其中任一个编译器编译 C 或 C++，你会发现编译 Objective-C 非常熟悉。如果你只需在命令行上指定一个源文件，编译器将尝试将其编译并链接为可执行文件。\n\
  > 注意\n> Apple 在其 2011 年开发者大会上的演讲表示“GCC 将消失”。Apple 不再积极开发 `GCC`，因此它缺乏对最近添加的语言特性的支持，可能不会在未来的\
  \ Apple 开发者工具版本中发布。Apple 在编译器方面的营销相当令人困惑。OS X 10.7 发布了被他们描述为 Apple LLVM 编译器 3.0\
  \ 的东西。这是 `Clang` 在大约 2.9 和 3.0 版本发布之间的一个快照。如果你运行 `clang –version`，你将在输出中看到类似“based\
  \ on LLVM 3.0svn”的内容。\n\n大多数情况下，这并不可行。Objective-C 程序需要其他其他库。在 OS X 上，编译器驱动程序支持一个额外选项\
  \ `-framework`，它指定一个包含头文件和共享库的框架包。这既是链接器选项也是预处理器选项。\n书中的示例都使用了 `Foundation` 框架。在其他平台上，这通常由\
  \ `GNUstep Base` 库实现。这些平台通常不支持 `-framework` 选项。`gnustep-config` 工具提供了替代方案。它将打印编译\
  \ Objective-C 所需的编译器选项，以及链接到基础（Foundation）或 GUI（AppKit）库所需的选项。\n\n就像 C 和 C++ 一样，你可以指定\
  \ `-c` 仅编译文件而不链接，并使用 `-o` 指定输出。如果你正在编译多个文件，你可能需要使用比运行编译器高级一点的东西。在 OS X 上，你可能会使用\
  \ `XCode` IDE。这让你能够创建不同类型的项目。如果你需要在其他平台上编译这些，可以在 GNUstep 中找到名为 `pbxbuild` 的工具。这也适用于\
  \ OS X，无论你选择哪种方案，都不应该出现由构建系统引起的问题。\n\n## 2. Objective-C 基础\nObjective-C 正如其名称所示，为\
  \ C 增加了对象。具体来说，遵循 Smalltalk 模型的对象是类的实例。对象总是分配在堆上，因此总是通过指针引用。\n\nObjective-C 是 C\
  \ 的一组非常小的扩展。Smalltalk 的第一个版本创建是为了打赌可以在一张纸上指定一门通用语言。Objective-C 对 C 的扩展比 Smalltalk\
  \ 稍微复杂，但并不多。\n\n如果你已经熟悉 C，学习 Objective-C 语言只需要下午——如果你已经理解 Smalltalk 风格的对象模型，时间更短。当然，这带有误导性。如果学习\
  \ Objective-C 真的那么简单，你买关于它的书会觉得被坑了。和 Smalltalk 一样，Objective-C 语言如此简单很大程度上是因为它将大部分委托给了库。\n\
  原始 Objective-C 的标准库非常小。它旨在与 C 库一起使用，而不是作为独立的语言。现在，大多数 Objective-C 代码使用基于 NeXT Foundation\
  \ 框架的（无论是 Apple 的 `Foundation` 或 `GNUstep Base` 库）作为标准库。这提供了引用计数内存管理、标准数据结构、转发机制等功能。\n\
  \n你认为是 Objective-C 语言组成的大部分实际上是由 Foundation 框架提供的。可以在不使用 Foundation 的情况下使用 Objective-C，但那是人们为了证明自己能做到而做的，而不是因为这真的是一个明智的做法。\n\
  \n\n\n\n在 Objective-C 的早期实现中（它从 Objective-C 生成纯 C 代码），类被转换为描述对象布局的结构定义。你仍然可以在 GCC\
  \ 错误信息中看到这种遗留，它偶尔会将对象称为“结构（structures）”。\n\n在 C 语言中，你需要显式的类型转换才能将任何结构指针转换为其他类型的结构指针。Objective-C\
  \ 对这一规则稍微放宽。任何对象的布局都由根类中的`instance variables (ivars)` 定义，然后由层级结构中后续每个类中的实例变量定义。子类只能添加新的实例变量，而不能删除或重新排列父类中的变量。这意味着从内存布局的角度来看，将指向某个类实例的指针转换为指向其父类实例的指针总是安全的。从对象类型系统的角度来看，这也是安全的；任何子类始终能够响应父类响应的所有消息。\n\
  Objective-C 中的对象指针通过类名识别，后面紧跟一个星号（*），就像 C 中的结构指针一样，但不需要 `struct` 关键字。你总是可以隐式地将某个类实例的指针转换为其父类实例的指针。这对于间接父类同样有效。例如，`NSMutableArray`\
  \ 是 `NSArray` 的子类，而 `NSArray` 是 `NSObject` 的子类。你可以将 `NSMutableArray` 转换为 `NSArray`\
  \ 或 `NSObject`。然而，反向转换则需要显式转换。\n\nObjective-C 还引入了一种新的指针类型：`id`。在转换规则方面，它粗体类似于 `void*`。你可以隐式地将任何对象指针转换为\
  \ `id`，也可以隐式地将 `id`\n\n转换为任何对象指针类型。\n如果你习惯了像 Smalltalk、Ruby 或 Python 等无类型语言，那么可能会倾向于只使用\
  \ `id` 类型。这在大多数情况下是安全的，尽管有一个例外。Objective-C 使用消息的名称进行查找，而不包含任何类型信息。这意味着你可以在两个类（不同的类）中声明两个名称相同但类型不同的方法。当编译器生成消息发送指令时，它使用接收者的类型来确定参数的类型。这反过来定义了调用栈帧（call\
  \ frame）的布局。当在任何地方只有一个以此名称发布的方法时，就不需要类型信息。如果你想从对象外部访问实例变量，也需要静态类型，但通常这被认为是不良的风格。\n\
  \n虽然不是强制指定静态类型信息，但通常是一个好主意。除了刚才提到的那种情况外，它不会影响代码生成，但它会被编译器的语义分析阶段使用。这有助于在编译时捕捉一些错误。例如，如果你尝试将一个对象添加到\
  \ `NSArray` 实例中，编译器会警告接收者不响应相关消息。这让你检查自己是否真的想用 `NSMutableArray`，或者是否需要为数组创建一个可变副本。\n\
  \n> * * *\n> > 注意\n\n> > > 在 C++ 中，通常使用 `const` 关键字来描述对象为不可变的。在 Objective-C 中，`const`\
  \ 实际上是没用的。它规定了对象的实例变量可能不能被直接修改，但这种操作很少执行。它不会改变可以发送给对象的消息，因此声明为 `const` 的对象仍然是可变的。\n\
  \n> > > 在大多数需要区分可变和不可变实例的情况下，Objective-C 程序员使用*可变子类模式（mutable subclass pattern）*，即一个不可变类拥有一个可变子类。你可以隐式地将可变版本转换为不可变版本，但你无法将不可变实例变为可变。\n\
  > * * *\n\n`Class` 类型类似于 `id`，但它可能指向类。在 Objective-C 中，类也是对象，所以你始终可以使用 `id` 代替 `Class`，就像你可以用\
  \ `id` 代替特定的对象类型一样。\n\n标准 Objective-C 头文件中还定义了另外两种类型。`SEL` 类型用于选择器（selectors），我们将在本章稍后部分介绍。\n\
  最后一个是 `IMP`，它代表*实例方法指针（Instance Method Pointer）*。这种类型是指指向 Objective-C 方法的指针。大多数情况下，你根本不需要使用这种类型。它仅用于\
  \ Objective-C 的某些非常动态的功能以及优化。我们将在第 19 章中查看你可能会使用它的地方。\n\n### 发送消息 (Sending Messages)\n\
  \n![Image](img/00012.jpg)\n> 源自：exampleMessages.m\n\nObjective-C 为 C 语言增加的最重要的特性就是发送消息。正如我在上一章中提到的，消息是一种高级的流控制结构。\n\
  \n这是 Objective-C 中往往让来自 C++ 和 Java 等语言的人士感到畏惧的部分，因为其语法直接源自 Smalltalk，对于更熟悉 C 语法的人来说非常诡异。这是刻意为之。C\
  \ 语言中没有任何操作的行为与 Objective-C 的消息发送相同，因此引入新语法突显了你也拥有了新的语义。记住 Tom Love 描述它为一种混合语言，在纯\
  \ C 部分和“对象领域（object land）”之间有清晰的语法分离，后者具有类 Smalltalk 的语法来配合类 Smalltalk 的语义。\n最简单的消息发送不带任何参数。这方面的例子可能是发送给数组的\
  \ `-count` 消息。注意消息名称前的减号。这是 Objective-C 文档中使用的约定，用于表示发送给实例的消息。加号用于表示发送给类的消息，例如 `+new`\
  \ 或 `+array`。\n\n```\nsize = [anArray count];\n```\n这段代码获取数组的元素数量并将其存储在变量 `size`\
  \ 中。在 C++ 或 Java 等语言中，等效代码应该是：\n\n```\nsize = anArray.size();\n```\n在 Objective-C\
  \ 中，如果 `anArray` 是一个结构体而 `size` 是一个函数指针，就会使用相同的语法。由于这与向对象发送消息完全不同，设计者认为使用相同语法会引起混淆。\n\
  \n带一个参数的消息看起来非常相似。如果你想向 Objective-C 数组添加一个对象，你会使用：\n\n```\n```\n\n当消息有多个参数时，情况开始变得有些不同。和小\
  \ Smalltalk 一样，每个参数都有独立的名称，所以会在特定索引插入对象，例如：\n\n```\n```\n\n这使得理解基础语法的 Objective-C\
  \ 代码变得非常易读，因为每个消息都会告诉你每个参数的作用。如果你在文档中看到这种消息，它会被写成：`-insertObject:atIndex:`。你可以从两个冒号看出它有两个参数，并从冒号之前的文本看出这些参数是什么。\n\
  \n如果你向一个没有实现方法的对象发送消息，将使用一系列回退方法。在默认实现中，最后一个方法会抛出一个异常（你可以在运行时捕获并绕过它）。你也可以在发送消息之前询问对象它是否知道如何处理。我们将在第\
  \ 19 章中查看如何操作。\n\n\n\n\n> 如果你向 `nil` 发送消息（一个定义为 `(id)0` 的常量），你不会得到错误。相反，你会得到一个 0\
  \ 值。这非常有用，因为你可以向上一个消息发送的结果发送一串消息，如果其中某一个中间返回了 `nil`，其余部分仍然可以工作。这消除了在 Objective-C\
  \ 代码中对 `NULL` 进行大量测试的需求。\n> 向 `nil` 发送返回结构体的消息的行为是未定义的。如果你在 `SPARC` 上使用 `GCC` 编译的代码中执行此操作，你的程序将因非法指令信号（illegal\
  \ instruction signal）而崩溃。在 `OS X` 上，结构体将被填充随机值，就像栈上未初始化的结构体一样。在向对象发送返回结构体的消息之前，你应该始终小心检查该对象是否为\
  \ `nil`。\n\n在 Objective-C 中，像 Smalltalk 一样，类也是对象。你可以向类发送消息，就像向对象发送消息一样。当你执行此操作时，使用类名作为接收者。向类发送消息的最常见场景是创建该类的实例。在\
  \ Objective-C 中，类负责创建自己的实例。在 `C++` 或 `Java` 中没有等价的 `new` 关键字。最接近的是 `+new` 消息，你可以将其发送给类。例如，你可能会这样创建一个新的可变数组：\n\
  \n```objc\n```\n\n尽管这看起来非常相似，但语言并没有保证此消息将执行什么。某些类可能会创建子类的实例，而某些类可能会返回一个单例实例。仅仅是按照惯例，它才会给你一个接收者的新实例。\n\
  \nObjective-C 的最新版本引入了*方法族*（method families）的概念。这些是某些方法预期遵循的隐式合约。例如，`+new` 方法预期返回一个指向接收者实例的*所有权引用*（owning\
  \ reference）。在上面的代码段中，编译器会期望它返回一个可变数组。如果你尝试将它赋值给 `NSMutableDictionary` 变量，那么它将生成一个警告。\n\
  ### 理解选择器（Selectors）\n\n![Image](img/00013.jpg)\n\n> 来自：selector.m\n在 `C` 中，你通过名称引用函数。函数名也可以用作该函数的指针。当你将\
  \ `C` 代码编译为汇编时，函数变成一个标签，可以通过调用指令或指令序列到达。\n\nObjective-C 的流程控制更具动态性。你可以获取方法的指针，但在大多数情况下，你希望向对象发送一个特定的消息，而不是调用一个特定的方法。如果你调用一个特定的方法，你必须绝对确定接收者确实是你预期的那个类。\n\
  \n在 `C` 中，你经常将函数指针作为其他函数的参数。被调用的函数将调用传递给它的函数。这的一个常见例子是 `C` 标准库中的 `qsort()` 函数。它对数组进行排序，并使用函数来定义项目之间的顺序。\n\
  在 Objective-C 版本中，你可能希望通过向对象发送 `-compare:` 消息来比较对象，而不是使用函数指针。理想情况下，你希望将要发送的消息名称传递给实现排序的方法。\n\
  \n消息的名称被称为*选择器*（selector）。它是消息名称的抽象表示，并具有 `SEL` 类型，这是一种不透明类型。你可以使用 `@selector()`\
  \ 指令创建一个选择器。它接收一个消息名称的常量字符串表示并将其转换为该消息的选择器。\n\n你可以使用选择器通过名称调用方法，正如我们在 第 19 章 中看到的的那样。Foundation\
  \ 框架中的许多方法接受选择器作为参数。它们的用法与接受函数指针作为参数的 `C` 函数类似，用于延迟执行、回调、集合排序等。\n> 注意：Apple 和 GNU\
  \ 的 Objective-C 实现之间的主要区别之一是，GNU 实现使用了*类型化选择器*（typed selectors）。选择器是消息发送中查找方法使用的名称。在\
  \ GNU Objective-C 中，它们还包含了消息参数类型的编码。这允许函数检查它们是否是用正确的参数类型被调用的，这对于分布式对象和其他一些其他情况非常有用。\n\
  \n> GNUstep 运行时现在默认使用依赖于类型的分发（type-dependent dispatch），这意味着方法查找取决于选择器的类型编码。发送与接收者不匹配的类型签名的消息是未定义的行为。\n\
  \n### 声明类\n![Image](img/0014.jpg)\n\n> 来自：integer.m\n\n当你创建一个新类时，你需要做两件事：描述它的公共接口并编写它的私有实现。你需要三个\
  \ Objective-C 关键字：`@interface`、`@implementation` 和 `@end`。\n注意所有 Objective-C 关键字都以\
  \ `@` 符号开头。这是因为该符号在 `C` 标识符中是不允许的。对比 `C++`，后者引入了如 `class` 等标识符，这破坏了任何使用 `class`\
  \ 作为变量名。\n\nObjective-C 继承了 C 的编译模型，其中编译器期望单个文件，而分离通过合并文件来实现。按照惯例，Objective-C 类的接口放在头文件中（扩展名为\
  \ `.h`），实现放在 `.m` 文件中。没有人记得为什么选择 `.m`。Objective-C 的设计者建议它可能代表“模块”（module）、“方法”（methods）或“消息”（messages）。\n\
  \n由于头文件是在 Objective-C 编译器看到之前由预处理器插入编译单元的，这种分离并没有被强制执行。`C` 中的不透明数据类型也是如此。\n\n\n\
  现在，有了非脆弱 ABI（non-fragile ABI），你可以向子类隐藏私有实例变量。对它们的引用都通过一个间接层。偏移量现在是一个变量，而不是编译时常量。新的编译器允许在\
  \ `@implementation` 上文中定义实例变量，也可以在 `@interface` 中。\n\n默认情况下，Objective-C 实例变量是受保护的，这意味着它们只能由类或其子类访问。如果你给它们加上\
  \ `@private` 前缀，它们只对该类可用；加上 `@public`，则可以在任何地方访问。这非常罕见。运行时对访问的检查很少，而且有几种机制可以绕过访问控制，因此通常将所有内容保持保护状态，仅在私有类中将实例变量设为公共。\n\
  \n\n\n\n\n\n\n> `@interface ClassName : Superclass <protocols>`\n\n类名紧随 `@interface`\
  \ 关键字之后。接下来是一个冒号，然后是父类的名称。你可以设计新的根类，但要正确地做到非常复杂，因此大多数情况下，你只需要使用 `NSObject` 或 `NSProxy`\
  \ 作为你的父类。\n\n\n> **注意**\n> 在较新的编译器版本中，你可以在类接口声明前加上 `__attribute__((weak_import))`。这使得所有对该类的引用都变成弱引用（weak）。如果你向该类发送消息而它未被链接，那么这等同于向\
  \ `nil` 发送消息。以这种方式导入的类的子类在父类加载之前将不会解析。这允许你定义一个继承自可选加载的包（bundle）中类的类。\n\n接下来是实例变量列表。它遵循与\
  \ C 语言中定义结构相同的语法。一个只包含实例变量而没有方法的简单类定义如下：\n\n@interface NoMethods : NSObject\n{\n\
  \  int integer;\n  NSObject *object;\n  float floatingPoint;\n@end\n```\n\n任何在 C\
  \ 结构体定义中有效的内容在这里都是有效的。如果你在使用 Objective-C++，你还可以添加指向 C++ 对象的指针以及具有简易构造函数的 C++ 实例。\n\
  \n\n```objc\n+ (id)new;\n- (void)appendString:(NSString*)aString;\n```\n第一个方法声明前的加号表示这是一个附加到类上的方法（类方法）。你可以向类发送\
  \ `+new` 消息，它将为你返回一个对象指针。`id` 类型是 Objective-C 引入的一种新类型，类似于 C 语言中的 `void*` 类型，但限制为指向\
  \ Objective-C 对象。\n\n注意，返回类型和参数类型使用的语法与类型强制转换相同。这突显了消息发送（message sends）与 C 函数调用之间的另一个重要区别。方法被编译为一个函数，并通过一个在运行时查找的指针进行调用。当你发送消息时，编译器会隐式地将方法指针强制转换为由这些类型描述的函数。这种语法也旨在强调参数并不非要是\
  \ `NSString*`；它只需要是你可以强制转换为 `NSString*` 的东西。\n\n类定义的实现部分（implementation）要简单得多。它以\
  \ `@implementation` 指令开头，包含了类所有方法的定义，如下：\n```objc\n@implementation NewClass\n+ (int)classVersion\n\
  {\n  return 2;\n- (void)log\n{\n  fprintf(stderr, \"log message received\");\n}\n\
  @end\n\n需要注意的一个重要点是，你不需要声明类实现的所有方法。在类接口中未声明的方法被视为私有的。调用它们将产生编译时警告，并且该类的未来版本可能会完全停止响应它们。\n\
  \n### 使用协议 (Using Protocols)\n\n\n在 Objective-C 2 中，协议现在是唯一的。\n\n你现在可以通过名称获取协议并对其进行检查。这在旧模型中时灵有效，但它取决于编译器是否已经输出了它的完整定义。\n\
  \n\n```objc\nif (![delegate conformsToProtocol:@protocol(DelegateProtocol)]) {\n\
  \  testIndividualMethods = NO;\n}\n\n你可能在设置代理（delegate）的方法中使用类似下面的代码段。如果代理符合协议，则保证它实现了该协议中的所有方法，因此你不需要测试每一个。如果它不符合，你可能需要在发送每条消息之前对它进行测试。\n\
  \n协议为你提供了编译时和运行时的类型检查。你可以通过在类型名称后的角括号中放入名称来要求对象符合某个协议。这里是一些示例：\n\nid <NSCopying>\
  \ a;\nid <NSObject,NSCopying> b;\nNSObject<NSCopying> *c;\n```\n\n\n### 为类添加方法 (Adding\
  \ Methods to a Class)\n\n![为类添加方法](img/imagepath)\n\n\n分类定义的结构与类定义相似。分类不能更改类的实例变量，也不能更改其父类，因此\
  \ `@interface` 指令中的这些部分被省略了。分类名称被添加到类名后的括号中。在前面的代码中，你可以看到一个简单的分类接口和实现，它为 `NSObject`\
  \ 添加了 `-log` 方法。\n\n注意，分类的接口和实现都是可选的。在下一节中，我们将看看为什么指定了没有对应实现的分类接口是有用的。指定了实现而不指定接口对于你只想替换对象的方法是有用的。在分类中声明的方法将替换类中定义的同名方法。这种顺序是有保证的，因此如果发生冲突，分类将始终优先。如果两个分类定义了相同的方法，则使用的哪一个是不未定义的。\n\
  \n\n\n\n`collection.m` 示例展示了这种方法的（非常）简化版本。`Collection` 协议被添加到 `NSSet` 和 `NSArray`\
  \ 类中。如果你向这两个类中的任一实例发送 `-conformsToProtocol:` 消息，并以 `@protocol(Collection)` 作为参数，它将返回\
  \ `YES`。\n\n\n在最新的 Objective-C 编译器中，你还可以在类扩展内部声明实例变量。你也可以在 `@implementation` 上文中声明实例变量，就像你在\
  \ `@interface` 上文中通常做的一样。这两种机制允许你将实现细节从公共头文件中移出。\n\n如果你正在声明私有实例变量，那么你应该在 `@implementation`\
  \ 上文中声明它们。这可以确保任何不应该访问这些变量的代码都不会意外访问。如果你正在声明应该在同一个库内访问的公共或保护性实例变量，那么你应该在私有头文件的类扩展中声明它们。在新代码中，你应该只在公共头文件中声明预期会被代码用户直接访问的实例变量。\n\
  \n\n![Image](img/00017.jpg)\n\n> 来自：`informalProtocol.m`\n\n\n在 Objective-C 2 中，协议可以包含声明为可选的方法，但在之前，使用分类来实现非正式协议是常见做法。如果你为\
  \ `NSObject` 创建了一个分类接口，但没有为它提供接口定义，那么编译器将假设每个 `NSObject` 子类都响应接口中声明的消息，因此当你在向对象发送其中任何一个消息时，它不会生成警告。\n\
  \n当然，并不是每个对象都真的会实现这些方法，因此你需要确保在发送消息之前使用 `-respondsToSelector:` 来测试对象是否真的实现了该方法。\n\
  \n\n![Image](img/00018.jpg)\n\n> 来自：`synth.m`\n\n\n> * * *\n\n> \n\n> \n> > 点语法是\
  \ Apple 对 Objective-C 所做的最具争议的改变之一。它通过重用结构字段访问器语法来发送消息，违反了 Objective-C 的核心原则之一——新语义应该始终使用新语法。点语法也有助于隐藏坏设计；它鼓励间接引用，而这违反了迪梅特法则（Law\
  \ of Demeter）。\n\n> * * *\n\n\n> * * *\n\n> \n\n> \n> “属性”一词在 Smalltalk 文档中用于指任何可以通过访问器操作的实例变量。它在稍旧的\
  \ Objective-C 文档中也以同样的方式使用。指定*声明*属性（declared properties）而非仅仅属性，有助于减少这种歧义。\n\n> *\
  \ * *\n\n\n属性默认是原子的（atomic）的。这会产生一些开销，因此你可能希望在你创建的大多数属性中指定 `nonatomic`。访问器方法的原子性并不能让对象线程安全，通常情况下使用更高级的锁机制来在线程之间共享对象会更好。\n\
  \n考虑 `nonatomic.m` 示例。它声明了一个原子属性。然后你在代码中使用了一个单次递量操作。你可能期望这是一个原子递量，但事实并非如此。这条单一语句会扩展为两次消息发送，其之间插着一次加法。\n\
  \n\n> 来自：`nonatomic.m`\n\n在属性的上下文中，原子的意思是是在不使用垃圾回收的情况下，设置方法和获取方法将尝试获取同一个锁，这样如果你在一个线程中设置而在另一个线程中获取，对象就不会被意外释放。在垃圾回收模式下，以及对于非对象属性，*nonatomic*\
  \ 没有意义。\n\n\n> * * *\n\n> \n\n> > > 有时，你可能想要一个读写属性，但在公共接口中仅设为只读。类扩展提供了这种机制。如果你在主接口中将其声明为只读，但在类扩展中重新声明为读写，那么主\
  \ `@implementation` 中的 `@synthesize` 指令将创建 setter 和 getter。然而，在类扩展不可见的任何尝试使用 setter\
  \ 都会导致编译错误。\n\n> * * *\n\nsetter 行为有几种选项。最简单的（也是非对象类型的唯一选项）是 `assign`。它通过简单的赋值来设置值。对于非对象类型，这只是复制值。对于对象，情况要稍微复杂一些。\n\
  各种属性访问器的具体语义取决于内存管理模式。在引用计数（手动或自动）中，`assign` 在你设置值时执行简单的赋值。当你访问值时，它对于非原子属性会返回指针，对于原子属性则会保留（retain）然后自动释放（autorelease）。\n\
  \n下一个选项 `retain` 只在引用计数模式下有意义。在设置 `retain` 属性时，新值会被保留，旧值会被释放。在垃圾回收模式下，`assign` 和\
  \ `retain` 是等价的。\n\n`copy` 属性类似于 `retain` 属性。在设置它时，新值接收的是 `-copy` 消息而不是 `-retain`。你应该对具有不可变类型的属性使用它。例如，如果你声明了一个\
  \ `NSString*` 属性，那么使用 `copy` 可以确保你拥有一个不可变的字符串，即使有人用 `NSMutableString*` 实例来设置它。不可变对象从\
  \ `-copy` 中返回自身，因此只有在确实需要确保属性不被意外修改时，才会创建一个副本。\n\n\n\n如果你使用自动引用计数或垃圾回收（我们将在第 3 章中详细介绍），那么你可以使用\
  \ `weak`。`weak` 属性不会防止值被删除，并在当所有引用都消失时将其设置为 `nil`。\n\n\n仅对对象有意义的属性类型也可以用于带有 `__attribute__((NSObject))`\
  \ 的 C 指针类型。该属性告诉编译器 C 类型实际上是一个 Objective-C 对象。Core Foundation 对象和 blocks（参见 Using\
  \ Blocks）是这种类型的常见例子。它们在头文件中被暴露，因此不会显式地暴露 C 类型，但在 Objective-C 中可以被使用。\n\n一旦你声明了属性，就必须提供实现。属性只是定义访问器方法的一种。属性\
  \ `a` 通过 `-a` 和 `-set:` 方法实现。第一个返回属性的值，第二个将其设置为新值。\n\n\n或者，你可以使用 `@synthesize` 让编译器为你生成访问器方法。合成的属性方法引用与属性同名的实例变量。这些方法调用带有实例变量偏移的运行时函数以及属性类型。通常情况下，你应该尝试使用\
  \ `@synthesize`。编译器将为你的当前编译模式生成正确的方法。这让你轻松地在手动引用计数、自动引用计数和垃圾回收之间切换。你不需要修改任何访问器方法；编译器会为你完成。\n\
  \n在旧的 Objective-C ABI 中，实例变量需要在 `@interface` 中声明，以便编译器将其转换为 C 结构。在非脆弱 ABI 中，情况并非如此。`@synthetic`\
  \ 指令可以创建不是类公共接口部分的实例变量。\n\n\n![Image](img/00020.jpg)\n\n> 来自：object.m\n\n\n在 C++\
  \ 中，`this` 关键字几乎等同于 Objective-C 中的 `self`，但有一个关键区别：`self` 不是关键字。它是参数的名称。在 C++ 中赋值给\
  \ `this` 会导致错误。在 Objective-C 中赋值给 `self` 是允许的。\n\n第二个隐藏参数是消息的*选择器*（selector）。这是转发等功能正常工作所需要的。当你向一个不知道如何处理的对象发送消息时，它将构造一个封装消息的\
  \ `NSInvocation` 对象，然后将其传递给 `-forwardInvocation:`。\n\n\n`super` 伪变量稍微复杂一些。它只在作为消息的接收者时有效。它将生成一个消息，其中\
  \ `self` 是接收者，但方法是在父类而非当前类中查找的。这就是你调用覆盖的方法的方法。向 `super` 发送消息使用不同的方法查找函数，该函数接受指向\
  \ `objc_super` 结构的指针作为参数。该结构包含了目标类和目标对象。\n\n父类在编译时是固定的。当你编译一个 Objective-C 类时，所有到\
  \ `super` 的消息都将在类接口中定义为父类的类进行查找。\n\n\n同样注意的是，在 GNU 运行时，分类中向父类发送消息的实现方式不同。类实现与类结构在同一个编译单元中，因为类结构是由编译器从\
  \ `@implementation` 上文中生成的。只需查找即可找到父类指针。\n\n在分类（category）中，类结构是不可用的。它必须在运行时查找。这使得从方法发送的父类消息速度较慢。Apple\
  \ 运行时通过让链接器解析外部类引用来绕过这个问题。\n\n\n分类与类替换之间的交互在 Apple 运行时和 GNU 运行时之间细有不同，但通过简单避免类替换，你可以不用担心这个问题。这通常也是个好主意。有很多情况下替换的行为并不符合你的预期，很容易用它写出问题的代码。\n\
  \n### 理解 isa 指针\n\n\n> 来自：object.m\n\n在 C++ 中，类是结构。你可以将 C 结构子类的 C++ 类。当你对 C++ 类调用方法时，你实际上是在调用一个带有修饰名的\
  \ C 函数，并将结构指针作为第一个（隐藏）参数。\n\n\n对象和结构的区别在于，你可以向类发送消息。这之所以可行，是因为结构中的第一个实例变量指向类结构指针。这个实例变量按照惯例命名为\
  \ `isa`，正如“对象是一个 . . .”。\n\n\n\n\n与 `self` 和 `_cmd` 隐藏参数一样，`isa` 指针只是另一个实例变量；它不是关键字。这与在\
  \ C++ 中调用虚拟方法形成对比。具有虚拟方法的 C++ 对象包含一个指向虚函数表（vtable）的（隐藏）指针。这是一个函数指针的简单数组。当你调用该方法时，编译器会解引用虚函数表指针并在正确的偏移量处调用函数。\n\
  \n你无法通过虚函数表获取有关对象的任何信息，而且它的布局是目标平台 ABI 定义的一部分，而不是语言的一部分。`isa` 指针则完全不同。它是一个显式的实例变量，因此可以像任何其他实例变量一样被访问。它指向一个\
  \ `Class`，而 `Class` 是 Objective-C 运行时头文件提供的 `typedef`，并根据运行时的不同被定义为不透明类型或指向公共 C\
  \ 结构的指针。\n\n\n你可以查看其他对象的 `isa` 指针。`id` 类型被定义为 C 结构（无访问控制），仅包含指向类的指针，因此你可以像读取结构中的任何其他字段一样读取它。\n\
  \n在 Objective-C 的最新版本中，直接访问 `isa` 指针已被废弃。你应该改用 `object_getClass()` 和 `object_setClass()`\
  \ 函数。\n\n\nObjective-C 对象可能会转发消息，你持有的对象指针可能是一个代理。如果你想获取另一个对象的类，应该向它发送 `-class` 消息。这种方法较慢，但在存在代理的情况下它不会崩溃。\n\
  \n你可以通过发送 `-isProxy` 消息来测试一个对象是否为代理，但既然你都要发送一个消息了，不如直接发送一个消息来获取类。\n\n\n![Image](img/00022.jpg)\n\
  \n> 来自：classInit.m\n\n\n要正确使用这些方法非常困难。它们被调用的顺序是未定义的。Objective-C 有等效的机制。类的 `+load`\
  \ 方法在类与运行时注册时被调用，在 `main()` 函数之前执行。\n\n从此方法发送任意消息是不安全的。类本身、其所有的超类以及常量字符串类都保证已经加载。其他类可能已经加载了，但无法保证，而且即使它在你的环境下有效，如果加载顺序发生细微变化，它也可能失效。\n\
  \n\n`+initialize` 方法允许你对类所需的内容进行懒初始化。它不会在 `main()` 函数之前调用，因此所有内容都已加载，进程处于一个定义良好的状态。\n\
  \n如果你同时实现了这两个方法，就可以看到执行顺序。首先，在类一加载后就会调用 `+load` 方法。当运行时加载器完成后，它会调用 `main()` 函数。当你向类发送消息时，会调用\
  \ `+initialize` 方法，然后是你实际调的方法，最后你可以向返回的实例发送 `-init` 消息。\n\n\n> 输出自：classInit\n\n\
  注意，`+initialize` 方法只调用一次。当你第二次向类发送消息时，消息将直接投递。`+initialize` 方法的调用也是线程安全的。如果你从不同的线程同时向同一个类发送两条消息，其中一个将被阻塞，直到另一个运行完\
  \ `+initialize` 方法，然后两者都会继续。\n\n\n![Image](img/00024.jpg)\n\n> 来自：type.m\n\n\n这些类型编码可以包含任意复杂的类型，你可以从\
  \ `type.m` 的输出看出。\n\n![Image](img/00025.jpg)\n\n\n这个示例给出了包含基本类型、Objective-C 对象和\
  \ C 数组的结构类型编码。该编码是由编译器响应 `@encode()` 指令生成的，该指令的使用方式与 `sizeof()` 类似，接受一个类型作为参数。\n\
  \n结构本身由一对大括号表示。在大括号内部是结构体的名称，后面是一个等号，然后是每个元素的类型编码。\n\n\n编码的剩余部分是数组。它位于方括号中，后面是元素数量，然后是单个元素的类型。\n\
  \nObjective-C 类型编码会在你对 C 类型层面进行任何类型的内省时出现。如果你请求方法或实例变量的类型，你将得到类型编码。这非常有用。在 EtoSerialize\
  \ 框架中，我使用这些信息遍历实例变量的类型编码并对其进行自动序列化。\n\n\n![Image](img/00026.jpg)\n\n> 来自：block.m\n\
  \n\nBlocks 是闭包（closures），有时被称为 lambda。\n\n这个名字源于 Smalltalk，其中 `BlockClosure` 类封装了闭包。创建\
  \ blocks 的语法非常丑。它基于 C 语言函数指针的语法，但用脱符号 `^` 替换了星号 `*`。\n\n\n\n\n\n\n\n块所引用的栈上任何变量都会被复制到堆上并进行引用计数。当你调用\
  \ `Block_copy()` 时，如果块在栈上，则会将块本身复制到堆上；如果它不在栈上，则会增加其引用计数。`Block_copy()` 实际上是一个宏，它封装了\
  \ `_Block_copy()` 函数，并将返回类型从 `void*` 转换为参数的类型。\n\n示例中由 `getCounter()` 函数返回的每个块都有一个\
  \ `counter` 变量的副本，因为它是一个自动（栈）变量，因此对该函数的后续调用都会创建一个新版本。\n\n\n块并没有给 C 语言增加任何表达能力。块\
  \ 仅仅是隐藏在单个结构中的函数指针和数据指针，编译器中带有一些额外的逻辑，在调用函数时将数据指针作为隐藏参数插入其中。\n\n这并不意味着块没有用处。毕竟，Objective-C\
  \ 也是如此；它并没有让你做任何在 C 语言中无法做的事，只是添加了一些语法糖，让某些事情变得更容易。\n\n\n块的大多数类对象行为是没有文档说明的。你可以将它们存储在\
  \ Objective-C 集合中，但不要依赖它们理解任何特定消息的能力。在 Clang 的最新版本中，块还支持内省，将它们的类型以 Objective-C 类型编码的形式暴露出来。\n\
  \n我们将在第 15 章中更详细地查看块。\n\n\n如果你有 C 或 C++ 的背景，你可能习惯了跟踪对象的所有权并手动分配和销毁它们。如果你来自 Java\
  \ 这样的语言，你可能习惯了让垃圾回收器为你处理这一切。\n\nObjective-C 在语言层面没有提供任何用于分配或释放对象的机制。这被留给 C 代码来处理。你通常通过向其类发送\
  \ `+alloc` 消息来分配对象。这会调用类似 `malloc()` 的函数来为对象分配空间。然后向实例发送 `-dealloc` 消息将清理其实例变量并将其删除。\n\
  \n\n### 保留与释放\n\n![Image](img/00027.jpg)\n\n\n每个继承自 `NSObject` 的对象都有一个关联的引用计数。当这个引用计数达到\
  \ 0 时，它会被销毁。使用 `+alloc` 或任何相关方法（如 `+new` 或 `+allocWithZone:`）创建的对象，其引用计数从 1 开始。\n\
  \n为了控制对象的引用计数，你向它发送 `-retain` 和 `-release` 消息。正如它们的名字所示的，当你想要保留对对象的引用或想要释放现有的引用时，应该使用这些消息。`-retain`\
  \ 消息增加对象的引用计数，而 `-release` 消息减少引用计数。\n\n\nObjective-C 中的指针被分为两类：*所有权引用（owning references）*和*非所有权引用（non-owning\
  \ references）*。所有权引用是指有助于对象引用数的引用。当你调用 `+new` 或 `-retain` 等方法时，你会得到新对象的所有权引用。大多数其他方法返回非所有权引用。实例变量和全局变量通常是所有权指针，因此你应该向它们分配所有权引用。在执行赋值时，你还需要确保删除现有的所有权引用（通过发送\
  \ `-release` 消息）。\n\n临时变量通常是非所有权引用。自动引用计数和垃圾回收（我们将在本章的稍后部分讨论）都引入了特殊类型的非所有权引用。\n\n\
  \n![Image](img/00028.jpg)\n\n> 来自：ivar.m\n\n\n![Image](img/00029.jpg)\n\n> 来自：ivar.m\n\
  \n\n在大多数情况下，这可以工作，但在少数情况下不会，而且这调试起来会很困惑。\n\n如果 `aString` 和 `string` 的值相同怎么办？在这种情况下，你向同一个对象发送了\
  \ `-release` 消息，然后是 `-retain` 消息。如果其他代码持有该对象的引用，它仍然可以工作；但如果没有，第一条消息会导致对象被销毁，而第二条消息将发送给悬指针。\n\
  \n\n最后，这个方法不是线程安全的。如果你需要线程安全的 setter，你需要保留新值，在结果和实例变量之间执行原子交换操作，然后释放旧值。然而，通常情况下，理解这种细粒度并发的代码几乎是不可能的，而且它引发的缓存抖动会抵消并行带来的性能提升，因此这是一个非常糟糕的主意。如果你确实需要它，使用声明属性来自动合成访问器比尝试自己写要好。\n\
  \n### 自动引用计数\n\n\n> * * *\n\n> \n\n\n> \n\n> 本书中的大多数示例使用手动引用计数。这是刻意为之。尽管在新开发中推荐\
  \ ARC，但周围有大量不使用它的遗留代码。即使你使用 ARC，也应该理解那些为你隐式添加的保留和释放语义。对于习惯手动引用计数的程序员来说，切换到使用 ARC\
  \ 是很容易的，就像即使从不编写汇编代码，理解 CPU 指令集也是有用的一样。\n\n\n> * * *\n\n\n\n\n与其直接将消息发送（message\
  \ sends）插入到代码中，编译器前端会插入对 `objc_retain()` 和 `objc_release()` 等函数的调用。随后，优化器会尝试合并或消除这些调用。在简单的情况下，这些函数的作用等同于消息发送。在某些常见情况下，它们的效率高得多。\n\
  \n在简单使用时，使用 `ARC` 时你可以忘记内存管理。如果你使用的是较新版本的 `XCode`，那么 `ARC` 是默认选项。如果你在命令行或使用其他构建系统进行编译，请添加\
  \ `-fobjc-arc`。现在，只需忘记对象的保留（retain）和释放（release）即可。\n\n\n默认情况下，实例变量或堆栈上的所有对象指针都是强。结构体中的对象指针没有默认属性。它们必须显式标记为\
  \ `__unsafe_unretained` 所有权修饰符。尽管这是这些指针唯一允许的所有权类型，但必须显式说明，以提醒阅读代码的人 `ARC` 会忽略它。\n\
  \n### 通过指针参数返回对象\n\n\n> 节自：`writeback.m`\n\n在 `ARC` 模式下，指向指针的参数（pointer-to-pointer\
  \ arguments）有点复杂。它们通常用于两类情况：要么传递数组，要么返回对象。如果你在向下层栈中传递数组，那么你应该确保将其声明为 `const`。这告诉编译器调用者不会对其进行任何赋值操作，因此\
  \ `ARC` 就可以在不进行任何复杂交互的情况下传递数组。\n\n\n```\nid tmp = [object retain];\nwriteBack(&tmp);\n\
  [tmp retain];\nobject = tmp;\n```\n\n在 `writeBack()` 中，新对象在存储到临时值之前会进行自动释放（autoreleased）。这意味着在最后，`object`\
  \ 包含一个指向新对象的所有权引用。\n\n\n当你运行这个示例时，你会发现弱引用在自动释放池（autorelease pool）销毁时才会置零。`writeBack()`\
  \ 函数在所有情况下都会将自动释放的对象存储到传递的指针中，并且永远不会释放传递的值。调用者始终负责确保传递的值是非所有权的引用，这通过确保它是指向自动释放对象的指针，或者是指向已保留对象的指针的拷贝来实现。\n\
  \n如果你将参数标记为 `out`（仅允许用于方法参数，而非 C 函数参数），那么调用者保证不会读取该值，因此编译器将跳过在调用之前对 `object` 中的指针进行拷贝的步骤。\n\
  \n\n如果你在向下层栈传递多个值，那么你应该为参数声明一个带有显式所有权修饰符的数组类型，而不是指针类型。例如，使用 `__unsafe_unretained\
  \ id[]` 而不是 `id*`。这确保了不会写回机制。\n\n### 避免引用循环\n\n\n> 节自：`ivar.m`\n\n纯引用计数的问题在于它无法检测到循环。如果你有两个互相持有保留引用的对象，那么它们都永远不会被释放。\n\
  \n\n代理需要对对象的引用，而对象也需要对其代理的引用。这立即创建了一个循环。解决这个问题的常用惯用法是对象不保留它们的代理。如果你将一个对象作为参数传递给\
  \ `-setDelegate:` 方法，你需要确保有其他对象持有它的引用，否则它会被过早删除。\n\n使用 `ARC`，你有两个选择：你可以将实例变量标记为\
  \ `__weak` 或 `__unsafe_unretained`。前者更安全，因为它确保了不会出现悬挂指针的情况：当代理销毁时，实例变量将被设置为 `nil`。\n\
  \n\n相比之下，不安全的未保留指针就是指针。它们的访问开销很小且适用于任何部署目标。它们的缺点是你负责确保在对象被释放后不再尝试访问它们。\n\n一个很好的折中方案是在调试时使用弱指针，而在部署时使用不安全的未保留指针。在发送消息之前添加调试断言来检查指针是否为\
  \ `nil`，这样如果出现 bug，你会得到一个有帮助的错误而不是崩溃。\n\n\n如果你在 `XCode` 中启动新项目，`ARC` 将是默认选项，没有理由不使用它。如果你在处理现有代码库，那么你可能在使用手动引用计数。通过迁移到\
  \ `ARC` 可以节省一些长期开发工作，但这比简单切换一个编译器开关要复杂一些。\n\nClang 提供了一个迁移工具，可以尝试重写 Objective-C\
  \ 代码以使用 `ARC`。可以通过命令行通过 `-ccc-arcmt-check` 和 `-ccc-arcmt-modify` 参数来调用。前者报告代码中任何无法自动翻译的内容。后者如果没有错误，则会实际执行重写——修改原始文件。\n\
  \n\n\n如果你实现了自定义的引用计数方法，那么你将需要删除它们。这样做的一个常见动是为了防止单例被意外地释放。在 ARC 中，这一点就不那么重要了，因为程序员的错误不太可能导致对象被过早删除。\n\
  \n> 注意\n\n最大的问题出现在你尝试在 C 结构体中存储 Objective-C 指针时。最简单的解决方案就是不要这样做：取而使用具有公共实例变量的 Objective-C\
  \ 对象。这让编译器处理对象以及字段的内存管理。\n\n只有当你在栈上传递引用 Objective-C 对象的结构体时，才被认为是安全的。只要这些指针在调用者中保持有效，那么对象指针就可以毫无问题地限定为\
  \ `__unsafe_unretained`。\n\n\n迁移工具会尝试在需要的地方插入 `__bridge` 强制转换，但这些内容值得检查。这些转换用于将对象在\
  \ ARC 管理的代码中移入取出。在非 ARC 的 Objective-C 中，你可以自由执行如 `(void*)someObject` 这样的操作，因为对象指针只是你可以对其发送消息的\
  \ C 指针。在 ARC 模式下，这种转换是歧义的，因为编译器不知道 `void*` 的所有权语义是什么，因此它会被拒绝。\n\n迁移工具会将此重写为 `(__bridge\
  \ void*)someObject`，但这可能不是你想要的。我们将在“[与 C 互操作]”节中更详细地查看这些转换。\n\n\n![Image](img/00032.jpg)\n\
  \n> 来自：autorelease.m\n\n\n如果由被调用者分配空间，那么谁负责释放它？推测是调用者，但因为调用者并没有创建它，任何检查 `malloc()`\
  \ 和 `free()` 调用是否平衡的工具都无法察觉到内存泄漏。\n\n在 Objective-C 中，这个问题更为常见。许多方法可能会返回临时对象。如果你返回的是一个临时对象，它需要被释放；但如果你返回的是实例变量的指针，则不需要。你可以先保留该指针，但然后你需要记得释放从方法返回的每一个对象。这很快就会变得厌烦。\n\
  \n\n`-autorelease` 消息是一个延迟的 `-release` 消息。当你不再引用但其他地方可能需要时，向它发送此消息。\n\n如果你正在使用 `NSRunLoop`，自动释放池会在每次运行循环迭代开始时创建并在结束时销毁。这意味着在当前迭代结束之前，没有任何临时对象会被销毁。如果你正在执行创建大量临时对象的操作，可能希望创建一个新的自动释放池，如下：\n\
  \nid pool = [NSAutoreleasePool new];\n[anObject doSomethingThatCreatesObjects];\n\
  [pool drain];\n```\n\n\n在 OS X 10.7 中，Apple 使自动释放池成为语言的一部分。显式引用 `NSAutoreleasePool`\
  \ 类的程序在 ARC 模式下被认为无效，编译器将拒绝它们。替代方案是 `@autoreleasepool` 构建。它定义了一个自动释放池有效的区域。在非 ARC\
  \ 模式下，它将插入与上述代码完全相同的代码。在 ARC 模式下，它插入对 `objc_autoreleasePoolPush()` 和 `objc_autoreleasePoolPop()`\
  \ 函数的调用。\n\n### 使用自动释放构造函数 (Using Autoreleased Constructors)\n\n\n> 来自：namedConstructor.m\n\
  \n我在上一节提到，通过 `alloc` 创建的对象引用计数为 1。事实上，所有对象创建时的引用计数均为 1，但使用命名构造函数创建的对象也是会被自动释放的。\n\
  \n\n这是一个在你自己的类中需要遵守的约定。如果有人使用命名构造函数创建你的类实例，他会期望不需要释放它。一个典型的命名构造函数看起来就像本节开头的那样。\n\
  \n注意，由于这是一个类方法，`self` 对象将是该类。通过向 `self` 发送 `+alloc` 消息而不是类名，该方法可以自动与子类协作。\n\n\n\
  ### 访问器中的自动释放对象 (Autoreleasing Objects in Accessors)\n\n![Image](img/00034.jpg)\n\
  \n\n引用计数（在 Foundation 中实现）另一个常见问题是，你通常不会保留仅在栈上引用的对象。假设你有类似这样的代码：\n\n```\nNSString\
  \ *oldString = [anObject stringValue];\n```\n\n如果 `-setStringValue:` 方法正如我之前建议的那样实现，那么这段代码将会崩溃，因为\
  \ `oldString` 引用的对象会在你设置新字符串时被删除。这是一个问题。有两种可能的解决方案，都涉及自动释放池。一种是在设置新值时对旧值进行自动释放。另一种是本节开头\
  \ `-stringValue` 方法的定义。\n\n\n\n\n这确保了字符串不会因为对象的任何操作而意外地销毁。另一种常见的惯用用法是用 `-copy` 消息代替\
  \ `-retain`。如果实例变量可能是可变的，这种方法非常有用。如果它是不可变的，`-copy` 将等同于 `-retain`。如果它是可变的，调用者将获得一个不会因为发送给该对象的其他消息而改变的对象。\n\
  \n### 支持自动垃圾回收\n![Image](img/00035.jpg)\n\n从 OS X 10.5 开始，Apple 在 Objective-C 中引入了自动垃圾回收。这可以让程序员的工作变得更轻松，但在大多数情况下，它会带来性能开销。Apple\
  \ 的垃圾回收器使用大量内存来跟踪存活引用，因此在 iPhone 上不可用。它也不支持旧版本的 OS X，并且对 GNUstep 的支持有限，因此如果你想编写可移植的代码，应该避免使用垃圾回收。\n\
  \n如果你在垃圾回收模式下编译代码，所有的 `-retain`、`-release` 和 `-autorelease` 消息都会被忽略。编译器将为每个对堆内存的赋值操作自动插入对运行时函数的调用。\n\
  代码必须在支持垃圾回收的情况下进行编译才能使用垃圾回收器。这会在任何对堆内存的赋值时插入一组函数调用，在 Mac 运行时，这些函数声明在 `objc-auto.h`\
  \ 中。\n\n这些函数确保垃圾回收器感知到写入操作。这些操作是必要的，因为回收器是并发的。它将在后台线程运行，并在无法找到对对象的引用时删除它们。必须通知回收器更新后的指针，否则它可能会意外删除你刚刚创建引用的对象。\n\
  \n在为垃圾回收编译时，你有两个选项。如果你使用 `-fobjc-gc-only` 标志编译，你的代码将仅支持垃圾回收。如果你使用 `-fobjc-gc` 标志编译，代码将同时支持引用计数和自动垃圾回收。这在编译框架时非常有用。你仍然必须记得在正确的位置添加\
  \ `-retain` 和 `-release` 调用，但你框架的用户就可以可以在开启或不开启回收的情况下使用它。\n![Image](img/00036.jpg)\n\
  \n> 源自：`objc-auto.h`\n\n### 与 C 互操作\n在垃圾回收模式下，并不是所有内存都会被扫描。任何通过 `malloc()` 分配的内存对垃圾回收器来说都是不可见的。如果你将对象指针作为\
  \ `void*` 参数传递给 C 函数，然后该函数将其存储在 `malloc()` 分配的内存中，它将对回收器不可见，尽管仍有引用它，它也可能被释放。\n\n\
  在 ARC 模式下，编译器会自动为你处理栈上或实例变量中的指针，但它不会跟踪结构中的指针或任何显式声明为 `__unsafe_unretained` 的内容。\n\
  \n通常，你在将对象存储在堆之前会向其发送 `-retain` 消息，但在垃圾回收模式下这无效，且在 ARC 模式下是被禁止的。相反，你必须使用 `CFRetain()`\
  \ 函数。无论回收器是否在运行，都会增加对象的引用计数。垃圾器只有在引用计数为零且在追踪的内存中找不到对它们的引用时，才会释放对象。\n当你完成对回收器范围之外引用的使用后，你需要调用\
  \ `CFRelease()`。\n\nARC 为此类操作提供了更丰富的内存模型。不再允许从对象到非对象指针类型的显式转换。它们必须被*桥接转换*（bridged\
  \ casts）取代。考虑非 ARC 模式下的以下这段代码：\n\n```c\n```\n\n在 ARC 模式下，这将从一个受跟踪的指针创建一个未受跟踪的指针，这并不是你不经思考就想做的。你有三个基本选项。第一种最用于栈栈变量，或指向保证在其他处引用的变量：\n\
  \n```c\n```\n\n这种操作执行转换且不转移所有权。如果对 `someObject` 的所有其他引用都被丢弃，那么 `aPointer` 将变成悬空指针。如果\
  \ `void*` 指针将进入某处的堆并应该保留对对象的所有权引用，那么你应该使用保留的桥接转换：\n\n```c\n```\n\n这将一个所有权引用从 ARC\
  \ 的控制中移出。这大致等同于在存储之前向 `someObject` 发送 `-retain` 消息。如果你只写了 `(__bridge_retained void*)someObject`\
  \ 而没有赋值，那么这将告诉编译器保留该对象。这样做被认为是非常糟糕的风格。在转换回对象指针时，你应该使用反向操作：\n\n```c\naPointer = NULL;\n\
  ```\n\n这将一个所有权引用转移到 ARC 的控制中。ARC 现在负责释放该对象，因此记住将 C 指针置零很重要。如果你不获取指针的所有权，则应该使用简单的\
  \ `__bridge` 转换。\n\n\n![Image](img/00037.jpg)\n\n> 源自：`dealloc.m`\n\n\n另外两个方法是 `-finalize`\
  \ 和 `-dealloc`。在垃圾回收模式下，你不需要执行操作来释放 Objective-C 对象，但你仍然需要清理任何不受垃圾回收器管理的资源。这包括关闭文件句柄、释放通过\
  \ `malloc()` 分配的内存等。如果你的类有需要这种手动清理的实例变量，那么你应该声明一个 `-finalize` 方法。\n\n> * * *\n\n\
  \n> > 垃圾回收器通常在一个特殊的清理线程调用 `-finalize` 方法。这意味着 `-finalize` 方法必须线程安全的。如果它们引用了全局资源，则必须确保这样做不会引入竞态条件。\n\
  \n> * * *\n\n\n在 GC 和手动引用计数模式下，你应该将消息传递给父类，根据情况调用 `[`super` `dealloc]` 或 `[`super`\
  \ `finalize]`。在 ARC 模式下，不允许显式调用 `-dealloc`。相反，ARC 会在你非根类的 `-dealloc` 方法末尾插入 `[`super`\
  \ `dealloc]` 调用。\n\n注意本节开头的示例过于复杂。在实际代码中，你可能不需要同时支持 ARC 和手动引用计数模式。这两种可以在同一个程序中互操作。支持非\
  \ ARC 模式的唯一理由是你你想支持旧版编译器。\n\n\n![Image](img/00038.jpg)\n\n> 源自：`weak.m`\n\n\n\n\
  Apple 的垃圾回收实现中非常优秀的特性之一是存在`置零弱引用（zeroing weak references）`。在垃圾回收出现之前的 Objective-C\
  \ 文档中，未被保留的指针通常被称为“弱引用（weak）”。这些引用是允许在对象生命周期之后继续存在的。遗憾的是，目前没有自动的方法可以判断它们是否仍然有效。\n\
  \n人们发现弱引用在垃圾回收器中非常有用，因此它们现在也被 ARC 支持，但语义略有不同。为了向后兼容提供的 ARC 实现不支持弱引用，因此只有当你将范围限制在\
  \ OS X 10.7 或 iOS 5 及更高版本时，才能在 Apple 平台上通过 ARC 使用弱引用。\n> * * *\n> \n> > 注意\n> \n\
  > > 在引用计数的环境中（例如引用代理的引用），弱引用通常用于消除保留循环。在追踪环境（tracing environment）中，不需要这一点，因此你可以对代理指针以及任何可能出现保留循环的地方使用强引用。\n\
  > * * *\n\n如果你声明一个 `__weak` 对象指针，你将获得一个置零弱引用。垃圾回收器在判断对象是否仍然存活时，不会计算该引用；在 ARC 模式下赋值时，它也不会增加对象的引用计数。如果指向对象的所有引用都是弱引用，该对象就可以被销毁。之后，读取弱引用将返回\
  \ `nil`。\n\n弱引用最常用于通知（notifications）等场景。你对一个对象保持一个弱引用，只要它在其他地方被引用，你就一直向它发送消息，然后你可以在之后对其自动清理。\n\
  Cocoa 现在提供了一些可以存储弱引用的集合。旧版本的 Foundation 框架将 `NSMapTable` 和 `NSHashTable` 作为不透明的\
  \ C 类型提供，并带有一系列 C 函数来使用它们。这些接口仍然可用，但从 10.5 版本开始，Apple 将这两个 C 类型变为了类。\n\n`NSMapTable`\
  \ 类型是 `NSDictionary` 的通用形式，可以将任何指针大小的类型同时作为键和值存储。配合垃圾回收，你还可以使用该类来存储指向强或弱对象指针的入出映射。这对于\
  \ `NSNotificationCenter` 等工具非常有用，这样对象在仍注册接收通知时可以被收集，并在发生这种情况时自动从通知中心移除。\n\n本节开头的示例展示了\
  \ ARC 和 GC 模式之间的一个重要区别。如果你开启垃圾回收并编译、运行此示例，你可能会看到它打印出一个对象地址。这是因为垃圾回收器在扫描栈时仍然可以看到过时的临时变量。\n\
  相比之下，这在 ARC 模式下始终会打印 0。与 GC 不同，ARC 是完全确定性的。将 `nil` 赋值给强指针会减少对象的引用计数并触发释放。弱指针在释放开始之前就会被置零，因此在执行到\
  \ `fprintf()` 处时，它被保证为 0。\n\n### 分配已扫描内存\n\n![Image](img/00039.jpg)\n> 出自：gc.m\n\
  \n如果你使用 `malloc()` 分配内存，它对垃圾回收器是不可见的。如果你想创建一个类似包含对象的 C 数组，这就会成为问题。我们已经看过这种问题的一种解决方案。你可以对正要存储的对象调用\
  \ `CFRetain()`，对旧值调用 `CFRelease()`，然后将它们交换。\n\n这并不理想，尽管它能行得通。另一种选择是从垃圾回收器分配一块内存区域。`NSAllocateCollectable()`\
  \ 函数类似于 `malloc()`，但有两个重要的不同点。\n第一个是它返回的内存会被垃圾回收。没有对应的 `NSFreeCollectable()` 函数。当指向缓冲区的最后一个指针消失时，该缓冲区将被收集。\n\
  \n> * * *\n> \n> > 注意\n> > Apple 收集器不支持内部引用（interior references），因此你必须确保保留指向区域起始位置的指针。指向缓冲区中间某个指针无法阻止它被释放。\n\
  \n> * * *\n\n第二个区别是该函数的第二个参数定义了你想要的内存类型。如果你将缓冲区用于存储 C 类型，只需在此处传递 零即可。如果你传递 `NSScannedOption`，返回的缓冲区将被扫描，作为可能的对象指针位置，同时也作为由\
  \ `NSAllocateCollectable()` 返回的其他内存区域的指针位置。\n## 4. 常用的 Objective-C 模式\n\n每种编程语言都鼓励不同的设计模式。理解\
  \ Foundation 框架中使用的常用模式，会让理解整个框架以及编写 Objective-C 代码变得容易得多。\n\n本章概述了 Objective-C\
  \ 中一些最常见的模式。如果你想阅读更多内容，可以在 Erik M. Buck 和 Donald A. Yacktman 编写的 *Cocoa Design Patterns*Addison-Wesley,\
  \ 2009* 中找到更详细的概述。\n### 支持两阶段创建\n\n![Image](img/00040.jpg)\n\n> 出自：allocInit.m\n\
  你可能已经见过的模式之一是两阶段创建模式（two-stage creation pattern）。在传统的 NeXT 之前的 Objective-C 中，你通过向类发送\
  \ `+new` 消息来创建对象。当你实现一个新类时，你会重写 `+new` 来调用父类的实现，然后执行该类的初始化。\n\nNeXT 改变了这一点，将对象的创建和对象的初始化分为两个不同的方法。`+new`\
  \ 方法仍然有效，但现在它会向类发送 `+alloc` 消息，并向返回的对象发送 `-init` 消息。\n\n`+alloc` 方法本身默认调用 `+allocWithZone:`。它接收一个\
  \ `NSZone` 作为参数。这是一个封装分配区域的不透明类型。这在 NeXT 系统上曾被大量使用，以有效利用其有限的内存。它在 OS X 上运行并不理想，且并不是所有类都支持它，因此在许多现代\
  \ Objective-C 代码中它只是一个遗留特性。\n当你创建一个新类时，重写 `-init` 方法或提供一个新的指定初始化方法。\n\n> * * *\n\
  > \n> > 注意\n> > 你可以在 GCC 中仍然发现一些旧式创建痕迹。当使用 `+new` 创建对象时，通常会创建实例并将其赋值给类方法中的 `self`。GCC\
  \ 中有一些代码支持这种操作，允许在类方法中访问实例变量。此功能很久以前就被废弃了，所以现在当你尝试时会收到警告。\n\n> * * *\n\n重写 `+alloc`\
  \ 非常罕见。偶尔人们这样做是为了实现类池或强制单例，但这并不寻常。如果你正在实现一个单例类，你可能会重写 `+alloc` 以返回已存在的实例。我们将在本章后面介绍这一点。\n\
  ### 复制对象\n\n![Image](img/00041.jpg)\n\n> 出自：copy.m\nFoundation 框架包含一个名为 `NSCopyObject()`\
  \ 的函数。你逻辑上认为它会复制一个对象，你的想法几乎正确。它创建一个与原对象相同类的新对象，然后使用类似 `memcpy()` 的方法拷贝实例变量。\n\n\
  对于那些实例变量只包含原始 C 类型的对象，这种方法运行良好，但对其他对象则不那么理想。对象指针在复制时需要发送 `-retain` 消息。C 指针可能需要进行其他处理，特别是当它们是某些其他库返回的不透明类型时。\n\
  \n\n在没有关于对象之间具体关系信息的情况下，`copy` 函数无法自动创建一个真正的拷贝。某些对象甚至不应该支持拷贝。例如，你期望一个封装了套接字（socket）对象的拷贝语义是什么呢？你会得到两个封装了同一个套接字的对象吗？\n\
  \n真正知道如何创建对象拷贝的只有对象本身。如果对象实现了 `NSCopying` 协议，你可以向它发送 `-copyWithZone:` 消息来获取拷贝。该方法接受一个\
  \ `NSZone` 作为参数。如今大多数代码已经不再理会 `NSZone` 了。`NSObject` 了一个了一个 `-copy` 方法，它只是以默认区域作为参数调用了\
  \ `-copyWithZone:`。尽管你可能总是可以一直调用 `-copy`，但你应该实现 `-copyWithZone:`。\n\n该方法通常通过向接收者的\
  \ `isa` 指针发送 `+allocWithZone:` 消息开始的，这会创建一个新实例。然后它可能会调用初始化方法，也可能自己填充实例变量。\n> * *\
  \ *\n\n> \n\n> > 注意\n\n> > 如果你继承自一个实现了 `NSCopying` 协议的父类，你应该在你的 `-copyWithZone:`\
  \ 实现中向 `super` 发送 `-copyWithZone:` 消息，然后只拷贝子类添加的实例变量。\n\n> * * *\n\n\n### 归档对象 (Archiving\
  \ Objects)\n\n![Image](img/00042.jpg)\n\n\n通常，你需要程序状态某些部分比单次调用更持久。你可以将纯数据对象类型存储在属性列表（property\
  \ lists）中，正如我们在第 7 章中看到的，但但是存储任意对象呢？\n\n你可以以某种自定义（或公共）格式写数据，然后从这些数据重新创建对象。然而，仅仅为了让几个对象持久化就定义新的文件格式，比大多数程序员愿意付出的努力要多出一点。\n\
  \n\n支持归档有两个部分。你的对象必须能够将自己写入归档文件，并且必须能够将自己读回来。在 `-encodeWithCoder:` 方法中，你必须将对象的所有状态写入\
  \ coder。\n\n这并不意味着对象的所有实例变量。某些对象的实例变量仅用于缓存可以从其他地方重构的信息。通常，在唤醒后重构这些信息比存储它们要好。\n\n\
  \n> 来自：archive.m\n\n`initWithCoder:` 方法可能需要一些。。键式归档器只 `方法方法。。键键归档方法方法\n\n\n\n\n\n\
  \n\n如果类遵循 `NSCoding` 协议，你归归这些方法方法。。。。归归归归，，，，，，，，，，方法方法化化。\n\n\n\n\n![Image](img/00045.jpg)\n\
  \n> 来自：designatedInit.m\n\n\n> * * *\n\n> > 注意\n> \n> > `NSObject` 中的 `-init` 方法什么都不做，它只是返回\
  \ `self`。这意味着在 `NSObject` 的直接子类中，向 `super` 发送 `-init` 消息是糟糕的做法。\n\n> * * *\n\n并不是所有类都将\
  \ `-init` 作为它们的指定初始化器。按照约定，参数最多的初始化器就是指定初始化器。所有其他初始化方法都会调用它。\n这种方法使得子类变得容易得多。许多类提供了许多方便方法。如果你要在每个子类中覆盖所有这些方法，就会产生很多代码。\n\
  \n如果父类使用指定初始化器，你只需要覆盖一个。本节的示例来自 LanguageKit 中的 `LKMessageSend` 类。这是一个表示消息发送操作的抽象语法树节点。父类的指定初始化器是\
  \ `-init`，所以这个类在其指定初始化器中调用了类。这个类覆盖了 `-init`，但覆盖的版本调用了该类的指定初始化器。\n\n如果你子类这个类，你只需要覆盖\
  \ `-initWithName:arguments:` 方法，只有当你添加需要初始化的实例变量时才需要这样做。向你的类发送 `-init` 消息的人将得到一个初始化实例。\n\
  ### 强制单例模式 (Enforcing the Singleton Pattern)\n\n![Image](img/00046.jpg)\n\n> 来自：singleton.m\n\
  单例是全局变量的面向对象版本。单例类只有一个实例。Objective-C 中有很多这样的类，但它们都遵循相同的通用模式。\n\n本节开始的示例是一个骨架类，它只允许创建一个实例。这遵循了在响应\
  \ `+sharedInstance` 消息时返回单例实例的约定。许多单例类会在此消息中使用类名代替 Instance。\n\n例如，在 AppKit 应用程序中获取共享应用程序对象，你会向\
  \ `NSApplication` 发送 `+sharedApplication` 消息。这个类是单例的一个特例，因为它将其共享实例存储在全局 `NSApp`\
  \ 变量中。如果应用程序已经启动，你可以直接使用这个变量，避免获取应用程序对象的消息发送。\n\n\n\n单例模式最常见的错误是在创建过程中引入了竞态条件（race\
  \ condition）。这种特定的单例将自身的实例存储在一个私有变量中。在 `+sharedInstance` 方法中创建这个实例是非常很有诱惑力的。这对于单线程应用程序运行良好，但对于多线程应用程序呢？\n\
  \n\n一个更简单的解决方案是在 `+initialize` 方法中创建实例。该方法在运行时第一次向该类发送消息时被调用。确保在其他线程向该类传递任何消息之前完成该方法的执行，是运行时的责任。\n\
  \n> **注意**\n>\n\n在单例中，你不需要重写 `+allocWithZone:`，但如果你这样做，它会提供一些额外的运行时检查。如果你尝试在单例实例创建后分配该类的新实例，示例代码将抛出异常。\n\
  \n注意 `+allocWithZone:` 和 `+initialize` 方法中的测试。这些测试对于子类化是必要的。你不希望在有人创建你的单例对象的子类时抛出异常。单例子类化相当复杂，如果你不想支持它，可以跳过这个额外测试。\n\
  \n\nObjective-C 不多重继承。这并不是一个巨大的限制，因为要用好多重继承非常困难，但在某些问题上，它似乎是自然的解决方案。\n\n委托模式（delegation\
  \ pattern）的核心思想与继承和原型形成原理类似：你允许一个对象定义另一个对象行为的子集。\n\n\n有几种模式与委托有关，它们都遵循一个通用规则：你应该倾向于使用对象组合而非继承。这对于松耦合非常重要，因为它使得代码复用变得容易得多。\n\
  \n如果你有一个 C++ 类，由三个父类提供其行为的某些方面，那么修改它比一个 Objective-C 类将其功能的某些方面委托给其他三个类要困难得多。\n\n\
  \n![Image](img/00047.jpg)\n\n> 出自: facade.m\n\n\nAppKit 中的 `NSControl` 层次结构就是一个很好的例子。该层次中的类继承自\
  \ `NSView` 的行为，并将行为委托给 `NSCell` 子类。`NSView` 提供了如图形上下文、事件处理以及与视图层次结构交互等功能。cell 则提供了绘图等功能。本节顶部的示例是\
  \ `NSControl` 的（非常）简化版本。\n\n当你在 OS X 上点击按钮时，你通常点击的是 `NSButton` 的实例，它是一个使用 `NSButtonCell`\
  \ 进行实现的 `NSControl` 子类。作为程序员，你几乎可以交替使用控件，也可以复用它们包含的 cell。例如，如果你在表格或大纲视图看到按钮，它是用\
  \ `NSButtonCell` 绘制的，而不是 `NSButton`。\n\n\n这种方法比多重继承灵活得多，因为它允许同一个类与许多不同的委托配合。在 C++\
  \ 中，你会使用模板类来实现相同的效果。它们有不同的优势。Objective-C 版本生成的代码少得多，这转化为了更好的指令缓存利用率。C++ 版本则在编译时更容易进行某些类别的优化（主要是内联）。\n\
  \n### 创建类簇 (Creating Class Clusters)\n\n\n> 出自: classCluster.m\n\n类簇（Class clusters）在\
  \ Objective-C 中非常常见。很多 Foundation 类都是类簇，你可能会发现实现一些你自己的类簇是有很有用的。\n\n\n如果你使用 `+arrayWithObjects:`\
  \ 创建一个 `NSArray`，你可能会得到一个封装了简单数组的子类。如果你使用 `+arrayArray:` 创建，你很可能会得到一个引用另一个数组的实例。\n\
  \n另一个很好的例子是 `NSNumber`。它封装了一个单一原始值。你可以用两个实例变量来实现它：一个包含所有可能的值类型的联合体（union），另一个用于说明它是哪种类型。这会浪费大量空间且相当复杂。更简单的解决方案是为你支持的每个类型实现一个不同的子类。\n\
  \n\n示例是一个 `Pair` 类。它没有声明任何实例变量，并且从不直接使用。如果你向该类发送 `+alloc` 消息，你会得到一个单例实例。当你向它初始化消息时，你会得到一个私有子类的实例。\n\
  \n![Image](img/00049.jpg)\n\n\n这些具体子类的每一个都非常简单。它们都声明了两个实例变量：一个是 `int`，另一个是 `float`。它们各提供了一个初始化方法，该方法仅由父类调用，然后它们重写了方法。\n\
  \n这个示例没有在父类中提供任何有用的方法。在实际实现中，你可能会在父类中看到基于这里所示四个方法实现的比较或算术方法。或者，它们可能在一个分类（category）中提供。\n\
  \n\n子类化类簇通常只需要实现少量**原始方法**（primitive methods）。父类中的其他方法都是基于这些核心功能实现的。我们将在[第 7 章]的集合子类化部分详细讨论这一点。\n\
  \n\n\n\n如果你想为 `NSString` 创建一个新的子类，例如，必须实现 `-length` 和 `-characterAtIndex:`。该类中的所有其他方法都只是调用这两个方法。更高效的实现还会实现\
  \ `-getCharacters:range:`。\n\n### 使用运行循环 (Run Loops)\n\n\n> 来自：timer.m\n\n定义大多数非平凡\
  \ Objective-C 程序结构的设计模式是 `run loop`（运行循环）。在通常情况下，运行循环等待来自一个或多个事件源的数据，然后响应这些数据执行代码，从而提供了一种`事件驱动编程`模型。\n\
  \n\n应用程序中的主运行循环监听来自窗口服务器的事件，对应于按键按下、鼠标移动、触摸事件等。其他各种类会隐式地向运行循环添加事件源。我们将在第 8 章中看到的\
  \ `NSTimer` 类会向运行循环添加定时器事件源，例如，允许你在特定时间执行某些操作。\n\n第 16 章中介绍的通知机制允许你通过运行循环在程序内传递任意事件的通知，你还可以通过\
  \ `NSFileHandle` 注册文件描述符活动的通知。\n\n\n在大多数程序中，你不需要直接与运行循环交互。它在后台运行，而其他类提供了更方便的接口。\n\
  \n## 5. 数字 (Numbers)\n\n\n它们的行为与在 C 中完全相同，包含类型提升规则。你还会发现 Objective-C 编译器支持 `long\
  \ double` 类型，它是取决于架构的。\n\n注意，这与 Java 非常相似，在 Java 中你只有少数非对象类型，但存在一些非常重要的区别。在 Java\
  \ 中，`intrinsic types`（内在类型）被定义为固定大小。在 C 中，它们被定义为具有最小精度。例如，规范说 `int` 具有“执行环境架构建议的自然尺寸”，而在\
  \ Java 中它被显式定义为“32 位符号补码整数”。\n\n\nOS X 支持 ILP32 和 LP64 模式。这种缩写用于描述 C 类型中哪些具有什么种尺寸。ILP32\
  \ 意味着 `int`、`long` 和指针是 32 位。LP64 意味着 `long` 和指针是 64 位数值，并且隐含地其他值较小。相比之下，Microsoft\
  \ Windows 在 64 位架构上是 LLP64 平台；`int` 和 `long` 均保持为 32 位，只有指针和 `long long` 是 64 位。如果你假设可以安全地将指针强制转换为\
  \ `long`，就会产生问题——这种操作在包括 Win32 在内的世界几乎每个平台上都可行，但在 Win64 上行不可通。\n\n将指针强制转换为整数是一个严重的问题。`long\
  \ long` 类型至少是 64 位，因此在任何当前平台上，它都保证足够存储任何指针，但在任何 32 位或 16 位平台上，它可能太大了。C99 引入了 `intptr_t`\
  \ 定义，其尺寸正好是指针的大小。Apple 引入了等效类型：`NSInteger`。它在整个 Cocoa 框架中使用，且尺寸始终与指针相同。还有一个无符号版本\
  \ `NSUInteger`。\n\n\n### 在集合中存储数字\n\n![Image](img/00051.jpg)\n\n\n所有标准集合类都允许你存储对象，但你通常希望在它们中存储原始类型。解决此的方法是装箱（boxing）——将原始类型封装在对象中。`NSValue`\
  \ 层次结构用于此类。`NSValue` 是封装单个值的类。\n\n`NSValue` 的一个子类特别重要：`NSNumber`。该类旨在封装数值，并可以从任何\
  \ C 类型初始化。\n\n\n你可以使用 `@encode()` 指令获取任何类型的类型编码。这类似于 C 中的 `sizeof()`，但它返回的是作为字符串的类型编码，而不是整数。处理类型编码时的一个方便技巧是使用\
  \ `typeof()` GCC 扩展。它返回表达式的类型。你可以将其与 `@encode()` 结合，如下：\n\n```\nNSValue *value =\
  \ [NSValue valueWithBytes:&aPrimitive objctype:@encode(typeof(aPrimitive))];\n\n\
  这段代码将返回一个封装 `aPrimitive` 的 `NSValue`，并且无论原始类型如何都有效。你可以将其封装在宏中，但要注意不要传递带有副作用的表达式。\n\
  \n注意你需要传递原始值的指针。该方法将类型编码查找原始类型有多大，然后进行复制。\n\n\n```objc\nNSNumber *twelve = [NSNumber\
  \ numberWithInt:12];\n```\n\n\n\n\n\n\n\n![Image](img/00052.jpg)\n\n> 来自：`numberArray.m`\n\
  \n\n> 输出自：numberArray\n\n## 执行小数算术\n\n\n> 来自：decimal.m\n\nC 语言为你提供了两种处理数字的方法：整数和浮点值。浮点值由两个部分组成：尾数和指数。它们的值是\
  \ 2 的指数次方乘以尾数。\n\n\n二进制数是一组 2 的幂之和，就像十进制数是 10 的幂之和一样。对于小数，小数点后的数字表示二分之一、分之一、八分之一等。如果你尝试通过加\
  \ 2 的幂来创建一个 `0.1` 的值，你永远无法成功，尽管你会越接近越。当你尝试通过加 10 的幂来创建一个三分之一（三十分之一，加上百分分之一，再加上千分之一，等等）时，也会发生同样的情况。\n\
  \n一种解决方案是使用定点算术。与其存储美元，你可能存储分的百分分之一。你必须记住对你的值进行归一化，并且受整数类型的范围限制。Objective-C 提供了另一种选择：小数浮点数类型。\n\
  \n\n你有两种方式进行算术运算。`NSDecimalNumber` 实例是不可变的。你可以根据算术结果创建新实例——例如，通过向其中一个实例发送 `decimalNumberByAdding:`\
  \ 消息。\n\n或者，你可以使用 C API，它直接修改结构体的值。\n\n\n> * * *\n\n> > 注意\n> \n\n> * * *\n\n这两种方法都不特别快。小数被表示为数字数组，在两个数字归一化后，会对它们成对地进行操作。你可以预期获得与软件浮点数实现相似的性能——可能略差，因为\
  \ `NSDecimal` 没有被广泛使用，因此没有投入太多的优化精力。\n\n\n## 字符串与数字之间的转换\n\n![Image](img/00055.jpg)\n\
  \n\n在数字和字符串之间转换有多种方法。许多表示简单数据的对象都有像 `-intValue`这样的方法，返回接收者的整数表示。\n\n`NSString` 有此类方法。如果你有一个包含数值的字符串，可以向它发送\
  \ `-doubleValue`、`-floatValue`、`-intValue` 或 `-longLongValue` 消息将其转换为这些类型。在 64 位安全的\
  \ Foundation 版本中，你也可以向它发送 `-integerValue` 消息。这将返回一个 `NSInteger`。\n\n\n如果你已经有一个 `NSNumber`\
  \ 实例中的数字，有两种方法获取字符串，其中一种是另一种方法的封装。`-descriptionWithLocale:` 方法返回一个根据指定的区域语言格式化数字生成的字符串。\n\
  \n事实上，这本身并没有执行转换。它向一个新的 `NSString` 发送了一个 `-initWithFormat:locale:` 消息。格式字符串取决于数字的类型：例如，double\
  \ 将使用 `@\"%0.16g\"` 格式字符串进行转换。这使用了最多 16 位有效数字，并在需要时使用指数。\n\n\n## 从字符串读取数字\n\n![Image](img/00056.jpg)\n\
  \n\n任何 C 程序员首先学会使用的两个函数是 `printf()` 和 `scanf()`。它们非常相似——一个几乎是另一个的反面——它们允许你构造字符串并从中解析数据。我们已经看到\
  \ `NSString` 有 `sprintf()` 的类似物，所以你可以从格式字符串和变量构造字符串，但 `sscanf()` 的 Objective-C 等效方法是什么？答案在于\
  \ `NSScanner` 类。这个类是一个分词器类。你创建一个关联字符串的 `NSScanner` 实例，然后逐个从从中扫描值。\n\n发送给扫描器的消息都具有相同的格式。它们接收一个变量指针并返回\
  \ `BOOL`，指示是否成功。扫描器存储字符串中的当前扫描索引，仅在扫描成功时增加，因此你可以尝试不同的方式解析后续字符。你还可以轻松地使用 `NSScanner`\
  \ 实现预读和回溯。如果你向它发送 `-scanLocation` 消息，它会返回字符串中的当前索引。你可以尝试扫描几次，遇到错误后通过发送 `-setScanLocation:`\
  \ 消息回溯。\n\n\n本节开头的示例从字符串中读取一个数字、一个单词和另一个数字。数字是使用内置的 `-scanInt:` 方法读取的，但单词复杂一些。它使用了一个\
  \ `NSCharacterSet`，在这种情况下是所有字母的集合。\n\n\n\n\n这并不是示例中使用的唯一 `NSCharacterSet`。该扫描器还配置为跳过空白字符。发送给扫描器的\
  \ `setCharactersToBeSkipped:` 消息会告诉它忽略作为参数传递的集合中的任何字符。传递空白字符集会告诉它跳过在调用之间发生的任何空白字符。如果你在向它发送扫描消息时，扫描器开始读取的位置恰好有该集合中的字符，那么它将跳过这些字符。在解析词标记（token）时，它将不会跳过这些字符，因此在字符串中放入“1\
  \ 2”将被读取为两个独立的数字，而不是 12。\n\n## 6. 字符串操作\n\n\nC 字符串是一种非常原始的数据类型。它是一个字符数组，以 `NULL`\
  \ 字节终止。它没有字符编码的概念，可以存储任何不包含零字节的字节序列。UTF-8 是专为与 C 字符串配合而设计的：它是一种变长度编码，即使在多字节序列中也不使用零字节。\n\
  \nObjective-C 字符串是一种更高层次的抽象。它被视为 UTF-16 字符序列进行访问，但其内部表示是私有的。如果你为 GNU 运行时（runtime）编译\
  \ Objective-C，常量字符串由一个类的一个实例表示，该类有三个实例变量：`isa` 指针、一个指向 C 字符串的指针，以及一个包含 C 字符串长度的整数。当模块加载时，运行时库会将\
  \ `isa` 指针设置为正确的类。\n\n\n### 创建常量字符串\n\n![Image](img/00057.jpg)\n\n\n在 OS X 上，Objective-C\
  \ 字符串与*Core Foundation (CF)*字符串是*无缝桥接（toll-free bridged）*的。常量 CF 字符串的表示与 GNU 运行时\
  \ Objective-C 字符串类似，但有几处不同。它们的 `isa` 指针设置为 Core Foundation 框架中存在的外部引用，因此不需要链接 Objective-C\
  \ 运行时或 Foundation 框架即可工作。它们还有一个 `flags` 字段，允许其内部表示为 UTF-8 或 UTF-16，取决于哪种对其内容更高效。\n\
  \n常量 Objective-C 字符串通过在常量 C 字符串前加上前缀创建。你可以通过 `@` 符号创建常量 Objective-C 字符串，并根据内容选择更高效的表示。你也可以通过\
  \ `CFSTR()` 宏创建 Core Foundation 字符串。\n\n\n![Image](img/00058.jpg)\n\n> 来自：`CompareStrings.m`\n\
  \n\n在某些情况下，比较两个指针要快得多，这在 `NSMutableSet` 中通常是未定义的。如果你在处理集合，应该使用 `isEqual:`。这些方法都是基于这个通用比较方法的包装的：\n\
  \n```\n– (NSComparisonResult)\n   options: (NSStringCompareOptions)mask\n   range:\
  \ (NSRange)range\n   locale: (````))locale;\n```\n\n\n### 逐字符处理字符串\n\n![Image](img/00059.jpg)\n\
  \n\n`NSString` 类是一个*类簇（class cluster）*。它是一个抽象类，当你创建一个它时，你会得到某个私有子类的实例。任何 `NSString`\
  \ 子类必须实现两个原始方法：`-length` 和 `-characterAtIndex:`。第一个方法返回长度，第二个方法返回字符串中特定索引处的字符。\n\
  \n\n\n如果你需要对字符串中的每个字符进行某些操作，可以在简单的循环中对其进行迭代，并反复调用此方法。这种效率非常低，因为每个字符都需要发送一条消息（message）。这比访问\
  \ C 字符串中的字符要昂得多。此版本还会为每个字符发送一个 `-length` 消息，而只有在迭代过程中长度可能会变化时才需要这样做。\n\n另一种方法是获取一个\
  \ C 字符串并对其进行。例如，你可以向字符串发送 `-UTF8String` 消息，然后处理返回的 C 字符串。尽管听起来很合理，但请记住字符串可能很大，并且可能不是以\
  \ UTF-8 格式存储，因此该对象可能需要将其内部表示转换为 UTF-8，分配内存来存储，然后稍后由自动释放池（或垃圾回收器）清理该内存。\n\n访问字符串中字符最高效的方法是\
  \ `-getCharacters:range:`。Objective-C 中以 `get` 开头的方法通常接受指向调用者分配的某些空间的指针，并返回其中的数据。在这种情况下，第一个参数是一个指向\
  \ `unichar` 缓冲器的指针，它必须足够大以存储请求的字符数量。\n下一个示例使用这种机制来计算源文件中的分号数量。首先，它将源代码加载到字符串中，然后一次获取十个字符。注意这种双层循环结构。外层循环获取字符块，内层循环遍历该块。当你使用\
  \ `fast enumeration`（快速枚举）遍历集合时，编译器会生成相同的结构。\n\n这每十个字符需要发送一条消息。你可以通过增加缓冲区的大小来牺牲一些速度换取更多的空间。注意，此缓冲区是分配在栈上的。这种方法很快的，但你应该小心确保正确设置了范围（range）。否则，你可能会在应用程序中引入一些安全漏洞。\n\
  \n![Image](img/00060.jpg)\n> 来自：StringIterate.m\n\n记住字符串对象隐藏了它们的编码。无论字符串内部如何存储，这段代码都能正常工作。如果是\
  \ 7 位 ASCII 或 UTF-8，将大多数字符转换为 UTF-16 是非常快的。如果是 Mac Roman 等格式，可能需要花费稍一点的时间，但仍然非常快。\n\
  \n### 转换字符串编码\n![Image](img/00061.jpg)\n\n> 来自：encodings.m\n\n在 OpenStep 中，`NSString`\
  \ 上最常用的方法是 `-cString` 和 `+stringWithCString:`。它们在 C 字符串和 Objective-C 字符串之间进行转换。这些方法的问题在于\
  \ C 字符串是不感知编码的。\nC 字符串是字节数组。你可以在其中存储任何你喜欢的各种字符数据。对其进行所有操作都是外部定义的，因此对字符编码的知识是外于字符串之外的。这与\
  \ Objective-C 字符串的工作方式完全相反。\n\n当你将 C 字符串转换为 Objective-C 字符串或反之时，它必须知道 C 字符串的编码是什么。C\
  \ 标准库函数检查环境变量来确定这应该是什么。遗憾的是，这导致了各种问题。如果你从套字或文件读取某些数据，然后使用这些函数从其构造 Objective-C 字符串，你将得到用户选择的文本编码，而不是创建文件的人所选择的编码。\n\
  \n这些方法现在都已废弃，取而代之的是接受显式编码参数的方法。需要记住的一点是，任何多字节编码的默认都是大端序（big-endian），这在 Objective-C\
  \ 兴起的 Motorola 68000 系列和 RISC 工作站上是有意义的，但在小端 x86 处理器上就不那么合理了。\n在使用某些拉丁字母变体的国家，最常见的文本编码是\
  \ UTF-8。这允许你用一个字节表示任何 ASCII 字符，用两个字节表示大多数其他常见字符。`NSString` 具有用于获取和设置 UTF-8 编码数据的便利方法：`-UTF8String`\
  \ 和 `+stringWithUTF8String:`。在大多数代码中，每当你与 C 字符串进行转换时，都可以使用这些方法。\n\n要从其他某种编码的 C 字符串创建字符串对象，你需要使用\
  \ `+stringWithCString:encoding:` 方法。该方法的第一个参数是 C 字符串，第二个参数是表示编码的枚举类型成员。如果数据来自较旧的\
  \ Mac，你可能想使用 `NSMacOSRomanStringEncoding`，这是在 Mac OS 支持 Unicode 之前的默认编码。如果你需要与旧的\
  \ Windows 系统进行操作，`NSWindowsCP1252StringEncoding` 是你在世界上大部分地区需要的编码。较新的 Windows 系统将使用\
  \ UTF-16，但它们更倾向于小端序版本，即 `NSUTF16LittleEndianStringEncoding`。\n\n如果你以特定编码存储字符串数据，通常会使用\
  \ `NSData` 实例而不是指针。这是一个非常简单的类，它封装了一个内存区域：一个指针和一个大小。因为是一个对象，你可以对它进行内省，使用引用计数来处理销毁，并将其存储在集合中。在许多情况下，这比直接使用指针更方便。\n\
  ### 修剪字符串\n\n![Image](img/00062.jpg)\n\n> 来自：trim.m\n通常，当你有一个字符串时，你想要修剪两端，移除固定数量的字符或来自某个集合的字符。第二种情况的常见示例是移除字符串开头的空白。\n\
  \nObjective-C 字符串对象支持许多方法来实现此操作。如果你只是想移除字符串的尾部或开头字符，`NSString` 的 `-substringWithRange:`\
  \ 方法是最有用的。这将创建一个包含字符范围的新字符串。对于不可变字符串，这是一个非常廉价的操作；它只是返回一个引用原始数据的字符串。然而，当你在可变字符串上调用它时，它必须进行拷贝。\n\
  \n要从特定集合移除字符，你需要理解 `NSCharacterSet` 对象。正如名称所示，该类封装了一个字符集。你可以从字符串创建这些集合，但也有许多预定义的集合代表定义良好的字符集。\n\
  该类的使用方式类似于 C 语言中的 `ctype.h` 函数。你可以向它发送 `-characterIsMember:` 消息来测试单个字符是否是集合的成员。例如，调用\
  \ C 库函数 `ispunct()` 等同于向通过 `NSCharacterSet +punctuationCharacterSet` 消息获取的对象发送 `-characterIsMember:`\
  \ 消息。\n\nObjective-C 版本更冗长，但更具通用性。字符集对象可以很容易在代码中传递。`NSString` 类在许多地方使用了它们。例如，你可以请求字符串中给定字符集的字符范围，或者使用字符集定义分隔符来分割字符串。\n\
  \n### 分割字符串\n![Image](img/00063.jpg)\n\n> 来自：split.m\n\n在 Objective-C 中三种分割字符串的方法。第一种是显而易见的：简单地遍历字符直到找到方便的分割位置，然后使用\
  \ `-substringWithRange:` 创建新标记。这在通用情况下可行，但对于这种本该轻而易举的事情来说，太费精力了。\n在 C 语言中，你可以使用\
  \ `strsep()` 函数或废弃的 `strtok()` 函数在发现特定集合中任何字符的地方分割字符串。`NSString` 的 `-componentsSeparatedByCharactersInSet:`\
  \ 方法的工作方式几乎完全相同，尽管它接受的是 `NSCharacterSet` 而不是字符串。\n\n\n\n\n\n或者，你也可以根据特定子字符串的出现来分割字符串。当分隔符由多个字符组成时，这种方法非常有用。\n\
  \n## 复制字符串\n\n\n> 来自：`stringcopy.m`\n\nC++ 往往比预想中要慢得多的地方之一就是字符串处理。在任何具有纯手动内存管理的环境中，人们往往倾向于为了防御性地复制对象，以维持清晰的所有权规则。\n\
  \n\n你可能会在想，为什么我们有两个功能相同的方法？答案很简单：`NSMutableString` 是 `NSString` 的子类。如果你向一个 `NSMutableString`\
  \ 发送 `-retain` 消息，你会增加它的引用计数。如果你发送 `-copy` 消息，你会得到一个新对象。情况可能比这更复杂，因为某些 `NSMutableString`\
  \ 的具体子类支持写时复制（copy-on-write）行为，因此你会得到两个引用相同数据的对象，只有当你修改其中一个对象时，才会创建一个真正的副本。\n\n\
  由于 `NSMutableString` 是 `NSString` 的子类，你可以将 `NSMutableString` 的指针传递到任何期望 `NSString`\
  \ 指针的地方。如果你期望得到一个不可变字符串却得到了一个，那么是复制对象还是仅对它建立另一个引用都没有区别。相反，如果你得到一个可变字符串，你就不希望仅仅保留它的引用，否则可能会导致它在之后被修改。\n\
  \n\n> * * *\n\n> \n\n> \n\n> > 如果你是从从 Java 转过来的，请记住 `NSString` 大约等同于 Java 的 `String`\
  \ 类，而 `NSMutableString` 大约等同于 Java 的 `StringBuffer` 类。Objective-C 没有对应的 `final`\
  \ 关键字，所以 `NSString` 可能并且确实拥有子类，你可以在任何可以使用不可变字符串的地方使用可变字符串。\n\n> \n\n这种模式出现在 Foundation\
  \ 框架的多个地方。大多数具有不可变父类和可变子类的类都会实现 `NSMutableCopying` 协议。向它们的可变或不可变实例发送 `-mutableCopying`\
  \ 消息将给你一个该可变子类的实例。\n\n## 从模板创建字符串\n\n\n> 来自：`formatstring1.m`\n\n如果你有 C 语言背景，学到的第一个函数之一可能是\
  \ `printf()`。这是一个可变函数，它接受一个格式字符串作为第一个参数。格式字符串的内容随后定义了其他参数的类型。\n\n\n对象应该知道如何描述自己。每个对象都应该响应\
  \ `-description` 消息，该消息返回一个描述对象的 `NSString`。许多类从 `NSObject` 继承了这一点，只需返回类名和对象在内存中的地址。其他类提供了更方便的方法。例如，集合类将其内容导出为\
  \ NeXT 风格的属性列表（property lists）。\n\n> * * *\n\n\n> > 注意事项\n> \n\n> > GNU 调试器 (gdb)\
  \ 对 `-description` 方法有一些内置支持。当你对对象使用 `print-object` 命令（可以缩写为 `po`）时，它会调用对象的 `-description`\
  \ 方法。执行此操作要小心，因为它会在被调试进程中运行某些代码，这些代码可能也包含 bug。然而，当它正常工作时，非常有帮助。我们将在第 18 章中详细介绍调试。\n\
  > \n> * * *\n\n你可以使用一个类似于 `asprintf()` 的可变方法从格式字符串创建 Objective-C 字符串对象。第一个参数是一个包含某些格式说明符的\
  \ Objective-C 字符串，其余参数是用于替换格式说明符的变量。`formatstring.m` 示例展示了如何将格式字符串用于 `NSString`。\n\
  \n\n![Image](img/00066.jpg)\n\n> 来自：`formatstring.m`\n\n\n`NSLog()` 函数也使用格式字符串。很容易直接传递\
  \ `str` 作为第一个参数。这运行得良好，直到有人使用了包含百分号的字符串。这时该函数将查看第二个参数并尝试解释它。不幸的是并没有第二个参数，所以会从寄存器中读取一个随机值。如果它将其解释为某种数字，并没有大问题。如果将其解释为指针（指向\
  \ C 字符串或 Objective-C 对象），它几乎会崩溃。通过传递 `\"%@\"`，我们告诉 `NSLog()` 有一个实际参数，并且是一个对象。\n\n\
  ## 在字符串中匹配模式\n\n\n> 来自：`regex.m`\n\n如果你用过 Perl 或 JavaScript 等语言，那么你可能习惯了使用正则表达式进行字符串模式匹配。Foundation\
  \ 框架的新版本包含了 `NSRegularExpression` 类，它是 Unicode 国际组件 (ICU) 正表达式代码的薄层封装。\n\n\n本节开始的示例展示了使用该类的两种常用方法。它们都从构造实例开始，封装了一个简单的正则表达式。为了效率起，你应该尝试复用正则表达式对象，而不是每次都从字符串创建它们。正则表达式对象是不可变的且线程安全的，因此你可以将常用的模式存储在全局变量中，并在多个线程中反复复用。\n\
  \n使用正则表达式的第一种方法展示了低级 API。它接收一个块，该块为每个匹配项调用一次。这个简单的示例打印了每个匹配项在字符串中的位置。\n\n\n\n层级\
  \ API 会替你完成替换。这提供了两种形式：一种接收 `NSString` 并返回一个带有替换结果的新副本；另一种是接收 `NSMutableString`\
  \ 并在原地进行替换。\n\n请注意，用于替换的模板并不是简单的字符串。它可以包含对原始正则表达式部分的引用，使用你在其他地方处理正则表达式时使用的 `$n`\
  \ 语法。\n### 存储富文本\n\n![Image](img/00068.jpg)\n\n> 来源：`richText.m`\n字符串仅仅是字符列表。在显示字符串之前，你通常需要一些其他属性。这些属性描述了字体、大小、对齐方式和下划线样式等。\n\
  \n如果你正在编写处理结构化文本的内容——例如 HTML 或其他形式的语义化标记（如 DocBook），那么这些属性可能就是一级标题或有序列表。\n\nFoundation\
  \ 提供了一个类用于为字符串分配任意属性。`NSAttributedString` 类允许你将字典附加到属性字符串的范围上。这些字典可以包含你想要的任何任意信息，包括语义化标记。\n\
  AppKit 使用该类，并为字典定义了几个键（keys）以提供呈现标记。你可以使用它将一个 `NSFont` 实例附加到一段文本，并让 AppKit 的文本系统以指定的字体显示该段文本。\n\
  \n示例通过属性字符串构建了一个程序片段，并为定义关键字定义了属性。你可能有一个转换器（transform），接收此属性字符串并生成一个使用呈现属性用于在文本视图显示的字符串，或者生成另一个从该标记生成\
  \ HTML 的字符串。\n\n记住，`NSAttributedString` 是通用的。你可以用它将想要定义的任何属性附加到字符串的范围上。\n## 7. 集合操作\n\
  \n与我们看过的其他内容一样，Objective-C 中有两种集合：面向对象的版本和原始 C 类型。后者一如既常，是构建在以前者之上的。\n\n在 C 语言中，有两种复合数据类型：数组和结构。数组只是包含相同类型数据的内存块。结构具有固定的布局，并可能包含不同类型的元素。\n\
  C 复合类型是指针算术上的一层非常薄的语法糖。当你访问数组中的一个元素时，编译器会将数组索引乘以单个元素的大小，并将此结果加到数组起始指针上。当你访问结构中的一个元素时，编译器会向结构起始指针加上一个固定的偏移量。\n\
  \nObjective-C 集合是高级构造结构。每个 Objective-C 集合与 Objective-C 增加的其他大多数功能一样，都是对象。你通过向它们发送消息与它们通信。\n\
  \nFoundation 框架包含了许多集合类，用于存储有序和无序数据，以及映射或索引集。Objective-C 中的大多数集合类都存储对象。与 C++ STL\
  \ 集合需要针对其可能包含的类型进行细化不同，Objective-C 集合是异质的。它们可以存储任何类型的 Objective-C 对象。\n大多数 Objective-C\
  \ 集合（如字符串）使用*可变子类模式*（mutable subclass pattern），其中父类实现不可变集合的行为，而子类则提供一个可变版本。\n\n\
  所有遵循此模式的类都实现了 `NSMutableCopying` 协议，这意味着你可以向集合发送 `-mutableCopy` 消息并获得一个可变的副本，即使原始集合是不可变的。\n\
  \n大多数集合也是*类簇*（class clusters）。当你创建一个集合时，你将得到某个私有子类。公共类通常是抽象的。用户友好的方法都是通过少数原始方法实现的。如果你创建自己的子类，你将需要自己实现这些方法。\n\
  ### 使用数组\n\n![Image](img/00069.jpg)\n\n> 来源：`ns.m`\n除了 C 数组外，Foundation 还提供了 `NSArray`\
  \ 类及其可变子类 `NSMutableArray`。它们实现了一种抽象数据类型，从零开始的连续范围整数映射到对象。内部，它可能由 C 数组、跳表（skip lists）或其他数据结构实现，取决于它是如何创建的。\n\
  \n例如，如果你通过附加两个不可变数组创建一个数组，可能会得到一个内部不存储任何内容仅访问另外两个数组的复合数组。或者，这取决于实现相关 `NSArray` 子类的开发人员认为在该特定情况下什么更高效。\n\
  \n创建 Objective-C 数组最简单的方法是使用 `+arrayWithObjects:` 方法，该方法由 `NSArray` 和 `NSMutableArray`\
  \ 实现。这是另一个*可变方法*（variadic method）的示例，它接收对象列表作为参数，并使用 `nil` 表示列表的结束。当你使用变量作为此方法的参数时，必须确保没有变量是\
  \ `nil`，否则数组将将其视为参数列表的结束并忽略后面的值。\n> 注意\n> 大多数 Objective-C 集合不允许你将 `nil` 存储为值。如果你需要表示空值而不是值的缺失，你可以使用\
  \ `NSNull` 类。它提供了一个可以通过 `[NSNull null]` 访问单例对象。\n\n数组是*类簇*。`NSArray` 中的两个原始方法是 `-objectAtIndex`\
  \ 和 `-count`。所有其他方法都是基于这两个方法实现的。当然，某些具体的子类会实现更高效的版本，但如果你想创建一个新的 `NSArray` 子类，并且想让父类中的其他方法工作，你就必须实现这两个方法。\n\
  \n\n### 操作索引\n\n![Image](img/00070.jpg)\n\n\n数组通过整数索引。通常，你想要对数组中的一组值执行某些操作。一个名为\
  \ `NSIndexSet` 的特殊类用于存储一组索引。在内部，它存储一个范围集，因此可以非常密集。\n\n索引集的一个非常常见的用途是在枚举数组时收集一组索引，然后在最后删除它们。在枚举时从集合中删除对象是一个坏主意，在大多数情况下会抛出异常。如果你将每个想要删除的索引都添加到索引集中，就可以在完成枚举后一次性删除它们。\n\
  \n\n\n\n\n与其他集合一样，索引集（index sets）分为可变和不可变两种。大多数情况下，你会使用可变版本。你可以通过添加或删除单个索引（`NSUInteger`）或范围来操作它。你可以使用索引集来存储任何内容的索引，但它们与\
  \ `NSArray` 结合使用时最为有用，因为 `NSArray` 有几个方法专门设计接收索引集作为参数。如果你只是想对数组中的某些任意子集进行操作，通常可以将它们作为创建子数组的替代方案。\n\
  ### 存储无序对象组\n\n![Image](img/00071.jpg)\n\n> 自：nsset.m\n如果你想存储一个没有定义顺序的对象集合，可以使用\
  \ `NSSet` 及其可变子类。这模拟了数学中的集合模型，因此插入两次同一个对象只会存储一个副本。\n\n`NSSet` 如何确定对象之间的相等性相当复杂。相等性不等同于标识性（identity）；它不会存储两个相同对象的副本，但也不会存储两个具有相同的对象。它通过向其中一个对象发送以另一个为参数的\
  \ `-isEqual:` 消息来判断两个对象是否相等。\n\n实现 `NSSet` 最简单的方法是将每个新对象与每个现有对象进行比较。然而，这会非常缓慢，幸运的是\
  \ `NSSet` 并不是这样工作的。相反，它使用 `-hash` 方法。每个对象都应该实现此方法并返回一个整数哈希值。\n如果两个对象相等，它们必须具有相同的哈希值。像\
  \ `NSSet` 这样的集合根据对象的哈希值将对象放入桶中。当测试一个对象是否已在集合中时，只需要测试具有相同哈希值的对象即可。\n\n因此，良好的哈希对于这些集合类的良好性能至关重要。幸运的是，`NSString`\
  \ 是这类集合中最常用的对象，它已经有了良好的哈希实现。\n\n这种方法的一个微小问题是，对象在集合中不能改变其哈希值。对于可变对象，在不破坏其他规则的情况下无法强制执行这一点。因此，在对象存储在集合期间不要修改它们很重要。\n\
  另一种类型的集合是 `NSCountedSet`，它是 `NSMutableSet` 的子类，支持多次添加同一个对象。这为 `NSMutableSet` 增加了一个方法\
  \ `-countForObject:`，它返回特定对象被添加到集合的次数。\n\n> * * *\n\n> \n> > 注意\n> \n\n> > 在 Java\
  \ 以及其他语言中，计数集合被称为 *bag*（袋）。\n\n\n> * * *\n\n值得注意的是，由于 `NSCountedSet` 是 `NSSet` 的子类，它的某些方法设计用于允许将\
  \ `NSCountedSet` 实例替代 `NSSet` 实例。如果你在本节开头创建的任何集合发送 `-count` 消息，你将获得相同的值。如果你遍历任何集合，将得到七个对象。你只有通过向集合发送\
  \ `-countForObject:` 消息，才能判断一个对象是否在计数集合中出现过多次。\n\n\n\n> 自：dictionary.m\n\n字典通常称为\
  \ *map*（映射）或 *associative array*（关联数组），它提供了一个由其他对象索引的对象集合。最常见的是，字典是由字符串索引的。这并不是唯一的选择，但对用作字典键的类有一些限制。\n\
  \n\n此外，键必须实现 `NSCopying` 协议。当你向字典添加一个键值对时，值会被保留，但键会被复制。这样做是为了防止它被意外修改。如果你传递一个不可变对象（如\
  \ `NSString`），其效果与保留它相同。如果你传递一个 `NSMutableString`，那么字典将使用一个不可变的副本。\n\n最后，要记住的是，只有使用字符串作为键的字典才能与*键值编码*（key-value\
  \ coding，请参见 第 11 章）。当你在同一个字典中使用不同类作为键时，也必须非常小心，确保它们的比较方法在传递其他类的实例时能返回正确的值。\n\n\n\
  ### 遍历集合\n\n![Image](img/00073.jpg)\n\n\n你对集合执行的最常见任务之一是遍历集合中的每个元素并进行某些处理。在 Objective-C\
  \ 中有很多种方法。由于这是一个非常常见的任务，新的实现方法不断被添加。\n\n对于数组，你可以从 0 到 `[array count]` 遍历每一个索引并发送\
  \ `-objectAtIndex:` 消息。这是无效的。遍历集合的传统方法是使用枚举器（enumeration）；即 `NSEnumerator` 的实例。\n\
  \n\n> \n\n> > 注意\n> \n\n> \n\n> * *\n\n\n从 Objective-C 2 开始，引入了*快速遍历*（fast enumeration）。你可以对任何实现\
  \ `NSFastEnumeration` 协议的集合使用它。该协议定义了一个通过单个消息获取多个对象的方法。数量由调用者和接收者定义。编译器分配一个缓冲区并将指针传递给接收者。接收者可以将某些对象复制到缓冲区中，或者如果内部存储为\
  \ C 数组，则返回其内部存储的指针。\n\n该协议的方法被一个新的流程控制结构 `for``..in` 循环使用。当你使用它时，编译器将产生两个嵌套循环。在外层循环中，它将调用快速遍历方法，从集合获取接几个对象。在内层循环中，它将遍历这个\
  \ C 数组。\n\n\n> \n\n> > 注意\n\n\n> \n\n> * * *\n\n\n\n\n\n\n\n大多数集合类现在都实现了使用 blocks\
  \ 进行枚举的方法。使用这些方法可能非常方便，尽管这会限制你代码的可的可移植性。你可以通过将 `NSEnumerationConcurrent` 作为第一个参数传递给如\
  \ `-enumerateObjectsWithOptions:usingBlock:` 等方法，来使用 blocks 执行并发枚举。通常只有当 block 在每个元素上的执行耗时很长时，这种方法才可能带来性能提升。\n\
  \n每个集合都有不同的通过 blocks 进行枚举的方法。数组版本接收对象的索引作为参数，字典版本同时接收键和值，以此此类推。这些方法会比其他替代方案更慢，因为它们需要对每个对象调用一次\
  \ block（这与调用函数的开销相同），但它们可以更加更加方便。\n\n\n### 在集合中查找对象\n\n![Image](img/00074.jpg)\n\
  \n\n`NSArray` 和 `NSSet` 都实现了 `-containsObject:` 方法，如果集合包含一个与参数相等的对象，该方法将返回 `YES`。这使用了我们之前讨论集合类时介绍过的相等性概念：如果向一个对象发送以另一个对象为参数的\
  \ `-isEqual:` 消息并返回 `YES`，则这两个对象是相等的。\n\n在数组中，你可能想确切知道对象的位置，而不仅仅是知道它是否存在。有两个方法可以告诉你这一点：`-indexOfObject:`\
  \ 和 `-indexOfObjectIdenticalTo:`。后者使用指针比较来确定相等性。\n\n\n对于集合，性能情况有些不同。因为集合根据哈希值将对象存储在桶中，所以集合可以快速排除大量不同的对象。显然，因为集合是无序的，所以没有用于查找对象索引的集合方法。不过，有一个方法可以查找与对象相等的存储对象。\n\
  \n`NSSet` 的 `-member:` 方法返回与参数相等的存储对象。这对于确保对象的唯一性非常有用。`unique.m` 展示了一个从 C 字符串构造唯一常量字符串对象的方法。如果你两次向此方法传递同一个\
  \ C 字符串，你将两次都得到相同的 `NSString` 实例返回。\n\n\n![Image](img/00075.jpg)\n\n> 来自: unique.m\n\
  \n\n### 集合的类化\n\n![Image](img/00076.jpg)\n\n\n所有的标准集合都是“类簇（class clusters）”。这意味着为它们创建一个新的子类并不是易事。父类是抽象的，而具体的子类是私有的（所以你不能对其进行类化）。\n\
  \n每个集合的文档都说明了你必须在子类中实现的方法。实现此最简单的方法是通过委托：只需让与你要子化的集合类型相同的对象作为实例变量即可。`typedArray.m`\
  \ 示例使用了这种方法。\n\n\n![Image](img/00077.jpg)\n\n> 来自: checkedArray.m\n\n\n该类中的许多方法是简单易见的。例如，`-removeObjectAtIndex:`\
  \ 方法只是向封装的数组传递相同的消息。其他的，如 `-insertObject:atIndex:`，则执行类型检查然后调用真实数组。\n\n此示例实现了 `NSMutableArray`\
  \ 中的所有七个原始方法。这意味着在 `NSArray` 或 `NSMutableArray` 上声明的所有其他方法都将正常工作。\n\n\n> 来自: checkedArray.m\n\
  \n> * * *\n\n\n>\n\n> > 在 C++ 中，原始方法是父类中的纯虚方法，编译器会阻止你直接实例化父类，或实例化任何没有实现这些方法的子类。在\
  \ Objective-C 中没有相应的设施。\n\n\n> * * *\n\n类类的更常见原因是你想为底层表示实现一个不同的数据结构。例如，如果你将要在数组的一端插入对象并从另一端删除它们，你可能想使用可调整大小的环形缓冲区作为你的数组实现。\n\
  \n\n\n![Image](img/00079.jpg)\n\n> 来自: collection.mm\n\n\n在实践中，内存管理使得 C++ 集合中存储\
  \ Objective-C 对象变得复杂。Objective-C 对象期望任何想要保留其所有权引都发送 `-retain` 消息。C++ 集合并非考虑到 Objective-C\
  \ 而编写，并没有这样做，因此在与 Objective-C++ 结合使用时你必须非常小心。\n\n\n\n\n通过自动引用计数（ARC），这变得简单多得多。当你将\
  \ C++ 模板与 Objective-C 对象类型一起使用，它会被展开，并且模板中的每个赋值操作都会自动在其周围插入相关的引用计数调用。这甚至扩展到了支持弱引用的系统。本节开头的示例展示了如何使用\
  \ C++ map 类型来实现等同于具有“强引用到-弱引用”指针的 `NSMapTable` 的功能。\n\nC++ 的 `unordered_map` 需要两个支持类：一个用于定义相等性，另一个用于对对象进行哈希处理。这些通过简单封装相关的\
  \ Objective-C 消息来实现。\n\n\n![Image](img/00080.jpg)\n\n> 来自：collection.mm\n\n\n##\
  \ 8. 日期与时间\n\n在 Objective-C 中，有两个概念包含在“时间”这一泛指范围内。一个是绝对时间，另一个是时间间隔。时间间隔很容易处理。它们是简单的标量值，通常以秒为单位。`NSTimeInterval`\
  \ 类型用于存储时间间隔。它通常被定义为双精度浮点值，为大多数用例提供了足够的精度。\n\n\n时间间隔给出了两个绝对时间之间的差值。绝对时间的定义相当困难。诸如时区甚至不同的日历都使得定义绝对时间变得相对困难。Foundation\
  \ 框架中许多与时间和、日期相关的代码都是为了解决这个问题而设计的。\n\n### 查找当前日期\n\n\n> 来自：date.m\n\n`NSDate` 类封装了一个绝对时间值。它被存储为两个部分。其中一个是定义良好的固定点：纪元日（epoch\
  \ date）。另一个是自该纪元以来的时间间隔。\n\n\n另一个纪元时间作为 OpenStep 规范的一部分定义的，被称为参考日期（reference date）。这个稍微那么任意一点；它是当前千千年的开始：2001\
  \ 年的第一天。\n\n`NSDate` 的意义之一在于让你无需知道你正在使用哪一个参考日期。你可以使用 `-compare:` 或任何相关方法来比较两个日期，无论它们内部使用的是哪种纪元。\n\
  \n\n\n![Image](img/00082.jpg)\n\n> 来自：calendar.m\n\n\n西方世界的大部分地区在过去几百年里的某个时间点统一使用了格列日历。最早的采用者（据推他们经历了所有的\
  \ Bug）包括 1582 年的西班牙、葡萄牙和意大利。最晚的是中国，在 1929 年。\n\n这给本地化带来了一些严重问题。如果你有一个代表 UNIX 纪元之前\
  \ 120 年的日期，你该如何显示它？在格列日历中它将是 de 1850 年的 1 月 1 日，但如果你的用户所在的地区是一个在该日期之后才采用格列日历的国家，会发生什么呢？\n\
  \n\n其他地区可能完全不使用格列日历。大多数拥有电脑的人可能对格列日历有一定的经验，但强迫你的用户自己进行转换并不是一个好主意。\n\n> * * *\n\n\
  \n>\n\n > `NSCalendarDate` 是旧的 OpenStep 表示日期的方式。该类现在已弃用。与存储抽象时间的 `NSDate` 不同，`NSCalendarDate`\
  \ 存储的是格列日历中的日期。\n\n\n * * *\n\n在转换日期用于显示时，你可能需要使用两个类中的一个。如果你需要获取特定日历中日期的各个组件，你需要使用\
  \ `NSCalendar` 类。如果你想生成字符串值，应该使用 `NSDateFormatter`。\n\n\n日期组件对象并不存储它所所属的日历，因此没有比较两个日期组件对象的定义方法。这是刻意为之。如果你正在比较日期，应该使用\
  \ `NSDate` 对象比较绝对时间，仅在显示时对其进行本地化。\n\n\n\n\n`NSDateFormatter` 类为你解决了这个问题。它提供了一个方便的类方法\
  \ `+localizedStringFromDate:dateStyle:timeStyle:`，可以返回一个包含本地化日期和时间的字符串。第二个和三个参数分别描述了日期和时间组件所需的详细程度。这种程度可以从不显示任何内容到非常简短的数字描述，再到写出完整月份和日期名称的长描述不等。\n\
  \n\n![Image](img/00083.jpg)\n\n> 出自：elapsed.m\n\n\n这不是计算经过时间最快的方法。`gettimeofday()`\
  \ 系统调用会在结构体中返回系统时间。这避免了创建对象和发送消息的开销，但工作量稍大一些，因为你需要自己处理该结构体。该结构体在单独的字段中存储秒和微秒，因此减法操作比仅仅比较两个标量值要费力。\n\
  \n### 从字符串解析日期\n\n\n> 出自：stringdate.m\n\n`NSDate` 类有一个构造函数，可以让你从 ISO 8601 格式的字符串构建日期。这在你需要解析从用于交换的文件中的日期时非常有用，但在处理用户提供的数据时就不那么好用了。\n\
  \n\n当你创建一个日期格式化器时，可以将 locale（区域设置）设置为显式的区域设置，或者将其设置为用户当前的区域设置。你可以使用该区域的一种标准时间和日期格式，或者通过\
  \ `-setDateFormat:` 方法显式地指定一个。该方法接受模板字符串作为参数，但在大多数代码中都不建议使用它，因为它没有考虑到区域设置。\n\n\n\
  ### 接收定时器事件\n\n![Image](img/00085.jpg)\n\n\n`NSTimer` 类封装了一个在特定时间产生事件的事件源。原理上类似于\
  \ `alarm()` 系统调用，尽管你可以同时调度多个定时器。\n\n你总是使用本节开头示例中的方法来构造定时器。该方法会在同一个操作中创建并调度一个新的定时器。\n\
  \n\n还有另一个构造函数接受 `NSInvocation` 作为参数。这种更难使用，但更强大，因为它允许使用带有任何参数的任何消息。\n\n当你这样创建定时器对象时，它会被自动释放（autoreleased），但它会被\
  \ `run loop`（运行循环）对象保留。你只有在在使用 `NSRunLoop` 时才能使用定时器。运行循环对象等待来自内核的事件——例如，定时器或文件描述符上的数据变得可用——然后响应这些事件发送消息。\n\
  \n\n如果你正在编写命令行应用程序或服务器，你仍然可以使用 `NSRunLoop`。它是 Foundation 框架的一部分，但你必须手动创建它并告诉它运行。这非常简单，是在上一个示例中\
  \ `-start` 方法的最后一行完成的。\n\n## 9. 使用属性列表（Property Lists）\n\n\n属性列表的设计意图是抽象的。它们不绑定于特定的语言或特定的表示形式。目前有三种定义的属性列表序列化方式。旧的是\
  \ OpenStep 属性列表格式。这是一种非常紧凑的、人类可读格式。\n\n遗憾的是，OS X 无法写入旧式的属性列表。它可以读取它们，但规范没有定义存储日期或其它几项内容的方法，因此向它们写入是无效的。GNUstep\
  \ 扩展了 OpenStep 属性列表格式，允许你存储新格式支持的所有内容。\n\n\n其他语言的一些库可以处理属性列表。WindowMaker 中的 WINGS\
  \ 库可以读取和写入它们，NetBSD 自带的库也是如此。Core Foundation 框架。\n\n### 在属性列表中集合\n\n\n> 出自：writeplist.m\n\
  \n数组和字典类实现了 `-writeToFile:atomically:` 方法。这些方法让你可以使用默认属性列表格式将集合的内容导出到文件中。\n\n\n\
  如果你将 `YES` 作为第二个参数，该方法将确保磁盘上的表示始终是一致的。它会将属性列表写入临时文件，并在写入完成后重命名该文件。\n\n运行本节开头的代码将生成一个\
  \ `example.plist` 文件，其中包含一个作为根元素的数组和四个字符串。\n\n\n> 出自：example.plist\n\n在当前的 OS X\
  \ 中，这种方法将使用 XML 属性列表格式。你可以看到，这非常冗长。旧的 OpenStep 属性列表格式使用括号表示数组，双引号表示字符串，因此只有只有的一半。将其转换为二进制格式可以将文件大小从\
  \ 294 字节减小到 82 字节。\n\n\n然而，对于较大的属性列表，情况并非如此。例如，Safari 将你的历史记录存储在二进制属性列表中。目前我的有 15MB。如果我将其转换为\
  \ XML 格式，它会变成 34MB。解析开销也会增加，无论是在 CPU 时间还是内存使用上。\n\n\n\n\n遗憾的是，集合类不会以默认（`XML`）格式以外的任何格式写入它们自己的属性列表版本。相反，你必须使用\
  \ `NSPropertyListSerialization` 类，我们将在接下来的几个章节中介绍它。\n\n属性列表格式都是分级结构的。它们不支持写入循环数据结构。在这个示例中的第二个数组包含一个指向自身的指针。当将此写入属性列表时的行为是未定义的。在\
  \ OS X 上，只有递归指针之前的元素会被存储在文件中。任何出现在该指针之后的对象都会被忽略。\n\n\n![Image](img/00088.jpg)\n\n\
  > 来源：`readplist.m`\n\n\n这听起来很简单，但存在一些复杂性。最重要的一点是属性列表没有存储任何关于可变性的信息。例如，一个 `NSString`\
  \ 和一个 `NSMutableString` 的存储方式完全相同。\n\n当你读回属性列表时，你应该得到什么？如果你通过向 `NSArray` 类发送 `+arrayWithContentsOfFile:`\
  \ 消息来读回数组，你将得到一个不可变数组。如果你向 `NSMutableArray` 发送相同的消息，你将得到一个可变数组。\n\n\n如果你想读回可变对象，你需要使用\
  \ `NSPropertyListSerialization`。该类处理属性列表的读取和写入，并提供了比各种集合类更细粒粒的控制。\n\n> * * *\n\n\
  \n> > 注意：\n> \n> > 如果你阅读苹果最新版本的文档，你会发现我们在 `NSPropertyListSerialization` 上使用的方法被标记为未来将弃用。这是因为它是在\
  \ Apple 开始使用 `error:` 参数的期间引入的，但在他们引入 `NSError` 类之前。遗憾的是，推荐用于替换它的方法尚未提供等等的功能。\n\n\
  \n当你使用该类读取属性列表时，可以传递一个可变性选项作为参数。\n\n这里有三种可能的选项。默认是所有对象都是不可变的。本章开头示例中所使用的选项则是另一个极端，使所有内容都变为可变。在数组中的一个字符串上添加后缀演示了这一点。\n\
  \n\n当你用这种方式读取属性列表时，属性列表序列化类会告诉你属性列表的格式是什么。\n\n### 属性列表格式\n\n\n> 来源：`makebinaryplist.m`\n\
  \n\n这些并不是硬性规定。属性列表格式的意义在于可以在不同表示之间进行无损转换，因此你可能随处使用二进制格式——因为它更密集且解析更快——并期望用户在想要修改它们时转换属性列表。\n\
  \n当你使用 `NSPropertyListSerialization` 写入文件时，可以选择你使用哪种格式。该类非常有帮助，会在你读取时告诉你当前属性列表的格式是什么。\n\
  \n\n> \n\n> > 注意：\n> \n\n> * * *\n\n为了效率，将属性列表以二进制格式存储是相当常见的。你的用户随后会决定想在文本编辑器中查看这些文件，因此他们会使用\
  \ `plutil` 工具将它们转换为 `XML` 格式。然后，他们当然会忘记转换回去，所以你的程序下次读取它们时速度会很慢。\n\n\n### 使用 JSON\n\
  \n![Image](img/00090.jpg)\n\n\n在过去的几年里，另一种与旧式 OpenStep 属性列表非常相似的格式变得流行了。`JavaScript\
  \ Object Notation (JSON)` 是序列化 JavaScript 对象的子集，存储数据但不存储代码。\n\n最近版本的 Cocoa 包含一个基于\
  \ `NSPropertyListSerialization` 设计的类，用于加载和存储 `JSON` 数据。它比属性列表编码有稍多限制。你只能在叶节点中存储数字或字符串，并且所有集合必须是数组或字典。\n\
  \n\n本节开头的示例展示了如何与 `JSON` 进行转换。JSON 标准要求数据必须是某种 Unicode 编码。序列化类可以自动检测编码，因为 `JSON`\
  \ 流的前两个字符总是 `ASCII`。这使得在缺少字节顺序标记的情况下，它可以通过 NULL 字节的位置来检测多字节编码。\n\n在这个示例中，我们对 `JSON`\
  \ 进行了格式化打印。这主要用于调试。它会缩进输出以提高可读性。这会消耗一点 CPU 并可能占用更多空间，因此对于要在网络传输并被另一个程序使用的数据来说是个坏主意，但对于要手动编辑的数据来说是个好主意。\n\
  \n\n![Image](img/00091.jpg)\n\n> 来源：`defaults.m`\n\n\n每个应用程序都有自己的*默认域*，通常是一个反 DNS\
  \ 表示法的字符串（例如 `com.apple.TextEdit`）。`NSUserDefaults` 类可以访问该域的数据。\n\n用户默认系统会从多种来源读取数据。最有用的之一是命令行。你可以作为命令行参数为任何\
  \ OS X 应用程序指定键值对，这在调试时极其有用。\n\n\n\n\n\ndefaults 系统与 Windows 注册表类似，但有几点重要的区别。两者都支持多层级的键（用户、系统和网络），但\
  \ defaults 系统向程序员隐藏了所有这些内容。尽管两者看起来像树形结构，但注册表是一个单一数据库，而 defaults 系统将数据存储在每个作用域的独立文件中。这使得使用第三方工具修改默认值变得容易，并且意味着它的扩展性更好，因为你永远不需要一次将一个或两个文件读取到内存中。缺点是对\
  \ defaults 的操作不是事务性的。同时从两个程序修改同一个作用域的行为是未定义的。\n***\n\n与字典不同，`defaults` 对象具有一些方便的方法，用于访问非对象类型和检查对象的类型。在当前的示例中，我们向它发送了一个\
  \ `-stringForKey:` 消息。它封装了 `-objectForKey:` 方法，但确保了返回值为字符串。\n\n还有其他方便的方法，例如 `-floatForKey:`\
  \ 和 `-setFloat:ForKey:`，它们接收原始 C 类型，并在将其存储到 defaults 系统中之前将它们封装在 `NSNumber` 实例中。\n\
  此示例中的代码最后最后向 defaults 对象发送了 `-synchronize` 消息。这通常不是必要的。`defaults` 对象会定期与磁盘存储进行同步。但在本示例中，我们没有使用运行循环（所以计时器将不起作用），并在修改默认值后立即退出，因此如果没有此操作，我们的更改将永远不会到磁盘。\n\
  \n运行此示例，你可以看到初始值为 `nil`，因为 defaults 中没有存储任何内容。作为参数传递给短程序的值存储在 defaults 中，并在下次运行时自动检索。\n\
  \n这还演示了 `NSArgumentDomain` 的使用。defaults 有多个来源，它们按顺序加载并覆盖之前的内容。最后一个（因此优先级最高）的默认值是命令行参数。指定\
  \ `-example` 命令行选项会将 defaults 中的 `@`*\"example\"` 键设置为传递给参数的任何内容。\n这并不会替换持久值，它只是在程序的这次特定运行中覆盖了它。你可以看到，当我们再次运行程序而不带上命令行参数时，将使用两次调用之前的旧值。该值在程序的第三次运行运行时被提交到磁盘，但在第四次运行中没有被使用，因为一个参数替换了它。在第五次运行中，没有\
  \ `-example` 参数，它再次可见。你可以通过 `NSUserDefaults` 显式地查看单个作用域，但很少有人想这样做。\n\n![Image](img/00092.jpg)\n\
  \n> 输出自：`defaults`\n如果你正在编写一个命令行工具，这提供了一种解析命令行参数非常方便的方法。你可以在 defaults 系统中存储命令行参数的默认值，并让用户自动覆盖它们，而不需要任何解析代码。\n\
  \n### 在 User Defaults 中存储任意对象\n\n![Image](img/00093.jpg)\n> 来源：`colordefault.m`\n\
  \n通常，你想在 defaults 中存储基础 Foundation 数据类型以外的内容。一个常见的例子是颜色。如果你允许用户以任何方式自定义界面，你通常希望他们选择的颜色在程序调用之间持久。这很容易；只需将\
  \ `NSColor` 对象存储在 defaults 中即可。\n\n如果属性列表（property lists）支持任何对象，这样做就很简单了，但它们只支持有限的类型。要存储其他任何，你必须首先将其归档为\
  \ `NSData` 对象然后存储它。要检索它，你需要获取 `NSData` 对象然后将其反归档回原始对象。这是使用 `NSKeyedArchiver` 和 `NSKeyedUnarchiver`\
  \ 完成的。\n要归档一个对象，你可以使用：\n```objc\ndata *data = [NSKeyedArchiver archivedDataWithRootObject:myObject\
  \ error:&error];\n```\n\n要反归档一个对象，你可以使用：\nNSData *data = [[NSUserDefaults standardUserDefaults]\
  \ objectForKey:@\"myKey\"];\nid myObject = [NSKeyedUnarchiver unarchivedObjectOfData:data\
  \ error:&error];\n```\n\n这种方法允许你存储任何符合 `NSSecureCoding` 的对象。\n## 10. 与环境交互\n\nObjective-C\
  \ 通常用于类 Unix 平台，它继承了环境的概念。这包括工作目录、环境变量等概念。\n\n在传统的 Objective-C 环境中，你被期望从 C 代码中获取这些值。通过\
  \ OpenStep，他们引入了 `NSProcessInfo` 类，该类提供了更高层次的抽象。\n### 获取环境变量\n\n![Image](img/00094.jpg)\n\
  \n> 来源：`env.m`\n在 OS X 上，可以通过三种方式访问环境变量。其中两种可以在任何地方工作，而第三种只在某些平台上起作用。\n\nOS X 像\
  \ Windows 和大多数 UNIX 系统一样，将环境作为 `main()` 函数的第三参数传递给进程。这是一个以 `NULL` 终止的 C 字符串数组。C\
  \ 和 POSIX 标准并不要求此第三参数，因此在可移植代码中依赖它是一个坏主意。\n\n当程序启动时，内核时间加载器会加载所有需要的共享库，然后跳转到 C 库中的特殊函数，通常称为\
  \ `_start`。然后它调用 `main()`，但在调用之前它存储了指向环境的指针。\n你可以通过调用 C 标准函数 `getenv()` 来访问此存储。或者，你可以向单例进程信息对象发送\
  \ `-environment` 消息来访问环境变量。这返回一个包含环境的字典。\n\n***\n\n> > 注意\n> \n\n> 没有使用 Objective-C\
  \ 代码设置环境变量的方法。修改环境通常在 C 代码中完成，作为调用 `exec()` 族函数之一的预备工作。这只在类 Unix 平台上有效，例如在 Windows\
  \ 或 Symbian 系统上则无效。因此，不建议这样做。你可以通过向 `NSTask` 发送 `-setEnvironment:` 消息来设置一个新的字典，该字典将用作新子进程的环境。\n\
  \n***\n### 解析命令行参数\n\n![Image](img/00095.jpg)\n\n> 来源：`args.m`\n标准 C 未提供一种在 `main()`\
  \ 函数之外获取程序参数的方法。GNU C 标准库提供了一些扩展，用于在程序启动后访问它们，在大多数类 Unix 平台上，你可以从 `/proc` 文件系统读取它们，但在\
  \ C 代码中没有简单且可移植的方法来获取它们。\n\n\n\n\n\n通过这种方式访问参数是非常不寻常的。我们在上一章看到的，解析命令行参数的最简单方法是使用\
  \ `NSUserDefaults` 中的 `NSArgumentDomain`。当一个 Objective-C 程序启动时，所有的命令行参数都会读取并插入到一个字典中，该字典由默认系统（defaults\
  \ system）使用。\n\n这使得结合（可配置的）默认值提供一组命令行变得变得容易。在使用方法时，你永远不会直接与参数交互。相反，你向默认系统请求某个键的值，它会返回一个可能来自持久化存储位置，也可能来自命令行的结果。\n\
  \n\n### 访问用户的本地区域\n\n![Image](img/00096.jpg)\n\n\n如果你的程序以任何方式与用户直接交互，你可能想在某个时刻对其进行本地化。Objective-C\
  \ 提供了许多丰富的设施来实现这一点。\n\n`NSLocale` 对象封装了一个本地区域。获取此类别的实例有多种方法。如果你向它发送 `+systemLocale`\
  \ 消息，你将获得系统区域。然而，这通常不是你应该使用的。它是当用户本地区域无法正常工作时的回退本地区域。\n\n\n或者，你可以向该类发送 `+autoupdatingCurrentLocale`\
  \ 消息。这会返回一个始终代表当前本地区域的 locale 对象，即使它发生了变化也是如此。这可能会让人困惑，因为在该对象上对同一个方法使用相同参数的连续调用可能会返回不同的值。\n\
  \n如果你想在程序运行时支持更改本地区域，那么避免缓存从 locale 对象返回的数据是非常重要的。如果你向用户展示了保留在屏幕上的内容，你应该确保监控通知并更新它们，即使你正在使用一个自动更新的\
  \ locale 对象。\n\n\n![Image](img/00097.jpg)\n\n> From: suddenDeath.m\n\n\n在这两种情况下，内核都会回收其所有的共享资源，但在突然终止的情况下，这些资源中的某些可能被留在了不一致的状态。这其中一个典型的例子是正在修改中的文件。\n\
  \n这在过去是复杂应用程序（如文字处理器）中的一个大问题。它们会打开文件进行写入，开始修改，然后崩溃，导致文件处于一种非常难以恢复内容的状态。你可以通过使用大多数\
  \ Foundation 对象上的原子写入设施来避免这一点，这些设施写入一个临时文件然后将其重命名，因此写入要么完全成功，要么完全失败——甚至不会只成功了一半。\n\
  \n\n这对于长时间空闲的长运行后台任务特别有用。它们通常会被内核交换到磁盘。当你要求它们优雅地退出时，需要将大量的代码和数据调入以处理退出。通过突然终止，交换文件中的页面将只需被标记为可重用。\n\
  \n在你的应用程序中支持突然终止非常简单。你调用 `NSProcessInfo` 的两个方法，分别在某个不可中断的操作的两侧调用。\n\n>\n> > 注意\n\
  >\n> > 如果你配合 `NSDocument` 基础设施使用 AppKit，你就不需要做任何事情。当任何文档有未保存的数据时，你的应用程序将不会标记为不支持突然终止。\n\
  >\n\n这些方法被称为 `-disableSuddenTermination` 和 `-enableSuddenTermination`，但名称略有误导性。它们并没有实际上启用或禁用突然终止，而是修改了一个计数器。当计数器达到\
  \ 0 时，应用程序被标记为可被杀死。\n\n这意味着你可以在不同线程中使用它们或嵌套它们而没有任何问题。计数器初始设置为一，因此你必须显式地向进程信息对象发送\
  \ `-enableSuddenTermination` 消息来启用它。如果你正在创建一个应用程序，可以通过在应用程序包的属性列表文件中设置一个键值来避免这一点。\n\
  \n\n这些是应该被图形文件管理器视为文件的目录。NeXT 曾非常有效地利用它们存储不同操作系统的二进制文件，允许一个文件服务器包含 OPENSTEP、Solaris\
  \ 甚至 Windows。包包含的内容之一是名为 `info.plist` 的属性列表，它描述了应用程序的一些属性，例如主类、启动时加载的资源等。初始终止状态就是这些属性之一。\n\
  \n对于 iOS 和 OS X 10.7，突然终止非常重要。这些系统在内存不足时会使用突然终止终止应用程序。预计应用程序能够在不丢失用户可见状态的情况下重启。对于\
  \ OS X 10.7，应用程序中的每个窗口都应该能够存储其状态并重新加载。\n\n\n典型程序中的大量代码涉及访问和修改对象的状态。\n\n键值编码（KVC）机制旨在为设置和获取属性提供一种抽象接口。它与键值观察（KVO）机制结合，后者提供了一种观察另一个对象特定属性的变化的抽象方式。\n\
  \n\n视图类通常需要从模型对象上获取和设置属性。通过 KVC，有一种通用的、参数化的机制来实现这一点。你只需要为视图对象提供一个键或键路径，它就能自动从模型中检索数据，而无需了解模型实现的任何细节，甚至无需了解其支持\
  \ KVC 之外的接口。\n\n### 通过键访问值\n\n\n> From: kvc.m\n\n\n\n\n与符合 KVC 协议的对象交互的两种常用方法是 `-valueForKey:`\
  \ 和 `-setValue:forKey:`。`NSDictionary` 上的 `-objectForKey:` 方法在获取值时的行为与前者几乎相同。`NSDictionary`\
  \ 上的两个设置方法的工作方式略有不同。\n\n你会注意到的第一点是，如果你在不可变字典上使用 `-setObject:forKey:`，会得到编译时警告。但如果你使用\
  \ `-setValue:forKey:`，则不会。该方法是由 `NSObject` 实现的。当你在一个不可变字典上调用它时，它会在运行时失败，但在编译时不会没有任何提示。\n\
  \n\n### 确保符合 KVC 协议\n\n![Image](img/00099.jpg)\n\n\n当你使用 KVC 方法时，你几乎总是调用 `NSObject`\
  \ 中的实现。这些实现会尝试确定属性究竟应该如何被访问。\n\n它们首先查找的是访问器方法（accessor methods）。按照惯例，Objective-C\
  \ 类提供 `-property` 和 `-setProperty:` 方法来读取和设置“属性”。如果你的类提供了这些方法，它们就会被调用。`KVC` 还会查找其他几个方法，包括用于布尔属性的\
  \ `-isProperty` 等。\n\n\n> 自：kvc.m\n\n如果这失败了，类将收到一个 `+accessInstanceVariablesDirectly`\
  \ 消息。如果它返回 `YES`，KVC 方法将寻找与属性名称匹配的实例变量（instance variable）并使用它。`NSObject` 中该方法的实现确实返回了\
  \ `YES`，因此只有在你想要防止 KVC 检查实例变量时，才需要重写它。\n\n\n![Image](img/00101.jpg)\n\n> 自：kvc.m\n\
  \n\n如果你使用声明的属性（declared properties）来合成访问器方法，你将免费获得 KVC 兼容性。kvc.m 的示例展示了实现同一个 KVC\
  \ 属性的所有不同方式。\n\n这个示例使用一个公共类和若干支持该属性的私有子类。你可以交替使用所有这些类的实例，至少在存储该键时如此。更重要的是，你可以使用类似\
  \ `KeyIVar` 或 `KeyFallback` 的类进行原型设计，以后切换到其他方案。\n\n\n你可能已经注意到这个示例的一点是，KVC 只处理对象，但实例变量是一个\
  \ `int`。通过某种方式，这仍然有效。这是因为 KVC 执行了*自动装箱（auto-boxing）*。我们通过将 `@`*\"12\"** 作为参数传递给\
  \ `-setValue:forKey:` 来设置此属性。KVC 代码在发现该属性是整数后，向字符串对象发送了 `-intValue` 消息。\n\n在反方向，它构造了一个封装原始值的\
  \ `NSNumber`。如果实例变量或访问器方法使用对象类型，这段代码会被跳过。注意，KVC 只访问运行时类型信息，并且所有对象类型在类型编码中都被编码为 `\"\
  @\"`。\n\n\n如果你正在为对象类型编写 KVC 访问器，你可能想要添加一个 `assert` 语句来检查该对象是否具有兼容的类。\n\n### 理解键路径（Key\
  \ Paths）\n\n\n我们使用 KVC 的大部分工作可以在不使用 KVC 的情况下轻松完成。如果你想让一个对象访问另一个对象的特定属性，并且不想硬编码它，你只需要存储一个选择器（selector）并使用标准的\
  \ Objective-C 消息发送机制来调用它。\n\n如果属性存储在该对象上，这种方法运行良好，但如果你想要一个间接属性（indirect property）会怎样？你可以存储一个选择器数组，并使用每个选择器获取中间对象，但这太麻烦了。\n\
  \n\n> * * *\n\n> \n\n\n> \n\n> > 访问声明属性的点符号看起来与 KVC 符号非常相似，人们很容易混淆两者。这很遗憾，因为它们完全无关。点符号生成的是指向访问器的消息发送。接收键路径的\
  \ KVC 方法是更高层次的抽象。\n\n\n> > 这种相似性是故意的。在公开发布之前，苹果员工使用 KVC 术语来引用声明的属性，两者本应该是密切相关的。\n\
  \n> \n\n\n键路径的大优势在于，例如一个通用视图只需要存储指向模型对象的指针。它不需要指向模型内部各种组件的指针，可以通过键路径访问这些组件。\n\n\
  例如，如果你有一个显示人物信息的视图，你可以通过 `@*\"father\"** 和 `@*\"mother\"** 键路径将家谱中的成员连接起来。你还可以在显示祖父母关系的相同视图中使用\
  \ `@*\"father.mother\"** 键路径，以此此类推。\n\n\n### 观察键（Observing Keys）\n\n![Image](img/00102.jpg)\n\
  \n\n拥有统一的键设置机制是有用的，但它并不特殊。KVC 的真正力量来自于 KVO（键观察），它允许你监控键的变化。\n\n绑定机制利用 KVC 和 KVO\
  \ 消除了许多情况下对控制器的需求。当视图想要修改模型时，它使用 KVC。当模型变化时，视图接收来自 KVO 的通知并更新以反映变化。这两种密切相关的技术的结合允许对象之间建立紧密连接，而不会导致设计上的紧耦合。\n\
  \n\n\n\n在这个示例中，它是一个类方法。大多数时候，你将使用实例方法，但重要的是记住在 Objective-C 中类也是对象，因此你可以在几乎任何通常使用对象的地方使用它们。\n\
  \n\n用于添加观察者的方法中的 `options:` 参数是一个位域。你可以请求只获取新值、只获取旧值，或者两者都要。你还可以请求在更改之前和之后都发送通知。\n\
  \n这让你能够轻松地执行诸类任务，例如记录对对象进行的更改，这对于实现撤销（undo）支持非常有帮助。如果你的模型对象符合 KVO 规范，你可以获取每次更改的通知，保存旧值，稍后将其还原（使用\
  \ `KVC`）。像这种方式实现撤销的逻辑可以完全与你模型对象的实现细节解耦。\n\n\n![Image](img/00103.jpg)\n\n> 摘自：kvo2.m\n\
  \n\n直接设置实例变量只是存储到内存中。没有简单的方法可以自动检测内存中的单个值何时被修改。这意味着你必须将对实例变量的直接访问用在本节开头代码片段所示的两个调用括起来。\n\
  \n如果需要，这些调用将触发 KVO 通知。请注意，如果你调用的是访问器方法，则不需要发送这些消息。这是 Objective-C 中发现的晚绑定优势之一。\n\n\
  \nKVO 可能是 Foundation 框架中看起来最像魔法的部分。值得记住，KVO 所做的没有任何你自己代码无法做到的。它不依赖于任何未公开的接口、编译器修改或类似的技巧。如果你愿意，你可以在自己的代码中实现等效的功能。你可以查看\
  \ GNUstep 的实现来了解是如何完成的。\n\n在 GNUstep 和 OS X 上，KVO 机制都是使用 `isa-swizzling` 实现的。这是一种技巧，在对象创建后，将对象的\
  \ `isa` 指针切换到一个不同的类。通常，这种技巧与运行时类创建结合使用，你将一个新类作为类层次结构的叶节点插入，并让对象的 `isa` 指针指向它。\n\n\
  \n如果你想测试一个对象是否是特定类的实例，请使用 `-isMemberOfClass:` 或 `-isKindOfClass:`。向对象发送 `-class`\
  \ 消息来获取它的类，而不要只检查 `isa` 指针。\n\n## 12. 处理错误\n\n\n书中的大部分示例代码都假装错误从未发生。这本书页幅很小，为任何一个示例编写适当的错误处理代码会很快填满页面，而这些内容与示例的要点大部分无关。\n\
  \n大多数运行时可以检测到的错误源于一个函数或方法使用无效输入调用另一个。处理这种问题的最佳方法很大取决于语言。例如，Erlang 不鼓励在模块级别进行防御性编程；如果你的模块处于未定义状态，你应该杀死它并创建一个新版本。在\
  \ C 语言中，鼓励你验证每个输入并检查每个返回值。在 Java 中，你可以通过异常来推迟错误处理。Lisp 和 Smalltalk 允许你在错误发生时检查堆栈，并动态修复提供错误输入的代码。\n\
  \n\n\n### 异常的运行时差异\n\n异常处理的实现非常困难。当你抛出一个异常时，你需要展开抛出异常和捕获异常之间的每一个栈帧。有几种方法可以实现。在像\
  \ Smalltalk 这样具有堆栈检查能力的语言中，相对容易。异常可以查看每个栈帧并执行展开。\n\n\n这在 Objective-C 中是不可能的，因为你需要能够与\
  \ C 交互。在抛出异常和捕获异常之间的某些栈帧可能是 C，你不能期望系统上所有的 C 代码都经过修改以便抛出异常时返回另一个值。\n\n另一个选项是微软的*结构化异常处理\
  \ (SEH)*，在进入和退出异常处理块时，推入弹出一个清理代码地址的链表。当抛出异常时，使用此栈来找到要运行的清理代码并跳转到栈中的正确位置。这本应该是 Objective-C\
  \ 的一个选项，但它的开销很大。它要求你在每次进入和退出异常处理块时运行某些代码，然后在抛出异常时再运行一些。\n\n\n正如你可以想象的，这远非理想。它不支持在中间栈帧中执行清理操作。如果你的\
  \ Objective-C 代码调用了某些 C++ 代码，然后 C++ 代码再次调用了 Objective-C 代码，你可以 `longjmp()` 跳过 C++\
  \ 代码，导致其析构函数无法运行。\n\n\n\nGNU 运行时在 2004 年引入了与 C++ 的异常处理机制。在此模式下编译的每个函数（无论源语言是什么）都会导出一些\
  \ `DWARF` 调试数据，描述栈帧的布局以及如何进行回溯（unwind）。这通常被称为*零成本异常处理*，因为它对不使用异常处理的代码不会产生任何运行时开销。如果你在此模式下编译\
  \ C 代码，二进制文件会因为额外的回溯信息而变大，但除非在 C 代码中抛出异常，否则这些额外数据甚至不会被换入内存。\n\n有了这种支持，当 Objective-C\
  \ 异常穿过 C++ 栈帧抛时，可以在 C++ 中执行清理代码，反之亦然。你还可以使用 GCC 的 `__attribute__((cleanup))` 扩展在\
  \ C 中注册清理代码。\n\nApple 在 64 位运行时中采用了这一变化。这显著改变了异常的性能特性。使用 `setjmp()`/`longjmp()`\
  \ 异常时，进入异常处理区域的代价很大（需要保存所有寄存器），但抛出异常非常快。然而，这也是不安全的，因此文档建议捕获异常后通常应该终止程序。异常应用于半优雅的异常终止，除非它们在抛出的位置附近被捕获。\n\
  使用零成本异常，进入异常处理块是免费的。抛出异常非常昂贵，但是安全的。这意味着可以在代码中放置 `@try` 块而不会降低任何速度，并在发生异常情况时随时抛出异常。\n\
  \n如果你需要与 Apple 的 32 位运行时兼容，避免异常仍然是一个好主意；如果你频繁使用 `@try` 块，它们会增加大量的开销。\n\n> **注意**\n\
  \n### 抛出和捕获异常\n\n![Image](img/00104.jpg)\n\n\n旧的 Objective-C 代码可能包含以 `NS_DURING`\
  \ 开头的块。这些是定义 `setjmp()` 风格异常处理的旧宏。在较版本的 Foundation 框架中，它们被定义在 `NSException.h` 中，以便使用新的异常处理关键字。\n\
  \n这些旧宏有几个局限性，即使它们作为新关键字的封装器使用。首先，它们只允许捕获 `NSException` 实例。其次，它们没有等同于 `@finally`\
  \ 的机制（运行清理代码并继续回溯），尽管你可以通过捕获异常然后重新抛出它来模拟这种行为。\n\n\n![Image](img/00105.jpg)\n\n>\
  \ 来自：`NSException.h`\n\n\n抛出异常的最佳方法仍然向 `NSException` 实例发送 `-raise` 消息。你也可以使用 `@throw`\
  \ 关键字抛出任意对象，但如果它不起作用，不要太惊讶。如果你使用的是 GNU 运行时或现代 Apple 运行时，它可能会生效，但你正在做未经过充分测试的事情。\n\
  \n### 使用异常对象\n\n\n> 来自：`throwexception.m`\n\n`NSException` 类曾用于实现一个 `longjmp()`\
  \ 缓冲区栈，并在需要时跳转到栈顶的一个。现在，回溯完全由运行时和回溯库完成，但 `NSException` 仍用于封装异常。\n\n\n描述（description）是人类可读的描述。这通常用于调试，因此本地化并不重要。理解发生了什么比让用户理解什么更重要。最后，用户信息字典是一个包含某些键值对的\
  \ `NSDictionary`。在其中放入什么内容完全取决于抛出异常的代码，尽管大多数抛出异常的方法都会记录它们将在用户信息字典中放入什么内容。\n\n你可以用它将任意信息传递到捕获异常的任何地方。因为它是一个字典，你可以稍后添加一些额外的键，而不会破坏与现有代码的二进制兼容性。\n\
  \n\n在最近版本的 OS X 上，异常对象还包含一些有助于调试的额外信息。向它发送 `-callStackAddresses` 消息将给你一个包含 `NSNumber`\
  \ 的 `NSArray`，这些数字指向栈上所有函数的返回地址。这并不是特别有用，但 OS X 10.6 引入的 `-callStackSymbols` 方法是有用的。它会给你提供异常创建时栈上所有函数的名称。\n\
  \n后一种方法由未处理异常处理器（unhandled exception handler）使用，每当回溯异常未被捕获时，该处理器就会被调用，在程序终止前打印栈跟踪。你可能想使用\
  \ `NSSetUncaughtExceptionHandler()` 函数将此处理器替换为你自己的实现。如果你有错误报告机制，那么拥有未处理异常的后向轨迹将非常有用。\n\
  \n\n![Image](img/00107.jpg)\n\n> 来自：`tryCatch.mm`\n\n\n在较新的实现中，Objective-C++ 使用统一的异常模型。带有\
  \ Objective-C 类型的 `catch` 语句可以捕获通过 `@throw` 抛出的对象。同样，带有 Objective-C 类型的 `throw`\
  \ 语句产生的异常可以被 `@catch` 捕获。\n\n本节开始的代码片段展示了这种操作，尽管只是一个简单的案例。旧的 Objective-C++ 编译器会拒绝它。你可以用此检查检查目标是否支持统一异常模型。\n\
  \n\n![Image](img/00108.jpg)\n\n> 来自：`releaseexcept.m`\n\n\n\n异常处理让内存管理变得稍微复杂。如果你在一个方法中创建了一个新对象并在结束时释放它，你必须考虑到异常本质上是一种**浅层伪装的非局部跳转（non-local\
  \ goto），而且突然有很多方法可以退出你的方法。每一个函数调用或消息发送都变成了潜在的返回路径。\n\n你可以通过在 `@try` 块的末尾添加一个 `@finally`\
  \ 块来轻松地解决这个问题。该块中的代码始终会被执行，无论是通过到达末尾退出 `@try` 块还是通过抛出异常退出。\n在使用异常时可能遇到的另一个问题是重新抛出异常对象。异常对象通常是自动释放（autoreleased）的。这意味着，在手动内存管理下，它们会在当前自动释放池（autorelease\
  \ pool）删除时被删除。\n\n在大多数代码中这不是问题。你最常用的自动释放池会在整个运行循环（run loop）期间持续。然而，有时你会创建自己的自动释放池。\n\
  \n如果你在 `@finally` 块中清空了自动释放池（这似乎是一个显而易见的解决方案），你会遇到一个问题。异常对象会在回溯你的栈帧时被删除，上一个栈帧在查找异常类型时可能会因为引用了一个孤立的指针而崩溃。\n\
  为了避免这种情况，你需要确保在删除自动释放池之前保留（retain）异常对象，并在之后再次对其自动释放。这就是为什么抛出 `NSException` 对象以外的任何对象都是坏主意的原因之一。任何遵循\
  \ Apple 文档中关于此操作建议的人，最终代码将只能正确处理 `NSException` 对象，并会过早销毁任何其他对象类型。\n\n> 注意\n>\n>\
  \ 在 Java 中，你也可以将异常作为局部跳转，通过在同一个方法中抛出并捕获异常，向虚拟机声明某条代码路径是非常的。这在 Objective-C 中也是可能的，但效率极低。`@throw()`\
  \ 语句会调用 `objc_exception_throw()` 函数，该函数会调用一个回溯库函数。\n> 然后这将读取栈帧的 DWARF 数据并调用 Objective-C\
  \ 的个性函数（personality function）。该函数将读取更多的 DWARF 数据，将异常的类与 catch 块的类进行比较，然后将指令指针设置为\
  \ catch 语句的地址。\n>\n> 在 Java 中，虚拟机会将此翻译为到 catch 块的无条件跳转。如果你必须使用这种模式，请在 Objective-C\
  \ 中使用 C `goto` 语句。然而，通常最好完全避免它，并找到一个不忽视结构化编程思想的解决方案。\n\n要正确实现这一点，你需要一个全捕获子句：一个 `id`\
  \ 类型的 `@catch` 子句。这将捕获所有的 Objective-C 异常。记住，C++ 异常仍然不会在此块中被捕获，所以如果你在使用外部异常进行回溯，仍然需要一个\
  \ `@finally` 块来处理清理。你可以在 `@catch` 子句中将自动释放池的指针设置为 `nil`，以防止其释放两次。\n### 传递错误代理（Passing\
  \ Error Delegates）\n\n![Image](img/00109.jpg)\n\n> 出自：errordelegate.m\n在 Common\
  \ Lisp 中，你有*可恢复异常（resumable exceptions）*的概念。这些与 Objective-C、Java、C++ 等中发现的回溯异常（unwinding\
  \ exceptions）形成对比。可恢复异常不会回溯栈；它运行异常处理代码然后继续。\n\n在 Objective-C 中没有直接的对应物，但你可以通过将一个*错误代理（error\
  \ delegate）*作为参数传递给方法来实现这一结果。`NSFileHandle` 中的旧 API 就是这样工作的。它们的最后一个参数是一个对象，当操作遇到问题时会对其发送消息。\n\
  \n这种方法返回一个 `BOOL`，指示操作是否应该继续。如果错误代理没有处理这些情况，你可以通过在代码中抛出异常来将其与回溯异常结合起来。\n\n我曾在 `LanguageKit`\
  \ 框架中使用这种模式来报告编译错误和警告。当编译器遇到错误时，它会调用错误代理中的一个方法。该方法的默认实现只是将消息转储到控制台，但其他实现会转换抽象语法树以移除错误。如果它返回\
  \ `YES`，编译器会回溯并重新尝试检查。如果返回 `NO`，编译器会抛出一个异常，该异常由调用编译器的代码捕获。\n总来说，在操作过程中可能遇到可以修复问题的地方，都应该使用这种模式。例如，你可以在加载引用其他文件的文件时使用它。如果其中一个引用的文件丢失，默认选项是中止。然而，错误代理可以提供一条新路径，无论是通过某些固定的翻译还是通过提示用户。\n\
  \n### 返回错误值（Returning Error Values）\n\n![Image](img/00110.jpg)\n> 出自：errorReturn.m\n\
  \n在 C 中，一种常见的模式是成功时返回零，返回某个非零值表示错误条件。这在 Objective-C 中不那么流行，但返回一个表示操作是否成功的 `BOOL`\
  \ 值是相对常见的。\n\n大多数时候，这是通过以某种方式改变接收者的方法完成的。当你调用这种方法时，是为了影响对象的某种变化，而不是为了获取一个值，因此返回值没有被用于其他任何地方。\n\
  这种模式的一个例子是 `NSStream` 上的 `-setProperty:forKey:` 方法。它尝试设置流的属性，如果成功则返回 `YES`。注意，这与\
  \ C 模式相反，C 在在失败时返回真。\n\n### 使用 NSError\n\n![Image](img/00111.jpg)\n> 出自：nserror.m\n\
  \nApple 在 OSX 10.2 中引入的一些方法接受一个 `NSString**` 作为参数。这用于返回一个报告错误的第二个值。如果调用后指向该变量的为\
  \ `nil`，则操作成功。否则，它包含一个描述错误的字符串。\n\n这有一些显而易见的局限性。字符串对于向用户报告很好，但对于恢复错误并不是特别有用。如果你想在代码中处理错误，你需要解析字符串。\n\
  错误对象有时还包含一个恢复策略。*恢复者（recovery attempter）*对象可以尝试自动从错误中恢复。对于某些错误这是可能的，但通常当你尝试做一些可能但不安全的操作时会遇到错误。当这种情况发生时，你应该将错误展示给用户，然后调用恢复者。\n\
  \n如果你用过 Common Lisp，这种模式看起来会很熟悉，类似于即兴的可启动异常的形式。\n\n## 13. 访问目录和文件\n如果你正在使用 AppKit，对于大多数文件系统任务你有两种选择。来自\
  \ Foundation 框架的 `NSFileManager` 类提供了许多操作文件和目录的低级方法。来自 Application Kit 的 `NSWorkspace`\
  \ 类提供了更抽象的形式。\n\n\n\n\n\n正因如此，当无法保证 `workspace process` 存在时，考虑使用高级版本是没有意义的——例如，在可能通过远程连接运行的命令行工具中或在服务器代码中。\n\
  \n`UIKit` 框架没有 `NSWorkspace` 的等效物。如果你目标平台是 Cocoa Touch，则必须使用低级 API。\n\n\n![Image](img/00112.jpg)\n\
  \n> 出自：`readFile.m`\n\n\nFoundation 提供了两个大致对应于这些操作的类。`NSData` 类封装了一个包含未类型数据的内存区域。你可以通过各种选项从文件创建该类的实例。\n\
  \n对于小文件，你可以直接使用封装了 `read()` 调用并将文件数据副本读取到内存中的版本。对于较大的文件，你可能希望使用 `+dataWithContentsOfMappedFile:`。\n\
  \n\n如果你处于一个内存非常小且没有虚拟内存的平台，这非常有用。例如，3GS 之前的 iPhone 只有 128MB 的 RAM，而且它们都没有任何交换空间。如果你将一个\
  \ 4MB 的文件读取到内存中，你就用掉了应用程序可用空间的一大块。\n\n与此相反，如果你创建一个表示该文件的映射数据对象，系统将根据需要以 4KB 为块读取数据，并在不再需要时将其驱逐。例如，如果你在创建新对象时耗尽了内存，内核将从内存中驱逐该映射的文件以腾出空间。由于你已经读取了文件，内核就无法做到这一点，只会导致内存耗尽并杀死你的应用程序。\n\
  \n\n你可以通过向文件句柄发送 `-readDataOfLength:` 消息来读取固定大小的数据块。该类中的大多数其他方法对于从文件读取数据并不特别感兴趣；它们用于与套字交互。我们将在\
  \ 第 17 章 中再次查看此类类。\n\n### 移动和复制文件\n\n\n> 出自：`fileCopy.m`\n\n`NSFileManager` 类封装了整个文件系统并允许对其进行操作。该类向\
  \ Objective-C 开发者暴露了与 Apple `Finder` 和 Windows 资源管理器向用户暴露相似的功能。\n\n\n在 10.5 版本中，Apple\
  \ 决定大幅更改接口。现在的方法使用我们在 第 12 章 中讨论过的新错误报告模式，因此最后一个参数是指向 `NSError*` 的指针，用于返回错误。消息现在发送给对象的代理。\n\
  \n这意味着你现在必须在单个线程中使用 `NSFileManager`。在 10.5 之前，该类是`单例模式`（singleton pattern）的一个范例。缓存来自\
  \ `+defaultManager` 方法的返回值是非常常见的做法，该方法返回单例实例。现在，如果使用该缓存版本的代码可能从不同的线程调用，这将是不安全的。\n\
  \n\n如果你在文件管理器上使用旧的、已弃的方法，它与单例是线程安全的。如果你没有调用任何发送代理消息的方法，使用单例也是安全的。这很遗憾，因为这意味着当你复制文件时，可能需要创建一个新的\
  \ `NSFileManager` 实例，即使你已经有一个指向单例实例的指针。\n\n> * *\n\n\n> > 注意\n\n> > 这是一个缺乏思考的设计示例。更好的解决方案是将代理存储在`字典`中（参见第\
  \ 14 章)）。如果你将来对单例类进行类似的更改，请考虑这种方法，或者保留额外的参数。\n\n\n### 获取文件属性\n\n![Image](img/00114.jpg)\n\
  \n> 出自：`fileAttributes.m`\n\n\n这种局限性显而易见：你无法向结构中添加新字段而不破坏所有使用它的代码。`NSFileManager`\
  \ 版本要灵活得多。`-attributesOfAtPath:error:` 方法返回一个 `NSDictionary`，向字典添加额外的条目非常简单。\n\n\
  从这个示例中注意到，我们可以向字典发送 `-fileType` 消息来获取值。该方法是 `NSDictionary` 的一部分，返回对应 `NSFileType`\
  \ 键的字典项。其他类似的字典方法。\n\n\n### 处理路径\n\n![Image](img/00115.jpg)\n\n\n许多 UNIX 代码通过使用\
  \ `sscanf()` 和 `sprintf()` 函数来处理路径。当你将代码移植到 Windows 或 Symbian（例如）时，这会产生很多问题，因为那里的文件系统布局和路径分隔符是不同的。\n\
  \nOpenStep 从一开始就被设计为可以在不同的操作系统家族之间移植。`NSString` 类提供了一些专门用于处理路径的方法。\n\n\n\n\n\n\n\
  \n如果你使用 `NSString` 上的路径处理方法，无论文件系统的规范如何，你的代码都能正常工作。\n\n遗憾的是，`NSMutableString` 并没有相应的操作\
  \ set。你可以通过使用 `+pathWithComponents:` 和 `-pathComponents` 方法来避免创建大量临时对象带来的开销，这两个方法分别用于从路径组件数组构造字符串，以及创建一个路径组件数组。\n\
  \n\n### 判断文件或目录是否存在\n\n![Image](img/00116.jpg)\n\n\n确定文件是否存在的最简单方法是尝试访问它，然后检查错误。这种方法并不特别优雅，尽管它通常是安全的方法。如果你想在尝试操作之前向用户提供关于操作是否符合预期的反馈，你需要进行显式测试。\n\
  \n`-fileExistsAtPath:isDirectory:` 方法正是这样做的。该方法的名称有点误导性。它测试指定路径上是否存在文件或目录，并告诉你它是否是一个目录。\n\
  \n\n> * * *\n\n> \n\n> \n\n> > 不要使用此机制来创建临时文件。如果你这样做，在测试文件是否存在和创建文件之间存在潜在的竞态条件。请使用\
  \ C 语言库函数 `mkstemp()`。EtoileFoundation 框架对该函数有相应的封装，如果你想留在对象领域，可以使用它。\n\n> \n\n\
  C 语言以及扩展的 Objective-C 只支持返回单个值，但这个方法需要返回两个结果：某个东西是否存在以及它是否为目录。实现这一点有几种方法。一种是定义一个枚举类型，包含“不存在”、“文件存在”和“目录存在”元素。\n\
  \n这会让所有使用该方法的代码变得更简单，因此目前并不看出为什么当时没有这样做。当你意识到可以传递 `NULL` 作为第二个参数时，答案就显而易见了。如果你这样做，该方法将不再测试该路径下的对象是否为目录。这是一个相对较小的节省，因此并不清楚这是否是一个明智的设计选择。\n\
  \n\n![Image](img/00117.jpg)\n\n> 来自：`bundles.m`\n\n\nOS X 仍然支持分支，但用法不再相同。相反，它使用了包（Bundles）。包是用户看起来像文件、但被系统视为文件的目录。包包含一个可执行文件及其资源，如图像、声音和本地化字符串。\n\
  \n包的结构由其 `Info.plist` 文件定义，该文件包含了关于包的元数据以及应如何执行的信息。资源通常存储在子目录中，例如 `Resources` 或\
  \ `Contents`。\n\n\n包是 macOS 开发的关键部分。它们允许你以整洁且结构化的方式组织应用程序资源。理解如何正确使用包对于构建高质量的 macOS\
  \ 应用程序至关重要。\n\n\n\n\n- **本地 (Local)**：包含机器本地文件的域。在 OS X 上，这包括如 `/Library` 目录，该目录可能会由本地系统管理员修改。\n\
  - **网络 (Network)**：在此域中看到任何内容都是非常罕见的。你不会在独立机器或异构网络中的机器上看到它。它被用于由网络管理员控制的目录。\n- **系统\
  \ (System)**：最后一个域包含系统文件。通常情况下，你不应该向该域中的任何位置写入内容，尽管你可以从中读取。你所做的任何修改都可能在用户下次更新系统时被撤销。\n\
  \n\n最后一个参数告诉函数是否要展开路径中的波浪号（~）。你几乎总是会在这里传递 `YES`。\n\n`frameworkLoader.m` 示例展示了本章介绍过的几个内容。这个示例加载了一个命名的框架。由于框架是包（bundles），因此你可以使用\
  \ `NSBundle` 来加载它们。\n\n\n如果存在名称正确的项，示例程序会告诉 `NSBundle` 加载它。你可以使用这段代码在运行时延迟加载框架，而不是显式地链接到它们。或者，你可以修改代码，以便在库目录中的应用程序插件目录中进行查找，在这种情况下，你应该查找\
  \ `NSApplicationSupportDirectory`。如果你将插件构建为包，那么你将以完全相同的方式加载它们。\n\n![Image](img/00119.jpg)\n\
  \n\n# 14. 线程\n\n原始的 NeXT 操作系统是构建在 Mach 之上的，正如 OS X 一样。Mach 从一开始就支持线程，是第一批支持线程的类\
  \ UNIX 系统之一。最近，POSIX 线程 API 提供了一种创建和操作线程的跨平台方法。\n\n\n### 创建线程\n\n![Image](img/00120.jpg)\n\
  \n\nObjective-C 中的线程被封装在 `NSThread` 对象中。这些对象封装了 POSIX 线程并提供了一些便利方法。\n\n从 10.5 版本开始，创建新线程有两种方法。传统的方法类似于创建\
  \ POSIX 线程的标准方法，而第二种方法旨在让 Java 程序员感到更熟悉。\n\n\n更像 Java 的创建新线程的方法是子类 `NSThread` 并重写\
  \ `-main` 方法。然后你可以创建你的线程对象的新实例，并向它发送 `-start` 消息来启动它的运行。\n\n当你创建一个新线程时，它没有自动释放池（autorelease\
  \ pool），因此最常见的首要操作是要创建一个自动释放池，要么为该线程创建一个新的运行循环（run loop）。\n\n在 Objective-C 中创建一个新线程是一个相对昂贵的操作，就像在\
  \ C 中一样。进程必须从内核获取为新线程栈的一些新内存，创建调度它的所有用户空间和内核数据结构，并为线程本地存储（thread-local storage）映射额外的空间。因此，在创建线程后，让它们保持一段时间是一个好主意。\n\
  \n在线程中创建一个新的运行循环是实现此点的好方法。你可以注册定时器触发，监控文件描述符是否有新数据，并在新线程中使用事件驱动的编程风格。\n\n### 控制线程优先级\n\
  \n![Image](img/00121.jpg)\n\n> 来自：`threadPriority.m`\n\n`NSThread` 实现了 `threadPriority`\
  \ 和 `setThreadPriority` 方法，且既是类方法也是实例方法。当发送给类时，它们控制当前线程的优先级。当发送给实例时，它们控制该对象封装的线程的优先级。\n\
  \n线程的优先级决定了它将获得多少 CPU 时间以及在获得 CPU 访问权限之间等待多久。通过用于控制线程优先级的低级 POSIX API，你还可以设置调度策略。执行此操作的函数都是\
  \ POSIX 实时扩展的一部分，这些还提供了信号队列等。Objective-C API（尚未）暴露这些功能。\n\n通过此 API 设置的优先级是 0 到 1\
  \ 之间的双精度浮点值。这些值将被缩放到调度器可以理解的某些整数范围，所以你应该记住微小的差异会被舍入。\n\nPOSIX 规范为线程定义了两种*竞争范围*（contention\
  \ scopes）。线程的优先级定义了是否允许其获得 CPU 时间的基值，该值根据它已经获得了多少时间以及距离上次获得时间过了多久进行缩放。竞争范围决定了哪些线程竞争\
  \ CPU 时间。使用系统竞争范围时，线程与系统中的所有其他线程竞争。使用进程竞争范围时，它只与属于同一进程的线程竞争。\n\nOS X 只实现了系统范围，这意味着高优先级线程会从其他低优先级线程中抢夺处理器时间。如果你设置线程优先级大于\
  \ 0.5，请记住这会对系统产生不利影响。\n\n这不会导致完全饥饿。在 OS X 10.6 中，对于纯 CPU 密集型任务，最高优先级线程获得的 CPU 时间是最低优先级授予数量的略多一倍。大多数任务会涉及等待磁盘数据。处于阻塞状态的线程无论优先级如何，都不会消耗任何\
  \ CPU 时间。\n\nOS X 上的调度策略违反了传统的 UNIX 模型（在传统模型中只有超级用户可以提高进程优先级）。有趣的是，在现代 OS X 中，线程优先级对线程获取\
  \ CPU 时间的影响实际上大于其所属进程的优先级。这意味着虽然你不能提高进程优先级，但可以通过提高进程中所有线程的优先级来实现相同的效果。\n\n防止普通用户增加优先级的原始设计是为了防止一个用户获得不公平的\
  \ CPU 时间。OS X 系统倾向于单用户机器，因此这个问题不常见，但你仍然可能夺走同一用户的其他任务的处理器时间。\n\n设置线程优先级时要体贴。通常情况下，你只应该使用\
  \ 0 到 0.5 之间的范围。只有在绝对没有其他选择时，才将优先级设置为高于默认水平。不要因为你正在做 CPU 密集型工作并想让它变快就这样做。\n\n###\
  \ 线程同步\n\n![Image](img/00122.jpg)\n\n> 来自：`lock.m`\n\n你可以通过多种方式同步两个线程。执行此类同步的类都遵循\
  \ `NSLocking` 协议。该协议定义了两个方法：`-lock` 和 `-unlock`。\n\n\n\n\n\n最简单的锁类是 `NSLock`，它实现了一个`互斥锁\
  \ (mutex)`。一次时间允许一个线程锁定它，因此向它发送 `-lock` 消息会导致任何其他向该对象发送 `-lock` 消息的线程阻塞，直到你发送了相应的\
  \ `-unlock` 消息。\n\n这对于保护较短的临界区非常有用。对于较长的临界区，`NSRecursiveLock` 通常更有用。如果你在同一个线程中向\
  \ `NSLock` 发送了两个 `-lock` 消息，就会导致死锁。你可以向 `NSRecursiveLock` 发送任意数量的 `-lock` 消息，只要你发送相同数量的\
  \ `-unlock` 消息即可。这对于那些可能从已经获取锁的代码以及可能从未获取锁的代码中调用的方法非常有用。\n\n传统上上，这些类的问题在于它们与异常处理的结合得不好。如果你获取了锁，然后调用了抛出异常的内容，你就会遇到问题。锁将永远不会释放。\n\
  \n当 Apple 引入新的异常处理关键字时，它们也引入了 `@synchronized`。它会在任意对象上锁定，并确保在抛出异常时释放锁。\n\n通常情况下，使用这个关键字是一个坏主意。虽然它让生活变得简单了一点，而且\
  \ Java 程序员对其很熟悉，但它的实现非常低效。它需要将锁与对象关联，而且即使在不理想的情况下它也总是使用递归锁。你可以通过确保在 `@finally` 块中发送\
  \ `-unlock` 消息来实现相同的效果。\n\n如果你确定所有调用的方法或函数都不会抛出异常，你可以避免使用 `@try` 和 `@finally` 块，但在\
  \ GNU 和现代 Apple 运行时中，它们并没有运行时开销。\n\n### 存储线程特定数据\n\n![Image](img/00123.jpg)\n\n\
  > 出自：`threadDict.m`\n\n一旦你有了线程，你通常想为线程私有地存储一些数据。Cocoa 中的一个例子是当前的图形上下文，它必须对任何正在绘图的代码可用，但不能在线程之间共享。\n\
  \n通常情况下，你使用 `pthread_set_specific()` 函数来实现这一点，该函数存储与当前线程关联的指针。这通常通过在寄存器中存储内存区域的地址，并使用从该区域开始的固定偏移量来处理每个位线程特定数据来实现。这意味着你需要为每个线程中的每个线程本地指针留出空间，即使你只将其中一个设为非\
  \ `NULL` 的值。\n\n如果 Cocoa 像这样存储图形上下文，那么每个线程都需要一个字长的空间，尽管大多数程序只在一个（或可能两个）线程需要一个有效的图形上下文。\n\
  \n解决此问题的方案是`线程字典 (thread dictionary)`。这是一个与线程关联的可变字典。你每个线程只需要一个字长来存储这个指针，但你可以在其中存储任意数量的对象。只有与给定键关联了值的线程才需要空间来存储它。\n\
  \n通过向当前线程发送 `-threadDictionary` 消息来访问线程字典。然后你可以像操作任何其他字典一样操作它。当线程退出时，字典会被销毁。因为字典会保留它们的参数，这意味着任何仅从线程字典引用的对象将在它们的析构函数运行后被释放。\n\
  \n你可以用它在线程退出时运行代码，但不建议这样做。线程在退出之前会发布一个 `NSThreadWillExitNotification`，所以如果你想运行某些清理代码，只需观察此通知即可。\n\
  \n> * * *\n\n> \n> > 注意\n> > > 在大多数平台上，你可以使用 `__thread` 关键字，这是一个 GCC 扩展，将变量存储在线程本地存储中。Darwin\
  \ 加载不支持线程本地区域，因此在 OS X 上这是不可行的。这可能会很快改变，因为类似的功能在 C 和 C++ 标准的后续版本中都存在。\n\n> * * *\n\
  \n线程字典提供了一种在嵌套堆栈帧之间传递参数的良好方法。有时你想要设置一些半全局状态，这些状态将在整个方法调用期间持续存在，并可以从该范围内的所有方法访问。\n\
  \nCocoa 的经典示例是图形上下文对象，它在视图层次结构的根部被设置，然后被所有嵌套调用修改和使用。在 LanguageKit 中，我使用相同的模式允许 AST\
  \ 节点访问编译器对象。在两种情况下，缺乏紧密耦合意味着同一个方法——在同一个对象上——可以在两个不同的线程中调用，且具有不同的上下文。\n\n### 等待条件\n\
  \n![Image](img/00124.jpg)\n\n> 出自：`condition.m`\n\n经常，你希望让一个线程睡眠，并在另一个线程执行某些操作时醒来。POSIX\
  \ 线程 API 提供了`条件变量 (condition variables)` 来实现这一点。\n\n条件变量与互斥锁配对。当你等待条件变量时，你首先获取互斥锁，然后原子性地释放它并在条件变量上睡眠。当条件变量被信号时，你会醒来原子性地重新获取互斥锁。你可以将条件变量理解为在线程之间传递互斥锁的一种。\n\
  \nOpenStep 规范包含一个封装这种低级原的类：`NSConditionLock`。与 POSIX 版本不同（POSIX 版本需要在每次调用时与互斥锁关联），该类包含它自己的互斥锁并实现了\
  \ `NSLocking` 协议。\n\n这意味着你可以将条件锁当作锁，尽管这样做会浪费资源。除了锁之外，条件锁还有一个关联到它的整数变量，表示条件。当你在条件锁上睡眠时，你可以指定一个值。你的线程直到条件锁被信号了该值之前不会被唤醒。\n\
  \n条件锁在你等待的条件是一个整数值时非常方便，但在其他情况下则不如此。通常，你希望线程在对象进入特定状态时醒来。这在使用低级 POSIX 函数时非常容易，因为它们期望你自己测试条件，但使用\
  \ `NSConditionLock` 则不那么容易。\n\n为了解决这个问题，Apple 引入了 `NSCondition` 类。它是 POSIX 互斥锁和条件变量的简单封装。你可以锁定它，在释放锁的情况下在其上睡眠，然后从另一个线程信号它以唤醒它。\n\
  \n当你在 `NSCondition` 上睡眠后醒来时，条件对象将处于锁定状态。你必须测试你的条件，然后解锁条件对象或返回睡眠。\n\n在几乎所有你会使用条件变量的情况下，你都使用相同的模式。通常，它们让你在线程之间建立生产者-消费者关系。消费者线程需要睡眠，直到有数据在等待它。生产者线程需要在有数据在等待它时唤醒消费者线程。\n\
  \n本节开始的示例显示了类上的两个方法。`-addToQueue` 方法预期从生产者线程调用，而 `-main` 方法实现了消费者线程。\n\n消费者线程代码显示了线程对象的几个重要特性。它没有使用\
  \ `NSRunLoop`，而是实现了自己的运行循环、无限循环，并在每次迭代中显式地创建和销自动释放池。在每次迭代中，它首先锁定条件，如果没有数据在等待，则释放锁并睡眠。\n\
  \n生产者线程随后可以获取锁并信号条件。当这发生时，一旦锁可用，消费者线程就会准备好醒来。生产者通过释放锁来允许这一点。\n\n\n\n\n\n消费者线程随后获取下一段数据进行处理并释放锁。在这个示例中，增加和递减一个共享变量被用作向共享数据结构中添加某些数据的代理。\n\
  \n> 注意\n> 从条件变量（condition variable）唤醒线程所需的操作序列是非常昂贵的，因此在可能的情况下应该避免。对于两个线程之间的通信，我通常倾向于使用无锁环形缓冲区（lockless\
  \ ring buffer），它在空闲一段时间后会切换到锁定模式。Apple 的 Grand Central Dispatch（GCD）在内部实现了这种模型，因此你可以直接使用，而无需自己编写环形缓冲区代码。\n\
  \n# 15. Blocks 与 Grand Central\n\nObjective-C 最近添加的特性之一是对 `blocks` 的支持，它也被称为闭包（closures）。Blocks\
  \ 是 Smalltalk 的一部分，但由于几个原因在 Objective-C 中被省略了。Smalltalk 使用它们进行流程控制，而 Objective-C\
  \ 继承了 C 的流程控制原语，因此不需要它们。编译器和运行时库额外的复杂性，加上性能损耗，意味着它们最初对 Objective-C 来说并不是高优先级。\n\n\
  闭包是一个可以在其他作用域内部创建的函数，并可以引用该作用域内部的变量。通常，一个函数可能会引用三个东西：全局变量、参数和局部变量。它只能存在于全局作用域中。相比之下，block\
  \ 可以在函数内部声明，甚至可以在另一个 block 内部声明。它可以引用声明处可见的任何变量。\n\n## 将变量绑定到 Blocks\n\n![Image](img/00125.jpg)\n\
  \n> 出自：blockScope.m\n\n你可以将函数视为 block 的特殊情况。从概念上讲，函数是在全局作用域内定义的 block。它们的实现方式略有不同，但在这种情况下差异非常小。\n\
  \n因此，最简单的 block 等于函数。它接收某些参数，产生输出，并且不引用自身作用域之外的任何内容。本节开始的代码片段展示了这种 block 的示例。该声明位于全局作用域，看起来是非常冗长的函数声明形式。\n\
  \n下一类 block 引用其声明处的函数作用域内的内容。你可以在 `blockScope.m` 的其余部分看到这类 block。\n\n这个 block 了两个变量。`counter`\
  \ 是静态变量，这意味着它存储在从程序映像映射的内存中，就像全局变量一样。block 中对它的引用工作方式与对任何其他静态或全局变量的引用相同；变量只存在一个拷贝。\n\
  \n> 注意\n> 虽然向程序员暴露的只有一种类型的 block，但在实现中有两种。你可以通过检查 `isa` 指针来确定你拥有的是哪种 block，尽管公共\
  \ API 并不保证这一点，且可能会在不另通知的情况下更改。如果你创建的 block 除了参数或全局变量外不引用任何其他内容，那么该 block 是静态分配的，每当在概念上创建它时，你都会得到一个指向同一个对象的指针。如果你创建一个引用栈上（stack）内容的\
  \ block，那么 block 运行时会在每次创建它时在堆（heap）上创建一个新副本。\n\n另一个变量 `c` 是局部变量。它在 `getCounter()`\
  \ 函数中分配在栈上。当该函数返回时，该变量被销毁。block 仍然存在，但它引用的是该变量的拷贝。这意味着 block 内部的 `c` 始终包含 block\
  \ 创建时 `c` 的值。你可以从输出中看到它是如何工作的。每个 block 都会打印它创建时的计数器值以及当前值。\n\n![Image](img/00126.jpg)\n\
  \n> 出自：blockScope.m\n\n![Image](img/00127.jpg)\n\n> 输出自：blockScope\n\n传统的闭包引用的是闭层作用域中的真实变量，而不是拷贝。你可以通过使用\
  \ `__block` 修饰符声明变量来获得这种行为。这种实现非常复杂。变量从栈移动到堆内存中一段受引用计数的代码中。这意味着对它的任何引用都将引用同一个变量。`blockCapture.m`\
  \ 示例演示了这一点，该函数创建了两个相互关联的计数器。\n\n![Image](img/00128.jpg)\n\n> 出自：blockCapture.m\n\
  \n这两个计数器都引用内存中的同一个变量：一个返回它然后递增它；另一个递增它然后返回它。当你运行这个程序时，你会发现调用一个 block 会影响下一次调用另一个\
  \ block 时的返回值。\n\n![Image](img/00129.jpg)\n\n> 输出自：blockCapture\n\n当你下次调用 `linkedCounters()`\
  \ 函数时，你将获得一对新的 block，它们引用一个新的计数器变量。请注意 `static` 和 `__block` 存储修饰符之间的区别。它们都有相似的效果，即将变量从栈上移出并允许它比函数持续得久，但它们的工作方式完全不同。\n\
  \n当你将变量声明为 `static` 时，对它的每一个引用都会引用同一块内存。当你将变量声明为 `__block` 时，来自同一作用域对它的每次引用都会引用同一块内存，但每当你进入声明该变量的作用域时，你都会得到一个新的拷贝。\n\
  \n## 使用 Blocks 管理内存\n\n![Image](img/00130.jpg)\n\n> 出自：blockMemory.m\n\nCocoa 的内存管理传统上使用引用计数。Blocks\
  \ 的原理相同。有两个函数控制 block 的引用计数。`_Block_copy()` 函数增加它的引用计数，而 `_Block_release()` 函数减少它。\n\
  \n第一个函数没有称为 `_Block_retain()`，是为了显式表示返回的 block 可能不是参数。在某些情况下，block 可能会在栈上分配，然后在复制时到堆上。大多数情况下，你不会直接调用这些函数，而是使用不带下划线的宏。这些宏封装了函数并确保返回类型与参数类型相同。\n\
  \n在 Objective-C 中，你也可以向 block 发送 `-retain`、`-release` 和 `-autorelease` 消息，就像对待其他对象一样。事实上，你可以向\
  \ block 发送任何想要的消息，但它们只响应几种。当你向 block 发送任何消息时，编译器不会给出警告，但你会得到运行时异常。\n\n在向 block 发送\
  \ `-retain` 消息时要非常小心。该方法的约定要求它返回接收者。你必须使用 `-copy` 来确保栈 block 被复制到堆上。这在垃圾收集模式下尤为重要，在那里\
  \ `-retain` 消息会被静默忽略。在 ARC 模式下，你不需要调用这些函数或发送这些消息：ARC 会为你处理所有的 block 内存管理。\n\nblock\
  \ 引用的变量内存管理可能更难理解。`blockRetain.m` 示例显示了两个引用对象的 block。第一个获得对象指针的拷贝，第二个由于 `__block`\
  \ 存储修饰符而获得共享引用。\n\n![Image](img/00131.jpg)\n\n> 出自：blockRetain.m\n\n当你 retain 拥有对象指针拷贝的\
  \ block 时，对象也会被隐式地保留，自动保留。注意这只发生一次。当你第二次 retain 该 block 时，不会发生。当 block 被销毁时，对象会被释放。\n\
  \n![Image](img/00132.jpg)\n\n> 输出自：blockRetain\n\n\n\n\n第二个块的情况并非如此。该块已经被释放，因此向它发送消息将导致未定义行为。在这次特定的运行中，由于它返回了来自随机内存位置的一些数据。它也可能导致崩溃。\n\
  \n确保对象在至少一个或多个块持续期间保持有效，是你的责任。要正确地做到这一点非常困难，因为块与对象不同，它们没有注册清理代码的方法。如果你在 ARC 模式下编译，这个问题就会得到解决。块会自动保留任何存储在其绑定变量中的对象，并在块本身被销毁时释放它们。\n\
  \n当块引用其他指针时，这也是一个问题。即使指针没有 `__block` 存储限定符，它所引用的内存也不会被复制。这意味着你必须像跟踪 C 中其他任何内存一样跟踪它，而且增加的复杂性在于，包含该指针引用的块可能会持续很长时间。\n\
  \n### 在后台执行操作\n\n![Image](img/00133.jpg)\n\n> From: libdispatch.m\n\n如果你在 OS X 10.6\
  \ 上使用 Cocoa 或在 FreeBSD 上使用 GNUstep，那么你可以选择使用 `libdispatch`（Apple 将其命名为 Grand Central\
  \ Dispatch）进行并发处理。该库由 Apple 编写并并在 Apache 2 许可证下发布。如果你使用 libdispatch，你不需要手动管理线程，而是管理工作队列。\n\
  \n工作队列执行代码和数据单元。队列有两种类型：并发队列（concurrent）和 FIFO 队列（FIFO）。并发队列将按照它们被添加到队列的顺序开始执行工作单元，但可能会同时执行多个单元。FIFO\
  \ 队列会等待每个单元完成后再开始下一个单元。\n\n队列与线程之间没有 1:1 的映射关系。并发队列可能在多个线程上执行，而一个线程可能会运行来自多个队列的工作单元。要使用的最佳线程数由内核根据核心数和系统负载决定。\n\
  \n线程之间的上下文切换是相对昂贵的。它的成本至少等同于 `setjmp()`，因为它需要保存当前的 CPU 状态并在稍后恢复它，但还存在一些显而易见的成本。不同线程可能同时访问程序数据的不同部分，因此切换线程会导致大量的缓存缺失和\
  \ TLB 缺失。\n\n通过工作队列模型，单个线程可以运行来自一个队列的单元单元，然后运行另一个队列的另一个单元，而不需要在两个工作集之间不断切换。如果你有更多核心，可以增加并发程度以利用它们，而不会增加上下文切换的次数。当系统忙碌时，你可以减少一个应用程序使用的线程数，以便它可以有效利用一个核心，而让另一个应用程序使用另一个核心。这一切都由\
  \ libdispatch 自动完成。\n\nGrand Central 并不依赖块，但它与块结合使用会要方便得多。在最简单的情况下，你只需要将块推入工作队列并在后台执行它们即可。这就是本节开头的示例所做的。它获取了普通优先级默认队列的句柄，并将块推入其中。队列一旦有空闲的\
  \ CPU 时间，就会在后台执行此操作。\n\n### 创建自定义工作队列\n\n![Image](img/00134.jpg)\n\n> From: libdispatchFIFO.m\n\
  \nGrand Central 自带三个默认创建的并发队列。这些队列在三个优先级级别上注册：低（low）、默认（default）和高（high）。每个队列上并发运行的任务数量取决于系统负载和可用\
  \ CPU 核心数。你可以通过我们在上一节中看到的 `dispatch_get_global_queue()` 函数获取其中一个队列的句柄。\n\n创建一个新的并发队列没有意义。推入并发队列的块将按照它们推入的顺序开始执行，但它们可能会以任意顺序完成，并且可能有任意数量的任务同时运行。\n\
  \n还有一个特殊的队列，旨在在主线程上运行。你可以通过 `dispatch_get_main_queue()` 获取它的引用。\n\n该队列在 OS X 10.6\
  \ 上用于实现循环（run loop）。\n\n该队列是一个 FIFO 队列，你可能希望创建类似的队列。FIFO 队列类似于轻量级线程。它顺序执行，一次执行一个块。线程和队列之间的关系是变化的。取决于各种因素，所有的队列最终可能在不同的线程上并发运行，或者可能在单个\
  \ OS 线程上执行。\n\n通过调用 `dispatch_queue_create()` 创建一个新的 FIFO 队列。当你有一系列需要按顺序执行但与程序其他部分大部分独立的任务时，这非常有用。这有助于减少对显式同步的需求。\n\
  \n本章开头的示例将三个递增计数器的块和一个打印其最终值的块推入了一个新队列中。这些块都是相互相关的；以错误的顺序执行它们是一个非常糟糕的主意。通过这种方法，它们对于彼此来说是按保证顺序执行的，但对于程序的其余部分则不是。这意味着除非你计划从队列外部访问\
  \ `counter` 变量，否则你不需要为 `counter` 变量添加任何锁。\n\n## 16. 通知 (Notifications)\n\nObjective-C\
  \ 鼓励松耦合，Foundation 框架中没有什么比 `notification` 机制更能体现这一点。通知是为任意数量监听器实现回调的简单方法。\n\n你可以监听特定名称的通知、来自特定对象的通知，或者两者兼有。通知本身包含一个发送者、一个名称和一个与之关联的字典，因此对象可以将任意数量的信息传递给监听通知的对象。\n\
  \n如果你使用通知，会让你的类的复用变得非常简单。与其要求想要监听你的类事件的类都实现特定的接口，你只需发布通知即可。任意数量的类都可以监听同一个对象的通知，而你的类无需实现存储它们引用的任何逻辑。\n\
  \n### 请求通知\n\n![Image](img/00135.jpg)\n\n> From: notify.m\n\n要监听通知，你需要在线程的 `NSNotificationCenter`\
  \ 对象上注册感兴趣。这是通知的路由点。当发布通知时，它会被发送到通知中心，然后通知中心将其转发给所有感兴趣的方。\n\n大多数情况下，你将使用默认通知中心。可以为不同的用途创建不同的通知中心，但最常用的是标准中心。它通过向\
  \ `NSNotificationCenter` 发送 `+defaultCenter` 消息来获取。\n\n要注册通知，然后向中心发送 `-addObserver:selector:name:object:`\
  \ 消息。注意此消息中的 `selector` 参数。单个对象可以在不同的方法上接收不同的通知。这非常有用，因为这意味着你不需要测试收到了什么种的通知，并将不同的事件处理器清晰地分离到不同的方法中。\n\
  \n在注册观察者时，对象或通知名称可以为 `nil`。这让你能够注册以接收特定对象发送的所有消息，或者接收特定类型的所有通知，而不论发送者是谁。\n\n这些对于调试比其他任何用途都有用。例如，你可以写一个日志切面，监听特定类型的类型通知并记录发送者。\n\
  \n\n\n\n\n在监听通知时需要记住的一个重要点是，通知中心不会保留你的对象。如果你的对象在销毁时仍然注册了接收通知，那么当下一次发送这些通知之一时，你的程序将会崩溃。\n\
  \n为了避免这种情况，请确保在你的 `-dealloc` 方法中向通知中心发送一条 `-removeObserver:` 消息。如果你忘记了这一点，崩溃将不会很明显。你会在回溯轨迹（back\
  \ trace）中看到很多奇怪的东西，包括通知中心。\n\n## 发送通知\n\n![Image](img/00136.jpg)\n\n> 来自：`notify.m`\n\
  \n发布通知比注册监听它们要简单得多。发布通知对象的标准方法是构造一个 `NSNotification` 对象然后发送它。\n\n在实践中，我认为我从未见过过执行这种操作的代码。通知中心有一些便利方法，可以在单次操作中完成通知的构造和发布。\n\
  \n发送通知最常用的方法是 `-postNotificationName:object:userInfo:` 方法。还有一个该方法的简化版本，它省略了 `userInfo:`\
  \ 参数，等同于向最后一个参数传递 `nil`。\n\n请注意，对象——即通知的发送者——是作为参数指定的。这意味着可能发送声称来自另一个对象的通知。这意味着，例如，外观模式（façades）或\
  \ C 代码可以代表其他对象发送通知。\n\n## 队列通知\n\n![Image](img/00137.jpg)\n\n> 来自：`notify.m`\n\n\
  有时，你的代码可能会产生大量的通知，或者产生一些不需要立即处理的通知。`NSNotificationQueue` 类解决了这两个问题。\n\n通知队列既可以推迟通知的交付，也可以对它们进行合并（coalesce）。与\
  \ `NSNotificationCenter` 不同，队列没有构造通知的便利方法，你必须自己完成此操作。然后使用三种发布样式之一发布通知。\n\n在这个示例中，通知的交付被推迟，直到运行循环（run\
  \ loop）中没有其他事件为止。定时器和文件描述符上的数据就绪具有更高优先级。或者，你可以在下一次运行循环迭代中发布或立即发布。\n\n如果你发送了大量相同类型的通知，缓存通知对象是一个好主意。反复将同一个对象传递给通知队列开销非常小，而且它可以自动发送一次通知。\n\
  \n如果你使用较长的方法来队列通知，其中一个参数是 `coalesceMask:`，它决定了应该如何合并通知。你可以合并相同名称的通知、相同发送者的通知，或者两者兼顾。\n\
  \n合并在 `NSPostWhenIdle` 发布样式下最有用。当你的代码忙碌时，你可以多次发送相同的通知，然后当没有其他事件需要处理时，通知队列将只发布一份通知的副本。这对于触发某些低优先级记账工作的代码片段是理想的。\n\
  \n## 在应用程序之间发送通知\n\n![Image](img/00138.jpg)\n\n> 来自：`distributedNotify.m`\n\n通知提供的松散耦合非常有用，以至于它在\
  \ Foundation 框架内部被扩展，为应用程序之间的通信提供了一种（简单的）机制。`NSDistributedNotificationCenter` 类是\
  \ `NSNotificationCenter` 的子类，它能向其他应用程序广播通知。\n\n这种扩展需要一些更改。普通通知带有一个关联的发送者，指向某些对象的指针。在具有另一个地址空间的进程中，指向对象的指针并不特别有用，因此分布式通知使用字符串作为发送者。可以是任何你喜欢的字符串，但通常是应用程序名称。\n\
  \n通知可以关联有字典。在应用程序内部，这些字典可以包含任何对象，但对于广播，它们被限制为可以存储在属性列表中的对象（参见第 9 章）。\n\n> * * *\n\
  \n> > 注意\n\n> 在 OS X 上，只有一种类型的分布式通知中心，向与发送者具有相同用户 ID 的应用程序发送通知。GNUstep 提供了另外，一个用于与计算机上的所有应用程序通信（无论用户是谁），另一个用于跨本地局域网广播通知。\n\
  \n> * * *\n\n分布式通知的交付语义也有些不同。当你发布一个（普通）通知时，它是同步交付的。发送对象已经拥有了 CPU 的控制权。其方法的栈帧位于栈顶，它可以自由地将程序流委托给通知中心，然后由中心将其委托给通知监听器。\n\
  \n对于分布式通知，情况并非如此。你不能在另一个进程执行函数的中间中断它正在做的事情，因此你必须等待到一个合适的点。分布式通知通过与运行循环交互来处理这个问题。要接收分布式通知，你必须使用\
  \ `NSRunLoop`。`distributedNotify.m` 示例是一个简单的程序，每当它自己的新实例启动时就会写入一条日志消息。\n\n![Image](img/00139.jpg)\n\
  \n> 来自：`distributedNotify.m`\n\n该类的 `-init` 方法完成了所有的实际工作。首先，它为分布式通知注册了一个观察者。该对象是\
  \ `nil`，因此它将从任何发送者接收此通知。然后它构造了通知。user info 字典包含一个键值对，存储进程 ID。\n\n发布通知后，它启动了运行循环。程序将处于阻塞状态，直到某些运行循环事件发生。此程序中只有一个事件定义了处理程序，因此它所做的就是在每次发布\
  \ `ProcessDidStart` 通知时接收一个 `-newCopy:` 消息，这只会在运行该程序的副本时发生。\n\n如果你编译并运行这个示例，你会看到它接收了自己的通知，因此它会告诉你它已启动。如果你运行另一个副本，你会从每个运行的实例收到关于新实例的日志消息。\n\
  \n这是一个非常平凡的示例，但很容易使用分布式通知处理更复杂的事件。例如，我在 XMPPKit 中使用它们来通知所有运行的应用程序用户更改了在线状态。其他程序监听此并将新状态推送到微博客站点。\n\
  \n## 17 网络访问\n\n编写网络感知应用程序的标准跨平台方法是 Berkeley Sockets API。它是作为开发 TCP/IP 的同一资助的一部分编写的，设计与协议无关。\n\
  \n大多数语言都有此 API 的实现。在 Objective-C 中，你一如既往可以自由地使用 C 版本，它提供了底层接口的所有功能。\n\n然而，大多数情况下，这是投入巨大努力获得微小收益。Foundation\
  \ 框架提供了几个类，使得编写网络应用程序变得更容易。使用这些抽象有时会丢失一些底层 API 的功能，但并不多。\n\n### 封装 C Sockets\n\n\
  ![Image](img/00140.jpg)\n\n> 来自：`NSFileHandle+Socket.m`\n\n\n\n\n\n我们在第 13 章中简要地查看了\
  \ `NSFileHandle` 类，当时我提到它封装了一个文件描述符。socket API 是基于 UNIX 的“一切皆文件”（即使在逻辑不通的情况下也是）的模型设计的，因此\
  \ socket 也是文件描述符。你可以对 socket 进行读取和写入操作，使用与处理任何其他文件描述符时相同的函数调用。\n\n你也可以使用 `NSFileHandle`\
  \ 来封装一个 socket。这让你能够使用低级 API 创建一个完全符合你规格的 socket，然后使用更抽象的方式与创建的 socket 进行交互。如果你需要使用低级\
  \ socket API 中某些未被高级 API 方便暴露的部分，那么这就是你所使用的唯一解决方案。在其他情况下，它通常仍然是最方便的。\n\n将你的 socket\
  \ 封装在文件描述符对象中最大的优势是，你可以轻松将其与运行循环（run loop）集成。这让你能够非常容易地编写事件驱动的 socket 代码。另一个大优势是，你可以用\
  \ Objective-C 的引用计数来管理你的 socket。如果你在创建 `NSFileHandle` 时将 `YES` 作为 `closeOnDealloc:`\
  \ 参数的参数，那么文件描述符会在对象被释放时被关闭。\n\n> > 注意\n> 记住，Objective-C 的目标是让 C 程序员的生活变得更轻松。不要仅仅为了使用而使用\
  \ Objective-C API，只有当它们作为你特定问题的解决方案比 C API 更有意义时，才使用它们。使用仅仅是对 C API 进行简单微封装的 Objective-C\
  \ API 会增加开销和复杂性，但不会让你的代码更易于维护。\n\n如果你向你的对象发送 `-waitForDataInBackgroundAndNotify`\
  \ 消息，它会被添加到运行循环轮询的文件描述符列表中。在下一次运行循环迭代中，如果有数据在等待，`NSFileHandle` 对象将发布一个通知。如果你为此通知注册了处理程序，那么你就可以读取新数据。\n\
  \n该方法的文档有些具有误导性。它声称该方法将创建另一个线程。事实上，在 OS X 上，运行循环使用 `kqueue()` API，调用此方法只是向它等待的列表添加另一个文件描述符。在\
  \ OS X 10.6 上，这是使用 Grand Central Dispatch（调度队列）来发布通知的，但核心功能是相同的。\n\n最后一个优势是你就不再需要考虑缓冲区（buffers）了。当你从\
  \ socket 读取数据时，你通常必须分配一个缓冲区，然后将其指针传递给 `read()` 或 `recv()` 系统调用。使用文件描述符对象，你读取的是 `NSData`\
  \ 实例。\n\n如果你正在编写大量的字符串，可能想要考虑在 `NSFileHandle` 上添加一个分类（category），提供 `-writeUTF8String:`\
  \ 和 `-readUTF8String` 方法，或者为你协议使用的编码提供相应的方法，允许你直接获取和发送字符串。\n\n### 连接服务器\n\n![Image](img/00141.jpg)\n\
  \n> 来自：nsstream.m\n\nObjective-C 提供了一组类似于 Java 的流类用于网络通信，以及低级的 UNIX 接口。遗憾的是，这些流版本并不特别有用。它们没有提供一种清晰的方式来添加过滤器（压缩）或在连接过程中进行加密协商，而许多现代协议都需要这些。\n\
  \n然而，最令人恼的局限性是，它们并不容易支持 SRV 记录。这些 DNS 记录将服务发布到端口映射，以及主机名到 IP 地址的映射。它们被 DNS-SD 使用，但由于\
  \ IP 地址的短缺，它们在公共互联网的层级 DNS 中变得越来越常见。\n\n如果你在 OS X 上使用 POSIX 的 `getaddrinfo()` 函数查询服务器地址，你需要提供一个主机名和服务名。系统随后会将这些映射到任何受支持的协议上的网络地址和端口号。\n\
  \n当你构造一个 `NSStream` 时，必须将端口号指定为整数。这意味着它在任何使用 DNS SRV 记录的服务上都会失败。然而，如果你使用 `getaddrinfo()`\
  \ 然后将生成的 socket 封装在 `NSFileHandle` 中，它将能够正常工作。在 EtoileFoundation 中，我们为 `NSFileHandle`\
  \ 提供了一个分类，允许你直接从主机名和协议名称创建文件句柄，并封装了这一调用。\n\n![Image](img/00142.jpg)\n\n> 来自：NSFileHandle+Socket.m\n\
  \n该分类在 NSFileHandle+Socket.m 示例中显示。当你调用 `getaddrinfo()` 时，你以 C 字符串的形式提供服务器和服务类型，以及一组指示你想要的\
  \ socket 类型的提示（hints）。然后你会得到一个 `addrinfo` 结构体数组，包含了构建连接 socket 所需的信息。\n\n这些按照解析器认为最佳的顺序排列，因此你通常会依次尝试每一个，直到找到一个可用的。如果你同时拥有\
  \ IPv6 和 v4 连接，那么只要存在指向两者的 DNS 词目，这段代码就会尝试两者。\n\n### 在网络上共享对象\n\n![Image](img/00143.jpg)\n\
  \n> 来自：doPublish.m\n\nObjective-C 最强大且未被充分使用的部分之一分布式对象系统（distributed objects system）。如果你向一个对象发送消息，而该对象不理解如何处理，那么它将接收一个\
  \ `-forwardInvocation:` 消息，并将一个对象作为参数。\n\n就像其他任何事物一样，你可以对这个对象进行内省。它会告诉你选择器（selector）、参数的数量以及所有参数的类型和值。\n\
  \nFoundation 框架包含一个类 `NSistantObject`，它利用了这一点。远程对象是一个代理，将消息转发给远程对象。远程对象可以在不同的进程中，甚至在不同的计算机上。\n\
  \n如果你在发送给远程对象的消息中传递对象，它们可能会被复制，或者在远端创建一个远程代理进行转发。\n\n使用分布式对象非常简单。任何使用它们的程序有两个部分：客户端和服务。服务器向其他进程提供对象，客户端连接服务器并访问它们。\n\
  \n默认情况下，对象仅在本地机器共享。要跨网络共享它们，在注册对象时必须使用 `NSSocketNameServer`。\n\n![Image](img/00144.jpg)\n\
  \n> 来自：doAccess\n\n章节开头的示例展示了一个进程间共享 `NSMutableDictionary` 实例的简单程序。注意，你必须使用 `NSRunLoop`\
  \ 服务分布式对象。分布式对象系统将用于通信的 IPC 通道（Mach 端口或 socket）添加到运行循环。当另一个进程向该端口发送消息时，数据通过该通道到达并通知\
  \ DO 系统。\n\n它从接收到的数据构造一个 `NSInvocation` 并调用它，然后返回结果。\n\n![Image](img/00145.jpg)\n\
  \n> doAccess 输出\n\n### 寻找网络节点\n\n![Image](img/00146.jpg)\n\n> 来自：netservice.m\n\n\
  多年来，有很多协议被用于在本地网络上寻找服务。NetBIOS 和 AppleTalk 在 90 年代中期之前在本地网络上都很常见，直到它们开始被 TCP/IP\
  \ 取代。\n\nTCP/IP 协议栈并不包含任何执行此操作的功能。最接近的方法是广播地址。如果你向广播地址发送数据包，它将发送到本地分段上的所有设备。这有很多问题：它只在本地物理分段上有效，在现代交换机网络上效率低下，并且是一种非常低级的方法。\n\
  \n\n\n\n\nIETF 的 ZeroConf 工作组提出了 `多播域名 DNS (mDNS)` 作为此问题的解决方案。`DNS` 是一种发布映射的可扩展方式。它最常被用于从主机名到\
  \ IP 地址的映射，但也可以用于电话号码、地理位置以及许多其他内容。\n\n通过 `mDNS`，单个计算机可以在 `.local` 域中发布 `DNS` 记录。这随后成为\
  \ `DNS 服务发现 (DNS-SD)` 的基础，该技术描述了通过 `DNS` 广告任意服务的方法。你可以将此标准与传统的层次级 `DNS` 一起使用，但它在配合\
  \ `mDNS` 时最为有用。\n\n这两个标准的结合通常被称为 `Bonjour`，并通过 `NSNetService` 类暴露给 Objective-C。这允许应用程序发布\
  \ `DNS-SD` 记录，并找到特定服务的所有记录。\n\nOS X 上有许多应用程序使用了此功能。Safari 使用它来共享书签；iChat 使用它来寻找无服务器消息的联系人；iTunes\
  \ 使用它共享音乐；系统则使用它来查找共享文件夹和打印机。如果你正在编写任何网络应用程序，你可能会发现使用 `NSNetService` 向对端发布广告是有帮助的。\n\
  \n当你发布服务时，必须指定一个唯一的名称。如果你正在使用分布式对象（我们将在本章末尾介绍），那么你可以将此作为你所服务的对象的名称，并忽略 `Bonjour`\
  \ 系统与 `DNS` 相关的底层实现。对于其他情况，你发布的端口通常更有用，而名称将是你呈现给用户的内容。\n\n你使用 `NSNetServiceBrowser`\
  \ 类来搜索对端。这个类的正确用法稍微有点复杂一点。发布服务是同步的；你向你的 `NSNetService` 实例发送一个 `-publish` 消息，服务就会发布。搜索是异步的，并且需要一个活跃的\
  \ `run loop`。\n\n当你向浏览器器发送搜索消息时，它会传输一个 `DNS` 请求。获取响应可能需要一段时间，而你可能不想在搜索时阻止用户的任何操作，因此该方法会立即返回。\n\
  \n当收到响应时，该类将向其代理发送消息，并带一个新的 `NSNetService` 实例描述它找到的每个服务器。它将持续监听，直到你对其发送一个 `-stop`\
  \ 消息。\n\n在很多情况下，你永远不会发送此消息。你可以让浏览器在整个进程生命周期内在后台运行，并在本地网络上出现新对端时接收通知。然后你可以触发用户界面的更新以显示新对端。这就是\
  \ iTunes 等程序所做的，当新的共享列表出现在网络上时，将其添加到库中。\n\n![Image](img/00147.jpg)\n\n> 出自：`wget.m`\n\
  \n如果你正在为连接互联网的现代系统编写代码，那么你可能想要从由 `统一资源定位符 (URL)` 标识的远程位置获取数据。`URL` 是一个全局标识符，包含一个架构（schema）以及针对该架构特定的数据。Foundation\
  \ 框架包含了 `NSURL` 类来封装 `URLs`。它可以从字符串中解析 `URLs` 并为你提供一个抽象表示。\n\nFoundation 还包含了两个从\
  \ `URLs` 获取数据的类。其中较简单的是 `NSURLDownload`，它封装了从远程 `URL` 的下载。更复杂的是 `NSURLConnection`，它提供了一种更底层的方法来处理请求和响应。\n\
  \n`URL` 加载系统与协议无关，但期望一种请求-响应格式。请求被封装在 `NSURLRequest` 中，然后你将其传递给这两个类之一。它建立连接并发送请求，然后提供一个或多个\
  \ `NSURLResponse` 对象作为响应。\n\n开箱即用，Foundation 框架可以从 `file://`、`http://`、`https://`\
  \ 和 `ftp://` `URLs` 加载数据。你可以通过实现 `NSURLProtocol` 子类添加对其他协议的支持。这样做非常罕见，例如你可能可能在此类类中实现对\
  \ SFTP 或类似协议的支持。然后你就可以重用现有的代码，将文件访问委托给 URL 加载系统。\n\n本节开头的示例展示了如何从用户指定的远程 URL 获取文件。这使用了一个代理类来向用户报告进度，尽管这不是强制要求的。\n\
  \n代理存储了响应的大小，以便其能提供进度报告。如果传输失败，它将报告一个本地化的错误消息。如果运行正常，它将每下载 1% 就在终端上打印一个点。\n\nURL\
  \ 加载子系统非常强大，但大多数时候，你只需要限制在示例所示的子集中。这让你能够用极少的代码与简单的 Web 服务集成。\n\n![Image](img/00148.jpg)\n\
  \n> 出自：`wget.m`\n\n## 18. 调试 Objective-C\n\n程序员分为两种：一类是第一次就能写出完美代码的人，另一类是确实存在的人类。如果你属于第一类，可以跳过这一章。如果你属于后一类，那么会有某些时候，你尝试运行代码并发现它的运行并不完全符合预期。\n\
  \n这是一段令人恼的经历，但当你能快速修复问题时，这种恼就会减少很多。在本章中，我们将查看一些在 Objective-C 程序中寻找 Bug 产生的技术。\n\n\
  ### 检查对象\n\n![Image](img/00149.jpg)\n\n> 出自：`description.m`\n\n大多数时候，当你调试 Objective-C\
  \ 程序时，你将使用 `GNU 调试器 (GDB)`，它对 Objective-C 有内置支持。如果你在使用 XCode，则你是通过图形界面使用 GDB。你可以从运行菜单访问命令行界面。这很有用，因为\
  \ XCode 只为调试器的常用功能提供了 GUI，而不是针对所有功能。\n\n> > 注意\n> \n> > > 新版本的 XCode 使用 `LLVM 调试器\
  \ (LLDB)` 代替 GDB。图形界面是相同的，LLDB 支持与 GDB 类似的功能。\n\n> \n\nGDB 有两个功能使其适用于 Objective-C。首先是它带有一个简单的\
  \ Objective-C 解析器和解释器，因此你可以在调试器中编写 Objective-C 表达式并以此检查变量。第二个是 `print-object` 命令。\n\
  \n![Image](img/00150.jpg)\n\n> 输出：description\n\n打印一个对象。它是通过向对象发送 `-description`\
  \ 消息来实现的，该消息返回一个描述对象的 `NSString`。这意味着它对有效对象有效。如果你对过早释放或内存损坏的对象使用此命令，调试器要么崩溃，要么捕获到段错误信号。\n\
  \n该方法在 `NSObject` 中的默认实现只是打印类名和地址。各种其他标准对象以不同的方式实现它。例如，集合类会以属性列表（property list）格式打印其内容。这个示例返回了一个非常没有用处的消息，但在你自己的代码中，你应该尝试提供稍微更有用一点的内容。\n\
  \n### 识别内存问题\n\n![Image](img/00151.jpg)\n\n> 出自：`prematureDealloc.m`\n\nObjective-C\
  \ 中常见的问题之一是过早释放。如果你在某处省略了 `-retain` 消息，你就在没有增加引用计数的情况下保留了一个指针。如果其他地方还持有它的引用，或者它被自动释放了，那么这个指针可能会有效很长时间，然后突然失效。\n\
  \n\n\n\n\n当指针失效时，你通常会在 Mac 运行时遇到 `objc_msgSend()` 内部崩溃，或者在 GNU 运行时遇到 `objc_msg_lookup()`\
  \ 内部崩溃。这是因为运行时尝试查找处理消息的方法，但该类指针现在指向了一个无效的地址。\n\n![Image](img/00152.jpg)\n\n> 输出来自：prematureDealloc\n\
  \n在调试器中，你可以通过向上移动堆栈，直到找到消息接收者，从而非常容易地找到那个被 de 释放的对象。你也可以使用 `NSZombie` 类。当设置了环境变量\
  \ `NSZombieEnable` 时，对象不会被 de 释放。相反，它们的类会被设置为 `NSZombie`，每当有消息向其发送消息时，该类只会记录一条消息。\n\
  \n当然，找到对象只是问题的一部分。你还需要弄清楚它为什么被过早释放。通常，你可以通过查看相关的源文件并检查所有的 `-retain` 和 `-release`\
  \ 消息来快速完成。`clang` 的静态分析部分（理想情况下）可以自动完成这一点。如果不起作用，可以尝试重写类的 `-retain` 和 `-release`\
  \ 方法，在调试器中为它们添加断点，并查看它们到底何时被保留和释放的。\n\n如果你没有使用自动引用计数（ARC），迁移到它会有帮助。这样，跟踪指针就变成了编译器的工作，而编译器在反复应用模式方面通常比你更擅长。如果你已经在使用\
  \ ARC，可以尝试将不安全的未保留（unsafe unretained）指针改为弱（weak）。这确保了它们在指向的对象被 de 释放时被置零，并帮助你安全地检查指针是否有效。\n\
  \n### 观察异常\n\n![Image](img/00153.jpg)\n\n> 来源：throw.m\n\n如果你阅读关于 `NSException` 的文档，你会在\
  \ `-raise` 方法中看到这一句：\n\n> 所有其他抛出异常的方法都会调用此方法，因此如果你正在调试异常，请在此处设置断点。\n\n这在 OS X 10.5\
  \ 之前是正确的，在 GNUstep 上也是如此。遗憾的是，在较新版本的 OS X 上这不再成立，这导致如果你想编写一个改变异常抛出行为的分类（category），会需要花费更多精力。\n\
  \n现在，OS X Foundation 中各种抛出异常的部分直接使用 `@throw`。这是一种微小的语法糖，它调用 `objc_exception_throw()`\
  \ 函数。该函数随后调用回溯库代码，以运行 `@finally` 块中的所有代码，并为异常找到正确的处理器。\n\n如果你在 `objc_exception_throw()`\
  \ 上设置断点，你将捕获所有异常，无论它们是如何被抛出的。这也会捕获像 `@throw @\"string\";` 这样的内容，这些内容在 OS X 上没有正式支持，但仍然有效。\n\
  \n![Image](img/00154.jpg)\n\n> 输出来自：throw\n\n### 断言预期\n\n![Image](img/00155.jpg)\n\
  \n> 来源：assert.m\n\n在 C 代码中，标准库提供了一个 `assert()` 宏，当谓词参数求值为假时，它会记录消息并调用 `abort()`。Objective-C\
  \ 版本稍微用一点。\n\nFoundation 提供了两个宏：`NSAssert()` 和 `NSCAssert()`。如果你在使用 C99（你应该这样做），那么这些是变变的；否则，你将需要使用固定数量参数的变体，例如\
  \ `NSAssert1()`。`NSAssert()` 引用了 `self`，因此只能在 Objective-C 方法体内部使用。`NSCAssert()`\
  \ 可以在 C 函数中使用。\n\n与 C 变体不同，这些宏在断言为假时不会中止程序。相反，它们会向每个线程的断言处理器对象发送消息。该对象默认是 `NSAssertionHandler`\
  \ 的实例，当遇到断言时，它会抛出一个 `NSInternalConsistencyException`。你可以捕获它并恢复，但大多数情况下它会到达堆栈顶端并导致程序中止。\n\
  \n如果你想要某些其他行为，可以创建 `NSAssertionHandler` 的子类，并重写一个或两个断言处理方法。这个示例忽略了 C 函数中的断言，仅在遇到它们时记录一条消息。\n\
  \n![Image](img/00156.jpg)\n\n> 输出来自：assert\n\n想要重写这个内容是非常少常的，但确实有一些你可能这样做的好理由。其中最明显的理由之一是错误报告。当遇到断言时，意味着你的程序出了非常严重的错误。你可能想要收集一些导致这种情况的情况的信息，并将其上传到错误跟踪系统中，而不仅仅是崩溃。\n\
  \n你可以通过定义 `NS_BLOCK_ASSERTS` 宏来禁用断言。这通常只在性能关键代码中值得这样做。通常浪费一点 CPU 时间比在未定义状态下继续运行要好。\n\
  \n### 记录调试消息信息\n\n![Image](img/00157.jpg)\n\n> 来源：nslog.m\n\n我们已经在很多代码中使用了 `NSLog()`\
  \ 函数。当你在终端中运行应用程序时，传递给 `NSLog()` 的消息会发送到标准错误流。在 OS X 上，图形应用程序中的 `NSLog()` 将消息发送到系统控制台。在带有\
  \ GNUstep 的 Microsoft Windows 上，它们会进入系统事件监视器。\n\n`NSLog()` 函数写入一个格式字符串，前面带有日期、时间、进程名称和进程\
  \ ID。当你在格式字符串中放入 `%@` 格式说明符时，它使用与调试器完全相同的方法来获取对象的字符串表示。\n\n> * * *\n\n> > 注意\n\n\
  > > GNUstep Additions 框架提供了一组日志宏，即 `NSDebugLog()` 系列。它们是对 `NSLog()` 的封装，只有在设置了特定值时才记录。这使得按方面或按框架开启调试日志变得非常简单。\n\
  \n> > * *\n\n你还可以使用编译器在构建格式字符串时定义的特殊宏。`__FILE__` 宏是包含当前文件的 C 字符串。`__LINE__` 宏是包含当前行的整数。最后，`__PRETTY_FUNCTION__`\
  \ 宏展开为包含当前方法或函数名的 C 字符串。\n\n![Image](img/00158.jpg)\n\n> 输出来自：nslog\n\n## 19. Objective-C\
  \ 运行时\n\n正如我在书开头提到的，Objective-C 实现包含两个部分：编译器和运行时库。编译器获取源码并将动态部分转换为对运行时库的调用。\n\n\
  运行时库是用 C 编写的，这意味着是用 Objective-C 的子集编写的。运行时库的所有接口（包括编译器调用的接口）对 Objective-C 代码可见。\n\
  \nObjective-C 中的所有动态内容都由运行时库实现。最明显的例子就是消息发送。当你发送消息时，运行时负责决定谁来处理它。\n\n这并不是运行时库的唯一职责。它还处理语言的所有内反射功能。它跟踪所有的类和协议元数据，并将其暴露给程序员。\n\
  \n当你使用键值编码（KVC）时，你是在间接使用 Objective-C 运行时函数来查找接收者的方法和实例变量。\n\n### 按名称发送消息\n\n![Image](img/00159.jpg)\n\
  \n> 来源：methodByName.m\n\nObjective-C 方法是通过间接层调用的 C 函数。具体的实现方式在不同运行时之间有所不同。在 NeXT\
  \ 和 Apple 运行时中，简单的消息发送是通过 `objc_msgSend()` 函数实现的。\n\n\n\n\n\n遗憾的是，这并不是你所需要的唯一一个函数。该函数被声明为返回一个\
  \ `id` 类型，并适用于任何具有相同调用约定的方法。例如，在 Darwin/x86 上，对象指针是在 `eax` 寄存器中返回的。如果你返回一个浮点值，它将返回在浮点寄存器中。如果你返回一个结构体，则会在调用者中为其分配空间，并将指针作为隐藏参数传递进来。\n\
  \n你必须记得调用 `objc_msgSend_sret()` 或 `objc_msgSend_fpret()`。这相当麻烦，因为这意味着你必须了解目标平台的调用约定。\n\
  \n对于 GNU 运行时（runtimes），这要简单得多。它没有 `objc_msgSend()` 函数。相反，你调用 `objc_msg_lookup()`，并将返回的函数指针强制转换为正确的类型后调用它。\n\
  \n实现这种操作在不同运行时之间具有可移植性的最简单方法是使用 `NSObject` 的 `-methodForSelector:` 方法。它返回一个指向实现该方法的函数的指针，然后你可以调用它。该方法接收两个隐藏参数：接收者（receiver）和选择器（selector）。\n\
  \n这几乎就足以通过名称调用方法了。缺少的部分是将字符串转换为选择器的机制。`NSSelectorFromString()` 函数正是此此的。它接受一个 `NSString`\
  \ 作为参数并返回一个选择器。然后你可以将它传递给 `-methodForSelector:`，并作为返回函数的第二个参数传递。\n\n### 通过名称查找类\n\
  \n![Image](img/00160.jpg)\n\n> 来自：weakClass.m\n\n运行时的职责之一是存储一个所有已加载类的表。你可以遍历此表，逐一查看每个类，也可以使用它通过名称查找类。\n\
  \n后者对于实现弱类引用（weak class references）特别有用。现代 Apple 运行时直接支持这种，但这种支持尚未通过语言暴露，因此目前并不特别有用。弱类引用的核心思想是，你可以可选地使用某个类。\n\
  \n例如，你可能会在一个框架中编写一些使用了 Foundation 类的代码，如果链接了 AppKit，就可以使用 AppKit 类。这样该框架就可以在任何有\
  \ Foundation 实现的地方工作，但如果可用 AppKit 特性，它又会利用这些特性。你也可以使用这种机制来避免对第三方框架的依赖。\n\n![Image](img/00161.jpg)\n\
  \n> 输出自：weakClass\n\n注意此示例在链接到 Cocoa（链接了 AppKit 和 Foundation）与仅链接到 Foundation 时的输出差异。如果\
  \ `NSView` 类存在，它会创建一个实例。如果不存在，它只会记录一条消息。\n\n你也可以将此机制用在必须与框架旧版本向后兼容的代码中。如果你使用这种机制查找新类，那么当类不存在时，你会得到一个可以处理的\
  \ `Nil` 值。\n\n### 测试对象是否“理解”某个方法\n\n![Image](img/00162.jpg)\n\n> 来自：respondsToSelector.m\n\
  \nObjective-C 代码倾向于使用非正式协议（informal protocols）。这些是代理（delegate）可以可选地实现的消息组。\n\n当你编写使用这些协议的代码时，你需要在发送消息之前测试该类是否真的实现了该方法。\n\
  \n> * * *\n\n> \n\n> > 注意\n> \n\n> > 这并不完全正确。你可以直接在 `@try` 块中发送消息，并在不理解该方法时捕获抛出的异常。然而，考虑到抛出异常的代价，这并不是一种推荐的方法。\n\
  \n> > * * *\n\n幸运的是，这非常简单。`NSObject` 实现了一个 `-respondsToSelector:` 方法，用于测试接收者是否可以处理带有给定选择器的消息。\n\
  \n此方法不仅由 `NSObject` 实现，它还是 `NSObject` 协议的一部分。其他根类也会实现它。这对于消息转发（forwarding）来说非常重要。\n\
  \n在 `NSObject` 中，此方法调用了 `class_respondsToSelector()` 运行时函数。在其他类中，实现是不同的。如果你直接使用运行时函数，你的代码将会非常脆弱。\n\
  \n在大多数情况下，你想知道的是准备要发送消息的对象是否能处理该消息，而不是它是否有一个处理该消息的方法。在 C++ 等某些语言中，它们是同一个概念，但在 Objective-C\
  \ 中，它们是非常不同的概念。\n\n当你向代理（proxy）发送 `-respondsToSelector:` 消息时，它会测试真实对象是否具有对应该选择器的方法。被代理封装的对象可能是另一个代理，它会进一步转发请求。\n\
  \n你也可以通过向类发送 `-conformsToProtocol:` 消息来测试协议的遵循情况。注意，这仅测试该类是否被声明为采用该协议。类可以采用协议而不实现其所有方法（尽管不应该这样做），但更常见的情况是类可以实现协议中的所有方法，而没有显式地遵循该协议。\n\
  \n### 转发消息\n\n![Image](img/00163.jpg)\n\n> 来自：forward.m\n\nObjective-C 中的消息旨在类似于\
  \ Smalltalk 消息，而不是 C 函数。它们是后期绑定的（late-bound）并且可以被内省。在最底层，它们使用 C 函数实现，但这只是实现细节。你可以假定消息是可以在其他对象之间传递的、被内省的并由方法处理的对象。\n\
  \n当你向一个没有对应方法的对象发送消息时，该对象仍然有一些方法可以处理它。这些方法在 Objective-C 的发展过程中经历了巨大的进化。\n\n在旧的 Objective-C\
  \ 中，对象的 `-forward::` 方法会被调用。这是一个变长方法，并要求接收者了解栈帧结构。NeXT 用 `-forwardInvocation:` 替换了它。该方法接收一个封装消息的对象。\n\
  \n`-forwardInvocation:` 机制非常灵活，但性能并不好。创建对象和解构栈帧的代价比普通消息发送高出数百倍，这意味着你不应该在任何性能敏感的代码中使用它。\n\
  \n如果你使用这种转发机制，你必须实现 `-methodSignatureForSelector:` 方法。它返回一个与消息相关的调用帧结构。`NSInvocation`\
  \ 类在创建对象时会使用它。\n\n从 10.5 版本开始，Apple 引入了一种新的、更快的转发机制。如果你的对象实现了 `-forwardingTargetForSelector:`\
  \ 方法，该方法会被选择器调用。它可以返回一个对象，然后消息将传递给该对象。\n\n这让像外观模式（facade pattern）这样的变得变得简单。你可以快速将任何你不理解的方法委托给代理。如果你需要在调用代理方法之前或之后进行额外的处理，只需实现该方法并显式调用代理方法即可。\n\
  \n> * * *\n\n> \n\n\n\n> > 注意\n> \n\n> > GNU 运行时使用的两阶段消息发送机制不支持这种新机制，旧版本的 Apple\
  \ 运行时也是如此。如果你使用它，建议提供回退代码。如果你使用的是最新的 Apple 运行时，或者带有非脆弱 ABI 的 GNUstep 运行时，你将获得额外加速的收益。如果不是，你的代码仍然可以运行，只是速度较慢。\n\
  \n> > * * *\n\n### 查找类\n\n![Image](img/00164.jpg)\n\n查找 Objective-C 类有两种方法。如果你知道它的名称，可以直接使用\
  \ `NSClassFromString()` 函数。它接受一个字符串对象作为参数并返回该类，如果没有注册该名称的类，则返回 `Nil`。\n\n> 来自：classTree.m\n\
  \n\n\n\n\n如果你不知道某个类的名称，那么你就需要采取不同的方法。在某些情况下，你可能想要获取某个类，但你并不知道它的名称。例如，如果你有一个插件架构，你可能会允许用户指定要加载的包（bundles），然后想要收集特定类的所有子类，或者所有符合给定协议的类。\n\
  \n> 注意\n> 在测试类是否符合协议合规性时，使用运行时函数是一个好主，而不是向它们发送 `+conformsToProtocol:` 消息。许多类使用 `+initialize`\
  \ 进行懒初始化，向它们发送消息会导致即使你实际上没有使用该类，这段代码也会被执行。\n\n`objc_getClassList()` 函数将返回一个类数组。它接受两个指针作为参数：一个是用于返回类的数组，另一个是缓冲区的大小。如果你用\
  \ `NULL` 作为第一个参数调用它，它将不会返回任何类，但它会告诉你总共有多少个类。\n\n一旦你获得了这个数组，你就可以遍历它并检查这些类。在这个示例中，我只是将类名存储在一个数组中然后对其进行排序。在下一节中，你将看到如何获取类名并打印每个类的实例变量和方法。\n\
  \n如果你正在寻找符合特定协议的类，那么你应该改用 `class_conformsToProtocol()` 函数。这会告诉你该类是否符合指定的协议。如果符合，你就可以将其添加到已加载的插件列表中。\n\
  \n### 检查类\n\n![Image](img/00165.jpg)\n\n> 出自：classTree.m\n\n一旦你获取了类的指针（通过枚举所有类、向对象发送\
  \ `-class` 消息或使用 `NSClassFromString()`），你就可以对它进行检查。类结构（class structure）包含了大量关于 Objective-C\
  \ 类的信息，这些信息对程序员来说都是可用的。\n\n在旧版本的运行时中，`Class` 是 `struct` `objc_class` 的 `typedef`，它被定义在一个头文件中。在更现代的系统中，`Class`\
  \ 是一个不透明类型（opaque type），你应当通过一组公共函数与它交互。这使得随着时间的推移，对 ABI 进行演变得更加容易。只需修改编译器和运行时，就可以更改类结构的布局，而不需要更改任何其他代码。\n\
  \n`classTree.m` 示例打印了系统中所有类的实例变量和方法。你还可以访问到更多的元数据。例如，实例变量存储了它们的类型以及相对于对象起始位置的偏移量。\n\
  \n这些信息用于 KVC 的实现。当你为一个键设置值且 KVC 允许直接访问实例变量时，它会首先找到一个名称匹配的实例变量。然后它会找到类型并确定是否需要对对象进行解箱（unbox）。最后，它会将\
  \ ivar 偏移量加上对象指针，然后在该地址执行赋值。\n\n它对访问器方法（accessor methods）执行类似的操作。方法存储了它们的名称、类型和方法指针。类型信息至关重要，因为它允许其他代码构建调用帧（call\
  \ frame）。通过检查访问器方法的类型，KVC 代码可以将方法指针强制转换为正确的类型然后调用它，从而设置或获取特定的属性。\n\n在较新版本的运行时，还为声明的属性存储了元数据。你对一个类设置的几乎任何内容都可以通过调用运行时函数进行检查。你唯一无法做的是获取单个方法的源代码。\n\
  \n### 创建新类\n\n![Image](img/00166.jpg)\n\n> 出自：newClass.m\n\n在运行时创建新类是非常罕见的，但它确实为非常动态的行为或优化提供了很多机会。我们已经看过了一部分实现此功能的\
  \ Foundation 框架。键值观察（KVO）机制创建新类来拦截访问器方法的调用。\n\n运行时创建类最重要的一点是，它展示了 Objective-C 的核心原理之一：编译器所做的一切都不是魔法。你可以在自己的\
  \ C 代码中生成编译器从 Objective-C 代码中生成的所有内容。当然，编译器在优化结果方面可能会做得更好，而 Objective-C 的版本会更简单。如果不是这样，Objective-C\
  \ 就没有什么意义了。\n\n创建一个新类涉及三个步骤：首先分配类对（class pair），然后添加方法、实例变量和协议，最后在运行时注册该类对。\n\n>\
  \ 注意\n> “类对”这个术语可能看起来很令人困惑。你源代码中的每个 Objective-C 类在运行时都会被编译为两个类。对象是类的实例，而类是元类（metaclass）的实例。实例方法附加在类上，而类方法附加在元类上。当你向类发送消息时，会使用元类来查找对应的方法。\n\
  \n当你分配类对时，你必须提供父类、新类的名称以及在类结构末尾添加的空间大小。新类的名称必须是唯一的。如果你调用两次函数，本节的示例代码将无法工作。绕过此问题的简单方法是在静态变量中保留一个计数器，每当创建一个新类时都原子地增加它，并将其附加到类名之后。\n\
  \n当将类创建与 `isa-swizzling` 结合使用时，类末尾的额外空间可能非常有用。更改现有类的 `isa` 指针可以让你添加方法，但不能添加实例变量。不过，你可以在类的末尾创建一些空间并在那里存储额外数据。使用类作为参数调用\
  \ `object_getIndexedIvars()` 将给你该数据的起始地址。\n\n你可以利用此功能来实现其他对象模型。例如，我曾用它为 Objective-C\
  \ 添加了基于原型的面向对象功能，允许闭包作为方法被到单个对象。\n\n### 添加新实例变量\n\n![Image](img/00167.jpg)\n\n>\
  \ 出自：associate.m\n\n从 OS X 10.6 开始，Objective-C 运行时提供了一种机制，允许你几乎可以向现有类添加新的实例变量。有两个函数用于存储对象的关联引用。这些是在对象创建后与其关联的对象指针。在对象创建后添加新的实例变量是不可能的，因为此时其内存布局已经固定，但关联引用是更好的替代方案。本节开头的示例展示了一个\
  \ `NSObject` 的分类，演示了这种能力。它允许你通过一对方法与任何对象关联一个字符串值。\n\n关于设置和获取关联引用的函数，有两点需要注意。第一个是键。它必须是一个唯一的指针值，不能被其他代码用于识别不同的关联引用。实现此点的简单方法是在文件中定义一些静态变量并使用其地址。\n\
  \n另一个需要注意的是关联策略（association policy）。这些策略与声明属性的可用策略相同。在这种情况下，我们告诉运行时保留（retain）该对象，并在对象销毁时释放（release）它。\n\
  \n\n\n\n在某些情况下，关联引用非常有用，特别是在调试时。如果你使用 retain（保留）策略，关联对象将在其关联的对象被释放时被释放，因此你可以使用一个块（block）来记录关于释放的日志，例如，而无需修改你正在释放的对象。你也可以用它来轻松地区分两个对象，例如，通过像示例中的分类（category）添加注释来指示它们创建的位置。然而，请注意，关联引用的开销相当大。如果你在生产代码中大量使用它们，如果代码变得非常缓慢，请不要感到惊讶。\n\
