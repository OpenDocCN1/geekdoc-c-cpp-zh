  \n^(1) StrongTalk 是 Smalltalk 的一种方言，增加了可选的静态类型检查。创建该语言的团队后来去开发了 Java。StrongTalk\
  \ 是最快的 Smalltalk 实现，但其编译器没有使用静态类型信息进行优化。\n\n^(2) 以 Smalltalk 的设计者之一 Dan Ingalls\
  \ 命名，由他提出了这一概念。\n\n### 第 2 章\n\n^(1) 如果你正在使用 `Clang` 编译，大多数这些类型都有内置定义，因此头文件是可选的。\n\
