- - '##'
  - Adding Workflow with Windows Workflow Foundation
- - '##'
  - A Simple Workflow
- - '##'
  - Standard Activities
- - '###'
  - Low-level activities — These activities perform some minor task, usually as part
    of a larger process.
- - '###'
  - Control of flow activities — These activities are the equivalent of Visual Basic’s
    If statement or While loop. They enable the workflow to branch or repeat as needed
    to carry out a step.
- - '###'
  - Activities that communicate with external code — These activities are either called
    by external code to initiate a workflow or used to call to external code as part
    of a workflow. This category also includes activities that communicate with external
    systems to persist the workflow state.
- - '###'
  - Transaction activities — These activities group a number of other activities together
    into some logical element. This is usually done to mark a number of activities
    that participate in a transaction.
