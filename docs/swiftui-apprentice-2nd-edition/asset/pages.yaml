  md: "# When to Save the Data\n\nSkills you'll learn in this section: when to save\
    \ data; ScenePhase\n\nThere are two ways to proceed, and each has its pros and\
    \ cons.\n\nYou can choose to save the card every time you change anything, such\
    \ as adding, moving or deleting elements. This means that your data on disk is\
    \ always up-to-date. The downside is that your saving is spread out all over your\
    \ app.\n\nAlternatively, you can choose to save when you really need to:\n\n+\
    \   1. When SingleCardView disappears, which happens when the user taps Done.\n\
    2. When the app becomes inactive through the user switching apps or an external\
    \ event such as a phone call.\n\nThe downside of this method is that if your app\
    \ crashes before you've done the save, the last few changes the user made might\
    \ not have been recorded. You'll also need to remember when the app doesn't save\
    \ in the simulator until you press Done.\n\nIn this app, you'll choose a hybrid\
    \ approach. You'll perform the first method of saving when you create or delete\
    \ card data. This is primarily because of saving the image's UIImage. You'll save\
    \ the UIImage when you choose it from the Photos or Stickers modal, and you'll\
    \ store the id in the ImageElement. To maintain data integrity, it's a good idea\
    \ to store the ImageElement at the same time as the UIImage.\n\nHowever, moving\
    \ and resizing elements happens regularly, and saving every time can be quite\
    \ inefficient. To save the data, you'll choose the second method: saving when\
    \ the user taps Done or leaves the app.\n\n# Saving When the User Taps Done\n\n\
    +   Open the starter project. In the Model group, open Card.swift and create a\
    \ new method in Card:\n\n```\nfunc save() {\n    print(\"Saving data\")\n}\n```"
