  md: "# @Builder\n\nSkills you'll learn in this section: view builder attribute\n\
    \nThere are several ways of dealing with this problem. One way is to return a\
    \ Group from shape() and place switch inside Group.\n\nAnother way is to use the\
    \ function @Builder. Various built-in views, such as HStack and VStack can display\
    \ various types of views, and achieve achieve this by using @Builder. Shortly,\
    \ you'll create your container view where you can stack up other views as VStack.\n\
    \n+   Add this func shape() -> some View {\n\n```\n@ViewBuilder\n```\n\nYour code\
    \ now compiles.\n\nInternally, @ViewBuilder takes up to ten views and combines\
    \ them into one TupleView. A tuple is a loosely formed type made up of several\
    \ items.\n\n@Builder has ten buildBlock(...) methods and, depending on how many\
    \ contained views there are, calls the appropriate method. Have you ever tried\
    \ to add more than ten views in a VStack? Because there are only ten methods for\
    \ building up views in ViewBuilder, you'll get a compile error: Extra argument\
    \ in call.\n\nThis is one of the declarations of buildBlock(...) that takes seven\
    \ views and returns one TupleView made of these seven views:\n\n```\n// iOS 13.0,\
    \ macOS 10.15, tvOS 13.0, watchOS 6.0, *\nextension ViewBuilder {\n\n    public\
    \ static func buildBlock(c0: View, c1: View, c2: View, c3: View, c4: View, c5:\
    \ View, c6: View) -> TupleView<c0, TupleView<c1, TupleView<c2, TupleView<c3, TupleView<c4,\
    \ TupleView<c5, TupleView<c6>>>>>>> {\n        return buildBlock(...)\n    }\n\
    }\n```\n\nThe other nine buildBlock(...) methods are the same except for the different\
    \ number of views passed in."
