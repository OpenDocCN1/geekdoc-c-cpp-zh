  md: '# Key Points


    +   * WidgetKit is still a relatively new API. You might experience some instability.
    You can fix many problems by deleting the app or by restarting the simulator or
    device.


    +   * To add a widget to your app, decide what app data you want to display and
    the time interval between entries. Then, define a view for each size of widget
    — small, medium, large — you want to support.


    +   * Add app files to the widget target and adapt your app''s data structures
    and views to fit your widgets.


    +   * Create an app group to share data between your app and your widget.


    +   * Deep-linking from your widget into your app is easy to do.'
