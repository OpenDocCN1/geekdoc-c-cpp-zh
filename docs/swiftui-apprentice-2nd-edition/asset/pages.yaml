  md: "# Updating the Drag and Drop\n\nThis code needs some explanation:\n\n+   1.\
    \ Add a new extension to UIImage to conform to Transferable.\n2. transferRepresentation\
    \ is a required property. TransferRepresentation describes how to transfer an\
    \ item. You can describe how to import and export the item.\n3. When the imported\
    \ UTType is an image, you will import the image as data and construct a UIImage\
    \ from that. DataRepresentation expects the return type to be the same type as\
    \ Self, in this case, a UIImage.\n4. Create the UIImage. If the operation fails,\
    \ create an error using the image in the asset catalog.\n\nIf you want to create\
    \ a custom object that conforms to Codable, instead of DataRepresentation, you\
    \ can use CodableRepresentation in the same way.\n\nYou can now import dropped\
    \ photos using UIImage instead of Data. This makes your code correspond more closely\
    \ to your intent. When you use the word \"data\", it's not always obvious what\
    \ data that is.\n\n+   ➤ CardDetailView.swift and replace the dropDestination\
    \ modifier:\n\n```\n.dropDestination(for: UIImage.self) { images, location in\n\
    \    print(location)\n    for image in images {\n        card.addElement(uiImage:\
    \ image)\n    }\n    return !images.isEmpty\n```\n\nYou can now use UIImage.self\
    \ as a transferable type. The data representation of the UIImage extension resides\
