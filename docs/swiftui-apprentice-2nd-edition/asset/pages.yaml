  md: '# SwiftUI Apprentice


    > Note: Like a lot of the content on this site, this episode is aimed at people
    who want to work for iOS app development companies. If this isn''t you, skip to
    the next section.


    Three reasons why there are still more developers using UIKit than SwiftUI:


    +   1. SwiftUI only works on iOS 13 or later. Some companies still need to support
    iOS 12 or earlier, they can''t switch to SwiftUI quite yet.

    2. SwiftUI is still not as mature as UIKit. Apple released UIKit in 2008, and
    it built on macOS AppKit, which came from NeSTEP, so there was a lot of time to
    get things right. SwiftUI still has missing features or rough edges, so some companies
    want to give SwiftUI a little more time to mature.

    3. Many companies have already written their apps using UIKit, and it would simply
    be too much at this point to rewrite the entire thing in SwiftUI, so a lot of
    old UIKit legacy code will remain.


    ![](img/b137d252894e5c4c3dd508961a85e251_334_0.png)


    SwiftUI or UIKit?'
  merge: -1
