  md: "# SwiftUI Apprentice Chapter 19: Saving Files\n\nscenePhase is a useful member\
    \ of EnvironmentValues. It's an enumeration of three possible values:\n\n+   -\
    \ active: the scene is in the foreground.\n\n+   - inactive: the scene should\
    \ pause.\n\n+   - background: the scene is not visible in the UI.\n\nYou'll save\
    \ when scenePhase becomes inactive.\n\n➤ In body, locate fullScreenCover(item:)\
    \ and add a modifier to SingleCardView(card):\n\n```\n.onChange(of: scenePhase)\
    \ { newScenePhase in\n    if newScenePhase == .inactive {\n        store.cards[index].save()\n\
    \    }\n\n```\n\nonChange(of:) is called whenever scenePhase changes. If the new\
    \ value is inactive then we save the card. Be mindful that card is not the same\
    \ instance as store.cards[index] here, so card.save() would not save correctly.\n\
    \n➤ Build and run the app, tap a card to open it and exit your app by swiping\
    \ up the bottom. You'll see the console message \"Saving data\".\n\n![](img/b137d252894e5c4c3dd508961a85e251_527_0.png)\n\
    \nSaving data\n\nKodeco 528"
