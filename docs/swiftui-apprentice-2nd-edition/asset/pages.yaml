  md: '# SwiftUI Apprentice Chapter 15: Structures, Classes & Protocols


    As you''ve learned already, inside a View, all properties are immutable unless
    they are created with a special property wrapper. A state property is the owner
    of a piece of data that is a source of truth. A binding connects a source of truth
    to a view that changes the data.


    Your source of truth for all is CardStore. When you select a particular card,
    you pass a binding to the card to CardDetailView.


    +   ➤ Open SingleCardView.swift and locate where you call CardDetailView. Option-click
    the card parameter to select the declaration.


    ![](img/b137d252894e5c4c3dd508961a85e251_426_0.png)


    CardDetailView expects an environment object and a binding. The type of these
    are in angle brackets. store is an environment object of type CardStore, and card
    is a binding of type Card.


    # Swift Dive: A Very Brief Introduction to Generics


    Swift is a strongly typed language, which means Swift has to understand the type
    of everything you declare. Binding has a generic type parameter <Value>. A generic
    type doesn''t actually exist except as a placeholder. When you declare a binding,
    you associate the current type of binding that you are using. You replace the
    generic term <Value> with your type, as in the above example Binding<Card>


    Another place where you might find this language construct is an Array. You defined
    an array in CardStore like this:


    ```

    var cards: [Card] = []

    ```


