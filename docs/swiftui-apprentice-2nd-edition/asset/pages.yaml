  md: "# Getting the URL of a Bundle File\n\nYou need the URL of the video file for\
    \ this exercise. the videoName property is the name part of the file. All the\
    \ files have file extension .mp4.\n\nThese files are in the project folder, which\
    \ you can access as Bundle.main. Its method url(forResource:withExtension:) gets\
    \ you the URL of a file in the main app if it exists. Otherwise, it returns nil\
    \ which means no value. The return type of this method is an Optional type;\n\n\
    > **Swift Tip:** Swift's Optional type helps you avoid hard-to-find bugs that\
    \ are common in other programming languages. It is usually declared like Int or\
    \ String by a question mark: Int? or String?. If you declare var index: Int?,\
    \ index can contain Int or no value at all. If you declare var index: -- with\
    \ no ? index must contain an Int. Use let index {...} to check whether an optional\
    \ has a value. The condition is true if index has a value. You can also check\
    \ index != nil.\n\n> Note: You'll learn more about the app bundle in Chapter 7,\
    \ \"Saving Settings\" and about options in Chapter 8, \"Saving History Data\"\
    .\n\nSo you need to wrap an if let the VideoPlayer. Another pair of braces! It\
    \ can be hard to keep track of them all. But Xcode is here to help;\n\n+   - Command-click\
    \ VideoPlayer and select Make Conditional:\n\n```\nif true {\n    VideoPlayer(player:\
    \ AVPlayer(url: url))\n} else {\n    EmptyView()\n}\n```\n\nAn if-else closure\
    \ wraps VideoPlayer, with placeholders true and EmptyView().\n\n> **Xcode Tip:**\
    \ Take advantage of features like Embed in HStack and Make Conditional to let\
    \ Xcode keep your braces matched. To adjust what's included in the closure, use\
    \ Option-Command-[ or Option-Command-] to move the closing brace up or down."
