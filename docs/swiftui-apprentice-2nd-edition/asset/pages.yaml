  md: "# SwiftUI Apprentice\n\n# Chapter 24: Downloading Data\n\nThat worked! But,\
    \ what are all these errors?\n\n![](img/b137d252894e5c4c3dd508961a85e251_680_0.png)\n\
    \n# Publishing Changes on the Main Thread\n\n“Publishing changes...”: Whenever\
    \ you call fetchObjects(for:) to run a new search, store published objects to\
    \ objects, updates the list in ContentView.\n\n+   Open TheMetStore.swift:\n\n\
    ```\nclass TheMetStore: ObservableObject {\n    @Published var objects: [Object]\
    \ = [] Publishing changes from background threads is not allowed.\n    let service\
    \ = TheMetService()\n```\n\n# Purple published property\n\nThe purple points to\
    \ the published property objects objects. ContentView subscribes to this property\
    \ by creating an instance of TheMetStore. The asynchronous method fetchObjects(for:)\
    \ changes objects, which changes ContentView.\n\n> “from background threads”:\
    \ What’s about threads? Your app runs its code on threads—the main thread and\
    \ one or more background threads. The user interface of every iOS app runs on\
    \ the main thread. SwiftUI app’s user interface consists of SwiftUI views, so\
    \ these always run on the main thread. The main thread must always be responsive\
    \ to the user, so asynchronous methods run on a background thread to avoid slowing\
    \ down or blocking the main thread.\n\nHere’s the problem: Any code that updates\
    \ the user interface must run on the main thread. If an asynchronous method contains\
    \ code that updates the user interface, it must somehow run that code on the main\
    \ thread.\n\nThe “old concurrency” way to do this is to dispatch this code to\
    \ the main queue. The new Swift concurrency way to do this is to run the code\
    \ on MainActor.\n\n# Kodeco\n\n# 681"
