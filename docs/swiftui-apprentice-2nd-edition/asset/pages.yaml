  md: '# Making Lists: Views & Actions


    The finished app will have several screens. Here''s a sample to show you what
    it will look like:


    ![](img/b137d252894e5c4c3dd508961a85e251_62_0.png)


    There''s a lot going on in these screens, especially the one with the exercise
    video. You might feel overwhelmed, wondering where to start. Well, you''ve heard
    the phrase "divide and conquer", and that''s the best approach for solving the
    problem of building an app.


    First, you need an inventory of what you''re going to divide. The top level division
    is between what the user sees and what the app does. Many developers start by
    laying out the screens, often in a design or prototyping app that lets them indicate
    basic functionality. For example, when the user taps this button, the app shows
    this. You can show a prototype to clients or potential users to see if they understand
    your app''s controls and clients. For example, if they tap labels they''re buttons,
    you should rethink the label design or implement them as buttons.


    # Listing What Your User Sees


    To start, the screens you need to create and describe their contents:


    +   - A Welcome with text, images and a button.

    - A title and page numbers are at the top of the Welcome screen and a History
    button is at the bottom. These are also on the screen with the exercise video.
    The page numbers indicate there four numbered pages after this page. The waving
    hand symbol is highlighted.

    - The screen with the exercise video also has a timer, a Start/Done button and
    rating symbols. One of the page numbers is highlighted.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '+   The History screen shows the user’s exercise history as a list and as a
    bar chart. It has a title but no page numbers and no History button.


    +   The High Five! screen has an image, some large text and some small gray text.
    Like the History screen, it has no page numbers and no History button.


    In this chapter and the next, you’ll lay out the basic elements of these screens.
    Chapter 9, "Refining Your App", you’ll fine-tune the appearance to look like the
    screenshots above.


    # Listing What Your App Does


    Next, list the functionality of each screen, starting with the last two.


    +   The History and High Five! screens are modal sheets that slide over the Welcome
    or Exercise screen. Each has a button the user taps to dismiss it, either a circled
    "X" or a Continue button.


    +   On the Welcome and Exercise screens, the matching page number is white text
    or an outline on a black background. Tapping the History button displays the screen.


    +   The Welcome page Get Started button displays the next page.


    +   On an Exercise page, the user can tap the play button to play the video of
    the exercise.


    +   On an Exercise page, tapping the Start Exercise button starts a countdown
    timer, and the button label changes to Done. Ideally, the Done is disabled until
    the timer reaches 0. Done adds this exercise to the user’s history for the current
    day.


    +   On an Exercise page, tapping one of the five rating symbols changes the color
    of symbol and all preceding it.


    +   Nice to have: Tapping a page number goes to that page. Tapping Done on an
    Exercise page goes to the next Exercise page. Dismissing the High Five! screen
    returns to the Welcome page.


    You’ll implement all of these in the next three chapters.


    There’s also the page-based structure of HIITFit. This is easy to implement in
    SwiftUI, so you’ll do it, before you create any screens.'
