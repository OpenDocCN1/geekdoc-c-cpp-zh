  md: '# The Asset Catalog


    > **Skills you''ll learn in this section:** app icons; vector vs bitmap; managing
    images in asset catalogs; screen resolution


    Asset catalogs are by far the best place to manage image and color sets.


    Within an asset catalog, under one image set, you can define multiple images for
    different themes, different devices, different scales and even different color
    gamuts. When you use the name of the image set in your code, the app will automatically
    load the correct image for the current environment. When you supply differently
    scaled images in an asset catalog, the app store will automatically **do thinning**
    and only download the relevant images for particular device. This is potentially
    a huge reduction in app download size.


    The asset catalog also holds the app icon, the launch screen image and launch
    screen background color.


    # Adding the App Icon


    +   ➤ Open the starter project for this chapter, aside from removing the preview
    data, is the same as the previous chapter''s final project.

    ➤ Click the project name **Cards** at the top of the Project navigator. Choose
    the **Cards**. On the **General** tab, find **App Icons and Launch Screen:


    | General | Signing & Capabilities | Resource Tags | Info | Build Settings | Build
    Phases | Build Rules |

    |---|---|---|---|---|---|-|

    | PROJECT | App Icons and Launch Screen | | | | | |

    | Cards | App icon Appicon | | | | | |

    | TARGETS | App icon Include all app icon assets | | | Launch Screen File | |
    |


    Source for app icons


    This is where you specify which icon set to use for your app. You can choose to
    hold the icons in folders instead of asset catalogs, but it''s much easier to
    keep them in the asset catalog as Apple introduced. You can change the icon for
    your app dynamically, by checking **include all app icon assets**, and defining
    multiple icon sets in **Assets.xcassets.


    +   ➤ Open **Assets.xcassets** and select **AppIcon**.'
