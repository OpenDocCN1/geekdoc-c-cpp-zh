    \ following to call your helper method before the call to WidgetCenter:\n\n```\n\
    writeObjects()\n```\n\nThe existing call to WidgetCenter now tells the widget\
    \ to reload its timeline whenever your app writes a new array of objects into\
    \ a file in the app group.\n\nNext, go and set up the widget to read this file.\n\
    \n# Reading the Objects File\n\nOpen TheMetWidget.swift.\n\nNow, you can read\
