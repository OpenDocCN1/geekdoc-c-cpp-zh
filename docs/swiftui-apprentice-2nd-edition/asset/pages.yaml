  md: '# # Chapter 13: Outlining a Photo Collage App

    By Caroline Begbie


    Congratulations, you''ve written your first app! HIITFit uses standard iOS interaction
    with swipeable page views. Now you''ll get your teeth into something a bit more
    complex with custom gestures and custom views.


    Photo collage apps are very popular, and in this section, you''ll build your own
    collage app in which you''ll create cards to share. You''ll be able to add images
    — from your photos or from the internet — and add text and stickers too. This
    app will be real-world with real-world problems to match.


    In this chapter, you''ll take a look at a sketch outline of the app idea and create
    a view hierarchy that will be the skeleton of your app.


    At the end of Section 2, your finished app will look like this:


