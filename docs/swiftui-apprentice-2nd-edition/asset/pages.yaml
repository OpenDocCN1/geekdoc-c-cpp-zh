  md: '# Creating the Exercise Structure


    Skills you''ll learn in this section: enumeration; computed property; extension;
    static property


    Currently, your app uses two arrays of strings for the exercise and video file
    names. This simple approach helped you pass enough data to the extracted Header,
    keeping its preview manageable. But, if you add videos, you must manually ensure
    the strings match up across the two arrays. It is safer to encapsulate them as
    properties of a named type.


    First, you''ll create an Exercise structure with the properties you need. Then,
    you will create an array of Exercise instances and loop over this array to create
    the Exercise pages of the TabView.


    +   Create a new Swift file (Command-N):


    ![](img/b137d252894e5c4c3dd508961a85e251_103_0.png)


    New Swift File


    > Note: Up to now, you''ve created and used new SwiftUI views. This exercise structure
    models your app''s data, encapsulating the exerciseName and videoName properties.
    It''s not a view, so you create it in a new Swift file.'
