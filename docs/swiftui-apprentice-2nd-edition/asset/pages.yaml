    \ y: rect.midY))\npath.closePath()\n```\n\nYou start the first line where the\
    \ arc left off and at the middle bottom of the available space. The second line\
    \ ends at the middle of the right hand side.\n\n![](img/b137d252894e5c4c3dd508961a85e251_501_0.png)\n\
