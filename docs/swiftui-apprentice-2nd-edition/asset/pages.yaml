  md: '![](img/b137d252894e5c4c3dd508961a85e251_15_0.png)


    To follow along with this book, you''ll need the following:


    +   - **A Mac computer with an Intel or ARM processor.** Any Mac that you''ve
    bought in the last few years will do, even a Mac mini or MacBook Air.

    - **Xcode 14.2 or later.** Xcode is the main development environment for building
    iOS Apps. It includes the Swift compiler, the debugger and other development tools
    you''ll need. You can download the latest version of Xcode for free from the Mac
    App Store.

    - **Optionally, an iPhone, iPad or iPod Touch** running iOS 16.'
