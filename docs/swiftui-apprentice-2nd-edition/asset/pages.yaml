  md: '# Challenge 2: Drag and Drop to the Correct Offset


    In Chapter 17, "Adding Photos to Your App", you implemented drag and drop. However,
    when you drop an item, it adds to the card in the center, offset zero. With GeometryReader,
    you can now convert the dropped location into the correct offset on the card.


    Settings.calculatedDropOffset(proxy:location:) returns the offset from the geometry
    proxy and the drop location. Use this method in CardDetailView.swift to drop items
    at the correct location. You''ll need to pass the geometry proxy from SingleCardView
    to CardDetailView. You''ll also need to amend the methods where you add the element
    to include the offset.


    Try drag and drop on iPad, and you have an infinite number of Google images to
    decorate your card.


