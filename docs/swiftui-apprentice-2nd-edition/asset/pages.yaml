    # Identity and Type for group


    Location describes how to store the group. Relative to Group means that Xcode
    traverses the hierarchy of groups and folders to find an Absolute path. In your
    app''s case, this is the very top Cards in the Project navigator.


    ![](img/b137d252894e5c4c3dd508961a85e251_446_1.png)


    # Absolute location


    When you create a new group, you can choose to mirror that group with a folder
    on disk. If you have a file selected inside a group connected to a disk folder,
    and you create a new group with File > New > Group, then Xcode will create both
    a new group and a new folder.


    If your current selection is inside a logical group without a mirrored folder
    on disk, then Xcode won''t create a new folder for a new group. The option under
    File > New > Group will do the opposite. It changes between Group with Folder
    or Group without Folder depending upon whether your currently selected file is
    inside a mirrored group or not.'
