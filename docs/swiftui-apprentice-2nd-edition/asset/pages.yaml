    +   - **Run button**: Build and run (**Command-R**) the project.


    +   - **Stop button** appears when project is running: Stop (**Command-\**) running
    project.


    +   - **Source control** button: Sources branches and lets you create a pull request.


    +   - **Scheme menu**: This button''s label is the name of the app. Select, edit
    or manage schemes. Each product has a scheme. MyFirst has only one product, so
    it has only one scheme.


    +   - **Run destination** view: This menu defaults to iPhone 14 Pro. Select a
    connected device or a simulated device to run the project.


    +   - **Activity** view: A wide gray field that shows the project name, status
    messages and warning or error indicators.


    +   - **Library** button: This button''s label is a + sign. It opens the library
    of views, modifiers, code snippets, media, colors stored in Assets and system
    symbols. **Option-click** this button to keep the library open.


