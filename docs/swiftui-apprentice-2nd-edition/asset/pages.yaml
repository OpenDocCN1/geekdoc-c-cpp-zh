  md: '# Key Points


    +   - You have several choices of where to store data. You should use @AppStorage
    and @SceneStorage for lightweight data, and property lists, JSON or Core Data
    for main app data that increases over time.


    +   - Your app is sandboxed so that no other app can access its data. You are
    not able to access the data from any other app either. Your app executable is
    held in the read-only bundle directory, with all your app''s assets.


    +   - Property lists store serialized objects. If you want to store custom types
    in a property list file, you must first convert them to a data type recognized
    by a property list file, such as String or Boolean or Data.


    +   - String manipulation can be quite complex, but Swift provides many supporting
    methods to extract part of a string or append a string on another string.


    +   - Manage scenes with @sceneStorage. Your app holds data per scene. iPads and
    macOS can have multiple scenes, but an app run on iPhone only has one.'
