  md: '# SwiftUI Apprentice


    # Enabling Developer Mode on Your iOS Device


    First, you must enable Developer Mode on your iOS device. Introduced in iOS 16
    and watchOS 9, Developer Mode protects people from inadvertently installing potentially
    harmful software on their devices and reduces attack vectors by developer-only
    functionality.


    +   Open the Settings and tap Privacy & Security. Scroll down and tap Developer
    Mode, then tap the switch to turn it on.


    ![](img/b137d252894e5c4c3dd508961a85e251_80_0.png)


    Enabling Developer Mode in Privacy & Security setting.


    You''ll see an alert warning that Developer Mode reduces the security of your
    device.


    +   Tap the alert''s Restart button. After your device restarts and you unlock,
    you will see an alert asking you to confirm that you want to turn on Developer
    Mode:


    ![](img/b137d252894e5c4c3dd508961a85e251_80_1.png)


    Turn on Developer Mode after restarting the device.'
