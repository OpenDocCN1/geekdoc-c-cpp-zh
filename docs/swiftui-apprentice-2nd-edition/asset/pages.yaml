  md: "# What Else is in Your Project?\n\nThe Project navigator lists several files\
    \ and folders.\n\n+   MyMyApp.swift: This file contains the code for your app's\
    \ entry point. What actually launches your app.\n\n```\n@main\nstruct MyMyApp:\
    \ App {\n    var body: some Scene {\n        WindowGroup {\n            ContentView()\n\
    \        }\n    }\n}\n```\n\nThe @main attribute marks MyMyApp as the app's entry\
    \ point. You might be accustomed to writing a main() method to actually launch\
    \ an app. The App protocol requires only a computed property named body that takes\
    \ care of this. A Scene is a container for the root view of a view hierarchy.\n\
    \nFor an iOS app, the default setup is a WindowGroup scene containing ContentView()\
    \ as its root view. A common customization is to set different root views, depending\
    \ on whether the user has logged in.\n\nIn an iOS app, the view hierarchy fills\
    \ the entire display. In a macOS or iPadOS app, WindowGroup can manage multiple\
    \ windows.\n\n+   Assets.xcassets: Store your app's images and colors. AppIcon\
    \ is a special image set for all the different sizes and resolutions of your app's\
    \ icon. Using Xcode 14, you can supply a single 1024x1024-point icon image that\
    \ Xcode resizes to get all the icons for iOS, iPadOS and watchOS. Simply select\
    \ Single Size in the Attributes inspector:\n\n![](img/b137d252894e5c4c3dd508961a85e251_43_0.png)\n\
    \nAssets: A Single Size app icon"
