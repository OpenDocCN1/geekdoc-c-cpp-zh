- img_proc: true
  md: '# SwiftUI Apprentice


    Another kind of API is the set of rules for clients to request resources from
    a server. Most of the APIs you''ll use for your apps are REST APIs, which use
    HTTP. For each resource available on the server, the REST API documentation tells
    you how to construct a request:


    +   - The resource''s URL, called its endpoint.

    - Which HTTP method to use.

    - Which HTTP headers to include.

    - What to put in the request body.


    > Note: REST is the acronym of "REpresentational State Transfer", the name created
    by Roy Fielding for the architectural style underlying the World Wide Web. The
    term describes how a well-designed Web application works: A user selects a resource
    identifier from a network of Web resources (a virtual statemachine) and uses methods
    like GET or POST to create a state transition that transfers the resource''s representation
    to the user.


    In the next chapter, you''ll set up TheMet to communicate with the museum''s API.
    In this chapter, you''ll explore this API''s documentation (https://metmuseum.github.io).


    # Sending & Receiving HTTP Messages


    Even with excellent documentation, you''ll usually have to experiment a little
    to figure out how construct requests to get exactly the resources you want and
    how extract these from the server''s responses. How do you send requests and examine
    responses?


    # Browser


    The easiest way to make a simple HTTP GET request is to enter the URL in a browser
    app like Safari.


    Enter this URL in your favorite browser:


    ```

    https://www.metmuseum.org/art/the-collection

    ```'
