  md: '# Chapter 11: Managing Data With Property Wrappers


    HistoryView is a subview of WelcomeView, but you saw using

    @EnvironmentObject allowed you to avoid passing HistoryStore to WelcomeView,

    does''t use it.


    If you did the challenge in that chapter, you also managed HistoryStore

    at@State and @Binding.


    In Chapter 8, "Saving History Data", you moved the initialization of HistoryStore

    from ContentView to HITFitApp to initialize it or without saved state data.


    ThingStore has the properties, which is an array of String values. Like the

    HistoryStore in the first version of HITFit, it''s a structure.


    In this chapter, you''ll manage changes to the HistoryStore using

    @State and @Binding, then convert it to an ObservableObject class and manage

    changes with @StateObject and @observedObject:


    ![](img/b137d252894e5c4c3dd508961a85e251_310_0.png)


    TIL: ThingStore shared as Binding and as ObservedObject


    You''ll learn that these two approaches are very similar.


    > Note: Our tutorial Property Wrappers (https://bit.ly/3vLOpbl) extends the

    project to use ThingStore as an @EnvironmentObject.


    # Tools for Managing Data


    You already know that a @State property is a source of truth. A view that owns
    a

    @State property can pass its value or its binding to its subviews. If it passes

    binding to a binding, that subview has a reference to the source of truth. This

    allows the subview to update that property''s value or redraw itself when that
    value

    changes. When a @State value changes, any view with a reference to it invalidates
    its

    appearance and redraws itself to display the new state.'
