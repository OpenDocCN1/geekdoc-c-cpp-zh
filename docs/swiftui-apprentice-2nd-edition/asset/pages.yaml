- img_proc: true
  md: '# Getting Started


    Open the **DownloadingData** playground in the starter folder. If the editor window
    is blank, show the Project navigator (**Command-1**) and select **DownloadingData**
    there.


    ![](img/b137d252894e5c4c3dd508961a85e251_657_0.png)


    Open DownloadingData playground.


    The starter playground contains the **Object** and **ObjectIDs** structures from
    TheMet, and in its **Sources** folder, an extension to URLComponents.


    Playgrounds are useful for exploring and working out code before moving it into
    your app. You can quickly inspect values produced by code and methods without
    needing to build a user interface or search through a lot of debug console messages.


    # URLSession


    URLSession is Apple''s framework for HTTP messages. Apple''s documentation page
    includes this note:


    > Note: The URLSession API involves many different classes that work together
    in a fairly complex way which may not be obvious if you read the reference documentation
    by itself.'
