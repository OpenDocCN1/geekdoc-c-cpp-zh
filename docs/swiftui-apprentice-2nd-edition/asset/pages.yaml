  md: "# GeometryReader\n\nGeometryReader is a container view that takes up the entire\
    \ available space and returns its preferred size in points. Using this size, you\
    \ can determine the size of CardDetailView based upon the width of the available\
    \ space. Given precise size coordinates, you'll also be able to drop items dragged\
