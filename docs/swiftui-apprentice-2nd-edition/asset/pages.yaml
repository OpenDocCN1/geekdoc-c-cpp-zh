- img_proc: true
  md: '# The PhotosUI Framework


    With the stickers, you load the sticker images lazily, and when the user selects
    one, you use that one image. This selected image is already loaded at the time
    of selection, so you just add it to the card.


    Loading photos is not as simple as loading stickers, because the user''s media
    library might number in the tens of thousand of assets. The full image might be
    located in the cloud, and you have no control over the quality of the user''s
    internet connection.


    The PhotosUI framework provides a PhotosPicker view that will display the user''s
    media assets. The user then selects photos, and each selected item goes into an
    array. As the item is added to the array, the picker downloads the full file in
    the background. When the photo is fully downloaded, your app will add the photo
    to the card.


    This takes all indeterminate amount of time that depends on internet availability
    and connection. Whenever a task isn''t straightforward, you should perform it
    asynchronously, so you won''t hold the main thread. You''ll learn more about asynchronous
    operations in Section III, but you''ll have a brief encounter with them here you
    load photos.


    # The PhotosPicker View


    > Skills you''ll learn in this section: PhotosPicker


    Instead of using your own view, you''ll use PhotosUI''s PhotosPicker.


    +   Open the starter project for this chapter, which is the same as the previous
    chapter''s challenge project.


    +   In the Card Modal Views group, create a new SwiftUI View file called PhotosModal.swift
    and import the framework:


    ```

    import PhotosUI

    ```'
