  md: '# Key Points


    +   - Declarative app development means declare both how you want the views in
    your UI to look and what data they depend on. The SwiftUI framework takes care
    of creating views when they should appear and updating them whenever there''s
    a change to data they depend on.


    +   - Data access = dependency: Reading a piece of data in your view creates a
    dependency for that data in that view.


    +   - Single source of truth: Every piece of data has a source of truth, internal
    or external. Regardless of where the source of truth lies, you should always have
    a single source of truth.


    +   - Property wrappers augment the behavior of properties: @State, @Binding and
    @EnvironmentObject declare a view''s dependency on the data represented by the
    property.


    +   - @Binding declares dependency on a @State property owned by another view.
    @EnvironmentObject declares dependency on some shared data, like a reference type
    that conforms to ObservableObject.


    +   - Use Boolean @State properties to show and hide modal sheets or subviews.
    Use @Environment(\.dismiss) as another way to dismiss a modal sheet.'
