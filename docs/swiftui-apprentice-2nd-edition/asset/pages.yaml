  md: "The console shows the \"official\" request URL, where the query string is actually\n\
    rhino%20wolf.\n\nPostman URL-encoded the space between rhino and wolf to %20.\
    \ URLs sent over the\ninternet can contain only letters, digits and these punctuation\
    \ marks: ~, _, and ~.\n\nOther punctuation marks, including /, ? and %, are encoded\
    \ as a hexadecimal\ndigits preceded by the escape character %. The hexadecimal\
    \ value is the character's\nbyte value in ASCII, for example, 20 (32 in decimal)\
    \ for the space character and 25\n(37 in decimal) for the % character. The space\
    \ character can also be encoded as +. For\na non-ASCII character, URL-encoding\
    \ uses its UTF-8 8 byte value.\n\nWhen / ? are delimiters in the URL, they don't\
    \ get encoded.\n\n# # POST Request & Authentication\n\nTheMet doesn't need anything\
    \ from this section, but your future apps might.\n\nTheMet only needs to GET resources\
    \ from the server, and your users don't need to\nauthenticate.\n\nYou usually\
    \ need to implement authentication for apps that let users access\nrestricted\
    \ materials to create, update or delete server records. If you're building\napp\
    \ that requires this capability consider using Sign In with Apple. You can learn\n\
    by following our video course Sign In with Apple (https://bit.ly/3VOGbMG).\n\n\
    To try out a POST request, you will use Postman to send something like this GitHub\n\
    example:\n\n```\ncurl -i -H \\\n\"Authorization\": token \\\n519983f4dd3b39e2c5b7e025d67aa6679d4\
    \ \\\n-d \\\n  \"name\": \"blog\", \\\\\n  \"auto_init\": true, \\\\\n  \"private\"\
    : true, \\\\\n  \"gitignore_template\": \"nanoc\" \\\\\n}\nhttps://api.github.com/user/repos\n\
    ```\n\nThis example shows how to create a new GitHub repository, so its GitHub-\n\
    user authentication. Remember when you set up your GitHub account in Xcode, you\n\
    had to get a personal access token? You'll need one here, too."
