  md: "# Creating a REST Request URL\n\n```\nhttps://collectionapi.metmuseum.org/public/collection/v1/search?\n\
    medium=Quilt|Silk|Bedcovers&q=quilt\n```\n\nThis URL lists query parameter names\
    \ and values after the ? separator. The query parameter medium=Quilt|Silk|Bedcovers\
    \ matches any object whose medium is Quilts or Bedcovers. You can send the request\
    \ like this in Postman or Safari bot, to send it from your app, the | character\
    \ must be URL-encoded as %7C:\n\n```\nhttps://collectionapi.metmuseum.org/public/collection/v1/search?\n\
    medium=Quilt%7CSilk%7CBedcovers&q=quilt\n```\n\nYou don't want to do the URL-encoding\
    \ yourself? Fortunately, you can hand this work over URLComponents and URLQueryItem.\
    \ You'll use these in the playground to create a flexible approach to composing\
    \ REST requests, so you can easily change query parameter values.\n\n# URLComponents\n\
    \nURLComponents enable you to construct a URL from its parts and, also, to access\
    \ the parts of a URL. URLComponents include scheme, host, port, path, query and\
    \ queryItems. itself gives you access to URL components like lastPathComponent\n\
    \n+   Add this to the playground:\n\n```\nlet baseURLString = \"https://collectionapi.metmuseum.org/public/\n\
    collection/v1/\nvar urlComponents = URLComponents(\n    string: baseURLString\
    \ + \"search\")!\nurlComponents?.queryItems = [\n    URLQueryItem(name: \"medium\"\
    , value: \"Quilt|Silk|Bedcovers\\),\n    URLQueryItem(name: \"q\", value: \"quilt\"\
    )\n]\nlet urlComponentsURL = urlComponents?.absoluteString\n```\n\nSet the URL\
    \ string for the API's endpoint and add the search endpoint to create a URLComponents\
    \ instance. Then you create an array of URLQueryItem. The URLQueryItem parameters\
    \ are the parameter names and values in the sample request."
