  md: '# Key Points


    +   - Optionals are properties that can contain nil. Optionals make your code
    secure, as the compiler won''t allow you to assign nil to non-optional properties.
    You can use guard to unwrap an optional or exit the current method if the optional
    contains nil.


    +   - Don''t force-unwrap optionals by marking them with an ! It is tempting to
    use an ! when assigning options to a new property because you will never contain
    nil. Instead, try and keep your code safe by assigning a fall-back value with
    the nil coalescing operator ??. For example: let atLeastOne = oldValue ?? 1.


    +   - Use breakpoints to halt execution and step through code to confirm that
    it''s working correctly and that variables contain the values you expect.


    +   - Use throw to handle errors in methods marked by throws.


    +   - If you need to handle errors, call methods marked with throws do `try ...
    } catch { ... }`. catch will only be performed if the try fails. If you don''t
    need to handle errors, you can call the method with let result = try? method()`.
    result will contain nil if there is an error.


    +   - Use @StateObject to hold your data store. Your app will initialize a state
    object once.


    +   - Closures are chunks of code that you can pass around just as any other object.
    You can assign them to variables or provide them as parameters to methods. Array
    has a number of methods requiring closures to transform its elements into a new
    array.


    +   - PropertyListSerialization is just one way of saving data to disk. You could
    also use JSON, or Core Data, which manages objects and their persistence.'
