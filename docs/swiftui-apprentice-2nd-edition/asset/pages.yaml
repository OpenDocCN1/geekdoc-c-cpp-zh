  md: '# Getting Started


    Open the starter project or continue with your app from the previous chapter.


    # WidgetKit


    WidgetKit is Apple''s API for adding widgets to your app. The widget extension
    templates help you create a timeline of entries. You decide what app data you
    want to display and the time interval between entries.


    You also define a view for each size of widget — small, medium, large, extra large
    — you want to support. The extra large size is available only in iPadOS.


    ![](img/b137d252894e5c4c3dd508961a85e251_685_0.png)


    Here''s a typical workflow for creating a widget:


    +   1. Add a widget extension to your app. Configure the widget''s display name
    and description.


    +   2. Select or adapt a data model type from your app to display in the widget.
    Create a timeline entry structure — a Date plus your data model type. Create sample
    data for snapshot and placeholder entries.'
  merge: -1
  pgno: 685
- img_proc: true
  md: '+   3. Decide which widget sizes to support: Create small, medium or large
    views to display one or more data model values. In iOS 16, you can also create
    accessory views to display on the device''s lock screen.


    +   4. Create a timeline to deliver timeline entries. Decide on the refresh policy.


