  md: "# ZStack\n\nIf you think of an HStack as arranging its contents along the device's\
    \ x-axis and a VStack arranging views along the y-axis, then the ZStack container\
    \ views its contents along the z-axis, perpendicular to the device screen. Think\
    \ of it as a depth stack, displaying views in layers.\n\n+   **Command-click**\
    \ VStack to embed in a ZStack, then add this code at the top of ZStack above the\
    \ VStack:\n\n```\nButton(action: {}) {\n  Image(systemName: \"xmark.circle\")\n\
    }\n```\n\n+   Switch the preview to **Selectable** mode to see the outline of\
    \ the button:\n\n![](img/b137d252894e5c4c3dd508961a85e251_131_0.png)\n\nThe button\
    \ is centered in the view, because the default stack alignment is center. Because\
    \ you added the Button code above the VStack in the source code, it's underneath\
    \ the VStack on screen, so you only see its outline.\n\nThe arrangement is a little\
    \ counter-intuitive unless you think of it as placing the first view down on a\
    \ flat surface, then layering the next view on top of that, and so on. By declaring\
    \ the button as the first view places it on the bottom of the stack. If you want\
    \ the button in the top layer, declare last in the ZStack.\n\nIt doesn't matter\
    \ in this case, because you're about to move the button into the top right corner\
    \ of the view, where there's nothing in the VStack to cover it."
