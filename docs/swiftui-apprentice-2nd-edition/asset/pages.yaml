  md: "# Decoding Nested JSON\n\nMany APIs send JSON data whose structure is very\
    \ different from the way you want to organize your app's data. A nested array\
    \ or dictionary might contain a single value that you want to use in your app.\n\
    \nFortunately, this isn't the case with the museum.org data you need for TheMet,\
    \ although the Object record contains a few arrays. Suppose you want to use the\
    \ Wikidata_URL of one of the items in the tags array:\n\n```\n\"tags\": [\n  {\n\
    \    \"term\": \"Animals',\n    \"AAT_URL\": \"http://vocab.getty.org/page/aat/300249525\"\
    ,\n    \"Wikidata_URL\": \"https://www.wikidata.org/wiki/Q7229\"\n  },\n  {\n\
    \    \"term\": \"Poetry',\n    \"AAT_URL\": \"http://vocab.getty.org/page/aat/300055931\"\
    ,\n    \"Wikidata_URL\": \"https://www.wikidata.org/wiki/Q4822\"\n  },\n  {\n\
    \    \"term\": \"Men',\n    \"AAT_URL\": \"http://vocab.getty.org/page/aat/300025928\"\
    ,\n    \"Wikidata_URL\": \"https://www.wikidata.org/wiki/Q8441\"\n  },\n  {\n\
    \    \"term\": \"Horses',\n    \"AAT_URL\": \"http://vocab.getty.org/page/aat/300250148\"\
    ,\n    \"Wikidata_URL\": \"https://www.wikidata.org/wiki/Q7266\"\n  }\n]\n```\n\
    \nThere are two approaches to decoding nested JSON:\n\n+   1. **Define your data\
    \ model to mirror the JSON value** and see how nifty automatic JSON decoding can\
    \ be.\n2. **Flatten the JSON value into your data model**: In exchange for more\
    \ decoding work, you will get sensible data structures that are easier and more\
    \ natural to work with.\n\nTo see how to do this and much more, check out our\
    \ tutorial Encoding and Decoding in Swift (https://bit.ly/3bqsqrBY)."
