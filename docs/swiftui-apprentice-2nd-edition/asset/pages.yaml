  md: '# Lists


    > **Skills you''ll learn in this section:** Listing data; deleting items from
    lists; collapsing hierarchical data; the Edit button


    A List is a container that shows elements from a collection of data. Each element
    is presented on a row. This is similar to the Form you''ve been using, but your
    current usage is much more listing of data than creating a form where you might
    ask for input from the user.


    # Editable Lists


    Being able to edit lists data is a common requirement. In this app, you may want
    to reset your day exercise. Or perhaps you performed some extra exercises in the
    gym and want to add them to the history list.


    The Apple standard of editing rows in lists is to have both an **Edit** button
    in the navigation bar and a swipe action to delete. You''ll first add the swipe
    and then add the button. Most of the behavior is built-in.


    With your date, each item in the file has a unique date, and the exercises for
    that date are held in a single array.


    | id | date | [exercises] |

    |---|---||

    | 28 Nov 2022 | [Squat, Step Up, Burpee, Squat, Squat] |

    | 27 Nov 2022 | [Burpee, Burpee, Sun Salute] |

    | 26 Nov 2022 | [Squat, Step Up, Sun Salute, Sun Salute] |


    *Your sample data*


    This design choice means that your data is separated by date, not by exercise.
    The top level of your list is dates, which means that built-in list editing will
    take place on dates. Of course, with the nested ForEach loop, you can still list
    the exercises, but editing those exercises is more difficult.


    To start, simplify dayView(day:) so that it shows only dates.'
  merge: -1
