    You can store a few values in the @AppStorage or @SceneStorage dictionary. @AppStorage
    values are in UserDefaults, so they persist after the app closes. You use a @SceneStorage
    to restore the state of a scene when the app reopens. You can think of scenes
    as multiple windows on iPad.


    # Wrapping Objects


    When your app needs to change and respond to changes in a reference type, you
    create a class that conforms to ObservableObject and publishes the appropriate
    properties. In this case, use @StateObject and @ObsObject in much the same way
    as @State and @Binding for values. You instantiate your publisher class in a view
    as a @StateObject pass it to subviews as @observedObject. When the owning view
    redraws itself, it doesn''t reset its @StateObject properties.


    If your app''s views need more flexible access to the object, you can lift it
    into the environment of a view''s subtree, still as a @StateObject. You must instantiate
    it here. Your app will crash if you forget to create it. Then you use the .environmentObject(:)
    modifier to attach it to a view. Any in the view''s subtree can subscribe to the
    publisher by declaring an @EnvironmentObject of that type.


    To make an environment object available to every view in your app, attach it to
    the root view when the App creates its WindowGroup.'
