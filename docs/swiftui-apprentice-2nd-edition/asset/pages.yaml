    programming language than Objective-C.


    +   * "SwiftUI vs. UIKit" is the most popular free episode at Kodeco and answers
    the big question: Which should you learn?


    +   * You can use UIKit views and view controllers in your SwiftUI apps.


    +   * Apple provides a lot of resources to help you become a developer and stay
    up to date: Documentation and human interface guidelines are available on the
    website and in Xcode. Use the Apple Developer app to watch WWDC videos.


    +   * The iOS Software Development Kit has a lot of frameworks, many for adding
    special features (capabilities) to your apps.


    +   * Members of the Apple Developer Program can add all the capabilities and
    also get early access to beta operating systems and developer tools. And, only
    members can participate fully in WWDC.


    +   * Xcode stores intermediate build results, indexes and logs in your project''s
    derived data folder. Sometimes you need to Clean Build Folder or delete the entire
