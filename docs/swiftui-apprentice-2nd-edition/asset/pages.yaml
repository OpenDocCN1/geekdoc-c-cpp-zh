  md: '# Key Points


    +   * Prototypes are always worth doing. With a prototype it''s easier to see
    what''s missing and what the next steps should be. They don''t have to be complicated.
    So far, you aren''t creating or saving any data, but you can tell how the app
    will flow. Writing an app is more than just writing code. It''s finding your target
    audience, creating a good design and overcoming technical problems.

    * Refactor your views early and often. Whenever you have a stack enclosing a number
    of views with multiple modifiers, it''s worth extracting those views to either
    a new View structure or to a new View property within the existing View.

    * There are several ways you can navigate apps. You can use built-in NavigationStacks,
    completely customize with buttons or tapped views and modal views or layered views.

    * SwiftUI toolbars are great for standard placement. You must enclose them in
    a NavigationStack to be able to see them.

    * Dictionaries are useful for holding disparate values. For example, you can use
    them to hold options to format views. Using tuples, you can create ad hoc views.

    * You can show modal views conditionally using a type that conforms to Identifiable.

    * Enumerations have a unique identifier called a hash value.'
