- img_proc: true
  md: "In the Supporting Code group, open ShareCardView.swift.\n\nShareCardView is\
    \ a cut-down version of CardDetail, without any of the modifiers that make the\
    \ card interactive. You'll be able to render this view to an image and then share\
    \ the image.\n\n# Rendering a View to an Image\n\nIn the Extensions group, open\
    \ UIImageExtensions.swift. Add a new extension at the end of the file:\n\n```\n\
    extension UIImage {\n  // 1\n  @MainActor static func screenshot(\n    card: Card,\n\
    \    size: CGSize\n  ) -> UIImage {\n    // 2\n    let cardView = ShareCardView(card:\
    \ card)\n    let content = cardView.content(size: size)\n    // 3\n    let renderer\
    \ = ImageRenderer(content: content)\n    // 4\n    let uiImage = renderer.uiImage\
    \ ?? UIImage.errorImage\n    return uiImage\n  }\n}\n```\n\nThere's a lot to unpack\
    \ here:\n\n+   MainActor ensures that method is performed on the main dispatch\
    \ queue. When you are dealing with views, you should be on the main thread. Note\
    \ that any method that calls UIImage.screenshot(card: size: ) must be marked with\
    \ MainActor, otherwise it will not compile.\n\n+   Load the card into a view and\
    \ extract the content. Specifying the size of the content, means that you can\
    \ scale it to any size you preview want.\n\n+   Render the image from the view.\
    \ ImageRenderer<Content> initializes with a view and draws it to a Canvas. You\
    \ can render shapes or any other View to an image.\n\n+   Extract a UIImage from\
    \ the rendered image, but if there's an error, use the error image in the asset\
    \ catalog."
