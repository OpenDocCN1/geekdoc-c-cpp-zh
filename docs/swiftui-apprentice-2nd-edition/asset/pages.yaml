  md: "6. Test: Create, manage and run unit and UI tests.\n\n7. Debug: Information\
    \ about CPU, memory, disk and network usage while your app is running.\n\n8. Breakpoint:\
    \ Add, delete, edit and manage breakpoints.\n\n9. Report: View or export reports\
    \ and logs generated when you build and run the project.\n\nThe Filter field at\
    \ the bottom is different for each tab. For example, the Project Filter lets you\
    \ show only the files you recently worked on. This is handy for projects with\
    \ a lot of files in a deeply nested hierarchy.\n\n# Editor\n\n```\n//\n// ContentView.swift\n\
    // Mylist\n//\n// Created by Libranner Leonel Santos Espinal on 2/10/22.\n//\n\
    \nimport SwiftUI\n\nstruct ContentView: View {\n    var body: some View {\n  \
    \      VStack {\n            Image(systemName: \"globe\")\n                .foregroundColor(.accentColor)\n\
    \            Text(\"Hello, world!\")\n        }\n        .padding()\n    }\n}\n\
    \nstruct ContentView_Previews: PreviewProvider {\n    static var previews: some\
    \ View {\n        ContentView()\n    }\n```\n\n![](img/b137d252894e5c4c3dd508961a85e251_30_0.png)\n\
    \nWhen you're working in a code file, the Editor shows the code and a Minimap.\
    \ The minimap is useful for long code files with many properties and methods.\
    \ You can hover the cursor on the minimap to locate a specific property, then\
    \ click to go directly to it. You don't need it for the apps in this book, so\
    \ you may want to hide it via the Adjust Editor Options button in the upper right\
    \ corner of the editor.\n\nWhen you're working in a SwiftUI file, Option-Command-Return\
    \ shows or hides the preview canvas."
