  md: "# Reloading the Widget’s Timeline\n\nNext, you'll set up TheMetStore so it\
    \ tells the widget to reload its timeline whenever fetchObjects(for:) finishes\
    \ downloading and decoding an array of objects.\n\n+   - In TheMetStore.swift,\
    \ add this import statement:\n\n```\nimport WidgetKit\n```\n\nfetchObjects(for:)\
    \ needs to call a WidgetCenter to reload your widget's timeline.\n\n+   - In fetchObjects(for:),\
    \ add this line after the for-loop:\n\n```\nWidgetCenter.shared.reloadTimelines(ofKind:\
    \ \"TheMetWidget\")\n```\n\nWhen the navigation stack in ContentView first loads,\
    \ it calls fetchObjects(for:) to create the array, but this is an asynchronous\
    \ task, so a user might install the widget while its objects array is empty. You\
    \ tell the widget to reload its timeline when array is ready.\n\n# Writing the\
    \ App Group File\n\n+   - At the top of TheMetStore.swift, just below the WidgetKit\
    \ statement, add this code:\n\n```\nextension FileManager {\n    static func sharedContainerURL()\
    \ -> URL {\n        return FileManager.default.containerURL(forSecurityApplicationGroupIdentifier:\
    \ \"group.your.prefix.TheMet.objects\")!\n    }\n}\n```\n\nThis is simply standard\
    \ code for getting the app group container’s URL. Be sure to substitute your bundle\
    \ identifier prefix.\n\nIt makes sense to write this app group file just after\
    \ you’ve decoded the data into the objects array. To write an array to a file,\
    \ JSON-encode it. Then the widget JSON-decodes the file contents."
