- img_proc: true
  md: 'To send a request to a server, you need to perform several steps:


    +   1. Specify a URLSession to coordinate data-transfer tasks. For the simple
    download tasks in TheMet, you''ll use the built-in shared session, which provides
    a reasonable default behavior.


    +   2. Create a URL from a String like https://metmuseum.org. This could fail
    — for example, if the string is empty.


    +   3. Create a URLRequest from a URL: This object contains the HTTP method and
    headers and other properties.


    +   4. Send the URLRequest in the shared session and await a Data instance and
    URLResponse object.


    +   5. Decode the data into your app''s data model: Most REST APIs send JSON data.
    You''ll use a JSONDecoder to decode this into your model. The code is simpler
    than what you did in Chapter 19, "Saving Files" because TheMet needs only a few
    properties from the metmuseum.org API, and its JSON names and structures are a
    good match for TheMet''s data model.


    > Note: URLSession and the broader topic of networking have their own courses:
    Beginning Networking with URLSession (https://bit.ly/3GY22E) and Advanced Networking
    with URLSession (https://bit.ly/3GwHE5m).


    # Asynchronous Methods


    Most URLSession methods involve network communication, so you can''t predict how
    long they''ll take to complete. In the meantime, the system must continue to interact
    with the user. To make this possible, URLSession methods are asynchronous: they
    dispatch their work onto another queue and immediately return control to the main
    queue, so it can respond to user interface events. You''ll call a URLSession method
    from an asynchronous method, which suspends until the network task completes,
    resumes execution to process the response from the server.


    > Note: Learn more about asynchronous methods and concurrency in our Modern Concurrency
    in Swift (https://bit.ly/3i5FrM) and its companion video courses Modern Concurrency:
    Getting Started (https://bit.ly/3lf528z) and Modern Concurrency: Beyond the Basics
    (https://bit.ly/3vtbtlsd).'
  merge: -1
