  md: '# Matching Delimiters


    SwiftUI code uses a lot of nested closures. It''s really easy to mismatch your
    braces and parentheses. Xcode helps you find any mismatches and tries to prevent
    these errors from happening.


    +   In Settings, select Text Editing


    Editing:


    ![](img/b137d252894e5c4c3dd508961a85e251_46_0.png)


    Settings ▸ Text Editing ▸ Editing


    Most of the Code Completion items are super helpful. Although you can copy and
    paste code from this book, you should try to type the code as much as possible
    to learn how these aides work.


    Here''s a big hint that something''s wrong or you''re typing in the wrong place:
    You''re expecting Xcode to suggest completions while you type, but nothing (useful)
    appears. When this happens, it''s usually because you are outside the closure
    you need to be in.'
