    so continue to the next step while it''s busy.


    # Getting a Signing Certificate


    Apple does best to protect your apps from malicious apps. Part of this is ensuring
    Apple knows who is responsible for every app on your device. Before you install
    your app from Xcode onto your device, you need to select a team — the account
    you set up with your Apple ID — to get signing certificate from Apple.


    In the project select, select the target. In the Signing & Capabilities tab, change
    the organization name in the Bundle Identifier to something that''s yours, like
    org.audrey for me:


    ![](img/b137d252894e5c4c3dd508961a85e251_81_1.png)


    Personalize the Bundle Identifier.'
