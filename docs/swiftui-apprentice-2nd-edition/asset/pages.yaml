  md: "# Adding Modal Views\n\n> **Skills you'll learn in this section:** multiple\
    \ modal sheets; Identifiable enumerations; Hashable\n\nAs of now, buttons don't\
    \ do anything, so you'll attach text views to each button. As you progress through\
    \ the book, you'll replace the text view with the appropriate content.\n\nIn Section\
    \ I, you used View.sheet(isPresented:onDismiss:content), where you passed a Boolean\
    \ state property. When you have multiple sheets to show conditionally, you can\
    \ choose a different method of presentation, by passing the sheet an optional\
    \ data source binding.\n\nThis data source can be of any type that conforms to\
    \ Identifiable.\n\n+   **In SingleCardView.swift**, add this modifier to Color.yellow.\n\
    \n```\n.sheet(item: $currentModal) { item in\n    switch item {\n    default:\n\
    \        Text(String(describing: item))\n}\n```\n\nHere, for every modal selection,\
    \ you print out the description of the modal. Later, you'll add cases to this\
    \ switch statement when you configure each of the four modal views.\n\ncurrentModal\
    \ is of type ToolbarSelection, which doesn't conform to Identifiable. Because\
    \ of this, you'll get a compile error: _Instance method sheet(item:onDismiss:content:)\
    \ requires ToolbarSelection conform to Identifiable."
  merge: -1
