- img_proc: true
  md: '![](img/b137d252894e5c4c3dd508961a85e251_442_0.png)


    For height in portrait mode, all devices fit into the regular height section.
    In landscape, all iPhones use compact height, but some larger iPhones use regular
    width rather than the smaller compact width.


    iPads are always regular width and regular height. However, you still have to
    take into size classes on iPad, because of split screen and resizing app windows.
    When in portrait mode, split screen apps are both compact width. In landscape
    mode, the user can size between compact width and regular width.


    For your app, the current launch image will fit on all devices except for iPhones
    in landscape. So you''ll specify a sideways image for compact height.'
