  md: '# Data Persistence


    Depending on what type of data you''re saving, there are different ways of persisting
    your data:


    +   - **UserDefaults:** Use this for saving user preferences for an app. This
    would be a good way to save the ratings.

    - **Property List file:** A macOS and iOS settings file that stores serialized
    objects. Serialization means translating objects into a format that can be stored.
    This would be a good format to store the history data, and you''ll do just that
    in the following chapter.

    - **JSON file:** An open standard text file that stores serialized objects. You''ll
    use this in Section 2.

    - **Core Data:** An object graph with a macOS and iOS framework to store objects.
    For further information, check out our book **Core Data by Tutorials** (https://bit.ly/3ffiStNp).


    # Saving Ratings to UserDefaults


    > Skills you''ll learn in this section: AppStorage; UserDefaults


    UserDefaults is a class that enables storing and retrieving data in a **property
    list** (plist) file held with your app''s sandboxed data. It''s called "defaults"
    because you should only use it for simple app-wide settings. You should never
    store data as your history, which will get larger as time goes on.


    > Open the project in this chapter''s **starter** folder. This is the same as
    the previous chapter''s final project.


    So you''ve used iPad in previews. Remember to test your app just as much using
    iPhone as well. To test persistence, you''ll need to run the app in Simulator
    so that you can examine the actual data on disk.


    > Click the run destination button and select **iPhone 14 Pro.**'
