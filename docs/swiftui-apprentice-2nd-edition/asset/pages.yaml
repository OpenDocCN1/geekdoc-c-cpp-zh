  md: '# Key Points


    +   * Instead of implementing your own photos picker view, Apple provides the
    PhotosUI framework with a PhotosPicker view. It''s an easy way to select photos
    and videos from the photo library.


    +   * Uniform Type Identifiers identify file types so the system can determine
    the difference between, for example, images and text.


    +   * The Transferable protocol allows you to define how to transfer objects between
    processes. You use Transferable for drag and drop, pasting and sharing. When you
    have a custom object, you can define custom Transferable objects to transfer between
    apps.


    +   * A Menu is a list of Buttons. Each Button can have a role. By making the
    role destructive, the menu item will appear in red.


    +   * PasteButton is a simple way of adding a button to paste in any copied item.
    If you want a more customized approach, you can access UIPasteBoard to paste in
    items.


    +   * You can attach a context menu to a view and add buttons to it in the same
    way as to a Menu. You access the context menu by a long press. SwiftUI brings
    the view to the foreground and darkens the other views. This behavior is not what
    you want, you''ll have to create your own custom menu.'
