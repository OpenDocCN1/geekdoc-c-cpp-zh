  md: "In fetchObjects(for:), replace objects.append(object) with this code:\n\n```\n\
    await MainActor.run {\n    objects.append(object)\n}\n```\n\nThis is the only\
    \ line of code that must run on the main thread, so you embed it in a MainActor.run\
    \ closure. You use await to call it asynchronously, so the system can suspend\
    \ and resume execution on the actor.\n\nNote: You can annotate a method with @MainActor\
    \ to ensure it runs on the main thread or annotate a property to ensure it can\
    \ only be updated from the main thread. You can annotate an entire class with\
    \ @MainActor, if all its properties and methods need to be on the main thread,\
    \ mark any exceptions with the nonisolated keyword. Learn more about Swift Modern\
    \ Concurrency from free Modern Concurrency in Swift or courses Modern Concurrency:\
    \ Getting Started (https://bit.ly/3iH528z) and Modern Concurrency: Beyond the\
    \ Basics (https://bit.ly/3vtblsd).\n\nBuild and run the project in a simulator,\
    \ enter a search term:\n\n```\nimport Foundation\n\nclass ThemeStore: ObservableObject\
    \ {\n    @Published var objects: [Any] = []\n    init() {\n        self.service\
    \ = ThemeService()\n    }\n    var maxIndex: Int = 30 {\n        set { maxIndex\
    \ = newValue }\n    }\n\n    func fetchObjects(for query: String) {\n        if\
    \ let objects = try? service.fetchObjects(query: query) { // 1\n            for\
    \ (index, objectID) in objects.enumerated() { // 2\n                if index <\
    \ maxIndex {\n                    if let object = try? service.getObject(objectID)\
    \ {\n                        objects.append(object)\n                    }\n \
    \               }\n            }\n        }\n    }\n}\n```\n\nPurple problem solved.\n\
    \nPurple problem solved! Your app is working perfectly, but there's one last thing..."
