- img_proc: true
  md: '# Swift Dive: Structure vs Class


    At runtime, your app instantiates properties and assigns them to separate areas
    of memory, called the stack and the heap. Value types go on the stack, which the
    CPU manages and optimizes, it''s so fast and efficient. You can instantiate structures,
    enumerations and tuples without counting the cost. The heap, however, is much
    more dynamic and allows to allocate and deallocate areas of memory, while maintaining
    reference counts. This makes allocating types less efficient. When you instantiate
    a class, that piece of data should stick around for a while.


    +   Skills you''ll learn in this section: how to use structures and classes


    When initializing classes and structures in code, they look very similar. For
    example:


    ```

    let iAmAStruct = AStruct()

    let iAmAClass = AClass()

    ```


    The important difference is that iAmAStruct contains immutable data, whereas iAmAClass
    lacks an immutable reference to the data. The data itself is still mutable and
    you can change it.


    ```

    iAmAStruct.number = 10 // compile error

    iAmAClass.number = 10 // no error ~number will update to 10

    ```


    When you assign values, such as a CGPoint, you make a copy. For example:


    ```

    let pointA = CGPoint(x: 10, y: 20)

    var pointB = pointA // make a copy

    pointB.x = 20 // pointA.x is still 10

    ```


    pointA and pointB are different objects.


    With a reference type, you access the same data. For example:


    ```

    let iAmAClass = AClass()

    let iAmAClassToo = iAmAClass

    iAmAClassToo.number = 20 // this updates iAmAClass

    print(iAmAClass.number)   // prints 20

    ```'
