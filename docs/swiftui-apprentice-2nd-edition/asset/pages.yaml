  md: '# How to Read This Book


    This book is designed to take you from zero to hero! Each chapter builds on the
    code and concepts from its predecessors, so you''ll need to work your way through
    them in order. To help you navigate on your journey, here are some conventions
    we use:


    +   - Filenames, text you enter into dialog boxes, items you look for screen all
    appear in **bold**.

    - Names of things you find in your code — such as variables, properties, types,
    protocols and method names — appear in a `monospaced typeface`.

    - The 节 icon indicates an instruction step for you to follow.

    - Quick tips about Xcode are marked with **Xcode Tip**.

    - Quick tips about Swift are marked with **Swift Tip**.

    - Deeper explanations of Swift language topics are marked with **Swift Dive**.

    - Watch for **Skills you''ll learn in this section** to get a quick overview of
    specific new things you''ll learn.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# # Section I: Your First App:

    HIITFit


    At WWDC 2019, Apple surprised and delighted the developer community with the introduction
    of SwiftUI, a declarative way of building user interfaces. With SwiftUI, you could
    build your user interface by combining fundamental components such as colors,
    buttons, text labels, lists and more into more beautiful and functional views.
    Your views react to changes in the data they display, updating automatically without
    any intervention from you!


    In this section, you''ll begin your journey to becoming a SwiftUI developer by
    developing an app called HIITFit, a High Intensity Interval Training Fitness tracker.
    Along the way, you''ll:


    +   - Learn how to use Xcode.

    - Discover how to plan and prototype an app.

    - Explore the basic components of SwiftUI.

    - Understand how data moves in a SwiftUI app and how to make it persist.

    - Learn fundamental concepts of Swift, the programming language, needed to build
    your app.'
  merge: -1
  pgno: 20
- img_proc: true
