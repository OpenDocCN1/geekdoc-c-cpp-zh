  md: '# Key Points


    +   - It''s not possible to spend money on hiring a designer, but you should definitely
    spend time making your app as attractive and friendly as possible. Try various
    designs out and offer them to your testers for their opinions.

    - Neumorphism is a simple style that works well. Keep up with designer trends
