  md: '# Device Resolutions and Image Scale


    iPhone screens have a 1:1 pixel density which means that a 100x100 pixel image
    on screen takes up 100x100 points. iPhone 4 introduced the retina screen. Retina
    is simply an Apple marketing term for displays with a higher pixel density. On
    the iPhone 4 screen, where you can barely see the 100x100 pixel image would take
    up 50 points on screen, having a scale factor of 2. iPhone 6 Plus came along,
    introducing a 3:1 pixel density. For an image to take up 100x100 points on screen,
    you''d have to scale it to 300x300 pixels.


    When you provide bitmap maps, you must provide them for every device resolution.
    However, error-image.svg is a vector format with a native size of 512x512. You
    don''t need to scale it by 2x and 3x as Xcode can do this for you.


    +   * When the image selected, in the Attributes inspector, check Scales from
    Individual Scales to Single Scale.


    ![](img/b137d252894e5c4c3dd508961a85e251_438_0.png)


    Xcode removes the 2x and 3x options in the center panel. When you build for a
    2x resolution device, Xcode will automatically add to your app bundle a 512x512
    optimized bitmap image scaled to the correct 2x resolution. Bundle images are
    held in .car file, the format of which is not publicly available, so you can inspect
    what Xcode has done.'
