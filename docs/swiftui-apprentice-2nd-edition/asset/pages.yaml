  md: '# # Chapter 7: Saving Settings

    By Caroline Begbie


    Whenever your app closes, all the data entered, such as any ratings you''ve set
    or any history you''ve recorded, is lost. For most apps to be useful, they have
    to persist data between app sessions. Data persistence is a fancy way of saying
    "saving data to permanent storage".


    In this chapter, you''ll explore how to store simple data using AppStorage and
    SceneStorage. You''ll save the exercise ratings, and if you get called away mid-exercise,
    your app will remember which exercise you were on and start there, instead of
    at the welcome screen.


    You''ll also learn about how to store data in Swift dictionaries and realize that
    string manipulation is complicated.'
