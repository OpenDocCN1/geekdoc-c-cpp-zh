    # # Wrapping Wrappers


    @State and @Binding are the workhorses of value property wrappers. A view owns

    t value if it doesn''t receive it from any views. In this case, it''s a @State

    property — the single source of truth. When a @State value changes, the view redraws
    itself, resetting

    everything except its @State properties.


    The owning view can pass a @State value to a subview as an ordinary read-only

    value or as a read-write @Binding.


    When you''re prototyping an app and trying to out a subview, you might write it
    as a

    stand-alone view with only @State properties. Later, when you fit it into your
    app,

    just change @State to @Binding for values that come from a parent view.


    Your app can access the built-in @Environment values. An environment value

    persists within the subtree of the view you attach it to. Often, this is simply
    a

    container like VStack, where you use an environment value to set a default font

    size.'
