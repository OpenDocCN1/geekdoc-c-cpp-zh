- img_proc: true
  md: "➤ In TheMetWidget.swift, in the for-loop of getTimeline(in:completion:), change\
    \ the entryDate code to this:\n\n```\nlet entryDate = Calendar.current.date(\n\
    \    Adding: .hour,\n    value: index,\n    to: currentDate!)\n```\n\nYou’re restoring\
    \ the template code's original timing. Now, your widget will add entries one hour\
    \ apart each other. You can add it to your device's home screen with no worries\
    \ about excessive battery use.\n\n➤ Also remove the decoration of the interval,\
    \ as Xcode so helpfully suggests, since you’re no longer using it.\n\n# Refresh\
    \ Policy\n\nIn getTimeline(in:completion:), after the for loop, you create a Timeline(entries:)\
    \ instance. The template sets policy to .atEnd, so WidgetKit creates a new timeline\
    \ after the last date in the current timeline. When you saw the widget was downloading\
    \ a small number of its own objects, the new timeline doesn't start immediately.\n\
    \nOf course, your current timeline fires at 3-second intervals, which is far from\
    \ normal. With a more normal interval, like one hour, you probably won't notice\
    \ any delay.\n\nThere are two other TimelineReload options:\n\n+   - after(_):\
    \ Specify a Date when you want WidgetKit to refresh the timeline. Like atEnd,\
    \ this is more of a suggestion to WidgetKit than a hard deadline.\n- never: Use\
    \ this policy if your app uses WidgetCenter to tell WidgetKit when to reload the\
    \ timeline. This is a good option for TheMet. You've already seen the timeline\
    \ reload almost immediately when you change a query in your app. You could add\
    \ code to your app to call fetchObjects(for:) at the same time every day, and\
    \ this would also refresh your widget’s timeline."
