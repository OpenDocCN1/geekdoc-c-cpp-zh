    of this chapter.


    # Creating an ObservableObject


    To dismiss SuccessView, you used its dismiss environment property. This is one
    of the system''s predefined environment properties. You can define your own environment
    object on a view, and it can be accessed by any subview of that. You don''t need
    to pass it as a parameter. Any subview that needs it simply declares it as a property.


    So, if you make HistoryStore an @EnvironmentObject, you won''t have to pass it
    to WelcomeView just so you can pass it to HistoryView.


    To be an @EnvironmentObject, HistoryStore must conform to ObservableObject. An
    ObservableObject is a publisher.


    > Note: Publishers are fundamental to Apple''s Combine concurrency framework.
    For complete coverage of this framework, check out our book Combine: Asynchronous
    Programming with Swift (https://bit.ly/3sW1L3l).


    And, to conform to ObservableObject, HistoryStore must be a class, not a structure.


    > Swift Tip: Structures and enumerations are value types. If Person is a structure,
    and you create Person object audrey, then audrey2 = audrey creates a separate
    copy of audrey. You can change properties of audrey2 without affecting audrey.
    Classes are reference types. If Person is a class, and you create Person object
    audrey, then audrey2 = audrey creates a reference to the same audrey object. If
    you change a property of audrey2, you also change that property of audrey.


    Kodeco


