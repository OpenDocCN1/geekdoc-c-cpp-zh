    a mechanism to enable views to update it.


    +   - Use @State and @Binding to manage changes to user interface values.


    +   - Access environment values as @Environment view properties or by using the
    environment view modifier.


    +   - Use @StateObject and @ObservedObject to manage changes to data model objects.
    The object type must conform to ObservableObject and should publish at least one
    value.


    +   - If only a few subviews need access to an ObservableObject, instantiate it
    as a @StateObject then pass it in the environmentObject view modifier. Declare
    an @EnvironmentObject property in any subviews that need access to it.


    +   - When prototyping your app, you can use @State and @Binding with structures
    that model your app’s data. When you’ve worked out how data needs to flow through
    your app, refactor your app to accommodate data types that need to conform to
    ObservableObject.


    +   - A commonly used architecture for SwiftUI apps is the Model-View pattern,
    where the model is an ObservableObject. Changes to the model’s published properties
    cause updates to the view.'
