- img_proc: true
  md: "Name the file Exercise.swift. Select the HIITFit group so it doesn't go into\
    \ the Views group:\n\n![](img/b137d252894e5c4c3dd508961a85e251_104_0.png)\n\n\
    Save new file.\n\nIf it ends up in the Views group, drag it out of the group.\n\
    \nIn Exercise.swift, add the following code below import Foundation:\n\n```\n\
    Exercise {\n    let exerciseName: String\n    let videoName: String\n\n    enum\
    \ ExerciseEnum {\n        case squat = \"Squat\"\n        case stepUp = \"Step\
    \ Up\"\n        case burpee = \"Burpee\"\n        case sunSalute = \"Sun Salute\"\
    \n    }\n}\n```\n\n# Enumerating Names\n\nenum is short for enumeration. A Swift\
    \ enumeration is a named type and can have methods and computed properties. It's\
    \ useful for grouping related values so the compiler can help you avoid misspelling\
    \ a string.\n\n> **Swift Tip:** A stored property is one you declare with a type\
    \ and/or an initial value, like let name: String or let name = \"Audrey\". You\
    \ declare a computed property with a type and a closure where you compute its\
    \ value, var body: some View { ... }."
