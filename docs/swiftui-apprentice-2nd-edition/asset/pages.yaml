    ![](img/b137d252894e5c4c3dd508961a85e251_694_0.png)


    Add Object.swift to widget target.


    # # Provider Methods


    Adding the object property to SimpleEntry causes errors in Provider because it
    creates SimpleEntry instances in its methods placeholder(in:), getTime(in:completion:)
    and also in the preview. Provider methods are called by WidgetKit, not by any
    code you write.


    +   - To display your widget for the first time, WidgetKit calls placeholder(in:)
    and applies a redacted(reason: .placeholder) modifier to view the view''s contents.
    This is synchronous: Nothing else can run on its queue until it finishes, don''t
    do network downloads or complex calculations in this method.

    - WidgetKit calls snapshot(in:completion:) whenever the widget is in transient
    state, waiting for data or appearing to the widget gallery.

    - WidgetKit calls getTime(in:completion:) to get an array of time-stamped entries
    to display.'
