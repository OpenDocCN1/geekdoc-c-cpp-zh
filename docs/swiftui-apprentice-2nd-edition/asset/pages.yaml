  md: '# About the Authors


    **Audrey Tam** is an author of this book. A retired computer science academic,
    she''s a technology generalist with expertise in translating new knowledge into
    learning materials. Audrey attends concerts at Tempo Rubato and does most of her
    writing and zooming on Rubato Upstairs. She also enjoys long journeys, knitting,
    and trekking in the Aussie wilderness.


    ![](img/b137d252894e5c4c3dd508961a85e251_18_0.png)


    **Caroline Begbie** is another author of this book. Caroline ventured into the
    world as an unemployed classicist. She taught herself to code and started a software
    company in the UK and later in the US. Retiring to Australia prematurely, she
    performed marionette shows for pre-schools until she purchased the original iPad.
    She recognized the creative possibilities and became an indie iOS developer. Now
    she loves tinkering with vertices and watching Disney movies.


    ![](img/b137d252894e5c4c3dd508961a85e251_18_1.png)


    # About the Editors


    **Libranner Santos** is the tech editor on this book. He''s a software engineer
    with more than 10 years of experience. Basketball fan and player, a decent dancer.
    Love learning and teaching at all levels. You can follow him on Twitter at @libranner.


    ![](img/b137d252894e5c4c3dd508961a85e251_18_2.png)


    **Richard Critz** did double duty as editor and final pass editor for this book.
    He has been doing software professionally for over 40 years, working on products
    as diverse as CNC machinery, network infrastructure, and operating systems. He
    discovered the joys of working with iOS beginning with iOS 6. He dates back to
    punch cards and paper tape. He''s a dinosaur; just ask his kids.


    ![](img/b137d252894e5c4c3dd508961a85e251_18_3.png)'
  merge: -1
  pgno: 18
