  md: 'SwiftUI Apprentice


    The editor has browser features tab and go back/forward. Keyboard shortcuts for
    tabs are the same as for web browsers: Command-T to open a new tab, Shift-Command-[
    or -] to move to the previous or next tab, Command-W to close the tab and Option-click
    a tab''s close button to close all the other tabs. The back/forward button shows
    a list of previous/next files, but the keyboard shortcuts are Control-Command-right
    or -left arrow.


    # Inspectors


    The Inspectors pane has three, four or five tabs, depending on what''s selected
    in the Project navigator. When this pane is hidden, you can open it in one of
    its tabs by pressing Option-Command-1 to Option-Command-5:


    ![](img/b137d252894e5c4c3dd508961a85e251_31_0.png)


    +   1. File: Name, Full Path, Target Membership.


    +   2. History: Source Control log.


    +   3. Quick Help: Short form of Developer Documentation if you select a symbol
    in the editor.


    +   4. Accessibility: Accessibility information if you select a symbol in the
    preview.


    +   5. Attributes: Properties of the symbol you select in the editor.


    All five tabs appear when you select a file in the Project navigator. If you select
    a folder, you get only the first three tabs. If you select Assets.xcassets, you
    don''t get the accessibility tab.


    This tour brushes the surface of what you can do in Xcode. Next, you''ll use a
    few of its tools while you explore your new project.


    # Navigation Settings


    In this book, you''ll use keyboard shortcuts to examine and structure your code.
    Unlike the fixed keyboard shortcuts for opening navigator tabs or inspectors,
    you can specify settings for what shortcut does what. To avoid confusion while
    working through this book, you''ll adjust your settings to match the instructions
    you''ll see.


    Kodeco


