- img_proc: true
  md: "InChanged(_), you update transform with the user's drag translation amount\
    \ and include any previous dragging.\n\nOnEnded(_), you replace the old previousOffset\
    \ with the new offset, ready for the next drag. You don't need to use the value\
    \ provided, so you use _ as the parameter for the action method.\n\n+   Try it\
    \ out in the live preview again.\n\nThis works well. You can drag your view around\
    \ and position it wherever you want.\n\nThe CGSize code is a bit long-winded,\
    \ with having to do the math on both width and height. You can shorten this code\
    \ by overloading the + operator.\n\n# Operator Overloading\n\nOperator overloading\
    \ is what you redefine what operators as +, -, * and /.\n\nTo add translation\
    \ to offset, you must add width to width, and at the same time, add height to\
    \ height. To do this, you redefine + with new method.\n\n+   Create a new Swift\
    \ file called Operators.swift. Any time you want to overload an operator for a\
    \ particular type, you can add the method in this file.\n\n+   Replace the code\
    \ with the new method:\n\n```\nimport SwiftUI\nfunc :(left: CGSize, right: CGSize)\
    \ -> CGSize {\n    width: left.width + right.width,\n    height: left.height +\
    \ right.height\n}\n```\n\nHere you specify what the + operator should do for a\
    \ CGSize type. The parameters are left and right, which are the items to the left\
    \ and right of the + sign. You return the new CGSize.\n\nThis is a simple example\
    \ of how you want the + sign to work for CGSize. It makes sense here to add the\
    \ width and height together. However, you can redefine this operator to do anything,\
    \ and you should be very careful that the method makes sense. Don't do things\
    \ like redefining a multiply to do division!"
