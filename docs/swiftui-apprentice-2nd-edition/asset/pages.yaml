  md: "Here, you create an enumeration for the four exercise names. The case names\
    \ are camelCase: If you start typing ExerciseEnum.sunSalute, Xcode will suggest\
    \ the auto-completion.\n\nBecause this enumeration has String type, you can specify\
    \ a String as the raw value of each case. Here, you specify the title-case version\
    \ of the exercise name, like \"Sun Salute\" for sunSalute. Then ExerciseEnum.sunSalute.rawValue\
    \ is \"Sun Salute\".\n\n# Creating an Array of Exercise Instances\n\nUse your\
    \ enumeration to create your exercises array, with this code:\n\n+   Below Exercise,\
    \ create mistakenly outside its boxes,\n\n```\nextension Exercise {\n    static\
    \ let exercises = [\n        Exercise(\n            exerciseName: ExerciseEnum.squat.rawValue,\n\
    \            videoName: \"squat\"),\n        Exercise(\n            exerciseName:\
    \ ExerciseEnum.stepUp.rawValue,\n            videoName: \"step-up\"),\n      \
    \  Exercise(\n            exerciseName: ExerciseEnum.burpee.rawValue,\n      \
    \      videoName: \"burpee\"),\n        Exercise(\n            exerciseName: ExerciseEnum.sunSalute.rawValue,\n\
    \            videoName: \"sun-salute\"\n        )\n    ]\n}\n```\n\n# Swift Tips:\
    \ Type Property, Array Literal, Type Extension\n\nIn an extension to Exercise,\
    \ you initialize the exercises array as a type property.\nexerciseName and videoName\
    \ are instance properties: Each Exercise instance has its values for these properties.\
    \ A type property belongs to you, and you declare it with the static keyword.\
    \ The exercises array doesn't belong to an Exercise instance. There's only one\
    \ exercise no how many Exercise instances you create. You access it with the type\
    \ name: Exercise.exercises.\n\nYou create exercises with an array literal: a comma-separated\
    \ list of values, enclosed in square brackets. Each value is an instance of Exercise,\
    \ supplying the raw value of an enumeration and the corresponding video file name."
