  md: '# Build & Run


    ➤ Click the run button or press Command-R.


    The first time you run a project on a simulated device, it starts from an "off"
    state, so you''ll see a loading indicator. Until you quit the Simulator app, this
    particular device is now "awake", so you won''t get the startup delay even if
    you run a different project on it.


    After the simulated device starts up, the app''s launch screen appears. For MyFirst,
    this is just a blank screen. You''ll learn how to set up your own launch screen
    in Chapter 16, "Adding Assets to Your App".


    And now, your app is running!


    ![](img/b137d252894e5c4c3dd508961a85e251_58_0.png)


    Debug navigator, debug area and running app


    There''s not much happening in this app, but the debug toolbar appears below the
    editor window. In this screenshot, I showed the debug area, selected the Debug
    tab in the Project navigator pane, then selected the CPU item.


    In the following chapters, you''ll create a much more interesting app.'
