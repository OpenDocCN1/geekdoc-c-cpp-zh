  md: 'An alternative scenario is to use composition with protocols, where you add
    only relevant properties to an object. This means that you can hold your data
    in structures.


    This diagram shows a CardElement protocol with ImageElement and TextElement structures.
    It also shows a possible expansion if you want to include a new ColorElement.
    This would be much harder with inheritance.


    | Card Element | Colorized |

    | --- | --- |

    | transform | color |


    | ImageElement | TextElement | ColorElement |

    | --- | --- | --- |

    | transform image | transform text | transform |

    | | color | color |


    Traditionally, inheritance is considered to be an "is a" relationship, while composition
    is a "has a" relationship. But, you should avoid tightly-coupled objects as much
    as you can, and composition gives you much more freedom in design.


    # # Protocols


    > Skills you''ll learn in this section: create protocol; conform structures to
    protocol; protocol method


    You''ve used several protocols so far — such as View and Identifiable — and, possibly,
    slightly mismatched as to what they actually are.


    Protocols are like a contract. You create a protocol that defines requirements
    for a structure, a class or an enumeration. These requirements might include properties
    and whether they are read-only or read-write. A protocol might also define a list
    of methods that any type adopting the protocol must include.'
