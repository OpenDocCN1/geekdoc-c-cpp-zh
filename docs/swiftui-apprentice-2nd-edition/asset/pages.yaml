  md: 'For most apps, ContentView.swift is just the starting point. Often, ContentView
    only defines the app''s organization, orchestrating several subviews. And usually,
    you''ll define these subviews in separate files.


    # Creating a New SwiftUI View File


    Everything you see in a SwiftUI app is a View. Apple encourages you to create
    many subviews as you need in order to avoid redundancy and organize your code
    to keep it manageable. The compiler takes care of creating efficient machine code
    so your app''s performance won''t suffer.


    +   In the Project navigator, select ContentView.swift and press Command-N. Alternatively,
    right-click ContentView.swift then select New File... from the menu.


    ![](img/b137d252894e5c4c3dd508961a85e251_39_0.png)


    Select New File... from right-click menu.


    > **Xcode Tip:** A new file appears in the Project navigator below the currently
    selected file. If that''s not where you want it, drag it to where you want it
    to appear in the Project navigator.'
