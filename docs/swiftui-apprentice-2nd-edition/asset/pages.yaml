  md: '# WWDC


    Every June, Apple holds the 5-day World Wide Developers Conference — WWDC, often
    pronounced dub-dub-dee-cee or shortened to dub-dub. The keynote on day 1 shows
    all the features planned for the new versions of iOS, macOS and all the other
    OSes. These launch later in the year, around September or October.


    For iOS developers, the more important presentation is the Platforms State of
    the Union later day 1, where you get your first look at the APIs for adding these
    new features to your apps, as well as improvements to developer tools like Xcode.
    During the rest of the week, you can watch presentations that introduce and dive
    deeper into the new features.


    Apple provides the multi-platform Apple Developer app (https://apple.com/3eofls1),
    where you can watch WWDC videos and download your favorites.


    ![](img/b137d252894e5c4c3dd508961a85e251_337_0.png)


    If you’re a pay member of the Apple Developer Program, you can download the beta
    versions of Xcode and the operating systems and immediately start exploring all
    the new things. Your goal is to include the new features in new or existing apps,
    and set to get into the App Store before the new iOS launches.


    A word of caution: The WWDC presenters use a special-house version of Xcode. It’s
    different from the Xcode beta you can download, not everything in the presentations
    actually works in beta 1. Or beta 2. Or ever. Details of the API often change
    by the time Apple releases the final version, and some promised features get postponed
    or quietly disappear.'
