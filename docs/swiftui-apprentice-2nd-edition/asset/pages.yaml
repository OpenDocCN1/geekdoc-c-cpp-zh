  md: '# # Chapter 11: Managing DatanWith Property Wrappers


    By Audrey Tam


    In your SwiftUI app, every data value or object that can change needs a single
    source of truth and a mechanism to enable views to change or observe it. SwiftUI''s
    property wrappers enable you to declare how each view interacts with mutable data.


    In this chapter, you''ll review how you managed data values and objects in HIITFit
    with @state, @Binding, @Environment, ObservableObject, @StateObject and @EnvironmentObject.
    And, you''ll build a simple app that lets you focus on how to use these property
    wrappers. You''ll also learn about TextField, the environment modifier and property
    wrappers @observedObject and @FocusState.


    To help answer the question "struct or class?", you''ll see why HistoryStore should
    be a class, not a structure and learn about the natural architecture for SwiftUI
    apps: the Model-View-ViewModel pattern.'
