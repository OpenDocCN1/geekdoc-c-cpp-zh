  md: '# Supporting Multiple View Types


    Skills you''ll learn in this section: picker control


    You''ll add a picker to the top of the list of cards to choose how you view the
    cards. You can either view them in the scrolling list or a carousel. When you
    have a set of mutually exclusive values, you can use a picker control to decide
    between them.


    There are various picker styles for mutually exclusive picking. For example, WheelPickerStyle
    shows the options in a scrollable wheel. Apple''s Clock app uses a wheel picker
    for the Timer. You''ll use a SegmentedPickerStyle, which is a horizontal control
    that holds one value at a time.


    ![](img/b137d252894e5c4c3dd508961a85e251_596_0.png)


