  md: '# Key Points


    +   - Even though your app works, you''re not finished until your app is fun to
    use. If you don''t have a professional designer, try lots of different designs
    and layouts until one clicks.


    +   - Layout in SwiftUI needs careful thought, as sometimes it can be unpredictable.
    The golden rule is that views take their size from their children.


    +   - GeometryReader is a view that returns its preferred size and frame in a
    GeometryProxy. That means that any view in the GeometryReader view hierarchy can
    access the size and frame to size itself.


    +   - Stacks have alignment capabilities. If these aren''t enough, you can create
    your own custom alignments, too. The Apple video, Building Custom Views with SwiftUI
    (https://apple.com/39uamSx), examines SwiftUI''s layout system in depth.'
