- img_proc: true
  md: "# Swift Dive: Protocols With Associated Types\n\nProtocols with associated\
    \ types (PATs) are advanced black magic Swift, and if you haven't done much programming\
    \ with generics, the subject will take some time to learn and absorb. Apple APIs\
    \ use them everywhere, so it's useful to have an overview.\n\nShape inherits from\
    \ View, and this is how View is defined:\n\n```\npublic protocol View {\n    associatedtype\
    \ Body : View\n    @Builder var body: Self.Body { get }\n}\n```\n\nassociatedType\
    \ makes a protocol. When you create a structure that conforms to View, the requirement\
    \ is that you have a body property, and you tell the View real to substitute.\
    \ For example:\n\n```\nstruct ContentView {\n    var body: some View {\n     \
    \   EmptyView()\n    }\n}\n```\n\nIn this example, body is of type EmptyView.\n\
    \nEarlier, you created the protocol CardElement. This doesn't use an associated\
    \ type, and so you were able to set up an array of type CardElement. This is how\
    \ you define CardElement:\n\n```\nprotocol CardElement {\n    var id: UUID { get\
    \ }\n    var transform: Transform { get set }\n}\n```\n\nAll of the properties\
    \ in CardElement are existential types. That means they are types in their own\
    \ right and not generic. however, you might have a requirement for id to be either\
    \ a UUID or an Int or a String. In that case you can define CardElement with a\
    \ generic type of ID:\n\n```\nprotocol CardElement {\n    associatedtype ID\n\
    \    var id: ID { get }\n    var transform: Transform { get set }\n}\n```"
  merge: -1
  pgno: 509
- img_proc: true
  md: "When you create a structure conforming to CardElement, you tell it what type\
    \ ID actually is. For example:\n\n```\nstruct NewElement {\n  let id = Int.random(in:\
    \ 0...1000)\n  var transform = Transform()\n}\n```\n\nIn this case, whereas the\
    \ CardElement ids are of type UUID, this id is of type Int.\n\nOnce a protocol\
    \ has an associated type, because it is now a generic, the protocol is no longer\
    \ an existential type. The protocol is constrained to using another type, and\
    \ the compiler doesn't have any information about what type might actually be.\
    \ For this reason, you can't set up an array containing protocols with associated\
    \ types, such as View or Shape.\n\nGoing back to the code at the start of this\
    \ section which doesn't compile:\n\n```\nstatic let shapes: [Shape] = [Circle(),\
    \ Rectangle()]\n```\n\nEven though Circle and Rectangle both conform to Shape,\
    \ they are Shapes with different associated types, and as such, you can't put\
    \ them in the same Shape array.\n\n# Type Erasure\n\nYou are able to place different\
    \ views in an array by converting the View type to AnyView.\n\n```\n// does not\
    \ compile\nlet views: [View] = [Text(\"Hi\"), Image(\"giraffe\")\n// does compile\n\
    let views: [AnyView] = [\n  AnyView(Text(\"Hi\")),\n  AnyView(Image(\"giraffe\"\
    ))\n]\n```\n\nAnyView is a type-erased view. It takes in any type of view and\
    \ passes back an existential, non-generic type of AnyView.\n\nSimilarly, Apple\
    \ provides AnyShape."
