- img_proc: true
  md: '# Managing Your App’s Data


    SwiftUI has two guiding principles for managing how data flows through your app:


    +   - **Data access = dependency**: Reading a piece of data in your view creates
    a dependency for data in that view. Every view is a function of its data—it operates
    or state.


    +   - **Single source of truth**: Every piece of data that view reads a source
    of truth, which is either *owned* by the view or *external* to the view. Regardless
    of where the source of truth lies, you should always have a _single source of
    truth.


    # Tools for Data Flow


    SwiftUI provides several tools to help manage the flow of data in your app. The
    SwiftUI framework takes care of creating views when they should appear and updating
    them whenever there’s a change to data they depend on.


    Property wrappers augment the behavior of properties. SwiftUI-specific wrappers
    like @State, @Binding, and @EnvironmentObject declare a dependency on the data
    represented by the property.


    ![](img/b137d252894e5c4c3dd508961a85e251_150_0.png)'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Each wrapper indicates a different source of data:


    +   - @State property is a source of truth. One view owns it and passes either
    its value or a reference, known as a binding, to its subviews.


    +   - @Binding property is a reference to a @State property owned by another view.
    It gets its initial value when the other view passes a binding, using the $ prefix.
    Having this reference to the source of truth enables the subview to change the
    property''s value, and this changes the state of any view that depends on it


    +   - @Environment declares dependency on some state data — that''s visible to
    all views in a sub-tree of the app. It''s a convenient way to pass data indirectly
    instead of passing data from view to grandchild, especially if the in-between
    child doesn''t need it.


