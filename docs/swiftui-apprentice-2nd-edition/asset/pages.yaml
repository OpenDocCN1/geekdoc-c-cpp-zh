  md: "# Uniform Type Identifiers\n\nUniform Type Identifiers, or UTIs, identify file\
    \ types. For example, JPG is a standard UTI, with the identifier public.jpeg.\
    \ It's a subtype of the base image type public.image.\n\npublic.text encompasses\
    \ all text data, including public.plainText and public.rtf.\n\nMost apps have\
    \ associated data types. For example, when you right-click a macOS file and choose\
    \ Open With, the menu presents you with all the apps associated with that file's\
    \ format. When you right-click a .png file, you might see a list like this:\n\n\
    ![](img/b137d252894e5c4c3dd508961a85e251_471_0.png)\n\nThese are the apps that\
    \ are able to open .png files.\n\nThere are many standard system UTIs which you\
    \ can find at https://apple.co/3ASdXd.\n\nIf you have a custom data format, you\
    \ can create your own type in a UTType\n\n```\nextension UTType {\n    static\
    \ var myType: UTType =\n    { UTType(exportedAs: \"com.kodeko.myType\") }\n}\n\
    ```\n\npublic.data is a base type representing a stream of bytes. Using this type,\
    \ you can load the photos as a data stream and then convert the data to a UIImage."
  merge: -1
  pgno: 471
- img_proc: true
  md: "# Adding Photos to Your App\n\nStill in PhotosModal.swift, in the for loop,\
    \ replace print (item) with:\n\n```\nitem.loadTransferable(type: Data.self) {\
    \ result in\nTask {\n    // create a UIImage\n}\n```\n\nYou load the item as a\
    \ Data type. result is of type Result<Success, Failure>. Success contains the\
    \ image data, and Failure contains a failure value.\n\nFor each item, you load\
    \ the image on a background thread using Task {}.\n\nReplace // create a UIImage\
    \ with:\n\n```\nswitch result {\ncase .success(let data):\n    let uiImage = UIImage(data:\
    \ data) {\n    card.addElement(uiImage: uiImage)\n}\ncase .failure(let failure):\n\
    \    fatalError(\"Image transfer failed: \\(failure)\")\n}\n```\n\nIf the result\
    \ succeeds, use the data to create a UIImage and add that image to the card's\
    \ element array. If the result fails, produce a fatal error.\n\n> Note: At time\
    \ of writing, the simulator pink flowers photo in HEIC format causes an error.\
    \ This appears to be an Apple bud, but it gives you the chance to make sure that\
    \ your PhotosPicker error checking works. When you run your app in Simulator and\
    \ choose that photo, in the console, you should see Fatal error: Image transfer\
    \ failed: with information about the failure. HEIC format files will work on a\
    \ device with your own photos."
