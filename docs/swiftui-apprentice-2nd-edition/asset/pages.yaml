  md: '# Platforms


    Using SwiftUI to build new iOS apps makes it easier to create similar apps on
    Apple’s other platforms: macOS, watchOS and tvOS. It’s not that your iOS app will
    “just work” on another platform. It probably won’t.


    You can use many SwiftUI views on other platforms, but how they look or function
    might be a little different. And platforms have views that don''t exist for iOS.
    Also, some features of your iOS app won''t make sense on a stationary platform
    like tvOS or on a smaller screen like watchOS.


    But, the way you assemble a SwiftUI app remains the same, no matter what platform
    you’re targeting. Apple expresses this way: Learn once, apply anywhere.


    **Mac Catalyst** is Apple’s program to make it easier to create a native Mac app
    from an iPad app. You turn on Mac Catalyst in the iPad app’s project settings,
    then modify the user interface to be Mac-like. Some user experience, and some
    iPad frameworks just aren''t available in macOS. Your code controls what to include
    using this compiler directive:


    ```

    #if targetEnvironment(macCatalyst)

    ...

    endif

    ```


    Check out Apple’s tutorial for Mac Catalyst (https://apple.com/3qPaen7). For an
    even in-depth look, browse our book Catalyst by Tutorials (https://bit.ly/32ppGwM).


    > **Note: About Apple Silicon?** Apple’s program to design and manufacture its
    own Mac processors. Since its launch in 1984, the Mac has used Motorola 68000,
    PowerPC and Intel CPU chips. The Apple M1 Chip integrates Apple CPU with its GPU,
    neural engine and more. You can install Rosetta 2 on an Apple Silicon Mac to run
    apps written for Intel Macs.'
