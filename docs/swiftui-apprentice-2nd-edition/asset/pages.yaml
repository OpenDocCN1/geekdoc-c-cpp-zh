  md: '# Key Points


    Declare SwiftUI views in the order you want them to appear.


    +   - Create separate views for your user interface elements. This makes your
    code easier to read and maintain.


    +   - Put each view modifier on its own line. This makes it easy to move or delete
    a modifier.


    +   - Xcode and SwiftUI auto-suggestions and default values are often what you
    need.


    +   - Let Xcode help you avoid errors: Use the Command-menu to embed or extract
    views.


    +   - The SF Symbols app and Xcode''s Symbols Library provide icon images you
    can configure like text.


    +   - Preview variants make it easy to check your interface for different user
    settings.


    +   - An enumeration is a named type, useful for grouping related values so the
    compiler can help you avoid mistakes like misspelling a string.


    +   - Swift is a strongly typed programming language.


    +   - GeometryReader enables you to set a view''s dimensions relative to the screen
    dimensions.


