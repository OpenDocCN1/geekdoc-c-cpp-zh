  md: "# Providing a Timeline Of Entries\n\nThe heart of your widget is the Provider\
    \ method getTime(in:completion). It delivers an array of time-stamped entries\
    \ for WidgetKit to display. The template creates an array of entries every one\
    \ hour apart:\n\n```\nlet currentDate = Date()\nfor hourOffset in 0..<5 {\n  \
    \  let entryDate = Calendar.current.date(\n        adding: .hour,\n        value:\
    \ hourOffset,\n        to:currentDate)!\n    let entry = SimpleEntry(\n      \
    \  object: Object.sample(isPublicDomain: true)\n    )\n    entries.append(entry)\n\
    }\n```\n\nThis code creates each entry with the same Object.sample. You'll modify\
    \ the method so it displays items in the app's objects array. Waiting an hour\
    \ between entries is no good for testing purposes, so you'll shorten the interval\
    \ to a few seconds.\n\nFirst, you must populate your objects array.\n\n# Creating\
    \ a Local TheMetStore\n\nThe quickest way — fewest lines of code — to get objects\
    \ is to create an instance of TheMetStore in the widget.\n\n+   * In TheMetWidget.swift,\
    \ add these properties to Provider:\n\n```\nlet store = TheMetStore(6)\nlet query\
    \ = \"persimmon\"\n```\n\nWhile debugging, you limit the number of downloaded\
    \ objects to a small number. You set the query term to something that returns\
    \ objects with distinct titles."
