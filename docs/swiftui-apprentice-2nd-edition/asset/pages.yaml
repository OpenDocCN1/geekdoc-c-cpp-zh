  md: "# Transitioning From List to Card\n\nSkills you'll learn in this section: full\
    \ screen modal\n\nWhen you tap a card in the scrolling in CardsListView, you want\
    \ to show SingleCardView. You can achieve this in several ways:\n\n+   - Replace\
    \ CardsListView in the view hierarchy. With this option, when you return to the\
    \ thumbnails after editing the card, you'd lose your current scrolling position\
    \ in the cards list.\n- Use a NavigationStack with a NavigationLink destination\
    \ that pushes SingleCardView to the front. You'll learn about NavigationStack\
    \ in your third app in Section III.\n- Present a full screen modal. The view slides\
    \ up from the bottom and covers the whole screen. This is the option you will\
    \ use here.\n- By toggling a view property, you can show SingleCardView in a new\
    \ layer in front of CardsListView. This is the best option if you need a different\
    \ transition to the modal's side from the bottom. It is, however, more complex\
    \ to implement, as you have to pass the state property to other subviews.\n\n\
    # Creating a Full Screen Modal View\n\nIn CardsListView, create a new property\
    \ to track the modal presentation:\n\n```\n@State private var isPresented = false\n\
    ```\n\nAdd a new modifier to ScrollView:\n\n```\n.fullScreenCover(isPresented:\
    \ $isPresented) {\n    SingleCardView()\n}\n```\n\nWhen isPresented is true, you'll\
    \ show SingleCardView as a full screen modal."
