  md: 'Here you create a horizontal stack with two Text views. The second Text has
    padding.


    ![](img/b137d252894e5c4c3dd508961a85e251_556_0.png)


    Laying out views


    The view tree is now:


    ```

    LayoutView > HStack > Text (modified) > Red

    > Text (modified) > Padding (modified) > Red

    > Gray

    ```


    LayoutView still has the fixed size of 500 by 300 points. HStack presents 500
    by its children. The first Text returns the space it needs, the second text has
    a padding modifier, so returns its space plus the padding. HStack takes up only
    the space required by its two children HStack''s default padding between the two
    views. HStack''s gray background color fills out the space taken up by HStack
    underneath the two Text views.


    Every time you add a modifier, you create a new layer in the view hierarchy. But
    don''t worry about the efficiency of this — SwiftUI views are lightweight and
    adding new views is incredibly fast.


    # The Frame Modifier


    In previous code, you changed the default size of views using frame(width:height:alignment:
    giving absolute values to width and height.


    When you want to lay out views relative to parent view sizes, you can specify
    minimum and maximum widths and heights using frame(minWidth:idealWidth:maxWidth:minHeight:idealHeight:maxHeight:alignment:).'
