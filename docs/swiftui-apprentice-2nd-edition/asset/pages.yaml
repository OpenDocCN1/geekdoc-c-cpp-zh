  md: '# Stack Alignment


    You can specify an alignment value for any kind of stack, but they all use different
    alignment values. VStack alignment values are horizontal: leading, center or trailing.
    HStack alignment values are vertical: top, center, bottom, firstBaseline or lastBaseline.


    To specify the alignment of a ZStack, you must set both horizontal and vertical
    alignment values. You can either specify separate horizontal and vertical values,
    or a combined value like topTrailing.


    +   - Replace ZStack with this:


    ```

    ZStack(alignment: .topTrailing) {

    ```


    You set the ZStack alignment parameter to position the button in the top right
    corner of the view. Other views in the ZStack have their own alignment values,
    and the ZStack alignment value does not affect them.


    The button is now visible, but it''s small and a little too close to the corner
    edges.


    +   - Add these modifiers to the Button to adjust its size and position:


    ```

    .font(.title)

    .padding(.trailing)

    ```


