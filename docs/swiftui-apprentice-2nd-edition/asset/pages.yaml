    \ new enumeration to HistoryStore:\n\n```\nenum FileError: Error {\n    case loadFailure\n\
    \    case saveFailure\n}\n```\n\nThese are the two errors that you'll check for.\n\
    \nTo create a method that raises an error, you mark it with throws and add a throw\
    \ statement.\n\n+   Add this new method to HistoryStore:\n\n```\nfunc load() throws\
    \ {\n    throw FileError.loadFailure\n}\n```\n\nHere, you'll read the history\
    \ from a file on disk. Currently, this method always raises an error, but you'll\
    \ come to it later when you are loading the code. When you throw an error, the\
    \ method returns immediately and doesn't execute any following code. It's the\
    \ caller that should handle the error, not the throwing method.\n\n# Swift Dive:\
    \ do...catch\n\nTo handle an error from a throwing method, you use the expression:\n\
    \n```\ndo {\n    try methodThatThrows()\n} catch {\n    // take action on error\n\
    }\n```"
