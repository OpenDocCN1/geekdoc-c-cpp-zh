    \ the closure syntax. Instead, you can create a new method in CardElement to replace\
    \ it.\n\n+   * In CardElement.swift, under the protocol declaration, add a new\
    \ method in an extension:\n\n```\nextension CardElement {\n  func index(in array:\
    \ [CardElement]) -> Int? {\n    array.firstIndex { $0.id == id }\n  }\n}\n```\n\
    \nThis method takes in an array of CardElement and passes back the index of the\
    \ element. If the element doesn't exist, it passes back nil. The way you'll use\
    \ it is:\n\n```\nlet index = element.index(in: card.elements)\n```\n\nThis is\
    \ a lot easier to read than the earlier code, and the complicated closure syntax\
    \ is abstracted away in index(in:). Any type that conforms to CardElement can\
