  md: "# Decoding What You Need\n\nIn 19, \"Saving Files\", saw how easy it is to\
    \ encode and decode the Team structure as JSON because all its properties are\
    \ Codable. You were saving and loading your own data model, so item names and\
    \ structure in JSON format exactly matched your Team structure.\n\nJSON values\
