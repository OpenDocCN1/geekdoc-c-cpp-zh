    # Decoding JSON


    If there''s a good match between your data model and a JSON value, the default
    init() of JSONDecoder is poetry in motion, letting you decode complex structures
    of arrays and dictionaries in a single line of code. However, some APIs use deeply-nested
    JSON structures that you probably won''t want to replicate in your app. Then,
    you''ll need to use CodingKey enumerations and custom init(from:) methods.


