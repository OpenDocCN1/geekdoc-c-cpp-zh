  md: 'Tap Turn On to acknowledge the reduction in security protection in exchange
    for allowing Xcode and other tools to execute code, enter your device passcode
    when prompted.


    Your device is now ready to install and run apps from Xcode. After enabling Developer
    Mode, Xcode doesn''t ask again unless disable it by turning off the switch in
