  md: 'SwiftUI Apprentice Chapter 20: Delightful UX — Layout


    Before .background(Color.gray), add this:


    ```

    .frame(maxWidth:.infinity)

    ```


    The HStack now tells its parent that it wants the maximum available width, with
    its gray color, expands to the whole width of the view.


    ![](img/b137d252894e5c4c3dd508961a85e251_557_0.png)


    Maximum width


    Remember your earlier problem with the background color only taking up the width
    of the ScrollView? Specifying a frame with maxWidth and maxHeight of infinity
    would be one of filling up the entire available background.


    > Note: If you want to visualize how much space takes up, try adding .background(Color.red.clipped())
    as a modifier to the various views. You clip the color, as the background can
    sometimes render outside the view frame.


    # Views That use Their Parents'' Size


    Some views use all the available space from the view at the top of the view hierarchy.
    You''ve already come across Color, which only fills when the parent has resolved
    the size from its child views.


    Lazy views fill the vertical or horizontal space, depending on the type of view,
    of the top level view. These views are finalized late, as their content is only
    loaded when it is necessary.


    Kodeco 558'
