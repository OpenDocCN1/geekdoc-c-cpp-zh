  md: '# Developer Programs


    So what are the three types of Developer?


    Apple Developer:


    +   - No annual fee.

    - Access to documentation and videos.

    - Free provisioning to install Xcode projects on your devices: Xcode creates a
    provisioning profile that lets you install a few apps. The provisioning profile
    expires after seven days, so the apps will stop working on your device. Simply
    delete the profile and reinstall your app.


    Apple Developer Program (https://apple.co/3emR2ur):


    +   - Annual fee approximately equivalent to US$99 in your currency.

    - Access to beta operating systems and applications.

    - A web interface for managing your certificates, identifiers and profiles.

    - Access to App Store Connect: Distribute your beta apps to testers with TestFlight;
    submit your apps to the App Store and access App Analytics.

    - During virtual WWDC: You can request a lab appointment or post forum questions
    to Apple engineers at WWDC content. When in-person WWDCs resume, you can register
    for the ticket lottery.


    What if you have apps in the App Store but you don''t renew your membership?

    Here''s Apple''s answer:


    > Expired Memberships: If your Apple Developer membership expires, your apps will
    no longer be available for download and you will not be able to submit new apps
    or updates. You will lose access to pre-release software, Certificates, Identifiers
    & Profiles, and Technical Support Incidents.


    Apple Enterprise Program is for companies that want to distribute apps only to
    employees. The fee is US$299 or equivalent per year. Enterprise apps aren''t submitted
    to the App Store so don''t have to comply with Apple''s requirements. there are
    a lot of legal requirements (https://apple.co/3coUHVU), and it''s probably easier
    to just use TestFlight.'
