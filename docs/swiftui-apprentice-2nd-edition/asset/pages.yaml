  md: '# Key Points


    +   - Use value types in your app almost exclusively. However, use a reference
    type for persistent stored data. Your stored data should be in one central place
    in your app.


    +   - When designing a data model, make it as flexible as possible, allowing for
    new features in future releases.


    +   - Use protocols to describe behavior. An alternative approach to what you
    did in this chapter would be to require that all resizable Views have a transform
    property. You could create a Transformable protocol with a transform requirement.
    Any resizable view must conform to this protocol.


    +   - You had a brief introduction to generics in this chapter. Generics are pervasive
    throughout Apple''s APIs and part of why Swift is so flexible, even though it
    is strongly coupled. Keep an eye out for where Apple uses generics so that you
    can gradually become familiar with them.


    +   - When designing an app, consider how you''ll implement CRUD. In this chapter,
    implemented Read and Update. Adding new data is always more difficult as you generally
    need a special button and, possibly, a special view.


    # Where to Go From Here?


    You covered a lot of Swift theory in this chapter. Our team''s book Swift Apprentice
    (https://bit.ly/3ZRRWL) contains more information about how and when to use value
    and reference types. It also covers generics and protocol oriented programming.


    If you''re still confused about when to use class inheritance and OOP, watch this
    classic WWDC video (https://apple.com/3k9GUEM) where the protagonist, Crusty,
    firmly declares "I don''t do object-oriented".'
