- img_proc: true
  md: "# Making an Enumeration Identifiable\n\nOpen **ToolbarSelection.swift** and\
    \ conform ToolbarSelection to Identifiable:\n\n```\nenum ToolbarSelection: CaseIterable,\
    \ Identifiable {\n```\n\nAs you already know, to conform to Identifiable, you\
    \ have to provide an id.\nAdd the id to ToolbarSelection:\n\n```\nvar id = UUID()\n\
    ```\n\nYou'll immediately get a compiler error, saying \"Enums must not contain\
    \ stored properties\". Remember that you can't make a copy of an enumeration by\
    \ instantiating it, so you can't add vars to an enumeration. Yet, you need to\
    \ include var id in order to conform to Identifiable.\n\n# Making an Object Hashable\n\
    \nYou need a value that uniquely identifies an object. That describes a **hash\
    \ value**. Hashing algorithms calculate values from any data to provide a digital\
    \ fingerprint that identifies an object.\n\nFortunately, enumerations automatically\
    \ conform to Hashable, which provides a hash value.\n\n+   Replace `var id = UUID()`\
    \ with:\n\n```\nvar id: Int {\n    hashValue\n}\n```\n\nInstead of a stored property,\
    \ this var is a computed property. Now, when you create a ToolbarSelection object,\
    \ each object will have a different ID calculated from the enumeration's hash\
    \ value."
  merge: -1
