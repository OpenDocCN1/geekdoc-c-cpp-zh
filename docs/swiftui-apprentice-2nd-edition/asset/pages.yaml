  md: '# When Xcode Behaves Strangely


    Xcode is a hugely complex app, and sometimes it needs a nudge or something

    stronger to "clear its head".


    Here are the escalating levels of intervention that most developers follow:


    +   1. Clean Build Folder.

    2. Delete the project''s DerivedData folder.

    3. Restart Xcode.

    4. Restart Mac.


    > **Strange but true:** Deleting earlier versions of Xcode can fix some weird

    issues, like no color-coding in the editor or Command-/- not working.


    # Reclaiming Disk Space


    Weird Xcode behavior isn''t the only reason to delete derived data folders. Long
    after

    you''ve finished working on a project — or deleted it — its derived data folder
    is

    still there, taking up disk space. Many developers routinely delete so, reclaiming
    gigabytes of space. If you''re

    DerivedData folder every month or so, running low disk space, it''s certainly
    the first place you should look.


    **Command-delete** moves just to Trash, where it takes up space. To really

    delete the folder, you can enter this in **Terminal:**


    ```

    rm -rf ~/Library/Developer/Xcode/DerivedData/*

    ```


    Or, if you''re running **Big Sur** or later, you can open **Trash** and selectively
    erase the

    folder. But, since Big Sur, macOS storage management provides a way to clear even

    more space.'
  merge: -1
  pgno: 350
