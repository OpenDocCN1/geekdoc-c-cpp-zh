  md: '# SwiftUI Apprentice

    Chapter 11: Managing Data With Property Wrappers


    Your app needs to manage changes to two kinds of data:


    ![](img/b137d252894e5c4c3dd508961a85e251_311_0.png)


    Managing UI values and model objects


    +   - User interface values, like Boolean flags to show or hide views, text field,
    slider or picker values.


    +   - Data model objects, often collections of objects that model the app’s data,
    daily logs of completed exercises.


    # Property Wrappers


    Property wrappers encapsulate a value or object in a structure with two properties:


    +   - wrappedValue is the underlying value or object.


    +   - projectedValue is a binding to the wrapped value or a projection of the
    object that creates bindings to its properties.


    Swift syntax lets you write the name of the property, like showHistory, instead
    of showHistory.wrappedValue. And, its binding is $showHistory instead of showHistory.projectedValue.


    SwiftUI provides tools — mostly property wrappers — to create and modify the source
    of truth for values and for objects:


    +   - User interface values: Use @State and @Binding for values like showHistory
    that affect your view’s appearance. The underlying type must be a value type like
    Bool, Int, String or Exercise. Use @State to create a source of truth in one view,
    pass a @Binding to this to subviews. A view can have built-in @Environment values
    as @Environment properties or with the environment(_:_:) view modifier.


