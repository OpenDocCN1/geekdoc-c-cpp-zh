  md: "# Class Inheritance\n\nSkills you'll learn in this section: class inheritance;\
    \ composition vs inheritance\n\nYou might have come across object oriented programming\
    \ (OOP) in Swift or other languages. This is where you have a base object, and\
    \ other classes derive — or inherit — from this base object. Swift allows inheritance.\
    \ Swift structures do not.\n\nYou might set up your card data in this way:\n\n\
    ```\nclass CardElement {\n    var transform: Transform\n}\n\nclass ImageElement:\
    \ CardElement {\n    var image: Image?\n}\n\nclass TextElement: CardElement {\n\
    \    var text: String?\n}\n```\n\nYou have a base CardElement with two sub-classes\
    \ inheriting from CardElement. ImageElement and TextElement both inherit the transform\
    \ property, but each type has its own separate relevant data.\n\nAs discussed\
    \ earlier, lightweight objects such as card elements should be value types, not\
    \ classes.\n\n# Composition vs Inheritance\n\nWith inheritance, you have tightly\
    \ coupled objects. Any subclass of a CardElement automatically has a transform\
    \ property whether you want one or not.\n\nYou might possibly decide in a future\
    \ release to require some elements to have a color. With inheritance, you could\
    \ add color to the base class, but you'd be holding redundant data for the elements\
    \ that don't use a color."
