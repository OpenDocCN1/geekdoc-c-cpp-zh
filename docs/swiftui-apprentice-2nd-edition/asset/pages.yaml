  md: "# SwiftUI Apprentice Chapter 24: Downloading Data\n\n> Note: If you need Swift\
    \ structures and coding keys for the complete JSON schema, parse a sample response\
    \ body into quicktype(https://app.quicktype.io) and select the Swift Struct options.\n\
    \n![](img/b137d252894e5c4c3dd508961a85e251_667_0.png)\n\n# Decoding When JSON\
    \ Name != Property Name\n\nJSON values seen from real-world APIs might not match\
    \ the way you want to name or structure your app's data.\n\nMany APIs use snake_case\
    \ for JSON names, but Swift properties use camelCase. An easy fix: you simply\
    \ tell the decoder to do translation:\n\n```\nlet decoder = JSONDecoder()\ndecoder.keyDecodingStrategy\
    \ = .convertFromSnakeCase\n```\n\nThis takes care of translating a JSON name like\
    \ artistData_URL to a Swift property name like artistDataURL.\n\nIf the JSON structure\
    \ matches your app's data, but some of the names are different, you have to define\
    \ a CodingKey enumeration to assign JSON items to your model properties. For example,\
    \ Object has a primaryImageSmall property that matches the JSON item's name. The\
    \ value of this is a URL string, so how might you want to name your app's property\
    \ imageURL. Here's how you would do it:\n\n```\nenum CodingKeys: String, CodingKey\
    \ {\n    case imageURL = \"primaryImageSmall\"\n    case objectID, title, creditLine,\
    \ objectURL, isPublicDomain\n}\n```\n\nUnfortunately, as soon as you create a\
    \ CodingKey enumeration for one property name, you must include all the property\
    \ names, even those that already match JSON item names.\n\n# Kodeco 668"
