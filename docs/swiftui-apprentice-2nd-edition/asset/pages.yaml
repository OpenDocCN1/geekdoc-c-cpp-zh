    ![](img/b137d252894e5c4c3dd508961a85e251_642_0.png)


    HTTP response to metmuseum.org/art/the-collection


    This is the body of the server''s response, but you don''t get to see the headers.
    And, you can''t do more than a simple GET request.


    # cURL


    A browser is a fully-automated HTTP tool. At the other end of the spectrum is
    the command-line tool cURL (https://curl.se) — “the internet backbone for thousands
    of software applications.


    The documentation for a REST API often provides sample requests to show you how
    to use it. Very often, these use cURL.


    +   Open Terminal and enter this command:


    ```

    curl https://api.github.com/zen

    ```


    You send an HTTP request to GitHub’s API server. The response is a random item
    from their design, “Favor focus over features” or “Avoid administrative distraction”.
    There are lots more request examples at GitHub’s Getting started with the REST
    API (https://bit.ly/3id717R).


    But, you explain, curl doesn’t show any response headers either! Well, like Unix
    commands, curl has a wealth of options, including --include and its shortcut -i,
    to include the HTTP response headers in its output.'
