  md: '# Key Points


    +   - The Shape protocol provides an easy way to draw a 2D shape. There are some
    built-in shapes, such as Rectangle and Circle, but you can create custom shapes
    by providing a Path.


    +   - Paths are the outline of the 2D shape, made up of lines and curves.


    +   - A Shape fills by default with the primary color. You can override this with
    the fill(_:style:) modifier to fill with a color or gradient. Instead of filling
    the shape, you can stroke it with the stroke(_:linewidth:) modifier to outline
    the shape with a color or gradient.


    +   - With the clipShape(:style:) modifier, you can clip any view to a given shape.


    +   - Associated types in a protocol make a protocol generic, making the code
    reusable. Once a protocol is until a structure, class or enumeration adopts it
    the compiler can''t determine what type the protocol is until it provides the
    type for the protocol to use.


    +   - Using type erasure, you can hide the type of an object. This is useful for
    combining different shapes into an array or returning any kind of view from a
    method using AnyView.


    +   - You can use the View attribute to create conditional modifiers when the
    modifier doesn''t allow a ternary condition.'
