    \ might require the conforming type to implement a method. For example, this protocol\
    \ requires all types that conform to it to implement find():\n\n```\nprotocol\
    \ Findable {\n  func find()\n}\n```\n\nSometimes you want a default method that\
    \ is the same across all conforming types. For example, in your app, a card will\
    \ hold an array of card elements. Later, you'll want to find the index for a particular\
    \ card element.\n\nThe code for this would be:\n\n```\nlet index = card.elements.first\
