  md: '# Key Points


    +   * Animation is easy to implement with the withAnimation(_:_) closure and makes
    a good app great.


    +   * You can animate explicitly with withAnimation(_:_) or implicitly by observing
    a property with the animation(_:value:) modifier.


    +   * Transitions are also easy with the transition(_:) modifier. Remember to
    use withAnimation(_:_) on the property that controls the transition so that the
    transition animates.


    +   * Picker views allow the user to pick one of a set of values. You can have
    a wheel style picker or a segmented style picker.


    +   * Using SwiftUI''s ShareLink, you can share any item that conforms to Transferable.
    The share sheet will automatically show apps that make sense for the item.


    # Where to Go From Here?


    You probably want to animate everything possible now. The book iOS Animation by
    Tutorials (https://bit.ly/3VsvLmf) is available with the Pro subscription and
    two chapters dedicated to animations and transitions with SwiftUI.


    A great example of an app with complex layout and animation is Apple’s Fruta sample
    app (https://apple.com/2XE8tNF). This is a full–featured app where “Users can
    order smoothies, favorite drinks, collect rewards, and browse recipes.” Fruta
    also has various features, such as widgets. Download the app and see if you can
    work out how it all fits together.'
