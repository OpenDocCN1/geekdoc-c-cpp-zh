  md: 'Most apps also use classes to model data. SwiftUI provides a different mechanism
    to manage changes to class objects: ObservableObject, @StateObject, @ObservedObject
    and @EnvironmentObject. To practice using @ObservedObject, you''ll refactor TIL
    to you use @StateObject and @ObservedObject to update ThingStore, which conforms
    to ObservableObject. You''ll see a lot of similarities, and a few differences,
    using @State and @Binding.


    > Note: You can wrap a class object as a @State property, but its "value" is its
    address in memory, so dependent views will redraw themselves only when its address
    changes — for example, when the app initializes.


    # Class & Store


    Actually, ThingStore should be a class, not a structure. @State and @Binding work
    well enough to update the ThingStore source of truth value in ContentView from
    AddingView. But ThingStore isn''t the most natural use of a structure. For your
    app uses ThingStore, a class is a better fit.


    A class is more suitable when you need shared mutable state like a HistoryStore
    ThingStore. A structure is more suitable when you need multiple independent states
    like ExerciseDay structures.


    For a class object, change is normal. A class object expects its properties to
    change. For a structure instance, change is exceptional. A structure requires
    advance notice that a method might change its property.


    A class object expects to be shared, and any reference can be used to change its
    properties. A structure lets itself copied, but its copies change independently
    of it and of each other.


    You''ll find out more about classes and structures in Chapter 15, "Structures,
    Classes & Protocols".


