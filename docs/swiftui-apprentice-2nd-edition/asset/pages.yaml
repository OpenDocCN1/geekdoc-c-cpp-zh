  md: '# Key Points


    +   - The Date type has many built-in properties and methods. You need to configure
    DateFormatter to create meaningful text to show your users.


    +   - Use the Form container view to quickly lay out data.


    +   - ForEach loops you over the items in a collection.


    +   - To use a collection in a ForEach loop, it needs to have a way to uniquely
    identify each of its elements. The easiest way is to conform to Identifiable and
    include id: UUID as a property.


    +   - Use compiler directives to create development data only while you''re developing
    and not in the release version of your app.


    +   - Preview Content is a convenient place to store code and data only while
    developing. Its contents won''t be included in the release version of your app.


    +   - ZStack is useful for keeping views in one layer centered while pushing views
    in another layer to the edges.


    +   - You can specify vertical alignment values for HStack, horizontal alignment
    values for VStack and combination alignment values for ZStack.


    +   - Xcode helps you to refactor the name of a parameter quickly and safely.


    +   - Image often needs the same modifiers. You can create a custom modifier so
    you Don''t Repeat Yourself.


