    \n```\n```swift\nGeometryReader { proxy in\n  HStack {\n    ...\n  }\n  .background(Color.gray)\n\
    \  .background(Color.yellow)\n}\n```\n```\n\nGeometryReader takes up the size\
    \ of the parent, in this case the whole 500 x 300 point view. It returns a type\
    \ of GeometryProxy, which includes a size property so that you can find exactly\
    \ the size of the view. You can then lay out children using this size.\n\n![](img/b137d252894e5c4c3dd508961a85e251_569_0.png)\n\
    \nGeometryReader\n\nNotice that GeometryReader changes alignment behavior. Instead\
    \ of HStack being centered in its parent view, it is now aligned to the top left\
    \ of its parent view. You'll discover more about alignment later in this chapter.\n\
    \n+   - Change HStack's modifiers to:\n\n```\n```swift\n.frame(width: proxy.size.width\
