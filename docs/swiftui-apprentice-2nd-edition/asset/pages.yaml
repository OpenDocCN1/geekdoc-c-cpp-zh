  md: '# # Chapter 19: Saving Files

    By Caroline Begbie


    You''ve set up most of your user interface, and it would be nice at this stage
    to have the card data persist between app sessions. You can choose between a number
    of different ways to save data.


    You''ve already looked at UserDefaults and property list (plist) files in Section
    1. These are more suitable for simple data structures, whereas, when you save
    your card, you''ll be saving images and sub-arrays of elements. While Core Data
    could handle this, another way is to save the data to files using the JSON format.
    One advantage of JSON is that you can easily examine the file in a text editor
    and check that you''re saving everything correctly.


    This chapter will cover saving JSON files to your app''s Documents folder by encoding
    and decoding the JSON representation of your cards.'
  merge: -1
