  md: '# A Brief History of SwiftUI


    You''ve been using SwiftUI to build HIIT, but this is only the most recent app
    development paradigm from Apple.


    Apple announced SwiftUI at its World Wide Developers Conference in June 2019.
    SwiftUI builds on the Swift language, which Apple announced in 2014. SwiftUI is
    a Domain Specific Language (DSL), written in Swift using these new features:


    +   - Property wrappers, like @State to monitor the state of the properties.


    +   - Result builders, like @ViewBuilder to create hierarchies.


    +   - Opaque result types, like View to avoid explicitly writing the view hierarchy.


    Swift creates faster, safer than Objective-C and is more protocol-oriented than
    object-oriented. Chapter 15, "Structures, Classes & Protocols", explains the difference
    between class inheritance and protocols.


    By January 2018, the Redmonk Programming Language Rankings (https://bit.ly/3rsZmwq)
    ranked Swift and Objective-C in a tie at number 10.


    Objective-C entered Apple history when Apple bought NeXT in 1997, which also brought
    Steve Jobs back to Apple. Jobs had resigned from Apple in 1985 after a boardroom
    battle with CEO John Sculley over the future of the Macintosh computer. Jobs,
    with five other former Apple executives, founded NeXT Computers.


    ![](img/b137d252894e5c4c3dd508961a85e251_332_0.png)


    A brief history of SwiftUI'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# SwiftUI Apprentice


    The NEXTSTEP operating system, written in Objective-C, formed the basis of Mac
    OS X, released in 2001. Apple provided the Cocoa API for developers to create
    apps for OS X. Cocoa consists of three frameworks reflecting the Model-View-Controller
    principles: Core Data, AppKit and Foundation. The “NS” prefix in AppKit and Foundation
    acknowledges their NEXTSTEP heritage.


    Apple announced the iPhone in 2007 and the iPhone SDK (Software Development Kit)
    in 2008. This included Cocoa Touch, with UIKit replacing AppKit. Now called the
    iOS SDK, it helps you create apps that appear and behave the way users expect.


    # Fun Facts


    +   The first World Wide Web server was a NEXT Computer, and the video games Doom
    and Quake on machines running the operating system NEXTSTEP. NEXT Software, Inc.
    released WebObjects, a framework for Web application development. Apple used WebObjects
    to build and run the App Store, MobileMe services and the iTunes Store.


    +   Cocoa 1! for kids: Before Jobs returned to Apple, the Apple Advanced Group
    created KidSim, an app to teach kids to program. KidSim programs were embedded
    in web pages to tour, so they renamed and trademarked the app as Cocoa — “Java
    for kids”. The Cocoa program was one of the many eyed in 1997, and Apple reused
    the name for the OS X API to avoid the delay of registering a new trademark.


    +   While developing the iPhone, Jobs didn''t want non-Apple developers to build
    native iPhone apps. They were supposed to be content making applications for Safari.
    This stance changed in response to a backlash from developers, and the iPhone
    SDK was released on March 6, 2008.


    # SwiftUI vs. UIKit


    Although you''ve used SwiftUI to create HIITKit, UIKit has a lot of resources
    that can help you add to your app or fine-tune how it looks and functions.


    # Most Popular Episode


    "SwiftUI vs. UIKit” (https://bit.ly/3V0lwEY) is the most popular free episode
    at kodeco.com. Presented by our founder Ray Wanderlich, it''s worth watching,
    but here''s a TL;DW summary.'
  merge: -1
