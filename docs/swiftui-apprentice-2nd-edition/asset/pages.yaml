  md: '# Key Points


    +   - The SwiftUI List view is the easiest way to present a collection of items
    in a view that scrolls vertically. Call `listRowBackground` on the view in the
    row, not on the List itself.


    +   - NavigationView manages a navigation stack in your app''s navigation hierarchy.
    Tapping a NavigationLink pushes its destination view onto the navigation stack.
    Tapping the back button pops this view off the navigation stack.


    +   - A NavigationView can contain alternative root views. You modify each with
    its own `Title` and toolbars.


    +   - You can navigate using values thanks to the initializer `NavigationLink.init(value:label:)`.


    +   - Your app can open a web link in the device''s default browser using Link
    or as a Safari view within your app.


    +   - It''s easy to download an image and display it with the AsyncImage view.'
