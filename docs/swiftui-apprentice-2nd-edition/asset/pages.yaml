  md: "As the word suggests, an extension adds a named type. The starter project includes\
    \ extensions: DateExtension.swift and ImageExtension.swift. Date and Image are\
    \ built-in SwiftUI types, by creating an extension, you can add custom methods\
    \ or computed type properties.\n\nExercise is your own custom type, so why do\
    \ you have an extension? It's housekeeping: You're keeping this task — initializing\
    \ an array of Exercise values — separate from the core definition of your structure\
    \ — stored properties and any custom initializers.\n\nDevelopers also use extensions\
    \ to encapsulate the requirements for protocols, one for each protocol. Organizing\
    \ code like this makes it easy to see where to add features or look for bugs.\n\
    \n# Refactoring ContentView & Exercise\n\nNow, you'll modify ContentView and Exercise\
    \ to use your new Exercise.exercises array.\n\n+   - ContentView.swift, replace\
    \ the ForEach line with this:\n\n```\nForEach(Exercise.exercises.indices, id:\
    \ \\self) { index in\n```\n\nInstead of ..<4, you use the exercise array's range.\
    \ Because the range is no longer fixed, you must provide an id for each array\
    \ element. \\self means each element is its own unique identifier.\n\n+   - Exercise.swift,\
    \ delete videoNames and exerciseNames. The error flags tells you that you need\
    \ to use Exercise.exercises.\n\nYou could replace exerciseNames[index] with Exercise.exercises[index].exerciseName,\
    \ but you'll need to use Exercise.exercises[index] several times in Exercise.\
    \ This is why to define a computed property.\n\n+   - Add this near the top of\
    \ ExerciseView, let index: Int:\n\n```\nvar exercise: Exercise {\n  Exercise.exercises[index]\n\
    }\n```\n\n+   - Then replace exerciseNames[index] with exercise.exerciseName:\n\
    \n```\nHeaderView(exerciseName: exercise.exerciseName)\n```"
