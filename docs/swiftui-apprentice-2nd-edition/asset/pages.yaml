- img_proc: true
  md: 'Enter this command:


    ```

    curl -i https://api.github.com/zen

    ```


    And you see quite a lot more output:


    ```

    HTTP/2 200

    server: GitHub.com

    date: Fri, 09 Dec 2022 01:49:10 GMT

    content-type: text/plain;charset=utf-8


    nx-ratelimit-reset: 1670551677

    x-ratelimit-resource: core

    x-ratelimit-used: 2

    accept-ranges: bytes

    x-github-request-id: F968:61FE:7DF301:85B2E23:6392946

    ```


    Design for failure.


    Headers with x- are custom headers set up by the organization. For example, x-ratelimit-limit
    and x-ratelimit-used indicate how many requests a client can make in a rolling
    time period (typically an hour) and how many of those requests the client has
    already made.


    The curl --verbose or -v option displays request headers and a lot.


    Enter this command:


    ```

    curl -v https://api.github.com/zen

    ```


    Replacing -i with -v produces quite a lot more output — every handshake interaction
    between the terminal and the server, the encryption algorithms used, the server
    certificate details, as well as the response headers. The request headers are
    the lines that start with:


    ```

    > GET /zen HTTP/2

    > Host: api.github.com

    > user-agent: curl/7.79.1

    > accept: *//*

    ```


    Lines that start with < are response headers, and lines that start with * are
    additional information provided by cURL.'
