  md: "To get rid of the error flags, add TheMetStore.swift, TheMetService.swift and\
    \ URLComponentsExtension.swift from TheMet group to the widget target.\n\nNow,\
    \ in getTimeline(in:completion:), replace the for loop with the following code:\n\
    \n```\nlet interval = 3\nTask { // 1\ndo {\n    try await store.fetchObjects(for:\
    \ query)\n} catch objects = [\n    store.objects = [\n        Object.sample(isPublicDomain:\
    \ true),\n        Object.sample(isPublicDomain: false)\n    ]\n}\nfor index in\
    \ 0..<store.objects.count {\n    let entryDate = Calendar.current.date(\n    \
    \    byAdding: .second, // 2\n        value: index * interval,\n        to: currentDate)!\n\
    \    let entry = SimpleEntry(\n        date: entryDate,\n        object: store.objects[index])\
    \ // 3\n    entries.append(entry)\n}\n```\n\n+   1. You call fetchObjects(for:)\
    \ to fill the objects array and use this to create an array of SimpleEntry values,\
    \ three seconds apart. If fetchObjects(for:) fails, you fill the array with the\
    \ two sample objects.\n\n+   2. You change the interval between entries to 3 seconds.\n\
    \n+   3. You display an object from store.objects.\n\nAt the top of ContentView,\
    \ query to “persimmon”: You download the same objects as so you can compare the\
    \ app’s list with what your widget displays."
