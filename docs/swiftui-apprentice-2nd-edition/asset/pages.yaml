    the built-in gestures for tapping and swiping, SwiftUI also provides various gesture
    types for customization.


    When new users are new to Apple devices, they''ve spent a few minutes with iPhone,
    it becomes natural to tap, pinch two fingers to zoom or make the element larger,
    or rotate an element with two fingers. Your app should use these standard gestures.
    In this chapter, you''ll explore how to drag, magnify and rotate elements with
    the built-in gesture recognizers.


