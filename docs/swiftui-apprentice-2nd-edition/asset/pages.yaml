  md: 'Q: Which should you learn: SwiftUI or UIKit?


    A: If you''re serious about being a professional iOS developer, our recommendation
    is to learn both SwiftUI and UIKit. If you end up working at a company that already
    has an iOS app, there''s a high chance it has been made with UIKit. So if you
    want to work on one of those companies, it''s important for you to be able to
    work with those codebases, too. We created a special and optimal learning path,
    called "IOS Interfaces with UIKit" (https://bit.ly/3zg5Y2). If you need UIKit
    development for your job, you should definitely check that out. But if you only
    care about SwiftUI, you can safely skip it.


    It''s not all or nothing: It''s possible to make a certain part of your app with
    SwiftUI and the rest with UIKit. As companies begin to transition from UIKit to
    SwiftUI, we expect to see many codebases with a mixture of both SwiftUI and UIKit
    code in the years ahead.


    Thanks, Ray! That''s the perfect segue into the next section...


    # Integrating New & Old


    Apple provides support for developers to transition to new things. The Carbon
    API enabled developers to port "classic" Mac OS apps to OS X. Bridging headers
    enable developers to use Objective-C code in Swift apps and vice versa.


    Developers can still create Objective-C apps without SwiftUI and Swift apps without
    SwiftUI. UIKit has more features than SwiftUI and provides much more control over
    the appearance and operation of user interface elements.


    But no FOMO (fear of missing out)! You can use UIKit views in your SwiftUI apps:


    ![](img/b137d252894e5c4c3dd508961a85e251_335_0.png)


    Integrating a UIKit view'
