  md: 'When you create an instance of the structure CGPoint, you set up x and y properties
    on the structure. These x and y properties are unique to every CGPoint you instantiate.


    To use CGPoint''s type property, you use the name of the type:


    ```

    let pointZero = CGPoint.zero // pointZero contains (x: 0, y: 0)

    ```


    This sets up an instance of a CGPoint, named pointZero, with x and y values of
    zero.


    When you instantiate a new structure, that stores its properties in memory separately
    from every other structure. A static or type property, however, is constant over
    all instances of the type. No matter how many times you instantiate the structure,
    there will be only one copy of the type property.


    In the following diagram, there are two copies of CGPoint, pointA and pointB.
    Each of them has its own memory storage area. CGPoint has a type property zero
    which is stored once.


    ![](img/b137d252894e5c4c3dd508961a85e251_399_0.png)


    Type property storage


    > Swift Tip: CGPoint.zero is defined as a computed property. It has a return value
    of CGPoint(x: 0, y: 0), and you can''t set it to any other value. There is no
    effective difference between defining .zero as a computed property or static let
    zero = CGPoint(x: 0, y: 0). It is a stylistic choice.'
