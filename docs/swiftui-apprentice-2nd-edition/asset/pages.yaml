  md: "Now look at the url on the line above. Notice it's not in quotation marks,\
    \ because it's not a String. In fact, it's an Optional. Click its Show Result:\n\
    \n```\nurlComponents.url // Optional(https://api.artmuseum.org/public/collection/v1/search?q=...)\n\
    urlComponents.url?.absoluteString // \"https://api.artmuseum.org/public/collection/v1/search?q=quilt\"\
    \n```\n\nPlayground trying to display a URL\n\nThe playground tries best to open\
    \ the URL.\n\nYou can create a URL from a String, if the String has all the right\
    \ parts. Then, you can access these parts as properties of the URL instance: host,\
    \ baseURL, path, lastPathComponent, query and so on.\n\nIf you try to create a\
    \ URL from a String that wouldn't work in a browser, the initializer returns nil.\
    \ That's why urlComponents.url is an Optional and there's a url in the last line:\
    \ If is nil, it doesn't have an absoluteString.\n\n+   Click their Hide Result\
    \ buttons to close the windows.\n\n> Note: You can also use print(urlComponents.url?.absoluteString)\
    \ to see the printed value in the Debug area below. If you're not able to see\
    \ the Debug area, click the button in the lower right corner or press Shift-Command-C.\n\
    \n# URLComponents Helper Method\n\nURLQueryItem makes easy to add a query parameter\
