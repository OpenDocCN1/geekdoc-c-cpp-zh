    # Housekeeping & Trouble-Shooting


    Hopefully, you haven''t run into any issues while creating SwiftUIfit. Xcode''s
    error and warning messages are often helpful, but sometimes they''re wrong. At
    first, you won''t be sure if it''s something you need to fix, as you gain more
    experience, you''ll get a feeling for when Xcode is wrong or confused. It does
    happen. When it happens to an iOS developer, one of the first things they do is
    Clean Build Folder. Read on to find out what this entails.


    # DerivedData/Data


    Xcode maintains a lot of files in ~/Library/Developer/Xcode. Of particular interest
    is DerivedData, where Xcode creates a folder for every project you''ve created
