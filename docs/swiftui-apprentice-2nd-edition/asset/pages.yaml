    # Chapter 4: Prototyping Supplementary Views


    ![](img/b137d252894e5c4c3dd508961a85e251_143_0.png)


    Welcome view Get Started button


    This code is quite different from the other buttons you''ve created and requires
    some explanation. SwiftUI uses a lot of syntactic sugar: Instead of using the
    official method calls, SwiftUI lets you write code that is much simpler and more
    readable.


    (action, label) vs. (String,


    The official Button signature is:


    ```

    Button(action: () -> Void, label: () -> Label)

    ```


    +   - action is a method or a closure containing executable code.

    - label is a view describing the button''s action.


    Both parameter values can be closures, so action can be more than one executable
    statement, and label can be more than one view.


    The buttons you''ve created so far use the simplest Button syntax: The button''s
    label is simply a String, and the button''s action is a trailing closure. For
    example:


    ```

    Button("History") { }

    ```


    > Swift Tip: You can move the last closure argument of a function call outside
    the parentheses into a trailing closure.


    This simple Button syntax reverses the official signature, and it''s only for
    the case where label is a string.'
