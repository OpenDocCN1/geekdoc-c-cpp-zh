  md: "# Chapter 8: Saving History Data\n\nIt's important to recognize that when you\
    \ assign a closure to a variable, the closure code doesn't execute. The variable\
    \ addition contains the code return a + b, not the actual result.\n\nTo perform\
    \ the closure code, you execute it with its parameters:\n\n```\nlet result = addition(1,\
    \ 2) // result contains 3\nClosure result\n```\n\nYou pass in 1 and 2 as the integer\
    \ parameters and receive back an integer:\n\n```\nparam 1  param 2   return\n\
    \   /       /      type\n  (Int, Int) -> Int\nClosure signature\n```\n\nAnother\
    \ example:\n\n```\nlet aClosure: () -> String = \"Hello world\"\n```\n\nThis closure\
    \ takes in no parameters and returns a string.\n\nYour current task is to convert\
    \ ExerciseDay element to an element of type [Any].\n\nThis is the closure that\
    \ would perform this conversion for a single ExerciseDay element:\n\n```\nlet\
    \ result: (ExerciseDay) -> [Any] = { exerciseDay in\n    exerciseDay.uuidString,\n\
    \    exerciseDay.date,\n    exerciseDay.exercises\n}\n```\n\nresult is of type\
    \ (ExerciseDay) -> [Any]. The closure takes in a parameter ExerciseDay and combines\
    \ the ExerciseDay properties into an array of type [Any].\n\n# Using map(:) to\
    \ Transform Data\n\nSimilar to a for loop, map(:) goes through each element individually,\
    \ transforms the data to a new element and combines them all into a single array.\n\
