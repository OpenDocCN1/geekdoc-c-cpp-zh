  md: "# Tuples\n\nHere you set up a dictionary of type [ToolbarSelection:(String,\
    \ String)] containing values for all the possible button states. You could have\
    \ set up a structure that contains text and imageName, but if you're only using\
    \ a type once in an object with not much code, you could set up an \"ad hoc\"\
    \ type called a tuple.\n\nA tuple is a group of values. For example, you could\
    \ initialize a tuple with three elements like this:\n\n```\nlet button = (\"Stickers\"\
    , \"heart.circle\", 1)\n```\n\nAnd access the data:\n\n```\nlet text = button.0\n\
    let number = button.2\n```\n\nIt's obviously good practice to name your types\
    \ rather than using numbers to access the data, which is why you defined your\
    \ modalButton tuple with (text: imageName):\n\n+   InToolbarButton, replace body\
    \ with:\n\n```\nvar body: some View {\n  if let text = modalButton[modal]?.text,\n\
    \     let imageName = modalButton[modal]?.imageName {\n    VStack {\n      Image(system:\
    \ imageName)\n        .font(.largeTitle)\n      Text(text)\n    }\n    .padding(.top)\n\
    \  }\n}\n```\n\nUsing your dictionary, you access the text and image name and\
    \ use those for the button instead of hard coded Stickers values.\n\nTo show all\
    \ the buttons in BottomToolbar, you can iterate through all the values of ToolbarSelection.\
    \ Swift enumerations have a built-in array called allCases, but to use it, the\
    \ enumeration must conform to the CaseIterable protocol."
