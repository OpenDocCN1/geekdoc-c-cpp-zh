- img_proc: true
  md: 'The Xcode window has three main panes: Navigator, Editor and Inspectors. When
    the app is running, the Debug Area opens below the Editor. When you''re viewing
    a SwiftUI View file in the Editor, you can view the preview canvas side-by-side
    with the code.


    The toolbar button above the Navigator pane hides or shows it. Same is true for
    the Inspectors pane. The debug area has a hide/show button in its own toolbar.
    You can hide any of these three panes by dragging its border to the edge of the
    Xcode window.


    And all three have keyboard shortcuts:


    +   - Hide/show Navigators: Command-0

    - Hide/show Inspectors: Option-Command-0

    - Hide/show Debug Area: Shift-Command-0


    > Note: There''s a handy cheat sheet of Xcode keyboard shortcuts for this chapter.
    It''s not a complete list, but it covers the ones people use.


    # Navigator


    The Navigator has nine tabs. When the navigator pane is hidden, you can open it
    directly in one of its tabs by pressing Command-1 to Command-9 (from left to right):


    ![](img/b137d252894e5c4c3dd508961a85e251_29_0.png)


    +   - Project: Add, delete or group files. Open a file in the editor.

    - Source Control: View Git repository working copies, branches, tags, remotes
    and staged changes.

    - Symbol: Hierarchical or flat view of the named objects and methods.

    - Find: Search tool.

    - Issue: Build-time and runtime errors and warnings.'
