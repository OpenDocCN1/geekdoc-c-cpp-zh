  md: "These are high-intensity interval exercises, so the timer counts down from\
    \ 30 seconds.\n\n+   Replace Text(\"Timer\") with this code:\n\n```\nText(Date()).addingTimeInterval(interval),\
    \ style: .timer)\n   .font(.system(size: geometry.size.height * 0.07))\n```\n\n\
    The default initializer Date creates a value with the current date and time. The\
    \ Date method addingTimeInterval(_ interval:) adds interval seconds to this value.\n\
    \n+   The Swift type has a list of methods for manipulating date and time values.\
    \ **Option-click** Date and **Open in Developer Documentation** to scan what's\
    \ available. You'll dive a little deeper into Date when you create the _History\
    \ view.\n\nThe timeInterval parameter's type is TimeInterval. This is simply an\
    \ alias for Double. If your type is Double, you won't get an error, but TimeInterval\
    \ describes the value's purpose more accurately.\n\n> **Swift Tip:** Swift is\
    \ a strongly typed language. This means that you must use the correct type. When\
    \ using numbers, you can usually pass a value of a wrong type to the initializer\
    \ of the correct type. For example, Double(myIntValue) creates a Double value\
    \ from an Int and Int(myValue) truncates a Double value from an Int. If you write\
    \ code in languages that allow automatic conversion, it's easy to create a bug\
    \ that's very hard to find. Swift makes sure you, and people reading your code\
    \ — “future you”, know that you're converting one type to another.\n\nYou're using\
    \ the Text's(:style:) initializer for displaying dates and times. The timer and\
    \ relative styles display the time interval between the current time and the date\
    \ value, formatted as \"mm:ss\" or \"mm min ss sec\", respectively. Two styles\
    \ update the display every second.\n\nYou set the system font size to geometry.size.height\
    \ * 0.07 to make a really big timer — around 95 points for a 12.9\" iPad and 47\
    \ points for the much smaller iPhone 8."
