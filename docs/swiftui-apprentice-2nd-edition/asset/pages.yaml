  md: '# # Chapter 22: Lists & Navigation

    By Audrey Tam


    Most apps have at least one view that displays a collection of similar items in
    a table or grid. When there are too many items to fit on one screen, the user
    can view more items by scrolling — vertically, horizontally or both. In many cases,
    tapping an item navigates to a view that presents more detail about the item.


    In this section, you''ll start implementing TheMet, an app that searches The Metropolitan
    Museum of Art, New York (https://www.metmuseum.org) for objects matching the user''s
    query term.


    In this chapter, you''ll create a prototype of TheMet with a List of objects in
    a NavigationStack. Tapping a list item pushes a detail view onto the navigation
    stack. The starter project already contains ObjectView.swift, which displays some
    of the object properties.'
