  md: "# Getting Started\n\nOpen the TheMet app in the starter folder. For this chapter,\
    \ the starter project initializes the Object data in Preview Content. In Chapter\
    \ 24, \"Downloading Data\", you'll fetch this data from collectionapi.metmuseum.org.\n\
    \n# List\n\nYou encountered the SwiftUI List view in Chapter 10, \"Working With\
    \ Datasets\", where you learned to use list editors for editing of exercises in\
    \ HIITFit.\n\nList is the easiest way to present a collection of items in a view\
    \ that scrolls vertically. You can display individual views and loop over arrays\
    \ within the same List. In this chapter, you'll start by listing objects, you'll\
    \ embed the list in a navigation stack so users can navigate to a detail view\
    \ for each list item.\n\nTo present a list of objects, the syntax looks like ForEach.\n\
