  md: "This is for historical reasons. In macOS, the origin — that’s coordinate (0,0)\
    \ — is at the bottom left, in the standard Cartesian coordinate system. When iOS\
    \ came out, Apple flipped the iOS drawing coordinate system on the Y axis so that\
    \ (0,0) is at the top left. However, much of the drawing code is based on the\
    \ old macOS drawing coordinate system.\n\n+   In Cone's path(in:), add two lines\
    \ to complete the cone before the return:\n\n```\npath.addLine(to: CGPoint(x:\
