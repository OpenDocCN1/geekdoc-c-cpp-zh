    Chapter 9: Refining Your App


    Creating individual reusable elements is a good place to start. Looking at the
    design, you''ll have to style:


    +   1. A raised button for Get Started and Start Exercise.


    +   2. An embossed button for History and the exercise rating. The History button
    is a capsule shape, while the rating is rounded.


    +   3. A shaped gray background view with a gradient behind.


    The starter app contains the colors and images that you''ll need in the asset
    catalog. There''s also some code for creating the welcome image and text in Welcomimages.swift.


    # Neumorphism


    > Skills you''ll learn in this section: neumorphism


    The style of design used in HIITFit, where the background and controls are one
    single color, is called neumorphism. You achieve the look with shading rather
    than with colors.


    In the old days, iPhone had skeomorphic interfaces with realistic surfaces, you
    had wood and fabric textures with dials that looked realistic throughout your
    UI iOS 7 with minimalistic flat design. The name Neumorphism comes from New +
    Skeumorphism and refers to minimalism combined with realistic shadows.


    ![](img/b137d252894e5c4c3dd508961a85e251_241_0.png)


    Neumorphism


    Essentially, you choose a theme color. You then choose a lighter tint and a darker
    shade of that theme color for the highlight and shadow. You can define colors
    with either red, green, blue (RGB) or hue, saturation and lightness (HSL). When
    shifting tones within one color, HSL is the easier method to use and keep the
    same color. The base color in the picture above is Hue: 166, Saturation: 54, Lightness:
    59. The lighter highlight color has the Hue and Saturation, but a Lightness: 71.
    Similarly, the darker shadow color has a Lightness: 30.


