- img_proc: true
  md: '# Servers & Resources


    ![](img/b137d252894e5c4c3dd508961a85e251_638_0.png)


    HTTP requests and responses between client and server


    Many apps communicate with computers on the internet to access databases and other
    resources. We call these computers web servers, harking to the original "World
    Wide Web". Cloud servers are because nowadays everything is "in the Cloud". "Host"
    is not another term for "server":


    Apps like Safari and TheMet are clients of servers. A client sends a request to
    a server, which sends back a response. This communication consists of plain-text
    messages that conform to the Hypertext Transfer Protocol (HTTP). Hypertext is
    structured text that uses hyperlinks between nodes containing text. Web pages
    are written in HyperText Markup Language (HTML).


    HTTP has several methods, including POST, GET, PUT and DELETE. These correspond
    to the database functions Create, Read, and Update.


    A client usually requests a resource to control by the server. To access a resource
    on the internet, you need your Universal Resource Identifier (URI). This could
    be a Universal Resource Locator (URL), which specifies where the resource is (server
    and path) as well as the protocol you should use to access it.


    For example, https://www.metmuseum.org/art/the-collection is a URL specifying
    the HTTP protocol to access the resource located on the metmuseum server with
    the path art/the-collection.


    > Note: HTTPS is the secure, encrypted version of HTTP. It protects your users
    from eavesdropping. The underlying protocol is the same, but instead of transferring
    plain-text messages, everything is encrypted before it leaves the client or server.'
  merge: -1
  pgno: 638
- img_proc: true
  md: '# HTTP Messages


    A client''s HTTP request message contains headers. A POST or PUT request has a
    body to contain the new or updated data. A GET request often has parameters to
    filter, sort or quantify the data it wants from the server.


    A server''s HTTP response also has headers and a body. A key part of the response
    is the status code — ideally, 200 OK in response to a GET request or 201 Created
    in response to a POST request. You don''t want to see any error status codes like
    404 Not Found:


    ![](img/b137d252894e5c4c3dd508961a85e251_639_0.png)


    There are many HTTP response status codes. You''ll find a fun representation of
    them at http.cat. For example:


    ![](img/b137d252894e5c4c3dd508961a85e251_639_1.png)'
  merge: -1
  pgno: 639
- img_proc: true
  md: 'Mozilla (mzl.la/3o6qWNM) provides more conventional descriptions of status
    codes:


    The HTTP **418 I am a teapot** client response code indicates that the server
    refuses to brew coffee because it is, permanently, a teapot. A double coffee/tea
    pot that is temporarily out of coffee should instead return 503. This error is
    a reference to Hyper Text Coffee Pot Control Protocol defined in April Fools''
    jokes in 1998 and 2014. Some websites use this response for requests they do not
    want to handle, such as automated queries.


    > **Note:** The 1998 HTCPCP (https://bit.ly/3olM42qa) April Fools'' joke was inspired
    by the Trojan Room coffee pot (https://bit.ly/3pkCDSBv), the subject of the world''s
    first cam. It was set in 1991, long before the Internet of Things (IoT).


    If an HTTP message has a body, it also has a **Content-Type** header. Content-Type
    specifies the internet media type of the data in the HTTP message body.


    Usually, you''ll work with three content types for *text data*, depending on the
    structure:


    +   * **JSON** (JavaScript Object Notation) is the most common data format for
    HTTP communication by client apps. It''s a structured data format consisting of
    numbers, strings, arrays and dictionaries that can contain strings, numbers and
    nested arrays and dictionaries.


    +   * Web forms use **form-encoded**, which looks like a query string. A query
    string is a collection of key-value pairs, separated by & and preceded by ?.


    +   * Web pages use **HTML**.


    When working with **binary data** some of the most used types are PDF, image formats
    and multi-part form data, when the client sends any kind of binary file along
    with text elements.


    # REST API


    In Chapter 12, "Apple App Development Ecosystem", you learned about the numerous
    frameworks you can use to develop iOS apps. An Apple framework is one kind of
    Application Programming Interface (**API**). It tells you how to use the standard
    components created by Apple engineers.'
  merge: -1
