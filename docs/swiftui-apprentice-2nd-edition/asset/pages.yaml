  md: '# Key Points


    +   - Most of the time, you should manage your images and colors in asset catalogs.


    +   - If the asset catalog is not suitable for purpose, then use reference folders.


    +   - In asset catalogs, favor vector images over bitmaps. They are smaller in
    size and retain sharpness when scaled. Xcode will automatically scale to the appropriate
    dimensions for the current device.


    +   - Think about how you can make your app special. Good app design together
    with artwork can really make you stand out from the crowd.


    # Where to Go From Here?


    In this chapter you used app icons and launch screens. The Apple Human Interface
    Guidelines (https://apple.co/3qUopKd), often referred to as the HIG, will point
    you at at best use.


    For example, rather than using branding on the launch screen, they suggest making
    your launch screen similar to the first screen in your app, so that it appears
    the app loads quickly.


    You should study the HIG so that you know what Apple is looking for in an app.
    People who use Apple devices enjoy clean, crisp interfaces, and the guidelines
    will help you follow this quest. If you follow the guidelines diligently, you
    might even be featured by Apple in the app store.'
