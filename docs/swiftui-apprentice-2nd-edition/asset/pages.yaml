  md: '# Deep-Linking Into Your App


    You can set up your widget with a deep link to activate a NavigationLink that
    opens the ObjectView or SafariView of the widget entry object. Here''s your workflow:


    +   1. Create a URL scheme.

    2. Modify a variable in WidgetView withURL(_:).

    3. In your app, implement onOpenURL(perform:) to activate the correct .navigationDestination
    modifier.


    > Note: When you install the app on a device, deep-linking works when the app
    is running in the background. If the app isn''t running at all, tapping the widget
    opens the app and shows the list.


    # Creating a URL Scheme


    "URL scheme" sounds very grand and a little scary, but because it''s just between
    your widget and your app, it can be quite simple. You''re basically creating a
    tiny API between widget and app. The widget needs to send enough information to
    the app so the app knows which view to display. Formatting this information as
    a URL lets you use URL or URLComponents properties to extract the necessary values.


    For this app, the objectID property of Object uniquely identifies it. So the URL
    to open "Hexagonal flower vase" is simply:


    ```

    URL(string: "TheMet://828444")

    ```


    And you can access this objectID as the host property of the URL. So simple!


    # In Your Widget


    In SwiftUI.swift, add this modifier to the top-level VStack, where you set truncationMode
    and fontWeight:


    ```

    .widgetURL(URL(string: "themet://(entry.object.objectID)"))

    ```'
  merge: -1
  pgno: 714
- img_proc: true
  md: '> Note: In the medium and large widget sizes, you can use Link(_:destination:)
    to attach links to different parts of the view.


    # # In Your App


    In your app, you implement .onOpenURL(perform:) to process the widget URL. You
    attach this modifier to the root view, in TheMyApp, or to the top level view of
    the root view. For TheMet, you''ll attach this to the NavigationStack in ContentView,
    because the perform closure must assign a value to a @State property of ContentView.


    You need to trigger navigation programmatically: You''ll add the widget''s object
    to a navigation path to make the app open the correct navigation destination.


    +   - In ContentView.swift, add this @State property to ContentView:


    ```

    @State private var path = NavigationPath()

    ```


    When the widget sends a widgetURL to the app, you''ll check whether the object
    is in the public domain or not. Then, you''ll append either the object or its
    URL to path, and NavigationStack will use this to select the correct navigationDestination.


    > Note: If your NavigationStack presents only one type of view, path can be an
    array of the data type you pass to that: [Object] for ObjectView or [URL] for
    SafariView. You''ll still need to use NavigationLink(value:) with the .navigationDestination(for:)
    modifier.'
  merge: -1
