  md: '# Swift Dive: Strings


    You''ll initially store the ratings as a string of "0000". When you need, for
    example, the first exercise, you''ll read the first character in the string. When
    you tap a new rating, you store the new rating back to the first character.


    This is extensible. If you add more exercises, you simply have a longer string.


    Skills you''ll learn in this section: Unicode; String indexing; nil coalescing
    operator; String character replacement


    Strings aren''t as simple as they may appear. To support the ever-growing demand
    for emojis, a string is made up of extended grapheme clusters. These are a sequence
    of Unicode values, shown as a single character, where the platform supports it.
    They''re used for some language characters and also for various emoji tag sequences,
    for example skin tones and flags.


    ```

    "\u270C" "\u270C\u1FFF" "\u1F166\u1F1FA" "\u1F1EA\u1F1F8"

    ```


    ![](img/b137d252894e5c4c3dd508961a85e251_199_0.png)


    ```

    "\u1F3F4\uE0067\uE0062\uE0077\uE006C\uE0073\uE007F"

    ```


    ![](img/b137d252894e5c4c3dd508961a85e251_199_1.png)


    Unicode tag sequences


    The Welsh flag uses seven tag sequences to construct the single character. On
    platforms where the tag sequence is not supported, the flag will show as a black
    flag.


    A String is a collection of these characters, very similar to an Array. Each element
    of the String is a Character, type-aliased as String.Element.'
