  md: "# Swift Error Checking\n\n**Skills you'll learn in this section:** throwing\
    \ and catching errors\n\nSaving and loading data is serious business, and if any\
    \ errors occur, you'll need to know them. There's not a lot you can do about file\
    \ system errors, but you can let your users know that there has been an error,\
