  md: "Include the gray background color in the list of colors:\n\n```\nGradient(colors:\
    \ [\n  Color(\"gradient-top\\),\n  Color(\"gradient-bottom\\),\n  Color(\"background\"\
    )\n])\n```\n\nIntroducing this third color means that the gradient is now divided\
    \ equally between the three colors and gives a less pleasing purple to blue gradient.\n\
    \n![](img/b137d252894e5c4c3dd508961a85e251_268_0.png)\n\nGray added to gradient\n\
    \nYou can control where the gradient changes using stops.\n\nReplace gradient\
    \ with:\n\n```\nvar gradient: Gradient {\n  let color1 = Color(\"gradient-top\"\
    )\n  let color2 = Color(\"gradient-bottom\")\n  let background = Color(\"background\"\
    )\n  return Gradient(\n    stops:\n      Gradient.Stop(color: color1, location:\
    \ 0),\n      Gradient.Stop(color: color2, location: 0.9),\n      Gradient.Stop(color:\
    \ background, location: 0.9),\n      Gradient.Stop(color: background, location:\
    \ 1)\n  )\n}\n```\n\nHere you use purple for 90% of the gradient. At the 90% mark,\
    \ you switch to the background color for the rest of the gradient. As you have\
    \ two stops right next to each other, you get a sharp line across instead of a\
    \ gradient."
