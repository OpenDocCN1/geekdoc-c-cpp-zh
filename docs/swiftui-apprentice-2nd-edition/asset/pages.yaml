- img_proc: true
  md: "To use this path, replace NavigationStack { with this:\n\n```\nNavigationStack(path:\
    \ $path) {\n```\n\nYou pass a binding to the navigation stack. Now, you can observe\
    \ the current state of the stack or modify path to specify where to navigate.\n\
    \nNow, add this modifier to NavigationStack, at the same level as the task that\
    \ calls fetchObjects(for:)\n\n```\n.openURL { in\n  if let id = url.host,\n  \
    \   let object = store.objects.first(\n      where: String($0.objectID) == id)\
    \ { // 1\n    if object.isPublicDomain { // 2\n      path.append(object)\n   \
    \ } else {\n      if let url = URL(string: object.objectURL) {\n        path.append(url)\n\
    \      }\n    }\n  }\n}\n```\n\nHere's what this does:\n\n+   1. Extract an id\
    \ value from the widget URL, then find the first object whose objectID matches\
    \ this value. Because url.host is a String, convert the objectID value to String\
    \ before comparing.\n\n+   2. If the object is in the public domain, append it\
    \ to path. Otherwise, append the URL created from its objectURL.\n\nAt the top\
    \ of ContentView, change query to peony: This query returns non-public-domain\
    \ objects, so you'll be able to test that tapping these objects opens the app\
    \ in SafariView."
