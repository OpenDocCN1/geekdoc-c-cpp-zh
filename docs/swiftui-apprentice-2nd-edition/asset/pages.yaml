  md: '+   In the Attributes inspector, change Scales to Single Scale.


    ![](img/b137d252894e5c4c3dd508961a85e251_441_0.png)


    This SVG with a transparent background has a native size of 200x500px. At build
    time, Xcode will create the appropriately scaled bitmap image from this and display
    it in the center of the screen. When you launch the app in landscape on iPhone,
    you''ll need an image with a smaller height, so you''ll use size classes to decide
    which image to load.


    # Size Classes


    Size classes represent the content area available using horizontal and vertical
    traits. These two traits can be regular or compact. All devices have either a
    regular or compact width class and either a regular or compact height class. You
    can find a list of these size classes in Apple''s Human Interface Guidelines (https://apple.co/348IVx0)
    under the section Device size classes.


    This is an illustration of some iPhones and iPads laid on top of each other:'
