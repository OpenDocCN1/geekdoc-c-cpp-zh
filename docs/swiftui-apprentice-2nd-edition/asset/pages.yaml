  md: 'This simple code controls execution of your app. The @main attribute indicates
    the entry point for the app and expects the structure to conform to the App protocol.


    SwiftITApp defines the basic hierarchy of your app, made up of:


    +   **HITTApp**: Conforms to App, which represents the entire app.


    +   **WindowGroup**: Conforms to Scene. A WindowGroup presents one or more windows
    that all contain the same view hierarchy.


    +   **ContentView**: Everything you see in a SwiftUI app is a View. Although the
    SwiftUI template creates ContentView, it''s a placeholder name, and you can rename
    it.


