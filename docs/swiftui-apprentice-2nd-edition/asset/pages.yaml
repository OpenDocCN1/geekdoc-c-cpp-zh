    This replaces the non-descriptive $0 with element.

    The code is equivalent to:


    ```

    var imageElements: [ImageElement] = []nfor element in elements {

    if element = element as? ImageElement {

    imageElements.append(element)

    }

    }

    ```


    The biggest advantage of using compactMap(:) is that imageElements is a constant.
    Is safer because you can''t accidentally add data to it at a later time. It''s
    also less code and more readable once you''re accustomed to using array methods
    as map(_) and filter(_). When necessary, you can compose them together to create
    arrays from complex operations.


