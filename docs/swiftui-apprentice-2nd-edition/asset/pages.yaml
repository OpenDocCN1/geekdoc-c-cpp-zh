  md: '# Layout


    Skills you''ll learn in this section: control view layout


    It''s time to take a deeper look at how SwiftUI handles view layout.Most of the
    time, SwiftUI views lay themselves out and look great, and you don''t have to
    think about the layout at all. But then comes the time you want exact positioning,
    or a view isn''t behaving the way you thought it would, and you might start fighting
    the system. Once you understand layout and treat it logically, then it all becomes
    much easier.


    Layout starts from the top of the view hierarchy. The parent view tells its children,
    “I propose this size”. Each child takes as much room as it needs within the parent''s
    available space and tells the parent “I only need this size”. This continues all
    way down the view hierarchy. The parent resizes itself to the size of its child
    views.


    +   - Create a SwiftUI View file named Layout.swift to experiment with various
    layouts.


    +   - In LayoutView_Previews, add a new modifier to LayoutView:


    ```

    .previewLayout(.fixed(width: 500, height: 300))

    ```


    This gives a fixed size to the preview of 500 x 300.


    +   - In the canvas, switch from Live to Selectable, to see the correct view preview
    size.


    ![](img/b137d252894e5c4c3dd508961a85e251_554_0.png)


    +   - In LayoutView, add a new modifier to Text:


    ```

    .background(Color.red)

    ```'
