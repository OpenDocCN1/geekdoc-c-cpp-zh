    You can now drag PNG image files to the various icon spots.


    +   - That''s a lot of work, so change All Sizes back to Single Size.


    # Vector vs Bitmap


    You imported a bitmap PNG image for the icon. For other assets, you can use vector
    formats, such as PDF or SVG. When possible, it''s always better to use vector
    formats. These are made up of lines, curves and fills. For a vector line, you
    can set a start point and an end point. When you scale the line, the vector resizes
    without losing any of its resolution. With a bitmap line, you must stretch or
    compress pixels.


    This image shows two 50 pixel wide images scaled up by twelve to 600 pixels. One
    is bitmap and the other is vector. You can see the vector image loses none of
    its sharpness.


