  md: '# Key Points


    +   - Saving data is the most important feature of an app. Almost all apps save
    some kind of data, and you should ensure that you save it reliably and consistently.
    Make it as flexible as you can, so you can add more features to your app later.


    +   - ScenePhase is useful to determine what state your app is in. Don''t try
    doing extensive operations when your app is inactive or in the background as the
    operating system can can kill your app at any time if it needs the memory.


    +   - JSON format is a standard for transmitting data over the internet. It''s
    easy to read and, and when you provide encoders and decoders, you can store almost
    anything in a JSON file.


    +   - Codable encompasses both decoding and encoding. You can extend this task
    and format your data any way you like.'
