  md: '# Initial App Idea


    The first step to creating a new app is having the idea. Before writing any code,
    you should research as to whether your app is going to be a hit or a miss. Work
    out who your target audience is and talk to some people who might use your app.
    Find out what your competition is in the App Store and explore how your app can
    offer something new and different.


    Once you''ve decided that you have a hit on your hands, sketch your app out and
    work out feasibility and where technical difficulties may lie.


    Your photo collage app will have a primary view — where you list all the cards
    — and a detail view for the selected card — where you can add photos and text.
    This might be the back-of-the-napkin sketch:


    ![](img/b137d252894e5c4c3dd508961a85e251_356_0.png)


    Back of the napkin sketch


    In future chapters, you''ll set up the data model and data storage, but for now,
    examine the design and think about possible implementation difficulties that you''ll
    need to overcome. Always take a modular approach and test each aspect of the app
    as separately from the main app as possible.


    SwiftUI is great for this, because you can construct views and controls independently
    using SwiftUI''s live preview. When you''re happy with how a view works, add it
    to your app.'
