  md: "In the canvas, the red color shows how much space the Text takes up on screen.\n\
    \n![](img/b137d252894e5c4c3dd508961a85e251_555_0.png)\n\nText with red background\n\
    \nThere are three views in the view tree hierarchy:\n\n+   LayoutView > Text (modified)\
    \ > Red\n\nLayoutView has a fixed size of 500 by 500 points. Text takes up the\
    \ amount of needed for the letters in the assigned font size. Color is a bit different.\
