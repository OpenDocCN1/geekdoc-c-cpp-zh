  md: '# Getting Started


    To develop iOS apps, you need a Mac with Xcode installed. If you have an account
    on GitHub or similar, you can connect to that from Xcode.


    # macOS


    To use the SwiftUI canvas, you need a Mac running Catalina (V10.15) or later.
    To install Xcode, your user account must have administrator status.


    # Xcode


    To install Xcode, you need 23 GB free space on your Mac''s drive.


    +   - Open the App Store app, then search for and GET Xcode. This is a large download
    — almost 8GB — so it takes a while. Fix yourself a snack while you wait or, to
    stay in the flow, browse Chapter 12, “Apple App Development Ecosystem”.

    - When the installation finishes, OPEN it from the App Store page:


    ![](img/b137d252894e5c4c3dd508961a85e251_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Note: You probably have your favorite way to open a Mac application, and it
    will work with Xcode, too. Double-click it in Applications. Or search for it in
    Spotlight. Or double-click a project''s .xcodeproj file.


    The first time you open Xcode after App Store installation, you''ll see this window:


    ![](img/b137d252894e5c4c3dd508961a85e251_23_0.png)


    Select the platforms you would like to install:'
