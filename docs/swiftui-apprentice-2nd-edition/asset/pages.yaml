  md: 'SwiftUI Apprentice


    Chapter 15: Structures, Classes & Protocols


    Swift keeps a count of the number of references to the Class object created in
    the heap. The reference count here would be two, and Swift won''t deallocate the
    object until its reference count is zero.


    Changing the data like this can be a source of errors for unwitting developers.
    One of Swift''s principles is to prevent accidental errors, and if you favor value
    types over reference types, you''ll end up with fewer of those accidents. In this
    app, you''ll favor structures and enumerations over classes where possible.


    # Creating the Card Store


    > **Skills you''ll learn in this section:** to use classes and structures


    Returning to the complex matter of deciding how to store your data, you need to
    choose between a structure and a class.


    In general, when you hold a simple piece of data, such as a Card or a CardElement,
    those are lightweight objects that you won''t need forever. Typically, you''d
    make those a structure. However, when you hold a data store that you''re going
    to use throughout your app, that''s a good candidate for a class. In addition,
    if your data has publisher properties, it must conform to ObservableObject, which
