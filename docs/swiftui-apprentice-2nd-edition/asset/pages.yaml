  md: '# Not Stopping


    Here''s a trick that will make your Xcode life a little easier.


    +   **Don''t click** the stop button. Yes, it''s enabled. But trust me, you''ll
    like this. ]


    +   **In ByeView.swift**, replace "Bye bye" with "Hello again":


    ```

    Text("Hello again, World!")

    ```


    +   Click the run button or press **Command-R.**


    Up pops this message:


    ![](img/b137d252894e5c4c3dd508961a85e251_59_0.png)


    +   **Don''t click Replace yet**, although that will work: The currently running
    process will stop, and the new process will run. This dialog will appear every
    time you forget to stop the app. It''s just a moment, but it jars a little. Every
    time. And it''s easy to get rid of.


    +   **Check Don''t ask again, then** **Replace.**


    The app loads with your new change. But that''s not what I want to show you.


    +   Once more: Click the run button or press **Command-R.**


    No annoying message, no "doh! moment, ever again! You''re welcome. ]'
