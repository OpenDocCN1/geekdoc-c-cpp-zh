  md: 'In LazyView, remove .frame(maxWidth: .infinity) and change HStack to:


    ```

    LazyHStack

    ```


    ![](img/b137d252894e5c4c3dd508961a85e251_558_0.png)


    LazyHStack fills the container vertically


    Because the stack can determine the height of items that might be loaded later,
    it takes the vertical size of the parent container, and the color fills that area.
    Similarly, LazyVStack and LazyVGrid fill the horizontal size of the parent container.


    Undo LazyHStack back to HStack.


    Later in the chapter, you''ll explore GeometryReader, which takes up the entire
    available space of its parent and returns the size in points. Use GeometryReader
    as a last resort as there are usually other ways to achieve a fluid, animatable
    layout.


