  md: "# SwiftUI Apprentice Chapter 17: Adding Photos to Your App\n\nSo far, so good.\
    \ You can drag an image to your card, and you can drag some text to your card.\
    \ The only problem is that you have to change the code each time.\n\nYou can overcome\
    \ this problem with a custom transfer that conforms to Transferable.\n\n+   In\
    \ the Model group, create a new Swift file named CustomTransfer.swift and replace\
    \ the code with:\n\n```\nimport SwiftUI\nstruct CustomTransfer: Transferable {\n\
    \    var image: UIImage?\n    var text: String?\n\n    public static var transferRepresentation:\
    \ some {\n        DataRepresentation(importedContentType: .image) { data in\n\
    \            let image = UIImage(data: data)\n?? UIImage(named: \"error-image\"\
    )\n            return CustomTransfer(image: image)\n        }\n        DataRepresentation(importedContentType:\
    \ .text) { data in\n            let text = String(decoding: data, as: UTF8.self)\n\
    \            return CustomTransfer(text: text)\n        }\n    }\n}\n```\n\nCustomTransfer\
    \ contains two properties, one for text and one for image. The transfer representation\
    \ takes into account the image type and the text type and fills the relevant property.\
    \ For images, the data representation is the same as you did for UIImage, and\
    \ for text, you create a String from the data. UTF8 is the most common encoding\
    \ system.\n\nOnce CustomTransfer has created either an image or some text from\
    \ the transferred data, you'll add an element to the card.\n\n+   Open Card.swift\
    \ and add this method:\n\n```\nmutating func addElements(from transfer: [CustomTransfer])\
    \ {\n    for element in transfer {\n        if let text = element.text {\n   \
    \         addElement(text: TextElement(text: text))\n        } else if let image\
    \ = element.image {\n            addElement(image: image)\n        }\n    }\n\
    }\n```\n\n481"
  merge: -1
