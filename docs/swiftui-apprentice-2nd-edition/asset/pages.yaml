  md: '# Key Points


    +   * URLSession API involves many different classes that work together in a fairly
    complex way. For simple download tasks, use the built-in shared session. Use URLComponents
    to create a URL-encoded URL for the endpoint string and query parameters, create
    a URLRequest from URL. Send this request with data(::) and await the Data instance
    and URLResponse object. If the status indicates success, use JSONDecoder to decode
    the data into your data model.

    * Create a separate structure to define your networking methods, then instantiate
    this in your data model.

    * Asynchronous methods run on background threads. Any code that updates the user
    interface must run on the main thread. One way to do this is to call MainActor.run.

    * Playgrounds are useful for working out code. You can quickly inspect values
    produced by methods and operations.'
