  md: '# Creating an App Group


    > **Xcode Tip:** App group containers allow apps and targets to share resources.


    Whenever the user changes the query term in your app, fetchObjects(for:) downloads
    and changes new objects array. To share this array with your widget, you''ll create
    an app group. Then, in **TheMetStore.swift**, you''ll write a file to your app
    group, which you''ll read from **TheMetWidget.swift**.


    +   * If you have several targets yet, do it: In the **Project** navigator, select
    the top level **TheMet** folder for each target, change the bundle identifier
    prefix to your organization to **com.yourcompany** and set the team.

    * Now select the **TheMet** target. In the **Signing & Capabilities** tab, click
    **+ Capability**, drag App Groups into the window. Click to add a new container.


    ![](img/b137d252894e5c4c3dd508961a85e251_709_0.png)


    Add new app group.


    +   * Name your container **group.your.prefix.TheMet.objects**. Be sure to replace
    **your.prefix** with your bundle identifier prefix. Click the reload button if
    the color of your group doesn''t change from red to black.


    +   * Now select the **TheMetWidgetExtension** target and add the **App Groups**
    capability. If necessary, scroll through the **App Groups** to find and select
    **group.your.prefix.TheMet.objects**.'
