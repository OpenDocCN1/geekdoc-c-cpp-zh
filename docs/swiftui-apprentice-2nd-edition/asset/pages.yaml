  md: '# Stroke Style


    When you define a stroke, instead of giving it a lineWidth, you can give it a
    StrokeStyle instance.


    For example:


    ```

    currentShape

    .stroke(style: StrokeStyle(dash: [30, 10]))

    ```


    ![](img/b137d252894e5c4c3dd508961a85e251_504_0.png)


    StrokeStyle with dash


    With a stroke style, you can define what the outline looks like — whether it is
    dashed, how the dash is formed and how the line ends look.


    To form a dash, you create an array which defines the number of horizontal points
    of the filled section followed by the number of horizontal points of the empty
    section.


    ```

    StrokeStyle(lineWidth: 10, dash: [5, 10, 1, 5])

    ```


    The example above describes a dashed line where you have a 5 point vertical line,
    followed by a 10 point space, followed by one point vertical line, followed by
    a 5 point space.


    ```

    StrokeStyle(lineWidth: 10, dash: [5, 10, 1, 5], dashPhase: 15)

    ```


    This second example adds a dash phase, which moves the start of the dash to the
    right by 15 points, so that the dash starts with the one point line.


    > Swift tip: You haven''t done much animation so far as you''ll cover this later
    in Chapter 21, “Delightful UX — Final Touches", but these dashed line parameters
    are animatable, so you can easily achieve the "marching ants" marquee look.'
