  md: '# # Chapter 8: Saving History Data


    By Caroline Begbie


    AppStorage is excellent for storing lightweight data such as settings and other
    app initialization. You can store other app data in property list files, in a
    database such as SQLite or Realm, or in Core Data. Since you''ve learned so much
    about property list already, you''ll save the history data to one in this chapter.


    The saving and loading code itself is quite brief, but when dealing with data,
    you should always be aware that errors might occur. As you would expect, Swift
    has comprehensive error handling so that, if anything goes wrong, your app can
    recover gracefully.


    In this chapter, you''ll learn about error checking techniques as well as saving
    and loading from a property list file. Specifically, you''ll learn about:


    +   - **Optionals**: nil values are not allowed in Swift unless you define the
    property type as Optional.

    - **Debugging**: You''ll fix a bug by stepping through the code using breakpoints.

    - **Error Handling**: You''ll throw and catch some errors, which is just as fun
    as it sounds. You''ll also alert the user when there is a problem.

    - **Closures**: These are blocks of code that you can pass as parameters or use
    completion handlers.

    - **Serialization**: Last but not least, you''ll translate your history data into
    a format that can be stored.'
