  md: '# Chapter 7: Saving Settings


    AppStorage only allows a few types: String, Int, Double, Data, Bool and URL. For
    simple pieces of data, such as user-configurable app settings, storing data to
    UserDefaults with AppStorage is incredibly easy.


    > Note: When UserDefaults is stored in a fairly secure directory, you shouldn''t
    save sensitive data as login details or other authentication codes. For those
    use the keychain. See Apple''s article: Storing Keys in the Keychain (https://apple.co/5evbAkA).


    +   Stop the app in Simulator, by swiping up the bottom. Then, run your app and
    go to the same exercise. Your rating persists between launches.


    > Note: When using AppStorage and @SceneStorage, always make sure you exit the
    app in Simulator or on your device before terminating the app in Xcode. Your app
    may not save data until the system notifies it of a change in state.


    You''ve solved the data persistence problem, but caused another. Unfortunately,
    as you only have one rating key for all ratings, you are only storing a single
    value in UserDefaults. When you go to another exercise, it has the same rating
    as the first one. If you set a new rating, all the other exercises have that rating.


    You really need to store an array of ratings, with an entry for each exercise.
    For example, an array of [1, 4, 3, 2] would store individual rating values for
    exercises 1 to 4. Before fixing this problem, you''ll find out how Xcode stores
    app data.


