    # Challenge 1: Save & Load the Card Thumbnail


    Currently, the list of cards doesn''t show a preview of the card. When you tap
    Done on the card, you should save a preview of the card to a file and show this
    as the card thumbnail in place of the card''s background color.


    To achieve this:


    +   1. Locate the code where you save the card in SingleCardView.swift. First
    use UIImage.screenshot(size:) to generate a UIImage and then save the UIImage
    to a file. UIImageExtensions.swift contains a method UIImage.save(to:) to save
    the file. Use card.id.uuidString as the filename.

    2. In CardThumbnail.swift, load this file. There''s a UIImage.load(uuidString:)
    method in UIImageExtensions.swift. If the load is successful, show the image.
    If not, show the card''s background color. Enclose the two alternative views in
    a Group and place the modifiers on the group, rather than on the background color.


    If you have done this part correctly, when testing in Simulator, the card thumbnail
    image will load when you run the app, but not when you change a card by moving
    one of the elements. In CardsListView.swift, CardThumbnail will only refresh if
    there are published changes. CardThumbnail uses card from store.cards, and this
    is the property that you need to update.'
