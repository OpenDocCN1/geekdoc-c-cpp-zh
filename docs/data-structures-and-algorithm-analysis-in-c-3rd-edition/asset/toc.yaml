- - '####'
  - Example 11.4 Figure 11.24 shows the first three steps of Kruskal’s Algorithm for
    the graph of Figure 11.20. Edge (C, D) has the least cost, and because C and D
    are currently in separate MSTs, they are combined. We next select edge (E, F)
    to process, and combine these vertices into a single MST. The third edge we process
    is (C, F), which causes the MST containing Vertices C and D to merge with MST
    containing Vertices E and F. The next edge to process is (D, F). But because Vertices
    D and F are currently in the same MST, this edge is rejected. The algorithm will
    continue on to accept edges (B, C) and (A, C) into the MST.
