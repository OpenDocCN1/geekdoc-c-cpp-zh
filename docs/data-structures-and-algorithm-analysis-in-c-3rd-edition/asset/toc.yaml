  - 17.12 设想你有一个问题 P，你知道它是 NP 完全的。对于这个问题，你有两个算法可以求解它。对于每个算法，P 的某些问题实例在多项式时间内运行，另一些则在指数时间内运行（现实中很多针对
    NP 完全问题的基于启发式的算法都有这种行为）。对于任何给定的问题实例，你无法事先判断它在任一算法上会以多项式时间还是指数时间运行。然而，你确实知道，对于每个问题实例，两个算法中至少有一个会在多项式时间内解决它。
