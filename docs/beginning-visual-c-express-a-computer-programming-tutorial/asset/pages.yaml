- img_proc: true
  md: '# Beginning Visual C# Express


    # Debugging a Visual C# Express Project


    No matter how you plan your project and no matter how careful you are in implementing
    your ideas in the controls and event methods, you will make mistakes. Errors,
    or what computer programmers call bugs, do creep into your project. You, as a
    programmer, need to have a strategy for finding and eliminating those bugs. The
    process of eliminating bugs in a project is called debugging. Unfortunately, there
    are not a lot of hard, fast rules for finding bugs in a program. Each programmer
    has his or her own way of attacking bugs. You will develop your ways. We can come
    up with some general strategies, though, and that''s what we''ll give you here.


    Project errors, or bugs, can be divided into three types:


    +   * Syntax errors

    * Run-time errors

    * Logic errors


    Syntax errors occur when you make an error setting a property in design mode or
    when typing a line of C# code. Something is misspelled or something is left out
    that needs to be there. Your project won''t run if there are any syntax errors.
    Run-time errors occur when you try to run your project. It will stop abruptly
    because something has happened beyond its control. Logic errors are the toughest
    to find. Your project will run OK, but the results it gives are not what you expected.
    Let''s examine each error type and address possible debugging methods.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Labels, Text Boxes, Variables


    # Syntax Errors


    Syntax errors are the easiest to identify and eliminate. The Visual C# Express
    program is a big help in finding syntax errors. Syntax errors will likely occur
    as you''re setting properties for the controls or writing C# code for event methods.


    Start a new project in Visual C# Express. Go to the project window and try to
