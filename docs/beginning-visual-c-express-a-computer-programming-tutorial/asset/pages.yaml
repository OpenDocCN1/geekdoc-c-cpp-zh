- img_proc: true
  md: '# Beginning Visual C# Express


    # Write Event methods


    The Beach Balls game is simple, in concept. To play, click the Start button. Five
    balls drop down the panel, each at a different speed. Use the keyboard to move
    the arrow. If the arrow is under a ball when a collision occurs, the ball pops
    and you get a point. Balls reappear at the top after popping or reaching the bottom
    of the screen without being popped. You pop as many balls as you can in 60 seconds.
    At that point, a ‘Game Over’ message appears. You can click Start to play again
    or click Exit to stop the program.


    It looks like there are only three events to code, clicking the Start button,
    clicking the Exit button, or using picBalls_KeyDown to check for arrow key presses.
    But, recall there are two timer controls on the form. The control named timBalls
    controls the ball animation, updating the panel 10 times a second (Interval is
    100). The timer control named timGame controls the overall time of the game. It
    generates a Tick event only once - when the game is over (Interval is 6000 - that''s
    60 seconds). So, in addition to button clicks and key down events, we need code
    for two Timer events. There is a substantial amount of C# code to write here,
    even though you will see a lot of repetition. I suggest writing the event methods
    in stages. Write one method or part of a method. Run the project. Make sure the
    code you wrote works. Add more code. Run the project again. Make sure the added
    code works. Continue adding code until complete.


    Building this project way minimizes the potential for error and makes the debugging
    process much easier. Let’s go.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# Timers, Animation, Keyboard Events 10-49


    Each ball will occupy a square region. We will compute the size (ballSize) of
    the ball to fit nicely on the panel. We need array variables to keep track of
    each ball''s location (ballX, ballY) and dropping speed (ballSpeed). We need to
    know the arrow''s size (arrowSize) and position (arrowX). We also need a object
    to draw the balls (myGraphics) and a blank brush object (blankBrush, for erasing
    balls). Lastly, we need a random number object (myRandom). Add this code to the
    general declarations area:


    ```

    int ballSize;

    int[] ballX = new int[5];

    int[] ballY = new int[5];

    int[] ballSpeed = new int[5];

    int arrowX;

    Graphics myGraphics;

    Brush blankBrush;

    Random myRandom = new Random();

    ```


    The array ballSpeed holds the five speeds, representing the number of pixels a
    ball will drop with each update of the viewing panel. We want each ball to drop
    at a different rate. In code, each speed will be computed using:


    ```

    Random.Next(4) + 3

    ```


    Or, will it be a random value between 3 and 6. A new speed will be computed each
    time a ball starts its trip down the panel. How do we know this will be a good
    speed, providing reasonable dropping rates? We didn''t before the project began.
    This expression was arrived at by ''trial and error.'' We built the game and tried
    different speeds until we found values that worked. You do this a lot in developing
    games. You may not know for some numbers before you start. So, you go ahead and
    build the game and try all kinds of values until you find ones that work. Then,
    you build these numbers into your code.'
  merge: -1
