  md: '# UpDown Control, Decisions, Random Numbers 6-13


    The or operator is second in precedence to the and operator (that is, and is done
    before or), and all logical operators come after the comparison operators in precedence.
    Use of comparison operators and logical operators to form logical expressions
    is key to making proper decisions in C#. Make sure you understand how the operators
    (and their precedence) work. Let''s look at some examples to help in this understanding.


    In these examples, we will have two integer variables aInteger and bInteger, with
    values:


    ```

    aInteger = 14

    bInteger = 7

    ```


    What if we want to evaluate the logical expression:


    ```

    aInteger > 10 && bInteger > 10

    ```


    Comparisons are done first, left to right since all comparison operators share
    the same level of precedence. aInteger (14) is greater than 10, so aInteger >
    10 is true. bInteger (7) is not greater than 10, so bInteger > 10 is false. Since
    one expression is not true, the result of the and (&&) operation is false. This
    expression ''aInteger > 10 && bInteger > 10'' is false. What is the result of
    this expression:


    ```

    aInteger > 10 || bInteger > 10

    ```


    Can you see this expression is true (aInteger > 10 is true, bInteger > 10 is false;
    || false is true)?'
