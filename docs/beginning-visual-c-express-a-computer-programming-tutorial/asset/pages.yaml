  md: 'When you click Pick Number, the computer needs to perform the following steps:


    +   * Pick a random integer number between 0 and 100.

    * Display a message to the user.

    * Enable the numeric updown control to allow guesses.

    * Enable the Check Guess button to allow guesses.


    And, we will add one more step. Many times in Visual C# Express, you might want
    to change the function of a particular control while the program is running. In
    this game, once we click Pick Number, that button has no further use until the
    number has been guessed. But, we need to use a button to tell us the answer if
    we choose to give up before guessing it. We will use btnPick to do this. We will
    change the Text property and add decision logic to see which ''state'' the button
    is in. If the button says “Pick Number” when it is clicked (the initial state),
    the above steps will be followed. If the button says “Show Answer” when it is
    clicked (the ''playing'' state), the answer will be shown and the form controls
    returned to their initial state. This is a common thing to do in Visual C# Express.'
