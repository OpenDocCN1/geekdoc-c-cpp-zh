- img_proc: true
  md: '# B-76 Beginning Visual C# Express


    # Project 8 - Frown


    # Project Design


    Frown is a fun two-player dice game you play against the computer. You play with
    a set of two dice that are normal except the side of the die where the “1” would
    be replaced by a frowning face. The object of the game is to achieve a score of
    100 points. Players alternate turns, which consist of a series of at least one
    roll of the dice, perhaps many, subject to the following rules.


    As long as no frown appears on either die, the roller builds a running score for
    the current turn. After each roll with no frown, the player can choose to continue
    rolling or pass the dice to the other player. If the player passes the dice, the
    current score is added to any previous total. If a frown appears, the player loses
    the points gained on the current turn. If two frowns appear, the player loses
    the current points and all saved points! There is a considerable amount of luck
    involved. However, the skill of deciding when to pass the dice to your opponent
    also figures prominently. The project you are about to build is saved as Frown
    in the project folder (\BeginVCSE\BVCSE Projects).'
  merge: -1
