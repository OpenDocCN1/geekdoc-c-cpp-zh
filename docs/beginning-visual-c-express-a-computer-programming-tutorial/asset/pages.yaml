  md: '# Beginning Visual C# Express


    Collision Detection


    Another requirement needed in animation is to determine if two images have collided.
    This is needed in games to see if a ball hits paddle, if an alien rocket hits
    its target, or if a cute little character grabs some reward. Each image is described
    by a rectangular area, so the collision detection problem is to see if two rectangles
    collide, or overlap. This check is done using each image''s position and dimensions.


    Here are two images (image1 and image2) in a panel control:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_395_0.png)


    image1 is positioned at (image1X, image1Y), is image1W wide and image1H high.
    Similarly, image2 is positioned at (image2X, image2Y), is image2W wide and image2H
    high.'
