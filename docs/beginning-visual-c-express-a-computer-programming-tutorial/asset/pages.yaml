  md: '# C# - The Final Lesson


    In this last C# lesson, we study some simple animation techniques, look at math
    needed with animations, and learn how to detect keyboard events.


    # Animation - DrawImage Graphics Method


    In the last example, we saw that by using a timer to periodically change the display
    in a panel control, a sense of motion, or animation, is obtained. We will use
    that idea here to do a specific kind of animation - moving objects around. This
    is the basis for nearly every video game ever made. The objects we move will be
    images contained in Visual C# Express box controls.


    Moving images in a panel is easy to do. First, establish an image (set the Image
    property) in the picture box. This image is then placed in the panel control using
    the DrawImage graphics method. Like the other graphics methods we''ve seen (DrawLine
    and DrawEllipse), before using DrawImage, you need to establish a graphics object
    to draw. The graphics object is declared in the usual manner (usually in the general
    declarations area):


    ```

    Graphics myGraphics;

    ```


    We then create the graphics object (assume myControl is the host control; we''ll
    use a panel):


    ```

    myGraphics = myControl.CreateGraphics();

    ```


    This creation usually occurs in the form Load method. You dispose of the object
    in the form FormClosing method.'
