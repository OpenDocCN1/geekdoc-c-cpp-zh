  md: '# UpDown Control, Decisions, Random Numbers 6-19


    What if, in our lemonade stand example, we want to divide our pricing structure
    into several different cost values, based on several different temperature values?
    The if structure can be modified to include an else if statement to consider multiple
    logical expressions. Such a structure is:


    ```

    if (expression1)

    {

    [C# code block to be executed if expression1 is true]

    }

    else if (expression2)

    {

    [C# code block to be executed if expression2 is true]

    }

    else if (expression3)

    {

    [C# code block to be executed if expression3 is true]

    }

    else

    {

    [C# code block to be executed if expression1, expression 2, and expression3 are
    all false]

    }

    ```


    Can you see what happens here? It''s pretty straightforward - just work down the
    code. If expression1 is true, the first block of C# code is executed. If expression1
    is false, the program checks to first block if expression2 (using the else if)
    is true. If expression2 is true, that block of code is executed. If expression2
    is false, expression3 is evaluated. If expression3 is true, the corresponding
    code block is executed. If expression3 is false, and note by this time, expression1,
    and expression3 have all been found to be false, the code in the else block (and
    this is optional) is executed.


    You can have as many else if statements as you want. You must realize, however,
    that only one block of C# code in an if structure will be executed. This means
    that once C# has found a logical expression that is true, it will execute that
    block of code then leave the structure and execute the first line of code following'
