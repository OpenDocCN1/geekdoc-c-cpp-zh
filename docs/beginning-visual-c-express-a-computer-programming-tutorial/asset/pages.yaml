  md: '# Declaring Variables


    Once we have named a variable and determined what type we want it to be, we must
    relay this information to our Visual C# Express project. We need to declare our
    variables. (We don''t have to declare control properties since Visual C# Express
    already knows about them.) The statement used to declare a variable named variableName
    as type type is:


    ```

    type variableName;

    ```


    We need a declaration statement like this for every variable in our project. This
    may seem like a lot of work, but it is worth it. Proper variable declaration makes
    programming easier, minimizes the possibility of program errors, and makes later
    program modification easier.'
