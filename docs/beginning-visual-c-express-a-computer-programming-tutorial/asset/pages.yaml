  md: '# 2. The Visual C# Express Design Environment


    # Review and Preview


    In Class 1, we learned the important parts of a Visual C# Express project. We
    saw that a project is built on a **form using controls** (also called objects).
    By interacting with the controls using **events**, we get the computer to do assigned
    tasks via instructions we provide. In this second class, we will learn the beginning
    steps of building our own Visual C# Express projects by looking at the different
    parts of the project and where they fit in the Visual C# Express design environment.
    Like Class 1, there are also a lot of new terms and skills to learn.


    ![](img/c63eb66eb41098f8665780f53d3f34a3_46_0.png)'
