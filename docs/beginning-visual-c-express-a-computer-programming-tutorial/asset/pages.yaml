    BEGINNING C# EXPRESS FOR HIGH SCHOOL STUDENTS is a self-paced semester long "beginning"
    programming tutorial consisting of 10 Chapters (in simple, easy-to-follow how)
    to build a C# Express Windows application. Students learn about project design,
    the C# toolbox, and many elements of the C# language. Numerous detailed examples
    are used to demonstrate every step in the building process. The tutorial also
    includes several detailed computer projects for students to build and try.


    These projects include a number guessing game, card game, allowance calculator,
    drawing program, capital games, and a couple of video games like Pong. We also
    include several college prep projects including a loan calculator, portfolio manager,
    and balancer.


    BEGINNING C# EXPRESS FOR HIGH SCHOOL STUDENTS is presented using a combination
    of over 500 pages of FULL-COLOR course notes and actual C# Express examples. No
    programming experience is necessary, but familiarity with common tasks using Windows
    is expected.


    The course requires Windows 7 or Windows 8 and Visual C#2012. The Visual C# source
    code and all needed multimedia files are available for download from the publisher''s
    website (www.Kidwaresoftware.com) after book registration.


    # ABOUT THE AUTHORS:


    Philip Conrad holds a BS in Computer Information Systems and a Master''s certificate
    in the Essentials of Business Development from Regis University. Philip has authored,
    co-authored and edited numerous computer programming books since 1983. In addition,
    he has also held various Information leadership roles in companies like Lindestrand
    Aerospace, Safeco Insurance, FamilyLife, Kenworth Truck Company, PCCAR Inc., and
    Dargold Inc. Philip serves as the President & Publisher of BibBibleBooks & Kidware
    Software LLC.


    Lou Tyler holds BS and MS in Mechanical Engineering and a PhD in Electrical Engineering.
    Lou has written software to control systems for high speed ground vehicles, monitor
    nuclear powers, lower levels in complex jetliners, compute takeoff speeds for
    jetliners, locate and identify air and ground traffic and to let kids learn how
    to spell and do math problems. Lou has written numerous-line texts and books teaching
    Visual Basic, C# and Java to thousands of people. Lou taught a beginner Visual
    Basic course for 15 years at a major Washington State


    You can find more Computer Tutorials for Small Basic*, Visual Basic*, Visual C#
    and Java™ at: www.Kidwaresoftware.com


