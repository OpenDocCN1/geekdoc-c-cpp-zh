  md: "# MouseUp Event\n\nThe **MouseUp** event is the opposite of the MouseDown event.\
    \ It is triggered whenever a previously pressed mouse button is released. The\
    \ method format is:\n\n```\nprivate void controlName_MouseUp(object sender,\n\
    {\n    [C# code for MouseUp event]\n}\n```\n\nNotice the arguments for MouseUp\
    \ are identical to those for MouseDown. The only difference here is **e.Button**\
    \ tells us which mouse button was released. In a drawing program, the **MouseUp**\
    \ event signifies the halting of the current drawing process.\n\n# Example\n\n\
    Cut the code from the **panel1_MouseDown** method in our example (highlight the\
