  md: '# Example


    Put Visual C# Express and start a new project. Put a group box on the form and
    resize it so it is fairly large. Select the button control in the Visual C# Express
    toolbox. Drag the control until it is over the group box. Drop the control in
    the group box. Move the group box and the button should move with it. If it doesn''t,
    it is not properly placed in the group box. If you need to delete the control,
    select it then press the Del key on the keyboard. Try moving the button out of
    the group box onto the form. Move the button back in the group box.


    Put a second button in the group box. Put a numeric updown control in the group
    box. Notice how the controls are associated with the group box. Warning: if you
    delete the group box, the associated controls will also be deleted! Run the project.
    Notice you can click on the buttons and use the numeric updown control. Stop the
    project. Set the group box Enabled property to False. Run the project again. Notice
    the group box title (set by the Text property) is grayed and all of the controls
    on the group box are now disabled - you can''t click the buttons or updown control.
    Hence, by simply setting one Enabled property (that of the group box), we can
    enable or disable a number of individual controls. Stop the project. Reset the
    group box Enabled property to True. Set the Visible property to False (will remain
    visible in design mode). Run the project. The group box and all its controls will
    not appear. You can use the Visible property of the group box to hide (or make
    appear) some set of controls (if your project requires such a step). Stop the
    project.'
  merge: -1
