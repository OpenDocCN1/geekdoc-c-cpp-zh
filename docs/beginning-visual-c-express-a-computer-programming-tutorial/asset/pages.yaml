  md: '# Beginning Visual C# Express


    # Group Box Control


    a group box is simply a control that can hold other controls. Group boxes provide
    a way to separate and group controls and have an overall enable/disable feature.
    This means if you disable the group box, all controls in the group box are also
    disabled. The group box has no events, just properties. The only events of interest
    are events associated with the controls in the group box. Writing event methods
    for these controls is the same as if they were not in a group box. The group box
    is selected from the toolbox. It appears as:


    In Toolbox:


    On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_227_0.png)


    # Properties


    The group box properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify group box. Three letter prefix for group box names
    is **grp**. |

    | Text | Title information at top of group box. |

    | Font | Sets style, size, and type of title text. |

    | BackColor | Sets group box background color. |

    | ForeColor | Sets color of title text. |'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-9


    | Property | Description |

    | --- | --- |

    | Left | Distance from left side of form to left side of group box |

    | Top | Distance from top side of form to top side of group box |

    | Width | Width of the group box in pixels |

    | Height | Height of group box in pixels |

    | Enabled | Determines whether all controls within group box can respond to user
    events (in run mode) |

    | Visible | Determines whether the group box (and attached controls) appears on
    the form (in run mode) |


    Like the Form object, the group box is a container control, since it ''holds''
    other controls. Hence, controls placed in a group box will share BackColor, FormControl
    properties. To change this, select the desired control (after it is placed on
    the group box) and change the desired properties.


    Moving the group box control on the form uses a different process than other controls.
    To move the group box, first select the control. Note a ''built-in'' handle (looks
    like two sets of arrows) for moving the control appears at the upper left corner:


    Moving handle


    ![](img/c63eb66eb41098f8665780f53d3f34a3_228_0.png)


    Click on this handle and you can move the control.'
