  md: "# Beginning Visual C# Express\n\n# Write Event Methods\n\nThe idea of the program\
    \ is simple. Type a value in the text box and choose the units (both From and\
    \ To). With each change in value, units or number of decimals, the conversion\
    \ is updated. Most of the computation is involved with the txtFromValue_Change\
    \ event. Note how the conversion factors are stored in a two-dimensional array\
    \ (table). Also note the use of the NumberFormatinfo object to specify the number\
    \ of decimals to display. To use this object, you need these two lines after the\
    \ left brace declaring the project namespace (right at the top of the code window):\n\
    \n```\nusing System;\nusing System.Globalization;\n```\n\nAdd this code to the\
    \ general declarations area:\n\n```\nstring[] units = new string[7];\ndouble [,]\
    \ conversions = new double[7, 7];\nbool loading = true;\nNumberFormatInfo provider\
    \ = new CultureInfo(\"en-US\",\nfalse).NumberFormat;\n```\n\nThe Form1_Load event\
    \ method:\n\n```\nprivate void Form1_Load(object sender, EventArgs e)\n{\n   \
    \ int i;\n    // Establish conversion factors - stored in two\ndimensional array\n\
    \    // or table - the first number is the table row, the\nsecond number\n   \
    \ // the table column\n    conversions[0, 0] = 1; //in to in\nconversions[0, 1]\
    \ = 1.0 / 12; //in to ft\nconversions[0, 2] = 1.0 / 36; // in to yd\nconversions[0,\
    \ 3] = (1.0 / 12) / 5280; // in to mi\n```"
