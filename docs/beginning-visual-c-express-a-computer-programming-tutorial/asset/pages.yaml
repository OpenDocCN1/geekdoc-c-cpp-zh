  md: '# B-112 Beginning Visual C# Express


    # Run the Project


    Save your work. Run the project. Try balancing your latest bank statement with
    your checkbook - here''s the procedure. Start on the left side of the form. Fill
    in your statement balance and click **Enter Statement Balance**. Next, enter each
    deposit you have made that is not recorded on the bank statement. After each entry,
    click **Add Uncredited Deposit**. Next, enter each check you have written that
    is not listed on the statement. After each check, click **Subtract Outstanding
    Check**. When done, your **Adjusted Statement Balance** is shown. Clicking **Reset
    Statement Values** will set everything on the left side back to default values.


    Now to the right side of the form. Fill in your checkbook balance and click **Enter
    Checkbook Balance**. Next, enter each deposit shown on your bank statement that
    you forgot to enter in your checkbook. After each entry, click **Add Unrecorded
    Deposit**. Next, enter any service charge the bank may have charged or any check
    that you haven''t recorded in your checkbook. After each charge, click **Subtract
    Charge / Forgotten Check**. When done, your **Adjusted Checkbook Balance** is
    shown. Clicking **Reset Checkbook Values** will set everything on the left side
    back to default values.'
