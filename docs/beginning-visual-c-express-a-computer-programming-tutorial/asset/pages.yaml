- img_proc: true
  md: '# C# - The Third Lesson


    In the C# lesson for this class, we learn about one of the more useful functions
    of a computer program - decision making. We will discuss expressions and operators
    used in decisions and how decisions can be made. We will also look at a new C#
    function - the random number. This function is the heart of every computer game.


    # Logical Expressions


    You may think that computers are quite smart. They appear to have the ability
    to make amazing decisions and choices. Computers can beat masters at chess and
    help put men and women into space. Well, computers really aren''t that smart -
    the only decision making ability they have is to tell if something is **true**
    or **false**. But, computers have the ability to make such decisions very quickly
    and that''s why they appear smart (and because, unlike the True or False tests
    you take in school, computers always get the right answer!). To use C# for decision
    making, we write all possible decisions in the form of **true or false?** statements,
    called **logical expressions**. We give the computer a logical expression and
    the computer will tell us if expression is true or false. Based on that, we can
    take whatever action we want in our computer program. Note the result of a logical
    expression is a **bool** type value.


    Say in a computer program we need to know if the value of the variable **aValue**
    larger than the value of the variable **bValue**. We would ask the computer (by
    writing some C# code) to provide an answer to the true or false? statement: “aValue
    is larger than bValue.” This is an example of a logical expression. If the computer
    told us this was true, we could take one set of C# steps. If it was false, we
    could take another. This is how decisions are done in C#.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'To make decisions, we need to know how to build and use logical expressions.

    The first step in building such expressions is to learn about comparison operators.'
