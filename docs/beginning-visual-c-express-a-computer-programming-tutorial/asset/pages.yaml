  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-13


    # Check Box Control


    A check box provides a way to make choices from a group of things. When a check
    box is selected, a check appears in the box. Each check box acts independently.
    Some, all, or none of the choices in the group may be selected. An example of
    where boxes could be used is choosing from a list of ice cream toppings. You might
    want it plain, you might want a couple of toppings, you might want it with the
    works - you decide. Check boxes are also used individually to indicate whether
    a particular project is active. For example, it might indicate if a control''s
    text is bold (checked) or not bold (unchecked).


    Check boxes are usually grouped in a group box control. The check box control
    is selected from the toolbox. It appears as:


    # In Toolbox:


    # On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_232_0.png)


    # Properties


    The check box properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify check box. Three letter prefix for check box names
    is **chk**. |

    | Text | Identifying text next to check box. |

    | TextAlign | Specifies how the displayed text is positioned. |

    | Font | Sets style, size, and type of displayed text. |

    | Checked | Indicates if box is checked (True) or unchecked (False). |'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Beginning Visual C# Express


    **BackColor** Sets check box background color.


    **ForeColor** Sets color of displayed text.


    **Left** If on form, distance from left side of form to left side of check box.
    If in group box, distance from left side of group box to left side of check box
    (X in properties window).


    **Top** If on form, distance from top side of form to top side of check box. If
    in group box, distance from top side of group box to top side of check box (Y
    in properties window).


    **Width** Width of the check box in pixels.


    **Height** Height of check box in pixels.


    **Enabled** Determines whether check box can respond to user events (in run mode).


    **Visible** Determines whether the check box appears on the form (in run mode).


    Pay particular attention to the Left and Top properties. Notice if a check box
    is in a group box, those two properties give position in the group box, not on
    the form.'
  merge: -1
