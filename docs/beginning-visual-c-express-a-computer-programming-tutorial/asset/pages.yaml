  md: '# 9-2 Beginning Visual C# Express


    # Picture Box Control


    Many times in projects, you want to display pictures or drawings saved as a graphics
    file on your computer. Maybe you have a little kid''s program where you type an
    A, an apple appears, B, a ball, and so on. Maybe you want to show a map of the
    United States (or some other country) for a geography lesson. Maybe you want to
    see some of the photos you took using a digital camera. The picture box is the
    control for that use. The picture box is selected from the toolbox. It appears
    as:


    +   In Toolbox:

    - PictureBox


    +   On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_317_0.png)


    # Properties


    The picture box control properties are:


    | Property | Description |

    |---|---|

    | Name | Name used to identify picture box control. Three letter prefix for picture
    box names is **pic**. |

    | Image | Establishes the graphics file to display in the picture box. |

    | SizeMode | Indicates how the image is displayed. |

    | Border | Determines type of picture box border. |

    | Left | Distance from left side of form to left side of box (X in properties
    window). |

    | Top | Distance from top side of form to top side of box (Y in properties window).
    |'
  merge: -1
  pgno: 317
- img_proc: true
  md: '| Width | Width of the picture box in pixels. |

    | Height | Height of picture box in pixels. |

    | Enabled | Determines whether picture box can respond to user events (in run
    mode). |

    | Visible | Determines whether the picture box appears on the form (in run mode).
    |


    The **Image** property is used to select the graphic file to display in the picture
    box and the **SizeModeode** property affects how the file is displayed. Let''s
    look at both properties.'
