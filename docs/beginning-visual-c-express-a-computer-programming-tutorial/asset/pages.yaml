  md: '# Project 7 - Decode


    # Project Design


    This project is a classic computer game. The computer generates a four-digit code
    (with no repeating digits). You guess at the code. The computer then tells you
    how many digits in your guess are correct and how many digits are in the correct
    location. Based on these clues, you make a new guess. You continue guessing until
    you have cracked the code. The project you are about to build is saved as Decode
    in the project folder (\BeginVCSE\BVCSE Projects).'
