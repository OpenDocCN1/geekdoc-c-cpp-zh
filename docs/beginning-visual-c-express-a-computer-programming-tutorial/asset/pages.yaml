    Windows applications they want and need in their everyday and work life. In these
    notes, you will learn how to use Microsoft's Visual C# Express to write your own
    Windows-based applications. You may not become a billionaire like Bill and Paul,
    but hopefully you'll have some fun learning a very valuable skill.
