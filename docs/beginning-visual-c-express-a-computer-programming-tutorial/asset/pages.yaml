  md: "# Timers, Animation, Keyboard Events 10-7\n\nWay back in Class 6, we studied\
    \ logical operators - operators that work with Boolean variables. Remember and\
    \ (&&)? Remember or (||)? Well, there's another logical operator that comes handy\
    \ - the **not** operator, represented by the exclamation point (!).. This operator\
    \ works on a single Boolean variable. If we have a Boolean variable (**bool**\
    \ type) named x, it can have two values, true or false. !x has the opposite value\
    \ of X as shown in this simple logic table:\n\n| x | !x |\n|---|---|\n| true |\
    \ false |\n| false | true |\n\nNotice the not operator toggles the Boolean variable\
    \ x. If x is on (true), the not operator turns x off (false). If x is off (false),\
    \ the not operator turns x on (true). So, we can use the not operator to turn\
    \ timer controls on and off. Use this code in the **button1_Click** event method\
    \ in our example:\n\n```\nprivate void button1_Click(object sender, EventArgs\
    \ e)\n{\n    timer1.Enabled = !(timer1.Enabled);\n    timer2.Enabled = !(timer2.Enabled);\n\
    }\n```\n\nNotice how the not operator simplifies using timer controls. Do you\
    \ see that one line of C# code using not has exactly the same effect as the five\
    \ lines of code we used earlier to toggle the timer? Run the project. Click the\
    \ button. Do you see earlier how the two timer events are interacting? You should\
    \ hear a beep every four times the screen changes color. Stop the project when\
    \ you're done playing with it."
