  md: '# 1. Introducing Visual C# Express


    ![](img/c63eb66eb41098f8665780f53d3f34a3_24_0.png)


    In the mid-1960’s, most computing was done on large computers taking up entire
    floors of buildings (these machines had less computational power than the laptop
    I’m typing these notes on!).


    Most programming was done in cryptic languages by engineers and mathematicians.
    Two professors at Dartmouth College wanted to explain programming to “normal”
    people and developed the BASIC (Beginner’s All-Purpose Symbolic Code) language
    to help in that endeavor. BASIC was meant to be a simple language with just a
    few keywords to allow a little math and a little printing.


    In the later 1960’s, timeshare computing, where a user could sit at a terminal
    and interact with the computer, became popular. The primary language used in these
    interactive sessions was BASIC. The Dartmouth BASIC was not sufficient for the
    many applications being developed, so many extensions and improvements were made
    in the BASIC language. Many of the first computer games were written on timeshare
    terminals using BASIC – gambling games, world simulations and the classic Star
    Trek game were very popular.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Beginning Visual C# Express


    In the mid-1970s, an issue of Popular Science magazine changed the world of computers
    forever. On the cover was an Alta computer. About all the computer could do was
    flash some lights according to a program written by the user. But, it was the
    first home computer. Two young guys in Seattle, Bill Gates and Paul Allen, saw
    the potential. They developed a BASIC language for the Alta and marketed it through
    their new company — Microsoft. It sold for $350 and was distributed on a cassette
    tape.


    Since those early days, the folks at Microsoft have developed many other products
    and many other programming languages. The product you will learn in this set of
    notes is called Visual C# Express. The word Visual means you will build Windows-based
    applications that a user can see and interact with. The term C# (pronounced "sharp")
    refers to the particular language used within the Visual C# Express environment.
    This language was developed using pieces of other languages C, C++ and Java. And,
    the term Express is used to indicate this is a special version of another Microsoft
    product called Visual C# .NET. The Express version has been developed for beginners
    like yourself (providing you with a "speedy" to learn programming). Visual C#
    Express is one of the easiest programming languages to learn. Yet, even though
    it is easy to learn and to use, Visual C# Express can also be used to develop
    very powerful computer programs. Visual C# Express provides a sophisticated environment
    for building and testing Windows-based (Windows 2000, Windows XP or Windows NT)
    applications. You''ve used Windows-based applications before. Microsoft''s programs
    like Word, Excel, Internet Explorer and the windows that appear within these applications
    (to open and save files, to print files) are all Windows-based applications. These
    applications are not written in Visual C# Express (they are written in a language
    called C++), but they do demonstrate the functionality you can put in your Visual
    C# Express applications.'
  merge: -1
  pgno: 25
- img_proc: true
  md: Visual C# Express can be used to write computer games, businesses can use Visual
    C# Express to manage their databases, webmasters can use Visual C# Express to
