  md: '# Timers, Animation, Keyboard Events 10-55


    Now, to the heart of the Beach Balls game - the timBalls_Tick event. We haven''t
    seen any dropping balls yet. Here''s where we do that, and more. The timBalls
    timer control handles the animation sequence. It drops the balls down the screen,
    checks for popping, and checks for balls reaching the bottom of the panel. It
    gets new balls started. There''s a lot going on. The method steps are identical
    for each ball. They are:


    +   - Move the ball.

    - Check to see if ball has popped. If so, sound a beep, make the ball disappear,
    increment score and make ball reappear at the top with a new speed.

    - Check to see if ball has reached the bottom without being popped. If so, start
    a new ball with a new speed.


    The steps are easy to write, just a little harder to code. Moving a ball simply
    involves erasing it at its old location and redrawing it at its new location (determined
    by the ballY value). To check if the ball has reached the bottom, we use the border
    crossing logic discussed earlier. The trickiest step is checking if a ball has
    popped. One way to check for a ball pop is to check if the ball image rectangle
    overlaps the arrow rectangle using the collision detection logic developed earlier.
    This would work, but a ball pop if the arrow barely touched the ball. In our code,
    we modify the collision logic such that we will not consider a ball to be popped
    unless the entire width of the arrow is within the width of the ball.'
  merge: -1
  pgno: 422
- img_proc: true
  md: "# 10-56 Beginning Visual C# Express\n\nHere's the complete timBall_Tick event\
    \ implementing these steps. The balls are handled individually within the structure\
    \ of a for loop:\n\n```\nprivate void timBalls_Tick(object sender, EventArgs e)\n\
    {\n    for (int i = 0; i < 5; i++)\n    {\n        // erase ball\n        myGraphics.FillRectangle(blankBrush,\
    \ ballX[i],\nballyY[i], ballSize, ballSize);\n        // move ball\n        bally[i]\
    \ = bY[i] + ballSpeed[i];\n        // check if ball has popped\n        if ((bally[i]\
    \ + ballSize) > pnlBeachBalls.Height - arrowSize)\n        {\n            if (ballX[i]\
    \ < arrowX)\n            {\n                if ((ballX[i] + ballSize) > (arrowX\
    \ + arrowSize))\n                {\n                    // Ball has popped\n \
    \                   // Increase score - move back to top\n                   \
    \ System.Media.SystemSounds.Beep.Play();\n                    txtScore.Text =\
    \ Convert.ToString(Convert.ToInt32(txtScore.Text) + 1);\n                    bally[i]\
    \ = -ballSize;\n                    ballSpeed[i] = myRandom.Next(4) + 3;\n   \
    \             }\n            }\n        }\n        // check for moving off bottom\n\
    \        if ((bally[i] + ballSize) > pnlBeachBalls.Height)\n        {\n      \
    \      // Ball reaches bottom without popping\n            // Move back to top\
    \ with new speed\n            bally[i] = -ballSize;\n            ballSpeed[i]\
    \ = myRandom.Next(4) + 3;\n        }\n        // redraw ball at new location\n\
    \        myGraphics.DrawImage(picBall.Image, ballX[i],\nballyY[i], ballSize, ballSize);\n\
    \    }\n}\n```"
