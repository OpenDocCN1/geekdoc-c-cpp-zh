  md: '# 9-4 Beginning Visual C# Express


    Image Property


    The picture box Image property specifies the graphics file to display. To set
    the Image property at design time, simply display the Properties window for the
    picture box control and select the Image property. An ellipsis (...) will appear.
    Click the ellipsis and a Select Resource window will appear. Select Import and
    an Open File dialog box will appear. Use that box to locate the graphics file
    to display. The picture box can display pictures stored in several different formats.
    The formats we study are:


    +   **Bitmap** A bitmap is an image represented by pixels (screen dots) and stored
    as a collection of bits in which each bit corresponds to one pixel. It usually
    has a bmp extension. You can also display icon files (ico extension) since they
    are essentially bitmap files.


    +   **GIF** A GIF (Graphic Interchange Format, pronounce ''jif'' like the peanut
    butter) file is a compressed bitmap format originally developed by the Internet
    provider CompuServe. Most graphics you see on the Internet are GIF files. A GIF
    file has a gif extension.


    +   **JPEG** A JPEG (Joint Photographic Experts Group, pronounced ''jay-peg'')
    file is a compressed bitmap format that is popular on the Internet and is the
    format usually used to store digital photographs. A JPEG file has a jpg extension.'
  merge: -1
