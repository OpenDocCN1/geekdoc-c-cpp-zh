- img_proc: true
  md: "The bread and cheese decisions are similar - they both use radio buttons. The\
    \ selected bread is given by the variable breadChoice. breadChoice is established\
    \ in the CheckedChanged events for each of the three bread radio buttons. It is\
    \ easy code. First, rdoWhite_CheckedChanged:\n\n```\nprivate void rdoWhite_CheckedChanged(object\
    \ sender, EventArgs)\n{\n    // White bread selected\n    breadChoice = 1;\n}\n\
    ```\n\nrdoWheat_CheckedChanged:\n\n```\nprivate void rdoWheat_CheckedChanged(object\
    \ sender, EventArgs)\n{\n    // Wheat bread selected\n    breadChoice = 2;\n}\n\
    ```\n\nrdoRye_CheckedChanged:\n\n```\nprivate void rdoRye_CheckedChanged(object\
    \ sender, EventArgs)\n{\n    // Rye bread selected\n    breadChoice = 3;\n}\n\
    ```"
