  pgno: 395
- img_proc: true
  md: "# Timers, Animation, Keyboard Events 10-29\n\nLooking at this diagram, you\
    \ should see there are four requirements for the two rectangles to overlap:\n\n\
    +   1. The right of image1 (image1X + image1H) must be \"farther right\" than\
    \ the left side of image2 (image2X)\n2. The left side of image1 (image1X) must\
    \ be \"farther left\" than the right side of image2 (image2X + image2W)\n3. The\
    \ bottom of image1 (image1Y + image1H) must be \"farther down\" than the top of\
    \ image2 (image2Y)\n4. The top of image1 (image1Y) must be \"farther up\" than\
    \ the bottom of image2 (image2Y + image2H)\n\nAll four of these requirements must\
    \ be met for a collision:\n\nThe C# code to check if these rectangles overlap\n\
    \n```\nif ((image1X + image1W) > image2X)\n{\n    if (image1X < (image2X + image2W))\n\
    \    {\n        if ((image1Y + image1H) > image2Y)\n        {\n            if\
    \ (image1Y < (image2Y + image2H))\n            {\n                [C# code for\
    \ overlap, or collision]\n            }\n        }\n    }\nn\n```\n\nThis code\
    \ checks the four conditions for overlap using \"nested\" if structures. The C#\
    \ code for a collision is executed only if all four conditions are found to be\
    \ true."
