  md: '# Beginning Visual C# Express


    Left Distance from left side of form to left side of text box (X in the properties
    window).


    Top Distance from top side of form to top side of text box (Y in the properties
    window).


    Width Width of the text box in pixels.


    Height Height of text box in pixels.


    ReadOnly If True, user can''t change contents of text box (run mode only).


    TabStop If False, the control cannot be ''tabbed'' to.


    BorderStyle Determines type of text box border.


    Visible Determines whether the text box appears on the form (run mode).


    # Example


    Start a new Visual C# Express project. Put a text box on the form. Resize it and
    move it, if desired. Set the Text property. Try different Fonts. Try different
    values of the TextAlign property. See the difference among the BorderStyle possibilities.
    The label box used None as default, the text box uses Fixed3D. Change the BackColor
    and ForeColor properties. Set MultiLine to True and try different ScrollBars values.
    I think you can see the text box is very flexible in how it appears on your form.


    Like the Text property of the label control, the Text property of a text box is
    a string value. So, when setting the Text property in run mode, we must enclose
    the value in quotes ("") to provide a proper assignment. Setting the Text property
    in design mode does not require (and you shouldn''t use) quotes.'
