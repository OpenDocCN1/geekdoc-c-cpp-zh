  md: '# Bonus Project 12 - Pong!


    In the early 1970s, while Bill Gates and Paul Allen were still in high school,
    a man named Nolan Bushnell began the video game revolution. He invented a very
    simple game - a computer version of Ping Pong. There were two paddles, one on
    each side of the screen. Players bounced the ball back and forth. If you missed
    the ball, the other player got a point.


    This first game was called Pong. And, Nolan Bushnell was the founder of Atari
    - the biggest video game maker for many years. (Nolan Bushnell also founded Chucky
    Cheese''s Pizza Parlors, but that''s another story!) In this bonus project, I
    give you my version of Pong written with Visual C# Express. I don''t expect you
    to build this project, but if you can you. Just load the project (named Pong)
    and run it. Skim through the code - you should be able to understand a lot of
    it. The idea of giving you this project is to let you see what can be done with
    Visual C# Express.


    In this version of Pong, a ball moves from one end of a panel to the other, bouncing
    off side walls. Players try to deflect the ball at each end using a controllable
    paddle. In my simple game, the left paddle is controlled with the A and Z keys
    on the keyboard, while the right paddle is controlled by the K and M keys (detected
    using KeyPress events). My solution freely borrows code and techniques from several
    reference sources. The project relies heavily on lots of coding techniques you
    haven''t seen. You will learn about these as you progress in your Visual C# Express
    studies.'
  merge: -1
