  md: '# 5-6 Beginning Visual C# Express


    # Run-Time Errors


    Once you successfully set all control properties and write event methods, eliminating
    all identified syntax errors, you try to run your project. If the project runs,
    great! But, many times, your project may stop and tell you it found an error -
    this is a run-time error. You need to figure out why it stopped and fix the problem.
    Again, Visual C# Express and on-line help will usually give you enough information
    to eliminate run-time errors. Let''s look at examples.


    Working with the same example as above, try to run the project with the incorrect
    line of code. After you click the Start button on the toolbar, the following window
    should appear:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_137_0.png)


    This tells us an error has occurred in trying to ''build'' the project. Click
    No – we don''t want to continue. We want to find the error. If ''build errors''
    occur, they are listed in another Visual C# Express window – the Error List. This
    list shows you all errors detected in trying to run your program. To go to that
    now (if it''s not there already, choose View in menu, select Error List). Error
    List appears in the Design window. Yours might be floating or docked somewhere.'
