  md: '# B-100 Beginning Visual C# Express


    # Run the Project


    Save your work. Run the project. Fill in a loan amount, an interest, and a number
    of months. Click Compute Payment to determine and display the monthly payment.
    Try a loan amount of $5,000 (don''t type in the comma), an interest rate of 18%,
    and 24 months. Your payment should be $249.62:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_529_0.png)


    What can you do with this? Well, you can find monthly payments like we just did.
    Or, try this. Say you have a credit card balance of $2,000. The interest rate
    is 15% and you can make $100 payments each month. Put the 2000 in the loan amount
    box, the 15 in the interest. Then, try different numbers of months until the computed
    payment is close to $100. This will tell you how many months it will take you
    to pay off the credit card. I got 23 months with payments of $100.59 each month.'
