  md: '# Picture Boxes, Arrays 9-31


    We want to describe the one card shuffle with C# code. Most of the code is straightforward.
    The only question is how to do the swap involved in each step. This swap is easy
    on paper. How do we do a swap in C#? Actually, this is a common C# task and is
    relatively simple. At first thought, to swap variableVariable with bVariable,
    you might write:


    ```

    aVariable = bVariable;

    bVariable = aVariable;

    ```


    The problem with this code is that when you replace aVariable with bVariable in
    the first statement, you have destroyed the original value of aVariable. The second
    statement just puts the newly assigned aVariable value (bVariable) back in bVariable.
    Both aVariable and bVariable now have the original bVariable value. Actually,
    swapping two variables is a three step process. First, put aVariable in a temporary
    storage variable (make it the same type as aVariable and bVariable). Then, replace
    aVariable by bVariable. Then, replace bVariable by the temporary variable (which
    holds the original aVariable value). If tVariable is the temporary variable, a
    swap of aVariable and bVariable is done using:


    ```

    tVariable = aVariable;

    aVariable = bVariable;

    bVariable = tVariable;

    ```


    You use swaps like this in all kinds of C# applications.'
  merge: -1
