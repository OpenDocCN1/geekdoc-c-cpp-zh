  md: 'Now, we''ll see the C# code that uses a card shuffle to randomly sort N consecutive
    integers. When done the random list of integers is in the array numberList, which
    should be declared in the general declarations area of your project with the proper
    dimension. Also declare the variable, numberOfItems, which is the length of the
    list. For a deck of cards, these declarations would be:


    ```

    int[] numberList = new int[52];

    int numberOfItems;

    ```


    You need to make sure to assign a value (52) to numberOfItems somewhere, most
    likely in the form Load procedure. We need a random number object (myRandom) with
    method level scope to do all the random number generation. And four variables
    will have block level scope within the loops the particular for implementing the
    shuffle:


    +   - loopCounter - integer loop counter variable

    - remaining - integer loop variable giving number of items in remaining list

    - itemPicked - integer variable giving item picked in remaining list

    - tempValue - temporary integer variable used for swapping'
