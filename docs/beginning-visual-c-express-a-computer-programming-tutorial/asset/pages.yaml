  pgno: 46
- img_proc: true
  md: '# Beginning Visual C# Express


    # Parts of a Visual C# Express Project


    In Class 1, we saw that there are four major components in a Visual C# Express
    application: the solution, the project, the form, and the controls. A solution
    can contain multiple projects. In this course, solutions will only contain a single
    project, so the words solution and project are used interchangeably. Project is
    the word used to encompass everything in a Visual C# Express project. Other words
    used to describe a project are application or program. The form is the window
    where you create the interface between the user and the computer. Controls are
    graphical features or tools that are placed on forms to allow user interaction
    (text boxes, labels, scroll bars, command buttons). Recall the form itself is
    a control. Controls are also referred to as objects. Pictorially, a project is:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_47_0.png)


    So, in simplest terms, a project consists of a form containing several (and some
    projects contain hundreds) controls.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# The Visual C# Express Environment


    Every characteristic of a control (including the form itself) is specified by
    a property. Example control properties include names, any text on the control,
    width, height, colors, position on the form, and contents. Properties are used
    to give your project the desired appearance. For each control studied in this
    class, we will spend a lot of time talking about properties.


    In Class 1, we saw that by interacting with the controls in the Sample project
    (clicking buttons, choosing different options, typing text), we could make things
    happen in our project by generating control events. We say that Visual C# Express
    is an event-driven language and it is governed by an event processor. That means
    that nothing happens in a Visual C# Express project until some event occurs. Once
    an event is detected, the project finds a series of instructions related to that
    event, called an event method. That method is executed, then program control is
    returned to the event processor.


    ![](img/c63eb66eb41098f8665780f53d3f34a3_48_0.png)


    Event methods associated with various controls are where we do the actual computer
    programming. These methods are where we write C# language statements. You will
    learn a lot of programming and C# language in this class.'
  merge: -1
  pgno: 48
