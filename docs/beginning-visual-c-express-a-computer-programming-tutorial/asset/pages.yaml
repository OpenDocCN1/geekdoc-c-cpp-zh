  md: '# Additional Projects B-7


    # Run the Project


    Save your work. Run the project. Click Start to start the timer. Make sure the
    display updates every second. Here''s a run I made:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_436_0.png)


    Study the Tick event if you''re unsure of how this is done – especially look at
    how to subtract two times. DateTime types, using the C# TimeSpan type to get the
    elapsed time. Click Stop to stop the timer. Make sure the Reset button works properly.


    # Other Things to Try


    Many stopwatches allow you to continue timing after you''ve stopped one or more
    times. That is, you can measure total elapsed time in different segments. Modify
    this project to allow such measurement. You''ll need a separate Stop button and
    a variable to keep track of total elapsed time. You''ll also need to determine
    which buttons you want to have enabled at different times in the project. Add
    a “lap timing” feature by displaying the time measured in each segment (a segment
    being defined as the time between each Start and Stop click).'
