  md: '# Panels, Mouse Events, Colors


    # Pen Objects


    As mentioned, many of the graphics methods (including the method to draw lines)
    require a Pen object. This virtual pen is just like the pen you use to write and
    draw. You can choose color and width. You can use pens built into Visual C# Express
    or create your own pen.


    In many cases, the pen objects built into Visual C# Express are sufficient. These
    pens will draw a line 1 pixel wide in a color you choose (Intellisense will present
    the list to choose from). If the selected color is ColorName (one of the 141 built-in
    color names), the syntax to refer to such a pen is:


    ```

    Pens.ColorName

    ```


    Creating your pen is similar to creating a graphics object, but here we create
    a Pen object. To create your own Pen object, you first declare the pen using:


    ```

    Pen myPen;

    ```


    This line goes in the general declarations area. The pen is then created using
    the Pen constructor function:


    ```

    myPen = new Pen(Color, Width);

    ```


    where Color is the color your new pen will draw in and Width is the integer width
    of the line (in pixels) drawn. The pen is usually created in the form Load method.
    This pen will draw a solid line. The Color argument can be one of the built-in
    colors or one generated with the FromArgb function.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'Once created, you can change the color and width at any time using the Color
    and Width properties of the pen object. The syntax is:


    ```

    myPen.Color = newColor;

    myPen.Width = newWidth;

    ```


    Here, newColor is a newly specified color and newWidth is a new pen width.


    Like the graphics object, when done using a pen object, it should be disposed
    using the Dispose method:


    ```

    myPen.Dispose();

    ```


    This disposal usually occurs in the form FormClosing method.


    We''re almost ready to draw lines – be patient! Just one more concept and we''re
    on our way.'
