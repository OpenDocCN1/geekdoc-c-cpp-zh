  md: '# Beginning Visual C# Express


    # Placing Controls on the Form


    The first step in building a Visual C# Express project is to place controls on
    the form in their desired positions. So, at this point, you must have decided
    what controls you will need to build your project. Many times, this is a time-consuming
    task in itself. And, I guarantee, you will change your mind many times. Right
    now, we''ll just practice putting controls on the form.


    Controls are selected from the Visual C# Express Toolbox window (Windows Form
    controls). Click a tool in the toolbox and hold the mouse button down. Drag the
    selected tool over the form. When the cursor pointer is the desired upper left
    corner, release the mouse button and the default size control will appear. This
    is the classic "drag and drop" operation. Once the control is on the form, you
    can still move or resize the control. To move a control, left-click the control
    to select it (crossed-arrows will appear). Drag it to the new location, then release
    the mouse button. To resize a control, left-click the control so that it is selected.
    If you move the cursor over one its four sizing handles, a little ''double-arrow''
    will appear. At that point, you can click and drag the corresponding edge or corner
    to your desired position.


    There are other ways to place a control on the form – you will learn them as you
    progress in your programming skills. One way is to simply double-click the control
    in the toolbox and it will appear in the upper left corner of the form. We prefer
    the drag and drop method since the control is placed where you want it.'
  merge: -1
  pgno: 69
- img_proc: true
