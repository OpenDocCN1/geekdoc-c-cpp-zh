  md: '# Label Control


    A label is a control that displays information the user cannot edit directly.
    It is most often used to provide titles for other controls. Or, it is used to
    display the results of some computer operation. The label control is selected
    from the toolbox. It appears as:


    In Toolbox:


    On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_143_0.png)


    # Properties


    A few useful properties for the label are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify label. Three letter prefix for label names is lbl.
    |

    | Text | Text (string type) that appears in the label. |

    | TextAlign | Specifies how the label text is positioned. |

    | Font | Sets style, size, and type of Text text. |

    | BackColor | Sets label background color. |

    | ForeColor | Sets color of Text text. |

    | Left | Distance from left side of form to left side of label (referred to by
    X in properties window). |

    | Top | Distance from top side of form to top side of label (referred to by Y
    in properties window). |'
  merge: -1
