  md: '# Project - Card Wars


    In this project, we create a simplified version of the kid''s card game - War.
    You play against the computer. You each get half a deck of cards (26 cards). Each
    player turns over one card at a time. The one with the higher card wins the other
    player''s card. The one with the most cards at the end wins. Obviously, the shuffle
    routine will come in handy here. We call this project Card Wars! This project
    is saved as CardWars in the projects folder (BeginVCSE\BVCSE Projects).


    # Project Design


    We will use a panel control to represent the outline of each player''s card. A
    label control will show the card''s value and a picture box control will display
    the card''s suit (hearts, diamonds, clubs, spades). A button will control starting
    a new game or drawing a new card, depending on game state. Another button will
    control stopping the game, if playing, or stopping the program, if not playing.
    The current score (number of cards each player has) will be displayed in a labeled
    text box control.'
