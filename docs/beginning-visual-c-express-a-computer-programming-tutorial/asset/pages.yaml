  md: '# Beginning Visual C# Express


    This equation uses a C# method that we haven''t seen yet, the Pow method, also
    called the exponentiation method. In exponentiation, a number is multiplied times
    itself a certain number of times. If we multiply a number by itself 4 times, we
    say we raise number to the 4th power. The C# method used for exponentiation is:


    ```

    Math.Pow(argument1, argument2)

    ```


    Notice the Pow (stands for power) function has two arguments. argument1 is the
    number we are multiplying times itself argument2 times. In other words, this method
    raises argument1 to the argument2 power. Each argument and the returned value
    are double type numbers. Some examples:


    | Example | Result |

    | Math.Pow(4.0, 2.0) | 16.0 |

    | Math.Pow(-3.0, 3.0) | -27.0 |

    | Math.Pow(10.0, 4.0) | 10000.0 |


    In each example here, the arguments have no decimal parts. We have done this to
    make the examples clear. You are not limited to such values. It is possible to
    use this function to compute what happens if you multiply 7.654 times itself 3.16
    times!! (The answer is 620.99, by the way.)'
