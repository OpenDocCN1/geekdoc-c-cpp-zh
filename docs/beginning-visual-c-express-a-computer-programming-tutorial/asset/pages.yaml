- img_proc: true
  md: '# Project Design


    You are about to start developing projects using Visual C# Express. We will give
    you projects to build and maybe you will have ideas for your own projects. Either
    way, it''s fun and exciting to see ideas end up as computer programs. But before
    starting a project, it''s a good idea to spend a little time thinking about what
    you are trying to do. This idea of proper project design will save you lots of
    time and result in a far better project.


    Proper project design is not really difficult. The main idea is to create a project
    that is easy to use, easy to understand, and free of errors. That makes sense,
    doesn''t it? Spend some time thinking about everything you want your project to
    do. What information does the program need? What information does the computer
    determine? Decide what controls you need to use to provide these sets of information.
    Design a nice user interface (interface concerns placement of controls on the
    form). Consider appearance and ease of use. Make the interface consistent with
    other Windows applications, if possible. Familiarity is good in Windows based
    projects, like those developed using Visual C# Express.


    Make the C# code in your event methods readable and easy to understand. This will
    make the job of making later changes (and you will make changes) much easier.
    Follow accepted accepted programming rules - you will learn these rules as you
    learn more about C#. Make sure there are no errors in your project. This may seem
    like an obvious statement, but many programs are not error-free. The Windows operating
    system has many errors floating around!'
  merge: -1
  pgno: 95
- img_proc: true
  md: The importance of these few statements about project design might not make a
