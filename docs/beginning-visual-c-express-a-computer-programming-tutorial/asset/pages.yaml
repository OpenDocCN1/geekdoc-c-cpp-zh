- img_proc: true
  md: '# Beginning Visual C# Express


    There is no requirement that a logical expression have just one logical operator.
    So, let''s complicate things a bit. What if the expression is:


    ```

    aInteger > 10 || bInteger > 10 && aInteger + bInteger == 20

    ```


    Precedence tells us the arithmetic is done first (aInteger and bInteger are added),
    then the comparisons, left to right. We know aInteger > 10 is true, bInteger >
    10 is false, aInteger + bInteger == 20 is false. So, this expression, in terms
    of boolean comparison values, becomes:


    ```

    true || false && false

    ```


    How do we evaluate this? Precedence says the (&&) is done first, then the or (||).
    The result of ''false && false'' is false, so the expression reduces to:


    ```

    true || false

    ```


    which has a result of true. Hence, we say the expression ''aInteger > 10 || B
    > 10 && aInteger + bInteger = 20'' is true.


    Parentheses can be used in logical expressions to force precedence in evaluations.
    What if, in the above example, we wanted to do the or (||) operation first? This
    is done by rewriting using parentheses:


    ```

    aInteger > 10 || bInteger > 10 && aInteger + bInteger == 20

    ```


    You should be able to show this evaluates to false [do the or (||) first]. Before,
    without parentheses, it was true. The addition of parentheses has changed the
    value of this logical expression! It''s always best to clearly indicate how you
    want a logical expression to be evaluated. Parentheses are a good way to do this.
    Use parentheses even if precedence is not affected.'
  merge: -1
