  md: "# Beginning Visual C# Express\n\n# Block Level Variables\n\nLet's address another\
    \ issue. Notice, at a minimum, the for loop requires the declaration of one variable,\
    \ the loop counter, usually an int type variable. This variable is only used in\
    \ the code block associated with this loop - it's value is used of no use anywhere\
    \ else. When we declare a variable in the general declarations area of the code\
    \ window, as we have been doing, its value is available to all event methods.\
    \ We say such variables have form level scope. Such declarations are not necessary\
    \ with for loop counters and it becomes a headache if you have lots of for loops.\
    \ Loop counters must be declared in the initialization part of the statement.\
    \ We give these variables block level scope - their value is only known within\
    \ that loop's code block.\n\nAs an example of declaring block level variables,\
    \ look at a modification to the student average example:\n\n```\nscoreSum = 0;\n\
    for (int studentNumber = 0; studentNumber < 352;\nstudentNumber++)\n{\n    scoreSum\
    \ = scoreSum + score[StudentNumber];\n}\naverage = scoreSum / 300;\n```\n\nNotice\
    \ how the counter (studentNumber) is declared and initialized, all in one step,\
    \ in the for statement. This is perfectly acceptable in C# - whenever, you declare\
    \ a variable, you can also assign an initial value. Once the for loop is complete,\
    \ the value of studentNumber is no longer known or available. As you write C#\
    \ code, you will often give your loop variables such block level scope. Also,\
    \ notice how we've modified this example to include the increment operator (++)."
  merge: -1
