- img_proc: true
  md: '# Project Design, Forms, Buttons 4-15


    With this window, you can choose three primary pieces of information: Font, Font
    Style, and Size. You can also have an underlined font. This window lists information
    about all fonts stored on your computer. To set the Font property, make your choices
    in this window and click OK. Try different fonts, font styles, and font size for
    the button Text property.


    Two other properties listed for the button are Enabled and Visible. Each of these
    properties can either be True (On) or False (Off). Most other controls also have
    these properties. Why do you need these?


    If a control''s Enabled property is False, the user is unable to access that control.
    Say you had a stopwatch project with a Start and Stop button:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_108_0.png)


    You want the user to click Start, then Stop, to find the elapsed time. You wouldn’t
    want the user to be able to click the Stop button before clicking the Start button.
    So, initially, you would have the Start button''s Enabled property set to True
    and the Stop button''s Enabled property set to False. This way, the user can only
    click Start. Once you clicked Start, you would swap property values. That is,
    make the Start button''s Enabled property False and the Stop button''s Enabled
    property True. That way, the user could now only click Stop.'
  merge: -1
