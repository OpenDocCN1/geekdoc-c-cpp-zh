    a new control - the Combo Box. In this control, you can build up a list of entered
    information and edit it as see fit. It would be useful to use combo boxes to store
    the uncredited and unrecorded deposits, the outstanding checks, and any service
    charges. With complete lists, you could edit them as you see fit. This would make
    the checkbook balancing act an easier task. In time, you can even learn to add
    printing options to the project.'
