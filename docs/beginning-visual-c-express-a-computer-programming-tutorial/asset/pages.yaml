  md: '# Parts of the Visual C# Express Environment


    Visual C# Express is more than just a computer language. It is a project building
    environment. Within this one environment, we can begin and build our project,
    run and test our project, eliminate errors (if any) in our project, and save our
    project for future use. With other computer languages, many times you need a separate
    text editor to write your program, something called a compiler to create the program,
    and then a different area to test your program. Visual C# Express integrates each
    step of the project building process into one environment. Let''s look at the
    parts of the Visual C# Express environment. To help in this look, we first need
    to get a new project started. We won''t do anything with this project. We just
    use it to identify parts of the Visual C# Express environment.'
