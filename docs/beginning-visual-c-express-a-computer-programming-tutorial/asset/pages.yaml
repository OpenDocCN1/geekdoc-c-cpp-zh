  md: '# Timers, Animation, Keyboard Events 10-11


    In this last example, the periodic (every 0.050 seconds) changing of the display
    in the graphics object, imparted by the timer control, gives the appearance of
    motion – the ellipses seem to be moving inward. This is the basic concept behind
    a powerful graphics technique - animation. In animation, we have a sequence of
    pictures, each little different from the previous one. With the ellipse example,
    in each picture, we add a new ellipse. By displaying this sequence over time,
    we can trick the viewer into thinking things are moving. It all has to do with
    how fast the human eye and brain can process information. That''s how cartoons
    work - 24 different pictures are displayed every second - it makes things look
    like they are moving, or animated. Obviously, the timer control is a key element
    to animation, as well as for other Visual C# Express timing tasks. In the C# lesson
    for this class, we will look at how to do simple animations and some other things.


    # Typical Use of Timer Control


    The usual design steps to use a timer control are:


    +   - Set the Name property and Interval property.

    - Write code in Tick event.

    - At some point in your application, set Enabled to True to start timer. Also,
    have capability to reset Enabled to False, when desired.'
