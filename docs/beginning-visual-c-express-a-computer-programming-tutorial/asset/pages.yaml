  md: '# Labels, Text Boxes, Variables


    | Width | Width of the label in pixels. |

    |---|---|

    | Height | Height of label in pixels. |

    | Border | Determines type of label border. |

    | Visible | Determines whether the label appears on the form (in run mode). |

    | AutoSize | If True (default value), label adjusts to size of text. If False,
    label can be resized. |


    Note, by default, the label control has no resizing handles. To resize the label,
    set AutoSize to False.


    # Example


    Make sure Visual C# Express is running and start a new project. Put a label on
    the form. Resize it (AutoSize must be False to do this) and move it, if desired.
    Set the Text property. Try different Fonts. See the difference among the BorderStyle
    possibilities; notice the default value (None) makes the match button with the
    form, Fixed Single places a box around the label, and Fixed3D gives the label
    a three-dimensional inset look. Change the BackColor and ForeColor properties.
    You may find certain color combinations that do not do a very job of displaying
    the Text when in color. Make sure you are aware of combinations that do and not
    work. You want your user to be able to read what is displayed.


    The most used label property is Text. It holds the information that is displayed
    in the label control. There are two things you need to be aware of. First, by
    default, the label will ‘grow’ to hold any Text you provide for it. If the label
    size is not acceptable, you can try things like changing Font or AutoSize. If
    the label is made to be larger than the text it holds (by setting AutoSize to
    False), you will also want to set the TextAlign property. Try different values
    of the TextAlign property; there are nine different alignments selected from a
    ‘graphical’ menu:'
