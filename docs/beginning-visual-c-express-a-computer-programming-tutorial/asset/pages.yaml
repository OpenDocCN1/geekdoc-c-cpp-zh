  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-33


    # Write Event methods


    In this project, you use the checkboxes and radio buttons in the various group
    boxes to specify the desired sandwich. When all choices are made, click Order
    and the ingredients for the ordered sandwich will be printed in the text box (for
    the sandwich makers to read). Clicking Clear will return the menu board to its
    initial state to allow another order. So, we need Click events for each button
    control.


    We also need some way to determine which check boxes and radio buttons have been
    selected. How do we do this? Notice the final state of each check box is not established
    until the Order button is clicked. At this point, we can examine each check box
    Checked property (set automatically by Visual C# Express) to see if it has been
    selected. So, we don''t need really event methods for these boxes.


    Radio button value properties are established when one of the buttons in a group
    is clicked, changing its Checked property. For radio buttons, we will have Changed
    events that keep track of which button in a group is currently selected. Two integer
    variables are needed, one to keep track of which bread (breadChoice) is selected
    and one to keep track of which cheese (cheeseChoice) is selected. We will use
    these values to indicate choices:


    breadChoice: cheeseChoice:


    | Value | Selected Bread | Value | Selected Cheese |

    |---|---|---|--|

    | 1 | White | 0 | None |

    | 2 | Wheat | 1 | American |

    | 3 | Rye | 2 | Swiss |


    Using variables to indicate radio button choices is common.'
  merge: -1
  pgno: 252
- img_proc: true
