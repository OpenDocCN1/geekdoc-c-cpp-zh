  md: '# 9-44 Beginning Visual C# Express


    # Card Numbers


    | Hearts | Diamonds | Clubs | Spades | Card Value |

    |---|---|---|---|--|

    | 0 | 13 | 26 | 39 | Two |

    | 1 | 14 | 27 | 40 | Three |

    | 2 | 15 | 28 | 41 | Four |

    | 3 | 16 | 29 | 42 | Five |

    | 4 | 17 | 30 | 43 | Six |

    | 5 | 18 | 31 | 44 | Seven |

    | 6 | 19 | 32 | 45 | Eight |

    | 7 | 20 | 33 | 46 | Nine |

    | 8 | 21 | 34 | 47 | Ten |

    | 9 | 22 | 35 | 48 | Jack |

    | 10 | 23 | 36 | 49 | Queen |

    | 11 | 24 | 37 | 50 | King |

    | 12 | 25 | 38 | 51 | Ace |


    As examples, notice card 22 is a Jack of Diamonds. Card 30 is a 6 of Clubs. The
    card values are displayed in the lblPlayer and lblComputer label controls. We
    now can display cards. How do we compare them?


    Card comparisons must be based on a numerical value, not displayed card value
    - it''s difficult to check if K is greater than 7, though it can be done. So,
    one last rule is needed to relate card value to numerical value. It''s a simple
    one - start with a 2 having a numerical value of 0 (lowest) and go up, with an
    Ace (A) having a numerical value of 12 (highest). This makes numerical card comparisons
    easy. Notice hearts card numbers already go from 0 to 12. If we subtract 13 from
    diamonds numbers, 26 from clubs, and 39 from spades numbers, each of those card
    numbers will also range from 0 to 12. This gives a common basis for comparing
    cards. This all may seem complicated, but look at the C# code and you''ll see
    it really isn''t.'
