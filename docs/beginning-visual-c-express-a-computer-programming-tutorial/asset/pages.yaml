  md: '# Keyboard Events


    In Class 8, we looked at ways for a user to interact with a Visual C# Express
    project using the mouse for input. We studied three mouse events: MouseDown, MouseMove,
    and MouseUp. Another input device available for use is the computer keyboard.
    Here we look at keyboard events which give our projects the ability to detect
    user input from the keyboard. Two keyboard events are studied: the KeyDown event
    and the event.


    Several Visual C# Express controls can recognize keyboard events, notably the
    form and the text box. Yet, only the control that focus can receive a keyboard
    event. (Recall the control with focus is the active control.) When trying to detect
    a keyboard event for a certain control, we need to make sure that control has
    focus. We can give a control focus by clicking on it with the mouse. But, another
    way to assign focus to a control is with the Focus method. The format for such
    a statement is:


    ```

    controlName.Focus();

    ```


    This command in C# will give controlName focus and make it the active control.
    It has the same effect as clicking on the control. The control can then recognize
    any associated keyboard events. We use the Focus method with keyboard events to
    insure proper execution of each event.


    To detect keyboard events on the form, you need to set the form KeyPreview property
    to True. This bypasses any keystrokes used by the controls to generate events.'
  merge: -1
  pgno: 400
- img_proc: true
  md: "# KeyDown Event\n\nThe KeyDown event has the ability to detect the pressing\
    \ of any key on the computer keyboard. It can detect:\n\n+   * Special combinations\
    \ of the Shift, Ctrl, and Alt keys\n* Insert, Del, Home, End, PgUp, PgDn keys\n\
    * Cursor control keys\n* Numeric keypad keys (it can distinguish these numbers\
    \ from on the top row of the keyboard)\n* Function keys\n* Letter, number and\
    \ character keys\n\nThe KeyDown event for a control controlName is executed whenever\
    \ that control has focus and a key is pressed. The form of this event method is:\n\
    \n```\nprivate void controlName_KeyDown(object sender, KeyEventArgs e)\n{\n  \
    \  [C# code for KeyDown Event]\n}\n```\n\nThe KeyDown event has two arguments:\
    \ sender and e. We won't be concerned with the sender argument in this class.\
    \ And, we won't be concerned with the status of any of the control keys (such\
    \ as Shift, Ctrl, Alt). We only want to know what key was pressed down to invoke\
    \ this method."
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Timers, Animation, Keyboard Events


    The property e.KeyCode can be used to determine which key was pressed down. There
    is a KeyCode value for each key on the keyboard. By evaluating the e.KeyCode argument,
    we can determine which key was pressed. There are nearly 100 KeyCode values, some
    of which are:


    | e.KeyCode | Description |

    | --- | --- |

    | Keys.Back | The BACKSPACE key. |

    | Keys.Cancel | The CANCEL key. |

    | Keys.Delete | The DEL key. |

    | Keys.Down | The DOWN ARROW key. |

    | Keys.Enter | The ENTER key. |

    | Keys.Escape | The ESC key. |

    | Keys.F1 | The F1 key. |

    | Keys.Home | The HOME key. |

    | Keys.Left | The LEFT ARROW key. |

    | Keys.NumPad0 | The 0 key on the numeric keypad. |

    | Keys.PageDown | The PAGE DOWN key. |

    | Keys.PageUp | The PAGE UP key. |

    | Keys.Right | The RIGHT ARROW key. |

    | Keys.Space | The SPACEBAR key. |

    | Keys.Tab | The TAB key. |

    | Keys.Up | The UP ARROW key.


    Using the KeyDown event is not easy. There is a lot of work involved in interpreting
    the information provided in the KeyDown event. For example, the KeyDown event
    cannot distinguish between an upper and lower case letter. You need to make that
    distinction in your C# code. You usually use a switch or if (based on e.KeyCode)
    to determine which key was pressed. Let''s see how to use KeyDown to recognize
    some keys.'
  merge: -1
  pgno: 402
