  md: '# Timers, Animation, Keyboard Events 10-25


    # Image Erasure


    In the little example we just did, we had to clear the panel control (using the
    Clear graphics method) prior to each DrawImage method. This was done to erase
    the image at its previous location before drawing a new image. This "erase, then
    redraw" process is the secret behind animation. But, what if we are animating
    many images? The Clear method would clear all images from the panel and require
    repositioning every image, even ones that haven''t moved. This would be a slow,
    tedious and unnecessary process. It would also result in an animation with lots
    of flicker.


    We will take a more precise approach to erasure. Instead of erasing the entire
    panel before moving an image, we will only erase the rectangular region previously
    occupied by the image. To do this, we will use the FillRectangle graphics method,
    a new concept. This method is straightforward and, with your Visual C# Express
    knowledge, you should easily understand how it is used. If applied to a graphics
    object named myGraphics, the form is:


    ```

    myGraphics.FillRectangle(myBrush, x, y, width, height);

    ```


    This line of code will "paint" a rectangular region located at (x, y), width wide,
    and height high with a brush object (myBrush).


    And, yes, there''s another new concept - a brush object. A brush is like a "wide"
    pen. It is used to fill areas with a color. A brush object is declared (assume
    an object named myBrush) using:


    ```

    Brush myBrush;

    ```'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# 10-26 Beginning Visual C# Express


    Then, a solid brush (one that paints with a single color) is created using:


    ```

    myBrush = new SolidBrush(Color);

    ```


    where you select the Color of the brush. Once done with the brush, dispose of
    the object using the Dispose method.


    So, how does this work with the problem at hand? We will create a “blank” brush
    (we’ll name it blankBrush) with the same color as the BackColor property of the
    panel (myPanel) control. The code to do this (after declaring the brush object)
    is:


    ```

    blankBrush = new SolidBrush(myPanel.BackColor);

    ```


    Then, to erase an image located in myGraphics at (imageX, imageY), imageW pixels
    wide and imageH pixels high, we use:


    ```

    myGraphics.FillRectangle(blankBrush, imageX, imageY, imageH);

    ```


    This will just paint the specified rectangular region with the panel background
    color, effectively erasing the image that was there.


    Open up the “bouncing soccer ball” example one more time. Add this line of code
    in the general declarations area:


    ```

    Brush blankBrush;

    ```'
