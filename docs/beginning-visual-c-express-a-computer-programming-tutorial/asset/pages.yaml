  md: '# Labels, Text Boxes, Variables


    # Type Casting


    In each assignment statement, it is important that the type of data on both sides
    of the operator (=) is the same. That is, if the variable on the left side of
    the operator is an int, the result of the expression on the right side should
    be int. Visual C# (by default) will try to do any conversions for you. When it
    can''t, an error message will be printed. In those cases, you will need to explicitly
    cast the result. This means convert the right side to the same side as the left
    side. Assuming the desired type is, the casting statement is:


    ```

    leftSide = (type) rightSide;

    ```


    You can cast from any basic type (decimal and integer numbers) to any other basic
    type. For example, in the statement:


    ```

    a = (int) (3.14159);

    ```


    The variable a (an int type) will be assigned a value of 3.


    Be careful when casting from higher precision numbers to lower precision numbers.
    Problems arise when you are outside the range of numbers.'
  merge: -1
