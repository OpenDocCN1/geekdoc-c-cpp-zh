- img_proc: true
  md: '# Additional Projects


    # Other Things to Try


    You can give this game a variable difficulty by allowing the user to choose how
    many digits are in the code, how many numbers are used to generate the code, and
    whether digits can repeat. See if you can code up and implement some of these
    options. The commercial version of this game (called MasterMind) uses colored
    pegs to set the code. This makes for a prettier game. See if you can code this
    variation.


    Lastly, many mathematical papers have been written on developing a computer program
    that can decode the kinds of codes used here. Do you think you could write a computer
    program to determine a four digit code you make up? The program would work like
    this: (1) computer makes a guess, (2) you tell computer how many digits are correct
    and how many are in correct locations, then, (3) computer generates a new guess.
    The computer would continue guessing until it gave up or guessed your code.'
