  md: '# Beginning Visual C# Express


    The thing left on our form is a tall, yellow, rectangular control called a panel
    that contains a picture box control displaying a beating ball. Under the panel
    is a button that says Start. Click on that button, that is, cause a Click event.
    The ball starts moving down. It continues moving down until it hits the bottom
    of the panel, then starts moving back up. It will continue to down until you click
    the button that now says Stop. Remember the little stopwatch that was our form
    in design mode, but disappeared when we ran the project. It is being used by the
    bouncing ball example - it is called a timer control. The Click event on the button,
    in addition to changing the button says to Stop, also started this timer control.
    The timer control generates Tick events all by itself at preset time intervals.
    In this example, a Tick event is generated every 1/10th of a second and, in that
    event, the ball position is changed to give the appearance of movement. Notice
    that even while the ball is bouncing, you can change the form color, make toys
    appear and disappear, type text, and make the computer beep. So, Visual C# Express
    even has the capability of handling multiple events.


    Obviously, this project doesn''t do much more than demonstrate what can be done
    with Visual C# Express, but that is an important concept. It points out what you
    will be doing in building your own C# Express projects. A project is made up of
    the controls that let the user provide information to the computer. By causing
    events with these controls, the computer will generate any required results. We
    haven''t worried about how to use the events to determine the results, but we
    will in all the later classes. By the time you have finished this course, you
    will be able to build projects that do everything (and more) that the Sample project
    does. Let''s look now at how to to stop the project.'
  merge: -1
