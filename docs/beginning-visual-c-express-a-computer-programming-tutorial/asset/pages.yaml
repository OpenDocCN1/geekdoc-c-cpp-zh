  md: '# Numeric UpDown Control


    The Numeric UpDown control is used to obtain a numeric input. It looks like a
    text box control with small arrows. Clicking the arrows changes the displayed
    value, which ranges from a specified minimum to a specified maximum. The user
    can even type in a value, if desired. These controls are useful for supplying
    an integer number, such as a date in a month. The numeric updown control is selected
    from the Visual C# Express toolbox. It appears as:


    ### In Toolbox:


    +   - NumericUpDown


    ### On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_181_0.png)


    # Properties


    The numeric updown properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify numeric updown control. Three letter prefix for
    numeric updown name is **nud**. |

    | Value | Value assigned to the updown control (a **decimal type**). |

    | Increment | Amount to increment (increase) or decrement (decrease) the updown
    control when the up or down buttons are clicked. |

    | Maximum | Maximum value for the updown control. |

    | Minimum | Minimum value for the updown control. |

    | TextAlign | Sets whether displayed value is left-justified, right-justified
    or centered. |'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# UpDown Control, Decisions, Random Numbers


    | Font | Sets style, size, and type of displayed value text. |

    | BackColor | Sets updown control background color. |

    | ForeColor | Sets color of displayed value text. |

    | Left | Distance from left side of form to left side of updown control (X in
    properties window). |

    | Top | Distance from top side of form to top side of updown control (Y in properties
    window). |

    | Width | Width of the updown control in pixels. |

    | Height | Height of updown control in pixels. |

    | ReadOnly | Determines whether the text may be changed by the use of the up or
    down buttons only. |

    | Enabled | Determines whether updown control can respond to user events (in run
    mode). |

    | Visible | Determines whether the updown control appears on the form (in run
    mode). |


    Operation of the numeric updown control is actually quite simple. The **Value**
    property can be changed by clicking either of the arrows (value will be changed
    by **Increment** with each click) or, optionally by typing a value (if **ReadOnly**
    is **False**).

    If using the arrows, the value will always lie between **Minimum** and **Maximum**.
    If the user can type in a value, you have no control over what value is typed.'
