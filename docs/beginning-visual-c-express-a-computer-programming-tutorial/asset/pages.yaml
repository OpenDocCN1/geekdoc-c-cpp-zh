  md: '# Beginning Visual C# Express


    # Let''s Get Started


    Learning how to use Visual C# Express to write a computer program (like learning
    anything new) involves many steps, many new terms, and many new skills. We will
    take it slow, describing each step, term, and skill in detail. Before starting,
    we assume you know how to do a few things:


    +   - You should know how to start your computer and use the mouse.

    - You should have a little knowledge of working with your operating system.

    - You should know how to resize and move windows around on the screen.

    - You should know how to run an application on your computer by using the Start
    Menu.

    - You should know how to fill in information in Windows that may pop up on the
    screen.

    - You should know about folders and files and how to find them on your computer.

    - You should know what file extensions are and how to identify them. For example,
    in a file named Example.ext, the three letters ext are called the extension.

    - You should know how to click on links to read documents and move from page to
    page in such documents. You do this all the time when you use the Internet.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'You have probably used all of these skills if you''ve ever used a word processor,
    spreadsheet, or any other software on your computer. If you think you lack any
    of these skills, ask someone for help. They should be able to show you how to
    do them in just a few minutes. Actually, any time you feel stuck while trying
    to learn this material, never be afraid to ask someone for help. We were all ግን
    at one time and people really like helping you learn.


    Let''s get going. And, as we said, we''re going to take it slow. In this first
    class, we will learn how to get Visual C# Express started on a computer, how to
    load a program (or project) into Visual C# Express, how to run the program, how
    to stop the program, and how to exit from Visual C# Express. It will be a good
    introduction to the many new things we will learn in the classes to come.'
  merge: -1
  pgno: 28
