  md: '# Project 6 – Units Conversion


    # Project Design


    In this project, we will build a program that converts length from one unit of
    measure (inch, foot, yard, mile, centimeter, meter, kilometer) to another. The
    program will allow you to choose (using radio buttons) how many decimal points
    you want to display in the result. The project you are to build is saved as Conversion
    in the project folder (\BeginVCSE\BVCSE Projects).


