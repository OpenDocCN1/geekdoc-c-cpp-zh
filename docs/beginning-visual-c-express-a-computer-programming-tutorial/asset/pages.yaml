  md: '# Radio Button Control


    A radio button provides a way to make a “mutually-exclusive” choice from a group
    of things. This is a fancy way of saying one item in the group can be selected.
    When a radio button is selected, a filled circle appears in the button. No other
    button in the group can be selected, or have a filled circle. There are many places
    you can use radio buttons - they can be used whenever you want to make only one
    choice from a group. Say you have a game for one to four players - use radio buttons
    to select the number of players. Radio buttons can be used to select difficulty
    levels in arcade type games. As you write more Visual C# Express programs, you
    will come to rely on the radio button as a device for choice.


    Radio buttons always work in groups and each group must be in a separate group
    box control. Radio buttons in one group box act independently of radio buttons
    in another group box. So, by using group boxes, you can have as many groups of
    radio buttons as you want. The radio button control is selected from the toolbox.
    It appears as:


    In Toolbox: On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_236_0.png)'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Properties


    The radio button properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify radio button. Three letter prefix for radio button
    names is **rdo**. |

    | Text | Identifying text next to radio button. |

    | TextAlign | Specifies how the displayed text is positioned. |

    | Font | Sets style, size, and type of displayed text. |

    | Checked | Indicates if button is selected (**True**) or not selected (**False**).
    Only one button in a group can have a True value. |

    | BackColor | Sets radio button background color. |

    | ForeColor | Sets color of displayed text. |

    | Left | If on form, distance from left side of form to left side of radio button.
    If in group box, distance from left side of group box to left side of radio button
    (X in properties window). |

    | Top | If on form, distance from top side of form to top side of radio button.
    If in group box, distance from top side of group box to top side of radio button
    (Y in properties window). |

    | Width | Width of the radio button in pixels. |

    | Height | Height of radio button in pixels. |

    | Enabled | Determines whether **all** controls within radio button can respond
    to user events (in run mode). |

    | Visible | Determines whether the radio button appears on the form (in run mode).
    |'
  merge: -1
