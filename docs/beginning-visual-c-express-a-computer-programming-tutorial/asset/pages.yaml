  md: '# C# - The First Lesson


    At long last, we are ready to get to get into the heart of a Visual C# Express
    project - the C# language. You have seen that, in a Visual C# Express project,
    event methods are used to connect control events to actual actions taken by the
    computer. The event methods are written using C#. So, you need to know C# to know
    Visual C# Express. In each subsequent class in this course, you will learn something
    new about the C# language.


    Event Method Structure


    You know, by now, that event methods are created using the properties window and
    viewed in the Visual C# Express code window. Each event method has the same general
    structure. First, there is a header line of the form:


    ```

    private void controlName_EventName(object sender, EventArgs e)

    ```


    This tells us we are working with a private (only accessible from our form) method,
    returning no information (word void), that is executed when the event EventName
    occurs for the controlControlName. Makes sense, doesn''t it? Again, for now we
    ignore the information contained in the parentheses.


    The event method code is enclosed in a matched set of curly braces that follow
    the header line. The event method code is simply a set of line-by-line instructions
    to the computer, telling it what to do. The computer will process the first line,
    then the second, then all subsequent lines.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Project Design, Forms, Buttons


    # Some C# Programming Rules


    The event method code is written in the C# language. C# is a set of keywords and
    symbols that are used to make the computer do things. There is a lot of content
    in C# and we''ll try to look at much of it in this course. Just one warning at
    this point. We''ve said it before, but it''s worth saying again. Computer programming
    requires exactness - it does not allow errors! The Visual C# Express environment
    can point out some errors to you, but not all. You must especially be exact when
    typing in event methods. Good typing skills are a necessity in the computer age.
    As you learn Visual C# Express programming, you might like also to improve your
    typing skills using some of the software that''s available for that purpose. The
    better your typing skills, the fewer mistakes you will make in building your Visual
    C# Express applications.


    Here are some rules to follow as you type in your C# code:


    +   - C# code requires perfection. All keywords must be spelled correctly. If
    you type BckColor instead of BackColor, a human may know what you mean, but a
    computer won''t.

    - C# is case-sensitive, meaning upper and lower case letters are considered to
    be different characters. When typing code, make sure you use upper and lower case
    letters properly. In C#, the words Blue and blue are completely different.

    - Curly braces are used for grouping. They mark the beginning and end of programming
    sections. Make sure your C# code has an equal number of left and right braces.
    We call the section of code between matching braces block.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '+   - It is good coding practice to indent code within a block. This makes
    code easier to follow. Notice in examples we''ve seen, each block is indented
    4 spaces. The Visual C# Express editor automatically indents code in blocks for
    you.


    +   - Every C# statement will end with a semicolon. A statement is a program expression
    that generates some action (for example, the statement used to make the computer
    beep in the previous class). Note that not all C# expressions are statements (for
    example, the line defining an event method has no semicolon).


    We''ll learn a lot more C# programming rules as we progress.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Project Design, Forms, Buttons 4-21


    # Assignment Statement


    The simplest, and most used, statement in C# is the assignment statement. It has
    this form:


    ```

    leftSide = rightSide;

    ```


    The symbol = is called the assignment operator. You may recognize this symbol
    as the equal sign you use in arithmetic, but it''s not called an equal sign in
    computer programming. Why is that?


    In an assignment statement, we say whatever is on the left side of the assignment
    statement is replaced by whatever is on the right side. The left side of the assignment
    statement can only be a single term, like a control property. The right side can
    be just about any legal C# expression. It might have some math that needs to be
    done or something else that needs to be evaluated. If there are such evaluations,
    they are completed before the assignment. We are talking in very general terms
    right now and we have to. The idea of an assignment statement will become very
    obvious as you learn just a little more C#.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Property Types


    Recall a property describes something about a control: size, color, appearance.
    Each property has a specific type depending on the kind of information it represents.
    When we use the properties window to set a value in design mode, Visual C# Express
    automatically supplies the proper type. If we want to change a property in an
    event method using the C# assignment statement, we must know the property type
    so we can assign a properly typed value to it. Remember we use something called
    ''dot notation'' to change properties in run mode:


    ```

    controlName.PropertyName = PropertyValue;

    ```


    controlName is the Name assigned to the control, PropertyName is the property
    name, and PropertyValue is the new value we are assigning to PropertyName. We
    will be concerned with four property types.


    The first property type is the int (stands for integer) type. These are properties
    that are represented by whole, non-decimal, numbers. Properties like the Top,
    Left, Height, and Width properties are integer type. So, if we assign a value
    to an integer type property, we will use integer numbers. As an example, to change
    the width property of a form to 1,100 pixels, we would write in C#:


    ```

    this.Width = 1100;

    ```


    Recall the keyword this is used to refer to the form. This says we replace the
    current Width of the form with the new value of 1100. Notice you write 1,100 as
    1100 in C# - we can''t use commas in large numbers.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Project Design, Forms, Buttons 4-23


    A second property type involves colors. We need this to set properties like BackColor.
    Frankly, Visual C# Express has a set of built-in colors to choose from. To set
    a control color (described as ColorPropertyName), we type:


    ```

    controlName.Color = Color.Color;

    ```


    As soon as we type the word Color and a dot on the right side of the assignment
    statement, a entire list of color names to choose from magically appears. To change
    the form background color to blue, use:


    ```

    this.BackColor = Color.Blue;

    ```


    Another property type is the bool (stands for Boolean) type. It takes its name
    from a famous mathematician (Boole). It can have two values: true or false. We
    saw that the Enabled and Visible properties for the button have Boolean values.
    So, when working with Boolean type properties, we must insure we only assign a
    value of true or a value of false. To make a form disappear (not a very good thing
    to do!), we would use the assignment statement:


    ```

    this.Visible = false;

    ```


    This says the current Visible property of the form is replaced by the Boolean
    value false. We could make it come back with:


    ```

    this.Visible = true;

    ```


    There is one possible point of confusion when working with Boolean values. When
    setting a Boolean value using the properties window, the two choices are True
    or False. When setting Boolean values using C# code, the two choices are'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Beginning Visual C# Express


    **true** or **false**. That is, in one case, upper case words are used and in
    the other, lower case words are used. Be aware of this when writing code. A common
    error to use upper case values, rather than the proper lower case values.


    The last property type we need to look at here is the **string** type. Properties
    of this type are simple what the definition says - strings of characters. A string
    can be a name, a string of numbers, a sentence, a paragraph, any characters at
    all. And, many times, a string will contain no characters at all (an empty string).
    The Text property is a string type property. We will do lots of work with strings
    in Visual C# Express, so it''s something you should become familiar with. When
    assigning string type properties, the only trick is to make sure the string is
    enclosed in quotes (“”). You may tend to forget this since string type property
    values are not enclosed in quotes in the properties window. To give our form a
    caption in the title bar, we would use:


    ```

    this.Text = "This is a caption in quotes";

    ```


    This assignment statement says the Text property of the form is replaced by (or
    changed to) the string value on the right side of the statement. You should now
    have some idea of how assignment statements work.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Project Design, Forms, Buttons


    Comments


    When we talked about project design, it was mentioned that you should follow proper
    programming rules when writing your C# code. One such rule is to properly comment
    your code. You can place non-executable statements (ignored by the computer) in
    your code that explain what you are doing. These comments can be an aid in understanding
    your code. They also make future changes to your code much easier.


    To place a comment in your code, use the comment symbol, two slashes (//). Anything
    written after the comment symbol will be ignored by the computer.. You can have
    a comment take up a complete line of C# code, like this:


    ```

    // Change form to blue

    this.BackColor = Color.Blue;

    ```


    Or, you can place the comment on the same line as the assignment statement:


    ```

    this.BackColor = Color.Blue; // Makes form blue

    ```


    You, as the programmer, should decide how much you want to comment your code.
    We will try in the projects provided in this course to provide adequate comments.
    Now, on to the first such project.'
  merge: -1
