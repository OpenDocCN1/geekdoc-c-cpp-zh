- img_proc: true
  md: '# 4-16 Beginning Visual C# Express


    The effects of a False Enabled property are only evident when Visual C# Express
    is in run mode. When a button is not Enabled (Enabled is False), it will appear
    ''hazy'' and the user won''t be able to click it. When Stop is not Enabled on
    the stopwatch, it looks like this:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_109_0.png)


    So, use the Enabled property when you want a control on the form to be temporarily
    disabled. This is a decision made in the project design process we discussed earlier.


    The Visible property is a bit more drastic. When a control''s Visible property
    is set to False (its default value is True), the control won''t even be on the
    form! Now, why would we want a control just placed on the form, set properties
    for, and wrote event methods for, to be invisible? The answer is similar to that
    for the Enabled property. Many times in a project, you will find you want a control
    to temporarily go away. Remember the Sample project in Class 1 where boxes controlled
    whether toys were displayed or not. The display of the toys was controlled via
    the picture box control''s Visible property. Or, in the little stopwatch example,
    instead of setting a button''s Enabled property to make it ''unclickable,'' we
    could just set the Visible property to False so it doesn''t appear on the form
    at all. Either way, you would obtain the desired result. This is another project
    design decision. One more thing - like the Enabled property, the effects of Visible
    being False are only evident in run mode. This makes sense. It would be hard to
    design a project with invisible controls!'
