- img_proc: true
  md: '# UpDown Control, Decisions, Random Numbers 6-37


    # Other Things to Try


    You can add other features to this game. One suggestion is to add a text box where
    the user can input the upper range of numbers that can be guessed. That way, the
    game could be played by a wide variety of players. Use a maximum value of 10 for
    little kids, 1000 for older kids.


    Another good modification would be to offer more informative messages following
    a guess. Have you ever played the game where you try to find something and the
    person who hid the item tells you, as you move around the room, that you are freezing
    (far away), cold (closer), warmer (closer yet), hot (very close), or burning up
    (right on top of the hidden item)? Try to modify the Guess the Number game to
    give these kind of clues. That is, the closer you are to the correct number, the
    warmer you get. To make this change, you will probably need the C# absolute value
    method. **Math.Abs**. This function returns the value of a number while ignoring
    its sign (positive or negative). The format for using Math.Abs is:


    ```

    yourValue = Math.Abs(inputValue);

    ```


    If inputValue is a positive number (greater than zero), yourValue is assigned
    inputValue. If inputValue is a negative number (less than zero), yourValue is
    assigned the numerical value of inputValue, without the minus sign. A few examples:


    | value | Math.Abs(value) |

    | 6 | 6 |

    | -6 | 6 |

    | 0 | 0 |

    | -1.1 | 1.1 |'
  merge: -1
  pgno: 216
