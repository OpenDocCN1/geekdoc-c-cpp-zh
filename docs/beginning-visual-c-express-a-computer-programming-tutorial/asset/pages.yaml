  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-19


    One button in each group of radio buttons should always have a Checked property
    set to True in design mode. And, again, if a radio button is in a group box, the
    Left and Top properties give position in the group box, not on the form.


    # Example


    Start Visual C# Express and start a new project. Draw a group box. Remember, each
    individual group of radio buttons (we need one group for each decision we make)
    has to be in a separate group box. Place three or four radio buttons in the group
    box using techniques discussed earlier. Set one of the buttons Checked property
    to True. Run the project. Notice one button has a filled circle (the one you initialized
    the Checked property for). Click another button. That button will be filled while
    the previously filled button will no longer be filled. Keep clicking buttons to
    get the idea of how they work. In event methods, we would examine each radio button''s
    Checked property to determine which one is selected. Stop the project. Did you
    notice that, for check boxes, we didn''t have to write any C# code to make the
    filled circles appear or go away? That is handled by the control itself. Change
    the group box BackColor property and notice all the ''contained'' radio buttons
    also change background color.


    Draw another group box on the form. Put two or three radio buttons in that group
    box and set one''s Checked property to True. As always, make sure the buttons
    are properly placed in the group box. Run the project. Change the selected button
    in this second group. Notice changing this group of radio buttons has no effect
    on the earlier group. Remember that radio buttons in one group do not affect radio
    buttons in another. Group boxes are used to implement separate choices. Try more
    group boxes and radio buttons if you want. Stop the project.'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'The only radio button event of interest is the CheckedChanged event:


    | Event | Description |

    | --- | --- |

    | CheckedChanged | Event executed when the Checked property changes. |


    When one radio button acting in a group attains a Checked property of True, the
    Checked property of all other buttons in its group is set to False. We don''t
    have to write C# code to do this - it is automatic.


    # Typical Use of a Radio Button Control


    Usual design steps for a radio button control are:


    +   * Establish a group of radio buttons by placing them in the same group box
    control

    * For each button in the group, set the Name (give each button a similar name
    to identify them with the group) and Text property. You might also change the
    Font, BackColor and Forecolor properties.

    * Initialize the Checked property of one button to True.

    * Monitor the CheckedChanged event of each radio button in the group to determine
    when a button is clicked. The ''last clicked'' button in the group will always
    have a Checked property of True.'
  merge: -1
