- img_proc: true
  md: '# Arithmetic Operators


    One thing computer programs are very good at doing arithmetic. They can add, subtract,
    multiply, and divide numbers very quickly. We need to know how to make our Visual
    C# Express projects do arithmetic. There are five arithmetic operators in the
    C# language.


    Addition is done using the plus (+) sign and subtraction is done using the minus
    (-) sign. Simple examples are:


    | Operation | Example | Result |

    | --- | --- | --- |

    | Addition | 7 + 2 | 9 |

    | Addition | 3 + 8 | 11 |

    | Subtraction | 6 - 4 | 2 |

    | Subtraction | 11 - 7 | 4 |


    Multiplication is done using the asterisk (*) and division is done using the slash
    (/). Simple examples are:


    | Operation | Example | Result |

    | --- | --- | --- |

    | Multiplication | 8 * 4 | 32 |

    | Multiplication | 2 * 12 | 24 |

    | Division | 12 / 2 | 6 |

    | Division | 42 / 6 | 7 |


    I''m sure you''ve done addition, subtraction, multiplication, and division before
    and understand how each operation works. The other arithmetic operator may not
    be familiar to you, though.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'The other arithmetic operator we use is called the remainder operator (%).
    This operator gives you the remainder that results from dividing two whole numbers.
    It may not be obvious now, but the remainder operator is used a lot in computer
    programming. Examples:


    | Example | Division Result | Remainder Result |

    |--- |--- |--- |

    | 7 % 4 | 1 Remainder 3 | 3 |

    | 14 % 3 | 4 Remainder 2 | 2 |

    | 25 % 5 | 5 Remainder 0 | 0 |


    Study these examples so you understand how the remainder operator works in C#.


    What happens if an assignment statement contains more than one arithmetic operator?
    Does it make any difference? Look at this example:


    ```

    7 + 3 * 4

    ```


    What''s the answer? Well, it depends. If you work left to right and add 7 and
    3 first, then multiply by 4, the answer is 40. If you multiply 3 times 4 first,
    then add 7, the answer is 19. Confusing? Well, yes. But C# takes away the possibility
    of such confusion by having rules of precedence. This means there is a specific
    order in which arithmetic operations will be performed. That order is:


    +   1. Multiplication (*) and division (/)

    2. Remainder (%)

    3. Addition (+) and subtraction (-)


    So, in an assignment statement, all multiplications and divisions are done first,
    then remainder operations, and lastly, additions and subtractions. In our example
    *'
  merge: -1
  pgno: 160
- img_proc: true
  md: '(7 + 3 * 4), we see the multiplication will be done before the addition, so
    the answer provided by C# would be 19.


    If two operators have the same precedence level, for example, multiplication and
    division, the operations are done left to right in the assignment statement. For
    example:


    ```

    24 / 2 * 3

    ```


    The division (24 / 2) is done first yielding a 12, then the multiplication (12
    * 3), so the answer is 36. But what if we want to do the multiplication before
    the division - can that be done? Yes - using the C# grouping operators - parentheses
    (). By using parentheses in an assignment statement, we force operations within
    the parentheses to be done first. So, if we rewrite our example as:


    ```

    24 / (2 * 3)

    ```


    the multiplication (2 * 3) will be done first yielding a 6, then the division
    (24 / 6), yielding the desired result of 4. You can use as many parentheses as
    you want, but make sure they are always in pairs - every left parenthesis needs
    a right parenthesis. If you nest parentheses, that is have one set inside another,
    evaluation will start with the innermost set of parentheses and move outward.
    For example, look at:


    ```

    ((2 + 4) * 6) + 7

    ```


    The addition of 2 and 4 is done first, yielding a 6, which is multiplied by 6,
    yielding 36. This result is then added to 7, with the final answer being 43. You
    might also want to use parentheses even if they don''t change precedence. Many
    times, they are used just to clarify what is going on in an assignment statement.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Labels, Text Boxes, Variables 5-31


    As you improve your programming skills, make sure you know how each of the arithmetic
    operators work, what the precedence order is, and how to use parentheses. Always
    double-check your assignment statements to make sure they are providing the results
    you want.


    Some examples of C# assignment statements with arithmetic operators:


    ```

    totalBananaCost = numberBananas * bananaCost;

    numberOfWeeks = numberOfDays / 7;

    averageScore = (score1 + score2 + score3) / 3.0;

    ```


    Notice a couple of things here. First, notice the parentheses in the averageScore
    calculation forces C# to add the three scores before dividing by 3. Also, notice
    the use of "white space," spaces separating operators from variables. This is
    a common practice in C# that helps code be more readable. We''ll see lots and
    lots of examples of assignment statements as we build projects in this course.'
