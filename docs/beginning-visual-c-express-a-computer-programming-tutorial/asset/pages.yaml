  md: '# Project - Sandwich Maker


    The local sandwich shop has heard about your fantastic Visual C# Express programming
    skills and has hired you to make a computer version of their ordering system.
    What a great place to try out your skills with group boxes, check boxes, and radio
    buttons!


    # Project Design


    In a project like this, making a computer version of an existing process (ordering
    a sandwich), the design steps are usually pretty straightforward. We asked the
    sandwich shop how they do things and this is what they told us:


    +   - Three bread choices (can only pick one): white, wheat, rye

    - Five meat choices (pick as many as you want): roast beef, ham, turkey, pastrami,
    salami

    - Three cheese choices (can only pick one): none, American, Swiss

    - Six condiment choices (pick as many as you want): mustard, mayonnaise, lettuce,
    tomato, onion, pickles


    It should be obvious that controls of three radio buttons for bread, a group of
    five check boxes for meat, a group of three radio buttons for cheese, and six
    check boxes for condiments. We''ll add a button for clearing the menu board, a
    button to ''build'' the sandwich, and a text box, with a label for titling information,
    where we will print out the sandwich order. This project is saved as Sandwich
    in the course projects folder (\BeginVCSE\BVCSE Projects).'
  merge: -1
