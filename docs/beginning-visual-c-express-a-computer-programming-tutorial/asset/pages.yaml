- img_proc: true
  md: '# 8-2 Beginning Visual C# Express


    # Panel Control


    The Panel control is another Visual C# Express ''container'' control. It is nearly
    identical to the GroupBox control (seen in Class 7) in behavior. Controls are
    placed in a Panel control in the same manner they are placed in the GroupBox.
    Radio buttons in a panel work as an independent group. Yet, panel controls can
    also be used to display graphics (lines, rectangles, ellipses, polygons, text).
    In this class, we will look at these graphic capabilities of the panel control.
    The panel is selected from the toolbox. It appears as:


    In Toolbox:


    On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_267_0.png)


    +   * Panel


    # Properties


    The panel properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify panel. Three letter prefix for panel names is pnl.
    |

    | BackColor | Sets panel background color. |

    | Left | Distance from left side of form to left side of panel (X in properties
    window). |

    | Top | Distance from top side of form to top side of panel (Y in properties window).
    |'
  merge: -1
  pgno: 267
- img_proc: true
  md: '| Width | Width of the panel in pixels |

    | Height | Height of panel in pixels |

    | Enabled | Determines whether all controls within panel respond to user events
    (in run mode) |

    | Visible | Determines whether the panel (and attached controls) appears on the
    form (in run mode) |


    Like the form and group box objects, the panel is a container control, since it
    ''holds'' other controls. Hence, many controls placed in a panel will share their
    Back property (notice the panel does not have a Text property). To change this,
    select the desired control (after it is placed on the group box) and change the
    background color. Also, note the panel is moved using the displayed ''handle''
    identical to the process for the group box in the previous class.


    # Typical Use of Panel Control


    The usual design steps for using a panel control are:


    +   * Set Name property.

    * Place desired controls in panel control.

    * Monitor events of controls in panel using usual techniques.'
  merge: -1
