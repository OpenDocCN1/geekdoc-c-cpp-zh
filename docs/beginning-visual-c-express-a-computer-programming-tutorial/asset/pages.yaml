- img_proc: true
  md: '# Comparison Operators


    In the Class 3, we looked at one type of C# operator - arithmetic operators. In
    this class, we introduce the idea of a comparison operator. Comparison operators
    do exactly what they say - they compare two values, with the output of the comparison
    being a Boolean value (bool). That is, the result of the comparison is either
    true or false. Comparison operators allow us to construct logical expressions
    that can be used in decision making.


    There are six comparison operators. The first is the “equal to” operator represented
    by two equal (==) signs. This operator tells us if two values are equal to each
    other. Examples are:


    | Comparison | Result |

    | 6 == 7 | false |

    | 4 == 4 | true |


    A common error (a logic error) in C# is to only use one equal sign for the “equal
    to” operator. Using a single equal sign simply assigns a value to the variable
    making it always true'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# UpDown Control, Decisions, Random Numbers 6-9


    There is also a **not equal to** operator represented by a symbol consisting of
    an exclamation point (called the **not** operator) followed by the equal sign
    (!=). Examples of using this operator:


    | Comparison | Result |

    | 6 != 7 | true |

    | 4 != 4 | false |


    There are other operators that let us compare the size of numbers. The **greater
    than** operator (>) tells us if one number (left side of operator) is greater
    than another (right side of operator). Examples of its usage:


    | Comparison | Result |

    | 8 > 3 | true |

    | 6 > 7 | false |

    | 4 > 4 | false |


    The **less than** operator (<) tells us if one number (left side of operator)
    is less than another (right side of operator). Some examples are:


    | Comparison | Result |

    | 8 < 3 | false |

    | 6 < 7 | true |

    | 4 < 4 | false |'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'The last two operators are modifications to the "greater than" and "less than"
    operators. The "greater than or equal to" operator (>=) compares two numbers.
    The result is true if the number on the left is greater than or equal to the number
    on the right. Otherwise, the result is false. Examples:


    | Comparison | Result |

    | 8 >= 3 | true |

    | 6 >= 7 | false |

    | 4 >= 4 | true |


    Similarly, the "less than or equal to" operator (<=) tells us if one number (left
    side of operator) is less than or equal to another (right side of operator). Examples:


    | Comparison | Result |

    | 8 <= 3 | false |

    | 6 <= 7 | true |

    | 4 <= 4 | true |


    Comparison operators have equal precedence among themselves, but are lower than
    the precedence of arithmetic operators. This means comparisons are done after
    any arithmetic. Comparison operators allow us to make single decisions about the
    relative size of values and variables. What if we need to make multiple decisions?
    For example, what if we want to know if a particular variable is smaller than
    one number, but larger than another? We need ways to combine logical expressions
    - logical operators can do this.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# UpDown Control, Decisions, Random Numbers 6-11


    # Logical Operators


    Logical operators are used to combine logical expressions built using comparison
    operators. Using such operators allows you, as the programmer, to make any decision
    you want. As an example, you will need to know if two variables named aValue and
    bValue are both greater than 0. Using the "greater than" (>) operator, we know
    how to see if aValue is greater than zero and we know to check if bValue is greater
    than 0, but how do we combine these expressions and obtain one Boolean result
    (true or false)?


    We will look at two logical operators used to combine logical expressions. The
    first is the and operator represented by two ampersands (&&). The format for using
    this operator is (using two logical expressions, x and y, each with a Boolean
    (bool type) result):


    ```

    x && y

    ```


    This expression is asking the question "are x and y both true?" That''s why it
    is called the and operator. The and operator (&&) will return a true value only
    if both x and y are true. If either expression is false, the operator will return
    a false. The four possibilities for and (&&) are shown in this logic table:


    | x | y | x && y |

    |---|---|-|

    | true | true | true |

    | true | false | false |

    | false | true | false |

    | false | false | false |'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Beginning Visual C# Express


    Notice the and operator would be used to solve the problem mentioned in the beginning
    of this section. That is, to see if the variables aValue and bValue are both greater
    than zero, we would use the expression:


    ```

    aValue > 0 && bValue > 0

    ```


    The other logical operator we will use is the or operator represented by two pipes
    (||). The pipe symbol is the shift of the backslash key (\) on a standard keyboard.
    The format for using this operator is:


    ```

    x || y

    ```


    This expression is asking the question "is x y true?" That''s why it is called
    the operator. The or (||) operator will return a true value if either x or y is
    true. If both expressions are false, the or operator will return a false. The
    four possibilities for or (||) are:


    | x | y | x || y |

    |---|---|--|

    | true | true | true |

    | true | false | true |

    | false | true | true |

    | false | false | false |'
