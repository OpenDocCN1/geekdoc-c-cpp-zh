  md: "# 10-40 Beginning Visual C# Express\n\n**trapping.** By comparing the input.KeyChar\
    \ with acceptable values, we can decide (in C# code) if we want to accept that\
    \ value as input. Key trapping is a part of every sophisticated Visual C# Express\
    \ application.\n\nThe only question remaining is: if we decide a pressed key is\
    \ not acceptable, how do we ignore it? We do that using the e.Handled property.\
    \ If an unacceptable key is detected, we set e.Handled to true. This ‘tricks’\
    \ Visual C# Express into thinking the KeyPress event has already been handled\
    \ and the pressed key is ignored. If a pressed key is acceptable, we set the e.Handled\
    \ property to false. This tells Visual C# Express that this method has not been\
    \ handled and the KeyPress should be allowed (by default, e.Handled is false,\
