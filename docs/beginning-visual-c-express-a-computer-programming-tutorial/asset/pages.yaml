  md: '# Your First Visual C# Express Project 3-11


    # Naming Controls


    The most important property for any control is its Name. Because of its importance,
    we address it separately. When we name a control, we want to specify two pieces
    of information: the type of control and the purpose of the control. Such naming
    will make our programming tasks much easier.


    | Control | Prefix |

    | --- | --- |

    | Button | btn |

    | Label | lbl |

    | Text Box | txt |

    | Check Box | chk |

    | Radio Button | rdo |


    After the control name prefix, we choose a name (it usually starts with an upper
    case letter to show the prefix has ended) that indicates what the control does.
    The complete control name can have up to 40 characters. The name must start with
    a letter (this is taken care of by using prefixes) and can only contain letters
    (lower or upper case), numbers, and the underscore (_) character. Even though
    you can have 40 character control names, keep the names as short as possible without
    letting them lose their meaning. This will save you lots of typing.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Beginning Visual C# Express


    Let''s look at some example control names to give you an idea of how to choose
    names. These are used in the Sample project looked at in Class 1 and Class 2.
    Examples:


    +   - **btnBeep** - Button that causes a beep

    - **txtType** - Text box where information could be typed

    - **rdoBlue** - Radio button that changes background color to Blue

    - **chkTop** - Check box that displays or hides the toy top

    - **picTop** - Picture box that has the picture of a toy top


    This should give you an idea of how to pick control names. We can''t emphasize
    enough the importance of choosing proper names. It will make your work as a programmer
    much easier.


    It is important to note that the Visual C# language is case sensitive. This means
    the names **picTop** and **PICTOP** are not treated the same. Make sure you assign
    unique names to each control. We suggest mixing upper and lower case letters in
    your control names for improved readability. Just be sure when you type in control
    names that you use the proper case.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Setting Properties in Run Mode


    To illustrate the importance of proper control names, let''s look at a common
    task in Visual C# Express. We have seen one of the steps in developing a Visual
    C# Express project is to establish control properties in design mode. You can
    also establish or change properties while your project is in run mode. For example,
    in the Sample project, when you clicked on a radio button, the Back property of
    the form was changed. When you clicked on a toy name, that toy either appeared
    or disappeared. To change a property in run mode, we need to use a line of C#
    code (you''re about to learn your first line of C#!). The format for this code
    is:


    ```

    controlName.PropertyName = PropertyValue;

    ```


    That is, we type the control''s name, a dot (same as a period or decimal point),
    the name of the property we are changing (found in the properties window), an
    equal sign (called an assignment operator), and the new value. Such a format is
    referred to as dot notation. Make sure the line ends with a semi-colon (;) – almost
    every line of code in Visual C# will end with a semi-colon.


    In Sample, the code used to display the toy top on the form is:


    ```

    PicTop.Visible = true;

    ```


    The Visible property of a control can be true (control is displayed) or false
    (control is not displayed). Notice proper control naming makes this line of code
    very understandable, even if you don''t know any C#. It says that the picture
    box displaying the top has been made visible.'
  merge: -1
