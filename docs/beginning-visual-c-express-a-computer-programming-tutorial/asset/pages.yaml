  md: '# Text Box Control


    The text box control is used to display information entered in design mode, by
    a user in run mode, or assigned within an event method. Just think of a text box
    as a label whose contents your user can (or may not be able to) change. The text
    box is selected from the Visual C# Express toolbox. It appears as:


    In Toolbox:


    On Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_148_0.png)


    # Properties


    The text box has a wealth of useful properties:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify text box. Three letter prefix for text box names
    is **txt**. |

    | Text | Text (string value) that appears in text box. |

    | TextAlign | Sets whether Text is left-justified, right-justified, or centered
    in text box. |

    | Font | Sets style, size, and type of Text. |

    | MultiLine | Specifies whether text box displays one line or multiple lines.
    |

    | ScrollBars | Specifies type of displayed scroll bar(s). |

    | MaxLength | Maximum length of displayed Text. If **0**, length is unlimited.
    |

    | BackColor | Sets text box background color. |

    | ForeColor | Sets color of Text. |'
