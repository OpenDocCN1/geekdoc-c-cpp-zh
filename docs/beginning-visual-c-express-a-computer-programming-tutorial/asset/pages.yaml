  md: "# Icons, Group Boxes, Check Boxes, Radio buttons\n\nSimilar code is used to\
    \ determine CheeseChoice. The\n\nrdoNone_CheckedChangedChanged event method:\n\
    \n```\nprivate void rdoNone_CheckedChangedChanged(object sender, EventArgs e)\n\
    {\n    // No cheese selected\n    cheeseChoice = 0;\n}\n```\n\nrdoAmerican_CheckedChanged:\n\
    \n```\nprivate void rdoAmerican_CheckedChanged(object sender, EventArgs e)\n{\n\
    \    // American cheese selected\n    cheeseChoice = 1;\n}\n```\n\nrdoSwiss_CheckedChanged:\n\
    \n```\nprivate void rdoSwiss_CheckedChanged(object sender, EventArgs e)\n{\n \
    \   // Swiss cheese selected\n    cheeseChoice = 2;\n}\n```\n\nWith the above\
    \ code, we see that by the time Order is clicked, the bread and cheese choices\
    \ will be known. We do not know the meat and condiment choices, however. the only\
    \ way to determine these choices is to examine each individual check box Checked\
    \ property to see if it is checked or not. This is done in the **btnOrder_Click**\
    \ event method. We also place the complete order in the text box control in this\
    \ method. Let's see how."
