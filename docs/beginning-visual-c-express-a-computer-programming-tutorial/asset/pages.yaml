  md: 'Displaying a card consists of answering two questions: what is the card suit
    and what is the card value? The four suits are hearts, diamonds, clubs, and spades.
    The thirteen card values, from lowest to highest, are: 2, 3, 4, 5, 6, 7, 8, 9,
    10, Jack (J), Queen (Q), King (K), Ace (A). We''ve seen in our shuffle routine
    that a card number ranges from 0 to 51. How do we translate card number to a card
    suit and value? (Notice the distinction between card number and card value - card
    number ranges from 0 to 51, card value can only range from 2 to Ace.) We need
    to develop some type of translation rule. This is done all all the time in C#.
    If the number you compute with or work with does not directly translate to information
    you need, you need to make up rules to do the translation. For example, the numbers
    1 to 12 are used to represent the months of the year. But, these numbers tell
    us nothing about the names of the month. We need a rule to translate each number
    to a month name.


    We know we need 13 of each card suit. Hence, an easy rule to decide suit is: cards
    numbered 0 - 12 are hearts, cards numbered 13 - 25 are diamonds, cards numbered
    26 - 38 are clubs, and cards numbered 39 - 51 are spades. Suit is represented
    on the displayed card by the two picture boxes: picPlayer (your card) and picComputer
    (computer''s card). For card values, lower numbers represent lower cards. A rule
    that does this for each number in each card suit is:'
