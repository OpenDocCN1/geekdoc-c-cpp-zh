    # Variable Arrays


    Your local school principal has recognized your great C# programming skills and
    has come for your help. Everyone (352 students) in the school has just taken a
    C# skills test. The principal wants you to write a program that stores each student''s
    name and score. The program should rank (put in order) the scores and compute
