  md: "# Write Event Methods\n\nWhen the user clicks Next Problem, the computer generates\
    \ and displays a multiplication problem. The user types an answer and presses\
    \ <Enter>. If correct, you are told so. If incorrect, the correct answer is given.\
    \ In either case, the score is updated. Continue answering as long as you would\
    \ like.\n\nAdd this code to the general declarations area:\n\n```\nint product;\n\
    int numProb;\nint numRight;\nRandom myRandom = new Random();\n```\n\nThe Form1_Load\
    \ event method:\n\n```\nprivate void Form1_Load(object sender, EventArgs e)\n\
    {\n    // Initialize variables\n    numProb = 0;\n    numRight = 0;\n    // display\
    \ the first problem\n    btnNext.PerformClick();\n}\n```"
  merge: -1
  pgno: 441
- img_proc: true
  md: "# Additional Projects\n\nThe btnNext_Click event method:\n\n```\nprivate void\
    \ btnNext_Click(object sender, EventArgs e)\n{\n    // Generate next multiplication\
    \ problem\n    int number1, number2;\n    txtAnswer.Text = \"\";\n    lblMessage.Text\
    \ = \"\";\n    numProb+++;\n    // Generate random numbers for factors\n    number1\
    \ = myRandom.Next(10);\n    number2 = myRandom.Next(10);\n    lblNum1.Text = Convert.ToString(number1);\n\
    \    lblNum2.Text = Convert.ToString(number2);\n    // Find product\n    product\
    \ = number1 * number2;\n    btnNext.Enabled = false;\n    txtAnswer.Focus();\n\
    }\n```"
