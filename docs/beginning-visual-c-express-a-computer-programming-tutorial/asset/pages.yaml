  md: '# Labels, Text Boxes, Variables


    # 5-45


    # Other Things to Try


    Most savings accounts yield interest, that is the bank actually pays for letting
    them use your money. This savings account project has ignored interest. But, it
    is fairly easy to make the needed modifications to account for interest - the
    math is just a little more complicated. We will give you the steps, but not show
    you how, to change your project. Give it a try if you''d like:


    +   - Define a variable interest to store the yearly savings interest rate. Interest
    rates are decimal numbers, so use the double type for this variable (it''s the
    first time we''ve used decimals!).

    - Add another text box to allow the user to input this interest rate. Name it
    txtInterest.

    - Add a label control to identify the new text box (set the Text to Interest Rate).

    - Modify the code to use interest in computing total. interest is found using:


    ```

    interest = Convert.ToDouble(txtInterest.Text);

    ```


    Then, total (get ready - it''s messy looking) is computed using:


    ```

    total = (int) (5200 * deposit * Math.Pow(1 + interest / 5200), weeks) - 1) / interest);

    ```


    Make sure you type this all on one line - the word processor has made it look
    like it is on two. As we said, this is a pretty messy expression, but it''s good
    practice in using parentheses and arithmetic operators. Note also the use of the
    int keyword to convert (cast) the computed result to an integer number. The number
    ''5200'' is used here to convert the interest from a yearly value to a weekly
    value.'
  merge: -1
  pgno: 176
