  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-21


    # C# - The Fourth Lesson


    By now, you''ve learned a lot about the C# language. In this class, we look at
    just one new idea - another way to make decisions.


    # Decisions – Switch Structure


    In the previous class, we studied the if structure as a way of letting Visual
    C# Express make decisions using comparison operators and logical operators. We
    saw that the if structure is very flexible and allows us to implement a variety
    of decision logics. Many times in making decisions, we simply want to examine
    the value of just one variable or expression. Based on whatever values that expression
    might have, we want to take particular actions in our C# code. We could implement
    such a logic using if and else if statements. C# offers another way to make decisions
    such as this.


    An alternative to a complex if structure when simply checking the value of a single
    variable is the C# switch structure. The parts of the switch structure are:


    +   * The switch keyword

    * A controlling variable

    * One or more case statements followed by an value terminated by a colon (:).
    After the colon the code to be executed if the variable equals the corresponding
    value.

    * An optional break statement to leave the structure after executing the case
    code.

    * An optional default block to execute if none of the preceding case statements
    have been executed.'
  merge: -1
  pgno: 240
- img_proc: true
  md: "# Beginning Visual C# Express\n\nThe general form for this structure is:\n\n\
    ```\nswitch (variable)\n{\n  case valuel1:\n    [C# code to execute if variable\
    \ == value1]\n    break;\n  case value2:\n    [C# code to execute if variable\
    \ == value2]\n    break;\n\n  default:\n    [C# code to execute if no other code\
    \ has been executed]\n    break;\n}\n```\n\nIn this example, if variable = value1,\
    \ the first block is executed. If variable = value2, the second is executed. If\
    \ no subsequent matches between variable and values are found, the code in the\
    \ default block is executed. This code is equivalent to the following if structure:\n\
    \n```\nif (variable == value1)\n{\n  [C# code to execute if variable = value1]\n\
    }\nelse if (variable == value2)\n{\n  [C# code to execute if variable = value2]\n\
    }\nelse\n{\n  [C# code to execute if no other code has been executed]\n}\n```"
  merge: -1
  pgno: 241
- img_proc: true
  md: A couple of comments about switch. The break statements, though optional, will
    almost always be there. If a break statement is not seen at the end of a particular
    case or cases will execute until a break is encountered. This is different behavior
    than seen in if statements, where only one "case" could be executed. Second, all
    the execution blocks in a switch structure are enclosed in curly braces, but the
    blocks within each case do not have to have braces (they are optional). This is
    different from most code blocks in C#. Look at the use of the switch structure
    in the next project to see an example of its use.
  merge: -1
