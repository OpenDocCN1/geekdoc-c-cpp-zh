  md: '# Setting Control Properties (Design Mode)


    Once you have the desired controls on the form, you will want to assign properties
    to the controls. Recall properties specify how a control appears on the form.
    They establish such things as control size, color, what a control ''says'', and
    position on the form. When you place a control on the form, it is given a set
    of default properties by Visual C# Express. In particular, its geometric properties
    (governing size and location) are set when you place and size the control on the
    form. But, many times, the default properties are not acceptable and you will
    want to change them using the Properties Window.


    If Visual C# Express is not running on your computer, start it now. Start another
    new project. There should be a blank form in the design window. If it''s not there,
    select the View menu and choose Designer. Find the Properties Window (press <F4>
    if it''s not there):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_72_0.png)'
