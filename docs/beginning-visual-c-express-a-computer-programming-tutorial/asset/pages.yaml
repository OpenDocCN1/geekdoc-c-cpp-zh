    # Project Design


    In this project, we will build a computer stopwatch that measures elapsed time
    in seconds. One button will start and stop the timing and one will reset the display
    (a label). Elapsed time is measured using the C# Now function that provides the
    current date and time in a Date type function. The project you are about to build
    is saved as Stopwatch in the project folder (\BeginVCSE\BVCSE Projects).


