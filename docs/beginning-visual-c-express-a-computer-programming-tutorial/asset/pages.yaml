- img_proc: true
  md: '# 3-8 Beginning Visual C# Express


    Click the Alphabetic view (the button with A-Z on it) if Categorized properties
    are displayed. Also make sure the Properties button, next to the Alphabetic view
    button is depressed (always sure this button is pressed when working with properties).
    Recall the button at the top of the properties window is the control list, telling
    us which controls are present on the form. The list has only one control, that
    being the form itself. Right now, let''s look at the form''s properties.


    First, how big is the form? All controls are rectangular in shape and two properties
    define the size of that rectangle. Scroll down the list of properties and find
    the Size property. You will see two numbers separated by commas. The first number
    is the Width of the form in pixels (a pixel is a single dot on the form). The
    second number is the Height of the form in pixels. Click on the little plus sign
    (+) in the box next to the Size property. The Width and Height properties will
    be displayed individually. Resize the form and notice the Height and Width properties
    change accordingly. You can also change the width and height of the form by typing
    in values for the desired property in the Properties window. Try it.


    Scroll to the BackColor property. You probably guessed that this sets the background
    color of the form. The value listed for that property is probably Control (a light
    gray). To change the BackColor property, click on BackColor, then on the drop-down
    arrow that appears in the property side of the list. Choose one of the three ''tabs''
    that appear: Custom, Web, or System, then choose a color. My favorite is Custom.
    With this choice, a palette of colors will appear, you can choose a new color
    and notice the results.


    Scroll to the Text property. This property establishes what is displayed in the
    form''s title bar. Click on Text, then type in something on the right side of
    the property window and press <Enter>. Notice the new Text appears in the form
    title bar.'
