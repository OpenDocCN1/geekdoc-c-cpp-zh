  md: '# B-74 Beginning Visual C# Express


    Run the Project


    Save your work. Run the project. Click New Game to start. Type a guess for the
    four-digit code. Note the computer will not let you type an illegal guess (non-distinct,
    less than 4 digits). Click Check Guess. After each guess, the computer will tell
    you how many digits are correct and how many are in the correct location. For
    your reference, a history of your guesses is displayed under Your Guesses. The
    score is displayed as two numbers separated by a slash. The first number is the
    number of correct digits, the second number in the correct location. Click Stop
    to stop guessing and see the computer''s code. Here''s a game I played:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_503_0.png)'
