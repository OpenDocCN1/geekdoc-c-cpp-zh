  md: '# Beginning Visual C# Express


    # Random Number Generator


    Let''s leave decisions for now and look at a fun C# concept - the random number.
    Have you ever played the Windows solitaire card game or Minesweeper or some similar
    game? Did you notice that every time you play the game, you get different results?
    How does this happen? How can you make a computer program unpredictable or introduce
    the idea of "randomness"? The key is the C# random number generator. This generator
    simply produces a different number every time it is referenced.


    Why do you need random numbers? In the Windows solitaire card game, the computer
    needs to shuffle a deck of cards. It needs to "randomly" sort fifty-two cards.
    It uses random numbers to do this. If you have a game that rolls a die, you need
    to randomly generate a number between 1 and 6. Random numbers can be used to do
    this. If you need to flip a coin, you need to generate Heads or Tails randomly.
    Yes, random numbers are used to do this too.


    Visual C# Express has several methods for generating random numbers. We will use
    just one of them – a random generator of integers (whole numbers). The generator
    uses what is called the Random object. Don''t worry too much about what this means
    --just think of it as another variable type. Follow these few steps to use it.
    First create a Random object (we''ll name it myRandom) using the constructor:


    ```

    Random myRandom = new Random();

    ```


    This statement is placed with the variable declaration statements.'
