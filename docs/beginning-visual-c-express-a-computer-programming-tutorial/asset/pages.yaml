- img_proc: true
  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-3


    # Designing C Your Own Icon with IconEdit


    Visual C# Express has a lot of icon files to use for your form’s icon. There are
    also a lot of icons that can be downloaded from the Internet. But, it''s more
    fun to design your own icon to add a personal touch. Several years ago, a computer
    publication PC Magazine offered a free program called IconEdit that lets you design
    and save your own icons. Included with these notes is this program and some other
    files needed by IconEdit (look for the folder named IconEdit in the \BeginVCSE\BSE
    Projects folder). Let''s create an icon to see how IconEdit works.


    To run IconEdit, click Start on the Windows task bar, then click Run. Find the
    IconEdit program (use Browse mode), then click OK. When the IconEdit program window
    appears, click the File menu heading, then choose New (we are creating a new icon).
    The following editor window will appear:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_222_0.png)'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Beginning Visual C# Express


    The editor displays two representations of the icon: a large zoomed-in square
    (a 32 x 32 grid) that''s eight times bigger than the actual icon, and a small
    square to its right that''s actual size. The zoomed square is where the editing
    takes place. New icons appear as solid green with a black square surrounding each
    pixel representation. The pixels (small squares) are, of course, eight times actual
    size like the square itself for ease of editing. The green color is not actually
    the starting color of the icon, but instead represents the transparent "color"
    (whatever is behind this green color on the screen will be seen).


    The basic idea of IconEdit is to draw an icon in the 32 x 32 grid displayed. You
    can draw single points, lines, open rectangles and filled rectangles and ovals.
    Various colors are available. Once completed, the icon file can be saved for attaching
    to available. IconEdit has a tool bar that consists of eight tools: capture (we
    won''t talk about this one), pencil, fill, line, hollow and filled rectangle,
    and hollow and filled ellipse. These will be familiar to anyone who has used a
    paint program and on-line help is available. The default tool when you start editing
    an icon is the pencil, since this is the tool you''ll probably use the most. The
    pencil lets you color one pixel at a time. To change a pixel, simply place the
    point of the pencil cursor over a pixel in the big editing square and click. You
    can pencil-draw several pixels at once by dragging the pencil over an area.


    To change editing tools, simply click the tool button of your choice. The fill
    tool (represented by a paint can) will color the pixel you point to and all adjacent
    pixels of the same color with the color you''ve selected. The remaining five tools
    operate in the same way. You click and hold the mouse button at the starting pixel
    position, drag the mouse to an ending position, and release the mouse button.
    For example, to draw a line, click and hold the mouse button on the starting point
    for the line and drag to the ending point. As you drag, the line will stretch
    between where you started and the current ending position. Only when you release
    the mouse button will the line be permanently drawn. For a rectangle or an ellipse,'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'drag from one corner to the opposite corner. You control the color that the
    tool uses by pressing either the left or right mouse button.


    The two large color squares right under the tools are the current colors for the
    left and right mouse buttons, respectively. When you start IconEdit, the left
    mouse button color is black and the right mouse button color is white. If you
    click with the left mouse button on a pixel with the pencil tool, for example,
    the pixel will turn black. Click with the right mouse button and the pixel will
    turn white. To change the default colors, click on one of the 16 colors in the
    palette just below the current color boxes with either the left or right mouse
    button. Clicking on a palette color with the left button will change the left
    button color and a right button click will change the right button color. You
    can pick the transparent “color” at the bottom of the editor if you want a pixel
    to be transparent.'
  merge: -1
