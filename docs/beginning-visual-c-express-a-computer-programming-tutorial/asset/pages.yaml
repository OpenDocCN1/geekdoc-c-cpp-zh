  md: '# Additional Projects


    # Other Things to Try


    If you are going to let others use this program, it needs some improvements. Review
    the key trapping procedures discussed in Class 10 and make sure users can only
    type numbers, a decimal point, and a backspace key when using the text boxes for
    inputs. You need some logic to make sure the user has typed values in all three
    text boxes (Loan Amount, Yearly Interest, Number of Months). Also, what if the
    interest rate is zero (a very nice bank!)? The program won''t work (try it). You''ll
    need a way to compute payments with zero interest.'
