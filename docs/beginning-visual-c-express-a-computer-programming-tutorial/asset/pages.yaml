    # Other Things to Try


    Some suggested changes to make this a more useful program are: (1) make the range
    of factors an option (small numbers for little kids, large numbers for older kids),
    (2) allow practice with a specific factor only, (3) give the user chances at the
    correct answer with a decreasing score for each try, (4) set up a timer so the
    faster the user answers, the higher the score and (5) expand the program to include
    other operations such as addition, subtraction and division.'
