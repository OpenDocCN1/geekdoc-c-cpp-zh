    These lessons are a highly organized and well-indexed set of lessons in the Visual
    C# programming environment. Visual C# is a programming environment which allows
    the user to drag and drop buttons, text boxes, scroll bars, timers and dozens
    of other visual "controls" to make programs which look like "Windows" programs.
    They provide a graphical user interface rather than a text only interface as would
    be the case if you make "Console C#" projects. The tutorials provide the benefit
    of connected real-world applications - fully documented projects from the teacher''s
    point of view. That is, while full solutions are provided for the teacher''s (and
