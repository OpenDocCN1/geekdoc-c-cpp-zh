- img_proc: true
  md: '# 1-16 Beginning Visual C# Express


    your Visual C# project is waiting for an event to occur. Nothing can happen in
    a Visual C# Express program until an event occurs. We call Visual C# Express an
    event-driven programming language. So, let''s cause an event.


    An event occurs when you do something on the form - click on something with the
    mouse, type something in places where words can go, or drag an object across the
    form. In the upper left corner of the form is a group of six boxes within a rectangular
    region with the heading Toys. Each little box has a toy name printed next to it.
    Click on one of these boxes. What happens. A check appears in the selected box,
    indicating box selection, and the toy named by that box appears on the screen.
    When we click on a box, we cause an event, called a CheckedChanged event (this
    means the ''checked'' status of the box has changed). The computer recognizes
    the event and does what you have told it to do (through your computer program)
    if that particular event occurs. In this case, the event tells the computer to
    display the selected toy. Click on the box. The check mark and the toy disappear.
    You have caused another event and told the computer to make the toy disappear.
    This particular control is called a check box. Notice you can check as many boxes
    as you want, picking which toys (if any) you want displayed on your screen. Check
    boxes are used when you want to select items from a list. Two other controls are
    used in this example. The rectangular region the check boxes are contained is
    called a group box. The region each toy picture is displayed is called a picture
    box control. Now, let''s look at causing events with the other controls on the
    form.


    Near the middle of the screen is a group of four round buttons in a group box
    with the heading Color. Each button has a color name printed next to it. The Blue
    button has a black dot in it, indicating that it is the currently selected color
    (notice the form is blue). Click on another of these buttons. What happens. The
    form color changes to the selected color. This CheckedChanged (meaning the ''checked''
    or actually ''dotted'' status of the button has changed) event tells the computer
    to change the form background color. Notice that when you select a'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Introducing Visual C# Express 1-17


    new color, the black dot appears in the selected button and disappears in the
    previously selected button. Unlike the check boxes we saw earlier, you can only
    select one of these buttons. This makes sense - the form can only be one color!
    These round buttons are called radio buttons. Radio buttons are used when you
    need to choose exactly one option from a list of many. They are radio buttons
    because, on a radio, you can only choose one option (station) at a time.


    Under the Toys group box is another group box with the heading Pick a Number.
    There we see a control called a numeric up-down control. There is a label area
    displaying a number and next to the number is another control with one arrow pointing
    up and one pointing down (a scroll bar). You''ve probably seen scroll bars in
    other applications you have used. The scroll bar is used to change the displayed
    number. Click on the arrow on the top of the scroll bar. The displayed value will
    increase by 1. Continued clicking on that arrow will continue to increase the
    value. Clicking the lower arrow will decrease the value. In this example, the
    computer is responding to the numeric up-down control''s ValueChanged event, which
    occurs each time an arrow is clicked, changing the displayed value.


    Under the Pick Number group box is a region with a scroll bar on the right side.
    This control is called a text box. You can click in it, type in any text you want.
    Try it. The text box is like a little word processor in itself. Each time you
    type something in the text box, several events occur. There is a KeyPress event
    when you press a key and a Change event that is called each time the text in the
    box changes.


    Next to the text box is a button that says Beep! Click the button and you should
    hear a beep on your computer''s speaker. This control is called a button and is
    one of the most widely used controls in Visual C# Express. The Click event told
    the computer to make the speaker beep.'
  merge: -1
