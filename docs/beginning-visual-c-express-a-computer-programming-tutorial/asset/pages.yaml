  md: '# C# - The Second Lesson


    In this class, you will learn some new C# concepts. We will discuss variables
    (name, type, declaring), arithmetic operations, and some functions and techniques
    for working with strings.


    # Variables


    All computer programs work with information of one kind or another. Numbers, text,
    colors and pictures are typical types of information they work with. Computer
    programs need places to store this information while working with it. We have
    seen one type of storage used by Visual C# Express projects - control properties.
    Control properties store information like control size, control appearance, control
    position on the form, and control colors.


    But, control properties are not sufficient to store all information a project
    might need. What if we need to know how much ten bananas cost if they are 25 cents
    each? We would need a place to store the number of bananas, the cost of each banana,
    and the result of multiplying these two numbers together. To store information
    other than control properties in Visual C# Express projects, we use something
    called variables. They are called variables because the information stored there
    can change, or vary, during program execution. Variables are the primary method
    for moving information around in a Visual C# Express project. And, certain rules
    must be followed in the use of variables. These rules are very similar to those
    we have already established for control properties.'
