    discuss here is how we declare all the variables we need? To write this test score
    program, you need 352 string variables to store student names and 352 int variables
    to store student scores. We are required to declare every variable we use. Do
    you want to type 704 lines of code something like this?


    ```

    string student1;

    string student2;

    string student3;

    .

    string student352;

    int score1;

    int score2;

    int score3;

