  md: '# Timers, Animation, Keyboard Events


    # KeyPress Event


    The KeyPress event is similar to the KeyDown event, with one distinction. Many
    characters in the world of computers have what are called Unicode values. Unicode
    values are simply numbers (ranging from 0 to 255) that represent all letters (upper
    and lower case), all numbers, all punctuation, and many special keys like Esc,
    Space, and Enter. The KeyPress event can detect the pressing of any key that has
    a corresponding Unicode code. A nice thing about the KeyPress event is that you
    immediately know what the user input is - no interpretation of any other key(s)
    is required (like with the KeyDown event). For example, there are different Unicode
    values for upper and lower case letters. Unicode values are related to ASCII (pronounced
    "akey") codes that you may have seen in other languages.


    The KeyPress event method for a control named controlName has the


    ```

    private void controlName_KeyPress(object sender, KeyEvent e)

    {

    [C# code for KeyPress Event]

    }

    ```


    Again, there are two arguments, sender and e. We are interested in what key was
    pressed. That information is in the value of e.KeyChar. e.KeyChar is a char type
    variable (a type we haven''t seen before), returning a single character, corresponding
    to the pressed key. The pressed key can be a readable character (letter, number,
    punctuation) or a non-readable character (Esc, Enter). It''s easy to look at a
    readable character and know what it is. How can we distinguish one non-readable
    character from another?'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'Recall each possible key recognized by the KeyPress event has a Unicode value.
    If you want to know a Unicode value of a particular character, you simply cast
    the character to an int type. So, to determine the Unicode (myCode) value for
    a char type variable (named myChar), use:


    ```

    myCode = (int) myChar;

    ```


    For example:


    ```

    myCode = (int) ''A'';

    ```


    returns the Unicode value (myCode) for the upper case A (65, by the way). Notice
    a character (char) type variable is enclosed in a pair of single quotes. To convert
    a Unicode value (myValue) to the corresponding character, cast the value to a
    char type::


    ```

    myChar = (char) myCode;

    ```


    For example:


    ```

    myChar = (char) 49;

    ```


    returns the character (myChar) represented by a Unicode value of 49 (a "1").'
