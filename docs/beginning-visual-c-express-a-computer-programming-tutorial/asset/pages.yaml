  md: '# 4-8 Beginning Visual C# Express


    # The Form Control


    We have seen that the form is the central control in the development of a Visual
    C# Express project. Without a form, there can be no project! Let''s look at some
    important properties and events for the form control. The form appears when you
    begin a new project.


    ![](img/c63eb66eb41098f8665780f53d3f34a3_101_0.png)


    # Properties


    Like all controls, the form has many (over 40) properties. Fortunately, we only
    have to know about some of them. The properties we will be concerned with are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify form. In this course, we will always use the default
    Form1 for the name |

    | Text | Text that appears in the title bar of form |

    | Back | Background color of form |

    | Icon | Reference to icon that appears in title bar of form (we''ll look at creating
    icons in Class 7). |'
