  md: "# Icons, Group Boxes, Check Boxes, Radio buttons 7-35\n\nbreadChoice and cheeseChoice\
    \ must be initialized to match the initially selected radio buttons: rdoWhite\
    \ (white bread) has an initial True value (for Checked property) in the bread\
    \ group, so BreadChoice is initially 1; rdoNone (no cheese) has an initial True\
    \ value (for Checked property) in the cheese group, so CheeseChoice is initially\
    \ 0. Set these initial values in the Form1_Load method (recall this is always\
    \ a good practice to set them the first time you use them):\n\n```\nprivate void\
    \ Form1_Load(object sender, EventArgs e)\n{\n    // Initialize bread and cheese\
    \ choices\n    breadChoice = 1;\n    cheeseChoice = 0;\n}\n```\n\nAfter all choices\
    \ have been input on the sandwich menu board, you click Order. At this point,\
    \ the computer needs to do the following:\n\n+   - Decide which bread was selected\n\
    - Decide which meats (if any) were selected\n- Decide which cheese (if any) was\
    \ selected\n- Decide which condiments (if any) were selected\n- Place 'order'\
    \ in text box\n\nLet's look at how each decision is made."
