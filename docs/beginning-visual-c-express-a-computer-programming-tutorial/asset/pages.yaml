  md: '# Beginning Visual C# Express


    Click the button again and again. Notice the displayed number changes with each
    click and there is no predictability to the number - it is random. The number
    printed should always be between 0 and 9. Try other limit values if you''d like
    to understand how the random object generator object works.


    So, the random number generator object can be used to introduce randomness in
    a project. This opens up a lot of possibilities to you as a programmer. Every
    computer game, video game, and computer simulation, like sports games and flight
    simulators, use random numbers. A roll of a die can produce a number from 1 to
    6. To use our myRandom object to roll a die, we would write:


    ```

    dieNumber = myRandom.Next(6) + 1;

    ```


    For a deck of cards, the random integers would range from 1 to 52 since there
    are 52 cards in a standard playing deck. Code to do this:


    ```

    cardNumber = myRandom.Next(52) + 1;

    ```


    If we want a number between 0 and 100, we would use:


    ```

    yourNumber = myRandom.Next(101);

    ```


    Check the examples above to make sure you see how the random number generator
    produces the desired range of integers. Now, let''s move on to a project that
    will use this generator.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# # UpDown Control, Decisions, Random Numbers 6-25


    # ## Project - Guess the Number Game


    Back in the early 1980''s, the first computers intended for home use appeared.
    Brands like Atari, Coleco, Texas Instruments, and Commodore were sold in stores
    like Sears and Toys R Us (sorry, I can''t type the needed ''backwards'' R). These
    computers didn''t have much memory, couldn''t do fancy graphics, and, compared
    to today''s computers, cost a lot of money. But, these computers introduced a
    lot of people to the world of computer programming. Many games (usually written
    in the BASIC language) appeared at that time and the project you will build here
    is one of those classics.


    # ## Project Design


    You''ve all played the game where someone said "I''m thinking of a number between
    1 and 10"or some other limits). Then, you try to guess the number. The person
    thinking of the number tells you if you''re low or high and you guess again. You
    continue guessing until you finally guess the number they were thinking of. We
    will develop a computer version of this game here. The computer will pick a number
    between 0 and 100 (using the random number generator). You will try to guess the
    number. Based on your guess, the computer will tell you if you are Low or Too
    High.


    Several controls will be needed. Buttons will control game play (one to tell the
    computer to check your guess, and one to exit the program). We will use a numeric
    updown control to set and display your guess. A label control will display the
    computer''s messages to you. This project is saved as GuessNumber in the course
    projects folder (\BeginVCSE\BVCSE Projects).'
  merge: -1
