  md: '# Write Event methods


    How does this project work? You click Pick Number to have the computer pick a
    number to guess. This click event will ''enable'' the numeric updown control and
    Check Guess button (remember we set their Enabled properties initially at False).
    Input your guess using the numeric updown control, then click Check Guess. The
