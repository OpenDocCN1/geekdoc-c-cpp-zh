  md: "# Panels, Mouse Events, Colors 8-41\n\nNow, let's code the drawing process.\
    \ There are three events we look for:\n\n+   * Left mouse button click - starts\
    \ drawing\n* Mouse moving with left mouse button pressed - continues drawing\n\
    * Left mouse button release - stops drawing\n\nEach of these is a separate mouse\
    \ event.\n\nThe pnlBlackboard_MouseDown event is executed when the left mouse\
    \ button is clicked. When that happens, we set mousePress to true (we are drawing)\
    \ and initialize the \"last point\" variables, xLast and yLast. That event method\
    \ is:\n\n```\nprivate void pnlBlackboard_MouseDown(object sender,\nEventArgs e)\n\
    {\n    // Start drawing if left click\n    if (e.Button == MouseButtons.Left)\n\
    \    {\n        mousePress = true;\n        xLast = e.X;\n        yLast = e.Y;\n\
    \    }\n}\n```"
  merge: -1
  pgno: 306
- img_proc: true
  md: "# Beginning Visual C# Express\n\nThe pnlBlackboard_MouseMove event is executed\
    \ when the left mouse button is being pressed (**mousePress is true**) and the\
    \ mouse is moving over the panel. In this event, we connect the last point (**xLast,\
    \ yLast**) to the current point (**e.X, e.Y**) using the DrawLine method with\
    \ myPen. Once drawing, the \"last point\" becomes the \"current point.\" This\
    \ code is:\n\n```\nprivate void pnlBlackboard_MouseMove(object sender,\nMouseEventArgs\
    \ e)\n{\n    // Draw a line if drawing\n    if (mousePress)\n    {\n        myGraphics.DrawLine(myPen,\
    \ xLast, yLast, e.X, e.Y);\n        xLast = e.X;\n        yLast = e.Y;\n    }\n\
    }\n```\n\nThe pnlBlackboard_MouseUp event is executed when the left mouse button\
    \ is released. When that happens, we draw the last line segment and set **mousePress**\
    \ to **false** (we are done drawing). That method is:\n\n```\nprivate void pnlBlackboard_MouseUp(object\
    \ sender,\nMouseEventArgs e)\n{\n    // Finish line\n    if (e.Button == MouseButtons.Left)\n\
    \    {\n        myGraphics.DrawLine(myPen, xLast, yLast, e.X, e.Y);\n        mousePress\
    \ = false;\n    }\n}\n```"
