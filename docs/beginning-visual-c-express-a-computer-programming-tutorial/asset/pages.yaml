  md: '# Beginning Visual C# Express


    The corresponding method that converts a string to a double type is Convert.ToDouble.
    The format for using this function is:


    ```

    yourNumber = Convert.ToDouble(yourString);

    ```


    The Convert.ToDouble method takes the yourString variable, converts it to a numerical
    value, and assigns it to the variable yourNumber (which must be a double type).
    We could then use yourNumber in any arithmetic statement. An example using this
    method:


    ```

    yourNumber = Convert.ToDouble("3.14159");

    ```


    Following this assignment statement, the variable yourNumber has a numerical value
    of 3.14159.


    The C# Convert.ToString method will convert any numerical variable (or control
    property) to a string. The format for using this method is:


    ```

    yourString = Convert.ToString(yourNumber);

    ```


    The Convert.ToString method takes the yourNumber argument, converts it to a string
    type value, and assigns it to the string variable named yourString. In the example:


    ```

    yourString = Convert.ToString(23);

    ```


    the variable yourString has a string value of "23". And, with:


    ```

    yourString = Convert.ToString(3.14159);

    ```'
