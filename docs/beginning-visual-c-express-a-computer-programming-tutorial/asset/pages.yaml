- img_proc: true
  md: '# Events


    The most important property of the text box is the Text property. As a programmer,
    you need to know when this property has changed in order to make use of the new
    value. There are two events you can use to do this:


    | Event | Description |

    | --- | --- |

    | TextChanged | Event executed whenever Text changes. |

    | Leave | Event executed when the user leaves the text box and causes an event
    on another control.


    The TextChanged event is executed a lot - every time a user presses a key while
    typing in the text box, the TextChanged event method is called. Looking at the
    Text property in this event method will give you its current value.


    The Leave event is the more useful event for examining Text. Remember in placing
    controls on the form in design mode, you can make one control ''active'' by clicking
    on it. There is a similar concept while an application is in run mode. A user
    can have interaction with only one control at a time. The control the user is
    interacting with (causing events) is said to have focus. While a user is typing
    in a text box, that box has focus. The Leave event is executed when you leave
    the text box and another control gets focus. At that point, we know the user is
    done typing in the text box and is changing the Text property. That''s why this
    event method is a good place to find the value of the Text property.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Beginning Visual C# Express


    # Typical Use of Text Box Control


    There are two primary ways to use a text box – as an input control or as a display
    control. If the text box is used to accept some input from the user, the usual
    design steps:


    +   - Set the Name property. Initialize Text property to desired string.

    - If it is possible to input multiple lines, set MultiLine property to True. Also,
    set ScrollBars property, if desired.

    - You may also want to change the Font, Backcolor and Forecolor properties.


    If using the control just to display some information (no user modification possible),
    follow these usual design steps:


    +   - Set the Name property. Initialize Text property to desired string.

    - Set ReadOnly property to True (once you do this, note the background color will
    change).

    - Set TabStop to False.

    - If displaying more than one line, set MultiLine property to True.

    - Assign Text property in code where needed.

    - You may also want to change the Font, Backcolor and Forecolor properties.'
  merge: -1
