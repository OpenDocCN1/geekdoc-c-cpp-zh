  md: '# Beginning Visual C# Express


    # Shuffle Routine


    Let''s use our new knowledge of arrays and for loops to write a very useful method.
    A common task in any computer program is to randomly sort a list of consecutive
    integer values. Why would you want to do this? Say you have four answers in a
    multiple choice quiz. Randomly sort the integers 1, 2, 3, and 4, so the answers
    are presented in random order. Or, you have a quiz with 30 questions. Randomly
    sort the questions for printing out as a worksheet. Or, the classic application
    is shuffling a deck of standard playing cards (there are 52 cards in such a deck).
    In that case, you can randomly sort the integers from 0 to 51 to "simulate" the
    shuffling process. Let''s build a "shuffle" routine. We call it a shuffle routine,
    recognizing it can do more than shuffle a card deck. Our routine will sort any
    number of consecutive integers.


    Usually when we need a computer version of something we can do without a computer,
    it is fairly easy to write down the steps and duplicate them in C# code. We''ve
    done that with the projects built so far in this course. Other times, the computer
    version of a process is easy to do on a computer, but hard or tedious to do off
    the computer. When we shuffle a deck of cards, we separate the deck in two parts,
    interleave the cards as we fan each part. I don''t know how you could write C#
    code to do this. There is a way, however, to write C# code to do a shuffle in
    a more tedious way (tedious to a human, for a computer).


    We will perform what could be called a "one card shuffle." In one card shuffle,
    you pull a single card (at random) out of the deck and lay it aside on a pile.
    Repeat this 52 times and the cards are shuffled. Try it! I think you see this
    idea is simple, but doing a one card shuffle with a real deck of cards would be
    awfully time-consuming. We''ll use the idea of one card shuffle here, with a slight
    twist. Rather than lay the selected card on a pile, we will swap it with the bottom
    card in the stack of cards remaining to be shuffled. This takes the selected card
    out of the'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'deck and replaces it with the remaining bottom card. The result is the same
    as if we lay it aside.


    Here''s how the shuffle works with n numbers:


    +   - Start with a list of n consecutive integers.

    - Randomly pick one item from the list. Swap that item with the last item. You
    now have fewer items in the list to be sorted (called the remaining list), or
    n is n - 1.

    - Randomly pick one item from the remaining list. Swap it with the item on the
    bottom of the remaining list. Again, your remaining list now has one fewer items.

    - Repeatedly remove one item from the remaining list and swap it with the item
    on the bottom of the remaining list until you have out of items. When done, the
    list will have been replaced with the original list in random order.


    Confusing? Let''s show a simple example with n = 5 (a very small deck of cards).


    The starting list is (with 5 remaining items):


    | 1 2 3 4 5 |

    | Remaining List |


    We want to pick one item, at random, from this list. Using the C# random number
    generator, we would choose a random number from 1 to 5. Say it was 3. We take
    the third item in the list (the 3) and swap it with the last item in the list
    (the 5). We now have:'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Beginning Visual C# Express


    1 2 5 4 3


    Remaining List


    There are 4 items in the remaining list. Pick a random number from 1 to 4 - say
    it''s 4. The fourth item in the remaining list is 4. Swap it with the last item
    in the remaining list. Wait a minute! The last item in the remaining list is the
    4. In this case, we swap it with itself, or it stays put. If the random number
    was something other than 4, really would have been a swap here. We now have:


    1 2 5 4 3


    Remaining List


    There are 3 items in the remaining list. Pick a random number from 1 to 3 - say
    it''s 1. The first item in the list is 1. Swap the 1 with the last item in the
    remaining list (the 5), giving us:


    5 2 1 4 3


    Remaining List


    There are 2 items in the remaining list. Pick a random number from 1 to 2 - say
    it''s 1. The first item in the list is 5. Swap the 5 with the last item in the
    remaining list (the 2), giving us the final result, the numbers 1 to 5 randomly
    sorted:


    2 5 1 4 3


    Pretty neat how this works, huh?'
