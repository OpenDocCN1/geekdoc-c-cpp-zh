- img_proc: true
  md: "One note – recall arrays in C# are zero-based. In this code, if you ask it\
    \ to\nshuffle n consecutive integers, the indices on the returned array from 0\
    \ to n\n- 1 and the randomized integers will also range from 0 to n - 1, not to\
    \ 1. If you\nneed integers from 1 to n, simply add 1 to each value in the returned\
    \ array!\nThe code is:\n\n```\n// Variable declarations (put at top of method)\n\
    Random myRandom = new Random();\n\n// One card shuffle code\n// initialize NumberList\n\
    for (int loopCounter = 0; loopCounter < numberOfItems;\nloopCounter++)\n{\n  \
    \  numberList[loopCounter] = loopCounter;\n}\n// Work through remaining values\n\
    // Start at numberOfItems and swap one value\n// at each loop step\n// After each\
    \ step, remaining is decreased by 1\nfor (int remaining = numberOfItems; remaining\
    \ >= 1;\nremaining--)\n{\n    // Pick item at random\n    int itemPicked = myRandom.Next(remaining);\n\
    \    // Swap picked item with bottom item\n    int tempValue = numberList[itemPicked];\n\
    \    numberList[itemPicked] = numberList[remaining - 1];\n    numberList[remaining\
    \ - 1] = tempValue;\n}\n```\n\nStudy this code and how it implements the procedure\
    \ followed in the simple\nfive number example. It's not hard to see. Understanding\
    \ how such code\nworks is a first step to becoming a good C# programmer. Notice\
    \ this bit of code\nuses everything we talked about in this class’ C# lesson:\
    \ arrays, loops, and\nblock and method level variables."
