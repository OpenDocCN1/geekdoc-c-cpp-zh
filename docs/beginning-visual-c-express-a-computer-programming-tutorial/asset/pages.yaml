  md: '# Beginning Visual C# Express


    # String/Number Conversion Methods


    A common task in any Visual C# Express project is to take numbers input by the
    user, do some arithmetic operations on those numbers, and output the results of
    those operations. How do you do this? With the Visual C# Express knowledge you
    have up to this point, you probably see you could use text box controls to allow
    you to input numbers. Then you could use the arithmetic operators to do the math
    and label controls to display the results of the math. And, that''s just what
    you would do. But, there are two problems:


    **Problem One:** Arithmetic operators can only work with numbers (for example,
    integer variables and integer properties), but the value provided by a text box
    control (the Text property) is a string. You can''t add and multiply string type
    variables and properties!


    **Problem Two:** The result of arithmetic operations is a number. But the Text
    property of a label control (where we want to display these results) is a string
    type. You can''t store numerical data in a string quantity!


    We need solutions to these two problems. The solutions lie in the **C# built-in
    methods.** We need ways to convert strings to numbers and, conversely, numbers
    to strings. With this ability, we could take the Text property from a text box,
    convert it to a number, do some math, and convert that result to a string that
    could be used as a Text property in a label box. This is a very common task in
    C# and C# has a large set of methods that help us do such common tasks. We will
    look at these in a bit, but first let''s define exactly what a method is.


    A C# method is a built-in procedure that, given some information by us, computes
    some desired value. The format for using a method is:'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Labels, Text Boxes, Variables


    ```

    methodValue = MethodName(ArgumentList);

    ```


    MethodName is the name of the method and ArgumentList is a list of values (separated,
    commas) provided to the function so it can do its work. In this assignment statement,
    MethodName uses the values in ArgumentList to compute a result and assign that
    to the variable we have named methodName. We must insure the variable methodValue
    has the same type as the value computed by MethodName. How do we know what C#
    functions exist, what type of information they provide, and what type of arguments
    they require? Use the Visual C# Express-online help system and search for Methods.
    You''ll see that there are lots of them. We''ll cover some of them in this class,
    but you''ll have to do a little studying on your own to learn about most of them.
    Now, let''s look at some C# methods that help in converting numbers to strings
    and vice versa.


    There are two C# methods we will use to convert a string variable (or control
    property) to a numerical value. The method Convert.ToInt32 converts a string type
    to an int type (the 32 implies 32 bits are used to store an int type). The format
    for using this function is:


    ```

    yourNumber = Convert.ToInt32(yourString);

    ```


    The Convert.ToInt32 method takes the yourString variable (remember this is called
    an argument of the method), converts it to a numerical value, and assigns it to
    the variable yourNumber (which must be an int type). We could then use yourNumber
    in any arithmetic statement. Recall strings will be enclosed in quotes. An example
    using this method:


    ```

    yourNumber = Convert.ToInt32("23");

    ```


    Following this assignment statement, the variable yourNumber has a numerical value
    of 23.'
