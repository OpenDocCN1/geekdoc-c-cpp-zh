- img_proc: true
  md: '# Introducing Visual C# Express


    what the form does (Beginning Visual C# Express - Sample), and three smaller buttons
    that control form appearance (we won''t worry about these buttons right now).
    There are lots of other things on the form. These other things are the ''heart''
    of a Visual C# Express computer program.


    You see a set of square buttons with toy names next to them. You see pictures
    of toys. You see a set of round buttons with color names next to them. There is
    a little box you can type in with something called a scroll bar on the right side.
    There''s a big button that says Beep! There''s a little device for picking the
    value of a number. And, there''s a ball in a big rectangle with a button that
    says Start and, below the form, a little thing that looks like a stopwatch. We
    call all of these things on the form Controls or Objects. Controls provide an
    interface, or line of communication, between you (the user of your program) and
    the computer. You use the controls to tell the computer certain things. The computer
    then uses what it is told to determine some results and displays those results
    back to you through controls. By the way, the form itself is a control. If you''ve
    used any Windows applications, you''ve seen controls before - you probably just
    didn''t know they were called controls. As examples, buttons on toolbars are controls,
    scroll bars to move through word processor documents are controls, menu items
    are controls, and the buttons you click on when opening and saving files are controls.


    I think you get the idea that controls are a very important part of Visual C#
    Express, and you''re right. They are the most important part of Visual C# Express
    - they are what allow you to build your applications. We will spend much of this
    course just learning about controls. Right now, though, let''s run this program
    and get some insight into how a Visual C# Express project (and its controls) works.'
  merge: -1
