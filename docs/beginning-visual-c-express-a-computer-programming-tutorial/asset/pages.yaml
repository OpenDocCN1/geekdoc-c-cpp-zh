- img_proc: true
  md: "# Beginning Visual C# Express\n\nThe displayed information in the text box\
    \ is stored in its Text property. We build this multi-line Text property in stages.\
    \ The stages are:\n\n+   - Replace bread type in Text property (use switch)\n\
