    \ statement. Actually, the if statement is not a single statement, but rather\
    \ a group of statements that implements some decision logic. It is conceptually\
    \ simple.\n\nThe if statement checks a particular logical expression with a Boolean\
    \ (bool type) result. It executes different groups of C# statements, depending\
    \ on whether that expression is true or false. The C# structure for this logic\
    \ is:\n\n```\nif (expression)\n{\n    [C# code block to be executed if expression\
    \ is true]\n}\nelse{\n    [C# code block to be executed if expression is false]\n\
    }\n```\n\nLet's see what goes on here. We have some logical expression which is\
    \ formed from comparison operators and logical operators. if expression is true,\
    \ then the first block of C# statements (marked by a pair of left and right curly\
    \ braces) is executed. else (meaning expression is not true, or it is false),\
    \ the second block of C# statements is executed. Each block of code contains standard\
    \ C# statements, indented by some amount. Whether expression is true or false,\
    \ program execution continues with the first line of C# code after the last right\
    \ curly brace (})."
