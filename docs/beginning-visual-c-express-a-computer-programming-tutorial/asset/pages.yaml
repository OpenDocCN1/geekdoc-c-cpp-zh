  md: '# Additional Projects


    # Other Things to Try


    It''s a hassle to have to store your holdings in the various arrays. You have
    to change the code every time you buy new stock or sell old stock. It would be
    nice to be able to save your holding information on a disk file. Then, it could
    be read in each time you run the program and any changes saved back to disk. With
    such saving capabilities, you could also modify the program to allow changing
    the number of shares you hold of a particular stock, allow addition of new stocks
    and deletion of old stocks. Accessing files on disk is an advanced topic you might
    like to study.


    As written, the program gives returns on individual stocks. Try to write a summary
    function that computes the overall return on all the stocks in your current portfolio.
    I''m sure you can think of other changes to this program. Try them out.'
