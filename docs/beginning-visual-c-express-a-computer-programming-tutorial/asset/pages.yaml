  md: '# Beginning Visual C# Express


    Now, let''s outline the steps involved in the btnNew_Click event. First, we are
    letting this command button have two purposes. It either starts a new game (Text
    is New Game) or gets a new card (Text is Next Card). So, the Click event has two
    segments. If Text is New Game, the steps are:


    +   - Hide ''Game Over'' notice

    - Set btnNew Text to "Next Card"

    - Set btnExit Text to "Stop"

    - Set scores to zero

    - Shuffle cards

    - Initialize cardIndex to zero

    - Display first card for each player

    - Compare cards - update score


    If Text is Next Card, the steps are:


    +   - Display two new cards

    - Compare displayed cards - update scores

    - Increment CardIndex

    - If there are no cards left, stop game - display ''Game Over'' message, change
    button captions. Otherwise, wait for click on Next Card button.


    Most of these steps are easily done now that we know how to shuffle a deck of
    cards. The only tough part is deciding how to display and compare cards. Let''s
    look at that in some detail.'
