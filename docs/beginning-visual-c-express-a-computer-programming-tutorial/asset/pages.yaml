  md: '# Project 9 - Loan Calculator


    # Project Design


    Do you want to know how much that new car will cost each month or how long it
    will take to pay off a credit card? This program will do the job. You enter a
    loan amount, a yearly interest, and a number of months, and the project computes
    your monthly payment. All entries will be in text boxes and a command button will
    initiate the payment calculation. The project you are about to build is saved
    as Loan in the project folder (BeginVCSE\BVCSE Projects).


