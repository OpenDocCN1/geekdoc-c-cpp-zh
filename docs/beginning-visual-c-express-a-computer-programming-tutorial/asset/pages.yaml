  md: '# Events


    The form does support events. That is, it can respond to some user interactions.

    We will only be concerned with three form events in this course:


    | Event | Description |

    | --- | --- |

    | Click | Event executed when user clicks on the form with the mouse. |

    | Load | Event executed when the form first loads into the computer''s memory.
    This is a good place to set initial values for various properties and other project
    values. |

    | FormClosing | Event called when the project is ending. This is a good place
    to ''clean up'' your project. |


    Recall, to create any corresponding event method, make the form the active control,
    choose Events in the properties window, then double-click the name of the event.
    The event method will appear in the code window. To view an ''already-created''
    method in the code window, use the Methods List drop-down box at the top of the
    code window.'
