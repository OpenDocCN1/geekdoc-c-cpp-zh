  md: '# SizeMode Property


    The SizeMode property dictates how a particular image will be displayed in a picture
    box. There are five possible values for this property: Normal, CenterImage, StretchImage,
    AutoSize, Zoom. The effect of each value is:


    | SizeMode | Effect |

    | Normal | Image appears in original size. If picture box is larger than image,
    there will be blank space. If picture box is smaller than image, the image will
    be cropped. |

    | CenterImage | Image appears in original size, centered in picture box. If picture
    box is larger than image, there will be blank space. If picture box is smaller
    than image, image is cropped. |

    | StretchImage | Image will ''fill'' picture box. If image is smaller than picture
    box, it will expand. If image is larger than picture box, it will scale down.
    Bitmap files do not scale nicely. JPEG and GIF files do scale nicely. |

    | AutoSize | Reverse of StretchImage - picture box will change its dimensions
    to match the original size of the image. Be forewarned - some files are very large!
    |

    | Zoom | Similar to StretchImage. The image will adjust to fit within the picture
    box, however its actual height to width ratio is maintained.'
  merge: -1
  pgno: 326
