  md: '# Logic Errors


    Logic errors are the most difficult to find and eliminate. These errors that don''t
    keep your project from running, but cause incorrect or unexpected results.

    The only thing you can do at this point, if you suspect logic errors exist, is
    to dive into your project (primarily, the event methods) and make sure everything
    is coded exactly as you want. Finding logic errors is a time-consuming art, not
    a science.\There are no general rules for finding logic errors. Each programmer
    has his or her own particular way of searching for logic errors.


    With the example we have been using, a logic error would be setting the form background
    color to blue, when you expected red. You would then go into the code to see why
    this is happening. You would see the Color.Blue instead of the desired value Color.Red.
    Making the change would eliminate the logic error and the form will be.


    Unfortunately, eliminating logic errors is not as easy as this example. But, there
    is help. Visual C# Express has something called a debugger that helps you in the
    identification of logic errors. Using the debugger, you can print out properties
    and other values, stop your code wherever and whenever you want, and run your
    project line-by-line. Use of the debugger is an advanced topic and will not be
    talked about in this course. If you want to improve your Visual C# Express skills,
    you are encouraged to learn how to use the debugger.


    Now, let''s improve your skills regarding Visual C# Express controls. We''ll look
    at two new controls: the label and the text box.'
