  md: 'In the Design window will appear a window that looks something like this:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_35_0.png)


    This is our project named Sample. We''re going to spend a bit of time explaining
    everything that is displayed here. This will introduce you to some of the words,
    or vocabulary, we use in Visual C# Express. There are lots of terms used in Visual
    C# Express. Don''t try to memorize everything - you''ll see these new words many
    times through the course.


    We call the displayed project window a Form. All Visual C# Express projects or
    programs are built using forms. In fact, you have probably noticed that all Windows
    applications are built using forms of some type. At the top of the form is the
    Title Bar. It has an icon (little picture) related to the form, a description
    of'
