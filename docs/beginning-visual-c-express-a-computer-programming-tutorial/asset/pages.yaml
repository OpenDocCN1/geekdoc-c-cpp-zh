  md: '# Stopping Visual C# Express


    When you are done working with a Visual C# Express project, you may want to leave
    the Visual C# Express program and the design environment. It is the same procedure
    used by nearly all Windows applications:


    +   * Select File in the main menu.

    * Select Exit (at the end of the File menu).


    Stop Visual C# Express now. Visual C# Express will close all open windows and
    you will be returned to the Windows desktop. In stopping Visual C# Express with
    Sample active, you may be asked if you want to save certain files. Answer No.
    Like with stopping a project, an alternate way to stop Visual C# Express is to
    click on the close button in the upper right hand corner of the main window. It''s
    the button that looks like an X.'
