  md: '# Panels, Mouse Events, Colors


    # Graphics Coordinates


    We will use Visual C# Express to draw lines using a method called the DrawLine
    method. Before looking at this method, let''s look at how we specify the points
    used to draw and connect lines. All graphics methods use a default coordinate
    system. This means we have a specific way to refer to individual points in the
    control (a panel in our work) hosting the graphics object. The coordinate system
    used is:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_278_0.png)


    We use two values (coordinates) to identify a single point in the panel. The x
    (horizontal) coordinate increases from left to right, starting at 0. The y (vertical)
    coordinate increases from top to bottom, also starting at 0. Points in the panel
    are referred to by the two coordinates enclosed in parentheses, or (x, y). Notice
    how x and y, respectively, are similar to the Left and Top control properties.
    All values shown are in units of pixels.


    At long last, we''re ready to draw some lines.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Beginning Visual C# Express


    DrawLine Method


    The Visual C# Express DrawLine method is used to connect two points with a straight-line
    segment. It operates on a previously created graphics object. If that object is
    myGraphics and we wish to connect the point (x1, y1) with (x2, y2) using a pen
    object myPen, the statement is:


    ```

    myGraphics.DrawLine(myPen, x1, y1, x2, y2);

    ```


    The pen object can be either one of the built-in pens or one you create using
    the pen constructor just discussed. Each coordinate value is an integer type.
    Using a built-in black pen (Pens.Black), the DrawLine method with these points
    is:


    ```

    myGraphics.DrawLine(Pens.Black, x1, y1, x2, y2);

    ```


    This produces on a panel (myGraphics object):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_279_0.png)'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Panels, Mouse Events, Colors 8-15


    To connect the last point (x2, y2) to another point (x3, y3), use:


    ```

    myGraphics.DrawLine(Pens.Black, x2, y2, x3, y3);

    ```


    This produces on a panel (myGraphics object):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_280_0.png)


    For every line segment you draw, you need a separate DrawLine statement. To connect
    one line segment with another, you need to save the last point drawn to in the
    first segment (use two integer variables, one for x and one for y). This saved
    point will become the starting point for the next segment. You can choose to change
    the pen color at any time you wish. Using many line segments, with many different
    colors, you can draw virtually anything you want! We''ll do that with the blackboard
    project in this class.'
