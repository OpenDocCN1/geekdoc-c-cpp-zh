- img_proc: true
  md: '# 5-22 Beginning Visual C# Express


    # Variable Names


    You must name every variable you use in your project. Rules for naming variables
    are:


    +   - No more than 40 characters.

    - Can use only letters, numbers, and the underscore (_) character.

    - The first character must be a letter. It is customary, though not required,
    in Visual C# Express that this first letter be lower case.

    - You cannot use a word reserved by Visual C# Express (for example, you cannot
    have a variable named Form or one named Beep.


    The most important rule is to use variable names that are meaningful. You should
    be able to identify the information stored in a variable by looking at its name.
    As an example, in our banana buying example, good names would be:


    | Quantity | Variable Name |

    | Cost of each banana | bananaCost |

    | Number of bananas purchased | bananas |

    | Cost of all bananas | totalBananaCost |


    As mentioned in an earlier class, the Visual C# language is case sensitive. This
    means the names BananaCost and bananacost refer to different variables. Make sure
    you assign unique, easily identified, names to each. As with control names, we
    suggest mixing upper and lower case letters for improved readability. You will
    notice, as you type code, that the Visual C# Express editor will adjust the case
    of control names, variables and reserved C# keywords, as necessary.'
  merge: -1
