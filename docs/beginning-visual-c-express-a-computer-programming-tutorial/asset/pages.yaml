- img_proc: true
  md: '# Graphics Using the Panel Control


    As mentioned, the panel control looks much like a group box and its use is similar.
    Panels can be used in place of group box controls, if desired. A powerful feature
    of the panel control (a feature the group box does not have), however, is its
    support of graphics. We can use the control as a blank canvas for self-created
    works of art! There are many new concepts to learn to help us become computer
    artists. Let''s look at those concepts now.


    # Graphics Methods


    To do graphics (drawing) in Visual C# Express, we use the built-in graphics methods.
    A method is a procedure or function, similar to the event methods we have been
    using, that imparts some action to an object or control. Most controls have methods,
    not just the panel. With the panel, a graphics method can be used to draw something
    on it. Methods can only be used in run mode. The C# code to use a method is:


    ```

    objectName.MethodName(Arguments);

    ```


    where ObjectName is the object of interest, MethodName is the method being used,
    and there may be some arguments or parameters (information needed by the method
    to do its task). Notice this is another form of the dot notation we use to set
    control properties in code. In this class, we will look at graphics methods that
    can draw colored lines. As you progress in your programming skills, you are encouraged
    to study the many other graphics methods that can draw rectangles, ellipses, polygons
    and virtually any shape, in any color. To use the panel for drawing lines, we
    need to introduce another concept, that of a graphics object.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Graphics Objects


    You need to tell Visual C# Express that you will be using graphics methods with
    the panel control. To do this, you convert the panel control to something called
    a **graphics object**. Graphics objects provide the "surface" for graphics methods.
    Creating a graphics object requires two simple steps. We first declare the object
    using the standard declaration statement. If we name our graphics object **myGraphics**,
    the form is:


    Graphics myGraphics;


    This declaration is placed in the **general declarations** area of the code window,
    along with our usual variable declarations. Once declared, the object is created
    using the `CreateGraphics` method:


    ```

    myGraphics = controlName.CreateGraphics();

    ```


    where **controlName** is the name of the control hosting the graphics object (in
    our work, the **Name** property of the panel control). We will create this object
    in the form **Load** event of our projects.


    Once a graphics object is created, all graphics methods are applied to this newly
    formed object. Hence, to apply a graphics method named **GraphicsMethod** to the
    **myGraphics** object, use:


    ```

    myGraphics.GraphicsMethod(Arguments);

    ```


    where **Arguments** are any needed arguments, or information needed by the graphics
    method.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 8-6 Beginning Visual C# Express


    There are two important graphics methods we introduce now. First, after all of
    your hard work drawing in a graphics object, there are times you will want to
    erase or clear the object. This is done with the Clear method:


    ```

    myGraphics.Clear(Color);

    ```


    This statement will clear a graphics object (myGraphics) and fill it with the
    specified Color. We will look further at colors next. The usual color argument
    for clearing a graphics object is the background color of the host control (controlName),
    or:


    ```

    myGraphics.Clear(controlName.BackColor);

    ```


    Once you are done drawing to an object and need it no longer, it should be properly
    disposed to clear up system resources. To do this with our example graphics object,
    use the Dispose method:


    ```

    myGraphics.Dispose();

    ```


    This statement is usually placed in the form FormClosing event method.


    Our drawing will require colors and objects called pens, so let''s take a look
    at those concepts. Doesn''t make sense we need pens to do some drawing?'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Panels, Mouse Events, Colors


    # Colors


    Colors play a big part in Visual C# Express applications. We have seen colors
    in designing some of our previous applications. At design time, we have selected
    background colors (BackColor property) and foreground colors (ForeColor property)
    for different controls. Such choices are made by selecting the desired property
    in the properties window. Once selected, a palette of customizable colors appears
    for you to choose from.


    Most graphics methods and graphics objects use color. For example, the pen object
    we study next has a Color argument that specifies just what color it draws with.
    Unlike control color properties, these colors cannot be selected at design time.
    They must be defined in code. How do we do this? There are two approaches we will
    take: (1) use built-in colors and (2) create a color.


    The colors built into Visual C# Express are specified by the Color structure.
    We have seen a few colors in our examples and projects. A color is specified using:


    ```

    Color.ColorName

    ```


    where ColorName is a reserved color name. There are many, many color names (I
    counted 141). There are colors like Blanchedmond, Linen, NavajoWhite, PeachP and
    SpringGreen. You don''t have to remember these names. Whenever you type the word
    Color, followed by a dot (.), in the code window, the Intellisense feature of
    Visual C# Express will pop up a list of color selections. Just choose from the
    list to complete the color specification. You will have to remember the difference
    between Blanchedmond and Linen though!'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 8-8 Beginning Visual C# Express


    If some reason, the selection provided by the Color structure does not fit your
    needs, there is a method that allows you to create over 16 million different colors.
    The method (FromArgb) works with the Color structure. The syntax to specify a
    color is:


    ```

    Color.FromArgb(Red, Green, Blue)

    ```


    where Red, Green, and Blue are integer measures of intensity of the corresponding
    primary colors. These measures can range from 0 (least intensity) to 255 (greatest
    intensity). For example, Color.FromArgb(255, 255, 0) will produce yellow. Sorry,
    but I can''t tell you what values à use to create PeachPuff.


    It is easy to specify colors for graphics methods using the Color structure. Any
    time you need a color, just use one of the built-in colors or the FromArgb method.
    These techniques to represent color are not limited to just providing colors for
    graphics methods. They can be used anywhere Visual C# Express requires a color;
    for example, BackColor and ForeColor properties can also be set (at runtime) using
    these techniques. For example, to change your form background color to PeachPuff,
    use:


    ```

    this.BackColor = Color.PeachPuff;

    ```'
