  md: '# Beginning Visual C# Express


    Example


    Start Visual C# Express and start a new project. We will create a numeric updown
    control that provides numbers from 0 to 20. Put a numeric updown control on the
    form. (Make sure you choose the numeric updown control and not the domain updown
    control.) Resize it and move it, if desired. Set the following properties:


    | Property | Value |

    | --- | --- |

    | Value | 10 |

    | Increment | 1 |

    | Minimum | 0 |

    | Maximum | 20 |

    | ReadOnly | False |


    If you like, changing colors, font and any other properties too. This numeric
    updown control has an initial Value of 10. The smallest Value can be is 0 (Minimum),
    the largest it can be 20 (Maximum). Value will change by 1 (Increment) when an
    arrow is clicked. The user can type a value (ReadOnly is False) if desired.


    Run the project. The numeric updown control will appear and display a value of
    10. Click the end arrows and see the value change. Notice the value will not drop
    below 0 or above 20, the limits established at design time. Click the display
    area and type in a value of 100. Note that, even though this is higher than the
    maximum of 20, you can type the value. Try increasing the value, it will not increase.
    Hit <Enter> or try to decrease the value and it is immediately adjusted within
    the limits you set. So, Visual C# Express makes some attempts to make sure the
    user doesn''t type illegal values. Stop the project.'
