    What we want to do right now is open a project. Windows applications written using
    Visual C# Express are referred to as solutions. A solution is made up of one or
    more projects. Projects include all the information we need for our computer program.
    In this course, our applications (solutions) will be made up of a single project.
    Because of this, we will use the terms application, solution and project interchangeably.
    Included with these notes are many Visual C# Express projects you can open and
