  md: '# Timers, Animation, Keyboard Events


    Other Things to Try


    I''m sure as you played the Beach Balls game, you thought of some changes you
    could make: Go ahead - give it a try! Here are some ideas we we have.


    When a ball pops, it just disappears from the screen. Can you think of a more
    dramatic way to show popping? Maybe change the Image property of the picture box
    control. Or flash the panel background color.


    Add selectable difficulty levels to the game. This could be used to make the game
    easy for little kids and very hard for experts. What can you do to adjust the
    game difficulty? One thing you could adjust is the size of the popping arrow.
    To pop a ball, the entire arrow width must fit within the width of a ball. Hence,
    a smaller (narrower) arrow would make easier to pop balls before they reach the
    bottom of the picture box. A larger (wider) arrow makes popping harder. The ball
    dropping speed also affects game difficulty. Slowly dropping balls are easy to
    pop - fast ones are not. Play with the game to see what speeds would work for
    different difficulty levels.


    Make it possible to play longer games and, as as the game goes on, make the game
    more difficult using some of the ideas above (smaller arrow, faster balls). You''ve
    seen this in other games you may have played - games usually get harder as time
    goes on.


    Players like to know how much time they have left in a game. Add this capability
    to your game. Use a text box control to display the number of seconds remaining.
    You''ll need another timer control with an Interval of 1000 (one second). Whenever
    this timer''s Tick event is executed, another second has gone by. In this event,
    subtract 1 from the value displayed in the label. You should be comfortable making
    such a change to your project.'
  merge: -1
  pgno: 426
