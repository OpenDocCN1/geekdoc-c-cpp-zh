  md: '# Your First Visual C# Express Project


    That''s all there is to setting control properties. First, select the control
    of interest from the control list. Then, scroll down through properties and find
    the property you want to change. Click on that property. Properties may be changed
    by typing in a new value (like the Width and Height values and the Text property)
    or choosing from a list of predefined options (available as a drop-down list,
    like color values).


    Let''s look at some of the button properties. Add a button control to your form.
    Select the button in the control list of the properties window. Like the form,
    the button is also rectangular. Scroll down to the Size property and click on
    the little plus (+) to expand this property. The Width property gives its width
    in pixels and Height gives its height in pixels. Two other properties specify
    the location of the button on the form. Scroll down to the Location property and
    expand it. Values for X (the Left property) and Y (the Top property) are displayed.
    Left gives the horizontal position (in pixels) of the left side of the button
    relative to the left side of the form. Similarly, Top is the vertical position
    (in pixels) of the top side of the button relative to the top of the form (the
    top of the form being defined as the lower part of the title bar). For a single
    button, these properties are:


