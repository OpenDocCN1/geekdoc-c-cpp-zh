  md: '# Panels, Mouse Events, Colors


    # Write Event Methods


    This project will work like any paint type program you may have used. Click on
    a color in the Color group box (we''ll see colors there soon) to choose a color
    to draw with. Then, move to the blackboard, left-click to start the drawing process.
    Drag the mouse to draw lines. Release the mouse button to stop drawing. It''s
    that easy. Click Erase will clear the blackboard and clicking Exit will stop the
    program. Every step, but initializing a few things and stopping the program, is
    handled by the panel mouse events.


    Three variables are used in this project. We need a Boolean variable (mousePress)
    that tells us whether the left mouse button is being held down. Lets us know if
    we should be drawing or not. We need two variables (xLast and yLast) that save
    the last point drawn in a line (we will always connect the "current" point to
    the "last" point). We also need a graphics object (myGraphics) and a pen object
    (myPen). Open the code window and declare these variables in the general declarations
    area:


    ```

    bool mousePress;

    int xLast;

    int yLast;

    Graphics myGraphics;

    Pen myPen;

    ```


    We need to establish some initial values. First, we create the graphics object
    (myGraphics) we will draw on and our pen object (myPen). We will set the pen to
    an initial drawing color of gray. How will we pick colors? Each radio button has
    a BackColor property. We set each BackColor property to its corresponding color
    using C# some word describing it. The eight colors we use are values from the
    Color structure. These colors were selected to look good on a black background.
    As seen, the initial color will be Gray, so we set the rdoGray radio button Checked
    property to'
