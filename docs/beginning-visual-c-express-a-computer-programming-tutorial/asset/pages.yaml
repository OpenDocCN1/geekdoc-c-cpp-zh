  md: "# Timers, Animation, Keyboard Events 10-3\n\n# Events\n\nThe timer control\
    \ has a single event:\n\n| Event | Description |\n| --- | --- |\n| Tick | Event\
    \ method executed every Interval milliseconds when timer control Enabled property\
    \ is True. |\n\n# Examples\n\nA few examples should clarify how the timer control\
    \ works. It's very simple and very powerful. Here's what happens. If a timer control's\
    \ Enabled property is True (the timer is on), every Interval milliseconds, Visual\
    \ C# Express will generate an event and execute the corresponding Tick event method.\
    \ No user interaction is needed. If your timer is named timExample, the Timer\
    \ event method has the form:\n\n```\nprivate void timExample_Tick(object sender,\
    \ EventArgs e)\n{\n    [C# code to be executed every Interval milliseconds]\n\
    }\n```\n\nWhatever C# code you want to execute is put in this method.\n\nThe Interval\
    \ property is the most important timer control property. This property is set\
    \ to the number of milliseconds between timer events. A millisecond is 1/1000th\
    \ of a second, or there are 1,000 milliseconds in a second. If you want to generate\
    \ N events per second, set Interval to 1000 / N. For example, if you want a timer\
    \ event to occur 4 times per second, set Interval to 250. About the lowest practical\
    \ value for Interval is 50 and values that differ by 5, 10, or even 20 are likely\
    \ to produce similar results. It all depends on your particular computer."
