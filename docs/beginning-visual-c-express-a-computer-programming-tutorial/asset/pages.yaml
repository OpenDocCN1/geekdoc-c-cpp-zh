  md: "# Panels, Mouse Events, Colors 8-23\n\n# MouseDown Event\n\nThe MouseDown event\
    \ method is triggered whenever a mouse button is pressed while the mouse cursor\
    \ is over a control. The form of this method is:\n\n```\nprivate void controlName_MouseDown(object\
    \ sender,\nMouseEventArgs e)\n{\n    [C# code for MouseDown event]\n}\n```\n\n\
    This is the first time we will use the arguments (information in parentheses)\
    \ in an event method. This is information C# is supplying, for our use, when this\
    \ event method is executed. Note this method has two arguments: sender and e.\
    \ sender is the control that was clicked to cause this event (MouseDown) to occur.\
    \ In our case, it will be the panel control. The argument e is an event handler\
    \ revealing which button was clicked and the coordinate of the mouse cursor when\
    \ a button was pressed. We are interested in three properties of the event handler\
    \ e:\n\n| Value | Description |\n| e.Button | Mouse button pressed. Possible values\
    \ are: MouseButtons.Left, MouseButtons.Center, MouseButtons.Right |\n| e.X | X\
    \ coordinate of mouse cursor in control when mouse was clicked |\n| e.Y | Y coordinate\
    \ of mouse cursor in control when mouse was clicked |"
