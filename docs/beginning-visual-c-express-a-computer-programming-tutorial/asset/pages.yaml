  md: '# Beginning Visual C# Express


    Change the Visible property back to True. Place a label in the group box. Change
    the BackColor property of the group box. Notice the background color of the label
    control takes the same value, while the button controls are unaffected. Recall
    this is because the group box is a ''container'' control. Sometimes, the sharing
    of properties is a nice benefit, especially with label controls. Other times,
    it is an annoyance. If you don''t want controls to share properties (BackColor,
    Foreground, Font) with the group box, you must change the properties you don''t
    like individually. Group boxes will come in very handy with the next two controls
    we look at: the check box and the radio button. You will see this sharing of color
    properties is a nice effect with these two controls. It saves us the work of changing
    lots of colors!


    # Typical Use of Group Box Control


    The usual design steps for a group box control are:


    +   - Set Name and Text property (perhaps changing Font, BackColor and Foreground
    properties).

    - Place desired controls in group box. Monitor events of controls in group box
    using usual techniques.'
