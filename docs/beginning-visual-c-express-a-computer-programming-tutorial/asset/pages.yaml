  md: '# About The Authors


    Philip Conrod holds a BS in Computer Information Systems and a Master''s certificate
    in the Essentials of Business Development from Regis University. Philip has been
    programming computers since 1978. He has authored, co-authored and edited numerous
    beginning programming books for kids, teens and adults. Philip also held various
    Information Technology leadership roles in companies like Sundstrand Aerospace,
    Saf Insurance Companies, FamilyLife, Kenworth Truck Company, and PACCAR. Today,
    Philip serves as the Chief Information Officer for a large manufacturing company
    based in Seattle, Washington. In his spare time, Philip serves as the President
    of Kidware Software, LLC. Philip makes his home with his three lovely and "techie"
    daughters in Maple Valley, Washington.


    Lou Tylee holds BS and MS degrees in Mechanical Engineering and a PhD in Electrical
    Engineering. Lou has been programming computers since 1969 when he took his first
    Fortran course in college. He has written software to control suspensions for
    high speed ground vehicles, monitor nuclear powers, lower noise levels in commercial
    jetliners, compute takeoff speeds for jetliners, locate and identify air and ground
    traffic and let kids count bunnies, learn how to spell and do math problems. He
    has written several on-line texts teaching Visual Basic, Visual C# and Java to
    thousands of people. He taught a beginning Visual Basic course for over 15 years
    at a major university. Currently, Lou works as an engineer at a major Seattle
    aerospace firm. He is the proud father of five children and proud husband of his
    special wife. Lou and his family live in Seattle, Washington.


