  md: '# Panels, Mouse Events, Colors 8-47


    There is one effect of the Blackboard Fun project that is annoying. You may have
    discovered it. You may not have. In the upper right corner of the form is a small
    button with an "underscore" called the minimize button:


    Minimize


    ![](img/c63eb66eb41098f8665780f53d3f34a3_312_0.png)


    When you click this button, your application window disappears (is minimized)
    and is moved to the Windows task bar at the bottom of the screen. When you click
    your application name in the task bar, it will return to the screen. Go ahead
    and try it. Run the project and draw a few lines. Don’t draw anything too elaborate
    – you’ll find out why. Minimize your application, restore your application by
    clicking the appropriate button in the Windows task bar. Where did your lines
    go?


    Why did the lines disappear when the project went away for a bit? Visual C# Express
    graphics objects have no memory. They only display what has been last drawn on
    them. If you reduce your form to an icon on the task bar and restore it (as we
    just did), the graphics object cannot remember what was displayed previously –
    it will be cleared. Similarly, if you switch from an active Visual C# Express
    application to some other application, your Visual C# Express form may become
    partially or fully obscured. When you return to your Visual C# Express application,
    the obscured part of any graphics object will be erased. Again, there is no memory.
    Notice in both these cases, however, all controls are automatically restored to
    the form. Your application remembers these, fortunately! The controls are persistent.
    We also want persistent graphics.'
  merge: -1
  pgno: 312
- img_proc: true
  md: "The topic of persistent graphics is beyond the scope of this course. To eliminate\
    \ this annoyance in the blackboard project, however, we will show you coding changes\
    \ needed to add persistence. Only a few lines and/or code need to be changed.\
    \ Make the changes if you like. In each case, the modified and/or new code is\
