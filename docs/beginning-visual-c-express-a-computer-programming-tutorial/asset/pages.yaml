  md: '# Additional Projects


    # Write Event Methods


    In this program, you need to store information about your stocks (date purchased,
    purchase price and shares owned) in data arrays (the form Load method). Then,
    you use the Previous and Next buttons to view each stock. For the displayed stock,
    if you type in the current price (Today''s Price) and click Compute Return, you
    will be shown the current value and yearly return for that stock.


    In this project, we introduce an idea thats there is a certain segment of code
    that needs to be repeated and used in various parts of a project, we put the corresponding
    code in something called a general method. This saves us from having to repeat
    code in different locations – a maintenance headache. A general method is identical
    in use to an event method, with the only difference being that it is not invoked
    by some control event. We control invocation of a general method by calling it.
    In this project, we will use a general method to display the stock information
    after pressing the Previous or Next button. Look for the code (method is named
    ShowStock) and see how easy it is to use.


    Add this code to the general declarations area:


    ```

    int numberStocks;

    int currentStock;

    DateTime[] stockDate = new DateTime[25];

    string[] stockName = new string[25]

    double[] stockPrice = new double[25];nint[] stockShares = new int[25];

    ```'
