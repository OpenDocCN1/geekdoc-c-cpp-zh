- img_proc: true
  md: '# Picture Boxes, Arrays 9-19


    C# provides a way to store a large number of variables under the name - variable
    arrays. Each variable in an array, called an element, must have the same data
    type, and they are distinguished from each other by an array index. A variable
    array is declared in a similar way to other variables. To indicate the variable
    is an array, you use two square brackets ([]) after the type. Square brackets
    are used for lot arrays. At the same time you declare an array, it is good practice
    to create it using the new keyword. For 352 student names and 352 student scores,
    we declare and create the arrays using:


    ```

    string[] student = new string[352];

    int[] score = new int[352];

    ```


    The number in brackets is called the array dimension. These two lines have the
    same effect as the 704 declaration lines we might have had to write! And how easy
    it is to add 200 more variables if we needed them. You can also declare and create
    an array in two separate statements if you prefer. For the student name array,
    that would be:


    ```

    string[] student; // the declaration

    student = new string[352]; // the creation

    ```


    We have 352 student variables (string type) and 352 score variables (int type)
    available for our. A very important concept to be aware of is that C# what are
    called zero-based arrays. This array indices begin with 0 and end at the dimension
    value minus 1, in this case 351. Each variable in an array is referred to by its
    declared name and index. The first student name in the array would be student[0]
    and the last name would be student[351], not student[352]. If you try to refer
    to student[352], you will get a run-time error saying an array is out of bounds.
    This is a common mistake! When working with arrays in C#, always be aware they
    are zero-based.'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'As an example of using an array, to assign information to the student index
    of 150 (actually, the 151st student in the array because of the zero base), we
    could write two lines of code like this:


    ```

    student[150] = "Billy Gates";

    score[150] = 100;

    ```


    Array variables can be used anywhere regular variables are used. They can be used
    on the left side of assignment statements or in expressions. To add up the first
    three test scores, you would write:


    ```

    sum = score[0] + score[1] + score[2];

    ```


    Again, notice the first score in the array is score[0], not score[1]. I know this
    is confusing, but it''s something you need to remember. We still need to provide
    values for each element in each array, but there are also some shortcuts we can
    take to avoid lots of assignment statements. One such shortcut, the for loop,
    is examined next. You will find variable arrays are very useful when working with
    large numbers (and sometimes, not so large numbers) of similar variables.'
  merge: -1
