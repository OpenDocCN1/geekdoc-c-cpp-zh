  md: '# Additional Projects


    # Run the Project


    Save your work. Run the project. You should figure out the game fairly quickly.
    The computer will decide who goes first. When it is your turn, click ''Roll Dice''.
    After each roll, decide whether to roll again or pass the dice to the computer
    (click Pass Dice''). If you get a frown on any roll, your score will be adjusted
    accordingly and the dice passed to the computer. When it''s the computer''s turn,
    you will watch the computer roll and make its decisions using the same rules.
    The game is over when either you or the computer has a Total Score of at least
    100 points. Click Stop Game at any time to stop the game before its end. Here''s
    the middle of a game I played:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_522_0.png)'
  merge: -1
  pgno: 522
- img_proc: true
  md: '# Other Things to Try


    A first change to Frown would be to make it a two player game - eliminate the
    computer and play against a friend. You essentially need to have two group boxes
    and code like that for the human player. You might also like to have an adjustable
    winning score.


    The computer logic used by the program is fairly simple – when it is far behind
    it tends to take more risks. This logic is in the timComputer_Tick event method.
    Study the logic and see if you can improve upon it. Have your computer play someone
    else’s computer.'
  merge: -1
