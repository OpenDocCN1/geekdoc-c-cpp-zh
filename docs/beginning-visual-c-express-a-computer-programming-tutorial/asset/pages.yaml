  md: '# Beginning Visual C# Express


    # String Concatenation


    A confession - in the above discussion, you were told a little lie. The statement
    was made that you couldn''t add and and multiply strings. Well, you can''t multiply
    them, but you can do something similar to addition. Many times in Visual C# Express
    projects, you want to take a string variable from one place and ''tack it on the
    end'' of another string. The fancy word for this is string concatenation. The
    concatenation operator is a plus sign (+) and it is easy to use. As an example:


    ```

    newString = "Visual C# Express " + "is Fun!";

    ```


    After this statement, the string variable newString will have the value “Visual
    C# Express is Fun!”.


    Notice the string concatenation operator is identical to the addition operator.
    We always need to insure there is no confusion when using both. As you''ve seen,
    string variables are a big part of Visual C# Express. As you develop as a programmer,
    you need to become comfortable with strings and working with them. You''re now
    ready to attack a new project.'
