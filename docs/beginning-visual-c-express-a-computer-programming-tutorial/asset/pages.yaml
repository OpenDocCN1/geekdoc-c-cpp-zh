  md: '# Stopping a Visual C# Express Project


    There are many ways to stop a Visual C# Express project. We will use the toolbar.
    Look for a button that looks like the Stop button on a VCR, CD player, or cassette
    tape player (you may have to move the project form down a bit on the screen to
    see the toolbar):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_42_0.png)


    Click on this button (you may have to click it twice). The project will stop and
    Visual C# Express will return to design mode.


    Alternate ways to stop a project are:


    +   * Selecting the Debug menu heading, then clicking Stop Debugging

    * Click the Close button found on the form. It is the little button that looks
    like an X in the upper right corner of the form.'
