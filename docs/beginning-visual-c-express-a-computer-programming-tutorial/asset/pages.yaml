  md: '# 10-2 Beginning Visual C# Express


    # Timer Control


    The Visual C# Express timer control has an interesting feature. It is the one
    control that can generate events without any input from the user. Timer controls
    work in your project''s background, generating events at time intervals you specify.
    This event generation feature comes handy for graphics animation where screen
    displays need to be updated at regular intervals. The timer control is selected
    from the toolbox. It appears as:


    In Toolbox:


    Below Form (default properties):


    ![](img/c63eb66eb41098f8665780f53d3f34a3_369_0.png)


    ![](img/c63eb66eb41098f8665780f53d3f34a3_369_1.png)


    There is no user interface (nothing to click or nothing to look at) for the timer
    control, so it will not appear on the form. Such controls are placed in the “tray
    area” below the form in the design window.


    # Properties


    The timer control properties are:


    | Property | Description |

    | --- | --- |

    | Name | Name used to identify timer control. Three letter prefix for timer names
    is tim. |

    | Interval | Number of milliseconds between timer events. There are 1000 milliseconds
    in one second. |

    | Enabled | Used to turn timer control on and off. When True, timer continues
    to generate events until set to False. |'
  merge: -1
