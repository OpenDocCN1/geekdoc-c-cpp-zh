  md: '# Icons, Group Boxes, Check Boxes, Radio buttons 7-15


    # Example


    Start Visual C# Express and start a new project. Draw a group box - we will always
    use group boxes to group check boxes. Place three or four check boxes in the group
    box using techniques discussed earlier. Move the group box to make sure the check
    boxes are in the group box. Run the project. Click the check boxes and see how
    the check marks appear and disappear. Notice you can choose as many, or as few,
    boxes as you like. In code, we would examine each check box''s Checked property
    to determine which boxes are selected. Stop the project. Change the BackColor
    of the group box. Notice the check box controls'' background color changes to
    match. This is a nice result of using the group box as a container.


    Did you notice we didn''t have to write any C# code to make the check marks appear
    or go away? That is handled by the check box control. There are check box events,
    however. Let''s look at one.


    # Events


    The only check box event of interest is the CheckedChanged event:


    | Event | Description |

    | --- | --- |

    | CheckedChanged | Event executed when Checked property of a check box changes.


    The event occurs each time a user clicks on a check box, either placing a check
    mark in the box or removing one.'
