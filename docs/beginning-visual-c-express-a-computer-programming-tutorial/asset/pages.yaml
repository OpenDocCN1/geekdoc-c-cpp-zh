  md: "# Picture Boxes, Arrays\n\n# C# Loops\n\nA common computer programming task\
    \ is counting. We might like to execute some C# code segment a particular number\
    \ of times - we would need to count how many times we executed the code. In the\
    \ school score example from above, we need to go through all 352 scores to compute\
    \ an average. C# offers a convenient way to do counting: the for loop.\n\nThe\
    \ C# for loop has this unique structure:\n\n```\nfor (initialization; expression;\
    \ update)\n{\n  [C# code block to execute]\n}\n```\n\nAfter the word for are three\
    \ parts separated by semicolons: initialization, expression, and update. The first,\
    \ initialization, is a step executed once and is used to initialize a counter\
    \ variable (usually an int type). A very common initialization would start a counter\
    \ i at zero:\n\ni = 0\n\nThe second part, expression, is a step executed before\
    \ each iteration (repetition) of the code in the loop. If expression is true,\
    \ the code is executed; if false, program execution continues at the line following\
    \ the end of the for loop. A common expression would be:"
  merge: -1
  pgno: 336
- img_proc: true
  md: "# Beginning Visual C# Express\n\n```\ni < iMax\n```\n\nThe final part, update,\
    \ is a step executed after each iteration of the code in the loop; it is used\
    \ to update the value of the counter variable. A common update would be:\n\n```\n\
    i = i + 1\n```\n\nUsing these example steps, a for loop appears as:\n\n```\nfor\
    \ (i = 0; i < iMax; i = i + 1)\n{\n    [C# code block to execute]\n}\n```\n\n\
    In this example, the counter i is initialized at 0 and is then incremented (changed)\
    \ by 1 each time the program executes the loop. For each execution of the loop,\
    \ any code between the two curly braces is repeated. The loop is repeated as long\
    \ as i remains smaller than iMax. When the loop is completed, program execution\
    \ continues after the closing brace. To leave the loop before completion, you\
    \ can use the break statement introduced with the switch structure.\n\nA few examples\
    \ should clear things up. Assume we want to set the value of 10 elements of some\
    \ array, myArray[10], to 0. For the loop that would accomplish this task is:\n\
    \n```\nFor (i = 0; i < 10; i = i + 1)\n{\n    myArray[i] = 0;\n}\n```"
