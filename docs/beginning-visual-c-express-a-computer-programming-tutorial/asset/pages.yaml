    \ sender, EventArgs e)\n{\n    int[] vUsed = new int[50];\n    int[] index = new\
    \ int[4];\n    int j;\n    // Generate the next question at random\n    btnNext.Enabled\
    \ = false;\n    answer = myRandom.Next(50);\n    // Display selected state\n \
