    a little picture appears in the upper left hand corner of the form. This picture
    is called an icon. Icons are used throughout the Windows environment. There are
    probably lots of icons on your Windows desktop - each of these represents some
    kind of application. Look at files using Windows Explorer. Notice every file has
    an icon associated with it. Here is a blank Visual C# Express form:


    ![](img/c63eb66eb41098f8665780f53d3f34a3_221_0.png)


    The icon seen is the default Visual C# Express icon for forms. It''s really kind
    of boring. Using the Icon property of the form, you can change this displayed
