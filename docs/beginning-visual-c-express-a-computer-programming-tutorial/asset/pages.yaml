    the message box (txtMessage). So, we need a Click event method for each button.


    Two variables are needed in this project, both int types. One variable will store
    the number selected by the computer (the number you are trying to guess). We call
    this variable theNumber. Your current guess will be saved in the variable myGuess.
    You will also need a Random object named myRandom. Open the code window and declare
    these variables in the general declarations area under the form constructor method:


    ```

    int theNumber;

    int myGuess;

    Random myRandom = new Random();

    ```'
