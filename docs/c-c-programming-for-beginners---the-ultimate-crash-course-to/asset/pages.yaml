  md: '# Chapter 5 – Getting Down with Lists


    Lists are commonly used to keep you from having to make a set declaration as to
    the size of how long an object list will be. A list can go on indefinitely or
    it can be shortened as much as you want.


    The problem with lists though is that they aren’t quite as accessible as other
    forms (such as arrays) considering that you have to go through each process of
    a list before you reach the portion that you want.


    Imagine it like the times that you feel out those wonderful forms for different
    applications online. Many times you would like to skip some of unnecessary information
    and get right to the point of just clicking on the ‘accept’ button, only you can’t.


    You have to take your time and actually go through every little step in order
    to get to the point where you fully move forward. That’s the way lists work. They
    can work greatly to your advantage, and a linked list can certainly give great
    efficiency given its expandability, but remember that it comes at the cost of
    having to have your user through every little step.


    Before you decide to make a list in one of your classes you have to make sure
    that you can actually have a list in it. This is done through the following command:
    “class LinkableClass”.


    This leads up to the next important piece of code: “Next”. This is the bit of
    code that will continue the list on to the next portion of the ladder. It gets
    you through the list by essentially forming a chain for the list. You then continue
    the list using //// for each of the different members that are included in the
    class.


    When you are starting off the list you use the code: “Next”, to define that it
    is the head of the chain. Then at the end when you are finished you simply close
    with “Head”.


    Not necessarily the first thing you would think of when it comes to closing a
    list, but then again we are talking about coding terminology here. You have to
    suspend anything that makes you too much sense. Computers talk funny. “Head” essentially
    commands the chain to close back to the beginning of it.'
