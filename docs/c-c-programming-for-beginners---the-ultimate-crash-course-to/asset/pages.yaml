  md: '# Chapter 2 – Really Important Characters (Really They Are)


    In each line of code that you see, most of them at any rate, you will see the
    use of the backslash a lot.


    You use the backslash in combination with another character or letter to perform
    a set every time it appears in your code. For instance, if you want to start a
    new line you would type `/n` in your code.


    You use `/t` to dictate that there needs to be a tab. `/0` (that’s a zero) to
    represent something is null. And lastly as we already covered you want to represent
    something simply a backslash you use the double backslash, `\\`.


    When you are building up different variables you can assign them to different
    functions by adding a character in front of the word. The front letter will also
    help you identify what mixed-mode of expression you are using.


    For the most part though you will find that it is best not to perform this type
    of coding in case you would use things like nVariable for ‘int’ and dVariable
    for ‘double’ and then cVariable for ‘character’ and szVariable for string.


    That aspect is okay for all intents and purposes but when you begin to mix them
    so that dVariable=cVariable you start to complicate things in a way that is not
    necessary when the programming of the compiler is well capable enough to handle
    these conversions for you automatically.


    You will experience this as you code and then it will make sense. For now, just
    know that you can simplify the naming of variables by placing a character or two
    in front of them.


    The next set of characters that you will want to involve operators that help the
    program distinguish essentially if something is true or false. If it again again
    in terms of ‘if this then’.


    If two values are always no matter (what they have the same value) then you would
    use a double equals `==` between variables and values.


    If there is inequality you use `!=` You are probably familiar with the greater
    or lesser signs. `<` and `>` they are as applicable in programming as they are
    in mathematics. You use `&&` to dictate the word ‘and’ and it means that both
    statements are true on both sides so long as the arguments are true that you use.


    If only one of them is true then you use this `||` if it is false (I it doesn’t
    make sense now) then you use the `||` symbol between both arguments.


    You will also need to eventually build loops in your coding. This is a series
    that will continue a certain action or condition is occurring. One of the easiest
    to do this is to specify it with the word “While” followed by the condition.


    So you could do something like “WhileStarting” followed by a set of commands marked
    by the beginning and ending loop characters of “{ to start and }”} to finish the
    loop.'
