    This lets the program know that it will be a number and that it will be a value
    that your standard radio station does. In order to fully connect this member function
    to your class you will need to make it connected by typing the following "Radio:addChannel(int,double)"


    This is essentially the full master of stating that the function goes along with
    that specific class. It can be shortened to simply ":addChannel(int.double)" but
    this would mean that the Class has nothing whatsoever do to the Radio class.


    As you add different member functions you will find that it is always best to
    keep them all directly in line with the class they go along with.


    This will help ease the stress on your processor but there are times when you
    will find the need to actually put the member function outside of the class.


    This can be when the member function is an exceptionally lengthy piece of code.
