  md: '# Chapter 4 – Using Classes to Help Build the Structure


    When you are writing code there is a stage where you will want to quit using all
    of the functional codes that mentioned earlier (and some of the other ones that
    you are surely to pick up in the beginning) and you will want to start to define
    classes.


    Classes are a great way to make sure that all the information you input stays
    within a group. When you set a class you define what the class will be.


    You could write, "classBandStartYear" and as you build the code around it you
    would write things such as "display(BandStartYear)\ and the code that you are
    talking about the programming that you designed to input the name of a band and
    it will spit out the corresponding date that the band started up given the long
    pages of coding that you have put in with a set of bands.


    You can see imagine that just coding for 30 different bands and their corresponding
    start dates would require lengthy coding to produce a very minimal result.


    The important thing that you realize is that building classes will help you group
    everything so that the program knows which set of commands to apply to your class.


    Let''s imagine you have made a class that involves something like "class Radio"
    in order to get the class to start doing things you will use different phrases
    as defined as functions that are key to the specific class that you assign them
    too.


    When you assign these functions they are known member functions and they will
    always refer back to the specific class that you set them in.


    You could do something like "channel()" inside of the radio class as a function
    to define a specific radio station that you know clearly. The program could store
    lists of applicable radio stations in your area that all come under "class Radio".


    Whenever you go through the process of adding a member function to a class with
