    # 初学者 C++ 编程 - 24小时内掌握 C++ 基础的终极速成课程！


    EDWARD COLE


    # C++：

    初学者 C++ 编程 - 24小时内掌握 C++ 基础的终极速成课程！


    # 目录


    - 引言

    - 第 1 章 – 掌握基础符号

    - 第 2 章 – 非常重要的字符（真的非常重要）

    - 第 3 章 – 学习不同的思考

    - 第 4 章 – 使用类帮助构建结构

    - 第 5 章 – 深入列表

    - 第 6 章 – 保护你的成员

    - 结


    # 引言


    大家好！我们将尽力攻克这种被称为 C++ 的奇妙且错综复杂的计算机语言。学习 C++ 确实需要相当的时间，事实上，你可能投入整个学期的时间来尝试掌握其中的错综之处。


    把它想象成学习任何语言一样。在真正能够用用完全变位的动词和生动的描述性元素组合成句子之前，你必须先学习声音的基础知识、单词的发音以及它们的含义。C++ 也是如此的。


    在这门速成课程中，我们将涵盖一些基础知识，希望在我们结束时，你已经对这种语言有了某种程度的认知，它对你来说不再那么陌生。或者至少，你将能够理解为什么某些东西会出现在那里，以及为什么会那样。


    这种基础语言由两个主要部分组成，它们基于与你现在阅读的语言相似的语言；而计算机语言的语法老实说，看起来就像……看起来就像计算机语言。


    它并不易读，而且似乎没有任何意义。然而，它是计算机交流的语言，如果你想让计算机按照你的要求工作，你就必须学会用它的语言交流。


    ## 开启异国之旅


    C++ 用于构建你用过的几乎所有的程序。它的目的是编写一系列计算机能够处理的命令，并将其转化为一系列相互关联的执行操作，从而开始执行你想要的功能。


    大多数人使用一种或另一种编辑器来编写代码，代码编写完成后，它必须通过编译器转换为计算机可以使用的格式。


    不过，你只需要知道这个过程即可，因为现在的大多数程序（或环境）都将这两个方面良好地封装在一个简单的软件包中，例如微软的 Visual C++ .Net。或者，你也可以通过在网上搜索公有领域的可共享版本来获取免费版本，这会很容易给你提供足够的访问权限，特别是在你学习编程的入门阶段。


    一旦你获取了许多可供你编写代码的不同环境之一，你就可以开始了。


    这个过程并不漂亮。它看起来并不华丽，而且编写代码绝没有任何花里胡哨。与现在许多使用更多拖拽式视觉元素的网站生成器不同，编写代码涉及一个枯燥的窗口，你在里面什么都不用做，只有输入。


    编写代码确实不适合心心软的人或缺乏耐心的人，但你已经走到了这里，显然你有某种通过征服编程来“惩罚”自己的欲望。


    不过它的好处是，一旦你掌握了它，你将成为许多企业和公司的宝贵资源，因为市场总是需要代码编写人员。


    此外，你可能很快就能能够构建你自己的程序，这可能让你成为下一个一夜成名的明星。奇的事情确实发生过。


    话虽如此，准备好卷起袖子，准备好面对比你找到答案更多的问题。这就是学习编程的常态。


    你会好奇如何做某事，并且很可能不得不去外面寻找其他开发者在程序中实现相同命令的方法。


    幸运的是，在大多数情况下，在线程序员社区通常非常愿意帮助其他程序员，因为这个过程是漫长的，需要坐在电脑前很多小时。任何形式的人类接触都是欢迎的，即使只是通过论坛。


    我们开始。


    # 第 1 章 – 掌握基础符号


    当你开始编写前几条命令时，你会注意到很多符号，如 `//` 和 `<在此处插入>` 以及其他命令如 `#include`。大多数人编写的代码都以一系列注释开头，这些注释是程序员使用的指令，用于确保程序朝着正确的方向发展。


    程序的代码行可能是无尽的，从一眼看去，你可能无法准确判断某段代码的意思。这就是为什么程序员通常使用前 6 行左右来解释代码正在发生什么。


    这些行以 `//` 开头，它们对程序本身实际上没有任何作用，只是为任何可能遇到这段代码副本的人提供一个清醒的目标。


    如果你观察某行代码，可能还会发现大多数行都相对短。传统的标准是保持每行在 80 个字符左右。这不是强制性的，但你会发现这确实比滚动长代码行要容易得多，因为你不需要让眼睛在整个屏幕上来回移动。


    你编写的每一行代码实际上都在告诉程序什么是“语句”(statement)，并且始终以 `;` 结尾。如果你能将编写代码的过程很大程度上看作类似于代数，那么你会进展顺利。比如
    `if...then` 或者 `X=2-Y` 或某种的变体。你还会学到 C++ 是大小敏感的。


    这大大增加了你所编写不同代码的可能性，但如果你不小心在某处大写了某个命令，而在另一个地方忘记这样做，就会变得很困难。


    你在创建变量时为它们命名，一个聪明的程序员会学会保持它们的名称简洁明了。


    当你设置变量时，你会使用命令 `int x`，或者将 `x` 替换为你任何想要作为变量的字母或数字。在 `{` 之后，你继续通过输入类似 `x=32;` 的内容告诉程序变量等于什么。


    显然，你做的将不仅仅是用数字和字母建立方程，而且


    等等，注意——C++ 是大小敏感的。


