    # Chapter 6 – Keeping Your Members Safe


    When you are creating member functions for certain classes you have to make sure
    that they cannot be affected by other commands that reside outside of the given
    class.


    This is a process of protecting them more often than not from yourself so that
    you don’t any harm to the integrity of the member function the further you delve
    into your coding. It’s not like you are protecting them with some wildly safe
    code. You are simply making sure they stay where you put them.


    This process also will help you ensure that the class that you have created continues
    to function in the manner that you made it.


    If suddenly another line of your code were interfering with the member function
    that you have set up, then the class that you created will no longer function
    the way that it previously did. This could actually mess up far more than simply
    the member function that you neglected protect.


    This will also enable you to deal with ‘chunks’ of a class in a much easier organized
    manner. If you ever need to replace part of it or make changes, you can do without
    necessarily jeopardizing the remainder of the class and the other member functions
    that fall under it.


    It is also an important part of coding that stays completely out of site from
    the person that is using the program.


    This is when you truly get to start to make the magic happen behind the scenes.
    It’s essentially the electricity that is flowing through your smartphone as you
    read this.


    The distinguishing terms for whether your class is public or protected is pretty
    straightforward for this instance. You use the word “public” in addition to the
    class to dictate that any of the other member functions that you may add down
    through the class can also apply to the class.


    If you want to protect it, you simply add “protected” in front of class to make
    sure that non-members of the class can’t jump in and start making changes that
    you don’t want or anticipate.


    When you are starting to develop classes, as a general rule of thumb, all programmers
    take the time to type out of the two commands as whether or not the class is public
    or protected.


    It is a quick change down the road to go from one or the other, but to keep things
    in good form, it is ideal to go ahead and make the declaration when you are building
    a class for the first time in every code.'
