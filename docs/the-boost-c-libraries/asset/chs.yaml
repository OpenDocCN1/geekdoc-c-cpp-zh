  \ 在头文件 `boost/cast.hpp` 中定义了转换运算符 `polymorphic_cast` 和 `polymorphic_downcast`。它们设计用于更精确地处理类型转换——通常使用\
  \ `dynamic_cast` 完成。\n\n#### 示例 54.1. 使用 `dynamic_cast` 进行向下转换和交叉转换\n\n```cpp\n\
  #include <iostream>\n\nstruct base1 { virtual ~base1() = default; };\nstruct base2\
  \ { virtual ~base2() = default; };\nstruct derived : public base1, public base2\
  \ {};\n\nvoid downcast(base1 *b1) {\n  derived *d = dynamic_cast<derived*>(b1);\n\
  }\n\nvoid crosscast(base1 *b1) {\n  base2 *b2 = dynamic_cast<base2*>(b1);\n}\n\n\
  int main() {\n  derived *d = new derived;\n  downcast(d);\n\n  base1 *b1 = new derived;\n\
  \  crosscast(b1);\n}\n```\n\n#### 示例 54.2. 使用 `polymorphic_downcast` 和 `polymorphic_cast`\
  \ 进行向下转换和交叉转换\n\n```cpp\n#include <boost/cast.hpp>\n#include <iostream>\n\nstruct\
  \ base1 { virtual ~base1() = default; };\nstruct base2 { virtual ~base2() = default;\
  \ };\nstruct derived : public base1, public base2 {};\n\nvoid downcast(base1 *b1)\
  \ {\n  derived *d = boost::polymorphic_downcast<derived*>(b1);\n}\n\nvoid crosscast(base1\
  \ *b1) {\n  base2 *b2 = boost::polymorphic_cast<base2*>(b1);\n}\n\nint main() {\n\
  \  derived *d = new derived;\n  downcast(d);\n\n  base1 *b1 = new derived;\n  crosscast(b1);\n\
  }\n```\n\n\n\n\n`boost::polymorphic_downcast`（参见 Example 54.2, “Down and cross casts\
  \ with `polymorphic_downcast` and `polymorphic_cast`）只能用于向下类型转换（downcasts），因为它使用\
  \ `static_cast` 来执行转换。由于 `static_cast` 不会动态检查转换的有效性，因此 `boost::polymorphic_downcast`\
  \ 必须仅在转换是安全时才使用。在调试构建版本中，`boost::polymorphic_downcast` 使用 `dynamic_cast` 和 `assert()`\
  \ 来确保类型转换是有效的。此测试仅在未定义 `NDEBUG` 宏时执行，而这通常是调试构建的情况。\n\n交叉类型转换（cross casts）需要 `boost::polymorphic_cast`。`boost::polymorphic_cast`\
  \ 使用 `dynamic_cast`，这是唯一可以执行交叉转换的转换操作符。使用 `boost::polymorphic_cast` 替 `dynamic_cast`\
  \ 更好，因为在发生错误时后者会抛出 `std::bad_cast` 类型的异常，而 `dynamic_cast` 在类型转换失败时会返回空指针。\n\n仅使用\
  \ `boost::polymorphic_downcast` 和 `boost::polymorphic_cast` 来转换指针；否则请使用 `dynamic_cast`。由于\
  \ `boost::polymorphic_downcast` 基于 `static_cast`，它无法将基类对象转换为派生类对象。此外，使用 `boost::polymorphic_cast`\
  \ 转换指针以外的类型也是没有意义的，因为如果转换失败，`dynamic_cast` 将抛出 `std::bad_cast` 类型的异常。\n\n# 第 XIII\
  \ 部分. 错误处理\n\n以下库支持错误处理。\n\n*   Boost.System 提供了描述和识别错误的类。从 C++11 开始，这些类已成为标准库的一部分。\n\
  *   Boost.Exception 允许在异常抛出后向其附带数据。\n\n# 55. Boost.System\n\n[Boost.System](http://www.boost.org/libs/system)\
  \ 是一个库，它本质上定义了四个类来识别错误。这四个类都随着 C++11 添加到了标准库中。如果你的开发环境支持 C++11，你就不需要使用 Boost.System。然而，由于许多\
  \ Boost 库使用了 Boost.System，你可能会通过其他库遇到 Boost.System。\n\n`boost::system::error_code`\
  \ 是 Boost.System 中基础的类；它代表特定操作系统的错误。由于操作系统通常会枚举错误，`boost::system::error_code` 将错误代码保存在\
  \ `int` 类型的变量中。Example 55.1, “Using `boost::system::error_code`]说明了如何使用该类。\n\n###\
  \ 示例 55.1. 使用 `boost::system::error_code`\n\n```\n#include <boost/system/error_code.hpp>\n\
  #include <iostream>\n\nusing namespace boost::system;\n\nvoid fail(error_code &ec)\n\
  {\n  ec = errc::make_error_code(errc::not_supported);\n}\n\nint main()\n{\n  error_code\
  \ ec;\n  fail(ec);\n  std::cout << ec.value() << '\\n';\n}\n```\n\nExample 55.1,\
  \ “Using `boost::system::error_code`] 定义了函数 `fail()`，它用于返回错误。为了让调用者检测到 `fail()`\
  \ 是否失败，通过引用传递了一个类型为 `boost::system::error_code` 的对象。Boost 库提供的许多函数都这样使用 `boost::system::error_code`。例如，Boost.Asio\
  \ 提供了函数 `boost::asio::ip::host_name()`，你可以向其传递一个类型为 `boost::system::error_code`\
  \ 的对象。\n\nBoost.System 在 `boost::system::errc` 命名空间中定义了许多错误代码。Example 55.1, “Using\
  \ `boost::system::error_code`] 将错误代码 `boost::system::errc::not_supported` 赋值给 `ec`。由于\
  \ `boost::system::errc::not_supported` 是一个数字而 `ec` 是 `boost::system::error_code`\
  \ 类型的对象，因此调用了函数 `boost::system::errc::make_error_code()`。该函数创建一个带有相应错误代码的 `boost::system::error_code`\
  \ 类型的对象。\n\n在 `main()` 中，对 `ec` 调用 `value()`。此成员函数返回存储在对象中的错误代码。\n\n默认情况下，0 表示没有错误。其他任何数字都代表错误。错误代码的值取决于操作系统。请参考你操作系统的文档来获取错误代码的描述。\n\
  \n除了 `value()` 之外，`boost::system::error_code` 还提供了成员函数 `category()`，它返回一个类型为 `boost::system::error_category`\
  \ 的对象。\n\n错误代码仅仅是数值。虽然像微软这样的操作系统厂商能够保证系统的唯一性，但对于开发者来说，保证错误代码的唯一性几乎是不可能的，因此需要错误类别。错误类别是存在的。\n\
  \n### 示例 55.2. 使用 `boost::system::error_code`\n\n```\n#include <boost/system/error_code.hpp>\n\
  #include <iostream>\n\nusing namespace boost::system;\n\nvoid fail(error_code &ec)\n\
  {\n  ec = errc::make_error_code(errc::not_supported);\n}\n\nint main()\n{\n  error_code\
  \ ec;\n  fail(ec);\n  std::cout << ec.value() << '\\n';\n  std::cout << ec.category().name()\
  \ << '\\n';\n}\n```\n\n`boost::system::error_code` 类型的错误可以通过 `category()` 成员函数获取其类别。使用\
  \ `errc::make_error_code()` 创建的错误属于通用类别。这是错误未显式分配类别时所属的类别。Example 55.1, “Using `boost::system::error_code`]\
  \ `category()` 返回错误的类别。这是一个 `boost::system::error_category` 类型的对象。只有少数成员函数。例如，`name()`\
  \ 获取类别的名称。Example 55.1, “Using `boost::system::error_code`] 向标准输出写入 `generic`。\n\
  \n你也可以使用全局函数 `boost::system::generic_category()` 来访问通用类别。\n\nBoost.System 提供了第二个类别。如果你调用全局函数\
  \ `boost::system::system_category()`，你会得到系统类的引用。如果你将类别名称写入标准输出，将显示 `system`。\n\n\
  错误由错误代码和错误类别唯一标识。由于错误代码只需要在类别内唯一，因此当你想要定义特定程序的错误代码时，应该创建一个新类别。这使得使用不与其他开发者冲突的代码成为可能。\n\
  \n### 示例 55.3. 创建错误类别\n\n```\n#include <boost/system/error_code.hpp>\n#include <string>\n\
  #include <iostream>\n\nclass application_category :\n  public boost::system::error_category\n\
  {\npublic:\n  const char *name() const noexcept { return \"my app\"; }\n  std::string\
  \ message(int ev) const { return \"error message\"; }\n};\n\napplication_category\
  \ cat;\n\nint main()\n{\n  boost::system::error_code ec{129, cat};\n  std::cout\
  \ << ec.value() << '\\n';\n  std::cout << ec.category().name() << '\\n';\n}\n```\n\
  \n一个新的错误类别是通过创建一个派生自 `boost::system::error_category` 的类定义的。这要求你定义各种成员函数。至少必须提供 `name()`\
  \ 和 `message()` 成员函数，因为它们在 `boost::system::error_category` 中被定义为纯虚成员函数。对于额外的成员函数，如果需要可以覆盖默认行为。\n\
  \n\n\n\n当 `name()` 返回错误类别的名称时，`message()` 用于检索特定错误代码的错误描述。与示例 55.3, “创建错误类别”不同，参数\
  \ `ev` 通常会被求值以返回基于错误代码的描述。\n\n新创建的错误类别类型的对象可以用于初始化错误代码。示例 55.3, “创建错误类别” 使用新类别 `application_category`\
  \ 定义了错误代码 `ec`。因此，错误代码 129 不再是一个通用错误；相反，它的含义由新错误类别的开发者定义。\n\n### 注意事项\n要使用 Visual\
  \ C++ 2013 编译示例 55.3, “创建错误类别”，请移除 `noexcept` 关键字。此版本的 Microsoft 编译器不支持 `noexcept`。\n\
  \n`boost::system::error_code` 提供了一个名为 `default_error_condition()` 的成员函数，它返回一个类型为\
  \ `boost::system::error_condition` 的对象。`boost::system::error_condition` 的接口与 `boost::system::error_code`\
  \ 的接口几乎相同。区别在于成员函数 `default_error_condition()`，它只由 `boost::system::error_code` 提供。\n\
  \n### 示例 55.4. 使用 `boost::system::error_condition`\n\n```\n#include <boost/system/error_code.hpp>\n\
  #include <iostream>\n\nusing namespace boost::system;\n\nvoid fail(error_code &ec)\n\
  {\n  ec = errc::make_error_code(errc::not_supported);\n}\n\nint main()\n{\n  error_code\
  \ ec;\n  fail(ec);\n  boost::system::error_condition ecnd = ec.default_error_condition();\n\
  \  std::cout << ecnd.value() << '\\n';\n  std::cout << ecnd.category().name() <<\
  \ '\\n';\n}\n```\n\n`boost::system::error_condition` 的用法就像 `boost::system::error_code`\
  \ 一样。这就是为什么如示例 55.4, “使用 `boost::system::error_condition``所示，可以对类型为 `boost::system::error_condition`的对象调用成员函数\
  \ `value()` 和 `category()`。\n\n虽然类 `boost::system::error_code` 用于依赖平台的错误代码，但 `boost::system::error_condition`\
  \ 用于访问与平台无关错误代码。成员函数 `default_error_condition()` 将依赖平台的错误代码转换为类型为 `boost::system::error_condition`\
  \ 的与平台无关错误代码。\n\n你可以使用 `boost::system::error_condition` 来识别与平台无关的错误。这种错误可以是，例如访问不存在的文件失败。虽然不同的操作系统可能提供不同的文件访问接口并返回不同的错误代码，但尝试访问不存在的文件在所有操作系统上都是一个错误。从特定操作系统接口返回的错误代码存储在\
  \ `boost::system::error_code` 中。描述访问不存在的文件失败的错误代码存储在 `boost::system::error_condition`\
  \ 中。\n\nBoost.System 提供的最后一个类是 `boost::system::system_error`，它派自 `std::runtime_error`。它可以用于异常中传输类型为\
  \ `boost::system::error_code` 的错误代码。\n\n### 示例 55.5. 使用 `boost::system::system_error`\n\
  \n```\n#include <boost/system/error_code.hpp>\n#include <boost/system/system_error.hpp>\n\
  #include <iostream>\n\nusing namespace boost::system;\n\nvoid fail()\n{\n  throw\
  \ system_error{errc::make_error_code(errc::not_supported)};\n}\n\nint main()\n{\n\
  \  try\n  {\n    fail();\n  }\n  catch (system_error &e)\n  {\n    error_code ec\
  \ = e.code();\n    std::cerr << ec.value() << '\\n';\n    std::cerr << ec.category().name()\
  \ << '\\n';\n  }\n}\n```\n\n在示例 55.5, “使用 `boost::system::system_error``中，独立函数 `fail()`\
  \ 已更改为在发生错误时抛出一个类型为 `boost::system::system_error` 的异常。该异常可以传输类型为 `boost::system::error_code`\
  \ 的错误代码。异常在 `main()` 中被捕获，并将错误代码和错误类别写入标准错误输出。函数 `boost::asio::ip::host_name()`\
  \ 的第二个变体也是这样工作的。\n\n# 56. Boost.Exception\n\n[Boost.Exception](http://www.boost.org/libs/exception)\
  \ 库提供了新类型 `boost::exception`，允许你在异常抛出后为其添加数据。`boost::exception` 支持嵌套异常。`boost::exception`\
  \ 类似于 `std::exception`。但是`boost::exception` 缺少对 `noexcept` 的支持。\n\n### 注意事项\n要使用\
  \ Visual C++ 2013 编译示例 56.1, “使用 `boost::exception`，请移除 `noexcept` 关键字。此版本的 Microsoft\
  \ 编译器不支持 `noexcept`。\n\n`boost::exception` 提供了一种向异常添加数据的机制。这是通过 `boost::error_info`\
  \ 实现的。`boost::error_info` 是一个模板类，接受一个标签（tag）和一个值类型。标签通常是一个用于识别信息的结构体。\n\n### 示例\
  \ 56.1. 使用 `boost::exception`\n\n```\n#include <boost/exception/all.hpp>\n#include\
  \ <exception>\n#include <new>\n#include <string>\n#include <algorithm>\n#include\
  \ <limits>\n#include <iostream>\n\ntypedef boost::error_info<struct tag_errmsg,\
  \ std::string> errmsg_info;\n\nstruct allocation_failed : public boost::exception,\
  \ public std::exception\n{\n  const char *what() const noexcept { return \"allocation\
  \ failed\"; }\n};\n\nchar *allocate_memory(std::size_t size)\n{\n  char *c = new\
  \ (std::nothrow) char[size];\n  if (!c)\n    throw allocation_failed{};\n  return\
  \ c;\n}\n\nchar *write_lots_of_zeros()\n{\n  try\n  {\n    char *c = allocate_memory(std::numeric_limits<std::size_t>::max());\n\
  \    std::fill_n(c, std::numeric_limits<std::size_t>::max(), 0);\n    return c;\n\
  \  }\n  catch (boost::exception &e)\n  {\n    e << errmsg_info{\"writing lots of\
  \ zeros failed\"};\n    throw;\n  }\n}\n\nint main()\n{\n  try\n  {\n    char *c\
  \ = write_lots_of_zeros();\n    delete[] c;\n  }\n  catch (boost::exception &e)\n\
  \  {\n    std::cerr << boost::diagnostic_information(e);\n  }\n}\n```\n\n`allocation_failed`\
  \ 派自 `boost::exception` 和 `std::exception`。将该类派自 `std::exception` 是并不是必要的。`allocation_failed`\
  \ 也可以派自另一个类层次结构中的类，以便将其嵌入现有的框架中。虽然示例 56.1, “使用 `boost::exception` 使用了标准定义的类层次结构，但仅将\
  \ `allocation_failed` 派自 `boost::exception` 就足够了。\n\n\n\n如果捕获到类型为 `allocation_failed`\
  \ 的异常，那么 `allocate_memory()` 必须是异常的来源，因为它是唯一抛出此类类型异常的函数。在有很多函数调用 `allocate_memory()`\
  \ 的程序中，仅知道异常的类型不足以有效地调试程序。在这些情况下，如果知道是哪个函数尝试分配了 `allocate_memory()` 所能提供的内存，将大有帮助。\n\
  \n挑战在于，`allocate_memory()` 并没有包含任何额外信息（例如调用者名称）可以添加到异常中。`allocate_memory()` 无法富化异常。这只能在调用上下文中完成。\n\
  \n使用 Boost.Exception，可以在任何时间向异常中添加数据。你只需要为需要添加的每部分数据基于 `boost::error_info` 定义一个类型即可。\n\
  \n`boost::error_info` 是一个期望两个参数的模板。第一个参数是一个用于唯一标识新创建类型的标签（tag），这通常是一个具有唯一名称的结构体。第二个参数引用存储在异常内部的值的类型。Example\
  \ 56.1, “Using `boost::exception`” 定义了一个新类型 `errmsg_info` —— 通过结构体 `tag_errmsg`\
  \ 唯一标识 —— 它存储一个 `std::string` 类型的字符串。在 `write_lots_of_zeros()` 的 `catch`处理器中，`errmsg_info`\
  \ 用于创建一个初始化为字符串“writing lots of zeros.”的对象。该对象随后通过 `operator<<` 添加到 `boost::exception`\
  \ 类型异常中。然后异常被重新抛出。现在，异常不仅表示内存分配失败，还说明当程序尝试在 `write_lots_of_zeros()` 函数中写入零时内存分配失败。知道哪个函数调用了\
  \ `allocate_memory()` 会使调试变得更容易。要从异常中检索所有可用数据，可以在 `main()` 的 `catch`处理器中调用函数 `boost::diagnostic_information()`。`boost::diagnostic_information()`\
  \ 为传递给它的异常调用成员函数 `what()` 并访问存储在异常内部的所有数据。`boost::diagnostic_information()` 返回一个\
  \ `std::string` 类型的字符串。\n\n使用 Visual C++ 2013 编译时，Example 56.1, “Using `boost::exception``\
  \ 将显示如下：\n\n```\nThrow location unknown (consider BOOST_THROW_EXCEPTION)\nDynamic\
  \ exception type: struct allocation_failed\nstd::exception::what: allocation failed\n\
  [struct tag_errmsg *] = writing lots of zeros\n```\n\n消息包含异常类型、从 `what()` 检索的描述。`boost::diagnostic_information()`\
  \ 在运行时检查异常是否派自 `std::exception`。如果是这种情况，抛出 `allocation_failed` 类型异常的函数名称未知。Boost.Exception\
  \ 提供了一个宏来抛出异常，该异常不仅包含函数名，还包含文件名和行号等额外数据。使用 `BOOST_THROW_EXCEPTION` 替 `throw`，函数名、文件名和行号数据会自动添加到异常中。但这仅在编译器支持额外数据的宏时才有效。虽然像\
  \ `__FILE__` 和 `__LINE__` 宏自 C++98 起就已经标准化，但获取当前函数名称的宏 `__func__` 直到 C++11 才成为标准。由于许多编译器在\
  \ C++11 之前提供了此类宏，`BOOST_THROW_EXCEPTION` 会尝试识别编译器并使用相应的宏。\n\n使用 Visual C++ 2013\
  \ 编译，Example 56.2, “More data with `BOOST_THROW_EXCEPTION`` 显示如下消息：\n\n```\nmain.cpp(20):\
  \ Throw in function char *__cdecl allocate_memory(unsigned int)\nDynamic exception\
  \ type: class boost::exception_detail::clone_impl<struct\n  boost::exception_detail::error_info_injector<struct\
  \ allocation_failed> >\nstd::exception::what: allocation failed\n[struct tag_errmsg\
  \ *] = writing lots zeros failed\n```\n\n在 Example 56.2, “More data with `BOOST_THROW_EXCEPTION`\
  \ 中，`allocation_failed` 不再派自 `boost::exception`。`BOOST_THROW_EXCEPTION` 访问函数 `boost::enable_error_info()`\
  \ 来识别异常是否派自 `boost::exception`。如果不是，它创建一个派自指定类型和 `boost::exception` 的新异常类型。这就是为什么上面的消息包含与\
  \ `allocation_failed`不同的异常类型。\n\nExample 56.2. More data with `BOOST_THROW_EXCEPTION`\n\
  \n```cpp\n#include <boost/exception/all.hpp>\n#include <exception>\n#include <new>\n\
  #include <string>\n#include <algorithm>\n#include <limits>\n#include <iostream>\n\
  \ntypedef boost::error_info<struct tag_errmsg, std::string> errmsg_info;\n\nstruct\
  \ allocation_failed : public std::exception\n{\n  const char *what() const noexcept\
  \ { return \"allocation failed\"; }\n};\n\nchar *allocate_memory(std::size_t size)\n\
  {\n  char *c = new (std::nothrow) char[size];\n  if (!c)\n    BOOST_THROW_EXCEPTION(allocation_failed{});\n\
  \  return c;\n}\n\nchar *write_lots_of_zeros()\n{\n  try\n  {\n    char *c = allocate_memory(std::numeric_limits<std::size_t>::max());\n\
  \    std::fill_n(c, std::numeric_limits<std::size_t>::max(), 0);\n    return c;\n\
  \  }\n  catch (boost::exception &e)\n  {\n    e << errmsg_info{\"writing lots of\
  \ zeros failed\"};\n    throw;\n  }\n}\n\nint main()\n{\n  try\n  {\n    char *c\
  \ = write_lots_of_zeros();\n    delete[] c;\n  }\n  catch (boost::exception &e)\n\
  \  {\n    std::cerr << boost::diagnostic_information(e);\n  }\n}\n```\n\n`boost::diagnostic_information()`\
  \ 不使用 `diagnostic_information()`，它使用 `boost::error_info()` 直接访问类型为 `errmsg_info`\
  \ 的错误消息。因为 `boost::error_info()` 返回类型为 `boost::shared_ptr` 的智能指针，所以使用 `operator*`\
  \ 来获取错误消息。如果传递给 `boost::error_info()` 的参数不是类型 `boost::exception`，则返回一个空指针。如果始终使用\
  \ `BOOST_THROW_EXCEPTION` 宏来抛出异常，则异常总是派自 `boost::exception` —— 无需检查返回的智能指针是否为空。\n\
  \n# 第 XIV 部分 数字处理\n\n\n\n\n以下库都与数字处理有关。\n\n*   `Boost.Integer` 提供了整数类型，例如用于指定变量所占用的精确字节数。\n\
  *   `Boost.Accumulators` 提供了累加器，当你计算平均值或标准差等数值时，可以把数字传递给累加器。\n*   `Boost.MinMax`\
  \ 允许你通过一次函数调用获取容器中最小和最大的数字。\n*   `Boost.Random` 提供了随机数生成器。\n*   `Boost.NumericConversion`\
  \ 了一种了一种类型转换运算符，可以防止意外的溢出。\n\n# 57. Boost.Integer\n\n[Boost.Integer](http://www.boost.org/libs/integer)\
  \ 提供了头文件 `boost/cstdint.hpp`，该文件为整数定义了特殊类型。这些定义源自 C99 标准。这是 1999 年发布的 C 语言标准的一个版本。由于第一个运行的\
  \ C++ 标准发布于 1998 年，因此它不包含 C99 中定义的特殊整数类型。\n\nC99 在 `stdint.h` 头文件中定义了这些类型。该头文件被引入了\
  \ C++11。在 C++ 中，它被称为 `cstdint`。如果你的开发环境支持 C++11，你可以访问 `cstdint`，而无需使用 `boost/cstdint.hpp`。\n\
  \n来自 `boost/cstdint.hpp` 的类型定义在 `boost` 命名空间中。它们可以分为三类：\n\n*   如 `boost::int8_t`\
  \ 和 `boost::uint64_t` 等类型在其名称中带有精确的内存大小。因此，`boost::int8_t` 恰好包含 8 位，`boost::uint64_t`\
  \ 恰好包含 64 位。\n*   如 `boost::int_least8_t` 和 `boost::uint_least32_t` 等类型包含的位至少与其名称所示相同。`boost::int_least8_t`\
  \ 的内存大小可能大于 8 位，`boost::uint_least32_t` 的内存大小可能大于 32 位。\n*   如 `boost::int_fast8_t`\
  \ 和 `boost::uint_fast16_t` 等类型也有最小尺寸。它们的实际尺寸被设置为一个能保证最佳性能的值。示例 57.1, “位数指定的整数类型”\
  \ 使用 Visual C++ 2013 编译并运行在 64 位 Windows 7 系统上，`sizeof(uif16)` 显示为 `4`。\n\n请注意，64\
  \ 位类型并非在所有平台上都可用。你可以通过宏 `BOOST_NO_INT64_T` 检查是否存在 64 位类型。\n\n示例 57.1. 位数指定的整数类型\n\
  \n```cpp\n#include <boost/cstdint.hpp>\n#include <iostream>\n\nint main()\n{\n \
  \ boost::int8_t i8 = 1;\n  std::cout << sizeof(i8) << '\\n';\n\n#ifndef BOOST_NO_INT64_T\n\
  \  boost::uint64_t ui64 = 1;\n  std::cout << sizeof(ui64) << '\\n';\n#endif\n\n\
  \  boost::int_least8_t il8 = 1;\n  std::cout << sizeof(il8) << '\\n';\n\n  boost::uint_least32_t\
  \ uil32 = 1;\n  std::cout << sizeof(uil32) << '\\n';\n\n  boost::int_fast8_t if8\
  \ = 1;\n  std::cout << sizeof(if8) << '\\n';\n\n  boost::uint_fast16_t uif16 = 1;\n\
  \  std::cout << sizeof(uif16) << '\\n';\n}\n```\n\nBoost.Integer 定义了 `boost::intmax_t`\
  \ 和 `boost::uintmax_t` 类型，用于跨平台的整数。示例 57.2, “整数类型” 使用 Visual C++ 2013 编译并运行在 64\
  \ 位系统上，`sizeof(imax)` 显示为 `8`。\n\n```cpp\n#include <boost/cstdint.hpp>\n#include\
  \ <iostream>\n\nint main()\n{\n  boost::intmax_t imax = 1;\n  std::cout << sizeof(imax)\
  \ << '\\n';\n\n#ifndef BOOST_NO_INT64_T\n  boost::uintmax_t uiax = 1;\n  std::cout\
  \ << sizeof(umax) << '\\n';\n#endif\n}\n```\n\n此外，Boost.Integer 提供了用于整数字面量的宏。在 C++\
  \ 代码中，默认情况下它们分配至少 4 字节。如 `BOOST_8` 和 `BOOST_64` 等宏，可以使用特定的类型。示例 57.3, “字面量” 使用 Visual\
  \ C++ 2013 编译并运行在 64 位系统上，`sizeof(BOOST_8)` 显示为 `8`。\n\n```cpp\n#include <boost/cstdint.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  auto a = BOOST_8(1);\n  std::cout << sizeof(a)\
  \ << '\\n';\n\n  auto b = BOOST_64(1);\n  std::cout << sizeof(b) << '\\n';\n}\n\
  ```\n\n# 58. Boost.Accumulators\n\n[Boost.Accumulators](https://www.boost.org/libs/accumulators)\
  \ 提供了处理样本的类。例如，你可以找到最大值或最小值，或者计算总和。你需要了解这一点，Boost.Accumulators 支持平均值和标准差。累加器是一个每次接收数据都会更新结果的容器。\n\
  \nBoost.Accumulators 包含三个部分：\n\n*   框架提供了整体结构。它提供了 `boost::accumators::accumulator_set`，始终与\
  \ `boost::accumators` 使用。你需要了解这一点以及一些类，`boost/accumulators.hpp` 提供了访问。\n*   框架提供了许多用于计算的累加器。`boost/accumulators/statistics.hpp`\
  \ 提供了 `boost::accumators`。\n*   Boost.Accumulators 提供了运算符，例如将复数与 `int` 值相乘或相两个向量。头文件\
  \ `boost/accumulators/numeric.hpp` 为 `std::complex`、`std::valarray` 和 `std::vector`\
  \ 定义了运算符。你不需要包含该头文件，但你必须定义宏 `BOOST_NUMERIC_FUNCTIONAL_COMPLEX_SUPPORT`、`BOOST_NUMERIC_FUNCTIONAL_VALARRAY_SUPPORT`\
  \ 和 `BOOST_NUMERIC_FUNCTIONAL_VECTOR_SUPPORT` 以使运算符可用。\n\nBoost.Accumulators 提供的所有类和函数都定义在\
  \ `boost::accumulators` 或嵌套命名空间中。例如，所有的累加器都定义在 `boost::accumulators::tag` 中。\n\n\
  示例 58.1. 使用 `boost::accumulators::tag::count` 计数\n\n```cpp\n#include <boost/accumulators/accumulators.hpp>\n\
  #include <boost/accumulators/statistics.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::accumulators;\n\nint main()\n{\n  accumulator_set<int, features<tag::count>>\
  \ acc;\n  acc(4);\n  acc(-6);\n  acc(9);\n  std::cout << count(acc) << '\\n';\n\
  }\n```\n\n示例 58.1, “使用 `boost::accumulators::tag::count` 计数” 使用 `boost::accumulators::tag::count`，这是一个简单的计数传递它的值的累加器。因此，由于传递了三个值，此示例向标准输出写入\
  \ `3`。要使用累加器，你需要访问 `boost::accumulators::accumulator_set` 类，它是一个模板，其第一个参数期望接收将处理的数值类型。\n\
  \n\n\n\n严格来说，你指定的是特征（features），而不是累加器（accumulators）。特征定义了应该计算的内容。你决定的是“是什么”，而不是“怎么做”。特征可以有不同的实现方式。这些实现方式就是累加器。\n\
  \n示例 58.1，“使用 `boost::accumulators::tag::count` 计数” 使用 `boost::accumulators::tag::count`\
  \ 来选择一个计数的累加器。如果存在多个可以计数的累加器，Boost.Accumulators 会选择默认累加器。\n\n请注意，你不能直接将特征传递给 `boost::accumulators::accumulator_set`。你需要使用\
  \ `boost::accumulators::features`。\n\n类型为 `boost::accumulators::accumulator_set`\
  \ 的对象可以像函数一样。可以通过调用 `operator()` 传递值。这些值会被立即处理。传递的值必须与作为 `boost::accumulators::accumulator_set`\
  \ 第一个模板参数传递的类型相同。\n\n对于每个特征，都有一个同名的提取器（extractor）。提取器接收累加器的当前结果。示例 58.1，“使用 `boost::accumulators::tag::count`\
  \ 计数” 使用提取器 `boost::accumulators::count()`。传递的唯一参数是 `acc`。`boost::accumulators::count()`\
  \ 返回 3。\n\n### 示例 58.2. 使用 `mean` 和 `variance`\n\n```cpp\n#include <boost/accumulators/accumulators.hpp>\n\
  #include <boost/accumulators/statistics.hpp>\n#include <iostream>\n\nusing namespace\
  \ boost::accumulators;\n\nint main()\n{\n  accumulator_set<double, features<tag::mean,\
  \ tag::variance>> acc;\n  acc(8);\n  acc(9);\n  acc(10);\n  acc(11);\n  acc(12);\n\
  \  std::cout << mean(acc) << '\\n';\n  std::cout << variance(acc) << '\\n';\n}\n\
  ```\n\n[示例 58.2，“使用 `mean` 和 `variance`”]使用了两个特征 `boost::accumulators::tag::mean`\
  \ 和 `boost::accumulators::tag::variance` 来计算五个值的平均值和方差。该示例向标准输出写入 `10` 和 `2`。\n\n\
  方差为 2 是因为 Boost.Accumulators 为这五个值中的每一个都分配了 0.2 的权重。使用 `boost::accumulators::tag::variance`\
  \ 选择的累加器使用了权重。如果没有显式设置权重，则所有值将具有相同的权重。\n\n### 示例 58.3. 计算加权方差\n\n```cpp\n#include\
  \ <boost/accumulators/accumulators.hpp>\n#include <boost/accumulators/statistics.hpp>\n\
  #include <iostream>\n\nusing namespace boost::accumulators;\n\nint main()\n{\n \
  \ accumulator_set<double, features<tag::mean, tag::variance>, int> acc;\n  acc(8,\
  \ weight = 1);\n  acc(9, weight = 1);\n  acc(10, weight = 4);\n  acc(11, weight\
  \ = 1);\n  acc(12, weight = 1);\n  std::cout << mean(acc) << '\\n';\n  std::cout\
  \ << variance(acc) << '\\n';\n}\n```\n\n示例 58.3，“计算加权方差” 将 `int` 作为第三个模板参数传递给 `boost::accumulators::accumulator_set`。该参数指定了权重的数据类型。在这个示例中，权重被分配给每个值。\n\
  \nBoost.Accumulators 使用 Boost.Parameter 以键/值对的形式传递额外参数（如权重）。权重的参数名称为 `weight`。你可以将该参数视为变量并对其赋值。该键/值对将作为额外参数在每个值之后之后传递给累加器。\n\
  \n在 示例 58.3，“计算加权方差” 中，值 10 的权重为 4，而所有其他值的权重均为 1。平均值仍然是 10，因为权重对平均值没有影响。然而，方差现在是\
  \ 1.25。与之前的示例相比，它减少了，因为中间值的权重比其他值高。\n\nBoost.Accumulators 提供了更多的累加器。它们的用法与本章介绍的累加器相同。该库的文档包含了所有可用累加器的概述。\n\
  \n# 59. Boost.MinMax\n\n[Boost.MinMax](http://www.boost.org/libs/algorithm/minmax)\
  \ 提供了一种算法，仅需一次函数调用即可找到两个值的最小值最大值，这比调用 `std::min()` 和 `std::max()` 更高效。\n\nBoost.MinMax\
  \ 是 C++11 的一部分。如果你的开发环境支持 C++11，你可以在 `algorithm` 头文件中找到此 Boost 库中的算法。\n\n### 示例\
  \ 59.1. 使用 `boost::minmax()`\n\n```cpp\n#include <boost/minmax.hpp>\n#include <boost/tuple.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  int i = 2;\n  int j = 1;\n\n  boost::tuple<const\
  \ int&, const int&> t = boost::minmax(i, j);\n\n  std::cout << std::get<0>(t) <<\
  \ '\\n';\n  std::cout << std::get<1>(t) << '\\n';\n}\n```\n*(注：原文示例代码块似乎不完整或包含占位符，根据要求不翻译代码块，但根据上下文修正了逻辑描述)*\
  \ **纠正原文提供的代码块如下：**\n\n```cpp\n#include <boost/minmax.hpp>\n#include <boost/tuple.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  int i = 2;\n  int j = 1;\n\n  boost::tuple<const\
  \ int&, const int&> t = boost::minmax(i, j);\n\n  std::cout << std::get<0>(t) <<\
  \ '\\n';\n  std::cout << std::get<1>(t) << '\\n';\n}\n```\n\n`boost::minmax()` 计算两个对象的最小值和最大值。虽然\
  \ `std::min()` 和 `std::max()` 只返回一个值，但 `boost::minmax()` 返回两个值的元组。示例 59.1，“使用 `boost::minmax()`”\"\
  ) 元组中的第一个指向最小值，第二个指向最大值。\n\n`boost::minmax()` 定义在 `boost/algorithm.hpp` 中。\n\n###\
  \ 示例 59.2. 使用 `minmax_element`\n\n```cpp\n#include <boost/minmax.hpp>\n#include\
  \ <array>\n#include <utility>\n#include <iostream>\n\nint main()\n{\n  std::array<int,\
  \ 4> a{{2, 3, 0, 1}};\n\n  std::pair<std::array<int>::iterator, std::array<int>::iterator>\
  \ p =\n    boost::minmax_element(a.begin(), a.end());\n\n  std::cout << *p.first\
  \ << '\\n';\n  std::cout << *p.second << '\\n';\n}\n```\n\n正如标准库提供了查找容器中最小值和最大值的算法，Boost.MinMax\
  \ 仅需调用一次 `minmax_element()` 即可实现相同的功能。与 `minmax()` 不同，`minmax_element()` 返回包含迭代器的\
  \ `std::pair`。第一个迭代器指向最小值，第二个指向最大值。示例 59.2，“使用 `minmax_element`” 向标准输出写入 `0` 和 `3`。\n\
  \n这两个函数都可以带有一个第三个参数，指定如何比较对象。\n\n# 60. Boost.Random\n\n[Boost.Random](https://www.boost.org/libs/random)\
  \ 提供了大量的随机数生成器，允许你决定如何生成随机数。在 C++ 中，始终可以使用 `cstdlib` 中的 `std::rand()` 生成随机数。然而，对于\
  \ `std::rand()`，随机数的生成方式取决于标准库的实现。\n\n当你包含 `boost/random.hpp` 时，可以使用 Boost.Random\
  \ 中的所有随机数生成器以及其他类和函数。\n\n该库的大部分已在 C++11 中添加到标准库中。如果你的开发环境支持 C++11，你可以通过包含 `random`\
  \ 头文件并访问 `std` 命名空间来重写本章的 Boost.Random 示例。\n\n### 示例 60.1. 使用 `boost::random::mt19937`\
  \ 伪随机\n\n```cpp\n#include <boost/random.hpp>\n#include <iostream>\n#include <ctime>\n\
  #include <cstdint>\n\nint main()\n{\n  std::time_t now = std::time(0);\n  boost::random::mt19937\
  \ gen{static_cast<std::uint32_t>(now)};\n  std::cout << gen() << '\\n';\n}\n```\n\
  \n\n\n\n示例 60.1, “使用 `boost::random::mt19937` 生成伪随机数` 访问了随机数生成器 `boost::random::mt19937`。运算符\
  \ `operator()` 生成一个随机数并将其写入标准输出。\n\n`boost::random::mt19937` 生成的随机数是整数。生成整数还是浮点数取决于你使用的特定生成器。所有随机数生成器都定义了类型\
  \ `result_type` 来确定随机数的类型。boost::random::mt19937` 的 `result_type` 是 `boost::uint32_t`。\n\
  \n所有随机数生成器都提供了两个成员函数：`min()` 和 `max()`。这些函数返回该随机数生成器可以生成的最小值和最大值。\n\nBoost.Random\
  \ 几乎所有的随机数生成器都是伪随机数生成器。伪随机数生成器并不产生真正的随机数。它们基于生成看似随机数的算法。`boost::random::mt19937`\
  \ 就是这些伪随机数生成器之一。\n\n伪随机数生成器通常需要初始化。如果用相同的值进行初始化，它们将返回相同的随机数。这就是为什么在 示例 60.1, “使用\
  \ `boost::random::mt19937` 生成伪随机数` 中，`std::time()` 的返回值被传递给 `boost::random::mt19937`\
  \ 的构造函数。这应该确保当程序在不同的时间运行时会生成不同的随机数。\n\n伪随机数对于大多数用例已经足够了。`std::rand()` 也基于伪随机数生成器，必须使用\
  \ `std::srand()` 初始化。然而，Boost.Random 提供了一个可以生成真随机数的随机数生成器，只要操作系统拥有生成真随机数的源。\n\n\
  ## 示例 60.2. 使用 `boost::random::random_device` 生成真随机数\n\n```\n#include <boost/random/random_device.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  boost::random::random_device gen;\n  std::cout\
  \ << gen() << '\\n';\n}\n```\n\n`boost::random::random_device` 是一个非确定随机数生成器，即一种可以生成真随机数的随机数生成器。它不需要初始化的算法。因此，预测随机数是不可能的。非确定随机数生成器通常用于与安全相关的应用程序。\n\
  \n`boost::random::random_device` 调用操作系统函数生成随机数。如果像 示例 60.2, “使用 `boost::random::random_device`\
  \ 生成真随机数` 那样调用默认构造函数，boost::random::random_device` 在 Windows 上使用加密服务提供商 `MS_DEF_PROV`，在\
  \ Linux 上使用 `/dev/urandom` 作为源。\n\n如果你想使用另一个源，请调用 `boost::random::random_device`\
  \ 的构造函数，它期望一个 `std::string` 类型的参数。该参数如何被解释取决于操作系统。在 Windows 上，它必须是加密服务提供商的名字；在 Linux\
  \ 上，它是设备路径。\n\n请注意，如果你想使用 `boost::random::random_device` 类，必须包含 `boost/random/random_device.hpp`。该类没有通过\
  \ `boost/random.hpp` 提供。\n\n### 示例 60.3. 使用 `bernoulli_distribution` 生成随机 0 和 1\n\
  \n```cpp\n#include <boost/random.hpp>\n#include <iostream>\n#include <ctime>\n#include\
  \ <cstdint>\n\nint main()\n{\n  std::time_t now = std::time(0);\n  boost::random::mt19937\
  \ gen{static_cast<std::uint32_t>(now)};\n  boost::random::bernoulli_distribution<>\
  \ dist;\n  std::cout << dist(gen) << '\\n';\n}\n```\n\n示例 60.3, “使用 `bernoulli_distribution`\
  \ 生成随机 0 和 1` 使用了伪随机数生成器 `boost::random::mt19937`。此外，还使用了分布。分布是 Boost.Random 类，用于将随机数生成器的随机数范围映射到另一个范围。虽然像\
  \ `boost::random::mt19937` 这样的随机数生成器内置了可以通过 `min()` 和 `max()` 查看的随机数上下限，但你可能需要不同范围内的随机数。\n\
  \n示例 60.3, “使用 `bernoulli_distribution` 生成随机 0 和 1` 模拟模拟了一个硬币。因为硬币只有两面，`boost::random::bernoulli_distribution`\
  \ 是一个返回 0 或 1 的分布。分布像随机数生成器一样使用：你调用 `operator()` 来接收随机数。然而，你必须传递一个参数。在 示例 60.3,\
  \ “使用 `bernoulli_distribution` 生成随机 0 和 1` 中，`dist` 使用伪随机数生成器 `gen` 返回 0 或 1。\n\n\
  ## 示例 60.4. 使用 `uniform_int_distribution` 生成 1 到 100 之间的随机数\n\n```cpp\n#include\
  \ <boost/random.hpp>\n#include <iostream>\n#include <ctime>\n#include <cstdint>\n\
  \nint main()\n{\n  std::time_t now = std::time(0);\n  boost::random::mt19937 gen{static_cast<std::uint32_t>(now)};\n\
  \  boost::random::uniform_int_distribution<> dist{1, 100};\n  std::cout << dist(gen)\
  \ << '\\n';\n}\n```\n\nBoost.Random 提供了大量的分布。示例 60.4, “使用 `uniform_int_distribution`\
  \ 生成 1 到 100 之间的随机数` 使用了一种经常需要的分布：`boost::random::uniform_int_distribution`。该分布允许你定义所需的随机数范围。在\
  \ 示例 60.4, “使用 `uniform_int_distribution` 生成 1 到 100 之间的随机数` 中，`dist` 返回 1 到 100\
  \ 之间的数。\n\n请注意，`dist` 可以返回 1 和 100。分布的边界是包含在内的。\n\n除了 `boost::random::bernoulli_distribution`\
  \ 和 `boost::random::uniform_int_distribution`，Boost.Random 还有许多分布。例如，还有像 `boost::random::normal_distribution`\
  \ 和 `boost::random::chi_squared_distribution` 这样的分布，它们用于统计学。\n\n# 61. Boost.NumericConversion\n\
  \n[Boost.NumericConversion](http://www.boost.org/libs/numeric/conversion) 库可用于将一种数值类型的数字转换为另一种数值类型。在\
  \ C++ 中，这种转换也可以隐式发生，如 示例 61.1, “从 `int` 到 `short` 的隐式转换` 所示。\n\n```cpp\n#include\
  \ <iostream>\n\nint main()\n{\n  int i = 0x10000;\n  short s = i;\n  std::cout <<\
  \ s << '\\n';\n}\n```\n\n\n\n\n示例 61.1, “从 `int` 到 `short` 的隐式转换` 将可以顺利编译，因为从 `int`\
  \ 到 `short` 的类型转换是自动完成的。然而，尽管程序可以运行，转换结果取决于所使用的编译器。变量 `i` 中的数字 `0x10000` 太大，无法存储在\
  \ `short` 类型的变量中。根据标准，此操作的结果取决于具体实现。使用 Visual C++ 2013 编译时，程序显示为 `0`，这与 `i` 中的值明显不同。\n\
  \n为了避免这类问题，你可以使用强制转换运算符 `boost::numeric_cast`（请参见 示例 61.2, “使用 `boost::numeric_cast`\
  \ 进行溢出检测`）。`boost::numeric_cast` 的用法与现有的 C++ 转换运算符完全相同。必须包含正确的头文件；在这种情况下，头文件是 `boost/numeric/conversion/cast.hpp`。\n\
  \n`boost::numeric_cast` 执行与 C++ 相同的转换，但它会验证转换是否可以在不改变被转换值的情况下进行。在 示例 61.2, “使用 `boost::numeric_cast`\
  \ 进行溢出检测` 中，该验证会失败并抛出类型为 `boost::numeric::bad_numeric_cast` 的异常，因为 `0x10000` 太大无法放入\
  \ `short` 类型的变量中。\n\n示例 61.2. 使用 `boost::numeric_cast` 进行溢出检测\n\n```cpp\n#include\
  \ <boost/numeric/conversion/cast.hpp>\n#include <iostream>\n\nint main()\n{\n  try\n\
  \  {\n    int i = 0x10000;\n    short s = boost::numeric_cast<short>(i);\n    std::cout\
  \ << s << '\\n';\n  }\n  catch (boost::numeric::bad_numeric_cast &e)\n  {\n    std::cerr\
  \ << e.what() << '\\n';\n  }\n}\n```\n\n严格来说，将抛出类型为 `boost::numeric::positive_overflow`\
  \ 的异常。该类型指定了溢出——在本例中针对正数。还有 `boost::numeric::negative_overflow`，它指定了负数的溢出（参见 示例\
  \ 61.3, “针对负数的溢出检测`）。\n\n示例 61.3. 针对负数的溢出检测\n\n```cpp\n#include <boost/numeric/conversion/cast.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  try\n  {\n    int i = -0x10000;\n    short\
  \ s = boost::numeric_cast<short>(i);\n    std::cout << s << '\\n';\n  }\n  catch\
  \ (boost::numeric::negative_overflow &e)\n  {\n    std::cerr << e.what() << '\\\
  n';\n  }\n}\n```\n\nBoost.NumericConversion 定义了额外的异常类型，它们都派自 `boost::numeric::bad_numeric_cast`。由于\
  \ `boost::numeric::bad_numeric_cast` 派自 `std::bad_cast`，`catch` 处理器也可以捕获此类类型的异常。\n\
  \n# 第 XV 部分 应用程序库\n\n应用程序库是指通常专门用于独立应用程序开发，而不是用于库库的库。\n\n* `Boost.Log` 是一个日志库。\n\
  * `Boost.ProgramOptions` 是用于定义和解析命令行选项的库。\n* `Boost.Serialization` 允许你将对象序列化，例如将它们保存到文件并从文件中加载。\n\
  * `Boost.Uuid` 支持处理 UUID 操作。\n\n# 62. Boost.Log\n\n[Boost.Log](http://www.boost.org/libs/log)\
  \ 是 Boost 中的日志库。它支持许多后端（back-ends），以各种格式记录日志数据。后端通过前端（front-ends）访问，前端封装了服务并以不同的方式转发日志目。例如，有一个前端使用线程来异步转发日志目。前端可以带有过滤器来忽略某些日志目。它们还定义了如何将日志目格式化为字符串。所有这些都是可扩展的，使得\
  \ Boost.Log 了一个强大的库。\n\n示例 62.1, “后端、前端、核心和记录器` 介绍了 Boost.Log 的核心组件。Boost.Log 允许你访问后端、前端、核心和记录器：\n\
  \n* 后端决定数据写入哪里。`boost::log::sinks::text_ostream_backend` 使用类型为 `std::ostream` 的流初始化，并将日志目写入其中。\n\
  * 前端是核心与后端之间的连接。它们实现了各种功能，... 示例 62.1, “后端、前端、核心和记录器` 使用了 `boost::log::sinks::asynchronous_sink`。\n\
  * 核心是所有日志目路由通过的中心组件。要获取核心的指针，调用 `boost::log::core::get()`。\n* 记录器是你在 Boost.Log 中最频繁使用的组件。\n\
  \n示例 62.1. 后端、前端、核心和记录器\n\n```cpp\n#include <boost/log/common.hpp>\n#include <boost/log/sinks.hpp>\n\
  #include <boost/log/sources/logger.hpp>\n#include <boost/utility/empty_deleter.hpp>\n\
  #include <boost/shared_ptr.hpp>\n#include <iostream>\n\nusing namespace boost::log;\n\
  \nint main()\n{\n  typedef sinks::asynchronous_sink<sinks::text_ostream_backend>\
  \ text_sink;\n  boost::shared_ptr<text_sink> sink = boost::make_shared<text_sink>();\n\
  \n  boost::shared_ptr<std::ostream> stream{&std::clog,\n    boost::empty_deleter{}};\n\
  \  sink->locked_backend()->add_stream(stream);\n\n  core::get()->add_sink(sink);\n\
  \n  sources::logger lg;\n\n  BOOST_LOG(lg) << \"note\";\n  sink->flush();\n}\n```\n\
  \n\n\n\n由于后端是前端的模板参数，因此它只能在前端实例化后才能进行配置。后端决定了这种实现方式。成员函数 `add_stream()` 由后端 `boost::log::sinks::text_ostream_backend`\
  \ 提供，用于添加流。你可以为 `boost::log::sinks::text_ostream_backend` 添加多个流。其他后端提供了不同的成员函数用于配置。详细信息请参阅文档。\n\
  \n要访问后端，所有前端都提供了成员函数 `locked_backend()`。该成员函数之所以命名为 `locked_backend()`，是因为它返回一个指针，只要该指针存在，该指针就能提供对后端的同步访问。你可以从多个线程通过\
  \ `locked_backend()` 返回的指针访问后端，而无需自己手动进行访问同步。\n\n你可以使用默认构造函数实例化如 `boost::log::sources::logger`\
  \ 类的日志器。日志器会自动调用 `boost::log::core::get()` 将日志条目转发到核心。\n\n你可以在不使用宏的情况下访问日志器。日志器是带有可以调用的成员函数的对象。然而，使用诸如\
  \ `BOOST_LOG` 这样的宏可以让编写日志条目变得更简单。如果没有宏，将无法在一行代码中完成日志条目的写入。\n\n示例 62.1, “后端、前端、核心和日志器”\
  \ 在 `main()` 结束处调用了 `boost::log::sinks::asynchronous_sink::flush()`。此调用是必要的，因为前端是异步的，并使用线程转发日志条目。该调用确保所有缓冲的日志条目都传递到后端并写入。如果没有调用\
  \ `flush()`，示例可能会在没有显示 `note` 的情况下终止。\n\n示例 62.2, “带有过滤器的 `boost::sources::severity_logger`”\
  \ 基于 示例 62.1, “后端、前端、核心和日志器”，但它将 `boost::sources::logger` 替换为日志器 `boost::sources::severity_logger`。该日志器为每个日志条目添加了一个日志级别属性。你可以使用宏\
  \ `BOOST_LOG_SEV` 来设置日志级别。\n\n日志级别的类型取决于传递给 `boost::sources::severity_logger` 的模板参数。示例\
  \ 62.2, “带有过滤器的 `boost::sources::severity_logger`” 使用 `int`。这就是为什么像 0 和 1 这样的数字会被传递给\
  \ `BOOST_LOG_SEV`。如果使用了 `BOOST_LOG`，日志级别将被设置为 0。\n\n示例 62.2, “带有过滤器的 `boost::sources::severity_logger`”\
  \ 还调用了 `set_filter()` 在前端注册了一个过滤器。每个日志条目都会调用该过滤器函数。如果函数返回 `true`，则日志条目被转发到后端。示例\
  \ 62.2, “带有过滤器的 `boost::sources::severity_logger`” 定义了返回值为 `bool` 的函数 `only_warnings()`。\n\
  \n`only_warnings()` 期望一个类型为 `boost::log::attribute_value_set` 的参数。该类型代表日志条目在日志框架中传递的状态。`boost::log::record`\
  \ 是另一种日志条目的类型，类似于 `boost::log::attribute_value_set` 的封装器。该类型提供了成员函数 `attribute_values()`，用于获取对\
  \ `boost::log::attribute_value_set` 的引用。过滤器函数直接接收 `boost::log::attribute_value_set`\
  \ 而不接收 `boost::log::record`。`boost::log::attribute_value_set` 存储键值对。可以将其视为一个 `std::unordered_map`。\n\
  \n日志条目由属性组成。属性具有名称和值。你可以自己创建属性。它们也可以被自动创建——例如通过日志器。事实上，这就是为什么 Boost.Log 提供了多个日志器。`boost::log::sources::severity_logger`\
  \ 为每个日志条目添加了一个名为 Severity 的属性。该属性存储了日志级别。这样，过滤器就可以检查日志条目的日志级别是否大于 0。\n\n### 示例 62.2.\
  \ 带有过滤器的 `boost::sources::severity_logger`\n\n```\n#include <boost/log/common.hpp>\n\
  #include <boost/log/sinks.hpp>\n#include <boost/log/sources/severity_logger.hpp>\n\
  #include <boost/utility/empty_deleter>\n#include <boost/log/shared_ptr.hpp>\n#include\
  \ <boost/log/record_attributes.hpp>\n#include <iostream>\n\nusing namespace boost::log;\n\
  \nbool only_warnings(const attribute_value_set &set)\n{\n  return set[\"Severity\"\
  ].extract<int>() > 0;\n}\n\nint main()\n{\n  typedef sinks::asynchronous_sink<sinks::text_ostream_backend>\
  \ text_sink;\n  shared_ptr<text_sink> sink = boost::make_shared<text_sink>();\n\n\
  \  shared_ptr<std::ostream> stream(&std::clog, empty_deleter{});\n  sink->locked_backend()->add_stream(stream);\n\
  \  sink->set_filter(&only_warnings);\n\n  core::get()->add_sink(sink);\n\n  sources::severity_logger<int>\
  \ lg;\n\n  BOOST_LOG(lg) << \"note\";\n  BOOST_LOG_SEV(lg, 0) << \"another note\"\
  ;\n  BOOST_LOG_SEV(lg, 1) << \"warning\";\n  sink->flush();\n}\n```\n\n`boost::log::attribute_value_set`\
  \ 提供了多个访问属性的成员函数。这些成员函数与 `std::unordered_map` 提供的相似。例如，`boost::log::attribute_value_set`\
  \ 重载了 `operator[]`。该运算符返回作为参数传递的属性值。如果属性不存在，它将被创建。\n\n属性名称的类型是 `boost::log::attribute_name`。该类提供一个接受字符串的构造函数，因此你可以直接向\
  \ `operator[]` 传递字符串，如示例 62.2，“带有过滤器的 `boost::sources::severity_logger`” 所示。\n\n\
  属性值的类型是 `boost::log::attribute_value`。该类提供了以属性原始类型接收值的成员函数。由于日志级别是一个 `int` 值，因此\
  \ `int` 被模板参数传递给 `extract()`。\n\n`boost::log::attribute_value` 还定义了 `extract_or_default()`\
  \ 和 `extract_or_throw()` 成员函数。如果类型转换失败，`extract()` 返回一个使用默认构造函数创建的值——例如在 `int` 的情况下返回\
  \ 0。`extract_or_default()` 返回一个作为该成员函数另一个参数的默认值。`extract_or_throw()` 在发生错误时抛出一个\
