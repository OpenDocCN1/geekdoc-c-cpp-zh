  \n# 25. Boost.PropertyTree\n\n通过 `boost::property_tree::ptree` 类，[Boost.PropertyTree](http://www.boost.org/libs/property_tree)\
  \ 提供了一种树结构来存储键值对。树结构意味着存在一个树干，带有许多树枝。文件系统是树结构的一个很好的例子。文件系统有根目录，子目录本身也可以包含子目录，以此此类推。\n\
  \n要使用 `boost::property_tree::ptree`，请包含头文件 `boost/property_tree/ptree.hpp`。这是一个主头文件，因此\
  \ Boost.PropertyTree 不需要其他头文件。\n\n### 示例 25.1. 访问 `boost::property_tree::ptree`\
  \ 中的数据\n\n```cpp\n#include <boost/property_tree/ptree.hpp>\n#include <iostream>\n\
  \nusing boost::property_tree::ptree;\n\nint main()\n{\n  ptree pt;\n  pt.put(\"\
  C:.Windows.System\", \"20 files\");\n\n  ptree &c = pt.get_child(\"C:\");\n  ptree\
  \ &windows = c.get_child(\"Windows\");\n  ptree &system = windows.get_child(\"System\"\
  );\n  std::cout << system.get_value<std::string>() << '\\n';\n}\n```\n\n\n\n\n\n\
  示例 25.1，“在 `boost::property_tree::ptree` 中访问数据” 使用 `boost::property_tree::ptree`\
  \ 来存储目录的路径。这是通过调用 `put()` 实现的。该成员函数期望两个参数，因为 `boost::property_tree::ptree` 是一个保存键值对的树形结构。树不仅仅由分支和叶子组成，每个分支和叶子都必须分配一个值。在示例\
  \ 25.1，“在 `boost::property_tree::ptree` 中访问数据”中，该值为“20 files”。\n\n传递给 `put()` 的第一个参数更有趣。它是一个目录路径。然而，它没有使用反斜杠（Windows\
  \ 上常用的路径分隔符），而是使用了点。\n\n你需要使用点，因为点是 Boost.PropertyTree 期望用于键的隔符。参数“C:.Windows.System”告诉\
  \ `pt` 创建一个名为 C: 的分支，其中包含一个名为 Windows 的分支，Windows 下下还有一个名为 System 的分支。点创建了分支的嵌套结构。如果将“C:\\\
  Windows\\System”作为参数传递，`pt` 将只有一个名为 C:\\Windows\\System 的分支。\n\n调用 `put()` 之后，访问\
  \ `pt` 以读取存储的值“20 files”并将其写入标准输出。这是通过在分支与分支之间（或目录与目录之间）跳转完成的。\n\n要访问子分支，可以调用 `get_child()`，它返回对调用\
  \ `get_child()` 的对象的相同类型的引用。在示例 25.1，“在 `boost::property_tree::ptree` 中访问数据”中，这是对\
  \ `boost::property_tree::ptree` 的引用。因为每个分支都可以有子分支，而且高低层分支之间没有结构上的差异，所以使用了相同的类型。\n\
  \n第三次调用 `get_child()` 获取代表 System 目录的 `boost::property_tree::ptree`。调用 `get_value()`\
  \ 来读取在示例开始通过 `put()` 存储的值。\n\n请注意，`get_value()` 是一个函数模板。你将返回值的类型作为模板参数传递。这样 `get_value()`\
  \ 就可以进行自动类型转换。\n\n示例 25.2. 在 `basic_ptree<std::string, int>` 中访问数据。\n\n```cpp\n\
  #include <boost/property_tree/ptree.hpp>\n#include <utility>\n#include <iostream>\n\
  \nint main()\n{\n  typedef boost::property_tree::basic_ptree<std::string, int> ptree;\n\
  \  ptree pt;\n  pt.put(ptree::path_type{\"C:\\\\Windows\\\\System\", '\\\\'}, 20);\n\
  \  pt.put(ptree::path_type{\"C:\\\\Windows\\\\Cursors\", '\\\\'}, 50);\n\n  ptree\
  \ &windows = pt.get_child(ptree::path_type{\"C:\\\\Windows\", '\\\\'});\n  int files\
  \ = 0;\n  for (const std::pair<std::string, ptree> &p : windows)\n    files += p.second.get_value<int>();\n\
  \  std::cout << files << '\\n';\n}\n```\n\n与示例 25.1，“在 `boost::property_tree::ptree`\
  \ 中访问数据”相比，示例 25.2，“在 `basic_ptree<std::string, int>` 中访问数据”中有两个变化。这些变化是为了更方便地存储目录路径和目录中的文件数量。首先，路径在传递给\
  \ `put()` 时使用反斜杠作为分隔符。其次，文件数量被存储为 `int`。\n\n默认情况下，Boost.PropertyTree 使用点作为键的分隔符。如果你需要使用另一个字符（如反斜杠）作为分隔符，则不要将键作为字符串传递给\
  \ `put()`。相反，将其封装在 `boost::property_tree::ptree::path_type` 类型的对象中。该类的构造函数依赖于 `boost::property_tree::ptree`）将键作为第一个参数，将分隔符作为第二个参数。这样你就可以使用像\
  \ C:\\Windows\\System 这样的路径，如示例 25.2，“在 `basic_ptree<std::string, int>` 中访问数据” 所示。\n\
  \n\n\n\n```cpp\n#include <boost/property_tree/ptree.hpp>\n#include <boost/optional.hpp>\n\
  #include <iostream>\n#include <cstdlib>\n\nstruct string_to_int_translator\n{\n\
  \  typedef std::string internal_type;\n  typedef int external_type;\n\n  boost::optional<int>\
  \ get_value(const std::string &s)\n  {\n    char *c;\n    long l = std::strtol(s.c_str(),\
  \ &c, 10);\n    return boost::make_optional(c != s.c_str(), static_cast<int>(l));\n\
  \  }\n};\n\nint main()\n{\n  typedef boost::property_tree::iptree ptree;\n  ptree\
  \ pt;\n  pt.put(ptree::path_type{\"C:\\\\Windows\\\\System\", '\\\\'}, \"20 files\"\
  );\n  pt.put(ptree::path_type{\"C:\\\\Windows\\\\Cursors\", '\\\\'}, \"50 files\"\
  );\n\n  string_to_int_translator tr;\n  int files =\n    pt.get<int>(ptree::path_type{\"\
  c:\\\\windows\\\\system\", '\\\\'}, tr) +\n    pt.get<int>(ptree::path_type{\"c:\\\
  \\windows\\\\cursors\", '\\\\'}, tr);\n  std::cout << files << '\\n';\n}\n```\n\n\
  与示例 25.1, “访问 `boost::property_tree::ptree` 中的数据` 不同，`get_child()` 不需要多次调用来访问子分支。就像\
  \ `put()` 可以直接在子分支中存储值一样，可以使用 `get()` 从子分支读取值。键的定义方式相同——例如使用 `boost::property_tree::iptree::path_type`。\n\
  \n与 `get_value()` 类似，`get()` 是一个函数模板。你必须将返回值的类型作为模板参数传递。Boost.PropertyTree 会执行自动类型转换。\n\
  \n为了转换类型，Boost.PropertyTree 使用翻译器（translators）。该库提供了一些基于流（streams）的内置翻译器，可以自动转换类型。\n\
  \n示例 25.3, “使用翻译器访问数据` 定义了翻译器 `string_to_int_translator`，它将 `std::string` 类型的值转换为\
  \ `int`。该翻译器被作为额外参数传递给 `get()`。由于翻译器仅用于读取，因此它只定义了一个成员函数 `get_value()`。如果你也想在写入时使用该翻译器，则需要定义一个成员函数\
  \ `put_value()`，然后将翻译器作为额外参数传递给 `put()`。\n\n`get_value()` 返回在 `pt` 中使用的类型的值。然而，由于类型转换并不总是成功，因此使用了\
  \ `boost::optional`。如果示例 25.3, “使用翻译器访问数据``中存储的值无法通过 `std::strtol()` 转换为 `int`，则将返回一个\
  \ `boost::optional` 类型的空对象。\n\n请注意，翻译器还必须定义两个类型 `internal_type` 和 `external_type`。如果你在存储数据时需要转换类型，请类似于\
  \ `get_value()` 定义 `put_value()`。\n\n如果你修改了示例 25.3, “使用翻译器访问数据` 以存储值 “20” 而不是 “20\
  \ files”，则可以在不传递翻译器的情况下调用 `get_value()`。Boost.PropertyTree 提供的翻译器可以将 `std::string`\
  \ 转换为 `int`。然而，只有当整个字符串都可以转换时，类型转换才会成功。字符串不能包含任何字母。只要字符串以数字开头，`std::strtol()` 就能进行类型转换，因此在示例\
  \ 25.3 中使用了更宽松的翻译器 `string_to_int_translator`。\n\n示例 25.4. `boost::property_tree::ptree`\
  \ 的各种成员函数\n\n```cpp\n#include <boost/property_tree/ptree.hpp>\n#include <utility>\n\
  #include <iostream>\n\nusing boost::property_tree::ptree;\n\nint main()\n{\n  ptree\
  \ pt;\n  pt.put(\"C:.Windows.System\", \"20 files\");\n\n  boost::optional<std::string>\
  \ c = pt.get_optional<std::string>(\"C:\");\n  std::cout << std::boolalpha << c.is_initialized()\
  \ << '\\n';\n\n  pt.put_child(\"D:.Program Files\", ptree{\"50 files\"});\n  pt.add_child(\"\
  D:.Program Files\", ptree{\"60 files\"});\n\n  ptree d = pt.get_child(\"D:\");\n\
  \  for (const std::pair<std::string, ptree> &p : d)\n    std::cout << p.second.get<std::string>()\
  \ << '\\n';\n\n  boost::optional<ptree> e = pt.get_optional(\"E:\");\n  std::cout\
  \ << e.is_initialized() << '\\n';\n}\n```\n\n\n\n\n除了 `boost::property_tree::json_parser::write_json()`\
  \ 和 `boost::property_tree::json_parser::read_json()` 函数外，Boost.PropertyTree 还提供了其他数据格式的函数。你可以使用来自\
  \ `boost/property_tree/ini_parser.hpp` 的 `boost::property_tree::ini_parser::write_ini()`\
  \ 和 `boost::property_tree::ini_parser::read_ini()` 来支持 INI 文件。通过来自 `boost/property_tree/xml_parser.hpp`\
  \ 的 `boost::property_tree::xml_parser::write_xml()` 和 `boost::property_tree::xml_parser::read_xml()`，可以在\
  \ XML 格式加载并存储数据。通过来自 `boost/property_tree/info_parser.hpp` 的 `boost::property_tree::info_parser::write_info()`\
  \ 和 `boost::property_tree::info_parser::read_info()`，你可以访问另一种专门为序列化 Boost.PropertyTree\
  \ 优化的格式。\n\n所有支持的格式都不保证 `boost::property_tree::ptree` 在保存并重新加载后外观保持一致。例如，JSON 格式可能会丢失类型信息，因为\
  \ `boost::property_tree::ptree` 无法区分 `true` 和 “true”。类型始终是相同的。即使各种函数可以方便地保存和加载 `boost::property_tree::ptree`，也别忘记\
  \ Boost.PropertyTree 并不完全支持这些格式。该库的重点是 `boost::property_tree::ptree` 结构，而不是支持各种数据格式。\n\
  \n# 26. Boost.DynamicBitset\n\n[Boost.DynamicBitset](http://www.boost.org/libs/dynamic_bitset)\
  \ 库提供了 `boost::dynamic_bitset` 类，其用法类似于 `std::bitset`。区别在于 `std::bitset` 的位数必须在编译时指定，而\
  \ `boost::dynamic_bitset` 的位数是在运行时指定的。\n\n若要使用 `boost::dynamic_bitset`，请包含头文件 `boost/dynamic_bitset.hpp`。\n\
  \n示例 26.1. 使用 `boost::dynamic_bitset`\n\n```cpp\n#include <boost/dynamic_bitset.hpp>\n\
  #include <iostream>\n\nint main()\n{\n  boost::dynamic_bitset<> db{3, 4};\n\n  db.push_back(true);\n\
  \n  std::cout.setf(std::ios::boolalpha);\n  std::cout << db.size() << '\\n';\n \
  \ std::cout << db.count() << '\\n';\n  std::cout << db.any() << '\\n';\n  std::cout\
  \ << db.none() << '\\n';\n\n  std::cout << db[0].flip() << '\\n';\n  std::cout <<\
  \ ~db[3] << '\\n';\n  std::cout << db << '\\n';\n}\n```\n\n`boost::dynamic_bitset`\
  \ 是一个模板，实例化时不需要任何模板参数；在这种情况下会使用默认类型。更重要的是传递给构造函数的参数。在 示例 26.1, “使用 `boost::dynamic_bitset``\
  \ 中，构造函数创建了一个具有 3 位的 `db`。第二个参数初始化位；在这种情况下，4 初始化了最高位——左侧的位。\n\n`boost::dynamic_bitset`\
  \ 对象内部的位数可以随时更改。成员函数 `push_back()` 添加另一个位，该位将成为最高位。在 示例 26.1, “使用 `boost::dynamic_bitset``\
  \ 中调用 `push_back()` 会导致 `db` 包含 4 位，其中最高位被设置。因此，`db` 存储数字 1。\n\n你可以通过调用成员函数 `resize()`\
  \ 来减少位数。根据传递给 `resize()` 的参数，位将被添加或删除。\n\n`boost::dynamic_bitset` 提供了查询数据和访问单个位的成员函数。成员函数\
  \ `size()` 和 `count()` 分别返回位数和当前设置为 1 的个数。`any()` 在至少有一个位被设置时返回 `true`，而 `none()`\
  \ 在没有位被设置时返回 `true`。\n\n若要访问单个位，请使用数组语法。它将返回一个对内部类的引用，该引用表示该位并提供了操作它的成员函数。例如，成员函数\
  \ `flip()` 可以翻转该位。同样可以使用位运算符，如 `operator~`。总的来说，`boost::dynamic_bitset` 类提供了与 `std::bitset`\
  \ 相同的位功能。\n\n像 `std::bitset` 一样，`boost::dynamic_bitset` 不支持迭代器。\n\n# 27. Boost.Tribool\n\
  \n[Boost.Tribool](http://boost.org/libs/logic) 库提供了 `boost::logic::tribool` 类，它类似于\
  \ `bool`。然而，`bool` 可以区分两种状态，而 `boost::logic::tribool` 处理三种状态。\n\n若要使用 `boost::logic::tribool`，请包含头文件\
  \ `boost/logic/tribool.hpp`。\n\n类型为 `boost::logic::tribool` 的变量可以设置为 `true`、`false`\
  \ 或 `indeterminate`（不确定）。\n\n`boost::logic::tribool` 类型的变量可以设置为 `true`、`false` 或\
  \ `indeterminate`。默认构造函数将变量设置为 `false`。在 示例 27.1, “三状态逻辑 `boost::logic::tribool``\
  \ 中，这为什么是 `false`。\n\n示例 27.1. 三状态 `boost::logic::tribool`\n\n```cpp\n#include <boost/logic/tribool.hpp>\n\
  #include <iostream>\n\nusing namespace boost::logic;\n\nint main()\n{\n  boost::logic::tribool\
  \ b;\n  std::cout << boolalpha << b << '\\n';\n\n  b = true;\n  b = false;\n  b\
  \ = indeterminate;\n  if (b)\n    ;\n  else if (!b)\n    ;\n  else\n    std::cout\
  \ << \"indeterminate\\n\";\n}\n```\n\n示例 27.1, “三状态 `boost::logic::tribool`` 说明了如何正确评估\
  \ `b`。你必须显式地检查 `true` 和 `false`。如果变量设置为 `indeterminate`，如示例所示，`else` 块将执行。\n\nBoost.Tribool\
  \ 还提供了函数 `boost::logic::indeterminate()`。如果你传递一个设置为 `indeterminate` 的 `boost::logic::tribool`\
  \ 类型变量，该函数将返回 `true`。如果变量设置为 `true` 或 `false`，它将返回 `false`。\n\n示例 27.2. `boost::logic::tribool`\
  \ 的逻辑运算符\n\n```cpp\n#include <boost/logic/tribool.hpp>\n#include <boost/logic/tribool_io.hpp>\n\
  #include <iostream>\n\nusing namespace boost::logic;\n\nint main()\n{\n  std::cout.setf(std::ios::boolalpha);\n\
  \n  boost::logic::tribool b1 = true;\n  std::cout << (b1 || indeterminate) << '\\\
  n';\n  std::cout << (b1 && indeterminate) << '\\n';\n\n  boost::logic::tribool b2\
  \ = false;\n  std::cout << (b2 || indeterminate) << '\\n';\n  std::cout << (b2 &&\
  \ indeterminate) << '\\n';\n\n  boost::logic::tribool b3 = indeterminate;\n  std::cout\
  \ << (b3 || b3) << '\\n';\n  std::cout << (b3 && b3) << '\\n';\n}\n```\n\n你可以对 `boost::logic::tribool`\
  \ 变量使用逻辑运算符，就像对 `bool` 变量一样。实际上，这是处理 `boost::logic::tribool` 变量的唯一方法，因为该类没有提供任何成员函数。\n\
  \n示例 27.2, “`boost::logic::tribool` 的逻辑运算符 对于 `b1 || indeterminate` 返回 `true`，对于\
  \ `b2 && indeterminate` 返回 `false`，在所有其他情况下返回 `indeterminate`。\n\n# 28. Boost.CompressedPair\n\
  \n\n\n\n\n[Boost.CompressedPair](http://www.boost.org/libs/utility/compressed_pair.htm)提供了\
  \ `boost::compressed_pair`，这是一个行为类似于 `std::pair` 的类。然而，如果一个或两个模板参数为空类，`boost::compressed_pair`\
  \ 消耗的内存更少。`boost::compressed_pair` 使用了一种名为空基类优化的技术。\n\n要使用 `boost::compressed_pair`，请包含头文件\
  \ `boost/compressed_pair.hpp`。\n\n### 示例 28.1. 使用 `boost::compressed_pair` 减少内存需求\n\
  \n```\n#include <boost/compressed_pair.hpp>\n#include <utility>\n#include <iostream>\n\
  \nstruct empty {};\n\nint main()\n{\n  std::pair<int, empty> p;\n  std::cout <<\
  \ sizeof(p) << '\\n';\n\n  boost::compressed_pair<int, empty> cp;\n  std::cout <<\
  \ sizeof(cp) << '\\n'; own}\n```\n\n示例 28.1，“使用 `boost::compressed_pair` 减少内存需求`\
  \ 通过对 `cp` 使用 `boost::compressed_pair` 并对 `p` 使用 `std::pair` 说明了这一点。当使用 Visual C++\
  \ 2013 编译并在 64 位 Windows 7 系统上运行时，示例的 `sizeof(cp)` 返回 4，`sizeof(p)` 返回 8。\n\n请注意，`boost::compressed_pair`\
  \ 与 `std::pair` 还有另一个区别：`boost::compressed_pair` 中存储的值通过成员函数 `first()` 和 `second()`\
  \ 访问。而 `std::pair` 使用两个同名的成员变量。\n\n# 第 V 部分 算法\n\n以下库提供了对标准库算法的补充算法。\n\n*   `Boost.Algorithm`\
  \ 收集并提供了实用的算法。\n*   `Boost.Range` 也提供了算法，但更重要的是，它定义了一个名为 `range` 的新概念，这应该让使用算法变得更容易。\n\
  *   `Boost.Graph` 专门用于图，并提供了如寻找两点之间最短路径等算法。\n\n书中包含算法的几个库将在书的其他部分介绍。例如，你将在 `Boost.StringAlgorithms`\
  \ 库中找到字符串的算法，该库在第 II 部分，“字符串处理” 中介绍。\n\n# 29. Boost.Algorithm\n\n[Boost.Algorithm](http://www.boost.org/libs/algorithm)\
  \ 提供了对标准库算法的补充算法。与 `Boost.Range` 不同，`Boost.Algorithm` 没有引入新概念。`Boost.Algorithm`\
  \ 定义的算法与标准库的算法相似。\n\n请注意，其他 Boost 库也提供了许多算法。例如，你将在 `Boost.StringAlgorithms` 中找到处理字符串的算法。`Boost.Algorithm`\
  \ 提供的算法并不限于特定类（如 `std::string`）。与标准库的算法一样，它们可以用于任何容器。\n\n### 示例 29.1. 使用 `boost::algorithm::one_of_equal()`\
  \ 测试恰好仅有一个值\n\n```\n#include <boost/algorithm/cxx11/one_of.hpp>\n#include <array>\n\
  #include <iostream>\n\nusing namespace boost::algorithm;\n\nint main()\n{\n  std::array<int,\
  \ 6> a{{0, 5, 2, 1, 4, 3}};\n  auto predicate = [](int i){ return i == 4; };\n \
  \ std::cout.setf(std::ios::boolalpha);\n  std::cout << one_of(a.begin(), a.end(),\
  \ predicate) << '\\n';\n  std::cout << one_of_equal(a.begin(), a.end(), 4) << '\\\
  n';\n}\n```\n\n`boost::algorithm::one_of()` 测试某个条件是否恰好满足一次。要测试的条件以谓词的形式传递。在示例 29.1，“使用\
  \ `boost::algorithm::one_of_equal()` 测试恰好仅有一个值`\") 中，对 `boost::algorithm::one_of()`\
  \ 的调用返回 `true`，因为数字 4 在 `a` 中恰好存储了一次。\n\n要测试容器中的元素是否相等，请调用 `boost::algorithm::one_of_equal()`。你不需要传递谓词。相反，你传递一个值给\
  \ `boost::algorithm::one_of_equal()` 进行比较。在示例 29.1，“使用 `boost::algorithm::one_of_equal()`\
  \ 测试恰好仅有一个值`\") 中，对 `boost::algorithm::one_of_equal()` 的调用也返回 `true`。\n\n`boost::algorithm::one_of()`\
  \ 补充了 C++11 添加到标准库的 `std::all_of()`、`std::any_of()` 和 `std::none_of()`。然而，`Boost.Algorithm`\
  \ 提供了 `boost::all_of()`、`boost::any_of()` 和 `boost::none_of()`。与标准库算法一样，它们可以用于任何容器。\n\
  \n### 示例 29.2. C++11 算法的变体\n\n```\n#include <boost/algorithm/cxx11/iota.hpp>\n#include\
  \ <boost/algorithm/cxx11/is_sorted.hpp>\n#include <boost/algorithm/cxx11/copy_if.hpp>\n\
  #include <vector>\n#include <iterator>\n#include <iostream>\n\nusing namespace boost::algorithm;\n\
  \nint main()\n{\n  std::vector<int> v;\n  iota_n(std::back_inserter(v), 10, 5);\n\
  \  std::cout.setf(std::ios::boolalpha);\n  std::cout << is_increasing(v) << '\\\
  n';\n  std::ostream_iterator<int> out{std::cout, \",\"};\n  copy_until(v, out, [](int\
  \ i){ return i > 12; });\n}\n```\n\n`Boost.Algorithm` 在 `iota_hpp` 中提供了 C++11 算法\
  \ `iota()`。该函数生成顺序递增的数字。它期望两个用于容器边界的迭代器。随后容器中的元素将被重写为顺序递增的数字。\n\n与其使用 `boost::iota()`，示例\
  \ 29.2，“C++11 算法的变体` 使用 `iota_n()`。该函数期望一个用于写入数字的迭代器。生成的数字数量作为第三个参数传递给 `iota_n()`。\n\
  \n`Boost.Algorithm` 还提供了以下内容：`one_equal()`、`any_equal()` 和 `none_equal()`。这些内容位于相应的头文件中。\n\
  \n\n\n\n\n示例 29.2, “C++11 算法的变体” 显示 `boost::algorithm::is_increasing()` 的结果为 `true`，且\
  \ `boost::algorithm::copy_until()` 将数字 `10`、`11` 和 `12` 写入标准输出。\n\n示例。来自 Boost.Algorithm\
  \ 的 C++14 算法\n\n```cpp\n#include <boost/algorithm/cxx14/equal.hpp>\n#include <boost/algorithm/cxx14/mismatch.hpp>\n\
  #include <vector>\n#include <iostream>\n\nusing namespace boost::algorithm;\n\n\
  int main()\n{\n  std::vector<int> v{1, 2};\n  std::vector<int> w{1, 2, 3};\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << equal(v.begin(), v.end(), w.begin(), w.end()) << '\\n';\n  auto\
  \ pair = mismatch(v.begin(), v.end(), w.begin(), w.end());\n  if (pair.first !=\
  \ v.end())\n    std::cout << *pair.first << '\\n';\n  if (pair.second != w.end())\n\
  \    std::cout << *pair.second << '\\n';\n}\n```\n\n除了 C++11 标准库中的算法外，Boost.Algorithm\
  \ 还定义了极有可能添加到 C++14 标准库中的算法。示例 29.3, “来自 Boost.Algorithm 的 C++14 算法” 使用了其中两个函数的变变体：`boost::algorithm::equal()`\
  \ 和 `boost::algorithm::mismatch()`。与自 C++98 以来就一直是标准库的同名函数不同，这些新函数接收的是四个迭代器而不是三个。示例\
  \ 29.3, “来自 Boost.Algorithm 的 C++14 算法” 中的算法并不期望第二个序列包含与第一个序列一样多的元素。\n\n虽然 `boost::algorithm::equal()`\
  \ 返回一个 `bool`，但 `boost::algorithm::mismatch()` 返回一个包含两个迭代器的 `std::pair`。`first`\
  \ 和 `second` 分别指向第一个和第二个序列中第一个不匹配的元素。这些迭代器也可能指向序列的末尾。\n\n示例 29.3, “来自 Boost.Algorithm\
  \ 的 C++14 算法” 向标准输出写入了 `false` 和 `3`。`false` 是 `boost::algorithm::equal()` 的返回值，`3`\
  \ 是 `w` 中的第三个元素。由于 `v` 和 `w` 的前两个元素相等，`boost::algorithm::mismatch()` 返回的 `first`\
  \ 是一个指向 `v` 末尾的迭代器，而 `second` 是一个指向 `w` 第三个元素的迭代器。由于 `first` 指向 `v` 的末尾，该迭代器没有被解引用，因此没有输出。\n\
  \n示例 29.4. 使用 `boost::algorithm::hex()` 和 `boost::algorithm::unhex()`\n\n```cpp\n\
  #include <boost/algorithm/hex.hpp>\n#include <vector>\n#include <string>\n#include\
  \ <iterator>\n#include <iostream>\n\nusing namespace boost::algorithm;\n\nint main()\n\
  {\n  std::vector<char> v{'C', '+', '+'};\n  hex(v, std::ostream_iterator<char>{std::cout,\
  \ \"\"});\n  std::cout << '\\n';\n\n  std::string s = \"C++\";\n  std::cout << hex(s)\
  \ << '\\n';\n\n  std::vector<char> w{'4', '3', '2', 'b', '2', 'b'};\n  unhex(w,\
  \ std::ostream_iterator<char>{std::cout, \"\"});\n  std::cout << '\\n';\n\n  std::string\
  \ t = \"432b2b\";\n  std::cout << unhex(t) << '\\n';\n}\n```\n\n示例 29.4, “使用 `boost::algorithm::hex()`\
  \ 和 `boost::algorithm::unhex()` and boost::algorithm::unhex()\") 使用了 `boost::algorithm::hex()`\
  \ 和 `boost::algorithm::unhex()`。这两个函数 `boost::algorithm::hex()` 和 `boost::algorithm::unhex()`\
  \ 设计用于将字符串转换为十六进制。\n\n\n\n\n\n`boost::random_shuffle()` 的工作类似于 `std::random_shuffle()`，它会随机改变范围内元素的顺序。示例\
  \ 30.2, “与标准库算法相关的范围算法” 使用默认随机数生成器使用了 `boost::random_shuffle()`。然而，你可以将一个随机数生成器作为第二个参数传递。。该随机数生成器可以来自\
  \ C++11 的头文件 `random`，也可以来自 Boost.Random。\n\n`boost::copy()` 的工作类似于 `std::copy()`。`boost::max_element()`\
  \ 和 `boost::accumulate()` 的工作方式与标准库中同名的算法一致。与 `std::max_element()` 一样，`boost::max_element()`\
  \ 返回指向数值最大元素的迭代器。\n\n使用 `boost::accumulate()` 必须包含头文件 `boost/range/numeric.hpp`。正如\
  \ `std::accumulate()` 定义在 `numeric` 中一样，`boost::accumulate()` 定义在 `boost/range/numeric.hpp`\
  \ 中，而不是 `boost/range/algorithm.hpp`。\n\nBoost.Range 还提供了了一些标准库中没有对应项的算法。\n\n###\
  \ 示例 30.3. 标准库中没有对应的范围算法\n\n```cpp\n#include <boost/range/algorithm_ext.hpp>\n#include\
  \ <array>\n#include <deque>\n#include <iterator>\n#include <iostream>\n\nint main()\n\
  {\n  std::array<int, 6> a{{0, 1, 2, 3, 4, 5}};\n  std::cout << std::boolalpha <<\
  \ boost::is_sorted(a) << '\\n';\n  std::deque<int> d;\n  boost::push_back(d, a);\n\
  \  boost::remove_erase(d, 2);\n  boost::copy_n(d, 3, std::ostream_iterator<int>{std::cout,\
  \ \",\"});\n}\n```\n\n示例 30.3, “与标准库算法相关的范围算法” 中使用的算法需要头文件 `boost/range/algorithm_ext.hpp`。该头文件提供了对标准库中没有对应项的算法的访问。\n\
  \n`boost::is_sorted()` 测试范围内的元素是否排序。在示例 30.3, “与标准库算法相关的范围算法” 中，`boost::is_sorted()`\
  \ 返回 `true` 因为 `a` 是有序的。可以将一个谓词作为第二个参数传递给 `boost::is_sorted()`，例如检查范围是否是按降序排序的。\n\
  \n`boost::push_back()` 期望的第一个参数是一个容器，第二个参数是一个范围。该容器必须定义了成员函数 `push_back()`。范围中的所有元素将按照范围指定的顺序通过该成员函数添加到容器中。由于\
  \ `d` 初始为空，在调用 `boost::push_back()` 之后，它将包含与 `a` 相同的数字。\n\n`boost::remove_erase()`\
  \ 从 `d` 中删除数字 2。该算法结合了对函数 `std::remove()` 的调用以及相应容器成员函数 `erase()` 的调用。得益于 `boost::remove_erase()`，你不需要先找到所需元素的迭代器，然后在第二步将其传递给\
  \ `erase()`。\n\n`boost::copy_n()` 与 `std::copy()` 类似，但它只复制作为第二个参数传递的数量的元素。示例 30.3,\
  \ “与标准库算法相关的范围算法” 仅将 `d` 中的前三个数字写入标准输出。因为在上一行中从 `d` 中删除了 2，所以显示了 `0,1,3,`。\n\n##\
  \ 适配器 (Adaptors)\n\n标准库提供了几种可以传递谓词的算法。例如，传递给 `std::count_if()` 的谓词决定了哪些元素被计数。Boost.Range\
  \ 提供了类似的函数 `boost::count_if()`。然而，提供该算法只是为了完整性，因为 Boost.Range 提供了适配器，使得带有谓词的算法变得多余。\n\
  \n你可以将适配器理解为过滤器。它们根据另一个范围返回一个新的范围。由于范围仅仅是一对迭代器，因此适配器返回一个新的点对。这对仍然可以用于迭代原始范围，但例如可能会跳过某些元素。如果配合这种适配器使用\
  \ `boost::count()`，则不再需要 `boost::count_if()` 了。算法与适配器的区别在于，算法在范围上进行迭代并处理数据，而适配器返回一个新范围——即新的迭代器——该范围决定了迭代返回哪些元素。然而，适配器本身并不执行迭代。必须通过调用算法。\n\
  \n### 示例 30.4. 使用 `boost::adaptors::filter()` 过滤范围\n\n```cpp\n#include <boost/range/algorithm.hpp>\n\
  #include <boost/range/adaptors.hpp>\n#include <array>\n#include <iterator>\n#include\
  \ <iostream>\n\nint main()\n{\n  std::array<int, 6> a{{0, 5, 2, 1, 3, 4}};\n  boost::copy(boost::adaptors::filter(a,\
  \ [](int i){ return i > 2; }),\n    std::ostream_iterator<int>{std::cout, \",\"\
  });\n}\n```\n\n示例 30.4, “与标准库算法相关的范围算法” 使用了一个可以过滤范围的适配器。正如你所见，适配器只是一个函数。`boost::filter()`\
  \ 期望的第一个参数是一个待过滤的范围，第二个参数是一个谓词。示例 30.4, “与标准库算法相关的范围算法” 过滤除了范围中不大于 2 的数字。\n\n`boost::filter()`\
  \ 不改变范围 `a`，它返回一个新的范围。由于范围与迭代器对并不相似，新范围也指向 `a`。然而，新范围的迭代器跳过了所有小于或等于 2 的数字。示例 30.4,\
  \ “与标准库算法相关的范围算法” 向标准输出写入了 `5,3,4`。\n\n示例 30.5, “与标准库算法相关的范围算法” 使用两个适配器 `boost::adaptors::keys()`\
  \ 和 `boost::adaptors::values()` 来访问 `std::map` 类型容器的键和值。它还展示了适配器如何嵌套。因为 `m` 存储的是值的指针而不是值本身，所以\
  \ `boost::adaptors::values()` 返回的范围被传递给了 `boost::adaptors::indirect()`。当范围由指针组成可以使用该适配器，但迭代应该返回指针所指向的值。这就是为什么示例\
  \ 30.5, “与标准库算法相关的范围算法” 向标准输出写入了 `a,b,c,0,1,2,`。\n\n### 示例 30.5. 使用 `keys()`, `values()`\
  \ 和 `indirect()`\n\n```cpp\n#include <boost/range/algorithm.hpp>\n#include <boost/range/adaptors.hpp>\n\
  #include <array>\n#include <map>\n#include <string>\n#include <utility>\n#include\
  \ <iterator>\n#include <iostream>\n\nint main()\n{\n  std::array<int, 3> a{{0, 1,\
  \ 2}};\n  std::map<std::string, int*> m;\n  m.insert(std::make_pair(\"a\", &a[0]));\n\
  \  m.insert(std::make_pair(\"b\", &a[1]));\n  m.insert(std::make_pair(\"c\", &a[2]));\n\
  \n  boost::copy(boost::adaptors::keys(m),\n    std::ostream_iterator<std::string>{std::cout,\
  \ \",\"});\n  boost::copy(boost::adaptors::indirect(boost::adaptors::values(m)),\n\
  \    std::ostream_iterator<int>{std::cout, \",\"});\n}\n```\n\n\n\n\n\n示例 30.6,\
  \ “boost::adaptors::tokenize() – 字符串适配器” – an adaptor for strings\") 介绍了一个用于字符串的适配器。你可以使用\
  \ `boost::adaptors::tokenize()` 配合正则表达式从字符串中获取一个范围（range）。你将一个字符串和一个类型为 `boost::regex`\
  \ 的正则表达式传递给 `boost::adaptors::tokenize()`。此外，你还需要传递一个表示正则表达式中某个分组的数字和一个标志位。如果没有使用分组，可以传递\
  \ `0`。标志位 `boost::regex_constants::match_default` 选择正则表达式的默认设置。你也可以传递其他标志位。例如，如果你想让正则表达式按照\
  \ Perl 编程语言的规则进行应用，可以使用 `boost::regex_constants::match_perl`。\n\n示例 30.6. `boost::adaptors::tokenize()`\
  \ – 字符串适配器\n\n```\n#include <boost/range/algorithm.hpp>\n#include <boost/range/adaptors.hpp>\n\
  #include <boost/regex.hpp>\n#include <string>\n#include <iostream>\n\nint main()\n\
  {\n  std::string s = \"The Boost C++ Libraries\";\n  boost::regex expr{\"[\\\\w+]+\"\
  };\n  boost::copy(boost::adaptors::tokenize(s, expr, 0,\n    boost::regex_constants::match_default),\n\
  \    std::ostream_iterator<std::string>{std::cout, \",\"});\n}\n```\n\n## 辅助类与函数\n\
  \nBoost.Range 提供的算法和适配器是基于模板的。你不需要将容器转换为范围才能传递给算法或适配器。然而，Boost.Range 定义了几个范围类，其中\
  \ `boost::iterator_range` 是最重要的。之所以需要 `boost::iterator_range` 是因为适配器和少数算法返回的范围必须具有类型。此外，还存在一些辅助函数，它们可以创建迭代器包含迭代所需所有数据的范围。这些范围的迭代器并不引用容器或其他数据结构。这里也使用了像\
  \ `boost::iterator_range` 这样的类。\n\n示例 30.7. 使用 `boost::irange()` 为整数创建范围\n\n```\n\
  #include <boost/range/algorithm.hpp>\n#include <boost/range/irange.hpp>\n#include\
  \ <iostream>\n\nint main()\n{\n  boost::integer_range<int> ir = boost::irange(0,\
  \ 3);\n  boost::copy(ir, std::ostream_iterator<int>{std::cout, \",\"});\n}\n```\n\
  \n示例 30.7, “使用 `boost::irange()` 为整数创建范围”}\") 使用了函数 `boost::irange()`。该函数创建了一个整数范围，而无需使用容器或其他数据结构。你只需要向\
  \ `boost::irange()` 传递一个下界和一个上限，其中上限是开区间。\n\n`boost::irange()` 返回一个类型为 `boost::integer_range`\
  \ 的范围。该类派自 `boost::iterator_range`。`boost::iterator_range` 是一个模板，它期望迭代器类型作为其唯一的模板参数。`boost::irange()`\
  \ 使用的迭代器与该函数紧密耦合，并且是一个实现细节。因此，迭代器类型是不可知的，不能作为模板参数传递给 `boost::iterator_range`。然而，`boost::integer_range`\
  \ 只期望一种整数类型，这使得它比传递迭代器类型时更容易使用。\n\n示例 30.7, “使用 `boost::irange()` 为整数创建范围”\") 向标准输出写入了\
  \ `0,1,2`。\n\n示例 30.8, “使用 `boost::istream_range()` 为输入流创建范围”\") 引入了函数 `boost::istream_range()`，它为输入流创建一个范围。该函数返回一个\
  \ `boost::iterator_range` 类型的范围。这意味着必须作为模板参数传递迭代器类型。\n\n当你开始 示例 30.8, “使用 `boost::istream_range()`\
  \ 为输入流创建范围”\")，输入一个数字并按 `Enter`，该数字将打印在下一行。如果你输入另一个数字并按 `Enter`，该数字会被打印。`boost::istream_range()`\
  \ 返回的范围使得 `boost::copy()` 可以遍历所有输入的数字并将它们写入 `std::cout`。\n\n你可以随时通过输入 `Ctrl`+`C`\
  \ 终止程序。\n\n示例 30.8. 使用 `boost::istream_range()` 为输入流创建范围\n\n```\n#include <boost/range/algorithm.hpp>\n\
  #include <boost/range/istream_range.hpp>\n#include <iterator>\n#include <iostream>\n\
  \nint main()\n{\n  boost::iterator_range<int> ir = boost::istream_range<int>(std::cin);\n\
  \  boost::copy(ir, std::ostream_iterator<int>{std::cout, \"\\n\"});\n}\n```\n\n\
  除了 `boost::iterator_range`，Boost.Range 还提供了 `boost::sub_range` 类，它派自 `boost::iterator_range`。`boost::sub_range`\
  \ 是像 `boost::iterator_range` 一样的模板。然而，`boost::sub_range` 期望范围的类型而非迭代器类型。这可以简化用法。\n\
  \n示例 30.9. 使用 `boost::sub_range()` 更方便地创建范围\n\n```\n#include <boost/range/algorithm.hpp>\n\
  #include <boost/range/iterator_range.hpp>\n#include <boost/range/sub_range.hpp>\n\
  #include <array>\n#include <iterator>\n#include <iostream>\n\nint main()\n{\n  std::array<int,\
  \ 6> a{0, 1, 2, 3, 4, 5};\n  boost::iterator_range<std::array<int, 6>> r1 =\n  \
  \  boost::random_shuffle(a);\n  boost::sub_range<std::array<int, 6>> r2 =\n    boost::random_shuffle(r1);\n\
  \  boost::copy(r2, std::ostream_iterator<int>{std::cout, \",\"});\n}\n```\n\nBoost.Range\
  \ 中的少数算法返回一个范围——例如 `boost::random_shuffle()`。该算法通过引用修改传递给它的范围并返回该范围。在 示例 30.9, “使用\
  \ `boost::sub_range()` 更方便地创建范围”\") 中，`boost::random_shuffle()` 被调用两次，所以数组 `a` 被随机打乱了两次。\n\
  \n对于第一个返回值，示例使用了 `boost::iterator_range`；对于第二个返回值，它使用了 `boost::sub_range`。这两个类的用法区别仅在于模板参数。不仅\
  \ `boost::sub_range` 实例化更方便，它还提供了 `const_iterator` 类型定义。\n\n# 31. Boost.Graph\n\n\
  [Boost.Graph](http://www.boost.org/libs/graph) 提供了处理图的工具。图是点之间具有任意数量线的二维点云。地铁地图是一个很好的例子。地铁站是点，地铁线连接它们。\n\
  \n## 顶点与边\n\n图由顶点和边组成。为了创建一个图，你必须定义一组点以及它们之间的任意线。示例 31.1, “具有四个顶点的 `boost::adjacency_list`\
  \ 类型图” 包含第一个由四个点且没有线的简单图。\n\n\n\n\nBoost.Graph 提供了三种容器来定义图。最重要的容器是 `boost::adjacency_list`，它几乎用于本章中所有的示例。要使用此类类，请包含头文件\
  \ `boost/graph/adjacency_list.hpp`。如果你想使用其他容器，必须包含另一个头文件。没有一个主头文件可以访问 Boost.Graph\
  \ 中的所有类和函数。\n\n### 示例 31.1. 四个顶点的 `boost::adjacency_list` 图\n\n```cpp\n#include\
  \ <boost/graph/adjacency_list.hpp>\n#include <iostream>\n\nint main()\n{\n  boost::adjacency_list<>\
  \ g;\n\n  boost::adjacency_list<>::vertex_descriptor v1 = boost::add_vertex(g);\n\
  \  boost::adjacency_list<>::vertex_descriptor v2 = boost::add_vertex(g);\n  boost::adjacency_list<>::vertex_descriptor\
  \ v3 = boost::add_vertex(g);\n  boost::adjacency_list<>::vertex_descriptor v4 =\
  \ boost::add_vertex(g);\n\n  std::cout << v1 << \", \" << v2 << \", \" << v3 <<\
  \ \", \" << v4 << '\\n';\n}\n```\n\n`boost::adjacency_list` 是一个模板，在示例 31.1, “四个顶点的\
  \ `boost::adjacency_list` 图” 中使用默认参数实例化。稍后你会看到可以传递哪些参数。该类定义在 `boost` 命名空间中。Boost.Graph\
  \ 的所有类和函数都在这个命名空间中。\n\n要向图中添加四个点，必须调用四次 `boost::add_vertex()` 函数。\n\n`boost::add_vertex()`\
  \ 是一个独立函数，而不是 `boost::adjacency_list` 的成员函数。你会发现 Boost.Graph 中有很多独立函数，这些函数本可以实现为成员函数。Boost.Graph\
  \ 的设计更像是一个泛型库，而不是一个面向对象的库。\n\n`boost::add_vertex()` 向图中添加一个点。在图论中，点被称为顶点（vertex），这解释了该函数的命名。\n\
  \n`boost::add_vertex()` 返回类型为 `boost::adjacency_list::vertex_descriptor` 的对象。该对象代表图中新添加的点。你可以像示例\
  \ 31.1, “四个顶点的 `boost::adjacency_list` 图”所示所示将对象写入标准输出。该示例显示了 `0, 1, 2, 3`。\n\n\
  示例 31.1, “四个顶点的 `boost::adjacency_list` 图”通过正整数识别点。这些数字是 `boost::adjacency_list`\
  \ 内部使用的 vector 的索引。`boost::add_vertex()` 返回 0, 1, 2 和 3 并不意外，因为每次调用都会向 vector 中添加另一个点。\n\
  \n`std::vector` 是 `boost::adjacency_list` 默认用于存储点的容器。在这种情况下，`boost::adjacency_list::vertex_descriptor`\
  \ 是 `std::size_t` 的类型定义。因为可以使用其他容器来存储点，所以 `boost::adjacency_list::vertex_descriptor`\
  \ 并不总是 `std::size_t`。\n\n### 示例 31.2. 使用 `boost::vertices()` 访问顶点\n\n```cpp\n#include\
  \ <boost/graph/adjacency_list.hpp>\n#include <utility>\n#include <algorithm>\n#include\
  \ <iterator>\n#include <iostream>\n\nint main()\n{\n  boost::adjacency_list<> g;\n\
  \n  boost::add_vertex(g);\n  boost::add_vertex(g);\n  boost::add_vertex(g);\n  boost::add_vertex(g);\n\
  \n  std::pair<boost::adjacency_list<>::vertex_iterator,\n    boost::adjacency_list<>::vertex_iterator>\
  \ vs = boost::vertices(g);\n\n  std::copy(vs.first, vs.second,\n    std::ostream_iterator<boost::adjacency_list<>::vertex_descriptor>{\n\
  \      std::cout, \"\\n\"});\n}\n```\n\n要获取图中所有的点，调用 `boost::vertices()`。此函数返回两个类型为\
  \ `boost::adjacency_list::vertex_iterator` 的迭代器，分别指向起点和终点。迭代器以 `std::pair` 的形式返回。示例\
  \ 31.2, “使用 `boost::vertices()` 访问顶点”\") 使用迭代器将所有点写入标准输出。该示例显示了数字 0, 1, 2 和 3，与上一个示例一样。\n\
  \n示例 31.3, “使用 `boost::edges()` 访问边”\")\n\n\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <utility>\n#include <algorithm>\n#include <iterator>\n#include <iostream>\n\
  \nint main()\n{\n  typedef boost::adjacency_list<boost::setS, boost::vecS,\n   \
  \ boost::undirectedS> graph;\n  graph g;\n\n  boost::adjacency_list<>::vertex_descriptor\
  \ v1 = boost::add_vertex(g);\n  boost::adjacency_list<>::vertex_descriptor v2 =\
  \ boost::add_vertex(g);\n  boost::add_vertex(g);\n  boost::add_vertex(g);\n\n  std::pair<graph::edge_descriptor,\
  \ bool> p =\n    boost::add_edge(v1, v2, g);\n  std::cout.setf(std::ios::boolalpha);\n\
  \  std::cout << p.second << '\\n';\n\n  p = boost::add_edge(v1, v2, g);\n  std::cout\
  \ << p.second << '\\n';\n\n  p = boost::add_edge(v2, v1, g);\n  std::cout << p.second\
  \ << '\\n';\n\n  std::pair<graph::edge_iterator,\n    graph::edge_iterator> es =\
  \ boost::edges(g);\n\n  std::copy(es.first, es.second,\n    std::ostream_iterator<graph::edge_descriptor>{std::cout,\
  \ \"\\n\"});\n}\n```\n\n默认情况下，`boost::adjacency_list` 使用 `std::vector` 来处理点和线。通过在示例\
  \ 31.4, “带有选择器的 `boost::adjacency_list`”中在第一个模板参数中传递 `boost::setS`，`std::set` 被选为用于线的容器。由于\
  \ `std::set` 不支持重复项，因此无法多次使用 `boost::add_edge()` 添加相同的线。因此，该示例仅显示了一次 `(0,1)`。\n\n\
  第二个模板参数告诉 `boost::adjacency_list` 应该使用哪个类来处理点。在示例 31.4, “带有选择器的 `boost::adjacency_list`”中传递了\
  \ `boost::vecS`。这是第二个模板参数的默认值。设置它的目的是为了你可以传递第三个模板参数。\n\n第三个模板参数决定了线是有向的还是无向的。默认是\
  \ `boost::directedS`，这意味着所有线都是有向的，并且可以画成箭头。线只能向一个方向跨越。\n\n`boost::undirectedS` 使用在示例\
  \ 31.4, “带有选择器的 `boost::adjacency_list`”中。该选择器使所有线变为无向的，这意味着可以从任何方向跨越线。哪个点是起点，哪个点是终点并不重要。这也是为什么示例\
  \ 31.4, “带有选择器的 `boost::adjacency_list`”中的图只包含一条线的另一个原因。第三次调用函数 `boost::add_edge()`\
  \ 交换了起点和终点，但由于示例中的线是无向的，这条线与之前的相同，因此没有被添加。\n\nBoost.Graph 提供了更多的选择器，包括 `boost::listS`、`boost::mapS`\
  \ 和 `boost::hash_setS`。可以使用 `boost::bidirectionalS` 使线变为双向的。该选择器类似于 `boost::undirectedS`，但在这种情况下，起点和终点是重要的。如果你在示例\
  \ 31.4, “带有选择器的 `boost::adjacency_list`”中使用 `boost::bidirectionalS`，那么第三次调用 `boost::add_edge()`\
  \ 将向图中添加一条线。\n\n示例 31.5, “使用 `boost::add_edge()` 自动创建索引”) 展示了一种种向图中添加点和线的更简单的方法。\n\
  \n### 示例 31.5. 使用 `boost::add_edge()` 自动创建索引\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <tuple>\n#include <algorithm>\n#include <iterator>\n#include <iostream>\n\
  \nint main()\n{\n  typedef boost::adjacency_list<boost::setS, boost::vecS,\n   \
  \ boost::undirectedS> graph;\n  graph g;\n\n  enum { topLeft, topRight, bottomRight,\
  \ bottomLeft };\n\n  boost::add_edge(topLeft, topRight, g);\n  boost::add_edge(topRight,\
  \ bottomRight, g);\n  boost::add_edge(bottomRight, bottomLeft, g);\n  boost::add_edge(bottomLeft,\
  \ topLeft, g);\n\n  graph::edge_iterator it, end;\n  std::tie(it, end) = boost::edges(g);\n\
  \  std::copy(it, end,\n    std::ostream_iterator<graph::edge_descriptor>{std::cout,\
  \ \"\\n\"});\n}\n```\n\n示例 31.5, “使用 `boost::add_edge()` 自动创建索引”) 定义了一个由四个点组成的图。你可以将该图可视化为包含四个字段的地图，每个字段由一个点表示。点被命名为\
  \ `topLeft`、`topRight`、`bottomRight` 和 `bottomLeft`。由于名称是在枚举中分配的，每个名称将有一个作为索引使用的数值值。\n\
  \n可以在不调用 `boost::add_vertex()` 的情况下定义图。Boost.Graph 会向图中添加缺失的点。在示例 31.5, “使用 `boost::add_edge()`\
  \ 自动创建索引”)中，`boost::add_edge()` 调用不仅定义了线，还添加了点。`std::tie()` 用于将 `boost::edges()`\
  \ 返回的迭代器存储在 `std::pair` 中。`std::tie()` 从 C++11 起就是标准库的一部分。示例 31.5, “使用 `boost::add_edge()`\
  \ 自动创建索引”)中的图是一个带有四个字段的地图。要从左上角到右下角，可以跨越右上角的字段或左下角的字段。相反的字段之间没有线。因此，无法直接从左上角到右下角。\n\
  \n### 示例 31.6. `boost::adjacent_vertices()` 和 `boost::out_edges()`\n\n```cpp\n#include\
  \ <boost/graph/adjacency_list.hpp>\n#include <tuple>\n#include <algorithm>\n#include\
  \ <iterator>\n#include <iostream>\n\nint main()\n{\n  typedef boost::adjacency_list<boost::setS,\
  \ boost::vecS,\n    boost::undirectedS> graph;\n  graph g;\n\n  enum { topLeft,\
  \ topRight, bottomRight, bottomLeft };\n\n  boost::add_edge(topLeft, topRight, g);\n\
  \  boost::add_edge(topRight, bottomRight, g);\n  boost::add_edge(bottomRight, bottomLeft,\
  \ g);\n  boost::add_edge(bottomLeft, topLeft, g);\n\n  graph::adjacency_iterator\
  \ vit, vend;\n  std::tie(vit, vend) = boost::adjacent_vertices(topLeft, g);\n  std::copy(vit,\
  \ vend,\n    std::ostream_iterator<graph::vertex_descriptor>{std::cout, \"\\n\"\
  });\n\n  graph::out_edge_iterator eit, eend;\n  std::tie(eit, eend) = boost::out_edges(topLeft,\
  \ g);\n  std::for_each(eit, eend,\n    &g\n      { std::cout << boost::target(it,\
  \ g) << '\\n'; });\n}\n```\n\n示例 31.6, “`boost::adjacent_vertices()` 和 `boost::out_edges()`”\
  \ and boost::out_edges()) 介绍了获取点额外信息的函数。`boost::adjacent_vertices()` 返回一对迭代器，指向与点连接的点。如果你想访问从点出发的所有出线，则调用\
  \ `boost::out_edges()`。`boost::in_edges()` 访问入线。对于无向线，调用哪一个函数都没有区别。\n\n`boost::target()`\
  \ 返回线的终点。起点通过 `boost::source()` 返回。\n\n\n\n\nExample 31.6, “`boost::adjacent_vertices()`\
  \ 和 `boost::out_edges()`” and boost::out_edges()\") 向标准输出输出了两次 1 和 3，分别是右上角和左下角字段的索引。调用\
  \ `boost::adjacent_vertices()` 并传入 `topLeft` 会返回并显示右上角和左下角字段的索引。`topLeft` 也被传递给\
  \ `boost::out_edges()` 以获取出边。由于在 `std::for_each()` 中对每条出边都调用了 `boost::target()`，因此右上角和左下角字段的索引显示了两次。\n\
  \nExample 31.7, “通过线条初始化 `boost::adjacency_list`” 演示了如何使用 `boost::adjacency_list`\
  \ 定义图，而无需为每条线条调用 `boost::add_edge()`。\n\n### Example 31.7. 通过线条初始化 `boost::adjacency_list`\n\
  \n```cpp\n#include <boost/graph/adjacency_list.hpp>\n#include <array>\n#include\
  \ <utility>\n#include <iostream>\n\nint main()\n{\n  enum { topLeft, topRight, bottomRight,\
  \ bottomLeft };\n\n  std::array<std::pair<int, int>, 4> edges{{\n    std::make_pair(topLeft,\
  \ topRight),\n    std::make_pair(topRight, bottomRight),\n    std::make_pair(bottomRight,\
  \ bottomLeft),\n    std::make_pair(bottomLeft, topLeft)\n  }};\n\n  typedef boost::adjacency_list<boost::setS,\
  \ boost::vecS,\n    boost::undirectedS> graph;\n  graph g{edges.begin(), edges.end(),\
  \ 4};\n\n  std::cout << boost::num_vertices(g) << '\\n';\n  std::cout << boost::num_edges(g)\
  \ << '\\n';\n\n  g.clear();\n}\n```\n\n你可以将迭代器传递给 `boost::adjacency_list` 的构造函数，这些迭代器指向\
  \ `std::pair<int, int>` 类型的对象，代表线条。如果你传递了迭代器，还必须提供第三个参数来确定图中点的总数。图将包含线条所需的点。第三个参数允许你向图中添加未与其他点连接的点。\n\
  \nExample 31.7, “通过线条初始化 `boost::adjacency_list`” 使用了 `boost::num_vertices()` 和\
  \ `boost::num_edges()` 函数，它们分别返回点的数量和线条的数量。示例显示了两次 `4`。\n\nExample 31.7, “通过线条初始化\
  \ `boost::adjacency_list`” 调用了 `boost::adjacency_list::clear()`。该成员函数移除所有点和线条。它是\
  \ `boost::adjacency_list` 的成员函数，而不是自由函数。\n\n## 算法\n\nBoost.Graph 的算法与标准库的算法相似——它们是通用的且非常灵活。然而，并不总是一眼看出如何使用它们。\n\
  \n### Example 31.8. 使用 `breadth_first_search()` 从内向外访问点\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/breadth_first_search.hpp>\n#include <boost/graph/named_function_params.hpp>\n\
  #include <boost/graph/visitors.hpp>\n#include <boost/array.hpp>\n#include <array>\n\
  #include <utility>\n#include <iterator>\n#include <algorithm>\n#include <iostream>\n\
  \nint main()\n{\n  enum { topLeft, topRight, bottomRight, bottomLeft };\n\n  std::array<std::pair<int,\
  \ int>, 4> edges{{\n    std::make_pair(topLeft, topRight),\n    std::make_pair(topRight,\
  \ bottomRight),\n    std::make_pair(bottomRight, bottomLeft),\n    std::make_pair(bottomLeft,\
  \ topLeft)\n  }};\n\n  typedef boost::adjacency_list<boost::setS, boost::vecS,\n\
  \    boost::undirectedS> graph;\n  graph g{edges.begin(), edges.end(), 4};\n\n \
  \ std::array<int, 4> distances{{0}};\n\n  boost::breadth_first_search(g, topLeft,\n\
  \    boost::visitor(\n      boost::record_distances(distances.begin(),\n       \
  \   boost::on_tree_edge{})));\n\n  std::copy(distances.begin(), distances.end(),\
  \ std::ostream_iterator<int>(std::cout, \"\\n\"));\n}\n```\n\nExample 31.8, “使用\
  \ `breadth_first_search()` 从内向外访问点”\") 使用 `breadth_first_search()` 算法从内向外访问点。它从第二个参数传递的点开始，并访问从该点直接到达的所有点。`breadth_first_search()`\
  \ 并不返回特定结果，它只是访问点。\n\n通过向 `breadth_first_search()` 传递访问者（visitors），你可以决定访问点时发生什么。访问者是在访问点时会被调用的成员函数。\n\
  \nExample 31.8, “使用 `breadth_first_search()` 从内向外访问点”\") 使用了一个记录距离的访问者。距离是从一个点到另一个点需要跨越的线条数量。Boost.Graph\
  \ 提供了辅助函数 `record_distances()` 来创建访问者。\n\n属性映射（property maps）存储点或线条的属性。Boost.Graph\
  \ 描述了属性映射的概念。由于属性映射接受指针或迭代器作为起始，因此不需要深入理解属性映射。在 Example 31.8, “使用 `breadth_first_search()`\
  \ 从内向外访问点”\") 中，通过 `distances.begin()` 将数组的起始传递给 `record_distances()`。这足够让 `distances`\
  \ 用作属性映射。然而，数组的大小不能小于点的数量。\n\n请注意，`distances` 是基于 `boost::array` 的，而不是 `std::array`。使用\
  \ `std::array` 将导致编译错误。\n\n不同的算法对应不同的事件。传递给 `record_distances()` 的第二个参数指定了访问者应该通知哪些事件。Boost.Graph\
  \ 定义了空类来命名事件。Example 31.8, “使用 `breadth_first_search()` 从内向外访问点”\") 中的 `boost::on_tree_edge`\
  \ 标签指定在发现新点时记录距离。\n\n事件取决于算法。你需要查看算法的文档以确定支持哪些事件以及可以使用哪些标签。\n\n\n\n\n\n由 `boost::record_distances()`\
  \ 创建的访问者（visitor）与算法无关，因此你可以将 `boost::record_distances()` 与其他算法配合使用。适配器（adapter）用于绑定算法和访问者。示例\
  \ 31.8, “使用 `breadth_first_search()` 从内向外访问点”\")调用了 `boost::make_bfs_visitor()`\
  \ 来创建此适配器。该辅助函数返回 `boost::breadth_first_search()` 预期的访问者。该访问者定义了算法支持的成员函数。例如，`boost::make_bfs_visitor()`\
  \ 返回的访问者定义了成员函数 `tree_edge()`。如果将带有 `boost::on_tree_edge` 标签的访问者传递给 `boost::make_bfs_visitor()`（当\
  \ `tree_edge()` 被调用时，访问者会被通知）（如示例 31.8, “使用 `breadth_first_search()` 从内向外访问点”](#part0050.html_ex.graph_08\
  \ \"Example 31.8. Visiting points from inside to outside with breadth_first_search()\"\
  )），这允许你在不同算法中使用访问者，而无需让这些访问者定义算法的所有成员函数`boost::make_bfs_visitor()` 返回的适配器不能直接传递给\
  \ `boost::breadth_first_search()`。它必须用 `boost::visitor()` 包裹并作为第三个参数传递。`boost::breadth_first_search()`\
  \ 有变体。一种要求传递算法支持的所有参数。另一种支持类似于命名参数的形式。通常使用这种变体更简单，因为只需要传递你感兴趣的参数。许多参数不需要传递，因为算法使用了默认值。示例\
  \ 31.8, “使用 `breadth_first_search()` 从内向外访问点”\")使用了期望命名参数的 `boost::breadth_first_search()`\
  \ 变体。前两个参数是图和起点，它们是必须的。然而，第三个参数可以是任何内容。在示例 31.8, “使用 `breadth_first_search()` 从内向外访问点”](#part0050.html_ex.graph_08\
  \ \"Example 31.8. Visiting points from inside to outside with breadth_first_search()\"\
  )中需要传递一个访问者。为了实现这一点，`boost::make_bfs_visitor()` 返回的适配器使用 `boost::visitor()` 进行命名。现在很清楚第三个参数是一个访问者。你将在下面的示例中看到如何通过名称将其他参数传递给\
  \ `boost::breadth_first_search()`。示例 31.8, “使用 `breadth_first_search()` 从内向外访问点”\"\
  )显示了 0、1、2。这些是从左上到所有点的距离。索引为 1 的右上字段只有一步之遥。索引为 2 的右下字段有两步遥。索引为 3 的左下字段同样只有一步之遥。首先打印的数字\
  \ 0 指的是左上字段。由于它是传递给 `boost::breadth_first_search()` 的起点，因此到达它需要零步。`boost::breadth_first_search()`\
  \ 不设置数组中的元素，它只是增加存储的值。因此，在开始之前必须初始化 `distances` 数组中的所有元素。示例 31.9, “使用 `breadth_first_search()`\
  \ 查找路径”\")说明了如何寻找最短路径。示例 31.9, “使用 `breadth_first_search()` 查找路径”\")显示了 0、1 和 2。这是从左上到右下的最短路径。它经过了右上字段，尽管经过左下字段的路径同样短。再次使用了\
  \ `boost::breadth_first_search()`——这次是为了寻找最短路径。如你所知，该算法只是访问点。要获取最短路径的描述，必须使用适当的访问者。示例\
  \ 31.9, “使用 `breadth_first_search()` 查找路径”\")调用了 `boost::record_predecessors()`\
  \ 来获取一个。`boost::record_predecessors()` 返回一个用于存储前驱的访问者。每当 `boost::breadth_first_search()`\
  \ 访问新点时，上一个点就会存储在属性映射中。随着 `boost::breadth_first_search()` 从内向外访问点，找到了最短路径——从传递给\
  \ `boost::record_predecessors()` 的点开始。示例 31.9, “使用 `breadth_first_search()` 查找路径”\"\
  )找到了最短路径。\n\n示例 31.9. 使用 `breadth_first_search()` 查找路径\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/breadth_first_search.hpp>\n#include <boost/graph/named_params.hpp>\n\
  #include <boost/graph/visitors.hpp>\n#include <boost/array.hpp>\n#include <array>\n\
  #include <utility>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n\
  \  enum { topLeft, topRight, bottomRight, bottomLeft };\n\n  std::array<std::pair<int,\
  \ int>, 4> edges{{\n    std::make_pair(topLeft, topRight),\n    std::make_pair(topRight,\
  \ bottomRight),\n    std::make_pair(bottomRight, bottomLeft),\n    std::make_pair(bottomLeft,\
  \ topLeft)\n  }};\n\n  typedef boost::adjacency_list<boost::setS, boost::vecS, boost::undirectedS>\
  \ graph;\n  graph g{edges.begin(), edges.end(), 4};\n\n  boost::array<int, 4> predecessors;\n\
  \  predecessors[bottomRight] = bottomRight;\n\n  boost::breadth_first_search(g,\
  \ bottomRight,\n    boost::visitor(\n      boost::make_bfs_visitor(\n        boost::record_predecessors(predecessors.begin(),\n\
  \          boost::on_tree_edge{}))));\n\n  int p = topLeft;\n  while (p != bottomRight)\n\
  \  {\n    std::cout << p << '\\n';\n    p = predecessors[p];\n  }\n  std::cout <<\
  \ p << '\\n';\n}\n```\n\n\n\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/breadth_first_search.hpp>\n#include <boost/graph/named_function_params.hpp>\n\
  #include <boost/graph/visitors.hpp>\n#include <boost/array.hpp>\n#include <array>\n\
  #include <utility>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n\
  \  enum { topLeft, topRight, bottomRight, bottomLeft };\n\n  std::array<std::pair<int,\
  \ int>, 4> edges{{\n    std::make_pair(topLeft, topRight),\n    std::make_pair(topRight,\
  \ bottomRight),\n    std::make_pair(bottomRight, bottomLeft),\n    std::make_pair(bottomLeft,\
  \ topLeft)\n  }};\n\n  typedef boost::adjacency_list<boost::setS, boost::vecS,\n\
  \    boost::undirectedS> graph;\n  graph g{edges.begin(), edges.end(), 4};\n\n \
  \ boost::array<int, 4> distances{{0}};\n  boost::array<int, 4> predecessors;\n \
  \ predecessors[bottomRight] = bottomRight;\n\n  boost::breadth_first_search(g, bottomRight,\n\
  \    boost::visitor(\n      boost::make_bfs_visitor(\n        std::make_pair(\n\
  \          boost::record_distances(distances.begin(),\n            boost::on_tree_edge()),\n\
  \          boost::record_predecessors(predecessors.begin(),\n            boost::on_tree_edge{})))));\n\
  \n  std::for_each(distances.begin(), distances.end(),\n    [](int d){ std::cout\
  \ << d << '\\n'; });\n\n  int p = topLeft;\n  while (p != bottomRight)\n  {\n  \
  \  std::cout << p << '\\n';\n    p = predecessors[p];\n  }\n  std::cout << p <<\
  \ '\\n';\n}\n```\n\n示例 31.10, “使用 `breadth_first_search()` 距离和路径”\") 展示了如何在使用两个访问者时使用\
  \ `boost::breadth_first_search()`。要使用两个访问者，你需要将它们放入 `std::make_pair()` 生成的配对中。如果需要两个以上的访问者，则必须对对进行嵌套。示例\
  \ 31.10, “使用 `breadth_first_search()` 距离和路径”\") 所实现的功能与 示例 31.8, “使用 `breadth_first_search()`\
  \ 从内向外访问点”\") 和 示例 31.9, “使用 `breadth_first_search()` 查找路径”\") 结合的功能相同。\n\n`boost::breadth_first_search()`\
  \ 仅当每条边的权重相同时时才能使用。这意味着跨越点与点之间任何边所需的时间总是相同的。如果边是有权重的（意味着每条边可能需要不同的时间来通过），那么你需要使用不同的算法来寻找最短路径。\n\
  \n### 示例 31.11. 使用 `dijkstra_shortest_paths()` 查找路径\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/dijkstra_shortest_paths.hpp>\n#include <boost/graph/named_function_params.hpp>\n\
  #include <boost/array.hpp>\n#include <array>\n#include <utility>\n#include <iostream>\n\
  \nint main()\n{\n  enum { topLeft, topRight, bottomRight, bottomLeft };\n\n  std::array<std::pair<int,\
  \ int>, 4> edges{{\n    std::make_pair(topLeft, topRight),\n    std::make_pair(topRight,\
  \ bottomRight),\n    std::make_pair(bottomRight, bottomLeft),\n    std::make_pair(bottomLeft,\
  \ topLeft)\n  }};\n\n  typedef boost::adjacency_list<boost::listS, boost::vecS,\n\
  \    boost::undirectedS, boost::no_property,\n    boost::property<boost::edge_weight_t,\
  \ int>> graph;\n\n  std::array<int, 4> weights{{2, 1, 1, 1}};\n\n  graph g{edges.begin(),\
  \ edges.end(), weights.begin(), 4};\n\n  boost::array<int, 4> directions;\n  boost::dijkstra_shortest_paths(g,\
  \ bottomRight,\n    boost::predecessor_map(directions.begin()));\n\n  int p = topLeft;\n\
  \  while (p != bottomRight)\n  {\n    std::cout << p << '\\n';\n    p = directions[p];\n\
  \  }\n  std::cout << p << '\\n';\n}\n```\n\n示例 31.11, “使用 `dijkstra_shortest_paths()`\
  \ 查找路径”)+ 使用 `dijkstra_shortest_paths()` 查找路径。，`dijkstra_shortest_paths()` 只有在边有权重时才能使用。示例\
  \ 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ 使用了 `dijkstra_shortest_paths()`\
  \ 来查找最短路径。示例 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ `dijkstra_shortest_paths()`\
  \ 是在边是有权重的情况下。示例 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ 假设从左上角到右下角的时间是跨越其他边时间的两倍。\n\
  \n在使用 `dijkstra_shortest_paths()` 之前，必须为边分配权重。这是通过 `weights` 数组实现的。示例 31.11, “使用\
  \ `dijkstra_shortest_paths()` 查找路径”)+ `dijkstra_shortest_paths()` 只有在属性已定义的情况下才有效。为了给边分配权重，使用了\
  \ `weights`。示例 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ `dijkstra_shortest_paths()`\
  \ 传递给 `adjacency_list` 的额外的参数。\n\n默认情况下，`adjacency_list` 使用 `boost::no_property`，这意味着点和边都没有属性。示例\
  \ 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ 第五个参数使用 `boost::property` 来定义打包属性。打包属性（bundled\
  \ properties）是存储在图中的属性。由于可以定义多个属性，`boost::property` 需要一个标签来定义每个属性。Boost.Graph 提供了一些标签，如\
  \ `boost::edge_weight_t`，用于定义算法自动识别并使用的属性。传递给 `boost::property` 的第二个模板参数是属性的类型。示例\
  \ 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+ 权重是 `int` 类型。示例 31.11, “使用 `dijkstra_shortest_paths()`\
  \ 查找路径”)+ `dijkstra_shortest_paths()` 自动使用了类型为 `boost::edge_weight_t` 的打包属性。\n\n\
  注意没有向 `dijkstra_shortest_paths()` 传递访问者。该算法不仅仅是访问点。它是在寻找最短路径——这就是为什么它被称为 `dijkstra_shortest_paths()`。你不需要考虑事件或访问者。你只需要传递一个容器来存储每个前驱。如果你使用带有命名参数的\
  \ `dijkstra_shortest_paths()` 变体，示例 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”](#part0050.html_ex.graph_11\
  \ \"Example 31.11. Finding paths with dijkstra_shortest_paths())+ 请通过 `boost::predecessor_map()`\
  \ 传递容器。这是一个辅助函数，它期望指向数组开头的指针或迭代器。\n\n示例 31.11, “使用 `dijkstra_shortest_paths()` 查找路径”)+\
  \ 显示了 0, 3 和 2：从左上角到右下角的最短路径经过了左下角区域。经过右上角区域的路径权重大于其他可能性。\n\n### 示例 31.12. 使用自定义属性的\
  \ `dijkstra_shortest_paths()`\n\n\n\n\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
  #include <boost/graph/dijkstra_shortest_paths.hpp>\n#include <boost/graph/named_function_params.hpp>\n\
  #include <boost/array.hpp>\n#include <array>\n#include <utility>\n#include <iostream>\n\
  \nint main()\n{\n  enum { topLeft, topRight, bottomRight, bottomLeft };\n\n  std::array<std::pair<int,\
  \ int>, 4> edges{{\n    std::make_pair(topLeft, topRight),\n    std::make_pair(topRight,\
  \ bottomRight),\n    std::make_pair(bottomRight, bottomLeft),\n    std::make_pair(bottomLeft,\
  \ topLeft)\n  }};\n\n  struct edge_properties\n  {\n    int weight;\n  };\n\n  typedef\
  \ boost::adjacency_list<boost::listS, boost::vecS,\n    boost::undirectedS, boost::no_property,\n\
  \    edge_properties> graph;\n\n  graph g{edges.begin(), edges.end(), 4};\n\n  graph::edge_iterator\
  \ it, end;\n  boost::tie(it, end) = boost::edges(g);\n  g[*it].weight = 2;\n  g[*++it].weight\
  \ = 1;\n  g[*++it].weight = 1;\n  g[*++it].weight = 1;\n\n  boost::array<int, 4>\
  \ directions;\n  boost::dijkstra_shortest_paths(g, bottomRight,\n    boost::predecessor_map(directions.begin()).\n\
  \    weight_map(boost::get(&edge_properties::weight, g)));\n\n  int p = topLeft;\n\
  \  while (p != bottomRight)\n  {\n    std::cout << p << '\\n';\n    p = directions[p];\n\
  \  }\n  std::cout << p << '\\n';\n}\n```\n\n示例 31.12, “使用 `dijkstra_shortest_paths()`\
  \ 的自定义属性”\") 工作方式与之前的一个，并显示相同的数字，但它使用用户定义的类 `edge_properties`，而不是预定义的属性。\n\n`edge_properties`\
  \ 定义了成员变量 `weight` 用来存储边的权重。如果需要其他属性，可以添加更多成员变量。\n\n如果你使用边的描述符作为图的索引，就可以访问用户定义的属性。因此，图的行为就像一个数组。你可以从\
  \ `boost::edges()` 返回的边迭代器中获取描述符。这样，就可以为每条边分配权重。\n\n为了让 `boost::dijkstra_shortest_paths()`\
  \ 知道权重存储在 `edge_properties` 的 `weight` 中，必须传递另一个命名参数。这是通过 `weight_map()` 完成的。注意，`weight_map()`\
  \ 是从 `boost::predecessor_map()` 返回的对象的成员函数。还有一个名为 `boost::weight_map()` 的非立函数。如果你需要传递多个命名参数，必须在第一个命名参数（即由非立函数返回的那个）上调用成员函数。这样，所有参数都会被封装到一个对象中，然后传递给算法。\n\
  \n为了告诉 `boost::dijkstra_shortest_paths()` `edge_properties` 中的 `weight` 包含权重，需要传递该属性的指针。它不是直接传递给\
  \ `weight_map()` 的，而是通过 `boost::get()` 创建的对象传递的。现在调用完成了，`boost::dijkstra_shortest_paths()`\
  \ 知道应该访问哪个属性来获取权重。\n\n示例 31.13. 在图定义时初始化自定义属性\n\n```cpp\n#include <boost/graph/adjacency_list.hpp>\n\
